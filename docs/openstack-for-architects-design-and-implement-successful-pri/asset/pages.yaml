- pgno: 21
  md: 'The second reason that the term instance is useful is that virtual machines
    in OpenStack do not typically have the same life cycle as they do in traditional
    virtualization. While we might expect virtual machines to have a multiyear life
    cycle like physical machines, we would expect instances to have a life cycle measured
    in days or weeks. Virtual machines are backed up and recovered, whereas instances
    are rescued or evacuated. A resize operation on a virtual machine might happen
    without downtime, while a resize operation on a instance is a new deployment and
    a migration. This is due to the architectural differences between OpenStack and
    traditional virtual machines and their hypervisors. Legacy virtualization platforms
    assume resizing and modifying behaviors in-place, cloud platforms such as OpenStack
    expect redeployment of virtual machines or adding additional capacity through
    additional instances, not adding additional resources to existing virtual machines.
    Even the term **migration** has a different meaning for an instance than we would
    expect for a virtual machine.


    The third reason that we find it useful to use the term instance is that the Compute
    service has evolved over the years to launch a number of different types of compute.
    Some OpenStack deployments may only launch physical machines, whereas others may
    launch a combination of physical, virtual, and container-based instances. The
    same construct applies regardless of the compute provider.


    Some of the lines between virtual machines and instances are becoming more blurred
    as more enterprise features are added to the OpenStack Compute service. Later
    on, we''ll discuss some of the ways in which we can launch instances which act
    more like virtual machines for more traditional compute workloads.


    # Object Storage


    Ephemeral backing storage for compute instances is provided by the Nova service.
    This storage is referred to as **ephemeral** because its life cycle coterminates
    with the life cycle of the compute instance. That is, when an instance is terminated,
    the ephemeral storage associated with the instance is deleted from the compute
    host on which it resided. The first kind of persistent storage provided in the
    OpenStack system was object storage, based on the S3 service available in the
    Amazon Web Service environment.


    Object Storage is provided by the Swift service in OpenStack. Just as Nova provides
    an EC2-compatible compute API, Swift provides an S3-compatible object storage
    API. Applications which are written to run on the Amazon EC2 service and read
    and write their persistent data to the S3 Object Storage service do not need to
    be rewritten to run on an OpenStack system.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'A number of third-party applications provide an S3 or Swift-compatible API
    and may be substituted for Swift in a typical OpenStack deployment. These include
    open source object stores such as Gluster or Ceph or proprietary ones such as
    Scality or Riak. The Swift service is broken down into a few components and third-party
    applications may use the “Proxy” component of Swift for API services and implement
    only a backend or may entirely replace the Swift service. All OpenStack-compatible
    object stores will consume the tenant model of OpenStack and accept Keystone tokens
    for authentication.


    # Block storage


    Traditional persistent storage is provided to OpenStack workloads via the Cinder
    block storage component. The life cycle of Cinder volumes is maintained independent
    of compute instances, and volumes may be attached or detached to one or more compute
    instances to provide a backing store for filesystem-based storage.


    OpenStack ships with a reference implementation of Cinder, which leverages local
    storage on the host and utilizes LVM as well as the ability to use iSCSI to share
    a block device attached to a Cinder storage node that can use its storage for
    instances. This implementation lacks high availability and is typically only used
    in test environments. Production deployments tend to leverage a software-based
    or hardware-based block storage solution such as Ceph or NetApp, chosen based
    on performance and availability requirements.


    # Network


    The last of the foundational services in OpenStack is Neutron, the Network service.
    Neutron provides an API for creating ports, subnets, networks, and routers. Additional
    network services such as firewalls and load balancers are provided in some OpenStack
    deployments.


    As with Cinder, the reference implementation, based on Open vSwitch, is typically
    used in test environments or smaller deployments. Large-scale production deployments
    will leverage one of the many available software-based or hardware-based SDN solutions
    which have Neutron drivers. These solutions range from open source implementations
    such as Juniper''s OpenContrail and Midokura''s MidoNet to proprietary solutions
    such as VMware''s NSX platform.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Introducing OpenStack


    As mentioned earlier, there are still some OpenStack Architects who chose to deploy
    clouds based on the Network service included with Nova instead of the neutron
    component. This decision is largely made based on the lack of distributed routing
    capabilities in the Neutron reference plugin. In the current reference implementation,
    Neutron simply uses a centralized node for routing with a passive node as its
    highly available failover. Newer versions of OpenStack are now supporting a **Distributed
    Virtual Router (DVR)** reference implementation, however, additional performance
    testing is required in order to ascertain whether this model provides significant
    performance increases. However, as the Nova network implementation has become
    deprecated and additional capabilities have matured within the Neutron reference
    implementation, more and more deployments are using Neutron.


    # Common OpenStack use cases


    In spite of immense interest, huge investment, and public success, we''ve seen
    a number of cases where well-intentioned OpenStack projects fail or are at least
    perceived as a failure by the people who have funded them. When OpenStack projects
    fail, the technology itself is rarely the root cause. Thomas Bittman at Gartner
    noticed this trend and wrote an influential blog post entitled *Why are Private
    Clouds Failing?* in September 2014.


    Bittman''s findings echo many of our experiences from the field. In short, the
    reason that most private cloud projects fail is that improper expectations were
    set from the beginning and the business goals for the cloud weren''t realized
    by the end result.


    First and foremost, OpenStack deployments should be seen as an investment with
    returns and not a project to reduce operational costs. While we''ve certainly
    seen dramatic reductions in operational workloads through the automation that
    OpenStack provides, it is difficult to accurately quantify those reductions in
    order to justify the operational investment required to run an efficient cloud
    platform. Organizations that are entirely focused on cutting costs through automation
    should first look at automating existing virtual environments instead of deploying
    new environments.


    We''ve also seen a lot of projects which had poorly quantified goals. OpenStack
    is an enabler of use cases and not an IT panacea. If the use cases are not agreed
    upon before investment in the platform begins, it will prove very difficult to
    justify the investment in the end. This is why the role of the Architect is so
    critical in OpenStack deployments-it is their job to ensure that concrete requirements
    are written upfront so that all of the stakeholders can quantify the success of
    the platform once deployed.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Introducing OpenStack


    With that in mind, let''s take a look at some typical use cases for OpenStack
    deployments.


    # Public hosting


    As we mentioned before, OpenStack was originally created with code contributions
    from NASA and Rackspace. NASA''s interest in OpenStack sprang from their desire
    to create a private elastic compute cloud while the primary goal for Rackspace
    was to create an open source platform that could replace their public shared hosting
    infrastructure. As of April 2015, the “Rackspace Public Cloud” offering had been
    ported to OpenStack and had passed the **OpenStack Powered Platform** certification.


    The Rackspace implementation offers both Compute and Object Storage services,
    but some implementations may choose to offer only Compute or Object Storage and
    receive certifications for those services. DreamHost, another public OpenStack-based
    cloud provider, for example, has chosen to break their managed services down into
    **DreamCompute** and **DreamObjects**, which implement the services separately.
    The DreamObjects service was implemented and offered first as a compliment to
    DreamHost''s existing shared web hosting and the DreamCompute service was introduced
    later.


    Most public hosting providers focus primarily on the Compute service and many
    do not yet offer software-defined networking via the Neutron network service (DreamCompute
    being a notable exception). Architects of hosting platforms will focus first on
    tenancy issues, secondly on chargeback issues, and lastly on scale. We''ve seen
    some amazing work done around instrumentation and monitoring of public clouds
    as well; refer to Rackspace''s work around StackTach for more information on that
    at the following URL:


    ```

    https://media.readthedocs.org/pdf/stacktach/latest/stacktach.pdf

    ```


    # High-performance compute


    The first production deployment of OpenStack outside NASA and Rackspace was at
    a Canadian not-for-profit organization named Cybera. Cybera deployed OpenStack
    as a technology platform in 2011 for its DAIR program, which provides free compute
    and storage to Canadian researchers, entrepreneurs, and small businesses.


    Architects at Cybera, NASA, and CERN have all commented on how their services
    have much of the same concerns as in the public hosting space. They provide compute
    and storage resources to researchers and don''t have much insight into how those
    resources will actually be used. Thus, concerns about secure multitenancy will
    apply to these environments just as much as they do in the hosting space.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'HPC clouds will have an added focus on performance, though. While hosting providers
    will look to economize on commodity hardware, research clouds will look to maximize
    performance by configuring their compute, storage, and network hardware to support
    high volume and throughput operations. Where most clouds will work best by growing
    low-to-mid range hardware horizontally with commodity hardware, high-performance
    clouds tend to be very specific about the performance profiles of their hardware
    selection. Cybera has published performance benchmarks comparing its DAIR platform
    to EC2. Architects of research clouds may also look to use hardware pass-through
    capabilities or other low-level hypervisor features to enable specific workloads.


    # Rapid application development


    Over the last couple of years, a third significant use case has emerged for OpenStack-enterprise
    application development environments. While public hosting and high-performance
    Compute implementations may have huge regions with hundreds of compute nodes and
    thousands of cores, enterprise implementations tend to have regions of 20 to 50
    compute nodes. Enterprise adopters have a strong interest in software-defined
    networking.


    The primary driver for enterprise adoption of OpenStack has been the increasing
    use of continuous integration and continuous delivery in the application development
    workflow. A typical Continuous Integration and Continuous Delivery (CI/CD) workflow
    will deploy a complete application on every developer commit which passes basic
    unit tests in order to perform automated integration testing. These application
    deployments live as long as it takes to run the unit tests and then an automated
    process tears down the deployment once the tests pass or fail. This workflow is
    easily facilitated with a combination of OpenStack Compute and Network services.
    Indeed, 92% of OpenStack users reported using their private clouds for CI/CD workflows
    in the Kilo user survey.


    While Architects of hosting or High-performance Computing (HPC) clouds spend a
    lot of time focusing on tenancy and scale issues, Architects of enterprise deployments
    will spend a lot of time focusing on how to integrate OpenStack compute into their
    existing infrastructure. Enterprise deployments will frequently leverage existing
    service catalog implementations and identity management solutions. Many enterprise
    deployments will also need to integrate with existing IPAM and asset tracking
    systems.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Network Function Virtualization


    An emerging and exciting use case for OpenStack is **Network Function Virtualization
    (NFV)**. NFV solves a problem particular to the telecommunications industry, which
    is in the process of replacing the purpose-built hardware devices which provide
    network services with virtualized appliances which run on commodity hardware.
    Some of these services are routing, proxies, content filtering as well as packet
    core services and high-volume switching. Most of these appliances have intense
    compute requirements and are largely stateless. These workloads are well-suited
    for the OpenStack compute model.


    NFV use cases typically leverage hardware features which can directly attach compute
    instances to physical network interfaces on compute nodes. Instances are also
    typically very sensitive to CPU and memory topology (NUMA) and virtual cores tend
    to be mapped directly to physical cores. These deployments focus heavily on the
    Compute service and typically don''t make use of OpenStack services such as Object
    Storage or Orchestration.


    Architects of NFV solutions will focus primarily on virtual instance placement
    and performance issues and less on tenancy and integration issues.


    # Drafting an initial deployment plan


    OpenStack is designed to be used at scale. Many IT projects might comprise a few
    physical assets deployed within an existing network, storage, and compute landscape,
    but OpenStack deployments are, by definition, new network, storage, and compute
    landscapes. Any project of this size and scope requires significant coordination
    between different teams within an IT organization. This kind of coordination requires
    careful planning and, in our experience, a lot of documentation.


    # The role of the Architect


    This book is written to provide best practices for a relatively new role within
    many organizations--the Cloud Architect. The Cloud Architect''s primary function
    is to take business requirements for Infrastructure or Platform as a Service and
    design an Infrastructure or Platform as a Service solution which meets those requirements.
    This requires an in-depth knowledge of the capabilities of the infrastructure
    software paired with competency in network and storage architecture.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'The typical Cloud Architect will have a background in compute and will lean
    heavily on the Network and Storage Architects within an organization to round
    out their technical knowledge. Since OpenStack is based on the Linux operating
    system, most OpenStack Architects will have a deep knowledge of that platform.
    But as we mentioned earlier, OpenStack is typically delivered as an API and OpenStack
    Architects will need to have fluency in application development as well.


    OpenStack Architects are responsible first and foremost for authoring and maintaining
    a set of design and deployment documentation. It''s difficult to describe an ocean
    if you''ve never seen one, so this book will walk you through implementation of
    the documentation that you will create as you create it.


    # The design document


    The first document that we will create is the design document. This may be called
    something different in your organization, but the goal of the design document
    is to explain the reasoning behind all of the choices that were made in the implementation
    of the platform. The format may vary from team to team, but we want to capture
    the following points:


    +   - **Background**: This is the history behind the decision to start the project.
    If the document will only be consumed internally, this can be pretty short. If
    it''s going to be consumed externally, this is an opportunity to provide organizational
    context for your vendors and partners.

    +   - **Executive summary**: This is really just a detailed summary of the entire
    document. Typically, this part of the deliverable will be used by managers, technology,
    and business leaders to understand the business impact of the overall recommendation.
    Requirements and the resulting architecture should be summarized.

    +   - **Requirements**: This is the meat of the document. Requirements can be
    in whatever format is acceptable for your project management team. We prefer the
    “user story” format and will use that in the examples in this book.

    +   - **Physical architecture**: This is an explanation of roles and physical
    machines which take those roles. This should include a network diagram.

    +   - **Service architecture**: This is a summary of available services and their
    relationships. This section should include a service diagram.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   - **Tenant architecture:** A section should be included which describes
    the expected landscape inside the cloud. This includes things such as available
    compute flavors, images, identity management architecture, and IPAM or DDI.

    +   - **Roadmap:** This section is optional and often lives in another document.
    It''s an opportunity to identify areas for improvement in future releases of the
    platform.


    The design document often goes through a number of revisions as the project is
    developed. An important step at the end of each iteration of the platform is to
    reconcile any changes made to the platform with the design document.


    Beware of scope creep in the design document. This artifact has a tendency to
    turn into documentation on how OpenStack works. Remember to focus on explaining
    the decisions you made instead of what all the available options at the time were.


    # The deployment plan


    Every implementation of OpenStack should start with a deployment plan. The design
    document describes what''s being deployed and why, while the deployment plan describes
    how. Like the design document, the content of a deployment plan varies from organization
    to organization. It should at least include the following:


    +   - **Hardware:** This is a list of the compute, storage, and network hardware
    available for the deployment.

    +   - **Network addressing:** This is a table of IP and MAC addresses for the
    network assets in the deployment. For deployments of hundreds of compute nodes,
    this should probably be limited to a set of VLANs and subnets available for the
    deployment.

    +   - **Deployment-specific configuration:** We''ll assume that the configuration
    of the OpenStack deployment is automated. These are any settings that an engineer
    would need to adjust before launching the automated deployment of the environment.

    +   - **Requirements:** These are things that need to be in place before the deployment
    can proceed. Normally, this is hardware configuration, switch configuration, LUN
    masking, and so on.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Introducing OpenStack


    A good deployment plan will document everything that an engineering team needs
    to know to take the design document and instantiate it in the physical world.
    One thing that we like to leave out of the deployment plan is step-by-step instructions
    on how to deploy OpenStack. That information typically lives in an Installation
    Guide, which may be provided by a vendor or written by the operations team.


    # Your first OpenStack deployment


    In our experience, almost all organizations approach OpenStack with the following
    three steps:


    +   1. An individual, usually a Linux or Cloud Architect, installs OpenStack on
    a single machine to verify that the software can be deployed without too much
    effort.

    +   2. The Architect enlists the help of other team members, typically Network
    and Storage Architects or Engineers to deploy a multiple-node installation. This
    will leverage some kind of shared ephemeral or block storage.

    +   3. A team of Architects or Engineers craft the first deployment of OpenStack
    which is customized for the organization’s use cases or environmental concerns.
    Professional services from a company such as Red Hat, Mirantis, HP, IBM, Canonical
    or Rackspace are often engaged at this point in the process.


    From here on out, it''s off to the races. We''ll follow a similar pattern in this
    book. In this first chapter, we''ll start with the first step-the “all-in-one”
    deployment.


    # Writing the initial deployment plan


    Taking the time to document the very first deployment might seem a bit obsessive,
    but it provides us with the opportunity to begin iterating on the documentation
    that is the key to successful OpenStack deployments. We''ll start with the following
    template.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Hardware


    The initial deployment of OpenStack will leverage a single commodity server, a
