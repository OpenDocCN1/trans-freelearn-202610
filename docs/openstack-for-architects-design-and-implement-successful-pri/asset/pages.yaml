- pgno: 105
  md: "Selecting **Console Output** should show the same error that we received when\
    \ we ran the command on the command line. Now let's set about configuring the\
    \ database server to apply our profile and class so that the test will pass.\n\
    \n# Assigning the first role to a system\n\nTo pull it all together, we'll start\
    \ with a unconfigured system, install and configure the Puppet agent, and have\
    \ it pull down the configuration that we've defined. Let's start by assigning\
    \ the role to the system on the Puppet master.\n\nAs the root user on the CI server,\
    \ create a `site.pp` file in `/etc/puppet/manifests`, which maps the unconfigured\
    \ host to the role. For example, if my database host is named `db.example.com`,\
    \ the following stanza will work:\n\n```\nnode \"db.example.com\" {\n  include\
    \ role::database\n}\n```\n\nOn the host itself, install the RDO repository and\
    \ the puppet agent with the following commands:\n\n```\n# yum install -y https://rdoproject.org/repos/rdo-release.rpm\n\
    # yum install -y puppet\n```\n\nConfigure the system to use our CI server as its\
    \ Puppet master. For example, if our CI server is `jenkins.example.com`, enter:\n\
    \n```\n# puppet config set server 'jenkins.example.com' --section agent\n```\n\
    \nFinally, do an initial Puppet run to set up the certificates:\n\n```\n# puppet\
    \ agent -t\n```\n\nThis should show the error `no certificate found and waitforcert\
    \ is disabled`.\n\nLog into the CI server as root and approve the certificate\
    \ with the following command:\n\n```\n# puppet cert sign db.example.com\n```\n\
    \nYou will receive a notice that the certificate has been signed and the request\
    \ has been removed.\n\nBack on the database server, perform another Puppet run\
    \ to pull the configuration:\n\n```\n# puppet agent -t\n```"
  merge: -1
  img_proc: true
- pgno: 106
  md: "This will generate a lot of output as the system downloads all of the Puppet\
    \ modules from the master. You should see the system download, install, and configure\
    \ the MySQL databases for OpenStack. Finally, run a build from Jenkins again to\
    \ see it succeed.\n\n# Installing Keystone\n\nLet's iterate on the current environment,\
    \ adding another profile and role. Now that we have a database available, install\
    \ the first OpenStack service, Keystone. First write a unit test. Our test will\
    \ ensure that we can get a token from Keystone using the admin username and password\
    \ that we specified in the Packstack answer file. This can be done with a curl\
    \ command. Create a file named test_keystone.sh under the test directory in our\
    \ Git repository:\n\n```\n$ cd ~/openstack/test/\n$ vi test_keystone.sh\n```\n\
    \nUse the following content as an example, substituting your password for the\
    \ password of the demo user (secret) and the hostname of your first controller\
    \ for controller01:\n\n```\ncurl -i \\\n  -H \"Content-Type: application/json\"\
    \ \\\n  -d '\n  { \"auth\": {\n    \"tenantId\": \"demo\",\n    \"passwordCredentials\"\
    : {\n      \"userId\": \"demo\",\n      \"password\": \"secret\"\n    }\n  }\n\
    }' \\\n  http://controller01:5000/v2/auth/tokens ; echo\n```\n\nNow run the script.\
    \ It should fail with a Connection refused error.\n\nTo make the test pass, follow\
    \ a process similar to the one we used to create the database profile. Create\
    \ a file named puppet/modules/openstack-profile/manifests/keystone.pp in the openstack\
    \ repository with the following contents:\n\n```\nclass profile::keystone {\n\
    \  include '::packstack::apache'\n  include '::packstack::keystone'\n}\n```"
  merge: -1
  img_proc: true
- pgno: 107
  md: "As before, create a role named controller and assign the keystone profile to\
    \ the role. Create a file named puppet/modules/openstack-role/manifests/controller.pp\
    \ with the following contents:\n\n```\nclass role:controller {\n  include profile::keystone\n\
    }\n```\n\nCommit and push these files into the repository:\n\n```\n$ git add puppet/modules/openstack-profile/manifests/keystone.pp\n\
    $ git add puppet/modules/openstack-role/manifests/controller.pp\n$ git commit\
    \ -m 'adding a controller role and keystone profile'\n$ git push\n```\n\nRun the\
    \ build from Jenkins again to push the files to the Puppet master. We haven't\
    \ configured Jenkins to run the new test yet, so the build should succeed, even\
    \ though the test would fail.\n\nOnce again, take an unassigned machine and assign\
    \ it the role of controller based on the hostname. In this example, we'll assign\
    \ the role to a machine named controller01.example.com. Edit /etc/puppet/manifests/site.pp\
    \ on the CI server and add the following stanza:\n\n```\nnode \"controller01.example.com\"\
    \ {\n  include role::controller\n}\n```\n\nOn the unconfigured host named controller01.example.com,\
    \ install the Puppet agent and set the Puppet master:\n\n```\n# yum install -y\
    \ https://rdoproject.org/repos/rdo-release.rpm\n# yum install -y puppet\n# puppet\
    \ config set server 'jenkins.example.com' --section agent\n# puppet agent -t\n\
    ```\n\nOnce again, you'll need to approve the certificate on the Puppet master:\n\
    \n```\n# puppet cert sign controller01.example.com\n```"
  merge: -1
  img_proc: true
- pgno: 108
  md: 'On the second Puppet run, Keystone will be installed and configured. Enable
    the Keystone test that we wrote as a part of the commit in Jenkins by adding a
    new build step such as the following:


    ![](img/2f752555f69992669defa8b25e6dcee9_108_0.png)


    Run the build and ensure that the test passes now that Keystone is up-and-running
    on the first controller.


    # Fully automating the pipeline


    Until now, we''ve been manually running both the Jenkins builds and the Puppet
    runs. This has allowed us to ensure that we''re running the tests after the Puppet
    runs have finished. There are a few different ways to remove these two manual
    steps in the pipeline.


    For the Jenkins build, Jenkins can either be configured to poll the source code
    repository every so often, or Git can be configured to reach out to Jenkins and
    trigger a build when new code is pushed. Jenkins can be configured to build either
    when the code is pushed to any branch or only when the code is pushed to a particular
    branch. This can allow you to ignore work in feature branches and only perform
    runs on merges to a master, or it can allow you to ignore merges and only perform
    runs on feature branches. Tools such as Stash and Bamboo provide for even easier
    integration.


    Managing Puppet runs is a little more complex. By default, Puppet will run every
    30 minutes or so, pick up changes from the Puppet master, and apply them. While
    this makes sense for large environments which want to spread out the runs for
    performance, it can be frustrating to wait a half an hour for your environment
    to pick up the changes you just pushed to Git. There are two possible solutions
    to this problem. First, you can run Puppet on the hosts as a part of the test
    process. Tools such as Ansible can make this relatively simple. Second, you can
    decrease the interval between runs for your development environments. This is
    controlled by the runinterval setting in the main section of /etc/puppet/puppet.conf.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'Once you''ve fully automated the pipeline, you''ll want to add some kind of
    delay between the time that you push the changes to the Puppet master and the
    time that you run the unit tests. This will allow hosts to pick up the changes
    and implement them. For example, if you set the `runinterval` setting to 5 minutes
    and you expect changes to be applied within 5 minutes, you might add a build step
    in the Jenkins job which sleeps for 10 minutes before executing unit tests.


    # Summary


    In this chapter, we talked about how organizations are using modern software development
    techniques to improve the quality of their OpenStack deployments. We built a simple
    deployment pipeline using Puppet, Git, and Jenkins and we used it to deploy and
    test two components of the OpenStack infrastructure. From here, additional components
    can be installed, configured, and tested in a controlled fashion.


    This can seem like a lot of extra effort for folks who are used to running Packstack
    and getting an environment up quickly. In our experience, though, without the
    proper infrastructure for managing and testing changes, these deployment become
    unwieldy at scale. As a reminder, the three basic tenets that we’re following
    are:


    +   - Small, manageable changes, not large upgrade cycles

    +   - Test-driven development

    +   - Continuous deployments


    Because most organizations will already have some experience and tooling around
    these principles in software development, deployment pipelines vary greatly from
    organization to organization. A great example infrastructure to look at is the
    one that the OpenStack Foundation itself uses to test changes. More information
    on that pipeline is available at


    ```

    http://docs.openstack.org/infra/

    ```'
  merge: -1
  img_proc: true
