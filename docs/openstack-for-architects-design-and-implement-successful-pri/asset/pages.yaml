    This deployment provides compute capacity for 60 m1.medium instances or 30 m1.large
    instances.


    Change the specifications in the table to meet your deployment. It''s important
    to specify the expected capacity in the deployment document. For a basic rule
    of thumb, just divide the amount of available system memory by the instance memory.
    We''ll talk more about accurately forecasting capacity in a later chapter.


    # Network addressing


    There is one physical provider network in this deployment. SDN is provided in
    the tenant space by Neutron with the OVS ML2 plugin.


    | Hostname | MAC | IP |

    |---|---|---|

    | openstack | 3C:97:0E:BF:6C:78 | 192.168.0.10 |


    Change the network addresses in this section to meet your deployment. We''ll only
    use a single network interface for the all-in-one installation.


    # Configuration notes


    This deployment will use the RDO all-in-one reference architecture. This reference
    architecture uses a minimum amount of hardware as the basis for a monolithic installation
    of OpenStack, typically only used for testing or experimentation. For more information
    on the all-in-one deployment, refer to https://www.rdoproject.org/install/quickstart/.


    For the first deployment, we''ll just use the RDO distribution of the box. In
    later chapters, we''ll begin to customize our deployment and we''ll add notes
    to this section to describe where we''ve diverged from the reference architecture.'
