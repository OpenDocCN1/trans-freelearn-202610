  ## 使用新配置安装 OpenStack


  在第 1 章 Introducing OpenStack 中，我们使用 allinone 选项运行 packstack，采用默认设置进行测试安装。Packstack
  能够将默认选项保存到配置文件中，然后可以用文本编辑器编辑。我们将在本章中使用此功能来创建可重用的配置。此外，packstack 能够通过 SSH 将生成的 puppet
  清单应用到远程机器上。为此工作，你需要能够从控制器机器（我们将在此运行 packstack）通过 SSH 访问部署中的其他机器。在运行 packstack 之前，先测试一下是个好主意。


  首先，开始在部署计划的硬件表中概述的四台服务器上安装全新的操作系统副本。每个系统在部署前都需要配置网络表中指定的网络接口，并且部署计划中指定的所有要求也需要满足（即
  NetworkManager 需要被禁用，并且 RDO 仓库需要被启用）。


  在云控制器（controller1）上执行以下命令以生成答案文件。我们将使用它作为部署配置的模板：


  ```bash

  # packstack --gen-answer-file=packstack-answers.txt

  ```


  接下来，编辑 packstack-answers.txt 文件，更新以下参数：


  | Parameter | Example | Description |

  |---|---|---|

  | `CONFIG_CONTROLLER_HOST` | `192.168.0.10` | 管理网络上云控制器的 IP 地址 |

  | `CONFIG_COMPUTE_HOSTS` | `192.168.0.100, 192.168.0.101` | 管理网络上计算节点的 IP 地址 |

  | `CONFIG_NETWORK_HOSTS` | `192.168.0.10` | 管理网络上云控制器的 IP 地址 |

  | `CONFIG_AMQP_HOST` | `192.168.0.10` | 管理网络上云控制器的 IP 地址 |

  | `CONFIG_MARIADB_HOST` | `192.168.0.10` | 管理网络上云控制器的 IP 地址 |

  | `CONFIG_NEUTRON_OVS_BRIDGE_MAPPINGS` | `vlan100:br-vlan100` | 提供者网络的 neutron 网络到
  OVS 桥的映射 |

  | `CONFIG_NEUTRON_OVS_BRIDGE_IFACES` | `br-vlan100:eth0.100` | 提供者网络的 OVS 桥到物理接口的映射
  |

  | `CONFIG_NEUTRON_OVS_TUNNEL_IF` | `eth0.200` | 用于租户网络的接口 |

  | `CONFIG_PROVISION_DEMO_FLOATRANGE` | `10.0.0.128/25` | 提供者网络上使用的浮动 IP 范围 |


  > 关于 Neutron 设置的快速说明，因为它们一直让我们感到困惑。隧道接口设置由 puppet 模块用来确定 Open vSwitch 插件配置文件中的 `local_ip`
  设置。桥映射设置与 Open vSwitch 插件配置文件中的 `bridge_mappings` 相同。然而，桥接口设置并不影响插件配置。相反，它被 puppet
  模块用来确定如何构造由 `bridge_mappings` 设置引用的 Open vSwitch 桥。如果你打算手动构造桥，可以安全地省略该设置。


  现在，使用新配置运行 `packstack`：


  ```bash

  # packstack --answer-file=packstack-answers.txt

  ```


  安装完成后，应使用上一章相同的步骤验证 OpenStack 部署。可以通过查询 Nova 和 Neutron 服务来验证服务分布：


  ```bash

  # nova service-list

  ```


  ![](img/2f752555f69992669defa8b25e6dcee9_55_0.png)


  此命令将输出所有正在运行的计算服务的表格、它们运行的主机以及其状态。输出应显示 `nova-cert`、`nova-consoleauth`、`nova-scheduler`
  和 `nova-conductor` 服务在 `controller1` 上运行，以及 `nova-compute` 服务在 `compute1` 和 `compute2`
  上运行。


  ```bash

  # neutron agent-list

  ```


  此命令将输出所有正在运行的网络服务的类似表格。输出应显示 Metadata、L3 和 DHCP 代理在 `controller1` 上运行，以及 Open vSwitch
  代理在 `controller1`、`compute1` 和 `compute2` 上运行。


  ## Summary


  OpenStack 部署经常被比作雪花。有如此多不同的方式来组合各种受支持的计算、存储和网络配置，以至于没有任何一个部署与另一个部署相似。这一类比经常在为 OpenStack
  提供商业支持的公司中因挫败感而被使用——部署的多样性使得支持客户变得极其困难。我们合作的许多客户也表达了对众多选项的沮丧感。另一方面，大多数运行 OpenStack
  一段时间的人都认识到拥有如此多选项的价值。它允许他们在统一的接口下不断为客户提供新的服务和功能。


  在本章中，我们逐步介绍了 OpenStack 中的三大技术领域——计算、网络和存储。在每个领域，我们广泛描述了可用的选择，并提供了一些关于如何进行决策过程的指导。我们还扩展了部署文档和部署本身，以纳入本章涵盖的一些信息。此基本部署可以扩展，并且应提供足够的差异性，以便在做出购买决定之前在实验室中测试不同的计算、网络和存储技术。


  在下一章中，你将了解如何通过添加高可用性软件使此简单部署更加健壮。






  ## 参考资料


