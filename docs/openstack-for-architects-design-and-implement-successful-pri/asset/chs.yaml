- "## 规划失败（和成功）\n\n在本章中，我们将逐步介绍如何设计云架构以避免硬件和软件故障。OpenStack 控制平面由 Web 服务、应用服务、数据库服务和消息总线组成。这些层都需要不同的方式来实现高可用性，并且一些组织可能已经为每个服务定义了架构。我们看到客户要么重用这些现有模式，要么采用特定于\
  \ OpenStack 平台的新模式。这两种方法都合理，具体取决于部署规模。许多成功的部署实际上实现了这两种方法的混合。\n\n例如，如果你的组织已有一种受支持的高可用\
  \ MySQL 数据库模式，你可能会选择该模式而不是本章中概述的模式。如果你的组织没有高可用 MongoDB 的模式，你可能需要设计一个新的模式。\n\n本章分为以下主题：\n\
  \n- 高可用控制平面策略和模式\n- OpenStack 区域、单元和可用区\n- 更新设计文档并实施设计\n\n## 构建高可用控制平面\n\n在 Folsom\
  \ 和 Grizzly 时代，为 OpenStack 控制平面设计高可用性（H/A）方案有点像黑魔法。OpenStack 高可用性指南最初迭代中推荐的许多技术都特定于\
  \ Ubuntu Linux 发行版，在基于 Red Hat Enterprise Linux 的发行版上不可用。\n\n当时，标准的集群资源管理器 Pacemaker\
  \ 未得到 Red Hat 支持。因此，使用 Ubuntu 的架构师可能会使用一套软件，使用 CentOS 或 RHEL 的可能会使用另一套软件，而使用 Rackspace\
  \ 或 Mirantis 发行版的可能会使用又一套软件。然而，如今技术栈已经趋于一致，H/A 模式在很大程度上与所使用的发行版无关。\n\n### 关于失败和成功\n\
  \n当我们设计高可用的 OpenStack 控制平面时，我们要缓解两种不同的场景：\n\n- 第一种是故障。当物理硬件损坏时，我们希望确保在无需人工干预的情况下恢复并继续为用户提供服务。\n\
  - 第二种也许更重要的场景是成功。\n\n软件系统在人类开始使用之前总是按设计和测试的方式工作。虽然我们的自动化测试套件会尝试启动合理数量的虚拟对象，但人类保证会尝试启动不合理数量的对象。此外，我们处理过的许多\
  \ OpenStack 项目都远远超出了预期规模，需要即时扩展。\n\n我们早期参与的一个基于 Havana 的云使用了基于内存的 Fibre Channel\
  \ 存储阵列作为 Cinder 后端。我们对平台的所有自动化测试都成功了，但在移交后一周内，我们被告知操作员无法启动虚拟实例。我们的自动化单元测试继续成功，但操作员进行的手动测试持续失败。困惑之下，我们与操作员坐下来查看他们做了什么不同的事情。在\
  \ Horizon UI 中，有一个选项可以同时通过单个 API 命令启动多个实例。操作员的租户配额为 100 个实例，他们在测试平台时指定了 100 个实例。前\
  \ 8 个会成功，但最后 92 个会失败。事实证明，后端只能执行八个并发操作，超过这个数量就会出错。我们的单元测试会并发创建多个实例，但从不超过八个，因此我们从未发现该错误。\n\
  \n在设计 OpenStack 云时，我们需要为几种不同的成功场景做计划。\n\n首先，我们需要为实例数量的增长做计划。这相对直接。每个额外实例都会增加数据库的大小，增加\
  \ Ceilometer 中的计量数据，最重要的是，它会增加计算节点的数量。添加计算节点和报告会给消息总线带来压力，而消息总线通常是 OpenStack 区域或单元规模的限制因素。我们在讨论将\
  \ OpenStack 云划分为区域、单元和可用区时将更详细地讨论这一点。\n\n我们需要计划的第二种增长类型是 API 调用的增加。支持持续集成（CI）开发环境的部署可能（相对）计算需求较小，但\
  \ CI 通常会快速启动和拆除环境。这会产生大量 API 流量，进而产生大量数据库和消息流量。\n\n在托管环境中，最终用户也可能手动产生大量 API 流量，因为他们启动和停止实例，或手动检查已启动部署的状态。虽然服务目录可能会定期检查其已启动实例的状态，但人类倾向于以不规律的方式刷新浏览器。对平台的自动化测试往往严重低估了这种行为。\n\
  \n考虑到这一点，我们采用的任何模式都需要满足以下要求：\n\n- API 服务必须在控制平面硬件故障期间保持可用\n- 提供 API 服务的系统必须能够水平扩展（理想情况下是弹性扩展）以应对不可预见的需求\n\
  - 数据库服务必须能够垂直或水平扩展以应对平台不可预见的增长\n- 消息总线可以根据所选技术进行垂直或水平扩展\n\n最后，每个系统都有其限制。这些限制应在架构文档中定义，以便容量规划能够考虑它们。在某个时刻，控制平面已扩展到其极限，应部署第二个控制平面以提供额外容量。虽然\
  \ OpenStack 设计为大规模可扩展，但它并非设计为无限可扩展。\n\n## 控制平面的高可用性模式\n\n目前在 OpenStack 部署中，常用的实现控制平面高可用的方法有三种。\n\
  \n第一种是最简单的。采用我们在第 2 章《设计云》中部署的单节点云控制器，对其进行虚拟化，然后使用 VMware 集群或 Linux 集群使虚拟机高可用。虽然此选项简单且能提供故障场景，但它只能垂直扩展（不能水平扩展），并且不能提供成功场景。因此，它仅应在计算节点数量有限且\
  \ API 调用数量有限的区域中使用。实际上，这种方法并不常用，我们在此不再赘述。\n\n第二种模式提供 H/A，但不提供水平可扩展性。这是 OpenStack\
  \ 高可用性指南中描述的“主/备”场景。在 Red Hat，我们在 Folsom 和 Grizzly 部署中使用了这种方法很多，但从 Havana 开始就放弃了它。它与前面描述的虚拟化解决方案类似，但不是依赖\
  \ VMware 集群或 Linux 集群来重启失败的虚拟机，而是依赖 Linux 集群在第二个云控制器节点上重启失败的服务，该节点也运行相同的服务子集。此模式不能为\
  \ Web 层提供成功场景，但仍可用于数据库和消息层。一些网络服务可能仍需要作为主/备提供。\n\n\n\n\n\nOpenStack 架构可用的第三种 H/A\
  \ 模式是 Active/Active 模式。在此模式中，服务在负载均衡服务或设备后面水平扩展，该负载均衡服务或设备为 Active/Passive。作为一般规则，只要可能，大多数\
  \ OpenStack 服务都应启用为 Active/Active，以允许成功场景同时减轻故障场景。理想情况下，Active/Active 服务可以通过简单地添加额外的控制平面节点，在无需服务中断的情况下弹性扩展。\n\
  \nActive/Passive 和 Active/Active 设计都需要集群软件来确定服务及其运行主机的健康状况。在本章中，我们将使用 Pacemaker\
  \ 作为集群管理器。一些架构师可能会选择使用 Keepalived 而不是 Pacemaker。\n\n除了这三种场景之外，扩展 OpenStack 服务始终存在超出一定限制的限制。如前所述，消息总线通常是首先出现扩展问题的服务；然而，它并不是唯一的地方。在\
  \ Canonical 和 Mirantis 的扩展测试中，测试人员发现 Nova 和 Cinder 项目以及数据库服务在扩展时也存在问题。始终最好实践是监控所有\
  \ OpenStack 服务的响应能力，并在模拟环境中使用 Tempest 和/或 Rally 等工具进行扩展测试，以评估需求增长对 OpenStack 云的影响。\n\
  \n## Active/Passive 服务配置\n\n在 Active/Passive 服务配置中，服务配置并部署到两个或多个物理系统。服务与 **虚拟 IP\
  \ (VIP)** 地址相关联。集群资源管理器（通常是 Pacemaker）用于确保在任何时间点服务及其 VIP 仅在两个系统中的一个上启用。资源管理器可以配置为更偏好其中一台机器。\n\
  \n当服务运行的机器发生故障时，资源管理器首先确保故障机器不再运行，然后在第二台机器上启动服务。确保故障机器不再运行的过程称为 **fencing**。Fencing\
  \ 通常涉及使用 BIOS 上的管理接口关闭机器电源。fence 代理还可能与连接到故障服务器的电源供应器通信，以确保系统已关闭。\n\n某些服务（如 Glance\
  \ 镜像注册表）需要共享存储才能运行。如果存储基于网络，例如 NFS，存储可以同时挂载在活动节点和被动节点上。如果存储基于块，例如 iSCSI，存储将仅挂载在活动节点上，并且资源管理器将确保存储随服务和\
  \ VIP 一起迁移。\n\n## Active/Active 服务配置\n\n大多数 OpenStack API 服务设计为可同时在多个系统上运行。此配置即\
  \ Active/Active 配置，需要负载均衡器在各个活动服务之间分配流量。负载均衡器管理服务的 VIP，并确保后端系统在转发流量之前正在监听。集群管理器确保\
  \ VIP 在任何时候仅在单个节点上处于活动状态。后端服务在 Active/Active 配置中可能由集群管理器管理，也可能不由其管理。服务或系统故障由负载均衡器检测，故障服务将被移出轮换。\n\
  \nActive/Active 服务配置有以下几个优势：\n\n- 第一个优势是它允许水平扩展。如果给定服务需要额外容量，可以启动运行该服务的新系统，并将其在负载均衡器后面加入轮换，而无需任何停机。控制平面在过度配置的情况下也可以在不中断的情况下缩减规模。\n\
  - 第二个优势是 Active/Active 服务的平均恢复时间要短得多。Fencing 操作通常需要长达两分钟，并且在集群资源管理器将服务从故障系统移动到健康系统之前需要进行\
  \ fencing。负载均衡器可以立即检测系统故障并停止向无响应的节点发送请求，同时集群管理器在后台进行 fencing。\n\n只要可能，架构师应为控制平面服务采用\
  \ Active/Active 模式。\n\n## OpenStack 服务具体说明\n\n在本节中，我们将逐一介绍每个 OpenStack 服务并概述其 H/A\
  \ 策略。虽然大多数服务可以在负载均衡器后面配置为 Active/Active，但其中一些必须配置为 Active/Passive，而其他一些可以配置为 Active/Active。一些配置还取决于\
  \ OpenStack 的特定版本，尤其是 Ceilometer、Heat 和 Neutron。以下详细信息截至 OpenStack 的 Liberty 版本。\n\
  \n### OpenStack Web 服务\n\n作为一般规则，所有 Web 服务和 Horizon 仪表板都可以运行 Active/Active。这些包括\
  \ Keystone、Glance、Nova、Cinder、Neutron、Heat 和 Ceilometer 的 API 服务。Nova、Cinder、Neutron、Heat\
  \ 和 Ceilometer 的调度服务也可以部署为 Active/Active。这些服务不需要负载均衡器，因为它们响应消息总线上的请求。\n\n唯一必须运行\
  \ Active/Passive 的 Web 服务是 Ceilometer Central 代理。此服务可以配置为在多个实例之间拆分其工作负载，以支持水平扩展。\n\
  \n### 数据库服务\n\n所有 OpenStack Web 服务的状态都存储在中央数据库中，通常是 MySQL 数据库。MySQL 通常以 Active/Passive\
  \ 配置部署，但可以使用 Galera 复制扩展使其变为 Active/Active。Galera 是 MySQL（OpenStack 中的 MariaDB）的集群软件，它使用同步复制来实现\
  \ H/A。然而，即使使用 Galera，我们仍然建议仅将写入定向到其中一个副本；OpenStack 服务使用的某些查询在写入多个主节点时可能会死锁。使用 Galera，通常会在集群前面部署负载均衡器，并配置为一次仅将流量传递到一个副本。此配置可减少服务的平均恢复时间，同时确保数据一致性。\n\
  \n在实践中，许多组织会将高度可用的 MySQL 部署偏好交给数据库架构师。毕竟，通常是数据库管理团队负责响应该组件的故障。\n\n使用 Ceilometer\
  \ 服务的部署还需要 MongoDB 数据库来存储遥测数据。MongoDB 按设计可水平扩展，通常以至少三个副本的 Active/Active 方式部署。\n\n\
  ### 消息总线\n\n所有 OpenStack 服务都通过消息总线进行通信。如今大多数 OpenStack 部署使用 RabbitMQ 服务作为消息总线。RabbitMQ\
  \ 可以通过称为“mirrored queues”的功能配置为 Active/Active。RabbitMQ 服务不进行负载均衡；每个服务都会获得潜在节点的列表，客户端负责确定哪些节点处于活动状态，哪些节点已失败。\n\
  \n与 OpenStack 一起使用的其他消息服务，如 ZeroMQ、ActiveMQ 或 Qpid，可能有不同的策略和配置来实现 H/A 和水平扩展。对于这些服务，请参阅文档以确定最佳架构。\n\
  \n### 计算、存储和网络代理\n\nOpenStack 中的计算、存储和网络组件有一组由 API 服务调度的执行工作的服务。这些服务在启动时通过消息总线向调度器注册自己。调度器负责确定服务的健康状况并将工作调度到活动服务。计算和存储服务都设计为可运行\
  \ Active/Active，但网络服务需要额外考虑。\n\nOpenStack 部署中的每个超visor 都运行 nova-compute 服务。当此服务启动时，它会向\
  \ nova-scheduler 服务注册自己。当前可用的 nova 服务列表可通过 nova service-list 命令获得。如果计算节点不可用，其状态列为\
  \ down，调度器在执行实例操作时会跳过它。当节点变得可用时，调度器会将其包含在可用主机列表中。\n\n对于基于 KVM 或 Xen 的部署，nova-compute\
  \ 服务每个超visor 运行一次且不做高可用。对于基于 VMware 的部署，则为每个 vSphere 集群运行单个 nova-compute 服务。因此，此服务应以\
  \ Active/Passive 配置实现高可用。这通常通过在 vSphere 集群内虚拟化该服务并配置虚拟机为高可用来实现。\n\nCinder 包含一个称为卷服务或\
  \ cinder-volume 的服务。卷服务在启动时向 Cinder 调度器注册自己，并负责在块存储设备上创建、修改或删除 LUN。对于支持多写入器的后端，可以以\
  \ Active/Active 配置运行多个此服务的副本。LVM 后端（这是参考后端）不可高可用，每个块设备只能有一个 cinder-volume 服务。这是因为\
  \ LVM 后端负责为本地连接的存储设备提供 iSCSI 访问。\n\n![](img/2f752555f69992669defa8b25e6dcee9_65_0.png)\n\
  \n因此，OpenStack 的高可用部署应避免使用 LVM Cinder 后端，而应使用支持多个 cinder-volume 服务的后端。\n\n\n\n\n\
  最后，OpenStack 的 Neutron 组件包含多个代理，它们在高可用部署中都需要特殊考虑。DHCP 代理可以配置为高可用，而每个子网响应 DHCP 请求的代理数量由\
  \ neutron.conf 文件中的参数 `dhcp_agents_per_network` 控制。该参数通常设置为 2，无论控制平面中配置运行多少个 DHCP\
  \ 代理。\n\n在 OpenStack 的大部分历史中，Neutron 中的 L3 路由代理一直是单点故障。它可以在主备（Active/Passive）配置下实现高可用，但其故障切换意味着租户空间中的网络连接会中断。许多第三方\
  \ Neutron 插件已经以不同方式解决了这个问题，而参考 Open vSwitch 插件自 Juno 版本起提供了高可用的 L3 代理。关于使用 OpenStack\
  \ 分布式虚拟路由器（DVR）解决单一路由点故障的方案细节，请参阅 OpenStack 基金会的 Neutron 文档：http://docs.openstack.org/liberty/networking-guide/scenario-dvr-ovs.html。\n\
  \n## 区域、单元和可用区\n\n如前所述，OpenStack 设计为可扩展的，但不是无限可扩展的。架构师可以使用三种不同的技术来隔离 OpenStack 云：区域（region）、单元（cell）和可用区（availability\
  \ zone）。在本节中，我们将逐一说明这些概念是如何映射到虚拟机监控程序拓扑的。\n\n## 区域\n\n从最终用户的角度来看，OpenStack 区域等同于\
  \ Amazon Web Services 中的区域。区域位于不同的数据中心，通常以其地理位置命名。如果您的组织在菲尼克斯和罗利各有一个数据中心，那么您至少会有一个\
  \ PHX 区域和一个 RDU 区域。希望在地理上分散工作负载的用户会将部分工作负载放在 PHX，部分放在 RDU。区域拥有独立的 API 端点，尽管 Horizon\
  \ UI 对多区域有一定支持，但它们本质上完全是独立的部署。\n\n从架构的角度来看，实现区域有两个主要的设计选择，如下所示：\n\n- 第一个是关于授权。用户希望使用相同的凭据访问每个\
  \ OpenStack 区域。有几种方法可以实现这一点。最简单的方法是在每个区域的 Keystone 服务中使用通用的后端存储（通常是 LDAP）。在这种情况下，用户必须分别向每个区域进行身份验证以获取令牌，但凭据是相同的。\n\
  \n在 Juno 及更高版本中，Keystone 还支持跨区域联合。在这种场景下，一个区域授予的 Keystone 令牌可以提交给另一个区域来验证用户身份。虽然目前这种做法尚未广泛使用，但它是\
  \ OpenStack 基金会的一个重点领域，并且将来可能会得到更广泛的采用。\n\n- 区域架构的第二个主要考虑因素是是否向每个区域提供一组相同的 Glance\
  \ 镜像。虽然目前正在进行跨联邦云复制 Glance 镜像的工作，但大多数组织仍在手动确保共享镜像的一致性。这通常涉及围绕镜像发布和废弃构建工作流，并需要考虑区域布局。\n\
  \n确保跨区域镜像一致的另一个选择是使用 Swift 实现中央镜像仓库。这也需要跨多个数据中心共享 Keystone 和 Glance 服务。关于如何设计具有共享服务的多区域的详细信息，请参阅\
  \ OpenStack 架构设计指南。\n\n## 单元\n\nNova 计算服务具有单元（cell）的概念，可用于在单个区域内隔离大型虚拟机监控程序池。此技术主要用于缓解\
  \ OpenStack 消息总线的可扩展性限制。CERN 的部署广泛使用单元来在单个区域内实现大规模可扩展性。\n\n不同服务对单元的支持各不相同，因此单元在少数超大型云部署之外并不常见。CERN\
  \ 的部署有完善的文档记录，应作为此类部署的参考。\n\n根据我们的经验，在单个数据中心内部署多个区域比实现单元来实现大规模扩展要简单得多。向用户展示地理位置上多个\
  \ API 端点所带来的额外不便，通常会被更健壮平台的好处所抵消。如果一个地理区域内有多个控制平面，单个控制平面的故障就不会那么严重。\n\n![](img/2f752555f69992669defa8b25e6dcee9_68_0.png)\n\
  \n单元架构在网络和实例放置调度方面有其自身的挑战。一些支持 OpenStack 工作的大型公司多年来一直在努力克服这些障碍。然而，许多不同的 OpenStack\
  \ 发行版目前正在设计新的控制平面方案。这些新设计将开始将 OpenStack 控制平面拆分为多个容器，以微服务架构类型运行 OpenStack 服务。这样，服务本身可以放置在任何位置，并根据负载进行水平扩展。最近引起广泛关注的一个架构是\
  \ Kolla 项目，它推广 Docker 容器和 Ansible playbook，为运行 OpenStack 云提供生产级容器和部署工具。更多信息请访问 https://wiki.openstack.org/wiki/Kolla。\n\
  \n## 可用区\n\n可用区用于在单个 OpenStack 区域内对虚拟机监控程序进行分组。可用区对最终用户可见，并应用于向用户提示云的底层拓扑。可用区最常见的用例是向用户暴露故障域。\n\
  \n为了确保部署在 OpenStack 上的服务的高可用性，用户通常希望将其服务的各个组件部署到不同机架内的虚拟机监控程序上。这样，一个机架顶部交换机或 PDU\
  \ 的故障只会导致提供服务的部分实例宕机。因此，机架自然地构成了可用区的边界。除了向最终用户暴露故障域之外，可用区还有一些其他有趣的用途。我们合作过的一个金融服务客户要求每个业务线的实例都运行在专用硬件上。我们结合使用可用区和\
  \ AggregateMultiTenancyIsolation Nova 调度器过滤器，以确保每个租户都能访问专用的计算节点。\n\n可用区也可以用于向最终用户公开硬件类别。例如，具有更快处理器的宿主机可以放在一个可用区中，而具有较慢处理器的宿主机可以放在不同的可用区中。这允许最终用户根据计算需求决定将工作负载放在何处。\n\
  \n## 更新设计文档\n\n在本章中，我们讨论了在 OpenStack 部署中实现高可用性和可扩展性的不同方法和注意事项。作为云架构师，我们需要为部署选择正确的方法，然后对其进行全面记录，以便组织内更大的团队进行评估。\n\
  \n每个主要的 OpenStack 供应商都有一个高可用部署的参考架构，这些应作为设计的起点。然后，设计应与现有企业架构集成，并加以修改，以确保遵循组织内不同利益相关者确立的最佳实践。\n\
  \n例如，Red Hat 的高可用控制平面使用 Galera 扩展来实现 Active/Active MariaDB 服务，但组织内的数据库架构师可能只支持 Active/Passive\
  \ 配置中的 Oracle MySQL。如果云架构师打算向数据库管理团队寻求支持，则可能选择实现数据库架构师经过验证的模式。组织内的网络架构师可能更熟悉支持 F5\
  \ 负载均衡器，而不是 HAProxy 负载均衡器。\n\n组织内的系统管理员可能更熟悉支持 Pacemaker，而不是 Keepalived。设计文档呈现了这些关键技术各自的选择，并在部署前为利益相关者提供评论的机会。\n\
  \n## 规划物理架构\n\n在上一章中，我们更新了物理架构部分，以包含将要部署的各种主机组的定义。实现高可用性最简单的方法是向部署中添加额外的云控制器并对它们进行集群。其他部署可能选择将服务隔离到不同的主机类别中，然后对这些类别进行集群。这可能包括将数据库服务分离到数据库节点、将消息传递服务分离到消息传递节点，以及将\
  \ memcached 服务分离到 memcache 节点。\n\n\n\n负载均衡服务也可能位于它们自己的节点上。将可扩展服务映射到物理（或虚拟）主机时，主要考虑以下因素：\n\
  \n-   该服务是水平扩展还是垂直扩展？\n-   对该服务进行垂直扩展是否会妨碍其他共置服务的性能？\n-   该服务是否有其他服务不具备的特殊硬件或网络要求？\n\
  \n例如，一些使用 HAProxy 负载均衡服务的 OpenStack 部署选择将负载均衡节点分离出来，放在单独的硬件上。负载均衡节点托管的 VIP 必须处于公开的可路由网络上，而它们所路由到的服务的内部\
  \ IP 则没有此要求。将 HAProxy 服务放在独立主机上，可以让控制平面的其余部分仅使用私有地址。\n\n将所有 API 服务集中在专用主机上可能有助于水平扩展。这些服务不需要由集群资源管理器管理，可以通过向负载均衡器添加额外节点来进行扩展，而无需更新集群定义。数据库服务具有高\
  \ I/O 需求。将这些服务隔离到可以访问高性能光纤通道的机器上可能是合理的。\n\n最后，你应该考虑是否虚拟化控制平面。如果控制平面将进行虚拟化，创建额外的主机组来托管专用服务就会变得非常有吸引力。将八九台虚拟机专用于控制平面与将八九台物理机专用于控制平面是完全不同的情况。\n\
  \n大多数高可用控制平面至少需要三个节点，以确保集群资源管理器能够轻松确定法定人数。虽然为一百节点的 OpenStack 部署专门使用三个物理节点来承担控制功能非常合理，但专门使用九个物理节点可能就不一定了。我们合作过的许多组织已经拥有基于\
  \ VMware 的集群可用于托管管理设备，控制平面可以部署在该现有环境内。部署纯 KVM 云的组织可能不想承担在 OpenStack 之外管理额外虚拟机所带来的额外运维复杂性。\n\
  \n## 更新物理架构设计\n\n一旦确定服务到物理（或虚拟）主机的映射，就应该更新设计文档，加入主机组定义及其相关功能。下面给出一个简单示例：\n\n-  \
  \ **负载均衡器：**这些系统以主动/被动配置提供负载均衡服务\n-   **云控制器：**这些系统以主动/主动配置提供 API 服务、调度服务和 Horizon\
  \ 仪表板服务\n-   **数据库节点：**这些系统以主动/被动配置提供 MySQL 数据库服务\n-   **消息节点：**这些系统以主动/主动配置提供 RabbitMQ\
  \ 消息服务\n-   **计算节点：**这些系统充当 KVM 虚拟化主机，并运行 `nova-compute` 和 `openvswitch-agent` 服务\n\
  \n仅使用云控制器主机组的部署可以使用以下定义：\n\n-   **云控制器：**这些系统以主动/被动配置提供负载均衡服务，并以主动/主动配置提供 API 服务、MySQL\
  \ 数据库服务和 RabbitMQ 消息服务\n-   **计算节点：**这些系统充当 KVM 虚拟化主机，并运行 nova-compute 和 openvswitch-agent\
  \ 服务\n\n定义主机组后，应更新物理架构图，以反映主机组到部署中物理主机的映射。这还应包括网络连接方面的考虑。以下是可包含在设计文档中的架构图示例：\n\n\
  ![](img/2f752555f69992669defa8b25e6dcee9_72_0.png)\n\n## 在实验室部署中实现高可用性（H/A）\n\n\
  在最后这一节中，我们将通过添加第二个控制器节点并配置集群软件，使我们在第 2 章《构建云架构》中部署的当前实验室部署实现高可用。此示例应足够简单，以便在实验室中轻松实施，同时仍允许你评估相关技术。\n\
  \n### 配置第二台控制器\n\n在后续章节中，我们将介绍更灵活的部署方法，这些方法允许细粒度的服务放置和自动化集群配置。在本章中，我们只扩展第 2 章《构建云架构》中的\
  \ Packstack 部署。Packstack 并不用于部署多个控制器，因此需要手动配置一些服务。\n\n要配置第二台控制器，请以配置第一台控制器相同的方式，在新机器上安装操作系统，然后从第一台控制器复制\
  \ Packstack 应答文件。编辑应答文件，将 CONFIG_CONTROLLER_HOST、CONFIG_NETWORK_HOSTS 和 CONFIG_STORAGE_HOST\
  \ 替换为新控制器的 IP 地址。\n\n我们不会重新配置计算节点或现有控制器，因此请将你在第 2 章《构建云架构》中配置的计算节点和控制器添加到应答文件的 EXCLUDE_SERVERS\
  \ 参数中。我们会将 MySQL、Redis、MongoDB 和 RabbitMQ 服务保留在第一台控制器上，因此不应修改这些值。\n\n使用我们在第 2 章《构建云架构》中使用的相同命令，在新控制器上运行\
  \ Packstack：\n\n```\npackstack --answer-file <answer-file>\n```\n\nPackstack 完成后，你应该可以通过访问第二台主机的\
  \ IP 地址，并使用第 2 章《构建云架构》中使用的相同凭据，登录仪表板。\n\n### 安装 Pacemaker 资源管理器\n\n接下来，我们将安装 Pacemaker\
  \ 来管理之后要与 HAProxy 配合使用的 VIP，以使 Web 服务高可用。我们假设控制器节点已经可以通过 yum 获取集群软件。\n\n1.  首先，在两台节点上使用以下命令安装\
  \ Pacemaker：\n\n    ```\n    # yum install -y pcs fence-agents-all\n    ```\n\n\
  2.  运行以下命令验证软件是否安装正确：\n\n    ```\n    # rpm -q pcs\n    pcs-0.9.137-13.el7_1.3.x86_64\n\
  \    ```\n\n3.  接下来，向防火墙添加规则以允许集群流量：\n\n    ```\n    # firewall-cmd --permanent\
  \ --add-service=high-availability\n    ```\n\n4.  使用以下命令在每个节点上设置 Pacemaker 集群的密码：\n\
  \n    ```\n    # passwd hacluster\n    ```\n\n5.  在每个节点上启动 Pacemaker 集群管理器：\n\n\
  \    ```\n    # systemctl start pcsd.service\n    # systemctl enable pcsd.service\n\
  \    ```\n\n6.  然后，在第一台节点上使用以下命令对节点进行身份验证：\n\n    ```\n    # pcs cluster auth controller1\
  \ controller2\n    Username: hacluster\n    Password:\n    controller1: Authorized\n\
  \    controller2: Authorized\n    ```\n\n7.  最后，在第一台节点上运行以下命令以创建集群并启动它：\n\n    ```\n\
  \    # pcs cluster setup --start --name openstack \\\n    > controller1 controller2\n\
  \    Shutting down pacemaker/corosync services...\n    Redirecting to /bin/systemctl\
  \ stop pacemaker.service\n    Redirecting to /bin/systemctl stop corosync.service\n\
  \    Killing any remaining services...\n    Removing all cluster configuration files...\n\
  \    controller1: Succeeded\n    controller2: Succeeded\n    Starting cluster on\
  \ nodes: controller1, controller2...\n    controller1: Starting Cluster...\n   \
  \ controller2: Starting Cluster...\n    ```\n\n8.  对于我们的示例集群，我们将使用以下命令禁用 fencing：\n\
  \n    ```\n    # pcs property set stonith-enabled=false\n    ```\n\n9.  使用以下命令验证集群是否成功启动：\n\
  \n    ```\n    # pcs status\n    Cluster name: openstack\n    Last updated: Mon\
  \ Aug 31 01:51:47 2015\n    Last change: Mon Aug 31 01:51:14 2015\n    Stack: corosync\n\
  \    Current DC: controller1 (1) - partition with quorum\n    Version: 1.1.12-a14efad\n\
  \    2 Nodes configured\n    0 Resources configured\n    Online: [ controller1 controller2\
  \ ]\n    ```\n\n有关设置 Pacemaker 的更多信息，请参阅 http://clusterlabs.org/doc/en-US/Pacemaker/1.1-pcs/html/Clusters_from_Scratch/index.html\
  \ 上出色的 Clusters from Scratch 文档。\n\n### 安装并配置 HAProxy\n\n在本实验室部署中，我们将使用 HAProxy\
  \ 对控制平面服务进行负载均衡。一些部署可能还会使用 Keepalived，并以主动/主动配置运行 HAProxy。对于此部署，我们将以主动/被动配置运行 HAProxy，并将其与我们的\
  \ VIP 一起作为 Pacemaker 中的资源进行管理。\n\n首先，在两台节点上使用以下命令安装 HAProxy：\n\n```\n# yum -y install\
  \ haproxy\n```\n\n使用以下命令验证安装：\n\n```\n# rpm -q haproxy\nhaproxy-1.5.4-4.el7_1.x86_64\n\
  ```\n\n接下来，我们将为 HAProxy 创建一个配置文件，用于对两个控制器上安装的 API 服务进行负载均衡。使用以下示例作为模板，将示例中的 IP 地址替换为两个控制器的\
  \ IP 地址，以及你用于对 API 服务进行负载均衡的 VIP 地址。\n\n\n\n\n![](img/2f752555f69992669defa8b25e6dcee9_76_0.png)\n\
  \n某些部署可能会为每个服务创建一个 VIP。这允许多个 HAProxy 节点为不同服务响应 HTTP 会话。在本示例中，我们将仅使用一个单一 VIP，因为 HAProxy\
  \ 处于主/备配置。\n\n以下示例 `/etc/haproxy/haproxy.cfg` 将在我们的环境中对 Horizon 进行负载均衡：\n\n```\n\
  global\n    daemon\n    group haproxy\n    maxconn 40000\n    pidfile /var/run/haproxy.pid\n\
  \    user haproxy\n\ndefaults\n    log 127.0.0.1 local2 warning\n    mode tcp\n\
  \    option tcplog\n    option redispatch\n    retries 3\n    timeout connect 10s\n\
  \    timeout client 60s\n    timeout server 60s\n    timeout check 10s\n\nlisten\
  \ horizon\n    bind 192.168.0.30:80\n    mode http\n    cookie SERVERID insert indirect\
  \ nocache\n    option tcplog\n    timeout client 180s\n    server controller1 192.168.0.10:80\
  \ cookie controller1 check inter 1s\n    server controller2 192.168.0.11:80 cookie\
  \ controller2 check inter 1s\n```\n\n在本示例中，`controller1` 的 IP 地址为 `192.168.0.10`，`controller2`\
  \ 的 IP 地址为 `192.168.0.11`。我们选择的 VIP 为 `192.168.0.30`。复制此文件，将 IP 地址替换为实验室中的地址，然后将其放到每个控制器的\
  \ `/etc/haproxy/haproxy.cfg` 中。\n\n为了使 Horizon 能响应 VIP 上的请求，我们需要在 Apache 虚拟主机配置中将\
  \ VIP 添加为 ServerAlias。这在我们的实验室安装中位于 `/etc/httpd/conf.d/15-horizon_vhost.conf`。查找以下行：\n\
  \n```\nServerAlias 192.168.0.10\n```\n\n在两个控制器上添加一个包含 VIP 的额外 ServerAlias 行：\n\n\
  ```\nServerAlias 192.168.0.30\n```\n\n您还需要告诉 Apache 不要监听 VIP，以便 HAProxy 可以绑定到该地址。为此，修改\
  \ /etc/httpd/conf/ports.conf 并在端口号之外指定控制器的 IP 地址。以下是一个示例：\n\n```\nListen 192.168.0.10:35357\n\
  Listen 192.168.0.10:5000\nListen 192.168.0.10:80\n```\n\n在本示例中，192.168.0.10 是第一个控制器的地址。为每台机器替换适当的\
  \ IP 地址。\n\n重启 Apache 以应用新的别名：\n\n```\n# systemctl restart httpd.service\n```\n\n\
  接下来，将 VIP 和 HAProxy 服务作为资源添加到 Pacemaker 集群中。这些命令应仅在第一个节点上运行：\n\n```\n# pcs resource\
  \ create VirtualIP IPaddr2 ip=192.168.0.30 cidr_netmask=24\n# pcs resource create\
  \ HAProxy systemd:haproxy\n```\n\n将 HAProxy 服务与 VirtualIP 协同放置，以确保两者一起运行：\n\n```\n\
  # pcs constraint colocation add VirtualIP with HAProxy score=INFINITY\n```\n\n验证资源是否已启动：\n\
  \n```\n# pcs status\n...\nFull list of resources:\nVirtualIP(ocf::heartbeat:IPaddr2):Started\
  \ controller1\nHAProxy(systemd:haproxy):Started controller1\n...\n```\n\n此时，您应该能够使用指定的\
  \ VIP 访问 Horizon。流量将从客户端流向 VIP 上的 HAProxy，再流向两个节点之一上的 Apache。\n\n## Additional API\
  \ service configuration\n\n现在我们已经拥有一个可工作的集群和 HAProxy 配置，最后的配置步骤是将每个 OpenStack API\
  \ 端点都置于负载均衡器之后。此过程包含三个步骤，分别是：\n\n- 1. 更新 HAProxy 配置以包含该服务。\n- 2. 将 Keystone 服务目录中的端点移动到\
  \ VIP。\n- 3. 重新配置服务，使其指向 VIP 而不是第一个控制器的 IP。\n\n在以下示例中，我们将把 Keystone 服务置于负载均衡器之后。此过程可对每个\
  \ API 服务重复。\n\n首先，在 HAProxy 配置文件中为 Keystone 的授权和管理员端点添加一个部分：\n\n```\nlisten keystone-admin\n\
  \    bind 192.168.0.30:35357\n    mode tcp\n    option tcplog\n    server controller1\
  \ 192.168.0.10:35357 check inter 1s\n    server controller2 192.168.0.11:35357 check\
  \ inter 1s\n\nlisten keystone-public\n    bind 192.168.0.30:5000\n    mode tcp\n\
  \    option tcplog\n    server controller1 192.168.0.10:5000 check inter 1s\n  \
  \  server controller2 192.168.0.11:5000 check inter 1s\n```\n\n确保在两个控制器上更新配置。在活动节点上重启\
  \ haproxy 服务：\n\n```\n# systemctl restart haproxy.service\n```\n\n您可以使用 pcs status\
  \ 的输出确定活动节点。使用以下命令检查 HAProxy 是否已在 5000 和 35357 端口上监听：\n\n```\n# curl http://192.168.0.30:5000\n\
  # curl http://192.168.0.30:35357\n```\n\n两者都应输出一些描述 Keystone 服务状态的 JSON。\n\n# 4\n"
- "## Building the Deployment Pipeline\n\n我们经常告诉我们合作的客户，OpenStack 不是被 **installed**，而是被\
  \ **deployed**。虽然词语上的差异可能看起来很细微，但它可能在组织内部带来革命性的变化。大多数企业基础设施团队习惯于在部署新基础设施平台时采用以下流程：\n\
  \n- 1. 安装平台。\n- 2. 配置并集成平台。\n- 3. 运行平台。\n- 4. 升级平台。\n\n安装和配置平台可能需要数月或数年时间，一旦安装完成，平台预计将运行数年。对平台的升级每\
  \ 3 到 5 年发生一次，是为期 6-12 个月的大型项目。Red Hat 已围绕这些周期构建了企业 Linux 操作系统的发布结构——RHEL 5 和 RHEL\
  \ 6 之间相隔 3 年，RHEL 6 和 RHEL 7 之间相隔近 4 年。每个版本都支持 10 年，保守的基础设施团队在新版本发布后至少等待一年才会开始为期\
  \ 6-12 个月的升级项目。\n\n这种对平台部署的保守方法在操作系统、虚拟化平台和应用平台领域工作得非常好。然而，如果您私有云项目的最重要业务驱动因素是提高敏捷性，那么以\
  \ 12 个月的推出周期和 5 年的生命周期是不太可能实现目标的。\n\n在本章中，我们将研究 OpenStack 通常作为应用软件而非基础设施软件的部署方式。我们将构建一个简单的部署流水线，该流水线使用\
  \ Puppet 描述 OpenStack 部署，使用 Jenkins 这款开源持续集成工具来实现该部署，然后运行单元测试以验证部署是否符合我们的规范。在整章中，我们将讨论迭代开发以及它如何适用于\
  \ OpenStack 部署。\n\n## Dealing with Infrastructure as a Software\n\n一家大型公司的基础设施副总裁曾经这样告诉我们：“我喜欢硬件。我的硬件几乎从不坏。我部署的软件总是坏。当我的数据中心变成软件时，我怎么才能拥有一个稳定的平台？”。同样的担忧曾经也可能适用于虚拟化，但今天大多数组织对软件假装成硬件的想法都很舒适。软件定义的数据中心则有点更令人畏惧。虽然我们很早就有了软件假装成\
  \ CPU，但软件假装成存储阵列相对较晚。而且，当存储阵列宕机时，一切往往都会随之宕机。\n\n然而，更大的问题可能在于软件在部署时不断出错。事实上，我们合作过的最成功的\
  \ OpenStack 部署都采用了现代软件开发技术，以确保其软件在部署时不会出错。\n\n## Eating the elephant\n\n我们将应用于部署流程的第一个也是最重要的概念是迭代开发。不是试图在一轮部署中解决所有已识别的需求，我们将其分解为用户故事，分配给为期两到三周的冲刺，然后逐一实现。冲刺是源自\
  \ Scrum 流程和框架的一种基本开发度量。冲刺是经过规划且限制在特定持续时间内的限时工作量（两周很常见）。这不仅允许我们限制每次发布的复杂性并专注于彻底测试每个组件，还允许我们在流程中更早地为业务带来价值。仅需要少量功能集的工作负载将能够在无需等待大型发布的情况下加入平台。\n\
  \n\n\n\n## 先编写测试\n\n我们将从软件开发领域借鉴的第二个重要实践是测试驱动开发。我们先编写能够演示所要实现功能的测试，然后再进行部署工作，直到测试通过。一旦功能实现完成，该测试便成为平台日常监控系统的一部分。\n\
  \n根据我们的经验，如果测试不是先于代码编写，那么它们往往根本不会被编写。每个项目都会在某个时刻面临时间耗尽的问题，如果测试被排在列表的最后，它们往往会被砍掉。\n\
  \n## 始终持续部署\n\n持续部署的好处早已在软件开发领域得到充分阐述，但它们尤其适用于 OpenStack 的部署。相比少数几个大规模且经过良好测试的变更，大量小型且经过充分测试的变更对复杂环境（例如私有云部署）造成的干扰要小得多。\n\
  \n不过，也有一些例外。例如，从 Nova Networking 迁移到 Neutron 是一个重大变更，很难将其拆分为更小的部分。添加一个新的 Cinder\
  \ 驱动是一个小的迭代变更，但在需要迁移大量卷的环境中，从一个 Cinder 驱动切换到另一个可能是一个巨大的变更。在做出架构决策时，应当谨慎行事，尽量避免对平台进行无法迭代开发和部署的大型变更。\n\
  \n## 使用配置管理进行部署\n\n要开始部署我们的平台类代码，首先需要引入一套配置管理系统。虽然使用 shell 脚本自动化部署 OpenStack 确实是可能的（我们见过有人这样做），但使用声明式配置管理工具能让你的团队更轻松地跟踪迭代之间的变更。此外，一个\
  \ OpenStack 配置可能包含数百个变量，需要在数十台主机的多个配置文件中进行设置。例如，我们在实验室部署 Kilo 时，在组合层中设置了 137 个参数。用\
  \ shell 脚本管理这种复杂程度，会引入另一种不必要的复杂性。\n\n过去几年的每项 OpenStack 用户调查都会询问社区通常如何部署 OpenStack。尽管调查结果中列出了各种各样的方法，但\
  \ Puppet 在相当长一段时间内一直是明显的领导者。在过去一年里，社区中围绕 Ansible 兴起了一项新计划，其使用量急剧增加。一些知名的 OpenStack\
  \ 用户也使用 Chef 进行部署。我们的建议是使用贵组织最有经验的那款工具。我们合作过的一些团队已经大规模使用了 Puppet，一些团队精通 Chef，还有一些团队更喜欢使用\
  \ Ansible。我们也参与过使用 Salt 的项目。一个新的趋势是组合使用多种工具。例如，你可以让 Ansible 或 Salt 在主机上触发 Puppet\
  \ 运行。Puppet 是最常用的，我们在本章的示例中也将使用它。\n\n## 使用社区模块\n\n前面提到的每个配置管理系统都有一套由 OpenStack 社区编写和维护的、用于部署\
  \ OpenStack 的模块。例如，请参考下表：\n\n| 编排工具的 OpenStack 模块 | 位置 |\n|---|---|\n| Puppet 模块\
  \ | https://wiki.openstack.org/wiki/Puppet |\n| Ansible 剧本 | https://wiki.openstack.org/wiki/OpenStackAnsible\
  \ |\n| Chef 食谱 | https://wiki.openstack.org/wiki/Chef |\n\n无论使用哪种技术，总体方法都是一样的。\n\
  \n部署首先需要创建我们所说的**组合层**。这是一个 Puppet 模块（或 Ansible 剧本、Chef 食谱），它根据社区模块来定义我们部署中的系统所要承担的角色。例如，我们可以将计算角色定义为一个类，其中包含\
  \ `nova::compute` 类。控制节点角色将包含 `keystone, glance, nova::api` 以及其他类。我们还可以引入其他 Puppet\
  \ 模块来配置系统服务（如 NTP）或安装监控代理。\n\n## 分配角色\n\n一旦我们在组合层中声明了角色，就需要一种机制将其应用到系统中。到目前为止我们一直在使用的工具（Packstack）通过\
  \ SSH 完成这项工作——它生成一组包含社区模块的 Puppet 清单，然后逐个应用到我们实验室的系统中。它支持两种角色：控制节点角色和计算角色。我们当前的实验室部署包含控制节点和计算节点，但我们还将定义数据库节点，用于运行数据库和消息服务。\n\
  \n我们合作过的许多组织都使用 Cobbler（http://cobbler.github.io）、Foreman（http://theforeman.org）、Puppet\
  \ Enterprise（https://puppetlabs.com/puppet/puppet-enterprise）或其他工具来为系统分配角色。这些工具被称为\
  \ Puppet 的外部节点分类器（ENC）。借助 ENC，可以轻松地将配置参数（如 IP 地址或密码）与系统中的配置本身分离开来。这些工具还可以提供有关 Puppet\
  \ 运行的报告和管理功能。\n\n在本章中，我们将设置一个简单的 Puppet 主服务器来管理我们环境中各主机的配置。我们将配置数据存储在组合层中，同时承认这并不是最佳实践。\n\
  \n![](img/2f752555f69992669defa8b25e6dcee9_85_0.png)\n\n我们有一个客户更喜欢将配置数据存储在组合层中。他们的理由是，输入配置数据是最容易出现拼写错误或其他错误的地方，而这些错误会破坏自动化部署。由于他们通过版本控制来跟踪这些数据，因此更容易追踪这些手动错误。他们提出的流程是：为每个部署环境分叉（fork）出一个分支，然后在需要更新时从主分支将配置更改拉取到这些分支。分叉操作通常发生在开发人员从项目（如\
  \ OpenStack）中获取源代码副本并开始添加自己的更改时。由于项目的主源代码称为主干（trunk），当开发人员更改部分代码时，就说该开发人员创建了一个分支。\n\
  \n我们将已定义的角色分配给 Puppet 主服务器上的各主机，当主机与主服务器签入（check in）时，它们将获得与其角色匹配的配置。主机在首次运行后会定期签入，并在我们在主服务器上提供配置更新时拉取这些更新。\n\
  \n## 选择起点\n\n前面列出的每个官方 OpenStack Puppet、Chef 和 Ansible 项目都提供了示例组合层，可用于进行简单的 All-in-One\
  \ 部署。Puppet 的 All-in-One 部署清单可在 `https://github.com/openstack/puppet-openstack-integration`\
  \ 获取。它提供了三种方案，可以用作起点。不同的 OpenStack 厂商也可能提供适合作为起点的参考。我们合作过的一些组织聘请了咨询公司来编写最初的组合层，然后教他们如何迭代。\n\
  \n由于我们已经使用 Packstack 完成了可用的部署，我们将以此作为组合层的基础。随着我们向部署中添加功能，我们会从 Packstack 生成的清单中复制部分内容作为起点。我们还会添加一些新的\
  \ Puppet 代码，以将部署扩展到 Packstack 所能实现的范围之外。\n\n## 测试基础设施\n\n无论贵组织决定使用哪种配置管理系统来部署和配置\
  \ OpenStack 软件，部署过程由测试基础设施驱动都是至关重要的。根据我们的经验，手动管理的环境总会导致不一致，无论执行部署的操作员技能如何。自动化部署不可能在真空中进行；然而，要想成功，它们需要向开发人员和操作员提供即时反馈，以便他们判断部署是否成功。我们经历过许多\
  \ OpenStack 的手动部署和手动验收测试，这些周期可能需要数天或数周才能完成。\n\n## 测试类型\n\n在组合层的变更应用于环境之前，会经过多个测试阶段。在每个阶段，如果测试失败，部署就会停止。我们将这一系列阶段称为**部署流水线**。在流水线的一端，变更被提交到版本控制；在另一端，配置在基础设施中得以实现。\n\
  \n\n\n## 构建部署流水线\n\n下表列出了在流水线每个阶段测试的项目：\n\n| 阶段 | 测试重点 |\n|---|---|\n| 预提交 | 在变更进入流水线之前，对其进行测试，以确保不存在语法错误或风格问题。\
  \ |\n| 部署测试 | 在此阶段，测试集群中的每个系统都尝试应用配置更新。是否成功取决于变更能否无错误地应用。部分部署会触发第二次应用以测试幂等性。 |\n\
  | 集成测试 | 测试集群成功应用配置后，针对 OpenStack API 运行单元测试套件，验证配置的功能。 |\n| 性能测试 | 对测试集群运行一系列测试，以确保变更不会对性能产生不良影响。\
  \ |\n| 验收测试 | 在流水线的此阶段，执行任何手动测试。随后，变更被提升到下一个环境。 |\n| 金丝雀测试 | 生产环境的一个子集将应用变更，并重复自动化和验收测试，且使用生产数据库和\
  \ hypervisor。 |\n| 发布 | 整个生产环境将应用变更。 |\n\n许多组织希望在部署过程中加入代码审查。这通常在所有自动化测试完成后进行，以便审查人员可以获得测试结果。诸如\
  \ Gerrit (https://www.gerritcodereview.com/) 之类的工具可用于编排具有代码审查要求的构建流水线。许多组织更倾向于手动执行金丝雀测试和生产发布——这些仍应是由操作员决定启动（和回滚）的自动化流程。\n\
  \n## 编写测试\n\nOpenStack 完全由 REST API 驱动，因此可以使用任何带有 HTTP 客户端实现的语言为平台编写测试。http://developer.openstack.org\
  \ 上提供了大多数主流语言的软件开发工具包（SDK）。即便如此，大多数组织倾向于使用 Python（OpenStack 的编写语言）编写测试。对此有两种不同的观点。第一种观点认为，这样更容易吸引熟悉\
  \ Python 的 OpenStack 人才，而且相关技能可以在测试与开发之间相互转换。此外，上游还有一个名为 Tempest 的 Python 项目，许多组织将其用作运行自身测试的框架。第二种观点则认为，组织应该使用平台终端用户所使用的同一接口来测试平台。例如，如果你打算通过云管理平台或使用\
  \ Ruby Fog 库 (http://fog.io/) 的 PaaS 来配置基础设施，那么就应该使用 Fog 库编写测试。\n\n无论如何，Tempest\
  \ 几乎总是会在 OpenStack 部署测试过程中的某个环节被用到。至少，所有自称是 OpenStack 云的公共云都必须通过一组最低限度的 Tempest\
  \ 测试，才能获得基金会的认证。\n\n## 运行测试\n\n如前所述，测试基础设施应推动变更沿着流水线前进，捕获每次测试运行的结果，并在运行成功时提升变更。为此，可以使用软件开发中使用的众多\
  \ CI 工具中的任何一种。我们通常建议利用组织已经在使用的 CI 工具和软件仓库。如果你的组织在软件开发团队中没有进行 CI，我们之前见到成功使用的优秀选择包括\
  \ Jenkins (https://jenkins-ci.org/)、Atlassian 的 Bamboo (https://www.atlassian.com/software/bamboo/)\
  \ 或 Buildbot (http://buildbot.net/)。OpenStack 基金会的 CI 是基于 Jenkins 构建的，在本章中，我们将使用该工具来构建我们的流水线。\n\
  \n## 组装流水线\n\n现在我们已经介绍了部署流水线的各个组件，下面在我们的实验室环境中组装一个示例流水线。我们将从设置 CI 服务器开始，创建一个新的组合层，编写一个单元测试，然后部署\
  \ OpenStack 基础设施以通过测试。\n\n## 设置 CI 服务器\n\n在前面的章节中，我们通过从云控制器运行 `packstack` 工具来部署\
  \ OpenStack。在本节中，我们将设置一台专用机器来执行部署。对部署机器的要求并不苛刻——任何运行 CentOS 7 且内存为 2 GB 或以上的机器都应足够。唯一的网络要求是，该机器可以从内网和\
  \ OpenStack 集群本身访问。\n\n### 安装 Git\n\n以下说明将在 CI 服务器上设置一个 Git 版本控制服务器。如果你已经可以访问 Git\
  \ 仓库，或者更倾向于使用 GitHub，则可以跳过本节。有关设置 Git 服务器的更多信息，请参阅 *Scott Chacon* 和 *Ben Straub*\
  \ 所著的 *Pro Git* 一书，该书可在 https://git-scm.com/book/en/v2/ 在线阅读。\n\n要安装 Apache HTTP\
  \ 服务器和 Git 版本控制软件，请执行以下步骤：\n\n- 1. 以 root 身份在 CI 服务器上执行以下命令：\n```\n# yum install\
  \ -y httpd git\n```\n- 2. 验证软件包是否已正确安装：\n```\n# rpm -q httpd git\n```\n- 3. 创建一个顶级目录来存放我们的仓库：\n\
  ```\n# mkdir /var/www/html/git\n```\n- 4. 使用以下命令在该目录中创建 Git 仓库：\n```\n# mkdir /var/www/html/git/openstack/\n\
  # cd /var/www/html/git/openstack\n# git --bare init\n# git update-server-info\n\
  ```\n- 5. 在执行 `git --bare init` 命令后，你应该会看到以下响应：\n```\nInitialized empty Git repository\
  \ in\n/var/www/git/openstack/\n```\n- 6. 重置新 Git 仓库对 Apache 的权限：\n```\n# chown -R\
  \ apache:apache /var/www/html/git/\n```\n- 7. 最后，创建一个需要身份认证才能访问 Git 仓库的配置文件。以下示例可以复制到\
  \ /etc/httpd/conf.d/git.conf：\n```\n<Directory /var/www/html/git/>\n    DAV on\n\
  \n    AuthName \"Git login:\"\n    AuthType Basic\n    AuthUserFile /var/www/htpasswd\n\
  \n    # Allow anonymous clone, but require auth for push.\n    <LimitExcept GET\
  \ PROPFIND>\n        Require valid-user\n    </LimitExcept>\n</Directory>\n```\n\
  - 8. 创建一个用于访问仓库的用户账户：\n```\n# htpasswd -c /var/www/htpasswd git\n```\n- 9. 最后，重启\
  \ httpd 服务：\n```\n# systemctl restart httpd\n```\n- 10. 现在，你应该可以使用以下命令克隆 Git 仓库：\n\
  ```\n# git clone http://git@localhost/git/openstack\n```\n- 11. 系统可能会提示你输入创建用户账户时设置的密码，然后你应该会收到以下消息：\n\
  ```\nwarning: You appear to have cloned an empty repository.\n```\n\n### 安装 Puppet\
  \ 主服务器\n\n以下说明将在 CI 服务器上设置一个 Puppet 主服务器。如果你已经有一个可以在实验室中使用的 Puppet 基础设施，可以跳过本节。有关设置\
  \ Puppet 主服务器的更多信息，请参阅 Puppet 参考手册 (http://docs.puppetlabs.com/puppet/latest/reference/)。安装\
  \ RDO 仓库，该仓库提供了对 Puppet 和 OpenStack Puppet 模块的访问，具体步骤如下：\n\n- 1. 以 root 身份在 CI 服务器上执行以下命令：\n\
  ```bash\n# yum install -y https://rdoproject.org/repos/rdo-release.rpm\n```\n- 2.\
  \ 运行以下命令，验证仓库已被启用：\n```bash\n# yum repolist\n```\n- 3. 你应该会在输出中看到 `openstack` 仓库。运行以下命令来安装\
  \ Puppet 和 OpenStack Puppet 模块：\n```bash\n# yum install -y puppet puppet-server\
  \ openstack-puppet-modules openstack-packstack\n```\n- 4. 使用以下命令验证它们的安装：\n```bash\n\
  # rpm -q puppet puppet-server openstack-puppet-modules openstack-packstack\n```\n\
  - 5. 编辑 Puppet 配置，以包含 OpenStack Puppet 模块：\n```bash\n# puppet config set basemodulepath\
  \ \\\n'$confdir/modules:/usr/share/puppet/modules:/usr/share/openstack-puppet/modules'\
  \ --section main\n```\n- 6. 通过列出可用的 Puppet 模块来验证配置：\n```bash\n# puppet module list\n\
  ```\n\n你应该会看到大约 60 个 Puppet 模块，具体数量取决于 OpenStack 的版本。忽略任何有关依赖关系的错误。\n\n\n\n\n7.\
  \ 使用以下命令启动 puppet master 服务：\n\n```\n# systemctl start puppetmaster.service\n# systemctl\
  \ enable puppetmaster.service\n```\n\n8. 验证服务是否正确启动：\n\n```\n# systemctl status\
  \ puppetmaster.service -l\n```\n\n你应该会看到服务已创建证书颁发机构。环境中的客户端访问 Puppet master 时必须使用与证书颁发机构相同的\
  \ hostname。如果客户端将通过除 hostname 之外的其他方式访问 Puppet master，请查阅 puppet.conf 中的 dns_alt_names\
  \ 设置。\n\n## 安装 Jenkins\n\n以下说明将在 CI 服务器上设置 Jenkins 服务器。如果你已有可在实验室中使用的 Jenkins 服务器，可以跳过本节。有关设置\
  \ Jenkins 的更多信息，请参阅 Jenkins 网站 (https://wiki.jenkins-ci.org/display/JENKINS/Use+Jenkins)。\n\
  \n- 1. 以 root 用户身份在 CI 服务器上执行以下命令以安装 Jenkins 仓库，该仓库提供对 Jenkins 的访问权限：\n\n```\n#\
  \ curl http://pkg.jenkins-ci.org/redhat/jenkins.repo > /etc/yum.repos.d/jenkins.repo\n\
  # rpm --import https://jenkins-ci.org/redhat/jenkins-ci.org.key\n# yum install -y\
  \ java-1.7.0-openjdk jenkins\n```\n\n- 2. 要验证软件是否正确安装，运行以下命令：\n\n```\n# rpm -q java-1.7.0-openjdk\
  \ jenkins\n```\n\n- 3. 要启动 jenkins 服务器，使用以下命令：\n\n```\n# systemctl start jenkins\n\
  ```\n\n- 4. 使用以下命令验证 Jenkins 是否正确启动：\n\n```\n# systemctl status jenkins -l\n```\n\
  \n你应该会看到服务正在运行，并且日志输出中没有错误。\n\n5. 现在你可以通过在 Web 浏览器中访问主机 8080 端口来登录 Jenkins Web UI；也就是说，如果你的\
  \ CI 服务器的 hostname 为 `jenkins.example.com`，Jenkins 应可在 `http://jenkins.example.com:8080/`\
  \ 上访问。登录后你应会看到以下页面：\n\n![](img/2f752555f69992669defa8b25e6dcee9_93_0.png)\n\n6.\
  \ 我们需要做的最后一件事是安装 Git SCM 插件。点击左侧导航中的 Manage Jenkins 链接。从下一页选择 Manage Plugins。在 Plugins\
  \ 页面，选择 Available 选项卡，并在 Filter 栏中搜索 git plugin。选择 Git 插件并点击 Install without restart：\n\
  \n![](img/2f752555f69992669defa8b25e6dcee9_94_0.png)\n\n你将看到安装进度状态。完成后，你会看到类似以下页面：\n\
  \n![](img/2f752555f69992669defa8b25e6dcee9_95_0.png)\n\nJenkins 现已安装并配置了 Git 插件。\n\
  \n## 创建组合层\n\n现在我们的基础架构软件已就位，我们将开始创建我们的组合层。如前所述，我们将从在第 2 章 *Architecting the Cloud*\
  \ 中运行 `packstack` 命令时获得的“已知良好”配置开始。\n\n## 启动我们的 Puppet 模块\n\n我们的组合层将存储在两个 Puppet\
  \ 模块中，使用 Craig Dunn 开发的 **profiles and roles** 模式 (http://www.craigdunn.org/2012/05/239/)。我们将模块存储在新\
  \ Git 仓库中名为 `puppet/modules` 的目录中。以下步骤将在我们的仓库中创建新模块：\n\n- 1. 克隆仓库。建议对此部分使用非特权用户帐户：\n\
  ```\n$ git clone http://git@localhost/git/openstack/\n```\n- 2. 接下来，创建模块的目录：\n```\n\
  $ mkdir -p openstack/puppet/modules\n```\n- 3. 使用 `puppet module` 命令在目录中创建新模块：\n\
  ```\n$ cd openstack/puppet/modules\n$ puppet module generate openstack-profile\n\
  $ puppet module generate openstack-role\n```\n对于每个命令，你将被提示输入有关模块的一组元数据。输入你想要的尽可能多的信息或采用默认值。\n\
  - 4. 设置好模块后，返回到代码仓库的顶层，并使用以下命令将其检入版本控制：\n```\n$ cd ~/openstack\n$ git add puppet\n\
  $ git commit -m 'Initial check-in of the profile and role modules'\n$ git push origin\
  \ master\n```\n你应该会看到模块已提交并推送到仓库上的新 master 分支。\n- 5. 现在让我们将这些模块添加到我们的 Puppet master。为此，以\
  \ root 用户身份在服务器上的位置克隆仓库的干净副本：\n```\n# cd /srv\n# git clone http://localhost/git/openstack\n\
  ```\n\n你应该会收到类似 `Cloning into 'openstack'...` 的消息，这将表明命令成功。\n\n- 6. 我们将使用 Jenkins\
  \ 作业更新此仓库，因此将目录的所有权更改为 Jenkins 用户：\n\n```\n# chown -R jenkins:jenkins /srv/openstack\n\
  ```\n\n如果使用远程 Jenkins 服务器，你需要设置权限，以便可以远程登录此机器并在该目录中运行 `git pull` 命令。\n\n- 7. 接下来，将两个新的\
  \ puppet 模块符号链接到 master 上的 `/etc/puppet/modules`：\n\n```\n# cd /etc/puppet/modules\n\
  # ln -s /srv/openstack/puppet/modules/openstack-profile profile\n# ln -s /srv/openstack/puppet/modules/openstack-role\
  \ role\n```\n\n现在你应该在 master 上 `puppet module list` 的输出中看到这两个模块：\n\n```\n/etc/puppet/modules\n\
  ├── openstack-profile (v0.1.0)\n└── openstack-role (v0.1.0)\n```\n\n## 定义第一个角色和配置文件\n\
  \n我们已在设计文档中定义了一组主机组。我们将直接将它们映射到我们 Puppet 组合层中的角色。每个角色将在 role Puppet 模块中拥有自己的类和文件。角色由配置文件组成，每个配置文件代表\
  \ OpenStack 功能的一部分。例如，`mariadb` 配置文件将安装并配置我们部署的 MySQL 数据库服务器，`amqp` 配置文件将安装并配置 RabbitMQ\
  \ 消息服务器，等等。让我们从创建 Database Node 角色和相关配置文件开始。\n\n## 构建部署管道\n\n如前所述，我们将使用在 *第 2 章，Architecting\
  \ the Cloud* 中创建的 Packstack 配置作为我们组合层的起点。通常，当 Packstack 运行 时，它会删除用于在主机上安装 OpenStack\
  \ 软件的 Puppet 清单。但是，如果你指定 `-y` 选项，它将退出而不执行任何操作并保留 Puppet 清单。在 *第 2 章，Architecting\
  \ the Cloud* 中运行 Packstack 的原始主机上，使用相同的 answer 文件和 `-y` 选项重新运行 Packstack：\n\n```bash\n\
  # packstack --answer-file=packstack.answers -y\n```\n\n命令执行完成后，它将打印写入 Puppet 清单的目录名称。它应类似于\
  \ `/var/tmp/packstack/20151123-214424-gJbmJA`。进入该目录并将 Hiera 数据和清单复制到你的 CI 服务器。\n\
  \nPackstack 的 Puppet 清单使用 Hiera，Puppet 的 **key/value lookup tool**，使存储配置信息（如密码和\
  \ IP 地址）变得容易，以便它们不必存储在清单本身中。我们将继续采用这种做法。将 `hieradata` 目录复制到 CI 服务器上的 `/etc/puppet/hieradata`。要告诉\
  \ Puppet 引用此数据，创建一个名为 `/etc/puppet/hiera.yaml` 的文件，内容如下：\n\n```yaml\n---\n:backends:\n\
  \  - yaml\n:hierarchy:\n  - defaults\n  - \"%{clientcert}\"\n  - \"%{environment}\"\
  \n  - global\n\n:yaml:\n  :datadir: /etc/puppet/hieradata\n```\n\n现在，让我们创建第一个配置文件。在我们检出的\
  \ openstack 仓库副本中创建名为 `puppet/modules/openstack-profile/manifests/mariadb.pp` 的新文件。再次使用非特权帐户。\n\
  \n从 RDO 的 Newton 版本开始，Packstack 工具创建的清单已采用我们在本章中实现的 roles and profiles 模型。Packstack\
  \ 中存在两个角色——一个用于控制器，一个用于计算节点。我们将通过从控制器清单中复制相关配置文件来创建新角色。在 `mariadb.pp` 中，创建如下的类定义：\n\
  \n```\nclass profile::mariadb {\n  include '::packstack::mariadb'\n  include '::packstack::mariadb::services'\n\
  }\n```\n\n这使用我们在 Packstack 安装中用于安装数据库的相同 Puppet 代码定义了 `mariadb` 配置文件。现在创建名为 `puppet/modules/openstack-role/manifests/database.pp`\
  \ 的文件。在该文件中创建名为 `role::database` 的类，该类引用我们之前创建的配置文件：\n\n```\nclass role::database\
  \ {\n  include profile::mariadb\n}\n```\n\n将两个文件添加到提交，然后提交并推送到 Git 服务器。\n\n## 运行第一次构建\n\
  \n访问 Jenkins http://jenkins:8080/，将 `jenkins` 替换为你的 CI 服务器的 hostname。Jenkins UI\
  \ 应出现，提示你创建新作业。\n\n\n\n\n\n点击 **create new jobs**：\n\n![](img/2f752555f69992669defa8b25e6dcee9_100_0.png)\n\
  \n创建一个名为 `openstack` 的 **Freestyle project**，如下所示：\n\n![](img/2f752555f69992669defa8b25e6dcee9_101_0.png)\n\
  \n现在，我们将指定项目的选项。首先，在 **Source Code Management** 下，选择 **Git** 并为你的仓库指定 `http://localhost/git/openstack`。（这假定你使用的是我们在\
  \ CI 服务器上设置的 Git 服务器。如果使用远程 Git 仓库，则输入该仓库的克隆 URL。）\n\n![](img/2f752555f69992669defa8b25e6dcee9_101_1.png)\n\
  \n## Building the Deployment Pipeline\n\n接下来，我们将添加一个步骤来使用仓库中的最新代码更新 Puppet master。在\
  \ Build 下，点击 **Add build step** 并选择 **Execute shell**。指定以下命令：\n\n```bash\ncd /srv/openstack\
  \ && git checkout -f $GIT_COMMIT\n```\n\n这将把 Puppet master 拉取的仓库副本更新为我们正在测试的版本：\n\
  \n![](img/2f752555f69992669defa8b25e6dcee9_102_0.png)\n\n让我们运行一次构建以确保权限设置正确。保存项目。这会带你返回项目页面。选择\
  \ **Build Now**。你会在左下角的 **Build History** 选项卡中看到第一次构建：\n\n![](img/2f752555f69992669defa8b25e6dcee9_102_1.png)\n\
  \n点击构建编号将显示构建是否成功或失败的信息，并允许你查看构建的控制台输出。\n\n要验证 Jenkins 是否将我们的新更改拉取到模块中，请在 /etc/puppet/modules\
  \ 中查找新文件：\n\n```\n# ls /etc/puppet/modules/profile/manifests/\n# ls /etc/puppet/modules/role/manifests/\n\
  ```\n\n你应该在这些目录中看到 mariadb profile 和 database role 文件。\n\n## Writing the tests\n\
  \n对于我们的第一个测试，我们将使用 mysql 命令行客户端连接到我们配置的数据库，并验证我们是否可以使用之前指定的用户名和密码登录。由于我们没有将新的 roles\
  \ 和 profiles 应用到任何机器上，因此运行此测试时会失败。首先，在 CI 服务器上安装 mysql 客户端。我们将使用以下命令来验证与数据库的连接：\n\
  \n```\n# yum install -y mariadb\n```\n\n使用 which 命令验证命令是否已安装：\n\n```\n# which mysql\n\
  ```\n\n你应该在输出中看到 /bin/mysql。\n\n虽然我们可以在 Jenkins 构建的配置中直接编写测试，但最佳实践是将测试与源代码一起包含。在\
  \ Git 仓库的顶层创建一个名为 test 的目录来存放测试。使用与之前相同的已检出仓库版本和相同的非特权用户账户：\n\n```\n$ cd ~/openstack/\n\
  $ mkdir test\n```\n\n进入 test 目录并创建一个名为 test.sh 的 shell 脚本，该脚本尝试连接到数据库节点上的 MySQL。以下脚本目前足够：\n\
  \n```\n#!/bin/sh\n\n/bin/mysql -h db.example.com -uroot -psecret  -e \"show databases;\"\
  \n```\n\n根据你的主机名和密码，分别替换 -h 和 -p 选项的适当值。运行脚本应导致失败：\n\n```\n$ sh test.sh\n```\n\n\
  它应返回 Can't connect to MySQL server。\n\n将 test 目录添加到你的提交中，然后提交并推送更改：\n\n```\n$ cd\
  \ ../\n$ git add test\n$ git commit -m \"adding first test case\"\n$ git push\n\
  ```\n\n代码推送后，配置 Jenkins 运行测试。在 Jenkins UI 中，选择 openstack 项目并点击左侧导航中的 Configure。在\
  \ Build 下，点击 Add a build step 并选择 Execute shell。输入如下截图所示的 shell 命令：\n\n![](img/2f752555f69992669defa8b25e6dcee9_104_0.png)\n\
  \n保存配置，然后从左侧导航中选择 Build Now。此次构建应失败：\n\n![](img/2f752555f69992669defa8b25e6dcee9_104_1.png)\n\
  \n选择 **Console Output** 应显示我们在命令行上运行命令时收到的相同错误。现在让我们着手配置数据库服务器以应用我们的 profile 和 class，以便测试通过。\n\
  \n## Assigning the first role to a system\n\n为了整合所有内容，我们将从一台未配置的系统开始，安装并配置 Puppet\
  \ agent，并使其拉取我们定义好的配置。让我们先在 Puppet master 上将角色分配给系统。\n\n以 CI 服务器上的 root 用户身份，在 `/etc/puppet/manifests`\
  \ 中创建 `site.pp` 文件，将未配置的主机映射到角色。例如，如果我的数据库主机名为 `db.example.com`，以下片段即可工作：\n\n```\n\
  node \"db.example.com\" {\n  include role::database\n}\n```\n\n在主机本身上，使用以下命令安装 RDO\
  \ 仓库和 puppet agent：\n\n```\n# yum install -y https://rdoproject.org/repos/rdo-release.rpm\n\
  # yum install -y puppet\n```\n\n配置系统使用我们的 CI 服务器作为其 Puppet master。例如，如果我们的 CI 服务器是\
  \ `jenkins.example.com`，请输入：\n\n```\n# puppet config set server 'jenkins.example.com'\
  \ --section agent\n```\n\n最后，执行一次初始 Puppet 运行以设置证书：\n\n```\n# puppet agent -t\n\
  ```\n\n这应显示错误 `no certificate found and waitforcert is disabled`。\n\n以 root 身份登录\
  \ CI 服务器并使用以下命令批准证书：\n\n```\n# puppet cert sign db.example.com\n```\n\n你将收到证书已被签名且请求已被移除的通知。\n\
  \n回到数据库服务器，执行另一次 Puppet 运行以拉取配置：\n\n```\n# puppet agent -t\n```\n\n这将产生大量输出，因为系统会从\
  \ master 下载所有 Puppet 模块。你应该看到系统下载、安装并为 OpenStack 配置 MySQL 数据库。最后，再次从 Jenkins 运行一次构建以使其成功。\n\
  \n## Installing Keystone\n\n让我们在当前环境上迭代，添加另一个 profile 和 role。现在我们有了可用的数据库，安装第一个\
  \ OpenStack 服务 Keystone。首先编写单元测试。我们的测试将确保我们可以使用 Packstack 答案文件中指定的 admin 用户名和密码从\
  \ Keystone 获取令牌。这可以通过 curl 命令完成。在 Git 仓库的 test 目录下创建一个名为 test_keystone.sh 的文件：\n\
  \n```\n$ cd ~/openstack/test/\n$ vi test_keystone.sh\n```\n\n使用以下内容作为示例，将密码替换为 demo\
  \ 用户的密码（secret），将第一个控制器的主机名替换为 controller01：\n\n```\ncurl -i \\\n  -H \"Content-Type:\
  \ application/json\" \\\n  -d '\n  { \"auth\": {\n    \"tenantId\": \"demo\",\n\
  \    \"passwordCredentials\": {\n      \"userId\": \"demo\",\n      \"password\"\
  : \"secret\"\n    }\n  }\n}' \\\n  http://controller01:5000/v2/auth/tokens ; echo\n\
  ```\n\n现在运行脚本。它应以 Connection refused 错误失败。\n\n要使测试通过，请遵循与创建数据库 profile 时类似的过程。在\
  \ openstack 仓库中创建文件 puppet/modules/openstack-profile/manifests/keystone.pp，内容如下：\n\
  \n```\nclass profile::keystone {\n  include '::packstack::apache'\n  include '::packstack::keystone'\n\
  }\n```\n\n如前所述，创建一个名为 controller 的 role 并将 keystone profile 分配给该 role。创建文件 puppet/modules/openstack-role/manifests/controller.pp，内容如下：\n\
  \n```\nclass role::controller {\n  include profile::keystone\n}\n```\n\n将这些文件提交并推送到仓库：\n\
  \n```\n$ git add puppet/modules/openstack-profile/manifests/keystone.pp\n$ git add\
  \ puppet/modules/openstack-role/manifests/controller.pp\n$ git commit -m 'adding\
  \ a controller role and keystone profile'\n$ git push\n```\n\n再次从 Jenkins 运行构建以将文件推送到\
  \ Puppet master。我们尚未配置 Jenkins 运行新的测试，因此构建应成功，即使测试会失败。\n\n再次取一台未分配的机器并根据主机名分配 controller\
  \ 角色。在此示例中，我们将角色分配给名为 controller01.example.com 的机器。编辑 CI 服务器上的 /etc/puppet/manifests/site.pp\
  \ 并添加以下片段：\n\n```\nnode \"controller01.example.com\" {\n  include role::controller\n\
  }\n```\n\n在名为 controller01.example.com 的未配置主机上，安装 Puppet agent 并设置 Puppet master：\n\
  \n```\n# yum install -y https://rdoproject.org/repos/rdo-release.rpm\n# yum install\
  \ -y puppet\n# puppet config set server 'jenkins.example.com' --section agent\n\
  # puppet agent -t\n```\n\n再次，你需要在 Puppet master 上批准证书：\n\n```\n# puppet cert sign\
  \ controller01.example.com\n```\n\n\n\n\n\n在第二次执行 Puppet 时，Keystone 将被安装并配置完成。通过在\
  \ Jenkins 中添加一个类似如下的新构建步骤，启用我们在提交中编写的 Keystone 测试：\n\n![](img/2f752555f69992669defa8b25e6dcee9_108_0.png)\n\
  \n运行构建，并确保测试通过——此时 Keystone 已在第一个控制器上运行。\n\n## 完全自动化流水线\n\n到目前为止，我们一直在手动运行 Jenkins\
  \ 构建和 Puppet 执行。这样我们可以确保在 Puppet 执行完成后才运行测试。要消除流水线中的这两个手动步骤，有几种不同的方法。\n\n对于 Jenkins\
  \ 构建，可以将 Jenkins 配置为定期轮询源代码仓库，也可以将 Git 配置为在新代码推送时主动通知 Jenkins 并触发构建。Jenkins 可以配置为仅在代码推送到任何分支时构建，也可以配置为仅在代码推送到特定分支时构建。这样你可以忽略特性分支上的工作，只在合并到主分支时执行构建；或者忽略合并操作，只在特性分支上执行构建。像\
  \ Stash 和 Bamboo 这样的工具提供了更简单的集成方式。\n\n管理 Puppet 执行则稍显复杂。默认情况下，Puppet 大约每 30 分钟运行一次，从\
  \ Puppet master 获取变更并应用它们。虽然这对于希望分散执行以提升性能的大型环境是合理的，但等待半小时让环境获取你刚刚推送到 Git 的变更可能会令人沮丧。这个问题有两种可行的解决方案。第一，你可以将\
  \ Puppet 的执行作为测试过程的一部分在主机上运行。像 Ansible 这样的工具可以让这变得相对简单。第二，你可以缩短开发环境的执行间隔。这由 `/etc/puppet/puppet.conf`\
  \ 主配置块中的 `runinterval` 设置控制。\n\n一旦你完全自动化了流水线，你需要在将变更推送到 Puppet master 与运行单元测试之间添加某种延迟。这将使主机有时间获取变更并实施它们。例如，如果你将\
  \ `runinterval` 设置为 5 分钟，并期望变更在 5 分钟内应用，你可以在 Jenkins 作业中添加一个构建步骤，在执行单元测试前休眠 10 分钟。\n\
  \n## 总结\n\n在本章中，我们讨论了组织如何使用现代软件开发技术来提高其 OpenStack 部署的质量。我们使用 Puppet、Git 和 Jenkins\
  \ 构建了一个简单的部署流水线，并用它来部署和测试 OpenStack 基础设施的两个组件。在此基础上，可以以受控方式安装、配置和测试更多组件。\n\n对于习惯使用\
  \ Packstack 并快速搭建环境的人来说，这似乎需要付出很多额外努力。但根据我们的经验，如果没有适当的基础设施来管理和测试变更，这些部署在规模化时会变得难以驾驭。提醒一下，我们遵循的三个基本原则是：\n\
  \n- 小而可控的变更，而不是大规模升级周期\n- 测试驱动开发\n- 持续部署\n\n由于大多数组织在软件开发中已经具备围绕这些原则的一些经验和工具，部署流水线因组织而异。一个值得参考的优秀基础设施示例是\
  \ OpenStack 基金会自身用于测试变更的设施。有关该流水线的更多信息，请访问：\n\n```\nhttp://docs.openstack.org/infra/\n\
  ```\n\n## 参考资料\n\n- OpenStack Puppet 指南：http://docs.openstack.org/developer/puppet-openstack-guide/\n\
  - OpenStack Ansible 项目：https://wiki.openstack.org/wiki/OpenStackAnsible\n- OpenStack\
  \ Chef 项目：https://wiki.openstack.org/wiki/Chef\n- 设计 Puppet – 角色与配置文件，Craig Dunn：http://www.craigdunn.org/2012/05/239/\n\
  - OpenStack 开发者与社区基础设施文档：http://docs.openstack.org/infra/\n\n# 5\n"
- '## 构建以运营


  许多 OpenStack 管理员熟悉较为成熟的虚拟化平台。他们熟悉预装的操作工具，可以让管理员在几分钟内通过点击和配置构建一个功能完备的基础设施监控解决方案。不幸的是，OpenStack
  并不是那么简单。这并不意味着它不如其他平台；恰恰相反，它非常灵活，允许管理员选择自己的工具，并以最适合公司或组织需求的方式对其进行配置。


  在本章中，我们将讨论第 2 天运维，换句话说，就是 OpenStack 云构建、测试并具备运营条件后发生的事情。在此时，云已准备好接纳用户和工作负载。


  ### 本章预期成果


  本章旨在达到以下目标：


  - 对 OpenStack 云中真正需要监控的内容提供关键洞察。

  - 提供一套在监控系统中实施的最佳实践。我们将提供一些示例规范，帮助你入门，并允许你根据企业运维需求进行调整。

  - 基于实际案例，提供在 OpenStack 这类弹性云环境中进行有效容量规划的建议。

  - 广泛了解 OpenStack 运维中使用的工具，包括开源和商业工具。


  ## 日志、监控和告警


  运维 OpenStack 云最重要的方面之一是日志、监控和告警（LMA）。由于 OpenStack 不是传统基于裸机的基础设施平台，因此需要采用不同的方法。考虑到
  OpenStack 环境的规模和弹性，传统的 LMA 方法往往力不从心。此外，旧的二元告警方式——例如“此服务已关闭”“资源使用率已达 95%”甚至“文件系统已满”之类的消息——无法提供真正了解
  OpenStack 云健康状况所需的运营信息深度。


  虽然有许多不同的工具可以实际监控日志事件并从运行 OpenStack 基础设施的系统创建告警，但在本章中，我们将更侧重于架构原则，这些原则将帮助你选择日志、监控和告警工具。


  无论使用什么工具进行日志、监控和告警，从架构角度来看，解决方案都应满足以下要求：


  - 对 OpenStack 基础设施提供实时或近实时的内部检查和告警

  - 支持某种形式的发现和配置管理

  - 可扩展以支持企业云

  - 具备自我监控能力，并能够配置为高可用


  ### 日志


  OpenStack 云运营数据的重要来源之一是日志。不仅主机操作系统的日志可用，而且作为 OpenStack 一部分运行的每个项目都有单独的日志。然而，尽管日志是分开的，建议将所有日志以相同的
  syslog 日志级别发送到 syslog，作为起点，如有需要再进行修改。


  以下是从 `nova-api.log` 中提取的 OpenStack 日志条目成功操作的示例：


  ```

  2016-07-08 07:36:45.613 3474 INFO nova.osapi_compute.wsgi.server [req-b5ff3321-19cc-4ce8-af9c-0ed59ae21ac7
  f32900acc09d4898b091b2caa4900112 6f0117ddd81b4dc78a8f4ce4dd5b04f5 - -] 10.0.3.15
  "GET /v2/6f0117ddd81b4dc78a8f4ce4dd5b04f5/flavors/1 HTTP/1.1" status: 200 len: 613
  time: 0.1168451

  ```


  出于安全和分析的目的，日志应发送到远程集中式 syslog 服务器。理想情况下，该服务器将是进行日志检查、分析和编目的地方，并且应托管在具有适当 CPU 和内存以支持这些工作负载的服务器上。日志检查将针对日志条目的内容进行，因为这些日志可能包含以下部分或全部内容（基于上述日志的示例）：


  - 严重性级别（`INFO`）

  - 发送日志的服务器（`10.0.3.15`）

  - 发送日志的服务（`nova.osapi_compute.wsgi.server`）

  - 元数据，如 `tenant_id` 和 `request_id`（`6f0117ddd81b4dc78a8f4ce4dd5b04f5` 和 `req-b5ff3321-19cc-4ce8-af9c-0ed59ae21ac7`）

  - 服务中的错误代码，甚至性能数据，如 HTTP 响应时间（由于创建请求和 API 交互的分段特性，对于异步连接，其可用性有限）


  以下是错误示例：


  ```

  nova-scheduler.log:2016-07-08 07:26:48.687 1159 ERROR oslo.messaging._drivers.impl_rabbit
  [req-c419cec6-9847-4692-8c61-733524097546 -- - --] AMQP server on 10.0.3.15:5672
  is unreachable: [Errno 111] ECONNREFUSED. Trying again in 4 seconds

  ```


  如上所示，这是一个结构化的日志文件，可以通过许多不同的工具进行解析，以提取严重性、服务、时间戳和其他相关元数据。此外，这些数据可以使用开源分析工具（如 **ELK（ElasticSearch、Logstash
  和 Kibana）**）进行搜索。有关这一行业标准数据挖掘平台的基本信息，请访问 `https://www.elastic.co/webinars/introduction-elk-stack`。该页面还包含一个帮助你入门的网络研讨会。





  这种使用日志处理平台、搜索平台、图形仪表盘和告警平台的概念，同样也被许多大型商业和研究生产云用作OpenStack基础设施监控解决方案。例如，CERN和GoDaddy都在使用ELK来为其OpenStack云提供可视化。CERN的仪表盘（http://openstack-in-production.blogspot.com/2013/10/log-handling-and-dashboards-in-cern.html）看起来与此类似（它展示了Nova
  API统计信息）：


  ![](img/2f752555f69992669defa8b25e6dcee9_114_0.png)


  CERN OpenStack云团队，2013


  然而，并非所有解决方案都基于ELK；例如，Mirantis分发了一款名为StackLight的产品，它使用了不同的日志处理和格式化工具。除了Kibana之外，它还将Grafana添加到了可视化仪表盘套件中。Mirantis的解决方案还使用了不同的组件进行日志收集，并添加了InfluxDB作为时间序列数据的数据库。StackLight将Nagios
  Core集成到监控平台中以提供告警功能。这一系列免费软件应用程序由一系列插件（https://www.mirantis.com/validated-solution-integrations/fuel-plugins）自动配置为监控平台，并安装到Fuel（Mirantis最近开源的安装程序）上：


  ![](img/2f752555f69992669defa8b25e6dcee9_115_0.png)


  类似地，还有其他发行版拥有各自定制的监控平台；然而，尽管它们在软件选择上有所不同，但它们的架构相似，并且提供了与前述示例类似的功能。它们都基于本章前面讨论的日志分析基本原理，并提供了可用于数据可视化的实用工具。


  ## 监控


  许多组织在应用程序部署到上线之间的阶段举步维艰。这主要是因为对OpenStack云运维与传统遗留平台之间的差异缺乏理解。很多时候，这是最难克服的障碍，因为它需要在工程、运维和开发人员与基础设施、应用程序和平台交互方式上实现一些根本性的文化转变。


  虽然本节中我们将介绍的一些实践方法可能也适用于工作负载监控，但本章讨论的是OpenStack基础设施的运维监控，而不是运行在OpenStack上的工作负载。与OpenStack基础设施不同，运行在OpenStack云上的工作负载在许多情况下可以由传统平台进行监控。有许多专门为监控运行在OpenStack云上的工作负载而构建的工具，既有开源的也有商业的，但由于该领域的解决方案非常丰富，本章将不涉及该主题。我们将重点关注基础设施监控。


  ## 监控什么


  一般来说，支持OpenStack管理的进程有许多类别，如下所示：


  - 无状态服务和OpenStack API端点，如`nova-api`、`glance-api`和`keystone-api`，它们接收用户输入。

  - 连接到消息总线的OpenStack服务工作进程，如`nova-scheduler`，它接收并处理来自其他进程（如前面列出的那些）的用户请求。

  - 属于OpenStack但并非实际代码库一部分的其他程序，它们更像是实际API层的使能器，提供数据库、复制、虚拟化等服务。其中一些组件包括MySQL、RabbitMQ、Memcached、HAProxy、Corosync和Pacemaker。由于我们的Packstack环境不是高可用环境，因此其中一些元素不在该环境中；然而，大多数其他发行版（Mirantis、Canonical、Red
  Hat、IBM、HP等）的生产部署都拥有这些或其他类似工具来提供类似功能。我们将在本章后面简要提及这些与运维和监控相关的工具。

  - 宿主机操作系统。在你的安装中，你可能安装了RHEL或CentOS。这两种选择都需要进行标准的操作系统、硬件和容量监控，以确保我们安装的基础——节点本身——正常运行。这种监控可以是代理、IPMI、SSH或其他接口，具体取决于监控平台。


  ## 监控性能


  监控性能通常衡量进程、连接或工作流的响应能力。在云计算中，它通常用于定义完成某些工作流所需的时间。其中一些工作流包括：创建实例、卷、网络或其他OpenStack资源。性能的关键指标通常可以从OpenStack服务日志及其包含的时间戳中提取。由于实例创建是一个跨项目的工作流，性能影响可以通过每个项目每个请求的开始和完成时间以及项目之间的交接来进行端到端跟踪。其他衡量性能的方法可能使用OpenStack命令的输出，利用原生时间测量工具，以及通过修改OpenStack代码来添加插桩。


  ## 监控资源使用情况


  在本节中，我们将仅部分涉及资源使用监控。在后面的章节中，我们将更深入地讨论它与容量规划的关系。然而，资源使用监控的目的是让操作员能够随时通过OpenStack
  API检索不仅是一个用户，还包括一个租户或整个云所使用的资源量。这种监控不必实时执行。在大多数情况下，资源监控是利用特定时间段内收集的数据进行的活动。在本章后面，我们将介绍Ceilometer项目，它是OpenStack的计量项目。


  ## 告警


  告警过程是任何运维模型中最重要的一步之一。告警是监控平台就超出设定阈值的情况向操作员发出警报的过程。这些告警可以通过多种方式传递，例如Remedy等工单平台、电子邮件、短信、IRC，甚至与Slack（www.slack.com）等通信平台的集成。这些告警应包含有关触发它们的事件的基本信息。这可以是任何从良好状态变为非良好状态的关键值，或者是违反了SLA级别的关键值。在所有情况下，这些告警都是由状态变化驱动的，可能不是问题的直接指示，但可能是未来问题的征兆。


  因此，告警应该：


  - 显示受影响的OpenStack服务

  - 包含导致告警的状态变化的一般描述

  - 如果实现的话，具有由运维人员定义的严重级别

  - 能够在维护等事件期间被标记为误报或被禁用

  - 能够以逻辑方式将告警串联在一起，以触发额外操作并提供初步关联

  - 能够引用时间序列统计数据，如中位数、百分位数和标准差

  - 提供处于良好、警告或失败状态的服务的即时视图


  信不信由你，在正确配置的OpenStack环境中看到的大多数错误并不严重，也不表示完全中断。OpenStack环境中的大多数错误通常是由于供应失败或其他类似的非中断性警告造成的。请记住，即使OpenStack控制平面完全故障，工作负载也（在大多数情况下）会继续运行。因此，拥有一个能够为错误确定适当告警级别的监控解决方案至关重要。这解决了过度告警运维人员并导致他们排查轻微警告的问题，而实际上这些警告可能只是次要问题的指示，应作为趋势指标来关注。一个简单的需求应包括类似以下要点的策略：


  - 导致失败状态的严重错误应始终在告警中报告，并需要立即采取行动

  - OpenStack HA环境中的其他问题，例如在三控制器环境中一个控制器上的一个服务故障，不应标记为严重，而应标记为警告或延迟状态，以表示高可用性降级





  在 OpenStack 云投入生产之前，或在构建为镜像生产环境的 staging 云上，对其进行负载测试是一种测试其容量的绝佳方式。有一个名为 Rally（http://rally.readthedocs.io/en/latest/index.html）的开源项目，是识别环境中功能性故障和性能瓶颈的绝佳工具。以下图表描述了该工具的基本功能：


  ![](img/2f752555f69992669defa8b25e6dcee9_120_0.png)


  Rally Actions – Copyright 2016 OpenStack Foundation


  ## 活动监控


  OpenStack 中有相当多的活动需要监控。一般来说，有三个主要监控区域：


  - OpenStack 服务（用于编排和配置的必需项）

  - 进程（OpenStack 组件的实际运行进程）

  - HA 控制集群（为云提供 HA 能力的组件）


  ### 服务


  检查服务主要是关于可用性。如果服务宕机，云用户将面临错误，阻止他们使用 API，进而与云交互。这些服务检查应使用来自监控平台生成的模拟事务定期执行。我们称之为模拟，因为它们不需要真实工作负载可能需要的镜像和部署后配置的所有特定自定义。虽然使用真实工作负载是可能的，但由于在常规部署负载之外定期运行实际事务所需的额外开销，它并不那么理想。合成事务应从专用用户在其自己的项目中启动，并设置严格的配额。这样，事务就可以使用与真实流量分开的租户和用户
  ID 进行跟踪。


  这些检查应针对端点（如果在 HA 配置中配置）的 VIP 地址启动，并且仅报告两种可能的结果：已完成或失败。这样，测试就可以限制为简单操作。复杂的模拟将涉及其他端点，并可能提供误报。例如，如果要测试
  Nova API 端点，一个好的测试是检查与监控租户关联的 flavors。对 Nova 项目的 API 的示例调用如下：


  ```

  GET /v2.1/{tenant_id}/flavors

  ```


  更多 API 规范可在 http://developer.openstack.org/ 找到。


  为了通过 Nagios 等监控平台进行此 API 调用，平台可以配置为使用插件脚本或一组插件脚本中的 nova CLI 客户端来调用 Nova 项目的 API，该脚本通过
  Python 或其他脚本语言调用 API。这些插件脚本，其中许多可免费获得，位于 http://www.nagios.com，可以用于使用模拟操作检查 API
  端点状态。例如，一些 OpenStack 基础设施插件已贡献给 Nagios 目录，例如 Rakesh Patnaik 的名为 check_nova_api 的插件，位于
  https://github.com/rakesh-patnaik/nagios-openstack-monitoring，它使用 Python 和对 Nova
  API 端点的直接调用来检查 Nova 的 API 服务。nagios-openstack-monitoring 插件不仅具有监控 API 端点的能力，插件还包含检查进程的脚本。


  ### 进程


  许多独立进程支持 OpenStack 的运行。其中许多进程在控制器节点上运行，需要运行以提供 API 可用性（nova-api 进程）以及协调控制堆栈其他部分功能的进程（MariaDB
  和 RabbitMQ）。这些进程可以通过本地方式、通过 shell 脚本驱动的远程 SSH 代理，或通过 Ansible、Chef 和 Puppet 等软件实现的自动化进行检查。此外，如前所述，Nagios、Zenoss
  和 Zabbix 等监控平台的插件也包含这些进程检查。


  ### HA 控制集群


  许多不同的发行版使用 HAProxy 在多个 OpenStack 控制服务器（最少三个）之间实现 active/active 可用性。此 HAProxy 服务充当反向代理和简单负载均衡器，配置为在
  OpenStack 端点地址前侦听 VIP 地址。常见做法是在 HA 集群中的每个控制器节点上运行 HAProxy。由于 HAProxy 服务与为 OpenStack
  API 服务配置的 VIP 地址绑定，如果 HAProxy 下的这些服务失败，则 HAProxy 本身将故障转移到另一个控制器节点以提供服务。然而，HAProxy
  不监控或故障转移进程，也不将 VIP 地址移动到其他集群成员。因此，应使用 pacemaker 或 keepalived 等额外工具来满足此要求。


  以下图表显示了一种配置 HA 控制器的逻辑图：


  ![](img/2f752555f69992669defa8b25e6dcee9_123_0.png)


  Mirantis OpenStack controller HA architecture – Mirantis


  有关此主题的更多信息可在 http://docs.openstack.org/ha-guide/controller-ha-haproxy.html 找到。或者，也可以使用其他外部软件或硬件负载均衡器代替
  HAProxy。


  鉴于此 HA 架构，以及对每个 HA 控制节点上进程的监控，可能在三节点集群中，单个项目的三个控制器中的两个的进程完全宕机，OpenStack 仍然完全可用。这就是为什么，正如服务监控一样，进程状态和整体健康警报必须非常谨慎地自定义。仅仅因为一个控制器的单个进程（例如，nova-api）失败，而
  HA 基础设施仍然运行，并不意味着监控解决方案应显示 OpenStack 云已失败的严重警报。


  ## 容量规划


  作为属于 IT 财务管理的四个主要 ITIL 流程之一，容量规划显然是任何云战略的重要组成部分。然而，并非所有云战略都相同。区分企业虚拟化和 OpenStack
  弹性云中的工作负载非常重要。对于虚拟化，每个工作负载，在许多情况下每个服务器都很重要。如果单个虚拟化服务器过度使用或以某种方式降级，则会调查、扩展和/或修复该特定服务器。一个常见的类比是将虚拟化
  VM 和服务器与“宠物”进行比较。在纯 OpenStack 云世界中，除了当虚拟化工作负载迁移到弹性云，从而将 IT 即服务工作负载带入真正的云之外，没有此类单个实例（宠物）的构造。OpenStack
  是围绕工作负载是短暂的、故障是预期的、增长应水平扩展而非垂直扩展这一前提构建的。如果一个工作负载失败，另一个工作负载将简单地在其位置启动。“牲畜”一直是用来解释这种短暂实例和工作负载的想法的类比。在这个类比中，牲畜只是资源；如果它们死亡或无法修复地受伤，它们就被简单地销毁并替换。在
  OpenStack 中，这一想法甚至扩展到底层硬件。在许多公司中，计算服务器只是要按需使用的白牌硬件计算服务器资源。如果它们失败，其他在线且同样无处不在的资源将取而代之（以脚本化灾难恢复的方式或通过有足够的过剩容量）。此外，如果计算服务器因高负载而变慢，则会添加更多无处不在的资源（计算服务器）以增加容量。这是谈论弹性容量时需要把握的一个重要概念。在此定义下，计算服务器是通用、统一、可丢弃且可扩展的资源，可用容量发生变化时，增长不是线性的，而是基于需求的。然而，需求会随着开发周期、开发方法、一年中的时间以及生产周期而变化。





  这种需求变动性通常是线性的，甚至可能随着云采用而呈指数级增长。然而，在构建 OpenStack 环境时，需要采用适当的方法来帮助制定最准确的容量规划，并为日后制定战略性和战术性决策奠定基础。这与虚拟化容量规划有很大不同，虚拟化容量规划往往更线性，因为工作负载更持久，并且不会频繁回收。


  ## 规划你的城市


  与土木规划和建筑非常相似，OpenStack 云就像一个由租户组成的城市，需要资源才能存在。然而，在资源有限的情况下，不能让租户自行管理；资源耗尽的风险太大了。这类似于公寓楼的居民拥有无限的电、水、燃气、有线电视和空间，而无需计量或支付任何费用。许多居民可能会认为资源是无限的，他们可以无限扩大和超订一切而无需承担后果。因此，无论是在土木工程还是
  OpenStack 云中，都需要运营方为最终用户进行容量管理和风险缓解。这意味着要找到一种方法来跟踪、分析并向最终用户或其租户成本中心收取费用（或至少展示成本）。这包括创建预定义的结构化资源包，用户可以从中选择，以及创建和维护配额系统。


  容量风险缓解和规划通过执行三个不同的操作来完成：


  - 跟踪使用情况

  - 分析增长

  - 计费/成本分摊（Chargeback/Showback）


  ## 跟踪使用情况并分析增长


  为了跟踪任何资源的使用情况，我们首先需要标准化我们要统计的单位。在云计算中，利用 OpenStack 数据库中已有的数据，以及使用计量项目 Ceilometer，可以实现极细粒度。虽然可以跟踪许多不同的计量器，但让我们从跟踪随时间使用的单个
  vCPU 数量、随时间变化的内存量和精确到分钟的磁盘使用情况开始。然而，让用户自行组合这三个数据点可能会导致数万种组合。因此，在 OpenStack 云中，我们使用
  flavor（实例规格）来限制用户的选择。Flavor 是虚拟硬件模板，是计算、存储甚至网络元素的逻辑分组。


  通过将资源逻辑分组为可管理的产品，这简化了计费/成本分摊的等式。在我们的示例中，我们仅考虑 vCPU 和内存；然而，同样的原则也适用于持久性和临时存储以及网络资源分配。


  继续我们土木工程的类比，我们可以将 flavor 视为一个大家庭，希望入住一栋有空间要求的公寓楼。在这个例子中，我们的一个约束是，65,536 平方英尺的建筑最多只能有
  16 个房间，并且根据规定，只能容纳 64 人。然而，由于这是一栋新公寓楼，房间大小尚未确定，物业经理会根据家庭的需求来建造房间。物业经理决定让前三个申请人选择房间大小，并根据家庭所需的规格向他们收费。


  让我们从每个家庭的请求开始，每个请求都有精确且独特的要求：


  - 3 人家庭需要 1,024 平方英尺

  - 7 人家庭需要 8,096 平方英尺

  - 29 人家庭需要 30,720 平方英尺


  下面我们可以看到，使用这些独特且任意的房间大小，一个 65,536 平方英尺的房屋会是什么样子：


  ![](img/2f752555f69992669defa8b25e6dcee9_126_0.png)


  我们现在共有 49 人和他们的物品占据着这座容量为 64 人的建筑。这留下了可容纳 15 人的空间，但分散在大量被浪费的不同类型和配置的空间（资源）中，因为上面列出的现有家庭分组都不再能完美地填满现有空间中的同等房间；物业经理只有两个选择。他可以为不同家庭创建额外的不规则大小的公寓，以容纳另外
  15 人，并希望有该规模的家庭申请，或者购买新房子，继续使用现有的不规则尺寸，而放弃房产中浪费的空间。这就是 OpenStack 云中没有进行 flavor 标准化时发生的情况。


  将计算节点视为货运货车，将 flavor 视为箱子。使用标准尺寸的箱子，打包轻松且效率高。将箱子视为 vCPU；现在，我们将所有箱子视为正方形，尺寸如下：


  - 1 英尺宽的箱子

  - 2 英尺宽的箱子

  - 4 英尺宽的箱子


  这条线路上人们运送的大多数箱子都是 2 英尺规格的，但还有另外两种类型的箱子（1 英尺和 4 英尺）。然而，交通运输部只允许每辆卡车装载 64 英尺的箱子。不过，这次我们创造了可堆叠的空间。现在，当我们拥有互为指数的结构化箱子分组时，看看会发生什么：


  ![](img/2f752555f69992669defa8b25e6dcee9_127_0.png)


  为了确定计算容量，我们使用期望的 VM 密度；在本次讨论中，我们将估计值设置为每台计算服务器 40 个 VM，并将密度乘以组织中最常见的 flavor：


  40 x 2 vCPU = 80 vCPU（假设非超线程 CPU，如果是超线程，则将此数字乘以 1.3）


  40 x 4096 = 160 GB RAM（假设 RAM 超订比为 1:1）


  根据经验法则，计算节点在满载时需要约 20% 的总 vCPU 和 RAM 用于开销和操作系统进程。这些资源需要包含在所需总资源的计算中：


  包含操作系统开销所需的 vCPU 数量：80 * 1.20（100% + 20%）= 96 vCPU


  包含操作系统开销所需的内存：160 * 1.20 = 192 GB RAM


  因此，为了拥有一个精确扩展的起点，我们需要一台硬件支持 96 个 vCPU 的计算服务器。我们将 vCPU 的超订比设置为 8:1，因此我们需要将所需的 vCPU
  数量除以 8，以获得所需的 CPU 核心数。超订比可能不同，因此请根据实际情况调整计算，如下所示：


  所需 vCPU 总数 / 超订比 = 核心数


  96 / 8 = 12 个 CPU 核心


  因此，基于此计算，我们需要 12 个 CPU 核心来支持该云的平均 flavor（命名为 medium）的大约 40 个实例。由于现在大多数服务器都是双核或四核型号，我们只需要一台配备
  6 核处理器的双路 CPU 服务器。对于此示例，Intel E5-2620v3 或 E5-2643v3 之类的处理器足以满足一般工作负载。


  对于内存，我们只需确保每台计算服务器具有 192 GB RAM，并且由于这是一台配备 12 个 DIMM 插槽的 6 核双路服务器，每个处理器内存组需要 32
  GB。因此，作为可视化表示，下图大致展示了逻辑内存分配的样子。


  ## 为运营而构建


  在服务器达到其 40 实例加一的限制后，仍有一些剩余资源。这些内存可用于额外的实例，或留作计算服务器在负载时操作系统峰值备用。


  | 计算服务器 - 192GB RAM - 2 x 2643 Intel CPU（96 个 vCPU @ 8:1 超订） |

  |---|

  | S | S | L | M | M | L |

  | S | S | L | M | M | L |

  | M | S | S | M | S | S | S | S |

  | M | S | S | M | S | M |

  | L | M | M | L | M | M |

  | M | M | M | M |

  | M | M | M | M |

  | 为操作系统保留的 CPU |


  在上图中，我们有一个明细，如下所示：


  | Flavor 大小 | 实例数 | vCPU | 内存（GB） |

  |---|---|---|---|

  | 小型 | 13 | 13 | 26 |

  | 中型 | 24 | 48 | 96 |

  | 大型 | 4 | 16 | 32 |

  | 总计 | 41 | 78 | 154 |

  | 为操作系统保留 |  | 18（约20%） | 38 GB（约20%） |


  这显示了我们之前 flavor 要求的近乎理想的配置，尽管我们并没有用*全部*中型镜像来填充它。然而，如果添加了更多 flavor，而不遵循前面推荐的模型，最终会出现间隙以及
  CPU 和内存的浪费，具体取决于 flavor 的多样性和这些 flavor 的实例数量。


  将这种 flavor 确定性作为最佳实践，将使运维人员能够更准确地测量/监控以下内容：


  - 整体容量

  - 随时间增长

  - 利用率和过度利用

  - Nova 对 VM 的正确放置


  许多公司花费了大量时间制定内部策略，用于收集、管理和分析来自其云的数据，以回答所讨论的主题。然而，近年来，出现了许多不同的云管理平台（CMP）和专用货币化与管理软件，以简化计费和成本分摊（chargeback
  and showback）。然而，OpenStack 的遥测项目 Ceilometer 一直面临规模挑战。虽然技术上已取得进展，但现在一些容量规划软件已配置为直接使用
  OpenStack API，甚至不需要 OpenStack 遥测服务（Ceilometer）。




  ## 为运营而构建


  云容量必须成为更具确定性的容量规划方法论的一部分。始终保持适当的弹性并非易事，必须仔细监控，以在资源的可用性与折旧之间取得平衡。用户往往认为云资源是无限的；但遗憾的是，事实并非如此。所有资源请求，即便是半虚拟化请求，最终都会映射回容量有限的物理设备组。不幸的是，最终用户往往不知道或不知不觉地忘记这一模式。因此，当用户无需为资源消耗付费或资源消耗不被追踪时，他们有时会重新养成囤积资源的习惯。不幸的是，这种行为很可能是多年遗留基础设施流程的副产品——过去开发团队需要花费数月时间才能获得额外的基础设施。


  考虑到这些限制和需求，云管理或运维团队负责 OpenStack 云各方面容量规划的工作变得越来越重要。控制这种囤积行为最简单的方法是通过计费（chargeback）或用量展示（showback）。这使
  OpenStack 管理员能够定期向用户说明其资源消耗情况。此外，如果启用了计费功能，云部门或公有云提供商也能借此收回维护弹性环境的成本。


  为了能够向用户展示资源消耗并向其收费，管理员需要遵循前述容量规划建议，同时为云用户提供定期账单、部署前资源成本、运行成本以及支付或计费选项等功能。虽然能够实现这些功能的大多数软件都属于商业领域，但也有少数开源工具可以用于提供部分功能。


  以下是一些领先的容量规划和计费解决方案示例：


  | 名称 | 公司 | 开源/闭源 | 支持 | 网站 |

  |---|---|---|---|---|

  | CloudKitty | Objectif Libre | 开源 | OpenStack | https://wiki.openstack.org/wiki/CloudKitty
  |

  | HP | Cloud Optimizer 3.0 | 闭源 | OpenStack AWS Xen VMware Hyper-V | http://www8.hp.com/us/en/software-solutions/capacity-planning-server-virtualization-management/
  |

  | Red Hat | Cloudforms ManageIQ | 闭源；开源 | OpenStack AWS Google | https://access.redhat.com/documentation/en-us/red_hat_cloudforms/4.1/html/manageiq.org/
  |

  | Talligent | OpenBook 3.0 | 闭源 | OpenStack AWS VMware | http://talligent.com/openbook-faqs/
  |


  ## 备份与恢复


  通常，传统 OpenStack 运维人员首先想到的并不是备份与恢复。这通常是因为传统上在 OpenStack 云上运行的是临时性工作负载，它们存在时间并不长，不足以进行备份。然而，随着
  OpenStack 的采用率呈指数级增长，我们看到越来越多的生产级 OpenStack 部署包含持久化工作负载，尤其是在 IT 即服务（IT-as-a-service）云中。因此，备份关键基础设施数据以及云上运行的持久化工作负载的需求应运而生。


  ### 基础设施备份架构


  虽然运行在 OpenStack 云上的工作负载是舞台上的明星，但基础设施才是真正的英雄。在可用性方面，让 API 保持可用并 100% 不间断运行应该是任何运维人员的最终目标。然而，这并非现实。即使有适当的生命周期管理和变更流程，数据损坏仍可能发生。由于
  OpenStack 的核心是一个运行在 MariaDB 上的结构化数据库，因此理所当然应该以高可用配置运行它。但是，如果在运行过程中发生错误，并且这些错误被复制到所有
  HA（高可用）节点，会发生什么？故障。此时，如果没有备份和恢复，不仅 API 会离线（尽管工作负载可能仍在线），而且关于每个实例的所有数据以及这些实例的网络配置都会丢失。这对任何
  OpenStack 云来说都是一场真正的灾难。


  ### 备份策略——需要备份什么


  为了确保 OpenStack 云能够正确恢复，必须定期备份一些关键数据。这些备份的频率应与您的恢复时间目标（RTO）保持一致，即灾难发生后为避免对业务连续性造成不可接受后果而恢复云所需的时间。您的组织内部可能还有必须遵守的恢复点目标（RPO）和服务级别协议（SLA）。虽然这些指标更常用于持久化工作负载的灾难恢复，而非基础设施恢复，但总有例外情况。


  要从全面或局部灾难中恢复，你需要备份的关键项目如下表所示：


  | 数据项 | 项目 | 位置 | 说明 |

  |---|---|---|---|

  | MySQL 数据库 | OpenStack 数据库 | 控制节点 | 使用 `mysqldump` 导出数据库内容。将数据复制到备份服务器。 |

  | Nova | 计算 | 计算控制节点 | 复制 `/etc/nova` 并将副本复制到备份服务器。在计算节点上复制 `/var/lib/nova`，但 `/var/lib/nova/instances`
  除外。实例备份将在后文讨论。 |

  | Glance | 镜像仓库 | 控制节点 | 复制 `/etc/glance` 和 `/var/lib/glance` 目录。或者使用 rsync 将 `/var/lib/glance/images`
  同步到另一台备份服务器。 |

  | Keystone | 身份 | 控制节点 | 备份 `/etc/keystone`。如果 `/var/lib/keystone` 中有任何数据，也进行备份。
  |

  | Cinder | 块存储 | 控制节点 | 备份 `/etc/cinder`。备份 `/var/lib/cinder`。 |

  | Swift | 对象存储 | 控制节点 | 备份 `/etc/swift`；其中包含配置文件以及 ring 和 ring builder 文件。缺少这些文件，你的数据将完全无法访问。在备份之前，请先将这些文件复制到每个存储节点。
  |


  一旦所有这些文件都已备份并移动到安全的现场或异地灾难恢复服务器，要恢复 OpenStack 云，基本上需要停止现有云上的所有服务，将所有文件复制回原位，从导出文件中恢复数据库，然后重新启动云。


  虽然这看起来简单，但很耗时。如果这个计划看起来无法满足您的 RTO 需求，还可以采用其他方法来让 OpenStack 实现高可用，并构建一个兼具多云和多区域特性的架构，在灾难期间具备故障转移并恢复到完全不同的站点的能力。这些解决方案包括跨
  WAN 链路复制 Cinder 存储、自定义迁移中间件解决方案，以及一套网络方案，用于将灾难恢复云上线，并提供满足业务需求所需的所有访问和配置。该解决方案还可以通过复制数据库元数据以及为
  Glance 镜像提供全局对象存储来扩展；不过，可以想象，这是一项相当复杂的架构和工程壮举，超出了本书的讨论范围。


  ### 工作负载备份架构


  如前所述，工作负载是云存在的根本原因。在一个理想的世界里，所有应用都应该是云原生的、完全分布式的 12 因素应用。它们不需要备份，因为它们会在多个云之间进行区域性或全球性分布，并水平扩展以在一个地点发生灾难时自动伸缩。然而，对许多组织来说，这绝非现实。许多组织需要在生产云中运行持久化工作负载和传统应用。然而，这些应用的传统备份方法（尤其是在裸机环境中）与云环境中的方法截然不同。由于大多数资源都已虚拟化，租户网络相互隔离，传统的备份与恢复架构在
  OpenStack 中根本行不通。因此，组织不仅需要面向工作负载的灾难恢复备份解决方案，还需要有时称为备份即服务（BaaS）的运营备份解决方案。


  ### 灾难恢复规划


  由于 OpenStack 上需要备份的工作负载主要由持久化实例组成，我们必须备份实例的所有部分，不仅是保存所有运行时和持久化数据的磁盘镜像，还包括使该工作负载实例能够从备份中恢复所需的元数据。然而，OpenStack
  缺乏提供基于策略的、自动化的、全面备份与恢复解决方案的能力。尽管 OpenStack 提供了一些零散的工具和 API 来提供某种备份能力，但即使是像 OpenStack
  的 Cinder API 这样支持完整卷快照和增量卷快照的工具，仍然会造成中断：工作负载必须下线才能创建快照，否则就有数据损坏的风险。





  ## 为运维而构建


  为了说明这一点，我们可以看看对基本工作负载执行简单备份的典型步骤：


  - 1. 暂停实例。

  - 2. 分离 Cinder 卷（根卷和任何其他非根卷）。

  - 3. 为每个实例创建实例快照，并将其存储在 Glance 中以便日后检索。

  - 4. 使用 Cinder 备份上述所有卷，并将它们放入对象存储（Swift/Ceph）中。

  - 5. 记录这些副本，因为 OpenStack 不会为你跟踪它们。

  - 6. 恢复实例。


  这些步骤命令密集、耗时、需要自定义脚本，而且由于包含手动文档记录步骤，因此容易出错。这些步骤也可能不符合组织现有的内部备份策略。


  这种手动备份操作方式已经过时且功能有限。任何企业级备份解决方案都应做到无影响、能够进行增量备份、可针对每个工作负载进行定制，并且在工作负载分布在多个实例上时能够跨多个实例进行备份。此外，租户应能够轻松备份自己的工作负载，并在提交到存储之前进行测试，同时能够在需要时恢复和重放备份。工作负载备份软件还应提供灾难恢复组件，以便在发生灾难时，备份和复制的资源可在不同的地理位置使用，以防任何一个地点遭到破坏。


  在考虑使用 OpenStack 原生快照的工作负载备份解决方案时，开源和商业选项都很少。一个开源选项是 Raksha (https://wiki.openstack.org/wiki/Raksha)，它是后来成为
  TrilioVault (http://www.triliodata.com/about/) 的 OpenStack 项目版本，TrilioVault 是一个专为
  OpenStack 设计的数据保护、备份和灾难恢复商业产品。Trilio Data 采用了前面提到的工作负载备份快照流程，并设计了一个灵活且可扩展的解决方案。使用
  TrilioVault，快照的完整备份和增量备份都可以存储在各种存储上，包括 NFS、Swift 和其他第三方阵列。恢复也是 GUI 驱动的，简化了原本需要由一组自制脚本驱动的备份和恢复操作。TrilioVault
  还提供了数据保留、保护和数据完整性等附加功能。


  此外，传统的基于文件的备份解决方案可以在 OpenStack 内部运行，并可用作备份即服务（BaaS）产品。虽然我们无法涵盖所有备份即服务选项，但下表比较了当今企业客户使用的一些软件中的常见选项。这种
  BaaS 模式通常由公有云和私有云提供商使用，为客户提供备份服务。这些服务的定价基于容量、带宽、客户端数量等成本模型。云备份服务与其他云服务一样，利用共享的私有云基础设施，并且对底层基础设施进行了抽象。BaaS
  既可以供云内的租户使用，也可以供希望备份到云中的外部主机使用。


  | 功能与常见要求 | Zmanda | Cloudberry | Commvault Simpana | Community Amanda（开源） |

  |---|---|---|---|---|

  | 基于文件的备份 | 是 | 是 | 是 | 是 |

  | 客户端-服务器架构 | 是 | 两者均可 | 是 | 是 |

  | 可用数据格式 | 原生转储和/或 GNU tar | Swift 对象存储 | 原生转储/SCSI | 原生转储和/或 GNU tar |

  | 去重 | 否 | 是 | 是 | 否 |

  | 远程站点容灾（DR） | 是 | 是 | 是 | 否 |

  | 加密和压缩 | 是 | 是 | 是 | 是 |

  | 增量备份 | 是 | 否 | 是 | 是 |

  | LDAP 集成 | 是 | 变通方案 | 是 | 变通方案 |

  | 许可 | 年度或多年度 | 年度、永久 | 年度 | 免费 |

  | Linux 客户端 | 是 | 否 | 是 | 是 |

  | MS Exchange | 是 | 是 | 是 | 变通方案 |

  | MS SharePoint | 是 | 变通方案 | 是 | 变通方案 |

  | MS SQL | 是 | 是 | 是 | 变通方案 |

  | 操作 GUI | 是 | 是 | 是 | 否 |

  | 报表 | 是 | 功能有限 | 是 | 否 |

  | 恢复到不同位置 | 是 | 是 | 是 | 是 |

  | 恢复到单个数据库 | 是 | 是 | 是 | 否 |

  | 指定保留时间 | 是 | 是 | 是 | 是 |

  | Windows 客户端 | 是 | 是 | 是 | 是 |


  ## 总结


  在本章中，我们讨论了对于 OpenStack 云运维至关重要的主题。我们介绍了监控、规划和备份云的技术性方法；这仅仅是开始。网上有很多优秀资源可以帮助你运维 OpenStack
  云；不过，我建议读者从 OpenStack 运维和架构指南入手。它们分别位于 http://docs.openstack.org/ops/ 和 http://docs.openstack.org/arch/。这些指南将提供所有必要的基础信息，帮助你在任何云之旅中成功运维。


  在下一章中，你将学习如何集成现有的业务和运维流程，例如使用 Jenkins 进行身份管理集成和单元测试。


