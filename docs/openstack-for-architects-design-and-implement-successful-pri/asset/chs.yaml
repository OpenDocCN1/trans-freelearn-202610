  - Cinder 驱动列表：https://wiki.openstack.org/wiki/CinderSupportMatrix

  - OpenStack 发行版列表：https://www.openstack.org/marketplace/distros/

  - 虚拟化标准性能评估比较：http://spec.org/virt_sc2013/

