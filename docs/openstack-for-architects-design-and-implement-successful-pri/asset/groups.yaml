    在第二次执行 Puppet 时，Keystone 将被安装并配置完成。通过在 Jenkins 中添加一个类似如下的新构建步骤，启用我们在提交中编写的 Keystone
    测试：


    ![](img/2f752555f69992669defa8b25e6dcee9_108_0.png)


    运行构建，并确保测试通过——此时 Keystone 已在第一个控制器上运行。


    ## 完全自动化流水线


    到目前为止，我们一直在手动运行 Jenkins 构建和 Puppet 执行。这样我们可以确保在 Puppet 执行完成后才运行测试。要消除流水线中的这两个手动步骤，有几种不同的方法。


    对于 Jenkins 构建，可以将 Jenkins 配置为定期轮询源代码仓库，也可以将 Git 配置为在新代码推送时主动通知 Jenkins 并触发构建。Jenkins
    可以配置为仅在代码推送到任何分支时构建，也可以配置为仅在代码推送到特定分支时构建。这样你可以忽略特性分支上的工作，只在合并到主分支时执行构建；或者忽略合并操作，只在特性分支上执行构建。像
    Stash 和 Bamboo 这样的工具提供了更简单的集成方式。


    管理 Puppet 执行则稍显复杂。默认情况下，Puppet 大约每 30 分钟运行一次，从 Puppet master 获取变更并应用它们。虽然这对于希望分散执行以提升性能的大型环境是合理的，但等待半小时让环境获取你刚刚推送到
    Git 的变更可能会令人沮丧。这个问题有两种可行的解决方案。第一，你可以将 Puppet 的执行作为测试过程的一部分在主机上运行。像 Ansible 这样的工具可以让这变得相对简单。第二，你可以缩短开发环境的执行间隔。这由
    `/etc/puppet/puppet.conf` 主配置块中的 `runinterval` 设置控制。


    一旦你完全自动化了流水线，你需要在将变更推送到 Puppet master 与运行单元测试之间添加某种延迟。这将使主机有时间获取变更并实施它们。例如，如果你将
    `runinterval` 设置为 5 分钟，并期望变更在 5 分钟内应用，你可以在 Jenkins 作业中添加一个构建步骤，在执行单元测试前休眠 10 分钟。


    ## 总结


    在本章中，我们讨论了组织如何使用现代软件开发技术来提高其 OpenStack 部署的质量。我们使用 Puppet、Git 和 Jenkins 构建了一个简单的部署流水线，并用它来部署和测试
    OpenStack 基础设施的两个组件。在此基础上，可以以受控方式安装、配置和测试更多组件。


    对于习惯使用 Packstack 并快速搭建环境的人来说，这似乎需要付出很多额外努力。但根据我们的经验，如果没有适当的基础设施来管理和测试变更，这些部署在规模化时会变得难以驾驭。提醒一下，我们遵循的三个基本原则是：


    - 小而可控的变更，而不是大规模升级周期

    - 测试驱动开发

    - 持续部署


    由于大多数组织在软件开发中已经具备围绕这些原则的一些经验和工具，部署流水线因组织而异。一个值得参考的优秀基础设施示例是 OpenStack 基金会自身用于测试变更的设施。有关该流水线的更多信息，请访问：


    ```

    http://docs.openstack.org/infra/

    ```


