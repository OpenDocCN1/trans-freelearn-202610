    # Updating the design document


    Our first task is to update the design document from Chapter 1, *Introducing OpenStack*,
    with a set of definitions of our host groups. These definitions should be included
    at the start of the *Physical architecture* section of the document. We''ll use
    the following host groups in this expanded **proof of concept (POC)**.


    # Cloud controller


    The cloud controller system provides the API services, scheduling services, and
    Horizon dashboard services for the OpenStack deployment.


    # Compute node


    The compute node systems act as KVM hypervisors and run the `nova-compute` and
    `openvswitch-agent` services.


    The *Physical architecture* section of the design document should also contain
    a section on the physical network architecture of the deployment. In this section,
    each of the segmented networks should be defined. Connectivity for each physical
    host to each network should also be defined.


    The Packstack installation tool doesn''t allow for the specification of an external
    network for API traffic. As such, we''ll use three physical networks in this deployment,
    a management network which is routable to the intranet, a provider network which
    provides floating IPs for the instances, and a tenant network for instance traffic.
    The following network definitions should be added to the *Physical architecture*
    section.


    # Management network


    The management network is used for the private communication between all nodes
    in the OpenStack deployment. This network is also used to carry tenant and storage
    traffic in this deployment.'
