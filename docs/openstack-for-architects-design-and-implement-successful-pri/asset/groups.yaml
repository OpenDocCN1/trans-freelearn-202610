  - '[PAGE 36]


    # 2


    # Architecting the Cloud


    The array of possible hardware and software combinations that can be used to create
    an OpenStack cloud is pretty amazing at this point. A phrase we typically hear
    these days is that having an integration for OpenStack is “table stakes” for a
    hardware or software product coming in the market. As of the Liberty release of
    OpenStack (November 2015), there were over 50 Cinder storage drivers and 20 Neutron
    network drivers. These cover a wide range of products from traditional EMC storage
    arrays and Cisco switches to various software-defined storage and networking products.
    OpenStack supports a number of hypervisors and compute platforms ranging from
    commodity x86 hardware to IBM Z-series mainframes.


    Few of the decisions we make as architects affect the bottom line as much as hardware
    and software selection. While we approach the deployment of our cloud or the development
    of our software in an iterative fashion to reduce the risk of mistakes, it is
    typically very difficult to iteratively purchase hardware.


    Luckily, OpenStack ships with a set of reference plugins for each of the subsystems
    that we can use to mock out our cloud before purchasing actual hardware. For Cinder,
    the reference implementation involves using LVM and iSCSI on a Linux system. For
    Neutron, the reference implementation uses Open vSwitch and iptables on a Linux
    system. Even Compute can be mocked out using nested virtualization with KVM. The
    approach that we recommend is to begin an OpenStack project with the reference
    plugins until you get a feel of how the software and hardware will work together
    before making any large hardware or software purchases.'
  - '[PAGE 37]


    # # Picking an OpenStack distribution


    OpenStack is developed like most open source software projects. The code is available
    at `http://openstack.org` and can be downloaded in the package format from `http://tarballs.openstack.org`.
    As of the Liberty release of OpenStack, there were over 350 individual projects
    available for download. That''s a huge number of source repositories for an engineering
    team to sort through and manage. Hence the development of the OpenStack distributions.
    Most of the OpenStack distributions are put together by the same groups that put
    together Linux distributions. For example, the three major distributions available
    are part of the Ubuntu, openSUSE, and CentOS Linux distributions. Each of these
    distributions maintain installation guides, available at `http://docs.openstack.org`.
    There are also distributions available from companies such as HP, Mirantis, and
    Red Hat which are part of commercial support agreements. In addition to these
    options, there are also companies such as Platform9, which provide managed OpenStack
    deployments.


    # # Running from the trunk


    As we mentioned before, stable releases of OpenStack happen on a six-month cadence.
    Active development happens in the trunk of each of the software projects (the
    “master” branch on the web-based repository service for OpenStack at `http://git.openstack.org`).
    This master repository controls the distributed version control for the OpenStack
    project and aids in source code management. This is very similar to the well-known
    GitHub service used by many other open source projects. In addition to the Git
    repository, there are some number of stable branches corresponding to the six-month
    releases. Features are implemented in the master branch and bug fixes are backported
    from the trunk to the branches on an irregular basis.


    For most organizations, taking a packaged version of one of the stable branches
    and deploying it will suffice. There are a couple of reasons why this might not
    be appealing, though. For one, some organizations might find that too much change
    accumulates between the six-month releases and that there''s less risk in releasing
    more frequent and smaller changes from the trunk. While this makes sense with
    a lot of software projects, OpenStack is developed by a number of loosely coordinated
    teams and managing the dependencies between the development streams of each project
    is a complicated task. Automated testing on the trunk attempts to ensure that
    a change in Nova doesn''t break a feature in Neutron, but the bulk of manual integration
    testing happens for the coordinated stable releases.'
  - '[PAGE 38]


    While it''s possible that an organization may want to take all the changes from
    trunk before they make it down to the stable branches, it''s more likely that
    they''ll be interested in only one or two important features that haven''t made
    it to the branches. For example, many of the teams that we have worked with were
    interested in leveraging external IPAM systems similar to the one provided by
    Infoblox long before the feature was implemented in Neutron (in the Liberty release).
    We''ve seen other situations in which an organization wanted to pull in a Cinder
    driver for a new SAN device before it was accepted upstream. For these use cases,
    it makes more sense to start off with a packaged distribution of one of the stable
    branches and then create a custom package only for the component which has the
    desired feature backported to it from the trunk.


    # Community distributions


    After each stable release of OpenStack, the software from the resulting stable
    branches is packaged up by maintainers from three of the major community Linux
    distributions into the native format for their distribution. These distributions
    of OpenStack allow users of those distributions to install the software (and its
    dependencies) using the usual mechanism for that distribution. These distributors
    also provide documentation at `http://openstack.org` on how to install and configure
    the software on their particular distribution.


    Most organizations will choose a community distribution based on the Linux distribution
    that they''re the most comfortable with. For example, organizations which typically
    use the Ubuntu Linux distribution will use the Ubuntu OpenStack distribution as
    well. It''s worth noting that the community distributions of OpenStack will work
    with the commercially supported variants of both openSUSE and CentOS; it''s not
    uncommon for an organization to pay for support for Red Hat Enterprise Linux but
    to use the community-supported CentOS distribution of OpenStack (RDO).


    The choice of community distribution may also have an effect on the availability
    of installation mechanisms. For example, the Packstack installation tool that
    we used in *Chapter 1, Introducing OpenStack*, is specific to the CentOS distribution
    of OpenStack (RDO). The Ubuntu and openSUSE distributions have other tools for
    installing the OpenStack software. However, the Puppet, Chef, and Ansible mechanisms
    for deploying OpenStack are distribution (and operating system) agnostic. For
    example, it is possible to deploy OpenStack on the Ubuntu and CentOS distributions
    using the same Puppet modules.'
  - '[PAGE 39]


    # Commercially supported distributions


    While there are only three major community-supported distributions of OpenStack
    available, there are a myriad of commercially-supported distributions available.
    A list of these distributions and their certification status is available at http://openstack.org.
    Distributions which have passed specific load and performance-based Tempest tests
    are certified in the same way as managed service providers. Commercially-supported
    distributions are frequently based on the community-supported distributions. However,
    there are a few reasons that organizations prefer them to the community distributions.


    The first major driver is support. Most companies which provide support for OpenStack
    require the customer to use their commercially supported distribution so that
    they can ensure that the customer is using software which has passed through a
    certification and testing process. For example, Red Hat takes the packages from
    each RDO release and runs them through a detailed test plan before releasing them
    as Red Hat Enterprise Linux OpenStack platform. When a customer identifies an
    issue with a particular OpenStack component, Red Hat can add that issue to the
    test plan to prevent regressions in future releases. Additionally customers may
    choose different commercial distributions for ease of use, quality of support,
    or any additional software that may be included with the distribution; for example,
    Hewlett Packard Enterprise''s Helion OpenStack is bundled with a number of operational
    tools that may appeal to some customers. Mirantis OpenStack, while only an Information
    as a Service (IaaS) platform, has an installer that some customers may prefer
    over other distribution''s installers.


    Organizations may also choose a commercially-supported distribution over a community-supported
    distribution because the distribution has added functionality that hasn''t been
    released by the distributor as open source. For example, IBM has an OpenStack
    distribution within their IBM Cloud Manager offering. These enhancements tend
    to be aimed toward speeding the deployment of OpenStack clouds or improving the
    manageability of deployments with additional reporting and dashboards.'
