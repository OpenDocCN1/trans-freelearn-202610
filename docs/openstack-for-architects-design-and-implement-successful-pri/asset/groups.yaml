    \n## 4\n\n## Building the Deployment Pipeline\n\nWe often tell customers we work\
    \ with that OpenStack is not **installed**, it is **deployed**. While the difference\
    \ in words might seem subtle, it can really be a revolutionary change within an\
    \ organization. Most enterprise infrastructure teams are used to the following\
    \ process in the deployment of a new infrastructure platform:\n\n- 1. Install\
    \ the platform.\n- 2. Configure and integrate the platform.\n- 3. Run the platform.\n\
    - 4. Upgrade the platform.\n\nInstalling and configuring the platform can take\
    \ months or years and once it's installed, the platform is expected to run for\
    \ years. Upgrades to the platform happen every 3 to 5 years and are large 6-12\
    \ month projects. Red Hat has structured the release of our Enterprise Linux operating\
    \ system around these cycles – there were 3 years between the release of RHEL\
    \ 5 and RHEL 6 and almost 4 years between RHEL 6 and RHEL 7. Each release is supported\
    \ for 10 years and conservative infrastructure teams will wait at least a year\
    \ after the release of a new version to start their 6-12 month upgrade project.\n\
    \nThis kind of conservative approach to platform deployment has worked extremely\
    \ well in the operating system, virtualization platform, and application platform\
    \ space. However, if the most important business driver for your private cloud\
    \ project is increased agility, you are unlikely to achieve your goal with a 12\
    \ month roll-out and a 5 year life cycle.\n\nIn this chapter, we'll be looking\
    \ at how OpenStack is typically deployed as application software, not as infrastructure\
    \ software. We'll build a simple deployment pipeline which uses Puppet to describe\
    \ an OpenStack deployment, uses Jenkins an open source Continuous Integration\
    \ (CI) tool to realize that deployment, and then runs unit tests to verify that\
    \ the deployment meets our specifications. Throughout the chapter, we'll talk\
    \ about iterative development and how it applies to OpenStack deployments.\n\n\
    ## Dealing with Infrastructure as a Software\n\nA Vice President of Infrastructure\
    \ at a large company once told us something like this, \"I like hardware. My hardware\
    \ hardly ever breaks. The software I deploy breaks all the time. When my data\
    \ center becomes software, how will I ever have a stable platform?\". While the\
    \ same concern could (and probably should) have once been applied to virtualization,\
    \ most organizations today are very comfortable with the idea of software pretending\
    \ to be hardware. The software-defined data center is something a little more\
    \ intimidating, though. While we've had software pretend to be a CPU for a long\
    \ time, we've only had software pretend to be a storage array relatively recently.\
    \ Also, when the storage array goes down, everything tends to come down with it.\n\
    \nHowever, maybe the bigger question is around software constantly breaking on\
    \ deployment. Indeed, the most successful OpenStack deployments that we've worked\
    \ with have all adopted modern software development techniques to ensure that\
    \ their software does not break on deployment.\n\n## Eating the elephant\n\nThe\
    \ first and most important concept that we will apply to our deployment process\
    \ is that of iterative development. Instead of trying to tackle all of the requirements\
    \ that we've identified in one deployment, we break it down into stories, assign\
    \ them to two or three week sprints, and then implement them one by one. A sprint\
    \ is a basic measure of development derived from the Scrum process and framework.\
    \ A sprint is a timeboxed measure of effort that is planned and limited to a specific\
    \ duration (two weeks is common). Not only does this allow us to limit the complexity\
    \ of each release and focus on thoroughly testing each component, it also allows\
    \ us to begin returning value to the business much sooner in the process. Workloads\
    \ that only require a small feature set will be able to board the platform without\
    \ waiting for a large release.\n"
