    \ can then also describe an implementation of the requirement using the REST API:\n\
    \n```\nPOST /v2.0/tokens\n{\n  \"auth\": {\n    \"tenantName\": \"demo\",\n  \
    \  \"passwordCredentials\": {\n      \"username\": \"demo\",\n      \"password\"\
    : \"secret\"\n    }\n  }\n}\nRESPONSE 200\n{\n  \"access\": {\n    \"token\":\
    \ {\n      \"issued_at\": \"2014-01-30T15:30:58.819584\",\n      \"expires\":\
    \ \"2014-01-31T15:30:582\",\n      \"id\": \"aaaa-bbbbb-ccccc-dddd\",\n      \"\
    tenant\": {\n        \"description\": null,\n        \"enabled\": true,\n    \
    \    \"id\": \"fc394f2ab2df4114bde39905f800dc57\",\n        \"name\": \"demo\"\
    \n      }\n    },\n  }\n}\n```\n\nIf we wanted to, we could also identify the\
    \ service level agreement for this requirement. For example, we could specify\
    \ that the Keystone service should respond within 10 seconds with a valid token.\
    \ This could be used to establish acceptable performance thresholds for the system."
