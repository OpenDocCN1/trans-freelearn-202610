    ## Auditing OpenStack


    As more enterprises are bringing production workloads to OpenStack, the need for
    audit compliance increases exponentially. These same enterprises may have specialized
    audit requirements for compliance with PCI, FedRAMP, SOX, and HIPAA and without
    a way to audit what is happening in their cloud they are out of compliance. These
    enterprises are used to having this capability in legacy platforms, therefore,
    it only makes sense that they should require it with OpenStack.


    This auditing needs to be done in a manner that the enterprises are accustomed
    to, and they should not be expected to have to ingest different log formats from
    each of the core OpenStack projects in a disparate fashion as they sometimes have
    to do today. However, the good news is, there is one format that provides a normalized
    and federated way to collect and analyze audit data. This format is the **Cloud
    Auditing Data Federation (CADF)** standard. The CADF standard defines a full event
    model anyone can use to fill in the essential data needed to certify, self-manage,
    and self-audit application security in cloud environments. This functionality
    is needed to build trust for the cloud platform and increase adoption. Enterprises
    need to feel that they are able to track and detect unauthorized access on their
    cloud platform.


    ### CADF details


    According to the Distributed Management Task Force, the governing body of CADF,
    the CADF standard does the following:


    > “defines a normative event data model along with a compatible set of interfaces
    for federating events, logs and reports between cloud providers and customers.
    CADF provides several benefits to customers of cloud services. Audit event data
    can be represented in a common format to allow for consistent reporting of this
    data across different cloud providers. Cloud customers will also be able to aggregate
    data from different cloud providers to provide a more complete and consistent
    picture of all audit data. Also with audit data coming in from different providers
    in the same format, customers will be able to use common audit tools and processes
    for all their audit data. The ability to federate data from different sources
    will also provide benefits to users of OpenStack with an audit data format that
    will be consistent across a collection of disparate cloud (IaaS) services with
    some common components such as Keystone and Oslo libraries. These components will
    need to share audit data.”


    The CADF specification contains an event model that specifies taxonomies for any
    event that can be audited, these are as follows:


    - **Resource:** The classification of the event by logical resource that is related
    to the event. Basically, this is who was the intended target or what observed
    the event.

    - **Action:** This is used to classify what action caused the event.

    - **Outcome:** This describes what the outcome of the action was.


    Furthermore, there are mandatory properties of the preceding taxonomies, these
    further break down the event into the following five components:


    | Model Component | CADF Definition |

    |---|---|

    | **OBSERVER** | The RESOURCE that generates the CADF Event Record based on its
    observation (directly or indirectly) of the Actual Event. |

    | **INITIATOR** | The RESOURCE that initiated, originated, or instigated the event''s
    ACTION, according to the OBSERVER. |

    | **ACTION** | The operation or activity the INITIATOR has performed, attempted
    to perform or has pending against the event''s TARGET, according to the OBSERVER.
    |

    | **TARGET** | The RESOURCE against which the ACTION of a CADF Event Record was
    performed, was attempted, or is pending, according to the OBSERVER. *Note: a TARGET
    (in the CADF Event Model) can represent a plurality of target resources.* |

    | **OUTCOME** | The result or status of the ACTION against the TARGET, according
    to the OBSERVER. |


    Using these properties, the CADF data model is designed to provide the “who”,
    “what”, “when”, “where”, “from where”, and “where to” of an activity. Most people
    in security have heard of the 5 W''s of audit and compliance, however, this model
    was designed for cloud environments and adds an additional two (from where and
    where to).


    In order to further explain how CADF is used in audit, based on the 7 W''s, refer
    to the following chart:


    | "W" Component | CADF Mandatory Properties | CADF Optional Properties (where
    applicable) | Description |

    |---|---|---|---|

    | What | event.action<br>event.outcome<br>event.type | event.reason (e.g., severity,
    reason code, policy id) | "what" activity occurred; "what" was the result |

    | When | event.eventTime | reporter.timestamp (detailed), for each reporter<br>event.duration
    | "when" did it happen<br>• Any granularity via ISO 8601 format |

    | Who | initiator.id<br>initiator.type | initiator.id (id, name): (basic)<br>initiator.credential
    (token): (detailed)<br>initiator.credential.assertions (precise) | "who" (person
    or service) initiated the action |

    | FromWhere |  | initiator.addresses (basic)<br>initiator.host (agents, platforms,
    ...) (detailed)<br>initiator.geolocation (precise) | FromWhere provides information
    describing where the action was initiated from.<br><br>May include<br>• logical/physical
    addresses<br>• ISO-6709-2008, precise geolocations |

    | OnWhat | target.id<br>target.type |  | "onWhat" resource did the activity target
    |

    | Where | observer.id<br>observer.type | reporterstep.role (detailed)<br>reporterstep.reporterTime
    (detailed) | "where" did the activity get observed (reported), or modified in
    some way. |

    | ToWhere |  | target.addresses (basic)<br>target.host (agents, platforms, ...)
    (detailed)<br>target.geolocation (precise) | ToWhere provides information describing
    where the target resource that is affected by the action is located.<br><br>For
    example, this can be as simple as an IP address or server name. |


    CADF – the 7 W''s of audit – CADF OpenStack


    ### Using CADF with OpenStack


    Except for a few special cases, getting CADF information out of OpenStack services
    is pretty straightforward. However, depending on the distribution, these instructions
    may differ.

    The following instructions show how Nova can be enabled for CADF audit events
    to be sent to Ceilometer (optionally log files). This is done via the Keystone
    middleware, which provides an optional WSGI middleware filter which allows the
    ability to audit API requests for each component of OpenStack.


    First, log in to your OpenStack deployment. Edit the `/etc/nova/api-paste.ini`
    file. At the end of the file, add the following:


    ```

    [filter:audit]

    paste.filter_factory = pycadf.middleware.audit:AuditMiddleware.factory

    audit_map_file = /etc/nova/api_audit_map.conf

    ```


    Review the `[composite:openstack_compute_api_v2]` settings and verify that the
    values match the following sample:


    ```

    [composite:openstack_compute_api_v2]

    use = call:nova.api.auth:pipeline_factory

    noauth = faultwrap sizelimit noauth ratelimit osapi_compute_app_v2

    keystone = faultwrap sizelimit authtoken keystonecontext ratelimit audit osapi_compute_app_v2

    keystone_nolimit = faultwrap sizelimit authtoken keystonecontext audit osapi_compute_app_v2

    ```


    Additional options are available to redirect the events to log files as well as
    messaging. Simply add the following:


    ```

    [audit_middleware_notifications]

    driver = log

    ```


    Now, copy the `api_audit_map.conf` file to the `/etc/nova/` directory and restart
    the API service.


    The command to restart the API service is OS-specific. On Red Hat Enterprise Linux
    systems, the command is `service openstack-nova-api restart`. To know more, refer
    to https://access.redhat.com/documentation/en-US/Red_Hat_Enterprise_Linux_OpenStack_Platform/2/html/Getting_Started_Guide/chap-Deploying_Compute_Services.html


    Open the `entry_points.txt` file in the `egg-info` subdirectory of your OpenStack
    installation directory.


    ![](img/2f752555f69992669defa8b25e6dcee9_190_0.png)


    For PackStack installations, the file path looks similar to `/usr/lib/python2.7/site-packages/ceilometer-2014.2-py2.7.egg-info/entry_points.txt`.


    While this example was only for Nova, there are preconfigured `api_audit_map.conf`
    files for other services such as Glance, Ceilometer, Cinder, Neutron, and so on
    at https://github.com/openstack/pycadf/tree/master/etc/pycadf. By following the
    preceding steps and using these `api_audit_map.conf` files, you can enable all
    core OpenStack services for CADF eventing.


    Since the events are stored to messaging, and events, by default are sent to Ceilometer,
    this is where you will find your events stored. In order to query Ceilometer for
    Keystone events, you should first execute a Keystone action that would cause an
    event, for example:


    ```

    $ openstack user create test_user --os-identity-api-version 3 --os-auth-url http://10.0.2.15:5000/v3
    --os-default-domain default

    ```


    In order to get the event that this created out of Ceilometer, you should do the
    following:


    ```

    $ ceilometer event-list --query

    event_type=identity.user.created

    ```


    Which will result in the following type of output:


    | Event Type | Trait Name | Trait Type | Trait Value |

    |---|---|---|---|

    | identity.user.created | initiator_id | string | asd123j123312yf34212339e6e424a7f
    |

    | identity.user.created | project_id | string | ae7e3k14k202042j22f19bc25c8c09f0
    |

    | identity.user.created | resource_id | string | 22a21766c478927349e3fda7ee0b712b
    |

    | identity.user.created | service | string | identity.openstack.example.com |

    '
