    ## Backups and recovery


    Typically, backups and recovery aren’t the first things traditional OpenStack
    operators think of. This is usually because of the ephemeral workloads traditionally
    run on OpenStack clouds, which really didn’t persist long enough to be backed
    up. However, as OpenStack adoption has grown exponentially, we are seeing more
    and more production OpenStack deployments that include persistent workloads, especially
    in IT-as-a-service clouds. As a result, a need has arisen to back up critical
    infrastructure data as well as persistent workloads running on the cloud.


    ### Infrastructure backup architecture


    While workloads running on an OpenStack cloud are the stars of the show, the infrastructure
    is the real hero. Keeping the APIs available and running 100% without interruption
    should be the end goal of any operator when it comes to availability. However,
    it’s simply not reality. Even with proper life-cycle management and change procedures,
    data corruption can happen. Since the heart of OpenStack is a structured database
    running on mariaDB, it only makes sense to run it in a highly available configuration.
    However, what happens if, during operation, errors are made and are replicated
    across all HA nodes? Failure. Now, without backup and recovery, not only are the
    APIs offline, workloads could still be online, but all the data about every instance
    and the network configuration for those instances are lost. This is a true disaster
    for any OpenStack cloud.


    ### Backup strategies – what to backup


    There is some critical data that must be backed up regularly in order to ensure
    proper recovery of OpenStack cloud. The frequency of these backups should align
    with your recovery time objective (the time to cloud restoration after a disaster
    in order to avoid unacceptable consequences to business continuity). There may
    also be recovery point objectives and SLAs within your organization that you may
    have to adhere to. While these are more common to disaster recovery regarding
    persistent workloads and not the infrastructure, there are always exceptions.


    Critical items you should back up to be able to recover from a full or partial
    disaster are listed in the following table:


    | Data item | Project | Location | Instructions |

    |---|---|---|---|

    | MySQL DB | Openstack DB | Controller | Use `mysqldump` to export the contents
    of the database. Copy the data to a backup server. |

    | Nova | Compute | Compute controller | Make copies of `/etc/nova` and copy to
    the backup server. Make copies of `/var/lib/nova` except `/var/lib/nova/instances`
    on compute nodes. Instance backups will be discussed later. |

    | Glance | Image Repo | Controller | Copy the `/etc/glance` and `/var/lib/glance`
    directories. Or rsync `/var/lib/glance/images` to another backup server. |

    | Keystone | Identity | Controller | Back up `/etc/keystone`. Back up `/var/lib/keystone`
    if there is any data in it. |

    | Cinder | Block Storage | Controller | Back up `/etc/cinder`. Back up `/var/lib/cinder`.
    |

    | Swift | Object Storage | Controller | Back up `/etc/swift`; it contains the
    configuration files as well as the ring and ring builder files. Without these,
    your data is completely inaccessible. Copy these to every storage node before
    backing them up. |


    Once all of these files have been backed up and moved to a secure on-site or off-site
    disaster recovery server, in order to restore your OpenStack cloud you will basically
    need to stop all services on the existing cloud, copy all of the files back into
    place, recover the database from the export, and restart the cloud.


