    # Provisioning a second controller


    In later chapters we''ll look at more flexible deployment methodologies that allow
    fine-grained service placement and automated cluster configuration. In this chapter,
    we''ll just extend the Packstack deployment from Chapter 2, Architecting the Cloud.
    Packstack isn''t designed to deploy multiple controllers, so some manual configuration
    of services will be required.'
