    ## Building to Operate


    To illustrate this, we can look at the typical steps to do a simple backup on
    a basic workload:


    - 1. Pause instances.

    - 2. Detach Cinder volumes (root volume and any additional nonroot volumes).

    - 3. Take an instance snapshot for each instance and store it in Glance for later
    retrieval.

    - 4. Use Cinder to backup all the aforementioned volumes and place them in Object
    Storage (Swift/Ceph).

    - 5. Document these copies since OpenStack does not track them for you.

    - 6. Resume instances.


    These steps are very command-intensive, take time, require custom scripts, and
    since there is a manual documentation step could be error-prone. These steps may
    also not adhere to existing internal backup policies of the organization.


    This manual type of backup operation is antiquated and feature-limited. Any enterprise-level
    backup solution should be non-impacting, able to do incremental backups and be
    customized for each workload, and able to span multiple instances when workloads
    are also spread across instances. Additionally, tenants should be able to easily
    back up their own workloads and test them before committing them to storage and
    have the ability to restore and replay backups when they desire. Workload backup
    software should also be able to provide a disaster recovery component so that
    in the event of a catastrophe, backed-up and replicated resources are available
    at different geographic locations in case any single location is compromised.


    There are few open source and commercial options when considering workload backup
    solutions that use native snapshots from OpenStack. One open source option is
    called Raksha (https://wiki.openstack.org/wiki/Raksha), the OpenStack project
    version of what became TrilioVault (http://www.triliodata.com/about/), a commercial
    data protection, backup, and disaster recovery specifically designed for OpenStack.
    Trilio Data has taken the previously mentioned workload backup snapshot procedure
    and designed a flexible and scalable solution. Using TrilioVault, both full and
    incremental backups of snapshots can be stored on a wide range of storage including
    NFS, Swift, and other third-party arrays. Recovery is also GUI-driven and simplifies
    what would otherwise be driven by sets of homegrown scripts to launch backup and
    recovery actions. TrilioVault also provides additional features for data retention,
    protection, and data integrity.


    Additionally, traditional file-based backup solutions can be run inside OpenStack
    and can be used as Backup-as-a-Service (BaaS) offerings. While we can''t cover
    every Backup-as-a-Service option, the following table compares some common options
    from some software used by enterprise customers today. This BaaS model is typically
    used by cloud providers, both public and private, to offer backup services to
    clients. These are priced with a cost model based on capacity, bandwidth, the
    number of clients, and so on. Cloud backup services leverage the shared private
    cloud infrastructure, just like other cloud services and are infrastructure-abstracted.
    BaaS can be leveraged by both tenants inside the cloud as well as external hosts
    that desire to back up into the cloud.


