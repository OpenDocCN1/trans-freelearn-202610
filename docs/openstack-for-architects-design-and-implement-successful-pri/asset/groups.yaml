    \ would like to use.\n\n## Examples\n\nThe following examples will show how to\
    \ install SSL/TLS for service endpoints using Apache wsgi proxy configuration\
    \ for Horizon and configuring native TLS support in Keystone. These examples assume\
    \ that the administrator has already secured certificates from an internal CA\
    \ source. If you will be publicly offering Horizon or Keystone, it is important\
    \ to secure certificates from a global CA. These certificates should be recognized\
    \ by all browsers and have the ability to be validated across the Internet.\n\n\
    Let's start with Keystone:\n\nNow that we have our certificates, let's put them\
    \ in the right place and give them adequate permissions:\n\n```\n# chown keystone\
    \ /etc/pki/tls/certs/keystone.crt\n# chown keystone /etc/pki/tls/private/keystone.key\n\
    ```\n\nNow we can start the serious security work. We start by adding a new SSL\
    \ endpoint for Keystone and then delete the old one. First, find your current\
    \ endpoints:\n\n```\n# keystone endpoint-list | grep 5000\n```\n\nNow create new\
    \ ones:\n\n```\n# keystone endpoint-create --publicurl https://openstack.example.com:5000/v2.0\
    \ --internalurl https://openstack.example.com:5000/v2.0 --adminurl https://openstack.example.com:5000/v2.0\
    \ --service keystone\n```\n\nThen delete the old one:\n\n```\n# keystone endpoint-delete\
    \ <endpoint-id-from-above-endpoint>\n```\n\nEdit your /etc/keystone/keystone.conf\
    \ file to contain these lines:\n\n```\n[ssl]\nenable = True\ncertfile = /etc/pki/tls/certs/keystone.crt\n\
    keyfile = /etc/pki/tls/private/keystone.key\n```\n\nNow restart the Keystone service\
    \ and ensure there are no errors:\n\n```\n# service openstack-keystone restart\n\
    ```\n\nChange your environment variables in your keystonerc_admin or any other\
    \ project environment files to contain the new endpoint by changing OS_AUTH_URL\
    \ to:\n\n```\nOS_AUTH_URL=https://openstack.example.com:35357/v2.0/\n# source\
    \ keystonerc_<user>\nexport OS_CACERT=/path/to/certificates\n```\n\nGive it a\
    \ quick test:\n\n```\nkeystone endpoint-list\n```\n\n## Securing the Cloud\n\n\
    Assuming the command didn't display any errors, you can now configure the rest\
    \ of your OpenStack services to connect to Keystone using SSL/TLS. The configurations\
    \ are all very similar. Here is an example of Nova. You will need to edit the\
    \ `/etc/nova/nova.conf` file to look like this:\n\n```ini\n[keystone_authtoken]\n\
    auth_protocol = https\nauth_port = 35357\nauth_host = openstack.example.com\n\
    auth_uri = https://openstack.example.com:5000/v2.0\ncafile = /path/to/ca.crt\n\
    ```\n\nCinder, Glance, Neutron, Swift, Ceilometer, and so on are all the same.\
    \ Here is a list of configuration files you will need to edit:\n\n- `/etc/openstack-dashboard/local_settings`\
    \ (Horizon access to Keystone)\n- `/etc/ceilometer/ceilometer.conf`\n- `/etc/glance/glance-api.conf`\n\
    - `/etc/neutron/neutron.conf`\n- `/etc/neutron/api-paste.ini`\n- `/etc/neutron/metadata_agent.ini`\n\
    - `/etc/glance/glance-registry.conf`\n- `/etc/cinder/cinder.conf`\n- `/etc/cinder/api-paste.ini`\n\
    - `/etc/swift/proxy-server.conf`\n\nOnce these or any other service configuration\
    \ files have been modified, restart all of your services and test your cloud:\n\
    \n```bash\n# openstack-service restart\n# service httpd restart\n# openstack-status\n\
    ```\n\nYou should see all of your services running and online. You have now encrypted\
    \ traffic between your OpenStack services and Keystone, a very important step\
    \ in keeping your cloud secure. If not, check your services log files for errors.\n\
    \nNow we configure Horizon to encrypt connections to clients using SSL/TLS.\n\n\
    On the controller node, add the following (or modify the existing configuration\
    \ to match) in `/etc/apache2/apache2.conf` on Ubuntu and `/etc/httpd/conf/httpd.conf`\
    \ on RHEL:\n\n```\n<VirtualHost <ip address>:80>\n    ServerName <site FQDN>\n\
    \    RedirectPermanent / https://<site FQDN>/\n</VirtualHost>\n<VirtualHost <ip\
    \ address>:443>\n    ServerName <site FQDN>\n    SSLEngine On\n    SSLProtocol\
    \ +TLSv1 +TLSv1.1 +TLSv1.2\n    SSLCipherSuite HIGH:!RC4:!MD5:!aNULL:!eNULL:!EXP:!LOW:!MEDIUM\n\
    \    SSLCertificateFile      /path/<site FQDN>.crt\n    SSLCACertificateFile \
    \   /path/<site FQDN>.crt\n    SSLCertificateKeyFile /path/<site FQDN>.key\n \
    \   WSGIScriptAlias / <WSGI script location>\n    WSGIDaemonProcess horizon user=<user>\
    \ group=<group> processes=3 threads=10\n    Alias /static <static files location>\n\
    \    <Directory <WSGI dir>>\n        # For http server 2.2 and earlier:\n    \
    \    Order allow,deny\n        Allow from all\n\n        # Or, in Apache http\
    \ server 2.4 and later:\n        # Require all granted\n    </Directory>\n</VirtualHost>\n\
    ```\n\nOn the compute servers, the default configuration of the `libvirt` daemon\
    \ is to not allow remote access. However, live migrating an instance between OpenStack\
    \ compute nodes requires remote `libvirt` daemon access between the compute nodes.\
    \ Obviously, unauthenticated remote access is not allowable in most cases; therefore,\
    \ we can set up `libvirtd` TCP socket with SSL/TLS for the encryption and X.509\
    \ client certificates for authentication.\n"
  mdcn: "\n在本章开头，我们定义了安全区域。这些网络和资源区域，配合适当的物理或逻辑网络架构，为OpenStack云的不同区域提供了必要的网络和资源隔离。例如，可以通过物理LAN或VLAN分离来隔离区域。\n\
    \n## 评估风险\n\n考虑到这一最佳实践，管理员首先需要确定其组织中的威胁向量在哪里，以及哪些地方最易受攻击。一个例子是那些将Horizon等公开安全区域服务暴露于互联网的云。由于这些端点暴露在组织无法控制的网络和用户面前，该端点显然是采取高安全性措施的优先选择。然而，保护公共端点可能并不是OpenStack端点所需的唯一加密。根据组织的网络架构，威胁可能来自内部网络，这些网络可能连接到更安全的OpenStack区域（管理区域或私有区域）。因此，在制定加密安全策略时，仅仅依赖OpenStack的默认安全区域隔离是不够的。虽然在所有位置添加加密无疑会为所有流量增加额外保护，但如果端点主机被攻破，仅添加SSL/TLS加密将无法提供保护。因此，端点加密应只是更大范围的网络和基于主机的安全策略的一部分。\n\
    \n## 端点安全最佳实践\n\n在当今标准的OpenStack部署中，公共网络上的默认流量通过SSL进行保护。虽然这是一个良好的第一步，但最佳安全实践要求所有内部流量都应采用同样安全的实践。此外，由于最近的SSL漏洞，除非组织绝对需要遗留兼容性，否则SSL/TLS是唯一推荐的加密方法。\n\
    \nTLS通过公钥基础设施（PKI）框架保护端点。该框架是一组流程，通过验证相关方的身份来确保消息安全发送。PKI涉及私钥和公钥，它们协同工作以创建安全连接。这些密钥由证书颁发机构（CA）认证，大多数公司为自己的内部证书签发CA。面向公众的端点必须使用知名的公共证书颁发机构，以便大多数浏览器将连接识别为安全。因此，由于这些证书存储在单个主机上，主机安全对于保护私钥文件至关重要。如果私钥被泄露，那么使用该密钥的任何流量的安全性也会受到损害。\n\
    \n在OpenStack生态系统中，目前通过使用OpenSSL实现的库提供对TLS的支持。我们建议仅使用TLS 1.2，因为1.1和1.0容易受到攻击。由于许多不同的公开漏洞（Heartbleed、POODLE等），应完全避免使用SSL（v1-v3.0）。如今大多数实现实际上是TLS，因为TLS是SSL的演进版本。许多人将TLS\
    \ 1.0称为SSL 3.1，但常见的做法是将最新的HTTPS实现称为SSL/TLS或TLS/SSL。在本文档中，我们将使用前一种说法（即SSL/TLS）。\n\
    \n建议所有区域中的所有API端点都配置为使用SSL/TLS。但是，在某些情况下，由于加密所需的处理，性能可能会受到影响。在高流量的使用场景中，加密确实会消耗大量资源。在这些情况下，我们建议使用硬件加速器作为可能的选项，以便将加密工作从主机本身卸载。\n\
    \n对于OpenStack端点使用SSL/TLS的最常见用例是使用可以建立和终止SSL/TLS会话的SSL/TLS代理。虽然有多种选择，例如Pound、Stud、nginx、HAproxy或Apache\
    \ httpd，但将由管理员决定使用哪个工具。\n\n## 示例\n\n以下示例将展示如何通过Apache wsgi代理配置为Horizon的服务端点安装SSL/TLS，以及在Keystone中配置原生TLS支持。这些示例假设管理员已经从内部CA源获得了证书。如果您将公开发布Horizon或Keystone，则务必从全球CA获取证书。这些证书应能被所有浏览器识别，并且能够通过互联网进行验证。\n\
    \n让我们从Keystone开始：\n\n既然我们已经有了证书，让我们将它们放在正确的位置并赋予适当的权限：\n\n```\n# chown keystone\
    \ /etc/pki/tls/certs/keystone.crt\n# chown keystone /etc/pki/tls/private/keystone.key\n\
    ```\n\n现在我们可以开始进行正式的安全工作了。我们首先为Keystone添加一个新的SSL端点，然后删除旧的端点。首先，找到当前的端点：\n\n```\n\
    # keystone endpoint-list | grep 5000\n```\n\n现在创建新的端点：\n\n```\n# keystone endpoint-create\
    \ --publicurl https://openstack.example.com:5000/v2.0 --internalurl https://openstack.example.com:5000/v2.0\
    \ --adminurl https://openstack.example.com:5000/v2.0 --service keystone\n```\n\
    \n然后删除旧的端点：\n\n```\n# keystone endpoint-delete <endpoint-id-from-above-endpoint>\n\
    ```\n\n编辑您的 /etc/keystone/keystone.conf 文件，使其包含以下行：\n\n```\n[ssl]\nenable = True\n\
    certfile = /etc/pki/tls/certs/keystone.crt\nkeyfile = /etc/pki/tls/private/keystone.key\n\
    ```\n\n现在重启Keystone服务并确保没有错误：\n\n```\n# service openstack-keystone restart\n```\n\
    \n更改您的 keystonerc_admin 或任何其他项目环境文件中的环境变量，通过将 OS_AUTH_URL 更改为以下内容来包含新端点：\n\n```\n\
    OS_AUTH_URL=https://openstack.example.com:35357/v2.0/\n# source keystonerc_<user>\n\
    export OS_CACERT=/path/to/certificates\n```\n\n快速测试一下：\n\n```\nkeystone endpoint-list\n\
    ```\n\n## 保护云安全\n\n假设该命令没有显示任何错误，您现在可以配置其余的OpenStack服务，使其使用SSL/TLS连接到Keystone。这些配置都非常相似。以下以Nova为例。您需要编辑\
    \ `/etc/nova/nova.conf` 文件，使其看起来像这样：\n\n```ini\n[keystone_authtoken]\nauth_protocol\
    \ = https\nauth_port = 35357\nauth_host = openstack.example.com\nauth_uri = https://openstack.example.com:5000/v2.0\n\
    cafile = /path/to/ca.crt\n```\n\nCinder、Glance、Neutron、Swift、Ceilometer等也都是如此。以下是需要编辑的配置文件列表：\n\
    \n- `/etc/openstack-dashboard/local_settings` （Horizon 访问 Keystone）\n- `/etc/ceilometer/ceilometer.conf`\n\
    - `/etc/glance/glance-api.conf`\n- `/etc/neutron/neutron.conf`\n- `/etc/neutron/api-paste.ini`\n\
    - `/etc/neutron/metadata_agent.ini`\n- `/etc/glance/glance-registry.conf`\n- `/etc/cinder/cinder.conf`\n\
    - `/etc/cinder/api-paste.ini`\n- `/etc/swift/proxy-server.conf`\n\n一旦这些或其他任何服务配置文件被修改，请重启所有服务并测试您的云环境：\n\
    \n```bash\n# openstack-service restart\n# service httpd restart\n# openstack-status\n\
    ```\n\n您应该看到所有服务都在运行并且在线。现在您已经加密了OpenStack服务与Keystone之间的流量，这是保持云安全的一个非常重要的步骤。如果没有，请检查服务的日志文件以查找错误。\n\
    \n现在，我们配置Horizon，以使用SSL/TLS加密与客户端的连接。\n\n在控制器节点上，在Ubuntu的 `/etc/apache2/apache2.conf`\
    \ 和RHEL的 `/etc/httpd/conf/httpd.conf` 中添加以下内容（或修改现有配置以匹配）：\n\n```\n<VirtualHost\
    \ <ip address>:80>\n    ServerName <site FQDN>\n    RedirectPermanent / https://<site\
    \ FQDN>/\n</VirtualHost>\n<VirtualHost <ip address>:443>\n    ServerName <site\
    \ FQDN>\n    SSLEngine On\n    SSLProtocol +TLSv1 +TLSv1.1 +TLSv1.2\n    SSLCipherSuite\
    \ HIGH:!RC4:!MD5:!aNULL:!eNULL:!EXP:!LOW:!MEDIUM\n    SSLCertificateFile     \
    \ /path/<site FQDN>.crt\n    SSLCACertificateFile    /path/<site FQDN>.crt\n \
    \   SSLCertificateKeyFile /path/<site FQDN>.key\n    WSGIScriptAlias / <WSGI script\
    \ location>\n    WSGIDaemonProcess horizon user=<user> group=<group> processes=3\
    \ threads=10\n    Alias /static <static files location>\n    <Directory <WSGI\
    \ dir>>\n        # For http server 2.2 and earlier:\n        Order allow,deny\n\
    \        Allow from all\n\n        # Or, in Apache http server 2.4 and later:\n\
    \        # Require all granted\n    </Directory>\n</VirtualHost>\n```\n\n在计算节点上，`libvirt`\
    \ 守护进程的默认配置是不允许远程访问的。但是，在OpenStack计算节点之间进行实例的在线迁移需要计算节点之间的远程 `libvirt` 守护进程访问。显然，在大多数情况下，未经身份验证的远程访问是不允许的；因此，我们可以设置带有SSL/TLS加密的\
    \ `libvirtd` TCP套接字，并使用X.509客户端证书进行身份验证。\n\n"
