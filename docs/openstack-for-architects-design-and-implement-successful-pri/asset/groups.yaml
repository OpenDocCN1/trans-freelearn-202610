    requirements:


    - API services must continue to be available during a hardware failure in the
    control plane

    - The systems which provide API services must be horizontally scalable (and ideally
    elastic) to respond to unanticipated demands

    - The database services must be vertically or horizontally scalable to respond
    to unanticipated growth of the platform

    - The message bus can either be vertically or horizontally scaled depending on
    the technology chosen


    Finally, every system has its limits. These limits should be defined in the architecture
    documentation so that capacity planning can account for them. At some point, the
    control plane has scaled as far as it can and a second control plane should be
    deployed to provide additional capacity. Although OpenStack is designed to be
    massively scalable, it isn''t designed to be infinitely scalable.


