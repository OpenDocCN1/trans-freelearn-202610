    Clicking on the build number will present you with information as to whether or
    not the build succeeded or failed and allow you to view the console output of
    the build.


    To verify that Jenkins pulled our new changes into the modules, look for the new
    files in /etc/puppet/modules:


    ```

    # ls /etc/puppet/modules/profile/manifests/

    # ls /etc/puppet/modules/role/manifests/

    ```


    You should see the mariadb profile and the database role files in these directories.


    # Writing the tests


    For our first test, we''ll use the mysql command-line client to connect to the
    database we''ve configured and verify that we can log in using the username and
    password that we specified earlier. Since we''re not applying the new roles and
    profiles to any machines, this test will fail when we run it. First, install the
    mysql client on the CI server. We''ll use the following command to verify the
    connection to the database:


    ```

    # yum install -y mariadb

    ```


    Verify that the command was installed with the which command:


    ```

    # which mysql

    ```


    You should see /bin/mysql in the output.


    While we could write the test directly in the configuration for the build in Jenkins,
    it''s a best practice to include tests with the source code. Create a directory
    called test at the top level of the Git repository to hold the test. Use the same
    checked-out version of the repository that we were using before with the same
    unprivileged user account:


    ```

    $ cd ~/openstack/

    $ mkdir test

    ```


    Change into the test directory and create a shell script called test.sh, which
    attempts to connect to MySQL on the database node. The following script will suffice
    for now:


    ```

