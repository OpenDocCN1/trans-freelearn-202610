    # Security zones within OpenStack


    Within an OpenStack deployment exists a series of logical security zones. These
    are the basic areas of trust within the OpenStack platform that can be leveraged
    by applications, servers, networks, or users. These zones have an increasing level
    of trust and can be broken down into the following zones:


    +   1. Public

    +   2. Guest

    +   3. Management

    +   4. Data


    +   - **Public zones:** These zones within OpenStack are an entirely untrusted
    area of any cloud infrastructure. By convention, they are the most open and are
    thus called public. They are not necessarily open to the Internet, but the area
    is open to being consumed by untrusted resources and on networks without the operators
    direct authority. This area requires encryption and other compensating controls
    in order to meet the security requirements of most organizations.

    +   - **Guest zones:** These zones are for instances that are provisioned within
    the OpenStack cloud. They include inter-tenant network instance traffic (one instance
    to another across segregated networks or on the same tenant network). This traffic
    is not the traffic that supports the infrastructure of the cloud and provides
    the API access to OpenStacks native RESTful API endpoints. Providing unregulated
    public IP addresses into instances that reside in this domain will cause the domain
    to be untrusted. The only way this area can be considered trusted is when the
    compensating controls have been implemented to regulate public IP access into
    this zone using external network controls.'
