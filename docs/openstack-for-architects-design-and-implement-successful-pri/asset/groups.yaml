    最后，OpenStack 的 Neutron 组件包含多个代理，它们在高可用部署中都需要特殊考虑。DHCP 代理可以配置为高可用，而每个子网响应 DHCP
    请求的代理数量由 neutron.conf 文件中的参数 `dhcp_agents_per_network` 控制。该参数通常设置为 2，无论控制平面中配置运行多少个
    DHCP 代理。


    在 OpenStack 的大部分历史中，Neutron 中的 L3 路由代理一直是单点故障。它可以在主备（Active/Passive）配置下实现高可用，但其故障切换意味着租户空间中的网络连接会中断。许多第三方
    Neutron 插件已经以不同方式解决了这个问题，而参考 Open vSwitch 插件自 Juno 版本起提供了高可用的 L3 代理。关于使用 OpenStack
    分布式虚拟路由器（DVR）解决单一路由点故障的方案细节，请参阅 OpenStack 基金会的 Neutron 文档：http://docs.openstack.org/liberty/networking-guide/scenario-dvr-ovs.html。


    ## 区域、单元和可用区


    如前所述，OpenStack 设计为可扩展的，但不是无限可扩展的。架构师可以使用三种不同的技术来隔离 OpenStack 云：区域（region）、单元（cell）和可用区（availability
    zone）。在本节中，我们将逐一说明这些概念是如何映射到虚拟机监控程序拓扑的。


    ## 区域


    从最终用户的角度来看，OpenStack 区域等同于 Amazon Web Services 中的区域。区域位于不同的数据中心，通常以其地理位置命名。如果您的组织在菲尼克斯和罗利各有一个数据中心，那么您至少会有一个
    PHX 区域和一个 RDU 区域。希望在地理上分散工作负载的用户会将部分工作负载放在 PHX，部分放在 RDU。区域拥有独立的 API 端点，尽管 Horizon
    UI 对多区域有一定支持，但它们本质上完全是独立的部署。


    从架构的角度来看，实现区域有两个主要的设计选择，如下所示：


    - 第一个是关于授权。用户希望使用相同的凭据访问每个 OpenStack 区域。有几种方法可以实现这一点。最简单的方法是在每个区域的 Keystone 服务中使用通用的后端存储（通常是
    LDAP）。在这种情况下，用户必须分别向每个区域进行身份验证以获取令牌，但凭据是相同的。


    在 Juno 及更高版本中，Keystone 还支持跨区域联合。在这种场景下，一个区域授予的 Keystone 令牌可以提交给另一个区域来验证用户身份。虽然目前这种做法尚未广泛使用，但它是
    OpenStack 基金会的一个重点领域，并且将来可能会得到更广泛的采用。


    - 区域架构的第二个主要考虑因素是是否向每个区域提供一组相同的 Glance 镜像。虽然目前正在进行跨联邦云复制 Glance 镜像的工作，但大多数组织仍在手动确保共享镜像的一致性。这通常涉及围绕镜像发布和废弃构建工作流，并需要考虑区域布局。


    确保跨区域镜像一致的另一个选择是使用 Swift 实现中央镜像仓库。这也需要跨多个数据中心共享 Keystone 和 Glance 服务。关于如何设计具有共享服务的多区域的详细信息，请参阅
    OpenStack 架构设计指南。


    ## 单元


    Nova 计算服务具有单元（cell）的概念，可用于在单个区域内隔离大型虚拟机监控程序池。此技术主要用于缓解 OpenStack 消息总线的可扩展性限制。CERN
    的部署广泛使用单元来在单个区域内实现大规模可扩展性。


    不同服务对单元的支持各不相同，因此单元在少数超大型云部署之外并不常见。CERN 的部署有完善的文档记录，应作为此类部署的参考。


    根据我们的经验，在单个数据中心内部署多个区域比实现单元来实现大规模扩展要简单得多。向用户展示地理位置上多个 API 端点所带来的额外不便，通常会被更健壮平台的好处所抵消。如果一个地理区域内有多个控制平面，单个控制平面的故障就不会那么严重。


    ![](img/2f752555f69992669defa8b25e6dcee9_68_0.png)


    单元架构在网络和实例放置调度方面有其自身的挑战。一些支持 OpenStack 工作的大型公司多年来一直在努力克服这些障碍。然而，许多不同的 OpenStack
    发行版目前正在设计新的控制平面方案。这些新设计将开始将 OpenStack 控制平面拆分为多个容器，以微服务架构类型运行 OpenStack 服务。这样，服务本身可以放置在任何位置，并根据负载进行水平扩展。最近引起广泛关注的一个架构是
    Kolla 项目，它推广 Docker 容器和 Ansible playbook，为运行 OpenStack 云提供生产级容器和部署工具。更多信息请访问 https://wiki.openstack.org/wiki/Kolla。


    ## 可用区


    可用区用于在单个 OpenStack 区域内对虚拟机监控程序进行分组。可用区对最终用户可见，并应用于向用户提示云的底层拓扑。可用区最常见的用例是向用户暴露故障域。


    为了确保部署在 OpenStack 上的服务的高可用性，用户通常希望将其服务的各个组件部署到不同机架内的虚拟机监控程序上。这样，一个机架顶部交换机或 PDU
    的故障只会导致提供服务的部分实例宕机。因此，机架自然地构成了可用区的边界。除了向最终用户暴露故障域之外，可用区还有一些其他有趣的用途。我们合作过的一个金融服务客户要求每个业务线的实例都运行在专用硬件上。我们结合使用可用区和
    AggregateMultiTenancyIsolation Nova 调度器过滤器，以确保每个租户都能访问专用的计算节点。


    可用区也可以用于向最终用户公开硬件类别。例如，具有更快处理器的宿主机可以放在一个可用区中，而具有较慢处理器的宿主机可以放在不同的可用区中。这允许最终用户根据计算需求决定将工作负载放在何处。


    ## 更新设计文档


    在本章中，我们讨论了在 OpenStack 部署中实现高可用性和可扩展性的不同方法和注意事项。作为云架构师，我们需要为部署选择正确的方法，然后对其进行全面记录，以便组织内更大的团队进行评估。


    每个主要的 OpenStack 供应商都有一个高可用部署的参考架构，这些应作为设计的起点。然后，设计应与现有企业架构集成，并加以修改，以确保遵循组织内不同利益相关者确立的最佳实践。


    例如，Red Hat 的高可用控制平面使用 Galera 扩展来实现 Active/Active MariaDB 服务，但组织内的数据库架构师可能只支持 Active/Passive
    配置中的 Oracle MySQL。如果云架构师打算向数据库管理团队寻求支持，则可能选择实现数据库架构师经过验证的模式。组织内的网络架构师可能更熟悉支持 F5
    负载均衡器，而不是 HAProxy 负载均衡器。


    组织内的系统管理员可能更熟悉支持 Pacemaker，而不是 Keepalived。设计文档呈现了这些关键技术各自的选择，并在部署前为利益相关者提供评论的机会。


    ## 规划物理架构


    在上一章中，我们更新了物理架构部分，以包含将要部署的各种主机组的定义。实现高可用性最简单的方法是向部署中添加额外的云控制器并对它们进行集群。其他部署可能选择将服务隔离到不同的主机类别中，然后对这些类别进行集群。这可能包括将数据库服务分离到数据库节点、将消息传递服务分离到消息传递节点，以及将
    memcached 服务分离到 memcache 节点。

    '
