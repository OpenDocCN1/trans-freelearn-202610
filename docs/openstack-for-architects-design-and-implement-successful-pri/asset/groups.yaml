    OpenStack 的私有云。 在本最后一章中，我们将讨论 OpenStack 中的一些新兴趋势以及如何为贵组织制定其采用基础设施即服务(Infrastructure
    as a Service)的路线图。


    ### OpenStack 中的新兴趋势


    OpenStack 在其短暂的历史中演变的最有趣的事情之一是围绕核心计算、网络和存储服务出现的大量项目。 截至 OpenStack 的 Newton 版本，“大帐篷”中有近六十个项目。
    这些项目可以大致分为两类——提供额外基础设施组件的项目，以及管理 OpenStack 本身的安装、配置和生命周期的项目。 这第一组项目通常模仿 Amazon
    Web Services 中的类似物，并提供更完整的“堆栈”服务，可用于应用程序部署。 第二组项目包含配置管理代码，例如我们在前几章中用于部署 OpenStack
    的 Puppet 模块，以及由其他服务使用的通用服务和库。


    ### 向上迁移堆栈


    一些自动化额外基础设施组件的项目已被广泛采用，以至于被纳入商业供应商的 OpenStack 发行版中。 这些包括诸如 Trove，它提供数据库即服务，以及
    Sahara，它提供数据处理即服务。 这些项目利用 Nova 计算服务部署准备好的 Glance 镜像实例，为最终用户通过 OpenStack API 提供更高级别的资源，例如数据库。
    然后这些资源可以像任何其他 OpenStack 资源一样通过 API 或通过 Heat 编排服务进行自动化。


