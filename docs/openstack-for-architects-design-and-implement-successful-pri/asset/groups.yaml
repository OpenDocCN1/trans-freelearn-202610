    \ 上的 Heat 模板指南。\n\n## 计量和计费\n\n无论您是在构建公有云还是私有云，系统最关键的能力之一就是跟踪用户或租户供应的虚拟对象的使用情况。OpenStack\
    \ 中的使用情况跟踪方式与 Amazon Web Services 基本一致。对于计算资源，系统会跟踪特定实例的启动和终止时间。计算资源的成本与实例关联的规格中的\
    \ CPU 核心数或内存量有关。一些组织可能还会根据镜像来关联成本。\n\n例如，Red Hat Enterprise Linux 镜像的实例化可能每小时花费一定的美分数，而\
    \ Microsoft Windows 镜像的实例化可能花费不同。其他资源可能根据供应时间计费，而不管是否使用。例如，租户可能需要为浮动 IP 分配给项目的时间长度付费，无论它是否绑定到实例。Cinder\
    \ 卷通常也按这种方式处理。\n\n无论您的组织打算按消费量向客户收费，还是仅向客户展示其消费量，都有几种不同的策略来跟踪和报告使用数据。有些组织通过服务目录调用\
    \ API 在 OpenStack 上供应资源，他们选择将服务目录实现作为记录系统。这有助于为用户保持一致性。例如，如果他们供应了一个三层应用，他们可能希望按三层应用计费，而不是按三台虚拟机、一个\
    \ Cinder 卷和一个浮动 IP 计费。不过，对于 PaaS 或持续集成用例，在一段时间内使用的计算和存储总量可能更为重要。\n\n在 OpenStack\
    \ 中跟踪使用情况有几种基本方法。系统可以监听消息总线上的事件，或通过查询 Ceilometer 获取这些事件，然后推断使用数据。系统还可以直接查询 Ceilometer\
    \ 获取使用数据。除了计量和计费之外，这些方法也可用于其他用例，而且对于每种用例，有些方法比其他方法更合适。例如，监听事件并记录时间可以深入了解系统性能。此外，OpenStack\
    \ 系统中的某些事件可能会驱动合规性工作流。\n\n## 监听 OpenStack\n\nOpenStack 系统中有两种内部通信模式。第一种是对 REST\
    \ API 进行 GET 或 POST，第二种是向消息队列拉取和推送消息。每个服务都同时使用这两种模式；当 Nova API 通过 REST API 收到供应资源的请求时，它会通过消息总线将该请求传递给计算节点。它们通过总线发送回使用数据，但使用\
    \ API 与其他服务通信。这两种通信模式也可用于集成。正如我们可以使用 REST API 供应资源一样，我们可以使用消息总线跟踪它们的进度。\n\n以下代码示例使用\
    \ Python 中的 Kombu 库连接到消息总线上的 Nova 队列，以监听各种 Nova 服务之间的这些 RPC 调用。首先，我们定义一个回调方法来处理总线上的事件。这个简单的方法只是打印消息正文：\n\
    \n```\nfrom kombu import Connection, Exchange, Queue\n\ndef process_message(body,\
    \ message):\n    print body\n    message.ack()\n```\n\n然后我们创建一个名为 listener 的队列，并将其绑定到\
    \ nova 交换机。在以下示例中，我们将订阅 nova 队列上的所有消息：\n\n```\nnova_exchange = Exchange('nova',\
    \ 'topic', durable=False)\nnova_queue   = Queue('listener', exchange = nova_exchange,\n\
    routing_key='#')\nconn = Connection('amqp://guest:guest@192.168.0.10//')\nconsumer\
    \ = conn.Consumer(nova_queue, callbacks=[process_message])\nconsumer.consume()\n\
    ```\n\n请注意，连接字符串特定于所讨论的部署。消息总线的用户名和密码应与 /etc/nova/nova.conf 中的设置保持一致。\n\n最后，我们将检查队列中的消息并处理它们：\n\
    \n```\nwhile True:\n    conn.drain_events()\n```\n\n运行此示例将显示出 Nova 服务之间的通信有多么频繁。这些\
    \ RPC 消息的消息格式定义良好，但消息内容与版本相关。出于这些原因，大多数开发者会选择改用通知子系统。\n\n## 使用通知子系统\n\n每个 OpenStack\
    \ 服务都可以配置为在消息总线上发出通知。这些通知随后可以由消息客户端或 Ceilometer 服务接收。通知最初由每个服务分别实现，但该功能已合并到 Oslo\
    \ Messaging 库中，作为公共接口。\n\n## 集成平台\n\n要在 Nova 中启用通知，需要在 `/etc/nova/nova.conf` 中更改以下设置：\n\
    \n| nova.conf 设置 | 示例值 | 描述 |\n|---|---|---|\n| `instance_usage_audit` | `true`\
    \ | 开启使用情况审计 |\n| `instance_usage_audit_period` | `hour` | 将使用情况审计设置为每小时 |\n|\
    \ `notify_on_state_change` | `vm_and_task_state` | 告知 Nova 在虚拟机状态更改时发送通知 |\n|\
    \ `notification_driver` | `messagingv2` | 告知 Nova 将通知发送到消息总线 |\n\n还有其他可用的通知驱动程序。例如，通知可以发送到\
    \ syslog。有关更多信息，请参阅 `http://docs.openstack.org/developer/oslo.messaging/FAQ.html`\
    \ 上的 Oslo Messaging 常见问题解答。\n\n下面提供了一个可以监听这些通知事件的简单客户端：\n\n```\n```python\n#!/usr/bin/env\
    \ python\n\nfrom kombu import Connection, Exchange, Queue\n\ndef process_message(body,\
    \ message):\n    print body\n    message.ack()\n\nnova_exchange = Exchange('nova',\
    \ 'topic', durable=False)\nnotifications_queue = Queue('notification-listener',\
    \ exchange = nova_exchange, routing_key='notifications.info')\nconn = Connection('amqp://guest:guest@192.168.0.10/')\n\
    consumer = conn.Consumer(notifications_queue, callbacks=[process_message])\nconsumer.consume()\n\
    \nwhile True:\n    conn.drain_events()\n```\n```\n\n此示例创建了一个名为 `notification-listener`\
    \ 的队列，该队列绑定到 `nova` 交换机。不过，我们不监听交换机上的所有事件，而是订阅 `notifications.info` 主题。这确保我们只接收\
    \ Nova 服务指定为通知的消息。\n"
