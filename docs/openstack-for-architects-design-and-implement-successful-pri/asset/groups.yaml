    As we saw in the previous section, we have an audit trail of who created the user
    from the demonstrated command as well as what the project was and the resource
    ID. This data and all of the data from the other services combined will provide
    a 7 W''s audit trail for this user''s transactions as well as any other transactions
    in this cloud. However, since we now have audit data, we can start looking for
    security attacks. Some of these attacks may be as follows:


    - Real-time security alerts for brute force attacks on OpenStack

    - Detecting malicious or unauthorized access to virtual machines, volumes, or
    images

    - Accidental or intentional cloud service outages

    - Compliance reporting for all user activity in OpenStack


    These types of attacks can all be detected via log introspection. As we discussed
    in *Chapter 5, Building to Operate* there are a set of OpenStack tools that have
    been the de-facto standard for log shipping, formatting, and introspection. The
    three tools that make up this powerful combination are Elasticsearch (the searching
    module), Logstash (the log shipping tool), and Kibana (the visualization engine
    and dashboard). While we discussed these tools mostly in an operational viewpoint
    in *Chapter 5, Building to Operate* these same tools can be used to detect, in
    real time, all of the attacks listed earlier. The main advantages of this stack
    are as follows:


    - Open Source search server written in Java

    - Used to index many types of heterogeneous data

    - Real-time search through indexing

    - REST API web interface that outputs JSON


    A best architectural practice in this area would be to use Logstash in a distributed
    fashion to centralize all log files with CADF data to a secure host running Elasticsearch
    and Kibana. Logstash would then be configured to index the highly normalized CADF
    logs and limits would be created to alert on threshold breaches.


    For example, if the CADF logs detected thousands of failed Keystone authentication
    events from the same IP address within a short time period, chances are, this
    is a brute force attack and warrants an alert to the security and network teams.


    Using Kibana, the teams can search through the audit logs and determine how long
    the attacks have been occurring, if anyone valid is logging in through the same
    subnet, or any number of other analytics.


