    # Building to Operate


    Capacity in the cloud must be part of a more deterministic type of capacity planning
    methodology. Keeping the appropriate elasticity at all times is a tricky business
    and must be carefully monitored to achieve a balance between availability and
    depreciation of resources. Users tend to believe that cloud resources are infinite;
    sadly, however, they are not. All requests for resources, even paravirtualized
    ones, are simply mapped back to groups of physical devices that have limits. Unfortunately,
    end users tend to not know or somehow forget this paradigm. As a result, at times,
    end users fall back into a hoarding behavior when they are not charged or tracked
    for resource consumption. Unfortunately, this behavior is most likely the byproduct
    of years of legacy infrastructure processes taking months before developer teams
    were able to obtain additional infrastructure. With these limits and demands in
    mind, it is increasingly important for cloud administration or operations to take
    charge of capacity planning for all aspects of the OpenStack cloud. The easiest
    way to take charge of this behavior is through chargeback or showback. This allows
    OpenStack administrators to give users an account of what they are consuming on
    a regular basis. Additionally, if chargeback is enabled, it is a way for cloud
    groups or public providers to recoup the costs of maintaining an elastic environment.


    In order to be able to show and charge users for resources, administrators need
    to follow the preceding capacity planning recommendations as well as providing
    cloud users with features such as periodic statements, the cost for resources
    before deploying, running costs, and payment or billing options. While most software
    that can perform this functionality is in the commercial realm, there are a few
    open source tools that can be leveraged to provide some features.


    Some examples of leading capacity planning and chargeback solutions are as follows:


    | Name | Company | Open/closed source | Supports | Website |

    |---|---|---|---|---|

    | CloudKitty | Objectif Libre | Open source | OpenStack | https://wiki.openstack.org/wiki/CloudKitty
    |

    | HP | Cloud Optimizer 3.0 | Closed source | OpenStack AWS Xen VMware Hyper-V
    | http://www8.hp.com/us/en/software-solutions/capacity-planning-server-virtualization-management/
    |

    | Red Hat | Cloudforms ManageIQ | Closed source; Open source | OpenStack AWS Google
    | https://access.redhat.com/documentation/en-us/red_hat_cloudforms/4.1/html/manageiq.org/
