    |---|---|---|---|---|

    | controller1 | eth0 | 3C:97:0E:BF:6C:78 | 192.168.0.10 | Management |

    |  | eth0.100 | 3C:97:0E:BF:6C:78 | 10.0.0.10 | Provider |

