    ## 更新设计文档


    我们的首要任务是更新第 1 章 *Introducing OpenStack* 中的设计文档，并加入一组主机组的定义。这些定义应包含在文档的 *Physical
    architecture* 部分的开头。我们将在本次扩展的 **proof of concept (POC)** 中使用以下主机组。


    ### Cloud controller


    云控制器系统为 OpenStack 部署提供 API 服务、调度服务和 Horizon 仪表板服务。


    ### Compute node


    计算节点系统充当 KVM 超级管理器，并运行 `nova-compute` 和 `openvswitch-agent` 服务。


    设计文档的 *Physical architecture* 部分还应包含部署的物理网络架构部分。在此部分中，每个分段网络都应被定义。每个物理主机到每个网络的连通性也应被定义。


    Packstack 安装工具不允许指定用于 API 流量的外部网络。因此，在本次部署中我们将使用三个物理网络，一个可路由到内网的管理网络、一个为实例提供浮动
    IP 的提供者网络，以及一个用于实例流量的租户网络。以下网络定义应添加到 *Physical architecture* 部分。


    ### Management network


    管理网络用于 OpenStack 部署中所有节点之间的私有通信。在本次部署中，该网络还用于承载租户和存储流量。


    ### Provider network


    提供者网络用于为本次部署中的租户实例提供公共端口。云控制器节点在此网络段上有一个端口。


    ### Tenant network


    租户网络承载部署中的租户网络流量。它充当 SDN 隧道的下层网络。计算节点和控制器节点在此网络段上都有端口。


    还应在 *Physical architecture* 部分添加一个网络图。以下图表描述了本章中的部署：


