  - '[PAGE 118]


    # Monitoring performance


    Monitoring performance typically measures the responsiveness of a process, connection,
    or workflow. In cloud computing, it is typically used to define how long it takes
    to complete certain workflows. Some of these workflows are: creating instances,
    volumes, networks, or other OpenStack resources. The key metrics from the performance
    can usually be extracted from OpenStack service logs and the timestamps that they
    contain. Since provisioning an instance is a multiproject workflow, performance
    impacts can be traced end-to-end using start and finish times per project per
    request as well as between project handoffs. Other methods of measuring performance
    may use the output from OpenStack commands using native time measurement tools
    as well as by modifying the OpenStack code to add instrumentation.


    # Monitoring resource usage


    In this section, we will only partially use resource usage monitoring. In a later
    section, we will cover it in more depth as it relates to capacity planning. However,
    the purpose of resource usage monitoring is that an operator can, at will, retrieve
    the amount of resources being used by not only one user, but also tenant, or the
    entire cloud via the OpenStack APIs. This monitoring does not have to be performed
    in real time. In most instances, resource monitoring is an activity done with
    data that has been collected over a specific period of time. Later in this chapter,
    we will cover the Ceilometer project, which is the metering project for OpenStack.


    # Alerting


    The alerting process is one of the most important steps in any operational model.
    Alerting is the process by which the monitoring platform alerts the operator about
    a situation that is outside the set thresholds. These alerts can be delivered
    in a multitude of ways from ticketing platforms such as Remedy, e-mail, SMS, IRC,
    or even integrations with communication platforms such as Slack (www.slack.com).
    These alerts should contain the basic information regarding the event that triggered
    them. This could be any key value that has either gone from a good state to a
    non-good state or a key value that has breached an SLA level. In all cases, these
    alerts are driven by a change in state and may not be a direct indication of a
    problem, but may be an indication of a future issue.'
  - '[PAGE 119]


    Therefore, alerts should:


    +   - Display which OpenStack service is affected

    +   - Contain a general description of the change in state that caused the alert

    +   - If implemented, have a severity level defined by the operational staff

    +   - Have the ability to be marked as a false positive or be disabled during
    events such as maintenance

    +   - Have the ability to chain alerts together in a logical fashion to trigger
    additional actions and provide rudimentary correlation

    +   - Provide the ability to refer to time-series statistics such as median, percentile,
    and standard deviation

    +   - Provide an instant view of services that are in a good, warning, or failed
    state


    Believe it or not, most errors seen in a correctly configured OpenStack environment
    are not critical and indicate a complete outage. Most errors in OpenStack environments
    are usually due to failed provisions or other similar non-outage warnings. Remember,
    even if the OpenStack control plane has a complete failure, the workloads will
    continue to run (in most cases). Therefore, having a monitoring solution that
    can determine the proper alerting level for an error is critical. This resolves
    issues of overalerting operations personnel and causing them to troubleshoot minor
    warnings when in reality these warnings may be simply an indication of something
    minor and should be watched as a trend indicator. A simple requirement would consist
    of a policy similar to the following points:


    +   - Critical errors, resulting in failure states, should always be reported
    in an alert and require immediate action

    +   - Other problems in OpenStack HA environments, for example, one failed service
    on one controller in an environment with three controllers, should not be marked
    as critical, but marked as a warning or deferred state to indicate a degradation
    of high availability'
