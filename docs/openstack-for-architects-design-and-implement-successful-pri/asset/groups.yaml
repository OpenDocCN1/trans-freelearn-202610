  - '[PAGE 102]


    # Building the Deployment Pipeline


    Next, we''ll add a step to update the Puppet master with the latest code from
    the repository. Under Build, click on **Add build step** and select **Execute
    shell**. Specify the following command:


    ```

    ```bash

    cd /srv/openstack && git checkout -f $GIT_COMMIT

    ```

    ```


    This will update the copy of the repository that the Puppet master pulls from
    to the version we''re testing:


    ![](img/2f752555f69992669defa8b25e6dcee9_102_0.png)


    Let''s run a build to make sure that permissions are set correctly. Save the project.
    This will bring you back to the project page. Select **Build Now**. You''ll see
    your first build in the **Build History** tab on the bottom left:


    ![](img/2f752555f69992669defa8b25e6dcee9_102_1.png)'
