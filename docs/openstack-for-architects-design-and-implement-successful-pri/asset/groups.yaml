    OpenStack 架构可用的第三种 H/A 模式是 Active/Active 模式。在此模式中，服务在负载均衡服务或设备后面水平扩展，该负载均衡服务或设备为
    Active/Passive。作为一般规则，只要可能，大多数 OpenStack 服务都应启用为 Active/Active，以允许成功场景同时减轻故障场景。理想情况下，Active/Active
    服务可以通过简单地添加额外的控制平面节点，在无需服务中断的情况下弹性扩展。


    Active/Passive 和 Active/Active 设计都需要集群软件来确定服务及其运行主机的健康状况。在本章中，我们将使用 Pacemaker
    作为集群管理器。一些架构师可能会选择使用 Keepalived 而不是 Pacemaker。


    除了这三种场景之外，扩展 OpenStack 服务始终存在超出一定限制的限制。如前所述，消息总线通常是首先出现扩展问题的服务；然而，它并不是唯一的地方。在
    Canonical 和 Mirantis 的扩展测试中，测试人员发现 Nova 和 Cinder 项目以及数据库服务在扩展时也存在问题。始终最好实践是监控所有
    OpenStack 服务的响应能力，并在模拟环境中使用 Tempest 和/或 Rally 等工具进行扩展测试，以评估需求增长对 OpenStack 云的影响。


    ## Active/Passive 服务配置


    在 Active/Passive 服务配置中，服务配置并部署到两个或多个物理系统。服务与 **虚拟 IP (VIP)** 地址相关联。集群资源管理器（通常是
    Pacemaker）用于确保在任何时间点服务及其 VIP 仅在两个系统中的一个上启用。资源管理器可以配置为更偏好其中一台机器。


    当服务运行的机器发生故障时，资源管理器首先确保故障机器不再运行，然后在第二台机器上启动服务。确保故障机器不再运行的过程称为 **fencing**。Fencing
    通常涉及使用 BIOS 上的管理接口关闭机器电源。fence 代理还可能与连接到故障服务器的电源供应器通信，以确保系统已关闭。


    某些服务（如 Glance 镜像注册表）需要共享存储才能运行。如果存储基于网络，例如 NFS，存储可以同时挂载在活动节点和被动节点上。如果存储基于块，例如
    iSCSI，存储将仅挂载在活动节点上，并且资源管理器将确保存储随服务和 VIP 一起迁移。


    ## Active/Active 服务配置


    大多数 OpenStack API 服务设计为可同时在多个系统上运行。此配置即 Active/Active 配置，需要负载均衡器在各个活动服务之间分配流量。负载均衡器管理服务的
    VIP，并确保后端系统在转发流量之前正在监听。集群管理器确保 VIP 在任何时候仅在单个节点上处于活动状态。后端服务在 Active/Active 配置中可能由集群管理器管理，也可能不由其管理。服务或系统故障由负载均衡器检测，故障服务将被移出轮换。


    Active/Active 服务配置有以下几个优势：


    - 第一个优势是它允许水平扩展。如果给定服务需要额外容量，可以启动运行该服务的新系统，并将其在负载均衡器后面加入轮换，而无需任何停机。控制平面在过度配置的情况下也可以在不中断的情况下缩减规模。

    - 第二个优势是 Active/Active 服务的平均恢复时间要短得多。Fencing 操作通常需要长达两分钟，并且在集群资源管理器将服务从故障系统移动到健康系统之前需要进行
    fencing。负载均衡器可以立即检测系统故障并停止向无响应的节点发送请求，同时集群管理器在后台进行 fencing。


    只要可能，架构师应为控制平面服务采用 Active/Active 模式。


    ## OpenStack 服务具体说明


    在本节中，我们将逐一介绍每个 OpenStack 服务并概述其 H/A 策略。虽然大多数服务可以在负载均衡器后面配置为 Active/Active，但其中一些必须配置为
    Active/Passive，而其他一些可以配置为 Active/Active。一些配置还取决于 OpenStack 的特定版本，尤其是 Ceilometer、Heat
    和 Neutron。以下详细信息截至 OpenStack 的 Liberty 版本。


    ### OpenStack Web 服务


    作为一般规则，所有 Web 服务和 Horizon 仪表板都可以运行 Active/Active。这些包括 Keystone、Glance、Nova、Cinder、Neutron、Heat
    和 Ceilometer 的 API 服务。Nova、Cinder、Neutron、Heat 和 Ceilometer 的调度服务也可以部署为 Active/Active。这些服务不需要负载均衡器，因为它们响应消息总线上的请求。


    唯一必须运行 Active/Passive 的 Web 服务是 Ceilometer Central 代理。此服务可以配置为在多个实例之间拆分其工作负载，以支持水平扩展。


    ### 数据库服务


    所有 OpenStack Web 服务的状态都存储在中央数据库中，通常是 MySQL 数据库。MySQL 通常以 Active/Passive 配置部署，但可以使用
    Galera 复制扩展使其变为 Active/Active。Galera 是 MySQL（OpenStack 中的 MariaDB）的集群软件，它使用同步复制来实现
    H/A。然而，即使使用 Galera，我们仍然建议仅将写入定向到其中一个副本；OpenStack 服务使用的某些查询在写入多个主节点时可能会死锁。使用 Galera，通常会在集群前面部署负载均衡器，并配置为一次仅将流量传递到一个副本。此配置可减少服务的平均恢复时间，同时确保数据一致性。


    在实践中，许多组织会将高度可用的 MySQL 部署偏好交给数据库架构师。毕竟，通常是数据库管理团队负责响应该组件的故障。


    使用 Ceilometer 服务的部署还需要 MongoDB 数据库来存储遥测数据。MongoDB 按设计可水平扩展，通常以至少三个副本的 Active/Active
    方式部署。


    ### 消息总线


    所有 OpenStack 服务都通过消息总线进行通信。如今大多数 OpenStack 部署使用 RabbitMQ 服务作为消息总线。RabbitMQ 可以通过称为“mirrored
    queues”的功能配置为 Active/Active。RabbitMQ 服务不进行负载均衡；每个服务都会获得潜在节点的列表，客户端负责确定哪些节点处于活动状态，哪些节点已失败。


    与 OpenStack 一起使用的其他消息服务，如 ZeroMQ、ActiveMQ 或 Qpid，可能有不同的策略和配置来实现 H/A 和水平扩展。对于这些服务，请参阅文档以确定最佳架构。


    ### 计算、存储和网络代理


    OpenStack 中的计算、存储和网络组件有一组由 API 服务调度的执行工作的服务。这些服务在启动时通过消息总线向调度器注册自己。调度器负责确定服务的健康状况并将工作调度到活动服务。计算和存储服务都设计为可运行
    Active/Active，但网络服务需要额外考虑。


    OpenStack 部署中的每个超visor 都运行 nova-compute 服务。当此服务启动时，它会向 nova-scheduler 服务注册自己。当前可用的
    nova 服务列表可通过 nova service-list 命令获得。如果计算节点不可用，其状态列为 down，调度器在执行实例操作时会跳过它。当节点变得可用时，调度器会将其包含在可用主机列表中。


    对于基于 KVM 或 Xen 的部署，nova-compute 服务每个超visor 运行一次且不做高可用。对于基于 VMware 的部署，则为每个 vSphere
    集群运行单个 nova-compute 服务。因此，此服务应以 Active/Passive 配置实现高可用。这通常通过在 vSphere 集群内虚拟化该服务并配置虚拟机为高可用来实现。


    Cinder 包含一个称为卷服务或 cinder-volume 的服务。卷服务在启动时向 Cinder 调度器注册自己，并负责在块存储设备上创建、修改或删除
    LUN。对于支持多写入器的后端，可以以 Active/Active 配置运行多个此服务的副本。LVM 后端（这是参考后端）不可高可用，每个块设备只能有一个
    cinder-volume 服务。这是因为 LVM 后端负责为本地连接的存储设备提供 iSCSI 访问。


    ![](img/2f752555f69992669defa8b25e6dcee9_65_0.png)


    因此，OpenStack 的高可用部署应避免使用 LVM Cinder 后端，而应使用支持多个 cinder-volume 服务的后端。


    '
