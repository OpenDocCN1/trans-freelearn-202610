  md: "\nClick on **create new jobs**:\n\n![](img/2f752555f69992669defa8b25e6dcee9_100_0.png)\n\
    \nCreate a new **Freestyle project** called `openstack`, as shown here:\n\n![](img/2f752555f69992669defa8b25e6dcee9_101_0.png)\n\
    \nNow, we'll specify the options for the project. First, under **Source Code Management**,\
    \ select **Git** and specify `http://localhost/git/openstack` for your repository.\
    \ (This assumes that you're using the Git server that we set up on the CI server.\
    \ If you're using a remote Git repository, enter the clone URL for that instead.):\n\
    \n![](img/2f752555f69992669defa8b25e6dcee9_101_1.png)\n\n## Building the Deployment\
    \ Pipeline\n\nNext, we'll add a step to update the Puppet master with the latest\
    \ code from the repository. Under Build, click on **Add build step** and select\
    \ **Execute shell**. Specify the following command:\n\n```bash\ncd /srv/openstack\
    \ && git checkout -f $GIT_COMMIT\n```\n\nThis will update the copy of the repository\
    \ that the Puppet master pulls from to the version we're testing:\n\n![](img/2f752555f69992669defa8b25e6dcee9_102_0.png)\n\
    \nLet's run a build to make sure that permissions are set correctly. Save the\
    \ project. This will bring you back to the project page. Select **Build Now**.\
    \ You'll see your first build in the **Build History** tab on the bottom left:\n\
    \n![](img/2f752555f69992669defa8b25e6dcee9_102_1.png)\n\nClicking on the build\
    \ number will present you with information as to whether or not the build succeeded\
    \ or failed and allow you to view the console output of the build.\n\nTo verify\
    \ that Jenkins pulled our new changes into the modules, look for the new files\
    \ in /etc/puppet/modules:\n\n```\n# ls /etc/puppet/modules/profile/manifests/\n\
    # ls /etc/puppet/modules/role/manifests/\n```\n\nYou should see the mariadb profile\
    \ and the database role files in these directories.\n\n## Writing the tests\n\n\
    For our first test, we'll use the mysql command-line client to connect to the\
    \ database we've configured and verify that we can log in using the username and\
    \ password that we specified earlier. Since we're not applying the new roles and\
    \ profiles to any machines, this test will fail when we run it. First, install\
    \ the mysql client on the CI server. We'll use the following command to verify\
    \ the connection to the database:\n\n```\n# yum install -y mariadb\n```\n\nVerify\
    \ that the command was installed with the which command:\n\n```\n# which mysql\n\
    ```\n\nYou should see /bin/mysql in the output.\n\nWhile we could write the test\
    \ directly in the configuration for the build in Jenkins, it's a best practice\
    \ to include tests with the source code. Create a directory called test at the\
    \ top level of the Git repository to hold the test. Use the same checked-out version\
    \ of the repository that we were using before with the same unprivileged user\
    \ account:\n\n```\n$ cd ~/openstack/\n$ mkdir test\n```\n\nChange into the test\
    \ directory and create a shell script called test.sh, which attempts to connect\
    \ to MySQL on the database node. The following script will suffice for now:\n\n\
    ```\n#!/bin/sh\n\n/bin/mysql -h db.example.com -uroot -psecret  -e \"show databases;\"\
    \n```\n\nSubstitute the appropriate values for the -h and -p options for your\
    \ hostname and password, respectively. Running the script should result in failure:\n\
    \n```\n$ sh test.sh\n```\n\nIt should return Can't connect to MySQL server.\n\n\
    Add the test directory to your commit and then commit and push your changes:\n\
    \n```\n$ cd ../\n$ git add test\n$ git commit -m \"adding first test case\"\n\
    $ git push\n```\n\nOnce the code has been pushed, configure Jenkins to run the\
    \ test. In the Jenkins UI, select the openstack project and click on Configure\
    \ in the left-hand navigation. Under Build, click on Add a build step and select\
    \ Execute shell. Enter the shell command, as shown in the following screenshot:\n\
    \n![](img/2f752555f69992669defa8b25e6dcee9_104_0.png)\n\nSave the configuration,\
    \ and select Build Now from the left-hand navigation. This build should fail:\n\
    \n![](img/2f752555f69992669defa8b25e6dcee9_104_1.png)\n\nSelecting **Console Output**\
    \ should show the same error that we received when we ran the command on the command\
    \ line. Now let's set about configuring the database server to apply our profile\
    \ and class so that the test will pass.\n\n## Assigning the first role to a system\n\
    \nTo pull it all together, we'll start with a unconfigured system, install and\
    \ configure the Puppet agent, and have it pull down the configuration that we've\
    \ defined. Let's start by assigning the role to the system on the Puppet master.\n\
    \nAs the root user on the CI server, create a `site.pp` file in `/etc/puppet/manifests`,\
    \ which maps the unconfigured host to the role. For example, if my database host\
    \ is named `db.example.com`, the following stanza will work:\n\n```\nnode \"db.example.com\"\
    \ {\n  include role::database\n}\n```\n\nOn the host itself, install the RDO repository\
    \ and the puppet agent with the following commands:\n\n```\n# yum install -y https://rdoproject.org/repos/rdo-release.rpm\n\
    # yum install -y puppet\n```\n\nConfigure the system to use our CI server as its\
    \ Puppet master. For example, if our CI server is `jenkins.example.com`, enter:\n\
    \n```\n# puppet config set server 'jenkins.example.com' --section agent\n```\n\
    \nFinally, do an initial Puppet run to set up the certificates:\n\n```\n# puppet\
    \ agent -t\n```\n\nThis should show the error `no certificate found and waitforcert\
    \ is disabled`.\n\nLog into the CI server as root and approve the certificate\
    \ with the following command:\n\n```\n# puppet cert sign db.example.com\n```\n\
    \nYou will receive a notice that the certificate has been signed and the request\
    \ has been removed.\n\nBack on the database server, perform another Puppet run\
    \ to pull the configuration:\n\n```\n# puppet agent -t\n```\n\nThis will generate\
    \ a lot of output as the system downloads all of the Puppet modules from the master.\
    \ You should see the system download, install, and configure the MySQL databases\
    \ for OpenStack. Finally, run a build from Jenkins again to see it succeed.\n\n\
    ## Installing Keystone\n\nLet's iterate on the current environment, adding another\
    \ profile and role. Now that we have a database available, install the first OpenStack\
    \ service, Keystone. First write a unit test. Our test will ensure that we can\
    \ get a token from Keystone using the admin username and password that we specified\
    \ in the Packstack answer file. This can be done with a curl command. Create a\
    \ file named test_keystone.sh under the test directory in our Git repository:\n\
    \n```\n$ cd ~/openstack/test/\n$ vi test_keystone.sh\n```\n\nUse the following\
    \ content as an example, substituting your password for the password of the demo\
    \ user (secret) and the hostname of your first controller for controller01:\n\n\
    ```\ncurl -i \\\n  -H \"Content-Type: application/json\" \\\n  -d '\n  { \"auth\"\
    : {\n    \"tenantId\": \"demo\",\n    \"passwordCredentials\": {\n      \"userId\"\
    : \"demo\",\n      \"password\": \"secret\"\n    }\n  }\n}' \\\n  http://controller01:5000/v2/auth/tokens\
    \ ; echo\n```\n\nNow run the script. It should fail with a Connection refused\
    \ error.\n\nTo make the test pass, follow a process similar to the one we used\
    \ to create the database profile. Create a file named puppet/modules/openstack-profile/manifests/keystone.pp\
    \ in the openstack repository with the following contents:\n\n```\nclass profile::keystone\
    \ {\n  include '::packstack::apache'\n  include '::packstack::keystone'\n}\n```\n\
    \nAs before, create a role named controller and assign the keystone profile to\
    \ the role. Create a file named puppet/modules/openstack-role/manifests/controller.pp\
    \ with the following contents:\n\n```\nclass role::controller {\n  include profile::keystone\n\
    }\n```\n\nCommit and push these files into the repository:\n\n```\n$ git add puppet/modules/openstack-profile/manifests/keystone.pp\n\
    $ git add puppet/modules/openstack-role/manifests/controller.pp\n$ git commit\
    \ -m 'adding a controller role and keystone profile'\n$ git push\n```\n\nRun the\
    \ build from Jenkins again to push the files to the Puppet master. We haven't\
    \ configured Jenkins to run the new test yet, so the build should succeed, even\
    \ though the test would fail.\n\nOnce again, take an unassigned machine and assign\
    \ it the role of controller based on the hostname. In this example, we'll assign\
    \ the role to a machine named controller01.example.com. Edit /etc/puppet/manifests/site.pp\
    \ on the CI server and add the following stanza:\n\n```\nnode \"controller01.example.com\"\
    \ {\n  include role::controller\n}\n```\n\nOn the unconfigured host named controller01.example.com,\
    \ install the Puppet agent and set the Puppet master:\n\n```\n# yum install -y\
    \ https://rdoproject.org/repos/rdo-release.rpm\n# yum install -y puppet\n# puppet\
    \ config set server 'jenkins.example.com' --section agent\n# puppet agent -t\n\
    ```\n\nOnce again, you'll need to approve the certificate on the Puppet master:\n\
    \n```\n# puppet cert sign controller01.example.com\n```\n"
  mdcn: "\n\n点击 **create new jobs**：\n\n![](img/2f752555f69992669defa8b25e6dcee9_100_0.png)\n\
    \n创建一个名为 `openstack` 的 **Freestyle project**，如下所示：\n\n![](img/2f752555f69992669defa8b25e6dcee9_101_0.png)\n\
    \n现在，我们将指定项目的选项。首先，在 **Source Code Management** 下，选择 **Git** 并为你的仓库指定 `http://localhost/git/openstack`。（这假定你使用的是我们在\
    \ CI 服务器上设置的 Git 服务器。如果使用远程 Git 仓库，则输入该仓库的克隆 URL。）\n\n![](img/2f752555f69992669defa8b25e6dcee9_101_1.png)\n\
    \n## Building the Deployment Pipeline\n\n接下来，我们将添加一个步骤来使用仓库中的最新代码更新 Puppet master。在\
    \ Build 下，点击 **Add build step** 并选择 **Execute shell**。指定以下命令：\n\n```bash\ncd /srv/openstack\
    \ && git checkout -f $GIT_COMMIT\n```\n\n这将把 Puppet master 拉取的仓库副本更新为我们正在测试的版本：\n\
    \n![](img/2f752555f69992669defa8b25e6dcee9_102_0.png)\n\n让我们运行一次构建以确保权限设置正确。保存项目。这会带你返回项目页面。选择\
    \ **Build Now**。你会在左下角的 **Build History** 选项卡中看到第一次构建：\n\n![](img/2f752555f69992669defa8b25e6dcee9_102_1.png)\n\
    \n点击构建编号将显示构建是否成功或失败的信息，并允许你查看构建的控制台输出。\n\n要验证 Jenkins 是否将我们的新更改拉取到模块中，请在 /etc/puppet/modules\
    \ 中查找新文件：\n\n```\n# ls /etc/puppet/modules/profile/manifests/\n# ls /etc/puppet/modules/role/manifests/\n\
    ```\n\n你应该在这些目录中看到 mariadb profile 和 database role 文件。\n\n## Writing the tests\n\
    \n对于我们的第一个测试，我们将使用 mysql 命令行客户端连接到我们配置的数据库，并验证我们是否可以使用之前指定的用户名和密码登录。由于我们没有将新的\
    \ roles 和 profiles 应用到任何机器上，因此运行此测试时会失败。首先，在 CI 服务器上安装 mysql 客户端。我们将使用以下命令来验证与数据库的连接：\n\
    \n```\n# yum install -y mariadb\n```\n\n使用 which 命令验证命令是否已安装：\n\n```\n# which\
    \ mysql\n```\n\n你应该在输出中看到 /bin/mysql。\n\n虽然我们可以在 Jenkins 构建的配置中直接编写测试，但最佳实践是将测试与源代码一起包含。在\
    \ Git 仓库的顶层创建一个名为 test 的目录来存放测试。使用与之前相同的已检出仓库版本和相同的非特权用户账户：\n\n```\n$ cd ~/openstack/\n\
    $ mkdir test\n```\n\n进入 test 目录并创建一个名为 test.sh 的 shell 脚本，该脚本尝试连接到数据库节点上的 MySQL。以下脚本目前足够：\n\
    \n```\n#!/bin/sh\n\n/bin/mysql -h db.example.com -uroot -psecret  -e \"show databases;\"\
    \n```\n\n根据你的主机名和密码，分别替换 -h 和 -p 选项的适当值。运行脚本应导致失败：\n\n```\n$ sh test.sh\n```\n\
    \n它应返回 Can't connect to MySQL server。\n\n将 test 目录添加到你的提交中，然后提交并推送更改：\n\n```\n\
    $ cd ../\n$ git add test\n$ git commit -m \"adding first test case\"\n$ git push\n\
    ```\n\n代码推送后，配置 Jenkins 运行测试。在 Jenkins UI 中，选择 openstack 项目并点击左侧导航中的 Configure。在\
    \ Build 下，点击 Add a build step 并选择 Execute shell。输入如下截图所示的 shell 命令：\n\n![](img/2f752555f69992669defa8b25e6dcee9_104_0.png)\n\
    \n保存配置，然后从左侧导航中选择 Build Now。此次构建应失败：\n\n![](img/2f752555f69992669defa8b25e6dcee9_104_1.png)\n\
    \n选择 **Console Output** 应显示我们在命令行上运行命令时收到的相同错误。现在让我们着手配置数据库服务器以应用我们的 profile 和\
    \ class，以便测试通过。\n\n## Assigning the first role to a system\n\n为了整合所有内容，我们将从一台未配置的系统开始，安装并配置\
    \ Puppet agent，并使其拉取我们定义好的配置。让我们先在 Puppet master 上将角色分配给系统。\n\n以 CI 服务器上的 root\
    \ 用户身份，在 `/etc/puppet/manifests` 中创建 `site.pp` 文件，将未配置的主机映射到角色。例如，如果我的数据库主机名为\
    \ `db.example.com`，以下片段即可工作：\n\n```\nnode \"db.example.com\" {\n  include role::database\n\
    }\n```\n\n在主机本身上，使用以下命令安装 RDO 仓库和 puppet agent：\n\n```\n# yum install -y https://rdoproject.org/repos/rdo-release.rpm\n\
    # yum install -y puppet\n```\n\n配置系统使用我们的 CI 服务器作为其 Puppet master。例如，如果我们的 CI\
    \ 服务器是 `jenkins.example.com`，请输入：\n\n```\n# puppet config set server 'jenkins.example.com'\
    \ --section agent\n```\n\n最后，执行一次初始 Puppet 运行以设置证书：\n\n```\n# puppet agent -t\n\
    ```\n\n这应显示错误 `no certificate found and waitforcert is disabled`。\n\n以 root 身份登录\
    \ CI 服务器并使用以下命令批准证书：\n\n```\n# puppet cert sign db.example.com\n```\n\n你将收到证书已被签名且请求已被移除的通知。\n\
    \n回到数据库服务器，执行另一次 Puppet 运行以拉取配置：\n\n```\n# puppet agent -t\n```\n\n这将产生大量输出，因为系统会从\
    \ master 下载所有 Puppet 模块。你应该看到系统下载、安装并为 OpenStack 配置 MySQL 数据库。最后，再次从 Jenkins 运行一次构建以使其成功。\n\
    \n## Installing Keystone\n\n让我们在当前环境上迭代，添加另一个 profile 和 role。现在我们有了可用的数据库，安装第一个\
    \ OpenStack 服务 Keystone。首先编写单元测试。我们的测试将确保我们可以使用 Packstack 答案文件中指定的 admin 用户名和密码从\
    \ Keystone 获取令牌。这可以通过 curl 命令完成。在 Git 仓库的 test 目录下创建一个名为 test_keystone.sh 的文件：\n\
    \n```\n$ cd ~/openstack/test/\n$ vi test_keystone.sh\n```\n\n使用以下内容作为示例，将密码替换为\
    \ demo 用户的密码（secret），将第一个控制器的主机名替换为 controller01：\n\n```\ncurl -i \\\n  -H \"\
    Content-Type: application/json\" \\\n  -d '\n  { \"auth\": {\n    \"tenantId\"\
    : \"demo\",\n    \"passwordCredentials\": {\n      \"userId\": \"demo\",\n   \
    \   \"password\": \"secret\"\n    }\n  }\n}' \\\n  http://controller01:5000/v2/auth/tokens\
    \ ; echo\n```\n\n现在运行脚本。它应以 Connection refused 错误失败。\n\n要使测试通过，请遵循与创建数据库 profile\
    \ 时类似的过程。在 openstack 仓库中创建文件 puppet/modules/openstack-profile/manifests/keystone.pp，内容如下：\n\
    \n```\nclass profile::keystone {\n  include '::packstack::apache'\n  include '::packstack::keystone'\n\
    }\n```\n\n如前所述，创建一个名为 controller 的 role 并将 keystone profile 分配给该 role。创建文件 puppet/modules/openstack-role/manifests/controller.pp，内容如下：\n\
    \n```\nclass role::controller {\n  include profile::keystone\n}\n```\n\n将这些文件提交并推送到仓库：\n\
    \n```\n$ git add puppet/modules/openstack-profile/manifests/keystone.pp\n$ git\
    \ add puppet/modules/openstack-role/manifests/controller.pp\n$ git commit -m 'adding\
    \ a controller role and keystone profile'\n$ git push\n```\n\n再次从 Jenkins 运行构建以将文件推送到\
    \ Puppet master。我们尚未配置 Jenkins 运行新的测试，因此构建应成功，即使测试会失败。\n\n再次取一台未分配的机器并根据主机名分配\
    \ controller 角色。在此示例中，我们将角色分配给名为 controller01.example.com 的机器。编辑 CI 服务器上的 /etc/puppet/manifests/site.pp\
    \ 并添加以下片段：\n\n```\nnode \"controller01.example.com\" {\n  include role::controller\n\
    }\n```\n\n在名为 controller01.example.com 的未配置主机上，安装 Puppet agent 并设置 Puppet master：\n\
    \n```\n# yum install -y https://rdoproject.org/repos/rdo-release.rpm\n# yum install\
    \ -y puppet\n# puppet config set server 'jenkins.example.com' --section agent\n\
    # puppet agent -t\n```\n\n再次，你需要在 Puppet master 上批准证书：\n\n```\n# puppet cert sign\
    \ controller01.example.com\n```\n\n"
