  md: "\n## Using the REST APIs\n\nThe OpenStack REST APIs are patterned after the\
    \ Amazon EC2 APIs and are simple to interact with. There are typically two options\
    \ for this interaction, depending on the language that the provisioning system\
    \ is written in. Clients can either call the APIs directly using the language's\
    \ HTTP or REST library or they can use one of the many **cloud libraries** that\
    \ have sprung up in the last few years. These libraries can greatly simplify development\
    \ by taking care of the authentication and serialization pieces of the work, but\
    \ they can also limit the available API actions. Cloud libraries that we've seen\
    \ commonly used these days include Apache jclouds for Java, OpenStack Shade for\
    \ Python, and Fog for Ruby.\n\nIn this chapter, we'll interact directly with the\
    \ REST APIs. Let's breakdown how a virtual instance would be launched using the\
    \ REST API:\n\n- 1. The client requests a token from Keystone.\n- 2. The client\
    \ retrieves a list of keypairs from Nova.\n- 3. The client retrieves a list of\
    \ images from Nova.\n- 4. The client retrieves a list of flavors from Nova.\n\
    - 5. The client retrieves a list of networks from Neutron.\n- 6. The client optionally\
    \ creates a volume in Cinder.\n- 7. The client asks Nova to create an instance\
    \ with the selected image, flavor, network, and (optionally) volume.\n\nThe client\
    \ can then perform various actions on the instance when created, including termination.\
    \ Let's walk through this workflow using the Python requests library:\n\n- 1.\
    \ First, we'll request a token from Keystone (the actual Python code is as follows):\n\
    \n```\nimport requests #http://docs.python-requests.org/en/latest\nimport json\n\
    \nKEYSTONE_URL = 'http://controller:5000/v2.0/'\nTENANT       = 'demo'\nUSERNAME\
    \     = 'demo'\nPASSWORD     = 'secret'\n\nr = requests.post(\"%s/tokens\" % (KEYSTONE_URL,),\
    \ json={\n    \"auth\": {\n        \"tenantName\": TENANT,\n        \"passwordCredentials\"\
    : {\n            \"username\": USERNAME,\n            \"password\": PASSWORD,\n\
    \        }\n    }\n})\n\nif r.ok:\n    token = r.json()['access']['token']['id']\n\
    else:\n    raise Exception(r.text)\n```\n\n- 2. The requests library simplifies\
    \ working with the REST interface a little by deserializing the JSON returned\
    \ by Keystone into a Python dictionary via the `json()` function. The response\
    \ from Keystone contains the token ID, which we will include as a header to any\
    \ further requests:\n\n```\n# Place the token in the X-Auth-Token header\nheaders\
    \ = {'X-Auth-Token': token}\n```\n\n- 3. The response from Keystone also contains\
    \ a service catalog, a set of links to the other services that we want to interact\
    \ with. Keystone may give out links for more than one region, depending on the\
    \ configuration. In our lab, though, we can just use the first link for each service.\
    \ The following code will search the catalog for the compute and network services:\n\
    \n```\n# Find the link to the Nova API in the service catalog:\nfor service in\
    \ r.json()['access']['serviceCatalog']:\n    if service['type'] == 'compute':\n\
    \        nova_endpoint = service['endpoints'][0]['publicURL']\n    if service['type']\
    \ == 'network':\n        neutron_endpoint = service['endpoints'][0]['publicURL']\n\
    ```\n\nNote that the endpoint in the catalog is scoped to the tenant we authenticated\
    \ with. For example, if our tenant ID is `8ce08c9fa6c54ba094be743a55dc5b9a`, our\
    \ Nova endpoint will be `http://10.3.71.50:8774/v2/8ce08c9fa6c54ba094be743a55dc5b9a`.\
    \ As such, the only endpoint that shouldn't be dynamically determined is the Keystone\
    \ endpoint. All other endpoints that need to be interacted with should be pulled\
    \ from the service catalog.\n\n- 4. Next, we'll look up the keypair, image, flavor,\
    \ and network to use when launching the image:\n\n```\nkeypair_ref = None\n# Get\
    \ the list of available keypairs:\nkeypairs = requests.get(\"%s/os-keypairs\"\
    \ % nova_endpoint,\nheaders=headers)\n# take the first one\n```\n\n![](img/2f752555f69992669defa8b25e6dcee9_147_0.png)\n\
    \n```\nkeypair_ref = keypairs.json()['keypairs'][0]['keypair']['name']\n\nimage_ref\
    \ = None\n# Get the list of available images:\nimages = requests.get(\"%s/images\"\
    \ % nova_endpoint,\nheaders=headers)\n# Select the \"cirros\" image:\nfor image\
    \ in images.json()['images']:\n    if image['name'] == 'cirros':\n        image_ref\
    \ = image['id']\n\nflavor_ref = None\n# Get the list of available flavors:\nflavors\
    \ = requests.get(\"%s/flavors\" % nova_endpoint,\nheaders=headers)\n# Select the\
    \ \"m1.small\" flavor\nfor flavor in flavors.json()['flavors']:\n    if flavor['name']\
    \ == 'm1.small':\n        flavor_ref = flavor['id']\n\nnetwork_ref = None\n# Get\
    \ the list of available networks:\nnetworks = requests.get(\"%s/v2.0/networks\"\
    \ % neutron_endpoint,\nheaders=headers)\n# Select the \"private\" network\nfor\
    \ network in networks.json()['networks']:\n    if network['name'] == 'private':\n\
    \        network_ref = network['id']\n```\n\nEach of these GET requests includes\
    \ the token that we retrieved from Keystone in the headers. The keypair and flavor\
    \ are retrieved from the Nova API, as is the image, although it is actually stored\
    \ in Glance. The network reference is also available from the Nova API, but we\
    \ retrieve it from the Neutron API in this example. The Neutron API provides more\
    \ information and control over the network objects.\n\n> Note that while the Nova\
    \ endpoint includes a version string (v2), the Neutron endpoint does not. Also,\
    \ note that the Neutron endpoint does not include the tenant ID. Each OpenStack\
    \ API was developed independently by different teams and there is little consistency\
    \ between them.\n\n- 5. The following code will launch an instance using the four\
    \ references we retrieved in the previous section:\n\n```\n# Launch the instance:\n\
    server = requests.post(\"%s/servers\" % (nova_endpoint,), json={\n    \"server\"\
    : {\n        \"name\": \"new_server\",\n        \"imageRef\": image_ref,\n   \
    \     \"flavorRef\": flavor_ref,\n        \"key_name\": keypair_ref,\n       \
    \ \"networks\": [{\n            \"uuid\": network_ref\n        }]\n    }\n}, headers=headers)\n\
    server_ref = server.json()['server']['id']\n```\n\nThe preceding behavior is normal\
    \ for REST API; this is a POST request with JSON. There are a couple of things\
    \ to note about this call. The first is that the call blocks only as long as it\
    \ takes for the Nova scheduler to accept the request. A successful return code\
    \ does not mean that the instance was successfully launched. The second is that\
