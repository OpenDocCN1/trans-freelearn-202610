  md: "\n## The impact of containers\n\nLinux containers have taken the technology\
    \ world by storm in the last few years and they have impacted OpenStack in two\
    \ different areas. First of all, OpenStack is now seen as one of the most flexible\
    \ infrastructures for the deployment of container-based Platform as a Service\
    \ technologies such as Kubernetes and Cloud Foundry. Secondly, OpenStack is now\
    \ increasingly deployed as a set of containerized services. Additional Big Tent\
    \ projects have sprung up around both of these use cases for containers in OpenStack.\n\
    \nMagnum is a popular project that automates the provisioning of container orchestration\
    \ environments. Magnum uses the Nova compute service to provision these environments\
    \ inside of OpenStack tenants in the same way that Trove and Sahara do. As of\
    \ the Newton release of OpenStack, Magnum supports Docker Swarm, Kubernetes, and\
    \ Apache Mesos clusters, abstracted as “bays” for containers. Another popular\
    \ project focused on containers is Kuryr, which allows users to bridge Neutron\
    \ networks from the infrastructure layer into the application layer.\n\nPerhaps\
    \ the largest emerging change in the management and deployment of OpenStack is\
    \ the use of containers to deploy OpenStack services. This work was pioneered\
    \ in the Kolla project, which uses Ansible and Docker to deploy and manage OpenStack\
    \ services. It has since spread to other projects – the Fuel installer is currently\
    \ moving to a Docker-based deployment strategy and the OpenStack-Ansible project\
    \ (OSA) uses LXC containers to deploy OpenStack services. As these efforts gain\
    \ consensus, organizations should evaluate whether or not a container-based deployment\
    \ methodology works well for them.\n\n## Building the roadmap\n\nIt’s an exciting\
    \ time to be involved in such a rapidly changing project. That excitement should\
    \ be leveraged by a Cloud Architect who is looking to gain adoption from application\
    \ development teams. One way to build interest in the developer community is to\
    \ continually expand the amount of services that are available to them in the\
    \ private cloud. As we mentioned earlier, adding capabilities from services such\
    \ as Trove or Designate to the cloud simplifies the work that both developers\
    \ and operators do. Including developer teams as early-adopters of new features\
    \ is a great way to build rapport and confidence with them as well.\n\n## Introducing\
    \ new features\n\nA prerequisite for being able to incrementally add new features\
    \ to an OpenStack deployment is to have a set of test environments available to\
    \ advance the features through. Cloud engineering teams should have a private\
    \ environment where they can develop and test new features and another environment\
    \ where end users can test features before they are rolled out to production cloud\
    \ environments. Having multiple environments also allows new functionality to\
    \ bake in, which allows cloud operators the ability to see what the logging, performance,\
    \ and other impacts of a new feature will be. Instrumentation can also be developed\
    \ and tested in the lower environments.\n\nNew features or capabilities should\
    \ be introduced incrementally into the platform. In the planning stage, use cases\
    \ for the capabilities should be defined and test cases should be written. These\
    \ new features and capabilities should also be tested and deployed in the same\
    \ manner as code; first in test environments, then into production. As the features\
    \ are deployed into lower environments, documentation should be updated and test\
    \ cases for the capabilities should be added to the monitoring regimen. A simple\
    \ way to test these new capabilities is to write an example Heat orchestration\
    \ template that exercises them. For example, adding the provisioning of a database\
    \ to an existing application stack that is already being deployed by Heat. This\
    \ template can then also be provided to application teams as documentation for\
    \ the service.\n\n## Releasing new versions\n\nOne of the most discussed and criticised\
    \ aspects of OpenStack has always been the major version upgrade procedure. On\
    \ the upside though, it's also one of the most thoroughly documented and tested\
    \ aspects of the project. Each major component of OpenStack provides an upgrade\
    \ path between releases and most of them support rolling upgrades at this point.\
    \ Much work has been done to de couple the API versions of the various services\
    \ to ensure that services can be updated one at a time without downtime. The truth\
    \ is, though, that it's hard to upgrade an operating private cloud. Users of private\
    \ clouds expect their workloads to be continuously available. As such, many of\
    \ the OpenStack adopters that we've worked with have been reluctant to update\
    \ their clouds once they're in production.\n\nWhile deploying a release of OpenStack\
    \ and then running it for a few years is certainly possible (commercial vendors\
    \ such as Red Hat provide support for up to three years for a given release of\
    \ OpenStack), we certainly don't recommend it. Organizations who deployed the\
    \ Icehouse release of OpenStack and have run it for a couple of years will end\
    \ up re-engineering much of their configuration management and deployment processes\
    \ for the Newton release. This work takes a lot of time and effort. Organizations\
    \ who have stepped through the releases or have deployed a new release every calendar\
    \ year will have a much smaller amount of change to manage when the new version\
    \ does come out.\n\nIncremental change has a smaller impact on the developer community\
    \ as well. As we mentioned previously, continually improving and updating your\
    \ Infrastructure as a Service will keep the community engaged and eliminate the\
    \ need to retrain them every time a new platform is released.\n\n## Summary\n\n\
    In this book, we've walked through the major areas of focus in the emerging practice\
    \ of a Cloud Architect as it pertains to OpenStack. We've shown you some techniques\
    \ and recommendations to enable you to work with company stakeholders and provide\
    \ architectural leadership in order to create a holistic design for OpenStack\
    \ in an enterprise. Successfully designing, deploying, and operating OpenStack\
    \ clouds requires a wide breadth of knowledge in the fields of compute, network,\
    \ storage, and software design. It also takes a deep understanding of a company's\
    \ strategic mission, processes, and success criteria for implementing a private\
    \ cloud. Successful Cloud Architects leverage the knowledge and practice of subject\
    \ matter experts in deep technical areas in conjunction with their own knowledge\
    \ when designing OpenStack clouds. This book was written to provide a framework\
    \ that an Architect could use to create a successful OpenStack deployment in concert\
    \ with the rest of an enterprise using modern software development methodologies.\
    \ While this book provides a solid foundation for OpenStack architecture, we hope\
    \ it has given you the tools and confidence to begin your own journey into OpenStack\
    \ architectural design.\n\n## References\n\nOpenStack projects – http://governance.openstack.org/reference/projects/\n\
