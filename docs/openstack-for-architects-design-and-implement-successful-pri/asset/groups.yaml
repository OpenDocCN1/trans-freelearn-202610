    # 1

    ## 介绍 OpenStack


    在 2015 年 5 月的温哥华 OpenStack 大会上，美国零售巨头沃尔玛宣布，他们已部署了一个 OpenStack 云，拥有 140,000 个计算核心，在网络星期一支持了
    15 亿次页面浏览。长期使用 OpenStack 的 CERN 宣布，他们的 OpenStack 私有云已扩展到 10 万个核心，在生产环境中运行了两拍字节磁盘上的计算工作负载。另有
    250 家公司和组织在九个行业领域宣布已在其数据中心采用 OpenStack。


    OpenStack 在其短短五年的存在中完全重绘了私有云格局。在本章中，我们将了解 OpenStack 是什么以及它为何如此有影响力。我们还将迈出设计云架构的第一步。


    ## 什么是 OpenStack？


    OpenStack 最好通过其用例来定义，因为用户和贡献者带着许多不同的目标来使用该软件。对于 Rackspace 等托管提供商而言，OpenStack 提供了多租户共享服务平台的基础设施。对于其他人来说，它可能为分布式商业智能应用程序提供数据和计算的配置机制。无论您组织的用例如何，以下几个答案都相关。


    ## OpenStack 是一个 API


    OpenStack 的最初目标之一是提供与 Amazon Web Service 的应用程序编程接口（API）兼容性。根据 2014 年 11 月的用户调查，44%
    的生产部署仍在使用 EC2 兼容性 API 与系统交互。随着平台受欢迎程度的提高，OpenStack API 本身已成为事实上的标准。因此，我们与之合作创建
    OpenStack 云的许多企业组织都将其用作一个或多个平台即服务或混合云部署的基础设施即服务层。


    OpenStack 的每个功能或功能都通过其 REST API 之一公开。OpenStack 有命令行界面（旧版 nova 和更新的 openstack 常用客户端）以及标准
    Web 界面（Horizon）。然而，组件与最终用户之间的大多数交互都是通过 API 进行的。这具有以下优势：


    - 系统中的一切都可以自动化

    - 与其他系统的集成定义明确

    - 用例可以明确定义并自动测试


    ![](img/2f752555f69992669defa8b25e6dcee9_18_0.png)


    API 是定义明确且版本化的 REST API，并且有超过十几种编程语言的原生客户端和 SDK。有关当前 SDK 的完整列表，请参阅 http://api.openstack.org。


    ## OpenStack – 一个开源软件项目


    OpenStack 是一个开源软件项目，拥有来自各种组织的海量贡献者。OpenStack 最初由 NASA 和 Rackspace 创建。Rackspace
    仍然是 OpenStack 的重要贡献者，但如今对该项目的贡献来自各种各样的公司，包括传统的开源贡献者（Red Hat、IBM 和 HP）以及完全致力于 OpenStack
    的公司（Mirantis 和 CloudBase）。贡献的形式包括特定基础设施组件的驱动程序（即 Cinder 块存储驱动程序或 Neutron SDN 驱动程序）、错误修复或核心项目中的新功能。


    OpenStack 由一个基金会管理。加入基金会的会员资格是免费的，任何希望加入的人都可以加入。目前基金会有数千名成员。技术问题的领导由十三名技术委员会成员提供，通常由个人成员选举产生。战略和财务问题由董事会决定，董事会包括由企业赞助商任命的成员和由个人成员选举产生的成员。


    有关加入或为 OpenStack 基金会做出贡献的更多信息，请参阅 http://www.openstack.org/foundation。


    OpenStack 用 Python 编程语言编写，通常部署在 Linux 操作系统上。源代码可随时在互联网上获取，社区的提交都是受欢迎的。在代码提交到项目之前，它必须通过一系列门控，包括单元测试和代码审查。


    有关向 OpenStack 提交代码的更多信息，请参阅 https://wiki.openstack.org/wiki/How_To_Contribute。


    ## OpenStack – 一个私有云平台


    最后，OpenStack 提供了构建自动化私有云平台所需的软件模块。虽然 OpenStack 传统上专注于提供类似于 Amazon Web Services
    的基础设施即服务功能，但最近引入了一些新项目，开始提供可能更与平台即服务相关联的功能。本书将重点介绍以下所述的核心 OpenStack 组件集的实现。


    OpenStack 作为私有云平台使用的最重要方面是租户模型。提供此模型的身份验证和授权服务在身份服务 Keystone 中实现。OpenStack 系统管理的每个虚拟或物理对象都存在于称为租户或项目的私有空间中。Keystone
    API 的最新版本已进一步区分，包含称为域的更高级别结构。无论术语如何，安全隔离计算、网络和存储资源的能力是该平台最基本的功能。这使其有别于传统的数据中心虚拟化，使其成为私有云平台。


    使用术语实例的第二个原因是 OpenStack 中的虚拟机通常不具有与传统虚拟化相同的生命周期。虽然我们可能期望虚拟机像物理机一样具有数年的生命周期，但我们期望实例的生命周期以天或周为单位。虚拟机会被备份和恢复，而实例会被救援或疏散。对虚拟机的调整操作可能无需停机即可完成，而对实例的调整操作则是新的部署和迁移。这是由
    OpenStack 与传统虚拟机及其 hypervisor 之间的架构差异造成的。传统虚拟化平台假设就地调整和修改行为，而 OpenStack 等云平台则期望重新部署虚拟机或通过添加额外的实例来增加容量，而不是向现有虚拟机添加额外资源。甚至术语
    **迁移** 对于实例而言的含义也与我们对虚拟机的预期不同。


    我们发现使用术语实例有用的第三个原因是，计算服务多年来已发展到启动多种类型的计算。一些 OpenStack 部署可能仅启动物理机，而其他部署可能启动物理、虚拟和基于容器的实例组合。无论计算提供商如何，相同的结构都适用。


    随着更多企业功能被添加到 OpenStack 计算服务中，虚拟机和实例之间的界限变得越来越模糊。稍后，我们将讨论一些可以启动更像虚拟机的实例的方法，以用于更传统的计算工作负载。


    ## 对象存储


    计算实例的临时后端存储由 Nova 服务提供。这种存储被称为 **临时**，因为其生命周期与计算实例的生命周期同步。也就是说，当实例终止时，与该实例关联的临时存储会从其所在的计算主机中删除。OpenStack
    系统中提供的第一种持久存储是对象存储，基于 Amazon Web Service 环境中可用的 S3 服务。


    对象存储由 OpenStack 中的 Swift 服务提供。就像 Nova 提供 EC2 兼容的计算 API 一样，Swift 提供 S3 兼容的对象存储
    API。编写为在 Amazon EC2 服务上运行并将持久数据读写的应用程序读写入 S3 对象存储服务的应用程序无需重写即可在 OpenStack 系统上运行。


    '
