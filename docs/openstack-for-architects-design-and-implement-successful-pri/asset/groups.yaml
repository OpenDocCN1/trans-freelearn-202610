    - **管理区域**：这些是 OpenStack 服务所在并交互的区域。这些特定区域通常被隔离，仅用于 OpenStack 控制平面流量。由于这种内部通信的敏感性，必须采取措施强化该特定网络，并且只有运行
    OpenStack 控制平面的服务器才能访问该网络。一旦完成，该区域即被视为可信区域。如果该区域被路由或连接到可路由网络，实际上就相当于将其桥接到不可信区域，该网络会立即变成不可信网络，并且必须立即实施补偿性控制措施。

    - **数据区域**：这些安全区域主要包含与 OpenStack 内部存储服务相关的服务和网络流量。这些数据通常需要高安全性和高保密性。该网络区域的信任级别高度依赖于云中运行的工作负载以及所执行的部署类型。因此，该区域可以是可信的，也可以是不可信的；如果不了解部署类型的具体细节，我们无法指定默认信任级别。在考虑
    OpenStack 安全以及平台上运行的资源和服务时，理解这些区域非常重要。开发者有意将平台不同部分的访问权限分开，以区分特权区域和非特权区域，并减少跨区域攻击。


    ## 软件漏洞


    OpenStack 是一个主要用 Python 编写的编排平台，运行在基于 Linux 的操作系统之上。该编排平台负责为租户配置实例或提供基础设施即服务（IaaS），以支持需要在云环境中运行的工作负载。因此，OpenStack
    软件漏洞可分为两大类：第一类包括 OpenStack 配置和编排的实例或裸金属服务器；第二类包括 OpenStack 基础设施环境及其主机。


    ### 实例软件安全与补丁


    在 OpenStack 中，虚拟机监视器（hypervisor）创建并运行独立的虚拟机或实例。这些实例需要与其所在的底层 OpenStack 基础设施分开进行软件更新和打补丁。对虚拟机监视器和底层服务器操作系统的更新不会传播到活动工作负载和实例；因此，必须存在两种策略——一种用于云上运行的实例，另一种用于云基础设施。


    实例策略应与当前生效的、用于控制现有遗留系统补丁管理的组织和治理策略保持一致。由于 OpenStack 基于镜像和规格（flavor）启动实例，这些镜像和规格可能在实例启动时将可执行元数据注入实例，因此根据工作负载类型，有多种方法可以确保在启动实例之前使用最新加固镜像。


    对于 OpenStack 云中常见的传统临时工作负载，应根据组织策略定期更新 Glance 镜像，并由公司内的可信组织进行控制。这些更新应向操作系统添加补丁和安全修复，并作为现有镜像导入
    Glance 镜像仓库。在部署到生产环境之前，这些更新后的镜像应在较低级别的开发环境或沙盒环境中进行测试。然后，这些更新后的镜像将作为任何使用该镜像的新实例以及一直在使用该镜像的临时工作负载的基础操作系统。但是，正在运行的镜像不会改变。安全补丁只有在实例重新启动后才会生效。通常，临时工作负载往往能够在影响应用程序可用性的情况下重新启动，但云上运行的持久工作负载则需要制定基于应用程序的策略，以便在打补丁的同时保持应用程序的正常运行时间。一些组织对运行旧镜像版本的实例重启有严格规定，具体取决于应用于镜像的补丁是用于安全修复还是仅仅是一次更新。


    应创建默认的 OpenStack 安全策略，以允许传统软件合规性工具扫描主机的软件更新合规性。对于持久工作负载以及不会频繁重启或需要保持一定可用性水平的实例，可以创建安全策略，允许这些实例使用基于传统软件仓库的补丁解决方案，并通过对正在运行的实例打补丁的传统方式实施补丁。然而，根据组织的
    OpenStack 网络部署情况，可能需要进行额外的网络配置，才能使软件仓库在租户网络内可用。对于临时和持久工作负载，都可以使用 cloud-init 和
    cloudbase-init，在启动时利用原生软件管理工具和本地软件仓库对镜像执行更新。但是，根据对镜像执行更新的数量，这些在启动时发生的更新可能会延迟实例配置。这就是为什么更新基础
    Glance 镜像是确保实例安全和软件更新合规性的最佳实践。


    ### 基础设施主机安全与补丁


    安全是 OpenStack 架构的基本组成部分，需要持续维护，以保护该技术栈中的各个安全区域。OpenStack 是一个由许多不同部分组成的复杂平台，多个不同的开发方正在积极持续地开发它。表面上，这似乎从根本上缺乏安全性，但实际上，OpenStack
    不仅由成千上万的个人开发，还受到成千上万的用户和开发者的测试和审查。这些用户和开发者向其他开发者和测试者形成了一个有用的反馈循环。这几乎提供了对草率和不安代码的持续警惕。然而，与商业软件一样，安全问题仍时有发现。这就是为什么
    OpenStack 基金会成立了 OpenStack 安全团队，发布有关已识别安全问题的公告、描述和补丁链接。


    #### 为 OpenStack 代码打补丁


    这些补丁针对 OpenStack 代码中的漏洞。当前的安全公告列表维护在 https://security.openstack.org/ossalist.html，其中也提供了补丁。这些补丁大多是升级后的
    Python 文件，可以直接替换 OpenStack 控制节点或计算节点上的现有文件。一个针对在 Neutron 中发现的 bug、包含替换文件的补丁示例可在
    https://review.openstack.org/#/c/299025/ 查看。OpenStack 漏洞管理团队负责安全和 OpenStack 的
    bug 及修复流程，相关信息参见 https://wiki.openstack.org/wiki/Vulnerability_Management。


    #### Red Hat Enterprise Linux 和 CentOS


    使用任何 Linux 发行版时，及时更新所有受影响的软件以限制安全风险至关重要。如果该软件是 Red Hat 内某个包的一部分，则应在 Red Hat 发布修复后尽快修补该漏洞。Red
    Hat 通常会随其安全公告附带补丁，然后以安全勘误更新（security erratum update）的形式发布。同样，必须在补丁和更新发布后立即应用，以帮助消除攻击者利用该
    bug 攻击您的 OpenStack 基础设施的风险。这可以通过 Yum 包管理器实现，并且仅从可信来源下载。这些可信来源可以是 Red Hat 网络（RHN）或由您的组织控制的本地仓库。从组织外部下载的所有包都应使用
    GNU Privacy Guard 或 GNUPG（一种用于确保包文件真实性的免费软件）进行真实性验证。如果验证失败，则说明包已损坏或被篡改。


    #### Canonical 基于 Ubuntu 的操作系统


    Ubuntu 的安全和补丁生态系统与 Red Hat 非常相似。当 Canonical 的 Ubuntu 开发者发现并修补漏洞时，他们就会发布安全更新。安全通知可以通过电子邮件或
    RSS 订阅获取。Ubuntu 允许自动安装安全更新——一旦配置完成，您无需再手动运行安全更新。Ubuntu 允许用户通过 `cron-apt` 使用 `unattended-upgrades`
    配置自动安全更新。类似的行为也可应用于 Red Hat 主机，方法是使用 `yum-cron` 并设置 `update_cmd = minimal-security-severity:Important`。


    #### 软件仓库管理


    软件仓库管理对于为 OpenStack 基础设施提供安全更新至关重要。Red Hat 开发了一个名为 **Satellite** 的管理应用程序，Ubuntu
    则有 **Landscape**。这两者都是系统管理应用程序，允许管理员部署、修补、管理和监控各自的系统。这些应用程序是一种本地部署（on-premise）方式，用于从远程分配门户下载和管理内容。它们减少了系统更新期间公司广域网（WAN）上的流量，因为所有包只需传输到本地仓库一次。这些应用程序还可在本地管理更新文件，以限制外部恶意内容带来的安全风险。


    '
