    \ jenkins\n```\n\n- 3. To start the jenkins server, use the following command:\n\
    \n```\n# systemctl start jenkins\n```\n\n- 4. Verify that Jenkins started correctly\
    \ using the following command:\n\n```\n# systemctl status jenkins -l\n```\n\n\
    You should see that the service is running and that there are no errors in the\
    \ log output.\n\n5. You can now log in to the Jenkins web UI by visiting your\
    \ host on port 8080 in your web browser; that is, if your CI server's hostname\
    \ is `jenkins.example.com`, Jenkins should be available at `http://jenkins.example.com:8080/`.\
    \ You should see the following page upon login:\n\n![](img/2f752555f69992669defa8b25e6dcee9_93_0.png)\n\
    \n6. The last thing we'll need to do is install the Git SCM plugin. Click on the\
    \ Manage Jenkins link in the left-hand navigation. Select Manage Plugins from\
    \ the next page. On the Plugins page, select the Available tab and search for\
    \ git plugin in the Filter bar. Select the Git plugin and click on Install without\
    \ restart:\n\n![](img/2f752555f69992669defa8b25e6dcee9_94_0.png)\n\nYou'll see\
    \ the status of the installation as it progresses. When it completes successfully,\
    \ you'll see a page similar to this:\n\n![](img/2f752555f69992669defa8b25e6dcee9_95_0.png)\n\
    \nJenkins is now installed and configured with the Git Plugin.\n\n## Creating\
    \ the composition layer\n\nNow that our infrastructure software is in place, we'll\
    \ begin creating our composition layer. As we mentioned earlier, we'll be starting\
    \ with the “known good” configuration we got from running the `packstack` command\
    \ in Chapter 2, *Architecting the Cloud.*\n\n## Starting our Puppet modules\n\n\
    Our composition layer will be stored in two Puppet modules, using the **profiles\
    \ and roles** pattern developed by Craig Dunn (http://www.craigdunn.org/2012/05/239/).\
    \ We'll store the modules in a directory called `puppet/modules` in our new Git\
    \ repository. The following steps will create the new modules within our repository:\n\
    \n- 1. Clone the repository. It is recommended to use an unprivileged user account\
    \ for this section:\n```\n$ git clone http://git@localhost/git/openstack/\n```\n\
    - 2. Next, create the directory for the modules:\n```\n$ mkdir -p openstack/puppet/modules\n\
    ```\n- 3. Use the `puppet module` command to create the new modules in the directory:\n\
    ```\n$ cd openstack/puppet/modules\n$ puppet module generate openstack-profile\n\
    $ puppet module generate openstack-role\n```\nFor each of these commands, you\
    \ will be prompted for a set of metadata about the module. Enter as much information\
    \ as you'd like or take the defaults.\n- 4. Once you've set up the modules as\
    \ you like, go back to the top level of the code repository and check them into\
    \ revision control with the following commands:\n```\n$ cd ~/openstack\n$ git\
    \ add puppet\n$ git commit -m 'Initial check-in of the profile and role modules'\n\
    $ git push origin master\n```\nYou should see that the modules have been committed\
    \ and pushed into a new master branch on the repository.\n- 5. Now let's add these\
    \ modules to our Puppet master. To do this, clone a clean copy of the repository\
    \ onto a location on the server as the root user:\n```\n# cd /srv\n# git clone\
    \ http://localhost/git/openstack\n```\n\nYou should receive a message such as\
    \ `Cloning into 'openstack'...`, which will indicate the success of the command.\n\
    \n- 6. We'll be updating this repository with a Jenkins job, so change the ownership\
    \ of the directory to the Jenkins user:\n\n```\n# chown -R jenkins:jenkins /srv/openstack\n\
    ```\n\nIf you're using a remote Jenkins server, you'll need to set permissions\
    \ so that you can log into this machine remotely and run a `git pull` command\
    \ in that directory.\n\n- 7. Next, symlink the two new puppet modules into `/etc/puppet/modules`\
    \ on the master:\n\n```\n# cd /etc/puppet/modules\n# ln -s /srv/openstack/puppet/modules/openstack-profile\
    \ profile\n# ln -s /srv/openstack/puppet/modules/openstack-role role\n```\n\n\
    You should now see the two modules in the output of `puppet module list` on the\
    \ master:\n\n```\n/etc/puppet/modules\n├── openstack-profile (v0.1.0)\n└── openstack-role\
    \ (v0.1.0)\n```\n\n## Defining the first role and profile\n\nWe already have a\
    \ set of host groups defined in our design document. We'll map these directly\
    \ to roles in our Puppet composition layer. Each role will get it's own class\
    \ and file in the role Puppet module. A role comprises of profiles, each of which\
    \ represents a piece of OpenStack functionality. For example, the `mariadb` profile\
    \ will install and configure the MySQL database server for our deployment, the\
    \ `amqp` profile will install and configure the RabbitMQ message server, and so\
    \ on. Let's start by creating a Database Node role and associated profile.\n\n\
    ## Building the Deployment Pipeline\n\nAs we mentioned earlier, we'll use the\
    \ Packstack configuration that we created in *Chapter 2, Architecting the Cloud*,\
    \ as a starting point for our composition layer. Normally, when Packstack runs,\
    \ it deletes the Puppet manifests that it uses to install the OpenStack software\
    \ on the hosts. If you specify the `-y` option, however, it will exit without\
    \ doing anything and leave the Puppet manifests in place. On the original host\
    \ that you ran Packstack in *Chapter 2, Architecting the Cloud*, rerun Packstack\
    \ with the same answer file and the `-y` option:\n\n```bash\n# packstack --answer-file=packstack.answers\
    \ -y\n```\n\nAfter the command has completed execution, it will print the name\
    \ of the directory where it wrote the Puppet manifests. It should be something\
    \ like `/var/tmp/packstack/20151123-214424-gJbmJA`. Descend into that directory\
    \ and copy the Hiera data and manifests to your CI server.\n\nPackstack's Puppet\
    \ manifests use Hiera, Puppet's **key/value lookup tool**, to make it easy to\
    \ store configuration information such as passwords and IP addresses so that they\
    \ don't need to be stored in the manifests themselves. We'll stay with this practice.\
    \ Copy the `hieradata` directory to `/etc/puppet/hieradata` on the CI server.\
    \ To tell Puppet to reference this data, create a file called `/etc/puppet/hiera.yaml`\
    \ with the following contents:\n\n```yaml\n---\n:backends:\n  - yaml\n:hierarchy:\n\
    \  - defaults\n  - \"%{clientcert}\"\n  - \"%{environment}\"\n  - global\n\n:yaml:\n\
    \  :datadir: /etc/puppet/hieradata\n```\n\nNow, let's create the first profile.\
    \ Create a new file named `puppet/modules/openstack-profile/manifests/mariadb.pp`\
    \ in our checked-out copy of the openstack repository. Once again, use an unprivileged\
    \ account.\n\nStarting with the Newton release of RDO, the manifests created by\
    \ the Packstack tool have adopted the roles and profiles model that we're implementing\
    \ in this chapter. Two roles exist in Packstack – one for controllers and one\
    \ for compute nodes. We'll be creating a new role by copying relevant profiles\
    \ from the controller manifest. In `mariadb.pp`, create a class definition like\
    \ the following:\n\n```\nclass profile::mariadb {\n  include '::packstack::mariadb'\n\
    \  include '::packstack::mariadb::services'\n}\n```\n\nThis defines the `mariadb`\
    \ profile with the same Puppet code that we used to install the database in our\
    \ Packstack installation. Now create a file named `puppet/modules/openstack-role/manifests/database.pp`.\
    \ Create a class named `role::database` in that file, which references the profile\
    \ we created earlier:\n\n```\nclass role::database {\n  include profile::mariadb\n\
    }\n```\n\nAdd the two files to a commit and then commit and push them to the Git\
    \ server.\n\n## Running the first build\n\nVisit Jenkins at http://jenkins:8080/,\
    \ replacing `jenkins` with the hostname of your CI server. The Jenkins UI should\
    \ come up, prompting you to create a new job.\n"
  mdcn: "\n\n7. 使用以下命令启动 puppet master 服务：\n\n```\n# systemctl start puppetmaster.service\n\
    # systemctl enable puppetmaster.service\n```\n\n8. 验证服务是否正确启动：\n\n```\n# systemctl\
    \ status puppetmaster.service -l\n```\n\n你应该会看到服务已创建证书颁发机构。环境中的客户端访问 Puppet master\
    \ 时必须使用与证书颁发机构相同的 hostname。如果客户端将通过除 hostname 之外的其他方式访问 Puppet master，请查阅 puppet.conf\
    \ 中的 dns_alt_names 设置。\n\n## 安装 Jenkins\n\n以下说明将在 CI 服务器上设置 Jenkins 服务器。如果你已有可在实验室中使用的\
    \ Jenkins 服务器，可以跳过本节。有关设置 Jenkins 的更多信息，请参阅 Jenkins 网站 (https://wiki.jenkins-ci.org/display/JENKINS/Use+Jenkins)。\n\
    \n- 1. 以 root 用户身份在 CI 服务器上执行以下命令以安装 Jenkins 仓库，该仓库提供对 Jenkins 的访问权限：\n\n```\n\
    # curl http://pkg.jenkins-ci.org/redhat/jenkins.repo > /etc/yum.repos.d/jenkins.repo\n\
    # rpm --import https://jenkins-ci.org/redhat/jenkins-ci.org.key\n# yum install\
    \ -y java-1.7.0-openjdk jenkins\n```\n\n- 2. 要验证软件是否正确安装，运行以下命令：\n\n```\n# rpm\
    \ -q java-1.7.0-openjdk jenkins\n```\n\n- 3. 要启动 jenkins 服务器，使用以下命令：\n\n```\n\
    # systemctl start jenkins\n```\n\n- 4. 使用以下命令验证 Jenkins 是否正确启动：\n\n```\n# systemctl\
    \ status jenkins -l\n```\n\n你应该会看到服务正在运行，并且日志输出中没有错误。\n\n5. 现在你可以通过在 Web 浏览器中访问主机\
    \ 8080 端口来登录 Jenkins Web UI；也就是说，如果你的 CI 服务器的 hostname 为 `jenkins.example.com`，Jenkins\
    \ 应可在 `http://jenkins.example.com:8080/` 上访问。登录后你应会看到以下页面：\n\n![](img/2f752555f69992669defa8b25e6dcee9_93_0.png)\n\
    \n6. 我们需要做的最后一件事是安装 Git SCM 插件。点击左侧导航中的 Manage Jenkins 链接。从下一页选择 Manage Plugins。在\
    \ Plugins 页面，选择 Available 选项卡，并在 Filter 栏中搜索 git plugin。选择 Git 插件并点击 Install without\
    \ restart：\n\n![](img/2f752555f69992669defa8b25e6dcee9_94_0.png)\n\n你将看到安装进度状态。完成后，你会看到类似以下页面：\n\
    \n![](img/2f752555f69992669defa8b25e6dcee9_95_0.png)\n\nJenkins 现已安装并配置了 Git 插件。\n\
    \n## 创建组合层\n\n现在我们的基础架构软件已就位，我们将开始创建我们的组合层。如前所述，我们将从在第 2 章 *Architecting the Cloud*\
    \ 中运行 `packstack` 命令时获得的“已知良好”配置开始。\n\n## 启动我们的 Puppet 模块\n\n我们的组合层将存储在两个 Puppet\
    \ 模块中，使用 Craig Dunn 开发的 **profiles and roles** 模式 (http://www.craigdunn.org/2012/05/239/)。我们将模块存储在新\
    \ Git 仓库中名为 `puppet/modules` 的目录中。以下步骤将在我们的仓库中创建新模块：\n\n- 1. 克隆仓库。建议对此部分使用非特权用户帐户：\n\
    ```\n$ git clone http://git@localhost/git/openstack/\n```\n- 2. 接下来，创建模块的目录：\n\
    ```\n$ mkdir -p openstack/puppet/modules\n```\n- 3. 使用 `puppet module` 命令在目录中创建新模块：\n\
    ```\n$ cd openstack/puppet/modules\n$ puppet module generate openstack-profile\n\
    $ puppet module generate openstack-role\n```\n对于每个命令，你将被提示输入有关模块的一组元数据。输入你想要的尽可能多的信息或采用默认值。\n\
    - 4. 设置好模块后，返回到代码仓库的顶层，并使用以下命令将其检入版本控制：\n```\n$ cd ~/openstack\n$ git add puppet\n\
    $ git commit -m 'Initial check-in of the profile and role modules'\n$ git push\
    \ origin master\n```\n你应该会看到模块已提交并推送到仓库上的新 master 分支。\n- 5. 现在让我们将这些模块添加到我们的 Puppet\
    \ master。为此，以 root 用户身份在服务器上的位置克隆仓库的干净副本：\n```\n# cd /srv\n# git clone http://localhost/git/openstack\n\
    ```\n\n你应该会收到类似 `Cloning into 'openstack'...` 的消息，这将表明命令成功。\n\n- 6. 我们将使用 Jenkins\
    \ 作业更新此仓库，因此将目录的所有权更改为 Jenkins 用户：\n\n```\n# chown -R jenkins:jenkins /srv/openstack\n\
    ```\n\n如果使用远程 Jenkins 服务器，你需要设置权限，以便可以远程登录此机器并在该目录中运行 `git pull` 命令。\n\n- 7. 接下来，将两个新的\
    \ puppet 模块符号链接到 master 上的 `/etc/puppet/modules`：\n\n```\n# cd /etc/puppet/modules\n\
    # ln -s /srv/openstack/puppet/modules/openstack-profile profile\n# ln -s /srv/openstack/puppet/modules/openstack-role\
    \ role\n```\n\n现在你应该在 master 上 `puppet module list` 的输出中看到这两个模块：\n\n```\n/etc/puppet/modules\n\
    ├── openstack-profile (v0.1.0)\n└── openstack-role (v0.1.0)\n```\n\n## 定义第一个角色和配置文件\n\
    \n我们已在设计文档中定义了一组主机组。我们将直接将它们映射到我们 Puppet 组合层中的角色。每个角色将在 role Puppet 模块中拥有自己的类和文件。角色由配置文件组成，每个配置文件代表\
    \ OpenStack 功能的一部分。例如，`mariadb` 配置文件将安装并配置我们部署的 MySQL 数据库服务器，`amqp` 配置文件将安装并配置\
    \ RabbitMQ 消息服务器，等等。让我们从创建 Database Node 角色和相关配置文件开始。\n\n## 构建部署管道\n\n如前所述，我们将使用在\
    \ *第 2 章，Architecting the Cloud* 中创建的 Packstack 配置作为我们组合层的起点。通常，当 Packstack 运行\
    \ 时，它会删除用于在主机上安装 OpenStack 软件的 Puppet 清单。但是，如果你指定 `-y` 选项，它将退出而不执行任何操作并保留 Puppet\
    \ 清单。在 *第 2 章，Architecting the Cloud* 中运行 Packstack 的原始主机上，使用相同的 answer 文件和 `-y`\
    \ 选项重新运行 Packstack：\n\n```bash\n# packstack --answer-file=packstack.answers -y\n\
    ```\n\n命令执行完成后，它将打印写入 Puppet 清单的目录名称。它应类似于 `/var/tmp/packstack/20151123-214424-gJbmJA`。进入该目录并将\
    \ Hiera 数据和清单复制到你的 CI 服务器。\n\nPackstack 的 Puppet 清单使用 Hiera，Puppet 的 **key/value\
    \ lookup tool**，使存储配置信息（如密码和 IP 地址）变得容易，以便它们不必存储在清单本身中。我们将继续采用这种做法。将 `hieradata`\
    \ 目录复制到 CI 服务器上的 `/etc/puppet/hieradata`。要告诉 Puppet 引用此数据，创建一个名为 `/etc/puppet/hiera.yaml`\
    \ 的文件，内容如下：\n\n```yaml\n---\n:backends:\n  - yaml\n:hierarchy:\n  - defaults\n\
    \  - \"%{clientcert}\"\n  - \"%{environment}\"\n  - global\n\n:yaml:\n  :datadir:\
    \ /etc/puppet/hieradata\n```\n\n现在，让我们创建第一个配置文件。在我们检出的 openstack 仓库副本中创建名为 `puppet/modules/openstack-profile/manifests/mariadb.pp`\
    \ 的新文件。再次使用非特权帐户。\n\n从 RDO 的 Newton 版本开始，Packstack 工具创建的清单已采用我们在本章中实现的 roles and\
    \ profiles 模型。Packstack 中存在两个角色——一个用于控制器，一个用于计算节点。我们将通过从控制器清单中复制相关配置文件来创建新角色。在\
    \ `mariadb.pp` 中，创建如下的类定义：\n\n```\nclass profile::mariadb {\n  include '::packstack::mariadb'\n\
    \  include '::packstack::mariadb::services'\n}\n```\n\n这使用我们在 Packstack 安装中用于安装数据库的相同\
    \ Puppet 代码定义了 `mariadb` 配置文件。现在创建名为 `puppet/modules/openstack-role/manifests/database.pp`\
    \ 的文件。在该文件中创建名为 `role::database` 的类，该类引用我们之前创建的配置文件：\n\n```\nclass role::database\
    \ {\n  include profile::mariadb\n}\n```\n\n将两个文件添加到提交，然后提交并推送到 Git 服务器。\n\n##\
    \ 运行第一次构建\n\n访问 Jenkins http://jenkins:8080/，将 `jenkins` 替换为你的 CI 服务器的 hostname。Jenkins\
    \ UI 应出现，提示你创建新作业。\n\n"
