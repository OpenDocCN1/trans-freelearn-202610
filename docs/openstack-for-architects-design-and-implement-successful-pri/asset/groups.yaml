    ```


    此命令将输出所有正在运行的网络服务的类似表格。输出应显示 Metadata、L3 和 DHCP 代理在 `controller1` 上运行，以及 Open
    vSwitch 代理在 `controller1`、`compute1` 和 `compute2` 上运行。


    ## Summary


    OpenStack 部署经常被比作雪花。有如此多不同的方式来组合各种受支持的计算、存储和网络配置，以至于没有任何一个部署与另一个部署相似。这一类比经常在为
    OpenStack 提供商业支持的公司中因挫败感而被使用——部署的多样性使得支持客户变得极其困难。我们合作的许多客户也表达了对众多选项的沮丧感。另一方面，大多数运行
    OpenStack 一段时间的人都认识到拥有如此多选项的价值。它允许他们在统一的接口下不断为客户提供新的服务和功能。


    在本章中，我们逐步介绍了 OpenStack 中的三大技术领域——计算、网络和存储。在每个领域，我们广泛描述了可用的选择，并提供了一些关于如何进行决策过程的指导。我们还扩展了部署文档和部署本身，以纳入本章涵盖的一些信息。此基本部署可以扩展，并且应提供足够的差异性，以便在做出购买决定之前在实验室中测试不同的计算、网络和存储技术。


    在下一章中，你将了解如何通过添加高可用性软件使此简单部署更加健壮。


