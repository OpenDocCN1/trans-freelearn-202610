    \ 192.168.0.10:5000 check inter 1s\n    server controller2 192.168.0.11:5000 check\
    \ inter 1s\n```\n\n确保在两个控制器上更新配置。在活动节点上重启 haproxy 服务：\n\n```\n# systemctl restart\
    \ haproxy.service\n```\n\n您可以使用 pcs status 的输出确定活动节点。使用以下命令检查 HAProxy 是否已在 5000\
    \ 和 35357 端口上监听：\n\n```\n# curl http://192.168.0.30:5000\n# curl http://192.168.0.30:35357\n\
    ```\n\n两者都应输出一些描述 Keystone 服务状态的 JSON。\n\n## 4\n\n## Building the Deployment Pipeline\n\
    \n我们经常告诉我们合作的客户，OpenStack 不是被 **installed**，而是被 **deployed**。虽然词语上的差异可能看起来很细微，但它可能在组织内部带来革命性的变化。大多数企业基础设施团队习惯于在部署新基础设施平台时采用以下流程：\n\
    \n- 1. 安装平台。\n- 2. 配置并集成平台。\n- 3. 运行平台。\n- 4. 升级平台。\n\n安装和配置平台可能需要数月或数年时间，一旦安装完成，平台预计将运行数年。对平台的升级每\
    \ 3 到 5 年发生一次，是为期 6-12 个月的大型项目。Red Hat 已围绕这些周期构建了企业 Linux 操作系统的发布结构——RHEL 5 和\
    \ RHEL 6 之间相隔 3 年，RHEL 6 和 RHEL 7 之间相隔近 4 年。每个版本都支持 10 年，保守的基础设施团队在新版本发布后至少等待一年才会开始为期\
    \ 6-12 个月的升级项目。\n\n这种对平台部署的保守方法在操作系统、虚拟化平台和应用平台领域工作得非常好。然而，如果您私有云项目的最重要业务驱动因素是提高敏捷性，那么以\
    \ 12 个月的推出周期和 5 年的生命周期是不太可能实现目标的。\n\n在本章中，我们将研究 OpenStack 通常作为应用软件而非基础设施软件的部署方式。我们将构建一个简单的部署流水线，该流水线使用\
