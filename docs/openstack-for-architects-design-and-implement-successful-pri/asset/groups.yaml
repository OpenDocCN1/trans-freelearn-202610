    如你所见，第一行给出了 qemu-kvm（实例进程）的上下文。`instance-00000001` 实例的 MCS 上下文为 `system_u:system_r:svirt_tcg_t:s0:c55,c122`。


    - 5. 现在，查看 `/var/lib/nova/instances/b803b3ce-1570-4092-8765-4a9f76793842/` 中与该实例关联的文件，可以确认
