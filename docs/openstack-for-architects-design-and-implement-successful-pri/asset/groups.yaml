    ## 云架构设计


    目前，可用于构建 OpenStack 云的硬件和软件组合相当令人惊叹。我们最近经常听到的一种说法是，对 OpenStack 的集成支持已成为硬件或软件产品进入市场的“入场券”。截至
    OpenStack Liberty 版本（2015 年 11 月），已有超过 50 个 Cinder 存储驱动和 20 个 Neutron 网络驱动。它们覆盖了从传统
    EMC 存储阵列、Cisco 交换机到各种软件定义存储和网络产品的广泛产品线。OpenStack 还支持众多 hypervisor 和计算平台，从普通 x86
    硬件到 IBM Z 系列大型机不一而足。


    作为架构师，我们所作的决策中，很少有像硬件和软件选型那样能对最终效益产生如此大的影响。虽然我们以迭代方式部署云或开发软件，以降低出错风险，但硬件采购通常很难迭代进行。


    幸运的是，OpenStack 为每个子系统都附带了一组参考插件，我们可以在购买实际硬件之前用它们来模拟出整个云环境。就 Cinder 而言，其参考实现是在
    Linux 系统上使用 LVM 和 iSCSI；就 Neutron 而言，参考实现使用 Linux 系统上的 Open vSwitch 和 iptables。甚至
    Compute 也可以用 KVM 的嵌套虚拟化来进行模拟。我们推荐的方法是，在开始 OpenStack 项目时先使用参考插件，待你了解了软硬件将如何协同工作后，再进行大规模硬件或软件采购。


    ## 选择 OpenStack 发行版


    OpenStack 与大多数开源软件项目一样进行开发。代码可以从 `http://openstack.org` 获取，也可以从 `http://tarballs.openstack.org`
    下载软件包格式的版本。截至 OpenStack Liberty 版本，已有超过 350 个独立项目可供下载。对于工程团队来说，要梳理和管理如此多的源代码仓库是相当庞大的工作量。于是，OpenStack
    发行版便应运而生。大多数 OpenStack 发行版由构建 Linux 发行版的同一批团队组装而成。例如，目前可用的三个主要发行版分别是 Ubuntu、openSUSE
    和 CentOS Linux 发行版的组成部分。这些发行版各自维护着安装指南，可在 `http://docs.openstack.org` 获取。此外，还有来自
    HP、Mirantis 和 Red Hat 等公司的发行版，它们属于商业支持协议的一部分。除这些选择外，还有 Platform9 等公司提供托管式 OpenStack
    部署。


    ## 使用主干（trunk）


    如前所述，OpenStack 的稳定版本以六个月为周期发布。活跃开发发生在每个软件项目的主干中（即 OpenStack 位于 `http://git.openstack.org`
    的基于 Web 的仓库服务中的“master”分支）。这个 master 仓库控制着 OpenStack 项目的分布式版本控制，并辅助源代码管理。这与许多其他开源项目使用的著名
    GitHub 服务非常相似。除了 Git 仓库之外，还有一些稳定分支与六个月发布版本相对应。新功能在 master 分支中实现，而错误修复则不定期地从主干向后移植到这些分支。


    对大多数组织来说，获取某个稳定分支的打包版本并进行部署就已经足够了。不过，有几点原因可能让这种做法不那么有吸引力。其一，一些组织可能会发现，六个月发布之间积累的变更太多，而更频繁地从主干发布更小粒度的变更，风险反而更低。虽然这种思路对许多软件项目来说是有道理的，但
    OpenStack 是由多个协调松散的团队开发的，管理各项目开发流之间的依赖关系是一项复杂的任务。主干上的自动化测试试图确保 Nova 中的改动不会破坏 Neutron
    中的功能，但大部分手动集成测试都是针对协调一致的稳定版本进行的。


    虽然某个组织有可能希望在主干变更进入稳定分支之前就把所有改动都拿过来，但更常见的是，它们只对尚未进入稳定分支的一两个重要功能感兴趣。例如，我们合作过的许多团队，早在
    Neutron 实现外部 IPAM 系统功能（Liberty 版本）之前，就希望利用类似 Infoblox 提供的外部 IPAM 系统。我们还见过其他情况：某个组织希望在新
    SAN 设备的 Cinder 驱动被上游接受之前就将其引入。对于这些用例，更合理的做法是先使用某个稳定分支的打包发行版，然后只为需要从主干向后移植所需功能的组件创建定制软件包。


    ## 社区发行版


    每次 OpenStack 发布稳定版本后，来自三个主要社区 Linux 发行版的维护者都会将相应稳定分支中的软件打包成其发行版的原生格式。这些 OpenStack
    发行版允许这些发行版的用户使用该发行版惯用的机制安装软件（及其依赖项）。这些发行方还在 `http://openstack.org` 上提供了如何在其特定发行版上安装和配置该软件的文档。


    大多数组织会根据自己最熟悉的 Linux 发行版来选择社区发行版。例如，通常使用 Ubuntu Linux 发行版的组织也会使用 Ubuntu OpenStack
    发行版。值得一提的是，OpenStack 社区发行版可以与 openSUSE 和 CentOS 的商业支持变体配合使用；一个组织为 Red Hat Enterprise
    Linux 付费购买支持，却使用社区支持的 CentOS OpenStack 发行版（RDO），这种情况并不少见。


    社区发行版的选择也会影响安装机制的可用性。例如，我们在*第 1 章，OpenStack 入门*中使用的 Packstack 安装工具就是 CentOS 版
    OpenStack（RDO）所特有的。Ubuntu 和 openSUSE 发行版则提供了安装 OpenStack 软件的其他工具。不过，使用 Puppet、Chef
    和 Ansible 部署 OpenStack 的机制与发行版（以及操作系统）无关。例如，完全可以使用同一套 Puppet 模块在 Ubuntu 和 CentOS
    发行版上部署 OpenStack。


    ## 商业支持的发行版


    虽然目前只有三个主要的社区支持 OpenStack 发行版，但可用的商业支持发行版却数不胜数。这些发行版的列表及其认证状态可在 http://openstack.org
    上查看。通过了特定负载和基于性能的 Tempest 测试的发行版，会以与托管服务提供商相同的方式获得认证。商业支持的发行版通常基于社区支持的发行版。不过，组织选择它们而不是社区发行版，有几个原因。


    第一个主要驱动因素是支持。大多数提供 OpenStack 支持的公司都要求客户使用其商业支持的发行版，以便确保客户使用的是已经通过认证和测试流程的软件。例如，Red
    Hat 会从每个 RDO 版本中取出软件包，在将其作为 Red Hat Enterprise Linux OpenStack 平台发布之前，让它们通过详细的测试计划。当客户发现某个
    OpenStack 组件存在问题时，Red Hat 可以将该问题添加到测试计划中，以防止未来版本中出现回归。此外，客户可能会出于易用性、支持质量或发行版附带的任何额外软件而选择不同的商业发行版；例如，Hewlett
    Packard Enterprise 的 Helion OpenStack 捆绑了许多运维工具，可能会吸引一些客户。Mirantis OpenStack 虽然只是一个基础设施即服务（IaaS）平台，但其安装程序可能比其它发行版的安装程序更受一些客户青睐。


    组织也可能选择商业支持的发行版而非社区支持的发行版，因为前者提供了发行商尚未以开源形式发布的附加功能。例如，IBM 在其 IBM Cloud Manager
    产品中就提供了一个 OpenStack 发行版。这些增强功能往往旨在加速 OpenStack 云的部署，或通过额外的报告和仪表板来提高部署的可管理性。


