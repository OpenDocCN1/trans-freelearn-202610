    ## 使用新配置安装 OpenStack


    在第 1 章 Introducing OpenStack 中，我们使用 allinone 选项运行 packstack，采用默认设置进行测试安装。Packstack
    能够将默认选项保存到配置文件中，然后可以用文本编辑器编辑。我们将在本章中使用此功能来创建可重用的配置。此外，packstack 能够通过 SSH 将生成的
    puppet 清单应用到远程机器上。为此工作，你需要能够从控制器机器（我们将在此运行 packstack）通过 SSH 访问部署中的其他机器。在运行 packstack
    之前，先测试一下是个好主意。


    首先，开始在部署计划的硬件表中概述的四台服务器上安装全新的操作系统副本。每个系统在部署前都需要配置网络表中指定的网络接口，并且部署计划中指定的所有要求也需要满足（即
