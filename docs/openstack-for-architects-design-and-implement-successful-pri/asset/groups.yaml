    includes not only the applications running on top of OpenStack but the projects
    that make up the platform as well as the underlying operating environments. You
    learned that enterprise OpenStack security is not only encryption, logging, or
    patching but a much more enterprise-based approach in which all solutions must
    work in harmony with others. Sometimes this interoperability can be achieved with
    configurations, other times it calls for additional open source or commercial
    grade enterprise software depending on security requirements. However, a very
    important point is to realize that OpenStack is no more insecure than its competing
    platforms and that there are strategies and tools available to make OpenStack
    compliant with most enterprise security policies.


