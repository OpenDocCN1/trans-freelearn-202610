    |---|---|---:|---|---|---|---|

    | controller1 | DL380 | 16 | 256 GB | 500 GB | 2×10 GB | Cloud controller |

    | compute1 | DL380 | 32 | 512 GB | 2 TB | 2×10 GB | Compute node |

