    \ VIP 访问 Horizon。流量将从客户端流向 VIP 上的 HAProxy，再流向两个节点之一上的 Apache。\n\n## Additional\
    \ API service configuration\n\n现在我们已经拥有一个可工作的集群和 HAProxy 配置，最后的配置步骤是将每个 OpenStack\
