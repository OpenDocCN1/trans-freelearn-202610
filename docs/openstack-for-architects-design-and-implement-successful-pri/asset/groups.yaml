    \ directory to hold our repository:\n```\n# mkdir /var/www/html/git\n```\n- 4.\
    \ Create the Git repository in the directory with the following commands:\n```\n\
    # mkdir /var/www/html/git/openstack/\n# cd /var/www/html/git/openstack\n# git\
    \ --bare init\n# git update-server-info\n```\n- 5. You should see the following\
    \ response after the `git --bare init` command:\n```\nInitialized empty Git repository\
    \ in\n/var/www/git/openstack/\n```\n- 6. Reset permissions on the new Git repository\
    \ for Apache:\n```\n# chown -R apache:apache /var/www/html/git/\n```\n- 7. Finally,\
    \ create a configuration file which requires authentication for the Git repository.\
    \ The following example can be copied to /etc/httpd/conf.d/git.conf:\n```\n<Directory\
    \ /var/www/html/git/>\n    DAV on\n\n    AuthName \"Git login:\"\n    AuthType\
    \ Basic\n    AuthUserFile /var/www/htpasswd\n\n    # Allow anonymous clone, but\
    \ require auth for push.\n    <LimitExcept GET PROPFIND>\n        Require valid-user\n\
    \    </LimitExcept>\n</Directory>\n```\n- 8. Create a user account for us to use\
    \ for the repository:\n```\n# htpasswd -c /var/www/htpasswd git\n```\n- 9. Last,\
    \ restart the httpd server:\n```\n# systemctl restart httpd\n```\n- 10. You should\
    \ now be able to clone the Git repository using the following command:\n```\n\
    # git clone http://git@localhost/git/openstack\n```\n- 11. You may be prompted\
    \ for the password that you entered when creating the user account and you should\
    \ receive the following message:\n```\nwarning: You appear to have cloned an empty\
    \ repository.\n```\n\n### Installing a Puppet master\n\nThe following instructions\
    \ will set up a Puppet master on the CI server. If you already have a Puppet infrastructure\
    \ that you can use in your lab, you can skip this section. For more information\
    \ on setting up a Puppet master, refer to the Puppet Reference Manual (http://docs.puppetlabs.com/puppet/latest/reference/).\
    \ Install the RDO repository, which provides access to both the Puppet and the\
    \ OpenStack Puppet modules using the following steps:\n\n- 1. Execute the following\
    \ command as root on the CI server:\n```bash\n# yum install -y https://rdoproject.org/repos/rdo-release.rpm\n\
    ```\n- 2. Verify that the repository has been enabled by running the following\
    \ command:\n```bash\n# yum repolist\n```\n- 3. You should see the `openstack`\
    \ repository in the output. Run the following command to install Puppet and the\
    \ OpenStack Puppet modules:\n```bash\n# yum install -y puppet puppet-server openstack-puppet-modules\
    \ openstack-packstack\n```\n- 4. Verify their installation with the following\
    \ command:\n```bash\n# rpm -q puppet puppet-server openstack-puppet-modules openstack-packstack\n\
    ```\n- 5. Edit the puppet configuration to include the OpenStack Puppet modules:\n\
    ```bash\n# puppet config set basemodulepath \\\n'$confdir/modules:/usr/share/puppet/modules:/usr/share/openstack-puppet/modules'\
    \ --section main\n```\n- 6. Verify the configuration by listing the available\
    \ Puppet modules:\n```bash\n# puppet module list\n```\n\nYou should see around\
    \ 60 Puppet modules, depending on the version of OpenStack. Ignore any errors\
    \ about dependencies.\n"
  mdcn: "\n## 构建部署流水线\n\n下表列出了在流水线每个阶段测试的项目：\n\n| 阶段 | 测试重点 |\n|---|---|\n| 预提交 |\
    \ 在变更进入流水线之前，对其进行测试，以确保不存在语法错误或风格问题。 |\n| 部署测试 | 在此阶段，测试集群中的每个系统都尝试应用配置更新。是否成功取决于变更能否无错误地应用。部分部署会触发第二次应用以测试幂等性。\
    \ |\n| 集成测试 | 测试集群成功应用配置后，针对 OpenStack API 运行单元测试套件，验证配置的功能。 |\n| 性能测试 | 对测试集群运行一系列测试，以确保变更不会对性能产生不良影响。\
    \ |\n| 验收测试 | 在流水线的此阶段，执行任何手动测试。随后，变更被提升到下一个环境。 |\n| 金丝雀测试 | 生产环境的一个子集将应用变更，并重复自动化和验收测试，且使用生产数据库和\
    \ hypervisor。 |\n| 发布 | 整个生产环境将应用变更。 |\n\n许多组织希望在部署过程中加入代码审查。这通常在所有自动化测试完成后进行，以便审查人员可以获得测试结果。诸如\
    \ Gerrit (https://www.gerritcodereview.com/) 之类的工具可用于编排具有代码审查要求的构建流水线。许多组织更倾向于手动执行金丝雀测试和生产发布——这些仍应是由操作员决定启动（和回滚）的自动化流程。\n\
    \n## 编写测试\n\nOpenStack 完全由 REST API 驱动，因此可以使用任何带有 HTTP 客户端实现的语言为平台编写测试。http://developer.openstack.org\
    \ 上提供了大多数主流语言的软件开发工具包（SDK）。即便如此，大多数组织倾向于使用 Python（OpenStack 的编写语言）编写测试。对此有两种不同的观点。第一种观点认为，这样更容易吸引熟悉\
    \ Python 的 OpenStack 人才，而且相关技能可以在测试与开发之间相互转换。此外，上游还有一个名为 Tempest 的 Python 项目，许多组织将其用作运行自身测试的框架。第二种观点则认为，组织应该使用平台终端用户所使用的同一接口来测试平台。例如，如果你打算通过云管理平台或使用\
    \ Ruby Fog 库 (http://fog.io/) 的 PaaS 来配置基础设施，那么就应该使用 Fog 库编写测试。\n\n无论如何，Tempest\
    \ 几乎总是会在 OpenStack 部署测试过程中的某个环节被用到。至少，所有自称是 OpenStack 云的公共云都必须通过一组最低限度的 Tempest\
    \ 测试，才能获得基金会的认证。\n\n## 运行测试\n\n如前所述，测试基础设施应推动变更沿着流水线前进，捕获每次测试运行的结果，并在运行成功时提升变更。为此，可以使用软件开发中使用的众多\
    \ CI 工具中的任何一种。我们通常建议利用组织已经在使用的 CI 工具和软件仓库。如果你的组织在软件开发团队中没有进行 CI，我们之前见到成功使用的优秀选择包括\
    \ Jenkins (https://jenkins-ci.org/)、Atlassian 的 Bamboo (https://www.atlassian.com/software/bamboo/)\
    \ 或 Buildbot (http://buildbot.net/)。OpenStack 基金会的 CI 是基于 Jenkins 构建的，在本章中，我们将使用该工具来构建我们的流水线。\n\
    \n## 组装流水线\n\n现在我们已经介绍了部署流水线的各个组件，下面在我们的实验室环境中组装一个示例流水线。我们将从设置 CI 服务器开始，创建一个新的组合层，编写一个单元测试，然后部署\
    \ OpenStack 基础设施以通过测试。\n\n## 设置 CI 服务器\n\n在前面的章节中，我们通过从云控制器运行 `packstack` 工具来部署\
    \ OpenStack。在本节中，我们将设置一台专用机器来执行部署。对部署机器的要求并不苛刻——任何运行 CentOS 7 且内存为 2 GB 或以上的机器都应足够。唯一的网络要求是，该机器可以从内网和\
    \ OpenStack 集群本身访问。\n\n### 安装 Git\n\n以下说明将在 CI 服务器上设置一个 Git 版本控制服务器。如果你已经可以访问\
    \ Git 仓库，或者更倾向于使用 GitHub，则可以跳过本节。有关设置 Git 服务器的更多信息，请参阅 *Scott Chacon* 和 *Ben Straub*\
    \ 所著的 *Pro Git* 一书，该书可在 https://git-scm.com/book/en/v2/ 在线阅读。\n\n要安装 Apache HTTP\
    \ 服务器和 Git 版本控制软件，请执行以下步骤：\n\n- 1. 以 root 身份在 CI 服务器上执行以下命令：\n```\n# yum install\
    \ -y httpd git\n```\n- 2. 验证软件包是否已正确安装：\n```\n# rpm -q httpd git\n```\n- 3. 创建一个顶级目录来存放我们的仓库：\n\
    ```\n# mkdir /var/www/html/git\n```\n- 4. 使用以下命令在该目录中创建 Git 仓库：\n```\n# mkdir\
    \ /var/www/html/git/openstack/\n# cd /var/www/html/git/openstack\n# git --bare\
    \ init\n# git update-server-info\n```\n- 5. 在执行 `git --bare init` 命令后，你应该会看到以下响应：\n\
    ```\nInitialized empty Git repository in\n/var/www/git/openstack/\n```\n- 6. 重置新\
    \ Git 仓库对 Apache 的权限：\n```\n# chown -R apache:apache /var/www/html/git/\n```\n\
    - 7. 最后，创建一个需要身份认证才能访问 Git 仓库的配置文件。以下示例可以复制到 /etc/httpd/conf.d/git.conf：\n```\n\
    <Directory /var/www/html/git/>\n    DAV on\n\n    AuthName \"Git login:\"\n  \
    \  AuthType Basic\n    AuthUserFile /var/www/htpasswd\n\n    # Allow anonymous\
    \ clone, but require auth for push.\n    <LimitExcept GET PROPFIND>\n        Require\
    \ valid-user\n    </LimitExcept>\n</Directory>\n```\n- 8. 创建一个用于访问仓库的用户账户：\n```\n\
    # htpasswd -c /var/www/htpasswd git\n```\n- 9. 最后，重启 httpd 服务：\n```\n# systemctl\
    \ restart httpd\n```\n- 10. 现在，你应该可以使用以下命令克隆 Git 仓库：\n```\n# git clone http://git@localhost/git/openstack\n\
    ```\n- 11. 系统可能会提示你输入创建用户账户时设置的密码，然后你应该会收到以下消息：\n```\nwarning: You appear to have\
    \ cloned an empty repository.\n```\n\n### 安装 Puppet 主服务器\n\n以下说明将在 CI 服务器上设置一个\
    \ Puppet 主服务器。如果你已经有一个可以在实验室中使用的 Puppet 基础设施，可以跳过本节。有关设置 Puppet 主服务器的更多信息，请参阅\
    \ Puppet 参考手册 (http://docs.puppetlabs.com/puppet/latest/reference/)。安装 RDO 仓库，该仓库提供了对\
    \ Puppet 和 OpenStack Puppet 模块的访问，具体步骤如下：\n\n- 1. 以 root 身份在 CI 服务器上执行以下命令：\n\
    ```bash\n# yum install -y https://rdoproject.org/repos/rdo-release.rpm\n```\n\
    - 2. 运行以下命令，验证仓库已被启用：\n```bash\n# yum repolist\n```\n- 3. 你应该会在输出中看到 `openstack`\
    \ 仓库。运行以下命令来安装 Puppet 和 OpenStack Puppet 模块：\n```bash\n# yum install -y puppet\
    \ puppet-server openstack-puppet-modules openstack-packstack\n```\n- 4. 使用以下命令验证它们的安装：\n\
    ```bash\n# rpm -q puppet puppet-server openstack-puppet-modules openstack-packstack\n\
    ```\n- 5. 编辑 Puppet 配置，以包含 OpenStack Puppet 模块：\n```bash\n# puppet config set\
    \ basemodulepath \\\n'$confdir/modules:/usr/share/puppet/modules:/usr/share/openstack-puppet/modules'\
    \ --section main\n```\n- 6. 通过列出可用的 Puppet 模块来验证配置：\n```bash\n# puppet module\
    \ list\n```\n\n你应该会看到大约 60 个 Puppet 模块，具体数量取决于 OpenStack 的版本。忽略任何有关依赖关系的错误。\n"
