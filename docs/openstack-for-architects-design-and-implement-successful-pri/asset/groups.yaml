    When requesting the token from Keystone, the client sends along the requested
    scope of the token: the tenant, project, or domain. Assuming that the credentials
    authorize the client, the token that Keystone returns is specific to the scope
    requested. Once the client has obtained the token, each API request to the other
    OpenStack services contains the token in an HTTP header. The other services use
    that token to authorize the requests from the client.


    There are two versions of the Keystone API in wide use in OpenStack at present:
    versions 2 and 3. In version 2 of the API, users are authorized to specific projects
    or **tenants**. A user may have privileges in more than one tenant and the privileges
    may vary by tenant. For example, the user **msolberg** may have administrative
    privileges in the **msolberg** tenant, but only user privileges in the **architect**
    tenant. Version 3 of the API introduces the concept of authorization domains,
    which provide a hierarchy above basic tenancy. Version 3 of the Keystone API has
    been around for a few releases, but it has taken some time for each of the services
    to support the new authorization model. As such, most OpenStack deployments still
    use the Keystone v2 API.


    Keystone uses a combination of backend drivers when deciding whether or not to
    issue a token when presented with a set of credentials. The first backend driver
    is the identity driver. The identity driver can either be SQL (the reference implementation)
    or **Lightweight Directory Access Protocol (LDAP)**. If the driver is set to LDAP,
    an external directory service can be used to authenticate users. The second driver
    is the **assignment** driver. This driver allows users to authenticate using LDAP
    and assign roles using the SQL database. This configuration is the most commonly
    used integration pattern for Active Directory.


    ## Configuring Keystone with split assignment and identity


    Before configuring Keystone to use Active Directory (or other LDAP services) for
    authentication, a few changes will need to be made on the Active Directory side.
    First, decide on mapping objects in Active Directory to the accounts in OpenStack.
    For example, you may want any user who has an account in the directory to have
    access to a tenant in OpenStack, or you may want to restrict usage to a particular
    group of users. If you intend to restrict users, you will need to create a group
    or attribute to filter them. Second, a user who has the ability to do a lookup
    on other users needs to be created. Perform a test that validates that the user
    has the ability to read the appropriate subtree of account objects using a utility
    such as `ldapsearch`. For more information on the prerequisites for the Active
    Directory side, refer to `https://wiki.openstack.org/wiki/HowtoIntegrateKeystonewithAD`.


    Next, we will configure Keystone to use the LDAP identity backend and the SQL
    assignment backend. Packstack supports this configuration out-of-the-box, and
    we only need to update the Hiera data on our Puppet master for our installation
    to reflect the new settings. The following table represents the settings that
    will be required:


    | Hiera variable | keystone.conf setting | Description |

    |---|---|---|

    | CONFIG_KEYSTONE_IDENTITY_BACKEND | identity.driver | The backend to use (ldap)
    |

    | CONFIG_KEYSTONE_LDAP_URL | ldap.url | The URI for the AD LDAP service |

    | CONFIG_KEYSTONE_LDAP_USER_DN | ldap.user | The service user for looking up accounts
    |

    | CONFIG_KEYSTONE_LDAP_USER_PASSWORD | ldap.password | The password for the service
    user |

    | CONFIG_KEYSTONE_LDAP_SUFFIX | ldap.suffix | The suffix for the service account
    |

    | CONFIG_KEYSTONE_LDAP_USER_SUBTREE | ldap.user_tree_dn | The tree containing
    user accounts in AD |

    | CONFIG_KEYSTONE_LDAP_USER_OBJECTCLASS | ldap.user_objectclass | The object class
    for user accounts (person) |

    | CONFIG_KEYSTONE_LDAP_USER_FILTER | ldap.user_filter | An optional filter to
    use for selecting only certain users in the tree |

    | CONFIG_KEYSTONE_LDAP_USER_ID_ATTRIBUTE | ldap.user_id_attribute | The attribute
    to use as the Keystone user ID (cn) |

    | CONFIG_KEYSTONE_LDAP_USER_NAME_ATTRIBUTE | ldap.user_name_attribute | The attribute
    to use as the Keystone user name (cn) |

    | CONFIG_KEYSTONE_LDAP_USER_MAIL_ATTRIBUTE | ldap.user_mail_attribute | The attribute
    to use as the Keystone user e-mail (mail) |

    | CONFIG_KEYSTONE_LDAP_USER_ENABLED_ATTRIBUTE | ldap.user_enabled_attribute |
    The attribute that determines whether a user is enabled or not (userAccountControl)
    |

    | CONFIG_KEYSTONE_LDAP_USER_ENABLED_MASK | ldap.user_enabled_mask | The bitmask
    to use to determine whether the account is enabled (2) |

    | CONFIG_KEYSTONE_LDAP_USER_ENABLED_DEFAULT | ldap.user_enabled_default | The
    default value to use to determine whether the account is enabled (512) |

    | CONFIG_KEYSTONE_LDAP_USER_ATTRIBUTE_IGNORE | ldap.user_attribute_ignore | Attributes
    to ignore on the object (password, tenant_id, tenants) |

    | CONFIG_KEYSTONE_LDAP_USER_ALLOW_CREATE | ldap.user_allow_create | Whether or
    not we can create users (False) |

    | CONFIG_KEYSTONE_LDAP_USER_ALLOW_UPDATE | ldap.user_allow_update | Whether or
    not we can update users (False) |

    | CONFIG_KEYSTONE_LDAP_USER_ALLOW_DELETE | ldap.user_allow_delete | Whether or
    not we can delete users (False) |


    Once the appropriate settings have been determined for your environment, update
    `/etc/puppet/hieradata/defaults.yaml` with the appropriate settings. On the next
    Puppet run, Keystone will be reconfigured to use Active Directory for authentication.


    As we mentioned before, the method of having Keystone authenticate users against
    LDAP is being phased out in favor of having the Apache HTTP server perform the
    authentication itself and then pass through a `REMOTE_USER` environment variable.
    By default, Packstack will provision Keystone as a **Web Server Gateway Interface
    (WSGI)** service within Apache. Configuring the Keystone virtual host to authenticate
    users is described at `http://docs.openstack.org/developer/keystone/external-auth.html`.


    ## Provisioning workflows


    We''ve spent almost the entirety of this book discussing how to implement OpenStack
    and very little of it discussing how most organizations are actually using it.
    In this section, we''ll explore different ways that OpenStack adopters typically
    provision virtual infrastructure. First, we''ll look at giving users access to
    the Horizon user interface. Then, we''ll look at provisioning through the Nova,
    Cinder, and Neutron APIs. Finally, we''ll look at using Heat to orchestrate the
    OpenStack infrastructure using templates.


    ### The Horizon user interface


    The Horizon dashboard UI provides an intuitive and standardized interface for
    users who already understand the concepts of cloud computing and want to have
    complete control over their provisioned infrastructure. The dashboard works particularly
    well in situations where the end user is expected to provide some level of support,
    where they are responsible for scheduling their own backups, for example. We''ve
    seen this approach used in public web hosting companies and also in private cloud
    use cases where the primary goal is to provide low-cost compute environments to
    development teams.


    ### Integrating the Platform


    Organizations that provide access to the dashboard to their end users will typically
    customize it to some extent. The appearance of the dashboard is relatively trivial
    to customize. The Liberty release of OpenStack introduced the concept of **themes**
    for Horizon, which provides a standardized way of changing colors, images, and
    layouts. There is also a simple mechanism for enabling or disabling the various
    panels on the dashboard. Finally, it is also possible to override the Python classes
    that correspond to the panels by means of a **customization module**. We''ve seen
    organizations do this when they want to gather additional information from users
    when they''re provisioning infrastructure. Information on the various options
    is available at `http://docs.openstack.org/developer/horizon/topics/customizing.html`.


    The following screenshot represents the Horizon dashboard UI:


    ![](img/2f752555f69992669defa8b25e6dcee9_145_0.png)


    Conseil Européen pour la Recherche Nucléaire (CERN) customized OpenStack dashboard


    While creating a custom theme for the Horizon dashboard is relatively simple and
    is probably a prerequisite for organizations that are going to provide access
    to their end users, overriding the classes that make up the dashboard is a relatively
    expensive option to pursue. While the initial development may not be that difficult,
    it introduces a support burden in the longer term. It also adds additional testing
    requirements that are difficult to automate. For these reasons, organizations
    which want to tailor the provisioning process to their specific goals will typically
    use an external service catalog, which interacts with the API on behalf of the
    end users.

