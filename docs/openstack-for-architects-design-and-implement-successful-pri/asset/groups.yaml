    \ = Exchange('nova', 'topic', durable=False)\nnotifications_queue = Queue('notification-listener',\
    \ exchange = nova_exchange, routing_key='notifications.info')\nconn = Connection('amqp://guest:guest@192.168.0.10/')\n\
