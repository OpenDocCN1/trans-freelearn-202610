    # Capacity planning


    As one of the four major ITIL processes that fall under financial management for
    IT, capacity planning is clearly an important part of any cloud strategy. However,
    not all cloud strategies are the same. It is very important to differentiate workloads
    in enterprise virtualization and in an OpenStack elastic cloud. With virtualization,
    each workload, and in many cases each server, is important. If an individual virtualization
    server becomes overused or is somehow degraded, that particular server is investigated,
    scaled, and/or repaired. One common analogy is to compare virtualized VMs and
    servers to "pets". In the pure OpenStack cloud world, there is no such construct
    for these individual instances (pets) except when virtualized workloads are moved
    into the elastic cloud and thus bring IT-as-a-service workloads into a true cloud.
    OpenStack was constructed around the premise that workloads are ephemeral, failure
    is expected, and growth should be scaled horizontally, not vertically. If a workload
    fails, another will simply be started in its place. "Livestock" has been the analogy
    used to explain this idea of ephemeral instances and workloads. In this analogy,
    livestock are simply a resource; if they die, or are irreparably injured, they
    are simply destroyed and replaced. In OpenStack, this idea even extends to the
    underlying hardware. In many companies, compute servers are simply white label
    hardware compute server resources that are to be used on-demand. If they fail,
    other, online and equally ubiquitous resources take their place (either in a scripted
    disaster recovery fashion or by having adequate excess capacity). Furthermore,
    if the compute servers become slow due to high loads, more ubiquitous resources
    (compute servers) are added to increase capacity. This is an important concept
    to grasp when speaking about elastic capacity. Under this definition of compute
    servers as generically uniform, disposable, and scalable resources, when the available
    capacity changes, growth is not linear but based on demand. However, demand can
    change with development cycles, development methodologies, time of the year, and
    production cycles.'
