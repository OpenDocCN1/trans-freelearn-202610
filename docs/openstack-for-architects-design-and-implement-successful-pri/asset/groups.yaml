    at that time. As such, architects using Ubuntu might use one set of software,
    those using CentOS or RHEL might use another set of software, and those using
    a Rackspace or Mirantis distribution might use yet another set of software. However,
    these days, the technology stack has converged and the H/A pattern is largely
    consistent regardless of the distribution used.


