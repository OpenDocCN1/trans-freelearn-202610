  mdcn: '

    这种需求变动性通常是线性的，甚至可能随着云采用而呈指数级增长。然而，在构建 OpenStack 环境时，需要采用适当的方法来帮助制定最准确的容量规划，并为日后制定战略性和战术性决策奠定基础。这与虚拟化容量规划有很大不同，虚拟化容量规划往往更线性，因为工作负载更持久，并且不会频繁回收。


    ## 规划你的城市


    与土木规划和建筑非常相似，OpenStack 云就像一个由租户组成的城市，需要资源才能存在。然而，在资源有限的情况下，不能让租户自行管理；资源耗尽的风险太大了。这类似于公寓楼的居民拥有无限的电、水、燃气、有线电视和空间，而无需计量或支付任何费用。许多居民可能会认为资源是无限的，他们可以无限扩大和超订一切而无需承担后果。因此，无论是在土木工程还是
    OpenStack 云中，都需要运营方为最终用户进行容量管理和风险缓解。这意味着要找到一种方法来跟踪、分析并向最终用户或其租户成本中心收取费用（或至少展示成本）。这包括创建预定义的结构化资源包，用户可以从中选择，以及创建和维护配额系统。


    容量风险缓解和规划通过执行三个不同的操作来完成：


    - 跟踪使用情况

    - 分析增长

    - 计费/成本分摊（Chargeback/Showback）


    ## 跟踪使用情况并分析增长


    为了跟踪任何资源的使用情况，我们首先需要标准化我们要统计的单位。在云计算中，利用 OpenStack 数据库中已有的数据，以及使用计量项目 Ceilometer，可以实现极细粒度。虽然可以跟踪许多不同的计量器，但让我们从跟踪随时间使用的单个
    vCPU 数量、随时间变化的内存量和精确到分钟的磁盘使用情况开始。然而，让用户自行组合这三个数据点可能会导致数万种组合。因此，在 OpenStack 云中，我们使用
    flavor（实例规格）来限制用户的选择。Flavor 是虚拟硬件模板，是计算、存储甚至网络元素的逻辑分组。


    通过将资源逻辑分组为可管理的产品，这简化了计费/成本分摊的等式。在我们的示例中，我们仅考虑 vCPU 和内存；然而，同样的原则也适用于持久性和临时存储以及网络资源分配。


    继续我们土木工程的类比，我们可以将 flavor 视为一个大家庭，希望入住一栋有空间要求的公寓楼。在这个例子中，我们的一个约束是，65,536 平方英尺的建筑最多只能有
    16 个房间，并且根据规定，只能容纳 64 人。然而，由于这是一栋新公寓楼，房间大小尚未确定，物业经理会根据家庭的需求来建造房间。物业经理决定让前三个申请人选择房间大小，并根据家庭所需的规格向他们收费。


    让我们从每个家庭的请求开始，每个请求都有精确且独特的要求：


    - 3 人家庭需要 1,024 平方英尺

    - 7 人家庭需要 8,096 平方英尺

    - 29 人家庭需要 30,720 平方英尺


    下面我们可以看到，使用这些独特且任意的房间大小，一个 65,536 平方英尺的房屋会是什么样子：


    ![](img/2f752555f69992669defa8b25e6dcee9_126_0.png)


    我们现在共有 49 人和他们的物品占据着这座容量为 64 人的建筑。这留下了可容纳 15 人的空间，但分散在大量被浪费的不同类型和配置的空间（资源）中，因为上面列出的现有家庭分组都不再能完美地填满现有空间中的同等房间；物业经理只有两个选择。他可以为不同家庭创建额外的不规则大小的公寓，以容纳另外
    15 人，并希望有该规模的家庭申请，或者购买新房子，继续使用现有的不规则尺寸，而放弃房产中浪费的空间。这就是 OpenStack 云中没有进行 flavor
    标准化时发生的情况。


    将计算节点视为货运货车，将 flavor 视为箱子。使用标准尺寸的箱子，打包轻松且效率高。将箱子视为 vCPU；现在，我们将所有箱子视为正方形，尺寸如下：


    - 1 英尺宽的箱子

    - 2 英尺宽的箱子

    - 4 英尺宽的箱子


    这条线路上人们运送的大多数箱子都是 2 英尺规格的，但还有另外两种类型的箱子（1 英尺和 4 英尺）。然而，交通运输部只允许每辆卡车装载 64 英尺的箱子。不过，这次我们创造了可堆叠的空间。现在，当我们拥有互为指数的结构化箱子分组时，看看会发生什么：


    ![](img/2f752555f69992669defa8b25e6dcee9_127_0.png)


    为了确定计算容量，我们使用期望的 VM 密度；在本次讨论中，我们将估计值设置为每台计算服务器 40 个 VM，并将密度乘以组织中最常见的 flavor：


    40 x 2 vCPU = 80 vCPU（假设非超线程 CPU，如果是超线程，则将此数字乘以 1.3）


    40 x 4096 = 160 GB RAM（假设 RAM 超订比为 1:1）


    根据经验法则，计算节点在满载时需要约 20% 的总 vCPU 和 RAM 用于开销和操作系统进程。这些资源需要包含在所需总资源的计算中：


    包含操作系统开销所需的 vCPU 数量：80 * 1.20（100% + 20%）= 96 vCPU


    包含操作系统开销所需的内存：160 * 1.20 = 192 GB RAM


    因此，为了拥有一个精确扩展的起点，我们需要一台硬件支持 96 个 vCPU 的计算服务器。我们将 vCPU 的超订比设置为 8:1，因此我们需要将所需的 vCPU
    数量除以 8，以获得所需的 CPU 核心数。超订比可能不同，因此请根据实际情况调整计算，如下所示：


    所需 vCPU 总数 / 超订比 = 核心数


    96 / 8 = 12 个 CPU 核心


    因此，基于此计算，我们需要 12 个 CPU 核心来支持该云的平均 flavor（命名为 medium）的大约 40 个实例。由于现在大多数服务器都是双核或四核型号，我们只需要一台配备
    6 核处理器的双路 CPU 服务器。对于此示例，Intel E5-2620v3 或 E5-2643v3 之类的处理器足以满足一般工作负载。


    对于内存，我们只需确保每台计算服务器具有 192 GB RAM，并且由于这是一台配备 12 个 DIMM 插槽的 6 核双路服务器，每个处理器内存组需要 32
    GB。因此，作为可视化表示，下图大致展示了逻辑内存分配的样子。


    ## 为运营而构建


    在服务器达到其 40 实例加一的限制后，仍有一些剩余资源。这些内存可用于额外的实例，或留作计算服务器在负载时操作系统峰值备用。


    | 计算服务器 - 192GB RAM - 2 x 2643 Intel CPU（96 个 vCPU @ 8:1 超订） |

    |---|

    | S | S | L | M | M | L |

    | S | S | L | M | M | L |

    | M | S | S | M | S | S | S | S |

    | M | S | S | M | S | M |

    | L | M | M | L | M | M |

    | M | M | M | M |

    | M | M | M | M |

    | 为操作系统保留的 CPU |


    在上图中，我们有一个明细，如下所示：


    | Flavor 大小 | 实例数 | vCPU | 内存（GB） |

    |---|---|---|---|

    | 小型 | 13 | 13 | 26 |

    | 中型 | 24 | 48 | 96 |

    | 大型 | 4 | 16 | 32 |

    | 总计 | 41 | 78 | 154 |

    | 为操作系统保留 |  | 18（约20%） | 38 GB（约20%） |


    这显示了我们之前 flavor 要求的近乎理想的配置，尽管我们并没有用*全部*中型镜像来填充它。然而，如果添加了更多 flavor，而不遵循前面推荐的模型，最终会出现间隙以及
    CPU 和内存的浪费，具体取决于 flavor 的多样性和这些 flavor 的实例数量。


    将这种 flavor 确定性作为最佳实践，将使运维人员能够更准确地测量/监控以下内容：


    - 整体容量

    - 随时间增长

    - 利用率和过度利用

    - Nova 对 VM 的正确放置


    许多公司花费了大量时间制定内部策略，用于收集、管理和分析来自其云的数据，以回答所讨论的主题。然而，近年来，出现了许多不同的云管理平台（CMP）和专用货币化与管理软件，以简化计费和成本分摊（chargeback
    and showback）。然而，OpenStack 的遥测项目 Ceilometer 一直面临规模挑战。虽然技术上已取得进展，但现在一些容量规划软件已配置为直接使用
    OpenStack API，甚至不需要 OpenStack 遥测服务（Ceilometer）。

    '
