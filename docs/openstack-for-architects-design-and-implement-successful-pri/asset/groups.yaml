    ## Building a highly available control plane


    Back in the Folsom and Grizzly days, coming up with an High Availability (H/A)
    design for the OpenStack control plane was something of a black art. Many of the
    technologies recommended in the first iterations of the OpenStack High Availability
    Guide were specific to the Ubuntu distribution of Linux and were unavailable on
    the Red Hat Enterprise Linux-derived distributions.


