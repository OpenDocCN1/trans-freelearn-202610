    \n# Consuming events from Ceilometer\n\nConsuming events from the message queue\
    \ allows for a push-style integration model in the OpenStack environment. Writing\
    \ and maintaining a daemon to consume events from the queue and act on them can\
    \ be onerous for many organizations, though. A much simpler option is to poll\
    \ the Ceilometer interface for events over the REST API. Given that Nova (as well\
    \ as other services) is configured to emit notifications over the message bus,\
    \ the Ceilometer service can store them and make them available for polling. To\
    \ enable this functionality, set store_events to True in /etc/ceilometer/ceilometer.conf.\n\
    \nThe following example shows how to retrieve events from Ceilometer using the\
    \ Python requests library:\n\n+   1. First, we begin by retrieving a token from\
    \ Keystone:\n\n```\nimport requests #http://docs.python-requests.org/en/latest\n\
    import json\n\nKEYSTONE_URL = 'http://controller01:5000/v2.0/'\nTENANT       =\
    \ 'demo'\nUSERNAME     = 'demo'\nPASSWORD     = 'secret'\n\nr = requests.post(\"\
    %%/tokens%%\" (KEYSTONE_URL,), json={\n  \"auth\": {\n    \"tenantName\": TENANT,\n\
    \    \"passwordCredentials\": {\n      \"username\": USERNAME,\n      \"password\"\
    : PASSWORD,\n    }\n  }\n})\nif r.ok:\n    token = r.json()['access']['token']['id']\n\
    else:\n    raise Exception(r.text)\n```"
