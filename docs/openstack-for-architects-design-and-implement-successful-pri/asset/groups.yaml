    \ servers, and the instance ID. For example, http://192.168.0.10:8774/v2/8ce08c9fa6c54ba094be743a55dc5b9a/servers/d87f6e9d-347e-48f3-acfb-6f2e85c43629.\n\
    \nThe following request provides the status of the instance:\n\n```\nrequests.get(server.json()['server']['links'][0]['href'],\n\
    headers=headers)\n```\n\n- 6. Once an instance has been created, actions can be\
    \ POSTed to the instance's URL with the string action appended. For example, the\
    \ following code will stop an instance:\n\n```\nserver_url = server.json()['server']['links'][0]['href']\n\
    stop = requests.post(\"%s/action\"% (server_url,), json={\n  \"os-stop\": None\n\
    }, headers=headers)\n```\n\n- 7. Finally, to delete an instance, issue an HTTP\
