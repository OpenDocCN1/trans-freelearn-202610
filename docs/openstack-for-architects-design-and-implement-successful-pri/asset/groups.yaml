    Some of the organizations that we''ve worked with have expressed frustration at
    the complexity of integrating the OpenStack platform with the other services in
    their environment. For these organizations, a Cloud Management Platform (CMP)
    that obfuscates some of the technical details of integration is an option worth
    considering. CMPs such as Red Hat''s CloudForms or Dell''s Cloud Manager will
    wire into the REST APIs and the message bus of an OpenStack implementation and
    allow for higher-level access to the objects within the virtual infrastructure.
    They also offer out-of-the-box integrations with third-party authentication, service
    catalogs, and billing systems.


    We like to think of the entire OpenStack system as a massive integration platform.
    Before OpenStack, organizations spent huge amounts of resources integrating their
    storage, network and compute infrastructure with their organizational infrastructure.
    The open design of the system is one of its greatest strengths. In the next chapter,
    we will be discussing OpenStack security. We will examine common security practices
    such as logging, patching, and encryption as well as some application security
    suggestions.


