  - '[PAGE 167]


    +   - **Management zones**: These are the zones where the OpenStack services reside
    and interact. These particular zones are typically isolated for OpenStack control
    plane traffic only. Due to the sensitive nature of this internal communication,
    steps must be taken to harden this particular network, and access to this network
    should only be given to the servers that are operating the control plane for OpenStack.
    Once this is done, this zone is considered trusted. In any case where this zone
    is made to be routed or connected to a routable network, in effect bridging it
    to an untrusted zone, this network immediately becomes untrusted and must have
    compensating controls implemented immediately.

    +   - **Data zones**: These are the security zones that primarily contain the
    services and network traffic pertaining to the storage services within OpenStack.
    This data typically requires high security and high levels of confidentiality.
    The level of trust in this network zone is highly dependent on the workloads running
    in the cloud and the type of deployment that is done. Therefore, this zone can
    be trusted or untrusted, and without knowing the specifics of the type of deployment
    we cannot assign a default level of trust. It is important to understand these
    zones when considering OpenStack security and the resources and services running
    on the platform. Developers have purposely segregated access to varying parts
    of the platform to segregate privileged and nonprivileged zones as well as to
    reduce cross-zone attacks.


    # Software vulnerabilities


    OpenStack is an orchestration platform written mostly in Python that runs on top
    of a Linux-based operating system. This orchestration platform is responsible
    for provisioning instances or Infrastructure as a service to tenants in support
    of workloads that are required to run in a cloud environment. Therefore, OpenStack
    software vulnerabilities can be broken down into two main groups. The first group
    consists of instances or bare metal servers that OpenStack provisions and orchestrates,
    the second consists of the OpenStack infrastructure environment and its hosts.'
  - '[PAGE 168]


    # Instance software security and patching


    Under OpenStack, the hypervisor creates and runs independent virtual machines
    or instances. These instances require software updates and patching separate from
    the underlying OpenStack infrastructure on which it resides. Updates to the hypervisor
    and underlying server operating systems are not propagated up to the active workloads
    and instances; therefore, two strategies must exist-one for instances running
    on the cloud and another for the cloud infrastructure.


    The instance strategy should align with the existing organizational and governance
    policies that are currently in effect that control patching of existing legacy
    systems. Since OpenStack launches instances based on images and flavors that may
    have executable metadata injected into the instance upon boot, there are multiple
    ways to ensure the latest hardened image is used prior to launching an instance
    depending on the workload type.


    For the traditional, ephemeral workloads commonly found on OpenStack clouds, regular
    updates to the Glance images should be performed as per organizational policy
    and should be controlled by a trusted organization within a company. These updates
    should add patches and security fixes to an operating system and be imported as
    an existing image in the glance repository. These updated images should be tested
    in a lower development or sandbox environment before implementing into production.
    These updated images will then serve as the base operating system for any new
    instances using that image as well as ephemeral workloads that, have been using
    that image. However, the running image will not change. The security patches will
    not take effect until the instances are rebooted. Typically, ephemeral workloads
    tend to be able to reboot without impact to the availability of the application,
    however, persistent workloads running on the cloud will need to develop application
    based strategies for maintaining uptime of the application while patching. Some
    organizations have strict rules about reboots of instances running on old versions
    of images depending on whether the patch applied to the image was for security
    or simply an update.'
  - '[PAGE 169]


    Default OpenStack security policies should be created to allow legacy software
    compliance tools to scan hosts for software update compliance. In the case of
    persistent workloads and instances not experiencing frequent reboots or that need
    to maintain certain levels of availability, security policies may be created to
    allow these instances to use legacy software repository based patching solutions
    and implement patches in a traditional fashion by patching the running instance.
    However, there may be additional network configurations needed to make the software
    repositories available within tenant networks based on an organization''s OpenStack
    network deployment. For both the ephemeral and persistent workloads, cloud-init
    and cloudbase-init could be used to execute an update to an image upon boot using
    native software management tools and the local software repositories. However,
    these updates that would occur upon boot may delay provisioning depending on the
    number of updates performed on the image. This is why the updating of the base
    glance images is the best practice for security and software update compliance
    of instances.


    # Infrastructure host security and patching


    Security is a fundamental part of the OpenStack architecture and needs to be maintained
    in order to protect the various security zones of the stack. OpenStack is a complex
    platform comprised of many different parts that are actively and continually being
    developed by multiple different parties. On the surface, this can seem fundamentally
    insecure, however, not only is OpenStack being developed by thousands of individuals,
    it is also being tested and scrutinized by thousands of users and developers.
    These users and developers create a useful feedback loop to other developers and
    testers. This provides almost constant vigilance against sloppy and insecure code.
    However, as in commercial software, security issues have still been discovered.
    This is why the OpenStack Foundation has created an OpenStack Security Team that
    publishes advisories about identified security issues, descriptions, and links
    to patches.


    # Patching OpenStack code


    These patches are for vulnerabilities in the code for OpenStack. The current security
    advisory list is maintained at https://security.openstack.org/ossalist.html, where
    patches are also provided. These patches are mostly upgraded Python files that
    can simply replace the existing file on the OpenStack control or compute servers.
    An example of a patch that includes replacement files for a bug discovered in
    the neutron can be seen at https://review.openstack.org/#/c/299025/. The OpenStack
    Vulnerability Management Team is responsible for the bug and fix process for security
    and OpenStack at https://wiki.openstack.org/wiki/Vulnerability_Management.'
