  mdcn: '

    Satellite 甚至可以配置为单一系统，或配置为一系列远程系统，这些系统充当代理，并从中心服务器获取授权和订阅信息。这些商业应用还为用户提供包管理的单一管理界面，并允许为企业中不同类别的服务器创建更新配置文件。


    另一种选择是使用 Puppet、Chef 和 Ansible 等开源工具，通过创建脚本执行复制和验证，手动创建和维护包仓库。不过，更完整的方案是使用 Pulp（http://www.pulpproject.org/）等社区项目。Pulp
    是一个用于管理软件仓库的免费开源平台。它可配置支持 RPM 包类型（rpm、srpm、errata 等）、Puppet 模块、Docker 镜像、Atomic
    Trees、Python 包等。还可以通过插件支持 Debian 包。使用 Pulp 可以完成以下操作：


    - 手动将发行版仓库中的内容拉取到 Pulp 服务器，可以是仅一次或定期进行

    - 将你自己的内容上传到 Pulp 服务器（OpenStack 安全补丁）

    - 将内容发布为基于 Web 的仓库、一系列 ISO 或其他各种方式


    随着需要修补的主机数量增加，软件修补和仓库管理会变得越来越困难。在启动 OpenStack 部署时，制定正确的修补策略并借助工具来管理和启用修补，对于扩展
    OpenStack 云至关重要。通过先在较低环境、再在生产环境中对 OpenStack 基础设施应用和测试安全补丁，组织将确保开发和生产环境都是安全的，并已通过运维测试。


    ## 加固 Hypervisor


    Nova 服务是 OpenStack 最复杂的项目之一，在环境中提供计算功能。Nova 在 OpenStack 云中无处不在，并与大多数其他核心 IaaS
    服务交互。正确配置这一特定服务是保障 OpenStack 部署安全的重要因素。


    ## 标准 Linux 加固实践与 Hypervisor


    OpenStack 环境安全的关键在于虚拟化技术（也称为 hypervisor）的配置和加固。虽然 OpenStack 可以配置使用多种不同的 hypervisor，但目前最常用的
    hypervisor 是 KVM。RHEL、Ubuntu 和 CentOS 等所有主流操作系统都支持 KVM hypervisor。Red Hat OpenStack
    Platform、Mirantis OpenStack 和 HP Helion 等所有主流 OpenStack 发行版都默认使用 KVM 作为 hypervisor。因此，我们将重点关注在
    Linux 上运行、实现生产级安全的 KVM hypervisor。


    此外，KVM hypervisor 已在商业发行版上通过美国政府的 Common Criteria 计划认证，并已验证可将各实例的运行时环境彼此隔离，从而提供充分的实例隔离。更多信息请参阅
    https://www.niap-ccevs.org/NIAP_Evolution/faqs/nstissp-11/。


    Red Hat OpenStack Platform 是已通过 Common Criteria 认证的发行版之一，它必须满足以下最低身份验证要求列表：


    - 审计（能够详细审计大量事件）

    - 自主访问控制

    - 强制访问控制

    - 基于角色的访问控制

    - 对象重用（文件系统对象、内存和 IPC 对象）

    - 管理用户的安全管理

    - 安全通信（SSH）

    - 存储加密（支持加密块设备）

    - TSF 保护（通过硬件保护内核软件和数据）


    ## 保护云安全


    虽然这些身份和认证功能是美国政府软件认证所必需的，但它们对于生产云环境同样至关重要，尤其是那些在公共区域运行并连接互联网的环境。这些工具的输出应输入到第 5
    章 *构建可运维* 中讨论的更大日志、监控和告警框架中。在使用 ELK 等日志处理与审计工具时，一旦发生任何安全事件或超过阈值，即可生成安全告警。


    除了身份和认证之外，OpenStack 还可以使用多种不同的密码标准来实现身份识别、认证、数据传输加密以及静态数据保护。其中一些如下：


    - AES：传输中数据和静态数据

    - TDES：传输中数据

    - RSA：传输中数据以及身份识别/认证

    - DSA：传输中数据以及身份识别/认证

    - Serpent：静态数据

    - Twofish：静态数据

    - SHA-1：传输中数据和静态数据

    - SHA-2：静态数据以及身份识别/授权


    为了实现最佳安全性，不仅底层操作系统必须提供相应功能，运行计算主机的硬件（也因此运行 hypervisor）也应支持以下特性：


    | 特性 | 硬件描述 | 安全增强 |

    |---|---|---|

    | VT-d / AMD-Vi | I/O MMU | PCI 直通保护 |

    | Intel TXT / SEM | 英特尔可信执行技术 | 动态证明服务 |

    | SR-IOV、MR-IOV、ATS | PCI-SIG I/O 虚拟化 | 多个实例安全共享 PCI Express 设备。 |

    | VT-C | 网络虚拟化 | 改进 hypervisor 上的网络 I/O |


    除了硬件和操作系统要求之外，KVM 还支持其他功能，如 sVirt（SELinux 和虚拟化）、Intel TXT 和 AppArmor。


    ## SELinux 与 sVirt 实战


    以下步骤将帮助你检查 SELinux 是否处于 enforcing（强制启用并保护）状态。由于你的实验室运行的是 CentOS 7，你应该已经安装了 SELinux
    并处于 enforcing 状态，同时所有已安装软件也应支持 sVirt 正常工作。我们将向你展示如何设置镜像文件权限以保护你的实例：


    - 1. 在实验室服务器上以 root 身份执行以下命令：


    通常，在 HA 环境中，你会在计算节点上执行此命令。


    ```

    # getenforce

    Enforcing

    ```


    确认命令返回 Enforcing。


    - 2. 如果由于某种原因输出其他内容，请执行以下操作并重复上一条命令：


    ```

    # setenforce 1

    ```


    - 3. 现在，检查你的 id 和上下文：


