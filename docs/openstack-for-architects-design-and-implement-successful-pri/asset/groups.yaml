    # Creating the composition layer


    Now that our infrastructure software is in place, we''ll begin creating our composition
    layer. As we mentioned earlier, we''ll be starting with the “known good” configuration
    we got from running the `packstack` command in Chapter 2, *Architecting the Cloud.*'
  - '[PAGE 96]


    # Starting our Puppet modules


    Our composition layer will be stored in two Puppet modules, using the **profiles
    and roles** pattern developed by Craig Dunn (http://www.craigdunn.org/2012/05/239/).
    We''ll store the modules in a directory called `puppet/modules` in our new Git
    repository. The following steps will create the new modules within our repository:


    +   1. Clone the repository. It is recommended to use an unprivileged user account
    for this section:

    +   ```

    +   $ git clone http://git@localhost/git/openstack/

    +   ```

    +   2. Next, create the directory for the modules:

    +   ```

    +   $ mkdir -p openstack/puppet/modules

    +   ```

    +   3. Use the `puppet module` command to create the new modules in the directory:

    +   ```

    +   $ cd openstack/puppet/modules

    +   $ puppet module generate openstack-profile

    +   $ puppet module generate openstack-role

    +   ```

    +   For each of these commands, you will be prompted for a set of metadata about
    the module. Enter as much information as you''d like or take the defaults.

    +   4. Once you''ve set up the modules as you like, go back to the top level of
    the code repository and check them into revision control with the following commands:

    +   ```

    +   $ cd ~/openstack

    +   $ git add puppet

    +   $ git commit -m ''Initial check-in of the profile and role modules''

    +   $ git push origin master

    +   ```

    +   You should see that the modules have been committed and pushed into a new
    master branch on the repository.

    +   5. Now let''s add these modules to our Puppet master. To do this, clone a
    clean copy of the repository onto a location on the server as the root user:

    +   ```

    +   # cd /srv

    +   # git clone http://localhost/git/openstack

    +   ```'
  - '[PAGE 97]


    You should receive a message such as `Cloning into ''openstack''...`, which will
    indicate the success of the command.


    +   6. We''ll be updating this repository with a Jenkins job, so change the ownership
    of the directory to the Jenkins user:


    ```

    # chown -R jenkins:jenkins /srv/openstack

    ```


    If you''re using a remote Jenkins server, you''ll need to set permissions so that
    you can log into this machine remotely and run a `git pull` command in that directory.


    +   7. Next, symlink the two new puppet modules into `/etc/puppet/modules` on
    the master:


    ```

    # cd /etc/puppet/modules

    # ln -s /srv/openstack/puppet/modules/openstack-profile profile

    # ln -s /srv/openstack/puppet/modules/openstack-role role

    ```


    You should now see the two modules in the output of `puppet module list` on the
    master:


    ```

    /etc/puppet/modules

    ├── openstack-profile (v0.1.0)

    └── openstack-role (v0.1.0)

    ```


    # Defining the first role and profile


    We already have a set of host groups defined in our design document. We''ll map
    these directly to roles in our Puppet composition layer. Each role will get it''s
    own class and file in the role Puppet module. A role comprises of profiles, each
    of which represents a piece of OpenStack functionality. For example, the `mariadb`
    profile will install and configure the MySQL database server for our deployment,
    the `amqp` profile will install and configure the RabbitMQ message server, and
    so on. Let''s start by creating a Database Node role and associated profile.'
  - "[PAGE 98]\n\n# Building the Deployment Pipeline\n\nAs we mentioned earlier, we'll\
    \ use the Packstack configuration that we created in *Chapter 2, Architecting\
    \ the Cloud*, as a starting point for our composition layer. Normally, when Packstack\
    \ runs, it deletes the Puppet manifests that it uses to install the OpenStack\
    \ software on the hosts. If you specify the `-y` option, however, it will exit\
    \ without doing anything and leave the Puppet manifests in place. On the original\
    \ host that you ran Packstack in *Chapter 2, Architecting the Cloud*, rerun Packstack\
    \ with the same answer file and the `-y` option:\n\n```\n```bash\n# packstack\
    \ --answer-file=packstack.answers -y\n```\n```\n\nAfter the command has completed\
    \ execution, it will print the name of the directory where it wrote the Puppet\
    \ manifests. It should be something like `/var/tmp/packstack/20151123-214424-gJbmJA`.\
    \ Descend into that directory and copy the Hiera data and manifests to your CI\
    \ server.\n\nPackstack's Puppet manifests use Hiera, Puppet's **key/value lookup\
    \ tool**, to make it easy to store configuration information such as passwords\
    \ and IP addresses so that they don't need to be stored in the manifests themselves.\
    \ We'll stay with this practice. Copy the `hieradata` directory to `/etc/puppet/hieradata`\
    \ on the CI server. To tell Puppet to reference this data, create a file called\
    \ `/etc/puppet/hiera.yaml` with the following contents:\n\n```\n```yaml\n---\n\
    :backends:\n  - yaml\n:hierarchy:\n  - defaults\n  - \"%{clientcert}\"\n  - \"\
    %{environment}\"\n  - global\n\n:yaml:\n  :datadir: /etc/puppet/hieradata\n```\n\
    ```\n\nNow, let's create the first profile. Create a new file named `puppet/modules/openstack-profile/manifests/mariadb.pp`\
    \ in our checked-out copy of the openstack repository. Once again, use an unprivileged\
    \ account."
  - "[PAGE 99]\n\nStarting with the Newton release of RDO, the manifests created by\
    \ the Packstack tool have adopted the roles and profiles model that we're implementing\
    \ in this chapter. Two roles exist in Packstack – one for controllers and one\
    \ for compute nodes. We'll be creating a new role by copying relevant profiles\
    \ from the controller manifest. In `mariadb.pp`, create a class definition like\
    \ the following:\n\n```\nclass profile::mariadb {\n  include '::packstack::mariadb'\n\
    \  include '::packstack::mariadb::services'\n}\n```\n\nThis defines the `mariadb`\
    \ profile with the same Puppet code that we used to install the database in our\
    \ Packstack installation. Now create a file named `puppet/modules/openstack-role/manifests/database.pp`.\
    \ Create a class named `role::database` in that file, which references the profile\
    \ we created earlier:\n\n```\nclass role::database {\n  include profile::mariadb\n\
    }\n```\n\nAdd the two files to a commit and then commit and push them to the Git\
    \ server.\n\n# Running the first build\n\nVisit Jenkins at http://jenkins:8080/,\
    \ replacing `jenkins` with the hostname of your CI server. The Jenkins UI should\
    \ come up, prompting you to create a new job."
