    当客户端向 Keystone 请求令牌时，会同时发送所请求的令牌范围：租户、项目或域。如果凭据能够授权客户端，Keystone 返回的令牌将特定于所请求的范围。一旦客户端获得令牌，向其他
    OpenStack 服务发送的每个 API 请求都会在 HTTP 标头中包含该令牌。其他服务使用该令牌来授权客户端的请求。


    目前 OpenStack 中广泛使用的 Keystone API 有两个版本：版本 2 和版本 3。在 API 版本 2 中，用户被授权访问特定的项目或**租户**。一个用户可能拥有多个租户的权限，且权限因租户而异。例如，用户
    **msolberg** 在 **msolberg** 租户中可能拥有管理权限，但在 **architect** 租户中只有用户权限。API 版本 3 引入了授权域的概念，在基本租户之上提供了一层层级结构。Keystone
    API 版本 3 已经发布数个版本，但各个服务支持新的授权模型都需要一定时间。因此，大多数 OpenStack 部署仍使用 Keystone v2 API。


    Keystone 在根据一组凭据决定是否颁发令牌时，会结合使用多个后端驱动。第一个后端驱动是身份驱动。身份驱动可以是 SQL（参考实现）或**轻量目录访问协议（LDAP）**。如果驱动设置为
    LDAP，则可以使用外部目录服务对用户进行身份验证。第二个驱动是**分配（assignment）**驱动。该驱动允许用户使用 LDAP 进行身份验证，并使用
    SQL 数据库分配角色。这种配置是 Active Directory 最常用的集成模式。


    ## 使用分离分配和身份配置 Keystone


    在配置 Keystone 使用 Active Directory（或其他 LDAP 服务）进行身份验证之前，需要先在 Active Directory 端做一些更改。首先，决定如何将
    Active Directory 中的对象映射到 OpenStack 中的账户。例如，您可能希望目录中拥有账户的任何用户都能访问 OpenStack 中的租户，或者您可能希望将使用权限限制在特定的用户组。如果打算限制用户，您需要创建一个组或属性来筛选这些用户。其次，需要创建一个能够查找其他用户的用户。请使用
    `ldapsearch` 等工具执行测试，验证该用户是否有读取相应账户对象子树的能力。有关 Active Directory 端先决条件的更多信息，请参阅
    `https://wiki.openstack.org/wiki/HowtoIntegrateKeystonewithAD`。


    接下来，我们将配置 Keystone 使用 LDAP 身份后端和 SQL 分配后端。Packstack 开箱即用地支持此配置，我们只需更新 Puppet master
    上的 Hiera 数据，即可让我们的安装反映新设置。下表列出了所需的设置：


    | Hiera 变量 | keystone.conf 设置 | 描述 |

    |---|---|---|

    | CONFIG_KEYSTONE_IDENTITY_BACKEND | identity.driver | 要使用的后端（ldap） |

    | CONFIG_KEYSTONE_LDAP_URL | ldap.url | AD LDAP 服务的 URI |

    | CONFIG_KEYSTONE_LDAP_USER_DN | ldap.user | 用于查找账户的服务用户 |

    | CONFIG_KEYSTONE_LDAP_USER_PASSWORD | ldap.password | 服务用户的密码 |

    | CONFIG_KEYSTONE_LDAP_SUFFIX | ldap.suffix | 服务账户的后缀 |

    | CONFIG_KEYSTONE_LDAP_USER_SUBTREE | ldap.user_tree_dn | AD 中用户账户所在的树 |

    | CONFIG_KEYSTONE_LDAP_USER_OBJECTCLASS | ldap.user_objectclass | 用户账户的对象类（person）
    |

    | CONFIG_KEYSTONE_LDAP_USER_FILTER | ldap.user_filter | 可选过滤器，用于仅选择树中的特定用户 |

    | CONFIG_KEYSTONE_LDAP_USER_ID_ATTRIBUTE | ldap.user_id_attribute | 用作 Keystone
    用户 ID 的属性（cn） |

    | CONFIG_KEYSTONE_LDAP_USER_NAME_ATTRIBUTE | ldap.user_name_attribute | 用作 Keystone
    用户名的属性（cn） |

    | CONFIG_KEYSTONE_LDAP_USER_MAIL_ATTRIBUTE | ldap.user_mail_attribute | 用作 Keystone
    用户电子邮件的属性（mail） |

    | CONFIG_KEYSTONE_LDAP_USER_ENABLED_ATTRIBUTE | ldap.user_enabled_attribute |
    确定用户是否启用的属性（userAccountControl） |

    | CONFIG_KEYSTONE_LDAP_USER_ENABLED_MASK | ldap.user_enabled_mask | 用于确定账户是否启用的位掩码（2）
    |

    | CONFIG_KEYSTONE_LDAP_USER_ENABLED_DEFAULT | ldap.user_enabled_default | 用于确定账户是否启用的默认值（512）
    |

    | CONFIG_KEYSTONE_LDAP_USER_ATTRIBUTE_IGNORE | ldap.user_attribute_ignore | 对象上要忽略的属性（password、tenant_id、tenants）
    |

    | CONFIG_KEYSTONE_LDAP_USER_ALLOW_CREATE | ldap.user_allow_create | 是否允许创建用户（False）
    |

    | CONFIG_KEYSTONE_LDAP_USER_ALLOW_UPDATE | ldap.user_allow_update | 是否允许更新用户（False）
    |

    | CONFIG_KEYSTONE_LDAP_USER_ALLOW_DELETE | ldap.user_allow_delete | 是否允许删除用户（False）
    |


    一旦确定了适用于您的环境的相应设置，请使用相应设置更新 `/etc/puppet/hieradata/defaults.yaml`。在下次运行 Puppet
    时，Keystone 将重新配置为使用 Active Directory 进行身份验证。


    如前所述，让 Keystone 针对 LDAP 对用户进行身份验证的方法正在逐步淘汰，取而代之的是让 Apache HTTP 服务器自行执行身份验证，然后通过
    `REMOTE_USER` 环境变量传递。默认情况下，Packstack 会将 Keystone 部署为 Apache 中的 **Web 服务器网关接口（WSGI）**
    服务。有关配置 Keystone 虚拟主机对用户进行身份验证的说明，请参见 `http://docs.openstack.org/developer/keystone/external-auth.html`。


    ## 调配工作流


    本书几乎整本都在讨论如何实施 OpenStack，而很少讨论大多数组织实际如何使用它。在本节中，我们将探讨 OpenStack 采用者通常如何调配虚拟基础设施的不同方式。首先，我们将介绍如何让用户访问
    Horizon 用户界面。然后，我们将介绍通过 Nova、Cinder 和 Neutron API 进行调配。最后，我们将介绍如何使用 Heat 通过模板编排
    OpenStack 基础设施。


    ### Horizon 用户界面


    Horizon 仪表板 UI 为已经理解云计算概念并希望完全控制其已调配基础设施的用户提供了直观且标准化的界面。在期望最终用户提供一定程度支持的情况下（例如，由他们负责调度自己的备份），仪表板尤其适用。我们已在公共网站托管公司以及以向开发团队提供低成本计算环境为主要目标的私有云用例中看到过这种方式。


    ### 集成平台


    向其最终用户提供仪表板访问权限的组织通常会在一定程度上对其进行定制。定制仪表板的外观相对简单。OpenStack 的 Liberty 版本引入了 Horizon
    **主题** 的概念，提供了一种更改颜色、图片和布局的标准化方式。此外，还有一种简单的机制可以启用或禁用仪表板上的各种面板。最后，还可以通过**自定义模块**覆盖与面板对应的
    Python 类。我们看到一些组织在调配基础设施时，希望从用户那里收集更多信息，就会采用这种做法。有关各种选项的信息，请参阅 `http://docs.openstack.org/developer/horizon/topics/customizing.html`。


    以下截图展示了 Horizon 仪表板 UI：


    ![](img/2f752555f69992669defa8b25e6dcee9_145_0.png)


    欧洲核子研究组织（CERN）定制的 OpenStack 仪表板


    虽然为 Horizon 仪表板创建自定义主题相对简单，并且对于将向最终用户提供访问权限的组织来说可能是先决条件，但覆盖组成仪表板的类却是一项成本相对较高的选择。虽然初始开发可能并不困难，但长期来看会带来支持负担。它还会增加难以自动化的额外测试要求。因此，想要根据自己的特定目标定制资源调配流程的组织通常会使用外部服务目录，由该目录代表最终用户与
    API 交互。

