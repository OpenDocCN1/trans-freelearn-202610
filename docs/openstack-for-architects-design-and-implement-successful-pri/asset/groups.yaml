  - '[PAGE 43]


    # Considerations for performance-intensive workloads


    The guidelines given earlier work well for development, web, or database workloads.
    Some workloads, particularly Network Function Virtualization (NFV) workloads,
    have very specific performance requirements that need to be addressed in the hardware
    selection process. A few improvements to the scheduling of instances have recently
    been added to the Nova compute service in order to enable these workloads.


    ![](img/2f752555f69992669defa8b25e6dcee9_43_0.png)


    NFV is a new developing use case for OpenStack to be used to be the infrastructure
    for workloads that would replace dedicated network appliances. Routers, firewalls,
    proxy servers, and packet core devices are some of the common virtual network
    functions that are being replaced today. Not only does NFV reduce the physical
    hardware needed to operate telecommunication businesses but it also brings all
    of the benefits of cloud native application orchestration to a business case that
    has an increasing need for agility to supply consumers with services faster than
    ever.


    The first improvement allows for passing through a PCI device directly from the
    hardware into the instance. In standard OpenStack Neutron networking, packets
    traverse a set of bridges between the instance''s virtual interface and the actual
    network interface. The amount of overhead in this virtual networking is significant,
    as each packet consumes CPU resources each time it traverses an interface or switch.
    This performance overhead can be eliminated by allowing the virtual machine to
    have direct access to the network device via a technology called SR-IOV. SR-IOV
    allows a single network adapter to appear as multiple network adapters to the
    operating system. Each of these virtual network adapters (referred to as virtual
    functions, or VFs) can be directly associated with a virtual instance.


    The second improvement allows the Nova scheduler to specify the CPU and memory
    zone for an instance on a compute node which has Non-Uniform Memory Access (NUMA).
    In these NUMA systems, a certain amount of memory is located closer to a certain
    set of processor cores. A performance penalty occurs when processes access memory
    pages in a region which is nonadjacent. Another significant performance penalty
    occurs when processes move from one memory zone to another. To get around these
    performance penalties, the Nova scheduler has the ability to pin the virtual CPUs
    of an instance to physical cores in the underlying compute node. It also has the
    ability to restrict a virtual instance to a given memory region associated with
    those virtual CPUs, effectively constraining the instance to a specified NUMA
    zone.'
