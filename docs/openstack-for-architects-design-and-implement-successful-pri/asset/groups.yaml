    For example, an instantiation of a Red Hat Enterprise Linux image may cost a certain
    number of cents per hour, whereas an instantiation of a Microsoft Windows image
    may cost something different. Other resources may be billed based on when they''re
    provisioned regardless of use. For example, a tenant might be charged for how
    long a floating IP was assigned to the project, regardless of whether it was attached
    to an instance. Cinder volumes are frequently treated this way.


    Whether your organization intends to charge your customers based on consumption
    or your organization intends to just show your customers their consumption, there
    are a few different strategies for tracking and reporting usage data. Some organizations
    that provision resources onto OpenStack via the API by a service catalog choose
    to use the service catalog implementation as the system of record. This helps
    maintain consistency for the user. For example, if they''ve provisioned a three
    tier-application, they probably want to be billed for a three-tier application
    and not for three virtual machines, a Cinder volume, and a floating IP. For PaaS
    or Continuous Integration use cases, though, the total amount of compute and storage
    used over a period of time is probably more important.


    There are a few basic approaches to tracking usage in OpenStack. Systems can listen
    for events on the message bus or query Ceilometer for them and then extrapolate
    usage data. Systems can also query Ceilometer directly for usage data. Each of
    these approaches is also useful for other use cases than metering and billing
    and some are better suited than others for each of them. For example, listening
    and timing events can offer great insights into the performance of a system. Also,
    compliance workflows may be driven by certain events within the OpenStack system.


    # Listening to OpenStack


    There are two modes of internal communication in the OpenStack system. The first
    is to GET or POST to the REST API and the second is to pull and push messages
    onto the message queue. Each of the services uses a combination of each; when
    the Nova API gets a request to provision a resource over the REST API, it passes
    that request along to the compute nodes via the message bus. They send back usage
    data over the bus, but they use the API to communicate with other services. These
    two modes of communication are also available for integration. Just as we can
    provision resources using the REST API, we can track their progress using the
    message bus.'
  - "[PAGE 154]\n\nThe following code example uses the Kombu library in Python to\
    \ attach to the Nova queue on the message bus to listen for these RPC calls between\
    \ the various Nova services. First, we define a callback method to be used to\
    \ process events on the bus. This simple method just prints the body of the message:\n\
    \n```\nfrom kombu import Connection, Exchange, Queue\n\ndef process_message(body,\
    \ message):\n    print body\n    message.ack()\n```\n\nThen we create a queue\
    \ named listener and bind it to the nova exchange. In the following example, we're\
    \ going to subscribe to all messages on the nova queue:\n\n```\nnova_exchange\
    \ = Exchange('nova', 'topic', durable=False)\nnova_queue   = Queue('listener',\
    \ exchange = nova_exchange,\nrouting_key='#')\nconn = Connection('amqp://guest:guest@192.168.0.10//')\n\
    consumer = conn.Consumer(nova_queue, callbacks=[process_message])\nconsumer.consume()\n\
    ```\n\nNote that the connection string is specific to the deployment in question.\
    \ The username and password for the message bus should align with the settings\
    \ in /etc/nova/nova.conf.\n\nFinally, we'll check the queue for messages and process\
    \ them:\n\n```\nwhile True:\n    conn.drain_events()\n```\n\nRunning this example\
    \ will show just how chatty the Nova services are. The message format for these\
    \ RPC messages is well defined, but the content of the messages is version-specific.\
    \ For these reasons, most developers will choose to use the notification subsystem\
    \ instead.\n\n# Using the notification subsystem\n\nEach of the OpenStack services\
    \ can be configured to emit notifications on the message bus. These notifications\
    \ can then be picked up by messaging clients or by the Ceilometer service. Notifications\
    \ were originally implemented by each service separately, but the functionality\
    \ has been folded into the Oslo Messaging library as a common interface."
