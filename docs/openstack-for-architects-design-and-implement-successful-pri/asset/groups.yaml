    ## 集成平台


    我们合作过的一位 OpenStack 架构师喜欢说：“没有任何 OpenStack 实现是一座孤岛”。每个部署都会与其周围的传统 IT 基础设施集成，从身份管理系统到审计系统再到计费系统。OpenStack
    标准化的 API 使这些集成相对简单。本章将介绍 OpenStack 实现中可用的集成点以及许多常见的集成模式。


    在本章中，我们将详细探讨以下几点：


    - **身份管理（IdM）** 集成

    - 置备工作流

    - 计量和计费


    这三种不同的平台集成展示了 OpenStack 的三种主要集成模式。将 Keystone 与 Active Directory 等 IdM 系统集成是相对规范化的——正如
    Cinder 设计用于与存储阵列集成一样，Keystone 设计用于与 IdM 系统集成。Keystone 与 IdM 系统之间的契约主要隐藏在项目代码中。


    另外两种集成模式展示了与 OpenStack 系统进行外部交互的两种不同方式。外部置备工作流通过其 REST API 驱动 OpenStack 系统。它们要么直接与
    Neutron、Cinder、Nova 和 Glance API 交互，要么利用 Heat 编排 API 在 OpenStack 部署中创建、修改和删除对象。相比之下，计量、计费和审计系统通过与系统的输出交互来工作，它们要么监听
    OpenStack 消息总线上发生的事件，要么从 Event API 消费事件。


    ## IdM 集成


    在 2014 年的一篇博客文章中，OpenStack 开发者*内森·金德（Nathan Kinder）*著名地（且令人信服地）论证了 **Keystone
    不是身份认证服务**。在这篇文章中，Kinder 描述了将 `Keystone` 服务部署在 Apache HTTP 服务器之后、使用原生模块执行身份认证的部署模式。Kinder
    在文中提出了两个论点：


    - 大多数人在使用 OpenStack 时会使用某种外部身份认证系统

    - 参考身份认证系统（SQL 插件）不具备我们从身份认证服务所期望的任何功能


    我们自身的经验证明了这两个论点；我们合作的大多数组织所着手处理的第一个集成就是 IdM 服务的集成。


    ## OpenStack 中的身份认证与授权


    了解 OpenStack 中的身份认证和授权机制是很有帮助的。每次对 OpenStack API 服务的调用都通过一个 bearer token 进行授权，该
    token 由 `Keystone` 服务获取并验证。下图总结了这一交互过程：


    ![](img/2f752555f69992669defa8b25e6dcee9_141_0.png)


