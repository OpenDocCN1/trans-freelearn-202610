  \n因此，正如你所见，创建和编译 TypeScript 应用程序与创建基本的 JavaScript 应用程序一样简单。然而，随着你开发的应用程序规模和复杂性不断增长，从命令行运行编译器将会变得繁琐。因此，让我们了解一下如何在\
