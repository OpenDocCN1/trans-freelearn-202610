  ## 作者简介


  **Christopher Nance** 是一位经验丰富的软件工程师，从事富 Web 应用程序开发已超过 4 年。在 KnowledgeLake，他采用 TypeScript
  开发了一系列可重用组件，以扩展到多个产品和平台。


  我想感谢我的父母一直以来的支持和鼓励。我还要感谢 KnowledgeLake 的团队，他们推动我不断提高作为一名工程师的技能。


  ## 审稿人简介


  **Andrea Martinelli** 是一位充满热情的软件开发人员，目前正在开发 Shaman.IO——一款自动检测并从 Web 提取结构化数据的工具。


  过去，他曾开发过 Songr，一款音乐播放器和聚合器。他的兴趣涵盖 Web 数据提取、代码性能以及静态类型语言。他是一名熟练的 C# 开发人员，自 TypeScript
  首次发布以来就对其产生了兴趣。他毕业于特伦托大学计算机科学专业，之后在丹麦技术大学学习，尽管他现在在欧洲各地奔波的同时，将更多时间投入到了 Shaman.IO
  项目上。


  我想感谢我的朋友们，尤其是 Gianluca 和 Stefano，他们一直非常支持我。我还要感谢 Filz 教授，他是我高中时最有影响力的老师之一。也要感谢 Mads，一个我永远不会忘记的特别的人。以及我的家人，我已经很久没有见到他们了。


  **Nathan Rozentals** 撰写商业软件已超过 23 年，从大型机上的 COBOL 起步，历经 C、C++ 和 Java，最终专注于 C# 和 ASP.NET。


  他在 2012 年 10 月——即 0.8.0 版本发布后的第二天——接触到了 TypeScript，并从此爱不释手。在 TypeScript 中，他找到了一种语言，可以把他多年来在各种语言中学到的所有设计模式和实践带到
  JavaScript 中。


  在 0.8.0 版本发布大约 6 天后，他开始撰写关于 TypeScript 的博客；内容涵盖多种主题，包括单元测试、实现 IoC 容器，以及使用 AMD 模块组织代码。当微软自己开始在
  CodePlex 讨论论坛中引用他的博客时，他知道自己成功了。


  你可以在 http://blorkfish.wordpress.com 找到他的博客。


  他目前从事医疗行业，为医疗系统带来触摸屏界面，从而让临床医生和医院工作人员能够自带设备（BYOD）。


  他对代码质量、单元测试和持续集成充满热情，并帮助许多大型团队在多种不同语言的不同软件项目中实施 CI。


  他不写代码时，喜欢风帆冲浪和踢足球。他也是利物浦足球俱乐部的忠实支持者。


  我想感谢我的伴侣 Kathy，感谢她无尽的爱和支持，并给了我自由，让我可以长时间投入到自己热爱的事情中。你是最好的。


  致 Ayron 和 Dayna——你们永远在我心中——你们对生活的热情和好奇心给了我如此多的灵感。我会永远在你们身边。


  **Basarat Ali Syed**（BAS）是澳大利亚墨尔本 Picnic Software（http://picnicsoftware.com/）的高级开发人员，是前端问题的资深专家。他拥有澳大利亚国立大学的计算学硕士学位，并以高成绩毕业于所有课程。他是澳大利亚开发者聚会和会议上的常客，并曾在
  ALT.NET、DDD Melbourne、MelbJS 和 Node.js meetup 等活动中发表演讲。他对 Web 技术充满热情。他是 TypeScript
  社区的知名成员，并在 DefinitelyTyped 团队工作（https://github.com/DefinitelyTyped）。业余时间，他喜欢健美、骑自行车，并维护着一个帮助同行开发者的
  YouTube 频道（http://youtube.com/basaratali）。你可以轻松地在 Twitter @basarat、www.github.com/basarat
  和 www.basarat.com 上找到他。


