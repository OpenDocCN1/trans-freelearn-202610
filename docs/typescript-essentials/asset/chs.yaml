  \n我们也有能力更改生成的 JavaScript 的输出路径。这使我们能够在成功编译后直接将更改推送到测试环境，而无需关闭站点或手动将文件复制到部署位置。输出部分中的最后一个选项非常有趣。选中\
  \ Generate declaration files 选项将为你创建的每个类型创建声明文件。然后其他 TypeScript 文件可以引用这些声明文件以提供特定类型对象的类型定义。我们将在本书后面更深入地讨论声明文件。\n\
  \n最后一部分与我们希望如何调试 TypeScript 代码有关。我们有能力生成源映射以及它们应该部署到的目录。源映射为调试合并和压缩的 JavaScript\
  \ 代码提供了一种方式。当调试已推送到生产环境的代码时，它们特别有帮助，因为它们创建了一种使 JavaScript 可读的方式，然而，在 TypeScript\
  \ 中，它们也为我们提供了一种返回原始 TypeScript 代码的方式。最后一个选项指定 TypeScript 文件的位置；这将允许直接从 Visual Studio\
  \ 进行调试。在大多数情况下，此处的默认选项就足够了。\n\n\n\n\n\n## 摘要\n\n本章所学内容将成为我们继续深入 TypeScript 之旅的基础。我们讨论了\
  \ TypeScript 以多种方式改进 JavaScript 开发模型。TypeScript 通过增加静态类型系统和代码补全，使大规模应用程序开发变得更容易。Visual\
