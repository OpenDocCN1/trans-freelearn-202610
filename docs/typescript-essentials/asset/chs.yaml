  }\n```\n\n现在，我们可以运行应用程序，DrawingModel 中的形状就可以根据用户的意愿在画布上移动和调整大小。接下来我们要做的是允许用户创建新形状，因为如果只能与屏幕上已有的形状互动，那它就算不上什么绘图应用程序了。\n\
  \n\n\n\n## 用户选项\n\n我们现在已经拥有了一套可复用的形状类型、一套包含对形状引用绘图类型、一个控制执行流程的引擎，以及一个用于跟踪和管理绘图对象的对象。我们唯一缺少的就是用于操纵所执行操作的用户选项。在本节中，我们将修改原始的\
