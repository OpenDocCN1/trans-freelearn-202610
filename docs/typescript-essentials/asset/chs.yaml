- "# 第 2 章 TypeScript 基础\n\n编译语言的主要好处之一是，它们在代码最终转换为机器代码之前，为开发人员提供更简洁的语法供其使用。TypeScript\
  \ 能够通过将几种不同的模式封装到语言结构中，将这一优势带到 JavaScript 开发中，从而让我们编写更好的代码。我们已经谈到了一点 TypeScript\
  \ 在 JavaScript 之上添加的静态类型系统。提供的每个显式类型注解都只是会在编译期间被移除的语法糖，但在其约束被分析和任何错误被捕获之前不会被移除。在本章中，我们将深入探讨该类型系统。我们还将讨论\
  \ TypeScript 引入的不同语言结构。我们将查看这些结构如何由编译器编译为纯 JavaScript。本章将对以下每个概念进行详细阐述：\n\n- Types\n\
  - Functions\n- Interfaces\n- Classes\n- Enums\n- Modules\n- Generic types\n\n###\
  \ Types\n\n在第 1 章《开始使用 TypeScript》中，我们编写了第一个 TypeScript 应用程序并简要浏览了静态类型系统。创建了两个变量并为其提供了静态类型注解，将其声明为字符串对象。这些类型注解对正在创建的变量施加了一组特定的约束。这些约束允许编译器和开发工具更好地协助正确使用对象。这包括对象上可用的函数、变量和属性列表。如果创建变量时未提供类型，TypeScript\
  \ 将尝试从其使用的上下文中推断类型。例如，在以下代码中，我们没有显式声明变量 hello 为 string；然而，由于它是用初始值创建的，TypeScript\
  \ 能够推断它应始终被视为字符串：\n\n```typescript\nvar hello = \"Hello There\";\n```\n\nTypeScript\
  \ 具有这种上下文类型化的能力，为开发工具提供了以多种方式增强开发体验的能力。类型信息允许我们的 IDE 警告我们代码中的潜在错误，或提供智能代码补全和建议。正如以下屏幕截图所示，Visual\
  \ Studio 能够提供与字符串对象相关的方法和属性列表以及其类型信息：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_62_0.png)\n\
  \n当对象的类型未给出并且无法从其初始化中推断时，它将被视为 Any 类型。Any 类型是 TypeScript 中所有其他类型的基础类型。它可以表示任何 JavaScript\
  \ 值，并且对 Any 类型的对象执行的类型检查最少。TypeScript 中存在的每种其他类型都属于以下三类之一：原始类型、对象类型或类型参数。TypeScript\
  \ 的原始类型与 JavaScript 的非常相似。\n\nTypeScript 的原始类型如下：\n\n- **Number:** `var myNum: number\
  \ = 2;`\n- **Boolean:** `var myBool: boolean = true;`\n- **String:** `var myString:\
  \ string = \"Hello\";`\n- **Void:** `function(): void { var x = 2; }`\n- **Null:**\
  \ `if (x != null) { alert(x); }`\n- **Undefined:** `if (x != undefined) { alert(x);\
  \ }`\n\n所有这些类型都直接对应于 JavaScript 的原始类型，除了 void。void 类型用于表示值的缺失。返回无值的函数返回类型为 void。对象类型是你将在\
  \ TypeScript 中看到的最常见的类型，它们由对类、接口和匿名对象类型的引用组成。对象类型由一组复杂的成员组成。这些成员属于以下四类之一：属性、调用签名、构造函数签名或索引签名。本章后面，我们将开始使用\
  \ TypeScript 中的不同语言实体创建不同的对象类型。\n\n类型参数用于引用泛型类型或调用泛型函数。类型参数用于使代码足够通用以用于多种对象，同时将这些对象限制为特定的一组约束。我们可以介绍的泛型的一个早期示例是数组。数组的存在方式与\
  \ JavaScript 中的相同，并且在其上放置了一组额外的类型约束。数组对象本身具有某些类型约束和方法，这些是作为 Array 类型的对象创建的，数组声明带来的第二条信息是数组中包含的对象的类型。有两种方法可以显式为数组键入类型；否则，上下文类型系统将尝试推断类型信息：\n\
  \n```typescript\nvar array1: string[] = [];\nvar array2: Array<string> = [];\n```\n\
  \n这两种示例都是声明数组的完全合法方式。它们都生成相同的 JavaScript 输出，并且都提供相同的类型信息。第一个示例是使用 [ 和 ] 字符创建数组的简写类型文字。每个数组的结果\
  \ JavaScript 如下所示：\n\n```typescript\nvar array1 = [];\nvar array2 = [];\n```\n\n\
  尽管有所有类型注解和编译时检查，TypeScript 编译为纯 JavaScript，因此对应用程序的运行时速度完全不产生开销。所有类型注解都从最终代码中移除，为我们提供了更丰富的开发体验和干净的最终产品。\n\
  \n### Functions\n\n如果你对 JavaScript 非常熟悉，你将非常熟悉函数的概念。TypeScript 已向参数列表以及返回类型添加了类型注解。由于对参数列表施加了新的约束，函数重载的概念也被包含在语言规范中。TypeScript\
  \ 还利用了 JavaScript 的 **arguments** 对象并提供了剩余参数的语法。让我们看一下 TypeScript 中的函数声明：\n\n```typescript\n\
  function add(x: number, y: number): number {\n    return x + y;\n}\n```\n\n正如你所见，我们创建了一个名为\
  \ add 的函数。它接受两个参数，两者都是 number 类型，即原始类型之一，并返回一个 number。该函数在其当前形式下很有用，但整体功能有点受限。如果我们想将第三个数字加到前两个数字上呢？那么我们必须多次调用函数。TypeScript\
  \ 提供了向函数提供可选参数的方法。因此，我们现在可以修改函数以接受第三个参数 z，将其添加到前两个数字中，如下代码所示：\n\n```typescript\n\
  function add(x: number, y: number, z?: number) {\n    if (z !== undefined) {\n \
  \       return x + y + z;\n    }\n    return x + y;\n}\n```\n\n正如你所见，我们现在有一个第三个命名参数，但它后面跟着\
  \ ?。这告诉编译器此参数不是调用函数所必需的。\n\n### 提示\n\n可选参数告诉编译器如果在调用函数时未提供该参数，则不要生成错误。在 JavaScript\
  \ 中，此编译时检查不会执行，这意味着运行时可能发生异常，因为每个缺失的参数值都为 undefined。开发人员有责任编写代码以在尝试使用它之前验证值是否存在。\n\
  \n因此，我们现在可以把三个数字加在一起，并且我们没有破坏任何依赖于 add 方法仅接受两个参数的先前代码。这增加了一些功能，但我认为将此代码扩展为操作多种类型会更好。我们知道字符串可以像数字一样相加，那么为什么不使用相同的方法呢？在其当前形式下，向\
  \ add 函数传递字符串将导致编译错误。我们将修改函数的定义，使其不仅接受数字，还接受字符串，如下代码所示：\n\n```typescript\nfunction\
  \ add(x: string, y: string): string;\nfunction add(x: number, y: number): number;\n\
  function add(x: any, y: any): any {\n```\n\n\n\n```\n    return x + y;\n}\n```\n\
  \n正如你所见，现在我们有 add 函数的两个声明：一个用于字符串，一个用于数字，然后我们还有使用 any 类型的最终实现。然而，实际函数实现的签名并不包含在函数的类型定义中。尝试用数字或字符串之外的任何类型调用我们的\
  \ add 方法都会在编译时报错，但重载对生成的 JavaScript 没有任何影响。所有类型注解以及重载都会被剥离，我们最终得到的只是一个非常简单的 JavaScript\
  \ 方法：\n\n```\nfunction add(x, y) {\n    return x + y;\n}\n```\n\n太好了，现在我们有了一个多用途的\
  \ add 函数，它可以接收两个值并将它们组合起来，无论是字符串还是数字。但这在整体功能上仍然显得有些局限。如果我们想把不定数量的值加在一起呢？我们将不得不反复调用我们的\
  \ add 方法，直到最终只有一个值。值得庆幸的是，TypeScript 提供了剩余参数，它本质上是一个无限制的可选参数列表。\n\n以下代码展示了如何修改我们的\
  \ add 函数以包含一个剩余参数：\n\n```\nfunction add(arg1: string, ...args: string[]): string;\n\
  function add(arg1: number, ...args: number[]): number;\nfunction add(arg1: any,\
  \ ...args: any[]): any {\n    var total = arg1;\n    for (var i = 0; i < args.length;\
  \ i++) {\n        total += args[i];\n    }\n    return total;\n}\n```\n\n剩余参数只能是函数声明中的最后一个参数。TypeScript\
  \ 编译器会识别这个最终参数的语法，并生成额外的 JavaScript 代码，从函数内部可用的 arguments 对象创建一个移位数组。生成的 JavaScript\
  \ 代码展示了编译器添加的循环，该循环用于创建表示我们不定参数列表的数组：\n\n```\nfunction add(arg1) {\n    var args\
  \ = [];\n    for (var _i = 0; _i < (arguments.length - 1); _i++) {\n        args[_i]\
  \ = arguments[_i + 1];\n    }\n    var total = arg1;\n    for (var i = 0; i < args.length;\
  \ i++) {\n        total += args[i];\n    }\n    return total;\n}\n```\n\n现在，将数字和字符串相加变得非常简单，而且是完全类型安全的。如果试图混合不同的参数类型，将会出现编译错误。下面语句中的前两个是对我们的\
  \ Add 函数的合法调用；然而，第三个是非法的，因为传入的对象类型不一致：\n\n```\n```typescript\nalert(add(\"Hello\
  \ \", \"World!\"));\nalert(add(3, 5, 9, 120, 42));\n//Error\nalert(add(3, \"World!\"\
  ));\n```\n```\n\n我们对 TypeScript 的探索还处于早期阶段，但好处已经非常明显。函数中还有一些我们尚未涉及的特性，但我们需要先学习更多关于这门语言的知识。接下来，我们将讨论接口结构及其提供的好处，而这些好处完全无需额外成本。\n\
  \n## 接口\n\n接口是创建大规模软件应用程序的关键部分。它们是表示任何对象复杂类型的一种方式。尽管它们非常有用，但它们在运行时完全没有影响，因为 JavaScript\
  \ 不包含任何形式的运行时类型检查。接口在编译时被分析，然后从生成的 JavaScript 中省略。接口为开发者创建了一个契约，用于开发新对象或编写与现有对象交互的方法。接口是包含成员列表的命名类型。让我们看一个接口的示例：\n\
  \n```\ninterface IPoint {\n    x: number;\n    y: number;\n}\n```\n\n如你所见，我们使用 interface\
  \ 关键字来开始接口声明。然后我们给接口一个名字，以便从我们的代码中轻松引用。\n\n### 注意\n\n接口可以任意命名，例如 foo 或 bar，但一个简单的命名约定会提高代码的可读性。在本书中，接口将采用\
  \ I<name> 的格式，而对象类型将仅使用 <name>，例如 IFoo 和 Foo。\n\n接口的声明体仅包含成员、函数及其类型的列表。接口成员只能是对象的实例成员。在接口声明中使用\
  \ static 关键字将导致编译错误。\n\n接口能够从基类型继承。这种接口继承允许我们将现有接口扩展为更增强的版本，以及将多个独立的接口合并在一起。为了创建继承链，接口使用\
  \ extends 子句。extends 子句后面跟着一个逗号分隔的类型列表，该列表是接口将要合并的类型。\n\n```\ninterface IAdder {\n\
  \    add(arg1: number, ...args: number[]): number;\n}\ninterface ISubtractor {\n\
  \    subtract(arg1: number, ...args: number[]): number;\n}\ninterface ICalculator\
  \ extends IAdder, ISubtractor {\n    multiply(arg1: number, ...args: number[]):\
  \ number;\n    divide(arg1: number, arg2: number): number;\n}\n```\n\n在这里，我们看到了三个接口：\n\
  - IAdder，它定义了一个类型，该类型必须实现我们之前编写的 add 方法\n- ISubtractor，它定义了一个名为 subtract 的新方法，任何被声明为\
  \ ISubtractor 类型的对象都必须定义该方法\n- ICalculator，它同时扩展了 IAdder 和 ISubtractor，并定义了两个新方法，用于执行加法和减法器不会执行的、计算器应该负责的操作\n\
  \n这些接口现在可以在我们的代码中作为类型参数或类型声明被引用。接口不能直接被实例化，直接使用其类型名称来引用接口成员将导致错误。在下面的函数声明中，ICalculator\
  \ 接口用于限制可以传递给函数的对象类型。编译器现在可以检查函数体并推断与 calculator 参数关联的所有类型信息，如果使用的对象未实现此接口，则会警告我们。\n\
  \n```\nfunction performCalculations(calculator: ICalculator, num1, num2) {\n   \
  \ calculator.add(num1, num2);\n    calculator.subtract(num1, num2);\n    calculator.multiply(num1,\
  \ num2);\n    calculator.divide(num1, num2);\n    return true;\n}\n```\n\n关于接口定义，你需要知道的最后一点是，它们的声明是开放式的，如果它们具有相同的类型名称，将会隐式合并在一起。我们的\
  \ ICalculator 接口本可以拆分为两个独立的声明，每个声明添加自己的基类型列表和自己的成员列表。以下声明产生的类型定义与我们之前看到的声明是等价的：\n\
  \n```\ninterface ICalculator extends IAdder {\n    multiply(arg1: number, ...args:\
  \ number[]): number;\n}\ninterface ICalculator extends ISubtractor {\n    divide(arg1:\
  \ number, arg2: number): number;\n}\n```\n\n创建大规模应用程序需要灵活且可复用的代码。接口是保持 TypeScript\
  \ 像普通 JavaScript 一样灵活的关键组成部分，同时又让我们能够利用编译时提供的类型检查。你的代码不必依赖于现有的对象类型，并且可以随时准备应对可能引入的任何新对象类型。TypeScript\
  \ 编译器还实现了一个鸭子类型系统，允许我们在保持类型安全的同时动态创建对象。下面的示例展示了如何将未显式实现接口但包含所有必需成员的对象传递给函数：\n\n\
  ```\nfunction addPoints(p1: IPoint, p2: IPoint): IPoint {\n    var x = p1.x + p2.x;\n\
  \    var y = p1.y + p2.y;\n    return { x: x, y: y }\n}\n//Valid\nvar newPoint =\
  \ addPoints({ x: 3, y: 4 }, { x: 5, y: 1 });\n//Error\n```\n\n```\nvar newPoint2\
  \ = addPoints({ x: 1 }, { x: 4, y: 3 });\n```\n\n\n\n## 定义\n\n在 TypeScript 中创建类与创建接口本质上是相同的。让我们创建一个非常简单的\
  \ Point 类来为我们跟踪 x 和 y 位置：\n\n```\nclass Point {\n    public x: number;\n    public\
  \ y: number;\n    constructor(x: number, y = 0) {\n        this.x = x;\n       \
  \ this.y = y;\n    }\n}\n```\n\n正如你所见，定义一个类非常简单。使用关键字 class 然后为新类型提供一个名称。然后你为对象创建一个构造函数，可以在创建时提供任何你想要的参数。我们的\
  \ Point 类需要两个值来表示平面上的位置。\n\n### 提示\n\n构造函数是完全可选的。如果没有提供构造函数实现，编译器将自动生成一个不带参数并初始化任何实例成员的构造函数。\n\
  \n我们为属性 y 提供了一个默认值。此默认值告诉编译器生成比仅给出类型时更多的 JavaScript 语句。这也允许 TypeScript 将具有默认值的参数视为可选参数。如果未提供参数，则参数的值将被分配给你提供的默认值。这提供了一种确保你始终在操作已实例化对象的方法。最好的部分是默认值适用于所有函数，而不仅仅是构造函数。现在让我们检查\
  \ Point 类的 JavaScript 输出：\n\n```\nvar Point = (function () {\n    function Point(x,\
  \ y) {\n        if (typeof y === \"undefined\") { y = 0; }\n        this.x = x;\n\
  \        this.y = y;\n    }\n    return Point;\n})();\n```\n\n正如你所见，一个新对象被创建并分配给一个匿名函数，该函数初始化\
  \ Point 类的定义。正如我们稍后将看到的，任何公共方法或静态成员都将被添加到内部 Point 函数的原型上。JavaScript 闭包是理解 TypeScript\
  \ 的一个非常重要的概念。TypeScript 中的类、模块和枚举都编译为 JavaScript 闭包。闭包实际上是 JavaScript 语言的一种构造，它提供了一种为代码的特定段创建私有状态的方法。当创建闭包时它包含两件事：一个函数，以及函数创建时的环境状态。该函数返回给闭包的调用者，而状态在函数被调用时使用。\n\
  \n## 接口\n\n让我们稍后再回到我们对接口的讨论，看看它们如何与类交互。在下一个示例中，我们将强制 `IPoint` 接口作用于 `Point` 类。类可以使用\
  \ `implements` 关键字可选地从接口继承类型信息。然后类将被要求实现接口的所有成员；否则，将发生编译错误：\n\n```\n```typescript\n\
  interface IPoint {\n    x: number;\n    y: number;\n}\nclass Point implements IPoint\
  \ {\n    constructor(public x: number, public y = 0) {\n    }\n}\n```\n```\n\n正如我们之前讨论的，接口纯粹是编译时构造。从此示例输出的\
  \ JavaScript 与我们刚才看到的 JavaScript 完全相同。我还偷偷加入了一种定义类上实例变量的简写方法。用 public 或 private\
  \ 关键字装饰构造函数的参数会告诉 TypeScript 将这些对象视为类型的一部分而不是仅仅是初始化参数。\n\n类不限于实现单个接口。在 `implements`\
  \ 关键字之后提供以逗号分隔的接口列表允许你的类提供多种不同契约的实现。让我们通过实现第二个接口使我们的 `Point` 类更有用，如下所示：\n\n```\n\
  ```typescript\ninterface IPoint {\n    x: number;\n    y: number;\n}\ninterface\
  \ ICompare {\n    Compare(p2: IPoint): number;\n}\nclass Point implements IPoint,\
  \ ICompare {\n    public x: number;\n    public y: number;\n    constructor(x: number,\
  \ y = 0) {\n        this.x = x;\n        this.y = y;\n    }\n    public Compare(p2:\
  \ IPoint): number {\n        var p1Val = this.x * this.x + this.y * this.y;\n  \
  \      var p2Val = p2.x * p2.x + p2.y * p2.y;\n        var result = p1Val - p2Val;\n\
  \        if (result == 0) {\n            return 0;\n        } else if (result >\
  \ 0) {\n            return 1;\n        } else {\n            return -1;\n      \
  \  }\n```\n```\n\n能够在我们的类上强制执行多个接口为我们提供了在多种不同上下文中使用对象的能力。保持我们的接口简单使它们在我们的应用程序中更具可重用性。我们本可以很容易地将\
  \ Compare 方法放在 IPoint 接口上并达到相同的效果。然而，正如我们稍后将看到的，经过一些调整，任何数量的类型都可以实现 ICompare 接口，而它们不需要\
  \ x 和 y 成员。在这种情况下，Compare 方法确定每个点与原点的距离并返回一个表示哪个点更远的数字。如果执行比较的对象更远，则返回正值。如果作为参数传递的点更远，则返回负值。如果两个点与原点的距离相等，则返回零值。\n\
  \n## 静态和实例成员\n\nx 和 y 都是类 Point 的实例成员；这意味着必须实例化该类型的对象才能引用它们。当调用构造函数时，值会被分配给正在创建的对象实例的属性。这些值可以是在构造函数函数内创建的新对象，也可以是作为构造函数参数传入的对象的引用。这对于某些成员来说是件好事，然而，还有其他类成员你可能希望在未创建对象时也能访问。TypeScript\
  \ 通过静态成员提供了这种能力。静态成员可以通过引用命名类型随时访问。要声明静态成员，只需用 static 关键字装饰它即可：\n\n```\nclass Point\
  \ implements IPoint, ICompare {\n    public x: number;\n    public y: number;\n\
  \    constructor(x: number, y = 0) {\n        this.x = x;\n        this.y = y;\n\
  \    }\n    public Compare(p2: IPoint): number {\n        var p1Val = this.x * this.x\
  \ + this.y * this.y;\n        var p2Val = p2.x * p2.x + p2.y * p2.y;\n        var\
  \ result = p1Val - p2Val;\n        if (result == 0) {\n            return 0;\n \
  \       } else if (result > 0) {\n            return 1;\n        } else {\n    \
  \        return -1;\n        }\n    }\n    static Compare(p1: Point, p2: Point):\
  \ number {\n        return p1.Compare(p2);\n    }\n}\n```\n\n前面的 Compare 方法接收两个\
  \ Point 对象并比较它们与原点的距离以确定哪个更大。此类成员的 JavaScript 输出与在构造函数中创建的 x 和 y 属性大不相同。以下输出显示 Compare\
  \ 方法被直接放在正在创建的 Point 对象上：\n\n```\nvar Point = (function () {\n    function Point(x,\
  \ y) {\n        if (typeof y === \"undefined\") { y = 0; }\n        this.x = x;\n\
  \        this.y = y;\n    }\n    Point.prototype.Compare = function (p2) {\n   \
  \     var p1Val = this.x * this.x + this.y * this.y;\n        var p2Val = p2.x *\
  \ p2.x + p2.y * p2.y;\n        var result = p1Val - p2Val;\n```\n\n```\n```typescript\n\
  if (result == 0) {\n    return 0;\n} else if (result > 0) {\n    return 1;\n} else\
  \ {\n    return -1;\n}\n};\nPoint.Compare = function (p1, p2) {\n    return p1.Compare(p2);\n\
  };\nreturn Point;\n})();\n```\n\n我们还没有讨论 TypeScript 类的最重要部分之一，那就是实例成员函数。这些函数仅对该类型的对象实例可用，并且它们可以访问\
  \ `this` 对象，从而可以轻松访问对象的所有成员。在 JavaScript 中，有几种方法可以创建实例成员函数。它们可以在对象创建期间使用 `this`\
  \ 对象直接添加到对象上，或者可以附加到对象的原型上。两者各有利弊，但通常最好将函数放在原型上而不是分配给类的每个新实例。放在静态原型上的函数实例会被反复重用，而不是随着类型的每个新实例而重新创建。这有助于减少内存消耗，并且随着应用程序的增长会提高性能。TypeScript\
  \ 采用了这种将方法附加到对象实例的方法。\n\n让我们创建一个表示平面上对象的类型。它将有三个属性：`Height`、`Width` 和 `Location`。还将有一个实例成员函数来确定对象在平面上的大小。`Location`\
  \ 成员将是我们刚刚创建的 `Point` 类型：\n\n```\n```typescript\ninterface IBounds {\n    Location:\
  \ IPoint;\n    Height: number;\n    Width: number;\n    Size(): number;\n}\nclass\
  \ Bounds implements IBounds {\n    public Location: IPoint = new Point(0, 0);\n\
  \    public Height: number = 0;\n    public Width: number = 0;\n    public Size()\
  \ {\n        return this.Height * this.Width;\n    }\n}\n```\n```\n\n正如你所见，这个类不包含显式构造函数；然而，所有属性都已初始化，并且在创建类型实例时将可供使用。正如你从生成的\
  \ JavaScript 中看到的，Size 方法被放在 Bounds 对象的静态原型成员上，并且创建了一个无参数的构造函数，其中所有实例成员都被初始化：\n\n\
  \n```javascript\nvar Bounds = (function () {\n    function Bounds() {\n        this.Location\
  \ = new Point(0, 0);\n        this.Height = 0;\n        this.Width = 0;\n    }\n\
  \    Bounds.prototype.Size = function () {\n        return this.Height * this.Width;\n\
  \    };\n    return Bounds;\n})();\n```\n\n## 属性\n\n在 ECMAScript 5 中，引入了属性的概念。这使得开发人员可以为指定的实例方法创建\
  \ getter 和 setter 方法，而这些方法可以像属性一样被访问。如果你的 TypeScript 项目设置为编译 ECMAScript 5，那么你将能够使用\
  \ `get` 和 `set` 关键字来按照 ECMAScript 5 语言规范定义属性。ECMAScript 版本可以在项目属性的 TypeScript 构建部分的常规设置中更改，如下面的截图所示：\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_82_0.png)\n\n让我们修改我们的 bounds 类，将 `Height`\
  \ 和 `Width` 都视为对象属性，而不是简单的实例成员，并为它们创建 getter 和 setter 方法。getter 和 setter 也会修改私有实例成员，这些成员将维护实际值。在\
  \ JavaScript 中，通常做法是用下划线作为私有实例成员的前缀，因此我们将为 Bounds 类创建 `_height` 和 `_width` 实例成员以便在内部访问。\n\
  \n既然我们现在有了一个可以执行某些代码的方法块，还应该提供一些值检查，以确保程序正确执行。对象的高度和宽度不应小于零，因此让我们验证分配给它们的值是否符合这一约束；如果不满足，我们将手动将该值设置为零：\n\
  \n```\ninterface IBounds {\n    Location: IPoint;\n    Height: number;\n    Width:\
  \ number;\n    Size(): number;\n}\nclass Bounds implements IBounds {\n    public\
  \ Location: IPoint = new Point(0, 0);\n    private _height: number = 0;\n    private\
  \ _width: number = 0;\n    public Size() {\n        return this.Height * this.Width;\n\
  \    }\n\n    get Height(): number {\n        return this._height;\n    }\n    set\
  \ Height(value: number) {\n        this._height = (value > 0) ? value : 0;\n   \
  \ }\n```\n\n```\n```javascript\nget Width(): number {\n    return this._width;\n\
  }\nset Width(value: number) {\n    this._width = (value > 0) ? value : 0;\n}\n}\n\
  ```\n```\n\n正如你所看到的，现在我们已经有了方法块来包裹对 `Height` 和 `Width` 属性的访问。这些属性仍然像实例变量一样被访问，正如你在\
  \ `Size` 方法中看到的那样，但当我们访问它们时，我们的函数块会被执行。生成的 JavaScript 在创建类型时调用 `Object.defineProperty`\
  \ 方法，这已概述在 ECMAScript 5 标准中。\n\n### 注意\n\n虽然 ECMAScript 5 标准已被大多数浏览器广泛采用，但需要注意的是，在某些浏览器中仍然存在功能支持上的不足。以下链接中的表格概述了当前对\
  \ ECMAScript 5 标准的支持情况：[http://kangax.github.io/compat-table/es5/](http://kangax.github.io/compat-table/es5/)。\n\
  \n这会在原型上放置一个新对象，该对象可在该类型的所有实例上访问。以下 JavaScript 是在 TypeScript 中定义 getter 和 setter\
  \ 所生成的代码：\n\n```\n```javascript\nvar Bounds = (function () {\n    function Bounds()\
  \ {\n        this.Location = new Point(0, 0);\n        this._height = 0;\n     \
  \   this._width = 0;\n    }\n    Bounds.prototype.Size = function () {\n       \
  \ return this.Height * this.Width;\n    };\n\n    Object.defineProperty(Bounds.prototype,\
  \ \"Height\", {\n        get: function () {\n            return this._height;\n\
  \        },\n        set: function (value) {\n            this._height = (value\
  \ > 0) ? value : 0;\n        },\n        enumerable: true,\n        configurable:\
  \ true\n    });\n\n    Object.defineProperty(Bounds.prototype, \"Width\", {\n  \
  \      get: function () {\n            return this._width;\n        },\n       \
  \ set: function (value) {\n            this._width = (value > 0) ? value : 0;\n\
  \        },\n```\n\n```\nenumerable: true,\n    configurable: true\n});\n    return\
  \ Bounds;\n})();\n```\n\n在这段输出中还有其他一些值得注意的地方。我们创建了新的私有变量来存储属性声明所暴露的值。这些私有变量在构造函数中被添加到对象的每个实例上。这看起来有点奇怪，因为我们知道闭包可以为类的每个实例存储私有状态。私有变量需要添加到每个实例的原因是函数和属性都被附加到类的原型上。原型不会保留闭包的状态，而是依赖实际对象实例来访问其成员。\n\
  \n在转换为属性之后，`IBounds` 接口仍然得到支持。创建类实例后产生的类型信息只需要与接口的类型信息匹配即可通过编译。这里不区分是实例成员还是属性声明，因为它们都以相同的方式被访问。\n\
  \n在很短的时间内，我们已经涵盖了很多内容。类是 TypeScript 引入的最重要的概念之一，它帮助 JavaScript 转变为企业级开发平台。我们还有很多概念要介绍，包括枚举。\n\
  \n## 枚举\n\n枚举是一种有用的实体，用于保存特定值，通过友好的名称引用它，以保持代码的可读性。枚举值只不过是与命名常量关联的整数。枚举的声明非常简单，然而，有趣的是它们在\
  \ JavaScript 中的生成结果。首先，让我们看一个枚举声明，然后我们再来讨论其结果：\n\n```\n```typescript\nenum ShapeType\
  \ {\n    Rectangle,\n    Circle,\n    Line,\n    Freehand\n}\n```\n```\n\n枚举类型的声明需要指定用于引用枚举的类型名称，然后函数体只是用逗号分隔的可能取值列表。从\
  \ TypeScript 的角度来看，这里没有什么特别之处。你可以像访问类的静态成员一样访问枚举值：ShapeType.Rectangle。不过，正如我之前所说，TypeScript\
  \ 中枚举的真正神奇之处在于它们在 JavaScript 中的生成方式，所以让我们看一下我们枚举的输出：\n\n```\n```javascript\nvar\
  \ ShapeType;\n(function (ShapeType) {\n    ShapeType[ShapeType[\"Rectangle\"] =\
  \ 0] = \"Rectangle\";\n    ShapeType[ShapeType[\"Circle\"] = 1] = \"Circle\";\n\
  \    ShapeType[ShapeType[\"Line\"] = 2] = \"Line\";\n    ShapeType[ShapeType[\"\
  Freehand\"] = 3] = \"Freehand\";\n})(ShapeType || (ShapeType = {}));\n```\n```\n\
  \n这里有相当多的 JavaScript 代码，却只是用来表示像数字映射这样简单的东西。然而，如果你更深入地观察，就会发现 TypeScript 正在创建命名常量与其映射到的数字之间的双向映射。这创造了许多有趣的访问枚举值的方式。看看下面的代码片段，思考一下输出可能是什么：\n\
  \n```\n```javascript\nalert(ShapeType[ShapeType.Rectangle]);\n```\n```\n\nShapeType\
  \ 是在一个匿名函数内部创建的，该函数返回一个对象，这个对象为枚举的每个成员都赋予了这两个属性。利用 JavaScript 的动态类型系统，TypeScript\
  \ 添加了一个属性，其值为成员名称的字符串形式，并将其映射到一个整数值。然后，该整数值同时作为 ShapeType 对象的一个属性添加，并映射到命名成员的字符串值。所以，如果你认为之前返回的值是命名成员的字符串表示，那么你是对的！\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_87_0.png)\n\n既然我们已经熟悉了枚举的工作原理，接下来让我们再看看枚举的各个成员。我们知道枚举表示数字和字符串之间的双向映射，那么这个数字从哪里来呢？在\
  \ ShapeType 示例中，我们刚看到每个成员都只是被赋予了一个名称，数字是由编译器生成的。这很好用，它创建了一组顺序的数字供我们访问，但如果能对这些值有更多的控制就更好了。因此，TypeScript\
  \ 提供了两种可创建的枚举成员：常量成员（constant members）和计算成员（computed members）。我们之前看到的所有成员都是带有自动生成常量值的常量成员。除非为某个成员提供了常量值，否则这些数字从零开始按顺序排列。然后，枚举中所有后续成员都将与给定的数字保持连续。\n\
  \n计算成员仍然是命名常量，但它们映射到的整数值由表达式提供。这个表达式可以是内联表达式，也可以是对另一段代码的函数调用。你提供的表达式的唯一要求是它必须返回一个数字。正如你在下面的代码片段中所见，我们修改了之前的枚举\
  \ ShapeType，以生成一些特定的索引，并创建了一个计算成员：\n\n```\nfunction GetEnumValue(): number {\n \
  \   return Date.now();\n}\nenum ShapeType {\n    Rectangle = 3,\n    Circle,\n \
  \   Line,\n    Freehand,\n    Random = GetEnumValue()\n}\n```\n\n正如你所看到的，我们创建了一个函数，利用\
  \ JavaScript 中可用的全局 Date 对象返回一个表示当前时间的整数。我们还把第一个常量成员设置为我们选择的整数值。当编译器解析这段代码时，枚举中的所有成员都将从这个值开始按顺序递增。现在让我们看看生成的\
  \ JavaScript，以及计算成员在运行时的样子：\n\n```\nfunction GetEnumValue() {\n    return Date.now();\n\
  }\nvar ShapeType;\n(function (ShapeType) {\n```\n\n\n\n\n```\nShapeType[ShapeType[\"\
  Rectangle\"] = 3] = \"Rectangle\";\nShapeType[ShapeType[\"Circle\"] = 4] = \"Circle\"\
  ;\nShapeType[ShapeType[\"Line\"] = 5] = \"Line\";\nShapeType[ShapeType[\"Freehand\"\
  ] = 6] = \"Freehand\";\nShapeType[ShapeType[\"Random\"] = GetEnumValue()] = \"Random\"\
  ;\n})(ShapeType || (ShapeType = {}));\n```\n\n如你所见，提供给计算成员的表达式被直接构建到生成的枚举声明中。该表达式将在运行时计算，但仅在\
  \ ShapeType 初始化时执行。一旦表达式运行完毕，其结果将保留为 ShapeType 对象的成员。因此，在前面的示例中，只要 ShapeType 枚举驻留在内存中，ShapeType.Random\
  \ 就等价于 ShapeType[\"Random\"]。现在你可能会想，能够改变常量成员的数值序列有什么用处呢？\n\n到目前为止，关于枚举我们还没有涉及的一点是，枚举定义可以被合并。如果将两个枚举声明放在代码的不同片段中并使用相同的类型名称，它们将作用于同一个对象。你可以在生成的\
  \ JavaScript 中枚举声明的最后一行看到这一点。如果该对象已存在，则每个新属性都会被添加到已有对象上；否则，会创建一个新对象并应用这些属性。\n\n\
  ## 模块\n\n模块模式在 JavaScript 开发中变得越来越流行。它提供了一种简单的方法来封装私有成员（这是 JavaScript 本身不具备的能力），并将对象隔离在全局命名空间之外。在\
  \ TypeScript 中有两种类型的模块：**内部模块**和**外部模块**。我们稍后会详细讨论它们，但暂时先只谈内部模块。\n\n现在我们有一个内部模块，它包含两个可访问的命名类型：ShapeType\
  \ 枚举和 Shape 类，以及一个不可访问的变量 origin，该变量属于模块的隔离状态。尽管我们未必需要访问 ShapeType 枚举，但它仍然必须被导出，否则代码无法编译。任何在另一个成员定义中使用的命名类型，都必须具有与该成员相同的可访问性。如果不能满足这一要求，编译将失败。访问这些类型的方式是先提供模块名称，然后是你要访问的类型。在下面的示例中，你可以看到我们创建一个新的\
  \ Shape 对象并设置其类型：\n\n```\nvar shape = new Shapes.Shape();\nshape.Type = Shapes.ShapeType.Circle;\n\
  ```\n\n为这个模块生成的 JavaScript 看起来与为枚举类型生成的代码非常相似。模块的所有成员都被包裹在一个闭包中，该闭包在模块加载时运行。每个导出的类型都被放置到传递给闭包的实例变量上，以便任何访问模块的人都能使用。模块也拥有与枚举相同的合并能力。这意味着你可以将代码拆分为多个文件，并在运行时将它们合并为一个对象。这种模块实现的一个缺点是无法为模块创建接口。然而，能够以你选择的任何方式组织代码，比接口能为模块带来的任何功能都更有价值。下面你可以看到\
  \ TypeScript 为定义模块而生成的 JavaScript：\n\n```\nvar Shapes;\n(function (Shapes) {\n \
  \   var origin = new Point(0, 0);\n    (function (ShapeType) {\n        ShapeType[ShapeType[\"\
  Rectangle\"] = 3] = \"Rectangle\";\n        ShapeType[ShapeType[\"Circle\"] = 4]\
  \ = \"Circle\";\n        ShapeType[ShapeType[\"Line\"] = 5] = \"Line\";\n      \
  \  ShapeType[ShapeType[\"Freehand\"] = 6] = \"Freehand\";\n    })(Shapes.ShapeType\
  \ || (Shapes.ShapeType = {}));\n    var ShapeType = Shapes.ShapeType;\n    var Shape\
  \ = (function () {\n        function Shape() {\n            this.Type = 3 /* Rectangle\
  \ */;\n            this.Bounds = new Bounds();\n            this.Bounds.Location\
  \ = origin;\n        }\n        return Shape;\n    })();\n    Shapes.Shape = Shape;\n\
  })(Shapes || (Shapes = {}));\n```\n\n到目前为止，我们只看到了一个模块的小示例，但不妨想象一下构建一个包含大量对象类型的大型应用程序。你会希望创建命名空间来组织代码，并在互不相关的代码段之间建立一层隔离。在\
  \ TypeScript 中有两种提供模块命名空间的方式：可以将模块相互嵌套，也可以将它们作为模块声明的一部分来定义。\n\n让我们来看看定义命名空间和创建模块定义的一些不同方式。\n\
  \n```typescript\nmodule Animals {\n    export module Reptiles {\n        export\
  \ var snake = \"snake\";\n    }\n}\nmodule Animals.Mammals {\n    export var monkey\
  \ = \"monkey\";\n}\n```\n\n在本例中，我们为 Animals 模块创建了一个声明，然后在其中嵌套了另一个被导出的模块声明。此外，还有一个模块声明使用了以\
  \ . 字符分隔的多部分类型名称。这里展示的两种模块声明都是有效的。两种声明生成的 JavaScript 输出完全相同，因此选择哪种风格实际上取决于个人偏好。编译器会像开发环境一样将它们视为等价。正如下面的截图所示，访问\
  \ Reptiles 和 Mammals 命名空间的方式完全一致：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_93_0.png)\n\
  \n这些模块定义各自生成的 JavaScript 在结构上是相同的。然而，如果你打算在单个 TypeScript 文件中声明多个嵌套模块，最好使用展开式的嵌套声明，而不是使用快捷方式。编译器在生成\
  \ JavaScript 输出时不会尝试优化和合并模块定义。正如下面的 JavaScript 代码所示，你将会不必要地创建多个闭包来向类型对象添加对象。如果你打算按文件来划分命名空间，那么这种情况是不可避免的。\n\
  \n```javascript\nvar Animals;\n(function (Animals) {\n    (function (Reptiles) {\n\
  \        Reptiles.snake = \"snake\";\n    })(Animals.Reptiles || (Animals.Reptiles\
  \ = {}));\n    var Reptiles = Animals.Reptiles;\n})(Animals || (Animals = {}));\n\
  var Animals;\n(function (Animals) {\n    (function (Mammals) {\n        Mammals.monkey\
  \ = \"monkey\";\n    })(Animals.Mammals || (Animals.Mammals = {}));\n    var Mammals\
  \ = Animals.Mammals;\n})(Animals || (Animals = {}));\n```\n\n可能有一些常见的对象类型或实用方法，你希望在另一个模块中能够快速访问。随着我们继续合理地对类型进行拆分，让我们创建一个用于绘图相关功能的新模块。这个模块将包含我们之前创建的\
  \ Point 类和 Bounds 类。这两个类都将被导出，因为其他模块需要能够引用它们。虽然将代码分隔到易于管理的隔离段中是一件好事，但现在每当我需要使用另一个模块中的类型时，我都必须提供完全限定名称。幸运的是，TypeScript\
  \ 提供了一个与 export 关键字相反的关键字，允许我们为另一个模块的成员创建别名。import 关键字会为其他模块的导出类型创建新的局部引用。在下面的代码段中，我们将在\
  \ Shapes 模块内为 Bounds 类创建一个别名。这样我们就不必修改 Shape 类的定义，使其包含 Bounds 类型的完整命名空间。\n\n```\n\
  module Shapes {\n    import Bounds = Drawing.Bounds;\n    export enum ShapeType\
  \ {\n        Rectangle = 3,\n        Circle,\n        Line,\n        Freehand,\n\
  \    }\n    export interface IShape {\n        Type: ShapeType;\n        Bounds:\
  \ Drawing.IBounds;\n    }\n    export class Shape {\n        public Type: ShapeType\
  \ = ShapeType.Rectangle;\n        public Bounds: Drawing.IBounds = new Bounds();\n\
  \    }\n}\n```\n\n如你所见，这个别名既可以用作类型注解，也可以用作对象类型。生成的 JavaScript 只是将 import 关键字替换为\
  \ var，并让运行时引擎创建对导出成员的引用。但是，直接在 TypeScript 中这样做会生成编译错误。import 关键字会告知编译器不仅要检查被别名化的对象，还要检查其类型信息，以便将其用于类型声明中。\n\
  \n### 提示\n\nexport 关键字和 import 关键字可以结合使用，以创建可从外部访问的别名。\n\n\n\n\n\n### 泛型对象\n\n如果你采用\
  \ TypeScript 的目标是为客户端使用创建 API，那么泛型就是你最应该熟悉的语言构造。泛型允许框架和 API 的使用者就完成指定目标所需的具体契约达成一致，而无需了解特定的对象类型。泛型定义了\
  \ TypeScript 中对象的第三类也是最后一类类别——类型参数。正如本章前面讨论数组时所见，类型参数定义在 `<` 和 `>` 字符内部。它们可以用于接口或类定义，以便为开发时可能已知或未知的广泛对象类型创建功能。假设我们要创建一个通用的任务处理器。我们将采用最简单的实现方式，即一个串行过程，将一个通用任务列表传递给一个函数来运行它们：\n\
  \n```typescript\ninterface ITask {\n    Id: number;\n    Execute(): boolean;\n \
  \   Error: string;\n}\nfunction ProcessTasks<T extends ITask>(tasks: T[]): T {\n\
  \    for (var i = 0; i < tasks.length; i++) {\n        if (tasks[i].Execute() ==\
  \ false) {\n            return tasks[i];\n        }\n    }\n    return null;\n}\n\
  ```\n\n在此示例中，我们定义了一个接口，任务处理器将依赖该接口来顺序执行一组任务。`ProcessTasks` 的函数声明现在包含一个类型参数 `T`，它必须遵循\
  \ `ITask` 接口。该类型参数用作约束，限制可作为 `tasks` 数组一部分传入的对象，并且它将成为函数的返回类型。`tasks` 数组逐一循环，并调用\
  \ `Execute` 方法。如果 `Execute` 方法返回 `false` 值，则处理停止并返回该任务。泛型完全建立在类型注解之上，因此它们对生成的 JavaScript\
  \ 没有任何影响。但是，如果未满足类型约束，则会生成编译错误。\n\n接口和类能够围绕一个非常松散的类型定义构建更复杂的结构。提供给接口或类的类型参数可用于为声明主体内的任何成员或函数提供类型信息。在下一个示例中，我们的\
  \ `ProcessTasks` 函数已被移入一个充当处理器的类中。我们创建了一个通用接口，允许我们创建任意数量的任务处理器，并为 `ProcessTasks`\
  \ 函数提供不同的实现。然后，我们看到一个类声明，它提供了自己的一组类型参数并实现了 `ITaskProcessor` 接口：\n\n```typescript\n\
  interface ITask {\n    Id: number;\n    Execute(): boolean;\n    Error: string;\n\
  }\ninterface ITaskProcessor<T extends ITask> {\n    ProcessTasks(tasks: Array<T>):\
  \ T;\n    CurrentTask: T;\n}\nclass TaskProcessor<T extends ITask> implements ITaskProcessor<T>\
  \ {\n    public CurrentTask: T = null;\n    constructor() {\n    }\n    public ProcessTasks(tasks:\
  \ T[]): T {\n        for (var i = 0; i < tasks.length; i++) {\n            this.CurrentTask\
  \ = tasks[i];\n            if (this.CurrentTask.Execute() == false) {\n        \
  \        return tasks[i];\n            }\n        }\n        this.CurrentTask =\
  \ null;\n        return null;\n    }\n}\n```\n\n泛型函数和类型并不限于单个未知类型。类型参数可以是类型信息的列表，可在与该列表关联的声明块中的任何位置使用。创建类型参数列表与传递单个类型参数相同，只是每个类型用逗号分隔。此外，参数列表中创建的每个泛型类型都可在类型定义内部用作其他类型参数的基类型。下一个示例展示了这两个概念：\n\
  \n```typescript\ninterface IExample<T, U extends HTMLElement> {\n    Operate<V extends\
  \ U>(): T;\n}\n```\n\n如你所见，这里有一个逗号分隔的泛型类型列表及它们可能具有的任何约束，而不是单个泛型类型。然后，`Operate` 函数要求一个继承自初始类型参数列表中提供的\
  \ `U` 类型的类型。\n"
- "# 第 3 章 TypeScript 编译器\n\n在本章中，将对 TypeScript 编译器进行分析。将分解并解释编译器所理解的不同参数，以及它们如何影响生成的\
  \ ECMAScript。我们将讨论如何控制代码的生成位置，以及可能伴随我们生成的 ECMAScript 的不同文件。编译器上还有其他一些选项，可使构建和部署大型应用程序更加容易。\n\
  \n本章将涵盖的主题如下：\n\n- ECMAScript 生成\n- 输出控制\n- 高级编译器选项\n\n### ECMAScript 的生成\n\n与大多数编程语言一样，ECMAScript\
  \ 也在不断发展。它最初于 90 年代中期开发，用于客户端脚本编写。当前的标准是 ECMAScript 5；然而，第 6 版目前正在开发中。TypeScript\
  \ 编译器提供了一系列选项来改变代码的生成方式。在本节中，我们将查看这些选项并比较结果。\n\n### ECMAScript 版本\n\n编写 JavaScript\
  \ 代码意味着你的代码必须可移植到多种类型的客户端设备和浏览器。你可能不仅被迫支持最新版本的浏览器，还可能需要支持其任何先前版本。因此，编译器支持将你的 TypeScript\
  \ 代码编译成不同版本的 ECMAScript。ECMAScript 3 是一个被广泛采用且大量使用的标准，在许多旧版浏览器中仍然存在。ECMAScript 4\
  \ 在负责创建标准的组织无法就语言特性达成一致时被放弃。ECMAScript 5 是当前的标准，已被大多数现代浏览器采用。它发布于 2009 年，距第 3 版最初发布近十年。在第\
  \ 2 章《TypeScript 基础》中，我们看到你可以在 Visual Studio 中轻松切换 ECMAScript 版本。当我们更改此选项时，让我们看看幕后实际发生了什么。在下面的屏幕截图中，你可以看到我们调用编译器的方式与第\
  \ 1 章《TypeScript 入门》中相同，只是这次我们提供了一个额外的参数：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_103_0.png)\n\
  \n如你所见，有两种方式可以将 ECMAScript 目标版本传递给编译器：详细方法 `--target` 和简写方法 `-t`。\n\n**提示**\n\n\
  如果未提供目标版本，编译器将默认使用 ECMAScript 3。因此，除非你明确使用仅在 ECMAScript 5 中定义的语言构造，否则无需提供此参数。\n\n\
  ECMAScript 5 最初计划是作为一个次要更新，即 ECMAScript 3.1，并且只提供一组有限的新功能，以试图保持向后兼容性。引入了严格模式，它为语言提供了一组不同的语义规则。严格模式对正常\
  \ ECMAScript 语义做出了三个主要改变：\n\n- 某些静默错误现在会被抛出\n- 强制执行允许语言引擎提供更多优化的规则\n- 确保某些关键字不能被使用，以便未来的\
  \ ECMAScript 版本可以在语言规范中使用它们\n\n虽然通过在 TypeScript 文件顶部放置 `use strict` 仍可在 TypeScript\
  \ 中使用严格模式选项，但其价值已不那么显著。TypeScript 编译器已经考虑到了在严格模式下运行的 JavaScript 代码所强制执行的大多数规则。例如，如果你尝试给一个不存在或未定义的变量赋值，将生成编译错误。当你的\
  \ JavaScript 在非严格模式下运行时，这将创建一个新变量并将其放入全局作用域。如果在严格模式下运行的 JavaScript 中执行此操作，将生成引用错误。`with`\
  \ 关键字在严格 JavaScript 中会产生语法错误，因为无法对声明块内的代码块进行优化。每当你尝试使用 `with` 块时，TypeScript 都会生成语法错误。TypeScript\
  \ 编译器甚至会将你现有的 JavaScript 格式化为更严格的标准集合，例如，如果你编写以下代码行：\n\n```javascript\nfunction\
  \ sayHello() {\n    alert(\"Hello There\")\n}\nSayHello()\n```\n\n在大多数情况下，这是合法的\
  \ JavaScript；然而，在某些情况下，需要分号来保持代码有意义。当编译器生成了这段代码时，它已识别出缺失的分号并将其添加到生成的 JavaScript\
  \ 中：\n\n```javascript\nfunction sayHello() {\n    alert(\"Hello There\");\n}\nSayHello();\n\
  ```\n\n正如我们在前一章中讨论的那样，TypeScript 添加了大量当前版本 ECMAScript 所缺少的语言构造。然而，该语言将继续发展，并且新的构造将被添加到规范中。严格模式有助于防止开发人员创建使用未来版本潜在关键字的代码。严格模式下禁止的关键字是：`implements`、`interface`、`let`、`package`、`private`、`protected`、`public`、`static`\
  \ 和 `yield`。如你所见，TypeScript 定义的内容与语言委员会为将来使用而保留的内容之间有相当多的重叠。我们已经讨论了 TypeScript 对\
  \ `implements`、`interface`、`private`、`public` 和 `static` 的实现。其余受严格模式限制的名称目前是 TypeScript\
  \ 中的关键字；然而，任何使用它们的尝试都将导致编译错误。\n\n如果你希望代码同时兼容 ECMAScript 3 和 5，那么实际上只有一个关键构造你应该避免，那就是\
  \ getter 和 setter。Getter 和 setter 用于定义 JavaScript 对象的属性。它们是一种特殊类型的语言构造，允许像变量一样被访问，但在内部它们被实现为函数。关于\
  \ getter 和 setter 的浏览器兼容性，可以在[第 2 章《TypeScript 基础》]中引用的表格中找到。以下代码片段展示了如何创建这些属性：\n\
  \n```typescript\ninterface IBook {\n    title: string;\n}\nclass Book implements\
  \ IBook {\n    private _title: string = \"\";\n    constructor() {\n```\n\n\n\n\n\
  \n```\n}\nget title(): string {\n    return this._title;\n}\nset title(value: string)\
  \ {\n    if (value && value.length > 0) {\n        this._title = value;\n    } else\
  \ {\n        throw (\"Invalid Book Title!\");\n    }\n}\n```\n\n我们现在能够将为书籍设置或检索标题的过程封装在一个函数声明中。在这种情况下，一本书必须有一个标题，因此尝试将其设置为\
  \ null 或空字符串会生成异常。如果尝试在未将目标版本设置为 ES5 的情况下通过编译器运行此代码，您将收到类似于以下屏幕截图的错误：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_105_0.png)\n\
  \n## 代码操作\n\n编译器还有另外几个可用的选项，这些选项将决定生成的 JavaScript 代码会是什么样子。与 JavaScript 一样，TypeScript\
  \ 允许在代码中放置注释。它们与 JavaScript 注释的定义方式完全相同，并且对运行时执行没有影响。注释用于解释代码段的设计目的，以便当另一位开发人员查看代码时，他们会知道发生了什么。在开发过程中逐步执行我们的代码时，这可能非常有帮助。然而，当代码部署到客户端时，这些注释是不必要的，并且会增加我们\
  \ JavaScript 文件的大小。使用 `--removeComments` 参数，我们可以确保在部署之前删除所有这些不需要的数据。考虑以下 TypeScript\
  \ 代码：\n\n//Retrieve a new random integer value\nfunction getRandom(): number {\n\
  \    return Math.floor(Math.random() * Date.now());\n}\n```\n\n前述代码可以使用以下屏幕截图中显示的命令进行编译：\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_106_0.png)\n\n这会产生以下 JavaScript 输出：\n\
  \n```\nfunction getRandom() {\n    return Math.floor(Math.random() * Date.now());\n\
  }\n```\n\n在小规模上，这并不代表巨大的收益；然而，当您将应用程序扩展到数十万行代码时，这可能代表大量数据。在 JavaScript 开发中，将 .js\
  \ 文件压缩成最小化文件在推送到生产环境时是常见做法。这有助于减少整体文件大小，并且对运行时速度没有影响。不幸的是，在版本 1.0 发布时，TypeScript\
  \ 编译器没有此选项。希望它会在未来版本中添加，但在此期间有其他工具可用于压缩 JavaScript。RequireJS 是一个我们稍后会讨论的库，它提供了压缩\
  \ JavaScript 代码的选项。\n\nTypeScript 编译器可用的最后一个与 ECMAScript 输出相关的参数是 module 参数。此参数告诉编译器如何为外部模块生成代码。\n\
  \n```\n}\n    CompilerExample.test = test;\n})(exports.CompilerExample || (exports.CompilerExample\
  \ = {}));\nvar CompilerExample = exports.CompilerExample;\n```\n\n正如您所见，生成的 JavaScript\
  \ 非常不同；然而，我们的 TypeScript 并没有改变。\n\n## 控制编译器输出\n\nTypeScript 编译器在控制编译器的最终结果方面具有非常强大的功能集。编译器以可扩展的方式构建，允许我们一次编译多个源文件以及控制其输出目录或路径。我们还将讨论创建源映射以帮助我们在调试应用程序时使用。\n\
  \n### JavaScript 输出\n\n到目前为止，我们只处理一次编译单个 TypeScript 文件。随着应用程序规模的增长，将我们的代码分离成可维护的片段变得非常重要。在为\
  \ C# 应用程序编写代码时，通常按类分离代码文件。JavaScript 约定在代码分段方面有所不同。如果遵循模块模式，通常将整个模块放在单个文件中；否则，代码通常根据应用程序的需求分段成相关的块。通过用空格分隔多个文件名传递给编译器，将告诉编译器解析每个文件并为每个文件生成一个\
  \ JavaScript 文件。以下屏幕截图显示了如何执行此操作：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_111_0.png)\n\
  \n正如您所见，我们现在有两个 TypeScript 文件，每个文件都作为参数传递给编译器。运行此命令的结果将是两个 JavaScript 文件，每个文件对应一个\
  \ TypeScript 文件。可以提供的<|message|> 文件数量没有限制；然而，在某个时候，命令行将达到其缓冲区限制。我们将在不久后看到如何通过使用参数文件使这变得更容易。\n\
  \nTypeScript 编译器提供了两个主要选项来控制将用于运行时的 JavaScript 输出到何处。第一个选项需要一个文件夹位置来单独输出所有生成的 JavaScript\
  \ 文件。正如以下屏幕截图所示，我们使用 `--outDir` 参数提供我们的位置：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_111_1.png)\n\
  \n另一个选项允许我们将 TypeScript 编译成单个 JavaScript 文件。这使我们能够对应用程序进行一次 HTTP GET 请求，而不是必须进行多次请求。当应用程序规模扩大并且必须按特定顺序加载每段代码以确保正确执行时，这可能是一项非常复杂的任务。TypeScript\
  \ 编译器有几种不同的方法来确保以单文件生成的代码以所有对象在需要之前存在的方式创建。确保此的最简单方法是手动按应编译的顺序提供文件。让我们看看我们的两个 TypeScript\
  \ 文件以及它们如何交互：\n\n```\nfunction sayHello() {\n    alert(\"Hello There\");\n}\nfunction\
  \ getRandom(): number {\n    return Math.floor(Math.random() * Date.now());\n}\n\
  ```\n\n前述代码段代表一个名为 utilities.ts 的文件，它是一组可用于执行各种不同操作的函数。下一个代码段是 app.ts，它引用了这两个函数并依赖于它们在运行时可用。\n\
  \n```\nsayHello();\nalert(getRandom());\n```\n\n如果我们将它们生成为单独的 JavaScript 文件，那么我们必须在\
  \ HTML 页面中放置多个 script 标签。script 标签必须按特定顺序提供，否则会发生引用错误，应用程序将停止工作。我们已经必须向编译器提供多个 TypeScript\
  \ 文件，那么为什么不直接生成单个 JavaScript 文件并避免处理这个问题呢？以下屏幕截图显示了如何为所有生成的 JavaScript 指定单个文件位置：\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_112_0.png)\n\n这将导致编译器生成的两个 JavaScript\
  \ 文件的串联。这意味着我们的 TypeScript 文件仍必须按正确顺序提供，否则会发生引用错误。值得庆幸的是，TypeScript 提供了一种使用特定语法来确定引用图的方法来帮助控制这个问题。下一个代码段显示了如何提供对另一个\
  \ TypeScript 文件的特定引用以确保编译器保持正确的顺序：\n\n```\n/// <reference path=\"utilities.ts\"\
  \ />\nsayHello();\nalert(getRandom());\n```\n\n这些引用应放在 TypeScript 文件的顶部。如果没有，文件串联在一起的顺序将是错误的。编译器检查每个文件的开头并解析某些结构以确定应如何生成结果\
  \ JavaScript。一旦达到第一个执行代码块，编译器将停止查找这些语法结构。通过提供此引用，我们现在可以按任意顺序将 TypeScript 文件传递给编译器。\n\
  \n运行以下屏幕截图中显示的命令：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_113_0.png)\n\n生成的\
  \ JavaScript 文件将如下所示：\n\n```javascript\nfunction sayHello() {\n    alert(\"Hello\
  \ There\");\n}\nfunction getRandom() {\n    return Math.floor(Math.random() * Date.now());\n\
  }\n/// <reference path=\"utilities.ts\" />\nsayHello();\nalert(getRandom());\n```\n\
  \n正如您所见，我们的最终结果被放置在单个 output.js 文件中，并且顺序正确以确保不会抛出引用错误。两个文件可以相互引用，但不推荐这样做。如果只有一个文件引用由另一个文件实例化的对象，编译器将能够正确排序\
  \ JavaScript。否则，它将无法保证所有引用的对象在运行时可用。这不会导致编译错误，因此请注意不要创建这种情况。\n\n\n\n\n\n## 源码映射\n\
  \n接下来，我们将查看源码映射以及它们如何让我们逐步调试 TypeScript 代码，而不是仅仅调试生成的 JavaScript。源码映射是一种有用的工具，用于帮助调试已经合并和压缩过的代码。TypeScript\
  \ 和 Visual Studio 通过提供指向原始 TypeScript 文件的源码映射来利用这一点。`--sourcemap` 参数告诉编译器为每个生成的\
  \ JavaScript 文件生成一个映射文件。然后该映射文件用于帮助将压缩或合并后的代码的每一行段映射回更易于调试的未压缩文件。TypeScript 编译器生成的映射文件将映射指向与正在运行的代码关联的原始\
  \ TypeScript 文件。\n\n以下屏幕截图显示了在编译期间如何生成源码映射：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_114_0.png)\n\
  \n现在，我们的两个 TypeScript 文件都合并成了一个 JavaScript 文件，但如果我们想单独调试它们，我们可以。当提供 sourcemap 参数时，它会告诉编译器在每个生成的\
  \ JavaScript 文件中注入一行新代码，将调试器指向已生成的源码映射：\n\n```\n```text\n//# sourceMappingURL=output.js.map\n\
  ```\n```\n\n在我们的例子中，生成的映射文件名为 `output.js.map`，位于与 `output.js` 相同的目录中。该映射文件的内容如下：\n\
  \n```\n```json\n{\n  \"version\": 3,\n  \"file\": \"output.js\",\n  \"sourceRoot\"\
  : \"\",\n  \"sources\": [\"utilities.ts\", \"app.ts\"],\n  \"names\": [\"SayHello\"\
  , \"GetRandom\"],\n  \"mappings\": \"AACA,+BAD+B;AAC/B,SAAS,QAAQ;IACbA,KAAKA,CAACA,aAAA,A,CAACA;AACxB\
  \ A,CAACA;;AAED,KAAK,CAAC,SAAS,CAAC,CAAC,CAAC;ACL1B,qCAAqC;AACrC,QAAQ,CAAC,CA AC;AACV,SAAS,SAAS;IACdC,OAAOA,IAAIA,CAACA,KAAKA,CAACA,IAAIA,CAACA,MAAMA,CAA\
  \ CA,CAACA,G AAGA,IAAIA,CAACA,GAAGA,CAACA,CAACA,CAACA;AACjDA,CAACA;AAED,mBAAmB;AACnB,oBAAOOB;AACpB,GAAG;AAEH,+BAA+B;AAC/B,kCAAKC;AACLC,qBAAqB;AACrB,OAAO;A\
  \ ACP,2BAA2B;AAC3B,6BAA6B;AAC7B,OAAO;AACP,GAAG;AAEH,qCAAqC\"\n}\n```\n```\n\n正如你所见，这是一个非常简单的\
  \ JSON 对象，其中包含必要的信息\n\n## 高级选项\n\n通过我们迄今为止看到的内容，我们可以构建和部署大型应用程序。现在，我们将查看尚未涵盖的几个剩余选项。有些只是信息性的，而其他一些可以帮助你和你的团队编写更好的\
  \ TypeScript 代码。与大多数命令行实用程序一样，TypeScript 编译器带有帮助参数，可输出编译器的所有选项。要查看所有这些选项，请使用 -h\
  \ 或 --help 参数，或直接不带参数运行编译器。还有一个版本参数，可输出已安装的 TypeScript 编译器的当前版本。这可通过 -v 或 --version\
  \ 参数查看。正如以下屏幕截图所示，本书是在 TypeScript 作为完整语言首次发布后立即编写的。\n\n由于该语言是开源的，请预期会进行改进并提供新版本。\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_117_0.png)\n\n现在我们已经介绍了我们将很少使用的选项，让我们回到改进\
  \ Web 开发方式上来。如果你正在编写 Web 应用程序，你的用户可能遍布世界各地。这意味着你的应用程序可以并且可能应该支持多种语言。为了确保每个本地化字符都能正确显示，你可能必须指定一个代码页。\n\
  \n### 注意\n\n代码页是一个用于表示字符编码的数字。例如，UTF-8 为 65001，而 ASCII 为 20127。\n\nTypeScript 编译器提供\
  \ `--codepage` 参数，允许你指定结果 JavaScript 文件将包含的字符集。默认情况下，如果未提供此参数，TypeScript 编译器将使用\
  \ 65001。Visual Studio 不允许指定此选项，在大多数情况下应使用 UTF-8。\n\n我们之前谈到过 JavaScript 的严格模式以及它如何强制语言采用某些构造来帮助改进我们开发的代码。TypeScript\
  \ 也有自己的严格模式，它强制我们在任何地方使用类型。如果未明确提供类型并且编译器无法推断对象的类型信息，我们可以使用编译器来警告我们。要强制执行此约束，只需在编译\
  \ TypeScript 文件时提供 `--noImplicitAny` 参数即可。在以下代码段中，你可以看到我们创建了一个类型变量 a 未知的情况。我们没有为其提供初始类型信息，并且在执行期间将其分配给多种对象类型。\n\
  \n```\nfunction implicitType() {\n    var a;\n    a = 2;\n    a = \"bob\";\n   \
  \ alert(a);\n}\n```\n\na 的最终运行时值为 \"bob\"；然而，这破坏了 TypeScript 旨在提供的类型安全。在以下屏幕截图中，你可以看到如何在代码中强制执行类型以及尝试编译前述代码的结果：\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_118_0.png)\n\n在我们的代码上强制执行类型不仅有助于确保我们编写坚实的代码，而且还将帮助任何尝试在\
  \ API 级别使用它或理解代码意图的人。强类型化我们的对象有助于他人了解他们正在处理的内容。\n然而，你不想将所有 TypeScript 源文件提供给作为 API\
  \ 使用你代码的任何人。出于这个原因，TypeScript 创建了另一种语言结构，它将在不提供任何实现细节的情况下向使用者提供类型信息。此类型信息被放置在声明文件中，然后可以与可在运行时使用的合并和压缩的\
  \ JavaScript 文件一起分发。在下一个代码段中，有一个可重用的模块，可以部署供任何 JavaScript 代码调用：\n\n```\nmodule MyNamespace\
  \ {\n    export interface IClass {\n        Id: string;\n        DoSomething();\n\
  \    }\n    export class MyClass implements IClass {\n        constructor(public\
  \ Id: string = Date.now().toString()) {\n        }\n        public DoSomething()\
  \ {\n            alert(this.Id);\n        }\n    }\n}\n```\n\n此模块可以被知道源文件位置的其他 TypeScript\
  \ 文件使用。然而，只使用 JavaScript 文件的人将无法以强类型的方式与我们的对象交互。但是，如果我们向使用者提供声明文件，他们就可以像这些对象存在于他们自己的代码库中一样使用我们的对象。要为\
  \ TypeScript 文件生成声明文件，请运行以下屏幕截图中显示的命令：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_119_0.png)\n\
  \n在编译过程中，我们模块的类型信息将被提取到一个新文件中，该文件将与生成的 JavaScript 文件一起输出。它将具有 `<filename>.d.ts`\
  \ 的格式，并且会被任何 TypeScript 编译器视为一组类型定义。尝试在声明文件中放置执行代码将导致错误。从我们的模块生成的<|message|> 文件如下：\n\
  \n```\ndeclare module MyNamespace {\n    interface IClass {\n        Id: string;\n\
  \        DoSomething(): any;\n    }\n    class MyClass implements IClass {\n   \
  \     public Id: string;\n        constructor(Id?: string);\n        public DoSomething():\
  \ void;\n    }\n}\n```\n\n正如你所见，所有类型信息都存在，但实现细节已被省略。我们将在开始集成其他库（如 jQuery）时更详细地讨论这些内容。\n\
  \n最后一个编译器选项允许我们将文本文件作为参数传递给编译器。此文本文件可以包含编译器的参数列表和所有编译文件，从而使我们能够绕过命令行限制。这是命令行缓冲区限制的变通方法。在以下屏幕截图中，你可以看到已创建的文本文件来管理我们的编译参数：\n\
  \n\n\n![](img/83a7f7e1723158e56008cf70304a8da4_120_0.png)\n\n如你所见，我们现在可以将所有参数放入一个易于管理的列表中。以下截图展示了如何将此文件与编译器一起使用：\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_120_1.png)\n\n## 总结\n\n在本章中，我们介绍了 TypeScript\
  \ 编译器的各个不同参数。我们讨论了如何针对不同版本的 ECMAScript 以及选择哪种外部模块模式。源代码映射（Source maps）将非常有助于调试 TypeScript\
  \ 代码，而声明文件则有助于我们部署编译后的 JavaScript，同时仍为使用 TypeScript 的开发者提供丰富的类型体验。将文件传递给编译器的能力使我们能够创建可复用的编译脚本，这比单独使用命令行更具扩展性。接下来，我们将介绍不同的构造如何将通常意义上的脚本语言转变为面向对象的语言。\n\
  \n## 基础知识\n\n在深入探讨 OOP 的主要概念之前，我们先来谈谈对象是什么以及它们如何工作。对象是自包含的实体，维护一组数据成员和方法。数据成员对每个对象实例都是唯一的，方法可以直接访问这些成员。对象表示某个类类型的实例，可以创建任意数量的实例。每个实例在运行时都有不同的内存位置来存储其内部成员变量，以便区分它们。以下代码示例展示了类定义以及该类型的不同对象的创建：\n\
  \n```\nclass Shape {\n    public locationX: number = 0;\n    public locationY: number\
  \ = 0;\n    public height: number = 0;\n    public width: number = 0;\n    constructor()\
  \ {\n    }\n    public draw() {\n    }\n    public resize(height: number, width:\
  \ number) {\n        this.height = height;\n        this.width = width;\n    }\n\
  \    public move(x: number, y: number) {\n        this.locationX = x;\n        this.locationY\
  \ = y;\n    }\n}\n\nvar shapeInstance = new Shape();\nvar otherShape = new Shape();\n\
  shapeInstance.move(30, 35);\notherShape.resize(15, 15);\n```\n\n如你所见，我们有一个简单的 Shape\
  \ 类，包含几个数据成员和几个方法。然后我们可以实例化该类的多个实例，并存储对它们的引用，以便分别对它们进行操作。正如所见，我们改变了第一个对象的位置和第二个对象的大小。如果我们直接访问这些成员，shapeInstance\
  \ 的 height 和 width 仍为 0，位置为 (30, 35)，而 otherShape 仍位于 (0, 0)，height 和 width 为 15。\n\
  \n## SOLID——面向对象设计\n\nSOLID 是 OOP 中设计类时五项基本原则的首字母缩写。遵循这些原则将确保你的应用程序结构良好，并为未来保持足够的灵活性。让我们来看看每个字母代表什么：\n\
  \n- **单一职责原则（Single Responsibility Principle）：** 一个类只应有一个变更原因。如果一个类有多个职责，那么这些职责就会耦合在一起。当这种耦合发生时，其中一个职责的变更可能会破坏其他职责的功能，从而增加了风险。有关此原则的更多信息，请参考：http://www.objectmentor.com/resources/articles/srp.pdf。\n\
  - **开闭原则（Open/Closed Principle）：** 一个对象应对扩展开放，对修改关闭。这一原则是抽象的基础，我们稍后会简要讨论。本质上，你的程序应围绕一组特定的契约或抽象类来设计，随着需求变化，应通过扩展这些契约或抽象类来实现新功能。有关此原则的更多信息，请参考：http://www.objectmentor.com/resources/articles/ocp.pdf。\n\
  - **里氏替换原则（Liskov Substitution Principle）：** 一个对象应能被其子类型对象替换，而不改变程序的执行。这一原则建立在开闭原则之上，即任何子类都必须维持基类所确立的最小契约。然而，这一原则更进一步，它适用于客户端对每个对象的使用以及基类所期望的行为。有关此原则的更多信息，请参考：http://www.objectmentor.com/resources/articles/lsp.pdf。\n\
  - **接口隔离原则（Interface Segregation Principle）：** 多个针对特定客户的接口优于一个通用的接口。这一原则很重要，因为它有助于将不同的行为解耦，使客户端只需实现它们真正需要的内容。有关此原则的更多信息，请参考：http://www.objectmentor.com/resources/articles/isp.pdf。\n\
  - **依赖倒置原则（Dependency Inversion Principle）：** 依赖抽象而非具体实现。这一原则指出，应创建适当的抽象，使依赖函数可以依赖它，具体实现也将遵循它。当两者都能使用这种抽象时，随着需求变化，代码复用就会变得简单且影响最小。有关此原则的更多信息，请参考：http://www.objectmentor.com/resources/articles/dip.pdf。\n\
  \n在开发应用程序时牢记这些原则，将使你能够使用 JavaScript 这种过程式语言编写出面向对象的代码。\n\n### 理解继承\n\n继承是一个类扩展现有类功能的能力。继承为多个对象提供了一种方式，使它们可以共享一个共同的核心代码集，然后针对特定目的按需扩展或修改这些代码。以我们的\
  \ Shape 类为例，它非常简单，只有几个属性，但这些属性并没有提供关于实际表示的是什么形状的具体细节。在以下代码中，你可以看到我们将 Shape 类修改得更加通用，并使用\
  \ TypeScript 中的 extends 构造创建了一个子类：\n\n```typescript\ninterface IShape {\n    location:\
  \ IPoint;\n    move(newLocation: IPoint);\n}\nclass Shape implements IShape {\n\
  \    public location: IPoint = new Point(0, 0);\n    constructor() {\n    }\n  \
  \  public move(newLocation: IPoint) {\n        this.location = newLocation;\n  \
  \  }\n}\ninterface IRectangle extends IShape {\n    height: number;\n    width:\
  \ number;\n    area(): number;\n    resize(height: number, width: number);\n}\n\
  class Rectangle extends Shape implements IRectangle {\n    public height: number\
  \ = 0;\n    public width: number = 0;\n    constructor() {\n        super();\n \
  \   }\n    public area(): number {\n        return this.height * this.width;\n \
  \   }\n}\n```\n\n如你所见，我们为 Shape 类定义了一个通用接口，只实现形状对象所需的基本功能，即平面上的位置。Point 类与我们在第 2\
  \ 章“TypeScript 基础”中创建的类相同。然后，一个新的接口提供了定义基本矩形形状所需的属性和方法。这个接口并非绝对必要，但定义它可以使我们在后续代码中轻松扩展或替换\
  \ Rectangle 类（如果需要）。接下来是矩形的类定义，与 IRectangle 定义一样，展示了 extends 关键字的用法。这告诉编译器 Rectangle\
  \ 类是一种形状，应继承随之而来的所有属性。在构造函数内部，必须添加一行额外的代码来初始化基类实例。\n\n#### 提示\n\n对基类构造函数的调用必须是子类构造函数中的第一条语句，否则会产生编译时错误。\n\
  \n现在，每个创建的 Rectangle 对象不仅拥有 height、width 和 area 成员，还将包含由 Shape 类定义的 Location 属性和\
  \ Move 方法。这不是 JavaScript 语言中的默认构造，因此让我们快速查看编译器生成的输出，以了解这是如何实现的：\n\n```javascript\n\
  var __extends = this.__extends || function (d, b) {\n    for (var p in b) if (b.hasOwnProperty(p))\
  \ d[p] = b[p];\n    function __() { this.constructor = d; }\n    __.prototype =\
  \ b.prototype;\n    d.prototype = new __();\n};\nvar Point = (function () {\n  \
  \  function Point(x, y) {\n        if (typeof x === \"undefined\") { x = 0; }\n\
  \        if (typeof y === \"undefined\") { y = 0; }\n        this.x = x;\n     \
  \   this.y = y;\n    }\n    return Point;\n})();\n\nvar Shape = (function () {\n\
  \    function Shape() {\n        this.location = new Point(0, 0);\n    }\n    Shape.prototype.move\
  \ = function (newLocation) {\n        this.location = newLocation;\n    };\n   \
  \ return Shape;\n})();\n\nvar Rectangle = (function (_super) {\n    __extends(Rectangle,\
  \ _super);\n    function Rectangle() {\n        _super.call(this);\n        this.height\
  \ = 0;\n        this.width = 0;\n    }\n    Rectangle.prototype.area = function\
  \ () {\n        return this.height * this.width;\n    };\n    return Rectangle;\n\
  })(Shape);\n```\n\n如你所见，我们所有的类都像之前讨论的那样被创建为模块，但在生成这些模块之前，编译器会注入一段特殊的代码来处理类的扩展。TypeScript\
  \ 编译器通过应用一组标准且广为人知的模式——成员添加和原型复制——为我们实现了面向对象原则。这段代码将两个对象类型作为参数。第一个参数是需要基类所有属性的子类，第二个参数是基类本身。然后，此函数遍历基类上每个可用的成员\n\
  \n\n该签名比 Box 实现中的签名更具体。要修复此问题，请将 resize 方法改为以下形式：\n\n```typescript\npublic resize(height:\
  \ number, width: number, depth: number = 0) {\n    super.resize(height, width);\n\
  \    this.depth = depth;\n}\n```\n\n该参数必须是可选的，否则我们就可能破坏本章前面讨论过的里氏替换原则；但是，我们希望在未向构造函数提供该参数时，确保它有一个有效的值。因此，depth\
  \ 参数被赋予了一个初始化器，而不是仅仅让它成为可选的：`depth?: number`。如果该参数不是可选的，那么当我们把应用中的任何 Rectangle 对象改为\
  \ Box 时，就会收到编译错误，如下面的代码示例所示：\n\n```typescript\n//var rect = new Rectangle();\nvar\
  \ rect = new Box();\nrect.resize(4, 3);\n```\n\n现在，我们已经开始创建一个复杂的对象树，让我们来看看目前已有的不同类之间的关系。下图展示了所有不同对象之间的**是一个**和**有一个**关系：\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_131_0.png)\n\n正如你所看到的，仅这几个简单的类和接口就能创建一个非常复杂的对象树。随着应用程序不断增长，这可能会变得越来越难以管理；但是，如果你遵循面向对象代码开发的指导原则，你就能相对轻松地维护你的应用程序。\n\
  \n```typescript\n} else {\n    throw \"An error occurred during activation!\";\n\
  }\n};\n\nrequest.onerror = () => {\n    throw \"An error occurred during activation!\"\
  ;\n}\nrequest.send(null);\nreturn requestResponse;\n}\n}\n//var activator: IActivator\
  \ = new LocalActivator();\nvar activator: IActivator = new ServerActivator();\n\
  var isActive = activator.activateLicense();\nif (isActive) {\n    //Program logic\n\
  }\n```\n\nServerActivator 类实现了我们之前声明的与 LocalActivator 相同的接口，但它会向服务器发起同步请求以获取数据，而不是在客户端执行。通常，这类请求应以异步方式发出，但是，我们需要修改\
  \ IActivator 接口以支持 Promise，或使用回调函数。\n\n## 注意\n\nPromise 将在 ECMAScript 6 中得到原生支持，不过有好几个库已经实现了自己的实现方案。有关\
  \ ECMAScript 6 Promise 的更多信息，请访问：http://www.html5rocks.com/en/tutorials/es6/promises/。\n\
  \n这两个对象的实现细节大不相同，但最终结果是一样的。两者可以互换使用，并且应用程序无需进一步修改。\n\n## 抽象\n\n抽象是面向对象开发中一个极其强大的概念。它包含了隐藏具体实现细节，同时提供应实现内容的高层定义的思想。在前面的例子中，我们看到了一个非常基本的抽象案例。IActivator\
  \ 接口创建了处理应用程序激活这一概念所需的抽象层。LocalActivator 和 ServerActivator 类型是该抽象的具体实现。在诸如 C# 等其他编程语言中，类可以将特定成员声明为抽象成员。这会强制基类型的任何子类提供该成员的具体实现。在下面的代码片段中，你将看到一个\
  \ C# 示例：\n\n```csharp\npublic abstract class AbstractBaseClass\n{\n    protected\
  \ bool isActive = false;\n    public AbstractBaseClass()\n    {\n    }\n    public\
  \ abstract bool CheckStatus();\n}\n\npublic class ConcreteClass : AbstractBaseClass\n\
  {\n    public ConcreteClass()\n    {\n    }\n    public override bool CheckStatus()\n\
  \    {\n        return this.isActive;\n    }\n}\n```\n\n基类为名为 CheckStatus 的方法提供了声明，但并未提供实现。实现被强制由\
  \ ConcreteClass 类型提供，然而基类中可用的成员对该实现也是可用的。CheckStatus 方法上的 abstract 关键字告诉编译器，AbstractBaseClass\
  \ 的所有子类必须实现该方法，否则将产生编译错误。AbstractBaseClass 上的 abstract 关键字将导致编译器在该类被直接实例化时生成错误。在\
  \ TypeScript 中实现这一点的最简单方式是使用接口，但是这种方式无法提供 C# 抽象类的全部功能。基类中的 protected 成员在类型的具体实现之外不可访问，但如果将其放在\
  \ TypeScript 接口中，则必须将其设置为公开可访问。尽管 TypeScript 缺乏 abstract 关键字和相应的语言构造，我们仍可以使用特定模式来创建类似的实现：\n\
  \n```typescript\nclass AbstractClass {\n    constructor() {\n    }\n    public checkStatus():\
  \ boolean {\n        throw new Error(\"Not Implemented\");\n    }\n}\n\nclass ConcreteClass\
  \ extends AbstractClass {\n    private _isActive: boolean = false;\n    constructor()\
  \ {\n        super();\n    }\n    public checkStatus(): boolean {\n        return\
  \ this._isActive;\n    }\n}\n```\n\n正如你所看到的，我们仍然必须定义一个完整的类来表示抽象基类。然而，在 `checkStatus`\
  \ 的方法实现中，只要尝试直接使用该类，就会在运行时抛出一个异常，从而停止程序执行。要是能有某种方式在编译时强制执行这一点就好了，但目前并不存在这种功能。TypeScript\
  \ 没有 protected 访问级别，因此我们被迫将此细节显式地下移到具体类中。在这种特定情况下，将 `AbstractClass` 直接变成一个由 `ConcreteClass`\
  \ 类型实现的接口是合理的；然而，随着我们的对象变得越来越复杂，我们将需要一些只在基类型中定义一次的公共可访问成员，并且具体的方法实现需要由具体类来提供。\n\n\
  ## 方法重载\n\n方法重载是指提供多个调用签名不同但名称相同的方法。我们在前面第 2 章《TypeScript 基础》中已经讨论过这一点，因此这里只做简要回顾。正如我们之前所见，只要参数都共享一个共同的基类型，我们就可以为单个函数提供多个调用签名。下面代码中展示的\
  \ ICommunicator 接口就提供了这样一个例子：\n\n```typescript\ninterface ICommunicator {\n    speak(message:\
  \ string);\n    speak(message: number);\n    speak(message: boolean);\n    speak(message:\
  \ any);\n}\n\nclass Communicator implements ICommunicator {\n    constructor() {\n\
  \    }\n    speak(message: string);\n    speak(message: number);\n    speak(message:\
  \ boolean);\n    speak(message: any) {\n        alert(message);\n    }\n}\n```\n\
  \n在这个例子中，我们定义了一个用于传递消息的类。消息可以是方法列表中定义的任何类型，并且这些类型都共享一个共同的基类型，最终的方法签名必须使用该基类型，正如第\
  \ 2 章《TypeScript 基础》中所讨论的那样。在传统的面向对象语言中，我们可以定义 speak 方法的多个实现，但由于最终结果仍然是纯 JavaScript，我们只能提供单一的方法块。通过使用条件语句，我们可以为参数列表中使用的每种不同类型提供不同的执行路径，如下面的例子所示：\n\
  \n```typescript\nclass Communicator implements ICommunicator {\n    constructor()\
  \ {\n    }\n    speak(message: string);\n    speak(message: number);\n    speak(message:\
  \ boolean);\n    speak(message: any) {\n        if (typeof message === \"string\"\
  ) {\n            alert(message);\n        } else if (typeof message === \"number\"\
  ) {\n            alert(\"The number provided was: \" + message);\n        } else\
  \ if (typeof message === \"boolean\") {\n            alert(\"The boolean value was:\
  \ \" + message);\n        } else {\n            alert(message);\n        }\n   \
  \ }\n}\n```\n\n\n## 运算符重载\n\nJavaScript 本质上不是一种面向对象的语言，这在某种程度上限制了我们的能力，因此与 C# 等语言相比，我们在某些方面仍然受到限制。JavaScript\
  \ 中无法实现运算符重载，因此我们不得不为类实现特定的方法来实现我们想要的功能。在下面的示例中，我们定义了一个 Vector 类型，它允许我们执行向量数学运算：\n\
  \n```\ninterface IVector {\n    x: number;\n    y: number;\n}\nclass Vector implements\
  \ IVector {\n    public x: number = 0;\n    public y: number = 0;\n    constructor(x\
  \ = 0, y = 0) {\n        this.x = x;\n        this.y = y;\n    }\n}\n```\n\n我们知道执行向量加法相当简单，因此如果我们能用\
  \ + 运算符将这个类的两个实例相加，那就太好了。\n\n```\nvar v1 = new Vector(2, 5);\nvar v2 = new Vector(4,\
  \ 3);\nvar v3 = v1 + v2;\nalert(v3);\n```\n\n然而，由于 JavaScript 中不支持运算符重载，最终结果将与下面截图中的情况类似：\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_142_0.png)\n\n在幕后，JavaScript 引擎会调用与对象关联的\
  \ toString 方法，然后将它们拼接成一个单独的值。这有可能在我们的应用程序中导致意外结果。为了实现我们想要的功能，我们必须显式实现方法来处理所需的功能。\n\
  \n```\npublic add(v: IVector): IVector {\n    var newVector = new Vector();\n  \
  \  newVector.x = this.x + v.x;\n    newVector.y = this.y + v.y;\n    return newVector;\n\
  }\n```\n\n```javascript\npublic static add(v1: IVector, v2: IVector): IVector {\n\
  \    return v1.add(v2);\n}\n```\n\n在将这些方法添加到我们的类定义中，并对 `toString` 进行方法重写之后，我们只需修改应用程序代码来调用新的\
  \ add 方法，即可获得预期的结果：\n\n```javascript\nvar v3 = Vector.add(v1, v2);\nalert(\"X: \"\
  \ + v3.x + \", Y: \" + v3.y);\n```\n\n最终结果将是一个新的 Vector 对象，它是两个向量的和：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_143_0.png)\n\
  \n## 方法重写\n\n方法重写是一种替换从超类继承的功能的方式。方法重写必须与被重写的方法具有相同的调用签名。请看下面的示例：\n\n```typescript\n\
  interface IEmployee {\n    name: string;\n    email: string;\n    work(tasks: string[]);\n\
  }\nclass Employee implements IEmployee {\n    constructor(public name: string, public\
  \ email: string) {\n    }\n    public work(tasks: string[]) {\n        for (var\
  \ i = 0; i < tasks.length; i++) {\n            //perform task\n        }\n    }\n\
  }\ninterface IManager extends IEmployee {\n    employees: IEmployee[];\n}\nclass\
  \ Manager extends Employee implements IManager {\n    public employees: IEmployee[]\
  \ = [];\n    constructor(name: string, email: string, employees: IEmployee[]) {\n\
  \        super(name, email);\n        this.employees = employees;\n    }\n    public\
  \ work(tasks: string[]) {\n        for (var i = 0; i < this.employees.length; i++)\
  \ {\n            for (var j = 0; j < tasks.length; j++) {\n                this.employees[i].work([tasks[j]]);\n\
  \            }\n        }\n    }\n}\n```\n\n在这个示例中，你可以看到我们有两个类。首先，一个通用的 Employee\
  \ 类，它代表了组织中任何员工的基类。该员工拥有一些属性，例如姓名和用于联系他们的电子邮件地址。其次，有一个非常简单的方法，允许向员工传递一个任务列表，该任务列表将按顺序执行，直到所有任务完成。下一个类是\
  \ Manager 类，它是 Employee 的子类。Manager 拥有与普通员工相同的所有功能，只是他们还拥有一个自己负责的员工列表。Manager 会收到一个任务列表，而不是显式地执行每个任务，它会把每个任务委托给其下属员工去执行。如果我们从\
  \ work 方法中添加或删除参数，那么子类和超类之间的调用签名就会不同，从而违反里氏替换原则。TypeScript 不会阻止你更改方法签名，但这会让你的代码更难维护。\n\
  \n## 参考资料\n\n要了解更多关于面向对象设计和面向对象编程概念的信息，请访问：\n\n- http://www.objectmentor.com/omSolutions/oops_what.html\n\
  - http://www.codeproject.com/Articles/22769/Introduction-to-Object-Oriented-Programming-Concepts\n\
  \n## 总结\n\n通过本章的学习，你应该已经对面向对象编程有了基本的了解。我们已经通过几个示例了解了如何将封装、多态、抽象和继承付诸实践，以及它们如何让我们构建可扩展的应用程序。SOLID\
  \ 原则帮助我们规划了类应该如何设计。接下来，我们将在后续几章中将这些概念付诸实践。我们将在[第5章](Chapter 5)*创建简单的绘图应用程序*中，使用\
  \ TypeScript 和少量 HTML 来开发一个交互式绘图应用程序。\n"
- "# 第5章 创建简单的绘图应用程序\n\n在很短的时间内，我们已经涉及了大量的信息。让我们把这些信息运用起来；让我们构建一个完整的应用程序，而不是仅仅查看代码示例。我们将构建一个类似于“画图”的基于\
  \ Web 的绘图应用程序，但它将托管在浏览器中。本章将涵盖的主题包括：\n\n- 创建项目\n- 基本形状\n- 在画布上绘制对象\n- 管理画布状态与决策\n\
  - 跟踪应用程序状态\n\n### 设置项目\n\n首先，我们需要创建一个新项目来托管我们的应用程序，并配置编译器设置。在 Visual Studio 中创建一个新项目，使用[第2章](#)*TypeScript\
  \ 基础*中描述的 TypeScript 项目模板，并将其命名为 `DrawingApplication`。然后，右键单击项目并选择**属性**，打开项目属性。\n\
  \n在下面的屏幕截图中，你可以看到我们将用于此应用程序的设置：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_151_0.png)\n\
  \n正如你所见，我们将以 ECMAScript 3 为目标，以确保我们的应用程序能在更广泛的平台上运行。我们不会使用外部模块系统，注释将从最终输出中移除，其余输出可以保留默认值。接下来，我们需要修改\
  \ `index.html` 以包含一个 canvas 元素。HTML canvas 元素是 HTML5 标准的一部分，目前大多数现代浏览器都支持它。由于我们还没有使用\
  \ jQuery，我们还需要将 `app.js` 文件的加载移到 body 内部；这样，canvas 元素在运行时就可以供我们使用了。下面的屏幕截图显示了进行这些修改后的\
  \ `index.html` 文件：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_152_0.png)\n\n现在我们已经完成了项目的基础设置，让我们开始构建一个面向对象的\
  \ TypeScript 应用程序。在本章中，我们将使用几个枚举来帮助定义抽象，并让我们的类型以强类型的方式进行通信。我倾向于保持代码的清晰分离，以便于导航，因此创建的所有枚举都将放在一个名为\
  \ Enums.ts 的文件中。这两个枚举如下：\n\n```\nenum DrawingToolType {\n    Select,\n    Rectangle,\n\
  \    Circle,\n    Line,\n    Freehand\n}\nenum CanvasEngineAction {\n    None,\n\
  \    Move,\n    Resize\n}\n```\n\nDrawingToolType 类型将用于帮助确定用户选择了哪个绘图工具。负责与画布交互的类型需要知道这一点才能正常运行。CanvasEngineAction\
  \ 类型将由负责绘制形状的对象使用，以告知画布操作者如何处理用户的输入。\n\n\n\n\n\n## 形状\n\n遵循我们在上一章中学到的原则，我们需要在应用程序中执行不同任务时使用多种不同的类型。我们需要对形状是什么的表示，如何绘制它们，与用户界面交互的东西，以及维护要绘制的对象列表的地方。\n\
  \n```typescript\n}\nclass Circle implements ICircle {\n    constructor(public radius:\
  \ number) {\n    }\n    public resize(radius: number) {\n        this.radius = radius;\n\
  \    }\n    public area(): number {\n        return Math.PI * this.radius * this.radius;\n\
  \    }\n}\nclass Line implements ILine {\n    constructor(public p1: IPoint, public\
  \ p2: IPoint) {\n    }\n    public length(): number {\n        var a2 = Math.pow(this.p2.x\
  \ - this.p1.x, 2);\n        var b2 = Math.pow(this.p2.y - this.p1.y, 2);\n     \
  \   return Math.sqrt(a2 + b2);\n    }\n}\nclass Freehand implements IFreehand {\n\
  \    public points: Array<IPoint> = [];\n    constructor() {\n    }\n    public\
  \ addPoint(point: IPoint) {\n        this.points.push(point);\n    }\n}\n```\n\n\
  这些类中的每一个都仅限于单一职责，即跟踪形状的状态并报告与其关联的各种属性。所有这些功能都很有用，但它并不能完全达到我们在画布上绘制对象的目标。\n\n## 绘制形状\n\
  \n现在我们已经有了要绘制的基本表示，我们需要定义将处理此事的对象。这些对象应尽可能少地完成绘制其所代表形状所需的工作。这意味着不直接与 **Document\
  \ Object Model (DOM)** 交互。以下接口表示我们将用来表示可在画布元素上绘制和操作形状的不同抽象：\n\n```typescript\ninterface\
  \ IDraw {\n    draw(ctx: CanvasRenderingContext2D);\n}\ninterface IResize {\n  \
  \  inResizeZone: (mouse: IPoint) => boolean;\n    resizeToLocation: (to: IPoint)\
  \ => void;\n}\ninterface IMove {\n    move: (to: IPoint) => void;\n    contains:\
  \ (mousePoint: IPoint, ctx: CanvasRenderingContext2D) => boolean;\n    getMoveOffset(mousePos:\
  \ IPoint): IPoint;\n}\ninterface IDrawingShape extends IDraw, IResize, IMove {\n\
  \    shape: IShape;\n    location: IPoint;\n    isSelected: boolean;\n    selectionZoneWidth:\
  \ number;\n    opacity: number;\n    getCursorType: (mousePoint: IPoint) => string;\n\
  \    getClickLocationAction(mouse: IPoint, ctx: CanvasRenderingContext2D): CanvasEngineAction;\n\
  }\n```\n\n每个接口都可以很容易地合并成一个单一接口，但根据接口隔离原则，每个操作现在都可以根据需要彼此解耦。IDrawingShape 接口最终合并了这些类型，同时添加了一些自己的功能。所有这些组合在一起表示一种类型，我们将能够在\
  \ HTML 画布元素上绘制并以某种方式与其交互。每个 IDrawingShape 实例都保存对其特定形状的引用，然后可由我们的应用程序逻辑访问或操作。将每个形状与绘图特定接口分离，维护了单一职责原则，允许形状跟踪其数据，而绘图对象将只负责与在浏览器中渲染特定形状相关的方法。形状在画布上的位置由绘图形状管理，以及它是否是画布上当前选中的对象。getCursorType\
  \ 和 getClickLocationAction 函数是应用程序特定的，将允许负责处理用户交互的对象在继续其应用程序逻辑之前从绘图对象请求信息。此接口的具体实现如下：\n\
  \n```typescript\nclass DrawingShapeBase implements IDrawingShape {\n    public shape:\
  \ IShape = null;\n    public location: IPoint = new Point(0, 0);\n    public isSelected:\
  \ boolean = false;\n    public selectionZoneWidth: number = 4;\n    public opacity:\
  \ number = 1;\n    constructor() {\n    }\n    public inResizeZone(mouse: IPoint):\
  \ boolean {\n        throw \"Method not implemented\";\n    }\n    public move(to:\
  \ IPoint) {\n        this.location = to;\n    }\n    public resizeToLocation(to:\
  \ IPoint) {\n        throw \"Method not implemented\";\n    }\n    public contains(mousePoint:\
  \ IPoint, ctx: CanvasRenderingContext2D): boolean {\n        throw \"Method not\
  \ implemented\";\n    }\n    public draw(ctx: CanvasRenderingContext2D) {\n    \
  \    throw \"Method not implemented\";\n    }\n    public getMoveOffset(mousePos:\
  \ IPoint): IPoint {\n        return new Point(0, 0);\n    }\n    public getCursorType(mousePoint:\
  \ IPoint): string {\n        throw \"Method not implemented\";\n    }\n    public\
  \ getClickLocationAction(mousePoint: Point, ctx: CanvasRenderingContext2D): CanvasEngineAction\
  \ {\n        if (this.inResizeZone(mousePoint)) {\n            return CanvasEngineAction.Resize;\n\
  \        }\n        else if (this.contains(mousePoint, ctx)) {\n            return\
  \ CanvasEngineAction.Drag;\n        }\n        return CanvasEngineAction.None;\n\
  \    }\n}\n```\n\n正如你所见，这是一个非常简单的基类，并不意味着直接实例化。它提供了一些默认实现，可以由形状在必要时重用，但也可以被重载。因此，现在我们已经设置了形状抽象，让我们开始为我们打算在应用程序中绘制的每种不同形状实现特定逻辑。以下屏幕截图显示了\
  \ DrawingShape 类型的具体实现，专门针对我们之前定义的矩形形状：\n\n```typescript\nclass DrawingRectangle\
  \ extends DrawingShapeBase implements IFillStyle {\n    public shape: IRectangle\
  \ = new Rectangle(0, 0);\n    public fillStyle: string = \"#FF0000\"\n    constructor()\
  \ ...\n    public inResizeZone(point: IPoint): boolean ...\n    public resizeToLocation(to:\
  \ IPoint) ...\n    public draw(ctx: CanvasRenderingContext2D) ...\n    public contains(mousePoint:\
  \ IPoint, context: CanvasRenderingContext2D): boolean ...\n    public getMoveOffset(mousePosition:\
  \ IPoint): IPoint ...\n    public getCursorType(mousePoint: IPoint) ...\n}\n```\n\
  \n我们将在遇到其使用时介绍每种不同方法的具体实现。完整代码可在网上获得。现在，让我们只看看我们试图做的最基本的事情，即在画布上绘制一个矩形：\n\n```typescript\n\
  public draw(ctx: CanvasRenderingContext2D) {\n    ctx.fillStyle = \"#FF0000\";\n\
  \    ctx.globalAlpha = this.opacity;\n    ctx.fillRect(this.location.x, this.location.y,\
  \ this.shape.width, this.shape.height);\n    ctx.strokeStyle = \"#000000\";\n  \
  \  ctx.lineWidth = 3;\n    ctx.strokeRect(this.location.x, this.location.y, this.shape.width,\
  \ this.shape.height);\n}\n```\n\n正如我们在类型抽象中之前定义的那样，Draw 方法接收一个参数，其类型为 CanvasRenderingContext2D。此类型是对由画布元素返回的对象进行描述，允许我们直接在画布上绘制不同的对象。使用上下文对象的\
  \ API 绘制矩形非常容易。\n\n### 注意\n\nHTML5 canvas 对象具有非常强大的 API；有关其功能完整列表，请访问 http://www.w3schools.com/tags/ref_canvas.asp。\n\
  \n我们首先设置想要矩形的颜色；这必须使用 RGB 十六进制三元组完成。然后，我们可以使用 globalAlpha 属性发送对象将使用的透明度级别。接下来，我们使用上下文根据形状对象的属性和绘图对象的定位在画布对象上渲染矩形。我们还将显示矩形周围的边框，因此我们以相同的方式设置描边颜色，然后设置我们想要绘制的边框宽度。然后，再次调用上下文在画布上渲染我们想要的对象。好的，我们现在有一个形状类型和一种可在浏览器中渲染它的类型。让我们创建一个形状并测试应用程序：\n\
  \n```typescript\nvar canvas = <HTMLCanvasElement>window.document.getElementById(\"\
  drawingCanvas\");\nvar ctx = canvas.getContext(\"2d\");\nvar shape1 = new DrawingRectangle();\n\
  shape1.move(new Point(20, 60));\n```\n\n\n\n```typescript\nshape1.shape.resize(60,\
  \ 80);\nshape1.draw(ctx);\n```\n\n首先我们从 DOM 中获取画布并将其强制转换为 `HTMLCanvasElement` 类型，以便轻松访问其不同的属性。我们需要获取将由我们的绘图对象用来显示其形状的渲染上下文。然后，我们创建一个新的\
  \ `DrawingRectangle` 并将其移动到新位置并赋予其大小。最后，我们告诉形状使用画布元素的上下文对象自行绘制。\n\n在下面的屏幕截图中，你可以看到我们有一个带黑色边框的红色矩形。它距离左侧边缘\
  \ 20 像素，距离顶部边缘向下 60 像素。画布的左上角代表原点，即 `Point(0, 0)`。\n\n![](img/83a7f7e1723158e56008cf70304a8da4_160_0.png)\n\
  \n现在我们可以在画布上绘制形状，让我们定义它如何被操作。剩余的工作由基于所表示的形状类型以及用户执行的操作的计算完成。`move` 功能由基类型提供，因为它不需要直接与形状交互。任何想要更改\
  \ `move` 方法工作原理的子类都可以覆盖它，正如我们在第 4 章《使用 TypeScript 进行面向对象编程》中所学到的。接下来，让我们看看 `DrawingRectangle`\
  \ 的调整大小方法：\n\n```typescript\npublic inResizeZone(point: IPoint): boolean {\n   \
  \ return ((point.x >= this.location.x + this.shape.width - this.selectionZoneWidth\
  \ &&\n        point.x <= this.location.x + this.shape.width + this.selectionZoneWidth)\
  \ &&\n        (point.y >= this.location.y + this.shape.height - this.selectionZoneWidth\
  \ &&\n        point.y <= this.location.y + this.shape.height + this.selectionZoneWidth));\n\
  }\npublic resizeToLocation(to: IPoint) {\n    var cursor = window.document.body.style.cursor;\n\
  \    if (cursor == \"se-resize\") {\n        this.shape.width = to.x - this.location.x;\n\
  \        this.shape.height = to.y - this.location.y;\n    }\n}\n```\n\n第一个方法确定点参数是否位于绘图对象的选择区域边界内。它将被用于帮助我们在下一节中构建的引擎做出决策。对于\
  \ `DrawingRectangle`，这是右下角；然而，悬停在完全正确的像素上以管理它相当困难。这就是为什么有一个可配置大小的选择区域。`resizeToLocation`\
  \ 方法接收一个点并修改底层形状对象的属性以调整其大小。对于矩形，这就像取传入点与矩形当前位置之间的差值一样简单。抽象的其它方法在以下代码中显示。它们用于向画布引擎提供信息，以便它能够适当地与用户交互。\n\
  \n```typescript\npublic contains(mousePoint: IPoint, context: CanvasRenderingContext2D):\
  \ boolean {\n    if (this.shape.height < 0) {\n        this.location.y = this.location.y\
  \ + this.shape.height;\n        this.shape.height = this.shape.height * -1;\n  \
  \  }\n    if (this.shape.width < 0) {\n        this.location.x = this.location.x\
  \ + this.shape.width;\n        this.shape.width = this.shape.width * -1;\n    }\n\
  \    return (this.location.x <= mousePoint.x) &&\n        (this.location.x + this.shape.width\
  \ >= mousePoint.x) &&\n        (this.location.y <= mousePoint.y) &&\n        (this.location.y\
  \ + this.shape.height >= mousePoint.y);\n}\npublic getMoveOffset(mousePosition:\
  \ IPoint): IPoint {\n    return new Point(mousePosition.x - this.location.x, mousePosition.y\
  \ - this.location.y);\n}\npublic getCursorType(mousePoint: IPoint) {\n    if (this.inResizeZone(mousePoint))\n\
  \        return \"se-resize\";\n    else\n        return \"move\";\n}\n```\n\n`contains`\
  \ 方法对形状的状态进行了一点维护，以确保其执行正确的计算。如果矩形的高度或宽度小于零，则确定提供的点是否在形状边界内的逻辑将无法按预期执行。`getMoveOffset`\
  \ 返回在画布上提供流畅拖动体验所需的 x 和 y 偏移量。最后一块拼图是 `getCursorType` 方法，它告诉引擎通过更改光标来通知用户该区域是可交互的。\n\
  \n## 使应用程序具有交互性\n\n现在我们有能力创建任意数量的形状并向用户展示它们。然而，这在功能上非常有限，不允许应用程序与使用者之间进行任何交互。大多数绘图应用程序允许对画布上的对象进行基本移动和调整大小。这要求应用程序在用户尝试更改其中一个形状时每次都重绘自身。\n\
  \n### 引擎\n\n为了处理画布状态的绘制和更新，我们需要一个专注于维护此项的新类型。我们将其称为 `CanvasEngine`，它应该具有非常简单的抽象，因为它只需要执行几个基本任务：绘制画布、清除画布以及接收重绘当前帧的请求：\n\
  \n```typescript\ninterface ICanvasEngine {\n    invalidate();\n    clear();\n  \
  \  draw();\n}\n```\n\n该对象在内部会做更多工作，但任何使用引擎的对象只需要这些函数与之交互。现在让我们看看该类型的更复杂实现。在下面的屏幕截图中，你可以看到完整的实现。随后将对每个公共和私有方法进行分解。\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_164_0.png)\n\n正如你所见，我们有一系列私有方法和事件处理程序，可帮助我们解释用户操作。构造函数接收我们想要操作的画布和负责维护引擎操作的形状列表的模型。该模型已像我们其余类型一样抽象，以保持应用程序解耦。\n\
  \n```typescript\ninterface IDrawingModel {\n    selection: IDrawingShape;\n    shapes:\
  \ IDrawingShape[];\n    addShape(shape: IDrawingShape);\n    getNewShape(location:\
  \ IPoint): IDrawingShape;\n    getDrawingTool(): DrawingToolType;\n}\n```\n\n我们稍后会查看该类型的具体实现，但了解接口是什么将使我们能够继续进行引擎代码。我们将从构造函数开始，然后转向公共方法，最后查看私有用户交互相关方法。正如以下代码示例所示，构造函数做了几件事来设置引擎的状态，并连接事件处理程序：\n\
  \n```typescript\nconstructor(private _canvas: HTMLCanvasElement, private _model:\
  \ IDrawingModel) {\n    this.ctx = this._canvas.getContext(\"2d\");\n    this._canvas.addEventListener('mousedown',\
  \ (e) => this._mousedown(e), true);\n    this._canvas.addEventListener('mousemove',\
  \ (e) => this._mousemove(e), true);\n    this._canvas.addEventListener('mouseup',\
  \ (e) => this._mouseup(e), true);\n}\n```\n\n我们首先获取将用于操作画布的渲染上下文。它被存储为私有变量，并在应用程序生命周期内使用。接下来我们做的就是将事件处理程序连接到画布元素。我们需要在用户用鼠标操作画布上的对象时执行特定操作。语法看起来有点奇怪，不过。这不是有效的\
  \ JavaScript 代码，但在编译后将运行良好。构造函数内部的 `=>` 语法告诉 TypeScript 编译器在最终的 JavaScript 表示中生成\
  \ `this` 对象的特殊表示。最终的 JavaScript 代码看起来会类似于以下内容：\n\n```typescript\nfunction CanvasEngine(_canvas,\
  \ _model) {\n    var _this = this;\n    this._canvas.addEventListener('mousedown',\
  \ function (e) {\n        return _this._mousedown(e);\n    }, true);\n}\n```\n\n\
  这确保了当我们附加到画布的事件监听器被调用时，我们拥有对引擎实例的正确引用。否则，我们可能会使用不代表 `CanvasEngine` 实例的 `this` 对象；在这种情况下，它将是触发事件的\
  \ DOM 元素，调用 `_mousedown` 方法将失败。现在我们已经实例化了对象并连接了事件，让我们看看公共方法。`clear` 和 `invalidate`\
  \ 方法都很简单：\n\n```typescript\npublic clear() {\n    this.ctx.clearRect(0, 0, this._canvas.width,\
  \ this._canvas.height);\n}\npublic invalidate() {\n    window.requestAnimationFrame(()\
  \ => this.draw());\n}\n```\n\n`clear` 方法用空白矩形覆盖整个画布，以从视图中移除所有现有对象。`invalidate` 方法调用\
  \ `draw` 方法以显示由传递给构造函数的绘图模型表示的所有对象。`draw` 方法比这两个方法复杂不了多少。\n\n\n\n\n由于我们之前所做的绘图形状抽象。\n\
  \n```\npublic Draw() {\n    var shapes: Array<IDraw> = this._model.shapes;\n   \
  \ this.clear();\n    if (shapes) {\n        for (var i = 0; i < shapes.length; i++)\
  \ {\n            this.context.save();\n            shapes[i].draw(this.context);\n\
  \            this.context.restore();\n        }\n    }\n}\n```\n\n在这个方法中，我们获取模型希望我们绘制的每个形状的引用，并清除画布上任何已有的图形。然后我们遍历形状列表，让每个形状绘制自身。由于我们抽象了绘图接口，只要每个对象实现了\
  \ draw 方法，其实际类型对引擎来说并不重要。如你所见，我们在调用 draw 方法时，用上下文对象的 save 和 restore 两个方法进行了包裹。\n\
  \n这些方法用于在特定绘图形状改变上下文之前保存上下文的绘图状态，并在绘制完成后恢复到此状态。仅凭这些方法，我们就创造了一种在画布上反复绘制帧的方式。结合我们之前看到的\
  \ IDrawingModel 接口的以下实现，我们可以有效地模拟对象在屏幕上的移动：\n\n```\nclass DrawingModel implements\
  \ IDrawingModel {\n    public selection: IDrawingShape = null;\n    public shapes:\
  \ IDrawingShape[] = [];\n    constructor() {\n    }\n    public addShape(shape:\
  \ IDrawingShape) {\n        this.shapes.push(shape);\n    }\n    public getNewShape(location:\
  \ IPoint): IDrawingShape {\n        throw (\"Not implemented\");\n    }\n    public\
  \ getDrawingTool(): DrawingToolType {\n        return DrawingToolType.Select;\n\
  \    }\n}\n```\n\n这是该类的极简实现，我们稍后将填充 getNewShape 和 getDrawingTool 方法。不过目前，我们可以存储一个形状列表并将新形状添加到该列表，画布就能为我们重新绘制它们。如果我们修改前面示例中的应用程序代码，创建一个\
  \ DrawingModel 并把我们的形状添加进去，那么我们就可以编写代码来操作我们的矩形，并让它在屏幕上移动。\n\n```\nvar model: IDrawingModel\
  \ = new DrawingModel();\nmodel.addShape(shape1);\nvar engine: ICanvasEngine = new\
  \ CanvasEngine(canvas, model);\nfunction moveObject(counter: number, upperLimit:\
  \ number) {\n```\n\n```\nif (counter > upperLimit) {\n    return;\n}\nsetTimeout(()\
  \ => {\n    shape1.move(new Point(shape1.location.x + 1, shape1.location.y + 1));\n\
  \    engine.invalidate();\n    counter++;\n    moveObject(counter, upperLimit);\n\
  }, 20);\n}\nmoveObject(0, 75);\n```\n\n前面的代码实例化了一个 DrawingModel，向其中添加一个形状，实例化 CanvasEngine，并运行一个递归函数，使对象在画布上沿对角线移动。递归函数使用\
  \ setTimeout 函数让对象的移动产生轻微的延迟，否则对象移动的速度将快得超出我们追踪它的能力。我们再次使用 lambda 语法 `() => { }`，但因为我们不在对象的构造函数中，它只是生成函数的简写形式。然而，这个应用程序理应是以用户为中心的；因此，让我们看看如何挂接鼠标事件，以允许用户操作我们画布上的对象。\n\
  \n## 鼠标事件\n\n在我们的形状与鼠标之间的任何交互中，第一个动作将是一个选择事件。这将由与画布关联的 mousedown 事件来处理。这使我们能够使用点击并按住的功能，以及鼠标释放时的附加功能。mousedown\
  \ 事件处理程序如下例所示：\n\n```\nprivate _mousedown(e) {\n    var mouse: IPoint = this._getMousePosition(this._canvas,\
  \ e);\n    var i, shape;\n    if (this._model.shapes) {\n        for (i = this._model.shapes.length\
  \ - 1; i >= 0; i--) {\n            this._model.shapes[i].isSelected = false;\n \
  \       }\n    }\n    if (this._model.getDrawingTool() != DrawingToolType.Select)\
  \ {\n        shape = this._model.getNewShape(mouse);\n        this._model.addShape(shape);\n\
  \        this.action = CanvasEngineAction.Resize;\n        this._setShapeAsSelected(shape);\n\
  \        return;\n    }\n    else if (this._model.shapes) {\n        for (i = this._model.shapes.length\
  \ - 1; i >= 0; i--) {\n            this.action =\n            this._model.Shapes[i].getClickLocationAction(mouse,\
  \ this.context);\n            switch (this.action) {\n                case CanvasEngineAction.Resize:\n\
