  \ TypeScript 文件被编译时，它引用的所有其他 TypeScript 文件也会被编译。当只有少数文件被引用时，这是一个有用的功能，但随着应用程序的增长和依赖树变得更加复杂，你可能会遇到性能问题。允许隐式“any”类型告诉编译器如果对象的类型未给出或无法推断则不要失败。取消选中此选项是最简单的方式来强制自己完全拥抱类型系统。虽然你可能会遇到一些“any”类型不可避免的场景，但它们应该非常罕见。这可以通过提供类型注解来完成，如下所示：\n\
