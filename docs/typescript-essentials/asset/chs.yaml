  \n添加到自定义颜色\n\n## 小结\n\n在整章中，我们专注于用 TypeScript 从头到尾构建一个绘图应用程序。我们从应用程序的基本构建块（抽象）开始，然后创建了一套可复用的形状对象。这些对象随后被用于一组负责在\
  \ HTML5 画布上绘制它们的类中。接下来，我们构建了一个引擎，负责处理用户交互并从绘图对象请求信息以做出决策。最后，我们构建了一个模型来跟踪正在运行的应用程序中的所有形状对象。所有这一切都是使用\
  \ TypeScript 完成的，而且仅使用 TypeScript。不过，Web 开发中的一个常见做法是集成第三方库，例如 jQuery。在下一章中，我们将介绍一些可用的第三方库，以及如何将它们集成到你的项目中。\n"
- "# 第 6 章 声明文件与库集成\n\n到目前为止，我们一直在编写不集成任何外部 JavaScript 库的 TypeScript。我们已经涵盖了该语言在 JavaScript\
  \ 之上添加的各种概念，以及如何在构建大型应用程序时利用它们。我们一直忽略了 Web 上公开可用的所有第三方库，这些库可以改善 JavaScript 体验。在本章中，我们将介绍声明文件，以及它们如何帮助我们与其他\
  \ JavaScript 库集成。本章将涵盖的主题包括：\n\n- 声明文件\n- NuGet 包管理器\n- jQuery\n- Knockout\n- 外部模块\n\
  \n## 声明文件\n\n声明文件是 TypeScript 中一种特殊类型的源文件，并且具有不同的文件扩展名。声明文件的文件扩展名为 `.d.ts`，它们可以包含类型信息，但不包含实现细节。这包括接口定义和类型声明。\n\
  \n类型声明使用 `declare` 关键字创建，如下面的截图所示：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_181_0.png)\n\
  \n如你所见，文件名是 `Book.d.ts`，编译器正是通过这一点知道该文件将只包含声明。此时，不会创建任何输出文件，并且当文件中发现实现代码时，将生成错误。这些文件的目的是为不是\
  \ TypeScript 文件的其他 JavaScript 库提供类型信息。这使我们能够以强类型的方式与这些库交互，提供编译时检查和智能代码补全。在上一个示例中，我们声明\
  \ `Book` 类将存在于全局命名空间中，从而可以在整个项目中引用它。我们现在可以自由使用 `Book`，但如果没有为其提供实现，那么我们的应用程序在运行时只要引用了\
  \ `Book` 类型就会失败。\n\n正如我们在前面查看 TypeScript 编译器及其选项时所见，我们可以为自己的代码自动生成声明文件。这些声明文件可以从你自己的解决方案中的其他项目引用，也可以作为你分发的库的一部分进行部署。每输出一个\
  \ JavaScript 文件，就会对应输出一个声明文件。如果你将所有代码合并到单个文件中，那么将创建一个声明文件。从项目属性的 TypeScript 构建部分选择**生成声明文件**选项，将为编译器提供用于创建声明文件的适当参数，如下面的截图所示：\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_181_1.png)\n\n在整本书中，我们使用了各种并非由我们显式声明的类型。我们在绘图应用程序中使用的\
  \ `CanvasRenderingContext2D` 对象在 Visual Studio IntelliSense 中具有完整的类型信息列表，但我们从未见过它的声明或实现。这是因为\
  \ TypeScript 附带了一个 `lib.d.ts` 文件，它声明了数千个不同对象的类型信息。每次编译器运行时，都会自动引用这个声明文件。这个类型列表非常有用，但它不包含项目中可能引用或不引用的任何外部库中的类型。\n\
  \n## 第三方库集成\n\n大规模 Web 开发中的关键组件之一是使用为我们处理某些任务的开源库。jQuery 是较流行的库之一，用于轻松与**文档对象模型（DOM）**交互。这些库提供了各种各样的功能，但所有这些交互都可以赋予一定程度的类型化。在本节中，我们将研究以下库：\n\
  \n- jQuery\n- Knockout\n- RequireJS\n\n在开始开发这些库之前，我们需要先在项目中引用它们。这些库中的每一个都可以直接从其网页下载，或通过使用\
  \ NuGet 下载。NuGet 是 Visual Studio 的包管理器，可以作为扩展安装。\n\n![](img/83a7f7e1723158e56008cf70304a8da4_186_0.png)\n\
  \n我们将安装的 NuGet 包将包含我们要使用的库的代码，以及每个库的单独声明文件。不过，并非每个库都有与之关联的 NuGet 包或声明文件，但 Web 开发社区在这方面填补空白做得非常好。GitHub\
  \ 上的 **DefinitelyTyped** 仓库中有一个大型 TypeScript 库声明文件存储库。\n\n## 与 jQuery 集成\n\njQuery\
  \ 是 Web 上最流行的开源库之一。它可用于从 DOM 操作到简化远程服务器调用的各种场景。如果你计划构建大型 Web 应用程序，可能已经在计划使用 jQuery；如果没有，我强烈建议你使用。要开始使用\
  \ jQuery，我们需要做的第一件事是安装 jQuery NuGet 包。右键单击项目，然后选择**管理 NuGet 包**。这将弹出一个与更新和扩展窗口类似的窗口。在**联机**部分中的\
  \ nuget.org 仓库中找到 jQuery 并安装它。如下面的截图所示，此包安装了多个文件，帮助我们使用 jQuery 进行开发：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_187_0.png)\n\
  \n现在我们可以向 index.html 文件添加一个 script 标签，jQuery 将在运行时供我们使用。然而，在我们开发并编译 TypeScript 代码时，这用处不大，因为我们没有关于该库的任何类型信息。要导入此类型信息，我们需要一个代表\
  \ jQuery 库的声明文件。再次打开**管理 NuGet 包**窗口并搜索 jQuery.TypeScript。安装名为 **jquery.TypeScript.DefinitelyTyped**\
  \ 的包（在撰写本文时其版本为 1.3.5），以导入 jQuery 库的类型信息。\n\n### 提示\n\n还有许多其他库扩展了 jQuery，并且已经创建了相当多的声明文件来支持这些不同的扩展。\n\
  \n现在，jQuery 的类型信息已包含在项目中，我们将能够以更健壮的方式使用该库。让我们向 HTML 中添加一些元素，我们将使用 jQuery 库来操作这些元素。\n\
  \n\n\n\n![](img/83a7f7e1723158e56008cf70304a8da4_188_0.png)\n\n如你所见，我们已经将 jQuery\
  \ 的 script 标签添加到了文档的 head 标签中，并在 body 中添加了几个元素。第一个元素是一个带有蓝色背景的大正方形 div。第二个是一个按钮，用户将点击它来隐藏显示的蓝色\
  \ div 标签。现在我们有了要操作的对象，让我们创建一些 TypeScript 来执行预期的操作。\n\n为了在 TypeScript 编译器中以强类型方式使用\
  \ jQuery，我们必须将声明文件的引用放在我们希望使用它的 TypeScript 文件顶部。这是通过在 TypeScript 文件顶部使用特定格式完成的；将引用放在页面顶部以外的任何位置都会导致它们无法正常工作。在下面的示例中，你可以看到如何引用声明文件：\n\
  \n```typescript\n/// <reference path=\"scripts/typings/jquery/jquery.d.ts\" />\n\
  ```\n\n引用中包含的路径是相对于你当前正在处理的文件的。一旦添加了这个引用，我们就能够使用 IntelliSense 和代码补全来帮助我们处理 jQuery\
  \ API。\n\n![](img/83a7f7e1723158e56008cf70304a8da4_189_0.png)\n\n如你所见，我们获得了与 Visual\
  \ Studio 代码补全相关的完整功能集。\n\n### 提示\n\n当集成大量库时，通过创建 `_references.d.ts` 文件并仅向该文件添加引用来管理你的引用会更简单。然后，你的每个代码文件只需引用单个\
  \ `_references.d.ts` 文件，即可导入项目的所有相关类型信息。\n\n正如你在以下代码示例中所看到的，使用 jQuery 在 DOM 上定位对象并操作它们要容易得多，并且将减少我们为制作动态应用程序而必须生成的代码量：\n\
  \n```typescript\n/// <reference path=\"scripts/typings/jquery/jquery.d.ts\" />\n\
  $(document).ready(() => {\n    $(\"#hideButton\").click((event) => {\n        $(\"\
  #colorPanel\").hide(1000);\n    });\n});\n```\n\n文件中的第一个元素是对 jQuery 声明文件的引用。这使我们能够在\
  \ TypeScript 中使用 $ 表示法而不会生成编译器错误，但是，jQuery 仍然需要在运行时加载才能正常工作。我们等待 DOM 完成加载，这会触发函数委托被调用。此时，我们选择之前添加到\
  \ HTML 中的按钮，并监听其 click 事件触发。当发生这种情况时，会调用另一个函数委托，该委托使用 jQuery 的 UI 修改方法之一 hide，使大正方形\
  \ div 标签在 1000 毫秒内消失。现在如果运行该应用程序，隐藏按钮上方会有一个大的蓝色正方形。一旦点击按钮，你可以看到蓝色方块消失，UI 会为其消失进行调整。jQuery\
  \ 拥有非常庞大的功能和扩展集。要了解更多信息，我建议访问 [http://jquery.com/](http://jquery.com/) 获取 API 参考和示例。\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_191_0.png)\n\n如你所见，我们在 head 中包含了 jQuery\
  \ 和 Knockout 库。然后，在 HTML 的 body 中，我们拥有在 jQuery 示例中创建的两个元素。但是，这些元素现在都包含了绑定。`colorPanel`\
  \ div 使用 Knockout 的 visible 绑定绑定到 `IsVisible` 可观察对象。当 `IsVisible` 可观察对象发生变化时，Knockout\
  \ 将评估新值并操作 DOM 以显示或隐藏 div。该按钮绑定到视图模型上的多个元素：`toggleText` 对象将决定按钮的值是什么，以及 `toggleClick`\
  \ 方法，该方法将在 click 事件触发的任何时候执行。\n\n### 提示\n\nKnockout 支持许多不同类型的绑定，并且还有一个自定义绑定模型，允许你定义自己的绑定。访问\
  \ [www.knockoutjs.com](http://www.knockoutjs.com) 了解更多信息。\n\n好的，我们现在已经拥有了将 DOM 动态绑定到\
  \ TypeScript/JavaScript 的大部分构件，但我们实际上需要连接视图和视图模型。以下代码段展示了如何将两者绑定在一起：\n\n```javascript\n\
  $(document).ready(() => {\n    ko.applyBindings(new ViewModel());\n});\n```\n\n\
  如你所见，我们在应用绑定之前等待 DOM 就绪。如果在所有元素可用之前尝试绑定，运行时将发生错误。一旦 DOM 就绪，我们就创建 `ViewModel` 类的一个新实例并将其传递给\
  \ Knockout，其余工作将由 Knockout 处理。或者，你可以传入一个特定元素来绑定视图模型。现在当我们运行该应用程序时，它会以可见的大蓝色正方形开始，按钮的文本是\
  \ **隐藏**。然而，这不再是像之前那样的应用程序生命周期终点，按钮文本已经改变，我们可以执行另一个操作，如下面的截图所示：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_192_0.png)\n\
  \n## 使用 RequireJS\n\n在第 2 章 *TypeScript 基础*中，我们讨论了模块定义，但当时我们只关注了内部模块。当时提到了外部模块，但我们没有深入探讨。既然我们已经熟悉了集成外部库，我们将引入一个更常见的外部模块库。RequireJS\
  \ 是一个 JavaScript 模块加载器，用于确保应用程序执行期间使用的所有对象在必要时可用。这将允许我们将代码分离到不同的文件中，而不必担心它们的加载顺序，因为\
  \ RequireJS 将为我们管理这些。就像 jQuery 和 Knockout 一样，RequireJS 及其声明文件可以通过 NuGet 包管理器获得，也可以在线访问\
  \ www.requirejs.org 找到。本文使用的包是 \"RequireJS\" 版本 2.1.14 和 RequireJS.TypeScript.DefinitelyTyped\
  \ 版本 0.2.0。对于下一个示例，我们将需要所有三个库可用。让我们构建一个简单的应用程序，允许我们向目录中添加人员，然后搜索该目录。\n\nRequireJS\
  \ 是一个 **异步模块加载器（AMD）**，因此我们需要设置适当的项目设置。打开项目设置的 TypeScript Build 部分，并将 Module system\
  \ 选项设置为 AMD。现在，我们需要创建一个新模块，该模块将包含与表示目录人员的一组类型相关的所有代码。在项目的 Scripts 文件夹中创建一个名为 People.ts\
  \ 的新 TypeScript 文件。正如你在下面的示例中所看到的，我们定义了 IPerson 抽象，然后实现了它：\n\n```typescript\nexport\
  \ interface IPerson {\n    firstName: string;\n    lastName: string;\n    age: number;\n\
  }\nexport class Person implements IPerson {\n    constructor(public firstName: string,\
  \ public lastName: string, public age: number) {\n    }\n}\n```\n\nIPerson 接口和 Person\
  \ 类都使用了 export 关键字进行修饰，这将告诉编译器这些类型在引用此模块的其他模块中可用。生成的 JavaScript 与为内部模块生成的略有不同：\n\
  \n```javascript\ndefine([\"require\", \"exports\"], function(require, exports) {\n\
  \    (function (People) {\n        var Person = (function () {\n            function\
  \ Person(firstName, lastName, age) {\n                this.firstName = firstName;\n\
  \                this.lastName = lastName;\n                this.age = age;\n  \
  \          }\n            return Person;\n        })();\n        People.Person =\
  \ Person;\n    })(exports.People || (exports.People = {}));\n    var People = exports.People;\n\
  });\n```\n\n如你所见，普通的模块定义被包裹在另一个名为 `define` 的函数中，该函数接受一个依赖对象数组和一个在加载所有依赖模块时要调用的函数。接下来我们需要创建的是可以将\
  \ HTML 绑定到其上的视图模型。我们将需要用于新人员的三个输入值的可观察对象、我们想要搜索的值以及一个用于保存搜索结果的可观察数组。我们还需要一个方法来启动添加过程和一个方法来执行目录搜索。我们可以将所有这些代码放在一个单独的\
  \ TypeScript 文件中，并使用 `import` 和 `require` 关键字来包含我们刚刚创建的 People 模块：\n\n```typescript\n\
  import People = require(\"Scripts/People\");\nexport class PersonFinderViewModel\
  \ {\n    public peopleArray: KnockoutObservableArray<People.IPerson> = ko.observableArray([]);\n\
  \    public newFirstName: KnockoutObservable<string> = ko.observable(\"\");\n  \
  \  public newLastName: KnockoutObservable<string> = ko.observable(\"\");\n    public\
  \ newAge: KnockoutObservable<number> = ko.observable(null);\n    public searchValue:\
  \ KnockoutObservable<string> = ko.observable(\"\");\n    public searchResult: KnockoutObservableArray<People.IPerson>\
  \ = ko.observableArray([]);\n    constructor() {\n    }\n    public findPersonByFirstName(viewModel:\
  \ PersonFinderViewModel, event: JQueryEventObject) {\n        var people = this.peopleArray();\n\
  \        var searchValue = this.searchValue();\n        this.searchResult([]);\n\
  \        for (var i = 0; i < people.length; i++) {\n            if (searchValue\
  \ === people[i].firstName) {\n                this.searchResult.push(people[i]);\n\
  \            }\n        }\n    }\n    public addNewPerson(viewModel: PersonFinderViewModel,\
  \ event: JQueryEventObject) {\n        var newPerson = new People.Person(this.newFirstName(),\
  \ this.newLastName(), this.newAge());\n        this.peopleArray.push(newPerson);\n\
  \        this.newFirstName(\"\");\n        this.newLastName(\"\");\n        this.newAge(null);\n\
  \    }\n}\n```\n\n如你所见，我们向 require 函数提供了 People 模块的路径，这告诉 RequireJS 将该模块添加到传递给 define\
  \ 方法的模块列表中，同时也告诉 TypeScript 编译器相关类型信息。我们定义了一个人员列表，该列表将作为完整的目录列表存储，新人员字段的可观察对象、搜索可观察对象，以及将绑定到\
  \ click 事件的两个方法。`findPersonByFirstName` 方法检索 `searchValue` 可观察对象的最新值以及我们将要搜索的人员列表。\n\
  \n\n\n\n\n我们将 jQuery 和 Knockout 的引用包含在全局命名空间中，然后使用一个 script 标签引入 require。require\
  \ 标签中包含一个名为 `data-main` 的绑定，用于定义应用程序的入口点。\n\n**注意**\n\n有关 RequireJS 的更多信息，请访问 [http://requirejs.org/](http://requirejs.org/)。\n\
  \n在 HTML 的 body 部分，我们有标签和输入框定义了 UI 并绑定到视图模型中的各个对象。搜索结果部分做了一些新的事情，值得注意。使用 `searchResult`\
  \ 可观察数组上的 `foreach` 绑定，我们为数组中的每个项创建了一个模板。这些绑定的上下文基于正在迭代的项的类型，在我们的例子中是一个 Person 对象。\n\
  \n虽然 `firstName`、`lastName` 和 `age` 属性不是可以绑定的可观察对象，但绑定只会发生一次。如果这些字段的值发生变化，UI 不会被更新。我们需要做的最后一件事是创建应用程序的入口点。我们需要导入创建的视图模型，等待\
  \ DOM 就绪，然后应用我们的绑定：\n\n```javascript\nimport PersonFinderViewModel = require(\"\
  Scripts/PersonFinderViewModel\");\n$(document).ready(() => {\n    ko.applyBindings(new\
  \ PersonFinderViewModel.PersonFinderViewModel());\n});\n```\n\n现在我们可以运行应用程序并向目录中添加多个用户。当我们按名字搜索某人时，所有匹配的结果都将被显示：\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_197_0.png)\n"
- "# 第 7 章. 增强绘图应用程序\n\n当我们在第 5 章 *创建简单的绘图应用程序* 中开始绘图应用程序时，我们按功能将所有代码分组在一起。这使我们能够减少应用程序运行所需的\
  \ script 标签数量。利用我们在上一章中学到的知识，我们将修改绘图应用程序以使用 AMD 模块和 RequireJS。我们还将集成 Knockout 和\
  \ jQuery 以改善整体用户体验。最后，我们将查看如何使用 RequireJS 将所有应用程序代码构建成单个压缩文件以进行部署优化。我们将对应用程序进行的增强包括：\n\
  \n- 转换为 AMD 模块\n- 绑定用户控件\n- 生成单个输出文件\n- 美化应用程序\n\n### 转换为 AMD 模块\n\n转换为 AMD 模块是一个相当简单的过程。然而，这是一个审视项目结构和可维护性的好时机。在开始之前，我们必须安装\
  \ RequireJS NuGet 包版本 2.1.14 以及相应的声明文件 requirejs.TypeScript.DefinitelyTyped 版本 0.2.0。\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_202_0.png)\n\nTypeScript 构建设置也必须更改为使用上一章所示的\
  \ AMD 模块系统。一旦这些步骤完成，我们就可以开始增强我们的应用程序。为此，我们希望为应用程序添加一个文件夹结构，以帮助我们根据功能轻松分离模块。此时，重要的是决定如何划分应用程序的代码。由于我们使用的是\
  \ RequireJS 模块，我们将使用 export 关键字为所有希望从其他模块使用的对象。我们可以使用 export 关键字有三种方式，每种方式对生成的 JavaScript\
  \ 都有不同的影响。以下示例显示了该关键字的更常见用法：\n\n```\nexport class Freehand implements IFreehand\
  \ {\n    public points: Array<IPoint> = [];\n    constructor() {\n    }\n    public\
  \ AddPoint(point: IPoint) {\n        this.points.push(point);\n    }\n}\n```\n\n\
  在此示例中，export 关键字注释了类型声明。这告诉 TypeScript 编译器将此类型放置在正在生成的模块的 exports 对象上。\n\n**提示**\n\
  \nexport 关键字只有在向编译器提供 `--module` 标志时才可用。尝试在不提供此选项的情况下使用它将导致编译器错误。Visual Studio 在项目属性的\
  \ TypeScript Build 部分中选择模块系统时提供此标志。\n\n此类定义的 resulting JavaScript 将与我们之前的模块定义非常相似。然而，由于我们选择使用\
  \ AMD 模块，会添加一些特殊语法：\n\n```\ndefine([\"require\", \"exports\"], function(require,\
  \ exports) {\n    var Freehand = (function () {\n        function Freehand() {\n\
  \            this.points = [];\n        }\n        Freehand.prototype.AddPoint =\
  \ function (point) {\n            this.points.push(point);\n        };\n       \
  \ return Freehand;\n    })();\n    exports.Freehand = Freehand;\n});\n```\n\nAMD\
  \ 模块和标准 JavaScript 模块之间的差异从定义的最开始就显而易见。AMD 规范提供了一个名为 define 的函数，用于协助模块加载器。虽然这里只显示了该函数的两个参数，但该函数可选地接受一个在生成的\
  \ JavaScript 代码中显示的两个参数之前的前置参数。此可选第一个参数是模块的标识符，我们将在本章后面讨论此参数，以便我们想将最终的应用程序代码压缩时。define\
  \ 函数的第二个参数是模块依赖项列表。我们在项目中用来引用另一个模块的每个 require 语句都将包含在此列表中。第三个也是最后一个参数是我们定义模块的唯一强制参数，它是一个将执行以实例化对象或模块的函数。提供给\
  \ define 函数的每个依赖项都将作为参数提供给函数，以便在模块内部使用。\n\nexport 关键字也可以分配给一个类型。在以下示例中，你可以看到我们不是用\
  \ export 关键字装饰我们的类，而是改用赋值运算符为其赋予新值：\n\n```\nclass Circle implements ICircle {\n\
  \    constructor(public radius: number) {\n    }\n    public resize(radius: number)\
  \ {\n        this.radius = radius;\n    }\n    public area(): number {\n       \
  \ return Math.PI * this.radius * this.radius;\n    }\n}\nexport = Circle;\n```\n\
  \n使用此方法将我们限制为从文件中导出单个类型；然而，此类型可以是包含任意数量导出对象的模块。生成的 JavaScript 看起来像以下代码：\n\n```\n\
  define([\"require\", \"exports\"], function(require, exports) {\n    var Circle\
  \ = (function () {\n        function Circle(radius) {\n            this.radius =\
  \ radius;\n        }\n        Circle.prototype.resize = function (radius) {\n```\n\
  \n\n\n\n\n```typescript\nexport import DrawingToolType =\nrequire('Scripts/Drawing/Enums/DrawingToolType');\n\
  ```\n\n![](img/83a7f7e1723158e56008cf70304a8da4_205_0.png)\n\n等等一下；这些并不是我们枚举的值。出了什么问题？好吧，这与编译器如何解释导入后又导出的\
  \ `CanvasEngineAction` 枚举的返回类型有关。枚举是对数字的巧妙表示，因此类型系统会将返回类型读取为数字，并判定这些必须是我们的可用选项。模块和类没有这个问题，因为它们的类型是唯一的。为了解决这个问题，我们只需要正确地为\
  \ action 变量指定类型，我们的枚举就会按预期工作。\n\n![](img/83a7f7e1723158e56008cf70304a8da4_205_1.png)\n\
  \n所有这些方法都是完全有效且适用于不同需求的。随着我们重构绘图应用程序，我们将使用这些方法的组合来将代码拆分为逻辑分组。使用 TypeScript 编译器并不是我们分割代码的唯一方式。保持代码在将相似对象分组的目录结构中，会使代码功能之间的区分变得容易。在下面的屏幕截图中，你可以看到我们为通用形状对象创建了一个单独的目录，与任何绘图相关逻辑分开。绘图代码也根据每个分组将包含的功能被细分为更精细的子部分。\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_206_0.png)\n\n现在我们可以开始将代码拆分为单独的文件，每个文件服务于不同的特定目的。我们可以将特定区域的所有接口类型放在一个名为\
  \ `<Area>Types.ts` 的单个 TypeScript 文件中，例如 `ShapeTypes.ts`。这将为我们提供一个引用接口和枚举的地方，同时将类和实际实现代码分开。每个接口都应使用\
  \ `export` 关键字进行装饰，以确保我们能够以一致的方式与所有这些类型进行交互。接下来，我们需要决定如何构建实现代码。每个不同的形状对象都可以拆分为单独的代码文件并放置在我们创建的\
  \ `Shapes` 目录中。然而，这些类中的代码量很小且相对容易管理，因此我们可以轻松地将它们全部放在一个模块中。如果实现开始像绘图相关对象那样增长，我们将希望为每种类型准备单独的文件以保持代码清晰且易于维护。\n\
  \n`Shapes.ts` 文件的完整内容如下所示：\n\n```typescript\nimport ShapeTypes = require('Scripts/Shapes/ShapeTypes');\n\
  export class Point implements ShapeTypes.IPoint {\n    constructor(public X: number,\
  \ public Y: number) {\n    }\n}\nexport class Line implements ShapeTypes.ILine {\n\
  \    constructor(public p1: ShapeTypes.IPoint, public p2: ShapeTypes.IPoint) {\n\
  \    }\n    public Length(): number {\n        var a2 = Math.pow(this.p2.X - this.p1.X,\
  \ 2);\n        var b2 = Math.pow(this.p2.Y - this.p1.Y, 2);\n        return Math.sqrt(a2\
  \ + b2);\n    }\n}\nexport class Rectangle implements ShapeTypes.IRectangle {\n\
  \    constructor(public Height: number, public Width: number) {\n    }\n    public\
  \ Resize(height: number, width: number) {\n        this.Height = height;\n     \
  \   this.Width = width;\n    }\n}\nexport class Freehand implements ShapeTypes.IFreehand\
  \ {\n    public Points: Array<ShapeTypes.IPoint> = [];\n    constructor() {\n  \
  \  }\n    public AddPoint(point: ShapeTypes.IPoint) {\n        this.Points.push(point);\n\
  \    }\n}\nexport class Circle implements ShapeTypes.ICircle {\n    constructor(public\
  \ Radius: number) {\n    }\n    public Resize(radius: number) {\n        this.Radius\
  \ = radius;\n    }\n    public Area(): number {\n        return Math.PI * this.Radius\
  \ * this.Radius;\n    }\n}\n```\n\n正如你所见，我们导入了 `ShapeTypes` 模块，这使我们能够访问为形状创建的所有抽象。通常，接口在\
  \ TypeScript 类型系统中在全局级别可用。然而，由于我们用 `export` 关键字装饰了它们，它们已被放置在没有关联代码的模块类型上。我们通过此模块类型引用每个接口。然而，生成的\
  \ JavaScript 中不包含对其的引用。现在，我们应该进入应用程序的 Drawing 区域并相应地划分这些类型。我们将从接口和枚举开始，因为它们是最基本的类型，实现代码在没有它们的情况下无法工作。\n\
  \n每个枚举可以放在自己的文件中，而所有接口将放在单个 `DrawingTypes.ts` 文件中。由于我们的一些接口引用了枚举，我们将需要在 `DrawingTypes`\
  \ 文件中导入它们。这是一个特别好的时机，可以结合使用 `export` 和 `import` 关键字将枚举附加到 `DrawingTypes` 模块。这将使我们能够以与在应用程序中访问接口相同的方式访问这些枚举。接下来，让我们将绘图形状拆分为单独的文件。这些类中的每一个都需要大量的代码，将它们分离到单独的代码文件中将使我们更容易维护它们。下面的屏幕截图显示了\
  \ Drawing 目录中的每个不同文件：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_208_0.png)\n\n\
  我们将把它们重新组合成一个名为 `DrawingShapes` 的单个模块，我们将直接使用它来访问这些类型。`DrawingShapes` 模块只不过是一系列\
  \ export import，如以下代码所示：\n\n```typescript\nexport import DrawingShapeBase =\nrequire('Scripts/Drawing/DrawingShapes/DrawingShapeBase');\n\
  export import DrawingRectangle =\nrequire('Scripts/Drawing/DrawingShapes/DrawingRectangle');\n\
  export import DrawingLine =\nrequire('Scripts/Drawing/DrawingShapes/DrawingLine');\n\
  ```\n\n`DrawingModel` 和 `CanvasEngine` 文件将导入它们需要的模块并将其中包含的类分配给 export 对象。既然我们所有的代码现在都在\
  \ AMD 模块中，我们就可以修改我们的 HTML 以仅加载应用程序的主入口点 `app.js`，它位于项目的根目录，其余模块将在程序执行过程中按需加载。\n\n\
  ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\"\
  \ />\n    <title>TypeScript HTML App</title>\n    <link rel=\"stylesheet\" href=\"\
  app.css\" type=\"text/css\" />\n</head>\n<body>\n    <h1>Drawing Application</h1>\n\
  \    <div id=\"content\">\n        <div>\n            <button id=\"selectButton\"\
  >Select</button>\n            <button id=\"rectangleButton\">Rectangle</button>\n\
  \            <button id=\"lineButton\">Line</button>\n            <input type=\"\
  color\" id=\"colorPicker\" />\n        </div>\n        <canvas id=\"drawingCanvas\"\
  \ height=\"400\" width=\"570\"\n                style=\"border: 4px solid black;\"\
  ></canvas>\n    </div>\n    <script data-main=\"app.js\" src=\"scripts/require.js\"\
  ></script>\n</body>\n</html>\n```\n\n## 绑定用户控件\n\n现在我们已将应用程序转换为使用 AMD 模块，让我们逐步增加应用程序的复杂性。目前，我们在\
  \ DOM 中搜索单个元素并为其附加事件处理程序。这不一定是坏事；然而，它确实使我们的代码容易受到许多可能问题的困扰。DOM 可能尚未完成我们尝试附加到的对象的渲染，或者该对象可能已被另一段代码移除。这种方法另一个陷阱是，如果我们想向应用程序添加另一种绘图形状类型，我们必须在\
  \ HTML 中添加另一个元素，然后再添加更多代码来添加事件处理程序。这效率低下，并且可能导致在某处犯错。幸运的是，有许多可用的库允许我们实现诸如 **Model\
  \ View Controller (MVC)** 和 **Model View ViewModel (MVVM)** 之类的绑定模式。Knockout 就是其中一个库，它将\
  \ MVVM 引入 JavaScript 和 TypeScript 开发。\n\n\n\n\n\n## 可复用的控件\n\n在上一章中，我们了解了 Knockout\
  \ 及其 foreach 绑定，它允许我们在 HTML 中创建一个模板，数组中的每个对象都会绑定到该模板上。我们将把相同的概念应用于绘图应用程序的每一个选项。其中一些对象在类型和功能上非常相似，例如类型选择控件。然而，颜色选择器需要实现的界面则非常不同。这时，Knockout\
  \ 模板绑定就派上用场了。\n\nKnockout 模板绑定允许我们为特定的对象类型提供 HTML 模板。这使我们能够将 HTML 与正在运行的 JavaScript\
  \ 分离开来。在本例中，我们将有一个用户控件列表，显示在画布对象上方的空间中。在创建要绑定到的模板之前，我们需要定义它们将绑定到的抽象。该抽象的最顶层是 IUserControl\
  \ 类型，它包含 id 和 templateName 两个属性，这是将我们的 DOM 元素绑定到它上面的最低要求：\n\n```\nexport interface\
  \ IUserControl {\n    id: string;\n    templateName: string;\n}\n```\n\n我们还需要一些接口来表示工具选择按钮和颜色选择器。这些接口更加专注于它们各自的直接功能，但只要它们提供了与之匹配的模板名称，我们所有的绑定都将无缝地进行。这些接口将定义在\
  \ Controls 目录下名为 ControlsTypes.ts 的文件中，代码如下：\n\n```\nexport interface IUpdateObservable\
  \ {\n    observable: KnockoutObservable<any>;\n}\nexport interface IToolSelectionControl\
  \ extends IUserControl,\nIUpdateObservable {\n    toolType: DrawingTypes.DrawingToolType;\n\
  \    click(viewModel: any, event: JQueryEventObject);\n    observable: KnockoutObservable<DrawingTypes.DrawingToolType>;\n\
  \    buttonText: KnockoutObservable<string>;\n}\nexport interface IColorSelectionControl\
  \ extends IUserControl,\nIUpdateObservable {\n    change(viewModel: any, event:\
  \ JQueryEventObject);\n    observable: KnockoutObservable<string>;\n}\n```\n\n如你所见，IToolSelectionControl\
  \ 接口有一个 toolType 属性，用于存储这个控件所负责的值。还有一个 click 函数，它将作为我们稍后要创建的 HTML 绑定中的事件处理器。其余两个对象是\
  \ Knockout observable，其中一个将用于通知调用应用程序已选择了新工具，另一个将用于定义按钮所显示的文本。IColorSelectionControl\
  \ 接口以与 IToolSelectionControl 接口相同的方式扩展了 IUserControl，但这里的附加属性却大不相同。该接口定义了一个 change\
  \ 方法，当颜色输入的 change 事件触发时，该方法将被调用。该接口的最后一个属性与 IToolSelectionControl 接口上的 observable\
  \ 属性非常相似。两者之间的主要区别在于它们存储的类型不同；在本例中，我们存储的是代表当前颜色的字符串值。由于这两个接口之间关系紧密，我们抽象出了 IUpdateObservable\
  \ 接口，然后在更细粒度的接口中提供了更具体的类型定义体验。\n\n现在我们已经定义了接口，就可以构建 HTML 模板来表示我们想要创建的不同控件了。第一个模板将只包含一个应用了自身绑定的按钮元素。第二个模板是颜色选择器，它具有一组专门针对此元素类型的独特绑定。最后，我们必须修改当前容纳控件的\
  \ HTML 区域。如你所见，生成的 HTML 中没有直接定义控件，但是当控件被添加到名为 userControls 的可观察列表时，它们就会出现在我们的应用程序中：\n\
  \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\" />\n\
  <title>TypeScript HTML App</title>\n<link rel=\"stylesheet\" href=\"app.css\" type=\"\
  text/css\" />\n<link rel=\"stylesheet\" href=\"DrawingApplication.css\" type=\"\
  text/css\" />\n<script src=\"Scripts/jquery-2.1.1.js\"></script>\n<script src=\"\
  Scripts/knockout-3.1.0.js\"></script>\n<script data-main=\"app\" src=\"Scripts/require.js\"\
  ></script>\n</head>\n<body>\n<h1>Drawing Application</h1>\n<div id=\"content\">\n\
  <div data-bind=\"foreach: userControls\">\n<span data-bind=\"attr: { id: id }, template:\
  \ { name: templateName }\"></span>\n</div>\n<canvas id=\"drawingCanvas\" height=\"\
  400\" width=\"570\" />\n</div>\n</body>\n</html>\n<script type=\"text/html\" id=\"\
  ButtonTemplate\">\n<button class=\"tool-select-button\" data-bind=\"text: buttonText,\
  \ click: click, css: { 'selected': isSelected }\" />\n</script>\n<script type=\"\
  text/html\" id=\"ColorPickerTemplate\">\n<input type=\"color\" data-bind=\"event:\
  \ { change: change }\" />\n</script>\n```\n\n如你所见，我们使用 foreach 绑定为 UserControls\
  \ 列表中的每个对象创建一个新控件，我们的 HTML 将绑定到这个列表。在该绑定内部，有一个 span 元素绑定到 IUserControl 接口。我们的画布对象暂时保持不变，但页面底部出现了一些新元素。这些新的\
  \ script 标签将包含用户控件要绑定到的 HTML 模板。按钮模板围绕工具选择控件接口创建绑定，将文本绑定到 ButtonText observable，并将\
  \ click 事件绑定到 click 函数。颜色选择器只需要将 change 事件绑定到 Change 方法。\n\n最后一步是实现我们的每个接口，并将视图模型绑定到\
  \ DOM。这些类型中的每一个都将放在 controls 目录下的单独文件中。所有文件都可以在下面的截图中看到：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_214_0.png)\n\
  \n我们将从基础用户控件对象开始，它位于 UserControlBase.ts 文件中，我们其余的类型都将扩展它：\n\n```\nimport ControlsTypes\
  \ = require('Scripts/Controls/ControlsTypes');\nclass UserControlBase implements\
  \ ControlsTypes.IUserControl {\n    public templateName: string = \"TemplateNotProvided\"\
  ;\n    constructor(public id: string) {\n    }\n}\nexport = UserControlBase;\n```\n\
  \nid 属性作为必填属性传入，因此它总是有值。templateName 字符串默认被设置为一个无效值，这确保了任何扩展 UserControl 类型的类型都会被强制更新该属性。如果提供了无效的模板名称，Knockout\
  \ 将在运行时生成错误。但是，如果提供的是空字符串，执行将继续正常进行。现在，让我们来实现工具选择按钮：\n\n```\nimport ControlsTypes\
  \ = require('Scripts/Controls/ControlsTypes');\nimport UserControlBase = require('Scripts/Controls/UserControlBase');\n\
  import DrawingTypes = require('Scripts/Drawing/DrawingTypes');\nclass ToolSelectionControl\
  \ extends UserControlBase\n    implements ControlsTypes.IToolSelectionControl {\n\
  \    public buttonText: KnockoutObservable<string> = ko.observable(\"\");\n    constructor(id:\
  \ string, public toolType: DrawingTypes.DrawingToolType,\n        public observable:\
  \ KnockoutObservable<DrawingTypes.DrawingToolType>) {\n        super(id);\n    \
  \    this.templateName = \"ButtonTemplate\";\n        this.buttonText(DrawingTypes.DrawingToolType[this.toolType]);\n\
  \    }\n}\n```\n\n```\n```typescript\npublic click(viewModel: any, event: JQueryEventObject)\
  \ {\n    this.observable(this.toolType);\n}\n}\nexport = ToolSelectionControl;\n\
  ```\n```\n\n这里的整体代码并不花哨，但它让我们可以用比以前少得多的精力添加新的工具按钮。该类型的构造函数接收对象的 ID 以传递给基类构造函数、对象实例将要表示的\
  \ DrawingToolType 值，以及一个在按钮被点击时将被更新的 Knockout observable。由于这是一个具体实现，我们必须提供一个有效的\
  \ HTML 模板名称，最后，我们使用了一点枚举魔法来为按钮文本提供值。click 事件所做的只是将存储的工具类型赋给创建对象时提供的 observable。颜色选择控件的实现甚至更简单：\n\
  \n```\n```typescript\nimport ControlsTypes = require('Scripts/Controls/ControlsTypes');\n\
  import UserControlBase = require('Scripts/Controls/UserControlBase');\nclass ColorSelectionControl\
  \ extends UserControlBase\n    implements ControlsTypes.IColorSelectionControl {\n\
  \    constructor(id: string, public observable: KnockoutObservable<string>)\n  \
  \  {\n        super(id);\n        this.templateName = \"ColorPickerTemplate\";\n\
  \    }\n    public change(viewModel: any, event: JQueryEventObject) {\n        this.observable((<any>event.currentTarget).value);\n\
  \    }\n}\nexport = ColorSelectionControl;\n```\n```\n\n\n\n\n\n## 创建视图模型\n\n现在我们已经设置好了可复用控件，需要创建应用程序将绑定的视图模型，并对现有类型进行一些修改，以确保程序顺利运行。为了维护单一职责模式，我们应该创建一个新的模型供\
  \ UI 绑定，而不是使用负责维护应用程序中形状状态的 DrawingModel 类。这个新模型将使用 Knockout 绑定到 DOM，并负责创建和维护应用程序的状态。它将位于\
  \ Drawing 目录下的 DrawingModel.ts 文件中。在创建此模型之前，我们需要修改现有的绘图模型，以便当用户与控件交互时，应用程序视图模型能够更新绘图模型。如你所见，在提供的新接口定义中，我们将绘图工具和绘图颜色属性设为公共成员：\n\
  \n```\nexport interface IDrawingModel {\n    selection: IDrawingShape;\n    shapes:\
  \ IDrawingShape[];\n    addShape(shape: IDrawingShape);\n    getNewShape(location:\
  \ ShapeTypes.IPoint): IDrawingShape;\n    drawingTool: DrawingToolType;\n    drawingColor:\
  \ string;\n}\n```\n\ngetDrawingTool 方法不再有必要，因为我们提供了对底层实例成员的公共访问。如果我们处理的是已发布的软件，我们不希望直接修改此接口，而应扩展它并为\
  \ DrawingModel 类型提供新的实现。然而，由于这只是一个示例应用程序，我们可以修改它以改进整体设计，尽管这会导致破坏性更改。只需修改此类的内部实现以及\
  \ canvas 引擎中的一处引用，即可让应用程序恢复正常工作。\n\n一旦完成了这些修复，我们就可以有效地设计应用程序视图模型，该模型将位于 Scripts\
  \ 目录下的 DrawingApplicationModel.ts 文件中：\n\n```\nimport ControlsTypes = require('Scripts/Controls/ControlsTypes');\n\
  import DrawingModel = require('Scripts/Drawing/DrawingModel');\nimport CanvasEngine\
  \ = require('Scripts/Drawing/CanvasEngine');\nimport Controls = require('Scripts/Controls/Controls');\n\
  import DrawingTypes = require('Scripts/Drawing/DrawingTypes');\n\nclass DrawingApplicationModel\
  \ {\n    public userControls: KnockoutObservableArray<ControlsTypes.IUserControl>\
  \ =\n        ko.observableArray([]);\n    public selectedToolType: KnockoutObservable<DrawingTypes.DrawingToolType>\
  \ =\n        ko.observable(DrawingTypes.DrawingToolType.Select);\n    public selectedColor:\
  \ KnockoutObservable<string> =\n        ko.observable(\"#000000\");\n    private\
  \ _drawingModel: DrawingTypes.IDrawingModel;\n\n    constructor(canvas: HTMLCanvasElement)\
  \ {\n        this._drawingModel = new DrawingModel();\n        var engine = new\
  \ CanvasEngine(canvas, this._drawingModel);\n        this._buildControls();\n  \
  \      this._createSubscriptions();\n    }\n    private _buildControls() {\n   \
  \     var selectionControl = new Controls.ToolSelectionControl(\"selectButton\"\
  ,\n            DrawingTypes.DrawingToolType.Select, this.selectedToolType);\n  \
  \      var rectangleControl = new Controls.ToolSelectionControl(\"rectangleButton\"\
  ,\n            DrawingTypes.DrawingToolType.Rectangle, this.selectedToolType);\n\
  \        var lineControl = new Controls.ToolSelectionControl(\"lineButton\",\n \
  \           DrawingTypes.DrawingToolType.Line, this.selectedToolType);\n       \
  \ var colorControl = new Controls.ColorSelectionControl(\"colorPicker\",\n     \
  \       this.selectedColor);\n        this.userControls.push(selectionControl, rectangleControl,\n\
  \            lineControl, colorControl);\n    }\n    private _createSubscriptions()\
  \ {\n        this.selectedToolType.subscribe((newValue) => {\n            if (this._drawingModel)\
  \ {\n                this._drawingModel.drawingTool = newValue;\n            }\n\
  \        });\n        this.selectedColor.subscribe((newValue) => {\n           \
  \ if (this._drawingModel) {\n                this._drawingModel.drawingColor = newValue;\n\
  \            }\n        });\n    }\n}\nexport = DrawingApplicationModel;\n```\n\n\
  我们将需要三种 Knockout 可观察类型：一种用于我们希望显示的控件，另一种用于维护当前选中的控件，最后一种用于跟踪当前颜色。该视图模型还会根据需要创建和修改绘图模型和\
  \ canvas 引擎对象。构造函数接收 HTMLCanvasElement，引擎会将其作为参数使用，而应用程序的其余部分都被隔离在这个类中。我们有两个私有初始化方法。第一个方法构建\
  \ DOM 所绑定的控件数组。如你所见，我们现在使用代码来定义这些对象，而不是直接操作 DOM。每个工具选择控件都会接收应用程序模型用来跟踪 IUpdateObservable\
  \ 接口中 observable 对象状态的 observable。另一方面，颜色选择器接收 selectedColor 可观察对象。如你所见，现在只需添加几行代码即可创建一个全新的按钮：\n\
  \n```\nvar freehandControl = new Controls.ToolSelectionControl(\"freehandButton\"\
  ,\n    DrawingTypes.DrawingToolType.Freehand, this.selectedToolType);\nthis.userControls.push(freehandControl);\n\
  ```\n\n一旦所有这些对象都被实例化，它们就会被添加到控件数组中，从而使\n\n## 生成单个输出文件\n\n在我们绘图应用的原始版本中，只需下载六个文件到客户端浏览器：一个单独的\
  \ CSS 文件、我们的 app.js 文件，以及包含我们对象类型的文件。每个文件都是一个独立的 Web 请求，并且必须加载所有文件后，我们的应用程序才能运行。\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_220_0.png)\n\n这是一个相对快速的过程，平均耗时不到 100\
  \ 毫秒，具体取决于网络延迟。然而，在我们追求创建大规模可维护应用程序的过程中，代码文件的数量激增。现在，在应用程序成功完成所有功能之前，需要将超过 20 个文件加载到客户端浏览器中。这导致我们的加载时间比以前增加了一倍以上，如下面的网络流量截图所示：\n\
  \n![](img/83a7f7e1723158e56008cf70304a8da4_221_0.png)\n\n这种加载时间的延迟对于开发目的来说是完全可接受的（事实上，正如我们将在下一章看到的，它实际上是更可取的）。但是，如果我们计划让消费者使用我们的应用程序，就需要减少\
  \ JavaScript 输出的体积。在实现 AMD 模块之前，这就像向编译器提供 --out 参数或更改我们在 Visual Studio 中的 TypeScript\
  \ 构建设置一样简单。然而，当提供了 module 标志时，这是不可能的。\n\n为了将所有生成的 JavaScript 模块编译到单个文件中，我们至少还需要一个工具。Node.js\
  \ 是一个很棒的平台，提供了大量功能，其主要功能是帮助创建可扩展的网络应用程序。可从 http://nodejs.org/ 下载。Node 提供了大量功能，我鼓励你阅读\
  \ API 文档和示例以了解更多信息。在我们的场景中，我们将把它用作 JavaScript 运行时环境。这将使我们能够使用 r.js 来追踪所有 RequireJS\
  \ 语句，并构建一个优化的模块列表。\n\n![](img/83a7f7e1723158e56008cf70304a8da4_222_0.png)\n\n一旦安装了\
  \ Node.js，我们就可以从命令行以及通过 PowerShell 使用它。我们将把它与 r.js 结合使用，r.js 是在我们安装 RequireJS NuGet\
  \ 包时安装到 Visual Studio 项目中的。这个库是 RequireJS 的优化器，可以在 Node 和 Rhino 中运行。\n\n### 注意\n\
  \n> 有关 Rhino 的更多信息，请访问 https://developer.mozilla.org/en-US/docs/Mozilla/Projects/Rhino。\n\
  \n优化器需要一些参数来决定如何生成输出。我们必须提供名称、输出结果文件的路径、一个告诉优化器在应用程序中搜索所有嵌套依赖项的标志，以及 r.js 在执行优化时应查看的路径。我们将把这些选项放在一个独立的\
  \ JavaScript 文件中，如果我们想要更改最终代码的生成方式，可以修改该文件：\n\n```\n({\n    name: \"DrawingApplication\"\
  ,\n    out: \"DrawingApplication.js\",\n    findNestedDependencies: true,\n    optimize:\
  \ \"none\",\n    paths: {\n        'DrawingApplication': 'app'\n    }\n})\n```\n\
  \n如你所见，所有这些选项都放在一个 JSON 对象中，该对象将提供给 RequireJS 优化器。这里的一个额外标志是 optimize 标志，它决定\n\n\
  \n\n是否应该对代码进行压缩。\n\n## 注意\n\n有关 r.js 优化器的更多信息，请访问 http://requirejs.org/docs/optimization.html。\n\
  \n为了保持可读性，我们目前将其保留为 none。当我们真正想要部署代码时，只需注释掉此选项，所有代码都将被放置在单个文件的一行中。我们生成优化后的 JavaScript\
  \ 输出文件必须做的最后一件事是创建一个简单的 PowerShell 脚本，该脚本将运行优化器并提供我们的选项：\n\n```\ncls\nwrite-host\
  \ '-Building Drawing Application'\nnode Scripts/r.js -o buildSingleFile.js\n```\n\
  \n在此脚本中，我们清除当前屏幕，记录一些输出，最后使用 Node.js 运行 RequireJS 优化器。如果一切按预期进行，优化器将提供跟踪输出，让我们知道应用程序所需的所有模块都已包含在优化中。以下屏幕截图显示了运行脚本的输出，如您所见，所有\
  \ JavaScript 依赖项都已包含在构建中：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_223_0.png)\n\
  \n此过程的最后一步是修改我们的 HTML 页面以指向生成的输出文件。在此之前，我们必须了解我们刚刚运行的 PowerShell 脚本的输出。如前所述，AMD\
  \ 模块有三个参数；\n\n## 样式化应用程序\n\n到目前为止，我们只介绍了开发应用程序源代码的方式。然而，对应用程序进行样式设置与功能一样重要。我们编写的代码可以完全没有错误，但如果应用程序的外观和感觉不佳，用户就不会采用它。传统上，在使用\
  \ HTML 页面开发 Web 应用程序时，我们会使用层叠样式表（CSS）来设置对象的样式。然而，与 TypeScript 改进 JavaScript 开发的方式类似，一种名为\
  \ LESS 的语言已被开发出来，可编译为纯 CSS。LESS 可从 http://lesscss.org/ 单独下载，或在 Visual Studio 的情况下，可通过\
  \ Mads Kristensen 的 Web Essentials 插件安装。此插件可通过扩展和更新窗口获得，就像 NuGet 包管理器一样。\n\n![](img/83a7f7e1723158e56008cf70304a8da4_227_0.png)\n\
  \n安装后，我们可以向应用程序添加 LESS 样式表。LESS 具有大量非常有用的功能，可帮助我们以更稳健的方式创建友好的用户界面。我们能够声明变量并将样式嵌套在彼此内部。让我们使用\
  \ LESS 来改善应用程序的感觉。目前，用户没有任何视觉提示来告知他们当前正在使用什么工具。我们可以使用一些代码在单击按钮时更改光标类型；然而，这可能会被页面上的其他元素覆盖，包括我们的应用程序所依赖的\
  \ CanvasEngine 类。相反，我们将使用 Knockout 绑定结合生成的 CSS 样式。首先，我们需要在 IToolSelectionControl\
  \ 接口和 ToolSelectionControl 类上创建一个新属性，以存储当前控件是否被选中：\n\n```\nimport ControlsTypes\
  \ = require('Scripts/Controls/ControlsTypes');\nimport UserControlBase = require('Scripts/Controls/UserControlBase');\n\
  import DrawingTypes = require('Scripts/Drawing/DrawingTypes');\nclass ToolSelectionControl\
  \ extends UserControlBase\n    implements ControlsTypes.IToolSelectionControl {\n\
  \    public buttonText: KnockoutObservable<string> = ko.observable(\"\");\n    public\
  \ isSelected: KnockoutComputed<boolean> = null;\n    constructor(id: string, public\
  \ toolType: DrawingTypes.DrawingToolType,\n        public observable: KnockoutObservable<DrawingTypes.DrawingToolType>)\
  \ {\n        super(id);\n        this.templateName = \"ButtonTemplate\";\n     \
  \   this.buttonText(DrawingTypes.DrawingToolType[this.toolType]);\n        this.isSelected\
  \ = ko.computed(() => {\n            return this.observable() == this.toolType;\n\
  \        });\n    }\n    public click(viewModel: any, event: JQueryEventObject)\
  \ {\n        this.observable(this.toolType);\n    }\n```\n\n```\n}\n}\nexport =\
  \ ToolSelectionControl;\n```\n\n如您所见，我们创建了一个新的 KnockoutComputed 对象，它将返回一个布尔值，并且我们的\
  \ HTML 将绑定到它。与可观察对象存储实例值不同，计算对象运行一个负责设置或返回值的函数。在这种情况下，我们检查控件 supposed to 更新的可观察对象的值是否与此控件关联的工具相同。如果它们相同，则将返回\
  \ true 值；否则，结果为 false。通过在此函数的主体中包含另一个可观察对象，Knockout 将创建对该对象的订阅，并且只要其值发生变化，此函数将被重新评估。这使我们不必编写任何额外的逻辑来在单击这些控件时更新可观察对象。绑定到计算对象与绑定到可观察对象相同，因为它们共享一个共同的超类。\n\
  \n```\n<script type=\"text/html\" id=\"ButtonTemplate\">\n    <button class=\"tool-select-button\"\
  \ data-bind=\"text: buttonText, click: click,\n        css: { 'selected': isSelected\
  \ }\" />\n</script>\n```\n\n在前面的屏幕截图中，您可以看到我们已向按钮添加了一个类，我们将能够为其提供样式，然后是额外的 Knockout\
  \ 绑定。此绑定将在计算对象返回 true 值时向按钮元素添加 'selected' 类。现在我们需要定义这些样式并将它们包含在我们的应用程序中。LESS 最有价值的功能之一是能够定义可在所有\
  \ LESS 文件中重用的变量。在以下示例中，我们定义了想要在整个应用程序中使用的几种颜色：\n\n```\n@selectionColor: #1111DD;\n\
  @accentColor: white;\n@borderColor: black;\n```\n\nselectionColor 变量将用于表示当前选定工具的颜色，而\
  \ accentColor 和 borderColor 变量将用于各种目的。不是为每个样式显式定义这些颜色并在每次使用时更改它们，我们只需更改这些变量的值，整个应用程序的外观就可以改变。要使用这些变量，我们只需导入包含它们的\
  \ .less 文件，它们就会可用：\n\n```\n@import 'ApplicationColors.less';\n.tool-select-button\
  \ {\n    background-color: @accentColor;\n    border-color: @borderColor;\n    &.selected\
  \ {\n        background-color: @selectionColor;\n        color: @accentColor;\n\
  \    }\n}\ninput[type=color] {\n```\n\n```\nborder-color: @borderColor;\n}\ncanvas\
  \ {\n    border: 4px solid @borderColor;\n}\n```\n\n我们使用变量来定义样式的值。现在具有 .tool-select-button\
  \ 类的按钮将被赋予新的背景和边框颜色。还显示了一个嵌套样式，该样式在编译为 CSS 时将创建表示这两种样式并集的另一个样式。最终样式在颜色选择器周围放置边框。当\
  \ LESS 代码被编译时，结果 CSS 将类似于以下代码：\n\n```\n.tool-select-button {\n    background-color:\
  \ #ffffff;\n    border-color: #000000;\n}\n.tool-select-button.selected {\n    background-color:\
  \ #1111dd;\n    color: #ffffff;\n}\ninput[type=color] {\n    border-color: #000000;\n\
  }\ncanvas {\n    border: 4px solid #000000;\n}\n```\n\n请注意，所有变量都已被删除并替换为它们所代表的值。LESS\
  \ 变量在 CSS 中没有表示，因此它们的行为类似于 TypeScript 中的接口，即没有编译输出。如果导入的 LESS 文件包含样式，则所有这些样式都将作为合并的样式集包含在结果\
  \ CSS 文件中。现在我们可以简单地修改我们的 HTML 以链接我们的样式表，我们的应用程序将具有更好的用户体验。\n\n\n\n\n\n```html\n\
  <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\" />\n  \
  \  <title>TypeScript App</title>\n    <link rel=\"stylesheet\" href=\"app.css\"\
  \ type=\"text/css\" />\n    <link rel=\"stylesheet\" href=\"DrawingApplication.css\"\
  \ type=\"text/css\" />\n    <script src=\"Scripts/jquery-2.1.1.js\"></script>\n\
  \    <script src=\"Scripts/knockout-3.1.0.js\"></script>\n    <script data-main=\"\
  app\" src=\"Scripts/require.js\"></script>\n</head>\n<body>\n    <h1>Drawing Application</h1>\n\
  \    <div id=\"content\">\n        <div data-bind=\"foreach: userControls\">\n \
  \           <span data-bind=\"attr: { id: id }, template: { name: templateName }\"\
  ></span>\n        </div>\n        <canvas id=\"drawingCanvas\" height=\"400\" width=\"\
  570\" />\n    </div>\n</body>\n</html>\n```\n\n运行应用程序时，**Select** 按钮会显示所选样式，因为我们添加的\
  \ KnockoutComputed 对象对该控件求值为 true。选择其他任何工具都会导致绑定被重新评估，并且样式会随着用户操作而改变。带边框的任何元素都有统一的颜色，如果我们以后想修改它，只需在一个位置更改即可。如果我们以后需要重新设置应用程序的样式，这将为我们节省大量时间。\n\
  \n## 绘图应用程序\n\nSelect Rectangle Line\n\n## 小结\n\n在本章中，我们介绍了几种改进企业级 JavaScript 应用程序开发和部署方式的方法。我们将绘图应用程序转换为\
  \ AMD 模块，以消除手动管理脚本加载方式的需求。我们使用 Knockout 在 HTML 和 TypeScript 代码之间创建了绑定，这使我们能够以最少的努力轻松扩展应用程序的行为。然后，我们通过将所有模块减少为单个优化的\
  \ JavaScript 文件来提高应用程序可用性的速度。最后，我们添加了 LESS 样式表，使我们能够创建可轻松维护和修改的强大样式集。在下一章中，我们将研究调试\
  \ TypeScript 的不同方法，以及如何为我们的应用程序提供单元测试。\n"
- "# 第 8 章 调试 TypeScript\n\n我们已经掌握了使用 TypeScript 编写大规模应用程序所需的所有技能。TypeScript 提供的编译器和语言结构使我们能够快速、安全地开发可靠的程序。然而，正如所有经验丰富的开发人员都知道的那样，编译通过的代码并不总是按预期执行。在本章中，我们将讨论部署和运行\
  \ TypeScript 后可用的不同调试选项。我们还将介绍单元测试，这将使我们能够使用代码测试功能。在本章中，我们将研究以下主题：\n\n- Debugging\n\
  - Test-driven development\n\n### 调试\n\n在开发纯 JavaScript 应用程序时，我们的调试选项通常取决于每个浏览器中可用的工具。大多数现代浏览器都包含某种形式的开发者控制台，允许我们查看网页上运行的脚本。从此控制台，我们可以设置断点并调查应用程序的行为。我们可以在\
  \ TypeScript 应用程序中执行相同的任务；然而，这会让我们逐步执行生成的 JavaScript，而不是我们实际编写的 TypeScript 代码。\n\
  \n### 源码映射\n\n正如我们之前讨论的那样，源映射是一种将一个代码文件，通常是压缩过的，映射回原始代码文件的方法。在 TypeScript 中，这一概念同样适用，并允许我们逐步执行未编译的\
  \ TypeScript 代码。要启用此功能，我们必须做的第一件事是确保项目设置已设置为生成源映射；此设置默认处于开启状态：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_237_0.png)\n\
  \n此设置将为编译器提供 --sourcemap 参数，并允许我们将输出的 JavaScript 文件链接到原始 TypeScript 文件。在大多数现代浏览器中，这将导致\
  \ TypeScript 文件下载到客户端，我们将能够设置断点并逐行逐步执行我们的代码。\n\n### 调试器\n\n有多种方法可以调试应用程序的代码，我们可能需要它们的组合来确保提供高质量的应用程序。Chrome、Firefox\
  \ 和 Internet Explorer 等现代浏览器都包含一个开发者控制台，为 Web 应用程序提供调试功能。在下面的屏幕截图中，您可以看到我们可以使用 Chrome\
  \ 开发者工具直接进入 TypeScript 代码：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_238_0.png)\n\
  \n在这里，您可以看到我们在绘图应用程序的 `CanvasEngine` 的 `Draw` 方法上设置了一个断点。在源窗口中，JavaScript 文件和 TypeScript\
  \ 文件都是可见的，就像我们在 TypeScript 文件中包含的类型注释一样。这对于开发人员来说是一个非常强大的功能，因为它防止我们必须将生成的 JavaScript\
  \ 代码转换回原始 TypeScript 代码的特定行。使用 Visual Studio 和 Internet Explorer，我们实际上可以直接从 IDE\
  \ 调试。这使我们能够以与调试 C# 代码相同的方式使用 Visual Studio 中可用的所有工具和功能。这包括调用堆栈、添加任何监视表达式以及对象探索，如以下屏幕截图所示：\n\
  \n测试应用程序代码在它预期运行的所有环境中非常重要。每个浏览器都实现了自己的 JavaScript 引擎，并且采用了 HTML5 标准的不同功能集。熟悉每个不同的开发者控制台对于跟踪和解决可能在另一个浏览器中不明显的问题非常重要。\n\
  \n### 测试驱动开发\n\n随着应用程序在规模和复杂性方面不断增长，我们交付尽可能少错误的软件比以往任何时候都更重要。手动测试不一致且缓慢，这意味着我们需要采用更系统的方法来确保软件质量。这种需求催生了测试驱动开发的概念。测试驱动开发是一种开发周期，重复一组小的步骤以确保每一行代码都经过测试。测试驱动开发生命周期的步骤是：\n\
  \n- Adding a test\n- Running the tests\n- Writing the code\n- Running the tests\
  \ again\n- Refactoring the code\n\n我们想要做的第一件事是编写一个测试来验证某些功能。这为我们尚未编写的代码创建了一个需求。当为新功能编写单元测试时，此测试最初会失败；这是预期的，有助于验证测试确实具有失败状态。此时，我们运行所有测试，验证现有测试仍然通过，而我们的新测试失败。如果新测试没有失败，则功能可能已经实现，或者测试无效，需要重写。一旦我们有了有效的测试，我们必须实现我们试图测试的功能。此代码在第一次实现时不必完美；目标只是编写足够多的代码来通过测试。当功能实现后，我们重新运行测试并验证我们的代码是否有效。如果没有，则必须进行更正。否则，代码可以重构；但测试必须始终通过。此过程重复进行，直到每个功能都有测试和实现。现在我们熟悉了测试驱动开发的过程，让我们看看\
  \ TypeScript 中的单元测试是如何工作的。\n\n## 注意\n\n有关测试驱动开发的更多信息，请访问 http://msdn.microsoft.com/en-us/library/aa730844(v=vs.80).aspx。\n\
  \n### 单元测试\n\n单元测试是使用一组控制数据和预期结果测试小功能单元的代码块。这些测试可靠且可重用，确保我们的代码不仅针对应用程序的当前版本进行了测试，而且针对所有未来版本进行了测试。这将确保任何添加或修改的功能不会破坏现有功能，并在问题出现很早之前提醒我们。TypeScript\
  \ 不附带任何内置的单元测试工具；然而，Web 社区再次填补了这一空白。Maxim Fridberg 创建了一个单元测试框架，它为您提供了一种简单的方法来创建和查看您创建的库的所有单元测试。该框架的名称是\
  \ MaxUnit，可从 https://github.com/KnowledgeLakegithub/MaxUnit 下载，或作为名为 KL.Testing.MaxUnit\
  \ 的 NuGet 包提供。\n\n![](img/83a7f7e1723158e56008cf70304a8da4_242_0.png)\n\n此包将向我们的\
  \ Visual Studio 项目添加许多文件，包括框架的示例用法。MaxUnit 的优点是它允许我们为 TypeScript 库编写 TypeScript\
  \ 测试。有许多其他测试框架可用于测试 JavaScript 库，包括 Jasmine (https://github.com/pivotal/jasmine/)\
  \ 和 QUnit (http://qunitjs.com/)。通常最好将测试代码与实现代码分开，以确保它以与使用方式相同的方式进行测试。为了感受单元测试的工作方式，让我们以我们在绘图应用程序中创建的\
  \ Shapes 库为例，并创建一系列测试以确保其功能正常。Shapes 库输出到单个 JavaScript 文件，并且与之关联的接口可用于测试我们的代码。\n\
  \n\n\n\n\n## 添加测试\n\n现在我们已经安装了工具链，让我们开始对库进行单元测试的过程。首先需要做的是将 Shapes 库添加到测试项目中。此过程可以手动完成，也可以使用\
  \ PowerShell 自动部署我们代码的最新版本。对于现在，我们将手动处理它，以便我们可以专注于测试。一旦我们的库被添加到项目中，我们就可以开始编写测试。我们将为\
  \ Shapes 库中的每个对象创建一个单独的测试类来进行测试。让我们从库中最简单的类 Point 类开始，以感受测试。在下面的示例中，你可以看到我们创建了一个名为\
  \ test_Point 的新类，其中包含针对该特定类的所有测试：\n\n```\n/// <reference path=\"../../maxunit.ts\"\
  \ />\n/// <reference path=\"../../scripts/typings/shapes/shapestypes.d.ts\" />\n\
  class test_Point extends maxUnit.TestClassBase {\n    private _shapes: Shapes =\
  \ null;\n    constructor() {\n        //give test suite a name\n        super('test_Point');\n\
  \        //add test by name\n    }\n    setUpAsync(dfdSetup: jQueryDeferred<any>)\
  \ {\n        var cb = super.setUpAsync;\n        require(['/Scripts/Shapes/Shapes.js'],\
  \ (Shapes) => {\n            this._shapes = Shapes;\n            cb(dfdSetup);\n\
  \        });\n    }\n    tearDown() {\n        super.tearDown();\n    }\n}\n\nexport\
  \ = test_Point;\n```\n\n该类继承自 maxUnit 基类 TestClassBase，它提供了用于将测试注册到测试框架的方法。构造函数调用基构造函数并提供此组测试的名称。最终，此部分还将包含我们每个单元测试的注册。setUpAsync\
  \ 方法将用于设置任何必要的模拟对象并创建对 Shapes 库的引用。如果我们的库包含 jQuery 或任何其他依赖项，我们将模拟这些对象以确保我们的库按预期执行。tearDown\
  \ 方法提供了一个位置，用于在测试运行后执行你可能想要的任何清理逻辑。现在，让我们开始编写一些非常简单的测试来验证 Point 对象的创建。每个单元测试应分为三个部分：\n\
  \n- Arrange\n- Act\n- Assert\n\nArrange 部分将创建我们执行测试所需的任何对象，act 将执行\n\n## 欢迎使用 MaxUnit\n\
  \n## Tests:(Total Failed : 0)\n(Total Passed: 2)\n\nTest:\nShapeTests/test_Point\n\
  (failed: 0) (passed: 2)\n\n## Passed\n\n| Test Name | Test Description | Message\
  \ |\n|---|---|---|\n| test_PointInitX | Test Point.X value init | OK |\n| test_PointInitY\
  \ | Test Point.Y value init | OK |\n\n这些都是非常简单的测试，涵盖了创建 Point 对象所使用的最基本路径；然而，在编写单元测试时，我们希望覆盖尽可能多的场景以验证正确的功能。例如，与其只测试特定的类，让我们围绕一个接口编写一些测试，这将创建一系列可以在多个具体实现上成功运行的测试。在下面的示例中，你可以看到我们创建了一组新的测试，将用于测试\
  \ IRectangle 接口：\n\n```\n/// <reference path=\"../../maxunit.ts\" />\n/// <reference\
  \ path=\"../../scripts/typings/shapes/shapetypes.d.ts\" />\nclass test_IRectangle\
  \ extends maxUnit.TestClassBase {\n    private _shapes: Shapes = null;\n    constructor()\
  \ {\n        //give test suite a name\n        super('test_Point');\n        //add\
  \ test by name\n        this.AddTest('test_RectangleResize', 'Test resizing of Rectangle');\n\
  \    }\n    setUpAsync(dfdSetup: JQueryDeferred<any>) {\n        var cb = super.setUpAsync;\n\
  ```\n\n```\n```typescript\nrequire(['/Scripts/Shapes/Shapes.js'], (Shapes) => {\n\
  \    this._shapes = Shapes;\n    cb(dfdSetup);\n});\n}\ntearDown() {\n    super.tearDown();\n\
  }\ntest_RectangleResize() {\n    //Arrange\n    var rect: IRectangle = new this._shapes.Rectangle(4,\
  \ 6);\n    this.test_IRectangleResize(rect);\n}\ntest_IRectangleResize(r: IRectangle)\
  \ {\n    //Act\n    r.resize(3, 9);\n    //Assert\n    this.Assert.AreIdentical(9,\
  \ r.width, \"Should return 9\");\n}\n}\n\nexport = test_IRectangle;\n```\n```\n\n\
  正如你所见，我们的类结构非常相似；然而，单元测试的各个部分已被分离为两个逻辑部分。第一部分是我们尝试测试的对象的创建，第二部分是我们将要测试的接口。此测试的第二部分可以一遍又一遍地重用于我们创建的每个实现\
  \ IRectangle 的类。例如，正方形与矩形非常相似；事实上，我们可以以这样的方式实现它们，使它们具有完全相同的属性集。我们可以非常轻松地向我们的 Shapes\
  \ 库添加一个新类来表示正方形：\n\n```\n```typescript\nexport class Square implements IRectangle\
  \ {\n    constructor(public height: number, public width) {\n        this.width\
  \ = this.height;\n    }\n    public resize(height: number, width: number) {\n  \
  \      this.height = height;\n        this.width = height;\n    }\n}\n```\n```\n\
  \n正如你所见，这个类同时维护了 IRectangle 接口和正方形的概念，通过确保 width 和 height 属性被设置为相同的值。我们现在可以在 test_IRectangle\
  \ 类中编写第三个测试方法，该方法将实例化一个新的 Square 对象并将其通过用于 Rectangle 对象的 resize 测试：\n\n```\n```typescript\n\
  test_SquareResize() {\n    //Arrange\n    var square: IRectangle = new this._shapes.Square(4,\
  \ 6);\n    this.test_IRectangleResize(square);\n}\n```\n```\n\n通过使用我们的接口抽象，我们的测试成为可重用的代码单元，可用于多种\n\
  \n对象类型。一起运行这些测试会产生以下输出：\n\n## Tests:(Total Failed : 1)\n(Total Passed: 3)\n\n- Test:\n\
  ShapeTests/test_Point\n(failed: 0) (passed: 2)\n\n- Test:\nShapeTests/test_IRectangle\n\
  (failed: 1) (passed: 1)\n\n## Failed\n\n| Test Name | Test Description | Message\
  \ |\n| test_SquareResize | Test resizing of Squares | areIdentical failed when passed\
  \ expected: {number} \"9\" and actual:{number} \"3\" Should return 9 |\n\n## Passed\n\
  \n| Test Name | Test Description | Message |\n| test_RectangleResize | Test resizing\
  \ of Rectangle | OK |\n\n正方形测试失败了。接口已实现，因此我们的代码能够编译；然而，这暴露了我们对正方形的假设存在问题。通过我们的实现，我们将正方形的行为强加给了\
  \ IRectangle 类型。此测试暴露了我们破坏了我们在第 4 章《使用 TypeScript 进行面向对象编程》中讨论的里氏替换原则的事实。我们无法安全地用另一个\
  \ IRectangle 对象替换一个 IRectangle 对象，这可能导致意外的行为。\n\n## 小结\n\n在本章中，我们讨论了 TypeScript\
  \ 开发的最后几个部分。我们讨论了源映射以及 TypeScript 如何使用它们将输出 JavaScript 文件映射回原始 TypeScript 文件，使我们能够在编译前逐步执行代码。我们查看了调试代码的不同环境，无论是在浏览器中还是在\
  \ IDE 中。最后，我们查看了测试驱动开发以及它如何以可重用和一致的方式让我们捕获错误和意外功能。我们在短时间内讨论了大量主题：\n\n- Working with\
  \ the compiler\n- TypeScript’s language constructs\n- Object-oriented development\
  \ with TypeScript\n- Asynchronous module definitions\n- Integrating with external\
  \ libraries\n- Test-driven development\n\n我们使用这些不同的主题构建了一个绘图应用程序，并在需求变化和知识增加时对其进行了改进。你现在有能力在\
  \ TypeScript 中启动一个新应用程序，并将其从初始需求带到抛光的最终产品。\n"
