  \ }\n}\n```\n\n这些方法中的每一个都在非常受控的范围内执行非常具体的功能。这在我们后面进行单元测试时会派上用场。因此，此时最终用户在画布上选中了一个对象并想要操作它。这些交互将在\
  \ mousemove 事件中处理。正如你在下面的代码示例中所见，操作我们的对象几乎不需要引擎做什么工作：\n\n```\nprivate _mousemove(e)\
