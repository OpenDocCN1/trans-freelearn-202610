    \ testing tools; however, the web community once again filled this hole. A unit\
    \ test framework has been created by Maxim Fridberg and gives you a simple way\
    \ to create and view all of your unit tests for libraries that you have created.\
    \ The name of the framework is MaxUnit and is available for download from https://github.com/KnowledgeLakegithub/MaxUnit,\
    \ or it is available as a NuGet package called KL.Testing.MaxUnit.\n\n![](img/83a7f7e1723158e56008cf70304a8da4_242_0.png)\n\
    \nThis package will add a number of files to our Visual Studio project including\
    \ sample usage of the framework. The advantage of MaxUnit is that it allows us\
    \ to write tests in TypeScript for our TypeScript libraries. There are a number\
    \ of other testing frameworks available to test JavaScript libraries, including\
    \ Jasmine (https://github.com/pivotal/jasmine/) and QUnit (http://qunitjs.com/).\
