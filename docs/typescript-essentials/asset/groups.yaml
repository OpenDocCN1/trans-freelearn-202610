    }, true);\nvar rectButton = window.document.getElementById(\"lineButton\");\n\
    rectButton.addEventListener(\"click\", (e) => {\n    this._drawingTool = DrawingToolType.Line;\n\
    }, true);\n}\n```\n\nWith these event handlers setting the private variable to\
    \ the appropriate drawing tool, we can now fill in the remainder of this implementation\
    \ as well. Previously, we left the getNewShape method without a body and the getDrawingTool\
    \ method always returned the Select tool. Now that we have a private reference\
