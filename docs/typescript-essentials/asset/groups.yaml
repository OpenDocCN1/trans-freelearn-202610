  - '[PAGE 235]


    # # Chapter 8. Debugging TypeScript


    We have covered all the skills you will need to write large-scale applications
    using TypeScript. The compiler and language constructs provided by TypeScript
    allow us to quickly and safely develop reliable programs. As all experienced developers
    know though, code that compiles doesn’t always perform as expected. In this chapter,
    we will discuss the different options available to debug TypeScript once it is
    deployed and running. We will also cover unit testing, which will allow us to
    test the functionality with code. In this chapter, we will investigate the following
    topics:


    +   - Debugging

    +   - Test-driven development'
  - '[PAGE 236]


    # # Debugging


    When developing plain old JavaScript applications, our debugging options are usually
    dependent upon the available tooling in each browser. Most modern browsers include
    some form of developer console that allows us to view the scripts running on a
    web page. From this console, we can set breakpoints and investigate the behavior
    of our application. We can perform the same task in TypeScript applications; however,
    this leaves us stepping through the generated JavaScript rather than the TypeScript
    code we actually wrote.'
  - '[PAGE 237]


    # Source maps


    As we discussed earlier, source maps are a way to map one code file, generally
    minified, back to the original code file. In TypeScript, this concept holds true
    and allows us to step through our non-compiled TypeScript code. To enable this
    functionality, the first thing we must do is ensure that our project settings
    are set to generate source maps; this setting is on by default:


    ![](img/83a7f7e1723158e56008cf70304a8da4_237_0.png)


    This setting will provide the --sourcemap parameter to the compiler and allow
    us to link the output JavaScript file to the original TypeScript file. In most
    modern browsers, this will cause the TypeScript file to download to the client
    and we will be able to set breakpoints and step through our code line by line.'
  - '[PAGE 238]


    # Debuggers


    There are several ways to debug our application’s code, and it is likely that
    we will need a combination of them to ensure we provide a high quality application.
    Modern browsers such as Chrome, Firefox, and Internet Explorer all include a developer
    console that provides debugging features for web applications. In the following
    screenshot, you can see that we can step directly into our TypeScript code using
    the Chrome developer tools:


    ![](img/83a7f7e1723158e56008cf70304a8da4_238_0.png)


    Here, you can see that we have set a breakpoint on the `Draw` method of the `CanvasEngine`
    of our drawing application. In the source window, both the JavaScript file and
    the TypeScript file are visible, as are the type annotations we included in the
    TypeScript file. This is an incredibly powerful feature for developers because
    it prevents us from having to translate the generated JavaScript code back to
    a particular line of the original TypeScript code. With Visual Studio and Internet
    Explorer, we are actually able to debug directly from the IDE. This enables us
    to use all of the tools and features available in Visual Studio in the same way
    that we could debug C# code. This includes the call stack, adding any watch expressions,
    as well as object exploration, as you can see in the following screenshot:'
  - '[PAGE 239]


    It is important to test our application’s code in all of the environments that
    it is expected to run in. Each browser implements its own JavaScript engine and
    has adopted different sets of features from the HTML5 standard. Being familiar
    with each of the different developer consoles will be important to track down
    and resolve issues that may not be readily apparent in another browser.'
  - '[PAGE 240]


