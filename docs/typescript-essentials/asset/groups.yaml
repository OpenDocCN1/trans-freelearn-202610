    # # The advantages of TypeScript


    As hardware technology has advanced, so too has the need for more advanced software
    applications to run not just on one device but on an array of devices. JavaScript
    is the natural solution to this cross-platform model since almost all modern browsers
    are capable of running it. Unfortunately, the development paradigm of JavaScript
    is still dependent upon complex pattern knowledge, and debugging must be done
    at runtime. Creating large applications in JavaScript can be difficult and structuring
    the code in a maintainable form is just as difficult. TypeScript, an open source
    language project started by Microsoft, aims to take JavaScript development to
    the next level.


    JavaScript originally ran as an interpreted language and still does in some places,
    while modern browsers convert it to machine code during execution. What this means
    is that the code you write is the code being used at runtime. The advantage of
    using interpreted languages is that they provide a rapid development model with
    very little overhead for the developer. They work in cross-platform environments
    because the code does not need to be compiled for each new device it is deployed
    to. Interpreted languages aren’t without their share of disadvantages either though.
    In most modern implementations, JavaScript code must be run through a just-in-time
    compiler first, but even with the help of this compilation, the dynamic typing
    of the language makes this a difficult task and performance can suffer. On top
    of the performance hit, JavaScript code must still be deployed before testing
    can be done. A single syntax error will force you to run the application, track
    down the source of the problem, fix it, and then run the application again, which
    wastes a lot of time and can be quite frustrating. Developers like to refactor
    code as better ways to solve problems arise or new functionality is needed. This
    refactoring could cause other parts of the application to fail and without performing
    complete regression testing the problem could be overlooked. To interact with
    an object you must have intimate knowledge of the type that the object represents.
    TypeScript aims to solve these problems through a variety of additions to the
    JavaScript language including a compilation step with a detailed list of errors.


    TypeScript is a statically typed compiled language that generates JavaScript code
    that can be used in cross-platform scenarios. You may be thinking to yourself
    at this point: why would I want to rewrite all of the applications I already have
    in this new language? The simple answer is you don’t have to. TypeScript is just
    a superset of JavaScript that gets compiled into plain JavaScript. Although almost
    all of your existing JavaScript code is valid TypeScript code, certain pieces
    will need to be adapted to ensure safe compilation; however, they will generally
    improve the quality of your code. You are free to type your code as strong or
    as weak as you wish but I highly recommend embracing the typing system completely.


    JavaScript was originally created as a scripting language, but as the need for
    larger applications has grown so has the need for those applications to contain
    more reusable components and libraries. JavaScript is dynamic enough to act as
    both a functional language and an object-oriented one through certain design patterns.
    Object-oriented code'
