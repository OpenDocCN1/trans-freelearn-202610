    \ _canvas: HTMLCanvasElement, private _model: IDrawingModel) {\n    this.ctx =\
    \ this._canvas.getContext(\"2d\");\n    this._canvas.addEventListener('mousedown',\
    \ (e) => this._mousedown(e), true);\n    this._canvas.addEventListener('mousemove',\
    \ (e) => this._mousemove(e), true);\n    this._canvas.addEventListener('mouseup',\
    \ (e) => this._mouseup(e), true);\n}\n```\n\nThe first thing we do is get the\
    \ rendering context that we will use to manipulate the canvas. This is stored\
    \ as a private variable and will be used throughout the application’s life cycle.\
    \ The next thing we do is wire up the event handlers to the canvas element. We\
    \ need to perform specific actions as the user manipulates objects on the canvas\
    \ with the mouse. The syntax for directing the events towards our private methods\
    \ looks a little strange though. This is not valid JavaScript code, but when it\
    \ gets compiled it will run just fine. The => syntax inside of the constructor\
    \ tells the TypeScript compiler to generate a special representation to the this\
    \ object in the final JavaScript representation. The final JavaScript code will\
    \ look something similar to the following:\n\n```\nfunction CanvasEngine(_canvas,\
    \ _model) {\n    var _this = this;\n    this._canvas.addEventListener('mousedown',\
    \ function (e) {\n        return _this._mousedown(e);\n    }, true);\n}\n```\n\
    \nThis ensures that when the event listener we are attaching to the canvas is\
    \ called, we have a correct reference to the engine’s instance. Otherwise, we\
    \ could end up using a this object that doesn’t represent the CanvasEngine instance;\
    \ in this case, the DOM element that fired the event and the call to the _mousedown\
    \ method would fail. Now that we have our object being instantiated and events\
    \ being wired up, let’s take a look at the public methods. The clear and Invalidate\
    \ methods are both very simple:\n\n```\npublic clear() {\n    this.ctx.clearRect(0,\
    \ 0, this._canvas.width, this._canvas.height);\n}\npublic invalidate() {\n   \
    \ window.requestAnimationFrame(() => this.draw());\n}\n```\n\nThe clear method\
    \ overwrites the entire canvas with a blank rectangle to remove all existing objects\
    \ from view. The invalidate method makes a call to the draw method to show all\
    \ of the objects represented by the drawing model that was passed in to the constructor.\
