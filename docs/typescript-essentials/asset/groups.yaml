    \ compiler and its options, we can automatically generate declaration files for\
    \ our own code. These declaration files can be referenced from other projects\
    \ within your own solution or deployed as part of a library you distribute. A\
    \ declaration file will be output for every JavaScript file that is output. If\
    \ you combine all of your code into a single file then a single declaration file\
    \ will be created. Selecting the **Generate declaration files** option from the\
    \ TypeScript build section of the project properties will provide the compiler\
    \ with the appropriate parameter used to create our declaration files, as shown\
    \ in the following screenshot:\n\n![](img/83a7f7e1723158e56008cf70304a8da4_181_1.png)\n\
    \nThroughout this book, we have used a variety of types that weren’t explicitly\
    \ declared by us. The CanvasRenderingContext2D object we used in our drawing application\
    \ had a full list of type information in Visual Studio IntelliSense, yet we never\
    \ saw its declaration or implementation. This is because TypeScript comes with\
    \ a lib.d.ts file that declares type information for thousands of different objects.\
    \ This declaration file is automatically referenced every time the compiler runs.\
    \ This list of types is incredibly useful but it doesn’t include any types from\
    \ external libraries that may or may not be referenced in your projects.\n\n##\
    \ Third-party library integration\n\nOne of the key components in large scale\
    \ web development is the use of open source libraries that handle certain tasks\
    \ for us. jQuery is one of the more popular libraries and is used for easy interaction\
    \ with the **Document Object Model (DOM)**. These libraries provide a wide variety\
    \ of functionalities but all of these interactions can be given some level of\
    \ typing. In this section, we are going to look at the following libraries:\n\n\
    - jQuery\n- Knockout\n- RequireJS\n\nBefore we start developing these libraries,\
    \ we need to get them referenced in our project. Each of these libraries can be\
    \ downloaded directly from their web pages or through the use of NuGet. NuGet\
    \ is a package manager for Visual Studio and can be installed as an extension.\n\
    \n![](img/83a7f7e1723158e56008cf70304a8da4_186_0.png)\n\nThe NuGet packages we\
    \ will be installing will include the code for the libraries we will be using\
    \ as well as separate declaration files for each of these libraries. Not every\
    \ library has NuGet packages or declaration files associated with them, however,\
    \ the web development community is very good about filling in these holes. There\
    \ is a large repository of TypeScript library declaration files available from\
    \ the **DefinitelyTyped** repository on GitHub.\n\n## Integrating with jQuery\n\
    \njQuery is one of the most popular open source libraries available on the Web.\
    \ It can be used for anything from DOM manipulation to simplifying remote server\
    \ calls. If you plan on building a large scale web application you were probably\
    \ already planning on using jQuery and if not, I strongly recommend that you do.\
    \ To start using jQuery, the first thing we need to do is install the jQuery NuGet\
    \ package. Right-click on the project and select **Manage NuGet Packages**. This\
    \ will bring up a window similar to the updates and extensions window. Locate\
    \ jQuery from the nuget.org repository in the **Online** section and install it.\
    \ As you can see in the following screenshot, several files are installed with\
    \ this package that help us develop with jQuery:\n\n![](img/83a7f7e1723158e56008cf70304a8da4_187_0.png)\n\
    \nNow we can add a script tag the index.html file and jQuery will be available\
    \ at runtime for us to use. This, however, isn’t very useful during development\
    \ and compilation of our TypeScript code because we don’t have any type information\
    \ about the library. To import this type information, we need a declaration file\
    \ that represents the jQuery library. Open up the **Manage NuGet Packages** window\
    \ again and search for jQuery.TypeScript. Install the package named **jquery.TypeScript.DefinitelyTyped**,\
    \ which is on Version 1.3.5 at the time of writing this, to import the type information\
    \ of the jQuery library.\n\n### Tip\n\nThere are a number of other libraries that\
    \ extend jQuery and quite a few declaration files have been created to support\
    \ these different extensions.\n\nNow that the type information for jQuery has\
    \ been included in the project we will be able to use the library in a more robust\
    \ way. Let’s add some elements to our HTML that we will manipulate with the jQuery\
    \ library.\n"
