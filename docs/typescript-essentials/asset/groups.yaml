  mdcn: "\n\n## 创建视图模型\n\n现在我们已经设置好了可复用控件，需要创建应用程序将绑定的视图模型，并对现有类型进行一些修改，以确保程序顺利运行。为了维护单一职责模式，我们应该创建一个新的模型供\
