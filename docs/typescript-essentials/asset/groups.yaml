    # Binding the user controls


    Now that we have converted our application to use AMD modules, let’s gradually
    increase the complexity of the application. Currently, we search the DOM for individual
    elements and attach event handlers to them. This isn’t necessarily a bad thing;
    however, it does leave our code vulnerable to a number of possible issues. The
    DOM may not have finished rendering the objects we are attempting to attach to,
    or the object could have been removed by another segment of code. Another pitfall
    of this approach is that if we wanted to add another drawing shape type to our
    application, we would have to add another element to the HTML and then more code
    to add the event handler. This is inefficient and could open up the possibility
    of making a mistake somewhere. Fortunately, there are a number of libraries available
    that allow us to implement binding patterns such as **Model View Controller (MVC)**
    and **Model View ViewModel (MVVM)**. Knockout is one of these libraries, and it
    brings MVVM to JavaScript and TypeScript development.'
  md: "\n```typescript\nexport import DrawingToolType =\nrequire('Scripts/Drawing/Enums/DrawingToolType');\n\
    ```\n\n![](img/83a7f7e1723158e56008cf70304a8da4_205_0.png)\n\nHang on a minute;\
    \ those aren’t the values for our enumeration. What went wrong? Well, this has\
    \ something to do with the way that the compiler interprets the return type of\
    \ the `CanvasEngineAction` enum that was imported and then exported. Enumerations\
    \ are a clever representation of a number, so the type system reads the return\
    \ type as a number and determines that these must be our available options. Modules\
    \ and classes do not have this problem because their type is unique. To work around\
    \ this problem, we simply have to correctly type the action variable and our enumeration\
    \ will behave as expected.\n\n![](img/83a7f7e1723158e56008cf70304a8da4_205_1.png)\n\
    \nAll of these methods are completely valid and fit different needs. As we refactor\
    \ the drawing application, we will use a combination of these methods to break\
    \ our code into logical groupings. Using the TypeScript compiler isn’t the only\
    \ way for us to segment out our code. Keeping code in a directory structure that\
    \ groups similar objects together results in easy differentiation between code\
    \ functionality. In the following screenshot, you can see that we have created\
    \ a separate directory for our generic shape objects from any drawing-related\
    \ logic. The drawing code is separated into more finely-grained subsections as\
    \ well depending on the functionality each grouping will contain.\n\n![](img/83a7f7e1723158e56008cf70304a8da4_206_0.png)\n\
    \nNow we can start breaking our code into separate files, each serving a different\
    \ and specific purpose. All of our interface types for a specific area can be\
    \ placed into a single TypeScript file called `<Area>Types.ts`, for example, `ShapeTypes.ts`.\
    \ This will give us a place to reference interfaces and enumerations while keeping\
    \ our classes and actual implementation code separate. Each interface should be\
    \ decorated with the `export` keyword to ensure that we are able to interact with\
    \ all of these types in a consistent manner. Next, we need to decide how to structure\
    \ our implementation code. Each of the different shape objects could be broken\
    \ into a separate code file and placed inside the `Shapes` directory that we created.\
    \ However, the amount of code in these classes is minimal and relatively easy\
    \ to manage, so we can easily place them all inside of a single module. If the\
    \ implementations start to grow in size like with the drawing-related objects,\
    \ we will want separate files for each type to keep the code clear and easy to\
    \ maintain.\n\nThe complete contents of the `Shapes.ts` file is shown in the following\
    \ code:\n\n```typescript\nimport ShapeTypes = require('Scripts/Shapes/ShapeTypes');\n\
    export class Point implements ShapeTypes.IPoint {\n    constructor(public X: number,\
    \ public Y: number) {\n    }\n}\nexport class Line implements ShapeTypes.ILine\
    \ {\n    constructor(public p1: ShapeTypes.IPoint, public p2: ShapeTypes.IPoint)\
    \ {\n    }\n    public Length(): number {\n        var a2 = Math.pow(this.p2.X\
    \ - this.p1.X, 2);\n        var b2 = Math.pow(this.p2.Y - this.p1.Y, 2);\n   \
    \     return Math.sqrt(a2 + b2);\n    }\n}\nexport class Rectangle implements\
    \ ShapeTypes.IRectangle {\n    constructor(public Height: number, public Width:\
    \ number) {\n    }\n    public Resize(height: number, width: number) {\n     \
    \   this.Height = height;\n        this.Width = width;\n    }\n}\nexport class\
    \ Freehand implements ShapeTypes.IFreehand {\n    public Points: Array<ShapeTypes.IPoint>\
    \ = [];\n    constructor() {\n    }\n    public AddPoint(point: ShapeTypes.IPoint)\
    \ {\n        this.Points.push(point);\n    }\n}\nexport class Circle implements\
    \ ShapeTypes.ICircle {\n    constructor(public Radius: number) {\n    }\n    public\
    \ Resize(radius: number) {\n        this.Radius = radius;\n    }\n    public Area():\
    \ number {\n        return Math.PI * this.Radius * this.Radius;\n    }\n}\n```\n\
    \nAs you can see, we import the `ShapeTypes` module, which gives us access to\
    \ all of the abstractions we created for the shapes. Normally, interfaces are\
    \ available at the global level in the TypeScript type system. However, because\
    \ we decorated them with the `export` keyword, they have been placed on a module\
    \ type that has no associated code. We reference each of the interfaces through\
    \ this module type. However, the resulting JavaScript contains no reference to\
    \ it. Now, we should move into the Drawing area of the application and divide\
    \ up those types accordingly. We will start with the interfaces and enumerations\
    \ because they are the most basic types and the implementation code won’t work\
    \ without them.\n\nEach enumeration can be placed in its own file, while all of\
    \ the interfaces will be placed in a single `DrawingTypes.ts` file. Since some\
    \ of our interfaces reference the enumerations, we will need to import them into\
    \ the `DrawingTypes` file. This is a particularly good time to use the `export`\
    \ and `import` keywords in conjunction to attach the enumerations to the `DrawingTypes`\
    \ module. This will allow us to access each of these enumerations in the same\
    \ way that we access the interfaces in our application. Next, let’s break up the\
    \ drawing shapes into separate files. Each one of these classes requires a significant\
    \ amount of code, and having them separated into individual code files will make\
    \ it easier for us to maintain them. The following screenshot shows each of the\
    \ different files in the Drawing directory:\n\n![](img/83a7f7e1723158e56008cf70304a8da4_208_0.png)\n\
    \nWe will recombine them into a single module called `DrawingShapes` that we will\
    \ use to directly access these types. The `DrawingShapes` module is nothing more\
    \ than a list of export imports, as shown in the following code:\n\n```typescript\n\
    export import DrawingShapeBase =\nrequire('Scripts/Drawing/DrawingShapes/DrawingShapeBase');\n\
    export import DrawingRectangle =\nrequire('Scripts/Drawing/DrawingShapes/DrawingRectangle');\n\
    export import DrawingLine =\nrequire('Scripts/Drawing/DrawingShapes/DrawingLine');\n\
    ```\n\nThe `DrawingModel` and `CanvasEngine` files will import the modules they\
    \ need and assign the classes they contain to the export object. With all of our\
    \ code now in AMD modules, we can modify our HTML to load only the main entry\
    \ point to our application, `app.js`, which resides in the root directory of the\
    \ project, and the rest of the modules will be loaded as necessary through program\
    \ execution.\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta\
    \ charset=\"utf-8\" />\n    <title>TypeScript HTML App</title>\n    <link rel=\"\
    stylesheet\" href=\"app.css\" type=\"text/css\" />\n</head>\n<body>\n    <h1>Drawing\
    \ Application</h1>\n    <div id=\"content\">\n        <div>\n            <button\
    \ id=\"selectButton\">Select</button>\n            <button id=\"rectangleButton\"\
    >Rectangle</button>\n            <button id=\"lineButton\">Line</button>\n   \
    \         <input type=\"color\" id=\"colorPicker\" />\n        </div>\n      \
    \  <canvas id=\"drawingCanvas\" height=\"400\" width=\"570\"\n               \
    \ style=\"border: 4px solid black;\"></canvas>\n    </div>\n    <script data-main=\"\
    app.js\" src=\"scripts/require.js\"></script>\n</body>\n</html>\n```\n\n## Binding\
    \ the user controls\n\nNow that we have converted our application to use AMD modules,\
    \ let’s gradually increase the complexity of the application. Currently, we search\
    \ the DOM for individual elements and attach event handlers to them. This isn’t\
    \ necessarily a bad thing; however, it does leave our code vulnerable to a number\
    \ of possible issues. The DOM may not have finished rendering the objects we are\
    \ attempting to attach to, or the object could have been removed by another segment\
    \ of code. Another pitfall of this approach is that if we wanted to add another\
    \ drawing shape type to our application, we would have to add another element\
    \ to the HTML and then more code to add the event handler. This is inefficient\
    \ and could open up the possibility of making a mistake somewhere. Fortunately,\
    \ there are a number of libraries available that allow us to implement binding\
    \ patterns such as **Model View Controller (MVC)** and **Model View ViewModel\
    \ (MVVM)**. Knockout is one of these libraries, and it brings MVVM to JavaScript\
    \ and TypeScript development.\n"
  mdcn: "\n\n```typescript\nexport import DrawingToolType =\nrequire('Scripts/Drawing/Enums/DrawingToolType');\n\
    ```\n\n![](img/83a7f7e1723158e56008cf70304a8da4_205_0.png)\n\n等等一下；这些并不是我们枚举的值。出了什么问题？好吧，这与编译器如何解释导入后又导出的\
    \ `CanvasEngineAction` 枚举的返回类型有关。枚举是对数字的巧妙表示，因此类型系统会将返回类型读取为数字，并判定这些必须是我们的可用选项。模块和类没有这个问题，因为它们的类型是唯一的。为了解决这个问题，我们只需要正确地为\
    \ action 变量指定类型，我们的枚举就会按预期工作。\n\n![](img/83a7f7e1723158e56008cf70304a8da4_205_1.png)\n\
    \n所有这些方法都是完全有效且适用于不同需求的。随着我们重构绘图应用程序，我们将使用这些方法的组合来将代码拆分为逻辑分组。使用 TypeScript 编译器并不是我们分割代码的唯一方式。保持代码在将相似对象分组的目录结构中，会使代码功能之间的区分变得容易。在下面的屏幕截图中，你可以看到我们为通用形状对象创建了一个单独的目录，与任何绘图相关逻辑分开。绘图代码也根据每个分组将包含的功能被细分为更精细的子部分。\n\
    \n![](img/83a7f7e1723158e56008cf70304a8da4_206_0.png)\n\n现在我们可以开始将代码拆分为单独的文件，每个文件服务于不同的特定目的。我们可以将特定区域的所有接口类型放在一个名为\
    \ `<Area>Types.ts` 的单个 TypeScript 文件中，例如 `ShapeTypes.ts`。这将为我们提供一个引用接口和枚举的地方，同时将类和实际实现代码分开。每个接口都应使用\
    \ `export` 关键字进行装饰，以确保我们能够以一致的方式与所有这些类型进行交互。接下来，我们需要决定如何构建实现代码。每个不同的形状对象都可以拆分为单独的代码文件并放置在我们创建的\
    \ `Shapes` 目录中。然而，这些类中的代码量很小且相对容易管理，因此我们可以轻松地将它们全部放在一个模块中。如果实现开始像绘图相关对象那样增长，我们将希望为每种类型准备单独的文件以保持代码清晰且易于维护。\n\
    \n`Shapes.ts` 文件的完整内容如下所示：\n\n```typescript\nimport ShapeTypes = require('Scripts/Shapes/ShapeTypes');\n\
    export class Point implements ShapeTypes.IPoint {\n    constructor(public X: number,\
    \ public Y: number) {\n    }\n}\nexport class Line implements ShapeTypes.ILine\
    \ {\n    constructor(public p1: ShapeTypes.IPoint, public p2: ShapeTypes.IPoint)\
    \ {\n    }\n    public Length(): number {\n        var a2 = Math.pow(this.p2.X\
    \ - this.p1.X, 2);\n        var b2 = Math.pow(this.p2.Y - this.p1.Y, 2);\n   \
    \     return Math.sqrt(a2 + b2);\n    }\n}\nexport class Rectangle implements\
    \ ShapeTypes.IRectangle {\n    constructor(public Height: number, public Width:\
    \ number) {\n    }\n    public Resize(height: number, width: number) {\n     \
    \   this.Height = height;\n        this.Width = width;\n    }\n}\nexport class\
    \ Freehand implements ShapeTypes.IFreehand {\n    public Points: Array<ShapeTypes.IPoint>\
    \ = [];\n    constructor() {\n    }\n    public AddPoint(point: ShapeTypes.IPoint)\
    \ {\n        this.Points.push(point);\n    }\n}\nexport class Circle implements\
    \ ShapeTypes.ICircle {\n    constructor(public Radius: number) {\n    }\n    public\
    \ Resize(radius: number) {\n        this.Radius = radius;\n    }\n    public Area():\
    \ number {\n        return Math.PI * this.Radius * this.Radius;\n    }\n}\n```\n\
    \n正如你所见，我们导入了 `ShapeTypes` 模块，这使我们能够访问为形状创建的所有抽象。通常，接口在 TypeScript 类型系统中在全局级别可用。然而，由于我们用\
    \ `export` 关键字装饰了它们，它们已被放置在没有关联代码的模块类型上。我们通过此模块类型引用每个接口。然而，生成的 JavaScript 中不包含对其的引用。现在，我们应该进入应用程序的\
    \ Drawing 区域并相应地划分这些类型。我们将从接口和枚举开始，因为它们是最基本的类型，实现代码在没有它们的情况下无法工作。\n\n每个枚举可以放在自己的文件中，而所有接口将放在单个\
    \ `DrawingTypes.ts` 文件中。由于我们的一些接口引用了枚举，我们将需要在 `DrawingTypes` 文件中导入它们。这是一个特别好的时机，可以结合使用\
    \ `export` 和 `import` 关键字将枚举附加到 `DrawingTypes` 模块。这将使我们能够以与在应用程序中访问接口相同的方式访问这些枚举。接下来，让我们将绘图形状拆分为单独的文件。这些类中的每一个都需要大量的代码，将它们分离到单独的代码文件中将使我们更容易维护它们。下面的屏幕截图显示了\
    \ Drawing 目录中的每个不同文件：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_208_0.png)\n\
    \n我们将把它们重新组合成一个名为 `DrawingShapes` 的单个模块，我们将直接使用它来访问这些类型。`DrawingShapes` 模块只不过是一系列\
    \ export import，如以下代码所示：\n\n```typescript\nexport import DrawingShapeBase =\n\
    require('Scripts/Drawing/DrawingShapes/DrawingShapeBase');\nexport import DrawingRectangle\
    \ =\nrequire('Scripts/Drawing/DrawingShapes/DrawingRectangle');\nexport import\
    \ DrawingLine =\nrequire('Scripts/Drawing/DrawingShapes/DrawingLine');\n```\n\n\
    `DrawingModel` 和 `CanvasEngine` 文件将导入它们需要的模块并将其中包含的类分配给 export 对象。既然我们所有的代码现在都在\
    \ AMD 模块中，我们就可以修改我们的 HTML 以仅加载应用程序的主入口点 `app.js`，它位于项目的根目录，其余模块将在程序执行过程中按需加载。\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\"\
    \ />\n    <title>TypeScript HTML App</title>\n    <link rel=\"stylesheet\" href=\"\
    app.css\" type=\"text/css\" />\n</head>\n<body>\n    <h1>Drawing Application</h1>\n\
    \    <div id=\"content\">\n        <div>\n            <button id=\"selectButton\"\
    >Select</button>\n            <button id=\"rectangleButton\">Rectangle</button>\n\
    \            <button id=\"lineButton\">Line</button>\n            <input type=\"\
    color\" id=\"colorPicker\" />\n        </div>\n        <canvas id=\"drawingCanvas\"\
    \ height=\"400\" width=\"570\"\n                style=\"border: 4px solid black;\"\
    ></canvas>\n    </div>\n    <script data-main=\"app.js\" src=\"scripts/require.js\"\
    ></script>\n</body>\n</html>\n```\n\n## Binding the user controls\n\n现在我们已将应用程序转换为使用\
    \ AMD 模块，让我们逐步增加应用程序的复杂性。目前，我们在 DOM 中搜索单个元素并为其附加事件处理程序。这不一定是坏事；然而，它确实使我们的代码容易受到许多可能问题的困扰。DOM\
    \ 可能尚未完成我们尝试附加到的对象的渲染，或者该对象可能已被另一段代码移除。这种方法另一个陷阱是，如果我们想向应用程序添加另一种绘图形状类型，我们必须在\
    \ HTML 中添加另一个元素，然后再添加更多代码来添加事件处理程序。这效率低下，并且可能导致在某处犯错。幸运的是，有许多可用的库允许我们实现诸如 **Model\
    \ View Controller (MVC)** 和 **Model View ViewModel (MVVM)** 之类的绑定模式。Knockout 就是其中一个库，它将\
    \ MVVM 引入 JavaScript 和 TypeScript 开发。\n\n"
