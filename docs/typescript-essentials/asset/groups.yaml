    # # About the Author


    **Christopher Nance** is an experienced software engineer and has been developing
    rich web applications for more than 4 years. At KnowledgeLake, he adopted TypeScript
    to develop a series of reusable components to scale across multiple product offerings
    and platforms.


    I would like to thank my parents for their constant support and encouragement.
    I would also like to thank my team at KnowledgeLake for pushing me to improve
    my skills as an engineer.'
  - '[PAGE 16]


    <!-- no content -->'
  - '[PAGE 17]


    # About the Reviewers


    **Andrea Martinelli** is a passionate software developer who is currently working
    on Shaman.IO, a tool that automatically detects and extracts structured data from
    the Web.


    In the past, he worked on Songr, a music player and aggregator. His interests
    span across web data extraction, code performance, and statically typed languages.
    He is a proficient C# developer and has been interested in TypeScript since its
    initial announcement. He graduated from the University of Trento in Computer Science
    and then studied at the Technical University of Denmark, even though he is now
    dedicating more time to the Shaman.IO project while moving across Europe.


    I would like to thank my friends, especially Gianluca and Stefano, for always
    being supportive. I would also like to thank Prof. Filz, who was one of my most
    influential teachers in high school. Thanks also to Mads, a special person that
    I will never forget. And to my family, who I haven’t seen for quite a long time.


    **Nathan Rozentals** has been writing commercial software for over 23 years, starting
    with COBOL on mainframes, through C, on to C++ and Java, and finally settling
    on C# and ASP.NET.


    He picked up TypeScript in October 2012—a day after the 0.8.0 release—and could
    not put it down. In TypeScript, he found a language that could bring all of the
    design patterns and practices he had learned over the years—in a variety of languages—to
    JavaScript.


    Some 6 days after the 0.8.0 release, he began blogging about TypeScript; covering
    a variety of topics, including unit testing, implementing an IoC container, and
    organizing code with AMD modules. He knew he had hit the mark when Microsoft themselves
    started to reference his blog in their CodePlex discussion forums.


    You can find his blog at http://blorkfish.wordpress.com.


    He currently works in the health industry, bringing touchscreen interfaces to
    medical systems, thereby enabling BYOD for clinicians and hospital staff.


    He is passionate about code quality, unit testing, and continuous integration,
    and has helped many large teams implement CI across many different software projects
    in many different languages.


    When he is not coding, he loves windsurfing and playing soccer. He is also an
    avid Liverpool FC supporter.


    I would like to thank my partner, Kathy, for her never ending love and support,
    and for giving me the freedom to spend long hours working on something that I
    am so passionate about. You are the best.


    To Ayron and Dayna—you are always in my thoughts—your enthusiasm for life and
    curious nature have given me such inspiration. I will always be there for you.


    **Basarat Ali Syed** (BAS) is a senior developer and the go-to guy for frontend
    issues at Picnic Software (http://picnicsoftware.com/) in Melbourne, Australia.
    He has a Master of'
  - '[PAGE 18]


    Computing degree from Australian National University and graduated with high distinction
    in all courses. He is a familiar face at developer meetups and conferences in
    Australia and has been a speaker at events such as ALT.NET, DDD Melbourne, MelbJS,
    and Node.js meetups, among others. He is deeply passionate about web technologies.
    He is a known member of the TypeScript community and works on the DefinitelyTyped
    team ([https://github.com/DefinitelyTyped](https://github.com/DefinitelyTyped)).
    In his spare time, he enjoys bodybuilding, cycling, and maintains a YouTube channel
    for helping fellow developers ([http://youtube.com/basaratali](http://youtube.com/basaratali)).
    You can easily find him on Twitter @basarat, [www.github.com/basarat](http://www.github.com/basarat),
    and [www.basarat.com](http://www.basarat.com).'
