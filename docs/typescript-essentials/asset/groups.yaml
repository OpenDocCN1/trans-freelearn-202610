    \ number;\n    y: number;\n}\nclass Point implements IPoint {\n    constructor(public\
    \ x: number, public y = 0) {\n    }\n}\n```\n```\n\nAs we discussed earlier, interfaces\
    \ are a purely compile time construct. The JavaScript that is output from this\
    \ example is completely identical to the JavaScript we just saw. I snuck in a\
    \ shorthand method of defining instance variables on classes too. Decorating the\
    \ constructor’s parameters with the public or private keywords tells TypeScript\
    \ to treat these objects as part of the type and not just initialization parameters.\n\
    \nClasses are not limited to implementing a single interface. Providing a comma\
