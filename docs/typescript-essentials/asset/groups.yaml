  - "[PAGE 125]\n\n# The basics\n\nBefore we dig into the main concepts of OOP, let’s\
    \ talk about what objects are and how they work. Objects are self-contained entities\
    \ that maintain a set of data members and methods. The data members are unique\
    \ to each object instance and the methods have direct access to these members.\
    \ An object represents an instance of a class type and any number of instances\
    \ can be created. Each of these instances will have different memory locations\
    \ to store their internal member variables at runtime to differentiate between\
    \ them. The following code sample shows a class definition and then the creation\
    \ of different objects of that type:\n\n```\nclass Shape {\n    public locationX:\
    \ number = 0;\n    public locationY: number = 0;\n    public height: number =\
    \ 0;\n    public width: number = 0;\n    constructor() {\n    }\n    public draw()\
    \ {\n    }\n    public resize(height: number, width: number) {\n        this.height\
    \ = height;\n        this.width = width;\n    }\n    public move(x: number, y:\
