    \n## 第 7 章. 增强绘图应用程序\n\n当我们在第 5 章 *创建简单的绘图应用程序* 中开始绘图应用程序时，我们按功能将所有代码分组在一起。这使我们能够减少应用程序运行所需的\
    \ script 标签数量。利用我们在上一章中学到的知识，我们将修改绘图应用程序以使用 AMD 模块和 RequireJS。我们还将集成 Knockout\
    \ 和 jQuery 以改善整体用户体验。最后，我们将查看如何使用 RequireJS 将所有应用程序代码构建成单个压缩文件以进行部署优化。我们将对应用程序进行的增强包括：\n\
    \n- 转换为 AMD 模块\n- 绑定用户控件\n- 生成单个输出文件\n- 美化应用程序\n\n### 转换为 AMD 模块\n\n转换为 AMD 模块是一个相当简单的过程。然而，这是一个审视项目结构和可维护性的好时机。在开始之前，我们必须安装\
    \ RequireJS NuGet 包版本 2.1.14 以及相应的声明文件 requirejs.TypeScript.DefinitelyTyped 版本\
    \ 0.2.0。\n\n![](img/83a7f7e1723158e56008cf70304a8da4_202_0.png)\n\nTypeScript\
    \ 构建设置也必须更改为使用上一章所示的 AMD 模块系统。一旦这些步骤完成，我们就可以开始增强我们的应用程序。为此，我们希望为应用程序添加一个文件夹结构，以帮助我们根据功能轻松分离模块。此时，重要的是决定如何划分应用程序的代码。由于我们使用的是\
    \ RequireJS 模块，我们将使用 export 关键字为所有希望从其他模块使用的对象。我们可以使用 export 关键字有三种方式，每种方式对生成的\
    \ JavaScript 都有不同的影响。以下示例显示了该关键字的更常见用法：\n\n```\nexport class Freehand implements\
    \ IFreehand {\n    public points: Array<IPoint> = [];\n    constructor() {\n \
    \   }\n    public AddPoint(point: IPoint) {\n        this.points.push(point);\n\
    \    }\n}\n```\n\n在此示例中，export 关键字注释了类型声明。这告诉 TypeScript 编译器将此类型放置在正在生成的模块的 exports\
    \ 对象上。\n\n**提示**\n\nexport 关键字只有在向编译器提供 `--module` 标志时才可用。尝试在不提供此选项的情况下使用它将导致编译器错误。Visual\
    \ Studio 在项目属性的 TypeScript Build 部分中选择模块系统时提供此标志。\n\n此类定义的 resulting JavaScript\
    \ 将与我们之前的模块定义非常相似。然而，由于我们选择使用 AMD 模块，会添加一些特殊语法：\n\n```\ndefine([\"require\", \"\
    exports\"], function(require, exports) {\n    var Freehand = (function () {\n\
    \        function Freehand() {\n            this.points = [];\n        }\n   \
    \     Freehand.prototype.AddPoint = function (point) {\n            this.points.push(point);\n\
    \        };\n        return Freehand;\n    })();\n    exports.Freehand = Freehand;\n\
    });\n```\n\nAMD 模块和标准 JavaScript 模块之间的差异从定义的最开始就显而易见。AMD 规范提供了一个名为 define 的函数，用于协助模块加载器。虽然这里只显示了该函数的两个参数，但该函数可选地接受一个在生成的\
    \ JavaScript 代码中显示的两个参数之前的前置参数。此可选第一个参数是模块的标识符，我们将在本章后面讨论此参数，以便我们想将最终的应用程序代码压缩时。define\
    \ 函数的第二个参数是模块依赖项列表。我们在项目中用来引用另一个模块的每个 require 语句都将包含在此列表中。第三个也是最后一个参数是我们定义模块的唯一强制参数，它是一个将执行以实例化对象或模块的函数。提供给\
    \ define 函数的每个依赖项都将作为参数提供给函数，以便在模块内部使用。\n\nexport 关键字也可以分配给一个类型。在以下示例中，你可以看到我们不是用\
    \ export 关键字装饰我们的类，而是改用赋值运算符为其赋予新值：\n\n```\nclass Circle implements ICircle {\n\
    \    constructor(public radius: number) {\n    }\n    public resize(radius: number)\
    \ {\n        this.radius = radius;\n    }\n    public area(): number {\n     \
    \   return Math.PI * this.radius * this.radius;\n    }\n}\nexport = Circle;\n\
    ```\n\n使用此方法将我们限制为从文件中导出单个类型；然而，此类型可以是包含任意数量导出对象的模块。生成的 JavaScript 看起来像以下代码：\n\
    \n```\ndefine([\"require\", \"exports\"], function(require, exports) {\n    var\
    \ Circle = (function () {\n        function Circle(radius) {\n            this.radius\
    \ = radius;\n        }\n        Circle.prototype.resize = function (radius) {\n\
    ```\n\n"
