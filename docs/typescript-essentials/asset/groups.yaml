    \ TypeScript 后可用的不同调试选项。我们还将介绍单元测试，这将使我们能够使用代码测试功能。在本章中，我们将研究以下主题：\n\n- Debugging\n\
    - Test-driven development\n\n### Debugging\n\n在开发纯 JavaScript 应用程序时，我们的调试选项通常取决于每个浏览器中可用的工具。大多数现代浏览器都包含某种形式的开发者控制台，允许我们查看网页上运行的脚本。从此控制台，我们可以设置断点并调查应用程序的行为。我们可以在\
    \ TypeScript 应用程序中执行相同的任务；然而，这会让我们逐步执行生成的 JavaScript，而不是我们实际编写的 TypeScript 代码。\n\
    \n### Source maps\n\n正如我们之前讨论的那样，源映射是一种将一个代码文件，通常是压缩过的，映射回原始代码文件的方法。在 TypeScript\
    \ 中，这一概念同样适用，并允许我们逐步执行未编译的 TypeScript 代码。要启用此功能，我们必须做的第一件事是确保项目设置已设置为生成源映射；此设置默认处于开启状态：\n\
    \n![](img/83a7f7e1723158e56008cf70304a8da4_237_0.png)\n\n此设置将为编译器提供 --sourcemap\
    \ 参数，并允许我们将输出的 JavaScript 文件链接到原始 TypeScript 文件。在大多数现代浏览器中，这将导致 TypeScript 文件下载到客户端，我们将能够设置断点并逐行逐步执行我们的代码。\n\
    \n### Debuggers\n\n有多种方法可以调试应用程序的代码，我们可能需要它们的组合来确保提供高质量的应用程序。Chrome、Firefox 和\
    \ Internet Explorer 等现代浏览器都包含一个开发者控制台，为 Web 应用程序提供调试功能。在下面的屏幕截图中，您可以看到我们可以使用 Chrome\
    \ 开发者工具直接进入 TypeScript 代码：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_238_0.png)\n\
    \n在这里，您可以看到我们在绘图应用程序的 `CanvasEngine` 的 `Draw` 方法上设置了一个断点。在源窗口中，JavaScript 文件和\
    \ TypeScript 文件都是可见的，就像我们在 TypeScript 文件中包含的类型注释一样。这对于开发人员来说是一个非常强大的功能，因为它防止我们必须将生成的\
    \ JavaScript 代码转换回原始 TypeScript 代码的特定行。使用 Visual Studio 和 Internet Explorer，我们实际上可以直接从\
    \ IDE 调试。这使我们能够以与调试 C# 代码相同的方式使用 Visual Studio 中可用的所有工具和功能。这包括调用堆栈、添加任何监视表达式以及对象探索，如以下屏幕截图所示：\n\
    \n测试应用程序代码在它预期运行的所有环境中非常重要。每个浏览器都实现了自己的 JavaScript 引擎，并且采用了 HTML5 标准的不同功能集。熟悉每个不同的开发者控制台对于跟踪和解决可能在另一个浏览器中不明显的问题非常重要。\n\
    \n### Test-driven development\n\n随着应用程序在规模和复杂性方面不断增长，我们交付尽可能少错误的软件比以往任何时候都更重要。手动测试不一致且缓慢，这意味着我们需要采用更系统的方法来确保软件质量。这种需求催生了测试驱动开发的概念。测试驱动开发是一种开发周期，重复一组小的步骤以确保每一行代码都经过测试。测试驱动开发生命周期的步骤是：\n\
    \n- Adding a test\n- Running the tests\n- Writing the code\n- Running the tests\
    \ again\n- Refactoring the code\n\n我们想要做的第一件事是编写一个测试来验证某些功能。这为我们尚未编写的代码创建了一个需求。当为新功能编写单元测试时，此测试最初会失败；这是预期的，有助于验证测试确实具有失败状态。此时，我们运行所有测试，验证现有测试仍然通过，而我们的新测试失败。如果新测试没有失败，则功能可能已经实现，或者测试无效，需要重写。一旦我们有了有效的测试，我们必须实现我们试图测试的功能。此代码在第一次实现时不必完美；目标只是编写足够多的代码来通过测试。当功能实现后，我们重新运行测试并验证我们的代码是否有效。如果没有，则必须进行更正。否则，代码可以重构；但测试必须始终通过。此过程重复进行，直到每个功能都有测试和实现。现在我们熟悉了测试驱动开发的过程，让我们看看\
    \ TypeScript 中的单元测试是如何工作的。\n\n# Note\n\n有关测试驱动开发的更多信息，请访问 http://msdn.microsoft.com/en-us/library/aa730844(v=vs.80).aspx。\n\
    \n### Unit testing\n\n单元测试是使用一组控制数据和预期结果测试小功能单元的代码块。这些测试可靠且可重用，确保我们的代码不仅针对应用程序的当前版本进行了测试，而且针对所有未来版本进行了测试。这将确保任何添加或修改的功能不会破坏现有功能，并在问题出现很早之前提醒我们。TypeScript\
    \ 不附带任何内置的单元测试工具；然而，Web 社区再次填补了这一空白。Maxim Fridberg 创建了一个单元测试框架，它为您提供了一种简单的方法来创建和查看您创建的库的所有单元测试。该框架的名称是\
    \ MaxUnit，可从 https://github.com/KnowledgeLakegithub/MaxUnit 下载，或作为名为 KL.Testing.MaxUnit\
    \ 的 NuGet 包提供。\n\n![](img/83a7f7e1723158e56008cf70304a8da4_242_0.png)\n\n此包将向我们的\
    \ Visual Studio 项目添加许多文件，包括框架的示例用法。MaxUnit 的优点是它允许我们为 TypeScript 库编写 TypeScript\
    \ 测试。有许多其他测试框架可用于测试 JavaScript 库，包括 Jasmine (https://github.com/pivotal/jasmine/)\
    \ 和 QUnit (http://qunitjs.com/)。通常最好将测试代码与实现代码分开，以确保它以与使用方式相同的方式进行测试。为了感受单元测试的工作方式，让我们以我们在绘图应用程序中创建的\
    \ Shapes 库为例，并创建一系列测试以确保其功能正常。Shapes 库输出到单个 JavaScript 文件，并且与之关联的接口可用于测试我们的代码。\n\
    \n"
