    \ T[]): T {\n        for (var i = 0; i < tasks.length; i++) {\n            this.CurrentTask\
    \ = tasks[i];\n            if (this.CurrentTask.Execute() == false) {\n      \
    \          return tasks[i];\n            }\n        }\n        this.CurrentTask\
    \ = null;\n        return null;\n    }\n}\n```\n\nGeneric functions and types\
    \ are not limited to a single unknown type. Type parameters can be lists of type\
    \ information that can be used anywhere within the declaration block that the\
    \ list is associated with. Creating a list of type parameters is the same as passing\
    \ a single type parameter, only each type is separated by a comma. Furthermore,\
    \ each generic type created in a parameter list can be used as a base type for\
