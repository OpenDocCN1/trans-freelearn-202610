  mdcn: "\n\n我们将 jQuery 和 Knockout 的引用包含在全局命名空间中，然后使用一个 script 标签引入 require。require\
    \ 标签中包含一个名为 `data-main` 的绑定，用于定义应用程序的入口点。\n\n**注意**\n\n有关 RequireJS 的更多信息，请访问\
