    \ stored tool type to the observable that was provided when the object was created.\
    \ The color selection control has an even simpler implementation:\n\n```\n```typescript\n\
    import ControlsTypes = require('Scripts/Controls/ControlsTypes');\nimport UserControlBase\
    \ = require('Scripts/Controls/UserControlBase');\nclass ColorSelectionControl\
    \ extends UserControlBase\n    implements ControlsTypes.IColorSelectionControl\
    \ {\n    constructor(id: string, public observable: KnockoutObservable<string>)\n\
    \    {\n        super(id);\n        this.templateName = \"ColorPickerTemplate\"\
    ;\n    }\n    public change(viewModel: any, event: JQueryEventObject) {\n    \
    \    this.observable((<any>event.currentTarget).value);\n    }\n}\nexport = ColorSelectionControl;\n\
    ```\n```"
  md: "\n## Reusable controls\n\nIn the previous chapter, we learned about Knockout\
    \ and its foreach binding that allows us to create a template in HTML that each\
    \ object in an array will be bound to. We will apply the same concept to each\
    \ of the options we have for our drawing application. Some of these objects are\
    \ very similar in type and functionality, such as the type selection controls.\
    \ However, the color picker has a very different interface to implement. This\
    \ is where the Knockout template binding will come in handy.\n\nThe Knockout template\
    \ binding allows us to provide an HTML template for a specific object type. This\
    \ gives us the ability to create a separation between our HTML and the JavaScript\
    \ that is running. In this case, we will have a list of user controls that will\
    \ be displayed in the space above our canvas object. Before we create the template\
    \ that we want to bind to, we will need to define the abstraction they will be\
    \ bound to. The top layer of this abstraction will be the IUserControl type, which\
    \ will contain two properties, id and templateName, and will be the minimum requirement\
    \ for binding our DOM elements to:\n\n```\nexport interface IUserControl {\n \
    \   id: string;\n    templateName: string;\n}\n```\n\nWe will also need interfaces\
    \ to represent the tool selection buttons and the color picker. These interfaces\
    \ are more specific to their direct functionality, but as long as they provide\
    \ a template name that matches it, all of our bindings will flow seamlessly. These\
    \ interfaces will be defined in a file called ControlsTypes.ts in the Controls\
    \ directory and can be seen in the following code:\n\n```\nexport interface IUpdateObservable\
    \ {\n    observable: KnockoutObservable<any>;\n}\nexport interface IToolSelectionControl\
    \ extends IUserControl,\nIUpdateObservable {\n    toolType: DrawingTypes.DrawingToolType;\n\
    \    click(viewModel: any, event: JQueryEventObject);\n    observable: KnockoutObservable<DrawingTypes.DrawingToolType>;\n\
    \    buttonText: KnockoutObservable<string>;\n}\nexport interface IColorSelectionControl\
    \ extends IUserControl,\nIUpdateObservable {\n    change(viewModel: any, event:\
    \ JQueryEventObject);\n    observable: KnockoutObservable<string>;\n}\n```\n\n\
    As you can see, the IToolSelectionControl interface has a toolType property that\
    \ will store the value that this control will be responsible for. There is also\
    \ a click function that will serve as an event handler in the HTML bindings we\
    \ will create shortly. The remaining two objects are Knockout observables, one\
    \ of which will be used to inform the calling application that a new tool has\
    \ been selected and the other will define the text that is displayed by the button.\
    \ The IColorSelectionControl interface extends IUserControl in the same way that\
    \ the IToolSelectionControl interface does, but the additional properties here\
    \ are very different. This interface defines a change method that will be called\
    \ when the color input change event fires. The final property of this interface\
    \ is very similar to the observable property on the IToolSelectionControl interface.\
    \ The primary difference between the two is that they store different types; in\
    \ this case, we store the string value that represents the current color. Due\
    \ to the close relationship between these two interfaces, we abstracted the IUpdateObservable\
    \ interface out and then provided a more specific type definition experience within\
    \ the more finely-grained interfaces.\n\nNow that we have our interfaces defined,\
    \ we can build our HTML templates to represent the different controls we wish\
    \ to create. The first template will contain only a button element that has bindings\
    \ of its own applied to it. The second template is the color picker with a different\
    \ set of bindings that is unique to this element type. The final thing we must\
    \ do is modify the area of our HTML that currently holds our controls. As you\
    \ can see, the resulting HTML has no direct controls defined, but as controls\
    \ are added to an observable list called userControls, they will appear in our\
    \ application:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
    utf-8\" />\n<title>TypeScript HTML App</title>\n<link rel=\"stylesheet\" href=\"\
    app.css\" type=\"text/css\" />\n<link rel=\"stylesheet\" href=\"DrawingApplication.css\"\
    \ type=\"text/css\" />\n<script src=\"Scripts/jquery-2.1.1.js\"></script>\n<script\
    \ src=\"Scripts/knockout-3.1.0.js\"></script>\n<script data-main=\"app\" src=\"\
    Scripts/require.js\"></script>\n</head>\n<body>\n<h1>Drawing Application</h1>\n\
    <div id=\"content\">\n<div data-bind=\"foreach: userControls\">\n<span data-bind=\"\
    attr: { id: id }, template: { name: templateName }\"></span>\n</div>\n<canvas\
    \ id=\"drawingCanvas\" height=\"400\" width=\"570\" />\n</div>\n</body>\n</html>\n\
    <script type=\"text/html\" id=\"ButtonTemplate\">\n<button class=\"tool-select-button\"\
    \ data-bind=\"text: buttonText, click: click, css: { 'selected': isSelected }\"\
    \ />\n</script>\n<script type=\"text/html\" id=\"ColorPickerTemplate\">\n<input\
    \ type=\"color\" data-bind=\"event: { change: change }\" />\n</script>\n```\n\n\
    As you can see, we use the foreach binding to create a new control for each object\
    \ in the UserControls list that our HTML will be bound to. Inside this, there\
    \ is a span element that is bound to the IUserControl interface. Our canvas object\
    \ will remain unchanged for now, but there are some new elements at the bottom\
    \ of the page. These new script tags will contain our HTML templates that the\
    \ user controls will bind to. The button template creates its bindings around\
    \ the tool selection control interface, binding the text to the ButtonText observable\
    \ and the click event to the click function. The color picker only needs to bind\
    \ the change event to the Change method.\n\nThe final piece of this is to implement\
    \ each of our interfaces and bind our view model to the DOM. Each of these types\
    \ will be placed in separate files in the controls directory. All of the files\
    \ can be seen in the following screenshot:\n\n![](img/83a7f7e1723158e56008cf70304a8da4_214_0.png)\n\
    \nWe will start with the base user control object, which will be in the UserControlBase.ts\
    \ file that the remainder of our types will extend:\n\n```\nimport ControlsTypes\
    \ = require('Scripts/Controls/ControlsTypes');\nclass UserControlBase implements\
    \ ControlsTypes.IUserControl {\n    public templateName: string = \"TemplateNotProvided\"\
    ;\n    constructor(public id: string) {\n    }\n}\nexport = UserControlBase;\n\
    ```\n\nThe id property comes in as a required property, and therefore will always\
    \ have a value. The templateName string is set to a bad value by default, and\
    \ this ensures that any type extending the UserControl type will be forced to\
    \ update this property. If an invalid template name is provided, Knockout will\
    \ generate an error at runtime. However, if an empty string is provided, execution\
    \ will continue as normal. Now let’s provide the implementation for our tool selection\
    \ buttons:\n\n```\nimport ControlsTypes = require('Scripts/Controls/ControlsTypes');\n\
    import UserControlBase = require('Scripts/Controls/UserControlBase');\nimport\
    \ DrawingTypes = require('Scripts/Drawing/DrawingTypes');\nclass ToolSelectionControl\
    \ extends UserControlBase\n    implements ControlsTypes.IToolSelectionControl\
    \ {\n    public buttonText: KnockoutObservable<string> = ko.observable(\"\");\n\
    \    constructor(id: string, public toolType: DrawingTypes.DrawingToolType,\n\
    \        public observable: KnockoutObservable<DrawingTypes.DrawingToolType>)\
    \ {\n        super(id);\n        this.templateName = \"ButtonTemplate\";\n   \
    \     this.buttonText(DrawingTypes.DrawingToolType[this.toolType]);\n    }\n}\n\
    ```\n\n```\n```typescript\npublic click(viewModel: any, event: JQueryEventObject)\
    \ {\n    this.observable(this.toolType);\n}\n}\nexport = ToolSelectionControl;\n\
    ```\n```\n\nThe overall code here isn’t very flashy, but it allows us to add new\
    \ tool buttons with significantly less effort than what was previously required.\
    \ The constructor of this type takes in the object’s ID to pass to the base type\
    \ constructor, the DrawingToolType value that the object instance will represent,\
    \ and finally a Knockout observable that will be updated when the button is clicked.\
    \ Since this is a concrete implementation, we must provide a valid name for our\
    \ HTML template, and finally, we use a bit of enumeration magic to provide the\
    \ value for our button’s text. The click event does nothing more than assign the\
    \ stored tool type to the observable that was provided when the object was created.\
    \ The color selection control has an even simpler implementation:\n\n```\n```typescript\n\
    import ControlsTypes = require('Scripts/Controls/ControlsTypes');\nimport UserControlBase\
    \ = require('Scripts/Controls/UserControlBase');\nclass ColorSelectionControl\
    \ extends UserControlBase\n    implements ControlsTypes.IColorSelectionControl\
    \ {\n    constructor(id: string, public observable: KnockoutObservable<string>)\n\
    \    {\n        super(id);\n        this.templateName = \"ColorPickerTemplate\"\
    ;\n    }\n    public change(viewModel: any, event: JQueryEventObject) {\n    \
    \    this.observable((<any>event.currentTarget).value);\n    }\n}\nexport = ColorSelectionControl;\n\
    ```\n```\n"
  mdcn: "\n\n## 可复用的控件\n\n在上一章中，我们了解了 Knockout 及其 foreach 绑定，它允许我们在 HTML 中创建一个模板，数组中的每个对象都会绑定到该模板上。我们将把相同的概念应用于绘图应用程序的每一个选项。其中一些对象在类型和功能上非常相似，例如类型选择控件。然而，颜色选择器需要实现的界面则非常不同。这时，Knockout\
    \ 模板绑定就派上用场了。\n\nKnockout 模板绑定允许我们为特定的对象类型提供 HTML 模板。这使我们能够将 HTML 与正在运行的 JavaScript\
    \ 分离开来。在本例中，我们将有一个用户控件列表，显示在画布对象上方的空间中。在创建要绑定到的模板之前，我们需要定义它们将绑定到的抽象。该抽象的最顶层是 IUserControl\
    \ 类型，它包含 id 和 templateName 两个属性，这是将我们的 DOM 元素绑定到它上面的最低要求：\n\n```\nexport interface\
    \ IUserControl {\n    id: string;\n    templateName: string;\n}\n```\n\n我们还需要一些接口来表示工具选择按钮和颜色选择器。这些接口更加专注于它们各自的直接功能，但只要它们提供了与之匹配的模板名称，我们所有的绑定都将无缝地进行。这些接口将定义在\
    \ Controls 目录下名为 ControlsTypes.ts 的文件中，代码如下：\n\n```\nexport interface IUpdateObservable\
    \ {\n    observable: KnockoutObservable<any>;\n}\nexport interface IToolSelectionControl\
    \ extends IUserControl,\nIUpdateObservable {\n    toolType: DrawingTypes.DrawingToolType;\n\
    \    click(viewModel: any, event: JQueryEventObject);\n    observable: KnockoutObservable<DrawingTypes.DrawingToolType>;\n\
    \    buttonText: KnockoutObservable<string>;\n}\nexport interface IColorSelectionControl\
    \ extends IUserControl,\nIUpdateObservable {\n    change(viewModel: any, event:\
    \ JQueryEventObject);\n    observable: KnockoutObservable<string>;\n}\n```\n\n\
    如你所见，IToolSelectionControl 接口有一个 toolType 属性，用于存储这个控件所负责的值。还有一个 click 函数，它将作为我们稍后要创建的\
    \ HTML 绑定中的事件处理器。其余两个对象是 Knockout observable，其中一个将用于通知调用应用程序已选择了新工具，另一个将用于定义按钮所显示的文本。IColorSelectionControl\
    \ 接口以与 IToolSelectionControl 接口相同的方式扩展了 IUserControl，但这里的附加属性却大不相同。该接口定义了一个 change\
    \ 方法，当颜色输入的 change 事件触发时，该方法将被调用。该接口的最后一个属性与 IToolSelectionControl 接口上的 observable\
    \ 属性非常相似。两者之间的主要区别在于它们存储的类型不同；在本例中，我们存储的是代表当前颜色的字符串值。由于这两个接口之间关系紧密，我们抽象出了 IUpdateObservable\
    \ 接口，然后在更细粒度的接口中提供了更具体的类型定义体验。\n\n现在我们已经定义了接口，就可以构建 HTML 模板来表示我们想要创建的不同控件了。第一个模板将只包含一个应用了自身绑定的按钮元素。第二个模板是颜色选择器，它具有一组专门针对此元素类型的独特绑定。最后，我们必须修改当前容纳控件的\
    \ HTML 区域。如你所见，生成的 HTML 中没有直接定义控件，但是当控件被添加到名为 userControls 的可观察列表时，它们就会出现在我们的应用程序中：\n\
    \n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\" />\n\
    <title>TypeScript HTML App</title>\n<link rel=\"stylesheet\" href=\"app.css\"\
    \ type=\"text/css\" />\n<link rel=\"stylesheet\" href=\"DrawingApplication.css\"\
    \ type=\"text/css\" />\n<script src=\"Scripts/jquery-2.1.1.js\"></script>\n<script\
    \ src=\"Scripts/knockout-3.1.0.js\"></script>\n<script data-main=\"app\" src=\"\
    Scripts/require.js\"></script>\n</head>\n<body>\n<h1>Drawing Application</h1>\n\
    <div id=\"content\">\n<div data-bind=\"foreach: userControls\">\n<span data-bind=\"\
    attr: { id: id }, template: { name: templateName }\"></span>\n</div>\n<canvas\
    \ id=\"drawingCanvas\" height=\"400\" width=\"570\" />\n</div>\n</body>\n</html>\n\
    <script type=\"text/html\" id=\"ButtonTemplate\">\n<button class=\"tool-select-button\"\
    \ data-bind=\"text: buttonText, click: click, css: { 'selected': isSelected }\"\
    \ />\n</script>\n<script type=\"text/html\" id=\"ColorPickerTemplate\">\n<input\
    \ type=\"color\" data-bind=\"event: { change: change }\" />\n</script>\n```\n\n\
    如你所见，我们使用 foreach 绑定为 UserControls 列表中的每个对象创建一个新控件，我们的 HTML 将绑定到这个列表。在该绑定内部，有一个\
    \ span 元素绑定到 IUserControl 接口。我们的画布对象暂时保持不变，但页面底部出现了一些新元素。这些新的 script 标签将包含用户控件要绑定到的\
    \ HTML 模板。按钮模板围绕工具选择控件接口创建绑定，将文本绑定到 ButtonText observable，并将 click 事件绑定到 click\
    \ 函数。颜色选择器只需要将 change 事件绑定到 Change 方法。\n\n最后一步是实现我们的每个接口，并将视图模型绑定到 DOM。这些类型中的每一个都将放在\
    \ controls 目录下的单独文件中。所有文件都可以在下面的截图中看到：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_214_0.png)\n\
    \n我们将从基础用户控件对象开始，它位于 UserControlBase.ts 文件中，我们其余的类型都将扩展它：\n\n```\nimport ControlsTypes\
    \ = require('Scripts/Controls/ControlsTypes');\nclass UserControlBase implements\
    \ ControlsTypes.IUserControl {\n    public templateName: string = \"TemplateNotProvided\"\
    ;\n    constructor(public id: string) {\n    }\n}\nexport = UserControlBase;\n\
    ```\n\nid 属性作为必填属性传入，因此它总是有值。templateName 字符串默认被设置为一个无效值，这确保了任何扩展 UserControl\
    \ 类型的类型都会被强制更新该属性。如果提供了无效的模板名称，Knockout 将在运行时生成错误。但是，如果提供的是空字符串，执行将继续正常进行。现在，让我们来实现工具选择按钮：\n\
    \n```\nimport ControlsTypes = require('Scripts/Controls/ControlsTypes');\nimport\
    \ UserControlBase = require('Scripts/Controls/UserControlBase');\nimport DrawingTypes\
    \ = require('Scripts/Drawing/DrawingTypes');\nclass ToolSelectionControl extends\
    \ UserControlBase\n    implements ControlsTypes.IToolSelectionControl {\n    public\
    \ buttonText: KnockoutObservable<string> = ko.observable(\"\");\n    constructor(id:\
    \ string, public toolType: DrawingTypes.DrawingToolType,\n        public observable:\
    \ KnockoutObservable<DrawingTypes.DrawingToolType>) {\n        super(id);\n  \
    \      this.templateName = \"ButtonTemplate\";\n        this.buttonText(DrawingTypes.DrawingToolType[this.toolType]);\n\
    \    }\n}\n```\n\n```\n```typescript\npublic click(viewModel: any, event: JQueryEventObject)\
    \ {\n    this.observable(this.toolType);\n}\n}\nexport = ToolSelectionControl;\n\
    ```\n```\n\n这里的整体代码并不花哨，但它让我们可以用比以前少得多的精力添加新的工具按钮。该类型的构造函数接收对象的 ID 以传递给基类构造函数、对象实例将要表示的\
    \ DrawingToolType 值，以及一个在按钮被点击时将被更新的 Knockout observable。由于这是一个具体实现，我们必须提供一个有效的\
    \ HTML 模板名称，最后，我们使用了一点枚举魔法来为按钮文本提供值。click 事件所做的只是将存储的工具类型赋给创建对象时提供的 observable。颜色选择控件的实现甚至更简单：\n\
    \n```\n```typescript\nimport ControlsTypes = require('Scripts/Controls/ControlsTypes');\n\
    import UserControlBase = require('Scripts/Controls/UserControlBase');\nclass ColorSelectionControl\
    \ extends UserControlBase\n    implements ControlsTypes.IColorSelectionControl\
    \ {\n    constructor(id: string, public observable: KnockoutObservable<string>)\n\
    \    {\n        super(id);\n        this.templateName = \"ColorPickerTemplate\"\
    ;\n    }\n    public change(viewModel: any, event: JQueryEventObject) {\n    \
    \    this.observable((<any>event.currentTarget).value);\n    }\n}\nexport = ColorSelectionControl;\n\
    ```\n```\n\n"
