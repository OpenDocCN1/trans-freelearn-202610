  - '[PAGE 57]


    being referenced, but as your applications grow and the dependency trees become
    more complex you could run into performance issues. Allowing implicit “any” types
    tells the compiler not to fail if an object’s type is not given or cannot be implied.
    Unchecking this option is the easiest way to force yourself to fully embrace the
    type system. Although you may run across some scenarios where an “any” type is
    inevitable they should be very rare. This can be done by providing a type annotation
    as shown here:


    ```

    var explicitAny: any;

    ```


    We also have the ability to change the module system we want to use when our JavaScript
    code is generated. We will discuss modules and the differences between each of
    our available options later on, but it is important to be aware of this option
    because it could drastically change the way our final code looks.


    The output section gives us a variety of options for what the final output from
    the compiler will be. Commenting code is a very useful way of making it maintainable,
    but this can bloat the size of a JavaScript file. This could cause performance
    problems when downloading the code to a remote client over the web. Since Visual
    Studio gives us the ability to define different compiler options for different
    build configurations, we could allow the comments to remain in the output for
    debugging while removing them for release builds. The Combine JavaScript output
    into file option allows us to combine all of our generated code into a single
    output file. This becomes incredibly useful as the number of files in our project
    grows and there are a lot of network calls taking place to get each file one at
    a time.


    We also have the ability to change the output path of the generated JavaScript.
    This gives us the ability to push changes directly into a test environment upon
    successful compilation without ever having to bring down the site or manually
    copy files to the deployment location. The last option in the output section is
    a very interesting one. Checking the Generate declaration files option will create
    declaration files for each of the types you create. These declaration files can
    then be referenced by other TypeScript files to provide a type definition for
    objects of a specific type. We will discuss declaration files in more depth later
    on in the book.


    The final section is related to how we want to debug our TypeScript code. We have
    the ability to generate source maps and the directory in which they should be
    deployed to. Source maps provide a way for debugging combined and minified JavaScript
    code. They are particularly helpful when debugging code that has been pushed into
    production by creating a way to make the JavaScript readable, however, in TypeScript
    they also provide us with a way back to the original TypeScript code. The final
    option specifies where the TypeScript files are located; this will allow debugging
    from inside of Visual Studio directly. In most scenarios, the default option here
    will suffice.'
