    # Summary


    In this chapter, we covered each of the different parameters for the TypeScript
    compiler. We discussed how to target the different versions of ECMAScript as well
    as which external module pattern to follow. Source maps will become very handy
    to debug our TypeScript code and declaration files will help us deploy compiled
    JavaScript while still providing a rich type experience for developers using TypeScript.
    The ability to pass a file to the compiler allows us to create reusable compilation
    scripts that can scale much further than using the command line alone. Next, we
    are going to cover how the different constructs turn what is normally a scripting
    language into an object-oriented language.'
