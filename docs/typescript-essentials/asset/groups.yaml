  - "[PAGE 171]\n\n# User options\n\nWe now have a reusable set of shape types, a\
    \ set of drawing types that contain references to our shapes, an engine to control\
    \ execution flow, and an object to keep track of and manage the drawing objects.\
    \ The only thing we are missing is user options to manipulate what action is taken.\
    \ In this section, we will be modifying our original HTML and finishing the implementation\
    \ of the DrawingModel type.\n\nThe first thing we need to do is add some new buttons.\
    \ Each one will be associated with a different tool type. As you can see in the\
    \ following screenshot, we now have three new buttons, each of which displays\
    \ the name of the tool that it represents:\n\n![](img/83a7f7e1723158e56008cf70304a8da4_171_0.png)\n\
    \nNow that we have the buttons, we need to perform some work when they are clicked.\
    \ The DrawingModel will handle this work for us since we will need to modify properties\
    \ of this object directly. We will need to add an event handler for each button\
    \ that sets a private member of the model to the corresponding drawing tool. In\
    \ the example of this class earlier, we had an empty constructor; we need to change\
    \ this so that when the model is created, it starts listening for the click events.\n\
    \n```\nprivate _drawingTool: DrawingToolType = DrawingToolType.Select;\nconstructor()\
    \ {\n    this._addEventListeners();\n}\nprivate _addEventListeners() {\n    var\
    \ selectButton = window.document.getElementById(\"selectButton\");\n    selectButton.addEventListener(\"\
    click\", (e) => {\n        this._drawingTool = DrawingToolType.Select;\n    },\
    \ true);\n```"
  - "[PAGE 172]\n\n```\nvar rectButton = window.document.getElementById(\"rectangleButton\"\
