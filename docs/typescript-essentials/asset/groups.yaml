    \n添加到自定义颜色\n\n## 小结\n\n在整章中，我们专注于用 TypeScript 从头到尾构建一个绘图应用程序。我们从应用程序的基本构建块（抽象）开始，然后创建了一套可复用的形状对象。这些对象随后被用于一组负责在\
