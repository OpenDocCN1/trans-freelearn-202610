  mdcn: "\n\n## 摘要\n\n本章所学内容将成为我们继续深入 TypeScript 之旅的基础。我们讨论了 TypeScript 以多种方式改进 JavaScript\
    \ 开发模型。TypeScript 通过增加静态类型系统和代码补全，使大规模应用程序开发变得更容易。Visual Studio 的 IntelliSense\
    \ 功能使 JavaScript 开发与 C# 和 Visual Basic 等其他语言保持一致。我们简要讨论了编译器以及它如何将 TypeScript 转换为可部署的\
    \ JavaScript，并创建了我们的第一个应用程序。之后展示的所有示例都将使用 Visual Studio；但是，请随意使用您喜欢的 IDE。在下一章中，我们将讨论\
    \ TypeScript 提供的不同语言特性以及编译器如何生成其 JavaScript 输出。\n\n## 第 2 章 TypeScript 基础\n\n\
    编译语言的主要好处之一是，它们在代码最终转换为机器代码之前，为开发人员提供更简洁的语法供其使用。TypeScript 能够通过将几种不同的模式封装到语言结构中，将这一优势带到\
    \ JavaScript 开发中，从而让我们编写更好的代码。我们已经谈到了一点 TypeScript 在 JavaScript 之上添加的静态类型系统。提供的每个显式类型注解都只是会在编译期间被移除的语法糖，但在其约束被分析和任何错误被捕获之前不会被移除。在本章中，我们将深入探讨该类型系统。我们还将讨论\
    \ TypeScript 引入的不同语言结构。我们将查看这些结构如何由编译器编译为纯 JavaScript。本章将对以下每个概念进行详细阐述：\n\n- Types\n\
    - Functions\n- Interfaces\n- Classes\n- Enums\n- Modules\n- Generic types\n\n\
    ### Types\n\n在第 1 章《开始使用 TypeScript》中，我们编写了第一个 TypeScript 应用程序并简要浏览了静态类型系统。创建了两个变量并为其提供了静态类型注解，将其声明为字符串对象。这些类型注解对正在创建的变量施加了一组特定的约束。这些约束允许编译器和开发工具更好地协助正确使用对象。这包括对象上可用的函数、变量和属性列表。如果创建变量时未提供类型，TypeScript\
    \ 将尝试从其使用的上下文中推断类型。例如，在以下代码中，我们没有显式声明变量 hello 为 string；然而，由于它是用初始值创建的，TypeScript\
    \ 能够推断它应始终被视为字符串：\n\n```typescript\nvar hello = \"Hello There\";\n```\n\nTypeScript\
    \ 具有这种上下文类型化的能力，为开发工具提供了以多种方式增强开发体验的能力。类型信息允许我们的 IDE 警告我们代码中的潜在错误，或提供智能代码补全和建议。正如以下屏幕截图所示，Visual\
    \ Studio 能够提供与字符串对象相关的方法和属性列表以及其类型信息：\n\n![](img/83a7f7e1723158e56008cf70304a8da4_62_0.png)\n\
    \n当对象的类型未给出并且无法从其初始化中推断时，它将被视为 Any 类型。Any 类型是 TypeScript 中所有其他类型的基础类型。它可以表示任何\
    \ JavaScript 值，并且对 Any 类型的对象执行的类型检查最少。TypeScript 中存在的每种其他类型都属于以下三类之一：原始类型、对象类型或类型参数。TypeScript\
    \ 的原始类型与 JavaScript 的非常相似。\n\nTypeScript 的原始类型如下：\n\n- **Number:** `var myNum:\
    \ number = 2;`\n- **Boolean:** `var myBool: boolean = true;`\n- **String:** `var\
    \ myString: string = \"Hello\";`\n- **Void:** `function(): void { var x = 2; }`\n\
    - **Null:** `if (x != null) { alert(x); }`\n- **Undefined:** `if (x != undefined)\
    \ { alert(x); }`\n\n所有这些类型都直接对应于 JavaScript 的原始类型，除了 void。void 类型用于表示值的缺失。返回无值的函数返回类型为\
    \ void。对象类型是你将在 TypeScript 中看到的最常见的类型，它们由对类、接口和匿名对象类型的引用组成。对象类型由一组复杂的成员组成。这些成员属于以下四类之一：属性、调用签名、构造函数签名或索引签名。本章后面，我们将开始使用\
    \ TypeScript 中的不同语言实体创建不同的对象类型。\n\n类型参数用于引用泛型类型或调用泛型函数。类型参数用于使代码足够通用以用于多种对象，同时将这些对象限制为特定的一组约束。我们可以介绍的泛型的一个早期示例是数组。数组的存在方式与\
    \ JavaScript 中的相同，并且在其上放置了一组额外的类型约束。数组对象本身具有某些类型约束和方法，这些是作为 Array 类型的对象创建的，数组声明带来的第二条信息是数组中包含的对象的类型。有两种方法可以显式为数组键入类型；否则，上下文类型系统将尝试推断类型信息：\n\
    \n```typescript\nvar array1: string[] = [];\nvar array2: Array<string> = [];\n\
