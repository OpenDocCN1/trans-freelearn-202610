  md: "\n## Adding tests\n\nNow that we have the tooling installed, let’s begin the\
    \ process of unit testing our library. The first thing we need to do is add the\
    \ Shapes library to the testing project. This process can be done manually or\
    \ can be automated using PowerShell to deploy the latest version of our code.\
    \ For now, we will handle it manually so that we can focus on testing. Once our\
    \ library is added to the project, we can begin writing tests. We will create\
    \ a separate testing class to test each of our objects in the Shapes library.\
    \ Let’s start with the simplest class in the library, the Point class, to get\
    \ a feel for testing. In the following sample, you can see we have created a new\
    \ class called test_Point that contains all of our tests for this particular class:\n\
    \n```\n/// <reference path=\"../../maxunit.ts\" />\n/// <reference path=\"../../scripts/typings/shapes/shapestypes.d.ts\"\
    \ />\nclass test_Point extends maxUnit.TestClassBase {\n    private _shapes: Shapes\
    \ = null;\n    constructor() {\n        //give test suite a name\n        super('test_Point');\n\
    \        //add test by name\n    }\n    setUpAsync(dfdSetup: jQueryDeferred<any>)\
    \ {\n        var cb = super.setUpAsync;\n        require(['/Scripts/Shapes/Shapes.js'],\
    \ (Shapes) => {\n            this._shapes = Shapes;\n            cb(dfdSetup);\n\
    \        });\n    }\n    tearDown() {\n        super.tearDown();\n    }\n}\n\n\
    export = test_Point;\n```\n\nThe class inherits from the maxUnit base class TestClassBase,\
    \ which provides methods used to register tests with the testing framework. The\
    \ constructor calls the base constructor and provides the name for this set of\
    \ tests. Eventually, this section will also contain the registration for each\
    \ of our unit tests. The setUpAsync method will be used to set up any necessary\
    \ mock objects and create a reference to the Shapes library. If our library contained\
    \ jQuery or any other dependencies, we would mock these objects to ensure our\
    \ library performs as expected. The tearDown method provides a place to provide\
    \ any cleanup logic that you may want to execute after the tests have run. Now,\
    \ let’s begin by writing some very simple tests that will verify the creation\
    \ of a Point object. Each unit test should be arranged into three sections:\n\n\
    - Arrange\n- Act\n- Assert\n\nThe arrange section will create any objects we need\
    \ to perform our test, act will perform\n\n## Welcome to MaxUnit\n\n## Tests:(Total\
    \ Failed : 0)\n(Total Passed: 2)\n\nTest:\nShapeTests/test_Point\n(failed: 0)\
    \ (passed: 2)\n\n## Passed\n\n| Test Name | Test Description | Message |\n|---|---|---|\n\
    | test_PointInitX | Test Point.X value init | OK |\n| test_PointInitY | Test Point.Y\
    \ value init | OK |\n\nThese are both very simple tests that cover the most basic\
    \ path used to create Point objects; however, when writing unit tests, we want\
    \ to cover as many scenarios as possible to verify proper functionality. For instance,\
    \ rather than just testing specific classes, let’s write some tests around an\
    \ interface, which will create a series of tests that can be successfully run\
    \ on multiple concrete implementations. In the following example, you can see\
    \ we have created a new set of tests that will be used to test the IRectangle\
    \ interface:\n\n```\n/// <reference path=\"../../maxunit.ts\" />\n/// <reference\
    \ path=\"../../scripts/typings/shapes/shapetypes.d.ts\" />\nclass test_IRectangle\
    \ extends maxUnit.TestClassBase {\n    private _shapes: Shapes = null;\n    constructor()\
    \ {\n        //give test suite a name\n        super('test_Point');\n        //add\
    \ test by name\n        this.AddTest('test_RectangleResize', 'Test resizing of\
    \ Rectangle');\n    }\n    setUpAsync(dfdSetup: JQueryDeferred<any>) {\n     \
    \   var cb = super.setUpAsync;\n```\n\n```\n```typescript\nrequire(['/Scripts/Shapes/Shapes.js'],\
    \ (Shapes) => {\n    this._shapes = Shapes;\n    cb(dfdSetup);\n});\n}\ntearDown()\
    \ {\n    super.tearDown();\n}\ntest_RectangleResize() {\n    //Arrange\n    var\
    \ rect: IRectangle = new this._shapes.Rectangle(4, 6);\n    this.test_IRectangleResize(rect);\n\
    }\ntest_IRectangleResize(r: IRectangle) {\n    //Act\n    r.resize(3, 9);\n  \
    \  //Assert\n    this.Assert.AreIdentical(9, r.width, \"Should return 9\");\n\
    }\n}\n\nexport = test_IRectangle;\n```\n```\n\nAs you can see, our class structure\
    \ is very similar; however, the pieces of the unit test have been separated into\
    \ two logical parts. The first is the creation of the object we are attempting\
    \ to test, and the second is the interface that we will be testing. The second\
    \ piece of this test can be reused again and again for each class we create that\
    \ implements IRectangle. For instance, squares are quite similar to rectangles;\
    \ in fact, we could implement them in such a way that they have the exact same\
    \ set of properties. We can very easily add a new class to our Shapes library\
    \ that will represent squares:\n\n```\n```typescript\nexport class Square implements\
    \ IRectangle {\n    constructor(public height: number, public width) {\n     \
    \   this.width = this.height;\n    }\n    public resize(height: number, width:\
    \ number) {\n        this.height = height;\n        this.width = height;\n   \
    \ }\n}\n```\n```\n\nAs you can see, this class upholds both the IRectangle interface\
    \ and the notion of squares by making sure that the width and height properties\
    \ get set to the same value. We can now write a third testing method in the test_IRectangle\
    \ class that will instantiate a new Square object and run it through the resize\
    \ test that is being used for the Rectangle objects:\n\n```\n```typescript\ntest_SquareResize()\
    \ {\n    //Arrange\n    var square: IRectangle = new this._shapes.Square(4, 6);\n\
    \    this.test_IRectangleResize(square);\n}\n```\n```\n\nBy using our interface\
    \ abstraction, our tests become reusable units of code for multiple\n\nobject\
    \ types. Running these tests together results in the following output:\n\n## Tests:(Total\
    \ Failed : 1)\n(Total Passed: 3)\n\n- Test:\nShapeTests/test_Point\n(failed: 0)\
    \ (passed: 2)\n\n- Test:\nShapeTests/test_IRectangle\n(failed: 1) (passed: 1)\n\
    \n## Failed\n\n| Test Name | Test Description | Message |\n| test_SquareResize\
    \ | Test resizing of Squares | areIdentical failed when passed expected: {number}\
    \ \"9\" and actual:{number} \"3\" Should return 9 |\n\n## Passed\n\n| Test Name\
    \ | Test Description | Message |\n| test_RectangleResize | Test resizing of Rectangle\
    \ | OK |\n\nThe square test has failed. The interface was implemented so our code\
    \ was able to compile; however, this has exposed a problem with our assumption\
    \ about squares. Through our implementation, we forced the behavior of a square\
    \ onto an IRectangle type. This test exposed the fact that we broke the Liskov\
    \ substitution principle that we discussed in Chapter 4, Object-oriented Programming\
    \ with TypeScript. We are not able to safely substitute one IRectangle object\
    \ for another, which could result in unexpected behavior.\n\n## Summary\n\nIn\
    \ this chapter, we discussed the final pieces of TypeScript development. We discussed\
    \ source maps and how TypeScript uses them to map output JavaScript files back\
    \ to the original TypeScript file, allowing us to step through our code before\
    \ compilation. We looked at the different environments in which we could debug\
    \ our code, whether it be in the browser or the IDE. Finally, we looked at test-driven\
    \ development and how it allows us to catch errors and unexpected functionality\
    \ in a reusable and consistent manner. We discussed a large number of topics in\
    \ a short period of time:\n\n- Working with the compiler\n- TypeScript’s language\
    \ constructs\n- Object-oriented development with TypeScript\n- Asynchronous module\
    \ definitions\n- Integrating with external libraries\n- Test-driven development\n\
    \nWe built a drawing application using each of these different topics and refined\
    \ it as our needs changed and knowledge increased. You are now capable of starting\
    \ a new application in TypeScript and taking it from initial requirements to a\
    \ polished final product.\n\n## B\n\n- build options / [Build options](#)\n"
  mdcn: "\n\n## 添加测试\n\n现在我们已经安装了工具链，让我们开始对库进行单元测试的过程。首先需要做的是将 Shapes 库添加到测试项目中。此过程可以手动完成，也可以使用\
    \ PowerShell 自动部署我们代码的最新版本。对于现在，我们将手动处理它，以便我们可以专注于测试。一旦我们的库被添加到项目中，我们就可以开始编写测试。我们将为\
    \ Shapes 库中的每个对象创建一个单独的测试类来进行测试。让我们从库中最简单的类 Point 类开始，以感受测试。在下面的示例中，你可以看到我们创建了一个名为\
    \ test_Point 的新类，其中包含针对该特定类的所有测试：\n\n```\n/// <reference path=\"../../maxunit.ts\"\
    \ />\n/// <reference path=\"../../scripts/typings/shapes/shapestypes.d.ts\" />\n\
    class test_Point extends maxUnit.TestClassBase {\n    private _shapes: Shapes\
    \ = null;\n    constructor() {\n        //give test suite a name\n        super('test_Point');\n\
    \        //add test by name\n    }\n    setUpAsync(dfdSetup: jQueryDeferred<any>)\
    \ {\n        var cb = super.setUpAsync;\n        require(['/Scripts/Shapes/Shapes.js'],\
    \ (Shapes) => {\n            this._shapes = Shapes;\n            cb(dfdSetup);\n\
    \        });\n    }\n    tearDown() {\n        super.tearDown();\n    }\n}\n\n\
    export = test_Point;\n```\n\n该类继承自 maxUnit 基类 TestClassBase，它提供了用于将测试注册到测试框架的方法。构造函数调用基构造函数并提供此组测试的名称。最终，此部分还将包含我们每个单元测试的注册。setUpAsync\
    \ 方法将用于设置任何必要的模拟对象并创建对 Shapes 库的引用。如果我们的库包含 jQuery 或任何其他依赖项，我们将模拟这些对象以确保我们的库按预期执行。tearDown\
    \ 方法提供了一个位置，用于在测试运行后执行你可能想要的任何清理逻辑。现在，让我们开始编写一些非常简单的测试来验证 Point 对象的创建。每个单元测试应分为三个部分：\n\
    \n- Arrange\n- Act\n- Assert\n\nArrange 部分将创建我们执行测试所需的任何对象，act 将执行\n\n## 欢迎使用\
    \ MaxUnit\n\n## Tests:(Total Failed : 0)\n(Total Passed: 2)\n\nTest:\nShapeTests/test_Point\n\
    (failed: 0) (passed: 2)\n\n## Passed\n\n| Test Name | Test Description | Message\
    \ |\n|---|---|---|\n| test_PointInitX | Test Point.X value init | OK |\n| test_PointInitY\
    \ | Test Point.Y value init | OK |\n\n这些都是非常简单的测试，涵盖了创建 Point 对象所使用的最基本路径；然而，在编写单元测试时，我们希望覆盖尽可能多的场景以验证正确的功能。例如，与其只测试特定的类，让我们围绕一个接口编写一些测试，这将创建一系列可以在多个具体实现上成功运行的测试。在下面的示例中，你可以看到我们创建了一组新的测试，将用于测试\
    \ IRectangle 接口：\n\n```\n/// <reference path=\"../../maxunit.ts\" />\n/// <reference\
    \ path=\"../../scripts/typings/shapes/shapetypes.d.ts\" />\nclass test_IRectangle\
    \ extends maxUnit.TestClassBase {\n    private _shapes: Shapes = null;\n    constructor()\
    \ {\n        //give test suite a name\n        super('test_Point');\n        //add\
    \ test by name\n        this.AddTest('test_RectangleResize', 'Test resizing of\
    \ Rectangle');\n    }\n    setUpAsync(dfdSetup: JQueryDeferred<any>) {\n     \
    \   var cb = super.setUpAsync;\n```\n\n```\n```typescript\nrequire(['/Scripts/Shapes/Shapes.js'],\
    \ (Shapes) => {\n    this._shapes = Shapes;\n    cb(dfdSetup);\n});\n}\ntearDown()\
    \ {\n    super.tearDown();\n}\ntest_RectangleResize() {\n    //Arrange\n    var\
    \ rect: IRectangle = new this._shapes.Rectangle(4, 6);\n    this.test_IRectangleResize(rect);\n\
    }\ntest_IRectangleResize(r: IRectangle) {\n    //Act\n    r.resize(3, 9);\n  \
    \  //Assert\n    this.Assert.AreIdentical(9, r.width, \"Should return 9\");\n\
    }\n}\n\nexport = test_IRectangle;\n```\n```\n\n正如你所见，我们的类结构非常相似；然而，单元测试的各个部分已被分离为两个逻辑部分。第一部分是我们尝试测试的对象的创建，第二部分是我们将要测试的接口。此测试的第二部分可以一遍又一遍地重用于我们创建的每个实现\
    \ IRectangle 的类。例如，正方形与矩形非常相似；事实上，我们可以以这样的方式实现它们，使它们具有完全相同的属性集。我们可以非常轻松地向我们的 Shapes\
    \ 库添加一个新类来表示正方形：\n\n```\n```typescript\nexport class Square implements IRectangle\
    \ {\n    constructor(public height: number, public width) {\n        this.width\
    \ = this.height;\n    }\n    public resize(height: number, width: number) {\n\
    \        this.height = height;\n        this.width = height;\n    }\n}\n```\n\
    ```\n\n正如你所见，这个类同时维护了 IRectangle 接口和正方形的概念，通过确保 width 和 height 属性被设置为相同的值。我们现在可以在\
    \ test_IRectangle 类中编写第三个测试方法，该方法将实例化一个新的 Square 对象并将其通过用于 Rectangle 对象的 resize\
    \ 测试：\n\n```\n```typescript\ntest_SquareResize() {\n    //Arrange\n    var square:\
    \ IRectangle = new this._shapes.Square(4, 6);\n    this.test_IRectangleResize(square);\n\
    }\n```\n```\n\n通过使用我们的接口抽象，我们的测试成为可重用的代码单元，可用于多种\n\n对象类型。一起运行这些测试会产生以下输出：\n\n\
    ## Tests:(Total Failed : 1)\n(Total Passed: 3)\n\n- Test:\nShapeTests/test_Point\n\
    (failed: 0) (passed: 2)\n\n- Test:\nShapeTests/test_IRectangle\n(failed: 1) (passed:\
    \ 1)\n\n## Failed\n\n| Test Name | Test Description | Message |\n| test_SquareResize\
    \ | Test resizing of Squares | areIdentical failed when passed expected: {number}\
    \ \"9\" and actual:{number} \"3\" Should return 9 |\n\n## Passed\n\n| Test Name\
    \ | Test Description | Message |\n| test_RectangleResize | Test resizing of Rectangle\
    \ | OK |\n\n正方形测试失败了。接口已实现，因此我们的代码能够编译；然而，这暴露了我们对正方形的假设存在问题。通过我们的实现，我们将正方形的行为强加给了\
    \ IRectangle 类型。此测试暴露了我们破坏了我们在第 4 章《使用 TypeScript 进行面向对象编程》中讨论的里氏替换原则的事实。我们无法安全地用另一个\
    \ IRectangle 对象替换一个 IRectangle 对象，这可能导致意外的行为。\n\n## Summary\n\n在本章中，我们讨论了 TypeScript\
    \ 开发的最后几个部分。我们讨论了源映射以及 TypeScript 如何使用它们将输出 JavaScript 文件映射回原始 TypeScript 文件，使我们能够在编译前逐步执行代码。我们查看了调试代码的不同环境，无论是在浏览器中还是在\
    \ IDE 中。最后，我们查看了测试驱动开发以及它如何以可重用和一致的方式让我们捕获错误和意外功能。我们在短时间内讨论了大量主题：\n\n- Working\
    \ with the compiler\n- TypeScript’s language constructs\n- Object-oriented development\
    \ with TypeScript\n- Asynchronous module definitions\n- Integrating with external\
    \ libraries\n- Test-driven development\n\n我们使用这些不同的主题构建了一个绘图应用程序，并在需求变化和知识增加时对其进行了改进。你现在有能力在\
    \ TypeScript 中启动一个新应用程序，并将其从初始需求带到抛光的最终产品。\n\n## B\n\n- build options / [Build\
    \ options](#)\n\n"
