    # Chapter 3. The TypeScript Compiler


    In this chapter, the TypeScript compiler will be analyzed. The different parameters
    that the compiler understands will be broken down and explained, as well as how
    they affect the ECMAScript that gets generated. We will discuss how to control
    where your code gets generated to, as well as the different files that can accompany
    our generated ECMAScript. There are also a few other options available on the
    compiler that make building and deploying large scale applications easier.


    The topics that will be covered in the chapter are as follows:


    +   - ECMAScript generation

    +   - Output control

    +   - Advanced compiler options'
  - '[PAGE 102]


    # Generation of ECMAScript


    As with most programming languages, ECMAScript has evolved over time. It was initially
    developed in the mid-nineties for use in client-side scripting. The current standard
    is ECMAScript 5; however, Version 6 is currently being worked on. The TypeScript
    compiler provides a list of options to change the way your code is generated.
    In this section, we will look at these options and compare the results.'
  - '[PAGE 103]


    # ECMAScript version


    Writing JavaScript code means your code must be portable across multiple types
    of client devices and browsers. You may be forced to not only support the latest
    version of a browser but potentially any of its previous versions. For this reason,
    the compiler supports compiling your TypeScript code into different versions of
    ECMAScript. ECMAScript 3 was a widely adopted and heavily used standard and has
    survived in many legacy browsers. ECMAScript 4 was abandoned when the group responsible
    for creating the standard could not agree on the language features. ECMAScript
    5 is the current standard and has been adopted by most current browsers. It was
    published in 2009, nearly a decade after Version 3 was initially published. In
    Chapter 2, *TypeScript Basics*, we saw that you could easily switch between versions
    of ECMAScript in Visual Studio. Let’s take a look at what is actually going on
    behind the scenes when we change this option. In the following screenshot, you
    can see that we call the compiler the same way we did in Chapter 1, *Getting Started
    with TypeScript*, only this time we have provided an additional parameter:


    ![](img/83a7f7e1723158e56008cf70304a8da4_103_0.png)


    As you can see, there are two ways of passing the ECMAScript target version to
    the compiler: the verbose method `--target` and the shorthand method `-t`.


    # Tip


    If a target version is not supplied, the compiler will default to ECMAScript 3.
    So, unless you are explicitly using language constructs only defined in ECMAScript
    5, this parameter does not need to be provided.


    ECMAScript 5 was originally slated to be a minor update, ECMAScript 3.1, and provide
    only a limited set of new features in an attempt to maintain backwards compatibility.
    Strict mode was introduced, which provides a set of different semantic rules to
    the language. There are three primary changes that strict mode makes to normal
    ECMAScript semantics:


    +   - Certain silent errors are now thrown

    +   - Enforces rules that allow the language engine to provide more optimizations

    +   - Ensures that certain keywords can’t be used to allow future versions of
    ECMAScript to have them available for the language specification


    While the option to use strict mode is still available in TypeScript by placing
    `use strict` at the top of your TypeScript file, its value is less significant.
    The TypeScript compiler accounts for most of the rules enforced on JavaScript
    code that is run in strict mode. For'
