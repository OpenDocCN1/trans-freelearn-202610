    \ 文件也会被编译。当只有少数文件被引用时，这是一个有用的功能，但随着应用程序的增长和依赖树变得更加复杂，你可能会遇到性能问题。允许隐式“any”类型告诉编译器如果对象的类型未给出或无法推断则不要失败。取消选中此选项是最简单的方式来强制自己完全拥抱类型系统。虽然你可能会遇到一些“any”类型不可避免的场景，但它们应该非常罕见。这可以通过提供类型注解来完成，如下所示：\n\
    \n```\nvar explicitAny: any;\n```\n\n我们也有能力更改在生成 JavaScript 代码时要使用的模块系统。我们将在后面讨论模块以及我们每个可用选项之间的差异，但了解此选项很重要，因为它可能会极大地改变我们最终代码的外观。\n\
    \n输出部分为编译器的最终输出提供了多种选项。注释代码是使代码可维护的非常有用的方式，但这会使 JavaScript 文件变大。这可能会在通过网络将代码下载到远程客户端时导致性能问题。由于\
    \ Visual Studio 允许我们为不同的构建配置定义不同的编译器选项，我们可以在调试时允许注释保留在输出中，同时在发布构建中删除它们。Combine\
    \ JavaScript output into file 选项允许我们将所有生成的代码合并到单个输出文件中。随着项目中文件数量的增长并且需要一次一个地获取每个文件的大量网络调用，这变得非常有用。\n\
    \n我们也有能力更改生成的 JavaScript 的输出路径。这使我们能够在成功编译后直接将更改推送到测试环境，而无需关闭站点或手动将文件复制到部署位置。输出部分中的最后一个选项非常有趣。选中\
    \ Generate declaration files 选项将为你创建的每个类型创建声明文件。然后其他 TypeScript 文件可以引用这些声明文件以提供特定类型对象的类型定义。我们将在本书后面更深入地讨论声明文件。\n\
    \n最后一部分与我们希望如何调试 TypeScript 代码有关。我们有能力生成源映射以及它们应该部署到的目录。源映射为调试合并和压缩的 JavaScript\
    \ 代码提供了一种方式。当调试已推送到生产环境的代码时，它们特别有帮助，因为它们创建了一种使 JavaScript 可读的方式，然而，在 TypeScript\
    \ 中，它们也为我们提供了一种返回原始 TypeScript 代码的方式。最后一个选项指定 TypeScript 文件的位置；这将允许直接从 Visual\
    \ Studio 进行调试。在大多数情况下，此处的默认选项就足够了。\n\n"
