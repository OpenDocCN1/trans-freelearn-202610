    # JavaScript output


    Up until this point, we have only been working with compiling single TypeScript
    files at a time. As applications grow in size though, it is very important to
    separate our code into maintainable segments. When writing code for a C# application,
    it is common to separate code files by class. JavaScript conventions vary in how
    code is segmented. If following the module pattern, it is common to place an entire
    module in a single file; otherwise, code is usually segmented into related blocks
    as the application requires them. Passing multiple file names separated by spaces
    will tell the compiler to parse each file and generate a JavaScript file for each.
    The following screenshot shows how this is done:


    ![](img/83a7f7e1723158e56008cf70304a8da4_111_0.png)


    As you can see, we now have two TypeScript files and each is being passed to the
    compiler as a parameter. The result of running this command will be two JavaScript
    files, one for each corresponding TypeScript file. There is no limit to the number
    of files that can be provided; however, at some point the command line will reach
