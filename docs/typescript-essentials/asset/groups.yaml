  mdcn: "\n\n## 形状\n\n遵循我们在上一章中学到的原则，我们需要在应用程序中执行不同任务时使用多种不同的类型。我们需要对形状是什么的表示，如何绘制它们，与用户界面交互的东西，以及维护要绘制的对象列表的地方。\n\
    \n```typescript\n}\nclass Circle implements ICircle {\n    constructor(public\
    \ radius: number) {\n    }\n    public resize(radius: number) {\n        this.radius\
    \ = radius;\n    }\n    public area(): number {\n        return Math.PI * this.radius\
    \ * this.radius;\n    }\n}\nclass Line implements ILine {\n    constructor(public\
    \ p1: IPoint, public p2: IPoint) {\n    }\n    public length(): number {\n   \
    \     var a2 = Math.pow(this.p2.x - this.p1.x, 2);\n        var b2 = Math.pow(this.p2.y\
    \ - this.p1.y, 2);\n        return Math.sqrt(a2 + b2);\n    }\n}\nclass Freehand\
    \ implements IFreehand {\n    public points: Array<IPoint> = [];\n    constructor()\
    \ {\n    }\n    public addPoint(point: IPoint) {\n        this.points.push(point);\n\
    \    }\n}\n```\n\n这些类中的每一个都仅限于单一职责，即跟踪形状的状态并报告与其关联的各种属性。所有这些功能都很有用，但它并不能完全达到我们在画布上绘制对象的目标。\n\
    \n## 绘制形状\n\n现在我们已经有了要绘制的基本表示，我们需要定义将处理此事的对象。这些对象应尽可能少地完成绘制其所代表形状所需的工作。这意味着不直接与\
    \ **Document Object Model (DOM)** 交互。以下接口表示我们将用来表示可在画布元素上绘制和操作形状的不同抽象：\n\n```typescript\n\
    interface IDraw {\n    draw(ctx: CanvasRenderingContext2D);\n}\ninterface IResize\
    \ {\n    inResizeZone: (mouse: IPoint) => boolean;\n    resizeToLocation: (to:\
    \ IPoint) => void;\n}\ninterface IMove {\n    move: (to: IPoint) => void;\n  \
    \  contains: (mousePoint: IPoint, ctx: CanvasRenderingContext2D) => boolean;\n\
    \    getMoveOffset(mousePos: IPoint): IPoint;\n}\ninterface IDrawingShape extends\
    \ IDraw, IResize, IMove {\n    shape: IShape;\n    location: IPoint;\n    isSelected:\
    \ boolean;\n    selectionZoneWidth: number;\n    opacity: number;\n    getCursorType:\
    \ (mousePoint: IPoint) => string;\n    getClickLocationAction(mouse: IPoint, ctx:\
    \ CanvasRenderingContext2D): CanvasEngineAction;\n}\n```\n\n每个接口都可以很容易地合并成一个单一接口，但根据接口隔离原则，每个操作现在都可以根据需要彼此解耦。IDrawingShape\
    \ 接口最终合并了这些类型，同时添加了一些自己的功能。所有这些组合在一起表示一种类型，我们将能够在 HTML 画布元素上绘制并以某种方式与其交互。每个 IDrawingShape\
    \ 实例都保存对其特定形状的引用，然后可由我们的应用程序逻辑访问或操作。将每个形状与绘图特定接口分离，维护了单一职责原则，允许形状跟踪其数据，而绘图对象将只负责与在浏览器中渲染特定形状相关的方法。形状在画布上的位置由绘图形状管理，以及它是否是画布上当前选中的对象。getCursorType\
    \ 和 getClickLocationAction 函数是应用程序特定的，将允许负责处理用户交互的对象在继续其应用程序逻辑之前从绘图对象请求信息。此接口的具体实现如下：\n\
    \n```typescript\nclass DrawingShapeBase implements IDrawingShape {\n    public\
    \ shape: IShape = null;\n    public location: IPoint = new Point(0, 0);\n    public\
    \ isSelected: boolean = false;\n    public selectionZoneWidth: number = 4;\n \
    \   public opacity: number = 1;\n    constructor() {\n    }\n    public inResizeZone(mouse:\
    \ IPoint): boolean {\n        throw \"Method not implemented\";\n    }\n    public\
    \ move(to: IPoint) {\n        this.location = to;\n    }\n    public resizeToLocation(to:\
    \ IPoint) {\n        throw \"Method not implemented\";\n    }\n    public contains(mousePoint:\
    \ IPoint, ctx: CanvasRenderingContext2D): boolean {\n        throw \"Method not\
    \ implemented\";\n    }\n    public draw(ctx: CanvasRenderingContext2D) {\n  \
    \      throw \"Method not implemented\";\n    }\n    public getMoveOffset(mousePos:\
    \ IPoint): IPoint {\n        return new Point(0, 0);\n    }\n    public getCursorType(mousePoint:\
    \ IPoint): string {\n        throw \"Method not implemented\";\n    }\n    public\
    \ getClickLocationAction(mousePoint: Point, ctx: CanvasRenderingContext2D): CanvasEngineAction\
    \ {\n        if (this.inResizeZone(mousePoint)) {\n            return CanvasEngineAction.Resize;\n\
    \        }\n        else if (this.contains(mousePoint, ctx)) {\n            return\
    \ CanvasEngineAction.Drag;\n        }\n        return CanvasEngineAction.None;\n\
    \    }\n}\n```\n\n正如你所见，这是一个非常简单的基类，并不意味着直接实例化。它提供了一些默认实现，可以由形状在必要时重用，但也可以被重载。因此，现在我们已经设置了形状抽象，让我们开始为我们打算在应用程序中绘制的每种不同形状实现特定逻辑。以下屏幕截图显示了\
    \ DrawingShape 类型的具体实现，专门针对我们之前定义的矩形形状：\n\n```typescript\nclass DrawingRectangle\
    \ extends DrawingShapeBase implements IFillStyle {\n    public shape: IRectangle\
