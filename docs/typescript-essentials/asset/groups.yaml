    其重点在于代码复用的概念，我们将在 TypeScript 的学习之旅中对此进行探讨。TypeScript 提供了丰富的对象类型和可访问性级别，这对于面向对象的开发者来说会非常熟悉。在
    TypeScript 中，继承、封装和抽象都变得更加容易实现。JavaScript 侧重于函数的值和基于原型的继承，而 TypeScript 也是如此。对于习惯了基于类的继承的人来说，这可能显得有些奇怪。因此，通过使用其编译器，TypeScript
    引入了来自几种不同面向对象语言的一些重要概念。这些概念如下：


    - 静态类型

    - 类

    - 接口

    - 泛型

    - 模块


    TypeScript 在 JavaScript 之上增加了一个静态类型层，然后通过编译器运行。编译器解析 TypeScript 代码并将其转换为纯 JavaScript。类型安全与代码编译的加入使我们能更早地发现错误，并在不部署任何一行代码的情况下消除缺陷。类和模块的引入使大型应用程序的开发变得更加容易。在类型系统中加入泛型和接口，使我们能够轻松创建可适用于各种对象的组件和库。


    在此基础上，TypeScript 还引入了公共成员和私有成员的概念。如果某个对象或函数试图访问另一个对象的私有成员，编译器会识别出该代码无效，并生成构建错误。这有助于实现封装，其目的是防止
    TypeScript 对象的使用者在对象自身作用域之外操作那些可能有害的方法和属性。提供可访问性级别有助于我们限制与对象进行交互的范围，甚至完全将对象隐藏起来，使其他组件或库无法访问。


    ## 提示


    请记住，编译器输出的只是 JavaScript 代码，当它运行时，任何能够访问该对象的代码段都可以操作该对象的任何属性。


    编写单元测试已成为软件开发中的常见做法。单元测试让我们作为开发者可以在重构和清理代码时，知晓自己不会破坏现有功能，从而安心操作。在 TypeScript 语言规范中加入接口的设计决策，有助于提高我们代码的可测试性。编写单元测试可以帮助我们验证小段代码块始终按预期运行。然而，随着应用程序的不断增长，我们必须传递更复杂的对象并创建更复杂的函数。这使得单独测试小段代码变得更加困难。而接口的加入让我们更容易模拟待传递的对象，并能更严格地控制测试的范围。


    ## 设置 IDE


    要开始使用 TypeScript 编写代码，我们首先需要安装编译器。编译器可以通过 Node.js 作为独立软件包获得，也可通过 Microsoft 提供的
    Visual Studio 工具获得，或者你可以直接下载编译器的源代码。在本书中，我们将使用 Visual Studio 2013 作为交互式开发环境（IDE）。Visual
    Studio 2013 从 Update 2 版本开始原生支持 TypeScript。对于 Visual Studio 2012，Microsoft 提供了一个扩展，可以从
    TypeScript 主页（http://www.typescriptlang.org/）安装。随着 TypeScript 变得越来越普及，支持它的代码编辑器数量也在不断增加，包括
    Eclipse（http://www.jetbrains.com/webstorm/）和 Notepad++（https://github.com/hansrwindhoff/ndpPluginTypescript）。


    与许多现代语言一样，TypeScript 编译器本身就是用 TypeScript 编写的，这意味着它会编译成纯 JavaScript，并可在任何 JavaScript
    宿主中运行。安装了 Microsoft 的工具后，你可以直接从命令行访问 TypeScript 编译器，并立即生成 JavaScript。下面的截图显示了可用的编译器选项列表及其作用。稍后我们将更深入地介绍每个选项，但现在你可以看到，这个编译器虽然非常新，却已经具备了非常强大的功能集。


    ![](img/83a7f7e1723158e56008cf70304a8da4_47_0.png)


    如你所见，到目前为止，选项列表已经相当详尽，而且随着语言的发展，它无疑还会变得更加丰富。TypeScript 1.0 是本书所使用的语言版本，它提供的参数涵盖从指定输出文件到基于代码规则的警告等方方面面。我们将在后文讨论所有这些选项，但目前你只需要知道，你可以通过向编译器传递要编译的文件的路径来编译
    TypeScript 代码。当我们开始构建更复杂的应用程序时，Visual Studio 的集成功能将为你提供一种简单的方式来设置项目中所有 TypeScript
    文件的编译器选项。


    ## Hello World


    既然我们已经安装了编译器，那就开始编写一些代码吧。如果没有“Hello World”来帮助你开始用一种新语言编写代码，这本书就算不上一本好的技术书籍。这个特定示例的代码非常简单，但我们可以用它来演示改用
    TypeScript 的一些初步好处。


    ## 命令行编译


    TypeScript 编译器不过是 JavaScript 代码；只要有 JavaScript 宿主，你就可以在任何地方编译 TypeScript。之前，我们看到提供了一个可执行文件，允许我们从命令行编译代码。我们将使用这个可执行文件来完成第一个示例，并体会到开始使用
    TypeScript 是多么简单。首先，让我们在文件系统中创建一个新文件，并命名为 `HelloWorld.ts`。下面的代码创建了一个新的 HTML 段落元素，并将其文本设置为两个字符串拼接后的值：


    ```

    ```typescript

    var p = document.createElement(''p'');

    var hello: string = "Hello";

    var world: string = 2;

    p.textContent = hello + " " + world;


    document.body.appendChild(p);

    ```

    ```


