  - "[PAGE 65]\n\n# # Functions\n\nIf you are at all familiar with JavaScript you\
    \ will be very familiar with the concept of functions. TypeScript has added type\
    \ annotations to the parameter list as well as the return type. Due to the new\
    \ constraints being placed on the parameter list, the concept of function overloads\
    \ was also included in the language specification. TypeScript also takes advantage\
    \ of JavaScript’s **arguments** object and provides syntax for rest parameters.\
    \ Let’s take a look at a function declaration in TypeScript:\n\n```\n```typescript\n\
    function add(x: number, y: number): number {\n    return x + y;\n}\n```\n```\n\
    \nAs you can see, we have created a function called add. It takes two parameters\
    \ that are both of the type number, one of the primitive types, and it returns\
    \ a number. This function is useful in its current form but it is a little limited\
    \ in overall functionality. What if we want to add a third number to the first\
    \ two? Then we have to call our function multiple times. TypeScript provides a\
    \ way to provide optional parameters to functions. So now we can modify our function\
    \ to take a third parameter, z, that will get added to the first two numbers,\
    \ as shown in the following code:\n\n```\n```typescript\nfunction add(x: number,\
    \ y: number, z?: number) {\n    if (z !== undefined) {\n        return x + y +\
    \ z;\n    }\n    return x + y;\n}\n```\n```\n\nAs you can see, we have a third\
    \ named parameter now but this one is followed by ?. This tells the compiler that\
    \ this parameter is not required for the function to be called.\n\n# ## Tip\n\n\
    Optional parameters tell the compiler not to generate an error if the parameter\
    \ is not provided when the function is called. In JavaScript, this compile-time\
    \ checking is not performed, meaning an exception could occur at runtime because\
    \ each missing parameter will have a value of undefined. It is the responsibility\
    \ of the developer to write code that verifies a value exists before attempting\
    \ to use it.\n\nSo now we can add three numbers together and we haven’t broken\
    \ any of our previous code that relied on the add method only taking two parameters.\
    \ This has added a little bit more functionality but I think it would be nice\
    \ to extend this code to operate on multiple types. We know that strings can be\
    \ added together just the same as numbers can, so why not use the same method?\
    \ In its current form, though, passing strings to the add function will result\
    \ in compilation errors. We will modify the function’s definition to take not\
    \ only numbers but strings as well, as shown in the following code:\n\n```\n```typescript\n\
    function add(x: string, y: string): string;\nfunction add(x: number, y: number):\
    \ number;\nfunction add(x: any, y: any): any {\n```\n```"
