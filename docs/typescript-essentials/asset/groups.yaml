  - "[PAGE 74]\n\n# Definitions\n\nCreating classes in TypeScript is essentially the\
    \ same as creating interfaces. Let’s create a very simple Point class that keeps\
    \ track of an x and a y position for us:\n\n```\nclass Point {\n    public x:\
    \ number;\n    public y: number;\n    constructor(x: number, y = 0) {\n      \
    \  this.x = x;\n        this.y = y;\n    }\n}\n```\n\nAs you can see, defining\
    \ a class is very simple. Use the keyword class and then provide a name for the\
    \ new type. Then you create a constructor for the object with any parameters you\
    \ wish to provide upon creation. Our Point class requires two values that represent\
    \ a location on a plane.\n\n# Tip\n\nThe constructor is completely optional. If\
    \ a constructor implementation is not provided, the compiler will automatically\
    \ generate one that takes no parameters and initializes any instance members.\n\
    \nWe provided a default value for the property y. This default value tells the\
    \ compiler to generate an extra JavaScript statement than if we had only given\
    \ it a type. This also allows TypeScript to treat parameters with default values\
    \ as optional parameters. If the parameter is not provided then the parameter’s\
    \ value is assigned to the default value you provide. This provides a simple method\
    \ for ensuring that you are always operating on instantiated objects. The best\
    \ part is that default values are available for all functions, not just constructors.\
    \ Now let’s examine the JavaScript output for the Point class:\n\n```\nvar Point\
    \ = (function () {\n    function Point(x, y) {\n        if (typeof y === \"undefined\"\
    ) { y = 0; }\n        this.x = x;\n        this.y = y;\n    }\n    return Point;\n\
    })();\n```\n\nAs you can see, a new object is created and assigned to an anonymous\
    \ function that initializes the definition of the Point class. As we will see\
    \ later, any public methods or static members will be added to the inner Point\
    \ function’s prototype. JavaScript closures are a very important concept in understanding\
    \ TypeScript. Classes, modules, and enums in TypeScript all compile into JavaScript\
    \ closures. Closures are actually a construct of the JavaScript language that\
    \ provide a way of creating a private state for a specific segment of code. When\
    \ a closure is created it contains two things: a function, and the state of the\
    \ environment when the function was created. The function is returned to the caller\
    \ of the closure and the state is used when the function is called."
