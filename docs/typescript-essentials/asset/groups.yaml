  - "[PAGE 227]\n\n# Styling the application\n\nSo far, we have only covered the way\
    \ we develop the source code for our applications. However, styling the application\
    \ is just as important as the functionality. The code that we write can be completely\
    \ free of bugs, but if the appearance and feel of the application is poor, users\
    \ will not adopt it. Traditionally, when developing web applications using HTML\
    \ pages, we would use Cascading Style Sheets (CSS) to style our objects. However,\
    \ similar to the way TypeScript improves JavaScript development, a language called\
    \ LESS has been developed that will compile into plain CSS. LESS is available\
    \ for standalone download from http://lesscss.org/, or in the case of Visual Studio,\
    \ it can be installed with Mads Kristensen’s Web Essentials plugin. This plugin\
    \ is available through the Extensions and Updates window just like the NuGet Package\
    \ Manager was.\n\n![](img/83a7f7e1723158e56008cf70304a8da4_227_0.png)\n\nOnce\
    \ this has been installed, we can add a LESS style sheet to our application. LESS\
    \ has a lot of incredibly useful features that will help us create a friendly\
    \ user interface in a more robust manner. We have the ability to declare variables\
    \ and nest styles within each other. Let’s use LESS to improve the feel of our\
    \ application. Currently, a user has no visual cues informing them what tool they\
    \ are currently working with. We could use some code to change the cursor type\
    \ when a button is clicked; however, this can be overridden by other elements\
    \ on the page, including the CanvasEngine class that our application relies on.\
    \ Instead, we will use Knockout bindings combined with generated CSS styles. First,\
    \ we will need to create a new property on the IToolSelectionControl interface\
    \ and the ToolSelectionControl class to store whether or not the current control\
    \ is selected or not:\n\n```\nimport ControlsTypes = require('Scripts/Controls/ControlsTypes');\n\
    import UserControlBase = require('Scripts/Controls/UserControlBase');\nimport\
    \ DrawingTypes = require('Scripts/Drawing/DrawingTypes');\nclass ToolSelectionControl\
    \ extends UserControlBase\n    implements ControlsTypes.IToolSelectionControl\
    \ {\n    public buttonText: KnockoutObservable<string> = ko.observable(\"\");\n\
    \    public isSelected: KnockoutComputed<boolean> = null;\n    constructor(id:\
    \ string, public toolType: DrawingTypes.DrawingToolType,\n        public observable:\
    \ KnockoutObservable<DrawingTypes.DrawingToolType>) {\n        super(id);\n  \
    \      this.templateName = \"ButtonTemplate\";\n        this.buttonText(DrawingTypes.DrawingToolType[this.toolType]);\n\
    \        this.isSelected = ko.computed(() => {\n            return this.observable()\
    \ == this.toolType;\n        });\n    }\n    public click(viewModel: any, event:\
    \ JQueryEventObject) {\n        this.observable(this.toolType);\n    }\n```"
  - "[PAGE 228]\n\n```\n}\n}\nexport = ToolSelectionControl;\n```\n\nAs you can see,\
    \ we created a new KnockoutComputed object that will return a Boolean and that\
    \ our HTML will be bound to. Instead of storing an instance value like observables\
    \ do, computed objects run a function that is responsible for either setting or\
    \ returning the value. In this case, we check whether the value of the observable\
    \ the control is supposed to update is the same as the tool that this control\
    \ is associated with. If they are the same, then a true value will be returned;\
    \ otherwise, the result will be false. By including another observable object\
    \ within the body of this function, Knockout will create a subscription to this\
    \ object, and any time its value is changed, this function will be re-evaluated.\
    \ This keeps us from having to write any additional logic to update an observable\
    \ whenever one of these controls is clicked. Binding to computed objects is the\
    \ same as binding to observables as they share a common super class.\n\n```\n\
    <script type=\"text/html\" id=\"ButtonTemplate\">\n    <button class=\"tool-select-button\"\
    \ data-bind=\"text: buttonText, click: click,\n        css: { 'selected': isSelected\
    \ }\" />\n</script>\n```\n\nIn the preceding screenshot, you can see we have added\
    \ a class to our button that we will be able to provide styles for and then the\
