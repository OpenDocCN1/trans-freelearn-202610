  - '[PAGE 178]


    # Summary


    Throughout this chapter, we have focused on building a drawing application from
    end to end in TypeScript. We started with the basic building blocks for the application,
    the abstraction, then created a set of reusable shape objects. These objects are
    then used in a set of classes responsible for drawing them on an HTML5 canvas.
    Next, we built an engine responsible for handling user interaction and requesting
    information from the drawing objects to make decisions. Finally, we built a model
    to keep track of all of the shape objects in the running application. All of this
    has been done using TypeScript, and only TypeScript. However, a common practice
    in web development is integrating with third-party libraries such as jQuery. In
    the next chapter, we are going to look at some of the available third-party libraries
    and how to integrate them with your projects.'
