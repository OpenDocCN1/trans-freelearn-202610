    \ They can be used on interfaces or class definitions to create functionality\
    \ for a broad set of object types that may or may not be known at the time of\
    \ development. Let’s say we wanted to create a generic task processor. We will\
    \ assume the simplest possible implementation, which is just a sequential process\
    \ that passes a list of generic tasks to a function to have them run:\n\n```typescript\n\
    interface ITask {\n    Id: number;\n    Execute(): boolean;\n    Error: string;\n\
    }\nfunction ProcessTasks<T extends ITask>(tasks: T[]): T {\n    for (var i = 0;\
    \ i < tasks.length; i++) {\n        if (tasks[i].Execute() == false) {\n     \
    \       return tasks[i];\n        }\n    }\n    return null;\n}\n```\n\nIn this\
    \ example, we have defined an interface that the task processor will rely on to\
    \ execute a set of tasks sequentially. The function declaration for ProcessTasks\
    \ now contains a type parameter, T, which must adhere to the ITask interface.\
    \ This type parameter is used as a constraint for the objects that can be passed\
    \ in as part of the tasks array, and will be the return type of the function.\
    \ The tasks array is looped through one by one and the Execute method is called.\
    \ If the Execute method returns a false value then the processing is stopped and\
    \ the task is returned. Generics are built completely on type annotations, so\
    \ they have no effect on the generated JavaScript. However, if the type constraints\
    \ are not met, a compile error will be generated.\n\nInterfaces and classes are\
    \ capable of creating even more complex structures built around a very loose type\
    \ definition. A type parameter provided to an interface or class can be used to\
    \ provide type information for any member or function inside of the declaration\
    \ body. In the next example, our ProcessTasks function has been moved into a class\
    \ that will operate as the processor. A generic interface is created that will\
    \ allow us to create any number of task processors with different implementations\
    \ of the ProcessTasks function. Then, we see a class declaration that provides\
    \ its own set of type parameters and implements the ITaskProcessor interface:\n\
    \n```typescript\ninterface ITask {\n    Id: number;\n    Execute(): boolean;\n\
    \    Error: string;\n}\ninterface ITaskProcessor<T extends ITask> {\n    ProcessTasks(tasks:\
    \ Array<T>): T;\n    CurrentTask: T;\n}\nclass TaskProcessor<T extends ITask>\
    \ implements ITaskProcessor<T> {\n    public CurrentTask: T = null;\n    constructor()\
    \ {\n    }\n    public ProcessTasks(tasks: T[]): T {\n        for (var i = 0;\
    \ i < tasks.length; i++) {\n            this.CurrentTask = tasks[i];\n       \
    \     if (this.CurrentTask.Execute() == false) {\n                return tasks[i];\n\
    \            }\n        }\n        this.CurrentTask = null;\n        return null;\n\
    \    }\n}\n```\n\nGeneric functions and types are not limited to a single unknown\
    \ type. Type parameters can be lists of type information that can be used anywhere\
    \ within the declaration block that the list is associated with. Creating a list\
    \ of type parameters is the same as passing a single type parameter, only each\
    \ type is separated by a comma. Furthermore, each generic type created in a parameter\
    \ list can be used as a base type for other type parameters inside of the type’s\
    \ definition. The next example shows both of these concepts:\n\n```typescript\n\
    interface IExample<T, U extends HTMLElement> {\n    Operate<V extends U>(): T;\n\
    }\n```\n\nAs you can see, there is a comma-separated list of generic types and\
    \ any constraints they might have instead of the single generic type. The Operate\
    \ function then requires a type that inherits from the U type that was provided\
    \ in the initial type parameter list.\n\n## Chapter 3. The TypeScript Compiler\n\
    \nIn this chapter, the TypeScript compiler will be analyzed. The different parameters\
    \ that the compiler understands will be broken down and explained, as well as\
    \ how they affect the ECMAScript that gets generated. We will discuss how to control\
    \ where your code gets generated to, as well as the different files that can accompany\
    \ our generated ECMAScript. There are also a few other options available on the\
    \ compiler that make building and deploying large scale applications easier.\n\
    \nThe topics that will be covered in the chapter are as follows:\n\n- ECMAScript\
    \ generation\n- Output control\n- Advanced compiler options\n\n### Generation\
    \ of ECMAScript\n\nAs with most programming languages, ECMAScript has evolved\
    \ over time. It was initially developed in the mid-nineties for use in client-side\
    \ scripting. The current standard is ECMAScript 5; however, Version 6 is currently\
    \ being worked on. The TypeScript compiler provides a list of options to change\
    \ the way your code is generated. In this section, we will look at these options\
    \ and compare the results.\n\n### ECMAScript version\n\nWriting JavaScript code\
    \ means your code must be portable across multiple types of client devices and\
    \ browsers. You may be forced to not only support the latest version of a browser\
    \ but potentially any of its previous versions. For this reason, the compiler\
    \ supports compiling your TypeScript code into different versions of ECMAScript.\
    \ ECMAScript 3 was a widely adopted and heavily used standard and has survived\
    \ in many legacy browsers. ECMAScript 4 was abandoned when the group responsible\
    \ for creating the standard could not agree on the language features. ECMAScript\
    \ 5 is the current standard and has been adopted by most current browsers. It\
    \ was published in 2009, nearly a decade after Version 3 was initially published.\
    \ In Chapter 2, *TypeScript Basics*, we saw that you could easily switch between\
    \ versions of ECMAScript in Visual Studio. Let’s take a look at what is actually\
    \ going on behind the scenes when we change this option. In the following screenshot,\
    \ you can see that we call the compiler the same way we did in Chapter 1, *Getting\
    \ Started with TypeScript*, only this time we have provided an additional parameter:\n\
    \n![](img/83a7f7e1723158e56008cf70304a8da4_103_0.png)\n\nAs you can see, there\
    \ are two ways of passing the ECMAScript target version to the compiler: the verbose\
    \ method `--target` and the shorthand method `-t`.\n\n**Tip**\n\nIf a target version\
    \ is not supplied, the compiler will default to ECMAScript 3. So, unless you are\
    \ explicitly using language constructs only defined in ECMAScript 5, this parameter\
    \ does not need to be provided.\n\nECMAScript 5 was originally slated to be a\
    \ minor update, ECMAScript 3.1, and provide only a limited set of new features\
    \ in an attempt to maintain backwards compatibility. Strict mode was introduced,\
    \ which provides a set of different semantic rules to the language. There are\
    \ three primary changes that strict mode makes to normal ECMAScript semantics:\n\
    \n- Certain silent errors are now thrown\n- Enforces rules that allow the language\
    \ engine to provide more optimizations\n- Ensures that certain keywords can’t\
    \ be used to allow future versions of ECMAScript to have them available for the\
    \ language specification\n\nWhile the option to use strict mode is still available\
    \ in TypeScript by placing `use strict` at the top of your TypeScript file, its\
    \ value is less significant. The TypeScript compiler accounts for most of the\
    \ rules enforced on JavaScript code that is run in strict mode. For instance,\
    \ if you attempt to assign a value to a variable that does not exist or is not\
    \ defined, a compile error will be generated. When running your JavaScript out\
    \ of strict mode this will create a new variable and put it in the global scope.\
    \ If this is done in JavaScript running in strict mode, a reference error will\
    \ be generated. The with keyword creates a syntax error in strict JavaScript because\
    \ optimizations are not able to be made on code blocks within the declaration\
    \ block. TypeScript will generate a syntax error any time you attempt to use a\
    \ with block. The TypeScript compiler will even format your existing JavaScript\
    \ to a more restricted set of standards, for instance, if you write the following\
    \ lines of code:\n\n```javascript\nfunction sayHello() {\n    alert(\"Hello There\"\
    )\n}\nSayHello()\n```\n\nIn most cases this is legal JavaScript; however, under\
    \ certain circumstances semicolons are required to keep the code meaningful. When\
    \ the compiler finishes generating this code it has recognized the missing semicolons\
    \ and added them to the resulting JavaScript:\n\n```javascript\nfunction sayHello()\
    \ {\n    alert(\"Hello There\");\n}\nSayHello();\n```\n\nAs we discussed in the\
    \ previous chapter, TypeScript adds a large number of language constructs that\
    \ the current version of ECMAScript is lacking. However, the language will continue\
    \ to evolve and new constructs will be added to the specification. Strict mode\
    \ helps prevent developers from creating code that uses potential keywords for\
    \ future versions. The keywords prevented in strict mode are: implements, interface,\
    \ let, package, private, protected, public, static, and yield. As you can see,\
    \ there is a fair amount of overlap between what TypeScript defines and what has\
    \ been set aside by the language committee for future use. We have already discussed\
    \ the TypeScript implementations of implements, interface, private, public, and\
    \ static. The remaining names, restricted by strict mode, are currently keywords\
    \ in TypeScript; however, any attempt to use them will result in a compile error.\n\
    \nThere is really only one key construct that you should avoid if you want your\
    \ code to be compatible with both ECMAScript 3 and 5, and that is getters and\
    \ setters. Getters and setters are used to define properties for JavaScript objects.\
    \ They are a special type of language construct that allows them to be accessed\
    \ like variables but internally they are implemented as functions. Browser compatibility\
    \ for getters and setters can be found in the table referenced in [Chapter 2,\
    \ *TypeScript Basics*]. The following code snippet shows how these properties\
    \ are created:\n\n```typescript\ninterface IBook {\n    title: string;\n}\nclass\
    \ Book implements IBook {\n    private _title: string = \"\";\n    constructor()\
    \ {\n```\n"
