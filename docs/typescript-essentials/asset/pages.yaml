  md: "# Code manipulation\n\nThere are a couple of other options available for the\
    \ compiler that will determine what the resulting JavaScript code will look like.\
    \ Like JavaScript, TypeScript allows comments to be placed within the code. They\
    \ are defined exactly the same way JavaScript comments are and they have no effect\
    \ on runtime execution. Comments are used to explain what a segment of code, is\
    \ designed to do, so that when another developer has to look at the code they\
    \ will know what is going on. This can be very helpful when stepping through our\
    \ code during development. However, when the code is deployed to a client, these\
    \ comments are unnecessary and add to the size of our JavaScript files. Using\
    \ the -removeComments parameter, we can ensure that all of this unneeded data\
    \ is removed before deployment. Consider the following TypeScript code:\n\n```\n\
    //Retrieve a new random integer value\nfunction getRandom(): number {\n    return\
    \ Math.floor(Math.random() * Date.now());\n}\n```\n\nThe preceding code can be\
    \ compiled using the command shown in the following screenshot:\n\n![](img/83a7f7e1723158e56008cf70304a8da4_106_0.png)\n\
    \nThis results in the following JavaScript output:\n\n```\nfunction getRandom()\
    \ {\n    return Math.floor(Math.random() * Date.now());\n}\n```\n\nOn a small\
    \ scale, this doesn’t represent a huge gain; however, when you scale the application\
    \ up to have hundreds of thousands of lines of code, this could represent a significant\
    \ amount of data. It is common practice in JavaScript development to minify your\
    \ .js files when you push them into production. This helps reduce the overall\
    \ file size and has no effect on runtime speed. Unfortunately, the TypeScript\
    \ compiler does not have an option for this upon the release of Version 1.0. Hopefully,\
    \ it will be added in future versions but there are other tools available to minify\
    \ JavaScript in the meantime. RequireJS is a library that we will talk about later\
    \ on, and it provides options to minify JavaScript code.\n\nThe final ECMAScript\
    \ output-related parameter available for the TypeScript compiler is the module\
