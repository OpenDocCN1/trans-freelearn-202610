  md: "# Static and instance members\n\nBoth x and y are instance members of the class\
    \ Point; this means that an object of the type Point must be instantiated for\
    \ them to be referenced. When the constructor is called, values are assigned to\
    \ properties of the object instance being created. These values can either be\
    \ new objects created within the constructor function or references to objects\
    \ passed in as the constructor parameters. This is a good thing for certain members,\
    \ however, there are other class members that you may want access to even when\
    \ an object has not been created. TypeScript provides this ability through static\
    \ members. Static members are accessible at any time by referencing the named\
    \ type. To declare a static member you simply decorate it with the static keyword:\n\
    \n```\nclass Point implements IPoint, ICompare {\n    public x: number;\n    public\
    \ y: number;\n    constructor(x: number, y = 0) {\n        this.x = x;\n     \
    \   this.y = y;\n    }\n    public Compare(p2: IPoint): number {\n        var\
    \ p1Val = this.x * this.x + this.y * this.y;\n        var p2Val = p2.x * p2.x\
    \ + p2.y * p2.y;\n        var result = p1Val - p2Val;\n        if (result == 0)\
    \ {\n            return 0;\n        } else if (result > 0) {\n            return\
    \ 1;\n        } else {\n            return -1;\n        }\n    }\n    static Compare(p1:\
    \ Point, p2: Point): number {\n        return p1.Compare(p2);\n    }\n}\n```\n\
    \nThe preceding Compare method takes in two Point objects and compares their distance\
    \ from the origin to determine which is greater. The JavaScript output for this\
    \ class member is very different from that of the x and y properties being created\
    \ in the constructor. The following output shows that the Compare method is put\
    \ directly on the Point object being created:\n\n```\nvar Point = (function ()\
    \ {\n    function Point(x, y) {\n        if (typeof y === \"undefined\") { y =\
    \ 0; }\n        this.x = x;\n        this.y = y;\n    }\n    Point.prototype.Compare\
    \ = function (p2) {\n        var p1Val = this.x * this.x + this.y * this.y;\n\
    \        var p2Val = p2.x * p2.x + p2.y * p2.y;\n        var result = p1Val -\
    \ p2Val;\n```"
  merge: -1
