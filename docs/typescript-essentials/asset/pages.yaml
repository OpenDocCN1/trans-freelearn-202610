- pgno: 150
  md: '# # Chapter 5. Creating a Simple Drawing Application


    We have covered a lot of information in a very short period of time. Let’s take
    that information and put it to use; let’s build a full application rather than
    just looking at code samples. We are going to build a web-based drawing application
    similar to Paint, but it will be hosted in the browser. The topics we will cover
    in this chapter include:


    +   - Creating the project

    +   - Basic shapes

    +   - Drawing objects on the canvas

    +   - Managing the canvas state and decision making

    +   - Keeping track of the application state'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# # Setting up the project


    First things first, we need to create a new project that will host our application
    and configure the compiler settings. Create a new project in Visual Studio, using
    the TypeScript project template as described in [Chapter 2](#), *TypeScript Basics*,
    and call it `DrawingApplication`. Then, open up the project properties by right-clicking
    on the project and selecting **Properties**.


    In the following screenshot, you can see the settings we will use for this application:


    ![](img/83a7f7e1723158e56008cf70304a8da4_151_0.png)


    As you can see, we will be targeting ECMAScript 3 to ensure a broader scope of
    platforms that our application will run on. We will not be using an external module
    system, comments will be removed from the final output, and the rest of the output
    can be left as the default values. Next, we need to modify `index.html` to contain
    a canvas element. The HTML canvas element is part of the HTML5 standard, which
    is supported by most modern browsers at this point. Since we aren’t using jQuery
    yet, we will also need to move the loading of our `app.js` file to within the
    body; that way, the canvas element will be available to us at runtime. The following
    screenshot shows the `index.html` file after making these modifications:'
  merge: -1
  img_proc: true
- pgno: 152
  md: "![](img/83a7f7e1723158e56008cf70304a8da4_152_0.png)\n\nNow that we have the\
    \ basics for the project set up, let’s start putting together an object-oriented\
    \ TypeScript application. As we move through this chapter, we will use a couple\
    \ of enumerations to help us define abstractions and allow our types to communicate\
    \ in a strongly typed fashion. I prefer to maintain a clear separation of code\
    \ for easy navigation, so all of the enums that are created will be placed in\
    \ a file called Enums.ts. The two enums are as follows:\n\n```\nenum DrawingToolType\
    \ {\n    Select,\n    Rectangle,\n    Circle,\n    Line,\n    Freehand\n}\nenum\
    \ CanvasEngineAction {\n    None,\n    Move,\n    Resize\n}\n```\n\nThe DrawingToolType\
    \ type will be used to help determine which drawing tool the user has selected.\
    \ The type responsible for interacting with the canvas will need to know this\
    \ to function properly. The CanvasEngineAction type will be used by the objects\
    \ responsible for drawing the shapes to inform the canvas operator what to do\
    \ with the user’s input."
  merge: -1
