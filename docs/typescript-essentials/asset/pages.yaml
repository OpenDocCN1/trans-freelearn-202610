- pgno: 233
  md: '# Summary


    In this chapter, we have covered several ways to improve the way we develop and
    deploy enterprise-level JavaScript applications. We converted the drawing application
    to AMD modules to eliminate the need for manually managing how scripts are loaded.
    We created bindings between our HTML and TypeScript code using Knockout, which
    allow us to easily extend the behavior of our application with minimal effort.
    Then, we looked to improve the speed at which our application is available by
    reducing all of our modules into a single optimized JavaScript file. Finally,
    we added LESS style sheets that allowed us to create a robust set of styles that
    could be easily maintained and modified. In the next chapter, we will look at
    the different methods used to debug TypeScript as well as how we can provide unit
    tests for our application.'
