- pgno: 92
  md: "We now have an internal module that has two accessible named types, the ShapeType\
    \ enum and Shape class, and one inaccessible variable, the origin variable, which\
    \ is part of the isolated state of the module. While we may not necessarily need\
    \ access to the ShapeType enum it still must be exported for our code to compile.\
    \ Any named types that are used in the definition of another member must be made\
    \ as accessible as that member. If this requirement is not met compilation will\
    \ fail. Accessing these types is done by providing the module name and then the\
    \ type you wish to access. In the following example, you can see we create a new\
    \ Shape object and set its type:\n\n```\nvar shape = new Shapes.Shape();\nshape.Type\
    \ = Shapes.ShapeType.Circle;\n```\n\nThe JavaScript generated for this module\
    \ looks very similar to the code generated for enum types. All of the members\
    \ of the module are wrapped in a closure that runs when the module is loaded.\
    \ Each of the exported types is placed on the instance variable that is passed\
    \ to the closure that it is available to anyone accessing the module. Modules\
    \ also share the same ability to be merged that enums do. This means that you\
    \ can separate your code into multiple files and have them merged into one object\
    \ during runtime. The downside to this implementation of modules is that it takes\
    \ away the ability to create interfaces for your modules. However, the ability\
    \ to organize your code in whichever manner you choose is far more valuable than\
    \ any functionality interfaces would bring to modules. Here, you can see the resulting\
    \ JavaScript that TypeScript creates to define its modules:\n\n```\nvar Shapes;\n\
    (function (Shapes) {\n    var origin = new Point(0, 0);\n    (function (ShapeType)\
    \ {\n        ShapeType[ShapeType[\"Rectangle\"] = 3] = \"Rectangle\";\n      \
    \  ShapeType[ShapeType[\"Circle\"] = 4] = \"Circle\";\n        ShapeType[ShapeType[\"\
    Line\"] = 5] = \"Line\";\n        ShapeType[ShapeType[\"Freehand\"] = 6] = \"\
    Freehand\";\n    })(Shapes.ShapeType || (Shapes.ShapeType = {}));\n    var ShapeType\
    \ = Shapes.ShapeType;\n    var Shape = (function () {\n        function Shape()\
    \ {\n            this.Type = 3 /* Rectangle */;\n            this.Bounds = new\
    \ Bounds();\n            this.Bounds.Location = origin;\n        }\n        return\
    \ Shape;\n    })();\n    Shapes.Shape = Shape;\n})(Shapes || (Shapes = {}));\n\
    ```\n\nSo far we’ve only seen a small example of a module, but imagine building\
    \ a large-scale application with a large amount of object types. You will want\
    \ to create namespaces to organize your code and create a layer of separation\
    \ between segments of code that are unrelated. There are two ways to provide module\
    \ namespaces in TypeScript. We can nest the modules inside of each other or we\
    \ can define them as part of the module declaration."
