  md: '# Chapter 3. The TypeScript Compiler


    In this chapter, the TypeScript compiler will be analyzed. The different parameters
    that the compiler understands will be broken down and explained, as well as how
    they affect the ECMAScript that gets generated. We will discuss how to control
    where your code gets generated to, as well as the different files that can accompany
    our generated ECMAScript. There are also a few other options available on the
    compiler that make building and deploying large scale applications easier.


    The topics that will be covered in the chapter are as follows:


    +   - ECMAScript generation

    +   - Output control

    +   - Advanced compiler options'
