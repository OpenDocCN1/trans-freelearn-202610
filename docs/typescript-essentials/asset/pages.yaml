  md: "# # Interfaces\n\nLet’s revisit our discussion of interfaces for a moment and\
    \ look at how they interact with classes. In the next example, we will enforce\
    \ the `IPoint` interface upon the `Point` class. Classes can optionally inherit\
    \ type information from interfaces using the `implements` keyword. The class will\
    \ then be required to implement all of the interface members; otherwise, compile\
    \ errors will occur:\n\n```\n```typescript\ninterface IPoint {\n    x: number;\n\
    \    y: number;\n}\nclass Point implements IPoint {\n    constructor(public x:\
    \ number, public y = 0) {\n    }\n}\n```\n```\n\nAs we discussed earlier, interfaces\
    \ are a purely compile time construct. The JavaScript that is output from this\
    \ example is completely identical to the JavaScript we just saw. I snuck in a\
    \ shorthand method of defining instance variables on classes too. Decorating the\
    \ constructor’s parameters with the public or private keywords tells TypeScript\
    \ to treat these objects as part of the type and not just initialization parameters.\n\
    \nClasses are not limited to implementing a single interface. Providing a comma\
    \ separated list of interfaces after the `implements` keyword allows your class\
    \ to provide implementations of a variety of different contracts. Let’s make our\
    \ `Point` class more useful by implementing a second interface, as follows:\n\n\
    ```\n```typescript\ninterface IPoint {\n    x: number;\n    y: number;\n}\ninterface\
    \ ICompare {\n    Compare(p2: IPoint): number;\n}\nclass Point implements IPoint,\
    \ ICompare {\n    public x: number;\n    public y: number;\n    constructor(x:\
    \ number, y = 0) {\n        this.x = x;\n        this.y = y;\n    }\n    public\
    \ Compare(p2: IPoint): number {\n        var p1Val = this.x * this.x + this.y\
    \ * this.y;\n        var p2Val = p2.x * p2.x + p2.y * p2.y;\n        var result\
    \ = p1Val - p2Val;\n        if (result == 0) {\n            return 0;\n      \
    \  } else if (result > 0) {\n            return 1;\n        } else {\n       \
    \     return -1;\n        }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 78
  md: The ability to enforce multiple interfaces on our classes provides us with the
    ability to use our objects in several different contexts. Keeping our interfaces
    simple allows them to be more reusable across our applications. We could have
    easily placed the Compare method on the IPoint interface and achieved the same
    result. However, as we will see later with a few tweaks, any number of types could
    implement the ICompare interface, which have no need for the members x and y.
    In this case, the Compare method determines the distance each point is from the
    origin and returns a number representing which one is farthest away. If the object
    performing the comparison is farther away, a positive value is returned. If the
    point that has been passed as a parameter is farther away then a negative value
    is returned. If the two points are equivalent distances from the origin then a
    value of zero is returned.
