    class UserControlBase implements ControlsTypes.IUserControl {\n    public templateName:\
    \ string = \"TemplateNotProvided\";\n    constructor(public id: string) {\n  \
    \  }\n}\nexport = UserControlBase;\n```\n\nThe id property comes in as a required\
    \ property, and therefore will always have a value. The templateName string is\
    \ set to a bad value by default, and this ensures that any type extending the\
    \ UserControl type will be forced to update this property. If an invalid template\
    \ name is provided, Knockout will generate an error at runtime. However, if an\
    \ empty string is provided, execution will continue as normal. Now let’s provide\
