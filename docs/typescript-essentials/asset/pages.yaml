  md: "# Converting to AMD modules\n\nConverting to AMD modules is a fairly simple\
    \ process. However, this is a good time to look at the structure and maintainability\
    \ of our project. Before getting started, we must install the RequireJS NuGet\
    \ package Version 2.1.14 and the corresponding declaration file requirejs.TypeScript.DefinitelyTyped\
    \ Version 0.2.0.\n\n![](img/83a7f7e1723158e56008cf70304a8da4_202_0.png)\n\nThe\
    \ TypeScript build settings must also be changed to use the AMD module system\
    \ as shown in the previous chapter. Once these steps are completed, we can begin\
    \ enhancing our application. To do this, we will want to add a folder structure\
    \ to our application that will help us easily separate modules based on functionality.\
    \ At this point, it is important to decide how you want to divide up the code\
    \ for your application. Since we are using RequireJS modules, we will be using\
    \ the export keyword for all objects that we want to use from other modules. There\
    \ are three ways to use the export keyword, and each one has different ramifications\
    \ on the resulting JavaScript. The following example shows the more common use\
    \ of the keyword:\n\n```\nexport class Freehand implements IFreehand {\n    public\
    \ points: Array<IPoint> = [];\n    constructor() {\n    }\n    public AddPoint(point:\
    \ IPoint) {\n        this.points.push(point);\n    }\n}\n```\n\nIn this example,\
    \ the export keyword annotates the type declaration. This tells the TypeScript\
    \ compiler to place this type on the exports object of the module being generated.\n\
    \n# Tip\n\nThe export keyword is only available when the — module flag is provided\
    \ to the compiler. An attempt to use it without providing this option will result\
    \ in a compiler error. Visual Studio provides this flag when you select a module\
    \ system in the TypeScript Build section of the project properties.\n\nThe resulting\
    \ JavaScript from this class definition will look very similar to our previous\
    \ module definitions. However, there will be some special syntax added since we\
    \ have chosen to use AMD modules:"
  merge: -1
  img_proc: true
- pgno: 203
  md: "```\ndefine([\"require\", \"exports\"], function(require, exports) {\n    var\
    \ Freehand = (function () {\n        function Freehand() {\n            this.points\
    \ = [];\n        }\n        Freehand.prototype.AddPoint = function (point) {\n\
    \            this.points.push(point);\n        };\n        return Freehand;\n\
    \    })();\n    exports.Freehand = Freehand;\n});\n```\n\nThe differences between\
    \ an AMD module and a standard JavaScript module are apparent from the very beginning\
    \ of the definition. The AMD specification provides a function called define that\
    \ is used to assist the module loader. While there are only two parameters shown\
    \ for this function here, the function optionally takes a third parameter that\
    \ precedes the two shown in the generated JavaScript code. This optional first\
    \ parameter is an identifier for the module, and we will look at this parameter\
    \ in more detail later in this chapter when we want to minify our final application\
    \ code. The second parameter for the define function is a list of module dependencies.\
    \ Every require statement that we use to reference another module in our project\
    \ will be included in this list. The third and final parameter is the only mandatory\
    \ parameter for us to define a module, and it is a function that will execute\
    \ to instantiate an object or module. Each of the dependencies provided to the\
    \ define function will be provided as parameters to the function for use inside\
    \ of the module.\n\nThe export keyword can also be assigned to a type. In the\
    \ following example, you can see that rather than decorating our class with the\
    \ export keyword, we instead use the assignment operator to give it a new value:\n\
    \n```\nclass Circle implements ICircle {\n    constructor(public radius: number)\
    \ {\n    }\n    public resize(radius: number) {\n        this.radius = radius;\n\
    \    }\n    public area(): number {\n        return Math.PI * this.radius * this.radius;\n\
    \    }\n}\nexport = Circle;\n```\n\nUsing this method limits us to exporting a\
    \ single type from a file; however, this type can be a module containing any number\
    \ of exported objects. The resulting JavaScript looks like the following code:\n\
    \n```\ndefine([\"require\", \"exports\"], function(require, exports) {\n    var\
    \ Circle = (function () {\n        function Circle(radius) {\n            this.radius\
    \ = radius;\n        }\n        Circle.prototype.resize = function (radius) {\n\
    ```"
