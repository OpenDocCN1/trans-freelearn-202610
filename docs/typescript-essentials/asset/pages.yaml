  md: '# Generating a single output file


    In the original version of our drawing application, we only had six files to download
    to the client browser: a single CSS file, our app.js file, and the files containing
    our object types. Each file is a separate web request and all of the files must
    be loaded before our application can run.


    ![](img/83a7f7e1723158e56008cf70304a8da4_220_0.png)


    This is a relatively speedy process, and on average takes less than 100 ms depending
    on network latency. However, in our quest to create a large-scale maintainable
    application, the number of code files we have has exploded. We now have more than
    20 files that need to be loaded into the client browser before the application
    will successfully complete all of its functionality. This has caused our load
    times to more than double from what they previously were as shown in the following
    screenshot of the network traffic:'
  merge: -1
  img_proc: true
- pgno: 221
  md: '![](img/83a7f7e1723158e56008cf70304a8da4_221_0.png)


    This delay in load time is perfectly acceptable for development purposes (in fact,
    as we will see in the next chapter, it will actually be preferable). However,
    if we ever plan to make our application available to consumers, then we will need
    to reduce the footprint of our JavaScript output. Before implementing AMD modules,
    this was as simple as providing the compiler with the --out parameter or changing
    our TypeScript build settings in Visual Studio. However, when the module flag
    is provided, this is not possible.


    To compile all of our resulting JavaScript modules into a single file, we will
    need at least one more tool at our disposal. Node.js is a fantastic platform that
    provides a whole host of functionality, and its primary function is to help create
    scalable network applications. It is available for download from http://nodejs.org/.
    Node provides a ton of functionality, and I encourage you to read through the
    API documentation and examples to learn more. In our case, we are going to use
    it as a JavaScript runtime environment. This will allow us to use r.js to trace
    all of our RequireJS statements and build an optimized module list.'
  merge: -1
  img_proc: true
- pgno: 222
  md: "![](img/83a7f7e1723158e56008cf70304a8da4_222_0.png)\n\nOnce we have Node.js\
    \ installed, we will have access to it from the command line as well as through\
    \ PowerShell. We will use this in combination with r.js, which was installed in\
    \ our Visual Studio project when we installed the RequireJS NuGet package. This\
    \ library is an optimizer for RequireJS and runs in both Node and Rhino.\n\n#\
    \ Note\n\nFor more information regarding Rhino, please visit https://developer.mozilla.org/en-US/docs/Mozilla/Projects/Rhino.\n\
    \nThe optimizer requires a few parameters that will determine how the output is\
    \ generated. We must provide a name, the path to the resulting output file, a\
    \ flag that tells the optimizer to search for all of the nested dependencies in\
    \ our application, and the paths that r.js should look at when performing its\
    \ optimization. We will place all of these options in a separate JavaScript file\
    \ that we can modify if we want to change the way we want our final code to be\
    \ generated:\n\n```\n({\n    name: \"DrawingApplication\",\n    out: \"DrawingApplication.js\"\
    ,\n    findNestedDependencies: true,\n    optimize: \"none\",\n    paths: {\n\
    \        'DrawingApplication': 'app'\n    }\n})\n```\n\nAs you can see, all of\
    \ these options are placed on a JSON object that will be provided to the RequireJS\
    \ optimizer. The one extra flag here is the optimize flag, which determines"
  merge: -1
  img_proc: true
