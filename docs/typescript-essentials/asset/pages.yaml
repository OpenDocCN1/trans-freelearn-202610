    \ text to the ButtonText observable and the click event to the click function.\
    \ The color picker only needs to bind the change event to the Change method.\n\
    \nThe final piece of this is to implement each of our interfaces and bind our\
    \ view model to the DOM. Each of these types will be placed in separate files\
    \ in the controls directory. All of the files can be seen in the following screenshot:\n\
    \n![](img/83a7f7e1723158e56008cf70304a8da4_214_0.png)\n\nWe will start with the\
