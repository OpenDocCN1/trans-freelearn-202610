    into TypeScript. We have discussed a variety of ways in which TypeScript improves
    the JavaScript development model. TypeScript makes large scale application development
    easier with the addition of a static typing system and code completion. Visual
    Studio’s intellisense feature brings JavaScript development in line with other
    languages such as C# and Visual Basic. We briefly discussed the compiler and how
    it turns TypeScript into deployable JavaScript and created our first application.
    All of the examples shown moving forward will be using Visual Studio; however,
    feel free to use your favorite IDE. In the next chapter, we will discuss the different
    language features provided by TypeScript and how the compiler generates its JavaScript
    output.'
