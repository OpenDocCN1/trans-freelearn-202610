- pgno: 47
  md: '# # Setting up the IDE


    To start writing code in TypeScript, we first need to install the compiler. The
    compiler is available as a standalone package through Node.js, Visual Studio tooling
    that Microsoft provides, or you can directly download the compiler’s source code.
    Throughout this text we will be using Visual Studio 2013 as our interactive development
    environment (IDE). Visual Studio 2013 provides native support for TypeScript with
    the release of Update 2. For Visual Studio 2012, Microsoft provides an extension
    that can be installed from the TypeScript home page ([http://www.typescriptlang.org/](http://www.typescriptlang.org/)).
    As TypeScript is becoming more widespread, the number of code editors that have
    support for it has grown including Eclipse ([http://www.jetbrains.com/webstorm/](http://www.jetbrains.com/webstorm/))
    and Notepad++ ([https://github.com/hansrwindhoff/ndpPluginTypescript](https://github.com/hansrwindhoff/ndpPluginTypescript)).


    The TypeScript compiler, as with a number of modern languages, is written in TypeScript,
    which means it will compile to plain JavaScript and run in any JavaScript host.
    With Microsoft’s tools installed, you can access the TypeScript compiler directly
    from the command line and generate JavaScript immediately. The following screenshot
    shows a list of the available compiler options and what they do. We will look
    at each of these options more thoroughly later on but for now you can see that
    the compiler, although very new, already has a very robust feature set.


    ![](img/83a7f7e1723158e56008cf70304a8da4_47_0.png)


    As you can see the list of options is fairly extensive so far and will undoubtedly
    become richer as the language develops. TypeScript 1.0, which will be the version
    of the language used in this text, provides parameters for everything from specifying
    the output file to warnings based on code rules. We will discuss all of these
    options later on, but for now all you need to know is that you can compile your
    TypeScript code by passing the compiler the path of the file you want to compile.
    When we begin to build more complicated'
  merge: -1
  img_proc: true
