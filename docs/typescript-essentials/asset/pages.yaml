  md: '# Generation of ECMAScript


    As with most programming languages, ECMAScript has evolved over time. It was initially
    developed in the mid-nineties for use in client-side scripting. The current standard
    is ECMAScript 5; however, Version 6 is currently being worked on. The TypeScript
    compiler provides a list of options to change the way your code is generated.
    In this section, we will look at these options and compare the results.'
