  md: "# # Understanding inheritance\n\nInheritance is the ability of a class to extend\
    \ the functionality of an existing class. Inheritance creates a way for multiple\
    \ objects to share a common core set of code and then extend or modify this as\
    \ necessary for a specific purpose. Take for example our Shape class, which is\
    \ very simple with a couple of properties in it, but these properties don’t provide\
    \ specific details as to what shape is actually being represented. In the following\
    \ code, you can see we have modified the Shape class to be more generic and created\
    \ a subclass using the extends construct in TypeScript:\n\n```\n```typescript\n\
    interface IShape {\n    location: IPoint;\n    move(newLocation: IPoint);\n}\n\
    class Shape implements IShape {\n    public location: IPoint = new Point(0, 0);\n\
    \    constructor() {\n    }\n    public move(newLocation: IPoint) {\n        this.location\
    \ = newLocation;\n    }\n}\ninterface IRectangle extends IShape {\n    height:\
    \ number;\n    width: number;\n    area(): number;\n    resize(height: number,\
    \ width: number);\n}\nclass Rectangle extends Shape implements IRectangle {\n\
    \    public height: number = 0;\n    public width: number = 0;\n    constructor()\
    \ {\n        super();\n    }\n    public area(): number {\n        return this.height\
    \ * this.width;\n    }\n}\n```\n```\n\nAs you can see, we have a generic interface\
    \ for the Shape class that implements only the basic functionality needed for\
    \ a shape object, which is a location on a plane. The Point class is the same\
    \ one we created back in Chapter 2, TypeScript Basics. Then a new interface gives\
    \ us the properties and methods needed to define a basic rectangle shape. This\
    \ interface is not explicitly necessary, but having it defined will allow us to\
    \ extend or replace the Rectangle class easily in code later if we need to. This\
    \ is followed by the class definition for a rectangle which, like the IRectangle\
    \ definition, shows the usage of the extends keyword. This tells the compiler\
    \ that the Rectangle class is a shape and should inherit all of the properties\
    \ that come with it. Inside the constructor, an extra line must be added that\
    \ initializes the base class instance.\n\n# ## Tip"
