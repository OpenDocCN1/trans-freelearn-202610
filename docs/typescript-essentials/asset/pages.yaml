    \ || (Animals.Reptiles = {}));\n    var Reptiles = Animals.Reptiles;\n})(Animals\
    \ || (Animals = {}));\nvar Animals;\n(function (Animals) {\n    (function (Mammals)\
    \ {\n        Mammals.monkey = \"monkey\";\n```\n```"
