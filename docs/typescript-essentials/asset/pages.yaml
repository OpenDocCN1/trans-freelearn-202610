- pgno: 126
  md: '# SOLID – object-oriented design


    SOLID is an acronym for five of the basic principles when designing classes in
    OOP. Following these principles will ensure that your application is well structured
    and flexible enough for the future. Let’s take a look at what each of these letters
    represents:


    +   - **Single Responsibility Principle:** A class should have only one reason
    to change. If a class has multiple responsibilities, then those responsibilities
    become coupled together. When this coupling occurs, it increases the potential
    for a change to one of the responsibilities to break the functionality of the
    other responsibilities. For more information on this principle, refer to: http://www.objectmentor.com/resources/articles/srp.pdf.

    +   - **Open/Closed Principle:** An object should be open for extension but closed
    for modification. This principle is the basis for abstraction, which we will discuss
    briefly. Essentially, your programs should be designed around a specific set of
    contracts or abstract classes that should be extended to implement new functionality
    as requirements change. For more information on this principle, please refer to:
    http://www.objectmentor.com/resources/articles/ocp.pdf.

    +   - **Liskov Substitution Principle:** An object should be able to be replaced
    with a subtype object without altering program execution. This principle builds
    on the Open/Closed Principle in that any subclass must maintain the minimum contract
    established by the base class. However, this principle goes a step further in
    that it applies to the client use of each object and the behavior expected from
    the base class. For more information on this principle, please refer to: http://www.objectmentor.com/resources/articles/lsp.pdf.

    +   - **Interface Segregation Principle:** Many client specific interfaces are
    better than a single general purpose interface. This principle is important because
    it helps to decouple different behaviors from each other, allowing clients to
    only implement exactly what they need to. For more information on this principle,
    please refer to: http://www.objectmentor.com/resources/articles/isp.pdf.

    +   - **Dependency Inversion Principle:** Rely on abstractions rather than concretions.
    This principle states that proper abstractions should be created that both dependent
    functions can rely on and concrete implementations will adhere to. When both are
    capable of using this abstraction, then it becomes simple to reuse code as requirements
    change with minimal impact. For more information on this principle, please refer
    to: http://www.objectmentor.com/resources/articles/dip.pdf.


    Keeping these principles in mind while developing your applications will allow
    you to develop object-oriented code with the procedural language of JavaScript.'
  merge: -1
