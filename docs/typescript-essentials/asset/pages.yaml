  md: "# Creating a ViewModel\n\nNow that we have our reusable controls set up, we\
    \ need to create the view model that our application will be bound to and make\
    \ some modifications to our existing types to ensure execution runs smoothly.\
    \ To maintain the single responsibility pattern, we should create a new model\
    \ that the UI will be bound to rather than using the DrawingModel class, which\
    \ is responsible for maintaining the state of the shapes in our application. This\
    \ new model will be bound to the DOM using Knockout and will be responsible for\
    \ creating and maintaining the state of the application. It will reside in a file\
    \ called DrawingModel.ts inside of the Drawing directory. Before we can create\
    \ this model, we will need to modify the existing drawing model so that our application\
    \ view model will be able to update the drawing model when the user interacts\
    \ with the controls. As you can see, in the new interface definition provided,\
    \ we have made the drawing tool and drawing color properties public members:\n\
    \n```\nexport interface IDrawingModel {\n    selection: IDrawingShape;\n    shapes:\
    \ IDrawingShape[];\n    addShape(shape: IDrawingShape);\n    getNewShape(location:\
    \ ShapeTypes.IPoint): IDrawingShape;\n    drawingTool: DrawingToolType;\n    drawingColor:\
    \ string;\n}\n```\n\nThe getDrawingTool method is no longer necessary because\
    \ we are providing public access to the underlying instance member. If we were\
    \ dealing with released software, we would not want to modify this interface directly,\
    \ but instead extend it and provide a new implementation for the DrawingModel\
    \ type. However, since this is only a sample application, we can modify it to\
    \ improve our overall design despite the breaking changes this will cause. Only\
    \ the internal implementation of this class and a single reference inside of the\
    \ canvas engine will need to be modified to return our application to a working\
    \ state.\n\nOnce these fixes have been made, we can effectively design the application\
    \ view model that will reside in a file called DrawingApplicationModel.ts in the\
    \ Scripts directory:\n\n```\nimport ControlsTypes = require('Scripts/Controls/ControlsTypes');\n\
    import DrawingModel = require('Scripts/Drawing/DrawingModel');\nimport CanvasEngine\
    \ = require('Scripts/Drawing/CanvasEngine');\nimport Controls = require('Scripts/Controls/Controls');\n\
    import DrawingTypes = require('Scripts/Drawing/DrawingTypes');\n\nclass DrawingApplicationModel\
    \ {\n    public userControls:\nKnockoutObservableArray<ControlsTypes.IUserControl>\
    \ =\n            ko.observableArray([]);\n    public selectedToolType:\nKnockoutObservable<DrawingTypes.DrawingToolType>\
    \ =\n\nko.observable(DrawingTypes.DrawingToolType.Select);\n    public selectedColor:\
    \ KnockoutObservable<string> =\nko.observable(\"#000000\");\n    private _drawingModel:\
    \ DrawingTypes.IDrawingModel;\n```"
  merge: -1
  img_proc: true
