- pgno: 94
  md: "```\n})(Animals.Mammals || (Animals.Mammals = {}));\n    var Mammals = Animals.Mammals;\n\
    })(Animals || (Animals = {}));\n```\n\nThere are probably some common object types\
    \ or utility methods that you would prefer to have quick access to inside of another\
    \ module. As we continue to separate our types appropriately let’s create a new\
    \ module for drawing-related functionality. This module will contain both the\
    \ Point class and the Bounds class that we created earlier. Both of these classes\
    \ will be exported because other modules will need to be able to reference them.\
    \ While it is nice to have the code separated into isolated segments that can\
    \ be easily managed, I now have to provide a fully qualified name every time I\
    \ wish to use a type from another module. Thankfully, TypeScript has provided\
    \ a keyword opposite to the export keyword that allows us to create an alias to\
    \ members of another module. The import keyword creates a new local reference\
    \ to exported types from other modules. In the following code segment, we will\
    \ create an alias for the Bounds class inside the Shapes module. This will prevent\
    \ us from having to change the definition of our Shape class to contain the full\
    \ namespace of the Bounds type.\n\n```\nmodule Shapes {\n    import Bounds = Drawing.Bounds;\n\
    \    export enum ShapeType {\n        Rectangle = 3,\n        Circle,\n      \
    \  Line,\n        Freehand,\n    }\n    export interface IShape {\n        Type:\
    \ ShapeType;\n        Bounds: Drawing.IBounds;\n    }\n    export class Shape\
    \ {\n        public Type: ShapeType = ShapeType.Rectangle;\n        public Bounds:\
    \ Drawing.IBounds = new Bounds();\n    }\n}\n```\n\nAs you can see, the alias\
    \ can be used as both a type annotation and as its object type. The resulting\
    \ JavaScript just replaces the import keyword with var and lets the runtime engine\
    \ create the reference to the exported member. However, doing this directly in\
