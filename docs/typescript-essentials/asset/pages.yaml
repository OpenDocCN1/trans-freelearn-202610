- pgno: 129
  md: "The call to the base class constructor must be the first statement inside the\
    \ subclass constructor otherwise a compile-time error will occur.\n\nNow every\
    \ Rectangle object created will have not only the height, width, and area members\
    \ but it will also contain a Location property and the Move method that are defined\
    \ by the Shape class. This is not a default construct in the language of JavaScript\
    \ so let’s take a quick look at the output provided by the compiler to see how\
    \ this is implemented:\n\n```\n```javascript\nvar __extends = this.__extends ||\
    \ function (d, b) {\n    for (var p in b) if (b.hasOwnProperty(p)) d[p] = b[p];\n\
    \    function __() { this.constructor = d; }\n    __.prototype = b.prototype;\n\
    \    d.prototype = new __();\n};\nvar Point = (function () {\n    function Point(x,\
    \ y) {\n        if (typeof x === \"undefined\") { x = 0; }\n        if (typeof\
    \ y === \"undefined\") { y = 0; }\n        this.x = x;\n        this.y = y;\n\
    \    }\n    return Point;\n})();\n\nvar Shape = (function () {\n    function Shape()\
    \ {\n        this.location = new Point(0, 0);\n    }\n    Shape.prototype.move\
    \ = function (newLocation) {\n        this.location = newLocation;\n    };\n \
    \   return Shape;\n})();\n\nvar Rectangle = (function (_super) {\n    __extends(Rectangle,\
    \ _super);\n    function Rectangle() {\n        _super.call(this);\n        this.height\
    \ = 0;\n        this.width = 0;\n    }\n    Rectangle.prototype.area = function\
    \ () {\n        return this.height * this.width;\n    };\n    return Rectangle;\n\
    })(Shape);\n```\n```\n\nAs you can see, all of our classes are created as modules\
    \ as discussed previously, but before any of these are generated, the compiler\
    \ injects a special segment of code to handle extending classes. The TypeScript\
    \ compiler implements object-oriented principles for us by applying a standard\
    \ set of well-known patterns—member addition and prototype copying. This code\
    \ takes in two object types as parameters. The first parameter is the subclass\
    \ that is in need of all of the base class’s properties, and the second is the\
    \ base class itself. This function then loops through each of the available members\
    \ on the base class"
