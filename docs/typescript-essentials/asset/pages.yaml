    \    super('test_Point');\n        //add test by name\n        this.AddTest('test_RectangleResize',\
    \ 'Test resizing of Rectangle');\n    }\n    setUpAsync(dfdSetup: JQueryDeferred<any>)\
    \ {\n        var cb = super.setUpAsync;\n```"
