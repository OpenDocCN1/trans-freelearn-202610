    \ As you can see in the following screenshot, accessing both the Reptiles and\
    \ Mammals namespaces is identical:\n\n![](img/83a7f7e1723158e56008cf70304a8da4_93_0.png)\n\
    \nThe resulting JavaScript from each of these module definitions is identical\
    \ in structure. However, if you intend on declaring multiple nested modules inside\
    \ of a single TypeScript file, it is best to use the expanded nesting declaration\
    \ rather than the shortcut. The compiler will not attempt to optimize and merge\
    \ the module definitions when it creates the JavaScript output. As you can see\
    \ in the following JavaScript code, you will unnecessarily have multiple closures\
