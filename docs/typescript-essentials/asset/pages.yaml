    Hang on a minute; those aren’t the values for our enumeration. What went wrong?
    Well, this has something to do with the way that the compiler interprets the return
    type of the CanvasEngineAction enum that was imported and then exported. Enumerations
    are a clever representation of a number, so the type system reads the return type
    as a number and determines that these must be our available options. Modules and
    classes do not have this problem because their type is unique. To work around
    this problem, we simply have to correctly type the action variable and our enumeration
    will behave as expected.


    ![](img/83a7f7e1723158e56008cf70304a8da4_205_1.png)


    All of these methods are completely valid and fit different needs. As we refactor
    the drawing application, we will use a combination of these methods to break our
    code into logical groupings. Using the TypeScript compiler isn’t the only way
    for us to segment out our code. Keeping code in a directory structure that groups
    similar objects together results in easy differentiation between code functionality.
    In the following screenshot, you can see that we have created a separate directory
    for our generic shape objects from any drawing-related logic. The drawing code
    is separated into more finely-grained subsections as well depending on the functionality
    each grouping will contain.'
