- pgno: 65
  md: "# # Functions\n\nIf you are at all familiar with JavaScript you will be very\
    \ familiar with the concept of functions. TypeScript has added type annotations\
    \ to the parameter list as well as the return type. Due to the new constraints\
    \ being placed on the parameter list, the concept of function overloads was also\
    \ included in the language specification. TypeScript also takes advantage of JavaScript’s\
    \ **arguments** object and provides syntax for rest parameters. Let’s take a look\
    \ at a function declaration in TypeScript:\n\n```\n```typescript\nfunction add(x:\
    \ number, y: number): number {\n    return x + y;\n}\n```\n```\n\nAs you can see,\
    \ we have created a function called add. It takes two parameters that are both\
    \ of the type number, one of the primitive types, and it returns a number. This\
    \ function is useful in its current form but it is a little limited in overall\
    \ functionality. What if we want to add a third number to the first two? Then\
    \ we have to call our function multiple times. TypeScript provides a way to provide\
    \ optional parameters to functions. So now we can modify our function to take\
    \ a third parameter, z, that will get added to the first two numbers, as shown\
    \ in the following code:\n\n```\n```typescript\nfunction add(x: number, y: number,\
    \ z?: number) {\n    if (z !== undefined) {\n        return x + y + z;\n    }\n\
    \    return x + y;\n}\n```\n```\n\nAs you can see, we have a third named parameter\
    \ now but this one is followed by ?. This tells the compiler that this parameter\
    \ is not required for the function to be called.\n\n# ## Tip\n\nOptional parameters\
    \ tell the compiler not to generate an error if the parameter is not provided\
    \ when the function is called. In JavaScript, this compile-time checking is not\
    \ performed, meaning an exception could occur at runtime because each missing\
    \ parameter will have a value of undefined. It is the responsibility of the developer\
    \ to write code that verifies a value exists before attempting to use it.\n\n\
    So now we can add three numbers together and we haven’t broken any of our previous\
    \ code that relied on the add method only taking two parameters. This has added\
    \ a little bit more functionality but I think it would be nice to extend this\
    \ code to operate on multiple types. We know that strings can be added together\
    \ just the same as numbers can, so why not use the same method? In its current\
    \ form, though, passing strings to the add function will result in compilation\
    \ errors. We will modify the function’s definition to take not only numbers but\
    \ strings as well, as shown in the following code:\n\n```\n```typescript\nfunction\
    \ add(x: string, y: string): string;\nfunction add(x: number, y: number): number;\n\
    function add(x: any, y: any): any {\n```\n```"
  merge: -1
  img_proc: true
- pgno: 66
  md: "```\n    return x + y;\n}\n```\n\nAs you can see, we now have two declarations\
    \ of the add function: one for strings, one for numbers, and then we have the\
    \ final implementation using the any type. The signature of the actual function\
    \ implementation is not included in the function’s type definition, though. Attempting\
    \ to call our add method with anything other than a number or string will fail\
    \ at compile time, however, the overloads have no effect on the generated JavaScript.\
    \ All of the type annotations are stripped out, as well as the overloads, and\
    \ all we are left with is a very simple JavaScript method:\n\n```\nfunction add(x,\
    \ y) {\n    return x + y;\n}\n```\n\nGreat, so now we have a multipurpose add\
    \ function that can take two values and combine them together for either strings\
    \ or numbers. This still feels a little limited in overall functionality though.\
    \ What if we wanted to add an indeterminate number of values together? We would\
    \ have to call our add method over and over again until we eventually had only\
    \ one value. Thankfully, TypeScript includes rest parameters, which is essentially\
    \ an unbounded list of optional parameters.\n\nThe following code shows how to\
    \ modify our add functions to include a rest parameter:\n\n```\nfunction add(arg1:\
    \ string, ...args: string[]): string;\nfunction add(arg1: number, ...args: number[]):\
    \ number;\nfunction add(arg1: any, ...args: any[]): any {\n    var total = arg1;\n\
    \    for (var i = 0; i < args.length; i++) {\n        total += args[i];\n    }\n\
    \    return total;\n}\n```\n\nA rest parameter can only be the final parameter\
    \ in a function’s declaration. The TypeScript compiler recognizes the syntax of\
    \ this final parameter and generates an extra bit of JavaScript to generate a\
    \ shifted array from the JavaScript arguments object that is available to code\
    \ inside of a function. The resulting JavaScript code shows the loop that the\
    \ compiler has added to create the array that represents our indeterminate list\
    \ of parameters:\n\n```\nfunction add(arg1) {\n    var args = [];\n    for (var\
    \ _i = 0; _i < (arguments.length - 1); _i++) {\n        args[_i] = arguments[_i\
    \ + 1];\n    }\n    var total = arg1;\n    for (var i = 0; i < args.length; i++)\
    \ {\n        total += args[i];\n    }\n    return total;\n}\n```"
