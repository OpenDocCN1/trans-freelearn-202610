- pgno: 142
  md: "# Operator overloading\n\nJavaScript is not inherently an object-oriented language\
    \ and this limits what we can do somewhat, so we are still restricted in some\
    \ respects compared to languages such as C#. There is no way to perform operator\
    \ overloading in JavaScript so we are forced to implement specific methods on\
    \ our classes to implement the functionality we want. In the following example,\
    \ we defined a Vector type that will allow us to perform vector math operations:\n\
    \n```\ninterface IVector {\n    x: number;\n    y: number;\n}\nclass Vector implements\
    \ IVector {\n    public x: number = 0;\n    public y: number = 0;\n    constructor(x\
    \ = 0, y = 0) {\n        this.x = x;\n        this.y = y;\n    }\n}\n```\n\nWe\
    \ know that performing vector addition is fairly simple so it would be very nice\
    \ if we could use the + operator to add two instances of this class together.\n\
    \n```\nvar v1 = new Vector(2, 5);var v2 = new Vector(4, 3);\nvar v3 = v1 + v2;\n\
    alert(v3);\n```\n\nHowever, since operator overloading is not available in JavaScript,\
    \ the result will end up looking something similar to the following screenshot:\n\
    \n![](img/83a7f7e1723158e56008cf70304a8da4_142_0.png)\n\nBehind the scenes, the\
    \ JavaScript engine calls the toString method associated with the objects and\
    \ then concatenates them into a single value. This has the potential to cause\
    \ unexpected results in our applications. To perform the functionality we want,\
    \ we must explicitly implement methods to handle the desired functionality.\n\n\
    ```\npublic add(v: IVector): IVector {\n    var newVector = new Vector();\n  \
    \  newVector.x = this.x + v.x;\n    newVector.y = this.y + v.y;\n    return newVector;\n\
    }\n```"
  merge: -1
  img_proc: true
