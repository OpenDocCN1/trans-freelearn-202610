    \ on the canvas:\n\n```\npublic draw(ctx: CanvasRenderingContext2D) {\n    ctx.fillStyle\
    \ = \"#FF0000\";\n    ctx.globalAlpha = this.Opacity;\n    ctx.fillRect(this.location.x,\
    \ this.location.y, this.shape.width, this.shape.height);\n    ctx.strokeStyle\
    \ = \"#000000\";\n    ctx.lineWidth = 3;\n    ctx.strokeRect(this.location.x,\
    \ this.location.y, this.shape.width, this.shape.height);\n}\n```\n\nAs we defined\
    \ earlier in the abstraction of our types, the Draw method takes in one parameter\
    \ which is of type CanvasRenderingContext2D. This type is a description of the\
    \ object returned by the canvas element that allows us to draw our different objects\
