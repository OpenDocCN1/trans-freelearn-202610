- pgno: 80
  md: "```\n```typescript\nif (result == 0) {\n    return 0;\n} else if (result >\
    \ 0) {\n    return 1;\n} else {\n    return -1;\n}\n};\nPoint.Compare = function\
    \ (p1, p2) {\n    return p1.Compare(p2);\n};\nreturn Point;\n})();\n```\n```\n\
    \nWe still haven’t discussed one of the most important parts of TypeScript classes,\
    \ and that’s instance member functions. These functions are only available to\
    \ an instance of the object of the type and they have access to the `this` object\
    \ that allows easy access to all of an object’s members. In JavaScript, there\
    \ are a couple of ways to create instance member functions. They can be added\
    \ directly to the object using the `this` object during the object’s creation,\
    \ or they can be attached to the object’s prototype. There are advantages and\
    \ disadvantages to both, but it is generally better to put functions on the prototype\
    \ rather than assign them to each new instance of the class. The instance of the\
    \ function placed on the static prototype is then reused over and over rather\
    \ than being recreated with each new instance of the type. This helps reduce memory\
    \ consumption and will improve performance as your applications grow. TypeScript\
    \ has adopted this method for attaching methods to instances of an object.\n\n\
    Let’s create a new type that represents an object on a plane. It will have three\
    \ properties: `Height`, `Width`, and `Location`. There will also be one instance\
    \ member function that determines the size of the object on the plane. The `Location`\
    \ member will be of type `Point` that we created just a little while ago:\n\n\
    ```\n```typescript\ninterface IBounds {\n    Location: IPoint;\n    Height: number;\n\
    \    Width: number;\n    Size(): number;\n}\nclass Bounds implements IBounds {\n\
    \    public Location: IPoint = new Point(0, 0);\n    public Height: number = 0;\n\
    \    public Width: number = 0;\n    public Size() {\n        return this.Height\
    \ * this.Width;\n    }\n}\n```\n```\n\nAs you can see, this class does not contain\
    \ an explicit constructor; however, all of its properties are initialized and\
    \ will be available for consumption when an instance of the type is created. As\
    \ you can see from the resulting JavaScript, the Size method is placed on the\
    \ Bounds object’s static prototype member and a parameter-less constructor is\
    \ created where all of the instance members are initialized:"
