    The square test has failed. The interface was implemented so our code was able
    to compile; however, this has exposed a problem with our assumption about squares.
    Through our implementation, we forced the behavior of a square onto an IRectangle
    type. This test exposed the fact that we broke the Liskov substitution principle
    that we discussed in Chapter 4, Object-oriented Programming with TypeScript. We
    are not able to safely substitute one IRectangle object for another, which could
    result in unexpected behavior.'
