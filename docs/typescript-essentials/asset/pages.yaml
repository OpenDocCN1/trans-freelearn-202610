- pgno: 241
  md: '# Test-driven development


    As our applications grow in both size and complexity, it is more important than
    ever for us to deliver software with as few bugs as possible. Manual testing is
    inconsistent and slow, which means we need to adopt a more methodical way of ensuring
    the quality of our software. This need has brought about the notion of test-driven
    development. Test-driven development is a development cycle that repeats a small
    set of steps to ensure each line of code is tested. The steps in the test-driven
    development life cycle are:


    +   - Adding a test

    +   - Running the tests

    +   - Writing the code

    +   - Running the tests again

    +   - Refactoring the code


    The first thing we want to do is write a test to verify some functionality. This
    creates a requirement for the code that we have yet to write. This test will initially
    fail when writing unit tests for new functionality; this is expected and helps
    to verify that the test does have a failure state. At this point, we run all of
    the tests, verifying that preexisting tests still pass and our new test fails.
    If the new test does not fail, the functionality has either already been implemented
    or the test is invalid and needs to be rewritten. Once we have a valid test, we
    must implement the feature that we are attempting to test. This code does not
    have to be perfect upon the first implementation; the goal is only to write enough
    code to pass the test. When the functionality is implemented, we rerun the tests
    and verify that our code is effective. If not, then it must be corrected. Otherwise,
    the code can be refactored; but the test must always pass. This process is repeated
    until every feature has tests and an implementation. Now that we are familiar
    with the process of test-driven development, let’s look at how unit testing works
    in TypeScript.


    # Note


    For more information about test-driven development, please visit http://msdn.microsoft.com/en-us/library/aa730844(v=vs.80).aspx.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Unit testing


    Unit tests are code blocks that test small units of functionality with a set of
    control data and expected results. These tests are reliable and reusable, ensuring
    that our code is not only tested for the current version of the application, but
    for all future releases. This will ensure that any added or modified features
    do not break existing functionality and will alert us of a problem well ahead
    of time. TypeScript does not come with any built-in unit testing tools; however,
    the web community once again filled this hole. A unit test framework has been
    created by Maxim Fridberg and gives you a simple way to create and view all of
    your unit tests for libraries that you have created. The name of the framework
    is MaxUnit and is available for download from https://github.com/KnowledgeLakegithub/MaxUnit,
    or it is available as a NuGet package called KL.Testing.MaxUnit.


    ![](img/83a7f7e1723158e56008cf70304a8da4_242_0.png)


    This package will add a number of files to our Visual Studio project including
    sample usage of the framework. The advantage of MaxUnit is that it allows us to
    write tests in TypeScript for our TypeScript libraries. There are a number of
    other testing frameworks available to test JavaScript libraries, including Jasmine
    (https://github.com/pivotal/jasmine/) and QUnit (http://qunitjs.com/). It is generally
    best to keep your test code separate from the implementation code, to ensure that
    it will be tested in the same manner that it will be used. To get a feel for how
    unit testing works, let’s take the Shapes library that we created for the drawing
    application and create a series of tests to ensure proper functionality. The Shapes
    library outputs to a single JavaScript file and has interfaces associated with
    it that we can use to test our code.'
  merge: -1
  img_proc: true
- pgno: 243
  md: "# Adding tests\n\nNow that we have the tooling installed, let’s begin the process\
    \ of unit testing our library. The first thing we need to do is add the Shapes\
    \ library to the testing project. This process can be done manually or can be\
    \ automated using PowerShell to deploy the latest version of our code. For now,\
    \ we will handle it manually so that we can focus on testing. Once our library\
    \ is added to the project, we can begin writing tests. We will create a separate\
    \ testing class to test each of our objects in the Shapes library. Let’s start\
    \ with the simplest class in the library, the Point class, to get a feel for testing.\
    \ In the following sample, you can see we have created a new class called test_Point\
    \ that contains all of our tests for this particular class:\n\n```\n/// <reference\
    \ path=\"../../maxunit.ts\" />\n/// <reference path=\"../../scripts/typings/shapes/shapestypes.d.ts\"\
    \ />\nclass test_Point extends maxUnit.TestClassBase {\n    private _shapes: Shapes\
    \ = null;\n    constructor() {\n        //give test suite a name\n        super('test_Point');\n\
    \        //add test by name\n    }\n    setUpAsync(dfdSetup: jQueryDeferred<any>)\
    \ {\n        var cb = super.setUpAsync;\n        require(['/Scripts/Shapes/Shapes.js'],\
    \ (Shapes) => {\n            this._shapes = Shapes;\n            cb(dfdSetup);\n\
    \        });\n    }\n    tearDown() {\n        super.tearDown();\n    }\n}\n\n\
    export = test_Point;\n```\n\nThe class inherits from the maxUnit base class TestClassBase,\
    \ which provides methods used to register tests with the testing framework. The\
    \ constructor calls the base constructor and provides the name for this set of\
    \ tests. Eventually, this section will also contain the registration for each\
    \ of our unit tests. The setUpAsync method will be used to set up any necessary\
    \ mock objects and create a reference to the Shapes library. If our library contained\
    \ jQuery or any other dependencies, we would mock these objects to ensure our\
    \ library performs as expected. The tearDown method provides a place to provide\
    \ any cleanup logic that you may want to execute after the tests have run. Now,\
    \ let’s begin by writing some very simple tests that will verify the creation\
    \ of a Point object. Each unit test should be arranged into three sections:\n\n\
    +   - Arrange\n+   - Act\n+   - Assert\n\nThe arrange section will create any\
    \ objects we need to perform our test, act will perform"
  merge: -1
  img_proc: true
