  md: "```\nborder-color: @borderColor;\n}\ncanvas {\n    border: 4px solid @borderColor;\n\
    }\n```\n\nWe use our variables to define the values that our styles will have.\
    \ The buttons that now have the .tool-select-button class will be given new background\
    \ and border colors. There is also a nested style shown, which when compiled into\
    \ CSS will create another style that represents the union between these two styles.\
    \ The final style puts a border around the color picker. When the LESS code is\
    \ compiled, the resulting CSS will look similar to the following code:\n\n```\n\
    .tool-select-button {\n    background-color: #ffffff;\n    border-color: #000000;\n\
    }\n.tool-select-button.selected {\n    background-color: #1111dd;\n    color:\
    \ #ffffff;\n}\ninput[type=color] {\n    border-color: #000000;\n}\ncanvas {\n\
    \    border: 4px solid #000000;\n}\n```\n\nNotice that all of the variables have\
    \ been removed and replaced with the values they represent. LESS variables have\
    \ no representation in CSS, so they behave similar to interfaces in TypeScript\
    \ in that they have no compiled output. If a LESS file is imported that does contain\
    \ styles, all of those styles will be included in the resulting CSS file as a\
    \ merged set of styles. Now we can simply modify our HTML to link our style sheet\
    \ and our application will have a better user experience."
