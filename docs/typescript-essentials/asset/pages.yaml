  md: "```\n```typescript\n}\n\nclass ConcreteClass extends AbstractClass {\n    private\
    \ _isActive: boolean = false;\n    constructor() {\n        super();\n    }\n\
    \    public checkStatus(): boolean {\n        return this._isActive;\n    }\n\
    }\n```\n```\n\nAs you can see, we must still define a complete class that represents\
    \ the abstract base class. However, in the method implementation of `checkStatus`,\
    \ an exception is thrown at runtime that will stop program execution whenever\
    \ an attempt to use this class directly is made. It would be nice if there was\
    \ some way to enforce this at compile time, however, currently this functionality\
    \ does not exist. TypeScript does not have a protected accessibility level so\
    \ we have been forced to move this detail down into the concrete class explicitly.\
    \ In this specific case, it would make sense to just make the `AbstractClass`\
    \ into an interface that the `ConcreteClass` type would then implement; however,\
    \ as our objects become more complex, we will want to have publicly accessible\
    \ members that are defined only once in the base type and specific method implementations\
    \ will need to be provided by the concrete classes."
