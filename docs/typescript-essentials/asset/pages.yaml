  md: '# Advanced options


    With everything we’ve seen so far, we can build and deploy large applications.
    Now, we are going to take a look at the few remaining options that we haven’t
    covered yet. Some are just informative, while others can help you and your team
    write better TypeScript code. As with most command line utilities, the TypeScript
    compiler comes with a help parameter that will output all of the compiler’s options.
    To view all of these options, use the -h or --help parameters or simply run the
    compiler with no parameters at all. There is also a version parameter that outputs
    the current version of the TypeScript compiler that is installed. This is viewed
    using either the -v or --version parameters. As you can see from the following
    screenshot, this book was written immediately following the initial release of
    TypeScript as a completed language.


    Since the language is open source, expect improvements to be made and new versions
    to be available.


    ![](img/83a7f7e1723158e56008cf70304a8da4_117_0.png)


    Now that we’ve covered the options that we’ll use very infrequently, let’s get
    back to improving how we develop for the Web. If you are writing a web application,
    it is possible you could have users all around the world. This means your applications
    could and probably should support multiple languages. To ensure that each localized
    character is displayed properly, you may have to specify a code page.


    # Note


    A code page is a number that is used to represent character encoding. For instance,
    UTF-8 is 65001 while ASCII is 20127.


    The TypeScript compiler provides the --codepage parameter to allow you to specify
    the character set that the resulting JavaScript file will contain. By default,
    the TypeScript compiler will use 65001 when this parameter is not provided. Visual
    Studio does not allow this option to be specified and UTF-8 should be used in
    most scenarios.


    We talked earlier about JavaScript’s strict mode and how it forced certain constructs
    upon the language that help improve the code we develop. TypeScript has its own
    version of strict mode that forces us to use types everywhere. If a type is not
    explicitly provided and the compiler is not able to infer the object’s type information,
    we can use the compiler to warn us. To enforce this constraint, simply provide
    the --noImplicitAny parameter when compiling your TypeScript files. In the following
    code segment, you can see that we create'
