- pgno: 157
  md: "# Drawing shapes\n\nNow that we have the basic representation of what we want\
    \ to draw, we need to define objects that will handle this. These objects should\
    \ do the least amount of work required to draw the shapes they represent. This\
    \ means no direct interaction with the **Document Object Model (DOM)**. The following\
    \ interfaces represent the different abstractions that we will use to represent\
    \ a shape that can be drawn and manipulated on the canvas element:\n\n```\ninterface\
    \ IDraw {\n    draw(ctx: CanvasRenderingContext2D);\n}\ninterface IResize {\n\
    \    inResizeZone: (mouse: IPoint) => boolean;\n    resizeToLocation: (to: IPoint)\
    \ => void;\n}\ninterface IMove {\n    move: (to: IPoint) => void;\n    contains:\
    \ (mousePoint: IPoint, ctx: CanvasRenderingContext2D) => boolean;\n    getMoveOffset(mousePos:\
    \ IPoint): IPoint;\n}\ninterface IDrawingShape extends IDraw, IResize, IMove {\n\
    \    shape: IShape;\n    location: IPoint;\n    isSelected: boolean;\n    selectionZoneWidth:\
    \ number;\n    opacity: number;\n    getCursorType: (mousePoint: IPoint) => string;\n\
    \    getClickLocationAction(mouse: IPoint, ctx: CanvasRenderingContext2D): CanvasEngineAction;\n\
    }\n```\n\nEach of these interfaces could easily be combined into a single interface,\
    \ but in accordance with the interface segregation principle, each of these actions\
    \ can now be decoupled from one another if needs be. The IDrawingShape interface\
    \ eventually merges each of these types while adding some of its own functionality.\
    \ All of this put together represents a type that we will be able to draw on the\
    \ HTML canvas element and interact with in some way. Each IDrawingShape instance\
    \ holds a reference to its specific shape that can then be accessed or manipulated\
    \ by our application logic. Separating each shape from the drawing-specific interface\
    \ upholds the single responsibility principle by allowing the shape to keep track\
    \ of its data while the drawing objects will only be responsible for methods related\
    \ to rendering the specific shape in the browser. The shape’s location on the\
    \ canvas is managed by the drawing shape as well as whether it is the currently\
    \ selected object on the canvas. The getCursorType and getClickLocationAction\
    \ functions are application-specific and will allow the object responsible for\
    \ handling user interaction to request information from the drawing objects before\
    \ proceeding through its application logic. The concrete implementation of this\
    \ interface is as follows:\n\n```\nclass DrawingShapeBase implements IDrawingShape\
    \ {\n    public shape: IShape = null;\n    public location: IPoint = new Point(0,\
    \ 0);\n```"
  merge: -1
  img_proc: true
