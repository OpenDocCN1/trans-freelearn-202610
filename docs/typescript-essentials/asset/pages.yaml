    export class Square implements IRectangle {\n    constructor(public height: number,\
    \ public width) {\n        this.width = this.height;\n    }\n    public resize(height:\
    \ number, width: number) {\n        this.height = height;\n        this.width\
    \ = height;\n    }\n}\n```\n```\n\nAs you can see, this class upholds both the\
    \ IRectangle interface and the notion of squares by making sure that the width\
    \ and height properties get set to the same value. We can now write a third testing\
    \ method in the test_IRectangle class that will instantiate a new Square object\
