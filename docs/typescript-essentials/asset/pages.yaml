- pgno: 140
  md: "# Method overloading\n\nMethod overloading is the idea of providing multiple\
    \ methods with different call signatures but the same name. We discussed this\
    \ earlier in Chapter 2, TypeScript Basics, so this will be a short review of that.\
    \ As we saw earlier, we are able to provide multiple call signatures for a single\
    \ function as long as the parameters all share a common base type. The ICommunicator\
    \ interface shown in the following code provides an example of this:\n\n```\n\
    interface ICommunicator {\n    speak(message: string);\n    speak(message: number);\n\
    \    sipeak(message: boolean);\n    speak(message: any);\n}\nclass Communicator\
    \ implements ICommunicator {\n    constructor() {\n    }\n    speak(message: string);\n\
    \    speak(message: number);\n    speak(message: boolean);\n    speak(message:\
    \ any) {\n        alert(message);\n    }\n}\n```\n\nIn this example, we defined\
    \ a class that is used for communicating messages. The message can be of any of\
    \ the types defined in the method list, and they all share a common base type\
    \ that must be used in the final method signature, as discussed in Chapter 2,\
    \ TypeScript Basics. In traditional object-oriented languages, we would be able\
    \ to define multiple implementations of the speak method, however since the end\
    \ result is still plain JavaScript, we can only provide the single method block.\
    \ Through the use of conditional statements, we could provide different execution\
    \ paths for each of the different types used in the parameter list, as shown in\
    \ the following example:\n\n```\nclass Communicator implements ICommunicator {\n\
    \    constructor() {\n    }\n    speak(message: string);\n    speak(message: number);\n\
    \    speak(message: boolean);\n    speak(message: any) {\n        if (typeof message\
    \ === \"string\") {\n            alert(message);\n        } else if (typeof message\
    \ === \"number\") {\n            alert(\"The number provided was: \" + message);\n\
    \        } else if (typeof message === \"boolean\") {\n            alert(\"The\
    \ boolean value was: \" + message);\n        } else {\n            alert(message);\n\
    \        }\n    }\n}\n```"
