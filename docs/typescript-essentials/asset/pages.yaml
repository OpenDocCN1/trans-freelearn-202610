  md: '# Controlling compiler output


    The TypeScript compiler has a very robust set of features when it comes to controlling
    the final results of the compiler. The compiler is built in a scalable manner
    that allows us to compile multiple source files at once as well as controlling
    their output directory or path. We will also discuss creating source maps that
    help us when debugging our applications.'
