  md: "# # Method overrides\n\nMethod overrides are a way to replace functionality\
    \ that is inherited from super-classes. Method overrides must have the same call\
    \ signature as the method that is being overridden. Take a look at the following\
    \ example:\n\n```\n```typescript\ninterface IEmployee {\n    name: string;\n \
    \   email: string;\n    work(tasks: string[]);\n}\nclass Employee implements IEmployee\
    \ {\n    constructor(public name: string, public email: string) {\n    }\n   \
    \ public work(tasks: string[]) {\n        for (var i = 0; i < tasks.length; i++)\
    \ {\n            //perform task\n        }\n    }\n}\ninterface IManager extends\
    \ IEmployee {\n    employees: IEmployee[];\n}\nclass Manager extends Employee\
    \ implements IManager {\n    public employees: IEmployee[] = [];\n    constructor(name:\
    \ string, email: string, employees: IEmployee[]) {\n        super(name, email);\n\
    \        this.employees = employees;\n    }\n    public work(tasks: string[])\
    \ {\n        for (var i = 0; i < this.employees.length; i++) {\n            for\
    \ (var j = 0; j < tasks.length; j++) {\n                this.employees[i].work([tasks[j]]);\n\
    \            }\n        }\n    }\n}\n```\n```\n\nIn this example, you can see\
    \ that we have two classes. First, a generic Employee class that represents the\
    \ base class for any employee within an organization. This employee has a few\
    \ properties such as a name and an e-mail address to contact them with. Then,\
    \ second, there is a very simple method that allows the employee to be passed\
    \ a list of tasks, and this task list will be executed sequentially until all\
    \ of the tasks are complete. The next class is the Manager class, which is a subclass\
    \ of Employee. The manager has all of the same functions as a normal employee,\
    \ they just also have a list of employees that they are responsible for. The manager\
    \ is handed a list of tasks, and rather than performing each one explicitly, it\
    \ will delegate each task to each of its employees for execution. If we were to\
    \ add or remove parameters from the work method, then the call signatures would\
    \ be different between the subclass and superclass and would break the Liskov\
    \ substitution principle. TypeScript will not stop you from changing the method\
    \ signature, however, it will make your code harder to manage."
  merge: -1
