    \ the draw method. As you can see, we wrapped the call to the draw method in two\
    \ calls to the context object: save and restore.\n\nThese methods are used to\
    \ persist the context’s drawing state from before the specific drawing shape changes\
    \ it and revert to this state after it completes. With these methods alone, we\
