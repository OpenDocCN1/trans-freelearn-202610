    \ of attempting to compile the preceding code:\n\n![](img/83a7f7e1723158e56008cf70304a8da4_118_0.png)\n\
    \nEnforcing types upon our code will not only help us to ensure we write solid\
    \ code, but it will help anyone attempting to consume it on an API level or understand\
    \ the intent of the code. Strongly typing our objects helps others know what they\
    \ are working with.\nHowever, you don’t want to have to provide all of your TypeScript\
    \ source files to anyone consuming your code as an API. For this reason, TypeScript\
    \ has created another language construct that will provide type information to\
    \ consumers without providing any implementation details. This type information\
    \ is placed into a declaration file, which can then be distributed along with\
    \ the combined and minified JavaScript file that can be used at runtime. In the\
    \ next segment of code, there is a module that is reusable and can be deployed\
    \ for any JavaScript code to call:\n\n```\nmodule MyNamespace {\n    export interface\
    \ IClass {\n        Id: string;\n        DoSomething();\n    }\n    export class\
    \ MyClass implements IClass {\n        constructor(public Id: string = Date.now().toString())\
    \ {\n        }\n        public DoSomething() {\n            alert(this.Id);\n\
    \        }\n    }\n}\n```\n\nThis module can be consumed by other TypeScript files\
    \ that are aware where the source file is. However, someone consuming only a JavaScript\
    \ file will be unable to interact with"
