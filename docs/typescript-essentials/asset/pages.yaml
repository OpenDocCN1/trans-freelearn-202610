    \ to the following:\n\n```\n```typescript\npublic resize(height: number, width:\
    \ number, depth: number = 0) {\n    super.resize(height, width);\n    this.depth\
    \ = depth;\n}\n```\n```\n\nThis parameter must be optional, otherwise we risk\
    \ breaking the Liskov Substitution Principle that we discussed earlier in this\
    \ chapter; however, we want to ensure it has a valid value if it is not provided\
