  md: "our objects in a strongly typed fashion. If we provide the declaration file\
    \ to our consumers though, they can use our objects as if they existed inside\
    \ of their own code base. To generate the declaration file for a TypeScript file,\
    \ run the command shown in the following screenshot:\n\n![](img/83a7f7e1723158e56008cf70304a8da4_119_0.png)\n\
    \nDuring the compilation process, the type information for our module will be\
    \ extracted into a new file that will be output alongside the resulting JavaScript\
    \ file. It will have the format `<filename>.d.ts` and will be treated by any TypeScript\
    \ compiler as a collection of type definitions. Attempting to place execution\
    \ code in a declaration file will result in an error. The file generated from\
    \ our module is as follows:\n\n```\ndeclare module MyNamespace {\n    interface\
    \ IClass {\n        Id: string;\n        DoSomething(): any;\n    }\n    class\
    \ MyClass implements IClass {\n        public Id: string;\n        constructor(Id?:\
    \ string);\n        public DoSomething(): void;\n    }\n}\n```\n\nAs you can see,\
    \ all of the type information is present but the implementation details have been\
    \ left out. We will discuss these more in detail later when we start integrating\
    \ other libraries such as jQuery.\n\nThe final compiler option allows us to pass\
    \ a text file as the parameter to the compiler. This text file can contain the\
    \ list of parameters for the compiler and all of the files for compilation, allowing\
    \ us to bypass command line restrictions. This is the work-around to the buffer\
    \ limit in the command line. In the following screenshot, you can see a text file\
    \ that has been created to manage our compilation parameters:"
