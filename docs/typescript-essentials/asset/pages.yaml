- pgno: 187
  md: '# # Integrating with jQuery


    jQuery is one of the most popular open source libraries available on the Web.
    It can be used for anything from DOM manipulation to simplifying remote server
    calls. If you plan on building a large scale web application you were probably
    already planning on using jQuery and if not, I strongly recommend that you do.
    To start using jQuery, the first thing we need to do is install the jQuery NuGet
    package. Right-click on the project and select **Manage NuGet Packages**. This
    will bring up a window similar to the updates and extensions window. Locate jQuery
    from the nuget.org repository in the **Online** section and install it. As you
    can see in the following screenshot, several files are installed with this package
    that help us develop with jQuery:


    ![](img/83a7f7e1723158e56008cf70304a8da4_187_0.png)


    Now we can add a script tag the index.html file and jQuery will be available at
    runtime for us to use. This, however, isn’t very useful during development and
    compilation of our TypeScript code because we don’t have any type information
    about the library. To import this type information, we need a declaration file
    that represents the jQuery library. Open up the **Manage NuGet Packages** window
    again and search for jQuery.TypeScript. Install the package named **jquery.TypeScript.DefinitelyTyped**,
    which is on Version 1.3.5 at the time of writing this, to import the type information
    of the jQuery library.


    # ## Tip


    There are a number of other libraries that extend jQuery and quite a few declaration
    files have been created to support these different extensions.


    Now that the type information for jQuery has been included in the project we will
    be able to use the library in a more robust way. Let’s add some elements to our
    HTML that we will manipulate with the jQuery library.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '![](img/83a7f7e1723158e56008cf70304a8da4_188_0.png)


    As you can see, we have added the script tag for jQuery to the document’s head
    tag, and a couple of elements to the body. The first element is a large square
    div with a blue background. The second is a button that the user will click to
    hide the blue div tag that is shown. Now that we have the objects we want to manipulate,
    let’s create some TypeScript to perform the expected operation.


    In order to use jQuery in a strongly typed manner with the TypeScript compiler,
    we must include a reference to the declaration file at the top of the TypeScript
    file we wish to use it in. This is done using a specific format at the top of
    the TypeScript file; placing references anywhere but at the top of the page will
    cause them not to function. In the following example, you can see how to reference
    declaration files:


    ```

    ```typescript

    /// <reference path="scripts/typings/jquery/jquery.d.ts" />

    ```

    ```


    The path included in the reference is relative to the file you are currently working
    in. Once this reference has been added, we are able to use IntelliSense and code
    completion to help us work with the jQuery API.'
