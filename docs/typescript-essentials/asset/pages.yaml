- pgno: 164
  md: "# # The engine\n\nTo handle the drawing and updating of the canvas state, we\
    \ will need a new type that is focused around maintaining this. This type, which\
    \ we’ll call `CanvasEngine`, should have a very simple abstraction since it only\
    \ needs to perform a few basic tasks: drawing the canvas, clearing the canvas,\
    \ and receiving requests to redraw the current frame:\n\n```\ninterface ICanvasEngine\
    \ {\n    invalidate();\n    clear();\n    draw();\n}\n```\n\nThe object will do\
    \ more under the covers, but any object consuming the engine needs only these\
    \ functions to interact with it. Now let’s take a look at the more complex implementation\
    \ of this type. In the following screenshot, you can see the full implementation.\
    \ This will be followed by a breakdown of each public and private method.\n\n\
    ![](img/83a7f7e1723158e56008cf70304a8da4_164_0.png)\n\nAs you can see, we have\
    \ a number of private methods and event handlers that will help us interpret user\
    \ actions. The constructor takes in the canvas we want to work with and a model\
    \ that is responsible for maintaining a list of shapes for the engine to operate\
    \ on. This model has been abstracted the same way the rest of our types have to\
    \ maintain a decoupled application.\n\n```\ninterface IDrawingModel {\n    selection:\
    \ IDrawingShape;\n    shapes: IDrawingShape[];\n    addShape(shape: IDrawingShape);\n\
    \    getNewShape(location: IPoint): IDrawingShape;\n    getDrawingTool(): DrawingToolType;\n\
    }\n```\n\nWe will look at the concrete implementation of this type later, but\
    \ knowing what the"
  merge: -1
  img_proc: true
- pgno: 165
  md: "interface is will allow us to proceed with the engine code. We will start in\
    \ the constructor, then move on to the public methods, and finally look at the\
    \ private user interaction focused methods. As you can see in the following code\
    \ sample, the constructor does a few things to set up not only the engine’s state,\
    \ but also to wire up the event handlers:\n\n```\nconstructor(private _canvas:\
    \ HTMLCanvasElement, private _model: IDrawingModel) {\n    this.ctx = this._canvas.getContext(\"\
    2d\");\n    this._canvas.addEventListener('mousedown', (e) => this._mousedown(e),\
    \ true);\n    this._canvas.addEventListener('mousemove', (e) => this._mousemove(e),\
    \ true);\n    this._canvas.addEventListener('mouseup', (e) => this._mouseup(e),\
    \ true);\n}\n```\n\nThe first thing we do is get the rendering context that we\
    \ will use to manipulate the canvas. This is stored as a private variable and\
    \ will be used throughout the application’s life cycle. The next thing we do is\
    \ wire up the event handlers to the canvas element. We need to perform specific\
    \ actions as the user manipulates objects on the canvas with the mouse. The syntax\
    \ for directing the events towards our private methods looks a little strange\
    \ though. This is not valid JavaScript code, but when it gets compiled it will\
    \ run just fine. The => syntax inside of the constructor tells the TypeScript\
    \ compiler to generate a special representation to the this object in the final\
    \ JavaScript representation. The final JavaScript code will look something similar\
    \ to the following:\n\n```\nfunction CanvasEngine(_canvas, _model) {\n    var\
    \ _this = this;\n    this._canvas.addEventListener('mousedown', function (e) {\n\
    \        return _this._mousedown(e);\n    }, true);\n}\n```\n\nThis ensures that\
    \ when the event listener we are attaching to the canvas is called, we have a\
    \ correct reference to the engine’s instance. Otherwise, we could end up using\
    \ a this object that doesn’t represent the CanvasEngine instance; in this case,\
    \ the DOM element that fired the event and the call to the _mousedown method would\
    \ fail. Now that we have our object being instantiated and events being wired\
    \ up, let’s take a look at the public methods. The clear and Invalidate methods\
    \ are both very simple:\n\n```\npublic clear() {\n    this.ctx.clearRect(0, 0,\
    \ this._canvas.width, this._canvas.height);\n}\npublic invalidate() {\n    window.requestAnimationFrame(()\
    \ => this.draw());\n}\n```\n\nThe clear method overwrites the entire canvas with\
    \ a blank rectangle to remove all existing objects from view. The invalidate method\
    \ makes a call to the draw method to show all of the objects represented by the\
    \ drawing model that was passed in to the constructor. The draw method isn’t much\
    \ more complex than either of these methods"
  merge: -1
  img_proc: true
