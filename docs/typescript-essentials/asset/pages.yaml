  md: "# Abstraction\n\nAbstraction is an incredibly powerful concept in object-oriented\
    \ development. It encompasses the idea of hiding specific implementation details\
    \ while providing the high-level definition of what should be implemented. In\
    \ the previous example, we saw a very basic case of abstraction. The IActivator\
    \ interface creates the abstraction layer needed to handle the concept of activating\
    \ the application. The LocalActivator and ServerActivator types are concrete implementations\
    \ of this abstraction. In other programming languages such as C#, classes are\
    \ able to declare specific members as abstract. This forces any subclasses of\
    \ the base type to provide a concrete implementation of that member. In the following\
    \ code segment, you will see a C# example of this:\n\n```\npublic abstract class\
    \ AbstractBaseClass\n{\n    protected bool isActive = false;\n    public AbstractBaseClass()\n\
    \    {\n    }\n    public abstract bool CheckStatus();\n}\npublic class ConcreteClass\
    \ : AbstractBaseClass\n{\n    public ConcreteClass()\n    {\n    }\n    public\
    \ override bool CheckStatus()\n    {\n        return this.isActive;\n    }\n}\n\
    ```\n\nThe base class provides the declaration for a method called CheckStatus,\
    \ however, no implementation is provided. The implementation is forced upon the\
    \ ConcreteClass type, however, members made available in the base class are available\
    \ to this implementation. The abstract keyword on the CheckStatus method tells\
    \ the compiler that all subclasses of the AbstractBaseClass must implement this\
    \ method or a compile error will be generated. The abstract keyword on the AbstractBaseClass\
    \ will cause the compiler to generate an error if the class is instantiated directly.\
    \ The simplest way to do this in TypeScript is through the use of interfaces,\
    \ however, this does not provide the full functionality that comes from abstract\
    \ classes in C#. The protected member in the base class is not accessible outside\
    \ of the concrete implementations of the type, however if it is placed on a TypeScript\
    \ interface, then it must be made publicly available. Despite the lack of an abstract\
    \ keyword and language construct in TypeScript, we can use certain patterns to\
    \ create a similar implementation:\n\n```\nclass AbstractClass {\n    constructor()\
    \ {\n    }\n    public checkStatus(): boolean {\n        throw new Error(\"Not\
    \ Implemented\");\";\n\n```"
  merge: -1
