  md: "because of the drawing shape abstractions we made earlier.\n\n```\npublic Draw()\
    \ {\n    var shapes: Array<IDraw> = this._model.shapes;\n    this.clear();\n \
    \   if (shapes) {\n        for (var i = 0; i < shapes.length; i++) {\n       \
    \     this.context.save();\n            shapes[i].draw(this.context);\n      \
    \      this.context.restore();\n        }\n    }\n}\n```\n\nIn this method, we\
    \ get a reference to each of the shapes the model wants us to draw and clear the\
    \ canvas of any existing drawings. We then loop through the list of shapes and\
