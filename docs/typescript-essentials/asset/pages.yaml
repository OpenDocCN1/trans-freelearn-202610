  md: '![](img/83a7f7e1723158e56008cf70304a8da4_186_0.png)


    The NuGet packages we will be installing will include the code for the libraries
    we will be using as well as separate declaration files for each of these libraries.
    Not every library has NuGet packages or declaration files associated with them,
    however, the web development community is very good about filling in these holes.
    There is a large repository of TypeScript library declaration files available
    from the **DefinitelyTyped** repository on GitHub.'
