- pgno: 161
  md: "```\n```typescript\nthis.shape.width = to.x - this.location.x;\nthis.shape.height\
    \ = to.y - this.location.y;\n}\n}\n```\n```\n\nThe first method determines whether\
    \ the point parameter resides within the boundaries of the selection zone for\
    \ the drawing object. It will be used to help the engine we build in the next\
    \ section make decisions. For DrawingRectangle, this is the bottom-right corner;\
    \ however, hovering over exactly the right pixel to manage this is fairly difficult.\
    \ This is why there is a selection zone with a configurable size. The ResizeToLocation\
    \ method takes in a point and modifies the properties of the underlying shape\
    \ object to resize it. For the rectangle, this is as simple as taking the difference\
    \ between the incoming point and the current location of the rectangle. The other\
    \ methods of the abstraction are shown in the following code. They are used to\
    \ provide information to the canvas engine so that it can appropriately interact\
    \ with the user.\n\n```\n```typescript\npublic contains(mousePoint: IPoint, context:\
    \ CanvasRenderingContext2D): boolean {\n    if (this.shape.height < 0) {\n   \
    \     this.location.y = this.location.y + this.shape.height;\n        this.shape.height\
    \ = this.shape.height * -1;\n    }\n    if (this.shape.width < 0) {\n        this.location.x\
    \ = this.location.x + this.shape.width;\n        this.shape.width = this.shape.width\
    \ * -1;\n    }\n    return (this.location.x <= mousePoint.x) &&\n        (this.location.x\
    \ + this.shape.width >= mousePoint.x) &&\n        (this.location.y <= mousePoint.y)\
    \ &&\n        (this.location.y + this.shape.height >= mousePoint.y);\n}\npublic\
    \ getMoveOffset(mousePosition: IPoint): IPoint {\n    return new Point(mousePosition.x\
    \ - this.location.x, mousePosition.y - this.location.y);\n}\npublic getCursorType(mousePoint:\
    \ IPoint) {\n    if (this.inResizeZone(mousePoint))\n        return \"se-resize\"\
    ;\n    else\n        return \"move\";\n}\n```\n```\n\nThe contains method does\
    \ a little bit of maintenance on the state of the shape to ensure it performs\
    \ the correct calculations. If the height or width of the rectangle is less than\
    \ zero, then the logic to determine whether the provided point is within the bounds\
    \ of the shape will not perform as expected. getMoveOffset returns the x and y\
