- pgno: 189
  md: "![](img/83a7f7e1723158e56008cf70304a8da4_189_0.png)\n\nAs you can see, we get\
    \ the full feature set associated with Visual Studio’s code completion.\n\n# Tip\n\
    \nWhen integrating with a large number of libraries it can be easier to manage\
    \ your references by creating a `_references.d.ts` file and added references only\
    \ to this file. Then, each of your code files only has to reference the single\
    \ `_references.d.ts` file to import all of the relevant type information for the\
    \ project.\n\nAs you can see in the following code sample, locating objects on\
    \ the DOM and manipulating them is far easier with jQuery included and will reduce\
    \ the amount of code we have to produce to make a dynamic application:\n\n```\n\
    /// <reference path=\"scripts/typings/jquery/jquery.d.ts\" />\n$(document).ready(()\
    \ => {\n    $(\"#hideButton\").click((event) => {\n        $(\"#colorPanel\").hide(1000);\n\
    \    });\n});\n```\n\nThe first element in the file is the reference to the jQuery\
    \ declaration file. This is what allows us to use the $ notation in our TypeScript\
    \ without generating a compiler error, however, jQuery still needs to be loaded\
    \ for this to work at runtime. We wait for the DOM to finish loading, which causes\
    \ the function delegate to be called. At this time, we select the button we added\
    \ to our HTML earlier on and listen for its click event to fire. When this occurs,\
    \ another function delegate is called, which uses one of jQuery’s UI modification\
    \ methods called hide to make the large square div tag disappear over a period\
    \ of 1000 milliseconds. Now if the application is run, there will be a large blue\
    \ square just above the hide button. Once the button is clicked, you can watch\
    \ the blue box disappear and the UI adjust for its disappearance. jQuery has a\
    \ very large set of features and extensions. To learn more about this I recommend\
    \ visiting [http://jquery.com/](http://jquery.com/) for an API reference and samples."
