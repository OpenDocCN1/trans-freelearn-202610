- pgno: 184
  md: '# # Third-party library integration


    One of the key components in large scale web development is the use of open source
    libraries that handle certain tasks for us. jQuery is one of the more popular
    libraries and is used for easy interaction with the **Document Object Model (DOM)**.
    These libraries provide a wide variety of functionalities but all of these interactions
    can be given some level of typing. In this section, we are going to look at the
    following libraries:


    +   - jQuery

    +   - Knockout

    +   - RequireJS


    Before we start developing these libraries, we need to get them referenced in
    our project. Each of these libraries can be downloaded directly from their web
    pages or through the use of NuGet. NuGet is a package manager for Visual Studio
    and can be installed as an extension.'
  merge: -1
  img_proc: true
