- pgno: 51
  md: '# # Command-line compilation


    The TypeScript compiler is nothing more than JavaScript code; it is possible to
    compile your TypeScript anywhere that a JavaScript host exists. Earlier, we saw
    that an executable was provided that allows us to compile our code from the command
    line. We will walk through this first example using this executable and discover
    how simple it is to get going with TypeScript. To get started, let’s create a
    new file on the filesystem and call it `HelloWorld.ts`. The following code creates
    a new HTML paragraph element and sets the text to the value of a pair strings
    concatenated together:


    ```

    ```typescript

    var p = document.createElement(''p'');

    var hello: string = "Hello";

    var world: string = 2;

    p.textContent = hello + " " + world;


    document.body.appendChild(p);

    ```

    ```


    For the most part, this looks like plain old JavaScript. However, if you pay close
    attention to the declaration of the `hello` and `world` variables, you will see
    something new. After the variable names, you will see that they are now given
    the type of `string`. This type annotation tells the compiler to always treat
    the variables `hello` and `world` as strings; however, in this case, the compiler
    can infer these types from their initial values. Every other reference to these
    variables will be able to assume that all of the properties and methods of an
    object of the type `string` will be accessible. This allows IDEs to provide intelligent
    code completion as well as visually alert us if we are performing an action that
    the compiler is going to fail on. Now let’s verify that this code compiles and
    analyze the JavaScript that the compiler outputs.


    # ## Tip


    # ### Downloading the example code


    You can download the example code files for all Packt books you have purchased
    from your account at [http://www.packtpub.com](http://www.packtpub.com). If you
    purchased this book elsewhere, you can visit [http://www.packtpub.com/support](http://www.packtpub.com/support)
    and register to have the files e-mailed directly to you.


    Launch an instance of the command prompt and browse to the directory where you
    created the `HelloWorld.ts` file. From here, running the compiler is as simple
    as typing the following:


    ```

    ```text

    tsc HelloWorld.ts

    ```

    ```


    This generates the following output:


    ```

    ```text

    C:\HelloWorld>tsc HelloWorld.ts

    C:/HelloWorld/HelloWorld.ts(5,1): error TS2011: Cannot convert ''number'' to ''string''.

    ```

    ```


    As you can see, the compiler recognizes that we typed the `world` variable as
    `string` and'
  merge: -1
  img_proc: true
