  md: '# Making the application interactive


    Now we have the ability to make any number of shapes and present them to the user.
    This, however, is very limited in functionality and doesn’t allow for any interaction
    between the application and the consumer. Most drawing applications allow for
    basic movement and resizing of the objects on the canvas. This requires the application
