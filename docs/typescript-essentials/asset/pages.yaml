  md: "# Source maps\n\nNext, we will look at source maps and how they allow us to\
    \ step through our TypeScript code rather than just the generated JavaScript.\
    \ Source maps are a useful tool created to help debug code that has already been\
    \ combined and minified. TypeScript and Visual Studio take advantage of this by\
    \ providing source maps that direct back to the original TypeScript files. The\
    \ `--sourcemap` parameter tells the compiler to generate a map file for each JavaScript\
    \ file generated. This map file is then used to help map each line segment of\
    \ minified or combined code back to a non-minified file that is easier to debug.\
    \ The map file generated by the TypeScript compiler will point the mappings to\
    \ the original TypeScript files associated with the code being run.\n\nThe following\
    \ screenshot shows how to generate source maps during compilation:\n\n![](img/83a7f7e1723158e56008cf70304a8da4_114_0.png)\n\
