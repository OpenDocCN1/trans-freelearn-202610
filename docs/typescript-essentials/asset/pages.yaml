  md: "# Mouse events\n\nThe first action involved in any interaction between one\
    \ of our shapes and the mouse will be a selection event. This will be handled\
    \ by the mousedown event associated with the canvas. This will allow us to use\
    \ the click and hold functionality as well as additional functionality when the\
    \ mouse is released. The mousedown event handler is shown in the following example:\n\
    \n```\nprivate _mousedown(e) {\n    var mouse: IPoint = this._getMousePosition(this._canvas,\
    \ e);\n    var i, shape;\n    if (this._model.shapes) {\n        for (i = this._model.shapes.length\
    \ - 1; i >= 0; i--) {\n            this._model.shapes[i].isSelected = false;\n\
    \        }\n    }\n    if (this._model.getDrawingTool() != DrawingToolType.Select)\
    \ {\n        shape = this._model.getNewShape(mouse);\n        this._model.addShape(shape);\n\
    \        this.action = CanvasEngineAction.Resize;\n        this._setShapeAsSelected(shape);\n\
    \        return;\n    }\n    else if (this._model.shapes) {\n        for (i =\
    \ this._model.shapes.length - 1; i >= 0; i--) {\n            this.action =\n \
    \           this._model.Shapes[i].getClickLocationAction(mouse, this.context);\n\
    \            switch (this.action) {\n                case CanvasEngineAction.Resize:\n\
    \                case CanvasEngineAction.Move:\n                    var moveOffsetPoint\
    \ =\n                    this._model.shapes[i].getMoveOffset(mouse);\n       \
    \             this._dragOffsetX = moveOffsetPoint.X;\n                    this._dragOffsetY\
    \ = moveOffsetPoint.Y;\n                    this._setShapeAsSelected(this._model.shapes[i]);\n\
    \                    this._bringToFront(i);\n                    return;\n   \
    \             default:\n                    break;\n            }\n        }\n\
    \    }\n    this._clearEngineState();\n}\n```\n\nThis method starts by getting\
    \ the point location of the mouse in relation to the canvas. Then, each shape\
    \ is set to unselected. If the model tells us that the drawing tool is something\
