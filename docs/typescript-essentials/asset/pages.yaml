- pgno: 249
  md: '# Summary


    In this chapter, we discussed the final pieces of TypeScript development. We discussed
    source maps and how TypeScript uses them to map output JavaScript files back to
    the original TypeScript file, allowing us to step through our code before compilation.
    We looked at the different environments in which we could debug our code, whether
    it be in the browser or the IDE. Finally, we looked at test-driven development
    and how it allows us to catch errors and unexpected functionality in a reusable
    and consistent manner. We discussed a large number of topics in a short period
    of time:


    +   - Working with the compiler

    +   - TypeScript’s language constructs

    +   - Object-oriented development with TypeScript

    +   - Asynchronous module definitions

    +   - Integrating with external libraries

    +   - Test-driven development


    We built a drawing application using each of these different topics and refined
    it as our needs changed and knowledge increased. You are now capable of starting
    a new application in TypeScript and taking it from initial requirements to a polished
    final product.'
