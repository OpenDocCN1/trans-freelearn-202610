    ></script>\n    <script src=\"Scripts/knockout-3.1.0.debug.js\"></script>\n  \
    \  <script data-main=\"app.js\" src=\"Scripts/require.js\"></script>\n</head>\n\
    <body>\n    <h1>TypeScript HTML App</h1>\n    <div id=\"content\">\n        <div>\n\
    \            <div>\n                <div>\n                    <label>First Name:\
    \ </label>\n                    <input type=\"text\" data-bind=\"value: newFirstName\"\
    \ />\n                </div>\n                <div>\n                    <label>Last\
    \ Name: </label>\n                    <input type=\"text\" data-bind=\"value:\
    \ newLastName\" />\n                </div>\n                <div>\n          \
    \          <label>Age: </label>\n                    <input type=\"number\" data-bind=\"\
    value: newAge\" />\n                </div>\n            </div>\n            <button\
    \ data-bind=\"click: addNewPerson\">Add New</button>\n        </div>\n       \
    \ <input type=\"text\" data-bind=\"value: searchValue\" />\n        <button data-bind=\"\
    click: findPersonByFirstName\">Search</button>\n        <div data-bind=\"foreach:\
    \ searchResult\">\n            <div>\n                <label data-bind=\"text:\
    \ firstName\"></label>\n                <label data-bind=\"text: lastName\"></label>\n\
    \                <label data-bind=\"text: age\"></label>\n            </div>\n\
    \        </div>\n    </div>\n</body>\n</html>\n```\n```\n\nWe include the references\
    \ to jQuery and Knockout that will sit on the global namespace and then we have\
    \ a script tag for require. Included in the tag for require is a binding called\
    \ `data-main` that is used to define the entry point for the application.\n\n\
    # Note\n\nFor more information regarding RequireJS please visit [http://requirejs.org/](http://requirejs.org/).\n\
    \nIn the body of the HTML, we have labels and inputs defining our UI and binding\
    \ to each of the different objects in our view model. The search results section\
    \ is doing something new that is worth noting. Using the `foreach` binding on\
