- pgno: 93
  md: "Let’s take a look at some of the different ways to define namespaces and create\
    \ module definitions.\n\n```\n```typescript\nmodule Animals {\n    export module\
    \ Reptiles {\n        export var snake = \"snake\";\n    }\n}\nmodule Animals.Mammals\
    \ {\n    export var monkey = \"monkey\";\n}\n```\n```\n\nIn this example, we create\
