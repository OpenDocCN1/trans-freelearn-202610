  md: "```\nenumerable: true,\n    configurable: true\n});\n    return Bounds;\n})();\n\
    ```\n\nThere are a few other notables from this output to consider. We created\
    \ new private variables to store the values being surfaced by our property declarations.\
    \ These private variables are being added to each instance of the object in the\
    \ constructor. This seems a little strange since we know that closures can store\
    \ a private state for each instance of the class. The reason that private variables\
    \ need to be added to each instance is because the functions and properties are\
    \ attached to the prototype on the class. The prototype does not retain the state\
    \ of the closure and relies on the actual object instance to access its members.\n\
    \nThe IBounds interface is still upheld after converting to properties as well.\
    \ The resulting type information from creating an instance of the class just has\
    \ to match that of the interface for compilation. There is no distinction made\
    \ between whether it is an instance member or a property declaration because they\
    \ are both accessed in the same manner.\n\nWe have covered quite a bit here in\
    \ a very short period of time. Classes are one of the most important concepts\
    \ introduced by TypeScript that help turn JavaScript into an enterprise-level\
    \ development platform. We still have a number of concepts to cover, including\
    \ enums."
