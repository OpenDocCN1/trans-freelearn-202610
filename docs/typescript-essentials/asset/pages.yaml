  md: '# Hello World


    Now that we have the compiler installed, let’s start writing some code. This wouldn’t
    be a good technical book without the inclusion of “Hello World” to get you started
    with writing code in a new language. The code for this particular example is pretty
    simple, but we can use it to demonstrate some of the early benefits of switching
    to TypeScript.'
