- pgno: 55
  md: '# # Creating a new project


    To create a new project that includes TypeScript, go to the **File** menu and
    navigate to **New Project**. In the **New Project** window, you will see a list
    of installed templates. There is now a new section named **TypeScript**; select
    this section and you will see all of the available project templates that can
    be used to create TypeScript applications.


    # ## Note


    The location of this template may vary depending on the version of Visual Studio
    installed. If the TypeScript section is not available, use the search function
    of the project template selector.


    This does not mean that TypeScript can only be added to these project types—you
    can add TypeScript files to any existing project. For our examples, we will be
    using the **HTML Application with TypeScript** project template, so let’s select
    that and create our new application:


    ![](img/83a7f7e1723158e56008cf70304a8da4_55_0.png)


    Once the project has been created you will notice a few things right away. First,
    a default TypeScript file and HTML file have been created to host our new application.
    There is also a `web.config` and CSS file to host your application styles. All
    of these elements should seem pretty familiar to you, except the TypeScript file,
    which is there in place of a JavaScript file.


    Now that our project has been created we need to move our code in. Copy the code
    from `HelloWorld.ts` into `app.ts` and do the same with the HTML that was generated.
    Change the script tag’s source attribute to `app.js` to reference the new location
    of our code and run the application. The output displayed should be the same.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Build options


    Visual Studio has provided a seamless integration with TypeScript and provides
    a large variety of configuration options. Let’s take a look at the project build
    options first and get a feel for the different things that TypeScript can generate
    when it is being compiled. To find the build options, right-click on the project
    in the solution explorer and select Properties from the context menu. As you can
    see in the following screenshot, we are able to manipulate a large number of the
    compiler options we saw earlier:


    ![](img/83a7f7e1723158e56008cf70304a8da4_56_0.png)


    From the build settings you can see that we have the ability to change which version
    of JavaScript we want to compile our TypeScript into: ECMAScript 5 or ECMAScript
    3.


    # Tip


    JavaScript is now formally known as ECMAScript but it is still commonly referred
    to as its original name.


    You also have the option for compiling TypeScript files when you save changes
    to them. This is a helpful option because when a TypeScript file is compiled so
    are all other TypeScript files that it references. This is a helpful feature when
    you have only a few files'
  merge: -1
