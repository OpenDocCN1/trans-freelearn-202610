    As you can see, the expression provided to the computed member is built directly
    into the enum declaration generated. This expression will be evaluated at runtime
    but only when ShapeType is initialized. Once the expression has been run, the
    result will remain a member of the ShapeType object. Therefore, in the preceding
    example ShapeType.Random is equivalent to ShapeType.Random as long as the ShapeType
    enum stays in memory. You may be wondering right now what the usefulness is of
    being able to change the constant members’ numeric sequence.


    The one piece of information we haven’t covered on enums so far is that their
    definitions can be merged. If two enum declarations are placed in different segments
    of code with the same type name they will contribute to the same object. You can
    see this in the last line of the enum declaration in the resulting JavaScript.
    If the object exists then each new property is added to the existing object; otherwise,
    a new object is created and the properties are applied.'
