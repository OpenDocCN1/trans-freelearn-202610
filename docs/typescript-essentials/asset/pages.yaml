  md: 'whether or not the code should be minified.


    # Note


    For more information about the r.js optimizer, please visit http://requirejs.org/docs/optimization.html.


    For the sake of readability, we will leave it at none for now. When we actually
    want to deploy our code, we can simply comment this option out and all of our
    code will be placed on a single line in a single file. The final thing we must
    do to generate our optimized JavaScript output file is create a simple PowerShell
    script that will run the optimizer and provide our options:


    ```

    cls

    write-host ''-Building Drawing Application''

    node Scripts/r.js -o buildSingleFile.js

    ```


    In this script, we clear the current screen, log some output, and finally use
    Node.js to run the RequireJS optimizer. If everything goes as expected, the optimizer
    will provide tracing output, letting us know that all of the modules required
    for our application to work have been included in the optimization. The following
    screenshot shows the output of running our script and as you can see all of the
    JavaScript dependencies have been included in the build:


    ![](img/83a7f7e1723158e56008cf70304a8da4_223_0.png)


    The final piece of this process is modifying our HTML page to point at the resulting
    output file. Before we can do this, we must understand the output from the PowerShell
    script we just ran. As we discussed earlier, there are three parameters for AMD
    modules;'
