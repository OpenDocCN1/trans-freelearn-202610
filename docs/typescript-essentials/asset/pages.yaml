    \ object’s API.\n\n# Note\n\nThe HTML5 canvas object has a very robust API; for\
    \ the full list of what it is capable of, visit http://www.w3schools.com/tags/ref_canvas.asp.\n\
    \nThe first thing we do is set the color that we want our rectangle to be; this\
