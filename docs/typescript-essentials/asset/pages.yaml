- pgno: 82
  md: "# Properties\n\nIn ECMAScript 5, the concept of properties was introduced.\
    \ This allows a developer to create getter and setter methods for a designated\
    \ instance method that can be accessed like properties. If you have your TypeScript\
    \ project set to compile ECMAScript 5, then you will be able to use the get and\
    \ set keywords to define properties according to the ECMAScript 5 language specification.\
    \ The ECMAScript version can be changed in the General settings of the TypeScript\
    \ Build section of the project properties as shown in the following screenshot:\n\
    \n![](img/83a7f7e1723158e56008cf70304a8da4_82_0.png)\n\nLet’s modify our bounds\
    \ class to treat both Height and Width as object properties rather than simple\
    \ instance members and create both getter and setter methods for them both. The\
    \ getters and setters will modify private instance members too, which will maintain\
    \ the actual value. It is common practice in JavaScript to name private instance\
    \ members with a leading underscore, so we will create _height and _width instance\
    \ members for the Bounds class to access internally.\n\nSince we now have a method\
    \ block in which we can execute some code we should also provide some value checking\
    \ to ensure correct program execution. The height and width of an object should\
    \ never be less than zero so let’s verify that the values being assigned to them\
    \ fit this constraint; if not, we will set the value to zero manually:\n\n```\n\
    interface IBounds {\n    Location: IPoint;\n    Height: number;\n    Width: number;\n\
    \    Size(): number;\n}\nclass Bounds implements IBounds {\n    public Location:\
    \ IPoint = new Point(0, 0);\n    private _height: number = 0;\n    private _width:\
    \ number = 0;\n    public Size() {\n        return this.Height * this.Width;\n\
    \    }\n\n    get Height(): number {\n        return this._height;\n    }\n  \
    \  set Height(value: number) {\n        this._height = (value > 0) ? value : 0;\n\
    \    }\n```"
  merge: -1
  img_proc: true
- pgno: 83
  md: "```\n```javascript\nget Width(): number {\n    return this._width;\n}\nset\
    \ Width(value: number) {\n    this._width = (value > 0) ? value : 0;\n}\n}\n```\n\
    ```\n\nAs you can see, we now have method blocks wrapping the access of the Height\
    \ and Width properties. The properties are still accessed as if they were instance\
    \ variables as you can see from the Size method, however, our function blocks\
    \ are executed when we access them. The resulting JavaScript calls the Object.defineProperty\
    \ method, outlined in the ECMAScript 5 standard, when the type is created.\n\n\
    # Note\n\nWhile the ECMAScript 5 standard has been widely adopted by most browsers,\
    \ it is important to note that there are some lapses in feature support in certain\
    \ browsers. The table found at the following link outlines the current support\
    \ for the ECMAScript 5 standard: [http://kangax.github.io/compat-table/es5/](http://kangax.github.io/compat-table/es5/).\n\
    \nThis places a new object on the prototype that is accessible on all instances\
    \ of that type. The following JavaScript is what is generated by defining getters\
    \ and setters in TypeScript:\n\n```\n```javascript\nvar Bounds = (function ()\
    \ {\n    function Bounds() {\n        this.Location = new Point(0, 0);\n     \
    \   this._height = 0;\n        this._width = 0;\n    }\n    Bounds.prototype.Size\
    \ = function () {\n        return this.Height * this.Width;\n    };\n\n    Object.defineProperty(Bounds.prototype,\
    \ \"Height\", {\n        get: function () {\n            return this._height;\n\
    \        },\n        set: function (value) {\n            this._height = (value\
    \ > 0) ? value : 0;\n        },\n        enumerable: true,\n        configurable:\
    \ true\n    });\n\n    Object.defineProperty(Bounds.prototype, \"Width\", {\n\
    \        get: function () {\n            return this._width;\n        },\n   \
    \     set: function (value) {\n            this._width = (value > 0) ? value :\
    \ 0;\n        },\n```\n```"
