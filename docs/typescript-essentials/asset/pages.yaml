  md: "# Using RequireJS\n\nIn Chapter 2, *TypeScript Basics*, we discussed module\
    \ definitions but at the time we only focused on internal modules. At the time,\
    \ external modules were mentioned but we did not explore them in-depth. Now that\
    \ we are familiar with integrating external libraries we will bring in one of\
    \ the more common external module libraries available. RequireJS is a JavaScript\
    \ module loader used to ensure that all objects being used during application\
    \ execution are available when necessary. This will allow us to separate our code\
    \ into different files and not worry about the order in which they are loaded\
    \ because RequireJS will manage that for us. Just like jQuery and Knockout, RequireJS\
    \ and its declaration file are available through the NuGet Package Manager or\
    \ can be found online at www.requirejs.org. The packages used for this text are\
    \ “RequireJS” Version 2.1.14 and requires.TypeScript.DefinitelyTyped Version 0.2.0.\
    \ For this next example, we will need all three libraries available. Let’s put\
    \ together a simple app that will allow us to add people to a directory and then\
    \ search that directory.\n\nRequireJS is an **Asynchronous Module Loader (AMD)**\
    \ so we need to set the appropriate project settings. Open the TypeScript Build\
    \ section of the project settings and set the Module system option to AMD. Now,\
    \ we need to create a new module that will contain all of the code related to\
    \ a set of types that represent people for the directory. Create a new TypeScript\
    \ file called People.ts in the Scripts folder of the project. As you can see in\
    \ the following sample, we define the IPerson abstraction and then implement it:\n\
    \n```\nexport interface IPerson {\n    firstName: string;\n    lastName: string;\n\
    \    age: number;\n}\nexport class Person implements IPerson {\n    constructor(public\
    \ firstName: string, public lastName: string, public age: number) {\n    }\n}\n\
    ```\n\nBoth the IPerson interface and Person class are decorated with the export\
    \ keyword, which will tell the compiler that these types are available in other\
    \ modules that use this module. The resulting JavaScript is a little different\
    \ from what was generated for internal modules:\n\n```\ndefine([\"require\", \"\
    exports\"], function(require, exports) {\n    (function (People) {\n        var\
    \ Person = (function () {\n            function Person(firstName, lastName, age)\
    \ {\n                this.firstName = firstName;\n                this.lastName\
    \ = lastName;\n                this.age = age;\n            }\n            return\
    \ Person;\n        })();\n        People.Person = Person;\n    })(exports.People\
    \ || (exports.People = {}));\n```"
  merge: -1
  img_proc: true
- pgno: 194
  md: "```\n```typescript\nvar People = exports.People;\n});\n```\n```\n\nAs you can\
    \ see, the normal module definition is wrapped in another function called `define`\
    \ that takes an array of dependent objects and a function to be called when all\
    \ of the dependent modules are loaded. The next thing we need to create is a view\
    \ model that we can bind our HTML to. We will need observables for the three input\
    \ values for new people, the value that we want to search against, and an observable\
    \ array to hold the search results. We will also need a method to initiate the\
    \ addition process and a method to perform a directory search. We can place all\
    \ of this code in a separate TypeScript file and use the `import` and `require`\
    \ keywords to include the People module we just created:\n\n```\n```typescript\n\
    import People = require(\"Scripts/People\");\nexport class PersonFinderViewModel\
    \ {\n    public peopleArray: KnockoutObservableArray<People.IPerson> = ko.observableArray([]);\n\
    \    public newFirstName: KnockoutObservable<string> = ko.observable(\"\");\n\
    \    public newLastName: KnockoutObservable<string> = ko.observable(\"\");\n \
    \   public newAge: KnockoutObservable<number> = ko.observable(null);\n    public\
    \ searchValue: KnockoutObservable<string> = ko.observable(\"\");\n    public searchResult:\
    \ KnockoutObservableArray<People.IPerson> = ko.observableArray([]);\n    constructor()\
    \ {\n    }\n    public findPersonByFirstName(viewModel: PersonFinderViewModel,\
    \ event: JQueryEventObject) {\n        var people = this.peopleArray();\n    \
    \    var searchValue = this.searchValue();\n        this.searchResult([]);\n \
    \       for (var i = 0; i < people.length; i++) {\n            if (searchValue\
    \ === people[i].firstName) {\n                this.searchResult.push(people[i]);\n\
    \            }\n        }\n    }\n    public addNewPerson(viewModel: PersonFinderViewModel,\
    \ event: JQueryEventObject) {\n        var newPerson = new People.Person(this.newFirstName(),\
    \ this.newLastName(), this.newAge());\n        this.peopleArray.push(newPerson);\n\
    \        this.newFirstName(\"\");\n        this.newLastName(\"\");\n        this.newAge(null);\n\
    \    }\n}\n```\n```\n\nAs you can see, we provide the path to the People module\
    \ to the require function, which tells RequireJS to add the module to the list\
    \ of modules given to the define method, but also the TypeScript compiler for\
    \ type information. We define a list of people that will be stored as the full\
    \ directory list, the new people field observables, the search observables, and\
    \ the two methods that will be bound to click events. The `findPersonByFirstName`\
    \ method retrieves the most recent value of the `searchValue` observable as well\
    \ as the list of people that we will be searching against."
