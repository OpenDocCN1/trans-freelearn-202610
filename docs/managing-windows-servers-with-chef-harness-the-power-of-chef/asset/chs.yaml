  \n## 问题\n\n如果你在本书的任何方面遇到问题，可以通过 questions@packtpub.com 联系我们，我们将尽力解决。\n"
- "# 1 Chef 和 Windows\n\n如果你正在阅读本书，推测你已经熟悉 Chef，至少在概念上，并且你有一些需要管理的基于 Windows 的系统。如果你使用\
  \ Chef 管理过一些基于 Linux 的系统，或者与 chef-solo 交互过以管理虚拟机，你将准备好立即开始。如果没有，不用担心——有大量的解释和示例可以让你感到宾至如归。\n\
  \n如果你需要帮助安装 Chef 服务器，有许多其他资源可供你使用，或者你可以注册托管 Chef 的免费层级，无需管理自己的服务器即可立即开始。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 使用 Chef 和 Microsoft Windows\n- 集成 Chef 和 Windows 的方式\n- 支持的平台和技术\n\n## 使用 Windows\n\
  \n对于初学者来说，Chef 的客户端组件是用 Ruby 编写的，这是一种非常流行的语言。由于 Ruby 的跨平台特性，对 Windows 的支持与对 Linux\
  \ 和类 UNIX 系统的支持一样直接，并且已经存在相当长一段时间，可以追溯到大约 2011 年发布的 **knife-windows** gem。\n\n\n\
  \n\n\nChef 在客户端系统上使用 Ruby 作为脚本语言，因此只要 Ruby 支持的地方，Chef 就能运行。仅凭这一点，Chef 就成为管理多种操作系统组合的非常强大的工具。Chef\
  \ 更进一步，提供了一种**领域特定语言 (DSL)**，使得编写用于与 Windows 主机交互的配方看起来与 UNIX 类平台毫无二致。除了某些资源名称和路径以及\
  \ Windows 特定资源（如 Windows 注册表）的存在之外，配方几乎可以与任一平台直接兼容。这意味着，现有的大量 Chef 配方书和配方几乎无需修改即可使用。\n\
  \n还需要注意的是，虽然许多讨论集中在服务器管理、云端扩展等方面，但 Chef 并非仅用于管理服务器；它也可以用于管理客户端工作站。利用可用资源，你可以同样轻松地安装和配置桌面应用程序、导入注册表设置、管理用户、设置打印机等等。\n\
  \n### 与最终主机交互\n\nLinux 类系统可以通过 SSH 执行命令，而 Windows 平台有一个名为 **Windows Remote Management\
  \ (WinRM)** 的额外机制。就像你会使用 `knife ssh` 来管理 Linux 系统一样，`knife winrm` 可用于使用 WinRM 协议远程在\
  \ Windows 主机上执行命令。\n\n例如，有人可能会执行以下命令来连接到 Linux 主机：\n\n```\nknife ssh \"role:mysql\"\
  \ \"chef-client\" --sudo -x ubuntu\n```\n\n以下命令将以相同的角色连接到 Windows 主机：\n\n```\nknife\
  \ winrm \"role:mysql\" \"chef-client\" -x Administrator\n```\n\n如你所见，`winrm` 子命令支持在匹配所提供搜索条件的任意数量主机上执行命令，这与\
  \ `ssh` 子命令完全一样。尽管与主机通信的协议可能不同，但通过 `knife` 与它们交互的机制保持一致。\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_16_0.png)\n\
  \n### 引导 Windows 主机\n\n引导主机旨在为主机做好准备，并完成与 Chef 服务（无论是你自己的 Chef 服务器还是托管安装）的注册。正在引导的主机通常只包含一个裸机操作系统安装；不过，也可以引导已有软件配置的主机。引导脚本负责执行以下功能：\n\
  \n- 安装 Ruby 1.8.7 及 RubyGems\n- 安装 RubyInstaller 开发工具包 (DevKit)\n- 安装支持 Chef 的 Windows\
  \ 特定 gem\n- 从 RubyGems.org 安装 Chef\n- 将验证密钥写入 `C:\\\\chef\\\\validation.pem`\n-\
  \ 可选地写出加密数据包密钥\n- 在 `C:\\\\chef\\\\client.rb` 中写出 Chef 的默认配置文件\n- 在 `C:\\\\chef\\\
  \\first-boot.json` 中创建初始运行列表 JSON 文件\n- 首次运行 `chef-client` 以将节点注册到 Chef\n\n使用 Windows\
  \ 远程管理协议引导 Windows 主机的示例可能如下命令所示：\n\n```\nknife bootstrap windows winrm windowshost.domain.com\
  \ -x Administrator\n```\n\n此命令将通过 Windows 远程管理协议以 Administrator 身份连接到 `windowshost.domain.com`，然后运行\
  \ Windows 引导脚本中的命令。要查看正在运行的命令的完整列表，可以在 `https://github.com/opscode/knife-windows/blob/master/lib/chef/knife/bootstrap`\
  \ 找到 Windows 引导脚本。\n\n### 与云提供商一起扩展\n\n通过将自动引导 Windows 系统的能力与提供 Windows 虚拟主机的提供商相结合，你可以轻松地将云服务器集成到基础架构中。Chef\
  \ 已支持使用 Azure、AWS 和 Rackspace API 来管理云基础架构，包括自动启动、停止和配置这些服务的新实例。如果你使用的服务目前不受支持，完全有可能开发一个插件来提供与该提供商的集成。通过\
  \ Chef，你可以轻松管理一组现场和非现场主机，包括物理服务器和虚拟服务器的混合。这意味着当你需要时，可以在更短的时间内启动新服务器，并在不使用时将其删除，从而节省时间和金钱。\n\
  \n### 使用 PowerShell 进行脚本编写\n\n现代 Windows 系统自带 PowerShell 运行时，这是一个与系统交互的极其强大的工具。自然而然地，由于\
  \ Chef 是一种面向开发者的系统管理方式，编写在最终主机上执行的脚本是扩展 Chef 功能的一种便捷且灵活的方式。Chef 提供了一种在 Windows 上执行\
  \ PowerShell 脚本的机制，就像它支持在 Linux 主机上运行 Bash 脚本一样。一个非常简单的示例可能是以下 PowerShell 脚本，它将一行文本写入文件：\n\
  \n```\npowershell \"say-hello\" do\n  code <<-EOH\n    $stream = [System.IO.StreamWriter]\
  \ \"C:\\\\hello.txt\"\n    $stream.WriteLine(\"Hello world!\")\n    $stream.Close()\n\
  \  EOH\nend\n```\n\n前面的代码允许你在配方中通过执行在受管系统上定义的脚本来充分发挥 PowerShell 的全部功能。这些脚本甚至可以从配方中的配置数据和其他变量动态生成。\n\
  \n### 与 Linux 类系统集成\n\n随着时间的推移，拥有异构网络变得越来越常见。某些软件要么不存在，要么在一个平台上的支持不如在另一个平台上好。因此，管理员会遇到需要部署和管理并行运行多种操作系统的主机的情况。集成\
  \ Windows 和 Linux 类系统伴随着其自身的一系列挑战，Chef 通过提供一种与 Linux 和 Windows 类系统交互的一致方式来帮助解决这些问题。\n\
  \n对于管理此类基础架构（具体来说，是运行 Windows 和 Linux 组合的系统集合）的任何人来说，Chef 有一些惊人的功能。因为它能够使用相同的声明语言和配置数据来对\
  \ Windows 和 Linux 系统进行建模，你可以使用同一工具轻松配置 Linux 和 Windows 系统。\n\n例如，你可以拥有一个配方书，其中包含一个配置网络主机防火墙的配方。该配方可以搜索\
  \ Chef 的配置数据，查找网络中所有其他主机，收集它们的 IP 地址列表，并打开通往所有这些 IP 地址的流量。如果你配置了一个新主机，所有受管主机都会自动了解新主机并添加一条新的防火墙规则。此外，因为\
  \ Chef 提供了自己的声明语言来隐藏实现细节，你可以专注于想要实现的目标，而不是如何实现它。Chef 知道它正在运行的平台，以及如何加载资源的特定于系统的实现，例如网络接口、防火墙、用户、文件等。完全有可能编写配方来安装\
  \ Apache 或 MySQL，这些配方可以在 Linux 和 Windows 平台上工作。\n\n这使得集成任意数量的 Windows 和 Linux 系统变得更加容易，而无需维护多套脚本来实现相同的最终目标。例如，假设你同时拥有\
  \ Windows 和 Linux 的防火墙配方书，那么可以编写类似于以下的配方：\n\n```\nsearch(:node, 'role:web_server').each\
  \ do |node|\n  ip = node[:external_ip]\n  firewall_rule \"#{ip}\" do\n    source\
  \ \"#{ip}\"\n    action :allow\n  end\nend\n```\n\n在前面的代码中，我们正在搜索所有具有 web_server\
  \ 角色的节点，并调用 firewall_rule 资源以允许来自该源的流量。请注意，配方并未引用 Windows 防火墙软件或 Linux 的防火墙工具 iptables。相反，Chef\
  \ 的自定义语言允许我们描述我们正在做什么，而不是如何实现我们的目标。“如何”在提供程序中实现，“什么”由资源描述，两者都在我们的防火墙配方书中提供。\n\n\n\
  \n\n\n### 使用 Windows 特定资源\n\nChef 在 Windows 系统中提供了一些特定于 Windows 的资源。Chef 可以自动确定正在执行配方的主机类型，并根据主机类型执行不同的操作。例如，安装特定软件包（如\
  \ MySQL）在不同主机之间可能大体相同，但在 Windows 系统中可能需要略有不同的设置或需要存储注册表设置。特定于 Windows 的一些资源包括以下内容：\n\
  \n- Batch 脚本\n- PowerShell 脚本\n- Autorun 脚本\n- 软件包（MSI、安装程序等）\n- 打印机\n- Windows\
  \ 注册表\n- 网络路径\n- 系统任务\n\n### 支持的平台\n\nChef for Windows 支持编写时的最近版本的 Windows。这包括以下内容（但也可能适用于其他较新的版本）：\n\
  \n- Windows Server 2003 R2\n- Windows Server 2008\n- Windows 8\n- Windows 7\n- Windows\
  \ Vista\n\n### 摘要\n\n如您所见，Chef 为 Windows 管理员提供了许多功能，无论是管理仅限于 Windows 的基础设施，还是管理异构的\
  \ Windows 和 Linux 基础设施。\n\n现在您已经了解了在管理 Windows 系统时 Chef 可以为您带来的好处，让我们在下一章中了解如何安装客户端以及它如何融入\
  \ Chef 生态系统的整体架构。\n"
- "# 2 安装客户端 – Chef 概念概述\n\n与所有指南一样，旅程必须从某处开始。在本章中，我们将从头开始，介绍在 Windows 上使用 Chef 的一些重要信息。它包含一些您可能已经了解的材料的简要回顾（如果您之前使用过\
  \ Chef），然后我们继续介绍如何将 Chef 安装到 Windows 主机上。\n\n在本章中，我们将涵盖以下主题：\n\n- 回顾关键 Chef 术语\n\
  - 描述整体 Chef 系统架构\n- 在 Windows 系统上手动安装 Chef 客户端\n- 使用 Chef 提供的引导脚本安装客户端\n\n## 更好地了解\
  \ Chef\n\n与任何其他技术一样，Chef 有一套自己的术语，用于标识 Chef 生态系统的各种组件。以下是本书中使用的一些关键术语及其定义：\n\n-\
  \ **Node**：节点是由 Chef 管理的系统。这些可以是服务器、桌面系统、路由器或任何能够运行 Chef 客户端并具有受支持操作系统的其他设备。\n-\
  \ **Workstation**：工作站是系统管理员用于与 Chef 服务器和节点交互的特殊节点。这是执行命令行工具的地方，特别是 `knife` 命令行工具。\n\
  - **Bootstrap**：引导是将节点设置为用作 Chef 客户端的过程。这涉及执行安装 Chef 依赖项以及 Chef 本身所需的任何工作。\n- **Bootstrap\
  \ script**：安装 Chef、Ruby 和其他核心要求以及针对特定系统所需的任何其他配置有多种可能的方式。为了提供这种灵活性，引导过程是脚本化的；在 Windows\
  \ 上，这是一个批处理文件。\n- **Recipe**：配方提供实现目标所需的指令，例如安装软件包、配置防火墙、配置用户和打印机或管理其他系统资源。这些是用\
  \ Ruby 编写的，并在系统管理员通过 Chef 控制台指定的节点上执行。\n- **Cookbook**： cookbook 是配方的集合。通常，cookbook\
  \ 提供一组特定的操作，例如安装 Apache 或 MySQL、为特定软件工具提供 Chef 资源等。\n- **Attributes**：系统的各种组件都有自己的属性；描述软件需要如何配置的属性。这些属性在各种级别定义，从节点特定设置到\
  \ cookbook 或角色的一般默认值。\n- **Role**：角色是一个数据结构，描述应用了该角色的节点应如何配置。它包含要运行的配方列表以及要应用于与该角色关联的节点的配置数据。角色示例可能包括\
  \ MSSQL 服务器、Exchange 服务器、IIS 服务器、文件服务器等。请注意，角色本身对节点一无所知；节点与其角色之间的关联是由管理员通过将角色应用于节点来创建的。\n\
  - **Run list**：“运行列表”是要应用于给定节点的配方列表，按特定顺序。运行列表可以由零个或多个角色或配方组成，顺序很重要，因为运行列表的项目按指定的顺序执行。因此，如果一个配方依赖于另一个配方的执行，您需要确保它们按正确的顺序运行。\n\
  - **Resource**：资源是描述配方正在处理 _什么_ 的方式。资源示例包括文件、目录、打印机、用户、软件包等。资源是提供者中具体实现的抽象。\n- **Provider**：提供者是资源的具体实现。例如，用户是通用资源，但\
  \ LDAP 用户或 Active Directory 用户是用户资源的具体实现。所选提供者的类型将取决于平台等因素。\n- **Data bags**：数据包包含有关基础设施的共享数据。不特定于角色或资源的信息（例如防火墙规则、用户帐户等）将存储在数据包中。这是存储系统范围配置数据的好地方。\n\
  - **Environments**：环境为资源提供了一级封装。例如，您可能有两个相同的环境，一个用于测试，一个用于生产。这些环境可能具有类似的设置，但配置不同，例如\
  \ IP 地址和用户。\n\n### Chef 架构概述\n\nChef 的整体架构中有三个主要参与者：正在被管理的节点（服务器、桌面客户端、路由器等）、系统管理员用于运行\
  \ `knife` 命令的工作站，以及负责存储和管理要应用于最终主机的所有角色、配方和配置数据的 Chef 服务。以下图表表示了 Chef 架构：\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_23_0.png)\n\
  \n节点通过 HTTP（最好是 HTTPS）使用 Chef 客户端安装中提供的 `chef-client` 脚本与 Chef 服务进行通信。这是一个 Ruby\
  \ 脚本，负责连接到配置的 Chef 服务（自托管或使用托管 Chef）并下载为该节点配置的运行列表以及所需的任何 cookbook 和配置数据。完成此操作后，`chef-client`\
  \ 将评估运行列表，以按指定顺序执行配方。\n\n工作站也使用 HTTP(S) 与 Chef 服务进行通信，但其工作略有不同。工作站是系统管理员使用命令行实用程序与存储在\
  \ Chef 服务中的数据进行交互的地方。从那里，管理员可以读取和修改任何系统数据为 JSON，执行搜索，并通过 knife 命令行实用程序与节点进行交互。\n\
  \n除了命令行实用程序外，Chef 还提供了一个基于 Web 的界面来修改系统数据。Web 界面可以执行的任何操作也可以使用 knife 实现；但是，有一些高级操作无法在没有\
  \ knife 的情况下执行，例如在一组主机上执行远程命令和搜索数据。\n\n### 在 Windows 上安装 Chef 客户端\n\n要在 Windows\
  \ 上安装 Chef 客户端，有三个基本选项，如下所示：\n\n1. 使用 knife-windows 插件引导主机，如前所述。\n2. 下载并使用 MSI 安装程序手动安装客户端。\n\
  3. 通过原位更新工具（如 WSUS）部署软件（此机制不会讨论，因为它超出了本书的范围）。\n\n### 准备引导 Windows 主机\n\n如前一章所述，引导主机是安装将主机最初纳入基础设施所需的任何组件的过程。通常，这将涉及安装\
  \ Ruby 以及 Chef 客户端和身份验证所需的任何证书，以及将主机注册到您的 Chef 服务器或托管 Chef 帐户。为此，您需要配置一个已安装 knife-windows\
  \ gem 的工作站。您可以使用以下命令轻松安装该 gem：\n`gem install knife-windows`\n\n\n\n\n> 在 Windows\
  \ 上，您可能需要以管理员身份执行此操作；在 Linux 系统上，如果使用系统 Ruby 安装，则可能需要通过 sudo 执行。\n> 或者，您可能希望使用 Ruby\
  \ 版本管理器（如 RVM、rbenv 或 pik）来安装 Chef 及任何后续 gem。\n> knife-windows gem 在 Ruby 版本大于 1.9\
  \ 时可能存在字符编码问题。如果您遇到如 https://tickets.opscode.com/browse/KNIFE-410 中概述的问题，\n> 请尝试使用\
  \ Ruby 1.9 安装 chef 和 knife-windows gem。（这就是 Ruby 版本管理工具派上用场的地方。）\n\n在进入引导阶段之前，您需要确保\
  \ Windows 主机上已配置以下内容：\n\n- 已启用 Windows 远程管理\n- 您与 Windows 主机之间的任何防火墙都允许 WinRM 流量\n\
  - 您能够通过 WinRM 进行身份验证\n\n### 启用 Windows 远程管理\n\n大多数现代 Windows 服务器操作系统安装默认启用 Windows\
  \ RM，\n但如果尚未启用（或您不确定），您可以通过从命令提示符（以管理员身份）运行以下命令快速配置它：\n\n```\nwinrm quickconfig\n\
  ```\n\n前面的命令执行以下任务：\n\n- 启动 Windows 远程管理服务并将其设置为开机自动启动\n- 为 Windows 远程管理服务定义防火墙规则，并打开\
  \ HTTP 和 HTTPS 端口\n\n### 配置防火墙端口\n\n为了使用 WinRM，端主机上的防火墙需要配置为允许 WinRM 使用的端口的流量。WinRM\
  \ 有两个版本，1.0\n和 2.0；每个版本都有一组不同的默认端口。对于 Windows 远程管理版本 2.0，默认端口如下：\n\n| 协议 | 端口 |\n\
  |----------|------|\n| HTTP     | 5985 |\n| HTTPS    | 5986 |\n\n对于版本 1.0，默认端口如下：\n\
  \n| 协议 | 端口 |\n|----------|------|\n| HTTP     | 80   |\n| HTTPS    | 443  |\n\n\
  ### 启用基本身份验证\n\n要允许从外部通过基本的非加密 HTTP 身份验证对 WinRM 进行身份验证，您需要从命令提示符（而不是通过 PowerShell\
  \ 提示符）运行以下命令：\n\n```\nwinrm set winrm/config/client/auth @{Basic=\"true\"}\nwinrm\
  \ set winrm/config/service/auth @{Basic=\"true\"}\nwinrm set winrm/config/service\
  \ @{AllowUnencrypted=\"true\"}\n```\n\n> 由于这允许未加密的基本 HTTP 身份验证，请不要在公共主机上执行此操作，因为这可能会带来重大的安全风险。\n\
  > 请使用适当定义的策略和 HTTPS 证书来实现更安全的身份验证机制。\n\n### 引导 Windows 主机\n\n一旦 knife-windows gem\
  \ 在工作站上安装，您就可以继续执行引导过程，例如引导 EC2 Windows 主机：\n\n```\nknife bootstrap windows winrm\
  \ ec2-54-204-177-250.compute-1.amazonaws.com\n-x Administrator\n```\n\n在前面的命令中，我们正在执行带有\
  \ bootstrap 命令的 knife 实用程序，指定我们希望通过 Windows 远程管理协议在主机 ec2-54-204-177-250.compute-1.amazonaws.com\
  \ 上使用 Windows 引导脚本，以 Administrator 用户身份（通过 -x 命令行标志）。\n\n这将花费一些时间，因为它需要下载并安装 Chef\
  \ 客户端，然后向 Chef 服务器注册自身。在运行过程中，以下是它正在执行的操作概述：\n\n1. `knife` 命令将从工作站（发起引导的那一台）上位于某个\
  \ ERB 模板的批处理文件进行渲染，并将其写入目标节点上的文件。\n2. 从 ERB 文件模板生成批处理文件后，节点将执行新创建的批处理文件。\n3. 生成的脚本将在节点上下载\
  \ Chef 客户端 MSI 安装程序并执行安装。\n4. 一旦客户端安装成功，`knife` 将存储使主机注册所需的任何文件，包括证书和配置数据。\n5. Chef\
  \ 客户端将执行初始遍历，以执行命令行中指定的任何初始运行列表（在我们的例子中，没有）。\n6. 一旦 Chef 客户端完成其初始工作集，它将打印出它做了什么以及完成该任务花了多长时间。\n\
  \n一旦目标节点完成引导，您应该使用以下命令验证它是否已被配置：\n\n`[user@workstation]% knife node list`\n\nWIN-7QKOA4QQ21M\n\
  `[user@workstation:~]`\n\n### 通过 MSI 安装\n\n对于那些已经有工具部署软件使用 **Microsoft 安装程序包 (MSI)**\
  \ 的人来说，另一种选择是使用可用于在 Microsoft Windows 机器上安装 Chef 客户端的 MSI。要下载 Windows 系统的 Chef 客户端，请执行以下步骤：\n\
  \n1. 转到 `http://www.opscode.com/chef/install`。\n2. 单击 **Chef Client** 选项卡。\n3. 单击\
  \ **Windows** 并选择适当的版本和架构。\n4. 在 **Downloads** 下，选择要下载的 Chef 客户端版本，然后单击下拉菜单下方出现的链接以下载软件包。\n\
  \n执行前面的步骤后，将出现以下截图所示的网页：\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_28_0.png)\n\
  \n5. 安装程序下载成功后，按如下方式启动安装程序：\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_28_1.png)\n\
  \n6. 选择默认选项（有关服务的信息，请参阅以下截图后的信息框）：\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_29_0.png)\n\
  \n默认情况下，Chef 客户端仅手动运行——某人必须通过 WinRM 会话或在控制台上执行命令。为了在后台定期运行客户端，您必须启用服务或配置计划任务。如果在安装阶段选中\
  \ **Chef Client Service** 复选框，该服务将设置为自动运行。如果您想稍后启用它，可以使用以下命令：\n\n```\nchef-service-manager\
  \ -a install\n```\n\n如果您选择在后台运行客户端，则无法看到控制台输出。要查找执行日志，请参阅 `c:\\chef` 下的文件 `chef-client.log`。\n\
  \n> 通过 MSI 下载选项手动安装 Chef 客户端不会自动将主机注册到 Chef 服务。要执行此操作，您需要将验证器密钥和功能正常的 client.rb\
  \ 配置文件复制到目标主机。\n\n作为参考，自管理 Chef 服务的示例 client.rb 文件将如下所示：\n\n```\nlog_level :info\n\
  log_location STDOUT\nchef_server_url 'https://yourchefserver.com/'\nvalidation_client_name\
  \ 'chef-validator'\nvalidation_key \"C:/chef/validator.pem\"\n```\n\n使用托管 Chef 服务时的\
  \ client.rb 文件将如下所示：\n\n```\nlog_level :info\nlog_location STDOUT\nchef_server_url\
  \ 'https://api.opscode.com/organizations/ORGNAME'\nvalidation_key \"C:/chef/ORGNAME-validator.pem\"\
  \nvalidation_client_name 'ORGNAME-validator'\n```\n\n对于自管理 Chef 服务，validator.pem\
  \ 文件可能位于 /etc/chef 下。对于托管 Chef 服务，您可以从管理控制台下载验证器密钥。\n\n### 摘要\n\n到现在为止，您应该对 Chef\
  \ 架构的关键组件（包括重要术语）以及如何通过两种不同的机制在基于 Windows 的主机上安装 Chef 客户端有了良好的了解：\n\n- 从工作站使用 knife\
  \ 引导主机\n- 使用 MSI 包手动将客户端安装到节点\n\n在下一章中，我们将查看通过 Chef 可用的 Windows 特定资源和功能。\n\n###\
  \ Windows 特定资源\n\n使用 Chef 管理 Windows 时，有一些作为 Windows 堆栈一部分可用的 Windows 特定资源。本章涵盖了特定于\
  \ Windows 的资源，例如 Windows 注册表、角色、MSI 等；这些资源在 Linux 系统上不可用。\n\n#### 使用 Windows 特定资源\n\
  \n正如大多数系统管理员所预期的那样，管理 Windows 意味着有非 Windows 系统无法使用的资源和配置数据。这些资源列表包括以下内容：\n\n- 角色和功能\n\
  - 批处理脚本\n- 自动运行脚本\n- 软件包 (MSI、安装程序等)\n- 打印机\n- 注册表操作\n- 路径\n- 任务 (需要 Windows Server\
  \ 2008)\n- 页文件\n- 系统重启\n- ZIP 文件\n\n\n\n\n### Chef 支持的平台\n\n并非所有版本的 Windows 都受 Chef\
  \ 支持，并且并非所有功能在所有平台上都受支持。已知可与 Chef 配合使用的 Windows 版本列表如下：\n\n- Windows XP\n- Windows\
  \ Vista\n- Windows Server 2003 R2\n- Windows 7\n- Windows Server 2008\n- Windows\
  \ Server 2012\n\n这些资源由 `windows` cookbook (`https://github.com/opscode-cookbooks/windows`)\
  \ 提供，其行为与任何其他 Chef 资源类似，只是它们是特定于平台的资源，并且在非 Windows 系统上没有提供程序。让我们详细了解一下这些资源，并附上如何使用它们的示例。\n\
  \n要使用 `windows` cookbook，您需要安装一些依赖项，具体是 `chef_handler` 和 `powershell` 配方。\n\n> 我们不能明确依赖\
  \ Chef 的 `powershell` cookbook，因为 `powershell` 依赖于此 cookbook——如果不小心，这会创建循环依赖。因此，不要添加依赖，而是确保\
  \ `recipe [powershell]` 存在于节点的扩展运行列表中。\n\n### 管理角色和功能\n\n类似于 Linux 发行版具有包管理工具和包存储库，Windows\
  \ 长期以来一直带有随操作系统一起提供的内置包。Windows 的桌面版和服务器版都带有可安装的组件，服务器上的组件比桌面版更多。\n\n在 Windows 术语中，角色类似于\
  \ Chef 的角色概念——一组协同工作以提供某一组功能（例如 Web 应用程序服务或 DNS）的软件包和服务。在 Windows 服务器上，可能需要多个服务来提供特定角色。但是，由于这些角色作为\
  \ Windows 的一部分进行管理，因此通过 Chef 对它们的控制程度有些有限。您可以通过 `windows_feature` 资源启用或禁用它们，但是 Windows（而不是\
  \ Chef）决定安装什么。\n\n另一方面，功能更像是包；它们提供可能对参与特定角色并不关键，或者可能根本与角色无关的功能。Chef 将角色和功能都称为 _features_，`windows_feature`\
  \ 资源提供了一种通过 Chef 管理这两者的机制。\n\n目前 `windows_feature` 有两个提供程序：**Deployment Image Servicing\
  \ and Management (DISM)** 和 `servermanagercmd`（服务器管理器命令行工具）。`servermanagercmd` 命令已被弃用，推荐使用\
  \ DISM 作为管理角色和功能的机制。因此，如果被管理系统上存在 DISM，Chef 使用的默认提供程序是 DISM，如果不存在，则回退到使用 `servermanagercmd`。\n\
  \n要获取节点上可用的所有角色和功能的完整列表，请使用以下机制之一。在启用 DISM 的系统上，按如下方式运行 `dism` 命令：\n\n```\ndism\
  \ /online /Get-Features\n```\n\n此命令的输出会给出功能及其当前状态的列表。以下截图是在主机上运行此命令时获得的输出摘录：\n\n\
  ![](img/5439c37d2ec2a9036b89ca6c7fbf894e_33_0.png)\n\n在这里，`Feature Name` 键将用于映射到\
  \ `windows_feature` 资源中的 `feature_name` 属性。对于没有 DISM 的主机，请按如下方式使用 `servermanagercmd`\
  \ 工具：\n\n```\nservermanagercmd -query\n```\n\n此命令的输出将如下截图所示：\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_34_0.png)\n\
  \n在上述截图中，方括号中的字符串将是提供给 feature_name 属性以管理该组件的值。\n\n为了安装这些，Chef 为我们提供了 windows_feature\
  \ 资源，如下表所述：\n\n| windows_feature |\n|-----------------|\n| **Action**      | **Description**\
  \ |\n| install         | 这将安装指定的 Windows 角色或功能。 |\n| remove          | 这将卸载指定的 Windows\
  \ 角色或功能。 |\n| **Parameter**   | **Description** |\n| feature_name    | 这是名称属性 –\
  \ 要管理的功能或角色的 Windows 完全限定名称。名称可能因所使用的提供程序而异。 |\n\n### 使用不同机制安装角色\n\n如前所述，Windows\
  \ 功能资源有多个后端——DISM 和 servermanagercmd。每个后端都有一个特定的 Ruby 类，将根据确定的后端按如下方式使用：\n\n- Chef::Provider::WindowsFeature::DISM:\
  \ 这使用 DISM 来管理角色/功能（除非 DISM 不存在，否则为默认值）\n- Chef::Provider::WindowsFeature::ServerManagerCmd:\
  \ 这使用服务器管理器来管理角色/功能（当 DISM 不存在时的回退提供程序）\n\n### 使用功能和角色的示例\n\n启用打印机服务器角色（Printing-Server-Role），如下面\
  \ DISM 的示例输出所示：\n\n```\nwindows_feature \"Printing-Service-Role\" do\n  action :install\n\
  end\n```\n\n由于您可以在配方中使用任意 Ruby 代码，因此您可以轻松地对多个组件执行操作。例如，要同时删除传真服务器和打印服务器，您可以使用以下代码：\n\
  \n```\nto_remove = [\"Printing-Service-Role\", \"FaxServiceRole\"]\nto_remove.each\
  \ do |feat|\n  windows_feature feat do\n    action :remove\n  end\nend\n```\n\n\
  要在 DISM 不可用的系统上启用 IIS，您需要使用 servermanagercmd 输出的角色名称，如下所示：\n\n```\nwindows_feature\
  \ \"AS-Web-Support\" do\n  action :install\nend\n```\n\n### 执行批处理脚本\n\n类似于 Linux\
  \ 脚本资源（用于 bash、ruby 等），Chef 可以通过命令解释器执行任意定义的 Windows 批处理脚本。使用这些资源时，Chef 会编译资源块的\
  \ code 属性中定义的批处理脚本内容，然后将其部署到受管主机并从那里执行。\n\n> 使用脚本资源时要小心；它们是非结构化的，很容易执行产生意外副作用的操作。类似于软件构建的方式，对节点连续两次运行\
  \ Chef 客户端应该与只运行一次具有相同的效果，以保证可靠且一致的系统配置。确保您开发的脚本具有幂等性（即，可以多次运行且效果与只运行一次相同），或使用条件来防止多次执行。\n\
  \n由于脚本是任意且自由形式的，您可以使用它们来实现无法使用现有资源建模的任何功能。但是，必须小心防止重复执行导致负面副作用。避免执行可能具有破坏性操作的一种方法是使用\
  \ not_if 和 only_if 条件来防止多次执行。也就是说，如果您发现自己反复执行相同类型的操作，请考虑尽可能编写自定义资源和提供程序。\n\n> Chef\
  \ 11.6.0 及更高版本包含内置批处理资源；在实现早期 Chef 版本时使用 windows_batch。\n\n在使用早期版本的 Chef 在 Windows\
  \ 主机上运行批处理脚本时，可以使用 windows_batch 资源。下表显示了使用 windows_batch 资源时可用的操作和参数：\n\n| Action\
  \ | Description |\n|---|---|\n| run | 这将运行指定的批处理脚本。 |\n| Parameter | Description\
  \ |\n| code | 这是要执行的批处理脚本。它是任意字符串（请参阅表格后面的示例）。 |\n| command | 这是名称属性 — 正在执行的块的名称。通常，这应该有一个有意义的值。\
  \ |\n| creates | 一个文件将用作此脚本的信号量。如果指定的文件存在，则不会执行此脚本，因为预期该文件将由脚本创建。 |\n| cwd | 在运行批处理脚本之前，将工作目录更改为此目录。\
  \ |\n| flags | 这些是运行此批处理脚本时传递给 cmd.exe 解释器的命令行标志。 |\n| group | 这指定了应以其身份执行此脚本的组名称/ID。\
  \ |\n| user | 这指定了应以其身份执行此脚本的用户名称/ID。 |\n\n\n\n\n\n### 批处理脚本示例\n\n在以下代码中，我们将探讨如何构建一个命令来执行\
  \ rsync，并使用节点属性指定一些参数：\n\n```ruby\nwindows_batch 'synchronize_files' do\n  code\
  \ <<-EOH\n  rsync.exe -a -v -z #{node[:rsyncserver]} #{node[:rsyncdest]}\n  EOH\n\
  end\n```\n\n或者，您可能希望在节点上执行 Ruby 脚本，如下所示：\n\n```ruby\nwindows_batch 'execute_some_ruby'\
  \ do\n  cwd \"C:/Temp\"\n  code \"C:\\\\Ruby210\\\\ruby.exe C:\\\\Temp\\\\run_me.rb\"\
  \nend\n```\n\n### 在启动时运行脚本\n\n此资源允许您创建一个在系统登录时执行的自动运行条目。这对于任何需要在用户登录系统时运行的内容都很有用，例如会计、设置用户配置文件、路径、环境变量、下载补丁或更新、确保特定程序正在运行等等。\n\
  \n在以下表格中，我们描述了 `windows_auto_run` 资源及其可用操作和参数：\n\n| windows_auto_run    |    |\n\
  |---------------------|-----|\n| **操作**          | **描述** |\n| create          \
  \    | 这会创建一个在登录时执行的新项目。 |\n| remove              | 这会删除先前创建的自动运行条目。 |\n| **参数**\
  \       | **描述** |\n| args                | 这些是要传递给自动运行程序的参数。 |\n| name        \
  \        | 这是用于命名自动运行脚本的资源名称参数。 |\n| program             | 这是要执行的程序。 |\n\n### 创建自动运行脚本示例\n\
  \n使用以下代码安装自动运行项目，该项目在登录时执行会计工具以跟踪各种会计数据，仅在尚未安装自动运行项目时进行安装：\n\n```ruby\nwindows_auto_run\
  \ 'ACCOUNTING' do\n  program 'C:/MyOrg/accountingtool.exe'\n  args '/NOTIFYTHEBOSS\
  \ /PLAYAPRILFOOLSJOKE'\n  action :create\n  not_if { Registry.value_exists?(AUTO_RUN_KEY,\
  \ 'ACCOUNTING') }\nend\n```\n\n### 安装软件包\n\n大量受管系统需要配置超出内置 Windows 角色和功能范围的软件。Chef\
  \ 提供了一个非常方便的资源，用于通过 windows_package 资源在 Windows 主机上安装任意软件，其行为类似于基于 Linux 的包资源，但仅用于\
  \ Windows 特定安装。windows_package 资源能够通过多种流行的安装机制安装软件。目前，该列表包括以下内容：\n\n- MSI 包\n- InstallShield\n\
  - Wise InstallMaster\n- Inno Setup\n- Nullsoft Scriptable Install System\n\n如果在资源的属性中未提供安装程序类型，则\
  \ Chef 将通过检查包来尝试识别安装程序。对于不使用受支持安装机制之一的软件，Chef 提供了通过提供自定义安装类型来描述自定义安装程序工作流的功能。\n\n\
  > 为了让 Chef 管理软件的安装，它必须支持某种无人值守或静默模式，该模式不依赖任何用户输入即可成功安装软件包。这适用于安装和卸载。\n\n以下表格列出了\
  \ windows_package 资源的可用操作和参数：\n\n| 操作 | 描述 |\n|---|---|\n| install | 这会安装一个软件包。\
  \ |\n| remove | 这会删除指定的包。 |\n| 参数 | 描述 |\n| package_name | 这指定名称属性，即应用程序安装包的显示名称；这是\
  \ DisplayName 注册表项中的值，通常位于以下注册表项之一的 CurrentVersion\\Uninstall 下：* HKLM\\Software\\\
  Microsoft\\Windows * HKCU\\Software\\Microsoft\\Windows * HKLM\\Software\\Wow6464Node\\\
  Microsoft\\Windows |\n| installer_type | 安装程序类型的可能值为 :msi、:inno、:nsis、:wise；:installsheild\
  \ 和 :custom。如果没有此值，提供程序将尝试通过检查文件来猜测机制。 |\n| source | 这决定了查找安装程序的位置；这可以是本地路径或 URL。在路径为\
  \ URL 的情况下，安装程序将被下载并执行。 |\n| checksum | 这是文件的 SHA-256 校验和。它通常与下载 URL 结合使用——如果缓存的文件与校验和匹配，Chef\
  \ 将不会重新下载 URL 中存在的文件。它还禁止安装意外的包。 |\n| options | 这包括要传递给安装程序的任何命令行选项。 |\n| timeout\
  \ | 这是下载超时（默认值为 10 分钟）。 |\n| version | 这是正在安装的包的版本。这可以在应用程序注册表设置的 DisplayVersion\
  \ 值中找到。如果当前安装的版本（注册表中的值）与此不匹配，则将安装/升级该包。 |\n| success_codes | 这是一个返回码数组，指示包已成功安装。通常，这与自定义安装程序一起使用，但还有许多其他可能的情况这很有用。默认值为\
  \ (0, 42, 127) |\n\n### 安装 Windows 包示例\n\n使用本地提供的文件安装 Ruby 1.9.3-p448。此包使用 Inno\
  \ Setup 打包程序并提供了一个提示，但请记住，即使没有它，提供程序也会尝试确定安装程序类型：\n\n```ruby\nwindows_package \"\
  Ruby 1.9.3-p448\" do\n  source File.join(\"C:\", \"temp\", \"rubyinstaller-1.9.3-p448.exe\"\
  )\n  options '/dir=\"C:/Ruby193\" /tasks=\"modpath\"'\n  installer_type :inno\n\
  \  action :install\nend\n```\n\n您可以指定任意标志传递给不使用已知打包系统之一的安装程序。一个示例是 Firefox，它支持传递\
  \ -ms 命令行参数给安装程序以运行静默模式：\n\n```ruby\nff_url = \"http://archive.mozilla.org/pub/mozilla.org/mozilla.org/firefox/releases/28.0b4/win32/en-US/Firefox%20Setup%2028.0b4.exe\"\
  \nwindows_package 'Mozilla Firefox 28.0b4 (x86 en-US)' do\n  source ff_url\n  action\
  \ :install\n  installer_type :custom\n  options '-ms'\nend\n```\n\nFirefox 的选项可以在\
  \ https://wiki.mozilla.org/Installer:Command_Line_Arguments 中找到。\n\n要删除先前安装的包（例如\
  \ iTunes），请按如下方式使用 :remove 操作：\n\n```ruby\nwindows_package \"iTunes\" do\n  action\
  \ :remove\nend\n```\n\n### 操作打印机\n\nChef 提供了两种不同的资源来管理打印机——端口和打印机本身。windows_printer_port\
  \ 资源允许您在 Windows 主机上安装 TCP/IP 打印机端口以连接打印机。windows_printer 资源负责实际打印机安装，两者协同使用。\n\n\
  ### 管理打印机端口\n\n使用 `windows_printer_port` 资源，您可以创建和删除 TCP/IPv4 打印机端口。当您需要控制端口配置时，此资源对于创建具有特定设置的打印机端口很有用。`windows_printer`\
  \ 资源使用 `windows_printer_port` 资源根据需要动态创建打印机端口，因此通常只有在默认设置不足时才有用。\n\n`windows_printer_port`\
  \ 资源的可用操作和参数在以下表格中描述：\n\n| 操作 | 描述 |\n|---|---|\n| `create` | 这会创建一个新的 TCP/IP 打印机端口（默认操作）。\
  \ |\n| `delete` | 这会删除一个命名的 TCP/IP 打印机端口。 |\n| **参数** | **描述** |\n| `ipv4_address`\
  \ | 这指定资源名称属性，即端口配置的 IPv4 地址。 |\n| `port_name` | 这给出可选端口名称。默认值为 `IP_#{ipv4_address}`\
  \ |\n| `port_number` | 这给出可选端口号。默认值为 9100。 |\n| `port_description` | 这给出可选端口描述。\
  \ |\n| `snmp_enabled` | 这给出可选标志，用于标记 SNMP 是启用还是禁用。默认值为 false。 |\n| `port_protocol`\
  \ | 这给出可选端口协议。支持以下值：* 1 (RAW) * 2 (LPR) 默认值为 1。 |\n\n> > 打印机资源依赖于 PowerShell，以确保\
  \ `recipe[powershell]` 包含在节点的扩展运行列表中，以确保 powershell cookbook 被下载以避免循环依赖。\n\n\n\n\
  \n\n### 管理打印机端口示例\n\n仅指定 IP 地址（其余设置均为默认值）来创建名为 `10.0.0.1` 的 TCP/IP 打印机端口，如以下代码所示：\n\
  \n```ruby\nwindows_printer_port '10.0.0.1' do\nend\n```\n\n删除刚刚创建的打印机端口，如下所示：\n\n\
  ```ruby\nwindows_printer_port '10.0.0.1' do\n  action :delete\nend\n```\n\n创建带有非默认选项（如名称、端口号、描述和\
  \ SNMP 支持）的端口，如以下代码所示：\n\n```ruby\nwindows_printer_port '10.0.0.1' do\n  port_name\
  \ 'Remote office port'\n  port_number 8080\n  port_description 'This is my newly\
  \ created port'\n  snmp_enabled true\nend\n```\n\n删除先前创建的端口，如下所示：\n\n```ruby\nwindows_printer_port\
  \ '10.0.0.1' do\n  port_name 'Remote office port'\n  action :delete\nend\n```\n\n\
  ### 管理打印机\n\n要创建新打印机，系统上需要已安装驱动程序。如果驱动程序不在目标主机上，可以使用 `windows_package` 资源轻松安装，并从中央网络位置分发，以便将打印机驱动程序分发到目标主机。\n\
  \n> `windows_printer` 资源将使用 `ipv4_address` 属性自动为您创建 TCP/IP 打印机端口。如果您希望对打印机端口进行更精细的控制，请在创建打印机之前使用\
  \ `windows_printer_port` 资源创建端口。\n\n下表显示了可与 `windows_printer` 资源一起使用的可用操作和参数：\n\n\
  | 操作 | 描述 |\n| --- | --- |\n| create | 创建新打印机资源（默认操作）。 |\n| delete | 删除名为的打印机。 |\n\
  | 参数 | 描述 |\n| device_id | 这是资源名称属性—设置为打印机队列名称，例如，Tokyo Office HP LaserJet。 |\n\
  | driver_name | 这必须是打印机驱动程序的确切名称。这需要提前安装（如前所述）—如有需要，使用 `windows_package` 资源在创建打印机之前安装它。\
  \ |\n| ipv4_address | 这是打印机的 IPv4 地址，例如，10.4.64.23。创建时无需网络可访问。如果不存在，我们将创建端口。 |\n\
  | location | 这是用于打印机元数据的打印机位置。 |\n| shared | 这是一个布尔标志，指示此打印机是否需要共享。默认值为 false。 |\n\
  | share_name | 这是打印机的共享名称，如果需要共享。 |\n| comment | 这将包含打印机的可选描述。 |\n| default | 这决定打印机是否为默认打印机。默认值为\
  \ false。 |\n\n如前所述，如果不存在，此资源将自动为此打印机创建打印机端口。在当前形式中，底层打印机提供程序期望打印机端口的名称为 `IP_#{ipv4_address}`—因此，如果您有自定义命名的端口，它将不会被使用。\n\
  \n### 管理打印机示例\n\n创建名为 `HP LaserJet, Bldg. A Floor 20` 并由 `10.0.0.5` IP 地址的新打印机。这将在构建打印机端口时使用默认设置，因此新端口将命名为\
  \ `IP_10.0.0.0.15` 并使用端口 `9001` 和 RAW 协议，且无 SNMP，如下所示：\n\n```ruby\nwindows_printer\
  \ 'HP LaserJet, Bldg. A Floor 20' do\n driver_name 'HP LaserJet 1320'\n ipv4_address\
  \ '10.0.0.5'\nend\n```\n\n使用以下代码创建更精细的打印机和端口配置：\n\n```ruby\nwindows_printer_port\
  \ '10.0.0.10' do\n port_name 'IP_10.0.0.10'\n port_number 9001\n port_description\
  \ 'Building B print server'\n snmp_enabled true\nend\n```\n\n以下代码将创建我们的端口 `IP_10.0.0.10`，然后我们可以将打印机绑定到该端口：\n\
  \n```ruby\nwindows_printer 'HP LaserJet 6L - Copy Room' do\n driver_name 'HP LaserJet\
  \ 6L'\n ipv4_address '10.0.0.10'\n location 'Building B, Floor 13, Copy Room'\n\
  \ comment 'Haunted floor, look out for ghosts.'\nend\n```\n\n现在，当提供程序构建打印机时，它将使用我们先前用自定义设置构建的\
  \ `IP_10.0.0.10` 端口。\n\n要删除打印机，请使用 `:delete` 操作。请注意，这不会删除端口，因为该位置可能有其他打印机。要删除端口，必须单独使用\
  \ `windows_printer_port` 资源和 `:delete` 操作，如下所示：\n\n```ruby\nwindows_printer 'HP\
  \ LaserJet, Bldg. A Floor 20' do\n  action :delete\nend\n```\n\n### 与 Windows 注册表交互\n\
  \n管理类 UNIX 系统和 Windows 系统之间最著名的区别之一是 Windows 注册表。Chef 拥有用于创建、修改和删除 Windows 注册表项的资源。请注意，这些操作是不可逆的（值没有隐式备份，因此在修改值之前最好准备备份），并且它们可能非常具有破坏性。\n\
  \n注册表项的路径还必须包含注册表配置单元。可以完全指定配置单元，也可以使用以下缩写：\n\n- HKLM for `HKEY_LOCAL_MACHINE`\n\
  - HKCC for `HKEY_CURRENT_CONFIG`\n- HKCR for `HKEY_CLASSES_ROOT`\n- HKU for `HKEY_USERS`\n\
  - HKCU for `HKEY_CURRENT_USER`\n\n> Chef 10.x 使用名为 `windows_registry` 的资源，这里将为使用旧版\
  \ Chef 客户端和服务器的用户进行描述。对于使用 11.x 的新安装版本，资源是 `registry_key`，是使用较新版本 Chef 时与注册表值交互的首选方式。请使用与您的\
  \ Chef 版本对应的资源。\n\n### Chef 10.x 资源\n\n`windows_registry` 资源允许您控制注册表设置，但其操作和属性与\
  \ `registry_key` 资源不同。当需要迁移时，从 `windows_registry` 迁移到 `registry_key` 应该是一个相当直接的操作。\n\
  \n下表提供了与 `windows_registry` 资源一起使用的操作和参数的描述：\n\n| 操作 | 描述 |\n| --- | --- |\n| `create`\
  \ | 使用提供的数据创建新注册表项。 |\n| `modify` | 使用所需值更新现有注册表项。 |\n| `force_modify` | 修改现有注册表项的值，但这样做不一致。此操作会多次检查值，以确保键包含您所需的值。\
  \ |\n| `remove` | 从现有注册表项中删除一个值。 |\n| **参数** | **描述** |\n| `key_name` | 这是资源名称属性，指定要创建、修改或删除的注册表项。\
  \ |\n| `values` | 这是要在注册表项下设置的值的哈希。单个哈希项将成为注册表项中的相应 `'Value name' => 'Value data'`\
  \ 项。 |\n| `type` | 这决定要创建的键的类型。以下是选项列表： |\n| | • `:binary`: REG_BINARY |\n| | •\
  \ `:dword`: REG_DWORD |\n| | • `:dword_big_endian`: REG_DWORD_BIG_ENDIAN |\n| |\
  \ • `:expand_string`: REG_EXPAND_SZ |\n| | • `:multi_string`: REG_MULTI_SZ |\n|\
  \ | • `:string`: REG_SZ |\n| | • `:qword`: REG_QWORD |\n| | 默认值为 `:string`。 |\n\n\
  ### 管理注册表项示例\n\n通过注册表管理 NTP 服务器，以允许与 NTP 池进行异地 NTP 同步，并每 45 分钟更新一次，直到执行三次良好同步，然后每\
  \ 8 小时一次，使用以下代码：\n\n```ruby\nregkey = 'HKLM\\SYSTEM\\CurrentControlSet\\Services\\\
  W32Time\\Parameter'\nwindows_registry regkey do\n  values 'AvoidTimeSyncOnWan' =>\
  \ 0,\n         'NtpServer' => \"0.pool.ntp.org\",\n         'Period' => 'SpecialSkew'\n\
  end\n```\n\n如以下代码所示，从给定位置删除注册表中的两个特定键/值对—将值设置为空可实现以下结果：\n\n```ruby\nwindows_registry\
  \ 'HKCU\\Software\\SomeApp\\SomeKey' do\n  values 'UnwantedValueOne' => '',\n  \
  \       'UnwantedValueTwo' => ''\n  action :remove\nend\n```\n\n还有可用的辅助方法，用于确定键是否存在和/或从注册表中获取数据。在编写围绕其他块的守卫或为其他资源提取注册表数据时，这些方法非常有用。\n\
  \n使用以下代码确定值是否存在：\n\n```ruby\nWindows::RegistryHelper.value_exists?(path, value)\n\
  ```\n\n使用以下代码检查键是否存在：\n\n```ruby\nWindows::RegistryHelper.key_exists?(path)\n```\n\
  \n使用以下代码从注册表项中获取值：\n\n```ruby\nresult = Windows::RegistryHelper.get_value(path,\
  \ value)\n```\n\n\n\n\n\n### Chef 0.11.x 资源\n\n在较新版本的 Chef 中，`registry_key` 资源用于设置\
  \ Windows 注册表中的值，如下表所示：\n\n| registry_key |\n| --- |\n| **Action** | **Description**\
  \ |\n| `create` | 这将使用提供的数据创建一个新的注册表项。 |\n| `create_if_missing` | 如果不存在，这将创建一个键或值。\
  \ |\n| `delete` | 这将删除指定注册表项的指定值。 |\n| `delete_key` | 这将删除特定键及其所有子项。 |\n| **Parameter**\
  \ | **Description** |\n| `key` | 这是资源名称属性，用于指定要创建、修改或删除的注册表项。 |\n| `architecture`\
  \ | 这指定将创建键的架构。可能的值如下：\n\n• :x86: 强制 32 位注册表\n• :x86_64: 强制 64 位注册表\n• :machine:\
  \ 允许客户端确定\n\n默认值为 :machine。 |\n| `provider` | 这确定用于操作注册表的提供程序。目前只有一个（Chef::Provider::Windows::Registry），其短名为\
  \ registry_key，但将来可能会更改。\n\n默认值为 registry_key。 |\n| `recursive` | 这确定是否应递归执行此操作。创建新注册表项时，创建任何所需的路径组件；删除时，删除所有子项。\
  \ |\n| `values` | 这是一个哈希数组，包含要在指定注册表项下设置的值。每个哈希由三个键组成，如下：\n\n• :name: 值的名称\n• :type:\
  \ 存储的值的类型\n• :data: 要存储的数据\n\n:type 键具有与 windows_registry 条目的类型相同的选项，默认值为 :string。\
  \ |\n\n### 管理注册表值示例\n\n要以与使用 windows_registry 资源相同的方式设置 NTP 配置，匹配的 registry_key\
  \ 资源将如下代码所示：\n\n```ruby\nregkey = 'HKLM\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\
  \\W32Time\\\\Parameter'\n\nregistry_key regkey do\n  values [\n    {\n      :name\
  \ => 'AvoidTimeSyncOnWan',\n      :type => :reg_dword,\n      :data => 0\n    },\
  \ {\n      :name => 'NtpServer',\n      :data => \"0.pool.ntp.org\"\n    }, {\n\
  \      :name => 'Period',\n      :type => :reg_string,\n      :data => 'SpecialSkew'\n\
  \    }]\n  action :create\nend\n```\n\n### 管理系统路径\n\nChef 有资源支持操作系统路径。在安装需要对系统路径进行更改的新软件或配置时，这很有用。\n\
  \n下表说明了使用 windows_path 资源时可用的操作和参数：\n\n| windows_path | |\n|---------------|----|\n\
  | **Action** | **Description** |\n| add | 这将向系统路径添加一个新条目。 |\n| remove | 这将从系统路径中删除一个条目。\
  \ |\n| **Parameter** | **Description** |\n| path | 这是资源名称属性，用于指定要添加到系统路径的目录。 |\n\
  \n### 修改路径示例\n\n将 Ruby 2.1.0 的二进制文件添加到系统路径，如下所示：\n\n```ruby\nwindows_path 'C:\\\
  Ruby\\2.1.0\\bin' do\n  action :add\nend\n```\n\n从系统路径中删除 Ruby 1.9.3，如下所示：\n\n```ruby\n\
  windows_path 'C:\\Ruby\\1.9.3\\bin' do\n  action :remove\nend\n```\n\n### 计划任务\n\
  \n`windows_task` 资源允许您创建、删除或执行 Windows 计划任务。这些任务在定期间隔执行，对于定期运行 Chef 客户端、检查更新、清理临时文件、下载缓存数据或任何其他需要计划的操作很有用。\n\
  \n> 此资源提供程序需要 Windows Server 2008，因为它使用的 API。\n\n下表列出了通过 `windows_task` 资源创建计划任务时可用的操作和参数：\n\
  \n| Action | Description |\n|---|---|\n| `create` | 这将创建一个新的计划任务。 |\n| `delete`\
  \ | 这将删除一个任务。 |\n| `run` | 这将运行指定的任务。 |\n| `change` | 这将更新指定任务的属性。 |\n\n| Parameter\
  \ | Description |\n|---|---|\n| name | 这是资源名称属性，用于指定任务的名称（任意名称）。 |\n| command |\
  \ 这是按间隔执行的命令。 |\n| cwd | 这指定运行命令的目录。 |\n| user | 这是执行命令的用户。 |\n| password | 这是用户的密码。\
  \ |\n| run_level | 运行的权限级别列表如下：\n\n* :highest\n* :limited\n\n默认值为 :limited。 |\n\
  | frequency | 这是命令执行的时间单位；选项如下：\n\n* :minute\n* :hourly\n* :daily\n* :weekly\n*\
  \ :monthly\n* :once\n* :on_login\n* :onstart\n* :on_idle\n\n默认值为 :hourly |\n| frequency_modifier\
  \ | 这是频率间隔，例如 15、2、30 等。这与时间单位相乘，因此将 15 作为修饰符并结合 :minute 作为频率，会导致命令每 15 分钟重复一次。\n\
  \n默认值为 1。 |\n| start_day | 这是开始间隔的可选日期，格式为 MM/DD/YYYY。这是命令首次执行的日期，然后按指定的频率间隔运行。如果未指定此参数，命令将立即运行。\
  \ |\n| start_time | 这确定执行首次操作的时间（如果为 nil 则立即执行）。格式为 HH:MM。 |\n\n### 管理 Windows 任务示例\n\
  \n使用以下代码每 15 分钟运行一次 Chef：\n\n```ruby\nwindows_task 'Chef client' do\n  user 'Administrator'\n\
  \  password '$ecR3t'\n  cwd 'C:\\chef\\bin'\n  command 'chef-client -L C:\\tmp\\\
  '\n  run_level :highest\n  frequency :minute\n  frequency_modifier 15\nend\n```\n\
  \n删除 Chef 客户端任务，如下所示：\n\n```ruby\nwindows_task 'Chef client' do\n  action :delete\n\
  end\n```\n\n### 与 Windows 页面文件交互\n\n此资源允许您设置默认页面文件（如果不存在则创建）或删除 Windows 页面文件。Chef\
  \ 可以为新创建的页面文件指定初始大小、最大大小和管理模式。\n\n下表说明了可与 windows_pagefile 资源一起使用的操作和参数：\n\n| windows_pagefile\
  \ | |\n|-----------------------|----|\n| **Action** | **Description** |\n| set |\
  \ 这将默认系统页面文件设置为指定的页面文件。如果页面文件不存在，提供程序将自动创建它。 |\n| delete | 这将删除指定的页面文件。 |\n| **Parameter**\
  \ | **Description** |\n| name | 这是资源名称属性，用于指定页面文件的路径。 |\n| system_managed | 这允许系统管理此页面文件（初始大小\
  \ = 0，最大大小 = 0）。 |\n| automatic_managed | 页面文件的大小是否应自动管理？如果是，则忽略初始大小和最大大小。\n\n默认值为\
  \ false。 |\n| initial_size | 这是页面文件的初始大小（以字节为单位）。 |\n| maximum_size | 这是页面文件的最大大小（以字节为单位）。\
  \ |\n\n### 管理页面文件示例\n\n使用以下代码将默认页面文件设置为 `D:\\pagefile.sys`，初始大小为 8 GB，最大大小为 16 GB（如有需要则创建）：\n\
  \n```ruby\none_gb = 1024 * 1024 * 1024\nwindows_pagefile 'D:\\\\pagefile.sys' do\n\
  \  initial_size (8 * one_gb)\n  maximum_size (16 * one_gb)\n  system_managed false\n\
  \  automatic_managed false\n  action :set\nend\n```\n\n删除 `X:\\pagefile.sys` 处的页面文件，如下代码所示：\n\
  \n```ruby\nwindows_pagefile 'X:\\\\pagefile.sys' do\n  action :delete\nend\n```\n\
  \n### ZIP 文件\n\n在所有 Windows 平台上，没有一种一致的本地方式来管理 ZIP 文件的打包或解包。为解决此问题，`windows_zipfile`\
  \ 资源提供了一个纯 Ruby 实现，用于在 Windows 平台上操作 ZIP 文件。\n\n下表列出了 `windows_zipfile` 资源可用的操作和参数：\n\
  \n| Action | Description |\n| --- | --- |\n| `unzip` | 这将解压缩源中指定的 ZIP 文件到目标。 |\n\
  | `zip` | 这将从源在目标处创建一个 ZIP 文件。 |\n| **Parameter** | **Description** |\n| `path`\
  \ | 这是资源名称属性，用于指定路径——解压缩时指定解压缩文件的位置，而压缩时指定创建 ZIP 文件的位置。 |\n| `source` | 这指示解压缩时要解压缩的\
  \ ZIP 文件位置，或压缩时包含要压缩文件的目录。 |\n| `checksum` | 这是可选的校验和，用于在解压缩前验证 ZIP 文件是否为预期文件。 |\n\
  | `overwrite` | 这确定此操作是否应覆盖文件。\n\n默认值为 false。 |\n\n\n\n\n\n### 与 ZIP 文件交互的示例\n\n\
  以下代码会压缩位于 `D:\\\\backups\\\\`、以当前日期命名的 ZIP 文件，其中包含 `C:\\\\development\\\\webapp\\\
  \\` 下的文件：\n\n```ruby\nrequire 'date'\ntoday = Date.today.strftime('%Y-%m-%d')\n\
  windows_zipfile 'D:\\\\backups\\\\#{today}.zip' do\n  source 'C:\\\\development\\\
  \\webapp'\n  action :zip\nend\n```\n\n以下代码会将位于 `D:\\\\dist\\\\ruby-1.9.3.zip` 的\
  \ ZIP 文件解压缩到 `C:\\\\ruby`，仅在校验和与指定值匹配时才会覆盖文件：\n\n```ruby\nwindows_zipfile 'C:\\\\\
  ruby' do\n  source 'D:\\\\dist\\\\ruby-1.9.3.zip'\n  checksum 'bfed985c4f0e44cd6b97f93b9440940335313384'\n\
  \  overwrite true\nend\n```\n\n### 重启 Windows\n\n通常情况下，Windows 需要重启以更新在安装或重新配置过程中更改的系统设置。windows\
  \ cookbook 提供了 `windows_reboot` 资源，用于通知 `WindowsRebootHandler` 需要重启。如果 `WindowsRebootHandler`\
  \ 已注册为报告处理程序，则在 Chef 客户端完整且成功执行后，将请求重启。\n\n通常，当需要重启时，此资源会由其他资源块通知，通常是在安装新软件或更改系统设置之后。\n\
  \n您的配方需要确保通过以下命令包含重启处理程序：\n\n```ruby\ninclude_recipe 'windows::reboot_handler'\n\
  ```\n\n下表概述了可以与 `windows_reboot` 资源关联的操作和参数：\n\n| 操作 | 描述 |\n|--------|-------------|\n\
  | request | 这会请求在 Chef 客户端执行完成后安排重启。这需要 `WindowsRebootHandler` 已注册为报告处理程序。 |\n|\
  \ cancel | 这会通过更改节点 `run_state` 设置来取消任何待处理的重启请求。 |\n| **参数** | **描述** |\n| reason\
  \ | 这是系统重启的文本原因。默认值为 `Chef initiated reboot`。 |\n| timeout | 这是名称属性，指定命令在重启前等待的秒数。默认值为\
  \ 60。 |\n\n### 安排重启的示例\n\n以下示例展示了如何通过 `windows_package` 成功安装软件包时通知重启块，在 Chef 客户端运行结束时安排一个三分钟超时的重启：\n\
  \n```ruby\nwindows_reboot 180 do\n  reason \"Installed a new package\"\n  action\
  \ :nothing\nend\n```\n\n```ruby\nwindows_package 'sql_server' do\n  action :install\n\
  \  notifies :request, 'windows_reboot[180]'\nend\n```\n\n如果您需要取消重启，可以使用以下代码从资源块中执行此操作：\n\
  \n```ruby\nwindows_reboot do\n  action :cancel\nend\n```\n\n### 摘要\n\n本章向您介绍了使用\
  \ Chef 时提供的各种 Windows 特定资源。如您所见，这些资源与您在管理基于 Linux 的系统时可能遇到的资源非常相似，只是针对 Windows 环境进行了定制。\n\
  \n在下一章中，我们将探讨如何使用可用于 Windows 管理的资源，以使用 IIS、.NET 框架和数据库服务器来配置应用程序堆栈。\n"
- "# 配置应用程序堆栈\n\n现在您已经了解了 Windows 特定资源以及在 Windows 上使用 Chef 的一些背景信息，让我们来看看如何配置一个完整的应用程序堆栈。在本章中，我们将剖析一个负责安装开源\
  \ CMS 应用程序 Umbraco 的 cookbook。请注意，此 cookbook 中的配方要求目标平台为 Windows Server 2012，如果您打算亲自运行，请相应规划。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 引导新的 Windows 主机\n- 安装 Umbraco CMS 的依赖项\n- 在 Windows 主机上安装\
  \ Umbraco CMS\n- 在 IIS 中配置站点以运行 Umbraco CMS\n\n## 检查 cookbook\n\n我们将深入研究一个专门为解决\
  \ Umbraco CMS 及其要求的安装而编写的 cookbook。此 cookbook 的源代码可在 GitHub 上找到，地址为 `http://github.com/johnewart/umbraco-cookbook`。\n\
  \n### 配置应用程序堆栈\n\n无论针对 Windows 还是其他平台，Chef cookbook 都共享相同的布局和结构。支持 Windows 的 cookbook\
  \ 的主要区别在于，其 `metadata.rb` 文件声明该 cookbook 支持 Windows，而 cookbook 中包含的配方将通过 Windows\
  \ 特定资源和条件逻辑的组合来支持 Windows，这些逻辑在 Windows 平台上的行为可能有所不同。以下截图显示了 `umbraco` cookbook\
  \ 的布局：\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_58_0.png)\n\n在这里，您会注意到 cookbook\
  \ 看起来就像任何其他 cookbook 一样；它可以包含配方、属性、模板、资源、提供程序以及任何其他 Chef 资源的文件夹。在此示例中，cookbook 仅包含一些默认属性和配方，因为它旨在作为\
  \ Windows 的紧凑示例。\n\n如果您查看此 cookbook 的 `metadata.rb` 文件，您将看到以下内容：\n\n```\nname  \
  \            'umbraco'\nmaintainer        'John Ewart'\nmaintainer_email  'john@johnewart.net'\n\
  license           'Apache 2.0'\n```\n\ndescription 'Installs and configures umbraco,\
  \ an open source CMS for ASP.NET (http://www.umbraco.com)'\nlong_description 'Install\
  \ and configure the Umbraco CMS'\nversion '1.0'\n\n## Cookbook dependencies (IIS\
  \ and Windows)\ndepends iis\ndepends windows\n\n## Supported platforms\nsupports\
  \ 'windows'\n\n对于那些对 Chef 仍有些陌生的人来说，`metadata.rb` 文件描述了 cookbook 的维护者是谁，它遵循什么许可证，版本号是多少，它依赖哪些\
  \ cookbook，以及支持哪些平台。\n\n在此示例中，我们可以看到 cookbook 支持 Windows 平台，并且需要 `iis` 和 `windows`\
  \ cookbook 才能正常工作。这些 cookbook 对于您想要通过 Chef 安装的几乎任何 IIS Web 应用程序都是必需的。\n\n### 安装\
  \ cookbook\n\n如前所述，此 cookbook 有两个直接依赖项，`windows` 和 `iis`，而它们又是第三个依赖项 `chef_handler`\
  \ 所必需的。所有这些 cookbook 都可以在以下位置找到：\n\n- `https://github.com/opscode-cookbooks/windows`\n\
  - `https://github.com/opscode-cookbooks/iis`\n- `https://github.com/opscode-cookbooks/chef_handler`\n\
  - `https://github.com/johnnewart/umbraco-cookbook`\n\n### 从 GitHub 获取\n\n为了使用这些资源，您可以从\
  \ GitHub 下载它们，或者使用 Git 将它们克隆到本地系统。如果您不希望将它们作为 Git 仓库（即受版本控制的源代码）来处理，下载它们将是获取它们的最简单方式。如果您访问上述\
  \ URL，您将在屏幕右侧看到一个名为 **Download ZIP** 的链接，如下面的截图所示：\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_60_0.png)\n\
  \n如果您选择下载 ZIP 文件而不是使用 Git 克隆它们，您需要确保目录名称与 cookbook 的正确名称匹配（`chef_handler`、`windows`、`iis`\
  \ 和 `umbraco`）。例如，如果您克隆 `umbraco` cookbook，它将被放置在 `umbraco-cookbook` 目录中，而解压缩 ZIP\
  \ 文件可能会导致 `umbraco-cookbook-master` 目录。下载并重命名后，请从包含所有四个 cookbook 的目录运行以下命令将它们安装到您的\
  \ Chef 服务器上：\n\n`knife cookbook upload -o . chef_handler windows iis umbraco`\n\n\
  在上传过程中，Chef 将验证每个 cookbook 的依赖项是否已满足（或正在上传中）。`chef_handler` cookbook 必须安装才能使 `windows`\
  \ cookbook 工作，而 `windows` cookbook 又是支持 `iis` cookbook 所必需的，然后最后可以安装 `umbraco` cookbook，因为其依赖项已满足。\n\
  \n\n\n\n\n### 检查食谱\n\n现在你已将 `umbraco` 食谱的源码下载到本地计算机，让我们来看看它在做什么。Umbraco 是一个非常易于安装的\
  \ ASP.net CMS 应用程序，它能让你很好地了解如何使用 Chef 安装和配置 IIS 应用程序。选择 Umbraco 作为本示例食谱是因为它不需要数据库（尽管支持数据库），并且其单个\
  \ ZIP 文件安装使其易于跟随操作。\n\n让我们深入了解包含在 `umbraco` 食谱中的 `default.rb` 食谱。即将介绍的章节中的代码片段位于\
  \ `umbraco/recipes/default.rb` 中。\n\n### 安装先决条件\n\n在设置 IIS 应用程序之前，我们的食谱需要确保主机上已安装\
  \ IIS Web 服务器 Windows 角色。如前一章所示，Chef 有一个名为 `windows_feature` 的资源，允许我们确保该角色已可用或作为食谱执行的一部分进行安装。让我们逐个查看食谱的组件：\n\
  \n1. 首先，使用 `IIS-WebServerRole` 角色安装该角色，如下所示：\n\n   ```ruby\n   windows_feature 'IIS-WebServerRole'\
  \ do\n     action :install\n   end\n   ```\n\n2. 安装完成后，在 IIS 中安装 ASP.net 功能；不过，它还有一些其他先决条件，即\
  \ ISAPI 筛选器、ISAPI 扩展、.NET 3 服务器功能、ASP.net 4.5 支持以及 .NET 4.5 可扩展性库。这些是 Windows Server\
  \ 2012 上所需的角色；可以使用 `dism` 或 `servermanagercmd` 等命令行工具发现角色的名称。以下代码片段显示了 IIS ASP.net\
  \ 功能的安装：\n\n   ```ruby\n   features = %w{IIS-ISAPIFilter IIS-ISAPIExtensions\n \
  \  NetFx3ServerFeatures NetFx4Extended-ASPNET45 IIS-\n   NetFxExtensibility45}\n\
  \n   features.each do |f|\n     windows_feature f do\n       action :install\n \
  \    end\n   end\n   ```\n\n### 准备 IIS 服务\n\n至此，我们的食谱已完成所需角色和功能的安装，以便管理 IIS 应用程序。让我们看看它如何通过从服务器中删除默认\
  \ IIS 站点和应用程序池来准备 IIS 服务。\n\niis 食谱有一个默认食谱，用于启动名为 W3SVC 的服务。我们不希望这样做，而是希望添加自己的 IIS\
  \ 服务。我们可以通过将 action 属性覆盖为 :nothing 来实现这一点。这将阻止默认 W3SVC 服务被安装，如以下代码片段所示：\n\n```ruby\n\
  service \"iis\" do\n  service_name \"W3SVC\"\n  action :nothing\nend\n```\n\n我们不希望默认\
  \ IIS 应用程序提供流量，因此我们将使用 iis 食谱中的 remove_default_site 食谱将其删除，如下所示：\n\n```ruby\ninclude_recipe\
  \ \"iis::remove_default_site\"\n```\n\n如果你深入研究 iis 食谱，你会发现这只是执行以下操作的一种便捷方式，两种机制都能实现相同的目标：\n\
  \n```ruby\niis_site 'Default Web Site' do\n  action [:stop, :delete]\nend\niis_pool\
  \ 'DefaultAppPool' do\n  action [:stop, :delete]\nend\n```\n\n### 获取应用程序\n\nUmbraco\
  \ 的分发版本以 ZIP 文件形式提供，我们需要下载并解压缩它。这里，资源名称（传递给资源的参数）是我们要解压缩 ZIP 文件的目标目录。目标位置在哈希元素 `node['umbraco']['approot']`\
  \ 中找到，如果未覆盖，它将定义为 `attributes/default.rb` 文件中指定的 `#{ENV['SYSTEMDRIVE']}\\\\inetpub\\\
  \\apps`。如果你使用的是简单的服务器设置（如 EC2 或原始安装），这很可能映射到目标主机上的 `C:\\\\inetpub\\\\apps`。要下载的文件由\
  \ `source` 属性指定，默认情况下将指向 `http://our.umbraco.org/ReleaseDownload?id=92348`。如果包已下载并解压缩，则由于\
  \ `not_if` 检查，该资源将被跳过，如以下代码片段所示：\n\n```ruby\nwindows_zipfile node['umbraco']['app_root']\
  \ do\n    source node['umbraco']['dist']\n    action :unzip\n    not_if {{::File.exists?(::File.join(node['umbraco']['app_root'],\n\
  \    \"umbraco\"))}}\nend\n```\n\n### 配置应用程序\n\nUmbraco 有一些目录，IIS 用户需要有权访问。以下代码块将确保我们授予\
  \ IIS 用户修改所需目录的权限：\n\n```ruby\n%w{App_Data Views css config media masterpages xslt\
  \ usercontrols bin\numbraco scripts images macroscripts}.each do |d|\n    directory\
  \ win_friendly_path(::File.join(node['umbraco']['app_root'],\n    d)) do\n     \
  \   rights [:read,:modify], 'IIS_IUSRS'\n    end\nend\n```\n\n同样，IIS 用户需要能够更新 `web.config`\
  \ 文件，以便在运行基于 Web 的安装实用程序时用一些设置对其进行更新。我们需要使用以下代码片段授予 IIS 用户对 `web.config` 文件的修改权限：\n\
  \n```ruby\nfile win_friendly_path(::File.join(node['umbraco']['app_root'], \"web.config\"\
  )) do\n    rights :modify, 'IIS_IUSRS'\nend\n```\n\n### 生成 IIS 池和站点\n\n一旦 IIS 服务已安装且应用程序代码已下载，我们需要为应用程序配置一个\
  \ IIS 池，指定要使用的 .NET 运行时版本（本例中为 4.0），如下所示：\n\n```ruby\niis_pool node['umbraco']['pool_name']\
  \ do\n  runtime_version \"4.0\"\n  action :add\nend\n```\n\n配置好池并部署文件后，指示 IIS 定义一个使用应用程序池的站点，路径指向我们站点根目录上的端口\
  \ 80。添加后，我们希望启动它（通过向 action 属性提供包含 :add 和 :start 的数组来指示）。路径指向解压缩的 Umbraco 安装目录 #{node['umbraco']['approot']}\\\
  umbraco，默认情况下将展开为 C:\\inetpub\\apps\\umbraco，如以下代码片段所示：\n\n```ruby\niis_site 'umbraco'\
  \ do\n  protocol :http\n  port 80\n  path node['umbraco']['app_root']\n  application_pool\
  \ node['umbraco']['pool_name']\n  action [:add,:start]\nend\n```\n\n### 执行安装\n\n\
  现在你知道食谱及其食谱在做什么了，让我们继续将食谱应用到我们的 Windows 主机上。这里，我们将通过以下步骤在 Windows 主机上安装 Umbraco\
  \ CMS：\n\n- 使用 Chef 客户端引导 Windows 服务器\n- 为 Umbraco CMS 应用程序创建角色\n- 将 `umbraco` 食谱添加到\
  \ Umbraco 角色的 `run_list`\n- 将新创建的角色应用到主机\n- 通过 Web 浏览器完成 CMS 的配置\n\n### 引导主机\n\n\
  在以下示例中，我们使用的是新安装 Windows 的 Windows Server 2012 主机。像往常一样，我们将使用 knife 引导主机，如下所示：\n\
  \n```ruby\nknife bootstrap windows winrm HOSTIP -x Administrator -d windows-chef-client-msi\n\
  ```\n\n这将在位于 HOSTIP 的主机上执行 windows-chef-client-msi.rb 引导模板的内容，安装 Chef 客户端并将主机注册到\
  \ Chef 服务。完成后，你将看到类似于以下屏幕截图的输出：\n\n```\nWARN: Node WIN-CJDQ9DE0JFK has an empty\
  \ run list.\nINFO: Chef Run complete in 1.985377 seconds\nINFO: Running report handlers\n\
  INFO: Report handlers complete\nINFO: Sending resource update report (run-id: 2b919690-3496-447a-a764-08aae2c705b9)\n\
  ```\n\n你可以从前面的屏幕截图中看到，主机是 WIN-CJDQ9DE0JFK，并且没有分配任何运行列表。这很合理，因为我们尚未为其分配任何 Chef 角色，因此没有可运行的内容。为了为我们的新主机分配角色，我们必须为新的\
  \ CMS 应用程序创建一个角色；这里，我们将创建一个名为 umbraco 的角色。\n\n### 创建角色\n\n上传食谱后（如前一章中所述），从以下 JSON\
  \ 创建一个角色，保存到文件 umbraco.json 中：\n\n```json\n{\n \"name\": \"umbraco\",\n \"description\"\
  : \"Umbraco CMS\",\n \"json_class\": \"Chef::Role\",\n \"default_attributes\": {\n\
  \ },\n \"override_attributes\": {\n },\n \"chef_type\": \"role\",\n \"run_list\"\
  : [\n  \"recipe[umbraco]\"\n ],\n \"env_run_lists\": {\n }\n}\n```\n\n\n\n\n\n从\
  \ JSON 文件创建角色，使用以下 `knife` 命令：\n\n`knife role from file umbraco.json`\n\n如你所见，前面的\
  \ JSON 文件定义了一个角色（由 `\"chef_type\": \"role\"` 指定），该角色声明其 `run_list` 包含一个条目，即 umbraco\
  \ 配方，如下面的代码片段所示：\n\n\"run_list\": [\n    \"recipe[umbraco]\"\n],\n\n## 将角色应用到节点\n\
  \n为了将角色应用到我们新引导的节点，我们需要获取主机列表，然后编辑其配置，并将新角色应用到主机的配置中，具体步骤如下：\n\n1. 首先，使用 `knife\
  \ node list` 获取节点列表，如下所示（在我们的例子中，只有一个主机，即新创建的主机）：\n\n   `knife node list`\n\n  \
  \ `WIN-CJDQ9DEOJFK`\n\n2. 使用 `knife node edit HOSTNAME` 编辑要在其中安装 Umbraco 的主机的节点配置，例如：\n\
  \n   `knife node edit WIN-CJDQ9DEOJFK`\n\n这将在编辑器中打开节点的配置 JSON，如下所示（在我们的例子中，是刚创建的主机的默认配置）：\n\
  \n```\n{\n    \"name\": \"WIN-CJDQ9DEOJFK\",\n    \"chef_environment\": \"_default\"\
  ,\n    \"normal\": {\n        \"tags\": [\n        ]\n    },\n    \"run_list\":\
  \ [\n    ]\n}\n```\n\n请注意，`run_list` 属性当前为空（如果你使用的是现有主机而不是新配置的主机，可能会略有不同）。按照以下方式，将\
  \ `umbraco` 角色添加到节点 JSON 的 `run_list` 属性下：\n\n```\n\"run_list\": [\n\t\"role[umbraco]\"\
  \n]\n```\n\n3. 使用 `knife` 将角色应用到所需节点，只需搜索所有带有 `umbraco` 角色的主机，如下所示：\n\n   ```\n\
  \   knife winrm 'role:umbraco' 'chef-client' -x Administrator\n   ```\n\n4. 你将在屏幕上看到\
  \ Chef 客户端的输出。完成后，假设一切顺利，你可以通过在主机上访问默认 HTTP 服务的 `/install` URL 来访问新安装的 Umbraco CMS（在此示例场景中，即\
  \ `http://WIN-CJDQ9DEOJFK/install`）。你将被引导完成最终 Umbraco 安装所需的步骤，例如选择数据库、创建管理员用户以及选择任何入门工具包和主题。\n\
  \n### 摘要\n\n此时，你应该已经在 Windows 服务器上拥有一个完全正常运行的 Umbraco 安装，无需手动配置任何内容。如你所见，如果需要，你可以通过简单地引导并配置这些主机的角色，将此过程重复到一台、几十台或几百台主机上。\n\
  \n在下一章中，让我们看看如何在引导阶段需要自定义配置时自动化主机配置，以及如何使用 Chef 管理云主机。\n"
- "## 5 使用 Chef 管理云服务\n\nChef 的一个非常强大的用途是将其用于将基础设施无缝扩展到云端，就像本地硬件一样。Chef 有多种机制可与流行的云服务提供商集成。在本章中，我们将了解如何使用\
  \ Chef 管理和部署软件到各种流行的云服务提供商。\n\n在本章中，我们将涵盖以下主题：\n\n- Microsoft Azure\n- AWS EC2\n\
  - Rackspace Cloud\n\n### 使用 Microsoft Azure\n\nAzure 是微软对 EC2 和 Rackspace Cloud\
  \ 的竞争对手。这三者都会为你提供 Windows 虚拟化，因此本章包含了如何将 Azure 与 Chef 集成的信息。\n\n`knife-azure` gem\
  \ 提供了通过 `knife` 实用程序控制 Azure 所需的功能。Chef 使用插件来提供扩展功能，包括管理云服务。Azure 支持存在于名为 `knife-azure`\
  \ 的 Ruby gem 中，并通过 `gem` 命令行实用程序安装，如下所示：\n\n```\ngem install knife-azure\n```\n\n\
  此命令将安装 `knife-azure` 依赖的所有 gem，而不仅仅是 Chef。\n\n> 就撰写本文时，`knife-azure` gem 依赖于旧版本的\
  \ bundler，这可能会导致问题，并可能要求你手动降低已安装 bundler 的版本。使用 RVM 或其他 Ruby 管理器将有助于隔离这些问题，并允许你管理\
  \ gem。\n\n### 下载管理证书\n\n为了使用 Azure API，你需要有一个管理证书来标识你与服务的身份。你可以从 `https://manage.windowsazure.com/`\
  \ `publishsettings/index?client=xplat` 创建并下载生成的管理证书。\n\n### 为 knife 配置 Azure\n\n\
  现在你已将管理证书放在 `.publishsettings` 文件中，`knife` 需要知道它。这通过 `knife.rb` 配置文件完成，正如你所料。要让\
  \ `knife` 知道在哪里找到你新下载的 `.publishsettings` 文件，首先将其移动到某个位置（例如你的主目录或 `$HOME/.chef`），然后将以下行添加到你的\
  \ `knife.rb` 文件中：\n\n`knife[:azure_publish_settings_file] = \"/path/to/publishsettings_file\"\
  `\n\n现在 `knife` 已拥有所需的所有信息，我们将能够向 Azure 发出 API 调用。\n\n### 创建新的 Azure 虚拟机\n\n为了创建新服务器，你需要知道使用哪个镜像；你可以使用\
  \ `azure` 插件的 `image list` 子命令查看可用镜像列表，如下所示：\n\n`knife azure image list`\n\nWindows-Server-2012-Essentials\
  \ Windows East Asia, Southeast Asia\nUbuntu-12_04_2-LTS-amd64-server Linux East\
  \ Asia, Southeast Asia\nWindows-Server-2008-R2 Windows West US, East Asia\n\n如你所见，输出将列出镜像标识符（为打印而缩短）、它们提供的平台以及可用区域。可用镜像列表会相当长，并且会随\
  \ Azure 添加更多基础镜像到其不断增长的列表而随时间变化；因此，每当你配置新虚拟机时，此命令都会很有用。此列表为你提供了构建新主机所需的两条信息：镜像标识符，以及该镜像可用的区域。\n\
  \n使用这些信息，让我们看看以下命令，了解我们如何配置一台新的 Windows Server 2012 Datacenter 版主机，拥有 127 GB 存储空间，位于美国西部数据中心，DNS\
  \ 名称为 `00c0ff3300`：\n\n```\nknife azure server create --azure-dns-name \"00c0ff3300\"\
  \ \\\n--azure-service-location \"West US\" \\\n--azure-source-image a699494373c04fc0bc8f2bb1389d6106__Windows-\n\
  Server-2012-Datacenter-201401.01-en.us-127GB.vhd \\\n--winrm-user 'azure' --winrm-password\
  \ '+0ps3kr3+' \\\n--distro 'windows-chef-client-msi'\n```\n\n发出此命令后，你将看到主机配置的状态随进度而变化。Chef\
  \ 将等待虚拟机配置完成并标记为就绪。在此期间，你可以使用以下命令查看状态以及 Azure 达到该状态所需的时间：\n\n```\nWaiting for virtual\
  \ machine to reach status 'provisioning'..... vm state\n'provisioning' reached after\
  \ 2.67 minutes\n```\n\n一旦主机处于就绪状态，Chef 将能够告诉你更多关于主机的信息，包括 IP 地址和 WinRM 端口。你应期望类似于以下命令的输出：\n\
  \n```\nDNS Name: 0c0ff330.cloudapp.net\nVM Name: 0c0ff330\nSize: Small\nAzure Source\
  \ Image: a699494373c04fc0bc8f2bb1389d6106__Windows-Server-\n2012-Datacenter-201401.01-en.us-127GB.vhd\n\
  Azure Service Location: West US\nPublic Ip Address: 138.91.227.224\nPrivate Ip Address:\
  \ 100.82.76.57\nWinRM Port: 5985\nEnvironment: _default\n```\n\n配置过程可能需要一段时间，具体取决于你选择的位置和基础镜像。在配置过程中，它将创建命令行中指定的\
  \ WinRM 用户，在此示例中为 azure，并使用指定的密码。但是，WinRM 的基本身份验证默认不会开启；Kerberos 身份验证默认会启用，但 Kerberos\
  \ 支持超出了本书的范围。因此，你将在此处遇到无法引导主机的错误，我们将在下一组步骤中通过启用 WinRM 的基本 HTTP 身份验证机制来修复此问题。\n\n\
  ### 引导你的 Azure 节点\n\n你的初始 **虚拟机**（VM）需要为 WinRM 启用基本身份验证；完成此操作后，你可以将新创建的镜像保存为可重用的\
  \ Azure 镜像，其中包含你的管理凭据和已启用 WinRM 基本身份验证。\n\n要为 WinRM 启用基本身份验证支持，你需要执行以下步骤：\n\n1.\
  \ 在 Azure 实例上启用 RDP。\n2. 使用远程桌面连接到新虚拟机，并使用配置阶段指定的凭据登录（在此示例中，帐户为 `azure`，密码为 `+0ps3kr3+`）。\n\
  3. 打开 Windows 命令提示符并运行以下命令，以允许 WinRM 接受基本 HTTP 身份验证：\n\n   ```\n   winrm set winrm/config/client/auth\
  \ @{Basic=\"true\"}\n   ```\n\n此时，你可以返回工作站，并使用 `knife bootstrap` 命令引导新主机，如下所示：\n\
  \n```\nknife bootstrap windows winrm 00c0ff3300.cloudapp.net \\\n  --winrm-user\
  \ azure \\\n  --winrm-transport ssl\n```\n\n前面的命令将提示你输入管理员密码。输入正确凭据后，你可以继续在新 Azure\
  \ 主机上引导 Chef 客户端并将其注册到 Chef 服务器。完成后，你可以使用 `node list` 命令验证其是否已正确注册，如下所示：\n\n```\n\
  $ knife node list\n00c0ff3300\ni-49117415\n```\n\n请注意，在我们的已注册节点中，新虚拟机现在已显示。\n\n\n\
  \n\n\n### 创建可重用的映像\n\n要从新创建的云服务器创建可重用映像，请使用以下说明：\n\n1. 通过 RDP 连接到虚拟机。\n2. 以管理员用户身份打开\
  \ **命令提示符** 窗口。\n3. 将目录更改为 `windows\\system32\\sysprep`，然后运行 `sysprep`。\n4. 在 **系统清理操作**\
  \ 中，单击 **进入系统初始体验 (OOBE)**，并确保选中 **通用化**。\n5. 在 **关机选项** 中，选择 **关机**。\n6. 单击 **确定**\
  \ 将准备主机并关闭虚拟机。\n7. 转到 Azure 管理门户并单击 **虚拟机**。\n8. 选择要捕获的虚拟机。\n9. 在页面底部的命令栏上，单击 **捕获**。\n\
  10. 在提供的对话框中为新映像键入名称；例如，我们将其命名为 `windows2012winrm`。\n11. 单击对勾标记以捕获映像。\n\n> 当你捕获虚拟机的映像时，原始机器将被删除。\n\
  \n12. 新映像现在可在 Web 控制面板上使用（在 **映像** 下），也可以通过 `knife azure image list` 命令找到。\n\n现在你已保存映像，可以使用它来生成预先配置了启用\
  \ WinRM 基本身份验证的新主机。如果在映像完成后运行命令，你将看到类似于以下输出的内容：\n\n`$ knife azure image list | grep\
  \ winrm`\n`windows2012winrm                      Windows West US`\n\n在此，我们筛选出仅包含单词\
  \ `winrm` 的映像，仅显示我们新创建的映像 `windows2012winrm`。你还会注意到，映像被锁定在创建它们的区域。\n\n你可以稍后使用映像名称的\
  \ `--azure-source-image` 值来预配主机，在我们的示例中该值为 `windows2012winrm`：\n\n`knife azure server\
  \ create --azure-dns-name \"0c0ff330\" \\\n--azure-service-location \"West US\"\
  \ \\\n--azure-source-image windows2012winrm \\\n--winrm-user 'azure' --winrm-password\
  \ '+0ps3kr3+' \\\n--distro 'windows-chef-client-msi'`\n\n使用 `knife azure server\
  \ list` 检查它是否已在 Azure 中创建，如以下代码所示：\n\n`knife azure server list`\n\n| DNS 名称 | VM\
  \ 名称 | 状态 | IP 地址 | SSH 端口 | WinRM 端口 |\n|---|---|---|---|---|---|\n| 0c0ff330.cloudapp.net\
  \ | 0c0ff330 | ready | 138.91.227.224 | 5985 | |\n\n如你所见，一旦你拥有具有所需功能的基础映像，就可以使用它以一致的方式快速为基础架构预配新主机。\n\
  \n### 管理 Amazon EC2 实例\n\nAmazon EC2 是一个非常流行的云计算平台，`knife` 通过 `knife-ec2` 插件支持从命令行管理\
  \ EC2 实例。在本节中，我们将演示使用 EC2 的以下步骤：\n\n- 安装 EC2 `knife` 插件\n- 使用 AWS 凭据配置 `knife`\n\
  - 查找所需的 **Amazon 机器映像 (AMI)**，即预构建的系统映像\n- 使用 `knife` 预配新主机\n- 引导新创建的主机\n- 使用角色配置新主机\n\
  \n### 安装 EC2 knife 插件\n\n从 Chef 0.10 开始，`ec2` 子命令已从 `knife` 的内置命令移至外部 gem `knife-ec2`。要使用\
  \ EC2 命令，你需要安装该 gem，可以使用以下命令完成：\n\n`gem install knife-ec2`\n\n这将安装 EC2 插件所需的所有 gem\
  \ 依赖项。\n\n### 设置 EC2 身份验证\n\n要管理 EC2 主机，你需要将 SSH 密钥对和 AWS 访问密钥设置在 `knife` 配置文件中。将\
  \ SSH 密钥对下载到主机上的某个位置（类 UNIX 系统上的 `$HOME/.ssh`），并将以下命令添加到 `knife.rb` 配置文件中：\n\n```\n\
  knife[:aws_access_key_id] = \"YOUR ACCESS KEY\"\nknife[:aws_secret_access_key] =\
  \ \"SECRET KEY\"\n```\n\n这些命令告诉 `knife` 在进行 API 调用以执行预配新主机和终止实例等操作时使用哪些 AWS 凭据。如果没有这些设置，`knife`\
  \ 将无法向 EC2 进行 API 调用。完成这些必要更改后，让我们看看如何使用 `knife` 创建新的 EC2 实例。\n\n### 预配 EC2 实例\n\
  \n最初，我们将查看使用 Windows 2012 Server AMI 之一预配实例。使用 `knife`，我们指定要使用的 AMI、要定位的可用区以及要创建的实例大小。例如，要在\
  \ `us-east-1e` 可用区中使用 Windows Server 2012 创建 `m1.large`，我们需要使用标识符为 `ami-2a80bd6f`\
  \ 的 AMI。可以通过 AWS EC2 控制面板或各种其他提供此信息的网站找到 AMI ID。在决定使用哪个 AMI 时，请记住某些 EC2 实例是 32 位的，某些是\
  \ 64 位的；根据你想要使用的实例类型、区域和存储方法选择合适的 AMI。\n\n预配新主机的操作可以简单地通过向 `knife` 提供 AMI、区域、规格和\
  \ SSH 密钥来完成，如以下命令所示：\n\n```\n[user]% knife ec2 server create -I ami-2a80bd6f \\\n\
  \    -f m1.large -Z us-west-la \\\n    -S jewartec2\n```\n\n运行此命令时，`knife` 将交互式地显示预配新主机的进度。以下是在该过程中你可能会看到的示例：\n\
  \n```\nInstance ID: i-3c5385d60\nFlavor: m1.large\nImage: ami-2a80bd6f\nRegion:\
  \ us-west-1\nAvailability Zone: us-west-la\n```\n\nSecurity Groups: default\nTags:\
  \ Name: i-3c5385d60\nSSH Key: jewartec2\n\nWaiting for instance...............\n\
  Public DNS Name: ec2-54-219-245-213.us-west-1.compute.amazonaws.com\nPublic IP Address:\
  \ 54.219.245.213\nPrivate DNS Name: ip-10-168-109-170.us-west-1.compute.internal\n\
  Private IP Address: 10.168.109.170\n\nWaiting for winrm..........\n\n如果你执行此操作，会发现它会在此处停留，并最终在尝试使用\
  \ WinRM 连接到新的 EC2 实例时超时。不幸的是，与 Azure 实例一样，WinRM 默认不允许 HTTP 基本身份验证，这使得引导主机变得有些棘手。但是，与\
  \ Azure 不同，EC2 允许你预配系统并在系统设置期间执行初始脚本。我们可以利用此功能在预配步骤期间在 Windows 中启用所需的功能，以便 Chef\
  \ 可以引导主机，并且可以将其作为一步过程进行管理。\n\n### 在 EC2 中执行自定义用户脚本\n\n使用 `knife` 带自定义初始化脚本预配 EC2\
  \ 实例是一个两步过程。首先要做的是在工作站上创建包含要执行的指令的文本文件作为脚本。完成后，你可以在使用 `knife` 预配主机时通过命令行参数将脚本提供给新创建的\
  \ EC2 实例。\n\n### 编写用户脚本\n\n我们将为 EC2 实例编写的脚本将负责执行以下操作：\n\n- 为 WinRM 启用基本 HTTP 身份验证\n\
  - 通过纯文本启用 WinRM（在生产环境中你可能需要调整此设置）\n- 增加每个 shell 实例的最大内存\n- 将 WinRM 超时增加到 30 分钟\n\
  - 向主机添加防火墙规则，以在端口 5985 和 5986 上启用 WinRM\n- 重启 WinRM 以确保它获取更改并设置为开机启动\n\n在以下代码中，我们指定正在运行\
  \ PowerShell 脚本，并将内容放在 `<powershell>...</powershell>` 块中：\n\n```\n<powershell>\n\
  winrm quickconfig -q\nwinrm set winrm/config/winrs '@{MaxMemoryPerShellMB=\"300\"\
  }'\nwinrm set winrm/config '@{MaxTimeoutms=\"1800000\"}'\nwinrm set winrm/config/service\
  \ '@{AllowUnencrypted=\"true\"}'\nwinrm set winrm/config/service/auth '@{Basic=\"\
  true\"}'\nnetsh advfirewall firewall add rule name=\"WinRM 5985\" protocol=TCP dir=in\
  \ localport=5985 action=allow\nnetsh advfirewall firewall add rule name=\"WinRM\
  \ 5986\" protocol=TCP dir=in localport=5986 action=allow\nnet stop winrm\nsc config\
  \ winrm start=auto\nnet start winrm\n</powershell>\n```\n\n### 提供自定义用户脚本\n\n现在我们有了自定义用户脚本，knife\
  \ 可以被告知使用 `--user-data` 命令行选项加载脚本。为了在 EC2 上获取随机生成的管理员密码，我们还需要传递 `--identity-file`\
  \ 选项，指向下载的 SSH 密钥对副本（在此示例中为 `$HOME/.ssh/jewartec2.pem`）：\n\n```\n$ knife ec2 server\
  \ create -I ami-5eccf31b -f m1.large \\\n    -Z us-west-la -S jewartec2 \\\n   \
  \ --user-data ec2userdata.txt \\\n    --identity-file $HOME/.ssh/jewartec2.pem\n\
  ```\n\n> 确保你的默认安全组允许连接到 WinRM（非 SSL 和 SSL 分别使用端口 5985 和 5986），或者指定允许此类连接的安全组。如果没有访问这些端口的权限，你将无法引导新预配的主机。\n\
  \n\n\n\n\n现在，你将看到实例已被配置并引导；我们的自定义脚本已启用 knife 通过 WinRM 连接并将 Chef 客户端安装到主机上。不过，这里你会看到一些不同之处；WinRM\
  \ 将预先配置并可正常工作，因此引导过程将在配置阶段成功。你将看到引导脚本在新虚拟机上呈现并执行。输出示例（缩短版）如下：\n\n```\nWaiting for\
  \ winrm..... done\n\nWaiting for Windows Admin password to be available...\nBootstrapping\
  \ Chef on ec2-54-193-161-138.us-west-1.compute.amazonaws.com\nRendering \"C:\\\\\
  Users\\\\ADMINI-~1\\\\AppData\\\\Local\\\\Temp\\\\bootstrap-293489-123904.\nbat\
  \ chunk 1\nRendering \"C:\\\\Users\\\\ADMINI-~1\\\\AppData\\\\Local\\\\Temp\\\\\
  bootstrap-293489-123904.\nbat chunk 2\nStarting chef to bootstrap the node...\n\
  C:\\\\Users\\\\Administrator>chef-client -c c:/chef/client.rb -j c:/chef/first-\n\
  boot.json -E _default\n[2014-03-19T08:11:30+00:00] INFO: *** Chef 11.10.4 ***\n\
  [2014-03-19T08:11:30+00:00] INFO: Chef-client pid: 8754\n```\n\n引导完成后，你将再次看到实例详细信息，其中包含更多信息，例如\
  \ EC2 实例根卷的类型、ID 和本地设备名称（无论它使用的是 EBS 还是实例存储）。\n\n> 偶尔，EC2 实例无法正确配置管理员密码。如果发生这种情况，在\
  \ WinRM 可用后，引导步骤将无法进行身份验证；请尝试丢弃该实例并配置一个新实例。\n\n主机配置完成且引导步骤结束后，假设没有错误，你可以按以下方式验证新配置的主机是否列在你的\
  \ Chef 服务中：\n\n$ knife node list\n0c0ff3300\ni-49117415\n\n输出将包含你在命令行中指定的新引导节点 ID，或者如果你未指定节点名称，则包含默认的\
  \ EC2 实例名称。如果你在上一节中配置了 Azure 实例，还会看到 Azure 实例名称。恭喜，你现在已使用仅两条命令配置了一台新的 Windows Server\
  \ EC2 实例，并将其注册到你的 Chef 服务中！\n\n### 终止 EC2 实例\n\n测试完成后，你可能不希望让 EC2 实例继续运行，因为它在空闲时会产生费用。为此，请执行以下步骤：\n\
  \n- 列出你的 EC2 实例。\n- 从 EC2 中删除服务器。\n- 从 Chef 中删除服务器。\n- 验证实例在 Chef 或 EC2 中不再存在。\n\
  \n要列出 EC2 实例，请使用 `ec2` 命令的 `server list` 子命令，它将列出指定区域中的所有 EC2 实例。如果未指定区域，`us-east-1`\
  \ 是默认区域。例如，在配置第一个主机后执行此命令将显示一个实例的列表。输出太宽，无法打印，但你还会在列表中看到诸如安全组、SSH 密钥、使用的 AMI、IAM\
  \ 配置文件以及虚拟主机当前状态等信息，如下所示：\n\n```\n$ knife ec2 server list\nInstance ID Name    \
  \         Public IP        Private IP       Flavor\ni-49117415  i-49117415  54.219.201.136\
  \  10.168.93.149  m1.large\n```\n\n删除实例与创建或列出实例一样简单。这里，`server delete` 子命令将与要终止的实例标识符一起调用。这将使用\
  \ EC2 API 发出终止命令——此操作不可逆转，因此命令会提示你确认是否真的要删除实例：\n\n```\n$ knife ec2 server delete\
  \ i-49117415\nInstance ID: i-49117415\nFlavor: m1.large\nImage: ami-5eccf31b\nRegion:\
  \ us-west-1\nAvailability Zone: us-west-1a\n```\n\n### 移除 Chef 节点\n\n此时，EC2 实例正在被终止并从你的账户中移除。但是，它并未从\
  \ Chef 服务中移除，这需要使用 `node delete` 命令单独完成。在以下代码中，指定的是 Chef 节点名称，而不是实例标识符：\n\n```\n\
  $ knife node delete i-49117415\nDo you really want to delete i-49117415? (Y/N) y\n\
  Deleted node[i-49117415]\n```\n\n使用 `node list` 验证节点是否已从 Chef 中移除，如下所示：\n\n```\n\
  $ knife node list\n00c0ff3300\n```\n\n输出应显示你的 EC2 实例不再与 Chef 注册。\n\n### 与 Rackspace\
  \ Cloud 交互\n\nRackspace Cloud 是另一个受 Chef 良好支持的流行云计算提供商。与 EC2 类似，Rackspace Cloud\
  \ 也有一个 `knife` 插件，如下所示：\n\n```\ngem install knife-rackspace\n```\n\nSecurity Groups:\
  \ default\nSSH Key: jewartec2\nRoot Device Type: ebs\nPublic DNS Name: ec2-54-219-201-136.us-west-1.compute.amazonaws.com\n\
  Public IP Address: 54.219.201.136\nPrivate DNS Name: ip-10-168-93-149.us-west-1.compute.internal\n\
  Private IP Address: 10.168.93.149\n\nDo you really want to delete this server? (Y/N)\
  \ y\nWARNING: Deleted server i-49117415\nWARNING: Corresponding node and client\
  \ for the i-49117415 server were not deleted and remain registered with the Chef\
  \ server\n\n此命令故意设置得详细一些。你最不想做的就是因为输入错误而销毁一个关键的运行实例。请务必仔细检查属性，以确保要终止的节点是你预期的那个。\n\
  \n与 AWS 要求一组凭据来与 API 交互以创建和终止实例一样，Rackspace Cloud 也有其自己的配置。但是，Rackspace Cloud API\
  \ 稍微简单一些；你需要向 knife 提供你的 Rackspace Cloud 用户名和 API 密钥。对于那些不知道自己 API 密钥的人，可以在 Rackspace\
  \ Cloud 控制面板中找到。要添加到 knife.rb 文件中的适当配置如下：\n\n```\nknife[:rackspace_api_username]\
  \ = \"Your Rackspace API username\"\nknife[:rackspace_api_key] = \"Your Rackspace\
  \ API Key\"\n```\n\n这些数据可以硬编码到配置文件中；由于 knife 配置文件只是 Ruby，数据可以通过评估环境变量或查看本地文件来生成。如果你将\
  \ knife.rb 文件提交到源代码仓库，这很有用，这样就不会泄露凭据。\n\n### 配置 Rackspace 实例\n\nRackspace Cloud\
  \ 服务器配置与 EC2 一样简单。由于 Rackspace 提供系统镜像的方式，传递给 knife 的命令行选项有一些差异。你不是使用实例大小和 AMI，而是指定要配置的系统规格（节点的\
  \ CPU、内存和磁盘分配）以及用于镜像实例的操作系统。为了确定有哪些规格可用，knife rackspace 插件提供了 rackspace flavor list\
  \ 子命令，如下所示：\n\n```\n$ knife rackspace flavor list --rackspace-region=IAD\n```\n\n\
  由于不同区域可能有不同的容量，因此检查你想要配置节点的区域中有哪些可用是个好主意。这将生成一个规格及其规格列表；截至目前，IAD 中的一些当前产品如下所示：\n\
  \n```\n$ knife rackspace flavor list --rackspace-region=IAD\nID Name VCPUs RAM Disk\n\
  2 512MB Standard Instance 1 512 20 GB\n3 1GB Standard Instance 1 1024 40 GB\n4 2GB\
  \ Standard Instance 2 2048 80 GB\n5 4GB Standard Instance 2 4096 160 GB\n```\n\n\
  除了知道要使用哪个规格的主机外，你还需要一个镜像标识符（类似于 AMI 标识符）来安装到新主机上。同样，此列表可能因区域而异并随时间变化，因此有一个命令来列出各种镜像，即\
  \ rackspace image list，如下所示：\n\n```\n$ knife rackspace image list --rackspace-region=IAD\
  \ | grep -i windows\ndb7692f7-3cfa-4a9f-a072-99b21bd126da Windows Server 2008 R2\
  \ SP1\na2139adc-df9b-98dc-aa10-5dcdff8a982b Windows Server 2012 + SQL Server\n7e106eaa-c863-49cb-bf5a-0cb7c7fc9ba1\
  \ Windows Server 2012 + SharePoint\n```\n\n如你所见，有多个可用的 Windows 发行版可供配置。为了配置新主机，你将使用\
  \ server create 命令，类似于 EC2 命令。以下 knife 命令将在 IAD 数据中心配置一台运行 Windows Server 2012 的\
  \ 1 GB 主机：\n\n```\n$ knife rackspace server create \\\n--I db7692f7-3cfa-4a9f-a072-99b21bd126da\
  \ \\\n--flavor 3 --rackspace-region=IAD \\\n--server-create-timeout 1800\n```\n\n\
  ### 将配置注入虚拟机\n\n与 EC2 类似，我们需要在配置主机时注入一些命令来打开防火墙并执行其他一些任务。将以下内容保存到文件 bootstrap.cmd\
  \ 中：\n\n```\nnet start w32time\nw32tm /config /manualpeerlist:\"0.pool.ntp.org 1.pool.ntp.org\
  \ 2.pool.ntp.org 3.pool.ntp.org\" /syncfromflags:manual /reliable:yes /update\n\
  w32tm /resync\nnetsh advfirewall firewall set rule group=\"remote administration\"\
  \ new enable=yes\nnetsh advfirewall firewall add rule name=\"WinRM Port\" dir-in\
  \ action=allow protocol=TCP localport=5985\n```\n\n此脚本将启动时间服务，同步时钟，并在端口 5985 上打开防火墙以允许\
  \ WinRM 连接。创建此文件后，我们需要将其注入到 Rackspace 虚拟机中，作为名为 C:\\cloud-automation\\bootstrap.cmd\
  \ 的特殊文件在配置时注入，并告诉 knife 使用 WinRM 而不是 SSH 来引导主机：\n\n\n\n$ knife rackspace server\
  \ create \\\n    -I db7692f7-3cfa-4a9f-a072-99b21bd126da \\\n    --flavor 3 --rackspace-region=IAD\
  \ \\\n    --server-create-timeout 1800 \\\n    --file \"C:\\\\cloud-automation\\\
  \\bootstrap.cmd=bootstrap.cmd\" \\\n    --bootstrap-protocol winrm \\\n    -x Administrator\n\
  \nAPI 响应配置新主机的请求后，您将看到该主机的 Rackspace 元数据，例如实例 ID、名称、flavor 和 image。之后，当 Rackspace\
  \ Cloud 启动新实例时，您将看到终端上打印出一系列点。值得注意的是，这可能需要大约 20 到 30 分钟，具体取决于 image、实例大小等因素。因此，修改\
  \ `--server-create-timeout` 参数的值可能是有意义的。完成后，您将看到类似于以下命令的输出：\n\n```\nInstance ID:\
  \ alad2318-28c4-47b7-a353-b6a99a7cc574\nName: rs-5889646228538071\nFlavor: 1GB Standard\
  \ Instance\nImage: Windows Server 2012\nMetadata: []\nRackConnect Wait: no\nServiceLevel\
  \ Wait: no\n........\nPublic DNS Name: mail.drizzlelabs.com\nPublic IP Address:\
  \ 162.209.101.233\nPrivate IP Address: 10.176.13.30\nWaiting for winrm...\nBootstrapping\
  \ Chef on 162.209.101.233\n```\n\n一旦 bootstrap 步骤完成，假设没有错误，您将看到 Chef 客户端已运行，类似于之前的执行，并且您将再次获得\
  \ image 数据。只有一点细微的差别；即，administrator 密码将在输出中提供给您，如下所示：\n\nPublic IP Address: 162.209.101.233\n\
  Private IP Address: 10.176.13.30\nPassword: P123atLaMNbd\nEnvironment: _default\n\
  \n您现在可以使用 `knife node list` 验证新配置的主机是否列在您的 Chef 服务中：\n\n```\n$ knife node list\n\
  0c0ff3300\nrs-5889646228538071\n```\n\n输出将包含您在命令行（通过 -N）指定的新 bootstrapped 节点 ID，或由\
  \ Rackspace 生成的名称（在此示例中，它将是 rs-5889646228538071）。恭喜，您已使用单个命令配置了新的 Rackspace 实例！\n\
  \n### 终止实例\n\n测试完成后，您可能不希望让 Rackspace 实例继续运行，因为它在空闲时会产生费用。为此，请执行以下步骤：\n\n- 列出您的\
  \ Rackspace 服务器。\n- 从 Rackspace 删除服务器。\n- 从 Chef 删除服务器。\n- 验证实例不再存在于 Chef 或 Rackspace\
  \ 中。\n\n要列出您的 Rackspace 实例，请使用 `rackspace` 命令的 `server list` 子命令，它将列出指定区域中的所有 Rackspace\
  \ 实例。类似于 EC2 `server list` 命令的输出，`rackspace` 服务器列表输出将如下所示：\n\n```\n$ knife rackspace\
  \ server list --rackspace-region=IAD\nInstance ID Name Public IP Private IP Flavor\n\
  alad2318-28c4 rs-5889646228538071 162.209.10 10.176.13.30 3\n```\n\n与其他服务器列表输出一样，这对于打印来说太宽了，但您将在结果中看到\
  \ image ID 和服务器的状态。在这里，我们新创建的虚拟主机应该处于 `active` 状态。\n\n删除实例只是一个命令——`rackspace server\
  \ delete` 子命令将使用要终止的 Rackspace 实例标识符调用。请记住，这是不可逆的，因此命令将提示您确认是否真的要删除实例：\n\n```\n\
  $ knife rackspace server delete alad2318-28c4-47b7-a353-b6a99a7cc574\nInstance ID:\
  \ alad2318-28c4-47b7-a353-b6a99a7cc574\nName: rs-5889646228538071\nFlavor: 1GB Standard\
  \ Instance\nImage: Windows Server 2012\nPublic IP Address: 162.209.101.233\nPrivate\
  \ IP Address: 10.176.13.30\nDo you really want to delete this server? (Y/N) y\n\
  WARNING: Deleted server alad2318-28c4-47b7-a353-b6a99a7cc574\nWARNING: Corresponding\
  \ node and client for the alad2318-28c4-47b7-a353-b6a99a7cc574 server were not deleted\
  \ and remain registered with the Chef server\n```\n\n### 删除 Chef 节点\n\n此时，Rackspace\
  \ 实例正在被终止并从您的帐户中删除。但是，它未从 Chef 服务中删除；这需要使用 `node delete` 命令单独完成。在以下代码中，指定的是 Chef\
  \ 节点名称，而不是实例标识符：\n\n```\n$ knife node delete rs-5889646228538071\n```\n\n使用以下命令验证节点是否已从\
  \ Chef 中删除：\n\n```\n$ knife node list\n0c0ff3300\n```\n\n### 摘要\n\n如您所见，Chef 对从命令行管理云服务器提供了强大的支持。您可以将云主机与物理基础架构相结合，使用\
  \ Chef 使您的系统具有可扩展性和弹性，这在以前可能无法实现。这些只是当今市场上最流行的三种云服务；Chef 对各种其他基础架构提供商也有越来越多的支持，并且随着时间的推移，此列表将不断增长。\n\
  \n现在您已经学习了如何编写食谱并使用流行的云服务扩展基础架构，让我们在下一章中看看一些高级主题，包括在 Chef 中测试食谱和多平台支持。\n\n### 超越基础\n\
  \n现在您已经了解了如何将 Chef 集成到 Windows 环境中，让我们看看一些高级主题，如下所示：\n\n- 管理异构网络\n- 处理多个平台\n- 版本控制和源代码管理\n\
  - 使用 ChefSpec 测试各种平台的食谱\n\n#### Chef 的声明式语言\n\nChef 食谱是声明式的，这意味着它提供了一种高级语言，用于描述为完成手头任务需要做什么，而不需要您提供特定的实现或过程。这意味着您可以专注于构建食谱和使用抽象资源建模基础架构，从而清楚发生了什么，而不需要知道它是如何发生的。以我们之前研究过的用于部署\
  \ IIS 应用程序的食谱的一部分为例，该部分负责安装某些 Windows 功能：\n\n```\nfeatures = %w{IIS-ISAPIFilter\
  \ IIS-ISAPIExtensions\nNetFx3ServerFeatures NetFx4Extended-ASPNET45\nIIS-NetFxExtensibility45}\n\
  \nfeatures.each do |f|\nwindows_feature f do\naction :install\nend\nend\n```\n\n\
  由于 Chef 的声明式语言，前面的代码段读起来很自然。我们有一个功能列表。对于其中的每个功能，我们知道它们是 Windows 功能，请安装它们。\n\n由于这种高级抽象，您的食谱可以描述正在发生的事情，而不包含执行实际工作所需的所有逻辑。如果您查看\
  \ windows cookbook，您会看到有许多使用 DISM、PowerShell 和 ServerManagerCmd 的实现。与其在食谱本身中担心这个问题，不如将逻辑推迟到为给定资源选择的提供程序。功能资源知道，如果主机有\
  \ DISM，它将使用 DISM 提供程序；否则，它将查找 servermanagercmd.exe 是否存在，如果存在，则将其用作安装提供程序。这使得食谱更具表现力，并且杂乱程度大大降低。\n\
  \n如果 Chef 不提供这种高级抽象，您的食谱将更像以下代码片段：\n\n```\nfeatures = %w{IIS-ISAPIFilter IIS-ISAPIExtensions\n\
  \               NetFx3ServerFeatures NetFx4Extended-ASPNET45\n               IIS-NetFxExtensibility45}\n\
  \nfeatures.each do |f|\n  if ::File.exists?(locate_cmd('dism.exe'))\n    install_via_dism(f)\n\
  \  elsif ::File.exists?(locate_cmd('servermanagercmd.exe'))\n    install_via_servermgrcmd(f)\n\
  \  else\n    fail\n  end\nend\n\ndef install_via_dism(feature_name)\n  ## some code\
  \ here to execute DISM\nend\n\ndef install_via_servermgrcmd(feature_name)\n  ##\
  \ some code here to execute servermgrcmd.exe\nend\n```\n\n这虽然可以理解，但会显著增加食谱的整体复杂性并降低可读性。现在，您不仅仅专注于安装功能，食谱中还包含了大量关于如何执行安装的逻辑。现在，想象一下编写一个需要创建文件并设置这些文件所有权，并且可以在多个平台上使用的食谱。如果没有抽象，食谱将包含如何确定平台是\
  \ Windows 还是 Linux、如何从字符串表示中确定用户或组 ID、不同平台上的文件权限是什么样子等实现细节。但是，使用 Chef 提供的抽象级别，该食谱将如下代码片段所示：\n\
  \n```\nfile_names = %w{hello.txt goodbye.txt README.md myfile.txt}\nfile_names.each\
  \ do |file_name|\n```\n\n\n\n\n\n### 处理多个平台\n\nChef 的优势之一是能够将 Windows 主机与非 Windows\
  \ 主机集成。不仅要开发能够同时支持 Linux 和 Windows 主机的食谱和 cookbook，还要在将其部署到基础设施之前对其进行彻底测试，这一点至关重要。让我们来看看如何在食谱中支持多个平台，以及如何使用流行的测试框架\
  \ ChefSpec 来编写测试，以测试食谱并验证特定于平台的行为。\n\n### 在 cookbook 中声明支持\n\n所有 Chef cookbook 都有一个\
  \ metadata.rb 文件；该文件概述了依赖项、所有权、版本数据和兼容性。在同构环境中，兼容性是一个不太重要的属性——所有主机都运行相同的操作系统。当你建模异构环境时，描述兼容性的能力就更加重要；如果没有它，你可能会尝试将仅适用于\
  \ Windows 的食谱应用到 Linux 主机上，或者反之亦然。为了指示 cookbook 支持的平台，你需要向 metadata.rb 文件添加一个或多个\
  \ supports 语句。例如，支持 Debian 和 Windows 的 cookbook 将有如下两个 supports 语句：\n\n```\nsupports\
  \ \"windows\"\nsupports \"debian\"\n```\n\n但是，如果你要支持大量不同的平台，可以始终对配置进行脚本化。例如，你可以使用类似于以下代码片段的内容：\n\
  \n```\n%w(windows debian ubuntu redhat fedora).each |os|\n  supports os\nend\n```\n\
  \n### 多平台食谱\n\n在以下代码示例中，我们将探讨如何在单个食谱中同时在 Windows 和 Debian 系统上安装 Apache（一种流行的 Web\
  \ 服务器）：\n\n```\nif platform_family? 'debian'\n  package 'apache2'\nelseif platform_family?\
  \ 'windows'\n  windows_package node['apache']['windows']['service_name'] do\n  \
  \  source node['apache']['windows']['msi_url']\n    installer_type :msi\n    # The\
  \ last four options keep the service from failing\n    # before the httpd.conf file\
  \ is created\n    options %W[\n      /quiet\n      INSTALLDIR=\"#{node['apache']['install_dir']}\"\
  \n      ALLUSERS=1\n      SERVERADMIN=#{node['apache']['serveradmin']}\n      SERVERDOMAIN=#{node['fqdn']}\n\
  \      SERVERNAME=#{node['fqdn']}\n    ].join(' ')\n  end\nend\ntemplate node['apache']['config_file']\
  \ do\n  source \"httpd.conf.erb\"\n  action :create\n  notifies :restart, \"service[apache2]\"\
  \nend\n## The apache service\nservice \"apache2\" do\n  if platform_family? 'windows'\n\
  \    service_name \"Apache#{node['apache']['version']}\"\n  end\n  action [ :enable,\
  \ :start ]\nend\n```\n\n在此示例中，我们在主机上执行 Apache 2.x 服务的非常基本的安装。没有启用任何模块，没有虚拟主机，也没有其他内容。但是，它确实允许我们定义一个食谱，该食谱将安装\
  \ Apache，生成一个 `httpd.conf` 文件，然后启用并启动 Apache 2 服务。你会注意到这里有一点特定于平台的配置，首先是如何安装软件包，其次是如何启用服务。\n\
  \n由于 package 资源不支持 Windows，因此 Windows 上的软件包安装将使用 `windows_package` 资源，而 Debian 主机上则使用\
  \ package 资源。\n\n为了使其正常工作，我们需要在安装期间应用一些配置数据；浏览食谱，我们发现需要一个类似于以下代码片段的配置哈希：\n\n```\n\
  'config': {\n    'apache': {\n        'version': '2.2.48',\n        'config_file':\
  \ '/opt/apache2/conf/httpd.conf',\n        'install_dir': '/opt/apache2',\n    \
  \    'serveradmin': 'admin@domain.com',\n        'windows': {\n            'service_name':\
  \ 'Apache 2.x',\n            'msi_url': 'http://some.url/apache2.msi'\n        }\n\
  \    }\n}\n```\n\n此食谱允许我们的配置在所有节点上保持一致；我们不需要覆盖任何配置值即可在 Linux 或 Windows 主机上使其正常工作。你可能会对自己说“但是，/opt/apache2\
  \ 在 Windows 上无法工作”。它可以工作，但它会被解释为 Chef 客户端当前工作目录所在驱动器上的 \\opt\\apache2；因此，如果你从 C:\
  \ 运行 Chef，它将变成 c:\\opt\\apache2。通过使配置保持一致，我们不需要构建任何特殊角色来将 Windows 配置与 Linux 配置分开存储。\n\
  \n如果你不喜欢在 Linux 和 Windows 主机上将 Apache 安装在同一目录中，你可以轻松修改食谱，添加一些条件逻辑，如下所示：\n\n```\n\
  apache_config_file = if platform_family? 'windows'\n    node['apache']['windows']['config_file']\n\
  else\n    node['apache']['linux']['config_file']\nend\n```\n\n```\ntemplate apache_config_file\
  \ do\n    source \"httpd.conf.erb\"\n    action :create\n    notifies :restart,\
  \ \"service[apache2]\"\nend\n```\n\n在此，食谱变得稍微复杂一些，以便适应两个平台，但其好处是具有一个一致的跨平台配置规范。\n\
  \n或者，你可以按原样使用食谱，并创建两个角色，一个用于 Windows Apache 服务器，另一个用于 Linux Apache 服务器，每个角色都有自己的配置。apache_windows\
  \ 角色可能具有以下覆盖配置：\n\n```\n'config': {\n    'apache': {\n        'config_file': \"\
  C:\\\\Apps\\\\Apache2\\\\Config\\\\httpd.conf\",\n        'install_dir': \"C:\\\\\
  Apps\\\\Apache2\"\n    }\n}\n```\n\n相比之下，apache_linux 角色可能具有类似于以下代码片段的配置：\n\n```\n\
  'config': {\n    'apache': {\n        'config_file': \"/usr/local/apache2/conf/httpd.conf\"\
  ,\n        'install_dir': \"/usr/local/apache2\"\n    }\n}\n```\n\n这种方法的影响是，现在你必须维护特定于平台的单独角色。当主机被配置或正在配置时（无论是通过控制面板还是通过\
  \ knife），你都需要记住它是 Windows 主机，因此与之关联的特定 Chef 角色。这会导致由于复杂性增加而可能出现主机配置错误。\n\n### 降低复杂性\n\
  \n使用 Chef 等工具的一些关键目标如下：\n\n- 尽量减少配置的复杂性\n- 提高自动化程度\n- 保证可重复性\n\n为了实现这些目标，重要的是要确保你不会引入不必要的复杂性。虽然\
  \ Chef 为你提供了使用其多级配置覆盖创建极其复杂的配置集的机制，但这很可能会导致麻烦。正如 Eric Allman 所说的一句流行引语：\n\n> \"\
  Unix 给你足够的绳子来吊死自己——然后再多几英尺，以确保万无一失。\"\n\n### 版本控制和源代码管理\n\nChef 的工作是存储 cookbook\
  \ 和配置数据，然后将正确的组合提供给它所知道的主机。Cookbook 维护着自己的版本概念以及其依赖项的版本。出于这个原因，重要的是将它们视为源代码控制项目的工件，并像对待任何其他软件库一样对它们进行适当的版本控制。保持可预测的版本控制方案有助于确保与其他\
  \ cookbook 的兼容性，并减少在添加新功能或重构代码时的冲突和错误。\n\n与任何其他软件项目一样，cookbook 版本通常以 `MAJOR.MINOR.PATCH`\
  \ 的形式表示。主版本号的更改表示公共 API 不向后兼容。例如，弃用或删除公共功能或公共 API 的行为不一致，都是进行主版本更新的充分理由。相比之下，当添加新功能但现有公共\
  \ API 向后兼容时，次要版本号会递增。实现新方法或添加对不同服务管理器的支持，都是增加次要版本的充分理由。修补级别在修复错误时递增，因此这些对公共 API\
  \ 应该是非常小的更改，如果有的话。有关良好版本控制实践的更多信息，请参阅 `http://semver.org`。\n\n此外，你可能会发现自己正在从公共存储库下载\
  \ cookbook。将它们提交到内部存储库（公共或私有）可能是有意义的，这样如果你对 cookbook 进行了更改，或者公共存储库消失，你就可以使用 cookbook\
  \ 代码的一个版本。\n\n对于任何复杂的系统，无论是软件包、工具还是基础设施配置，都可以说同样的话。重要的是看看你在哪里可以简化组件，以便它们不仅现在容易理解，而且将来由其他工程师（甚至可能是你自己在凌晨\
  \ 3 点试图拼命修复某个问题时）也能轻松理解。\n\n在可能的情况下，保持配置一致并依靠食谱来区分应用程序的配置方式是个好主意。请记住，保持对分散配置片段的心理模型通常比阅读代码要复杂得多。\n\
  \n\n\n\n\n一些组织将所有的 cookbook 都保存在一个仓库中；有些组织则保留多个仓库，每个 cookbook 对应一个。无论你选择哪种版本控制系统和仓库策略，将\
  \ cookbook 保存在源代码控制系统中，都是确保配方一致部署的关键部分。在本地进行更改，发出 `knife cookbook upload` 命令，然后忘记提交更改，这非常容易，结果可能会被其他人在稍后日期擦除。此外，在修改\
  \ cookbook 时，请确保递增版本号，即使它们仅供内部使用，以便清楚地识别 cookbook 的变化。\n\n如果你计划将配方发布到公共领域，你可能会采用每个仓库一个\
  \ cookbook 的方法，使 cookbook 成为一个完整且独立的实体。同样，最好确保包含某种许可证信息（通常以 `LICENSE` 文件的形式）以及某种\
  \ `README` 文件，其中包含有关 cookbook 的有用信息、示例用法、如何贡献等等。\n\n### 测试配方\n\n测试配方有多种方法；最简单的方法是将它们安装到\
  \ Chef 服务器上，并在测试主机上运行。只要你的客户端运行不会花费过长时间，这是一种可行的方法。然而，也许不出所料，还有更好的选择。其中一种选择是使用名为\
  \ `ChefSpec` 的库，它提供了类似于 `RSpec` 的功能，用于测试你的 cookbook。\n\n### RSpec 和 ChefSpec\n\n\
  对于那些没有使用过 `RSpec` 的人来说，它是一个用于测试 Ruby 代码的框架，允许你使用特定领域语言来提供测试。这在概念上类似于 Chef 用于管理基础设施的特定领域语言。`RSpec`\
  \ 和 `ChefSpec` 提供了一系列语言原语，用于表达代码执行、期望和外部组件的模拟。\n\n### 测试基础\n\n如果你是软件测试的新手，特别是测试\
  \ Ruby 代码，这是对我们将要介绍的一些概念的简要介绍。测试可以在软件生命周期的许多不同级别上进行，如下所示：\n\n- 单模块级别（称为单元测试）\n-\
  \ 多模块级别（称为功能测试）\n- 系统级测试（也称为集成测试）\n\n在 **测试驱动开发 (TDD)** 哲学中，测试被编写和执行得早且频繁，甚至在编写代码之前。这保证了，假设你的测试是准确的，你的代码从一开始就符合你的期望，并且不会退回到不符合要求的先前状态。本节不会深入探讨\
  \ TDD 哲学和持续测试，而是为你提供足够的知识，以开始测试你编写的配方，并对它们在部署到生产环境时能做正确的事情感到有信心。\n\n### RSpec\n\n\
  如前所述，RSpec 旨在提供一种更具表现力的测试语言。这意味着所提供的方法和原语被有意地设计为协同工作，以构建一种更高级的语言，感觉更像自然语言，例如英语。例如，使用\
  \ RSpec，可以编写以下代码：\n\n`factorial(4).should eq 24`\n\n如果你读一下，感觉就像“四的阶乘应该等于 24”。这是\
  \ RSpec 的 DSL 的目标，在阅读测试时感觉自然。将其与类似的 JUnit 测试（用于 Java）进行比较，如下所示：\n\n`assertEquals(24,\
  \ factorial(4));`\n\n虽然大多数程序员都能读懂，但它不那么自然。除此之外，RSpec 的 DSL 具有上下文和活动块，使测试更易于阅读。例如，我们可以使用\
  \ RSpec 如下：\n\n`describe Array do`\n`  it \"should be empty when created\" do`\n\
  `    Array.new.should == []`\n`  end`\n`end`\n\n同样，与类似的 NUnit (.NET 示例) 相比：\n\n\
  `namespace MyTest {`\n`  using System.Collection`\n`  using NUnit.Framework;`\n\
  `  [TestFixture]`\n`  public class ArrayTest {`\n`    [Test]`\n`    public void\
  \ NewArray() {`\n`      ArrayList list = new ArrayList();`\n`      Assert.AreEqual(0,\
  \ list.size());`\n`    }`\n`  }`\n`}`\n\n很明显，RSpec 测试要简洁得多，也更易于阅读，这是 RSpec 的目标。ChefSpec\
  \ 测试将 RSpec 的表现力带到 Chef cookbook 和配方中，通过在 RSpec 简单的测试语言之上提供 Chef 特定的原语和机制。\n\n###\
  \ ChefSpec\n\nChefSpec，对于那些没有使用过它的人来说，是任何 Chef 开发者工具集中的一个绝佳补充。它易于使用，并提供了一种方便的方式来为你的\
  \ cookbook 和配方添加测试。\n\n### 开始使用 ChefSpec\n\n为了开始使用 ChefSpec，你需要安装一个包含 ChefSpec 库和所有支持组件的\
  \ gem。不出所料，该 gem 名为 chefspec，可以通过运行以下命令简单安装：\n\n`gem install chefspec`\n\n然而，由于正在安装许多其他依赖项，这里有一个\
  \ Gemfile，用于将 gem 锁定到编写这些示例时使用的版本：\n\n```\nsource 'https://rubygems.org'\n\ngem\
  \ 'chef',\n    '11.10.0'\ngem 'chefspec',\n    '3.2.0'\ngem 'colorize',\n    '0.6.0'\n\
  ```\n\n为了使用 Gemfile，你需要安装 bundler；如果你使用 RVM，bundler 应该随你创建的每个 gem 集一起安装。如果没有，你需要自己通过键入以下代码行来安装它：\n\
  \n`gem install bundler`\n\n一旦 bundler 安装完成，并且包含上述代码行的 Gemfile 放置在你的 cookbook 根目录中，你可以从\
  \ cookbook 目录内执行以下命令：\n\n`bundle install`\n\nBundler 将解析 Gemfile 以下载和安装 chefspec、chef\
  \ 和 colorize，以及你尚未拥有的任何依赖项。安装完成后，你将希望在 cookbook 内创建一个 spec 目录，并创建一个 default_spec.rb\
  \ 文件。spec 文件的名称应与配方文件的名称匹配，因此如果你有一个名为 default.rb 的配方文件（大多数 cookbook 都会有），你将把 spec\
  \ 文件命名为 default_spec.rb。让我们来看看一个非常简单的配方和匹配的 ChefSpec 测试。\n\n如这里定义的配方，将简单地在目标主机上创建一个位于\
  \ /tmp/myfile.txt 的文件，如下所示：\n\n```\nfile \"/tmp/myfile.txt\" do\n  owner \"root\"\
  \n  group \"root\"\n  mode \"0755\"\n  action :create\nend\n```\n\n如以下代码片段所示的匹配测试，将验证我们的\
  \ cookbook 是否会按我们期望的那样工作：\n\n```\nrequire 'chefspec'\n\ndescribe 'demo_cookbook::default'\
  \ do\n  let(:chef_run) {\n    ChefSpec::Runner.new.converge(described_recipe)\n\
  \  }\n\n  it 'creates a file' do\n    expect(chef_run).to create_file('/tmp/myfile.txt')\n\
  \  end\nend\n```\n\n### 执行测试\n\n现在，为了运行它，我们使用 `rspec` 命令，它将使用 RSpec 语言将测试作为 Ruby\
  \ 脚本运行。在这里，它还将使用 ChefSpec 扩展，因为在我们的 spec 测试中，我们在顶部有 `require 'chefspec'` 行来包含 ChefSpec。以下示例使用\
  \ bundler 运行 RSpec，以便在执行前加载所有必需的 Ruby gem：\n\n`bundle exec rspec spec/default_spec.rb`\n\
  \n这将使用 bundler 运行 RSpec，它将确保加载 Gemfile 中指定的正确版本的 gem，并处理 `default_spec.rb` 文件。运行后，你应该看到测试结果，它们应该类似于以下输出：\n\
  \n```\nFinished in 0.17367 seconds\n1 example, 0 failures\n```\n\n这是 RSpec 告诉你它已完成，并且你有一个测试，零个失败。然而，如果我们有一个失败的测试，结果就会大不相同；RSpec\
  \ 会告诉我们哪个测试失败了以及原因。\n\n### 理解失败\n\nRSpec 非常擅长告诉你测试中出了什么问题；如果无法确定出了什么问题，有失败的测试对你也没有好处。当测试中的期望未得到满足时，RSpec\
  \ 会告诉你哪个期望未得到满足以及意外的值是什么。例如，让我们从以下代码中获取我们的演示配方文件资源：\n\n```\nfile \"/tmp/myfile.txt\"\
  \ do\n```\n\n让我们将其替换为不同的文件名，例如 myfile2.txt 而不是 myfile.txt，如以下代码所示：\n\n```\nfile\
  \ \"/tmp/myfile2.txt\" do\n```\n\n现在，如果我们重新运行 spec 测试，我们会发现测试现在失败了，因为 Chef 做了一些\
  \ spec 测试未预期的事情，如以下示例所示：\n\n```\n[user@host]$ bundle exec rspec spec/default_spec.rb\n\
  F\n\nFailures:\n\n1) demo_cookbook::default creates a file\n   Failure/Error: expect(chef_run).to\
  \ create_file('/tmp/myfile.txt')\n     expected \"file[/tmp/myfile.txt]\" with action\
  \ :create to be in Chef\n   run. Other file resources:\n\n   file[/tmp/myfile2.txt]\n\
  \n   # ./spec/default_spec.rb:9:in `block (2 levels) in <top (required)>'\n\nFinished\
  \ in 0.18071 seconds\n1 example, 1 failure\n```\n\n在前面的示例中，你可以看到 RSpec（与 ChefSpec\
  \ 配合使用）正在告诉我们，'demo_cookbook::default' 测试套件中的 'creates a file' 测试失败了。它还告诉我们，它在 default_spec.rb\
  \ 的第 9 行失败了（由包含 ./spec/default_spec.rb:9 的行指示），因为它期望文件资源 /tmp/myfile.txt 被 :create\
  \ 操作交互，但相反，配方与一个文件资源 /tmp/myfile2.txt 进行了交互。\n\n\n\n\n\n### 扩展你的测试\n\nChefSpec 提供了一套全面的工具用于测试你的食谱；你可以存根和模拟资源（用人工行为替换其真实行为），模拟不同平台，等等。让我们看看一些更复杂的示例，看看我们还可以用\
  \ ChefSpec 做些什么。让我们看一个假设的示例，用于模拟在 Windows 2012 上安装 MySQL，以及在这样的运行过程中我们可能想要验证的一些事情。以下代码示例演示了在\
  \ Windows 2012 主机上执行我们的食谱时的测试：\n\n```\ncontext 'when run on Windows 2012' do\n \
  \ let(:chef_run) do\n    # construct a 'runner' (simulate chef-client) running\n\
  \    # on a Windows 2012 host\n    runner = ChefSpec::ChefRunner.new(\n      'platform'\
  \ => 'windows',\n      'version' => '2012'\n    )\n    # set a configuration variable\n\
  \    runner.node.set['mysql']['install_path'] = 'C:\\\\temp'\n    runner.node.set['mysql']['service_user']\
  \ = 'SysAppUser'\n    runner.converge('mysql::server')\n  end\n\n  it 'should include\
  \ the correct Windows server recipe' do\n    chef_run.should include_recipe 'mysql::server_windows'\n\
  \  end\n\n  it 'should create an INI file in the right directory' do\n    ini_file\
  \ = \"C:\\\\temp\\\\mysql\\\\mysql.ini\"\n    expect(chef_run).to create_template\
  \ ini_file\n  end\nend\n```\n\n通过使用平台和版本选项构建 runner，测试将执行运行 `mysql::server` 食谱，并假装它正在\
  \ Windows 2012 主机上运行。这使我们可以设置关于将要创建的模板、正在执行的食谱以及在该特定平台上的更多内容的预期。假设 `mysql::server`\
  \ 食谱将在给定平台上委托给特定于操作系统的食谱，我们可以编写另一个测试，如下所示：\n\n```\ncontext 'when run on Debian'\
  \ do\n  let(:chef_run) do\n    runner = ChefSpec::ChefRunner.new(\n      'platform'\
  \ => 'debian'\n    )\n    runner.node.set['mysql']['install_path'] = '/usr/local'\n\
  \    runner.node.set['mysql']['service_user'] = 'mysql'\n    runner.converge('mysql::server')\n\
  \  end\n\n  it 'should include the correct Linux server recipe' do\n    chef_run.should\
  \ include_recipe 'mysql::server_linux'\n  end\n\n  it 'should create an INI file\
  \ in the right directory' do\n    ini_file = \"/usr/local/mysql/mysql.ini\"\n  \
  \  expect(chef_run).to create_template ini_file\n  end\n\n  it 'should install the\
  \ Debian MySQL package' do\n    expect(chef_run).to install_package('mysql-server')\n\
  \  end\nend\n```\n\n这样，我们可以编写测试来验证我们可能无法直接访问的平台上的预期行为，以确保它们将为一系列平台执行预期的操作。带有 ChefSpec\
  \ 扩展的 RSpec 为我们提供了强大的工具来测试我们的 cookbook 和食谱，这是迈向自动化管理的关键一步。\n\n### 总结\n\n到此为止，你已经了解了如何管理\
  \ Windows 主机、自动化部署和配置 IIS 应用、将基础设施扩展到云端，以及测试你的食谱和 cookbook。从中，你可以利用所学知识，开始开发高级的\
  \ Windows 特定食谱和支持多个平台的跨平台食谱，并使用 RSpec 和 ChefSpec 对它们进行测试。使用 Chef，你可以轻松管理异构的 Windows\
  \ 和 Linux 环境，将你的系统扩展到物理主机和云服务器，以满足基础设施的增长需求。\n"
