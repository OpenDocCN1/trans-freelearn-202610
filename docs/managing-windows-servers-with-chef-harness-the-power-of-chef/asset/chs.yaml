  \ <feedback@packtpub.com>，并在邮件主题中提及书名。\n\n如果你在某个主题上有专业知识，并有兴趣编写或参与编写书籍，请参阅我们在 **www.packtpub.com/authors**\
  \ 上的作者指南。\n\n## 客户支持\n\n既然你是 Packt 书籍的自豪拥有者，我们有许多东西可以帮助你充分利用你的购买。\n\n## 下载示例代码\n\
  \n你可以从 http://www.packtpub.com 的账户中下载所有购买的 Packt 书籍的示例代码文件。如果你在其他地方购买了本书，可以访问 http://www.packtpub.com/support\
  \ 并注册，以便将文件直接发送到你的邮箱。\n\n## 勘误\n\n尽管我们已尽一切努力确保内容的准确性，但错误仍会发生。如果你在我们的某本书中发现错误——也许是文本或代码中的错误——我们将不胜感激如果你能向我们报告。这样做，你可以帮助其他读者避免沮丧，并帮助我们改进本书的后续版本。如果你发现任何勘误，请访问\
  \ http://www.packtpub.com/submit-errata，选择你的书，单击勘误提交表单链接，并输入你的勘误详细信息。一旦你的勘误得到验证，你的提交将被接受，勘误将上传到我们的网站，或添加到该书名下现有勘误列表的勘误部分中。任何现有勘误都可以通过从\
  \ http://www.packtpub.com/support 选择你的书名来查看。\n\n## 盗版\n\n互联网上受版权保护材料的盗版是所有媒体中持续存在的问题。在\
  \ Packt，我们非常重视对我们的版权和许可的保护。如果你在互联网上以任何形式发现我们作品的非法副本，请立即向我们提供位置地址或网站名称，以便我们可以采取补救措施。\n\
