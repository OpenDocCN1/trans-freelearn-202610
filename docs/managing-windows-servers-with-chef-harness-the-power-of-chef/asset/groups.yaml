    \ Let's take a look at\nhow we could build a single recipe that is capable of\
    \ installing something on both\nWindows and Linux.\n\n# # Handling multiple platforms\n\
    \nOne of Chef's strengths is the ability to integrate Windows hosts with non-Windows\n\
    hosts. It is important to not only develop recipes and cookbooks that are capable\n\
    of supporting both Linux and Windows hosts, but also to be able to thoroughly\n\
    test them before rolling them out into your infrastructure. Let's take a look\
    \ at how\nyou can support multiple platforms in your recipes as well as use a\
    \ popular testing\nframework, ChefSpec, to write tests to test your recipes and\
    \ validate platform-\nspecific behaviors.\n\n# # Declaring support in your cookbook\n\
    \nAll Chef cookbooks have a metadata.rb file; this file outlines dependencies,\n\
    ownership, version data, and compatibility. Compatibility in a homogeneous\nenvironment\
    \ is a less important property — all the hosts run the same operating\nsystem.\
    \ When you are modeling a heterogeneous environment, the ability to describe\n\
    compatibility is more important; without it, you might try to apply a Windows-only\n\
    recipe to a Linux host or the other way around. In order to indicate the platforms\n\
    that are supported by your cookbook, you will want to add one or more supports\n\
    stanzas to the metadata.rb file. For example, a cookbook that supports Debian\
    \ and\nWindows would have two supports statements as follows:\n\n```\nsupports\
    \ \"windows\"\nsupports \"debian\"\n```\n\nHowever, if you were to support a lot\
    \ of different platforms, you can always script\nyour configuration. For example,\
    \ you could use something similar to the following\ncode snippet:\n\n```\n%w(windows\
    \ debian ubuntu redhat fedora).each |os|\n  supports os\nend\n```"
  - "[PAGE 90]\n\n# # Multiplatform recipes\n\nIn the following code example, we will\
    \ look at how we could install Apache, a popular web server, on both a Windows\
    \ and a Debian system inside of a single recipe:\n\n```\n```\nif platform_family?\
    \ 'debian'\n  package 'apache2'\nelseif platform_family? 'windows'\n  windows_package\
    \ node['apache']['windows']['service_name'] do\n    source node['apache']['windows']['msi_url']\n\
    \    installer_type :msi\n    # The last four options keep the service from failing\n\
    \    # before the httpd.conf file is created\n    options %W[\n      /quiet\n\
    \      INSTALLDIR=\"#{node['apache']['install_dir']}\"\n      ALLUSERS=1\n   \
    \   SERVERADMIN=#{node['apache']['serveradmin']}\n      SERVERDOMAIN=#{node['fqdn']}\n\
    \      SERVERNAME=#{node['fqdn']}\n    ].join(' ')\n  end\nend\ntemplate node['apache']['config_file']\
    \ do\n  source \"httpd.conf.erb\"\n  action :create\n  notifies :restart, \"service[apache2]\"\
    \nend\n# The apache service\nservice \"apache2\" do\n  if platform_family? 'windows'\n\
    \    service_name \"Apache#{node['apache']['version']}\"\n  end\n  action [ :enable,\
    \ :start ]\nend\n```\n```\n\nIn this example, we perform a very basic installation\
    \ of the Apache 2.x service on the host. There are no modules enabled, no virtual\
    \ hosts, or anything else. However, it does allow us to define a recipe that will\
    \ install Apache, generate an `httpd.conf` file, and then enable and start the\
    \ Apache 2 service. You will notice that there is a little bit of platform-specific\
    \ configuration going on here, first with how to install the package and second\
    \ with how to enable the service.\n\nBecause the package resource does not support\
    \ Windows, the installation of the package on Windows will use the `windows_package`\
    \ resource and the package resource on a Debian host."
