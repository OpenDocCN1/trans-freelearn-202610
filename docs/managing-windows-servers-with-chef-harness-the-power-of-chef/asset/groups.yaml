  md: "\nSome organizations keep all of their cookbooks inside of one repository;\
    \ some keep multiple repositories, one for each cookbook. Regardless of what version\
    \ control system and repository strategy you choose, keeping your cookbooks in\
    \ a source control system is a critical part of ensuring consistent deployment\
    \ of recipes. It is very easy to make changes locally, issue a `knife cookbook\
    \ upload` command, and then forget to commit your changes only to have them wiped\
    \ out by someone else at a later date. Additionally, make sure that you increment\
    \ version numbers as you modify your cookbooks, even if they are only for internal\
    \ use, to clearly identify changes in cookbooks.\n\nIf you plan to release your\
    \ recipes to the public, you will likely take a one-cookbook-per-repository approach\
    \ that makes the cookbook a complete and standalone entity. Also, it is a good\
    \ idea to make sure that you include some sort of license information (often in\
    \ the form of a `LICENSE` file) and some sort of `README` file to go along with\
    \ it that contains useful information about the cookbook, example usage, how to\
    \ contribute, and so on.\n\n## Testing recipes\n\nThere are a number of ways to\
    \ test your recipes; the simplest of which is to install them onto your Chef server\
    \ and run them against a test host. This is a viable approach as long as your\
    \ client runs do not take exceedingly long times to complete. However, there are,\
    \ perhaps unsurprisingly, better options out there. One of those options is to\
    \ use a library called `ChefSpec`, which provides functionalities similar to `RSpec`\
    \ for testing your cookbooks.\n\n## RSpec and ChefSpec\n\nFor those who have not\
    \ used `RSpec`, it is a framework for testing Ruby code that allows you to use\
    \ a domain-specific language to provide tests. This is similar in concept to Chef's\
    \ domain-specific language for managing infrastructure. `RSpec` and `ChefSpec`\
    \ provide a number of language primitives for expressing execution of code, expectations,\
    \ and mocking of external components.\n\n## Testing basics\n\nIf you are new to\
    \ testing software, and in particular testing Ruby code, this is a brief introduction\
    \ to some of the concepts that we will be covering. Testing can happen at many\
    \ different levels of the software lifecycle as follows:\n\n- Single-module level\
    \ (called unit tests)\n- Multimodule level (known as functional tests)\n- System-level\
    \ testing (also referred to as integration testing)\n\nIn the **test-driven-development\
    \ (TDD)** philosophy, tests are written and executed early and often, even before\
    \ code is written. This guarantees that, assuming your tests are accurate, your\
    \ code conforms to your expectations from the beginning and does not regress to\
    \ a previous state of nonconformity. This section will not delve deep into the\
    \ TDD philosophy and continuous testing, but rather provide you with enough knowledge\
    \ to begin testing the recipes that you write and feel confident that they will\
    \ do the correct thing when deployed into your production environment.\n\n## RSpec\n\
    \nAs mentioned earlier, RSpec is designed to provide a more expressive testing\
    \ language. What this means is that the methods and primitives provided intentionally\
    \ work together to build a higher-level language that feels more like a natural\
    \ language such as English. For example, using RSpec, one could write the following\
    \ code:\n\n`factorial(4).should eq 24`\n\nThis, if you read it, feels like \"\
    The factorial of four should equal 24\". This is the goal of RSpec's DSL, to feel\
    \ natural as you read your tests. Compare this to a similar JUnit test (for Java)\
    \ as follows:\n\n`assertEquals(24, factorial(4));`\n\nWhile this is readable by\
    \ most programmers, it does not feel as natural. In addition to this, RSpec's\
    \ DSL has contexts and activity blocks that make tests easier to read. For example,\
    \ we can use RSpec as follows:\n\n`describe Array do`\n`  it \"should be empty\
    \ when created\" do`\n`    Array.new.should == []`\n`  end`\n`end`\n\nAgain, compared\
    \ to a similar NUnit (.NET example):\n\n`namespace MyTest {`\n`  using System.Collection`\n\
    `  using NUnit.Framework;`\n`  [TestFixture]`\n`  public class ArrayTest {`\n\
    `    [Test]`\n`    public void NewArray() {`\n`      ArrayList list = new ArrayList();`\n\
    `      Assert.AreEqual(0, list.size());`\n`    }`\n`  }`\n`}`\n\nClearly, the\
    \ RSpec test is much more concise and easier to read, which is the goal of RSpec.\
    \ The ChefSpec test brings the expressiveness of RSpec to Chef cookbooks and recipes\
    \ by providing Chef-specific primitives and mechanisms on top of RSpec's simple\
    \ testing language.\n\n## ChefSpec\n\nChefSpec, for those who have not used it,\
    \ is a fantastic addition to any Chef developer's collection of tools. It is easy\
    \ to use and provides a convenient way to add tests to your cookbooks and recipes.\n\
    \n## Getting started with ChefSpec\n\nIn order to get started with ChefSpec, you\
    \ will need to install a gem that contains the ChefSpec libraries and all the\
    \ supporting components. Not surprisingly, that gem is named chefspec, and can\
    \ be installed simply by running the following command:\n\n`gem install chefspec`\n\
    \nHowever, as there are a number of other dependencies being installed, here is\
    \ a Gemfile being used to lock the gems to the versions used when writing these\
    \ examples:\n\n```\nsource 'https://rubygems.org'\n\ngem 'chef',\n    '11.10.0'\n\
    gem 'chefspec',\n    '3.2.0'\ngem 'colorize',\n    '0.6.0'\n```\n\nIn order to\
    \ use a Gemfile, you will need to have bundler installed; if you are using RVM,\
    \ bundler should be installed with every gem set you create. If you are not, you\
    \ will need to install it on your own by typing the following line of code:\n\n\
    `gem install bundler`\n\nOnce bundler is installed, and a Gemfile containing the\
    \ preceding code lines is placed in the root directory of your cookbook, you can\
    \ execute the following command from inside your cookbook's directory:\n\n`bundle\
    \ install`\n\nBundler will parse the Gemfile in order to download and install\
    \ chefspec, chef, and colorize, along with any dependencies you do not already\
    \ have. Once these are installed, you will want to create a spec directory inside\
    \ of your cookbook and create a default_spec.rb file. The name of the spec file\
    \ should match the name of the recipe files, so if you have a recipe file named\
    \ default.rb (which most cookbooks will), you would name your spec file default_spec.rb.\
    \ Let's take a look at a very simple recipe and matching ChefSpec test.\n\nThe\
    \ recipe, as defined here, will simply create a file at /tmp/myfile.txt on the\
    \ end host as follows:\n\n```\nfile \"/tmp/myfile.txt\" do\n  owner \"root\"\n\
    \  group \"root\"\n  mode \"0755\"\n  action :create\nend\n```\n\nThe matching\
    \ test, shown in the following code snippet, will verify that our cookbook would\
    \ do what we expected it to:\n\n```\nrequire 'chefspec'\n\ndescribe 'demo_cookbook::default'\
    \ do\n  let(:chef_run) {\n    ChefSpec::Runner.new.converge(described_recipe)\n\
    \  }\n\n  it 'creates a file' do\n    expect(chef_run).to create_file('/tmp/myfile.txt')\n\
    \  end\nend\n```\n\n## Executing tests\n\nNow, in order to run it, we use the\
    \ `rspec` command, which will run the test as a Ruby script using the RSpec language.\
    \ Here, it will also use the ChefSpec extensions because in our spec test we have\
    \ the line `require 'chefspec'` at the top to include ChefSpec. The following\
    \ example runs RSpec using bundler in order to load all the required Ruby gems\
    \ before execution:\n\n`bundle exec rspec spec/default_spec.rb`\n\nThis will run\
    \ RSpec using bundler, which will make sure that the correct versions of the gems\
    \ specified in the Gemfile are loaded and process the `default_spec.rb` file.\
    \ Once it runs, you should see the results of your tests, and they should look\
    \ something like the following output:\n\n```\nFinished in 0.17367 seconds\n1\
    \ example, 0 failures\n```\n\nThis is RSpec telling you that it completed and\
    \ that you had one test with zero failures. However, the results would be quite\
    \ different if we had a test that failed; RSpec would tell us which test failed\
    \ and why.\n\n## Understanding failure\n\nRSpec is very good at telling you what\
    \ went wrong with your tests; it doesn't do you any good to have failing tests\
    \ if it's impossible to determine what went wrong. When an expectation in your\
    \ test is not met, RSpec will tell you which expectation was unmet and what the\
    \ unexpected value was. For example, let's take our demonstration recipe file\
    \ resource from the following code:\n\n```\nfile \"/tmp/myfile.txt\" do\n```\n\
    \nLet's replace it with a different filename, such as myfile2.txt instead of myfile.txt,\
    \ as shown in the following code:\n\n```\nfile \"/tmp/myfile2.txt\" do\n```\n\n\
    Now, if we re-run our spec tests, we would see that our test is now failing because\
    \ Chef did something that was not expected by our spec test, as shown in the following\
    \ example:\n\n```\n[user@host]$ bundle exec rspec spec/default_spec.rb\nF\n\n\
    Failures:\n\n1) demo_cookbook::default creates a file\n   Failure/Error: expect(chef_run).to\
    \ create_file('/tmp/myfile.txt')\n     expected \"file[/tmp/myfile.txt]\" with\
    \ action :create to be in Chef\n   run. Other file resources:\n\n   file[/tmp/myfile2.txt]\n\
    \n   # ./spec/default_spec.rb:9:in `block (2 levels) in <top (required)>'\n\n\
    Finished in 0.18071 seconds\n1 example, 1 failure\n```\n\nIn the preceding example,\
    \ you can see that RSpec (in conjunction with ChefSpec) is telling us that the\
    \ test 'creates a file' in the 'demo_cookbook::default' test suite failed. It\
    \ also tells us that it failed on line 9 of default_spec.rb (as indicated by the\
    \ line containing ./spec/default_spec.rb:9) because it expected that the file\
    \ resource /tmp/myfile.txt be interacted with by the :create action, but instead\
    \ the recipe interacted with a file resource, /tmp/myfile2.txt.\n"
  mdcn: "\n\n一些组织将所有的 cookbook 都保存在一个仓库中；有些组织则保留多个仓库，每个 cookbook 对应一个。无论你选择哪种版本控制系统和仓库策略，将\
    \ cookbook 保存在源代码控制系统中，都是确保配方一致部署的关键部分。在本地进行更改，发出 `knife cookbook upload` 命令，然后忘记提交更改，这非常容易，结果可能会被其他人在稍后日期擦除。此外，在修改\
    \ cookbook 时，请确保递增版本号，即使它们仅供内部使用，以便清楚地识别 cookbook 的变化。\n\n如果你计划将配方发布到公共领域，你可能会采用每个仓库一个\
    \ cookbook 的方法，使 cookbook 成为一个完整且独立的实体。同样，最好确保包含某种许可证信息（通常以 `LICENSE` 文件的形式）以及某种\
    \ `README` 文件，其中包含有关 cookbook 的有用信息、示例用法、如何贡献等等。\n\n## 测试配方\n\n测试配方有多种方法；最简单的方法是将它们安装到\
    \ Chef 服务器上，并在测试主机上运行。只要你的客户端运行不会花费过长时间，这是一种可行的方法。然而，也许不出所料，还有更好的选择。其中一种选择是使用名为\
    \ `ChefSpec` 的库，它提供了类似于 `RSpec` 的功能，用于测试你的 cookbook。\n\n## RSpec 和 ChefSpec\n\n\
    对于那些没有使用过 `RSpec` 的人来说，它是一个用于测试 Ruby 代码的框架，允许你使用特定领域语言来提供测试。这在概念上类似于 Chef 用于管理基础设施的特定领域语言。`RSpec`\
    \ 和 `ChefSpec` 提供了一系列语言原语，用于表达代码执行、期望和外部组件的模拟。\n\n## 测试基础\n\n如果你是软件测试的新手，特别是测试\
    \ Ruby 代码，这是对我们将要介绍的一些概念的简要介绍。测试可以在软件生命周期的许多不同级别上进行，如下所示：\n\n- 单模块级别（称为单元测试）\n\
    - 多模块级别（称为功能测试）\n- 系统级测试（也称为集成测试）\n\n在 **测试驱动开发 (TDD)** 哲学中，测试被编写和执行得早且频繁，甚至在编写代码之前。这保证了，假设你的测试是准确的，你的代码从一开始就符合你的期望，并且不会退回到不符合要求的先前状态。本节不会深入探讨\
    \ TDD 哲学和持续测试，而是为你提供足够的知识，以开始测试你编写的配方，并对它们在部署到生产环境时能做正确的事情感到有信心。\n\n## RSpec\n\
    \n如前所述，RSpec 旨在提供一种更具表现力的测试语言。这意味着所提供的方法和原语被有意地设计为协同工作，以构建一种更高级的语言，感觉更像自然语言，例如英语。例如，使用\
    \ RSpec，可以编写以下代码：\n\n`factorial(4).should eq 24`\n\n如果你读一下，感觉就像“四的阶乘应该等于 24”。这是\
    \ RSpec 的 DSL 的目标，在阅读测试时感觉自然。将其与类似的 JUnit 测试（用于 Java）进行比较，如下所示：\n\n`assertEquals(24,\
    \ factorial(4));`\n\n虽然大多数程序员都能读懂，但它不那么自然。除此之外，RSpec 的 DSL 具有上下文和活动块，使测试更易于阅读。例如，我们可以使用\
    \ RSpec 如下：\n\n`describe Array do`\n`  it \"should be empty when created\" do`\n\
    `    Array.new.should == []`\n`  end`\n`end`\n\n同样，与类似的 NUnit (.NET 示例) 相比：\n\n\
    `namespace MyTest {`\n`  using System.Collection`\n`  using NUnit.Framework;`\n\
    `  [TestFixture]`\n`  public class ArrayTest {`\n`    [Test]`\n`    public void\
    \ NewArray() {`\n`      ArrayList list = new ArrayList();`\n`      Assert.AreEqual(0,\
    \ list.size());`\n`    }`\n`  }`\n`}`\n\n很明显，RSpec 测试要简洁得多，也更易于阅读，这是 RSpec 的目标。ChefSpec\
    \ 测试将 RSpec 的表现力带到 Chef cookbook 和配方中，通过在 RSpec 简单的测试语言之上提供 Chef 特定的原语和机制。\n\n\
    ## ChefSpec\n\nChefSpec，对于那些没有使用过它的人来说，是任何 Chef 开发者工具集中的一个绝佳补充。它易于使用，并提供了一种方便的方式来为你的\
    \ cookbook 和配方添加测试。\n\n## 开始使用 ChefSpec\n\n为了开始使用 ChefSpec，你需要安装一个包含 ChefSpec\
    \ 库和所有支持组件的 gem。不出所料，该 gem 名为 chefspec，可以通过运行以下命令简单安装：\n\n`gem install chefspec`\n\
    \n然而，由于正在安装许多其他依赖项，这里有一个 Gemfile，用于将 gem 锁定到编写这些示例时使用的版本：\n\n```\nsource 'https://rubygems.org'\n\
    \ngem 'chef',\n    '11.10.0'\ngem 'chefspec',\n    '3.2.0'\ngem 'colorize',\n\
    \    '0.6.0'\n```\n\n为了使用 Gemfile，你需要安装 bundler；如果你使用 RVM，bundler 应该随你创建的每个 gem\
    \ 集一起安装。如果没有，你需要自己通过键入以下代码行来安装它：\n\n`gem install bundler`\n\n一旦 bundler 安装完成，并且包含上述代码行的\
    \ Gemfile 放置在你的 cookbook 根目录中，你可以从 cookbook 目录内执行以下命令：\n\n`bundle install`\n\n\
    Bundler 将解析 Gemfile 以下载和安装 chefspec、chef 和 colorize，以及你尚未拥有的任何依赖项。安装完成后，你将希望在\
    \ cookbook 内创建一个 spec 目录，并创建一个 default_spec.rb 文件。spec 文件的名称应与配方文件的名称匹配，因此如果你有一个名为\
    \ default.rb 的配方文件（大多数 cookbook 都会有），你将把 spec 文件命名为 default_spec.rb。让我们来看看一个非常简单的配方和匹配的\
    \ ChefSpec 测试。\n\n如这里定义的配方，将简单地在目标主机上创建一个位于 /tmp/myfile.txt 的文件，如下所示：\n\n```\n\
    file \"/tmp/myfile.txt\" do\n  owner \"root\"\n  group \"root\"\n  mode \"0755\"\
    \n  action :create\nend\n```\n\n如以下代码片段所示的匹配测试，将验证我们的 cookbook 是否会按我们期望的那样工作：\n\
    \n```\nrequire 'chefspec'\n\ndescribe 'demo_cookbook::default' do\n  let(:chef_run)\
    \ {\n    ChefSpec::Runner.new.converge(described_recipe)\n  }\n\n  it 'creates\
    \ a file' do\n    expect(chef_run).to create_file('/tmp/myfile.txt')\n  end\n\
    end\n```\n\n## 执行测试\n\n现在，为了运行它，我们使用 `rspec` 命令，它将使用 RSpec 语言将测试作为 Ruby 脚本运行。在这里，它还将使用\
    \ ChefSpec 扩展，因为在我们的 spec 测试中，我们在顶部有 `require 'chefspec'` 行来包含 ChefSpec。以下示例使用\
    \ bundler 运行 RSpec，以便在执行前加载所有必需的 Ruby gem：\n\n`bundle exec rspec spec/default_spec.rb`\n\
    \n这将使用 bundler 运行 RSpec，它将确保加载 Gemfile 中指定的正确版本的 gem，并处理 `default_spec.rb` 文件。运行后，你应该看到测试结果，它们应该类似于以下输出：\n\
    \n```\nFinished in 0.17367 seconds\n1 example, 0 failures\n```\n\n这是 RSpec 告诉你它已完成，并且你有一个测试，零个失败。然而，如果我们有一个失败的测试，结果就会大不相同；RSpec\
    \ 会告诉我们哪个测试失败了以及原因。\n\n## 理解失败\n\nRSpec 非常擅长告诉你测试中出了什么问题；如果无法确定出了什么问题，有失败的测试对你也没有好处。当测试中的期望未得到满足时，RSpec\
    \ 会告诉你哪个期望未得到满足以及意外的值是什么。例如，让我们从以下代码中获取我们的演示配方文件资源：\n\n```\nfile \"/tmp/myfile.txt\"\
    \ do\n```\n\n让我们将其替换为不同的文件名，例如 myfile2.txt 而不是 myfile.txt，如以下代码所示：\n\n```\nfile\
    \ \"/tmp/myfile2.txt\" do\n```\n\n现在，如果我们重新运行 spec 测试，我们会发现测试现在失败了，因为 Chef 做了一些\
    \ spec 测试未预期的事情，如以下示例所示：\n\n```\n[user@host]$ bundle exec rspec spec/default_spec.rb\n\
    F\n\nFailures:\n\n1) demo_cookbook::default creates a file\n   Failure/Error:\
    \ expect(chef_run).to create_file('/tmp/myfile.txt')\n     expected \"file[/tmp/myfile.txt]\"\
    \ with action :create to be in Chef\n   run. Other file resources:\n\n   file[/tmp/myfile2.txt]\n\
    \n   # ./spec/default_spec.rb:9:in `block (2 levels) in <top (required)>'\n\n\
    Finished in 0.18071 seconds\n1 example, 1 failure\n```\n\n在前面的示例中，你可以看到 RSpec（与\
    \ ChefSpec 配合使用）正在告诉我们，'demo_cookbook::default' 测试套件中的 'creates a file' 测试失败了。它还告诉我们，它在\
    \ default_spec.rb 的第 9 行失败了（由包含 ./spec/default_spec.rb:9 的行指示），因为它期望文件资源 /tmp/myfile.txt\
    \ 被 :create 操作交互，但相反，配方与一个文件资源 /tmp/myfile2.txt 进行了交互。\n\n"
