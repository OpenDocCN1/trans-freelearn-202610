    cloud providers such as AWS, Rackspace Cloud, and Azure.


    Chapter 6, Going Beyond the Basics, focuses on the integration of existing systems
    in heterogeneous networks, how to deal with recipes and multiple platforms, testing,
    organization, and publishing of recipes.


