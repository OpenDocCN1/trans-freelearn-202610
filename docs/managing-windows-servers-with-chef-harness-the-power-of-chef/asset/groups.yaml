    \  overwrite true\nend\n```\n```\n\n# # Rebooting Windows\n\nOften times, Windows\
    \ needs to be rebooted to update system settings that have been changed during\
    \ the course of an installation or reconfiguration. The windows cookbook provides\
    \ the `windows_reboot` resource to notify `WindowsRebootHandler` that a reboot\
    \ is required. If `WindowsRebootHandler` is registered as a report handler, a\
    \ reboot will be requested upon a complete and successful execution of the Chef\
    \ client.\n\nTypically, this resource is notified by other resource blocks when\
    \ a reboot is required, often after installing new software or changing system\
    \ settings.\n\nYour recipe will need to make sure that the reboot handler is included\
    \ with the following command:\n\n```\n```ruby\ninclude_recipe 'windows::reboot_handler'\n\
    ```\n```"
  - "[PAGE 55]\n\nThe following table outlines the actions and parameters that can\
    \ be associated with\nthe `windows_reboot` resource:\n\n| Action    | Description\
    \    |\n|-----------|----------------|\n| request   | This requests a reboot to\
    \ be scheduled once the Chef client has\ncompleted execution. This requires `WindowsRebootHandler`\n\
    to be registered as a report handler.    |\n| cancel    | This cancels any pending\
    \ reboot requests by changing the node .\n`run_state` setting.    |\n| **Parameter**\
    \ | **Description**    |\n| reason    | This is a textual reason that the system\
    \ is being rebooted.\nThe default value is `Chef initiated reboot`.    |\n| timeout\
    \   | This is the name attribute that specifies how long the command will\nwait\
    \ in seconds until rebooting.\nThe default value is 60.    |\n\n# ## Examples\
    \ of scheduling a reboot\n\nThe following example shows you how to schedule a\
    \ reboot with a three-minute\ntimeout at the end of a Chef client run by notifying\
    \ the reboot block when a package\nis successfully installed via `windows_package`:\n\
    \n```\n```ruby\nwindows_reboot 180 do\n  reason \"Installed a new package\"\n\
    \  action :nothing\nend\n```\n```\n\n```\n```ruby\nwindows_package 'sql_server'\
    \ do\n  action :install\n  notifies :request, 'windows_reboot[180]'\nend\n```\n\
    ```\n\nIf you need to cancel a reboot, you can do so from a resource block using\
    \ the\nfollowing code:\n\n```\n```ruby\nwindows_reboot do\n  action :cancel\n\
    end\n```\n```"
