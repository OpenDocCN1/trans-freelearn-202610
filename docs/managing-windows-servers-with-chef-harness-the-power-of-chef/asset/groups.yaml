    +   - Supported platforms and technologies


    # ## Working with Windows


    For those who are new to Chef, the client-side components of it are written in
    Ruby, a very popular language. Due to the cross-platform nature of Ruby, support
    for Windows is as straightforward as support for Linux and UNIX-like systems and
    has been around for quite some time now, dating back to the release of the **knife-windows**
    gem circa 2011.'
