  mdcn: "\n\n## 扩展你的测试\n\nChefSpec 提供了一套全面的工具用于测试你的食谱；你可以存根和模拟资源（用人工行为替换其真实行为），模拟不同平台，等等。让我们看看一些更复杂的示例，看看我们还可以用\
    \ ChefSpec 做些什么。让我们看一个假设的示例，用于模拟在 Windows 2012 上安装 MySQL，以及在这样的运行过程中我们可能想要验证的一些事情。以下代码示例演示了在\
    \ Windows 2012 主机上执行我们的食谱时的测试：\n\n```\ncontext 'when run on Windows 2012' do\n\
    \  let(:chef_run) do\n    # construct a 'runner' (simulate chef-client) running\n\
    \    # on a Windows 2012 host\n    runner = ChefSpec::ChefRunner.new(\n      'platform'\
    \ => 'windows',\n      'version' => '2012'\n    )\n    # set a configuration variable\n\
    \    runner.node.set['mysql']['install_path'] = 'C:\\\\temp'\n    runner.node.set['mysql']['service_user']\
    \ = 'SysAppUser'\n    runner.converge('mysql::server')\n  end\n\n  it 'should\
    \ include the correct Windows server recipe' do\n    chef_run.should include_recipe\
    \ 'mysql::server_windows'\n  end\n\n  it 'should create an INI file in the right\
    \ directory' do\n    ini_file = \"C:\\\\temp\\\\mysql\\\\mysql.ini\"\n    expect(chef_run).to\
    \ create_template ini_file\n  end\nend\n```\n\n通过使用平台和版本选项构建 runner，测试将执行运行 `mysql::server`\
    \ 食谱，并假装它正在 Windows 2012 主机上运行。这使我们可以设置关于将要创建的模板、正在执行的食谱以及在该特定平台上的更多内容的预期。假设 `mysql::server`\
    \ 食谱将在给定平台上委托给特定于操作系统的食谱，我们可以编写另一个测试，如下所示：\n\n```\ncontext 'when run on Debian'\
    \ do\n  let(:chef_run) do\n    runner = ChefSpec::ChefRunner.new(\n      'platform'\
    \ => 'debian'\n    )\n    runner.node.set['mysql']['install_path'] = '/usr/local'\n\
    \    runner.node.set['mysql']['service_user'] = 'mysql'\n    runner.converge('mysql::server')\n\
    \  end\n\n  it 'should include the correct Linux server recipe' do\n    chef_run.should\
    \ include_recipe 'mysql::server_linux'\n  end\n\n  it 'should create an INI file\
    \ in the right directory' do\n    ini_file = \"/usr/local/mysql/mysql.ini\"\n\
    \    expect(chef_run).to create_template ini_file\n  end\n\n  it 'should install\
    \ the Debian MySQL package' do\n    expect(chef_run).to install_package('mysql-server')\n\
    \  end\nend\n```\n\n这样，我们可以编写测试来验证我们可能无法直接访问的平台上的预期行为，以确保它们将为一系列平台执行预期的操作。带有 ChefSpec\
    \ 扩展的 RSpec 为我们提供了强大的工具来测试我们的 cookbook 和食谱，这是迈向自动化管理的关键一步。\n\n## 总结\n\n到此为止，你已经了解了如何管理\
    \ Windows 主机、自动化部署和配置 IIS 应用、将基础设施扩展到云端，以及测试你的食谱和 cookbook。从中，你可以利用所学知识，开始开发高级的\
    \ Windows 特定食谱和支持多个平台的跨平台食谱，并使用 RSpec 和 ChefSpec 对它们进行测试。使用 Chef，你可以轻松管理异构的 Windows\
    \ 和 Linux 环境，将你的系统扩展到物理主机和云服务器，以满足基础设施的增长需求。\n\n## 索引\n\n### A\n\n- Amazon EC2\n\
