    # # Managing Amazon EC2 instances


    Amazon EC2 is a very popular cloud-computing platform, and `knife` has support

    for managing EC2 instances from the command line through the `knife-ec2` plugin.

    In this section, we will demonstrate the following steps for working with EC2:


    +   • Installing the EC2 `knife` plugin

    +   • Configuring `knife` with your AWS credentials

    +   • Finding the desired **Amazon Machine Image (AMI)**, a pre-built

    +   system image

    +   • Provisioning a new host with `knife`

    +   • Bootstrapping the newly created host

    +   • Configuring the new host with a role


    # # Installing the EC2 knife plugin


    As of Chef 0.10, the `ec2` subcommands have been moved from being built-in to

    `knife` into an external gem, `knife-ec2`. In order to use EC2 commands, you will

    need to install the gem, which can be done with the help of the following command:


    `gem install knife-ec2`


    This will install all of the gem dependencies that the EC2 plugin requires.'
  - "[PAGE 75]\n\n# # Setting up EC2 authentication\n\nIn order to manage your EC2\
    \ hosts, you will need your SSH key pair and your AWS access keys set in your\
    \ `knife` configuration file. Download your SSH key pair somewhere on your host\
    \ (`$HOME/.ssh` on UNIX-like systems) and add the following commands to your `knife.rb`\
    \ configuration file:\n\n```\n```\nknife[:aws_access_key_id] = \"YOUR ACCESS KEY\"\
    \nknife[:aws_secret_access_key] = \"SECRET KEY\"\n```\n```\n\nThese tell `knife`\
    \ which AWS credentials to use when making API calls to perform actions such as\
    \ provision new hosts and terminate instances. Without this, `knife` will be unable\
    \ to make API calls to EC2. With these required changes made, let's look at how\
    \ to create a new EC2 instance with `knife`.\n\n# # Provisioning an EC2 instance\n\
    \nInitially, we will look at provisioning an instance using one of the Windows\
    \ 2012 Server AMIs. With `knife`, we specify the AMI to use, which availability\
    \ zone to target, and what size instance to create. For example, to create `m1.large`\
    \ in the `us-east-1e` availability zone with Windows Server 2012, we would need\
    \ to use the AMI with `ami-2a80bd6f` as its identifier. The AMI ID can be found\
    \ through the AWS EC2 dashboard or a variety of other websites that vend this\
    \ information. Remember when deciding which AMI to use that some of the EC2 instances\
    \ are 32-bit and some are 64-bit; choose the appropriate AMI based on the instance\
    \ type, region, and storage method you want to use.\n\nThe act of provisioning\
    \ a new host can be achieved simply by providing `knife` with the AMI, region,\
    \ flavor, and SSH keys, as shown in the following command:\n\n```\n```\n[user]%\
    \ knife ec2 server create -I ami-2a80bd6f \\\n    -f m1.large -Z us-west-la \\\
    \n    -S jewartec2\n```\n```\n\nWhen you run this command, `knife` will interactively\
    \ show you the progress of provisioning a new host. The following is an example\
    \ of what you can expect to see during this process:\n\n```\n```\nInstance ID:\
    \ i-3c5385d60\nFlavor: m1.large\nImage: ami-2a80bd6f\nRegion: us-west-1\nAvailability\
    \ Zone: us-west-la\n```\n```"
