    # # The Chef 10.x resource


    The `windows_registry` resource allows you to control registry settings, but has
    different actions and attributes than the `registry_key` resource. Moving from
    `windows_registry` to `registry_key` should be a fairly straightforward operation
    when it is time to migrate.


    The following table provides a description of the actions and parameters used
    with the `windows_registry` resource:


    | Action | Description |

    | --- | --- |

    | `create` | This creates a new registry key with the provided data. |

    | `modify` | This updates an existing registry key with the desired values. |

    | `force_modify` | This modifies an existing registry key''s values but does so
    inconsistently. This action checks the value a number of times to make certain
    that the key contains your desired value. |

    | `remove` | This removes a value from an existing registry key. |

    | **Parameter** | **Description** |

    | `key_name` | This is the resource name attribute specifying which registry key
    to create, modify, or remove. |

    | `values` | This is a hash of the values to set under the registry key. The individual
    hash items will become respective `''Value name'' => ''Value data''` items in
    the registry key. |

    | `type` | This determines the type of key to create. The following is a list
    of options: |

    | | • `:binary`: REG_BINARY |

    | | • `:dword`: REG_DWORD |

    | | • `:dword_big_endian`: REG_DWORD_BIG_ENDIAN |

    | | • `:expand_string`: REG_EXPAND_SZ |

    | | • `:multi_string`: REG_MULTI_SZ |

    | | • `:string`: REG_SZ |

    | | • `:qword`: REG_QWORD |

    | | The default value is `:string`. |'
