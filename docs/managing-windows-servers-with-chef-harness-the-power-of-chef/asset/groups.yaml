    # # Terminating an EC2 instance


    Once you are done with testing, you may not want to leave the EC2 instance running,
    as it will incur costs while idle. To do this, perform the following steps:


    +   1. List your EC2 instances.

    +   2. Delete the server from EC2.

    +   3. Remove the server from Chef.

    +   4. Verify that the instance no longer exists in Chef or EC2.


    To list our EC2 instances, use the `server list` subcommand of the `ec2` command,
    which will list all of the EC2 instances in the specified region. If you do not
    specify a region, `us-east-1` is the default region. As an example, executing
    this command after provisioning the first host will show a list of one instance.
    The output is too wide for printing, but you will also see in the list information
    such as the security groups, SSH key, AMI used, IAM profile, and current state
    of the virtual host as follows:


    ```

    ```

    $ knife ec2 server list

    Instance ID Name             Public IP        Private IP       Flavor

    i-49117415  i-49117415  54.219.201.136  10.168.93.149  m1.large

    ```

    ```


    Deleting an instance is just as easy as creating or listing them. Here, the `server
    delete` subcommand is invoked with the instance identifier to be terminated. This
    will use the EC2 API to issue a terminate command — this is not reversible and
    so the command will prompt you to ensure whether you really do want to delete
    the instance:


    ```

    ```

    $ knife ec2 server delete i-49117415

    Instance ID: i-49117415

    Flavor: m1.large

    Image: ami-5eccf31b

    Region: us-west-1

    Availability Zone: us-west-1a

    ```

