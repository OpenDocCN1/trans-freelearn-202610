    \ 脚本，它将一行文本写入文件：\n\n```\npowershell \"say-hello\" do\n  code <<-EOH\n    $stream\
    \ = [System.IO.StreamWriter] \"C:\\\\hello.txt\"\n    $stream.WriteLine(\"Hello\
    \ world!\")\n    $stream.Close()\n  EOH\nend\n```\n\n前面的代码允许你在配方中通过执行在受管系统上定义的脚本来充分发挥\
    \ PowerShell 的全部功能。这些脚本甚至可以从配方中的配置数据和其他变量动态生成。\n\n## 与 Linux 类系统集成\n\n随着时间的推移，拥有异构网络变得越来越常见。某些软件要么不存在，要么在一个平台上的支持不如在另一个平台上好。因此，管理员会遇到需要部署和管理并行运行多种操作系统的主机的情况。集成\
    \ Windows 和 Linux 类系统伴随着其自身的一系列挑战，Chef 通过提供一种与 Linux 和 Windows 类系统交互的一致方式来帮助解决这些问题。\n\
    \n对于管理此类基础架构（具体来说，是运行 Windows 和 Linux 组合的系统集合）的任何人来说，Chef 有一些惊人的功能。因为它能够使用相同的声明语言和配置数据来对\
    \ Windows 和 Linux 系统进行建模，你可以使用同一工具轻松配置 Linux 和 Windows 系统。\n\n例如，你可以拥有一个配方书，其中包含一个配置网络主机防火墙的配方。该配方可以搜索\
    \ Chef 的配置数据，查找网络中所有其他主机，收集它们的 IP 地址列表，并打开通往所有这些 IP 地址的流量。如果你配置了一个新主机，所有受管主机都会自动了解新主机并添加一条新的防火墙规则。此外，因为\
    \ Chef 提供了自己的声明语言来隐藏实现细节，你可以专注于想要实现的目标，而不是如何实现它。Chef 知道它正在运行的平台，以及如何加载资源的特定于系统的实现，例如网络接口、防火墙、用户、文件等。完全有可能编写配方来安装\
    \ Apache 或 MySQL，这些配方可以在 Linux 和 Windows 平台上工作。\n\n这使得集成任意数量的 Windows 和 Linux\
    \ 系统变得更加容易，而无需维护多套脚本来实现相同的最终目标。例如，假设你同时拥有 Windows 和 Linux 的防火墙配方书，那么可以编写类似于以下的配方：\n\
    \n```\nsearch(:node, 'role:web_server').each do |node|\n  ip = node[:external_ip]\n\
    \  firewall_rule \"#{ip}\" do\n    source \"#{ip}\"\n    action :allow\n  end\n\
    end\n```\n\n在前面的代码中，我们正在搜索所有具有 web_server 角色的节点，并调用 firewall_rule 资源以允许来自该源的流量。请注意，配方并未引用\
    \ Windows 防火墙软件或 Linux 的防火墙工具 iptables。相反，Chef 的自定义语言允许我们描述我们正在做什么，而不是如何实现我们的目标。“如何”在提供程序中实现，“什么”由资源描述，两者都在我们的防火墙配方书中提供。\n\
    \n"
