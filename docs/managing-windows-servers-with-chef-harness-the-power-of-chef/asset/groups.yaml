    # # Managing Cloud Services with Chef


    Security Groups: default

    Tags: Name: i-3c5385d60

    SSH Key: jewartec2


    Waiting for instance...............

    Public DNS Name: ec2-54-219-245-213.us-west-1.compute.amazonaws.com

    Public IP Address: 54.219.245.213

    Private DNS Name: ip-10-168-109-170.us-west-1.compute.internal

    Private IP Address: 10.168.109.170


    Waiting for winrm..........


    If you were to execute this, you would find that it would sit at this point and

    eventually timeout trying to connect to the new EC2 instance using WinRM.

    Unfortunately, as with Azure instances, WinRM does not allow HTTP basic

    authentication by default, making it a bit tricky to bootstrap the host. However,

    unlike Azure, EC2 allows you to provision a system and provide an initial script

    that is executed during the setup of the system. We can leverage this to enable

    the features we need in Windows during the provisioning step so that Chef

    can bootstrap the host, and it can be managed as a one-step process.


    # # Executing custom user scripts in EC2


    Provisioning an EC2 instance with a custom initialization script using `knife`
    is a

    two-step process. The first thing to be done is to create the script as a text
    file on

    your workstation containing the instructions to execute. Once you have that, you

    can provide the script to your newly created EC2 instance by using a command-line

    argument when provisioning a host with `knife`.


    # # Writing the user script


    The script we will be writing for our EC2 instance will be responsible for performing

    the following actions:


    +   - Turn on basic HTTP authentication for WinRM

    +   - Enable WinRM over plaintext (you will likely want to adjust this in a

    +     production environment)

    +   - Increase the maximum memory per shell instance

    +   - Increase the WinRM timeout to 30 minutes'
  - "[PAGE 77]\n\n+   - Add firewall rules to the host to enable WinRM on port 5985\
    \ and 5986\n+   - Restart WinRM to ensure that it picks up the changes and is\
    \ set to start on boot\n\nIn the following code, we designate that we are running\
    \ a powershell script and provide the contents inside of a <powershell>...</powershell>\
    \ block:\n\n```\n<powershell>\nwinrm quickconfig -q\nwinrm set winrm/config/winrs\
    \ '@{MaxMemoryPerShellMB=\"300\"}'\nwinrm set winrm/config '@{MaxTimeoutms=\"\
    1800000\"}'\nwinrm set winrm/config/service '@{AllowUnencrypted=\"true\"}'\nwinrm\
    \ set winrm/config/service/auth '@{Basic=\"true\"}'\nnetsh advfirewall firewall\
    \ add rule name=\"WinRM 5985\" protocol=TCP dir=in localport=5985 action=allow\n\
    netsh advfirewall firewall add rule name=\"WinRM 5986\" protocol=TCP dir=in localport=5986\
    \ action=allow\nnet stop winrm\nsc config winrm start=auto\nnet start winrm\n\
    </powershell>\n```\n\n# # Providing a custom user script\n\nNow that we have a\
    \ custom user script, knife can be informed to load the script using the --user-data\
    \ command-line option. In order to acquire the randomly generated administrator\
    \ password on EC2, we also need to pass the --identity-file option, pointing knife\
    \ to the downloaded copy of your SSH key pair (in this case, $HOME/.ssh/jewartec2.pem):\n\
    \n```\n$ knife ec2 server create -I ami-5eccf31b -f m1.large \\\n    -Z us-west-la\
    \ -S jewartec2 \\\n    --user-data ec2userdata.txt \\\n    --identity-file $HOME/.ssh/jewartec2.pem\n\
    ```\n\n> Make certain that your default security group allows for connections\
    \ to WinRM (ports 5985 and 5986 for non-SSL and SSL respectively) or that you\
    \ specify a security group that does. You will not be able to bootstrap the newly\
    \ provisioned host without access to these ports."
