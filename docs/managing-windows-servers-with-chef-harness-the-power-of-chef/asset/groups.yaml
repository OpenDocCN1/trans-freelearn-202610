    be successful. In order to execute the examples in the book, the following prerequisites
    are needed:


    +   - Access to a Chef server for managing your configuration; a self-hosted installation
    or a Chef-hosted account will work equally well

    +   - A workstation where you can install software including knife (Windows or
    Linux host)

    +   - A text editor of your choice


    Additionally, if you wish to try out any of the cloud-computing examples, you
    will need an account with the cloud hosting providers you are trying out.


