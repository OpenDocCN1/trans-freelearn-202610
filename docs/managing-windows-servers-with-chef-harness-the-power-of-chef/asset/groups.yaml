  - "[PAGE 38]\n\n# # Example of creating an autorun script\n\nInstall an autorun\
    \ item with the following code that executes an accounting tool at login to track\
    \ various bits of accounting data, only installing the autorun item if it hasn't\
    \ been installed:\n\n```\nwindows_auto_run 'ACCOUNTING' do\n  program 'C:/MyOrg/accountingtool.exe'\n\
    \  args '/NOTIFYTHEBOSS /PLAYAPRILFOOLSJOKE'\n  action :create\n  not_if { Registry.value_exists?(AUTO_RUN_KEY,\
    \ 'ACCOUNTING') }\nend\n```\n\n# # Installing software packages\n\nA large number\
    \ of managed systems require configuration of software that is outside the scope\
    \ of the built-in Windows roles and features. Chef has a very handy resource for\
    \ installing arbitrary software onto a Windows host through the windows_package\
    \ resource, which behaves somewhat like the Linux-based package resource only\
    \ for Windows-specific installations. The windows_package resource is capable\
    \ of installing software through a variety of popular installation mechanisms.\
    \ Currently, that list includes the following:\n\n+   - MSI packages\n+   - InstallShield\n\
    +   - Wise InstallMaster\n+   - Inno Setup\n+   - Nullsoft Scriptable Install\
    \ System\n\nIf an installer type is not provided in the resource's attributes,\
    \ then Chef will try to identify the installer by examining the package. For software\
    \ that does not use one of the supported installation mechanisms, Chef provides\
    \ the ability to describe a custom installer workflow by providing the custom\
    \ installation type.\n\n> In order for Chef to manage the installation of the\
    \ software, it must support some form of unattended or quiet mode that does not\
    \ rely on any user input to successfully install the software package. This applies\
    \ for both installation and removal."
