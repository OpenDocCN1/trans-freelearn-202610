  - "[PAGE 61]\n\n# # Examining the recipe\n\nNow that you have the source for the\
    \ `umbraco` cookbook downloaded to your local machine, let's take a look at what\
    \ it's doing. Umbraco is a very easy-to-install ASP.net CMS application that will\
    \ give you a good feeling for how to install and configure an IIS application\
    \ using Chef. Umbraco was chosen for this example cookbook because it does not\
    \ require a database, although it supports one, and its single ZIP file installation\
    \ makes it easy to follow along.\n\nLet's take an in-depth look at the `default.rb`\
    \ recipe that is contained within the `umbraco` cookbook. The code snippets in\
    \ the upcoming section are contained within `umbraco/recipes/default.rb`.\n\n\
    # # Installing the prerequisites\n\nBefore we can set up the IIS application,\
    \ our recipe will need to ensure that the IIS web server Windows role is installed\
    \ on the host. As we have seen in the previous chapter, Chef has a resource, `windows_feature`,\
    \ that allows us to ensure that it is either already available or gets installed\
    \ as part of the recipe execution. Let's look at the recipe's components piece\
    \ by piece:\n\n+   1. First, install the role using the `IIS-WebServerRole` role\
    \ as follows:\n+   \n+   ```\n+   windows_feature 'IIS-WebServerRole' do\n+  \
    \   action :install\n+   end\n+   ```\n\n+   2. Once that has been installed,\
    \ install the ASP.net feature inside of IIS; however, that has some other prerequisites,\
    \ namely the ISAPI filter, ISAPI extensions, the .NET 3 server features, ASP.net\
    \ 4.5 support, and the .NET 4.5 extensibility libraries. These are the required\
    \ roles on Windows Server 2012; discovering the names of the roles can be accomplished\
    \ by using command-line tools such as `dism` or `servermanagercmd`. The following\
    \ code snippet shows the installation of the ASP.net feature of IIS:\n+   \n+\
    \   ```\n+   features = %w{IIS-ISAPIFilter IIS-ISAPIExtensions\n+   NetFx3ServerFeatures\
    \ NetFx4Extended-ASPNET45 IIS-\n+   NetFxExtensibility45}\n+   \n+   features.each\
    \ do |f|\n+     windows_feature f do\n+       action :install\n+     end\n+  \
    \ end\n+   ```"
  - "[PAGE 62]\n\n# # Preparing the IIS service\n\nBy now, our recipe has completed\
    \ the installation of the required roles and features\nin order to manage an IIS\
    \ application. Let's see how it prepares the IIS service by\nremoving the default\
    \ IIS site and application pool from our server.\n\nThe iis cookbook has a default\
    \ recipe that turns on a service named W3SVC. We do\nnot want to do this, instead\
    \ we want to add our own IIS service. We can accomplish\nthis by\" overriding\
    \ the action attribute to :nothing. This will prevent the default\nW3SVC service\
    \ from being installed, as shown in the following code snippet:\n\n```\n```\n\
    service \"iis\" do\n service_name \"W3SVC\"\n action :nothing\nend\n```\n```\n\
    \nWe don't want the default IIS application to be serving traffic, so we will\
    \ remove\nit using the remove_default_site recipe from the iis cookbook as follows:\n\
    \n```\n```\ninclude_recipe \"iis::remove_default_site\"\n```\n```\n\nIf you dig\
    \ into the iis cookbook, you will find that this is just a convenient way\nof\
    \ performing the following operations, and either mechanism would achieve\nthe\
    \ same goal:\n\n```\n```\niis_site 'Default Web Site' do\n action [:stop, :delete]\n\
    end\niis_pool 'DefaultAppPool' do\n action [:stop, :delete]\nend\n```\n```"
  - "[PAGE 63]\n\n# # Fetching the application\n\nUmbraco's distribution comes as\
    \ a ZIP file, which we need to download and then\ndecompress. Here, the resource\
    \ name (the argument passed to the resource) is the\ndirectory that we are targeting\
    \ for expansion of the ZIP file. The destination is found\nin the hash element\
    \ `node['umbraco']['approot']`, which if not overridden will\nbe defined as `#{ENV['SYSTEMDRIVE']}\\\
    \\inetpub\\\\apps` as specified in the\n`attributes/default.rb` file. If you are\
    \ using a simple server setup such as EC2\nor a vanilla install, this will likely\
    \ map to `C:\\\\inetpub\\\\apps` on your target host.\nThe file being downloaded\
    \ is specified by the `source` attribute and by default will\npoint to `http://our.umbraco.org/ReleaseDownload?id=92348`.\
    \ If the package\nhas already been downloaded and uncompressed, this resource\
    \ will be skipped\ndue to the `not_if` check, as shown in the following code snippet:\n\
    \n```\nwindows_zipfile node['umbraco']['app_root'] do\n    source node['umbraco']['dist']\n\
    \    action :unzip\n    not_if {{::File.exists?(::File.join(node['umbraco']['app_root'],\n\
    \    \"umbraco\"))}}\nend\n```\n\n# # Configuring the application\n\nUmbraco has\
    \ some directories that the IIS user will need to have access to.\nThe following\
    \ code block will make sure that we grant the IIS user permission\nto modify the\
    \ required directories:\n\n```\n%w{App_Data Views css config media masterpages\
    \ xslt usercontrols bin\numbraco scripts images macroscripts}.each do |d|\n  \
    \  directory win_friendly_path(::File.join(node['umbraco']['app_root'],\n    d))\
    \ do\n        rights [:read,:modify], 'IIS_IUSRS'\n    end\nend\n```\n\nSimilarly,\
    \ the IIS user needs to be able to update the `web.config` file to update\nit\
    \ with some settings when you run the web-based installation utility. We need\n\
    to grant the modify permission for the `web.config` file to the IIS user using\
    \ the\nfollowing code snippet:\n\n```\nfile win_friendly_path(::File.join(node['umbraco']['app_root'],\
    \ \"web.\nconfig\")) do\n    rights :modify, 'IIS_IUSRS'\nend\n```"
  - "[PAGE 64]\n\n# # Generating an IIS pool and site\n\nOnce the IIS services have\
    \ been installed and the application code has been\ndownloaded, we need to configure\
    \ an IIS pool for the application to run in,\nspecifying the .NET runtime version\
    \ to use (4.0 in this case) as follows:\n\n```\n```\niis_pool node['umbraco']['pool_name']\
    \ do\n runtime_version \"4.0\"\n action :add\nend\n```\n```\n\nOnce we have the\
    \ pool configured and the files deployed, instruct IIS to define a site\nthat\
    \ uses the application pool with the path pointed to our site root on port 80.\
    \ Once\nit's been added, we want to start it (as indicated by providing the action\
    \ attribute\nwith an array containing :add and :start). The path is pointed at\
    \ the unzipped\nUmbraco installation directory #{node['umbraco']['approot']}\\\
    umbraco,\nwhich will be expanded as C:\\inetpub\\apps\\umbraco by default, as\
    \ shown\nin the following code snippet:\n\n```\n```\niis_site 'umbraco' do\n protocol\
    \ :http\n port 80\n path node['umbraco']['app_root']\n application_pool node['umbraco']['pool_name']\n\
    \ action [:add,:start]\nend\n```\n```\n\n# # Performing the installation\n\nNow\
    \ that you know what the cookbook and its recipe are doing, let's go ahead and\n\
    apply the recipe to our Windows host. Here, we will install the Umbraco CMS onto\n\
    a Windows host through the following steps:\n\n+   - Bootstrapping the Windows\
    \ server with the Chef client\n+   - Creating a role for the Umbraco CMS application\n\
    +   - Adding the `umbraco` recipe to the Umbraco role's `run_list`\n+   - Applying\
    \ the newly created role to the host\n+   - Completing the configuration of the\
    \ CMS through a web browser"
  - "[PAGE 65]\n\n# # Bootstrapping the host\n\nIn the following example, we are using\
    \ a Windows Server 2012 host with a fresh\ninstallation of Windows. As usual,\
    \ we will bootstrap our host using knife as follows:\n\n```\n```\nknife bootstrap\
    \ windows winrm HOSTIP -x Administrator -d windows-chef-client-msi\n```\n```\n\
    \nThis will execute the contents of the windows-chef-client-msi.rb bootstrapping\n\
    template on the host located at HOSTIP, installing the Chef client and registering\
    \ the\nhost with the Chef service. Once it has completed, you will see an output\
    \ similar to\nthe following screenshot:\n\n```\n```\nWARN: Node WIN-CJDQ9DE0JFK\
    \ has an empty run list.\nINFO: Chef Run complete in 1.985377 seconds\nINFO: Running\
    \ report handlers\nINFO: Report handlers complete\nINFO: Sending resource update\
    \ report (run-id: 2b919690-3496-447a-a764-08aae2c705b9)\n```\n```\n\nYou can see\
    \ from the preceding screenshot that the host is WIN-CJDQ9DE0JFK,\nand it had\
    \ no run lists assigned to it. This makes sense, as we have not given\nit any\
    \ Chef roles yet, so there is nothing to run. In order to assign a role for our\n\
    new host, we must create a role for our new CMS application; here, we will\ncreate\
    \ a role named umbraco.\n\n# # Creating the role\n\nOnce the cookbook is uploaded\
    \ (as performed earlier in the chapter), create a role\nfrom the following JSON\
    \ in a file, umbraco.json:\n\n```\n```\n{\n \"name\": \"umbraco\",\n \"description\"\
    : \"Umbraco CMS\",\n \"json_class\": \"Chef::Role\",\n \"default_attributes\"\
    : {\n },\n \"override_attributes\": {\n },\n \"chef_type\": \"role\",\n \"run_list\"\
    : [\n  \"recipe[umbraco]\"\n ],\n \"env_run_lists\": {\n }\n}\n```\n```"
  md: "\n\n## Examining the recipe\n\nNow that you have the source for the `umbraco`\
    \ cookbook downloaded to your local machine, let's take a look at what it's doing.\
    \ Umbraco is a very easy-to-install ASP.net CMS application that will give you\
    \ a good feeling for how to install and configure an IIS application using Chef.\
    \ Umbraco was chosen for this example cookbook because it does not require a database,\
    \ although it supports one, and its single ZIP file installation makes it easy\
    \ to follow along.\n\nLet's take an in-depth look at the `default.rb` recipe that\
    \ is contained within the `umbraco` cookbook. The code snippets in the upcoming\
    \ section are contained within `umbraco/recipes/default.rb`.\n\n## Installing\
    \ the prerequisites\n\nBefore we can set up the IIS application, our recipe will\
    \ need to ensure that the IIS web server Windows role is installed on the host.\
    \ As we have seen in the previous chapter, Chef has a resource, `windows_feature`,\
    \ that allows us to ensure that it is either already available or gets installed\
    \ as part of the recipe execution. Let's look at the recipe's components piece\
    \ by piece:\n\n1. First, install the role using the `IIS-WebServerRole` role as\
    \ follows:\n\n   ```ruby\n   windows_feature 'IIS-WebServerRole' do\n     action\
    \ :install\n   end\n   ```\n\n2. Once that has been installed, install the ASP.net\
    \ feature inside of IIS; however, that has some other prerequisites, namely the\
    \ ISAPI filter, ISAPI extensions, the .NET 3 server features, ASP.net 4.5 support,\
    \ and the .NET 4.5 extensibility libraries. These are the required roles on Windows\
    \ Server 2012; discovering the names of the roles can be accomplished by using\
    \ command-line tools such as `dism` or `servermanagercmd`. The following code\
    \ snippet shows the installation of the ASP.net feature of IIS:\n\n   ```ruby\n\
    \   features = %w{IIS-ISAPIFilter IIS-ISAPIExtensions\n   NetFx3ServerFeatures\
    \ NetFx4Extended-ASPNET45 IIS-\n   NetFxExtensibility45}\n\n   features.each do\
    \ |f|\n     windows_feature f do\n       action :install\n     end\n   end\n \
    \  ```\n\n## Preparing the IIS service\n\nBy now, our recipe has completed the\
    \ installation of the required roles and features in order to manage an IIS application.\
    \ Let's see how it prepares the IIS service by removing the default IIS site and\
    \ application pool from our server.\n\nThe iis cookbook has a default recipe that\
    \ turns on a service named W3SVC. We do not want to do this, instead we want to\
    \ add our own IIS service. We can accomplish this by overriding the action attribute\
    \ to :nothing. This will prevent the default W3SVC service from being installed,\
    \ as shown in the following code snippet:\n\n```ruby\nservice \"iis\" do\n  service_name\
    \ \"W3SVC\"\n  action :nothing\nend\n```\n\nWe don't want the default IIS application\
    \ to be serving traffic, so we will remove it using the remove_default_site recipe\
    \ from the iis cookbook as follows:\n\n```ruby\ninclude_recipe \"iis::remove_default_site\"\
    \n```\n\nIf you dig into the iis cookbook, you will find that this is just a convenient\
    \ way of performing the following operations, and either mechanism would achieve\
    \ the same goal:\n\n```ruby\niis_site 'Default Web Site' do\n  action [:stop,\
    \ :delete]\nend\niis_pool 'DefaultAppPool' do\n  action [:stop, :delete]\nend\n\
    ```\n\n## Fetching the application\n\nUmbraco's distribution comes as a ZIP file,\
    \ which we need to download and then decompress. Here, the resource name (the\
    \ argument passed to the resource) is the directory that we are targeting for\
    \ expansion of the ZIP file. The destination is found in the hash element `node['umbraco']['approot']`,\
    \ which if not overridden will be defined as `#{ENV['SYSTEMDRIVE']}\\\\inetpub\\\
    \\apps` as specified in the `attributes/default.rb` file. If you are using a simple\
    \ server setup such as EC2 or a vanilla install, this will likely map to `C:\\\
    \\inetpub\\\\apps` on your target host. The file being downloaded is specified\
    \ by the `source` attribute and by default will point to `http://our.umbraco.org/ReleaseDownload?id=92348`.\
    \ If the package has already been downloaded and uncompressed, this resource will\
    \ be skipped due to the `not_if` check, as shown in the following code snippet:\n\
    \n```ruby\nwindows_zipfile node['umbraco']['app_root'] do\n    source node['umbraco']['dist']\n\
    \    action :unzip\n    not_if {{::File.exists?(::File.join(node['umbraco']['app_root'],\n\
    \    \"umbraco\"))}}\nend\n```\n\n## Configuring the application\n\nUmbraco has\
    \ some directories that the IIS user will need to have access to. The following\
    \ code block will make sure that we grant the IIS user permission to modify the\
    \ required directories:\n\n```ruby\n%w{App_Data Views css config media masterpages\
    \ xslt usercontrols bin\numbraco scripts images macroscripts}.each do |d|\n  \
    \  directory win_friendly_path(::File.join(node['umbraco']['app_root'],\n    d))\
    \ do\n        rights [:read,:modify], 'IIS_IUSRS'\n    end\nend\n```\n\nSimilarly,\
    \ the IIS user needs to be able to update the `web.config` file to update it with\
    \ some settings when you run the web-based installation utility. We need to grant\
    \ the modify permission for the `web.config` file to the IIS user using the following\
    \ code snippet:\n\n```ruby\nfile win_friendly_path(::File.join(node['umbraco']['app_root'],\
    \ \"web.config\")) do\n    rights :modify, 'IIS_IUSRS'\nend\n```\n\n## Generating\
    \ an IIS pool and site\n\nOnce the IIS services have been installed and the application\
    \ code has been downloaded, we need to configure an IIS pool for the application\
    \ to run in, specifying the .NET runtime version to use (4.0 in this case) as\
    \ follows:\n\n```ruby\niis_pool node['umbraco']['pool_name'] do\n  runtime_version\
    \ \"4.0\"\n  action :add\nend\n```\n\nOnce we have the pool configured and the\
    \ files deployed, instruct IIS to define a site that uses the application pool\
    \ with the path pointed to our site root on port 80. Once it's been added, we\
    \ want to start it (as indicated by providing the action attribute with an array\
    \ containing :add and :start). The path is pointed at the unzipped Umbraco installation\
    \ directory #{node['umbraco']['approot']}\\umbraco, which will be expanded as\
    \ C:\\inetpub\\apps\\umbraco by default, as shown in the following code snippet:\n\
    \n```ruby\niis_site 'umbraco' do\n  protocol :http\n  port 80\n  path node['umbraco']['app_root']\n\
    \  application_pool node['umbraco']['pool_name']\n  action [:add,:start]\nend\n\
    ```\n\n## Performing the installation\n\nNow that you know what the cookbook and\
    \ its recipe are doing, let's go ahead and apply the recipe to our Windows host.\
    \ Here, we will install the Umbraco CMS onto a Windows host through the following\
    \ steps:\n\n- Bootstrapping the Windows server with the Chef client\n- Creating\
    \ a role for the Umbraco CMS application\n- Adding the `umbraco` recipe to the\
    \ Umbraco role's `run_list`\n- Applying the newly created role to the host\n-\
    \ Completing the configuration of the CMS through a web browser\n\n## Bootstrapping\
    \ the host\n\nIn the following example, we are using a Windows Server 2012 host\
    \ with a fresh installation of Windows. As usual, we will bootstrap our host using\
    \ knife as follows:\n\n```ruby\nknife bootstrap windows winrm HOSTIP -x Administrator\
    \ -d windows-chef-client-msi\n```\n\nThis will execute the contents of the windows-chef-client-msi.rb\
    \ bootstrapping template on the host located at HOSTIP, installing the Chef client\
    \ and registering the host with the Chef service. Once it has completed, you will\
    \ see an output similar to the following screenshot:\n\n```\nWARN: Node WIN-CJDQ9DE0JFK\
    \ has an empty run list.\nINFO: Chef Run complete in 1.985377 seconds\nINFO: Running\
    \ report handlers\nINFO: Report handlers complete\nINFO: Sending resource update\
    \ report (run-id: 2b919690-3496-447a-a764-08aae2c705b9)\n```\n\nYou can see from\
    \ the preceding screenshot that the host is WIN-CJDQ9DE0JFK, and it had no run\
    \ lists assigned to it. This makes sense, as we have not given it any Chef roles\
    \ yet, so there is nothing to run. In order to assign a role for our new host,\
    \ we must create a role for our new CMS application; here, we will create a role\
    \ named umbraco.\n\n## Creating the role\n\nOnce the cookbook is uploaded (as\
    \ performed earlier in the chapter), create a role from the following JSON in\
    \ a file, umbraco.json:\n\n```json\n{\n \"name\": \"umbraco\",\n \"description\"\
    : \"Umbraco CMS\",\n \"json_class\": \"Chef::Role\",\n \"default_attributes\"\
    : {\n },\n \"override_attributes\": {\n },\n \"chef_type\": \"role\",\n \"run_list\"\
    : [\n  \"recipe[umbraco]\"\n ],\n \"env_run_lists\": {\n }\n}\n```\n\n"
  mdcn: "\n\n## 检查食谱\n\n现在你已将 `umbraco` 食谱的源码下载到本地计算机，让我们来看看它在做什么。Umbraco 是一个非常易于安装的\
    \ ASP.net CMS 应用程序，它能让你很好地了解如何使用 Chef 安装和配置 IIS 应用程序。选择 Umbraco 作为本示例食谱是因为它不需要数据库（尽管支持数据库），并且其单个\
    \ ZIP 文件安装使其易于跟随操作。\n\n让我们深入了解包含在 `umbraco` 食谱中的 `default.rb` 食谱。即将介绍的章节中的代码片段位于\
    \ `umbraco/recipes/default.rb` 中。\n\n## 安装先决条件\n\n在设置 IIS 应用程序之前，我们的食谱需要确保主机上已安装\
    \ IIS Web 服务器 Windows 角色。如前一章所示，Chef 有一个名为 `windows_feature` 的资源，允许我们确保该角色已可用或作为食谱执行的一部分进行安装。让我们逐个查看食谱的组件：\n\
    \n1. 首先，使用 `IIS-WebServerRole` 角色安装该角色，如下所示：\n\n   ```ruby\n   windows_feature\
    \ 'IIS-WebServerRole' do\n     action :install\n   end\n   ```\n\n2. 安装完成后，在 IIS\
    \ 中安装 ASP.net 功能；不过，它还有一些其他先决条件，即 ISAPI 筛选器、ISAPI 扩展、.NET 3 服务器功能、ASP.net 4.5\
    \ 支持以及 .NET 4.5 可扩展性库。这些是 Windows Server 2012 上所需的角色；可以使用 `dism` 或 `servermanagercmd`\
    \ 等命令行工具发现角色的名称。以下代码片段显示了 IIS ASP.net 功能的安装：\n\n   ```ruby\n   features = %w{IIS-ISAPIFilter\
    \ IIS-ISAPIExtensions\n   NetFx3ServerFeatures NetFx4Extended-ASPNET45 IIS-\n\
    \   NetFxExtensibility45}\n\n   features.each do |f|\n     windows_feature f do\n\
    \       action :install\n     end\n   end\n   ```\n\n## 准备 IIS 服务\n\n至此，我们的食谱已完成所需角色和功能的安装，以便管理\
    \ IIS 应用程序。让我们看看它如何通过从服务器中删除默认 IIS 站点和应用程序池来准备 IIS 服务。\n\niis 食谱有一个默认食谱，用于启动名为\
    \ W3SVC 的服务。我们不希望这样做，而是希望添加自己的 IIS 服务。我们可以通过将 action 属性覆盖为 :nothing 来实现这一点。这将阻止默认\
    \ W3SVC 服务被安装，如以下代码片段所示：\n\n```ruby\nservice \"iis\" do\n  service_name \"W3SVC\"\
    \n  action :nothing\nend\n```\n\n我们不希望默认 IIS 应用程序提供流量，因此我们将使用 iis 食谱中的 remove_default_site\
    \ 食谱将其删除，如下所示：\n\n```ruby\ninclude_recipe \"iis::remove_default_site\"\n```\n\n\
    如果你深入研究 iis 食谱，你会发现这只是执行以下操作的一种便捷方式，两种机制都能实现相同的目标：\n\n```ruby\niis_site 'Default\
    \ Web Site' do\n  action [:stop, :delete]\nend\niis_pool 'DefaultAppPool' do\n\
    \  action [:stop, :delete]\nend\n```\n\n## 获取应用程序\n\nUmbraco 的分发版本以 ZIP 文件形式提供，我们需要下载并解压缩它。这里，资源名称（传递给资源的参数）是我们要解压缩\
    \ ZIP 文件的目标目录。目标位置在哈希元素 `node['umbraco']['approot']` 中找到，如果未覆盖，它将定义为 `attributes/default.rb`\
    \ 文件中指定的 `#{ENV['SYSTEMDRIVE']}\\\\inetpub\\\\apps`。如果你使用的是简单的服务器设置（如 EC2 或原始安装），这很可能映射到目标主机上的\
    \ `C:\\\\inetpub\\\\apps`。要下载的文件由 `source` 属性指定，默认情况下将指向 `http://our.umbraco.org/ReleaseDownload?id=92348`。如果包已下载并解压缩，则由于\
    \ `not_if` 检查，该资源将被跳过，如以下代码片段所示：\n\n```ruby\nwindows_zipfile node['umbraco']['app_root']\
    \ do\n    source node['umbraco']['dist']\n    action :unzip\n    not_if {{::File.exists?(::File.join(node['umbraco']['app_root'],\n\
    \    \"umbraco\"))}}\nend\n```\n\n## 配置应用程序\n\nUmbraco 有一些目录，IIS 用户需要有权访问。以下代码块将确保我们授予\
    \ IIS 用户修改所需目录的权限：\n\n```ruby\n%w{App_Data Views css config media masterpages\
    \ xslt usercontrols bin\numbraco scripts images macroscripts}.each do |d|\n  \
    \  directory win_friendly_path(::File.join(node['umbraco']['app_root'],\n    d))\
    \ do\n        rights [:read,:modify], 'IIS_IUSRS'\n    end\nend\n```\n\n同样，IIS\
    \ 用户需要能够更新 `web.config` 文件，以便在运行基于 Web 的安装实用程序时用一些设置对其进行更新。我们需要使用以下代码片段授予 IIS\
    \ 用户对 `web.config` 文件的修改权限：\n\n```ruby\nfile win_friendly_path(::File.join(node['umbraco']['app_root'],\
    \ \"web.config\")) do\n    rights :modify, 'IIS_IUSRS'\nend\n```\n\n## 生成 IIS\
    \ 池和站点\n\n一旦 IIS 服务已安装且应用程序代码已下载，我们需要为应用程序配置一个 IIS 池，指定要使用的 .NET 运行时版本（本例中为 4.0），如下所示：\n\
    \n```ruby\niis_pool node['umbraco']['pool_name'] do\n  runtime_version \"4.0\"\
    \n  action :add\nend\n```\n\n配置好池并部署文件后，指示 IIS 定义一个使用应用程序池的站点，路径指向我们站点根目录上的端口\
    \ 80。添加后，我们希望启动它（通过向 action 属性提供包含 :add 和 :start 的数组来指示）。路径指向解压缩的 Umbraco 安装目录\
    \ #{node['umbraco']['approot']}\\umbraco，默认情况下将展开为 C:\\inetpub\\apps\\umbraco，如以下代码片段所示：\n\
    \n```ruby\niis_site 'umbraco' do\n  protocol :http\n  port 80\n  path node['umbraco']['app_root']\n\
    \  application_pool node['umbraco']['pool_name']\n  action [:add,:start]\nend\n\
    ```\n\n## 执行安装\n\n现在你知道食谱及其食谱在做什么了，让我们继续将食谱应用到我们的 Windows 主机上。这里，我们将通过以下步骤在 Windows\
    \ 主机上安装 Umbraco CMS：\n\n- 使用 Chef 客户端引导 Windows 服务器\n- 为 Umbraco CMS 应用程序创建角色\n\
    - 将 `umbraco` 食谱添加到 Umbraco 角色的 `run_list`\n- 将新创建的角色应用到主机\n- 通过 Web 浏览器完成 CMS\
    \ 的配置\n\n## 引导主机\n\n在以下示例中，我们使用的是新安装 Windows 的 Windows Server 2012 主机。像往常一样，我们将使用\
    \ knife 引导主机，如下所示：\n\n```ruby\nknife bootstrap windows winrm HOSTIP -x Administrator\
    \ -d windows-chef-client-msi\n```\n\n这将在位于 HOSTIP 的主机上执行 windows-chef-client-msi.rb\
    \ 引导模板的内容，安装 Chef 客户端并将主机注册到 Chef 服务。完成后，你将看到类似于以下屏幕截图的输出：\n\n```\nWARN: Node\
    \ WIN-CJDQ9DE0JFK has an empty run list.\nINFO: Chef Run complete in 1.985377\
    \ seconds\nINFO: Running report handlers\nINFO: Report handlers complete\nINFO:\
    \ Sending resource update report (run-id: 2b919690-3496-447a-a764-08aae2c705b9)\n\
    ```\n\n你可以从前面的屏幕截图中看到，主机是 WIN-CJDQ9DE0JFK，并且没有分配任何运行列表。这很合理，因为我们尚未为其分配任何 Chef\
    \ 角色，因此没有可运行的内容。为了为我们的新主机分配角色，我们必须为新的 CMS 应用程序创建一个角色；这里，我们将创建一个名为 umbraco 的角色。\n\
    \n## 创建角色\n\n上传食谱后（如前一章中所述），从以下 JSON 创建一个角色，保存到文件 umbraco.json 中：\n\n```json\n\
    {\n \"name\": \"umbraco\",\n \"description\": \"Umbraco CMS\",\n \"json_class\"\
    : \"Chef::Role\",\n \"default_attributes\": {\n },\n \"override_attributes\":\
    \ {\n },\n \"chef_type\": \"role\",\n \"run_list\": [\n  \"recipe[umbraco]\"\n\
    \ ],\n \"env_run_lists\": {\n }\n}\n```\n\n"
