    ## Working with Windows-specific resources


    There are a handful of resources that Chef provides on a Windows system that are
    specific to Windows. Chef can automatically determine which type of host a recipe
    is being executed on and perform a different set of actions based on the host
    type. For example, the installation of a particular software package such as MySQL
    may be mostly identical between hosts but requires slightly different settings
    or needs to store Registry settings on a Windows system. Some of the resources
    that are specific to Windows include the following:


    - Batch scripts

    - PowerShell scripts

    - Autorun scripts

    - Software packages (MSIs, installers, and so on)

    - Printers

    - Windows Registry

    - Network paths

    - System tasks


    ## Supported platforms


    Chef for Windows supports recent versions of Windows as of the time of writing.
    This includes the following (but may work on other, newer releases as well):


    - Windows Server 2003 R2

    - Windows Server 2008

    - Windows 8

    - Windows 7

    - Windows Vista


    ## Summary


    As you can see, Chef has a lot to offer to Windows administrators both in managing
    Windows-only infrastructure as well as heterogeneous Windows and Linux infrastructure.


    Now that you have got a feeling for how Chef can benefit you when managing Windows
    systems, let’s take a look at how to install the client and how it fits into the
    overall architecture of the Chef ecosystem in the next chapter.


    ## 2 Installing the Client – an Overview of Chef Concepts


    As with all guides, the journey must begin somewhere. In this chapter, we will
    start from the beginning, covering some important information about using Chef
    with Windows. It contains a brief refresher of some material you may already know
    about if you have used Chef before, and then we continue with getting Chef installed
    onto a Windows host.


    In this chapter, we will cover the following topics:


    - Reviewing key Chef terminology

    - Describing the overall Chef system architecture

    - Installing the Chef client on a Windows system manually

    - Using the bootstrap script provided as part of Chef to install the client


    ### Getting to know Chef better


    As with any other technology, Chef has its own set of terminologies which are
    used to identify the various components of the Chef ecosystem. The following are
    some key terms along with their definitions that are used throughout this book:


    - **Node**: A node is a system that is managed by Chef. These can be servers,
    desktop systems, routers, or anything else that is capable of running the Chef
    client and has a supported operating system.

    - **Workstation**: A workstation is a special node that is used by a system administrator
    to interact with the Chef server and with nodes. This is where the command-line
    tools are executed, specifically the `knife` command-line tool.

    - **Bootstrap**: Bootstrap is the process of setting up a node to be used as a
    Chef client. This involves performing any work required to install the dependencies
    for Chef as well as Chef itself.

    - **Bootstrap script**: There are a number of possible ways to install Chef, Ruby,
    and other core requirements as well as any additional configuration that is needed
    for your specific systems. To provide this level of flexibility, the bootstrap
    process is scripted; on Windows, this is a batch file.

    - **Recipe**: Recipes provide the instructions required to achieve a goal such
    as installing a software package, configuring a firewall, provisioning users and
    printers, or managing other system resources. These are written in Ruby and executed
    on the nodes specified by the system administrator through the Chef console.

    - **Cookbook**: A cookbook is a collection of recipes. Typically, a cookbook provides
    one specific group of actions such as installing Apache or MySQL, providing Chef
    resources for a specific software tool, and so on.

    - **Attributes**: Various components of the system have their own attributes;
    properties that describe how the software needs to be configured. These properties
    are defined at various levels, ranging from node-specific settings to general
    defaults for a cookbook or a role.

    - **Role**: A role is a data structure that describes how a node that has the
    role applied to it should be configured. It contains a list of recipes that are
    to be run and the configuration data to be applied to nodes that are associated
    with that role. Examples of roles might include MSSQL Servers, Exchange servers,
    IIS servers, file servers, and so on. Note that the role itself knows nothing
    about nodes; the association between the node and its role is created by the administrator
    by applying roles to nodes.

    - **Run list**: A "run list" is a list of recipes to be applied to a given node
    in a certain order. A run list can be composed of zero or more roles or recipes,
    and the order is important as the run list''s items are executed in the order
    specified. Therefore, if one recipe is dependent upon the execution of another,
    you need to ensure that they run in the correct order.

    - **Resource**: Resources are the way of describing _what_ a recipe is processing.
    Some examples of resources would include files, directories, printers, users,
    packages, and so on. A resource is an abstraction of something that is concretely
    implemented in a provider.

    - **Provider**: A provider is a concrete implementation of a resource. For example,
    a user is a generic resource, but LDAP users or Active Directory users are concrete
    implementations of a user resource. The type of provider being selected will depend
    on factors such as the platform.

    - **Data bags**: Data bags contain shared data about your infrastructure. Information
    that is not specific to a role or a resource such as firewall rules, user accounts,
    and so on would be stored in data bags. This is a good place to store system-wide
    configuration data.

    - **Environments**: Environments provide a level of encapsulation for resources.
    For example, you may have two identical environments, one for testing and one
    for production. Each of these may have similar setups but different configurations
    such as IP addresses and users.


    ## An overview of Chef’s architecture


    Chef has three main players in its overall architecture: the nodes that are being
    managed (servers, desktop clients, routers, and so on), the workstation that a
    system administrator uses to run the `knife` command, and the Chef service that
    is responsible for storing and managing all of the roles, recipes, and configuration
    data to be applied to the end hosts. The following diagram represents the Chef
    architecture:


    ![](img/5439c37d2ec2a9036b89ca6c7fbf894e_23_0.png)


    The nodes communicate with the Chef service over HTTP (preferably HTTPS) using
    the `chef-client` script provided as part of the Chef client installation. This
    is a Ruby script that is responsible for connecting to the configured Chef service
    (self-hosted or using hosted Chef) and downloading the run list that is configured
    for that node along with any cookbooks and configuration data it needs. Once it
    has done that, `chef-client` will evaluate the run list in order to execute the
    recipes in the order in which they were specified.


    The workstation also communicates with the Chef service using HTTP(S), but its
    job is a bit different. The workstation is where a system administrator will use
    the command-line utilities to interact with the data stored in the Chef service.
    From there, the administrator can read and modify any of the system data as JSON,
    perform searches, and interact with the nodes through the knife command-line utility.


    In addition to the command-line utility, Chef also presents a web-based interface
    for modifying the system data. Anything that can be performed by the web interface
    can also be achieved using knife; however, there are a number of advanced operations
    that cannot be performed without knife such as executing remote commands on a
    group of hosts and searching through data.


    ## Installing the Chef client on Windows


    In order to install the Chef client on Windows, there are three basic options
    to be performed, as follows:


    1. Use the knife-windows plugin to bootstrap the host as described previously.

    2. Download and manually install the client using the MSI installer.

    3. Deploy the software via an in-place update tool such as WSUS (this mechanism
    will not be discussed because it is outside the scope of this book).


    ## Preparing to bootstrap Windows hosts


    As discussed in the previous chapter, bootstrapping a host is the process of installing
    any components required to initially incorporate a host into your infrastructure.
    Typically, this will involve installing Ruby along with the Chef client and any
    certificates required for authentication, as well as registering the host with
    your Chef server or hosted Chef account. In order to do this, you will need to
    have a workstation configured with the knife-windows gem installed. You can install
    the gem easily with the following command:

    `gem install knife-windows`


    '
