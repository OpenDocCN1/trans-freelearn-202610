  - '[PAGE 32]


    # # Platforms supported by Chef


    Not all versions of Windows are supported by Chef, and not all functionality is
    supported on all platforms. A list of Windows versions known to work with Chef
    is as follows:


    +   - Windows XP

    +   - Windows Vista

    +   - Windows Server 2003 R2

    +   - Windows 7

    +   - Windows Server 2008

    +   - Windows Server 2012


    These resources are provided by the `windows` cookbook (`https://github.com/opscode-cookbooks/windows`)
    and behave like any other Chef resource apart from the fact that they are platform-specific
    resources and have no providers on non-Windows systems. Let’s take a look at these
    in detail, with examples of how to use them.


    In order to use the `windows` cookbook, you need to have a few dependencies installed,
    specifically the `chef_handler` and `powershell` recipes.


    > We cannot specifically depend on Chef’s `powershell` cookbook because `powershell`
    depends on this cookbook—this creates a circular dependency if you are not careful.
    As a result, do not add a dependency, but rather ensure that `recipe [powershell]`
    exists in the node’s expanded run list.


    # # Managing roles and features


    Similar to how Linux distributions have package management tools and a repository
    of packages, Windows has long had built-in packages that come with the OS. Both
    desktop and server releases of Windows have installable components out of the
    box, with servers having more than desktops.'
  - '[PAGE 33]


    In Windows parlance, roles are similar to Chef’s notion of roles—a collection
    of

    software packages and services that work together to provide a certain set of

    functionality such as web application services or DNS. Multiple services can be

    required to provide a particular role on a Windows server. However, because

    these roles are managed as part of Windows, the level of control that you have

    over them is somewhat limited through Chef. You can enable or disable them

    through the `windows_feature` resource, but Windows (instead of Chef)

    determines what gets installed.


    Features, on the other hand, are more like packages; they provide functionality
    that

    may not be critical to participating in a particular role, or may not even be
    related to

    roles in general. Chef refers to both roles and features as _features_, and the
    `windows_

    feature` resource provides a mechanism for managing both of these through Chef.


    There are currently two providers for `windows_feature`: **Deployment Image

    Servicing and Management (DISM)** and `servermanagercmd` (the server manager

    command-line tool). The `servermanagercmd` command is deprecated in favor of

    DISM as the recommended mechanism for managing roles and features. Therefore,

    the default provider used by Chef is DISM if it is present on the system being

    managed, falling back to using `servermanagercmd` if it is not.


    For a complete list of all roles and features that are available on a node, use
    one of the

    following mechanisms. On DISM-enabled systems, run the `dism` command as follows:


    ```

    `dism /online /Get-Features`

    ```


    The output of this command gives you a list of features and their current status.

    The following screenshot is an excerpt from the output obtained on running this

    command on a host:


    ![](img/5439c37d2ec2a9036b89ca6c7fbf894e_33_0.png)


    Here, the `Feature Name` key would be used to map to the `feature_name` attribute
    in

    the `windows_feature` resource. For hosts without DISM, use the `servermanagercmd`

    tool as follows:


    ```

    `servermanagercmd -query`

    ```'
  - '[PAGE 34]


    The output of this command would look like the following screenshot:


    ![](img/5439c37d2ec2a9036b89ca6c7fbf894e_34_0.png)


    In the preceding screenshot, the string in square brackets would be the value
    to

    supply to the feature_name attribute to manage that component.


    In order to install these, Chef provides us with the windows_feature resource,

    which is described in the following table:


    | windows_feature |

    |-----------------|

    | **Action**      | **Description** |

    | install         | This installs the specified Windows role

    or feature. |

    | remove          | This uninstalls the specified Windows role

    or feature. |

    | **Parameter**   | **Description** |

    | feature_name    | This is the name attribute – Windows'' fully

    qualified name of the feature or role to be

    managed. The name may vary depending

    on the provider being used. |


    # # Installing roles using different mechanisms


    As discussed earlier, there are multiple backends for the Windows feature

    resource—DISM and servermanagercmd. Each one has a specific Ruby class

    that will be used based on the determined backend as follows:


    +   - Chef::Provider::WindowsFeature::DISM: This uses DISM to manage

    +   roles/features (default unless DISM is not present)


    +   - Chef::Provider::WindowsFeature::ServerManagerCmd: This uses

    +   Server Manager to manage roles/features (the fallback provider when

    +   DISM is absent)'
  - "[PAGE 35]\n\n# # Examples of using features and roles\n\nEnable the printer service\
    \ role (Printing-Server-Role) as shown in the following example output from DISM:\n\
    \n```\nwindows_feature \"Printing-Service-Role\" do\n  action :install\nend\n\
    ```\n\nSince you can use arbitrary Ruby code inside your recipes, you can perform\
    \ an operation on multiple components with ease. For example, to remove both the\
    \ fax server and the printing server, you could use the following code:\n\n```\n\
    to_remove = [\"Printing-Service-Role\", \"FaxServiceRole\"]\nto_remove.each do\
    \ |feat|\n  windows_feature feat do\n    action :remove\n  end\nend\n```\n\nIn\
    \ order to enable IIS on a system where DISM is not available, you would need\
    \ to use the role name as output using servermanagercmd as follows:\n\n```\nwindows_feature\
    \ \"AS-Web-Support\" do\n  action :install\nend\n```\n\n# # Executing batch scripts\n\
    \nSimilar to Linux script resources for bash, ruby, and so on, Chef can execute\
    \ arbitrarily-defined Windows batch scripts through the command interpreter. When\
    \ these resources are used, Chef compiles the contents of the batch script as\
    \ defined in the resource block's code attribute and then deposits it on the managed\
    \ host and it is executed from there.\n\n> Take caution when using script resources;\
    \ they are unstructured and can easily perform actions that have unintended side\
    \ effects. Similar to the way the software is built, two immediate subsequent\
    \ runs of the Chef client on a node should have the same effect as only running\
    \ it once in order to guarantee a reliable and consistent system configuration.\
    \ Make sure that you develop scripts that are idempotent in nature (that is, it\
    \ can be run multiple times and have the same effect as only running once), or\
    \ use conditionals to prevent multiple executions."
  - '[PAGE 36]


    Since scripts are arbitrary and of a free form, you can use them to achieve anything
    that you cannot model using the existing resources. However, care must be taken
    to prevent repeated execution that would cause negative side effects. One way
    to avoid performing potentially destructive actions is to use the not_if and only_if
    conditions to prevent multiple executions. That being said, if you find that you
    are performing the same type of action repeatedly, consider writing a custom resource
    and provider if possible.


    > Chef 11.6.0 and upwards includes a built-in batch resource; use windows_batch
    when implementing an earlier Chef version.


    When running a batch script on a Windows host using earlier versions of Chef,
    the windows_batch resource can be used. The following table shows the available
    actions and parameters when using the windows_batch resource:


    | Action | Description |

    |---|---|

    | run | This runs the batch script that is specified. |

    | Parameter | Description |

    | code | This is the batch script to be executed. It is an arbitrary string (refer
    to the example following the table). |

    | command | This is a name attribute — the name of the block being executed. Typically,
    this should have a meaningful value. |

    | creates | A file is to be used as a semaphore for this script. If the file specified
    exists, this script is not executed as it is expected to be created by the script.
    |

    | cwd | Change the working directory to this before running the batch script.
    |

    | flags | These are the command-line flags passed to the cmd.exe interpreter when
    running this batch script. |

    | group | This specifies the group name/ID that this script should be executed
    as. |

    | user | This specifies the user name/ID that this script should be executed as.
    |'
