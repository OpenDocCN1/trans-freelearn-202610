    \ reached after 2.67 minutes\n```\n\n一旦主机处于就绪状态，Chef 将能够告诉你更多关于主机的信息，包括 IP 地址和\
    \ WinRM 端口。你应期望类似于以下命令的输出：\n\n```\nDNS Name: 0c0ff330.cloudapp.net\nVM Name: 0c0ff330\n\
    Size: Small\nAzure Source Image: a699494373c04fc0bc8f2bb1389d6106__Windows-Server-\n\
    2012-Datacenter-201401.01-en.us-127GB.vhd\nAzure Service Location: West US\nPublic\
    \ Ip Address: 138.91.227.224\nPrivate Ip Address: 100.82.76.57\nWinRM Port: 5985\n\
    Environment: _default\n```\n\n配置过程可能需要一段时间，具体取决于你选择的位置和基础镜像。在配置过程中，它将创建命令行中指定的\
    \ WinRM 用户，在此示例中为 azure，并使用指定的密码。但是，WinRM 的基本身份验证默认不会开启；Kerberos 身份验证默认会启用，但 Kerberos\
    \ 支持超出了本书的范围。因此，你将在此处遇到无法引导主机的错误，我们将在下一组步骤中通过启用 WinRM 的基本 HTTP 身份验证机制来修复此问题。\n\
    \n## 引导你的 Azure 节点\n\n你的初始 **虚拟机**（VM）需要为 WinRM 启用基本身份验证；完成此操作后，你可以将新创建的镜像保存为可重用的\
    \ Azure 镜像，其中包含你的管理凭据和已启用 WinRM 基本身份验证。\n\n要为 WinRM 启用基本身份验证支持，你需要执行以下步骤：\n\n\
    1. 在 Azure 实例上启用 RDP。\n2. 使用远程桌面连接到新虚拟机，并使用配置阶段指定的凭据登录（在此示例中，帐户为 `azure`，密码为 `+0ps3kr3+`）。\n\
    3. 打开 Windows 命令提示符并运行以下命令，以允许 WinRM 接受基本 HTTP 身份验证：\n\n   ```\n   winrm set winrm/config/client/auth\
    \ @{Basic=\"true\"}\n   ```\n\n此时，你可以返回工作站，并使用 `knife bootstrap` 命令引导新主机，如下所示：\n\
    \n```\nknife bootstrap windows winrm 00c0ff3300.cloudapp.net \\\n  --winrm-user\
    \ azure \\\n  --winrm-transport ssl\n```\n\n前面的命令将提示你输入管理员密码。输入正确凭据后，你可以继续在新 Azure\
    \ 主机上引导 Chef 客户端并将其注册到 Chef 服务器。完成后，你可以使用 `node list` 命令验证其是否已正确注册，如下所示：\n\n```\n\
    $ knife node list\n00c0ff3300\ni-49117415\n```\n\n请注意，在我们的已注册节点中，新虚拟机现在已显示。\n\n"
