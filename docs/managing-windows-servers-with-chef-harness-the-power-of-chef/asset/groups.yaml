    \n在下一章中，让我们看看如何在引导阶段需要自定义配置时自动化主机配置，以及如何使用 Chef 管理云主机。\n\n# 5 使用 Chef 管理云服务\n\n\
    Chef 的一个非常强大的用途是将其用于将基础设施无缝扩展到云端，就像本地硬件一样。Chef 有多种机制可与流行的云服务提供商集成。在本章中，我们将了解如何使用\
    \ Chef 管理和部署软件到各种流行的云服务提供商。\n\n在本章中，我们将涵盖以下主题：\n\n- Microsoft Azure\n- AWS EC2\n\
    - Rackspace Cloud\n\n## 使用 Microsoft Azure\n\nAzure 是微软对 EC2 和 Rackspace Cloud\
    \ 的竞争对手。这三者都会为你提供 Windows 虚拟化，因此本章包含了如何将 Azure 与 Chef 集成的信息。\n\n`knife-azure`\
    \ gem 提供了通过 `knife` 实用程序控制 Azure 所需的功能。Chef 使用插件来提供扩展功能，包括管理云服务。Azure 支持存在于名为\
    \ `knife-azure` 的 Ruby gem 中，并通过 `gem` 命令行实用程序安装，如下所示：\n\n```\ngem install knife-azure\n\
    ```\n\n此命令将安装 `knife-azure` 依赖的所有 gem，而不仅仅是 Chef。\n\n> 就撰写本文时，`knife-azure` gem\
    \ 依赖于旧版本的 bundler，这可能会导致问题，并可能要求你手动降低已安装 bundler 的版本。使用 RVM 或其他 Ruby 管理器将有助于隔离这些问题，并允许你管理\
    \ gem。\n\n## 下载管理证书\n\n为了使用 Azure API，你需要有一个管理证书来标识你与服务的身份。你可以从 `https://manage.windowsazure.com/`\
    \ `publishsettings/index?client=xplat` 创建并下载生成的管理证书。\n\n## 为 knife 配置 Azure\n\n\
    现在你已将管理证书放在 `.publishsettings` 文件中，`knife` 需要知道它。这通过 `knife.rb` 配置文件完成，正如你所料。要让\
    \ `knife` 知道在哪里找到你新下载的 `.publishsettings` 文件，首先将其移动到某个位置（例如你的主目录或 `$HOME/.chef`），然后将以下行添加到你的\
    \ `knife.rb` 文件中：\n\n`knife[:azure_publish_settings_file] = \"/path/to/publishsettings_file\"\
    `\n\n现在 `knife` 已拥有所需的所有信息，我们将能够向 Azure 发出 API 调用。\n\n## 创建新的 Azure 虚拟机\n\n为了创建新服务器，你需要知道使用哪个镜像；你可以使用\
    \ `azure` 插件的 `image list` 子命令查看可用镜像列表，如下所示：\n\n`knife azure image list`\n\nWindows-Server-2012-Essentials\
    \ Windows East Asia, Southeast Asia\nUbuntu-12_04_2-LTS-amd64-server Linux East\
    \ Asia, Southeast Asia\nWindows-Server-2008-R2 Windows West US, East Asia\n\n\
