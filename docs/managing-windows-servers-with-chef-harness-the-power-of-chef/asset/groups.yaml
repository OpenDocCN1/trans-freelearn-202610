    此脚本将启动时间服务，同步时钟，并在端口 5985 上打开防火墙以允许 WinRM 连接。创建此文件后，我们需要将其注入到 Rackspace 虚拟机中，作为名为
    C:\cloud-automation\bootstrap.cmd 的特殊文件在配置时注入，并告诉 knife 使用 WinRM 而不是 SSH 来引导主机：


