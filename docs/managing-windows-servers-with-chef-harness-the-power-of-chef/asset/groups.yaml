    # # Working with Windows-specific resources


    There are a handful of resources that Chef provides on a Windows system that are
    specific to Windows. Chef can automatically determine which type of host a recipe
    is being executed on and perform a different set of actions based on the host
    type. For example, the installation of a particular software package such as MySQL
    may be mostly identical between hosts but requires slightly different settings
    or needs to store Registry settings on a Windows system. Some of the resources
    that are specific to Windows include the following:


