    \ http://www.packtpub.com/support 并注册，以便将文件直接发送到你的邮箱。\n\n## 勘误\n\n尽管我们已尽一切努力确保内容的准确性，但错误仍会发生。如果你在我们的某本书中发现错误——也许是文本或代码中的错误——我们将不胜感激如果你能向我们报告。这样做，你可以帮助其他读者避免沮丧，并帮助我们改进本书的后续版本。如果你发现任何勘误，请访问\
    \ http://www.packtpub.com/submit-errata，选择你的书，单击勘误提交表单链接，并输入你的勘误详细信息。一旦你的勘误得到验证，你的提交将被接受，勘误将上传到我们的网站，或添加到该书名下现有勘误列表的勘误部分中。任何现有勘误都可以通过从\
    \ http://www.packtpub.com/support 选择你的书名来查看。\n\n## 盗版\n\n互联网上受版权保护材料的盗版是所有媒体中持续存在的问题。在\
    \ Packt，我们非常重视对我们的版权和许可的保护。如果你在互联网上以任何形式发现我们作品的非法副本，请立即向我们提供位置地址或网站名称，以便我们可以采取补救措施。\n\
    \n请通过 copyright@packtpub.com 与我们联系，并提供涉嫌盗版材料的链接。\n\n我们感谢你在保护我们的作者以及我们向你提供有价值内容方面的帮助。\n\
    \n## 问题\n\n如果你在本书的任何方面遇到问题，可以通过 questions@packtpub.com 联系我们，我们将尽力解决。\n\n## 1 Chef\
    \ 和 Windows\n\n如果你正在阅读本书，推测你已经熟悉 Chef，至少在概念上，并且你有一些需要管理的基于 Windows 的系统。如果你使用 Chef\
    \ 管理过一些基于 Linux 的系统，或者与 chef-solo 交互过以管理虚拟机，你将准备好立即开始。如果没有，不用担心——有大量的解释和示例可以让你感到宾至如归。\n\
    \n如果你需要帮助安装 Chef 服务器，有许多其他资源可供你使用，或者你可以注册托管 Chef 的免费层级，无需管理自己的服务器即可立即开始。\n\n在本章中，我们将涵盖以下主题：\n\
    \n- 使用 Chef 和 Microsoft Windows\n- 集成 Chef 和 Windows 的方式\n- 支持的平台和技术\n\n### 使用\
    \ Windows\n\n对于初学者来说，Chef 的客户端组件是用 Ruby 编写的，这是一种非常流行的语言。由于 Ruby 的跨平台特性，对 Windows\
    \ 的支持与对 Linux 和类 UNIX 系统的支持一样直接，并且已经存在相当长一段时间，可以追溯到大约 2011 年发布的 **knife-windows**\
    \ gem。\n\n"
