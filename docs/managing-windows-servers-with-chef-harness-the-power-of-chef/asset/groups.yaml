    \ value)\n```\n\nUse the following code to check to see if a key exists:\n\n```ruby\n\
    Windows::RegistryHelper.key_exists?(path)\n```\n\nUse the following code to get\
    \ the value from a registry key:\n\n```ruby\nresult = Windows::RegistryHelper.get_value(path,\
    \ value)\n```\n\n"
  mdcn: "\n\n## 管理打印机端口示例\n\n仅指定 IP 地址（其余设置均为默认值）来创建名为 `10.0.0.1` 的 TCP/IP 打印机端口，如以下代码所示：\n\
    \n```ruby\nwindows_printer_port '10.0.0.1' do\nend\n```\n\n删除刚刚创建的打印机端口，如下所示：\n\
    \n```ruby\nwindows_printer_port '10.0.0.1' do\n  action :delete\nend\n```\n\n\
    创建带有非默认选项（如名称、端口号、描述和 SNMP 支持）的端口，如以下代码所示：\n\n```ruby\nwindows_printer_port '10.0.0.1'\
    \ do\n  port_name 'Remote office port'\n  port_number 8080\n  port_description\
    \ 'This is my newly created port'\n  snmp_enabled true\nend\n```\n\n删除先前创建的端口，如下所示：\n\
    \n```ruby\nwindows_printer_port '10.0.0.1' do\n  port_name 'Remote office port'\n\
    \  action :delete\nend\n```\n\n## 管理打印机\n\n要创建新打印机，系统上需要已安装驱动程序。如果驱动程序不在目标主机上，可以使用\
    \ `windows_package` 资源轻松安装，并从中央网络位置分发，以便将打印机驱动程序分发到目标主机。\n\n> `windows_printer`\
    \ 资源将使用 `ipv4_address` 属性自动为您创建 TCP/IP 打印机端口。如果您希望对打印机端口进行更精细的控制，请在创建打印机之前使用 `windows_printer_port`\
    \ 资源创建端口。\n\n下表显示了可与 `windows_printer` 资源一起使用的可用操作和参数：\n\n| 操作 | 描述 |\n| --- |\
    \ --- |\n| create | 创建新打印机资源（默认操作）。 |\n| delete | 删除名为的打印机。 |\n| 参数 | 描述 |\n|\
    \ device_id | 这是资源名称属性—设置为打印机队列名称，例如，Tokyo Office HP LaserJet。 |\n| driver_name\
    \ | 这必须是打印机驱动程序的确切名称。这需要提前安装（如前所述）—如有需要，使用 `windows_package` 资源在创建打印机之前安装它。 |\n\
    | ipv4_address | 这是打印机的 IPv4 地址，例如，10.4.64.23。创建时无需网络可访问。如果不存在，我们将创建端口。 |\n| location\
    \ | 这是用于打印机元数据的打印机位置。 |\n| shared | 这是一个布尔标志，指示此打印机是否需要共享。默认值为 false。 |\n| share_name\
    \ | 这是打印机的共享名称，如果需要共享。 |\n| comment | 这将包含打印机的可选描述。 |\n| default | 这决定打印机是否为默认打印机。默认值为\
    \ false。 |\n\n如前所述，如果不存在，此资源将自动为此打印机创建打印机端口。在当前形式中，底层打印机提供程序期望打印机端口的名称为 `IP_#{ipv4_address}`—因此，如果您有自定义命名的端口，它将不会被使用。\n\
    \n## 管理打印机示例\n\n创建名为 `HP LaserJet, Bldg. A Floor 20` 并由 `10.0.0.5` IP 地址的新打印机。这将在构建打印机端口时使用默认设置，因此新端口将命名为\
    \ `IP_10.0.0.0.15` 并使用端口 `9001` 和 RAW 协议，且无 SNMP，如下所示：\n\n```ruby\nwindows_printer\
    \ 'HP LaserJet, Bldg. A Floor 20' do\n driver_name 'HP LaserJet 1320'\n ipv4_address\
    \ '10.0.0.5'\nend\n```\n\n使用以下代码创建更精细的打印机和端口配置：\n\n```ruby\nwindows_printer_port\
    \ '10.0.0.10' do\n port_name 'IP_10.0.0.10'\n port_number 9001\n port_description\
    \ 'Building B print server'\n snmp_enabled true\nend\n```\n\n以下代码将创建我们的端口 `IP_10.0.0.10`，然后我们可以将打印机绑定到该端口：\n\
    \n```ruby\nwindows_printer 'HP LaserJet 6L - Copy Room' do\n driver_name 'HP LaserJet\
    \ 6L'\n ipv4_address '10.0.0.10'\n location 'Building B, Floor 13, Copy Room'\n\
    \ comment 'Haunted floor, look out for ghosts.'\nend\n```\n\n现在，当提供程序构建打印机时，它将使用我们先前用自定义设置构建的\
    \ `IP_10.0.0.10` 端口。\n\n要删除打印机，请使用 `:delete` 操作。请注意，这不会删除端口，因为该位置可能有其他打印机。要删除端口，必须单独使用\
    \ `windows_printer_port` 资源和 `:delete` 操作，如下所示：\n\n```ruby\nwindows_printer 'HP\
    \ LaserJet, Bldg. A Floor 20' do\n  action :delete\nend\n```\n\n## 与 Windows 注册表交互\n\
    \n管理类 UNIX 系统和 Windows 系统之间最著名的区别之一是 Windows 注册表。Chef 拥有用于创建、修改和删除 Windows 注册表项的资源。请注意，这些操作是不可逆的（值没有隐式备份，因此在修改值之前最好准备备份），并且它们可能非常具有破坏性。\n\
    \n注册表项的路径还必须包含注册表配置单元。可以完全指定配置单元，也可以使用以下缩写：\n\n- HKLM for `HKEY_LOCAL_MACHINE`\n\
    - HKCC for `HKEY_CURRENT_CONFIG`\n- HKCR for `HKEY_CLASSES_ROOT`\n- HKU for `HKEY_USERS`\n\
    - HKCU for `HKEY_CURRENT_USER`\n\n> Chef 10.x 使用名为 `windows_registry` 的资源，这里将为使用旧版\
    \ Chef 客户端和服务器的用户进行描述。对于使用 11.x 的新安装版本，资源是 `registry_key`，是使用较新版本 Chef 时与注册表值交互的首选方式。请使用与您的\
    \ Chef 版本对应的资源。\n\n## Chef 10.x 资源\n\n`windows_registry` 资源允许您控制注册表设置，但其操作和属性与\
    \ `registry_key` 资源不同。当需要迁移时，从 `windows_registry` 迁移到 `registry_key` 应该是一个相当直接的操作。\n\
    \n下表提供了与 `windows_registry` 资源一起使用的操作和参数的描述：\n\n| 操作 | 描述 |\n| --- | --- |\n|\
    \ `create` | 使用提供的数据创建新注册表项。 |\n| `modify` | 使用所需值更新现有注册表项。 |\n| `force_modify`\
    \ | 修改现有注册表项的值，但这样做不一致。此操作会多次检查值，以确保键包含您所需的值。 |\n| `remove` | 从现有注册表项中删除一个值。 |\n\
    | **参数** | **描述** |\n| `key_name` | 这是资源名称属性，指定要创建、修改或删除的注册表项。 |\n| `values` |\
    \ 这是要在注册表项下设置的值的哈希。单个哈希项将成为注册表项中的相应 `'Value name' => 'Value data'` 项。 |\n| `type`\
    \ | 这决定要创建的键的类型。以下是选项列表： |\n| | • `:binary`: REG_BINARY |\n| | • `:dword`: REG_DWORD\
    \ |\n| | • `:dword_big_endian`: REG_DWORD_BIG_ENDIAN |\n| | • `:expand_string`:\
    \ REG_EXPAND_SZ |\n| | • `:multi_string`: REG_MULTI_SZ |\n| | • `:string`: REG_SZ\
    \ |\n| | • `:qword`: REG_QWORD |\n| | 默认值为 `:string`。 |\n\n## 管理注册表项示例\n\n通过注册表管理\
    \ NTP 服务器，以允许与 NTP 池进行异地 NTP 同步，并每 45 分钟更新一次，直到执行三次良好同步，然后每 8 小时一次，使用以下代码：\n\n\
    ```ruby\nregkey = 'HKLM\\SYSTEM\\CurrentControlSet\\Services\\W32Time\\Parameter'\n\
    windows_registry regkey do\n  values 'AvoidTimeSyncOnWan' => 0,\n         'NtpServer'\
    \ => \"0.pool.ntp.org\",\n         'Period' => 'SpecialSkew'\nend\n```\n\n如以下代码所示，从给定位置删除注册表中的两个特定键/值对—将值设置为空可实现以下结果：\n\
    \n```ruby\nwindows_registry 'HKCU\\Software\\SomeApp\\SomeKey' do\n  values 'UnwantedValueOne'\
    \ => '',\n         'UnwantedValueTwo' => ''\n  action :remove\nend\n```\n\n还有可用的辅助方法，用于确定键是否存在和/或从注册表中获取数据。在编写围绕其他块的守卫或为其他资源提取注册表数据时，这些方法非常有用。\n\
    \n使用以下代码确定值是否存在：\n\n```ruby\nWindows::RegistryHelper.value_exists?(path, value)\n\
    ```\n\n使用以下代码检查键是否存在：\n\n```ruby\nWindows::RegistryHelper.key_exists?(path)\n\
    ```\n\n使用以下代码从注册表项中获取值：\n\n```ruby\nresult = Windows::RegistryHelper.get_value(path,\
    \ value)\n```\n\n"
