  - '[PAGE 16]


    Chef uses Ruby as the scripting language on client systems, and because of this,
    it

    is capable of running anywhere Ruby is supported. This alone makes Chef a very

    capable tool for managing a combination of different operating systems. Chef goes

    one step further by providing you with a **domain-specific language (DSL)** that

    makes writing recipes for interacting with Windows hosts look no different than

    UNIX-like platforms. With the exception of some resource names and paths and

    the existence of Windows-specific resources such as the Windows Registry, recipes

    are almost drop-in compatible with either platform. This means that the wide variety

    of existing cookbooks and recipes available for Chef are available to use with
    little

    or no modification.


    It''s also important to note that while a lot of conversations focus on server

    management, cloud scaling, and so on, Chef is not reserved solely for managing

    servers; it can be used to manage client workstations as well. With the available

    resources, you can just as easily install and configure desktop applications,
    import

    registry settings, manage users, set up printers, and so on.


    # # Interacting with end hosts


    Where Linux-based systems can execute commands over SSH, Windows platforms

    have an additional mechanism called **Windows Remote Management (WinRM)**.

    In the same way that you would leverage `knife ssh` for Linux systems, `knife`

    `winrm` is available to execute commands remotely on a Windows host using the

    WinRM protocol.


    For example, one might execute the following command for connecting to Linux hosts:


    ```

    ```

    knife ssh "role:mysql" "chef-client" --sudo -x ubuntu

    ```

    ```


    The following command would connect to Windows hosts in the same role:


    ```

    ```

    knife winrm "role:mysql" "chef-client" -x Administrator

    ```

    ```


    As you can see, the `winrm` subcommand supports executing a command on

    any number of hosts that match the supplied search criteria just like the `ssh`

    subcommand. While the protocol for communicating with the hosts may be

    different, the mechanism for interacting with them via `knife` remains consistent.


    ![](img/5439c37d2ec2a9036b89ca6c7fbf894e_16_0.png)'
  - '[PAGE 17]


    # # Bootstrapping Windows hosts


    Bootstrapping a host is intended to prepare a host for, and complete registration

    with, the Chef service (be it your own Chef server or a hosted installation).
    Hosts

    that are being bootstrapped typically contain nothing more than a bare OS

    installation; however, it is also possible to bootstrap hosts that have existing

    software configurations. The bootstrapping script is responsible for

    performing the following functions:


    +   - Installing Ruby 1.8.7 with RubyGems

    +   - Installing the RubyInstaller Development Kit (DevKit)

    +   - Installing Windows-specific gems to support Chef

    +   - Installing Chef from RubyGems.org

    +   - Writing out the validation key into `C:\\chef\\validation.pem`

    +   - Optionally writing out an encrypted data bag secret

    +   - Writing the default configuration file for Chef in `C:\\chef\\client.rb`

    +   - Creating the initial run-list JSON file in `C:\\chef\\first-boot.json`

    +   - Running `chef-client` for the first time to register the node with Chef


    An example of bootstrapping a Windows host using the Windows Remote

    Management protocol might look like the following command:


    ```

    knife bootstrap windows winrm windowshost.domain.com -x Administrator

    ```


    This command will connect to `windowshost.domain.com` as Administrator via

    the Windows Remote Management protocol and then run the commands in the

    Windows bootstrap script. For a complete view of the commands being run,

    you can find the Windows bootstrap script at `https://github.com/opscode/

    knife-windows/blob/master/lib/chef/knife/bootstrap`.


    # # Scaling with cloud providers


    By combining the ability to automatically bootstrap a Windows system with a

    provider that supplies Windows virtual hosts, you can integrate cloud servers
    into

    your infrastructure with ease. Chef has existing support for using Azure, AWS,
    and

    Rackspace APIs to manage cloud infrastructure including starting, stopping, and

    provisioning new instances with those services automatically. If you are using
    a service

    that is currently unsupported, it is entirely possible to develop a plugin to
    provide

    integration with that provider. Through Chef, you can manage a collection of on-site

    and off-site hosts with a mix of physical and virtual servers with ease. This
    means that

    you can bring up new servers in a much shorter period of time when you need them

    and do away with them when they are not in use, saving you both time and money.'
  - "[PAGE 18]\n\n# # Scripting with PowerShell\n\nModern Windows systems come with\
    \ the PowerShell runtime, an incredibly powerful tool for interacting with the\
    \ system. Naturally, as Chef is a developer-oriented way of managing systems,\
    \ writing scripts to execute on end hosts is a convenient and flexible way of\
    \ extending Chef’s functionality. Chef provides a mechanism for executing PowerShell\
    \ scripts in Windows in the same way it supports running Bash scripts on a Linux\
    \ host. A very trivial example might be the following PowerShell script that writes\
    \ a line of text into a file:\n\n```\npowershell \"say-hello\" do\n  code <<-EOH\n\
    \    $stream = [System.IO.StreamWriter] \"C:\\\\hello.txt\"\n    $stream.WriteLine(\"\
    Hello world!\")\n    $stream.Close()\n  EOH\nend\n```\n\nThe preceding code allows\
    \ you to exercise the full power of PowerShell from within your recipes by executing\
    \ scripts you define on the managed systems. These scripts can even be dynamically\
    \ generated from configuration data and other variables in your recipes.\n\n#\
    \ # Integrating with Linux-based systems\n\nHaving a heterogeneous network is\
    \ becoming more common as time goes by. Certain pieces of software either don’t\
    \ exist or are not as well supported on one platform as they are on another. As\
    \ a result, administrators encounter situations where they are required to deploy\
    \ and manage hosts running multiple operating systems side-by-side. Integrating\
    \ Windows and Linux-based systems comes with its own set of challenges, and Chef\
    \ helps to address these issues by providing a consistent way to interact with\
    \ both Linux and Windows-based systems.\n\nFor anyone who manages such infrastructure\
    \ (specifically a collection of systems running some combination of Windows and\
    \ Linux), Chef has some amazing features. Because it is capable of modeling both\
    \ Windows and Linux systems with the same declarative language and configuration\
    \ data, you can easily configure both your Linux and Windows systems using the\
    \ same tool."
  - "[PAGE 19]\n\nFor example, you could have a cookbook with a recipe that configures\
    \ the firewalls\nof your network hosts. That recipe can search Chef’s configuration\
    \ data for all other\nhosts in your network, gather up a list of their IP addresses,\
    \ and open up traffic to all\nthose IP addresses. If you provision a new host,\
    \ all of the hosts being managed will\nautomatically know about the new host and\
    \ add a new firewall rule. Additionally,\nbecause Chef provides you with its own\
    \ declarative language that hides the\nimplementation details, you can focus on\
    \ what you want to achieve and not on\nhow to achieve it. Chef knows what platform\
    \ it is running on and how to load the\nsystem-specific implementation of your\
    \ resource such as a network interface, firewall,\nuser, file, and more. It is\
    \ also entirely possible to write recipes to install Apache or\nMySQL that are\
    \ capable of working on both Linux and Windows platforms.\n\nThis makes it much\
    \ easier to integrate any number of Windows and Linux systems\nwithout having\
    \ to maintain multiple sets of scripts to achieve the same end goal.\nFor example,\
    \ assuming you had a firewall cookbook for both Windows and Linux,\nit would be\
    \ possible to write a recipe similar to the following:\n\n```\nsearch(:node, 'role:web_server').each\
    \ do |node|\n  ip = node[:external_ip]\n  firewall_rule \"#{ip}\" do\n    source\
    \ \"#{ip}\"\n    action :allow\n  end\nend\n```\n\nIn the preceding code, we are\
    \ searching for all nodes that have the role of web_server\nand which call the\
    \ firewall_rule resource to allow traffic to originate from that\nsource. Notice\
    \ that the recipe does not refer to the Windows Firewall software or\nLinux’s\
    \ firewall tool, iptables. Rather, Chef’s custom language allows us to describe\n\
    what we were doing, not how to achieve our goal. The \"how\" is implemented in\
    \ a\nprovider and the \"what\" is described by a resource, which are both provided\
    \ in our\nfirewall cookbook."
