  - '[PAGE 4]


    # # About the Author


    **John Ewart** is a system architect, software developer, and lecturer. He has
    designed and taught courses at a variety of institutions including the University
    of California, California State University, and local community colleges covering
    a wide range of computer science topics including Java, data structures and algorithms,
    operating systems fundamentals, Unix and Linux systems administration, and web
    application development. In addition to working and teaching, he maintains and
    contributes to a number of open source projects. He currently resides in Redmond,
    Washington, with his wife, Mary, and their two children.'
  - '[PAGE 5]


    # # About the Reviewers


    **Joshua Black** has been working with computers professionally for 20 years.

    He has a broad range of experience and expertise including systems and network

    administration, mobile app development, and production web applications.

    He earned a BS in Computer Science with a minor in Math from California State

    University, Chico, in 2005. He currently resides in Chico, California, with his
    wife,

    Rachel, and their four children.


    **Thabo Fletcher** is a software developer at Degreeed and co-founder of Coderbits

    with a background in network appliance engineering, web application development,

    and JavaScript injection.


    **Lauren Malhoit** has been in the IT field for over 10 years and has acquired

    several data center certifications. She''s currently a technical virtualization
    architect

    specializing in virtualization and storage in the data center. She has been writing
    for

    a few years for TechRepublic, TechRepublic Pro, and VirtualizationSoftware.com.

    As a Cisco Champion, EMC Elect, VMware vExpert, and PernixPro; Lauren stays

    involved in the community. She also hosts a bi-weekly technology podcast called

    AdaptingIT (`http://www.adaptingit.com/`). She has been a delegate for Tech Field

    Day several times as well. She recently published her first book, _VMware vCenter

    Operations Manager Essentials, Packt Publishing_.'
