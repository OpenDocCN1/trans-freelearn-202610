- raw:
  - '[PAGE 94]


    Some organizations keep all of their cookbooks inside of one repository; some
    keep multiple repositories, one for each cookbook. Regardless of what version
    control system and repository strategy you choose, keeping your cookbooks in a
    source control system is a critical part of ensuring consistent deployment of
    recipes. It is very easy to make changes locally, issue a `knife cookbook upload`
    command, and then forget to commit your changes only to have them wiped out by
    someone else at a later date. Additionally, make sure that you increment version
    numbers as you modify your cookbooks, even if they are only for internal use,
    to clearly identify changes in cookbooks.


    If you plan to release your recipes to the public, you will likely take a one-cookbook-
    per-repository approach that makes the cookbook a complete and standalone entity.
    Also, it is a good idea to make sure that you include some sort of license information
    (often in the form of a `LICENSE` file) and some sort of `README` file to go along
    with it that contains useful information about the cookbook, example usage, how
    to contribute, and so on.


    # # Testing recipes


    There are a number of ways to test your recipes; the simplest of which is to install
    them onto your Chef server and run them against a test host. This is a viable
    approach as long as your client runs do not take exceedingly long times to complete.
    However, there are, perhaps unsurprisingly, better options out there. One of those
    options is to use a library called `ChefSpec`, which provides functionalities
    similar to `RSpec` for testing your cookbooks.


    # # RSpec and ChefSpec


    For those who have not used `RSpec`, it is a framework for testing Ruby code that
    allows you to use a domain-specific language to provide tests. This is similar
    in concept to Chef''s domain-specific language for managing infrastructure. `RSpec`
    and `ChefSpec` provide a number of language primitives for expressing execution
    of code, expectations, and mocking of external components.


    # # Testing basics


    If you are new to testing software, and in particular testing Ruby code, this
    is a brief introduction to some of the concepts that we will be covering. Testing
    can happen at many different levels of the software lifecycle as follows:


    +   • Single-module level (called unit tests)

    +   • Multimodule level (known as functional tests)

    +   • System-level testing (also referred to as integration testing)'
  - '[PAGE 95]


    In the **test-driven-development (TDD)** philosophy, tests are written and executed

    early and often, even before code is written. This guarantees that, assuming your

    tests are accurate, your code conforms to your expectations from the beginning
    and

    does not regress to a previous state of nonconformity. This section will not delve

    deep into the TDD philosophy and continuous testing, but rather provide you with

    enough knowledge to begin testing the recipes that you write and feel confident
    that

    they will do the correct thing when deployed into your production environment.


    # # RSpec


    As mentioned earlier, RSpec is designed to provide a more expressive testing

    language. What this means is that the methods and primitives provided intentionally

    work together to build a higher-level language that feels more like a natural
    language

    such as English. For example, using RSpec, one could write the following code:


    `factorial(4).should eq 24`


    This, if you read it, feels like "The factorial of four should equal 24". This
    is the goal

    of RSpec''s DSL, to feel natural as you read your tests. Compare this to a similar

    JUnit test (for Java) as follows:


    `assertEquals(24, factorial(4));`


    While this is readable by most programmers, it does not feel as natural. In addition

    to this, RSpec''s DSL has contexts and activity blocks that make tests easier
    to read.

    For example, we can use RSpec as follows:


    `describe Array do`

    `  it "should be empty when created" do`

    `    Array.new.should == []`

    `  end`

    `end`

    `Again, compared to a similar NUnit (.NET example):`

    `namespace MyTest {`

    `  using System.Collection`

    `  using NUnit.Framework;`

    `  [TestFixture]`

    `  public class ArrayTest {`

    `    [Test]`

    `    public void NewArray() {`

    `      ArrayList list = new ArrayList();`

    `      Assert.AreEqual(0, list.size());`

    `    }`

    `  }`

    `}`'
  - "[PAGE 96]\n\nClearly, the RSpec test is much more concise and easier to read,\
    \ which is the goal\nof RSpec. The ChefSpec test brings the expressiveness of\
    \ RSpec to Chef cookbooks\nand recipes by providing Chef-specific primitives and\
    \ mechanisms on top of RSpec's\nsimple testing language.\n\n# # ChefSpec\n\nChefSpec,\
    \ for those who have not used it, is a fantastic addition to any Chef\ndeveloper's\
    \ collection of tools. It is easy to use and provides a convenient way\nto add\
    \ tests to your cookbooks and recipes.\n\n# # Getting started with ChefSpec\n\n\
    In order to get started with ChefSpec, you will need to install a gem that contains\
    \ the\nChefSpec libraries and all the supporting components. Not surprisingly,\
    \ that gem is\nnamed chefspec, and can be installed simply by running the following\
    \ command:\n\n```\n`gem install chefspec`\n```\n\nHowever, as there are a number\
