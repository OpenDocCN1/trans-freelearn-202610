    \ |\n| create              | This makes a new item that executes at login. |\n\
    | remove              | This removes a previously created autorun entry. |\n|\
    \ **Parameter**       | **Description** |\n| args                | These are the\
    \ arguments to pass to the autorun program. |\n| name                | This is\
    \ the resource name parameter used to name the autorun script. |\n| program  \
