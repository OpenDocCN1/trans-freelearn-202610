    \ or reconfiguration. The windows cookbook provides the `windows_reboot` resource\
    \ to notify `WindowsRebootHandler` that a reboot is required. If `WindowsRebootHandler`\
    \ is registered as a report handler, a reboot will be requested upon a complete\
    \ and successful execution of the Chef client.\n\nTypically, this resource is\
    \ notified by other resource blocks when a reboot is required, often after installing\
    \ new software or changing system settings.\n\nYour recipe will need to make sure\
    \ that the reboot handler is included with the following command:\n\n```ruby\n\
    include_recipe 'windows::reboot_handler'\n```\n\nThe following table outlines\
    \ the actions and parameters that can be associated with the `windows_reboot`\
    \ resource:\n\n| Action | Description |\n|--------|-------------|\n| request |\
    \ This requests a reboot to be scheduled once the Chef client has completed execution.\
    \ This requires `WindowsRebootHandler` to be registered as a report handler. |\n\
    | cancel | This cancels any pending reboot requests by changing the node `run_state`\
    \ setting. |\n| **Parameter** | **Description** |\n| reason | This is a textual\
    \ reason that the system is being rebooted. The default value is `Chef initiated\
    \ reboot`. |\n| timeout | This is the name attribute that specifies how long the\
    \ command will wait in seconds until rebooting. The default value is 60. |\n\n\
    ## Examples of scheduling a reboot\n\nThe following example shows you how to schedule\
    \ a reboot with a three-minute timeout at the end of a Chef client run by notifying\
    \ the reboot block when a package is successfully installed via `windows_package`:\n\
    \n```ruby\nwindows_reboot 180 do\n  reason \"Installed a new package\"\n  action\
    \ :nothing\nend\n```\n\n```ruby\nwindows_package 'sql_server' do\n  action :install\n\
    \  notifies :request, 'windows_reboot[180]'\nend\n```\n\nIf you need to cancel\
    \ a reboot, you can do so from a resource block using the following code:\n\n\
    ```ruby\nwindows_reboot do\n  action :cancel\nend\n```\n\n## Summary\n\nThis chapter\
    \ has exposed you to the various Windows-specific resources that are provided\
    \ when using Chef. As you can see, these resources are very similar to those you\
    \ may have encountered when managing Linux-based systems, only tailored to the\
    \ Windows environment.\n\nIn the next chapter, we will take a look at how to use\
    \ the resources that are available for Windows management in order to provision\
    \ an application stack using IIS, the .NET framework, and a database server.\n\
    \n## Provisioning an Application Stack\n\nNow that you have learned about the\
    \ Windows-specific resources and some background information on using Chef with\
    \ Windows, let's take a look at how to provision a full-stack application. In\
    \ this chapter, we will dissect a cookbook that is responsible for installing\
    \ an open source CMS application, Umbraco. Note that the recipe in this cookbook\
    \ requires Windows Server 2012 as the target platform, and plan accordingly if\
    \ you are going to run it yourself.\n\nIn this chapter, we will cover the following\
    \ topics:\n\n- Bootstrapping a new Windows host\n- Installing the dependencies\
    \ for the Umbraco CMS\n- Installing the Umbraco CMS on the Windows host\n- Configuring\
    \ a site in the IIS to run the Umbraco CMS\n\n### Examining the cookbook\n\nWe\
    \ will dive into a cookbook that has been written specifically to address the\
    \ installation of the Umbraco CMS along with its requirements. The source code\
    \ for this cookbook is available on GitHub at `http://github.com/johnewart/umbraco-cookbook`.\n\
    \n## Provisioning an Application Stack\n\nChef cookbooks share the same layout\
    \ and structure whether they target Windows or other platforms. The primary difference\
    \ in a cookbook that supports Windows will be that its `metadata.rb` file declares\
    \ that the cookbook supports Windows and the recipes contained within the cookbook\
    \ will support Windows through a combination of Windows-specific resources and\
    \ conditional logic that may behave differently on the Windows platform. The following\
    \ screenshot shows the layout of the `umbraco` cookbook:\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_58_0.png)\n\
    \nHere, you will notice that the cookbook looks just like any other cookbook;\
    \ it can contain folders for recipes, attributes, templates, resources, providers,\
    \ and any other Chef resources. In this case, the cookbook only contains some\
    \ default attributes and recipes as it is designed to be a compact example for\
    \ Windows.\n\nIf you look at the `metadata.rb` file for this cookbook, you will\
    \ see the following contents:\n\n```\nname              'umbraco'\nmaintainer\
    \        'John Ewart'\nmaintainer_email  'john@johnewart.net'\nlicense       \
    \    'Apache 2.0'\n```\n\ndescription 'Installs and configures umbraco, an open\
    \ source CMS for ASP.NET (http://www.umbraco.com)'\nlong_description 'Install\
    \ and configure the Umbraco CMS'\nversion '1.0'\n\n# Cookbook dependencies (IIS\
    \ and Windows)\ndepends iis\ndepends windows\n\n# Supported platforms\nsupports\
    \ 'windows'\n\nFor those who are still somewhat new to Chef, the `metadata.rb`\
    \ file describes who the maintainer of the cookbook is, what license it adheres\
    \ to, the version number, any cookbooks that it is dependent upon, and what platforms\
    \ are supported.\n\nIn this case, we can see that the cookbook supports the Windows\
    \ platform and requires the `iis` and `windows` cookbooks in order to function.\
    \ These are going to be required for just about any IIS web application you want\
    \ to install via Chef.\n\n## Installing the cookbook\n\nAs mentioned, this cookbook\
    \ has two direct dependencies, `windows` and `iis`, which in turn are required\
    \ in a third dependency, `chef_handler`. All of these cookbooks can be found at\
    \ the following locations:\n\n- `https://github.com/opscode-cookbooks/windows`\n\
    - `https://github.com/opscode-cookbooks/iis`\n- `https://github.com/opscode-cookbooks/chef_handler`\n\
    - `https://github.com/johnnewart/umbraco-cookbook`\n\n## Fetching from GitHub\n\
    \nIn order to use these resources, you will want to either download them from\
    \ GitHub or use Git to clone them to a local system. If you are not interested\
    \ in working with them as Git repositories (that is, version controlled source\
    \ code), downloading them will be the simplest way to get them. If you go to the\
    \ previous URLs, you will see a link titled **Download ZIP** on the right-hand\
    \ side of the screen, as shown in the following screenshot:\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_60_0.png)\n\
    \nIf you opt to download them as ZIP files rather than clone them with Git, you\
    \ will want to ensure the directories are named to match the proper name of the\
    \ cookbook (`chef_handler`, `windows`, `iis`, and `umbraco`). For example, if\
    \ you clone the `umbraco` cookbook, it will be put in an `umbraco-cookbook` directory,\
    \ whereas decompressing the ZIP files may result in an `umbraco-cookbook-master`\
    \ directory. Once you have them downloaded and renamed, install them on your Chef\
    \ server by running the following command from the directory where all four cookbooks\
    \ are located:\n\n`knife cookbook upload -o . chef_handler windows iis umbraco`\n\
    \nChef will validate that each cookbook’s dependencies are satisfied (or are in\
    \ the process of being uploaded) as you upload them. The `chef_handler` cookbook\
    \ must be installed in order for the `windows` cookbook to work, which is needed\
    \ to support the `iis` cookbook, and then finally the `umbraco` cookbook can be\
    \ installed as its dependencies have been met.\n"
  mdcn: "\n\n## 与 ZIP 文件交互的示例\n\n以下代码会压缩位于 `D:\\\\backups\\\\`、以当前日期命名的 ZIP 文件，其中包含\
    \ `C:\\\\development\\\\webapp\\\\` 下的文件：\n\n```ruby\nrequire 'date'\ntoday =\
    \ Date.today.strftime('%Y-%m-%d')\nwindows_zipfile 'D:\\\\backups\\\\#{today}.zip'\
    \ do\n  source 'C:\\\\development\\\\webapp'\n  action :zip\nend\n```\n\n以下代码会将位于\
    \ `D:\\\\dist\\\\ruby-1.9.3.zip` 的 ZIP 文件解压缩到 `C:\\\\ruby`，仅在校验和与指定值匹配时才会覆盖文件：\n\
    \n```ruby\nwindows_zipfile 'C:\\\\ruby' do\n  source 'D:\\\\dist\\\\ruby-1.9.3.zip'\n\
    \  checksum 'bfed985c4f0e44cd6b97f93b9440940335313384'\n  overwrite true\nend\n\
    ```\n\n## 重启 Windows\n\n通常情况下，Windows 需要重启以更新在安装或重新配置过程中更改的系统设置。windows cookbook\
    \ 提供了 `windows_reboot` 资源，用于通知 `WindowsRebootHandler` 需要重启。如果 `WindowsRebootHandler`\
    \ 已注册为报告处理程序，则在 Chef 客户端完整且成功执行后，将请求重启。\n\n通常，当需要重启时，此资源会由其他资源块通知，通常是在安装新软件或更改系统设置之后。\n\
    \n您的配方需要确保通过以下命令包含重启处理程序：\n\n```ruby\ninclude_recipe 'windows::reboot_handler'\n\
    ```\n\n下表概述了可以与 `windows_reboot` 资源关联的操作和参数：\n\n| 操作 | 描述 |\n|--------|-------------|\n\
    | request | 这会请求在 Chef 客户端执行完成后安排重启。这需要 `WindowsRebootHandler` 已注册为报告处理程序。 |\n\
    | cancel | 这会通过更改节点 `run_state` 设置来取消任何待处理的重启请求。 |\n| **参数** | **描述** |\n| reason\
    \ | 这是系统重启的文本原因。默认值为 `Chef initiated reboot`。 |\n| timeout | 这是名称属性，指定命令在重启前等待的秒数。默认值为\
    \ 60。 |\n\n## 安排重启的示例\n\n以下示例展示了如何通过 `windows_package` 成功安装软件包时通知重启块，在 Chef 客户端运行结束时安排一个三分钟超时的重启：\n\
    \n```ruby\nwindows_reboot 180 do\n  reason \"Installed a new package\"\n  action\
    \ :nothing\nend\n```\n\n```ruby\nwindows_package 'sql_server' do\n  action :install\n\
    \  notifies :request, 'windows_reboot[180]'\nend\n```\n\n如果您需要取消重启，可以使用以下代码从资源块中执行此操作：\n\
    \n```ruby\nwindows_reboot do\n  action :cancel\nend\n```\n\n## 摘要\n\n本章向您介绍了使用\
    \ Chef 时提供的各种 Windows 特定资源。如您所见，这些资源与您在管理基于 Linux 的系统时可能遇到的资源非常相似，只是针对 Windows\
    \ 环境进行了定制。\n\n在下一章中，我们将探讨如何使用可用于 Windows 管理的资源，以使用 IIS、.NET 框架和数据库服务器来配置应用程序堆栈。\n\
    \n## 配置应用程序堆栈\n\n现在您已经了解了 Windows 特定资源以及在 Windows 上使用 Chef 的一些背景信息，让我们来看看如何配置一个完整的应用程序堆栈。在本章中，我们将剖析一个负责安装开源\
    \ CMS 应用程序 Umbraco 的 cookbook。请注意，此 cookbook 中的配方要求目标平台为 Windows Server 2012，如果您打算亲自运行，请相应规划。\n\
    \n在本章中，我们将涵盖以下主题：\n\n- 引导新的 Windows 主机\n- 安装 Umbraco CMS 的依赖项\n- 在 Windows 主机上安装\
    \ Umbraco CMS\n- 在 IIS 中配置站点以运行 Umbraco CMS\n\n### 检查 cookbook\n\n我们将深入研究一个专门为解决\
    \ Umbraco CMS 及其要求的安装而编写的 cookbook。此 cookbook 的源代码可在 GitHub 上找到，地址为 `http://github.com/johnewart/umbraco-cookbook`。\n\
    \n## 配置应用程序堆栈\n\n无论针对 Windows 还是其他平台，Chef cookbook 都共享相同的布局和结构。支持 Windows 的 cookbook\
    \ 的主要区别在于，其 `metadata.rb` 文件声明该 cookbook 支持 Windows，而 cookbook 中包含的配方将通过 Windows\
    \ 特定资源和条件逻辑的组合来支持 Windows，这些逻辑在 Windows 平台上的行为可能有所不同。以下截图显示了 `umbraco` cookbook\
    \ 的布局：\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_58_0.png)\n\n在这里，您会注意到 cookbook\
    \ 看起来就像任何其他 cookbook 一样；它可以包含配方、属性、模板、资源、提供程序以及任何其他 Chef 资源的文件夹。在此示例中，cookbook\
    \ 仅包含一些默认属性和配方，因为它旨在作为 Windows 的紧凑示例。\n\n如果您查看此 cookbook 的 `metadata.rb` 文件，您将看到以下内容：\n\
    \n```\nname              'umbraco'\nmaintainer        'John Ewart'\nmaintainer_email\
    \  'john@johnewart.net'\nlicense           'Apache 2.0'\n```\n\ndescription 'Installs\
    \ and configures umbraco, an open source CMS for ASP.NET (http://www.umbraco.com)'\n\
    long_description 'Install and configure the Umbraco CMS'\nversion '1.0'\n\n# Cookbook\
    \ dependencies (IIS and Windows)\ndepends iis\ndepends windows\n\n# Supported\
    \ platforms\nsupports 'windows'\n\n对于那些对 Chef 仍有些陌生的人来说，`metadata.rb` 文件描述了 cookbook\
    \ 的维护者是谁，它遵循什么许可证，版本号是多少，它依赖哪些 cookbook，以及支持哪些平台。\n\n在此示例中，我们可以看到 cookbook 支持\
    \ Windows 平台，并且需要 `iis` 和 `windows` cookbook 才能正常工作。这些 cookbook 对于您想要通过 Chef 安装的几乎任何\
    \ IIS Web 应用程序都是必需的。\n\n## 安装 cookbook\n\n如前所述，此 cookbook 有两个直接依赖项，`windows` 和\
    \ `iis`，而它们又是第三个依赖项 `chef_handler` 所必需的。所有这些 cookbook 都可以在以下位置找到：\n\n- `https://github.com/opscode-cookbooks/windows`\n\
    - `https://github.com/opscode-cookbooks/iis`\n- `https://github.com/opscode-cookbooks/chef_handler`\n\
    - `https://github.com/johnnewart/umbraco-cookbook`\n\n## 从 GitHub 获取\n\n为了使用这些资源，您可以从\
    \ GitHub 下载它们，或者使用 Git 将它们克隆到本地系统。如果您不希望将它们作为 Git 仓库（即受版本控制的源代码）来处理，下载它们将是获取它们的最简单方式。如果您访问上述\
    \ URL，您将在屏幕右侧看到一个名为 **Download ZIP** 的链接，如下面的截图所示：\n\n![](img/5439c37d2ec2a9036b89ca6c7fbf894e_60_0.png)\n\
    \n如果您选择下载 ZIP 文件而不是使用 Git 克隆它们，您需要确保目录名称与 cookbook 的正确名称匹配（`chef_handler`、`windows`、`iis`\
    \ 和 `umbraco`）。例如，如果您克隆 `umbraco` cookbook，它将被放置在 `umbraco-cookbook` 目录中，而解压缩\
    \ ZIP 文件可能会导致 `umbraco-cookbook-master` 目录。下载并重命名后，请从包含所有四个 cookbook 的目录运行以下命令将它们安装到您的\
    \ Chef 服务器上：\n\n`knife cookbook upload -o . chef_handler windows iis umbraco`\n\
    \n在上传过程中，Chef 将验证每个 cookbook 的依赖项是否已满足（或正在上传中）。`chef_handler` cookbook 必须安装才能使\
    \ `windows` cookbook 工作，而 `windows` cookbook 又是支持 `iis` cookbook 所必需的，然后最后可以安装\
    \ `umbraco` cookbook，因为其依赖项已满足。\n\n"
