    ## 使用 Windows 特定资源


    Chef 在 Windows 系统中提供了一些特定于 Windows 的资源。Chef 可以自动确定正在执行配方的主机类型，并根据主机类型执行不同的操作。例如，安装特定软件包（如
    MySQL）在不同主机之间可能大体相同，但在 Windows 系统中可能需要略有不同的设置或需要存储注册表设置。特定于 Windows 的一些资源包括以下内容：


    - Batch 脚本

    - PowerShell 脚本

    - Autorun 脚本

    - 软件包（MSI、安装程序等）

    - 打印机

    - Windows 注册表

    - 网络路径

    - 系统任务


    ## 支持的平台


    Chef for Windows 支持编写时的最近版本的 Windows。这包括以下内容（但也可能适用于其他较新的版本）：


    - Windows Server 2003 R2

    - Windows Server 2008

    - Windows 8

    - Windows 7

    - Windows Vista


    ## 摘要


    如您所见，Chef 为 Windows 管理员提供了许多功能，无论是管理仅限于 Windows 的基础设施，还是管理异构的 Windows 和 Linux
    基础设施。


    现在您已经了解了在管理 Windows 系统时 Chef 可以为您带来的好处，让我们在下一章中了解如何安装客户端以及它如何融入 Chef 生态系统的整体架构。


    ## 2 安装客户端 – Chef 概念概述


    与所有指南一样，旅程必须从某处开始。在本章中，我们将从头开始，介绍在 Windows 上使用 Chef 的一些重要信息。它包含一些您可能已经了解的材料的简要回顾（如果您之前使用过
    Chef），然后我们继续介绍如何将 Chef 安装到 Windows 主机上。


    在本章中，我们将涵盖以下主题：


    - 回顾关键 Chef 术语

    - 描述整体 Chef 系统架构

    - 在 Windows 系统上手动安装 Chef 客户端

    - 使用 Chef 提供的引导脚本安装客户端


    ### 更好地了解 Chef


    与任何其他技术一样，Chef 有一套自己的术语，用于标识 Chef 生态系统的各种组件。以下是本书中使用的一些关键术语及其定义：


    - **Node**：节点是由 Chef 管理的系统。这些可以是服务器、桌面系统、路由器或任何能够运行 Chef 客户端并具有受支持操作系统的其他设备。

    - **Workstation**：工作站是系统管理员用于与 Chef 服务器和节点交互的特殊节点。这是执行命令行工具的地方，特别是 `knife` 命令行工具。

    - **Bootstrap**：引导是将节点设置为用作 Chef 客户端的过程。这涉及执行安装 Chef 依赖项以及 Chef 本身所需的任何工作。

    - **Bootstrap script**：安装 Chef、Ruby 和其他核心要求以及针对特定系统所需的任何其他配置有多种可能的方式。为了提供这种灵活性，引导过程是脚本化的；在
    Windows 上，这是一个批处理文件。

    - **Recipe**：配方提供实现目标所需的指令，例如安装软件包、配置防火墙、配置用户和打印机或管理其他系统资源。这些是用 Ruby 编写的，并在系统管理员通过
    Chef 控制台指定的节点上执行。

    - **Cookbook**： cookbook 是配方的集合。通常，cookbook 提供一组特定的操作，例如安装 Apache 或 MySQL、为特定软件工具提供
    Chef 资源等。

    - **Attributes**：系统的各种组件都有自己的属性；描述软件需要如何配置的属性。这些属性在各种级别定义，从节点特定设置到 cookbook 或角色的一般默认值。

    - **Role**：角色是一个数据结构，描述应用了该角色的节点应如何配置。它包含要运行的配方列表以及要应用于与该角色关联的节点的配置数据。角色示例可能包括
    MSSQL 服务器、Exchange 服务器、IIS 服务器、文件服务器等。请注意，角色本身对节点一无所知；节点与其角色之间的关联是由管理员通过将角色应用于节点来创建的。

    - **Run list**：“运行列表”是要应用于给定节点的配方列表，按特定顺序。运行列表可以由零个或多个角色或配方组成，顺序很重要，因为运行列表的项目按指定的顺序执行。因此，如果一个配方依赖于另一个配方的执行，您需要确保它们按正确的顺序运行。

    - **Resource**：资源是描述配方正在处理 _什么_ 的方式。资源示例包括文件、目录、打印机、用户、软件包等。资源是提供者中具体实现的抽象。

    - **Provider**：提供者是资源的具体实现。例如，用户是通用资源，但 LDAP 用户或 Active Directory 用户是用户资源的具体实现。所选提供者的类型将取决于平台等因素。

    - **Data bags**：数据包包含有关基础设施的共享数据。不特定于角色或资源的信息（例如防火墙规则、用户帐户等）将存储在数据包中。这是存储系统范围配置数据的好地方。

    - **Environments**：环境为资源提供了一级封装。例如，您可能有两个相同的环境，一个用于测试，一个用于生产。这些环境可能具有类似的设置，但配置不同，例如
    IP 地址和用户。


    ## Chef 架构概述


    Chef 的整体架构中有三个主要参与者：正在被管理的节点（服务器、桌面客户端、路由器等）、系统管理员用于运行 `knife` 命令的工作站，以及负责存储和管理要应用于最终主机的所有角色、配方和配置数据的
    Chef 服务。以下图表表示了 Chef 架构：


    ![](img/5439c37d2ec2a9036b89ca6c7fbf894e_23_0.png)


    节点通过 HTTP（最好是 HTTPS）使用 Chef 客户端安装中提供的 `chef-client` 脚本与 Chef 服务进行通信。这是一个 Ruby
    脚本，负责连接到配置的 Chef 服务（自托管或使用托管 Chef）并下载为该节点配置的运行列表以及所需的任何 cookbook 和配置数据。完成此操作后，`chef-client`
    将评估运行列表，以按指定顺序执行配方。


    工作站也使用 HTTP(S) 与 Chef 服务进行通信，但其工作略有不同。工作站是系统管理员使用命令行实用程序与存储在 Chef 服务中的数据进行交互的地方。从那里，管理员可以读取和修改任何系统数据为
    JSON，执行搜索，并通过 knife 命令行实用程序与节点进行交互。


    除了命令行实用程序外，Chef 还提供了一个基于 Web 的界面来修改系统数据。Web 界面可以执行的任何操作也可以使用 knife 实现；但是，有一些高级操作无法在没有
    knife 的情况下执行，例如在一组主机上执行远程命令和搜索数据。


    ## 在 Windows 上安装 Chef 客户端


    要在 Windows 上安装 Chef 客户端，有三个基本选项，如下所示：


    1. 使用 knife-windows 插件引导主机，如前所述。

    2. 下载并使用 MSI 安装程序手动安装客户端。

    3. 通过原位更新工具（如 WSUS）部署软件（此机制不会讨论，因为它超出了本书的范围）。


    ## 准备引导 Windows 主机


    如前一章所述，引导主机是安装将主机最初纳入基础设施所需的任何组件的过程。通常，这将涉及安装 Ruby 以及 Chef 客户端和身份验证所需的任何证书，以及将主机注册到您的
    Chef 服务器或托管 Chef 帐户。为此，您需要配置一个已安装 knife-windows gem 的工作站。您可以使用以下命令轻松安装该 gem：

    `gem install knife-windows`


    '
