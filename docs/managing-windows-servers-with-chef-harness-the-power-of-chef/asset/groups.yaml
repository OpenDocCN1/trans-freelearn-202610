    # # Versioning and source control


    Chef''s job is to store cookbooks and configuration data, and then give the correct
    combination to hosts that it knows about. Cookbooks maintain their own notion
    of a version as well as their dependencies'' versions. For this reason, it is
    important to treat them as artifacts of a source-controlled project and version
    them appropriately the same way you might version any other software library.
    Maintaining a predictable versioning scheme helps to ensure compatibility with
    other cookbooks and reduce conflict and errors when adding new features or refactoring
    code.


    As with any other software project, cookbook versions are typically denoted in
    the form of `MAJOR.MINOR.PATCH`. Major version number changes indicate that the
    public API is not backwards compatible. For example, deprecation or removal of
    public functionality or inconsistent behavior of public APIs would be good reasons
    to make a major version update. In contrast, minor version numbers are incremented
    when new features are added but existing public APIs are backwards compatible.
    Implementing a new method or adding support for a different service manager would
    be good reasons for increasing the minor version. Patch levels that are incremented
    as bugs are fixed, so these should be very minor changes to public APIs, if any.
    For some more information on good versioning practices, take a look at `http://semver.org`.


    Additionally, you will likely find that you are downloading cookbooks from public
    repositories. It would probably make sense to commit these to an internal repository,
    public or private, so that if you make your own changes or the public repository
    goes away, you have a version of your cookbook''s code available to you.


    The same can be said for any complicated system around, be it a software package,
    a tool, or your infrastructure configuration. It is important to see where you
    can simplify your components so that they are easily understood not only now,
    but in the future by other engineers and possibly even yourself at 3 A.M. when
    you are trying desperately to fix something.


    Where possible, it is a good idea to keep your configuration consistent and rely
    on your recipes to make the distinction in how the application gets configured.
    Remember that keeping a mental model of disparate pieces of configuration is quite
    often more complicated than reading code.'
  md: "\n## Handling multiple platforms\n\nOne of Chef's strengths is the ability\
    \ to integrate Windows hosts with non-Windows hosts. It is important to not only\
    \ develop recipes and cookbooks that are capable of supporting both Linux and\
    \ Windows hosts, but also to be able to thoroughly test them before rolling them\
    \ out into your infrastructure. Let's take a look at how you can support multiple\
    \ platforms in your recipes as well as use a popular testing framework, ChefSpec,\
    \ to write tests to test your recipes and validate platform-specific behaviors.\n\
    \n## Declaring support in your cookbook\n\nAll Chef cookbooks have a metadata.rb\
    \ file; this file outlines dependencies, ownership, version data, and compatibility.\
    \ Compatibility in a homogeneous environment is a less important property — all\
    \ the hosts run the same operating system. When you are modeling a heterogeneous\
    \ environment, the ability to describe compatibility is more important; without\
    \ it, you might try to apply a Windows-only recipe to a Linux host or the other\
    \ way around. In order to indicate the platforms that are supported by your cookbook,\
    \ you will want to add one or more supports stanzas to the metadata.rb file. For\
    \ example, a cookbook that supports Debian and Windows would have two supports\
    \ statements as follows:\n\n```\nsupports \"windows\"\nsupports \"debian\"\n```\n\
    \nHowever, if you were to support a lot of different platforms, you can always\
    \ script your configuration. For example, you could use something similar to the\
    \ following code snippet:\n\n```\n%w(windows debian ubuntu redhat fedora).each\
    \ |os|\n  supports os\nend\n```\n\n## Multiplatform recipes\n\nIn the following\
    \ code example, we will look at how we could install Apache, a popular web server,\
    \ on both a Windows and a Debian system inside of a single recipe:\n\n```\nif\
    \ platform_family? 'debian'\n  package 'apache2'\nelseif platform_family? 'windows'\n\
    \  windows_package node['apache']['windows']['service_name'] do\n    source node['apache']['windows']['msi_url']\n\
    \    installer_type :msi\n    # The last four options keep the service from failing\n\
    \    # before the httpd.conf file is created\n    options %W[\n      /quiet\n\
    \      INSTALLDIR=\"#{node['apache']['install_dir']}\"\n      ALLUSERS=1\n   \
    \   SERVERADMIN=#{node['apache']['serveradmin']}\n      SERVERDOMAIN=#{node['fqdn']}\n\
    \      SERVERNAME=#{node['fqdn']}\n    ].join(' ')\n  end\nend\ntemplate node['apache']['config_file']\
    \ do\n  source \"httpd.conf.erb\"\n  action :create\n  notifies :restart, \"service[apache2]\"\
    \nend\n# The apache service\nservice \"apache2\" do\n  if platform_family? 'windows'\n\
    \    service_name \"Apache#{node['apache']['version']}\"\n  end\n  action [ :enable,\
    \ :start ]\nend\n```\n\nIn this example, we perform a very basic installation\
    \ of the Apache 2.x service on the host. There are no modules enabled, no virtual\
    \ hosts, or anything else. However, it does allow us to define a recipe that will\
    \ install Apache, generate an `httpd.conf` file, and then enable and start the\
    \ Apache 2 service. You will notice that there is a little bit of platform-specific\
    \ configuration going on here, first with how to install the package and second\
    \ with how to enable the service.\n\nBecause the package resource does not support\
    \ Windows, the installation of the package on Windows will use the `windows_package`\
    \ resource and the package resource on a Debian host.\n\nTo make this work, we\
    \ will need some configuration data to apply during installation; skimming over\
    \ the recipe, we find that we would need a configuration hash similar to the following\
    \ code snippet:\n\n```\n'config': {\n    'apache': {\n        'version': '2.2.48',\n\
    \        'config_file': '/opt/apache2/conf/httpd.conf',\n        'install_dir':\
    \ '/opt/apache2',\n        'serveradmin': 'admin@domain.com',\n        'windows':\
    \ {\n            'service_name': 'Apache 2.x',\n            'msi_url': 'http://some.url/apache2.msi'\n\
    \        }\n    }\n}\n```\n\nThis recipe allows our configuration to remain consistent\
    \ across all nodes; we don't need to override any configuration values to make\
    \ this work on a Linux or Windows host. You may be saying to yourself \"but, /opt/apache2\
    \ won't work on Windows\". It will, but it is interpreted as \\opt\\apache2 on\
    \ the same drive as the Chef client's current working directory; thus, if you\
    \ ran Chef from C:, it would become c:\\opt\\apache2. By making our configuration\
    \ consistent, we do not need to construct any special roles to store our Windows\
    \ configuration separate from our Linux configuration.\n\nIf you do not like installing\
    \ Apache in the same directory on both Linux and Windows hosts, you could easily\
    \ modify the recipe to have some conditional logic as follows:\n\n```\napache_config_file\
    \ = if platform_family? 'windows'\n    node['apache']['windows']['config_file']\n\
    else\n    node['apache']['linux']['config_file']\nend\n```\n\n```\ntemplate apache_config_file\
    \ do\n    source \"httpd.conf.erb\"\n    action :create\n    notifies :restart,\
    \ \"service[apache2]\"\nend\n```\n\nHere, the recipe is made slightly more complicated\
    \ in order to accommodate the two platforms, but at the benefit of one consistent\
    \ cross-platform configuration specification.\n\nAlternatively, you could use\
    \ the recipe as it is defined and create two roles, one for Windows Apache servers\
    \ and the other for Linux Apache servers, each with their own configuration. An\
    \ apache_windows role may have the following override configuration:\n\n```\n\
    'config': {\n    'apache': {\n        'config_file': \"C:\\\\Apps\\\\Apache2\\\
    \\Config\\\\httpd.conf\",\n        'install_dir': \"C:\\\\Apps\\\\Apache2\"\n\
    \    }\n}\n```\n\nIn contrast, an apache_linux role might have a configuration\
    \ that looks like the following code snippet:\n\n```\n'config': {\n    'apache':\
    \ {\n        'config_file': \"/usr/local/apache2/conf/httpd.conf\",\n        'install_dir':\
    \ \"/usr/local/apache2\"\n    }\n}\n```\n\nThe impact of this approach is that\
    \ now you have to maintain separate platform-specific roles. When a host is provisioned\
    \ or being configured (either through the control panel or via knife), you need\
    \ to remember that it is a Windows host and therefore has a specific Chef role\
    \ associated with it. This leads to potential mistakes in host configuration as\
    \ a result of increased complexity.\n\n## Reducing complexity\n\nSome of the key\
    \ goals of using a tool such as Chef are as follows:\n\n- Minimizing complexity\
    \ of your configuration\n- Increasing automation\n- Guaranteeing repeatability\n\
    \nTo achieve these goals, it is important to make sure that you do not introduce\
    \ needless complexity. While Chef provides you with the mechanism to create an\
    \ incredibly complex set of configurations by using its multilevel configuration\
    \ overlays, that will likely end in trouble. As a popular quote that is attributed\
    \ to Eric Allman goes:\n\n> \"Unix gives you just enough rope to hang yourself\
    \ -- and then a couple more feet, just to be sure.\"\n\n## Versioning and source\
    \ control\n\nChef's job is to store cookbooks and configuration data, and then\
    \ give the correct combination to hosts that it knows about. Cookbooks maintain\
    \ their own notion of a version as well as their dependencies' versions. For this\
    \ reason, it is important to treat them as artifacts of a source-controlled project\
    \ and version them appropriately the same way you might version any other software\
    \ library. Maintaining a predictable versioning scheme helps to ensure compatibility\
    \ with other cookbooks and reduce conflict and errors when adding new features\
    \ or refactoring code.\n\nAs with any other software project, cookbook versions\
    \ are typically denoted in the form of `MAJOR.MINOR.PATCH`. Major version number\
    \ changes indicate that the public API is not backwards compatible. For example,\
    \ deprecation or removal of public functionality or inconsistent behavior of public\
    \ APIs would be good reasons to make a major version update. In contrast, minor\
    \ version numbers are incremented when new features are added but existing public\
    \ APIs are backwards compatible. Implementing a new method or adding support for\
    \ a different service manager would be good reasons for increasing the minor version.\
    \ Patch levels that are incremented as bugs are fixed, so these should be very\
    \ minor changes to public APIs, if any. For some more information on good versioning\
    \ practices, take a look at `http://semver.org`.\n\nAdditionally, you will likely\
    \ find that you are downloading cookbooks from public repositories. It would probably\
    \ make sense to commit these to an internal repository, public or private, so\
    \ that if you make your own changes or the public repository goes away, you have\
    \ a version of your cookbook's code available to you.\n\nThe same can be said\
    \ for any complicated system around, be it a software package, a tool, or your\
    \ infrastructure configuration. It is important to see where you can simplify\
    \ your components so that they are easily understood not only now, but in the\
    \ future by other engineers and possibly even yourself at 3 A.M. when you are\
    \ trying desperately to fix something.\n\nWhere possible, it is a good idea to\
    \ keep your configuration consistent and rely on your recipes to make the distinction\
    \ in how the application gets configured. Remember that keeping a mental model\
    \ of disparate pieces of configuration is quite often more complicated than reading\
    \ code.\n"
  mdcn: "\n\n## 处理多个平台\n\nChef 的优势之一是能够将 Windows 主机与非 Windows 主机集成。不仅要开发能够同时支持 Linux\
    \ 和 Windows 主机的食谱和 cookbook，还要在将其部署到基础设施之前对其进行彻底测试，这一点至关重要。让我们来看看如何在食谱中支持多个平台，以及如何使用流行的测试框架\
    \ ChefSpec 来编写测试，以测试食谱并验证特定于平台的行为。\n\n## 在 cookbook 中声明支持\n\n所有 Chef cookbook\
    \ 都有一个 metadata.rb 文件；该文件概述了依赖项、所有权、版本数据和兼容性。在同构环境中，兼容性是一个不太重要的属性——所有主机都运行相同的操作系统。当你建模异构环境时，描述兼容性的能力就更加重要；如果没有它，你可能会尝试将仅适用于\
    \ Windows 的食谱应用到 Linux 主机上，或者反之亦然。为了指示 cookbook 支持的平台，你需要向 metadata.rb 文件添加一个或多个\
    \ supports 语句。例如，支持 Debian 和 Windows 的 cookbook 将有如下两个 supports 语句：\n\n```\nsupports\
    \ \"windows\"\nsupports \"debian\"\n```\n\n但是，如果你要支持大量不同的平台，可以始终对配置进行脚本化。例如，你可以使用类似于以下代码片段的内容：\n\
    \n```\n%w(windows debian ubuntu redhat fedora).each |os|\n  supports os\nend\n\
    ```\n\n## 多平台食谱\n\n在以下代码示例中，我们将探讨如何在单个食谱中同时在 Windows 和 Debian 系统上安装 Apache（一种流行的\
    \ Web 服务器）：\n\n```\nif platform_family? 'debian'\n  package 'apache2'\nelseif\
    \ platform_family? 'windows'\n  windows_package node['apache']['windows']['service_name']\
    \ do\n    source node['apache']['windows']['msi_url']\n    installer_type :msi\n\
    \    # The last four options keep the service from failing\n    # before the httpd.conf\
    \ file is created\n    options %W[\n      /quiet\n      INSTALLDIR=\"#{node['apache']['install_dir']}\"\
    \n      ALLUSERS=1\n      SERVERADMIN=#{node['apache']['serveradmin']}\n     \
    \ SERVERDOMAIN=#{node['fqdn']}\n      SERVERNAME=#{node['fqdn']}\n    ].join('\
    \ ')\n  end\nend\ntemplate node['apache']['config_file'] do\n  source \"httpd.conf.erb\"\
    \n  action :create\n  notifies :restart, \"service[apache2]\"\nend\n# The apache\
    \ service\nservice \"apache2\" do\n  if platform_family? 'windows'\n    service_name\
    \ \"Apache#{node['apache']['version']}\"\n  end\n  action [ :enable, :start ]\n\
    end\n```\n\n在此示例中，我们在主机上执行 Apache 2.x 服务的非常基本的安装。没有启用任何模块，没有虚拟主机，也没有其他内容。但是，它确实允许我们定义一个食谱，该食谱将安装\
    \ Apache，生成一个 `httpd.conf` 文件，然后启用并启动 Apache 2 服务。你会注意到这里有一点特定于平台的配置，首先是如何安装软件包，其次是如何启用服务。\n\
    \n由于 package 资源不支持 Windows，因此 Windows 上的软件包安装将使用 `windows_package` 资源，而 Debian\
    \ 主机上则使用 package 资源。\n\n为了使其正常工作，我们需要在安装期间应用一些配置数据；浏览食谱，我们发现需要一个类似于以下代码片段的配置哈希：\n\
    \n```\n'config': {\n    'apache': {\n        'version': '2.2.48',\n        'config_file':\
    \ '/opt/apache2/conf/httpd.conf',\n        'install_dir': '/opt/apache2',\n  \
    \      'serveradmin': 'admin@domain.com',\n        'windows': {\n            'service_name':\
    \ 'Apache 2.x',\n            'msi_url': 'http://some.url/apache2.msi'\n      \
    \  }\n    }\n}\n```\n\n此食谱允许我们的配置在所有节点上保持一致；我们不需要覆盖任何配置值即可在 Linux 或 Windows 主机上使其正常工作。你可能会对自己说“但是，/opt/apache2\
    \ 在 Windows 上无法工作”。它可以工作，但它会被解释为 Chef 客户端当前工作目录所在驱动器上的 \\opt\\apache2；因此，如果你从\
    \ C: 运行 Chef，它将变成 c:\\opt\\apache2。通过使配置保持一致，我们不需要构建任何特殊角色来将 Windows 配置与 Linux\
    \ 配置分开存储。\n\n如果你不喜欢在 Linux 和 Windows 主机上将 Apache 安装在同一目录中，你可以轻松修改食谱，添加一些条件逻辑，如下所示：\n\
    \n```\napache_config_file = if platform_family? 'windows'\n    node['apache']['windows']['config_file']\n\
    else\n    node['apache']['linux']['config_file']\nend\n```\n\n```\ntemplate apache_config_file\
    \ do\n    source \"httpd.conf.erb\"\n    action :create\n    notifies :restart,\
    \ \"service[apache2]\"\nend\n```\n\n在此，食谱变得稍微复杂一些，以便适应两个平台，但其好处是具有一个一致的跨平台配置规范。\n\
    \n或者，你可以按原样使用食谱，并创建两个角色，一个用于 Windows Apache 服务器，另一个用于 Linux Apache 服务器，每个角色都有自己的配置。apache_windows\
    \ 角色可能具有以下覆盖配置：\n\n```\n'config': {\n    'apache': {\n        'config_file': \"\
    C:\\\\Apps\\\\Apache2\\\\Config\\\\httpd.conf\",\n        'install_dir': \"C:\\\
    \\Apps\\\\Apache2\"\n    }\n}\n```\n\n相比之下，apache_linux 角色可能具有类似于以下代码片段的配置：\n\n\
    ```\n'config': {\n    'apache': {\n        'config_file': \"/usr/local/apache2/conf/httpd.conf\"\
    ,\n        'install_dir': \"/usr/local/apache2\"\n    }\n}\n```\n\n这种方法的影响是，现在你必须维护特定于平台的单独角色。当主机被配置或正在配置时（无论是通过控制面板还是通过\
    \ knife），你都需要记住它是 Windows 主机，因此与之关联的特定 Chef 角色。这会导致由于复杂性增加而可能出现主机配置错误。\n\n## 降低复杂性\n\
    \n使用 Chef 等工具的一些关键目标如下：\n\n- 尽量减少配置的复杂性\n- 提高自动化程度\n- 保证可重复性\n\n为了实现这些目标，重要的是要确保你不会引入不必要的复杂性。虽然\
    \ Chef 为你提供了使用其多级配置覆盖创建极其复杂的配置集的机制，但这很可能会导致麻烦。正如 Eric Allman 所说的一句流行引语：\n\n> \"\
    Unix 给你足够的绳子来吊死自己——然后再多几英尺，以确保万无一失。\"\n\n## 版本控制和源代码管理\n\nChef 的工作是存储 cookbook\
    \ 和配置数据，然后将正确的组合提供给它所知道的主机。Cookbook 维护着自己的版本概念以及其依赖项的版本。出于这个原因，重要的是将它们视为源代码控制项目的工件，并像对待任何其他软件库一样对它们进行适当的版本控制。保持可预测的版本控制方案有助于确保与其他\
    \ cookbook 的兼容性，并减少在添加新功能或重构代码时的冲突和错误。\n\n与任何其他软件项目一样，cookbook 版本通常以 `MAJOR.MINOR.PATCH`\
    \ 的形式表示。主版本号的更改表示公共 API 不向后兼容。例如，弃用或删除公共功能或公共 API 的行为不一致，都是进行主版本更新的充分理由。相比之下，当添加新功能但现有公共\
    \ API 向后兼容时，次要版本号会递增。实现新方法或添加对不同服务管理器的支持，都是增加次要版本的充分理由。修补级别在修复错误时递增，因此这些对公共 API\
    \ 应该是非常小的更改，如果有的话。有关良好版本控制实践的更多信息，请参阅 `http://semver.org`。\n\n此外，你可能会发现自己正在从公共存储库下载\
    \ cookbook。将它们提交到内部存储库（公共或私有）可能是有意义的，这样如果你对 cookbook 进行了更改，或者公共存储库消失，你就可以使用 cookbook\
    \ 代码的一个版本。\n\n对于任何复杂的系统，无论是软件包、工具还是基础设施配置，都可以说同样的话。重要的是看看你在哪里可以简化组件，以便它们不仅现在容易理解，而且将来由其他工程师（甚至可能是你自己在凌晨\
    \ 3 点试图拼命修复某个问题时）也能轻松理解。\n\n在可能的情况下，保持配置一致并依靠食谱来区分应用程序的配置方式是个好主意。请记住，保持对分散配置片段的心理模型通常比阅读代码要复杂得多。\n\
    \n"
