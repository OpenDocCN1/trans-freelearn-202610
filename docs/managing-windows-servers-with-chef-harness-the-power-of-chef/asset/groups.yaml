    This book is designed for system administrators who have had some exposure to
    Chef, either casually or in-depth. It covers the Windows-specific facets of Chef
    and expects that you have a working installation of the Chef server available
    for you to use, either hosted or self-managed. A working knowledge of some programming
    language, preferably Ruby, will be needed to get the most out of the examples
    and to build your own recipes.


