    # # The Chef 0.11.x resource


    In the newer versions of Chef, the `registry_key` resource is used for setting
    values

    in the Windows Registry, as described in the following table:


    | registry_key |

    | --- |

    | **Action** | **Description** |

    | `create` | This creates a new registry key with the provided data. |

    | `create_if_missing` | This creates a key or value if it does not exist. |

    | `delete` | This deletes the specified values for a specified registry key. |

    | `delete_key` | This deletes a specific key and all subkeys. |

    | **Parameter** | **Description** |

    | `key` | This is the resource name attribute specifying which registry key

    to create, modify, or remove. |

    | `architecture` | This specifies the architecture for which the keys will be
    created.

    The possible values are as follows:


    • :x86: Force 32-bit registry

    • :x86_64: Force 64-bit registry

    • :machine: Allow the client to determine


    The default value is :machine. |

    | `provider` | This determines which provider to use for manipulating the

    registry. Currently, there is only one (Chef::Provider::Wind

    ows::Registry) whose short name is registry_key, but it is

    possible that this could change in the future.


    The default value is registry_key. |

    | `recursive` | This determines whether this operation should be performed

    recursively. When creating a new registry key, create any

    required path components; when deleting, delete all subkeys. |

    | `values` | This is an array of hashes that contain the values to be set under

    the specified registry key. Each hash is composed of three keys

    which are as follows:


    • :name: The value''s name

    • :type: The type of value stored

    • :data: The data to store


    The :type key has the same options as the type for the

    windows_registry entries and defaults to :string. |'
  - "[PAGE 49]\n\n# # Examples of managing Registry values\n\nTo set the NTP configuration\
    \ the same way that would have been done with the\nwindows_registry resource,\
    \ a matching registry_key resource would look like\nthe following code:\n\n```\n\
    regkey = 'HKLM\\\\SYSTEM\\\\CurrentControlSet\\\\Services\\\\W32Time\\\\Parameter'\n\
    \nregistry_key regkey do\n  values [\n    :name => 'AvoidTimeSyncOnWan',\n   \
    \ :type => :reg_dword,\n    :data => 0\n    }, {\n    :name => 'NtpServer',\n\
    \    :data => \"0.pool.ntp.org\",\n    }, {\n    :name => 'Period',\n    :type\
    \ => :reg_string,\n    :data => 'SpecialSkew'\n    },]\n  action :create\nend\n\
    ```\n\n# # Managing the system path\n\nChef has resources to support manipulating\
    \ the system path. This is useful\nwhen installing new software or configuration\
    \ that needs to make changes\nto the system path.\n\nThe following table illustrates\
    \ the available actions and parameters when using\nthe windows_path resource:\n\
    \n| windows_path    |    |\n|---------------|----|\n| **Action**    | **Description**\
    \    |\n| add    | This adds a new entry to the system path.    |\n| remove  \
    \  | This removes an entry from the system path.    |\n| **Parameter**    | **Description**\
    \    |\n| path    | This is the resource name attribute specifying the directory\
    \ to\n    add to the system path.    |"
  - "[PAGE 50]\n\n# # Examples of modifying the path\n\nAdd Ruby 2.1.0's binaries\
    \ to the system path as follows:\n\n```\n```\nwindows_path 'C:\\Ruby\\2.1.0\\\
    bin' do\n  action :add\nend\n```\n```\n\nRemove Ruby 1.9.3 from the system path\
    \ as follows:\n\n```\n```\nwindows_path 'C:\\Ruby\\1.9.3\\bin' do\n  action :remove\n\
    end\n```\n```\n\n# # Scheduling tasks\n\nThe `windows_task` resource allows you\
    \ to create, delete, or execute a Windows scheduled task. These are tasks that\
    \ execute at regular intervals and are useful for things such as running the Chef\
    \ client regularly, checking for updates, cleaning up temporary files, downloading\
    \ cache data, or anything else that needs to be scheduled.\n\n> > This resource\
    \ provider requires Windows Server 2008 because of the API that it uses.\n\nThe\
    \ following table lists the available actions and parameters when creating scheduled\
    \ tasks through the `windows_task` resource:\n\n| Action | Description |\n|---|---|\n\
    | `create` | This creates a new scheduled task. |\n| `delete` | This deletes a\
    \ task. |\n| `run` | This runs the named task. |\n| `change` | This updates the\
    \ properties of a specified task. |"
