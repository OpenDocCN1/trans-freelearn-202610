    \ of a specified task. |\n\n| Parameter | Description |\n|---|---|\n| name | This\
    \ is the resource name attribute specifying the name of the task (arbitrary name).\
    \ |\n| command | This is the command to execute on an interval. |\n| cwd | This\
    \ specifies the directory to run the command from. |\n| user | This is the user\
    \ to execute the command as. |\n| password | This is the user's password. |\n\
    | run_level | The level of privileges to run with are listed as follows:\n\n*\
    \ :highest\n* :limited\n\nThe default value is :limited. |\n| frequency | This\
    \ is the unit of time for which this command executes; the options are as follows:\n\
    \n* :minute\n* :hourly\n* :daily\n* :weekly\n* :monthly\n* :once\n* :on_login\n\
    * :onstart\n* :on_idle\n\nThe default value is :hourly |\n| frequency_modifier\
    \ | This is the frequency interval such as 15, 2, 30, and so on. This is multiplied\
    \ by the unit of time, so a modifier of 15 combined with :minute as the frequency\
    \ would cause the command to repeat every 15 minutes.\n\nThe default value is\
    \ 1. |\n| start_day | This is an optional date to start the interval, formatted\
    \ as MM/DD/YYYY. This is the first date on which the command is first executed\
    \ and then runs on the specified frequency interval. The command runs immediately\
    \ if this parameter is not specified. |\n| start_time | This determines the time\
    \ of the day to perform the first execution (immediately if nil). The format is\
    \ HH:MM. |\n\n## Examples of managing Windows tasks\n\nRun Chef every 15 minutes\
    \ with the following code:\n\n```ruby\nwindows_task 'Chef client' do\n  user 'Administrator'\n\
    \  password '$ecR3t'\n  cwd 'C:\\chef\\bin'\n  command 'chef-client -L C:\\tmp\\\
    '\n  run_level :highest\n  frequency :minute\n  frequency_modifier 15\nend\n```\n\
    \nDelete the Chef client task as follows:\n\n```ruby\nwindows_task 'Chef client'\
    \ do\n  action :delete\nend\n```\n\n## Interacting with Windows pagefiles\n\n\
    This resource allows you to set the default (and create if it does not exist)\
    \ or delete a Windows pagefile. Chef can designate the initial size, maximum size,\
    \ and management pattern for the newly created pagefile.\n\nThe following table\
    \ illustrates the actions and parameters that can be used with the windows_pagefile\
    \ resource:\n\n| windows_pagefile | |\n|-----------------------|----|\n| **Action**\
    \ | **Description** |\n| set | This sets the default system pagefile to the specified\
    \ pagefile. If the pagefile does not exist, the provider will create it automatically.\
    \ |\n| delete | This deletes the specified pagefile. |\n| **Parameter** | **Description**\
    \ |\n| name | This is the resource name attribute specifying the path to the pagefile.\
    \ |\n| system_managed | This allows the system to manage this pagefile (initial\
    \ size = 0, maximum size = 0). |\n| automatic_managed | Should the size of the\
    \ pagefile be automatically managed? If so, the initial size and maximum size\
    \ are ignored.\n\nThe default value is false. |\n| initial_size | This is the\
    \ initial size of the pagefile in bytes. |\n| maximum_size | This is the maximum\
    \ size of the pagefile in bytes. |\n\n## Examples of how to manage the pagefile\n\
    \nSet the default pagefile to `D:\\pagefile.sys` with an initial size of 8 GB\
    \ and a maximum size of 16 GB (creating it, if need be) with the following code:\n\
    \n```ruby\none_gb = 1024 * 1024 * 1024\nwindows_pagefile 'D:\\\\pagefile.sys'\
    \ do\n  initial_size (8 * one_gb)\n  maximum_size (16 * one_gb)\n  system_managed\
    \ false\n  automatic_managed false\n  action :set\nend\n```\n\nDelete the pagefile\
    \ at `X:\\pagefile.sys` as shown in the following code:\n\n```ruby\nwindows_pagefile\
    \ 'X:\\\\pagefile.sys' do\n  action :delete\nend\n```\n\n## ZIP files\n\nThere\
    \ is not a consistent way to natively manage packing or unpacking of ZIP files\
    \ on all Windows platforms. To work around this, the `windows_zipfile` resource\
    \ provides a pure Ruby implementation for manipulating ZIP files on the Windows\
    \ platform.\n\nThe following table lists the actions and parameters available\
    \ for the `windows_zipfile` resource:\n\n| Action | Description |\n| --- | ---\
    \ |\n| `unzip` | This decompresses a specified ZIP file at the source into the\
    \ destination. |\n| `zip` | This creates a ZIP file at the destination from the\
    \ source. |\n| **Parameter** | **Description** |\n| `path` | This is the resource\
    \ name attribute specifying the path – unzipping this designates where the unzipped\
    \ files go, while zipping the path specifies where the ZIP file is to be created.\
    \ |\n| `source` | This indicates the ZIP file location to uncompress when unzipping,\
    \ or the directory containing files to be compressed when zipping. |\n| `checksum`\
    \ | This is the optional checksum that verifies whether the ZIP file is the expected\
    \ one before decompressing it. |\n| `overwrite` | This determines whether this\
    \ operation should overwrite files.\n\nThe default value is false. |\n\n"
