    # 关于 Packt 开源


    2010 年，Packt 推出了两个新品牌，Packt Open Source 和 Packt Enterprise，以继续其专业化的重点。本书是 Packt
    Open Source 品牌的一部分，该品牌专注于围绕开源许可构建的软件图书，并为从高级开发人员到初学者网页设计师的任何人提供信息。开源品牌还运行 Packt
    的开源版税计划，通过该计划，Packt 为每个销售其软件图书的开源项目提供版税。


