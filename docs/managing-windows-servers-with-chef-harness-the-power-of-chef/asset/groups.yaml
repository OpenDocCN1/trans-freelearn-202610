    # # 5 Managing Cloud Services with Chef


    One of the very powerful uses of Chef is leveraging it to extend your infrastructure
    into the cloud as seamlessly as onsite hardware. Chef has a number of mechanisms
    for integrating with popular cloud service providers. In this chapter, we find
    out how to use Chef to manage and deploy our software to a variety of popular
    cloud service providers.


    In this chapter, we will cover the following topics:


    +   - Microsoft Azure

    +   - AWS EC2

    +   - Rackspace Cloud


    # ## Working with Microsoft Azure


    Azure is Microsoft’s competitor to EC2 and Rackspace Cloud. Any of the three will
    provide you with Windows virtualization, so included in this chapter is the information
    on how to integrate Azure with Chef.


    The `knife-azure` gem provides the functionality needed to control your Azure
    account via the `knife` utility. Chef uses plugins to provide the extended functionality,
    including managing cloud services. Support for Azure is present in a Ruby gem
    named `knife-azure` and is installed via the `gem` command-line utility as follows:


    ```

    ```

    gem install knife-azure

    ```

    ```'
