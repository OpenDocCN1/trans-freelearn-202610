    can contain folders for recipes, attributes, templates, resources, providers,
    and any other Chef resources. In this case, the cookbook only contains some default
    attributes and recipes as it is designed to be a compact example for Windows.


    If you look at the `metadata.rb` file for this cookbook, you will see the following
