    The following table lists the available actions and parameters for the windows_package
    resource:


    | Action | Description |

    |---|---|

    | install | This installs a software package. |

    | remove | This removes the specified package. |

    | Parameter | Description |

    | package_name | This specifies the name attribute and is the display name of
    the application installation package; this is the value in the DisplayName registry
    key, typically found in CurrentVersion\\Uninstall under one of the following registry
    keys: * HKLM\\Software\\Microsoft\\Windows * HKCU\\Software\\Microsoft\\Windows
    * HKLM\\Software\\Wow6464Node\\Microsoft\\Windows |

    | installer_type | The possible values for the installer type are :msi, :inno,
    :nsis, :wise ; :installsheild, and :custom. Without this value, the provider will
    try to guess the mechanism by examining the file. |

    | source | This determines where to locate the installer; this can be a local
    path or a URL. In cases where the path is a URL, the installer will be downloaded
    and executed. |

    | checksum | This is the SHA-256 checksum of the file. It is typically used in
    conjunction with a download URL–if the cached file matches the checksum, Chef
    will not re-download the file present at the URL. It also prohibits unexpected
    packages from being installed. |

    | options | This includes any command-line options to pass to the installer. |

    | timeout | This is the download timeout (the default is 10 minutes). |

    | version | This is the version of the package being installed. This can be found
    in the DisplayVersion value in the application''s registry settings. If the currently
    installed version (value in the registry) does not match this, the package will
    be installed/upgraded. |

    | success_codes | This is an array of return codes that indicates that the package
    was successfully installed. Typically, this is used with custom installers, but
    there are plenty of other possible cases where this is useful. The default value
    is (0, 42, 127) |'
  - '[PAGE 40]


    # # Examples of installing Windows packages


    Using a locally provided file, perform an installation of Ruby 1.9.3-p448. This

    package uses the Inno Setup packager and a hint is provided, but remember that

    even without it, the provider will try to determine the installer type:


    ```

    ```

    windows_package "Ruby 1.9.3-p448" do

    source File.join("C:", "temp", "rubyinstaller-1.9.3-p448.exe")

    options ''/dir="C:/Ruby193" /tasks="modpath"''

    installer_type :inno

    action :install

    end

    ```

    ```


    You can specify arbitrary flags to pass to an installer that does not use one
    of the

    known packaging systems. One example of this is Firefox, which supports passing

    the -ms command-line arguments to the installer in order to run in silent mode:


    ```

    ```

    ff_url = "http://archive.mozilla.org/pub/mozilla.org/mozilla.org/

    firefox/releases/28.0b4/win32/en-US/Firefox%20Setup%2028.0b4.exe"

    windows_package ''Mozilla Firefox 28.0b4 (x86 en-US)'' do

    source ff_url

    action :install

    installer_type :custom

    options ''-ms''

    end

    ```

    ```


    The options for Firefox can be found at https://wiki.mozilla.org/

    Installer:Command_Line_Arguments.


    In order to remove a previously installed package, such as iTunes, make use of
    the

    :remove action as follows:


    ```

    ```

    windows_package "iTunes" do

    action :remove

    end

    ```

    ```


    # # Manipulating printers


    Chef provides two different resources for managing printers – ports and printers

    themselves. The windows_printer_port resource allows you to install TCP/IP

    printer ports on a Windows host to connect a printer to. The windows_printer

    resource is responsible for an actual printer installation, and they are both
    used

    in conjunction with one another.'
  - '[PAGE 41]


    # # Managing printer ports


    With the `windows_printer_port` resource, you can create and delete TCP/IPv4 printer
    ports. This resource is useful for creating printer ports with specific settings
    when you need control over the port configuration. The `windows_printer` resource
    uses the `windows_printer_port` resource to dynamically create printer ports as
    needed, so this typically comes in handy only if the default settings are insufficient.


    The available actions and parameters for the `windows_printer_port` resource are
    described in the following table:


    | Action | Description |

    |---|---|

    | `create` | This creates a new TCP/IP printer port (default action). |

    | `delete` | This deletes a named TCP/IP printer port. |

    | **Parameter** | **Description** |

    | `ipv4_address` | This specifies the resource name attribute, that is, the IPv4
    address that the port is configured for. |

    | `port_name` | This gives the optional port name. The default value is `IP_#{ipv4_address}`
    |

    | `port_number` | This gives the optional port number. The default value is 9100.
    |

    | `port_description` | This gives the optional port description. |

    | `snmp_enabled` | This gives the optional flag that marks SNMP as enabled or
    disabled. The default value is false. |

    | `port_protocol` | This gives the optional port protocol. The following values
    are supported: * 1 (RAW) * 2 (LPR) The default value is 1. |


    > > The printer resources depend on PowerShell to make certain that `recipe[powershell]`
    is included on the node''s expanded run list to ensure the powershell cookbook
    is downloaded to avoid circular dependencies.'
