    In addition to knowing what flavor host to use, you need an image identifier (similar
    to an AMI identifier) to install onto the new host. Again, this list may vary
    with the region and change over time, so there is a command to list the various
    images, rackspace image list, which is given as follows:


    ```

    $ knife rackspace image list --rackspace-region=IAD | grep -i windows

    db7692f7-3cfa-4a9f-a072-99b21bd126da Windows Server 2008 R2 SP1

    a2139adc-df9b-98dc-aa10-5dcdff8a982b Windows Server 2012 + SQL Server

    7e106eaa-c863-49cb-bf5a-0cb7c7fc9ba1 Windows Server 2012 + SharePoint

    ```


    As you can see, there are a number of Windows distributions available to configure.
    In order to provision a new host, you will use the server create command, similar
    to the EC2 command. The following knife command would provision a 1 GB host running
    Windows Server 2012 in the IAD datacenter:


    ```

    $ knife rackspace server create \

    --I db7692f7-3cfa-4a9f-a072-99b21bd126da \

    --flavor 3 --rackspace-region=IAD \

    --server-create-timeout 1800

    ```


    ## Injecting configuration into the virtual machine


    Similar to EC2, we need to inject some commands when the host is provisioned to
    open up the firewall and perform a few other tasks. Save the following to a file,
    bootstrap.cmd:


    ```

    net start w32time

    w32tm /config /manualpeerlist:"0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org"
    /syncfromflags:manual /reliable:yes /update

    w32tm /resync

    netsh advfirewall firewall set rule group="remote administration" new enable=yes

    netsh advfirewall firewall add rule name="WinRM Port" dir-in action=allow protocol=TCP
    localport=5985

    ```


    This script will start the time service, sync the clock, and open the firewall
    on port 5985 to allow WinRM to connect. Once we have created this file, we need
    to inject it into the Rackspace virtual machine as a special file named C:\cloud-automation\bootstrap.cmd
    when it gets provisioned, and tell knife to use WinRM instead of SSH to bootstrap
    the host:


    '
