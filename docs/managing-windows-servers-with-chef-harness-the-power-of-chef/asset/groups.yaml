  - "[PAGE 99]\n\n# # Expanding your tests\n\nChefSpec provides a comprehensive suite\
    \ of tools for testing your recipes; you can stub and mock resources (replace\
    \ their real behavior with some artificial behavior), simulate different platforms,\
    \ and more. Let’s take a look at some more complex examples to see what other\
    \ things we can do with ChefSpec. Let’s look at a hypothetical example for simulating\
    \ the installation of MySQL on Windows 2012 and some things we might want to validate\
    \ during such a run. The following code example demonstrates testing our recipe\
    \ when executed on a Windows 2012 host:\n\n```\n```\ncontext 'when run on Windows\
    \ 2012' do\n  let(:chef_run) do\n    # construct a 'runner' (simulate chef-client)\
    \ running\n    # on a Windows 2012 host\n    runner = ChefSpec::ChefRunner.new(\n\
    \      'platform' => 'windows',\n      'version' => '2012'\n    )\n    # set a\
    \ configuration variable\n    runner.node.set['mysql']['install_path'] = 'C:\\\
    \\temp'\n    runner.node.set['mysql']['service_user'] = 'SysAppUser'\n    runner.converge('mysql::server')\n\
    \  end\n\n  it 'should include the correct Windows server recipe' do\n    chef_run.should\
    \ include_recipe 'mysql::server_windows'\n  end\n\n  it 'should create an INI\
    \ file in the right directory' do\n    ini_file = \"C:\\\\temp\\\\mysql\\\\mysql.ini\"\
    \n    expect(chef_run).to create_template ini_file\n  end\nend\n```\n```\n\nBy\
    \ constructing the runner with the platform and version options, the test will\
    \ exercise running the `mysql::server` recipe and pretend as though it were running\
    \ on a Windows 2012 host. This allows us to set up expectations about the templates\
    \ that would be created, recipes that are being executed, and more on that particular\
    \ platform. Presuming that the `mysql::server` recipe was to delegate to the OS-specific\
    \ recipe on a given platform, we could write another test as follows:\n\n```\n\
    ```\ncontext 'when run on Debian' do\n  let(:chef_run) do\n    runner = ChefSpec::ChefRunner.new(\n\
    \      'platform' => 'debian'\n    )\n    runner.node.set['mysql']['install_path']\
    \ = '/usr/local'\n    runner.node.set['mysql']['service_user'] = 'mysql'\n```\n\
    ```"
