  保存后，可通过访问 `my_reports` 查看报表。如截图所示，报表是一个扩展名为 `.prpt` 的单个文件。第 11 章 *The PRPT Format
  and the Java API to Build It* 将介绍 `.prpt` 文件。此阶段它只是一个包含 Pentaho 报表的单一文件。`.prpt`
  格式的报表可像普通文件一样复制、移动、删除和重命名，用户体验无变化。


  ![](img/9337ac94537bf7e092e1ea6531dce8fd_117_0.png)


  为完成报表生命周期，本章最后简要说明如何从文件系统打开报表。操作简单易懂，与保存类似，打开 Pentaho 报表与打开普通文件无异。在 Report Designer
  中点击菜单 File 再选 Open...，选择文件系统的 .prpt 文件后点确定即可。


  报表会再次导入 Pentaho Report Designer，可修改和预览。如保存和另存为...所示，工具栏中可见文件夹图标（📁）作为上层菜单 Open...
  的快捷方式。


  ![](img/9337ac94537bf7e092e1ea6531dce8fd_117_1.png)


  *可查看 https://github.com/fcorti/pentaho-8-reporting-for-java-developers 的 GitHub
  仓库，其中 `Chapter 02 - Getting started with Report Designer/my_reports` 文件夹存放着 `my_first_report.prpt`。*


  ## 摘要


  本章通过完整示例演示了如何创建 Pentaho 报表。你学习了在 HyperSQL 数据库上安装 Pentaho Report Designer 及 `SampleData`
  模式，用于练习 Pentaho Reporting 功能。建议将 Report Designer 安装到本地，后续练习都会用到。


  安装后，你熟悉了用户界面，并使用 Report Designer 的向导创建报表。完成创建后，你学会了预览及在设计和预览模式间切换，这是报表开发的最佳实践。为完成生命周期，你学会了将报表保存到文件系统以便后续使用和安全存储。最后，你学会了重新打开报表以使用或迭代改进。


  读完本章，你应能理解 Pentaho Report Designer 是什么以及如何使用向导创建报表。下一章将介绍 Pentaho Reporting SDK，使用
  Maven 和 Java 创建项目。

  '
