  ## 摘要\n\n在本章中，你已从开发角度完成了对 Pentaho Reporting 高级功能的探索。在实用且有用的示例的帮助下，你首先学习了如何使用 Java\
  \ *i18N* 支持在不同语言中开发 Pentaho 报表。然后你看到了如何使用 Java 以编程方式开发子报表，最后看到了如何使用 Java 开发交叉表。\n\
  \n现在你已经阅读了本章，你应该对 Pentaho Reporting Engine 以及以编程方式开发 Pentaho 报表周围的所有技术细节感到熟悉。这是对开发人员来说的一项高级任务，创建复杂的\
  \ Pentaho 报表并将其嵌入到使用 Java 的自定义项目中。\n\n作为开发人员，在下一章中你将看到如何基于事件构建交互式报表。事件绑定在 Pentaho\
  \ 报表中定义，使得能够从报表内部接收事件通知。\n\n## 构建交互式报表\n\n在本章中，你将学习如何在报表中启用交互功能。交互式报表并不常见，但允许在各种输出格式中实现有趣的行为。本章涵盖的每种交互方法都基于特定的布局引擎。你将通过创建展示其能力的示例来学习\
  \ HTML 交互选项。根据定义，交互式报表基于事件。事件绑定在报表定义中定义，使得能够从报表内部接收事件通知。\n\n本章技术性很强，并作为纯 Java 开发人员的教程编写。到本章结束时，你将学会如何修改报表定义以生成超链接事件和许多不同的\
  \ HTML 或 JavaScript 事件，以及如何在从报表触发事件时动态修改报表 HTML 文档对象模型。\n\n## HTML 中的交互式报表\n\n使用\
  \ Pentaho Reporting，可以在 HTML/JavaScript 环境中定义高度定制的交互式报表。Pentaho Reporting 定义了一组属性，当指定时，允许用户与报表之间实现丰富的交互。在本节中，你将对这些属性有一个概述，以及一个展示潜在用法的丰富示例。\n\
  \n在第 5 章 *报表设计器中的设计和布局* 中，你已经学习了有关 HTML 属性的所有内容，但在这里我们希望再次分享属性的细节以便更好地理解：\n\n| 名称\
  \ | 描述 |\n|------|-------------|\n| `class` | 此属性将当前 HTML 元素的 `class` 属性设置为指定值。\
  \ |\n| `name` | 此属性将当前 HTML 元素的 `name` 属性设置为指定值。 |\n| `title` | 此属性将当前 HTML 元素的\
  \ `title` 属性设置为指定值。 |\n| `xml-id` | 此属性允许为当前 HTML 元素命名，设置 `id` 属性，从而使其能够在外部脚本中引用。\
  \ |\n| `append-body` | 此属性允许在当前元素渲染之前，将原始 HTML 放置在 HTML 文档的 body 中。 |\n| `append-body-`\
  \ | 此属性允许在 HTML 的 body 中放置原始 HTML |\n\n\n\n\n| 属性 | 描述 |\n|---|---|\n| footer |\
  \ 文档，在当前元素渲染之后。 |\n| append-header | 仅在主报表级别定义，此属性允许在生成的 HTML 文档的头部包含原始 HTML。此位置传统上用于加载额外的\
  \ CSS 文件，以及外部 JavaScript 文件。 |\n| on-click | 此属性在当前定义的元素上渲染 `onclick` HTML 属性。它是在用户点击元素时在浏览器中执行的\
  \ JavaScript 字符串。 |\n| on-double-click | 此属性在当前定义的元素上渲染 `ondblclick` HTML 属性。它是在用户双击元素时在浏览器中执行的\
  \ JavaScript 字符串。 |\n| on-mouse-down | 此属性在当前定义的元素上渲染 `onmousedown` HTML 属性。它是在用户按下鼠标按钮时在浏览器中执行的\
  \ JavaScript 字符串。这可用于检测拖拽操作的开始。 |\n| on-mouse-up | 此属性在当前定义的元素上渲染 `onmouseup` HTML\
  \ 属性。它是在用户释放鼠标按钮时在浏览器中执行的 JavaScript 字符串。 |\n| on-mouse-move | 此属性在当前定义的元素上渲染 `onmousemove`\
  \ HTML 属性。它是在用户移动鼠标时在浏览器中执行的 JavaScript 字符串。 |\n| on-mouse-over | 此属性在当前定义的元素上渲染\
  \ `onmouseover` HTML 属性。它是在用户将鼠标移至元素上方时在浏览器中执行的 JavaScript 字符串。 |\n| on-key-down\
  \ | 此属性在当前定义的元素上渲染 `onkeydown` HTML 属性。它是在用户按下键时在浏览器中执行的 JavaScript 字符串。 |\n| on-key-pressed\
  \ | 此属性在当前定义的元素上渲染 `onkeypress` HTML 属性。它是在用户按下键时在浏览器中执行的 JavaScript 字符串。 |\n| on-key-up\
  \ | 此属性在当前定义的元素上渲染 `onkeyup` HTML 属性。它是在用户释放键时在浏览器中执行的 JavaScript 字符串。 |\n\n```\n\
  document.getElementById('example').innerHTML =\n(document.getElementById('example').innerHTML\
  \ == 'Hello') ?\n'Goodbye' : 'Hello';\n```\n\n## 包含外部 CSS 或 JavaScript 资源\n\n使用主报表对象的\
  \ `append-header` 属性，可以在报表中包含 CSS 或 JavaScript。如果您编写了大量希望与报表分开的 JavaScript，或者想要包含有用的\
  \ JavaScript 库，这很有用，如以下示例所示。\n\n`append-header` 值的示例可以是：\n\n```\n|<link type=\"\
  text/css\" rel=\"stylesheet\" href=\"custom.css\" />\n```\n\n在实现服务器时，重要的是确保引用的文件的相对路径可从当前文档访问。\n\
  \n## 使用 Java 的交互式报表示例\n\n得益于 Pentaho Reporting 的功能，交互式报表的开发非常直接。作为交互式报表工作原理的演示，您将在此处看到如何开发不同类型的交互。这里分享的示例不可能穷举，但会为您提供可在未来开发中使用的最相关功能的概述。\n\
  \n## 从 Pentaho 报表打开静态 URL\n\n我们要展示的第一个示例涉及一个非常基础的功能：通过点击报表元素打开自定义 URL。要亲眼看到一个可工作的示例，一个完整的项目可在\
  \ https://github.com/fcorti/pentaho-8-reporting-for-java-developers 仓库中找到，具体在 `interactive-report`\
  \ 项目中，位于 `Chapter 14 - Building interactive reports` 文件夹。\n\n查看该项目的源代码，有一件事我们在本书前几章中没有机会看到：如何使用\
  \ Java 预览 `.prpt` 格式的报表。在众所周知的 `PentahoServlet` 类中，您可以找到以下 Java 代码：\n\n// Getting\
  \ the report.\nResourceManager manager = new ResourceManager();\nmanager.registerDefaults();\n\
  Resource res = manager.createDirectly(\n    new URL(\"file:resources/interactive_report_1.prpt\"\
  ),\n    MasterReport.class);\nMasterReport report = (MasterReport) res.getResource();\n\
  \n前面这段 Java 代码从文件系统中存储的 `.prpt` 文件定义了 `MasterReport` 对象。`.prpt` 文件名为 `interactive_report_1.prpt`，您可以在项目的\
  \ `resources` 文件夹中找到它。本节描述的所有示例都基于此报表，因此请随意使用 Pentaho Report Designer 在上一章学到的方式打开并编辑它。\n\
  \n从这里开始，您可以决定使用以下 Java 代码以 PDF 格式预览内容：\n\n```\nresponse.setContentType(\"application/pdf\"\
  );\nPdfReportUtil.createPDF(report, response.getOutputStream());\n```\n\n或者，您也可以选择使用以下\
  \ Java 代码以 HTML 格式预览内容。正如您所期望的，为本示例的目的，您将看到 HTML 渲染。\n\n```\nresponse.setContentType(\"\
  text/html\");\nHtmlReportUtil.createStreamHTML(report, response.getOutputStream());\n\
  ```\n\n要运行项目，请打开终端，进入项目文件夹，并按此顺序执行以下命令：\n\n```\nmvn clean install\nmvn package\n\
  java -jar target/dependency/jetty-runner.jar target/*.war\n```\n\n在浏览器中打开 http://localhost:8080，您应该会看到如下截图中的\
  \ Pentaho 报表：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_622_0.png)\n\n在报表中，您可以找到一个易于理解的可用交互的图例作为参考，但在本节中，您将逐一看到它们，并附有开发说明。第一个介绍的是与\
  \ STATIC URL 按钮相关。使用 Pentaho Report Designer 打开 interactive_report_1.prpt 文件，您可以看到四个属性被自定义，如下图所示：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_623_0.png)\n\n第一个属性是 xml-id，用于设置元素的唯一标识符（在本例中为\
  \ button1），第二个是 on-click，包含打开 Google 页面作为静态 URL 的静态 JavaScript 源代码（window.open('http://www.pentaho.com',\
  \ '_blank');）。另外两个属性（on-mouse-over 和 on-mouse-out）包含用于为代表按钮的标签元素着色的 JavaScript 源代码。以下截图显示了点击标签元素时的用户体验：\n\
  \n## 交互式报表示例\n\n说明：\n点击 ... 按钮以启动操作。\n点击 QUANTITY 或 BUYPRICE 以查看隐藏\n点击 PRODUCT 字段以启动并动态\n\
