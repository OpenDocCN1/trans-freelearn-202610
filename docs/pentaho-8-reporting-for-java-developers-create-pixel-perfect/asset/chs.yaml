  \ Reporting，并使用 Apache Maven 作为软件项目管理工具。*\n\n## Pentaho Reporting SDK 的结构\n\n在继续前，先介绍\
  \ Pentaho Reporting SDK 的目录结构及简要说明。`PentahoReportingEngineSDK` 文件夹结构如下：\n\n```\n\
