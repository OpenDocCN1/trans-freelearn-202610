  \ Report Designer Wizard 开发的报表作为示例。\n\n本章技术性强，面向纯 Java 开发者。若你为开发经验不多的信息技术人员，可跳过阅读。最佳学习方式是边读边在本地操作。读完后你应能掌握将\
  \ Pentaho 报表嵌入现有 Java Web 应用的基础。后续章节假设你能用 Pentaho Reporting Engine 管理和设置 Java Web\
  \ 应用，请仔细阅读并确保理解所有概念。\n\n## 获取 Pentaho Reporting SDK\n\n第 2 章 *Getting Started with\
