  \n(866) 660-7555\n\n## 一款全面的数据集成和商业分析平台\n\n免费试用\n\n## 从 Pentaho 报表打开动态 URL\n\n另一个相关的示例是对您之前看到的静态\
  \ URL 的改进。在本节中，您将看到两种不同的交互，通过点击报表元素打开动态 URL。从之前的报表开始，您可以点击每个行的 QUANTITY 字段或 BUYPRICE\
  \ 字段。结果是一个模态窗口，其中包含产品的总成本，通过将 QUANTITY * BUYPRICE 相乘计算得出。在以下截图中，您可以看到用户体验是什么样的：\n\
