  ## 在 Web 应用中显示现有 Pentaho 报表\n在 Web 应用中\n\n现在 Java Web 应用已准备好管理 Pentaho 内容，在此最后任务中，你将最终学习如何修改\
  \ Java Web 应用以显示使用 Report Design Wizard 开发的 Pentaho 报表。特别是，目标是显示之前作为示例开发的 `my_first_report`。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_141_0.png)\n\n_在接下来的章节中，你会看到使用 Report\
  \ Design Wizard 未开发的 Pentaho 报表的管理方式大致相同。因此，本内容对你学习如何从 Java 应用管理现有 Pentaho 报表很有价值。_\n\
  \n像往常一样，我们将任务拆分为较小的子任务，因为这样描述、检查和控制起来会更容易。\n\n## 包含现有 Pentaho 报表\n\n非常 first task\
  \ 是将 `my_first_report` 包含在 Java Web 应用中。记住 `my_first_report.prpt` 文件包含了渲染 Pentaho\
  \ 报表所需的一切，请创建路径 `pentaho-reporting-web-app/src/main/resources/reports` 并将 `my_first_report.prpt`\
  \ 文件复制到其中。\n\n信不信由你，但这就是使报表对 Java Web 应用可用所需做的全部工作。\n\n## 包含 SampleData 模式\n\n如第\
  \ 2 章 *开始使用 Report Designer* 中所述，`my_first_report` 报表使用 `SampleData` 模式作为数据源。因此，你需要在\
  \ Java Web 应用中包含它。将 `SampleData` 模式包含在 Java Web 应用中可以通过两个简单的任务实现：使 `SampleData`\
  \ HyperSQL 数据库在项目中可用以及添加 HyperSQL 客户端作为依赖项。\n\n要使 `SampleData` HyperSQL 数据库在 Java\
  \ Web 应用中可用，请创建路径 `pentaho-reporting-web-app/resources` 并将 `sampledata` 文件夹从 `<report-designer>/resources`\
  \ 复制到其中。\n\n要将 HyperSQL 客户端添加为 Java Web 应用的依赖项，请根据以下描述更改位于 `pentaho-reporting-web-app`\
  \ 文件夹中的 `pom.xml` 文件：\n\n```\n<project ...>\n...\n  <repositories>\n  ...\n  </repositories>\n\
  \  <dependencies>\n  ...\n\n  <!-- Add This here. -->\n  <dependency>\n    <groupId>org.hsqldb</groupId>\n\
  \    <artifactId>hsqldb</artifactId>\n    <version>2.3.2</version>\n  </dependency>\n\
  \n  </dependencies>\n  <build>\n  ...\n  </build>\n</project>\n```\n\n这就是将 `SampleData`\
  \ 模式包含在你的 Java Web 应用中所需做的全部工作。\n\n```java\npackage com.example;\n\nimport java.io.IOException;\n\
  import java.net.URL;\n\nimport javax.servlet.ServletConfig;\nimport javax.servlet.ServletException;\n\
  import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
  import javax.servlet.http.HttpServletResponse;\n\nimport org.pentaho.reporting.engine.classic.core.ClassicEngineBoot;\n\
  import org.pentaho.reporting.engine.classic.core.MasterReport;\nimport org.pentaho.reporting.engine.classic.core.modules.output.pageable.pdf\n\
  import org.pentaho.reporting.libraries.resourceloader.Resource;\nimport org.pentaho.reporting.libraries.resourceloader.ResourceManager;\n\
  \npublic class PentahoServlet extends HttpServlet {\n\n    @Override\n    public\
  \ void init(\n        ServletConfig config)\n    throws ServletException {\n   \
