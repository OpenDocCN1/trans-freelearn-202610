  ## 丰富的创作工具


  虽然可以使用 XML 或 Java API 来构建 Pentaho 报表，但大多数报表都是以 Pentaho Report Designer 构建的模板开始的。Pentaho
  Report Designer 是一款 **所见即所得 (WYSIWYG)** 报表编辑器，它提供了 Pentaho Reporting Engine 提供的丰富功能。除从零开始构建报表外，作为
  Pentaho Report Designer 组成部分的 Report Design Wizard 会引导报表作者逐步构建报表，然后该报表会显示在 Report
  Designer 中，如以下屏幕截图所示，以便进一步自定义：


  ![](img/9337ac94537bf7e092e1ea6531dce8fd_76_0.png)


  ## 报表服务器


  作为 Pentaho 套件的一部分，由 Pentaho Reporting 创建的报表可以发布、执行和在 Pentaho 的 Analytics Platform
  上调度。Pentaho Analytics Platform 提供身份验证和授权，以及一个中央存储库来管理您的业务报表。Pentaho Analytics Platform
  还托管用于创建基于 Pentaho 元数据的报表的基于 Web 的即席报表用户界面。通过结合使用 Pentaho Report Designer 和 Pentaho
  Analytics Platform，无需编写任何代码即可让您的业务使用 Pentaho Reporting 快速运行。


  ## 用于构建报表的 Java API


  Pentaho Reporting 随带了一个文档完善的 Java API，可从头开始构建报表，因此开发人员在自定义现有报表模板或从头开始构建报表时可以坚持使用
  Java 编程语言。此 Java API 允许开发人员创建和修改报表的各个部分，包括各种页眉、页脚、组和明细频带，以及在报表的每个部分内创建和修改对象。


  ## 可扩展性


  Pentaho Reporting 从头开始使用纯 Java 设计，公开了许多扩展接口。从实现可嵌入报表中的基本公式和函数，到编写自定义数据源或输出格式，Pentaho
  Reporting 的源代码和 API 接口文档完善且易于使用。


  ## Pentaho 报表网站


  除这些功能外，Pentaho Reporting 仍在积极开发中。访问 http://community.pentaho.com/projects/reporting/
  以了解有关正在考虑开发的额外功能和功能的更多信息，或访问产品的早期发布版本。


  ## Pentaho Reporting 架构


  Pentaho Reporting Engine 主要是一个 Java 类库，分为其他 Java 项目，然后组合在一起以呈现报表。该库针对性能和较小的内存占用进行了优化，并且可以在内存中完全运行，而无需生成临时文件或需要额外的编译步骤。源代码根据
  GNU LGPL 版本 2.1 的条款在 GitHub 仓库 https://github.com/pentaho/pentaho-reporting 中提供。


  GitHub 仓库包括 Pentaho Report Designer，提供报表定义的图形编辑器，并用作独立的桌面报表工具。此外，在 Pentaho Reporting
  生态系统中还有其他相关的开源工具和项目，包括 Report Engine Demo、Report Design Wizard、Report Designer 和基于
  Web 的即席报表用户界面。


  以下是定义 Pentaho Reporting Engine 的 Java 项目的介绍，重点介绍库、Reporting Engine 核心和 Reporting
  Engine 扩展。


  ## Reporting Engine 的库


  Pentaho Reporting Engine 使用以下库来呈现报表：


  - **Flute:** 这是用 Java 编写的 CSS 2 解析器，实现了 SAC (https://www.w3.org/Style/CSS/SAC/)。SAC
  是 CSS 解析器的标准事件驱动 API，紧密模仿 XML 解析器的 SAX API。

  - **LibBase:** 这是所有其他 Pentaho Reporting 库的根库。该库包含通用功能，例如调试和错误日志实用程序、库配置以及库初始化 API，用于
  Reporting Engine 一致的启动和关闭管理。

  - **LibDocBundle:** 这抽象了 Pentaho Reporting 文件包的管理，默认情况下以 ZIP 文件存储，并实现了 ODF。这使得 Reporting
  Engine 的其他部分更易于处理和操作 Pentaho Reporting 的文件格式。

  - **LibFonts:** 这允许 Pentaho Reporting 使用 TrueType 系统字体，从字体类型中提取必要的元数据并填充抽象接口，以便在各种上下文中进行适当的渲染，包括
  PDF 和 Excel 视图。

  - **LibFormat:** 这是一个字符串格式化库，可以根据格式字符串适当呈现日期和数字。该库专注于内存和 CPU 效率，以实现高性能报表渲染。

  - **LibFormula:** 这是一个基于 OpenFormula 标准的公式解析和执行库。您可以通过访问 http://wiki.oasis-open.org/office/About_OpenFormula
  了解有关 OpenFormula 的更多信息。该库的功能类似于基于 Excel 的公式定义。LibFormula 是一个非常通用的库，并在 Pentaho Reporting
  之外的其他需要 OpenFormula 风格解析和执行的项目中使用。LibFormula-UI 是基于 LibFormula 的 OpenFormula 表达式公式编辑器。

  - **LibLoader:** 这以通用方式管理生成报表所需的所有必要资源加载和缓存，为 Reporting Engine 的其他部分提供简单 API，以控制静态和动态内容，包括数据源和图像。

  - **LibPensol:** 这是通过 Apache VFS 文件系统访问远程 Pentaho 解决方案存储库的访问层。它处理所有 HTTP 调用、XML
  文件的解析以及所有客户端状态管理。

  - **LibPixie:** 这是一个 WMF 文件读取库，最初由 David R. Harris 编写，作为 Pixie 图像查看器的转换器。Pixie 很久以前就已停止维护，现在已作为
  Java 1.2.2 或更高版本的 WMF 读取器和图像生成器复活。Pixie 缺少对大多数位图格式的支持，但其他一切功能正常。

  - **LibRepository:** 这抽象了 Pentaho Reporting 交互的层次化存储系统（如文件系统）的输入和输出。这使得可以实现自定义存储系统（如
  FTP）并将其映射到 API，从而使 Pentaho Reporting 可以访问该系统。

  - **LibSerializer:** 这为序列化不可序列化对象提供了辅助方法。这对于 Reporting Engine 能够序列化未实现 Java 可序列化接口的标准
  Java 类是必要的。

  - **LibSparkline:** 这是一个用于呈现迷你图谱的库。迷你图谱是插入文本中的小型条形图或线形图，用于在文本描述的同时提供可视化信息。

  - **LibSwing:** 这是设计时元素的通用辅助类存储，以便它们不必移入引擎项目，在那里它们可能由于第三方依赖或大量代码而使项目膨胀。

  - **LibXml:** 这提供了基于 Java 的 **Java API for XML Parsing (JAXP)** API 的 **Simple API
  for XML (SAX)** 解析和 XML 编写实用程序类。该库确保 Pentaho Reporting XML 模板文件快速加载和验证。


  ## Reporting Engine 核心


  Reporting Engine 核心项目包含呈现报表的核心报表算法，以及支持样式所需的功能。该项目还包含用于呈现特定输出的算法，包括 PDF、Excel、CSV、XML
  等。引擎依赖于前面提到的库来管理生成报表的加载、解析、格式化、渲染和归档。




  ## Reporting Engine 扩展


  Reporting Engine 扩展项目包含对 Reporting Engine 的第三方扩展，虽然非常有用，但会增加依赖。本项目中的扩展包括使用 Rhino
  项目的 JavaScript 表达式支持、Hibernate 数据源工厂、使用 Barbecue 的条形码支持、使用 LibSparkline 的迷你图支持，以及配置和打印的额外
  JDK 1.4 支持。还存在其他扩展项目，其中包括图表和本书中讨论的许多数据源。


  ![](img/9337ac94537bf7e092e1ea6531dce8fd_85_0.png)


