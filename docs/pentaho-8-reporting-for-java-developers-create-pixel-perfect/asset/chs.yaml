  \ 的文本字段）生成的 JavaScript 代码的动态部分： = CONCATENATE(\n\"window.open('','http://www.google.com/search?q=\"\
  ;\n[PRODUCTNAME];\n\"','_blank');\")\n\n## 操作 Pentaho 报表的內容\n\n为了展示元素操作的示例，在本节中您将看到如何更改标题（一个普通的\
  \ `label` 元素）的内容，使其显示当前时间的动态内容。再次从同一报表开始，点击 CHANGE TITLE 按钮，您将看到类似以下屏幕截图的结果：\n\n\
  ![](img/9337ac94537bf7e092e1ea6531dce8fd_627_0.png)\n\n如您所见，报表的标题相应地发生了变化。\n\n该示例的开发遵循相同的原则，但应用略有不同：`title`\
  \ 元素的 `xml-id` 属性已定义，而 `button` 元素的 `on-click` 属性包含以下作为静态文本的 JavaScript：\n\n```\n\
  var currentdate = new Date();\ndocument.getElementById('title').innerHTML = 'Title\
  \ changed at ' +\n  currentdate.getHours() + ':' + currentdate.getMinutes() + ':'\
  \ +\n  currentdate.getSeconds();\n```\n\n## 主/明细报表交互示例\n\n最后，让我们看看如何开发报表之间最常见的交互之一：从一个报表导航到另一个报表，其中目标报表的内容取决于一个参数。要开发此示例，您需要第二个报表，在本例中命名为\
  \ `interactive_report_2.prpt`。第二个报表显示一行中包含的所有产品。正如您所预期的那样，行值是必填参数。\n\n为了开发此交互，Java\
  \ 项目包含另一个名为 `/reporting2` 的端点，连接到第二个报表。实现定义在 `PentahoServlet2` 类中，包含以下 Java 代码：\n\
  \n```\n// Getting the report.\nResourceManager manager = new ResourceManager();\n\
  manager.registerDefaults();\nResource res = manager.createDirectly(\nnew URL(\"\
  file:resources/interactive_report_2.prpt\"),\nMasterReport.class);\nMasterReport\
  \ report = (MasterReport) res.getResource();\n\n// Mandatory parameter.\nreport.getParameterValues().put(\"\
  LINE\", request.getParameter(\"line\"));\n\n// Conversion to HTML and rendering.\n\
  response.setContentType(\"text/html\");\nHtmlReportUtil.createStreamHTML(report,\
  \ response.getOutputStream());\n```\n\n现在第二个报表已准备好被调用，让我们看看如何在第一个报表 `interactive_report_1.prpt`\
  \ 中开发此交互。源报表中所需开发始终相同：对目标 URL 的动态调用，定义报表元素的 `on-click` 属性。在本例中，`on-click` 属性定义如下：\n\
  \n```\n=CONCATENATE(\n\"window.open('','\";\n\"/reporting2?line=\";\n[PRODUCTLINE];\n\
  \"','_self');\"\n```\n\n在下面的屏幕截图中，用户体验展示了第一个报表（interactive_report_1.prpt）和第二个报表（interactive_report_2.prpt）之间的交互，当点击\
  \ LINE 字段的经典汽车行时：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_630_0.png)\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_630_1.png)\n\
  \n如果您计划在复杂用例中开发交互式报表，请始终记住考虑与仪表板框架或 OLAP 客户端更相关的其他解决方案。建议始终记住，报表解决方案很棒，但其主要目标是在静态或参数化内容中显示详细或汇总数据。如果您强迫使用报表解决方案来开发仪表板或真正动态和交互的内容，失败的风险很高。请注意！\n\
  \n## 摘要\n\n本章中，您学习了开发交互式报表的基础知识，并看到了一些可在未来开发中使用的实用示例。在发现技术解决方案后，已向您提出适度使用交互式功能的建议。\n\
  \n现在您已阅读本章，您应该能够使用超链接事件和许多不同的 HTML 或 JavaScript 事件生成交互式报表。本章结束了本书中关于 Java 开发和 API\
  \ 的部分。在下一部分，您将看到如何在 Pentaho Suite 的其他组件中使用 Pentaho 报表。\n\n## 在 Pentaho Business\
  \ Analytics Platform 中使用报表\n\n本章是关于在 Pentaho Suite 的其他组件中使用 Pentaho 报表的短系列的第一章。特别是在本章中，您将学习如何在\
  \ Pentaho Business Analytics Platform 中使用现有的 Pentaho 报表。Pentaho Business Analytics\
  \ Platform 是一个用于最终用户和开发人员的 Web 应用程序，使他们都能够使用其分析工具，例如仪表板、透视会话，当然还有报表。\n\n在本章中，您将介绍\
  \ Pentaho Business Analytics Platform 的基础知识，以及如何安装它并上传 Pentaho 报表的描述。之后，您将学习如何管理权限并使用\
  \ Pentaho CTools 直接调用或包含在 Pentaho 仪表板中预览报表。\n\n本章作为开发人员和信息技术人员的教程编写。最好的学习方式是在阅读时在笔记本电脑上按照说明进行。到本章结束时，您将熟悉\
  \ Pentaho Business Analytics Platform 与 Pentaho 报表联合使用基础知识。这对于您未来的项目将非常有用，使您能够为最终客户和管理人员提供功能齐全的前端。\n\
  \n## 介绍 Pentaho Business Analytics Platform\n\n作为 Pentaho 产品套件的一部分，Pentaho 提供了一个开源的\
  \ Business Analytics Platform。Business Analytics Platform 是一个 Web 应用程序，允许用户在企业商业智能系统中发布和管理报表。Business\
  \ Analytics Platform 提供了许多功能，包括 Pentaho 报表的管理和执行。通过结合 Pentaho Reporting 和 Pentaho\
  \ 的 Business Analytics Platform，信息技术人员可以在其环境中使用 Pentaho Reporting，而无需编写任何代码。除了报表的发布和执行之外，开源的\
  \ Business Analytics Platform 还允许调度、后台执行、安全性和更多功能。\n\n使用 Pentaho 的企业版 Business Analytics\
  \ Platform，可获得额外的功能，但在本书中，我们更喜欢使用社区版，因为它可下载且对所有人免费，无需任何费用。\n\n## 安装 Business Analytics\
  \ Platform\n\nPentaho Business Analytics Platform 的安装很简单，遵循 *unzip and run* 任务。运行\
  \ Pentaho Business Analytics Platform 的先决条件很简单；它需要一个已安装在您环境中的 JRE 8。Windows 操作系统和\
  \ Linux 操作系统均受支持。本章中显示的屏幕截图和预览均使用 Ubuntu 16.04.2 LTS 发行版完成。\n\n在安装应用程序之前，您可以直接从官方\
  \ Pentaho 社区网站 (http://community.pentaho.com/) 或 Pentaho SourceForge 网站 (https://sourceforge.net/projects/pentaho/)\
  \ 下载以 ZIP 文件分发的工件。在这两种情况下，您都应下载一个名为类似 `pentaho-server-ce-<version>.zip` 的 ZIP 文件。\n\
  \n一旦 ZIP 文件下载到您的环境中，将其解压到最终路径（在 Linux 操作系统上，建议使用 `/opt` 路径），您将在文件夹 `pentaho-server`\
  \ 中拥有所有 Pentaho Business Analytics Platform 数据。\n\n虽然您可能不敢相信，但这就是将 Pentaho Business\
  \ Analytics Platform 安装到您的环境中所需的一切。\n\nPentaho Business Analytics Platform 主要是部署在\
  \ Apache Tomcat Servlet Container (https://tomcat.apache.org/) 中的 Web 应用程序。您可以通过打开终端并执行存储在\
  \ `pentaho-server` 文件夹中的 `start-pentaho` 脚本轻松运行 Pentaho Business Analytics Platform（Linux\
  \ 操作系统的 `.sh` 扩展名文件，Windows 操作系统的 `.bat` 扩展名文件）。\n\n要检查 Web 应用程序的运行情况，您可以查看日志文件\
  \ `<pentaho-server>/tomcat/logs/catalina.out`。一旦应用程序启动，您可以使用受支持的 Web 浏览器通过链接 `http://<server>:8080/pentaho`\
  \ 访问用户界面。使用 Pentaho Business Analytics Platform\n\n社区版，建议使用 Mozilla Firefox 或 Google\
  \ Chrome，而不是 Microsoft Internet Explorer。\n\n要以管理员身份访问，您可以使用用户名 `admin`，密码为 `password`。访问后，您的浏览器应如下图所示：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_635_0.png)\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_635_1.png)\n\
  \n默认情况下，Pentaho Business Analytics Platform 发行版附带一个 HyperSQL 数据库（http://hsqldb.org/）实例，用于存储配置、数据以及正确运行所需的一切。就其特性而言，HyperSQL\
  \ 数据库不建议用于生产环境，但目前它完全符合我们的目的。如果感兴趣，Pentaho Business Analytics Platform 也可以使用最常见的\
  \ RDBMS 和应用服务器运行。有关更多详细信息，请参阅官方文档。\n\n## Business Analytics Platform 的基础\n\n默认情况下，通过访问\
  \ Pentaho Business Analytics Platform 安装的主页，您可以访问 Pentaho 用户控制台。Pentaho 用户控制台是您访问\
  \ Pentaho 工具和功能的门户。Home 包含便捷访问按钮，以便您可以浏览文件、创建新的报表和仪表板、查看 Pentaho 文档，并快速打开最近查看或收藏的文件。\n\
  \n在本 书中，您将看不到 Business Analytics Platform 的所有可用功能。然而，我们希望您注意的是 Browse Files 按钮，您可以在其中打开一个窗口，使用浏览和文件窗格定位文件，并使用操作窗格管理它们。在下面的屏幕截图中，您可以看到\
  \ Browse Files 面板的样子：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_636_0.png)\n\n\
  Browse Files 页面可让您访问基于嵌入式 Apache Jackrabbit ([http://jackrabbit.apache.org/](http://jackrabbit.apache.org/))\
  \ 实例的 Pentaho 仓库，这是一个面向 Java 平台的开源内容仓库。Pentaho 仓库对我们的目的非常重要，因为它使用户能够以类似文件系统的用户体验（当然，它不是真正的文件系统）将所有报表、仪表板和一般资源存储在树形结构中。使用\
  \ Apache Jackrabbit 的主要优势是所有内容都可以通过 RESTful API 访问和管理，非常易于使用和集成。Pentaho 仓库是一个核心功能，在以下各节中被广泛使用。\n\
  \n## 在 Business Analytics Platform 中发布报表\n\n要在 Business Analytics Platform 中使用 Pentaho\
  \ 报表，第一步是将报表上传到 Pentaho 仓库。这是在执行每项操作（如预览、调度等）之前的前置任务。上传后，Pentaho 报表会自动发布，并可根据 Pentaho\
  \ Business Analytics Platform 的权限和角色使用。\n\nPentaho 报表可以通过三种主要方式上传到 Pentaho 仓库：手动上传、使用\
  \ Pentaho Report Designer 发布以及批量导入。在下面的各节中，您将了解前两种方式，因为批量导入是建议在需要管理 Pentaho 仓库的整体或部分恢复时使用的方法。\n\
  \n### 手动上传报表\n\n您可以通过 Pentaho 用户控制台的 Browse Files 页面直接手动上传 Pentaho 报表。上传 Pentaho\
  \ 报表要做的第一件事是在左侧面板中选择一个文件夹。正如您所期望的，该文件夹将像常规文件系统一样包含报表（并且作为文件系统，您不能同时将报表存储在两个不同的文件夹中）。在右侧的操作面板上，您可以看到\
  \ Upload... 链接。点击该链接后，会出现上传模态窗口，您可以在其中从本地文件系统选择 .prpt 文件并指定一些高级设置。完成后，选择 OK 按钮，报表将直接上传到\
  \ Pentaho 仓库。\n\n在下面的图像中，您可以看到报表上传到 Pentaho 仓库后 Browse Files 页面的样子：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_639_0.png)\n\
  \n### 使用 Pentaho Report Designer 发布报表\n\n从 Pentaho Report Designer，您可以使用标准界面直接访问\
  \ Pentaho 仓库。如果查看顶部菜单中的 File 项目，您可以看到 Publish...。点击它后，一个模态窗口会要求您提供连接到现有 Pentaho\
  \ 仓库的基本信息。连接后，另一个模态窗口会显示您可以深入浏览的文件夹结构，以找到报表的最终位置。确认后，.prpt 文件将被上传到其最终目的地。\n\n在下面的屏幕截图中，您可以看到这三个步骤：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_640_0.png)\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_640_1.png)\n\
  \n如果查看 Pentaho Report Designer 用户界面，您可以在顶部菜单的 File 中看到 Open from Repository... 项目。此功能允许您直接从现有\
  \ Pentaho 仓库打开报表。用户体验与前面描述的相同，使用此功能以及 Publish...，您可以使用集中的 Pentaho 仓库而不是本地文件系统进行开发。\n\
  \n## 管理数据源\n\n将 Pentaho 报表发布到 Business Analytics Platform 并不足以让最终用户使用它。正如您在第 6 章\
  \ *Configuring JDBC and Other Data Sources* 中看到的，Pentaho 报表可以使用几种类型的数据源。其中一些在报表中直接定义数据源，而另一些仅定义指向外部定义的符号链接。如果您使用\
  \ JDBC 或 JNDI 连接到 DBMS（仅举一个常见示例），您还需要在 Pentaho Business Analytics Platform 中定义数据源。如果没有完全相同的定义，您的报表将无法使用，并在首次调用时引发异常。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_642_0.png)\n\n> *请务必始终仔细检查 Business Analytics\
  \ Platform 上数据源的定义是否与报表设计中使用的定义完全相同，包括名称（区分大小写）、类型、设置和参数。如果遗漏或拼写错误，报表将无法工作，即使报表完全相同且应该可以工作，您也会浪费大量时间。*\n\
  \n要在 Pentaho Business Analytics Platform 中管理数据源，顶部菜单中提供了一个友好的功能，包含在 File 项目中（您可以在下面的屏幕截图中看到预览）。该功能名为\
  \ Manage Data Sources。点击它后，会显示一个简单的窗口，您可以创建、修改和删除 JDBC 数据源和多维数据源（称为 analysis）。JNDI\
  \ 数据源在某些配置文件中管理，这些文件在官方文档 https://help.pentaho.com/Documentation 中有详细记录。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_643_0.png)\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_643_1.png)\n\n您是否注意到 `SampleData (Local)`\
  \ 数据源在 Business Analytics Platform 的默认安装中不可用？这就是为什么如果执行 `my_first_report` 会失败的原因。作为练习，使用\
  \ Pentaho Report Designer 直接从 Pentaho 仓库打开报表，并将数据源更改为 `SampleData`。然后再次发布报表，将其替换到\
  \ Pentaho 仓库中。作为替代方案，您可以将其从 Pentaho 仓库中删除，并替换为您可以在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中找到的报表，具体位于 `Chapter 15 - Using reports in Pentaho Business Analytics Platform/my_reports`\
  \ 文件夹中。\n\n## 预览报表\n\n现在 Pentaho 报表已正确发布到 Business Analytics Platform，您可能期望开始使用它。我们能想到的最简单的用法就是预览。Pentaho\
  \ 报表的预览可以通过两种不同的方式完成：手动使用浏览文件页面或通过直接链接。\n\n\n\n## 从浏览文件页面预览报表\n\n从浏览文件页面预览报表与点击\
  \ .prpt 文件并选择“Open”项或“Open in a new window”项一样简单。两者之间的区别很容易理解，但最终结果完全相同，即使目标窗口会不同。\n\
  \nhttp://localhost:8080/pentaho/api/repos/%3Apublic%3Amy_first_repo\n\nURL 接受参数以过滤报表，且访问需要身份验证才能显示结果。如需进一步了解，请随时阅读官方文档\
  \ [官方文档](https://help.pentaho.com/Documentation)。\n\n## 捆绑的报表预览\n\n一旦访问 Pentaho\
  \ 报表，即可使用报表设置中定义的默认输出格式进行预览。根据输出格式，浏览器要么直接渲染预览（主要针对 PDF 和 HTML），要么将其本地下载（针对 Excel、CSV、RTF\
  \ 和纯文本）。\n\n如果使用查看器（使用 `/viewer` 后缀），窗口顶部会显示一个工具栏。使用工具栏，您可以浏览页面、显示/隐藏参数、限制行数并刷新报表。工具栏下方，您可以找到报表的所有参数（如果已定义）、输出类型选择器以及用于刷新预览的\
  \ Update 按钮。\n\n提到输出类型，默认情况下，您可以选择 HTML（分页、非分页和电子邮件）、PDF、Microsoft Excel（常规版和 2007\
  \ 版）、CSV、RTF 和纯文本格式。通过在下拉菜单中更改选择，您会看到报表以所请求的格式自动更新。在以下截图中，您可以看到 PDF 输出格式的预览效果：\n\
  \n## 我的第一个报表\n\n2017 年 7 月 26 日 @ 09:18\n\n### 产品供应商 Autoart Studio Design\n\n|\
  \ 产品代码 | 产品名称 | 库存数量 | 购买价格 |\n|---|---|---|---|\n| S12_1099 | 1968 Ford Mustang\
  \ | 68 | 95 |\n\n### 产品供应商 Carousel DieCast Legends\n\n| 产品代码 | 产品名称 | 库存数量 | 购买价格\
