  Barbecue: http://barbecue.sourceforge.net


  ## 摘要


  在本章中，我们介绍了 Pentaho Reporting 并强调了一些典型用途，为您实现自己的解决方案提供了基础思路。嵌入式报告的典型用途包括运营、商业智能、财务和生产报告。


  我们简要描述了 Pentaho Reporting 的独特历史，从其 JFreeReport 起源开始，并深入了解了 8.0 版本中包含的丰富功能。核心功能包括多种数据源集成，以及
  PDF、HTML 和 Excel 渲染。另一方面，更高级的功能包括子报表和交叉表报表。此外，面向开发者的功能，例如开放的 Java API，以及可用的源代码和商业友好的
  LGPL 开源许可证，使 Pentaho Reporting 在所有其他 Java 报表工具包中脱颖而出。


