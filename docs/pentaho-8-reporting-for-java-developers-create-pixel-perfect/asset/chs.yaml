  \    42    129\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_502_0.png)\n\n在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中，更准确地说，在 chapter 10 - Sub-reports and cross tabs/my_reports 路径下，您可以找到 subreport.prpt\
  \ 报表，该报表完全按照此处描述的示例开发。随意使用 Report Designer 打开它并尝试设置和参数。\n\n## 其他子报表示例\n\n在离开子报表示例之前，让我们列出一些子报表可以大有帮助的用例；这里的意图是分享一个实用的参考，而非详尽的最终列表：\n\
  \n- **报表中的详细信息**：子报表最简单且容易的示例是报表中用于展示实体某些详细信息的空间部分。例如，您可以考虑信件的发件人或发票中的公司详细信息。\n\
  - **多页子报表**：与前面描述的示例非常相似，您可以考虑一个包含可能跨越多页的大型子报表的报表。例如，您可以考虑产品目录或库存清单。在这种情况下，子报表将在\
  \ `Report Header` 频段中定义，而不是 `Details` 频段中，但其他一切都将与您在此处看到的方式完全相同。区别在于子报表中的数据源可以检索可能跨越多页的长列表数据。\n\
  - **图表子报表**：您可以在子报表中使用的元素没有任何限制。例如，您可以使用图表，获得引人注目的结果。\n- **并排子报表**：子报表的另一个功能是可以将两个或多个子报表水平放置在报表频段内，彼此相邻。使用此功能，您可以使用专用数据源专门化子报表，从不同的表或源（不一定只有一个源）中提取数据。\n\
  - **多个子报表**：您可以使用子报表的数量没有限制。结合本节中分享的示例，您可以使用模块化方法创建非常复杂的报表。如果您需要在长时间后进行更改开发或在不同开发人员的团队中工作，可以建议这种方法。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_503_0.png)\n\n> _正如您在此处所学，子报表非常强大，但有一个缺点您应该注意：子报表在资源消耗方面可能非常昂贵。请勿滥用它们。_\n\
  \n\n\n\n## 目录和索引元素\n\n尚未解释的两种特殊子报表类型：目录和索引。**目录（TOC）** 功能允许您基于报表内部映射的组生成 TOC，或指定要包含在\
  \ TOC 中的子报表。索引功能允许您基于报表中的字段（或组）生成索引。索引生成后，会显示字段名称出现的实例和页码。\n\n## 索引示例\n\n例如，让我们看看如何将索引添加到现有报表中，当然假设报表很大，由很多页定义（否则，索引意义不大）。用于添加索引的报表是一个基本报表，基于\
  \ JDBC 数据源构建，查询如下：\n\n```\nSELECT\n\"PUBLIC\".\"ORDERFACT\".\"ORDERDATE\",\n\"PUBLIC\"\
  .\"ORDERFACT\".\"ORDERNUMBER\",\n\"PUBLIC\".\"CUSTOMERS\".\"CUSTOMERNAME\",\n\"\
  PUBLIC\".\"ORDERFACT\".\"TOTALPRICE\"\nFROM\n\"PUBLIC\".\"CUSTOMERS\" INNER JOIN\
  \ \"PUBLIC\".\"ORDERFACT\" ON \"PUBLIC\".\"CUSTOMERS\".\"CUSTOMER\nORDER BY\n\"\
  PUBLIC\".\"ORDERFACT\".\"ORDERDATE\" ASC\n```\n\n关于布局，基本报表定义的详细信息频段如下所示截图中所示：\n\n\
  ![](img/9337ac94537bf7e092e1ea6531dce8fd_506_0.png)\n\n通过在报表画布中使用眼睛图标（\U0001F441\
  ）预览报表，您可以看到它由 97 页定义。本示例的目标是在报表末尾添加一个索引，引用所有客户。\n\n要添加索引，请从报表调色板中拖动索引图标（\U0001F4C4\
  ）并将其放置到报表页脚频段中。放置后，会出现与子报表相同的[content]\n## 目录和索引元素\n\n尚未解释的两种特殊子报表类型：目录和索引。**目录（TOC）**\
  \ 功能允许您基于报表内部映射的组生成 TOC，或指定要包含在 TOC 中的子报表。索引功能允许您基于报表中的字段（或组）生成索引。索引生成后，会显示字段名称出现的实例和页码。\n\
  \n## 索引示例\n\n例如，让我们看看如何将索引添加到现有报表中，当然假设报表很大，由很多页定义（否则，索引意义不大）。用于添加索引的报表是一个基本报表，基于\
  \ JDBC 数据源构建，查询如下：\n\n```\nSELECT\n\"PUBLIC\".\"ORDERFACT\".\"ORDERDATE\",\n\"PUBLIC\"\
  .\"ORDERFACT\".\"ORDERNUMBER\",\n\"PUBLIC\".\"CUSTOMERS\".\"CUSTOMERNAME\",\n\"\
  PUBLIC\".\"ORDERFACT\".\"TOTALPRICE\"\nFROM\n\"PUBLIC\".\"CUSTOMERS\" INNER JOIN\
  \ \"PUBLIC\".\"ORDERFACT\" ON \"PUBLIC\".\"CUSTOMERS\".\"CUSTOMER\nORDER BY\n\"\
  PUBLIC\".\"ORDERFACT\".\"ORDERDATE\" ASC\n```\n\n关于布局，基本报表定义的详细信息频段如下所示截图中所示：\n\n\
  ![](img/9337ac94537bf7e092e1ea6531dce8fd_506_0.png)\n\n通过在报表画布中使用眼睛图标（\U0001F441\
  ）预览报表，您可以看到它由 97 页定义。本示例的目标是在报表末尾添加一个索引，引用所有客户。\n\n要添加索引，请从报表调色板中拖动索引图标（\U0001F4C4\
  ）并将其放置到报表页脚频段中。放置后，会出现与子报表相同的提问：您是要定义内联子报表还是带状子报表？对于索引和 TOC，建议使用带状子报表，因为它将使用报表页面的\
  \ 100% 宽度。\n\n选择后，指向元素属性面板并将索引中的 data-field 属性设置为 CUSTOMERNAME。这指示 Report Designer\
  \ 在客户名称上构建索引。当您双击索引元素时，另一个选项卡将打开，其中包含索引子报表。在这里，就像您对子报表所见的那样，您拥有一个功能齐全的布局，唯一特定不同之处在于数据源。\n\
  \n查看报表资源管理器中的 Data 选项卡，默认数据源称为 `design-time-data`，并且定义为 `Table` 类型。此特定数据源会自动为索引元素（以及\
  \ TOC 元素，字段略有不同）定义，以便在索引定义中使用。以下截图显示了数据源的外观：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_507_0.png)\n\
  \n使用 `item-data` 和 `item-pages` 字段生成索引数据字段名称和页码。\n\n要构建自己的索引，请拖动字段并将它们放置到报表频段中，就像您在前几章中学到的那样。在我们的例子中，我们还想使用\
  \ `label` 元素添加一个标题；索引布局定义如下所示截图中所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_507_1.png)\n\
  \n现在主报表和索引已定义，让我们通过按报表画布中的眼睛图标（\U0001F441）预览它。以下截图中，您可以看到页码 97 的最终结果，即索引开始的位置。正如您所见，客户\
