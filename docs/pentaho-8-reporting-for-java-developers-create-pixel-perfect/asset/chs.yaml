  - 属性中的 `common` 属性具有 `sub-report-active` 布尔属性。该属性包含用于 *switch-on* 或 *switch-off*\
  \ 包含该元素的子报表 的标志。\n- `Attributes` 选项卡集中的 `Table-of-contents` 在此处仅针对 `Table-of-content`\
  \ 引入，具有以下属性：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `group-fields` | String | 同时定义数据收集的深度以及从中读取\
  \ `group-value-x` 值 的字段。如果数组中给出的 `group-field` 为空，则字段值将从当前关系组中读取，并且在 `details-processing`\
  \ 中，值将为 null。如果 `group-fields` 列表为空，则激活自动模式，收集所有组，从关系组中提取 `group-value`。 |\n| `title-field`\
  \ | String | 定义主报表中将用于读取有效项目标题的字段。 |\n| `title-formula` | String | 定义在收集到新项目时求值的公式。仅当未设置\
  \ `title-field` 时才会求值该公式。 |\n| `collect-details` | Boolean | 定义是否应在数据收集中包含明细项。 |\n\
  | `index-separator` | String | 定义索引元素之间使用的分隔符文本。默认为点字符 (.)。 |\n\n- `Attributes`\
  \ 选项卡集中的 `Index` 在此处仅针对 `Index` 引入，具有以下属性：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n\
  | `data-field` | String | 定义用作 `item-data` 或 `item-key` 的字段。 |\n| `data-formula`\
  \ | String | 定义用作 `item-data` 或 `item-key` 的开放公式。 |\n| `condensed-style` | Boolean\
  \ | 定义是否在连续页码之间使用 -；例如，1,2,3,4 将显示为 1-4。 |\n| `index-separator` | String | 定义索引子报表中\
  \ item-pages 字段中页码之间使用的分隔符文本。默认为点字符 (.)。 |\n\n- `HTML` 属性集不提供 `append-header` 属性。\n\
  - `Excel` 属性集仅提供 `formula` 属性。\n\n## 隐藏和显示频带\n\n在前面的章节中，您通过报表资源管理器及其层次结构定义了解了报表的结构，从称为\
  \ Master Report 的根到由频带来表示的第一级，以及定义报表可见内容的子元素。本节描述了隐藏（或显示）某些元素以自定义最终报表布局的可能性。\n\n\
  例如，您可以关注报表资源管理器中显示的结构以及报表画布中可见的频带（和内容）。如本章前面所述，默认情况下，报表画布显示 Page Header、Report Header、Details、Report\
  \ Footer 和 Page Footer 频带。但查看报表的结构，您还可以找到包含嵌套的 Group Header、Details Header、Details\
  \ Footer 和 Group Footer 频带的 Group 元素。正如您所能想象的那样，最后这组频带默认是隐藏的。\n\n要显示隐藏的元素（通常是频带）或隐藏可见的元素，请右键单击报表元素中的实体并取消选中（或选中）Hide\
  \ Element 项，如下图所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_271_0.png)\n\n操作\
  \ Hide Element 项后，对应的频带将在报表画布中相应地显示（或隐藏）。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_271_1.png)\n\
  \n*这种隐藏/显示频带的行为对于自定义最终报表布局很有用，也有助于管理结果的分组。将报表的分组结果以某种主从布局形式呈现是一个强大的功能，您在第 2 章 Gett\
  \ 中看到了一个示例*\n\n分组始于报表设计器。使用报表资源管理器中的组元素属性来控制和自定义此功能，以便在未来的高级开发中使用。\n\n## 报表设计器中的视觉布局\n\
  \n使用 Pentaho 报表设计器，您可以对报表中各个元素进行像素级控制。网格和引导线可能出现在每个报表画布频带中，这使得对齐和配置元素位置变得简单。\n\n\
  ### 网格\n\n默认情况下，报表网格已启用。要隐藏网格，请禁用菜单项 视图 | 网格 | 显示。网格以点单位（也称为像素单位）呈现，每 25 像素显示一条浅灰色网格线。网格线对于对齐的视觉反馈很有用，同时也为将元素吸附到网格上提供了一种方法。这使得元素的对齐变得简单。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_274_0.png)\n\n要将标尺单位调整为厘米、毫米、英寸或派卡，请进入\
  \ 视图 | 单位 子菜单。默认网格大小可以通过启动网格大小对话框进行调整。选择菜单项 视图 | 网格 | 设置 并调整您的网格大小。您可以通过选择菜单项 视图\
  \ | 网格 | 显示 或按 Ctrl+Quote 来显示或隐藏网格。\n\n### 引导线\n\n**引导线** 允许您指定自定义网格线。要添加新的水平或垂直引导线，请在报表画布的标尺区域内单击。应出现一条新的蓝色引导线。引导线对于布局的视觉反馈很有用，同时吸附到网格功能可简化元素放置。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_275_0.png)\n\n引导线可以通过在标尺内拖动其位置来移动。也可以通过在标尺内右键单击该线并选择\
  \ 属性...，然后输入引导线的新值来移动。\n\n可以通过右键单击并选择 `Deactivate` 来停用单个引导线。这会导致引导线从报表画布内容中移除，并在画布的标尺区域内显示为灰色标记。此外，还可以通过右键单击并选择\
  \ 删除 来完全从报表中移除引导线。\n\n可以通过选择 视图 | 网格 | 显示引导线 或点击 *Ctrl + S* 同时激活和停用所有引导线。如果您使用了许多引导线并且希望快速查看报表而不让所有蓝色线穿过，这很有用。\n\
  \n### 其他视觉指示器\n\n除了网格线和网格引导线之外，还有一些方便的快捷方式可帮助您更轻松地布局报表。默认情况下，选择报表元素时，选择样式被视为 **轮廓选择**。另一种选择样式是\
  \ **夹具选择**。您可以通过选择 视图 | 轮廓选择 或 视图 | 夹具选择 在这两种选择类型之间切换。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_276_0.png)\n\
  \n此外，还可以通过选择 视图 | 引导线 | 显示元素框架 或按 *Ctrl + H* 来显示和隐藏所有元素框架。这又是另一个工具，可轻松可视化元素彼此相邻的布局方式，并查看可能在渲染报表时导致问题的潜在重叠。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_276_1.png)\n\n报表设计器中的另一个视觉指示器是 视图 | 显示重叠元素\
  \ 菜单选项。选择此选项时，任何重叠的元素都会被突出显示，警告在渲染报表时可能存在问题。\n\n最后，报表设计器中的另一个有用功能是能够放大和缩小网格。默认情况下，报表设计器以\
  \ 100% 显示渲染的网格。在 视图 | 缩放 菜单中，您可以将报表查看为其实际大小的 50%、100%、200% 或 400%。\n\n作为另一个有用的功能，视图\
  \ | 元素对齐提示 菜单可以帮助您放置元素，并在每个元素上显示一些对齐条。这可以帮助您进行对齐，即使更简单的 格式 | 对齐 菜单可能更快。\n\n为了完成视图菜单中可用的项目，吸附到元素\
  \ 选项让您可以轻松地将元素彼此靠近放置，而无需过多关注垂直或水平距离上几像素的差异。\n\n### 移动和对齐单个元素\n\n除了在报表画布周围拖放元素外，还可以使用快捷键和菜单项更轻松地对齐和移动报表元素。\n\
  \n要移动元素，首先选择该元素，然后将其拖放到频带内的新位置。您也可以使用箭头键按单个像素移动所选元素。\n\n为了控制元素相对于可能重叠的其他元素的可见性，选择该元素，然后选择\
  \ `Format | Arrange | Send Forward` 或 `Format | Arrange | Send Backward` 选项以调整元素在频带内出现的顺序。`Bring\
  \ to Front` 和 `Send to Back` 分别将元素移动到最前面可见或最后面可见。这也称为 **Z 排序**。\n\n### 对齐元素组\n\n\
  为了真正完善报表，有两个易于使用的快捷方式可用于对齐元素组。首先，通过按住 Shift 键并在元素周围拖动选择区域，或按住 Shift 键同时选择单个元素来将元素作为一组选择。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_279_0.png)\n\n一旦您选择了一组元素，就可以轻松地在水平和垂直方向上对齐组中的所有元素。如果您想将示例中的所有标签对齐到顶部，请选择菜单项\
  \ 格式 | 对齐 | 顶部。这将使所有选定元素与组中最上面的选择对齐。此外，您还可以将这些元素对齐到中间或底部。对于垂直分组的元素，您可以将其对齐到左、中或右。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_279_1.png)\n\n现在，假设您想要均匀分布所有选定的元素。这可以通过选择菜单项\
  \ 格式 | 分布 | 水平等距 来实现。您可以通过选择 等垂直间距 在垂直方向上执行相同的操作。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_279_2.png)\n\
  \n### 其他布局功能\n\n在报表设计器中工作时，还有一些额外的布局功能可以让您的生活更轻松。第一个功能是将一个元素的 **粘贴格式** 应用到另一个元素的能力。选择并复制您想要共享格式的元素。现在，选择您想要应用格式的附加元素并选择菜单项\
  \ `Edit | Paste Formatting`。所有与格式相关的属性都会复制到选定元素中，同时保留其与数据相关的属性。\n\n### Pentaho 报表设计器快捷键\n\
  \n下表显示了 Pentaho 报表设计器中所有可用快捷键的列表：\n\n| Shortcut key | Description | Shortcut key\
  \ | Description |\n|---|---|---|---|\n| Ctrl+N | 创建新报表 | Ctrl+Arrow key | 按方向移动元素一个网格线\
  \ |\n| Ctrl+Shift+N | 启动报表向导 | Arrow Key | 按箭头键方向移动元素一个像素 |\n| Ctrl+O | 打开“打开报表”对话框\
  \ | Ctrl+A | 全选 |\n| Ctrl+Shift+NumPad/ | 从仓库打开“打开报表”对话框 | Escape | 清除所有选择 |\n|\
  \ Ctrl+F | 关闭报表 | Ctrl+Quote | 显示或隐藏网格 |\n| Ctrl+S | 保存报表 | Ctrl+1 | 字体属性 |\n| Ctrl+Shift+P\
  \ | 在仓库中发布报表 | Ctrl+B | 加粗元素字体 |\n| Ctrl+Z | 撤销 | Ctrl+I | 斜体元素字体 |\n| Ctrl+Y |\
  \ 重做 | Ctrl+H | 置于最前 |\n| Ctrl+X | 剪切 | Ctrl+U | 置于前 |\n| Ctrl+C | 复制 | Ctrl+D |\
  \ 置于后 |\n| Ctrl+V | 粘贴 | Ctrl+E | 置于最后 |\n| Ctrl+Shift+V | 粘贴格式 | Ctrl+3 | 显示或隐藏报表资源管理器窗口\
  \ |\n| Delete | 删除当前元素 | Ctrl+2 | 显示或隐藏元素属性窗口 |\n\n此外，您还有以下快捷键可用于访问菜单：\n\n| Shortcut\
  \ key | Description |\n|---|---|\n| Alt+F | 打开“文件”菜单 |\n| Alt+V | 打开“视图”菜单 |\n\n\
  |  |  |\n|---|---|\n| Alt+I | 打开插入菜单 |\n| Alt+O | 打开格式菜单 |\n| Alt+D | 打开数据菜单 |\n\
  | Alt+E | 打开扩展菜单 |\n| Alt+W | 打开窗口菜单 |\n| Alt+H | 打开帮助菜单 |\n\n## 不同输出格式的注意事项\n\n\
  根据输出格式的不同，您设计的报表在渲染时可能会有所差异。您将了解在渲染到各种输出格式时遇到的一些常见问题。在开发报表时，请务必在计划渲染的格式中预览报表，以避免在发布报表后出现任何意外。\n\
  \n## 单元格输出\n\n在渲染到 CSV、Excel、RTF 以及在某些方面渲染到 HTML 时，单元格布局成为一个重要问题。Pentaho Reporting\
  \ Engine 会尽力确定报表最合适的单元格布局，但仍需遵循某些做法以确保报表美观。\n\n元素对齐在处理单元格输出时至关重要。请确保所有水平和垂直对齐都准确。即使水平或垂直位置存在细微差异，报表到单元格渲染算法也可能出现困难。\n\
  \n以下屏幕截图显示了一个示例；报表中的元素未正确对齐：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_285_0.png)\n\
  \n这就是报表在 Excel 中的显示效果：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_285_1.png)\n\n\
  请注意，在标签之前会出现额外的单元格，使得最终结果完全不精确且不专业。以下屏幕截图显示了一个元素对齐正确的报表：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_286_0.png)\n\
  \n这就是 Excel 输出的显示效果：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_286_1.png)\n\n\
  使用基于单元格的报表生成器时，另一个需要考虑的问题是元素重叠。相互重叠的元素将无法正确渲染，因此应避免重叠。\n\n## 分页\n\n某些输出格式，如 HTML、CSV、RTF\
  \ 和 Excel 输出，将报表（无论报表多长）视为单页。请在了解许多输出类型不会完全相同渲染的情况下使用页眉和页脚。\n\n关于分页，Excel 输出提供了将工作表视为页面的功能，只要在报表频段中使用\
  \ `page-break-before` 和 `page-break-after` 样式属性明确指定分页符即可。\n\n## 丰富图形和图表的限制\n\n虽然某些格式（如\
  \ Excel、HTML 和 PDF）支持图像和图表，但其他格式（如 CSV、文本和 RTF）则无法嵌入这些丰富元素。在设计报表时请牢记这一点。\n\n某些图形元素，如椭圆，在大多数格式中无法渲染。请始终通过在预期格式中预览来验证报表的显示效果。\n\
  \n## 摘要\n\n在本章中，您深入探讨了使用 Pentaho Report Designer 设计和布局报表的方方面面。您首先了解了构成 Report Designer\
  \ 的各种用户界面组件。从那里开始，您深入研究了每个报表频段及其属性。您了解到每个频段都可以通过树结构访问，并且每个频段都可以在画布中显示，同时在属性编辑器中提供属性。\n\
  \n然后您全面查看了所有报表元素。本章向您介绍了所有元素中常见的属性，以及在编辑时各种属性显示的对话框。您还学习了如何利用菜单、工具栏、画布和快捷键快速排列和布局报表。这包括介绍使对齐和分布元素组变得容易的快捷方式。\n\
  \n最后，本章涉及了在使用 Pentaho Reporting 支持的各种输出格式时处理常见问题的其他细节。\n\n本章作为开发人员和信息技术人员的参考手册编写。目标是为您提供详细的描述，帮助您开发出最佳的报表，并提供最准确的细节。阅读完本章后，您应该对\
  \ Pentaho Report Designer 界面感到熟悉，并且能够充分发挥其功能。\n\n在下一章中，您将发现 Pentaho Reporting 定义数据源的所有可用方式。您将再次使用\
  \ Pentaho Report Designer，但您将在第 12 章 *Developing Using Data Sources* 中看到如何重用您将在以下主题中学到的内容。\n\
  \n## 配置 JDBC 和其他数据源\n\n在第 4 章 *Creating a Report with Report Designer* 中，您了解了如何使用\
  \ Pentaho Report Designer 从头开始创建报表。作为练习，您创建了一个数据源，定义了用于查看结果、制作图表、计算公式等的字段列表。在本章中，您将深入了解数据源这一基础概念的细节，发现所有可用的类型及其特定功能。\n\
  \n在本章中，您将从使用 Pentaho 报表进行数据源管理的介绍开始，逐一深入了解所有不同的数据源，并学习如何使用 Pentaho Report Designer\
  \ 配置它们。特别是，您将看到：\n\n- 使用 JDBC 的 DBMS 数据源\n- XML 元数据交换格式中的元数据源\n- MongoDB 数据源\n-\
  \ Pentaho Data Integration 转换数据源\n- OLAP 模式（Mondrian）数据源\n- XML 数据源\n- 表结构数据源\n\
  - Report Designer 的高级数据源\n- Pentaho 社区数据访问数据源\n\n一章类似的章节，涵盖使用 Pentaho Reporting\
  \ SDK 的数据源主题，将是第 12 章 *Developing Using Data Sources*，完全致力于开发人员体验。\n\n本章作为开发人员和信息技术人员的参考手册编写。目标是分享\
  \ Pentaho Report Designer 中关于数据源的所有相关和高级功能。在本章结束时，您将对它提供的所有连接源的方式感到熟悉。这是开发简单和复杂的\
  \ Pentaho 报表必须经历的第一步。\n\n## 介绍数据源\n\n我们已经介绍了数据源在报表开发中的重要性。事实上，使用 Report Designer\
  \ 和 Pentaho Reporting SDK 进行报表开发时，数据源都是第一步。简而言之，Pentaho Reporting 使用数据源来定义报表中可用的数据集，使用由字段和行组成的表表示。每个字段由名称和类型（即字符串、整数等）定义，而一行是与字段相关的值的集合。字段和行是\
  \ Pentaho 报表的实际内容，可用于查看结果、制作图表、计算公式、定义参数和用户输入，以及许多其他用途。\n\n即使数据源的结果始终是一个表，源的类型也可能有很大差异。我们可以有关系型\
  \ DBMS、NoSQL 数据库、不同的引擎（如 OLAP、Pentaho Data Integration 等），甚至像 XML、元数据等静态数据结构的各种格式。在下一节中，您将了解如何使用\
  \ Pentaho Report Designer 管理您的数据源。\n\n## 报表资源管理器中的数据集\n\n从 Report Designer 用户界面开始，您应该已经熟悉报表资源管理器（您可以在右上角面板中找到它）。报表资源管理器由两个不同的选项卡组成：Structure\
  \ 和 Data。您在第 5 章 *Design and Layout in Report Designer* 中大量使用了 Structure 选项卡，但现在是您第一次看到\
  \ Data 选项卡。作为初步介绍，Data 选项卡是所有数据源所在的位置，以及其他一些类型的对象。\n\n查看 Data 选项卡内容，您可以看到一个 `Data\
  \ Sets` 项，列出了报表中定义的所有数据源。在空报表中，`Data Sets` 项没有子项，但在每个正在工作的报表中，它至少有一个子项。以下屏幕截图显示了报表资源管理器在有两个数据源时的外观\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_293_0.png)\n\n已定义：\n\n如您所见，每个数据源都由一个唯一名称标识（示例中为\
  \ `Query 1` 和 `Query 2`），并且每个数据源都包含一个字段列表。即使报表有多个数据源，也只有一个被选中用于明细（在本例中为 `Query 1`）。只有选中的数据源会显示可用字段列表。所有其他数据源用于不同的目的：用于参数值的列表、子报表中的查询等。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_293_1.png)\n\n*如果您有多个数据源，请直接在报表资源管理器面板中右键单击其中一个，然后单击\
  \ Select Query。这将使数据源能够在当前报表的详细信息中使用。*\n\n每个数据源的字段都有一个名称和一个类型。字段的名称不过是一个有意义的标签。字段的类型是\
  \ Java 类型，\n\nlike string, integer, long, date, timestamp, and others. You will\
  \ see that the field's type will help you during the report development, to set\
  \ up the format and grouping, and everything is directly connected to presentation.\
  \ Starting from this panel, you can drag a field and drop it directly into the preferred\
  \ place in the bands of your report.\n\nComing back to the data source topic, you\
  \ can create a new data source by right clicking on the `Data Sets` item and choosing\
  \ the preferred type. Alternatively, you can click on the database icon ( ) in report\
  \ explorer or use the upper menu choosing the Data | Add Datasource item. In the\
  \ following sections you will see, one by one, how to create (and manage) all the\
  \ different available data sources.\n\n## The JDBC data source\n\nThe first type\
  \ of data source in the list, and the most used one, is the JDBC data source. JDBC\
  \ is an API for the Java language, which defines how a client may access a database.\
  \ It provides methods to query (and update) data in a database and is oriented towards\
  \ relational databases. See https://en.wikipedia.org/wiki/Java_Database_Connectivity\
  \ for further details.\n\nOnce selected, a modal window, similar to the following\
  \ one, appears:\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_295_0.png)\n\nThe window\
  \ contains two main sections: the connections (on the left) and the queries (on\
  \ the right). The next two sections will introduce all the features for both the\
  \ panels.\n\n## Adding or editing a JDBC connection\n\nEven if the connection panel\
  \ contains some SampleData connections, you can see here how to add a new one or\
  \ how to edit an existing one. In the connection panel of the window, you can see:\n\
  \n- A pencil icon (✏️) used to edit an existing connection\n- A green plus icon\
  \ (⊕) used to add a new connection to the list of the available ones\n- A red icon\
  \ (\U0001F5D1️) used to delete an existing connection\n\nIn addition, if you want\
  \ to provide parameters that contain different authentication credentials for the\
  \ connections, click the Edit Security button in the upper-left corner of the window\
  \ and then type in the fields or variables that contain the user credentials you\
  \ want to store as a parameter. A username and password will be available as security\
  \ parameters when you are creating your report.\n\nThe user experience for adding\
  \ or editing a JDBC connection is mainly the same; a new modal window similar to\
  \ the following one is shown, containing all the requested fields and parameters\
  \ to connect to a relational DBMS. The user experience for deleting an existing\
  \ connection is simpler, as it requires only a confirmation.\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_297_0.png)\n\
  \nThe Database Connection user interface contains a grouping selector on the left\
  \ pointing to General and Options, a Connection Name field, a Connection Type field,\
  \ Settings, Access, and few buttons for actions (Test, OK, and Cancel). Selecting\
  \ Options in the grouping selector, a collection of empty couples of parameter/value\
  \ can be specified for the connection (they really depend on the database).\n\n\
  The Connection Name field is mandatory (in the example, it points to the existing\
  \ `SampleData (Hypersonic)` connection). The Connection Type field lists all the\
  \ available types of databases supported by the Pentaho Reporting Engine, with more\
  \ than 40 different types of relational DBMS, from the most famous to the more specific\
  \ ones, open source or legacy ones, newest, and oldest versions, and so on.\n\n\
  > *All the drivers are provided for the supported databases. Even if you are going\
  \ to use a very common type of relational DBMS, you may need to add the right driver.\
  \ To check for the existing drivers or to add a new one, look at the `jar` libraries\
  \ in the `<report-designer>/lib/jdbc` folder. Always remember to restart Pentaho\
  \ Report Designer after every change to the drivers in the `jdbc` folder.*\n\nOnce\
  \ selected a connection type, settings can change accordingly. To be more precise,\
  \ the number (and types) of settings requested by the user depends on the connection\
  \ type and access. Access depends on the connection type, and for most of the supported\
  \ relational databases, it includes `JDBC`, `ODBC`, and `JNDI`.\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_298_0.png)\n\
  \n> The *Open Database Connectivity (ODBC)* is a standard API for accessing DBMS.\
  \ The designers of ODBC aimed to make it independent of database systems and operating\
  \ systems.\n\nThe available buttons are easy to understand: the Test button tries\
  \ to access the database and check the correct connection; the OK button confirms\
  \ the changes to the database connection; and the Cancel button, well, you can imagine\
  \ what this button does.\n\nOnce you have added or edited a database connection,\
  \ select one of the available connection to instruct Pentaho to use it during the\
  \ query development.\n\n## About the JNDI access\n\nThe **Java Naming and Directory\
  \ Interface (JNDI)** is a Java API for a directory service that allows Java software\
  \ clients to discover and look up data and objects using a name. Because of its\
  \ nature, the settings requested for the JNDI connection is a name only. This unique\
  \ name should match an existing JNDI connection available in the Pentaho Reporting\
  \ environment.\n\nTo set up a JNDI data source in Pentaho Reporting, edit the `.pentaho/simple-jndi/default.properties`\
  \ file. The `.pentaho` directory is in the home or user directory of the user account\
  \ that runs Pentaho Report Designer. If you have multiple copies of Pentaho Report\
  \ Designer installed in multiple user accounts, each `default.properties` file should\
  \ be edited.\n\nThe following example shows text lines to be added/edited relation\
  \ to an existing JNDI connection; the JNDI connection to `SampleData` on HyperSQL:\n\
  \n```\nSampleData/type=javax.sql.DataSource\nSampleData/driver=org.hsqldb.jdbcDriver\n\
  SampleData/url=jdbc:hsqldb:hsql://localhost/sampledata\nSampleData/user=pentaho_user\n\
  SampleData/password=password\n```\n\nAs you can see, the name of the JNDI connection\
  \ is used as a prefix for all the settings in the properties file.\n\n## Adding\
  \ or editing a query\n\nOnce the connection is added (or updated), the next task\
  \ is defining the queries. Starting from the JDBC Data Source window, the Available\
  \ Queries panel lists all the queries defined for the current data source. In the\
  \ top-right corner of the panel, you can see:\n\n- A green plus icon (⊕) used to\
  \ add a new query\n- A red icon (⊗) used to delete an existing query\n\nA query\
  \ is generally identified by a name and content. The name of a query can be edited\
  \ in the Query Name field and the content can be managed in the bottom panel of\
  \ the window. The content could be a static string or a script. The static query\
  \ (widely used) is written in the syntax required for the database type (usually\
  \ SQL). The SQL string can be enriched with some optional parameters defined using\
  \ a specific notation (you will see the syntax of the notation in the following\
  \ chapters).\n\nThe query scripting is a source code in ECMAScript or Groovy and\
  \ you can use it to manipulate the dataset, using a programming language. The query\
  \ scripting is rarely used and we won't treat it in detail, but it's a collection\
  \ of functions you can develop to make the dataset exactly as you want. The static\
  \ query can be specified in the Query field of the Static Query tab, and the query\
  \ scripting can be specified in the Query Script field of the Query Scripting tab.\n\
  \n> *Click on the Template button of the Query Scripting tab to see all the available\
  \ functions, and documentation on how to develop the dataset using the source code\
  \ instead of a standard query.*\n\nThe pencil icon (✎) in the Static Query tab is\
  \ useful to launching SQLeonardo Query Builder, a powerful and easy-to-use GUI that\
  \ lets you query databases without any relevant knowledge of the SQL syntax. Max\
  \ Preview Rows, if enabled, lets you declare the maximum number of rows retrieved\
  \ for previewing the data, and the Preview button checks that everything is working\
  \ as expected and shows a bunch of data results as a data table.\n\n\n\n如您所见，在“可用查询”面板中，您可以定义一个或多个\
  \ SQL 查询。如本章开头所述，在报表中定义多个查询对于参数值的列表、在子报表中使用等非常有用。\n\n## 元数据数据源\n\n元数据数据源允许您查询单个\
  \ XMI 格式的文件。XML 元数据互换（XMI）是对象管理组织（OMG）通过 XML 交换元数据信息的标准。它可用于任何元模型可以用元对象设施（MOF）表示的元数据。XMI\
  \ 最常见的用途是作为 UML 模型的交换格式，尽管它也可以用于其他语言（元模型）模型的序列化。Pentaho 套件中的一些工具（例如，Pentaho Data\
  \ Integration）可以生成 XMI 文件来表示元数据，并且借助此数据源，它们可用于生成报表。\n\n选择此数据源类型后，会显示一个模态窗口，如下所示：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_302_0.png)\n\n如窗口顶部所示，在此数据源中您还可以使用标准配置或脚本定义数据集。该脚本与您在\
  \ JDBC 数据源中看到的类似，因此我们将讨论重点放在常规设置上。\n\n面板中（顶部）的第一项与 XMI 文件的定义相关。作为示例，我们使用了 Pentaho\
  \ Report Designer 发行版中捆绑的 metadata.xmi 文件。在前面的屏幕截图中，您可以检查文件（在 report-designer/samples\
  \ 文件夹中）的确切位置。\n\n在“Domain Id”字段中，指定此元数据文件所属的解决方案目录名称。在“可用查询”面板中，您可以看到为当前数据源定义的所有查询的列表。如\
  \ JDBC 查询所示，您可以使用绿色加号图标（⊕）添加新查询，并使用红色图标（⊗）删除现有查询。\n\n在“查询名称”字段中，您可以输入有意义的标签来标识查询，并在窗口底部，您可以看到查询内容。如\
  \ JDBC 数据源所示，查询内容可以使用静态查询或脚本定义。脚本与 JDBC 数据源中描述的相同，而静态查询采用 XML 格式。\n\n鉴于查询的 XML 格式对用户不太友好，因此提供了元数据查询编辑器。要访问元数据查询编辑器，请单击面板右上角的小铅笔图标（✎）。单击后，会显示如下类似的窗口：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_303_0.png)\n\n从“业务域”菜单和“业务模型”菜单中选择一个项目，然后将一个或多个“类别/列”添加到“所选列”和/或“条件”和/或“排序依据”中以定义您的查询。完成后，单击“确定”以确认定义。\n\
  \n如 JDBC 数据源所示，“最大预览行数”和“预览”按钮可让您检查一切是否按预期工作，并以数据表的形式显示一批数据结果。\n\n## MongoDB 数据源\n\
  \nMongoDB 数据源允许您原生连接到著名的 NoSQL 数据库。为此，您必须已经拥有 MongoDB 数据库连接信息，例如主机名、端口号和身份验证凭据。\n\
  \n> *MongoDB（源自 humongous）是一款免费的开源跨平台文档型数据库程序。被归类为 NoSQL 数据库程序，MongoDB 使用类似 JSON\
  \ 的文档，其中包含模式，存储为内容。*\n\n选择后，此数据源类型会显示一个包含两个面板的模态窗口：左侧为查询列表面板，右侧为查询详细信息面板。查询列表面板与为\
  \ JDBC 数据源介绍的面板类似，您可以在其中看到添加查询（⊕）和删除查询（⊖）的图标。单击绿色加号（⊕）图标，会在可用查询中添加一个新的 Query 1，如下图所示：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_305_0.png)\n\n选择查询（或创建新查询）后，右侧面板会显示“名称”字段，您可以在其中更改查询的有意义标签，并在下方有一组四个选项卡用于设置到\
  \ MongoDB 源的连接。“配置连接”是第一个需要某些设置的选项卡。输入 MongoDB 数据库的主机名和端口号。您还可以通过冒号分隔主机名和端口号，并用逗号分隔每个主机名和端口号组合，为每个主机名指定不同的端口号，如\
  \ `<ip1>:<port1>,<ip2>:<port2>`。\n\n如果希望 MongoDB 自动感知并尝试连接到可用主机，即使其中一个主机宕机，请选中“使用所有副本集成员”。在“用户”字段和“密码”字段中输入访问\
  \ MongoDB 数据库所需的凭据。如果使用此协议，请选中“使用 Kerberos 进行身份验证”。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_306_0.png)\n\
  \n> Kerberos 是一种计算机网络身份验证协议，它基于票据工作，允许在不安全的网络上通信的节点以安全的方式相互验证身份。\n\n设置“连接”和“套接字”以定义源的可选超时。转到“输入选项”选项卡，在下面的屏幕截图中可以看到窗口的外观。在此选项卡中，您在编写查询之前指定所有指向正确数据库的设置：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_306_1.png)\n\n单击“获取数据库”按钮将使用可用数据库的名称填充下拉菜单。选择合适的数据库或使用该字段输入数据库名称。对于“获取集合”按钮和“集合”字段，使用相同的步骤，但针对的是\
  \ Mongo 集合。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_307_0.png)\n\n> *Mongo 集合是\
  \ MongoDB 文档的分组。集合相当于 RDBMS 表。集合存在于单个数据库中。集合不强制执行模式。集合中的文档可以具有不同的字段。通常，集合中的所有文档具有相似或相关的用途。*\n\
  \n最后但并非最不重要的一点是，您可以在“读取”字段中指定读取偏好。如果要指定标签集，请单击“获取标签”按钮。在 MongoDB 数据库上指定的标签集会出现在窗口的“标签集”部分。如果要将标签集一起附加，以便一次性处理，请选择标签集，然后单击“连接标签”按钮。单击“测试标签集”按钮可查看与标签集条件匹配的节点列表。\n\
  \n转到“查询”选项卡，在下面的屏幕截图中可以看到窗口的外观：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_307_1.png)\n\
  \n在此选项卡中，您可以使用两种不同的方法制定查询：创建查询作为 JSON 查询表达式或使用 Mongo 聚合框架。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_307_2.png)\n\
  \n> *Mongo 聚合框架处理数据记录并返回计算结果。聚合操作将多个文档中的值组合在一起，并可对分组数据执行各种操作以返回单个结果。*\n\n使用 JSON\
  \ 查询表达式类似于使用 Mongo `find()` 命令。为了使用 JSON 查询表达式模式，请确保未选中“查询为聚合管道”复选框。`find` 的查询参数在“查询表达式（JSON）”字段中输入，而投影参数在“字段表达式（JSON）”文本框中提供。\n\
  \n要使用聚合框架查询 MongoDB，请单击“查询为聚合管道”复选框，并在“查询表达式（JSON）”字段中输入一系列管道操作。此模式使用与 MongoDB `aggregation()`\
  \ 命令相同的语法。您可以使用简单的字符串替换对 JSON 查询表达式和聚合管道查询进行参数化（您将在后面的章节中看到参数化是如何进行的）。\n\n转到“字段”选项卡，在下面的屏幕截图中可以看到窗口的外观。在此选项卡中，您可以查看您指定的数据库和集合中的字段：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_308_0.png)\n\n单击“获取字段”按钮，要求 Pentaho 确定哪些字段可用及其数据类型。然后字段将被显示。如有需要，您可以编辑字段的名称，并可以编辑\
  \ MongoDB 数据库中字段的路径。如果返回的是数组，您可以通过在括号中指示元素的编号来指定数组中的元素；例如，`$.myArrayElement[0]`（使用\
  \ `$.myArrayElement[*]` 表示整个集合）。\n\n最后但并非最不重要的一点是，使用“出错时中止转换”复选框来请求\n\n出现错误时中止，Edit\
  \ Parameters 按钮用于编辑转换的参数，以及 Preview 用于测试连接并查看数据在导入 Report Designer 时的显示效果。\n\n完成后，点击\
  \ OK。Pentaho Report Designer 现在可以访问您的 MongoDB 数据源。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_309_0.png)\n\
  \n> *在本书开发期间，我在使用 Pentaho Report Designer 7.0 和 7.1 版本时遇到了此数据源的一些问题。6.1 版本似乎工作正常。当然，在像\
  \ Report Designer 这样复杂的产品开发中这种情况可能会发生。如果您遇到类似问题，可以选择使用 Pentaho Data Integration\
  \ 数据源作为替代方案来从 MongoDB 获取数据。*\n\n## Pentaho Data Integration 数据源\n\n如果您想要创建包含 PDI\
  \ 转换中任意步骤数据的报表，请使用 Pentaho Data Integration 数据源选项。正如您可能知道的，Pentaho Data Integration\
  \ 是 Pentaho 套件的核心工具之一，旨在实现功能完善的 ETL 和数据集成解决方案（完整介绍请查阅第 16 章，*在 Pentaho Data Integration\
  \ 中使用报表*）。这种数据源类型特别有用，如果您想要创建包含 Excel 输入或其他 PDI 步骤的转换步骤数据的报表。\n\n> 提示\n> *如果您使用此类型的数据源，请记住将\
  \ <data-integration>/lib 中的所有 JAR 文件复制到 <report-designer>/lib，以便通过 Pentaho Report\
  \ Designer 访问它。*\n\n一旦选择此数据源类型，将显示一个模态窗口，如下所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_310_0.png)\n\
  \n窗口左侧显示查询列表，带有众所周知的绿色加号图标 (+) 用于添加新查询，红色图标 (x) 用于删除现有查询。窗口右侧可以找到查询定义。与之前的数据源一样，Name\
  \ 字段指定查询的有意义标签。File 字段指向一个 .ktr 文件（Pentaho Data Integration 用于转换的格式），底部面板列出了定义转换的步骤列表。从列表中选择一个步骤将指示\
  \ Pentaho Report Designer 将其用作数据源的数据生成器。\n\n例如，您可以取 Pentaho Data Integration 发行版中\
  \ `<data-integration>/samples/transformations` 文件夹中存储的 `csv Input - Reading customer\
  \ data.ktr` 文件。\n\n为了完成描述，Preview 按钮与您在之前数据源中看到的相同，OK/Cancel 按钮是用于确认/取消当前操作的标准按钮。最后但同样重要的是，使用\
  \ Edit Parameter 按钮设置 PDI 转换的调用以使用正确的设置。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_311_0.png)\n\
  \n> 这种数据源类型因 Pentaho Data Integration 的功能而极具吸引力。Pentaho Data Integration 能够连接到各种来源，因此矛盾的是，您可以使用此数据源仅连接到\
  \ Pentaho 套件可以连接的所有可能来源。想要一个例子吗？打开 `<report-designer>/resources/datasources/MongoDb.ktr`\
  \ 中的 `.ktr` 文件，看看它如何用于从 MongoDB 实例中提取数据。\n\n## OLAP 数据源\n\n**在线分析处理 (OLAP)** 数据源在涉及多维引擎时使用。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_312_0.png)\n\n> *引用自关于 OLAP 的维基百科 (https://en.wikipedia.org/wiki/Online_analytical_processing)：多维结构被定义为关系模型的变体，使用多维结构来组织数据并表达数据之间的关系。即使数据被操作，它仍然易于访问并继续构成紧凑的数据库格式。多维结构在用于\
  \ OLAP 应用的分析数据库中相当流行。分析数据库使用这些数据库是因为它们能够迅速地对复杂的业务查询做出回答。*\n\nPentaho 套件提供了一个名为 Mondrian\
  \ (http://community.pentaho.com/projects/mondrian) 的开源多维引擎。Mondrian 完全用 Java 编写，并执行使用\
  \ **多维表达式 (MDX)** 语言编写的查询，从关系数据库读取数据并以多维格式呈现结果。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_312_1.png)\n\
  \n> *引用自关于 MDX 的维基百科 (https://en.wikipedia.org/wiki/MultiDimensional_eXpressions)：MDX\
  \ 是使用数据库管理系统进行 OLAP 的查询语言。与 SQL 类似，它是关系数据库的查询语言。它也是一个计算语言，其语法类似于电子表格公式。*\n\n一旦可供数据源类型选择，您可以看到有两种不同的子组可用：OLAP\
  \ 和 OLAP（高级）。OLAP（高级）数据源与标准 OLAP 数据源的区别仅在于设计和输入 MDX 查询的方法。标准 OLAP 数据源允许使用 Report\
  \ Designer 内置的元数据查询编辑器，而 OLAP（高级）数据源要求您构建公式来计算查询，这使您在报表参数化功能方面拥有更大的控制权。\n\n在两个子组中，您都可以找到一个名为去规范化（默认数据源假定它们是规范化的）的每个\
  \ OLAP 数据源的版本。规范化和去规范化是 MDX 查询的两种可能的分类，取决于结果数据集的结构。本书的范围不包括详细阐述数据规范化/去规范化的细节，但以下示例可以阐明两者之间的差异。\n\
  \n这是一个 MDX 查询的规范化形式示例：\n\n| [Time].[(All)] | [Time].[Years] | [Measures].[Revenue]\
  \ | [Measures].[Quantity] |\n|---|---|---|---|\n| 所有年份 | 2015 | 150,000 | 1,000\
  \ |\n| 所有年份 | 2016 | 170,000 | 1,100 |\n| 所有年份 | 2017 | 190,000 | 1,200 |\n\n这是一个相同\
  \ MDX 查询的去规范化形式示例：\n\n| [Time].[(All)] | [Time].[Years] | [Measures].[MeasuresLevel]\
  \ | Measure |\n|---|---|---|---|\n| 所有年份 | 2015 | Revenue | 150,000 |\n| 所有年份 |\
  \ 2016 | Revenue | 170,000 |\n| 所有年份 | 2017 | Revenue | 190,000 |\n| 所有年份 | 2015\
  \ | Quantity | 1,000 |\n| 所有年份 | 2016 | Quantity | 1,100 |\n| 所有年份 | 2017 | Quantity\
  \ | 1,200 |\n\n考虑到规范化和去规范化数据源以完全相同的方式定义，并且唯一的变化在于结果格式，在以下描述中，我们不会详细说明去规范化的那些，假设它们可以以完全相同的方式定义。\n\
  \n## Pentaho 分析\n\nPentaho 分析数据源定义了对 Mondrian 多维引擎的访问。一旦选择，将显示一个模态窗口，如以下屏幕截图所示。\n\
  \n正如您在窗口顶部所看到的，在此数据源中您也可以使用标准配置或脚本定义数据集。脚本与您为 JDBC 数据源看到的类似，因此我们将讨论集中在常规设置上。\n\n\
  面板（顶部）中的第一个任务是关于 Pentaho 分析架构文件。请求的结构文件是 XML 格式的 Mondrian 架构。例如，我们使用了 Pentaho Reporting\
  \ Designer 发行版中捆绑的 `steelwheel.mondrian.xml` 文件。在以下屏幕截图中，您可以检查文件（在 `report-designer/samples`\
  \ 文件夹中）的确切位置：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_315_0.png)\n\n在 Logical\
  \ Schema Name on Server 字段中，指定您感兴趣查询的 OLAP Cube 的名称。窗口下方，您可以看到 JDBC 连接面板（左侧）和查询面板（右侧）。两者\n\
  \n与之前数据源中看到的类似。\n\nJDBC 连接面板在此指定，因为 Mondrian Engine 运行在关系型 DBMS 之上，因此是必需的。JDBC 连接的工作方式如本章前面所述。Edit\
  \ Security 按钮允许您指定一些安全参数，图标可用于编辑（✏️）、添加（⊕）和删除（✖️）连接，下方面板列出现有连接。\n\n查询面板再次与 JDBC\
  \ 数据源类似，只是查询语法必须使用 MDX 语言。在查询面板中，您可以看到带图标（⊕）用于创建和图标（✖️）用于删除的 Available Queries、已定义查询的列表，以及名为\
  \ Query Name 的以下字段。在底部面板中，Static Query 选项卡和 Query Scripting 选项卡提供与 JDBC 连接相同的用户体验和内容。再次提醒，Static\
  \ Query 选项卡的 Query 字段必须包含 MDX 查询，并且可以定义将在后续章节中描述的参数。\n\n正如 JDBC 数据源中看到的那样，Max Preview\
  \ Rows 和 Preview 按钮可让您检查一切是否按预期工作，并以数据表的形式显示一批数据结果。\n\n## OLAP4J\n\nOLAP4J 数据源定义了使用通用\
  \ API 访问任何 OLAP 服务器。OLAP4J 是一个用于 OLAP 的开放 Java API（http://www.olap4j.org）。可以将其视为\
  \ JDBC，但用于访问多维数据。\n\n选择后，将显示如下模态窗口：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_317_0.png)\n\
  \n如您所见，用户界面的组件与 JDBC 连接完全相同：Data Source 选项卡和 Global Scripting 选项卡，以及连接面板（左侧）和查询面板（右侧）。它们与\
  \ JDBC 连接面板具有相同的含义和用途，只是 OLAP4J Security Configuration 按钮包含与 JDBC 不同的参数。当然，在这种情况下，Query\
  \ 字段也应为 MDX 语言，并且可以定义参数。\n\n请注意，需要设置的连接是自定义 JDBC 连接，设置类似于以下内容：Custom Connection\
  \ URL:\njdbc:xmla:Server=http://<server>:<port>;Catalog=FoodMart;Cube=Budget\nCustom\
  \ Driver Class Name: org.olap4j.driver.xmla.XmlaOlap4jDriver\n\n## Pentaho analysis\
  \ - custom\n\nPentaho analysis（custom）数据源专门用于 OLAP（高级）组。它定义了与 Pentaho analysis 类似的对\
  \ Mondrian 多维引擎的访问，区别在于查询以动态计算的形式提供，而不是静态查询。\n\n选择后，将显示如下模态窗口：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_318_0.png)\n\
  \n如您所见，所提供的字段是为 Pentaho analysis 提供的字段的子集。如本数据源介绍中所述，查询面板缺失。要指定 MDX 查询，公式会直接在运行时在报表定义中使用。您可以根据使用场景在\
  \ Master Report 元素的 name 属性中构建公式，如以下屏幕截图所示：\n\n### 结构\n\n### 数据\n- 主报表\n  - 页面页眉\n\
  \  - 报表页眉\n  - 组\n    - 组页眉\n    - 详细信息主体\n      - 详细信息页眉\n      - 详细信息\n      -\
  \ 无数据\n      - 详细信息页脚\n    - 组页脚\n  - 报表页脚\n\n### 样式\n\n### 属性\n\n| 名称 | 值 | 表达式\
  \ |\n|---|---|---|\n| query |  |  |\n| name |  |  |\n| limit |  |  |\n| timeout\
  \ |  |  |\n| design-timeout |  |  |\n| auto-sort | true |  |\n| shared-connect...\
  \ |  |  |\n| data-cache |  |  |\n| common |  |  |\n| type | master-report |  |\n\
  \n## XML 数据源\n\nXML 数据源相当容易理解，如果您不想使用数据库但想在报表中使用数据，对于来自外部系统的导出数据很有用。选择此数据源类型后，将显示如下模态窗口：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_320_0.png)\n\n从顶部开始，第一个参数是关于指向 XML 文件。在此示例中，我们将使用存储在\
  \ `report-designer/samples` 文件夹中的 `steelwheels.mondrian.xml` 文件。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_320_1.png)\n\
  \n*如果您觉得 `steelwheels.mondrian.xml` 文件没有漂亮的数据集并且可能难以查询，您是对的！`steelwheels.mondrian.xml`\
  \ 包含 Mondrian 架构的声明，并且不包含类似数据库导出的数据。不幸的是，这是 Pentaho Reporting 发行版中捆绑提供的可用内容，对于我们演示\
  \ XML 数据源的使用示例来说已经足够了。*\n\n在 XML 文件选择下方，您可以看到可用查询列表，其中有众所周知的绿色加号图标（ ）用于添加新查询，红色图标（\
  \ ）用于删除现有查询。Query Name 字段是您可以更改查询有意义标签的地方。在 Query 字段中，您可以指定表示查询的静态字符串。Query 字段中使用的格式是\
  \ **XML 路径语言（XPath）** 格式。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_321_0.png)\n\
  \n*XPath 是一种用于从 XML 文档中选择节点的查询语言。此外，XPath 可用于从 XML 文档的内容计算值（例如字符串、整数或布尔值）。*\n\n\
  最后但同样重要的是，Preview... 按钮和 OK/Cancel 按钮是大多数先前数据源中描述的标准按钮。\n\n## 表数据源\n\n如果您需要管理静态且预定义的数据，而这些数据未存储在大量存储或配置文件中，则使用表数据源。与其他数据源相比，此数据源直接在\
  \ Pentaho Report Designer 内部定义其结构。因此，首先要做的是在查询之前声明，并在之后定义其结构，从一个两列表开始。表的定义很简单：您可以为列指定值，更改列名，并添加（或删除）行或列。\n\
  \n选择此数据源类型后，将显示如下模态窗口：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_322_0.png)\n\n\
  从窗口中可以看到，您可以从 Microsoft Excel 工作表开始定义表结构。为了完成功能，OK/Cancel 按钮是用于确认/取消当前操作的标准按钮。\n\
  \n## 高级数据源\n\n高级数据源需要高级知识和技能，因此本节仅提供每个高级数据源的高级概述。\n\n### 可脚本\n\n可脚本数据源允许开发人员使用各种语言开发生成数据集的源代码。与之前的数据源一样，您可以创建多个查询并管理查询的添加/删除。\n\
  \n### 外部\n\n当报表在 `.xaction` 中使用时，使用外部数据源。您可以参考官方文档中关于此数据源的（少量）文档。Pentaho 动作序列 XML\
  \ 文档（`.xaction`）定义了数据库查询、报表生成和电子邮件操作等活动，以及它们发生的顺序。\n\n### 序列生成器\n\n序列生成器开发可在报表中使用的序列。与之前的数据源一样，您可以创建多个查询并管理查询的添加/删除。对于每个查询，您可以定义组（数字或系统）、序列（取决于组）以及其他一些参数。\n\
  \n### OpenERP 数据访问\n\nOpenERP 数据访问是著名 Odoo ERP 和 CRM 系统（https://www.odoo.com）的数据源。界面相当简单，允许您执行标准搜索或自定义函数，以从开源\
  \ ERP 中提取数据。\n\n## Pentaho 社区数据访问数据源\n\n**社区数据访问（CDA）** 数据源是与所谓的 Pentaho CDA 相关的有趣类型。Pentaho\
  \ CDA 的设计目的是为数据源提供极大的灵活性。大多数可用工具只能对单个数据源执行查询，并且没有简单的方法来组合来自不同数据库或不同语言的数据（例如将 SQL\
  \ 查询的数据与 MDX 查询的数据组合）。这些任务通常需要独立的 ETL 作业来同步不同的数据源并构建新数据库。Pentaho CDA 是作为数据库连接与 **社区仪表板框架（CDF）**\
  \ 之间的抽象工具开发的，但在这种情况下也用于报表。\n\n选择此数据源类型后，将显示如下模态窗口：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_328_0.png)\n\
  \n如窗口顶部所示，一个指向 Pentaho Business 的 URL\n\nAnalytics Platform 是必需的（您将在第 15 章 *在 Pentaho\
  \ Business Analytics Platform 中使用报表* 中了解更多关于它的信息）。在定义凭据（用户名和密码）、解决方案和路径之后，获取按钮可让您提取\
  \ Pentaho Business Analytics Platform 中部署的所有可用 Pentaho CDA。列出后，您可以在底部面板中使用编辑参数按钮编辑传递给数据访问的参数。\n\
  \n为了完成描述，预览按钮与您在之前数据源中看到的相同，而 OK/Cancel 按钮是用于确认/取消当前操作的标准按钮。\n\n## 摘要\n\n在本章中，您学习了\
  \ Pentaho Report Designer 对数据源可以做的一切，发现了所有可用类型及其特定功能。您从介绍数据源在用户界面中的外观以及字段如何在报表布局中使用开始。然后您继续了解如何使用\
  \ Report Designer 管理所有可能类型的数据源，具体包括：\n\n-   JDBC 数据源\n-   元数据数据源\n-   MongoDB 数据源\n\
  -   Pentaho Data Integration 转换数据源\n-   各种版本的 OLAP 数据源（传统和通用、规范化和非规范化、标准和自定义）\n\
  -   XML 数据源\n-   表数据源\n-   高级数据源（可脚本化、外部、序列生成器和 OpenERP）\n-   Pentaho 社区数据访问数据源\n\
  \n现在您阅读了本章，您应该对 Pentaho Report Designer 提供连接源的所有方式感到熟悉。这是开发简单和复杂的 Pentaho 报表过程中必须经历的第一步。\n\
  \n在下一章中，您将学习有关在 Pentaho 报表中包含图形和图表的一切。\n\n## Including Graphics and Charts in Reports\n\
  \n在发现所有可能的数据源类型之后，本章将教您如何在 Pentaho 报表中加入图形和图表。您将开始了解如何从 Pentaho Report Designer\
  \ 包含图形和图表，然后继续了解所有设置和配置的描述。图形和图表将逐一描述，就像我们对数据源所做的那样，目标是让您成为真正的专家，以获得最佳的最终结果；为您的客户和管理者提供最有用、最具吸引力的报表。\n\
  \n特别是，讨论的图表包括条形图、折线图、面积图、条线图、饼图、多饼图、环形图、气泡图、散点图、XY 条形图、XY 折线图（常规和扩展）、XY 面积图、XY 面积线图、瀑布图、雷达图、温度计图、条形迷你图、线形迷你图和饼形迷你图。\n\
  \n本章作为开发人员和信息技术人员的参考手册编写。目标是分享 Pentaho Report Designer 中可用的有关图形和图表的所有相关和高级功能。\n\n\
  ### Including static images in reports\n\n在 Pentaho 报表中包含静态图像很有用，因为这样您可以添加徽标以及一般图形，使最终结果对用户更具吸引力。\n\
  \n要在报表中包含静态图像，请从 Report Designer 调色板中选择图像图标 (\U0001F5BC️) 并将其放置到报表中。双击该元素，或右键单击并选择编辑内容，以调出资源对话框，您可以在其中浏览到特定文件位置。您可以选择链接到选项以链接外部资源，也可以选择嵌入以将图像包含在\
  \ `.prpt` 文件中。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_332_0.png)\n\n> *如果您不确定，使用嵌入式图像始终是一个不错的选择，因为您可以避免外部链接更改的负面影响。嵌入图像时，`.prpt`\
  \ 文件的尺寸会更大。*\n\n### Including dynamic images in reports\n\n在 Pentaho 报表中包含动态图像很有用，因为这样您可以添加徽标以及一般图形，这些图形可能会根据数据源而变化。例如，我们可以想象报表根据用户的部门更改其徽标，或产品列表中的产品图像。\n\
  \n要向报表添加动态图像，请使用 Report Designer 调色板中的图像字段图标 (\U0001F5BC️) 并将其放置在报表中。内容字段接受不同类型的图像输入以进行渲染。通过双击该元素，您可以编辑指向数据集正确字段的源。如果您有一个字段包含指向图像的\
  \ URL 或文件系统位置，则图像字段元素将渲染指定的图像。\n\n### Including charts in reports\n\n在 Pentaho 报表中包含图表之所以有所不同有两个主要原因：功能强大且易于使用。Pentaho\
  \ 图表功能强大，因为它们能够以多种不同的样式将复杂信息表示为单张图像（图表本身）。它们易于使用，因为图表在报表中的包含可以通过配置（而不是开发）轻松完成，从数据源开始。\n\
  \n> *Pentaho Reporting 依赖于 JFreeChart。JFreeChart 项目成立于 2000 年 2 月，如今它是 Java 最广泛使用的图表库，迄今下载量超过\
  \ 220 万次。*\n\n要向报表添加图表，请从 Report Designer 调色板中拖动图表图标 (\U0001F4CA) 并将其放置在您想要查看图表的位置。通常，图表放置在分组频段中，如报表页眉或组页眉（很少放在页脚或页面页眉）。这是因为图表在应用于数据集合时才有意义，而不是单个值。无论如何，没有什么真正限制您的想象力，您可以将图表放置在报表中的任何位置。\n\
  \n放置到报表画布后，将显示类似以下内容的图像：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_334_0.png)\n\
  \n双击图像或右键单击并选择图表，将显示类似以下屏幕截图的图表编辑器：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_335_0.png)\n\
  \n查看图表编辑器时，编辑图表时会显示三个主要区域。第一个区域位于面板顶部，列出了所有可用的图表类型（Pentaho Reporting 8.0 中为 17 种）。第二个区域位于左侧，包含与图表渲染相关的属性集。第三个属性选项卡区域位于右侧，与填充图表的数据相关。\n\
  \n选择一种图表类型后，属性面板会根据选择进行更新，以及数据属性面板。在以下各节中，您将详细了解所有图表类型的所有可用属性。\n\n正如您所期望的，不同类型的图表适用于不同的用例。如果您想显示单个值随时间变化的趋势强度，最佳图表类型是：\n\
  \n-   Line\n-   Area\n-   XY line area\n-   XY line\n\n如果您直接比较两个或多个相关值，最佳图表类型选择是：\n\
  \n-   Pie\n-   Ring\n-   Bar\n-   Line\n-   Area\n-   Radar\n\n如果您想显示一组值如何直接影响另一组，最佳图表类型是：\n\
  \n-   Bar line combination\n-   Waterfall\n\n如果您比较大量数据点，最佳图表类型是：\n\n-   XY dot (scatter\
  \ plot)\n-   Bubble\n-   Pie grid (multipie)\n\n## Types of datasets\n\n所有图表类型都从不同类型的数据集接收数据。每个图表可以兼容一种或多种数据集类型。数据集类型可以在图表编辑器中通过右侧面板进行选择和管理。\n\
  \n以下是关于每种数据集类型的各节，详细描述其属性和含义。在描述过程中，您还将发现与每种数据集类型兼容的图表类型。此外，对于数据集类型，属性会被分组以便更好地管理和理解。\n\
  \n\n\n## 分类数据集\n\n第一种数据集类型被称为 **分类数据集**，其中数据集的系列和值按类别分组。系列类似于子组。如果出现确切的类别和系列，图表会将值汇总为单个结果。以下表格是分类数据集的简单示例：\n\
  \n| 分类 | 系列 | 销售价格 |\n|---|---|---|\n| 店铺 1 销售 | 现金 | 14 |\n| 店铺 1 销售 | 信用卡 | 12\
  \ |\n| 店铺 2 销售 | 现金 | 100 |\n| 店铺 2 销售 | 信用卡 | 200 |\n\n使用分类数据集的图表有：条形图、折线图、面积图、柱线图、瀑布图和雷达图。\n\
  \nPentaho Reporting 使用 `CategorySetDataCollector` 构建分类数据集。还提供 `PivotCategorySetCollector`，它会对类别和系列数据进行透视。收集器类实现了\
  \ Pentaho Reporting 的函数 API。您可以在图表编辑器中，在数据属性面板中，作为选项卡中的第一个下拉菜单来查看（并更改）收集器。\n\n在以下部分中，您可以看到使用图表编辑器控制分类数据集而定义的属性集的列表。属性的分组方式与在元素属性面板中的分组方式相同。\n\
  \n### 通用属性\n\n在以下表格中，您可以看到为通用属性定义的属性集的列表：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n|\
  \ `category-column` | String | 表示类别的数据源字段名称 |\n| `value-column` | Array of strings\
  \ | 表示值的 数据源字段名称 |\n\n### 系列属性\n\n在以下表格中，您可以看到为系列属性定义的属性集的列表：\n\n| 名称 | 类型 | 描述\
  \ |\n|---|---|---|\n| series-by-values | Array of strings | 指定您正在绘制的值。系列通常放置在图表图例中。\
  \ |\n| series-by-fields | Array of strings | 指定您正在绘制的字段。系列通常放置在图表图例中。 |\n| auto-generate-series\
  \ | Boolean | 如果为 true，则在项目推进时，不会采取任何操作来累积数据。这仅应在指定组时使用，以便在组推进时可以正确累积数据。 |\n\n###\
  \ 分组属性\n\n在以下表格中，您可以看到为分组属性定义的属性集的列表：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `group-by`\
  \ | Selection | 此属性定义应收集数据的分组级别 |\n| `reset-group` | Selection | 此属性定义应重置数据的分组级别\
  \ |\n\n### 可选属性\n\n在以下表格中，您可以看到为可选属性定义的属性集的列表：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n\
  | `cross-tab-column-filter` | Selection | 此属性定义在交叉表中应过滤数据的分组级别 |\n\n## 饼图数据集\n\n\
  与分类数据集不同，**饼图数据集** 定义了数据集的系列和值（未定义类别）。系列类似于子组。如果出现确切的系列，图表会将值汇总为单个结果。以下表格是饼图数据集的简单示例：\n\
  \n| 系列 | 销售价格 |\n|---|---|\n| 现金 | 14 |\n| 信用卡 | 12 |\n| 现金 | 100 |\n| 信用卡 | 200\
  \ |\n\n使用饼图数据集的图表组是饼图和环形图。\n\nPentaho Reporting 使用 `PieDataSetCollector` 构建饼图数据集。考虑到饼图数据集是分类数据集的简化版本，下面我们描述了控制饼图数据集而定义的属性集的差异：\n\
  \n- 在通用属性中，饼图数据集只有 `value-column` 属性，其中包含表示值的 数据源字段名称。请注意，与分类数据集不同，此字段不是字符串数组，而是字符串。\n\
  - 在系列属性中，饼图数据集只有 `series-by-field` 和 `auto-generate-series`。请参阅分类数据集以了解这两个属性的含义。\n\
  - 分组属性和可选属性与分类数据集相同。请参阅分类数据集以详细了解组中包含的属性。\n\n## XY 系列和 XYZ 系列数据集\n\n另外两种相似的数据集类型被称为\
  \ **XY 系列数据集** 和 **XYZ 系列数据集**。这两种数据集类型都是可按各种形式绘制的维值组。在这些数据集中，系列可用于绘制不同的线条等等。以下是一个\
  \ XY 系列数据集的简单示例：\n\n| 系列 | 成本 (X) | 销售价格 (Y) |\n|---|---|---|\n| 现金 | 10 | 14 |\n\
  | 信用卡 | 11 | 12 |\n| 现金 | 92 | 100 |\n| 信用卡 | 105 | 200 |\n\n如您所见，XYZ 系列数据集是三维值组，不同于\
  \ XY 系列数据集，后者是二维值组（其余都相同）。使用 XY 系列数据集的图表组是散点图、XY 柱形图、XY 折线图、XY 面积图、扩展 XY 折线图和 XY\
  \ 面积线图。使用 XYZ 系列数据集的图表组与使用 XY 系列数据集的图表组相同，外加气泡图。\n\nPentaho Reporting 使用 `XY-SeriesCollector`\
  \ 构建 XY 系列数据集，并使用 `XYZ-SeriesCollector` 构建 XYZ 系列数据集。这两个数据集定义了一组与分类数据集不太不同的属性。它们详细描述如下：\n\
  \n- 在通用属性中，XY 系列数据集和 XYZ 系列数据集定义 `x-value-columns` 和 `y-value-columns` 为分别表示 x 轴和\
  \ y 轴值的 数据源字段名称。只有 XYZ 系列数据集才提供 `z-value-columns` 属性。\n- 系列属性、分组属性和可选属性与分类数据集相同。请参阅分类数据集以详细了解组中包含的属性。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_347_0.png)\n\n*如果您查看 Pentaho Reporting\
  \ 8.0（作为示例），还提供了一个名为 `IntervalXY-SeriesCollector` 的收集器。不幸的是，Report Designer 不适用于此类数据集，因此我们只能假设它将与此处详细描述的数据集接近。*\n\
  \n## 时间序列数据集\n\n另一种数据集类型被称为 **时间序列数据集**，它是一个基于时间和日期绘制的二维值组。时间序列数据集更像 XY 系列而不是分类数据集，因为时间刻度以线性方式显示，不同时间参考之间有适当的距离。以下是一个时间序列数据集的简单示例：\n\
  \n| 时间 | 系列 | 销售价格 |\n|---|---|---|\n| 2017 年 6 月 02 日 晚上 11:05 | 现金 | 14 |\n| 2017\
  \ 年 6 月 04 日 下午 12:42 | 信用卡 | 12 |\n| 2017 年 6 月 05 日 下午 04:25 | 现金 | 100 |\n| 2017\
  \ 年 6 月 07 日 下午 01:52 | 信用卡 | 200 |\n\n使用时间序列数据集的图表组是散点图、XY 柱形图、XY 折线图、XY 面积图、扩展\
  \ XY 折线图和 XY 面积线图（与 XY 系列数据集完全相同）。\n\nPentaho Reporting 使用 `TimeSeriesCollector`\
  \ 构建时间序列数据集。时间序列数据集定义了一组与分类数据集不太不同的属性。它们详细描述如下：\n\n- 在通用属性中，时间序列数据集的 `category-time-column`\
  \ 定义表示时间的 数据源字段名称，而 `time-period-type` 允许您定义粒度，从秒、分钟、小时、天、周、月、季度或年。提供了属性 `value-column`，其含义（和类型）与分类数据集相同。\n\
  - 系列属性、分组属性和可选属性与分类数据集相同。请参阅分类数据集以详细了解组中包含的属性。\n\n\n\n\n## 温度计数据集\n\n最后但同样重要，温度计数据集用于实现典型的\
  \ *交通灯* 指示器的变体。数据集仅需一个值即可工作，如果每个分组的数据行多于一行，图表收集器会将所有值聚合为一个总和。\n\n由于其特定性质，该数据集仅由一个名为\
  \ thermometer 的图表使用，Pentaho Reporting 使用 `ThermometerDataSetCollector` 构建温度计数据集。温度计数据集定义了一组有限的属性，由\
  \ `value-column`（包含表示单个值的数据源字段名）和与分类数据集相同的分组属性组成。查阅分类数据集以详细了解分组中包含的属性。\n\n## 样式和布局通用属性\n\
  \n正如你在第 5 章 *报表设计器中的设计与布局* 中所看到的，对于报表频段，以及在图表的情况下，样式和布局属性被分组以便于管理和理解。对于图表而言，样式和布局属性可以在图表编辑器的左侧面板中管理。属性组的管理方式与元素属性面板完全相同：行为相同，用户体验相同。当然，属性不同，具有不同的含义和行为，在本节中，你将了解更多关于它们的信息，发现所有相关细节。\n\
  \n正如我们对报表频段所看到的，大多数图表共享一组通用属性。以下属性在所有图表中通用。任何例外情况都会作为特定图表类型的一部分提及。\n\n## 必需属性\n\n\
  定义为图表正确行为所必需的属性集：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n| `no-data-message`\
  \ | String | 如果没有数据可用于渲染图表，则显示的消息 |\n\n## 标题属性\n\n定义为控制图表（可选）标题的属性集：\n\n| 名称 | 类型\
  \ | 描述 |\n|------|------|-------------|\n| `chart-title` | String | 图表中在报表中呈现的标题\
  \ |\n| `chart-title-field` | String | 表示图表标题的数据源字段 |\n| `title-font` | String |\
  \ 图表标题的字体族、大小和样式 |\n\n## 通用属性\n\n定义为控制图表通用属性的属性集：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n\
  | 3-D | Boolean | 如果设置为 true，则以 3D 透视渲染图表。默认值设置为 false。 |\n| bg-color | String |\
  \ 图表的背景颜色。 |\n| bg-image | String | 图表背景图像的路径。 |\n| show-border | Boolean | 指示是否请求显示整个图表边框的标志。默认值为\
  \ false。 |\n| border-color | String | 图表边框的颜色。 |\n| plot-bg-color | String | 将绘图背景颜色设置为指定颜色。如果未设置，则默认为白色。\
  \ |\n| plot-fg-alpha | Decimal | 设置绘图前景色相对于绘图背景的 alpha 值。默认值设置为 1.0。 |\n| plot-bg-alpha\
  \ | Decimal | 设置绘图背景色相对于图表背景色的 alpha 值。默认值设置为 1.0。 |\n| anti-alias | Boolean | 如果设置为\
  \ true，则以抗锯齿方式渲染图表字体。默认值设置为 true。 |\n\n## 图例属性\n\n定义为控制图表图例的属性集：\n\n| 名称 | 类型 |\
  \ 描述 |\n|---|---|---|\n| show-legend | Flag | 控制图例的显示/隐藏的标志。默认值为 true。 |\n| location\
  \ | Selection | 图例相对于图表的位置。可能的值为：north、west、south、east、top、left、bottom 和 right。\
  \ |\n| legend-bg-color | String | 背景颜色。第 5 章《报表设计器中的设计与布局》中讨论的颜色选择器在此属性中可用。 |\n\
  | legend-border | String | 指示图例边框是否应可见的标志。默认值为 true。 |\n| legend-font | String |\
  \ 图例中使用的字体。 |\n| legend-font-color | String | 字体颜色。第 5 章《报表设计器中的设计与布局》中讨论的颜色选择器在此属性中可用。\
  \ |\n\n## 脚本属性\n\n定义控制图表处理的脚本的属性集：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| Chart Post-Processing\
  \ Script Language | Selection | 字段中使用的脚本语言。可能的值为：`beanshell`、`groovy`、`netrexx`、`javascript`、`xslt`、`jac1`\
  \ 和 `jython`。 |\n| Chart Post-Processing Script | String | 图表渲染后处理的源代码。 |\n\n##\
  \ 条形图\n\n从这里开始，你将看到与不同类型图表相关的所有细节。条形图是第一个，显示按单个类别和系列分解的单个条形。条形图对于比较类别间数据的相对大小很有用。条形图利用分类数据集（之前介绍过），以及前面定义的通用属性。\n\
  \n在以下描述中列出了在可用属性方面的所有差异：\n\n- 在此处引入选项集，具有以下属性：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n\
  | `stacked` | Boolean | 如果设置为 true，系列值将层叠显示，而不是相对显示。 |\n| `stacked-percent` | Boolean\
  \ | 如果设置为 true，则确定每个系列的百分比，并根据这些百分比渲染条形高度。属性 `stacked` 必须设置为 true 才能使此属性生效。 |\n\
  | `horizontal` | Boolean | 如果设置为 true，图表的 x 轴和 y 轴会水平旋转。默认值设置为 false。 |\n| `bar-borders`\
  \ | Boolean | 如果设置为 false，则清除图表边框的默认渲染值。 |\n| `max-bar-width` | Decimal | 条形的最大宽度（以像素为单位）。如果未设置，条形通常会扩展到图表内的可用空间。\
  \ |\n| `series-color` | Array of strings | 渲染每个系列的颜色。第一个系列颜色的默认值已定义，但你可以使用颜色编辑器更改它。\
  \ |\n\n- 在此处引入阴影集，具有以下属性：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `shadow-visible`\
  \ | Boolean | 如果设置为 true，则显示图表的阴影。此值默认为 false。 |\n| `shadow-color` | String | 阴影颜色。\
  \ |\n| `shadow-x-offset` | Integer | x 轴上阴影的距离（以像素为单位）。此值默认为 0。 |\n| `shadow-y-offset`\
  \ | Integer | y 轴上阴影的距离（以像素为单位）。此值默认为 0。 |\n\n- 通用集具有与通用通用集中描述相同的属性，以及以下列出的一些附加属性：\n\
  \n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `gridlines` | Boolean | 如果设置为 true，则显示类别网格线。此值默认为\
  \ true。 |\n| show-plot-border | Boolean | 如果设置为 false，则清除图表边框的默认渲染值。此值默认为 false。\
  \ |\n\n- 在此处引入 X 轴集，具有以下属性：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| x-axis-title |\
  \ String | 设置主要数值数据轴的标题；通常在水平方向图表中为 x 轴。 |\n| x-font | String | x 轴使用的字体。该属性使用字体选择器以提供友好的用户体验。\
  \ |\n| x-tick-font | String | 图表中范围刻度使用的字体。该属性使用字体选择器以提供友好的用户体验。 |\n| x-tick-format\
  \ | String | 用于在图表中显示类别项的标签格式。如果希望显示类别项值，则需要此属性。可以在格式字符串中定义以下参数以访问项的详细信息：0 访问项的系列名称详细信息；1\
  \ 访问项的类别详细信息 2 访问项的值详细信息。 |\n| x-axis-label-width | Decimal | 设置最大类别标签宽度比率，确定每个类别标签应渲染的最大长度。如果类别名称非常长，这可能很有用。不可见的默认值为\
  \ 20.0。如果标签被截断，请尝试增加此值。 |\n| x-axis- |  |  |\n\n\n| label-rotation | Decimal | 如果设置，则调整类别项标签旋转值。值应以度为单位指定。如果未指定，标签将水平渲染。\
  \ |\n|---|---|---|\n| category-margin | Decimal | 如果设置，则以像素为单位调整类别边距。 |\n| lower-margin\
  \ | Decimal | 指定图表中 y 轴与第一个条形之间的空间（以像素为单位）。 |\n| upper-margin | Decimal | 指定最后一个条形与图表外边缘之间的空间（以像素为单位）。\
  \ |\n| item-margin | Decimal | 如果设置，则以像素为单位调整项目边距。 |\n\n- 在此引入 Y 轴设置，具有以下属性：\n\n\
  | 名称 | 类型 | 描述 |\n|---|---|---|\n| y-axis-title | String | 设置主数字数据轴的标题；通常在水平方向图表中为\
  \ y 轴。 |\n| y-font | String | 设置范围轴标题的字体。 |\n| y-sticky-0 | Boolean | 如果范围在轴中包含零，将其设为粘性会在设置为\
  \ true 时强制将轴截断为零。该属性的默认值是 true。 |\n| y-incl-0 | Boolean | 如果设置为 true，范围轴将强制在轴中包含零。\
  \ |\n\n| y-auto-range | Boolean | 如果设置为 true，范围轴将根据内容自动调整。 |\n| y-min | Decimal\
  \ | 在范围轴中渲染的最小值。 |\n| y-max | Decimal | 在范围轴中渲染的最大值。要以该字体渲染范围刻度值。 |\n| y-scale-factor\
  \ | Decimal | 范围轴的缩放因子。 |\n| y-tick-interval | Decimal | 图表中分隔范围刻度的数值间隔。 |\n| y-tick-font\
  \ | String | 用于渲染范围刻度值的字体。 |\n| y-tick-ftm-str | String | 用于渲染数值范围刻度值的 `DecimalFormat`\
  \ 字符串。 |\n| y-tick-period | Selection | 如果 y（范围）数据集返回日期或时间数据，则指定 y 轴刻度间隔。 |\n| enable-log-axis\
  \ | Boolean | 如果设置为 true，则以对数刻度显示 y 轴。 |\n| log-format | Boolean | 如果设置为 true，将以人类可读视图呈现对数刻度。\
  \ |\n\n- 在此引入值设置，具有以下属性：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| show-item-labels\
  \ | Selection | 如果设置为 `Show Labels`，将显示项目标签。 |\n| item-label-font | String | 用于项目标签的字体。\
  \ |\n| item-label-rotation | Decimal | 项目标签旋转角度的度数。可能的值范围为 0 到 360。 |\n| text-format\
  \ | String | 确定域绘图标签的内容。有三个可能的值，可单独或全部使用：0 表示系列名称；1 表示类别；2 表示绘图值。 |\n| numeric-format\
  \ | String | 确定域绘图标签的内容。必须采用 Java 数字格式。 |\n| date-format | String | 确定域绘图标签的内容。必须采用\
  \ Java 日期格式。 |\n| url-formula | Selection | 在下拉菜单中可用的公式，用于确定 URL 情况下域绘图标签的内容。 |\n\
  | tooltip-formula | Selection | 在下拉菜单中可用的公式，用于确定域绘图标签工具提示的内容。 |\n\n## 柱状图示例\n\n\
  要尝试你所学到的关于柱状图的内容，让我们在这里构建一个具体示例以实际操作。从一个空报表开始，正如你在第 4 章 *使用 Report Designer 创建报表*\
  \ 中所学，创建一个 JDBC 数据源，正如你在第 6 章 *配置 JDBC 和其他数据源* 中所见。数据源使用 `SampleData (Local)` 连接，并如以下屏幕截图所示定义：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_364_0.png)\n\n完成后，选择 File | Page Setup\
  \ 并在 Orientation 面板中勾选 Landscape。然后按 OK 按钮并勾选 Do not change the layout 选项。确认后，从报表元素调色板上拖动图表图标并将其放置到\
  \ `Report Header` 频段。拉伸图表元素以覆盖页面的整个宽度，并将元素属性面板中 `size & position` 组中的 `height` 属性设置为\
  \ 450。此设置将为你的图表提供更大的空间，以便在页面上正确显示。\n\n通过双击图表元素，将显示图表编辑窗口，默认选择柱状图类型。将数据集面板中 `Common`\
  \ 组中的 `category-column` 属性设置为 `PRODUCTLINE`，将 `value-columns` 属性设置为 `BUYPRICE`。在属性面板中，将\
  \ `General` 组中的 `3-D` 属性设置为 true，将 `Legend` 组中的 `show-legend` 属性设置为 false，并将 `Values`\
  \ 组中的 `show-item-labels` 属性设置为 Show Labels。然后按 OK 按钮并通过按眼睛 (\U0001F441) 图标预览生成的报表。以下屏幕截图显示了你的第一个柱状图预览的样子：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_365_0.png)\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_365_1.png)\n\
  \n*始终养成自己实验的良好习惯，了解结果图表如何根据一个（或多个）属性的不同值而变化。作为练习，尝试更改一个（或多个）属性并使用预览查看 Pentaho 报表会发生什么。不要担心尝试高级设置，不会发生任何坏事，你只能学习。*\n\
  \n## 折线图\n\n折线图为每个提供的系列在类别之间显示连接线。此图表有助于可视化趋势。折线图利用类别数据集（之前介绍过），以及前面定义的通用属性。以下描述列出了在可用属性方面的所有差异：\n\
  \n- 属性的选项集为此图表类型提供了特定内容：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `line-style` | Selection\
  \ | 设置线系列线的样式。可能的值为：`solid`、`dash`、`dot`、`dashdot` 和 `dashdotdot`。默认值是 `solid`。\
  \ |\n| `line-size` | Decimal | 设置线系列线的宽度。默认值是 `1.0`。 |\n| `show-markers` | Boolean\
  \ | 设置在适用图表中可见的点标记。默认值是 false。 |\n| `horizontal` | Boolean | 如果设置为 true，图表的 x 轴和\
  \ y 轴将水平旋转。默认值设置为 false。 |\n| `series-color` | Array of strings | 十六进制颜色值的逗号分隔列表。颜色按顺序使用，从数据集返回的第一个值开始。\
  \ |\n\n- 通用集具有与柱状图描述相同的属性（通用公共集，以及另外的 `gridlines, show-plot-border`）\n\n- X 轴集具有与柱状图描述相同的属性（不包括\
  \ `item-margin`）\n\n- Y 轴和值集在此也提供了与柱状图描述相同的属性\n\n## 折线图示例\n\n作为示例，让我们重用为柱状图描述的相同数据源。从一个空报表开始，选择\
  \ File | Page Setup 并在 Orientation 面板中勾选 Landscape。然后按 OK 按钮并勾选 Do not change the\
  \ layout 选项。确认后，拖动图表 (\U0001F5BC) 图标并将其放置到 Report Header 频段。拉伸图表元素以覆盖页面的整个宽度，并将元素属性面板中\
  \ size & position 组中的 height 属性设置为 450。\n\n通过双击图表元素，将显示图表编辑窗口。从顶部面板中选择折线图图标，并将数据集面板中\
  \ Common 组中的 category-column 属性设置为 PRODUCTLINE，将 value-columns 属性设置为 BUYPRICE。在属性面板中，将\
  \ Options 组中可用的 show-markers 属性和 horizontal 属性都设置为 true。最后但同样重要的是，将 Legend 组中的 show-legend\
  \ 属性设置为 false，然后按 OK 按钮，然后通过按眼睛 (\U0001F441) 图标预览生成的报表。以下屏幕截图显示了你的第一个折线图预览的样子：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_368_0.png)\n\n\n\n\n## 区域图\n\n区域图将分类数据集显示为一条线，并填充线下方的区域。根据提供的系列数量，可能出现多个区域。区域图有助于可视化两个或多个数据集之间的差异。区域图使用前面介绍过的分类数据集，以及之前定义过的通用属性。以下描述列出了可用属性方面的所有差异：\n\
  \n- 选项属性集提供的属性与条形图所述的属性相同（不包括 `bar-borders` 和 `bar-max-width`）\n- 通用集具有与条形图所述相同的属性（通用公共集，另外还有\
  \ `gridlines`、`show-plot-border`）\n- X 轴、Y 轴和值集在此也提供了与条形图所述相同的属性\n\n### 区域图示例\n\n\
  例如，让我们重用为条形图描述的相同数据源。从空白报表开始，选择 File | Page Setup 并在 Orientation 面板中勾选 Landscape。然后按下\
  \ `ok` 按钮并勾选 Do not change the layout 选项。确认后，拖动图表（\U0001F4CA）图标并将其放置到 `Report Header`\
  \ 频段。将图表元素拉伸以覆盖页面的整个宽度，并在元素属性面板中将 `size & position` 组中的 `height` 属性设置为 `450`。\n\n\
  双击图表元素后，将显示图表编辑窗口。从上部面板选择区域图图标，并在数据集面板的 `Common` 组中直接将 `category-column` 属性设置为 `PRODUCTLINE`，将\
  \ `value-columns` 属性设置为 `QUANTITYINSTOCK, BUYPRICE`。在属性面板中，将 `Legend` 组中的 `show-legend`\
  \ 属性设置为 `false`，并将 `Values` 组中的 `show-item-labels` 属性设置为 `Show Labels`。然后按下 OK 按钮并通过按下眼睛（\U0001F441\
  ️）图标预览生成的报表。以下截图显示了您第一个区域图的预览效果：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_371_0.png)\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_371_1.png)\n\n作为练习，尝试将 value-columns\
  \ 属性的建议顺序从 [QUANTITYINSTOCK, BUYPRICE] 反转为 [BUYPRICE, QUANTITYINSTOCK]。预览报表时，您会看到两个主要变化：最高区域的颜色从橙色变为黄色，且第二个区域（最低的那个）不再可见。这种行为告诉我们值的顺序是相关的，应在报表设计过程中予以考虑。\n\
  \n## 饼图\n\n饼图显示一个切片的、多彩的饼图，其各个切片由各个系列信息组成。饼图使用前面介绍过的饼数据集，以及之前定义过的通用属性。以下描述列出了可用属性方面的所有差异：\n\
  \n- 所需属性集为此图表类型提供了几个额外的属性：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n\
  | `ignore-nulls` | Boolean | 指定是否应在图表中引用不存在的数据点。默认值是 true。 |\n| `ignore-zeros` |\
  \ Boolean | 指定是否应将零值数据引用到图表中。默认值是 true。 |\n\n- 选项属性集为此图表类型提供了特定内容：\n\n| 名称 | 类型\
  \ | 描述 |\n|------|------|-------------|\n| `slice-colors` | Array of strings | 十六进制颜色值的逗号分隔列表。颜色按顺序使用，从数据集返回的第一个值开始。\
  \ |\n| `show-labels` | Selection | 定义是否应显示与图表值对应的标签。定义了两个可能的值：`Show Labels` 和 `Hide\
  \ Labels`。默认值是 `Hide Labels`。 |\n| `label-font` | String | 设置饼图各部分标签的字体。 |\n| `label-format`\
  \ | String | 确定域绘图标签的内容。有三个可能的值，可单独或全部使用：0 表示系列名称；1 表示值；2 表示百分比值。 |\n| `rotate-clockwise`\
  \ | Boolean | 指定数据集返回的值是按从左到右（顺时针）还是从右到左（逆时针）排序。默认值为 true（顺时针）。 |\n| `explode-slice`\
  \ | String | 要在饼图中引爆的系列名称列表。饼切片在 3D 饼图上不会引爆。可能的值为整数，表示您的数据集返回的数据点，从零开始。 |\n| `explode-pct`\
  \ | Decimal | 表示您希望扩展图表半径的百分比的小数值，以便为引爆的饼块腾出空间。值越大，块被引爆得越远。可能的值在 0.0 到 100.0 之间。\
  \ |\n\n- 通用属性集提供了一些额外的属性：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n|\
  \ `shadow-paint` | String | 图表阴影的颜色；这是图表后面的区域。按下 ... 按钮以显示可用颜色。 |\n| `shadow-x-offset`\
  \ `shadow-y-offset` | Decimal | 相对于图表的背景阴影坐标。允许负值。 |\n| `url-formula` | String |\
  \ 将链接关联到系列键和类别名称。 |\n| `tooltip-formula` | String | 定义 `url-formula` 的工具提示（悬停文本）。\
  \ |\n\n- 图例属性集提供了一些额外的属性：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n|\
  \ `legend-label-format` | String | 确定图例标签的内容。有三个可能的值，可单独或全部使用：0 表示系列名称；1 表示值；2 表示百分比值。\
  \ |\n\n### 饼图示例\n\n例如，让我们重用为条形图描述的相同数据源。从空白报表开始，选择 File | Page Setup 并在 Orientation\
  \ 面板中勾选 Landscape。然后按下 OK 按钮并勾选 Do not change the layout 选项。确认后，拖动图表（\U0001F4CA\
  ）图标并将其放置到 `Report Header` 频段。将图表元素拉伸以覆盖页面的整个宽度，并在元素属性面板中将 `size & position` 组中的\
  \ `height` 属性设置为 `450`。\n\n双击图表元素后，将显示图表编辑窗口。从上部面板选择饼图图标，并在数据集面板中直接将 `value-column`\
  \ 属性设置为 `BUYPRICE`，将 `series-by-field` 属性设置为 `PRODUCTLINE`。在属性面板中，将 `Legend` 组中的\
  \ `location` 属性设置为 `left`，并将 `General` 组中的 `3-D` 属性设置为 `true`。然后按下 OK 按钮并通过按下眼睛（\U0001F441\
  ️）图标预览生成的报表。以下截图显示了您第一个饼图的预览效果：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_375_0.png)\n\
  \n## 多饼图\n\n多饼图基于分类数据集渲染一组饼图。此元图表将各个系列数据渲染为饼图，每个饼图在各个饼图内按各个类别细分。饼图使用前面介绍过的分类数据集，以及之前定义过的通用属性。以下描述列出了可用属性方面的所有差异：\n\
  \n- 标题属性集提供了一个额外的属性：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n| `pie-title-font`\
  \ | String | 设置图表的饼图标题字体 |\n\n- 选项属性集为此图表类型提供了特定内容：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n\
  | `by-row` | Boolean | 切换类别和系列结果集。默认值是 true。 |\n| `series-color` | Array of strings\
  \ | 十六进制颜色值的逗号分隔列表。颜色按顺序使用，从数据集返回的第一个值开始。 |\n| `show-labels` | Selection | 定义是否应显示与图表值对应的标签。定义了两个可能的值：`Show\
  \ Labels` 和 `Hide Labels`。默认值是 `Hide Labels`。 |\n\n\n\n\n|  |  | 标签 |\n|---|---|---|\n\
  | `label-font` | String | 设置饼图各部分标签的字体。 |\n| `label-format` | String | 确定域图标签的内容。可使用以下三种可能值中的任意一种或全部：0\
  \ 表示系列名称；1 表示值；2 表示百分比值。 |\n| `pie-no-data-message` | String | 如果饼图没有数据时显示的消息。 |\n\
  \n- 通用集具有与饼图所述相同的属性（通用公共集以及 `shadow-paint`、`shadow-x-offset`、`shadow-y-offset`、`url-formula`\
  \ 和 `tooltip-formula` 另外）\n- 图例集具有与饼图所述相同的属性（图例公共集以及 `legend-label-format` 另外）\n\
  \n## 多饼图示例\n\n例如，让我们重用为条形图描述的相同数据源。从空白报表开始，选择 文件 | 页面设置 并在方向面板中勾选 横向。然后按 确定 按钮并勾选\
  \ 不要更改布局 选项。确认后，拖动图表（\U0001F4CA）图标并将其放置到 `Report Header` 频带中。将图表元素拉伸以覆盖页面的整个宽度，并将元素属性面板中\
  \ `size & position` 组中的 `height` 属性设置为 `450`。\n\n通过双击图表元素，将显示图表编辑窗口。从上部面板中选择区域图表图标，并在数据集面板中直接将\
  \ `category-column` 属性设置为 `PRODUCTVENDOR`，将 `value-columns` 属性设置为 `BUYPRICE`，并将\
  \ `series-by-field` 属性设置为 `[PRODUCTLINE]`。在属性面板中，在 `Legend` 组中将 `show-legend` 属性设置为\
  \ false，并在 `Options` 组中将 `label-format` 属性设置为 `{0}`。然后按 确定 按钮并通过按眼睛（\U0001F441️）图标预览生成的报表。以下屏幕截图显示了您第一个饼图的预览效果如下：\n\
  \n### 摩托车\n### 经典汽车\n### 卡车和公共汽车\n### 复古汽车\n### 飞机\n### 船舶\n### 火车\n\n在标签方面，结果并不理想，但它让您了解使用多饼图可以涵盖的潜在用例。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_379_0.png)\n\n## 柱线图\n\n柱线图结合了柱状图和折线图，允许以分类方式可视化趋势并进行比较。柱线图的独特之处在于它需要两个分类数据集来填充图表：第一个数据集填充柱状图，第二个数据集填充折线图。\n\
  \n> *请注意，柱线图是两个激活数据集面板中名为 Secondary DataSource 的第二个选项卡的图表类型之一。名为 Primary DataSource\
  \ 的选项卡控制柱状图数据集，而名为 Secondary DataSource 的选项卡控制折线图数据集。*\n\n柱线图使用前面定义的通用属性，包括分类数据集属性。此图表还继承了柱状图和折线图的属性。以下描述列出了可用属性方面的所有差异：\n\
  \n- 柱形选项集定义了与柱状图选项集中所述相同的属性，并增加了一个属性：`ctgry-tick-font`（string），定义图表中范围刻度使用的字体\n\
  - 折线选项集定义了与折线图选项集中所述相同的属性，但存在一些差异，描述如下：\n  - 此处不可用水平属性\n  - `series-color` 重命名为\
  \ `line-series-color`。如果未定义，`line-series-color` 使用柱形选项集中的 `series-color` 属性\n  -\
  \ `lines-label-font`（string）定义折线标签使用的字体\n- 通用集具有与柱状图所述相同的属性（通用公共集，以及 `gridlines`\
  \ 和 `show-plot-border` 另外）\n- 阴影、x 轴和 y 轴集在此处也提供，其属性与柱状图所述相同\n\n- 在此引入 Y2 轴集，具有以下属性：\n\
  \n| Name | Type | Description |\n|---|---|---|\n| y2-same-as-y-axis | Boolean |\
  \ 将 Y2 轴（右侧轴）设置为与 Y1（左侧）轴相同的刻度间隔。 |\n| y2-axis-title | String | 设置 Y2（右侧）数值数据轴的标题。\
  \ |\n| y2-font | String | 设置 Y2（右侧）轴标题的字体。 |\n| y2-sticky-0 | Boolean | 如果 Y2（右侧）轴的范围包含零，使其粘性将强制截断轴至零，如果设置为\
  \ true。 此属性的默认值是 true。 |\n| y2-incl-0 | Boolean | 如果设置为 true，Y2（右侧）轴将强制包含零在轴中。 |\n\
  | y2-auto-range | Boolean | 如果设置为 true，Y2（右侧）轴将根据内容自动调整。 |\n| y2-min | Decimal |\
  \ Y2（右侧）轴中要渲染的最小值。 |\n| y2-max | Decimal | Y2（右侧）轴中要渲染的最大值。 |\n| y2-tick-interval\
  \ | Decimal | 在图表中分隔 Y2（右侧）刻度的数值间隔值。 |\n\n| y2-tick-font | String | Y2（右侧）轴的范围刻度值的渲染字体。\
  \ |\n| y2-tick-fmt-str | String | Y2（右侧）轴的数值范围刻度值的 DecimalFormat 字符串。 |\n| y2-tick-period\
  \ | Selection | 如果 Y2（范围）数据集返回日期或时间数据，则指定 Y2（右侧）轴刻度间隔。 |\n\n- 值集具有与柱状图所述相同的属性，其中使用\
  \ `show-label`（具有相同的含义、类型、值和行为）代替 `show-item-labels`\n\n## 柱线图示例\n\n例如，让我们重用为条形图描述的相同数据源。从空白报表开始，选择\
  \ 文件 | 页面设置 并在方向面板中勾选 横向。然后按 确定 按钮并勾选 不要更改布局 选项。确认后，拖动图表图标并将其放置到 Report Header 频带中。将图表元素拉伸以覆盖页面的整个宽度，并将元素属性面板中\
  \ size & position 组的 height 属性设置为 450。\n\n通过双击图表元素，将显示图表编辑窗口。从上部面板中选择柱线图图标，并在数据集面板的\
  \ Common 组中直接将 category-column 属性设置为 PRODUCTLINE 并将 value-columns 属性设置为 BUYPRICE。现在按\
  \ Secondary DataSource 选项卡并再次将 category-column 属性设置为 PRODUCTLINE，将 value-columns\
  \ 属性设置为 QUANTITYINSTOCK。在属性面板中，在 Line Options 组中将 line-series-color 属性设置为 [#2a0cd0]，在\
  \ Legend 组中将 show-legend 属性设置为 false，并在 Values 组中将 show-labels 属性设置为 Show Labels。然后按\
  \ 确定 按钮并通过按眼睛图标预览生成的报表。以下屏幕截图显示了您第一个柱线图的预览效果如下：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_384_0.png)\n\
  \n## 环形图\n\n环形图与饼图相同，只是它以环形而非完整的饼形渲染。除了共享与饼图相似的所有属性外，它还在选项集中定义了 `section-depth`\
  \ 属性（decimal）。\n\n`section-depth` 属性定义环形图将填充圆形的百分比。值越大，环形中心空间越少。可能的值在 0.1 到 1 之间，其中\
  \ 1 等同于饼图。\n\n## 环形图示例\n\n例如，让我们重用为条形图描述的相同数据源。从空白报表开始，将方向更改为横向并按前面的示例设置图表元素。\n\n\
  通过双击图表元素，将显示图表编辑窗口。从上部面板中选择环形图图标，并在数据集面板中直接将 `value-column` 属性设置为 `BUYPRICE` 并将\
  \ `series-by-field` 属性设置为 `PRODUCTLINE`。在属性面板中，将 `Legend` 组中的 `show-legend` 属性设置为\
  \ false，将 `section-depth` 属性设置为 0.4，并将 `label-format` 设置为 `{0} - {2}`（两者都在 `Options`\
  \ 组中）。然后按 确定 按钮并通过按眼睛（\U0001F441）图标预览生成的报表。以下屏幕截图显示了您第一个环形图的预览效果如下：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_386_0.png)\n\
  \n\n\n## 气泡图\n\n气泡图允许您查看数据的三个维度。前两个维度是传统的 x 和 y 维度，也称为域和范围。第三个维度通过渲染的各个气泡的大小来表示。气泡图使用之前定义过的通用属性，包括\
  \ XYZ 系列数据集属性。以下描述列出了在可用属性方面的所有差异：\n\n- 属性的标题集提供了一个额外的属性：\n- 选项属性集提供了之前介绍的一些属性：`horizontal`、`series-color`\
  \ 和 `label-font`。此外，还有 `max-bubble-size` 属性（十进制），定义首选最大气泡大小，作为所代表气泡值的百分比。可能的值为 1\
  \ 到 100 之间的整数。\n- 通用集具有与饼图描述相同的属性（通用通用集，以及 `shadow-paint`、`shadow-x-offset`、`shadow-y-offset`、`url-formula`\
  \ 和 `tooltip-formula`）。\n- X 轴和 y 轴集在此也提供，与条形图描述的属性相同。\n- 值集具有条形图描述的属性的子集（特别是：`show-item-labels`、`item-label-font`、`url-formula`\
  \ 和 `tooltip-formula`）。\n- 图例集具有与饼图描述相同的属性（图例通用集以及 `legend-label-format`）。\n\n|\
  \ 名称 | 类型 | 描述 |\n|------|------|-------------|\n| `pos-title` | Selection | 设置显示图表标题的位置。可能的值为：north,\
  \ west, south, east, top, left, bottom 和 right |\n\n### 气泡图示例\n\n例如，让我们重用为条形图描述的相同数据源。从空白报表开始，将方向更改为横向，并按前面的示例所述设置图表元素。\n\
  \n通过双击图表元素，将显示图表编辑窗口。从上部面板选择气泡图图标，并在数据集面板中直接将 `x-value-columns` 属性设置为 `BUYPRICE`，将\
  \ `y-value-columns` 和 `z-value-columns` 属性设置为 `QUANTITYINSTOCK`，并将 `series-by-field`\
  \ 属性设置为 `PRODUCTLINE`。在属性面板中，将 `max-bubble-size` 属性（在 `Options` 组中）设置为 `100`，然后按\
  \ OK 按钮并通过按眼睛（\U0001F441️）图标预览生成的报表。以下屏幕截图显示了您第一个气泡图的预览效果：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_388_0.png)\n\
  \n## 散点图\n\n散点图将系列中的所有项目作为点渲染在图表中。此图表类型使用之前定义的通用属性，默认包括 XY 系列数据集属性。作为替代数据集，您也可以选择使用\
  \ XYZ 系列数据集或时间序列数据集。您可以使用 Primary DataSource 选项卡上部下拉菜单更改数据集。关于可用属性，以下描述列出了与本章开头介绍的通用列表的所有差异：\n\
  \n- 属性的标题集提供了与气泡图描述相同的属性（标题通用集以及 `pos-title`）。\n- 选项属性集提供了之前介绍的一些属性：`stacked`、`horizontal`\
  \ 和 `series-color`。此外还提供了 `dot-height` 和 `dot-width` 属性（整数），它们定义表示系列点的标记的高度/宽度（以像素为单位）。\n\
  - 通用集具有与通用集描述相同的属性，此外还具有 `show-plot-border` 和 `label-font`（请参阅条形图了解其定义）。\n- X 轴和\
  \ y 轴集在此也提供，与条形图描述的属性相同。\n- 值集具有条形图描述的属性的子集（更详细地说：`show-item-labels`、`item-label-font`、`url-formula`\
  \ 和 `tooltip-formula`）。\n\n### 散点图示例\n\n例如，即使对于这种情况并不完美，让我们重用为条形图介绍的相同数据源。从空白报表开始，将方向更改为横向，并按前面的示例所述设置图表元素。\n\
  \n通过双击图表元素，将显示图表编辑窗口。从上部面板选择散点图图标，并在数据集面板中直接将 `x-value-columns` 属性设置为 `BUYPRICE`，将\
  \ `y-value-columns` 属性设置为 `QUANTITYINSTOCK`，并将 `series-by-field` 属性设置为 `PRODUCTLINE`。然后按\
  \ OK 按钮并通过按眼睛（\U0001F441）图标预览生成的报表。以下屏幕截图显示了您第一个散点图的预览效果：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_390_0.png)\n\
  \n## XY 条形图、XY 折线图和 XY 面积图\n\nXY 条形图、XY 折线图和 XY 面积图将 XY 系列数据集绘制为条形图、折线图或面积图。这些图表类型使用之前定义的通用属性，默认包括\
  \ XY 系列数据集属性。作为替代数据集，您也可以选择使用 XYZ 系列数据集或时间序列数据集。您可以使用 Primary DataSource 选项卡上部下拉菜单更改数据集。\n\
  \n关于 XY 条形图的可用属性，以下描述列出了与本章开头介绍的通用列表的所有差异：\n\n- 标题集具有与气泡图描述相同的属性（标题通用集以及 `pos-title`）\n\
  - 选项集具有与条形图描述相同的属性，但不包括 `max-bar-width`\n- 通用集具有与条形图描述相同的属性，但不包括 `gridlines`\n-\
  \ 阴影集具有与条形图描述相同的属性，但不包括 `shadow-color`\n- X 轴集由不同的属性组成，如下所示：\n\n| 名称 | 类型 | 描述 |\n\
  |---|---|---|\n| `x-axis-title` | String | 设置域轴的标题（如果存在）。在典型的二维水平图表中，这是分类轴或 x 轴。\
  \ |\n| `x-font` | String | 设置范围轴标题的字体。 |\n|  |  |  |\n\n| 属性 | 类型 | 描述 |\n|---|---|---|\n\
  | `x-sticky-0` | Boolean | 如果范围包含轴中的零，使其粘性将强制轴在设置为 true 时截断到零。此属性的默认值是 true。 |\n\
  | `x-incl-0` | Boolean | 如果设置为 true，范围轴将强制包含零在轴中。 |\n| `x-auto-range` | Boolean\
  \ | 如果设置为 true，范围轴将根据内容自动调整。 |\n| `x-min` | Decimal | 在范围轴中渲染的最小值。 |\n| `x-max`\
  \ | Decimal | 在范围轴中渲染的最大值。 |\n| `x-tick-interval` | Decimal | 在图表中分隔范围刻度的数值间隔。 |\n\
  | `x-vtick-label` | Boolean | 设置域轴上刻度标签的方向；垂直为 true，水平为 false。默认值为 false。 |\n| `x-tick-font`\
  \ | String | 渲染范围刻度值的字体。 |\n| `x-tick-ftm-str` | String | 渲染数值范围刻度值的 `DecimalFormat`\
  \ 字符串。 |\n| `x-tick-period` | Selection | 如果 x（范围）数据集返回日期或时间数据，则指定 x 轴刻度间隔。 |\n\n\
  - Y 轴集具有与条形图描述相同的属性，但不包括 `y-scale-factor`\n- 值集是条形图描述的属性的子集，仅限于 `show-item-labels`、`item-label-font`、`url-formula`\
  \ 和 `tooltip-formula`\n\n关于 XY 折线图的可用属性，以下描述列出了与本章开头介绍的通用列表的所有差异：\n\n- 标题集具有与气泡图描述相同的属性（标题通用集以及\
  \ `pos-title`）\n- 选项集具有与折线图描述相同的属性，但不包括 `show-markers` 并包括 `stacked`（在条形图的选项组中引入）\n\
  - 通用集具有与条形图描述相同的属性，但不包括 `gridlines`\n- X 轴集具有与 XY 条形图描述相同的属性\n- Y 轴集具有与条形图描述相同的属性，但不包括\
  \ `y-scale-factor`\n- 值集是条形图描述的属性的子集，仅限于 `show-item-labels`、`item-label-font`、`url-formula`\
  \ 和 `tooltip-formula`\n\n关于 XY 面积图的可用属性，以下描述列出了与本章开头介绍的通用列表的所有差异：\n\n- 标题集具有与气泡图描述相同的属性（标题通用集以及\
  \ `pos-title`）\n- 选项集具有与条形图描述相同的属性，但不包括 `stacked-percent` 并包括 `stacked`（在条形图的选项组中引入）、`line-style`、`line-size`\
  \ 和 `show-markers`（在折线图的选项组中引入）\n- 通用集具有与条形图描述相同的属性，但不包括 `gridlines`\n- X 轴集具有与\
  \ XY 条形图描述相同的属性\n- Y 轴集具有与条形图描述相同的属性，但不包括 `y-scale-factor`\n- 值集是条形图描述的属性的子集，仅限于\
  \ `show-item-labels`、`item-label-font`、`url-formula` 和 `tooltip-formula`\n\n\n\n\
  \n## XY 柱状图、XY 折线图和 XY 面积图示例\n\n例如，即使对于本例来说并不完美，让我们重用为柱状图介绍的相同数据源。从空白报表开始，将方向更改为横向，并按前例所述设置图表元素。\n\
  \n通过双击图表元素，将显示图表编辑窗口。从上部面板中选择 XY 柱状图图标，并在数据集面板中直接将 x-value-columns 属性设为 BUYPRICE，将\
  \ y-value-columns 属性设为 QUANTITYINSTOCK，将 series-by-field 属性设为 PRODUCTLINE。在属性面板中，将\
  \ stacked 属性（在 Options 组中）设为 true，然后按 OK 按钮并通过按眼睛（\U0001F441）图标预览生成的报表。以下屏幕截图显示了您第一个\
  \ XY 柱状图预览的样子：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_395_0.png)\n\n现在再次编辑图表元素，并将图表类型从\
  \ XY 柱状图更改为 XY 折线图（从上部面板中选择代表目标图表类型的图标）。按 OK 按钮并使用眼睛（\U0001F441️）图标预览生成的报表。以下屏幕截图显示了您第一个\
  \ XY 折线图预览的样子：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_396_0.png)\n\n作为最后一个示例，再次编辑图表元素，并将图表类型从\
  \ XY 折线图更改为 XY 面积图（从上部面板中选择代表目标图表类型的图标）。在属性面板中，将 stacked 属性（在 options 组中）设为 false，然后按\
  \ OK 按钮并通过按眼睛（\U0001F441）图标预览生成的报表。以下屏幕截图显示了您第一个 XY 面积图预览的样子：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_397_0.png)\n\
  \n使用示例查询生成的图表并不理想，但它们足以实现我们展示 Jaspersoft Reporting 技术设置和行为的目标。如果您能在您的数据或 SampleData\
  \ 数据库上定义更好的查询以获得更吸引人的结果，这将是一个很好的练习。\n\n## 扩展 XY 折线图\n\n扩展 XY 折线图允许渲染三种额外的图表类型：阶梯面积图、阶梯图和差异图。阶梯图表类型将\
  \ XY 系列数据集显示为一组阶梯，而差异图渲染两个 XY 系列并突出显示两者之间的差异。这些图表类型使用前面定义的标准属性，包括 XY 系列数据集属性作为默认值。作为替代数据集，您也可以选择使用\
  \ XYZ 系列数据集或时间序列数据集。您可以使用 Primary DataSource 选项卡上部下拉菜单更改数据集。\n\n关于扩展 XY 折线图可用的属性，以下描述列出了与本章开头介绍的标准列表的所有差异：\n\
  \n- 标题集具有与气泡图所述相同的属性（标题通用集以及 `pos-title`）\n- 选项集具有与折线图所述相同的属性，包括 `ext-chart-type`（可能的值为\
  \ `StepChart`、`StepAreaChart` 和 `DifferenceChart`）和 `stacked`（在柱状图的选项组中引入）\n- 通用集具有与柱状图所述相同的属性，排除\
  \ `gridlines`\n- X 轴集具有与 XY 柱状图所述相同的属性\n- Y 轴集具有与柱状图所述相同的属性，排除 `y-scale-factor`\n\
  - 值集是柱状图所述属性的子集，仅限于 `show-item-labels`、`item-label-font`、`url-formula` 和 `tooltip-formula`\n\
  \n## 扩展 XY 折线图示例\n\n例如，从上一个示例（XY 柱状图、XY 折线图或 XY 面积图）开始并编辑图表元素，将图表类型更改为扩展 XY 折线图（从上部面板中选择代表目标图表类型的图标）。在属性面板中，将\
  \ `ext-chart-type` 属性（在 `Options` 组中）设为 `StepChart` 并按 OK 按钮。然后使用眼睛（\U0001F441）图标预览生成的报表。以下屏幕截图显示了您第一个扩展\
  \ XY 折线图预览的样子：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_399_0.png)\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_399_1.png)\n\
  \n*通过将 `ext-chart-type` 属性（在 `Options` 组中）的值更改为 `StepAreaChart` 重复此练习，然后预览。稍后，将值更改为\
  \ `DifferenceChart` 并再次预览。此外，在这些情况下，您也可以通过在您的数据上或直接在 `SampleData` 数据库上定义更好的查询来获得更吸引人的结果。*\n\
  \n## 瀑布图\n\n瀑布图显示一个跨越类别的独特堆叠柱状图。此图表在比较类别彼此之间时很有用。瀑布图中的最后一个类别通常等于所有其他类别的总和以适当渲染，但这基于数据集，而不是图表渲染。以下描述列出了可用属性方面的所有差异：\n\
  \n- 选项集具有柱状图所述属性的子集，仅限于 `horizontal` 和 `series-color`\n- X 轴集具有与柱状图所述相同的属性，排除 `item-margin`\n\
  - 通用、y 轴和值集具有与柱状图所述相同的属性\n\n## 瀑布图示例\n\n例如，让我们重用为柱状图介绍的相同数据源。从空白报表开始，将方向更改为横向，并按前例所述设置图表元素。\n\
  \n通过双击图表元素，将显示图表编辑窗口。从上部面板中选择瀑布柱状图图标，并在数据集面板中直接将 `category-column` 属性设为 `PRODUCTLINE`，将\
  \ `value-columns` 属性设为 `BUYPRICE`。在属性面板中，将 `show-legend` 属性（在 `Legend` 组中）设为 false，并将\
  \ `show-item-labels` 属性（在 `Values` 组中）设为 `Show Labels`。然后按 OK 按钮并通过按眼睛（\U0001F441\
  ️）图标预览生成的报表。以下屏幕截图显示了您第一个瀑布图预览的样子：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_402_0.png)\n\
  \n## 雷达图\n\n雷达图渲染一个类似网络的图表，显示分类数据集。雷达图使用分类数据集（之前介绍过），以及前面定义的标准属性。以下描述列出了可用属性方面的所有差异：\n\
  \n- 属性的选项集提供了以下属性：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `line-width` | Decimal\
  \ | 设置线系列线的宽度。默认值是 2.0。 |\n| `head-size` | Decimal | 在值线和网格线与分类网格线相交处绘制的椭圆的大小。 |\n\
  | `series-color` | Array of strings | 按顺序应用于图表中系列的颜色列表。 |\n| `gridline-interval`\
  \ | Percentage | 确定绘制多少条网格线，以线间距计。例如，20% 将显示 5 条网格线，10% 将显示 10 条网格线。默认值为 25.0% 或四条线。\
  \ |\n| `radar-web-filled` | Boolean | 确定网络层是否用纯色填充或保留为轮廓。 |\n\n- 通用集具有与通用通用集所述相同的属性，并具有以下附加属性：`url-formula`、`tooltip-formula`（来自柱状图中的值集）和\
  \ `gridlines`（来自柱状图中的通用集）\n- 此处引入了 Items 集，具有以下属性：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n\
  | `label-font` | String | 设置项目标签的字体 |\n\n\n\n## 雷达图示例\n\n例如，从之前的示例（瀑布图）开始，通过更改图表元素的图表类型为雷达图（从上方面板中选择代表目标图表类型的图标）来编辑图表元素。然后按下\
  \ OK 按钮，并使用眼睛（\U0001F441️）图标预览生成的报表。以下截图显示了您第一个雷达图的预览效果：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_405_0.png)\n\
  \n## XY 面积线图\n\nXY 面积线图结合了 XY 面积图和 XY 线图，允许可视化趋势以及进行比较。XY 面积线图的特点是需要两个 XY 系列数据集来填充图表：第一个数据集填充\
  \ XY 面积图，第二个数据集填充 XY 线图。与您在条形线图中看到的一样，在这种情况下，主数据源选项卡和次数据源选项卡也都可用。\n\nXY 面积线图使用前面定义过的通用属性，包括\
  \ XY 系列数据集属性。该图表还继承了 XY 面积图和 XY 线图的属性。以下描述列出了在可用属性方面的所有差异：\n\n- 标题集具有与 XY 条形图所述相同的属性（标题通用集以及\
  \ `pos-title`）。\n- 选项集具有与条形图所述相同的属性，但不包括 `max-bar-width`。\n- 线选项集由不同的属性组成，介绍如下：\n\
  \n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `line-series-color` | Array of string | 按顺序应用于图表中线系列的颜色列表\
  \ |\n| `lines-label-font` | String | 指定每个数据点上方标签的字体 |\n| `line-tick-fmt` | String\
  \ | 指定用于渲染线轴标签的 Java `DecimalFormat` 字符串 |\n| `line-tick-font` | String | 定义渲染线轴标签时使用的\
  \ Java 字体 |\n\n- 通用集具有与条形图所述相同的属性，但不包括 `gridlines`。\n- 值集是条形图所述属性的子集，仅限于 `show-item-labels`、`item-label-font`、`url-formula`\
  \ 和 `tooltip-formula`。\n- *X* 轴集具有与 XY 面积图所述相同的属性。\n- *Y* 轴集具有与条形图所述相同的属性，但不包括 `y-scale-factor`、`enable-log-axis`\
  \ 和 `log-format`，但包括 `y-vtick-label` 属性（十进制），定义 *y* 轴上刻度标签的方向；垂直为 true，水平为 false。默认值为\
  \ false。\n- *Y2* 轴集具有与条形线图所述相同的属性，但不包括 `y2-tick-fmt-str` 属性。\n\n## 温度计图表\n\n温度计图表以其名称所描述的明显格式显示单个值。温度计是众所周知的“交通灯”指示器的变体，如果您需要快速显示单个数字是否在范围内，则很有用。温度计图表使用温度计数据集（之前已介绍），以及前面定义的通用属性。以下描述列出了在可用属性方面的所有差异：\n\
  \n- 选项集由不同的属性组成，介绍如下：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `show-labels` | Selection\
  \ | 定义是否应显示与图表值对应的标签。定义了两个可能的值：`Show Labels` 和 `Hide Labels`。默认值是 `Hide Labels`。\
  \ |\n| `label-fonts` | String | 设置标签的字体。 |\n| `bulbRadius` | Integer | 温度计灯泡的半径。\
  \ |\n| `columnRadius` | Integer | 温度计柱的半径。 |\n| `thermometerUnits` | Selection |\
  \ 可能的选项为 `None`、`Fahrenheit`、`Celsius` 和 `Kelvin`。默认值为 `None`。 |\n| `criticalRangeHigh`\
  \ | Integer | 可能值的上限。 |\n| `criticalRangeLow` | Integer | 定义为临界的值的下限。 |\n| `criticalRangeColor`\
  \ | String | 如果值处于临界范围内，水银的颜色。可以在此属性中使用第 5 章 *Design and Layout in Report Designer*\
  \ 中讨论的颜色选择器。 |\n| `warningRangeHigh` | Integer | 处于警告范围内的值的上限。 |\n| `warningRangeLow`\
  \ | Integer | 处于警告范围内的值的下限。 |\n| `warningRangeColor` | String | 如果值处于警告范围内，水银的颜色。可以在此属性中使用第\
  \ 5 章 *Design and Layout in Report Designer* 中讨论的颜色选择器。 |\n| `normalRangeHigh` |\
  \ Integer | 处于正常范围内的值的上限。 |\n| `normalRangeLow` | Integer | 可能值的下限。 |\n| `normalRangeColor`\
  \ | String | 如果值处于正常范围内，水银的颜色。可以在此属性中使用第 5 章 *Design and Layout in Report Designer*\
  \ 中讨论的颜色选择器。 |\n| `thermometerPaint` | String | 温度计的颜色。可以在此属性中使用第 5 章 *Design and\
  \ Layout in Report Designer* 中讨论的颜色选择器。 |\n| `mercuryPaint` | String | 水银的默认颜色。可以在此属性中使用第\
  \ 5 章 *Design and Layout in Report Designer* 中讨论的颜色选择器。 |\n\n## 温度计图表示例\n\n例如，让我们重用为条形图引入的相同数据源。从空白报表开始，将方向更改为横向，并按前面示例所述设置图表元素。\n\
  \n通过双击图表元素，将显示图表编辑窗口。从上方面板中选择温度计图表图标，并在数据集面板中直接将 value-column 属性设置为 BUYPRICE。在属性面板中，在\
  \ Options 组中，将 criticalRangeHigh 设置为 10000，将 criticalRangeLow 设置为 75000，将 warningRangeHigh\
  \ 设置为 7500，将 warningRangeLow 设置为 3000，并将 normalRangeHigh 设置为 3000。然后按下 OK 按钮并通过按眼睛（\U0001F441\
  ）图标预览生成的报表。以下截图显示了您第一个温度计图表的预览效果：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_411_0.png)\n\
  \n## 在报表中包含迷你图\n\n如果您需要在少量相关数值数据点之间显示趋势，迷你图可能很合适。与图表不同且主要用于标题或分组频带，迷你图通常用于 Pentaho\
  \ 报表的详细信息中，当然如果这样做有意义的话。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_412_0.png)\n\
  \n> *迷你图需要以逗号分隔的值作为输入，因此如果您的数据不是这种格式，您必须创建一个函数从数据源中提取数据并在每个数据点之间放置逗号。*\n\nPentaho\
  \ Reporting 提供了三种不同的迷你图：`bar-sparkline` 由图标表示，`line-sparkline` 由图标表示，以及 `pie-sparkline`\
  \ 由图标表示。如常，要使用迷你图，请从 Report Designer 调色板中拖动图标并将其放置在您想要查看图表的位置。所有配置和设置都可以通过元素属性面板进行管理，正如您在第\
  \ 5 章 *Design and Layout in Report Designer* 中看到的那样，在专门介绍 `bar-sparkline`、`line-sparkline`\
  \ 和 `pie-sparkline` 元素的部分。\n\n## 摘要\n\n在本章中，您学习了如何在报表中以多种不同的方式集成许多图表类型。您学习了如何配置图表的数据集以及如何自定义报表中每种图表类型的外观。您学习了如何填充分类系列数据集、饼图数据集、XY（和\
  \ XYZ）系列数据集、时间序列数据集和温度计数据集。您详细了解了 17 种不同图表类型的数十个属性。您还学习了如何在报表中包含静态和动态图像以及迷你图。\n\n\
  现在您已经阅读了本章，您应该对 Pentaho Report Designer 提供的所有渲染图表（以及图形）的所有方式感到自如。这是在开发复杂的 Pentaho\
  \ 报表时的一项高级任务，使您成为处理实际用例的专家。\n\n在下一章中，您将了解有关 Pentaho 报表中参数化、函数、变量和公式的更多信息。\n\n\n\n\
  ## 参数化、函数、变量和公式\n\n在前几章中，您学习了 Pentaho Report Designer、布局和设计，并了解了可用的元素和不同类型的数据源。在本章中，您将首先学习如何参数化报表。随后您将学习报表中可用的所有预定义函数和表达式。从那里开始，您将学习\
  \ Pentaho Reporting 的环境变量和公式功能，包括正确的语法和可用的公式方法。\n\n本章作为开发人员和信息技术人员的参考手册编写。目标是分享\
  \ Pentaho Report Designer 中可用的关于参数化、函数、变量和公式的所有相关和高级功能。\n\n### 报表参数化\n\n报表参数化允许最终用户通过输入限制报表数据集或触发渲染决策的值来自定义\
  \ Pentaho 报表的結果。\n\n报表参数化对于通过用户界面开发用户筛选也很有用。\n\n在以下各节中，您将了解如何使用报表参数化，熟悉所有不同类型的报表参数，并学习如何使用\
  \ Pentaho Report Designer 创建和使用它们。在描述报表参数的创建和使用的过程中，将会呈现一个关于报表筛选器的实际示例。\n\n### 使用报表参数\n\
  \n如第 6 章 *Configuring JDBC and Other Data Sources* 中所述，为 Pentaho Reporting 提供数据有许多不同的选项。它们都归类在\
  \ *data sources* 名称下，每种不同类型的数据源都有其自己的功能、语法和使用原因。\n\n由于语法和功能不同，每种数据源类型使用其底层方法来参数化查询。例如，XPath、Kettle\
  \ 和 MDX 的默认语法通过各自的 `DataFactory` 实现得到支持。每种数据源查询语法定义了如何指定参数，而 Pentaho Reporting 通过\
  \ `DataRow` API 提供这些参数。参数管理的两个例外包括 SQL 和静态数据。在 JDBC 中指定 SQL 语句时，您通常会指定问号来表示应指定哪些参数。\n\
  \nPentaho Reporting 要求您按名称指定参数，因此在将查询传递给 JDBC 之前会对 SQL 查询进行一些解析。您可以将参数指定为 `${PARAM}`，并且\
  \ `SQLReportDataFactory` 会在执行准备好的 JDBC 调用之前用问号 (?) 替换每个命名参数。`NamedStaticDataFactory`\
  \ 允许执行带参数的 Java 类方法。在配置 `DataFactory` 时提供的名称用于从提供的 `DataRow` 中解析值。\n\n以下是包含一个名为\
  \ `productLine` 的参数的 SQL 查询示例，该参数在 `SampleData` 模式的 `PRODUCTS` 表上过滤产品的线：\n\n```\n\
  SELECT\n  *\nFROM\n  PRODUCTS\nWHERE\n  PRODUCTLINE = ${productLine}\n```\n\n*请注意，参数是与一组属性一起定义的（您将在以下各节中更好地看到这一点）。*\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_417_0.png)\n\n这意味着参数值的自动替换实际上取决于这些属性，并且在开发查询字符串时应考虑这一点。如果未这样做，查询可能会失败；例如，在\
  \ SQL 命令定义了单个值 WHERE 条件的地方提供了多值参数。\n\n### 可用的报表参数类型\n\nPentaho Reporting 提供了一套丰富的不同参数，每个参数在\
  \ Pentaho Report Designer 或任何其他前端工具中呈现方式各不相同（您将在第 15 章 *Using Reports in Pentaho\
  \ Business Analytics Platform* 中看到一个示例）。以下列表分享了 Pentaho Reporting 8.0 中可用的所有参数类型：\n\
  \n- **Drop-down**：定义典型的下拉列表并允许单值选择\n- **Single value list**：定义包含值列表的面板并允许单值选择\n\
  - **Multi-value list**：定义包含值列表的面板并允许多选\n- **Radio button**：定义包含值列表的面板并以单选按钮样式允许单值选择\n\
  - **Checkbox**：定义包含值列表的面板并以复选按钮样式允许选择\n- **Single selection button**：定义包含按钮列表的面板（一值一个按钮）并允许单选\n\
  - **Multi-selection button**：定义包含按钮列表的面板（一值一个按钮）并允许多选\n- **Textbox**：定义文本字段\n- **Text\
  \ area**：定义文本区域字段\n- **Date picker**：定义用户友好的界面以选择单个日期/时间值\n\n将 Pentaho Reporting\
  \ 嵌入到自定义应用程序中时，渲染参数是嵌入程序的责任，如以下示例所示。所有参数类型都可以指定数据源用于填充可能的选项，以及用于验证。可以通过参数化用于填充选项的数据源来嵌套参数。例如，顶层的下拉参数，如国家，可以驱动二级单选按钮参数，如地区。查询按其在数据源列表中出现的顺序执行。\n\
  \n多值列表、复选框和多选按钮参数类型允许选择多个类型。这些参数类型返回值的数组而不是单个值。数据源，包括 SQL，具有特殊逻辑，可将生成的查询中的值数组映射。\n\
  \n### 创建参数\n\n从 Report Designer 用户界面开始，您应该已经熟悉报表资源管理器（您可以在右上角面板中找到它）。报表资源管理器由两个不同的标签组成：Structure\
  \ 和 Data。在前几章中，您已经使用过这两个标签，而 Data 标签是所有参数所在的位置。以下屏幕截图显示了报表资源管理器的外观\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_420_0.png)\n\
  \n定义了两个参数：\n\n您可以通过右键单击 Parameters 项并选择 Add Parameter... 来创建新参数。作为替代，您可以单击报表资源管理器中的参数图标或使用上部菜单，选择\
  \ Data | Add Parameter... 项。\n\n一旦选中，会出现一个类似以下内容的模态窗口：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_420_1.png)\n\
  \n如您在左面板中看到的，您可以管理报表数据源，如您在第 6 章 *Configuring JDBC and Other Data Sources* 中所见，因为它们可以在参数定义中使用。右面板列出了定义参数所有属性的一组字段。面板在上部与属性相关分组，并且\
  \ Prompt 组用于设置参数的呈现方式。在下表中，为便于理解介绍了所有属性：\n\n| Name | Type | Description |\n|---|---|---|\n\
  | Name | String | 参数的名称。此属性将在数据源定义中使用，因此请仔细定义。 |\n| Label | String | 在用户界面中显示以请求字段值的标签。\
  \ |\n| Label Formula | String | 动态定义标签值的公式。 |\n| Value Type | Selection | 参数的数据类型。可能的值为：String、Boolean、Number、Date、Date\
  \ (SQL)、Time、Timestamp、Double、Float、Integer、Long、Short、Byte、BigInteger、BigDecimal、TableModel\
  \ 和 Object。 |\n| Data Format | String | 用于数字、日期、时间戳等的数据格式字符串。 |\n| Data format formula\
  \ | String | 动态定义格式值的公式。 |\n| Default Value | String/array of strings | 参数的默认值。如果参数为多值，则值可以指定为数组。\
  \ |\n\n\n\n\n| 默认值公式 | 字符串 | 动态定义默认值/值的公式。 |\n| 后处理公式 | 字符串 | 定义对参数值进行后处理操作的公式。\
  \ |\n| 必填 | 布尔 | 如果设置为 true，参数不能为空。默认值为 false。 |\n| 隐藏 | 布尔 | 如果设置为 true，参数对用户不可见（但已定义）。默认值为\
  \ false。 |\n| 显示类型 | 选择 | 从可能的 参数类型列表中选择的参数类型。 |\n| 查询 | 选择 | 用于定义参数可能值的数据源。 |\n\
  | 值 | 选择 | 用于定义参数可能值的数据源字段。 |\n| 显示名称 | 选择 | 用于定义参数可能显示名称的数据源字段。此属性仅在提供显示名称时可用。\
  \ |\n| 显示值公式 | 字符串 | 定义参数显示名称的公式。此属性仅在提供显示名称时可用。 |\n| 可见项 | 整数 | 可见项数。仅适用于多值参数。默认值为\
  \ 0。 |\n\n一旦所有请求的属性都已定义，点击 OK 按钮以创建参数并在报表资源管理器的 Data 选项卡中看到它列出。\n\n## 使用参数创建报表\n\
  \n在本节中，让我们通过一个实际示例来展示报告参数如何在实践中创建和使用。与往常一样，这只是一个可以完成的事情的示例，但这是一个非常常见的需求，你将来肯定会重复使用。此示例展示了如何开发两个级联参数，其中一个取决于另一个的值。\n\
  \n更详细地说，让我们开发一个非常简单的报表，描述 SampleData 模式的 customers 表中可用的客户列表。正如你在第 6 章 Configuring\
  \ JDBC and Other Data Sources 中所学到的，第一步是定义一个空报表（使用新建空报表图标（ ））。完成后，创建三个新的数据源（分别命名为\
  \ Details、cities 和 Countries），如下图所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_424_0.png)\n\
  \nDetails 查询定义了报表详情并依赖于两个参数：国家和城市参数。cities 查询定义了特定国家中可能的城市列表。如你所见，查询使用国家参数来过滤给定国家中已有的城市。国家参数的这种使用定义了将要定义的两个参数之间的依赖关系。Countries\
  \ 查询定义了可能的国家列表。一旦查询定义完成，请记住通过在报表资源管理器的 Data 选项卡中右键单击它并点击 Select Query 来选择 Details\
  \ 查询。\n\n现在数据源已正确设置，让我们从 Details 查询中拖动 COUNTRY、CITY 和 CUSTOMERNAME 字段并将其放置在 Details\
  \ 频带中，如下图所示。请注意将 CUSTOMERNAME 字段拉伸以覆盖整个空间直至页面的右边缘。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_425_0.png)\n\
  \n为完成报表，让我们创建两个参数。如前所述，点击报表资源管理器中的参数图标并填写模态窗口，如下图所示左侧所述。此任务将创建国家参数。通过再次点击报表资源管理器中的参数图标并填写模态窗口，如下图所示右侧所述，来重复创建城市参数：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_425_1.png)\n\n完成后，使用眼睛图标预览报表，你将在面板顶部看到两个交互式参数出现。花点时间与它们互动，改变国家参数的值并检查城市参数如何相应地变化。选择城市参数的值将相应地改变生成的报表。以下截图显示了如何\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_426_0.png)\n\n报表参数在报表预览中的外观：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_426_1.png)\n\
  \n在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers 仓库中，具体在 chapter\
  \ 08 - Parametrization, functions, variables and formulas/my_repo 目录下，你可以找到 sample_with_parameters.prpt\
  \ 报表，它完全实现了这里描述的示例。随意使用 Report Designer 打开它并探索其设置和参数，以了解所有高级功能及其行为。\n\n## 函数和表达式\n\
  \nPentaho Reporting 在报表创建期间提供了许多可使用的函数和表达式。Pentaho Reporting 中的函数用于计算计算值，而 Pentaho\
  \ Reporting 中的表达式是作用域仅限于当前数据集行的函数。函数可以维护状态，具有访问多行数据的能力。\n\n## Report Designer 中的函数和表达式\n\
  \n从 Report Designer 用户界面开始，由于作用域不同，函数和表达式位于两个不同的位置。函数可以在报表资源管理器中找到，特别是在 Data 选项卡下的\
  \ Functions 组中。以下截图显示了报表资源管理器在定义了两个函数时的外观：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_428_0.png)\n\
  \n表达式与数据集相关，位于不同的位置：在元素属性面板中。具体来说，表达式位于面板的每个属性上，在显示图标的表格的第四列中。有两种可能的图标：绿色加号图标（\U0001F7E2\
  ），表示未定义表达式，以及铅笔图标（✏️），表示已定义表达式。以下示例显示了两个属性：text-color 属性的静态值已填写而表达式为空，以及 bg-color\
  \ 属性的静态值为空而表达式已填写。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_428_1.png)\n\n> 如果为属性定义了表达式，则包含静态值的第三列将被忽略。此行为在报表设计期间很重要，如果你不了解它，可能会造成困扰。\n\
  \n## 创建和使用函数\n\n从 Report Designer 用户界面开始，具体在报表资源管理器的 Data 选项卡中，你可以通过右键单击 Functions\
  \ 项并选择 Add Function... 来创建新函数。作为替代，你可以点击函数图标（fx）或使用顶部菜单，选择 Data | Add Function...\
  \ 项。\n\n一旦选择函数创建，一个模态窗口会出现，类似于以下所示。该窗口包含可用函数类型的列表，按组分组以便更好地理解。展开右侧组，你可以选择要在报表中使用的函数类型。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_429_0.png)\n\n一旦为你的需求选择了正确的函数类型，一个全新的函数将出现在报表资源管理器的\
  \ Data 选项卡列表中。选择新函数后，元素属性面板将显示所有可用属性，就像报表的常规元素一样。在以下各节中，将为每种函数类型介绍所有属性。\n\n在报表中使用函数的方式与你在前几章中看到的其他报表元素完全相同：从\
  \ Data 选项卡拖动函数并将其放置在首选位置，直接放置在报表的频带中。\n\n## 函数示例\n\n例如，让我们重用在第 4 章 *Creating a Report\
  \ with Report Designer* 中开发的名为 `report_01.prpt` 的报表。如果你遵循了建议，你应该在你的开发环境中的 `my_report`\
  \ 文件夹中有该报表。如果没有，你可以从 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库下载，从 `Chapter 04 - Creating a report with Report Designer/my_reports` 路径。\n\n\
  目标是为此报表添加页码。此示例非常基础，但在你未来的开发中将非常有用。\n\n一旦报表在 Report Designer 中打开，按本章前面解释的方式创建新函数：在报表资源管理器中选择\
  \ Data 选项卡，然后点击函数图标（fx）。对于函数类型，展开 `Common` 并选择 `Page`。一旦点击 OK 按钮，一个名为 `PageFunction1`\
  \ 的新函数将被创建。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_430_0.png)\n\n> *花点时间在从报表资源管理器的\
  \ Data 选项卡中选择新函数时检查元素属性面板中的属性。此时，你应该对属性的含义更有信心，并且可以轻松预测其目标和预期行为。*\n\n现在名为 `PageFunction1`\
  \ 的新函数可用，从报表资源管理器的 Data 选项卡中拖动它并将其放置在页脚的中央。为了达到完美，你还应通过点击顶部工具栏上的图标来居中内容的对齐方式。完成后，使用眼睛图标（\U0001F441\
  ）预览报表，你将看到如下图所示的页码。使用工具栏中的箭头图标 « ‹ › » 更改页面并检查结果。\n\n\n\n\n|  |  |  |\n|---|---|---|\n\
  | 首席技术官 | 405,985 | 459,650 |\n| 工程副总裁 | 383,242 | 443,405 |\n| 高级工程师 | 770,272\
  \ | 719,855 |\n| 工程师 | 695,925 | 666,750 |\n| QA 经理 | 374,863 | 437,420 |\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_431_0.png)\n\
  \n*在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers 仓库中，具体在 `Chapter\
  \ 08 - Parametrization, functions, variables and formulas/my_reports` 路径下，你可以找到\
  \ `sample_with_page_numbering.prpt` 报表，它实现了这里描述的示例。欢迎使用 Report Designer 打开它并调整设置和参数，以了解所有高级功能和高级行为。*\n\
  \n## 创建和使用表达式\n\n从 Report Designer 用户界面开始，具体来说在元素属性面板中，你可以通过点击绿色加号图标（⊕）为属性创建新的表达式。按下后，会出现类似以下内容的模态窗口：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_432_0.png)\n\n在模态窗口中，你可以在顶部识别出一个下拉菜单，用于选择要定义的表达式类型，并在其下方有一个用于设置可用属性的面板（如果是\
  \ Open Formula，还会有 Formula 选项卡）。查看可用的表达式类型，它们正是之前介绍的函数类型的一个子集。关于这一点，我们可以观察到：\n\n\
  - 表达式和函数之间名称相同的类型具有完全相同的属性名称和行为。\n- 既不是表达式类型也不存在的函数类型与数据集无关。如果考虑到表达式的定义（表达式是作用域仅限于当前数据集行的函数），这很有意义。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_433_0.png)\n\n考虑到我们已在函数的描述中包含了表达式的描述（和行为），在以下各节中你将继续了解函数的细节，只需假定表达式具有相同的属性和行为。\n\
  \n```\n= IF( ISEVEN(ROWCOUNT()); \"#d2e8f4\"; \"white\" )\n```\n\n## 可用的函数类型\n\n\
  在本节中，你将了解所有可用的函数类型。如本章前面介绍的那样，Report Designer 中每个函数都根据其所属的组进行分类。接下来你将为每个组找到一个部分，其中包含内容的简要介绍以及完整的属性和设置列表。\n\
  \n在描述每个组的特定属性之前，让我们先介绍所有组的通用属性：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| 函数名称 | String\
  \ | 用于在元素、公式和其他函数中引用函数或表达式 |\n| 依赖级别 | Integer | 用于确定执行函数的顺序 |\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_435_0.png)\n\
  \n包含在名为 Deprecated 和 Internal Function（请勿使用）的组中的函数将不予描述。原因很明显——你不应该使用它们。\n\n## 通用函数\n\
  \n通用函数包括 Pentaho Report Designer 中最常用的函数：\n\n此函数计算本章后面定义的 LibFormula 公式。此函数的属性如下：\n\
  \n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n| 公式 | String | 要计算的公式。点击 ...\
  \ 按钮将显示公式编辑器。有关详细信息，请参阅专门介绍公式主题的部分。 |\n| 依赖级别 | Integer | 用于确定执行函数的顺序。 |\n\n此函数返回当前页码。此函数的属性如下：\n\
  \n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n| 页面增量 | Integer | 每次翻页时增加计数的数值\
  \ |\n| 起始页码 | Integer | 开始计数的页码 |\n| 重置于组名称 | String | 如果设置此值，则在命名组出现时页面总计值将被重置\
  \ |\n\n总页数\n\n此函数计算报表中的总页数。此函数定义的属性与之前介绍的相同：页面增量、起始页码和重置于组名称。\n\n页码/总页数\n\n此函数返回一个字符串，显示当前页码和总页数。此函数定义的属性在以下表格中描述，除页面增量、起始页码和重置于组名称外：\n\
  \n| 名称 | 类型 | 描述 |\n|---|---|---|\n| 格式模式 | String | 用于将当前页码和总页数渲染成的格式字符串。默认值是 `{0}\
  \ / {1}: {0}` 以渲染当前页码；`{1}` 以渲染总页数。 |\n\n## 报表函数\n\n报表函数与报表的渲染相关：\n\n| 名称 | 描述 |\n\
  |------|-------------|\n| `Is Export Type` | 此函数如果报表字符串的导出类型以提供的导出类型属性开头则返回 true。此函数有一个属性如下：\
  \ |\n| `Row Banding` | 行条纹函数管理报表中行的背景颜色变化。此函数定义的属性在以下表格中描述，另外还有 `Reset on Group\
  \ Name`： |\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n| `Export Type ID`\
  \ | String | 与报表导出类型字符串进行比较的字符串 |\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n\
  | `Number of Rows` | String | 在更改条纹颜色之前要渲染的行数 |\n| `Active Banding Color` | String\
  \ | 主要条纹颜色 |\n| `Inactive Banding Color` | String | 次要条纹颜色 |\n| 新组时重置状态 | Boolean\
  \ | 如果设为 true，则对每个新组重置条纹颜色 |\n| 新页时重置状态 | Boolean | 如果设为 true，则对每个新页重置条纹颜色 |\n|\
  \ 忽略交叉表 | Boolean | 如果设为 true，则不应用于交叉表 |\n\n隐藏重复\n\n此函数隐藏项目带中指定字段的重复元素。此函数定义的属性在以下表格中描述。\n\
  \n| 名称 | 类型 | 描述 |\n| 字段名称 | String | 用于观察变化的字段 |\n| 应用于命名元素 | String | 项目带中要隐藏的元素\
  \ |\n| 忽略所有组分页 | Boolean | 如果设为 false，此函数将在组分页时重置自身 |\n| 忽略所有页分页 | Boolean | 如果设为\
  \ false，此函数将在页分页时重置自身 |\n\n隐藏页眉和页脚\n\n如果导出类型不可分页，此函数会隐藏页眉和页脚。此函数定义的属性在以下表格中描述：\n\
  \n| 名称 | 类型 | 描述 |\n|---|---|---|\n| 导出描述符 | String | 此属性用于确定当前报表导出类型是否应禁用页眉和页脚。其默认值是\
  \ `table`。 |\n| 隐藏页面带 | Boolean | 如果设为 true，则隐藏页面带。 |\n| 禁用重复标题 | Boolean | 禁用任何重复的组页眉和页脚。\
  \ |\n\n| 显示页脚 | 此函数隐藏除最后一页外的页脚。它没有其他属性。 |\n\n## 汇总函数\n\n汇总函数在报表处理的第一个阶段计算值，并在报表渲染期间使这些值可用：\n\
  \n| 名称 | 描述 |\n|------|-------------|\n| Sum | 此函数在报表的准备运行阶段对组内的字段求和，使总组和在报表生成的后续阶段可用。此函数定义的属性在以下表格中描述，另外还有字段名称和重置于组名称：\
  \ |\n| Count | 此函数在报表的准备运行阶段对组内的行计数，使总组计数在报表生成的后续阶段可用。此函数定义的属性与之前介绍的相同：重置于组名称和交叉表列过滤器。\
  \ |\n| Count for Page | 此函数与 Count 函数相同，但也在每个页面的开头重置。 |\n|  | 此函数在报表的准备运行阶段计算报表中组的出现次数，使总组计数在报表生成的后续阶段可用。此函数定义的属性在以下表格中描述：\
  \ |\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n| 交叉表列过滤器 | String | 用于在交叉表中过滤的字段\
  \ |\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n\n\n\n\n## 组计数\n\n| 名称 | 类型 | 描述 |\n|------|------|------|\n\
  | 计数组名称 | 字符串 | 应计数的组的名称。如果设置为空，则统计父组内的所有组。 |\n| 重置于父组名称 | 字符串 | 重置计数的组的名称。如果设置为空，则统计整个报表中的子组。\
  \ |\n\n## 最小值\n\n确定报表中指定字段的全局最小值。此函数的定义属性与前面介绍的相同：字段名称、重置于组名称 和 交叉表列过滤器。\n\n## 最大值\n\
  \n确定报表中指定字段的全局最大值。此函数的定义属性与前面介绍的相同：字段名称、重置于组名称 和 交叉表列过滤器。\n\n## 求和商\n\n此函数对被除数和除数求和，然后将两者相除得到结果值，使用\
  \ Sum 函数对值求和。此函数的定义属性在下表中描述，除重置于组名称 和 交叉表列过滤器 外：\n\n| 名称 | 类型 | 描述 |\n|------|------|------|\n\
  | 被除数字段 | 字符串 | 此除法计算的被除数字段。 |\n| 除数字段 | 字符串 | 此除法计算的除数字段。 |\n| 舍入模式 | 整数 | Java\
  \ 的 BigDecimal 舍入模式。请参阅 Java 文档以获取值。 |\n| 精度 | 整数 | 返回的商的精度。默认值是 14。 |\n\n| 名称 |\
  \ 描述 |\n|------|------|\n| `Sum Quotient Percent` | 此函数是 `Sum Quotient` 函数的扩展，仅将最终结果乘以\
  \ 100。它与 `Sum Quotient` 函数共享相同的属性。 |\n| `Calculation` | 此函数在报表生成的准备运行阶段存储计算字段的结果，以便在报表中稍后访问。此函数的定义属性与前面介绍的相同：`Field\
  \ Name`、`Reset on Group Name` 和 `Crosstab Column Filter`。 |\n| `Sum for Page` |\
  \ 此函数与 `Count` 函数相同，但在每个页面的开头也会重置。 |\n| `Count for Page (Running)` | 此函数与 `Count`\
  \ 函数相同，但会维护数据集中当前行数的数值，并在每个页面的开头重置。 |\n\n## 运行函数\n\n运行函数在报表渲染期间计算值，允许在整个报表中进行增量聚合信息。\n\
  \n| 名称 | 描述 |\n|------|------|\n| 求和（运行） | 计算报表中指定字段在行数上的总和值。此函数的定义属性与前面介绍的相同：字段名称、重置于组名称\
  \ 和 交叉表列过滤器。 |\n| 计数（运行） | 维护数据集中当前行数的数值。此函数的定义属性与前面介绍的相同：重置于组名称 和 交叉表列过滤器。 |\n\
  | 组计数（运行） | 此方法统计报表中组的出现次数。此函数的定义属性与前面介绍的相同：计数组名称 和 重置于父组名称。 |\n| 计数不同（运行） | 此方法统计指定字段中值的不同出现次数。此函数的定义属性在下表中描述，除字段名称、重置于组名称\
  \ 和 交叉表列过滤器 外。 |\n| 平均值（运行） | 计算报表中行数内指定字段的平均值。此函数的定义属性与前面介绍的相同：`Field Name`、`Reset\
  \ on Group Name`、`Rounding mode` 和 `Scale`。 |\n| 最小值（运行） | 确定报表中行数上指定字段的最小值。此函数的定义属性与前面介绍的相同：`Field\
  \ Name` 和 `Reset on Group Name`。 |\n| 最大值（运行） | 确定报表中行数上指定字段的最大值。此函数的定义属性与前面介绍的相同：`Field\
  \ Name` 和 `Reset on Group Name`。 |\n| 总计百分比（运行） | 通过对所有数据行求和并将当前行除以总和来计算指定字段的百分比值。此函数的定义属性在下表中描述，除\
  \ `Field Name`、`Reset on Group Name`、`Crosstab Column Filter`、`Rounding mode` 和\
  \ `Scale` 外。 |\n\n| 名称 | 类型 | 描述 |\n|------|------|------|\n| 忽略空值 | 布尔值 | 如果为 true，计数器将不考虑空值。默认值是\
  \ false。 |\n\n| 名称 | 类型 | 描述 |\n|------|------|------|\n| `Scale Result To 100`\
  \ | 布尔值 | 如果为 true，则将值乘以 100 |\n\n## 高级函数\n\n高级函数包括专门且通常不使用的函数：\n\n| 名称 | 描述 |\n\
  |------|------|\n| 消息格式 | 根据当前数据行格式化消息。此函数的定义属性在下表中描述。 |\n| 资源消息格式 | 从资源包返回格式化的消息。此函数的定义属性在下表中描述，除\
  \ Null-String 外。 |\n\n| 名称 | 类型 | 描述 |\n|------|------|------|\n| 消息模式 | 字符串 | 要渲染的字符串模式，其中行数据由\
  \ ${FIELD} 引用 |\n| 编码 | 字符串 | 如果设置了 URL 编码属性，则使用此编码 |\n| URL 编码所有值 | 布尔值 | 对消息中渲染的各个行数据进行编码\
  \ |\n| URL 编码结果 | 布尔值 | 对最终结果进行编码 |\n| 空字符串 | 字符串 | 如果引用的字段为空，则要渲染的值 |\n\n| 名称 |\
  \ 类型 | 描述 |\n|------|------|------|\n| 资源包标识符 | 字符串 | 资源包的名称 |\n| 模式的资源键 | 字符串 |\
  \ 要渲染的格式字符串，可能包含对当前行字段的引用，使用 ${FIELD} 语法 |\n\n## 查找\n\n此函数允许您根据键匹配在不同的字符串之间进行选择，基于键匹配的值。此函数的定义属性在下表中描述，除字段名称\
  \ 和 空值 外：\n\n| 名称 | 类型 | 描述 |\n|------|------|------|\n| 回退值 | 字符串 | 如果没有键匹配字段值，则返回此值。\
  \ |\n| 键值 | 字符串数组 | 与字段进行比较的值。每个键应有一个对应的文本值。 |\n| 文本值 | 字符串数组 | 它是一个字符串列表。根据哪个键匹配字段值，从列表中选择一个字符串。\
  \ |\n| 匹配时忽略大小写 | 布尔值 | 如果设置为 true，则在进行键比较时忽略大小写。 |\n\n## 间接查找\n\n此函数允许您根据键匹配在不同的列之间进行选择，基于键匹配的值。此函数的定义属性在下表中描述，除\
