  ## 前言


  你有多少次被要求在几天或更短时间内使用基于 Web 的解决方案或自定义 Java 项目，以最先进的技术开发出具有吸引力的报表，并且格式各不相同？如果是这种情况，本书将帮助你使用
  Pentaho 套件中的专用工具 Pentaho Reporting 实现这一目标。


  本书是面向 Java 开发者和信息技术人员的权威指南，介绍这款开源报表工具，可让你基于各种数据源，使用可视化设计环境和 SDK 将 Pentaho Reporting
  Engine 嵌入应用程序中，创建像素级完美的 PDF、Excel、HTML、文本、RTF、XML 和 CSV 报表。


  本书在 Pentaho 版本 8 即将正式发布时撰写，主要基于该版本。功能、技巧和最佳实践的描述采用学习-by-示例的方法。为了更好地指导你了解不同主题并定义学习路径，本书分为四个主要部分：


  - Introduction and basics of Pentaho Reporting

  - Core concepts and advanced features of Report Designer

  - All about the Reporting SDK

  - Additional Pentaho Reporting topics




  ## 本书涵盖内容


  第 1 章，*Pentaho Reporting 简介*，涵盖了 Pentaho Reporting 的典型用途、历史和起源，以及 Pentaho Reporting
  提供的报告功能的更详细概述。


  第 2 章，*Report Designer 入门*，专注于快速上手 Pentaho Reporting。它将首先介绍构建和嵌入报告的环境设置。从那里开始，读者将逐步学习使用向导创建报告，并在本章结束时学习如何将报告保存到文件系统。


  第 3 章，*Reporting SDK 入门*，介绍 Pentaho Reporting SDK。读者将逐步学习如何将现有报告嵌入到通用的 Java 应用程序中。


  第 4 章，*使用 Report Designer 创建报告*，更进一步，涵盖了从头创建报告（而不是使用向导）时最常用的功能。核心概念，例如自定义报告、将其保存到
  Pentaho 仓库中以及预览内容，将逐步详细说明。


  第 5 章，*Report Designer 中的设计与布局*，深入探讨 Pentaho Report Designer 与设计和布局相关的所有概念和功能。读者将深入探索使用
  Pentaho Report Designer 进行报告设计和布局的方方面面。


  第 6 章，*配置 JDBC 和其他数据源*，教你 Pentaho Reporting 能够连接的所有方式中数据源的配置。数据源定义将使用 Pentaho Reporting
  Designer 进行演示。


  第 7 章，*在报告中包含图形和图表*，展示如何在 Pentaho 报告中加入图表和图形。你将了解支持的不同类型的图表以及如何在 Pentaho Report
  Designer 中配置它们。本章还将帮助你使用各种类型的数据填充图表。


  第 8 章，*参数化、函数、变量和公式*，首先学习如何参数化报告。本章涵盖可在报告中使用的所有预定义函数和表达式。它将帮助读者了解 Pentaho Reporting
  的公式功能，包括正确的语法和可用的公式方法。


  第 9 章，*国际化与本地化*，展示国际化和本地化报告的细节。


  第 10 章，*子报表和交叉表*，涵盖从头构建一些子报表和交叉表的示例，探索 Pentaho Reporting 提供的功能。我们将构建一个多页子报表，演示用于管理页眉的
  sticky 标志的使用，并构建一个带有汇总图表的子报表。


  第 11 章，*PRPT 格式及构建它的 Java API*，讲解 Pentaho Reporting 的 PRPT 包格式以及 Pentaho Reporting
  Java API 的细节。本章重点介绍代表 Pentaho 报告的 PRPT 文件的组成以及如何使用 Java API 构建它。


  第 12 章，*使用数据源开发*，展示将数据加载到 Pentaho Reporting Engine 的各种方法，并深入探讨 Pentaho Reporting
  Engine 如何与这些数据源交互以呈现报告。


  第 13 章，*使用 Java 进行国际化、子报表和交叉表*，涵盖报告参数化的细节。你还将学习动态呈现报告的各种方式，包括从 Java 角度学习所有可用的函数和表达式。


  第 14 章，*构建交互式报告*，教你如何在报告中启用交互功能。你还能够修改报告定义以生成超链接事件和许多不同的 HTML JavaScript 事件。你将学习如何在服务器上呈现
  HTML 报告，以及在呈现的 HTML 报告中包含外部脚本文件。


  第 15 章，*在 Pentaho Business Analytics Platform 中使用报告*，展示 Pentaho Business Analytics
  Platform 的基础知识以及使用存储在仓库中或通过仪表板访问的 Pentaho 报告的最佳实践。


  第 16 章，*在 Pentaho Data Integration 中使用报告*，介绍如何在 Pentaho 套件内部使用开发的 Pentaho 报告，特别是与
  Pentaho Data Integration（Kettle）一起开发管理 Pentaho 报告的作业/转换。


  第 17 章，*Pentaho Reporting 每日构建与支持*，涵盖各种有用、简短和高级的 Pentaho Reporting 主题。


  ## 阅读本书所需条件


  Pentaho Reporting 工具是跨平台应用程序，可在 Linux、Windows、macOS 和其他 Java 支持的环境中运行。Reporting
  Engine 与之前版本的 JDK 向后兼容，但始终建议使用最新版本。对于 Pentaho 8，建议使用 JDK 版本 1.8。


  本书中的所有示例均使用 Ubuntu 操作系统 v16.04 LTS、4 GB RAM 和 Intel i7 处理器开发。开发环境由 Java JVM 1.8.0_131、Apache
  Maven 3.3.9、Git 版本 2.7.4 组成。此配置并非运行示例的强制要求，但作为参考和建议分享，以帮助成功运行示例。


  如果你是信息技术人员且不想涉及开发任务，则无需在你的笔记本电脑上安装 Apache Maven 和 Git。


  ## 本书适合谁阅读


  本书面向两类专业人士和学生：具备数据库基础知识的信息技术人员以及具有中等资历的 Java 开发者。开发者将有兴趣了解如何在第三方 Java 应用程序中嵌入报告。


