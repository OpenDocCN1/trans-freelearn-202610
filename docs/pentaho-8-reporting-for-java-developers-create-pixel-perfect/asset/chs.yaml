  ## Report Designer 中的设计与布局\n\n在前几章中，您已了解 Pentaho Report Designer 并开始使用它，通过使用向导或从零开始开发简单和复杂的报表。在本章中，您将深入探讨与报表设计和布局相关的\
  \ Pentaho Report Designer 的概念和功能。\n\n您将首先复习 Report Designer 用户界面的基础知识，然后了解 Report\
  \ Designer 中呈现的核心布局频段，包括明细频段和分组频段。从那里开始，您将详细探讨设计师可用的各种元素，它们如何使用以及可能用于什么。\n\n您还将学习报表画布内视觉布局的方方面面，包括网格和指南等高级概念。您将以有关使用\
  \ Pentaho Reporting 支持的各种输出格式的更多细节结束本章。\n\n本章以开发人员和信息技术人员的参考手册形式撰写。目标是分享 Pentaho\
  \ Report Designer 的所有相关和高级功能。本章结束时，您将对其用户界面感到得心应手，并且应该能够充分发挥其能力使用它。\n\n## Report\
  \ Designer 用户界面组件\n\n在第 2 章 *Getting Started with Report Designer* 中，您发现了用户界面的组成，而在第\
  \ 4 章 *Creating a Report with Pentaho Designer* 中，您使用 Report Designer 开发了非常简单和复杂的报表，发现了与设计和布局相关的\
  \ most 相关功能。在完成对全部功能的发现之前，作为提醒，让我们在下面的列表中回顾一下您可以在 Report Designer 用户界面中识别的组件，如下图所示。这将在以下各节中讨论与设计和布局相关的细节和高级功能时很有用。\n\
  \n- 窗口上部菜单和工具栏\n- 左侧的报表元素调色板，您可以在其中为报表选择报表元素\n- 报表画布选项卡面板，显示您的报表\n- 报表资源管理器面板，其中包含结构选项卡（和数据选项卡），以对象树形式显示整个报表\n\
  - 元素属性面板，显示与当前选定的报表元素关联的所有样式和属性\n- 消息面板，显示与当前打开的报表相关的警告和错误\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_187_0.png)\n\
  \n在以下各节中，您将深入探讨 Report Designer 用户界面中关于设计和布局的最有用的功能。\n\n## 报表资源管理器中的结构选项卡\n\n如前一节所述，报表资源管理器面板有一个名为结构的选项卡，以对象树形式显示整个报表。此选项卡，或其中表示的树结构，是开发人员手中关键工具之一。使用此工具，开发人员可以控制报表的精细调整。\n\
  \n在树结构中表示了一个对象层次结构，每个对象标识报表的一个（且仅一个）元素。报表中的所有内容都是一个元素，每个元素都有一个父级和零个或多个子级。一个元素必须只有一个父级，不能有多个或零个父级。唯一的例外是根，它没有父级。\n\
  \n关于根：层次结构顶部始终有一个唯一的称为 Master Report 的元素。Master Report 是报表中的一个不可见元素，但所有内容从这里开始定义设计、布局以及包含在报表中的所有内容。\n\
  \n从报表中移动（或删除）一个元素也会移动（或删除）该元素的整个子树。尝试向报表画布添加一个元素并检查树结构如何变化。尝试将一个元素从其父级移动到层次结构中的不同元素并查看报表画布如何变化。您现在使用树结构越多，您在未来项目中进行报表开发就越有信心。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_188_0.png)\n\n> *花点时间在报表资源管理器中玩转结构选项卡。对其充满信心将使您能够完全控制报表以及所有结构、属性等的精细调整。*\n\
  \n## 报表元素属性\n\n报表设计中的另一个关键概念是元素的属性。元素的属性是报表中元素的原子值或描述或配置或设置。每个元素可以有零个或多个属性。平均而言，一个元素具有可变数量的属性（取决于元素的类型）。属性被分组为集合，以便更好地理解并在开发期间更好地选择。\n\
  \n查找属性列表的主要位置是元素属性面板。元素属性面板由两个选项卡定义：包含与布局和渲染相关的所有属性的 Style 选项卡，以及包含与所有通用设置和配置相关的所有属性的\
  \ Attributes 选项卡。\n\n每个选项卡都由与元素相关的属性列表定义，每个属性显示一对对象：属性名称和属性值（或值）。属性值可以由值（取决于属性的类型）或动态公式定义。元素属性面板中的大多数属性在右侧都有一个绿色加号图标（⊕）。单击绿色加号图标（⊕）可让您访问公式编辑器（我们将在下一章介绍公式编辑器）。以下是用户界面中呈现的属性示例。在这种情况下，`font-size`\
  \ 是属性，其值为 10。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_189_0.png)\n\n在报表中选择一个元素然后选择其子元素，您可以很容易注意到常见属性的值是从一个元素继承到另一个元素。这给了我们讨论报表属性继承的机会：报表中定义的每个元素都从父级继承常见属性的值，父级从其父级继承，依此类推。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_189_1.png)\n\n> _如果您想更改报表的全局属性（字体、大小、颜色、边框等），可能只需更改\
  \ `Master Report` 中相应属性的值即可。该值将_\n\n*该属性将被传播到所有后代（即整个报表）直到其中一个显式重写该值。*\n\n你可以很容易地通过元素属性面板中对应项的标志\
  \ ☑ 是否被勾选来识别某个属性值是从父级继承的。可以想象，你可以打破可继承性，通过更改属性值来实现。这样做时，标志会自动设置为 *未勾选*。从那时起，所有后代元素都将继承新的属性值，直到另一次显式更改被设置。再次点击标志（☑）图标，你可以指示\
  \ Report Designer 再次从父元素继承属性值，就像默认情况下一样。\n\n每个选项卡中的属性都按子集分组，以便在开发过程中更好地选择和搜索。这些子集使用有意义的描述命名，例如：`size\
  \ & position`、`font`、`text`、`text-spacing`、`object`、`link`、`excel`、`padding`、`border`、`query`、`common`、`query-metadata`、`parameter`、`wizard`、`html`、`html-event`、`pdf-event`、`swing-event`、`advanced`、`pentaho`，还有一些。\n\
  \n在报表中选择一个元素（使用报表画布、使用报表资源管理器，或使用 Report Designer 的任何其他可能方式），元素属性面板将显示其所有可用属性。每次属性值的更改都会立即反映在报表画布中的报表预览中。\n\
  \n## Master report and report bands properties\n\n现在元素和属性的概念已经介绍过，让我们开始讨论报表的根（`Master\
  \ Report` 元素）以及树结构中的第一层级，即频段。具体来说，我们将描述与每种元素类型相关的属性，从通用属性开始，然后逐个元素描述特定属性。\n\n你创建的每个\
  \ Pentaho 报表都有一个 `Master Report` 元素作为树层次结构的根。`Master Report` 元素在预览或报表画布中没有明确显示，但它包含一组通用属性。在以下专门介绍\
  \ `Master Report` 元素的部分中，你将了解有关此根元素的更多特定属性。\n\n初次创建报表时，在你的画布和报表资源管理器结构树中，你会看到：`Page\
  \ Header`、`Report Header`、`Details`、`Report Footer` 和 `Page Footer` 频段。这些频段以及其他频段，包括\
  \ `Group`、`Watermark` 和 `No Data`，构成了整个可视报表。所有频段都可能包含调色板中的元素并充当渲染这些元素的容器。每个频段都有不同的生命周期，并根据其上下文进行渲染。\n\
  \n为了更好地解释属性的重要性及其在报表开发中的作用，你可以在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中找到一些 Pentaho 报表的引用示例；更准确地说，在 `Chapter 05 - Design and layout in Report Designer/my_reports`\
  \ 路径中。每个报表都展示了相关属性（或一组属性）的使用作为示例，可以作为你理解和学习的指南。\n\n## Common properties\n\n如 *The\
  \ report element properties* 部分所述，嵌套元素之间属性值的继承是 Pentaho Reporting 的一个重要特性。当然，只有在父元素和子元素都使用相同属性时，继承才有效。这一概念引入了这样一个原则：大量通用属性在各种元素之间共享（并被继承）。在本节中，你将深入了解\
  \ `Master Report` 元素与各种类型频段之间的通用属性。\n\n## Size and position properties\n\n这组属性定义频段的大小和位置。这些属性可以通过在结构树中选择频段然后点击\
  \ Format | Size & Border... 菜单项来一起编辑，或在\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_193_0.png)\n\
  \nreport element Style tab 中单独编辑：\n\n下表列出了你在报表元素资源管理器中 Style 选项卡的 Size & Border...\
  \ 组中可以看到的大小和位置属性：\n\n| 名称 | 类型 | 描述 |\n|------|------|------|\n| layout | Selection\
  \ | 这仅适用于频段，并定义频段内元素如何渲染。- 默认布局为 `canvas`，允许你指定频段中每个报表元素应渲染的确切位置。- `block` 布局将频段中的所有项目从上到下堆叠。-\
  \ `inline` 布局将所有项目从左到右堆叠，并自动换行。- `row` 布局将所有报表元素显示在单行中。- `auto` 布局自动显示报表元素以避免重叠。-\
  \ 与 `table` 相关的布局（包括特定的 `table-body`、`table-header`、`table-footer`、`table-row`、`table-cell`、`table-col`\
  \ 和 `table-col-group`）在将报表导出为 HTML 时，将所有项目堆叠在 HTML 表格结构中。 |\n| x | Integer | 该元素在其父容器内的\
  \ x 位置。 |\n| width | Decimal | 该元素的宽度。-100 到 0 之间的数字表示父容器宽度的百分比。 |\n| y | Integer\
  \ | 该元素在其父容器内的 y 位置。 |\n| height | Decimal | 该元素的高度。-100 到 0 之间的数字表示父容器高度的百分比。 |\n\
  | invisible-consumes-space | Boolean | 如果设置为 true，则该频段中不可见的子元素仍会在报表中占用空间。 |\n| visible\
  \ | Boolean | 如果设置为 false，则元素不被渲染。 |\n| dynamic-height | Boolean | 如果设置为 true，则通知报表引擎该元素具有动态高度。\
  \ |\n| preferred-width | Decimal | 该元素的首选宽度。 |\n| preferred-height | Decimal | 该元素的首选高度。\
  \ |\n| min-width | Decimal | 该元素的最小宽度。 |\n| min-height | Decimal | 该元素的最小高度。 |\n\
  | max-width | Decimal | 该元素的最大宽度。 |\n| max-height | Decimal | 该元素的最大高度。 |\n| x-overflow\
  \ | Boolean | 如果设置为 true，文本可能会水平溢出元素之外。 |\n| y-overflow | Boolean | 如果设置为 true，文本可能会垂直溢出此元素之外。\
  \ |\n| fixed-position | Integer | 如果指定，则设置该频段在报表内的固定垂直位置。 |\n| box-sizing | Selection\
  \ | 这可以设置为 `content-box` 或 `border-box`。如果设置为 `content-box`，则尺寸样式不包括边框；如果设置为 `border-box`，则尺寸样式包括边框框。此样式的默认值是\
  \ `content-box`。 |\n| table-layout | Selection | 高级功能，用于指示 Pentaho 报表引擎以 `fixed`\
  \ 或 `automatic` 大小和位置渲染表格。 |\n\n如你在环境中看到的，点击报表元素资源管理器并在元素属性选项卡中检查，只有这些属性的一小部分在 `Master\
  \ Report` 元素中可用，但在所有类型的频段中大部分都是可用的。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_196_0.png)\n\
  \n作为练习，从 *Chapter 4, Creating a Report with Report Designer* 中开发的 `report_02.prpt`\
  \ 开始，并修改图表使其覆盖页面宽度的 50% 并将行高扩展到 40 像素。要查看最终结果，你可以检查存储在 GitHub 仓库的 `chapter 05 -\
  \ Design and layout in Report Designer/my_reports` 文件夹中的 `report_06.prpt` 文件。\n\n\
  ## Font, text, and text-spacing properties\n\n`Font`、`text` 和 `text-spacing` 是三个基本属性集，完全致力于报表中的文本布局。与之前属性集不同，大多数属性是从\
  \ `Master Report` 和所有类型的频段共享（并继承）的。让我们在以下各节中详细查看每个属性。\n\n\n\n## 字体属性\n\nPentaho\
  \ Reporting 在大多数字体操作中都使用 Java 内置的字体支持。`libfonts` 中存在一些额外的功能，为报表引擎提供 Java 标准 `Font`\
  \ 和 `FontMetrics` API 中不可用的额外信息。\n\n在 Pentaho Report Designer 中，字体可以通过多种方式进行修改。首先，所有基于文本的元素都包含字体属性。这些属性允许选择字体族、字体大小和字体样式。通过菜单\
  \ 格式 | 字体... 编辑这些属性时，会出现以下屏幕：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_198_0.png)\n\
  \n除了修改属性外，Pentaho Report Designer 还提供了一个工具栏（如下截图所示），您可以在其中快速修改字体名称、大小、样式和对齐方式：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_198_1.png)\n\n另一种配置字体的方法是使用元素属性，其中提供以下可用属性：\n\
  \n| Name | Type | Description |\n|------|------|-------------|\n| family | Selection\
  \ | 表示字体类型的字符串，例如 `SansSerif`。 |\n| font-size | Integer | 表示字体磅值的数字。 |\n| bold |\
  \ Boolean | 如果设置为 true，则以粗体显示字体。例如，如果公式设置为 true，字体将以粗体显示。 |\n| italics | Boolean\
  \ | 如果设置为 true，则以斜体显示字体。 |\n| underline | Boolean | 如果设置为 true，则以下划线显示字体。 |\n| strike\
  \ through | Boolean | 如果设置为 true，则以删除线显示字体。 |\n| smooth | Selection | 如果设置为 `auto`，则\
  \ 8 磅以上的字体启用抗锯齿。如果设置为 `always`，则所有字体都启用抗锯齿。最后，如果设置为 `never`，则没有任何字体启用抗锯齿。 |\n| embed\
  \ | Boolean | 如果此样式等于 true，则在渲染 PDF 时嵌入报表中包含的字体。 |\n\n如果报表在一个操作系统环境中设计并在另一个环境中发布，可能会出现额外的字体相关问题。例如，Windows\
  \ 操作系统附带的字体标准集与 Solaris、Mac 和 Linux 系统不同。Pentaho Reporting 会尽力匹配正确的字体，但在发布后您应验证字体大小和样式是否仍按预期工作。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_200_0.png)\n\n作为练习，从第 4 章《使用 Report Designer\
  \ 创建报表》中开发的 `report_02.prpt` 开始，并将整个报表的字体族（即在 `Master Report` 中）修改为 `Purisa`。要查看最终结果，您可以检查\
  \ GitHub 仓库中 `Chapter 05 - Design and layout in Report Designer/my_reports` 文件夹中存储的\
  \ `report_07.prpt` 文件。\n\n## 文本属性\n\n文本属性对 `Master Report` 和频段是通用（且继承）的，除了 `h-align`\
  \ 和 `v-align`。以下属性会影响报表元素中文本的外观：\n\n| Name | Type | Description |\n|---|---|---|\n\
  | `h-align` | Selection | 元素内文本的水平对齐方式。此属性也可以在主工具栏中编辑。 |\n| `v-align` | Selection\
  \ | 元素内文本的垂直对齐方式。此属性也可以在主工具栏中编辑。 |\n| `v-align-in-band` | Selection | 指定频段中文本的垂直对齐方式。\
  \ |\n| `text-wrap` | Selection | 指定文本是否应换行。适当的值包括 `none` 和 `wrap`。 |\n| `word-break`\
  \ | Boolean | 指示是否在单词内换行的标志。如果未定义，则默认为 true（仅在单词边界处换行）。 |\n| `direction` | Selection\
  \ | 文本方向（例如阿拉伯文本），指示是左到右（`ltr`）还是右到左（`rtl`）。 |\n| `text-color` | String | 前景字体颜色。此属性也可以在主工具栏中编辑。\
  \ |\n| bg-color | String | 文本元素的背景颜色。 |\n| line-height | Decimal | 文本元素中字体的行高值。\
  \ |\n| overflow-text | String | 如果给定文本无法完全放入元素边界内，则打印的文本引用。 |\n| trim | Boolean\
  \ | 指示是否删除前导和尾随空白的标志。 |\n| trim-whitespace | Selection | 控制渲染器如何处理空白。 |\n| encoding\
  \ | String | 指定给定字段的目标文本编码，以防输出支持按字段编码。 |\n\n关于 `text-color` 和 `bg-color` 属性，您应该知道\
  \ Report Designer 具有从视觉编辑器中选取颜色的有用工具。以下图像显示了视觉编辑器的外观。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_202_0.png)\n\
  \n> *作为练习，从第 4 章《使用 Report Designer 创建报表》中开发的 `report_02.prpt` 开始，并将整个报表的行高（即在 `Master\
  \ Report` 中）修改为 30 像素。要查看最终结果，您可以检查 GitHub 仓库中 `Chapter 05 - Design and layout in\
  \ Report Designer/my_reports` 文件夹中存储的 `report_08.prpt` 文件。*\n\n组合\n\n调色板\n\n新建\n\
  \n旧\n\nH: 0 °\n\nS: 0 %\n\nB: 0 %\n\nR: 0\n\nG: 0\n\nB: 0\n\n#\n\n示例文本 示例文本\n\n\
  示例文本 示例文本\n\n示例文本 示例文本\n\n确定\n\n取消\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_203_0.png)\n\
  \n## 文本间距属性\n\n文本间距属性让您可以控制文本元素中字母和单词之间的间距。\n\n| Name | Type | Description |\n|---|---|---|\n\
  | character | Integer | 指定两个字母之间最小字符间距 |\n| word | Integer | 指定渲染时单词之间的额外填充 |\n\
  | preferred-character | Integer | 指定两个字母之间首选字符间距 |\n| max-character | Integer |\
  \ 指定两个字母之间的最大间距 |\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_204_0.png)\n\n*作为练习，从通常的\
  \ `report_02.prpt` 开始，将字符距离修改为 5.0 像素。要查看最终结果，您可以检查 GitHub 仓库中 `Chapter 05 - Design\
  \ and layout in Report Designer/my_reports` 文件夹中存储的 `report_09.prpt` 文件。*\n\n##\
  \ 对象属性\n\n`object` 属性控制元素的整体外观，如下表所述：\n\n| Name | Type | Description |\n|---|---|---|\n\
  | anti-alias | Boolean | 指示在绘制元素期间是否启用抗锯齿的标志。 |\n| keep-aspect-ratio | Boolean |\
  \ 指示缩放是否应保持纵横比的标志。 |\n| fill | Boolean | 指示元素是否应被填充的标志。 |\n| fill-color | Selection\
  \ | 定义填充颜色。如果未定义，则使用前景色。 |\n| draw-outline | Boolean | 定义是否应绘制元素轮廓。 |\n| stroke\
  \ | Selection | 定义用于渲染元素的笔类型和宽度。 |\n| scale | Boolean | 指示元素中打印的内容是否应缩放以适应元素边界的标志。\
  \ |\n\n## 链接属性\n\n`Links` 属性管理从报表元素创建的 HTML 链接：\n\n| Name | Type | Description |\n\
  |---|---|---|\n| `pdf-bookmark` | String | 在 PDF 输出中添加书签 |\n| `html-anchor` | String\
  \ | 嵌入 HTML 输出中的锚点（链接目标）的名称 |\n| `url` | String | 链接的目标 URL |\n| `url-tooltip` |\
  \ String | 链接的标题，以工具提示显示 |\n| `url-window-target` | String | 链接应打开的目标窗口 |\n\n##\
  \ Excel 属性\n\n这是一组与 Microsoft Excel 相关的属性：\n\n| Name | Type | Description |\n|---|---|---|\n\
  | sheet-name | String | 渲染频段的工作表名称。 |\n| format-override | String | Excel 单元格数据格式字符串。\
  \ |\n| formula-override | String | Excel 单元格数据公式字符串。 |\n| wrap-text-override | Boolean\
  \ | 如果为 true，则在 Excel 单元格内换行基于文本的报表元素文本。此值由频段内的基于文本的报表元素继承。 |\n| indentation-text\
  \ | Integer | 缩进的字符数。 |\n\n\n\n\n## 页面行为属性\n\n页面行为属性会影响频段相对于单个页面的渲染方式（仅适用于频段）：\n\
  \n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `display-on-firstpage` | Boolean | 指示元素是否应在第一页中显示的标志。仅提供给页面页眉/页脚频段。\
  \ |\n| `display-on-lastpage` | Boolean | 指示元素是否应在最后一页中显示的标志。仅提供给页面页眉/页脚频段。 |\n|\
  \ `sticky` | Boolean | 指示页面页眉/页脚以及来自 `Master Report` 的重复组页眉/页脚是否应在子报表中重复的标志。 |\n\
  | `avoid-page-break` | Boolean | 强制频段跳到下一页而不是拆分渲染。 |\n| `pagebreak-before` | Boolean\
  \ | 在渲染频段之前放置分页符。 |\n| `pagebreak-after` | Boolean | 在渲染频段之后放置分页符。 |\n| `orphans`\
  \ | Integer | 发生分页符前需要分组的连续频段数量。 |\n| `widows` | Integer | 发生分页符后需要分组的连续频段数量。 |\n\
  | widow-orphan-opt-out | Boolean | 指示是否包含或不包含来自孤行计数的频段的标志。 |\n| repeat-header |\
  \ Boolean | 指示页眉/页脚是否应在每页打印中重复的标志（仅页眉和页脚元素）。 |\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_209_0.png)\n\
  \n作为练习，从第 4 章《使用报表设计器创建报表》中开发的 `report_02.prpt` 开始，将 `Group Header` 的 `repeat-header`\
  \ 属性设置为 true。要查看最终结果，可以检查存储在 GitHub 仓库的 `Chapter 05 - Design and layout in Report\
  \ Designer/my_reports` 文件夹中的 `report_10.prpt` 文件。\n\n## 填充属性\n\n这些属性定义频段的填充和边框定义。边框信息包括厚度、线型和颜色。可以通过选择频段然后单击\
  \ Format | Size & Border... 菜单项一起编辑这些属性，或在报表元素 Styles 选项卡中单独编辑。您可以在 *Size and position\
  \ properties* 部分的图像中参考窗口的外观示例：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| top | Decimal\
  \ | 元素的顶部填充高度 |\n| bottom | Decimal | 元素的底部填充高度 |\n| left | Decimal | 元素的左侧填充宽度\
  \ |\n| right | Decimal | 元素的右侧填充宽度 |\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_210_0.png)\n\
  \n*作为练习，从第 4 章《使用报表设计器创建报表》中开发的 `report_02.prpt` 开始，将 `POSITIONTITLE` 文本字段的左侧填充设置为\
  \ 20。要查看最终结果，可以检查存储在 Chapter 05 - Design and layout in Report Designer/my_reports\
  \ 文件夹中的 `report_11.prpt` 文件。*\n\n## 边框属性\n\n这组属性控制元素周围边框的颜色、纹理和大小，如下表所述：\n\n| 名称\
  \ | 类型 | 描述 |\n|---|---|---|\n| top-style | Selection | 顶部边框的样式。样式值包括 `solid`、`dashed`、`dot-dash`、`dot-dot-dash`、`dotted`、`double`、`hidden`、`none`、`groove`、`ridge`、`inset`\
  \ 和 `outset`。 |\n| top-size | Decimal | 顶部边框的宽度。 |\n| top-color | String | 顶部边框的颜色。\
  \ |\n| left-style | Selection | 左侧边框的样式。样式值包括 `solid`、`dashed`、`dot-dash`、`dot-dot-dash`、`dotted`、`double`、`hidden`、`none`、`groove`、`ridge`、`inset`\
  \ 和 `outset`。 |\n| left-size | Decimal | 左侧边框的宽度。 |\n| left-color | String | 左侧边框的颜色。\
  \ |\n| right-style | Selection | 右侧边框的样式。样式值包括 `solid`、`dashed`、`dot-dash`、`dot-dot-dash`、`dotted`、`double`、`hidden`、`none`、`groove`、`ridge`、`inset`\
  \ 和 `outset`。 |\n| right-size | Decimal | 右侧边框的宽度。 |\n| `right-color` | String |\
  \ 右侧边框的颜色。 |\n| `bottom-style` | Selection | 底部边框的样式。样式值包括 `solid`、`dashed`、`dot-dash`、`dot-dot-dash`、`dotted`、`double`、`hidden`、`none`、`groove`、`ridge`、`inset`\
  \ 和 `outset`。 |\n| `bottom-size` | Decimal | 底部边框的宽度。 |\n| `bottom-color` | String\
  \ | 底部边框的颜色。 |\n| `break-style` | Selection | 如果元素被拆分，则这是断裂处边框的样式。样式值包括 `solid`、`dashed`、`dot-dash`、`dot-dot-dash`、`dotted`、`double`、`hidden`、`none`、`groove`、`ridge`、`inset`\
  \ 和 `outset`。 |\n| `break-size` | Decimal | 如果元素被拆分，则这是断裂处边框的宽度。 |\n| `break-color`\
  \ | String | 如果元素被拆分，则这是断裂处边框的颜色。 |\n| `top-left-width` | Decimal | 左上角圆角的宽度。 |\n\
  | `top-left-height` | Decimal | 左上角圆角的高度。 |\n| `top-right-width` | Decimal | 右上角圆角的宽度。\
  \ |\n| `top-right-height` | Decimal | 右上角圆角的高度。 |\n| `bottom-left-radius-width`\
  \ | Decimal | 左下角圆角的宽度。 |\n| `bottom-left-radius-height` | Decimal | 左下角圆角的高度。 |\n\
  | `bottom-right-radius-width` | Decimal | 右下角圆角的宽度。 |\n| `bottom-right-radius-height`\
  \ | Decimal | 右下角圆角的高度。 |\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_213_0.png)\n\
  \n作为练习，从第 4 章《使用报表设计器创建报表》中开发的 `report_01.prpt` 开始，仅添加顶部边框，样式为虚线，宽度为 1.0 像素。要查看最终结果，可以检查存储在\
  \ Chapter 05 - Design and layout in Report Designer/my_reports 文件夹中的 `report_12.prpt`\
  \ 文件。\n\n## 属性中的通用属性\n\n从这里开始，属性集与 `attributes` 选项卡相关，而与 `style` 选项卡无关。此属性集包含作为属性的通用项。\n\
  \n| 名称 | 类型 | 描述 |\n|---|---|---|\n| hide-on-canvas | Boolean | 指示元素是否应隐藏或在报表中使用标志。根据频段类型，默认值不同。\
  \ |\n| type | String | 不可修改。表示元素的类型。 |\n| group | String | 定义分组的字段。 |\n| name |\
  \ String | 您希望分配给此元素的名称。 |\n| if-null | String | 如果定义的字段或值返回 null，则显示此处定义的值。 |\n\
  | style-class | String | 分配给元素的样式类。 |\n| id | String | 元素的唯一标识符。 |\n\n## 查询元数据属性\n\
  \n这组属性控制查询的元数据：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| data-format | Boolean | 指示数字或日期元素是否应使用报表向导格式化的标志。\
  \ |\n| style-format | Boolean | 指示是否请求使用来自报表设计向导或数据源的样式格式化的标志。 |\n| enable-style-bold\
  \ | Boolean | 指示特定样式是否启用的标志。 |\n| enable-style-italics | Boolean | 指示特定样式是否启用的标志。\
  \ |\n| enable-style-underline | Boolean | 指示特定样式是否启用的标志。 |\n| enable-style-strikethrough\
  \ | Boolean | 指示特定样式是否启用的标志。 |\n| enable-style-font | Boolean | 指示特定样式是否启用的标志。 |\n\
  | enable-style-fontsize | Boolean | 指示特定样式是否启用的标志。 |\n| enable-style-color | Boolean\
  \ | 指示特定样式是否启用的标志。 |\n| enable-style-background-color | Boolean | 指示特定样式是否启用的标志。\
  \ |\n| enable-style-valignment | Boolean | 指示特定样式是否启用的标志。 |\n| enable-style-alignment\
  \ | Boolean | 指示特定样式是否启用的标志。 |\n\n## 向导属性\n\n这组属性与设计向导相关：\n\n| 名称 | 类型 | 描述 |\n\
  |---|---|---|\n| `generated-content-marker` | Boolean | 如果启用，则清除所有受 `generated-content-marker`\
  \ 属性影响的频段并从头开始。 |\n| `label-detail-header` | Selection | 定义明细频段页眉。 |\n| `show-changes`\
  \ | Boolean | 指示是否显示更改的标志。 |\n| `grid-style` | Selection | 网格的样式。样式值包括 `solid`、`dashed`、`dot-dash`、`dot-dot-dash`、`dotted`、`double`、`hidden`、`none`、`groove`、`ridge`、`inset`\
  \ 和 `outset`。 |\n| `grid-width` | Decimal | 网格使用的宽度。 |\n| `grid-color` | String\
  \ | 网格使用的颜色。 |\n| `padding-top` | Decimal | 填充值。 |\n| `padding-left` | Decimal |\
  \ 填充值。 |\n| `padding-bottom` | Decimal | 填充值。 |\n| `padding-right` | Decimal | 填充值。\
  \ |\n\n\n\n\n## HTML 属性\n\n本组属性用于定义和控制 HTML 渲染：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n\
  | class<br>name<br>title<br>xml-id | String | 表示 HTML class、name、title 和 xml-id\
  \ 属性的属性 |\n| append-header | String | 将此属性中输入的文本插入到 HTML 输出的 <header> 标签中 |\n| append-body\
  \ | String | 将此属性中输入的文本插入到 HTML 输出的 <body> 标签中 |\n| append-body-footer | String\
  \ | 将此属性中输入的文本插入到 HTML 输出的 <footer> 标签中 |\n| suppress-content | Boolean | 标志指示是否请求在\
  \ HTML 输出中对具有 raw-content 的单元格抑制生成的内容 |\n\n## 属性中的 Excel 属性\n\n本组属性用于定义和控制 Microsoft\
  \ Excel 渲染：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| formula | String | 在 Excel 格式中用作公式的字符串\
  \ |\n| page-header-text | String | 将字符串附加到 Excel 页眉 |\n| page-footer-text | String\
  \ | 将字符串附加到 Excel 页脚 |\n\n## HTML-events、PDF-events 和 Swing-events 属性\n\n本节包含的属性组将在本书后面更详细地描述，但在此引入是为了完善与\
  \ bands 和 `Master Report` 相关的元素属性文档。\n\n### HTML-events 属性\n\n本组属性与报告以 HTML 格式生成时触发的\
  \ `HTML-events` 相关：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| on-click | String | 在\
  \ HTML 格式中用作公式的字符串 |\n| on-double-click | String | 在 HTML 格式中用作公式的字符串 |\n| on-mouse-down\
  \ | String | 在 HTML 格式中用作公式的字符串 |\n| on-mouse-up | String | 在 HTML 格式中用作公式的字符串 |\n\
  | on-mouse-move | String | 在 HTML 格式中用作公式的字符串 |\n| on-mouse-over | String | 在 HTML\
  \ 格式中用作公式的字符串 |\n| on-mouse-enter | String | 在 HTML 格式中用作公式的字符串 |\n| on-mouse-out\
  \ | String | 在 HTML 格式中用作公式的字符串 |\n| on-key-down | String | 在 HTML 格式中用作公式的字符串 |\n\
  | on-key-pressed | String | 在 HTML 格式中用作公式的字符串 |\n| on-key-up | String | 在 HTML\
  \ 格式中用作公式的字符串 |\n\n### Pdf-events 属性\n\n本组属性与报告以 PDF 格式生成时触发的 `pdf-events` 相关：\n\
  \n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `script` | String | PDF 中脚本的名称 |\n\n### Swing-events\
  \ 属性\n\n本组属性与报告在 **Swing（Java）框架** 中使用时触发的 `swing-events` 相关。Swing 是 Java 的 GUI\
  \ 小部件工具包。它是 Oracle 的 **Java 基础类（JFC）** 的一部分——用于为 Java 程序提供 **图形用户界面（GUI）** 的 API。\n\
  \n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `action` | String | Java 方法 |\n| `tooltip`\
  \ | String | 工具提示的内容 |\n\n## Master Report 属性\n\n如本章开头所述，`Master Report` 是树对象结构的根元素，表示报告资源管理器中的报告。即使\
  \ `Master Report` 在报告画布中不可见，它也是报告开发的关键元素，因为它使您只需更改一个元素即可将所有更改传播到整个报告（得益于通用属性的继承）。\n\
  \n在本节中，您将了解 `Master Report` 元素的特定属性，除前几节所述的属性外。\n\n### 大小和位置属性\n\n`Master Report`\
  \ 仅包含该组中的少数属性。所有与位置相关的属性（`x`、`y`、`width`、`height` 等）均未提供，因为它们对根元素没有用处。\n\n### 文本属性\n\
  \n除 `h-align` 和 `v-align` 外，所有属性均提供。\n\n### 页面行为属性\n\n该组属性不适用于 `Master Report` 元素。\n\
  \n### 查询属性\n\n该组属性仅为 Master Report 提供，包含查询管理的属性：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n\
  | query | String | 为所选查询分配名称。如果您使用 JDBC 自定义数据源，请使用名称字段。 |\n| limit | Integer | 查询执行和行检索的限制。值\
  \ -1 表示无限制。 |\n| timeout | Integer | 查询的超时限制。 |\n| design-timeout | Integer | 从\
  \ Report Designer 运行时的超时限制。 |\n| auto-sort | Boolean | 标志指示是否请求自动排序。 |\n| shared-connection\
  \ | Boolean | 标志指示连接是否共享给子报告。 |\n| data-cache | Boolean | 确定参数结果集是否被缓存，这将减少在渲染报告中切换参数时的重新加载时间。此选项可通过\
  \ org.pentaho.reporting.engine.classic.core.cache.InMemoryCache.CachableRowLimit\
  \ 和 org.pentaho.reporting.engine.classic.core.cache.InMemoryCache.MaxEntries 引擎设置进一步配置。默认值为\
  \ `true`。 |\n\n### 属性选项卡中的通用属性\n\n在该组属性中，`Master Report` 元素不提供 `hide-on-canvas`\
  \ 属性，并具有一些额外的特定属性：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `output-format` | Selection\
  \ | 设置报告的首选输出类型。选择项从长长的可用格式列表中启用。 |\n| `lock-output-format` | Boolean | 锁定 `output-format`\
  \ 属性中指定的输出类型，以便无法选择其他输出类型。默认值为 `false`。 |\n| `compatibility-level` | Selection |\
  \ 与 Report Engines 早期版本兼容的级别。 |\n| `style-sheet-reference` | String | 引用要在报告中包含的样式表。\
  \ |\n\n### 助手属性\n\n在该组属性中，`Master Report` 元素不提供 `generated-content-marker` 属性，并具有一个额外的特定属性：\n\
  \n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `wizard-enabled` | Boolean | 如果启用，则清除受 `generated-content-marker`\
  \ 属性影响的所有 bands 并从头开始 |\n\n### Excel 属性\n\n在该组属性中，`Master Report` 元素不提供 `page-header-*`\
  \ 属性，并具有几个额外的特定属性：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `freezing-left-position`\
  \ | String | 此属性的目标是为 Pentaho Reporting 开发者提供在 Excel 中选择要冻结的窗格的能力 |\n| `freezing-right-position`\
  \ | String | 此属性的目标是为 Pentaho Reporting 开发者提供在 Excel 中选择要冻结的窗格的能力 |\n\n### 高级属性\n\
  \n该组属性仅为 `Master Report` 提供：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n| `pre-processor`\
  \ | String | 报告 **预处理器** 是可添加到主报告或子报告的自定义组件。此组件提供了一种方法，可在每次报告运行时自动修改现有报告定义。预处理器在报告引擎启动过程中注册。您不能使用未在报告引擎元数据系统中注册的预处理器实现。\
  \ |\n\n### Pentaho 属性\n\n该组属性仅为 `Master Report` 提供：\n\n| 名称 | 类型 | 描述 |\n|---|---|---|\n\
  | visible | Boolean | 标志设置报告是否可见 |\n| staging-mode | Selection | 选择指示在将报告发送回客户端之前如何暂存报告\
  \ |\n| report-cache<br>dynamic-report-cache | Boolean | 控制报告缓存的标志 |\n\n\n\n\n##\
  \ 页眉和页脚属性\n\n`Page Header` 和 `Page Footer` 频段出现在每个页面的开头和结尾，由特定的输出格式决定。\n\n这些频段与之前定义的通用属性略有不同。`pagebreak-before`\
  \ 和 `pagebreak-after` 属性不适用于这些频段。此外，除了默认值外，还提供以下属性：`display-on-firstpage`、`display-on-lastpage`\
  \ 和 `sticky`。\n\n除通用属性外，还提供了 `table` 集合，包含以下属性：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n\
  | `col-span` | Integer | HTML 渲染时的列跨度 |\n| `row-span` | Integer | HTML 渲染时的行跨度 |\n\
  \n在 `excel` 集合中，`page-header-left`、`page-header-center` 和 `page-header-right` 以十进制值提供。\n\
  \n## 报表页眉和报表页脚属性\n\n`Report Header` 和 `Report Footer` 出现在报表的开头和结尾，通常用于显示标题和汇总信息，如图表、目录等。`Report\
  \ Header` 和 `Report Footer` 在通用集合之外还具有 `table` 集合作为附加属性。\n\n## 组页眉和组页脚属性\n\n`Group\
  \ Header` 和 `Group Footer` 频段可能为报表中配置的每个已定义组出现。报表中定义的分组是一组在选定数据列中具有相同值的数据。 当定义分组列中的值发生变化时，会触发新的组。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_236_0.png)\n\n> *将作为分组定义的列在传递到 Pentaho\
  \ Reporting 之前进行适当排序至关重要，否则在渲染的报表中可能会出现重复的组。*\n\n`Group Header` 和 `Footer` 与之前定义的通用属性略有不同，因为除了默认值外，还提供以下属性：`repeat-header`、`sticky`、`page-header-left`、`page-header-center`\
  \ 和 `page-header-right`。`Group Header` 和 `Footer` 在通用集合之外还具有 `table` 集合作为附加属性。\n\
  \n## 详细信息主体属性\n\n`Details Body` 由四个不同的频段组成。`Details Header` 和 `Details Footer` 频段在明细行分组之前和之后渲染。`Details`\
  \ 频段为每行数据渲染一次，而在报表没有可用数据时渲染 `No Data` 频段。`Details Header`、`Details Footer` 和 `No\
  \ Data` 频段在 Report Designer 中默认隐藏。\n\n`Detail Header` 和 `Detail Footer` 频段与组频段共享相同的附加属性\
  \ `sticky`、`repeat-header`、`page-header-left`、`page-header-center` 和 `page-header-right`。此外，`table`\
  \ 集合作为通用集合之外的附加属性提供。`table` 属性集合也提供给 `No Data` 频段。其余明细频段未定义超出通用属性集合的附加属性。\n\n##\
  \ 水印属性\n\n`watermark` 频段出现在所有其他频段之后，用于报表的背景图像和样式。`watermark` 频段在通用集合之外还具有 `table`\
  \ 集合作为附加属性。\n\n## 报表元素\n\n所有可用的 **报表元素** 都会出现在调色板中，可以拖放到报表画布中。报表元素构成了报表的內容。它们范围从标签和文本元素到图形、图表和子报表元素。\n\
  \n与频段类似，其他报表元素也会显示在报表资源管理器结构选项卡中，属性列表可在报表元素属性中获得。与上一节描述的元素类似，报表元素也会继承其父元素的现有属性，并将通用属性传播到子元素。\n\
  \n在本节中，您将了解调色板中每种类型元素的相关属性。正如我们在上一节关于频段中所看到的，您将从通用属性开始，然后查看每个元素的详细描述。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_239_0.png)\n\
  \n> *在本例中也适用本书前面分享的建议：尽可能多地使用元素和 Report Designer 进行操作以获得直接体验。如果尝试向示例报表添加元素，可以在面板中查看属性并尝试更改值，记住其行为。再次，直接体验是最好的老师。*\n\
  \n## 通用属性\n\n与频段和 `Master Report` 类似，报表元素也有按组组织的通用属性，以便更好地理解。幸运的是，报表元素的绝大多数通用属性与您为频段所见的通用属性相同。\n\
  \n考虑到这一点，这很有道理，因为报表元素的属性嵌套在频段中，因此自然会发现频段的一些（或全部）通用属性被继承到子元素中。\n\n考虑到报表元素非常具体，针对一个目的（标签、图表、来自数据源的字段、形状等），频段的一些属性会被继承到某些报表元素中，而不会被继承到其他元素中。无论如何，您将在专门针对每种报表元素类型的章节中找到详细的差异。\n\
  \n回到通用属性；以下是属性集合的详细描述。\n\n## 大小和位置属性\n\n此属性集合与您为频段和 `Master Report` 所见的相同，在有意义的地方。`Layout`\
  \ 用于所有可以根据报表拉伸或修改宽度/长度的报表元素。\n\n## 字体属性\n\n此属性集合与您为频段和 `Master Report` 所见的相同，在有意义的地方。对于某些报表元素，如形状和线条，字体属性不可用，因为不使用文本。\n\
  \n## 文本和文本间距属性\n\n这两个属性集合与您为频段和 `Master Report` 所见的相同，在有意义的地方。对于某些报表元素，如形状、`simple-barcodes`、`survey-scale`\
  \ 和线条，`text` 和 `text-spacing` 属性仅限于以下属性：`h-align`、`v-align`、`text-color` 和 `bg-color`。\n\
  \n## 旋转属性\n\n此集合在此首次引入，仅适用于基于文本的元素，如标签等：\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n\
  | `rotation` | Selection | 旋转，值为 90 或 -90 |\n\n## 对象属性\n\n此属性集合与您为频段和 `Master Report`\
  \ 所见的相同。对于某些报表元素，如形状、`simple-barcodes`、`survey-scale`、图像和线条，`object` 属性扩展了该集合所有可用的属性。\n\
  \n## 链接属性\n\n此属性集合与您为频段和 `Master Report` 所见的相同。对于某些报表元素，如形状、`simple-barcodes`、`survey-scale`、图像和线条，不提供\
  \ `pdf-bookmark` 属性。\n\n## Excel 属性\n\n此属性集合与您为频段和 `Master Report` 所见的相同，在有意义的地方。对于某些报表元素，如形状、`survey-scale`、`simple-barcodes`\
  \ 和线条，`excel` 属性不可用，因为它们不是必需的。在某些情况下，例如图像，不提供 `sheet-name` 和 `format-override` 属性。\n\
  \n## 页面行为属性\n\n此属性集合由您为频段和 `Master Report` 所见的属性的子集组成，特别是 `avoid-page-break`、`orphan`、`widows`\
  \ 和 `widow-orphan-opt-out`。在某些情况下，例如频段和子报表元素，还提供 `pagebreak-before` 和 `pagebreak-after`\
  \ 属性。\n\n## 内边距和边框属性\n\n这些属性集合与您为频段和 `Master Report` 所见的完全相同。\n\n\n\n## 属性中的通用属性\n\
