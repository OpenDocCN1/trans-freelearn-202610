  \ 入门* 中开发的 Pentaho 报表。正如您可能还记得的，我们看到了如何使用 Report Design Wizard 创建 Pentaho 报表，并将其命名为\
  \ `my_first_report`。\n\n与 Pentaho Reporting SDK 中介绍的示例不同，在本书中我们将使用 Apache Maven，这是\
  \ Java 最常用的软件项目管理和理解工具。\n\n为了更好地描述任务并让您有机会测试正确的结果，我们将项目拆分为几个子任务：每个任务一个段落，并附带源代码和屏幕截图，以确保您能在自己的环境中成功重现示例。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_125_0.png)\n\n*在 GitHub 仓库 https://github.com/fcorti/pentaho-8-reporting\
  \ 中，您可以找到本书示例中描述的源代码。在 `Chapter 03 - Getting started with Reporting SDK/pentaho-reporting-web-app`\
  \ 中，您可以找到这些示例的源代码。*\n\n## 环境的前提条件\n\n在第 2 章 *使用 Report Designer 入门* 中，我们介绍了环境应具备的唯一前提条件：Sun\
  \ 的 JDK 版本 8。考虑到我们将使用 Apache Maven，请确保已在开发环境中安装它。建议的版本为 3 或更新版本。要验证安装，请从命令行运行以下命令：**mvn\
  \ --version**\n\n如果正确安装，您将看到与以下屏幕截图类似的内容：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_126_0.png)\n\
  \n如果尚未安装，Apache Maven 的安装过程很简单，只需解压归档文件并将包含 `mvn` 命令的 `bin` 文件夹添加到 `PATH`。有关如何在环境中安装\
  \ Apache Maven 的更多详细信息，请查看官方网页 https://maven.apache.org/install.html。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_126_1.png)\n\
  \n> *另一个明显的必要条件是您的机器/环境可访问互联网。Apache Maven 基于公共仓库的理念，命令从中获取库、源代码以及编译和运行应用程序所需的一切。请确保在执行以下任务期间笔记本电脑已连接到互联网。*\n\
  \n## 在 Java 中创建 Web 应用程序\n\n现在您的开发环境已正确设置，下一步是创建一个新的 Java Web 应用程序。如果您已有现有 Web 应用程序并想将\
  \ Pentaho Engine 包含在其中，此特定任务可能不感兴趣您。然而，为了完整性，我们更愿意涵盖开发的整个生命周期，假设您将在自己的环境中尝试示例以便更好地理解。\n\
  \n让我们从头开始创建一个 Java Web 应用程序，然后在编译和首次运行之前添加初始页面。\n\n## 使用 Apache Maven 创建 Java Web\
  \ 应用程序\n\n使用 Apache Maven 从头开始创建 Java Web 应用程序很简单，得益于 Maven Archetypes。简而言之，Archetype\
  \ 是 Maven 项目模板工具包，定义为一种原始模式或模型，所有同类事物都由此制作。对于我们的需求，我们将使用 `maven-archetype-webapp`\
  \ 来启动一个简单的 Web 应用程序。\n\n> *在本書中，我们不会详细介绍 Maven Archetypes，并假设您熟悉其使用和行为的基础知识。如果不熟悉也没关系，因为我们将描述逐步的方法。如果您想了解更多，请阅读\
  \ Apache Maven 文档 https://maven.apache.org/guides/introduction/introduction-to-archetypes.html。*\n\
  \n回到我们的任务，在机器中确定一个文件夹来放置新的 Java 应用程序（我们将使用 `Desktop`）。打开终端，移动到工作文件夹（在我们的例子中为 `Desktop`），并执行以下命令：\n\
  \n```\nmvn archetype:generate\n-DarchetypeArtifactId=maven-archetype-webapp\n-DinteractiveMode=false\n\
  -DgroupId=com.example\n-DartifactId=pentaho-reporting-web-app\n```\n\n查看命令，`archetypeArtifactId`\
  \ 参数指定 Maven Archetype，`interactiveMode` 参数告诉 Maven 是否向用户提问（或不使用默认值），`groupId` 参数定义\
  \ Java 源代码的根包，`artifactId` 参数定义 Web 应用程序的名称。\n\n> *注意，一个名为 `pentaho-reporting-web-app`\
  \ 的全新文件夹将被创建。新文件夹将包含整个项目，包括配置文件、库、源代码和资源。此文件夹是存储在版本控制仓库（GitHub、SVN 等）中的自然候选。*\n\n\
  \n\n你会看到命令的执行非常冗长，终端上会显示大量日志信息。日志信息描述了你正在下载所有库和配置文件，以及创建、编译和运行新的 Java Web 应用所需的一切。过一段时间后，你应该会看到类似于以下截图的消息：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_129_0.png)\n\n检查文件系统，会创建一个名为 `pentaho-reporting-web-app`\
  \ 的全新文件夹，其中包含与你的 Java Web 应用相对应的整个项目。花点时间深入了解其结构以理解组成（正如你将看到的，它非常简单直接）。\n\n我们在这里不会详细介绍使用\
  \ Apache Maven 创建的 Java 项目的解剖结构（你只需谷歌一下就能找到大量描述细节的资源），但所有魔法都通过 `pom.xml` 文件实现，用于声明编译、测试并成功运行项目所需的一切。\n\
  \n在认为任务完成之前，让我们将 Eclipse Jetty 添加到项目中。Eclipse Jetty (http://www.eclipse.org/jetty)\
  \ 是一个 Java HTTP（Web）服务器和 Java Servlet 容器，以开源形式发布，可用于商业用途和分发。要在项目中包含 Eclipse Jetty，请将以下\
  \ XML 代码添加到位于 `pentaho-reporting-web-app` 文件夹中的 `pom.xml` 文件：\n\n```\n<project ...>\n\
  \  ...\n  <dependencies>\n    ...\n  </dependencies>\n  <build>\n    <finalName>pentaho-reporting-web-app</finalName>\n\
  \n    <!-- Add This here. -->\n    <plugins>\n      <plugin>\n<groupId>org.apache.maven.plugins</groupId>\n\
  <artifactId>maven-dependency-plugin</artifactId>\n<executions>\n    <execution>\n\
  \        <phase>package</phase>\n        <goals><goal>copy</goal></goals>\n    \
  \    <configuration>\n            <artifactItems>\n                <artifactItem>\n\
  \                    <groupId>org.eclipse.jetty</groupId>\n                    <artifactId>jetty-runner</artifactId>\n\
  \                    <version>9.4.4.v20170414</version>\n                    <destFileName>jetty-runner.jar</destFileName>\n\
  \                </artifactItem>\n            </artifactItems>\n        </configuration>\n\
  \    </execution>\n</executions>\n</plugin>\n</plugins>\n</build>\n</project>\n\
  ```\n\n保存 pom.xml 文件后，项目即可以初始版本进行编译。要编译 Java Web 应用，请打开终端，进入 pentaho-reporting-web-app\
  \ 文件夹，并运行 mvn package。执行结束时，会出现类似于之前截图的 BUILD SUCCESS 消息，并且你会在 pentaho-reporting-web-app\
  \ 中找到一个名为 target 的新文件夹。\n\n要在 Eclipse Jetty 服务器中部署 WAR 包并运行它，只需执行以下命令：\n\n```\n\
  java -jar target/dependency/jetty-runner.jar target/*.war\n```\n\n几秒钟后，经过几行日志信息，Web\
  \ 应用将在 8080 端口上启动并运行。以下截图显示了在浏览器中打开页面 http://localhost:8080 时应有的样子：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_130_0.png)\n\
  \n要停止 Eclipse Jetty 服务器，请通过按 Ctrl + C 或根据你的操作系统按下类似的按钮组合来中断前一个命令的执行。\n\n## Creating\
  \ the first page of the Java web application\n\n现在 `pentaho-reporting-web-app` 文件夹中已创建新项目，让我们添加第一个页面作为\
  \ Java Web 应用的端点。在 Java Web 应用中创建页面非常简单，这要归功于 Java Servlet。\n\n> *在本書中，我們不會詳細介紹\
  \ Java Servlet，並且假設你對它們的使用和行為的基礎有信心。如果不是，請不要擔心，因為我們將描述一種逐步的方法來引導你創建 Java Web 應用。要了解更多，請使用\
  \ Google 找到最適合你的教程：Java Servlet 是開發 Java Web 應用中頁面（和端點）的知名解決方案。*\n\n要将 Java Servlet\
  \ API 添加到项目中，请将以下 XML 代码添加到位于 `pentaho-reporting-web-app` 文件夹中的 `pom.xml` 文件：<project\
  \ ...>\n\n```xml\n...\n<dependencies>\n...\n\n<!-- Add This here. -->\n<dependency>\n\
  <groupId>javax.servlet</groupId>\n<artifactId>javax.servlet-api</artifactId>\n<version>3.1.0</version>\n\
  </dependency>\n\n</dependencies>\n<build>\n...\n</build>\n</project>\n```\n\n保存\
  \ `pom.xml` 文件后，创建以下文件夹结构 `pentaho-reporting-web-app/src/main/java/com/example`，以及一个名为\
  \ `PentahoServlet.java` 的新文件。在 `PentahoServlet.java` 中，写入以下内容：\n\n```java\npackage\
  \ com.example;\n\nimport javax.servlet.ServletException;\nimport javax.servlet.http.HttpServlet;\n\
  import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
  import java.io.IOException;\nimport java.io.PrintWriter;\n\npublic class PentahoServlet\
  \ extends HttpServlet {\n\n@Override\npublic void doGet(\nHttpServletRequest request,\n\
  HttpServletResponse response)\nthrows ServletException, IOException {\n\ndoPost(request,\
  \ response);\n\n}\n\n@Override\npublic void doPost(\nHttpServletRequest request,\n\
  HttpServletResponse response)\nthrows ServletException, IOException {\n\nPrintWriter\
  \ out = response.getWriter();\nout.println(\"PentahoServlet Executed\");\nout.flush();\n\
  out.close();\n\n}\n}\n```\n\n此 Java 代码在 GET 方法调用和 POST 方法调用的情况下创建 Servlet 的响应。在这两种情况下，结果都会显示简单的\
  \ PentahoServlet Executed 消息。\n\n保存 PentahoServlet.java 文件后，是时候使用以下配置更新存储在 pentaho-reporting-web-app/src/main/webapp/WEB-INF\
  \ 文件夹中的 web.xml 文件了：...\n\n```xml\n<web-app>\n<display-name>Archetype Created Web\
  \ Application</display-name>\n\n<!-- Add This here. -->\n<servlet>\n<servlet-name>reporting</servlet-name>\n\
  <servlet-class>com.example.PentahoServlet</servlet-class>\n</servlet>\n<servlet-mapping>\n\
  <servlet-name>reporting</servlet-name>\n<url-pattern>/reporting</url-pattern>\n\
  </servlet-mapping>\n\n</web-app>\n```\n\n这些设置在端点 /reporting 和 PentahoServlet 类之间创建了一个链接。保存\
  \ web.xml 文件后，项目即可再次编译和运行。要编译 Java Web 应用，请打开终端，进入 pentaho-reporting-web-app 文件夹，并运行以下命令：\n\
  **mvn clean**\n**mvn package**\n\n每个命令执行结束时，都应出现 BUILD SUCCESS 消息。在 package 命令结束时，target\
  \ 文件夹将包含名为 pentaho-reporting-web-app.war 的 WAR 包。要在 Eclipse Jetty 服务器中部署 WAR 包并运行它，请执行以下命令：\n\
  **java -jar target/dependency/jetty-runner.jar target/*.war**\n\n几秒钟后，经过几行日志信息，Web\
  \ 应用将在 8080 端口上启动并运行。以下截图显示了在浏览器中打开页面 http://localhost:8080/reporting 时应有的样子：\n\n\
  ![](img/9337ac94537bf7e092e1ea6531dce8fd_135_0.png)\n\n要停止 Eclipse Jetty 服务器，请通过按\
  \ Ctrl + C 或根据你的操作系统按下类似的按钮组合来中断前一个命令的执行。\n\n## Including Pentaho Reporting Engine\
  \ in a web application\n\n一旦使用 Apache Maven 创建了 Java Web 应用，下一步任务就是包含 Pentaho 报表引擎。得益于\
  \ Pentaho 的开放性，所有请求的构件都可在公共 Nexus 仓库 http://repository.pentaho.org 中获得。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_136_0.png)\n\
  \n*开源并不一定意味着免费。然而，与社区版相关的所有构件都是免费的，因此在下载和使用期间不应收取任何费用或成本。*\n\n请求的构件主要由定义 Pentaho\
  \ 报表引擎的所有 JAR 库组成（有关完整列表，请参阅第 1 章，*Pentaho Reporting 简介*）。要在你的 Java Web 应用中包含 Pentaho\
