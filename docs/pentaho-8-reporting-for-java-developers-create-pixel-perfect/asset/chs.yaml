  \n## 介绍包含的示例\n\nPentaho Reporting SDK 中包含五个有趣的示例。示例在 PDF 指南中有所描述，并附带介绍与 Reporting\
  \ Engine 交互的概述。PDF 指南中描述的所有源代码都可在 sample 文件夹中使用，且文件名与示例严格相关。以下是每个示例的简要描述供参考：\n\n\
  - `sample0`：基础类。`AbstractReportGenerator` 类被 `sample1` 和 `sample2` 继承。它包含创建报表的基本逻辑，将输入和输出的细节留给继承它的类。\n\
  - `sample1`：静态报表定义，JDBC 输入，PDF 输出。最简单的嵌入场景会生成静态报表（关于数据源或查询无用户输入），使用 Pentaho 提供的\
  \ `SampleData` HyperSQL 模式进行 JDBC 输入，并在本地文件系统上生成 PDF。\n- `sample2`：静态报表定义，JDBC 输入，HTML\
  \ 输出。此示例生成静态报表（关于数据源或查询无用户输入），使用 Pentaho 提供的 `SampleData` HyperSQL 模式进行 JDBC 输入，并在本地文件系统上生成\
  \ HTML 文件。\n- `sample3`：动态生成，JDBC 输入，Swing 输出。`Sample3.java` 生成的报表与 `sample1.java`\
  \ 中创建的相同，但它使用 Reporting Engine 中定义的 Swing 辅助类在 Swing 预览窗口中渲染报表。\n- `sample4`：动态生成，JDBC\
  \ 输入，Java servlet 输出。`Sample4.java` 是 `HttpServlet`，它生成类似于 `sample2` 的 HTML 报表。此示例假定您已安装、配置、运行并且可访问\
  \ Java 应用服务器，例如 Tomcat 或 JBoss。\n\n请在继续阅读以下段落的内容之前，先详细阅读 PDF 指南的内容以及五个示例的描述。如果您能在自己的环境中测试这些示例就太好了。如前一节所述，我们将继续介绍使用\
  \ Apache Maven 的不同方法。\n\n## 使用 Pentaho Reporting 和 Maven 创建 Web 应用程序\n\n在本节中，您将学习如何从头开始使用\
  \ Pentaho Reporting Engine 创建 Web 应用程序。如果您还想了解如何将 Pentaho Reporting Engine 嵌入到现有\
