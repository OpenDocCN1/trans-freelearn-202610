  | 转发字段列表 | 字符串数组 | 它是一个字段列表。根据哪个键匹配字段值，从列表中选择一个字段。 |\n\n## 资源包查找\n\n根据字段提供的键从资源包返回一个值。此函数的定义属性在下表中描述，除\
  \ `Field Name` 外：\n\n| 名称 | 类型 | 描述 |\n|------|------|------|\n| 资源包标识符 | 字符串 |\
  \ 资源包的名称 |\n\n## 开放公式（高级）\n\n此函数是公式表达式的有状态版本。此函数的定义属性在下表中描述，除 `Formula` 外：\n\n|\
  \ 名称 | 类型 | 描述 |\n|------|------|------|\n\n| | 初始化公式 | 字符串 | 如果指定，此公式将在 `Formula`\
  \ 函数首次调用时被求值，而不是求值默认公式 |\n\n## 图表数据和值数据函数\n\n图表相关函数已在前一章中详细介绍，因此在此列表中无需重复说明，其属性和行为完全相同。值相关函数主要包含\
  \ `Thermometer DataSet Collection`，已在前一章中介绍过。\n\n## 图片函数\n\n如图表和值数据函数所述，图片相关函数已在前一章中详细介绍，因此在此列表中无需重复说明，其属性和行为完全相同。\n\
  \n## 脚本函数\n\n脚本函数可通过各种脚本语言轻松自定义报表：\n\n| 名称 | 描述 |\n|------|-------------|\n| `Bean-Scripting\
  \ Framework (BSF)` | 该函数使用 Apache 的 Bean Scripting Framework 生成结果。有关 Bean Scripting\
  \ Framework 的更多信息，请参阅 http://jakarta.apache.org/bsf for more information on the\
  \ Bean Scripting Framework。The properties defined for this function are described\
  \ in the following table: |\n| `BeanShell (BSH)` | 该函数使用 BeanShell 框架生成结果。有关 BeanShell\
  \ 的更多信息，请参阅 http://www.beanshell.org for more information on BeanShell。该函数定义的属性与之前为\
  \ `Expression` 引入的属性相同。 |\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n|\
  \ `Expression` | String | 在指定编程语言中定义的表达式 |\n| `Expression Programming Language`\
  \ | String | 表达式中使用的编程语言 |\n| `Initialization Script` | String | 在指定编程语言中定义的脚本，在脚本语言环境初始化期间执行\
  \ |\n\n## 目录函数\n\n目录和索引在第 5 章 *Report Designer 中的设计和布局* 中作为报表元素引入。以下是与同一主题相关的函数说明：\n\
  \n| 名称 | 描述 |\n|------|-------------|\n| `Index Text Generator` | 它生成一个文本，作为定义漂亮目录的字符串集合。该函数定义的属性在下表中描述：\
  \ |\n| `Index Number Generator` | 它生成一个整数数组，定义漂亮的目录。该函数定义的属性与之前引入的属性相同：`Collect\
  \ Details` 和 Depth。 |\n\n| 名称 | 类型 | 描述 |\n|------|------|-------------|\n| `CollectDetails`\
  \ | Boolean | 定义是否应在数据收集中包含明细项。 |\n| `indexSeparator` | String | 定义索引元素之间使用的分隔符文本。默认为\
  \ .. |\n| `Depth` | Integer | 定义目录的层级数。 |\n| `Condensed Style` | Boolean | 定义是否在连续页码之间使用\
  \ -；例如，1, 2, 3, 4 将显示为 1-4。 |\n\n| 名称 | 描述 |\n|------|-------------|\n| Index Generator\
  \ | 索引生成器函数已在第 5 章 *Report Designer 中的设计和布局* 中详细介绍，因此在此无需重复说明，其属性和行为完全相同。 |\n| Table\
  \ of Contents Generator | 目录生成器函数已在第 5 章 *Report Designer 中的设计和布局* 中详细介绍，因此在此无需重复说明，其属性和行为完全相同。\
  \ |\n\n## 环境变量\n\n如果您将 Pentaho 报表发布到 Business Analytics Platform（有关介绍，请参阅第 15 章\
  \ *在 Pentaho Business Analytics Platform 中使用报表*），您可以使用某些环境变量来自定义和控制行为。环境变量在创建 Pentaho\
  \ 报表时默认可用，并位于报表资源管理器的 Data 选项卡中。以下屏幕截图显示了报表资源管理器在展开环境变量时的外观：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_455_0.png)\n\
  \n环境变量可像往常一样通过拖放将其放置到报表中的正确位置。以下是变量列表及其简要含义说明：\n\n| 名称 | 描述 |\n|------|-------------|\n\
  | `env:hostColonPort` | Business Analytics Platform 的主机名和端口号。 |\n| `env:locale`\
  \ | 有关请求报表的客户端区域设置的信息。`env:locale-language` 和 `env:locale-short` 是另外两个可用的变量。 |\n\
  | `env:pentahoBaseURL` | Business Analytics Platform 的完整 URL，如 base URL 属性中设置的那样。\
  \ |\n| `env:requestURL` | 资源的请求的完整 URL。 |\n| `env:roles` | 返回当前运行此报表的 Business Analytics\
  \ Platform 用户所属角色的逗号分隔列表。 |\n| `env:roles-array` | 返回包含当前运行此报表的 Business Analytics\
  \ Platform 用户所属角色的 Java 字符串数组。 |\n| `env:serverBaseURL` | Business Analytics Platform\
  \ 的 URL，不包括 Business Analytics Platform 应用程序上下文名称（默认上下文为 /pentaho/）。 |\n| `env:solutionRoot`\
  \ | 顶级 Pentaho 解决方案目录的路径。 |\n| `env:username` | 返回当前运行已发布报表的人员的 Business Analytics\
  \ Platform 用户名。 |\n\n## 使用公式\n\n除了在报表中提供函数外，公式还可用于在报表中生成动态内容。公式可用于派生元素属性和样式值。此外，前面定义的\
  \ `Open Formula` 和 `Open Formula (Advanced)` 函数可用于在报表中组合公式和函数机制。\n\nPentaho Reporting\
  \ 中的公式基于 `Open Formula` 标准。该标准类似于 Excel 公式支持，也用于 OpenOffice 以及 Pentaho Metadata\
  \ 等其他工具。该公式系统通常称为 `LibFormula`，它是报表公式子项目的库名称。\n\n## 创建公式\n\n正如您在关于函数和表达式的章节中所学，Open\
  \ Formula 和 Open Formula (Advanced) 可用于两个位置：报表资源管理器的 Data 选项卡中以及元素属性面板中的每个属性表达式。一旦请求\
  \ Open Formula 或 Open Formula (Advanced)，公式编辑器将显示并访问 Formula/Initialization formula\
  \ 属性。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_458_0.png)\n\n如前面的屏幕截图所示，公式编辑器非常直观。查看窗口，您可以识别出：左侧为可用函数的列表，顶部有类别选择器；右侧为帮助面板，支持公式的组合，配有公式文本区域；底部为参考说明。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_458_1.png)\n\n*使用字段选择（ icon ）在公式中使用可用元素。借助字段，公式编辑器定义数据源的字段、自定义函数和环境变量。如您所见，使用此功能，Pentaho\
  \ Reporting 使用语法 [NAME] 标识一个字段。*\n\n花点时间尝试使用公式编辑器。您会发现其使用非常简单。例如，您可以尝试开发公式以在 `Page\
  \ Footer` 频段中显示报表的执行日期（建议尝试检查 `now()` 函数）。\n\n```\nIF([COL1] > 10; \"Big\"; \"Small\"\
  );\n```\n\n该公式使用 IF 函数，参数由分号分隔。第一个参数是一个比较，结果为 true 或 false。要引用外部数据列或命名函数，请在括号中引用该列，如\
  \ COL1 所示。如果比较示例求值为 true，则返回 IF 函数中的第二个参数。要指定字符串，请使用双引号，如 \"Big\" 和 \"Small\" 所示。如果语句求值为\
  \ false，则返回第三个参数。此外，术语 null 可用于表示空引用。\n\n\n\n## 公式数据类型\n\n列数据以及字面值都会映射到公式数据类型。以下数据类型受支持。不同类型之间可能相互继承。*any*\
  \ 类型表示所有可用类型中的每一种。\n\n| 名称 | 描述 |\n|------|-------------|\n| Array | 数组可以在公式中声明，或由函数生成。您可以使用以下语法指定一维或二维数组：`{ROW1|ROW2|ROW3...}`。此外，一行可以通过分号拆分为多个列。示例：`{1;2;3|4;5;6|7;8;9}`。\
  \ |\n| Date | 日期类型继承自 `Numeric` 类型。此类型在 Java 中表示为 `java.util.Date` 对象，并表示完整日期的日期部分。\
  \ |\n| DateTime | 日期时间类型继承自 `Numeric` 类型，以及日期和时间类型。此类型在 Java 中表示为 `java.util.Date`\
  \ 对象。诸如 `DATEVALUE()` 之类的函数可用于生成 `date` 对象。 |\n| Error | 各种公式函数可能失败。发生这种情况时，会创建错误。某些函数可用于确定是否发生错误。\
  \ |\n| Logical | `Logical` 类型继承自 `Numeric` 类型。此类型的值为 `Boolean`，即 true 或 false。您可以通过函数\
  \ `TRUE()` 和 `FALSE()` 指定逻辑值。 |\n| Numeric | 数值，表示为 Java 中的 `BigDecimal` 对象。此类型的字面值可能采用以下形式：`123`、`123.456`、`123e10`\
  \ 或 `456E-10`，以及 `-1.2`。 |\n| Text | 文本值，在 Java 中表示为 `String` 对象。此类型的字面值必须用双引号引起来，如\
  \ \"Text Here\"。要在字符串中放置双引号，请将其重复两次，如 \" Here is a \"\" quote\"。 |\n| Time | 时间类型继承自\
  \ `Numeric` 类型。此类型在 Java 中表示为 `java.util.Date` 对象，并表示完整日期的 `Time` 部分。 |\n\n## 公式运算符\n\
  \n以下运算符可在公式表达式中使用。请注意，所有运算符都作为按钮存在于公式编辑器中，位于公式文本区域正上方的右侧面板。\n\n| 名称 | 描述 |\n|------|-------------|\n\
  | + | 将两个数字相加。 |\n| - | 减去两个数字。 |\n| * | 将两个数字相乘。 |\n| / | 将两个数字相除。 |\n| ^ | 返回第一个值以第二个值为幂。\
  \ |\n| = | 如果两个值相等则返回 true。 |\n| <> | 如果值不相等则返回 true。 |\n| < | 如果第一个值小于第二个值则返回 true。\
  \ |\n| > | 如果第一个值大于第二个值则返回 true。 |\n| <= | 如果第一个值小于或等于第二个值则返回 true。 |\n| >= | 如果第一个值大于或等于第二个值则返回\
  \ true。 |\n| % | 将数字除以 100，转换为百分比。例如，100 百分比将变为 1。 |\n| & | 连接两个字符串。 |\n\n## 可用的公式类别\n\
  \nPentaho Reporting 定义了许多可在公式系统中使用函数。如在解释公式编辑器时所介绍，可用函数被分组到类别中以便更好地理解。以下是详尽的列表，以及每个函数的详细信息。描述分为不同的部分，每个部分都完全致力于提供的类别。一个唯一的例外是\
  \ all 类别，它包含所有类别中的所有函数。\n\n## 日期或时间公式\n\n这些函数允许创建和操作 `Date`、`Time` 和 `DateTime`\
  \ 对象：\n\n| 名称 | 描述 |\n|------|-------------|\n| DATE | 根据年、月和日创建 `Date` 对象。 |\n\
  | DATEDIFF | 返回两个日期之间的差值，取决于格式代码，格式代码可能为以下之一：- `y`：这表示年份差 - `m`：这表示月份差 - `d`：这表示天数差\
  \ - `yd`：这表示忽略年份的天数差 - `ym`：这表示忽略年份的月份差 - `md`：这表示忽略月份和年份的天数差 |\n| DATETIMEVALUE\
  \ | 将字符串解析为日期。字符串必须匹配其中一种受支持的格式。默认情况下，支持以下格式：`m/d/yy` 和 `yyyy-mm-dd`。 |\n| DATEVALUE\
  \ | 为具有可能日期格式的文本返回内部数字。 |\n| DAY | 返回月份中的日期。 |\n| DAYS | 计算两个日期之间的天数。 |\n| HOUR\
  \ | 返回时间的小时。 |\n| MINUTE | 返回时间的分钟。 |\n| MONTH | 返回一年中的数字月份，1 表示一月，以此类推。 |\n| MONTHEND\
  \ | 返回月末的日期。 |\n| NOW | 使用当前时间创建 `DateTime` 对象。 |\n| PREVWEEKDAY | 确定上一个工作日的日期。\
  \ |\n| SECOND | 返回时间的秒。 |\n| TIME | 根据小时、分钟和秒值创建 `Time` 对象。 |\n| TIMEVALUE | 为以可能的时间输入格式显示的文本返回顺序号。\
  \ |\n| TODAY | 使用当前日期创建 `Date` 对象。 |\n| WEEKDAY | 返回星期几，1 表示星期日，以此类推。 |\n| YEAR\
  \ | 返回年份。 |\n| YESTERDAY | 确定昨天的日期。 |\n\n## 数据库公式\n\n此类别的函数实现了一些类似 SQL 的函数，返回逻辑类型结果：\n\
  \n| 名称 | 描述 |\n|------|-------------|\n| BEGINSWITH | 如果字符串以另一个字符串开头则返回 true |\n\
  | CONTAINS | 如果字符串包含另一个字符串则返回 true |\n| ENDSWITH | 如果字符串以另一个字符串结尾则返回 true |\n| EQUALS\
  \ | 如果两个字符串相等则返回 true |\n| IN | 如果后续参数中的任何一个与第一个参数匹配则返回 true |\n| LIKE | 像 SQL LIKE\
  \ 函数一样工作，将第一个值与正则表达式进行比较 |\n\n## 信息公式\n\n在 Pentaho Reporting 中提供许多额外的函数，具有丰富的功能：\n\
  \n| 名称 | 描述 |\n|------|-------------|\n| CHOOSE | 返回索引引用的参数。 |\n| COUNT | 返回值的数量。此函数也计算数组内的各个元素。\
  \ |\n| COUNTA | 返回数组或数组中非空值的数量。此函数始终计算非数组，即使它们为空。 |\n| COUNTBLANK | 返回表示值数组的引用中空值的数量。\
  \ |\n| DASHBOARDMODE | 检查是否启用了 `dashboard-mode`。如果将 `body-fragment` 创建设置为 true 且导出类型为任何\
  \ HTML 导出，则 `dashboard-mode` 处于活动状态。 |\n| DOCUMENTMETADATA | 从 `Document Meta-Data`\
  \ 集合返回一个值。 |\n| ENV | 返回给定字段的 `Meta-Data` 属性的值。 |\n| ERROR | 使用给定消息引发求值错误。 |\n|\
  \ EXPORT TYPE | 返回报告的当前导出类型描述符。 |\n| HASHCHANGED | 如果名称为文本的字段已更改则返回 true。 |\n| IN\
  \ | 如果后续参数中的任何一个与第一个参数匹配则返回 true。 |\n| INDEX | 返回指定数组索引处的值。 |\n| ISBLANK | 如果值为\
  \ null 则返回 true。 |\n| ISEMPTYDATA | 检查当前结果集是否为空。 |\n| ISERR | 如果值是错误，但不是 NA 错误则返回\
  \ true。 |\n| ISERROR | 如果值是错误则返回 true。 |\n| ISEVEN | 如果值是偶数则返回 true。 |\n| ISEXPORT\
  \ TYPE | 检查当前导出类型是否与指定的目标类型匹配。 |\n| ISLOGICAL | 如果值是逻辑类型则返回 true。 |\n| ISNA | 如果表达式已生成\
  \ NA 错误对象则返回 true。 |\n| ISNONTEXT | 如果值不是文本则返回 true。 |\n| ISNUMBER | 如果值是数字则返回 true。\
  \ |\n| ISODD | 如果值是奇数则返回 true。 |\n| ISREF | 如果值是引用则返回 true。 |\n| ISTEXT | 如果值是文本类型则返回\
  \ true。 |\n| LOOKUP | 查找外部值。这与字段选择 (▦) 图标产生的方括号运算符相同。 |\n| METADATA | 返回给定字段的 `Meta-Data`\
  \ 属性的值。 |\n| NA | 返回错误 `NA`，或 `Not Available`。 |\n| ROWCOUNT | 返回给定组的当前行号。 |\n|\
  \ VALUE | 将文本字符串转换为数值。 |\n\n\n\n## 逻辑公式\n\n这些函数执行各种布尔逻辑运算：\n\n| 名称 | 描述 |\n|------|------|\n\
  | AND | 如果所有表达式求值为 true，则返回 true；否则返回 false。请注意，任意数量的表达式可以一起进行 AND 运算。 |\n| EQUALS\
  \ | 返回 true 如果两个字符串相等。 |\n| FALSE | 返回布尔值 false。 |\n| IF | 如果第一个参数求值为 true，则返回第二个参数，否则返回第三个参数。\
  \ |\n| IFNA | 返回第一个参数，除非它是 NA，在这种情况下返回第二个参数。 |\n| NOT | 如果表达式为 true 则返回 false，如果表达式为\
  \ false 则返回 true。 |\n| OR | 如果任一表达式求值为 true，则返回 true。请注意，任意数量的表达式可以一起进行 OR 运算。 |\n\
  | TRUE | 返回布尔值 true。 |\n| XOR | 如果奇数个表达式求值为 true，则返回 true。 |\n\n## 数学公式\n\n这些函数提供各种形式的数值计算：\n\
  \n| 名称 | 描述 |\n|------|------|\n| ABS | 返回绝对值。 |\n| ACOS | 返回一个数的反余弦。 |\n| ACOSH\
  \ | 返回一个数的反双曲余弦。 |\n| ASIN | 返回一个数的反正弦。 |\n| ATAN | 返回一个数的反正切。 |\n| ATAN2 | 返回指定坐标的反正切。\
  \ |\n| AVERAGE | 返回所有参数的平均值。这些值也可以是数组。数组的每个元素都会被计算以求平均值。 |\n| AVERAGEA | 返回所有参数的平均值。这些值也可以是数组。数组的每个元素都会被计算以求平均值。文本和逻辑值也包含在计算中。\
  \ |\n| COS | 返回一个数的余弦。 |\n| EVEN | 将数字向上舍入到最接近的偶数整数。 |\n| EXP | 计算以 $e$ 为底的指数。 |\n\
  | LN | 计算一个数的自然对数。 |\n| LOG10 | 计算一个数的以 10 为底的对数。 |\n| MAX | 返回所有参数的最大值。这些值也可以是数组。每个数组元素都会被计算，并返回最大值。\
  \ |\n| MAXA | 返回所有参数的最大值。这些值也可以是数组。每个数组元素都会被计算，并返回最大值。文本和逻辑值也包含在计算中。 |\n| MIN |\
  \ 返回所有参数的最小值。这些值也可以是数组。每个数组元素都会被计算，并返回最小值。 |\n| MINA | 返回所有参数的最小值。这些值也可以是数组。每个数组元素都会被计算，并返回最小值。文本和逻辑值也包含在计算中。\
  \ |\n| MOD | 计算 *value 1* 除以 *value 2* 的除法余数。 |\n| N | 返回一个值对应的数字。 |\n| ODD | 将数字向上舍入到最接近的奇数整数。\
  \ |\n| PI | 返回圆周率 pi 的值。 |\n| POWER | 计算一个数被另一个数幂运算的结果。 |\n| SIN | 返回一个数的正弦。 |\n\
  | SQRT | 返回一个数的平方根。 |\n| SUM | 对两个或多个值求和。这些值也可以是数组。一维或二维数组的每个元素都会被相加。 |\n| SUMA\
  \ | 对两个或多个值求和。这些值也可以是数组。一维或二维数组的每个元素都会被相加。文本和逻辑值也包含在计算中。 |\n| VAR | 基于样本计算方差。 |\n\
  \n## 四舍五入公式\n\n这些函数提供各种形式的数值计算：\n\n| 名称 | 描述 |\n|------|------|\n| INT | 将数字向下舍入到最接近的整数\
  \ |\n\n## 文本公式\n\n这些函数处理字符串并对其进行操作：\n\n| 名称 | 描述 |\n|------|------|\n| ARRAYRIGHT\
  \ | 返回数组的最后一个或最后几个元素。 |\n| ASC | 将全角字符转换为半角 ASCII 和片假名字符。 |\n| BEGINSWITH | 如果一个字符串以另一个字符串开头，则返回\
  \ true。 |\n| CHAR | 将代码数字转换为 ASCII 字符或字母。 |\n| CLEAN | 从给定文本中删除所有不可打印字符。 |\n| CODE\
  \ | 返回文本字符串中第一个字符的数字代码。 |\n| CONCATENATE | 连接文本字符串。 |\n| CONTAINS | 如果一个字符串包含另一个字符串，则返回\
  \ true。 |\n| ENDSWITH | 如果一个字符串以另一个字符串结尾，则返回 true。 |\n| EXACT | 如果两个文本值完全相等，则返回\
  \ true。 |\n| FIND | 返回搜索字符串在文本中首次出现的索引，从指定的索引开始。索引参数是可选的。 |\n| DOLLAR | 将数字向上舍入到指定的小数位数并将结果格式化为文本。\
  \ |\n| LEFT | 返回字符串左侧最多 length 个字符的部分。 |\n| LEN | 返回文本的长度。 |\n| LIKE | 像 SQL LIKE\
  \ 函数一样工作，将第一个值与正则表达式进行比较。 |\n| LOWER | 返回全部小写的文本。 |\n| MESSAGE | 使用给定的消息格式格式化值。\
  \ |\n| MID | 返回 Text 中的子字符串，从 Start 开始，长度为 Length。 |\n| PROPER | 返回输入字符串，每个单词的首字母转换为大写。\
  \ |\n| QUOTETEXT | 给文本加引号。 |\n| REPLACE | 用提供的 New 文本替换 Text 中从 Start 开始、长度为 Length\
  \ 的部分。 |\n| REPT | 返回 `Text` 重复 `Count` 次。例如，如果 `Text` 为 `test` 且 `Count` 为 `3`，结果将为\
  \ `testtesttest`。 |\n| RESOURCELOOKUP | 返回字符串右侧最多 `Length` 个字符的部分。 |\n| RIGHT |\
  \ 返回文本的最后一个或最后几个字符。 |\n| SEARCH | 在另一个字符串中查找一段文本（不区分大小写）。 |\n| STRINGCOUNT | 统计字符串中新文本出现的次数。\
  \ |\n| SUBSTITUTE | 在 `Text` 中用 `New` 子字符串替换 `Old` 子字符串。如果提供了 `Which` 索引，则只会替换第\
  \ *N* 个旧子字符串。 |\n| T | 如果值类型为 `Text`，则返回该值，否则返回空字符串。 |\n| TEXT | 将值转换为 `Text`。布尔值转换为\
  \ true 和 false。 |\n| TRIM | 删除文本开头和结尾的任何空白字符。 |\n| UNICHAR | 将代码数字转换为 unicode 字符或字母。\
  \ |\n| UNICODE | 返回文本字符串中第一个 unicode 字符的数字代码。 |\n| UPPER | 返回全部大写的文本。 |\n| URLENCODE\
  \ | 根据指定的编码对文本进行编码。如果未指定编码，则使用 ISO-8859-1。 |\n\n## 用户定义公式\n\n在此类别中包含所有由某种外部贡献开发的函数：\n\
  \n| 名称 | 描述 |\n|------|------|\n| ARRAYCONCATENATE | 连接数组。 |\n| ARRAYCONTAINS |\
  \ 检查所有给定值是否包含在数组中。 |\n| ARRAYLEFT | 返回数组的第一个或前几个元素。 |\n| ARRAYMIND | 返回给定数组的部分数组。\
  \ |\n| CSVARRAY | 将 CSV 文本转换为数组。 |\n| CSV TEXT | 生成逗号分隔的值列表。如果 Doquoting 设置为 true，则对所有字符串加引号。默认情况下，分隔符为逗号，可通过设置\
  \ separator 参数覆盖。默认情况下，字符串使用双引号加引号，可通过设置 Quote 参数覆盖。 |\n| DRILLDOWN | 创建指向另一份报告的下钻链接。此函数实现与公式编辑器中的链接图标相同。该函数的用户界面比其他函数更复杂，可让你使用\
  \ URL、Pentaho 仓库或报告本身定义下钻。参数可以传递给目标资源以自定义数据。 |\n| ENGINEERINGNOTATION | 以工程记数法返回该值。\
  \ |\n| MPARAMETER TEXT | 返回表示该值的文本，适用于用作多选参数。 |\n| MULTIVALUEQUERY | 从数据集查询的第一行返回单个值。\
  \ |\n| NORMALIZEARRAY | 将数组、数据库或序列转换为平面数组。 |\n| NULL | 返回空值（已弃用：改用 NA() 代替）。 |\n\
  | OPENINMANTLETAB | 根据条件生成代码以在新的 Mantle 选项卡中打开 URL。 |\n| PARAMETERTEXT | 返回表示该值的文本，适用于用作参数。\
  \ |\n| PARSEDATE | 使用 `SimpleDateFormat` 将文本转换为日期。 |\n| SEQUENCEQUOTER | 将数组转换为带引号的文本以供展示。不要使用此代码构造查询。\
  \ |\n| SINGLEVALUEQUERY | 从数据集查询的第一行返回单个值。 |\n| URLPARAMETERSEPARATOR | 检查给定的 URL\
  \ 片段是否包含参数 `Separator`，并打印 ? 或 &。 |\n\n\n\n## 摘要\n\n在本章中，您学习了报表参数化所涉及的细节。\n\n您还学习了动态渲染报表的各种方式，包括学习所有可用的函数和表达式，以及学习环境变量和\
  \ `LibFormula` 语法和函数列表。\n\n阅读完本章后，您应对 Pentaho Report Designer 提供的所有管理参数和函数（捆绑和自定义）的方式感到熟悉。这是在开发复杂的\
  \ Pentaho 报表时的一项高级任务，能使您成为处理复杂报表和行为的专家。\n\n在下一章中，您将学习有关国际化和本地化的所有内容，以便以多语言创建 Pentaho\
  \ 报表。\n\n## 国际化与本地化\n\n在描述了 Pentaho Reporting 的参数化、函数和表达式、环境变量和公式之后，本章您将学习 Pentaho\
  \ 报表国际化和本地化的所有内容。这种 Pentaho Reporting 功能将使您能够管理报表以获得最佳的多语言支持，而不依赖于特定语言或字母表，而是使用一种通用方法，通过文本和字符串的标签以及用于替换它们的某些属性。\n\
  \n本章作为开发人员和信息技术人员的参考手册编写。目标是分享 Pentaho Report Designer 中可用的所有相关和高级的国际化和本地化功能。阅读完本章后，您应对\
  \ Pentaho Reporting 能够以您可能需要的各种语言定义报表的所有方式感到熟悉。\n\n## 国际化与本地化\n\n与所有现代软件一样，Pentaho\
  \ Reporting 的开发遵循支持国际化的所有最佳实践和模式，以便可以在无需工程更改的情况下适应各种语言和地区。\n\n本地化是通过添加特定于区域设置组件和翻译文本来使国际化软件适应特定区域或语言的过程。本地化（可能针对不同的区域设置多次执行）使用国际化提供的基础设施或灵活性（理想情况下仅执行一次，或作为持续开发的组成部分）。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_486_0.png)\n\n> *此描述主要摘自维基百科对国际化和本地化的定义，您可以在\
  \ https://en.wikipedia.org/wiki/Internationalization_and_localization 找到。即使描述相当通用，它也非常适合\
  \ Pentaho Reporting 作为标准（且现代）的 Java 应用程序而开发。*\n\n要国际化 Pentaho 报表，您必须在创建报表时使用 Pentaho\
  \ Reporting 中提供的资源元素。每个资源元素定义一个资源基和资源键引用。通常，资源基指的是存储本地化名称的消息属性文件的名称。资源键引用是 `key`\
  \ 和 `value` 的列表，其中 `key` 标识内容的唯一标识符，而 `value` 标识要呈现的内容。资源键使用的语法是 `key=value`。\n\n\
  有关 Java 中资源包的默认处理，请参阅 Java 的 *i18n* 资源包教程，网址为 http://java.sun.com/docs/books/tutorial/i18n/resbundle/concept.html。\n\
  \n## 使用资源本地化元素\n\n在 Pentaho Report Designer 中，有三种不同的元素可用于本地化：`resource-label`、`resource-field`\
  \ 和 `resource-message`。它们都可在报表元素调色板中使用，可以像往常一样使用——通过将元素拖放到右侧频带的所选位置，直接在报表画布上放置。\n\
  \n资源元素的核心思想是，这类元素包含资源的键值，而不是直接显示的值。一旦键值在报表元素中声明并使用，属性文件将包含键/值关联，并在运行时用于向用户显示最终内容。\n\
  \n在报表中使用 `resource-label` 元素可让您本地化带有静态文本的标签。如前所述，该元素包含静态资源键，该键将在运行时使用以下段落中详细说明的资源包解析。\n\
  \n在报表中使用 `resource-field` 元素可在一定程度上本地化动态数据。不是提供静态资源键，此元素类型指定键生成的字段数据源。有关动态本地化的完整解决方案，您可能需要研究使用\
  \ `Indirect Lookup` 函数（在第 8 章 *Parameterization, Functions, Variables, and Formulas*\
  \ 中介绍），以便动态选择数据库中的不同本地化列来填充特定的动态字段。\n\n在报表中使用 `resource-message` 元素可让您本地化消息，将多种数据类型（文本、字符串字段、日期字段和数字字段）写入一个对象。在这种情况下，该元素也包含静态资源键，该键将在运行时使用以下各节中详细说明的资源包解析。\n\
  \n## 本地化资源\n\n如本章前所述，Pentaho 报表的本地化需要一些资源来解析报表元素中声明的键。从 Report Designer 用户界面开始，您可以从顶部菜单中访问资源，位于\
  \ File | Resources.... 选择后，资源编辑器将出现，如以下屏幕截图所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_488_0.png)\n\
  \n简而言之，资源编辑器不过是一个属性文件管理器。它默认包含默认文件（translations.properties），但您很快就会学习如何添加和删除其他属性文件。此处定义的属性文件是\
  \ Pentaho 报表的一部分，因此直接存储在 .prpt 文件中。\n\n使用右侧的按钮，您可以创建、编辑、删除，甚至导入/导出属性文件。我们在此不会详细介绍每个按钮的行为，因为它应该很容易理解，考虑到它不过是众所周知的属性文件管理。\n\
  \n相反，我们想讨论如何管理特定资源文件的键/值对。例如，选择 translations.properties 资源并单击编辑按钮。单击后，将显示编辑属性窗口，如以下屏幕截图所示：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_489_0.png)\n\n从这里开始，任务就是简单地编辑属性文件，您可以在其中以\
  \ `key=value` 格式添加、修改或删除条目。例如，您可以查看以下几对：\n\n```\ntitle=My report\ncompanyName=ACME,\
  \ Inc.\n```\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_489_1.png)\n\n*始终仔细检查您将在资源文件中管理的键。键区分大小写，必须与报表元素中使用的键完全相同。如果拼写错误甚至一个数字，最终内容将不会显示，而且识别此类错误总是会浪费大量时间。*\n\
  \n## 管理资源包\n\n为了完成有关本地化资源的主题，让我们为 i18n 管理（其中 18 代表单词 internationalization 中第一个 i\
  \ 和最后一个 n 之间的字母数）的实际使用和影响增添一些色彩。\n\n如 Java 的 i18n 资源包教程所述，报表中使用的正确键/值对由资源包定义，后跟语言代码和国家代码。例如，`translations_en_GB.properties`\
  \ 文件包含英语（en）在大不列颠（GB）的资源键引用。您可以为特定语言和所有国家/地区定义通用资源包（在我们的示例中为 `translations_en.properties`），或为所有语言和国家/地区定义（在我们的示例中为\
  \ `translations.properties`）。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_490_0.png)\n\
  \n> *强烈建议为所有语言和国家/地区定义默认资源包（在我们的示例中为 `translations.properties`）。然后，您可以可选地添加更多资源包，专门针对语言和国家/地区。但是，请注意，键/值对应复制到每个资源包中，否则最终用户将看到部分本地化。*\n\
  \n最后但并非最不重要的一点是，您可以使用外部属性文件本地化 Pentaho 报表。这使您可以将属性文件在多个 `.prpt` 报表之间共享。要使用外部消息包（`.properties`\
  \ 文件），请按前述描述定义键/值对，但将包放置在 Reporting Engine 的类路径上。如果您在 Pentaho Report Designer 中，请将文件添加到\
  \ `/resources` 目录。要使其在 Pentaho Analytics Platform 中被识别，请将文件放在 `pentaho/WEB-INF/classes`\
  \ 目录中。\n\n\n\n## 测试本地化\n\n在正确设置 Pentaho 报表本地化后，您可能希望在所有可能的语言和国家/地区（用一个词来说，称为 locale）中测试它。为了实现这一目标，Pentaho\
  \ Report Designer 可以配置为使用一种 locale 而不是另一种。\n\n从 Report Designer 用户界面开始，您可以从上部菜单中访问\
  \ Pentaho Report Designer 设置，位于 File | Configuration...。选择后，报表配置将显示如下图所示。\n\n在 `core-module`\
  \ 设置中，您可以识别出 `.environment.designtime.Locale` 属性，该属性未定义默认值。要设置请求的 locale，请选中该属性并填写右侧的文本字段，该字段将变为可编辑。然后单击\
  \ OK 按钮并刷新报表以使配置生效。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_491_0.png)\n\n##\
  \ 报表本地化示例\n\n为了在实践中了解本地化如何工作，让我们开发一个本地化 Pentaho 报表示例，您可以在未来的任务中使用。思路是重用之前的示例，将一些静态标签替换为\
  \ `resource-label`，并查看报表在几种不同语言中的外观（我们将使用英语和西班牙语作为示例）。\n\n为此，让我们重用我们在第 4 章 *Creating\
  \ a Report with Report Designer* 中看到的 `report_02.prpt`。如果您遵循了建议，您应该已将报表保存在开发环境中的\
  \ `my_report` 文件夹中。如果没有，您可以从 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库下载，从 `Chapter 04 - Creating a report with Report Designer/my_reports` 路径。\n\n\
  打开报表在 Report Designer 中后，在报表资源管理器 Structure 选项卡中选择 `label: Actuals per position\
  \ title` 元素（您可以在 Master Report | Report Header 下找到它）。要将标签替换为 `resource-label` 元素，让我们单击上部菜单中的\
  \ Format | Morph | resource-label 项。此功能将转换元素的类型，同时保持相同的通用属性。为了完成任务，让我们将 `value`\
  \ 属性（在通用集合中）设置为 `report.title`。\n\n以完全相同的方式（使用 morph 功能），更改 Master Report | Group:\
  \ DEPARTMENT | Details Body | Details Header 下的三个标签。对于职位标题的标题，将 `value` 属性设置为 `header.positiontitle`。对于实际值的标题，将\
  \ `value` 属性设置为 `header.actual`。对于预算的标题，将 `value` 属性设置为 `header.budget`。\n\n现在报表已正确更新，是时候使用正确的键/值对设置资源包了。要设置资源，请选择\
  \ File | Resources...，然后选择 `translations.properties` 并单击 Edit 按钮。完成后，用默认值的属性文件填充（在我们的例子中为英语），描述如下：\
  \ report.title = Actuals per position title\nheader.positiontitle = Position title\n\
  \n```\nheader.actual = Actual\nheader.budget = Budget\n```\n\n完成后单击 OK 按钮。要添加新的翻译文件，请按\
  \ Create 按钮并将 Entry Name 字段填写为 `translations_es.properties`。按 OK 按钮后，您将看到使用西班牙语\
  \ locale 创建了一个新的属性文件。选择新的属性文件并单击 Edit。完成后，用西班牙语键/值对填充属性文件，描述如下：\n\n```\nreport.title\
  \ = Título real por posición\nheader.positiontitle = Título del puesto\nheader.actual\
  \ = Real\nheader.budget = Presupuesto\n```\n\n## 免责声明\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_493_0.png)\n\
  \n*我希望 Google 为我提供了西班牙语的正确翻译。如果没有，我提前向我的西班牙语朋友道歉。这不是我的母语，但我认为西班牙语会是一个不错的替代语言，考虑到它被广泛使用，而\
  \ Pentaho 社区在西班牙语国家非常庞大。*\n\n现在报表已正确本地化（默认语言为英语，西班牙语），让我们通过单击工具栏上的眼睛（\U0001F441\
  ）图标来预览它。以下屏幕截图显示了默认语言（英语）的预览：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_494_0.png)\n\
  \n## 按职位标题的实际值\n\n## 高级管理层\n\n| 职位标题 | 实际 | 预算 |\n|---|---|---|\n| CEO | 500,000\
  \ | 478,750 |\n| SVP Partnerships | 531,780 | 519,179 |\n| SVP Strategic Development\
  \ | 226,000 | 226,395 |\n| SVP WW Operations | 249,800 | 249,184 |\n| CEO | 500,000\
  \ | 488,750 |\n\n如您所见，报表标题和字段的三个标题标签与静态版本相同。要更改 locale，让我们单击上部菜单中的 File | Configuration...\
  \ 并检查 `.environment.designtime.Locale` 属性。完成后，将右侧文本字段填写为 `es`（西班牙语的 *i18n* 代码）并按\
  \ OK 按钮。\n\n现在 Report Designer 配置已更新为使用西班牙语 locale，让我们通过按工具栏上的眼睛（\U0001F441️）图标再次预览报表。以下屏幕截图显示了西班牙语的预览：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_495_0.png)\n\n## 按职位实际标题\n\n## 高级管理层\n\
  \n| 职位标题 | 实际 | 预算 |\n|---|---|---|\n| CEO | 500.000 | 478.750 |\n| SVP Partnerships\
  \ | 531.780 | 519.179 |\n| SVP Strategic Development | 226.000 | 226.395 |\n| SVP\
  \ WW Operations | 249.800 | 249.184 |\n| CEO | 500.000 | 488.750 |\n\n现在轮到您来处理了。例如，您可以添加法语的本地化（fr\
  \ 是 i18n 代码）或使用更详细的国家/地区，例如阿根廷西班牙语（es_AR 是 i18n 代码）、智利西班牙语（es_CL 是 i18n 代码）等等。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_495_1.png)\n\n> 在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中，具体在 Chapter 09 - Internationalization and localization/my_reports 路径下，您可以找到\
  \ report_multilanguage.prpt 报表，它完全开发了这里描述的示例。请随意使用 Report Designer 打开它并操作设置和参数，以了解如何添加和自定义国际化和本地化。\n\
  \n## 摘要\n\n本章中，您学习了使用 Pentaho Report Designer 进行国际化和本地化的所有内容。您从国际化（和 i18n）的定义开始，然后了解了\
  \ Pentaho 报表中本地化的含义。为了使其更实用，您了解了如何包含资源元素（`resource-label`、`resource-field` 和 `resource-message`）以及如何使用资源包解析内容。最后，您还了解了如何测试\
  \ Pentaho 报表的各种本地化。\n\n为了完整描述，供将来参考，您还了解了如何将现有报表本地化为英语和西班牙语（但也可以以相同方式开发其他翻译）。\n\n\
  现在您阅读了本章，您应该对 Pentaho Report Designer 提供的所有国际化和本地化管理方式感到自如。这是在开发复杂的 Pentaho 报表时的一项高级任务，使您成为处理可在不同语言和国家/地区使用的复杂报表的专家。\n\
  \n在下一章中，您将学习如何向 Pentaho 报表添加子报表和交叉表。\n\n## 子报表和交叉表\n\n本章中，您将学习两个高级报表主题的内在细节：子报表和交叉表。子报表允许您在主报表中嵌入可重用的报表。正如您将看到的，有了示例的帮助，子报表可以采取多种形式，从多页详细报表到包含图表的汇总子报表。作为两种特定类型的子报表，您将了解目录元素和索引元素。除了子报表之外，您还将学习如何在报表中加入交叉表。交叉表允许您在单个数据值表中比较多个变量。\n\
  \n本章为开发人员和信息技术人员编写的参考手册。阅读本章后，您应该对 Pentaho Report Designer 中可用的子报表和交叉表的所有高级功能感到自如。这是专门介绍\
  \ Report Designer 的最后一章，它涵盖了 Pentaho Reporting 此前端工具的最后高级功能。\n\n\n\n## Pentaho Report\
  \ Designer 中的子报表\n\nPentaho Reporting 中的子报表可以包含在报表中的任何频段中，除了页眉和页脚频段。子报表接收一个参数 DataRow，其由父报表在渲染子报表时的当前状态决定。这些参数可在执行子报表查询时使用，或直接在子报表中引用。在子报表内部，您可以定义命名查询，这些查询可以引用传入的参数\
  \ DataRow，从而使子报表仅查询当前作用域的数据，而非父报表可用的整个数据集。\n\n子报表可以是任意长度，可以以嵌套方式包含在其他子报表中，也可以在其父报表中并排呈现。跨越多页时，必须做出特殊考虑，包括如何处理主报表的页眉、页脚和组标题。本章将在以下示例中涵盖所有这些主题。\n\
  \n## 子报表示例\n\n在此示例中，您将构建一个报表，其中包含一个非常经典的用例场景：主从报表，其中主报表由订单（订单号和日期）表示，而从报表由包含产品、数量和价格的子报表表示。首先，让我们从一个空报表开始（点击\
  \ Report Designer 中的空白报表图标（□））以及按照第 6 章 *Configuring JDBC and Other Data Sources*\
  \ 中所述创建的 JDBC 数据源。JDBC 数据源应定义在 `SampleData (Local)` 连接上，内容如下：\n\n```\nSELECT\n\"\
  PUBLIC\".\"ORDERS\".\"ORDERNUMBER\",\n\"PUBLIC\".\"ORDERS\".\"ORDERDATE\"\nFROM\n\
  \"PUBLIC\".\"ORDERS\"\n```\n\n从这里，将 `ORDERNUMBER` 和 `ORDERDATE` 字段拖拽并放到空报表的 `Details`\
  \ 频段中。将 `ORDERNUMBER` 样式更改为粗体，并将 `ORDERDATE` 拉伸以覆盖页面的剩余宽度。\n\n到目前为止，这与您在前几章中学到的内容并没有什么不同。现在让我们添加一个代表订单详细信息的子报表。要添加子报表，请从元素调色板中拖拽子报表图标（≡）并将其放置在字段下方，位于\
  \ `Details` 频段中。放置后，将打开一个模态窗口，询问：您想要包含内联子报表还是带状子报表？如果您想要覆盖一个可自定义的矩形区域以放置内容，请选择内联子报表；如果您想要将内容放置在报表频段中包含的子频段中，请选择带状子报表。点击\
  \ Inline 按钮，将打开另一个带有子报表图标（≡）的选项卡，类似于一个全新的报表。\n\n新选项卡包含子报表，它实际上是主报表内部的一个新报表。子报表由数据源、布局、元素以及您在阅读本书时到目前为止所看到的一切组成。作为一个真正的报表，一个窗口会要求您指定数据源。在我们的示例中，我们将创建一个全新的\
  \ JDBC 数据源，使用 `SampleData (Local)` 连接和以下查询。要创建数据源，请按下众所周知的绿色加号图标（⊕）并\n按照第 6 章 *Configuring\
  \ JDBC and Other Data Sources* 中所述的相同路径操作。\n\n```\nSELECT\n\"PUBLIC\".\"ORDERDETAILS\"\
  .\"PRODUCTCODE\",\n\"PUBLIC\".\"ORDERDETAILS\".\"QUANTITYORDERED\",\n\"PUBLIC\"\
  .\"ORDERDETAILS\".\"PRICEEACH\"\nFROM\n\"PUBLIC\".\"ORDERDETAILS\"\nWHERE\n\"PUBLIC\"\
  .\"ORDERDETAILS\".\"ORDERNUMBER\" = ${ORDERNUMBER}\nORDER BY\n\"PUBLIC\".\"ORDERDETAILS\"\
  .\"ORDERLINENUMBER\" ASC\n```\n\n在定义子报表内容之前，返回主报表（在报表画布中点击报表选项卡）并将子报表元素立即移动到 ORDERDATE\
  \ 字段下方。将它拉伸以覆盖 ORDERDATE 元素的整个宽度，直到页面的右边缘。\n\n返回子报表选项卡，将三个字段拖拽并放到空子报表的 Details 频段中。首先，将\
  \ QUANTITYORDERED 和 PRICEEACH 字段放置在频段的右侧，然后将 PRODUCTCODE 字段放置在左侧，并将其拉伸以覆盖整个空闲空间。\n\
  \n最后，让我们管理子报表中使用的 ORDERNUMBER 参数，或更准确地说，是子报表数据源中使用的参数。在此示例中，子报表在报表的 Details 频段中使用，每个子报表实例都依赖于特定的一个订单。要将订单号从主报表传递到子报表，必须配置一个参数。\n\
  \n正如您在第 8 章 *Parameterization, Functions, Variables, and Formulas* 中所学，报表参数位于报表资源管理器中，特别是\
  \ Data 选项卡中。此外，对于子报表而言，参数也可以从同一位置管理，但存在两个主要区别。第一个区别是子报表参数始终用于在主报表之间移动值，而不会询问用户。第二个区别是子报表参数分为导入参数和导出参数。如您所料，导入参数用于将值从主报表传递到子报表，而导出参数用于将值从子报表传递到主报表。\n\
  \n在我们的示例中，您需要导入一个参数以在子报表中使用 ORDERNUMBER 值。要定义参数，请在报表资源管理器中右键单击 Parameters 项并填写 Import\
  \ Parameter 部分，如以下屏幕截图所述。要添加新的输入参数，请点击绿色加号图标（⊕）并用主报表中字段的名称填写 Outer Name。使用 Inner\
  \ Name 为子报表中的本地参数命名（在我们的例子中，我们将为两者使用相同的名称）。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_501_0.png)\n\
  \n现在主报表和子报表已定义，您的报表的 Details 频段应如下图所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_501_1.png)\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_501_2.png)\n\n*如果您在开发环境中重复创建报表的练习，您会看到子报表中的可用空间被减少了。确实，您无法将元素放置在频段的左侧，该空间具有灰色背景和白色网格。这意味着主报表中子报表的宽度并未覆盖整个页面宽度，只有频段的右侧部分可以使用。如果您进入主报表并放大（或缩小）子报表元素的宽度，您会看到子报表会相应地放大（或缩小）。请记住这一点，因为它会影响您可以用元素填充的可用空间。*\n\
