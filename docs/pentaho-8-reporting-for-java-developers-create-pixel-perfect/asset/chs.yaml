  \ 仓库中，更确切地说，在 `Chapter 10 - Sub-reports and cross tabs/my_reports` 路径中，您可以找到开发此示例的\
  \ `example_of_index.prpt` 报表。请随意使用 Report Designer 打开它并调整设置和布局。\n\n## Pentaho Report\
  \ Designer 中的交叉表\n\n交叉表（或交叉表）允许您在报表中查看维度数据。使用交叉表，您可以轻松查看两个或多个字段以及它们基于度量的关系。交叉表汇总数据库中的信息，并以网格形式布局，其中行代表维度（例如，国家、日期或销售人员），列代表另一个维度，交集包含聚合（通常是求和）。交叉表类似于\
  \ Microsoft Excel 中的数据透视表。\n\nPentaho Reporting 提供了创建基于交叉表的报表的能力。这些是特殊类型的报表，其渲染方式与其他标准报表不同。这些报表还期望数据采用特定格式。交叉表报表可以由多维查询驱动（如第\
  \ 6 章 *配置 JDBC 和其他数据源* 中所述，Pentaho Reporting 提供了 Mondrian 和 OLAP4j 数据源来为报表提供多维数据），或可以使用\
  \ SQL 查询，如果列/行的结构类似于 MDX。\n\n## 交叉表示例\n\n作为几个示例，让我们展示两个使用交叉表的基本报表：第一个使用 MDX 查询显示按年份和市场的销售额，第二个使用\
  \ SQL 查询显示按地区和部门的实际值、预算和差异。为了展示不同类型的交叉表报表，第二个示例将显示多个度量。\n\n首先使用 MDX 查询的第一个示例，让我们从一个空报表开始（在\
  \ Report Designer 中单击空白报表图标（ ））并使用一个 Pentaho Analysis 数据源创建，如第 6 章 配置 JDBC 和其他数据源\
  \ 中所述。Pentaho Analysis 数据源应定义在 steelwheel.mondrian.xml 文件上，该文件捆绑在 Pentaho Reporting\
  \ Designer 发行版中（在 <report-designer>/samples 文件夹中），SteelWheels 逻辑模式和 SampleData（本地）JDBC\
  \ 连接。以下是要在 Static Query 字段中编辑的 MDX 查询：\n\n```\nSELECT\nCrossJoin([Markets].Children,\
  \ [Time].Children) ON ROWS,\n[Measures].[Sales] ON COLUMNS\nFROM\n[SteelWheelsSales]\n\
  ```\n\n完成后，指向报表资源管理器 Structure 选项卡中的 Master Report 元素。特别是，右键单击 Master Report 元素并选择\
  \ Add Crosstab 项，如以下截图中所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_510_0.png)\n\
  \n单击该项后，将显示交叉表向导，如下一截图所示。填写字段，注意将 [Measures].[Sales] 的聚合函数更改为 sum：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_511_0.png)\n\
  \n按 OK 按钮后，您会看到报表布局中添加了一个新频段：新频段称为 Crosstab。在 Crosstab 频段中，您可以找到定义交叉表的所有元素，非常类似于前几章中介绍的常规元素。从那里，您可以像在前几章中学到的那样，以相同的方式处理布局（例如，格式化数字、突出显示标题等）。\n\
  \n此时，报表以非常简单和基本版本准备就绪，因此您可以单击报表画布中的眼睛图标（\U0001F441）获取预览。以下截图显示了预览的外观：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_511_1.png)\n\
  \n在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers 仓库中，更确切地说，在\
  \ Chapter 10 - Sub-reports and cross tabs/my_reports\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_512_0.png)\n\
  \npath，你可以找到开发了此处描述的示例的 *crosstab_mdx_datasource.prpt* 报表。如果使用此报表，请注意你需要更新数据源以指向包含\
  \ *steelwheel.mondrian.xml* 文件的正确路径。\n\n作为另一个示例，让我们使用 SQL 查询而不是 MDX 查询开发一个类似的报表。开始这个第二个示例时，创建一个空报表（点击\
  \ Report Designer 中的空白报表图标（□））并设置一个 JDBC 数据源，该数据源的创建方法如第 6 章 *配置 JDBC 及其他数据源* 中所述。JDBC\
  \ 数据源应定义在 `SampleData (Local)` 连接上，并使用以下查询：\n\n```\nSELECT\n\"PUBLIC\".\"QUADRANT_ACTUALS\"\
  .\"REGION\",\n\"PUBLIC\".\"QUADRANT_ACTUALS\".\"DEPARTMENT\",\nSUM(\"PUBLIC\".\"\
  QUADRANT_ACTUALS\".\"ACTUAL\") AS \"ACTUAL\",\nSUM(\"PUBLIC\".\"QUADRANT_ACTUALS\"\
  .\"BUDGET\") AS \"BUDGET\",\nSUM(\"PUBLIC\".\"QUADRANT_ACTUALS\".\"VARIANCE\") AS\
  \ \"VARIANCE\"\nFROM\n\"PUBLIC\".\"QUADRANT_ACTUALS\"\nGROUP BY\n\"PUBLIC\".\"QUADRANT_ACTUALS\"\
  .\"REGION\",\n\"PUBLIC\".\"QUADRANT_ACTUALS\".\"DEPARTMENT\"\n```\n\n完成后，在报表资源管理器\
  \ Structure 选项卡中指向 `Master Report` 元素。特别是，右键单击 `Master Report` 元素并选择 Add Crosstab\
  \ 项。点击该项后，将显示交叉表向导，如以下屏幕截图所示。填写字段时，请注意将 `ACTUAL`、`BUDGET` 和 `VARIANCE` 的聚合函数更改为\
  \ `Sum`：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_513_0.png)\n\n在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中，更具体地说，在 Chapter 10 - Sub-reports and cross tabs/my_reports 路径下，你可以找到开发了此处描述的示例的\
  \ crosstab_sql_datasource.prpt 报表。随意使用 Report Designer 打开它并调整设置和参数。\n\n以下屏幕截图显示了在报表画布中点击眼睛图标（\U0001F441\
  ）后的预览：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_513_1.png)\n\n## 摘要\n\n在本章中，你从零开始构建了子报表和交叉表的示例，探索了\
  \ Pentaho Reporting 提供的功能。你构建了一个主从子报表，演示了在两者之间传递参数的使用。你还构建了一个包含数据索引的子报表（在我们的示例中为客户名称）。为了为未来的开发提供参考，你还阅读了子报表在高级实际案例中的可能用途列表。\n\
  \n你还基于 MDX 和 SQL 查询构建了交叉表报表。这些交叉表报表包含多个行和列标题，并显示了关于销售额、实际值、预算和差异的汇总数据。\n\n现在你阅读了本章，你应该对\
  \ Pentaho Report Designer 的所有功能感到熟悉（不仅限于子报表和交叉表）。从这里开始，本书将继续从开发角度探索 Pentaho Reporting\
  \ SDK。如果你是开发者或信息技术人员，现在你已准备好开始使用 Pentaho Report Designer 并处理复杂的报表和用例。\n\n作为开发者，你应继续阅读本书的其余部分，以了解更多关于如何在\
  \ Java 应用程序中开发和嵌入 Pentaho Reporting Engine 的内容。如果你是信息技术人员，你可以选择在此停止，或尝试探索 Pentaho\
  \ Reporting 功能的技术发现之旅。\n\n## PRPT 格式和用于构建它的 Java API\n\n本章是完全致力于 Pentaho Reporting\
  \ 的技术和高级功能的第一个章节。在本书的前几章中，你学习了有关 Pentaho Report Designer 的所有内容，从这里开始，你将开始使用 Pentaho\
  \ Reporting SDK 进行开发。\n\n在本章中，你将学习 Pentaho Reporting 的 `.prpt` 捆绑文件格式，以及 Pentaho\
  \ Reporting Java API 的细节。你将被介绍到各种 XML 文件的模式，这些文件用于持久化报表的数据源、参数、表达式、布局和样式。\n\n通过\
  \ Pentaho Java API 的示例，你将学习以编程方式构建报表是多么容易。你将逐步完成一个完整的示例，演示如何在报表中创建不同的报表频段以及不同的元素。\n\
  \n本章技术性很强，并以纯 Java 开发者的教程形式编写。在本章结束时，你将对 `.prpt` 格式以及以编程方式创建 Pentaho 报表的基础感到熟悉。后面的章节将假设你能够掌握此处解释的内容，因此请仔细阅读并确保你对所有解释的概念都充满信心。\n\
  \n## 理解序列化报表格式\n\n在前几章中，你已经看到了 Pentaho 报表的格式，保存为 `.prpt` 捆绑文件。`.prpt` 格式是一种 ZIP\
  \ 文件格式，其中包含呈现报表所需的所有资源，也称为捆绑包。`.prpt` 捆绑文件包含一组对呈现报表至关重要的 XML 文件，以及其他资源，例如嵌入式图像和子报表。该格式基于\
  \ OpenDocument 格式。\n\n本节详细介绍了构成报表的主要文件，并提供了一个手工编写的报表示例。有了底层文件格式的知识，就可以在 Java 环境之外生成报表。\n\
  \n## .prpt 捆绑文件的结构\n\n为了分享 .prpt 捆绑文件的确切细节，让我们从一个具体示例开始。随意选择一个 Pentaho 报表，从你开发环境中已有的报表中随机选择，或从\
  \ https://github.com/fcorti/pentaho-8-reporting-for-java-developers 仓库下载的一个。\n\n\
  一旦选择了 .prpt 捆绑文件，将其作为常规压缩归档解压，你将看到以下包含的文件和文件夹（某些文件和文件夹是可选的，实际上取决于报表的复杂性）：\n\n| 名称\
  \ | 描述 |\n|---|---|\n| datasources | 包含 `compound-ds.xml` 和每个数据源一个文件的目录。例如，包含 JDBC\
  \ 数据源的 `sql-ds.xml`，Mondrian 数据源的 `mondrian-ds.xml`，等等。 |\n| META-INF | 包含 `manifest.xml`\
  \ 的目录。清单文件包含包中所有内容文件的引用。 |\n| resources | 包含报表定义中包含的资源（如图像等）的目录。 |\n| subreport,\
  \ ..., subreportN | 包含已定义子报表的目录。每个子报表创建一个子目录，其内容与主报表相同，并包含一组文件和文件夹。 |\n| content.xml\
  \ | 此文件故意保持为空。它可用于稍后注入全局模板。 |\n\n| 文件 | 描述 |\n|---|---|\n| `datadefinition.xml`\
  \ | 包含数据源定义（指向 `datasources` 文件夹中的 `compound-ds.xml`）、函数和表达式以及参数。 |\n| `dataschema.xml`\
  \ | 可能包含用于增加数据源丰富性的额外元数据。 |\n| `layout.xml` | 定义报表频段和元素的整体结构。 |\n| `meta.xml` |\
  \ 此文件是 OpenDocument 标准的一部分，包含有关 `.prpt` 捆绑文件的信息。 |\n| `mimetype` | 这是一个简单的文本文件，其中包含\
  \ `.prpt` 捆绑文件的 MIME 类型，值为 `application/vnd.pentaho.reporting.classic.` |\n| `settings.xml`\
  \ | 包含报表全局配置属性，以及未来运行时信息的占位符。 |\n| `styles.xml` | 定义报表应以何种页面格式呈现、规定报表应如何呈现的样式规则、全局布局处理器、报表水印，以及最后报表的页眉和页脚部分。\
  \ |\n| `translation.properties, ...` | 本地化文件。有关详细信息，请参阅第 9 章 *国际化与本地化*。文件的内容与国际化与本地化章节中你看到的内容完全相同。\
  \ |\n| `wizard-specification.xml` | 包含在报表定义中使用报表向导时指定的数据。如果报表不是使用报表向导创建的，则该文件未定义。\
  \ |\n\n\n\n\n在以下章节中，您可以阅读有关每个相关文件或文件夹的具体组成。如果某个文件（或文件夹）未被涵盖或描述充分，请不要担心；查看一个现有的 `.prpt`\
  \ bundle 文件以了解其组成。XML 格式自解释且标签足够详细，能够让开发者清楚明白。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_519_0.png)\n\
  \n*`.prpt` bundle 文件解剖的描述有两大主要原因：首先，以便您深入理解 `.prpt` 格式的定义，其次，以便您无需使用 Pentaho Report\
  \ Designer 即可手动修改 `.prpt` bundle 文件。当然，我们并不是说您应该手动编写 `.prpt` bundle 文件，但很明显，通过详细了解格式，您将完全掌控您的\
  \ Pentaho 报表。*\n\n## datadefinition.xml 文件和 datasources 文件夹\n\n`datadefinition.xml`\
  \ 文件包含有关报表输入参数和报表数据源的信息，以及报表函数和表达式。此 XML 文件中的根元素是 data-definition，并使用 (http://reporting.pentaho.org/namespaces/engine/classic/bundle/data/1.0)\
  \ 命名空间进行 XML 验证。\n\n## 参数\n\n参数被定义为 `data-definition/parameter-definition` 元素的子元素。参数有两种类型：普通参数和列表参数。普通参数在\
  \ XML 中以 `plain-parameter` 元素表示。普通参数定义以下属性：\n\n| 名称 | 描述 |\n|---|---|\n| `default-value`\
  \ | 参数的默认值 |\n| `mandatory` | 如果设置为 true，则在报表渲染之前必须为此参数提供值 |\n| `name` | 参数名称 |\n\
  | `type` | 参数的完全限定 Java 类型 |\n\n列表参数在 XML 中以 `list-parameter` 元素表示。除了共享普通参数的相同属性外，列表参数还定义以下属性：\n\
  \n| 名称 | 描述 |\n|---|---|\n| `query` | 提供可选值列表的查询名称。 |\n| `allow-multi-selection`\
  \ | 如果设置为 true，此属性允许从查询结果中多次选择参数值，从而创建对象数组而不是单个对象。 |\n| `key-column` | 键列在所选行内作为结果返回。\
  \ |\n| `mandatory` | 如果为 true，则参数为必填项。 |\n| `strict-values` | 如果设置为 true，则会对参数值进行验证以确定其是否属于查询结果的一部分。\
  \ |\n| `value-column` | 值列在向用户展示数据时显示为选择项。可使用 `value-formula` 属性代替 `value-column`。\
  \ |\n| `value-formula` | 值公式在向用户展示数据时显示为选择项。可使用 `value-column` 属性代替 `value-formula`。\
  \ |\n\n子报表为其参数定义不同的 XML 元素层次结构。在子报表的上下文中，参数是从主报表上下文传入的，而不是用户或系统输入。子报表不使用 `parameter-definition`\
  \ 元素作为父元素，而是使用 `parameter-mapping` 元素。定义了两种子报表参数类型：导入和导出。它们的 XML 元素标签为 `import-parameter`\
  \ 和 `export-parameter`。它们都定义了以下两个属性：\n\n| 名称 | 描述 |\n|---|---|\n| `alias` | 参数的别名。对于导入的参数，这是子报表中的名称。对于导出的参数，这是主报表中的名称。\
  \ |\n| `name` | 参数的名称。对于导入的参数，这是主报表中的名称。对于导出的参数，这是子报表中的名称。 |\n\n## 数据源引用\n\n在 `datadefinition.xml`\
  \ 文件中，通过 `data-definition/data-source` XML 元素指定对报表数据源的单个引用。如果单个报表中使用多个数据源，则必须使用组合不同数据源的复合数据源。`data-source`\
  \ XML 元素定义以下属性：\n\n| 名称 | 描述 |\n|------|-------------|\n| `report-query` | 主报表使用的命名查询\
  \ |\n| `limit` | 如果指定，则定义报表主查询返回的行数限制 |\n| `timeout` | 如果指定，则定义报表主查询的查询超时 |\n| `ref`\
  \ | 对指定数据源定义文件的引用 |\n\n## 函数和表达式\n\n报表中定义的每个函数和表达式都由一个 `expression` XML 元素表示。Expression\
  \ 元素具有以下五个属性：\n\n| 名称 | 描述 |\n|------|-------------|\n| `name` | 函数或表达式的名称。 |\n\
  | `class` | 函数或表达式的类类型。如果指定公式，则不是必需的。 |\n| `deplevel` | 函数或表达式的依赖级别，决定执行顺序。 |\n\
  | `formula` | 如果指定，则定义执行的公式。 |\n| `initial` | 如果指定，则定义初始执行的公式。 |\n\n表达式还可能包含属性。这些属性以子\
  \ property 元素形式出现在 `properties` XML 元素中。每个 `property` XML 元素包含以下属性：\n\n| 名称 | 描述\
  \ |\n|------|-------------|\n| `name` | 属性的名称 |\n| `class` | 属性的类类型 |\n\n最后，每个 `property`\
  \ XML 元素包含一个文本节点，其中包含属性的值。\n\n## Datasources 文件夹\n\n对于报表中定义的每个数据源，都会创建一个包含连接所需信息的数据源文件。通常，这类文件存储在\
  \ `.prpt` bundle 文件中的 `datasources` 文件夹中。在本章中定义每个数据源文件超出了范围，但请尝试开发一个示例报表，然后以特定 `.prpt`\
  \ bundle 文件作为示例进行检查。\n\n如前所述，复合数据源通常用于在单个报表中引用多个数据源。对于每种数据源类型，都有等效的 XML 格式。这些格式记录在其\
  \ XML 模式文件中，可在下载报表引擎和扩展的源分发版时访问。\n\n## layout.xml 文件\n\n`layout.xml` 文件定义报表频段和元素的主要结构。每个频段都表示为一个\
  \ XML 元素，每个频段的元素都包含在该频段中。在 layout XML 文档的上下文中，使用了多个 XML 命名空间。主要命名空间包括：\n\n- `core`：这定义了核心元素和属性\n\
  - `layout`：这定义了本文档中的大部分元素\n- `styles`：这定义内联样式\n\n`styles` 命名空间将在接下来的 `styles.xml`\
  \ 部分中更详细地讨论。`core` 命名空间文档位于 http://reporting.pentaho.org/namespaces/engine/attributes/core。`layout`\
  \ 命名空间指定为本文档的默认命名空间，位于 http://reporting.pentaho.org/namespaces/engine/classic/bundle/layout/1.0。\n\
  \nlayout XML 文档包含一个根 layout XML 元素。该元素包含根级别频段信息。`layout` 元素可能包含定义报表级元数据的属性，例如报表的标题。以下子\
  \ XML 元素可在 layout 元素中指定：\n\n| 名称 | 描述 |\n|---|---|\n| `preprocessor` | 可以在报表 layout\
  \ 元素中定义任意数量的 `preprocessor` 元素。预处理器包含一个 `class` 属性，指定完全限定的 `preprocessor` Java 类，并且可能包含预处理器的\
  \ `property` 元素。预处理器可在报表渲染前对其进行操作。 |\n| `layout-processors` | 某些操作元素布局的函数可能出现在 layout\
  \ 文档的 `layout-processors` 元素中。例如，`ItemHideFunction` 被视为布局处理器，因此如果定义，它将被序列化在此文档部分中。\
  \ |\n\n\n\n\n| 名称 | 描述 |\n|------|-------------|\n| `report-header` | `report-header`\
  \ 元素指定报表头的布局。该元素包含一个名为 `root-level-content` 的子元素，其中包含对所有子元素的引用。请注意，`report-header`\
  \ 是一个报表元素。因此，它可能包含通用元素属性和子元素，这些在本章的 *Report elements* 部分后面定义。 |\n| `group` | `group`\
  \ 元素定义报表中定义的组和明细频带的整个层次结构。该元素层次结构在本章的 *Group and detail band hierarchy* 部分有更详细的定义。\
  \ |\n| `report-footer` | `report-footer` 元素指定报表脚部的布局。该元素包含一个名为 `root-level-content`\
  \ 的子元素，其中包含对所有子元素的引用。请注意，`report-footer` 是一个报表元素。因此，它可能包含通用元素属性和子元素，这些在本章的 *Report\
  \ elements* 部分后面定义。 |\n\n还请注意，报表本身表示为一个报表元素。因此，除了之前定义的属性和子元素外，报表还可能包含报表元素中定义的属性和元素（这些内容在本章的\
  \ *Report elements* 部分后面介绍）。\n\n## 组和明细频带层次结构\n\n一个组可能包含 `group-body` 或 `data-body`\
  \ 子 XML 元素。`group-body` 包含 XML 元素 `group`，用于表示分组的层次结构。除了包含 `group-body` 或 `data-body`\
  \ 外，`group` XML 元素还可能包含 `group-header` 和 `group-footer` XML 元素。`group-header` 和\
  \ `group-footer` XML 元素可能包含一个 `root-level-content` XML 元素，其中包含子布局元素。\n\n`data-body`\
  \ XML 元素包含与报表中行级数据相关的频带。该 XML 元素可能包含 `detail-header`、`details`、`no-data` 和 `details-footer`\
  \ 子 XML 元素。这些元素中的每一个都可能包含一个 `root-level-content` XML 元素，其中包含子布局元素。\n\n## 报表元素\n\n\
  前几章中定义的每个报表元素都在 XML 中表示，定义其属性以及其在频带内的位置。最常见的元素在此突出显示。\n\n所有元素都定义 `style:element-style`\
  \ 子 XML 元素，其中包含单个元素的样式信息。最常见的样式元素是 `style:spatial-styles`，它定义元素在频带中的位置以及应以何种大小渲染：\n\
  \n```\n<style:element-style>\n  <style:spatial-styles x=\"20\" y=\"240\" min-width=\"\
  100\" min-height=\"20\"/>\n</style:element-style>\n```\n\n以下是一些主要报表元素的列表，以及创建它们的特定详细信息：\n\
  \n| 名称 | 描述 |\n|------|-------------|\n| label | `label` XML 元素渲染一个标签。该元素包含一个 `core:value`\
  \ 子元素，其中使用 XML 文本作为标签值。 |\n| text-field | `text-field` XML 元素渲染一个文本字段。该元素包含一个 `core:field`\
  \ 属性，用于定义要渲染的字段。 |\n| number-field | `number-field` XML 元素渲染一个数字字段。该元素包含一个 `core:field`\
  \ 属性，用于定义要渲染的字段，以及一个 `core:format-string` 属性，用于定义要渲染的数字格式字符串。 |\n| date-field |\
  \ `date-field` XML 元素渲染一个日期字段。该元素包含一个 `core:field` 属性，用于定义要渲染的字段，以及一个 `core:format-string`\
  \ 属性，用于定义要渲染的日期格式字符串。 |\n| message | `message` XML 元素渲染一条消息。该元素包含一个 `core:value`\
  \ 子元素。 |\n| resource-label | `resource-label` XML 元素渲染一个资源标签。该元素包含一个引用消息包的 `core:resource-identifier`\
  \ 属性，以及一个 `core:value` 属性，用于指定包中使用的键。 |\n| resource-field | `resource-field` XML\
  \ 元素渲染一个资源字段。该元素包含一个引用消息包的 `core:resource-identifier` 属性，以及一个 `core:field` 属性，用于指定用于确定要解析的键的字段。\
  \ |\n| resource-message | `resource-message` XML 元素渲染一个资源消息。该元素包含一个引用消息包的 `core:resource-identifier`\
  \ 属性，以及一个 `core:value` 属性，用于指定消息。 |\n| rectangle | `rectangle` XML 元素渲染一个矩形。矩形的大小由前面定义的\
  \ `style:spatial-sizes` 元素确定。可以定义一个 `style:content-styles` XML 元素，用于指定诸如布尔属性 `draw-shape`\
  \ 和 `fill-shape` 之类的属性，以及诸如 `fill-color` 之类的颜色属性。颜色以 RGB 十六进制表示法表示，例如 `#ff3333`。\
  \ |\n| horizontal-line | `horizontal-line` XML 元素渲染一条水平线。线的长度由前面定义的 `style:spatial-sizes`\
  \ XML 元素确定。定义一个 `style:content-styles` XML 元素以指定线条样式和颜色。 |\n| vertical-line | `vertical-line`\
  \ XML 元素渲染一条垂直线。线的长度由前面定义的 `style:spatial-sizes` XML 元素确定。定义一个 `style:content-styles`\
  \ XML 元素以指定线条样式和颜色。 |\n| sub-report | `sub-report` XML 元素渲染一个子报表。属性 `href` 指定子报表在\
  \ `.prpt` 包中的位置。该 XML 元素还可以通过 `style:element-style` 子 XML 元素包含有关其位置和样式的信息，以及通过 `input-parameter`\
  \ 和 `output-parameter` XML 元素进行输入和输出参数映射。这些映射使用 `master-fieldname` 和 `detail-fieldname`\
  \ 属性进行配置。 |\n| content | `content` XML 元素渲染一张图片。图片二进制的位置由 `core:value` XML 元素确定。`content`\
  \ 元素的缩放和纵横比属性可以通过指定带有 `scale` 和 `keep-aspect-ratio` 属性的 `style:content-styles` 元素来自定义。\
  \ |\n| content-field | `content-field` XML 元素基于字段渲染动态图片。要渲染的动态内容的位置由 `core:field`\
  \ XML 元素确定。`content-field` 元素的缩放和纵横比属性可以通过指定带有 `scale` 和 `keep-aspect-ratio` 属性的\
  \ `style:content-styles` 元素来自定义。 |\n\n在 Pentaho Reporting 中定义了其他报表元素类型。表中列出的元素是最常见的元素，以及它们的一些主要属性和样式。\n\
  \n## settings.xml 文件\n\n`settings.xml` 文件包含报表的全局配置属性，以及未来运行时信息的占位符。\n\n配置设置的一个示例与公式表达式的执行相关。如果将属性\
  \ `org.pentaho.reporting.engine.classic.core.function.LogFormulaFailureCause` 设置为\
  \ true，并且将 Log4j 日志记录设置为 debug，当公式失败时，您将收到堆栈跟踪以及错误消息。\n\n还有其他配置属性，主要用于 Pentaho Report\
  \ Designer 等设计工具。在生成报表时，很少需要定义配置属性。\n\n## styles.xml 文件\n\n`styles.xml` 文件定义报表应以何种页面格式呈现、规定报表应如何呈现的样式规则、全局布局处理器、报表水印，以及最后报表的页面页眉和页脚部分。\n\
  \n`styles.xml` 文件包含 `style` 根 XML 元素，并包括与渲染样式相关的命名空间，包括前面定义的 `core` 和 `layout` 命名空间，以及作为默认命名空间的\
  \ `style` 命名空间，其位置为 http://reporting.pentaho.org/namespaces/engine/classic/bundle/style/1.0。可以在\
  \ `style` XML 元素中指定以下子元素：\n\n| 名称 | 描述 |\n|------|-------------|\n| `page-definition`\
  \ | `page-definition` XML 元素包含定义报表页面属性的属性。属性 `pageformat` 指定页面格式类型。属性 `horizontal-span`\
  \ 和 `vertical-span` 定义报表应跨越多少页。`width` 和 `height` 属性定义纸张的宽度和高度。`orientation` 属性定义页面应以纵向、横向或反向横向布局。属性\
  \ `margin-top`、`margin-left`、`margin-bottom` 和 `margin-right` 定义报表的边距值。 |\n| `style-rule`\
  \ | 报表中可以定义多个 `style-rules`。样式规则具有 `name` 和 `parent` 属性，用于定义一组样式的继承树。在 `style-rule`\
  \ 内，定义了诸如 `text-styles` 和 `spatial-styles` 之类的样式元素，其中包含特定的样式信息。 |\n| `layout:layout-processors`\
  \ | 某些操作整个报表布局的函数可能出现在样式文档的 `layout-processors` 部分。 |\n| `watermark` | `watermark`\
  \ XML 元素在背景中渲染，位于后面 |\n\n\n\n| | |\n|---|---|\n| layout: watermark | 报告中的其他频段。此元素包含一个名为\
  \ `root-level-content` 的子元素，其中包含对子元素的全部引用。请注意，`watermark` 是一个报表元素，因此它可能包含前面定义的一般元素属性和子元素。\
  \ |\n| layout:page-header | `page-header` XML 元素定义了每个页面的页眉内容。此元素包含一个名为 `root-level-content`\
  \ 的子元素，其中包含对子元素的全部引用。请注意，`page-header` 是一个报表元素，因此它可能包含前面定义的一般元素属性和子元素。 |\n| layout:page-footer\
  \ | `page-footer` XML 元素定义了每个页面的页脚内容。此元素包含一个名为 `root-level-content` 的子元素，其中包含对子元素的全部引用。请注意，`page-footer`\
  \ 是一个报表元素，因此它可能包含前面定义的一般元素属性和子元素。 |\n\n## 手动创建 .prpt 捆绑文件\n\n现在您已经了解了构成 `.prpt`\
  \ 捆绑文件的所有不同文件，让我们看看如何手动创建它。不要在这里列出组成 `.prpt` 捆绑文件所需的所有强制性文件内容，让我们使用 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库；具体来说，让我们使用存储在 `Chapter 11 - The PRPT format and the Java API to build it/my_reports/uncompressed_prpt.`\
  \ 中的文件夹。\n\n请花时间检查文件夹结构及其包含的每个文件。它们共同定义了一个非常简单的报表，其中包含 JDBC 数据源和少量元素。\n\n一旦确定了文件夹结构，请选择其中包含的所有文件并根据您的操作系统对其进行压缩（使用\
  \ `.zip` 格式）。将生成的 file 保存为 `example_xml.prpt`。现在，在 Pentaho Report Designer 中打开 `example_xml.prpt`\
  \ 文件并单击眼睛图标（\U0001F441）以预览它。您应该会看到一个如下所示的报表：\n\n|  |  |  |\n|---|---|---|\n| 10,100\
  \ | Mon Jan 06 00:00:00 CET 2003 | Shipped |\n| 10,101 | Thu Jan 09 00:00:00 CET\
  \ 2003 | Shipped |\n| 10,102 | Fri Jan 10 00:00:00 CET 2003 | Shipped |\n| 10,103\
  \ | Wed Jan 29 00:00:00 CET 2003 | Shipped |\n| 10,104 | Fri Jan 31 00:00:00 CET\
  \ 2003 | Shipped |\n| 10,105 | Tue Feb 11 00:00:00 CET 2003 | Shipped |\n| 10,106\
  \ | Mon Feb 17 00:00:00 CET 2003 | Shipped |\n| 10,107 | Mon Feb 24 00:00:00 CET\
  \ 2003 | Shipped |\n| 10,108 | Mon Mar 03 00:00:00 CET 2003 | Shipped |\n| 10,109\
  \ | Mon Mar 10 00:00:00 CET 2003 | Shipped |\n| 10,110 | Tue Mar 18 00:00:00 CET\
  \ 2003 | Shipped |\n| 10,111 | Tue Mar 25 00:00:00 CET 2003 | Shipped |\n| 10,112\
  \ | Mon Mar 24 00:00:00 CET 2003 | Shipped |\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_537_0.png)\n\
  \n在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers 仓库中，在路径 `Chapter\
  \ 11 - The PRPT format and the Java API to build it/my_reports` 中，您可以找到 `example_xml.prpt`，它完全实现了这里描述的示例。\n\
  \n## 使用 Pentaho Reporting Java API 构建报表\n\n现在您已经使用 Pentaho Reporting XML 格式构建了报表，是时候学习如何通过使用\
  \ Pentaho Reporting Java API 构建报表来进行类似练习了。为了避免遍历 Pentaho Reporting 的整个 Javadoc，本章仅涵盖要点。其中包括对重要包的引用，以便更轻松地找到构建报表所需的类、工厂和接口。Pentaho\
  \ Reporting 的 Javadoc 可在 http://javadoc.pentaho.com/reporting/ 获取。\n\n使用 Pentaho\
  \ Reporting API 的第一步是初始化报表引擎并创建一个空的 MasterReport 对象：\n\n```\n// Initialize the reporting\
  \ engine\nClassicEngineBoot.getInstance().start();\n\n// Create a report object\n\
  MasterReport report = new MasterReport();\n```\n\nClassicEngineBoot 和 MasterReport\
  \ 类位于 org.pentaho.reporting.engine.classic.core Java 包中。\n\n一旦创建了报表对象，您就可以逐步处理构成整个报表的各个组件。以下各节演示如何设置数据源、向报表添加参数、包含函数、向报表添加布局频段、向报表添加元素（您将学习如何添加标签和图表作为示例）以及自定义报表页面定义。\n\
  \n```\n// Define a simple TableModel.\nDefaultTableModel tableModel = new DefaultTableModel\
  \ (\n new Object[][]\n {\n {\"Line One\", \"Product One\", 10, 100},\n {\"Line Two\"\
  , \"Product Two\", 20, 200},\n ...\n },\n new String[] {\"Line\", \"Product\", \"\
  Cost\", \"Quantity\"}\n);\n\n// Create a TableDataFactory.\nfinal TableDataFactory\
  \ dataFactory = new TableDataFactory();\ndataFactory.addTable(\"default\", tableModel);\n\
  \n// Add the factory to the report.\nreport.setDataFactory(dataFactory);\n```\n\n\
  ```\n// Define a plain parameter.\nPlainParameter entry = new PlainParameter(\"\
  Product\", String.class);\n\n// Make the parameter Mandatory.\nentry.setMandatory(true);\n\
  \n// Add the parameter to our parameter definition.\nparamDef.addParameterDefinition(entry);\n\
  ```\n\n```\n// Create a formula expression.\nFormulaExpression formula = new FormulaExpression();\n\
  \n// Configure the formulas properties.\nformula.setName(\"totalCost\");\n\nformula.setFormula(\"\
  =[Cost]*[Quantity]\");\n\n// Add the expression to the report.\nreport.addExpression(formula);\n\
  ```\n\n## 定义报表布局\n\n与本章前面描述的 `layout.xml` 文档类似，定义构成报表布局的 Java Bean 包括报表页眉和页脚等通用报表频段，以及还包括明细频段的组频段层次结构。\n\
  \n### 通用报表频段\n\n对于报表中定义的每个频段，例如报表页眉、报表页脚、页面页眉和页面页脚，都有等效的 Java 类可用，所有这些类都扩展自位于 `org.pentaho.reporting.engine.classic.core`\
  \ 包中的通用抽象类 `Band`。这些频段都位于同一个包中。\n\n每个频段都定义了一组 Java Bean 属性，但大多数只是使用在 `Band` 抽象类中定义的属性。该类定义的主要方法之一是\
  \ `addElement(Element element)`，您将在创建元素并将其添加到其父频段时稍后使用。`Band` 实现的子集还实现了 `RootLevelBand`\
  \ 接口，该接口允许通过 `addSubReport(SubReport subreport)` 方法向频段添加子报表。诸如页面页眉、页面页脚和水印之类的频段不允许渲染子报表。以下是设置报表中报表页眉和报表页脚的示例：\n\
  \n```\n// Creating report header and footer objects.\nReportHeader reportHeader\
  \ = new ReportHeader();\nReportFooter reportFooter = new ReportFooter();\n```\n\n\
  ```\n// Adding the report header and footer to the report.\nreport.setReportHeader(reportHeader);\n\
  report.setReportFooter(reportFooter);\n```\n\n这已经不能更简单了！\n\n### 组频段层次结构\n\n组频段也遵循这种简单的\
  \ Java Bean 模式。由于可以嵌套组，因此 API 稍微复杂一些。RelationalGroup 类用于常规的关系分组。CrosstabGroup 用于在报表中定义交叉表。CrosstabGroup\
  \ API 超出了本章的范围，但在 Javadoc 中有很好的文档记录。\n\nRelationalGroup 类可能包含组页眉和组页脚，以及 GroupBody\
  \ 实现。GroupBody 是一个抽象类，SubGroupBody 和 GroupDataBody 扩展了它。SubGroupBody 允许嵌套组，而 GroupDataBody\
  \ 包含 ItemBand 以及另外三个使用较少的频段，DetailHeader、DetailsFooter 和 NoDataBand。\n\n要配置 RelationalGroup\
  \ 类，您必须提供一组定义分组的数据行字段。这可以通过 addField(String field)、setFields(List fields) 或 setFieldsArray(String[]\
  \ fieldsArray) 方法调用来完成。在此示例中，您将定义 RelationalGroup 和 ItemBand，并按 Name 字段分组。请注意，ItemBand\
  \ 类代表报表中的明细频段。\n\n```\n// Creating the root relational group.\nRelationalGroup group\
  \ = new RelationalGroup();\n\n// Using \"Line\" as the root grouping.\ngroup.addField(\"\
  Line\");\n\n// Creating a group data body.\nGroupDataBody groupData = new GroupDataBody();\n\
  \n// Creating an item band.\nItemBand itemBand = new ItemBand();\n\n// Place the\
  \ item band within the group data body.\ngroupData.setItemBand(itemBand);\n\n//\
  \ Place the group data body within the root group:\ngroup.setBody(groupData);\n\n\
  // Setting the root group within the report.\nreport.setRootGroup(group);\n```\n\
  \n\n\n## 向报表添加元素\n\n现在您已经为报表设置了所有频段，可以开始添加元素了。与之前为频段引入的类和接口不同，所有元素共享单一的类实现，`Element`，并由元素工厂创建。`Element`\
  \ 类位于 `org.pentaho.reporting.engine.classic.core` 包中。主要的元素工厂集合位于 `org.pentaho.reporting.engine.classic.core.elementfactory`\
  \ 包中。\n\n要使用工厂，首先实例化工厂对象，然后配置工厂的 Java Bean setter。一旦您在工厂对象中构建好元素，调用 `createElement()`\
  \ 以检索 `Element` 实例，然后将其添加到您的报表中。\n\n## 添加标签元素\n\n作为使用工厂的演示，以下代码使用 `LabelElementFactory`\
  \ 类实例化一个 `Element`：\n\n// Creating a label element factory instance.\nLabelElementFactory\
  \ factory = new LabelElementFactory();\n\n// Configuring the label's text.\nfactory.setText(\"\
  Product\");\n\n// Configure the label's location and size.\nfactory.setX(1f);\n\
  factory.setY(1f);\nfactory.setMinimumWidth(100f);\nfactory.setMinimumHeight(20f);\n\
  \n// instantiate the label element\nElement label = factory.createElement();\n\n\
  在此示例中，您实例化了工厂，为标签设置了值，然后生成了标签 `Element` 实例。工厂还将样式属性作为 Java Bean setter 暴露，因此可以配置此元素的位置、大小和字体样式。\n\
  \n现在，将标签添加到前面定义的 `ReportHeader` 实例中：\n\n// Adding the label to the report header.\n\
  reportHeader.addElement(label);\n\n需要注意的是，对于未设置 Java Bean 属性的元素，它们会从其父频段继承默认值。例如，您可以在\
  \ `ReportHeader` 实例上指定粗体属性，所有文本元素将默认为该值：\n\n// Setting the bold property to true,\
  \ inherited by all child text elements.\nreportHeader.getStyle().setStyleProperty(TextStyleKeys.BOLD,\
  \ true);\n\n## 添加图表元素\n\n作为最后一个也是最有意义的示例，让我们展示如何以编程方式向报表添加图表。在此示例中，您将学习如何包含基于每个\
  \ `Product` 字段的 `cost` 字段的条形图。正如您在第 7 章 *包含图形和图表于报表中* 中所学，图表元素需要数据收集器；对于条形图，收集器是\
  \ `CategorySetDataCollector`。以下是 `collector` 对象的定义：\n\n// Defining a data collector\
  \ for the chart.\nCategorySetDataCollector collector = new CategorySetDataCollector();\n\
  collector.setName(\"CategorySetCollectorFunction\");\ncollector.setSeriesColumn(0,\
  \ \"Cost\");\ncollector.setSeriesName(0, \"\");\ncollector.setValueColumn(0, \"\
  Cost\");\ncollector.setCategoryColumn(\"Product\");\ncollector.setAutoGenerateMissingSeriesNames(false);\n\
  \n所有可能的图表类型都可在 `org.pentaho.reporting.engine.classic.extensions.legacy.charts` 包中使用。对于条形图，必须使用\
  \ `BarChartExpression` 对象，如以下源代码所述：\n\n// Chart layout.\nBarChartExpression chartExpression\
  \ = new BarChartExpression();\nchartExpression.setShowLegend(false);\nchartExpression.setSeriesColor(\n\
  \  new String[] {\"#abcd37\",\"#0392ce\",\"#f9bc02\",\"#66b033\",\"#cc0099\"}\n\
  );\n\n正如您之前在标签中看到的那样，使用 `Element` 对象将条形图添加到报表中：\n\n// Declaring an element for the\
  \ chart.\nElement chartElement = new Element();\nchartElement.setElementType(new\
  \ LegacyChartType());\nchartElement.setName(\"MySuperCoolChartFromApi\");\nchartElement.setAttributeExpression(\n\
  \  AttributeNames.Core.NAMESPACE,\n  AttributeNames.Core.VALUE,\n  chartExpression);\n\
  chartElement.setAttribute(\n  LegacyChartElementModule.NAMESPACE,\n  LegacyChartElementModule.PRIMARY_DATA_COLLECTOR_FUNCTION_ATTRIBUTE,\n\
  \  collector);\nchartElement.getStyle().setStyleProperty(\n  ElementStyleKeys.MIN_HEIGHT,\n\
  \  200F);\nchartElement.getStyle().setStyleProperty(\n  ElementStyleKeys.MIN_WIDTH,\n\
  \  500F);\n\n// Adding the chart to the report header.\nreportHeader.addElement(chartElement);\n\
  \n## 开发 Pentaho 报表示例\n\n在此示例中，您将把之前学到的内容整合到一个简单的 Java 应用程序中。从第 3 章 *使用 Reporting\
  \ SDK 入门* 中共享的基础示例开始，您将 `PentahoServlet1` 类更改为以编程方式构建报表（类重命名为 `PentahoServlet`）。其思想是以与前面各节中看到的类似的方式手动构建报表。\n\
  \n特别是，报表将包含：\n\n- 一个表格数据源，列出一些虚拟产品，成本和数量作为度量\n- 一个名为 `totalCostPerProduct` 的公式，计算\
  \ `[Cost]*[Quantity]`\n- 报表页眉和页脚\n- 在报表页眉中显示每个产品成本的条形图\n- 报表页眉中的几个标签（`Product` 和\
  \ `TotalCost`）\n- 报表详细信息的两个字段，产品（一个 `text` 字段）和总成本（一个 `number` 字段）\n\n而不是在这里解释向\
  \ Maven 项目添加/删除什么内容，分享最终版本的源代码并描述如何运行它更有趣。开发报表的完整源代码版本可在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中找到，具体在 `Chapter 11 - The PRPT format and the Java API to build it/pentaho-reporting-manual-build`\
  \ 文件夹中。\n\n将 `pentaho-reporting-manual-build` 文件夹下载到本地机器，打开终端，进入此文件夹，然后执行以下命令：\n\
  \n```\nmvn clean package\n```\n\n完成后，是时候通过执行以下命令来运行项目了：\n\n```\njava -jar target/dependency/jetty-runner.jar\
  \ target/*.war\n```\n\n在浏览器中打开 `http://localhost:8080`，您应该会看到 PDF 格式的报表，如以下屏幕截图所示：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_550_0.png)\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_550_1.png)\n\
  \n花时间深入了解项目的细节并在您的开发环境中运行它。如果您能尝试修改源代码以使用 JDBC 数据源而不是表格数据源（`SampleData` 架构包含在 Maven\
  \ 项目的 `resources` 文件夹中），如果您能通过更改布局使报表更具吸引力，或者如果您能添加一个参数使其从 Java 工作，那就太好了。\n\n##\
  \ 摘要\n\n在发现 Pentaho Report Designer 的基本和高级功能之后，本章是第一个完全致力于 Pentaho Reporting SDK\
  \ 的技术和高级功能的章节。\n\n在本章中，您了解了有关 Pentaho Reporting 的 `.prpt` 捆绑文件格式的所有内容，以及 Pentaho\
  \ Reporting Java API 的详细信息。您了解了持久化报表的数据源、参数、表达式、布局和样式的各种 XML 文件的架构。\n\n通过 Pentaho\
  \ Java API 的示例，您了解了以编程方式构建报表是多么容易。您逐步了解了一个完整的示例，演示了在报表内创建不同的报表频段以及不同的元素。\n\n现在您已经阅读了本章，您应该对\
  \ `.prpt` 格式以及使用 Pentaho Reporting API 开发 Pentaho 报表周围的所有技术细节感到熟悉。这是对开发人员的先进任务，使用\
  \ Java 在您的自定义项目中创建复杂的 Pentaho 报表并嵌入其中。\n\n在下一章中，您将从开发的角度了解如何处理数据源（已在第 6 章 *配置 JDBC\
  \ 和其他数据源* 中介绍）。您将了解如何使用 Pentaho Reporting SDK 以编程方式开发 Pentaho 报表并处理所有可能类型的数据源。\n\
  \n\n\n## 使用数据源进行开发\n\n在本章中，您将使用各种方法在 Pentaho Reporting Engine 中加载数据，并深入了解 Pentaho\
  \ Reporting Engine 如何与这些数据源交互以呈现报表。在第 6 章 *配置 JDBC 和其他数据源* 中，您学习了如何在 Pentaho Report\
  \ Designer 中直接创建和使用所有可用的数据源类型。在本章中，您将借助示例了解如何将包含的 `DataFactory` 实现嵌入到您的环境中。您还将学习\
  \ Pentaho Reporting Engine Data API 规范的细节，以便在必要时实现自己的 `DataFactory`。\n\n本章技术性很强，并作为纯\
  \ Java 开发人员的教程编写。在本章结束时，您将能够从开发人员的角度舒适地使用所有类型的数据源来创建所有可能的 Pentaho 报表。本章解释的内容相关，如果您作为开发人员创建自己的\
  \ Java 应用程序并嵌入 Pentaho Reporting Engine，想要控制报表中呈现的所有可能数据。\n\n## Pentaho Reporting\
  \ Engine Data API\n\n**Pentaho Reporting Engine 数据 API** 是一个简单的 API，描述了 Pentaho\
  \ Reporting 如何访问数据以填充报表。在本节中，您将了解该 API 的核心接口。本章后面讨论的所有单独实现都实现了此 API。\n\n与 Pentaho\
  \ Reporting Engine Data API 相关的有两个主要 Java 接口。您将首先了解的接口是 `org.pentaho.reporting.engine.classic.core.DataFactory`。`DataFactory`\
  \ 接口的主要目的是生成一个实现 `javax.swing.table.TableModel` 接口的对象。`TableModel` 接口是一个非常简单的 API，用于访问二维单元格数据。这两个简单的\
  \ API 结合起来管理所有输入到 Pentaho Reporting 的数据。\n\n要为 Pentaho Reporting Engine 实现自己的 Java\
  \ 数据源，您所需要做的就是实现 `DataFactory` 和 `TableModel` 接口。但很可能，您将能够利用众多现有的 `DataFactory`\
  \ 实现之一来加载您的数据。\n\n## The DataFactory interface\n\n`DataFactory` 接口定义了一些字段和一些方法，在本节中讨论。报表定义文件中指定的任何参数都作为\
  \ `DataRow` 参数对象的组成部分可用。如果查询作为子报表的一部分使用，则从主报表传递到子报表的参数也可用。如果执行查询时出现问题，实现者可能会抛出 `ReportDataFactoryException`，Reporting\
  \ Engine 将正确处理该异常。\n\n以下是字段的定义，附带简要的使用说明和含义：\n\n| Field | Description |\n|---|---|\n\
  | `QUERY_LIMIT` | 返回结果行的最大数量。如果设置为零，则返回所有行。 |\n| `QUERY_TIMEOUT` | 查询返回的最大等待时间。如果设置为零，则不应使用超时。\
  \ |\n\n以下是方法的定义，附带简要的使用说明和含义：\n\n| Method | Description |\n|---|---|\n| `void cancelRunningQuery()`\
  \ | 如果由实现的 `DataFactory` 支持，则 `cancelRunningQuery` 方法调用将取消 `DataFactory` 当前正在执行的查询。\
  \ |\n\n| Signature | Description |\n|---|---|\n| Object clone() | 克隆当前的 DataFactory\
  \ 对象。 |\n| void close() | close 方法在由该 DataFactory 生成的所有 TableModel 接口的处理完成后调用一次。\
  \ |\n| DataFactory derive() | derive 方法创建一个新的 DataFactory，该 DataFactory 应独立于父 DataFactory。通常，这只是对\
  \ DataFactory 实现的 clone() 方法的调用。 |\n| String[] getQueryNames() | getQueryNames 方法返回\
  \ DataFactory 接口当前已知的可用查询名称列表。 |\n| void initialize( Configuration configuration,\
  \ ResourceManager resourceManager, ResourceKey contextKey, ResourceBundleFactory\
  \ resourceBundleFactory) | initialize 方法为 DataFactory 提供对报表引擎的 ResourceManager 的访问权限，使\
  \ DataFactory 能够访问其正确加载所需的资源。ResourceManager 类是用于从文件系统加载报表时使用的同一类。 |\n| boolean\
  \ isQueryExecutable( String query, DataRow parameters) | 检查此 DataFactory 是否可以执行该查询。\
  \ |\n| void open() | open 方法在初始化过程中调用，允许 DataFactory 在必要时进行初始化。 |\n| TableModel\
  \ queryData( String query, DataRow parameters) | queryData 方法由报表引擎调用以加载一个 TableModel\
  \ 对象。这是主要工厂方法。查询名称和一组参数都传递给 DataFactory。 |\n\n## The TableModel interface\n\n`javax.swing.table.TableModel`\
  \ 接口是 Java 平台 API 的一部分。Pentaho Reporting 使用 `TableModel` 接口访问呈现报表所需的二维数据。`TableModel`\
  \ 接口的部分内容在 Pentaho Reporting Engine 中未使用。具体来说，以下四个方法未使用：`isCellEditable`、`setValueAt`、`addTableModelListener`\
  \ 和 `removeTableModelListener`。所有未使用的方法都与更新 `TableModel` 相关。Pentaho Reporting Engine\
  \ 以只读方式使用 `TableModel` 接口，因此这些方法不适用。报表引擎使用以下四个方法：\n\n| Method | Description |\n\
  |---|---|\n| Class<?><br>getColumnClass(<br>int columnIndex) | 返回列中所有单元格值的最具体的超类。\
  \ |\n| int<br>getColumnCount() | 返回 TableModel 包含的列数。 |\n| String<br>getColumnName(<br>int\
  \ columnIndex) | 返回指定列索引的列名。 |\n| int<br>getRowCount() | 返回 TableModel 包含的行数。 |\n\
  | Object<br>getValueAt(<br>int rowIndex,<br>int columnIndex) | 根据指定的行和列索引返回特定数据单元格。这是从\
  \ TableModel 实例检索信息的主要方法。 |\n\n## DataFactory serialization\n\n除了这些核心接口之外，Data API\
  \ 还定义了用于序列化和反序列化 `DataFactory` 实现的接口和基本实现。这使得用户可以在客户端工具中定义数据源，并在服务器上执行报表期间使该信息可供报表引擎使用。此\
  \ API 部分相关的接口是 `DataFactoryReadHandler` 和 `DataFactoryWriteHandler`。\n\n## Additional\
  \ data source metadata\n\n作为 `TableModel` 的扩展，Pentaho Reporting Engine 提供了 `MetaTableModel`\
  \ 接口。`MetaTableModel` 定义了一个 API，用于访问作为数据源一部分可能可用的额外元数据。额外元数据的示例可以是字体或样式信息。\n\n##\
  \ Accessing data throughout a report\n\n配置完 `DataFactory` 实现后，了解如何在报表中访问此数据非常重要。如第\
  \ 11 章 *PRPT 格式和构建它的 Java API* 中所述，包含字段名称属性的元素通过数据源提供的列标题访问行数据。除了直接访问字段外，您还可以在函数和公式中访问此数据。\n\
  \nPentaho Reporting 中的函数包含名为 `Field` 或 `Fields` 的属性，允许您从定义的数据源中选择字段列表。要在公式中引用字段，需要将字段名称用括号括起来。在公式中引用字段名称的示例可以是\
  \ `[Product]`。\n\n当使用 Report Designer 中不直接支持的 `DataFactory` 时，例如 `hibernate.HQLDataFactory`，您需要手动在\
  \ Report Designer 中输入字段名称。在 Report Designer 中使用不受支持的 `DataFactory` 类的另一个问题是报表预览将无法使用。避免这些问题的一种策略是构建一个示例数据集，该数据集在\
  \ Report Designer 支持的 `DataFactory` 实现中包含相同的列标题，以便验证报表的外观符合预期。\n\n\n\n## 现有的 DataFactory\
  \ 实现\n\n现在你已经学习了 Pentaho Reporting Engine Data API 基础知识，在本节中，你将深入了解作为 Pentaho Reporting\
  \ Engine 组成部分的 `DataFactory` 实现。为了更好地理解，你将学习常用的 `DataFactory` 实现，包括最常用且使用最多的工厂的工作示例。正如你在本书前几章中多次看到的那样，所有示例都可在\
  \ https://github.com/fcorti/pentaho-8-reporting-for-java-developers 仓库中找到；具体在 `Chapter\
  \ 12 - Developing using data sources` 文件夹中。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_561_0.png)\n\
  \n> *在以下所有示例中，你都找不到最终报告的预览。这并不是因为布局不相关，而是本章更侧重于数据源配置。我们在过去章节中分享过的建议始终如一：考虑到你拥有完整的源代码，并且你的目标是学习\
  \ Pentaho Reporting，请尝试在你的开发环境中运行这些示例作为练习。*\n\n## TableDataFactory\n\n`org.pentaho.reporting.engine.classic.core.TableDataFactory`\
  \ 类是用于将数据加载到 Pentaho Reporting Engine 的最简单的 `DataFactory` 形式。\n`TableDataFactory`\
  \ 管理一组现有的 `TableModel` 实例并使其可供报表引擎使用。\n\n要构造 `TableDataFactory`，你可以使用默认构造函数或以下便捷构造函数：public\
  \ TableDataFactory(final String name, final TableModel tableModel);\n\n此便捷构造函数使用特定名称向\
  \ `TableDataFactory` 所知的 `TableModel` 实例列表添加一个 `TableModel` 实例。添加 `TableModel` 实例到\
  \ `TableDataFactory` 的另一种方法是使用以下 API 调用：public void addTable(final String name,\
  \ final TableModel tableModel);\n\n`addTable` 方法向 `TableDataFactory` 维护的命名 `TableModel`\
  \ 实例列表添加一个额外的表：虽然没有定义 `DataFactory` CSV，但有一个名为 `CSVTableModelProducer` 的辅助类可用，其位于\
  \ `org.pentaho.reporting.engine.classic.core.modules.misc.tablemodel` 包中。此 `CSVTableModelProducer`\
  \ 类将生成另一个类 `CSVTableModel`，然后你可以将其添加到 `TableDataFactory`。\n\n## TableDataFactory\
  \ 示例\n\n使用 `TableDataFactory` 类进行 Pentaho Report 开发的示例可在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中找到；具体在 `chapter 12 - Developing using data sources` 文件夹中。在文件夹内部，你将找到 `pentaho-reporting-data-table`\
  \ 项目，使用 `PentahoServlet` 类，其源代码如下：\n\n// Loading the Table DataFactory.\nDefaultTableModel\
  \ tableModel = new DefaultTableModel(\n    new Object[][] {\n        {\"Product\
  \ A\", 123},\n        {\"Product B\", 234},\n        {\"Product C\", 345},\n   \
  \     {\"Product D\", 456}\n    },\n    new String[] {\"Product\", \"Cost\"});\n\
  TableDataFactory dataFactory = new TableDataFactory();\ndataFactory.addTable(\"\
  default\", tableModel);\nreport.setDataFactory(dataFactory);\n\n要运行该项目，在本地机器上下载\
  \ `pentaho-reporting-data-source-table` 文件夹，打开终端，进入此文件夹，并按给定顺序执行以下命令：\n\n```\nmvn\
  \ clean install\nmvn package\njava -jar target/dependency/jetty-runner.jar target/*.war\n\
  ```\n\n在浏览器中打开 `http://localhost:8080`，你应该会以 PDF 格式看到 Pentaho 报表作为结果。\n\n## SQLReportDataFactory\n\
  \n`org.pentaho.reporting.engine.classic.core.modules.misc.datafactory.sql.SQLReportDataFactory`\
  \ 类允许你轻松使用 JDBC 和 SQL 为报表填充数据。\n\n要在环境中正确设置 `SQLReportDataFactory`，你首先需要创建一个 `ConnectionProvider`\
  \ 实例。可供使用的有三个 `ConnectionProvider` 实现（`StaticConnectionProvider`、`DriverConnectionProvider`\
  \ 和 `JndiConnectionProvider`）。`ConnectionProvider` 接口和三个实现位于与 `SQLReportDataFactory`\
  \ 相同的包中。\n\n`ConnectionProvider` 接口定义了单个 `createConnection` 方法，该方法应返回一个 JDBC 连接，供\
  \ `SQLReportDataFactory` 在生成结果集以填充报表时使用。\n\n## StaticConnectionProvider\n\n`ConnectionProvider`\
  \ 的第一个实现是 `StaticConnectionProvider` 类，其在构造函数中接受一个现有的 `java.sql.Connection` 对象：\n\
  \n```\nConnectionProvider conn = new StaticConnectionProvider(sqlConn);\n```\n\n\
  ## DriverConnectionProvider\n\n`ConnectionProvider` 的第二个实现是 `DriverConnectionProvider`\
  \ 类，它允许你轻松配置连接。`DriverConnectionProvider` 有一个默认构造函数，必须通过 setter 方法进行配置。在下表中，介绍了其中一些最相关的方法：\n\
  \n| 方法 | 描述 |\n|---|---|\n| `void setDriver(String driver)` | `setDriver` 方法的 driver\
  \ 值应设置为 JDBC 中使用的驱动程序类的完全限定名称。 |\n| `void setUrl(String url)` | `setUrl` 方法的 URL\
  \ 值应设置为用于连接到数据库的 JDBC URL。 |\n| `void setProperty(String name, String value)` |\
  \ `setProperty` 方法向 JDBC 配置属性添加一个附加属性。诸如 `user` 和 `password` 之类的属性通常通过属性列表传递，以便通过\
  \ `java.sql.DriverManager` 生成新连接。 |\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_566_0.png)\n\
  \n*请注意，通过使用 `DriverConnectionProvider`，每次在 API 上调用 `createConnection` 方法时，你都会为底层数据库创建一个新连接。这不是好也不是坏，但在开发过程中你应该意识到这一点。*\n\
  \n## JndiConnectionProvider\n\n第三个可用的 `ConnectionProvider` 是 `JndiConnectionProvider`。`JndiConnectionProvider`\
  \ 使用 **Java 命名和目录接口 (JNDI)** 来获取数据库连接。它有一个默认构造函数，以及以下可用于连接到 JNDI 数据源的 setter 方法。只有连接路径属性是强制性的。\n\
  \n在下表中，介绍了其中一些最相关的方法：\n\n| 方法 | 描述 |\n|---|---|\n| `void setConnectionPath(String\
  \ connectionPath)` | `setConnectionPath` 方法应设置为 JDBC 数据源的完整 JNDI 路径 |\n| `void setUsername(String\
  \ username)` | `setUsername` 方法是一个可选字段，在连接到数据源时可能需要 |\n| `void setPassword(String\
  \ password)` | `setPassword` 方法是一个可选字段，在连接到数据源时可能需要 |\n\nJNDI 可在许多应用服务器中使用。它也可以在普通\
  \ Java 应用中使用 simple JNDI 的帮助，网址为 http://www.osjava.org/simple-jndi。以下列表显示了在不同环境中的\
  \ JNDI 连接字符串示例，假设你已在该环境中配置了 JNDI 数据源：\n\n- **Tomcat Java:** `comp/env/jdbc/<DataSourceName>`\n\
  - **JBoss Java:** `<DataSourceName>`\n\n## 使用 SQLReportDataFactory\n\n一旦创建了 `ConnectionProvider`，现在是设置\
  \ `SQLReportDataFactory` 实例的时候了。`SQLReportDataFactory` 包含两个构造函数：第一个构造函数接受 `ConnectionProvider`，第二个构造函数接受一个现有的\
  \ `connection`，它在内部使用 `StaticConnectionProvider` 来提供连接。\n\n除了配置 `ConnectionProvider`\
  \ 之外，你还必须为 `SQLReportDataFactory` 提供要执行的查询。使用 `setQuery` 方法配置命名查询：\n\n```\nvoid\
  \ setQuery(final String name, final String queryString)\n```\n\n`setQuery` 方法接收查询名称和\
  \ SQL 查询本身。如前所述，本章示例中的主报表使用名称 `default` 来引用主查询。\n\n要在查询中包含报表参数，你可以在 SQL 中使用以下格式指定变量：`${<PARAMETER\
  \ NAME>}`。会生成一个 `PreparedStatement`，并且这些变量会根据 JDBC 规范进行适当参数化，以避免潜在的 SQL 注入攻击。除了传统的\
  \ SQL 语句之外，你还可以调用 SQL 存储过程。这些调用以字符串 `call` 开头，并被 `SQLReportDataFactory` 识别，以确保执行正确的\
  \ JDBC API 方法。\n\n如前所述，对所有 `DataFactory` 实例提供的 `QUERY_LIMIT` 和 `QUERY_TIMEOUT` 参数也适用于\
  \ `SQLReportDataFactory`。这些值会传递给 `Connection` 对象。因此，底层 JDBC 驱动程序也必须支持这些属性才能生效。\n\
  \n\n\n## SQLReportDataFactory 示例\n\n在本节中，您将看到两个完整的 Maven 项目，两者都使用 `SQLReportDataFactory`\
  \ 为 Pentaho 报表填充数据。两个示例都非常基础，重点在于数据源定义而非报表的布局。这两个 Maven 项目使用两种不同的提供程序开发相同的 Pentaho\
  \ 报表：`StaticConnectionProvider` 和 `DriverConnectionProvider`。\n\n开发报表的完整源代码可在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中找到；具体在 `Chapter 12 - Developing using data sources` 文件夹中。在该文件夹中，您将找到 `pentaho-reporting-data-source-static-jdbc`\
  \ 项目，使用 `PentahoServlet` 类，其源代码如下：\n\n```\n...\n// Defining the connection provider.\n\
  Connection connection = DriverManager.getConnection(\n    \"jdbc:hsqldb:./resources/sampledata/sampledata\"\
  ,\n    \"pentaho_user\",\n    \"password\");\nStaticConnectionProvider provider\
  \ = new StaticConnectionProvider(connection);\n\n// Defining the query.\nSQLReportDataFactory\
  \ dataFactory = new SQLReportDataFactory(provider);\nString sqlQuery = \"SELECT\
  \ PRODUCTNAME, QUANTITYINSTOCK FROM PRODUCTS\";\ndataFactory.setQuery(\"default\"\
  , sqlQuery);\nreport.setDataFactory(dataFactory);\n...\n```\n\n要运行该项目，请将 `pentaho-reporting-data-source-static-jdbc`\
  \ 文件夹下载到本地机器，打开终端，进入此文件夹，并按给定顺序执行以下命令：\n\n```\nmvn clean install\nmvn package\n\
  java -jar target/dependency/jetty-runner.jar target/*.war\n```\n\n然后在浏览器中打开 http://localhost:8080，您应该会以\
  \ PDF 格式看到 Pentaho 报表。\n\n在同一个 `Chapter 12 - Developing using data sources` 文件夹中，在\
  \ `pentaho-reporting-data-source-jdbc` 子文件夹内，您将找到另一个项目，使用 DriverConnectionProvider\
  \ 类，其源代码如下：\n\n```\n...\n// Defining the connection provider.\nDriverConnectionProvider\
  \ provider = new DriverConnectionProvider();\nprovider.setDriver(\"org.hsqldb.jdbcDriver\"\
  );\nprovider.setProperty(\"user\", \"pentaho_user\");\nprovider.setProperty(\"password\"\
  , \"password\");\nprovider.setUrl(\"jdbc:hsqldb:./resources/sampledata/sampledata\"\
  );\n\n// Defining the query.\nSQLReportDataFactory dataFactory = new SQLReportDataFactory(provider);\n\
  String sqlQuery = \"SELECT PRODUCTNAME, QUANTITYINSTOCK FROM PRODUCTS\";\ndataFactory.setQuery(\"\
  default\", sqlQuery);\nreport.setDataFactory(dataFactory);\n...\n```\n\n要运行该项目，请执行与前面描述完全相同的任务；将\
  \ pentaho-reporting-data-source-jdbc 文件夹下载到本地机器，打开终端，进入此文件夹，并按给定顺序执行以下命令：\n\n```\n\
  mvn clean install\nmvn package\njava -jar target/dependency/jetty-runner.jar target/*.war\n\
  ```\n\n然后在浏览器中打开 http://localhost:8080，您应该会以 PDF 格式看到 Pentaho 报表。\n\n如您所见，在两个项目的源代码中，SQLReportDataFactory\
  \ 的使用方式完全相同，且生成的报表在布局方面相同。\n\n## XPathDataFactory\n\n`org.pentaho.reporting.engine.classic.extensions.datasources.xpath.XPathDataFactory`\
  \ 类允许您基于 XML 数据填充报表，前提是其格式特定。此 `DataFactory` 接受以行和列格式化的 XML，其中 **XPath** 表达式返回包含列元素的行元素列表。每个列元素的节点名称代表列名，每个列的文本数据代表列的值。`XPathDataFactory`\
  \ 支持的行示例为：`<Row>\n<Column1>Row 1 Data In Column 1</Column1>\n<Column2>Row 1 Data\
  \ In Column 2</Column2>\n</Row>`\n\n默认情况下，列值被类型化为 Java 字符串。`XPathDataFactory` 提供了指定某些\
  \ Java 数据类型的机制，包括以下内容：\n\n- `java.lang.String`\n- `java.sql.Date`\n- `java.math.BigDecimal`\n\
  - `java.sql.Timestamp`\n- `java.lang.Integer`\n- `java.lang.Double`\n- `java.lang.Long`\n\
  \n这些类型可以在 XML 中作为预处理器步骤或注释指定：\n\n- **预处理器步骤：** `<?pentaho-dataset java.lang.Integer,\
  \ java.lang.String?>`\n- **根文档注释：** `<!-- java.lang.Integer, java.lang.String -->`\n\
  - **根结果集注释：** `<!-- java.lang.Integer, java.lang.String -->`\n\n列类型应与第一行中的元素顺序相同。第一行之后，列的顺序无关紧要。列的名称将用于将其放置在生成的\
  \ `TableModel` 的正确位置。`java.sql.Date` 和 `java.sql.Timestamp` 类均需要一个长数值，对应自 1970 年\
  \ 1 月 1 日 00:00:00 GMT 以来的毫秒数。\n\n要创建 `XPathDataFactory`，请使用默认构造函数。要配置 `XPathDataFactory`，您必须指定一个\
  \ XML 文件以及一组 XPath 查询。有关 XPath 的良好介绍，请参阅 http://www.w3.org/TR/xpath。\n\n下表中介绍了其中一些最相关的方法：\n\
  \n| 方法 | 描述 |\n|---|---|\n| `void setXqueryDataFile(String filename)` | `XPathDataFactory`\
  \ 使用 Pentaho Reporting Engine 的 `ResourceManager` 加载 XPath 文件。要设置 XML 文件的位置，请使用此方法。\
  \ |\n| `void setQuery(String name, String xpath)` | 可使用此方法添加命名查询。 |\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_572_0.png)\n\
  \n*无法通过 XPath 轻松对行数据进行排序的标准方法，因此请确保在用 `XPathDataFactory` 加载数据之前数据已按正确顺序排列。无法排序限制了此\
  \ `DataFactory` 的功能。*\n\n## XPathDataFactory 示例\n\n使用 `XPathDataFactory` 类进行 Pentaho\
  \ 报表开发的示例可在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers 仓库中找到；具体在\
  \ `chapter 12 - Developing using data sources` 文件夹中。在该文件夹中，您将找到 `pentaho-reporting-data-source-xpath`\
  \ 项目，使用 `PentahoServlet` 类，其源代码如下：\n\n```\n// Load report xpath data.\nXPathDataFactory\
  \ factory = new XPathDataFactory();\nfactory.setXqueryDataFile(\"file:./resources/xpathexample.xml\"\
  );\nfactory.setQuery(\"default\", \"/ExampleResultSet/Row\", false);\nreport.setDataFactory(factory);\n\
  ```\n\n以下是 `xpathexample.xml` 文件的内容：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<?pentaho-dataset java.lang.String,java.lang.String,java.lang.Integer?>\n<ExampleResultSet>\n\
  \  <Row>\n    <NAME>LibBase</NAME>\n    <DESCRIPTION>Base library containing common\
  \ functions </DESCRIPTION>\n    <SIZE>113210</SIZE>\n  </Row>\n  <Row>\n    <NAME>LibLoader</NAME>\n\
  \    <DESCRIPTION>Loading and caching library</DESCRIPTION>\n    <SIZE>53552</SIZE>\n\
  \  </Row>\n</ExampleResultSet>\n```\n\n请注意，Maven `pom.xml` 文件还应包含以下依赖项以下载正确的库：\n\
  \n```\n<dependency>\n  <groupId>pentaho-reporting-engine</groupId>\n  <artifactId>pentaho-reporting-engine-classic-extensions-xpath</artifactId>\n\
  \  <version>8.0-SNAPSHOT</version>\n</dependency>\n```\n\n要运行该项目，请将 `pentaho-reporting-data-source-xpath`\
  \ 文件夹下载到本地机器，打开终端，进入此文件夹，并按给定顺序执行以下命令：\n\n```\nmvn clean install\nmvn package\n\
  java -jar target/dependency/jetty-runner.jar target/*.war\n```\n\n然后在浏览器中打开 `http://localhost:8080`，您应该会以\
  \ PDF 格式看到 Pentaho 报表。\n\n## HQLDataFactory\n\n`org.pentaho.reporting.engine.classic.extensions.datasources.hibernate.HQLDataFactory`\
  \ 类允许您基于 Hibernate 查询填充报表。**Hibernate** 是一个开源关系持久化引擎。它允许您轻松地将 Java 对象持久化到数据库中。\n\
  \n与许多其他 `DataFactory` 实现类似，`HQLDataFactory` 使用连接到 Hibernate 的信息进行配置，并能够指定命名查询。`HQLDataFactory`\
  \ API 定义了一个名为 `SessionProvider` 的接口，它使用该接口访问当前的 hibernate `Session` 对象。`SessionProvider`\
  \ 包含一个单一的 API 方法 `getSession()`，它返回 `org.hibernate.Session` 的实例。此会话提供程序有两个已实现的版本：`StaticSessionProvider`\
  \ 和 `DefaultSessionProvider`。\n\n目前，`HQLDataFactory` 在 Pentaho Report Designer 中不可用作数据源，因此需要代码才能将\
  \ Hibernate 用作数据源。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_575_0.png)\n\n> *HQLDataFactory\
  \ 在此有文档记录，因为它被引用在官方 Javadoc 网站 (http://javadoc.pentaho.com/reporting/) 中。如您从 Pentaho\
  \ 的构件仓库关于 hibernate 扩展的信息中看到的，链接为：http://repository.pentaho.org/artifactory/repo/pentaho-reporting-engine/pentaho-reporting-engine-classic-extensions-hibernate/，该库不再受支持，且最新更新为\
  \ 3.9.2-GA 版本。*\n\n\n\n\n## 静态会话提供程序\n\n`StaticSessionProvider` 仅将 `org.hibernate.Session`\
  \ 对象作为构造函数参数接收，使已存在的 `Session` 对象可供 `HQLDataFactory` 使用。如果您的系统已拥有初始化的 Hibernate\
  \ 会话，则会使用此方法。\n\n## 默认会话提供程序\n\nDefaultSessionProvider 无需构造函数参数，并使用以下 API 调用从 Hibernate\
  \ 生成 SessionFactory：sessionFactory = new Configuration().configure().buildSessionFactory();\n\
  \n创建的 sessionFactory 实例用于创建新会话，HQLDataFactory 使用这些会话查询 Hibernate。\n\nHQLDataFactory\
  \ 提供两个构造函数。第一个构造函数接收 SessionProvider，如前所述。第二个构造函数仅接收 Hibernate Session 实例，用于查询 Hibernate。该构造函数在内部使用\
  \ StaticSessionProvider 将 Session 传递给 HQLDataFactory。\n\n实例化工厂后，您可以通过以下 API 调用向工厂添加命名查询：\n\
  \n```\nvoid setQuery(String name, String queryString);\n```\n\nsetQuery 方法接收查询名称和\
  \ Hibernate 查询，以便执行。\n\nHQLDataFactory 使用 Hibernate 的查询语言，其文档详见 http://www.hibernate.org/hib_docs/reference/en/html/queryhql.html。您可以通过使用\
  \ HQL 语法 :ParameterName 在查询中包含报表参数。HQLDataFactory 支持最大结果数和查询超时参数。\n\n## PmdDataFactory\n\
  \n`org.pentaho.reporting.engine.classic.extensions.datasources.pmd.PmdDataFactory`\
  \ 类允许您使用 Pentaho 元数据查询填充报表。Pentaho 元数据允许数据库管理员为终端用户定义其关系数据的业务层，简化了查询数据的能力，同时保护用户免受数据库模式中可能存在的复杂性。Pentaho\
  \ 的 **元数据查询语言** (**MQL**) 是一种基于 XML 的查询模型，可简化数据库查询，目前在 Pentaho 报表设计器和 **Pentaho\
  \ Web Ad Hoc Report** 客户端工具中使用。为了使 `PmdDataFactory` 正确初始化，它必须能够访问某些 Pentaho 元数据配置属性，这些属性可以在运行时配置或通过配置文件传入。\n\
  \n## XMI 文件\n\n如第 6 章《配置 JDBC 和其他数据源》中所述，**XMI** 文件包含已定义元数据模型的序列化版本，并且是执行 MQL 查询所必需的。XMI\
  \ 文件包含有关如何连接到关系数据源的信息，以及关系数据的业务模型映射。该文件在运行时加载到 Pentaho 元数据的配置存储库中。XMI 文件可通过调用 `setXmiFile`\
  \ 方法进行配置。此文件由 Pentaho Reporting Engine 的 `ResourceManager` 加载。\n\n## 域 ID\n\n元数据域\
  \ ID 用于将名称映射到元数据存储库中的 XMI 文件。此名称也在 MQL 查询文件中引用。因此，在 MQL 查询和 `PmdDataFactory` 中使用相同的名称非常重要。域可通过\
  \ `setDomainId` 方法设置。\n\n## IPmdConnectionProvider\n\n`PmdDataFactory` 使用 `IPmdConnectionProvider`\
  \ 接口获取元数据域对象以及查询的数据库连接。\n`IPmdConnectionProvider` 必须通过 `setConnectionProvider` 方法指定。默认实现\
  \ `PmdConnectionProvider` 管理 XMI 文件的加载以及根据 XMI 文件中提供的元数据信息确定要使用的数据库连接。\n\n下表显示了\
  \ `IPmdConnectionProvider` 类最相关的方法：\n\n| 方法 | 描述 |\n|---|---|\n| `IMetadataDomainRepository\
  \ getMetadataDomainRepository(`\n`String domain,`\n`ResourceManager resourceManager,`\n\
  `ResourceKey contextKey,`\n`String xmiFile)` | 基于域 ID 和 XMI 文件返回元数据存储库 |\n\n## PmdDataFactory\
  \ 示例\n\n使用 `PmdDataFactory` 类的 Pentaho 报表开发示例可在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中找到；具体在 `Chapter 12 - Developing using data sources` 文件夹中。在该文件夹中，您将找到 `pentaho-reporting-data-source-pmd`\
  \ 项目，使用 `PentahoServlet` 类，其源代码如下：\n\n```java\n// Loading MQL data source.\nPmdDataFactory\
  \ factory = new PmdDataFactory();\nfactory.setConnectionProvider(new PmdConnectionProvider());\n\
  factory.setXmiFile(\"resources/metadata.xmi\");\nfactory.setDomainId(\"test\");\n\
  factory.setQuery(\n    \"default\",\n    \"<?xml version='1.0' encoding='UTF-8'?>\"\
  \ +\n    \"<mql>\" +\n    \"  <domain_id>test</domain_id>\" +\n    \"  <model_id>BV_ORDERS</model_id>\"\
  \ +\n    \"  <options>\" +\n    \"    <disable_distinct>false</disable_distinct>\"\
  \ +\n    \"    <limit>-1</limit>\" +\n    \"  </options>\" +\n    \"  <selections>\"\
  \ +\n    \"    <selection>\" +\n    \"      <view>CAT_PRODUCTS</view>\" +\n    \"\
  \      <column>BC_PRODUCTS_PRODUCTNAME</column>\" +\n    \"      <aggregation>NONE</aggregation>\"\
  \ +\n    \"    </selection>\" +\n    \"    <selection>\" +\n    \"      <view>CAT_PRODUCTS</view>\"\
  \ +\n    \"      <column>BC_PRODUCTS_MSRP</column>\" +\n    \"      <aggregation>AVERAGE</aggregation>\"\
  \ +\n    \"    </selection>\" +\n    \"  </selections>\" +\n    \"  <constraints/>\"\
  \ +\n    \"  <orders/>\" +\n    \"</mql>\",\n    null,\n    null);\nreport.setDataFactory(factory);\n\
  ```\n\n请注意，该项目使用 `resources/metadata.xmi` 文件和 `resources/sampledata` HyperDB（从 `metadata.xmi`\
  \ 文件链接）。\n\n另请注意，Maven `pom.xml` 文件还应包含以下依赖项以下载正确的库：\n\n```xml\n<dependency>\n \
  \   <groupId>pentaho-reporting-engine</groupId>\n    <artifactId>pentaho-reporting-engine-classic-extensions-pmd</artifactId>\n\
  \    <version>8.0-SNAPSHOT</version>\n</dependency>\n<dependency>\n    <groupId>pentaho</groupId>\n\
  \    <artifactId>pentaho-metadata</artifactId>\n    <version>8.0-SNAPSHOT</version>\n\
  </dependency>\n```\n\n要运行该项目，请将 pentaho-reporting-data-source-pmd 文件夹下载到本地计算机，打开终端，进入此文件夹，并按给定顺序执行以下命令：\n\
  \n```\nmvn clean install\nmvn package\njava -jar target/dependency/jetty-runner.jar\
  \ target/*.war\n```\n\n然后在浏览器中打开 http://localhost:8080，您应该会以 PDF 格式看到 Pentaho 报表。\n\
  \n## Kettle 数据工厂\n\n`org.pentaho.reporting.engine.classic.extensions.datasources.kettle.KettleDataFactory`\
  \ 类允许您从 Kettle 转换填充报表。**Kettle** 是一种数据集成工具，也称为 **Extract Transform and Load (ETL)**\
  \ 工具。Kettle 转换支持多种数据源输入和转换功能。Kettle，也称为 **Pentaho Data Integration**，提供了从 Excel、SQL、XML、文本和许多其他数据源合并数据的机制。它还提供了将结果组合成单个结果集的能力，Pentaho\
  \ Reporting 可使用该结果集呈现报表。\n\n要初始化 `KettleDataFactory`，您必须提供要执行的 Kettle 转换的位置，以及从中获取数据的转换中的步骤。这是通过\
  \ `KettleTransformationProducer` 接口完成的。提供了两种 `KettleTransformationProducer` 的实现。第一个是\
  \ `KettleTransFromFileProducer`，它从文件系统加载 Kettle 转换。`KettleTransFromFileProducer`\
  \ 类必须使用以下参数实例化：final String transformationFile, // the path of the transformation\
  \ file to execute.\nfinal String stepName, // the step name to collect data from.\n\
  final FormulaArgument[] argumentNames, // the names of reporting properties to be\
  \ passed into Kettle via Transformation Arguments.\nfinal FormulaParameter[] variableNames\
  \ // the names of reporting properties to be passed into Kettle via Transformation\
  \ Parameters.\n\n`KettleTransformationProducer` 的第二个实现是 `KettleTransFromRepositoryProducer`。它从现有的\
  \ Kettle 仓库加载转换。`KettleTransFromRepositoryProducer` 类必须使用以下参数实例化：\n\n```\nfinal\
  \ String repositoryName, // the repository name.\nfinal String directoryName, //\
  \ the repository directory.\nfinal String transformationName, // the transformation\
  \ name in the repository.\nfinal String stepName, // the step name to collect data\
  \ from.\nfinal String username, // the repository user name.\nfinal String password,\
  \ // the repository password.\nfinal FormulaArgument[] argumentNames, // the names\
  \ of reporting properties to be passed into Kettle via Transformation Arguments.\n\
  final FormulaParameter[] variableNames // the names of reporting properties to be\
  \ passed into Kettle via Transformation Parameters.\n```\n\n\n\n`KettleDataFactory`\
  \ 有一个默认构造函数。要向 `KettleDataFactory` 添加 Kettle 转换查询，请调用 `setQuery(String, KettleTransformationProducer)`\
  \ 方法。\n\n## KettleDataFactory 示例\n\n使用 `KettleDataFactory` 类进行 Pentaho 报表开发的示例可以在\
  \ https://github.com/fcorti/pentaho-8-reporting-for-java-developers 仓库中找到；具体在 `chapter\
  \ 12 - Developing using data sources` 文件夹中。在该文件夹中，您会找到 `pentaho-reporting-data-source-kettle`\
  \ 项目，使用 `PentahoServlet` 类，其源代码如下：\n\n// Loading Kettle data source.\nKettleTransFromFileProducer\
  \ producer = new KettleTransFromFileProducer (\n  \"resources/CSV Input - Reading\
  \ customer data.ktr\",\n  \"Dummy (do nothing)\",\n  new FormulaArgument[0],\n \
  \ new FormulaParameter[0]);\nKettleDataFactory factory = new KettleDataFactory();\n\
  factory.setQuery(\"default\", producer);\nreport.setDataFactory(factory);\n\n请注意，该项目使用了\
  \ `resources/CSV Input - Reading customer data.ktr` 文件，其中包含 Pentaho Data Integration\
  \ 的转换，以及用于转换的 `resources/file/customer-100.txt`。\n\n同时请注意，Maven `pom.xml` 文件还应包含以下依赖项以下载正确的库：\n\
  \n```\n<dependency>\n    <groupId>pentaho-reporting-engine</groupId>\n    <artifactId>pentaho-reporting-engine-classic-extensions-kettle</artifactId>\n\
  \    <version>8.0-SNAPSHOT</version>\n</dependency>\n<dependency>\n    <groupId>pentaho-kettle</groupId>\n\
  \    <artifactId>kettle-core</artifactId>\n    <version>8.0-SNAPSHOT</version>\n\
  </dependency>\n<dependency>\n    <groupId>pentaho-kettle</groupId>\n    <artifactId>kettle-engine</artifactId>\n\
  \    <version>8.0-SNAPSHOT</version>\n</dependency>\n```\n\n要运行该项目，请将 `pentaho-reporting-data-source-kettle`\
  \ 文件夹下载到本地机器，打开终端，进入此文件夹，并按给定顺序执行以下命令：\n\n```\nmvn clean install\nmvn package\n\
  ```\n\n```\njava -jar target/dependency/jetty-runner.jar target/*.war\n```\n\n然后在浏览器中打开\
  \ `http://localhost:8080`，您应该会以 PDF 格式看到 Pentaho 报表作为结果。\n\n## BandedMDXDataFactory\
  \ 和 DenormalizedMDXDataFactory\n\n在涉及多维引擎的情况下访问 **在线分析处理 (OLAP)** 数据源，已在第 6 章 *配置\
  \ JDBC 和其他数据源* 中描述。为了涵盖所有可能的使用场景，Pentaho Reporting Engine Data API 定义了两个不同的包：\n\
  `org.pentaho.reporting.engine.classic.extensions.datasources.mondrian` 和\n`org.pentaho.reporting.engine.classic.extensions.datasources.olap4j`。\n\
  \n第一个，`org.pentaho.reporting.engine.classic.extensions.datasources.mondrian`，显然管理\
  \ **Mondrian** (http://community.pentaho.com/projects/mondrian) 数据源，而第二个，\n`org.pentaho.reporting.engine.classic.extensions.datasources.olap4j`，管理\
  \ **OLAP4J** (http://www.olap4j.org) 数据源类型。\n\n在这两个包中，两个类允许您填充报表：`BandedMDXDataFactory`\
  \ 类，用于管理规范化的 **多维表达式 (MDX)** 查询，以及 `DenormalizedMDXDataFactory` 类，用于管理非规范化的 **多维表达式\
  \ (MDX)** 查询。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_588_0.png)\n\n*有关规范化和非规范化\
  \ MDX 查询的定义和示例，请参阅第 6 章 配置 JDBC 和其他数据源；特别是 OLAP 数据源部分。*\n\n原生情况下，OLAP 数据源支持具有两个以上轴的结果集。在\
  \ Pentaho Reporting 使用的传统结果集中，有列标题以及数据行。使用 OLAP 数据时，数据源需要确定如何将更丰富的 OLAP 数据映射到标准的\
  \ `TableModel` 数据源。\n\n### BandedMDXDataFactory\n\n使用 `BandedMDXDataFactory` 时，工厂将\
  \ OLAP 结果集的行轴和列轴映射到 `TableModel`。列标题显示列轴中选择的维度。行显示所选行轴信息。例如，如果在列轴上从时间维度中选择了年份，则在列标题中您会看到成员名称\
  \ `[Time].[2017]`。\n\n`BandedMDXDataFactory` 对象针对 Mondrian 和 OLAP4J 的配置方式不同，即使它们使用相同的类和原则。对于\
  \ Mondrian，配置使用 `setDataSourceProvider(DataSourceProvider dataSourceProvider)` 方法来设置到\
  \ RDBMS 模式的连接，以及 `setCubeFileProvider(CubeFileProvider cubeFileProvider)` 方法来设置到\
  \ Mondrian 模式的连接。如您在 Javadoc 网站（[Javadoc 网站](http://javadoc.pentaho.com/reporting)）中看到的，`DataSourceProvider`\
  \ 由 `DriverDataSourceProvider` 和 `JndiDataSourceProvider` 实现，而 `CubeFileProvider`\
  \ 由 `DefaultCubeFileProvider` 实现。\n\n对于 OLAP4J，您必须首先创建一个实现 `OlapConnectionProvider`\
  \ 接口的对象，该对象将直接在 `BandedMDXDataFactory` 的构造函数中使用。`DriverConnectionProvider` 和 `JndiConnectionProvider`\
  \ 提供了实现。\n\n创建工厂后，在 Mondrian 和 OLAP4J 的情况下，您可以通过调用 `setQuery(String name, String\
  \ mdxQuery)` 方法添加 **多维表达式 (MDX)** 查询。\n\n### DenormalizedMDXDataFactory\n\n`DenormalizedMDXDataFactory`\
  \ 以非规范化或扁平化的方式将 OLAP 结果集的所有轴映射到 `TableModel`。列标题显示轴中选择的维度元数据以及所选度量元数据。例如，如果从时间维度中选择了年份，则在列标题中您会看到层级名称\
  \ `[Time].[Year]`。`DenormalizedMDXDataFactory` 通常与交叉表一起使用，并将在第 13 章 *国际化、子报表和 Java\
  \ 中的交叉表* 中再次使用。\n\n### BandedMDXDataFactory 示例\n\n在本节中，您将看到两个完整的 Maven 项目开发完全相同的\
  \ Pentaho 报表：一个使用 Mondrian 原生提供程序，另一个使用 OLAP4J 提供程序访问相同的 Mondrian 模式。如本章前面介绍的那样，在这两种情况下都将使用\
  \ `BandedMDXDataFactory`，即使会使用两种不同的实现。\n\n第一个示例是关于使用 Mondrian 原生提供程序。开发 Pentaho\
  \ 报表的完整源代码可以在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中找到；具体在 `chapter 12 - Developing using data sources` 文件夹中。在该文件夹中，您会找到 `pentaho-reporting-data-source-mondrian`\
  \ 项目，使用 `PentahoServlet` 类，其源代码如下：\n\n```\n...\n// Data source provider.\nDriverDataSourceProvider\
  \ dsProvider = new DriverDataSourceProvider();\ndsProvider.setDriver(\"org.hsqldb.jdbcDriver\"\
  );\ndsProvider.setProperty(\"user\", \"pentaho_user\");\ndsProvider.setProperty(\"\
  password\", \"password\");\ndsProvider.setUrl(\"jdbc:hsqldb:./resources/sampledata/sampledata\"\
  );\n\n// Mondrian cube provider.\nDefaultCubeFileProvider cubeProvider = new DefaultCubeFileProvider();\n\
  cubeProvider.setMondrianCubeFile(\"./resources/steelwheels.mondrian.xml\");\n\n\
  // Loading Mondrian data source.\nBandedMDXDataFactory factory = new BandedMDXDataFactory();\n\
  factory.setDataSourceProvider(dsProvider);\nfactory.setCubeFileProvider(cubeProvider);\n\
  factory.setQuery(\n\"default\",\n\"SELECT \" +\n\"{[Measures].[Sales]} ON COLUMNS,\"\
  \ +\n\"{Descendants([Time].Children, [Time].[Months])} ON ROWS\" +\n\"FROM\" +\n\
  \"[SteelWheelsSales]\");\nreport.setDataFactory(factory);\n...\n```\n\n要运行该项目，请将\
  \ `pentaho-reporting-data-source-mondrian` 文件夹下载到本地机器，打开终端，进入此文件夹，并按此顺序执行以下命令：\n\
  \n```\nmvn clean install\nmvn package\njava -jar target/dependency/jetty-runner.jar\
  \ target/*.war\n```\n\n然后在浏览器中打开 http://localhost:8080 ，你应该会看到 Pentaho 报表以 PDF 格式作为结果显示。\n\
  \n在同一个 Chapter 12 - Developing using data sources 文件夹中，在 pentaho-reporting-data-source-olap4j\
  \ 子文件夹内，你会找到另一个项目，使用 OLAP4J 提供程序并包含 PentahoServlet 类，其源代码如下：\n\n// Loading OLAP\
  \ data.\nDriverConnectionProvider provider = new DriverConnectionProvider();\nprovider.setDriver(\"\
  mondrian.olap4j.MondrianOlap4jDriver\");\nprovider.setUrl(\"jdbc:mondrian:\");\n\
  provider.setProperty(\"Catalog\", \"./resources/steelwheels.mondrian.xml\");\nprovider.setProperty(\"\
  JdbcUser\", \"pentaho_user\");\nprovider.setProperty(\"JdbcPassword\", \"password\"\
  );\nprovider.setProperty(\"Jdbc\", \"jdbc:hsqldb:./resources/sampledata/sampledata\"\
  );\nprovider.setProperty(\"JdbcDrivers\", \"org.hsqldb.jdbcDriver\");\n\n// Creating\
  \ the factory.\nBandedMDXDataFactory factory = new BandedMDXDataFactory(provider);\n\
  factory.setQuery(\n\"default\",\n\"SELECT \" +\n\"{[Measures].[Sales]} ON COLUMNS,\"\
  \ +\n\"{[Descendants([Time].Children, [Time].[Months])} ON ROWS\" +\n\"FROM\" +\n\
  \"[SteelWheelsSales]\");\nreport.setDataFactory(factory);\n...\n```\n\n要运行该项目，请执行与前面描述完全相同的任务；将\
  \ pentaho-reporting-data-source-olap4j 文件夹下载到本地机器，打开终端，进入此文件夹，并按以下顺序执行以下命令：\n\n\
  ```\nmvn clean install\nmvn package\njava -jar target/dependency/jetty-runner.jar\
  \ target/*.war\n```\n\n然后在浏览器中打开 http://localhost:8080 ，你应该会看到 Pentaho 报表以 PDF 格式作为结果显示。\n\
  \n如你所见，运行这两个项目时，Pentaho 报表在布局和内容方面完全相同，这是有道理的，因为它们是通过不同方式（一种使用原生 Mondrian 提供程序，另一种使用\
  \ OLAP4J 提供程序）访问同一个 Mondrian 模式并使用相同的 MDX 查询。\n\n## CompoundDataFactory\n\n`org.pentaho.reporting.engine.classic.core.CompoundDataFactory`\
  \ 类在处理包含与主报表不同数据源的子报表时非常有用。例如，使用 `CompoundDataFactory` 时，你可以为你的主报表查询使用 `SQLReportDataFactory`，为子报表查询使用\
  \ `XPathDataFactory`。`CompoundDataFactory` 具有默认构造函数，你可以通过调用 `add(DataFactory)` 或\
  \ `add(index, DataFactory)` 方法添加子数据工厂。`DataFactory` 实例按其索引的顺序被查询。\n\n所有由 Report\
  \ Designer 生成的报表都使用 `CompoundDataFactory`，使得用户可以在用户界面中为其报表添加不同类型的数据源。\n\n## ScriptableDataFactory\n\
  \n`org.pentaho.reporting.engine.classic.extensions.datasources.scriptable.ScriptableDataFactory`\
  \ 类允许你使用符合 Bean 脚本框架的脚本填充报表。**Bean 脚本框架 (BSF)** 是一组 Java 类，为 Java 应用程序提供脚本语言支持，并允许从脚本语言访问\
  \ Java 对象和方法。\n\n`ScriptableDataFactory` 使用 Bean 脚本框架在不同的脚本语言中执行查询脚本，返回 `TableModel`，可作为\
  \ Pentaho 报表中的数据源使用。机制始终与之前的（也是最常见的）示例相同。\n\n## 摘要\n\n在本章中，在第 6 章 *配置 JDBC 和其他数据源*\
  \ 完成介绍之后，你再次使用各种方法将数据加载到 Pentaho Reporting Engine 中。本章开始时，你被介绍到 Pentaho Reporting\
  \ Engine 数据 API，发现了 `DataFactory` 接口以及 `TableModel` 接口及其关系和使用方式。\n\n在你了解了所有可用的 `DataFactory`\
  \ 实现后，包括最佳使用的技术细节描述，以及一些具体示例以展示开发过程中如何使用它们，你学会了如何访问数据来构建 Pentaho 报表。\n\n现在你已经阅读了本章，你应该对\
  \ Pentaho Reporting Engine 数据 API 以及以编程方式开发 Pentaho 报表周围的所有技术细节感到熟悉。这对开发者来说是一项高级任务：在使用\
  \ Java 的自定义项目中创建复杂的 Pentaho 报表并嵌入其中。\n\n在下一章中，你将看到一些其他高级功能，这些功能已在第 9 章 *国际化和本地化*\
  \ 和第 10 章 *子报表和交叉表* 中介绍过。在阅读过程中，你将继续使用 Pentaho Reporting SDK 以编程方式处理 Pentaho 报表的开发。\n\
  \n## Internationalization, Subreports, and Cross Tabs Using Java\n\n在第 12 章 *使用数据源开发*\
  \ 之后，本章你将继续发现第 9 章 *国际化和本地化* 和第 10 章 *子报表和交叉表* 中已介绍的高级功能，但从开发角度出发。如往常一样，描述将采用 *通过示例学习*\
  \ 的方法，并借助具体且可用的项目。\n\n你将首先学习有关开发可在你想要的所有语言中本地化的 Pentaho 报表的全部内容。然后你将了解如何使用 Java\
  \ 以编程方式开发子报表，最后但同样重要的是，你将了解如何使用 Java 开发交叉表。\n\n本章技术性很强，是为 Java 开发者编写的教程。在本章结束时，你将从开发者的角度对\
  \ Pentaho Reporting 的所有高级功能感到熟悉。本章是涵盖构建自己的 Java 应用程序并嵌入 Pentaho Reporting Engine\
  \ 的现有功能的最后一章。\n\n## Internationalization and localization using Java\n\n正如你在第 9\
  \ 章 *国际化和本地化* 中学到的那样，与所有现代软件一样，Pentaho Reporting 的开发遵循所有最佳实践和模式以支持国际化，以便可以在无需工程更改的情况下适应各种语言和地区。在本节中，特别是从\
  \ Java 角度来看，你将达到同样的专业水平。在接下来的部分中，你将从 Java 角度了解 Pentaho 报表本地化的基础知识；然后你将继续了解如何测试本地化，最后，你将看到一些源代码的完整工作示例，可在众所周知的\
  \ GitHub 仓库中找到。\n\n## Resources for localization using Java\n\n要国际化报表，你必须在创建报表时使用\
  \ Pentaho Reporting 中可用的资源元素。每个资源元素定义一个资源基和资源键引用。通常，资源基指的是存储本地化名称的消息属性文件的名称。有关 Java\
  \ 中资源包的默认处理，请参阅 Java 的 *i18n* 教程中关于资源包的内容，网址为 http://java.sun.com/docs/books/tutorial/i18n/resbundle/concept.html。\n\
  \n构建报表后，你需要配置应用程序以访问资源包文件。Pentaho Reporting 定义了 `ResourceBundleFactory` API，允许你自定义这些文件的加载方式。默认情况下，报表配置为使用\
  \ `DefaultResourceBundleFactory` 实现，该实现使用 Java 的 `ResourceBundle` 实现。此实现在 Java 类路径上解析提供的资源基值。\n\
  \n`ResourceBundleFactory` 还负责确定在渲染报表时使用的特定区域设置。`DefaultResourceBundleFactory` 使用默认系统区域设置，但也包含\
  \ `setLocale()` 方法以在必要时配置区域设置。我们将在示例中使用此行为，通过设置默认区域设置来控制报表的最终版本。\n\n在报表中使用资源元素允许你本地化标签、字段和消息，正如你在第\
  \ 9 章 *国际化和本地化* 中学到的那样。特别是，`resource-label` 在 `ResourceLabelElementFactory` 中有对应的类，`resource-field`\
  \ 在 `ResourceFieldElementFactory` 中有对应的类，`resource-message` 在 `ResourceMessageElementFactory`\
  \ 中有对应的类。在下面的示例中，你将只看到如何使用 `ResourceLabelElementFactory`，但其他资源工厂的使用遵循相同的原则。\n\n\n\
  \n\n## 使用 Java 测试本地化\n\n如你在上一节中所读到的，ResourceBundle 的控制是通过 locale 完成的。默认情况下使用系统区域设置，可以通过以下源代码显式指定：\n\
  \n```java\nLocale locale = new Locale();\n```\n\n如果你想控制（并更改）默认区域设置，可以使用以下源代码设置其值（示例展示如何设置西班牙语）：\n\
  \n```java\nLocale locale = new Locale(\"es\");\nLocale.setDefault(locale);\n```\n\
  \n这段小代码在测试期间非常有用，如果你想以编程方式控制 Pentaho 报表 的区域设置。在下面的示例中，你将看到如何从默认区域设置切换到自定义区域设置以测试最终版本。\n\
  \n## 使用 Java 进行报表本地化的示例\n\n为了在实践中展示使用 Java 进行报表本地化的示例，让我们使用 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库；具体来说，项目 `pentaho-reporting-localization`，存储在 `Chapter 13 - Internationalization,\
  \ sub-reports and cross-tabs using Java` 文件夹中。\n\n在查看源代码之前，让我们先检查 `resources` 文件夹的内容，其中可以找到两个属性文件：\n\
  \n- `my-first-reporting-project_en.properties`: 包含英语语言的资源键\n- `my-first-reporting-project_es.properties`:\
  \ 包含西班牙语的资源键\n\n你已经学习了 *i18n* 表示的基础知识，并且已经在第 9 章 *Internationalization and Localization*\
  \ 的示例中使用了这些属性。要将属性文件包含在项目的分发包中，请向 `pom.xml` 文件添加以下 `resources` 标签：\n\n```xml\n...\n\
  <build>\n  <finalName>pentaho-reporting-web-app</finalName>\n  <resources>\n   \
  \ <resource>\n      <directory>resources</directory>\n    </resource>\n  </resources>\n\
  \  <plugins>\n    ...\n  </plugins>\n</build>\n```\n\n现在让我们进入众所周知的 `PentahoServlet`\
  \ 类，其中可以找到以下源代码：\n\n```java\n...\n// Defining the default locale.\nLocale locale\
  \ = new Locale(\"es\");\nLocale.setDefault(locale);\n```\n\n```java\n// Adding a\
  \ resource label to the report header band.\nResourceLabelElementFactory labelFactory\
  \ = new ResourceLabelElementFactory();\nlabelFactory.setResourceKey(\"ORDERNUMBER\"\
  );\nlabelFactory.setResourceBase(\"my-first-reporting-project\");\n...\nElement\
  \ labelField = labelFactory.createElement();\nreportHeader.addElement(labelField);\n\
  ...\n```\n\n如你所见，第一个任务是设置西班牙语为默认区域设置。这是通过使用 `Locale locale = new Locale(\"es\")`\
  \ 然后将 `locale` 变量用作默认值来完成的。完成后，`ResourceLabelElementFactory` 类被声明以创建 `resource-label`\
  \ 元素。`setResourceKey` 方法使你能够指向属性文件中的正确描述，而 `setResourceBase` 方法使你能够指向正确的属性文件。其余所有方法都与之前示例中使用的类似。\n\
  \n要运行项目，请打开终端，进入项目文件夹，并按以下顺序执行命令：\n\n```\nmvn clean install\nmvn package\njava -jar\
  \ target/dependency/jetty-runner.jar target/*.war\n```\n\n在浏览器中打开 http://localhost:8080，你应该可以看到\
  \ Pentaho 报表，如以下屏幕截图所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_602_0.png)\n\
  \n要更改默认语言，如本章前面所述，将区域设置更改为 `Locale locale = new Locale(\"en\")`。这样，你将要求项目使用英语区域设置作为默认值。通过再次编译项目并重复上述命令，你将获得以下预览，其中标签仅通过更改区域设置而更改：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_603_0.png)\n\n## 使用 Java 的子报表\n\n如你在第\
  \ 10 章 *Subreports and Cross Tabs* 中所学，Pentaho Reporting 中的子报表允许你在主报表中包含功能齐全的报表。在本节中，特别是从\
  \ Java 角度来看，你将达到相同的专业水平。在以下各节中，你将学习 Pentaho 子报表的基础知识，然后继续了解 GitHub 仓库中可用的完整工作源代码示例。\n\
  \n## 使用 Java 的子报表\n\n为了了解使用 Java 开发子报表，让我们描述用于其定义的各种组件。首先是 `SubReport` 类，用于在 `MasterReport`\
  \ 中声明和管理子报表实例。与常规元素不同，子报表是使用 `addSubReport(SubReport subReport)` 方法添加到报表频带中的。\n\n\
  如你在第 10 章 *Subreports and Cross Tabs* 中所见，子报表在内容定义时始终使用不同的数据源。使用 Java，`MasterReport`\
  \ 中声明的所有查询默认由子报表继承，但需要使用 `setQuery` 方法为 `MasterReport` 和 `SubReport` 指定查询。\n\n如常发生的情况，子报表可能会使用来自\
  \ `MasterReport` 的一个或多个参数来指导正确的渲染。为了指定输入参数，`SubReport` 类提供了 `addInputParameter(String\
  \ outerName, String sourceColumn)` 方法。\n\n除了前面讨论的话题外，`SubReport` 的使用与常规 `MasterReport`\
  \ 类似，你可以在其中添加元素、自定义布局等。\n\n## 使用 Java 的子报表示例\n\n为了在实践中展示使用 Java 的子报表示例，让我们使用 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库；具体来说，项目 `pentaho-reporting-subreport`，存储在 `Chapter 13 - Internationalization,\
  \ sub-reports and cross-tabs using Java` 文件夹中。\n\n如 `PentahoServlet` 类所示，`DataFactory`\
  \ 使用以下代码片段声明 `default` 查询和 `default2` 查询：\n\n```java\n// Defining the queries.\n\
  SQLReportDataFactory dataFactory = new SQLReportDataFactory(provider);\ndataFactory.setQuery(\n\
  \"default\",\n\"SELECT ORDERNUMBER, ORDERDATE FROM ORDERS\");\ndataFactory.setQuery(\n\
  \"default2\",\n\"SELECT PRODUCTCODE, QUANTITYORDERED, PRICEEACH FROM ORDERDETAILS\
  \ \" +\n\"WHERE ORDERNUMBER=${ORDERNUMBER} ORDER BY ORDERLINENUMBER ASC LIMIT 5\"\
  );\nreport.setDataFactory(dataFactory);\n```\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_606_0.png)\n\
  \n> *请非常注意为 `DataFactory` 中声明的查询提供唯一名称。如果不这样做，你的应用程序的行为将不可预测，并且你将浪费大量时间痛苦地理解问题究竟出在哪里。*\n\
  \n如本章前面所述，`MasterReport` 和 `SubReport` 使用以下代码声明它们将要使用的查询：\n\n```java\n...\nreport.setQuery(\"\
  default\");\n...\nsubReport.setQuery(\"default2\");\n...\n```\n\n在下面的 Java 代码片段中，你可以找到\
  \ `SubReport` 对象的声明、向子报表频带添加元素的示例，以及将子报表包含在主报表中的示例：\n\n```java\n...\n// Creating\
  \ the subreport.\nSubReport subReport = new SubReport();\nsubReport.setQuery(\"\
  default2\");\nsubReport.addInputParameter(\"ORDERNUMBER\", \"ORDERNUMBER\");\n...\n\
  // Adding a field to the subreport's details band.\nTextFieldElementFactory textFactory2\
  \ = new TextFieldElementFactory();\n...\nElement textField2 = textFactory2.createElement();\n\
  subReport.getItemBand().addElement(textField2);\n...\n// Adding the subreport to\
  \ the report's details band.\nitemBand.addSubReport(subReport);\n...\n```\n\n要运行项目，请打开终端，进入项目文件夹，并按以下顺序执行命令：\n\
  \n```\nmvn clean install\nmvn package\njava -jar target/dependency/jetty-runner.jar\
  \ target/*.war\n```\n\n在浏览器中打开 http://localhost:8080，你应该可以看到 Pentaho 报表，如以下屏幕截图所示：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_607_0.png)\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_607_1.png)\n\
  \n如你所见，结果的 Pentaho 报表与我们在第 10 章 Subreports and Cross Tabs 中使用 Pentaho Report Designer\
  \ 开发的报表完全相同。换句话说，在这里你达到了对 Pentaho Report Designer 的相同专业水平，但使用的是你的 Java\n\n开发技能。\n\
  \n## 使用 Java 的交叉表\n\n在第 10 章 *子报表和交叉表* 中，你已经全面了解了交叉制表（或交叉表），它允许你在 Pentaho 报表中查看维度数据。在本节中，你将从\
  \ Java 角度达到同样的专业水平。在接下来的章节中，你将学习 Pentaho 交叉表的基础知识，然后再进入理解一个完整可用的源代码示例，该示例可在 GitHub\
  \ 仓库中获得。\n\n## 使用 Java 的交叉表\n\n要了解使用 Java 开发交叉表，让我们介绍用于其定义的各种组件。首先是 `CrosstabGroup`\
  \ 类，用于在 `MasterReport` 中声明和管理交叉表实例。与常规元素不同，交叉表是使用 `setRootGroup(CrosstabGroup crosstabGroup)`\
  \ 方法添加到报表中的。\n\n正如你在第 10 章 *子报表和交叉表* 中所看到的，交叉表可以使用 MDX 查询或具有类似 MDX 结构的更传统的 SQL 查询。在每种情况下，交叉表的组成都是分步骤完成的：首先定义交叉表行，然后定义交叉表列，最后才定义交叉表明细。\n\
  \n交叉表行的定义从 `CrosstabRowGroupBody` 对象开始，该对象可从 `CrosstabGroup` 实例的 `getBody()` 方法中识别。一旦识别，`getGroup()`\
  \ 方法定义要使用的 `CrosstabRowGroup` 实例，用于设置查询字段（使用 `setField(String field)` 方法）、呈现标题的元素（使用\
  \ `getTitleHeader().addElement(Element element)` 方法），以及表示行值的元素（使用 `getHeader().addElement(Element\
  \ element)` 方法）。\n\n交叉表列的定义从 `CrosstabColumnGroupBody` 对象开始，该对象可从之前使用的 `CrosstabRowGroup`\
  \ 实例的 `getBody()` 方法中识别。一旦识别，`getGroup()` 方法定义要使用的 `CrosstabColumnGroup` 实例，用于设置查询字段（使用\
  \ `setField(String field)` 方法）、呈现标题的元素（使用 `getTitleHeader().addElement(Element element)`\
  \ 方法），以及表示列值的元素（使用 `getHeader().addElement(Element element)` 方法）。\n\n交叉表明细的定义是通过向使用之前使用的\
  \ `CrosstabColumnGroup` 实例的 `getBody()` 方法识别的 `CrosstabCellBody` 实例添加新的 `CrosstabCell`\
  \ 元素实例来完成的。`CrosstabCell` 元素使用 `addElement(Element element)` 方法定义，其中添加的 `Element`\
  \ 为包含要聚合的度量的查询字段。\n\n## 使用 Java 的交叉表示例\n\n为了实践展示一个使用 Java 的交叉表示例，让我们使用 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库；具体来说，项目 pentaho-reporting-crosstab，存储在 Chapter 13 - Internationalization, sub-reports\
  \ and cross-tabs using Java 文件夹中。\n\n正如 PentahoServlet 类所示，DataFactory 在 Mondrian\
  \ 立方体提供程序中声明了一个 MDX 查询。此示例中使用的 Mondrian 模式是你已在第 6 章 Configuring JDBC and Other Data\
  \ Sources 中看到的。以下是定义 MDX 查询的源代码：\n\n```\nfactory.setQuery(\n\"default\",\n\"SELECT\
  \ \" +\n\" CrossJoin([Markets].Children, [Time].Children) ON ROWS,\" +\n\" [Measures].[Sales]\
  \ ON COLUMNS \" +\n\"FROM [SteelWheelsSales]\");\n```\n\n在下面的源代码片段中，我们看到了 CrosstabGroup\
  \ 实例的完整设置：\n\n```\n...\n\n// Defining the cross tab.\nCrosstabGroup crosstabGroup\
  \ = new CrosstabGroup();\n\n// Defining the cross tab rows.\nCrosstabRowGroupBody\
  \ rowBody = (CrosstabRowGroupBody) crosstabGroup.getBody();\nCrosstabRowGroup rowGroup\
  \ = rowBody.getGroup();\nrowGroup.setField(\"[Markets].[Territory]\");\nrowGroup.getTitleHeader().addElement(createDataItem(\"\
  [Markets].[Territory]\"));\nrowGroup.getHeader().addElement(createFieldItem(\"[Markets].[Territory]\"\
  ));\n\n// Defining the cross tab columns.\nCrosstabColumnGroupBody columnGroupBody\
  \ = (CrosstabColumnGroupBody) rowGroup.getBody();\nCrosstabColumnGroup columnGroup\
  \ = columnGroupBody.getGroup();\ncolumnGroup.setField(\"[Time].[Years]\");\ncolumnGroup.getTitleHeader().addElement(createDataItem(\"\
  [Time].[Years]\"));\ncolumnGroup.getHeader().addElement(createFieldItem(\"[Time].[Years]\"\
  ));\n\n// Defining the cross tab details.\nCrosstabCellBody body = (CrosstabCellBody)\
  \ columnGroup.getBody();\nCrosstabCell cell = new CrosstabCell();\ncell.addElement(\
  \ createFieldItem(\"[Measures].[Sales]\" ));\nbody.addElement(cell);\n\nreport.setRootGroup(crosstabGroup);\n\
  ...\n```\n\n要运行该项目，请打开终端，进入项目文件夹，并按此顺序执行以下命令：\n\n```\nmvn clean install\nmvn package\n\
  java -jar target/dependency/jetty-runner.jar target/*.war\n```\n\n在浏览器中打开 http://localhost:8080，你应该会看到如下截图中的\
  \ Pentaho 报表：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_612_0.png)\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_612_1.png)\n\
  \n*正如你所见，结果的 Pentaho 报表与我们在第 10 章 Subreports and Cross Tabs 中使用 Pentaho Report Designer\
