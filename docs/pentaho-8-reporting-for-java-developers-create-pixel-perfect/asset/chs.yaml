  | S24_2840 | 1958 Chevy Corvette Limited Edition | 2,542 | 16 |\n| S700_2824 | 1982\
  \ Camaro Z28 | 6,934 | 47 |\n\n### 产品供应商 Classic Metal Creations\n\n| 产品代码 | 产品名称\
  \ | 库存数量 | 购买价格 |\n|---|---|---|---|\n| S10_1949 | 1952 Alpine Renault 1300 | 7,305\
  \ | 99 |\n| S18_1589 | 1965 Aston Martin DB5 | 9,042 | 66 |\n| S18_4721 | 1957 Corvette\
  \ Convertible | 1,249 | 70 |\n| S24_2766 | 1949 Jaguar XK 120 | 2,350 | 47 |\n|\
  \ S24_3856 | 1956 Porsche 356A Coupe | 6,600 | 98 |\n| S24_4620 | 1961 Chevrolet\
  \ Impala | 7,869 | 32 |\n\n### 产品供应商 Exoto Designs\n\n## 管理权限和计划\n\n通过 Business\
  \ Analytics Platform 使用 Pentaho 报表意味着您也可以完全控制谁可以做什么。Pentaho Business Analytics Platform\
  \ 具有精细的权限调优系统，所有内容都可以通过浏览文件页面进行管理。从那里开始，您可以指向一个报表，您将在右侧面板上看到 Share 项。点击它后，会弹出一个模态窗口，您可以在其中控制所有权限。在继续之前，让我们先关注\
  \ Inherits folder permissions 检查。此功能特别使您能够非常轻松地在存储库结构中继承权限。如果您想中断并自定义继承，请取消选中此标志，并根据需要添加/删除角色和单个权限。在以下截图中，您可以看到此窗口的外观以及所有可能的设置：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_649_0.png)\n\n在同一菜单中（浏览文件页面的右侧面板），您可以看到\
  \ Schedule 项。点击它后，会弹出一个模态窗口，要求进行一些配置。在以下截图中，您可以看到可以设置的所有主要设置：您可以决定报表的快照保存位置、执行日期/时间/频率以及输出格式。配置分为三个不同的步骤进行询问，如以下截图所示：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_650_0.png)\n\n完成后，报表将被计划，您可以从 Schedules\
  \ 页面检查、更改和控制其执行，如以下截图所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_650_1.png)\n\
  \n## 使用 Pentaho 报表创建仪表板\n\n在第 14 章 *构建交互式报表* 中，我们讨论了限制报表之间的高级交互以避免项目失败。当视觉元素之间的交互变得复杂时，仪表板可能是建议的解决方案。在\
  \ Pentaho 套件中，开发仪表板的合适位置是 Business Analytics Platform，并得到 CTools 的支持。CTools 是一组工具和组件，旨在帮助您在\
  \ Pentaho 之上构建自定义仪表板。针对不同目的有特定的 CTools，但我们仅将其作为示例介绍，考虑到描述所有可能性和优秀功能需要一整本书。本节的目标是展示一个仪表板示例，使用\
  \ Pentaho 报表作为元素。\n\n## 社区仪表板编辑器基础\n\nCTools 的核心部分 **社区仪表板编辑器** (**CDE**) 包含在 Pentaho\
  \ 用户控制台中，作为创建、编辑和预览 Pentaho 仪表板的图形工具。CDE 允许开发和部署 Pentaho 高级仪表板。这是一款非常强大且完整的工具，以无缝的方式将前端与数据源和自定义组件结合起来。\n\
  \nCDE 仪表板的开发基于三层定义。这三层共同定义了仪表板的最终版本。三层分别是：布局层、组件层和数据源层。\n\n仪表板布局层可以通过简单的行和列组合创建，同时包含一些\
  \ HTML 块以及可能的图像。在布局视角中，您还可以提供一些外观属性。例如，您可以为某个元素设置背景颜色并为行和列的角落选择样式。\n\n组件是仪表板的核心元素，并在组件层中进行管理。组件层可以在用户界面的组件视角中定义，您可以在其中找到所有可供选择的组件以包含在您的\
  \ Pentaho 报表中。\n\n正如您在报表中学到的，仪表板也可以由各种不同的来源填充。在数据源视角中，您可以设置用于填充仪表板的数据的来源。基本上，您必须指定数据来自何处以及它是什么样的。\n\
  \n创建全新的 CDE 仪表板非常简单，直接从 Pentaho 用户控制台使用 File | New | CDE Dashboard 项即可。在以下截图中，您可以看到\
  \ CDE 仪表板的编辑面板，顶部右侧有三个视角图标：\n\n## Pentaho 用户控制台 - 编辑:my first dashboard.wcdf - Mozilla\
  \ Firefox\n\nlocalhost:8080/pentaho/Home\n\n文件 查看 工具 帮助\n\n已打开\n\n编辑:my first dashboard.wcdf\n\
  \nCDE 新建 保存 另存为... 重新加载 设置\n\n我的第一个仪表板\n\n布局 组件 数据源\n\n## 报表组件介绍\n\n关于 CDE 组件，有三种不同的类型可用：视觉组件（如图表、文本框等）、代表由组件共享的值的参数，以及允许您自定义其他组件的外观或行为的脚本。\n\
  \n本节重点介绍可用于 Pentaho 报表的视觉组件。特别是，它将介绍：`PRPT Component`、`Execute Prpt Component` 和\
  \ `Schedule PRPT Component`。\n\n### PRPT Component\n\n`PRPT` `component` 使您能够在仪表板的一部分中直接预览\
  \ `.prpt` 格式的 Pentaho 报表，由布局层驱动。布局中使用的查看器与本章前面介绍的完全相同。以下截图描述了组件的设置以及下一个示例中使用的配置：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_655_0.png)\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_655_1.png)\n\
  \n\n\n## Execute Prpt Component\n\nExecute Prpt Component 与 PRPT 组件类似，不同之处在于预览在模态窗口中打开，并且可以通过按钮访问。以下截图描述了组件的设置以及在下一个示例中使用的配置：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_656_0.png)\n\n## Schedule PRPT Component\n\
  \n`Schedule PRPT component` 使您能够使用布局层中的按钮安排 `.prpt` 格式的 Pentaho 报表。按下按钮后，将显示一个模态窗口，其中包含本章前面介绍的相同设置。以下截图描述了组件的设置以及在下一个示例中使用的配置：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_657_0.png)\n\n## Example of CDE dashboard\n\
  \n现在您已经了解 Pentaho 仪表板是什么以及其开发的基础知识，让我们看一个具体的示例，定义 `my_first_report` 报表的一个复杂预览。如果您按照本章前面描述的示例进行操作，您应该已经在\
  \ Pentaho 仓库的 `/public` 路径下拥有一个可用的 `my_first_report.prpt` 文件。如果没有，您可以在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中找到它，具体在 `Chapter 15 - Using reports in Pentaho Business Analytics Platform/my_reports`\
  \ 文件夹中。\n\n本节中我们将构建的示例仪表板将由一个左侧面板组成，使用页面大部分宽度，使用 `PRPT Component` 预览报表，以及一个右侧面板，包含两个按钮：连接到\
  \ `Schedule PRPT Component` 的 Schedule 按钮和连接到 `Execute Prpt Component` 的 Launch\
  \ 按钮。\n\n一旦您使用 Pentaho 用户控制台中的 File | New | CDE Dashboard 项创建了一个新的 CDE 仪表板，请在布局透视图中按以下截图所示设置行和列：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_659_0.png)\n\n除了行和列的嵌套结构外，其他内容其实并不重要，但建议用正确的值填充\
  \ `Name` 属性（`obj1`、`obj2` 和 `obj3`），因为它将被用作组件与布局之间的链接。\n\n完成后，单击组件透视图并双击右侧列表中的三个组件中的每一个（`PRPT\
  \ Component`、`Schedule PRPT Component` 和 `Execute Prpt Component`）。此操作将自动把这三个组件添加到包含报表组件的中央面板中。\n\
  \n作为报表组件可用后，按前一张截图所述配置它们。需要设置且相关的必填属性如下：\n\n- Name：这适用于全部三个组件，填写一个随机但有意义的字符串。\n\
  - Path：这适用于全部三个组件，填写 `/public/my_first_report.prpt` 字符串。此属性将组件指向仓库中存储的正确 Pentaho\
  \ 报表。\n- Label：这适用于两个按钮（`Schedule PRPT Component` 和 `Execute PRPT Component`）。此属性定义为每个按钮显示的内容。\n\
  - HtmlObj：这适用于全部三个组件。此属性是必填且相关的，因为它链接到布局层，具体到组件将显示的布局元素。\n\n完成此任务后，可以使用顶部菜单中的 Save\
  \ 项保存 CDE 仪表板。单击后，模态窗口会要求您输入 Pentaho 仓库的路径和名称。在此示例中，将使用 `my first dashboard` 名称。从那时起，Pentaho\
  \ 仓库中会出现两个新文件。选择带有 CDE 蓝色图标的文件并单击右侧面板中的 Open 项，将显示类似以下截图的预览：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_660_0.png)\n\
  \n在 CDE 仪表板中，您应该能识别出开发的结构：左侧有一个大列，包含使用 `PRPT` Component 的预览，右侧有一个较小的列，包含三个较小的子行：第一个包含\
  \ Schedule 按钮，第二个仅为间隔，第三个包含 Launch 按钮。\n\n*如果您想尝试 CDE 组件的所有属性*\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_661_0.png)\n\
  \n以便发现它们的行为，我们强烈建议您花时间去做。正如 Pentaho Report Designer 所建议的那样，对于 CDE 仪表板也是如此，最好的老师是通过一些示例进行实验。不要担心做错什么。您不会对\
  \ Pentaho Business Analytics Platform 造成任何不良影响，只能学习。\n\n要完成示例，在以下截图中您可以看到单击 Launch\
  \ 按钮后浏览器的外观：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_661_1.png)\n\n在以下截图中，您可以看到单击\
  \ Schedule 按钮时浏览器的外观：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_662_0.png)\n\n\
  作为本节要分享的最后一个主题，让我们看看如何使用公共 URL 访问 CDE 仪表板。正如您在 Pentaho 报表中所看到的，CDE 仪表板的公共 URL 定义如下：\n\
  \n- 基础 URL。在我们的示例中，http://localhost:8080/pentaho。\n- 端点路径。在我们的示例中，/api/repos/。\n\
  - Pentaho 仓库中 .prpt 文件的路径，其中路径分隔符为分号 (:)。该字符串在 URL 中进行 URL 编码。在我们的示例中，%3Apublic%3A。\n\
  - CDE 仪表板的 URL 编码名称。在我们的示例中，my%20first%20dashboard 后跟 .wcdf 扩展名。\n- 端点后缀。在我们的示例中，/generatedContent。\n\
  \n在以下 URL 中，您可以找到本章示例的链接：\n\n```\nhttp://localhost:8080/pentaho/api/repos/%3Apublic%3Amy%20first%20dashboard.wcdf/\n\
  ```\n\n*如果您在开发示例时遇到任何问题或太懒得开发它，在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中，具体在 `Chapter 15 - Using reports in Pentaho Business Analytics Platform/my_dashboards`\
  \ 文件夹中，您*\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_662_1.png)\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_663_0.png)\n\
  \n可以找到此处介绍的 CDE 仪表板。要将其安装到 Pentaho Business Analytics Platform，只需将两个文件（一个带有 `.cdfde`\
  \ 扩展名，另一个带有 `.wcdf` 扩展名）上传到 Pentaho 仓库的 `/public` 文件夹即可。\n\n## 摘要\n\n在本章中，您学习了如何在\
  \ Pentaho Business Analytics Platform 中使用现有的 Pentaho 报表，该平台是供最终用户和开发人员使用的前端 Web\
  \ 应用程序。本章介绍了 Pentaho Business Analytics Platform 的基础知识，并提供了如何安装它以及上传 Pentaho 报表的说明。之后，您学习了如何预览它、如何管理权限、如何安排它以及如何使用\
  \ Pentaho CTools 开发 Pentaho 仪表板。\n\n现在您已经阅读了本章，您应该对 Pentaho Business Analytics Platform\
  \ 以及管理 Pentaho 报表的所有基本功能感到熟悉。这对于开发人员和信息技术人员来说是一项高级任务，用于管理最终客户和经理的前端。\n\n在下一章中，您将了解更多关于在\
  \ ETL 作业中使用 Pentaho 报表的信息（https://en.wikipedia.org/wiki/Extract,_transform,_load），使用\
  \ Pentaho Data Integration（也称为 Kettle）。\n\n## Using Reports in Pentaho Data Integration\n\
  \n在第 15 章 *Using Reports in Pentaho Business Analytics Platform* 中介绍了 Pentaho Business\
  \ Analytics Platform 后，在本章中您将学习如何在 Pentaho Data Integration（也称为 Kettle）中使用 Pentaho\
  \ 报表。这将提供强大的 ETL 功能。\n\n在本章中，您将了解 Pentaho Data Integration 和 ETL 工具的一般基础知识，并提供如何安装它们以及将\
  \ Pentaho 报表用作输出任务的说明。像往常一样，本章中您将看到一个实际运行的示例。目标始终相同：通过示例学习。\n\n本章作为开发人员和信息技术人员的教程编写。最好的学习方式是在阅读时在笔记本电脑上按照说明操作。到本章结束时，您将对使用\
  \ Pentaho Data Integration（也称为 Kettle）与 Pentaho 报表的基础知识感到熟悉。这对于您的未来项目将非常有用，使您能够使用功能齐全的\
  \ ETL 工具。\n\n\n\n## 介绍 Pentaho Data Integration\n\n作为 Pentaho 产品套件的一部分，Pentaho 提供开源数据集成。凭借直观的、图形化的、拖放式设计环境以及经过验证的可扩展、基于标准的架构，数据集成正日益成为组织在传统专有\
  \ ETL 或数据集成工具之外的选择。Pentaho Data Integration 在最初版本中被称为 Kettle，因此在你的调查中，你可能会发现它也被称为\
  \ PDI、DI 或 Kettle。\n\n你可能知道 ETL 指的是以下流程：数据抽取是从同构或异构数据源中抽取数据，数据转换是将数据转换为适当的格式或结构以便查询和分析，数据加载是将数据加载到最终目标存储库中。本书不会教授\
  \ ETL 的基础知识，但你很容易找到大量专门针对此主题的文献。如果你不了解 ETL 原则和最佳实践，可以将 ETL 视为专门用于将数据从源移动到目标的批处理过程。\n\
  \n正如我们在 Pentaho Business Analytics Platform 中所做的那样，本章中你也将使用 Pentaho Data Integration\
  \ 的社区版，因为它可下载且对所有人免费提供。当然，本章中的描述仅限于介绍以及与报表管理严格相关的内容。如果感兴趣，有大量资源可供你探索并成为该 ETL 工具的专家。\n\
  \n## 安装 Pentaho Data Integration\n\nPentaho Data Integration 的安装非常简单，只需执行 *解压并运行*\
  \ 任务。运行 Pentaho Data Integration 的前提条件很简单；它需要 **Java 运行时环境 (JRE)** 8，已安装在你的环境中。支持基于\
  \ Windows 的操作系统和基于 Linux 的操作系统。本章中显示的屏幕截图和预览均使用 Ubuntu 16.04.2 LTS 发行版制作。\n\n在安装应用程序之前，你可以直接从官方\
  \ Pentaho 社区网站 (http://community.pentaho.com/) 或 Pentaho SourceForge 网站 (https://sourceforge.net/projects/pentaho/)\
  \ 下载以 ZIP 文件分发的构件。在这两种情况下，你应下载一个名称类似 `pdi-ce-<version>.zip` 的 ZIP 文件。\n\n一旦 ZIP\
  \ 文件下载到你的环境中，将其解压到最终路径（在基于 Linux 的操作系统上，建议使用 `/opt` 路径），你将在名为 `data-integration`\
  \ 的文件夹中找到所有 Pentaho Data Integration。\n\n你可能不会相信，但这就是将 Pentaho Data Integration\
  \ 安装到你的环境中所需的一切。\n\nPentaho Data Integration 主要是一个在命令行运行的 Java 应用程序，并嵌入 Pentaho\
  \ Data Integration 引擎。Pentaho Data Integration 附带了一些有用的工具：Spoon，一个允许你设计转换和作业的图形用户界面；Pan\
  \ 和 Kitchen，用于运行转换和作业；以及 Carte，一个简单的 Web 服务器，允许你远程执行转换和作业。在本章中，你将在用例示例中看到 Spoon\
  \ 和 Kitchen。\n\n## Pentaho Data Integration 基础\n\n如前所述，Pentaho Data Integration\
  \ 是一个具有很少图形工具和界面的引擎。根据这一定义，以下各节描述了一些基本概念，以帮助理解其行为和原理。\n\n## 作业和转换\n\n作业和转换可能是 Pentaho\
  \ Data Integration（以及 ETL 总体而言，但名称不同）中最重要的两个核心概念。\n引用 Pentaho 的常见问题解答：\n\n> \"转换是关于从源到目标移动和转换行。作业更侧重于高级流程控制：执行转换、失败时发送邮件、通过\
  \ FTP 传输文件等等。另一个关键区别是：转换中的所有步骤并行执行，而作业中的步骤按顺序执行。\"\n\n正如你从此常见问题解答中读到的那样，转换基于数据流的概念，即大量数据从通用源迁移到通用目标。一个转换可以管理多个流，所有流均并行执行并由\
  \ Pentaho Data Integration 引擎管理。\n\n在下面的图表中，你可以看到使用 Spoon 开发的一个非常基本的转换示例：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_669_0.png)\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_669_1.png)\n\n*谈到数据流，这可能是 ETL 引擎最令人印象深刻的优势之一。它能够根据服务器的有限资源并行管理大量数据。这是开发人员使用传统模式构建的常规应用程序的关键区别之一。*\n\
  \n谈到作业，作业在很大程度上基于任务序列的概念，其中必须声明起点。作业能够将其他作业或转换作为子任务包含的能力，使其成为管理复杂迁移和可重用操作的好方法。\n\
  \n在下面的图表中，你可以看到使用 Spoon 开发的一个非常基本的作业示例：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_670_0.png)\n\
  \n如图像所示，一个连接将一个转换步骤或作业条目与另一个连接。数据流的方向在图形视图窗格上用箭头表示。连接可以启用或禁用（例如用于测试目的），并且可以是有条件的（例如在成功或失败的情况下）。\n\
  \n作业和转换都可以定义参数和变量。参数被定义为执行的输入，可用于参数化任务。变量在执行流程中定义，可用于参数化任务，正如参数一样。\n\n## 步骤和条目\n\
  \n步骤和条目分别是转换和作业的原子部分。\n\n一个步骤是转换的一部分。Pentaho Data Integration 中提供超过 140 个步骤。这些步骤根据其主要功能进行分类；例如，输入、输出、脚本等。为了执行特定任务，例如从平面文件读取数据、过滤行以及如前例所示将日志记录到数据库，转换中的每个步骤都以特定方式设计。可以配置步骤以执行你需要的任务。一个步骤可以有多个连接——有些连接两个步骤，而有些仅作为步骤的输入或输出。一个名为\
  \ Pentaho Reporting output 的步骤可用于管理 Pentaho 报表。\n\n一个作业条目是作业的一部分。作业条目可以为你提供广泛的功能，从执行转换到从\
  \ Web 服务器获取文件。Pentaho Data Integration 中提供超过 100 个条目，它们根据功能分组，与步骤的描述类似。可用的条目中没有直接支持\
  \ Pentaho 报表的。\n\n## 数据库连接\n\n正如你在 Pentaho Reporting 中学到的那样，对于 Pentaho Data Integration\
  \ 也是如此，数据库连接用于从源读取或向目标存储库写入。对于 Pentaho Data Integration，这些数据源主要集中在数据库上，但由于步骤和条目的存在，你有机会访问不同类型的源或目标。\n\
  \n数据库连接可以在作业和转换之间共享，并可重复使用以便更好地管理和维护。支持的数据库列表与你在 Pentaho Reporting 中看到的没有区别。正如你所知，它包括各种不同的厂商、类型和成本。\n\
  \n\n\n## 存储与重用\n\n作业和转换可以保存在存储中以便将来重复使用。Pentaho Data Integration 用于保存作业和转换的格式是 XML，因此可以保存到文件中。作业保存在扩展名为\
  \ `.kjb` 的文件中，而转换则保存在扩展名为 `.ktr` 的文件中。\n\n由于它们是文件，作业和转换自然可以保存到文件系统中，但这并不是 `.kjb`\
  \ 和 `.ktr` 文件可以存储的唯一位置。Pentaho Data Integration 能够从以下类型的存储中检索和存储作业与转换：\n\n- **Pentaho\
  \ 仓库**：你在第 15 章 *在 Pentaho Business Analytics Platform 中使用报表* 中已经了解过 Pentaho 仓库。从用户角度来看，Pentaho\
  \ 仓库可作为由 Pentaho Business Analytics Platform 拥有的远程文件系统使用。Pentaho 仓库能够存储、检索和执行 `.kjb`\
  \ 和 `.ktr` 文件。\n- **数据库**：这是一个常规数据库，其中包含一些在创建时由 Pentaho Data Integration 构建并在检索、保存和执行期间管理的表。作业和转换不会以其\
  \ XML 格式保存，而是作为多行存储在多个自定义表中。\n- **文件系统**：你已经了解到，使用文件系统时，作业和转换以 XML 格式保存为 `.kjb`\
  \ 和 `.ktr` 文件。\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_673_0.png)\n\n> *即使支持三种不同的存储类型，也建议使用\
  \ Pentaho 仓库，因为使用 XML 格式存储作业和转换是标准做法（数据库存储不可读），并且它是集中化的且可通过 API 访问（文件系统仅限于服务器/机器本地）。*\n\
  \n## Spoon 客户端介绍\n\nPDI 客户端（Spoon）是你安装在工作站上的桌面应用程序，可让你构建转换和作业或安排作业的运行时间。Spoon 包含在标准的\
  \ Pentaho Data Integration 发行版中，可以使用 `data-integration` 文件夹中的 `spoon` 脚本启动（`spoon.sh`\
  \ 用于基于 Linux 的操作系统，`spoon.bat` 用于基于 Windows 的操作系统），如下所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_674_0.png)\n\
  \n你不会在本节中发现有关 Spoon 的所有细节，因为深入研究它确实需要一整本书。相反，我们想分享的是，通过图形界面，你可以直观地看到转换和作业中的流程，以及对它们的执行进行调试的完全控制。本章中展示的所有图像都是使用\
  \ Spoon 完成的，在以下章节中你将看到其实际用法的示例。\n\n## Pentaho Reporting 输出步骤\n\nPentaho Reporting\
  \ 输出步骤是唯一完全专用于 Pentaho Reporting 的 Data Integration 任务。作为一个步骤，它存在于转换中，并被归类在输出步骤中。\n\
  \n该步骤的主要目标是基于文件系统上本地存储的 `.prpt` 文件生成 Pentaho 报表。作为一个常规步骤，它接受数据流作为输入，并对流中的每一行执行任务。Pentaho\
  \ Reporting 输出步骤可以直接从 Spoon 界面进行自定义，方法是右键单击它并选择编辑项。\n\n在下面的屏幕截图中，你可以看到编辑窗口在 Spoon\
  \ 界面中的外观：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_675_0.png)\n\n在下表中，你可以阅读每个选项的简要描述，作为管理\
  \ Pentaho 报表的集成数据能力介绍：\n\n| 选项 | 描述 |\n|---|---|\n| Step name | 步骤的名称。它在转换中必须是唯一的。\
  \ |\n| Report definition file | 包含执行期间 .prpt 文件路径（包括文件名）的输入流字段。 |\n| Output file\
  \ | 包含执行期间输出文件路径（包括文件名）的输入流字段。 |\n| Parameter fields | 你可以将一个或多个输入字段的值传递给报表中的预定义参数。要将数据传递给字符串数组，请确保数据以制表符分隔。你可以使用“获取报表参数”按钮从现有报表导入参数。\
  \ |\n| Output processor | 用于生成输出文件的处理器，每一个对应一种可能的输出格式。 |\n\n在本章描述的示例中，你将看到 Pentaho\
  \ Reporting 输出步骤的具体使用。\n\n## 介绍 Pan 和 Kitchen\n\n为了完成对 Pentaho Data Integration\
  \ 主要功能简要介绍，让我们看看如何从命令行执行通用作业或转换。为此，提供了两个名为 Pan 和 Kitchen 的 Pentaho 工具。\n\nKitchen\
  \ 是一个可以执行由 Spoon 设计的作业的程序。Pan 是一个可以执行由 Spoon 设计的转换的程序。通常作业和转换以批处理模式安排，定期自动运行。Kitchen\
  \ 和 Pan 捆绑在 Pentaho Data Integration 的标准发行版中，作为 `data-integration` 文件夹中的名为 `kitchen`\
  \ 和 `pan` 的脚本提供（`kitchen.sh` 和 `pan.sh` 用于基于 Linux 的操作系统，`kitchen.bat` 和 `pan.bat`\
  \ 用于基于 Windows 的操作系统）。\n\n`kitchen` 和 `pan` 脚本可以使用多个参数启动，以控制和配置其执行。参数可以在命令行中指定，使用语法\
  \ `/param:value` 或 `-param=value`。\n\n在下表中，你可以找到 `kitchen` 和 `pan` 脚本接受的主要参数：\n\n\
  | 参数 | 描述 |\n|---|---|\n| `rep` | 如果你使用的是 Pentaho 仓库名称或数据库。 |\n| `user` | 如果你使用仓库或数据库，则为用户名。\
  \ |\n| `pass` | 如果你使用仓库或数据库，则为密码。 |\n| `trans` | 要启动的转换名称（在仓库中显示的名称）。仅适用于 pan。 |\n\
  | `job` | 要启动的作业名称（在仓库中显示的名称）。仅适用于 kitchen。 |\n| `dir` | 包含转换/作业的路径，包括前导斜杠。 |\n\
  | `file` | 如果你调用本地 .ktr/.kjb 文件，则为路径和文件名。 |\n| `level` | 日志级别（Basic、Detailed、Debug、Rowlevel、Error\
  \ 和 Nothing）。 |\n| `logfile` | 写入日志输出的本地文件名。 |\n| `listdir` | 列出指定仓库中的目录。 |\n| `listtrans`\
  \ | 列出指定仓库目录中的转换。仅适用于 pan。 |\n| `listjob` | 列出指定仓库目录中的转换。仅适用于 kitchen。 |\n| `listrep`\
  \ | 列出可用的仓库。 |\n| `exprep` | 将所有仓库对象导出到一个 XML 文件。仅适用于 pan。 |\n| `export` | 导出指定作业的所有关联资源。参数是\
  \ ZIP 文件的名称。仅适用于 kitchen。 |\n| `norep` | 防止登录到仓库。如果不想执行本地 `.ktr/.kjb` 文件，则应设置环境变量\
  \ `KETTLE_REPOSITORY`、`KETTLE_USER` 和 `KETTLE_PASSWORD`。 |\n| `safemode` | 以安全模式运行，可启用额外检查。仅适用于\
  \ `pan`。 |\n| `version` | 显示版本、修订号和构建日期。 |\n| `param` | 以 `name=value` 格式设置命名参数。例如，`-param:F00=bar`\
  \ |\n| `listparam` | 列出指定转换中定义的命名参数的信息。 |\n| `maxloglines` | Pentaho Data Integration\
  \ 内部保留的最大日志行数。设置为 `0` 以保留所有行（默认值）。 |\n| `maxlogtimeout` | Pentaho Data Integration\
  \ 内部保留时日志行的最大年龄（以分钟为单位）。设置为 `0` 以无限期保留所有行（默认值）。 |\n\n\n\n\n## 使用 Pentaho 报表创建转换\n\
  \n现在你已经了解什么是 Pentaho 转换，以及开发的基础知识，让我们来看一个具体的示例，定义一个简单的 ETL 来生成众所周知的 `my_first_report.prpt`\
  \ 文件的 PDF 输出。第一步要做的是将 `my_first_report.prpt` 文件复制到 Pentaho Data Integration 安装的\
  \ `data-integration` 文件夹中。这是因为它将在转换执行期间用作当前路径。如果你没有 `my_first_report.prpt` 文件可用，你可以从\
  \ https://github.com/fcorti/pentaho-8-reporting-for-java-developers 仓库下载，具体来说，从\
  \ `Chapter 15 - Using reports in Pentaho Business Analytics Platform/my_reports`\
  \ 文件夹。\n\n作为第一步，让我们运行 Spoon GUI 开始开发：打开一个终端，移动到 `data-integration` 文件夹，并运行 `spoon`\
  \ 脚本。从顶部菜单中，单击 File | New | Transformation 项以创建一个空转换。完成后，右键单击空的右侧面板并选择 Properties。在打开的窗口中，用\
  \ `Transformation name` 字段的内容替换 `my first transformation` 值。然后单击 OK 按钮并按下顶部工具栏上的磁盘图标（\U0001F4BE\
  ）。确保将 `my first transformation` 文件保存在 `data-integration` 文件夹中。\n\n现在转换已以空状态保存，从左侧面板选择\
  \ Design 选项卡，你将找到所有可用的步骤。展开 `Input` 集合，并将 `Data Grid` 步骤拖放到右侧面板。双击 `Data Grid` 步骤并填写编辑窗口的\
  \ Meta 选项卡，如以下屏幕截图所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_681_0.png)\n\n\
  在离开步骤配置之前，选择 Data 选项卡并按以下屏幕截图所示进行填写：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_681_1.png)\n\
  \n通过此操作，转换的第一步被定义，生成一个仅包含一行且包含两个字段的简单数据流：prpt_path 字段的值为 ./my_first_report.prpt，以及\
  \ output_path 字段的值为 ./my_first_report.pdf。如果你想查看数据流的样子，请单击 Preview 按钮。完成后，单击 OK\
  \ 按钮以确认 Data Grid 设置。\n\n返回左侧面板中的 Design 选项卡，展开 Output 集合，并将 Pentaho Reporting Output\
  \ 步骤拖放到右侧面板，放在 Data Grid 步骤的右侧。为了指示转换按正确的顺序执行两个步骤，单击 Data Grid 步骤，并将右侧连接图标拖动到 Pentaho\
  \ Reporting Output 步骤。以下屏幕截图显示了任务的视觉描述：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_682_0.png)\n\
  \n最终结果应如下所示：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_682_1.png)\n\n现在数据流已设置，双击\
  \ Pentaho Reporting Output 步骤并按以下屏幕截图所示填写选项：\n\n![](img/9337ac94537bf7e092e1ea6531dce8fd_682_2.png)\n\
  \n单击 OK 按钮以确认步骤配置，然后单击工具栏中的保存（\U0001F4BE）图标以保存转换的更新版本。现在转换已开发完成，通过在转换面板中单击播放图标（▶）运行它；通过单击运行按钮确认。在以下屏幕截图中，你可以看到执行的样子：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_683_0.png)\n\n如转换的视觉表示所示，绿色勾号突出显示成功执行的步骤。在\
  \ Logging 面板中，可以看到详细的日志跟踪以供理解。为了确认一切都已成功执行，在 `data-integration` 文件夹中，你应该找到包含报表最终渲染的\
  \ `my_first_report.pdf` 文件。\n\n如果你在开发示例时遇到任何问题或太懒于开发它，在 https://github.com/fcorti/pentaho-8-reporting-for-java-developers\
  \ 仓库中，具体来说，在 `Chapter 16 - Using reports in Pentaho Data Integration` 文件夹中，你可以找到在此介绍的\
  \ `my first transformation.ktr`。要将其安装到 Pentaho Data Integration 中，只需将其下载到 `data-integration`\
  \ 文件夹并使用 Spoon 作为常规文件打开即可。\n\n## 使用 Pan 执行转换\n\n为了完成示例，让我们看看如何使用 pan 脚本来从命令行运行转换，以便使用\
  \ crontab（https://en.wikipedia.org/wiki/Cron）定期安排执行。\n\n按照本章前面给出的描述，打开一个终端并进入 data-integration\
  \ 文件夹，在那里你应该找到 my first transformation.ktr，以及 my_first_report.prpt 文件。输入以下命令并按 Enter\
  \ 按钮启动其执行： ./pan.sh -file:\"my first transformation.ktr\"\n\n在以下屏幕截图中，你可以看到终端中执行的示例结果：\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_684_0.png)\n\n现在根据你的操作系统，使用 crontab 或其他调度程序安排命令应该很简单。\n\
  \n## 摘要\n\n在本章中，你学习了如何在 Pentaho Data Integration，也称为 Kettle 中使用现有的 Pentaho 报表，提供强大的\
  \ ETL 功能。在本章中，你介绍了 Pentaho Data Integration 的基础知识，以及如何安装它并使用 Pentaho Reporting 输出步骤使用\
  \ Pentaho 报表。之后，你了解了 Spoon 客户端以及如何在命令行执行作业/转换，并了解了如何使用 Pentaho 报表开发转换。最后，你通过 Pan\
  \ 执行了转换。\n\n现在你已经阅读了本章，你应该对 Pentaho Data Integration 以及管理 Pentaho 报表的所有基本功能感到熟悉。这是对开发人员和信息技术人员的高级任务，用于管理未来项目的\
  \ ETL 批处理。\n\n本章结束了本书专门介绍在 Pentaho 套件的其他组件中使用 Pentaho 报表的内容。在下一章中，你将学习最终主题，只为你的专业知识增添最新细节。\n\
  \n## Pentaho Reporting 每日构建和支持\n\n本最后一章包含两个主要主题，希望对完善你在 Pentaho Reporting 方面的专业知识有所帮助。\n\
  \n第一个主题是关于下载、构建、安装和运行最新版本的 Pentaho Report Designer，通常称为 **nightly build**。同样，你将学习如何在你的\
  \ Java 项目中使用 nightly build；尝试具有最新增强功能的最新版本。该主题严格面向开发人员，将使你能够出于评估目的访问 Pentaho Reporting\
  \ 的最新版本。\n\n在本书的最后一个主题中，你将了解作为 Pentaho Reporting 的新开发人员和专家，你可能需要找到文档、资源、支持、结识社区等方式。该主题面向开发人员和信息技术人员，应帮助你在第一个项目和未来挑战中获得支持和帮助。\n\
  \n本章和本书以分享一个想法结束，在你获得了这个开源项目和社区的所有好处之后，你将成为真正的专家，有很多东西可以与所有 Pentaho Reporting 的新手分享。\n\
  \n## Pentaho Report Designer 每日构建\n\n在前几章中，你学习了有关 Pentaho Reporting 8.0 稳定版的所有内容。稳定版可以按照第\
  \ 2 章 *使用 Report Designer 入门* 中所述下载，但作为开源项目，Pentaho Reporting 的源代码可在 GitHub 上托管的公共仓库中获得。供将来参考，Pentaho\
  \ Reporting 项目存储在 https://github.com/pentaho/pentaho-reporting。\n\n在公共仓库中，你可以找到所有库、源代码以及了解\
  \ Pentaho Reporting 如何工作和开发所需的一切。查看仓库，通常有几个分支。master 分支托管 Pentaho 团队的每日提交。当然，源代码不能保证稳定，但它绝对是最新的软件版本。\n\
  \n在本节中，你将学习如何下载最新版本的源代码并构建它，创建所谓的 nightly build。使用 Pentaho Reporting nightly build\
  \ 可能有两个主要原因：如果你想提前看到最新功能，而不必等待稳定版发布；以及如果你想 fork 它，添加或自定义官方源代码。\n\n\n\n## 构建项目的先决条件\n\
  \n在深入构建工件之前，让我们列出开发环境的先决条件：\n\n- Apache Maven 版本 3+。\n- Java JDK 1.8。\n- `settings.xml`\
  \ 文件（[https://github.com/pentaho/maven-parent-poms/blob/master/maven-support-files/settings.xml](https://github.com/pentaho/maven-parent-poms/blob/master/maven-support-files/settings.xml)）存储在你的\
  \ `/.m2` 目录中（`.m2` 文件夹由 Apache Maven 用于托管依赖项）。`settings.xml` 文件包含从 Pentaho 的 Sonatype\
  \ Nexus 仓库管理器（[https://public.nexus.pentaho.org/](https://public.nexus.pentaho.org/)）获取库和依赖项所需的一切。\n\
  \n当然，你的开发环境中应提供 `git` 客户端以本地克隆仓库。\n\n**git clone https://github.com/pentaho/pentaho-reporting.git**\n\
  \n`git` 客户端将开始下载整个仓库及其所有子项目，几分钟后，完整的源代码将可在 `pentaho-reporting` 文件夹中使用。在根文件夹的 `README.md`\
  \ 文件中，你可以找到多个主题的详细描述，例如：\n\n- 如何构建它（在不同平台上）\n- 如何运行测试和集成测试\n- 如何在 IntelliJ IDE 上导入项目\n\
  - 如何安装它以及在哪里找到文档\n\n在以下章节中，你将重点关注构建和运行 nightly build 的描述，以便你能够使用最新的（可能不稳定）版本进行评估。\n\
  \n## 构建发行版\n\n在 `README.md` 文件中对构建发行版有很好的描述。所有必需的配置文件都由名为 `release` 的属性存在而激活。如果你还要构建\
  \ macOS 发行版，则还必须指定 `mac.jre.path` 属性，如以下命令所示：**mvn clean install -Drelease -Dmac.jre.path=YOUR_MAC_OS_JRE_PATH**\
  \ **(YOUR_MAC_OS_JRE_PATH example jre1.8.0_121.jre\\Contents\\Home)**\n\n启动后，命令将开始下载大量依赖项，并会出现很长的日志信息尾部。子项目构建完成后，单元测试将被启动，同时也会执行构建最终包所需的一切。\n\
  \n![](img/9337ac94537bf7e092e1ea6531dce8fd_690_0.png)\n\n> *我希望你不必在几分钟内完成构建。取决于你的网络连接，下载依赖项时的任何失败以及其他一些意外行为，你可能需要超过半小时才能完成此任务。*\n\
  \n执行结束时，最终工件将以 `prd-ce-<version>.zip` 的名称生成在 `assemblies/winlinux(mac)/target` 文件夹中。该\
  \ ZIP 文件是你运行 Pentaho Report Designer 所需的一切，也是基于 Pentaho Reporting 构建个人项目所需的内容。\n\
  \n## 安装和运行 nightly build\n\n从这里开始，安装任务与你在第 2 章 *开始使用报表设计器* 中学到的内容没有区别：解压 ZIP 文件到最终目标位置，打开终端，进入\
  \ `report-designer` 文件夹，并启动 `report-designer` 脚本。\n\n## Pentaho Reporting SDK 夜间构建\n\
  \n一旦 Pentaho Reporting 工件构建完成，所有 Pentaho Reporting 库都将在其中可用，如第 1 章 *Pentaho Reporting\
  \ 简介* 中所述。在本节中，你将学习如何在 Java 项目中使用 nightly build，使用 Pentaho Reporting 的最新（可能不稳定）版本进行评估。\n\
  \n假设你有一个使用 Pentaho Reporting 的现有 Java 项目，让我们在以下章节中了解如何更新它以使用 nightly build。作为示例，你可以使用\
  \ GitHub 仓库 https://github.com/fcorti/pentaho-8-reporting-for-java-developers 中提供的示例之一。\n\
  \n为准备项目，将其复制到工作文件夹中。作为示例，你可以使用存储在 `Chapter 03 - Getting started with Reporting SDK/pentaho-reporting-web-app`\
  \ 文件夹中的项目。\n\n## 更新 pom.xml 文件\n\n准备现有项目的首要任务是更改 pom.xml 文件。使用编辑器打开 pom.xml，你会看到所有\
  \ Pentaho 依赖项都指向 <version>8.0-SNAPSHOT</version>。当然，如果你的项目使用不同版本，实际上没有任何变化。\n\n\
  对于所有 Pentaho 依赖项，将版本标签更新为 nightly build 版本。在我们的示例中，你将使用 <version>8.1-SNAPSHOT</version>。同样，如果你的项目使用不同版本，实际上没有任何变化。\n\
  \n保存 pom.xml 文件就是更新 Java 项目所需的一切。\n\n## 添加 nightly build 库\n\n如果你现在运行项目的构建，Apache\
  \ Maven 客户端将尝试从 pom.xml 文件（在我们的示例中为 8.1-SNAPSHOT）请求下载所有 Pentaho 依赖项的最新版本。考虑到最新版本尚未发布到\
  \ Pentaho 的 Sonatype Nexus 仓库中，将会发生错误，你的构建将失败。\n\n为了解决此问题，有一种变通方法，即将 Pentaho 最新依赖项添加到你的本地\
  \ Apache Maven 仓库。简而言之，当 Apache Maven 查找依赖项时，它首先在本地仓库（.m2/repository 文件夹）中查找，如果未找到，则尝试从远程仓库下载。通过将最新的\
  \ Pentaho 依赖项添加到本地 Apache Maven 仓库，你将跳过访问远程仓库的需求，从而避免失败。\n\n> *请注意，这是一种变通方法，可让你使用最新的（可能不稳定）Pentaho\
  \ Reporting nightly build。将库添加到本地 Maven 仓库不是最佳实践，应尽可能限制。*\n\n要将库或一般工件安装到本地 Apache\
  \ Maven 仓库，有一个类似以下命令的命令：\n\n```\nmvn\n  install:install-file\n  -Dfile=path/to/artifact/name.jar\n\
  \  -DgroupId=...\n  -DartifactId=...\n  -Dversion=...\n  -Dpackaging=jar\n```\n\n\
  通过对每个 Pentaho 依赖项使用此命令，你可以使用 nightly build 更新本地 Apache Maven 仓库。以下是要运行的命令列表，以添加所有请求的依赖项，成功构建本书中描述的所有示例：**mvn\
  \ install:install-file -Dfile=./report-designer/lib/classic-core-8.1-SNAPSHOT.jar\
  \ -DgroupId=pentaho-reporting-engine -DartifactId=pentaho-reporting-engine-classic-core\
  \ -Dversion=8.1-SNAPSHOT -Dpackaging=jar**\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/classic-extensions-8.1-SNAPSHOT.jar\
  \ -DgroupId=pentaho-reporting-engine -DartifactId=pentaho-reporting-engine-classic-extensions\
  \ -Dversion=8.1-SNAPSHOT -Dpackaging=jar\n```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/wizard-core-8.1-SNAPSHOT.jar\
  \ -DgroupId=pentaho-reporting-engine -DartifactId=pentaho-reporting-engine-wizard-core\
  \ -Dversion=8.1-SNAPSHOT -Dpackaging=jar\n```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/libbase-8.1-SNAPSHOT.jar\
  \ -DgroupId=pentaho-library -DartifactId=libbase -Dversion=8.1-SNAPSHOT -Dpackaging=jar\n\
  ```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/libdocbundle-8.1-SNAPSHOT.jar\
  \ -DgroupId=pentaho-library -DartifactId=libdocbundle -Dversion=8.1-SNAPSHOT -Dpackaging=jar\n\
  ```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/libfonts-8.1-SNAPSHOT.jar\
  \ -DgroupId=pentaho-library -DartifactId=libfonts -Dversion=8.1-SNAPSHOT -Dpackaging=jar\n\
  ```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/libformat-8.1-SNAPSHOT.jar\
  \ -DgroupId=pentaho-library -DartifactId=libformat -Dversion=8.1-SNAPSHOT -Dpackaging=jar\n\
  ```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/libformula-8.1-SNAPSHOT.jar\
  \ -DgroupId=pentaho-library -DartifactId=libformula -Dversion=8.1-SNAPSHOT -Dpackaging=jar\n\
  ```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/libloader-8.1-SNAPSHOT.jar\
  \ -DgroupId=pentaho-library -DartifactId=libloader -Dversion=8.1-SNAPSHOT -Dpackaging=jar\n\
  ```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/librepository-8.1-SNAPSHOT.jar\
  \ -DgroupId=pentaho-library -DartifactId=librepository -\n```\n\n\n\n```\nDversion=8.1-SNAPSHOT\
  \ -Dpackaging=jar\n```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/libserializer-8.1-\n\
  SNAPSHOT.jar -DgroupId=pentaho-library -DartifactId=libserializer -\nDversion=8.1-SNAPSHOT\
  \ -Dpackaging=jar\n```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/libxml-8.1-\n\
  SNAPSHOT.jar -DgroupId=pentaho-library -DartifactId=libxml -\nDversion=8.1-SNAPSHOT\
  \ -Dpackaging=jar\n```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/legacy-charts-8.1-\n\
  SNAPSHOT.jar -DgroupId=pentaho-reporting-engine -\nDartifactId=pentaho-reporting-engine-legacy-charts\
  \ -Dversion=8.1-\nSNAPSHOT -Dpackaging=jar\n```\n\n```\nmvn install:install-file\
  \ -Dfile=./report-designer/lib/classic-extensions-xpath-\n8.1-SNAPSHOT.jar -DgroupId=pentaho-reporting-engine\
  \ -\nDartifactId=pentaho-reporting-engine-classic-extensions-xpath -\nDversion=8.1-SNAPSHOT\
  \ -Dpackaging=jar\n```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/classic-extensions-pmd-\n\
  8.1-SNAPSHOT.jar -DgroupId=pentaho-reporting-engine -\nDartifactId=pentaho-reporting-engine-classic-extensions-pmd\
  \ -\nDversion=8.1-SNAPSHOT -Dpackaging=jar\n```\n\n```\nmvn install:install-file\
  \ -Dfile=./report-designer/lib/classic-extensions-kettle-\n8.1-SNAPSHOT.jar -DgroupId=pentaho-reporting-engine\
  \ -\nDartifactId=pentaho-reporting-engine-classic-extensions-kettle -\nDversion=8.1-SNAPSHOT\
  \ -Dpackaging=jar\n```\n\n```\nmvn install:install-file -Dfile=./report-designer/lib/classic-extensions-\n\
  mondrian-8.1-SNAPSHOT.jar -DgroupId=pentaho-reporting-engine -\nDartifactId=pentaho-reporting-engine-classic-extensions-mondrian\
  \ -\nDversion=8.1-SNAPSHOT -Dpackaging=jar\n```\n\n```\nmvn install:install-file\
  \ -Dfile=./report-designer/lib/classic-extensions-olap4j-\n8.1-SNAPSHOT.jar -DgroupId=pentaho-reporting-engine\
  \ -\nDartifactId=pentaho-reporting-engine-classic-extensions-olap4j -\nDversion=8.1-SNAPSHOT\
  \ -Dpackaging=jar\n```\n\n## 编译和运行项目\n\n现在你的 Java 项目已更新到最新的 Pentaho Reporting 版本，并且本地\
  \ Apache Maven 仓库中包含了可用的 nightly build，你可以像往常一样构建它，从终端运行 `mvn clean package` 命令。使用此变通方法，你将能够尝试\
  \ Pentaho Reporting 的最新 nightly build，其中包含最新的增强功能和特性。\n\n## 从社区获取帮助\n\n作为开源项目，Pentaho\
  \ Reporting 拥有一个由个人和组织组成的社区，他们通过回答问题、提供翻译、提交和修复错误、编写文档，当然还有贡献代码来参与贡献。为了确保你能找到所需资源以参与\
  \ Pentaho Reporting 社区，以下是一些在线场所和工具列表，帮助你入门。\n\n## 提问与帮助他人\n\n今天，Pentaho Reporting\
  \ 社区中有两种主要的沟通方式。第一种也是最广泛使用的方式是 Pentaho Reporting 论坛。这些论坛位于 http://forums.pentaho.org/\
  \ 下的主分类 Pentaho Reporting 中。你可以搜索和阅读论坛讨论，或注册一个账号提问。\n\n另一种主要沟通方式是 Pentaho 的 IRC\
  \ 频道，由 Pentaho 社区成员设立。该频道位于 FreeNode IRC (https://freenode.net/) 上，频道名为 ##pentaho。如果你没有\
  \ IRC 客户端，可以使用 FreeNode WebChat (http://webchat.freenode.net) 加入频道。大量活跃的 Pentaho\
  \ 社区成员可随时解答技术问题。\n\n## 在线文档\n\n在阅读本书时，你已经看到 Pentaho 拥有一个专门的文档网站，可在 https://help.pentaho.com/\
  \ 访问。在该文档网站上，你可以找到有关最新版本的所有可用内容，以及与之前版本相关的内容。\n\nPentaho 托管了一个 wiki，其中包含 Pentaho\
  \ 各项目的社区文档。你可以在 http://wiki.pentaho.com 找到该 wiki，其中包含指向 Pentaho Reporting 文档的链接，以及指导特定用例的技术提示。作为一个\
  \ wiki，社区成员可以为任何 Pentaho 项目贡献自己的技术提示或文档。\n\nPentaho 还在 http://reporting.pentaho.org\
  \ 托管了一个专门面向 Pentaho Reporting 社区的子域名，其中包含有关最新版本和下载链接的信息。此外，Pentaho 开源项目的最新版本 Javadoc\
  \ 在线托管于 http://javadoc.pentaho.com。Pentaho Reporting Javadoc 可在 http://javadoc.pentaho.com/reporting/\
  \ 找到。\n\n## 提交错误并查看待办事项\n\n要提交错误或查看 Pentaho Reporting 的待办事项，你可以访问 Pentaho 的 JIRA\
  \ 错误跟踪系统 http://jira.pentaho.com。Pentaho Reporting 被分为两个主要项目：Pentaho Reporting Engine\
  \ 和 Pentaho Report Designer。每个项目都包含一个路线图链接，其中列出了 Pentaho 和开源社区正在处理的优先活动列表。\n\n##\
  \ 贡献代码\n\n如果你想为 Pentaho Reporting 添加新功能或修复错误，Reporting Engine 和 Report Designer\
  \ 的源代码很容易访问。Pentaho 在 GitHub 仓库 https://github.com/pentaho/pentaho-reporting 中维护\
  \ reporting 项目。Reporting engine 的核心源代码位于 `engine` 子文件夹中，而 Report Designer 位于 `designer`\
  \ 子文件夹中。通过访问 https://github.com/pentaho/pentaho-reporting/releases，你可以使用浏览器浏览数十个版本和版本变更。\n\
  \nPentaho 收到的一种贡献类型是翻译的消息包。这些消息包位于 reporting 项目中，可通过在每个项目中搜索 `messages.properties`\
  \ 文件找到。例如，`engine` 项目中就有许多此类文件。\n\n## 企业支持\n\nPentaho 提供 Pentaho Reporting 的企业版，其中包括直接客户支持，以及额外的功能，例如\
  \ Pentaho Business Analytics Platform 中的企业审计。如果你在企业工作并希望购买企业许可证，可以通过访问 http://www.pentaho.com\
  \ 直接联系 Pentaho。订阅客户可以访问 Pentaho，其中包含有关 Pentaho 所有产品的许多文章和企业文档。Pentaho 与大量合作伙伴合作提供咨询服务，可能包括从设置你的报表服务器到编写企业所需的自定义功能等一切内容。\n\
  \n## 成为专家后该怎么做\n\n你是否看到了 Pentaho Reporting 的强大之处？而且在多年之后它仍然免费提供。你能想象有多少开发人员投入了多少努力才达到这种成熟度吗？得益于像\
  \ Pentaho Reporting 这样的工具，你节省了多少宝贵的时间？你将从论坛、聊天、公开文档学习中，或从真正的专家撰写的博客文章中学到多少东西？\n\n\
  现在可能是你从这一切中受益的时候了，但不要忘记，一旦你成为 Pentaho Reporting 专家，就要回馈他人。\n\n像别人帮助你一样帮助他人。这让社区变得有价值。\n\
  \n## 总结\n\n在本章中，你学习了如何使用 Pentaho Report Designer 以及 Java 项目中的 Pentaho 依赖项来构建和使用\
  \ Pentaho Reporting nightly build。在本书的最后一个主题中，你了解了作为 Pentaho Reporting 的新开发者和专家，如何查找文档、资源、支持、结识社区等所有方式。\n\
  \n感谢你抽出时间阅读本书。我希望你现在对 Pentaho Reporting 感到自在，并对使用它尝试新项目感到兴奋。祝你愉快！\n"
