  md: '# Font, text, and text-spacing properties


    `Font`, `text`, and `text-spacing` are three basic sets of properties, entirely
    dedicated to text layout in your report. Differently from the previous set of
    properties, the majority of the properties are shared (and inherited) from `Master
    Report` and all types of bands. Let us take a look at each property in detail
    in the following sections.'
