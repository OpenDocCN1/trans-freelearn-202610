    `PmdDataFactory` uses the `IPmdConnectionProvider` interface to obtain the metadata
    domain objects, as well as the database connection for the query.

    `IPmdConnectionProvider` must be specified via the `setConnectionProvider` method.
    A default implementation, `PmdConnectionProvider`, manages loading the XMI file
    as well as determining the database connection to be used, based on metadata information
    provided in the XMI file.


