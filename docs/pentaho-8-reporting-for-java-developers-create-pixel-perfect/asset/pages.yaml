- pgno: 317
  md: '# OLAP4J


    The OLAP4J data source defines the access to any OLAP server using a common API.
    OLAP4J, which is an open Java API for OLAP (http://www.olap4j.org). Think of it
    like JDBC, but for accessing multidimensional data.


    Once selected, a modal window is shown, as follows:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_317_0.png)


    As you can see, the components of the user interface are exactly the same as for
    a JDBC connection: the Data Source tab and the Global Scripting tab, and the connection
    panel (on the left) and the query panels (on the right). All of them have the
    same meaning and use as the JDBC connection panel, except for the OLAP4J Security
    Configuration button containing different parameters to be used with respect to
    the JDBC ones. Of course, in this case, the Query field is also expected to be
    in MDX language with the possibility to define parameters.


    Note that the connection to set up is a custom JDBC connection with settings similar
    to the following ones: Custom Connection URL:

    jdbc:xmla:Server=http://<server>:<port>;Catalog=FoodMart;Cube=Budget

    Custom Driver Class Name: org.olap4j.driver.xmla.XmlaOlap4jDriver'
  merge: -1
