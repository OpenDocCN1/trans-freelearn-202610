  md: '# Including an external CSS or JavaScript resource


    Using the master report object''s `append-header` property, it is possible to
    include CSS or JavaScript in your report. This is useful if you have written a
    large amount of JavaScript that you would like to keep separate from your report,
    or if you want to include a useful JavaScript library, as demonstrated in the
    example that will follow.


    An example of the `append-header` value can be:


    ```

    |<link type="text/css" rel="stylesheet" href="custom.css" />

