    ![](img/9337ac94537bf7e092e1ea6531dce8fd_112_1.png)


    If you don''t understand the details of the structure and the meaning of each
    label, don''t worry. In the later chapters, we will cover all the details about
    the Pentaho Report Designer and you will practice a lot to became a real expert
