- pgno: 560
  md: '# Accessing data throughout a report


    Once you have configured your `DataFactory` implementation, it is important to
    know how to access this data within a report. As mentioned in Chapter 11, *The
    PRPT format and the Java API to build it*, elements that contain the field name
    property access row data via the column headers provided by the data source. In
    addition to accessing the fields directly, you may also access this data in functions
    and formulas.


    Functions in Pentaho Reporting contain a property named `Field` or `Fields` that
    allow you to select a list of fields from the defined data source. To reference
    a field in a formula, you need to place brackets around the field name. An example
    reference to a field name in a formula can be `[Product]`.


    When using `DataFactory` that isn''t supported directly in the Report Designer,
    such as the `hibernate.HQLDataFactory`, you need to manually type the name of
    the fields into the Report Designer. Another issue with using non-supported `DataFactory`
    classes in the Report Designer is that the report preview won''t be available
    for use. One strategy to avoid these issues is to build a sample dataset, which
    contains the identical column headers in a Report Designer supported `DataFactory`
    implementation, in order to verify that reports look as expected.'
  merge: -1
