- pgno: 553
  md: '# Pentaho Reporting Engine Data API


    The **Pentaho Reporting Engine Data API** is a simple API that describes how Pentaho
    Reporting accesses data to populate reports. In this section, you will learn about
    the core interfaces of the API. All the individual implementations discussed later
    in this chapter implement this API.


    There are two main Java interfaces related to the Pentaho Reporting Engine Data
    API. The first interface you will learn about is `org.pentaho.reporting.engine.classic.core.DataFactory`.
    The primary purpose of the `DataFactory` interface is to generate an object that
    implements the `javax.swing.table.TableModel` interface. The `TableModel` interface
    is a very simple API for accessing two-dimensional cell data. These two simple
    APIs are combined to manage all data input into Pentaho Reporting.


    To implement your own Java data source for the Pentaho Reporting Engine, all you
    need to do is implement the `DataFactory` and `TableModel` interfaces. But most
    likely, you will be able to take advantage of one of the many existing `DataFactory`
    implementations to load your data.'
  merge: -1
  img_proc: true
- pgno: 554
  md: '# The DataFactory interface


    The `DataFactory` interface defines a couple of fields and some methods, discussed
    in this section. Any parameter specified in the report definition file is available
    as part of the `DataRow` parameter''s object. If the query is used as part of
    a sub-report, parameters passed into the sub-report from the master report are
    made available as well. If there is a problem executing the query, the implementer
    may throw `ReportDataFactoryException`, which will be properly handled by the
    Reporting Engine.


    Following are the fields, defined with brief descriptions of their uses and meanings:


    | Field | Description |

    |---|---|

    | `QUERY_LIMIT` | The maximum number of resulting rows to be returned. If set
    to zero, returns all rows. |

    | `QUERY_TIMEOUT` | The maximum time to wait for a query to return. If set to
    zero, no timeout should be used. |


    Following are the methods, defined with brief descriptions of their uses and meanings:


    | Method | Description |

    |---|---|

    | `void cancelRunningQuery()` | If supported by the implementing `DataFactory`,
    the `cancelRunningQuery` method call will cancel the currently executing query
    of `DataFactory`. |'
  merge: -1
