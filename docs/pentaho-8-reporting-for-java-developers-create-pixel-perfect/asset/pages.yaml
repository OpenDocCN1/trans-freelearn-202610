- pgno: 699
  md: '# Getting help from the community


    As an open source project, Pentaho Reporting has a community of people and organizations
    who contribute by answering questions, providing translations, filing and fixing
    bugs, writing documentation, and of course, by contributing code. To make sure
    you can find what you need to engage the Pentaho Reporting community, the following
    is a list of online places and tools to help you get started.'
  merge: -1
  img_proc: true
- pgno: 700
  md: '# Asking questions and helping others


    Today, there are two primary methods of communication in the Pentaho Reporting
    community. The first and most widely used method is Pentaho Reporting forums.
    These forums are located at http://forums.pentaho.org/ under the main category
    Pentaho Reporting. You can search and read forum discussions, or sign up for an
    account and ask your own questions.


    Another main method of communication is Pentaho''s IRC channel, set up by Pentaho
    community members. This channel is located on the FreeNode IRC (https://freenode.net/),
    as channel ##pentaho. If you don''t have an IRC client, feel free to join the
    channel using the FreeNode WebChat (http://webchat.freenode.net). A large number
    of active Pentaho community members are available to answer technical questions.'
  merge: -1
  img_proc: true
- pgno: 701
  md: '# Online documentation


    While the reading this book, you have already seen that Pentaho has a website
    dedicated to documentation and it is available at https://help.pentaho.com/. In
    the documentation''s website, you will find all the available content about the
    latest version, and also the content related to the previous versions.


    Pentaho hosts a wiki, which contains community documentation for Pentaho''s various
    projects. You can find the wiki at http://wiki.pentaho.com, which contains links
    to Pentaho Reporting documentation, as well as tech tips that walk you through
    specific use cases. As a wiki, community members may contribute their own tech
    tips or documentation around any of the Pentaho projects.


    Pentaho also hosts a sub-domain dedicated to the Pentaho Reporting community at
    http://reporting.pentaho.org, which contains information about the latest releases
    and download links. Also, Javadoc for the latest versions of Pentaho''s open source
    projects is hosted online at http://javadoc.pentaho.com. Pentaho Reporting Javadoc
    can be found at http://javadoc.pentaho.com/reporting/.'
  merge: -1
  img_proc: true
- pgno: 702
  md: '# Submitting bugs and viewing backlogs


    To submit a bug, or view Pentaho Reporting''s backlog, you can visit Pentaho''s
    JIRA bug tracking system at http://jira.pentaho.com. Pentaho Reporting is broken
    into two main projects: the Pentaho Reporting Engine and the Pentaho Report Designer.
    Each project contains a road map link, containing a list of prioritized activities
    that Pentaho and the open source community are working on.'
  merge: -1
  img_proc: true
- pgno: 703
  md: '# Contributing code


    If you''d like to add a new feature to Pentaho Reporting or fix a bug, the source
    code for the Reporting Engine and Report Designer is easily accessible. Pentaho
    maintains the reporting project in a GitHub repository at https://github.com/pentaho/pentaho-reporting.
    The reporting engine''s core source code is located in the `engine` subfolder,
    and the Report Designer is located in the `designer` subfolder. By going to https://github.com/pentaho/pentaho-reporting/releases,
    you can browse the dozens of releases and version changes, using your browser.


    One of the many types of contributions Pentaho receives is translated message
    bundles. These message bundles are located in the reporting projects, and can
    be found by searching for the `messages.properties` files in each project. For
    instance, there are many of these files in the `engine` project.'
  merge: -1
  img_proc: true
- pgno: 704
  md: '# Enterprise support


    Pentaho offers an enterprise edition of Pentaho Reporting, which includes direct
    customer support, as well as additional functionality, such as enterprise auditing
    within Pentaho''s Business Analytics Platform. If you are working in an enterprise
    and would like to purchase an enterprise license, you can contact Pentaho directly
    by visiting http://www.pentaho.com. Subscription customers have access to Pentaho
    which contains many articles and enterprise documentation on all of Pentaho''s
    products. Pentaho works with a large set of partners to offer consulting, which
    may include everything from setting up your reporting server to writing custom
    functionality that your business requires.'
  merge: -1
  img_proc: true
- pgno: 705
  md: '# What to do once you become an expert


    Did you see how powerful Pentaho Reporting is? And it is still given for free
    after several years. Can you imagine how much effort has been invested from a
    bunch of developers to reach this level of maturity? How much of your precious
    time has been saved, thanks to the use of tools like Pentaho Reporting? How many
    things you will learn attending the forums, the chat, learning from the public
    documentation or the blog posts written from real experts?


    Now it''s probably your time to benefit from all of this, but don''t forget to
    give something to the others, once you reach the point where you are a Pentaho
    Reporting expert.


    Help the others in the same way as someone else helped you. This makes the community
    valuable.'
  merge: -1
  img_proc: true
