- pgno: 588
  md: '# BandedMDXDataFactory and DenormalizedMDXDataFactory


    Accessing an **Online Analytical Processing (OLAP)** data source, in case a multi-dimensional
    engine is involved, has been described in chapter 6, *Configuring JDBC and other
    data sources*. To cover all the possible use cases, Pentaho Reporting Engine Data
    API defines two different packages:

    `org.pentaho.reporting.engine.classic.extensions.datasources.mondrian` and

    `org.pentaho.reporting.engine.classic.extensions.datasources.olap4j`.


    The first one, `org.pentaho.reporting.engine.classic.extensions.datasources.mondrian`,
    clearly manages the **Mondrian** (http://community.pentaho.com/projects/mondrian)
    data source, and the second one,

    `org.pentaho.reporting.engine.classic.extensions.datasources.olap4j`, manages
    the **OLAP4J** (http://www.olap4j.org) data source types.


    In both packages, two classes allow you to populate your report: the `BandedMDXDataFactory`
    class, to manage normalized **multi-dimensional expression (MDX)** queries, and
    the `DenormalizedMDXDataFactory` class, to manage denormalized **multi-dimensional
    expression (MDX)** queries.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_588_0.png)


    *For definitions and examples of normalized and denormalized MDX queries, take
    a look at Chapter 6, Configuring JDBC and other data sources; in particular, the
    OLAP data source section.*


    Natively, OLAP data sources support result sets with more than two axes. In a
    traditional result set used by Pentaho Reporting, there are column headers along
    with rows of data. When using OLAP data, the data source needs to determine how
    to map the richer OLAP data into a standard `TableModel` data source.'
  merge: -1
  img_proc: true
- pgno: 589
  md: '# BandedMDXDataFactory


    With `BandedMDXDataFactory`, the factory maps the row and column axes of the OLAP
    result set to `TableModel`. The column headers display the dimensions selected
    in the column axis. The rows show the selected row axis information. For instance,
    if a year was selected from the time dimension on the column axis, in the column
    header you would see the member name `[Time].[2017]`.


    The configuration of the `BandedMDXDataFactory` object for Mondrian and OLAP4J
    is developed differently, even if they use the same classes and principles. In
    case of Mondrian, the configuration is done using the `setDataSourceProvider(DataSourceProvider
    dataSourceProvider)` method to setup the connection to the RDBMS schema, and the
    `setCubeFileProvider(CubeFileProvider cubeFileProvider)` method to setup the connection
    to the Mondrian schema. As you can see in the Javadoc website ([http://javadoc.pentaho.com/reporting](http://javadoc.pentaho.com/reporting)),
    `DataSourceProvider` is implemented by `DriverDataSourceProvider` and `JndiDataSourceProvider`,
    and `CubeFileProvider` is implemented by `DefaultCubeFileProvider`.


    In case of OLAP4J, you must first create an object that implements the `OlapConnectionProvider`
    interface, which will be used directly in the `BandedMDXDataFactory`''s constructor.
    `DriverConnectionProvider` and `JndiConnectionProvider` provide an implementation.


    Once you have created the factory, in the cases of Mondrian and OLAP4J, you may
    add **multi-dimensional expression (MDX)** queries by calling the `setQuery(String
    name, String mdxQuery)` method.'
  merge: -1
