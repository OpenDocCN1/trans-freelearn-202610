- pgno: 389
  md: '# Scatter plot chart


    The scatter plot chart renders all items in a series as points within a chart.
    This chart type utilizes the common properties defined earlier, including the
    XY series dataset properties as default. As alternative datasets, you can also
    decide to use the XYZ series dataset or the times series dataset. You can change
    the dataset using the drop-down menu in the upper part of the Primary DataSource
    tab. Concerning the available properties, in the following description are listed
    all the differences from the common list introduced in the beginning of the chapter:


    +   - The title set of properties is provided with the same properties as described
    for the bubble chart (the title common set and `pos-title` in addition).

    +   - The options set of properties is provided with some of the properties previously
    introduced: `stacked`, `horizontal`, and `series-color`. In addition are provided
    the `dot-height` and `dot-width` properties (integer), which define the height/width
    of the marker that represents a series point (in pixels), are additionally provided.

    +   - The general set has the same properties as described for the common set,
    and in addition, it has `show-plot-border` and `label-font` (see bar chart for
    their definitions).

    +   - The X axis and y axis sets are also provided here with the same properties
    as described for the bar chart.

    +   - The values set has a subset of the properties described for the bar chart
    (more in detail: `show-item-labels`, `item-label-font`, `url-formula`, and `tooltip-formula`).'
  merge: -1
  img_proc: true
