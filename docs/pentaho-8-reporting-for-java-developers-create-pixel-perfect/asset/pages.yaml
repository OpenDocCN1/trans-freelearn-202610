- pgno: 312
  md: '# The OLAP data source


    The **Online Analytical Processing (OLAP)** data source is used in case a multidimensional
    engine is involved.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_312_0.png)


    > *Quoting from Wikipedia about OLAP (https://en.wikipedia.org/wiki/Online_analytical_processing):
    a multidimensional structure is defined as a variation of the relational model
    that uses multidimensional structures to organize data and express the relationships
    between data. Even when data is manipulated it remains easy to access and continues
    to constitute a compact database format. A multidimensional structure is quite
    popular for analytical databases that use OLAP applications. Analytical databases
    use these databases because of their ability to deliver answers to complex business
    queries swiftly.*


    The Pentaho suite provides an open source multidimensional engine called Mondrian
    (http://community.pentaho.com/projects/mondrian). Mondrian is entirely written
    in Java and it executes queries written in the **Multidimensional Expressions
    (MDX)** language, reading data from a relational database and presenting the results
    in a multidimensional format.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_312_1.png)


    > *Quoting from Wikipedia about MDX (https://en.wikipedia.org/wiki/MultiDimensional_eXpressions):
    MDX is a query language for OLAP using a database management system. Much like
    SQL, it is a query language for relational databases. It is also a calculation
    language, with syntax similar to spreadsheet formulas.*


    Once accessible to the selection of the data source type, you can see there are
    two different subgroups available: OLAP and OLAP (Advanced). OLAP (Advanced) data
    sources differ from standard OLAP data sources only in the method by which you
    design and enter the MDX query. Standard OLAP data sources allow for Report Designer''s
    built-in metadata query editor, whereas OLAP (Advanced) data sources require you
    to build a formula to calculate the query, which gives you more power over report
    parameterization functionality.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'Included in both the subgroups, you can find a version of each OLAP data source
    named as denormalized (the default data sources assume they are normalized). Normalized
    and denormalized are two possible classifications of MDX queries, depending on
    the structure of the resulting dataset. It''s not within the scope of this book
    to elaborate over the details of data normalization/denormalization, but the following
    example can shed some light over the differences between the two.


    Here is an example of a normalized form of an MDX query:


    | [Time].[(All)] | [Time].[Years] | [Measures].[Revenue] | [Measures].[Quantity]
    |

    |---|---|---|---|

    | All years | 2015 | 150,000 | 1,000 |

    | All years | 2016 | 170,000 | 1,100 |

    | All years | 2017 | 190,000 | 1,200 |


    Here is an example of a denormalized form of the same MDX query:


    | [Time].[(All)] | [Time].[Years] | [Measures].[MeasuresLevel] | Measure |

    |---|---|---|---|

    | All years | 2015 | Revenue | 150,000 |

    | All years | 2016 | Revenue | 170,000 |

    | All years | 2017 | Revenue | 190,000 |'
  merge: -1
  img_proc: true
- pgno: 314
  md: '| All years | 2015 | Quantity | 1,000 |

    |---|---|---|---|

    | All years | 2016 | Quantity | 1,100 |

    | All years | 2017 | Quantity | 1,200 |


    Considering that the normalized and denormalized data sources are defined in exactly
    the same way, and the only changes are in the resulting formats, in the following
    description, we won''t detail the denormalized ones, assuming they can be defined
    in exactly the same way.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Pentaho analysis


    The Pentaho analysis data source defines the access to the Mondrian multidimensional
