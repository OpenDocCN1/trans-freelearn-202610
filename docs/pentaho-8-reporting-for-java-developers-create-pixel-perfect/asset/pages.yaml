  md: '# The datadefintion.xml file and datasources folder


    The `datadefinition.xml` file contains information about report input parameters
    and the report data source, as well as report functions and expressions. The root
    element in this XML file is data-definition, and uses the (http://reporting.pentaho.org/namespaces/engine/classic/bundle/data/1.0)
    namespace for XML validation.'
