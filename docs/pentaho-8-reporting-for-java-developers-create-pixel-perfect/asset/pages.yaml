  md: '# Customizing the page footer


    Customizing the page header and page footer is nothing different from what we
    saw for the report header. The bands in the Report canvas are definitely helpful
    and they are going to enable you to develop everything as requested for this task.
    Our goal now is to add the user executing the report and the page number in the
    page footer.


    To prepare the page footer, we are going to change the default text color by selecting
    the Page Footer item from the Structure tab in the Report Explorer. Changing the
    color is straightforward using the Style tab of the Element properties. In particular,
    identify the `text-color` property and set it to `#77b3d4`.


    To add the user to the report, let''s use a bundled **parameter** called `env:username`.
    To use the parameter in your report, select the `Data` tab in the Report explorer
    and scroll down until you find the Environment group. As usual, drag the `env:username`
    parameter and drop it into the Page footer band, on the left:


