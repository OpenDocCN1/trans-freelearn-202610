    Then press the OK button and check the Do not change the layout option. Once confirmed,
    drag on the chart icon from the report element palette and drop it into the `Report
    Header` band. Stretch the chart element to cover the whole width of the page,
    and set to 450 the `height` property of the `size & position` group in the element
    properties panel. This setup will give to your chart a bigger space, so as to
    be correctly visible on the page.


    By double-clicking on the chart element, the chart edit window will be'
