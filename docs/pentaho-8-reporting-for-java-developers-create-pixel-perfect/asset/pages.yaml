- pgno: 549
  md: '# Developing an example of Pentaho report


    In this example, you will take what you have learnt earlier and incorporate it
    into a simple Java application. Starting from the basic example shared in Chapter
    3, *Getting Started with Reporting SDK*, you change the `PentahoServlet1` class
    to programmatically build the report (the class is renamed as `PentahoServlet`).
    The idea is to manually build the report, in a manner similar to what you saw
    in the previous sections.


    In particular, the report will contain:


    +   - A table data source listing some dummy products with cost and quantity as
    measures

    +   - A formula named `totalCostPerProduct` calculating `[Cost]*[Quantity]`

    +   - The report header and footer

    +   - A bar chart showing the cost per product in the report header

    +   - A couple of labels (`Product` and `TotalCost`) in the report header

    +   - Two fields in the report details, for the product (a `text` field) and the
    total cost (a `number` field)


    Instead of explaining here what to add/remove to/from the Maven project, it is
    more interesting to share the final version of the source code and describe how
    to run it. The complete version of the source code developing the report can be
    found in the https://github.com/fcorti/pentaho-8-reporting-for-java-developers
    repository, in the `Chapter 11 - The PRPT format and the Java API to build it/pentaho-reporting-manual-build`
    folder.


    Download the `pentaho-reporting-manual-build` folder to your local machine, open
    a Terminal, move into this folder, and execute the following command:


    ```

    |mvn clean package

    ```


    Once done, it''s time to to run the project, by executing the following command:


    ```

    |java -jar target/dependency/jetty-runner.jar target/*.war

    ```'
