- pgno: 149
  md: '# Creating a Report with Report Designer


    In the previous two chapters, you learned the basis of Report Designer and Reporting
    **Software Developers Kit (SDK)**. Reporting Engine has been treated as part of
    the other two tools. In this chapter, you are going to use Pentaho Report Designer
    again, with the goal to better understand it and start becoming a real expert.
    With this chapter, starts a collection of six chapters entirely dedicated to the
    desktop reporting tool. Starting from here, you will see all the advanced features,
    with the goal of being able to develop the best reports for your manager and customers.


    To get started, you will first learn how to develop a Pentaho report from scratch,
    not using the Report Design Wizard as you did in Chapter 2, *Getting started with
    Report Designer*. The manual creation of a Pentaho report will give you the opportunity
    to see in action, all the features (basic and advanced) of the Pentaho Report
    Designer. As usual, the description will be driven by a practical example and
    a step-by-step approach to the tasks. To make the example more practical, you
    are going to develop a Pentaho report based on the inventory of products stored
    in the `SampleData` database.


    To complete the initial description of the Report Designer''s features, you will
    see how to customize the resulting report with a nice header, footer, and grouping
    of details. In the last (but not the least) topic, you will be introduced to the
    charts, before being shown how to preview reports in all the possible formats.


    This chapter is again written as a tutorial for developers and information technologists.
    The best way to learn is to follow the instructions on your laptop while reading.
    At the end of this chapter, you will feel comfortable with the manual development
    of easy and complex Pentaho reports developed using Pentaho Report Designer. Later
    chapters will assume that you are able to manually develop a Pentaho report, so
    read it carefully and pay attention.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Creating a Pentaho report


    As we discussed in Chapter 2, *Getting Started with Report Designer*, the creation
    of a Pentaho report starting from a blank report is an alternative to using the
    Report Design Wizard. Neither of the two ways is better than the other. Each way
    has advantages and disadvantages, and you should mature your own idea after some
    practice.


    The development starting from a blank report is suggested if you want to have
    full control over the details and behaviors. The development using the wizard
    is suggested if your goal is to develop a standard report, quite simple in terms
    of structure, and also simple in terms of layout and customizations.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_150_0.png)


    > *Let''s underline again one best practice: some developers prefer to start modifying
    a report built with the wizard, instead of starting from scratch. In principle
    this is not bad, but what can be experienced is that you have less control over
    some details, especially in fine tuning of the layout or some unexpected behaviors
    in particular cases.*


    In this section, you are going to learn how to develop a Pentaho report starting
    from a blank report. The goal is to develop a very simple example and then add
    elements to elements till you get a nice result in terms of layout and complexity.


    To make the example more practical, you are going to develop a Pentaho report
    based on actuals, stored in the `SampleData` schema. The report will include information
    about the actuals and the budget for each role of a company, along with a summary
    pie chart to give an idea of the distribution in the various departments. This
    example will also include a static image and a title in the report header, and
    a page count and the username in the page footer of the report.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Creating a new Pentaho report


    Creating a Pentaho report starting from a blank report is really straightforward.
    From Pentaho Report Designer, use the upper menu (click on the File item and then
    on New) or the toolbar, as shown in the following image:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_151_0.png)


    Once the blank report is created, an empty report is shown, similar to the following
    screenshot:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_151_1.png)


    Before moving ahead with another task, let''s give some colors to the report'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'canvas. The report canvas, shown in the center of the screenshot, is where
    you define the look of your report.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_152_0.png)


    > *Note that, at this point, you haven''t decided if the report will be rendered
    as PDF, RTF, or Excel. In fact, any report definition can be rendered in all of
    these formats. Therefore, at this point, you do not have to worry about that.*


    The report canvas contains a set of **bands** that together make up a report.
    Bands include Report Header and Report Footer bands, individual Group Header and
    Group Footer bands (hidden by default), as well as a Details band that is rendered
    for each row of data. Reports may also contain Page Header and Page Footer (visible
    by default). Each band has a different life cycle and is rendered based on its
    context. You can hide any of the panels around the canvas by changing their visibility
    within the Window menu. This can help manage your screen while designing reports.


    In real life scenarios, reports can vary a lot in terms of structure and content.
    Of course, the content is mostly driven by the data sources, but the layout really
    depends on the final user and the type of report that you have to develop. Not
    all the layouts are same, even if Pentaho Reporting is able to face all the possible
    requests (maybe). In this section, we would like to draw some light on this topic,
    pointing your attention to the fact that you can easily face all the future requests
    that your colleague or customer may ask of you in terms of report layout.


    In terms of layout, the available bands in Pentaho Report Designer can help you
    a lot in showing the data either at the maximum level of details (Details Body)
    or as grouped and aggregated (Group, Report Header and Report Footer, and Page
    Header and Page Footer).


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_152_1.png)


    > *Depending on the report that you have to develop, feel free to use only the
    details, only the aggregations, or both, to define your preferred layout for the
    best result.*'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Creating a datasource in Pentaho reports


    Before starting to develop the appearance of the report, you need to define a
    **data source**. The data source is the basis of every report, as it defines the
    list of fields requested for the viewing of results, for the making of charts,
    for the calculating of formulas, and so on. Starting from the empty report, by
    selecting the Data tab on the top right and right-clicking on Data Sets, as shown
    in the following picture, it is possible to define a new dataset and choose its
    type from a wide list of options. The following is an image showing what the selection


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_153_0.png)


    looks like:


    In the following chapters, we will discuss all the available types of data sets
    , but in our example, we are going to use the most common one, the JDBC.


    *Java Database Connectivity (JDBC) is an **application programming interface (API)**
    for the Java language, which defines how a client may access a database. It provides
    methods to query and update data in a database and is oriented towards relational
    databases. See https://en.wikipedia.org/wiki/Java_Database_Connectivity for further
    details.*


    By clicking on JDBC, you will get a panel similar to the next image, which has
    a connection canvas on the left, the available queries in the top right, and query'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'details on the bottom line. In the connection canvas, you will find five different
    types of associations to the `SampleData` schema. Take your time to examine each
    connection and their differences.


    By selecting one connection and clicking on the pencil icon (✏️), you will have
    access to the connection parameters and settings. Even if all the connections
    point to the `SampleData` schema, the type of access is different, and the different
    parameters and settings. We won''t detail the differences between the types of
    connections, but will wait for the chapter dedicated to the data sources to discover
    further details.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_154_0.png)


    > *It''s important to note that the default installation of Pentaho Report Designer
    does not provide all the JDBC drivers to the sources, even if they are listed
    in this panel. To install a JDBC driver, simply copy the JAR file implementing
    the driver into the `<report-designer>/lib/jdbc` folder and restart.*


    Even if you are going to use an existing connection, it is very simple to create
    a new one by using the green plus icon (➕). As an exercise, try to click the green
    plus icon (➕) to see what the window looks like.


    After having introduced the connection canvas, select `SampleData (local)` and
    continue defining a query over the connection. To define a query, press the green
    plus icon (➕) on the right of the `Available Queries` panel. Once clicked, a new
    named `Query 1` will be defined. To change its name to be meaningful, select it
    and change the value in the `Query Name` field. In our case, we are going to call
    it `Actuals`.


    Now that the query is available but should be defined, let''s focus on the bottom
    panel containing the query definition. At the bottom right of the canvas, digit
    the query or compose it using **SQLLeonardo Query Builder**. The simple query
    builder is accessible through the pencil icon (✏️) on the right. In both cases,
    you can select a single table or define a more complex query over multiple tables.
    Once finished, click on Preview to see the resulting data set.


    In our example, let''s define the query as described in the following screenshot:'
