- pgno: 299
  md: '# # About the JNDI access


    The **Java Naming and Directory Interface (JNDI)** is a Java API for a directory
    service that allows Java software clients to discover and look up data and objects
    using a name. Because of its nature, the settings requested for the JNDI connection
    is a name only. This unique name should match an existing JNDI connection available
    in the Pentaho Reporting environment.


    To set up a JNDI data source in Pentaho Reporting, edit the `.pentaho/simple-jndi/default.properties`
    file. The `.pentaho` directory is in the home or user directory of the user account
    that runs Pentaho Report Designer. If you have multiple copies of Pentaho Report
    Designer installed in multiple user accounts, each `default.properties` file should
    be edited.


    The following example shows text lines to be added/edited relation to an existing
    JNDI connection; the JNDI connection to `SampleData` on HyperSQL:


    ```

    SampleData/type=javax.sql.DataSource

    SampleData/driver=org.hsqldb.jdbcDriver

    SampleData/url=jdbc:hsqldb:hsql://localhost/sampledata

    SampleData/user=pentaho_user

    SampleData/password=password

    ```


    As you can see, the name of the JNDI connection is used as a prefix for all the
    settings in the properties file.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Adding or editing a query


    Once the connection is added (or updated), the next task is defining the queries.
    Starting from the JDBC Data Source window, the Available Queries panel lists all
    the queries defined for the current data source. In the top-right corner of the
    panel, you can see:


    +   - A green plus icon (⊕) used to add a new query

    +   - A red icon (⊗) used to delete an existing query


    A query is generally identified by a name and content. The name of a query can
    be edited in the Query Name field and the content can be managed in the bottom
    panel of the window. The content could be a static string or a script. The static
    query (widely used) is written in the syntax required for the database type (usually
    SQL). The SQL string can be enriched with some optional parameters defined using
    a specific notation (you will see the syntax of the notation in the following
    chapters).


    The query scripting is a source code in ECMAScript or Groovy and you can use it
    to manipulate the dataset, using a programming language. The query scripting is
    rarely used and we won''t treat it in detail, but it''s a collection of functions
    you can develop to make the dataset exactly as you want. The static query can
    be specified in the Query field of the Static Query tab, and the query scripting
    can be specified in the Query Script field of the Query Scripting tab.


    > *Click on the Template button of the Query Scripting tab to see all the available
    functions, and documentation on how to develop the dataset using the source code
    instead of a standard query.*


    The pencil icon (✎) in the Static Query tab is useful to launching SQLeonardo
    Query Builder, a powerful and easy-to-use GUI that lets you query databases without
    any relevant knowledge of the SQL syntax. Max Preview Rows, if enabled, lets you
    declare the maximum number of rows retrieved for previewing the data, and the
    Preview button checks that everything is working as expected and shows a bunch
    of data results as a data table.'
  merge: -1
  img_proc: true
- pgno: 301
