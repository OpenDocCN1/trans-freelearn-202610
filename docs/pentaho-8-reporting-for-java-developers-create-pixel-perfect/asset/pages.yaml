- pgno: 273
  md: '# Visual layout in Report Designer


    With Pentaho Report Designer, you have pixel level control of your individual
    elements within a report. Grid and guide lines may appear within each report canvas
    band, which make it simple to align and configure locations of the elements.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# The grid


    By default, the report grid is enabled. To hide the grid, disable the menu item
    View | Grids | Show. The grid presents itself in point units (also known as pixel
    units), with a light grey grid line displayed every 25 pixels. Grid lines are
    useful for visual feedback of alignment, as well as for providing a method for
    snapping elements to the grid. This makes aligning of elements a simple exercise.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_274_0.png)


    To adjust the ruler unit to centimeters, millimeters, inches, or picas, go to
    the View | Units sub-menu. The default grid size may be adjusted by launching
    the grid size dialog. Select the View | Grids | Settings menu item and adjust
    your grid sizing. You may show or hide the grid by selecting the menu item View
    | Grids | Show, or by pressing Ctrl+Quote.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Guide lines


    **Guide lines** allow you to specify a custom grid line. To add a new horizontal
    or vertical guide line, click within the ruler section of the report canvas. A
    new blue guide line should appear. Guide lines are useful for visual feedback
    of layout, as well as for snap to grid features that simplify element placement.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_275_0.png)


    Guide lines may be moved by dragging their location within the ruler. They may
    also be moved by right-clicking on the line within the ruler and selecting Properties...,
    and then typing in the new value for the guide line.


    It is possible to deactivate a single guide line by right-clicking and selecting
    `Deactivate`. This causes the guide line to be removed from the report canvas
    content and appear as a grayed out mark within the ruler section of the canvas.
    Also, guide lines may be completely removed from the report by right-clicking
    and selecting Delete.


    All guide lines may be activated and deactivated together by selecting View |
    Grids | Show Guides, or by clicking *Ctrl + S*. This is useful if you use many
    guidelines and want to quickly see the report without all the blue lines running
    through it.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Additional visual indicators


    In addition to grid lines and grid guides, a couple of other handy shortcuts exist
    to make it easier to lay out your report. By default, when selecting a report
    element, the style of the selection is considered an **outline selection**. An
    alternative selection style is **clamp selection**. You may toggle between these
    two types of selections by selecting View | Outline Selection or View | Clamp
    Selection.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_276_0.png)


    Also, it is possible to show and hide all element frames by selecting View | Guides
    | Show Element Frames, or by pressing *Ctrl + H*. This is another tool to make
    it easy to visualize how the elements will be laid out next to each other, and
    to see potential overlaps that might cause problems when rendering the report.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_276_1.png)


    Another visual indicator within Report Designer is the View | Show Overlapping
    Elements menu option. With this option selected, any overlapping elements are
    highlighted, warning that there may be problems when rendering the report.


    Finally, another useful capability within the Report Designer is the ability to
    zoom in and out of the grid. By default, the Report Designer displays the grid
    rendered at 100 percent. Within the View | Zoom menu, you may view the report
    as 50 percent, 100 percent, 200 percent, or 400 percent of its actual size.


    As another helpful feature, the View | Element Alignment Hints menu can help you
    to place the elements showing some alignment bars on each element. This'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'could help you in alignment, even if the easier Format | Alignment menu is
    probably faster.


    To complete the item available in the View menu, the Snap to Elements option lets
    you easily place elements one close to the other without paying too much attention
    to the difference of a few pixels in vertical or horizontal distance.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Moving and aligning single elements


    In addition to dragging and dropping elements around the report canvas, it is
    also possible to use shortcut keys and menu items to more easily align and move
    report elements.


    To move an element, first select the element and then drag-and-drop it to the
    new location within a band. You may also use the arrow keys to move the selected
    element by individual pixels.


    To control the visibility of an element in context to other elements that may
    overlap, select the element and then select the `Format | Arrange | Send Forward`
    or `Format | Arrange | Send Backward` option to adjust the order in which the
    elements appear within a band. `Bring to Front` and `Send to Back` move the element
    to first visible or last visible respectively. This is also known as **Z ordering**.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Aligning groups of elements


    To really sharpen a report, there are two easy-to-use shortcuts available for
    aligning groups of elements. First, select the elements as a group by holding
    the Shift key and dragging a selection area around the elements, or by holding
    down the Shift key while selecting individual elements.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_279_0.png)


    Once you''ve selected a group of elements, you can easily align all the elements
    in a group, both horizontally and vertically. If you want to align all the labels
    in the example to the top, select the menu item Format | Align | Top. This will
    align all the selected elements to the topmost selection in the group. Additionally,
    you may align these elements in Middle or Bottom. For elements grouped vertically,
    you can align them Left, Center, or Right.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_279_1.png)


    Now, assume that you want to evenly distribute all the elements that are selected.
    This is possible by selecting the menu item Format | Distribute | Equal Horizontal
    Space. You can do the same vertically by selecting Equal Vertical Space.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_279_2.png)'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Miscellaneous layout capabilities


    There are also some additional layout features that make your life easier when
    working within the Report Designer. The first feature is the ability for **paste
    formatting** of an element into another element. Select and copy the element you
    would like to use to share formatting with. Now, select the additional elements
    you would like to apply the formatting to and select the menu item `Edit | Paste
    Formatting`. All the formatting-related attributes are copied into the selected
    elements, preserving their data-related properties.'
  merge: -1
  img_proc: true
