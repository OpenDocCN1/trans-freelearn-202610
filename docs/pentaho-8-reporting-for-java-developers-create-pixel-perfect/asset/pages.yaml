- pgno: 174
  md: '# Grouping the details


    At this stage, the Pentaho report seems to be more appealing for the final user,
    but we are not happy yet and what we would like to discuss now is about grouping
    the details. Grouping the details in a report is a common request and we would
    like to show an example using the `DEPARTMENT` field in our `Actuals`.


    To prepare the task, we need to modify the data source, to be sure that all the
    details are ordered by the `DEPARTMENT` field.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_174_0.png)


    > If you will use grouping in reports, be sure you are correctly ordering the
    rows by the grouping fields. If you forget this tip, you will experience some
    unexpected results, without any exception or error message. The reason for this
    behavior is quite easy to understand; Pentaho Reporting Engine changes the group
    comparing the current value of the grouping fields with the previous one, so if
    they are not ordered, the report could show a wrong result.


    To change the data source, select the Data tab in the Report explorer and right-click
    on the `Actuals` query. Select the `Edit query` item and replace the query with
    the one described next:


    ```

    SELECT *

    FROM "QUADRANT_ACTUALS"

    ORDER BY "DEPARTMENT" ASC

    ```


    As you can see, the only difference is the `ORDER BY` keyword. Press Preview and
    the OK button later on, if the preview shows the data set.


    Once the data source is prepared, the next task is defining the layout. Looking
    at the Structure tab of the Report Explorer, you can find the `Group` element.
    Click on it and select the Attributes tab from the Element properties. In the
    list of properties, you can find the `group` property in the `common` group. Change
    the value to `DEPARTMENT` using the ... button. Once done, nothing really changes
    to the layout but the grouping is correctly set in your report.


    To change the layout, click on Group Header in the Report explorer and change'
  merge: -1
  img_proc: true
