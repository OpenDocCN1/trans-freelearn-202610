- pgno: 509
  md: '# Cross tabs in Pentaho Report Designer


    A cross tabulation (or cross tab) allows you to view dimensional data in a report.
    Using cross tabs, you can easily view two or more fields and how they relate based
    on a measure. Cross tabs summarize the information in your database and they lay
    out in a grid, with rows representing dimensions (for example, country, date,
    or salesperson), columns representing another dimensions, and the intersection
    containing the aggregations (usually sums). Cross tabs are similar to pivot tables
    in Microsoft Excel.


    Pentaho Reporting offers the ability to create cross tab based reports. These
    are special type of reports that render differently than most standard reports.
    These reports also expect the data to be in a particular format. Cross tab reports
    can be driven by multidimensional queries (as highlighted in Chapter 6, *Configuring
    JDBC and Other Data Sources*, Pentaho Reporting offers a Mondrian and OLAP4j data
    source for providing multidimensional data to a report), or SQL queries can be
    used, if the structure of the columns/rows is MDX-like.'
  merge: -1
  img_proc: true
- pgno: 510
  md: '# Cross tab examples


    As a couple of examples, let''s show two basic reports using cross tabs: the first
    using an MDX query showing sales per year and market, and the second using a SQL
    query showing actual, budget, and variance per region and department. To show
    a different type of cross tab report, the second example will show multiple measures.


    To begin with the first example, using the MDX query, let''s start with an empty
    report (click on the blank report icon ( ) in the Report Designer) and a Pentaho
    Analysis data source created as described in Chapter 6, Configuring JDBC and Other
    Data Sources. The Pentaho Analysis data source is supposed to be defined on the
    steelwheel.mondrian.xml file, bundled in the Pentaho Reporting Designer distribution
    (in the <report-designer>/samples folder), the SteelWheels logical schema, and
    the SampleData (Local) JDBC connection. Following is the MDX query to edit in
    the Static Query field:


    ```

    SELECT

    CrossJoin([Markets].Children, [Time].Children) ON ROWS,

    [Measures].[Sales] ON COLUMNS

    FROM

    [SteelWheelsSales]

    ```


    Once done, point on the Master Report element in the Structure tab of report explorer.
    In particular, right-click on the Master Report element and select the Add Crosstab
    item, as shown in the following screenshot:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_510_0.png)


    After clicking the item, a cross tab wizard will be shown, as in the next screenshot.
    Fill in the fields, paying attention to changes the Aggregation'
  merge: -1
