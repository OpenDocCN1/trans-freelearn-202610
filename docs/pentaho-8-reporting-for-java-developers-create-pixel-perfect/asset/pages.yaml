- pgno: 517
  md: '# Anatomy of a .prpt bundle file


    To share the exact details of a .prpt bundle file, let''s start with a concrete
    example. Feel free to choose a Pentaho report, randomly chosen from the ones that
    you already have in your development environment, or one downloaded from the https://github.com/fcorti/pentaho-8-reporting-for-java-developers
    repository.


    Once the .prpt bundle file is chosen, unzip it as a regular compressed archive
    and you will see the following files and folders included (some files and folders
    are optional and really depend on the complexity of the report):


    | Name | Description |

    |---|---|

    | datasources | Folder containing `compound-ds.xml` and one file for each data
    source. For example, `sql-ds.xml` containing a JDBC data source, `mondrian-ds.xml`
    an Mondrian data source, and so on. |

    | META-INF | Folder containing `manifest.xml`. The manifest file contains a reference
    to all the content files in the package. |

    | resources | Folder containing the resources like images, and so on, included
    in the report definition. |

    | subreport, ..., subreportN | Folders containing the defined subreports. One
    subfolder is created for each subreport, with the same content as the master report
    and a subset of files and folders included. |

    | content.xml | This file remains intentionally empty. It can be used to inject
    global templates later. |'
  merge: -1
  img_proc: true
- pgno: 518
