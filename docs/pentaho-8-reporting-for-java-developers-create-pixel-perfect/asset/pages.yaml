  md: '# Updating the pom.xml file


    The very first task to prepare the existing project is to change the pom.xml file.
    Opening pom.xml with an editor, you will see that all the Pentaho dependencies
    point to <version>8.0-SNAPSHOT</version>. Of course, nothing really changes if
    your project uses a different version.


    For all the Pentaho dependencies, update the version tags to the nightly build
    version. In our example, you will use <version>8.1-SNAPSHOT</version>. Again,
