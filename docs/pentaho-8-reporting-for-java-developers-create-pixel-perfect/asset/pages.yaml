- pgno: 461
  md: '# Formula datatypes


    Column data, as well as literal values, all get mapped to a formula datatype.
    The following datatypes are supported. Different types may inherit from one another.
    The *any* type indicates each one of the available types.


    | Name | Description |

    |------|-------------|

    | Array | Arrays may be declared in a formula, or generated by functions. You
    may specify one or two dimensional arrays with the following syntax: `{ROW1|ROW2|ROW3...}`.
    Also, a row may be broken into multiple columns by semicolons. Here is an example:
    `{1;2;3|4;5;6|7;8;9}`. |

    | Date | The date type inherits from the `Numeric` type. This type is represented
    as a `java.util.Date` object within Java, and represents the date portion of a
    complete date. |

    | DateTime | The date time type inherits from the `Numeric` type, as well as the
    date and time types. This type is represented as a `java.util.Date` object within
    Java. Functions such as `DATEVALUE()` are available to generate a `date` object.
    |

    | Error | Various formula functions may fail. When this occurs, an error is created.
    Certain functions are available to determine if an error has occurred. |

    | Logical | The `Logical` type inherits from the `Numeric` type. The values of
    this type are `Boolean`, either true or false. You may specify a logical value
    through the functions `TRUE()` and `FALSE()`. |

    | Numeric | A numeric value, represented in Java as a `BigDecimal` object. Literal
    values of this type may take the following forms: `123`, `123.456`, `123e10` or
    `456E-10`, and `-1.2`. |'
  merge: -1
  img_proc: true
- pgno: 462
  md: '|  |  |

    |---|---|

    | Text | A text value, represented in Java as a `String` object. Literal values
    of this type must be quoted with double quotes, as "Text Here". To place a double
    quote within a string, reference it twice, as " Here is a "" quote". |

    | Time | The time type inherits from the `Numeric` type. This type is represented
    as a `java.util.Date` object within Java and represents the `Time` portion of
    a complete date. |'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# Formula operators


    The following operators may be used within a formula expression. Note that all
    operators live in the formula editor as buttons, in the right panel immediately
    on top of the formula text area.


    | Name | Description |

    |---|---|

    | + | Adds two numbers together. |

    | - | Subtracts two numbers. |

    | * | Multiplies two numbers. |

    | / | Divides two numbers. |

    | ^ | Returns the first value powered to the second value. |

    | = | Returns true if both values are equal. |

    | <> | Returns true if values are not equal. |

    | < | Returns true if the first value is less than the second value. |

    | > | Returns true if the first value is greater than the second value. |'
  merge: -1
  img_proc: true
- pgno: 464
  md: '| <= | Returns true if the first value is less than or equal to the second
    value. |

    | >= | Returns true if the first value is larger than or equal to the second value.
    |

    | % | Divides a number by 100, converting it to percent. For instance, 100 percent
    will become 1. |

    | & | Concatenates two strings. |'
  merge: -1
