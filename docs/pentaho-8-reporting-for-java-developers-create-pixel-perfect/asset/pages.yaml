  md: '# Report parameterization


    Pentaho Reporting provides easy-to-use tools to parameterize a report, allowing
    users to specify ranges and other values to customize the output of a report.
    Parameter values can be selected from a list of hardcoded values or driven from
    a query. With parameterization, end users may control the amount of information
    that is displayed on a report. The following screenshot is an example of parameter
    input from within Pentaho''s business intelligence server:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_70_0.png)'
