- pgno: 327
  md: '# OpenERP data access


    The OpenERP data access is a data source for the famous Odoo ERP and CRM system
    (https://www.odoo.com). The interface is quite simple and lets you execute a standard
    search or a custom function, with the goal to extract data from the open source
    ERP.'
  merge: -1
