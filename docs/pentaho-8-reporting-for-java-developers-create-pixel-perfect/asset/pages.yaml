- pgno: 515
  md: '# The PRPT Format and the Java API to Build It


    This chapter is the first one entirely dedicated to the technical and advanced
    features of Pentaho Reporting. In the previous chapters of the book, you learnt
    everything about Pentaho Report Designer, and starting from here, you start to
    face the development using the Pentaho Reporting SDK.


    In this chapter, you will learn about Pentaho Reporting''s `.prpt` bundle file
    format, along with the details of Pentaho Reporting''s Java API. You will be introduced
    to the schemas of the various XML files that persist the data source, parameters,
    expressions, layout, and style of a report.


