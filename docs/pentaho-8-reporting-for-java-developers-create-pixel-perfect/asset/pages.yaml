- pgno: 568
  md: '# Using SQLReportDataFactory


    Once `ConnectionProvider` has been created, it''s now time to set up the `SQLReportDataFactory`
    instance. `SQLReportDataFactory` contains two constructors: the first constructor
    takes `ConnectionProvider`, and the second constructor takes an existing `connection`,
    which uses `StaticConnectionProvider` under the hood to provide the connection.


    In addition to configuring `ConnectionProvider`, you also must provide `SQLReportDataFactory`
    with queries to execute. Use the `setQuery` method to configure named queries:


    ```

    | void setQuery(final String name, final String queryString)

    ```


    The `setQuery` method takes in the name of the query and the SQL query itself.
    As mentioned earlier, the master reports in the examples in this chapter use the
    name `default` to reference the main query.


    To incorporate report parameters in the query, you may specify variables with
    the following format in your SQL: `${<PARAMETER NAME>}`. A `PreparedStatement`
    is generated, and these variables are parameterized appropriately via the JDBC
    specification, in order to avoid potential SQL injection attacks. In addition
    to traditional SQL statements, you may also make a call to a SQL stored procedure.
    These calls begin with the string `call`, and are recognized by `SQLReportDataFactory`,
    ensuring that the correct JDBC API method is executed.


    As mentioned earlier, the `QUERY_LIMIT` and `QUERY_TIMEOUT` parameters, made available
    to all `DataFactory` instances, also apply to `SQLReportDataFactory`. These values
    are passed on to the `Connection` object. Therefore, the underlying JDBC driver
    must also support these properties to have an effect.'
  merge: -1
  img_proc: true
