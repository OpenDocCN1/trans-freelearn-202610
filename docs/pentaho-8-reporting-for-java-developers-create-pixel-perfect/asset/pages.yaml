- pgno: 521
  md: '# Parameters


    Parameters are defined as children of the `data-definition/parameter-definition`
    elements. There are two types of parameters: plain parameters and list parameters.
    Plain parameters are represented in XML as a `plain-parameter` element. Plain
    parameters define the following attributes:


    | Name | Description |

    |---|---|

    | `default-value` | The default value of the parameter |

    | `mandatory` | If set to true, a value for this parameter is required before
    the report is rendered |

    | `name` | The parameter name |

    | `type` | The fully qualified Java type of the parameter |


    List parameters are represented in XML as a `list-parameter` element. In addition
    to sharing the same attributes as the plain parameter, list parameters also define
    the following attributes:


    | Name | Description |

    |---|---|

    | `query` | The query name providing the list of values to choose from. |

    | `allow-multi-selection` | If set to true, this attribute allows multiple selections
    of parameter values from the query results, creating an array of objects versus
    a single object. |'
  merge: -1
  img_proc: true
- pgno: 522
  md: '|  |  |

    |---|---|

    | `key-column` | The key column is returned as the result within a row that was
    selected. |

    | `mandatory` | If true, the parameter is mandatory. |

    | `strict-values` | If set to true, validation is done on the parameter value
    to determine if it is part of the query results. |

    | `value-column` | The value column is displayed as the selection when presenting
    data to the user. The `value-formula` attribute may be used in place of `value-column`.
    |

    | `value-formula` | The value formula is displayed as the selection when presenting
    data to the user. The `value-column` attribute may be used in place of `value-formula`.
    |


    Subreports define a different XML element hierarchy for their parameters. In the
    context of a subreport, a parameter is passed in from the master report''s context
    versus user or system input. Instead of using the `parameter-definition` element
    as a parent, subreports use a `parameter-mapping` element. Two subreport parameter
    types are defined: import and export. Their XML element tags are `import-parameter`
    and `export-parameter`. They both define the following two attributes:


    | Name | Description |

    |---|---|

    | `alias` | The alias of the parameter. For imported parameters, this is the name
    in the subreport. For exported parameters, this is the name in the master report.
    |

    | `name` | The name of the parameter. For imported parameters, this is the name
    in the master report. For exported parameters, this is the name in the subreport.
    |'
  merge: -1
