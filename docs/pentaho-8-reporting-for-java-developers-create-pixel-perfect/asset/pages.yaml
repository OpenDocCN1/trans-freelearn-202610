  md: '# XPathDataFactory


    The `org.pentaho.reporting.engine.classic.extensions.datasources.xpath.XPathDataFactory`
    class allows you to populate your report based on XML data, provided that it is
    formatted in a specific way. This `DataFactory` accepts XML formatted as rows
    and columns, where the **XPath** expression returns a list of row elements that
    contain column elements. Each column element''s node name represents the column
    name, and each column''s text data represents the column''s value. An example
    of a row supported by `XPathDataFactory` is: `<Row>

    <Column1>Row 1 Data In Column 1</Column1>

    <Column2>Row 1 Data In Column 2</Column2>

    </Row>`


    By default, the column values are typed as Java strings. `XPathDataFactory` provides
    a mechanism to specify certain Java data types, including the following:


    +   - `java.lang.String`

    +   - `java.sql.Date`

    +   - `java.math.BigDecimal`

    +   - `java.sql.Timestamp`

    +   - `java.lang.Integer`

    +   - `java.lang.Double`

    +   - `java.lang.Long`


    These types can be specified in the XML as either a preprocessor step or a comment:


    +   - **Preprocessor step:** `<?pentaho-dataset java.lang.Integer, java. lang.String?>`

    +   - **Root document comment:** `<!-- java.lang.Integer, java.lang.String -->`

    +   - **Root result set comment:** `<!-- java.lang.Integer, java.lang.String -->`


    The column types should appear in the same order as the elements in the first
    row. Beyond the first row, the order of columns is not relevant. The names of
    the columns will be used to place them in the correct position of the generated
    `TableModel`. Both the `java.sql.Date` and `java.sql.Timestamp` classes require
    a long numeric value corresponding to milliseconds since January 1, 1970, 00:00:00'
  merge: -1
  img_proc: true
