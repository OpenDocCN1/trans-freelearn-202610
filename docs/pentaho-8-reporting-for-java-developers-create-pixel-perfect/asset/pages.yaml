    following screenshot:


    Double-click on the picture in the Report Header band to access its configuration.
    Once clicked, the configuration panel will ask you the path to the image to include
    or the URL, if you''d prefer to use an image from the internet. In both cases,
    you could decide to link the image as external source or embed the'
