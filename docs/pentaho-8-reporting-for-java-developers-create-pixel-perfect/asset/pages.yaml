- pgno: 177
  md: '# Adding charts


    For the last (but not the least) customization to the report, let''s see how easy
    it is to add a chart. The ability to easily create charts in various formats is
    a great feature in Pentaho Reporting, and in our example, we are going to see
    how to add a chart summarizing the actual values per department.


    As you can expect, charts require a dataset to show data, and most of the time,
    their natural place is in the aggregation bands (usually Report Header, but also
    Group Header). In our example, we are going to add a bar chart in Report Header
    with some easy customizations. To add the bar chart, drag the chart icon () from
    the Report element palette and drop it in the Report Header band. Note that the
    chart is placed immediately under the title and its length is stretched to cover
    the width of the page:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_177_0.png)


    Once the chart is positioned in the Report Header band, double click on the chart
    element to access the editing panel. In the following image, you can see highlighted
    all the changes to do. As you can see, the changes are related only to three properties:
    the category-column property pointed to the DEPARTMENT query field, the value-column
    property pointed to the ACTUAL query field, and the show-legend property set to
    False.'
  merge: -1
  img_proc: true
