  md: '# Customizing the report header


    Now that the font is refined and closer to the idea of a professional report,
    let''s add a logo identifying the company and a title to be more meaningful in
    its printed version.


    The very first decision to take on each customization of your report is how to
    develop the layout. In this case, the decision is where to put the logo and the
    title. You could decide for the Page Header band, if you want to render the elements
    on each page, or you could use the Report Header band, if you prefer to see the
    logo and the title only at the beginning of your report. In this task, let''s
    choose the second option: putting the elements in the Report Header band.


    To prepare the header, we are going to change the background color and the default
    text color, selecting the Report Header item from the Structure tab in the Report
    Explorer. Changing the color is straightforward using the Style tab of the Element
    properties. More particularly, identify the text-color and bg-color properties
    and set them to white and #77b3d4 respectively. The following image shows what
    the two fields should look like:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_165_0.png)


    Now that the colors are correctly updated, let''s add the logo identifying the
    company. To add a picture to the report, drag the image icon from the Report Element
    palette and drop it into the Report Header band, as shown in the


