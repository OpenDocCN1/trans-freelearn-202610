- pgno: 81
  md: '# Pentaho Reporting architecture


    Pentaho Reporting Engine is mainly a Java class library, broken up into other
    Java projects, which are then combined to render reports. The library is optimized
    for performance and a small memory footprint, and can run completely in memory
    without generating temporary files or requiring extra compilation steps. The source
    code is available, under the terms of the GNU LGPL Version 2.1, in the GitHub
    repository https://github.com/pentaho/pentaho-reporting.


    The GitHub repository includes the Pentaho Report Designer, providing a graphical
    editor for report definitions and used as a standalone desktop reporting tool.
    In addition, there are also other related open source tools and projects in the
    Pentaho Reporting landscape, including the Report Engine Demo, Report Design Wizard,
    Report Designer, and the web-based ad hoc reporting user interface.


    The following is an introduction of the Java project defining the Pentaho Reporting
    Engine, with a focus on the libraries, the Reporting Engine core, and the Reporting
    Engine extensions.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Reporting Engine''s libraries


    The Pentaho Reporting Engine uses the following libraries to render reports:


    +   - **Flute:** This is a CSS 2 parser written in Java that implements SAC (https://www.w3.org/Style/CSS/SAC/).
    SAC is a standard event-based API for CSS parsers, closely modeled on the SAX
    API for XML parsers.

    +   - **LibBase:** This is the root library for all other Pentaho Reporting libraries.
    This library contains common capabilities, such as debug and error logging utilities,
    library configuration, along with library initialization APIs, for consistent
    startup and shutdown management of the Reporting Engine.

    +   - **LibDocBundle:** This abstracts the management of Pentaho Reporting file
    bundles, which are by default stored as ZIP files, and implements the ODF. This
    makes it simpler for other parts of the Reporting Engine to work with and manipulate
    Pentaho Reporting''s file formats.

    +   - **LibFonts:** This allows Pentaho Reporting to work with TrueType system
    fonts, extracting the necessary metadata from font types and populating an abstract
    interface to allow appropriate rendering in various contexts, including PDF and
    Excel views.

    +   - **LibFormat:** This is a string formatting library, which can render dates
    and numbers appropriately, based on format strings. This library is focused on
    memory and CPU efficiency for high performance report rendering.

    +   - **LibFormula:** This is a formula parsing and execution library based on
    the OpenFormula standard. You can learn more about OpenFormula by visiting http://wiki.oasis-open.org/office/About_OpenFormula.
    This library is similar in function to Excel-based formula definitions. LibFormula
    is a very general library and is used outside Pentaho Reporting in other projects
    that require OpenFormula style parsing and execution. LibFormula-UI is a formula
    editor for OpenFormula expressions based on LibFormula.

    +   - **LibLoader:** This manages the loading and caching of all necessary resources
    required for generating reports in a generic way, providing a simple API for other
    parts of the Reporting Engine that control static and dynamic content, including
    data sources and images.

    +   - **LibPensol:** This is an access layer for accessing a remote Pentaho solution
    repository via an Apache VFS filesystem. It handles all HTTP calls, the'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'parsing of the XML file, and all client-side state managements.


    +   - **LibPixie:** This is a WMF-file reading library, originally written by
    David R. Harris as converter for the Pixie-image viewer. Pixie was long time dead
    and has now been resurrected as WMF-reader and image producer for Java 1.2.2 or
    higher. Pixie lacks the support for most bitmap-formats, but everything else works
    fine.

    +   - **LibRepository:** This abstracts the input and output of hierarchical storage
    systems, such as file systems, that Pentaho Reporting interacts with. This makes
    it possible for a custom storage system, such as FTP, to be implemented and to
    be mapped to the API, giving Pentaho Reporting access to the system.

    +   - **LibSerializer:** This provides helper methods for serializing non-serializable
    objects. This is necessary so that the Reporting Engine can serialize standard
    Java classes that don''t implement Java''s serializable interface.

    +   - **LibSparkline:** This is a library developed to render sparkline graphs.
    Sparklines are small-scale bar or line charts that are inserted into text to provide
    visualized information along with the textual description.

    +   - **LibSwing:** This is a common helper class storage for design-time elements,
    so that they don''t have to move into the engine project, where they potentially
    bloat up the project due to third-party dependencies or a large amount of code.

    +   - **LibXml:** This provides utility classes for **Simple API for XML (SAX)**
    parsing and XML writing, based on Java''s **Java API for XML Parsing (JAXP)**
    API. This library assures the speedy loading and validation of Pentaho Reporting
    XML template files.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Reporting Engine core


    The Reporting Engine core project contains the main reporting algorithm for rendering
    reports, along with the necessary functionality to support styling. This project
    also contains the algorithms for rendering specific outputs, including PDF, Excel,
    CSV, XML, and more. The engine relies on the already mentioned libraries for managing
    the loading, parsing, formatting, rendering, and archiving of generated reports.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Reporting Engine extensions


    The Reporting Engine extensions project contains third-party extensions to the
    Reporting Engine, which are very useful, but increase dependencies. Extensions
    in this project include JavaScript expression support using the Rhino project,
    a hibernate data source factory, bar code support using Barbecue, sparkline support
    using the LibSparkline, along with additional JDK 1.4 support for configuration
    and printing. Additional extension projects exist that include charting and many
    of the data sources discussed in this book.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_85_0.png)


    *The following are some links to the quoted projects for further details:*

    Rhino: https://developer.mozilla.org/en-US/docs/Mozilla/Projects/Rhino

    Hibernate: http://hibernate.org

    Barbeque: http://barbecue.sourceforge.net'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Summary


    In this chapter, we introduced Pentaho Reporting and highlighted some typical
    uses, providing you with baseline ideas for implementing your own solutions. Typical
    uses for embedded reporting include operational, business intelligence, financial,
    and production reporting.


    We briefly described the unique history of Pentaho Reporting, from its JFreeReport
    roots, and also learned a great deal about the rich features included in the release
    8.0. Core features include a wide variety of data source integration, along with
    PDF, HTML, and Excel rendering. On the other hand, more advanced features include
    subreports and cross tab reports. Additionally, developer-oriented features, such
    as open Java APIs, along with the available source code and a business-friendly
    LGPL open source license, gives Pentaho Reporting a leg up on all other Java reporting
    toolkits.


    The architecture of Pentaho Reporting is also covered in this chapter, providing
    developers with a twenty thousand foot view of where they might be able to modify
    or contribute to the Pentaho Reporting Engine, along with giving them the ultimate
    flexibility of access to source code.


    You''ll soon be able to apply the rich feature set of Pentaho Reporting to your
    use case.


    In the following chapter, we''ll introduce you to Pentaho Reporting''s easy to
    use Report Designer and Java API, making it fun and easy to embed reporting into
    your Java application.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Getting Started with Report Designer


    After the introduction of Pentaho Reporting and an overview from twenty thousand
    feet, in this chapter, you will start with a practical hands-on session, learning
    how to run Pentaho Report Designer for the very first time. In addition, you will
    take your first steps in creating a report with your preferred layout, using some
    initial data as an example.


    You will begin by setting up an environment for building reports. From there,
    you will walk through some initial details of the user interface, like menus,
    toolbars, report element palettes, report canvas tab panels, report explorer,
    element properties, and messages. After learning more about the user interface,
    you will walk through the creation of a report from scratch. At this stage, you
    will be using the easy wizard available in Pentaho Report Designer, to make the
    session more practical, you will see how to save your report in the filesystem.
    This will be useful to store it safely for the following sessions, according to
    your needs and use cases. Along the way, you will receive the first details on
    building a report and getting data into it, along with generating a preview and
    iterating between design and preview, for the best result.


    This chapter is written as a tutorial for developers and information technologists.
    The best way to learn is to follow the instructions on your laptop while reading.
    At the end of this chapter, you will feel comfortable with the basics of building
    a Pentaho report. Later chapters will assume that your environment is configured
    appropriately and that you have retained the knowledge that you gained in this
    chapter, so read carefully and pay attention.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Prerequisites of your environment


    As described in Chapter 1, *Introduction to Pentaho Reporting*, Pentaho Reporting
    is a suite of open source tools, including Report Designer, Reporting Engine,
    and Reporting SDK. All the preceding tools are written in pure Java, allowing
    any operating system that supports the Java runtime environment to run the application.
    The latest version of Pentaho Reporting, the 8th, requires the use of JDK 8 or
    more recent version.


    Pentaho Reporting tools are cross-platform applications and will run in Linux,
    Windows, macOS, and other Java supported environments. The Reporting Engine is
    backward compatible with previous versions of JDK, but it is always recommended
    to use the latest one.


    As stated in the introduction, in this chapter we are going to focus our attention
    on Pentaho Report Designer. The discussion on Pentaho Reporting SDK will be covered
    in the next chapter. About Reporting Engine, it is used as core component in the
    designer and the SDK, so it will be treated during the description of the other
    two tools.


    Talking about the Pentaho Report Designer, the only prerequisite your environment
    should have onboard is obviously Sun''s JDK. To get started, visit http://java.sun.com
    and download the latest patch release of the Java SE development kit 8. Once downloaded,
    you can easily install it in your environment, mainly unzipping and setting few
    variables accordingly to your operating system. We won''t show more details here,
    because it is assumed it will be straightforward for you to find the most recent
    tutorial about this task by googling a little bit. To verify your installation,
    run `java -version` on the command line and, if correctly installed, you will
    see something similar to what is shown in the following screenshot:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_88_0.png)'
  merge: -1
  img_proc: true
- pgno: 89
  md: Now that everything is ready in your environment, let's move a step forward
    and install Pentaho Report Designer.
