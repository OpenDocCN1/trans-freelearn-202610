    the line filled in. Multiple areas may appear depending on the number of series
    provided. The area chart is useful for visualizing the differences between two
    or more sets of data. The area chart utilizes the category dataset (previously
    introduced), together with the common properties defined earlier. In the following
    description are listed all the differences in terms of available properties:


