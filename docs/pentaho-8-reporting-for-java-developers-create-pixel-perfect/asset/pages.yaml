  md: '# The bundled report preview


    Once a Pentaho report is accessed, the preview is possible using the default output
    format, defined in the report''s settings. According to the output format, the
    browser will either directly render the preview (for PDF and HTML, mainly) or
    download it locally (for Excel, CSV, RTF, and plain text).


