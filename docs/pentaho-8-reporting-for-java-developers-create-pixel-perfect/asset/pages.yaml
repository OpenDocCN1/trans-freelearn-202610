- pgno: 562
  md: '# TableDataFactory


    The `org.pentaho.reporting.engine.classic.core.TableDataFactory` class is the
    simplest form of `DataFactory` for loading data into the Pentaho Reporting Engine.

    `TableDataFactory` manages a set of existing `TableModel` instances and makes
    them available to the reporting engine.


    To construct `TableDataFactory`, you can either use the default constructor or
    the following convenience constructor: public TableDataFactory(final String name,
    final TableModel tableModel);


    This convenience constructor adds a `TableModel` instance with a particular name
    to the list of `TableModel` instances that `TableDataFactory` is aware of. The
    other method for adding the `TableModel` instances to `TableDataFactory` is via
    the following API call: public void addTable(final String name, final TableModel
    tableModel);


    The `addTable` method adds an additional table to the list of named `TableModel`
    instances, which are maintained by `TableDataFactory`: While there is no `DataFactory`
    CSV defined, a helper class named `CSVTableModelProducer` is available, which
    is located in the `org.pentaho.reporting.engine.classic.core.modules.misc.tablemodel`
    package. This `CSVTableModelProducer` class will generate another class, `CSVTableModel`,
    which you could then add to `TableDataFactory`.'
