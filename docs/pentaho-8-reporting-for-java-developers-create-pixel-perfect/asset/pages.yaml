  md: '# Compiling and running the project


    Now that your Java project is updated to the newest Pentaho Reporting version,
    and the local Apache Maven repository contains the available nightly build, you
    can build it as usual, running the `mvn clean package` command from a Terminal.
    Using this workaround, you will be able to try the very last version of Pentaho
    Reporting in its nightly build containing the latest enhancements and features.'
