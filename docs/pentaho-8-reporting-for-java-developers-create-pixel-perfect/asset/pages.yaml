    an existing Pentaho report. To create a connection with what you have learnt till
    now, the Pentaho report developed in the last chapter, using the Report Designer
    Wizard, will be used as an example.


    This chapter is highly technical and written as a tutorial for pure Java developers.
    If you are an information technologist with not much knowledge in development,
    feel free to skip this read, even if it''s a relevant part of the Pentaho Reporting
    tools. The best way to learn is to follow the instructions on your laptop while
    reading. At the end of this chapter, you will feel comfortable with the basics
    of embedding a Pentaho report into an existing Java web application. Later chapters
