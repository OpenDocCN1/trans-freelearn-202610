- pgno: 615
  md: '# Interactive reports in HTML


    With Pentaho Reporting, it is possible to define highly customized interactive
    reports in the HTML/JavaScript environment. Pentaho Reporting defines a set of
    properties which, when specified, allow for rich interactivity between the user
    and the report. In this section, you will get an overview of these properties,
    along with a rich example that demonstrates potential uses.


    In Chapter 5, *Design and Layout in Report Designer*, you have already learnt
    everything about the HTML properties, but here we would like to again share the
    details of the properties for better understanding:


    | Name | Description |

    |------|-------------|

    | `class` | This property sets the `class` attribute of the current HTML entity
    to the specified value. |

    | `name` | This property sets the `name` attribute of the current HTML entity
    to the specified value. |

    | `title` | This property sets the `title` attribute of the current HTML entity
    to the specified value. |

    | `xml-id` | This property allows the naming of the current HTML entity, setting
    the `id` attribute, making it possible to reference in outside scripts. |

    | `append-body` | This property allows the placement of raw HTML in the body of
    the HTML document, prior to the rendering of the current element. |

    | `append-body-` | This property allows the placement of raw HTML in the body
    of the HTML |'
  merge: -1
  img_proc: true
- pgno: 616
  md: '| Property | Description |

    |---|---|

    | footer | document, after the rendering of the current element. |

    | append-header | Defined only at the master report level, this property allows
    the inclusion of raw HTML in the header of the generated HTML document. This location
    is traditionally used to load additional CSS files, as well as external JavaScript
    files. |

    | on-click | This property renders an `onclick` HTML attribute on the currently
    defined element. It is a string of JavaScript that is executed in the browser
    when a user clicks on the element. |

    | on-double-click | This property renders an `ondblclick` HTML attribute on the
    currently defined element. It is a string of JavaScript that is executed in the
    browser when a user double-clicks on the element. |

    | on-mouse-down | This property renders an `onmousedown` HTML attribute on the
    currently defined element. It is a string of JavaScript that is executed in the
    browser when a user presses a mouse button. This can be used to detect the beginning
    of a drag operation. |

    | on-mouse-up | This property renders an `onmouseup` HTML attribute on the currently
    defined element. It is a string of JavaScript that is executed in the browser
    when a user releases a mouse button. |

    | on-mouse-move | This property renders an `onmousemove` HTML attribute on the
    currently defined element. It is a string of JavaScript that is executed in the
    browser when a user moves the mouse. |

    | on-mouse-over | This property renders an `onmouseover` HTML attribute on the
    currently defined element. It is a string of JavaScript that is executed in the
    browser when a user moves the mouse over the element. |'
  merge: -1
  img_proc: true
- pgno: 617
  md: '| on-key-down | This property renders an `onkeydown` HTML attribute on the
    currently defined element. It is a string of JavaScript that is executed in the
