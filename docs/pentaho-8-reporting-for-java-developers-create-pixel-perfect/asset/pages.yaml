  md: '# Using Reports in Pentaho Data Integration


    Having introduced the Pentaho Business Analytics Platform in Chapter 15, *Using
    Reports in Pentaho Business Analytics Platform*, in this chapter you will learn
    how to use Pentaho reports in Pentaho Data Integration, also known as Kettle.
    This will deliver powerful ETL capabilities.


    In this chapter, you will be introduced to the basics of the Pentaho Data Integration
    and ETL tools in general, and be provided with a description of how to install
    them and use Pentaho reports as an output task. As usual, in this chapter you
    will see a working example in action. The goal is always the same: to learn by
    examples.


    This chapter is written as a tutorial for developers and information technologists.
    The best way to learn is to follow the instructions on your laptop while reading.
    By the end of this chapter, you will feel comfortable with the basics of using
    the Pentaho Data Integration (also known as Kettle) together with Pentaho reports.
    This will be extremely useful for your future projects, enabling you to a fully
    featured ETL tool.'
  merge: -1
