- pgno: 675
  md: '# The Pentaho Reporting output step


    The Pentaho Reporting Output step is the only Data Integration task completely
    dedicated to Pentaho Reporting. Being a step, it lives in transformations and
    it''s grouped in the output steps.


    The main goal of the step is to generate a Pentaho report, starting from a `.prpt`
    file stored locally on the filesystem. As a regular step, it accepts a stream
    of data as input and performs the task for each row of the flow. Pentaho Reporting
    output steps can be customized directly from the Spoon interface, by right-clicking
    on it and selecting the Edit item.


    In the following screenshot, you can see how the edit window looks in the Spoon
    interface:


