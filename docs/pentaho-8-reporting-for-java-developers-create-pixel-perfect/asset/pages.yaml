- pgno: 415
  md: '# Report parameterization


    Report parameterization allows the end users to customize results of Pentaho reports,
    by entering values that limit report datasets or trigger rendering decisions.
    Report parameterization is also useful to develop user filtering through the user
    interface.


    In the following sections, you are going to see how to use the report parameterization,
    get acquainted with all the different types of report parameters, and learn how
    to create and use them, using the Pentaho Report Designer. During the description
    of the creation and use of report parameters, a practical example about a report
    filter will be presented.'
  merge: -1
  img_proc: true
- pgno: 416
  md: "# Using report parameters\n\nAs presented in Chapter 6, *Configuring JDBC and\
    \ Other Data Sources*, there are many different options for providing data to\
    \ Pentaho Reporting. All of them are grouped under the name *data sources* and\
    \ each different type of data source has its own features, syntax, and reasons\
    \ to be used.\n\nBecause of the different syntax and features, each data source\
    \ type uses its underlying method for parameterizing queries. For instance, the\
    \ default syntax for XPath, Kettle, and MDX are supported through their respective\
    \ `DataFactory` implementations. Each data source query syntax defines how to\
    \ specify parameters, and Pentaho Reporting provides those parameters via the\
    \ `DataRow` API. The two exceptions from the default management of parameters\
    \ include SQL and static data. When specifying a SQL statement in JDBC, you would\
    \ normally specify a question mark to denote which parameters should be specified.\n\
    \nPentaho Reporting requires that you specify the parameters by name, so some\
    \ parsing is done on the SQL query before passing the query to JDBC. You may specify\
    \ parameters as `${PARAM}`, and `SQLReportDataFactory` will replace each named\
    \ parameter with a question mark (?) before making the prepared JDBC call. `NamedStaticDataFactory`\
    \ allows for Java class methods with parameters to be executed. The names provided\
    \ when configuring `DataFactory` are used when resolving the values from provided\
    \ `DataRow`.\n\nThe following is an example of a SQL query containing one parameter\
    \ named `productLine`, which filters the products' line on the `PRODUCTS` table\
    \ of the `SampleData` schema:\n\n```\n```\nSELECT\n  *\nFROM\n  PRODUCTS\nWHERE\n\
    \  PRODUCTLINE = ${productLine}\n```\n```\n\n*Be aware that the parameters are\
    \ defined together with a collection of properties (you will see this better in\
    \ the following sections).*"
  merge: -1
  img_proc: true
- pgno: 417
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_417_0.png)


    This means that the automatic replacement of the parameter''s value really depends
    on those properties, and this should be considered during the development of the
    query string. If not done so, the query could fail; for example, a multi-value
    parameter is provided where a SQL command defines a single value WHERE condition.'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# The available report parameter types


    Pentaho Reporting provides a rich collection of different parameters, which each
    render differently within Pentaho Report Designer or any other frontend tool (you
    will see an example in Chapter 15, *Using Reports in Pentaho Business Analytics
    Platform*). The following list shares all the parameter types available in Pentaho
    Reporting 8.0:


    +   - **Drop-down**: Defining a typical drop-down list and allowing a single value
    selection

    +   - **Single value list**: Defining a panel containing the list of values and
    allowing a single value selection

    +   - **Multi-value list**: Defining a panel containing the list of values and
    allowing multiple selections

    +   - **Radio button**: Defining a panel containing the list of values and allowing
    a single value selection in radio button style

    +   - **Checkbox**: Defining a panel containing the list of values and allowing
    selections in check button style

    +   - **Single selection button**: Defining a panel containing the list of buttons
    (one for each value) and allowing a single selection

    +   - **Multi-selection button**: Defining a panel containing the list of buttons
    (one for each value) and allowing multiple selections

    +   - **Textbox**: Defining a text field

    +   - **Text area**: Defining a text area field

    +   - **Date picker**: Defining a user friendly interface picking a single date/time
    value


    When embedding Pentaho Reporting into a custom application, it is the embedded
    program''s responsibility to render parameters, as demonstrated in the following
    example. All parameter types may specify a data source for population of possible
    selections, as well as for validation. It is possible to nest parameters by parameterizing
    the data sources, which are used to populate selections. For example, a top level
    drop-down parameter, such as country, could drive a secondary radio button parameter,
    such as region. Queries are executed in the order in which they appear in the
    data source list.'
  merge: -1
  img_proc: true
- pgno: 419
