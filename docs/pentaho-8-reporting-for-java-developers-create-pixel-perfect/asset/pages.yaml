  md: '# XY bar chart, XY line chart, and XY area chart


    The XY bar, XY line, and XY area charts graph an XY series dataset as a bar, a
    line, or an area chart. These chart types utilize the common properties defined
    earlier, including the XY series dataset properties as default. As alternative
    datasets, you can also decide to use the XYZ series dataset or the times series
    dataset. You can change the dataset using the drop-down menu in the upper part
    of the Primary DataSource tab.


    Concerning the available properties for the XY bar chart, in the following description
    are listed all the differences from the common list introduced in the beginning
    of the chapter:


    +   - The title set has the same properties as described for the bubble chart
    (the title common set and `pos-title` in addition)

    +   - The options set has the same properties as described for the bar chart,
    excluding `max-bar-width`

    +   - The general set has the same properties as described for the bar chart,
    excluding `gridlines`

    +   - The shadow set has the same properties as described for the bar chart, excluding
    `shadow-color`

    +   - The *X* axis set is composed of different properties, as follows:


    | Name | Type | Description |

    |---|---|---|

    | `x-axis-title` | String | Sets the title for the domain axis, if it exists.
    In a typical 2D horizontal chart, this is the categorical or x axis. |

    | `x-font` | String | Sets the font for the range axis title. |

    |  |  |  |'
