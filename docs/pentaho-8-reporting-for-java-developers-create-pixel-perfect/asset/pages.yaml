    | `IMetadataDomainRepository getMetadataDomainRepository(`

    `String domain,`

    `ResourceManager resourceManager,`

    `ResourceKey contextKey,`

    `String xmiFile)` | Returns a metadata repository based on the domain id and XMI
    file |'
