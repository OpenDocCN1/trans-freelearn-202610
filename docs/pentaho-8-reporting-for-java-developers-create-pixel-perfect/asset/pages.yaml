- pgno: 636
  md: '# Basics of the Business Analytics Platform


    By default, by accessing the home page of a Pentaho Business Analytics Platform
    installation, you have access to the Pentaho user console. The Pentaho user console
    serves as the portal for you to access Pentaho tools and features. Home contains
    easy access buttons, so that you can browse files, create new reports and dashboards,
    view Pentaho documentation, and quickly open recently viewed or favorite files.


    In this book, you will not see all the available features of the Business Analytics
    Platform. However, what we would like to bring to your attention is the Browse
    Files button, where you can open a window to locate your files using the browsing
    and files panes, and manage them using the action pane. In the following screenshot,
    you can see what the Browse Files panel looks likes:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_636_0.png)


    The Browse Files page gives you access to the Pentaho repository based on an embedded
    Apache Jackrabbit ([http://jackrabbit.apache.org/](http://jackrabbit.apache.org/))
    instance, an open source content repository for the Java platform. The Pentaho
    repository is really relevant for our purpose, because it enables the users to
    store all the reports,'
