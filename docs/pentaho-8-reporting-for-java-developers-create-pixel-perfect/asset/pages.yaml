- pgno: 566
  md: '# DriverConnectionProvider


    The second implementation of `ConnectionProvider` is the `DriverConnectionProvider`
    class, which allows you to easily configure a connection. `DriverConnectionProvider`
    has a default constructor, and must be configured via setter methods. In the following
    table, some of the most relevant methods are introduced:


    | Method | Description |

    |---|---|

    | `void setDriver(

    String driver)` | The `setDriver` method''s driver value should be set to the
    fully qualified name of the driver class used in JDBC. |

    | `void setUrl(

    String url);` | The `setUrl` method''s URL value should be set to the JDBC URL
    for connecting to a database. |

    | `void setProperty(

    String name,

    String value);` | The `setProperty` method adds an additional property to the
    JDBC configuration properties. Properties such as `user` and `password` are often
    passed in through the properties list for a new connection to be generated via
    `java.sql.DriverManager`. |


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_566_0.png)


    *Be aware that by using `DriverConnectionProvider`, you will create a new connection
    to the underlying database every time the `createConnection` method is called
    on the API. This is not good or bad, but it''s something you should be aware of
    during your development.*'
  merge: -1
  img_proc: true
- pgno: 567
  md: '# JndiConnectionProvider


    The third available `ConnectionProvider` is `JndiConnectionProvider`. `JndiConnectionProvider`
    uses **Java''s Naming and Directory Interface (JNDI)** to obtain a connection
    to a database. It has a default constructor, along with the following setter methods,
    that may be configured to connect to a JNDI data source. Only the connection path
    property is mandatory.


    In the following table, some of the most relevant methods are introduced:


    | Method | Description |

    |---|---|

    | `void setConnectionPath(String connectionPath)` | The `setConnectionPath` method
    should be set to the full JNDI path of your JDBC data source |

    | `void setUsername(String username)` | The `setUsername` method is an optional
    field, which may be required when connecting to your data source |

    | `void setPassword(String password)` | The `setPassword` method is an optional
    field, which may be required when connecting to your data source |


    JNDI is available in many application servers. It may also be used in a regular
    Java application with the help of simple JNDI, available at http://www.osjava.org/simple-jndi.
    The following list shows the examples of JNDI connection strings in different
    environments, assuming that you''ve already configured the JNDI data sources in
