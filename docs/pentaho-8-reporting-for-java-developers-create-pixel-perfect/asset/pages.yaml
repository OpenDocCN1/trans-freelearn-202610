- pgno: 387
  md: '# Bubble chart


    The bubble chart allows you to view three dimensions of data. The first two dimensions
    are your traditional x and y dimensions, also known as domain and range. The third
    dimension is expressed by the size of the individual bubbles rendered. The bubble
    chart utilizes the common properties defined previously, including the XYZ series
    dataset properties. In the following description are listed all the differences
    in terms of available properties:


    +   - The title set of properties is provided with one additional property:

    +   - The options set of properties is provided with some of the properties previously
    introduced: `horizontal`, `series-color`, and `label-font`. In addition, there
    is the `max-bubble-size` property (decimal) defining the preferred maximum bubble
    size, as a percentage of the bubble value represented. Possible values are integers
    between 1 and 100.

    +   - The general set has the same properties as described for the pie chart (the
    general common set, and `shadow-paint`, `shadow-x-offset`, `shadow-y-offset`,
    `url-formula`, and `tooltip-formula` in addition).

    +   - The *X* axis and *y* axis sets are also provided here with the same properties
    as described for the bar chart.

    +   - The values set has a subset of the properties described for the bar chart
    (particularly: `show-item-labels`, `item-label-font`, `url-formula`, and `tooltip-formula`).

    +   - The legend set has the same properties as described for the pie chart (the
    legend common set and `legend-label-format` in addition).


    | Name | Type | Description |

    |------|------|-------------|

    | `pos-title` | Selection | Sets the position to display the chart title. Possible
    values are: north, west, south, east, top, left, bottom, and right |'
  merge: -1
  img_proc: true
