    in the Size & Border... group of the Style tab in the report element explorer:


    | Name | Type | Description |

    |------|------|-------------|

    | layout | Selection | This is for bands only and defines how elements within
    the band are rendered.


    - The default layout is `canvas`, which allows you to specify exactly where each
    report element in the band should render.

    - The `block` layout stacks all the items in a band from top to bottom.

    - The `inline` layout stacks all the items left to right, with wrapping.

    - The `row` layout displays all the report elements in a |'
