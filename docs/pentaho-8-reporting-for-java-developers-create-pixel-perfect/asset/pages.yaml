  img_proc: true
- pgno: 68
  md: '# Pixel accurate rich formatting


    Reports defined in Pentaho Reporting can specify at the pixel level where objects
    such as text or images should render. Using Pentaho Report Designer, it is easy
    to align fields and group items that need to stay aligned. While not always possible
    due to different format types, such as XML, CSV, and plain text, the three main
    graphical outputs, HTML, PDF, and Excel, strive to look as similar as possible.


    Rich formatting includes the TrueType system font selection, the ability to render
    geometrical shapes and lines, along with the ability to include images and other
    objects in a report. This rich formatting is specified under the covers through
    styles similar to CSS, separating out the format from the report detail. This
    makes it easier to modify and maintain reports, and also to apply corporate styles
    through the report wizard, as shown in the following image:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_68_0.png)'
  merge: -1
  img_proc: true
