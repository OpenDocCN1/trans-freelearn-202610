- pgno: 651
  md: '# Creating a dashboard with Pentaho reports


    In Chapter 14, *Building Interactive Reports*, we discussed limiting the advanced
    interaction between reports to avoid failing projects. When interactions between
    visual elements become complex, the dashboards are probably the suggested solution.
    In the Pentaho suite, the right place to develop dashboards is the Business Analytics
    Platform, with the support of the CTools. CTools is a set of tools and components
    created to help you build custom dashboards on top of Pentaho. There are specific
    CTools for different purposes, but we will only introduce them as an example,
    considering they need an entire book to describe all the possibilities and nice
    features. Our goal in this section is to show an example of a dashboard, using
    the Pentaho reports as elements.'
  merge: -1
  img_proc: true
- pgno: 652
  md: '# Community dashboard editor basics


    A core part of the CTools, the **Community Dashboard Editor** (**CDE**), is included
    in the Pentaho user console as a graphical tool for creating, editing, and previewing
    Pentaho dashboards. CDE allows the development and deployment of Pentaho advanced
    dashboards. It''s a very powerful and complete tool, combining frontend with data
    sources and custom components in a seamless way.


    The development of a CDE dashboard is based on a three layer definition. All together,
    the three layers define the final version of the dashboard. The three layers are:
    the layout layer, the component layer, and the data source layer.


    A dashboard layout layer can be created by a simple combination of rows and columns,
    along with some HTML blocks and possibly some images. In the layout perspective,
    you may also provide some look and feel properties. For example, you can set up
    a background color for a certain element and choose a style for the corners of
    rows and columns.


    Components are the central elements of a dashboard and they are managed in the
    component layer. The component layer can be defined in a component perspective
    of the user interface, where you can find all the available components you can
    choose to include in your Pentaho report.


    As you learnt for the reports, the dashboards can also be populated by a variety
    of different sources. In the data sources perspective, you can set up the origin
    of the data that will be used to populate your dashboard. Basically, you have
    to specify where the data comes from and what it looks like.


    The creation of a brand new CDE dashboard is straightforward, directly from the
    Pentaho user console using the File | New | CDE Dashboard item. In the following
    screenshot, you can see the editing panel of a CDE dashboard, with the three perspective
    icons on the top right:'
  merge: -1
  img_proc: true
