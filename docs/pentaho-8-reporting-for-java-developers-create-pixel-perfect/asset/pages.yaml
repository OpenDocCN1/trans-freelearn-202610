- pgno: 490
  md: '# Managing resource bundles


    To complete the topic about resources for localization, let''s give some color
    to the practical use and impact of the i18n management (where 18 stands for the
    number of letters between the first i and the last n in the word internationalization).


    As described in the Java''s i18n tutorial on resource bundles, the correct key/value
    pair to be used in a report is defined by the resource bundle, followed by the
    language code and the country code. For example, the `translations_en_GB.properties`
    file contains the resource key reference for English (en) in Great Britain (GB).
    You can define generic resource bundles for a specific language and all the countries
    (in our example, `translations_en.properties`) or all the languages and countries
    (in our example, `translations.properties`).


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_490_0.png)


    > *It is highly recommended to define a default resource bundle for all the languages
    and countries (in our example, `translations.properties`). Then, you can optionally
    add more resource bundles, specifically for languages and countries. However,
    be aware that the key/value pairs should be replicated into every resource bundle,
    otherwise a partial localization will appear to the final user.*


    Last but not the least, you can localize a Pentaho Report by using external property
    files. This enables you to share property files among multiple `.prpt` reports.
    To use external message bundles (the `.properties` files), define the key/value
    pairs as described previously, but place the bundles on the class path for the
    Reporting Engine. If you are in Pentaho Report Designer, add the files to the
    `/resources` directory. For them to be recognized in the Pentaho Analytics Platform,
    put the files in the `pentaho/WEB-INF/classes` directory.'
  merge: -1
  img_proc: true
- pgno: 491
  md: '# Testing the localization


    After the correct setup of the localization of your Pentaho report, you may want
    to test it in all the possible languages and countries (in one word, called locale).
    To achieve that goal, Pentaho Report Designer can be configured to be used with
    one locale instead of another.


    Starting from the Report Designer user interface, you can access the Pentaho Report
    Designer settings from the upper menu, in File | Configuration.... Once selected,
    the report configuration is shown as in the following screenshot.


    In the `core-module` settings, you can recognize the `.environment.designtime.Locale`
    property, not defined with a default value. To set up the requested locale, check
    the property and fill the text field on the right, that will become editable.
    Then click the OK button and refresh the report to make the configuration active.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_491_0.png)'
  merge: -1
  img_proc: true
- pgno: 492
  md: '# An example of report localization


    To see how the localization works in practice, let''s develop an example of localized
    Pentaho Report that you can use in your future tasks. The idea is to reuse a previous
    example, replacing some static labels with `resource-label`, and see how the report
    looks in a couple of different languages (we will use English and Spanish as examples).


    For this purpose, let''s reuse `report_02.prpt` we saw in Chapter 4, *Creating
    a Report with Report Designer*. If you followed the suggestion, you should have
    the report saved in your `my_report` folder in your development environment. If
    not, you can download it from the https://github.com/fcorti/pentaho-8-reporting-for-java-developers
    repository, from the `Chapter 04 - Creating a report with Report Designer/my_reports`
    path.


    Once the report is opened in the Report Designer, select the `label: Actuals per
    position title` element in the Structure tab of the report explorer (you can find
    it under Master Report | Report Header). To replace the label with a `resource-label`
    element, let''s click the Format | Morph | resource-label item from the upper
    menu. This feature will transform the type of element, maintaining the same common
    properties. To complete the task, let''s set the `value` property (in the common
    set) with `report.title`.


    In exactly the same way (using the morph feature), change the three labels under
    Master Report | Group: DEPARTMENT | Details Body | Details Header. In case of
    the position title''s header, set the `value` property to `header.positiontitle`.
    In case of the actual header, set the `value` property to `header.actual`. In
    case of the budget''s header, set the `value` property to `header.budget`.


    Now that the report is correctly updated, it''s time to set up the resource bundles
    with the correct key/value pairs. To set up the resources, select File | Resources...,
    and then select `translations.properties` and click on the Edit button. Once done,
    fill the property file with the default values (in our case, in English), described
    as follows: report.title = Actuals per position title

    header.positiontitle = Position title'
