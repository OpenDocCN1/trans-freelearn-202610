- pgno: 305
  md: '# The MongoDB data source


    The MongoDB data source lets you natively connect to the famous NoSQL database.
    To do this, you must already have MongoDB database connection information, such
    as host name(s), port number(s), and authentication credentials.


    > *MongoDB (from humongous) is a free and open source cross-platform document-oriented
    database program. Classified as a NoSQL database program, MongoDB uses JSON-like
    documents with schema, stored as content.*


    Once selected, this data source type shows a modal window with two panels: the
    query list panel on the left and the query details panel on the right. The query
    list panel is similar to the one introduced for the JDBC data source, where you
    can see the icons to add queries (⊕) and delete queries (⊖). Clicking on the green
    plus (⊕) icon, a new Query 1 is added to the available ones, as shown in the following


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_305_0.png)


    screenshot:


    Once a query is selected (or a new one is created), the right panel shows the
    Name field, where you can change the meaningful label for the query and below
    a set of four tabs to set up the connection to the MongoDB source. Configure connection
    is the first one where some settings are required. Enter the hostname and port
    number for your MongoDB database. You can also specify a different port number
    for each hostname by separating the hostname and port number'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'with a colon and separating each combination of hostname and port number with
    a comma, like `<ip1>:<port1>,<ip2>:<port2>`.


    Check Use all replica set members if you want MongoDB to automatically sense and
    attempt to connect to available hosts, even if one is down. Type the credentials
    needed to access the MongoDB database in the User field and the Password field.
    Check Authenticate using Kerberos if you are using this protocol.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_306_0.png)


    > Kerberos is a computer network authentication protocol that works on of tickets
