- pgno: 505
  md: '# Table of contents and index elements


    There are two special types of subreports not explained yet: table of contents
    and index. The **table of content (TOC)** feature allows you to generate a TOC
    based on the groups you have mapped inside the report or to specify the subreports
    you want included in your TOC. The index feature allows you to generate an index
    based on the fields (or groups) in your report. When the index is generated, it
    displays the instances and page numbers in which the field name appears.'
  merge: -1
  img_proc: true
- pgno: 506
  md: '# Example of index


    As an example, let''s see how to include the index to an existing report, of course
    assuming the report is big, defined by a lot of pages (otherwise, the index doesn''t
    make a lot of sense). The report used to add the index is a basic report, built
    on a JDBC data source with the following query:


    ```

    SELECT

    "PUBLIC"."ORDERFACT"."ORDERDATE",

    "PUBLIC"."ORDERFACT"."ORDERNUMBER",

    "PUBLIC"."CUSTOMERS"."CUSTOMERNAME",

    "PUBLIC"."ORDERFACT"."TOTALPRICE"

    FROM

    "PUBLIC"."CUSTOMERS" INNER JOIN "PUBLIC"."ORDERFACT" ON "PUBLIC"."CUSTOMERS"."CUSTOMER

    ORDER BY

    "PUBLIC"."ORDERFACT"."ORDERDATE" ASC

    ```


    Talking about the layout, the Details band defined for the basic report is developed
    as shown in the following screenshot:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_506_0.png)


    Previewing the report by using the eye icon (👁) in the report canvas, you can
    see that it is defined by 97 pages. The goal of this example is to add an index
    at the end of the report, referring to all the customers.


    To add the index, drag the index icon (📄) from the report palette and drop it
    into the Report Footer band. Once dropped, the same question that you saw for
    the subreport will be raised: do you want to define an inline-subreport or a banded-subreport?
    In case of index and TOC, the use of a banded subreport is suggested, as it will
    use 100 percent of the report page width.


    Once selected, point to the element properties panel and set the data-field property
    in the index to CUSTOMERNAME. This instructs Report Designer to build the index
    on the customer name. When you double-click on the index element, another tab,
    containing the index subreport, will open. Here, exactly as you saw for subreports,
    you have a fully featured layout with only one specific difference in the data
    source.'
  merge: -1
  img_proc: true
