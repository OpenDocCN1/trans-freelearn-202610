- pgno: 292
  md: '# Introducing data sources


    We have already introduced the importance of data sources in report development.
    Indeed, data sources are the very first step in report development, using both
    the Report Designer and the Pentaho Reporting SDK. In short, data sources are
    used by Pentaho Reporting to define the dataset available in a report, using a
    table representation made of fields and rows. Each field is defined by a name
    and a type (that is, string, integer, and so on), and a row is a collection of
    values related to the fields. Fields and rows are the real content of a Pentaho
    report and they can be used for viewing results, making charts, calculating formulas,
    the definition of parameters and user inputs, and a lot of other things.


    Even if the result of a data source is always a table, the types of sources can
    vary significantly. We can have relational DBMSs, NoSQL databases, different engines
    (like OLAP, Pentaho Data Integration, and so on), or even different formats of
    static data structures like XML, metadata, and others. In the following section,
    you will learn where your data sources can be managed, using the Pentaho Report
    Designer.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Datasets in report explorer


    Starting from the Report Designer user interface, you should already be confident
    with report explorer (you can find it in the top right panel). Report explorer
    is composed of two different tabs: Structure and Data. You used the Structure
    tab a lot in Chapter 5, *Design and Layout in Report Designer*, but now it''s
    the first time you will see the Data tab. As an initial introduction, the Data
    tab is where all the data sources live, together with some other types of objects.


    Looking at the Data tab content, you can see a `Data Sets` item listing all the
    defined data sources for the report. In an empty report, the `Data Sets` item
    has no children, but in every working report, it has at least one child. The following
    screenshot shows what the report explorer looks like with two data sources


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_293_0.png)


    defined:


    As you can see, each data source is identified with a unique name (`Query 1` and
    `Query 2` in the example) and each data source contains a list of fields. Even
    if a report has more than one data source, only one is selected to be used for
    detail (in this example, `Query 1`). Only the selected data source shows the list
    of available fields. All the other data sources are used for different purposes:
    for the listing of parameter values, query in subreports, and so on.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_293_1.png)


    *In case you have more than one data source, right-click on one of them directly
    in the report explorer panel and click on Select Query. This will enable the data
    source to be used in the details of the current report.*


    Each field of a data source has a name and a type. The name of a field is nothing
    more and nothing less than a meaningful label. The type of a field is a Java type,'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'like string, integer, long, date, timestamp, and others. You will see that
    the field''s type will help you during the report development, to set up the format
    and grouping, and everything is directly connected to presentation. Starting from
    this panel, you can drag a field and drop it directly into the preferred place
    in the bands of your report.


    Coming back to the data source topic, you can create a new data source by right
    clicking on the `Data Sets` item and choosing the preferred type. Alternatively,
    you can click on the database icon ( ) in report explorer or use the upper menu
    choosing the Data | Add Datasource item. In the following sections you will see,
    one by one, how to create (and manage) all the different available data sources.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# The JDBC data source


    The first type of data source in the list, and the most used one, is the JDBC
    data source. JDBC is an API for the Java language, which defines how a client
    may access a database. It provides methods to query (and update) data in a database
    and is oriented towards relational databases. See https://en.wikipedia.org/wiki/Java_Database_Connectivity
    for further details.


    Once selected, a modal window, similar to the following one, appears:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_295_0.png)


    The window contains two main sections: the connections (on the left) and the queries
    (on the right). The next two sections will introduce all the features for both
    the panels.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Adding or editing a JDBC connection


    Even if the connection panel contains some SampleData connections, you can see
    here how to add a new one or how to edit an existing one. In the connection panel
    of the window, you can see:


    +   - A pencil icon (✏️) used to edit an existing connection

    +   - A green plus icon (⊕) used to add a new connection to the list of the available
    ones

    +   - A red icon (🗑️) used to delete an existing connection


    In addition, if you want to provide parameters that contain different authentication
    credentials for the connections, click the Edit Security button in the upper-left
    corner of the window and then type in the fields or variables that contain the
    user credentials you want to store as a parameter. A username and password will
    be available as security parameters when you are creating your report.


    The user experience for adding or editing a JDBC connection is mainly the same;
    a new modal window similar to the following one is shown, containing all the requested
    fields and parameters to connect to a relational DBMS. The user experience for
    deleting an existing connection is simpler, as it requires only a confirmation.'
  merge: -1
  img_proc: true
