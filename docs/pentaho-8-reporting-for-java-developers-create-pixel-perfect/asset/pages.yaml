- pgno: 503
  md: '# Other subreport examples


    Before leaving the subreport examples, let''s list some use cases where subreports
    can help a lot; the intention here is to share a practical reference, not an exhaustive
    and final list:


    +   - **Details in a report**: The first and an easy example of subreport is a
    portion of the space of the report where some details about an entity are presented.
    As an example, you can think about the sender of a letter or the company details
    in an invoice.

    +   - **Multi-page subreports**: Quite similar to the example described earlier,
    you can think about a report that includes a large subreport that may span multiple
    pages. As an example, you can think about a catalog of products or an inventory
    list. In this case, the subreport will be defined in the `Report Header` band
    instead of the `Details` band, but everything else would work in exactly the same
    way as you saw here. The difference is that the data source in the subreport could
    retrieve a long list of data, that may span multiple pages.

    +   - **Chart subreports**: There are no limitations to the elements you can use
    in subreports. For example, you can use a chart, having an appealing result.

    +   - **Side by side subreports**: Another capability of subreports is to be able
    to place two or more subreports horizontally, beside one another, within a report
    band. Using this capability, you can specialize subreports with dedicated data
    sources, extracting data from different tables or sources (not necessarily one
    source only).

    +   - **Multiple subreports**: There are no limitations to the number of subreports
    that you can use. Combining the examples shared in this section, you can create
    very complex reports with a modular approach. This approach can be suggested if
    you have to develop changes after a long period of time or in a team with different
    developers.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_503_0.png)


    > _As you are learning here, subreports are very powerful, but there is a disadvantage
    that you should be aware of: subreports can be very expensive in terms of consuming
    resources. Do not abuse their use._'
  merge: -1
  img_proc: true
