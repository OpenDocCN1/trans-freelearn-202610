- pgno: 629
  md: '# Example of master/details report interaction


    Finally, let''s see how to develop one of the most common interactions between
    reports: the navigation from one report to another, where the content of the target
    report depends on one parameter. To develop this example, you need a second report,
    in this case named `interactive_report_2.prpt`. The second report shows all the
    products included in one line. As you can expect, the line value is a mandatory
    parameter.


    To develop the interaction, the Java project includes another endpoint called
    `/reporting2`, connected to the second report. The implementation is defined in
    the `PentahoServlet2` class containing the following Java code:


    ```

    // Getting the report.

    ResourceManager manager = new ResourceManager();

    manager.registerDefaults();

    Resource res = manager.createDirectly(

    new URL("file:resources/interactive_report_2.prpt"),

    MasterReport.class);

    MasterReport report = (MasterReport) res.getResource();


    // Mandatory parameter.

    report.getParameterValues().put("LINE", request.getParameter("line"));


    // Conversion to HTML and rendering.

    response.setContentType("text/html");

    HtmlReportUtil.createStreamHTML(report, response.getOutputStream());

    ```


    Now that the second report is ready to be called, let''s see how the interaction
    is developed in the first report, `interactive_report_1.prpt`. The requested development
    in the source report is always the same: a dynamic call to a target URL, defining
    the `on-click` property of the report''s element. In this case, the `on-click`
    property is defined as following:


    ```

    =CONCATENATE(

    "window.open(''\'', ''");

    "/reporting2?line=";

    [PRODUCTLINE];

    ```'
  merge: -1
