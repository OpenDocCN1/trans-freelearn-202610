  md: '# HQLDataFactory


    The `org.pentaho.reporting.engine.classic.extensions.datasources.hibernate.HQLDataFactory`
    class allows you to populate your report based on a Hibernate query. **Hibernate**
    is an open source relational persistence engine. It allows you to easily persist
    your Java objects to a database.


    Much like many of the other `DataFactory` implementations, `HQLDataFactory` is
    configured with information to connect to Hibernate, along with the ability to
    specify named queries. The `HQLDataFactory` API defines an interface called `SessionProvider`,
    which it uses to gain access to the current hibernate `Session` object. `SessionProvider`
    contains a single API method, `getSession()`, which returns an instance of `org.hibernate.Session`.
    There are two implemented versions of this session provider: `StaticSessionProvider`
    and `DefaultSessionProvider`.


    At this time, `HQLDataFactory` is not available as a data source within Pentaho
    Report Designer, so code is required to utilize Hibernate as a data source.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_575_0.png)


    > *HSQLDataFactory is documented here because it is quoted in the official Javadoc
    website (http://javadoc.pentaho.com/reporting/). As you can see from Pentaho''s
    artifact repository regarding the hibernate extension, found at this link:http://repository.pentaho.org/artifactory/repo/pentaho-reporting-engine/pentaho-reporting-engine-classic-extensions-hibernate/,
    the library is not supported anymore and the latest update is on the 3.9.2-GA
    release.*'
  merge: -1
  img_proc: true
- pgno: 576
  md: '# StaticSessionProvider


    `StaticSessionProvider` simply takes in the `org.hibernate.Session` object as
    a constructor parameter, making the already existing `Session` object available
    to `HQLDataFactory`. This would be used if your system already has an initialized
    Hibernate session.'
  merge: -1
  img_proc: true
- pgno: 577
  md: '# DefaultSessionProvider


    DefaultSessionProvider requires no constructor parameters, and uses the following
    API call to generate SessionFactory from Hibernate: sessionFactory = new Configuration().configure().buildSessionFactory();


    The created sessionFactory instance is used to create new sessions, which HQLDataFactory
    uses to query Hibernate.


    HQLDataFactory provides two constructors. The first constructor takes in SessionProvider,
    as described earlier. The second constructor simply takes in a Hibernate Session
    instance, which it uses to query Hibernate. This constructor uses StaticSessionProvider,
    under the covers, to pass the Session into the HQLDataFactory.


    Once you''ve instantiated your factory, you may add named queries to the factory
    by making the following API call:


    ```

    void setQuery(String name, String queryString);

    ```


    The setQuery method takes in the name of the query, and the Hibernate query, in
    order to execute.


    HQLDataFactory uses Hibernate''s query language, which is well-documented at http://www.hibernate.org/hib_docs/reference/en/html/queryhql.html.
    You may include report parameters in your query by using the HQL syntax :ParameterName.
    The max results and query timeout parameters are supported by HQLDataFactory.'
  merge: -1
  img_proc: true
- pgno: 578
  md: '# PmdDataFactory


    The `org.pentaho.reporting.engine.classic.extensions.datasources.pmd.PmdDataFactory`
    class allows you to populate your report using a Pentaho Metadata Query. Pentaho
    Metadata allows a database administrator to define a business layer of their relational
    data for end users, simplifying the ability to query the data, as well as protecting
    users from the complexities that may exist in a database schema. Pentaho''s **Metadata
    Query Language** (**MQL**) is an XML-based query model that simplifies querying
    databases, and is currently used in the Pentaho Report Designer and **Pentaho
    Web Ad Hoc Report** client tools. In order for `PmdDataFactory` to initialize
    properly, it must have access to certain Pentaho Metadata configuration properties
    that can be configured at runtime, or be passed in by a configuration file.'
  merge: -1
  img_proc: true
- pgno: 579
  md: '# XMI file


    As introduced in Chapter 6, Configuring JDBC and other data sources, the **XMI**
    file contains a serialized version of the defined metadata model, and is required
    in order to execute MQL queries. The XMI file contains information regarding how
    to connect to the relational data source, as well as the business model mapping
    of the relational data. This file is loaded at runtime into the configured repository
    of Pentaho Metadata. The XMI file may be configured by calling the `setXmiFile`
    method. This file is loaded with Pentaho Reporting Engine''s `ResourceManager`.'
  merge: -1
  img_proc: true
- pgno: 580
  md: '# Domain Id


    The metadata domain id is used to map a name to the XMI file in the metadata repository.
    This name is also referenced in the MQL query file. Therefore, it is important
    to use the same name in the MQL query and `PmdDataFactory`. The domain may be
    set by the `setDomainId` method.'
  merge: -1
