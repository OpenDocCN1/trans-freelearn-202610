- pgno: 594
  md: '# CompoundDataFactory


    The `org.pentaho.reporting.engine.classic.core.CompoundDataFactory` class is a
    useful factory when working with sub-reports that contain different data sources
    than the primary report. For instance, with `CompoundDataFactory`, you may use
    `SQLReportDataFactory` for your master report query and `XPathDataFactory` for
    a sub-report query. `CompoundDataFactory` has a default constructor, and you may
    add child data factories by calling the `add(DataFactory)` or `add(index, DataFactory)`
    methods. The `DataFactory` instances are queried in the order of their index.


    All reports generated by the Report Designer use `CompoundDataFactory`, making
    it possible for the users to add different types of data sources to their reports
    in the user interface.'
  merge: -1
  img_proc: true
- pgno: 595
  md: '# ScriptableDataFactory


    The `org.pentaho.reporting.engine.classic.extensions.datasources.scriptable.ScriptableDataFactory`
    class allows you to populate your report from a script compliant with the Bean
    Scripting Framework. The **Bean Scripting Framework (BSF)** is a set of Java classes
    which provides scripting language support in Java applications, and access to
    Java objects and methods from scripting languages.


    `ScriptableDataFactory`, using the Bean Scripting Framework to execute query scripts
    in different scripting languages, returns `TableModel`, which can be used as data
    source in your Pentaho report. The mechanism is always the same as in the previous
    (and most common) examples.'
  merge: -1
  img_proc: true
