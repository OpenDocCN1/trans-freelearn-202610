- pgno: 184
  md: '# Summary


    In this chapter, you have walked through an advanced use of Pentaho Report Designer,
    starting from a blank report and learning how to develop a Pentaho report from
    scratch, not using the Report Design Wizard. The manual creation of a Pentaho
    report gave you the opportunity to see in action all the features (basic and advanced)
    of the Pentaho Report Designer.


    As experienced in the previous chapters, the description has been driven by practical
    examples and a step-by-step approach to the tasks. At the end of the chapter,
    you saw how to develop a very simple report with an easy layout (report_01.prpt),
    and a complex report with a nice header, footer, grouping of details, and also
    a chart (report_02.prpt). In the last (but not the least) topic, you were introduced
    to a preview of the reports in all the available formats, with some highlights
    on the relation between the development and the final format.


    This chapter is again written as a tutorial for developers and information technologists.
    We hope you enjoyed following the development on your laptop while reading, and
    hopefully, you feel comfortable with the manual development of easy and complex
    Pentaho reports, developed using Pentaho Report Designer.


    In the next chapter, we will dive deep into the details of the various elements
    available to designers, how they are used, and what they might be used for.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Design and Layout in Report Designer


    In the previous chapters, you were introduced to Pentaho Report Designer and you
    started to use it, developing simple and complex reports either by using the wizard
    or starting from scratch. In this chapter, you will dive deep into the concepts
    and functionality of Pentaho Report Designer related to the design and layout
    of a report.


    You will first refresh the basics around Report Designer''s user interface and
    you will then learn more about the core layout bands presented in the Report Designer,
    including detail and group bands. From there, you will explore in detail the various
    elements available to designers, how they are used, and what they might be used
    for.


    You will also learn the ins and outs of visual layout within the reporting canvas,
    including advanced concepts such as grids and guides. You will close the chapter
