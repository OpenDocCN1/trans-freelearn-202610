- pgno: 53
  md: '# Typical uses of Pentaho Reporting


    Business users need access to information in many different forms for many different
    reasons. Pentaho Reporting addresses the following typical uses of reporting,
    along with many other types that will be covered in this book.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Operational reporting


    One of the most commonly used forms of reporting is operational reporting. When
    a developer or an IT organization decides to generate reports directly from their
    operational data sources for the purpose of detailed transaction level reporting,
    it is referred to as operational reporting. In this scenario, the database is
    designed to solve an operational problem, and usually contains live data supporting
    critical business functions. Users of Pentaho Reporting can point directly to
    this data source and start generating reports.


    Some examples of operational reporting include building custom reports directly
    based on a third-party software vendor''s database schema. These reports might
    include summaries of daily activity, or detailed views into a particular project
    or users in the system. Reports might also be generated from data originating
    from an in-house custom application. These reports are typically based on an SQL
    backend, but could be generated from flat log files or directly from in-memory
    Java objects.


    Pentaho Reporting''s parameterization capabilities provide a powerful mechanism
    to render up-to-the-minute customized operational reports. With features such
    as cross tabs and interactive reporting, business users can quickly view their
    operational data and drill back into operational systems that might require attention.


    However, there are limitations when developing reports based on live operational
    data. Developers need to be careful to make sure that queries in the operational
    system do not impact the performance of regular operations. An extreme CPU-intensive
    query could delay a transaction from taking place. Also, certain historical questions,
    for example, state transitions or changes to particular informational fields such
    as address, aren''t traditionally captured in an operational schema design.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Business intelligence reporting


    When you''ve reached the limits of operational reporting, the next logical step
    is to move your data into a data warehouse. This move is often referred to as
    business intelligence reporting. Reporting alone does not provide the necessary
    tools to make this transition. You will need an **Extract, Transform, Load (ETL)**
    tool, such as Pentaho Data Integration, along with a sensible warehouse design,
    such as a snowflake schema.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_55_0.png)


    > *A **snowflake schema** is a logical arrangement of tables in a multidimensional
    database, such that the entity relationship diagram resembles a snowflake shape.
    A multidimensional database is defined as "a variation of the relational model
    that uses multidimensional structures to organize data and express the relationships
    between data".*


    This type of use allows business users to monitor changes over time. It also helps
    gain performance benefits by pre-calculating aggregations and defining schemas
    that are built in mind for summarized reporting. Until recently, data warehousing
    and business intelligence had been limited to large enterprises due to the cost
    of software and limited expertise. With open source tools becoming more widely
    available, a large number of small and medium size businesses are deploying data
    warehouses in order to get solutions for the critical questions in their business
    domain. Common examples of data warehouse reporting include combining sales and
    inventory data into a single location for reporting, or combining internal proprietary
    sales data with publicly available market trends and analysis.


    Pentaho Reporting''s flexible data source support makes it easy to incorporate
    reports in your business intelligence solutions. Also, with Pentaho Reporting''s
    speed and scalability, you can deploy Pentaho Reporting with the confidence that
    reports will be executed efficiently.


    As with all approaches, there are limitations to this approach. In traditional
    warehousing, data is usually batched nightly, weekly, or monthly. Therefore,'
  merge: -1
  img_proc: true
- pgno: 56
  md: business users rarely get to see up-to-the-minute reports on business operations.
    Also, when designing a warehouse, it is important to ask the correct business
    questions. Unfortunately, it is possible to build a data warehouse and still not
    address the business users' needs, if not investigated ahead of time.
  merge: -1
  img_proc: true
