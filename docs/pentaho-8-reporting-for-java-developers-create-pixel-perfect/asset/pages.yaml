- pgno: 642
  md: '# Managing data sources


    Publishing a Pentaho report into the Business Analytics Platform is not enough
    to make it work for the final users. As you saw in Chapter 6, *Configuring JDBC
    and Other Data Sources*, there are several types of possible data sources that
    a Pentaho report can use. Some of them define the data source directly in the
    report, but some of them define only a symbolic link to an external definition.
    If you use a JDBC or JNDI connection to a DBMS (just quoting a common example),
    you also need to define the data source in Pentaho Business Analytics Platform.
    Without the same exact definition, your report won''t be available and will raise
    an exception at the first call.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_642_0.png)


    > *Always remember to double check that the definition of the data source on the
    Business Analytics Platform is exactly the same as the one used in reporting design,
    including the same name (case sensitive), type, settings, and parameters. If you
