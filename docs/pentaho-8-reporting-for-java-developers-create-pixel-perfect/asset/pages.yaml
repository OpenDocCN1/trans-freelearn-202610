- pgno: 591
  md: '# BandedMDXDataFactory example


    In this section, you will see two complete Maven projects developing exactly the
    same Pentaho report: one using the Mondrian native provider and the other using
    the OLAP4J provider to access the same Mondrian schema. As introduced earlier
    in the chapter, in both cases, `BandedMDXDataFactory` will be used, even if two
    different implementations will be used.


    The first example is about using the Mondrian native provider. The complete source
    code developing the Pentaho report can be found in the https://github.com/fcorti/pentaho-8-reporting-for-java-developers
    repository; specifically, in the `chapter 12 - Developing using data sources`
    folder. Inside the folder, you will find the `pentaho-reporting-data-source-mondrian`
    project, using the `PentahoServlet` class with the following source code:


    ```

    ...

    // Data source provider.

    DriverDataSourceProvider dsProvider = new DriverDataSourceProvider();

    dsProvider.setDriver("org.hsqldb.jdbcDriver");

    dsProvider.setProperty("user", "pentaho_user");

    dsProvider.setProperty("password", "password");

    dsProvider.setUrl("jdbc:hsqldb:./resources/sampledata/sampledata");


    // Mondrian cube provider.

    DefaultCubeFileProvider cubeProvider = new DefaultCubeFileProvider();

    cubeProvider.setMondrianCubeFile("./resources/steelwheels.mondrian.xml");


    // Loading Mondrian data source.

    BandedMDXDataFactory factory = new BandedMDXDataFactory();

    factory.setDataSourceProvider(dsProvider);

    factory.setCubeFileProvider(cubeProvider);

    factory.setQuery(

    "default",

    "SELECT " +

    "{[Measures].[Sales]} ON COLUMNS," +

    "{Descendants([Time].Children, [Time].[Months])} ON ROWS" +

    "FROM" +

    "[SteelWheelsSales]");

    report.setDataFactory(factory);

    ...

    ```


    To run the project, download the `pentaho-reporting-data-source-mondrian` folder
    to your local machine, open a terminal, move into this folder, and execute the
    following commands in this sequence:'
