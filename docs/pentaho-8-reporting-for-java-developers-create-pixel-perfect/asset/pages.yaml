  md: '# Style and layout common properties


    As you saw in Chapter 5, *Design and Layout in Report Designer*, for the report
    bands, and also in the case of charts, the style and layout properties are grouped
    for better management and understanding. In the case of charts, the style and
    layout properties can be managed in the left panel of the chart editor. The groups
    of properties are managed in exactly the same way as the element properties panel:
    same behavior and same user experience. Of course, the properties are different
    with different meanings and behaviors, and here in this section, you will learn
    more about them, discovering all the relevant details.


    As we saw for the report bands, most charts share a common set of properties.
    The following properties are common across all the charts. Any exceptions are
    mentioned as part of the specific chart type.'
