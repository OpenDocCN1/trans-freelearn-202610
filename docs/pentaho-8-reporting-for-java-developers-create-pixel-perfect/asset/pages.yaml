- pgno: 180
  md: '# Previewing Pentaho reports in different formats


    Now that you have two brand new reports (report_01.prpt and report_02.prpt) developed
    starting from a blank page, let''s see how to preview report_02.prpt in different
    formats. As you learnt in the introduction, Pentaho Reporting Engine is able to
    generate reports in several formats, independently from the development.


    To preview a report choosing the format, click on the green arrow icon (▶) visible
    in the toolbar. Once clicked, you will see a short menu appear with a list of
    possible formats. The following screenshot shows what the menu looks:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_180_0.png)


    Choosing the Print Preview item is like choosing the default format; the default
    format is generated and downloaded locally. If you select the PDF format, you
    will see that the report is entirely generated and downloaded locally. If your
    client environment has a reader (or software) associated with the format, you
    will see that it will be opened and previewed. On other hand, if the format of
    your report is not associated to any reader or software, it will be asked to be
    saved as a regular file.


    The following are some screenshots showing report_02.prpt rendered in PDF format
    (top left), HTML format (top right), Microsoft Excel format (bottom left), and
    RTF (bottom right):'
  merge: -1
  img_proc: true
- pgno: 181
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_181_0.png)


    Before leaving this feature, let''s share some practical considerations on the
    relation between the developed report and the final format (or formats). As you
    can see in the previous example with report_02.prpt, Pentaho Reporting Engine
    is really powerful and is able to generate the best version of the report in all
    the available formats. As you can imagine, this has some obvious limitations.
    If you take a look at the Microsoft Excel version, the rendering is not perfect
    and is probably not suitable for a release in production. Right or wrong, this
    is a regular behavior on complex layouts and this is something you should always
    consider in your future developments.


    *If you have to develop a report that will be released in formats with lin capabilities,
