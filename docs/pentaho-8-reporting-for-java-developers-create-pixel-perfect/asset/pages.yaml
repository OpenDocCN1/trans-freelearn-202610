- pgno: 534
  md: '# settings.xml file


    The `settings.xml` file contains global configuration properties for a report,
    as well as a placeholder for future runtime information.


    One example of a configuration setting is related to the execution of formula
    expressions. If you set the property `org.pentaho.reporting.engine.classic.core.function.LogFormulaFailureCause`
    to true, and you have your Log4j logging set to debug, you will receive a stack
    trace, in addition to an error message, when the formula fails.


    Additional configuration properties are available, primarily for use in design
    tools such as Pentaho Report Designer. Rarely would you need to define a configuration
    property while generating a report.'
  merge: -1
