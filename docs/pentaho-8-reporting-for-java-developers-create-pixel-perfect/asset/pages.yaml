  md: '# SQLReportDataFactory


    The `org.pentaho.reporting.engine.classic.core.modules.misc.datafactory.sql.SQLReportDataFactory`
    class allows you to easily use JDBC and SQL to populate your reports.


    To set up `SQLReportDataFactory` correctly in your environment, you first need
    to create an instance of `ConnectionProvider`. Three `ConnectionProvider` implementations
    are available for use (`StaticConnectionProvider`, `DriverConnectionProvider`,
    and `JndiConnectionProvider`). The `ConnectionProvider` interface and three implementations
    are available in the same package as `SQLReportDataFactory`.


    The `ConnectionProvider` interface defines a single `createConnection` method,
    which should return a JDBC connection for `SQLReportDataFactory` to use when generating
    a result set to populate a report.'
