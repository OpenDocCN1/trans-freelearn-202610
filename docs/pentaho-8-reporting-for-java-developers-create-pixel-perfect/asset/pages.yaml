  md: '# Text properties


    Text properties are common (and inherited) to `Master Report` and bands, except
    for `h-align` and `v-align`. The following properties impact the appearance of
    text within report elements:


    | Name | Type | Description |

    |---|---|---|

    | `h-align` | Selection | The horizontal alignment of the text within the element.
    This property is also editable in the main toolbar. |

    | `v-align` | Selection | The vertical alignment of the text within the element.
    This property is also editable in the main toolbar. |

    | `v-align-in-band` | Selection | Specifies the vertical alignment of text in
    the band. |

    | `text-wrap` | Selection | Specifies if the text should wrap. Appropriate values
    include `none` and `wrap`. |

    | `word-break` | Boolean | Flag indicating to break text within words. If not
    defined, this defaults to true (breaks only at word-boundaries). |

    | `direction` | Selection | The direction of text (for arabic text, as an example)
    indicating if it is left-to-right (`ltr`) or right-to-left (`rtl`). |

    | `text-color` | String | The foreground font color. This property is also editable
    in the main toolbar. |'
