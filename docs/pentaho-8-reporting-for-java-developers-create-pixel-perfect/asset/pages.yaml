    | boolean isQueryExecutable( String query, DataRow parameters) | Checks whether
    the query would be executable by this DataFactory. |

    | void open() | The open method is called during the initialization process, allowing
    DataFactory to initialize if necessary. |

    | TableModel queryData( String query, DataRow parameters) | The queryData method
