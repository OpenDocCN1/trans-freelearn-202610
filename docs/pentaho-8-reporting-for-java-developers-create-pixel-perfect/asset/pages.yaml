- pgno: 535
  md: '# styles.xml file


    The `styles.xml` file defines what page format the report should be rendered as,
    style rules that dictate how a report should be rendered, global layout processors,
    a report watermark, and finally the page header and footer sections of a report.


    The `styles.xml` file contains the `style` root XML element, and includes namespaces
    relevant to rendering styles, including the `core` and `layout` namespaces defined
    earlier, as well as the `style` namespace as the default namespace, which is located
    at http://reporting.pentaho.org/namespaces/engine/classic/bundle/style/1.0. The
    following child elements may be specified in the `style` XML element:


    | Name | Description |

    |---|---|

    | `page-definition` | The `page-definition` XML element contains attributes defining
    the report''s page properties. The attribute `pageformat` specifies the page format
    type. The attributes `horizontal-span` and `vertical-span` define how many pages
    a report should span across. The `width` and `height` attributes define the width
    and height of the paper. The `orientation` attribute defines whether the page
    should be laid out as portrait, landscape, or reverse-landscape. The attributes
    `margin-top`, `margin-left`, `margin-bottom`, and `margin-right` define the margin
    values for the report. |

    | `style-rule` | Multiple `style-rules` may be defined in the report. A style
    rule has the `name` and `parent` attributes, which define the inheritance tree
    of a group of styles. Within the `style-rule`, style elements such as `text-styles`
    and `spatial-styles` are defined, which contain specific styling information.
    |

    | `layout:layout-processors` | Certain functions that manipulate the layout of
    the entire report may appear in the `layout-processors` section of the styles
    document. |

    |  | The `watermark` XML element is rendered in the background, behind |'
