- pgno: 380
  md: '# Bar line chart


    The bar line chart combines the bar and line charts, allowing visualization of
    trends with categories, along with comparisons. The bar line chart is unique in
    that it requires two category datasets to populate the chart: the first dataset
    populates the bar chart and the second dataset populates the line chart.


    > *Note that the bar line chart is one of the two chart types that have activated
    the second tab named Secondary DataSource in the dataset panel. The tab named
    Primary DataSource controls the bar chart dataset and the tab named Secondary
    DataSource controls the line chart dataset.*


    The bar line chart utilizes the common properties defined earlier, including the
    category dataset properties. This chart also inherits the properties from both
    the bar chart and the line chart. In the following description are listed all
    the differences in terms of available properties:


    +   - The bar options set defines the same properties as described for the options
    set in the bar chart, with one property added: `ctgry-tick-font` (string), defining
    the font used for the range ticks in the chart

    +   - The line options set defines the same properties as described for the options
    set in the line chart, with some differences, described as follows:

    +     - The horizontal property is not available here

    +     - `series-color` is renamed as `line-series-color`. If not defined, `line-series-color`
    uses the `series-color` property in the bar options set

    +     - `lines-label-font` (string) defines the font used for the labels of the
    line

    +   - The general set has the same properties as described for the bar chart (the
    general common set, and `gridlines` and `show-plot-border` in addition)

    +   - The shadow, x axis, and y axis sets are also provided here with the same
    properties as described for the bar chart'
  merge: -1
  img_proc: true
