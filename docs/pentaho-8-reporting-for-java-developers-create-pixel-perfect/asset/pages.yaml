- pgno: 527
  md: '# Datasources folder


    For each data source defined in a report, a data source file is created with the
    necessary information to connect to. Usually, these kind of files are stored in
    the `datasources` folder in the `.prpt` bundle file. Defining every data source
    file is out of scope for this chapter, but try to develop a sample report and
    then check the specific `.prpt` bundle file as an example.


    As mentioned earlier, a compound data source is often used to refer to multiple
    data sources in a single report. For each data source type, there is an equivalent
    XML format. These formats are documented in their XML schema files, which are
    accessible when downloading the source distribution of the reporting engine and
    extensions.'
  merge: -1
  img_proc: true
- pgno: 528
  md: '# layout.xml file


    The `layout.xml` file defines the primary structure of report bands and elements.
    Each band is represented as an XML element, and each band''s elements are contained
    in the band. Multiple XML namespaces are used in the context of the layout XML
    document. The primary namespaces include:


    +   - `core`: This defines core elements and attributes

    +   - `layout`: This defines the majority of the elements in this document

    +   - `styles`: This define inline styles


    The `styles` namespace will be discussed in more detail in the `styles.xml` section
    that will follow. The `core` namespace document is located at http://reporting.pentaho.org/namespaces/engine/attributes/core.
    The `layout` namespace, which is specified as the default namespace for this document,
    is located at http://reporting.pentaho.org/namespaces/engine/classic/bundle/layout/1.0.


    The layout XML document contains a root layout XML element. This element contains
    root level band information. The `layout` element may contain attributes defining
    report level metadata, such as the title of the report. The following child XML
    elements may be specified in the layout element:


    | Name | Description |

    |---|---|

    | `preprocessor` | Any number of `preprocessor` elements may be defined in the
    report layout element. Preprocessors contain a `class` attribute that specifies
    the fully qualified `preprocessor` Java class and may contain the `property` elements
    for the preprocessor. Preprocessors may manipulate a report before it is rendered.
    |

    | `layout-processors` | Certain functions that manipulate the layout of elements
    may appear in the `layout-processors` element of the layout document. For instance,
    `ItemHideFunction` is considered a layout processor, so if defined, it will be
    serialized in this portion of the document. |'
  merge: -1
  img_proc: true
- pgno: 529
  md: '|  |  |

    |---|---|

    | `report-header` | The `report-header` element specifies the layout of the report
    header. This element contains a child element titled `root-level-content`, which
    contains all references to child elements. Note that `report-header` is a report
    element. Therefore, it may contain general element attributes and child elements,
    defined later in the *Report elements* section of this chapter. |

    | `group` | The `group` element defines the entire hierarchy of groups and detail
    bands defined in a report. This element hierarchy is defined in more detail in
    the *Group and detail band hierarchy* section of this chapter. |

    | `report-footer` | The `report-footer` element specifies the layout of the report
    footer. This element contains a child element titled `root-level-content`, which
    contains all references to child elements. Note that `report-footer` is a report
    element. Therefore, it may contain general element attributes and child elements,
    defined later in the *Report elements* section of this chapter. |


    Also note that the report itself is represented as a report element. Therefore,
    in addition to the attributes and child elements defined previously, the report
    may also contain attributes and elements defined in report elements (these are
    covered later in the *Report elements* section of this chapter).'
