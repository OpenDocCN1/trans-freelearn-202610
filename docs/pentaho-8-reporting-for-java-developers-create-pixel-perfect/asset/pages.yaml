  md: '# Functions and expressions


    Pentaho Reporting provides many functions and expressions that may be used during
    report creation. A function in Pentaho Reporting is used to calculate a computed
    value, while an expression in Pentaho Reporting is a function whose scope is limited
    to the current dataset row. A function may maintain state, having access to many
    rows of data.'
  merge: -1
  img_proc: true
- pgno: 428
  md: '# Functions and expressions in Report Designer


    Starting from the Report Designer user interface, functions and expressions live
    in two different places because their scope is different. Functions can be found
    in report explorer, in particular, in the Data tab under the Functions group.
    The following screenshot shows how the report explorer looks with two functions
    defined:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_428_0.png)


    Expressions, being related to the dataset, live in a different place: in the element
    properties panel. In particular, expressions live on each property of the panel,
    in the fourth column of the table showing an icon. There are two possible icons:
    the green plus icon (🟢), indicating that no expression is defined, and the pencil
    icon (✏️), indicating that an expression is already defined. The following example
    shows two properties: the text-color property with the static value filled and
    the expression empty, and the bg-color property with the static value empty and
    the expression filled.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_428_1.png)


    > In case an expression is defined for a property, the third column, conta static
    value, will be ignored. This behavior is relevant during report de and could cause
    pain if you are not aware of it.'
