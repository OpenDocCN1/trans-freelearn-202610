- pgno: 525
  md: '# Functions and expressions


    Every function and expression defined in a report is represented by an `expression`
    XML element. Expression elements have the following five attributes:


    | Name | Description |

    |------|-------------|

    | `name` | The name of the function or expression. |

    | `class` | The class type of the function or expression. This is not required
    if specifying a formula. |

    | `deplevel` | The dependency level of the function or expression, which determines
    the order of execution. |

    | `formula` | If specified, defines a formula for execution. |

    | `initial` | If specified, defines a formula for initial execution. |


    Expressions may also contain properties. These properties appear in the `properties`
    XML element as child property elements. Each `property` XML element contains the
    following attributes:


    | Name | Description |

    |------|-------------|

    | `name` | The name of the property |

    |  |  |'
  merge: -1
  img_proc: true
- pgno: 526
  md: '| `class` | The class type of the property |


    Finally, each `property` XML element contains a text node with the value of the
    property.'
  merge: -1
