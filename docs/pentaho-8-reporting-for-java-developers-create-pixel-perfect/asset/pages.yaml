- pgno: 543
  md: '# Common report bands


    For each band defined in a report, such as report header, report footer, page
    header, and page footer, there are equivalent Java classes that are available,
    all extending from the common abstract class `Band`, located in the `org.pentaho.reporting.engine.classic.core`
    package. These bands are all located in the same package.


    Each band defines a set of Java bean properties, but most simply use those defined
    in the `Band` abstract class. One of the primary methods defined in this class
    is `addElement(Element element)`, which you will use later when creating elements
    and adding them to their parent bands. A subset of `Band` implementations also
    implement the `RootLevelBand` interface, which allows the addition of subreports
    to the band via the `addSubReport(SubReport subreport)` method. Bands such as
    page header, page footer, and watermark do not allow rendering of subreports.
    The following is an example of setting the report header and report footer in
    a report:


    ```

    // Creating report header and footer objects.

    ReportHeader reportHeader = new ReportHeader();

    ReportFooter reportFooter = new ReportFooter();

    ```


    ```

    // Adding the report header and footer to the report.

    report.setReportHeader(reportHeader);

    report.setReportFooter(reportFooter);

    ```


    It can''t get any easier than that!'
  merge: -1
  img_proc: true
- pgno: 544
  md: '# Group band hierarchy


    Group bands also follow this simple Java bean paradigm. Because it is possible
    to nest groups, the API is a little bit more advanced. The RelationalGroup class
    is used for regular relational groupings. CrosstabGroup is used for defining cross
    tabs within a report. The CrosstabGroup API is out of the scope of this chapter,
    but is well documented in Javadoc.


    The RelationalGroup class may contain a group header and group footer, as well
    as a GroupBody implementation. GroupBody is an abstract class that SubGroupBody
    and GroupDataBody extend. SubGroupBody allows for nested groups, and GroupDataBody
    contains ItemBand, as well as three other less used bands, DetailHeader, DetailsFooter,
    and NoDataBand.


    To configure the RelationalGroup class, you must provide a set of data row fields
    that define the grouping. This may be done via the addField(String field), setFields(List
    fields), or setFieldsArray(String[] fieldsArray) method calls. In this example,
    you will define RelationalGroup and ItemBand, and group by the Name field. Note
    that the ItemBand class represents a details band in a report.


    ```

    // Creating the root relational group.

    RelationalGroup group = new RelationalGroup();


    // Using "Line" as the root grouping.

    group.addField("Line");


    // Creating a group data body.

    GroupDataBody groupData = new GroupDataBody();


    // Creating an item band.

    ItemBand itemBand = new ItemBand();


    // Place the item band within the group data body.

    groupData.setItemBand(itemBand);


    // Place the group data body within the root group:

    group.setBody(groupData);


    // Setting the root group within the report.

    report.setRootGroup(group);

    ```'
  merge: -1
  img_proc: true
- pgno: 545
  md: '# Adding elements to the report


    Now that you have set up all the bands for your report, you are ready to start
    adding elements. Unlike the previous classes and interfaces introduced for bands,
    all elements share a single class implementation, `Element`, and are created by
    element factories. The `Element` class is located in the `org.pentaho.reporting.engine.classic.core`
    package. The primary set of element factories is located in the `org.pentaho.reporting.engine.classic.core.elementfactory`
    package.


    To use a factory, first instantiate the factory object and then configure the
    Java bean setters of the factory. Once you have built your element within the
    factory object, call `createElement()` to retrieve the `Element` instance, which
    you will then add to your report.'
  merge: -1
  img_proc: true
- pgno: 546
  md: '# Adding a label element


    As a demonstration of how to use a factory, the following code instantiates an
    `Element` using the `LabelElementFactory` class:


    ```

    // Creating a label element factory instance.

    LabelElementFactory factory = new LabelElementFactory();


    // Configuring the label''s text.

    factory.setText("Product");


    // Configure the label''s location and size.

    factory.setX(1f);

    factory.setY(1f);

    factory.setMinimumWidth(100f);

    factory.setMinimumHeight(20f);


    // instantiate the label element

    Element label = factory.createElement();

    ```


    In this example, you instantiated the factory, set a value for the label, and
    then generated the label `Element` instance. Factories also expose style attributes
    as Java bean setters, so it''s possible to configure the location, size, and font
    style of this element.


    Now, add the label to your `ReportHeader` instance defined earlier:


    ```

    // Adding the label to the report header.

    reportHeader.addElement(label);

    ```


    It is important to note that for the Java bean properties not set, elements inherit
    their default values from their parent band. For instance, you can specify the
    bold attribute on the `ReportHeader` instance, and all text elements will default
    to that value:


    ```

    // Setting the bold property to true, inherited by all child text elements.

    reportHeader.getStyle().setStyleProperty(TextStyleKeys.BOLD, true);

    ```'
  merge: -1
  img_proc: true
