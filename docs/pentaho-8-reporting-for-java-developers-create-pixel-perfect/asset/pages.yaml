- pgno: 115
  md: '# Saving and opening the report


    After the definition of the first Pentaho report, you will probably want to understand
    more about saving it somewhere for future use. Before seeing it in action in our
    exercise, let''s introduce all the possible ways. Pentaho Reporting has two different
    places where you can ask to store reports: the filesystem and the so called Pentaho
    repository.


    Saving (and loading) a report into (and from) the filesystem is not very different
    from saving (and loading) a regular file. A different solution is the Pentaho
    repository. The Pentaho repository is managed by the Pentaho Analytics platform
    directly and is mainly a collaborative space where developers and users can read,
    write, update, and delete content, in a manner similar to content repository.
    The Pentaho Analytics platform implements its repository using Apache Jackrabbit
    (http://jackrabbit.apache.org), a fully conforming implementation of the content
    repository for Java technology API (JCR, specified in JSR 170 and JSR 283). The
    Pentaho repository can be accessed using the API of the Pentaho Analytics platform
    and it is recommended, by Pentaho, to be used in production environments. You
    will cover all of this in Chapter 15, *Using Reports in Pentaho Business Analytics
    Platform.*


    Even if the Pentaho repository should be preferred, in our practical example,
    we start using the filesystem as a repository. To save the first report into the
    filesystem, Pentaho Report Designer has a clear feature: the Save and Save As...
    items in the upper menu (under the File group). Clicking on the Save item (Save
    As... has the same user experience), a window similar to the following one will
    appear. As you can easily check by yourself, a disk icon (💾) is visible in the
    toolbar as shortcut for the saving feature. As described, this feature is not
    different to saving a regular file, as shown here:'
  merge: -1
  img_proc: true
- pgno: 116
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_116_0.png)


    What to do with the Save window is definitely understandable: identify a folder
    on the filesystem, specify a name for the report, and press the OK button. In
    our case, we call the report `my_first_report` and save it into the `my_reports`
    folder. As you should remember, at the very beginning of this chapter, we created
    the `my_reports` folder to store all the reports created during the exercises
    of this book.


    Once safely stored in the filesystem, you can check what the report looks like
    by accessing the `my_reports` folder. As shown in the following screenshot, the
    report looks like a single file with the extension `.prpt`. We will cover in Chapter
    11, *The PRPT Format and the Java API to Build It*, what a `.prpt` file is. At
    this stage, it is nothing more and nothing less than a single file containing
    a Pentaho report in one place. A Pentaho report in the `.prpt` format can be copied,
    moved, deleted, and renamed as a regular file and nothing really changes in terms
    of user experience.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_117_0.png)


    To complete the life cycle of our report, as the last topic in this chapter, let''s
    briefly discuss how to open a report from the filesystem. The task is not difficult
    to do and to understand. In addition to that, like the save task, opening a Pentaho
    report is not different from opening a regular file. To open a Pentaho report
    from the Report Designer, click on the File item in the menu and then select Open....
    Select the .prpt file from the filesystem and click OK. That''s all.


    The report will be imported again into the Pentaho Report Designer and be ready
    to be modified and previewed again, as we discussed in the previous sections.
    As we saw for Save and Save As..., a folder icon (📁) is visible in the toolbar
    as a shortcut for the Open... feature of the upper menu.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_117_1.png)


    *Feel free to check into the GitHub repository available at https://github.com/fcorti/pentaho-8-reporting-for-java-developers,
    where you can find the `my_first_report.prpt` file stored in the `Chapter 02 -
    Getting started with Report Designer/my_reports` folder.*'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Summary


    In this chapter, you have walked all the way through a complete reporting example,
    with step-by-step instructions on how to create a Pentaho report with your preferred
