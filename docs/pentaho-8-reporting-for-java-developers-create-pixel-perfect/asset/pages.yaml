  md: '# Creating a transformation with Pentaho reports


    Now that you know what a Pentaho transformation is, and the basics around its
    development, let''s see a concrete example, defining an easy ETL generating the
    PDF output of the well known `my_first_report.prpt` file. The first task to do
    is to copy the `my_first_report.prpt` file into the `data-integration` folder
    of your Pentaho Data Integration installation. This is required because it will
    be used as the current path during the execution of the transformation. If you
    don''t have the `my_first_report.prpt` file available, you can download it from
    the https://github.com/fcorti/pentaho-8-reporting-for-java-developers repository,
    specifically, from the `Chapter 15 - Using reports in Pentaho Business Analytics
    Platform/my_reports` folder.


    As a first step, let''s run the Spoon GUI to start the development: open a Terminal,
    move to the `data-integration` folder, and run the `spoon` script. From the upper
    menu, click on the File | New | Transformation item to create an empty transformation.
    Once done, right-click on the empty right panel and select Properties. In the
    opening window, replace the `my first transformation` value with the content of
    the `Transformation name` field. Then click the OK button and press the disk icon
    (💾) on the upper toolbar. Ensure that you save the `my first transformation` file
    in the `data-integration` folder.


    Now that the transformation is saved as empty, select the Design tab from the
    left panel and you will find all the available steps to include. Expand the `Input`
    set, and drag the `Data Grid` step and drop it into the right panel. Double-click
    on the `Data Grid` step and fill the Meta tab of the edit window, as shown in
    the following screenshot:'
