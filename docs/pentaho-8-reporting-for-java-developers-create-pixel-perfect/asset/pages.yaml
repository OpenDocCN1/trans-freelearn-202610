- pgno: 148
  md: '# Summary


    In this chapter, you have walked through a complete example with step-by-step
    instructions on how to embed Pentaho Reporting in a Java J2EE Application. In
    the first part of the chapter, you downloaded, installed, and studied the official
    Pentaho Reporting SDK, discovering its structure, the samples, and the provided
    guide.


    In the second part of the chapter, you developed a brand new web application in
    Java, using Apache Maven and including the Pentaho Report Engine in the project.
    To make the example more practical, you saw how to manage the Pentaho report developed
    in the previous chapter from the Java code. The goal has been to preview the Pentaho
    report in PDF format, using your browser.


    Now that you have read this chapter, you should be confident with the basics about
    Pentaho Reporting SDK and how to build a Java application consuming Pentaho reports.
    In the next chapter, you will start a deep learning of Pentaho Report Designer,
    understanding the funding principles and developing a Pentaho report from scratch,
    instead of using the wizard as you did in previous chapter.'
