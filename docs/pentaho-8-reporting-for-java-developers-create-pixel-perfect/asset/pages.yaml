- pgno: 557
  md: '# The TableModel interface


    The `javax.swing.table.TableModel` interface is part of the Java Platform API.
    Pentaho Reporting uses the `TableModel` interface to access the two-dimensional
    data necessary to render a report. Portions of the `TableModel` interface are
    not used in the Pentaho Reporting Engine. Specifically, the following four methods
    are not used: `isCellEditable`, `setValueAt`, `addTableModelListener`, and `removeTableModelListener`.
    All the unused methods are related to updating `TableModel`. The Pentaho Reporting
    Engine uses the `TableModel` interface in a read-only fashion, so these methods
    are not applicable. The following four methods are utilized by the reporting engine:


    | Method | Description |

    |---|---|

    | Class<?><br>getColumnClass(<br>int columnIndex) | Returns the most specific
    super class for all the cell values in the column. |

    | int<br>getColumnCount() | Returns the number of columns TableModel contains.
    |

    | String<br>getColumnName(<br>int columnIndex) | Returns the column name of the
    specified column index. |

    | int<br>getRowCount() | Returns the number of rows TableModel contains. |

    | Object<br>getValueAt(<br>int rowIndex,<br>int columnIndex) | Returns a particular
    cell of data based on the specified row and column index. This is the main method
    for retrieving information from the TableModel instance. |'
  merge: -1
  img_proc: true
