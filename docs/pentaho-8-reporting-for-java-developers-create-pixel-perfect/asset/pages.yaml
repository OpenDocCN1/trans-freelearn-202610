- pgno: 610
  md: '# Cross tabs using Java


    To understand the development of cross tab using Java, let''s introduce the various
    components used for its definition. First is the `CrosstabGroup` class, used to
    declare and manage cross tab instances in `MasterReport`. Differently from a regular
    element, a cross tab is added to a report using the `addRootGroup(CrosstabGroup
    crosstabGroup)` method.


    As you saw in Chapter 10, *Subreports and Cross Tabs*, cross tabs can use an MDX
    query or a more traditional SQL query with an MDX-like structure. In every case,
    the composition of the cross tab is done in steps: first defining the cross tab
    rows, then defining the cross tab columns, and only at the end defining the cross
    tab details.


    The definition of the cross tab rows starts from the `CrosstabRowGroupBody` object,
    identified from the `getBody()` method of the `CrosstabGroup` instance. Once identified,
    the `getGroup()` method defines the `CrosstabRowGroup` instance to be used to
    setup the query field (using the `setField(String field)` method), the element
    presenting the title (using the `getTitleHeader().addElement(Element element)`
    method), and the element representing the row values (using the `getHeader().addElement(Element
    element)` method).


    The definition of the cross tab columns starts from the `CrosstabColumnGroupBody`
    object, identified from the `getBody()` method of the `CrosstabRowGroup` instance
    used previously. Once identified, the `getGroup()` method defines the `CrosstabColumnGroup`
    instance to be used to setup the query field (using the `setField(String field)`
    method), the element presenting the title (using the `getTitleHeader().addElement(Element
    element)` method), and the element representing the column values (using the `getHeader().addElement(Element
    element)` method).


    The definition of the cross tab details is done by adding a new instance of the
    `CrosstabCell` element to the `CrosstabCellBody` instance, identified using the
    `getBody()` method of the `CrosstabColumnGroup` instance used previously. The
    `CrosstabCell` element is defined using the `addElement(Element element)` method
    where `Element` added is the query field containing the measure to be aggregated.'
  merge: -1
  img_proc: true
- pgno: 611
  md: '# An example of cross tab using Java


    To show in practice an example of cross tab using Java, let''s use the https://github.com/fcorti/pentaho-8-reporting-for-java-developers
    repository; specifically, the project pentaho-reporting-crosstab, stored in the
    Chapter 13 - Internationalization, sub-reports and cross-tabs using Java folder.


    As you can see from the PentahoServlet class, DataFactory declares an MDX query
    in a Mondrian cube provider. The Mondrian schema used in this example is the one
    you have already seen in Chapter 6, Configuring JDBC and Other Data Sources. Following
    is the source code defining the MDX query:


    ```

    factory.setQuery(

    "default",

    "SELECT " +

    " CrossJoin([Markets].Children, [Time].Children) ON ROWS," +

    " [Measures].[Sales] ON COLUMNS " +

    "FROM [SteelWheelsSales]");

    ```


    In the following piece of source code, we see the complete setup of the CrosstabGroup
    instance:


    ```

    ...


    // Defining the cross tab.

    CrosstabGroup crosstabGroup = new CrosstabGroup();


    // Defining the cross tab rows.

    CrosstabRowGroupBody rowBody = (CrosstabRowGroupBody) crosstabGroup.getBody();

    CrosstabRowGroup rowGroup = rowBody.getGroup();

    rowGroup.setField("[Markets].[Territory]");

    rowGroup.getTitleHeader().addElement(createDataItem("[Markets].[Territory]"));

    rowGroup.getHeader().addElement(createFieldItem("[Markets].[Territory]"));


    // Defining the cross tab columns.

    CrosstabColumnGroupBody columnGroupBody = (CrosstabColumnGroupBody) rowGroup.getBody();

    CrosstabColumnGroup columnGroup = columnGroupBody.getGroup();

    columnGroup.setField("[Time].[Years]");

    columnGroup.getTitleHeader().addElement(createDataItem("[Time].[Years]"));

    columnGroup.getHeader().addElement(createFieldItem("[Time].[Years]"));


    // Definin the cross tab details.

    CrosstabCellBody body = (CrosstabCellBody) columnGroup.getBody();

    CrosstabCell cell = new CrosstabCell();

    cell.addElement( createFieldItem("[Measures].[Sales]" ));

    body.addElement(cell);


    report.setRootGroup(crosstabGroup);

    ...

    ```'
  merge: -1
  img_proc: true
