- pgno: 64
  md: '# An advanced reporting algorithm


    The reporting algorithm is at the heart of Pentaho Reporting. This algorithm manages
    the layout and rendering of the entire report, no matter which output format is
    being rendered. This algorithm combines a reporting template and a dataset on
    the fly, in order to generate the final report. There is no unnecessary compilation
    step. All other Pentaho Reporting features can be described in the context of
    the overall reporting algorithm.


    This algorithm allows reports to render with a page header and footer, a report
    header and footer, group headers and footers, as well as a details band. The reporting
    algorithm traverses the dataset multiple times to render the report. In the first
    pass, the algorithm performs calculations and determines how to separate the data
    into groups, along with calculating the height and width of text and images. After
    the initial pass, the algorithm traverses the dataset a second time, in order
    to render the output.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# A multitude of available data sources


    Pentaho Reporting defines a standard Java API for accessing data. Many data source
    implementations are made available with Pentaho Reporting. The most commonly used
    implementations include JDBC and JNDI database connectivity, XML XPATH capability,
    and multidimensional OLAP data access using MDX and MongoDB NoSQL database support.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_65_0.png)


    **Java Naming and Directory Interface (JNDI)** is a Java API for a directory service
    that allows Java software clients to discover and look up data and objects via
    a logical name, decoupling the implementation from the configuration and settings.


    **Online Analytical Processing (OLAP)** is an approach to answering multidimensional
    analytical queries swiftly in computing. **Multidimensional Expressions (MDX)**
    is a query language for OLAP databases. Much like SQL it is a query language for
    relational databases.


    Additional data sources that are available include a Pentaho Data Integration
    data source, a **Hibernate Query Language (HQL)** data source, a Pentaho Metadata
    data source, a scripting data source (in JavaScript, Python, TCL, Groovy, and
    BeanShell), a simple table defined as a static list of rows and columns, and other
    advanced data sources (OpenERP data access, community data access, and sequence
    generator).


    Using Pentaho''s Data Integration data source, it is easy to use Excel, logs,
    or other file formats as inputs to a report, without the need to write any code.
    All these data sources interact with the Reporting Engine through a standard API,
    which is easy to extend.


    The following screenshot shows the available data sources in Pentaho Reporting:'
  merge: -1
  img_proc: true
- pgno: 66
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_66_0.png)


