    in terms of line spacing. For instance, 20% will show 5 grid lines and 10% will
    show 10 grid lines. Default is 25.0% or four lines. |

    | `radar-web-filled` | Boolean | Determines whether the web layers are filled
    in with solid colors or left as outlines. |


