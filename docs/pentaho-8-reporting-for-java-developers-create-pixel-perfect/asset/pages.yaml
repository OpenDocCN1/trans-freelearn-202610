- pgno: 666
  md: '# Introducing Pentaho Data Integration


    As part of Pentaho''s suite of products, Pentaho offers open source data integration.
    With an intuitive, graphical, drag and drop design environment and a proven, scalable,
    standards-based architecture, data integration is increasingly the choice for
    organizations over traditional, proprietary ETL or data integration tools. Pentaho
    Data Integration in its initial versions was called Kettle, so during your investigations,
    you may easily find it also named as PDI, DI, or Kettle.


    You probably know that ETL refers to the following processes: data extraction
    is where the data is extracted from homogeneous or heterogeneous data sources,
    data transformation is where the data is transformed for storing in the proper
    format or structure for the purposes of querying and analysis, and data loading
    is where the data is loaded into the final target repository. You will not learn
    in this book the basics of ETL, but you can easily find lot of literature dedicated
    to this topic in particular. If you are not aware about ETL principles and best
    practices, you can think of ETL as batch processes developed specifically to move
    data from a source to a target.


    As we did for the Pentaho Business Analytics Platform, in this chapter also you
    will use the Community Edition of Pentaho Data Integration, as it is downloadable
    and available for everyone without any cost. Of course, the description in this
    chapter is limited to an introduction and a description of what is strictly related
    to report''s management. If interested, a lot of resources are available for you
    to discover and become an expert of this ETL tool.'
  merge: -1
  img_proc: true
- pgno: 667
  md: '# Installing Pentaho Data Integration


    The installation of the Pentaho Data Integration is straightforward, following
    an *unzip and run* task. The prerequisites to run Pentaho Data Integration are
    simple; it requires a **Java Runtime Environment (JRE)** 8, already installed
    in your environment. Both Windows based operating systems and Linux based operating
    systems are supported. The screenshots and previews shown in this chapter are
    done using an Ubuntu 16.04.2 LTS distribution.


    Before installing the application, you can download the artifacts distributed
    in a ZIP file directly from the official Pentaho Community website (http://community.pentaho.com/)
    or from the Pentaho SourceForge website (https://sourceforge.net/projects/pentaho/).
    In both cases, you should download a ZIP file named something similar to `pdi-ce-<version>.zip`.


    Once the ZIP file is downloaded into your environment, unzip it into the final
    path (on a Linux-based operating system, the `/opt` path is suggested), and you
    will have all the Pentaho Data Integration available in the folder named `data-integration`.


    You probably will not believe it, but this is all that is needed to install Pentaho
    Data Integration into your environment.


    Pentaho Data Integration is mainly a Java application running at command-line
    and embedding the Pentaho Data Integration Engine. Pentaho Data Integration comes
    with some useful tools: Spoon, a graphical user interface that allows you to design
    transformations and jobs; Pan and Kitchen, used to run transformations and jobs;
    and Carte, a simple web server that allows you to execute transformations and
    jobs remotely. In this chapter, you will see Spoon and Kitchen in a use case example.'
  merge: -1
  img_proc: true
- pgno: 668
  md: '# Basics of Pentaho Data Integration


    As introduced previously, Pentaho Data Integration is an engine with very few
    graphical tools and interfaces. In accordance with this definition, the following
    sections describes some basic concepts for understanding its behavior and principles.'
  merge: -1
  img_proc: true
- pgno: 669
  md: '# Jobs and transformations


    Jobs and transformations are probably two of the most important core concepts
    in Pentaho Data Integration (and ETL in general, but with different naming).

    Quoting the Pentaho''s FAQs:


    > "Transformations are about moving and transforming rows from source to target.
    Jobs are more about high level flow control: executing transformations, sending
    mails on failure, transferring files via FTP, and so on. Another key difference
    is that: all the steps in a transformation execute in parallel, but the steps
    in a job execute in order."


    As you can read from this FAQ, transformations are based on the concept of streams
    of data as a potentially huge quantity of data migrating from a generic source
    to a generic target. A transformation can manage more than one stream, all of
    them executed in parallel and managed from the Pentaho Data Integration engine.


    In the following diagram, you can see a very basic example of transformation,
    developed using Spoon:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_669_0.png)


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_669_1.png)


    *Talking about streams, this is probably one of the most impressive points of
    strength of an ETL engine. It has the ability to manage huge quantities of data
    in parallel, in accordance with the limited resources of a server. This is one
    of the key differences from a regular application a developer can build using
    the traditional patterns.*


    Talking about jobs, a job is heavily based on the concept of a sequence of tasks,
    where it is mandatory to declare the starting point. The ability of the jobs to
    include other jobs or transformations as subtasks enables them to be a great way
    to manage complex migrations and reusable actions.'
  merge: -1
  img_proc: true
- pgno: 670
  md: 'In the following diagram, you can see a very basic example of a job, developed
    using Spoon:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_670_0.png)


    As you can see from the images, a hop connects one transformation step or job
    entry with another. The direction of the data flow is indicated with an arrow
    on the graphical view pane. A hop can be enabled or disabled (for testing purposes,
    for example) and can be conditional (in case of success or failure, for example).


    Both jobs and transformations can define parameters and variables. Parameters
    are defined as input for the execution and can be used to parameterize tasks.
    Variables are defined into the execution flow and can be used to parameterize
    tasks, exactly as the parameters.'
  merge: -1
  img_proc: true
- pgno: 671
  md: '# Steps and entries


    Steps and entries are the atomic parts of transformations and jobs, respectively.


    A step is one part of a transformation. There are over 140 steps available in
    Pentaho Data Integration. These steps are categorized according to their main
    function; for example, input, output, scripting, and so on. In order to perform
    specific tasks such as reading data from a flat file, filtering rows, and logging
    to database as shown in the preceding example, each step in the transformation
    is designed in a specific manner. Steps can be configured to perform the tasks
    you require. A step can have many connections—some join two steps together while
    some only serve as input or output for a step. One step named Pentaho Reporting
    output is available to manage Pentaho reports.


    A job entry is one part of a job. Job entries can provide you with a wide range
    of functionalities, ranging from executing transformations to getting files from
    a web server. There are over 100 entries available in Pentaho Data Integration
    and they are grouped according to function, similar to what was described for
    steps. None of the available entries have direct support for Pentaho reports.'
  merge: -1
  img_proc: true
- pgno: 672
  md: '# Database connections


    As you learned for Pentaho Reporting, in case of Pentaho Data Integration also,
    the database connections are used to read from a source or to write to a target
    repository. In case of Pentaho Data Integration, these kinds of data sources are
    focused on databases, but thanks to steps and entries, you have the opportunity
    to access different types of sources or targets.


    Database connections can be shared between jobs and transformations, and can be
    reused for better management and maintenance. The list of supported databases
    is not different from the one you saw for Pentaho Reporting. As you already know,
    it includes a wide variety of different vendors, types, and costs.'
  merge: -1
  img_proc: true
- pgno: 673
  md: '# Storage and reuse


    Jobs and transformations can be saved on a storage for future reuse. The format
    used by Pentaho Data Integration to save jobs and transformations is XML, so it
    can be saved on a file. A job is saved in a file with the `.kjb` extension and
    a transformation is saved in a file with the `.ktr` extension.


    Being files, jobs and transformations can be naturally saved into a filesystem,
    but this is not the only place where the `.kjb` and `.ktr` files can be stored.
    Pentaho Data Integration is able to retrieve and store jobs and transformations
    from the following types of storages:


    +   - **Pentaho repository**: You were introduced to the Pentaho repository in
    Chapter 15, *Using Reports in Pentaho Business Analytics Platform*. From a user
    perspective, the Penatho repository can be used as a remote filesystem owned by
    Pentaho Business Analytics Platform. The Pentaho repository is able to store,
    retrieve, and execute the `.kjb` and `.ktr` files.

    +   - **Database**: This is a regular database with some tables built from Pentaho
    Data Integration at creation time and managed during retrieving, saving, and execution.
    Jobs and transformations are not saved in their XML format, but stored as rows
    in several different custom tables.

    +   - **Filesystem**: You have already learnt that using a filesystem, jobs and
    transformations are saved in XML format as the `.kjb` and `.ktr` files.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_673_0.png)


    > *Even if the three different types of storage are supported, the use of Pentaho
    repository is recommended, because it is standard to use an XML format to store
    jobs and transformations (database storage is not human readable), and it is centralized
    and accessible through an API (filesystem is local to a server/machine).*'
  merge: -1
  img_proc: true
- pgno: 674
  md: '# Introduction of Spoon client


    PDI client (Spoon) is a desktop application you install on your workstation, enabling
    you to build transformations and jobs or schedule when jobs should run. Spoon
    is included in the standard Pentaho Data Integration distribution and can be launched
    using the `spoon` scripts into the `data-integration` folder (`spoon.sh` is for
    Linux-based operating system and `spoon.bat` is for Windows-based operating system),
    as shown as follow:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_674_0.png)


    You won''t discover all of the details about Spoon in this section, because it
    definitely needs an entire book for a deep dive. Instead, we would like to share
    that with a graphical interface, you have a visual representation of flows in
    transformations and jobs, as well as full control of their execution for debugging
    purposes. All the images presented in this chapter are done using Spoon, and in
    the following sections you will see a practical example of its use.'
