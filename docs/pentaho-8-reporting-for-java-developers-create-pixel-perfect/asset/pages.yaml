- pgno: 485
  md: '# Internationalization and Localization


    After the description of Pentaho Reporting parameterization, functions and expressions,
    environment variables, and formulas, in this chapter you will learn everything
    about, internationalization and localization of a Pentaho report. This Pentaho
    Reporting capability will enable you to manage reports for the best multi-language
    support, without any dependency on a specific language or alphabet, instead, using
    a generic approach with labels for texts and strings and some properties to be
    used for their replacement.


    This chapter is written as a reference manual for developers and information technologists.
    The goal is to share all the relevant and advanced features about internationalization
    and localization available in Pentaho Report Designer. After reading this chapter,
    you should feel comfortable with all the ways Pentaho Reporting can enable you
    to define reports in all the different languages you may need.'
  merge: -1
  img_proc: true
- pgno: 486
  md: '# Internationalization and localization


    As per every modern software, Pentaho Reporting is developed following all the
    best practices and patterns to support internationalization, so that it can be
    adapted to various languages, and regions without engineering changes.


    Localization is the process of adapting internationalized software for a specific
    region or language by adding locale-specific components and translating text.
    Localization (which is potentially performed multiple times, for different locales)
    uses the infrastructure or flexibility provided by internationalization (which
    is ideally performed only once, or as an integral part of ongoing development).


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_486_0.png)


    > *This description is mainly a quotation of the Wikipedia definition of internationalization
    and localization that you can find at https://en.wikipedia.org/wiki/Internationalization_and_localization.
    Even if the description is quite generic, it fits perfectly with Pentaho Reporting
    being developed as a standard (and modern) Java application.*


    To internationalize a Pentaho report, you must use the resource elements available
    within Pentaho Reporting when creating your report. Each resource element defines
    a resource base and a resource key reference. Normally, the resource base refers
    to the name of the message properties file in which localized names are kept.
    The resource key reference is a list of couples (`key` and `value`) where `key`
    identifies the unique identifier of the content and `value` identifies the content
    to be presented. The syntax used for the resource key is `key=value`.


    For default handling of resource bundles in Java, refer to Java''s *i18n* tutorial
    on resource bundles, at http://java.sun.com/docs/books/tutorial/i18n/resbundle/concept.html.'
  merge: -1
  img_proc: true
- pgno: 487
  md: '# Using resources to localize elements


    In Pentaho Report Designer, there are three different elements available to be
    used for localization: `resource-label`, `resource-field`, and `resource-message`.
    All of them are available in the report element palette and can be used as usual-by
    dragging and dropping the element in the chosen place of the right band, directly
    in the report canvas.


    The main idea behind the resource elements is that these kind of elements contain
    the key value for the resource and not directly the value to show. Once the key
    value is declared and used in a report element, a property file contains the association
    key/value and will be used at run time to show the final content to the user.


    Using the `resource-label` element within your report allows you to localize labels
    with static texts. As introduced previously, this element contains the static
    resource key that will be resolved at runtime using the resource bundles detailed
    in the following paragraphs.


    Using the `resource-field` element within your report allows you to localize dynamic
    data to a certain extent. Instead of providing a static resource key, this element
    type specifies the field data source where the key is generated from. For a complete
    solution to dynamic localization, you may want to investigate using the `Indirect
    Lookup` function (introduced in Chapter 8, *Parameterization, Functions, Variables,
    and Formulas*), in order to dynamically choose different localized columns in
    a database for populating a specific dynamic field.


    Using the `resource-message` element within your report allows you to localize
    messages writing multiple datatypes (text, string field, date field, and numeric
    field) into one object. Also, in this case, this element contains the static resource
    key that will be resolved at runtime using the resource bundles detailed in the
    following sections.'
  merge: -1
  img_proc: true
- pgno: 488
  md: '# Resources for localization


    As introduced previously in the chapter, the localization of a Pentaho report
    requires some resources to resolve the keys declared in the report elements. Starting
    from the Report Designer user interface, you can access the resources from the
    upper menu, in File | Resources.... Once selected, the Resource Editor will appear
    as shown in the following screenshot:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_488_0.png)


    In few words, the Resource Editor is nothing more and nothing less than a manager
    of property files. By default, it contains the default file (translations.properties),
    but you will soon learn how to add and remove other property files. The property
    files defined here are part of the Pentaho report and for this reason are stored
    directly in the .prpt file.


    Using the buttons on the right, you can create, edit, remove, and even import/export
    property files. We will not detail the behavior of each button here, because it
    is supposed to be easy to understand, considering that it is nothing less and
    nothing more than a well known management of property files.


    Instead of this, we would like to discuss how to manage the key/value pairs for
    a specific resource file. As an example, select the translations.properties resource
    and click on the Edit button. Once clicked, the Edit Property window is shown,
    as in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 489
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_489_0.png)


    Starting from here, the task is a simple editing of a property file, where you
    can add, modify, or delete the entries in the format `key=value`. As an example,
    you can check the following pairs:


    ```

    title=My report

    companyName=ACME, Inc.

    ```


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_489_1.png)


    *Always double-check the keys you will manage in the resource files. Keys are
    case sensitive and must be exactly the same as those used into the report elements.
    If you misspell even a digit, the final content will not be shown and it''s always
    a relevant loss of time to identify these kind of bugs.*'
