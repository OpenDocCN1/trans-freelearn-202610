- pgno: 497
  md: '# Subreports and Cross Tabs


    In this chapter, you will learn the ins and outs of two advanced reporting topics:
    subreports and cross tabs. Subreports allow you to embed reusable reports within
    a master report. As you will see, with the help of examples, subreports can take
    on many forms, from multi-page detail reports to summary subreports that include
    charts. As two specific types of subreports, you will learn about table of content
    element and index element. Along with subreports, you will learn how to incorporate
    cross tabs in your reports. Cross tabs allow you to compare multiple variables
    in a single table of data values.


    This chapter is written as a reference manual for developers and information technologists.
    Reading this chapter, you should feel comfortable with all the advanced features
    of subreports and cross tabs available in Pentaho Report Designer. This is the
    last chapter dedicated to Report Designer and it covers the last advanced features
    of this front-end tool of Pentaho Reporting.'
  merge: -1
  img_proc: true
- pgno: 498
  md: '# Subreports in Pentaho Report Designer


    Subreports in Pentaho Reporting may be included in any band of a report, except
    for the page header and page footer bands. Subreports receive a DataRow of parameters,
    determined by the current state of their parent report when rendering the subreport.
    These parameters may be used when executing a subreport query or referenced directly
    in the subreport. Within subreports, you define named queries that may reference
    the DataRow of parameters passed in, allowing a subreport to query only the currently
    scoped data and not the entire data set available to the parent report.


    Subreports may be of any length, may be included in other subreports in a nested
    fashion, and may also be presented alongside one another in their parent report.
    When spanning multiple pages, special considerations must be made, including how
    to handle the master report''s page header, page footer, and group headers. This
    chapter will cover all these topics in the following examples.'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# Subreport example


    In this example, you will build a report which includes a very classical use case
    scenario: a master-detail report where the master is represented from orders (with
    order number and date) and detail is represented by a subreport containing products,
    quantity, and price. To begin with, let''s start with an empty report (clicking
    on the blank report icon (□) of the Report Designer) and a JDBC data source created
    as described in Chapter 6, *Configuring JDBC and Other Data Sources*. The JDBC
    data source is supposed to be defined on the `SampleData (Local)` connection and
    the following content:


    ```

    SELECT

    "PUBLIC"."ORDERS"."ORDERNUMBER",

    "PUBLIC"."ORDERS"."ORDERDATE"

    FROM

    "PUBLIC"."ORDERS"

    ```


    From here, drag the `ORDERNUMBER` and `ORDERDATE` fields and drop them into the
    `Details` band of the empty report. Change `ORDERNUMBER` style to bold and stretch
    `ORDERDATE` to cover the remaining width of the page.


    Till now, nothing is really different from what you learnt in the previous chapters.
    Let''s now add a subreport representing the details of the order. To add the subreport,
    drag the subreport icon (≡) from the element palette and drop it below the fields,
    in the `Details` band. Once dropped, a modal window will open with the question:
    do you want to include an inline-subreport or a banded-subreport? Choose an inline-subreport
    if you want to cover a customizable rectangular area to put the content inside
    or choose the banded-subreport if you want to place the content in sub-band included
    in the report''s band. Click on the Inline button and another tab with a subreport
    icon (≡) will open, similar to a brand new report.


    The new tab contains the subreport and it''s really a new report inside the master
    report. The subreport is made of data sources, layout, elements, and everything
    you have seen until now while reading this book. Being a real report, a window
    asks you to specify the data source. In our example, will will create a brand
    new JDBC data source, using the `SampleData (Local)` connection and the following
    query. To create the data source, press the well-known plus green icon (⊕) and'
  merge: -1
  img_proc: true
- pgno: 500
  md: 'follow the same path as described in Chapter 6, *Configuring JDBC and Other
    Data Sources.*


    ```

    SELECT

    "PUBLIC"."ORDERDETAILS"."PRODUCTCODE",

    "PUBLIC"."ORDERDETAILS"."QUANTITYORDERED",

    "PUBLIC"."ORDERDETAILS"."PRICEEACH"

    FROM

    "PUBLIC"."ORDERDETAILS"

    WHERE

    "PUBLIC"."ORDERDETAILS"."ORDERNUMBER" = ${ORDERNUMBER}

    ORDER BY

    "PUBLIC"."ORDERDETAILS"."ORDERLINENUMBER" ASC

    ```


    Before defining the content of the subreport, go back the master report (click
    on the report tab in the report canvas) and move the subreport element immediately
    under the ORDERDATE field. Stretch it to cover the entire width of the ORDERDATE
    element, until the right edge of the page.


    Back to the subreport tab, drag the three fields and drop them into the Details
    band of the empty subreport. First, place the QUANTITYORDERED and PRICEEACH fields
    on the right of the band and then place the PRODUCTCODE field on the left, stretching
    it to cover the entire free space.


    Lastly, let''s manage the ORDERNUMBER parameter used in the subreport or, more
    precisely, used in the subreport''s data source. With this example of use of the
    subreport in the Details band of the report, each subreport instance depends by
    one order in particular. To pass the order number from the master report to the
    subreport, a parameter must be configured.


    As you learnt in Chapter 8, *Parameterization, Functions, Variables, and Formulas*,
    the report parameters live in the report explorer, in particular, in the Data
    tab. Also, in case of subreports, the parameters can be managed from the same
    place, with two main differences. The first difference is that the subreport parameters
    are always used to move values from/to the master report and not asked to the
    user. The second difference is that the subreport parameters are grouped in import
    parameters and export parameters. As you can expect, import parameters are used
    to pass values from the master report to the subreport, and export parameters
    are used to pass values from the subreport to the master report.


    In our example, you need an import a parameter to use the ORDERNUMBER values in
    the subreport. To define the parameter, right click on the Parameters item in
    report'
  merge: -1
  img_proc: true
