  md: '# KettleDataFactory


    The `org.pentaho.reporting.engine.classic.extensions.datasources.kettle.KettleDataFactory`
    class allows you to populate your report from a Kettle transformation. **Kettle**
    is a data integration tool, also known as an **Extract Transform and Load (ETL)**
    tool. Kettle transformations support a multitude of data source inputs and transformation
    capabilities. Kettle, also known as **Pentaho Data Integration**, provides mechanisms
    to incorporate data from Excel, SQL, XML, Text, and many other data sources. It
    also provides the ability to combine the results into a single result set, which
    Pentaho Reporting can use to render a report.


    To initialize `KettleDataFactory`, you must provide the location for the Kettle
    transformation to execute, along with the step within the transformation to use
    the data from. This is done via the `KettleTransformationProducer` interface.
    There are two implementations of `KettleTransformationProducer` that are provided.
    The first is `KettleTransFromFileProducer`, which loads a Kettle transformation
    from the file system. The `KettleTransFromFileProducer` class must be instantiated
    with the following parameters: final String transformationFile, // the path of
    the transformation file to execute.

    final String stepName, // the step name to collect data from.

    final FormulaArgument[] argumentNames, // the names of reporting properties to
    be passed into Kettle via Transformation Arguments.

    final FormulaParameter[] variableNames // the names of reporting properties to
    be passed into Kettle via Transformation Parameters.


    The second implementation of `KettleTransformationProducer` is `KettleTransFromRepositoryProducer`.
    This loads the transformation from an existing Kettle repository. The `KettleTransFromRepositoryProducer`
    class must be instantiated with the following parameters:


    ```

    final String repositoryName, // the repository name.

    final String directoryName, // the repository directory.

    final String transformationName, // the transformation name in the repository.

    final String stepName, // the step name to collect data from.

    final String username, // the repository user name.

    final String password, // the repository password.

    final FormulaArgument[] argumentNames, // the names of reporting properties to
    be passe

    final FormulaParameter[] variableNames // the names of reporting properties to
    be passe

    ```'
  merge: -1
  img_proc: true
