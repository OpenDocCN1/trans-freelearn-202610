    ![](img/9337ac94537bf7e092e1ea6531dce8fd_298_0.png)


    > The *Open Database Connectivity (ODBC)* is a standard API for accessing DBMS.
    The designers of ODBC aimed to make it independent of database systems and operating
    systems.


    The available buttons are easy to understand: the Test button tries to access
