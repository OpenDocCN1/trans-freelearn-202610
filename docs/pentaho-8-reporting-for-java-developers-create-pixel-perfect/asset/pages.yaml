- pgno: 198
  md: '# Font properties


    Pentaho Reporting uses Java’s built-in font support for most of its font operations.
    Some additional functionality exists in `libfonts`, providing the report engine
    with additional information that is not available through Java’s standard `Font`
    and `FontMetrics` API.


    In Pentaho Report Designer, fonts may be modified in multiple ways. First, all
    text-based elements contain font properties. These properties allow the selection
    of font family, font size, and font style. When editing these properties through
    the menu Format | Font..., the following screen is presented:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_198_0.png)


    In addition to modifying the property, Pentaho Report Designer also provides a
    toolbar (shown in the following screenshot), where you can quickly modify the
    font name, size, style, and alignment:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_198_1.png)


    Another way to configure fonts is by using the element property that has the following
    properties available:


    | Name | Type | Description |

    |------|------|-------------|

    |      |      |             |'
  merge: -1
  img_proc: true
- pgno: 199
  md: '| family | Selection | A string that represents the font type, for instance
    `SanSerif.` |

    | font-size | Integer | A number that represents the point size of the font. |

    | bold | Boolean | If set to true, it displays the font in bold. For example,
    if the formula is set to true, the font will appear as bold. |

    | italics | Boolean | If set to true, it displays the font in italic. |

    | underline | Boolean | If set to true, it displays the font underlined. |

    | strike through | Boolean | If set to true, it displays the font with a strikethrough.
    |

    | smooth | Selection | If set to `auto`, the fonts above 8 points have anti-aliasing
    enabled. If set to `always`, all fonts have anti-aliasing enabled. Finally, if
    set to `never`, no fonts have anti-aliasing enabled. |

    | embed | Boolean | If this style equals true, embeds the fonts included in the
    report, while rendering PDF. |


    Additional font-related issues may arise if a report is designed in one operating
    system environment and published in another. For instance, Windows operating systems
    come with a different standard set of fonts than Solaris, Mac, and Linux systems.
    Pentaho Reporting does its best to match the correct font, but you should verify
    after publishing that font sizes and styles are still working as expected.'
  merge: -1
