    | Name | Type | Description |

    |---|---|---|

    | y2-same-as-y-axis | Boolean | Sets the Y2 axis (the right side axis) to the
    same tick intervals as the Y1 (left side) axis. |

    | y2-axis-title | String | Sets the title for the Y2 (right-side) numeric data
    axis. |

    | y2-font | String | Sets the font for the Y2 (right side) axis title. |

    | y2-sticky-0 | Boolean | If the range includes zero in the Y2 (right side) axis,
    making it sticky will force truncation of the axis to zero, if set to true. The
    default value of this property is true. |

    | y2-incl-0 | Boolean | If set to true, the Y2 (right side) axis will force zero
    to be included in the axis. |

    | y2-auto-range | Boolean | If set to true, the Y2 (right side) axis will be automatically
    adjusted depending on the content. |

    | y-2min | Decimal | The minimum value to render in the Y2 (right side) axis.
    |

    | y2-max | Decimal | The maximum value to render in the Y2 (right side) axis.
    |

    | y2-tick-interval | Decimal | The numeric interval value to separate Y2 (right-side)
    ticks in the chart. |'
