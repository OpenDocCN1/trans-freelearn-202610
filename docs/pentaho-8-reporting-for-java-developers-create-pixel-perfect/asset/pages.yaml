- pgno: 599
  md: '# Resources for localization using Java


    To internationalize a report, you must use the resource elements available within
    Pentaho Reporting when creating your report. Each resource element defines a resource
    base and a resource key reference. Normally, the resource base refers to the name
    of the message properties file in which localized names are kept. For default
    handling of resource bundles in Java, see Java''s *i18n* tutorial on resource
    bundles at http://java.sun.com/docs/books/tutorial/i18n/resbundle/concept.html.


    Once you have built your report, you will want to configure your application to
    access the resource bundle files. Pentaho Reporting defines the `ResourceBundleFactory`
    API, which allows you to customize how these files are loaded. By default, a report
    is configured to use the `DefaultResourceBundleFactory` implementation, which
    uses Java''s `ResourceBundle` implementation. This implementation resolves the
    provided resource base value on the Java classpath.


    The `ResourceBundleFactory` is also responsible for determining the specific locale
    to use when rendering the report. The `DefaultResourceBundleFactory` uses the
    default system locale, but also contains the `setLocale()` method for configuring
    the locale if necessary. This behavior will be used in our examples to control
    the final version of the report by setting the default locale.


    Using the resource elements in your report allows you to localize labels, fields,
    and messages, as you learnt in Chapter 9, *Internationalization and Localization*.
    In particular, `resource-label` has a corresponding class in `ResourceLabelElementFactory`,
    `resource-field` has a corresponding class in `ResourceFieldElementFactory`, and
    `resource-message` has a corresponding class in `ResourceMessageElementFactory`.
    In the following example, you will see how to use `ResourceLabelElementFactory`
    only, but the use of the other resource factories follows the same principles.'
  merge: -1
  img_proc: true
- pgno: 600
  md: '# Testing the localization using Java


    As you read in the previous section, the control of ResourceBundle is done using
    the locale. By default, the system locale is used and can be made explicit with
    the following source code:


    ```

    ```java

    Locale locale = new Locale();

    ```

    ```


    If you want to control (and change) the default locale, you can setup its value
    with the following source code (the example shows how to set the Spanish language):


    ```

    ```java

    Locale locale = new Locale("es");

    Locale.setDefault(locale);

    ```

    ```


    This small piece of code is extremely useful during the tests, if you want to
    programmatically control the locale of your Pentaho report. In the following example,
    you will see how to switch from the default locale to a custom locale to test
    the final version.'
  merge: -1
