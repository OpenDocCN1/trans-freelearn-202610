- pgno: 496
  md: '# Summary


    In this chapter, you learnt everything about internationalization and localization
    using Pentaho Report Designer. You started with the definition of internationalization
    (and i18n) and then you saw what localization means in case of a Pentaho report.
    To make everything practical, you saw how to include resource elements (`resource-label`,
    `resource-field`, and `resource-message`) and how to resolve the content using
    the resource bundles. At last, you also saw how to test the various localizations
    for your Pentaho report.


    To complete the description, for future reference, you also saw how to localize
