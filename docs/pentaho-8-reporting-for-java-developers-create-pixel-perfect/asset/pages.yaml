- pgno: 234
  md: '# Page Header and Page Footer properties


    The `Page Header` and `Page Footer` bands appear at the beginning and end of each
    page, determined by the specific output format.


    These bands differ slightly from the common properties defined earlier. The `pagebreak-before`
    and `pagebreak-after` properties do not apply to these bands. Also, the following
    properties are available in addition to the defaults: `display-on-firstpage`,
    `display-on-lastpage`, and `sticky`.


    In addition to the common properties, the `table` set is provided with the following
    properties:


    | Name | Type | Description |

    |------|------|-------------|

    | `col-span` | Integer | Column span in case of HTML rendering |

    | `row-span` | Integer | Row span in case of HTML rendering |


    In the `excel` set, `page-header-left`, `page-header-center`, and `page-header-right`
    are provided with decimal values.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Report Header and Report Footer properties


    `Report Header` and `Report Footer` appear at the beginning and end of a report,
    and are often used to display the title and summary information, like charts,
    tables of contents, and so on. `Report Header` and `Report Footer` have the `table`
    set as additional properties beyond the common set.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Group Header and Group Footer properties


    The `Group Header` and `Group Footer` bands may appear for each defined group
    configured as part of the report. A grouping defined in a report is a set of identical
    values in one or more selected data columns. A new group is triggered when the
    values change in the defined group column(s).


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_236_0.png)


    > *It''s critical that columns defined as groupings are sorted appropriately before
    being passed into Pentaho Reporting, otherwise duplicate groups may appear in
    the rendered report.*


    `Group Header` and `Footer` differ slightly from the common properties defined
    earlier, because the following properties are available in addition to the defaults:
    `repeat-header`, `sticky`, `page-header-left`, `page-header-center`, and `page-header-right`.
    `Group Header` and `Footer` have the `table` set as additional properties beyond
    the common set.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Details body properties


    `Details Body` consists of four distinct bands. The `Details Header` and `Details
    Footer` bands are rendered before and after a grouping of detail rows. A `Details`
    band is rendered for every row of data, and a `No Data` band is rendered when
    no data is available for the report. The `Details Header`, `Details Footer`, and
    `No Data` bands are hidden in the Report Designer by default.


    The `Detail Header` and `Detail Footer` bands share the same additional properties,
    `sticky`, `repeat-header`, `page-header-left`, `page-header-center`, and `page-header-right`
    as the group bands. In addition, the `table` set are provided as additional properties
    beyond the common set. The `table` set of properties is also provided to the `No
    Data` band. The rest of the detail bands define no additional properties beyond
    the common set of properties.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Watermark properties


    The `watermark` band appears behind all the other bands, and is used for background
    images and styling of the report. The `watermark` band has the `table` set as
    additional properties beyond the common set.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Report elements


    All available **report elements** appear in the palette and may be dragged and
    dropped into the report canvas. Report elements make up the content of your report.
    They range from the label and text elements to the graphic, chart, and sub-report
    elements.


    Like bands, the other report elements are also shown in the structure tab of report
    explorer and the list of properties is available in the report element properties.
    Like the elements described in the previous section, the report elements also
    inherit the existing properties from their parent and they propagate the common
    properties to the children elements.


    In this section, you will learn the properties related to each type of element
    in the palette. As we saw in the previous section about bands, you will start
    from the common ones and then you will see a detailed description for each element.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_239_0.png)


    > *Also valid in this case is the suggestion shared earlier in the book: play
    as much as you can with elements and Report Designer to have a direct experience.
    If you try adding elements to a sample report, you can check the properties in
    the panel and try to change the values, remembering the behavior. Again, direct
    experience is the best teacher.*'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Common properties


    Like bands and `Master Report`, the report elements also have common properties
    organized in groups for better understanding. Luckily, most of the common properties
    of the report elements are the same common properties you saw for bands.


    Thinking about this, it probably makes a lot of sense because report elements
    leave properties nested into bands, so it''s natural to find some (or all) of
    the generic properties of the bands, inherited into the children''s elements.


    Considering that the report elements are very specific for one purpose (labels,
    charts, fields from data sources, shapes, and so on), it will happen that some
    properties of the bands will be inherited in some report elements and not in others.
    In any case, you will find detailed the specific differences in sections dedicated
    to each type of report element.


