- pgno: 71
  md: '# Formulas and style expressions


    Report builders may define custom formulas and style expressions, using the OpenFormula
    standard, allowing for calculated values and dynamic formatting in their reports,
    such as aggregations, number formatting, as well as traffic lighting.'
