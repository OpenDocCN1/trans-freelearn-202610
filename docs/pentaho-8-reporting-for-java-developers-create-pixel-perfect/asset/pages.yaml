- pgno: 530
  md: '# Group and detail band hierarchy


    A group may contain either a `group-body` or `data-body` child XML element. A
    `group-body` contains the XML element `group`, used to represent a hierarchy of
    groupings. In addition to containing `group-body` or `data-body`, a `group` XML
    element may also contain the `group-header` and `group-footer` XML elements. The
    `group-header` and `group-footer` XML elements may contain a `root-level-content`
    XML element, which contains child layout elements.


    The `data-body` XML element contains the bands relevant to row level data in your
    report. This XML element may contain `detail-header`, `details`, `no-data`, and
    `details-footer` child XML elements. Each of these elements may contain a `root-level-content`
    XML element, which contains child layout elements.'
  merge: -1
  img_proc: true
