- pgno: 284
  md: '# Considerations for different output formats


    Depending on your output format, there may be differences in the rendering of
    your designed report. You will cover some of the more common issues faced when
    rendering to various output formats. When developing your report, make sure to
    preview the report in the formats you plan to render in, in order to avoid any
    surprises after the publishing of your report.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# Cell output


    When rendering to CSV, Excel, RTF, and in some respects to HTML, cell layout becomes
    an important issue. The Pentaho Reporting Engine does its best to determine the
    most appropriate cell layout for your report, but certain practices are necessary
    to ensure a nice looking report.


    Alignment of elements is critical when dealing with cell output. Make sure all
    horizontal and vertical alignments are accurate. Even with subtle differences
    in horizontal or vertical locations, the report-to-cell-rendering algorithm can
    experience difficulties.


    The following screenshot shows an illustrative example; the elements in the report
    aren''t properly aligned:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_285_0.png)


    This is how the report will look in Excel:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_285_1.png)'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'Note how additional cells appear before the labels and make the final result
    absolutely imprecise and unprofessional. The following screenshot shows a report
    where the elements are properly aligned:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_286_0.png)


    This is what the Excel output will look:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_286_1.png)


    Another consideration when working with cell-based report generators is element
    overlap. Elements that overlap with one another will not render correctly, so
    it is important to avoid overlaps.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Paging


    Certain output formats, such as HTML, CSV, RTF, and Excel Output, treat the report
    (no matter how long the report is) as a single page. Use the page header and footer
    with the knowledge that many output types will not render identically.


    In relation to paging, Excel output offers the ability to treat sheets as pages,
    as long as explicit page breaks are specified in the report bands using the `page-break-before`
    and `page-break-after` style attributes.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Limits to rich graphics and charts


    While certain formats, such as Excel, HTML, and PDF, support images and charts,
    others such as CSV, Text, and RTF do not have the capability to embed these rich
    elements. Keep that in mind when designing your reports.


    Certain graphical elements, such as ellipses, do not render in most formats. Always
    verify how a report looks by previewing in the expected format.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Summary


    In this chapter, you explored in-depth the ins and outs of design and layout of
    reports using the Pentaho Report Designer. You first learned about the various
    user interface components that make up the Report Designer. From there, you dove
    deep into each reporting band and its properties. You learned that each band may
    be accessed via the tree structure, and each band may display in the canvas as
    well as offering properties in the property editor.


    You then took an exhaustive look at all the report elements. The chapter introduced
    you to the common properties seen throughout all the elements, along with displaying
    the dialogs that the various attributes present when editing. You also walked
    through utilizing the menu, toolbar, canvas, and shortcut keys to quickly arrange
    and layout your report. This included introducing shortcuts that make it easy
    to align and distribute groups of elements.


    Finally, the chapter touched on additional details when dealing with common issues
    with the various output formats that Pentaho Reporting supports.


    This chapter was written as a reference manual for developers and information
    technologists. The goal was to give you a detailed description of what will help
    you to develop the best reports, with the most accurate details. Now that you
    have read this chapter, you should feel comfortable with Pentaho Report Designer
    interface, and you should be able to use it to the best of its capabilities.


    In the next chapter, you will discover all the available ways Pentaho Reporting
    can define data sources. You will go through Pentaho Report Designer again, but
    you will see in Chapter 12, *Developing Using Data Sources*, how to re-use what
    you are going to learn in the following topic.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Configuring JDBC and Other Data Sources


    In Chapter 4, *Creating a Report with Report Designer*, you saw how to create
    a report from scratch using Pentaho Report Designer. As an exercise, you created
    a data source defining the list of fields requested for viewing results, making
    charts, calculating formulas, and so on. In this chapter, you will go through
    the details of the founding concept of the data source, discovering all the available
    types and their specific features.


    In this chapter, you will start with an introduction about data source management
    using the Pentaho report, diving deep into all the different data sources one
    by one, and learning how to configure them using Pentaho Report Designer. In particular,
    you will see:


    +   - The data source for a DBMS using JDBC

    +   - The data source for metadata in XML metadata interchange format

    +   - The data source for MongoDB

    +   - The data source for Pentaho Data Integration transformation

    +   - The data source for an OLAP schema (Mondrian)

    +   - The data source for XML

    +   - The data source for a table structure

    +   - Advanced data sources with Report Designer

    +   - The data source for Pentaho community data access


    A similar chapter, covering the data source topic using the Pentaho Reporting
    SDK, will be Chapter 12, *Developing Using Data Sources*, entirely dedicated to
    the developer experience.


    This chapter is written as a reference manual for developers and information technologists.
    The goal is to share all the relevant and advanced features about data sources
    in Pentaho Report Designer. At the end of this chapter you will feel comfortable
    with all the ways it offers to connect to a source. This is the very first step
    to go through in the development of a simple and complex Pentaho'
  merge: -1
