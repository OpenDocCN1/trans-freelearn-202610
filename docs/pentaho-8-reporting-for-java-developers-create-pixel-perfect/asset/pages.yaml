- pgno: 328
  md: '# The Pentaho community data access data source


    The **Community Data Access (CDA)** data source is an interesting type related
    to the so called Pentaho CDA. Pentaho CDA was designed to allow great flexibility
    for data sources. Most of the available tools can perform queries over a single
    data source and there''s no easy way to combine data coming from different databases
    or in different languages (combining data from an SQL query with data from an
    MDX query). These tasks usually require an independent ETL job to synchronize
    different data sources and build a new database. Pentaho CDA was developed as
    an abstraction tool between database connections and **Community Dashboard Framework
    (CDF)**, but in this context are used also in reporting.


    Once this data source type is selected, a modal window is shown, as follows:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_328_0.png)


    As you can see at the top of the window, a URL pointing to the Pentaho Business'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'Analytics Platform is required (you will learnt more about it in Chapter 15,
    *Using Reports in Pentaho Business Analytics Platform*). After the definition
    of credentials (Username and Password), Solution, and Path, the Fetch button lets
    you extract all the available Pentaho CDA deployed in the Pentaho Business Analytics
    Platform. Once listed, in the bottom panel you can edit the parameters passed
    to the data access, using the Edit Parameter button.


    To complete the description, the Preview button is the same as you saw for the
    previous data sources and the OK/Cancel buttons are the standard ones used to
    confirm/cancel the current operation.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Summary


    In this chapter, you learnt everything Pentaho Report Designer can do with data
    sources, discovering all the available types and their specific features. You
    started with an introduction to how a data source looks in the user interface
    and how the fields are used in the layout of the report. Then you moved on to
    discover how to manage all the possible types of data sources using Report Designer,
    finding out all about:


    +   - The JDBC data source

    +   - The metadata data source

    +   - The MongoDB data source

    +   - The Pentaho Data Integration transformation data source

    +   - The OLAP data source in various versions (legacy and generic, normalized
    and denormalized, standard, and custom)

    +   - The XML data source

    +   - The table data source

    +   - The advanced data sources (scriptable, external, sequence generator, and
    OpenERP)

    +   - The Pentaho community data access data source


    Now that you have read this chapter, you should feel comfortable with all the
    ways Pentaho Report Designer offers to connect to a source. This is the very first
    step to go through in the development of a simple and complex Pentaho report.


    In the next chapter, you will learn everything about including graphics and charts
    in your Pentaho reports.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# Including Graphics and Charts in Reports


    After the discovery of all the possible data source types, in this chapter you
    will learn how to incorporate graphics and charts in your Pentaho reports. You
    will start understanding how to include graphics and charts from the Pentaho Report
    Designer and then you will move on to the description of all the settings and
    configurations. Graphics and charts will be described one by one, as we did for
    the data sources, with the goal to make you a real expert for the best final result;
    the most useful and appealing report for your customers and manager.


    In particular, the charts discussed are bar charts, line charts, area charts,
    bar line charts, pie charts, multipie charts, ring charts, bubble charts, scatter
    plot charts, XY bar charts, XY line charts (regular and extended), XY area charts,
    XY area line charts, waterfall charts, radar charts, thermometer charts, bar-sparklines,
    line-sparklines, and pie-sparklines.


    This chapter is written as a reference manual for developers and information technologists.
    The goal is to share all the relevant and advanced features about graphics and
    charts that are available in Pentaho Report Designer.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Including static images in reports


    Including static images in your Pentaho report is useful, because in that way
    you can add logos, and graphics in general, to make the final result more appealing
    for the users.


    To include static images in your report, select the image icon (🖼️) from the Report
    Designer palette and place it into your report. Double-click on the element, or
    right-click on it by selecting Edit Content, to bring up a resource dialog where
    you can browse to the specific file location. You may select the Link to option
    to link an external resource, or you may select Embed to include the image in
    the `.prpt` file.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_332_0.png)


    > *If you are in doubt, using the embedded image is always a good choice, as you
    can avoid the bad side effect of a change in the external link. When embedding
    the image, the dimensions of the `.prpt` file will be bigger.*'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Including dynamic images in reports


    Including dynamic images in your Pentaho report is useful, because in that way
    you can add logos, and graphics in general, that may change according to a data
    source. As an example, we can imagine a report changing its logo depending on
    the department of the user or the image of a product in a product list.


    To add dynamic images to your report, use the image-field icon (🖼️) from the Report
    Designer palette and place it in your report. The content field accepts different
    types of image inputs for rendering. By double-clicking on the element, you can
    edit the source pointing to the right field of your dataset. If you have a field
    that contains a URL or file system location to your image, the image-field element
    will render the specified image.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Including charts in reports


    Including charts in your Pentaho reports makes a difference because of two main
    reasons: it''s powerful and it''s easy. Pentaho charts are powerful because they
    give you the ability to represent complex information in a single image (the chart
    itself) with many different styles. They are easy because the inclusion of chart
    in a report can be easily done with a configuration (and not development), starting
    from a data source.


    > *Pentaho Reporting relies on JFreeChart. The JFreeChart project was founded
    in February 2000 and today it is the most widely used chart library for Java,
    with more than 2.2 million downloads to date.*


    To add charts to your report, drag the chart icon (📊) from the Report Designer
    palette and drop it in the place where you want to see the chart. Usually, a chart
    is placed in a grouping band like Report Header or Group Header (and rarely on
    footers or Page Header). This is because a chart makes sense if used on a collection
    of data and not on single values. In any case, nothing really limits your fantasy
    and you can place the chart anywhere in the report.


    Once dropped in the report canvas, an image similar to the following one is shown:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_334_0.png)


    Double-clicking on the image or right-clicking and selecting chart, the chart
    editor similar to the following screenshot is shown:'
  merge: -1
  img_proc: true
- pgno: 335
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_335_0.png)


    Looking at the chart editor, three main areas appear when editing a chart. The
    first area is on top of the panel and lists all the available types of charts
    (17 in Pentaho Reporting 8.0). The second area, on the left side, contains a set
    of properties related to chart rendering. The third tabbed area of properties,
    on the right side, is related to the data that populates a chart.


    Selecting one type of chart, the property panel is updated according to the selection,
    as well as the panel of data properties. In the following sections, you will see
    in detail all the available properties for all the types of charts.


    As you can expect, the different types of charts are suitable for different use
    cases. If you want to show the strength of a trend for a single value over time,
    the best chart types are:


    +   - Line

    +   - Area

    +   - XY line area

    +   - XY line'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'If you are directly comparing two or more related values, the best chart types
    to choose are:


    +   - Pie

    +   - Ring

    +   - Bar

    +   - Line

    +   - Area

    +   - Radar


    If you want to show how one set of values directly affects another, the best chart
    types are:


    +   - Bar line combination

    +   - Waterfall


    If you are comparing a large number of data points, the best chart types are:


    +   - XY dot (scatter plot)

    +   - Bubble

    +   - Pie grid (multipie)'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Types of datasets


    All chart types receive their data from different types of datasets. Each chart
    can be compliant with one or more dataset types. Dataset types can be selected
    and managed in the chart editor through the right panel.


    Following are sections on each type of dataset, describing in detail their properties
    and their meanings. During the description, you will also discover the chart types
    compliant with each type of dataset. Also, in case of dataset types, the properties
    are grouped for better management and understanding.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Category dataset


    The first type of dataset is known as a **category dataset**, where the dataset
    series and values are grouped by categories. A series is like a subgroup. If the
    exact category and series appear, the chart will sum the values into a single
    result. The following table is a simple example of a category dataset:


    | Category | Series | Sale price |

    |---|---|---|

    | Store 1 sales | Cash | 14 |

    | Store 1 sales | Credit | 12 |

    | Store 2 sales | Cash | 100 |

    | Store 2 sales | Credit | 200 |


    The charts that use the category dataset are: bar chart, line chart, area chart,
    bar line chart, waterfall chart, and radar chart.


    Pentaho Reporting builds a category dataset using `CategorySetDataCollector`.
    Also available is `PivotCategorySetCollector`, which pivots the category and series
    data. Collector classes implement Pentaho Reporting''s function API. You can view
    (and change) the collector from the chart editor, in the data properties panel,
    as the first drop-down menu in the tabs.


    In the following section, you can see listed the set of properties defined to
    control the category dataset using the chart editor. The properties are grouped
    in'
  merge: -1
  img_proc: true
- pgno: 339
  md: the same way as they are grouped in the element properties panel.
  merge: -1
  img_proc: true
- pgno: 340
  md: '# Common properties


    In the following table you can see listed, the set of properties defined for common
    properties:


    | Name | Type | Description |

    |---|---|---|

    | `category-column` | String | Field name of the data source representing the
    category |

    | `value-column` | Array of strings | Field names of the data sources representing
    the values |'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Series properties


    In the following table you can see listed, the set of properties defined for series
    properties:


    | Name | Type | Description |

    |---|---|---|

    | series-by-values | Array of strings | Specifies the values you are charting.
    Series are usually placed in the chart legend. |

    | series-by-fields | Array of strings | Specifies the fields you are charting.
    Series are usually placed in the chart legend. |

    | auto-generate-series | Boolean | If true, then when the items advance, no action
    is taken to accumulate data. This should only be used with a group specified so
    that when the groups advance, the data can be properly accumulated. |'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Group properties


    In the following table you can see listed, the set of properties defined for group
    properties:


    | Name | Type | Description |

    |---|---|---|

    | `group-by` | Selection | This property defines the group level at which the
    data should be collected |

    | `reset-group` | Selection | This property defines the group level at which the
    data should be reset |'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# Optional properties


    In the following table you can see listed, the set of properties defined for optional
    properties:


    | Name | Type | Description |

    |---|---|---|

    | `cross-tab-column-filter` | Selection | This property defines the group level
    at which the data should be filtered in cross tab |'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Pie dataset


    Differently from the category dataset, the **pie dataset** defines the dataset
    series and values (categories are not defined). A series is like a subgroup. If
    the exact series appears, the chart will sum the values into a single result.
    The following table is a simple example of a pie dataset:


    | Series | Sale price |

    |---|---|

    | Cash | 14 |

    | Credit | 12 |

    | Cash | 100 |

    | Credit | 200 |


    The groups of charts that use the pie dataset are pie charts and ring charts.


    Pentaho Reporting builds a pie dataset using `PieDataSetCollector`. Considering
    that the pie dataset is a sort of simplified version of the category dataset,
    in the following list we describe the differences in the set of properties defined
    to control the pie dataset:


    +   - In the common properties, the pie dataset has only the `value-column` property
    containing the field name of the data source representing the values. Note that
    differently from the category dataset, this field is not an array of strings but
    a string.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '+   - In the series properties, the pie dataset has only `series-by-field`
    and `auto-generate-series`. Check the category dataset for the meaning of these
    two properties.

    +   - Group properties and optional properties are the same as those of the category
    dataset. Check the category dataset for a detailed explanation of the properties
    included in the groups.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# XY series and XYZ series dataset


    Another two similar types of datasets are known as **XY series dataset** and **XYZ
    series dataset**. Both types of datasets are dimensional groups of values that
    may be plotted in various forms. In these datasets, the series may be used to
    draw different lines, and so on. The following is a simple example of an XY series
    dataset:


    | Series | Cost (X) | Sale price (Y) |

    |---|---|---|

    | Cash | 10 | 14 |

    | Credit | 11 | 12 |

    | Cash | 92 | 100 |

    | Credit | 105 | 200 |


    As you can figure out, the XYZ series dataset is a three dimensional group of
    values, different from XY series dataset, which is a bidimensional group of values
    (all the rest is the same). The groups of charts that use the XY series dataset
    are scatter plot charts, XY bar charts, XY line charts, XY area charts, extended
    XY line charts, and XY area line charts. The groups of charts that use the XYZ
    series dataset are the same that use the XY series dataset, plus bubble chart.


    Pentaho Reporting builds a XY series dataset using `XY-SeriesCollector` and builds
    a XYZ series dataset using `XYZ-SeriesCollector`. Both the datasets define a set
    of'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'properties not so different from the category dataset. They are described in
    detail, as follows:


    +   - In the common properties, the XY series dataset and the XYZ series dataset
    define `x-value-columns` and `y-value-columns` as the field names of the data
    source representing the values for the x axis and the y axis respectively. Only
    for the XYZ series dataset is the `z-value-columns` property also provided.

    +   - The series properties, group properties, and optional properties are the
    same as of the category dataset. Check the category dataset for a detailed explanation
    of the properties included in the groups.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_347_0.png)


    *If you take a look at Pentaho Reporting 8.0 (as an example), another collector
    is provided with the name `IntervalXY-SeriesCollector`. Unfortunately, Report
    Designer does not work for this type of dataset, so we can only suppose that it
    will be something closed to the datasets detailed here.*'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Time series dataset


    Another type of dataset is known as the **time series dataset**, which is a two
    dimensional group of values that are plotted based on time and date. The time
    series dataset is more like an XY series than a category dataset, as the time
    scale is displayed in a linear fashion with appropriate distances between the
    different time references. The following is a simple example of time series dataset:


    | Time | Series | Sale price |

    |---|---|---|

    | Jun 02, 2017 11:05 pm | Cash | 14 |

    | Jun 04, 2017 12:42 pm | Credit | 12 |

    | Jun 05, 2017 04:25 pm | Cash | 100 |

    | Jun 07, 2017 01:52 pm | Credit | 200 |


    The groups of charts that use the time series dataset are scatter plot charts,
    XY bar charts, XY line charts, XY area charts, extended XY line charts, and XY
    area line charts (exactly like the XY series dataset).


    Pentaho Reporting builds a time series dataset using `TimeSeriesCollector`. The
    Time series dataset defines a set of properties not so different from the category
    dataset. They are described in detail, as follows:


    +   - In the common properties, the time series dataset `category-time-column`
    defines the field name of the data source representing the time, and `time-period-type`'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'lets you define the granularity, from second, minute, hour, day, week, month,
    quarter, or year. The property `value-column` is provided and it has the same
    meaning (and type) as of the category dataset.


    +   - The series properties, group properties, and optional properties are the
    same as those of the category dataset. Check the category dataset for a detailed
    explanation of the properties included in the groups.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Thermometer dataset


    Last but not least, the thermometer dataset is used to implement a variation of
    the typical *traffic light* indicator. The dataset requires only a single value
    to work, and if you have more than one row of data per grouping, the chart collector
    will aggregate all values together as one big sum.


    Due to its specific nature, the dataset is used by only one chart, called thermometer,
