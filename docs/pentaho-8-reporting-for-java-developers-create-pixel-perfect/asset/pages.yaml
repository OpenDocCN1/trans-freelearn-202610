- pgno: 188
  md: '# The Structure tab in report explorer


    As described in the previous section, the report explorer panel has a tab called
    Structure, which displays the entire report in object tree form. This tab, or
    rather the tree structure represented in it, is one of the key tools in the hands
    of the developers. Using this tool, the developers can control the fine tuning
    of the report.


    In the tree structure is represented a hierarchy of objects, each one identifying
    one (and only one) element of the report. Everything in the report is an element
    and every element has a parent with zero or more children. One element must have
    one parent only and it cannot have multiple or zero parents. A unique exception
    is the root, who has any parent.


    About the root: on top of the hierarchy there is always a unique element called
    Master Report. Master Report is an invisible element in the report, but it is
    where everything starts defining design, layout and everything that is included
    in your report.


    Moving (or deleting) an element from the report will also move (or delete) the
    entire subtree of elements. Try to add an element to the report canvas and check
    how the tree structure changes. Try to move an element from its parent to a different
    element in the hierarchy and see how the report canvas changes. The more you use
    the tree structure now, the more confident you will be with report development
    in your future projects.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_188_0.png)


    > *Take your time to play with the structure tab in the report explorer. Being
    confident with it will let you have full control of your report and the fine tuning
    of all the structure, properties, and so on.*'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# The report element properties


    Another key concept in report designing is the element''s property. An element''s
    property is the atomic value or description or configuration or settings of an
    element in the report. Each element can have zero or more properties. On average,
    an element has a variable number of properties (depending on the element''s type).
    The properties are grouped in sets for better understanding and better selection
    during development.


    The main place to find the list of properties is the element property panel. The
    element property panel is defined by two tabs: the Style tab containing all the
    properties related to the layout and rendering, and the Attributes tab containing
    all the properties related to all the generic settings and configurations.


    Each tab is defined by a list of properties related to an element, each one showing
    a couple of objects: the property name and the property value (or values). The
    property value can be defined by a value (depending on the type of property) or
    a dynamic formula. The majority of the properties in the element property panel
    have a green plus icon (⊕) on the right. Clicking the green plus icon (⊕) gives
    you access to the formula editor (we will introduce the formula editor in the
    following chapters). The following is an example of a property as presented in
    the user interface. In this case, `font-size` is the property with a value of
    10.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_189_0.png)


    Selecting an element in the report and then selecting one of the children, you
    can easily notice that the values of the common properties are inherited from
    one element to the other. This give us the opportunity to talk about the inheritance
    of the properties of one report: each element defined in a report inherits the
    value of the common properties from the parent, and the parent from its parent,
    and so on.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_189_1.png)


    > _If you want to change a global property for a report (font, size, colors, borders,
    and so on), it may be enough for you to change the value of the corresponding
    property in `Master Report`. The value of_'
  merge: -1
  img_proc: true
- pgno: 190
  md: '*the property will be propagated to all the descendants (that is, to the whole
    report) until one of them explicitly rewrites the value.*


    You can easily recognize that a property value is inherited from the parent if
    the flag ☑ is checked in the corresponding item in the element property panel.
    As you can imagine, you can break the inheritability, changing the value of the
    property. Doing this, the flag is automatically set to *unchecked*. From that
    point onwards, all the descendant elements will inherit the new property value,
    until another explicit change is set up. Clicking again on the flag (☑) icon,
    you can instruct Report Designer to again inherit the property value from the
    parent element, as it was by default.


    The properties in each tab are grouped in sub-sets, for better selection and search
    during the development. The sub-sets are named using a meaningful description,
    like: `size & position`, `font`, `text`, `text-spacing`, `object`, `link`, `excel`,
    `padding`, `border`, `query`, `common`, `query-metadata`, `parameter`, `wizard`,
    `html`, `html-event`, `pdf-event`, `swing-event`, `advanced`, `pentaho`, and a
    few more.


    Selecting an element in the report (using the report canvas, using the report
    explorer, or any other possible way using the Report Designer), the element property
    panel will show all its available properties. Each change of the property value
    is immediately reflected in the report preview in the report canvas.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Master report and report bands properties


    Now that the concepts of element and property have been introduced, let''s start
    talking about the root of a report (the `Master Report` element) and the first
    level in the tree structure, the bands. Specifically, we are going to describe
    the properties related to each type of element, starting from the common ones
    and then describing the specific ones, element per element.


    Every Pentaho report you create has a `Master Report` element as the root of the
    tree hierarchy. The `Master Report` element is not explicitly visible in the preview
    or the report canvas, but it contains a set of general properties. In the following
    section, dedicated to the `Master Report` element, you will learn more about the
    specific properties of this root element.


    When first creating a report, in your canvas and report explorer structure tree,
    you will see: `Page Header`, `Report Header`, `Details`, `Report Footer`, and
    `Page Footer` band. These bands, along with other bands, including `Group`, `Watermark`,
    and `No Data`, make up the entire visual report. All bands may contain elements
    from the palette and act as containers for rendering these elements. Each band
    has a different life cycle and is rendered based on its context.


    To better explain the importance of the properties and their role in a report''s
    development, you will find quoted some examples of Pentaho reports in the https://github.com/fcorti/pentaho-8-reporting-for-java-developers
    repository; more precisely, in the `Chapter 05 - Design and layout in Report Designer/my_reports`
    path. Each report shows the use of a relevant property (or a set of properties)
    as an example and can be a guide for your understanding and learning.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Common properties


    As introduced in the section *The report element properties*, the inheritance
    of property values between nested elements is a relevant feature of Pentaho Reporting.
    Of course, the inheritance works if the same property is used in both the parent
    element and the child element. This concept introduces the principle that a bunch
    of common properties are shared (and inherited) between the various elements.
    In this section, you will dive deep into the common properties between the `Master
    Report` element and the various types of bands.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Size and position properties


