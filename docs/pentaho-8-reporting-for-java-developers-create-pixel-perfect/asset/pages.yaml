- pgno: 90
  md: '# Setting up the Pentaho Report Designer


    As you can expect, the first task for our goal is to download Pentaho Report Designer
    from the correct website. The distribution packages are available in a couple
    of places: on the SourceForge website ([https://sourceforge.net/projects/pentaho](https://sourceforge.net/projects/pentaho))
    and directly on the official Pentaho website ([http://community.pentaho.com/projects/reporting](http://community.pentaho.com/projects/reporting)).
    In every case, the distribution packages are free for downloading and no fee or
    costs should be asked.


    If you choose to download Pentaho Report Designer from the official Pentaho website,
    an automatic redirect will send you to the SourceForge website. To find the right
    distribution in the SourceForge website, follow the `Report Designer` folder in
    the `Files` repository. There you will find one subfolder for each version. Choose
    the latest available, in our case version 8.0.


    In the distribution folder, you can find three packages available (let''s ignore
    the `.sum` files containing checksum strings only). The first two packages, `prd-ce-mac-*.zip`
    and `prd-ce-*.zip`, contain the binary distribution for macOS and Windows/Linux
    operating systems. The third package, `pre-classic-sdk-*.zip`, contains the Reporting
    SDK.


    Once you have downloaded the binary distribution of the Pentaho Report Designer,
    create a directory in your machine and, inside that, unzip the content of the
    package. Once the content is unzipped, you will find a script named `report-designer`
    in the main directory.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_90_0.png)


    > _Of course, if you are working with a Windows-based operating system, run the
    `report-designer.bat` script. If you are working with a Linux-based operating
    system, run the `report-designer.sh` script. If you are on macOS, find the Pentaho
    Report Designer in your finder and double-click directly on the application._


    After running the script, the user interface should appear and a welcome screen,
    similar to the following one, will be shown on your desktop:'
  merge: -1
  img_proc: true
- pgno: 91
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_91_0.png)


    At this point, you may want to create a shortcut to your desktop or something
    that will make the run easier. In any case, congratulations, you have successfully
    installed Pentaho Report Designer!


    Pentaho Report Designer, by default, comes packaged with the core Pentaho Reporting
    Engine libraries, so you now have the necessary reporting components to complete
    the examples described in this book.


    If you have experienced difficulties installing Pentaho Report Designer, there
    are some common troubleshooting issues that you will want to verify. The most
    common issue is related to the Java virtual machine and SDK that you have installed.
    The `report-designer` script uses the first Java command found on the system path.
    Therefore, you will want to verify that your path is configured correctly. You
    can do this by executing the command `java -version` in a command window, in order
    to see which version of Java you are using.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# The SampleData schema


    Together with the distribution package, the installation of Pentaho Report Designer
    comes with a database schema called `SampleData`. The `SampleData` schema contains
    a complete set of tables and data, to be used in your tests and training in general.
    In this book, you are going to use this database in all of the exercises. You
    will see for yourself that `SampleData` is a great starting point for every common
    need around reporting.


    Nothing has to be done to setup and use the `SampleData` schema. Pentaho Report
    Designer comes with the HyperSQL RDBMS onboard and it is a natural choice considering
    that HyperSQL is an engine completely written in Java and does not require any
    installation or complex task to make it work.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_92_0.png)


    > *If you want more information about HyperSQL RDBMS, you can check the huge quantity
    of documentation and tutorials available on the web or directly in the official
    website (http://hsqldb.org).*


    As you probably know, a HyperSQL database is contained in a bunch of files, all
    stored in a unique folder of the filesystem. In case of `SampleData`, you can
    find it on the `<report-designer>/resources/sampledata` path.


    Database apart, Pentaho Report Designer contains bundled a data source connected
    to the `SampleData` schema. We will see in detail what a data source is and how
    a data source is used in your reports, but for now, it''s enough for you to know
    that you can easily have access to it from inside the Pentaho Report Designer,
    immediately and automatically after a correct installation.


    To complete the introduction of the `SampleData` schema, let''s take a look at
    the list of tables included in it. This is relevant because you will use these
    tables in queries several times in this book and, hopefully, you will use them
    in all your'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'initial tests and experiments, as follows:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_93_0.png)


    We won''t see more than this the SampleData schema, but this introduction has
    been relevant for you, because now you can easily understand all the queries we
    are going to develop. As you will see soon in the following sections, queries
    are the first step in developing all the reports using Pentaho Reporting.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Introduction to the user interface


    Now that you have Pentaho Report Designer installed in your environment and you
    know how to launch it, let''s move another step forward, introducing the user
    interface. After launching the Pentaho Report Designer, you will notice the following
    six main graphical components. All together, the components work with the unique
    goal to create the report. From the top left to the bottom right of the window,
    you can recognize:


    +   - The menu and toolbar, where you can request the execution of all the possible
    actions on reports

    +   - The report element palette, where you can select report elements for your
    report

    +   - The report canvas tab panel, which displays your report

    +   - The report explorer panel, with the Structure and Data tabs, displaying
    the entire report in object tree form

    +   - The element properties panel, displaying all the styles and attributes associated
    with the currently selected report element

    +   - The messages panel, displaying warnings and errors related to the currently
    opened report


    The following is a screenshot highlighting the listed components and their place
    in the Pentaho Report Designer user interface:'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_95_0.png)


    Considering that the components should be managed with high confidence to have
    great results, following are their brief descriptions, to ensure you understand
    their uses and their purposes in the report''s development from the very beginning.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Menu and toolbar


    The menu and toolbar contain useful functionalities to make building a report
    easier. Along with basic functionalities like saving, opening, and publishing,
    you have access to a lot of advanced features. Many of the options in the menu
    and toolbar are available as shortcut keys. The purpose of the Pentaho Report
    Designer''s menu and toolbar is not different from a standard menu and toolbar.
    They contain all the available features, collected in a sequence of descriptions
    and icons, all clickable to complete a specific task.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Report element palette


    The report element palette panel is located on the left side of the Pentaho Report
    Designer and contains an icon list of the types of elements that can be placed
    on the report. The report element palette includes labels, shapes, fields, charts,
    subreports, and a lot of interesting and useful basic elements that you can use
    to develop your reports exactly as you (or your customers) want.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_97_0.png)


    > *To add an element to your report, drag the icon from the palette and drop it
    directly into the report canvas. Probably, you will start understanding that everything
    is extremely easy and not for pure developers only (at this stage).*'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Report canvas tab


    The report canvas tab panel is located in the center of the Pentaho Report Designer
    and it is sort of a preview of your final result. Once you have created a new
    report or opened an existing one, this is where you drag and drop the elements
    to build your preferred layout.


    In design mode, the canvas displays some so-called report bands (we will see in
    detail in the next chapters what report bands are and what they do). The canvas
    offers many visual features that allow you to manage the alignment and sizing
    of your report elements. This is the place where the magic happens and you will
    be able to move, adjust, and tune the report to be exactly what you (or your customers)
    want. In addition to the design canvas, you can also preview the current report
    directly in this panel.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_98_0.png)


    > *You can quickly toggle between live data and the report template in this fashion.
    This will make the development of your report easier and immediately tested from
    a user perspective.*'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Report explorer


    The report explorer, located on the right side of the Pentaho Report Designer,
    includes the Structure tab panel and the Data tab panel. The Structure tab panel
    contains the tree structure of the report, including all the report bands. The
    Data tab panel contains all the data sources, functions, and parameters of your
    report. On right-clicking various portions of the structure and data trees, the
    interface shows a lot of possible options, such as adding new data sources and
    subgroups. The report explorer may be hidden through the window application menu.
    Together with the canvas tab and the element properties, it is one of the most
    powerful components of the Pentaho Report Designer.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_99_0.png)


    > *It is highly recommended to start understanding as soon as possible how the
    report explorer works, as it can help you a lot, especially during the fine tuning
    of the precise placement of the elements in the report.*'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Element properties


    The element properties panel is located following the report explorer panel, on
    the right side of the Pentaho Report Designer, and displays the details of the
    currently selected item in the report explorer or canvas. All styles and attributes,
    which are editable, appear in this panel. Many editable properties provide additional
    dialogs for advanced editing capabilities. The report explorer may be hidden through
    the window application menu. Together with the canvas tab and the report explorer,
    it is one of the most powerful components of the Pentaho Report Designer.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_100_0.png)


    > *It is highly suggested to start understanding as soon as possible how the element
    properties works, as it can help you a lot, especially during the fine tuning
    of the precise placement of the elements in the report.*'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Messages


    The Messages panel is located at the bottom of the Pentaho Report Designer and
    displays any active warning or error that is present in the report. Selecting
    a message, the Report Designer will automatically select the element and property
    in question, making it easy to track down issues in your report. The Messages
    panel is hidden by default and can be made viewable through the window application
    menu. It is highly suggested to check the Messages panel quite often, because
    it contains the details of the potential issues your report could have when it
    is deployed into a production environment and, worst, submitted to a final user.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_101_0.png)


    *You can easily check for warnings or errors by looking at the small icon at the
    very bottom right of the user interface. You can see an example of the icon as
    a yellow triangle in the next screenshot. If you see an icon there, it is recommended
    to check the message box, as there is something you should solve in your report.*


    The following screenshot shows the Messages panel displaying an active warning:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_101_1.png)'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Creating your first report using the wizard


    Now that you have successfully installed Pentaho Report Designer and you are more
    confident with the user interface, in this section, you will walk through building
    a first complete report. The report you are going to develop will list all the
    products in the catalog defined in the `SampleData` schema and more precisely,
    stored in the `PRODUCTS` table. Before you begin, create a directory called `my_reports`
    on your laptop, to manage the files you will develop in this book.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_102_0.png)


    > *In the GitHub repository available at https://github.com/fcorti/pentaho-8-reporting-for-java-developers,
    you can find the source code described in all the examples of this book. In the
    `chapter 02 - Getting started with Report Designer/my_reports` folder, you can
    find the example described here, in the file named `my_first_report.prpt`.*'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Introducing the Report Design Wizard


    There are a two possible ways to create a report with Pentaho Report Designer:
    starting from a blank report or using the wizard. Neither of the two ways is better
    than the other. Each way has advantages and disadvantages and you should mature
    your own idea, after some experiences and some successes (or difficulties) in
    following one path instead of the other.


    The development starting from a *blank* report is suggested if you want to have
    full control over the details and behavior. The development using the wizard is
    suggested if your goal is to develop a standard report, quite simple in terms
    of structure, and also simple in terms of layout and customization. One of the
    most attractive advantages of the wizard is that you can choose the layout from
    a set of available templates, most of them nice enough to guarantee to be appealing
    to your users.


    As you can expect, in this book you will cover both the possible ways, but you
    are going to start by using the wizard because it is faster and simpler. After
    this first example, you will leave the wizard approach, preferring to start from
    a blank report.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_103_0.png)


    > *Before starting to develop the report using the wizard, let''s underline again
    one best practice: some developers prefer to start modifying a report built with
    the wizard, instead of starting from scratch. In principle, this is not bad, but
    what can be experienced is that you could have less control on some details, especially
    in fine tuning of the layout or some unexpected behaviors in particular cases.*


    To start the Pentaho Report Design Wizard, check the upper menu and click on the
    File item, and then on Report Design Wizard. Note that you can also use shortcuts
    (*Ctrl + Shift + N* in this case) as alternative to selecting the items from the
    menu. The following screenshot shows what the upper menu looks like:'
  merge: -1
  img_proc: true
- pgno: 104
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_104_0.png)


    Once you start the Pentaho Report Design Wizard, a model window appears, describing
    four steps:


    +   1. Look and Feel, where you choose your preferred layout from a list of possible
    templates

    +   2. Data Source and Query, where you define the dataset to use in your report

    +   3. Layout Step, where you define grouping and fields to show in the report

    +   4. Format Step, where you define the look and feel of each single item shown
    in the report


    A small description for each step, describing further details of the user interface
    you are going to see in your laptop, is presented as follows.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Defining the look and feel


    The modal window, shown as first task in the Report Design Wizard, defines the
    look and feel step. In this step, you can choose the layout of your report from
    a collection of possible templates. The following screenshot shows what the


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_105_0.png)


    window looks like:


    As you can see from the screenshot, the templates are previewed in a small image,
    giving the opportunity to see in advance what your report will look like. With
    Report Document, you can also use an existing report as a template. Be careful
    to use this feature or, at least, try to use it before any final decision (sometimes
    the result is not exactly as nice as you imagined). Once you have chosen the best
    template for your report, click on Next to move forward. In our exercise, you
    will use the Cobalt template as an example.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Defining the data source and query


    The second step of the Report Design Wizard is selecting the set of data. The
    set of data is usually identified as a query on a database, but can be defined
    on several other types of sources (called data sources). In our example, we are
    going to use the `SampleData` tables. In particular, we are going to inquire the
    table named `PRODUCTS`.


    Starting from the wizard window, on the top right corner, you should see a plus
    icon (+). Clicking on the plus icon (+), a window appears, asking you to select
    the type of data source you want to define. In the later chapters, we will see
    in detail all the available types of data sources, but at this stage, select `JDBC`
    to setup a standard query on a database schema. Immediately after the selection,
    a new window for the JDBC Data Source definition is shown as follows:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_106_0.png)


    In the preceding screenshot, you can see the final result where all the data is
    correctly filled. In your environment, the parts related to the queries (Available
    Queries and Static Query) should be empty. Starting from your environment, select
    the SampleData (Local) connection to instruct the wizard to use this as a source.
    Then press the green plus icon on the right of Available Queries; this action
    will add a new query to the list of the available ones (Available Queries).'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'The new query is defined with the name Query 1. You can decide to change the
    name of the query by typing into the Query Name field. We choose to keep the default
    name as an example in our first report. Now that the query is added, type the
    SQL command in the Query text field or press the pencil icon (✏️) to open a visual
    query composer.


    To test the data source, press the Preview button to execute the query and see
    the resulting dataset. If the preview shows the dataset, it means that everything
    is well defined. If not, check the connection to the SampleData schema and the
    syntax of the SQL command. To save the data source and use it in the report, click
    the OK button and you will return to Report Design Wizard. Once the data source
    is created, the wizard will show you a window, as follows:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_107_0.png)


    Select the new query (in our case Query 1) and move forward to the layout setup
    by pressing the Next button.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Defining the layout


    Now that you have completed the data source definition, it''s time to set up the
    layout of your report. In this step, you are going to select a subset of fields
    of the data source, defining the list of visible fields in the report. To create
    complex reports, the fields selected in this step are classified in two subsets:
    the group items and the detail items. In the group items, the wizard includes
    all the fields used to group the details (showing each value in a header of the
    resulting report). In the detail items, the wizard includes all the fields shown
    in the report as maximum level of detail.


    In our example, let''s act on the wizard''s window, selecting the fields of the
    data source from Available Items and pressing the yellow arrows, depending on
    the classification you want to give to the field: press the upper yellow arrow
    to include the field in Group Items or press the lower yellow arrow to include
    the field in Selected Items (the detail items). The following screenshot shows
    how the window looks after the correct grouping of the fields:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_108_0.png)


    *As you can see, not all the available fields of the data source are included
    in the group items or in the detail items. This feature helps a lot if you want
    to reuse the data sources in different reports. As*


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_108_1.png)'
  merge: -1
  img_proc: true
- pgno: 109
  md: '*an example, we can imagine using this data source to develop two similar (but
    different) reports: one showing the products per quantity and one showing the
    products per buy price.*


    Looking at our example, we set up the product vendor as a group item, and product
    code, product name, quantity in stock, and buy price as details of the report.
    With this configuration, the resulting report will show a list of product vendors
    and for each vendor, a list of details of the product, showing the code, the name,
    the quantity in stock, and the buy price.


    Once the layout step is completed, click on the Next button to move forward to
    the last step of formatting the fields.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Formatting the fields


    As a last step, the wizard requests to define the format of each field. Formatting
    definition is required for all the types of fields: the ones grouped in the group
    items and the ones grouped in the detail items. Formatting really depends on the
    classification of the field; for the fields in the group items, only a label is
    requested, while for the fields in the detail items, more details can be customized.


    We won''t cover further details about the possible settings, because it''s straightforward
    to understand how to setup the formatting using the wizard. To show the differences
    between the two, in the following screenshot is shown the settings defined for
    the field of the group items (in our example, only the


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_110_0.png)


    PRODUCTVENDOR field):


    The following screenshot shows the settings defined for the fields in the detail
    items (in our example, we see PRODUCTCODE only):'
  merge: -1
  img_proc: true
- pgno: 111
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_111_0.png)


    Back to our example, it is not required to modify any default settings. You can
    decide to modify the labels as an exercise, or change the setup to see how the
    final report changes, but in our case, it is not mandatory and we can be happy
    with what we have developed using the default setup. Now that we are happy with
    the report''s definition, let''s click on the Finish button to close the wizard
    and access the resulting report.


    Congratulations, you have created your first Pentaho report using the Report Design
    Wizard.


    *Once you have completed the example, feel free to repeat it, playing a little
    bit with the configuration and settings. It is always a good experience to try
    and see what happens to the final result. The more exercises you develop to try
    all the features, the more solutions you''ll have during the development of real-life
    reports for your final users and customers.*'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Previewing the report


    Now that the Report Design Wizard has completed its job, you have a fully featured
