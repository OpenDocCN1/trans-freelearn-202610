  md: '# XY area line chart


    The XY area line combines the XY area and XY line charts, allowing visualization
    of trends, along with comparisons. The XY area line chart is unique in that it
    requires two XY series datasets to populate the chart: the first dataset populates
    the XY area chart and the second dataset populates the XY line chart. In the same
    way that you saw for the bar line chart, in this case also both the Primary DataSource
    tab and the Secondary DataSource tab are available.


