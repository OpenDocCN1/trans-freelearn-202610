- pgno: 325
  md: '# External


    The external data source is used when a report is used in `.xaction`. You can
    refer to the official documentation for the (few) documents about this data source.
    Pentaho action sequence XML documents (`.xaction`) define activities such as database
    queries, report generation, and email actions, and the order in which they occur.'
  merge: -1
