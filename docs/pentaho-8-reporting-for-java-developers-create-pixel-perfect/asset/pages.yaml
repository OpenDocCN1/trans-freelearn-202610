- pgno: 466
  md: '# Date or time formulas


    These functions allow for creation and manipulation of `Date`, `Time`, and `DateTime`
    objects:


    | Name | Description |

    |------|-------------|

    | DATE | Creates a `Date` object based on the year, month, and day. |

    | DATEDIFF | Returns the difference between two dates, depending on the format
    code, which may be one of the following:

    - `y`: This means the difference in years

    - `m`: This means the difference in months

    - `d`: This means the difference in days

    - `yd`: This means the difference in days, ignoring the years

    - `ym`: This means the difference in months, ignoring the years

    - `md`: This means the difference in days, ignoring the months and years |

