  md: '# Waterfall chart


    The waterfall chart displays a unique stacked bar chart that spans categories.
    This chart is useful when comparing categories to one another. The last category
    in a waterfall chart normally equals the total of all the other categories to
    render appropriately, but this is based on the dataset, not the chart rendering.
    In the following description are listed all the differences in terms of available
    properties:


    +   - The options set has a subset of the properties described for the bar chart,
    limited to `horizontal` and `series-color`

    +   - The X axis set has the same properties as described for the bar chart, excluding
    `item-margin`

    +   - The general, y axis, and values sets have the same properties as described
    for the bar chart'
