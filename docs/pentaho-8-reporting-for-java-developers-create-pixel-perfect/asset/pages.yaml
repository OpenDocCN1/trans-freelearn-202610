    |---|---|

    |  | Valid for pan only. |

    | job | The name of the job (as it appears in the repository) to launch. Valid
    for kitchen only. |

    | dir | Path containing the transformation/job, including the leading slash. |

    | file | If you are calling a local .ktr/.kjb file, this is the path and filename.
    |

    | level | Logging level (Basic, Detailed, Debug, Rowlevel, Error, and Nothing).
    |

    | logfile | Local filename to write log output to. |

    | listdir | Lists the directories in the specified repository. |

