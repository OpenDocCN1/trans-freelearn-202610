- pgno: 326
  md: '# Sequence generator


    The sequence generator develops a sequence to be used in your report. As in previous
    data sources, you can create multiple queries and manage the addition/deletion
    of queries. For each query, you can define the group (numeric or system), the
    sequence (depending on group), and some other parameters.'
  merge: -1
