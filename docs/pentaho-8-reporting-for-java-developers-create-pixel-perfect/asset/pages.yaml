- pgno: 638
  md: '# Publishing a report in the Business Analytics Platform


    The first task to do to use a Pentaho report in the Business Analytics Platform
    is uploading it into the Pentaho repository. This is a preliminary task before
    every action, like previewing, scheduling, and so on. Once uploaded, the Pentaho
    report is automatically published and can be used to accordance with the Pentaho
    Business Analytics Platform permits and roles.


    A Pentaho report can be uploaded in a Pentaho repository following three main
    paths: the manual upload, the publication using the Pentaho Report Designer, and
    the bulk import. In the following sections, you will discover the first two paths,
    because the bulk import is a suggested way if you have to manage a total or partial
    restore of the Pentaho repository.'
