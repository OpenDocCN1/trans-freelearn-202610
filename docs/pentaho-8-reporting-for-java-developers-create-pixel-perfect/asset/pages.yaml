    for kitchen only. |

    | listrep | Lists the available repositories. |

    | exprep | Exports all the repository objects to one XML file. Valid for pan only.
    |

    | export | Exports all the linked resources of the specified job. The argument
    is the name of a ZIP file. Valid for kitchen only. |

    |  |  |'
