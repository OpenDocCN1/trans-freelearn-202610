- pgno: 156
  md: '# Adding details to Pentaho reports


    Now that the first data source is defined, let''s go ahead with the layout, building
    a very simple report with the available fields in the `Actuals` query. In order
    to develop the report using the `Actuals` query, you need to focus your attention
    on two different parts of the report: the Data tab in Report Explorer and the
    Details band in the report canvas.


    By dragging the query field from the Report explorer on the right and dropping
    it into the Details band in the report canvas, you can define the content of the
    report. As you can see trying into your development environment, in this way you
    can decide the precise position where to visualize the data, their order in the
    layout, and the length and height of each field. As you can expect, you can easily
    control a lot of settings, like for example, font and dimension, format and masks,
    coloring, alignment, and a lot of other useful things. All the customizations
    and configurations are possible using the Element properties panel in both the
    Style tab and the Attributes tab. Don''t worry if you feel that you don''t have
    the full knowledge and control of the capabilities; you will learn more about
    the fine tuning in the following chapters of the book.


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_156_0.png)


    > *Considering that often, experience is the best teacher, it would be great if
    you could play a little bit with the report, trying and testing what the report
    looks like if you change one of the settings instead of the other. Don''t worry
    about trying to change values, settings, and properties. You cannot break things,
    so feel free to try as much as you can.*


    Now that you know how to compose the details of your report starting from the
    query fields, let''s define the layout for this specific use case. You can see
    the screenshot of the Details band containing the `POSITIONTITLE` field, the `ACTUAL`
    field, and the `BUDGET` field as follows. Try to reproduce it in your development
    environment, as described previously, paying attention to the details of the position
    and length of each query field.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/9337ac94537bf7e092e1ea6531dce8fd_157_0.png)


    During the composition of the Details band, you have probably experienced the
    behavior described in the following screenshot. In case you overlap two fields,
    even partially, you will see one of the fields highlighted in red. In addition
    to this, a warning message will appear in the Message window with the description:


    ```

    Element ... overlaps with Element ... and will not be printed in table-exports.

    ```


    The following screenshot shows what the red highlight looks like:


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_157_1.png)


    What the warning message means and the implication of the overlap is quite easy
    to understand: overlapping the fields could cause problems in the final rendering
    of the report, hiding portions of the content. If this happens, don''t worry and
    adjust the position and dimension of the elements until the red highlight disappears.
    This behavior is perfectly regular during the development of a report and Pentaho
    Report Designer gives you a lot of help for the best result.'
  merge: -1
  img_proc: true
