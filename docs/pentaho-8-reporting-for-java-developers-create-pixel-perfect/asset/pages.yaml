- pgno: 143
  md: "# Including the SampleData schema\n\nAs described in Chapter 2, *Getting Started\
    \ with Report Designer*, the `my_first_report` report uses the `SampleData` schema\
    \ as data source. For this reason, you need to include it in the Java web application.\
    \ Including the `SampleData` schema in the Java web application is possible with\
    \ two simple tasks: making the `SampleData` HyperSQL database available in the\
    \ project and adding the HyperSQL client as dependency.\n\nTo make the `SampleData`\
    \ HyperSQL database available in the Java web application, create the path `pentaho-reporting-web-app/resources`\
    \ and copy the `sampledata` folder from `<report-designer>/resources` into it.\n\
    \nTo add the HyperSQL client as dependency of the Java web application, change\
    \ the `pom.xml` file located in the `pentaho-reporting-web-app` folder, according\
    \ to what is described as follows:\n\n```\n<project ...>\n...\n  <repositories>\n\
    \  ...\n  </repositories>\n  <dependencies>\n  ...\n\n  <!-- Add This here. -->\n\
    \  <dependency>\n    <groupId>org.hsqldb</groupId>\n    <artifactId>hsqldb</artifactId>\n\
    \    <version>2.3.2</version>\n  </dependency>\n\n  </dependencies>\n  <build>\n\
    \  ...\n  </build>\n</project>\n```\n\nThis is all you need to do to include the\
    \ `SampleData` schema in your Java web application."
  merge: -1
  img_proc: true
