  md: '# Parameterization, Functions, Variables, and Formulas


    In the previous chapters, you learned about Pentaho Report Designer, layout and
    design, and you saw the available elements and the different types of data sources.
    In this chapter, you will start off by learning how to parameterize a report.
    You will then learn about all the predefined functions and expressions available
    for use within a report. From there, you will learn about Pentaho Reporting''s
    environment variables and formula capabilities, including the correct syntax and
    available formula methods.


    This chapter is written as a reference manual for developers and information technologists.
    The goal is to share all the relevant and advanced features about parameterization,
    functions, variables, and formulas, there are available in Pentaho Report Designer.'
  merge: -1
