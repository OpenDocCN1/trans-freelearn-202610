  md: '# Adding the details header and customizing the details


    Now that the title is correctly developed in the report, we should work on the
    details again to improve the appeal of the final result. To reach that goal, let''s
    see how to add the header to the details and how to add alternate row coloring.


    By default, the report comes with a hidden details header band (as you can see,
    the details header band is not visible in the Report Canvas tab). To show the
    details header, select the Details Header item in the Structure tab of the Report
    explorer (Details Header is a child of Details Body). After this, toggle to the
    Attributes tab in the Element properties and change the hide-on-canvas property
    to false. Immediately, you will see that a new band called details header appears
    in the Report canvas.


    As you can expect, this band can be used as a regular band and should be filled
    in case you want to show something in your final version of the report, regarding
    the header of the details. In our example, we want to show one label as title
    for each field.


    Before adding the labels, click again on the Style tab of the Element properties
    and change the value of the text-color property to #77b3d4. This will give the
    labels a different coloring for a better result.


    To add the labels, drag the label icon (Ab) from the Report Element palette and
    drop it into the Details Header band. You should repeat this easy operation three
    times (one for each field of the details) and place the label in correspondence
    with the detail field in the Details band.


    For each label, set the font format to bold (clicking the B button in the font
    toolbar) and double-click the element to change the content to Position title
    (for the first), Actuals (for the second), and Budget (for the third). For the
    Actuals label and the Budget label, click on the right alignment icon (≡) in the
    font toolbar.


    To make the final version of the report more appealing, try to leave'
