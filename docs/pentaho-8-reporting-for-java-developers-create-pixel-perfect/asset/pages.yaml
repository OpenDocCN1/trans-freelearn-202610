- pgno: 7
  md: '# About the Author


    **Francesco Corti** is an enthusiastic consultant in software solutions and loves
    working in developer, sales, and customers teams. Proud of the role of a software
    engineer, he is often involved in pre-sales presentations, public speaking, and
    IT courses. Developing software, designing architectures, and defining solutions
    in ECM/BPM and BI are his favorite areas of interest. He has completed dozens
    of projects, from very small ones to more complex ones, in almost 20 years of
    experience.


    A product evangelist at Alfresco, Francesco represents the famous open source
    ECM in the developer community. In addition to helping developers adopt Alfresco
    technologies, he often helps Alfresco to improve the developer experience through
    talks, articles, blogging, user demonstrations, recorded demonstrations, or the
    creation of sample projects.


    He is the inventor and principal developer of Alflytics (previously named Alfresco
    Audit Analytics and Reporting), the main business intelligence solution over Alfresco
    ECM, entirely based on the Pentaho suite. He authored the Pentaho Reporting video
    course with more than 40 videos and courses on the Pentaho Reporting Designer
    and SDK.


    Francesco has specialty and principal experiences in enterprise content management
    solutions with Alfresco ECM and Hyland OnBase (he is an OnBase certified installer);
    business process management solutions with Activiti, JBPM, and Hyland OnBase;
    data capture solutions with Ephesoft, Hyland OnBase, and custom software; record
    management solutions with O''Neil software and custom software (using Alfresco
    ECM and Hyland OnBase); and portal and collaboration with Liferay and MS SharePoint.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# About the Reviewers


    **Ruben Oliva Ramos** is a computer systems engineer from Tecnologico de Leon
    Institute, with a master''s degree in computer and electronic systems engineering,
    teleinformatics, and networking specialization from the University of Salle Bajio
    in Leon, Guanajuato, Mexico. He has more than 5 years of experience in developing
    web applications to control and monitor devices connected with Arduino and Raspberry
    Pi using web frameworks and cloud services to build the Internet of Things applications.


    He is a mechatronics teacher at the University of Salle Bajio and teaches students
    of the master''s degree in design and engineering of mechatronics systems. Ruben
    also works at Centro de Bachillerato Tecnologico Industrial 225 in Leon, Guanajuato,
    Mexico, teaching subjects such as electronics, robotics and control, automation,
    and microcontrollers at Mechatronics Technician Career; he is a consultant and
    developer for projects in areas such as monitoring systems and datalogger data
    using technologies (such as Android, iOS, Windows Phone, HTML5, PHP, CSS, Ajax,
    JavaScript, Angular, and ASP.NET), databases (such as SQLite, MongoDB, and MySQL),
    web servers (such as Node.js and IIS), hardware programming (such as Arduino,
    Raspberry pi, Ethernet Shield, GPS, and GSM/GPRS, ESP8266), and control and monitor
    systems for data acquisition and programming.


    He has authored the book *Internet of Things Programming with JavaScript* by Packt
    Publishing. He is also involved in monitoring, controlling, and the acquisition
    of data with Arduino and Visual Basic .NET for Alfaomega.


    *I would like to thank my savior and lord, Jesus Christ, for giving me the strength
    and courage to pursue this project; my dearest wife, Mayte; our two lovely sons,
    Ruben and Dario; my dear father, Ruben; my dearest mom, Rosalia; my brother, Juan
    Tomas; and my sister, Rosalia, whom I love, for all their support while reviewing
    this book, for allowing me to pursue my dream, and tolerating not being with them
    after my busy day job.*'
  merge: -1
