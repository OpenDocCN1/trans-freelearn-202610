- pgno: 67
  md: '# A wide variety of output formats


    Pentaho Reporting has the ability to render to the most widely used output formats,
    including Adobe''s PDF standard using the iText library, Microsoft''s Excel standard
    using the POI library, and HTML, all highlighted in the following screenshot.
    Other available formats include XML, plain text, RTF, and CSV. In addition to
    these output formats, a Pentaho report can be rendered in Swing and directly printed
    using PostScript formatting, allowing print previewing capabilities.


    The following is a screenshot showing one such report obtained using Report Designer
    and rendered in PDF (top left), Microsoft Excel (top right), HTML (bottom left),
    and CSV (bottom right):


    ![](img/9337ac94537bf7e092e1ea6531dce8fd_67_0.png)'
