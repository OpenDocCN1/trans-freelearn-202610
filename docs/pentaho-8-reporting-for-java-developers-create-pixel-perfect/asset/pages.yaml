- pgno: 31
  md: '# Preface


    How many times you have been asked to develop appealing reports with the most
    up-to-date technology in a few days (or probably less) in various different formats
    using a web-based solution or a custom Java project? If this is the case, this
    book will enable you to reach that goal using the dedicated tool of the Pentaho
    suite, named Pentaho Reporting.


    This book is a definitive guide for Java developers and information technologists
    about the open source reporting tool, allowing you to create pixel-perfect reports
    of your data in PDF, Excel, HTML, text, RTF, XML, and CSV, based on a wide range
    of data sources, using a visual design environment and the SDK to embed the Pentaho
    Reporting Engine into your applications.


    The book is written when Pentaho Version 8 were about to be officially released,
    and it is mainly based on this version. The description of the features, tips
    and tricks and best practices is done using a learning-by-example approach. To
    better guide you through the different topics and the definition of a learning
    path, the book is organized into four main parts:


    +   - Introduction and basics of Pentaho Reporting

    +   - Core concepts and advanced features of Report Designer

    +   - All about the Reporting SDK

    +   - Additional Pentaho Reporting topics'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# What this book covers


    Chapter 1, *Introduction to Pentaho Reporting*, covers the typical uses, history,
    and origins of Pentaho Reporting, along with a more detailed overview of the reporting
    functionality that Pentaho Reporting provides.


    Chapter 2, *Getting Started with Report Designer*, is focused on getting up and
    running with Pentaho Reporting. It''ll begin by setting up an environment for
    building and embedding reports. From there, the reader will walk through creating
    a report using the wizard and will finish the chapter learning how to save the
    report into the filesystem.


    Chapter 3, *Getting Started with Reporting SDK*, is about the Pentaho Reporting
    SDK. The reader will walk through embedding an existing report into a generic
    Java application.


    Chapter 4, *Creating a Report with Report Designer*, goes one step further, covering
    the most commonly used features for creating a report from scratch instead of
    using the wizard. The core concepts, such as customizing the report, saving it
