    # 6.4 Adjusting for Covariates


    As we have seen earlier in Chapter 4, covariates may influence the accuracy of
    a marker and the ROC curve may need to be adjusted accordingly. It is easy to
    extend the regression models studied in Chapter 5 to the context of Cox regression,
    as follows:


    h(V | D, U) = \tilde{h}(v) exp{β₁ D + β₂ U + β₃ D U}


    This provides regression-based covariate adjustments for the Lehmann ROC curves.
    This construction is similar in the sense that an interaction between the gold
    standard, D, and the covariate, U, is included in the model. To see the form of
    the covariate-adjusted ROC curve, consider the ratio of the hazard functions of
    observations, one with D=1 and one with D=0:


    h(V | U, D = 1) / h(V | U, D = 0) = exp{β₁ + β₃ U}'
  merge: -1
  img_proc: true
- pgno: 84
  md: "and the form of the adjusted ROC curve follows:\n\ny = x^{θ(u)}\n\nwhere\n\n\
    θ(U) = β₁ + β₃U\n\nJust as in Chapter 5, the ROC curve for the covariate is unaffected\
    \ by β₂ but it is critical to include the main effect for age in the model; otherwise,\
    \ the estimate of β₃, the key component for the ROC curve, might be biased.\n\n\
    Continuing with the magnetic resonance example, age may be an important factor\
    \ in the accuracy of this type of magnetic resonance imaging, which focuses on\
    \ the water-fat ratio in the tissue. Because patients naturally accumulate fat\
    \ as they age, the marker may be less effective in the elderly, with the potential\
    \ for mistaking fat due to age for fat due to a benign lesion.\n\nThe following\
    \ PHREG call provides the required estimates:\n\n```\nproc phreg data=tmp1.ph;\n\
    \    model signal=grp age grpage/r1;\n    if group='normal' then grp=0;\n    else\
