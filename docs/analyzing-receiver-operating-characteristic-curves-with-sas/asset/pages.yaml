- pgno: 63
  md: '# Ordinal Predictors


    ![](img/ac26020abd4f22abfaafc0607939c6e4_63_0.png)


    +   5.1 Introduction .........................................................
    53

    +   5.2 Credit Rating Example...................................................
    54

    +   5.3 Empirical ROC Curve for Ordinal Predictors...............................
    54

    +   5.4 Area under the Empirical ROC Curve .....................................
    56

    +   5.5 Latent Variable Model ..................................................
    57

    +   5.6 Comparing ROC Curves for Ordinal Markers ...............................
    63


    # 5.1 Introduction


    Chapter 3 addressed the single continuous predictor, probably the most natural
    and common setting for ROC curves. Nevertheless, the idea of an ROC curve applies
    equally well to an ordinal predictor. This chapter investigates how techniques
    from the previous chapter can be extended to accommodate an ordinal predictor.


    Ordinal predictors can arise in a variety of ways. Sometimes, they are simply
    the result of categorization of an underlying continuous predictor. While this
    may result in the loss of information, and hence predictive accuracy, gains in
    having a simple and easy-to-communicate predictor may offset these losses. Rain
    forecasts might offer an example. Sometimes they are reported as low-medium-high,
    and other times they are reported in increments of 10%. Regardless of the terminology
    used to report the categorized predictors, data analysis can proceed using the
    predictors as ordinal.


    Ordinal predictions also can arise through expert opinions. Most subjective opinion
    is hard to quantify, but it is relatively easier to offer a few scenarios ordered
    according to their probability—in effect, reporting ordinal predictions. Examples
    can be found in practically any field, such as medicine (diagnostic radiologists
    reporting their assessment of the chance or severity of disease), business (consultants
    opining on the likelihood of consumer preferences), or finance (stock picks, reported
    as buy, stay, or sell).'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'From the perspective of ROC curves, there is a duality between continuous and
    ordinal predictors. Both the empirical curve and the binormal model can accommodate
    ordinal predictors, either directly or with some modification. Sections 5.3 and
    5.4 provide details.


    # 5.2 Credit Rating Example


    Consider the following data set collected and published by Güttler (2005) on the
    performance of the scoring systems of two of the most prominent credit evaluation
    agencies in the world: Moody’s and Standard and Poor’s. Table 5.1 reports the
    data on Moody’s ratings, which use 17 categories on an ordinal scale ranging from
    Aaa (most favorable rating) to C (least favorable rating). The Rating row lists
    these 17 ratings, the Default row contains the number of companies that defaulted
    on their loans during the follow-up period of the study, and the Total row presents
    the total number of companies receiving the particular credit rating during the
    same period. The goal of this example is to evaluate the accuracy of Moody’s ratings
    as predictors of the likelihood of default. For each of the 17 ratings, from Aaa
    to C, the total number in the sample and the number defaulting out of that total
    are provided.


    # Table 5.1 Moody''s Ratings


    | Rating | Aaa | Aa1 | Aa2 | A1 | A2 | A3 | A3- | Baa1 | Baa2 |

    | Default | 0 | 0 | 0 | 0 | 0 | 1 | 0 | 1 | 0 |

    | Total | 49 | 47 | 120 | 164 | 163 | 254 | 226 | 238 | 242 |

    | Rating | Baa3 | Ba1 | Ba2 | Ba3 | B1 | B2 | B3 | C |  |

    | Default | 1 | 1 | 1 | 2 | 8 | 15 | 13 | 55 |  |

    | Total | 212 | 105 | 108 | 175 | 238 | 215 | 139 | 164 |  |


    Note that Table 5.1 contains all the data. With ordinal predictors, you can display
    an entire data set with nearly 3,000 observations because the space requirement
    has more to do with the number of categories than with the actual sample size.
    This is in contrast with continuous data, where the original data are usually
    not reported due to space constraints.


    # 5.3 Empirical ROC Curve for Ordinal Predictors


    The empirical ROC curve for an ordinal predictor is built on the same principle
    as the empirical ROC curve for a continuous predictor. In fact, because the empirical
    ROC curve is based on the ranks of the data only, whether the predictor is ordinal
    or continuous has no bearing on the way the ROC curves are constructed. Thus,
    the methods from Chapter 3 can be used to construct and compare empirical ROC
    curves with ordinal predictors.


    To briefly review, using each distinct observed value of the ordinal predictor
    as a possible threshold, you can compute the sensitivity and specificity of the
    resulting binary predictor. A scatter plot of sensitivity versus one minus specificity
    for each threshold constitutes the ROC points. Note that the following code is
    identical to the program used in Chapter 3 for continuous predictors:'
  merge: -1
  img_proc: true
- pgno: 65
  md: "```\nproc logistic data=moody;\n    model default=moody / outroc=rocdata;\n\
    run;\n\naxis1 length=12cm order=0 to 1 by 0.2 label=(f=swissb h=2)\nvalue=(font=swissb\
    \ h=2) offset=(.5 .5)cm;\naxis2 length=12cm order=0 to 1 by 0.2 label=(a=90 f=swissb\
    \ h=2)\nvalue=(font=swissb h=2) offset=(.5 .5)cm;\n\nsymbol1 v=none i=join c=black;\n\
    \nproc gplot data=rocdata;\n    plot _sensit_*_1mspec_ / haxis=axis1 vaxis=axis2;\n\
    run;\nquit;\n```\n\n# Figure 5.1 ROC Points for Moody’s Rating Data\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_65_0.png)\n\
    \nFigure 5.1 contains the ROC points for Moody’s ratings obtained using PROC LOGISTIC.\
    \ Note that, for this work, the variable moody has to be numeric. Also note the\
    \ use of the OFFSET= option of the AXIS statement to print some white space on\
    \ the two edges of the two axes for improved display. Also note that none of the\
    \ companies receiving one of the first five ratings (AAA through A2) defaulted,\
    \ so all five ratings are represented by the same point in the upper right corner\
    \ (100% sensitivity and 100% specificity)."
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The term ROC points is used intentionally. Figure 5.1 does not have an ROC
    curve, only points each of which is a feasible operating point for Moody’s ratings.
    It is possible to connect these points, just as we did for a continuous predictor,
    ending up with an ROC curve. You could argue that because unobserved intermediate
    thresholds are not possible by definition of the ordinal predictor, the resulting
    curve is not meaningful. Imagine that you connected the dots in Figure 5.1. There
    is no Moody’s score between B2 and C, so the points on the line segment connecting
    the two leftmost points in the figure represent the operating characteristic (i.e.,
    sensitivity and specificity) of thresholds that do not exist. The counterargument
    holds that the levels of most ordinal scales are arbitrarily defined and can be
    changed. If the ordinal predictions are obtained by categorizing a continuous
    predictor, then it is possible to explicitly revisit the thresholds. In the case
    of subjective opinions, experts can be asked to refine their predictions by using
    a scale with more levels. In our example, Moody’s might decide, after examining
    Figure 5.1, that the gap between Aa1 and Aa2 (the second and third points from
    the right) is too wide. This could be resolved by introducing a new threshold
    between these two.


    There is also a practical consequence of connecting the points: It makes it possible
    to unambiguously define the area under the curve for an ordinal predictor. Thus,
    I recommend using the ROC curve rather than ROC points for an ordinal predictor.


    # 5.4 Area under the Empirical ROC Curve


    The area under the empirical ROC curve is computed using the trapezoidal rule,
    the same way it was done for a continuous marker. The %ROC macro can be used for
    this purpose since the empirical ROC curve and the area under it are rank-based
    functions. The macro call is identical to the ones used in Chapter 3:


    ```

    %roc(data=moody,var=moody,response=def,contrast=1);

    ```


    The familiar %ROC output (see Output 5.1) indicates an AUC of 0.915 with a 95%
    confidence interval ranging from 0.891 to 0.940.


    # Output 5.1


    ```

    The ROC Macro


    ROC Curve Areas and 95%

    Confidence Intervals

    ROC Area Std Error Confidence Limits

    moody 0.9153 0.0124 0.8909 0.9397

    ```


    Similar to using the %ROC macro, you can use the %BOOT1AUC macro to compute bootstrap-based
    estimates and standard errors for the area under the curve. Output 5.2 shows the
    results from the bootstrap, which are similar to those produced by the %ROC macro.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "# Output 5.2\n\n```\nBootstrap Analysis of the AUC for moody\n\n    AUC   \
    \ StdErr\n    -----------\n0.913584  0.012242\n\n95% Confidence Interval\n\n \
    \   LowerLimit    UpperLimit\n    -----------\n    0.888271      0.935495\n```\n\
    \n# 5.5 Latent Variable Model\n\nAs is the case with continuous predictors, the\
    \ empirical ROC curve makes minimal assumptions but does not extend easily for\
    \ covariate adjustments. In Chapter 3, we developed the binormal model and demonstrated\
    \ its use in covariate adjustments in Chapter 4.\n\nIt is possible to develop\
    \ a binormal model for ordinal predictors, too. Imagine that you start with a\
    \ continuous predictor but instead decide to categorize it and report only an\
    \ ordinal predictor, such as none, low, medium, and high (as in some of the rain\
    \ forecasts). The consumers of the forecast only observe the ordinal value. Even\
    \ though these continuous predictions, called the latent variable, remain unobserved,\
    \ the sensitivity and specificity at each of the ordinal values represent points\
    \ on the ROC curve of the latent variable. The fundamental idea is given in Figure\
    \ 5.2."
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Figure 5.2 The Three ROC Points for the Ordinal Predictor


    ![](img/ac26020abd4f22abfaafc0607939c6e4_68_0.png)


    The horizontal line at the top portion of the figure represents the continuum
    of the latent variable. The three hash marks on the latent variable axis denote
    the thresholds that correspond to the observed ordinal predictor. The solid line
    at the lower part is the ROC curve for the latent variable and the hash marks
    on the curve are the ROC points. The important point is that the ROC points for
    the ordinal variable lie on the ROC curve for the latent variable.


    Now examine Figure 5.3, which contains only the ROC points. Without knowing or
    supposing certain characteristics of the latent variable, you could not estimate
    the ROC curve of the latent variable by using only the ROC points. Connecting
    the points is unlikely to represent the true ROC curve of the latent variable
    because the true ROC curve is more likely to be smooth. You need to use information
    about the latent variable to interpolate between the ROC points. Of course, the
    latent variable is unobservable, so you can only make assumptions.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Figure 5.3 ROC Points for the Same Ordinal Predictor in Figure 5.2


    ![](img/ac26020abd4f22abfaafc0607939c6e4_69_0.png)


    The most common assumption is that the latent variable is normally distributed.
    This gives rise to the so-called *latent binormal model*. For now, we will distinguish
    the latent binormal model from the one in Chapter 3. The latent binormal model
    assumes that the latent variable follows a normal distribution with mean μ₁ and
    variance σ₁² when D=1, and a normal distribution with mean μ₀ and variance σ₀²
    when D=0. It is not possible to simultaneously estimate μ₀, σ₀², μ₁, and σ₁² using
    the observed frequencies of the ordinal marker (such as those in Table 5.1). Multiple
    (in fact, infinite) combinations of these four parameters can give rise to the
    same observed data, and it is not possible to distinguish between them. However,
    if we anchor one of the normal distributions by fixing μ₀ and σ₀², then we can
    estimate μ₁ and σ₁². For simplicity, suppose we choose μ₀=0 σ₀²=1 and we get the
    estimates of μ₁ and σ₁², say μ̂ and σ̂². Had we set μ₀=m σ₀²=s, then the resulting
    estimates of μ₁ and σ₁² would have been μ̂ + m and s σ̂². This can be proven because
    the normal distribution is a member of the so-called *location-scale families*.
    The implication is that, without loss of generality, we can always use the standard
    normal as the anchor and consider the resulting estimates as the difference of
    the two means and the ratio of the two variances.


    These considerations led to the development of the following special ordinal regression
    model for ROC curves, first considered by Tosteson and Begg (1988). In this model,
    D is an indicator variable for the gold standard, that is D=0 or D=1. The latent
    variable X has a normal distribution with mean αD and variance e^{2βD}. This amounts
    to assuming a standard normal for D=0 and possibly a different normal density
    for D=1. Thus, this representation of X is consistent with the latent binormal
    model described previously.'
  merge: -1
  img_proc: true
- pgno: 70
  md: "Suppose that $R$ is the ordinal predictor with $k$ levels, created from $X$\
    \ by applying the thresholds $\theta_1..., \theta_k$. Then the probability of\
    \ $R$ being equal to $k$ is given by the following:\n\n$P(R=k)=P(\\theta_{k-1}<X\\\
    le\\theta_k)$\n$=\\Phi\\left(\\frac{\\theta_k-\\alpha D}{e^{\\beta z}}\\right)-\\\
    Phi\\left(\\frac{\\theta_{k-1}-\\alpha D}{e^{\\beta z}}\\right)$\n\nWe saw in\
    \ Chapter 3 that ROC curves are intimately connected to cumulative distributions.\
    \ For this reason, using $\\gamma_k(D)=P(R\\le k)$ instead of $P(R=k)$ yields\
    \ the following probit regression model:\n\n$\\gamma_k(z)=\\Phi\\left(\\frac{\\\
    theta_k-\\alpha D}{e^{\\beta z}}\\right)$\n\nRealize that $1-\\gamma_k(D)$ is\
    \ the probability of the marker exceeding the threshold and, hence, predicting\
    \ $D$=1. This represents the sensitivity when $D$=1 and one minus the specificity\
    \ when $D$=0. Therefore, a plot of $1-\\gamma_k(0)$ versus $1-\\gamma_k(1)$ for\
    \ all $k$ produces the ROC curve of the latent variable. The resulting smooth\
    \ curve, analogous to the case of the continuous predictor, is\n\n$y=\\Phi\\left(\\\
    alpha+e^{-\\beta}\\Phi^{-1}(x)\\right)$\n\nwhere $x$ is one minus the specificity\
    \ and $y$ is the sensitivity. Under this model, the area under the curve is given\
    \ by\n\n$A=\\Phi^{-1}\\left(\\frac{\\alpha}{\\sqrt{1+e^{-2\\beta}}}\\right)$\n\
    \nSetting $a=\\alpha$ and $b=e^{-\\beta}$, you can see that the formula for the\
    \ AUC is equivalent to the case of a single continuous predictor. This is not\
    \ surprising because we have continuously observed in Sections 5.2 and 5.3 that\
    \ there is a strong duality between continuous and ordinal predictors.\n\nWe will\
    \ call this an *ordinal-probit regression model*. Other ordinal regression models\
    \ can be obtained by assuming a different distribution for the latent variable,\
    \ in which case the probit link in this derivation would be replaced by the cumulative\
    \ distribution function of the chosen distribution. In practice, it is very rare\
    \ that another distribution is used in the latent model setting.\n\nThose familiar\
    \ with the capabilities of the LOGISTIC, GENMOD, and PROBIT procedures might mistakenly\
    \ conclude that these procedures can serve as the primary vehicles for analyses\
    \ of ordinal predictors. In fact, these three procedures are not flexible enough\
    \ to accommodate the parameter $\\beta$. Use them only if you are willing to fix\
    \ $\\beta$ in advance at 1 and estimate only $\\alpha$. These procedures were\
    \ developed to estimate a class of models called *generalized linear models*,\
    \ and the ordinal-probit regression model defined here belongs to this family\
    \ if and only if $\\beta$=1. Therefore, to fit the ordinal probit model as described\
    \ previously in full generality, you need to use the capabilities of PROC NLMIXED."
  merge: -1
  img_proc: true
- pgno: 71
  md: "We will use Moody’s data as an example. Note that the first five categories\
    \ (Aaa through A2) have no observed defaults and, thus, the same sensitivity and\
    \ specificity. In the language of this chapter, γ_k(0) and γ_k(1) are the same\
    \ for k=1, …, 5. Thus, we cannot estimate any of the four thresholds (θ_1, θ_2,\
    \ θ_3, θ_4) because any of the points on the presumed latent variables distribution\
    \ between −∞ and θ_5 will be consistent with our data. To enable the ordinal regression\
    \ to deal with all model parameters, we need to consolidate some of the categories.\
    \ The consolidation in Table 5.2 was chosen for this analysis.\n\n# Table 5.2\
    \ Consolidated Version of Moody’s Rating Data\n\n| Rating | A | Baa | Ba | B |\
    \ C |\n| Default | 1 | 2 | 4 | 36 | 55 |\n| Total | 1023 | 692 | 388 | 592 | 164\
    \ |\n\nIn the consolidated version, A represents Aaa through A3-, Baa represents\
    \ Baa1 through Baa3, Ba represents Ba1 through Ba3, and B represents B1 through\
    \ B3. C is not combined with another category.\n\nBefore we proceed with fitting\
    \ this model it is important to emphasize the fact that the latent variable is\
    \ not observed, so it is only the relative positions of the thresholds that can\
    \ be estimated. In other words, two sets of thresholds with different absolute\
    \ values but identical relative positions (i.e., the distance between them) will\
    \ have the same likelihood. Hence we need to arbitrarily fix one of the thresholds\
    \ so that others can be estimated. The following PROC NLMIXED code assumes the\
    \ first threshold is 0 and fits the foregoing ordinal-probit regression model\
    \ to the consolidated version of credit rating data.\n\n```\nproc nlmixed data=moody\
    \ gconv=0;\n  parms alpha=1 theta1=1 theta2=2 theta3=3 beta=1;\n  bounds theta1>0,\
    \ theta2>0, theta3>0;\n  eta1=alpha*default;\n  eta2=exp(beta*default);\n    if\
    \ rating=1 then z = probnorm(-eta1/eta2);\n  else if rating=2 then z = probnorm((theta1-eta1)/eta2)\n\
    \                        probnorm(-eta1/eta2);\n  else if rating=3 then z = probnorm((theta2+theta1-eta1)/eta2)\n\
    \                        - probnorm((theta1-eta1)/eta2);\n  else if rating=4 then\
    \ z = probnorm((theta3+theta2+theta1-eta1)/eta2)\n                        - probnorm((theta2+theta1-eta1)/eta2);\n\
    \  else if rating=5 then z = 1 - probnorm((theta3+theta2+theta1-eta1)/eta2);\n\
    \  if z>1e-6 then ll=log(z);\n  else ll=-1e6;\n  model rating ~ general(ll);\n\
    \  estimate 'AUC' probnorm(alpha/sqrt(1+beta**2));\nrun;\n```\n\nThe short introduction\
    \ to PROC NLMIXED in the appendix might be helpful if you are not familiar with\
    \ the syntax or the output. Output 5.3 shows the results."
  merge: -1
  img_proc: true
