- pgno: 96
  md: "# 7.3.4 Putting It Together\n\nSections 7.3.1 through 7.3.3 demonstrate how\
    \ the components of Equation (7.3) can be computed from the data using the SAS\
    \ procedure PROC LIFETEST. Using the results of these sections, you can compute\
    \ the sensitivity and specificity for an SUV of 9 at 3 years as follows:\n\nP(W\
    \ > c | D = 1) = {1 − S(t | W > c)} P(W > c) / (1 − S(t)) = (1 − 0.6335) * 0.5\
    \ / (1 − 0.7676) = 0.7885\nP(W ≤ c | D = 0) = S(t | W ≤ c) P(W ≤ c) / S(t) = 0.8960\
    \ * 0.5 / 0.7676 = 0.5836\n\nBy varying c, you can obtain the sensitivity and\
    \ one minus specificity for each c. A plot of these pairs constitutes the ROC\
    \ curve.\n\nThere is a potential problem here, however. In the examples presented\
    \ in Chapter 3, the ROC curve was guaranteed to be monotone-increasing. There\
    \ is no such guarantee for censored data because Kaplan-Meier estimates are not\
    \ smooth functions of time (they have several jumps). This implies that, as one\
    \ minus specificity increases, sensitivity might occasionally decrease, violating\
    \ a central premise of the ROC curve. Lack of monotonicity may be obvious in small\
    \ samples, but in most data sets with large samples and/or events, it is hardly\
    \ noticeable.\n\nIf the estimate of S(t) had no jumps and flat regions—that is,\
    \ if it were monotone itself—the ROC curve would also have been monotone. Realizing\
    \ this, Heagerty et al. (2000) suggest a different estimator for S(t), a weighted\
    \ Kaplan-Meier estimator.\n\nThe macro %TDROC generates a time-dependent ROC curve.\
    \ The required inputs to the macro are DSN (the data set name), Marker, TimeVar,\
    \ Status, and TimePT. The TimePT variable specifies the time at which predictions\
    \ are to be made. The Status variable must satisfy the requirements of PROC LIFETEST:\
    \ It must be numeric and it must be followed, in parentheses, by the list of values\
    \ that indicate censoring. The macro also has an option (smooth=1) that implements\
    \ a smooth estimator of S(t). By default, smooth=0. Another optional input is\
    \ PLOT (by default, 1), which controls whether the curve is plotted. When plot=0,\
    \ only data sets with pairs of sensitivity and specificity are made available.\n\
    \nFigure 7.1 is an ROC curve for SUV as a marker of prognosis at 3 years using\
    \ the lung cancer data generated by the following call to the %TDROC macro:\n\n\
    ```\n%TDROC(DSN=lung, MARKER=suv, TIMEVAR=survival, STATUS=status(0),\n    TIMEPT=36);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Figure 7.1 The ROC Curve at 3 Years for the Predictive Power of SUV in Lung
    Cancer


    ![](img/ac26020abd4f22abfaafc0607939c6e4_97_0.png)


    The AUC for the ROC curve in Figure 7.1 is 0.657 and suggests a moderate level
    of accuracy. The curve itself is never too far from the diagonal line, supporting
    the same conclusion. Of course, the ROC curve should be evaluated in the context
    of competing methods of prediction. In survival analysis, making accurate predictions
    is much more difficult because the event being predicted, in some cases, is several
    years away, during which many other things can happen to the patient. From this
    perspective, an AUC of 0.657 represents a respectable level of accuracy.


    It is obvious that the choice of time point can influence the conclusions. In
    some cases, investigators have a clear target time point. Other studies lack such
    clarity and may pose a problem to the statistician in choosing the time point.
    In these cases, try out a few time points and present the results simultaneously,
    as in Figure 7.2.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Figure 7.2 The ROC Curves at 2, 3, and 4 Years for the Predictive Power of
    SUV in Lung Cancer


    ![](img/ac26020abd4f22abfaafc0607939c6e4_98_0.png)


    To generate a display like Figure 7.2, you need to understand how the output data
    sets are named by the %TDROC macro. The data set name in macro language is &&DSN_&TIMEPT,
    so for the lung cancer example, the data sets for the three ROC curves in Figure
    7.2 are named LUNG_24, LUNG_36, and LUNG_48.


    In general, the three curves have similar shapes, although sensitivity seems to
    increase with time at high levels of specificity and decrease with time at low
    levels of specificity. The AUCs of the three curves are 0.618, 0.657, and 0.729,
    suggesting that the SUV is better able to predict the status of patients at later
    years than earlier years. On the other hand, most of the difference between the
    curves is in the region where specificity is less than 0.5 and hence the difference
    in AUCs may be immaterial from a practical perspective.


    # 7.4 Concordance Probability with Censored Data


    Section 7.3 explained how to construct ROC curves with censored data. The principle
    idea is to dichotomize the time-to-event outcome at a given time point. As a result,
    the ROC curve is defined for a specific point in time. To get an idea about the
    overall predictive value of a marker, you need to perform an analysis like the
    one presented in Figure 7.2.'
  merge: -1
  img_proc: true
- pgno: 99
  md: "This section discusses an alternative method to assess the overall value of\
    \ a marker in predicting a censored outcome. This alternative approach is based\
    \ on the idea of concordance. In Chapter 3, we saw that, for a binary outcome,\
    \ the area under the empirical ROC curve is equivalent to the concordance probability.\
    \ As a reminder, the concordance probability is defined on a pair of subjects\
    \ where one of the pair has the outcome and the other does not. The probability\
    \ that the subject with the outcome has a greater marker value than the other\
    \ subject is called the concordance probability.\n\nThe following way to express\
    \ concordance probability is consistent with this definition and also makes it\
    \ amenable to extend this definition to censored outcomes. Define\n\n```\nψ(W_i,\
    \ W_j) = { 1    W_i > W_j\n                  0.5  W_i = W_j\n                \
    \  0    W_i < W_j }\n```\n\nHence ψ indicates which member of the pair has the\
    \ higher value, with ties indicated by 0.5. Suppose there are n patients with\
    \ the outcome and m patients without the outcome. Then, there are a total of mn\
    \ pairs and the concordance probability can be written as follows:\n\n```\n1/(mn)\
    \ Σ_{i=1}^n Σ_{j=1}^m ψ(W_i, W_j)\n```\n\nThe summation represents the number\
    \ of pairs that have W_i > W_j (with an accommodation for ties), so the entire\
    \ expression is the fraction of patient pairs where the one with the higher marker\
    \ value had the outcome.\n\nYou can use the idea of concordance in time-to-event\
    \ settings. To see how the definition of concordance can be adopted for censored\
    \ outcomes, let T_i and T_j be the event times in a given pair of patients with\
    \ marker values W_1 and W_2. The concordance between a marker W and the censored\
    \ outcome T is defined as\n\n```\nCP(W, T) = P(T_1 > T_2 | W_1 > W_2)\n```\n\n\
    Because T is subject to censoring, this estimator cannot be used since the outcome\
    \ is partially observed.\n\nHarrell et al. (1982) suggest a modification of this\
    \ estimator that can be used with censored data. This method is based on the realization\
    \ that even in the presence of censoring, the outcome in some of the pairs can\
    \ be ordered. For example, if the second subject is dead with a survival time\
    \ that is shorter than the follow-up time of the first subject who is alive, we\
    \ can say with certainty that T_1 > T_2. Table 7.1 lists all the possibilities\
    \ and the corresponding value of ψ(W_1, W_2). If ψ(W_1, W_2)=1, it indicates that\
    \ the prediction and the outcome are concordant. If ψ(W_1, W_2)=0, it indicates\
    \ that the prediction and the outcome are discordant. Finally, (W_1, W_2)=? means\
    \ that, due to censoring, it is not possible to determine whether the prediction\
    \ and the outcome are concordant or discordant."
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Table 7.1 All Possible Pairings and Concordance Status with Censored Data


    | Subject 1 | Subject 2 | T₁ and T₂ | Ψ(W₁,W₂) |

    |---|---|---|---|

    | Event | Event | T₁>T₂ | 1 |

    | Event | No Event | T₁>T₂ | ? |

    | No Event | Event | T₁>T₂ | 1 |

    | No Event | No Event | T₁>T₂ | ? |

    | Event | Event | T₁<T₂ | 0 |

    | Event | No Event | T₁<T₂ | 0 |

    | No Event | Event | T₁<T₂ | ? |

    | No Event | No Event | T₁>T₂ | ? |


    Now we can evaluate all the pairs to see whether they are concordant or not using
    the definitions in Table 1. The denominator is the number of informative pairs
    (that is the pairs for which we can make a decision), indicated in the following
    equation by k. The notation (i,j)=1 to (i,j)=k means that the summation is over
    pairs of (i,j) and there are k such pairs. The resulting estimator of concordance
    probability is often called the c-index.


    ```

    c = 1/k Σ_{(i,j)=1}^k ψ(W_i, W_j)

    ```


    The c-index has several advantages. It mimics the computation of the area under
    the ROC curve with binary data, it is intuitive, and it is conceptually simple
    to compute. Despite the conceptual simplicity, the computation requires forming
    all pairs and can take a long time. Computation of the c-index is not built into
    existing SAS procedures, but the %CINDEX macro, available from this book’s Web
    site, can be used to compute it, as follows:


    ```

    %CINDEX (DSN=LUNG, PRED=SUV, SURV=SURVIVAL, CENS=CENS);

    ```


    Here, DSN is the name of the data set, Pred is the variable in the data set to
    be used as the predictor, Surv is the survival time variable, and Cens is the
    censoring indicator (1 for censored, 0 for event). Output 7.4 simply reports the
    c-index.


    # Output 7.4


    ```

    cindex

    --------

    0.692708

    ```


    In the case of the lung cancer example, the concordance probability is estimated
    to be 0.69, using the c-index as the estimator.


    If the question of interest centers around multiple markers or a multivariable
    predictive model, then the input macro variable PRED of the %CINDEX macro should
    point to the variable containing the predictions of the multivariate model.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Despite all its advantages, the c-index has one big drawback. It is not a consistent
    estimator of the true concordance probability. A consistent estimate gets closer
    to the true value as the sample size increases. However, the c-index can remain
    far away from the true value even as the sample size increases. Therefore, the
    c-index can give “wrong” answers even in large samples. In my experience, if the
    censoring rate is low (which implies that the proportion of undecided pairs is
    low), the c-index works reasonably well. As the censoring rate increases, its
    performance becomes unpredictable.


    The reason for the inconsistency of the c-index, at least intuitively, is that
    it uses the observed survival or follow-up times. Unless a parametric model is
    adopted, procedures using the observed values do not provide consistent estimates.
    For this reason, most of the non-parametric or semi-parametric methods of analyzing
    censored data, such as the Kaplan-Meier estimate or the proportional hazards regression,
    use the ranks of the data, not their actual values.


    Before we finish this section, note an interesting property of the concordance
    probability:


    CP(W,T)=1−CP(−W,T)


    This equation tells us that if a marker is known to have high values when the
    outcome is unlikely, then CP can be less than 0.5. The more informative measure
    in this case is 1−CP, which can be taken as a measure of the marker to correctly
    order event times.


    # 7.5 Concordance Probability and the Cox Model


    There is an alternative way of computing the concordance probability in a very
    important special case. Most cases involving regression with censored data, such
    as modeling the relationship between a continuous covariate and a censored outcome
    or between multiple covariates and a censored outcome, are handled within the
    framework of the Cox model (proportional hazards regression). It turns out that
    concordance probability can be computed analytically in the context of the Cox
    model. The following development is from Gönen and Heller (2005).'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'The starting point is the definition of concordance probability for a censored
    outcome, as used in Section 7.4:


    CP(W,T) = P(T₁ > T₂ | W₁ > W₂)


    where T is the survival time and W is the predictor. For the time being, we will
    work with a single predictor. Extension to the case of multiple predictors will
    follow. The Cox model for this case stipulates that


    h(t|W) = h₀(t) exp{βW}


    where h(t) is the hazard function for t, which is written as a product of two
    terms: one involving t only (h₀, the baseline hazard) and one involving W only
    (the linear part). Using the relationship between hazard and survival functions,
    you can write the equivalent expression:


    S(t|W) = S₀(t) exp{βW}


    More information on how to show the equivalence of these two expressions can be
    found in most books covering the Cox model, such as Survival Analysis Using the
    SAS System: A Practical Guide (Allison, 1995).


    Now you can rewrite the concordance probability in terms of survival functions:


    P(T₁ > T₂ | W₁ > W₂) = ∫ S₁(t | W₁) dS₂(t | W₂)


    Understanding this equation requires some familiarity with advanced probability,
    but here it is used to show that concordance probability can be written using
    only S(t). If you substitute the form of S₁ and S₂ from the Cox model, then the
    integral on the righthand side can be evaluated as follows:


    P(T(βᵀW₂) > T(βᵀW₁)) = ∫ S₁(t | W₁) dS₂(t | W₂) = [1 + exp{βᵀ(W₂ − W₁)}]⁻¹


    Hence, to evaluate the discriminatory power of the predictor W in the context
    of a Cox model, you need an estimate of β and the values of W for all possible
    pairings of the data. Note that T enters the computation only through the estimation
    of β, which can be accomplished using partial likelihood. Therefore, censoring
    is naturally handled by the existing methods of fitting a Cox model. This is a
    particular strength of this approach to computing the concordance probability.


    If there are multiple predictors, then both W and β will be vectors. The same
    expression can be written in vector notation as follows:


    P(T(βᵀW₂) > T(βᵀW₁)) = [1 + exp{βᵀ(W₂ − W₁)}]⁻¹'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'The expressions derived so far involve a particular pair of observations, denoted
    as 1 and 2. To use this in a set of data involving several observations, we need
    to compute this probability for each pair of observations. This yields the following
    formula for an estimate of the concordance probability (labeled CPE for concordance
    probability estimate):


    CPE = 2 / [n(n-1)] Σ Σ_{i<j} { I(β̂^T w_{ji} < 0) / [1 + exp{-β̂^T w_{ji}}] +
    I(β̂^T w_{ji} ≥ 0) / [1 + exp{β̂^T w_{ji}}] }


    where w_{ji} = w_j - w_i. The summand consists of two parts, representing the
    case whether higher or lower values of the predictor correlates with longer survival,
    which is reflected in the sign of the regression coefficient. If β > 0, then higher
    values of the covariate are associated with higher values of hazard. In this case,
    if, for a particular pair, w_j > w_i, then the probability of T_j being greater
    than T_i should be more than 0.5 and hence the second term of the summand should
    be applicable since β^T w_{ji} > 0 and exp{β^T w_{ji}} > 0. Thus, (1 + exp{β^T
    w_{ji}})^{-1} > 0.5. The other three cases depending on the sign of β and w_{ji}
    can be explained in a similar fashion.


    As mentioned previously, the availability of Cox model software using partial
    likelihood is the primary operational advantage. It also constitutes one of the
    theoretical advantages. Partial likelihood estimates are consistent; that is,
    as the sample size grows, the results get nearer and nearer the underlying true
    but unknown value of the parameters. It is well-known that functions of consistent
    estimators are also consistent. Since β is the only parameter estimated to compute
    the CPE, it turns out that CPE is also consistent. This is an important reason
    why you should favor CPE over the c-index in the context of Cox models.


    CPE can be estimated using the %CPE macro, which is available from this book’s
    companion Web site at support.sas.com/gonen. The macro call is similar to that
    of %CINDEX:


    ```

    %CPE(DSN=LUNG, COVARIATES=SUV SIZE, SURV=SURVIVAL, CENS=CENS);

    ```


    Output 7.5 shows the results.


    # Output 7.5


    | Concordance Probability Estimate for the Cox Model |

    | CPE | StdErr |

    | 0.6524 | 0.0582 |


    An important difference in the macro calls of CINDEX and CPE is that the predictors
    are listed with blanks in between as if they appeared on the right-hand side of
    the MODEL statement.


    We see that the CPE for the lung data set is less than the c-index. This is usually
    the case, in my experience. The c-index seems to overestimate the true concordance
    probability, especially if the censoring proportion in high. Since the CPE is
    a consistent estimate and the c-index is not (as explained earlier), the CPE is
    a better measure in the context of using predictions from Cox regression models.'
  merge: -1
  img_proc: true
