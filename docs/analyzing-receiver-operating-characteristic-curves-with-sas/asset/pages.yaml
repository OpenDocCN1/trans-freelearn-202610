    # 3.1 Dichotomizing a Continuous Predictor


    Now let’s consider the problem that naturally leads to the use of the ROC curve.
    Suppose you are trying to predict a binary outcome, like the weather forecast,
    but instead of a binary predictor you have a continuous predictor. Most weather
    forecasts are produced by statistical models, which generate a probability level
    for the outcome. For example, most weather forecasts mention rain in their summary
    but if you look at the details they also report a chance of rain. How would you
    assess the predictive accuracy of these probabilities (or, perhaps more appropriately,
    the model that produced these predicted probabilities)?


    Since you know how to analyze predictive accuracy for a binary predictor (using
    metrics such as sensitivity and specificity), you might consider transforming
    the predicted probability into a dichotomy by using a threshold. The results,
    however, would clearly depend on the choice of threshold. How about using several
    thresholds and reporting the results for each one? The ROC curve offers one way
    of doing this. The ROC curve offers one way of doing this by focusing only on
    sensitivity and (one minus) specificity.'
  merge: -1
  img_proc: true
- pgno: 26
  md: "Let’s use an example from the field of medical diagnostics. One way to diagnose\
    \ cancer is through the use of a special scan called *positron emission tomography\
    \ (PET)*. PET produces a measure called the *standardized uptake value (SUV)*,\
    \ which is a positive number that indicates the likelihood that the part of the\
    \ body under consideration has cancer. After the SUV is measured, the patient\
    \ undergoes a biopsy where a small piece of tissue from the suspected area is\
    \ removed and examined under the microscope to evaluate whether it is cancerous\
    \ or not. This process, called *pathological verification*, is considered the\
    \ gold standard. Using the terminology introduced at Chapter 1, we will call the\
    \ SUV the marker, and pathological verification the gold standard.\n\nThe data\
    \ are reported by Wong et al. (2002). There are 181 patients, 67 of whom are found\
    \ to have cancer by the gold standard. Because we are dealing with a continuous\
    \ predictor, it is no longer possible to report the data in a tabular form. Instead\
    \ you can use the following side-by-side histograms from PROC UNIVARIATE that\
    \ can be obtained with the simultaneous use of CLASS and HISTOGRAM statements.\
    \ For example, the following code was used to generate Figure 3.1:\n\n```\nproc\
    \ univariate data=HeadNeck noprint;\nclass gold_standard / keylevel='-';\nvar\
    \ suv;\nhistogram suv / turnvlabels cfill=ligr cframe=white\n    cframeside=white\
    \ endpoints=0 to 20 by 2 cbarline=black\n    font=swissb height=4;\nrun;\n```\n\
    \n# Figure 3.1 Side-By-Side Histograms for SUV\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_26_0.png)\n\
    \nWhen the HISTOGRAM statement is invoked in PROC UNIVARIATE with a CLASS statement,\
    \ a separate histogram for each value of the class variable is produced. The KEYLEVEL=\
    \ option ensures that the chosen level always appears at the top (in this case,\
    \ the code displays the histogram for the gold standard negative patients first).\
    \ The options used in the HISTOGRAM statement visually enhance the figure. Their\
    \ use is covered in detail in the *Base SAS Procedures Guide: Statistical Procedures*,\
    \ which is available at support.sas.com/documentation/onlinedoc/sas9doc.html."
  merge: -1
  img_proc: true
- pgno: 27
  md: 'The upper panel of the figure is the histogram of SUV for the gold standard
    negative patients (those without cancer) and the lower panel is for gold standard
    positive patients (those with cancer), as denoted by the vertical axis. Patients
    with cancer tend to have higher SUV values; only a few have very low SUVs. A very
    high SUV (say, 10 or more) almost certainly implies cancer. There is, however,
    some overlap between the distributions for SUVs in the middle range (roughly 4–10).
    So extreme values of the SUV strongly imply cancer or lack of cancer, but there
    is a gray area in the middle. This is in fact a very common picture for many continuous
    predictors. How accurate, then, is SUV for diagnosing cancer?


    One crude way of approaching the problem is to compute the sensitivity and specificity
    for various thresholds. Figure 3.2 uses a threshold of 7. To the left (SUV≤7)
    are considered negative for cancer and to the right (SUV>7) are considered positive
    for cancer. HREF=7 option is used in the HISTOGRAM statement for drawing the reference
    line and FRONTREF options was used to ensure that the reference line is in front
    of the histogram bars.


    A greater proportion of gold standard negative patients have SUV≤7 and are classified
    as without cancer. Similarly, a greater proportion of gold standard positive patients
    have SUV>7 and are classified as having cancer.


    # Figure 3.2 Dichotomizing at SUV=7


    ![](img/ac26020abd4f22abfaafc0607939c6e4_27_0.png)


    Dichotomization of the SUV can be accomplished using the following DATA step command:


    ```

    suv7=(suv>7);

    ```


    This can produce undesirable behavior if the SUV variable contains missing values
    because a missing value will satisfy suv≤7, which will be recoded as 0 in this
    case. IF-THEN statements should be employed if the variable to be recoded contains
    missing values.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Using the variable SUV7, you can easily obtain the kind of 2x2 table considered
    in the previous chapter for the weather forecast example. For this data set, it
    would look like the cells in Table 3.1:


    # Table 3.1 Accuracy of SUV>7 in Cancer Diagnosis


    | SUV>7 Classification | Gold Standard Diagnosis |  |  |

    | | Cancer | No Cancer | Total |

    | Cancer | 25 | 3 | 28 |

    | No Cancer | 42 | 111 | 153 |

    | Total | 67 | 114 | 181 |


    The rows are classifications by the SUV>7 rule and the columns are classifications
    by the gold standard. Using the techniques covered in Chapter 2, you can use PROC
    FREQ to estimate the sensitivity and specificity as 25/67=37% and 111/114=97%.
    Therefore, using 7 as the SUV threshold to classify patients as having cancer
    or not is highly specific but of questionable sensitivity. This is not necessarily
    a verdict on the ability of the entire spectrum of standardized uptake values
    to diagnose cancer. In fact, Figure 3.2 suggests that moving the threshold to
    the left (i.e., using a lower threshold) will increase sensitivity at the cost
    of reducing specificity. Because the sensitivity using 7 as the threshold is so
    poor and the specificity so high, this might be a worthwhile strategy. This might
    help you find a better threshold, but it still falls short of determining whether
    the SUV is a good predictor of cancer. The next section explains how this can
    be done using ROC curves.


    # 3.2 The ROC Curve


    The previous analyses can be repeated for various thresholds, each of which may
    produce different values of sensitivity and specificity. One way to report the
    results of such an analysis would be in tabular form. Table 3.2 is an example,
    reporting on a few selected thresholds.


    # Table 3.2 Accuracy of SUV in Diagnosing Cancer for Various Thresholds


    | Threshold | 1 | 3 | 5 | 7 |

    | Sensitivity | 97% | 93% | 61% | 37% |

    | Specificity | 48% | 65% | 88% | 97% |


    Table 3.2 makes clear the wide range of sensitivity and specificity that can be
    obtained by varying the threshold. It also identifies the inverse relationship
    between the two measures: As one increases, the other decreases and vice versa.
    This can be seen from the histogram. If you move the dashed line to the left (to
    5, for example, instead of 7), more patients will be classified as positive: Some
    of these will be gold standard positive, hence true positives, which will increase
    the sensitivity. Others, however, will be gold standard negative, and hence false
    positives, which will decrease specificity. So the relationship observed in Table
    3.2 is universal: It is not possible to vary the threshold so that both specificity
    and sensitivity increase.


    A tabular form is limited in the number of thresholds it can accommodate. You
    can plot sensitivity versus specificity, making it possible to accommodate all
    possible thresholds. Table 3.2 shows that since the two are inversely related,
    the plot of sensitivity against specificity will show a decreasing trend. A visually
    more appealing display can be obtained by plotting'
  merge: -1
  img_proc: true
- pgno: 29
  md: "sensitivity against one minus specificity. This is called the *receiver operating\
    \ characteristic (ROC)* curve. Figure 3.3 represents the ROC curve corresponding\
    \ to the PET data set.\n\n# Figure 3.3 The ROC Curve for the PET Data Set\n\n\
    ![](img/ac26020abd4f22abfaafc0607939c6e4_29_0.png)\n\nThe dots are referred to\
    \ as *observed operating points* because you can generate a binary marker that\
    \ performs (or *operates*) at the sensitivity and specificity level of any of\
    \ the dots. In this graph, the operating points are connected, leading to the\
    \ so-called *empirical* ROC curve. The implication is that any point on the ROC\
    \ curve is a feasible operating point, although you might have to interpolate\
    \ between the observed marker values to find the correct threshold.\n\nThe ROC\
    \ curve in Figure 3.3 is produced using the following code:\n\n```\nproc logistic\
    \ data=HeadNeck noprint;\n    model gold_standard=suv / outroc=ROCData;\nrun;\n\
    \nsymbol1 v=dot i=join;\nproc gplot data=ROCData;\n    plot _sensit_*_1mspec_;\n\
    \nrun;\nquit;\n```\n\nThe data set produced by the OUTROC= option in PROC LOGISTIC\
    \ automatically computes sensitivity and one minus specificity for each possible\
    \ threshold and names these variables _SENSIT_ and _1MSPEC_, which can then be\
    \ plotted using standard SAS/GRAPH procedures.\n\nEach point on the ROC curve\
    \ corresponds to a threshold, although the value of the thresholds is not evident\
    \ from the graph. This is considered a strength of ROC curves because it frees\
    \ the evaluation of the strength of the marker from the scale of measurement.\
    \ The ROC curve for the SUV measured on a different scale would be identical to\
    \ the one produced here. Nevertheless, it may be helpful to indicate the threshold\
    \ values at a few selected points to improve the"
  merge: -1
  img_proc: true
- pgno: 30
  md: 'understanding of the ROC curve. To highlight the sensitivity and specificity
    afforded by these thresholds, horizontal and vertical reference lines can also
    be included at selected points.


    Inclusion of possible thresholds is not the only visual enhancement you can make.
    The most common enhancement is the inclusion of a 45-degree line. This line represents
    the ROC curve for a noninformative test and a visual lower bound for the ROC curve
    of interest to exceed. Finally, it is customary to make the horizontal and vertical
    axes the same length, resulting in a square plot, as opposed to the default rectangular
    plot of SAS/GRAPH. These features are available in the %PLOTROC macro. For more
    information, see this book’s companion Web site at support.sas.com/gonen.


    Figure 3.4 shows the ROC curve for the SUV with these enhancements. It was produced
    by %PLOTROC macro with the following call:


    ```

    %plotroc(data=HeadNeck,marker=suv,gold=gold_standard,anno=4,tlist=3 4 5);

    ```


    The %ROCPLOT macro, available from SAS, can be useful for this purpose as well.


    # Figure 3.4 The ROC Curve for the PET Data Set with Enhancements


    ![](img/ac26020abd4f22abfaafc0607939c6e4_30_0.png)


    # 3.3 Empirical ROC Curve and the Conditional Distributions of the Marker


    A convenient mathematical representation of the empirical ROC curve yields further
    insight into many of its properties. As Figure 3.1 shows, the distribution of
    the marker should be examined based on the gold standard value. Let f(t|D=0) and
    f(t|D=1) be the conditional density of the marker for gold standard negative and
    positive patients. The upper histogram is an approximation for f(t|D=0) and the
    lower one for f(t|D=1). Now define F and G as the survival functions (one minus
    the cumulative distribution) corresponding to f(t|D=0) and f(t|D=1), that is'
  merge: -1
  img_proc: true
- pgno: 31
  md: '$$F(t)=\int_{t}^{\infty} f(s\mid D=0)\,ds$$ $$G(t)=\int_{t}^{\infty} f(s\mid
    D=1)\,ds$$


    Because all patients in $G(t)$ are, by definition, gold standard positive, $G(t)$
    describes the proportion of positive patients whose SUV exceeds $t$ out of all
    positive patients. This is nothing but the sensitivity when $t$ is used as the
    threshold. Similarly, $1-F(t)$ would be the specificity; hence, $F(t)$ represents
    one minus the specificity. Therefore, an ROC curve is a plot of $F(t)$ vs $G(t)$
    for each $t$.


    Although this is mathematically correct, it does not completely describe the ROC
    curve because of its dependence on $t$. However, we know that $F(t)$ is the x-coordinate
    of the ROC curve. Writing $x=F(t)$ and solving for $t$, you get $t=F^{-1}(x)$.
    The sensitivity corresponding to $t$ is $G(t)$. So the sensitivity corresponding
    to $x$ is given by


    $$y=G(F^{-1}(x))$$


    There are several important features of this representation. First of all, it
    is generic. No assumptions are made about the marker or the gold standard. It
    also makes explicit the dependence of the ROC curve on the entire distribution
    function. This representation also explains why the ROC curves focus on sensitivity
    and specificity instead of NPV and PPV. The denominators of the positive and negative
    predictive values change with the threshold and do not lend themselves to notation
    and analyses by the use of cumulative distribution functions of the predictor
    variable.


    This relationship can also be used to highlight a fundamental property of the
    empirical ROC curve that it is invariant under monotone transformations of the
    marker. To understand this concept, imagine using $h(t)$ instead of $t$ as the
    marker, where $h(.)$ is a monotone function (a monotone function preserves the
    ranks of the data; almost all of the transformations used in statistics, such
    as logarithmic or power, are monotone). $F$ and $G$ would have the same shape
    for $h(t)$ as they do for $t$; the only difference would be in their horizontal
    axes. This would only change the thresholds, not the resulting ROC curve.


    # 3.4 Area under the ROC Curve


    The ROC curve is a summary of the information about the accuracy of a continuous
    predictor. Nevertheless, sometimes you might want to summarize the ROC curve itself.
    The most commonly used summary statistic for an ROC curve is the area under the
    ROC curve (AUC).


    In an empirical ROC curve, you can estimate the AUC by the so-called trapezoidal
    rule:


    +   1. Trapezoids are formed using the observed points as corners.

    +   2. Areas of these trapezoids are calculated with the coordinates of the corner
    points.

    +   3. These areas are added up.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'This may be quite an effort for a curve like the one in Figure 3.3 with many
    possible thresholds. Fortunately, the AUC is connected to some well-known statistical
    measures, such as concordance, Somers’ D, and the Mann-Whitney test statistic.
    This connection is associated with the invariance property discussed in Section
    3.3. Invariance to monotone transformations implies that the ROC curve is a rank-based
    measure. The only information used from the observed marker values is their relative
    rank.


    We will exploit these relationships not only to facilitate computation but also
    to gain further insight into the meaning of the area under the curve and to improve
    interpretation. In particular, we will see how you can estimate the concordance
    using PROC LOGISTIC and Somers’ D using PROC FREQ. The relationship between the
    AUC and the Mann-Whitney statistic is as useful as the others in terms of conceptualization
    but not as useful from a SAS perspective. It is not explored here.


    # 3.4.1 Concordance and Computing the AUC Using PROC LOGISTIC


    Concordance probability measures how often predictions and outcomes are concordant.
    Continuing with the PET example, if, in a randomly selected pair of patients,
    the one with the higher SUV has cancer and the one with the lower SUV has no cancer,
    then this pair is said to be a concordant pair. A pair where the patient with
    the higher SUV has no cancer but the one with the lower SUV has cancer is said
    to be a discordant pair. Some pairs have the same SUV and they are called tied
    pairs. Finally, some pairs are noninformative; for example, both patients may
    have cancer or both may have no cancer. It is not possible to classify these pairs
    as concordant or discordant.


    The probability of concordance is defined as the number of concordant pairs plus
    one-half the number of tied pairs divided by the number of all informative pairs
    (i.e., excluding non-informative pairs). In essence, each tied pair is counted
    as one-half discordant and one-half concordant. This is a fundamental concept
    in many rank procedures, sometimes referred to as randomly breaking the ties.


    An equivalent way to express concordance is P(SUV₊>SUV₋), where SUV₋ indicates
    the SUV of a gold standard negative patient and SUV₊ indicates the SUV of a gold
    standard positive patient. Figure 3.1 is helpful in visualizing this process.
    If one SUV is selected at random from the upper histogram and one from the lower
    histogram, what are the chances that the one chosen from the lower is higher than
    the one chosen from the upper?


    The most important consequence for our purposes is that the area under the ROC
    curve is equal to the concordance probability that is reported by various SAS
    procedures. For example, PROC LOGISTIC reports concordance in its standard output
    under the heading “Association of Predicted Probabilities and Observed Responses.”
    Using the same call to PROC LOGISTIC that generates the data set for plotting
    the ROC curves, you can obtain the AUC from the output marked with “c”. In the
    PET example, this turns out to be 0.871 (or 87.1%), as seen from Output 3.1. The
    output also contains the elements of the computation (namely, the number of concordant,
    discordant, and tied pairs).


    # Output 3.1


    | Association of Predicted Probabilities and Observed Responses |

    | Percent Concordant 86.1 Somers'' D 0.743 |

    | Percent Discordant 11.8 Gamma 0.758 |

    | Percent Tied 2.1 Tau-a 0.348 |

    | Pairs 7638 c 0.871 |'
