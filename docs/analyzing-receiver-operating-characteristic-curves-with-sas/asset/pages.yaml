- pgno: 134
  md: "Model fit is assessed by likelihood-based criteria such as Akaike’s Information\
    \ Criterion (AIC) or Bayes Information Criterion (BIC) in PROC NLMIXED, which\
    \ are reported under Fit Statistics. These are useful for model comparison. Users\
    \ of PROC MIXED, another procedure that used likelihood methods, will be familiar\
    \ with these criteria. In contrast, model fit in PROC GLM is usually assessed\
    \ by the omnibus F-test, which is a function of the sum of squares.\n\nThe structure\
    \ of the Parameter Estimates table is similar to the output of other SAS/STAT\
    \ programs. There is normally another column labeled Alpha in the output, reporting\
    \ the significance level used in the confidence intervals, which is removed here\
    \ to save space. An additional piece of information, the value of the gradient\
    \ at the final iteration, is also provided but is likely to benefit only advanced\
    \ users.\n\n# A.2 PROC NLMIXED and the Binormal Model\n\nIt may be useful to understand\
    \ how the PROC NLMIXED programs used in Chapters 3 and 5 are developed. First,\
    \ consider the model and code from Section 3.5:\n\n```\nproc nlmixed;\n  parms\
    \ m1=0 m0=0 s1=1 s0=1;\n  if gold=1 then m=m1;else if gold=0 then m=m0;\n  if\
    \ gold=0 then s=s1**2;else if gold=0 then s=s0**2;\n  a=(m1-m0)/s1;\n  b=s0/s1;\n\
    \  model y~normal(m,s);\n  estimate 'a' a;\n  estimate 'b' b;\n  estimate 'AUC'\
    \ probnorm(a/sqrt(1+b**2)));\nrun;\nquit;\n```\n\nThe MODEL statement specifies\
    \ a normally distributed outcome with mean M and variance S, which are defined\
    \ by the two IF statements. This would produce an ROC analysis, but you would\
    \ have to manually (or in a DATA step) generate point estimates for the binormal\
    \ parameters a and b, as well as the area under the ROC curve (AUC). Obtaining\
    \ their variances would take considerable time and some knowledge of PROC IML.\
    \ This underscores the practicality of the ESTIMATE statement, where you can define\
    \ any nonlinear transformation using a DATA step-like programming approach and\
    \ obtain the point estimates and standard errors. The following code shows two\
    \ different ways of doing so:\n\n+   1. These quantities can be defined first\
    \ and then estimated. This method was used for the binormal parameters a and b\
    \ in the code above.\n+   2. The definition can be performed in the ESTIMATE step.\
    \ This method was used for the AUC in the code above.\n\nNote that the ESTIMATE\
    \ statement in PROC GLM and other SAS/STAT procedures works only with linear transformation,\
    \ so obtaining estimates of a, b, and AUC is not possible with, say, PROC GLM."
  merge: -1
  img_proc: true
- pgno: 135
  md: "Now let’s revisit the latent binormal model from Chapter 5. This highlights\
    \ a major strength of PROC NLMIXED: the ability to specify an arbitrary likelihood\
    \ function.\n\n```\nproc nlmixed data=moody gconv=0;\n    parms alpha=1 theta1=1\
    \ theta2=2 theta3=3 beta=1;\n    bounds theta1>0, theta2>0, theta3>0;\n    eta1=alpha*def;\n\
    \    eta2=exp(beta*def);\n        if r11=1 then z=probnorm(-eta1/eta2);\n    else\
    \ if r11=2 then z=probnorm((theta1-eta1)/eta2)-\n        probnorm(-eta1/eta2);\n\
    \    else if r11=3 then z=probnorm((theta2+theta1-eta1)/eta2)-\n        probnorm((theta1-eta1)/eta2);\n\
    \    else if r11=4 then z=probnorm((theta3+theta2+theta1-eta1)/eta2)-\n      \
    \  probnorm((theta2+theta1-eta1)/eta2);\n    else if r11=5 then z=1 - probnorm((theta3+theta2+theta1-\n\
    \        eta1)/eta2);\n    if z>1e-6 then ll=log(z);\n    else ll=-1e6;\n    model\
    \ r11 ~ general(ll);\n    estimate 'AUC' probnorm(alpha/sqrt(1+beta**2));\nrun;\n\
    ```\n\nThe MODEL statement specifies a GENERAL (LL) model. This means that the\
    \ (logarithm of the) likelihood function is being defined by the user through\
    \ term LL. Recall that R11 represents the ordinal credit scores and the underlying\
    \ model is a latent ordinal regression model. Each IF statement specifies the\
    \ contribution to the likelihood from every possible value of R11, the ordinal\
    \ ratings. These contributions were derived in Chapter 5 to be\n\n$$\\gamma_k(z)=\\\
    Phi\\left(\\frac{\\theta_k - \\alpha D}{e^{\\beta z}}\\right)$$\n\nThe structure\
    \ of the IF statements mimics this formulation closely. These statements uniquely\
    \ define a value for Z, the likelihood, and hence LL, which is the logarithm of\
    \ Z. The condition that the contributions to the likelihood that are less than\
    \ 10^-6 will be counted as 10^-6 ensures that very small contributions do not\
    \ cause numerical instability."
  merge: -1
  img_proc: true
