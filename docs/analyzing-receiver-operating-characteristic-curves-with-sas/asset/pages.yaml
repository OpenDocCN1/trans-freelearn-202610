- pgno: 119
  md: '# ROC Curves in SAS Enterprise Miner


    ![](img/ac26020abd4f22abfaafc0607939c6e4_119_0.png)


    +   9.1 Introduction .........................................................
    109

    +   9.2 Home Equity Loan Example ...............................................
    110

    +   9.3 ROC Curves from SAS Enterprise Miner for a Single Model .............
    111

    +   9.4 ROC Curves from SAS Enterprise Miner for Competing Models ........ 113

    +   9.5 ROC Curves Using PROC GPLOT with Exported Data from SAS Enterprise Miner
    ......................................................... 116


    # 9.1 Introduction


    SAS Enterprise Miner is a collection of data mining tools. It was introduced in
    1998 and used primarily by marketing analysts, database marketers, risk analysts,
    fraud investigators, and other professionals who try to find patterns in large
    volumes of data. SAS Enterprise Miner runs on a standard SAS platform, but it
    uses a graphical user interface (GUI) that is different from any other interface
    used by SAS. In addition, although the SAS engine on which it runs is accessible,
    SAS Enterprise Miner is designed with the premise that users will access it through
    its GUI. This contrasts with Base SAS and SAS/STAT, the focus of this book so
    far, which are accessed primarily through the program editor and by running code
    segments.


    SAS Enterprise Miner offers a wide variety of methods for data mining, including
    clustering, dimensionality reduction, link analysis, and predictive modeling.
    This chapter focuses on predictive modeling. In Chapter 8, we studied ROC curves
    for multivariable predictive models, and logistic regression was reserved to demonstrate
    issues that arise in multivariable models and solutions using SAS/STAT. In many
    ways, this chapter is an extension of Chapter 8 because it uses the capabilities
    of SAS Enterprise Miner to examine classification trees and neural networks.


    SAS Enterprise Miner has a built-in capability to generate ROC curves as part
    of its model assessment. In addition, you can create a SAS data set from the table
    that is created (behind the scenes) to generate the ROC curve. This data set can
    then be used with the techniques developed in earlier chapters for enhanced plots.
    Finally, you can score data sets within SAS Enterprise Miner using the predictive
    model(s) developed for this purpose. The results of scoring can also be'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'saved as SAS data sets, enabling you to access the modeling methods of Chapters
    3 through 6 as needed. In fact, it is even possible to generate SAS code to do
    the scoring.


    This chapter is not intended to serve as a comprehensive guide to SAS Enterprise
    Miner. The intricacies of model building and selection, actions central to data
    mining, are presented only to the extent that their discussion helps you understand
    the resulting data curves. Various intermediate steps that we will use here, such
    as missing data imputation, may not be appropriate for some other data mining
    exercises. For a solid background on SAS Enterprise Miner, consult Introduction
    to Data Mining Using SAS Enterprise Miner by Patricia Cerrito (2006).


    The audience for this chapter is SAS Enterprise Miner users, especially those
    who have not used ROC curves with the software. It is assumed here that you are
    already familiar with ROC curves at the Chapter 3 level, so a cursory reading
    of Chapter 3 may be useful at this point.


    # 9.2 Home Equity Loan Example


    The data for the example in this chapter are from the sample data library of SAS
    Enterprise Miner, Sampsio.Hmeq. The library Sampsio is internally defined when
    SAS Enterprise Miner is loaded and includes this data set. It contains nearly
    6,000 records and 13 variables, one of which is the outcome variable, or target,
    in the language of data mining. The data set depicts the home equity loan records
    of a financial services company. Approximately 20% of the past home equity credit
    lines have resulted in default. In an attempt to reduce the default rate, or perhaps
    generate applicant-tailored interest rates, the company wants to build a model
    that predicts the risk of default on a home equity loan. The target variable is
    called BAD, with a value of 1 indicating a default and a 0 indicating a serviced
    loan. The 12 predictor variables, along with a brief definition, are as follows:


    +   - CLAGE: age (months) of oldest credit line

    +   - CLNO: number of credit lines

    +   - DEBTINC: debt-to-income ratio

    +   - DELINQ: number of delinquent credit lines

    +   - DEROG: number of major derogatory reports

    +   - JOB: occupation of the debtor

    +   - LOAN: amount of the loan

    +   - MORTDUE: amount due on existing mortgage

    +   - NINQ: number of recent credit inquiries

    +   - REASON: reason for loan (debt consolidation or home improvement)

    +   - VALUE: value of the property

    +   - YOJ: years at present job


    The goal is to find a predictive model for the BAD variable using the 12 other
    variables in the data set. Although we will go through the steps required to build
    a predictive model, the focus is on constructing ROC curves using SAS Enterprise
    Miner’s built-in functionality, as well as exploring ways to export the predicted
    values to a SAS data set so that the methods and macros discussed in earlier chapters
    can be used to perform custom analyses.'
