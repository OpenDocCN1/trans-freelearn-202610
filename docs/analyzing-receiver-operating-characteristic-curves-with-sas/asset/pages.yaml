    # 6.1 Introduction


    The first five chapters covered traditional methods of analyzing ROC curves. This
    chapter presents a different approach to constructing ROC curves for a continuous
    predictor. This approach has three important advantages in that it


    +   - corresponds to an ROC curve with a very simple functional form

    +   - easily fits with built-in SAS procedures

    +   - lends itself to an easy generalization with respect to comparing ROC curves
    and covariate adjustments.


    # 6.2 Lehmann Family of Distributions


    In Chapter 3, we derived a general representation of the ROC curve in terms of
    the complement of the cumulative distribution function of the marker values conditional
    on the value of the gold standard status. If D=0,1 denotes the gold standard and
    W is the marker, then we defined'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'F(w) = P(W > w | D = 1)

    G(w) = P(W > w | D = 0)


    Then the ROC curve for W is given by


    y = F(G^{-1}(x))


    This result holds in general and there is no restriction on F and G in particular.
    Chapter 3 used this result to derive the functional form of the ROC curve for
    the binormal model by simply replacing F and G with the corresponding cumulative
    densities of the normal distribution.


    An alternative to the binormal family is to assume that F and G are related to
    one another as follows:


    G(w) = F(w)^{θ}


    The family of distributions defined by this equation is called the Lehmann family.
    This family was used by Lehmann in his seminal work (Lehmann, 1953) on the study
    of the power function of various statistical tests. For this reason, this family
    of distributions is sometimes referred to as the Lehmann alternative.


    It is important to realize that this equation does not uniquely define the actual
    distributions of marker values. It only identifies the distributions in reference
    to one another. For this reason, the term semi-parametric is commonly used to
    describe this family. Exponential distributions belong to the Lehmann family.
    Weibull distributions with a common scale parameter also belong to this family.
    On the other hand, normal and lognormal distributions are not members of the Lehmann
    family.


    The previous equations imply the following:


    y = x^{θ}


    which is the functional form of the ROC curve corresponding to the Lehmann family.
    In other words, if the conditional distributions of the marker values are linked
    to one another via θ in the Lehmann family, then the ROC curve will have the simple
    power form in this equation. Therefore, if you can estimate θ from the data, the
    estimate for an ROC curve will be immediately available.


    An important advantage of the Lehmann family is that estimation methods for θ
    are widely studied and implemented. To see this, first define the following equation:


    h_F(w) = f(w) / F(w)


    where f is the density function corresponding to F and h is often called the hazard
    function, which plays a central role in survival analysis. If G = F^{θ}, then
    the following relationship between the corresponding hazard functions holds:'
  merge: -1
  img_proc: true
- pgno: 79
  md: '\(\frac{h_F(w)}{h_G(w)} = \theta\)


    Statisticians who routinely analyze censored data will recognize this as the family
    of proportional hazards. The Lehmann family and the proportional hazards family
    are identical. Cox (1972, 1975), in two key papers, developed the idea of partial
    likelihood and showed how it can be used to estimate θ. His work led the way to
    Cox (or proportional hazards) regression models, which have become the primary
    engine for modeling censored data. The PHREG procedure in SAS implements this
    methodology and provides an easily accessible venue for parameter estimation for
    the Lehmann family.


    Although familiarity with the proportional hazards models and PROC PHREG might
    help you understand this chapter, it also might lead to confusion. Because proportional
    hazards models are almost exclusively used with censored data, it is easy to mistakenly
    assume that this chapter describes how to obtain ROC curves for censored data.
    In fact, neither the proportional hazards family nor the method of partial likelihood
    requires that the data be censored. The data sets in this chapter are actually
    identical in structure to the ones in Chapters 3 and 4: continuous markers and
    a binary gold standard. The goal is to provide an alternative to the binormal
    model, which has a full complement of regression models available.


    The principle behind the regression versions of the binormal model developed in
    Chapter 4 was to use the marker value as the dependent variable and the gold standard
    as the independent variable in a regression model. We will use the same idea here.
    In the context of proportional hazards regression, this means


    \(h_F(w; D) = h_G(w) \exp\{\beta D\}\)


    PROC PHREG produces an estimate for β and its standard error. We can use these
    to obtain an estimate of θ and its standard error. Remember that W is the marker
    and D is the binary outcome. Therefore, if D=0, then h_F=h_G and if D=1, then
    h_F=h_G e^β. Rearranging this gives the following equation:


    \(\frac{h_F(w)}{h_G(w)} = e^{\beta}\)


    Comparing this with \(\frac{h_F(w)}{h_G(w)} = \theta\) gives the following:


    \(\hat{\theta} = e^{\beta}\)


    You can use Taylor’s theorem to approximate the variance of \(\hat{\theta}\) as
    follows:


    \(V(\hat{\theta}) = \hat{\theta}^2 V(\hat{\beta})\)


    Both \(\hat{\beta}\) and \(V(\hat{\beta})\) are available from the PROC PHREG
    output.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Once θ is estimated, the ROC curve is completely specified and summary measures
    such as the AUC can be computed. Using the functional form of the Lehmann family
    of ROC curves, you can compute an estimate of the AUC as


    AŪC = ∫ x^θ dx = 1 / (1 + θ̂)


    and the variance of the AUC estimate is given by


    V(AŪC) = V(θ̂) / (θ̂ + 1)^4


    All the required components are again available from PROC PHREG output. You can
    also form pointwise confidence bands for ROC curves using the standard error of
    x^θ:


    V(y(x)) = [x^θ̂ log x]^2 V(θ̂)


    Using the Lehmann family for ROC curves is studied in detail by Gönen and Heller
    (2007). ROC curves given by y = x^θ have been studied in the literature; see,
    for example, Hanley (1988). Their derivation using a Lehmann family and implementation
    using Cox regression procedures have been made explicit by Gönen and Heller (2007).


    # 6.3 Magnetic Resonance Example


    Zajick et al. (2005) reported a study on using chemical shift magnetic resonance
    in differentiating normal, benign, and malignant vertebral marrow processes. The
    marker of interest was the percent difference between the in-phase and out-phase
    signal intensities. The article focused on establishing a range of values for
    signal intensity change in normal vertebral marrow. Here, we use their data for
    a different objective: evaluating the ability of signal intensity change in discriminating
    between normal and benign vertebral marrow processes.


    A total of 569 normal vertebrae were evaluated on 75 patients, compared with 215
    benign lesions in 92 patients. Figure 6.1 presents the side-by-side histograms
    of the signal intensity change for normal and benign vertebrae separately. This
    figure is generated by the HISTOGRAM statement of the UNIVARIATE procedure. The
    complete code is given in Section 3.1 in the context of the positron emission
    tomography example. It is clear from the histograms that the two distributions
    have some overlap, suggesting, perhaps, that the marker may not have the ability
    to discriminate between the two classes.'
  merge: -1
  img_proc: true
