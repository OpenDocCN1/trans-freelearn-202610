- pgno: 33
  md: "The AUC is estimated from the data, so there has to be a standard error associated\
    \ with this estimation. The major drawback to using PROC LOGISTIC to estimate\
    \ the AUC is that the associated standard error is not available. Fortunately,\
    \ PROC FREQ provides an indirect alternative for this purpose.\n\n# 3.4.2 Somers’\
    \ D and AUC Using PROC FREQ\n\nPROC LOGISTIC output includes Somers’ D as well.\
    \ D and AUC are related to one another through the equation D=2*(AUC-0.5). Somers’\
    \ D is simply a rescaled version of the AUC (or concordance) that takes values\
    \ between -1 and 1, like a usual correlation coefficient, instead of 0 and 1.\
    \ PROC LOGISTIC does not report the standard error for Somers’ D. However, PROC\
    \ FREQ reports both Somers’ D and its standard error, as in the following example:\n\
    \n```\nproc freq data=HeadNeck;\n    table suv*gold_standard / noprint measures;\n\
    run;\n```\n\nThe NOPRINT option suppresses the printing of the frequency table,\
    \ which could be several pages long since each unique value of the SUV will be\
    \ interpreted as a row of the table. The MEASURES option ensures that various\
    \ measures of association, including Somers’ D, are printed. Output 3.2 shows\
    \ the results from this invocation of PROC FREQ.\n\n# Output 3.2\n\n| Statistic\
    \ | Value | ASE |\n|---|---|---|\n| Gamma | 0.7585 | 0.0498 |\n| Kendall's Tau-b\
    \ | 0.5374 | 0.0402 |\n| Stuart's Tau-c | 0.6925 | 0.0561 |\n| Somers' D C|R |\
    \ 0.3889 | 0.0323 |\n| Somers' D R|C | 0.7426 | 0.0523 |\n| Pearson Correlation\
    \ | 0.6187 | 0.0395 |\n| Spearman Correlation | 0.6311 | 0.0466 |\n| Lambda Asymmetric\
    \ C|R | 0.6716 | 0.0634 |\n| Lambda Asymmetric R|C | 0.0081 | 0.0180 |\n| Lambda\
    \ Symmetric | 0.2408 | 0.0318 |\n| Uncertainty Coefficient C|R | 0.6252 | 0.0521\
    \ |\n| Uncertainty Coefficient R|C | 0.1225 | 0.0104 |\n| Uncertainty Coefficient\
    \ Symmetric | 0.2049 | 0.0172 |\n| Sample Size = 181 | | |\n\nTwo Somers’ statistics\
    \ are reported: C|R uses the column variable as the predictor and the row variable\
    \ as the gold standard, while R|C uses the row variable as the predictor and the\
    \ column variable as the gold standard. The relevant statistic here is R|C, reported\
    \ to be 0.7426 with a standard error of 0.0523. If the table was constructed so\
    \ that the marker (the SUV) was the column variable and the gold standard was\
    \ the row variable, then we would have used the Somers’ D C|R statistic."
