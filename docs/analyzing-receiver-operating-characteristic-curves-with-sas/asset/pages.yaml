- pgno: 37
  md: '```

    F(t) = Φ( (μ₀ - t) / σ₀ )

    ```


    it follows that the threshold t can be written as a function of x as follows:


    ```

    t = μ₀ - σ₀ Φ⁻¹(x)

    ```


    Because a threshold t corresponds to the sensitivity F(t), we can write the functional
    form of the ROC curve as follows:


    ```

    G(t) = Φ( (μ₁ - t) / σ₁ ) = Φ( (μ₁ - μ₀ + σ₀ Φ⁻¹(x)) / σ₁ ) = Φ( a + b Φ⁻¹(x)
    )

    ```


    where


    ```

    a = (μ₁ - μ₀) / σ₁ ,   b = σ₀ / σ₁

    ```


    These two parameters, a and b, are often referred to as binormal parameters. Sometimes
    they are called intercept and slope because plotting a binormal curve on normal
    probability paper yields a straight line with intercept a and slope b. This practice
    is not common anymore, but the nomenclature continues.


    If the marker values are not normally distributed but can be after a monotone
    transformation, then the binormal ROC curve is fitted to the transformed values.
    Nevertheless, the binormal curve fitted to the transformed values is still considered
    the ROC curve for the untransformed marker as well because the true ROC curve
    for the marker is invariant under monotone transformations, as shown in Section
    3.3. Therefore, the existence of a monotone normalizing transformation is sufficient
    to justify using the binormal approach.


    On the one hand, this is a relatively weak requirement, suggesting that most predictors
    can be thought of as binormal. On the other hand, discovering the functional form
    of h can be quite a task by itself. Note that the same h(.) must transform the
    marker to normality for both gold standard positive and negative patients. This
    process can be challenging and is discussed in the next section.


    The area under the curve for the binormal model also has a closed-form expression:


    ```

    AUC = Φ( a / √(1 + b²) )

    ```


    Estimation of the binormal model requires estimation of a and b, which in turn
    requires estimation of the mean and variances in each outcome group separately.
    This can simply be accomplished using PROC MEANS with a CLASS statement. But using
    PROC NLMIXED has many advantages, which the following example demonstrates. If
    you are not familiar with PROC NLMIXED, a relative newcomer to the SAS/STAT family,
    see the Appendix for an introduction covering its relevant capabilities.'
  merge: -1
  img_proc: true
- pgno: 38
  md: "```\nproc nlmixed data=HeadNeck;\n    parameters m1=0 m0=0 s1=1 s0=1;\n   \
    \ if gold=1 then m=m1;else if gold=0 then m=m0;\n    if gold=1 then s=s1**2;else\
    \ if gold=0 then s=s0**2;\n    a=(m1-m0)/s1;\n    b=s0/s1;\n    model suv ~ normal(m,s);\n\
    \    estimate 'a' a;\n    estimate 'b' b;\n    estimate 'AUC' probnorm(a/sqrt(1+b**2)));\n\
    run;\n```\n\nTo adopt this code for your data set, replace the variables Gold\
    \ and SUV with the variable names for the gold standard and the marker. The relevant\
    \ portion of the NLMIXED output from this execution appears under Additional Estimates\
    \ in Output 3.4.\n\n# Output 3.4\n\n| Additional Estimates |\n| Label | Estimate\
    \ | Standard Error | DF | t Value | Pr > |t| | Alpha | Lower | Upper |\n| a |\
    \ 1.4086 | 0.1830 | 181 | 7.70 | <.0001 | 0.05 | 1.0476 | 1.7696 |\n| b | 0.6597\
    \ | 0.07196 | 181 | 9.17 | <.0001 | 0.05 | 0.5177 | 0.8017 |\n| AUC | 0.8802 |\
    \ 0.02727 | 181 | 32.27 | <.0001 | 0.05 | 0.8263 | 0.9340 |\n\nYou can see that\
    \ the binormal parameters a and b are estimated to be 1.4086 and 0.6597. The corresponding\
    \ ROC curve is represented by Φ(1.41 + 0.66 Φ⁻¹(x)), where x takes on values from\
    \ 0 to 1. That the ROC curve is defined for all points between 0 and 1 is a feature\
    \ of the model. Although not all thresholds are observed, the binormal model interpolates\
    \ and makes available a value of sensitivity for all possible values of one minus\
    \ specificity.\n\nThe resulting AUC is 0.8802, with a standard error of 0.02727.\
    \ You can form a 95% confidence interval using standard asymptotics: AUC±1.96*se(AUC),\
    \ which turns out to be (0.826, 0.934). Table 3.3 compares the results from the\
    \ binormal model with those from the empirical analyses. Both the AUC estimates\
    \ and the confidence intervals are very close to each other.\n\n# Table 3.3 Comparison\
    \ of AUC Estimates from the Empirical and Binormal ROC Curves\n\n| Method | AUC\
    \ | SE | Confidence Interval |\n| Empirical | 0.8713 | 0.0263 | 0.820–0.923 |\n\
    | Binormal | 0.8802 | 0.0273 | 0.826–0.934 |\n\nFrom the standpoint of ROC curve\
    \ analyses, the ESTIMATE statement is an important strength of PROC NLMIXED because\
    \ it allows you to directly obtain estimates and, perhaps more importantly, standard\
    \ errors for a, b, and AUC. Another advantage that will be apparent in subsequent\
    \ chapters is that it is flexible enough to accommodate several different types\
    \ of ROC curves."
  merge: -1
  img_proc: true
