    \n    Contrast Coefficients\n            BSI       suv1\n\nRow1       1      \
    \  -1\n\n        Tests and 95% Confidence Intervals for Contrast Rows\n    Estimate\
    \  Std Error Confidence Limits     Chi-square Pr > ChiSq\n\nRow1   0.1023    0.0954\
    \   -0.0847     0.2893      1.1491   0.2837\n\n        Contrast Test Results\n\
    Chi-Square   DF      Pr > ChiSq\n\n    1.1491    1      0.2837\n```\n\nContrast\
    \ information appears next. This can be used to verify that the results are for\
    \ the intended comparison and to infer the direction of the difference. In this\
    \ example, a positive difference in AUC curves points to BSI being the better\
    \ test. The next piece of output compares the two ROC curves. The difference in\
    \ the two AUCs is 0.1023, as reported under the Estimate column. This could be\
    \ obtained directly as the difference between 0.7795 and 0.6773, the AUCs for\
    \ BSI and SUV reported in the first part of the output. However, you can not compute\
    \ the standard error of the difference from the information about the individual\
    \ areas because the data are paired. Based on this standard error, the difference\
    \ between the two AUCs is not significant (p=0.2837) and the confidence interval\
    \ of (−0.0847, 0.2893) spans 0.\n\nIt appears that the test statistic and the\
    \ p-value are reported twice. Had the contrast involved more than one row, then\
    \ the output on contrast rows would have included one line for each row in the\
    \ contrast. The part labeled “Contrast Test Results” would still report a single\
    \ p-value with r−1 degrees of freedom, where r is the number of rows. Therefore,\
    \ only in a contrast with a single row does information in the “Contrast Rows”\
    \ section and the “Contrast Test” section coincide."
