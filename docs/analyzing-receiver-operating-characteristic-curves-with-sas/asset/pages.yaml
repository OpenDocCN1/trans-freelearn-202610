- pgno: 22
  md: 'The first set of confidence limits are based on the well-known normal approximation
    to the binomial. The key quantity for these confidence intervals is the asymptotic
    standard error (ASE), which is given by


    ASE = sqrt( p(1 - p) / n )


    where n is the denominator for the binomial proportion (in this example, sensitivity)
    and p is the estimate of the proportion from the data. The ASE for sensitivity
    is 5.68%.


    The confidence limits appearing under the ASE are based on asymptotic theory.
    If n is large, then the 95% confidence interval can be calculated using


    p ± 1.96 × ASE


    The output reports that the asymptotic 95% confidence interval for sensitivity
    is (76.74%, 99.01%).


    Exact confidence limits, in contrast, are based on the binomial distribution,
    and they have better coverage in small samples and/or rare events. Because they
    are calculated by default when the BINOMIAL option is specified, there is no need
    to use the asymptotic confidence limits. The exact 95% confidence interval for
    sensitivity is (71.80%, 96.60%). The difference between the asymptotic and exact
    intervals highlights the typical effects of moderate sample size.


    Finally, the last part of the output provides a test of whether the sensitivity
    is equal to 80% or not. The z-statistic reported in the PROC FREQ output is computed
    by z = p / ASE(null), where ASE(null) means the ASE under the null hypothesis.
    This is a typical way of computing test statistics, sometimes referred to as a
    Wald test. The ASE(null) for our hypothesis is 6.96% and the corresponding z-value
    is 1.13. In large samples, z has a normal distribution under the null hypothesis
    so a p-value can be obtained by referring to a standard normal table. This results
    in a two-sided p-value of 0.26, suggesting that the sensitivity of frost forecast
    is no different than 80%.


    There is an important difference between confidence intervals and hypothesis tests
    in general regarding the computation of the asymptotic standard error. The ASE
    of 5.68% uses the observed p of 87.88% while the ASE under H₀ (6.96% here) uses
    the p of 80% from the null hypothesis.'
  merge: -1
  img_proc: true
- pgno: 23
  md: "Output 2.3 pertains to specificity.\n\n# Output 2.3\n\nSpecificity\n\nThe FREQ\
    \ Procedure\n\nforecast  Frequency  Percent  Cumulative Frequency  Cumulative\
    \ Percent\nNo_Frost  38  86.36  38  86.36\nFrost  6  13.64  44  100.00\n\nBinomial\
    \ Proportion for forecast = No_Frost\n\nProportion (P)  0.8636\nASE  0.0517\n\
    95% Lower Conf Limit  0.7622\n95% Upper Conf Limit  0.9650\n\nExact Conf Limits\n\
    95% Lower Conf Limit  0.7265\n95% Upper Conf Limit  0.9483\n\nTest of H0: Proportion\
    \ = 0.75\n\nASE under H0  0.0653\nZ  1.7408\nOne-sided Pr > Z  0.0409\nTwo-sided\
    \ Pr > |Z|  0.0817\n\nExact Test\nOne-sided Pr >= P  0.0523\nTwo-sided = 2 * One-sided\
    \  0.1046\n\nSample Size = 44\n\nThe following code creates Output 2.3:\n\n```\n\
    title \"Specificity\";\nproc freq data=m62(where=(observed='No_Frost')) order=freq;\n\
    \    table forecast / binomial(p=0.75);\n    weight weight;\n    exact binomial;\n\
    run;\n```\n\nThe interpretation of the output for specificity is similar to that\
    \ of sensitivity. Specificity is estimated to be 86.36% with an ASE of 5.17%.\
    \ The 95% confidence interval based on the ASE is (76.22%, 96.50%) and the 95%\
    \ exact confidence interval is (72.65%, 94.83%). A test of whether the specificity\
    \ exceeds the pre-specified target of 75% yields an asymptotic p-value of 0.0817\
    \ and an exact p-value of 0.1046. You would retain the null hypothesis in this\
    \ case based on this analysis."
  merge: -1
  img_proc: true
- pgno: 24
  md: The ORDER= option in PROC FREQ may be helpful in situations where SAS, by default,
    is choosing a binomial event different from the one you want. This leads to the
    computation of binomial proportions in a way that is the complement of the desired
    category. You can always subtract the values in the output from 1 and adjust the
    hypothesized value in a similar fashion to obtain the correct analysis. But it
    is also possible to obtain exactly the desired output by using the ORDER option
    of the PROC FREQ statement. To better understand the correct usage of the ORDER
    statement, it is important to understand that, by default (that is, in the absence
    of an ORDER option) PROC FREQ uses as event the first value in the alphabetically
    ordered list of unformatted values of the TABLE variable. This leads to frost
    being considered an event and the reported analysis is for FPR, not for specificity.
    ORDER=FREQ tells PROC FREQ to use the category that is most common as the event,
    leading to the desired analysis. This works when the specificity is greater than
    50%, which should cover most cases. When the specificity is less than 50%, then
    ORDER=FREQ also uses the incorrect category for events. A fail-proof system requires
    sorting the data first by the predictor variable, in a descending fashion, and
    then using PROC FREQ without the ORDER= specification.
  merge: -1
  img_proc: true
- pgno: 25
