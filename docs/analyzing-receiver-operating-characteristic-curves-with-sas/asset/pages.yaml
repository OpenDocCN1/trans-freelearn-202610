- pgno: 56
  md: 'The Parameter Estimates section of the output presents estimates of the model
    parameters and is of little use here. The more interesting part for ROC analysis
    is the Additional Estimates section, which provides information on the results
    of the ESTIMATE statement, including binormal parameters of BSI ($a_0$ and $b_0$)
    and SUV ($a_1$ and $b_1$). This section also reports the implied AUC ($AUC_1$
    and $AUC_0$) for each marker and the difference between the two AUCs. We see that
    the AUCs are estimated to be 0.7825 for the SUV and 0.8579 for the BSI. Their
    difference is 0.0753 and is not significant, with $p$=0.9369.


    The two contrasts are reported in the Contrasts section. The first one is the
    difference between the two AUCs, repeated here only to highlight the similarities
    between the ESTIMATE and CONTRAST statements. This contrast has the same $p$-value
    as the ESTIMATE statement (as it should) but uses the $F$-statistics rather than
    $t$-statistics. If you are familiar with analysis of variance, you will remember
    that an $F$-statistic with a single numerator degree of freedom is identical to
    the square of the corresponding $t$-statistic. The same principle applies here,
    although it is hard to see from this output since the test statistics have very
    small absolute values. Nevertheless, note that $t$=-0.08, the square of which
    is 0.01 when rounded to two decimal places.


    The contrast of real interest is the simultaneous test of the equality of the
    two binormal parameters. The results strongly suggest that there is no evidence
    against the equal ROC curves hypotheses ($p$=0.99).


    # 4.5.2 Comparisons Based on the Binormal Model with Unpaired Data


    As explained in Section 4.5.1, the random effect $u$ was introduced to the binormal
    model only to account for the within-subject correlation. In unpaired designs,
    the within-subject correlation is 0 by definition. This suggests a simple way
    to modify the code from the previous section: Remove $u$. This amounts to removing
    the RANDOM statement and cleaning up the way $m$ is defined in the programming
    statements.


    # 4.6 Discrepancy between Binormal and Empirical ROC Curves


    It is not uncommon for the binormal model and the empirical model to reach different
    conclusions. The difference between them is similar to the difference between
    rank tests and $t$-tests. If the assumptions underlying the binormal model are
    true, then the binormal model has more power, which might explain the significant
    result. On the other hand, if the model assumptions are not true, then the Type
    I error may be inflated, which would appear as increased false positive results.
    Although it is not possible to conclude which one is the driving force, certain
    features of the PROC NLMIXED output, along with exploratory graphical analyses
    like the one in Figure 4.2, remain the best way of checking the assumptions of
    binormality.


    Figure 4.2 overlays the empirical and the binormal ROC curves, the latter as estimated
    by PROC NLMIXED. The solid lines indicate the BSI and the dashed ones indicate
    the SUV. The step function signifies an empirical ROC curve, while the smooth
    one follows from the binormal model. Both binormal curves are poor fits to the
    empirical ones. This also explains the discrepancy between the AUC estimates.
    For BSI, the empirical AUC is 78% while the binormal AUC is 85%, and for SUV the
    corresponding estimates are 68% and 78%.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Figure 4.2 Comparison of ROC Curves for Prostate Cancer Data


    ![](img/ac26020abd4f22abfaafc0607939c6e4_57_0.png)


    Another sign of poor fit is the unusually large estimates of variability for the
    model parameters. The estimated values of a and b look normal, but the standard
    errors are 10 to 20 times larger than model parameters. Although this can happen
    when estimates are near 0, the estimates in this model are not close to 0.


    Be aware that despite their enormous popularity, the binormal models make some
    strong assumptions. The binormal ROC curve is no longer rank-based; every single
    observation contributes to the estimation of the binormal slope and intercept.
    Deviations from normality may have undue influences on the estimated curve and
    consequences on statistical inference. Generally, there is little reason to use
    the binormal model to compare ROC curves since methods based on the empirical
    curve are efficient and implemented in SAS.


    You should, however, keep the binormal model in your toolbox. When continuous
    covariates might affect the predictive accuracy of the marker, empirical ROC methods
    can no longer be used. You must use model-based techniques, and the binormal model
    (along with the Lehmann family, covered in subsequent chapters) provides a comprehensive
    framework from which to draw inferences.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 4.7 Bootstrap Confidence Intervals for the Difference in the Area under the
    Empirical ROC Curve


    The bootstrap idea developed in Chapter 3 can be extended to get a confidence
    interval for the difference in AUCs as well as a p-value for testing whether the
    difference is significant. The strategy is similar:


    +   - Generate B bootstrap samples.

    +   - For each sample i, compute the AUC of the two ROC curves, AUC0^(i) and AUC1^(i)
    and compute the difference Δ^(i) = AUC0^(i) − AUC1^(i).

    +   - The B numbers, Δ^(1) through Δ^(B), approximate the sampling distribution
    of the difference between the two AUCs.


    This can be accomplished by using the %BOOT2AUC macro, which is available from
    the book’s companion Web site at support.sas.com/gonen. The %BOOT2AUC macro is
    similar to the %BOOT1AUC macro introduced in Section 3.9. The only difference
    is that it allows for two variable names for the VAR macro variable. For example,
    the following call requests a comparison of SUV and BSI:


    ```

    %boot2auc(HeadNeck,suv bsi,ngold);

    ```


    The results appear in Output 4.3.


    # Output 4.3


    | AUC1 | SE | AUC2 | SE | Difference | SE |

    |---|---|---|---|---|---|

    | 0.761397 | 0.080334 | 0.674859 | 0.080334 | 0.086573 | 0.123361 |


    95% Confidence Interval for Difference


    | LowerLimit | UpperLimit |

    |---|---|

    | -0.24815 | 0.280488 |


    H0: Difference=0

    p=0.341


    The first part of the output reports the point estimates and standard errors for
    the individual AUCs as well as their difference. The AUCs and their standard errors
    are presented and labeled in the order specified in the macro call. The BSI has
    a bootstrap-estimated AUC of 0.761, and the SUV has 0.675. The difference is 0.087,
    considerable clinically but not statistically significant with p=0.341 and a confidence
    interval of (−0.248, 0.280), which includes 0.


    # 4.8 Covariate Adjustment for ROC Curves


    In some contexts, covariates influence the accuracy of predictions. In this case,
    you need to adjust the ROC curve for these covariates. For example, in the context
    of weather forecasting, the same model that produces the forecasts may have varying
    accuracy according to the altitude of the geographical location for which the
    forecasts are produced. In the field of medical diagnosis, certain patient aspects,
    such as previous exposures to therapy, may influence the ability of'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'diagnostic tools to accurately identify their current medical status. Finally,
    in the field of credit scoring, the same scoring method may have variable performance
    in different countries, perhaps due to different legal requirements on how the
    financial results are reported.


    It is important to distinguish a covariate that is a predictor of the outcome
    as opposed to a covariate that is a risk factor for the outcome. To make this
    distinction concrete, consider an example from the field of medical diagnostics.
    Lymphoma is the cancer of lymph nodes. A malignant node is typically enlarged,
    so the size of a lymph node can be a good predictor of lymphoma. Malignancy, however,
    is not the only reason that lymph nodes grow. Lymph nodes can be enlarged in patients
    fighting an infection. Therefore, the size of the lymph node is likely to be a
    good predictor in patients who did not have a recent infection but a poor predictor
    if the patient has recently had an infection. On the other hand, whether someone
    had a recent infection is not a good predictor of lymphoma. Therefore, recent
    infection is a covariate that may affect the ROC curve but not a covariate that
    may be used to predict the presence of cancer, neither by itself nor in combination
    with another predictor.


    In contrast, a family history of lymphoma (or perhaps any cancer) makes it more
    likely for a patient to have cancer because some cancers are genetically inherited.
    This may be factored into the diagnosis, formally or informally. Whether a patient
    has a family history of cancer usually has no bearing on whether an enlarged lymph
    node is a good predictor of cancer. Therefore, a family history of cancer is not
    a candidate for adjusting ROC curves.


    In its simplest form, for a categorical covariate, adjustment implies estimating
    separate ROC curves for each value of the covariate. With continuous covariates,
    you can envision an infinite number of ROC curves, one for each possible covariate
    value. This requires the use of a model that postulates a relationship between
    the covariate and the parameters of the ROC curves. It should be no surprise that
    the primary such model is regression. The next section investigates how the binormal
    model studied in Chapter 3 can be formulated as a regression model.


    # 4.9 Regression Model for the Binormal ROC Curve


    The easiest regression model does not contain any covariates. It is not a useful
    model in practice, but it helps to frame the concepts. In the context of ROC curves,
    if T denotes the marker and D denotes the disease status (gold standard), then
    you can write


    T = α₀ + α₁ D + e^{2 D β} ε


    where ε has a normal distribution with mean 0 and variance σ₀². After some algebra,
    you can show that


    a = α₁ / (e^{β} σ₀²),   b = e^{β}


    Remember that the coefficient of the variable D represents the difference of the
    means of the marker for D=1 and D=0. This holds true for any linear model and
    it will be used in subsequent chapters to extract the information relating to
    the ROC curve from more complicated models.


    This model cannot be fit using the standard linear model procedures in SAS/STAT
    software, such as GLM or REG. It can be fit, however, with PROC MIXED and, as
    we saw in Chapter 3, with PROC NLMIXED. PROC MIXED syntax is easier because it
    follows the general outline of most'
  merge: -1
  img_proc: true
- pgno: 60
  md: "of the SAS/STAT procedures. On the other hand, PROC NLMIXED can be generalized\
    \ to the case of ordinal markers as well, as we will see in Chapter 5, so there\
    \ is a value in adopting PROC NLMIXED as the primary choice of SAS/STAT procedure\
    \ for modeling ROC curves.\n\nNow we can model the covariates jointly. Consider\
    \ a binary marker W first:\n\n```\nT = α₀ + α₁D + α₂W + e^{2β} ε\n```\n\nwhich\
    \ implies\n\n```\nT = { α₀ + α₁D + e^{2Dβ} ε,   W = 0\n      α₀ + α₂ + α₁D + e^{2Dβ}\
    \ ε,   W = 1 }\n```\n\nThese two equations represent the basis for the ROC curves\
    \ for the two markers implied by the model. Notice that the coefficient of D is\
    \ the same for both ROC curves. In fact, the two equations differ only in their\
    \ intercept. Therefore, the implied binormal parameters, a and b, are the same.\n\
    \nYou can conclude that adding the covariate as a main effect only does not result\
    \ in two ROC curves being modeled separately.\n\nNow consider the following:\n\
    \n```\nT = α₀ + α₁D + α₂W + α₃DW + e^{2βD} ε\n```\n\nwhich produces the following\
    \ submodels for W=0 and W=1:\n\n```\nT = { α₀ + α₁D + e^{2βD} ε,          W =\
    \ 0\n      (α₀ + α₂) + (α₁ + α₃)D + e^{2βD} ε,   W = 1 }\n```\n\nThese two submodels\
    \ generate two different ROC curves since the coefficient of D differs by a factor\
    \ of α₃.\n\nSpecifically for W=0\n\n```\na = α₁ / (e^{β} σ₀²),   b = e^{β}\n```\n\
    \nand for W=1\n\n```\na = (α₁ + α₃) / (e^{β} σ₀²),   b = e^{β}\n```\n\nNote that\
    \ if α₃=0, the ROC curves for the two markers are identical."
  merge: -1
  img_proc: true
- pgno: 61
  md: 'In principle this model can accommodate data collected on two markers. You
    can create a binary variable for any marker and then use it in place of W to perform
    the comparison. Typically, there are two practical differences between maker comparison
    and covariate adjustment:


    +   - Marker comparisons usually involve paired data (as explained in the previous
    chapter), while covariate adjustments involve unpaired data.

    +   - Marker comparisons usually use a *heteroscedastic* model (different variances
    allowed within the two groups defined by the outcome), while covariate adjustments
    usually employ a *homoscedastic* model (equal variances assumed within the two
    groups defined by the outcome).'
  merge: -1
  img_proc: true
