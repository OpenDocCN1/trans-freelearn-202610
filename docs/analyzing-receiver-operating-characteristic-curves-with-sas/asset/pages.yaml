- pgno: 51
  md: 'As discussed here, it is essential to present a visual display of the ROC curves
    along with the comparison of the AUCs. Figure 4.1 is generated by the %PLOTROC
    macro introduced in Chapter 3. The syntax modification is similar to the one in
    the %ROC macro (that is, multiple markers are specified in the VAR macro variable,
    separated by blanks).


    ```

    %plotroc (bone bsi,suv,gold,anno=4,tlist1=1.08 2.29, tlist2=4.8 5.8);

    ```


    # Figure 4.1 ROC Curves for BSI (Solid) and SUV (Dashed) Overlaid


    ![](img/ac26020abd4f22abfaafc0607939c6e4_51_0.png)


    Figure 4.1 shows that the BSI has a higher sensitivity than the SUV for most values
    of the specificity. In the range where sensitivity is 50% through 80%, the sensitivity
    of BSI is substantially higher than that of SUV. A threshold of 2.29 for the BSI
    achieves a sensitivity of more than 80% and a specificity of more than 70%. None
    of the operating points for the SUV offers comparable accuracy. Despite this,
    keep in mind that the AUC estimates displayed high variability and the difference
    was not statistically significant.


    # 4.4.2 Comparisons with Unpaired Data


    In theory, the %ROC macro can only compare the AUCs of two predictors if the data
    are paired. Because unpaired designs are so uncommon in the field of ROC curves,
    no macro performs the desired comparison. Fortunately, unpaired comparisons are
    easy to be performed by hand or by a few lines of DATA step code: If AUC₁ and
    AUC₂ are the two AUC estimates with associated standard errors s₁ and s₂, then
    the test statistic for the unpaired comparison is as follows:


    T = (AUC₁ - AUC₂)² / (s₁² + s₂²)'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'In a large sample, T will have a chi-square distribution with one degree of
    freedom under the null hypothesis (that is, when the two AUCs are indeed equal).


    Note that AUC₁ and s₁ are reported when the %ROC macro is executed for the first
    predictor only, as explained in Chapter 3. Similarly, AUC₂ and s₂ are estimated
    from a second %ROC call. Once T is computed, the two-sided p-value can be found
    using the following line in a DATA step:


    ```

    p_value=1-probchi(t_unpaired,1);

    ```


    If the prostate cancer study offered either a PET or a BSI (but not both) so that
    the resulting data structure was unpaired, and if the AUC estimates and their
    standard errors were the same as described previously (0.7795 and 0.6773 for the
    AUCs, 0.0771 and 0.0836 for the standard errors), then T would be 0.8095 and the
    p-value would be 0.3683. The increase in p-value using the unpaired design can
    be explained by the increased efficiency of the paired design, as briefly discussed
    in Section 4.3.


    # 4.5 Comparing the Binormal ROC Curves


    Chapter 3 shows that you can achieve a model-based estimate of the ROC curve by
    assuming that the distributions of the marker for the diseased and non-diseased
    groups have normal distributions with possibly different parameters. Specifically,
    if diseased patients’ marker values follow a normal distribution with mean μ₁
    and variance σ₁² and if non-diseased patients’ marker values follow a normal distribution
    with mean μ₀ and variance σ₀², then the ROC curve can functionally be written
    as


    Φ(a + bΦ⁻¹(x))


    with the AUC given by


    Φ( a / √(1+b²) )


    where the binormal parameters a and b are given by


    a = (μ₁ - μ₀)/σ₁,   b = σ₀/σ₁


    Next, we discuss paired data in detail; comments about unpaired data appear at
    the end of this section.


    # 4.5.1 Comparisons Based on the Binormal Model with Paired Data


    The paired nature of the data requires some adjustment to the model before you
    can proceed. Let Xᵢⱼ denote the marker value for the iᵗʰ patient and the jᵗʰ marker.
    Then Xᵢⱼ (or some transformation of it) is assumed to have the following normal
    distribution if the patient has a positive outcome:


    Xᵢⱼ ~ N( μ₁ⱼ + uᵢ, σ₁ⱼ² )'
  merge: -1
  img_proc: true
- pgno: 53
  md: "If the patient has a negative outcome, then $X_{ij}$ would be distributed as\n\
    \n$X_{ij} \\sim N\\left(\\mu_{0j}+u_i,\\sigma_{0j}^2\\right)$\n\nThe $u_i$ is\
    \ normally distributed as well:\n\n$u_i \\sim N\\left(0,\\sigma_r^2\\right)$\n\
    \nwith the key assumption that $u_i$ and $u_{i'}$ are independent for $i\\neq\
    \ i'$ .\n\nThis model has four fundamental parameters for each marker: $\\mu_{1i}$\
    \ and $\\mu_{0i}$ are the means of the outcome positive and outcome negative patients\
    \ for marker $j$, and $\\sigma_{1i}$ and $\\sigma_{0i}$ are the two standard deviations.\
    \ In this respect, it is a standard binormal model for each marker separately.\
    \ To take into account the correlation between the two marker measurements on\
    \ the same subject, a random effect $u$ is introduced. Because $u_i$ is a subject-specific\
    \ effect, the two marker values that are measured on the same patient will have\
    \ the same $u_i$. This commonality induces a correlation on the two measurements\
    \ (one for each marker) taken on the same subject. Because $u_i$ and $u_{i'}$\
    \ are independent for $i\\neq i'$, there is no correlation between marker values\
    \ that were not measured on the same subject. Use of random effects to induce\
    \ correlations on selected pairs of subjects is a standard technique in most settings.\n\
    \nThe following code segment first runs PROC TRANSREG to identify a transformation\
    \ to normality. See Section 3.7 for a detailed explanation of the role of this\
    \ step in fitting binormal models.\n\n```\nproc transreg data=bone;\n    model\
    \ boxcox(suv1/parameter=0.1 geometricmean)=class(gold);\n    output out=trsuv;\n\
    run;\n\nproc transreg data=bone;\n    model boxcox(bsi/parameter=0.1 geometricmean)=class(gold);\n\
    \    output out=trbsi;\nrun;\n```\n\nThe Box-Cox model identifies the logarithmic\
    \ transformation for the BSI and the square-root transformation for the SUV as\
    \ the best possible transformations to normality (detailed PROC TRANSREG output\
    \ not shown). The output data sets TRSUV and TRBSI are created by the OUTPUT statement\
    \ in PROC TRANSREG and include the transformed covariates, TBSI and TSUV. These\
    \ two data sets are combined to form Long, a data set in long form. Then PROC\
    \ NLMIXED finds the maximum likelihood estimates for the random-effects binormal\
    \ model, as specified previously.\n\n```\ndata long;\n    set trbsi(keep=_name_\
    \ gold tbsi rename=(tbsi=result _name_=subid)\n        in=in1)\n        trsuv(keep=_name_\
    \ gold tsuv rename=(tsuv=result _name_=subid)\n        in=in2);\n    if in1 then\
    \ marker=0; else if in2 then marker=1;\nrun;\n```"
  merge: -1
  img_proc: true
- pgno: 54
  md: "```\nproc nlmixed data=long method=firo technique=quanew;\n    parms sr=1 s11=3\
    \ s10=0.3 s01=2 s00=0.2 m11=7 m10=1 m01=2 m00=0;\n    bounds sr s11 s10 s01 s00>0;\n\
    \    if gold=1 and marker=0 then do;\n        m=m10+u; s=s10**2; end;\n    if\
    \ gold=1 and marker=1 then do;\n        m=m11+u; s=s11**2; end;\n    if gold=0\
    \ and marker=0 then do;\n        m=m00+u; s=s00**2; end;\n    if gold=0 and marker=1\
    \ then do;\n        m=m01+u; s=s01**2; end;\n    a1=(m11-m01)/s11;\n    b1=s01/s11;\n\
