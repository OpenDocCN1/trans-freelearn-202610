- pgno: 42
  md: "You can create a data set containing the transformed values in PROC TRANSREG\
    \ using the OUTPUT statement. These transformed values can then be used in a PROC\
    \ NLMIXED call similar to the one in Section 3.6 to estimate the binormal parameters\
    \ for the transformed variates. Although the steps for doing so aren’t detailed\
    \ here, you might want to try this exercise to gain practical skills.\n\n# 3.8\
    \ Direct Estimation of the Binormal ROC Curve\n\nSection 3.6 describes how to\
    \ derive the functional form of a binormal ROC curve, starting with the basic\
    \ assumption that the distribution of the marker is normal (with possibly different\
    \ means and variances) in positive and negative groups. It then shows how PROC\
    \ NLMIXED can be used to obtain estimates of the parameters of these two normal\
    \ distributions. This method assumes that the observed data are normally distributed.\
    \ However, as noted in Section 3.7, it is possible to transform the observed values\
    \ to improve adherence to the normality assumption and then apply the approach\
    \ outlined in Section 3.4 on the transformed values to obtain improved estimates\
    \ of the ROC curve.\n\nThere is a simpler and more direct method to estimate the\
    \ binormal ROC curve. Note that the binormal curve has only two parameters, a\
    \ and b, and the ROC curve is given by\n\ny = Φ(a + bΦ⁻¹(x))\n\nwhere y is the\
    \ sensitivity and x is one minus the specificity. You can first plot the observed\
    \ ROC points, as if for an empirical ROC curve, but instead of connecting them,\
    \ you can fit a curve with the form above and find a and b such that the resulting\
    \ fit is best. This process is further facilitated by the observation that\n\n\
    Φ⁻¹(y) = a + bΦ⁻¹(x)\n\nTherefore, if the ROC points are first transformed to\
    \ the probit scale, then you only need to fit a line, which can be done, almost\
    \ trivially, by using least squares. There are many SAS/STAT procedures available\
    \ for this purpose, but PROC REG offers the simplest interface. Suppose ROCData\
    \ is a data set created by the OUTROC= option of PROC LOGISTIC. Then you can estimate\
    \ the binormal parameters by using the following code:\n\n```\ndata ROCData;\n\
    \    set ROCData;\n    _y=probit(_sensit_);\n    _x=probit(_1mspec_);\nrun;\n\n\
    proc reg data=ROCData;\n    model _y=_x;\nrun;\nquit;\n```\n\nThis method leads\
    \ to estimates of 1.71 and 0.85 for the binormal parameters a and b, respectively,\
    \ in the head and neck cancer data, compared with 1.31 and 0.66 when the binormal\
    \ parameters were estimated by modeling the marker values directly using PROC\
    \ NLMIXED. Figure 3.7 shows the two different binormal fits to the empirical curve\
    \ (solid line). The dashed line is the PROC NLMIXED estimate and the dotted line\
    \ is the PROC REG estimate."
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Figure 3.7 Estimates of the ROC Curve Obtained from NLMIXED, REG, and LOGISTIC
    Procedures


    ![](img/ac26020abd4f22abfaafc0607939c6e4_43_0.png)


    Although the direct estimation of the ROC curve using least squares is attractive
    because of its simplicity, it is not without problems, especially the fact that
    the points on the ROC curve are in fact points from a cumulative distribution
    function and are not independent. So PROC REG standard errors are likely to be
    underestimates of the true standard errors. Therefore, you should not use least
    square estimates for inference (such as reporting confidence intervals) but as
    point estimates of the binormal parameters. Since the binormal curve is a function
    of the binormal parameters, direct estimation of the ROC curve using the least
    squares estimates is correct, but the resulting standard errors and p-values are
    incorrect.


    # 3.9 Bootstrap Confidence Intervals for the Area under the Curve


    Bootstrap is a modern method that originally started for assessing the variability
    in point estimates. It has since expanded to perform hypothesis tests, validation
    of predictive models, model selection, and many other statistical tasks.


    In this book, bootstrap methods are used for


    +   - Non-parametric confidence intervals for the area under the ROC curve

    +   - Hypothesis tests that compare two or more ROC curves with respect to their
    AUCs

    +   - Correcting for the optimism in the evaluation of multivariable prediction
    models, such as logistic regression, or data mining predictions, such as classification
    trees.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Very briefly, a bootstrap sample is obtained by sampling from the observed
    data with replacement. The following steps describe the process in pseudo-code:


    +   1. Create B data sets, each random samples with replacement from the original
    data.

    +   2. For i=1,...,B, analyze data set i exactly as the original data set would
    have been analyzed (for example, compute the empirical AUC). Assign the results
    (possibly several values) to R(i).

    +   3. R(1), ..., R(B) is an approximation of the sampling distribution of R.


    The approximation works better for large B. In most applications, B is between
    200 and 2,000. Statistics estimated from the approximate sampling distribution
    serve as the desired estimates. For example, the standard deviation of the B numbers
    R(i) is approximately the standard error of R. Further review of the bootstrap
    method is beyond the scope of this book. Consult Efron and Tibshirani (1993) for
    more information.


    The macro %BOOT1AUC, which is available from the book’s companion Web site at
    support.sas.com/gonen, performs a bootstrap analysis for the area under the curve
    of a single ROC curve. An example call is as follows:


    ```

    %boot1auc(data=HeadNeck,marker=suv,gold=ngold);

    ```


    although there are two other possible inputs: BOOT specifies the number of bootstrap
    samples (default of 1,000) and ALPHA specifies the error level for the confidence
    intervals. Output 3.6 shows the results.


    # Output 3.6


    Bootstrap Analysis of the AUC for suv

    AUC  StdErr

    --------

    0.871523  0.026945


    95% Confidence Interval

    LowerLimit  UpperLimit

    --------

    0.813384  0.920954


    If you want to further develop your own bootstrap applications, PROC SURVEYSELECT
    provides the easiest way to create a bootstrap sample with SAS:


    ```

    proc surveyselect data=HeadNeck method=urs n=181 out=_sample outhits rep=100 noprint;

    run;

    ```


    This call to PROC SURVEYSELECT generates 100 samples (as specified with the REP=
    option) and each sample has 181 elements (as specified by the N= option). In general,
    each bootstrap sample has the same size as the original data set, so the N= option
    typically equals the sample size. METHOD=URS allows unrestricted random sampling
    and corresponds to a sampling schema that gives equal probability to each record
    in the data set and performs the sampling with replacement. The OUT= option specifies
    the data set in which the bootstrap samples are saved. Finally, the OUTHITS= option
    ensures that a record that was selected more than once (which is'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'possible in sampling with replacement) appears as many times as it was selected
    in the output data set. The default (when the OUTHITS= option is not specified)
    represents that record with a single observation, along with a variable that indicates
    the number of hits (i.e., the number of times it was selected).


    An important feature of the data set created by PROC SURVEYSELECT is that it contains
    a variable called Replicate that identifies the bootstrap sample. Because bootstrap
    samples are analyzed separately, you can use the BY processing available in most
    SAS/STAT procedures. For example, to compute the AUC for each bootstrap sample,
    you can call PROC LOGISTIC using a BY REPLICATE statement and create an output
    data set using the ODS OUTPUT statement. This output data set will also include
    the REPLICATE column along with the AUC index computed for each bootstrap sample.
    Therefore, developing SAS code for the bootstrap method has become substantially
    easier with PROC SURVEYSELECT. In addition, because BY processing is much faster
    than competing ways of performing the same task, such as using macro loops, this
    strategy leads to computationally efficient programs. This feature is critical
    because bootstrap methods can require intensive computer resources.'
  merge: -1
  img_proc: true
