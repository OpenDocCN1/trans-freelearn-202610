    # 6.6 Comparing Markers Using the Lehmann Family of ROC Curves


    Chapter 5 explored the idea of using a regression model to compare two or more
    ROC curves. The principal idea was to include an indicator variable for the type
    of marker in a regression model. For the case of the binormal model, the appropriate
    regression model was a heteroscedastic normal regression. For the Lehmann family,
    the appropriate regression model is a proportional hazards regression, as we have
    already seen in Section 6.3.


    Specifically, let U be an indicator variable that takes on values of 0 and 1 for
    the two different markers or predictors. Then, following the logic from Section
    6.3, you can write the following equation:


    ```

    h(V | U, D = 1) / h(V | U, D = 0) = exp{β₁ + β₃U}

    ```


    This model is similar to those in Chapters 4 and 5 in the context of the binormal
    model. It is also identical in form to the one considered in Section 6.2, where
    U represents age, a continuous covariate. Therefore, the PHREG statements are
    also identical and are not shown here again.


    If β₃ = 0 then the two ROC curves are identical. Therefore, a formal comparison
    can be done by testing H₀ : β₃ = 0. The Wald test readily available in PROC PHREG
    output can be used for this purpose. From an operational standpoint, comparing
    the ROC curves of two markers is no different than comparing the ROC curves for
    different age groups, so the steps described in Section 6.4 apply here, too.


    There is a potentially important aspect in which marker comparisons may differ
    from covariate comparisons. As we discussed in Chapter 4, paired designs are the
    dominant form of data collection for most studies involving a comparison of multiple
    markers. The previous model, when estimated by partial likelihood, implicitly
    assumes that observations are independent. But Section 6.4 shows that an estimating
    equations approach to fitting the regression model allows you to obtain the proper
    standard error estimates when the data are correlated. Paired data are special
    cases of correlated data, and the marginal model approach outlined in the previous
    section can be used to fit the model in the presence of paired data.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# 6.7 Advantages and Disadvantages of the Lehmann Family of ROC Curves


    With the advent of non-parametric methods for the ROC curve of a single predictor,
    you don’t need to use the binormal model or the Lehmann family. The utility of
    these model-based approaches becomes evident only when you consider more complicated
    problems, such as covariate adjustments or correlated data.


    As with any model-based statistical method, performance of the Lehmann family
    of ROC curves is a direct function of how well the data-generating process is
    approximated by the Lehmann assumption. If there is strong evidence that the data
    follow the Lehmann assumption, then the methods discussed in this chapter are
    appropriate and preferable. Under these conditions, commonly performed statistical
    tasks for ROC curves, such as covariate adjustment, comparison of several markers,
    and analysis using clustered data, can all be handled using PROC PHREG, a major
    advantage of the Lehmann family.


    Despite the best efforts to verify or rule out the Lehmann assumption, the data
    might neither strongly deviate from nor strongly favor the Lehmann assumption.
    Although there is no substitute for careful and expert statistical analysis, you
    should consider the advantages and disadvantages for the Lehmann family and the
    competing methods. The chief advantages of the Lehmann family are its simple functional
    form, making it easy to interpret the results and gain insight, and the availability
    of the software. The primary disadvantage is its lack of flexibility: With a single
    parameter, the empirically evident shape of the ROC curve may not be accommodated.'
  merge: -1
  img_proc: true
