- pgno: 11
  md: '# Introduction


    ![](img/ac26020abd4f22abfaafc0607939c6e4_11_0.png)


    1.1 About Receiver Operating Characteristic Curves ............................................
    1


    1.2 Summary of Chapters ...............................................................
    3


    # 1.1 About Receiver Operating Characteristic Curves


    This book describes how to analyze receiver operating characteristic (ROC) curves
    using SAS software. A receiver operating characteristic curve is a statistical
    tool to assess the accuracy of predictions. It is often abbreviated as ROC curve
    or ROC chart, the latter being used more often in data mining literature.


    Making predictions has become an essential part of every business enterprise and
    scientific field of inquiry. A simple example that has irreversibly penetrated
    daily life is the weather forecast. Almost all news sources, including newspaper,
    radio, and television news, provide detailed weather forecasts. There is even
    a dedicated television channel for weather forecasts in the United States.


    Of course, the influence of a weather forecast goes beyond a city dweller’s decision
    to pack an umbrella. Inclement weather has negative effects on many vital activities
    such as transportation, agriculture, and construction. For this reason, collecting
    data that help forecast weather conditions and building statistical models to
    produce forecasts from these data have become major industries.


    It is important for the consumers of these forecasts to know their accuracy. This
    helps them to incorporate these predictions into their future plans. It also helps
    them decide between competing providers. Similarly, it is important for forecast
    providers to assess the accuracy of their forecasts since accuracy is a direct
    indicator of the quality of their product. Assessing accuracy is also important
    when providers decide to invest in technologies to improve the forecasts. An improvement
    in the forecast is intrinsically linked to an improvement in accuracy.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Credit scoring is another example of making predictions: When a potential debtor
    asks for credit, creditors assess the likelihood of default to decide whether
    to loan the funds and at what interest rate. Accurately assessing a debtor’s chance
    of default plays a crucial role for creditors to stay competitive. For this reason,
    the prediction models behind credit scoring systems remain proprietary. Nevertheless,
    their predictive power needs to be continuously assessed for creditors to remain
    profitable.


    A final example concerns the field of medical diagnostics. The word *prediction*
    rarely appears in this literature, but a diagnosis is a prediction of what might
    be wrong with a patient exhibiting certain symptoms and complaints. Most diseases
    elicit a response that increases levels of a substance in the blood or urine.
    However, there might be other reasons for such elevated levels; hence, assessing
    blood or urine levels alone can create a misdiagnosis. It is critical to understand
    how accurate such diagnoses are because they influence subsequent evaluations
    and treatments. It is also common to have multiple diagnostic markers or tools
    available, and a fair assessment of them involves comparing their accuracies.
    These diagnostic options may differ in their cost and risk to the patient, in
    which case a decision analysis can be performed where the value of each tool is
    quantified based on the accuracy of the diagnoses made by the tool.


    All these examples have a common theme. A prediction is made before the value
    of the entity that is predicted is known. We need a method to evaluate the accuracy
    of these predictions. As these examples make clear, it would be helpful if the
    method could compare the accuracy of several predictions.


    Various conventions are used to name the predictions and the outcome. Table 1.1
    summarizes the most commonly used names.


    # Table 1.1 Common Nomenclature for the Elements of an ROC Curve


    | Variable That Predicts | Variable to Be Predicted | Values of the Variable to
    Be Predicted |

    |---|---|---|

    | Predictor | Outcome | Case/Control |

    | Marker | Status | Diseased/Non-Diseased |

    | Score | Gold Standard | Positive/Negative |

    | Forecast | Indicator | Present/Absent |

    |  |  | Event/Non-Event |


    ROC curves provide a comprehensive and visually attractive way to summarize the
    accuracy of predictions. They are widely applicable, regardless of the source
    of predictions. You can also compare the accuracy of different methods of generating
    predictions by comparing the ROC curves of the resulting predictions. Therefore,
    it may come as a surprise to realize that ROC curves are generally ignored during
    the education and training of statisticians. Most statisticians learn about ROC
    curves on the job, as needed, and struggle through some of the unusual features
    of this type of analysis.


    To make matters worse for SAS users, very few direct methods are available for
    performing an ROC analysis in SAS. However, many existing procedures can be tailored
    with little effort to produce ROC curves. SAS Institute also provides a macro
    to perform some of the calculations. This book describes how to produce ROC curves
    with the available features in SAS and expands on further analyses using other
    SAS procedures.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# 1.2 Summary of Chapters


    Methods for evaluation of accuracy depend on the nature of the predictor. Chapter
    2, “Single Binary Predictor,” and Chapter 3, “Single Continuous Predictor,” introduce
    appropriate methods for binary and continuous variables. These two chapters discuss
    material that is used repeatedly in subsequent chapters, so you must have a good
    grasp of these concepts before reading further. If you are already familiar with
    these statistical concepts but are more interested in learning the capabilities
    of SAS with respect to ROC curves, skip the parts introducing and discussing these
    concepts. Most of the SAS code in this book is presented within the context of
    examples, so it will be sufficient for those readers to have a cursory reading
    of Chapters 2 and 3 to familiarize themselves with notation and then carefully
    follow the examples to master the SAS code.


    Most of the computations are performed using PROC FREQ, PROC LOGISTIC, or PROC
    NLMIXED. There are also a few macros that are very useful in plotting the ROC
    curve or computing the standard errors of the areas under the ROC curves. Occasional
    calls to PROC TRANSREG (for Box-Cox transformation) or PROC MIXED along with the
    use of PROC SURVEYSELECT for creating bootstrap samples are used.


    Note: There is no standard mathematical notation for most of what needs to be
    presented here. I tried to balance my personal preference with widely accepted
    practices; this is why a cursory reading is recommended, even for those who feel
    comfortable with the statistical concepts.


    Chapter 4, “Comparison and Covariate Adjustment of ROC Curves,” compares the ROC
    curves of several markers and adjusts them for covariates. The principle tool
    for this purpose is regression, which accommodates both categorical and continuous
    covariates. Regression methods can also be used to compare the accuracy of several
    markers by representing the markers with dummy variables in an ANOVA-like model.
    Although the mechanistic aspects of these regression models are similar to other
    regression models, the inclusion and interpretation of model coefficients are
    unique to the field of ROC curves.


    Chapter 5, “Ordinal Predictors,” repeats the material in Chapters 3 and 4 for
    an ordinal predictor. The ideas are very similar, but the statistical techniques
    are slightly different, such as the use of a latent variable probit regression
    model, which is also commonly called the binormal model in ROC literature. While
    it is possible to study Chapter 5 with only a superficial understanding of the
    earlier material, I recommend mastering the concepts in Chapters 2 and 3 first.


    Chapter 6, “Lehmann Family of ROC Curves,” and Chapter 7, “ROC Curves with Censored
    Data,” present relatively new material that has not yet made its way into other
    books. The Lehmann family of ROC curves, the focus of Chapter 6, uses the proportional
    hazards model exclusively. Proportional hazards models are routinely used in survival
    analysis but rarely in other applications. Chapter 6 shows how it can be used
    to create ROC curves and extended to regression models and clustered data using
    the capabilities of PROC PHREG. Most statisticians identify PROC PHREG with censored
    data, but Chapter 6 deals with a binary outcome that is fully observed, just like
    the outcome variables in Chapters 2 through 5. The problem of creating ROC curves
    with censored data is tackled in Chapter 7. Two methods of computing a concordance
    probability are provided, along with a discussion of time-dependent ROC curves.


    Chapter 8, “Using the ROC Curve to Evaluate Multivariable Prediction Models,”
    discusses the use of ROC curves when multivariable prediction models are built
    and assessed on the same data set. Chapter 9 uses the same concepts in the context
    of data mining. Although the concepts remain the same, the primary SAS data mining
    engine, SAS Enterprise Miner, has a very'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'different user interface and functionality than SAS/STAT software. Hence, most
    of Chapter 9 discusses how models are developed in SAS Enterprise Miner and how
    ROC curves can be produced using the built-in functionality for model assessment.
    Also shown are ways of exporting the data for the ROC curves so that you can create
    custom plots using SAS/GRAPH software.


    Most of the SAS code presented consists of SAS/STAT and SAS/GRAPH software; Base
    SAS is used occasionally to prepare the data for analysis and plotting. SAS/STAT
    procedures FREQ, LOGISTIC, MIXED, and NLMIXED provide most of the required ammunition
    for the analyses.


    You should have a basic understanding of linear models and regression analysis.
    This book assumes no prior experience with SAS/STAT procedures; however, if you
    aren’t familiar with common SAS System concepts, such as BY processing or the
    CLASS statement, you may benefit from consulting a general-purpose SAS manual.


    This book features a generic macro that can be used to plot ROC curves regardless
    of the nature or origin of the predictions. Those who find the options offered
    by this macro sufficient may not need any direct use of SAS/GRAPH software. However,
    graphical presentation involves a degree of personal style, and you might like
    to customize your curves and to use particular annotations. If so, you can use
    the intermediate data sets created by the macro and write your own SAS/GRAPH code
    to produce custom graphics.


    It is likely that the SAS code presented in this book, especially the macros,
    will evolve. The code, which is available for download from the book’s companion
    Web site at support.sas.com/gonen, will be updated routinely, so check the Web
    site frequently for the latest developments.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Single Binary Predictor


    ![](img/ac26020abd4f22abfaafc0607939c6e4_15_0.png)


    +   2.1 Introduction .........................................................
    5

    +   2.2 Frost Forecast Example ...............................................
    5

    +   2.3 Misclassification Rate ...............................................
    6

    +   2.4 Sensitivity and Specificity ..........................................
    7

    +   2.5 Computations Using PROC FREQ ....................................... 8


    # 2.1 Introduction


    One of the simplest scenarios for prediction is the case of a binary predictor.
    It is important not only because it contains the most critical building blocks
    of an ROC curve but also because it is often encountered in practice. This chapter
    uses an example from weather forecasting to illustrate the concepts. Problems
    dealing with similar data are abundant as well, ranging from diagnostic medicine
    to credit scoring.


    # 2.2 Frost Forecast Example


    Thornes and Stephenson (2001) reviewed the assessment of predictive accuracy from
    the perspective of weather forecast products. Their opening example is very simple
    and accessible to all data analysts regardless of their training in meteorology.
    The example discusses frost forecasts produced for the M62 motorway between Leeds
    and Hull in the United Kingdom during the winter of 1995. A frost occurs when
    the road temperature falls below 0 °C. First, the forecast for each night is produced
    as a binary indicator (frost or no frost). Then the actual surface temperature
    of the road is monitored throughout the night and the outcome is recorded as frost
    if the temperature dropped below 0 °C and as no frost if it did not drop below
    0 °C. The guidelines provided by the Highways Agency mandate the reporting of
    results (both forecast and actual) in a consolidated manner (see the Frost and
    No Frost columns and rows in Table 2.1) only for the days for which the actual
    temperature was below 5 °C. The example refers to the winter of 1995, when the
    actual road surface temperature was below 5 °C on 77 nights. The results are given
    in Table 2.1. Such a tabular description is the standard way of reporting accuracy
    when both the'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'prediction and the outcome are binary. It is visually appealing and simple
    to navigate, and it contains all the necessary information.


    There were 29 nights when frost was forecast and a frost was observed, and there
    were 38 nights when no frost was forecast and no frost was observed. Those two
    cells (the shaded portion of Table 2.1) represent the two types of correct forecast.
    A general terminology for these two cells is *true positives (TP)* and *true negatives
    (TN)*. The roots of this terminology can be found in medical diagnostic studies
    when a test is called positive if it shows disease and negative if it does not.
    By analogy, you can consider frost to mean positive and no frost to mean negative,
    in which case there are 29 true positives and 38 true negatives in Table 2.1.


    # Table 2.1 Forecast Accuracy for Road Surface Temperatures


    | Forecast | Observed |  |  |

    | | Frost | No Frost | Total |

    | Frost | 29 | 6 | 35 |

    | No Frost | 4 | 38 | 42 |

    | Total | 33 | 44 | 77 |


    What about forecast errors? There were 6 nights when a frost was forecast and
    none was observed. There were 4 nights when no frost was forecast, but a frost
    was observed. One can easily extend the terminology to call these two cells *false
    positives (FP)* and *false negatives (FN)*. Table 2.2 is a generic representation
    of Table 2.1 using the terminology introduced here.


    # Table 2.2 Reporting Accuracy for Binary Predictions


    | Forecast | Observed |  |  |

    | | Positive | Negative | Total |

    | Positive | True Positive (TP) | False Positive (FP) | TP+FP |

    | Negative | False Negative (FN) | True Negative (TN) | FN+TN |

    | Total | TP+FN | FP+TN | TP+FP+FN+TN |


    # 2.3 Misclassification Rate


    There are a variety of ways to summarize forecast accuracy. An obvious one is
    the *misclassification rate (MR)*, which is the proportion of all misclassified
    nights, the sum of false negative and false positives, out of all nights:


    $$MR = \frac{FN + FP}{TP + FN + FP + TN}$$


    One minus the misclassification rate is sometimes called *percent correct* or
    simply *accuracy*. The MR for the data in Table 2.1 is 10/77=13%.


    While the misclassification rate is simple to compute and understand, it is sometimes
    too crude for understanding the mechanism behind misclassification. It is also
    prone to bias if the information is not assembled carefully. Suppose that instead
    of following the Highways Agency’s guidelines, the forecast provider decided to
    include all nights in a calendar year. There are 77 nights reported in Table 2.1
    and, by definition, all those nights the actual temperature dropped'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'below 5 °C. Therefore, the remaining 288 nights were all above 5 °C (no frost),
    bringing column marginal totals to 33 nights with frost (unchanged) and 332 nights
    with no frost. It is possible that the MR for the 288 nights when the temperature
    was above 5 °C was much less than the MR for the nights when the temperature was
    below 5 °C. Suppose that the misclassification rate for these 288 nights was 5%,
    resulting in 15 misclassified nights (rounded up). Then there would be a total
    of 25 misclassified nights out of 365 and the MR would be 25/265=7%. Table 2.3
    shows several possibilities.


    # Table 2.3 Percent Misclassified for the 288 Nights When the Temperature Was
    above 5 °C and the Corresponding MR for All 365 Nights


    | Percent misclassified for the 288 nights when the temperature was above 5 °C
    | 0 | 1 | 2 | 4 | 6 | 8 | 10 | 12 | 13 |

    | Percent misclassified for all 365 nights | 2.7 | 3.5 | 4.3 | 5.9 | 7.5 | 9.1
    | 10.6 | 12.2 | 13.0 |


    It is clear that the MR is sensitive to which nights are included in the sample
    because the performance of the forecast is not homogeneous for all the nights
    in a year. It is also clear that as you include more easy-to-forecast nights in
    the sample, the MR becomes smaller. You can safely assume that for warm days in
    spring and summer no nightly frost forecast for the M62 is necessary because most
    people can make the same prediction (no frost!) quite accurately without resorting
    to a scientifically obtained forecast. This explains why the Highways Agency restricts
    the accuracy reporting to nights when the actual temperature was 5 °C or less.
    It also highlights the fact that interpretation of the MR depends on the proportion
    of nights with frost in the sample (30% in this example). This proportion is sometimes
    called prevalence.


    In unregulated areas such as credit scoring, where scoring algorithms remain mostly
    proprietary, there are no such rules, or even guidelines, on how accuracy should
    be evaluated. In addition, consumers of predictions are not always diligent or
    knowledgeable in interpreting the details or intricacies of accuracy. Therefore,
    you need measures that are more robust.


    # 2.4 Sensitivity and Specificity


    The most common way of reporting the accuracy of a binary prediction is by using
    the true (or false) positives and true (or false) negatives separately. This recognizes
    that a false negative prediction may have different consequences than a false
    positive one. It also makes these measures independent of prevalence. For this
    reason, these two measures are considered to gauge the inherent ability of the
    predictor. In this weather forecast example, a false positive is probably less
    costly because its primary consequence may be more cautious and better-prepared
    drivers. On the other hand, a false negative may end up in insufficient preparation
    and accidents. This suggests reporting false positive and false negative rates
    separately.


    ```

    FPR = FP / (TN + FP),   FNR = FN / (TP + FN)

    ```'
  merge: -1
  img_proc: true
- pgno: 18
  md: "It is more common to work with true positive and true negative rates, defined\
    \ as\n\n$$TPR = \\frac{TP}{TP + FN}, \\quad TNR = \\frac{TN}{TN + FP}$$\n\nThe\
    \ true positive rate (TPR) is sometimes called *sensitivity* and the true negative\
    \ rate (TNR) is sometimes called *specificity*. While these are generic terms\
    \ that routinely appear in statistics literature, each field has come up with\
    \ its own terminology. Weather forecasters, for example, use the miss rate for\
    \ FNR and the false alarm rate for FPR.\n\nThe FNR and FPR for the weather forecast\
    \ data are 4/33=12% and 6/44 = 14%, respectively. The sensitivity and specificity\
    \ are 29/33=88% and 38/44=86%, respectively. In this instance, the FPR and FNR\
    \ are both very close to each other. When this is the case, they will also be\
    \ very close to the MR. In fact, the MR is a weighted average of the FPR and the\
    \ FNR: $MR = w*FPR + (1-w)*FNR$, where the weight ($w$) is the proportion of nights\
    \ with an observed frost. This is sometimes called the *prevalence* of frost.\n\
    \nNote that the denominators for TPR and TNR are the total observed positives\
    \ and negatives. It is possible to define similar quantities using the forecast\
    \ positives and negatives as the denominator. In this case, the ratios corresponding\
    \ to sensitivity and specificity are called the *positive predictive value (PPV)*\
    \ and *negative predictive value (NPV)*:\n\n$$PPV = \\frac{TP}{TP + FP}, \\quad\
    \ NPV = \\frac{TN}{TN + FN}$$\n\nSAS users familiar with PROC LOGISTIC recognize\
    \ that PPV and NPV are actually called TPR and TNR. This may be a source of confusion.\
    \ This book doesn’t use the established PROC LOGISTIC terminology because it defines\
    \ TPR and TNR consistent with the way they are used in medical diagnostics literature.\
    \ Nevertheless, to minimize confusion, sensitivity and specificity are used more\
    \ often than TPR and TNR.\n\n# 2.5 Computations Using PROC FREQ\n\nIt is relatively\
    \ easy to compute all of these measures in SAS. The following DATA step prepares\
    \ the data for subsequent use by PROC FREQ:\n\n```\ndata m62;\n    input forecast\
    \ $ observed $ weight;\n    datalines;\nFrost Frost 29\nFrost No_Frost 6\nNo_Frost\
    \ Frost 4\nNo_Frost No_Frost 38\n;\nrun;\n```\n\nThe following execution of PROC\
    \ FREQ provides the necessary calculations:\n\n```\nproc freq data=m62;\n    table\
    \ forecast*observed;\n    weight weight;\nrun;\n```"
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Output 2.1 contains many useful pieces of information. As a quick refresher
    on PROC FREQ output, the key to the four numbers in each cell is found in the
    upper left portion of the table. The first number is the frequency (i.e., TP,
    FP, FN, and TN). The second number (Percent) uses the table sum (the sum of column
    sums or the sum of row sums, 77 in this example) as the denominator. The third
    number (Row Pct) is the row percentage (i.e., the proportion that uses row sums
    as the denominator). Finally, the fourth number (Col Pct) is the column percentage
    using column sums as the denominator.


    # Output 2.1


    | forecast | observed |  |

    | Frequency |  |  |

    | Percent |  |  |

    | Row Pct |  |  |

    | Col Pct | Frost | No_Frost | Total |

    | Frost | 29 | 6 | 35 |

    |  | 37.66 | 7.79 | 45.45 |

    |  | 82.86 | 17.14 |  |

    |  | 87.88 | 13.64 |  |

    | No_Frost | 4 | 38 | 42 |

    |  | 5.19 | 49.35 | 54.55 |

    |  | 9.52 | 90.48 |  |

    |  | 12.12 | 86.36 |  |

    | Total | 33 | 44 | 77 |

    |  | 42.86 | 57.14 | 100.00 |


    Each of these numbers has a role in computing the measures discussed so far. For
    example, the MR is the sum of the table percentages (the second set of numbers)
    in the off-diagonal elements of the table: 7.79+5.19=12.98%. The PPV and NPV can
    be found among row percentages since row sums pertain to the predictions. Here,
    the PPV is 82.86% and the NPV is 90.48%. Finally, the sensitivity and specificity
    are available from the column percentages (87.88% and 86.36% in this example),
    implying a sensitivity of 87.88% and a specificity of 86.36%.


    It is very important to understand the correct interpretation of sensitivity,
    specificity, PPV, and NPV. Let’s start with predictive values first. Their denominators
    are the number of positive and negative forecasts. In the weather forecast example,
    the PPV can be interpreted as the probability of an actual frost when a frost
    is forecast, and the NPV is the probability of observing no frost when no frost
    is forecast. Hence, if a frost is forecast for the M62 motorway, the probability
    that there will actually be a frost is estimated to be 82.86%. Similarly, if the
    forecast does not call for a frost, then the probability that there will be no
    frost is estimated to be 90.48%.


    In contrast, the denominators for sensitivity and specificity are observed positives
    and negatives. Therefore, sensitivity is the probability that a night with a frost
    will be correctly identified by the forecast out of all nights with a frost during
    the winter; similarly, specificity is the probability that a night without a frost
    will be correctly identified by the forecast out of all nights with no frost (and
    less than 5 °C) during the winter. In our example, the probability that a frost
    will be correctly forecast is estimated to be 87.88% and the probability that
    no frost will be correctly forecast is estimated to be 86.36%.'
  merge: -1
  img_proc: true
- pgno: 20
  md: "It is easy to imagine the utility of these probabilities as occasional consumers\
    \ of a weather forecast. If you drive from Leeds to Hull on the M62 only a few\
    \ nights during a winter, all you care about is whether the forecast will be accurate\
    \ on those few nights. On the other hand, the agency responsible for keeping the\
    \ motorway free of frost might be more interested in sensitivity and specificity\
    \ when deciding whether to pay for these forecasts since that speaks to the entire\
    \ “cohort” of nights in the upcoming winter, and the decision of the agency should\
    \ be based on the performance of the forecast in the long run.\n\nIt is easy to\
    \ recognize that sensitivity, specificity, and positive and negative predictive\
    \ values are all binomial proportions if the corresponding denominators are considered\
    \ fixed. The technical term is conditioning on the denominators. This gives easy\
    \ rise to the use of binomial functionality within PROC FREQ to compute interval\
    \ estimates.\n\nThe following code uses two separate calls to PROC FREQ to obtain\
    \ estimates of sensitivity and specificity along with confidence intervals and\
    \ a test of hypothesis about a specific null value. Note the use of the WHERE\
    \ statement to choose the appropriate denominator for each calculation:\n\n```\n\
    title \"Sensitivity\";\nproc freq data=m62(where=(observed='Frost'));\n  table\
    \ forecast / binomial(p=0.8);\n  weight weight;\n  exact binomial;\nrun;\n```\n\
    \nThe values specified in parentheses following the BINOMIAL keyword are the null\
    \ values for the test of hypothesis. A null value of 80% is specified. This value\
    \ is chosen only to demonstrate the hypothesis testing feature of the BINOMIAL\
    \ option. It does not correspond to an actual value of interest in the example.\n\
    \nOutput 2.2 shows the sensitivity, which is estimated to be 87.88% or 29 out\
    \ of 33. Each of these 33 nights of frost can be thought of as independent Bernoulli\
    \ variates: 29 of them were positive (1) and 4 were negative (0). Their sum (29)\
    \ is the binomial variate with a sample size (denominator) of 33, with sensitivity\
    \ as the binomial proportion of the variate."
  merge: -1
  img_proc: true
- pgno: 21
  md: "# Output 2.2\n\nSensitivity\n\nThe FREQ Procedure\n\nforecast    Frequency\
    \    Percent    Cumulative Frequency    Cumulative Percent\nFrost       29   \
    \        87.88      29                       87.88\nNo_Frost    4            12.12\
    \      33                       100.00\n\n    Binomial Proportion\n    for forecast\
    \ = Frost\n\nProportion                 0.8788\nASE                        0.0568\n\
    95% Lower Conf Limit       0.7674\n95% Upper Conf Limit       0.9901\n\nExact\
    \ Conf Limits\n95% Lower Conf Limit       0.7180\n95% Upper Conf Limit       0.9660\n\
    \n    Test of HO: Proportion = 0.8\n\nASE under HO               0.0696\nZ   \
    \                       1.1315\nOne-sided Pr >  Z          0.1289\nTwo-sided Pr\
    \ > |Z|         0.2578\n\nExact Test\nOne-sided Pr >=  P         0.1821\nTwo-sided\
    \ = 2 * One-sided  0.3643\n\nSample Size = 33"
  merge: -1
