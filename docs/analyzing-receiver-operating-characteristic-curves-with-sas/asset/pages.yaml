- pgno: 36
  md: '# Figure 3.5 Choosing the Optimal Threshold Using the Empirical ROC Curve


    ![](img/ac26020abd4f22abfaafc0607939c6e4_36_0.png)


    The OPTIMAL option of the %PLOTROC macro generates a data set called _OPTIMAL_,
    which computes the two distances explained here for each threshold. These two
    variables, called DIST_TO_PERFECT and DIST_TO_NONINF, can be used to choose an
    optimal operating point on the ROC curve.


    The choice of method is mostly dictated by the field of application. In the context
    of medical diagnosis, optimal usually means close to the ideal and in engineering
    contexts it usually means far from random. In fact the vertical distance measure
    considered here is equal to Youden’s index, a summary measure of accuracy that
    is popular in quality control, although it was first introduced in a medical context
    (Youden, 1950).


    Unfortunately, the two criteria of optimality produce different optimal operating
    points. This is analytically demonstrated by Perkins and Schisterman (2006). Most
    of the time, the two are close enough to allay any concerns about the choice of
    method.


    # 3.6 The Binormal ROC Curve


    So far our focus has been on the empirical curve, the one obtained by connecting
    the observed (sensitivity, 1-specificity) pairs. The empirical curve is widely
    used because it is easy to produce and it is robust (in the sense of being rank-based)
    to the changes in the marker distribution. But there are occasions when you might
    prefer a smooth curve. The most common way of smoothing an ROC curve is by using
    the binormal model.


    The binormal model assumes that the distributions of the marker (or a monotone
    transformation) within the gold standard categories are normally distributed.
    For the PET data set example, we can assume that the SUVs of the patients with
    cancer follow a normal distribution, with mean μ₁ and variance σ₁², and SUVs of
    the patients with no cancer follow a normal distribution, with mean μ₀ and variance
    σ₀². Then, using the notation from the empirical ROC curves'
  merge: -1
