- pgno: 40
  md: "```\nproc gplot data=ROCData;\n    plot (_sensit_ _bsensit_)*_1mspec_ / haxis=axis1\
    \ vaxis=axis2\n        overlay;\nrun;\nquit;\n```\n\n# 3.7 Transformations to\
    \ Binormality\n\nThe assumption of normality plays a crucial role in the binormal\
    \ model. Statisticians who are familiar with the theory of t-tests and analysis\
    \ of variance may dismiss this importance because of the widespread notion that\
    \ large sample sizes overcome the effects of non-normality. This is generally\
    \ true for procedures that compare the means of several groups (such as the t-test\
    \ or the F-test), primarily because the sample means can be approximated by a\
    \ normal distribution in large samples even if the individual observations are\
    \ markedly non-normal.\n\nIn contrast, the ROC curve does not simply compare the\
    \ means of diseased and non-diseased populations. In fact, as Section 3.3 shows,\
    \ the ROC curve can be represented as G(F⁻¹(x)), where x is one minus the specificity,\
    \ G(.) is the cumulative density of the predictor in the diseased group, and F(.)\
    \ is the cumulative density in the non-diseased group. Therefore, accurate estimation\
    \ of the ROC curve requires accurate estimation of all points on F and G. The\
    \ binormal model assumes F and G to be the cumulative density function of the\
    \ normal distribution, and the parameters of these two normal distributions are\
    \ estimated from the data. If the data are markedly non-normal, estimates of F\
    \ and G can be severely inaccurate at several points. This is not easily remedied\
    \ by assembling larger samples.\n\nFor this reason, using the binormal model raises\
    \ the question of whether the data are indeed normal and whether departures from\
    \ normality can be fixed with a monotone transformation. Based on Section 3.3,\
    \ you might think that all ROC curves are invariant. This is certainly not the\
    \ case. All parametric ROC curves, and the binormal model in particular, are not\
    \ invariant to monotone transformations.\n\nNormalizing transformations is of\
    \ great interest in least squares regression and analysis of variance, so there\
    \ is a vast amount of literature about it. One of the most popular transformation\
    \ methods is the standard Box-Cox power family implemented in PROC TRANSREG.\n\
    \nThe Box-Cox power family of transformations can be defined as\n\ny^{(λ)} = {\
    \ (y^λ - 1)/λ   λ > 0\n            log(y)       λ = 0 }\n\nEach value of λ defines\
    \ a transformation. For example, λ=1 uses the original values and λ=0 corresponds\
    \ to a log-transform. This definition assumes y is non-negative to start with;\
    \ if this is not the case, a constant can be added to shift the values. The idea\
    \ is to choose λ based on the observed data. PROC TRANSREG uses a maximum likelihood\
    \ estimate of λ along with the associated confidence interval. Because the choice\
    \ of λ depends on the data, the recommendation is to round the resulting estimates\
    \ to the nearest quarter so long as they are in the associated confidence interval.\n\
    \nThis representation does not take into account the gold standard. The marker\
    \ distributions that need normalization are the conditional ones (conditional\
    \ on the gold standard, F and G in the foregoing notation). In contrast, the Box-Cox\
    \ family attempts to normalize the marginal"
  merge: -1
  img_proc: true
- pgno: 41
  md: "distribution of the marker values. You can redefine the family so that it normalizes\
    \ the conditional distributions. The easiest way of doing so is recognizing that\
    \ an analysis of variance model with the marker as the outcome and the gold standard\
    \ as the covariate is one way of modeling the desired conditional distributions.\
    \ For more information, see Sakia (1992).\n\nIn the PET example, you can estimate\
    \ λ using the following call to PROC TRANSREG. The left-hand side of the model\
    \ includes the marker value to be transformed and the right-hand side includes\
    \ the gold standard, as explained previously, to ensure that conditional distributions\
    \ are normalized. The PARAMETER= option specifies a constant to be added to all\
    \ observations before λ is estimated. Because some SUVs are 0, an arbitrarily\
    \ chosen small number (0.1) is added.\n\n```\nproc transreg data=HeadNeck;\n \
    \   model boxcox(suv/parameter=0.1) = class(gold);\nrun;\n```\n\nOutput 3.5 shows\
    \ the results. The primary output is the (log) likelihood values for each λ. As\
    \ explained in the legend, a less-than symbol (<) points to the best λ (that is,\
    \ the one that maximizes the likelihood). Observations marked with an asterisk\
    \ (*) form a confidence interval, and a plus sign (+) is a convenient choice for\
    \ λ. According to the criteria for being convenient, the number must be round\
    \ and contained in the confidence interval. In this example, λ=0.5 is identified\
    \ as the best choice, implying a square root transformation.\n\n# Output 3.5\n\
    \nThe TRANSREG Procedure\n\nTransformation Information\nfor BoxCox(suv)\n\nLambda\
    \    R-Square    Log Like\n-3.00     0.25        -1135.75\n-2.75     0.25    \
