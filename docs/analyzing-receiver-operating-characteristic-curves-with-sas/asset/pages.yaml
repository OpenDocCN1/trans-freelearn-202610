    \    Survival    Failure    Error    Failed    Left\n36.0000    29.0000    0.6335\
    \    0.3665    0.0784    16    8\n```\n\n# 7.3.3 Estimation of P(W)\n\nW is not\
    \ subject to censoring, so, in principle, P(W>c) is the proportion of observations\
    \ exceeding c. P(W) can be computed in many different ways in SAS, including using\
    \ a DATA step or PROC SQL programming as well as using PROC UNIVARIATE and PROC\
    \ FREQ. You can also use PROC LIFETEST because, in the absence of censoring, Kaplan-Meier\
    \ methods produce the same results that would have been obtained from the standard\
    \ methods. Because specifying a status variable is optional, PROC LIFETEST can\
    \ be used for this purpose, as follows:\n\n```\nproc lifetest data=lung timelist=(9);\n\
    \    time suv;\nrun;\n```\n\nThis is a somewhat unusual call after the previous\
    \ PROC LIFETEST calls. SUV is the variable for which a distribution is needed;\
    \ hence, timelist=9. The lack of a status variable is due to the fact that W is\
    \ not subject to censoring. The output from PROC LIFETEST (Output 7.3) indicates\
    \ that P(W>9)=0.50. This is also the first example where the values under the\
    \ headings Timelist and SUV differ. The former lists the value(s) requested by\
    \ the TIMELIST= option of the PROC LIFETEST statement and the latter shows the\
    \ nearest observed value for which the reported survival and failure probabilities\
    \ hold. If the requested time point is observed, then the two columns will have\
    \ identical numbers.\n\n# Output 7.3\n\n```\nThe SAS System\n\nThe LIFETEST Procedure\n\
    \nProduct-Limit Survival Estimates\n\nSurvival\nStandard\nNumber\nNumber\nTimelist\
    \    SUV    Survival    Failure    Error    Failed    Left\n9.00000    8.9300\
    \    0.5000    0.5000    0.0500    50    50\n```"
