- pgno: 82
  md: "In the first analysis, ignore the fact that patients contribute multiple vertebrae\
    \ to the analysis; this amounts to analyzing the 569 data points as if they originated\
    \ from different subjects. To estimate θ, use the following call to PROC PHREG:\n\
    \n```\nproc phreg data=tmp1.ph;\n    model signal=grp / rl;\n    if group='Normal'\
    \ then grp=0;\n    else if group='Benign' then grp=1;\nrun;\n```\n\nPROC PHREG\
    \ is a SAS/STAT procedure that allows programming statements. These statements\
    \ enable you to create variables that can be used in the MODEL statement. Using\
    \ programming statements within the procedure helps avoid DATA step programming\
    \ before the procedure is called. An important disadvantage is that the variables\
    \ created are temporary; therefore, if the new variables will be needed in other\
    \ places during the analysis, it is more efficient to use a DATA step.\n\nIn this\
    \ example, programming statements are used to create a new variable called GRP.\
    \ This variable is necessary because PROC PHREG works with numeric variables only.\
    \ The RL option requests confidence intervals for the hazard ratio. Remember that\
    \ θ, which is the only parameter in the Lehmann family, is the same as the hazard\
    \ ratio.\n\nThe relevant part of Output 6.1 follows:\n\n# Output 6.1\n\nAnalysis\
    \ of Maximum Likelihood Estimates\nParameter DF Parameter Estimate Standard Error\
    \ Chi-Square Pr > ChiSq Hazard Ratio 95% Hazard Ratio Confidence Limits\ngrp 1\
    \ 0.35541 0.08815 16.2559 <.0001 1.427 1.200 1.696\n\nHere, θ is estimated to\
