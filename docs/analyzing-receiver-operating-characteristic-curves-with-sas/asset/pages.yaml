- pgno: 121
  md: '# 9.3 ROC Curves from SAS Enterprise Miner for a Single Model


    SAS Enterprise Miner organizes its objects in a flow diagram, which contains data,
    models, and results. The components of the diagram are called nodes and they can
    be connected to other nodes in the flow. The flow can be saved as a project, which
    may contain other flows as well.


    Most actions in SAS Enterprise Miner can be specified by three equivalent methods:
    using the Menu, using the Tool Bar, or using the Project Navigator (the left segment
    of the window when SAS Enterprise Miner first starts). The Tool Bar and the Project
    Navigator contain icons that can be dragged and dropped, so they are more convenient
    than using the Menu. You can also customize these icons.


    Follow these steps to prepare the data for predictive modeling. First, define
    the sources of data. This is similar to using LIBNAME statements in a SAS DATA
    step and then using PROC COPY to bring the desired data sets to the work area.
    Then, choose a specific data set to work with from the data sources. Partitioning
    the data into training, validation, and test data sets is customary in data mining
    and can be accomplished using the Data Partition node. Training and validation
    data are discussed in Chapter 8, where the term test data is used interchangeably
    with validation data. The terminology in this chapter follows that of SAS Enterprise
    Miner, so validation and test data here refer to two different entities. The validation
    data set is used for the same purpose it is in Chapter 8, but the test data set
    here is primarily held out for a confirmation of the findings of the validation
    data set. This practice is less common in areas other than data mining.


    The following steps more precisely describe how to perform these tasks:


    +   1. Define data sources by right-clicking Data Sources in the Project Navigator,
    choosing Create Data Source, and proceeding through the menus. Make sure that
    the Model Role field for the variable BAD is Target and the Type is binary. All
    other variables should be listed as Input.

    +   2. Create a new diagram by dragging and dropping from the Tool Bar or the
    Project Navigator. The Diagram icon depicts a series of interconnected boxes with
    a yellow star above them. Alternative ways to create a new diagram include selecting
    File→New→Diagram or holding down the CTRL and Shift keys and pressing D.

    +   3. Double-click Data Sources in the upper left segment of the window. Drag
    and drop Home Equity into the diagram workspace (the right segment of the window,
    which should be blank at this point).

    +   4. Add Data Partition to the diagram by dragging and dropping the icon into
    the diagram workspace or alternatively selecting Action→Add Node→Sample→Data Partition.

    +   5. Connect the Home Equity and Data Partition icons with an arrow. You can
    draw an arrow when the cursor is shaped like a pencil.


    Note that the diagram specifies the actions to be undertaken, but merely specifying
    them is not enough for execution. A flow, either as a whole or as a subset, needs
    to be run for the specified actions to be carried out. For example when the Data
    Partition node is run, training, validation, and test sets are created. To run
    a flow, right-click on a node and choose Run. All the nodes prior to and including
    the chosen node execute in sequence. It is possible to run each node as the diagram
    is specified, but it is more efficient to run the flow in big chunks.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Now we are ready to proceed with modeling. Since the target variable is binary,
    a reasonable starting point for modeling is logistic regression. To fit a logistic
    model in SAS Enterprise Miner, you need to add a node that specifies this and
    connect the regression node to the data sets created by the Data Partition node.
    The following steps describe this process:


    +   1. Add the Regression node to the diagram by dragging the icon when the Model
    tab is highlighted.

    +   2. Connect the Data Partition node to the Regression node with an arrow.

    +   3. Add the Model Comparison node to the diagram by dragging and dropping it
    from the Assess tab and connecting it to the Regression node with an arrow.


    At this point, the display should roughly look like Figure 9.1.


    # Figure 9.1 Using Logistic Regression to Predict Defaults on Home Equity Loans


    ![](img/ac26020abd4f22abfaafc0607939c6e4_122_0.png)


    Now, right-click the Model Comparison node and choose Run. Once a node has run,
    the results remain available throughout the SAS Enterprise Miner session. The
    diagram and the results are saved by default and are available when the SAS Enterprise
    Miner session is restarted later.


    When the Model Comparison node has run, right-click on the node and choose Results.
    A new window appears, with subwindows titled Fit Statistics, Output, and ROC Chart.
    In the ROC Chart subwindow, there are three ROC curves, one for each data set:
    training, validation, and test. Figure 9.2 focuses only on the ROC curve for the
    training set, displayed in the upper left corner. The 45-degree reference line,
    referred to as Baseline in the legend, is plotted by default. As you move the
    cursor along the curve, a pop-up text box provides details about the sensitivity
    and specificity at that point of the ROC curve. Figure 9.2 includes one example
    point where the sensitivity is 50.5% and the one minus specificity is 94.9%.'
  merge: -1
  img_proc: true
