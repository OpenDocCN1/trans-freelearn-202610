    \ shows a graph comparing the two different curves.\n\n# Figure 3.6 Comparison\
    \ of Empirical and Binormal ROC Curves\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_39_0.png)\n\
    \nFigure 3.6 is generated by the following SAS statements. The key idea is in\
    \ the DATA step, where the data set produced by the OUTROC= option in PROC LOGISTIC\
    \ (called ROCData here) generates the sensitivities from the binormal model. ROCData\
