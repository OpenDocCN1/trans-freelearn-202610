- "## ROC 曲线的比较与协变量调整\n\n## 4.1 引言\n\n在许多情况下，会有一组竞争性的预测方法可供选择，因此比较预测结果通常很有意义。例如，昂贵的侵入性检查或放射学扫描与简单的临床检查相比，在诊断某种疾病方面如何？或者，在已经拥有债务人简单财务摘要的情况下，花费大量成本获取详细的信用报告是否值得？增量的准确性提高是否能证明额外的成本合理？这里的成本一词使用较为宽泛；例如，对患者进行额外诊断扫描所带来的额外负担也被视为一种成本。当然，也需要考虑传统的成本：获取额外扫描的货币成本也需要纳入考虑。在决定这些成本是否合理之前，你需要评估预测准确性的提升。\n\
  \n比较竞争性预测因子的一种常见且简单的方法是为每个预测因子构建 ROC 曲线。这些 ROC 曲线的视觉比较通常会揭示几个有用的特征。此外，还可以对两条 ROC\
  \ 曲线进行统计学显著性差异的比较。本章讨论了在统计上比较两条或多条 ROC 曲线的非参数和参数方法。\n\n## 4.2 前列腺癌预后的一个例子\n\n第 3\
  \ 章使用了一个来自癌症诊断和监测的例子来介绍 ROC 曲线。本章使用一个来自癌症预后的例子来研究比较两条 ROC 曲线的方法。这次，数据来自患有骨转移的前列腺癌患者。传统上，这些患者会接受骨扫描，这是一种揭示骨骼异常的放射学检查。你可以计算一个汇总指标，称为骨扫描指数\
  \ ，它表示患者骨骼疾病的程度。一个竞争性的标志物是第 3 章中用于识别头颈部癌症的 PET 扫描中的 SUV。前列腺数据集包含 51 名患者的 BSI 和 SUV\
  \ 测量值。感兴趣的结果是一年生存率——即在测量 BSI 和 SUV 后一年患者是否存活。每位患者至少随访一年并记录结果。40 名患者在一年时死亡，11 名存活。\n\
  \n本章在整个过程中使用此例子来比较 SUV 的 ROC 曲线与 BSI 的 ROC 曲线。但在进一步讨论之前，我们需要区分配对和非配对的数据收集机制，这是涉及\
  \ ROC 曲线比较的大多数数据集相关的重要问题。\n\n## 4.3 配对与非配对比较\n\n处理任何统计比较时，你需要区分非配对数据和配对数据。这里，非配对是指要比较的两组中的数据来自不同的抽样单元，而配对是指每个抽样单元恰好贡献了一对观测值：一个到每一组。\n\
  \n考虑随机临床试验评估筛查乳房X光检查的例子。女性被随机分配到标准护理，即定期临床检查，或乳房X光检查，即在标准护理基础上增加乳房X光检查。无论是否使用 ROC\
  \ 曲线进行的比较，结果都是非配对的。研究中的每位女性要么在一个研究组，要么在另一个研究组。\n\n现在，考虑另一项研究，评估手术前成像肿瘤的 PET。假设这方面的标准成像工具很可能是计算机断层扫描\
  \ 。一种可能性是将患者随机分配接受 CT 或 PET，从而形成非配对比较。然而，比较两者的一种统计上更有效的方法是安排患者接受两次扫描，从而形成配对数据情况。\n\
  \n在传统统计学中，大多数比较涉及非配对数据而不是配对数据。例如，两样本 t 检验可能是应用最广泛的统计检验。其原因并非效率更高。事实上，对于固定的样本量，配对技术通常比非配对技术更有力。然而，实现配对设计更困难，有时甚至不可能。许多药物和干预措施的随机试验使用非配对设计，因为让受试者接受多种治疗或干预通常很困难，如果不是不可能的话。想象一下比较手术治疗与密切观察的试验，这是一种常见的选择，用于早期惰性肿瘤，如某些前列腺癌。患者不可能同时接受两种治疗。\n\
  \n配对比较在某些领域已成为首选设计，包括预测标志物的比较。所考虑的许多标志物可以应用于每个抽样单元，而不会带来太多负担、成本或不当后果。因此，本章重点介绍使用配对数据比较\
  \ ROC 曲线，尽管会提及非配对比较。\n\n## 4.4 比较经验 ROC 曲线下的面积\n\n除了配对与非配对数据的区别外，你还需要决定比较 ROC 曲线意味着什么。它可能是指比较整个曲线，也可能是指比较某些汇总指标，例如曲线下的面积。\n\
  \n处理经验 ROC 曲线时，通常的选择是比较汇总指标。替代方案，即比较整个曲线，在没有模型帮助的情况下是一项困难的任务。当然， caveat 是两个预测因子可能具有相同的\
  \ AUC 但非常不同的 ROC 曲线。因此，图形显示所比较的 ROC 曲线应始终伴随比较 AUC 的统计检验。\n\n### 4.4.1 配对数据的比较\n\n\
  你可以以两种方式组织配对数据。最直观的方式是为每个受试者设置一行，为每个标志物设置一列，再加上结果的一列。等价的方式是为每个受试者-标志物组合设置一行，每个受试者产生两行。结果变量将在这两行中重复，并添加一个包含受试者标识符的额外列以跟踪配对。这两种数据结构分别称为宽格式和长格式，显然是指数据矩阵的形状。两者可以通过简单的\
  \ DATA 步指令相互转换。\n\n第 3 章中用于获得 AUC 标准误估计的 %ROC 宏也可以用于比较两条 ROC 曲线，前提是数据是配对的。此宏中实现的方法本质上是非参数的。每个\
  \ AUC 均使用前一章中描述的一致性方法进行估计。一致性统计量是 U 统计量类中的一员。AUC 的方差及其之间的协方差可以使用 U 统计量理论的一般原理计算。有关更多信息，请参阅\
  \ DeLong 等人 1988 年的文献。\n\n%ROC 宏期望数据采用宽格式。以下宏调用执行所需的比较：\n\n```\n%roc(data=bone,\
  \ var=bsi suv1, response=gold, contrast=1 -1);\n```\n\nVAR 宏变量指定包含两个标志物值的变量名称。CONTRAST\
  \ 宏变量期望的输入类似于 PROC GLM 中的 CONTRAST 语句，因此 1 -1 指的是 VAR 宏变量中所述两个变量的差值。\n\n\n\n\n\n\
  Output 4.1 显示了此调用的结果。每个 ROC 曲线的 AUC 估计值及其标准误差和（边际）置信区间首先出现。BSI 的 AUC 为 0.7795，与\
  \ SUV 的 0.6773 相比相当有利。然而标准误差相当大：BSI 为 0.0771，SUV 为 0.0836，导致置信区间很宽。BSI 的 AUC 的 95%\
  \ 置信区间范围从 0.6284 到 0.9307。SUV 的置信区间在 0.5134 到 0.8412 之间。似乎 SUV 几乎无法与随机预测器区分开来（因为下限置信限仅略高于\
  \ 0.50）。\n\n## Output 4.1\n\n```\nThe ROC Macro\n\n    ROC Curve Areas and 95%\n\
  \          Confidence Intervals\n    ROC Area Std Error Confidence Limits\n\nBSI\
  \    0.7795    0.0771    0.6284    0.9307\nsuv1   0.6773    0.0836    0.5134   \
  \ 0.8412\n\n    Contrast Coefficients\n            BSI       suv1\n\nRow1      \
  \ 1        -1\n\n        Tests and 95% Confidence Intervals for Contrast Rows\n\
  \    Estimate  Std Error Confidence Limits     Chi-square Pr > ChiSq\n\nRow1   0.1023\
  \    0.0954   -0.0847     0.2893      1.1491   0.2837\n\n        Contrast Test Results\n\
  Chi-Square   DF      Pr > ChiSq\n\n    1.1491    1      0.2837\n```\n\n接下来出现对比信息。这可用于验证结果是否针对预期比较，并推断差异的方向。在此示例中，AUC\
  \ 曲线的正差异指向 BSI 是更好的检验。下一部分输出比较了两个 ROC 曲线。两个 AUC 的差异为 0.1023，如 Estimate 列下所示。这可以直接通过\
  \ 0.7795 和 0.6773 之间的差值获得，即输出第一部分中报告的 BSI 和 SUV 的 AUC。然而，你不能根据单个面积的信息计算差异的标准误差，因为数据是配对的。基于此标准误差，两个\
  \ AUC 之间的差异不显著（p=0.2837），置信区间为（-0.0847，0.2893）跨越 0。\n\n似乎检验统计量和 p 值被报告了两次。如果对比涉及多于一行，则对比行上的输出将为对比中的每一行包含一行。标记为“Contrast\
  \ Test Results”的部分仍将报告一个具有 r−1 自由度的单一 p 值，其中 r 为行数。因此，只有在对比只有一行时，“Contrast Rows”部分和“Contrast\
  \ Test”部分的信息才一致。\n\n如本文所述，必须呈现 ROC 曲线的可视化显示以及 AUC 的比较。图 4.1 由第 3 章中介绍的 %PLOTROC\
  \ 宏生成。语法修改与 %ROC 宏中的类似（即多个标记在 VAR 宏变量中指定，用空格分隔）。\n\n```\n%plotroc (bone bsi,suv,gold,anno=4,tlist1=1.08\
  \ 2.29, tlist2=4.8 5.8);\n```\n\n## Figure 4.1 ROC Curves for BSI (Solid) and SUV\
  \ (Dashed) Overlaid\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_51_0.png)\n\n图 4.1\
  \ 显示 BSI 在特异性的大多数取值下比 SUV 具有更高的敏感性。在敏感性为 50% 至 80% 的范围内，BSI 的敏感性明显高于 SUV。BSI 的阈值为\
  \ 2.29 可实现超过 80% 的敏感性和超过 70% 的特异性。SUV 的任何操作点都无法提供可比的准确性。尽管如此，请记住，显示的 AUC 估计具有较高的变异性，并且差异没有统计学意义。\n\
  \n### 4.4.2 Comparisons with Unpaired Data\n\n从理论上讲，%ROC 宏只能在数据为配对时比较两个预测因子的 AUC。由于在\
  \ ROC 曲线领域中非配对设计非常罕见，没有宏执行所需比较。幸运的是，非配对比较可以通过手工或几行 DATA 步代码轻松完成：如果 AUC₁ 和 AUC₂ 是两个\
  \ AUC 估计值，其相关标准误差为 s₁ 和 s₂，则非配对比较的检验统计量如下：\n\nT = (AUC₁ - AUC₂)² / (s₁² + s₂²)\n\
  \n在大样本中，在零假设下（即两个 AUC 确实相等时），T 将具有一个自由度的卡方分布。\n\n请注意，AUC₁ 和 s₁ 是在仅对第一个预测因子执行 %ROC\
  \ 宏时报告的，如第 3 章中所述。同样，AUC₂ 和 s₂ 是从第二次 %ROC 调用估计的。一旦计算出 T，两侧 p 值可使用 DATA 步中的以下行找到：\n\
  \n```\np_value=1-probchi(t_unpaired,1);\n```\n\n如果前列癌研究仅提供 PET 或 BSI（但不是两者），使得 resulting\
  \ 数据结构为非配对，并且如果 AUC 估计值及其标准误差与之前所述相同（AUC 为 0.7795 和 0.6773，标准误差为 0.0771 和 0.0836），则\
  \ T 将为 0.8095，p 值为 0.3683。使用非配对设计 p 值增加可通过配对设计的有效性增加来解释，如第 4.3 节中简要讨论的那样。\n\n##\
  \ 4.5 Comparing the Binormal ROC Curves\n\n第 3 章表明，你可以通过假设标记在患病组和未患病组的分布具有正态分布且参数可能不同来获得\
  \ ROC 曲线的模型化估计。具体而言，如果患病患者的标记值服从均值为 μ₁ 和方差为 σ₁² 的正态分布，并且未患病患者的标记值服从均值为 μ₀ 和方差为 σ₀²\
  \ 的正态分布，则 ROC 曲线可函数写为\n\nΦ(a + bΦ⁻¹(x))\n\nAUC 给出为\n\nΦ( a / √(1+b²) )\n\n其中双正态参数\
  \ a 和 b 给出为\n\na = (μ₁ - μ₀)/σ₁,   b = σ₀/σ₁\n\n接下来，我们详细讨论配对数据；关于非配对数据的评论出现在本节末尾。\n\
  \n### 4.5.1 Comparisons Based on the Binormal Model with Paired Data\n\n数据的配对性质需要在继续之前对模型进行一些调整。设\
  \ Xᵢⱼ 表示第 i 个患者和第 j 个标记的标记值。然后 Xᵢⱼ（或其某种变换）假定在患者有阳性结果时具有以下正态分布：\n\nXᵢⱼ ~ N( μ₁ⱼ +\
  \ uᵢ, σ₁ⱼ² )\n\n如果患者有阴性结果，则 $X_{ij}$ 的分布为\n\n$X_{ij} \\sim N\\left(\\mu_{0j}+u_i,\\\
  sigma_{0j}^2\\right)$\n\n$u_i$ 也服从正态分布：\n\n$u_i \\sim N\\left(0,\\sigma_r^2\\right)$\n\
  \n关键假设是 $u_i$ 和 $u_{i'}$ 对于 $i\\neq i'$ 是独立的。\n\n该模型为每个标记有四个基本参数：$\\mu_{1i}$ 和 $\\\
  mu_{0i}$ 是标记 $j$ 的结果阳性和结果阴性患者的均值，$\\sigma_{1i}$ 和 $\\sigma_{0i}$ 是两个标准差。在这方面，它是每个标记单独的标准双正态模型。为了考虑同一受试者上两个标记测量之间的相关性，引入了随机效应\
  \ $u$。因为 $u_i$ 是受试者特异性效应，在同一患者上测量的两个标记值将具有相同的 $u_i$。这种共同性在同一受试者上进行的两个测量（每个标记一个）上诱导出相关性。因为\
  \ $u_i$ 和 $u_{i'}$ 对于 $i\\neq i'$ 是独立的，所以在不同受试者上测量的标记值之间没有相关性。在大多数设置中使用随机效应来诱导受试者选定对上的相关性是一种标准技术。\n\
  \n以下代码段首先运行 PROC TRANSREG 以确定正态性变换。请参阅第 3.7 节，了解此步骤在拟合双正态模型中的作用的详细解释。\n\n```\nproc\
  \ transreg data=bone;\n    model boxcox(suv1/parameter=0.1 geometricmean)=class(gold);\n\
  \    output out=trsuv;\nrun;\n\nproc transreg data=bone;\n    model boxcox(bsi/parameter=0.1\
  \ geometricmean)=class(gold);\n    output out=trbsi;\nrun;\n```\n\nBox-Cox 模型确定对数变换对\
  \ BSI 和平方根变换对 SUV 是实现正态性的最佳可能变换（未显示详细的 PROC TRANSREG 输出）。输出数据集 TRSUV 和 TRBSI 由 PROC\
  \ TRANSREG 中的 OUTPUT 语句创建，并包含变换后的协变量 TBSI 和 TSUV。这两个数据集合并形成 Long，即长格式的数据集。然后 PROC\
  \ NLMIXED 找到如前所述的随机效应双正态模型的极大似然估计。\n\n```\ndata long;\n    set trbsi(keep=_name_\
  \ gold tbsi rename=(tbsi=result _name_=subid)\n        in=in1)\n        trsuv(keep=_name_\
  \ gold tsuv rename=(tsuv=result _name_=subid)\n        in=in2);\n    if in1 then\
  \ marker=0; else if in2 then marker=1;\nrun;\n```\n\n\n\n\n```\nproc nlmixed data=long\
  \ method=firo technique=quanew;\n    parms sr=1 s11=3 s10=0.3 s01=2 s00=0.2 m11=7\
  \ m10=1 m01=2 m00=0;\n    bounds sr s11 s10 s01 s00>0;\n    if gold=1 and marker=0\
  \ then do;\n        m=m10+u; s=s10**2; end;\n    if gold=1 and marker=1 then do;\n\
  \        m=m11+u; s=s11**2; end;\n    if gold=0 and marker=0 then do;\n        m=m00+u;\
  \ s=s00**2; end;\n    if gold=0 and marker=1 then do;\n        m=m01+u; s=s01**2;\
  \ end;\n    a1=(m11-m01)/s11;\n    b1=s01/s11;\n    a0=(m10-m00)/s10;\n    b0=s00/s10;\n\
  \    auc1=probnorm(a1/sqrt(1+b1**2));\n    auc0=probnorm(a0/sqrt(1+b0**2));\n  \
  \  model result ~ normal(m,s);\n    random u ~ normal(0,sr) subject=subid;\n   \
  \ estimate 'a1' a1;\n    estimate 'b1' b1;\n    estimate 'AUC1' auc1;\n    estimate\
  \ 'a0' a0;\n    estimate 'b0' b0;\n    estimate 'AUC0' auc0;\n    estimate 'AUC1-AUC0'\
  \ auc1-auc0;\n    contrast 'AUC1-AUC0' auc1-auc0;\n    contrast 'Equality of ROC\
  \ curves' a1-a0, b1-b0;\nrun;\n```\n\nPROC NLMIXED 中对模型的根本描述与第 3.6 节中的描述相似，只是随机效应\
  \ u 有两个例外。RANDOM 语句将 u 声明为随机效应。对于熟悉 PROC MIXED 的人来说，RANDOM 语句具有类似的功能但语法不同。在 PROC\
  \ MIXED 中，你不需要指定随机效应的分布，因为正态随机效应是唯一可用的选项。在 PROC NLMIXED 中，你必须指定随机效应的分布，因为 PROC NLMIXED\
  \ 识别的任何内置分布都是一个选项。另一个区别是，在 PROC MIXED 中，指定 RANDOM 语句可确保随机效应被添加到模型中；在 PROC NLMIXED\
  \ 中，你必须在编程语句中将项 u 添加到均值函数中。有关 PROC NLMIXED 的语法和功能简要介绍，请参阅附录。\n\n除了随机效应的存在外，与第 3\
  \ 章中的调用相比，此次对 PROC NLMIXED 的调用在其他几个方面也不同。例如，CONTRAST 语句提供了参数的联合检验。可以将其视为同时执行的多个\
  \ ESTIMATE 语句。为了说明这一点，注意\n\n```\nestimate 'AUC1-AUC0' auc1-auc0;\n```\n\n和\n\n```\n\
  contrast 'AUC1-AUC0' auc1-auc0;\n```\n\n执行相同的检验（即 AUC 的相等性）。你通常会通过使用 ESTIMATE 语句来执行此操作；在此目的下包含\
  \ CONTRAST 语句仅用于演示。\n\n在此处 CONTRAST 语句更重要的用途是检验两个 ROC 曲线的整体相等性。请注意，两个双正态 ROC 曲线只有在具有相同的双正态参数时才相同。因此，比较两个或多个双正态曲线的\
  \ a 和 b 提供了检验两条曲线是否相同的一种方法。这是通过以下 CONTRAST 语句实现的：\n\n```\ncontrast 'Equality of\
  \ ROC curves' a1-a0, b1-b0;\n```\n\n它检验原假设\n\nH₀ : a₀ = a₁  &  b₀ = b₁\n\n相对于备择假设，即至少有一个双正态参数不同。请注意，不可能使用\
  \ ESTIMATE 语句表达这一点。\n\n## 输出 4.2\n\n参数估计\nParameter | Estimate | Standard Error\
