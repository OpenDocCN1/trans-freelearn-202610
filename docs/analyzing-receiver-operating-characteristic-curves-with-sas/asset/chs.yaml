  \ 之间的差异，仅在此重复以突出 ESTIMATE 和 CONTRAST 语句之间的相似性。该对比具有与 ESTIMATE 语句相同的 $p$ 值（理应如此），但使用的是\
  \ $F$ 统计量而非 $t$ 统计量。如果你熟悉方差分析，你会记得分子自由度为 1 的 $F$ 统计量与相应的 $t$ 统计量的平方相同。这里的原理也适用，尽管从此输出中很难看出，因为检验统计量的绝对值非常小。尽管如此，请注意\
  \ $t$=-0.08，其平方约为 0.01，四舍五入到小数点后两位。\n\n真正感兴趣的对比是双正态参数相等性的联合检验。结果强烈表明，没有证据反对等 ROC\
  \ 曲线假设（$p$=0.99）。\n\n### 4.5.2 基于双正态模型且数据非配对的比较\n\n如第 4.5.1 节所述，随机效应 $u$ 仅引入到双正态模型中以解释受试者内相关性。在非配对设计中，受试者内相关性按定义为\
  \ 0。这提示了一种修改上一节代码的简单方法：移除 $u$。这相当于移除 RANDOM 语句并清理编程语句中 $m$ 的定义方式。\n\n## 4.6 双正态与经验\
  \ ROC 曲线之间的差异\n\n双正态模型和经验模型得出不同结论的情况并不少见。它们之间的差异类似于秩检验和 $t$ 检验之间的差异。如果双正态模型的基础假设成立，则双正态模型具有更高的功效，这可能解释了显著的结果。另一方面，如果模型假设不成立，则\
  \ I 类错误可能被夸大，这表现为假阳性结果增加。虽然不可能确定哪一个是驱动因素，但 PROC NLMIXED 的输出的某些特征以及如图 4.2 所示的探索性图形分析，仍然是检验双正态性假设的最佳方式。\n\
  \n图 4.2 叠加了经验和双正态 ROC 曲线，后者由 PROC NLMIXED 估计。实线表示 BSI，虚线表示 SUV。阶梯函数表示经验 ROC 曲线，而平滑曲线来自双正态模型。两个双正态曲线对经验曲线的拟合都很差。这也解释了\
  \ AUC 估计之间的差异。对于 BSI，经验 AUC 为 78%，而双正态 AUC 为 85%，对于 SUV，对应的估计值分别为 68% 和 78%。\n\n\
  ## 图 4.2 前列腺癌数据的 ROC 曲线比较\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_57_0.png)\n\
  \n拟合不良的另一个迹象是模型参数变异性的估计值异常大。a 和 b 的估计值看起来正常，但标准误差比模型参数大 10 到 20 倍。虽然在估计值接近 0 时可能会发生这种情况，但该模型中的估计值并不接近\
  \ 0。\n\n请注意，尽管双正态模型非常流行，但它们做出了一些强有力的假设。双正态 ROC 曲线不再基于秩；每个观测值都会对双正态斜率和截距的估计做出贡献。正态性的偏差可能会对估计曲线产生不当影响，并对统计推断产生后果。一般来说，使用双正态模型比较\
  \ ROC 曲线几乎没有理由，因为基于经验曲线的<|message|> 方法是高效的并且已在 SAS 中实现。\n\n然而，你应该将双正态模型保留在你的工具箱中。当连续协变量可能影响标记的预测准确性时，就无法再使用经验\
  \ ROC 方法。你必须使用基于模型的技术，而双正态模型（以及后续章节中介绍的 Lehmann 家族）提供了一个全面的框架来得出推断。\n\n\n\n\n##\
  \ 4.7 经验 ROC 曲线下面积差异的 Bootstrap 置信区间\n\n第 3 章中发展的 bootstrap 思想可以扩展以获得 AUC 差异的置信区间，以及检验差异是否显著的\
  \ p 值。策略与以下类似：\n\n- 生成 B 个 bootstrap 样本。\n- 对于每个样本 i，计算两个 ROC 曲线的 AUC，AUC0^(i) 和\
  \ AUC1^(i)，并计算差异 Δ^(i) = AUC0^(i) − AUC1^(i)。\n- B 个数值，Δ^(1) 到 Δ^(B)，近似了两个 AUC 之间差异的抽样分布。\n\
  \n这可以通过使用 %BOOT2AUC 宏来实现，该宏可从本书的配套网站 support.sas.com/gonen 获得。%BOOT2AUC 宏与第 3.9\
  \ 节中介绍的 %BOOT1AUC 宏类似。唯一的区别是它允许为 VAR 宏变量指定两个变量名。例如，以下调用请求比较 SUV 和 BSI：\n\n```\n\
  %boot2auc(HeadNeck,suv bsi,ngold);\n```\n\n结果出现在输出 4.3 中。\n\n### 输出 4.3\n\n| AUC1\
  \ | SE | AUC2 | SE | Difference | SE |\n|---|---|---|---|---|---|\n| 0.761397 |\
  \ 0.080334 | 0.674859 | 0.080334 | 0.086573 | 0.123361 |\n\n95% Confidence Interval\
  \ for Difference\n\n| LowerLimit | UpperLimit |\n|---|---|\n| -0.24815 | 0.280488\
  \ |\n\nH0: Difference=0\np=0.341\n\n输出的第一部分报告了单个 AUC 的点估计值和标准误差，以及它们的差异。AUC 及其标准误差按宏调用中指定的顺序呈现并标记。BSI\
  \ 的 bootstrap 估计 AUC 为 0.761，SUV 为 0.675。差异为 0.087，在临床上相当可观，但在统计上不显著，p=0.341，置信区间为\
  \ (−0.248, 0.280)，包含 0。\n\n## 4.8 ROC 曲线的协变量调整\n\n在某些情况下，协变量会影响预测的准确性。在这种情况下，你需要对这些协变量进行\
  \ ROC 曲线的调整。例如，在天气预报的背景下，产生预报的同一模型可能根据预报地点的地理位置的海拔高度而具有不同的准确性。在医学诊断领域，某些患者方面的因素，例如对治疗的既往暴露，可能影响诊断工具准确识别其当前医疗状况的能力。最后，在信用评分领域，相同的评分方法在不同国家可能表现不同，也许是由于对财务结果报告方式的不同法律要求。\n\
  \n区分协变量是结果的预测因子与协变量是结果的危险因素非常重要。为了使这种区别具体化，请考虑医学诊断领域的例子。淋巴瘤是淋巴结的癌症。恶性结节通常会增大，因此淋巴结的大小可以很好地预测淋巴瘤。然而，恶性并不是淋巴结增大的唯一原因。淋巴结在患者对抗感染时也会增大。因此，淋巴结的大小可能在最近未感染的患者中是一个很好的预测因子，但在患者最近感染过时则是一个较差的预测因子。另一方面，是否最近感染并不是淋巴瘤的良好预测因子。因此，最近感染是一个可能影响\
  \ ROC 曲线的协变量，但不是一个可用于预测癌症存在的协变量，无论是单独使用还是与其他预测因子结合使用。\n\n相比之下，淋巴瘤（或也许任何癌症）的家族史会使患者患癌症的可能性更大，因为某些癌症是遗传的。这可以正式或非正式地纳入诊断。患者是否有癌症家族史通常不会影响淋巴结增大是否能很好地预测癌症。因此，癌症家族史不是调整\
  \ ROC 曲线的候选因素。\n\n在最简单的形式中，对于分类协变量，调整意味着为协变量的每个取值估计单独的 ROC 曲线。对于连续协变量，你可以设想无限多个\
  \ ROC 曲线，每个可能的协变量值对应一个。这需要使用一个模型来假设协变量与 ROC 曲线参数之间的关系。毫不奇怪，主要的此类模型是回归。下一节将研究第 3\
  \ 章研究的双正态模型如何被表述为回归模型。\n\n## 4.9 双正态 ROC 曲线的回归模型\n\n最简单的回归模型不包含任何协变量。它在实践中不是一个有用的模型，但有助于构建概念。在\
  \ ROC 曲线的背景下，如果 T 表示标记，D 表示疾病状态（金标准），则可以写成\n\nT = α₀ + α₁ D + e^{2 D β} ε\n\n其中\
  \ ε 具有均值为 0、方差为 σ₀² 的正态分布。经过一些代数运算，可以证明\n\na = α₁ / (e^{β} σ₀²),   b = e^{β}\n\n\
  记住，变量 D 的系数表示标记在 D=1 和 D=0 时均值的差异。这对任何线性模型都成立，并且将在后续章节中用于从更复杂的模型中提取与 ROC 曲线相关的信息。\n\
  \n该模型不能使用 SAS/STAT 软件中的标准线性模型程序（如 GLM 或 REG）拟合。然而，它可以用 PROC MIXED 拟合，正如我们在第 3 章中看到的那样，也可以用\
  \ PROC NLMIXED 拟合。PROC MIXED 语法更容易，因为它遵循大多数 SAS/STAT 程序的总体结构。另一方面，PROC NLMIXED 可以推广到有序标记的情况，正如我们在第\
  \ 5 章中将看到的那样，因此采用 PROC NLMIXED 作为建模 ROC 曲线的 SAS/STAT 程序的主要选择是有价值的。\n\n现在我们可以联合建模协变量。首先考虑一个二元标记\
  \ W：\n\n```\nT = α₀ + α₁D + α₂W + e^{2β} ε\n```\n\n这意味着\n\n```\nT = { α₀ + α₁D +\
  \ e^{2Dβ} ε,   W = 0\n      α₀ + α₂ + α₁D + e^{2Dβ} ε,   W = 1 }\n```\n\n这两个方程构成了模型所暗示的两个标记的\
  \ ROC 曲线的基础。请注意，D 的系数对两个 ROC 曲线都是相同的。事实上，这两个方程仅在截距上不同。因此，所暗示的双正态参数 a 和 b 相同。\n\n\
  你可以得出结论，仅将协变量作为主效应加入不会导致对两个 ROC 曲线进行单独建模。\n\n现在考虑以下内容：\n\n```\nT = α₀ + α₁D + α₂W\
  \ + α₃DW + e^{2βD} ε\n```\n\n这会产生 W=0 和 W=1 的以下子模型：\n\n```\nT = { α₀ + α₁D + e^{2βD}\
  \ ε,          W = 0\n      (α₀ + α₂) + (α₁ + α₃)D + e^{2βD} ε,   W = 1 }\n```\n\n\
  这两个子模型生成两个不同的 ROC 曲线，因为 D 的系数相差 α₃。\n\n特别对于 W=0\n\n```\na = α₁ / (e^{β} σ₀²),  \
  \ b = e^{β}\n```\n\n对于 W=1\n\n```\na = (α₁ + α₃) / (e^{β} σ₀²),   b = e^{β}\n```\n\
  \n注意，如果 α₃=0，则两个标记的 ROC 曲线相同。\n\n原则上，该模型可以容纳在两个标记上收集的数据。你可以为任何标记创建一个二元变量，然后将其用作\
  \ W 的替代来进行比较。通常，标记比较与协变量调整之间存在两个实际差异：\n\n- 标记比较通常涉及配对数据（如上一章解释的那样），而协变量调整涉及非配对数据。\n\
  - 标记比较通常使用 *异方差* 模型（允许由结果定义的两个组内方差不同），而协变量调整通常采用 *同方差* 模型（假设由结果定义的两个组内方差相等）。\n"
