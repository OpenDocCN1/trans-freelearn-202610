  ## 1.1 关于接收者操作特征曲线


  本书描述了如何使用 SAS 软件分析接收者操作特征（ROC）曲线。接收者操作特征曲线是评估预测准确性的统计工具。它通常缩写为 ROC 曲线或 ROC 图，后者在数据挖掘文献中更常用。


  做出预测已成为每个企业和科学探究领域的必不可少的一部分。一个不可逆地渗透到日常生活中的简单例子是天气预报。几乎所有新闻来源，包括报纸、广播和电视新闻，都提供详细的天气预报。美国甚至有一个专门的天气预报电视频道。


  当然，天气预报的影响超出了城市居民是否带伞的决定。恶劣天气对交通、农业和建筑等许多重要活动都有负面影响。因此，收集有助于预测天气条件的数据并建立统计模型从这些数据中产生预测，已成为主要产业。


  这些预测的消费者了解其准确性非常重要。这有助于他们将这些预测纳入未来的计划中。它也有助于他们在竞争提供商之间做出选择。同样，预测提供商评估其预测的准确性也很重要，因为准确性是其产品质量的直接指标。当提供商决定投资技术以改善预测时，评估准确性也很重要。预测的改进与准确性的改进密不可分。


  信用评分是做出预测的另一个例子：当潜在债务人申请信用时，债权人评估违约的可能性以决定是否贷款以及贷款利率。准确评估债务人违约的可能性对债权人保持竞争力至关重要。因此，信用评分系统背后的预测模型仍然是专有的。尽管如此，其预测能力需要持续评估，以便债权人保持盈利。


  最后一个例子涉及医学诊断领域。*预测*一词很少出现在该文献中，但诊断是对表现出某些症状和主诉的患者可能出现的问题的预测。大多数疾病会引起血液或尿液中某物质水平的升高反应。然而，这样的升高水平可能有其他原因；因此，仅评估血液或尿液水平可能会导致误诊。了解此类诊断的准确性至关重要，因为它们会影响后续的评估和治疗。常见的情况是存在多个诊断标记或工具，对它们的公平评估涉及比较它们的准确性。这些诊断选项在成本和对患者的风险方面可能有所不同，在这种情况下，可以进行决策分析，其中每个工具的价值根据该工具所做诊断的准确性来量化。


  所有这些例子都有一个共同主题。在预测实体的价值已知之前就会做出预测。我们需要一种方法来评估这些预测的准确性。正如这些例子所表明的，如果该方法能够比较几个预测的准确性将很有帮助。


  用于命名预测和结果的约定各不相同。表 1.1 总结了最常用的名称。


  ### 表 1.1 ROC 曲线元素的常用命名法


  | 预测变量 | 待预测变量 | 待预测变量的值 |

  |---|---|---|

  | 预测因子 | 结果 | 病例/对照 |

  | 标记 | 状态 | 有病/无病 |

  | 分数 | 金标准 | 阳性/阴性 |

  | 预测 | 指标 | 存在/不存在 |

  |  |  | 事件/非事件 |


  ROC 曲线提供了一种全面且视觉上吸引人的方法来总结预测的准确性。它们广泛适用，无论预测的来源如何。您还可以通过比较所得预测的 ROC 曲线来比较生成预测的不同方法的准确性。因此，可能会令人惊讶地意识到
  ROC 曲线通常在统计学家的教育和培训中被忽略。大多数统计学家是在工作中按需学习 ROC 曲线，并为这种类型的分析的某些不寻常特征而苦苦挣扎。


  对于 SAS 用户来说，情况更糟，很少有直接的方法可以在 SAS 中执行 ROC 分析。然而，许多现有过程只需稍加调整即可生成 ROC 曲线。SAS Institute
  还提供了一个宏来执行部分计算。本书描述了如何使用 SAS 中可用的功能生成 ROC 曲线，并扩展了使用其他 SAS 过程进行的进一步分析。


  ## 1.2 章节概要


  准确性评估方法取决于预测因子的性质。第 2 章“单个二元预测因子”和第 3 章“单个连续预测因子”介绍了二元变量和连续变量的适当方法。这两章讨论的材料在后续章节中反复使用，因此在继续阅读之前必须很好地掌握这些概念。如果您已经熟悉这些统计概念，但更感兴趣的是了解
  SAS 在 ROC 曲线方面的能力，请跳过介绍和讨论这些概念的部分。本书中大部分 SAS 代码都是在示例的背景下呈现的，因此对于那些读者来说，粗略阅读第 2 章和第
  3 章以熟悉符号，然后仔细遵循示例以掌握 SAS 代码就足够了。


  大多数计算使用 PROC FREQ、PROC LOGISTIC 或 PROC NLMIXED 执行。还有一些宏在绘制 ROC 曲线或计算 ROC 曲线下面积的标准误差方面非常有用。偶尔会调用
  PROC TRANSREG（用于 Box-Cox 转换）或 PROC MIXED 以及使用 PROC SURVEYSELECT 创建自助样本。


  注意：这里需要呈现的大多数内容都没有标准的数学符号。我试图在个人偏好和广泛接受的做法之间取得平衡；这就是为什么即使对统计概念感到舒适的人也建议进行粗略阅读。


  第 4 章“ROC 曲线的比较和协变量调整”比较了几个标记的 ROC 曲线并对其进行协变量调整。为此的主要工具是回归，它可以容纳分类和连续协变量。回归方法还可以通过在类似
  ANOVA 的模型中使用哑变量来表示标记，从而比较几个标记的准确性。虽然这些回归模型的机械方面与其他回归模型相似，但模型系数的包含和解释是 ROC 曲线领域的独特之处。


  第 5 章“有序预测因子”重复了第 3 章和第 4 章中关于有序预测因子的材料。思想非常相似，但统计技术略有不同，例如使用潜在变量 probit 回归模型，在
  ROC 文献中也 commonly 称为双正态模型。虽然有可能仅凭对早期材料的肤浅理解来学习第 5 章，但我建议先掌握第 2 章和第 3 章中的概念。


  第 6 章“Lehmann 家族的 ROC 曲线”和第 7 章“带删失数据的 ROC 曲线”介绍了尚未进入其他书籍的相对较新的材料。第 6 章的重点是 Lehmann
  家族的 ROC 曲线，完全使用比例风险模型。比例风险模型在生存分析中常规使用，但在其他应用中很少使用。第 6 章展示了如何使用它来创建 ROC 曲线并使用 PROC
  PHREG 的功能扩展到回归模型和聚类数据。大多数统计学家将 PROC PHREG 与删失数据联系在一起，但第 6 章处理的是完全观察到的二元结果，就像第 2
  章到第 5 章中的结果变量一样。创建带删失数据的 ROC 曲线的问题在第 7 章中得到解决。提供了两种计算一致性概率的方法，并讨论了时间依赖性 ROC 曲线。


  第 8 章“使用 ROC 曲线评估多变量预测模型”讨论了在同一数据集上构建和评估多变量预测模型时使用 ROC 曲线。第 9 章在数据挖掘的背景下使用相同的概念。虽然概念保持不变，但主要的
  SAS 数据挖掘引擎 SAS Enterprise Miner 具有非常




  不同于 SAS/STAT 软件的用户界面和功能。因此，第 9 章的大部分内容讨论了如何在 SAS Enterprise Miner 中开发模型，以及如何使用模型评估的内置功能生成
  ROC 曲线。还展示了导出 ROC 曲线数据的各种方法，以便您可以使用 SAS/GRAPH 软件创建自定义绘图。


  所呈现的大部分 SAS 代码由 SAS/STAT 和 SAS/GRAPH 软件组成；Base SAS 偶尔用于准备分析和绘图的数据。SAS/STAT 过程 FREQ、LOGISTIC、MIXED
  和 NLMIXED 提供了分析所需的大部分弹药。


  您应该对线性模型和回归分析有基本的了解。本书假设您没有使用 SAS/STAT 过程的先前经验；然而，如果您不熟悉常见的 SAS 系统概念，例如 BY 处理或 CLASS
  语句，您可能会从查阅通用 SAS 手册中受益。


  本书包含一个通用宏，可用于绘制 ROC 曲线，而与预测的性质或来源无关。那些发现该宏提供的选项足够的人可能不需要直接使用 SAS/GRAPH 软件。然而，图形展示涉及个人风格的程度，您可能希望自定义曲线并使用特定的注释。如果是这样，您可以使用宏创建的中间数据集并编写自己的
  SAS/GRAPH 代码来生成自定义图形。


  本书中介绍的 SAS 代码，尤其是宏，很可能会演变。代码可从本书的配套网站 support.sas.com/gonen 下载，将会定期更新，因此请经常查看该网站以获取最新进展。

