- "# 单个二元预测器\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_15_0.png)\n\n+   2.1 引言 .........................................................\
  \ 5\n+   2.2 霜冻预报示例 ............................................... 5\n+   2.3 误分类率\
  \ ............................................... 6\n+   2.4 灵敏度和特异性 ..........................................\
  \ 7\n+   2.5 使用 PROC FREQ 进行计算 ....................................... 8\n\n## 2.1\
  \ 引言\n\n预测的最简单场景之一是二元预测器的情况。它不仅因为它包含了 ROC 曲线的最关键构建块而重要，而且因为它在实践中经常遇到。本章使用天气预报中的一个例子来说明这些概念。处理类似数据的难题也很丰富，从诊断医学到信用评分。\n\
  \n## 2.2 霜冻预报示例\n\nThornes 和 Stephenson（2001）从天气预报产品的角度回顾了预测准确性的评估。他们的开篇示例非常简单且易于理解，对所有数据分析人员而言，无论其气象学训练如何。该示例讨论了\
  \ 1995 年冬季在英国利兹和赫尔之间的 M62 公路提供的霜冻预报。霜冻发生在道路温度低于 0 °C 时。首先，为每晚制作预报为二元指标（霜冻或无霜冻）。然后在整晚监测道路的实际表面温度，并将结果记录为霜冻，如果温度降至\
  \ 0 °C 以下，则记录为无霜冻，如果温度未降至 0 °C 以下。公路局提供的指南规定，结果（预报和实际）仅对实际温度低于 5 °C 的日子以汇总方式报告（参见表\
  \ 2.1 中的霜冻和无霜冻列和行）。该示例指的是 1995 年冬季，当时实际道路表面温度在 77 个夜晚低于 5 °C。结果见表 2.1。这种表格描述是报告准确性的标准方式，当预测和结果都是二元时。它视觉上吸引人且易于导航，并且包含所有必要信息。\n\
  \n有 29 个夜晚预报霜冻且观察到霜冻，有 38 个夜晚预报无霜冻且未观察到霜冻。这两个单元格（表 2.1 的阴影部分）代表两种正确的预报类型。这些两个单元格的通用术语为\
  \ *真阳性 (TP)* 和 *真阴性 (TN)*。这种术语的根源可追溯到医学诊断研究，当测试显示疾病时称为阳性，未显示时称为阴性。类比而言，您可以将霜冻视为阳性，无霜冻视为阴性，在这种情况下，表\
  \ 2.1 中有 29 个真阳性和 38 个真阴性。\n\n### 表 2.1 道路表面温度的预报准确性\n\n| Forecast | Observed |\
  \  |  |\n| | Frost | No Frost | Total |\n| Frost | 29 | 6 | 35 |\n| No Frost | 4\
  \ | 38 | 42 |\n| Total | 33 | 44 | 77 |\n\n预报错误呢？有 6 个夜晚预报霜冻但未观察到。有 4 个夜晚预报无霜冻，但观察到霜冻。可以很容易地将术语扩展为将这两个单元格称为\
  \ *假阳性 (FP)* 和 *假阴性 (FN)*。表 2.2 使用此处引入的术语对表 2.1 进行了通用表示。\n\n### 表 2.2 二元预测的准确性报告\n\
  \n| Forecast | Observed |  |  |\n| | Positive | Negative | Total |\n| Positive |\
  \ True Positive (TP) | False Positive (FP) | TP+FP |\n| Negative | False Negative\
  \ (FN) | True Negative (TN) | FN+TN |\n| Total | TP+FN | FP+TN | TP+FP+FN+TN |\n\
  \n## 2.3 误分类率\n\n总结预报准确性有多种方法。显而易见的一种是 *误分类率 (MR)*，它是所有被误分类夜晚的比例，即假阴性和假阳性的总和除以所有夜晚：\n\
  \n$$MR = \\frac{FN + FP}{TP + FN + FP + TN}$$\n\n误分类率的 1 倍有时称为 *正确百分比* 或简单地称为 *准确性*。表\
  \ 2.1 中数据的 MR 为 10/77=13%。\n\n虽然误分类率易于计算和理解，但有时对于理解误分类背后的机制来说过于粗糙。如果信息没有仔细组装，它也容易产生偏差。假设不是遵循公路局的指南，预报提供者决定包含日历年的所有夜晚。表\
  \ 2.1 中报告了 77 个夜晚，并且根据定义，所有这些夜晚的实际温度都降至 5 °C 以下。因此，其余 288 个夜晚全部高于 5 °C（无霜冻），将列边际总数增加到\
  \ 33 个霜冻夜晚（不变）和 332 个无霜冻夜晚。可能 温度高于 5 °C 的 288 个夜晚的 MR 远低于温度低于 5 °C 的夜晚的 MR。假设这些\
  \ 288 个夜晚的误分类率为 5%，导致 15 个误分类夜晚（四舍五入）。那么 365 个夜晚中总共有 25 个误分类夜晚，MR 为 25/265=7%。表\
  \ 2.3 显示了几种可能性。\n\n### 表 2.3 温度高于 5 °C 的 288 个夜晚的误分类百分比以及所有 365 个夜晚的相应 MR\n\n| Percent\
  \ misclassified for the 288 nights when the temperature was above 5 °C | 0 | 1 |\
  \ 2 | 4 | 6 | 8 | 10 | 12 | 13 |\n| Percent misclassified for all 365 nights | 2.7\
  \ | 3.5 | 4.3 | 5.9 | 7.5 | 9.1 | 10.6 | 12.2 | 13.0 |\n\n很明显，MR 对样本中包含哪些夜晚很敏感，因为预报的性能对于一年中的所有夜晚来说并不均匀。也很明显，随着您在样本中包含更多易于预报的夜晚，MR\
  \ 会变小。您可以安全地假设，对于春季和夏季的温暖日子，M62 的夜间霜冻预报是不必要的，因为大多数人可以在不求助于科学获得的预报的情况下相当准确地做出相同的预测（无霜冻！）。这就是为什么公路局将准确性报告限制在实际温度为\
  \ 5 °C 或更低的夜晚的原因。这也强调了 MR 的解释取决于样本中霜冻夜晚的比例（本例中为 30%）。该比例有时称为患病率。\n\n在信用评分等不受监管的领域，评分算法大多是专有的，没有关于如何评估准确性的此类规则，甚至没有指导方针。此外，预测的消费者在解释准确性的细节或复杂性方面并不总是勤勉或有知识。因此，您需要更稳健的度量。\n\
  \n## 2.4 灵敏度和特异性\n\n报告二元预测准确性的最常见方法是分别使用真（或假）阳性和真（或假）阴性。这承认了假阴性预测可能与假阳性预测有不同的后果。它还使这些度量独立于患病率。因此，这些两个度量被认为衡量预测器的固有能力。在这个天气预报示例中，假阳性可能成本较低，因为其主要后果可能是更谨慎、准备更好的驾驶员。另一方面，假阴性可能导致准备不足和事故。这表明应分别报告假阳性和假阴性率。\n\
  \n```\nFPR = FP / (TN + FP),   FNR = FN / (TP + FN)\n```\n\n\n\n\n\n更常见的做法是使用真阳性率和真阴性率，定义为\n\
  \n$$TPR = \\frac{TP}{TP + FN}, \\quad TNR = \\frac{TN}{TN + FP}$$\n\n真阳性率（TPR）有时被称为*sensitivity*，真阴性率（TNR）有时被称为*specificity*。虽然这些是常规出现在统计文献中的通用术语，但每个领域都有自己的术语。例如，天气预报员使用\
  \ FNR 的失误率和 FPR 的误报率。\n\n天气预报数据的 FNR 和 FPR 分别为 4/33=12% 和 6/44 = 14%。敏感性和特异性分别为\
  \ 29/33=88% 和 38/44=86%。在这种情况下，FPR 和 FNR 彼此非常接近。当这种情况发生时，它们也将非常接近 MR。事实上，MR 是 FPR\
  \ 和 FNR 的加权平均值：$MR = w*FPR + (1-w)*FNR$，其中权重（$w$）是观测到霜冻的夜晚所占的比例。这有时被称为霜冻的*prevalence*。\n\
  \n请注意，TPR 和 TNR 的分母是总观测阳性和阴性。可以定义类似的量，使用预测阳性和阴性作为分母。在这种情况下，对应于敏感性和特异性的比率称为*positive\
  \ predictive value (PPV)* 和 *negative predictive value (NPV)*：\n\n$$PPV = \\frac{TP}{TP\
  \ + FP}, \\quad NPV = \\frac{TN}{TN + FN}$$\n\n熟悉 PROC LOGISTIC 的 SAS 用户会认识到 PPV\
  \ 和 NPV 实际上被称为 TPR 和 TNR。这可能是混淆的来源。本书不使用已建立的 PROC LOGISTIC 术语，因为它定义 TPR 和 TNR 与其在医学诊断文献中的使用方式一致。尽管如此，为了尽量减少混淆，敏感性和特异性比\
  \ TPR 和 TNR 使用得更频繁。\n\n## 2.5 使用 PROC FREQ 进行计算\n\n在 SAS 中计算所有这些度量相对容易。以下 DATA 步为\
  \ PROC FREQ 的后续使用准备数据：\n\n```\ndata m62;\n    input forecast $ observed $ weight;\n\
  \    datalines;\nFrost Frost 29\nFrost No_Frost 6\nNo_Frost Frost 4\nNo_Frost No_Frost\
  \ 38\n;\nrun;\n```\n\n以下 PROC FREQ 的执行提供了必要的计算：\n\n```\nproc freq data=m62;\n  \
  \  table forecast*observed;\n    weight weight;\nrun;\n```\n\n输出 2.1 包含许多有用的信息。作为对\
  \ PROC FREQ 输出的快速复习，每个单元格中四个数字的含义可在表格左上角找到。第一个数字是频数（即 TP、FP、FN 和 TN）。第二个数字（Percent）使用表格总和（列总和之和或行总和之和，本例中为\
  \ 77）作为分母。第三个数字（Row Pct）是行百分比（即使用行总和作为分母的比例）。最后，第四个数字（Col Pct）是使用列总和作为分母的列百分比。\n\
  \n## Output 2.1\n\n| forecast | observed |  |\n|---|---|---|\n| Frequency |  | \
  \ |\n| Percent |  |  |\n| Row Pct |  |  |\n| Col Pct | Frost | No_Frost | Total\
  \ |\n| Frost | 29 | 6 | 35 |\n|  | 37.66 | 7.79 | 45.45 |\n|  | 82.86 | 17.14 |\
  \  |\n|  | 87.88 | 13.64 |  |\n| No_Frost | 4 | 38 | 42 |\n|  | 5.19 | 49.35 | 54.55\
  \ |\n|  | 9.52 | 90.48 |  |\n|  | 12.12 | 86.36 |  |\n| Total | 33 | 44 | 77 |\n\
  |  | 42.86 | 57.14 | 100.00 |\n\n这些数字中的每一个在计算迄今讨论的度量时都有作用。例如，MR 是表格中非对角线元素的表格百分比（第二组数字）的总和：7.79+5.19=12.98%。PPV\
  \ 和 NPV 可以在行百分比中找到，因为行总和与预测相关。这里，PPV 为 82.86%，NPV 为 90.48%。最后，敏感性和特异性可从列百分比获得（本例中为\
  \ 87.88% 和 86.36%），意味着敏感性为 87.88%，特异性为 86.36%。\n\n必须非常清楚地理解敏感性、特异性、PPV 和 NPV 的正确解释。让我们先从预测值开始。它们的分母是阳性和阴性预测的数量。在天气预报示例中，PPV\
  \ 可以解释为预报霜冻时实际发生霜冻的概率，而 NPV 是预报无霜冻时观测到无霜冻的概率。因此，如果 M62 高速公路预报有霜冻，则实际发生霜冻的概率估计为 82.86%。同样，如果预报没有霜冻，则不会出现霜冻的概率估计为\
  \ 90.48%。\n\n相比之下，敏感性和特异性的分母是观测到的阳性和阴性。因此，敏感性是在所有霜冻夜晚中，预报正确识别出霜冻夜晚的概率；同样，特异性是在所有无霜冻（且低于\
  \ 5 °C）的夜晚中，预报正确识别出无霜冻夜晚的概率。在我们的示例中，霜冻被正确预报的概率估计为 87.88%，无霜冻被正确预报的概率估计为 86.36%。\n\
  \n很容易想象这些概率作为偶尔的天气预报消费者时的实用性。如果你只在冬季的几个夜晚从利兹开车到赫尔走 M62，你只关心预报在那几个夜晚是否准确。另一方面，负责保持高速公路无霜的机构在决定是否支付这些预报费用时可能更感兴趣于敏感性和特异性，因为这关系到即将到来的冬季整个“队列”的夜晚，而该机构的决策应基于预报的长期表现。\n\
  \n很容易认识到，如果相应的分母被视为固定，则敏感性、特异性以及阳性和阴性预测值都是二项比例。技术术语是条件于分母。这很容易导致在 PROC FREQ 中使用二项式功能来计算区间估计。\n\
  \n以下代码使用两次单独的 PROC FREQ 调用来获得敏感性和特异性的估计值以及置信区间和关于特定零值的假设检验。请注意使用 WHERE 语句为每次计算选择适当的分母：\n\
  \n```\ntitle \"Sensitivity\";\nproc freq data=m62(where=(observed='Frost'));\n \
  \ table forecast / binomial(p=0.8);\n  weight weight;\n  exact binomial;\nrun;\n\
  ```\n\nBINOMIAL 关键字后括号中指定的值是假设检验的零值。指定了 80% 的零值。该值仅为演示 BINOMIAL 选项的假设检验功能而选择。它与示例中实际感兴趣的值无关。\n\
  \n输出 2.2 显示了敏感性，估计为 87.88% 或 33 个中的 29 个。这 33 个霜冻夜晚中的每一个都可以被视为独立的伯努利变量：其中 29 个为阳性（1），4\
  \ 个为阴性（0）。它们的和（29）是二项变量，其样本量（分母）为 33，敏感性为该变量的二项比例。\n\n## Output 2.2\n\nSensitivity\n\
  \nThe FREQ Procedure\n\nforecast    Frequency    Percent    Cumulative Frequency\
  \    Cumulative Percent\nFrost       29           87.88      29                \
  \       87.88\nNo_Frost    4            12.12      33                       100.00\n\
  \n    Binomial Proportion\n    for forecast = Frost\n\nProportion              \
  \   0.8788\nASE                        0.0568\n95% Lower Conf Limit       0.7674\n\
  95% Upper Conf Limit       0.9901\n\nExact Conf Limits\n95% Lower Conf Limit   \
  \    0.7180\n95% Upper Conf Limit       0.9660\n\n    Test of HO: Proportion = 0.8\n\
  \nASE under HO               0.0696\nZ                          1.1315\nOne-sided\
  \ Pr >  Z          0.1289\nTwo-sided Pr > |Z|         0.2578\n\nExact Test\nOne-sided\
  \ Pr >=  P         0.1821\nTwo-sided = 2 * One-sided  0.3643\n\nSample Size = 33\n\
  \n\n\n\n\n第一组置信限基于众所周知的二项分布的正态近似。这些置信区间的关键量是渐近标准误（ASE），其计算公式为\n\nASE = sqrt( p(1\
  \ - p) / n )\n\n其中 n 为二项比例的分母（在本例中为灵敏度），p 为数据中比例的估计值。灵敏度的 ASE 为 5.68%。\n\nASE 下出现的置信限基于渐近理论。如果\
  \ n 较大，则 95% 置信区间可使用\n\np ± 1.96 × ASE\n\n计算。输出报告灵敏度的渐近 95% 置信区间为 (76.74%, 99.01%)。\n\
  \n与之相比，精确置信限基于二项分布，在小样本和/或罕见事件时覆盖率更好。因为在指定了 BINOMIAL 选项时默认会计算精确置信限，因此无需使用渐近置信限。灵敏度的精确\
  \ 95% 置信区间为 (71.80%, 96.60%)。渐近区间与精确区间之间的差异突出了中等样本量的典型效应。\n\n最后，输出的最后一部分提供了灵敏度是否等于\
  \ 80% 的检验。PROC FREQ 输出中报告的 z 统计量通过 z = p / ASE(null) 计算，其中 ASE(null) 表示在原假设下的 ASE。这是一种常见的计算检验统计量的方法，有时称为\
  \ Wald 检验。我们假设下的 ASE(null) 为 6.96%，对应的 z 值为 1.13。在大样本中，在原假设下 z 服从正态分布，因此可以通过查标准正态表获得\
  \ p 值。这得到双侧 p 值为 0.26，提示霜冻预报的灵敏度与 80% 无差异。\n\n一般而言，置信区间和假设检验在渐近标准误的计算上存在重要差异。5.68%\
  \ 的 ASE 使用观察到的 p 值 87.88%，而 H₀ 下的 ASE（此处为 6.96%）使用原假设中的 p 值 80%。\n\n## Output 2.3\n\
  \n### Specificity\n\nThe FREQ Procedure\n\n| forecast | Frequency | Percent | Cumulative\
  \ Frequency | Cumulative Percent |\n|---|---|---|---|---|\n| No_Frost | 38 | 86.36\
  \ | 38 | 86.36 |\n| Frost | 6 | 13.64 | 44 | 100.00 |\n\nBinomial Proportion for\
  \ forecast = No_Frost\n\nProportion (P)  0.8636\nASE  0.0517\n95% Lower Conf Limit\
  \  0.7622\n95% Upper Conf Limit  0.9650\n\nExact Conf Limits\n95% Lower Conf Limit\
  \  0.7265\n95% Upper Conf Limit  0.9483\n\nTest of H0: Proportion = 0.75\n\nASE\
  \ under H0  0.0653\nZ  1.7408\nOne-sided Pr > Z  0.0409\nTwo-sided Pr > |Z|  0.0817\n\
  \nExact Test\nOne-sided Pr >= P  0.0523\nTwo-sided = 2 * One-sided  0.1046\n\nSample\
  \ Size = 44\n\n以下代码创建 Output 2.3：\n\n```\ntitle \"Specificity\";\nproc freq data=m62(where=(observed='No_Frost'))\
  \ order=freq;\n    table forecast / binomial(p=0.75);\n    weight weight;\n    exact\
  \ binomial;\nrun;\n```\n\n对特异性的输出解释与灵敏度类似。特异性估计为 86.36%，ASE 为 5.17%。基于 ASE 的 95%\
  \ 置信区间为 (76.22%, 96.50%)，95% 精确置信区间为 (72.65%, 94.83%)。检验特异性是否超过预先设定的 75% 目标值得到渐近\
  \ p 值为 0.0817，精确 p 值为 0.1046。在此分析下，你会保留原假设。\n\nPROC FREQ 中的 ORDER= 选项在 SAS 默认选择与你想要的二项事件不同时可能很有帮助。这会导致以期望类别的补集方式计算二项比例。你始终可以从输出中减去\
  \ 1 的值并以类似方式调整假设值以获得正确的分析。但也可以通过使用 PROC FREQ 语句的 ORDER 选项来获得完全期望的输出。为了更好地理解 ORDER\
  \ 语句的正确用法，重要的是要理解，默认情况下（即没有 ORDER 选项时）PROC FREQ 使用 TABLE 变量的未格式化值的按字母顺序排列列表中的第一个值作为事件。这导致霜冻被视为事件，报告的分析是\
  \ FPR 而不是特异性。ORDER=FREQ 告诉 PROC FREQ 使用最常见的类别作为事件，从而得到期望的分析。当特异性大于 50% 时此方法有效，这应涵盖大多数情况。当特异性小于\
  \ 50% 时，ORDER=FREQ 也会使用错误的类别作为事件。万无一失的系统需要先按预测变量以降序对数据进行排序，然后再使用不带 ORDER= 指定 的 PROC\
  \ FREQ。\n"
- "## Single Continuous Predictor\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_25_0.png)\n\
  \n- 3.1 Dichotomizing a Continuous Predictor...........................................................\
  \ 15\n- 3.2 The ROC Curve .......................................................................\
  \ 18\n- 3.3 Empirical ROC Curve and the Conditional Distributions of the Marker..\
  \ 20\n- 3.4 Area under the ROC Curve ...............................................................\
  \ 21\n- 3.5 Selecting an Optimal Threshold...........................................................\
  \ 25\n- 3.6 The Binormal ROC Curve...............................................................\
  \ 26\n- 3.7 Transformations to Binormality ...........................................................\
  \ 30\n- 3.8 Direct Estimation of the Binormal ROC Curve .......................................\
  \ 32\n- 3.9 Bootstrap Confidence Intervals for the Area under the Curve.............\
  \ 33\n\n## 3.1 Dichotomizing a Continuous Predictor\n\n现在让我们考虑自然导致使用 ROC 曲线的问题。假设你试图预测一个二元结果，比如天气预报，但你拥有的不是二元预测因子而是一个连续预测因子。大多数天气预报是由统计模型产生的，它们为结果生成一个概率水平。例如，大多数天气预报在摘要中提到降雨，但如果你查看细节，它们还会报告降雨的几率。你将如何评估这些概率（或更恰当地说是产生这些预测概率的模型）的预测准确性？\n\
  \n由于你已经知道如何对二元预测因子进行预测准确性分析（使用灵敏度和特异性等指标），你可能会考虑通过使用阈值将预测概率转化为二分变量。然而，结果显然会取决于阈值的选择。那如果使用多个阈值并报告每个阈值的结果呢？ROC\
  \ 曲线提供了一种方法。通过仅关注灵敏度和（1 减去）特异性，ROC 曲线提供了一种方法。\n\n让我们用医学诊断领域的例子。诊断癌症的一种方法是使用一种特殊的扫描，称为\
  \ *正电子发射断层扫描 (PET)*。PET 产生一个称为 *标准化摄取值 (SUV)* 的指标，它是一个正数，表示所考虑的身体部位患癌的可能性。测量 SUV\
  \ 后，患者会接受活检，其中从疑似区域取出一小块组织并在显微镜下检查以评估其是否癌变。此过程称为 *病理验证*，被认为是金标准。使用第 1 章引入的术语，我们将\
  \ SUV 称为标记，病理验证称为金标准。\n\n数据由 Wong et al. (2002) 报道。有 181 名患者，其中 67 名被金标准发现患有癌症。由于我们处理的是连续预测因子，因此不再可能以表格形式报告数据。相反，你可以使用以下来自\
  \ PROC UNIVARIATE 的并排直方图，该图可通过同时使用 CLASS 和 HISTOGRAM 语句获得。例如，以下代码用于生成图 3.1：\n\n\
  ```\nproc univariate data=HeadNeck noprint;\nclass gold_standard / keylevel='-';\n\
  var suv;\nhistogram suv / turnvlabels cfill=ligr cframe=white\n    cframeside=white\
  \ endpoints=0 to 20 by 2 cbarline=black\n    font=swissb height=4;\nrun;\n```\n\n\
  ## Figure 3.1 Side-By-Side Histograms for SUV\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_26_0.png)\n\
  \n当在 PROC UNIVARIATE 中使用 CLASS 语句调用 HISTOGRAM 语句时，会为类别变量的每个值生成单独的直方图。KEYLEVEL= 选项确保所选级别始终出现在顶部（在本例中，代码首先显示金标准阴性患者的直方图）。HISTOGRAM\
  \ 语句中使用的选项在视觉上增强了图形。它们的使用在 *Base SAS Procedures Guide: Statistical Procedures* 中有详细说明，该指南可在\
  \ support.sas.com/documentation/onlinedoc/sas9doc.html 获取。\n\n\n\n\n\n图的上面面板是金标准阴性患者（无癌症）的\
  \ SUV 直方图，下面面板是金标准阳性患者（有癌症）的 SUV 直方图，如纵轴所示。癌症患者往往具有较高的 SUV 值；只有少数人的 SUV 非常低。非常高的\
  \ SUV（例如，10 或更高）几乎肯定意味着癌症。然而，SUV 在中间范围（大约 4–10）的分布之间存在一定的重叠。因此，SUV 的极端值强烈暗示癌症或无癌症，但在中间存在一个灰色区域。这实际上是许多连续预测变量的非常常见的图景。那么，SUV\
  \ 用于诊断癌症的准确性如何？\n\n一种粗略的处理问题的方法是计算各种阈值的敏感性和特异性。图 3.2 使用 7 作为阈值。左侧（SUV≤7）被认为是癌症阴性，右侧（SUV>7）被认为是癌症阳性。HREF=7\
  \ 选项在 HISTOGRAM 语句中使用来绘制参考线，并且使用 FRONTREF 选项确保参考线位于直方图条的前面。\n\n更大比例的金标准阴性患者具有 SUV≤7\
  \ 并被分类为无癌症。同样，更大比例的金标准阳性患者具有 SUV>7 并被分类为有癌症。\n\n## 图 3.2 在 SUV=7 处二分\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_27_0.png)\n\
  \nSUV 的二分化可以使用以下 DATA 步命令完成：\n\n```\nsuv7=(suv>7);\n```\n\n如果 SUV 变量包含缺失值，这可能会产生不良行为，因为缺失值将满足\
  \ suv≤7，在这种情况下将被重新编码为 0。如果要重新编码的变量包含缺失值，应使用 IF-THEN 语句。\n\n使用变量 SUV7，你可以很容易地获得上一章天气预测示例中考虑的那种\
  \ 2x2 表。对于本数据集，它看起来像表 3.1 中的单元格：\n\n## 表 3.1 SUV>7 在癌症诊断中的准确性\n\n| SUV>7 分类 | 金标准诊断\
  \ |  |  |\n| | 癌症 | 无癌症 | 总计 |\n| 癌症 | 25 | 3 | 28 |\n| 无癌症 | 42 | 111 | 153 |\n\
  | 总计 | 67 | 114 | 181 |\n\n行是 SUV>7 规则的分类，列是金标准的分类。利用第 2 章介绍的技术，你可以使用 PROC FREQ\
  \ 来估计敏感性和特异性分别为 25/67=37% 和 111/114=97%。因此，使用 7 作为 SUV 阈值将患者分类为有癌症或无癌症具有高度特异性，但敏感性值得怀疑。这不一定是对整个标准化摄取值谱诊断癌症能力的裁决。事实上，图\
  \ 3.2 表明将阈值向左移动（即使用较低的阈值）将提高敏感性，同时降低特异性。由于使用 7 作为阈值的敏感性如此之差而特异性如此之高，这可能是一种值得的策略。这可能有助于你找到更好的阈值，但仍不足以确定\
  \ SUV 是否是癌症的良好预测因子。下一节将解释如何使用 ROC 曲线来完成此操作。\n\n## 3.2 ROC 曲线\n\n之前的分析可以针对各种阈值重复，每个阈值可能产生不同的敏感性和特异性值。报告此类分析结果的一种方法是表格形式。表\
  \ 3.2 是一个示例，报告了几个选定阈值的结果。\n\n## 表 3.2 SUV 在诊断癌症中的准确性，针对各种阈值\n\n| 阈值 | 1 | 3 | 5\
  \ | 7 |\n| 敏感性 | 97% | 93% | 61% | 37% |\n| 特异性 | 48% | 65% | 88% | 97% |\n\n表 3.2\
  \ 清楚地显示了通过改变阈值可以获得的敏感性和特异性的广泛范围。它还确定了两者之间的反向关系：一个增加，另一个减少，反之亦然。这可以从直方图中看出。如果你将虚线向左移动（例如，从\
  \ 7 改为 5），将有更多患者被分类为阳性：其中一些是金标准阳性，即真阳性，这将提高敏感性。然而，其他人将是金标准阴性，即假阳性，这将降低特异性。因此，表 3.2\
  \ 中观察到的关系是普遍的：不可能改变阈值使得特异性和敏感性同时增加。\n\n表格形式在可容纳的阈值数量上有限制。你可以绘制敏感性与特异性，使其能够容纳所有可能的阈值。表\
  \ 3.2 显示由于两者呈反向关系，敏感性与特异性的图将显示下降趋势。可以获得视觉上更具吸引力的显示方法是绘制\n\n敏感性与一减去特异性。这称为 *接收者操作特征\
  \ (ROC)* 曲线。图 3.3 表示对应于 PET 数据集的 ROC 曲线。\n\n## 图 3.3 PET 数据集的 ROC 曲线\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_29_0.png)\n\
  \n点被称为 *观察到的操作点*，因为你可以生成一个在任意点的敏感性和特异性水平上执行（或 *操作*）的二元标记。在此图中，操作点被连接起来，形成所谓的 *经验*\
  \ ROC 曲线。其含义是 ROC 曲线上的任何点都是可行的操作点，尽管你可能需要在观察到的标记值之间进行插值以找到正确的阈值。\n\n图 3.3 中的 ROC\
  \ 曲线使用以下代码生成：\n\n```\nproc logistic data=HeadNeck noprint;\n    model gold_standard=suv\
  \ / outroc=ROCData;\nrun;\n\nsymbol1 v=dot i=join;\nproc gplot data=ROCData;\n \
  \   plot _sensit_*_1mspec_;\n\nrun;\nquit;\n```\n\nPROC LOGISTIC 中 OUTROC= 选项产生的数据集会自动为每个可能的阈值计算敏感性和一减去特异性，并将这些变量命名为\
  \ _SENSIT_ 和 _1MSPEC_，然后可以使用标准的 SAS/GRAPH 过程进行绘图。\n\nROC 曲线上的每个点对应于一个阈值，尽管阈值的值从图中并不明显。这被认为是对\
  \ ROC 曲线的优势，因为它使标记强度评估摆脱了测量尺度。SUV 在不同尺度上测量的 ROC 曲线将与此处产生的一致。尽管如此，为了更好地理解 ROC 曲线，在少数选定点上标明阈值可能是有帮助的。为了突出这些阈值提供的敏感性和特异性，还可以在选定点包含水平和垂直参考线。\n\
  \n包含可能的阈值并不是你可以做的唯一视觉增强。最常见的增强是包含 45 度线。该线代表无信息测试的 ROC 曲线，并且是感兴趣 ROC 曲线应超过的视觉下限。最后，通常使水平和垂直轴长度相同，从而产生正方形图，而不是\
  \ SAS/GRAPH 默认的矩形图。这些功能在 %PLOTROC 宏中可用。有关更多信息，请参阅本书的配套网站 support.sas.com/gonen。\n\
  \n图 3.4 显示了 SUV 的 ROC 曲线，具有这些增强功能。它由 %PLOTROC 宏生成，调用如下：\n\n```\n%plotroc(data=HeadNeck,marker=suv,gold=gold_standard,anno=4,tlist=3\
  \ 4 5);\n```\n\n%ROCPLOT 宏也可用于此目的，可从 SAS 获得。\n\n## 图 3.4 具有增强功能的 PET 数据集的 ROC 曲线\n\
  \n![](img/ac26020abd4f22abfaafc0607939c6e4_30_0.png)\n\n## 3.3 经验 ROC 曲线和标记的条件分布\n\
  \n经验 ROC 曲线的便捷数学表示为其许多属性提供了进一步的见解。如图 3.1 所示，应根据金标准值检查标记的分布。设 f(t|D=0) 和 f(t|D=1)\
  \ 为金标准阴性和阳性患者的标记条件密度。上直方图是 f(t|D=0) 的近似，下直方图是 f(t|D=1) 的近似。现在定义 F 和 G 为对应于 f(t|D=0)\
  \ 和 f(t|D=1) 的生存函数（即一减去累积分布），即\n\n\n\n$$F(t)=\\int_{t}^{\\infty} f(s\\mid D=0)\\\
  ,ds$$ $$G(t)=\\int_{t}^{\\infty} f(s\\mid D=1)\\,ds$$\n\n因为 $G(t)$ 中的所有患者按定义都是金标准阳性，$G(t)$\
  \ 描述的是所有阳性患者中 SUV 超过 $t$ 的阳性患者所占比例。这不过是当 $t$ 用作阈值时的灵敏度。类似地，$1-F(t)$ 就是特异性；因此，$F(t)$\
  \ 表示一减去特异性。因此，ROC 曲线是 $F(t)$ 与 $G(t)$ 随每个 $t$ 的作图。\n\n尽管在数学上是正确的，但这并不能完全描述 ROC 曲线，因为它依赖于\
  \ $t$。然而，我们知道 $F(t)$ 是 ROC 曲线的 x 坐标。令 $x=F(t)$ 并求解 $t$，得到 $t=F^{-1}(x)$。对应于 $t$\
  \ 的灵敏度是 $G(t)$。因此，对应于 $x$ 的灵敏度由下式给出\n\n$$y=G(F^{-1}(x))$$\n\n这种表示有几个重要特征。首先，它是通用的。对标记物或金标准没有任何假设。它还明确了\
  \ ROC 曲线对整个分布函数的依赖性。这种表示也解释了为什么 ROC 曲线关注灵敏度和特异性而不是 NPV 和 PPV。阳性预测值和阴性预测值的分母会随阈值变化，并且不适合用预测变量的累积分布函数进行记号和分析。\n\
  \n这种关系也可以用来突出经验 ROC 曲线的一个基本性质，即它在标记物的单调变换下是不变的。为了理解这一概念，想象使用 $h(t)$ 而不是 $t$ 作为标记物，其中\
  \ $h(.)$ 是一个单调函数（单调函数保持数据的秩；统计学中使用的几乎所有变换，如对数或幂，都是单调的）。$F$ 和 $G$ 对 $h(t)$ 的形状与对\
  \ $t$ 的形状相同；唯一的区别在于它们的水平轴。这只会改变阈值，而不会改变由此产生的 ROC 曲线。\n\n## 3.4 ROC 曲线下面积\n\nROC\
  \ 曲线是对连续预测因子准确性的概括。然而，有时你可能想要对 ROC 曲线本身进行概括。ROC 曲线最常用的汇总统计量是 ROC 曲线下面积（AUC）。\n\n\
  在经验 ROC 曲线中，你可以通过所谓的梯形法则来估计 AUC：\n\n- 1. 使用观察点作为角点形成梯形。\n- 2. 用角点的坐标计算这些梯形的面积。\n\
  - 3. 将这些面积相加。\n\n对于像图 3.3 中那样具有许多可能阈值的曲线，这可能是一项相当大的工作。幸运的是，AUC 与一些众所周知的统计量有关，例如一致性、Somers’\
  \ D 和 Mann-Whitney 检验统计量。这种联系与第 3.3 节中讨论的不变性属性有关。对单调变换的不变性意味着 ROC 曲线是一个基于秩的度量。从观察到的标记值中使用的唯一信息是它们相对的秩。\n\
  \n我们将利用这些关系不仅便于计算，而且有助于深入了解曲线下面积的含义并改善解释。特别是，我们将看到如何使用 PROC LOGISTIC 估计一致性以及使用 PROC\
  \ FREQ 估计 Somers’ D。AUC 与 Mann-Whitney 统计量之间的关系在概念化方面与其他关系一样有用，但在 SAS 角度来看并不那么有用。这里未探讨它。\n\
  \n### 3.4.1 一致性及使用 PROC LOGISTIC 计算 AUC\n\n一致性概率衡量预测和结果一致的频率。以 PET 示例继续，如果在随机选择的患者对中，SUV\
  \ 较高的那位患有癌症，而 SUV 较低的那位没有癌症，则该对被称为一致对。SUV 较高的患者没有癌症但 SUV 较低的患者有癌症的对被称为不一致对。一些对的\
  \ SUV 相同，它们被称为结对。最后，一些对是非信息性的；例如，两位患者都可能患有癌症或都可能没有患癌症。这些对无法归类为一致或不一致。\n\n一致性概率定义为一致对数加上结对数的一半除以所有信息对数（即排除非信息对）。本质上，每个结对被计为一半不一致和一半一致。这是在许多秩程序中一个基本概念，有时被称为随机打破结。\n\
  \n表达一致性的等价方式是 P(SUV₊>SUV₋)，其中 SUV₋ 表示金标准阴性患者的 SUV，SUV₊ 表示金标准阳性患者的 SUV。图 3.1 有助于可视化这一过程。如果从上部直方图中随机选择一个\
  \ SUV，从下部直方图中选择一个，选自下部的那个高于选自上部的那个的几率是多少？\n\n对我们而言最重要的结果是，ROC 曲线下面积等于各种 SAS 过程报告的一致性概率。例如，PROC\
  \ LOGISTIC 在其标准输出的“Association of Predicted Probabilities and Observed Responses”标题下报告一致性。使用生成\
  \ ROC 曲线绘图数据集的同一 PROC LOGISTIC 调用，你可以从标记为“c”的输出中获得 AUC。在 PET 示例中，这为 0.871（或 87.1%），如输出\
  \ 3.1 所示。输出还包含计算的元素（即一致对、不一致对和结对的数量）。\n\n### Output 3.1\n\n| Association of Predicted\
  \ Probabilities and Observed Responses |\n| Percent Concordant 86.1 Somers' D 0.743\
  \ |\n| Percent Discordant 11.8 Gamma 0.758 |\n| Percent Tied 2.1 Tau-a 0.348 |\n\
  | Pairs 7638 c 0.871 |\n\nAUC 是从数据估计的，因此此估计必须有一个标准误差。使用 PROC LOGISTIC 估计 AUC 的主要缺点是相关的标准误差不可用。幸运的是，PROC\
  \ FREQ 为此提供了间接替代方案。\n\n### 3.4.2 Somers’ D 和使用 PROC FREQ 的 AUC\n\nPROC LOGISTIC\
  \ 输出还包括 Somers’ D。D 和 AUC 通过方程 D=2*(AUC-0.5) 相关。Somers’ D 只是 AUC（或一致性）的一个重新缩放版本，其取值在\
  \ -1 到 1 之间，像通常的相关系数一样，而不是 0 到 1。PROC LOGISTIC 不报告 Somers’ D 的标准误差。然而，PROC FREQ\
  \ 报告 Somers’ D 及其标准误差，如以下示例所示：\n\n```\nproc freq data=HeadNeck;\n    table suv*gold_standard\
  \ / noprint measures;\nrun;\n```\n\nNOPRINT 选项抑制频率表的打印，因为 SUV 的每个唯一值将被解释为表的行，频率表可能长达数页。MEASURES\
  \ 选项确保打印各种关联度量，包括 Somers’ D。输出 3.2 显示了此 PROC FREQ 调用的结果。\n\n### Output 3.2\n\n|\
  \ Statistic | Value | ASE |\n|---|---|---|\n| Gamma | 0.7585 | 0.0498 |\n| Kendall's\
  \ Tau-b | 0.5374 | 0.0402 |\n| Stuart's Tau-c | 0.6925 | 0.0561 |\n| Somers' D C|R\
  \ | 0.3889 | 0.0323 |\n| Somers' D R|C | 0.7426 | 0.0523 |\n| Pearson Correlation\
  \ | 0.6187 | 0.0395 |\n| Spearman Correlation | 0.6311 | 0.0466 |\n| Lambda Asymmetric\
  \ C|R | 0.6716 | 0.0634 |\n| Lambda Asymmetric R|C | 0.0081 | 0.0180 |\n| Lambda\
  \ Symmetric | 0.2408 | 0.0318 |\n| Uncertainty Coefficient C|R | 0.6252 | 0.0521\
  \ |\n| Uncertainty Coefficient R|C | 0.1225 | 0.0104 |\n| Uncertainty Coefficient\
  \ Symmetric | 0.2049 | 0.0172 |\n| Sample Size = 181 | | |\n\n报告了两个 Somers’ 统计量：C|R\
  \ 使用列变量作为预测因子，行变量作为金标准，而 R|C 使用行变量作为预测因子，列变量作为金标准。这里相关的统计量是 R|C，报告为 0.7426，标准误差为\
  \ 0.0523。如果表是这样构造的，即标记物（SUV）是列变量，金标准是行变量，那么我们将使用 Somers’ D C|R 统计量。\n\n\n\n\n\n\
  使用以下关系\n\n```\n$$AUC = \\frac{D + 1}{2}$$\n```\n\n可以计算出曲线下面积为 0.8713，与 LOGISTIC\
  \ 输出相同，后者报告了三位有效数字。同样使用关系\n\n```\n$$se(AUC) = \\frac{se(D)}{2}$$\n```\n\nAUC 的标准误差计算为\
  \ 0.026。可以使用渐近正态理论为 AUC 计算置信区间\n\n```\n$$AUC + 1.96 * se(AUC)$$\n```\n\n结果为 (0.8203,\
  \ 0.9222)。这比 PROC LOGISTIC 提供的分析更完整，因为你可以判断抽样变异对 AUC 估计的影响。\n\n### 3.4.3 The %ROC\
  \ Macro\n\n虽然 PROC FREQ 对于计算曲线下面积及其标准误差而言对我们的目的已足够，但现在是介绍一个 SAS 宏的好时机，该宏主要用于比较几条\
  \ ROC 曲线的下面积；不过它也可以将单条 ROC 曲线作为特例来处理。%ROC 宏目前为第 1.5 版，可在以下 URL 下载：\n\nsupport.sas.com/samples_app/00/sample00520_6_roc.sas.txt\n\
  \n以下是可用于此示例的代码：\n\n```\n%roc(data=HeadNeck,var=SUV,response=gold,contrast=1,details=no,\n\
  \    alpha=.05);\n```\n\n用于调用 %ROC 的宏变量有\n\n- Response：这是金标准，或结局。你需要创建一个数据集变量，其取值仅为\
  \ 0 或 1；宏无法对观察到的二分类重新编码。该变量必须是数值型；仅有两个不同值（0 和 1）的字符变量会通过宏的错误检查设施，但会产生 PROC IML 错误，这很难调试。\n\
  - Var 指定标记。\n- Contrast 主要用于比较几条曲线，如我们在后面章节中会看到的。对于单条 ROC 曲线，Contrast 的值始终为 1。\n\
  - Alpha 与置信限估计有关。\n- Details 控制打印输出的多少。\n\nOutput 3.3 显示了此调用的结果。曲线下面积为 87.13%，与\
  \ PROC LOGISTIC 的一致性相同，也与 PROC FREQ 中 Somers’ D 导出的一致。标准误差也与 PROC FREQ 中 Somers’\
  \ D 导出标准误差相同。置信区间也相匹配，至多存在舍入误差。\n\n## Output 3.3\n\n```\nThe ROC Macro\n\n     \
  \   ROC Curve Areas and 95%\n            Confidence Intervals\n        ROC Area\
  \ Std Error Confidence Limits\nSUV     0.8713    0.0263    0.8198    0.9228\n```\n\
  \n经常使用 ROC 曲线的用户应该熟悉这个宏。另一方面，如果你只是偶尔需要 AUC 估计及其标准误差，那么使用 PROC FREQ 可能更容易。\n\n##\
  \ 3.5 Selecting an Optimal Threshold\n\n在某些情况下，虽然原始预测是连续的，但报告二元预测是有意义的。回顾本章开头使用的降雨预测示例。假设你有一个模型可提供某一天降水概率的预测概率。除了这个预测概率之外，你可能还想显示一个描绘降雨的图标，以更简单的形式传达预测。我们大多数人都见过电视或报纸天气预报中的此类图标。通过包含此图标，我们本质上是基于连续预测因子（降雨预测概率）报告二元预测（降雨/无降雨）。这相当于选择一个阈值，这本身相当于在\
  \ ROC 曲线上选择一个工作点。\n\n有时外部标准可能会指导工作点的选择。在没有此类标准的情况下，你可能会选择在某种意义上最优的阈值。有两种广泛使用的方法：\n\
  \n- 1. 选择使 resulting 二元预测尽可能接近完美预测因子的阈值。\n- 2. 选择使 resulting 二元预测尽可能远离无信息预测因子的阈值。\n\
  \n为了更好地理解这些方法，请记住完美预测因子在其 ROC 曲线上只有一个点（即单位正方形的左上角），灵敏度为 100%，特异性为 100%。同样，无信息标记的\
  \ ROC 曲线沿单位正方形的对角线。ROC 曲线上某点与这些参考点之间的距离使用所谓的欧几里得方法来衡量。坐标为 (x₁, y₁) 和 (x₂, y₂) 的点\
  \ A 和 B 之间的欧几里得距离如下给出：\n\n```\nd_AB = √(x₁ − x₂)² + (y₁ − y₂)²\n```\n\n为了说明这一点，经验\
  \ ROC 曲线在图 3.5 中再次绘制，其中包含两个候选最优工作点 A 和 B。R 表示选择最优阈值的第一种方法的参考点。同样，P 和 Q 表示第二种方法的参考点。根据第一个定义，你需要计算线段\
  \ RA 和 RB 的长度，如果 RA 比 RB 短，则偏好 A。同样，如果采用第二种阈值选择方法，则需要比较 AP 和 BQ 的长度，如果 AP 比 BQ 长，则偏好\
  \ A。\n\n## Figure 3.5 Choosing the Optimal Threshold Using the Empirical ROC Curve\n\
  \n![](img/ac26020abd4f22abfaafc0607939c6e4_36_0.png)\n\n%PLOTROC 宏的 OPTIMAL 选项会生成一个名为\
  \ _OPTIMAL_ 的数据集，该数据集为每个阈值计算这里解释的两个距离。这两个变量称为 DIST_TO_PERFECT 和 DIST_TO_NONINF，可用于在\
  \ ROC 曲线上选择最优工作点。\n\n方法选择主要由应用领域决定。在医学诊断的背景下，最优通常意味着接近理想，而在工程背景下通常意味着远离随机。事实上，这里考虑的垂直距离度量等于\
  \ Youden’s index，这是一种在质量控制中流行的准确性汇总度量，尽管它最初是在医学背景下引入的（Youden, 1950）。\n\n不幸的是，两种最优性标准会产生不同的最优工作点。这由\
  \ Perkins 和 Schisterman（2006）从分析上证明。大多数时候，两者足够接近，可以消除对方法选择的任何担忧。\n\n## 3.6 The Binormal\
  \ ROC Curve\n\n到目前为止，我们的重点一直放在经验曲线上，即通过连接观察到的（灵敏度，1-特异性）对得到的曲线。经验曲线被广泛使用，因为它易于生成，并且对标记分布的变化具有鲁棒性（在秩的基础上）。但有时你可能更喜欢平滑曲线。平滑\
  \ ROC 曲线的最常见方法是使用双正态模型。\n\n双正态模型假设标记（或单调变换）在金标准类别内的分布为正态分布。对于 PET 数据集示例，我们可以假设癌症患者的\
  \ SUV 服从正态分布，均值为 μ₁，方差为 σ₁²，而无癌症患者的 SUV 服从正态分布，均值为 μ₀，方差为 σ₀²。然后，使用经验 ROC 曲线的记号\n\
  \n```\nF(t) = Φ( (μ₀ - t) / σ₀ )\n```\n\n阈值 t 可以写成 x 的函数如下：\n\n```\nt = μ₀ - σ₀\
  \ Φ⁻¹(x)\n```\n\n由于阈值 t 对应于灵敏度 F(t)，我们可以写出 ROC 曲线的函数形式如下：\n\n```\nG(t) = Φ( (μ₁\
  \ - t) / σ₁ ) = Φ( (μ₁ - μ₀ + σ₀ Φ⁻¹(x)) / σ₁ ) = Φ( a + b Φ⁻¹(x) )\n```\n\n其中\n\
  \n```\na = (μ₁ - μ₀) / σ₁ ,   b = σ₀ / σ₁\n```\n\n这两个参数 a 和 b 通常被称为双正态参数。有时它们被称为截距和斜率，因为在正态概率纸上绘制双正态曲线会得到截距为\
  \ a、斜率为 b 的直线。这种做法现在并不常见，但命名法仍然沿用。\n\n如果标记值不是正态分布的，但在单调变换后可以是正态分布，则双正态 ROC 曲线拟合到变换后的值。尽管如此，拟合到变换后值的双正态曲线仍被认为是对未变换标记的\
  \ ROC 曲线，因为标记的真实 ROC 曲线在单调变换下是不变的，如第 3.3 节所示。因此，存在单调标准化变换就足以证明使用双正态方法。\n\n一方面，这是一个相对较弱的要求，表明大多数预测因子都可以被认为是双正态的。另一方面，确定\
  \ h 的函数形式本身可能是一项艰巨的任务。请注意，相同的 h(.) 必须将标记对金标准阳性和阴性患者都变换为正态。这个过程可能具有挑战性，并在下一节中讨论。\n\
  \n双正态模型的曲线下面积也有闭式表达式：\n\n```\nAUC = Φ( a / √(1 + b²) )\n```\n\n双正态模型的估计需要估计 a 和\
  \ b，这反过来需要分别在每个结局组中估计均值和方差。这只需使用带 CLASS 语句的 PROC MEANS 即可完成。但使用 PROC NLMIXED 有许多优点，下面的示例演示了这一点。如果你不熟悉\
  \ PROC NLMIXED，SAS/STAT 家族中的相对新成员，请参阅附录，了解其相关功能的介绍。\n\n\n\n\n\n```\nproc nlmixed\
  \ data=HeadNeck;\n    parameters m1=0 m0=0 s1=1 s0=1;\n    if gold=1 then m=m1;else\
  \ if gold=0 then m=m0;\n    if gold=1 then s=s1**2;else if gold=0 then s=s0**2;\n\
  \    a=(m1-m0)/s1;\n    b=s0/s1;\n    model suv ~ normal(m,s);\n    estimate 'a'\
  \ a;\n    estimate 'b' b;\n    estimate 'AUC' probnorm(a/sqrt(1+b**2)));\nrun;\n\
  ```\n\n要将此代码用于您的数据集，请用金标准和标记的变量名替换变量 Gold 和 SUV。执行此操作后，NLMIXED 输出的相关部分显示在输出 3.4\
  \ 的 Additional Estimates 下。\n\n## Output 3.4\n\n| Additional Estimates |\n| Label\
  \ | Estimate | Standard Error | DF | t Value | Pr > |t| | Alpha | Lower | Upper\
  \ |\n| a | 1.4086 | 0.1830 | 181 | 7.70 | <.0001 | 0.05 | 1.0476 | 1.7696 |\n| b\
  \ | 0.6597 | 0.07196 | 181 | 9.17 | <.0001 | 0.05 | 0.5177 | 0.8017 |\n| AUC | 0.8802\
  \ | 0.02727 | 181 | 32.27 | <.0001 | 0.05 | 0.8263 | 0.9340 |\n\n可以看到，二元正态参数 a 和\
  \ b 的估计值分别为 1.4086 和 0.6597。相应的 ROC 曲线由 Φ(1.41 + 0.66 Φ⁻¹(x)) 表示，其中 x 的取值范围为 0 到\
  \ 1。ROC 曲线在 0 到 1 之间所有点都有定义，这是该模型的一个特征。虽然并非所有阈值都被观察到，但二元正态模型进行插值并为一特异性所有可能取值提供灵敏度值。\n\
  \n得到的 AUC 为 0.8802，标准误差为 0.02727。您可以使用标准渐近法形成 95% 置信区间：AUC±1.96*se(AUC)，结果为 (0.826,\
  \ 0.934)。表 3.3 比较了二元正态模型与经验分析的结果。AUC 估计值和置信区间都非常接近。\n\n## Table 3.3 Comparison of\
  \ AUC Estimates from the Empirical and Binormal ROC Curves\n\n| Method | AUC | SE\
  \ | Confidence Interval |\n| Empirical | 0.8713 | 0.0263 | 0.820–0.923 |\n| Binormal\
  \ | 0.8802 | 0.0273 | 0.826–0.934 |\n\n从 ROC 曲线分析的角度来看，ESTIMATE 语句是 PROC NLMIXED\
  \ 的一个重要优势，因为它允许您直接获得 a、b 和 AUC 的估计值，以及更重要的是其标准误差。另一个优势将在后续章节中变得明显，即它足够灵活，可以容纳几种不同类型的\
  \ ROC 曲线。\n\n下面是使用 PET 数据集示例对经验曲线（实线）和二元正态曲线（虚线）进行的图形比较。早期，二元正态 ROC 曲线高于经验曲线，表明灵敏度相对于经验值被高估。后来，两条曲线相交，二元正态曲线开始低估灵敏度。大多数情况下，两条曲线之间的差异小于\
  \ 10%。对于大多数用途而言，这可以被认为是一个拟合合理的二元正态 ROC 曲线。图 3.6 显示了两条不同曲线的比较图。\n\n## Figure 3.6\
  \ Comparison of Empirical and Binormal ROC Curves\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_39_0.png)\n\
  \n图 3.6 由以下 SAS 语句生成。关键思想在于 DATA 步，其中 PROC LOGISTIC 中 OUTROC= 选项产生的数据集（此处称为 ROCData）从二元正态模型生成灵敏度。ROCData\
  \ 已包含经验曲线的灵敏度和一特异性对。另一个变量，此处称为 _BSENSIT_，使用二元正态模型的功能形式以及用 PROC NLMIXED 估计的参数（前面已描述）添加。然后将\
  \ _BSENSIT_ 和 _SENSIT_ 对 _1MSPEC_ 进行绘图，并在同一张图上叠加。实线为经验曲线（_SENSIT_），虚线为二元正态曲线（_BSENSIT_）。\n\
  \n```\ndata ROCData;\n    set ROCData;\n    _bsensit_=probnorm(1.41+0.66*probit(_1mspec_));\n\
  run;\n```\n\n```\naxis1 length=12cm order=0 to 1 by 0.2 label=(f=swissb h=2)\n \
