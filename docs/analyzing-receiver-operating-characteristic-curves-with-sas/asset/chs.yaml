  \n## 5.1 引言\n\n第 3 章讨论了单一连续预测因子，这可能是 ROC 曲线最自然、最常见的设定。尽管如此，ROC 曲线的思想同样适用于有序预测因子。本章研究如何将前一章的技术扩展以适应有序预测因子。\n\
  \n有序预测因子可以通过多种方式产生。有时，它们只是底层连续预测因子分类的结果。虽然这可能导致信息损失，从而降低预测准确性，但拥有简单且易于传达的预测因子的收益可能抵消这些损失。降雨预报可能提供一个例子。有时它们报告为低-中-高，其他时候则以\
  \ 10% 的增量报告。无论使用何种术语报告分类预测因子，数据分析都可以使用预测因子作为有序变量进行。\n\n有序预测也可能通过专家意见产生。大多数主观意见难以量化，但提供按其概率排序的几个情景相对容易——实际上是报告有序预测。例子可以在几乎任何领域找到，例如医学（诊断放射科医生报告其对疾病机会或严重程度的评估）、商业（顾问对消费者偏好可能性的看法）或金融（股票选择，报告为买入、持有或卖出）。\n\
  \n\n\n\n\n从 ROC 曲线的角度来看，连续预测因子和有序预测因子之间存在二元性。经验曲线和双正态模型都可以容纳有序预测因子，要么直接使用，要么经过一些修改。第\
  \ 5.3 节和第 5.4 节提供了详细信息。\n\n## 5.2 信用评级示例\n\n考虑以下由 Güttler（2005）收集并发表的数据集，该数据集涉及世界上两家最著名的信用评估机构——穆迪和标准普尔的评分系统表现。表\
  \ 5.1 报告了穆迪评级的数据，穆迪评级使用 17 个有序等级，从 Aaa（最有利评级）到 C（最不利评级）。Rating 行列出了这 17 个评级，Default\
  \ 行包含研究随访期间违约的公司数量，而 Total 行则列出了同一时期获得特定信用评级的公司总数。本例的目的是评估穆迪评级作为违约可能性预测因子的准确性。对于从\
  \ Aaa 到 C 的 17 个评级中的每一个，都提供了样本中的总数以及该总数中违约的数量。\n\n### 表 5.1 穆迪评级\n\n| Rating | Aaa\
  \ | Aa1 | Aa2 | A1 | A2 | A3 | A3- | Baa1 | Baa2 |\n| Default | 0 | 0 | 0 | 0 |\
  \ 0 | 1 | 0 | 1 | 0 |\n| Total | 49 | 47 | 120 | 164 | 163 | 254 | 226 | 238 | 242\
  \ |\n| Rating | Baa3 | Ba1 | Ba2 | Ba3 | B1 | B2 | B3 | C |  |\n| Default | 1 |\
  \ 1 | 1 | 2 | 8 | 15 | 13 | 55 |  |\n| Total | 212 | 105 | 108 | 175 | 238 | 215\
  \ | 139 | 164 |  |\n\n请注意，表 5.1 包含了所有数据。对于有序预测因子，你可以用近 3,000 个观测值完整地展示一个数据集，因为空间需求更多取决于类别的数量，而非实际样本量。这与连续数据形成对比，连续数据的原始数据通常由于空间限制而未被报告。\n\
  \n## 5.3 有序预测因子的经验 ROC 曲线\n\n有序预测因子的经验 ROC 曲线建立在与连续预测因子的经验 ROC 曲线相同的原理上。事实上，由于经验\
  \ ROC 曲线仅基于数据的秩，因此预测因子是有序还是连续的，对 ROC 曲线的构建方式没有影响。因此，第 3 章的方法可用于构建和比较具有有序预测因子的经验\
  \ ROC 曲线。\n\n简要回顾一下，使用有序预测因子的每个不同观测值作为可能阈值，你可以计算由此产生的二元预测因子的敏感性和特异性。对每个阈值绘制敏感性与\
  \ 1 减去特异性的散点图就构成了 ROC 点。请注意，以下代码与第 3 章中用于连续预测因子的程序完全相同：\n\n```\nproc logistic data=moody;\n\
  \    model default=moody / outroc=rocdata;\nrun;\n\naxis1 length=12cm order=0 to\
  \ 1 by 0.2 label=(f=swissb h=2)\nvalue=(font=swissb h=2) offset=(.5 .5)cm;\naxis2\
  \ length=12cm order=0 to 1 by 0.2 label=(a=90 f=swissb h=2)\nvalue=(font=swissb\
  \ h=2) offset=(.5 .5)cm;\n\nsymbol1 v=none i=join c=black;\n\nproc gplot data=rocdata;\n\
  \    plot _sensit_*_1mspec_ / haxis=axis1 vaxis=axis2;\nrun;\nquit;\n```\n\n###\
  \ 图 5.1 穆迪评级数据的 ROC 点\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_65_0.png)\n\n\
  图 5.1 包含使用 PROC LOGISTIC 获得的穆迪评级的 ROC 点。请注意，对于此工作，变量 moody 必须是数值型。另请注意 AXIS 语句的\
  \ OFFSET= 选项的使用，用于在两个轴的两侧打印一些空白以改善显示效果。另请注意，没有一家获得前五个评级（AAA 至 A2）的公司违约，因此这五个评级都由右上角的同一点表示（100%\
  \ 敏感性和 100% 特异性）。\n\n特意使用术语 ROC 点。图 5.1 没有 ROC 曲线，只有每一点都是穆迪评级的可行操作点。可以连接这些点，就像我们对连续预测因子所做的那样，最终得到\
  \ ROC 曲线。你可以争辩说，由于有序预测因子的定义，未观察到的中间阈值是不可能的，因此由此产生的曲线没有意义。想象一下在图 5.1 中连接这些点。穆迪评分在\
  \ B2 和 C 之间没有分数，因此图中连接两个最左点线段上的点代表不存在的阈值的操作特征（即敏感性和特异性）。反驳意见认为，大多数有序量表的等级是任意定义的，可以更改。如果有序预测是通过对连续预测因子进行分类获得的，那么就可以明确地重新审视阈值。在主观意见的情况下，可以要求专家通过使用更多等级的量表来完善他们的预测。在我们的例子中，穆迪可能会在检查图\
  \ 5.1 后决定 Aa1 和 Aa2 之间（从右数第二个和第三个点）的差距太宽。这可以通过在这两个之间引入新的阈值来解决。\n\n连接点还有一个实际后果：它使得可以明确地定义有序预测因子的曲线下面积。因此，我建议对有序预测因子使用\
  \ ROC 曲线而不是 ROC 点。\n\n## 5.4 经验 ROC 曲线下面积\n\n经验 ROC 曲线下面积的计算使用梯形法则，与对连续标记的处理方式相同。%ROC\
  \ 宏可用于此目的，因为经验 ROC 曲线及其下面积是基于秩的函数。宏调用与第 3 章中使用的完全相同：\n\n```\n%roc(data=moody,var=moody,response=def,contrast=1);\n\
  ```\n\n熟悉的 %ROC 输出（见输出 5.1）显示 AUC 为 0.915，95% 置信区间范围为 0.891 至 0.940。\n\n### 输出 5.1\n\
  \n```\nThe ROC Macro\n\nROC Curve Areas and 95%\nConfidence Intervals\nROC Area\
  \ Std Error Confidence Limits\nmoody 0.9153 0.0124 0.8909 0.9397\n```\n\n与使用 %ROC\
  \ 宏类似，你可以使用 %BOOT1AUC 宏来计算曲线下面积的基于自助法的估计值和标准误差。输出 5.2 显示了自助法的结果，与 %ROC 宏产生的结果相似。\n\
  \n### 输出 5.2\n\n```\nBootstrap Analysis of the AUC for moody\n\n    AUC    StdErr\n\
  \    -----------\n0.913584  0.012242\n\n95% Confidence Interval\n\n    LowerLimit\
  \    UpperLimit\n    -----------\n    0.888271      0.935495\n```\n\n## 5.5 潜变量模型\n\
  \n与连续预测因子一样，经验 ROC 曲线假设最少，但不易扩展以进行协变量调整。在第 3 章中，我们开发了双正态模型，并在第 4 章中演示了其在协变量调整中的应用。\n\
  \n也可以为有序预测因子开发双正态模型。想象一下，你从一个连续预测因子开始，但决定对其进行分类并仅报告有序预测因子，例如无、低、中和高（就像某些降雨预报那样）。预报的消费者只能观察到有序值。尽管这些连续预测，即潜变量，仍然未被观察到，但在每个有序值处的敏感性和特异性代表了潜变量的\
  \ ROC 曲线上的点。基本思想在图 5.2 中给出。\n\n### 图 5.2 有序预测因子的三个 ROC 点\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_68_0.png)\n\
  \n图的上部水平线代表潜变量的连续体。潜变量轴上的三个哈希标记表示与观察到的有序预测因子相对应的阈值。下部的实线是潜变量的 ROC 曲线，曲线上的哈希标记是 ROC\
  \ 点。重要的是，有序变量的 ROC 点位于潜变量的 ROC 曲线上。\n\n现在查看图 5.3，其中仅包含 ROC 点。在不知道或假设潜变量的某些特征的情况下，你无法仅使用\
  \ ROC 点来估计潜变量的 ROC 曲线。连接这些点不太可能代表潜变量的真实 ROC 曲线，因为真实的 ROC 曲线更可能是平滑的。你需要使用有关潜变量的信息在\
  \ ROC 点之间进行插值。当然，潜变量是不可观察的，因此你只能做出假设。\n\n\n\n\n\n## 图 5.3 图 5.2 中同一序数预测变量的 ROC 点\n\
  \n![](img/ac26020abd4f22abfaafc0607939c6e4_69_0.png)\n\n最常见的假设是潜变量服从正态分布。这就产生了所谓的*潜二元正态模型*。目前，我们将潜二元正态模型与第\
  \ 3 章中的模型区分开来。潜二元正态模型假设当 D=1 时，潜变量服从均值为 μ₁、方差为 σ₁² 的正态分布；当 D=0 时，服从均值为 μ₀、方差为 σ₀²\
  \ 的正态分布。利用序数标记的观测频率（如表 5.1 中的）无法同时估计 μ₀、σ₀²、μ₁ 和 σ₁²。这四个参数存在多组（事实上无限多）组合可以产生相同的观测数据，且无法区分它们。然而，如果我们通过固定\
  \ μ₀ 和 σ₀² 来锚定其中一个正态分布，则可以估计 μ₁ 和 σ₁²。为简化起见，假设我们选择 μ₀=0 σ₀²=1 并得到 μ₁ 和 σ₁² 的估计值，记为\
  \ μ̂ 和 σ̂²。若我们设 μ₀=m σ₀²=s，则 μ₁ 和 σ₁² 的估计值将变为 μ̂ + m 和 s σ̂²。这可以证明，因为正态分布是所谓的*位置-尺度族*的成员。其含义是，在不失一般性的情况下，我们始终可以使用标准正态作为锚点，并将由此得到的估计值视为两个均值的差和两个方差的比。\n\
  \n这些考虑导致了 ROC 曲线专用序数回归模型的开发，最初由 Tosteson 和 Begg（1988）提出。在该模型中，D 是金标准的指示变量，即 D=0\
  \ 或 D=1。潜变量 X 服从均值为 αD、方差为 e^{2βD} 的正态分布。这相当于假设 D=0 时为标准正态，而 D=1 时可能为不同的正态密度。因此，X\
  \ 的这种表示与前面描述的潜二元正态模型一致。\n\n假设 $R$ 是具有 $k$ 个水平的序数预测变量，由对 $X$ 应用阈值 $\\theta_1...,\
  \ \\theta_k$ 产生。则 $R$ 等于 $k$ 的概率由下式给出：\n\n$P(R=k)=P(\\theta_{k-1}<X\\le\\theta_k)$\n\
  $=\\Phi\\left(\\frac{\\theta_k-\\alpha D}{e^{\\beta D}}\\right)-\\Phi\\left(\\frac{\\\
  theta_{k-1}-\\alpha D}{e^{\\beta D}}\\right)$\n\n我们在第 3 章中看到 ROC 曲线与累积分布密切相关。因此，使用\
  \ $\\gamma_k(D)=P(R\\le k)$ 而不是 $P(R=k)$ 得到以下 probit 回归模型：\n\n$\\gamma_k(D)=\\Phi\\\
  left(\\frac{\\theta_k-\\alpha D}{e^{\\beta D}}\\right)$\n\n注意 $1-\\gamma_k(D)$ 是标记超过阈值的概率，因而预测\
  \ D=1。这代表 D=1 时的灵敏度，以及 D=0 时的 1 减特异度。因此，对所有 $k$ 作出 $1-\\gamma_k(0)$ 与 $1-\\gamma_k(1)$\
  \ 的图即得到潜变量的 ROC 曲线。由此得到的平滑曲线，类似于连续预测变量的情况，为\n\n$y=\\Phi\\left(\\alpha+e^{-\\beta}\\\
  Phi^{-1}(x)\\right)$\n\n其中 $x$ 为 1 减特异度，$y$ 为灵敏度。在该模型下，曲线下面积为\n\n$A=\\Phi\\left(\\\
  frac{\\alpha}{\\sqrt{1+e^{-2\\beta}}}\\right)$\n\n设 $a=\\alpha$ 且 $b=e^{-\\beta}$，你可以看到\
  \ AUC 的公式等价于单个连续预测变量的情况。这并不令人惊讶，因为我们在第 5.2 节和第 5.3 节中持续观察到连续预测变量与序数预测变量之间存在强烈的对偶性。\n\
  \n我们将此称为*序数-probit 回归模型*。其他序数回归模型可以通过假设潜变量服从不同的分布而得到，在这种情况下，推导中的 probit 链接将被所选分布的累积分布函数所取代。实际上，在潜模型设定中，使用其他分布的情况非常罕见。\n\
  \n熟悉 LOGISTIC、GENMOD 和 PROBIT 过程功能的人可能会错误地得出结论，这些过程可以作为序数预测变量分析的主要工具。事实上，这三个过程不足以容纳参数\
  \ $\\beta$。只有在你愿意预先将 $\\beta$ 固定为 1 仅估计 $\\alpha$ 时才使用它们。这些过程被开发用于估计一类称为*广义线性模型*的模型，而这里定义的序数-probit\
  \ 回归模型当且仅当 $\\beta$=1 时才属于该族。因此，要以前面所述的完全一般性拟合序数 probit 模型，你需要使用 PROC NLMIXED 的功能。\n\
  \n我们将以穆迪的数据为例。注意，前五个类别（Aaa 至 A2）没有观察到的违约，因此灵敏度和特异度相同。用本章的语言来说，γ_k(0) 和 γ_k(1) 对\
  \ k=1,…,5 相同。因此，我们无法估计任何四个阈值（θ_1、θ_2、θ_3、θ_4），因为在假设的潜变量分布中从 −∞ 到 θ_5 之间的任意点都与我们的数据一致。为了使序数回归能够处理所有模型参数，我们需要合并一些类别。表\
  \ 5.2 中的合并是为本次分析选择的。\n\n## 表 5.2 穆迪评级数据的合并版本\n\n| Rating | A | Baa | Ba | B | C\
  \ |\n|---|---|---|---|---|---|\n| Default | 1 | 2 | 4 | 36 | 55 |\n| Total | 1023\
  \ | 692 | 388 | 592 | 164 |\n\n在合并版本中，A 代表 Aaa 至 A3-，Baa 代表 Baa1 至 Baa3，Ba 代表 Ba1\
  \ 至 Ba3，B 代表 B1 至 B3。C 未与其他类别合并。\n\n在继续拟合该模型之前，重要的是要强调潜变量是不可观测的，因此只能估计阈值的相对位置。换句话说，具有不同绝对值但相对位置相同（即它们之间的距离相同）的两组阈值将具有相同的似然。因此我们需要任意固定其中一个阈值，以便估计其他阈值。以下\
  \ PROC NLMIXED 代码假设第一个阈值为 0 并将前述序数-probit 回归模型拟合到合并版本的信用评级数据。\n\n```\nproc nlmixed\
  \ data=moody gconv=0;\n  parms alpha=1 theta1=1 theta2=2 theta3=3 beta=1;\n  bounds\
  \ theta1>0, theta2>0, theta3>0;\n  eta1=alpha*default;\n  eta2=exp(beta*default);\n\
  \    if rating=1 then z = probnorm(-eta1/eta2);\n  else if rating=2 then z = probnorm((theta1-eta1)/eta2)\n\
  \                        probnorm(-eta1/eta2);\n  else if rating=3 then z = probnorm((theta2+theta1-eta1)/eta2)\n\
  \                        - probnorm((theta1-eta1)/eta2);\n  else if rating=4 then\
  \ z = probnorm((theta3+theta2+theta1-eta1)/eta2)\n                        - probnorm((theta2+theta1-eta1)/eta2);\n\
  \  else if rating=5 then z = 1 - probnorm((theta3+theta2+theta1-eta1)/eta2);\n \
  \ if z>1e-6 then ll=log(z);\n  else ll=-1e6;\n  model rating ~ general(ll);\n  estimate\
  \ 'AUC' probnorm(alpha/sqrt(1+beta**2));\nrun;\n```\n\n如果不熟悉语法或输出，附录中关于 PROC NLMIXED\
  \ 的简短介绍可能会有所帮助。输出 5.3 显示了结果。\n\n## 输出 5.3\n\nParameter Estimates\nParameter Estimate\
  \ Standard Error DF t Value Pr > |t| Alpha Lower Upper\nalpha 1.9898 0.1157 2859\
  \ 17.21 <.0001 0.05 1.7631 2.2166\ntheta1 0.5192 0.01679 2859 30.92 <.0001 0.05\
  \ 0.4863 0.5521\ntheta2 0.3533 0.01667 2859 21.19 <.0001 0.05 0.3206 0.3860\ntheta3\
  \ 0.9907 0.03948 2859 25.10 <.0001 0.05 0.9133 1.0681\nbeta -0.2368 0.1336 2859\
  \ -1.77 0.0764 0.05 -0.4987 0.02517\n\nParameter Estimates\nParameter Gradient\n\
  alpha 9.587E-7\ntheta1 0.000012\ntheta2 -2.58E-6\ntheta3 -3.04E-6\nbeta -8.23E-6\n\
  \nAdditional Estimates\nLabel Estimate Standard Error DF t Value Pr > |t| Alpha\
  \ Lower Upper\nAUC 0.9736 0.009248 2859 105.27 <.0001 0.05 0.9555 0.9917\n\n只要模型拟合过程收敛，迭代历史和梯度对我们来说就没用。最相关的模型参数估计值可在参数估计输出部分找到，其中\
  \ α̂ = 1.99 且 β̂ = −0.24。如第 3 章所述，ESTIMATE 语句是 PROC NLMIXED 的一个特别方便的功能；它可以计算模型参数任何一对一函数的估计值及其标准误。利用此功能，我们估计\
  \ AUC 为 97%，标准误为 0.9%，95% 置信区间为 95.6% 至 99.2%。从各方面来看，穆迪的评级都是违约的优秀预测因子。\n\n虽然没有直接用处，但该模型也估计了三个阈值。它们估计值（在参数估计部分标记为\
  \ theta1、theta2 和 theta3）为 0、0.5192、0.5192+0.3533=0.8725 和 0.8725+0.9907=1.8632。记住潜变量对\
  \ D=0 为标准正态，对 D=1 为均值 1.99（α̂）且方差 0.62（e^{2β̂}）的正态分布，我们可以精确计算序数预测变量每个水平的预期比例。\n\n\
  或者，我们可以通过简单地代入 α 和 β 的估计值来计算 AUC 的估计值，但标准误的计算需要使用泰勒近似进行一些分析推导。\n\n所得 ROC 点以图 5.4\
  \ 中的黑色点给出，并叠加了二元正态模型的平滑线。拟合在高阈值（低灵敏度）时非常好，但在较高阈值时与经验曲线存在一些偏差。\n\n\n\n\n\n### 图 5.4\
  \ 潜变量双正态模型隐含的 ROC 曲线\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_73_0.png)\n\n##\
  \ 5.6 有序标记 ROC 曲线的比较\n\n比较有序 ROC 曲线可以基于经验曲线或潜变量双正态模型。%ROC 宏可用于比较两条经验 ROC 曲线下的面积。或者，潜变量双正态模型可用于比较两个潜变量双正态曲线的参数。\n\
  \n### 5.6.1 转移性结直肠癌示例\n\n结肠和直肠中的一些肿瘤会扩散到肝脏，在这种情况下称为转移性结直肠癌。如果扩散仅限于肝脏，则可以手术切除。但如果存在其他转移部位，则肝脏手术不合适。因此，所有接受肝脏手术的转移性结直肠癌患者都会被仔细筛查肝外肿瘤。本节中的示例比较了两种不同的肝外成像方法：计算机断层扫描（CT）和正电子发射断层扫描（PET）。每位患者都接受了两种扫描，每张图像均由放射科医生使用三点量表进行评估：阳性（癌症存在）、可疑和阴性（癌症不存在）。\n\
  \n### 5.6.2 比较经验 ROC 曲线下的面积\n\n正如使用 %ROC 宏可以构建有序预测变量的经验曲线一样，也可以使用该宏比较多条经验 ROC 曲线下的面积。以下对\
  \ %ROC 宏的调用可生成所需的比较：\n\n```\n%roc(version,data=modif,var=pet ct,response=surg,contrast=1\
  \ -1);\n```\n\n输出 5.4 显示了结果。\n\n### 输出 5.4\n\nROC 宏\n\nROC 曲线面积及 95% 置信区间\n\n| ROC\
  \ Area | Std Error | Confidence Limits |\n|---|---|---|\n| pet 0.6744 | 0.2349 |\
  \ 0.2141 1.1347 |\n| ct 0.5526 | 0.2162 | 0.1289 0.9763 |\n\n对比系数\npet ct\nRow1\
  \ 1 -1\n\n对比行检验及 95% 置信区间\nEstimate Std Error Confidence Limits Chi-square Pr >\
  \ ChiSq\n0.6744 0.2349 0.2141 1.1347 8.2461 0.0041\n0.5526 0.2162 0.1289 0.9763\
  \ 6.5346 0.0106\n\n对比检验结果\nChi-Square DF Pr > ChiSq\n11.6473 2 0.0030\n\n曲线下面积为\
  \ PET 的 0.6744，CT 的 0.5526，置信区间很宽，在一种情况下超过 1。根据定义，AUC 不能超过 1，因此上限 1.1347 是用于置信区间计算的渐近方法的不足之处。通常，置信区间可从下方截断至\
  \ 0，从上方截断至 1。经验 ROC 曲线下面积之差为 0.1218，且显著（p=0.003）。\n\n### 5.6.3 比较潜变量双正态 ROC 曲线下的面积\n\
  \n作为经验方法的替代，可以对 PET 和 CT 均假设潜变量双正态模型。此时，不难看出比较两个潜变量双正态曲线的步骤可借鉴第 3 章的双正态方法。关键思想是考虑一个具有二元疾病状态（癌症/无癌症）和二元指示变量（PET/CT）主效应及其交互作用的回归模型。这导致右侧与第\
  \ 4.9 节中考虑的模型相同。交互项系数的关键作用再次显现，代表两条 ROC 曲线之间的差异。随机项 u 代表由配对设计引起的两次检测之间的相关性。\n\n\
  以下代码中 α₃ 的 p 值可用于比较两个双正态曲线。变量 Test 是二元指示变量 CT/PET。\n\n```\nproc nlmixed gconv=0;\n\
  \  parms alpha1=1 alpha2=1 alpha3=1 theta2=3 beta=1 s=1;\n  bounds theta2>0;\n \
  \ eta1=alpha1*surg+alpha2*test+alpha3*surg*test+u;\n  eta2=exp(beta*surg);\n   \
  \ if result=1 then z = probnorm(-eta1/eta2);\n  else if result=3 then z = probnorm((theta2-eta1)/eta2)\
  \ - probnorm((theta2-eta1)/eta2);\n  else if result=5 then z = 1 - probnorm((theta2-eta1)/eta2);\n\
  \  if z>1e-6 then ll=log(z);\n    else ll=-1e6;\n  model result ~ general(ll);\n\
  \  random u ~ normal(0,s) subject=patient;\nrun;\n```\n\n有序标记的协变量调整可使用第 4 章中的相同表示，通过使用交互项来实现。转移性结直肠癌示例中没有感兴趣的协变量，但假设患者的年龄可能影响\
  \ CT 扫描的准确性。然后可使用以下对 PROC NLMIXED 的调用获得 CT 扫描的年龄调整 ROC 曲线：\n\n```\nproc nlmixed\
  \ gconv=0;\n  parms alpha1=1 alpha2=1 alpha3=1 theta2=3 beta=1 s=1;\n  bounds theta2>0;\n\
  \  eta1=alpha1*surg+alpha2*age+alpha3*surg*age;\n  eta2=exp(beta*surg);\n    if\
  \ result=1 then z = probnorm(-eta1/eta2);\n  else if result=3 then z = probnorm((theta2-eta1)/eta2)\
  \ - probnorm((theta2-eta1)/eta2);\n  else if result=5 then z = 1 - probnorm((theta2-eta1)/eta2);\n\
  \  if z>1e-6 then ll=log(z);\n    else ll=-1e6;\n  model result ~ general(ll);\n\
  run;\n```\n\n请注意此模型中随机效应 u 的缺失。正如我们在第 4 章中回顾的那样，标记比较与协变量调整之间的一个显著区别是，标记比较通常涉及配对数据（每位患者均由每个标记测量），而协变量调整不具有这一特征。\n"
- "## Lehmann ROC 曲线族\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_77_0.png)\n\n- 6.1\
  \ 引言 ........................................................................................\
  \ 67\n- 6.2 Lehmann 分布族 .............................................................\
  \ 67\n- 6.3 磁共振示例 ................................................................\
  \ 70\n- 6.4 协变量调整.........................................................................\
  \ 73\n- 6.5 使用估计方程处理聚类数据 ............................... 75\n- 6.6 使用 Lehmann ROC\
  \ 曲线族比较标记............. 79\n- 6.7 Lehmann ROC 曲线族的优点和缺点\nROC 曲线 ...............................................................................................\
  \ 80\n\n## 6.1 引言\n\n前五章涵盖了分析 ROC 曲线的传统方法。本章介绍了一种构建连续预测变量 ROC 曲线的不同方法。该方法具有三个重要优势，即\n\
  \n- 对应于具有非常简单函数形式的 ROC 曲线\n- 轻松与内置 SAS 过程配合使用\n- 便于对比较 ROC 曲线和协变量调整进行易于推广。\n\n##\
  \ 6.2 Lehmann 分布族\n\n在第 3 章中，我们根据金标准状态值的标记值条件累积分布函数的补集推导了 ROC 曲线的一般表示。如果 D=0,1 表示金标准，W\
  \ 为标记，则我们定义\n\nF(w) = P(W > w | D = 1)\nG(w) = P(W > w | D = 0)\n\n则 W 的 ROC 曲线由下式给出\n\
  \ny = F(G^{-1}(x))\n\n该结果普遍成立，对 F 和 G 没有特别限制。第 3 章使用该结果通过简单地将 F 和 G 替换为正态分布的相应累积密度来推导双正态模型的\
  \ ROC 曲线的函数形式。\n\n双正态族的替代方法是假设 F 和 G 彼此相关如下：\n\nG(w) = F(w)^{θ}\n\n由该方程定义的分布族称为\
  \ Lehmann 族。该族由 Lehmann 在其关于各种统计检验功效函数研究的开创性著作（Lehmann, 1953）中使用。因此，该分布族有时也被称为 Lehmann\
  \ 备择。\n\n必须认识到，该方程并不能唯一定义标记值的实际分布。它仅在彼此参照的情况下识别分布。因此，半参数一词常用于描述该族。指数分布属于 Lehmann\
  \ 族。具有共同尺度参数的 Weibull 分布也属于该族。另一方面，正态和对数正态分布不是 Lehmann 族的成员。\n\n前述方程意味着以下内容：\n\n\
  y = x^{θ}\n\n这是对应于 Lehmann 族的 ROC 曲线的函数形式。换句话说，如果标记值的条件分布通过 θ 以 Lehmann 族的方式相互关联，则\
  \ ROC 曲线将具有该方程中的简单幂形式。因此，如果你能从数据中估计 θ，则 ROC 曲线的估计值将立即可用。\n\nLehmann 族的一个重要优点是 θ\
  \ 的估计方法已得到广泛研究并已实现。为此，首先定义以下方程：\n\nh_F(w) = f(w) / F(w)\n\n其中 f 是对应于 F 的密度函数，h 通常称为风险函数，在生存分析中起着核心作用。如果\
  \ G = F^{θ}，则相应风险函数之间存在以下关系：\n\n\n\n\\(\\frac{h_F(w)}{h_G(w)} = \\theta\\)\n\n熟悉删失数据分析的统计学家会认识到这就是比例风险族。Lehmann族与比例风险族是相同的。Cox（1972，1975）在两篇关键论文中提出了偏似然的思想，并展示了如何用它来估计\
  \ θ。他的工作为 Cox（或比例风险）回归模型铺平了道路，而这些模型已成为建模删失数据的首要工具。SAS 中的 PHREG 过程实现了该方法，并为 Lehmann\
  \ 族的参数估计提供了便捷的途径。\n\n虽然熟悉比例风险模型和 PROC PHREG 有助于理解本章，但也可能导致混淆。因为比例风险模型几乎只用于删失数据，所以很容易错误地假设本章描述的是如何获得删失数据的\
  \ ROC 曲线。事实上，比例风险族和偏似然方法都不要求数据是删失的。本章中的数据集在结构上实际上与第 3 章和第 4 章中的数据集完全相同：连续标记和二元金标准。目标是提供对二元正态模型的替代方案，后者拥有完整的回归模型集合。\n\
  \n第 4 章中开发的二元正态模型的回归版本背后的原理是使用标记值作为因变量，金标准作为自变量纳入回归模型。我们在这里使用同样的思路。在比例风险回归的背景下，这意味着\n\
  \n\\(h_F(w; D) = h_G(w) \\exp\\{\\beta D\\}\\)\n\nPROC PHREG 会产生 β 的估计值及其标准误。我们可以用这些值得到\
  \ θ 的估计值及其标准误。记住 W 是标记，D 是二元结局。因此，如果 D=0，则 h_F=h_G；如果 D=1，则 h_F=h_G e^β。整理后得到以下方程：\n\
  \n\\(\\frac{h_F(w)}{h_G(w)} = e^{\\beta}\\)\n\n将此与 \\(\\frac{h_F(w)}{h_G(w)} = \\\
  theta\\) 比较可得：\n\n\\(\\hat{\\theta} = e^{\\beta}\\)\n\n你可以使用泰勒定理近似 \\(\\hat{\\theta}\\\
  ) 的方差如下：\n\n\\(V(\\hat{\\theta}) = \\hat{\\theta}^2 V(\\hat{\\beta})\\)\n\n\\(\\\
  hat{\\beta}\\) 和 \\(V(\\hat{\\beta})\\) 均可从 PROC PHREG 输出中获得。\n\n一旦 θ 被估计，ROC 曲线就完全确定，可以计算\
  \ AUC 等汇总指标。利用 Lehmann 族 ROC 曲线的函数形式，可以计算 AUC 的估计值为\n\nAŪC = ∫ x^θ dx = 1 / (1 +\
  \ θ̂)\n\n而 AUC 估计值的方差为\n\nV(AŪC) = V(θ̂) / (θ̂ + 1)^4\n\n所有所需分量再次可从 PROC PHREG 输出中获得。你还可以使用\
  \ x^θ 的标准误为 ROC 曲线形成点估计置信带：\n\nV(y(x)) = [x^θ̂ log x]^2 V(θ̂)\n\nGönen 和 Heller（2007）详细研究了\
  \ ROC 曲线的 Lehmann 族的使用。由 y = x^θ 给出的 ROC 曲线已在文献中被研究；例如参见 Hanley（1988）。它们使用 Lehmann\
  \ 族的推导以及使用 Cox 回归过程的实现已由 Gönen 和 Heller（2007）明确提出。\n\n## 6.3 磁共振示例\n\nZajick 等人（2005）报告了一项关于使用化学位移磁共振区分正常、良性和恶性椎体骨髓病变的研究。感兴趣的标记是同相和异相信号强度之间的百分比差异。该文章重点在于为正常椎体骨髓的信号强度变化建立一个值范围。在这里，我们用其数据实现不同目标：评估信号强度变化在区分正常和良性椎体骨髓病变方面的能力。\n\
  \n共对 75 名患者的 569 个正常椎体进行了评估，与 92 名患者的 215 个良性病变相比。图 6.1 展示了正常和良性椎体信号强度变化的并排直方图。该图由\
  \ UNIVARIATE 过程的 HISTOGRAM 语句生成。完整代码在第 3.1 节的正电子发射断层扫描示例中给出。从直方图可以明显看出两个分布存在一定重叠，表明该标记可能没有区分两类病变的能力。\n\
  \n### Figure 6.1 Histograms of the Change in Signal Intensity for Normal and Benign\
  \ Vertebrae\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_81_0.png)\n\n图 6.2 中的经验\
  \ ROC 点验证了这一怀疑，因为 ROC 曲线仅略高于参考线。图 6.2 由 LOGISTIC 过程 MODEL 语句中的 OUTROC 选项生成，使用与第\
  \ 3.2 节中类似的语句。\n\n### Figure 6.2 ROC Points for the Change in Signal Intensity for\
  \ Normal and Benign Vertebrae\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_81_1.png)\n\
  \n在第一次分析中，忽略患者为分析贡献多个椎体这一事实；这相当于将 569 个数据点视为来自不同受试者。要估计 θ，使用对 PROC PHREG 的以下调用：\n\
  \n```\nproc phreg data=tmp1.ph;\n    model signal=grp / rl;\n    if group='Normal'\
  \ then grp=0;\n    else if group='Benign' then grp=1;\nrun;\n```\n\nPROC PHREG 是\
  \ SAS/STAT 过程，允许编程语句。这些语句使你能够创建可在 MODEL 语句中使用的变量。在过程内部使用编程语句有助于避免在调用过程之前进行 DATA\
  \ 步编程。一个重要的缺点是创建的变量是临时的；因此，如果新变量在分析的其他地方需要，使用 DATA 步会更有效。\n\n在本例中，编程语句用于创建一个名为 GRP\
  \ 的新变量。由于 PROC PHREG 仅处理数值变量，因此该变量是必要的。RL 选项请求风险比的置信区间。记住 θ，即 Lehmann 族中唯一的參数，与风险比相同。\n\
  \nOutput 6.1 的相关部分如下：\n\n### Output 6.1\n\nAnalysis of Maximum Likelihood Estimates\n\
  Parameter DF Parameter Estimate Standard Error Chi-Square Pr > ChiSq Hazard Ratio\
  \ 95% Hazard Ratio Confidence Limits\ngrp 1 0.35541 0.08815 16.2559 <.0001 1.427\
  \ 1.200 1.696\n\n这里，θ 的估计值为 1/1.427=0.701。θ 是否大于或小于 1 取决于分组顺序。如果使用以下语句，结果将表明风险比小于\
  \ 1：\n\n```\nproc phreg data=tmp1.ph;\n    model signal=grp / rl;\n    if group='Normal'\
  \ then grp=1;\n    else if group='Benign' then grp=0;\nrun;\n```\n\n记住这里的风险是指 grp=1\
  \ 对应具有更高信号的几率。\n\nβ̂ 的标准误估计为 0.088，因为 θ̂ 的方差为 θ̂² Var(θ̂)=0.062。利用这些值，你可以绘制该数据集的\
  \ Lehmann 族 ROC，并附带 95% 点估计置信带（图 6.3）。\n\n### Figure 6.3 The ROC Points (Dots),\
  \ the Lehmann ROC Curve (Solid Line), and the 95% Confidence Intervals (Dashed Lines)\n\
  \n![](img/ac26020abd4f22abfaafc0607939c6e4_83_0.png)\n\n经验曲线的下面积计算为 0.597，标准误为 0.025（使用\
  \ %ROC 宏，细节省略），而 Lehmann ROC 曲线的下面积为 0.588，标准误为 0.030。后一对数值是使用第 9.1 节提供的解析关系计算的。经验估计与\
  \ Lehmann 估计的接近程度表明 Lehmann 模型对数据拟合良好。\n\n## 6.4 调整协变量\n\n正如我们在第 4 章中看到的，协变量可能会影响标记的准确性，ROC\
  \ 曲线可能需要相应调整。将第 5 章研究的回归模型扩展到 Cox 回归的背景下很容易，如下所示：\n\nh(V | D, U) = \\tilde{h}(v)\
  \ exp{β₁ D + β₂ U + β₃ D U}\n\n这为 Lehmann ROC 曲线提供了基于回归的协变量调整。这种构造在包含金标准 D 与协变量\
  \ U 之间的交互作用方面是相似的。为了了解协变量调整的 ROC 曲线的形式，考虑一个 D=1 的观测与一个 D=0 的观测的风险函数之比：\n\nh(V |\
  \ U, D = 1) / h(V | U, D = 0) = exp{β₁ + β₃ U}\n\n\n\n并且调整后 ROC 曲线的形式如下：\n\ny =\
  \ x^{θ(u)}\n\n其中\n\nθ(U) = β₁ + β₃U\n\n正如第 5 章所述，协变量的 ROC 曲线不受 β₂ 影响，但必须在模型中包含年龄的主效应；否则，β₃\
  \ 的估计值，即 ROC 曲线的关键组成部分，可能会有偏倚。\n\n继续以磁共振为例，年龄可能是这种类型的磁共振成像准确性的一个重要因素，该成像专注于组织中的水脂比。由于患者随着年龄增长自然会积累脂肪，该标记物在老年人中可能效果较差，存在将因年龄导致的脂肪误认为是良性病变导致的脂肪的可能性。\n\
  \n下面的 PHREG 调用提供了所需的估计值：\n\n```\nproc phreg data=tmp1.ph;\n    model signal=grp\
  \ age grpage/r1;\n    if group='normal' then grp=0;\n    else if group='benign'\
  \ then grp=1;\n    grpage=grp*age;\nrun;\n```\n\n再次注意编程语句的使用，不仅用于创建组变量，还用于创建交互项。输出\
  \ 6.2 包含来自 PHREG 过程的相关数字。三个参数估计为 β₁=1.29，β₂=-0.003，和 β₃=-0.014。年龄系数的负号表明准确性随年龄增加而下降。输出\
  \ 6.2 显示了结果。\n\n## Output 6.2\n\n| Analysis of Maximum Likelihood Estimates |\n\
  | Variable | DF | Parameter Estimate | Standard Error | Chi-Square | Pr > ChiSq\
  \ | Hazard Ratio | 95% Hazard Ratio Confidence Limits |\n| grp | 1 | 1.28789 | 0.44629\
  \ | 8.3276 | 0.0039 | 3.625 | 1.512 | 8.694 |\n| Age | 1 | -0.00297 | 0.00320 |\
  \ 0.8650 | 0.3523 | 0.997 | 0.991 | 1.003 |\n| grpage | 1 | -0.01432 | 0.00706 |\
  \ 4.1123 | 0.0426 | 0.986 | 0.972 | 1.000 |\n\n将 β₁ 和 β₃ 代入 θ(u) = β₁ + β₃U 得到以下方程：\n\
  \nθ(AGE) = 1.288 − 0.014*AGE\n\n将其代入 $y = x^{\\theta(u)}$ 后，得到年龄调整后的 ROC 曲线：\n\n\
  $y = x^{1.288 - 0.014*AGE}$\n\n你可以通过绘制几个选定年龄值的 ROC 曲线来获得图形表示（见图 6.4）。图 6.4 中的每条\
  \ ROC 曲线都是 $y = x^{1.288 - 0.014*AGE}$ 在不同年龄值下的绘制。最低曲线代表 70 岁患者，最高曲线代表 40 岁患者。中间的曲线代表以\
  \ 5 年为增量的不同年龄水平。正如 $\\beta_3$ 的负号所预期的那样，随着年龄的增加，ROC 曲线越来越接近对角线。\n\n## Figure 6.4\
  \ ROC Curves for Different Age Values\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_85_0.png)\n\
  \n也可以回答是否需要协变量调整的问题。请注意，当 $\\beta_3=0$ 时，调整后和未调整的 ROC 曲线重合。因此，对 $\\beta_3=0$ 的检验是一种判断是否应报告调整后或未调整\
  \ ROC 曲线的方法。该检验的 $p$-值为 0.0426（见输出 6.2）；因此，基于此分析，年龄调整后的 ROC 曲线是合适的。\n\n## 6.5 Using\
  \ Estimating Equations to Handle Clustered Data\n\n迄今为止描述的所有方法都要求各个数据点彼此独立。当对每个个体单元只进行一次观测时，通常满足这一要求。这里的个体单元可以是等待诊断的患者、申请贷款的债务人，或用于发布天气预报的日历日。\n\
  \n正如磁共振示例中所述，有时可能从一个个体单元获得多个观测值。在这种情况下，研究问题集中于识别异常椎体骨髓过程并将其分类为正常或良性。进行磁共振成像的放射科医生根据图像指示测量信号的椎体数量。有些患者可能只提供一个测量值，而其他患者则提供多个测量值。当患者对分析贡献多个观测值时，\
  \ resulting 数据集被称为 *clustered*。该术语源于这样的观察：来自同一单元的数据表现相似并倾向于聚在一起。\n\n思考聚类数据的直观方式是，两个独立数据点所包含的信息通常多于两个聚类数据点所包含的信息。聚类使得个体数据点彼此表现得更像，而不像原本那样。净结果通常是标准误差增加（与数据点独立相比），而点估计通常不会受到实质性影响。\n\
  \n可以在其他领域想到聚类数据的例子。某一天的天气预报通常是多维的：温度、降水和气压都可能同时被预测。同一天的预测会倾向于聚类，因为它们都与相同的潜在气象事件的各个方面相关。\n\
  \n聚类数据并不总是源于每个观测单元的多次测量。也可能有其他原因怀疑观测值的一个子集彼此表现相似。例如，同一邮政编码区的债务人可能表现出相似的违约行为。同一工厂制造的零件可能表现出相似的故障模式。所有这些都会影响\
  \ ROC 曲线的分析。\n\n聚类数据的分析本身就是一个统计学主题。从 SAS 用户的角度来看的概述可在 Littell 等人（2006）所著的 *SAS for\
  \ Mixed Models, Second Edition* 中找到，适用于连续结果，以及 Stokes、Davis 和 Koch（2001）所著的 *Categorical\
  \ Data Analysis Using the SAS System, Second Edition*。\n\n处理聚类数据的一种方法是基于广义估计方程。这是一种使用对数据点独立性假设的偏离具有稳健性的方法来估计模型参数的方法。这种方法在分析相关的二元数据时非常流行，并且已扩展到删失数据的情形。它可以使用\
  \ PROC PHREG 中的 COVSANDWICH 选项拟合。该选项以协方差的夹心估计量命名，后者是估计方程得到的估计量的特征之一。\n\n如果我们按如下方式修改对\
  \ PROC PHREG 的调用，则模型将使用估计方程拟合，而不是通常的部分似然。ID 语句定义了标识聚类变量的变量。共享相同 ID 值的记录被聚类。\n\n\
  ```\nproc phreg data=tpm1.ph covsandwich(aggregate);\n    model signal=group/r1;\n\
  \    if group='Normal' then grp=0;\n    else if group='Benign' then grp=1;\n   \
  \ id name;\nrun;\n```\n\n使用 COVSANDWICH 选项时，PHREG 输出的格式不会改变。特别是我们看到 θ 估计为 1/1.427=0.701（与第\
  \ 6.3 节相同），支持聚类对点估计几乎没有影响甚至没有影响的观点。由于 θ̂ 没有改变，AUC 的估计值保持在 0.588 不变。另一方面，β̂ 的标准误差现在为\
  \ 0.144，从 0.088 上升，增加了 63.5%，如 StdErrRatio 列所示，这是 COVS 选项存在时 PROC PHREG 输出的唯一新增内容。见输出\
  \ 6.3。这导致 θ̂ 的标准误差增加到 0.101，AUC 的标准误差从 0.030 增加到 0.050。\n\n## Output 6.3\n\n| Analysis\
  \ of Maximum Likelihood Estimates |\n| Parameter | DF | Parameter Estimate | Standard\
  \ Error | StdErr Ratio | Chi-Square | Pr > ChiSq |\n| group benign | 1 | 0.35541\
  \ | 0.14413 | 1.635 | 6.0808 | 0.0137 |\n| Analysis of Maximum Likelihood Estimates\
  \ |\n| Parameter | Hazard Ratio | 95% Hazard Ratio Confidence Limits | Variable\
  \ Label |\n| group benign | 1.427 | 1.076 1.892 | group benign |\n\n图 6.5 在图 6.4\
  \ 的基础上增加了基于估计方程的置信带。虚线均表示 95% 置信区间，一个基于假设独立性的标准误差（较窄的带），另一个基于估计方程（较宽的带）。该图无意帮助你选择估计方法。是否应使用估计方程取决于根据研究的性质是否合理地预期存在聚类。\n\
  \n\n\n\n\n## 图 6.5 聚类对 ROC 曲线变异性的影响\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_88_0.png)\n\
  \n估计方程的一个吸引人的特点是该方法基于回归模型，因此协变量调整在原则上和实现上都是微不足道的。例如，以下对 PROC PHREG 的调用拟合了一个年龄调整模型，同时考虑了每个患者有多个椎体骨髓过程的事实：\n\
  \n```\nproc phreg data=ph covs(aggregate);\n    model signal=grp age grpage / rl;\n\
  \    id name;\n    if group='normal' then grp=0;\n    else if group='benign' then\
  \ grp=1;\n    grpage=grp*age;\nrun;\n```\n\n结果显示在输出 6.4 中，再次以使用偏似然拟合模型的方式呈现。年龄调整\
  \ ROC 曲线的函数形式与第 6.4 节中得到并给出的形式相同\n\ny = x^{1.288−0.014*AGE}\n\n主要区别，如你可能猜到的，是标准误差。参见输出\
  \ 6.4。\n\n## 输出 6.4\n\n最大似然估计分析\n\n| Variable | DF | Parameter Estimate | Standard\
  \ Error | StdErr Ratio | Chi-Square | Pr > ChiSq | Hazard Ratio | 95% Hazard Ratio\
  \ Confidence Limits |\n|---|---|---|---|---|---|---|---|---|\n| grp | 1 | 1.28789\
  \ | 0.89378 | 2.003 | 2.0763 | 0.1496 | 3.625 | 0.629 20.898 |\n| Age | 1 | -0.00297\
  \ | 0.00881 | 2.758 | 0.1137 | 0.7359 | 0.997 | 0.980 1.014 |\n| grpage | 1 | -0.01432\
  \ | 0.01337 | 1.894 | 1.1459 | 0.2844 | 0.986 | 0.960 1.012 |\n\nβ₃ 的标准误差增加了 89.4%。这导致\
  \ p 值为 0.284，与偏似然分析的 p 值相比要大得多。我们得出结论，在调整了聚类后，不需要对年龄进行进一步调整。\n\n## 6.6 使用 Lehmann\
  \ ROC 曲线族比较标记\n\n第 5 章探讨了使用回归模型比较两个或多个 ROC 曲线的想法。主要思想是在回归模型中包含标记类型的指示变量。对于双正态模型，适当的回归模型是异方差正态回归。对于\
  \ Lehmann 族，适当的回归模型是比例风险回归，正如我们在第 6.3 节中已经看到的那样。\n\n具体来说，设 U 为指示变量，对两个不同的标记或预测因子取值为\
  \ 0 和 1。然后，遵循第 6.3 节的逻辑，你可以写出以下方程：\n\n```\nh(V | U, D = 1) / h(V | U, D = 0) = exp{β₁\
  \ + β₃U}\n```\n\n该模型与第 4 章和第 5 章中在双正态模型背景下的模型相似。它在形式上也与第 6.2 节中考虑的模型完全相同，其中 U 表示年龄，一个连续协变量。因此，PHREG\
  \ 语句也完全相同，这里不再重复显示。\n\n如果 β₃ = 0，则两个 ROC 曲线相同。因此，可以通过检验 H₀ : β₃ = 0 来进行正式比较。PROC\
  \ PHREG 输出中 readily 可用的 Wald 检验可用于此目的。从操作角度来看，比较两个标记的 ROC 曲线与比较不同年龄组的 ROC 曲线没有区别，因此第\
  \ 6.4 节中描述的步骤也适用于此。\n\n标记比较可能与协变量比较不同的一个潜在重要方面是，正如我们在第 4 章中讨论的那样，配对设计是大多数涉及多个标记比较的研究中数据收集的主要形式。之前的模型在用偏似然估计时隐含假设观测是独立的。但第\
  \ 6.4 节表明，使用估计方程方法拟合回归模型可以让你在数据相关时获得适当的标准误差估计。配对数据是相关数据的特例，前一节概述的边际模型方法可用于在存在配对数据的情况下拟合模型。\n\
  \n## 6.7 Lehmann ROC 曲线族的优点和缺点\n\n随着单个预测因子 ROC 曲线的非参数方法的出现，你不需要使用双正态模型或 Lehmann\
  \ 族。这些基于模型方法的实用性只有在考虑更复杂的问题时才会变得明显，例如协变量调整或相关数据。\n\n与任何基于模型的统计方法一样，Lehmann ROC 曲线族的性能直接取决于数据生成过程被\
  \ Lehmann 假设近似的程度。如果有强有力的证据表明数据遵循 Lehmann 假设，则本章讨论的方法是适当且优选的。在这些条件下，ROC 曲线的常见统计任务，例如协变量调整、多个标记的比较以及使用聚类数据的分析，都可以使用\
  \ PROC PHREG 处理，这是 Lehmann 族的一个主要优势。\n\n尽管尽最大努力验证或排除 Lehmann 假设，数据可能既不强烈偏离也不强烈支持\
  \ Lehmann 假设。虽然没有替代仔细和专业的统计分析，但你应该考虑 Lehmann 族和竞争方法的优点和缺点。Lehmann 族的主要优点是其简单的函数形式，使结果易于解释并获得洞察，以及软件的可用性。主要缺点是其灵活性不足：使用单个参数，可能无法容纳经验上明显的\
  \ ROC 曲线形状。\n"
- "## 带删失数据的 ROC 曲线\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_91_0.png)\n\n- 7.1\
  \ 引言 ......................................................... 81\n- 7.2 肺癌示例 ...................................................\
  \ 81\n- 7.3 带删失数据的 ROC 曲线 ......................................... 82\n- 7.4 带删失数据的符合概率\
  \ ........................... 88\n- 7.5 符合概率与 Cox 模型 ............................\
  \ 91\n\n## 7.1 引言\n\n在许多应用中，二元结果事件并非立即可观察。例如，大多数信用评分算法试图预测到某一时间点的违约概率。如果数据集中每个受试者在至少到该时间点仍在观察中，则结果是真正二元的，我们迄今看到的方法适用。但可能不希望等待所有受试者的结果都被观察到。可以进行时间-事件分析，用违约发生前的经过时间替代是/否违约。这种分析的优点是可以容纳受试者之间不同的随访时间。虽然它不如等待所有受试者达到预设时间那样有力，但通常可以更快完成，且效率损失通常很小。\n\
  \n## 7.2 肺癌示例\n\n肺癌是最常见和致命的癌症之一。其预后受两个因素 heavily 影响：肿瘤大小和淋巴结受累。使用这些因素，你可以预测死亡的可能性并据此计划进一步治疗。这些因素最好在手术中切除的肿瘤标本上测量。然而，在手术前准确描述预后有相当大的兴趣。第\
  \ 3 章描述了来自正电子发射断层扫描（PET）扫描的标准化摄取值（SUV）。在本例中我们将研究 SUV 作为肺癌死亡率标记的准确性。本分析的目标是看看 SUV\
  \ 是否能预测手术后肺癌患者的生存。由于 SUV 在手术前可用，如果它具有合理的预测价值，将具有重要的实际意义。\n\n本研究的的数据集有三个变量：SUV、Survival\
  \ 和 Status。Survival 是手术到死亡之间经过的时间。对于分析时仍存活的患者，它代表手术到最后随访之间的时间。Status 是一个二元变量，表示患者在最后联系时是死亡还是存活。如果\
  \ status=1，则患者死亡，Survival 变量是实际生存时间。如果 status=0，则患者存活，Survival 是随访时间。这些患者被称为删失，因为我们没有观察到他们的生存时间。\n\
  \n这种数据结构是删失数据的典型形式，它立即揭示了所需统计分析的复杂特征。结果（即生存时间）以特定方式由两个变量（Survival 和 Status）组合表示。此外，对于部分患者，实际结果未被观察到。传统的统计方法不能直接应用于\
  \ Survival 变量来推断生存时间。例如，Survival 变量的中位数会低估实际中位数，因为它把删失患者的随访时间当作实际生存时间处理。\n\n因此，删失数据的分析需要特殊方法。由于删失数据在临床研究中无处不在，更不用说工程可靠性（设备故障时间）和金融（违约时间）等其他领域，这些特殊方法已被广泛研究。本章使用了两种更受欢迎的删失数据方法。一种是生存时间分布的\
  \ Kaplan-Meier 估计，另一种是比例风险（Cox）回归。我们在上一章中已经使用了 Cox 模型，尽管是从完全不同的角度。\n\n严格来说，了解本章几乎不需要关于删失数据的先验知识，但要掌握细节而没有一些经验是困难的。Paul\
  \ Allison 的 Survival Analysis Using the SAS System: A Practical Guide（1995）或 Alan\
  \ Cantor 的 SAS Survival Analysis Techniques for Medical Research, Second Edition（2003），两者都是\
  \ SAS Press 出版的书籍，对此目的有帮助。\n\n## 7.3 带删失数据的 ROC 曲线\n\n我们反复强调生成 ROC 曲线需要二元结果。如果 W\
  \ 是预测因子，D 是二元结果，你可以写\n\nP(W > c | D = 1)\nP(W ≤ c | D = 0)  (7.1)\n\n来表示对应于某个阈值\
  \ c 的灵敏度和特异性。我们在第 3 章中看到，这两个概率可以用 W 的条件分布表示，并且它们构成了经验 ROC 曲线的<|message|>。\n\n在生存模型背景下，结果是事件发生（例如死亡或违约）为止经过的时间。这可以被视为随时间变化的二元结果。方程（7.1）现在被替换为\n\
  \nP(W > c | D(t) = 1)\nP(W ≤ c | D(t) = 0)  (7.2)\n\n\n\n这突出了在删失数据的背景下，敏感性和特异性是时间的函数这一事实。\n\
  \n使用公式（7.2），我们可以估计每个 c 的敏感性和特异性，并绘制这些估计值以得到特定时间点 t 的 ROC 曲线。估计值可通过以下关系获得，该关系源于条件概率的定义以及贝叶斯定理的应用：\n\
  \nP(W > c | D(t) = 1) = {1 − S(t | W > c)} P(W > c) / (1 − S(t))\nP(W ≤ c | D(t)\
  \ = 0) = S(t | W ≤ c) P(W ≤ c) / S(t)  (7.3)\n\n在公式（7.3）中以及本章其他地方，S(t) 表示生存函数——即\
  \ S(t)=P(T>t)。事实证明，公式（7.3）右边三个分量都可以用 SAS 计算出来。以下各节详细说明如何使用数据计算公式（7.3）。为说明起见，我们将使用\
  \ c=9 和 t=36，但以下步骤也可以对其他 c 和 t 值重复。\n\n## 7.3.1 S(t) 的估计\n\n如前所述，S(t)=P(T>t) 是变量\
  \ T 的生存函数（即熟悉的累积分布函数的相反数），它受删失影响。对删失变量的累积分布进行计算需要特殊方法。其中最流行的方法，另称为 Kaplan-Meier\
  \ 或乘积极限估计方法，已在 SAS/STAT 软件的 PROC LIFETEST 中实现。PROC LIFETEST 是在使用公式（7.3）时计算所需分布的主要工具。以下调用返回\
  \ 3 年时的生存概率：\n\n```\nproc lifetest data=lung timelist=(36);\n    time survival*status(0);\n\
  run;\n```\n\nTIME 语句具有特殊的语法，将两列中的结果信息结合在一起。先指定的变量（在星号之前）是生存时间，后指定的变量（在星号之后）是状态。在状态变量之后用括号列出指示删失的状态变量值。最后，timelist=(36)\
  \ 仅打印出 3 年（36 个月）生存函数的估计值。否则，默认情况下会打印数据集中所有观察到时间点的生存概率。\n\n输出 7.1 显示了此次 PROC LIFETEST\
  \ 调用的结果。相关部分标记为 Product-Limit Survival Estimates（product-limit 是 Kaplan-Meier 估计的另一种名称）。关注的时间点列在\
  \ Timelist 标题下，对应的概率标记为 Survival。请记住 S(t)=P(T>t)，并且 1−S(t)=P(T≤t) 给出在 Failure 标题下。我们从输出\
  \ 7.1 的结果中看到 S(t)=0.7676 且 1−S(t)=0.2324。\n\n### Output 7.1\n\nThe SAS System\n\
  The LIFETEST Procedure\n\n### Product-Limit Survival Estimates\n\n| Timelist | Survival\
  \ | Survival | Failure | Survival Standard Error | Number Failed | Number Left |\n\
  | 36.0000 | 36.0000 | 0.7676 | 0.2324 | 0.0529 | 19 | 23 |\n\n### Summary Statistics\
  \ for Time Variable Survival\n\n### Quartile Estimates\n\n| Percent | Point Estimate\
  \ | 95% Confidence Interval [Lower Upper) | |\n| 75 | . | . | . |\n| 50 | . | 49.0000\
  \ | . |\n| 25 | 44.0000 | 24.0000 | . |\n\nMean    Standard Error\n41.8379     \
  \   1.4697\n\nNOTE: The mean survival time and its standard error were underestimated\
  \ because the largest observation was censored and the estimation was restricted\
  \ to the largest event time.\n\n### Summary of the Number of Censored and Uncensored\
  \ Values\n\n| Total | Failed | Censored | Percent Censored |\n| 100 | 21 | 79 |\
  \ 79.00 |\n\n## 7.3.2 P(T|W) 的估计\n\nP(T|W) 从根本上也是一个时间-事件分布，同样可以用 PROC LIFETEST 估计。需要记住的关键点是根据\
  \ W 中指定的条件排除适当的患者。因此，当你计算 P(T|W>9) 时，你需要仅包含 SUV 大于 9 的患者，如以下对 PROC LIFETEST 的调用所示：\n\
  \n```\nproc lifetest data=lung(where=(suv>9)) timelist=(36);\n    time survival*status(0);\n\
  run;\n```\n\n输出 7.2 的格式与输出 7.1 相同（仅显示相关部分），告知我们 1−S(T|W>9)=0.3665。类似获得的方程 S(T|W≤9)\
  \ 等于 0.8960（此处未显示）。\n\n### Output 7.2\n\nThe SAS System\n\nThe LIFETEST Procedure\n\
  \nProduct-Limit Survival Estimates\n\n| Timelist | Survival | Survival | Failure\
  \ | Standard Error | Number Failed | Number Left |\n| 36.0000 | 29.0000 | 0.6335\
  \ | 0.3665 | 0.0784 | 16 | 8 |\n\n## 7.3.3 P(W) 的估计\n\nW 不受删失影响，因此原则上 P(W>c) 是超过\
  \ c 的观测比例。P(W) 可以在 SAS 中以多种方式计算，包括使用 DATA 步或 PROC SQL 编程，以及使用 PROC UNIVARIATE 和\
  \ PROC FREQ。你也可以使用 PROC LIFETEST，因为在没有删失的情况下，Kaplan-Meier 方法会产生与标准方法相同的结果。由于指定状态变量是可选的，因此\
  \ PROC LIFETEST 可用于此目的，如下所示：\n\n```\nproc lifetest data=lung timelist=(9);\n   \
  \ time suv;\nrun;\n```\n\n这是与之前的 PROC LIFETEST 调用相比有些不寻常的调用。SUV 是需要分布的变量；因此 timelist=9。没有状态变量的原因是\
  \ W 不受删失影响。PROC LIFETEST 的输出（输出 7.3）表明 P(W>9)=0.50。这是 Timelist 和 SUV 标题下的值不同的第一个例子。前者列出\
  \ PROC LIFETEST 语句的 TIMELIST= 选项请求的值，而后者显示报告的生存和失败概率所适用的最近观测值。如果请求的时间点被观测到，则两列将具有相同的数字。\n\
  \n### Output 7.3\n\nThe SAS System\n\nThe LIFETEST Procedure\n\nProduct-Limit Survival\
  \ Estimates\n\n| Timelist | SUV | Survival | Failure | Standard Error | Number Failed\
  \ | Number Left |\n| 9.00000 | 8.9300 | 0.5000 | 0.5000 | 0.0500 | 50 | 50 |\n\n\
  ## 7.3.4 综合起来\n\n第 7.3.1 节至第 7.3.3 节演示了如何使用 SAS 过程 PROC LIFETEST 从数据中计算公式（7.3）的分量。利用这些节的结果，你可以按如下方式计算\
  \ SUV 为 9 时 3 年的敏感性和特异性：\n\nP(W > c | D = 1) = {1 − S(t | W > c)} P(W > c) / (1\
  \ − S(t)) = (1 − 0.6335) * 0.5 / (1 − 0.7676) = 0.7885\nP(W ≤ c | D = 0) = S(t |\
  \ W ≤ c) P(W ≤ c) / S(t) = 0.8960 * 0.5 / 0.7676 = 0.5836\n\n通过改变 c，你可以获得每个 c 的敏感性和\
  \ 1 减去特异性。这些对的图构成 ROC 曲线。\n\n这里有一个潜在问题。然而，在第 3 章中给出的例子中，ROC 曲线保证是单调递增的。对于删失数据则没有这种保证，因为\
  \ Kaplan-Meier 估计不是时间的光滑函数（它们有多个跳跃）。这意味着，随着 1 减去特异性的增加，敏感性偶尔可能会下降，违反了 ROC 曲线的核心前提。单调性缺失在小样本中可能很明显，但在大多数具有大样本和/或事件的数据集中几乎不易察觉。\n\
  \n如果 S(t) 的估计没有跳跃和平坦区域——即如果它本身是单调的——ROC 曲线也将是单调的。认识到这一点，Heagerty 等人（2000）建议使用不同的\
  \ S(t) 估计量，即加权 Kaplan-Meier 估计量。\n\n宏 %TDROC 生成时间依赖 ROC 曲线。宏的必需输入是 DSN（数据集名称）、Marker、TimeVar、Status\
  \ 和 TimePT。TimePT 变量指定进行预测的时间。Status 变量必须满足 PROC LIFETEST 的要求：它必须是数值，并且必须在括号后跟随指示删失的值列表。宏还具有一个选项（smooth=1），用于实现\
  \ S(t) 的光滑估计。默认情况下 smooth=0。另一个可选输入是 PLOT（默认值为 1），控制曲线是否被绘制。当 plot=0 时，仅提供敏感性和特异性对的数据集。\n\
  \n图 7.1 是 SUV 作为肺癌数据中 3 年预后标记的 ROC 曲线，由对 %TDROC 宏的以下调用生成：\n\n```\n%TDROC(DSN=lung,\
  \ MARKER=suv, TIMEVAR=survival, STATUS=status(0),\n    TIMEPT=36);\n```\n\n\n\n\n\
  \n## 图 7.1 SUV 在肺癌中预测能力的 3 年 ROC 曲线\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_97_0.png)\n\
  \n图 7.1 中 ROC 曲线的 AUC 为 0.657，表明其准确性处于中等水平。曲线本身从未远离对角线，支持相同的结论。当然，ROC 曲线应在预测方法的竞争背景下进行评估。在生存分析中，做出准确预测要困难得多，因为所预测的事件在某些情况下可能在数年后发生，在此期间患者可能发生许多其他事情。从这个角度来看，0.657\
  \ 的 AUC 代表了相当可观的准确性水平。\n\n很明显，选择时间点会影响结论。在某些情况下，研究人员有明确的目标时间点。其他研究缺乏这种明确性，可能给统计学家在选择时间点时带来问题。在这些情况下，尝试几个时间点并同时呈现结果，如图\
  \ 7.2 所示。\n\n## 图 7.2 SUV 在肺癌中预测能力的 2 年、3 年和 4 年 ROC 曲线\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_98_0.png)\n\
  \n要生成如图 7.2 所示的显示，你需要了解 %TDROC 宏如何命名输出数据集。宏语言中的数据集名称为 &&DSN_&TIMEPT，因此对于肺癌示例，图 7.2\
  \ 中三个 ROC 曲线的三个数据集分别命名为 LUNG_24、LUNG_36 和 LUNG_48。\n\n总体而言，三条曲线形状相似，尽管在特异性较高水平时敏感性似乎随时间增加，而在特异性较低水平时随时间减少。三个曲线的\
  \ AUC 分别为 0.618、0.657 和 0.729，表明 SUV 在预测患者状态方面在较晚年份比较早年份更有效。另一方面，曲线之间的大部分差异出现在特异性小于\
  \ 0.5 的区域，因此 AUC 的差异在实际意义上可能无关紧要。\n\n## 7.4 带删失数据的符合概率\n\n第 7.3 节解释了如何使用删失数据构建 ROC\
  \ 曲线。其基本思想是在给定时间点对时间-事件结果进行二分化。因此，ROC 曲线是针对特定时间点定义的。为了了解标记的整体预测价值，你需要进行如图 7.2 所示的分析。\n\
  \n本节讨论一种替代方法来评估标记预测删失结果的整体价值。这种替代方法基于符合性的思想。在第 3 章中，我们看到，对于二元结果，经验 ROC 曲线下的面积等价于符合概率。作为提醒，符合概率是在一对受试者中定义，其中一对有结果而另一对没有。具有结果的受试者标记值大于另一受试者的概率称为符合概率。\n\
  \n以下表达符合概率的方式与该定义一致，并且也使其能够推广到删失结果。定义\n\n```\nψ(W_i, W_j) = { 1    W_i > W_j\n \
  \                 0.5  W_i = W_j\n                  0    W_i < W_j }\n```\n\n因此\
  \ ψ 指示哪位成员的配对具有较高值，平局用 0.5 表示。假设有 n 名患者有结果，m 名患者没有结果。那么总共有 mn 对，符合概率可以写为如下：\n\n\
  ```\n1/(mn) Σ_{i=1}^n Σ_{j=1}^m ψ(W_i, W_j)\n```\n\n求和表示 W_i > W_j 的配对数（对平局进行了调整），因此整个表达式是患者配对中标记值较高者具有结果的比例。\n\
  \n你可以在时间-事件环境中使用符合性的思想。要了解如何将符合性的定义适用于删失结果，设 T_i 和 T_j 为标记值分别为 W_1 和 W_2 的一对患者中的事件时间。标记\
  \ W 与删失结果 T 之间的符合性定义为\n\n```\nCP(W, T) = P(T_1 > T_2 | W_1 > W_2)\n```\n\n由于 T 受到删失的影响，此估计量无法使用，因为结果是部分观察到的。\n\
  \nHarrell 等人（1982）提出了一种可以与删失数据一起使用的该估计量的修改方法。该方法基于这样一个认识：即使存在删失，一些配对的结果也可以排序。例如，如果第二个受试者死亡，其生存时间短于第一个仍存活受试者的随访时间，我们可以确定\
  \ T_1 > T_2。表 7.1 列出了所有可能性以及相应的 ψ(W_1, W_2) 值。如果 ψ(W_1, W_2)=1，则表示预测与结果一致。如果 ψ(W_1,\
  \ W_2)=0，则表示预测与结果不一致。最后，(W_1, W_2)=? 表示由于删失，无法确定预测与结果是否一致或不一致。\n\n## 表 7.1 带删失数据时所有可能的配对及符合状态\n\
  \n| Subject 1 | Subject 2 | T₁ and T₂ | Ψ(W₁,W₂) |\n|---|---|---|---|\n| Event |\
  \ Event | T₁>T₂ | 1 |\n| Event | No Event | T₁>T₂ | ? |\n| No Event | Event | T₁>T₂\
  \ | 1 |\n| No Event | No Event | T₁>T₂ | ? |\n| Event | Event | T₁<T₂ | 0 |\n| Event\
  \ | No Event | T₁<T₂ | 0 |\n| No Event | Event | T₁<T₂ | ? |\n| No Event | No Event\
  \ | T₁>T₂ | ? |\n\n现在我们可以使用表 1 中的定义评估所有配对以查看它们是否一致。分母是有信息量的配对数（即我们可以做出决定的配对），在以下等式中用\
  \ k 表示。记号 (i,j)=1 到 (i,j)=k 表示求和是在 (i,j) 配对上进行，并且有 k 个这样的配对。由此得到的符合概率估计量通常称为 c-index。\n\
  \n```\nc = 1/k Σ_{(i,j)=1}^k ψ(W_i, W_j)\n```\n\nc-index 有几个优点。它模仿了二元数据下 ROC 曲线下面积的计算，它是直观的，并且在概念上计算简单。尽管概念上简单，计算需要形成所有配对，可能需要很长时间。c-index\
  \ 的计算并未内置于现有的 SAS 过程中，但可以从本书网站获得的 %CINDEX 宏可用于计算，如下所示：\n\n```\n%CINDEX (DSN=LUNG,\
  \ PRED=SUV, SURV=SURVIVAL, CENS=CENS);\n```\n\n这里，DSN 是数据集的名称，Pred 是数据集中用作预测变量的变量，Surv\
  \ 是生存时间变量，Cens 是删失指示符（1 表示删失，0 表示事件）。输出 7.4 仅报告 c-index。\n\n## 输出 7.4\n\n```\ncindex\n\
  --------\n0.692708\n```\n\n在肺癌示例的情况下，使用 c-index 作为估计量，符合概率估计为 0.69。\n\n如果感兴趣的问题涉及多个标记或多变量预测模型，则\
  \ %CINDEX 宏的输入宏变量 PRED 应指向包含多变量模型预测的变量。\n\n尽管有所有优点，c-index 有一个很大的缺点。它不是真实符合概率的一致估计量。一致估计量随着样本量的增加而更接近真实值。然而，即使样本量增加，c-index\
  \ 仍可能远离真实值。因此，即使在大样本中，c-index 也可能给出“错误”的答案。根据我的经验，如果删失率较低（这意味着未决配对的比例较低），c-index\
  \ 工作得相当好。随着删失率的增加，其性能变得不可预测。\n\nc-index 不一致的原因，至少直观上，是它使用了观察到的生存或随访时间。除非采用参数模型，否则使用观察值的程序不会提供一致的估计值。因此，大多数非参数或半参数删失数据分析方法，例如\
  \ Kaplan-Meier 估计或比例风险回归，使用数据的秩，而不是其实际值。\n\n在结束本节之前，请注意符合概率的一个有趣性质：\n\nCP(W,T)=1−CP(−W,T)\n\
  \n该等式告诉我们，如果标记在结果不太可能时已知具有高值，则 CP 可能小于 0.5。这种情况下更有信息量的度量是 1−CP，它可以作为标记正确排序事件时间的度量。\n\
  \n## 7.5 符合概率与 Cox 模型\n\n在一种非常重要的特殊情况下，计算符合概率有另一种方法。大多数涉及删失数据的回归情况，例如在连续协变量与删失结果之间或多个协变量与删失结果之间建模的关系，都在\
  \ Cox 模型（比例风险回归）框架内处理。事实证明，在 Cox 模型背景下，符合概率可以解析计算。以下推导来自 Gönen 和 Heller（2005）。\n\
  \n\n\n\n\n起始点是用于删失结局的符合概率定义，如第7.4节所述：\n\nCP(W,T) = P(T₁ > T₂ | W₁ > W₂)\n\n其中 T\
  \ 为生存时间，W 为预测因子。暂时，我们将使用单一预测因子。对多个预测因子的情况的扩展将随后进行。Cox模型对此情形的规定为\n\nh(t|W) = h₀(t)\
  \ exp{βW}\n\n其中 h(t) 为 t 的风险函数，写成两个项的乘积：一个仅涉及 t 的项（h₀，基线风险）和一个仅涉及 W 的项（线性部分）。利用风险与生存函数之间的关系，可以写出等价表达式：\n\
  \nS(t|W) = S₀(t) exp{βW}\n\n有关如何证明这两个表达式等价的更多信息，可在大多数涵盖Cox模型的书籍中找到，例如 Survival Analysis\
  \ Using the SAS System: A Practical Guide (Allison, 1995)。\n\n现在你可以用生存函数重写符合概率：\n\
  \nP(T₁ > T₂ | W₁ > W₂) = ∫ S₁(t | W₁) dS₂(t | W₂)\n\n理解该方程需要一定的高级概率知识，但在这里它用于说明符合概率可以用仅\
  \ S(t) 表示。如果将Cox模型中 S₁ 和 S₂ 的形式代入，则右手边的积分可以按如下方式求值：\n\nP(T(βᵀW₂) > T(βᵀW₁)) = ∫\
  \ S₁(t | W₁) dS₂(t | W₂) = [1 + exp{βᵀ(W₂ − W₁)}]⁻¹\n\n因此，要在Cox模型的背景下评估预测因子 W 的判别能力，你需要\
  \ β 的估计值以及数据所有可能配对的 W 值。请注意，T 仅通过 β 的估计进入计算，而 β 的估计可使用偏似然完成。因此，删失可通过拟合Cox模型的现有方法自然处理。这是计算符合概率的这种方法的一个特别优势。\n\
  \n如果存在多个预测因子，则 W 和 β 均为向量。相同的表达式可以用向量记号写成如下：\n\nP(T(βᵀW₂) > T(βᵀW₁)) = [1 + exp{βᵀ(W₂\
  \ − W₁)}]⁻¹\n\n迄今为止推导出的表达式涉及特定的观测对，记为 1 和 2。要在包含若干观测的数据集中使用，我们需要对每对观测计算该概率。这给出了符合概率估计的公式（标记为\
  \ CPE）：\n\nCPE = 2 / [n(n-1)] Σ Σ_{i<j} { I(β̂^T w_{ji} < 0) / [1 + exp{-β̂^T w_{ji}}]\
  \ + I(β̂^T w_{ji} ≥ 0) / [1 + exp{β̂^T w_{ji}}] }\n\n其中 w_{ji} = w_j - w_i。求和项由两部分组成，表示预测因子较高值或较低值与更长生存相关的情况，这反映在回归系数的符号中。如果\
  \ β > 0，则协变量的较高值与风险的较高值相关。在这种情况下，对于特定配对，如果 w_j > w_i，则 T_j 大于 T_i 的概率应大于 0.5，因此求和项的第二项应适用，因为\
  \ β^T w_{ji} > 0 且 exp{β^T w_{ji}} > 0。因此，(1 + exp{β^T w_{ji}})^{-1} > 0.5。取决于 β\
  \ 和 w_{ji} 符号的其他三种情况可以以类似方式解释。\n\n如前所述，使用偏似然的Cox模型软件的可用性是主要的操作优势。它也构成理论优势之一。偏似然估计是一致的；也就是说，随着样本量的增长，结果越来越接近参数的底层真实但未知的数值。众所周知，一致估计量的函数也是一致的。由于计算\
  \ CPE 仅估计 β，因此 CPE 也是一致的。这是在Cox模型背景下应偏好 CPE 而非 c-index 的重要原因。\n\nCPE 可使用 %CPE 宏进行估计，该宏可从本书的配套网站\
  \ support.sas.com/gonen 获取。宏调用与 %CINDEX 类似：\n\n```\n%CPE(DSN=LUNG, COVARIATES=SUV\
  \ SIZE, SURV=SURVIVAL, CENS=CENS);\n```\n\nOutput 7.5 显示了结果。\n\n## Output 7.5\n\n\
  | Concordance Probability Estimate for the Cox Model |\n| CPE | StdErr |\n| 0.6524\
  \ | 0.0582 |\n\nCINDEX 和 CPE 宏调用的一个重要区别是，预测因子以 MODEL 语句右手边出现的方式用空格列出。\n\n我们看到肺部数据集的\
  \ CPE 小于 c-index。根据我的经验，这通常是这种情况。c-index 似乎高估了真实的符合概率，尤其是在删失比例高时。由于 CPE 是一个一致估计，而\
  \ c-index 不是（如前所述），因此在Cox回归模型预测的背景下，CPE 是一个更好的度量。\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_105_0.png)\n\
