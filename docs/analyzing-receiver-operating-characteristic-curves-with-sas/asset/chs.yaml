  \ PROC NLMIXED 调用中使用，以估计转换后变量的双正态参数。虽然这里没有详细说明操作步骤，但你可能希望尝试这个练习以获得实践技能。\n\n## 3.8\
  \ 双正态 ROC 曲线的直接估计\n\n第 3.6 节描述了如何从基本假设出发推导出双正态 ROC 曲线的函数形式，即标记在阳性和阴性组中的分布为正态分布（均值和方差可能不同）。随后说明了如何使用\
  \ PROC NLMIXED 获得这两个正态分布参数的估计值。该方法假设观测数据服从正态分布。然而，正如第 3.7 节所述，可以对观测值进行转换以改善正态性假设的符合程度，然后在转换后的值上应用第\
  \ 3.4 节概述的方法来获得 ROC 曲线的改进估计。\n\n估计双正态 ROC 曲线还有一种更简单、更直接的方法。请注意，双正态曲线只有两个参数 a 和 b，且\
  \ ROC 曲线由下式给出\n\ny = Φ(a + bΦ⁻¹(x))\n\n其中 y 为灵敏度，x 为 1 减去特异度。你可以先绘制观测到的 ROC 点，就像绘制经验\
  \ ROC 曲线一样，但不要将它们连接起来，而是拟合上述形式曲线并找到使拟合效果最佳的 a 和 b。该过程可通过以下观察进一步简化：\n\nΦ⁻¹(y) = a\
  \ + bΦ⁻¹(x)\n\n因此，如果 ROC 点首先转换到 probit 尺度上，则你只需要拟合一条直线，这几乎可以[content]\n\n你可以在 PROC\
  \ TRANSREG 中使用 OUTPUT 语句创建一个包含转换后值的数据集。这些转换后的值随后可以在类似于第 3.6 节中的 PROC NLMIXED 调用中使用，以估计转换后变量的双正态参数。虽然这里没有详细说明操作步骤，但你可能希望尝试这个练习以获得实践技能。\n\
  \n## 3.8 双正态 ROC 曲线的直接估计\n\n第 3.6 节描述了如何从基本假设出发推导出双正态 ROC 曲线的函数形式，即标记在阳性和阴性组中的分布为正态分布（均值和方差可能不同）。随后说明了如何使用\
  \ PROC NLMIXED 获得这两个正态分布参数的估计值。该方法假设观测数据服从正态分布。然而，正如第 3.7 节所述，可以对观测值进行转换以改善正态性假设的符合程度，然后在转换后的值上应用第\
  \ 3.4 节概述的方法来获得 ROC 曲线的改进估计。\n\n估计双正态 ROC 曲线还有一种更简单、更直接的方法。请注意，双正态曲线只有两个参数，a 和 b，且\
  \ ROC 曲线由下式给出\n\ny = Φ(a + bΦ⁻¹(x))\n\n其中 y 为灵敏度，x 为 1 减去特异度。你可以先绘制观测到的 ROC 点，就像绘制经验\
  \ ROC 曲线一样，但不要将它们连接起来，而是拟合上述形式曲线并找到使拟合效果最佳的 a 和 b。该过程可通过以下观察进一步简化：\n\nΦ⁻¹(y) = a\
  \ + bΦ⁻¹(x)\n\n因此，如果 ROC 点首先转换到 probit 尺度上，则你只需要拟合一条直线，这几乎可以轻而易举地通过最小二乘法完成。有许多 SAS/STAT\
  \ 过程可用于此目的，但 PROC REG 提供了最简单的接口。假设 ROCData 是由 PROC LOGISTIC 的 OUTROC= 选项创建的数据集。那么你可以通过使用以下代码来估计双正态参数：\n\
  \n```\ndata ROCData;\n    set ROCData;\n    _y=probit(_sensit_);\n    _x=probit(_1mspec_);\n\
  run;\n\nproc reg data=ROCData;\n    model _y=_x;\nrun;\nquit;\n```\n\n该方法在头颈癌数据中对双正态参数\
  \ a 和 b 的估计分别为 1.71 和 0.85，而通过使用 PROC NLMIXED 直接对标记值建模时估计值为 1.31 和 0.66。图 3.7 显示了对经验曲线（实线）的两种不同双正态拟合。虚线为\
  \ PROC NLMIXED 的估计，点线为 PROC REG 的估计。\n\n## 图 3.7 由 NLMIXED、REG 和 LOGISTIC 过程获得的\
  \ ROC 曲线估计\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_43_0.png)\n\n尽管由于其简单性，使用最小二乘法直接估计\
  \ ROC 曲线很有吸引力，但它并非没有问题，尤其是 ROC 曲线上的点实际上来自累积分布函数且并非独立。因此 PROC REG 的标准误很可能低估了真实标准误。因此，你不应使用最小二乘估计进行推断（如报告置信区间），而应作为双正态参数的点估计。由于双正态曲线是双正态参数的函数，使用最小二乘估计直接估计\
  \ ROC 曲线是正确的，但由此产生的标准误和 p 值是不正确的。\n\n## 3.9 曲线下面积的 Bootstrap 置信区间\n\nBootstrap 是一种现代方法，最初用于评估点估计的变异性。此后已扩展到执行假设检验、预测模型的验证、模型选择以及许多其他统计任务。\n\
  \n在本书中，bootstrap 方法用于\n\n- ROC 曲线下面积的非参数置信区间\n- 比较两个或多个 ROC 曲线相对于其 AUC 的假设检验\n-\
  \ 校正多变量预测模型（如 logistic 回归）或数据挖掘预测（如分类树）的评估中的乐观偏差。\n\n简而言之，bootstrap 样本是通过有放回地从观测数据中抽样获得的。以下步骤以伪代码描述该过程：\n\
  \n1. 创建 B 个数据集，每个数据集都是从原始数据中有放回随机抽样得到的。\n2. 对于 i=1,...,B，按分析原始数据集的方式对数据集 i 进行分析（例如，计算经验\
  \ AUC）。将结果（可能有多个值）分配给 R(i)。\n3. R(1), ..., R(B) 是 R 的抽样分布的近似。\n\n近似效果随 B 增大而变好。在大多数应用中，B\
  \ 在 200 到 2,000 之间。从近似抽样分布估计的统计量即为所需估计。例如，B 个数值 R(i) 的标准差近似于 R 的标准误。有关 bootstrap\
  \ 方法的进一步回顾超出了本书范围。请参阅 Efron 和 Tibshirani（1993）获取更多信息。\n\n宏 %BOOT1AUC 可从本书的配套网站 support.sas.com/gonen\
  \ 获得，用于对单个 ROC 曲线的曲线下面积进行 bootstrap 分析。示例调用如下：\n\n```\n%boot1auc(data=HeadNeck,marker=suv,gold=ngold);\n\
  ```\n\n尽管还有另外两个可能的输入：BOOT 指定 bootstrap 样本数（默认为 1,000），ALPHA 指定置信区间的误差水平。输出 3.6 显示了结果。\n\
  \n### 输出 3.6\n\nsuv 的 AUC 的 Bootstrap 分析\nAUC  StdErr\n--------\n0.871523  0.026945\n\
  \n95% 置信区间\nLowerLimit  UpperLimit\n--------\n0.813384  0.920954\n\n如果你想进一步开发自己的\
  \ bootstrap 应用，PROC SURVEYSELECT 提供了使用 SAS 创建 bootstrap 样本的最简单方法：\n\n```\nproc surveyselect\
  \ data=HeadNeck method=urs n=181 out=_sample outhits rep=100 noprint;\nrun;\n```\n\
  \n此 PROC SURVEYSELECT 调用生成 100 个样本（由 REP= 选项指定），每个样本有 181 个元素（由 N= 选项指定）。通常，每个 bootstrap\
  \ 样本的大小与原始数据集相同，因此 N= 选项通常等于样本量。METHOD=URS 允许无限制随机抽样，对应于一种抽样方案，该方案为数据集中每个记录赋予相等概率并进行有放回抽样。OUT=\
  \ 选项指定保存 bootstrap 样本的数据集。最后，OUTHITS= 选项确保在有放回抽样中被多次选中的记录在输出数据集中按其被选中的次数出现。默认情况下（当未指定\
  \ OUTHITS= 选项时），该记录用单条观测表示，并附带一个变量指示命中次数（即被选中的次数）。\n\nPROC SURVEYSELECT 创建的数据集的一个重要特征是它包含一个名为\
  \ Replicate 的变量，用于标识 bootstrap 样本。由于 bootstrap 样本是分别分析的，你可以使用大多数 SAS/STAT 过程中可用的\
  \ BY 处理。例如，要计算每个 bootstrap 样本的 AUC，你可以使用 BY REPLICATE 语句调用 PROC LOGISTIC 并使用 ODS\
  \ OUTPUT 语句创建输出数据集。该输出数据集还将包含 REPLICATE 列以及为每个 bootstrap 样本计算的 AUC 指标。因此，有了 PROC\
  \ SURVEYSELECT，开发 bootstrap 方法的 SAS 代码变得大大简化。此外，由于 BY 处理比使用宏循环等竞争方式执行相同任务要快得多，这种策略导致程序在计算上更高效。这一点至关重要，因为\
  \ bootstrap 方法可能需要大量的计算资源。\n\n\n\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_47_0.png)\n\
