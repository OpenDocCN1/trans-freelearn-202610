- "## Using the ROC Curve to Evaluate Multivariable Prediction Models\n\n## 8.1 Introduction\n\
  \n我们迄今为止的讨论主要集中于单一预测因子。其他变量也被考虑，例如在比较几个预测因子或协变量调整的 ROC 曲线时，但不是以从多变量模型产生预测并评估其准确性的形式。第\
  \ 8 章和第 9 章处理这个问题。\n\n强调单一预测因子的原因值得讨论。首先，它们为评估更复杂的模型提供了基础。其次，单一预测因子应用在实践中很常见，因此值得特别关注。诊断放射学是一个很好的例子，其中预测因子通常是接受扫描的患者的产物。虽然将来自多个数据源的信息结合起来（如磁共振成像和计算机断层扫描等替代诊断扫描）可提高准确性，但压倒性的财务和伦理关注点在于最大限度地减少扫描次数。这导致了在少数候选中挑选最佳单一预测因子的关注。将来自多种扫描类型的信息结合起来很少是感兴趣的，因为准确性的增量改善通常无法证明患者接受额外诊断程序的成本和负担是合理的。\n\
  \n诊断放射学以外的多数预测问题涉及多个变量。通常，你设法预测的大多数结局都是复杂的、多个维度的实体，只能通过审慎使用多个变量来捕捉。这通常意味着构建模型，这需要从几个竞争模型中进行选择。该过程的目标是找到最适合数据的模型，但不可避免地导致过拟合。*过拟合*\
  \ 指的是一个模型比它预见到未来观测的情况更好地描述了观测数据。\n\n从用于模型拟合的数据集计算的模型性能度量（如 ROC 曲线或 ROC 曲线下面积）被称为通过\
  \ *自预测* 或 *重代入* 获得。这些术语源于使用模型预测生成自身的数据并将模型重新代入数据以获得预测的做法。对此方法的另一个、有些轻率的术语是 *双重使用*，指的是数据集被使用两次，一次用于拟合，一次用于预测。ROC\
  \ 曲线及其汇总度量倾向于反映自预测中的乐观性，因为它们表明的准确性比模型在实践中允许的要好。\n\n大多数统计学家建议采取措施防止过拟合。该过程通常称为 *验证*。以下是特别适用于\
  \ ROC 曲线且可在 SAS 中相对轻松实现的方法：拆分样本验证和样本重用验证。样本重用方法实际上可以用两种不同的方式实现：交叉验证和自助法。本章涵盖这些方法。\n\
  \n*拆分样本验证* 要求将样本分为两部分，即所谓的训练集和测试集。模型在训练集上拟合，其性能在测试集上评估。这模仿了模型在未参与模型开发的数据集上使用的现实生活情况。从测试集估计的性能度量比从训练集估计的度量更接近真实值（偏差更小）。拆分样本验证易于理解和实现。它也很好地近似现实生活。其主要缺点是数据使用效率低下：对于小到中等的样本量，训练集和测试集都不足以产生可重复的结果。\n\
  \n样本重用方法试图通过以不同方式重复使用观测数据点来提高效率。这种重复使用导致性能估计的方差更小。一般而言，然而，由于每个数据点被使用多次，偏差会增加。尽管如此，大多数研究在均方误差等综合标准方面更倾向于样本重用。换句话说，偏差的增加被方差的减少所抵消。\n\
  \n最知名的样本重用方法是 *交叉验证*。数据被分为 *k* 个段（通常大小相等），其中一部分留作测试，其余 *k−1* 部分用于训练模型。然后该过程对每个段重复，并将得到的准确性度量在\
  \ *k* 个段上平均。当 *k=n* 时，每个数据点构成一个段， resulting 过程称为 *留一法* 验证。\n\n交叉验证的替代方法是使用自助样本。我们在前几章中看到，自助法可用于获得置信区间和\
  \ *p*-值。当目标是模型验证时，以相同方式获得的自助样本可用于校正过拟合。第 8.6 节将向你展示如何操作。\n\n## 8.2 Liver Surgery\
  \ Example\n\n我们将在本章中作为示例使用来自肝脏外科领域的数据集。手术是肝癌患者最有希望的治疗选择。Liver 数据集包含 554 例切除肝肿瘤手术的记录。它是\
  \ Jarnagin 等人（2002）分析的数据的子集。变量包括人口统计学、术前患者特征如现有合并症、手术变量如失血量，以及术后变量如手术后并发症的发生和严重程度。\n\
  \n\n\n\n\n由于肝肿瘤的特性，以及肝脏具有独特的再生能力，大多数手术都包括切除肝脏的相当大一部分。这使患者面临并发症风险升高的情况。在手术前预测并发症的可能性，可以使负责的医生和护士团队根据需要增加对患者的术后监测。这对于向患者及其家属进行咨询也很有帮助。\n\
  \n我们将使用以下术前变量作为术后并发症的潜在预测因子：年龄、是否存在任何合并症、手术范围（广泛 vs. 局限，其中广泛定义为切除整个肝叶或一侧肝脏的手术）、双侧手术（是否涉及肝脏两侧叶的切除），以及切除的节段数（节段是肝脏的八个解剖分区之一）。年龄和节段数被视为连续变量。典型的切除节段数在\
  \ 1 到 4 之间，但偶尔会切除 5 或 6 个节段。\n\n## 8.3 ROC 曲线的再代入估计\n\n下面的代码基于 PROC LOGISTIC 使用逐步模型选择方法构建预测。逻辑回归是\
  \ SAS/STAT 中可用于构建二元结果预测模型的众多选项之一。同样，逐步选择是多种可用的模型选择技术之一。这里的目标并不是声称逻辑回归是构建预测模型的最佳方法，也不是推广逐步作为模型选择策略。重点在于使用多种技术进行模型验证。\n\
  \n```\nproc logistic data=liver;\n    model complications=age_at_op comorb lobeormore_code\n\
  \        bilat_resec_code numsegs_resec /selection=stepwise;\nrun;\n```\n\n此 PROC\
  \ LOGISTIC 调用请求使用逐步方法选择模型。逐步选择一次引入一个变量，然后根据其统计显著性水平在需要时将其移除。以下是逐步选择的算法总结：\n\n- 1.\
  \ 对于每个候选变量，通过将该变量添加到上一步的现有模型中生成 p 值。在第一步，所有模型语句中的变量都是候选变量，现有模型是仅截距模型。\n- 2. 选择显著性最高（p\
  \ 值最低）的候选变量，并用所选变量的加入更新现有模型。如果没有变量满足进入标准（默认 p≤0.05，但可使用 MODEL 语句的 SLE 选项进行调整），则认为现有模型为最终模型。\n\
  - 3. 从现有模型中移除失去显著性（默认 p>0.05，但可使用 MODEL 语句的 SLS 选项进行调整）的任何变量。如果有多个变量失去显著性，则一次移除一个变量，从\
  \ p 值最高的变量开始。每次移除后，通过重新拟合模型重新生成 p 值。将被移除的变量返回到候选变量列表。\n- 4. 此时，现有模型中的所有变量都应按 SLS\
  \ 标准显著。所有其他变量应位于候选变量列表中。转到步骤 1 并重复该过程，直到候选变量均不显著且现有模型中的变量均无法移除。\n\n逐步选择是一个被广泛研究且颇具争议的话题。这里使用它来演示模型选择的数据依赖性，并大致说明模型选择程序如何尝试选择一个对数据拟合最佳且对过拟合几乎没有或没有惩罚的模型。尽管逐步选择有替代方案或修改形式，但通常大多数形式的模型选择都会导致过拟合。\n\
  \n相关结果部分显示在输出 8.1 中。第一张表总结了逐步选择。在此示例中，六个变量中只有两个被发现显著：切除的节段数和年龄。\n\n### Output 8.1\n\
  \n逐步选择摘要\nStep  Effect  Number  Score  Wald\n      Entered Removed DF In Chi-Square\
  \ Chi-Square Pr > ChiSq\n1 NUMSEGS_RESEC 1 1 52.6217 <.0001\n2 AGE_AT_OP 1 2 7.9473\
  \ 0.0048\n\n最大似然估计分析\nParameter DF Estimate Standard Error Wald Chi-Square Pr >\
  \ ChiSq\nIntercept 1 2.0959 0.3867 29.3791 <.0001\nAGE_AT_OP 1 -0.0166 0.00596 7.7810\
  \ 0.0053\nNUMSEGS_RESEC 1 -0.3475 0.0518 45.0295 <.0001\n\n优势比估计\nEffect Point Estimate\
  \ 95% Wald Confidence Limits\nAGE_AT_OP 0.984 0.972 0.995\nNUMSEGS_RESEC 0.706 0.638\
  \ 0.782\n\n预测概率与观察响应的关联\nPercent Concordant 69.4 Somers' D 0.392\nPercent Discordant\
  \ 30.3 Gamma 0.393\nPercent Tied 0.3 Tau-a 0.196\nPairs 76720 c 0.696\n\n熟悉的 PROC\
  \ LOGISTIC 输出表明，该双变量模型的 AUC 为 0.696，我们认为该估计是乐观的，其原因如前所述。对应于该模型的 ROC 曲线绘制在图 8.1 中。当然，被高估的不仅是\
  \ ROC 曲线下的面积；对于每个特异性值而言，估计的敏感性也是乐观的。\n\n## Figure 8.1 Resubstitution Estimate of\
  \ the ROC Curve for the Liver Resection Data\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_109_0.png)\n\
  \n## 8.4 ROC 曲线的样本分割估计\n\n现在，我们将看到如何使用验证来减少再代入估计中的偏差。样本分割验证的第一步是将数据集分为两部分：训练样本和测试样本。它们不必大小相等。事实上，传统上训练集大于测试集。常用的分割比例是\
  \ 2:1，其中三分之二的观测值分配给训练集，剩余三分之一分配给测试集。该分割通常是随机进行的，尽管有时你可能希望使用分层分割。分层分割确保一个变量（或最多几个变量）的比例在训练集和测试集中均出现。\n\
  \n在样本分割后，预测模型在训练集上构建，并在测试集上使用在训练集上优化的模型获得 ROC 曲线所需的估计。\n\n在 SAS 中可以通过多种方式进行样本分割。以下\
  \ DATA 步是一个示例：\n\n```\ndata training test;\n    set liver;\n    seed=12061996;\n\
  \    unif=ranuni(seed);\n    if unif>0.333 then output training;\n    else output\
  \ test;\nrun;\n```\n\n在此 DATA 步中，使用 RANUNI 函数生成均匀随机变量 Unif。然后根据 Unif 随机变量的相应实现，将每个观测值分配到训练集或测试数据集。基本上，Unif\
  \ 变量代表一个有偏硬币翻转，决定所考虑的观测值是用于训练模型还是测试模型。\n\nUnif 的阈值选为 0.333；因此，大约三分之一的记录将具有 unif<0.333。由于\
  \ Unif 是一个随机变量，此随机变量的每次实现都会产生 unif<0.333 的记录比例略有不同的结果。因此，这种方法并不总是产生精确的 2:1 匹配。如果需要精确的\
  \ 2:1 分割，则可以先按 Unif 对数据进行排序，然后从排序序列的开头取出训练数据所需数量的记录（在此示例中为所有记录的恰好三分之二），其余记录分配给测试集。在大多数情况下，精确分割是不必要的，以上给出的代码就足够了。\n\
  \n创建训练集和测试集后，第一项任务是使用训练数据拟合模型，如下所示：\n\n```\nproc logistic data=training outmodel=model1;\n\
  \    model complications=age_at_op comorb lobeormore_code\n        bilat_resec_code\
  \ numsegs_resec / selection=s;\nrun;\n```\n\n此对 PROC LOGISTIC 的调用与主要区别在于 OUTMODEL=\
  \ 选项，该选项保存拟合模型的详细信息，例如参数估计值和标准误差。OUTMODEL= 选项的强大之处通常在与它的姐妹选项 INMODEL= 结合使用时更为明显，后者接受由\
  \ OUTMODEL= 选项保存的模型，如下所示：\n\n```\nproc logistic inmodel=model1;\n    score data=test\
  \ out=testscore;\nrun;\n```\n\n请注意没有 MODEL 语句。这是因为不希望进行新的模型拟合。相反，所有计算都基于 INMODEL=\
  \ 选项指定的模型。SCORE 语句使用 INMODEL= 选项指定的拟合模型对测试数据集生成预测。SCORE 语句的 OUT= 选项生成一个数据集，其中包含预测概率以及\
  \ DATA= 选项指定的数据集中所有原始变量。\n\n此时，你可以使用第 3 章中开发的技术使用 %PLOTROC 宏绘制 ROC 曲线，或使用 %ROC 宏计算曲线下面积。从测试集生成的\
  \ ROC 曲线及其下面积被认为是真实 ROC 曲线和 AUC 的无偏估计。关键观察是 SCORE 语句获得的预测概率充当标记值。例如，以下对 %ROC 宏的调用产生样本分割的\
  \ AUC 估计（见输出 8.2），结果为 0.677，大约比再代入估计的 0.696 低 0.02，说明了再代入估计中的乐观性：\n\n```\n%roc(data=testscore,\
  \ var=p_1, response=complications, contrast=1,\n        details=no, alpha=.05);\n\
  ```\n\n\n\n\n\n## Output 8.2\n\n```\nThe ROC Macro\n\n        ROC Curve Areas and\
  \ 95%\n            Confidence Intervals\n    ROC Area Std Error Confidence Limits\n\
  \nP_1    0.6767    0.0414    0.5957    0.7578\n```\n\n请注意 P_1 是 SCORE 语句分配给预测值的变量名。\n\
  \n也可以使用第 3 章中介绍的 %PLOTROC 宏绘制分割样本 ROC 曲线。由于 P_1 给出到若干有效数字，因此在数据集 TESTSCORE 中创建了一个新变量\
  \ P1 以便于打印阈值。P1 的创建方式如下：\n\n```\nP1 = ROUND(P_1,0.01);\n```\n\n然后使用以下 %PLOTROC 调用：\n\
  \n```\n%PLOTROC (dsn=testscore, marker=p1, gold=complications, anno=4,\n       \
  \         tlist=0.45 0.51 0.58);\n```\n\n## Figure 8.2 Split-Sample Estimate of\
  \ the ROC Curve Using the %PLOTROC Macro\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_111_0.png)\n\
  \n请注意，图 8.2 中的阈值以预测概率描述，因为绘制的标记是 logistic 模型中的预测概率（参见 %PLOTROC 宏调用中的 MARKER=）。\n\
  \n作为 %PLOTROC 宏的替代方案，您可以使用 SCORE 语句的 OUTROC= 选项，该选项生成的数据集在结构上与 MODEL 语句中的 OUTROC=\
  \ 选项相同。具体而言，它包含变量 _SENSIT_ 和 _1MSPEC_，可用于 PROC GPLOT 调用中的 PLOT 语句。\n\n```\nproc\
  \ logistic inmodel=model1;\n    score data=test out=testscore outroc=rocvalid;\n\
  run;\n```\n\n最后，叠加重抽样估计和分割样本估计是有启发性的。这在图 8.3 中实现，该图显示了两条 ROC 曲线，一条通过重抽样获得，另一条通过分割样本验证获得。重抽样曲线在大部分情况下位于分割样本曲线之上，但存在分割样本曲线上升超过重抽样曲线的区域。这似乎与重抽样会导致\
  \ ROC 曲线上所有点都被高估的预期相悖。这突出了分割样本方法的首要缺点；即，它只提供一个测试集，在该测试集上可以计算准确性估计值（如给定特异性下的敏感性）。尽管它提供了无偏估计，但这些估计包含相当大的变异性，我们刚刚观察到的这种情况并不少见。这是使用下一节中讨论的样本重用方法的主要原因。\n\
  \n## Figure 8.3 Comparison of the Resubstitution and Split-Sample Estimates of the\
  \ ROC Curve for the Liver Resection Example\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_112_0.png)\n\
  \n## 8.5 Cross-Validation Estimates of the ROC Curve\n\n### 8.5.1 Leave-One-Out\
  \ Estimation\n\nPROC LOGISTIC 提供了一个内置选项用于交叉验证，即执行留一法。如本章介绍中简要解释的那样，留一法通过暂时剔除一个观测值，在剩余数据集上构建模型，然后使用该模型预测被剔除的记录来实现。当此过程对每个观测值重复时，使用对预测观测值“盲”的模型为数据集中每条记录获得一个预测。这些预测构成了交叉验证\
  \ ROC 曲线的<|message|> 基础。\n\n可以使用以下代码通过 PROC LOGISTIC 执行留一交叉验证。OUTPUT 语句中的 PREDPROBS=X\
  \ 选项指定使用留一交叉验证而不是重抽样。此选项适用于 OUTPUT 语句生成的所有预测概率。如果省略 PREDPROBS= 选项，则预测概率使用重抽样计算。\n\
  \n```\nproc logistic data=liver;\n    model complications=age_at_op comorb lobeormore_code\n\
  \        bilat_resec_code numsegs_resec / selection=s;\n    output out=outx predprobs=x;\n\
  \    ods output classification=classroc;\nrun;\n```\n\n现在可以使用与分割样本验证推荐的相同方法绘制 ROC\
  \ 曲线，包括其中一个绘图宏。ROC 曲线下面积及其标准误差可通过 %ROC 宏获得。以下对 %ROC 宏的调用使用 PROC LOGISTIC 在指定 PREDPROBS=X\
  \ 选项时创建的数据集，生成留一估计的 AUC（Output 8.3）。交叉验证预测概率的变量名为 XP_1：\n\n```\n%roc(data=outx,\
  \ var=xp_1, response=complications, contrast=1);\n```\n\n## Output 8.3\n\n```\n\
  The ROC Macro\n\n        ROC Curve Areas and 95%\n            Confidence Intervals\n\
  \    ROC Area Std Error Confidence Limits\n\nXP_1  0.6875    0.0226    0.6431  \
  \  0.7318\n```\n\n通过留一交叉验证获得的 AUC 估计值为 0.6875，置信区间为 0.6431–0.7318。图 8.4 对比了 ROC\
  \ 曲线的重抽样估计和留一估计。虽然两条曲线非常接近，但留一估计始终低于重抽样估计。\n\n## Figure 8.4 Comparison of the Resubstitution\
  \ and Leave-One-Out Estimates of the ROC Curve for the Liver Resection Example\n\
  \n![](img/ac26020abd4f22abfaafc0607939c6e4_114_0.png)\n\n乍一看，在此示例中使用 OUTROC= 选项绘制\
  \ ROC 曲线似乎是合理的。然而，PREDPROBS=X 选项不影响 MODEL 语句中 OUTROC= 选项创建的数据集。即使同时指定 OUTROC= 和\
  \ PREDPROBS=X 选项，OUTROC= 选项创建的数据集仍报告重抽样估计值。同样，相关性度量包括 c 和 Somers’ D 也按重抽样基准报告。因此，通常用于获得\
  \ ROC 点和曲线下面积的方法不适用于交叉验证，这些任务必须在 PROC LOGISTIC 外部手动执行。\n\n### 8.5.2 K-Fold Cross-Validation\n\
  \n虽然指定 PREDPROBS=X 选项是获得留一估计的便捷方法，但您应该了解更多关于如何在 SAS 中使用 %XVAL 宏执行交叉验证的信息。您可以使用此宏执行\
  \ k 折交叉验证。当使用 PROBIT、GENMOD 或 GAM 等不提供标准交叉验证选项的其他过程进行预测时，这也很有帮助。\n\nk 折交叉验证的起点涉及将数据划分为\
  \ k 个随机选择的段，其中 k 由用户提供。在 k 折交叉验证中，分析重复 k 次。对于每次分析，其中 k 个段中的一个被留作测试集，其余 k−1 个用于训练。在每次分析中，模型对测试数据是盲的。表\
  \ 8.1 解释了 k=5 的特殊情况下每个段在交叉验证中的作用。\n\n## Table 8.1 The Role of Segments within Each\
  \ Analysis in Five-Fold Cross-Validation\n\n|  | Segment 1 | Segment 2 | Segment\
  \ 3 | Segment 4 | Segment 5 |\n|---|---|---|---|---|---|\n| Analysis 1 | Training\
  \ | Training | Training | Training | Test |\n| Analysis 2 | Training | Training\
  \ | Training | Test | Training |\n| Analysis 3 | Training | Training | Test | Training\
  \ | Training |\n| Analysis 4 | Training | Test | Training | Training | Training\
  \ |\n| Analysis 5 | Test | Training | Training | Training | Training |\n\n这种验证方案有几个优点：\n\
  \n- 它在概念上很简单。\n- 每个段（因此每个数据点，因为段不重叠）恰好在测试集中出现一次，因此对每个数据点只进行一次预测。\n- k 的选择允许在训练集和测试集的大小上进行一定的灵活性。\n\
  \n第二点构成了我们目的的验证基础。由于每个观测值都有一个预测，因此可以直接从这些预测值获得 ROC 曲线。这可以通过使用上一节中描述的任何方法实现，因为从获得\
  \ ROC 曲线的角度来看，使用 PROC LOGISTIC 的 SCORE 语句获得的数据集与 k 折交叉验证的 k 次分析中合并的测试数据之间没有区别。\n\
  \n%XVAL 宏可从本书的配套网站 support.sas.com/gonen 获得，可执行交叉验证。K 是宏的输入之一，以及数据集名称、结果和协变量。%XVAL\
  \ 宏不产生输出，但生成一个名为 _XVAL_ 的数据集，其中包含交叉验证的预测概率（P_0 和 P_1=1-P_0）以及原始变量。此结果数据集可用于对 %PLOTROC\
  \ 和 %ROC 宏的调用，以获得 ROC 曲线及其下面积的交叉验证估计。例如，以下三个宏调用对 Liver 数据执行五折交叉验证：\n\n```\n%xval(dsn=liver,outcome=complications,covars=age_at_op\
  \ comorb lobeormore_code bilat_resec_code numsegs_resec,k=5);\n%plotroc(xval,P_1,COMPLICATIONS,anno=2);\n\
  %roc(data=xval,var=P_1,response=COMPLICATIONS,CONTRAST=1);\n```\n\n%PLOTROC 宏生成的\
  \ ROC 曲线出现在图 8.5 中，%ROC 宏的结果出现在 Output 8.4 中。五折验证 AUC 的估计值为 0.6883，标准误差为 0.0226，几乎与留一估计无法区分。\n\
  \n\n\n\n\n### 图 8.5 五折交叉验证的 ROC 曲线估计\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_116_0.png)\n\
  \n## 输出 8.4\n\n```\nThe ROC Macro\n\n        ROC Curve Areas and 95%\n         \
  \   Confidence Intervals\nROC Area Std Error Confidence Limits\nP_1  0.6883    0.0226\
  \    0.6440    0.7326\n```\n\n交叉验证的需求不仅限于由 PROC LOGISTIC 拟合的线性 logistic 模型。其他接受类似数据但使用不同方法拟合模型的\
  \ SAS 过程，例如 PROC GENMOD、PROC GAM 和 PROC PROBIT，也能从交叉验证方案中受益。很难编写一个适用于所有过程的通用宏，因为每个过程的输出语法和输出传送系统\
  \ Output Delivery System (ODS) 表名都不同。但相对容易将 %XVAL 宏为不同过程量身定制。宏中的初始 DATA 步在数据集中添加一个变量\
  \ XV，该变量取值从 1 到 K，表示观测值属于哪一折。此部分独立于统计预测模型或使用的 SAS 过程。你必须修改使用 PROC LOGISTIC 的代码部分。此修改需要特定过程的专业知识，可能由具有特定过程和宏编程经验的用户完成。\n\
  \n## 8.6 ROC 曲线的 Bootstrap 验证估计\n\n另一种通过验证获得 ROC 曲线的样本重用方法是使用 bootstrap 样本。这不如交叉验证直观，但在某些情况下，其估计的方差可能更低。\n\
  \nBootstrap 验证首先通过形成 B 个 bootstrap 样本开始。对于交叉验证，K 是一个较小数字，约为 5 到 10，而对于 bootstrap\
  \ 验证，B 通常会更大，至少数百个，也许 1,000 个。然后每个 bootstrap 样本用作训练样本。然后原始数据集和 bootstrap 样本用作测试样本。感兴趣的度量，例如\
  \ AUC，使用原始数据作为测试样本估计的值与使用 bootstrap 样本作为测试样本估计的感兴趣度量之间的差异是 *乐观* 的度量。此差异可以从感兴趣度量的重代入估计中减去，以获得\
  \ bootstrap 验证估计。这样产生的估计有时称为 *乐观校正* 或 *乐观调整* 估计。\n\n算法如下：\n\n+   1. 在原始数据集上计算感兴趣的度量\
  \ M，记为 Mₒ。\n+   2. 创建 B 个 bootstrap 样本。对于 i=1, ... B，执行以下操作：\n+      a. 在 bootstrap\
  \ 样本上训练模型\n+      b. 使用训练好的模型在原始数据上计算 M；记为 Mₒᵢ\n+      c. 使用训练好的模型在 bootstrap 样本上计算\
  \ M；记为 M_bᵢ\n+      d. 计算差异：dᵢ = Mₒᵢ − M_bᵢ\n+   3. 从 Mₒ 中减去 mean(dᵢ)。这是 bootstrap\
  \ 验证的感兴趣度量。\n\n%BVAL 宏，其语法与 %XVAL 宏相似，生成两个数据集 BVAL1 和 BVAL2，分别包含使用原始数据和 bootstrap\
  \ 样本的预测概率。它还计算乐观 AUC、乐观校正和校正后 AUC。\n\n```\n%bval(dsn=liver,outcome=complications,covars=age_at_op\
  \ comorb lobeormore_code bilat_resec_code numsegs_resec,B=100);\n```\n\n输出 8.5 是使用\
  \ 100 个 bootstrap 样本运行 %BVAL 宏得到的结果。\n\n## 输出 8.5\n\n| The SAS System |\n| Optimistic\
  \ AUC | Optimism Correction | CorrectedAUC |\n| 0.695842 | 0.007179 | 0.688663 |\n\
  \n当从重代入估计 0.695842 中减去 0.007179 的乐观校正时，AUC 的 bootstrap 验证估计为 0.6887。注意，这与上一节中获得的五折交叉验证估计几乎相同。实际上，对于合理大的数据集，留一法、k\
  \ 折交叉验证和 bootstrap 方法会产生相似的结果，选择将取决于应用领域的传统以及软件的可及性。\n"
- "## SAS Enterprise Miner 中的 ROC 曲线\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_119_0.png)\n\
  \n+   9.1 引言 ......................................................... 109\n+  \
  \ 9.2 房屋净值贷款示例 ............................................... 110\n+   9.3 SAS\
  \ Enterprise Miner 中单个模型的 ROC 曲线 ............. 111\n+   9.4 SAS Enterprise Miner\
  \ 中竞争模型的 ROC 曲线 ........ 113\n+   9.5 使用 PROC GPLOT 从 SAS Enterprise Miner 导出的 ROC\
  \ 曲线 ......................................................... 116\n\n## 9.1 引言\n\
  \nSAS Enterprise Miner 是一套数据挖掘工具。它于 1998 年推出，主要由营销分析师、数据库营销人员、风险分析师、欺诈调查员以及其他试图在大量数据中寻找模式的专业人士使用。SAS\
  \ Enterprise Miner 运行在标准的 SAS 平台上，但它使用图形用户界面 GUI，与 SAS 使用的其他任何界面都不同。此外，虽然其运行的 SAS\
  \ 引擎是可访问的，但 SAS Enterprise Miner 的设计前提是用户将通过其 GUI 访问它。这与本书迄今为止的重点 Base SAS 和 SAS/STAT\
  \ 形成对比，后者主要通过程序编辑器和运行代码段来访问。\n\nSAS Enterprise Miner 为数据挖掘提供多种方法，包括聚类、降维、链接分析和预测建模。本章重点关注预测建模。在第\
  \ 8 章中，我们研究了多变量预测模型的 ROC 曲线，并保留 logistic 回归来演示多变量模型中出现的问题以及使用 SAS/STAT 的解决方案。在许多方面，本章是第\
  \ 8 章的扩展，因为它使用 SAS Enterprise Miner 的功能来检查分类树和神经网络。\n\nSAS Enterprise Miner 具有内置功能，可作为模型评估的一部分生成\
  \ ROC 曲线。此外，你可以从生成 ROC 曲线时在后台创建的表中创建一个 SAS 数据集。此数据集然后可与前几章中开发的技术一起用于增强绘图。最后，你可以在\
  \ SAS Enterprise Miner 中使用为此目的开发的预测模型对数据集进行评分。评分结果也可以保存为 SAS 数据集，使你能够根据需要访问第 3 章至第\
  \ 6 章的建模方法。事实上，甚至可以生成用于评分的 SAS 代码。\n\n本章无意作为 SAS Enterprise Miner 的全面指南。模型构建和选择的核心数据挖掘步骤仅在有助于你理解所得数据曲线的程度上进行介绍。我们在此使用的各种中间步骤，例如缺失数据插补，可能不适用于其他数据挖掘练习。要获得\
  \ SAS Enterprise Miner 的扎实背景，请参阅 Patricia Cerrito 所著的《使用 SAS Enterprise Miner 进行数据挖掘入门》2006\
  \ 年版。\n\n本章的读者是 SAS Enterprise Miner 用户，尤其是那些尚未使用该软件进行 ROC 曲线分析的用户。这里假设你已熟悉第 3 章水平的\
  \ ROC 曲线，因此此时快速阅读第 3 章可能有用。\n\n## 9.2 房屋净值贷款示例\n\n本章示例的数据来自 SAS Enterprise Miner\
  \ 的示例数据库 Sampsio.Hmeq。库 Sampsio 在加载 SAS Enterprise Miner 时内部定义，其中包含此数据集。它包含近 6,000\
  \ 条记录和 13 个变量，其中一个是数据挖掘语言中的结果变量或目标。数据集描绘了一家金融服务公司的房屋净值贷款记录。约 20% 的过去房屋净值信用额度导致违约。为了试图降低违约率，或许生成申请人定制的利率，公司希望建立一个预测房屋净值贷款违约风险的模型。目标变量称为\
  \ BAD，值为 1 表示违约，0 表示正常服务贷款。12 个预测变量及其简要定义如下：\n\n+   - CLAGE：最老信用额度年龄（月）\n+   - CLNO：信用额度数量\n\
  +   - DEBTINC：债务收入比\n+   - DELINQ：拖欠信用额度数量\n+   - DEROG：重大不良报告数量\n+   - JOB：债务人职业\n\
  +   - LOAN：贷款金额\n+   - MORTDUE：现有抵押贷款到期金额\n+   - NINQ：近期信用查询次数\n+   - REASON：贷款原因（债务合并或房屋改善）\n\
  +   - VALUE：房产价值\n+   - YOJ：在现职工作年限\n\n目标是使用数据集中另外 12 个变量为 BAD 变量找到一个预测模型。虽然我们将逐步进行构建预测模型所需的步骤，但重点是使用\
  \ SAS Enterprise Miner 的内置功能构建 ROC 曲线，以及探索如何将预测值导出到 SAS 数据集，以便可以使用前几章中讨论的方法和宏执行自定义分析。\n\
  \n\n\n\n\n## 9.3 SAS Enterprise Miner 中单个模型的 ROC 曲线\n\nSAS Enterprise Miner 将其对象组织在流程图中，其中包含数据、模型和结果。流程图的组成部分称为节点，它们可以连接到流程中的其他节点。流程可以保存为项目，其中可能还包含其他流程。\n\
  \nSAS Enterprise Miner 中的大多数操作都可以通过三种等效方法指定：使用菜单、使用工具栏或使用项目导航器（SAS Enterprise Miner\
  \ 启动时窗口的左侧部分）。工具栏和项目导航器包含可以拖放的图标，因此比使用菜单更方便。您还可以自定义这些图标。\n\n按照以下步骤准备预测建模的数据。首先，定义数据源。这类似于在\
  \ SAS DATA 步中使用 LIBNAME 语句，然后使用 PROC COPY 将所需数据集带到工作区。然后，从数据源中选择一个具体的数据集进行工作。在数据挖掘中，将数据划分为训练、验证和测试数据集是惯例，可以使用数据划分节点完成。训练和验证数据在第\
  \ 8 章中有讨论，其中术语测试数据与验证数据可互换使用。本章的术语遵循 SAS Enterprise Miner 的用法，因此此处的验证数据和测试数据指的是两个不同的实体。验证数据集的使用目的与第\
  \ 8 章中相同，但此处的测试数据集主要用于对验证数据集的发现进行确认。这种做法在数据挖掘以外的领域中不太常见。\n\n以下步骤更精确地描述了如何执行这些任务：\n\
  \n- 1. 通过在项目导航器中右键单击数据来源，选择创建数据源并按菜单操作进行。确保变量 BAD 的模型角色字段为目标且类型为二元。所有其他变量应列为输入。\n\
  - 2. 通过从工具栏或项目导航器拖放创建一个新图表。图表图标描绘了一系列相互连接的方框，上面有一个黄色星星。创建新图表的替代方法包括选择文件→新建→图表或按住\
  \ CTRL 和 Shift 键并按 D。\n- 3. 双击窗口左上角的数据源。将 Home Equity 拖放到图表工作区中（窗口的右侧部分，此时应为空白）。\n\
  - 4. 通过将图标拖放到图表工作区中添加数据划分，或 alternatively 选择操作→添加节点→采样→数据划分。\n- 5. 用箭头连接 Home Equity\
  \ 和数据划分图标。当光标呈铅笔形状时可以绘制箭头。\n\n请注意，图表指定了要执行的操作，但仅指定是不够的以便执行。流程，无论整体还是子集，都需要运行才能执行指定的操作。例如，当数据划分节点运行时，会创建训练、验证和测试集。要运行流程，请右键单击节点并选择运行。所选节点之前及包括该节点的所有节点将按顺序执行。可以随着图表的指定逐个运行每个节点，但分大块运行流程更高效。\n\
  \n现在我们准备进行建模。由于目标变量是二元的，逻辑回归是建模的合理起点。要在 SAS Enterprise Miner 中拟合逻辑模型，您需要添加一个指定此操作的节点，并将回归节点连接到数据划分节点创建的数据集。以下步骤描述了此过程：\n\
  \n- 1. 在模型选项卡高亮显示时，通过拖动图标将回归节点添加到图表中。\n- 2. 用箭头将数据划分节点连接到回归节点。\n- 3. 通过从评估选项卡拖放将模型比较节点添加到图表中，并用箭头将其连接到回归节点。\n\
  \n此时，显示应大致如图 9.1 所示。\n\n## 图 9.1 使用逻辑回归预测房屋净值贷款违约\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_122_0.png)\n\
  \n现在，右键单击模型比较节点并选择运行。一旦节点运行，其结果将在整个 SAS Enterprise Miner 会话中保持可用。图表和结果默认保存，并在以后重新启动\
  \ SAS Enterprise Miner 会话时可用。\n\n当模型比较节点运行时，右键单击该节点并选择结果。会出现一个新窗口，其中包含标题为拟合统计、输出和\
  \ ROC 图的子窗口。在 ROC 图子窗口中，有三条 ROC 曲线，分别对应每个数据集：训练、验证和测试。图 9.2 仅聚焦于训练集的 ROC 曲线，显示在左上角。45\
  \ 度参考线，在图例中称为基线，默认绘制。随着您沿曲线移动光标，弹出文本框会提供该 ROC 曲线点的灵敏度和特异性详细信息。图 9.2 包含一个示例点，其中灵敏度为\
  \ 50.5%，一减去特异性为 94.9%。\n\n## 图 9.2 使用房屋净值贷款数据对逻辑回归模型的 ROC 曲线\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_123_0.png)\n\
  \n如输出 9.1 所示，曲线下面积在输出窗口中 readily 报告，标记为 ROC 指数，分别为训练、验证和测试集的 0.72385、0.69319 和 0.67768。\n\
  \n## 输出 9.1\n\n```\nFit Statistics\nModel selection based on _TMISC_\n\nTrain: \
  \     Valid:      Test:\nRoc         Roc         Roc\nIndex       Index       Index\n\
  0.72385     0.69319     0.67768\n```\n\n## 9.4 SAS Enterprise Miner 中竞争模型的 ROC 曲线\n\
  \n除了逻辑回归外，我们还将使用 SAS Enterprise Miner 工具包中的另外两种方法：决策树和神经网络。它们在 SAS/STAT 中不可用，因此使用\
  \ SAS 的统计学家可能不熟悉它们。出于这个原因，这里简要描述这些方法。\n\n决策树，也称为统计文献中的递归划分，主要是以分层方式考虑每个变量的二元分割。对于第一次分割，所有变量都会逐一考虑，并保留提供最佳分割的变量（根据常用的几个标准之一，例如误分类率或基尼指数）。不再进一步分割的节点称为*终端节点*或*叶节点*。一旦选择了该变量，相同的过程会再次重复两次，分别针对二元分割的两侧。SAS\
  \ Enterprise Miner 还考虑一个节点一侧的多次分割，因此可能出现一侧为叶节点而另一侧分割多次的树。多项变量被分组为两组，以便得到的二元分组给出最佳分割。同样，连续变量也通过找到最佳截止值分割为两组。房屋净值贷款示例的\
  \ resulting 决策树出现在图 9.3 中。\n\n## 图 9.3 房屋净值贷款示例的示例决策树\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_124_0.png)\n\
  \n例如，第一个使用的变量是 DEBTINC，这是一个连续变量。它在 44.7337 处分割。对于负债收入比小于 44.7337 的人，下一个最佳分割是 VALUE，分割点为\
  \ 303,749。\n\n决策树在重要方面区别于逻辑回归和神经网络：没有统计模型。因为没有模型，所以没有预测方程。当对新观测进行评分时，它会从树的顶部“落下”，并根据协变量的值在每个节点遵循指定的路径，直到到达终端节点（或叶节点）。这可以描述为一系列\
  \ IF-THEN-ELSE 语句形式的规则。\n\n树的二元分割结构是一个优势，因为它易于解释。它也可能是一个缺点，尤其是在某些预测变量是连续的情况下。对连续协变量的分类可能导致效率低下并对预测性能产生不利影响。决策树的另一个优点是它们能非常有效地处理缺失数据。这是通过在每个节点建立替代分割来实现的，当该节点的分割变量缺失时可以使用。\n\
  \n*神经网络*是一个总称，用来描述构建模仿大脑功能的模型的方法。它们的精确数学描述很复杂且不太可能\n\n\n\nbenefit an ROC-focused\
  \ discussion. Think of neural networks as a specific yet flexible class of nonlinear\
  \ regression models.\n\nBefore we run decision trees and neural networks on the\
  \ same data set, there is one important issue to consider about missing data. Both\
  \ logistic regression and neural networks require complete observations. If any\
  \ portion of a record is missing, that record is completely ignored during model\
  \ building. Decision trees are more forgiving. They consider surrogate splits in\
  \ case the variable for the primary split is missing. For this reason, if we run\
  \ logistic regression, neural networks, and decision trees on the same input data,\
  \ the actual data that the predictive model rests on may not be identical from one\
  \ method to the other. You could address this by imputing the value from a distribution\
  \ derived from the normal density. An imputation node can be dragged and dropped\
  \ from the Modify tab, as seen in Figure 9.4. The same figure also shows the addition\
  \ of decision tree and neural network nodes, both dragged and dropped from the Model\
  \ tab.\n\n## Figure 9.4 SAS Enterprise Miner Diagram Workspace for the Competing\
  \ Models Example\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_125_0.png)\n\nThe flow\
  \ in Figure 9.4 implies that the same data set will be analyzed three different\
  \ ways and the results compared in the final node.\n\nThree ROC curves, one for\
  \ each method of analysis, are plotted to better assess the predictive power of\
  \ the models (see Figure 9.5). Neural networks and logistic regression have very\
  \ similar performance. The decision tree outperforms regression and neural networks.\
  \ It has higher sensitivity than the other two for a given value of specificity\
  \ for the most part, especially in the range where both sensitivity and specificity\
  \ are above 0.5. The neural network method is slightly better than the regression\
  \ method, although the difference between the two seems to dissipate in the validation\
  \ and test sets. Output 9.2 reports the AUCs for each model and data set. The AUC\
  \ for the decision tree is consistently above 85%, while the other two models’ AUCs\
  \ cluster around 80%.\n\n## Output 9.2\n\n|  | Train: | Valid: | Test: |\n| Model\
  \ | Roc | Roc | Roc |\n| Node | Index | Index | Index |\n|  |  |  |  |\n| Neural\
  \ | 0.84003 | 0.78812 | 0.80917 |\n| Reg | 0.81356 | 0.78147 | 0.79139 |\n| Tree\
  \ | 0.86871 | 0.85724 | 0.85971 |\n\n## Figure 9.5 ROC Curves from SAS Enterprise\
  \ Miner for Each of the Three Models and Data Sets\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_126_0.png)\n\
  \n## 9.5 ROC Curves Using PROC GPLOT with Exported Data from SAS Enterprise Miner\n\
  \nWhile SAS Enterprise Miner provides a built-in capability for plotting the ROC\
  \ curve, sometimes you might want to output the data set containing the ROC points\
  \ so that you can use the %PLOTROC macro for custom graphics. This can be done by\
