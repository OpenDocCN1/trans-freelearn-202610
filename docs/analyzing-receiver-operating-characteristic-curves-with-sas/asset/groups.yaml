    \ Pr > |Z|  0.0817\n\nExact Test\nOne-sided Pr >= P  0.0523\nTwo-sided = 2 * One-sided\
    \  0.1046\n\nSample Size = 44\n\n以下代码创建 Output 2.3：\n\n```\ntitle \"Specificity\"\
    ;\nproc freq data=m62(where=(observed='No_Frost')) order=freq;\n    table forecast\
    \ / binomial(p=0.75);\n    weight weight;\n    exact binomial;\nrun;\n```\n\n\
    对特异性的输出解释与灵敏度类似。特异性估计为 86.36%，ASE 为 5.17%。基于 ASE 的 95% 置信区间为 (76.22%, 96.50%)，95%\
    \ 精确置信区间为 (72.65%, 94.83%)。检验特异性是否超过预先设定的 75% 目标值得到渐近 p 值为 0.0817，精确 p 值为 0.1046。在此分析下，你会保留原假设。\n\
    \nPROC FREQ 中的 ORDER= 选项在 SAS 默认选择与你想要的二项事件不同时可能很有帮助。这会导致以期望类别的补集方式计算二项比例。你始终可以从输出中减去\
