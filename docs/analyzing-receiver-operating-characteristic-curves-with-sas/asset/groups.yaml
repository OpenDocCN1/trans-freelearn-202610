    G(w) = F(w)^{θ}\n\n由该方程定义的分布族称为 Lehmann 族。该族由 Lehmann 在其关于各种统计检验功效函数研究的开创性著作（Lehmann,\
    \ 1953）中使用。因此，该分布族有时也被称为 Lehmann 备择。\n\n必须认识到，该方程并不能唯一定义标记值的实际分布。它仅在彼此参照的情况下识别分布。因此，半参数一词常用于描述该族。指数分布属于\
