  - "[PAGE 18]\n\nIt is more common to work with true positive and true negative rates,\
    \ defined as\n\n$$TPR = \\frac{TP}{TP + FN}, \\quad TNR = \\frac{TN}{TN + FP}$$\n\
    \nThe true positive rate (TPR) is sometimes called *sensitivity* and the true\
    \ negative rate (TNR) is sometimes called *specificity*. While these are generic\
    \ terms that routinely appear in statistics literature, each field has come up\
    \ with its own terminology. Weather forecasters, for example, use the miss rate\
    \ for FNR and the false alarm rate for FPR.\n\nThe FNR and FPR for the weather\
    \ forecast data are 4/33=12% and 6/44 = 14%, respectively. The sensitivity and\
    \ specificity are 29/33=88% and 38/44=86%, respectively. In this instance, the\
    \ FPR and FNR are both very close to each other. When this is the case, they will\
    \ also be very close to the MR. In fact, the MR is a weighted average of the FPR\
    \ and the FNR: $MR = w*FPR + (1-w)*FNR$, where the weight ($w$) is the proportion\
    \ of nights with an observed frost. This is sometimes called the *prevalence*\
    \ of frost.\n\nNote that the denominators for TPR and TNR are the total observed\
    \ positives and negatives. It is possible to define similar quantities using the\
    \ forecast positives and negatives as the denominator. In this case, the ratios\
    \ corresponding to sensitivity and specificity are called the *positive predictive\
    \ value (PPV)* and *negative predictive value (NPV)*:\n\n$$PPV = \\frac{TP}{TP\
    \ + FP}, \\quad NPV = \\frac{TN}{TN + FN}$$\n\nSAS users familiar with PROC LOGISTIC\
    \ recognize that PPV and NPV are actually called TPR and TNR. This may be a source\
    \ of confusion. This book doesn’t use the established PROC LOGISTIC terminology\
    \ because it defines TPR and TNR consistent with the way they are used in medical\
    \ diagnostics literature. Nevertheless, to minimize confusion, sensitivity and\
    \ specificity are used more often than TPR and TNR.\n\n# 2.5 Computations Using\
    \ PROC FREQ\n\nIt is relatively easy to compute all of these measures in SAS.\
    \ The following DATA step prepares the data for subsequent use by PROC FREQ:\n\
    \n```\ndata m62;\n    input forecast $ observed $ weight;\n    datalines;\nFrost\
    \ Frost 29\nFrost No_Frost 6\nNo_Frost Frost 4\nNo_Frost No_Frost 38\n;\nrun;\n\
    ```\n\nThe following execution of PROC FREQ provides the necessary calculations:\n\
    \n```\nproc freq data=m62;\n    table forecast*observed;\n    weight weight;\n\
    run;\n```"
  - '[PAGE 19]


    Output 2.1 contains many useful pieces of information. As a quick refresher on
    PROC FREQ output, the key to the four numbers in each cell is found in the upper
    left portion of the table. The first number is the frequency (i.e., TP, FP, FN,
    and TN). The second number (Percent) uses the table sum (the sum of column sums
    or the sum of row sums, 77 in this example) as the denominator. The third number
    (Row Pct) is the row percentage (i.e., the proportion that uses row sums as the
    denominator). Finally, the fourth number (Col Pct) is the column percentage using
    column sums as the denominator.


