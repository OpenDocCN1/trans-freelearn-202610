  mdcn: "\n\nbenefit an ROC-focused discussion. Think of neural networks as a specific\
    \ yet flexible class of nonlinear regression models.\n\nBefore we run decision\
    \ trees and neural networks on the same data set, there is one important issue\
    \ to consider about missing data. Both logistic regression and neural networks\
    \ require complete observations. If any portion of a record is missing, that record\
    \ is completely ignored during model building. Decision trees are more forgiving.\
    \ They consider surrogate splits in case the variable for the primary split is\
    \ missing. For this reason, if we run logistic regression, neural networks, and\
    \ decision trees on the same input data, the actual data that the predictive model\
    \ rests on may not be identical from one method to the other. You could address\
    \ this by imputing the value from a distribution derived from the normal density.\
