    \ operating characteristic (ROC)* curve. Figure 3.3 represents the ROC curve corresponding\
    \ to the PET data set.\n\n# Figure 3.3 The ROC Curve for the PET Data Set\n\n\
    ![](img/ac26020abd4f22abfaafc0607939c6e4_29_0.png)\n\nThe dots are referred to\
    \ as *observed operating points* because you can generate a binary marker that\
    \ performs (or *operates*) at the sensitivity and specificity level of any of\
    \ the dots. In this graph, the operating points are connected, leading to the\
    \ so-called *empirical* ROC curve. The implication is that any point on the ROC\
    \ curve is a feasible operating point, although you might have to interpolate\
    \ between the observed marker values to find the correct threshold.\n\nThe ROC\
    \ curve in Figure 3.3 is produced using the following code:\n\n```\nproc logistic\
    \ data=HeadNeck noprint;\n    model gold_standard=suv / outroc=ROCData;\nrun;\n\
    \nsymbol1 v=dot i=join;\nproc gplot data=ROCData;\n    plot _sensit_*_1mspec_;\n\
    \nrun;\nquit;\n```\n\nThe data set produced by the OUTROC= option in PROC LOGISTIC\
    \ automatically computes sensitivity and one minus specificity for each possible\
