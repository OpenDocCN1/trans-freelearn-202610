  - "[PAGE 110]\n\nIn this DATA step, a uniform random variable Unif is generated\
    \ using the RANUNI function. Each observation is then assigned to either the training\
    \ or test data set, depending on the corresponding realization of the Unif random\
    \ variable. Essentially, the Unif variable represents a biased coin flip that\
    \ determines whether the observation under consideration will be used for training\
    \ the model or testing it.\n\nThe threshold for Unif is chosen as 0.333; therefore,\
    \ approximately one-third of the records will have unif<0.333. Unif is a random\
    \ variable, however, and each realization of this random variable produces a slightly\
    \ different proportion of records where unif<0.333. For this reason, this method\
    \ does not always produce an exact 2:1 match. If an exact 2:1 split is required,\
    \ then you can sort the data on Unif first and then the desired number of records\
    \ (in this example, exactly two-thirds of all records) for the training data can\
    \ be taken from the beginning of the sorted sequence while the rest of the records\
    \ are assigned to the test set. In most cases, an exact split is not necessary\
    \ and the code given earlier will be sufficient.\n\nAfter creating the training\
    \ and test sets, the first task is to fit a model using the training data, as\
    \ follows:\n\n```\nproc logistic data=training outmodel=model1;\n    model complications=age_at_op\
    \ comorb lobeormore_code\n        bilat_resec_code numsegs_resec / selection=s;\n\
    run;\n```\n\nThe primary difference in this call to PROC LOGISTIC is the OUTMODEL=\
    \ option, which saves the details of the fitted model such as the parameter estimates\
    \ and standard errors. The strength of the OUTMODEL= option is often more evident\
    \ when it is combined with its sister option, INMODEL=, which accepts a model\
    \ saved by the OUTMODEL= option as seen here:\n\n```\nproc logistic inmodel=model1;\n\
    \    score data=test out=testscore;\nrun;\n```\n\nNote the absence of a MODEL\
    \ statement. This is because a new model fit is not desired. Instead, all the\
    \ calculations are based on the model specified by the INMODEL= option. The SCORE\
    \ statement generates predictions on the test data set using the model fit specified\
    \ in the INMODEL= option. The OUT= option of the SCORE statement generates a data\
    \ set that contains predicted probabilities in addition to all the original variables\
    \ in the data set specified in the DATA= option.\n\nAt this point, you can use\
    \ the techniques developed in Chapter 3 to plot an ROC curve using the %PLOTROC\
    \ macro or you can compute the area under the curve using the %ROC macro. The\
    \ ROC curve and the area under it generated from the test set are considered unbiased\
    \ estimates of the true ROC curve and the AUC. The key observation is that the\
    \ predicted probabilities obtained by the SCORE statement serve as the marker\
    \ values. For example, the following call to the %ROC macro produces the split-sample\
    \ estimate of the AUC curve (see Output 8.2), which turns out to be 0.677, roughly\
    \ 0.02 less than the resubstitution estimate of 0.696, illustrating the optimism\
    \ in the resubstitution estimates:\n\n```\n%roc(data=testscore, var=p_1, response=complications,\
    \ contrast=1,\n        details=no, alpha=.05);\n```"
  md: "\nDue to the nature of liver tumors, and aided by the fact that the liver has\
    \ a unique ability to regenerate, most surgeries include removal of a substantial\
    \ portion of the liver. This exposes patients to an elevated risk of complications.\
    \ Predicting the likelihood of complications before surgery enables the treating\
    \ team of physicians and nurses to increase post-operative monitoring of the patient\
    \ as necessary. It is also helpful for counseling the patient and the patient’s\
    \ family.\n\nWe will use the following preoperative variables as potential predictors\
    \ of post-operative complications: age, presence of any co-morbid conditions,\
    \ extent of surgery (extensive vs. limited, where extensive is defined as an operation\
    \ in which at least an entire lobe, or side, of the liver is resected), bilateral\
    \ surgery (whether both lobes of the liver were involved in the resection or not),\
    \ and number of segments resected (a segment is one of the eight anatomical divisions\
    \ of the liver). Age and number of segments are considered as continuous variables.\
    \ The typical number of resected segments is between 1 and 4, but occasionally\
    \ 5 or 6 segments are taken out.\n\n## 8.3 Resubstitution Estimate of the ROC\
    \ Curve\n\nThe following code builds the predictions based on PROC LOGISTIC using\
    \ a stepwise model selection method. Logistic regression is one of the many options\
    \ available in SAS/STAT to build a predictive model for a binary outcome. Similarly,\
    \ stepwise selection is one of several available model selection techniques. The\
    \ goal here is not to claim logistic regression as the best way to build a predictive\
    \ model, nor to promote stepwise as a model selection strategy. The emphasis is\
    \ on model validation using several techniques.\n\n```\nproc logistic data=liver;\n\
    \    model complications=age_at_op comorb lobeormore_code\n        bilat_resec_code\
    \ numsegs_resec /selection=stepwise;\nrun;\n```\n\nThis invocation of PROC LOGISTIC\
    \ requests a model to be selected using the stepwise method. Stepwise selection\
    \ enters variables one by one and then removes them as needed according to their\
    \ level of statistical significance. The following is an algorithmic summary of\
    \ stepwise selection:\n\n- 1. For each candidate variable, generate a p-value\
    \ by adding the variable to the existing model from the previous step. In the\
    \ first step, all variables in the model statement are candidates and the existing\
    \ model is the intercept-only model.\n- 2. Choose the candidate variable with\
    \ the highest significance (lowest p-value) and update the existing model with\
    \ the addition of the chosen variable. If no variables meet the criterion for\
    \ entry (p≤0.05 by default but can be tailored using the SLE option of the MODEL\
    \ statement), then the existing model is considered final.\n- 3. Remove any variable\
    \ that loses significance (p>0.05 by default but can be tailored using the SLS\
    \ option of the MODEL statement) from the existing model. If several variables\
    \ have lost significance, remove each variable one by one starting with the variable\
    \ with the highest p-value. After each removal, p-values are regenerated by refitting\
    \ the model. Return the removed variables to the list of candidates.\n- 4. At\
    \ this point, all the variables in the existing model should be significant by\
    \ the SLS criterion. All the other variables should be in the list of candidates.\
    \ Go to Step 1 and repeat the process until none of the candidate variables are\
    \ significant and none of the variables in the existing model can be removed.\n\
    \nStepwise selection is a widely studied and somewhat controversial topic. It\
    \ is used here to demonstrate the data-dependent nature of model selection and\
    \ give a sense of how model selection procedures try to choose a model that provides\
    \ the best fit to the data with little or no penalty for over-fitting. Although\
    \ there are alternatives to or modifications of stepwise selection, generally,\
    \ most forms of model selection lead to over-fit.\n\nThe relevant portion of the\
    \ results appears in Output 8.1. The first table summarizes the stepwise selection.\
    \ In this example, only two of the six variables were found to be significant:\
    \ the number of segments resected and the age.\n\n### Output 8.1\n\nSummary of\
    \ Stepwise Selection\nStep  Effect  Number  Score  Wald\n      Entered Removed\
    \ DF In Chi-Square Chi-Square Pr > ChiSq\n1 NUMSEGS_RESEC 1 1 52.6217 <.0001\n\
    2 AGE_AT_OP 1 2 7.9473 0.0048\n\nAnalysis of Maximum Likelihood Estimates\nParameter\
    \ DF Estimate Standard Error Wald Chi-Square Pr > ChiSq\nIntercept 1 2.0959 0.3867\
    \ 29.3791 <.0001\nAGE_AT_OP 1 -0.0166 0.00596 7.7810 0.0053\nNUMSEGS_RESEC 1 -0.3475\
    \ 0.0518 45.0295 <.0001\n\nOdds Ratio Estimates\nEffect Point Estimate 95% Wald\
    \ Confidence Limits\nAGE_AT_OP 0.984 0.972 0.995\nNUMSEGS_RESEC 0.706 0.638 0.782\n\
    \nAssociation of Predicted Probabilities and Observed Responses\nPercent Concordant\
    \ 69.4 Somers' D 0.392\nPercent Discordant 30.3 Gamma 0.393\nPercent Tied 0.3\
    \ Tau-a 0.196\nPairs 76720 c 0.696\n\nThe familiar PROC LOGISTIC output indicates\
    \ that this two-variable model has an AUC of 0.696, an estimate that we think\
    \ is optimistic based on reasons described earlier. The ROC curve corresponding\
    \ to this model is plotted in Figure 8.1. Of course, it is not just the area under\
    \ the ROC curve that is overestimated; the estimated sensitivity for each value\
    \ of specificity is optimistic, too.\n\n## Figure 8.1 Resubstitution Estimate\
    \ of the ROC Curve for the Liver Resection Data\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_109_0.png)\n\
    \n## 8.4 Split-Sample Estimates of the ROC Curve\n\nNow, we’ll see how to reduce\
    \ the bias in resubstitution estimates using validation. The first step in split-sample\
    \ validation is splitting the data set into two parts: training and test samples.\
    \ They do not have to be of equal size. In fact, traditionally the training set\
    \ is taken to be larger than the test set. A 2:1 split is commonly employed, where\
    \ two-thirds of the observations are assigned to the training set and the remaining\
    \ one-third to the test set. This split is usually done at random, although there\
    \ are times when you might want to use a stratified split. A stratified split\
    \ is one that ensures that proportionate amounts of one variable (or, at most,\
    \ a few variables) appear in both training and test sets.\n\nAfter the sample\
    \ is split, the predictive model is built on the training set and estimates required\
    \ for the ROC curve are obtained on the test set using the model optimized on\
    \ the training set.\n\nSplitting the sample can be done in many ways in SAS. The\
    \ following DATA step is one example:\n\n```\ndata training test;\n    set liver;\n\
    \    seed=12061996;\n    unif=ranuni(seed);\n    if unif>0.333 then output training;\n\
    \    else output test;\nrun;\n```\n\nIn this DATA step, a uniform random variable\
    \ Unif is generated using the RANUNI function. Each observation is then assigned\
    \ to either the training or test data set, depending on the corresponding realization\
    \ of the Unif random variable. Essentially, the Unif variable represents a biased\
    \ coin flip that determines whether the observation under consideration will be\
    \ used for training the model or testing it.\n\nThe threshold for Unif is chosen\
    \ as 0.333; therefore, approximately one-third of the records will have unif<0.333.\
    \ Unif is a random variable, however, and each realization of this random variable\
    \ produces a slightly different proportion of records where unif<0.333. For this\
    \ reason, this method does not always produce an exact 2:1 match. If an exact\
    \ 2:1 split is required, then you can sort the data on Unif first and then the\
    \ desired number of records (in this example, exactly two-thirds of all records)\
    \ for the training data can be taken from the beginning of the sorted sequence\
    \ while the rest of the records are assigned to the test set. In most cases, an\
    \ exact split is not necessary and the code given earlier will be sufficient.\n\
    \nAfter creating the training and test sets, the first task is to fit a model\
    \ using the training data, as follows:\n\n```\nproc logistic data=training outmodel=model1;\n\
    \    model complications=age_at_op comorb lobeormore_code\n        bilat_resec_code\
    \ numsegs_resec / selection=s;\nrun;\n```\n\nThe primary difference in this call\
    \ to PROC LOGISTIC is the OUTMODEL= option, which saves the details of the fitted\
    \ model such as the parameter estimates and standard errors. The strength of the\
    \ OUTMODEL= option is often more evident when it is combined with its sister option,\
    \ INMODEL=, which accepts a model saved by the OUTMODEL= option as seen here:\n\
    \n```\nproc logistic inmodel=model1;\n    score data=test out=testscore;\nrun;\n\
    ```\n\nNote the absence of a MODEL statement. This is because a new model fit\
    \ is not desired. Instead, all the calculations are based on the model specified\
    \ by the INMODEL= option. The SCORE statement generates predictions on the test\
    \ data set using the model fit specified in the INMODEL= option. The OUT= option\
    \ of the SCORE statement generates a data set that contains predicted probabilities\
    \ in addition to all the original variables in the data set specified in the DATA=\
    \ option.\n\nAt this point, you can use the techniques developed in Chapter 3\
    \ to plot an ROC curve using the %PLOTROC macro or you can compute the area under\
    \ the curve using the %ROC macro. The ROC curve and the area under it generated\
    \ from the test set are considered unbiased estimates of the true ROC curve and\
    \ the AUC. The key observation is that the predicted probabilities obtained by\
    \ the SCORE statement serve as the marker values. For example, the following call\
    \ to the %ROC macro produces the split-sample estimate of the AUC curve (see Output\
    \ 8.2), which turns out to be 0.677, roughly 0.02 less than the resubstitution\
    \ estimate of 0.696, illustrating the optimism in the resubstitution estimates:\n\
    \n```\n%roc(data=testscore, var=p_1, response=complications, contrast=1,\n   \
    \     details=no, alpha=.05);\n```\n"
  mdcn: "\n\n由于肝肿瘤的特性，以及肝脏具有独特的再生能力，大多数手术都包括切除肝脏的相当大一部分。这使患者面临并发症风险升高的情况。在手术前预测并发症的可能性，可以使负责的医生和护士团队根据需要增加对患者的术后监测。这对于向患者及其家属进行咨询也很有帮助。\n\
    \n我们将使用以下术前变量作为术后并发症的潜在预测因子：年龄、是否存在任何合并症、手术范围（广泛 vs. 局限，其中广泛定义为切除整个肝叶或一侧肝脏的手术）、双侧手术（是否涉及肝脏两侧叶的切除），以及切除的节段数（节段是肝脏的八个解剖分区之一）。年龄和节段数被视为连续变量。典型的切除节段数在\
    \ 1 到 4 之间，但偶尔会切除 5 或 6 个节段。\n\n## 8.3 ROC 曲线的再代入估计\n\n下面的代码基于 PROC LOGISTIC 使用逐步模型选择方法构建预测。逻辑回归是\
    \ SAS/STAT 中可用于构建二元结果预测模型的众多选项之一。同样，逐步选择是多种可用的模型选择技术之一。这里的目标并不是声称逻辑回归是构建预测模型的最佳方法，也不是推广逐步作为模型选择策略。重点在于使用多种技术进行模型验证。\n\
    \n```\nproc logistic data=liver;\n    model complications=age_at_op comorb lobeormore_code\n\
    \        bilat_resec_code numsegs_resec /selection=stepwise;\nrun;\n```\n\n此 PROC\
    \ LOGISTIC 调用请求使用逐步方法选择模型。逐步选择一次引入一个变量，然后根据其统计显著性水平在需要时将其移除。以下是逐步选择的算法总结：\n\n\
    - 1. 对于每个候选变量，通过将该变量添加到上一步的现有模型中生成 p 值。在第一步，所有模型语句中的变量都是候选变量，现有模型是仅截距模型。\n- 2.\
    \ 选择显著性最高（p 值最低）的候选变量，并用所选变量的加入更新现有模型。如果没有变量满足进入标准（默认 p≤0.05，但可使用 MODEL 语句的 SLE\
    \ 选项进行调整），则认为现有模型为最终模型。\n- 3. 从现有模型中移除失去显著性（默认 p>0.05，但可使用 MODEL 语句的 SLS 选项进行调整）的任何变量。如果有多个变量失去显著性，则一次移除一个变量，从\
    \ p 值最高的变量开始。每次移除后，通过重新拟合模型重新生成 p 值。将被移除的变量返回到候选变量列表。\n- 4. 此时，现有模型中的所有变量都应按 SLS\
    \ 标准显著。所有其他变量应位于候选变量列表中。转到步骤 1 并重复该过程，直到候选变量均不显著且现有模型中的变量均无法移除。\n\n逐步选择是一个被广泛研究且颇具争议的话题。这里使用它来演示模型选择的数据依赖性，并大致说明模型选择程序如何尝试选择一个对数据拟合最佳且对过拟合几乎没有或没有惩罚的模型。尽管逐步选择有替代方案或修改形式，但通常大多数形式的模型选择都会导致过拟合。\n\
    \n相关结果部分显示在输出 8.1 中。第一张表总结了逐步选择。在此示例中，六个变量中只有两个被发现显著：切除的节段数和年龄。\n\n### Output\
    \ 8.1\n\n逐步选择摘要\nStep  Effect  Number  Score  Wald\n      Entered Removed DF In\
    \ Chi-Square Chi-Square Pr > ChiSq\n1 NUMSEGS_RESEC 1 1 52.6217 <.0001\n2 AGE_AT_OP\
    \ 1 2 7.9473 0.0048\n\n最大似然估计分析\nParameter DF Estimate Standard Error Wald Chi-Square\
    \ Pr > ChiSq\nIntercept 1 2.0959 0.3867 29.3791 <.0001\nAGE_AT_OP 1 -0.0166 0.00596\
    \ 7.7810 0.0053\nNUMSEGS_RESEC 1 -0.3475 0.0518 45.0295 <.0001\n\n优势比估计\nEffect\
    \ Point Estimate 95% Wald Confidence Limits\nAGE_AT_OP 0.984 0.972 0.995\nNUMSEGS_RESEC\
    \ 0.706 0.638 0.782\n\n预测概率与观察响应的关联\nPercent Concordant 69.4 Somers' D 0.392\n\
    Percent Discordant 30.3 Gamma 0.393\nPercent Tied 0.3 Tau-a 0.196\nPairs 76720\
    \ c 0.696\n\n熟悉的 PROC LOGISTIC 输出表明，该双变量模型的 AUC 为 0.696，我们认为该估计是乐观的，其原因如前所述。对应于该模型的\
    \ ROC 曲线绘制在图 8.1 中。当然，被高估的不仅是 ROC 曲线下的面积；对于每个特异性值而言，估计的敏感性也是乐观的。\n\n## Figure\
    \ 8.1 Resubstitution Estimate of the ROC Curve for the Liver Resection Data\n\n\
    ![](img/ac26020abd4f22abfaafc0607939c6e4_109_0.png)\n\n## 8.4 ROC 曲线的样本分割估计\n\n\
    现在，我们将看到如何使用验证来减少再代入估计中的偏差。样本分割验证的第一步是将数据集分为两部分：训练样本和测试样本。它们不必大小相等。事实上，传统上训练集大于测试集。常用的分割比例是\
    \ 2:1，其中三分之二的观测值分配给训练集，剩余三分之一分配给测试集。该分割通常是随机进行的，尽管有时你可能希望使用分层分割。分层分割确保一个变量（或最多几个变量）的比例在训练集和测试集中均出现。\n\
    \n在样本分割后，预测模型在训练集上构建，并在测试集上使用在训练集上优化的模型获得 ROC 曲线所需的估计。\n\n在 SAS 中可以通过多种方式进行样本分割。以下\
    \ DATA 步是一个示例：\n\n```\ndata training test;\n    set liver;\n    seed=12061996;\n\
    \    unif=ranuni(seed);\n    if unif>0.333 then output training;\n    else output\
    \ test;\nrun;\n```\n\n在此 DATA 步中，使用 RANUNI 函数生成均匀随机变量 Unif。然后根据 Unif 随机变量的相应实现，将每个观测值分配到训练集或测试数据集。基本上，Unif\
    \ 变量代表一个有偏硬币翻转，决定所考虑的观测值是用于训练模型还是测试模型。\n\nUnif 的阈值选为 0.333；因此，大约三分之一的记录将具有 unif<0.333。由于\
    \ Unif 是一个随机变量，此随机变量的每次实现都会产生 unif<0.333 的记录比例略有不同的结果。因此，这种方法并不总是产生精确的 2:1 匹配。如果需要精确的\
    \ 2:1 分割，则可以先按 Unif 对数据进行排序，然后从排序序列的开头取出训练数据所需数量的记录（在此示例中为所有记录的恰好三分之二），其余记录分配给测试集。在大多数情况下，精确分割是不必要的，以上给出的代码就足够了。\n\
    \n创建训练集和测试集后，第一项任务是使用训练数据拟合模型，如下所示：\n\n```\nproc logistic data=training outmodel=model1;\n\
    \    model complications=age_at_op comorb lobeormore_code\n        bilat_resec_code\
    \ numsegs_resec / selection=s;\nrun;\n```\n\n此对 PROC LOGISTIC 的调用与主要区别在于 OUTMODEL=\
    \ 选项，该选项保存拟合模型的详细信息，例如参数估计值和标准误差。OUTMODEL= 选项的强大之处通常在与它的姐妹选项 INMODEL= 结合使用时更为明显，后者接受由\
    \ OUTMODEL= 选项保存的模型，如下所示：\n\n```\nproc logistic inmodel=model1;\n    score data=test\
    \ out=testscore;\nrun;\n```\n\n请注意没有 MODEL 语句。这是因为不希望进行新的模型拟合。相反，所有计算都基于 INMODEL=\
    \ 选项指定的模型。SCORE 语句使用 INMODEL= 选项指定的拟合模型对测试数据集生成预测。SCORE 语句的 OUT= 选项生成一个数据集，其中包含预测概率以及\
    \ DATA= 选项指定的数据集中所有原始变量。\n\n此时，你可以使用第 3 章中开发的技术使用 %PLOTROC 宏绘制 ROC 曲线，或使用 %ROC\
    \ 宏计算曲线下面积。从测试集生成的 ROC 曲线及其下面积被认为是真实 ROC 曲线和 AUC 的无偏估计。关键观察是 SCORE 语句获得的预测概率充当标记值。例如，以下对\
    \ %ROC 宏的调用产生样本分割的 AUC 估计（见输出 8.2），结果为 0.677，大约比再代入估计的 0.696 低 0.02，说明了再代入估计中的乐观性：\n\
    \n```\n%roc(data=testscore, var=p_1, response=complications, contrast=1,\n   \
    \     details=no, alpha=.05);\n```\n\n"
