    \ Standard Error | Number Failed | Number Left |\n| 36.0000 | 36.0000 | 0.7676\
    \ | 0.2324 | 0.0529 | 19 | 23 |\n\n# Summary Statistics for Time Variable Survival\n\
    \n# Quartile Estimates\n\n| Percent | Point Estimate | 95% Confidence Interval\
    \ [Lower Upper) | |\n| 75 | . | . | . |\n| 50 | . | 49.0000 | . |\n| 25 | 44.0000\
    \ | 24.0000 | . |\n\nMean    Standard Error\n41.8379        1.4697\n\nNOTE: The\
    \ mean survival time and its standard error were underestimated because the largest\
    \ observation was censored and the estimation was restricted to the largest event\
    \ time.\n\n# Summary of the Number of Censored and Uncensored Values\n\n| Total\
    \ | Failed | Censored | Percent Censored |\n| 100 | 21 | 79 | 79.00 |\n\n# 7.3.2\
    \ Estimation of P(T|W)\n\nP(T|W) is also, fundamentally, a time-to-event distribution\
