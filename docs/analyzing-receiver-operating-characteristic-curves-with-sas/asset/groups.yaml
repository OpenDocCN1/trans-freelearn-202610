    \ 3.2 中观察到的关系是普遍的：不可能改变阈值使得特异性和敏感性同时增加。\n\n表格形式在可容纳的阈值数量上有限制。你可以绘制敏感性与特异性，使其能够容纳所有可能的阈值。表\
    \ 3.2 显示由于两者呈反向关系，敏感性与特异性的图将显示下降趋势。可以获得视觉上更具吸引力的显示方法是绘制\n\n敏感性与一减去特异性。这称为 *接收者操作特征\
    \ (ROC)* 曲线。图 3.3 表示对应于 PET 数据集的 ROC 曲线。\n\n## 图 3.3 PET 数据集的 ROC 曲线\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_29_0.png)\n\
    \n点被称为 *观察到的操作点*，因为你可以生成一个在任意点的敏感性和特异性水平上执行（或 *操作*）的二元标记。在此图中，操作点被连接起来，形成所谓的 *经验*\
    \ ROC 曲线。其含义是 ROC 曲线上的任何点都是可行的操作点，尽管你可能需要在观察到的标记值之间进行插值以找到正确的阈值。\n\n图 3.3 中的 ROC\
    \ 曲线使用以下代码生成：\n\n```\nproc logistic data=HeadNeck noprint;\n    model gold_standard=suv\
