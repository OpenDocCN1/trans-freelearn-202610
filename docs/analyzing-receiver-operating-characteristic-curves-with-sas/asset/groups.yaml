    The iteration history and the gradient are not useful to us as long as the model
    fitting procedure converges. Estimates of the most relevant model parameters can
    be found in the Parameter Estimates output section, with α̂ = 1.99 and β̂ = −0.24.
    As discussed in Chapter 3, the ESTIMATE statement is a particularly convenient
    feature of PROC NLMIXED; it can compute the estimate and its standard error for
    any one-to-one function of the model parameters. Using this feature, we estimate
    the AUC to be 97%, with a standard error of 0.9% and a 95% confidence interval
    of 95.6% to 99.2%. By all accounts, Moody’s ratings are excellent predictors of
    default.


    Although not directly useful, the three thresholds are also estimated by this
    model. Their estimated values (labeled as theta1, theta2, and theta3 in the Parameter
    Estimates section) are 0, 0.5192, 0.5192+0.3533=0.8725 and 0.8725+0.9907=1.8632.
    Remembering that the latent variable is standard normal for D=0 and normal with
    mean 1.99 (α̂) and variance 0.62 (e^{2β̂}), we can exactly compute the expected
    proportions in each level of the ordinal predictor.


    Alternatively, we can compute the estimate of the AUC by simply plugging in the
    estimates of α and β, but calculation of the standard error requires some analytical
    legwork using the Taylor approximation.


    The resulting ROC points are given as black dots in Figure 5.4, overlaid with
    the smooth line from the binormal model. The fit is very good for high thresholds
    (low sensitivity), but there are some deviations from the empirical curve for
    the higher thresholds.'
