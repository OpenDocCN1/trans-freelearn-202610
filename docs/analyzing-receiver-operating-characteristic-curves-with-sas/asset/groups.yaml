    ## Figure 9.3 Example Decision Tree for the Home Equity Loan Example


    ![](img/ac26020abd4f22abfaafc0607939c6e4_124_0.png)


    For example, the first variable used is DEBTINC, which is a continuous variable.
    It was split at 44.7337. For those with a debt-to-income ratio less than 44.7337,
    the next best split was VALUE, split at 303,749.


    Decision trees are distinguished from logistic regression and neural networks
    in an important way: There is no statistical model. Because there is no model,
    there is no predictive equation. When a new observation is scored, it is “dropped”
    from the top of the tree and follows the route that is dictated, at each node,
    according to the value of the covariates until it reaches a terminal node (or
    leaf). This can be described as a rule, in the form of a series of IF-THEN-ELSE
    statements.


    The binary split structure of the tree is an advantage because it is easy to interpret.
    It can also be a disadvantage, especially when some of the predictors are continuous.
    Categorization of continuous covariates may lead to inefficiency and adversely
    affect predictive performance. Another advantage of decision trees is that they
    handle missing data very effectively. This is accomplished by establishing surrogate
    splits at each node that can be used when the splitting variable for that node
    is missing.


