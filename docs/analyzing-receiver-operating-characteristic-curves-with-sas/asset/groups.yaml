    \nyou can compute the area under the curve to be 0.8713, identical to the LOGISTIC\
    \ output, which was reported with three significant digits. Also using the relationship\n\
    \n```\n$$se(AUC) = \\frac{se(D)}{2}$$\n```\n\nthe standard error of AUC is computed\
    \ to be 0.026. One can compute a confidence interval for AUC using asymptotic\
    \ normal theory\n\n```\n$$AUC + 1.96 * se(AUC)$$\n```\n\nwhich turns out to be\
    \ (0.8203, 0.9222). This is a more complete analysis than the one afforded by\
    \ PROC LOGISTIC because you can judge the effects of sampling variability on the\
    \ estimate of AUC.\n\n# 3.4.3 The %ROC Macro\n\nWhile PROC FREQ is sufficient\
    \ for our purposes to compute the area under the curve and its standard error,\
    \ now is a good time to introduce a SAS macro primarily used to compare the areas\
    \ under several ROC curves; however, it can also handle a single ROC curve as\
    \ a special case. The %ROC macro, currently in Version 1.5, is available for download\
    \ at the following URL:\n\nsupport.sas.com/samples_app/00/sample00520_6_roc.sas.txt\n\
    \nFollowing is the code that can be used for this example:\n\n```\n%roc(data=HeadNeck,var=SUV,response=gold,contrast=1,details=no,\n\
    \    alpha=.05);\n```\n\nThe macro variables used for invoking %ROC are\n\n+ \
    \  - Response: This is the gold standard, or the outcome. You need to create a\
    \ data set variable that takes on values of 0 or 1 only; the macro can not recode\
    \ the observed binary classes. This variable must be numeric; a character variable\
    \ with only two distinct values (0 and 1) will pass the macro’s error-checking\
    \ facility but produce a PROC IML error, which is difficult to debug.\n\n+   -\
    \ Var specifies the marker.\n\n+   - Contrast is used primarily to compare several\
    \ curves, as we will see in later chapters. The value of Contrast is always 1\
    \ for a single ROC curve.\n\n+   - Alpha pertains to confidence limit estimation.\n\
    \n+   - Details controls the amount of output printed.\n\nOutput 3.3 shows the\
    \ results of this call. The area under the curve is 87.13%, the same as the concordance\
    \ from PROC LOGISTC, and also the same as derived from Somers’ D in PROC FREQ.\
    \ The standard error is also the same as the standard error derived from Somers’\
    \ D in PROC FREQ. Confidence intervals also match up, up to rounding error."
  - "[PAGE 35]\n\n# Output 3.3\n\n```\nThe ROC Macro\n\n        ROC Curve Areas and\
    \ 95%\n            Confidence Intervals\n        ROC Area Std Error Confidence\
    \ Limits\nSUV     0.8713    0.0263    0.8198    0.9228\n```\n\nFrequent ROC curve\
    \ users should be familiar with this macro. If, on the other hand, you only occasionally\
    \ need an AUC estimate and its standard error, then it may be easier to work with\
    \ PROC FREQ.\n\n# 3.5 Selecting an Optimal Threshold\n\nIn certain cases, although\
    \ the original predictions are continuous, it is of interest to report a binary\
    \ prediction. Recall the rain prediction example used at the beginning of this\
    \ chapter. Suppose you have a model that provides a predicted probability of precipitation\
    \ for a given day. Along with this predicted probability, you might want to display\
    \ an icon that depicts rain to communicate the prediction in simpler terms. Most\
    \ of us have seen such icons in television or newspaper weather forecasts. By\
    \ including this icon we are essentially reporting a binary prediction (rain/no\
    \ rain) based on a continuous predictor (predicted probability of rain). This\
    \ is equivalent to choosing a threshold, which itself is equivalent to choosing\
    \ an operating point on the ROC curve.\n\nSometimes external criteria may guide\
    \ the choice of an operating point. In the absence of such criteria, you might\
    \ choose a threshold that is optimal in some sense. There are two widely used\
    \ ways of doing so:\n\n+   1. Choose the threshold that will make the resulting\
    \ binary prediction as close to a perfect predictor as possible.\n\n+   2. Choose\
    \ the threshold that will make the resulting binary prediction as far way from\
    \ a noninformative predictor as possible.\n\nTo understand these methods better,\
    \ remember that a perfect predictor has a single point on its ROC curve (namely,\
    \ the upper left corner of the unit square) with 100% sensitivity and 100% specificity.\
    \ In a similar vein, a noninformative marker’s ROC curve lies along the diagonal\
    \ of the unit square. The distance between a point on the ROC curve and these\
    \ reference points is measured using the so-called Euclidean method. The Euclidean\
    \ distance between points A and B with coordinates (x₁, y₁) and (x₂, y₂) is given\
    \ as follows:\n\n```\nd_AB = √(x₁ − x₂)² + (y₁ − y₂)²\n```\n\nTo make this clear,\
    \ the empirical ROC curve is plotted again in Figure 3.5 with two candidate optimal\
    \ operating points, A and B. R denotes the reference point for the first method\
    \ of choosing an optimal threshold. Similarly, P and Q denote the reference points\
    \ for the second method. According to the first definition, you need to compute\
    \ the length of line segments RA and RB and prefer A over B if RA is shorter than\
    \ RB. Similarly, if the second method of choosing a threshold is adapted, then\
    \ the lengths of AP and BQ need to be compared, with A preferred over B if AP\
    \ is longer than BQ."
