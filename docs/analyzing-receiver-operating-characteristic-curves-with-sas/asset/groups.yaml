    # 6.1 Introduction


    The first five chapters covered traditional methods of analyzing ROC curves. This
    chapter presents a different approach to constructing ROC curves for a continuous
    predictor. This approach has three important advantages in that it


    +   - corresponds to an ROC curve with a very simple functional form

    +   - easily fits with built-in SAS procedures

    +   - lends itself to an easy generalization with respect to comparing ROC curves
    and covariate adjustments.


    # 6.2 Lehmann Family of Distributions


    In Chapter 3, we derived a general representation of the ROC curve in terms of
    the complement of the cumulative distribution function of the marker values conditional
    on the value of the gold standard status. If D=0,1 denotes the gold standard and
    W is the marker, then we defined'
