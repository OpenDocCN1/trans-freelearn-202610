    \nwhere\n\nθ(U) = β₁ + β₃U\n\nJust as in Chapter 5, the ROC curve for the covariate\
    \ is unaffected by β₂ but it is critical to include the main effect for age in\
    \ the model; otherwise, the estimate of β₃, the key component for the ROC curve,\
    \ might be biased.\n\nContinuing with the magnetic resonance example, age may\
    \ be an important factor in the accuracy of this type of magnetic resonance imaging,\
    \ which focuses on the water-fat ratio in the tissue. Because patients naturally\
    \ accumulate fat as they age, the marker may be less effective in the elderly,\
    \ with the potential for mistaking fat due to age for fat due to a benign lesion.\n\
    \nThe following PHREG call provides the required estimates:\n\n```\nproc phreg\
    \ data=tmp1.ph;\n    model signal=grp age grpage/r1;\n    if group='normal' then\
    \ grp=0;\n    else if group='benign' then grp=1;\n    grpage=grp*age;\nrun;\n\
