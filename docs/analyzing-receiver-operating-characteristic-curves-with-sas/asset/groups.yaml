    # 3.1 Dichotomizing a Continuous Predictor


    Now let’s consider the problem that naturally leads to the use of the ROC curve.
    Suppose you are trying to predict a binary outcome, like the weather forecast,
    but instead of a binary predictor you have a continuous predictor. Most weather
    forecasts are produced by statistical models, which generate a probability level
    for the outcome. For example, most weather forecasts mention rain in their summary
    but if you look at the details they also report a chance of rain. How would you
    assess the predictive accuracy of these probabilities (or, perhaps more appropriately,
    the model that produced these predicted probabilities)?


    Since you know how to analyze predictive accuracy for a binary predictor (using
    metrics such as sensitivity and specificity), you might consider transforming
    the predicted probability into a dichotomy by using a threshold. The results,
    however, would clearly depend on the choice of threshold. How about using several
    thresholds and reporting the results for each one? The ROC curve offers one way
    of doing this. The ROC curve offers one way of doing this by focusing only on
    sensitivity and (one minus) specificity.'
  - "[PAGE 26]\n\nLet’s use an example from the field of medical diagnostics. One\
    \ way to diagnose cancer is through the use of a special scan called *positron\
    \ emission tomography (PET)*. PET produces a measure called the *standardized\
    \ uptake value (SUV)*, which is a positive number that indicates the likelihood\
    \ that the part of the body under consideration has cancer. After the SUV is measured,\
    \ the patient undergoes a biopsy where a small piece of tissue from the suspected\
    \ area is removed and examined under the microscope to evaluate whether it is\
    \ cancerous or not. This process, called *pathological verification*, is considered\
    \ the gold standard. Using the terminology introduced at Chapter 1, we will call\
    \ the SUV the marker, and pathological verification the gold standard.\n\nThe\
    \ data are reported by Wong et al. (2002). There are 181 patients, 67 of whom\
    \ are found to have cancer by the gold standard. Because we are dealing with a\
    \ continuous predictor, it is no longer possible to report the data in a tabular\
    \ form. Instead you can use the following side-by-side histograms from PROC UNIVARIATE\
    \ that can be obtained with the simultaneous use of CLASS and HISTOGRAM statements.\
    \ For example, the following code was used to generate Figure 3.1:\n\n```\nproc\
    \ univariate data=HeadNeck noprint;\nclass gold_standard / keylevel='-';\nvar\
    \ suv;\nhistogram suv / turnvlabels cfill=ligr cframe=white\n    cframeside=white\
    \ endpoints=0 to 20 by 2 cbarline=black\n    font=swissb height=4;\nrun;\n```\n\
    \n# Figure 3.1 Side-By-Side Histograms for SUV\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_26_0.png)\n\
    \nWhen the HISTOGRAM statement is invoked in PROC UNIVARIATE with a CLASS statement,\
    \ a separate histogram for each value of the class variable is produced. The KEYLEVEL=\
    \ option ensures that the chosen level always appears at the top (in this case,\
    \ the code displays the histogram for the gold standard negative patients first).\
    \ The options used in the HISTOGRAM statement visually enhance the figure. Their\
    \ use is covered in detail in the *Base SAS Procedures Guide: Statistical Procedures*,\
    \ which is available at support.sas.com/documentation/onlinedoc/sas9doc.html."
