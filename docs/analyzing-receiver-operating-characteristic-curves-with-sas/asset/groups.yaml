    The most common enhancement is the inclusion of a 45-degree line. This line represents
    the ROC curve for a noninformative test and a visual lower bound for the ROC curve
    of interest to exceed. Finally, it is customary to make the horizontal and vertical
    axes the same length, resulting in a square plot, as opposed to the default rectangular
    plot of SAS/GRAPH. These features are available in the %PLOTROC macro. For more
    information, see this book’s companion Web site at support.sas.com/gonen.


