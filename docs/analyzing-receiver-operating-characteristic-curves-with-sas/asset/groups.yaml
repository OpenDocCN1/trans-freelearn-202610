  - '[PAGE 24]


    The ORDER= option in PROC FREQ may be helpful in situations where SAS, by default,
    is choosing a binomial event different from the one you want. This leads to the
    computation of binomial proportions in a way that is the complement of the desired
    category. You can always subtract the values in the output from 1 and adjust the
    hypothesized value in a similar fashion to obtain the correct analysis. But it
    is also possible to obtain exactly the desired output by using the ORDER option
    of the PROC FREQ statement. To better understand the correct usage of the ORDER
    statement, it is important to understand that, by default (that is, in the absence
    of an ORDER option) PROC FREQ uses as event the first value in the alphabetically
    ordered list of unformatted values of the TABLE variable. This leads to frost
    being considered an event and the reported analysis is for FPR, not for specificity.
    ORDER=FREQ tells PROC FREQ to use the category that is most common as the event,
    leading to the desired analysis. This works when the specificity is greater than
    50%, which should cover most cases. When the specificity is less than 50%, then
    ORDER=FREQ also uses the incorrect category for events. A fail-proof system requires
    sorting the data first by the predictor variable, in a descending fashion, and
    then using PROC FREQ without the ORDER= specification.'
