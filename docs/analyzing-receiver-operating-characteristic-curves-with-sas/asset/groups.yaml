    ## Using the ROC Curve to Evaluate Multivariable Prediction Models


    ## 8.1 Introduction


    我们迄今为止的讨论主要集中于单一预测因子。其他变量也被考虑，例如在比较几个预测因子或协变量调整的 ROC 曲线时，但不是以从多变量模型产生预测并评估其准确性的形式。第
    8 章和第 9 章处理这个问题。


    强调单一预测因子的原因值得讨论。首先，它们为评估更复杂的模型提供了基础。其次，单一预测因子应用在实践中很常见，因此值得特别关注。诊断放射学是一个很好的例子，其中预测因子通常是接受扫描的患者的产物。虽然将来自多个数据源的信息结合起来（如磁共振成像和计算机断层扫描等替代诊断扫描）可提高准确性，但压倒性的财务和伦理关注点在于最大限度地减少扫描次数。这导致了在少数候选中挑选最佳单一预测因子的关注。将来自多种扫描类型的信息结合起来很少是感兴趣的，因为准确性的增量改善通常无法证明患者接受额外诊断程序的成本和负担是合理的。


    诊断放射学以外的多数预测问题涉及多个变量。通常，你设法预测的大多数结局都是复杂的、多个维度的实体，只能通过审慎使用多个变量来捕捉。这通常意味着构建模型，这需要从几个竞争模型中进行选择。该过程的目标是找到最适合数据的模型，但不可避免地导致过拟合。*过拟合*
    指的是一个模型比它预见到未来观测的情况更好地描述了观测数据。


    从用于模型拟合的数据集计算的模型性能度量（如 ROC 曲线或 ROC 曲线下面积）被称为通过 *自预测* 或 *重代入* 获得。这些术语源于使用模型预测生成自身的数据并将模型重新代入数据以获得预测的做法。对此方法的另一个、有些轻率的术语是
    *双重使用*，指的是数据集被使用两次，一次用于拟合，一次用于预测。ROC 曲线及其汇总度量倾向于反映自预测中的乐观性，因为它们表明的准确性比模型在实践中允许的要好。


    大多数统计学家建议采取措施防止过拟合。该过程通常称为 *验证*。以下是特别适用于 ROC 曲线且可在 SAS 中相对轻松实现的方法：拆分样本验证和样本重用验证。样本重用方法实际上可以用两种不同的方式实现：交叉验证和自助法。本章涵盖这些方法。


    *拆分样本验证* 要求将样本分为两部分，即所谓的训练集和测试集。模型在训练集上拟合，其性能在测试集上评估。这模仿了模型在未参与模型开发的数据集上使用的现实生活情况。从测试集估计的性能度量比从训练集估计的度量更接近真实值（偏差更小）。拆分样本验证易于理解和实现。它也很好地近似现实生活。其主要缺点是数据使用效率低下：对于小到中等的样本量，训练集和测试集都不足以产生可重复的结果。


    样本重用方法试图通过以不同方式重复使用观测数据点来提高效率。这种重复使用导致性能估计的方差更小。一般而言，然而，由于每个数据点被使用多次，偏差会增加。尽管如此，大多数研究在均方误差等综合标准方面更倾向于样本重用。换句话说，偏差的增加被方差的减少所抵消。


    最知名的样本重用方法是 *交叉验证*。数据被分为 *k* 个段（通常大小相等），其中一部分留作测试，其余 *k−1* 部分用于训练模型。然后该过程对每个段重复，并将得到的准确性度量在
    *k* 个段上平均。当 *k=n* 时，每个数据点构成一个段， resulting 过程称为 *留一法* 验证。


    交叉验证的替代方法是使用自助样本。我们在前几章中看到，自助法可用于获得置信区间和 *p*-值。当目标是模型验证时，以相同方式获得的自助样本可用于校正过拟合。第
    8.6 节将向你展示如何操作。


    ## 8.2 Liver Surgery Example


    我们将在本章中作为示例使用来自肝脏外科领域的数据集。手术是肝癌患者最有希望的治疗选择。Liver 数据集包含 554 例切除肝肿瘤手术的记录。它是 Jarnagin
    等人（2002）分析的数据的子集。变量包括人口统计学、术前患者特征如现有合并症、手术变量如失血量，以及术后变量如手术后并发症的发生和严重程度。


