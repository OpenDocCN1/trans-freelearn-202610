    # Figure 3.5 Choosing the Optimal Threshold Using the Empirical ROC Curve


    ![](img/ac26020abd4f22abfaafc0607939c6e4_36_0.png)


    The OPTIMAL option of the %PLOTROC macro generates a data set called _OPTIMAL_,
    which computes the two distances explained here for each threshold. These two
    variables, called DIST_TO_PERFECT and DIST_TO_NONINF, can be used to choose an
    optimal operating point on the ROC curve.


    The choice of method is mostly dictated by the field of application. In the context
    of medical diagnosis, optimal usually means close to the ideal and in engineering
    contexts it usually means far from random. In fact the vertical distance measure
    considered here is equal to Youden’s index, a summary measure of accuracy that
    is popular in quality control, although it was first introduced in a medical context
    (Youden, 1950).


    Unfortunately, the two criteria of optimality produce different optimal operating
    points. This is analytically demonstrated by Perkins and Schisterman (2006). Most
    of the time, the two are close enough to allay any concerns about the choice of
    method.


    # 3.6 The Binormal ROC Curve


    So far our focus has been on the empirical curve, the one obtained by connecting
    the observed (sensitivity, 1-specificity) pairs. The empirical curve is widely
    used because it is easy to produce and it is robust (in the sense of being rank-based)
    to the changes in the marker distribution. But there are occasions when you might
    prefer a smooth curve. The most common way of smoothing an ROC curve is by using
    the binormal model.


    The binormal model assumes that the distributions of the marker (or a monotone
    transformation) within the gold standard categories are normally distributed.
    For the PET data set example, we can assume that the SUVs of the patients with
    cancer follow a normal distribution, with mean μ₁ and variance σ₁², and SUVs of
    the patients with no cancer follow a normal distribution, with mean μ₀ and variance
    σ₀². Then, using the notation from the empirical ROC curves'
  - '[PAGE 37]


    ```

    F(t) = Φ( (μ₀ - t) / σ₀ )

    ```


    it follows that the threshold t can be written as a function of x as follows:


    ```

    t = μ₀ - σ₀ Φ⁻¹(x)

    ```


    Because a threshold t corresponds to the sensitivity F(t), we can write the functional
    form of the ROC curve as follows:


    ```

    G(t) = Φ( (μ₁ - t) / σ₁ ) = Φ( (μ₁ - μ₀ + σ₀ Φ⁻¹(x)) / σ₁ ) = Φ( a + b Φ⁻¹(x)
    )

    ```


    where


    ```

    a = (μ₁ - μ₀) / σ₁ ,   b = σ₀ / σ₁

    ```


    These two parameters, a and b, are often referred to as binormal parameters. Sometimes
    they are called intercept and slope because plotting a binormal curve on normal
    probability paper yields a straight line with intercept a and slope b. This practice
    is not common anymore, but the nomenclature continues.


    If the marker values are not normally distributed but can be after a monotone
    transformation, then the binormal ROC curve is fitted to the transformed values.
    Nevertheless, the binormal curve fitted to the transformed values is still considered
    the ROC curve for the untransformed marker as well because the true ROC curve
    for the marker is invariant under monotone transformations, as shown in Section
    3.3. Therefore, the existence of a monotone normalizing transformation is sufficient
    to justify using the binormal approach.


    On the one hand, this is a relatively weak requirement, suggesting that most predictors
    can be thought of as binormal. On the other hand, discovering the functional form
    of h can be quite a task by itself. Note that the same h(.) must transform the
    marker to normality for both gold standard positive and negative patients. This
    process can be challenging and is discussed in the next section.


    The area under the curve for the binormal model also has a closed-form expression:


    ```

    AUC = Φ( a / √(1 + b²) )

    ```


    Estimation of the binormal model requires estimation of a and b, which in turn
    requires estimation of the mean and variances in each outcome group separately.
    This can simply be accomplished using PROC MEANS with a CLASS statement. But using
    PROC NLMIXED has many advantages, which the following example demonstrates. If
    you are not familiar with PROC NLMIXED, a relative newcomer to the SAS/STAT family,
    see the Appendix for an introduction covering its relevant capabilities.'
