    \n## 8.6 ROC 曲线的 Bootstrap 验证估计\n\n另一种通过验证获得 ROC 曲线的样本重用方法是使用 bootstrap 样本。这不如交叉验证直观，但在某些情况下，其估计的方差可能更低。\n\
    \nBootstrap 验证首先通过形成 B 个 bootstrap 样本开始。对于交叉验证，K 是一个较小数字，约为 5 到 10，而对于 bootstrap\
    \ 验证，B 通常会更大，至少数百个，也许 1,000 个。然后每个 bootstrap 样本用作训练样本。然后原始数据集和 bootstrap 样本用作测试样本。感兴趣的度量，例如\
    \ AUC，使用原始数据作为测试样本估计的值与使用 bootstrap 样本作为测试样本估计的感兴趣度量之间的差异是 *乐观* 的度量。此差异可以从感兴趣度量的重代入估计中减去，以获得\
    \ bootstrap 验证估计。这样产生的估计有时称为 *乐观校正* 或 *乐观调整* 估计。\n\n算法如下：\n\n+   1. 在原始数据集上计算感兴趣的度量\
