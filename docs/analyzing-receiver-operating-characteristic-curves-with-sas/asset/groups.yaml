    ## Preface


    When I received my Ph.D. in statistics, I had not heard the term *receiver operating
    characteristic (ROC) curve*. Like most biostatisticians, my introduction to ROC
    curves came through my involvement in studies of medical diagnostics. Later, I
    realized that they are used, although not as much as they should be, in other
    fields, such as credit scoring and weather forecasting, which make intensive use
    of statistical prediction methods. As my exposure grew, I needed more options
    in SAS to analyze ROC curves. However, over time, I realized that SAS offers more
    on ROC curves than I initially thought. I also accumulated a good deal of statistical
    knowledge and SAS tricks on ROC curves that may be helpful for those who now find
    themselves where I found myself several years ago. I wrote this book to share
    these experiences.


    There are two recent statistical texts that cover ROC curves: *Statistical Methods
    in Diagnostic Medicine* (Zhou, McClish, and Obuchowski, 2002) and *The Statistical
    Evaluation of Medical Tests for Classification and Prediction* (Pepe, 2003). There
    is a natural overlap of coverage between these two texts and this book, but there
    are also important differences. First and foremost, this book is for the practitioner
    and, as such, matters of implementation and practice take priority over theoretical
    concerns. I also made a conscious effort to cover other fields that benefit from
    ROC curves. Nevertheless, diagnostic medicine remains the most common area of
    ROC curve application and served in this book as the source of many examples.


    It is not possible to write a book without excluding subjects that some readers
    would have found absolutely essential. I am happy to receive e-mail on these topics
    and willing to share whatever expertise and programs I may have.


    It is also not possible to write a book without making mistakes. Despite my best
    efforts, you may find technical errors; please let me know about them. Also, refer
    to the companion Web site for this book at support.sas.com/gonen for updates to
    both the SAS code and the book.


    ROC on.

