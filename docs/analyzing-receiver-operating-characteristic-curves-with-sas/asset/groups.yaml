- raw:
  - "[PAGE 54]\n\n```\nproc nlmixed data=long method=firo technique=quanew;\n    parms\
    \ sr=1 s11=3 s10=0.3 s01=2 s00=0.2 m11=7 m10=1 m01=2 m00=0;\n    bounds sr s11\
    \ s10 s01 s00>0;\n    if gold=1 and marker=0 then do;\n        m=m10+u; s=s10**2;\
    \ end;\n    if gold=1 and marker=1 then do;\n        m=m11+u; s=s11**2; end;\n\
    \    if gold=0 and marker=0 then do;\n        m=m00+u; s=s00**2; end;\n    if\
    \ gold=0 and marker=1 then do;\n        m=m01+u; s=s01**2; end;\n    a1=(m11-m01)/s11;\n\
    \    b1=s01/s11;\n    a0=(m10-m00)/s10;\n    b0=s00/s10;\n    auc1=probnorm(a1/sqrt(1+b1**2));\n\
    \    auc0=probnorm(a0/sqrt(1+b0**2));\n    model result ~ normal(m,s);\n    random\
    \ u ~ normal(0,sr) subject=subid;\n    estimate 'a1' a1;\n    estimate 'b1' b1;\n\
    \    estimate 'AUC1' auc1;\n    estimate 'a0' a0;\n    estimate 'b0' b0;\n   \
    \ estimate 'AUC0' auc0;\n    estimate 'AUC1-AUC0' auc1-auc0;\n    contrast 'AUC1-AUC0'\
    \ auc1-auc0;\n    contrast 'Equality of ROC curves' a1-a0, b1-b0;\nrun;\n```\n\
    \nThe fundamental description of the model in PROC NLMIXED is similar to the one\
    \ in Section 3.6, with two exceptions of the random effect u. The RANDOM statement\
    \ declares u as the random effect. For those familiar with PROC MIXED, the RANDOM\
    \ statement has similar functionality but different syntax. In PROC MIXED, you\
    \ don’t need to specify the distribution of the random effect since normal random\
    \ effects are the only available option. In PROC NLMIXED, you must specify the\
    \ distribution of the random effects since any of the built-in distributions that\
    \ PROC NLMIXED recognizes is an option. Another difference is that, in PROC MIXED,\
    \ specifying the RANDOM statement ensures that the random effect is added to the\
    \ model; in PROC NLMIXED, you must add the term u to the mean function in programming\
    \ statements. See the appendix for a brief introduction to the syntax and capabilities\
    \ of PROC NLMIXED.\n\nIn addition to the presence of the random effect, this call\
    \ to PROC NLMIXED is different from the ones in Chapter 3 in a few other ways.\
    \ For example, the CONTRAST statement provides simultaneous testing of parameters.\
    \ It is helpful to think of it as multiple ESTIMATE statements executed simultaneously.\
    \ To make this point, note that\n\n```\nestimate 'AUC1-AUC0' auc1-auc0;\n```\n\
    \nand\n\n```\ncontrast 'AUC1-AUC0' auc1-auc0;\n```\n\nperform the same test (that\
    \ is, the equality of the AUCs). You would normally do this by using the ESTIMATE\
    \ statement; including the CONTRAST statement for this purpose is for demonstration\
    \ only."
