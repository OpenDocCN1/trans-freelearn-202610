    | 0.761397 | 0.080334 | 0.674859 | 0.080334 | 0.086573 | 0.123361 |\n\n95% Confidence\
    \ Interval for Difference\n\n| LowerLimit | UpperLimit |\n|---|---|\n| -0.24815\
    \ | 0.280488 |\n\nH0: Difference=0\np=0.341\n\n输出的第一部分报告了单个 AUC 的点估计值和标准误差，以及它们的差异。AUC\
    \ 及其标准误差按宏调用中指定的顺序呈现并标记。BSI 的 bootstrap 估计 AUC 为 0.761，SUV 为 0.675。差异为 0.087，在临床上相当可观，但在统计上不显著，p=0.341，置信区间为\
    \ (−0.248, 0.280)，包含 0。\n\n## 4.8 ROC 曲线的协变量调整\n\n在某些情况下，协变量会影响预测的准确性。在这种情况下，你需要对这些协变量进行\
    \ ROC 曲线的调整。例如，在天气预报的背景下，产生预报的同一模型可能根据预报地点的地理位置的海拔高度而具有不同的准确性。在医学诊断领域，某些患者方面的因素，例如对治疗的既往暴露，可能影响诊断工具准确识别其当前医疗状况的能力。最后，在信用评分领域，相同的评分方法在不同国家可能表现不同，也许是由于对财务结果报告方式的不同法律要求。\n\
    \n区分协变量是结果的预测因子与协变量是结果的危险因素非常重要。为了使这种区别具体化，请考虑医学诊断领域的例子。淋巴瘤是淋巴结的癌症。恶性结节通常会增大，因此淋巴结的大小可以很好地预测淋巴瘤。然而，恶性并不是淋巴结增大的唯一原因。淋巴结在患者对抗感染时也会增大。因此，淋巴结的大小可能在最近未感染的患者中是一个很好的预测因子，但在患者最近感染过时则是一个较差的预测因子。另一方面，是否最近感染并不是淋巴瘤的良好预测因子。因此，最近感染是一个可能影响\
    \ ROC 曲线的协变量，但不是一个可用于预测癌症存在的协变量，无论是单独使用还是与其他预测因子结合使用。\n\n相比之下，淋巴瘤（或也许任何癌症）的家族史会使患者患癌症的可能性更大，因为某些癌症是遗传的。这可以正式或非正式地纳入诊断。患者是否有癌症家族史通常不会影响淋巴结增大是否能很好地预测癌症。因此，癌症家族史不是调整\
    \ ROC 曲线的候选因素。\n\n在最简单的形式中，对于分类协变量，调整意味着为协变量的每个取值估计单独的 ROC 曲线。对于连续协变量，你可以设想无限多个\
    \ ROC 曲线，每个可能的协变量值对应一个。这需要使用一个模型来假设协变量与 ROC 曲线参数之间的关系。毫不奇怪，主要的此类模型是回归。下一节将研究第\
    \ 3 章研究的双正态模型如何被表述为回归模型。\n\n## 4.9 双正态 ROC 曲线的回归模型\n\n最简单的回归模型不包含任何协变量。它在实践中不是一个有用的模型，但有助于构建概念。在\
    \ ROC 曲线的背景下，如果 T 表示标记，D 表示疾病状态（金标准），则可以写成\n\nT = α₀ + α₁ D + e^{2 D β} ε\n\n\
    其中 ε 具有均值为 0、方差为 σ₀² 的正态分布。经过一些代数运算，可以证明\n\na = α₁ / (e^{β} σ₀²),   b = e^{β}\n\
    \n记住，变量 D 的系数表示标记在 D=1 和 D=0 时均值的差异。这对任何线性模型都成立，并且将在后续章节中用于从更复杂的模型中提取与 ROC 曲线相关的信息。\n\
    \n该模型不能使用 SAS/STAT 软件中的标准线性模型程序（如 GLM 或 REG）拟合。然而，它可以用 PROC MIXED 拟合，正如我们在第 3\
    \ 章中看到的那样，也可以用 PROC NLMIXED 拟合。PROC MIXED 语法更容易，因为它遵循大多数 SAS/STAT 程序的总体结构。另一方面，PROC\
    \ NLMIXED 可以推广到有序标记的情况，正如我们在第 5 章中将看到的那样，因此采用 PROC NLMIXED 作为建模 ROC 曲线的 SAS/STAT\
    \ 程序的主要选择是有价值的。\n\n现在我们可以联合建模协变量。首先考虑一个二元标记 W：\n\n```\nT = α₀ + α₁D + α₂W + e^{2β}\
    \ ε\n```\n\n这意味着\n\n```\nT = { α₀ + α₁D + e^{2Dβ} ε,   W = 0\n      α₀ + α₂ +\
    \ α₁D + e^{2Dβ} ε,   W = 1 }\n```\n\n这两个方程构成了模型所暗示的两个标记的 ROC 曲线的基础。请注意，D 的系数对两个\
    \ ROC 曲线都是相同的。事实上，这两个方程仅在截距上不同。因此，所暗示的双正态参数 a 和 b 相同。\n\n你可以得出结论，仅将协变量作为主效应加入不会导致对两个\
    \ ROC 曲线进行单独建模。\n\n现在考虑以下内容：\n\n```\nT = α₀ + α₁D + α₂W + α₃DW + e^{2βD} ε\n```\n\
    \n这会产生 W=0 和 W=1 的以下子模型：\n\n```\nT = { α₀ + α₁D + e^{2βD} ε,          W = 0\n\
    \      (α₀ + α₂) + (α₁ + α₃)D + e^{2βD} ε,   W = 1 }\n```\n\n这两个子模型生成两个不同的 ROC\
    \ 曲线，因为 D 的系数相差 α₃。\n\n特别对于 W=0\n\n```\na = α₁ / (e^{β} σ₀²),   b = e^{β}\n```\n\
    \n对于 W=1\n\n```\na = (α₁ + α₃) / (e^{β} σ₀²),   b = e^{β}\n```\n\n注意，如果 α₃=0，则两个标记的\
    \ ROC 曲线相同。\n\n原则上，该模型可以容纳在两个标记上收集的数据。你可以为任何标记创建一个二元变量，然后将其用作 W 的替代来进行比较。通常，标记比较与协变量调整之间存在两个实际差异：\n\
    \n- 标记比较通常涉及配对数据（如上一章解释的那样），而协变量调整涉及非配对数据。\n- 标记比较通常使用 *异方差* 模型（允许由结果定义的两个组内方差不同），而协变量调整通常采用\
    \ *同方差* 模型（假设由结果定义的两个组内方差相等）。\n\n## 有序预测因子\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_63_0.png)\n\
    \n- 5.1 Introduction .........................................................\
    \ 53\n- 5.2 Credit Rating Example...................................................\
    \ 54\n- 5.3 Empirical ROC Curve for Ordinal Predictors...............................\
    \ 54\n- 5.4 Area under the Empirical ROC Curve .....................................\
    \ 56\n- 5.5 Latent Variable Model ..................................................\
    \ 57\n- 5.6 Comparing ROC Curves for Ordinal Markers ...............................\
    \ 63\n\n## 5.1 引言\n\n第 3 章讨论了单一连续预测因子，这可能是 ROC 曲线最自然、最常见的设定。尽管如此，ROC 曲线的思想同样适用于有序预测因子。本章研究如何将前一章的技术扩展以适应有序预测因子。\n\
    \n有序预测因子可以通过多种方式产生。有时，它们只是底层连续预测因子分类的结果。虽然这可能导致信息损失，从而降低预测准确性，但拥有简单且易于传达的预测因子的收益可能抵消这些损失。降雨预报可能提供一个例子。有时它们报告为低-中-高，其他时候则以\
    \ 10% 的增量报告。无论使用何种术语报告分类预测因子，数据分析都可以使用预测因子作为有序变量进行。\n\n有序预测也可能通过专家意见产生。大多数主观意见难以量化，但提供按其概率排序的几个情景相对容易——实际上是报告有序预测。例子可以在几乎任何领域找到，例如医学（诊断放射科医生报告其对疾病机会或严重程度的评估）、商业（顾问对消费者偏好可能性的看法）或金融（股票选择，报告为买入、持有或卖出）。\n\
    \n"
