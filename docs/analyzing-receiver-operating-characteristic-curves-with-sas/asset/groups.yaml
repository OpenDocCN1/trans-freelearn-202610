    # Figure 5.3 ROC Points for the Same Ordinal Predictor in Figure 5.2


    ![](img/ac26020abd4f22abfaafc0607939c6e4_69_0.png)


    The most common assumption is that the latent variable is normally distributed.
    This gives rise to the so-called *latent binormal model*. For now, we will distinguish
    the latent binormal model from the one in Chapter 3. The latent binormal model
    assumes that the latent variable follows a normal distribution with mean μ₁ and
    variance σ₁² when D=1, and a normal distribution with mean μ₀ and variance σ₀²
    when D=0. It is not possible to simultaneously estimate μ₀, σ₀², μ₁, and σ₁² using
    the observed frequencies of the ordinal marker (such as those in Table 5.1). Multiple
    (in fact, infinite) combinations of these four parameters can give rise to the
    same observed data, and it is not possible to distinguish between them. However,
    if we anchor one of the normal distributions by fixing μ₀ and σ₀², then we can
    estimate μ₁ and σ₁². For simplicity, suppose we choose μ₀=0 σ₀²=1 and we get the
    estimates of μ₁ and σ₁², say μ̂ and σ̂². Had we set μ₀=m σ₀²=s, then the resulting
    estimates of μ₁ and σ₁² would have been μ̂ + m and s σ̂². This can be proven because
    the normal distribution is a member of the so-called *location-scale families*.
    The implication is that, without loss of generality, we can always use the standard
    normal as the anchor and consider the resulting estimates as the difference of
    the two means and the ratio of the two variances.


    These considerations led to the development of the following special ordinal regression
    model for ROC curves, first considered by Tosteson and Begg (1988). In this model,
    D is an indicator variable for the gold standard, that is D=0 or D=1. The latent
    variable X has a normal distribution with mean αD and variance e^{2βD}. This amounts
    to assuming a standard normal for D=0 and possibly a different normal density
    for D=1. Thus, this representation of X is consistent with the latent binormal
    model described previously.'
  - "[PAGE 70]\n\nSuppose that $R$ is the ordinal predictor with $k$ levels, created\
    \ from $X$ by applying the thresholds $\theta_1..., \theta_k$. Then the probability\
    \ of $R$ being equal to $k$ is given by the following:\n\n$P(R=k)=P(\\theta_{k-1}<X\\\
    le\\theta_k)$\n$=\\Phi\\left(\\frac{\\theta_k-\\alpha D}{e^{\\beta z}}\\right)-\\\
    Phi\\left(\\frac{\\theta_{k-1}-\\alpha D}{e^{\\beta z}}\\right)$\n\nWe saw in\
    \ Chapter 3 that ROC curves are intimately connected to cumulative distributions.\
    \ For this reason, using $\\gamma_k(D)=P(R\\le k)$ instead of $P(R=k)$ yields\
    \ the following probit regression model:\n\n$\\gamma_k(z)=\\Phi\\left(\\frac{\\\
    theta_k-\\alpha D}{e^{\\beta z}}\\right)$\n\nRealize that $1-\\gamma_k(D)$ is\
    \ the probability of the marker exceeding the threshold and, hence, predicting\
    \ $D$=1. This represents the sensitivity when $D$=1 and one minus the specificity\
    \ when $D$=0. Therefore, a plot of $1-\\gamma_k(0)$ versus $1-\\gamma_k(1)$ for\
    \ all $k$ produces the ROC curve of the latent variable. The resulting smooth\
    \ curve, analogous to the case of the continuous predictor, is\n\n$y=\\Phi\\left(\\\
    alpha+e^{-\\beta}\\Phi^{-1}(x)\\right)$\n\nwhere $x$ is one minus the specificity\
    \ and $y$ is the sensitivity. Under this model, the area under the curve is given\
    \ by\n\n$A=\\Phi^{-1}\\left(\\frac{\\alpha}{\\sqrt{1+e^{-2\\beta}}}\\right)$\n\
    \nSetting $a=\\alpha$ and $b=e^{-\\beta}$, you can see that the formula for the\
    \ AUC is equivalent to the case of a single continuous predictor. This is not\
    \ surprising because we have continuously observed in Sections 5.2 and 5.3 that\
    \ there is a strong duality between continuous and ordinal predictors.\n\nWe will\
    \ call this an *ordinal-probit regression model*. Other ordinal regression models\
    \ can be obtained by assuming a different distribution for the latent variable,\
    \ in which case the probit link in this derivation would be replaced by the cumulative\
    \ distribution function of the chosen distribution. In practice, it is very rare\
    \ that another distribution is used in the latent model setting.\n\nThose familiar\
    \ with the capabilities of the LOGISTIC, GENMOD, and PROBIT procedures might mistakenly\
    \ conclude that these procedures can serve as the primary vehicles for analyses\
    \ of ordinal predictors. In fact, these three procedures are not flexible enough\
    \ to accommodate the parameter $\\beta$. Use them only if you are willing to fix\
    \ $\\beta$ in advance at 1 and estimate only $\\alpha$. These procedures were\
    \ developed to estimate a class of models called *generalized linear models*,\
    \ and the ordinal-probit regression model defined here belongs to this family\
    \ if and only if $\\beta$=1. Therefore, to fit the ordinal probit model as described\
    \ previously in full generality, you need to use the capabilities of PROC NLMIXED."
  - "[PAGE 71]\n\nWe will use Moody’s data as an example. Note that the first five\
    \ categories (Aaa through A2) have no observed defaults and, thus, the same sensitivity\
    \ and specificity. In the language of this chapter, γ_k(0) and γ_k(1) are the\
    \ same for k=1, …, 5. Thus, we cannot estimate any of the four thresholds (θ_1,\
    \ θ_2, θ_3, θ_4) because any of the points on the presumed latent variables distribution\
    \ between −∞ and θ_5 will be consistent with our data. To enable the ordinal regression\
    \ to deal with all model parameters, we need to consolidate some of the categories.\
    \ The consolidation in Table 5.2 was chosen for this analysis.\n\n# Table 5.2\
    \ Consolidated Version of Moody’s Rating Data\n\n| Rating | A | Baa | Ba | B |\
    \ C |\n| Default | 1 | 2 | 4 | 36 | 55 |\n| Total | 1023 | 692 | 388 | 592 | 164\
    \ |\n\nIn the consolidated version, A represents Aaa through A3-, Baa represents\
    \ Baa1 through Baa3, Ba represents Ba1 through Ba3, and B represents B1 through\
    \ B3. C is not combined with another category.\n\nBefore we proceed with fitting\
    \ this model it is important to emphasize the fact that the latent variable is\
    \ not observed, so it is only the relative positions of the thresholds that can\
    \ be estimated. In other words, two sets of thresholds with different absolute\
    \ values but identical relative positions (i.e., the distance between them) will\
    \ have the same likelihood. Hence we need to arbitrarily fix one of the thresholds\
    \ so that others can be estimated. The following PROC NLMIXED code assumes the\
    \ first threshold is 0 and fits the foregoing ordinal-probit regression model\
    \ to the consolidated version of credit rating data.\n\n```\nproc nlmixed data=moody\
    \ gconv=0;\n  parms alpha=1 theta1=1 theta2=2 theta3=3 beta=1;\n  bounds theta1>0,\
    \ theta2>0, theta3>0;\n  eta1=alpha*default;\n  eta2=exp(beta*default);\n    if\
    \ rating=1 then z = probnorm(-eta1/eta2);\n  else if rating=2 then z = probnorm((theta1-eta1)/eta2)\n\
    \                        probnorm(-eta1/eta2);\n  else if rating=3 then z = probnorm((theta2+theta1-eta1)/eta2)\n\
    \                        - probnorm((theta1-eta1)/eta2);\n  else if rating=4 then\
    \ z = probnorm((theta3+theta2+theta1-eta1)/eta2)\n                        - probnorm((theta2+theta1-eta1)/eta2);\n\
    \  else if rating=5 then z = 1 - probnorm((theta3+theta2+theta1-eta1)/eta2);\n\
    \  if z>1e-6 then ll=log(z);\n  else ll=-1e6;\n  model rating ~ general(ll);\n\
    \  estimate 'AUC' probnorm(alpha/sqrt(1+beta**2));\nrun;\n```\n\nThe short introduction\
    \ to PROC NLMIXED in the appendix might be helpful if you are not familiar with\
    \ the syntax or the output. Output 5.3 shows the results."
