    \ sensitivity is overestimated when compared with the empirical values. Later,\
    \ the curves cross and the binormal curve starts to underestimate sensitivity.\
    \ Most of the time the difference between the two curves is less than 10%. For\
    \ most purposes, this would be considered a reasonable-fitting binormal ROC curve.\
    \ Figure 3.6 shows a graph comparing the two different curves.\n\n## Figure 3.6\
    \ Comparison of Empirical and Binormal ROC Curves\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_39_0.png)\n\
    \nFigure 3.6 is generated by the following SAS statements. The key idea is in\
    \ the DATA step, where the data set produced by the OUTROC= option in PROC LOGISTIC\
    \ (called ROCData here) generates the sensitivities from the binormal model. ROCData\
    \ already contains the sensitivity and one minus specificity pairs for the empirical\
    \ curve. Another variable, called _BSENSIT_ here, is added using the functional\
    \ form of the binormal model along with the parameters estimated with PROC NLMIXED\
    \ (described previously). Then _BSENSIT_ and _SENSIT_ are plotted against _1MSPEC_,\
    \ overlaid on the same graph. The solid line is the empirical curve (_SENSIT_)\
    \ and the dotted line is the binormal curve (_BSENSIT_).\n\n```\ndata ROCData;\n\
    \    set ROCData;\n    _bsensit_=probnorm(1.41+0.66*probit(_1mspec_));\nrun;\n\
    ```\n\n```\naxis1 length=12cm order=0 to 1 by 0.2 label=(f=swissb h=2)\n    value=(font=swissb\
    \ h=2);\naxis2 length=12cm order=0 to 1 by 0.2 label=(a=90 f=swissb h=2)\n   \
    \ value=(font=swissb h=2);\n```\n\n```\nsymbol1 v=none i=join w=3 l=1 c=black;\n\
    symbol2 v=none i=join w=3 l=3 c=black;\n```\n\n```\nproc gplot data=ROCData;\n\
    \    plot (_sensit_ _bsensit_)*_1mspec_ / haxis=axis1 vaxis=axis2\n        overlay;\n\
    run;\nquit;\n```\n\n## 3.7 Transformations to Binormality\n\nThe assumption of\
    \ normality plays a crucial role in the binormal model. Statisticians who are\
    \ familiar with the theory of t-tests and analysis of variance may dismiss this\
    \ importance because of the widespread notion that large sample sizes overcome\
    \ the effects of non-normality. This is generally true for procedures that compare\
    \ the means of several groups (such as the t-test or the F-test), primarily because\
    \ the sample means can be approximated by a normal distribution in large samples\
    \ even if the individual observations are markedly non-normal.\n\nIn contrast,\
    \ the ROC curve does not simply compare the means of diseased and non-diseased\
    \ populations. In fact, as Section 3.3 shows, the ROC curve can be represented\
    \ as G(F⁻¹(x)), where x is one minus the specificity, G(.) is the cumulative density\
    \ of the predictor in the diseased group, and F(.) is the cumulative density in\
    \ the non-diseased group. Therefore, accurate estimation of the ROC curve requires\
    \ accurate estimation of all points on F and G. The binormal model assumes F and\
    \ G to be the cumulative density function of the normal distribution, and the\
    \ parameters of these two normal distributions are estimated from the data. If\
    \ the data are markedly non-normal, estimates of F and G can be severely inaccurate\
    \ at several points. This is not easily remedied by assembling larger samples.\n\
    \nFor this reason, using the binormal model raises the question of whether the\
    \ data are indeed normal and whether departures from normality can be fixed with\
    \ a monotone transformation. Based on Section 3.3, you might think that all ROC\
    \ curves are invariant. This is certainly not the case. All parametric ROC curves,\
    \ and the binormal model in particular, are not invariant to monotone transformations.\n\
    \nNormalizing transformations is of great interest in least squares regression\
    \ and analysis of variance, so there is a vast amount of literature about it.\
    \ One of the most popular transformation methods is the standard Box-Cox power\
    \ family implemented in PROC TRANSREG.\n\nThe Box-Cox power family of transformations\
    \ can be defined as\n\ny^{(λ)} = { (y^λ - 1)/λ   λ > 0\n            log(y)   \
    \    λ = 0 }\n\nEach value of λ defines a transformation. For example, λ=1 uses\
    \ the original values and λ=0 corresponds to a log-transform. This definition\
    \ assumes y is non-negative to start with; if this is not the case, a constant\
    \ can be added to shift the values. The idea is to choose λ based on the observed\
    \ data. PROC TRANSREG uses a maximum likelihood estimate of λ along with the associated\
    \ confidence interval. Because the choice of λ depends on the data, the recommendation\
    \ is to round the resulting estimates to the nearest quarter so long as they are\
    \ in the associated confidence interval.\n\nThis representation does not take\
    \ into account the gold standard. The marker distributions that need normalization\
    \ are the conditional ones (conditional on the gold standard, F and G in the foregoing\
    \ notation). In contrast, the Box-Cox family attempts to normalize the marginal\n\
    \ndistribution of the marker values. You can redefine the family so that it normalizes\
    \ the conditional distributions. The easiest way of doing so is recognizing that\
    \ an analysis of variance model with the marker as the outcome and the gold standard\
    \ as the covariate is one way of modeling the desired conditional distributions.\
    \ For more information, see Sakia (1992).\n\nIn the PET example, you can estimate\
    \ λ using the following call to PROC TRANSREG. The left-hand side of the model\
    \ includes the marker value to be transformed and the right-hand side includes\
    \ the gold standard, as explained previously, to ensure that conditional distributions\
    \ are normalized. The PARAMETER= option specifies a constant to be added to all\
    \ observations before λ is estimated. Because some SUVs are 0, an arbitrarily\
    \ chosen small number (0.1) is added.\n\n```\nproc transreg data=HeadNeck;\n \
    \   model boxcox(suv/parameter=0.1) = class(gold);\nrun;\n```\n\nOutput 3.5 shows\
    \ the results. The primary output is the (log) likelihood values for each λ. As\
    \ explained in the legend, a less-than symbol (<) points to the best λ (that is,\
    \ the one that maximizes the likelihood). Observations marked with an asterisk\
    \ (*) form a confidence interval, and a plus sign (+) is a convenient choice for\
    \ λ. According to the criteria for being convenient, the number must be round\
    \ and contained in the confidence interval. In this example, λ=0.5 is identified\
    \ as the best choice, implying a square root transformation.\n\n## Output 3.5\n\
    \nThe TRANSREG Procedure\n\nTransformation Information\nfor BoxCox(suv)\n\n| Lambda\
    \ | R-Square | Log Like |\n| -3.00 | 0.25 | -1135.75 |\n| -2.75 | 0.25 | -1032.16\
    \ |\n| -2.50 | 0.25 | -930.05 |\n| -2.25 | 0.25 | -829.71 |\n| -2.00 | 0.25 |\
    \ -731.55 |\n| -1.75 | 0.25 | -636.09 |\n| -1.50 | 0.26 | -544.03 |\n| -1.25 |\
    \ 0.26 | -456.31 |\n| -1.00 | 0.26 | -374.17 |\n| -0.75 | 0.27 | -299.21 |\n|\
    \ -0.50 | 0.28 | -233.40 |\n| -0.25 | 0.31 | -179.12 |\n| 0.00 | 0.34 | -139.18\
    \ |\n| 0.25 | 0.38 | -116.98 * |\n| 0.50 + | 0.42 | -115.97 < |\n| 0.75 | 0.43\
    \ | -137.84 |\n| 1.00 | 0.42 | -180.65 |\n| 1.25 | 0.39 | -239.65 |\n| 1.50 |\
    \ 0.35 | -309.89 |\n| 1.75 | 0.30 | -387.75 |\n| 2.00 | 0.26 | -470.92 |\n| 2.25\
    \ | 0.23 | -558.00 |\n| 2.50 | 0.20 | -648.08 |\n| 2.75 | 0.17 | -740.57 |\n|\
    \ 3.00 | 0.14 | -835.03 |\n\n< - Best Lambda\n* - Confidence Interval\n+ - Convenient\
    \ Lambda\n"
  mdcn: "\n\n```\nproc nlmixed data=HeadNeck;\n    parameters m1=0 m0=0 s1=1 s0=1;\n\
    \    if gold=1 then m=m1;else if gold=0 then m=m0;\n    if gold=1 then s=s1**2;else\
    \ if gold=0 then s=s0**2;\n    a=(m1-m0)/s1;\n    b=s0/s1;\n    model suv ~ normal(m,s);\n\
    \    estimate 'a' a;\n    estimate 'b' b;\n    estimate 'AUC' probnorm(a/sqrt(1+b**2)));\n\
    run;\n```\n\n要将此代码用于您的数据集，请用金标准和标记的变量名替换变量 Gold 和 SUV。执行此操作后，NLMIXED 输出的相关部分显示在输出\
    \ 3.4 的 Additional Estimates 下。\n\n## Output 3.4\n\n| Additional Estimates |\n\
    | Label | Estimate | Standard Error | DF | t Value | Pr > |t| | Alpha | Lower\
    \ | Upper |\n| a | 1.4086 | 0.1830 | 181 | 7.70 | <.0001 | 0.05 | 1.0476 | 1.7696\
    \ |\n| b | 0.6597 | 0.07196 | 181 | 9.17 | <.0001 | 0.05 | 0.5177 | 0.8017 |\n\
    | AUC | 0.8802 | 0.02727 | 181 | 32.27 | <.0001 | 0.05 | 0.8263 | 0.9340 |\n\n\
    可以看到，二元正态参数 a 和 b 的估计值分别为 1.4086 和 0.6597。相应的 ROC 曲线由 Φ(1.41 + 0.66 Φ⁻¹(x)) 表示，其中\
    \ x 的取值范围为 0 到 1。ROC 曲线在 0 到 1 之间所有点都有定义，这是该模型的一个特征。虽然并非所有阈值都被观察到，但二元正态模型进行插值并为一特异性所有可能取值提供灵敏度值。\n\
    \n得到的 AUC 为 0.8802，标准误差为 0.02727。您可以使用标准渐近法形成 95% 置信区间：AUC±1.96*se(AUC)，结果为 (0.826,\
    \ 0.934)。表 3.3 比较了二元正态模型与经验分析的结果。AUC 估计值和置信区间都非常接近。\n\n## Table 3.3 Comparison\
    \ of AUC Estimates from the Empirical and Binormal ROC Curves\n\n| Method | AUC\
    \ | SE | Confidence Interval |\n| Empirical | 0.8713 | 0.0263 | 0.820–0.923 |\n\
    | Binormal | 0.8802 | 0.0273 | 0.826–0.934 |\n\n从 ROC 曲线分析的角度来看，ESTIMATE 语句是 PROC\
    \ NLMIXED 的一个重要优势，因为它允许您直接获得 a、b 和 AUC 的估计值，以及更重要的是其标准误差。另一个优势将在后续章节中变得明显，即它足够灵活，可以容纳几种不同类型的\
    \ ROC 曲线。\n\n下面是使用 PET 数据集示例对经验曲线（实线）和二元正态曲线（虚线）进行的图形比较。早期，二元正态 ROC 曲线高于经验曲线，表明灵敏度相对于经验值被高估。后来，两条曲线相交，二元正态曲线开始低估灵敏度。大多数情况下，两条曲线之间的差异小于\
    \ 10%。对于大多数用途而言，这可以被认为是一个拟合合理的二元正态 ROC 曲线。图 3.6 显示了两条不同曲线的比较图。\n\n## Figure 3.6\
    \ Comparison of Empirical and Binormal ROC Curves\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_39_0.png)\n\
    \n图 3.6 由以下 SAS 语句生成。关键思想在于 DATA 步，其中 PROC LOGISTIC 中 OUTROC= 选项产生的数据集（此处称为 ROCData）从二元正态模型生成灵敏度。ROCData\
    \ 已包含经验曲线的灵敏度和一特异性对。另一个变量，此处称为 _BSENSIT_，使用二元正态模型的功能形式以及用 PROC NLMIXED 估计的参数（前面已描述）添加。然后将\
    \ _BSENSIT_ 和 _SENSIT_ 对 _1MSPEC_ 进行绘图，并在同一张图上叠加。实线为经验曲线（_SENSIT_），虚线为二元正态曲线（_BSENSIT_）。\n\
    \n```\ndata ROCData;\n    set ROCData;\n    _bsensit_=probnorm(1.41+0.66*probit(_1mspec_));\n\
    run;\n```\n\n```\naxis1 length=12cm order=0 to 1 by 0.2 label=(f=swissb h=2)\n\
    \    value=(font=swissb h=2);\naxis2 length=12cm order=0 to 1 by 0.2 label=(a=90\
    \ f=swissb h=2)\n    value=(font=swissb h=2);\n```\n\n```\nsymbol1 v=none i=join\
    \ w=3 l=1 c=black;\nsymbol2 v=none i=join w=3 l=3 c=black;\n```\n\n```\nproc gplot\
    \ data=ROCData;\n    plot (_sensit_ _bsensit_)*_1mspec_ / haxis=axis1 vaxis=axis2\n\
    \        overlay;\nrun;\nquit;\n```\n\n## 3.7 Transformations to Binormality\n\
    \n正态性假设在二元正态模型中起着至关重要的作用。熟悉 t 检验和方差分析理论的统计学家可能会因大样本量可以克服非正态性影响的普遍观念而忽视其重要性。对于比较多个组均值的程序（例如\
    \ t 检验或 F 检验），这通常是正确的，主要是因为在大样本中，样本均值即使个体观测明显非正态也能近似为正态分布。\n\n相比之下，ROC 曲线不仅仅比较患病组和未患病组的均值。事实上，正如第\
    \ 3.3 节所示，ROC 曲线可以表示为 G(F⁻¹(x))，其中 x 为一特异性，G(.) 为患病组预测因子的累积密度，F(.) 为未患病组的累积密度。因此，准确估计\
    \ ROC 曲线需要准确估计 F 和 G 的所有点。二元正态模型假设 F 和 G 为正态分布的累积密度函数，并且这两个正态分布的参数从数据中估计。如果数据明显非正态，则\
    \ F 和 G 的估计在多个点上可能严重不准确。这不能通过收集更大的样本轻易解决。\n\n因此，使用二元正态模型会引发数据是否确实为正态以及非正态性是否可以通过单调变换修复的问题。基于第\
    \ 3.3 节，您可能会认为所有 ROC 曲线都是不变的。这显然不是这种情况。所有参数 ROC 曲线，特别是二元正态模型，都不是对单调变换不变的。\n\n\
    标准化变换在最小二乘回归和方差分析中很有兴趣，因此关于它的文献非常丰富。其中最流行的方法之一是 PROC TRANSREG 中实现的 Box-Cox 幂族。\n\
    \nBox-Cox 幂族变换可以定义为\n\ny^{(λ)} = { (y^λ - 1)/λ   λ > 0\n            log(y)   \
    \    λ = 0 }\n\n每个 λ 值定义一个变换。例如，λ=1 使用原始值，λ=0 对应对数变换。此定义假设 y 最初为非负；如果不是这种情况，可以添加一个常数来移动值。思路是根据观察到的数据选择\
    \ λ。PROC TRANSREG 使用 λ 的最大似然估计以及相关的置信区间。由于 λ 的选择取决于数据，建议将其估计值四舍五入到最接近的四分之一，只要它们在相关的置信区间内即可。\n\
    \n这种表示没有考虑到金标准。需要标准化的标记分布是条件分布（以金标准为条件，前面记号中的 F 和 G）。相比之下，Box-Cox 族试图标准化标记值的边际分布。您可以重新定义该族使其标准化条件分布。最简单的方法是认识到以标记为结果、金标准为协变量的方差分析模型是建模所需条件分布的一种方法。有关更多信息，请参阅\
    \ Sakia (1992)。\n\n在 PET 示例中，您可以使用以下对 PROC TRANSREG 的调用来估计 λ。模型的左侧包含要变换的标记值，右侧包含金标准，如前所述，以确保条件分布被标准化。PARAMETER=\
    \ 选项指定在估计 λ 之前添加到所有观测值的一个常数。由于某些 SUV 为 0，因此添加了一个任意选择的小数（0.1）。\n\n```\nproc transreg\
    \ data=HeadNeck;\n    model boxcox(suv/parameter=0.1) = class(gold);\nrun;\n```\n\
    \n输出 3.5 显示了结果。主要输出是每个 λ 的 (对数) 似然值。如图例中所述，小于号（<）指向最佳 λ（即使似然最大化的那个）。带星号 (*) 的观测值形成置信区间，而加号\
    \ (+) 是 λ 的方便选择。根据方便性的标准，数字必须为整数且包含在置信区间内。在此示例中，λ=0.5 被确定为最佳选择，意味着平方根变换。\n\n##\
    \ Output 3.5\n\nThe TRANSREG Procedure\n\nTransformation Information\nfor BoxCox(suv)\n\
    \n| Lambda | R-Square | Log Like |\n| -3.00 | 0.25 | -1135.75 |\n| -2.75 | 0.25\
