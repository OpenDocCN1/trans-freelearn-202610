  md: "\n# Figure 5.4 The ROC Curve Implied by the Latent Variable Binormal Model\n\
    \n![](img/ac26020abd4f22abfaafc0607939c6e4_73_0.png)\n\n## 5.6 Comparing ROC Curves\
    \ for Ordinal Markers\n\nComparing ordinal ROC curves can either be based on the\
    \ empirical curve or the latent binormal model. The %ROC macro can be used to\
    \ compare the areas under the two empirical ROC curves. Alternatively, the latent\
    \ binormal model can be used to compare the parameters of the two latent binormal\
    \ curves.\n\n### 5.6.1 Metastatic Colorectal Cancer Example\n\nSome of the tumors\
    \ in the colon and rectum spread to the liver, in which case they are called metastatic\
    \ colorectal cancer. If the spread is limited to the liver, then it can be removed\
    \ surgically. But if there are other sites of metastases, then a liver operation\
    \ is not indicated. For this reason, all metastatic colorectal cancer patients\
    \ who are candidates for liver surgery are carefully screened for tumors outside\
    \ the liver. The example in this section compares two different methods for extrahepatic\
    \ imaging: computed tomography (CT) and positron emission tomography (PET). Each\
    \ patient underwent both scans and each image was evaluated using a three-point\
    \ scale by a radiologist: positive (presence of cancer), equivocal, and negative\
    \ (absence of cancer).\n\n### 5.6.2 Comparing the Areas under the Empirical ROC\
    \ Curves\n\nJust as empirical curves for an ordinal predictor can be constructed\
    \ using the %ROC macro, areas under multiple empirical ROC curves can also be\
    \ compared. The following call to the %ROC macro generates the desired comparison:\n\
    \n```\n%roc(version,data=modif,var=pet ct,response=surg,contrast=1 -1);\n```\n\
    \nOutput 5.4 shows the results.\n\n### Output 5.4\n\nThe ROC Macro\n\nROC Curve\
    \ Areas and 95% Confidence Intervals\n\n| ROC Area | Std Error | Confidence Limits\
    \ |\n|---|---|---|\n| pet 0.6744 | 0.2349 | 0.2141 1.1347 |\n| ct 0.5526 | 0.2162\
    \ | 0.1289 0.9763 |\n\nContrast Coefficients\npet ct\nRow1 1 -1\n\nTests and 95%\
    \ Confidence Intervals for Contrast Rows\nEstimate Std Error Confidence Limits\
    \ Chi-square Pr > ChiSq\n0.6744 0.2349 0.2141 1.1347 8.2461 0.0041\n0.5526 0.2162\
    \ 0.1289 0.9763 6.5346 0.0106\n\nContrast Test Results\nChi-Square DF Pr > ChiSq\n\
    11.6473 2 0.0030\n\nThe areas under the curve are 0.6744 for PET and 0.5526 for\
    \ CT, with wide confidence intervals, in one case extending over 1. By definition,\
    \ the AUC cannot exceed 1, so the upper limit of 1.1347 is a shortcoming of the\
    \ asymptotic method that is used for confidence interval calculations. Generally,\
    \ confidence intervals can be truncated from below at 0 and from above at 1. The\
    \ difference between the empirical two areas under the ROC curves is 0.1218 and\
    \ significant (p=0.003).\n\n### 5.6.3 Comparing the Areas under the Latent Binormal\
    \ ROC Curves\n\nAs an alternative to the empirical method, a latent binormal model\
    \ might be assumed for both PET and CT. At this point, it is no surprise that\
    \ the steps to compare the two latent binormal curves can be inspired by the binormal\
    \ methods from Chapter 3. The key idea is to consider a regression model with\
    \ the main effects of binary disease status (cancer/no cancer) and a binary indicator\
    \ (PET/CT) as well their interaction. This leads to a model with a right-hand\
    \ side identical to the models considered in Section 4.9. The coefficient of the\
    \ interaction term is the key term again, representing the difference between\
    \ the two ROC curves. The random term u represents the correlation between the\
    \ two tests that is induced by the paired design.\n\nThe p-value for α₃ from the\
    \ following code can be used to compare the two binormal curves. The variable\
    \ Test is the binary indicator CT/PET.\n\n```\nproc nlmixed gconv=0;\n  parms\
    \ alpha1=1 alpha2=1 alpha3=1 theta2=3 beta=1 s=1;\n  bounds theta2>0;\n  eta1=alpha1*surg+alpha2*test+alpha3*surg*test+u;\n\
    \  eta2=exp(beta*surg);\n    if result=1 then z = probnorm(-eta1/eta2);\n  else\
    \ if result=3 then z = probnorm((theta2-eta1)/eta2) - probnorm((theta2-eta1)/eta2);\n\
    \  else if result=5 then z = 1 - probnorm((theta2-eta1)/eta2);\n  if z>1e-6 then\
    \ ll=log(z);\n    else ll=-1e6;\n  model result ~ general(ll);\n  random u ~ normal(0,s)\
    \ subject=patient;\nrun;\n```\n\nCovariate adjustments for ordinal markers can\
    \ be done using the same representation in Chapter 4 by using an interaction term.\
    \ There is no covariate of interest in the metastatic colorectal cancer example,\
    \ but consider, hypothetically, that the age of the patient might have a bearing\
    \ on the accuracy of CT scans. Then age-adjusted ROC curves for CT scans can be\
    \ obtained using the following call to PROC NLMIXED:\n\n```\nproc nlmixed gconv=0;\n\
    \  parms alpha1=1 alpha2=1 alpha3=1 theta2=3 beta=1 s=1;\n  bounds theta2>0;\n\
