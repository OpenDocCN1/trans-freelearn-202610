  - "[PAGE 95]\n\n# Output 7.2\n\n```\nThe SAS System\n\nThe LIFETEST Procedure\n\n\
    Product-Limit Survival Estimates\n\nSurvival\nStandard\nNumber\nNumber\nTimelist\
    \    Survival    Survival    Failure    Error    Failed    Left\n36.0000    29.0000\
    \    0.6335    0.3665    0.0784    16    8\n```\n\n# 7.3.3 Estimation of P(W)\n\
    \nW is not subject to censoring, so, in principle, P(W>c) is the proportion of\
    \ observations exceeding c. P(W) can be computed in many different ways in SAS,\
    \ including using a DATA step or PROC SQL programming as well as using PROC UNIVARIATE\
    \ and PROC FREQ. You can also use PROC LIFETEST because, in the absence of censoring,\
    \ Kaplan-Meier methods produce the same results that would have been obtained\
    \ from the standard methods. Because specifying a status variable is optional,\
    \ PROC LIFETEST can be used for this purpose, as follows:\n\n```\nproc lifetest\
    \ data=lung timelist=(9);\n    time suv;\nrun;\n```\n\nThis is a somewhat unusual\
