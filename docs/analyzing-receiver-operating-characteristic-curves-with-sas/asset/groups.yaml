  - '[PAGE 125]


    benefit an ROC-focused discussion. Think of neural networks as a specific yet
    flexible class of nonlinear regression models.


    Before we run decision trees and neural networks on the same data set, there is
    one important issue to consider about missing data. Both logistic regression and
    neural networks require complete observations. If any portion of a record is missing,
    that record is completely ignored during model building. Decision trees are more
    forgiving. They consider surrogate splits in case the variable for the primary
    split is missing. For this reason, if we run logistic regression, neural networks,
    and decision trees on the same input data, the actual data that the predictive
    model rests on may not be identical from one method to the other. You could address
    this by imputing the value from a distribution derived from the normal density.
    An imputation node can be dragged and dropped from the Modify tab, as seen in
    Figure 9.4. The same figure also shows the addition of decision tree and neural
    network nodes, both dragged and dropped from the Model tab.


    # Figure 9.4 SAS Enterprise Miner Diagram Workspace for the Competing Models Example


    ![](img/ac26020abd4f22abfaafc0607939c6e4_125_0.png)


    The flow in Figure 9.4 implies that the same data set will be analyzed three different
    ways and the results compared in the final node.


    Three ROC curves, one for each method of analysis, are plotted to better assess
    the predictive power of the models (see Figure 9.5). Neural networks and logistic
    regression have very similar performance. The decision tree outperforms regression
    and neural networks. It has higher sensitivity than the other two for a given
    value of specificity for the most part, especially in the range where both sensitivity
    and specificity are above 0.5. The neural network method is slightly better than
    the regression method, although the difference between the two seems to dissipate
    in the validation and test sets. Output 9.2 reports the AUCs for each model and
    data set. The AUC for the decision tree is consistently above 85%, while the other
    two models’ AUCs cluster around 80%.'
