    run;\n```\n\n最后，叠加重抽样估计和分割样本估计是有启发性的。这在图 8.3 中实现，该图显示了两条 ROC 曲线，一条通过重抽样获得，另一条通过分割样本验证获得。重抽样曲线在大部分情况下位于分割样本曲线之上，但存在分割样本曲线上升超过重抽样曲线的区域。这似乎与重抽样会导致\
    \ ROC 曲线上所有点都被高估的预期相悖。这突出了分割样本方法的首要缺点；即，它只提供一个测试集，在该测试集上可以计算准确性估计值（如给定特异性下的敏感性）。尽管它提供了无偏估计，但这些估计包含相当大的变异性，我们刚刚观察到的这种情况并不少见。这是使用下一节中讨论的样本重用方法的主要原因。\n\
    \n## Figure 8.3 Comparison of the Resubstitution and Split-Sample Estimates of\
    \ the ROC Curve for the Liver Resection Example\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_112_0.png)\n\
    \n## 8.5 Cross-Validation Estimates of the ROC Curve\n\n### 8.5.1 Leave-One-Out\
    \ Estimation\n\nPROC LOGISTIC 提供了一个内置选项用于交叉验证，即执行留一法。如本章介绍中简要解释的那样，留一法通过暂时剔除一个观测值，在剩余数据集上构建模型，然后使用该模型预测被剔除的记录来实现。当此过程对每个观测值重复时，使用对预测观测值“盲”的模型为数据集中每条记录获得一个预测。这些预测构成了交叉验证\
    \ ROC 曲线的<|message|> 基础。\n\n可以使用以下代码通过 PROC LOGISTIC 执行留一交叉验证。OUTPUT 语句中的 PREDPROBS=X\
    \ 选项指定使用留一交叉验证而不是重抽样。此选项适用于 OUTPUT 语句生成的所有预测概率。如果省略 PREDPROBS= 选项，则预测概率使用重抽样计算。\n\
    \n```\nproc logistic data=liver;\n    model complications=age_at_op comorb lobeormore_code\n\
    \        bilat_resec_code numsegs_resec / selection=s;\n    output out=outx predprobs=x;\n\
    \    ods output classification=classroc;\nrun;\n```\n\n现在可以使用与分割样本验证推荐的相同方法绘制\
    \ ROC 曲线，包括其中一个绘图宏。ROC 曲线下面积及其标准误差可通过 %ROC 宏获得。以下对 %ROC 宏的调用使用 PROC LOGISTIC 在指定\
    \ PREDPROBS=X 选项时创建的数据集，生成留一估计的 AUC（Output 8.3）。交叉验证预测概率的变量名为 XP_1：\n\n```\n%roc(data=outx,\
    \ var=xp_1, response=complications, contrast=1);\n```\n\n## Output 8.3\n\n```\n\
    The ROC Macro\n\n        ROC Curve Areas and 95%\n            Confidence Intervals\n\
    \    ROC Area Std Error Confidence Limits\n\nXP_1  0.6875    0.0226    0.6431\
    \    0.7318\n```\n\n通过留一交叉验证获得的 AUC 估计值为 0.6875，置信区间为 0.6431–0.7318。图 8.4 对比了\
    \ ROC 曲线的重抽样估计和留一估计。虽然两条曲线非常接近，但留一估计始终低于重抽样估计。\n\n## Figure 8.4 Comparison of\
    \ the Resubstitution and Leave-One-Out Estimates of the ROC Curve for the Liver\
    \ Resection Example\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_114_0.png)\n\n\
    乍一看，在此示例中使用 OUTROC= 选项绘制 ROC 曲线似乎是合理的。然而，PREDPROBS=X 选项不影响 MODEL 语句中 OUTROC= 选项创建的数据集。即使同时指定\
    \ OUTROC= 和 PREDPROBS=X 选项，OUTROC= 选项创建的数据集仍报告重抽样估计值。同样，相关性度量包括 c 和 Somers’ D\
    \ 也按重抽样基准报告。因此，通常用于获得 ROC 点和曲线下面积的方法不适用于交叉验证，这些任务必须在 PROC LOGISTIC 外部手动执行。\n\n\
    ### 8.5.2 K-Fold Cross-Validation\n\n虽然指定 PREDPROBS=X 选项是获得留一估计的便捷方法，但您应该了解更多关于如何在\
    \ SAS 中使用 %XVAL 宏执行交叉验证的信息。您可以使用此宏执行 k 折交叉验证。当使用 PROBIT、GENMOD 或 GAM 等不提供标准交叉验证选项的其他过程进行预测时，这也很有帮助。\n\
    \nk 折交叉验证的起点涉及将数据划分为 k 个随机选择的段，其中 k 由用户提供。在 k 折交叉验证中，分析重复 k 次。对于每次分析，其中 k 个段中的一个被留作测试集，其余\
    \ k−1 个用于训练。在每次分析中，模型对测试数据是盲的。表 8.1 解释了 k=5 的特殊情况下每个段在交叉验证中的作用。\n\n## Table 8.1\
    \ The Role of Segments within Each Analysis in Five-Fold Cross-Validation\n\n\
    |  | Segment 1 | Segment 2 | Segment 3 | Segment 4 | Segment 5 |\n|---|---|---|---|---|---|\n\
    | Analysis 1 | Training | Training | Training | Training | Test |\n| Analysis\
    \ 2 | Training | Training | Training | Test | Training |\n| Analysis 3 | Training\
    \ | Training | Test | Training | Training |\n| Analysis 4 | Training | Test |\
    \ Training | Training | Training |\n| Analysis 5 | Test | Training | Training\
    \ | Training | Training |\n\n这种验证方案有几个优点：\n\n- 它在概念上很简单。\n- 每个段（因此每个数据点，因为段不重叠）恰好在测试集中出现一次，因此对每个数据点只进行一次预测。\n\
    - k 的选择允许在训练集和测试集的大小上进行一定的灵活性。\n\n第二点构成了我们目的的验证基础。由于每个观测值都有一个预测，因此可以直接从这些预测值获得\
    \ ROC 曲线。这可以通过使用上一节中描述的任何方法实现，因为从获得 ROC 曲线的角度来看，使用 PROC LOGISTIC 的 SCORE 语句获得的数据集与\
    \ k 折交叉验证的 k 次分析中合并的测试数据之间没有区别。\n\n%XVAL 宏可从本书的配套网站 support.sas.com/gonen 获得，可执行交叉验证。K\
    \ 是宏的输入之一，以及数据集名称、结果和协变量。%XVAL 宏不产生输出，但生成一个名为 _XVAL_ 的数据集，其中包含交叉验证的预测概率（P_0 和\
    \ P_1=1-P_0）以及原始变量。此结果数据集可用于对 %PLOTROC 和 %ROC 宏的调用，以获得 ROC 曲线及其下面积的交叉验证估计。例如，以下三个宏调用对\
    \ Liver 数据执行五折交叉验证：\n\n```\n%xval(dsn=liver,outcome=complications,covars=age_at_op\
    \ comorb lobeormore_code bilat_resec_code numsegs_resec,k=5);\n%plotroc(xval,P_1,COMPLICATIONS,anno=2);\n\
    %roc(data=xval,var=P_1,response=COMPLICATIONS,CONTRAST=1);\n```\n\n%PLOTROC 宏生成的\
    \ ROC 曲线出现在图 8.5 中，%ROC 宏的结果出现在 Output 8.4 中。五折验证 AUC 的估计值为 0.6883，标准误差为 0.0226，几乎与留一估计无法区分。\n\
    \n"
