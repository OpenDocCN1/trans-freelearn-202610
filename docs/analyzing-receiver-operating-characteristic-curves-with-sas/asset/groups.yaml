  - '[PAGE 27]


    The upper panel of the figure is the histogram of SUV for the gold standard negative
    patients (those without cancer) and the lower panel is for gold standard positive
    patients (those with cancer), as denoted by the vertical axis. Patients with cancer
    tend to have higher SUV values; only a few have very low SUVs. A very high SUV
    (say, 10 or more) almost certainly implies cancer. There is, however, some overlap
    between the distributions for SUVs in the middle range (roughly 4–10). So extreme
    values of the SUV strongly imply cancer or lack of cancer, but there is a gray
    area in the middle. This is in fact a very common picture for many continuous
    predictors. How accurate, then, is SUV for diagnosing cancer?


    One crude way of approaching the problem is to compute the sensitivity and specificity
    for various thresholds. Figure 3.2 uses a threshold of 7. To the left (SUV≤7)
    are considered negative for cancer and to the right (SUV>7) are considered positive
    for cancer. HREF=7 option is used in the HISTOGRAM statement for drawing the reference
    line and FRONTREF options was used to ensure that the reference line is in front
    of the histogram bars.


    A greater proportion of gold standard negative patients have SUV≤7 and are classified
    as without cancer. Similarly, a greater proportion of gold standard positive patients
    have SUV>7 and are classified as having cancer.


    # Figure 3.2 Dichotomizing at SUV=7


    ![](img/ac26020abd4f22abfaafc0607939c6e4_27_0.png)


    Dichotomization of the SUV can be accomplished using the following DATA step command:


    ```

    suv7=(suv>7);

    ```


    This can produce undesirable behavior if the SUV variable contains missing values
    because a missing value will satisfy suv≤7, which will be recoded as 0 in this
    case. IF-THEN statements should be employed if the variable to be recoded contains
    missing values.'
  - '[PAGE 28]


    Using the variable SUV7, you can easily obtain the kind of 2x2 table considered
    in the previous chapter for the weather forecast example. For this data set, it
    would look like the cells in Table 3.1:


    # Table 3.1 Accuracy of SUV>7 in Cancer Diagnosis


    | SUV>7 Classification | Gold Standard Diagnosis |  |  |

    | | Cancer | No Cancer | Total |

    | Cancer | 25 | 3 | 28 |

    | No Cancer | 42 | 111 | 153 |

    | Total | 67 | 114 | 181 |


    The rows are classifications by the SUV>7 rule and the columns are classifications
    by the gold standard. Using the techniques covered in Chapter 2, you can use PROC
    FREQ to estimate the sensitivity and specificity as 25/67=37% and 111/114=97%.
    Therefore, using 7 as the SUV threshold to classify patients as having cancer
    or not is highly specific but of questionable sensitivity. This is not necessarily
    a verdict on the ability of the entire spectrum of standardized uptake values
    to diagnose cancer. In fact, Figure 3.2 suggests that moving the threshold to
    the left (i.e., using a lower threshold) will increase sensitivity at the cost
    of reducing specificity. Because the sensitivity using 7 as the threshold is so
    poor and the specificity so high, this might be a worthwhile strategy. This might
    help you find a better threshold, but it still falls short of determining whether
    the SUV is a good predictor of cancer. The next section explains how this can
    be done using ROC curves.


    # 3.2 The ROC Curve


    The previous analyses can be repeated for various thresholds, each of which may
    produce different values of sensitivity and specificity. One way to report the
    results of such an analysis would be in tabular form. Table 3.2 is an example,
    reporting on a few selected thresholds.


    # Table 3.2 Accuracy of SUV in Diagnosing Cancer for Various Thresholds


    | Threshold | 1 | 3 | 5 | 7 |

    | Sensitivity | 97% | 93% | 61% | 37% |

    | Specificity | 48% | 65% | 88% | 97% |


    Table 3.2 makes clear the wide range of sensitivity and specificity that can be
    obtained by varying the threshold. It also identifies the inverse relationship
    between the two measures: As one increases, the other decreases and vice versa.
    This can be seen from the histogram. If you move the dashed line to the left (to
    5, for example, instead of 7), more patients will be classified as positive: Some
    of these will be gold standard positive, hence true positives, which will increase
    the sensitivity. Others, however, will be gold standard negative, and hence false
    positives, which will decrease specificity. So the relationship observed in Table
    3.2 is universal: It is not possible to vary the threshold so that both specificity
    and sensitivity increase.


    A tabular form is limited in the number of thresholds it can accommodate. You
    can plot sensitivity versus specificity, making it possible to accommodate all
    possible thresholds. Table 3.2 shows that since the two are inversely related,
    the plot of sensitivity against specificity will show a decreasing trend. A visually
    more appealing display can be obtained by plotting'
