  mdcn: "\n\n使用以下关系\n\n```\n$$AUC = \\frac{D + 1}{2}$$\n```\n\n可以计算出曲线下面积为 0.8713，与\
    \ LOGISTIC 输出相同，后者报告了三位有效数字。同样使用关系\n\n```\n$$se(AUC) = \\frac{se(D)}{2}$$\n```\n\
    \nAUC 的标准误差计算为 0.026。可以使用渐近正态理论为 AUC 计算置信区间\n\n```\n$$AUC + 1.96 * se(AUC)$$\n\
    ```\n\n结果为 (0.8203, 0.9222)。这比 PROC LOGISTIC 提供的分析更完整，因为你可以判断抽样变异对 AUC 估计的影响。\n\
    \n## 3.4.3 The %ROC Macro\n\n虽然 PROC FREQ 对于计算曲线下面积及其标准误差而言对我们的目的已足够，但现在是介绍一个\
    \ SAS 宏的好时机，该宏主要用于比较几条 ROC 曲线的下面积；不过它也可以将单条 ROC 曲线作为特例来处理。%ROC 宏目前为第 1.5 版，可在以下\
    \ URL 下载：\n\nsupport.sas.com/samples_app/00/sample00520_6_roc.sas.txt\n\n以下是可用于此示例的代码：\n\
    \n```\n%roc(data=HeadNeck,var=SUV,response=gold,contrast=1,details=no,\n    alpha=.05);\n\
    ```\n\n用于调用 %ROC 的宏变量有\n\n- Response：这是金标准，或结局。你需要创建一个数据集变量，其取值仅为 0 或 1；宏无法对观察到的二分类重新编码。该变量必须是数值型；仅有两个不同值（0\
    \ 和 1）的字符变量会通过宏的错误检查设施，但会产生 PROC IML 错误，这很难调试。\n- Var 指定标记。\n- Contrast 主要用于比较几条曲线，如我们在后面章节中会看到的。对于单条\
    \ ROC 曲线，Contrast 的值始终为 1。\n- Alpha 与置信限估计有关。\n- Details 控制打印输出的多少。\n\nOutput\
    \ 3.3 显示了此调用的结果。曲线下面积为 87.13%，与 PROC LOGISTIC 的一致性相同，也与 PROC FREQ 中 Somers’ D\
    \ 导出的一致。标准误差也与 PROC FREQ 中 Somers’ D 导出标准误差相同。置信区间也相匹配，至多存在舍入误差。\n\n## Output\
    \ 3.3\n\n```\nThe ROC Macro\n\n        ROC Curve Areas and 95%\n            Confidence\
    \ Intervals\n        ROC Area Std Error Confidence Limits\nSUV     0.8713    0.0263\
    \    0.8198    0.9228\n```\n\n经常使用 ROC 曲线的用户应该熟悉这个宏。另一方面，如果你只是偶尔需要 AUC 估计及其标准误差，那么使用\
    \ PROC FREQ 可能更容易。\n\n## 3.5 Selecting an Optimal Threshold\n\n在某些情况下，虽然原始预测是连续的，但报告二元预测是有意义的。回顾本章开头使用的降雨预测示例。假设你有一个模型可提供某一天降水概率的预测概率。除了这个预测概率之外，你可能还想显示一个描绘降雨的图标，以更简单的形式传达预测。我们大多数人都见过电视或报纸天气预报中的此类图标。通过包含此图标，我们本质上是基于连续预测因子（降雨预测概率）报告二元预测（降雨/无降雨）。这相当于选择一个阈值，这本身相当于在\
    \ ROC 曲线上选择一个工作点。\n\n有时外部标准可能会指导工作点的选择。在没有此类标准的情况下，你可能会选择在某种意义上最优的阈值。有两种广泛使用的方法：\n\
    \n- 1. 选择使 resulting 二元预测尽可能接近完美预测因子的阈值。\n- 2. 选择使 resulting 二元预测尽可能远离无信息预测因子的阈值。\n\
    \n为了更好地理解这些方法，请记住完美预测因子在其 ROC 曲线上只有一个点（即单位正方形的左上角），灵敏度为 100%，特异性为 100%。同样，无信息标记的\
    \ ROC 曲线沿单位正方形的对角线。ROC 曲线上某点与这些参考点之间的距离使用所谓的欧几里得方法来衡量。坐标为 (x₁, y₁) 和 (x₂, y₂)\
    \ 的点 A 和 B 之间的欧几里得距离如下给出：\n\n```\nd_AB = √(x₁ − x₂)² + (y₁ − y₂)²\n```\n\n为了说明这一点，经验\
    \ ROC 曲线在图 3.5 中再次绘制，其中包含两个候选最优工作点 A 和 B。R 表示选择最优阈值的第一种方法的参考点。同样，P 和 Q 表示第二种方法的参考点。根据第一个定义，你需要计算线段\
    \ RA 和 RB 的长度，如果 RA 比 RB 短，则偏好 A。同样，如果采用第二种阈值选择方法，则需要比较 AP 和 BQ 的长度，如果 AP 比 BQ\
    \ 长，则偏好 A。\n\n## Figure 3.5 Choosing the Optimal Threshold Using the Empirical\
    \ ROC Curve\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_36_0.png)\n\n%PLOTROC\
    \ 宏的 OPTIMAL 选项会生成一个名为 _OPTIMAL_ 的数据集，该数据集为每个阈值计算这里解释的两个距离。这两个变量称为 DIST_TO_PERFECT\
    \ 和 DIST_TO_NONINF，可用于在 ROC 曲线上选择最优工作点。\n\n方法选择主要由应用领域决定。在医学诊断的背景下，最优通常意味着接近理想，而在工程背景下通常意味着远离随机。事实上，这里考虑的垂直距离度量等于\
    \ Youden’s index，这是一种在质量控制中流行的准确性汇总度量，尽管它最初是在医学背景下引入的（Youden, 1950）。\n\n不幸的是，两种最优性标准会产生不同的最优工作点。这由\
    \ Perkins 和 Schisterman（2006）从分析上证明。大多数时候，两者足够接近，可以消除对方法选择的任何担忧。\n\n## 3.6 The\
    \ Binormal ROC Curve\n\n到目前为止，我们的重点一直放在经验曲线上，即通过连接观察到的（灵敏度，1-特异性）对得到的曲线。经验曲线被广泛使用，因为它易于生成，并且对标记分布的变化具有鲁棒性（在秩的基础上）。但有时你可能更喜欢平滑曲线。平滑\
    \ ROC 曲线的最常见方法是使用双正态模型。\n\n双正态模型假设标记（或单调变换）在金标准类别内的分布为正态分布。对于 PET 数据集示例，我们可以假设癌症患者的\
    \ SUV 服从正态分布，均值为 μ₁，方差为 σ₁²，而无癌症患者的 SUV 服从正态分布，均值为 μ₀，方差为 σ₀²。然后，使用经验 ROC 曲线的记号\n\
    \n```\nF(t) = Φ( (μ₀ - t) / σ₀ )\n```\n\n阈值 t 可以写成 x 的函数如下：\n\n```\nt = μ₀ - σ₀\
    \ Φ⁻¹(x)\n```\n\n由于阈值 t 对应于灵敏度 F(t)，我们可以写出 ROC 曲线的函数形式如下：\n\n```\nG(t) = Φ( (μ₁\
    \ - t) / σ₁ ) = Φ( (μ₁ - μ₀ + σ₀ Φ⁻¹(x)) / σ₁ ) = Φ( a + b Φ⁻¹(x) )\n```\n\n其中\n\
    \n```\na = (μ₁ - μ₀) / σ₁ ,   b = σ₀ / σ₁\n```\n\n这两个参数 a 和 b 通常被称为双正态参数。有时它们被称为截距和斜率，因为在正态概率纸上绘制双正态曲线会得到截距为\
    \ a、斜率为 b 的直线。这种做法现在并不常见，但命名法仍然沿用。\n\n如果标记值不是正态分布的，但在单调变换后可以是正态分布，则双正态 ROC 曲线拟合到变换后的值。尽管如此，拟合到变换后值的双正态曲线仍被认为是对未变换标记的\
    \ ROC 曲线，因为标记的真实 ROC 曲线在单调变换下是不变的，如第 3.3 节所示。因此，存在单调标准化变换就足以证明使用双正态方法。\n\n一方面，这是一个相对较弱的要求，表明大多数预测因子都可以被认为是双正态的。另一方面，确定\
    \ h 的函数形式本身可能是一项艰巨的任务。请注意，相同的 h(.) 必须将标记对金标准阳性和阴性患者都变换为正态。这个过程可能具有挑战性，并在下一节中讨论。\n\
    \n双正态模型的曲线下面积也有闭式表达式：\n\n```\nAUC = Φ( a / √(1 + b²) )\n```\n\n双正态模型的估计需要估计 a\
    \ 和 b，这反过来需要分别在每个结局组中估计均值和方差。这只需使用带 CLASS 语句的 PROC MEANS 即可完成。但使用 PROC NLMIXED\
    \ 有许多优点，下面的示例演示了这一点。如果你不熟悉 PROC NLMIXED，SAS/STAT 家族中的相对新成员，请参阅附录，了解其相关功能的介绍。\n\
    \n"
