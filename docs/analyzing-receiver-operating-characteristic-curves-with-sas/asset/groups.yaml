    F(w) = P(W > w | D = 1)

    G(w) = P(W > w | D = 0)


    Then the ROC curve for W is given by


    y = F(G^{-1}(x))


    This result holds in general and there is no restriction on F and G in particular.
    Chapter 3 used this result to derive the functional form of the ROC curve for
    the binormal model by simply replacing F and G with the corresponding cumulative
    densities of the normal distribution.


    An alternative to the binormal family is to assume that F and G are related to
    one another as follows:


    G(w) = F(w)^{θ}


    The family of distributions defined by this equation is called the Lehmann family.
    This family was used by Lehmann in his seminal work (Lehmann, 1953) on the study
    of the power function of various statistical tests. For this reason, this family
    of distributions is sometimes referred to as the Lehmann alternative.


    It is important to realize that this equation does not uniquely define the actual
    distributions of marker values. It only identifies the distributions in reference
    to one another. For this reason, the term semi-parametric is commonly used to
    describe this family. Exponential distributions belong to the Lehmann family.
    Weibull distributions with a common scale parameter also belong to this family.
    On the other hand, normal and lognormal distributions are not members of the Lehmann
    family.


    The previous equations imply the following:


    y = x^{θ}


    which is the functional form of the ROC curve corresponding to the Lehmann family.
    In other words, if the conditional distributions of the marker values are linked
    to one another via θ in the Lehmann family, then the ROC curve will have the simple
    power form in this equation. Therefore, if you can estimate θ from the data, the
    estimate for an ROC curve will be immediately available.


    An important advantage of the Lehmann family is that estimation methods for θ
