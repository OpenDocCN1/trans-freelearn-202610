    beta D}}\\right)$\n\nWe saw in Chapter 3 that ROC curves are intimately connected\
    \ to cumulative distributions. For this reason, using $\\gamma_k(D)=P(R\\le k)$\
    \ instead of $P(R=k)$ yields the following probit regression model:\n\n$\\gamma_k(D)=\\\
    Phi\\left(\\frac{\\theta_k-\\alpha D}{e^{\\beta D}}\\right)$\n\nRealize that $1-\\\
    gamma_k(D)$ is the probability of the marker exceeding the threshold and, hence,\
    \ predicting $D$=1. This represents the sensitivity when $D$=1 and one minus the\
    \ specificity when $D$=0. Therefore, a plot of $1-\\gamma_k(0)$ versus $1-\\gamma_k(1)$\
    \ for all $k$ produces the ROC curve of the latent variable. The resulting smooth\
    \ curve, analogous to the case of the continuous predictor, is\n\n$y=\\Phi\\left(\\\
    alpha+e^{-\\beta}\\Phi^{-1}(x)\\right)$\n\nwhere $x$ is one minus the specificity\
    \ and $y$ is the sensitivity. Under this model, the area under the curve is given\
    \ by\n\n$A=\\Phi\\left(\\frac{\\alpha}{\\sqrt{1+e^{-2\\beta}}}\\right)$\n\nSetting\
    \ $a=\\alpha$ and $b=e^{-\\beta}$, you can see that the formula for the AUC is\
    \ equivalent to the case of a single continuous predictor. This is not surprising\
    \ because we have continuously observed in Sections 5.2 and 5.3 that there is\
    \ a strong duality between continuous and ordinal predictors.\n\nWe will call\
    \ this an *ordinal-probit regression model*. Other ordinal regression models can\
    \ be obtained by assuming a different distribution for the latent variable, in\
    \ which case the probit link in this derivation would be replaced by the cumulative\
    \ distribution function of the chosen distribution. In practice, it is very rare\
    \ that another distribution is used in the latent model setting.\n\nThose familiar\
    \ with the capabilities of the LOGISTIC, GENMOD, and PROBIT procedures might mistakenly\
    \ conclude that these procedures can serve as the primary vehicles for analyses\
    \ of ordinal predictors. In fact, these three procedures are not flexible enough\
    \ to accommodate the parameter $\\beta$. Use them only if you are willing to fix\
    \ $\\beta$ in advance at 1 and estimate only $\\alpha$. These procedures were\
    \ developed to estimate a class of models called *generalized linear models*,\
    \ and the ordinal-probit regression model defined here belongs to this family\
    \ if and only if $\\beta$=1. Therefore, to fit the ordinal probit model as described\
    \ previously in full generality, you need to use the capabilities of PROC NLMIXED.\n\
    \nWe will use Moody’s data as an example. Note that the first five categories\
    \ (Aaa through A2) have no observed defaults and, thus, the same sensitivity and\
    \ specificity. In the language of this chapter, γ_k(0) and γ_k(1) are the same\
    \ for k=1, …, 5. Thus, we cannot estimate any of the four thresholds (θ_1, θ_2,\
    \ θ_3, θ_4) because any of the points on the presumed latent variables distribution\
    \ between −∞ and θ_5 will be consistent with our data. To enable the ordinal regression\
    \ to deal with all model parameters, we need to consolidate some of the categories.\
    \ The consolidation in Table 5.2 was chosen for this analysis.\n\n## Table 5.2\
    \ Consolidated Version of Moody’s Rating Data\n\n| Rating | A | Baa | Ba | B |\
    \ C |\n|---|---|---|---|---|---|\n| Default | 1 | 2 | 4 | 36 | 55 |\n| Total |\
    \ 1023 | 692 | 388 | 592 | 164 |\n\nIn the consolidated version, A represents\
    \ Aaa through A3-, Baa represents Baa1 through Baa3, Ba represents Ba1 through\
    \ Ba3, and B represents B1 through B3. C is not combined with another category.\n\
    \nBefore we proceed with fitting this model it is important to emphasize the fact\
    \ that the latent variable is not observed, so it is only the relative positions\
    \ of the thresholds that can be estimated. In other words, two sets of thresholds\
    \ with different absolute values but identical relative positions (i.e., the distance\
    \ between them) will have the same likelihood. Hence we need to arbitrarily fix\
    \ one of the thresholds so that others can be estimated. The following PROC NLMIXED\
    \ code assumes the first threshold is 0 and fits the foregoing ordinal-probit\
    \ regression model to the consolidated version of credit rating data.\n\n```\n\
    proc nlmixed data=moody gconv=0;\n  parms alpha=1 theta1=1 theta2=2 theta3=3 beta=1;\n\
    \  bounds theta1>0, theta2>0, theta3>0;\n  eta1=alpha*default;\n  eta2=exp(beta*default);\n\
    \    if rating=1 then z = probnorm(-eta1/eta2);\n  else if rating=2 then z = probnorm((theta1-eta1)/eta2)\n\
    \                        probnorm(-eta1/eta2);\n  else if rating=3 then z = probnorm((theta2+theta1-eta1)/eta2)\n\
    \                        - probnorm((theta1-eta1)/eta2);\n  else if rating=4 then\
    \ z = probnorm((theta3+theta2+theta1-eta1)/eta2)\n                        - probnorm((theta2+theta1-eta1)/eta2);\n\
    \  else if rating=5 then z = 1 - probnorm((theta3+theta2+theta1-eta1)/eta2);\n\
    \  if z>1e-6 then ll=log(z);\n  else ll=-1e6;\n  model rating ~ general(ll);\n\
    \  estimate 'AUC' probnorm(alpha/sqrt(1+beta**2));\nrun;\n```\n\nThe short introduction\
    \ to PROC NLMIXED in the appendix might be helpful if you are not familiar with\
    \ the syntax or the output. Output 5.3 shows the results.\n\n## Output 5.3\n\n\
    Parameter Estimates\nParameter Estimate Standard Error DF t Value Pr > |t| Alpha\
    \ Lower Upper\nalpha 1.9898 0.1157 2859 17.21 <.0001 0.05 1.7631 2.2166\ntheta1\
    \ 0.5192 0.01679 2859 30.92 <.0001 0.05 0.4863 0.5521\ntheta2 0.3533 0.01667 2859\
    \ 21.19 <.0001 0.05 0.3206 0.3860\ntheta3 0.9907 0.03948 2859 25.10 <.0001 0.05\
    \ 0.9133 1.0681\nbeta -0.2368 0.1336 2859 -1.77 0.0764 0.05 -0.4987 0.02517\n\n\
    Parameter Estimates\nParameter Gradient\nalpha 9.587E-7\ntheta1 0.000012\ntheta2\
    \ -2.58E-6\ntheta3 -3.04E-6\nbeta -8.23E-6\n\nAdditional Estimates\nLabel Estimate\
    \ Standard Error DF t Value Pr > |t| Alpha Lower Upper\nAUC 0.9736 0.009248 2859\
    \ 105.27 <.0001 0.05 0.9555 0.9917\n\nThe iteration history and the gradient are\
    \ not useful to us as long as the model fitting procedure converges. Estimates\
    \ of the most relevant model parameters can be found in the Parameter Estimates\
    \ output section, with α̂ = 1.99 and β̂ = −0.24. As discussed in Chapter 3, the\
    \ ESTIMATE statement is a particularly convenient feature of PROC NLMIXED; it\
    \ can compute the estimate and its standard error for any one-to-one function\
    \ of the model parameters. Using this feature, we estimate the AUC to be 97%,\
    \ with a standard error of 0.9% and a 95% confidence interval of 95.6% to 99.2%.\
    \ By all accounts, Moody’s ratings are excellent predictors of default.\n\nAlthough\
    \ not directly useful, the three thresholds are also estimated by this model.\
    \ Their estimated values (labeled as theta1, theta2, and theta3 in the Parameter\
    \ Estimates section) are 0, 0.5192, 0.5192+0.3533=0.8725 and 0.8725+0.9907=1.8632.\
    \ Remembering that the latent variable is standard normal for D=0 and normal with\
    \ mean 1.99 (α̂) and variance 0.62 (e^{2β̂}), we can exactly compute the expected\
    \ proportions in each level of the ordinal predictor.\n\nAlternatively, we can\
    \ compute the estimate of the AUC by simply plugging in the estimates of α and\
    \ β, but calculation of the standard error requires some analytical legwork using\
    \ the Taylor approximation.\n\nThe resulting ROC points are given as black dots\
    \ in Figure 5.4, overlaid with the smooth line from the binormal model. The fit\
    \ is very good for high thresholds (low sensitivity), but there are some deviations\
    \ from the empirical curve for the higher thresholds.\n"
  mdcn: "\n\n## 图 5.3 图 5.2 中同一序数预测变量的 ROC 点\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_69_0.png)\n\
    \n最常见的假设是潜变量服从正态分布。这就产生了所谓的*潜二元正态模型*。目前，我们将潜二元正态模型与第 3 章中的模型区分开来。潜二元正态模型假设当 D=1\
    \ 时，潜变量服从均值为 μ₁、方差为 σ₁² 的正态分布；当 D=0 时，服从均值为 μ₀、方差为 σ₀² 的正态分布。利用序数标记的观测频率（如表 5.1\
    \ 中的）无法同时估计 μ₀、σ₀²、μ₁ 和 σ₁²。这四个参数存在多组（事实上无限多）组合可以产生相同的观测数据，且无法区分它们。然而，如果我们通过固定\
    \ μ₀ 和 σ₀² 来锚定其中一个正态分布，则可以估计 μ₁ 和 σ₁²。为简化起见，假设我们选择 μ₀=0 σ₀²=1 并得到 μ₁ 和 σ₁² 的估计值，记为\
    \ μ̂ 和 σ̂²。若我们设 μ₀=m σ₀²=s，则 μ₁ 和 σ₁² 的估计值将变为 μ̂ + m 和 s σ̂²。这可以证明，因为正态分布是所谓的*位置-尺度族*的成员。其含义是，在不失一般性的情况下，我们始终可以使用标准正态作为锚点，并将由此得到的估计值视为两个均值的差和两个方差的比。\n\
    \n这些考虑导致了 ROC 曲线专用序数回归模型的开发，最初由 Tosteson 和 Begg（1988）提出。在该模型中，D 是金标准的指示变量，即 D=0\
    \ 或 D=1。潜变量 X 服从均值为 αD、方差为 e^{2βD} 的正态分布。这相当于假设 D=0 时为标准正态，而 D=1 时可能为不同的正态密度。因此，X\
    \ 的这种表示与前面描述的潜二元正态模型一致。\n\n假设 $R$ 是具有 $k$ 个水平的序数预测变量，由对 $X$ 应用阈值 $\\theta_1...,\
    \ \\theta_k$ 产生。则 $R$ 等于 $k$ 的概率由下式给出：\n\n$P(R=k)=P(\\theta_{k-1}<X\\le\\theta_k)$\n\
    $=\\Phi\\left(\\frac{\\theta_k-\\alpha D}{e^{\\beta D}}\\right)-\\Phi\\left(\\\
    frac{\\theta_{k-1}-\\alpha D}{e^{\\beta D}}\\right)$\n\n我们在第 3 章中看到 ROC 曲线与累积分布密切相关。因此，使用\
    \ $\\gamma_k(D)=P(R\\le k)$ 而不是 $P(R=k)$ 得到以下 probit 回归模型：\n\n$\\gamma_k(D)=\\\
    Phi\\left(\\frac{\\theta_k-\\alpha D}{e^{\\beta D}}\\right)$\n\n注意 $1-\\gamma_k(D)$\
    \ 是标记超过阈值的概率，因而预测 D=1。这代表 D=1 时的灵敏度，以及 D=0 时的 1 减特异度。因此，对所有 $k$ 作出 $1-\\gamma_k(0)$\
    \ 与 $1-\\gamma_k(1)$ 的图即得到潜变量的 ROC 曲线。由此得到的平滑曲线，类似于连续预测变量的情况，为\n\n$y=\\Phi\\left(\\\
    alpha+e^{-\\beta}\\Phi^{-1}(x)\\right)$\n\n其中 $x$ 为 1 减特异度，$y$ 为灵敏度。在该模型下，曲线下面积为\n\
    \n$A=\\Phi\\left(\\frac{\\alpha}{\\sqrt{1+e^{-2\\beta}}}\\right)$\n\n设 $a=\\alpha$\
    \ 且 $b=e^{-\\beta}$，你可以看到 AUC 的公式等价于单个连续预测变量的情况。这并不令人惊讶，因为我们在第 5.2 节和第 5.3 节中持续观察到连续预测变量与序数预测变量之间存在强烈的对偶性。\n\
    \n我们将此称为*序数-probit 回归模型*。其他序数回归模型可以通过假设潜变量服从不同的分布而得到，在这种情况下，推导中的 probit 链接将被所选分布的累积分布函数所取代。实际上，在潜模型设定中，使用其他分布的情况非常罕见。\n\
    \n熟悉 LOGISTIC、GENMOD 和 PROBIT 过程功能的人可能会错误地得出结论，这些过程可以作为序数预测变量分析的主要工具。事实上，这三个过程不足以容纳参数\
    \ $\\beta$。只有在你愿意预先将 $\\beta$ 固定为 1 仅估计 $\\alpha$ 时才使用它们。这些过程被开发用于估计一类称为*广义线性模型*的模型，而这里定义的序数-probit\
    \ 回归模型当且仅当 $\\beta$=1 时才属于该族。因此，要以前面所述的完全一般性拟合序数 probit 模型，你需要使用 PROC NLMIXED\
    \ 的功能。\n\n我们将以穆迪的数据为例。注意，前五个类别（Aaa 至 A2）没有观察到的违约，因此灵敏度和特异度相同。用本章的语言来说，γ_k(0) 和\
    \ γ_k(1) 对 k=1,…,5 相同。因此，我们无法估计任何四个阈值（θ_1、θ_2、θ_3、θ_4），因为在假设的潜变量分布中从 −∞ 到 θ_5\
    \ 之间的任意点都与我们的数据一致。为了使序数回归能够处理所有模型参数，我们需要合并一些类别。表 5.2 中的合并是为本次分析选择的。\n\n## 表 5.2\
    \ 穆迪评级数据的合并版本\n\n| Rating | A | Baa | Ba | B | C |\n|---|---|---|---|---|---|\n\
    | Default | 1 | 2 | 4 | 36 | 55 |\n| Total | 1023 | 692 | 388 | 592 | 164 |\n\n\
    在合并版本中，A 代表 Aaa 至 A3-，Baa 代表 Baa1 至 Baa3，Ba 代表 Ba1 至 Ba3，B 代表 B1 至 B3。C 未与其他类别合并。\n\
    \n在继续拟合该模型之前，重要的是要强调潜变量是不可观测的，因此只能估计阈值的相对位置。换句话说，具有不同绝对值但相对位置相同（即它们之间的距离相同）的两组阈值将具有相同的似然。因此我们需要任意固定其中一个阈值，以便估计其他阈值。以下\
    \ PROC NLMIXED 代码假设第一个阈值为 0 并将前述序数-probit 回归模型拟合到合并版本的信用评级数据。\n\n```\nproc nlmixed\
    \ data=moody gconv=0;\n  parms alpha=1 theta1=1 theta2=2 theta3=3 beta=1;\n  bounds\
    \ theta1>0, theta2>0, theta3>0;\n  eta1=alpha*default;\n  eta2=exp(beta*default);\n\
    \    if rating=1 then z = probnorm(-eta1/eta2);\n  else if rating=2 then z = probnorm((theta1-eta1)/eta2)\n\
    \                        probnorm(-eta1/eta2);\n  else if rating=3 then z = probnorm((theta2+theta1-eta1)/eta2)\n\
    \                        - probnorm((theta1-eta1)/eta2);\n  else if rating=4 then\
    \ z = probnorm((theta3+theta2+theta1-eta1)/eta2)\n                        - probnorm((theta2+theta1-eta1)/eta2);\n\
    \  else if rating=5 then z = 1 - probnorm((theta3+theta2+theta1-eta1)/eta2);\n\
    \  if z>1e-6 then ll=log(z);\n  else ll=-1e6;\n  model rating ~ general(ll);\n\
    \  estimate 'AUC' probnorm(alpha/sqrt(1+beta**2));\nrun;\n```\n\n如果不熟悉语法或输出，附录中关于\
    \ PROC NLMIXED 的简短介绍可能会有所帮助。输出 5.3 显示了结果。\n\n## 输出 5.3\n\nParameter Estimates\n\
    Parameter Estimate Standard Error DF t Value Pr > |t| Alpha Lower Upper\nalpha\
    \ 1.9898 0.1157 2859 17.21 <.0001 0.05 1.7631 2.2166\ntheta1 0.5192 0.01679 2859\
    \ 30.92 <.0001 0.05 0.4863 0.5521\ntheta2 0.3533 0.01667 2859 21.19 <.0001 0.05\
    \ 0.3206 0.3860\ntheta3 0.9907 0.03948 2859 25.10 <.0001 0.05 0.9133 1.0681\n\
    beta -0.2368 0.1336 2859 -1.77 0.0764 0.05 -0.4987 0.02517\n\nParameter Estimates\n\
    Parameter Gradient\nalpha 9.587E-7\ntheta1 0.000012\ntheta2 -2.58E-6\ntheta3 -3.04E-6\n\
    beta -8.23E-6\n\nAdditional Estimates\nLabel Estimate Standard Error DF t Value\
    \ Pr > |t| Alpha Lower Upper\nAUC 0.9736 0.009248 2859 105.27 <.0001 0.05 0.9555\
    \ 0.9917\n\n只要模型拟合过程收敛，迭代历史和梯度对我们来说就没用。最相关的模型参数估计值可在参数估计输出部分找到，其中 α̂ = 1.99 且\
    \ β̂ = −0.24。如第 3 章所述，ESTIMATE 语句是 PROC NLMIXED 的一个特别方便的功能；它可以计算模型参数任何一对一函数的估计值及其标准误。利用此功能，我们估计\
    \ AUC 为 97%，标准误为 0.9%，95% 置信区间为 95.6% 至 99.2%。从各方面来看，穆迪的评级都是违约的优秀预测因子。\n\n虽然没有直接用处，但该模型也估计了三个阈值。它们估计值（在参数估计部分标记为\
    \ theta1、theta2 和 theta3）为 0、0.5192、0.5192+0.3533=0.8725 和 0.8725+0.9907=1.8632。记住潜变量对\
    \ D=0 为标准正态，对 D=1 为均值 1.99（α̂）且方差 0.62（e^{2β̂}）的正态分布，我们可以精确计算序数预测变量每个水平的预期比例。\n\
    \n或者，我们可以通过简单地代入 α 和 β 的估计值来计算 AUC 的估计值，但标准误的计算需要使用泰勒近似进行一些分析推导。\n\n所得 ROC 点以图\
    \ 5.4 中的黑色点给出，并叠加了二元正态模型的平滑线。拟合在高阈值（低灵敏度）时非常好，但在较高阈值时与经验曲线存在一些偏差。\n\n"
