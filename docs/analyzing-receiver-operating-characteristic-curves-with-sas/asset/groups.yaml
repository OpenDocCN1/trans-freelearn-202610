    Each of these numbers has a role in computing the measures discussed so far. For
    example, the MR is the sum of the table percentages (the second set of numbers)
    in the off-diagonal elements of the table: 7.79+5.19=12.98%. The PPV and NPV can
    be found among row percentages since row sums pertain to the predictions. Here,
    the PPV is 82.86% and the NPV is 90.48%. Finally, the sensitivity and specificity
    are available from the column percentages (87.88% and 86.36% in this example),
    implying a sensitivity of 87.88% and a specificity of 86.36%.


    It is very important to understand the correct interpretation of sensitivity,
    specificity, PPV, and NPV. Let’s start with predictive values first. Their denominators
    are the number of positive and negative forecasts. In the weather forecast example,
    the PPV can be interpreted as the probability of an actual frost when a frost
    is forecast, and the NPV is the probability of observing no frost when no frost
    is forecast. Hence, if a frost is forecast for the M62 motorway, the probability
    that there will actually be a frost is estimated to be 82.86%. Similarly, if the
    forecast does not call for a frost, then the probability that there will be no
    frost is estimated to be 90.48%.


    In contrast, the denominators for sensitivity and specificity are observed positives
    and negatives. Therefore, sensitivity is the probability that a night with a frost
    will be correctly identified by the forecast out of all nights with a frost during
    the winter; similarly, specificity is the probability that a night without a frost
    will be correctly identified by the forecast out of all nights with no frost (and
    less than 5 °C) during the winter. In our example, the probability that a frost
    will be correctly forecast is estimated to be 87.88% and the probability that
    no frost will be correctly forecast is estimated to be 86.36%.'
  - "[PAGE 20]\n\nIt is easy to imagine the utility of these probabilities as occasional\
    \ consumers of a weather forecast. If you drive from Leeds to Hull on the M62\
    \ only a few nights during a winter, all you care about is whether the forecast\
    \ will be accurate on those few nights. On the other hand, the agency responsible\
    \ for keeping the motorway free of frost might be more interested in sensitivity\
    \ and specificity when deciding whether to pay for these forecasts since that\
    \ speaks to the entire “cohort” of nights in the upcoming winter, and the decision\
    \ of the agency should be based on the performance of the forecast in the long\
    \ run.\n\nIt is easy to recognize that sensitivity, specificity, and positive\
    \ and negative predictive values are all binomial proportions if the corresponding\
    \ denominators are considered fixed. The technical term is conditioning on the\
    \ denominators. This gives easy rise to the use of binomial functionality within\
    \ PROC FREQ to compute interval estimates.\n\nThe following code uses two separate\
    \ calls to PROC FREQ to obtain estimates of sensitivity and specificity along\
    \ with confidence intervals and a test of hypothesis about a specific null value.\
    \ Note the use of the WHERE statement to choose the appropriate denominator for\
    \ each calculation:\n\n```\ntitle \"Sensitivity\";\nproc freq data=m62(where=(observed='Frost'));\n\
    \  table forecast / binomial(p=0.8);\n  weight weight;\n  exact binomial;\nrun;\n\
    ```\n\nThe values specified in parentheses following the BINOMIAL keyword are\
    \ the null values for the test of hypothesis. A null value of 80% is specified.\
    \ This value is chosen only to demonstrate the hypothesis testing feature of the\
    \ BINOMIAL option. It does not correspond to an actual value of interest in the\
    \ example.\n\nOutput 2.2 shows the sensitivity, which is estimated to be 87.88%\
    \ or 29 out of 33. Each of these 33 nights of frost can be thought of as independent\
    \ Bernoulli variates: 29 of them were positive (1) and 4 were negative (0). Their\
    \ sum (29) is the binomial variate with a sample size (denominator) of 33, with\
    \ sensitivity as the binomial proportion of the variate."
