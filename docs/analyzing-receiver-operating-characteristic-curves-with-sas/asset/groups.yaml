  mdcn: "\n\n更常见的做法是使用真阳性率和真阴性率，定义为\n\n$$TPR = \\frac{TP}{TP + FN}, \\quad TNR = \\\
    frac{TN}{TN + FP}$$\n\n真阳性率（TPR）有时被称为*sensitivity*，真阴性率（TNR）有时被称为*specificity*。虽然这些是常规出现在统计文献中的通用术语，但每个领域都有自己的术语。例如，天气预报员使用\
    \ FNR 的失误率和 FPR 的误报率。\n\n天气预报数据的 FNR 和 FPR 分别为 4/33=12% 和 6/44 = 14%。敏感性和特异性分别为\
    \ 29/33=88% 和 38/44=86%。在这种情况下，FPR 和 FNR 彼此非常接近。当这种情况发生时，它们也将非常接近 MR。事实上，MR 是\
    \ FPR 和 FNR 的加权平均值：$MR = w*FPR + (1-w)*FNR$，其中权重（$w$）是观测到霜冻的夜晚所占的比例。这有时被称为霜冻的*prevalence*。\n\
    \n请注意，TPR 和 TNR 的分母是总观测阳性和阴性。可以定义类似的量，使用预测阳性和阴性作为分母。在这种情况下，对应于敏感性和特异性的比率称为*positive\
    \ predictive value (PPV)* 和 *negative predictive value (NPV)*：\n\n$$PPV = \\frac{TP}{TP\
    \ + FP}, \\quad NPV = \\frac{TN}{TN + FN}$$\n\n熟悉 PROC LOGISTIC 的 SAS 用户会认识到 PPV\
    \ 和 NPV 实际上被称为 TPR 和 TNR。这可能是混淆的来源。本书不使用已建立的 PROC LOGISTIC 术语，因为它定义 TPR 和 TNR\
    \ 与其在医学诊断文献中的使用方式一致。尽管如此，为了尽量减少混淆，敏感性和特异性比 TPR 和 TNR 使用得更频繁。\n\n## 2.5 使用 PROC\
    \ FREQ 进行计算\n\n在 SAS 中计算所有这些度量相对容易。以下 DATA 步为 PROC FREQ 的后续使用准备数据：\n\n```\ndata\
    \ m62;\n    input forecast $ observed $ weight;\n    datalines;\nFrost Frost 29\n\
    Frost No_Frost 6\nNo_Frost Frost 4\nNo_Frost No_Frost 38\n;\nrun;\n```\n\n以下 PROC\
    \ FREQ 的执行提供了必要的计算：\n\n```\nproc freq data=m62;\n    table forecast*observed;\n\
    \    weight weight;\nrun;\n```\n\n输出 2.1 包含许多有用的信息。作为对 PROC FREQ 输出的快速复习，每个单元格中四个数字的含义可在表格左上角找到。第一个数字是频数（即\
    \ TP、FP、FN 和 TN）。第二个数字（Percent）使用表格总和（列总和之和或行总和之和，本例中为 77）作为分母。第三个数字（Row Pct）是行百分比（即使用行总和作为分母的比例）。最后，第四个数字（Col\
    \ Pct）是使用列总和作为分母的列百分比。\n\n## Output 2.1\n\n| forecast | observed |  |\n|---|---|---|\n\
    | Frequency |  |  |\n| Percent |  |  |\n| Row Pct |  |  |\n| Col Pct | Frost |\
    \ No_Frost | Total |\n| Frost | 29 | 6 | 35 |\n|  | 37.66 | 7.79 | 45.45 |\n|\
    \  | 82.86 | 17.14 |  |\n|  | 87.88 | 13.64 |  |\n| No_Frost | 4 | 38 | 42 |\n\
    |  | 5.19 | 49.35 | 54.55 |\n|  | 9.52 | 90.48 |  |\n|  | 12.12 | 86.36 |  |\n\
    | Total | 33 | 44 | 77 |\n|  | 42.86 | 57.14 | 100.00 |\n\n这些数字中的每一个在计算迄今讨论的度量时都有作用。例如，MR\
    \ 是表格中非对角线元素的表格百分比（第二组数字）的总和：7.79+5.19=12.98%。PPV 和 NPV 可以在行百分比中找到，因为行总和与预测相关。这里，PPV\
    \ 为 82.86%，NPV 为 90.48%。最后，敏感性和特异性可从列百分比获得（本例中为 87.88% 和 86.36%），意味着敏感性为 87.88%，特异性为\
    \ 86.36%。\n\n必须非常清楚地理解敏感性、特异性、PPV 和 NPV 的正确解释。让我们先从预测值开始。它们的分母是阳性和阴性预测的数量。在天气预报示例中，PPV\
    \ 可以解释为预报霜冻时实际发生霜冻的概率，而 NPV 是预报无霜冻时观测到无霜冻的概率。因此，如果 M62 高速公路预报有霜冻，则实际发生霜冻的概率估计为\
    \ 82.86%。同样，如果预报没有霜冻，则不会出现霜冻的概率估计为 90.48%。\n\n相比之下，敏感性和特异性的分母是观测到的阳性和阴性。因此，敏感性是在所有霜冻夜晚中，预报正确识别出霜冻夜晚的概率；同样，特异性是在所有无霜冻（且低于\
    \ 5 °C）的夜晚中，预报正确识别出无霜冻夜晚的概率。在我们的示例中，霜冻被正确预报的概率估计为 87.88%，无霜冻被正确预报的概率估计为 86.36%。\n\
    \n很容易想象这些概率作为偶尔的天气预报消费者时的实用性。如果你只在冬季的几个夜晚从利兹开车到赫尔走 M62，你只关心预报在那几个夜晚是否准确。另一方面，负责保持高速公路无霜的机构在决定是否支付这些预报费用时可能更感兴趣于敏感性和特异性，因为这关系到即将到来的冬季整个“队列”的夜晚，而该机构的决策应基于预报的长期表现。\n\
    \n很容易认识到，如果相应的分母被视为固定，则敏感性、特异性以及阳性和阴性预测值都是二项比例。技术术语是条件于分母。这很容易导致在 PROC FREQ 中使用二项式功能来计算区间估计。\n\
    \n以下代码使用两次单独的 PROC FREQ 调用来获得敏感性和特异性的估计值以及置信区间和关于特定零值的假设检验。请注意使用 WHERE 语句为每次计算选择适当的分母：\n\
    \n```\ntitle \"Sensitivity\";\nproc freq data=m62(where=(observed='Frost'));\n\
    \  table forecast / binomial(p=0.8);\n  weight weight;\n  exact binomial;\nrun;\n\
    ```\n\nBINOMIAL 关键字后括号中指定的值是假设检验的零值。指定了 80% 的零值。该值仅为演示 BINOMIAL 选项的假设检验功能而选择。它与示例中实际感兴趣的值无关。\n\
    \n输出 2.2 显示了敏感性，估计为 87.88% 或 33 个中的 29 个。这 33 个霜冻夜晚中的每一个都可以被视为独立的伯努利变量：其中 29 个为阳性（1），4\
    \ 个为阴性（0）。它们的和（29）是二项变量，其样本量（分母）为 33，敏感性为该变量的二项比例。\n\n## Output 2.2\n\nSensitivity\n\
    \nThe FREQ Procedure\n\nforecast    Frequency    Percent    Cumulative Frequency\
    \    Cumulative Percent\nFrost       29           87.88      29              \
    \         87.88\nNo_Frost    4            12.12      33                      \
    \ 100.00\n\n    Binomial Proportion\n    for forecast = Frost\n\nProportion  \
    \               0.8788\nASE                        0.0568\n95% Lower Conf Limit\
    \       0.7674\n95% Upper Conf Limit       0.9901\n\nExact Conf Limits\n95% Lower\
    \ Conf Limit       0.7180\n95% Upper Conf Limit       0.9660\n\n    Test of HO:\
    \ Proportion = 0.8\n\nASE under HO               0.0696\nZ                   \
    \       1.1315\nOne-sided Pr >  Z          0.1289\nTwo-sided Pr > |Z|        \
    \ 0.2578\n\nExact Test\nOne-sided Pr >=  P         0.1821\nTwo-sided = 2 * One-sided\
    \  0.3643\n\nSample Size = 33\n\n"
