    ### 2.1 引言


    预测的最简单场景之一是二元预测器的情况。它不仅因为它包含了 ROC 曲线的最关键构建块而重要，而且因为它在实践中经常遇到。本章使用天气预报中的一个例子来说明这些概念。处理类似数据的难题也很丰富，从诊断医学到信用评分。


    ### 2.2 霜冻预报示例


    Thornes 和 Stephenson（2001）从天气预报产品的角度回顾了预测准确性的评估。他们的开篇示例非常简单且易于理解，对所有数据分析人员而言，无论其气象学训练如何。该示例讨论了
    1995 年冬季在英国利兹和赫尔之间的 M62 公路提供的霜冻预报。霜冻发生在道路温度低于 0 °C 时。首先，为每晚制作预报为二元指标（霜冻或无霜冻）。然后在整晚监测道路的实际表面温度，并将结果记录为霜冻，如果温度降至
    0 °C 以下，则记录为无霜冻，如果温度未降至 0 °C 以下。公路局提供的指南规定，结果（预报和实际）仅对实际温度低于 5 °C 的日子以汇总方式报告（参见表
    2.1 中的霜冻和无霜冻列和行）。该示例指的是 1995 年冬季，当时实际道路表面温度在 77 个夜晚低于 5 °C。结果见表 2.1。这种表格描述是报告准确性的标准方式，当预测和结果都是二元时。它视觉上吸引人且易于导航，并且包含所有必要信息。


    有 29 个夜晚预报霜冻且观察到霜冻，有 38 个夜晚预报无霜冻且未观察到霜冻。这两个单元格（表 2.1 的阴影部分）代表两种正确的预报类型。这些两个单元格的通用术语为
    *真阳性 (TP)* 和 *真阴性 (TN)*。这种术语的根源可追溯到医学诊断研究，当测试显示疾病时称为阳性，未显示时称为阴性。类比而言，您可以将霜冻视为阳性，无霜冻视为阴性，在这种情况下，表
    2.1 中有 29 个真阳性和 38 个真阴性。


    ### 表 2.1 道路表面温度的预报准确性


    | Forecast | Observed |  |  |

    | | Frost | No Frost | Total |

    | Frost | 29 | 6 | 35 |

    | No Frost | 4 | 38 | 42 |

    | Total | 33 | 44 | 77 |


    预报错误呢？有 6 个夜晚预报霜冻但未观察到。有 4 个夜晚预报无霜冻，但观察到霜冻。可以很容易地将术语扩展为将这两个单元格称为 *假阳性 (FP)* 和
    *假阴性 (FN)*。表 2.2 使用此处引入的术语对表 2.1 进行了通用表示。


    ### 表 2.2 二元预测的准确性报告


    | Forecast | Observed |  |  |

    | | Positive | Negative | Total |

    | Positive | True Positive (TP) | False Positive (FP) | TP+FP |

    | Negative | False Negative (FN) | True Negative (TN) | FN+TN |

    | Total | TP+FN | FP+TN | TP+FP+FN+TN |


    ### 2.3 误分类率


    总结预报准确性有多种方法。显而易见的一种是 *误分类率 (MR)*，它是所有被误分类夜晚的比例，即假阴性和假阳性的总和除以所有夜晚：


    $$MR = \frac{FN + FP}{TP + FN + FP + TN}$$


    误分类率的 1 倍有时称为 *正确百分比* 或简单地称为 *准确性*。表 2.1 中数据的 MR 为 10/77=13%。


    虽然误分类率易于计算和理解，但有时对于理解误分类背后的机制来说过于粗糙。如果信息没有仔细组装，它也容易产生偏差。假设不是遵循公路局的指南，预报提供者决定包含日历年的所有夜晚。表
    2.1 中报告了 77 个夜晚，并且根据定义，所有这些夜晚的实际温度都降至 5 °C 以下。因此，其余 288 个夜晚全部高于 5 °C（无霜冻），将列边际总数增加到
    33 个霜冻夜晚（不变）和 332 个无霜冻夜晚。可能 温度高于 5 °C 的 288 个夜晚的 MR 远低于温度低于 5 °C 的夜晚的 MR。假设这些
    288 个夜晚的误分类率为 5%，导致 15 个误分类夜晚（四舍五入）。那么 365 个夜晚中总共有 25 个误分类夜晚，MR 为 25/265=7%。表
    2.3 显示了几种可能性。


    ### 表 2.3 温度高于 5 °C 的 288 个夜晚的误分类百分比以及所有 365 个夜晚的相应 MR


    | Percent misclassified for the 288 nights when the temperature was above 5 °C
    | 0 | 1 | 2 | 4 | 6 | 8 | 10 | 12 | 13 |

    | Percent misclassified for all 365 nights | 2.7 | 3.5 | 4.3 | 5.9 | 7.5 | 9.1
    | 10.6 | 12.2 | 13.0 |


    很明显，MR 对样本中包含哪些夜晚很敏感，因为预报的性能对于一年中的所有夜晚来说并不均匀。也很明显，随着您在样本中包含更多易于预报的夜晚，MR 会变小。您可以安全地假设，对于春季和夏季的温暖日子，M62
    的夜间霜冻预报是不必要的，因为大多数人可以在不求助于科学获得的预报的情况下相当准确地做出相同的预测（无霜冻！）。这就是为什么公路局将准确性报告限制在实际温度为
    5 °C 或更低的夜晚的原因。这也强调了 MR 的解释取决于样本中霜冻夜晚的比例（本例中为 30%）。该比例有时称为患病率。


    在信用评分等不受监管的领域，评分算法大多是专有的，没有关于如何评估准确性的此类规则，甚至没有指导方针。此外，预测的消费者在解释准确性的细节或复杂性方面并不总是勤勉或有知识。因此，您需要更稳健的度量。


    ### 2.4 灵敏度和特异性


    报告二元预测准确性的最常见方法是分别使用真（或假）阳性和真（或假）阴性。这承认了假阴性预测可能与假阳性预测有不同的后果。它还使这些度量独立于患病率。因此，这些两个度量被认为衡量预测器的固有能力。在这个天气预报示例中，假阳性可能成本较低，因为其主要后果可能是更谨慎、准备更好的驾驶员。另一方面，假阴性可能导致准备不足和事故。这表明应分别报告假阳性和假阴性率。


    ```

    FPR = FP / (TN + FP),   FNR = FN / (TP + FN)

    ```


