    ## 9.3 SAS Enterprise Miner 中单个模型的 ROC 曲线


    SAS Enterprise Miner 将其对象组织在流程图中，其中包含数据、模型和结果。流程图的组成部分称为节点，它们可以连接到流程中的其他节点。流程可以保存为项目，其中可能还包含其他流程。


    SAS Enterprise Miner 中的大多数操作都可以通过三种等效方法指定：使用菜单、使用工具栏或使用项目导航器（SAS Enterprise Miner
    启动时窗口的左侧部分）。工具栏和项目导航器包含可以拖放的图标，因此比使用菜单更方便。您还可以自定义这些图标。


    按照以下步骤准备预测建模的数据。首先，定义数据源。这类似于在 SAS DATA 步中使用 LIBNAME 语句，然后使用 PROC COPY 将所需数据集带到工作区。然后，从数据源中选择一个具体的数据集进行工作。在数据挖掘中，将数据划分为训练、验证和测试数据集是惯例，可以使用数据划分节点完成。训练和验证数据在第
    8 章中有讨论，其中术语测试数据与验证数据可互换使用。本章的术语遵循 SAS Enterprise Miner 的用法，因此此处的验证数据和测试数据指的是两个不同的实体。验证数据集的使用目的与第
    8 章中相同，但此处的测试数据集主要用于对验证数据集的发现进行确认。这种做法在数据挖掘以外的领域中不太常见。


    以下步骤更精确地描述了如何执行这些任务：


    - 1. 通过在项目导航器中右键单击数据来源，选择创建数据源并按菜单操作进行。确保变量 BAD 的模型角色字段为目标且类型为二元。所有其他变量应列为输入。

    - 2. 通过从工具栏或项目导航器拖放创建一个新图表。图表图标描绘了一系列相互连接的方框，上面有一个黄色星星。创建新图表的替代方法包括选择文件→新建→图表或按住
    CTRL 和 Shift 键并按 D。

    - 3. 双击窗口左上角的数据源。将 Home Equity 拖放到图表工作区中（窗口的右侧部分，此时应为空白）。

    - 4. 通过将图标拖放到图表工作区中添加数据划分，或 alternatively 选择操作→添加节点→采样→数据划分。

    - 5. 用箭头连接 Home Equity 和数据划分图标。当光标呈铅笔形状时可以绘制箭头。


    请注意，图表指定了要执行的操作，但仅指定是不够的以便执行。流程，无论整体还是子集，都需要运行才能执行指定的操作。例如，当数据划分节点运行时，会创建训练、验证和测试集。要运行流程，请右键单击节点并选择运行。所选节点之前及包括该节点的所有节点将按顺序执行。可以随着图表的指定逐个运行每个节点，但分大块运行流程更高效。


    现在我们准备进行建模。由于目标变量是二元的，逻辑回归是建模的合理起点。要在 SAS Enterprise Miner 中拟合逻辑模型，您需要添加一个指定此操作的节点，并将回归节点连接到数据划分节点创建的数据集。以下步骤描述了此过程：


    - 1. 在模型选项卡高亮显示时，通过拖动图标将回归节点添加到图表中。

    - 2. 用箭头将数据划分节点连接到回归节点。

    - 3. 通过从评估选项卡拖放将模型比较节点添加到图表中，并用箭头将其连接到回归节点。


    此时，显示应大致如图 9.1 所示。


    ## 图 9.1 使用逻辑回归预测房屋净值贷款违约


    ![](img/ac26020abd4f22abfaafc0607939c6e4_122_0.png)


    现在，右键单击模型比较节点并选择运行。一旦节点运行，其结果将在整个 SAS Enterprise Miner 会话中保持可用。图表和结果默认保存，并在以后重新启动
    SAS Enterprise Miner 会话时可用。


    当模型比较节点运行时，右键单击该节点并选择结果。会出现一个新窗口，其中包含标题为拟合统计、输出和 ROC 图的子窗口。在 ROC 图子窗口中，有三条 ROC
    曲线，分别对应每个数据集：训练、验证和测试。图 9.2 仅聚焦于训练集的 ROC 曲线，显示在左上角。45 度参考线，在图例中称为基线，默认绘制。随着您沿曲线移动光标，弹出文本框会提供该
    ROC 曲线点的灵敏度和特异性详细信息。图 9.2 包含一个示例点，其中灵敏度为 50.5%，一减去特异性为 94.9%。


    ## 图 9.2 使用房屋净值贷款数据对逻辑回归模型的 ROC 曲线


    ![](img/ac26020abd4f22abfaafc0607939c6e4_123_0.png)


    如输出 9.1 所示，曲线下面积在输出窗口中 readily 报告，标记为 ROC 指数，分别为训练、验证和测试集的 0.72385、0.69319 和 0.67768。


    ## 输出 9.1


    ```

    Fit Statistics

    Model selection based on _TMISC_


    Train:      Valid:      Test:

    Roc         Roc         Roc

    Index       Index       Index

    0.72385     0.69319     0.67768

    ```


    ## 9.4 SAS Enterprise Miner 中竞争模型的 ROC 曲线


    除了逻辑回归外，我们还将使用 SAS Enterprise Miner 工具包中的另外两种方法：决策树和神经网络。它们在 SAS/STAT 中不可用，因此使用
    SAS 的统计学家可能不熟悉它们。出于这个原因，这里简要描述这些方法。


    决策树，也称为统计文献中的递归划分，主要是以分层方式考虑每个变量的二元分割。对于第一次分割，所有变量都会逐一考虑，并保留提供最佳分割的变量（根据常用的几个标准之一，例如误分类率或基尼指数）。不再进一步分割的节点称为*终端节点*或*叶节点*。一旦选择了该变量，相同的过程会再次重复两次，分别针对二元分割的两侧。SAS
    Enterprise Miner 还考虑一个节点一侧的多次分割，因此可能出现一侧为叶节点而另一侧分割多次的树。多项变量被分组为两组，以便得到的二元分组给出最佳分割。同样，连续变量也通过找到最佳截止值分割为两组。房屋净值贷款示例的
    resulting 决策树出现在图 9.3 中。


    ## 图 9.3 房屋净值贷款示例的示例决策树


    ![](img/ac26020abd4f22abfaafc0607939c6e4_124_0.png)


    例如，第一个使用的变量是 DEBTINC，这是一个连续变量。它在 44.7337 处分割。对于负债收入比小于 44.7337 的人，下一个最佳分割是 VALUE，分割点为
    303,749。


    决策树在重要方面区别于逻辑回归和神经网络：没有统计模型。因为没有模型，所以没有预测方程。当对新观测进行评分时，它会从树的顶部“落下”，并根据协变量的值在每个节点遵循指定的路径，直到到达终端节点（或叶节点）。这可以描述为一系列
    IF-THEN-ELSE 语句形式的规则。


    树的二元分割结构是一个优势，因为它易于解释。它也可能是一个缺点，尤其是在某些预测变量是连续的情况下。对连续协变量的分类可能导致效率低下并对预测性能产生不利影响。决策树的另一个优点是它们能非常有效地处理缺失数据。这是通过在每个节点建立替代分割来实现的，当该节点的分割变量缺失时可以使用。


    *神经网络*是一个总称，用来描述构建模仿大脑功能的模型的方法。它们的精确数学描述很复杂且不太可能


