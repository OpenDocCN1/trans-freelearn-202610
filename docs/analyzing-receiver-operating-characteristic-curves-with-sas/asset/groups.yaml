    |  | 37.66 | 7.79 | 45.45 |

    |  | 82.86 | 17.14 |  |

    |  | 87.88 | 13.64 |  |

    | No_Frost | 4 | 38 | 42 |

    |  | 5.19 | 49.35 | 54.55 |

