    ```\nBootstrap Analysis of the AUC for moody\n\n    AUC    StdErr\n    -----------\n\
    0.913584  0.012242\n\n95% Confidence Interval\n\n    LowerLimit    UpperLimit\n\
    \    -----------\n    0.888271      0.935495\n```\n\n## 5.5 Latent Variable Model\n\
    \nAs is the case with continuous predictors, the empirical ROC curve makes minimal\
    \ assumptions but does not extend easily for covariate adjustments. In Chapter\
    \ 3, we developed the binormal model and demonstrated its use in covariate adjustments\
    \ in Chapter 4.\n\nIt is possible to develop a binormal model for ordinal predictors,\
    \ too. Imagine that you start with a continuous predictor but instead decide to\
    \ categorize it and report only an ordinal predictor, such as none, low, medium,\
    \ and high (as in some of the rain forecasts). The consumers of the forecast only\
    \ observe the ordinal value. Even though these continuous predictions, called\
    \ the latent variable, remain unobserved, the sensitivity and specificity at each\
    \ of the ordinal values represent points on the ROC curve of the latent variable.\
    \ The fundamental idea is given in Figure 5.2.\n\n### Figure 5.2 The Three ROC\
    \ Points for the Ordinal Predictor\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_68_0.png)\n\
    \nThe horizontal line at the top portion of the figure represents the continuum\
    \ of the latent variable. The three hash marks on the latent variable axis denote\
    \ the thresholds that correspond to the observed ordinal predictor. The solid\
    \ line at the lower part is the ROC curve for the latent variable and the hash\
    \ marks on the curve are the ROC points. The important point is that the ROC points\
    \ for the ordinal variable lie on the ROC curve for the latent variable.\n\nNow\
    \ examine Figure 5.3, which contains only the ROC points. Without knowing or supposing\
    \ certain characteristics of the latent variable, you could not estimate the ROC\
    \ curve of the latent variable by using only the ROC points. Connecting the points\
    \ is unlikely to represent the true ROC curve of the latent variable because the\
    \ true ROC curve is more likely to be smooth. You need to use information about\
    \ the latent variable to interpolate between the ROC points. Of course, the latent\
    \ variable is unobservable, so you can only make assumptions.\n"
  mdcn: "\n\n从 ROC 曲线的角度来看，连续预测因子和有序预测因子之间存在二元性。经验曲线和双正态模型都可以容纳有序预测因子，要么直接使用，要么经过一些修改。第\
    \ 5.3 节和第 5.4 节提供了详细信息。\n\n## 5.2 信用评级示例\n\n考虑以下由 Güttler（2005）收集并发表的数据集，该数据集涉及世界上两家最著名的信用评估机构——穆迪和标准普尔的评分系统表现。表\
    \ 5.1 报告了穆迪评级的数据，穆迪评级使用 17 个有序等级，从 Aaa（最有利评级）到 C（最不利评级）。Rating 行列出了这 17 个评级，Default\
    \ 行包含研究随访期间违约的公司数量，而 Total 行则列出了同一时期获得特定信用评级的公司总数。本例的目的是评估穆迪评级作为违约可能性预测因子的准确性。对于从\
    \ Aaa 到 C 的 17 个评级中的每一个，都提供了样本中的总数以及该总数中违约的数量。\n\n### 表 5.1 穆迪评级\n\n| Rating |\
    \ Aaa | Aa1 | Aa2 | A1 | A2 | A3 | A3- | Baa1 | Baa2 |\n| Default | 0 | 0 | 0\
    \ | 0 | 0 | 1 | 0 | 1 | 0 |\n| Total | 49 | 47 | 120 | 164 | 163 | 254 | 226 |\
    \ 238 | 242 |\n| Rating | Baa3 | Ba1 | Ba2 | Ba3 | B1 | B2 | B3 | C |  |\n| Default\
    \ | 1 | 1 | 1 | 2 | 8 | 15 | 13 | 55 |  |\n| Total | 212 | 105 | 108 | 175 | 238\
    \ | 215 | 139 | 164 |  |\n\n请注意，表 5.1 包含了所有数据。对于有序预测因子，你可以用近 3,000 个观测值完整地展示一个数据集，因为空间需求更多取决于类别的数量，而非实际样本量。这与连续数据形成对比，连续数据的原始数据通常由于空间限制而未被报告。\n\
    \n## 5.3 有序预测因子的经验 ROC 曲线\n\n有序预测因子的经验 ROC 曲线建立在与连续预测因子的经验 ROC 曲线相同的原理上。事实上，由于经验\
    \ ROC 曲线仅基于数据的秩，因此预测因子是有序还是连续的，对 ROC 曲线的构建方式没有影响。因此，第 3 章的方法可用于构建和比较具有有序预测因子的经验\
    \ ROC 曲线。\n\n简要回顾一下，使用有序预测因子的每个不同观测值作为可能阈值，你可以计算由此产生的二元预测因子的敏感性和特异性。对每个阈值绘制敏感性与\
    \ 1 减去特异性的散点图就构成了 ROC 点。请注意，以下代码与第 3 章中用于连续预测因子的程序完全相同：\n\n```\nproc logistic\
    \ data=moody;\n    model default=moody / outroc=rocdata;\nrun;\n\naxis1 length=12cm\
    \ order=0 to 1 by 0.2 label=(f=swissb h=2)\nvalue=(font=swissb h=2) offset=(.5\
    \ .5)cm;\naxis2 length=12cm order=0 to 1 by 0.2 label=(a=90 f=swissb h=2)\nvalue=(font=swissb\
    \ h=2) offset=(.5 .5)cm;\n\nsymbol1 v=none i=join c=black;\n\nproc gplot data=rocdata;\n\
    \    plot _sensit_*_1mspec_ / haxis=axis1 vaxis=axis2;\nrun;\nquit;\n```\n\n###\
    \ 图 5.1 穆迪评级数据的 ROC 点\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_65_0.png)\n\n\
    图 5.1 包含使用 PROC LOGISTIC 获得的穆迪评级的 ROC 点。请注意，对于此工作，变量 moody 必须是数值型。另请注意 AXIS 语句的\
    \ OFFSET= 选项的使用，用于在两个轴的两侧打印一些空白以改善显示效果。另请注意，没有一家获得前五个评级（AAA 至 A2）的公司违约，因此这五个评级都由右上角的同一点表示（100%\
    \ 敏感性和 100% 特异性）。\n\n特意使用术语 ROC 点。图 5.1 没有 ROC 曲线，只有每一点都是穆迪评级的可行操作点。可以连接这些点，就像我们对连续预测因子所做的那样，最终得到\
    \ ROC 曲线。你可以争辩说，由于有序预测因子的定义，未观察到的中间阈值是不可能的，因此由此产生的曲线没有意义。想象一下在图 5.1 中连接这些点。穆迪评分在\
    \ B2 和 C 之间没有分数，因此图中连接两个最左点线段上的点代表不存在的阈值的操作特征（即敏感性和特异性）。反驳意见认为，大多数有序量表的等级是任意定义的，可以更改。如果有序预测是通过对连续预测因子进行分类获得的，那么就可以明确地重新审视阈值。在主观意见的情况下，可以要求专家通过使用更多等级的量表来完善他们的预测。在我们的例子中，穆迪可能会在检查图\
    \ 5.1 后决定 Aa1 和 Aa2 之间（从右数第二个和第三个点）的差距太宽。这可以通过在这两个之间引入新的阈值来解决。\n\n连接点还有一个实际后果：它使得可以明确地定义有序预测因子的曲线下面积。因此，我建议对有序预测因子使用\
    \ ROC 曲线而不是 ROC 点。\n\n## 5.4 经验 ROC 曲线下面积\n\n经验 ROC 曲线下面积的计算使用梯形法则，与对连续标记的处理方式相同。%ROC\
    \ 宏可用于此目的，因为经验 ROC 曲线及其下面积是基于秩的函数。宏调用与第 3 章中使用的完全相同：\n\n```\n%roc(data=moody,var=moody,response=def,contrast=1);\n\
    ```\n\n熟悉的 %ROC 输出（见输出 5.1）显示 AUC 为 0.915，95% 置信区间范围为 0.891 至 0.940。\n\n### 输出\
    \ 5.1\n\n```\nThe ROC Macro\n\nROC Curve Areas and 95%\nConfidence Intervals\n\
    ROC Area Std Error Confidence Limits\nmoody 0.9153 0.0124 0.8909 0.9397\n```\n\
    \n与使用 %ROC 宏类似，你可以使用 %BOOT1AUC 宏来计算曲线下面积的基于自助法的估计值和标准误差。输出 5.2 显示了自助法的结果，与 %ROC\
    \ 宏产生的结果相似。\n\n### 输出 5.2\n\n```\nBootstrap Analysis of the AUC for moody\n\n\
    \    AUC    StdErr\n    -----------\n0.913584  0.012242\n\n95% Confidence Interval\n\
    \n    LowerLimit    UpperLimit\n    -----------\n    0.888271      0.935495\n\
    ```\n\n## 5.5 潜变量模型\n\n与连续预测因子一样，经验 ROC 曲线假设最少，但不易扩展以进行协变量调整。在第 3 章中，我们开发了双正态模型，并在第\
    \ 4 章中演示了其在协变量调整中的应用。\n\n也可以为有序预测因子开发双正态模型。想象一下，你从一个连续预测因子开始，但决定对其进行分类并仅报告有序预测因子，例如无、低、中和高（就像某些降雨预报那样）。预报的消费者只能观察到有序值。尽管这些连续预测，即潜变量，仍然未被观察到，但在每个有序值处的敏感性和特异性代表了潜变量的\
    \ ROC 曲线上的点。基本思想在图 5.2 中给出。\n\n### 图 5.2 有序预测因子的三个 ROC 点\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_68_0.png)\n\
    \n图的上部水平线代表潜变量的连续体。潜变量轴上的三个哈希标记表示与观察到的有序预测因子相对应的阈值。下部的实线是潜变量的 ROC 曲线，曲线上的哈希标记是\
    \ ROC 点。重要的是，有序变量的 ROC 点位于潜变量的 ROC 曲线上。\n\n现在查看图 5.3，其中仅包含 ROC 点。在不知道或假设潜变量的某些特征的情况下，你无法仅使用\
    \ ROC 点来估计潜变量的 ROC 曲线。连接这些点不太可能代表潜变量的真实 ROC 曲线，因为真实的 ROC 曲线更可能是平滑的。你需要使用有关潜变量的信息在\
    \ ROC 点之间进行插值。当然，潜变量是不可观察的，因此你只能做出假设。\n\n"
