    The Parameter Estimates section of the output presents estimates of the model
    parameters and is of little use here. The more interesting part for ROC analysis
    is the Additional Estimates section, which provides information on the results
    of the ESTIMATE statement, including binormal parameters of BSI ($a_0$ and $b_0$)
    and SUV ($a_1$ and $b_1$). This section also reports the implied AUC ($AUC_1$
    and $AUC_0$) for each marker and the difference between the two AUCs. We see that
    the AUCs are estimated to be 0.7825 for the SUV and 0.8579 for the BSI. Their
    difference is 0.0753 and is not significant, with $p$=0.9369.


    The two contrasts are reported in the Contrasts section. The first one is the
    difference between the two AUCs, repeated here only to highlight the similarities
    between the ESTIMATE and CONTRAST statements. This contrast has the same $p$-value
    as the ESTIMATE statement (as it should) but uses the $F$-statistics rather than
    $t$-statistics. If you are familiar with analysis of variance, you will remember
    that an $F$-statistic with a single numerator degree of freedom is identical to
    the square of the corresponding $t$-statistic. The same principle applies here,
    although it is hard to see from this output since the test statistics have very
    small absolute values. Nevertheless, note that $t$=-0.08, the square of which
    is 0.01 when rounded to two decimal places.


    The contrast of real interest is the simultaneous test of the equality of the
    two binormal parameters. The results strongly suggest that there is no evidence
    against the equal ROC curves hypotheses ($p$=0.99).


    # 4.5.2 Comparisons Based on the Binormal Model with Unpaired Data


    As explained in Section 4.5.1, the random effect $u$ was introduced to the binormal
    model only to account for the within-subject correlation. In unpaired designs,
    the within-subject correlation is 0 by definition. This suggests a simple way
    to modify the code from the previous section: Remove $u$. This amounts to removing
    the RANDOM statement and cleaning up the way $m$ is defined in the programming
    statements.


    # 4.6 Discrepancy between Binormal and Empirical ROC Curves


    It is not uncommon for the binormal model and the empirical model to reach different
    conclusions. The difference between them is similar to the difference between
    rank tests and $t$-tests. If the assumptions underlying the binormal model are
    true, then the binormal model has more power, which might explain the significant
    result. On the other hand, if the model assumptions are not true, then the Type
    I error may be inflated, which would appear as increased false positive results.
    Although it is not possible to conclude which one is the driving force, certain
    features of the PROC NLMIXED output, along with exploratory graphical analyses
    like the one in Figure 4.2, remain the best way of checking the assumptions of
    binormality.


    Figure 4.2 overlays the empirical and the binormal ROC curves, the latter as estimated
    by PROC NLMIXED. The solid lines indicate the BSI and the dashed ones indicate
    the SUV. The step function signifies an empirical ROC curve, while the smooth
    one follows from the binormal model. Both binormal curves are poor fits to the
    empirical ones. This also explains the discrepancy between the AUC estimates.
    For BSI, the empirical AUC is 78% while the binormal AUC is 85%, and for SUV the
    corresponding estimates are 68% and 78%.'
