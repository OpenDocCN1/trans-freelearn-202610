    \ through 7.3.3 demonstrate how the components of Equation (7.3) can be computed\
    \ from the data using the SAS procedure PROC LIFETEST. Using the results of these\
    \ sections, you can compute the sensitivity and specificity for an SUV of 9 at\
    \ 3 years as follows:\n\nP(W > c | D = 1) = {1 − S(t | W > c)} P(W > c) / (1 −\
    \ S(t)) = (1 − 0.6335) * 0.5 / (1 − 0.7676) = 0.7885\nP(W ≤ c | D = 0) = S(t |\
    \ W ≤ c) P(W ≤ c) / S(t) = 0.8960 * 0.5 / 0.7676 = 0.5836\n\nBy varying c, you\
    \ can obtain the sensitivity and one minus specificity for each c. A plot of these\
    \ pairs constitutes the ROC curve.\n\nThere is a potential problem here, however.\
    \ In the examples presented in Chapter 3, the ROC curve was guaranteed to be monotone-increasing.\
    \ There is no such guarantee for censored data because Kaplan-Meier estimates\
    \ are not smooth functions of time (they have several jumps). This implies that,\
    \ as one minus specificity increases, sensitivity might occasionally decrease,\
    \ violating a central premise of the ROC curve. Lack of monotonicity may be obvious\
    \ in small samples, but in most data sets with large samples and/or events, it\
    \ is hardly noticeable.\n\nIf the estimate of S(t) had no jumps and flat regions—that\
    \ is, if it were monotone itself—the ROC curve would also have been monotone.\
    \ Realizing this, Heagerty et al. (2000) suggest a different estimator for S(t),\
    \ a weighted Kaplan-Meier estimator.\n\nThe macro %TDROC generates a time-dependent\
    \ ROC curve. The required inputs to the macro are DSN (the data set name), Marker,\
    \ TimeVar, Status, and TimePT. The TimePT variable specifies the time at which\
    \ predictions are to be made. The Status variable must satisfy the requirements\
    \ of PROC LIFETEST: It must be numeric and it must be followed, in parentheses,\
    \ by the list of values that indicate censoring. The macro also has an option\
    \ (smooth=1) that implements a smooth estimator of S(t). By default, smooth=0.\
    \ Another optional input is PLOT (by default, 1), which controls whether the curve\
    \ is plotted. When plot=0, only data sets with pairs of sensitivity and specificity\
    \ are made available.\n\nFigure 7.1 is an ROC curve for SUV as a marker of prognosis\
    \ at 3 years using the lung cancer data generated by the following call to the\
    \ %TDROC macro:\n\n```\n%TDROC(DSN=lung, MARKER=suv, TIMEVAR=survival, STATUS=status(0),\n\
    \    TIMEPT=36);\n```\n"
  mdcn: "\n\n这突出了在删失数据的背景下，敏感性和特异性是时间的函数这一事实。\n\n使用公式（7.2），我们可以估计每个 c 的敏感性和特异性，并绘制这些估计值以得到特定时间点\
    \ t 的 ROC 曲线。估计值可通过以下关系获得，该关系源于条件概率的定义以及贝叶斯定理的应用：\n\nP(W > c | D(t) = 1) = {1\
    \ − S(t | W > c)} P(W > c) / (1 − S(t))\nP(W ≤ c | D(t) = 0) = S(t | W ≤ c) P(W\
    \ ≤ c) / S(t)  (7.3)\n\n在公式（7.3）中以及本章其他地方，S(t) 表示生存函数——即 S(t)=P(T>t)。事实证明，公式（7.3）右边三个分量都可以用\
    \ SAS 计算出来。以下各节详细说明如何使用数据计算公式（7.3）。为说明起见，我们将使用 c=9 和 t=36，但以下步骤也可以对其他 c 和 t 值重复。\n\
    \n## 7.3.1 S(t) 的估计\n\n如前所述，S(t)=P(T>t) 是变量 T 的生存函数（即熟悉的累积分布函数的相反数），它受删失影响。对删失变量的累积分布进行计算需要特殊方法。其中最流行的方法，另称为\
    \ Kaplan-Meier 或乘积极限估计方法，已在 SAS/STAT 软件的 PROC LIFETEST 中实现。PROC LIFETEST 是在使用公式（7.3）时计算所需分布的主要工具。以下调用返回\
    \ 3 年时的生存概率：\n\n```\nproc lifetest data=lung timelist=(36);\n    time survival*status(0);\n\
    run;\n```\n\nTIME 语句具有特殊的语法，将两列中的结果信息结合在一起。先指定的变量（在星号之前）是生存时间，后指定的变量（在星号之后）是状态。在状态变量之后用括号列出指示删失的状态变量值。最后，timelist=(36)\
    \ 仅打印出 3 年（36 个月）生存函数的估计值。否则，默认情况下会打印数据集中所有观察到时间点的生存概率。\n\n输出 7.1 显示了此次 PROC LIFETEST\
    \ 调用的结果。相关部分标记为 Product-Limit Survival Estimates（product-limit 是 Kaplan-Meier\
    \ 估计的另一种名称）。关注的时间点列在 Timelist 标题下，对应的概率标记为 Survival。请记住 S(t)=P(T>t)，并且 1−S(t)=P(T≤t)\
    \ 给出在 Failure 标题下。我们从输出 7.1 的结果中看到 S(t)=0.7676 且 1−S(t)=0.2324。\n\n### Output\
    \ 7.1\n\nThe SAS System\nThe LIFETEST Procedure\n\n### Product-Limit Survival\
    \ Estimates\n\n| Timelist | Survival | Survival | Failure | Survival Standard\
    \ Error | Number Failed | Number Left |\n| 36.0000 | 36.0000 | 0.7676 | 0.2324\
    \ | 0.0529 | 19 | 23 |\n\n### Summary Statistics for Time Variable Survival\n\n\
    ### Quartile Estimates\n\n| Percent | Point Estimate | 95% Confidence Interval\
    \ [Lower Upper) | |\n| 75 | . | . | . |\n| 50 | . | 49.0000 | . |\n| 25 | 44.0000\
    \ | 24.0000 | . |\n\nMean    Standard Error\n41.8379        1.4697\n\nNOTE: The\
    \ mean survival time and its standard error were underestimated because the largest\
    \ observation was censored and the estimation was restricted to the largest event\
    \ time.\n\n### Summary of the Number of Censored and Uncensored Values\n\n| Total\
    \ | Failed | Censored | Percent Censored |\n| 100 | 21 | 79 | 79.00 |\n\n## 7.3.2\
    \ P(T|W) 的估计\n\nP(T|W) 从根本上也是一个时间-事件分布，同样可以用 PROC LIFETEST 估计。需要记住的关键点是根据 W 中指定的条件排除适当的患者。因此，当你计算\
    \ P(T|W>9) 时，你需要仅包含 SUV 大于 9 的患者，如以下对 PROC LIFETEST 的调用所示：\n\n```\nproc lifetest\
    \ data=lung(where=(suv>9)) timelist=(36);\n    time survival*status(0);\nrun;\n\
    ```\n\n输出 7.2 的格式与输出 7.1 相同（仅显示相关部分），告知我们 1−S(T|W>9)=0.3665。类似获得的方程 S(T|W≤9) 等于\
    \ 0.8960（此处未显示）。\n\n### Output 7.2\n\nThe SAS System\n\nThe LIFETEST Procedure\n\
    \nProduct-Limit Survival Estimates\n\n| Timelist | Survival | Survival | Failure\
    \ | Standard Error | Number Failed | Number Left |\n| 36.0000 | 29.0000 | 0.6335\
    \ | 0.3665 | 0.0784 | 16 | 8 |\n\n## 7.3.3 P(W) 的估计\n\nW 不受删失影响，因此原则上 P(W>c) 是超过\
    \ c 的观测比例。P(W) 可以在 SAS 中以多种方式计算，包括使用 DATA 步或 PROC SQL 编程，以及使用 PROC UNIVARIATE\
    \ 和 PROC FREQ。你也可以使用 PROC LIFETEST，因为在没有删失的情况下，Kaplan-Meier 方法会产生与标准方法相同的结果。由于指定状态变量是可选的，因此\
    \ PROC LIFETEST 可用于此目的，如下所示：\n\n```\nproc lifetest data=lung timelist=(9);\n \
    \   time suv;\nrun;\n```\n\n这是与之前的 PROC LIFETEST 调用相比有些不寻常的调用。SUV 是需要分布的变量；因此\
    \ timelist=9。没有状态变量的原因是 W 不受删失影响。PROC LIFETEST 的输出（输出 7.3）表明 P(W>9)=0.50。这是 Timelist\
    \ 和 SUV 标题下的值不同的第一个例子。前者列出 PROC LIFETEST 语句的 TIMELIST= 选项请求的值，而后者显示报告的生存和失败概率所适用的最近观测值。如果请求的时间点被观测到，则两列将具有相同的数字。\n\
    \n### Output 7.3\n\nThe SAS System\n\nThe LIFETEST Procedure\n\nProduct-Limit\
    \ Survival Estimates\n\n| Timelist | SUV | Survival | Failure | Standard Error\
    \ | Number Failed | Number Left |\n| 9.00000 | 8.9300 | 0.5000 | 0.5000 | 0.0500\
    \ | 50 | 50 |\n\n## 7.3.4 综合起来\n\n第 7.3.1 节至第 7.3.3 节演示了如何使用 SAS 过程 PROC LIFETEST\
    \ 从数据中计算公式（7.3）的分量。利用这些节的结果，你可以按如下方式计算 SUV 为 9 时 3 年的敏感性和特异性：\n\nP(W > c | D =\
    \ 1) = {1 − S(t | W > c)} P(W > c) / (1 − S(t)) = (1 − 0.6335) * 0.5 / (1 − 0.7676)\
    \ = 0.7885\nP(W ≤ c | D = 0) = S(t | W ≤ c) P(W ≤ c) / S(t) = 0.8960 * 0.5 / 0.7676\
    \ = 0.5836\n\n通过改变 c，你可以获得每个 c 的敏感性和 1 减去特异性。这些对的图构成 ROC 曲线。\n\n这里有一个潜在问题。然而，在第\
    \ 3 章中给出的例子中，ROC 曲线保证是单调递增的。对于删失数据则没有这种保证，因为 Kaplan-Meier 估计不是时间的光滑函数（它们有多个跳跃）。这意味着，随着\
