    \n图 7.1 是 SUV 作为肺癌数据中 3 年预后标记的 ROC 曲线，由对 %TDROC 宏的以下调用生成：\n\n```\n%TDROC(DSN=lung,\
    \ MARKER=suv, TIMEVAR=survival, STATUS=status(0),\n    TIMEPT=36);\n```\n\n"
