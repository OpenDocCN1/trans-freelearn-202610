    # An Introduction to

    PROC NLMIXED


    ![](img/ac26020abd4f22abfaafc0607939c6e4_129_0.png)


    A.1 Fitting a Simple Linear Model: PROC GLM vs PROC NLMIXED ............ 119

    A.2 PROC NLMIXED and the Binormal Model ........................................
    124


    PROC NLMIXED plays a central role in this book. Chapters 3, 4, and 5 use it to
    fit the binormal model, which is one of the fundamental tools to construct and
    analyze ROC curves.


    PROC NLMIXED offers unique and wide-ranging capabilities, but its syntax is different
    from most other SAS/STAT modeling procedures. For this reason, the PROC NLMIXED
    code may be difficult to discern and harder to grasp for readers who are used
    to gaining insight by studying the programs used for model fitting. This appendix
    is written for users who are familiar with the general SAS/STAT modeling syntax
    but new to PROC NLMIXED. Regular users of the following procedures may find this
    appendix helpful: GLM, ANOVA, REG, GENMOD, LOGISTIC, PROBIT, and MIXED.


    This appendix is not a summary of all PROC NLMIXED features. Rather, it focuses
    on capabilities related to ROC curves. SAS/STAT manuals offer exhaustive coverage
    of PROC NLMIXED and can be helpful for those who want to use this procedure beyond
    what is covered here.


    # A.1 Fitting a Simple Linear Model: PROC GLM vs PROC NLMIXED


    Consider the following programming statements, which generate a data set of 100
    observations. There is a group variable X, taking values of 0 or 1, and an outcome
    variable Y, which follows a normal distribution within each group. The goal is
    to fit the following model to this data set using PROC GLM and PROC NLMIXED:


    y = α + βX + ε


    where ε has a normal distribution with mean 0 and variance σ².'
  - "[PAGE 130]\n\n```\ndata appendix;\n    do i=1 to 100;\n        x=rand('bernoulli',0.5);\n\
    \        e=rannor(0);\n        y=x+e;\n        output;\n    end;\nrun;\n```\n\n\
    The following statements fit this model in PROC GLM. The MODEL statement in PROC\
    \ GLM is specifically designed to recognize these special features of this model:\n\
    \n+   - Presence of an intercept (there is an option for excluding the intercept)\n\
    +   - Linearity of the model term\n+   - Normal distribution of the error terms\
    \ with constant variance.\n\nFor these reasons, it is sufficient to write model\
    \ y=x.\n\n```\ntitle \"Simple Linear Model Using GLM\";\nproc glm;\n    model\
    \ y=x;\nrun;\nquit;\n```\n\nOutput A.1 shows the results from PROC GLM. The parameter\
    \ estimates for α (labeled Intercept) and β (labeled X) are −0.241 and 1.254,\
    \ with standard errors of 0.148 and 0.197. An estimate of σ² is provided by the\
    \ mean squared error (0.9578).\n\n# Output A.1\n\nSimple Linear Model Using GLM\n\
    \nThe GLM Procedure\n\nNumber of Observations Read          100\nNumber of Observations\
    \ Used          100\n\nDependent Variable: Y\n\nSource       DF   Sum of Squares\
    \   Mean Square   F Value   Pr > F\nModel        1    38.7439429       38.7439429\
    \    40.45     <.0001\nError        98   93.8638957       0.9577949\nCorrected\
    \ Total 99 132.6078386\n\nR-Square   Coeff Var   Root MSE   y Mean\n0.292169 \
    \  212.2180    0.978670   0.461163\n\nSource   DF   Type I SS   Mean Square  \
    \ F Value   Pr > F\nx        1    38.74394287 38.74394287   40.45     <.0001"
  - "[PAGE 131]\n\n# Output A.1 (continued)\n\n| Source | DF | Type III SS | Mean\
    \ Square | F Value | Pr > F |\n|---|---|---|---|---|---|\n| x | 1 | 38.74394287\
    \ | 38.74394287 | 40.45 | <.0001 |\n\n| Parameter | Estimate | Standard Error\
    \ | t Value | Pr > |t| |\n|---|---|---|---|---|\n| Intercept | -0.241051559 |\
    \ 0.14754004 | -1.63 | 0.1055 |\n| x | 1.253953858 | 0.19715868 | 6.36 | <.0001\
    \ |\n\nPROC NLMIXED does not have a MODEL statement with these features. Rather,\
    \ the model needs to be communicated to PROC NLMIXED step by step, with specific\
    \ instructions on the model and the distribution of the variables. The following\
    \ PROC NLMIXED code fits the same model:\n\n```\ntitle \"Simple Linear Model Using\
    \ NLMIXED\";\nproc nlmixed;\n    parms var=1 alpha=0 beta=0;\n    mu=alpha+x*beta;\n\
    \    model y~normal(mu,var);\nrun;\nquit;\n```\n\nIt is most useful to deconstruct\
    \ PROC NLMIXED programs starting from the end. The MODEL statement has no resemblance\
    \ to the one in PROC GLM. The equal sign is replaced by the tilde (~), which is\
    \ read as “distributed as.” Hence, this model statement is specifying that the\
    \ response variable Y has a normal distribution with mean MU and standard deviation\
    \ VAR. A key difference between PROC GLM syntax and PROC NLMIXED syntax is that\
    \ in PROC NLMIXED, only parameters are allowed on the right-hand side of a MODEL\
    \ statement, whereas in PROC GLM, only variables are allowed.\n\nThe statement\
    \ mu=alpha+x*beta connects the model parameters to the data set variables. It\
    \ specifies that the mean of the normal distribution is related to the covariate\
    \ X in a linear fashion. Most DATA step functions are available for programming\
    \ in PROC NLMIXED, so you can construct almost any functional relationship between\
    \ parameters.\n\nFinally, the PARMS statement tells PROC NLMIXED which of the\
    \ terms are parameters. The PARMS statement is not required. In its absence, PROC\
    \ NLMIXED assumes that any term that is not assigned a value, either from the\
    \ data set or from the programming statements within the procedure, is a parameter.\
    \ In this case, it is easy to check that omitting the PARMS statement does not\
    \ alter the output. In more complicated models, the PARMS statement helps you\
    \ keep track of the model parameters. The numbers following the equal sign after\
    \ the parameter names are the starting values for the numerical search method\
    \ employed by PROC NLMIXED. They can be safely ignored for the time being until\
    \ we briefly discuss the implications of using the maximum likelihood in PROC\
    \ NLMIXED later in this appendix."
