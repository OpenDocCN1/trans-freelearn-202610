    \ of the ROC Curve\n\nAnother sample reuse method of obtaining an ROC curve by\
    \ validation is using bootstrap samples. This is not as intuitive as cross-validation,\
    \ but it may, in certain cases, have a lower variance associated with estimation.\n\
    \nBootstrap validation begins by forming B bootstrap samples. While for cross-validation,\
