    \ FPR 而不是特异性。ORDER=FREQ 告诉 PROC FREQ 使用最常见的类别作为事件，从而得到期望的分析。当特异性大于 50% 时此方法有效，这应涵盖大多数情况。当特异性小于\
    \ 50% 时，ORDER=FREQ 也会使用错误的类别作为事件。万无一失的系统需要先按预测变量以降序对数据进行排序，然后再使用不带 ORDER= 指定 的\
    \ PROC FREQ。\n\n## Single Continuous Predictor\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_25_0.png)\n\
    \n- 3.1 Dichotomizing a Continuous Predictor...........................................................\
    \ 15\n- 3.2 The ROC Curve .......................................................................\
    \ 18\n- 3.3 Empirical ROC Curve and the Conditional Distributions of the Marker..\
    \ 20\n- 3.4 Area under the ROC Curve ...............................................................\
    \ 21\n- 3.5 Selecting an Optimal Threshold...........................................................\
    \ 25\n- 3.6 The Binormal ROC Curve...............................................................\
    \ 26\n- 3.7 Transformations to Binormality ...........................................................\
    \ 30\n- 3.8 Direct Estimation of the Binormal ROC Curve .......................................\
    \ 32\n- 3.9 Bootstrap Confidence Intervals for the Area under the Curve.............\
    \ 33\n\n## 3.1 Dichotomizing a Continuous Predictor\n\n现在让我们考虑自然导致使用 ROC 曲线的问题。假设你试图预测一个二元结果，比如天气预报，但你拥有的不是二元预测因子而是一个连续预测因子。大多数天气预报是由统计模型产生的，它们为结果生成一个概率水平。例如，大多数天气预报在摘要中提到降雨，但如果你查看细节，它们还会报告降雨的几率。你将如何评估这些概率（或更恰当地说是产生这些预测概率的模型）的预测准确性？\n\
    \n由于你已经知道如何对二元预测因子进行预测准确性分析（使用灵敏度和特异性等指标），你可能会考虑通过使用阈值将预测概率转化为二分变量。然而，结果显然会取决于阈值的选择。那如果使用多个阈值并报告每个阈值的结果呢？ROC\
    \ 曲线提供了一种方法。通过仅关注灵敏度和（1 减去）特异性，ROC 曲线提供了一种方法。\n\n让我们用医学诊断领域的例子。诊断癌症的一种方法是使用一种特殊的扫描，称为\
    \ *正电子发射断层扫描 (PET)*。PET 产生一个称为 *标准化摄取值 (SUV)* 的指标，它是一个正数，表示所考虑的身体部位患癌的可能性。测量 SUV\
    \ 后，患者会接受活检，其中从疑似区域取出一小块组织并在显微镜下检查以评估其是否癌变。此过程称为 *病理验证*，被认为是金标准。使用第 1 章引入的术语，我们将\
    \ SUV 称为标记，病理验证称为金标准。\n\n数据由 Wong et al. (2002) 报道。有 181 名患者，其中 67 名被金标准发现患有癌症。由于我们处理的是连续预测因子，因此不再可能以表格形式报告数据。相反，你可以使用以下来自\
    \ PROC UNIVARIATE 的并排直方图，该图可通过同时使用 CLASS 和 HISTOGRAM 语句获得。例如，以下代码用于生成图 3.1：\n\n\
    ```\nproc univariate data=HeadNeck noprint;\nclass gold_standard / keylevel='-';\n\
    var suv;\nhistogram suv / turnvlabels cfill=ligr cframe=white\n    cframeside=white\
    \ endpoints=0 to 20 by 2 cbarline=black\n    font=swissb height=4;\nrun;\n```\n\
    \n## Figure 3.1 Side-By-Side Histograms for SUV\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_26_0.png)\n\
    \n当在 PROC UNIVARIATE 中使用 CLASS 语句调用 HISTOGRAM 语句时，会为类别变量的每个值生成单独的直方图。KEYLEVEL=\
    \ 选项确保所选级别始终出现在顶部（在本例中，代码首先显示金标准阴性患者的直方图）。HISTOGRAM 语句中使用的选项在视觉上增强了图形。它们的使用在 *Base\
    \ SAS Procedures Guide: Statistical Procedures* 中有详细说明，该指南可在 support.sas.com/documentation/onlinedoc/sas9doc.html\
    \ 获取。\n\n"
