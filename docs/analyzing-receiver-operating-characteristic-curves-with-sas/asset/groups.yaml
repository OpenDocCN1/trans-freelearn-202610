    # 9.4 ROC Curves from SAS Enterprise Miner for Competing Models


    In addition to logistic regression, we will also use two other methods in the
    toolkit of SAS Enterprise Miner: decision trees and neural networks. They are
    not available in SAS/STAT, so a statistician who uses SAS may be unfamiliar with
    them. For this reason, here’s a brief description of these methods.


    Decision trees, also known as recursive partitioning in statistical literature,
    mostly consider binary splits of each variable in a hierarchical manner. For the
    first split, all the variables are considered one by one and the one that provides
    the best split (according to one of the several commonly used criteria, such as
    the misclassification rate or Gini index) is retained for the first'
  - '[PAGE 124]


    step. Nodes that are not split any further are called *terminal nodes* or *leaves*.
    Once this variable is chosen, the same process is repeated again twice, one for
    each side of the binary split. SAS Enterprise Miner also considers multiple splits
    of one side of the node so that it is possible to have a tree where one side of
    the initial node is a leaf and the other side has split multiple times. Multinomial
    variables are grouped into two so that the resulting binary grouping gives the
    best split. Similarly, the continuous variables are also split into two by finding
    the best cutoff. The resulting decision tree for the home equity loan example
    appears in Figure 9.3.


    # Figure 9.3 Example Decision Tree for the Home Equity Loan Example


    ![](img/ac26020abd4f22abfaafc0607939c6e4_124_0.png)


    For example, the first variable used is DEBTINC, which is a continuous variable.
    It was split at 44.7337. For those with a debt-to-income ratio less than 44.7337,
    the next best split was VALUE, split at 303,749.


    Decision trees are distinguished from logistic regression and neural networks
    in an important way: There is no statistical model. Because there is no model,
    there is no predictive equation. When a new observation is scored, it is “dropped”
    from the top of the tree and follows the route that is dictated, at each node,
    according to the value of the covariates until it reaches a terminal node (or
    leaf). This can be described as a rule, in the form of a series of IF-THEN-ELSE
    statements.


    The binary split structure of the tree is an advantage because it is easy to interpret.
    It can also be a disadvantage, especially when some of the predictors are continuous.
    Categorization of continuous covariates may lead to inefficiency and adversely
    affect predictive performance. Another advantage of decision trees is that they
    handle missing data very effectively. This is accomplished by establishing surrogate
    splits at each node that can be used when the splitting variable for that node
    is missing.


    *Neural network* is an umbrella term that describes methods that build models
    mimicking the function of the brain. Their precise mathematical description is
    complicated and unlikely to'
