    \ 样本上训练模型\n+      b. 使用训练好的模型在原始数据上计算 M；记为 Mₒᵢ\n+      c. 使用训练好的模型在 bootstrap\
    \ 样本上计算 M；记为 M_bᵢ\n+      d. 计算差异：dᵢ = Mₒᵢ − M_bᵢ\n+   3. 从 Mₒ 中减去 mean(dᵢ)。这是\
    \ bootstrap 验证的感兴趣度量。\n\n%BVAL 宏，其语法与 %XVAL 宏相似，生成两个数据集 BVAL1 和 BVAL2，分别包含使用原始数据和\
