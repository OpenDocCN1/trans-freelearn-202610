- raw:
  - '[PAGE 22]


    The first set of confidence limits are based on the well-known normal approximation
    to the binomial. The key quantity for these confidence intervals is the asymptotic
    standard error (ASE), which is given by


    ASE = sqrt( p(1 - p) / n )


    where n is the denominator for the binomial proportion (in this example, sensitivity)
    and p is the estimate of the proportion from the data. The ASE for sensitivity
    is 5.68%.


    The confidence limits appearing under the ASE are based on asymptotic theory.
    If n is large, then the 95% confidence interval can be calculated using


    p ± 1.96 × ASE


    The output reports that the asymptotic 95% confidence interval for sensitivity
    is (76.74%, 99.01%).


    Exact confidence limits, in contrast, are based on the binomial distribution,
    and they have better coverage in small samples and/or rare events. Because they
    are calculated by default when the BINOMIAL option is specified, there is no need
    to use the asymptotic confidence limits. The exact 95% confidence interval for
    sensitivity is (71.80%, 96.60%). The difference between the asymptotic and exact
    intervals highlights the typical effects of moderate sample size.


    Finally, the last part of the output provides a test of whether the sensitivity
    is equal to 80% or not. The z-statistic reported in the PROC FREQ output is computed
    by z = p / ASE(null), where ASE(null) means the ASE under the null hypothesis.
    This is a typical way of computing test statistics, sometimes referred to as a
    Wald test. The ASE(null) for our hypothesis is 6.96% and the corresponding z-value
    is 1.13. In large samples, z has a normal distribution under the null hypothesis
    so a p-value can be obtained by referring to a standard normal table. This results
    in a two-sided p-value of 0.26, suggesting that the sensitivity of frost forecast
    is no different than 80%.


    There is an important difference between confidence intervals and hypothesis tests
    in general regarding the computation of the asymptotic standard error. The ASE
    of 5.68% uses the observed p of 87.88% while the ASE under H₀ (6.96% here) uses
    the p of 80% from the null hypothesis.'
