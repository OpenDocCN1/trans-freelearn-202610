  mdcn: "\n\n模型拟合通过似然准则进行评估，例如 PROC NLMIXED 中报告在 Fit Statistics 下的 Akaike 信息准则（AIC）或贝叶斯信息准则（BIC）。这些准则对于模型比较很有用。PROC\
    \ MIXED 的用户，另一种使用似然方法的程序，会熟悉这些准则。相比之下，PROC GLM 中的模型拟合通常通过全模型 F 检验来评估，而 F 检验是平方和的函数。\n\
    \nParameter Estimates 表的结构与其它 SAS/STAT 程序的输出相似。输出中通常还有一列标记为 Alpha，报告用于置信区间的显著性水平，这里为节省空间已删除。还提供了一个额外信息，即最终迭代时的梯度值，但这可能只对高级用户有益。\n\
    \n## A.2 PROC NLMIXED 与双变量正态模型\n\n了解第 3 章和第 5 章中使用的 PROC NLMIXED 程序是如何开发的可能会很有用。首先，考虑第\
    \ 3.5 节中的模型和代码：\n\n```\nproc nlmixed;\n  parms m1=0 m0=0 s1=1 s0=1;\n  if gold=1\
    \ then m=m1;else if gold=0 then m=m0;\n  if gold=1 then s=s1**2;else if gold=0\
    \ then s=s0**2;\n  a=(m1-m0)/s1;\n  b=s0/s1;\n  model y~normal(m,s);\n  estimate\
    \ 'a' a;\n  estimate 'b' b;\n  estimate 'AUC' probnorm(a/sqrt(1+b**2));\nrun;\n\
    quit;\n```\n\nMODEL 语句指定了一个均值为 M、方差为 S 的正态分布结果，均值和方差由两个 IF 语句定义。这会产生 ROC 分析，但你必须手动（或在\
    \ DATA 步中）生成双变量正态参数 a 和 b 以及 ROC 曲线下面积（AUC）的点估计。获得它们的方差将花费相当多的时间和一些 PROC IML 知识。这凸显了\
    \ ESTIMATE 语句的实用性，在其中你可以使用类似 DATA 步的编程方法定义任何非线性变换并获得点估计和标准误。以下代码展示了两种不同的方法：\n\n\
    - 1. 这些量可以先定义然后再估计。此方法用于上述代码中的双变量正态参数 a 和 b。\n- 2. 定义可以在 ESTIMATE 步骤中执行。此方法用于上述代码中的\
    \ AUC。\n\n请注意，PROC GLM 及其他 SAS/STAT 程序中的 ESTIMATE 语句仅适用于线性变换，因此使用例如 PROC GLM 获得\
    \ a、b 和 AUC 的估计是不可能的。\n\n现在让我们重新审视第 5 章中的潜在双变量正态模型。这突出了 PROC NLMIXED 的一个主要优势：能够指定任意似然函数。\n\
    \n```\nproc nlmixed data=moody gconv=0;\n    parms alpha=1 theta1=1 theta2=2 theta3=3\
    \ beta=1;\n    bounds theta1>0, theta2>0, theta3>0;\n    eta1=alpha*def;\n   \
    \ eta2=exp(beta*def);\n        if r11=1 then z=probnorm(-eta1/eta2);\n    else\
    \ if r11=2 then z=probnorm((theta1-eta1)/eta2)-\n        probnorm(-eta1/eta2);\n\
    \    else if r11=3 then z=probnorm((theta2+theta1-eta1)/eta2)-\n        probnorm((theta1-eta1)/eta2);\n\
    \    else if r11=4 then z=probnorm((theta3+theta2+theta1-eta1)/eta2)-\n      \
    \  probnorm((theta2+theta1-eta1)/eta2);\n    else if r11=5 then z=1 - probnorm((theta3+theta2+theta1-\n\
    \        eta1)/eta2);\n    if z>1e-6 then ll=log(z);\n    else ll=-1e6;\n    model\
    \ r11 ~ general(ll);\n    estimate 'AUC' probnorm(alpha/sqrt(1+beta**2));\nrun;\n\
    ```\n\nMODEL 语句指定了一个 GENERAL（LL）模型。这意味着似然函数（的对数）由用户通过项 LL 定义。回想一下 R11 表示有序信用评分，底层模型是有序回归的潜在模型。每个\
    \ IF 语句指定了 R11 的每个可能取值对似然的贡献。这些贡献在第 5 章中被推导为\n\n$$\\gamma_k(z)=\\Phi\\left(\\\
    frac{\\theta_k - \\alpha D}{e^{\\beta z}}\\right)$$\n\nIF 语句的结构与此公式非常接近。这些语句唯一地定义了\
    \ Z 的值，即似然，进而定义 LL，即 Z 的对数。贡献小于 10^-6 的似然将被计为 10^-6 的条件确保了非常小的贡献不会导致数值不稳定。\n\n\
    ## 参考文献\n\nAllison, P.D. (1995). *Survival Analysis Using the SAS System: A Practical\
    \ Guide*. Cary, NC: SAS Institute Inc.\n\nCantor, A.B. (2003). *SAS Survival Analysis\
    \ Techniques for Medical Research, Second Edition*. Cary, NC: SAS Institute Inc.\n\
    \nCerrito, P. B. (2006). *Introduction to Data Mining Using SAS Enterprise Miner*.\
    \ Cary, NC: SAS Institute Inc.\n\nCox, D.R. (1972). “Regression models and life\
    \ tables (with discussion).” *Journal of the Royal Statistical Society. Series\
    \ B* 34:187–220.\n\nCox, D.R. (1975). “Partial likelihood.” *Biometrika*. 62:269–276.\n\
    \nDeLong, E.R., D.M. DeLong, and D.L. Clarke-Pearson. (September, 1988). “Comparing\
    \ the areas under two or more correlated receiver operating characteristic curves:\
    \ A nonparametric approach.” *Biometrics*. 44(3):837–845.\n\nEfron, B., and R.\
    \ Tibshirani. (1993). *An Introduction to the Bootstrap*. New York: Chapman &\
    \ Hall.\n\nGönen, M., and G. Heller. (2005). “Concordance probability and discriminatory\
    \ power in proportional hazards regression.” *Biometrika*. 92:965–970.\n\nGönen,\
    \ M., and G. Heller. (2007). “Lehmann family of ROC curves.” (Under peer review).\
    \ Available at www.bepress.com/mskccbiostat/paper11/.\n\nGüttler, A. (2005). “Using\
    \ a bootstrap approach to rate the raters.” *Financial Markets and Portfolio Management*.\
    \ 19(3):277–295.\n\nHanley, J.A. (August, 1988). “The robustness of the ‘binormal’\
    \ assumptions used in fitting ROC curves.” *Medical Decision Making*. 8(3):197–203.\n\
