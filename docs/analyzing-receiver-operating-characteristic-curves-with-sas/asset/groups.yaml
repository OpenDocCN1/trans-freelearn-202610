    \ Σ_{i=1}^n Σ_{j=1}^m ψ(W_i, W_j)\n```\n\nThe summation represents the number\
    \ of pairs that have W_i > W_j (with an accommodation for ties), so the entire\
    \ expression is the fraction of patient pairs where the one with the higher marker\
    \ value had the outcome.\n\nYou can use the idea of concordance in time-to-event\
    \ settings. To see how the definition of concordance can be adopted for censored\
    \ outcomes, let T_i and T_j be the event times in a given pair of patients with\
    \ marker values W_1 and W_2. The concordance between a marker W and the censored\
    \ outcome T is defined as\n\n```\nCP(W, T) = P(T_1 > T_2 | W_1 > W_2)\n```\n\n\
    Because T is subject to censoring, this estimator cannot be used since the outcome\
    \ is partially observed.\n\nHarrell et al. (1982) suggest a modification of this\
    \ estimator that can be used with censored data. This method is based on the realization\
    \ that even in the presence of censoring, the outcome in some of the pairs can\
    \ be ordered. For example, if the second subject is dead with a survival time\
    \ that is shorter than the follow-up time of the first subject who is alive, we\
    \ can say with certainty that T_1 > T_2. Table 7.1 lists all the possibilities\
    \ and the corresponding value of ψ(W_1, W_2). If ψ(W_1, W_2)=1, it indicates that\
    \ the prediction and the outcome are concordant. If ψ(W_1, W_2)=0, it indicates\
    \ that the prediction and the outcome are discordant. Finally, (W_1, W_2)=? means\
    \ that, due to censoring, it is not possible to determine whether the prediction\
    \ and the outcome are concordant or discordant.\n\n## Table 7.1 All Possible Pairings\
    \ and Concordance Status with Censored Data\n\n| Subject 1 | Subject 2 | T₁ and\
    \ T₂ | Ψ(W₁,W₂) |\n|---|---|---|---|\n| Event | Event | T₁>T₂ | 1 |\n| Event |\
    \ No Event | T₁>T₂ | ? |\n| No Event | Event | T₁>T₂ | 1 |\n| No Event | No Event\
    \ | T₁>T₂ | ? |\n| Event | Event | T₁<T₂ | 0 |\n| Event | No Event | T₁<T₂ | 0\
    \ |\n| No Event | Event | T₁<T₂ | ? |\n| No Event | No Event | T₁>T₂ | ? |\n\n\
    Now we can evaluate all the pairs to see whether they are concordant or not using\
    \ the definitions in Table 1. The denominator is the number of informative pairs\
    \ (that is the pairs for which we can make a decision), indicated in the following\
    \ equation by k. The notation (i,j)=1 to (i,j)=k means that the summation is over\
    \ pairs of (i,j) and there are k such pairs. The resulting estimator of concordance\
    \ probability is often called the c-index.\n\n```\nc = 1/k Σ_{(i,j)=1}^k ψ(W_i,\
    \ W_j)\n```\n\nThe c-index has several advantages. It mimics the computation of\
    \ the area under the ROC curve with binary data, it is intuitive, and it is conceptually\
    \ simple to compute. Despite the conceptual simplicity, the computation requires\
    \ forming all pairs and can take a long time. Computation of the c-index is not\
    \ built into existing SAS procedures, but the %CINDEX macro, available from this\
    \ book’s Web site, can be used to compute it, as follows:\n\n```\n%CINDEX (DSN=LUNG,\
    \ PRED=SUV, SURV=SURVIVAL, CENS=CENS);\n```\n\nHere, DSN is the name of the data\
    \ set, Pred is the variable in the data set to be used as the predictor, Surv\
    \ is the survival time variable, and Cens is the censoring indicator (1 for censored,\
    \ 0 for event). Output 7.4 simply reports the c-index.\n\n## Output 7.4\n\n```\n\
    cindex\n--------\n0.692708\n```\n\nIn the case of the lung cancer example, the\
    \ concordance probability is estimated to be 0.69, using the c-index as the estimator.\n\
    \nIf the question of interest centers around multiple markers or a multivariable\
    \ predictive model, then the input macro variable PRED of the %CINDEX macro should\
    \ point to the variable containing the predictions of the multivariate model.\n\
    \nDespite all its advantages, the c-index has one big drawback. It is not a consistent\
    \ estimator of the true concordance probability. A consistent estimate gets closer\
    \ to the true value as the sample size increases. However, the c-index can remain\
    \ far away from the true value even as the sample size increases. Therefore, the\
    \ c-index can give “wrong” answers even in large samples. In my experience, if\
    \ the censoring rate is low (which implies that the proportion of undecided pairs\
    \ is low), the c-index works reasonably well. As the censoring rate increases,\
    \ its performance becomes unpredictable.\n\nThe reason for the inconsistency of\
    \ the c-index, at least intuitively, is that it uses the observed survival or\
    \ follow-up times. Unless a parametric model is adopted, procedures using the\
    \ observed values do not provide consistent estimates. For this reason, most of\
    \ the non-parametric or semi-parametric methods of analyzing censored data, such\
    \ as the Kaplan-Meier estimate or the proportional hazards regression, use the\
    \ ranks of the data, not their actual values.\n\nBefore we finish this section,\
    \ note an interesting property of the concordance probability:\n\nCP(W,T)=1−CP(−W,T)\n\
    \nThis equation tells us that if a marker is known to have high values when the\
    \ outcome is unlikely, then CP can be less than 0.5. The more informative measure\
    \ in this case is 1−CP, which can be taken as a measure of the marker to correctly\
    \ order event times.\n\n## 7.5 Concordance Probability and the Cox Model\n\nThere\
    \ is an alternative way of computing the concordance probability in a very important\
    \ special case. Most cases involving regression with censored data, such as modeling\
    \ the relationship between a continuous covariate and a censored outcome or between\
    \ multiple covariates and a censored outcome, are handled within the framework\
    \ of the Cox model (proportional hazards regression). It turns out that concordance\
    \ probability can be computed analytically in the context of the Cox model. The\
    \ following development is from Gönen and Heller (2005).\n"
