    \ 80\n\n## 6.1 引言\n\n前五章涵盖了分析 ROC 曲线的传统方法。本章介绍了一种构建连续预测变量 ROC 曲线的不同方法。该方法具有三个重要优势，即\n\
    \n- 对应于具有非常简单函数形式的 ROC 曲线\n- 轻松与内置 SAS 过程配合使用\n- 便于对比较 ROC 曲线和协变量调整进行易于推广。\n\n\
    ## 6.2 Lehmann 分布族\n\n在第 3 章中，我们根据金标准状态值的标记值条件累积分布函数的补集推导了 ROC 曲线的一般表示。如果 D=0,1\
    \ 表示金标准，W 为标记，则我们定义\n\nF(w) = P(W > w | D = 1)\nG(w) = P(W > w | D = 0)\n\n则 W\
    \ 的 ROC 曲线由下式给出\n\ny = F(G^{-1}(x))\n\n该结果普遍成立，对 F 和 G 没有特别限制。第 3 章使用该结果通过简单地将\
