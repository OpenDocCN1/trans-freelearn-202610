    # ROC Curves with Censored Data


    ![](img/ac26020abd4f22abfaafc0607939c6e4_91_0.png)


    +   7.1 Introduction .........................................................
    81

    +   7.2 Lung Cancer Example ...................................................
    81

    +   7.3 ROC Curves with Censored Data .........................................
    82

    +   7.4 Concordance Probability with Censored Data ...........................
    88

    +   7.5 Concordance Probability and the Cox Model ............................
    91


    # 7.1 Introduction


    In many applications, the binary outcome event is not immediately observable.
    For example, most credit scoring algorithms try to predict the probability of
    default by a certain time. If every subject in the data set is under observation
    at least until that time, then the outcome is truly binary and the methods we
    have seen so far are applicable. But it may not be desirable to wait until the
    outcome for all subjects is observed. It is possible to perform a time-to-event
    analysis, replacing the yes/no default with time elapsed until default. This analysis
    has the advantage of accommodating variable follow-up across subjects. Although
    it is not as powerful as waiting until all subjects reach the pre-specified time,
    it can usually be accomplished much quicker and the loss in efficiency is usually
    minimal.


    # 7.2 Lung Cancer Example


    Lung cancer is one of the most common and lethal cancers. Its prognosis is heavily
    influenced by two factors: tumor size and lymph node involvement. Using these
    factors, you can predict the likelihood of death and plan further treatment accordingly.
    These factors are best measured on the tumor specimen that is removed during surgery.
    However, there is considerable interest to accurately characterize the prognosis
    before surgery. Chapter 3 described the standardized uptake value (SUV) from a
    positron emission tomography (PET) scan. In this example we will examine the accuracy
    of SUV as a marker of lung cancer mortality. The goal of this analysis is to see
    if the SUV can predict survival in lung cancer patients following surgery. Since
    the SUV is available before surgery, it would have important practical consequences
    if it has reasonable predictive value.'
  - '[PAGE 92]


    The data set for this study has three variables: SUV, Survival, and Status. Survival
    is the time elapsed between surgery and death. For patients who are alive at the
    time of analysis, it represents the time between surgery and last follow-up. Status
    is a binary variable indicating whether the patient was dead or alive at last
    contact. If status=1, then the patient was dead and the Survival variable is the
    actual survival time. If status=0, then the patient was alive and Survival is
    the follow-up time. These patients are said to be censored because we do not observe
    their survival time.


    This data structure is fairly typical of censored data, and it immediately reveals
    the intricate features of the required statistical analysis. The outcome (that
    is, the survival time) is represented by a combination of two variables (Survival
    and Status) in a specific way. Furthermore, for a subset of the patients, the
    actual outcome is not observed. Traditional statistical methods cannot be directly
    applied to the Survival variable for making inferences about survival time. For
    example, the median of the Survival variable will be an underestimate of the actual
    median because it treats the follow-up time of censored patients as if it was
    the actual survival time.


    For this reason, analysis of censored data requires special methods. Because censored
    data are ubiquitous in clinical research, not to mention several other areas such
    as engineering reliability (time to equipment failure) and finance (time to default),
    these special methods have been widely studied. This chapter uses two of the more
    popular censored data methods. One is the Kaplan-Meier estimate of the survival
    time distribution and the other is the proportional hazards (Cox) regression.
    We have already made use of the Cox model in the previous chapter, although from
    a completely different perspective.


    Strictly speaking, little prior knowledge about censored data is required to understand
    this chapter, but it would be difficult to grasp the details without some experience.
    Paul Allison’s Survival Analysis Using the SAS System: A Practical Guide (1995)
    or Alan Cantor’s SAS Survival Analysis Techniques for Medical Research, Second
    Edition (2003), both SAS Press books, can be helpful for this purpose.


    # 7.3 ROC Curves with Censored Data


    We have repeatedly emphasized that generating an ROC curve requires a binary outcome.
    If W is a predictor and D is the binary outcome, you could write


    P(W > c | D = 1)

    P(W ≤ c | D = 0)  (7.1)


    to denote the sensitivity and the specificity corresponding to a certain threshold,
    c. We have seen in Chapter 3 that these two probabilities can be written in terms
    of the conditional distributions of W and that they form the basis for the empirical
    ROC curve.


    In the context of survival models, the outcome is the time elapsed until an event
    (such as death or default) takes place. This can be viewed as a binary outcome
    as a function of time. Equation (7.1) is now replaced by


    P(W > c | D(t) = 1)

    P(W ≤ c | D(t) = 0)  (7.2)'
