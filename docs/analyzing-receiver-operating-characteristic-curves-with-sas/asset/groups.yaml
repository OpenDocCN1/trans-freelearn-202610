  - '[PAGE 102]


    The starting point is the definition of concordance probability for a censored
    outcome, as used in Section 7.4:


    CP(W,T) = P(T₁ > T₂ | W₁ > W₂)


    where T is the survival time and W is the predictor. For the time being, we will
    work with a single predictor. Extension to the case of multiple predictors will
    follow. The Cox model for this case stipulates that


    h(t|W) = h₀(t) exp{βW}


    where h(t) is the hazard function for t, which is written as a product of two
    terms: one involving t only (h₀, the baseline hazard) and one involving W only
    (the linear part). Using the relationship between hazard and survival functions,
    you can write the equivalent expression:


    S(t|W) = S₀(t) exp{βW}


    More information on how to show the equivalence of these two expressions can be
    found in most books covering the Cox model, such as Survival Analysis Using the
    SAS System: A Practical Guide (Allison, 1995).


    Now you can rewrite the concordance probability in terms of survival functions:


    P(T₁ > T₂ | W₁ > W₂) = ∫ S₁(t | W₁) dS₂(t | W₂)


    Understanding this equation requires some familiarity with advanced probability,
    but here it is used to show that concordance probability can be written using
    only S(t). If you substitute the form of S₁ and S₂ from the Cox model, then the
    integral on the righthand side can be evaluated as follows:


    P(T(βᵀW₂) > T(βᵀW₁)) = ∫ S₁(t | W₁) dS₂(t | W₂) = [1 + exp{βᵀ(W₂ − W₁)}]⁻¹


    Hence, to evaluate the discriminatory power of the predictor W in the context
    of a Cox model, you need an estimate of β and the values of W for all possible
    pairings of the data. Note that T enters the computation only through the estimation
    of β, which can be accomplished using partial likelihood. Therefore, censoring
    is naturally handled by the existing methods of fitting a Cox model. This is a
    particular strength of this approach to computing the concordance probability.


    If there are multiple predictors, then both W and β will be vectors. The same
    expression can be written in vector notation as follows:


    P(T(βᵀW₂) > T(βᵀW₁)) = [1 + exp{βᵀ(W₂ − W₁)}]⁻¹'
  - '[PAGE 103]


    The expressions derived so far involve a particular pair of observations, denoted
    as 1 and 2. To use this in a set of data involving several observations, we need
    to compute this probability for each pair of observations. This yields the following
    formula for an estimate of the concordance probability (labeled CPE for concordance
    probability estimate):


    CPE = 2 / [n(n-1)] Σ Σ_{i<j} { I(β̂^T w_{ji} < 0) / [1 + exp{-β̂^T w_{ji}}] +
    I(β̂^T w_{ji} ≥ 0) / [1 + exp{β̂^T w_{ji}}] }


    where w_{ji} = w_j - w_i. The summand consists of two parts, representing the
    case whether higher or lower values of the predictor correlates with longer survival,
    which is reflected in the sign of the regression coefficient. If β > 0, then higher
    values of the covariate are associated with higher values of hazard. In this case,
    if, for a particular pair, w_j > w_i, then the probability of T_j being greater
    than T_i should be more than 0.5 and hence the second term of the summand should
    be applicable since β^T w_{ji} > 0 and exp{β^T w_{ji}} > 0. Thus, (1 + exp{β^T
    w_{ji}})^{-1} > 0.5. The other three cases depending on the sign of β and w_{ji}
    can be explained in a similar fashion.


    As mentioned previously, the availability of Cox model software using partial
    likelihood is the primary operational advantage. It also constitutes one of the
    theoretical advantages. Partial likelihood estimates are consistent; that is,
    as the sample size grows, the results get nearer and nearer the underlying true
    but unknown value of the parameters. It is well-known that functions of consistent
    estimators are also consistent. Since β is the only parameter estimated to compute
    the CPE, it turns out that CPE is also consistent. This is an important reason
    why you should favor CPE over the c-index in the context of Cox models.


    CPE can be estimated using the %CPE macro, which is available from this book’s
    companion Web site at support.sas.com/gonen. The macro call is similar to that
    of %CINDEX:


    ```

    %CPE(DSN=LUNG, COVARIATES=SUV SIZE, SURV=SURVIVAL, CENS=CENS);

    ```


    Output 7.5 shows the results.


    # Output 7.5


    | Concordance Probability Estimate for the Cox Model |

    | CPE | StdErr |

    | 0.6524 | 0.0582 |


    An important difference in the macro calls of CINDEX and CPE is that the predictors
    are listed with blanks in between as if they appeared on the right-hand side of
    the MODEL statement.


    We see that the CPE for the lung data set is less than the c-index. This is usually
    the case, in my experience. The c-index seems to overestimate the true concordance
    probability, especially if the censoring proportion in high. Since the CPE is
    a consistent estimate and the c-index is not (as explained earlier), the CPE is
    a better measure in the context of using predictions from Cox regression models.'
