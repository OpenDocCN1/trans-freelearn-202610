  - '[PAGE 31]


    $$F(t)=\int_{t}^{\infty} f(s\mid D=0)\,ds$$ $$G(t)=\int_{t}^{\infty} f(s\mid D=1)\,ds$$


    Because all patients in $G(t)$ are, by definition, gold standard positive, $G(t)$
    describes the proportion of positive patients whose SUV exceeds $t$ out of all
    positive patients. This is nothing but the sensitivity when $t$ is used as the
    threshold. Similarly, $1-F(t)$ would be the specificity; hence, $F(t)$ represents
    one minus the specificity. Therefore, an ROC curve is a plot of $F(t)$ vs $G(t)$
    for each $t$.


    Although this is mathematically correct, it does not completely describe the ROC
    curve because of its dependence on $t$. However, we know that $F(t)$ is the x-coordinate
    of the ROC curve. Writing $x=F(t)$ and solving for $t$, you get $t=F^{-1}(x)$.
    The sensitivity corresponding to $t$ is $G(t)$. So the sensitivity corresponding
    to $x$ is given by


    $$y=G(F^{-1}(x))$$


    There are several important features of this representation. First of all, it
    is generic. No assumptions are made about the marker or the gold standard. It
    also makes explicit the dependence of the ROC curve on the entire distribution
    function. This representation also explains why the ROC curves focus on sensitivity
    and specificity instead of NPV and PPV. The denominators of the positive and negative
    predictive values change with the threshold and do not lend themselves to notation
    and analyses by the use of cumulative distribution functions of the predictor
    variable.


    This relationship can also be used to highlight a fundamental property of the
    empirical ROC curve that it is invariant under monotone transformations of the
    marker. To understand this concept, imagine using $h(t)$ instead of $t$ as the
    marker, where $h(.)$ is a monotone function (a monotone function preserves the
    ranks of the data; almost all of the transformations used in statistics, such
    as logarithmic or power, are monotone). $F$ and $G$ would have the same shape
    for $h(t)$ as they do for $t$; the only difference would be in their horizontal
    axes. This would only change the thresholds, not the resulting ROC curve.


    # 3.4 Area under the ROC Curve


    The ROC curve is a summary of the information about the accuracy of a continuous
    predictor. Nevertheless, sometimes you might want to summarize the ROC curve itself.
    The most commonly used summary statistic for an ROC curve is the area under the
    ROC curve (AUC).


    In an empirical ROC curve, you can estimate the AUC by the so-called trapezoidal
    rule:


    +   1. Trapezoids are formed using the observed points as corners.

    +   2. Areas of these trapezoids are calculated with the coordinates of the corner
    points.

    +   3. These areas are added up.'
  - '[PAGE 32]


    This may be quite an effort for a curve like the one in Figure 3.3 with many possible
    thresholds. Fortunately, the AUC is connected to some well-known statistical measures,
    such as concordance, Somers’ D, and the Mann-Whitney test statistic. This connection
    is associated with the invariance property discussed in Section 3.3. Invariance
    to monotone transformations implies that the ROC curve is a rank-based measure.
    The only information used from the observed marker values is their relative rank.


    We will exploit these relationships not only to facilitate computation but also
    to gain further insight into the meaning of the area under the curve and to improve
    interpretation. In particular, we will see how you can estimate the concordance
    using PROC LOGISTIC and Somers’ D using PROC FREQ. The relationship between the
    AUC and the Mann-Whitney statistic is as useful as the others in terms of conceptualization
    but not as useful from a SAS perspective. It is not explored here.


    # 3.4.1 Concordance and Computing the AUC Using PROC LOGISTIC


    Concordance probability measures how often predictions and outcomes are concordant.
    Continuing with the PET example, if, in a randomly selected pair of patients,
    the one with the higher SUV has cancer and the one with the lower SUV has no cancer,
    then this pair is said to be a concordant pair. A pair where the patient with
    the higher SUV has no cancer but the one with the lower SUV has cancer is said
    to be a discordant pair. Some pairs have the same SUV and they are called tied
    pairs. Finally, some pairs are noninformative; for example, both patients may
    have cancer or both may have no cancer. It is not possible to classify these pairs
    as concordant or discordant.


    The probability of concordance is defined as the number of concordant pairs plus
    one-half the number of tied pairs divided by the number of all informative pairs
    (i.e., excluding non-informative pairs). In essence, each tied pair is counted
    as one-half discordant and one-half concordant. This is a fundamental concept
    in many rank procedures, sometimes referred to as randomly breaking the ties.


    An equivalent way to express concordance is P(SUV₊>SUV₋), where SUV₋ indicates
    the SUV of a gold standard negative patient and SUV₊ indicates the SUV of a gold
    standard positive patient. Figure 3.1 is helpful in visualizing this process.
    If one SUV is selected at random from the upper histogram and one from the lower
    histogram, what are the chances that the one chosen from the lower is higher than
    the one chosen from the upper?


    The most important consequence for our purposes is that the area under the ROC
    curve is equal to the concordance probability that is reported by various SAS
    procedures. For example, PROC LOGISTIC reports concordance in its standard output
    under the heading “Association of Predicted Probabilities and Observed Responses.”
    Using the same call to PROC LOGISTIC that generates the data set for plotting
    the ROC curves, you can obtain the AUC from the output marked with “c”. In the
    PET example, this turns out to be 0.871 (or 87.1%), as seen from Output 3.1. The
    output also contains the elements of the computation (namely, the number of concordant,
    discordant, and tied pairs).


    # Output 3.1


    | Association of Predicted Probabilities and Observed Responses |

    | Percent Concordant 86.1 Somers'' D 0.743 |

    | Percent Discordant 11.8 Gamma 0.758 |

    | Percent Tied 2.1 Tau-a 0.348 |

    | Pairs 7638 c 0.871 |'
  - "[PAGE 33]\n\nThe AUC is estimated from the data, so there has to be a standard\
    \ error associated with this estimation. The major drawback to using PROC LOGISTIC\
    \ to estimate the AUC is that the associated standard error is not available.\
    \ Fortunately, PROC FREQ provides an indirect alternative for this purpose.\n\n\
    # 3.4.2 Somers’ D and AUC Using PROC FREQ\n\nPROC LOGISTIC output includes Somers’\
    \ D as well. D and AUC are related to one another through the equation D=2*(AUC-0.5).\
    \ Somers’ D is simply a rescaled version of the AUC (or concordance) that takes\
    \ values between -1 and 1, like a usual correlation coefficient, instead of 0\
    \ and 1. PROC LOGISTIC does not report the standard error for Somers’ D. However,\
    \ PROC FREQ reports both Somers’ D and its standard error, as in the following\
    \ example:\n\n```\nproc freq data=HeadNeck;\n    table suv*gold_standard / noprint\
    \ measures;\nrun;\n```\n\nThe NOPRINT option suppresses the printing of the frequency\
    \ table, which could be several pages long since each unique value of the SUV\
    \ will be interpreted as a row of the table. The MEASURES option ensures that\
    \ various measures of association, including Somers’ D, are printed. Output 3.2\
    \ shows the results from this invocation of PROC FREQ.\n\n# Output 3.2\n\n| Statistic\
    \ | Value | ASE |\n|---|---|---|\n| Gamma | 0.7585 | 0.0498 |\n| Kendall's Tau-b\
    \ | 0.5374 | 0.0402 |\n| Stuart's Tau-c | 0.6925 | 0.0561 |\n| Somers' D C|R |\
    \ 0.3889 | 0.0323 |\n| Somers' D R|C | 0.7426 | 0.0523 |\n| Pearson Correlation\
    \ | 0.6187 | 0.0395 |\n| Spearman Correlation | 0.6311 | 0.0466 |\n| Lambda Asymmetric\
    \ C|R | 0.6716 | 0.0634 |\n| Lambda Asymmetric R|C | 0.0081 | 0.0180 |\n| Lambda\
    \ Symmetric | 0.2408 | 0.0318 |\n| Uncertainty Coefficient C|R | 0.6252 | 0.0521\
    \ |\n| Uncertainty Coefficient R|C | 0.1225 | 0.0104 |\n| Uncertainty Coefficient\
    \ Symmetric | 0.2049 | 0.0172 |\n| Sample Size = 181 | | |\n\nTwo Somers’ statistics\
    \ are reported: C|R uses the column variable as the predictor and the row variable\
    \ as the gold standard, while R|C uses the row variable as the predictor and the\
    \ column variable as the gold standard. The relevant statistic here is R|C, reported\
    \ to be 0.7426 with a standard error of 0.0523. If the table was constructed so\
    \ that the marker (the SUV) was the column variable and the gold standard was\
    \ the row variable, then we would have used the Somers’ D C|R statistic."
