    # Figure 6.3 The ROC Points (Dots), the Lehmann ROC Curve (Solid Line), and the
    95% Confidence Intervals (Dashed Lines)


    ![](img/ac26020abd4f22abfaafc0607939c6e4_83_0.png)


    The area under the empirical curve is computed as 0.597, with a standard error
    of 0.025 (using the %ROC macro, details omitted), while the area under the Lehmann
    ROC curve is 0.588, with a standard error of 0.030. The latter pair of numbers
    is computed using the analytic relationships provided in Section 9.1. The closeness
    of the empirical and the Lehmann estimates is a sign that the Lehmann model is
    a good fit to the data.


    # 6.4 Adjusting for Covariates


    As we have seen earlier in Chapter 4, covariates may influence the accuracy of
    a marker and the ROC curve may need to be adjusted accordingly. It is easy to
    extend the regression models studied in Chapter 5 to the context of Cox regression,
    as follows:


    h(V | D, U) = \tilde{h}(v) exp{β₁ D + β₂ U + β₃ D U}


    This provides regression-based covariate adjustments for the Lehmann ROC curves.
    This construction is similar in the sense that an interaction between the gold
    standard, D, and the covariate, U, is included in the model. To see the form of
    the covariate-adjusted ROC curve, consider the ratio of the hazard functions of
    observations, one with D=1 and one with D=0:


    h(V | U, D = 1) / h(V | U, D = 0) = exp{β₁ + β₃ U}'
