    \ the existing model with the addition of the chosen variable. If no variables\
    \ meet the criterion for entry (p≤0.05 by default but can be tailored using the\
    \ SLE option of the MODEL statement), then the existing model is considered final.\n\
    \n+   3. Remove any variable that loses significance (p>0.05 by default but can\
    \ be tailored using the SLS option of the MODEL statement) from the existing model.\
    \ If several variables have lost significance, remove each variable one by one\
    \ starting with the variable with the highest p-value. After each removal, p-values\
    \ are regenerated by refitting the model. Return the removed variables to the\
    \ list of candidates.\n\n+   4. At this point, all the variables in the existing\
    \ model should be significant by the SLS criterion. All the other variables should\
    \ be in the list of candidates. Go to Step 1 and repeat the process until none\
    \ of the candidate variables are significant and none of the variables in the\
    \ existing model can be removed."
