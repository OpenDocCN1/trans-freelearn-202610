    \ (one for each marker) taken on the same subject. Because $u_i$ and $u_{i'}$\
    \ are independent for $i\\neq i'$, there is no correlation between marker values\
    \ that were not measured on the same subject. Use of random effects to induce\
    \ correlations on selected pairs of subjects is a standard technique in most settings.\n\
    \nThe following code segment first runs PROC TRANSREG to identify a transformation\
    \ to normality. See Section 3.7 for a detailed explanation of the role of this\
    \ step in fitting binormal models.\n\n```\nproc transreg data=bone;\n    model\
    \ boxcox(suv1/parameter=0.1 geometricmean)=class(gold);\n    output out=trsuv;\n\
    run;\n\nproc transreg data=bone;\n    model boxcox(bsi/parameter=0.1 geometricmean)=class(gold);\n\
    \    output out=trbsi;\nrun;\n```\n\nThe Box-Cox model identifies the logarithmic\
    \ transformation for the BSI and the square-root transformation for the SUV as\
    \ the best possible transformations to normality (detailed PROC TRANSREG output\
    \ not shown). The output data sets TRSUV and TRBSI are created by the OUTPUT statement\
    \ in PROC TRANSREG and include the transformed covariates, TBSI and TSUV. These\
    \ two data sets are combined to form Long, a data set in long form. Then PROC\
    \ NLMIXED finds the maximum likelihood estimates for the random-effects binormal\
    \ model, as specified previously.\n\n```\ndata long;\n    set trbsi(keep=_name_\
    \ gold tbsi rename=(tbsi=result _name_=subid)\n        in=in1)\n        trsuv(keep=_name_\
    \ gold tsuv rename=(tsuv=result _name_=subid)\n        in=in2);\n    if in1 then\
    \ marker=0; else if in2 then marker=1;\nrun;\n```"
  md: "\nOutput 4.1 shows the results of this call. The AUC estimates for each of\
    \ the ROC curves, along with their standard errors and (marginal) confidence intervals,\
    \ appear first. BSI has an AUC of 0.7795, which compares favorably with that of\
    \ SUV at 0.6773. The standard errors are quite large, however: 0.0771 for BSI\
    \ and 0.0836 for SUV, resulting in wide confidence intervals. The AUC for BSI\
    \ has a 95% confidence interval that ranges from 0.6284 to 0.9307. The confidence\
    \ interval for SUV is between 0.5134 and 0.8412. It seems that SUV is barely distinguishable\
    \ from a random predictor (since the lower confidence limit barely exceeds 0.50).\n\
    \n## Output 4.1\n\n```\nThe ROC Macro\n\n    ROC Curve Areas and 95%\n       \
    \   Confidence Intervals\n    ROC Area Std Error Confidence Limits\n\nBSI    0.7795\
    \    0.0771    0.6284    0.9307\nsuv1   0.6773    0.0836    0.5134    0.8412\n\
    \n    Contrast Coefficients\n            BSI       suv1\n\nRow1       1      \
    \  -1\n\n        Tests and 95% Confidence Intervals for Contrast Rows\n    Estimate\
    \  Std Error Confidence Limits     Chi-square Pr > ChiSq\n\nRow1   0.1023    0.0954\
    \   -0.0847     0.2893      1.1491   0.2837\n\n        Contrast Test Results\n\
    Chi-Square   DF      Pr > ChiSq\n\n    1.1491    1      0.2837\n```\n\nContrast\
    \ information appears next. This can be used to verify that the results are for\
    \ the intended comparison and to infer the direction of the difference. In this\
    \ example, a positive difference in AUC curves points to BSI being the better\
    \ test. The next piece of output compares the two ROC curves. The difference in\
    \ the two AUCs is 0.1023, as reported under the Estimate column. This could be\
    \ obtained directly as the difference between 0.7795 and 0.6773, the AUCs for\
    \ BSI and SUV reported in the first part of the output. However, you can not compute\
    \ the standard error of the difference from the information about the individual\
    \ areas because the data are paired. Based on this standard error, the difference\
    \ between the two AUCs is not significant (p=0.2837) and the confidence interval\
    \ of (−0.0847, 0.2893) spans 0.\n\nIt appears that the test statistic and the\
    \ p-value are reported twice. Had the contrast involved more than one row, then\
    \ the output on contrast rows would have included one line for each row in the\
    \ contrast. The part labeled “Contrast Test Results” would still report a single\
    \ p-value with r−1 degrees of freedom, where r is the number of rows. Therefore,\
    \ only in a contrast with a single row does information in the “Contrast Rows”\
    \ section and the “Contrast Test” section coincide.\n\nAs discussed here, it is\
    \ essential to present a visual display of the ROC curves along with the comparison\
    \ of the AUCs. Figure 4.1 is generated by the %PLOTROC macro introduced in Chapter\
    \ 3. The syntax modification is similar to the one in the %ROC macro (that is,\
    \ multiple markers are specified in the VAR macro variable, separated by blanks).\n\
    \n```\n%plotroc (bone bsi,suv,gold,anno=4,tlist1=1.08 2.29, tlist2=4.8 5.8);\n\
    ```\n\n## Figure 4.1 ROC Curves for BSI (Solid) and SUV (Dashed) Overlaid\n\n\
    ![](img/ac26020abd4f22abfaafc0607939c6e4_51_0.png)\n\nFigure 4.1 shows that the\
    \ BSI has a higher sensitivity than the SUV for most values of the specificity.\
    \ In the range where sensitivity is 50% through 80%, the sensitivity of BSI is\
    \ substantially higher than that of SUV. A threshold of 2.29 for the BSI achieves\
    \ a sensitivity of more than 80% and a specificity of more than 70%. None of the\
    \ operating points for the SUV offers comparable accuracy. Despite this, keep\
    \ in mind that the AUC estimates displayed high variability and the difference\
    \ was not statistically significant.\n\n## 4.4.2 Comparisons with Unpaired Data\n\
    \nIn theory, the %ROC macro can only compare the AUCs of two predictors if the\
    \ data are paired. Because unpaired designs are so uncommon in the field of ROC\
    \ curves, no macro performs the desired comparison. Fortunately, unpaired comparisons\
    \ are easy to be performed by hand or by a few lines of DATA step code: If AUC₁\
    \ and AUC₂ are the two AUC estimates with associated standard errors s₁ and s₂,\
    \ then the test statistic for the unpaired comparison is as follows:\n\nT = (AUC₁\
    \ - AUC₂)² / (s₁² + s₂²)\n\nIn a large sample, T will have a chi-square distribution\
    \ with one degree of freedom under the null hypothesis (that is, when the two\
    \ AUCs are indeed equal).\n\nNote that AUC₁ and s₁ are reported when the %ROC\
    \ macro is executed for the first predictor only, as explained in Chapter 3. Similarly,\
    \ AUC₂ and s₂ are estimated from a second %ROC call. Once T is computed, the two-sided\
    \ p-value can be found using the following line in a DATA step:\n\n```\np_value=1-probchi(t_unpaired,1);\n\
    ```\n\nIf the prostate cancer study offered either a PET or a BSI (but not both)\
    \ so that the resulting data structure was unpaired, and if the AUC estimates\
    \ and their standard errors were the same as described previously (0.7795 and\
    \ 0.6773 for the AUCs, 0.0771 and 0.0836 for the standard errors), then T would\
    \ be 0.8095 and the p-value would be 0.3683. The increase in p-value using the\
    \ unpaired design can be explained by the increased efficiency of the paired design,\
    \ as briefly discussed in Section 4.3.\n\n## 4.5 Comparing the Binormal ROC Curves\n\
    \nChapter 3 shows that you can achieve a model-based estimate of the ROC curve\
    \ by assuming that the distributions of the marker for the diseased and non-diseased\
    \ groups have normal distributions with possibly different parameters. Specifically,\
    \ if diseased patients’ marker values follow a normal distribution with mean μ₁\
    \ and variance σ₁² and if non-diseased patients’ marker values follow a normal\
    \ distribution with mean μ₀ and variance σ₀², then the ROC curve can functionally\
    \ be written as\n\nΦ(a + bΦ⁻¹(x))\n\nwith the AUC given by\n\nΦ( a / √(1+b²) )\n\
    \nwhere the binormal parameters a and b are given by\n\na = (μ₁ - μ₀)/σ₁,   b\
    \ = σ₀/σ₁\n\nNext, we discuss paired data in detail; comments about unpaired data\
    \ appear at the end of this section.\n\n### 4.5.1 Comparisons Based on the Binormal\
    \ Model with Paired Data\n\nThe paired nature of the data requires some adjustment\
    \ to the model before you can proceed. Let Xᵢⱼ denote the marker value for the\
    \ iᵗʰ patient and the jᵗʰ marker. Then Xᵢⱼ (or some transformation of it) is assumed\
    \ to have the following normal distribution if the patient has a positive outcome:\n\
    \nXᵢⱼ ~ N( μ₁ⱼ + uᵢ, σ₁ⱼ² )\n\nIf the patient has a negative outcome, then $X_{ij}$\
    \ would be distributed as\n\n$X_{ij} \\sim N\\left(\\mu_{0j}+u_i,\\sigma_{0j}^2\\\
    right)$\n\nThe $u_i$ is normally distributed as well:\n\n$u_i \\sim N\\left(0,\\\
    sigma_r^2\\right)$\n\nwith the key assumption that $u_i$ and $u_{i'}$ are independent\
    \ for $i\\neq i'$ .\n\nThis model has four fundamental parameters for each marker:\
    \ $\\mu_{1i}$ and $\\mu_{0i}$ are the means of the outcome positive and outcome\
    \ negative patients for marker $j$, and $\\sigma_{1i}$ and $\\sigma_{0i}$ are\
    \ the two standard deviations. In this respect, it is a standard binormal model\
    \ for each marker separately. To take into account the correlation between the\
    \ two marker measurements on the same subject, a random effect $u$ is introduced.\
    \ Because $u_i$ is a subject-specific effect, the two marker values that are measured\
    \ on the same patient will have the same $u_i$. This commonality induces a correlation\
    \ on the two measurements (one for each marker) taken on the same subject. Because\
    \ $u_i$ and $u_{i'}$ are independent for $i\\neq i'$, there is no correlation\
    \ between marker values that were not measured on the same subject. Use of random\
    \ effects to induce correlations on selected pairs of subjects is a standard technique\
    \ in most settings.\n\nThe following code segment first runs PROC TRANSREG to\
    \ identify a transformation to normality. See Section 3.7 for a detailed explanation\
    \ of the role of this step in fitting binormal models.\n\n```\nproc transreg data=bone;\n\
    \    model boxcox(suv1/parameter=0.1 geometricmean)=class(gold);\n    output out=trsuv;\n\
    run;\n\nproc transreg data=bone;\n    model boxcox(bsi/parameter=0.1 geometricmean)=class(gold);\n\
    \    output out=trbsi;\nrun;\n```\n\nThe Box-Cox model identifies the logarithmic\
    \ transformation for the BSI and the square-root transformation for the SUV as\
    \ the best possible transformations to normality (detailed PROC TRANSREG output\
    \ not shown). The output data sets TRSUV and TRBSI are created by the OUTPUT statement\
    \ in PROC TRANSREG and include the transformed covariates, TBSI and TSUV. These\
    \ two data sets are combined to form Long, a data set in long form. Then PROC\
    \ NLMIXED finds the maximum likelihood estimates for the random-effects binormal\
    \ model, as specified previously.\n\n```\ndata long;\n    set trbsi(keep=_name_\
    \ gold tbsi rename=(tbsi=result _name_=subid)\n        in=in1)\n        trsuv(keep=_name_\
    \ gold tsuv rename=(tsuv=result _name_=subid)\n        in=in2);\n    if in1 then\
    \ marker=0; else if in2 then marker=1;\nrun;\n```\n"
  mdcn: "\n\nOutput 4.1 显示了此调用的结果。每个 ROC 曲线的 AUC 估计值及其标准误差和（边际）置信区间首先出现。BSI 的 AUC\
    \ 为 0.7795，与 SUV 的 0.6773 相比相当有利。然而标准误差相当大：BSI 为 0.0771，SUV 为 0.0836，导致置信区间很宽。BSI\
    \ 的 AUC 的 95% 置信区间范围从 0.6284 到 0.9307。SUV 的置信区间在 0.5134 到 0.8412 之间。似乎 SUV 几乎无法与随机预测器区分开来（因为下限置信限仅略高于\
    \ 0.50）。\n\n## Output 4.1\n\n```\nThe ROC Macro\n\n    ROC Curve Areas and 95%\n\
    \          Confidence Intervals\n    ROC Area Std Error Confidence Limits\n\n\
    BSI    0.7795    0.0771    0.6284    0.9307\nsuv1   0.6773    0.0836    0.5134\
    \    0.8412\n\n    Contrast Coefficients\n            BSI       suv1\n\nRow1 \
    \      1        -1\n\n        Tests and 95% Confidence Intervals for Contrast\
    \ Rows\n    Estimate  Std Error Confidence Limits     Chi-square Pr > ChiSq\n\n\
    Row1   0.1023    0.0954   -0.0847     0.2893      1.1491   0.2837\n\n        Contrast\
    \ Test Results\nChi-Square   DF      Pr > ChiSq\n\n    1.1491    1      0.2837\n\
    ```\n\n接下来出现对比信息。这可用于验证结果是否针对预期比较，并推断差异的方向。在此示例中，AUC 曲线的正差异指向 BSI 是更好的检验。下一部分输出比较了两个\
    \ ROC 曲线。两个 AUC 的差异为 0.1023，如 Estimate 列下所示。这可以直接通过 0.7795 和 0.6773 之间的差值获得，即输出第一部分中报告的\
    \ BSI 和 SUV 的 AUC。然而，你不能根据单个面积的信息计算差异的标准误差，因为数据是配对的。基于此标准误差，两个 AUC 之间的差异不显著（p=0.2837），置信区间为（-0.0847，0.2893）跨越\
    \ 0。\n\n似乎检验统计量和 p 值被报告了两次。如果对比涉及多于一行，则对比行上的输出将为对比中的每一行包含一行。标记为“Contrast Test\
    \ Results”的部分仍将报告一个具有 r−1 自由度的单一 p 值，其中 r 为行数。因此，只有在对比只有一行时，“Contrast Rows”部分和“Contrast\
    \ Test”部分的信息才一致。\n\n如本文所述，必须呈现 ROC 曲线的可视化显示以及 AUC 的比较。图 4.1 由第 3 章中介绍的 %PLOTROC\
    \ 宏生成。语法修改与 %ROC 宏中的类似（即多个标记在 VAR 宏变量中指定，用空格分隔）。\n\n```\n%plotroc (bone bsi,suv,gold,anno=4,tlist1=1.08\
    \ 2.29, tlist2=4.8 5.8);\n```\n\n## Figure 4.1 ROC Curves for BSI (Solid) and\
    \ SUV (Dashed) Overlaid\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_51_0.png)\n\
    \n图 4.1 显示 BSI 在特异性的大多数取值下比 SUV 具有更高的敏感性。在敏感性为 50% 至 80% 的范围内，BSI 的敏感性明显高于 SUV。BSI\
    \ 的阈值为 2.29 可实现超过 80% 的敏感性和超过 70% 的特异性。SUV 的任何操作点都无法提供可比的准确性。尽管如此，请记住，显示的 AUC\
    \ 估计具有较高的变异性，并且差异没有统计学意义。\n\n## 4.4.2 Comparisons with Unpaired Data\n\n从理论上讲，%ROC\
    \ 宏只能在数据为配对时比较两个预测因子的 AUC。由于在 ROC 曲线领域中非配对设计非常罕见，没有宏执行所需比较。幸运的是，非配对比较可以通过手工或几行\
    \ DATA 步代码轻松完成：如果 AUC₁ 和 AUC₂ 是两个 AUC 估计值，其相关标准误差为 s₁ 和 s₂，则非配对比较的检验统计量如下：\n\n\
    T = (AUC₁ - AUC₂)² / (s₁² + s₂²)\n\n在大样本中，在零假设下（即两个 AUC 确实相等时），T 将具有一个自由度的卡方分布。\n\
    \n请注意，AUC₁ 和 s₁ 是在仅对第一个预测因子执行 %ROC 宏时报告的，如第 3 章中所述。同样，AUC₂ 和 s₂ 是从第二次 %ROC 调用估计的。一旦计算出\
    \ T，两侧 p 值可使用 DATA 步中的以下行找到：\n\n```\np_value=1-probchi(t_unpaired,1);\n```\n\n\
    如果前列癌研究仅提供 PET 或 BSI（但不是两者），使得 resulting 数据结构为非配对，并且如果 AUC 估计值及其标准误差与之前所述相同（AUC\
    \ 为 0.7795 和 0.6773，标准误差为 0.0771 和 0.0836），则 T 将为 0.8095，p 值为 0.3683。使用非配对设计 p\
    \ 值增加可通过配对设计的有效性增加来解释，如第 4.3 节中简要讨论的那样。\n\n## 4.5 Comparing the Binormal ROC Curves\n\
    \n第 3 章表明，你可以通过假设标记在患病组和未患病组的分布具有正态分布且参数可能不同来获得 ROC 曲线的模型化估计。具体而言，如果患病患者的标记值服从均值为\
    \ μ₁ 和方差为 σ₁² 的正态分布，并且未患病患者的标记值服从均值为 μ₀ 和方差为 σ₀² 的正态分布，则 ROC 曲线可函数写为\n\nΦ(a +\
    \ bΦ⁻¹(x))\n\nAUC 给出为\n\nΦ( a / √(1+b²) )\n\n其中双正态参数 a 和 b 给出为\n\na = (μ₁ - μ₀)/σ₁,\
    \   b = σ₀/σ₁\n\n接下来，我们详细讨论配对数据；关于非配对数据的评论出现在本节末尾。\n\n### 4.5.1 Comparisons Based\
    \ on the Binormal Model with Paired Data\n\n数据的配对性质需要在继续之前对模型进行一些调整。设 Xᵢⱼ 表示第\
    \ i 个患者和第 j 个标记的标记值。然后 Xᵢⱼ（或其某种变换）假定在患者有阳性结果时具有以下正态分布：\n\nXᵢⱼ ~ N( μ₁ⱼ + uᵢ, σ₁ⱼ²\
    \ )\n\n如果患者有阴性结果，则 $X_{ij}$ 的分布为\n\n$X_{ij} \\sim N\\left(\\mu_{0j}+u_i,\\sigma_{0j}^2\\\
    right)$\n\n$u_i$ 也服从正态分布：\n\n$u_i \\sim N\\left(0,\\sigma_r^2\\right)$\n\n关键假设是\
    \ $u_i$ 和 $u_{i'}$ 对于 $i\\neq i'$ 是独立的。\n\n该模型为每个标记有四个基本参数：$\\mu_{1i}$ 和 $\\mu_{0i}$\
    \ 是标记 $j$ 的结果阳性和结果阴性患者的均值，$\\sigma_{1i}$ 和 $\\sigma_{0i}$ 是两个标准差。在这方面，它是每个标记单独的标准双正态模型。为了考虑同一受试者上两个标记测量之间的相关性，引入了随机效应\
    \ $u$。因为 $u_i$ 是受试者特异性效应，在同一患者上测量的两个标记值将具有相同的 $u_i$。这种共同性在同一受试者上进行的两个测量（每个标记一个）上诱导出相关性。因为\
    \ $u_i$ 和 $u_{i'}$ 对于 $i\\neq i'$ 是独立的，所以在不同受试者上测量的标记值之间没有相关性。在大多数设置中使用随机效应来诱导受试者选定对上的相关性是一种标准技术。\n\
    \n以下代码段首先运行 PROC TRANSREG 以确定正态性变换。请参阅第 3.7 节，了解此步骤在拟合双正态模型中的作用的详细解释。\n\n```\n\
    proc transreg data=bone;\n    model boxcox(suv1/parameter=0.1 geometricmean)=class(gold);\n\
    \    output out=trsuv;\nrun;\n\nproc transreg data=bone;\n    model boxcox(bsi/parameter=0.1\
    \ geometricmean)=class(gold);\n    output out=trbsi;\nrun;\n```\n\nBox-Cox 模型确定对数变换对\
    \ BSI 和平方根变换对 SUV 是实现正态性的最佳可能变换（未显示详细的 PROC TRANSREG 输出）。输出数据集 TRSUV 和 TRBSI 由\
    \ PROC TRANSREG 中的 OUTPUT 语句创建，并包含变换后的协变量 TBSI 和 TSUV。这两个数据集合并形成 Long，即长格式的数据集。然后\
    \ PROC NLMIXED 找到如前所述的随机效应双正态模型的极大似然估计。\n\n```\ndata long;\n    set trbsi(keep=_name_\
    \ gold tbsi rename=(tbsi=result _name_=subid)\n        in=in1)\n        trsuv(keep=_name_\
    \ gold tsuv rename=(tsuv=result _name_=subid)\n        in=in2);\n    if in1 then\
    \ marker=0; else if in2 then marker=1;\nrun;\n```\n"
