    | -1.25 | 0.26 | -456.31 |\n| -1.00 | 0.26 | -374.17 |\n| -0.75 | 0.27 | -299.21\
    \ |\n| -0.50 | 0.28 | -233.40 |\n| -0.25 | 0.31 | -179.12 |\n| 0.00 | 0.34 | -139.18\
    \ |\n| 0.25 | 0.38 | -116.98 * |\n| 0.50 + | 0.42 | -115.97 < |\n| 0.75 | 0.43\
    \ | -137.84 |\n| 1.00 | 0.42 | -180.65 |\n| 1.25 | 0.39 | -239.65 |\n| 1.50 |\
    \ 0.35 | -309.89 |\n| 1.75 | 0.30 | -387.75 |\n| 2.00 | 0.26 | -470.92 |\n| 2.25\
