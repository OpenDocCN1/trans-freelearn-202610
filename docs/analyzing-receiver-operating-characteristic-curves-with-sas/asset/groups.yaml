- raw:
  - "[PAGE 134]\n\nModel fit is assessed by likelihood-based criteria such as Akaike’s\
    \ Information Criterion (AIC) or Bayes Information Criterion (BIC) in PROC NLMIXED,\
    \ which are reported under Fit Statistics. These are useful for model comparison.\
    \ Users of PROC MIXED, another procedure that used likelihood methods, will be\
    \ familiar with these criteria. In contrast, model fit in PROC GLM is usually\
    \ assessed by the omnibus F-test, which is a function of the sum of squares.\n\
    \nThe structure of the Parameter Estimates table is similar to the output of other\
    \ SAS/STAT programs. There is normally another column labeled Alpha in the output,\
    \ reporting the significance level used in the confidence intervals, which is\
    \ removed here to save space. An additional piece of information, the value of\
    \ the gradient at the final iteration, is also provided but is likely to benefit\
    \ only advanced users.\n\n# A.2 PROC NLMIXED and the Binormal Model\n\nIt may\
    \ be useful to understand how the PROC NLMIXED programs used in Chapters 3 and\
    \ 5 are developed. First, consider the model and code from Section 3.5:\n\n```\n\
