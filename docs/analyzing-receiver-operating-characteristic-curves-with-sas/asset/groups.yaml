  - '[PAGE 85]


    which, when substituted in $y = x^{\theta(u)}$, gives the age-adjusted ROC curve:


    $y = x^{1.288 - 0.014*AGE}$


    You can obtain a graphical representation by plotting the ROC curve for a few
    selected values of age (see Figure 6.4). Each ROC curve in Figure 6.4 is a plot
    of $y = x^{1.288 - 0.014*AGE}$ for a different age value. The lowest curve represents
    70-year-old patients and the highest curve represents 40-year-old patients. The
    curves in between represent varying levels of age in 5-year increments. As anticipated
    from the negative sign of $\beta_3$, the ROC curves get closer and closer to the
    diagonal line as age increases.


    # Figure 6.4 ROC Curves for Different Age Values


    ![](img/ac26020abd4f22abfaafc0607939c6e4_85_0.png)


    It is also possible to answer the question of whether a covariate adjustment is
    needed. Notice that when $\beta_3=0$, the adjusted and the unadjusted ROC curves
    coincide. Therefore, a test of $\beta_3=0$ is one way of answering whether you
    should report adjusted or unadjusted ROC curves. The $p$-value for this test is
    0.0426 (see Output 6.2); thus, based on this analysis, an age-adjusted ROC curve
    is appropriate.


    # 6.5 Using Estimating Equations to Handle Clustered Data


    All the methods described so far require individual data points to be independent
    of each other. This requirement is usually satisfied when a single observation
    is made for each individual unit. Here, an individual unit can be a patient awaiting
    a diagnosis, a debtor applying for a loan, or a calendar day for which a weather
    forecast will be issued.'
  - "[PAGE 86]\n\nAs was the case in the magnetic resonance example, sometimes more\
    \ than one observation may be obtained from an individual unit. In this case,\
    \ the research question centers on identifying abnormal vertebral marrow processes\
    \ and classifying them as normal or benign. The radiologist performing the magnetic\
    \ resonance imaging measures the signal at as many vertebrae as indicated based\
    \ on the image. Some patients may contribute a single measurement while others\
    \ will contribute several. When a patient contributes more than one observation\
    \ to the analysis, the resulting data set is said to be *clustered*. The term\
    \ is motivated by the observation that data coming from the same units behave\
    \ similarly and tend to cluster together.\n\nAn intuitive way to think about clustered\
    \ data is that the amount of information in two data points that are independent\
    \ is generally more than the amount of information in two data points that are\
    \ clustered. Clustering makes individual data points behave more like each other\
    \ than they would otherwise. The net result is often an increase in standard errors\
    \ (when compared with independence across data points), while point estimates\
    \ are usually not substantially affected.\n\nOne can think of clustered data examples\
    \ in other fields. A weather forecast for a given day is usually multi-dimensional:\
    \ Temperature, precipitation, and pressure may all be simultaneously forecast.\
    \ The forecasts within a given day will tend to be clustered because they are\
    \ all related to various aspects of the same underlying meteorological events.\n\
    \nClustered data do not always arise from multiple measurements on each observational\
    \ unit. There could be other reasons to suspect that a subset of the observations\
    \ behave like one another. For example, debtors in the same ZIP code may exhibit\
    \ similar behaviors of default. Parts manufactured by the same factory may exhibit\
    \ similar patterns of failure. All of these will have a bearing on the analysis\
    \ of ROC curves.\n\nAnalysis of clustered data is a statistical topic in itself.\
    \ An overview from a SAS user’s perspective can be found in *SAS for Mixed Models,\
    \ Second Edition* by Littell, et al. (2006) for continuous outcomes and *Categorical\
    \ Data Analysis Using the SAS System, Second Edition* by Stokes, Davis, and Koch\
    \ (2001).\n\nOne method of handling clustered data is based on generalized estimating\
    \ equations. This is a way of estimating the model parameters using a method that\
    \ is robust to departures from the assumption of the independence of data points.\
    \ This method has been very popular in analyzing correlated binary data, and it\
    \ has been extended to the case of censored data. It can be fit using the COVSANDWICH\
    \ option in PROC PHREG. The option is named after the sandwich estimator of the\
    \ covariance, which is one of the features of the estimators obtained by estimating\
    \ equations.\n\nIf we modify the call to PROC PHREG as follows, the model is fit\
    \ using estimating equations instead of the usual partial likelihood. The ID statement\
    \ defines the variable that identifies the clustering variable. Records sharing\
    \ the same ID value are clustered.\n\n```\nproc phreg data=tpm1.ph covsandwich(aggregate);\n\
    \    model signal=group/r1;\n    if group='Normal' then grp=0;\n    else if group='Benign'\
    \ then grp=1;\n    id name;\nrun;\n```"
  - '[PAGE 87]


    The format of the PHREG output is not altered with the use of the COVSANDWICH
    option. In particular we see that θ is estimated to be 1/1.427=0.701 (identical
    to Section 6.3), supporting the notion that there is very little effect, if any,
    of clustering on point estimates. Since θ̂ did not change, the estimate of the
    AUC remains the same at 0.588. The standard error of β̂, on the other hand, is
    now 0.144, up from 0.088, an increase of 63.5%, as indicated by the StdErrRatio
    column, the only addition to PROC PHREG output in the presence of the COVS option.
    See Output 6.3. This results in an increase in the standard error of θ̂ to 0.101
    and that of the AUC from 0.030 to 0.050.


    # Output 6.3


    | Analysis of Maximum Likelihood Estimates |

    | Parameter | DF | Parameter Estimate | Standard Error | StdErr Ratio | Chi-Square
    | Pr > ChiSq |

    | group benign | 1 | 0.35541 | 0.14413 | 1.635 | 6.0808 | 0.0137 |

    | Analysis of Maximum Likelihood Estimates |

    | Parameter | Hazard Ratio | 95% Hazard Ratio Confidence Limits | Variable Label
    |

    | group benign | 1.427 | 1.076 1.892 | group benign |


    Figure 6.5 adds to Figure 6.4 the confidence bands based on the estimating equations.
    The dotted lines both indicate 95% confidence intervals, one based on the standard
    error assuming independence (narrower bands) and one based on the estimating equations
    (wider bands). This figure is not intended to help you choose an estimation method.
    Whether you should use estimating equations depends on whether clustering can
    reasonably be expected based on the nature of the study.'
