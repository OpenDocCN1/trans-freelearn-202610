    ## Comparison and Covariate Adjustment of ROC Curves


    ## 4.1 Introduction


    In many instances there will be a set of competing predictions to choose from
    and hence it is often of interest to compare predictions. For example, how does
    an expensive invasive procedure or radiological scan compare with a simple clinical
    exam to diagnose a medical condition? Or, is it worth it to obtain at substantial
    cost detailed credit reports while one already has a simple financial summary
    of the debtors. Does the incremental increase in accuracy justify the additional
    cost? The term cost here is used loosely; for example, the additional burden on
    a patient of performing an additional diagnostic scan is considered a cost. Of
    course, there are traditional costs to consider, too: The monetary cost of obtaining
    the additional scan needs to be taken into account as well. Before deciding whether
    these costs are justified, you need to evaluate the gains in predictive accuracy.


    A common and simple way to compare competing predictors is to construct an ROC
    curve for each one. Visual comparisons of these ROC curves usually reveal several
    useful features. In addition, two ROC curves can be compared for statistically
    significant differences. This chapter discusses non-parametric and parametric
    methods of statistically comparing two or more ROC curves.


    ## 4.2 An Example from Prostate Cancer Prognosis


    Chapter 3 used an example from cancer diagnosis and monitoring to introduce ROC
    curves. This chapter uses an example from cancer prognosis to study the methods
    of comparing two ROC curves. This time, the data are obtained on prostate cancer
    patients with bone metastases. Traditionally, these patients undergo a bone scan,
    a radiographic exam that reveals the abnormalities in the bone. You can compute
    a summary measure, called a bone scan index (BSI), which indicates the extent
    of bone disease in patients. A competing marker is the SUV from a PET scan that
    was used in Chapter 3 to identify head and neck cancer. The prostate data set
    contains measurements of BSI and SUV for 51 patients. The outcome of interest
    is one-year survival—that is, whether patients are alive one year after their
    BSI and SUV are measured. Each patient was followed at least one year and the
    outcome recorded. Forty patients were dead, and 11 were alive at the one-year
    mark.


    This example is used throughout the chapter to compare the ROC curve of SUV with
    the ROC curve of BSI. But before further discussion, we need to distinguish between
    paired and unpaired mechanisms of data collection, an important issue associated
    with most data sets involving ROC curve comparisons.


    ## 4.3 Paired versus Unpaired Comparisons


    When dealing with any statistical comparison, you need to distinguish unpaired
    and paired data. Here, unpaired refers to when data in the two groups to be compared
    are obtained from different sampling units and paired refers to when each sampling
    unit contributed exactly a pair of observations: one to each group.


    Consider the example of a randomized clinical trial that evaluates screening mammography.
    Women are randomized to either the standard of care, which is periodic clinical
    exams, or to mammography, which is mammography in addition to the standard of
    care. The resulting comparison, whether performed using ROC curves or not, is
    unpaired. Each woman in the study is either in one study arm or the other.


    Now, consider another study that evaluates PET in imaging tumors before surgery.
    Suppose that there is a standard imaging tool for this purpose, likely computed
    tomography (CT) for most cases. One possibility is randomizing the patients to
    receive either a CT or a PET, creating an unpaired comparison. However, a statistically
    more efficient way of comparing the two is arranging for the patients to undergo
    both scans, creating a paired data situation.


    In traditional statistics, most comparisons involve unpaired data as opposed to
    paired data. For example, the two-sample (unpaired) t-test is probably the most
    widely applied statistical test. The reason for this is not increased efficiency.
    In fact, for a fixed sample size, paired techniques are usually more powerful
    than unpaired ones. It is, however, more difficult, or sometimes impossible, to
    implement a paired design. Randomized trials of many drugs and interventions use
    unpaired designs because exposing the subject to multiple treatments or interventions
    is often difficult, if not impossible. Imagine a trial comparing surgical treatment
    against watchful waiting,


    a common option, for early stage indolent tumors such as some cancers of the prostate.
    It is not possible for patients to undergo both treatments.


    Paired comparisons have made their mark as the design of choice in some fields,
    including comparison of predictive markers. Many of the markers under consideration
    can be applied to each sampling unit without too much burden, cost, or undue consequence.
    Thus, this chapter focuses on comparing ROC curves with paired data, although
    references to unpaired comparisons will be noted.


    ## 4.4 Comparing the Areas under the Empirical ROC Curves


    In addition to the distinction between paired and unpaired data, you also need
    to decide what comparing the ROC curves means. It could refer to comparing the
    curves in their entirety, or it could refer to comparing certain summary measures,
    such as the area under the curves.


    When dealing with empirical ROC curves, the usual choice is comparing the summary
    measures. The alternative, comparing entire curves, is a difficult task without
    the help of a model. The caveat, of course, is that two predictors may have the
    same AUC but very different ROC curves. For this reason, a graphical display of
    the ROC curves under comparison should always accompany the statistical test comparing
    the AUCs.


    ### 4.4.1 Comparisons with Paired Data


    You can organize the paired data in two ways. The most intuitive way is to have
    one row for each subject and one column for each marker in addition to a column
    for the outcome. An equivalent way is to have one row for each subject-marker
    combination, resulting in two rows per subject. The outcome variable will be duplicated
    in these two rows and an additional column containing the subject identifier will
    be added to keep track of the pairing. These two data structures are known as
    wide and long, respectively, with obvious reference to the shape of the data matrix.
    One can be converted to the other with simple DATA step instructions.


    The %ROC macro that was used in Chapter 3 to obtain estimates of the standard
    error of the AUC can also be used to compare two ROC curves only if the data are
    paired. The methodology implemented in this macro is essentially non-parametric.
    Each AUC is estimated using the concordance method described in the previous chapter.
    The concordance statistic is a member of the class of U-statistics. The variance
    of the AUCs as well as the covariance between them can be computed using the general
    principles of the theory of U-statistics. See DeLong et al. (1988) for more information.


    The %ROC macro expects the data in the wide form. The following macro call performs
    the needed comparison:


    ```

    %roc(data=bone, var=bsi suv1, response=gold, contrast=1 -1);

    ```


    The VAR macro variable specifies the names of the variables containing the two
    marker values. The CONTRAST macro variable expects input similar to the CONTRAST
    statement in PROC GLM, so 1 -1 refers to the difference of the two variables stated
    in the VAR macro variable.

