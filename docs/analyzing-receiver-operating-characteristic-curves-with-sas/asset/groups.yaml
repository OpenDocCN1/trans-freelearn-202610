    \ (76.74%, 99.01%)。\n\n与之相比，精确置信限基于二项分布，在小样本和/或罕见事件时覆盖率更好。因为在指定了 BINOMIAL 选项时默认会计算精确置信限，因此无需使用渐近置信限。灵敏度的精确\
    \ 95% 置信区间为 (71.80%, 96.60%)。渐近区间与精确区间之间的差异突出了中等样本量的典型效应。\n\n最后，输出的最后一部分提供了灵敏度是否等于\
    \ 80% 的检验。PROC FREQ 输出中报告的 z 统计量通过 z = p / ASE(null) 计算，其中 ASE(null) 表示在原假设下的\
    \ ASE。这是一种常见的计算检验统计量的方法，有时称为 Wald 检验。我们假设下的 ASE(null) 为 6.96%，对应的 z 值为 1.13。在大样本中，在原假设下\
    \ z 服从正态分布，因此可以通过查标准正态表获得 p 值。这得到双侧 p 值为 0.26，提示霜冻预报的灵敏度与 80% 无差异。\n\n一般而言，置信区间和假设检验在渐近标准误的计算上存在重要差异。5.68%\
