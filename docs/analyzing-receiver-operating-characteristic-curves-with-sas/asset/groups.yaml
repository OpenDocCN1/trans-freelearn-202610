    \ 9.1 节提供的解析关系计算的。经验估计与 Lehmann 估计的接近程度表明 Lehmann 模型对数据拟合良好。\n\n## 6.4 调整协变量\n\
    \n正如我们在第 4 章中看到的，协变量可能会影响标记的准确性，ROC 曲线可能需要相应调整。将第 5 章研究的回归模型扩展到 Cox 回归的背景下很容易，如下所示：\n\
    \nh(V | D, U) = \\tilde{h}(v) exp{β₁ D + β₂ U + β₃ D U}\n\n这为 Lehmann ROC 曲线提供了基于回归的协变量调整。这种构造在包含金标准\
    \ D 与协变量 U 之间的交互作用方面是相似的。为了了解协变量调整的 ROC 曲线的形式，考虑一个 D=1 的观测与一个 D=0 的观测的风险函数之比：\n\
    \nh(V | U, D = 1) / h(V | U, D = 0) = exp{β₁ + β₃ U}\n\n"
