  - "[PAGE 38]\n\n```\nproc nlmixed data=HeadNeck;\n    parameters m1=0 m0=0 s1=1\
    \ s0=1;\n    if gold=1 then m=m1;else if gold=0 then m=m0;\n    if gold=1 then\
    \ s=s1**2;else if gold=0 then s=s0**2;\n    a=(m1-m0)/s1;\n    b=s0/s1;\n    model\
    \ suv ~ normal(m,s);\n    estimate 'a' a;\n    estimate 'b' b;\n    estimate 'AUC'\
    \ probnorm(a/sqrt(1+b**2)));\nrun;\n```\n\nTo adopt this code for your data set,\
    \ replace the variables Gold and SUV with the variable names for the gold standard\
    \ and the marker. The relevant portion of the NLMIXED output from this execution\
    \ appears under Additional Estimates in Output 3.4.\n\n# Output 3.4\n\n| Additional\
    \ Estimates |\n| Label | Estimate | Standard Error | DF | t Value | Pr > |t| |\
    \ Alpha | Lower | Upper |\n| a | 1.4086 | 0.1830 | 181 | 7.70 | <.0001 | 0.05\
    \ | 1.0476 | 1.7696 |\n| b | 0.6597 | 0.07196 | 181 | 9.17 | <.0001 | 0.05 | 0.5177\
    \ | 0.8017 |\n| AUC | 0.8802 | 0.02727 | 181 | 32.27 | <.0001 | 0.05 | 0.8263\
    \ | 0.9340 |\n\nYou can see that the binormal parameters a and b are estimated\
    \ to be 1.4086 and 0.6597. The corresponding ROC curve is represented by Φ(1.41\
    \ + 0.66 Φ⁻¹(x)), where x takes on values from 0 to 1. That the ROC curve is defined\
    \ for all points between 0 and 1 is a feature of the model. Although not all thresholds\
    \ are observed, the binormal model interpolates and makes available a value of\
    \ sensitivity for all possible values of one minus specificity.\n\nThe resulting\
    \ AUC is 0.8802, with a standard error of 0.02727. You can form a 95% confidence\
    \ interval using standard asymptotics: AUC±1.96*se(AUC), which turns out to be\
    \ (0.826, 0.934). Table 3.3 compares the results from the binormal model with\
    \ those from the empirical analyses. Both the AUC estimates and the confidence\
    \ intervals are very close to each other.\n\n# Table 3.3 Comparison of AUC Estimates\
    \ from the Empirical and Binormal ROC Curves\n\n| Method | AUC | SE | Confidence\
    \ Interval |\n| Empirical | 0.8713 | 0.0263 | 0.820–0.923 |\n| Binormal | 0.8802\
    \ | 0.0273 | 0.826–0.934 |\n\nFrom the standpoint of ROC curve analyses, the ESTIMATE\
    \ statement is an important strength of PROC NLMIXED because it allows you to\
    \ directly obtain estimates and, perhaps more importantly, standard errors for\
    \ a, b, and AUC. Another advantage that will be apparent in subsequent chapters\
    \ is that it is flexible enough to accommodate several different types of ROC\
    \ curves."
  - "[PAGE 39]\n\nThe following is a graphical comparison of the empirical curve (solid\
    \ line) and the binormal curve (dotted line) using the PET data set example. Early\
    \ on, the binormal ROC curve is above the empirical one, suggesting that sensitivity\
    \ is overestimated when compared with the empirical values. Later, the curves\
    \ cross and the binormal curve starts to underestimate sensitivity. Most of the\
    \ time the difference between the two curves is less than 10%. For most purposes,\
    \ this would be considered a reasonable-fitting binormal ROC curve. Figure 3.6\
    \ shows a graph comparing the two different curves.\n\n# Figure 3.6 Comparison\
    \ of Empirical and Binormal ROC Curves\n\n![](img/ac26020abd4f22abfaafc0607939c6e4_39_0.png)\n\
    \nFigure 3.6 is generated by the following SAS statements. The key idea is in\
    \ the DATA step, where the data set produced by the OUTROC= option in PROC LOGISTIC\
    \ (called ROCData here) generates the sensitivities from the binormal model. ROCData\
    \ already contains the sensitivity and one minus specificity pairs for the empirical\
    \ curve. Another variable, called _BSENSIT_ here, is added using the functional\
    \ form of the binormal model along with the parameters estimated with PROC NLMIXED\
    \ (described previously). Then _BSENSIT_ and _SENSIT_ are plotted against _1MSPEC_,\
    \ overlaid on the same graph. The solid line is the empirical curve (_SENSIT_)\
    \ and the dotted line is the binormal curve (_BSENSIT_).\n\n```\ndata ROCData;\n\
    \    set ROCData;\n    _bsensit_=probnorm(1.41+0.66*probit(_1mspec_));\nrun;\n\
    ```\n\n```\naxis1 length=12cm order=0 to 1 by 0.2 label=(f=swissb h=2)\n    value=(font=swissb\
    \ h=2);\naxis2 length=12cm order=0 to 1 by 0.2 label=(a=90 f=swissb h=2)\n   \
    \ value=(font=swissb h=2);\n```\n\n```\nsymbol1 v=none i=join w=3 l=1 c=black;\n\
    symbol2 v=none i=join w=3 l=3 c=black;\n```"
  - "[PAGE 40]\n\n```\nproc gplot data=ROCData;\n    plot (_sensit_ _bsensit_)*_1mspec_\
    \ / haxis=axis1 vaxis=axis2\n        overlay;\nrun;\nquit;\n```\n\n# 3.7 Transformations\
    \ to Binormality\n\nThe assumption of normality plays a crucial role in the binormal\
    \ model. Statisticians who are familiar with the theory of t-tests and analysis\
    \ of variance may dismiss this importance because of the widespread notion that\
    \ large sample sizes overcome the effects of non-normality. This is generally\
    \ true for procedures that compare the means of several groups (such as the t-test\
    \ or the F-test), primarily because the sample means can be approximated by a\
    \ normal distribution in large samples even if the individual observations are\
    \ markedly non-normal.\n\nIn contrast, the ROC curve does not simply compare the\
    \ means of diseased and non-diseased populations. In fact, as Section 3.3 shows,\
    \ the ROC curve can be represented as G(F⁻¹(x)), where x is one minus the specificity,\
    \ G(.) is the cumulative density of the predictor in the diseased group, and F(.)\
    \ is the cumulative density in the non-diseased group. Therefore, accurate estimation\
    \ of the ROC curve requires accurate estimation of all points on F and G. The\
    \ binormal model assumes F and G to be the cumulative density function of the\
    \ normal distribution, and the parameters of these two normal distributions are\
    \ estimated from the data. If the data are markedly non-normal, estimates of F\
    \ and G can be severely inaccurate at several points. This is not easily remedied\
    \ by assembling larger samples.\n\nFor this reason, using the binormal model raises\
    \ the question of whether the data are indeed normal and whether departures from\
    \ normality can be fixed with a monotone transformation. Based on Section 3.3,\
    \ you might think that all ROC curves are invariant. This is certainly not the\
    \ case. All parametric ROC curves, and the binormal model in particular, are not\
    \ invariant to monotone transformations.\n\nNormalizing transformations is of\
    \ great interest in least squares regression and analysis of variance, so there\
    \ is a vast amount of literature about it. One of the most popular transformation\
    \ methods is the standard Box-Cox power family implemented in PROC TRANSREG.\n\
    \nThe Box-Cox power family of transformations can be defined as\n\ny^{(λ)} = {\
    \ (y^λ - 1)/λ   λ > 0\n            log(y)       λ = 0 }\n\nEach value of λ defines\
    \ a transformation. For example, λ=1 uses the original values and λ=0 corresponds\
    \ to a log-transform. This definition assumes y is non-negative to start with;\
    \ if this is not the case, a constant can be added to shift the values. The idea\
    \ is to choose λ based on the observed data. PROC TRANSREG uses a maximum likelihood\
    \ estimate of λ along with the associated confidence interval. Because the choice\
    \ of λ depends on the data, the recommendation is to round the resulting estimates\
    \ to the nearest quarter so long as they are in the associated confidence interval.\n\
    \nThis representation does not take into account the gold standard. The marker\
    \ distributions that need normalization are the conditional ones (conditional\
    \ on the gold standard, F and G in the foregoing notation). In contrast, the Box-Cox\
    \ family attempts to normalize the marginal"
  - "[PAGE 41]\n\ndistribution of the marker values. You can redefine the family so\
    \ that it normalizes the conditional distributions. The easiest way of doing so\
    \ is recognizing that an analysis of variance model with the marker as the outcome\
    \ and the gold standard as the covariate is one way of modeling the desired conditional\
    \ distributions. For more information, see Sakia (1992).\n\nIn the PET example,\
    \ you can estimate λ using the following call to PROC TRANSREG. The left-hand\
    \ side of the model includes the marker value to be transformed and the right-hand\
    \ side includes the gold standard, as explained previously, to ensure that conditional\
    \ distributions are normalized. The PARAMETER= option specifies a constant to\
    \ be added to all observations before λ is estimated. Because some SUVs are 0,\
    \ an arbitrarily chosen small number (0.1) is added.\n\n```\nproc transreg data=HeadNeck;\n\
    \    model boxcox(suv/parameter=0.1) = class(gold);\nrun;\n```\n\nOutput 3.5 shows\
    \ the results. The primary output is the (log) likelihood values for each λ. As\
    \ explained in the legend, a less-than symbol (<) points to the best λ (that is,\
    \ the one that maximizes the likelihood). Observations marked with an asterisk\
    \ (*) form a confidence interval, and a plus sign (+) is a convenient choice for\
    \ λ. According to the criteria for being convenient, the number must be round\
    \ and contained in the confidence interval. In this example, λ=0.5 is identified\
    \ as the best choice, implying a square root transformation.\n\n# Output 3.5\n\
    \nThe TRANSREG Procedure\n\nTransformation Information\nfor BoxCox(suv)\n\nLambda\
    \    R-Square    Log Like\n-3.00     0.25        -1135.75\n-2.75     0.25    \
    \    -1032.16\n-2.50     0.25        -930.05\n-2.25     0.25        -829.71\n\
    -2.00     0.25        -731.55\n-1.75     0.25        -636.09\n-1.50     0.26 \
    \       -544.03\n-1.25     0.26        -456.31\n-1.00     0.26        -374.17\n\
    -0.75     0.27        -299.21\n-0.50     0.28        -233.40\n-0.25     0.31 \
    \       -179.12\n0.00      0.34        -139.18\n0.25      0.38        -116.98\
    \ *\n0.50 +    0.42        -115.97 <\n0.75      0.43        -137.84\n1.00    \
    \  0.42        -180.65\n1.25      0.39        -239.65\n1.50      0.35        -309.89\n\
    1.75      0.30        -387.75\n2.00      0.26        -470.92\n2.25      0.23 \
    \       -558.00\n2.50      0.20        -648.08\n2.75      0.17        -740.57\n\
    3.00      0.14        -835.03\n\n< - Best Lambda\n* - Confidence Interval\n+ -\
    \ Convenient Lambda"
