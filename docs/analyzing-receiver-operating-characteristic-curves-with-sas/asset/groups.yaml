    \ surveyselect data=HeadNeck method=urs n=181 out=_sample outhits rep=100 noprint;\n\
    run;\n```\n\nThis call to PROC SURVEYSELECT generates 100 samples (as specified\
    \ with the REP= option) and each sample has 181 elements (as specified by the\
    \ N= option). In general, each bootstrap sample has the same size as the original\
    \ data set, so the N= option typically equals the sample size. METHOD=URS allows\
    \ unrestricted random sampling and corresponds to a sampling schema that gives\
    \ equal probability to each record in the data set and performs the sampling with\
    \ replacement. The OUT= option specifies the data set in which the bootstrap samples\
    \ are saved. Finally, the OUTHITS= option ensures that a record that was selected\
    \ more than once (which is\n\npossible in sampling with replacement) appears as\
    \ many times as it was selected in the output data set. The default (when the\
    \ OUTHITS= option is not specified) represents that record with a single observation,\
    \ along with a variable that indicates the number of hits (i.e., the number of\
    \ times it was selected).\n\nAn important feature of the data set created by PROC\
    \ SURVEYSELECT is that it contains a variable called Replicate that identifies\
    \ the bootstrap sample. Because bootstrap samples are analyzed separately, you\
    \ can use the BY processing available in most SAS/STAT procedures. For example,\
    \ to compute the AUC for each bootstrap sample, you can call PROC LOGISTIC using\
    \ a BY REPLICATE statement and create an output data set using the ODS OUTPUT\
    \ statement. This output data set will also include the REPLICATE column along\
    \ with the AUC index computed for each bootstrap sample. Therefore, developing\
    \ SAS code for the bootstrap method has become substantially easier with PROC\
    \ SURVEYSELECT. In addition, because BY processing is much faster than competing\
    \ ways of performing the same task, such as using macro loops, this strategy leads\
    \ to computationally efficient programs. This feature is critical because bootstrap\
    \ methods can require intensive computer resources.\n"
