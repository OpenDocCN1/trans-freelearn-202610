  \n9 781785 883781\n\n## 学习响应式数据可视化\n\n![](img/72559bd4713b2b89631dcca187d7e2db_263_0.png)\n\
  \n使用 D3.js 和响应式设计原则，您不仅能够实现在所有设备和屏幕分辨率下看起来和感觉都很棒的可视化，还能通过使用 Bootstrap（开发响应式 Web\
