- pgno: 215
  md: '# # Semi-automated visual Regression tests


    Unfortunately, there are no common strategies for visual regression testing due
    to the ambiguity and customizability of the tests and the results. To establish
    a great workflow that uses Github and TravisCI it requires a bit of manual scripting
    and tuning.


    If you want to include it in your workflow, I recommend looking into PhantomCSS
    and BackstopJS (an abstraction on top of Phantom). These tools can be easily integrated
    into your testing strategy to create regression images from your previous version
    of the visualization.


    # # Automated testing and Continuous Integration


    As we saw previously, there are many cases where we can and should run tests for
    responsive visualizations. In any case where we can write automated tests, we
    prefer automated tests over manual tests. The reason we prefer automated tests
    is easy: to make them repeatable.


    Once we have automated tests, we can run them every time a change is pushed to
    the repository. If they are fast enough, we can even run them every time we make
    changes to the local source files. This gives immediate feedback about the functionality
    of the code, and fast feedback. Debugging is easier, identifying and finding bugs,
    which automatically makes you more productive and development more effective.


    # # Running tests on your local machine


    Finally, we can start to write some tests and run them automatically. We will
    start with unit tests and speak about integration tests afterward.


    # # Running unit tests using Karma


    As a first tool to write and run unit tests, we need a tool that can collect all
    the tests, set up the testing environment, and start the tests in a web browser
    instance. These are the tasks of the so-called test runner. In this book, we will
    use the Karma test runner, which was developed by the Angular team.


    Karma is very easy to configure and use, and it integrates nicely into your Gulp
    and Grunt build configurations. It can be installed via the following command:


    ```

    npm install karma --save-dev

    ```'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'This command also adds Karma to the current development dependencies. Once
    Karma is installed, you can set up a configuration using this command:


    ```

