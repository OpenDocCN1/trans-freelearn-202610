- pgno: 194
  md: "Great, let's load the map and the data and then draw the map. To do so, we\
    \ will use the TopoJSON format of the US map provided by Mike Bostock at https://gist.github.com/mbostock/4090848:\n\
    \n```\nqueue()\n.defer(d3.json, \"data/us.json\")\n.defer(d3.json, \"data/earthquakes.json\"\
    )\n.await(ready);\n```\n\nOnce the resources are available, the ready function\
    \ gets called. Let's implement it:\n\n```\nfunction ready(error, us, earthquakes)\
    \ {\n  if (error) throw error;\n\n  svg.append(\"g\")\n    .attr(\"class\", \"\
    counties\")\n    .selectAll(\"path\")\n    .data(topojson.feature(us, us.objects.counties).features)\n\
    \    .enter().append(\"path\")\n    .attr(\"d\", path);\n\n  svg.append(\"path\"\
    )\n    .datum(topojson.mesh(us, us.objects.states))\n    .attr(\"class\", \"states\"\
    )\n    .attr(\"d\", path);\n}\n```\n\nIn the preceding code, all the data of the\
    \ deferred functions gets passed as arguments in the order of calling the functions.\
    \ The US map is stored in TopoJSON format. Therefore, we need to transform it\
    \ back to valid GeoJSON. We do this using either the topojson.feature() or topojson.mesh()\
    \ function. First, we will draw a path for every county in the us.objects.counties\
    \ collection. Next, we will draw one single mesh for all states in the us.objects.states\
    \ collection.\n\nFinally, we are only missing the dots; let's draw them:\n\n```\n\
    svg.append(\"g\")\n  .attr(\"class\", \"data\")\n  .selectAll('circle')\n  .data(earthquakes.features)\n\
    \  .enter().append('circle')\n  .attr('r', function(d) {\n    return Math.abs(d.properties.mag);\n\
    \  })\n  .attr('fill', function(d) {\n    return color(Math.abs(d.properties.mag));\n\
    \  });\n```"
