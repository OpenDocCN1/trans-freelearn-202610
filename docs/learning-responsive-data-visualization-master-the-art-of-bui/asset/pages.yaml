- pgno: 91
  md: '# Parsing and formatting numeric values


    We will not only have to deal with date and time strings but also with numeric
    values. In the case of integer and float values, we can use native functions to
    parse strings and D3 number formatters for formatting and styling them.


    Integers and floats can be parsed easily by the `parseInt()` and `parseFloat()`
    functions. However, sometimes it is convenient to use the short `+` notation to
    cast strings to numeric values.


    ```

    // Parsing strings to numbers

    var i = parseInt("5.0", 10);

    var f = parseFloat("3.8");

    ```


    ```

    // Short notation

    var s = "932.2";

    var j = +s;

    ```


    In the preceding code, we see that it''s very convenient to use the native functions
    and the short `+` notation for converting strings into numbers. We also observe
    that, most of the time, we will use the basis 10 in the `parseInt` function.


    Formatting number values into strings in D3 is very similar to formatting date
    values into strings. However, D3 can only format numbers into strings; for string
    to number conversion, you can use the native functions that we just discussed.
    Again, we need to first create a formatter using the `d3.format(specifier)` function;
    then, we can use the formatter as a function to format numbers. Let''s take a
    look at an example:


    ```

    // Create a formatter

    var formatter = d3.format(''.2f'');

    ```


    ```

    // Format a number object to a string

    formatter(3.12e-1);

    // "0.31"

    ```


    The specifier argument again defines the structure of the formatted string values
    that we want to generate. This can be composed in the following form:


    ```

    [fill]align] [sign] [symbol] [0] [width] [, ] [.precision] [type]

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Each of these options allows you to customize different properties of the generated
    string. Here, I just want to provide a list of all possible type specifiers, which
    is also taken from my previous book Data Visualization with D3 and AngularJS by
    Packt Publishing:


    +   - e: exponent

    +   - g: general

    +   - f: fixed

    +   - d: Integer

    +   - r: Rounded to precision if specified

    +   - %: Percentage

    +   - p: Percentage rounded to precision if specified

    +   - b: Binary

    +   - o: Octal

    +   - x: Hexadecimal

    +   - X: Hexadecimal with upper case letters

    +   - c: Unicode character

    +   - s: SI-suffixed and rounded


    Let''s take a look at some selected examples using different type specifiers:


    ```

    console.log(d3.format(''e'')(0.3123)); // "3.123e-1"

    console.log(d3.format(''g'')(31.223e3)); // "31223"

    console.log(d3.format(''f'')(31.23)); // "31"

    console.log(d3.format(''d'')(124)); // "124"

    console.log(d3.format('''')(0.23)); // "23%"

    console.log(d3.format(''p'')(0.2314)); // "23.14%"

    console.log(d3.format(''b'')(23)); // "10111"

    console.log(d3.format(''s'')(31.223e3)); // "31.223k"

    ```


    > You can find more information about number specifiers on the D3 Github page
    at https://github.com/mbostock/d3/wiki/Formatting.'
