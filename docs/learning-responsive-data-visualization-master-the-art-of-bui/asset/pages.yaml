- pgno: 76
  md: '# Loading, Filtering, and Grouping Data


    In the previous chapter, you learned to draw a simple bar chart. In this chapter,
    you will learn to load, parse, and display real data from a remote location with
    this chart. In this chapter, you will learn the following:


    +   - Why we need to preprocess our data

    +   - How to filter outliers

    +   - How to map data to another representation

    +   - How to aggregate information

    +   - How to load data using D3

    +   - How to parse strings using Regular Expressions

    +   - How to parse date strings

    +   - How to format numbers

    +   - How to group flat data


    First, we will start with some basic preprocessing steps that are always necessary.
    We will use the `filter` function to filter outliers and unexpected values from
    the dataset; we will also use the map function to access inner properties of array
    elements.


    Then, you will learn about reduce functions and how they can help in aggregating
    and extracting information out of the data. We will implement our own simple reduce
    function and also take a look at the ones provided within D3.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Next, you will learn how to load data from remote locations. Spoiler alert,
    this will be very easy with D3. However, we need to make sure that the loaded
    data can be understood by JavaScript, and therefore, we sometimes need to parse
    the files. You will learn to use Regular Expressions to split strings into chunks,
    which can be accessed as arrays via JavaScript.


    We will then take a look at parsing and formatting date, time and numeric values.
    This is very important because, when we deal with dates in text files, they are
    always represented as strings rather than JavaScript objects.


    In the last section, you will learn about grouping flat data structures, such
    as CSV, that contain hierarchical information to nested JavaScript objects. Together,
    with the previous section, we will be able to extract any information that we
    want out of a dataset and plot it in a chart.


    # Preprocessing data


    In this chapter, you will learn about preprocessing and that it is an important
    step when you deal with real-world data. If we want to design a robust visualization
    that can handle different remote data sources, we need to make sure we process
    the data beforehand. Datasets can have outliers, can be noisy, can have different
    representations, can have nested objects, can be flat, and so on. You can see
    that this list is very long.


    Thus, whenever we deal with real data, we need to process it before using it in
    a visualization; this step is called preprocessing.


    # Filtering data to remove outliers


    As a first preprocessing step, we will look at filters. Filters are array operators
    that return an array containing a subset of the original elements. In the following
    figure, we see an example of such an operation:


    ![](img/72559bd4713b2b89631dcca187d7e2db_77_0.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: "Let's try an example. We load the following array from a remote data source:\n\
    \n```\nvar data = [\n {x: 1, y: 6},\n {x: 2, y: undefined},\n {x: 3, y: 4},\n\
    \ {x: 4, y: 2},\n {x: undefined, y: 3},\n {x: 5, y: 3},\n {x: 6, y: 7},\n ];\n\
    ```\n\nWe see that the preceding dataset contains some values that are undefined.\
    \ Whenever we work with real data, we should expect that some data values are\
    \ not defined or properly formatted. If we want to remove these values from our\
    \ array, we can use the array.filter(filterFn) operator. The filter function called\
    \ filterFn will be evaluated for each element in the dataset and needs to return\
    \ either true or false. Here, false means that the element will not appear in\
    \ the returned array. Let's write a filter function that returns only valid objects:\n\
    \n```\nvar filtered = data.filter(function(d, i){\n if (d.x !== undefined && d.y\
    \ !== undefined) {\n return true;\n }\n return false;\n});\n```\n\nIn the previous\
    \ code, we see a typical filter function, which returns true if d.x and d.y are\
    \ defined and false otherwise. However, we can write this more elegantly and simply\
    \ return the if expression:\n\n```\nvar filtered = data.filter(function(d, i){\n\
    \ return d.x !== undefined && d.y !== undefined;\n});\n```\n\n> Be careful with\
    \ implicit type coercions when dealing with numerical values. If you write d.x\
    \ && d.y instead, you will implicitly cast the numbers to Boolean values. And\
    \ guess what kind of Boolean you'll get when you cast a numerical 0. Well, you\
    \ get false."
  merge: -1
  img_proc: true
- pgno: 79
  md: "This looks much shorter and cleaner, great! Now, we can also create a filter\
    \ that only returns the data points that have a y value greater than a certain\
    \ number, as we can see in the following example:\n\n```\nvar filtered = data.filter(function(d,\
    \ i) {\n  return d.y > 5;\n});\n```\n\n# Mapping data to access inner properties\n\
    \nIt happens very often that the values that you want to visualize are somehow\
    \ nested and hidden inside the array objects. You can easily access this data\
    \ by mapping the whole array to a different array representation. This mapping\
    \ operation is visualized in the following figure:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_79_0.png)\n\
    \nMapping of one dataset to a different representation\n\nLet's take a look at\
    \ an example dataset where we would like to extract the number of counts from\
    \ the data points:\n\n```\nvar data = [\n  {x: 1, inner: {count: 5}},\n  {x: 2,\
    \ inner: {count: 4}},\n  {x: 3, inner: {count: 1}},\n  {x: 4, inner: {count: 8}},\n\
    \  {x: 5, inner: {count: 3}},\n  {x: 6, inner: {count: 5}}\n];\n```"
  merge: -1
  img_proc: true
- pgno: 80
  md: "We see in the preceding dataset that the information is nested in the count\
    \ property of the inner object. We can use the array.map(mapFn) method with a\
    \ mapping function called mapFn to return elements for each element of the new\
    \ array representation:\n\n```\nvar mapped = data.map(function(d, i){\n return\
    \ {\n x: d.x, y: d.inner.count\n }\n });\n```\n\nThe mapped array now contains\
    \ objects with the x and y properties that you can use to generate our visualizations,\
    \ as you learned in the previous chapter. Although, this looks very trivial, many\
    \ people have problems applying the map function properly.\n\n# Aggregate data\
    \ to extract valuable information\n\nAnother important preprocessing step in data\
    \ visualization is aggregating values of the dataset. The general idea is that\
    \ of a reduce function. In the following figure, we can see the schematics of\
    \ a reduce function; it is an array operation that returns one single value for\
    \ multiple elements.\n\n![](img/72559bd4713b2b89631dcca187d7e2db_80_0.png)\n\n\
    Reducing a dataset to a value\n\nYou don't have to be a MapReduce expert to use\
    \ this function; most likely, you are already using many of these functions already\
    \ today. Just think about a function that returns the sum of all the elements\
    \ in an array or a function that returns the minimal or maximal value of an array\
    \ — these are all reduce functions."
  merge: -1
  img_proc: true
- pgno: 81
  md: "Reduce functions help us to aggregate values that we want to visualize. Let's\
    \ take a look at a simple example where we would like to display the number of\
    \ counts from an inner object:\n\n```\nvar data = [\n    {x: 1, inner: [5, 1,\
    \ 1]},\n    {x: 2, inner: [2, 1, 1]},\n    {x: 3, inner: [5, 3, 2]},\n    {x:\
    \ 4, inner: [3, 5, 4]},\n    {x: 5, inner: [4, 1, 2]},\n    {x: 6, inner: [5,\
    \ 3, 1]}\n];\n```\n\nIn the preceding dataset, we want to aggregate the values\
    \ of the inner property in order to visualize them; we want to use the sum of\
    \ the aggregation. We can now combine a map operation and array.reduce(reduceFn,\
    \ startValue) to transform the dataset to a nice representation. The reduction\
    \ reduceFn is a function that takes four arguments; previous, current, arr and\
    \ index, and it returns a value for the next element. We can also assign a startValue\
    \ to represent the previous attribute of the first element in the array. Let's\
    \ take a look at a very simple reduction function, a simple sum:\n\n```\nfunction\
    \ sum(a, b) {\n    return a + b;\n}\n```\n\nNow, we can use the reduce function\
    \ to sum up all the values in the inner property:\n\n```\nvar reduced = data.map(function(d,\
    \ i) {\n    return {\n        x: d.x, y: d.inner.reduce(sum, 0)\n    }\n});\n\
    ```\n\nAgain, the resulting array consists of objects with the x and y properties,\
    \ whereas the y property now contains a sum of all the inner values.\n\nWe can\
    \ also nest the map and reduce operations in order to aggregate some more nested\
    \ data. Let's take a look at an example of a nested dataset:\n\n```\nvar data\
    \ = [\n    {x: 1, inner: [{count: 5}, {count: 1}, {count: 1}, ...]},\n    {x:\
    \ 2, inner: [{count: 2}, {count: 1}, {count: 1}, ...]},\n    {x: 3, inner: [{count:\
    \ 5}, {count: 3}, {count: 2}, ...]},\n    {x: 4, inner: [{count: 3}, {count: 5},\
    \ {count: 4}, ...]},\n    {x: 5, inner: [{count: 4}, {count: 1}, {count: 2}, ...]},\n\
    \    {x: 6, inner: [{count: 5}, {count: 3}, {count: 1}, ...]}\n];\n```"
  merge: -1
  img_proc: true
- pgno: 82
  md: "Now, we need to map the `inner` values to an array which can then be used by\
    \ the reduce function:\n\n```\nvar reduced = data.map(function(d, i){\n    return\
    \ {\n        x: d.x, y: d.inner\n            .map(function(d){\n             \
    \   return d.count;\n            }).reduce(sum, 0)\n    }\n});\n```\n\nIn the\
    \ preceding code, we first use a map returning the elements of the count property;\
    \ then we apply the reduce function on the returned array. You can already see\
    \ that by nesting the preprocessing functions, we can aggregate and extract a\
    \ lot of data from the dataset.\n\n# # Reduce functions in D3.js\n\nAs you might\
    \ already wonder, D3 comes with a lot of handy reduce functions which can be applied\
    \ to arrays. However, using the d3 functions, you always have to pass the array\
    \ as an argument. In all d3 reduce functions, you can use the `accessor` function,\
    \ which is passed to a map operation before the reduce operation is done. This\
    \ works exactly as in the previous example.\n\nWe can extract the extrema of a\
    \ dataset with any of the following:\n\n+   - d3.min(arr, accessor),\n+   - d3.max(arr,\
    \ accessor)\n+   - d3.extent(arr, accessor)\n\nLet's take an example of the last\
    \ one:\n\n```\nvar data = [\n    {x: 1, inner: {count: 5}},\n    {x: 2, inner:\
    \ {count: 4}},\n    {x: 3, inner: {count: 1}},\n    {x: 4, inner: {count: 8}},\n\
    \    {x: 5, inner: {count: 3}},\n    {x: 6, inner: {count: 5}}\n];\nvar extent\
    \ = d3.extent(data, function(d, i){\n    return d.x;\n});\n```"
  merge: -1
  img_proc: true
- pgno: 83
  md: 'The extent function in the preceding code returns the array called [min, max]
    with the minimal and maximal x value of the dataset.


    To extract other statistical information from the dataset, we can use the following:


    +   • d3.mean(arr, accessor),

    +   • d3.median(arr, accessor),

    +   • d3.variance(arr, accessor)

    +   • d3.deviation(arr, accessor)


    > The filter, map, and reduce functions have their origin in functional programming
    as they work on an input array, transform it independently of a state or context,
    and output a new array at the end. A benefit of using a reduce function over a
    simple loop is that you execute your code inside a local scope, whereas in a loop
    you would be still in the same scope and maintain a state.

    > Talking about performances, the filter, map, and reduce functions are rarely
    faster than the alternative with a custom loop. This mainly depends on the JavaScript
    engine and how it optimizes these functions. However, as I said before, they allow
    the developer to write more beautiful and cleaner code, as they work in a separated
    scope independently of a state. If this interests you, you should definitely check
    out more about Functional Programming!


    # # Loading and parsing remote data


    In this section, we want to visualize real data rather as in sample dataset; hence,
    we need to understand how to load data from remote locations. In JavaScript, you
    can use the native XMLHttpRequest (XHR) object to fetch data within your application.
    D3 implements not only a wrapper for the native XHR call, but it also implements
    wrappers for loading different data types and parsing them automatically.


    Here is a list of some high-level wrappers in D3:


    +   • d3.text(url[, mimeType[, callback]]): This loads a plain text file with
    a mimeType from an URL; the data is handed over as a string to the callback where
    the parsing must be done manually

    +   • d3.json(url[, callback]): This loads and parses a JSON file from an URL;
    the data is passed as an object in the callback

    +   • d3.xml(url[, mimeType[, callback]]): Loads and parses an XML file from an
    URL, the data is passed as an object in the callback'
  merge: -1
  img_proc: true
- pgno: 84
  md: "+   - d3.html(url[, callback]): This loads and parses an HTML file from an\
    \ URL; the data is passed as an object in the callback\n+   - d3.csv(url[, accessor[,\
    \ callback]]): This loads and parses a CSV (comma-separated) file from an URL;\
    \ the data is passed as an object in the callback and can be automatically mapped\
    \ with an accessor function\n+   - d3.tsv(url[, accessor[, callback]]): This loads\
    \ and parses a TSV (tabulation-separated) file from an URL; the data is passed\
    \ as an object in the callback and can be automatically mapped with an accessor\
    \ function\n\nThe callback function is called when all data is loaded; the data\
    \ will be provided as an argument to the callback function.\n\n> If we try to\
    \ load data from the local machine, we will most likely get a **Cross Origin Request**\
    \ error. This is a security policy of modern browsers that prevents the loading\
    \ of local data into the browser. However, we can use a static fileserver, such\
    \ as the node package called `http-server` or the python command called `python\
    \ -m SimpleHTTPServer 8000`.\n> \n> If you don't want to span up a web server\
    \ to prevent this security issue, you can also disable this in the browser settings\
    \ or while startup:\n> * In Firefox, enter `about:config` in the address bar and\
    \ set `security.fileuri.strict_origin_policy` to `false`\n> * In Chrome and Chromium,\
    \ close all open instances and start a new session called `chrome.exe--allow-file-access-from-files`\
    \ or `chromium-browser --allow-file-access-from-files`\n\nWe can see that, with\
    \ the built-in data loading functions, it's very easy to load remote data with\
    \ D3. Let's take a look at an example; we will load a CSV file:\n\n```\n// data\
    \ source: Mike Bostock\nvar url = 'https://gist.githubusercontent.com/mbostock/32.../data.csv';\n\
    d3.csv(url, function(data) {\n    draw(data);\n});\n```\n\nIn the preceding code,\
    \ we use a draw function that contains the code for the bar chart that we developed\
    \ in the previous chapter. You can also look at the source code of all code examples\
    \ to see the full function."
