    # ## Parsing any string data


    Data visualizations often display data from multiple sources; therefore, we cannot
    guarantee that the datasets will always be in a CSV, TSV, or even JSON format.
    To load and parse raw data, for example, unformatted log data, we can use the
    `d3.text` function and parse the dataset on our own.


    Let''s look at a typical access log entry from a web server. It contains timestamps
    and user agents of the visitors of a website:


    ```

    66.249.64.129 - - [22/Nov/2014:01:56:01 +0100] "GET / HTTP/1.1" 302

    487 "-" "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.

    com/bot.html)"

    ```'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'There are some questions that come into one''s mind if he/she wants to plot
    the preceding data. How should one aggregate the data? Do we want to sum all visitors
    per minute, per hour, or per day, or do we just want to sum the visitors by browser
    or by country of origin? Once we''ve parsed the data into a readable format, we
    can easily do all of the preceding things (you will learn this in the last section
    of the chapter). However, we first need to parse the string into a format that
    JavaScript can use.


    # Splitting strings using Regular Expressions


    The first step in processing a string is always splitting it into smaller chunks
    of words. If the log entries have been created by a program, they usually have
    some kind of structure but very often a very strange one.


    If we take a closer look at the entries in the log file, we can see that single
    log entries are separated by a newline character called \n. Well, we actually
    don''t see the character, but we can see the line breaks only at the end of the
    complete log entry.


    We also observe that the - and " characters are some sort of separators between
    the logical parts of the entry. To split the string properly, we always have to
    find these separators. Now, we can use Regular Expressions and the string.split(expr)
    function to split the string into an array of smaller chunks. In the following
    figure, we can see this operation visualized:


    ![](img/72559bd4713b2b89631dcca187d7e2db_87_0.png)


    Let''s see this in action and split the log file into an array of log entries:


    ```

    var lines = data.split(/\n/g);

    ```'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Now, we can use the map function to access the inner elements of the line array
    and split them into logical chunks:


    ```

    var lines = data.split(/\n/g)

    .map(function(line) {

    return line.split(/[-"]/g);

    });

    ```


    In the preceding code, we use the two Regular Expressions called /\n/g and /[-
    "]/g. In the first one, we simply look for matches of the \n character, and in
    the second one, we look for either the - or " character. In both cases, we use
    the greedy flag to search the whole string rather than stopping at the first occurrence.


    > More information about Regular Expressions in JavaScript can be found on MDN
    at https://developer.mozilla.org/en/docs/Web/JavaScript/Reference/Global_Objects/RegExp.

    > Usually, it is very tricky to get Regular Expressions to work properly. I recommend
    using a tool such as https://regex101.com/ to evaluate your expression before
    you throw them into your code.


    The following figure visualizes how we are processing the string. The first split
    happens from the blue to the red layer. Then, we use map to split all of the elements
    from the red to the green layer. This all happens in the previous four lines of
    the code:


    ![](img/72559bd4713b2b89631dcca187d7e2db_88_0.png)


    Splitting nested strings into arrays'
  merge: -1
