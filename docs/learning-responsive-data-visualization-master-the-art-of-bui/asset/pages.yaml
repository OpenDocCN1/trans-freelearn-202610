    \ function() {\n  describe('#flatten()', function () {\n    it('should flatten\
    \ an nested array', function () {\n      var nestedArray = [['foo'], ['bar']];\n\
    \n      var computed = flatten(nestedArray);\n      var expected = ['foo', 'bar'];\n\
    \n      expect(computed).to.eql(expected);\n    });\n  });\n});\n```\n```\n\n\
    In the preceding code, we wrap all our tests for the component in the describe\
    \ block. Inside this block, we wrap all the tests for the flatten function in\
    \ the describe block. Finally, we write the first test to test against a standard\
    \ case.\n\nThere are many ways and assertion libraries to write good and expressive\
    \ tests; however, I find it very useful to reduce all the tests to the absolute\
    \ minimum. First, we start with an initialization phase for the nestedArray variable.\
    \ Next, we move to the transform state where we transform the input using the\
    \ function under test. I always store the output in the computed variable. Finally,\
    \ I declare the expected value using the expected variable. Then, I use either\
    \ expect(computed).to.eql(expected) or expect(computed).to.equal(expected). Here,\
