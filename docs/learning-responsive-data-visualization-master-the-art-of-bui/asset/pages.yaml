- pgno: 122
  md: '# # Summary


    In this chapter, you learned the essentials about absolute and relative units
    to define lengths in a browser. We remember that the rem unit plays an important
    role because it allows a layout to adapt when a user increases the font size of
    the website.


    Then, you learned about how to use relative units, viewports, and resize events
    to adapt the chart size and the data resolution according to the current container
    size.


    In the preceding section, you learned about using Bootstrap Media Queries in CSS,
    LESS, und JavaScript. Finally, we also saw how to integrate charts with Bootstrap''s
    grid system.


    In the next chapter, we will continue with implementing responsive charts and
    take a closer look at creating responsive interactions for all the types of devices
    and screen resolutions.'
