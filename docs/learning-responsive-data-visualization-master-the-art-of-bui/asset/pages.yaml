    \ class=\"row\">\n        <div class=\"col-lg-3 col-md-6 col-sm-12\"></div>\n\
    \        <div class=\"col-lg-3 col-md-6 col-sm-12\"></div>\n        <div class=\"\
    col-lg-3 col-md-6 col-sm-12\"></div>\n        <div class=\"col-lg-3 col-md-6 col-sm-12\"\
    ></div>\n```"
