- pgno: 72
  md: "Identical to the previous examples, the $svg variable again references the\
    \ Selection with the svg root element. Let’s create a container for the data and\
    \ axes:\n\n```\n```javascript\nvar $axesGroup = $svg.append('g').attr('class',\
    \ 'axis');\nvar $dataGroup = $svg.append('g').attr('class', 'data');\n```\n```\n\
    \nNow, we look back at our dataset and define an accessor function for the x values\
    \ called xKey and the y values called yKey. These functions will become useful\
    \ when we need to access these values in the dataset:\n\n```\n```javascript\n\
    var xKey = function(d){ return d.label; };\nvar yKey = function(d){ return d.y;\
    \ };\n```\n```\n\nWith these two functions, we can easily map the dataset to an\
    \ array of only x or y values by simply calling data.map(xKey) or data.map(yKey).\
    \ Let’s create a scale for the x axis. This scale maps labels (ordinal values)\
    \ to the horizontal pixel range of the chart:\n\n```\n```javascript\nvar xScale\
    \ = d3.scale.ordinal()\n    .domain(data.map(xKey))\n    .rangeRoundBands([pad,\
    \ width - pad], 0.1);\n```\n```\n\nIn the preceding code, we use the x values\
    \ of the dataset as a domain and project them on the non-overlapping bands using\
    \ the .rangeRoundBands() method to the range called [pad, width - pad]. Now, we\
    \ can continue creating a scale for the y axis; this will be a simple linear scale:\n\
    \n```\n```javascript\nvar yScale = d3.scale.linear()\n    .domain([0, d3.max(data,\
    \ yKey)])\n    .range([height - pad, pad]);\n```\n```\n\nThis scale was a little\
    \ bit easier than the previous ordinal scale; we simply map the domain of [0,\
    \ max] where max is the greatest y value in the dataset. Then, we project it to\
    \ a pixel range of [height - pad, pad]. One might wonder why we changed the order\
    \ of the range values for the y scale. This is due to the orientation of the coordinate\
    \ system in SVG where 0 along the y coordinate is at the top, whereas, in our\
    \ chart, a 0 value should be mapped at the bottom.\n\nLet’s continue and create\
    \ the axis generators; we need one for the x axis and one for the y axis. In the\
    \ x axis, we can already define the number of ticks by specifying it in the .ticks()\
    \ method. It should be equal to the number of elements in the dataset. The y axis\
    \ should be oriented vertically with the tick values on the left-hand side. We\
    \ can specify this with the .orient() method:\n\n```\n```javascript\nvar xAxis\
    \ = d3.svg.axis()\n    .scale(xScale)\n```\n```"
  merge: -1
  img_proc: true
