    \ axis')\n  .attr('transform', 'translate(0, ' + (height - pad) + ')')\n  .call(xAxis);\n\
    ```\n\n```\n$axesGroup.append('g')\n  .attr('class', 'y axis')\n  .attr('transform',\
    \ 'translate(' + pad + ')')\n  .call(yAxis);\n```\n\nLet's look at the output\
    \ of the preceding code in the browser; we will be able to see the axes:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_73_0.png)\n\
    \nAxes of the chart"
