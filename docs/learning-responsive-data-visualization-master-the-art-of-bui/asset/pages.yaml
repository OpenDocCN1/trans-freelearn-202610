- pgno: 98
  md: '# # Making the Chart Responsive

    Using Bootstrap and

    Media Queries


    In the previous chapter, you learned all about loading, parsing, filtering, and
    grouping data from real sources. This gives us everything we need to design responsive
    charts using Bootstrap and Media Queries on some real data. In this chapter, you
    will learn the following:


    +   - Learning absolute and relative units in the browsers

    +   - Understanding what a responsive chart really is

    +   - Drawing charts with percentage values

    +   - Scaling charts using the `viewBox` and `preserveAspectRatio` attributes

    +   - Adapting charts using JavaScript event listeners

    +   - Learning to adapt the resolution of the data

    +   - Using Bootstrap''s Media Queries

    +   - Understanding how to use media queries in CSS, LESS, and JavaScript

    +   - Learning the usage of Bootstrap''s grid system


    First, we will discuss the most important absolute and relative units that are
    available in modern browsers. You will learn the difference between absolute pixels,
    relative percentages, em, rem, and many more.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'In the next chapter, we will take a look at what it really needs for a chart
    to be responsive. Adapting the width to the parent element is one of these requirements,
    and you will learn three different ways to implement this. After this section,
    you will know when to use percentage values, viewport scaling, or event listeners.
    We will also take a look at adapting the data resolution — another important property
    of responsive charts.


    In the next section, we will explore Media Queries and how we can use them to
    make viewport depended responsive charts. We will take the advantage of Bootstrap''s
    definitions of Media Queries for the most common device resolutions to integrate
    them into our responsive chart using CSS or LESS. Finally, we will also see how
    to include Media Queries into JavaScript.


    In the last section of this book, we will look at Bootstrap''s grid system and
    understand how to integrate it seamlessly with the charts. This will give us not
    only great flexibility but also makes it easier to combine multiple charts to
    one big dashboard application.


    # # Units and lengths in the browser


    Creating a Responsive Design, website, or graphics strongly depends on the units
    and lengths that a browser can interpret. We can easily create an element that
    fills the whole width of a container using the percentage values that are relative
    to the parent container, whereas achieving the same result with absolute values
    can be very tricky. Thus, mastering responsive graphics also means knowing all
    the absolute and relative units that are available in the browser.


    # # Units for absolute lengths


    The most convenient and popular way in web designing and development is to define
    and measure lengths and dimensions in absolute units, usually in pixels. The reason
    for this is that designers and developers often want to specify the exact dimensions
    of an object. The pixel unit called `px` has been introduced as a visual unit
    based on a physical measurement to read from a device in the distance of approximately
    one arm''s length; however, all modern browsers can also allow the definitions
    of lengths based on physical units. The following list shows the most common absolute
    units and their relation to each other:


    +   - cm: centimeters (1 cm = 96 px/2.54)

    +   - mm: millimeters (1mm = 1/10th of 1 cm)

    +   - in: inches (1 in = 2.54 cm = 96 px)

    +   - pt: points (1 pt = 1/72th of 1 in)

    +   - px: pixels (1 px = 1/96th of 1 in)'
  merge: -1
  img_proc: true
- pgno: 100
  md: '> > More information about the origin and meaning of the pixel unit can be
    found in the CSS3 specification at http://www.w3.org/TR/css3-values/#viewport-relative-lengths.


    # # Units for relative lengths


    In addition to absolute lengths, relative lengths are expressed as the percentage
    of the width or height of the parent element. It has also been a common technique
    to style the dynamic elements of web pages. Traditionally, the % unit has always
    been the unit of choice for the preceding reason. However, with CSS3, a couple
    of additional relative units have found their way into the browsers to define
    the length relative to the font size of the element.


    Here is a list of some relative length units that have been specified in the CSS3
    specifications and soon will be available in modern browsers:


    +   * %: The percentage of the width/height of absolute container

    +   * em: This is the factor of the font size of the element

    +   * rem: This is the factor of the font size of the root element

    +   * vw: 1% of viewport''s width

    +   * vh: 1% viewport''s height

    +   * vmin: 1% of viewport''s smaller dimension (either vw or vh)

    +   * vmax: 1% of viewport''s larger dimension (either vw or vh)


    I am aware, that as web developers, we cannot really take the advantage of a technology
    that will be supported soon; however, I want to point out one unit that will play
    an important role for web developers in the future: the rem unit. The rem unit
    defines the length of an element based on the font size of the root node (the
    html node in this case) rather than the font size of the current element such
    as em.


    This rem unit is very powerful if we use it to define the length and spacing of
    a layout because the layout can also adapt when the user increases the font size
    of the browser (for example, for readability). I want to mention that Bootstrap
    4 will replace all the absolute pixel units for the Media Queries with the em
    and rem units mostly because of this exact reason.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'If we look at the following figure, we also see that the rem units are already
    supported in all major browsers. I recommend you to start replacing all your absolute
    pixel units of your layout and spacing by rem units:


    | IE | Edge * | Firefox | Chrome | Safari | Opera | iOS Safari * | Opera Mini
    * | Android Browser * | Chrome for Android |

    |---|---|---|---|---|---|---|---|---|---|

    | | | | | | | | | | |


    The cross-browser compatibility of the rem units (source: http://caniuse.com/#feat=rem)


    However, percentage units are not dead; we can still use them when they are appropriate.
    We will use them later to draw SVG elements with dimensions based on their parent
    elements'' dimensions.


    # Units for resolution


    To round up the section of relative and absolute units, I want to mention that
    we can also use resolutions in different units. These resolution units can be
    used in Media Queries together with the min-resolution or max-resolution attribute:


    +   * dpi: dots per inch

    +   * dpcm: dots per centimeter

    +   * dppx: dots per px unit


    # Mathematical expressions


    We often have the problem of dealing with rational numbers or expressions in CSS;
    just imagine defining a three-column grid with a width of 33% per column or the
    need for computing a simple expression in the CSS file. CSS3 provides a simple
    solution for this.


    calc (exp) computes the mathematical expression called exp, which can consist
    of lengths, values, and the operators called +, -, /, and *.'
  merge: -1
  img_proc: true
- pgno: 102
  md: "Note that the + and - operators must be surrounded by whitespace. Otherwise,\
    \ they will be interpreted as a sign of the second number rather than the operator.\
    \ Both the other operators * and / don't require a whitespace, but I encourage\
    \ you to add them for consistency.\n\nWe can use these expression in the following\
    \ snippets:\n\n```\n.col-4 {\n  width: calc(100% / 3);\n}\n\n.col-sp-2 {\n  width:\
    \ calc(50% - 2em);\n}\n```\n\nThe preceding examples look great; however, as we\
    \ can see in the following figure, we need to be aware of the limitations of browser\
    \ compatibility:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_102_0.png)\n\nThe\
    \ cross-browser compatibility of the calc() expression (source: http://caniuse.com/#feat=calc)\n\
    \n# # Responsive charts\n\nNow that we know some basics about absolute and relative\
    \ units, we can start to define, design, and implement responsive charts. A responsive\
    \ chart is a chart that automatically adapts its look and feel to the resolution\
    \ of the user's device; thus, responsive charts need to adapt the following properties:\n\
    \n+   - The dimension (width and height)\n+   - The resolution of data points\n\
    +   - Interactions and interaction areas"
  merge: -1
  img_proc: true
- pgno: 103
  md: "Adapting to the dimensions is the most obvious thing. The chart should always\
    \ scale and adapt to the width of its parent element. In the previous section,\
    \ you learned about relative and absolute lengths, so one may think that simply\
    \ using relative values for the chart's dimensions would be enough. However, there\
    \ are multiple ways with advantages and disadvantages to achieve this; in this\
    \ section, we will discuss three of them.\n\nAdapting to the resolution of the\
    \ data is a little less obvious and often a neglected thing. The resolution of\
    \ data points (the amount of data point per pixel) should adapt so that we can\
    \ see more points on a device with a higher resolution and less points on a low\
    \ resolution screen. In this section, we will see that this can only be achieved\
    \ using JavaScript event listeners and redrawing/ updating the whole chart manually.\n\
    \nAdapting interactions and interaction areas is important for not just using\
    \ different screen resolutions but also different devices. We interact differently\
    \ with a TV than with a computer, and we use different input devices on a desktop\
    \ and mobile phone. However, the chart should allow interactions and interaction\
    \ areas that are appropriate for a given device and screen resolution. You will\
    \ learn more about responsive interactions in the following chapter.\n\n# ## Using\
    \ relative lengths in SVG\n\nThe first and most obvious solution for adapting\
    \ the dimensions of a chart to its parent container would be the use of relative\
    \ values for lengths and coordinates. This means that we define the chart once\
    \ with relative values, and the browser takes care of recomputing all the values\
    \ when the dimensions of the parent container changes. There is no manual redrawing\
    \ of the chart required.\n\nLet's look at the bar chart example of the previous\
    \ chapters. You can find the complete source code in the code examples of this\
    \ chapter that are provided with this book.\n\nFirst, we will add some CSS styles\
    \ to scale the SVG element to the full width of the parent container:\n\n```\n\
    .chart {\n height: 16rem;\n position: relative;\n}\n.chart > svg {\n width: 100%;\n\
    \ height: 100%;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 104
  md: "Next, we modify all our scales to work on a range of [0, 100] and subtract\
    \ padding from both sides:\n\n```\nvar xScale = d3.scale.ordinal()\n    .domain(flatData.map(xKey))\n\
    \    .rangeBands([padding, 100 - 2*padding]);\n```\n\n```\nvar yScale = d3.scale.linear()\n\
    \    .domain([0, d3.max(flatData, yKey)])\n    .range([100 - 2*padding, padding]);\n\
    ```\n\nFinally, we can draw the chart as before, but simply adding percentage\
    \ signs (%) to the end of the attributes to indicate the use of percentage units:\n\
    \n```\n$$bars\n    .attr('x', function(d) { return (xScale(d.x) + i*barWidth)\
    \ + '%'; })\n    .attr('y', function(d) { return yScale(d.y) + '%'; })\n    .attr('height',\
    \ function(d) { return (yScale(0) - yScale(d.y)) + '%'; })\n    .attr('width',\
    \ barWidth + '%')\n    .attr('fill', colors(data.key));\n```\n\nYou can observe,\
    \ that the code for plotting the bars was only modified slightly. Now it uses\
    \ percentage values for coordinates and attributes. However, the effect of this\
    \ small change is enormous. In the following figure, we can see the result of\
    \ the chart in a browser window:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_104_0.png)\n\
    \nThe bar chart using relative lengths"
  merge: -1
  img_proc: true
- pgno: 105
  md: 'If we increase the size of the browser now, the bar chart scales nicely to
    the full width of the parent container. We can see the scaled chart in the following
    figure:


    ![](img/72559bd4713b2b89631dcca187d7e2db_105_0.png)


    The scaled bar chart using relative lengths


    If you are not impressed by it now, you better be. This is awesome in my opinion
    because it leaves all the hard work of recomputing the SVG element dimensions
    to the browser. We don''t have to care about them, and this native computation
    gives us maximal performance.


    The previous example shows how to use percentage values to create a simple bar
    chart. However, what isn''t explained so far is why we didn''t add any axis and
    labels to the chart. Well, despite the idea that we can exploit native rescaling
    of the browser, we also need to face the limitations of this technique: relative
    values are only allowed in standard attributes, such as width, height, x, y, cx,
    cy but not in SVG paths or transform functions.


    # Conclusion about using relative lengths


    While this sounds as an excellent solution (and indeed it is wonderful for certain
    use cases), it has two major drawbacks:


    +   - Percentage values are not accepted for SVG `transform` attributes and the
    `d` attribute in `path` elements but only in standard attributes

    +   - Due to the fact that the browser is recomputing all the values automatically,
    we cannot adapt the resolution of the data of charts


    The first point is the biggest drawback, which means we can only position elements
    using the standard attributes `width`, `height`, `x`, `y`, `cx`, `cy`, and so
    on. However, we can still draw a bar chart that seamlessly adapts according to
    the parent elements without the use of JavaScript event listeners.'
  merge: -1
  img_proc: true
- pgno: 106
  md: "The second argument doesn't play a huge role anymore compared to the first\
    \ one and can be circumvented using additional JavaScript event listeners, but\
    \ I am sure you get the point.\n\n# Scaling the viewport\n\nSVG has some powerful\
    \ features, such as the viewBox and preserveAspectRatio attributes that allow\
    \ automatic rescaling of the whole graphic to the SVG viewport. Using these two\
    \ attributes, we can draw the chart with absolute values in a defined area, scale\
    \ this area automatically to the parent container, and define the handling of\
    \ the aspect ratio of the original dimensions.\n\nLet's start from the beginning.\
    \ We call the SVG viewport the visible area of the SVG element; usually, we see\
    \ by default the standard coordinate system. The viewBox attribute allows us to\
    \ scale a certain area of the coordinate system to the dimension of the viewport.\
    \ We do so by defining the area in the coordinate system by a rectangular through\
    \ the upper-left and lower-right points.\n\nI will demonstrate it by modifying\
    \ the bar chart example. First, let's use some absolute dimensions, for example,\
    \ 400x300. In our case, we will define this by a fixed width and an aspect ratio\
    \ factor:\n\n```\nvar width = 400;\nvar aspectRatio = 4.0 / 3.0;\nvar height =\
    \ width / aspectRatio;\n```\n\nWe also keep the CSS code from the previous example,\
    \ which scales the SVG element to the full width of the parent container.\n\n\
    Now, we can draw the complete chart using these absolute dimensions and finally\
    \ add the viewBox attribute to scale the chart to the viewport:\n\n```\nvar $svg\
    \ = d3.select(chart).append('svg')\n  .attr('viewBox', '0 0 ' + width + ' ' +\
    \ height)\n```"
  merge: -1
  img_proc: true
- pgno: 107
  md: 'That is all. Now, let''s assume we draw the chart in an element with approximately
    the dimensions that we used to create the chart. We can see the output of such
    a result in the following figure:


    ![](img/72559bd4713b2b89631dcca187d7e2db_107_0.png)


    The bar chart is scaled to viewport


    We observe that the chart looks pretty nice, and it scales perfectly into the
    full width, preserving the aspect ratio automatically. But here, we can already
    guess some of the drawbacks of this solution:


    +   - The aspect ratio is fixed

    +   - The chart should have similar initial coordinates, such as the containing
    element


    The first point should be somehow clear; we define an aspect ratio and this is
    why the chart keeps the same aspect ratio even when it is redrawn on a different
    element. The second point, however, is crucial for this implementation. Let''s
    look at the following chart that had initially been created with the 800 x 600
    scale:'
  merge: -1
  img_proc: true
- pgno: 108
  md: '![](img/72559bd4713b2b89631dcca187d7e2db_108_0.png)


    The big chart is scaled to the small viewport


    We can see it immediately; the chart is downscaled to fit the dimensions of the
    container, and therefore, the font and the axis become unreadable because the
    ticks are too small. The opposite thing happens when we use 800 x 600 as an initial
    scale. We can see the effect in the following figure where the ticks are now so
    big that they are overlapping:


    ![](img/72559bd4713b2b89631dcca187d7e2db_108_1.png)


    The small chart is scaled to big viewport'
