- pgno: 161
  md: "# # Path transitions made easy\n\nIf we use D3's path generators, it is also\
    \ quite simple to animate shapes. We can define the starting state as one generator\
    \ and the ending state as another generator for the transition, and D3 will do\
    \ the rest for us. Let's look at an example:\n\n```\n```\n<svg width=\"800\" height=\"\
    600\">\n<path class=\"area\" />\n</svg>\n\n<script>\n\nvar $path = d3.select('.area');\n\
    var points = [\n\t[0, 0], [100, 10], [200, 250],\n\t[300, 375], [400, 340], [500,\
    \ 135],\n\t[600, 360], [700, 280], [800, 480]\n];\n\nvar area0 = d3.svg.area()\n\
    \t.y0(600)\n\t.y1(600)\n\t.x(function(d) { return d[0]; })\n\t.tension(1.0)\n\t\
    .interpolate('cardinal');\n\nvar area1 = d3.svg.area()\n\t.y0(600)\n\t.y1(function(d)\
    \ { return 600 - d[1]; })\n\t.x(function(d) { return d[0]; })\n\t.interpolate('cardinal')\n\
    \t.tension(0.6);\n\n$path.datum(points)\n\t.attr('d', area0)\n\t.transition()\n\
    \t.duration(1000)\n\t.attr('d', area1);\n\n</script>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 162
  md: 'In the preceding example, we define a path SVG element and an array of coordinates
    in JavaScript. Then, we create area generators called `area0` and `area1`. We
    can now animate between both similar shapes using the first area generator called
    `area0` as the starting state and `area1` as the ending state. The following figure
    shows a snapshot of the area after first couple of milliseconds:


    ![](img/72559bd4713b2b89631dcca187d7e2db_162_0.png)


    An area with update transition


    Finally, the area will smoothly animate to the one shown in the following figure;
    and all we have to do is to define the starting and ending state:


    ![](img/72559bd4713b2b89631dcca187d7e2db_162_1.png)


    The area after update transition


    I want to emphasize that the preceding animation only looks good because both
    shapes are similar. They have the same number of points. If the number of points
    was different, the built-in string interpolation would not produce beautiful results
    but some ugly artifacts, due to the interpolation problem (we will discuss this
    in the final section of this chapter).


    # Attribute and style tweens for custom interpolation


    Whenever the built-in interpolations don''t work for us, we can always use custom
    interpolation function for the state transitions. These custom interpolation functions
    are called _tweens_, and they are available via the `.tween()`, `.attrTween()`,
    and `.styleTween()` methods.'
  merge: -1
  img_proc: true
- pgno: 163
  md: "The two latter functions are useful when you want to apply custom interpolation\
    \ functions for certain attributes or styles, whereas the .tween() function lets\
    \ you create a more general tween factory. A tween is a function that must return\
    \ an interpolation function in the form function(t) { ... }.\n\nLet's look at\
    \ a simple example where we create a custom tween that creates a matrix-like character\
    \ animation:\n\n```\n<svg width=\"800\" height=\"600\">\n<text x=\"10\" y=\"5x0\"\
    ></text>\n</svg>\n```\n\n```\n<script>\nvar textTween = function(value) {\n  \
    \  var l = value.length;\n    var randomString = function(length) {\n        if\
    \ (length === 0) {\n            return \"\";\n        }\n        // generates\
    \ a random string\n        // @src: http://stackoverflow.com/a/10727155\n    \
    \    return Math.round((Math.pow(36, length + 1) - Math.random() *\nMath.pow(36,\
    \ length))).toString(36).slice(1);\n    }\n    return function() {\n        return\
    \ function(t) {\n            var i = Math.floor(t * 1);\n            var s = value.substr(0,\
    \ i) + randomString(l - i);\n            this.textContent = s;\n        }\n  \
    \  };\n};\n\nd3.select('text')\n    .transition()\n    .duration(2500)\n    .ease('linear')\n\
    \    .tween('text', textTween('Welcome to the matrix...'));\n</script>\n```"
  merge: -1
  img_proc: true
- pgno: 164
  md: "In the preceding code, we set up an SVG `text` element and create a transition\
    \ with a custom tween function that is returned from the `textTween()` call. As\
    \ mentioned already, the tween function must return an interpolation function.\
    \ In our interpolation function, we create an index variable called `i`, which\
    \ contains the index of the string called `value` at the current parameter called\
    \ `t` in the range of [0, 1]. The index starts at `0` and goes up to the total\
    \ length of `value`. Then, we fill up the remaining characters with a random string.\
    \ Finally, we write the result into the `textContent` property of the raw HTML\
    \ node element, which can be accessed via the `this` keyword. We can also observe\
    \ that we use the `linear` easing instead of the default `cubic-in` easing to\
    \ make the animation duration equal for each character. It's nice to see that,\
    \ when writing tweens, we can use all the transition functions that we saw in\
    \ the previous section.\n\n> You can find more information about their usage in\
    \ the D3 documentation on Github at https://github.com/mbostock/d3/wiki/Transitions#attrTween.\n\
    \n# Chained transitions\n\nIf we want to build a series of transitions, we can\
    \ chain transitions together. With D3, it is much easier to create a custom animation\
    \ as a series of chained transitions rather than a custom animation using timers\
    \ and interpolators.\n\nUsing the `.transition()` method on a transition object\
    \ instead of a selection, we create a new chained transition that automatically\
    \ starts after the previous transition has stopped. To be more precise, it overrides\
    \ the delay value of the transition to begin after the previous transition stopped.\n\
    \nLet's see a simple example:\n\n```\n<svg width=\"800\" height=\"600\">\n<rect\
    \ width=\"100\" height=\"100\" />\n</svg>\n\n<script>\nd3.select('rect')\n  .attr('x',\
    \ 10)\n  .attr('y', 10)\n  .attr('fill', 'steelblue')\n  .transition()\n  .duration(1000)\n\
    \  .attr('fill', 'red')\n  .attr('x', 500)\n```"
  merge: -1
  img_proc: true
- pgno: 165
  md: '```

    .transition()

    .duration(2500)

    .attr(''fill'', ''green'')

    .attr(''y'', 500)

    .transition()

    .duration(5000)

    .attr(''fill'', ''steelblue'')

    .attr(''x'', 10)

    .attr(''y'', 10);

    </script>

    ```


    The preceding animation works really well where each state is animated after each
    other. However, we need to be aware that only the internal delay attribute was
    overwritten for each state, so we cannot really use the .delay() method unless
    we keep track of the previous transition durations.


    D3 triggers the end event whenever a transition is finished; we can use this event
    to control the animation states. Here is an example using the end event:


    ```

    d3.select(''rect'')

    .attr(''x'', 10)

    .attr(''y'', 10)

    .attr(''fill'', ''steelblue'')

    .transition()

    .duration(1000)

    .attr(''fill'', ''red'')

    .attr(''x'', 500)

    .each(''end'', function() {

    d3.select(this)

    .transition()

    .duration(2500)

    .attr(''fill'', ''green'')

    .attr(''y'', 500)

    .each(''end'', function() {

    d3.select(this)

    .transition()

    .duration(5000)

    .attr(''fill'', ''steelblue'')

    .attr(''x'', 10)

    .attr(''y'', 10);

    });

    });

    ```'
  merge: -1
  img_proc: true
- pgno: 166
  md: "The preceding example works better because a new transition gets started whenever\
    \ an old one has stopped. However, the nested callback tree looks really ugly\
    \ and bears potential errors for your productive code.\n\nOne step towards fully\
    \ chainable transitions is to add a little extension to D3 that allows Promised-based\
    \ state transitions. Promises are asynchronous representations for future values\
    \ and have a very nice property – they can be chained together in a flat structure\
    \ instead of a nested tree structure.\n\nHere is the helper function for Promised-based\
    \ transitions, which uses an ES6 Promise polyfill to work in all browsers (you\
    \ can read more about polyfills and their purpose in the last chapter of this\
    \ book):\n\n```\nfunction add$transition(selection) {\n    selection.$transition\
    \ = function(animationFn) {\n        var getPromiseTransition = function() {\n\
    \            return new Promise(function(resolve, reject) {\n                selection.transition()\n\
    \                .call(animationFn)\n                .each(\"end\", function()\
    \ {\n                    resolve(selection);\n                });\n          \
    \  });\n        });\n\n        if (selection.$progress == undefined) {\n     \
    \       selection.$progress = getPromiseTransition();\n        }\n        else\
    \ {\n            selection.$progress = selection.$progress\n            .then(function()\
    \ {\n                return getPromiseTransition();\n            });\n       \
    \ }\n\n        return selection;\n    }\n}\n```\n\nLet's go through the preceding\
    \ code. First, we add a new .transition(animationFn) method to the D3 selection,\
    \ which allows us to create Promise-based async transitions. Next, we jump to\
    \ the line where we check if there already exists a $progress property on the\
    \ selection; this property will always store the most recent Promise. If it doesn't\
    \ exist, we initialize it with a new transition Promise; otherwise, we return\
    \ a new transition Promise from the .then() method, which gets executed after\
    \ the Promise is resolved. Then, we override the $progress property with the result\
    \ that will be returned from the .then() method, which is the most recent Promise."
  merge: -1
  img_proc: true
- pgno: 167
  md: "The getPromiseTransition() function creates a new transition object on the\
    \ current selection and resolves when the end event is triggered. All the transitions\
    \ that are applied in the animationFn are applied to this state. Now, we can write\
    \ the example from before as follows:\n\n```\nvar $rect = d3.select('rect');\n\
    ```\n\n```\n$rect\n.attr('x', 10)\n.attr('y', 10)\n.attr('fill', 'steelblue')\n\
    .call(add$transition);\n```\n\n```\n$rect\n.$transition(function(s) {\n    s.duration(1000)\n\
    \    .attr('fill', 'red')\n    .attr('x', 500);\n})\n.$transition(function(s)\
    \ {\n    s.duration(2500)\n    .attr('fill', 'green')\n    .attr('y', 500);\n\
    })\n.$transition(function(s) {\n    s.duration(5000)\n    .attr('fill', 'steelblue')\n\
    \    .attr('x', 10)\n    .attr('y', 10);\n});\n```\n\nThis is beautiful. We now\
    \ have a fully functional and encapsulated chainable transitions. However, note\
    \ that this is only one example of how event-based chaining can be combined with\
    \ Promises to create a true state-based animation. There may be more elegant ways\
    \ to do this.\n\n> > You can find more information about ES6 Promises on\n> the\
    \ MDN at https://developer.mozilla.org/\n> en-US/docs/Web/JavaScript/Reference/Global_\n\
    > Objects/Promise."
  merge: -1
  img_proc: true
- pgno: 168
  md: '# # Shape tweens


    Shape tweens are the holy grail of transitions. I want you to remember the D3
    Show Reel available at http://bl.ocks.org/mbostock/1256572 in 2011 by Mike Bostock
    — the author of D3. Here, he shows some awesome shape tween capabilities of D3
    by transforming a chart into different representations.


    Although a shape tween looks very simple and intuitive, they are almost never
    easy to create. Why is this so? Because the tools such as SMIL and D3 use simple
    string interpolation function, which extracts the numeric values of a string and
    interpolates them to the end state. And as soon the end state string looks different
    form the starting state — it could have a different amount of points, control
    points, or path commands — the resulting transition won''t look good/smooth. Coming
    back to the D3 Show Reel, most of the transitions that we see are shape tweens
    of similar shapes—shapes with the same amount of control points.


    This is true in particular for tweening between arbitrary shapes and writing reusable
    tweening functions. If you consider to only prototype a tween from one specific
    shape to another one, you can also come up with a quick and dirty solution for
    your case.


    Unfortunately, there isn''t any open source shape tween library/d3 plugin that
    can handle all kinds of shapes. This would be a task that such a plugin would
    have to master the following:


    +   * Converting all the shape elements such as `rect`, `ellipse`, `polygon`,
    and more into the path elements; only path elements can be seamlessly interpolated

    +   * Converting all the segments of the shape into cubic Bézier curves; with
    these curves, we can create arbitrary shapes

    +   * Subdividing segments in the starting/ending path to obtain the same number
    of control points in both shapes; only the shapes with the same number of points
    can be interpolated seamlessly

    +   * Align the points of the starting shape to the closest point in the ending
    shape to make the transition look smoother

    +   * Using any string interpolation method, such as `d3.interpolate`, to interpolate
    both the strings of the shapes

    +   * Optimizing the function that runs under 16ms to look good at 60FPS


    If you are keen to work on a plugin such as this, let me know.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'There exists another nice way to solve the problem of shape tweening. Instead
    of creating an interpolation function that does all the work behind the scenes,
    Christophe Viau came up with the idea to write a D3 plugin for the so-called Superformula
    shapes. These are complex shapes that can all be constructed using the Superformula
    — a more general version of the Superellipse formula — and six parameters. The
    property of these shapes is that they all are constructed by exactly the same
    amount of line segments, which makes them perfect for smooth interpolation. In
    the following figure, we can see some of the shapes that can be constructed by
    this formula and can be used for smooth tweening:


    ![](img/72559bd4713b2b89631dcca187d7e2db_169_0.png)


    The shapes constructed by Superformula (source: http://bl.ocks.org/mbostock/1020902)


    > You can find the D3 Superformula plugin on Github at https://github.com/d3/d3-plugins/tree/master/superformula
    and an example on Mike Bostock''s Blocks at http://bl.ocks.org/mbostock/1020902.


    # Summary


    In the first section, you learned about web standards for animations that although
    SMIL is pretty cool and powerful, we should start to use CSS and especially JavaScript
    animations. SMIL animations are deprecated in Chrome, and the specification for
    Web Animation (JavaScript) API is in progress.


    In the following section, you learned how D3 timers abstract the native setInterval
    function and how we can use and built custom interpolations and easing functions.
    Finally, we saw how to build beautiful animations in D3 by the use of transitions.
    Transitions are automatic animations between two predefined states: a starting
    and an ending state. By chaining transitions together, we can again create animations.


    In the last section, you learned about shape tweens and the problems of using
    it on custom shapes. String interpolation functions are dumb, so they only work
    for similar shapes (shapes with the same amount of control points). We will need
    to transform and subdivide shapes in order to do proper shape tweening.


    In Chapter 7, Creating Maps and Cartographic Visualizations Using GeoJSON, you
    will learn about cartographic visualization and geographic data, such as GeoJSON.
    We will also make use of all techniques that we have understood so far.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Creating Maps and Cartographic Visualizations Using GeoJSON


    In the previous chapter, you learned about transitions and animations; now, think
    about animating features on geographic visualization because we will take a look
    at cartographic visualization and GeoJSON. In this chapter, you will learn the
    following:


    +   - Understanding the different challenges of cartographic visualizations

    +   - Understanding the geometric coordinate system

    +   - Learning about the GeoJSON format

    +   - Understanding the problems of GeoJSON and the advantages of TopoJSON

    +   - Learning about 3D to 2D projections

    +   - Getting familiar with helpful tools for cartographic visualizations

    +   - Creating color scales

    +   - Drawing GeoJSON features

    +   - Loading multiple resources at once

    +   - Drawing geographic grids

    +   - Implementing different types of geographic visualizations


    In the first section, we will look into the ecosystem of cartographic visualizations
    and understand different challenges and problems that occur when dealing with
    such visualizations. First, we will look at geographic coordinate systems, then
    we will think about how to project the globe into a 2D plane.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'In the next section, we will investigate which kind of data we can plot on
    maps and how to use this geographic data in the browser. Naturally, we will look
    into GeoJSON and the representation of geographic features in more detail. Then,
    we will discuss the problems of GeoJSON and how they can be solved using TopoJSON.


    In the following section, you will get familiar with multiple tools and techniques,
    which are useful for cartographic visualization. We will implement color scales,
    use the geographic shapes generator to generate a path out of GeoJSON features,
    and look at the `queue.js` module to load multiple resources at once.


    Finally, we will create different types of cartographic visualization, such as
    symbol maps and Choropleth maps. I am sure you will enjoy this section, because
    you will be able to use all the previously learned techniques to create beautiful
    visualizations on maps.


    # # Overview of cartographic visualizations


    The goal is to display cartographic data on an interactive and responsive visualization
    using `d3.js` similar to the following example:


    ![](img/72559bd4713b2b89631dcca187d7e2db_171_0.png)


    The Choropleth map of USA (source: http://bl.ocks.org/mbostock/4060606)


    However, this is not a straightforward task such as drawing a simple bar chart.
    There are many things that need to be considered when building a cartographic
    visualization, and this section will introduce you to these different steps and
    techniques. Let''s get started straightaway and look at all the different components
    from a bar chart and how they can be compared to a cartographic visualization.
    This will give us enough knowledge on how to tackle the problem.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# A geographic coordinate system


    When we draw a bar chart, we usually start by drawing a coordinate system — a
    Cartesian coordinate system to be precise — usually represented as axes. This
    coordinate system defines how we can find the desired coordinates to draw a bar;
    it shows us the x and y directions on which we can move along. The second important
    aspect of the axes is that they define the scale of the chart: how close the points
    from the data set have to be drawn as pixel values in the chart.


    When we transform the concept of axes to cartographic visualizations, we need
    to think about the coordinate system that we use to represent geographic points.
    The standard way to represent points on a certain location of the world (and hence
    also in a map) is by latitude, longitude, and elevation. In general, we won’t
    consider the altitude of points on the earth and thus only use the first two for
    geographic visualizations.


    Both latitude and longitude are measured in angles. Latitude is measured in the
    range of [90°N; 90°S] from the equator (in segments called Parallels), and longitude
    is measured in the range of [180°W; 180°E] from the prime meridian (in segments
    called meridians). The following figure compares both measurements and displays
    circles of equal latitude and longitude. The grid that is formed by equal latitude
    and longitude is also called graticule:


    ![](img/72559bd4713b2b89631dcca187d7e2db_172_0.png)


    The comparison of latitude and longitude'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Projecting a sphere on a flat map


    Now, we know how we can precisely identify any point on the surface of the world.
    But when it comes to visualizing these points in a flat map, there comes another
    problem. If we want to display a 2D representation of the world (or a sector of
    it), we have to project the 3D sphere on a 2D plane. The good news is that this
    can be done; however, the bad news is that this is not possible without distorting
    the representation.


    When I was in primary school, I was always impressed by the huge size of Antarctica
    in my school atlas, which looked similar to the following figure. However, my
    imagination of the big continent was rectified a few years later when I first
    heard about geographical projections and how the 3D world can be mapped into a
    2D page in a book:


    ![](img/72559bd4713b2b89631dcca187d7e2db_173_0.png)


    The 2D world map (source wikimedia.org)


    The reason for my misconception at the younger age was that I was not aware of
    the distortion that occurred from projecting the world into a 2D map. In the following
    figure, we see the real size of Antarctica in comparison with the other continents.
    As a conclusion, we can say that certain properties, such as the equality of areas,
    equality of angles, distances, and so on, can get lost when projecting a sphere
    onto a plane:'
  merge: -1
  img_proc: true
- pgno: 174
  md: '![](img/72559bd4713b2b89631dcca187d7e2db_174_0.png)


    The 3D world map (source wikimedia.org)


    # Which data can be displayed on a map?


    With bar charts, line charts, scatter plots, and pie charts, we can display all
    kinds of 1D, 2D, and 3D data. The dimensions can be encoded as numeric values,
    time, categorical values, and more and can be represented as dimensions on axis,
    the size of the data point, and colors. However, when dealing with geographic
    visualizations, we will mostly deal with 2D data where one dimension represents
    the location on the map and the remaining dimension represents a value (could
    be either numerical or ordinal) as a color according to a certain color scale.


    There are multiple ways to encode locations:


    +   - ID values can represent continents, countries, states, cities, and so on

    +   - Latitude and longitude coordinates can represent a point on the map

    +   - The coordinates of a polygon can represent an area on the map'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'To represent a value dimension on this specific location on the map, we most
    often use a color palette and color the data points according to a predefined
    color range. However, you should be aware that using color palettes to display
    numeric values is somehow ambiguous because we perceive color changes differently
    from size changes. In addition, the designer can control the perception of the
    user by picking a certain color palette. In the next figure, for example, we see
    three different visualizations that all display the same data with different color
    palettes. Whereas, the left and right visualizations look very similar and give
    the user a similar understanding of the data, the visualization in the middle
    gives a completely different and contradictory image of the data. This is achieved
    by simply inverting the color palette from the left visualization. Also, the quantization
    of the color steps can have a huge impact. In one example, we could generate a
    very smooth gradient; but with a different quantization, we could create visible
    borders between the quantizations:


    ![](img/72559bd4713b2b89631dcca187d7e2db_175_0.png)


    Displaying the same data using different color palettes


    It''s up to the designer to choose a color palette that goes along with the data
    that visualizes the aspects one wants the user to see and understand.


    # Can we start now?


    Now, you will have a good overview of which parts and components are needed to
    draw cartographic visualization. In the following chapters, we will go into details
    and implement some visualizations using D3.


    The only part we have not discussed until now is where we can get the data for
    geographic visualization and in which format the data is encoded. We will discuss
    this right ahead in the following section.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# # Data representation for topology and geographic features


    Geographical data is usually stored in databases and programs called Geographic
    Information Systems (GIS). These are usually tools to design, store, manipulate,
    analyze, and display the cartographic data. The following figure shows how the
    different aspects of the world can be abstracted as layers and managed in such
    a system:


    ![](img/72559bd4713b2b89631dcca187d7e2db_176_0.png)


    A typical GIS abstraction


    Most of these systems provide an interface to access or download these layers
    separately — that is, cartographic data, statistical data, or other geographic
    data—in a specified GIS format. There exists a variety of different GIS pixel-
    and vector-based formats; however, we will look into two JSON-based vector formats:
    GeoJSON and TopoJSON.


    If you are looking for geographic data sets, I recommend you to visit http://www.data.gov/,
    http://geocommons.com/ as well as the extensive list on Robin Wilson''s page at
    http://freegisdata.rtwilson.com/.'
  merge: -1
  img_proc: true
- pgno: 177
  md: "# GeoJSON – a format for geographic features\n\nJSON is a great data format\
    \ for JavaScript, and it works nicely together with D3.\nSo, the only natural\
    \ choice is to use a JSON format for geographic data, and this is\nexactly what\
    \ GeoJSON is.\n\nGeoJSON is a very flexible format that can encode anything from\
    \ the geometries,\nfeatures, and collections of features. Let's jump directly\
    \ into it and take a look at a\ntypical GeoJSON file:\n\n```\n{\n    \"type\"\
    : \"FeatureCollection\",\n    \"features\": [\n    {\n    \"type\": \"Feature\"\
    ,\n    \"geometry\": {\n    \"type\": \"Point\", \"coordinates\": [102.0, 0.5]\n\
    \    },\n    \"properties\": {\n    \"prop0\": \"value0\",\n    \"prop1\": {\"\
    count\": 3}\n    }\n    }, {\n    \"type\": \"Feature\",\n    \"geometry\": {\n\
    \    \"type\": \"LineString\",\n    \"coordinates\": [\n    [102.0, 0.0], [103.0,\
    \ 1.0], [104.0, 0.0], [105.0, 1.0]\n    ]\n    },\n    \"properties\": {\n   \
    \ \"prop0\": \"value1\",\n    \"prop1\": {\"count\": 2}\n    }\n    }, {\n   \
    \ \"type\": \"Feature\",\n    \"geometry\": {\n    \"type\": \"Polygon\",\n  \
    \  \"coordinates\": [\n    [ [100.0, 0.0], [101.0, 0.0], [101.0, 1.0],\n    [100.0,\
    \ 1.0], [100.0, 0.0] ]\n    ]\n    },\n    \"properties\": {\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: "```\n\"prop0\": \"value2\",\n  \"prop1\": {\"count\": 1}\n}\n}\n}\n}\n```\n\
    \nIn the preceding code, we can see a feature collection where every feature contains\
    \ a geometry, some properties, and a type. In GeoJSON, a feature collection consists\
    \ of features with properties and a certain geometry, whereas geometries are constructed\
    \ out of a few basic elements, such as Points, Lines, and Polygons.\n\nThe following\
    \ are some valid types in GeoJSON:\n\n+   * Point\n+   * MultiPoint\n+   * LineString\n\
    +   * MultiLineString\n+   * Polygon\n+   * MultiPolygon\n+   * GeometryCollection\n\
    +   * Feature\n+   * FeatureCollection\n\nWhenever we deal with custom data, we\
    \ will use FeatureCollection as the array of features. However, other types are\
    \ also possible.\n\n> You can find the complete GeoJSON specification at http://geojson.org/geojson-spec.html.\n\
    \nWe can load GeoJSON exactly as we would load a normal JSON file within D3 with\
    \ the d3.json function. Let's look at an example:\n\n```\nd3.json(\"data/default.json\"\
    , function(error, data) {\n  if (error) throw error;\n\n  console.log(data.features);\n\
    });\n```"
  merge: -1
  img_proc: true
- pgno: 179
  md: "In the preceding code, the data now contains the exact same object that we\
    \ saw in the preceding example. Now, we only have to extract the relevant information\
    \ from the data. We obtained the desired properties using a map function:\n\n\
    ```\nd3.json(\"data/default.json\", function(error, data) {\n  if (error) throw\
    \ error;\n  var labels = data.features.map(function(d) {\n    return d.properties.prop0;\n\
    \  });\n  var values = data.features.map(function(d) {\n    return d.properties.prop1.count;\n\
    \  });\n});\n```\n\nIn the preceding code, we use map to transform and extract\
    \ the relevant properties, such as `values` and `labels`, from the feature collection's\
    \ `properties` attribute. Note that the shape of the properties object is not\
    \ standardized and depends on the data structure of your API. In our case, it\
    \ contains the `prop0` and `prop1` attributes, but it could also contain other\
    \ attributes. If one of the properties would contain a nested objected, we could\
    \ also use the `reduce` function to aggregate these values.\n\nIt is important\
    \ to know that we always have to extract the values out of the properties object\
    \ in order to visualize them.\n\n# TopoJSON – GeoJSON for web visualizations\n\
    \nTopoJSON is a format optimized for compressed GeoJSON topology data specified\
    \ and developed by Mike Bostock, the main author of `d3.js`. It was developed\
    \ to reduce the size of big GeoJSON files in order to speed up web visualizations.\n\
    \nAs we saw in the previous section, the GeoJSON format stores a topology as a\
    \ list of polygon points; however, any in-land border often belongs to multiple\
    \ countries or states. Thus, encoding the states' bounding boxes as polygon points\
    \ leads to (a lot of) redundant information. According to Mike Bostock, a TopoJSON\
    \ file is 80% smaller than the original GeoJSON file:"
  merge: -1
  img_proc: true
- pgno: 180
  md: '![](img/72559bd4713b2b89631dcca187d7e2db_180_0.png)


    Polygons and boundaries represented as TopoJSON (source https://github.com/mbostock/topojson/wiki)


    TopoJSON consists of a server API responsible for converting GeoJSON files into
    the TopoJSON format, which is available as a command-line tool for node.js and
    a client API for converting the TopoJSON file back into GeoJSON in the browser.


    > You can find more information about TopoJSON on the Github page of the project
    at https://github.com/mbostock/topojson/wiki/API-Reference.


    # GeoJSON to TopoJSON via the server API


    You can install the TopoJSON server API via the package manager called npm; simply
    run the following from the command line:


    ```

    npm install topojson

    ```


    Finally, when you have the tool installed, you can use it with the following syntax
    to convert a GeoJSON file called input_geo.json into a TopoJSON file called output_topo.json:


    ```

    topojson -o output_topo.json input_geo.json

    ```


    > You can find the complete reference for the command-line tool on the Github
    page of the project at https://github.com/mbostock/topojson/wiki/Command-Line-Reference.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# # TopoJSON to GeoJSON via the Client API


    Once you converted a GeoJSON file into a small TopoJSON file, you also need to
    convert it back in the browser. Therefore, we have to use the client API, which
    can be installed either via `bower` (recommended) or `npm` or loaded directly
    from `http://d3js.org/topojson.v1.min.js`.


    In the browser, we only have to include the script in the header:


    ```

    <script src="bower_components/topojson/topojson.js"></script>

    ```


    Then, we can already use the topojson object.


    We can access features and meshes from the original GeoJSON file by calling the
    following:


    +   * `topojson.feature(topology, object)`

    +   * `topojson.mesh(topology, object, [filter])`


    Now, we can profit from the huge reduction in the topology file without losing
    information about the features or meshes. I advise you to always process your
    input files in such a manner that they stay small and compact in size; TopoJSON
    is a great way to achieve this.


    # ## Maps and projections


    As we already saw in the first section of this chapter, there are multiple possible
    ways of mapping a 3D world into a 2D plane; whereas in all of these methods, some
    information is lost.


    Let''s make a little brain experiment. Think about what you would have to do to
    map the surface of a sphere into the plane. First, you would have to pick a hole
    somewhere into the surface. Then, you could stretch the surface as long it fits
    into the plane. However, we introduce a topology violation now at the exact point
    where we picked the hole. We can easily see that if you move outside of the left
    side of the map, you should theoretically enter on the right side again; but in
    our 2D representation, we lost this property, and the two sides are no longer
    connected. The second problem is that we also introduced a distortion when stretching
    the surface into the plane. Now, the top and bottom regions in the map seem to
    be bigger; we could not preserve the equality of the areas. If you look back at
    the first section at the figure 2D world map, you can actually see these exact
    problems.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'One could have the great idea of copying the whole 3D sphere into a plane—like
    in the 3D world map figure in the first section. However, we only see one side
    of the sphere here; and hence, we loose all the information about the other side.


    This mapping of a sphere to a plane is called projection. D3 offers a variety
    of built-in projections for all kinds of mappings, available under the d3.geo
    namespace.


    > > You can find more information about maps on Mike Bostock''s blog at http://bost.ocks.org/mike/map/.


    # # The Equirectangular projections


    Remember the brain experiment we just did before? To create such a simple projection
    in D3, we can use the d3.geo.equirectangular() function that preserves neither
    distances nor areas. It is the most basic projection because parallels and meridians
    are simply mapped to parallels and normals in a Euclidean space. We can see the
    previously discussed distortion effects in the following figure:


    ![](img/72559bd4713b2b89631dcca187d7e2db_182_0.png)


    Due to the fact of not preserving areas, angles, or distances, it is rarely used
    for visualizing geographic features. However, it is used sometimes for raster
    reprojection of pixel values to other representations.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# # Orthographic projection


    Now, we continue the brain experiment from before. Let''s move to a 3D projection
    onto a 2D plane, which is called orthographic projection. As we can see in the
    following figure, when using orthographic projection, we lose the information
    about one side of the sphere:


    ![](img/72559bd4713b2b89631dcca187d7e2db_183_0.png)


    The Orthographic projection


    We can create an orthographic projection in D3 using the `d3.geo.orthographic()`
    function.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# # Albers projection


    Albers projection maps the sphere onto a cone with equal area where the parallels
    are more closely spaced, and the north and south end and the meridians are equally
    spaced. This projection is often used to display the areas of geographic features
    on the map regions with a large east-west distance; in other words, it is commonly
    used for the Choropleth maps of the US:


    ![](img/72559bd4713b2b89631dcca187d7e2db_184_0.png)


    The Albers projection


    In D3, we can create an Albers projection by the following function:


    ```

    var projection = d3.geo.conicEqualArea();

    ```


    To adapt the projection to the region of interest, we can specify the projection''s
    Albert standard parallels with the `projection.parallels([parallels])` method.
    The argument called `parallels` should be an array of two latitude values in degree
    that define the lower and upper bound of the region of interest; for the US, this
    would be `[29.5, 45.5]`. D3 also offers the `d3.geo.albers()` projection, which
    is an Albers projection with presets for the US.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'At the top, D3 provides another US specific preset, the `d3.geo.albersUsa()`
    projection, which is displayed in the following figure. We can see that, in addition
    to the normal US-centric projection, it shows Alaska and Hawaii and hence all
    the 50 states of the US. Note that the size of Alaska is scaled by a factor of
    0.35 in order to fit in the map:


    ![](img/72559bd4713b2b89631dcca187d7e2db_185_0.png)


    An Albers USA projection


    # # Spherical Mercator projection


    The Mercator projection preserves angles locally, which has the nice property
    that the relative angles on each point of the map are correct; and even the local
    scale stays constant in any direction. However, as we can see in the following
    figure, it introduces big distortions on the world scale:'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/72559bd4713b2b89631dcca187d7e2db_186_0.png)


    The Mercator projection


    Due to its local properties, the Mercator projection is often used by tiled mapping
    libraries, such as Google Maps and Leaflet. However, it should not be used for
    Choropleth maps due to the length distortions.


    In D3, we create a Mercator projection by calling the d3.geo.mercator() function.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Azimuthal Equidistant projection


    Azimuthal Equidistant projection maps circles around the projection''s center
    to circles in the 2D map, thus preserving distances in the azimuthal direction
    from the projection''s center:


    ![](img/72559bd4713b2b89631dcca187d7e2db_187_0.png)


    The Azimuthal Equidistant projection


    The projection can be generated by calling the d3.geo.azimuthalEquidistant() function.
    It can be quite useful in a visualization where you want to display distances
    relative to a certain reference point.


    > > You can find many more projections and detailed information on Github at https://github.com/mbostock/d3/wiki/Geo-Projections.


    # Helpful tools for creating maps in D3


    Drawing maps requires a combination of knowledge and good understanding of GIS,
    GeoJSON, Projections, and so on as well as techniques and skills for creating
    the maps. In this section, we will look at a few selected tools that facilitate
    the generation of interactive maps with D3.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Color scales


    As we discussed in the first section, the colors and color scales that the author
    chooses can have a huge impact for the reader to perceive the visualization. Therefore,
    I want to show how we can efficiently create color scales in D3.


    Scales can map a certain domain of values to a range of different values using
    interpolation. We usually use this to create scales for axes. Axes, however, map
    a domain of values onto a pixel range. In our case, we want to use these scales
    on colors to map a value domain to a color range. We can achieve this using these
    color interpolation functions:


    +   - d3.interpolateRgb: RGB and HEX values, such as #00FF00

    +   - d3.interpolateHsl: HSL values, such as hsl(120, 100%, 50%)

    +   - d3.interpolateLab: LAB values

    +   - d3.interpolateHcl: HCL values


    Let''s look at a simple example where we map the values of a domain from 0 to
    5 onto a color range from orange to red:


    ```

    var color = d3.scale.linear()

    .interpolate(d3.interpolateRgb)

    .domain([0, 5])

    .range([''#FFCC66'', ''#FF0000'']);


    color(0); // > ''#FFCC66''

    color(5); // > ''#FF0000''

    ```


    In the preceding code, we can simply use the d3.interpolateRgb interpolation function
    to use scales for colors.


    Instead of linear scales, we can also use other scales such as the d3.scale.log()
    logarithmic scale or the d3.scale.pow() exponential scale. If you deal with ordinal
    values, you can also use non-numeric ordinal scales:


    ```

    var color = d3.scale.ordinal()

    .domain([''foo'', ''bar'', ''baz''])

    .range([''red'', ''blue'', ''green'']);

    ```


    In the preceding code, we can only map the precise values called foo, bar, and
    baz to the predefined colors. If you want to use predefined color classes with
    CSS, you should look into quantized scales, such as d3.scale.quantize() and d3.scale.threshold().'
  merge: -1
  img_proc: true
- pgno: 189
  md: "If you are interested in creating beautiful color scales, you should take a\
    \ look at the Color Brewer library at http://colorbrewer2.org/.\n\nIf you want\
    \ to display the color scale next to the visualization, you can use the great\
    \ d3 color legend plugin by John Goodall at https://github.com/jgoodall/d3-colorlegend.\n\
    \n# # The geographic shape generator\n\nYou have already learned about the different\
    \ types that are supported in the GeoJSON format, each one defines a specific\
    \ geometry. When dealing with these GeoJSON features, we often have the problem\
    \ of drawing these shapes onto a map using a certain predefined projection. However,\
    \ I should send flowers to Mike Bostock for developing the geographic shape generator\
    \ which can be accessed via d3.geo.path().\n\nThe D3 geographic shape generator\
    \ makes it trivial to plot GeoJSON features on a map. It can draw any of the supported\
    \ GeoJSON types and output the geometry according to a predefined projection as\
    \ a string for SVG path elements.\n\nLet's take a look at how to use this generator:\n\
    \n```\nvar projection = d3.geo.albersUsa();\nvar path = d3.geo.path()\nwhitespace\
    \ \".projection(projection)\"\nsvg.append(\"path\")\n      .datum({type: \"FeatureCollection\"\
    , features: features})\n      .attr(\"d\", path);\n```\n\nIn the preceding code,\
    \ we generated a path for a FeatureCollection object with a fictive array of feature.\
    \ Note that this is the exact GeoJSON format that makes it super simple to plot\
    \ GeoJSON features.\n\n# ## Graticule – grids on maps\n\nAn essential tool to\
    \ understand maps and projections is a grid in cartographic visualizations. Grids\
    \ are essential because other than in Cartesian coordinate systems, grids of parallels\
    \ and meridians are no longer equally spaced or normal onto each other. Hence,\
    \ the graticule carries a lot of useful visualization about the current projection\
    \ and geographic coordinate system."
  merge: -1
  img_proc: true
- pgno: 190
  md: "Let's take a look on how to create such a graticule. D3 provides the d3.geo.graticule()\
    \ function that generates a grid for a geographic coordinate system. All we have\
    \ to do is to plug it into the geo shape generator and style it a little:\n\n\
    ```\nvar width = 960\n height = 960;\n\nvar projection = d3.geo.orthographic()\n\
    \ .scale(width*0.25)\n .translate([width / 2, height / 2])\n .clipAngle(90)\n\
    \ .precision(.1);\nvar path = d3.geo.path()\n .projection(projection);\nvar graticule\
    \ = d3.geo.graticule();\nvar svg = d3.select(\"body\").append(\"svg\")\n .attr(\"\
    width\", width)\n .attr(\"height\", height);\nsvg.append(\"path\")\n .datum(graticule)\n\
    \ .attr(\"class\", \"graticule\")\n .attr(\"d\", path);\n```\n\nIn the preceding\
    \ code, we create an orthographic projection and plug it into the geo path generator.\
    \ Finally, we create a graticule and apply it onto the generator. The resulting\
    \ grid is displayed in the following figure:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_190_0.png)\n\
    \nA Graticule of the Orthographic projection"
  merge: -1
  img_proc: true
- pgno: 191
  md: "# # Loading multiple resources\n\nAs you have already learned in the previous\
    \ section, we always have to load the geometry of the background map in addition\
    \ to the file containing the data that we want to display. This is a little challenging\
    \ because now we have to wait until these (at least) two files have loaded before\
    \ we can draw the visualization.\n\nIdeally, we want to load both resources in\
    \ parallel and execute a callback function once all the resources are available.\
    \ Luckily, Mike Bostock was very active in the past years and wrote the utility\
    \ tool Queue.js which does exactly this.\n\nYou can install Queue.js using bower\
    \ and run the following command from the command line or load Queue.js from a\
    \ CDN:\n\n```\nbower install queue-async\n```\n\nNow, we can create a queue and\
    \ use the .defer() function to register functions to load all the resources. We\
    \ pass a function as the first argument, and Queue.js will automatically pass\
    \ all additional arguments to this function. Finally, we call the .await() method\
    \ to execute a callback once all the resources have loaded and collect all their\
    \ values. Let's look at an example:\n\n```\nqueue()\n.defer(d3.text, \"path/to/file/file1.txt\"\
    )\n.defer(d3.json, \"path/to/file/file2.json\")\n.defer(d3.csv, \"path/to/file/file3.csv\"\
    )\n.await(function(err, file1, file2, file3) {\n console.log(file1, file2, file3);\n\
    });\n```\n\nIn the preceding code, we see how easy it is now to deal with multiple\
    \ resources at once—super easy, thanks to Mike Bostock.\n\n> More information\
    \ about queue.js can be found on the Github page of the project at https://github.com/mbostock/queue.\n\
    \n# # Types of geographic visualization\n\nAccording to the values and quantities\
    \ that we want to display, we can choose from various visualizations that can\
    \ best represent the data. Usually, we choose between line charts, bar charts,\
    \ area charts (normal or stacked), pie charts, scatter plots, and so on."
  merge: -1
  img_proc: true
- pgno: 192
  md: 'It is easy to understand that the same is true for cartographic visualizations.
    Besides choosing the type of projection that can represent our data properly,
    we can also choose between the different types of visualization. This section
    gives an overview of the most common types of cartographic visualization.


    Okay, I have talked enough about the theory – let''s draw some maps!


    # Symbol maps


    Our first map will be a simple symbol map as the one in the following figure.
    We want to display all earthquakes from the US recorded during the last 30 days;
    the dataset is taken from http://earthquake.usgs.gov/:


    ![](img/72559bd4713b2b89631dcca187d7e2db_192_0.png)


    A simple Symbol map


    As we can see in the preceding figure, we want to display differently sized and
    colored points for each earthquake according to its magnitude. Let''s start and
    set up a simple template with d3, TopoJSON, Queue.js, and a simple responsive
    SVG container:


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <script src="bower_components/d3/d3.min.js"></script>

    ```'
  merge: -1
  img_proc: true
- pgno: 193
  md: "```\n<script src=\"bower_components/topojson/topojson.js\"></script>\n<script\
    \ src=\"bower_components/queue-async/queue.min.js\"></script>\n<style></style>\n\
    </head>\n<body>\n\n<script>\n\nvar padding = 10,\n  body = d3.select(\"body\"\
    ),\n  width = body.node().clientWidth - padding,\n  aspectRatio = 16.0 / 9.0,\n\
    \  height = width / aspectRatio;\n\nvar svg = d3.select(\"body\").append(\"svg\"\
    )\n  .attr(\"width\", width)\n  .attr(\"height\", height);\n\n// The visualization\
    \ code goes here\n</script>\n</body>\n</html>\n```\n\nIn the preceding code, we\
    \ get the size of the browser window using the `clientWidth` property and define\
    \ an aspect ratio of 16/9 for the map. We will also use this setting for the other\
    \ examples.\n\nFirst, we need to create a projection and draw the map; we will\
    \ translate and scale the projection to show the map on the full width of the\
    \ container (note that the scale is interpreted differently in different projections):\n\
    \n```\nvar projection = d3.geo.albersUsa()\n  .scale(width)\n  .translate([width\
    \ / 2, height / 2]);\n```\n\nNext, we can also create the path generator using\
    \ the projection:\n\n```\nvar path = d3.geo.path()\n  .projection(projection);\n\
    ```\n\nLet's use a simple linear color scale from orange to red values:\n\n```\n\
    var color = d3.scale.linear()\n  .interpolate(d3.interpolateRgb)\n  .domain([0.1,\
    \ 5])\n  .range(['#FFCC66', '#FF0000']);\n```"
  merge: -1
