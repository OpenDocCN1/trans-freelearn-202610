- pgno: 32
  md: "The only problem in the previous example is that, by default (box-sizing: content-box),\
    \ the padding size of the columns adds up with the width property to determine\
    \ the computed width of the element. The total width of all elements plus the\
    \ padding sizes would give a number bigger than 100% of the parent element. Using\
    \ the box-sizing: border-box property, we can disable this behavior and the computed\
    \ width of the element equals the width property:\n\n```\n[class*=\"col-\"] {\n\
    \  -webkit-box-sizing: border-box;\n  -moz-box-sizing: border-box;\n  box-sizing:\
    \ border-box;\n}\n```\n\nFinally, we need to clear the text-wrapping property\
    \ of the columns after each row. We can do this by adding a clearfix pseudo element\
    \ after each .row class:\n\n```\n.row:after {\n  content: \" \";\n  display: block;\n\
    \  clear: both;\n}\n```\n\nThis is already a nice implementation of a basic grid\
