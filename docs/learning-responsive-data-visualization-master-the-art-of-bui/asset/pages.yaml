- pgno: 37
  md: "```\n<div class=\"col-lg-3 col-md-6 col-sm-12\"></div>\n</div>\n<div class=\"\
    row\">\n...\n</div>\n</div>\n```\n\n# # Hiding elements on different screen resolutions\n\
    \nBootstrap also provides very handy and responsive utility classes to hide elements\
    \ on certain browser widths. The classes are named according to the Media Query\
    \ breakpoints:\n\n+   * .hidden-xs\n+   * .hidden-sm\n+   * .hidden-md\n+   *\
    \ .hidden-lg\n\nHiding an element on a phone in portrait mode is as simple as\
    \ adding a class to the element; let's take a look at the following example:\n\
    \n```\n<ul class=\"nav\">\n    <li><a href=\"#menu\">Menu</a></li>\n    <li class=\"\
    hidden-xs\"><a href=\"#link\">Link</a></li>\n</ul>\n```\n\nThe classes for showing\
    \ elements on certain browser widths come for each breakpoint in three different\
    \ variations depending on the CSS display property of the element:\n\n+   * .visible-*-block\n\
    +   * .visible-*-inline\n+   * .visible-*-inline-block\n\n> The reason for these\
    \ additional types is undesired line breaks and behaviors that occur when the\
    \ display mode changes from none to block. Therefore, Bootstrap forces the user\
    \ to specify the display property via the class name."
  merge: -1
  img_proc: true
- pgno: 38
  md: "For these three blocks, all the breakpoint classes are available:\n\n+   -\
    \ .visible-xs-*\n+   - .visible-sm-*\n+   - .visible-md-*\n+   - .visible-lg-*\n\
    \nDisplaying an element only on a specific device width is also very simple:\n\
    \n```\n<ul class=\"nav\">\n  <li><a href=\"#menu\">Menu</a></li>\n  <li class=\"\
    visible-xs-block\"><a href=\"#link\">Link</a></li>\n</ul>\n```\n\n> Bootstrap\
    \ 4 provides only the .hidden-*-down and .hidden-*-up classes across all the breakpoints\
    \ to the hide elements of certain device types.\n\n# # Using Bootstrap's Media\
    \ Queries in LESS\n\nBootstrap's stylesheet is written in LESS and we can make\
    \ use of the predefined breakpoints and Media Queries easily.\n\n> LESS is a CSS-like\
    \ preprocessor language used to write stylesheets that support nesting, variables,\
    \ functions, mixins, and much more. LESS files are compiled to CSS files during\
    \ the development via the LESS compiler. If you've never heard about LESS, it\
    \ is a good time to check it out via http://lesscss.org/.\n\nMake sure you have\
    \ the LESS compiler installed; this can be done by running the following command\
    \ from the terminal:\n\n```\nnpm install -g less\n```\n\nFirst, we create a style.less\
    \ file and import Bootstrap's variables.less file at the beginning of the file.\
    \ This enables us to reuse Bootstrap's declarations for colors, dimensions, and\
    \ configurations throughout this file:\n\n```\n/ * style.less * /\n@import \"\
    bower_components/bootstrap/less/variables.less\";\n```"
  merge: -1
  img_proc: true
- pgno: 39
  md: "Now, we can use Bootstrap's Media Query breakpoints in our LESS file. Let's\
    \ add some device-specific padding to all the div containers:\n\n```\n/* Extra\
    \ small devices */\n/* No media query since this is the default in Bootstrap */\n\
    div {\n\tpadding: 4em;\n}\n\n/* Small devices */\n@media (min-width: @screen-sm-min)\
    \ {\n\tdiv {\n\t\tpadding: 8em;\n\t}\n}\n\n/* Medium devices */\n@media (min-width:\
    \ @screen-md-min) {\n\tdiv {\n\t\tpadding: 16em;\n\t}\n}\n\n/* Large devices */\n\
    @media (min-width: @screen-lg-min) {\n\tdiv {\n\t\tpadding: 24em;\n\t}\n}\n```\n\
    \nNow, we use the LESS compiler to compile the stylesheet with CSS by running\
    \ the following command in the terminal:\n\n```\nlessc style.less style.css\n\
    ```\n\nThe resulting CSS looks similar to this:\n\n```\n/* Extra small devices\
    \ */\n/* No media query since this is the default in Bootstrap */\ndiv {\n\tpadding:\
    \ 4em;\n}\n/* Small devices */\n@media (min-width: 768px) {\n\tdiv {\n```"
  merge: -1
  img_proc: true
- pgno: 40
  md: "```\npadding: 8em;\n}\n}\n/* Medium devices */\n@media (min-width: 992px) {\n\
    \    div {\n        padding: 16em;\n    }\n}\n/* Large devices */\n@media (min-width:\
    \ 1200px) {\n    div {\n        padding: 24em;\n    }\n}\n}\n```\n\nPerfect! This\
    \ means that we can now use the predefined breakpoints in our LESS styles.\n\n\
    Sometimes, it is also necessary to limit your styles to a narrow set of devices.\
    \ Therefore, one can also use the max-width Media Queries in LESS. Again, the\
    \ following code snippet is taken from the Bootstrap documentation at http://getbootstrap.com/css/#grid-media-queries:\n\
    \n```\n@media (max-width: @screen-xs-max) { ... }\n@media (min-width: @screen-sm-min)\
    \ and (max-width: @screen-sm-max) {\n... }\n@media (min-width: @screen-md-min)\
    \ and (max-width: @screen-md-max) {\n... }\n@media (min-width: @screen-lg-min)\
    \ { ... }\n```\n\nThis can be useful when we want to define styles for a single\
    \ device type rather than all the devices with a screen width greater than or\
    \ equal to the defined one.\n\n# Vector graphics in the browser with SVG\n\nNow,\
    \ it is time to create our first visualization. In HTML5, we have plenty of options\
    \ to create graphics in the browser itself:\n\n+   - Canvas API (or using, for\
    \ example, Paper.js, Processing.js, and more)\n+   - WebGL API (or using, for\
    \ example, Three.js, Pixi.js, and more)\n+   - SVG specification (or using for\
    \ example RaphaëlJS, D3.js, and more)"
  merge: -1
