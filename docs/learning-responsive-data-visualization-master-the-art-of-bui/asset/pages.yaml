- pgno: 116
  md: '# The conclusion of using resize events


    This is the most flexible solution, and therefore, in many situations, it is the
    solution of choice. However, you need to be aware that there are also certain
    drawbacks in using this solution:


    +   - There is no easy way to listen for resize events of the parent container

    +   - We need to add event listeners

    +   - We need to make sure that event listeners are removed properly

    +   - We need to manually redraw the chart


    # Using Bootstrap''s Media Queries


    As we already discussed in the first chapter, Bootstrap is an awesome library
    that gets you started quickly with new projects. It includes not just huge amounts
    of useful HTML components, but also normalized and standardized CSS styles. A
    particular one is the implementation of Media Queries for four typical device
    types (five types in Bootstrap 4). In this section, we will take a look at how
    to make use of these Media Queries in our styles and scripts. A great thing about
    Bootstrap is that it successfully standardizes the typical device dimensions for
    web developers; thus, beginners can simply use them without rethinking over and
    over which pixel width could be the most common one for tablets.


    # Media Queries in CSS


    The quickest way to use Bootstrap''s Media Queries is to simply copy them from
    the compiled source code. The queries look as follows:


    ```

    /* Extra small devices (phones, etc. less than 768px) */

    /* No media query since this is the default in Bootstrap */


    /* Small devices (tablets, etc.) */

    @media (min-width: 768px) { ... }


    /* Medium devices (desktops, 992px and up) */

    @media (min-width: 992px) { ... }


    /* Large devices (large desktops, 1200px and up) */

    @media (min-width: 1200px) { ... }

    ```


    We can easily add these queries to our CSS styles and define certain properties
    and styles for our visualizations, such as four predefined widths, aspect ratios,
    spacing, and more to adapt the chart''s appearance to the device type of the user.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Bootstrap 4 is currently in alpha; however, you can already start using the
    predefined device types in your CSS. The reason I am strongly arguing for Bootstrap
    4 is due to its shift toward the em units instead of pixels:


    ```

    // Extra small devices (portrait phones, etc.)

    // No media query since this is the default in Bootstrap

    ```


    ```

    // Small devices (landscape phones, etc.)

    @media (min-width: 34em) { ... }

    ```


    ```

    // Medium devices (tablets, etc.)

    @media (min-width: 48em) { ... }

    ```


    ```

    // Large devices (desktops, etc.)

    @media (min-width: 62em) { ... }

    ```


    ```

    // Extra large devices (large desktops, etc.)

    @media (min-width: 75em) { ... }

    ```


    Once again, the huge benefit of this is that the layout can adapt when the user
    increases the font size of the browser to enhance readability.


    # Media Queries in LESS/SASS


    In Bootstrap 3, you can include Media Query mixins to your LESS file, which then
    gets compiled to plain CSS.


    To use these mixins, you have to create a LESS file instead of CSS and import
    the Bootstrap variables.less file. In this file, Bootstrap defines all its dimensions,
    colors, and other variables. Let''s create the style.less file and import variables.less:


    ```

    // style.less

    @import "bower_components/bootstrap/less/variables.less";

    ```


    Perfect, that''s all. Now, we can go ahead and start using Bootstrap''s device
    types in our LESS file:


    ```

    /* Extra small devices (phones, etc. less than 768px) */

    /* No media query since this is the default in Bootstrap */

    ```


    ```

    /* Small devices (tablets, etc.) */

    @media (min-width: @screen-sm-min) { ... }

    ```


    ```

    /* Medium devices (desktops, etc.) */

    ```'
  merge: -1
  img_proc: true
- pgno: 118
  md: "```\n@media (min-width: @screen-md-min) { ... }\n\n/* Large devices (large\
    \ desktops, etc.) */\n@media (min-width: @screen-lg-min) { ... }\n```\n\nFinally,\
    \ we need to use a LESS compiler to transform our `style.less` file to plain CSS.\
    \ To achieve this, we run the following command from the terminal:\n\n```\nlessc\
    \ styles.less styles.css\n```\n\nAs we can see, the command requires the LESS\
    \ compiler called `lessc` being installed. If it’s not yet installed on your system,\
    \ go ahead and install it:\n\n```\nnpm install -g less\n```\n\n> If you are new\
    \ to LESS, I recommend you to read through the LESS documentation on http://lesscss.org/.\
    \ Once you check out LESS, you can also look at the very similar SASS format,\
    \ which is favored by Bootstrap 4. You can find the SASS documentation at http://sass-lang.com/.\n\
    \nWe can use the Bootstrap 4 Media Queries in a SASS file by the following mixins:\n\
    \n```\n@include media-breakpoint-up(xs) { ... }\n@include media-breakpoint-up(sm)\
    \ { ... }\n@include media-breakpoint-up(md) { ... }\n@include media-breakpoint-up(lg)\
    \ { ... }\n@include media-breakpoint-up(xl) { ... }\n```\n\nIn my opinion, including\
    \ Bootstrap’s LESS/SASS mixins to the styles of your visualization is the cleanest\
    \ solution, because you always compile your CSS from the latest Bootstrap source,\
    \ and you don’t have to copy CSS into your project.\n\n# # Media Queries in JavaScript\n\
    \nAnother great possibility of using Bootstrap’s Media Queries to adapt your visualization\
    \ to the user’s device is to use them directly in JavaScript. The native `window.matchMedia\
    \ (mediaQuery)` function gives you the same control over your JavaScript as Media\
    \ Queries gives us over CSS.\n\nHere is a little example on how to use it:\n\n\
    ```\nif (window.matchMedia(\"(min-width: 1200px)\").matches) {\n /* the viewport\
    \ is at least 1200 pixels wide */\n} else {\n /* the viewport is less than 1200\
    \ pixels wide */\n}\n```"
  merge: -1
  img_proc: true
- pgno: 119
  md: 'In the preceding code, we see that this function is quite easy to use and adds
    almost infinite customization possibilities to our visualization.


    ![](img/72559bd4713b2b89631dcca187d7e2db_119_0.png)


    However, besides using the watchMedia function directly, we can also use a wrapper
    around the native API call. I can recommend the enquire.js library by Nick Williams,
    which allows you to declare event listeners for viewport changes. It can be installed
    via package manager bower by running the following command from the terminal:


    ```

    bower install enquire

    ```


    Then, we need to add enquire.js to the website and use:


    ```

    enquire.register("screen and (min-width:1200px)", {


    // triggers when the media query matches.

    match : function() {

    /* the viewport is at least 1200 pixels wide */

    },


    // optional; triggers when the media query transitions

    unmatch : function() {

    /* the viewport is less than 1200 pixels wide */

    },


    });

    ```


    In the preceding code, we see that we can now add the match and unmatch listeners
    almost in the same way as listening for resize events, it''s just much more flexible.


    ![](img/72559bd4713b2b89631dcca187d7e2db_119_1.png)


    If we would like to use the Bootstrap device types, we could easily implement
    them (as needed) with enquire.js and trigger events for each device type. However,
    I prefer being very flexible and using the bare wrapper.'
  merge: -1
  img_proc: true
- pgno: 120
  md: "# Using Bootstrap's grid system\n\nAnother great and quick way to make your\
    \ charts responsive and play nicely together with Bootstrap is to integrate them\
    \ into Bootstrap's grid system. The best and cleanest integration, however, is\
    \ to separate concerns and make the visualization as general and adaptive as possible.\n\
    \nLet's take our bar chart example with the custom resize events and integrate\
