    # Integration testing using Protractor and Selenium


    Integration tests require all the components from the system that are under tests
    to work as if a user would interacting with the component. Therefore, we need
    to use a different test runner that can start, stop, and connect to browsers,
    open URLs, deal with asynchronous code, and extract information about the elements.


    In this book, we will also use the Integration testing tool from the AngularJS
    team: Protractor. It is based on Webdriver and Selenium and therefore very powerful
    when interacting with different browsers and instances.


    We can install Protractor by running the following command from the command line:


    ```

    npm install -g protractor

    ```


    Once Protractor is installed, we have to also install Webdriver. One can do this
    by running the following:


    ```

    webdriver-manager update

    ```'
