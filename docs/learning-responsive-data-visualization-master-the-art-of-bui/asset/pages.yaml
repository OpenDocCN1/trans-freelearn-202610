    We observe that the image simply scales without changing the aspect ratio and
    the representation of the data. Thus, due to the simple scaling, the tick labels
    overlap on the bigger chart.


    # ## Preserving the Aspect Ratio


    If we intend to modify the aspect ratio of the scaled image, we can do so. We
    can additionally set the `preserveAspectRatio` attribute to `none` or some other
    values to scale the image with other aspect ratios than the xMidYMid default:


    ```

    var $svg = d3.select(chart).append(''svg'')

    .attr(''viewBox'', ''0 0 '' + width + '' '' + height)

    .attr(''preserveAspectRatio'', ''none'');

    ```'
