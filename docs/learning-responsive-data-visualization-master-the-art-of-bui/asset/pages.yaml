- pgno: 221
  md: '# A testing strategy for visualizations


    Now, we have enough information to build a solid testing strategy for responsive
    visualizations. Note that this is a very opinionated setup based on my experience,
    and feel free to exchange any layer or tool with your favorite ones. However,
    keep the general ideas for your workflow.


    First, we will use the Chrome browser on the desktop PC while developing. We either
    use a normal desktop window or we switch to a mobile view in the device mode.
    This depends on the target screen size and resolution. Personally, I prefer to
    work in a desktop Chrome and debug and test on mobiles.


    While developing, we need to regularly do some manual testing to make sure our
    visualization looks and feels nice. Running emulators for different operating
    systems locally is a pain; that''s why I prefer syncing a real mobile phone and
    a tablet via Browsersync to my current Chrome window. If you don''t have access
    to real devices, you can also use Browserstack on your local project.


    For unit tests, we need to start a Karma unit runner before we start making changes.
    This will watch source files for changes, fire up a PhantomJS instance, and run
    the complete test suite whenever a file is saved.


    Once we push a commit to Github, TravisCI automatically runs all unit tests locally
    and integration tests on different mobile devices using Sauce Lab. This will also
    create different images for the visual regression test and show them to the developer.


    Finally, a feature or fix can be merged into the master when all tests have passed,
    and the developer accepts the different images of the visual regression.


    # Summary


    This chapter gives a solid overview on different testing strategies for testing
    responsive visualization components. In the first section, we spoke about the
    testing strategies, costs, and benefits of testing and the difference between
    local, remote, manual, and automated tests.


    Then, we go through different testing strategies and understand how they can be
    implemented for the visualization. We cover manual testing using Browsersync and
    Browserstack, as well as automated testing using TravisCI, Karma, Protractor,
    and Selenium. Finally, we will build our perfect testing strategy for visualization
    components.


    In the next chapter, you will learn about detecting and solving cross-browser
    issues when creating responsive visualizations in SVG.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Solving Cross-Browser Issues


    In the previous chapter, you learned all about testing the custom responsive visualizations
    in different browsers. We have to do this because, across different devices, operating
    systems, and browsers, the appearance and functionality of our application can
    vary. In this chapter, we will tackle these cross-browser issues. You will learn
    the following:


    +   - Understanding the main challenges of cross-browser compatible visualizations

    +   - Using Modernizr to detect the feature support of the user''s browser

    +   - Learning about Polyfills, Shims, and Wrappers

    +   - Understanding the compatibility of D3

    +   - Implementing a cross-browser responsive design

    +   - Understanding the matchMedia polyfill

    +   - Polyfill min-width and max-width with Respond.js

    +   - Implementing your Media Queries in JavaScript using Enquire.js

    +   - Learning about the compatibility of SVG features

    +   - Understanding compatibility for mouse and touch events

    +   - Understanding the execution chain of touch events

    +   - Building touch-friendly visualizations


    First, we will look into general cross-browser compatibility problems and find
    ways how to solve them. From simple conditional comments for Internet Explorer,
    we will progress to complex feature detection in JavaScript and CSS using Modernizr.
    You will understand common concepts to solve cross-browser issues, such as Polyfills,
    Shims, and Wrappers.'
  merge: -1
  img_proc: true
- pgno: 223
  md: "In the second section, you will learn about cross-browser compatible Media\
    \ Queries and understand the problem of CSS polyfills. Then, we will look into\
    \ the different solutions of this problem using Respond.js (a min-width max-width\
    \ polyfill) and Enquire.js, a library to organize your Media Queries in JavaScript.\n\
    \nNext, we will take a look at the support of special SVG features that are not\
    \ included in the 1.1 specification, such as animations, filters, and the clipping\
    \ path.\n\nIn the last section, you will learn how to handle touch and mouse inputs\
    \ properly on devices that support both mouse and touch inputs. We will see some\
    \ common pitfalls, touch events, and how both touch and mouse events can be supported\
    \ for your application.\n\n# A solution to cross-browser compatibility issues\n\
    \nThe real challenge of developing web applications is not about implementing\
    \ awesome features, animations, or transitions, but it is about providing a first-class\
    \ user experience and compatibility for all target devices, operating systems,\
    \ and browsers. In this chapter, we will try to solve the most common compatibility\
    \ issues and make your visualization cross-browser compatible.\n\n# Conditional\
    \ comments for Internet Explorer\n\nA great tool in every web developer's toolbox\
    \ for solving compatibility issues is conditional comments for HTML. These are\
    \ the HTML comments that can contain valid HTML code, which are interpreted and\
    \ executed by Internet Explorer. Wait a second, a cool feature that is only available\
    \ in Internet Explorer? Well, it turns out that these conditional HTML comments\
    \ are not necessary in modern web browsers as these browser rather implement the\
    \ proper standard than proprietary features.\n\nHence, conditional comments are\
    \ a great way for the lost souls targeting Internet Explorer to load resources,\
    \ depending on the browser version. Let's take a look at an easy example where\
    \ we load a compatibility script only for Internet Explorer with version less\
    \ than or equal to 9:\n\n```\n<!doctype HTML>\n<html>\n<head>\n\t<title>Conditional\
    \ Comments</title>\n\t<!--[if lte IE 9]>\n\t<script src=\"compatibility_script.js\"\
    ></script>\n\t<![ENDIF]-->\n```"
  merge: -1
  img_proc: true
- pgno: 224
  md: '```

    <script src="some_script.js"></script>

    </head>

    <body>

    </body>

    </html>

    ```


    In the preceding example, we can see that <!- [if lte IE 9]>...<! [ENDIF] -> represents
    a valid HTML comment that turns into a conditional HTML node in Internet Explorer.


    The syntax allows only the <!- [if ... ]> and <! [ENDIF] -> keywords and a small
    variety of expressions, conditions, and operators. The following operators are
    allowed to identify the browser version:


    +   • ! not operator, for example, [if !IE]

    +   • lt less-than operator, for example, [if lt IE 5.5]

    +   • lte less-than or equal operator, for example, [if lte IE 6]

    +   • gt greater-than operator, for example, [if gt IE 5]

    +   • gte greater-than or equal operator, for example, [if gte IE 7]

    +   • ( ) subexpression operator, for example, [if !(IE 7)]

    +   • & and operator, for example, [(gt IE 5)&(lt IE 7)]

    +   • | or operator, for example, [(IE 6)|(IE 7)]


    ![](img/72559bd4713b2b89631dcca187d7e2db_224_0.png)


    # Detecting native features with Modernizr


    The key challenge of designing responsive applications is to properly adapt the
    application to the form factor (the screen size and resolution) of the user''s
    device. Knowing the form factor and making use of native tools, such as Media
    Queries, facilitates creating very responsive applications. Whenever native implementations
    are available, we want to use them; whenever we can implement something in CSS
    instead of JavaScript, we want to do so to gain the important performance boost.
    Hence, if we want to support not just the latest browsers, we need to be able
    to detect whether a native feature is available or not.'
  merge: -1
  img_proc: true
- pgno: 225
  md: "One might ask how a certain feature can be detected on a user's browser. One\
    \ simple way is to check if an API is available, which is similar to the following\
    \ example. We check if the native function called Array.prototype.every is available:\n\
    \n```\nif ('every' in Array.prototype) {\n    console.log('Array.prototype.every\
    \ is available');\n}\n```\n\nThe preceding code can be easily generalized to test\
    \ against different objects and API functions. However, what if we would like\
    \ to know if the in keyword is available in our browser? Or if arrow functions\
    \ are supported? This works slightly differently; we have to evaluate the expression\
    \ in the try-catch block. Here is an example to test whether arrow functions are\
    \ currently available:\n\n```\nfunction hasArrow() {\n    try {\n        eval('()\
    \ =>{}');\n    } catch (err) {\n        return false;\n    }\n    return true;\n\
    }\n```\n\nUsing this technique, we can extend this to a magnitude of different\
    \ features and APIs and check whether these are available or not. However, we\
    \ are very lazy and don't want to implement all of them. Luckily, there is a wonderful\
    \ library called Modernizr that does all this for us and additionally provides\
    \ an easy-to-use, class-based method for feature detection in CSS.\n\nFirst, we\
    \ are going to install Modernizr; however, this is not a straightforward process.\
    \ There is no global Mordernizr.js file that lets you check every feature available\
    \ in the target browser. Moreover, you have to build your (small) version of Modernizr\
    \ yourself. Sounds complicated, but it really isn't. First, install Modernizr\
    \ globally using npm via this command (you might need sudo rights):\n\n```\nnpm\
    \ install -g modernizr\n```\n\nNow, we can create the modernizr-config.json file\
    \ that stores the modernizer configuration of our project. We set up the configuration\
    \ file for SVG features; however, feel free to add more features to your configuration\
    \ (check the available options via the link https://modernizr.com/download and\
    \ click on BUILD to create your configuration file."
  merge: -1
  img_proc: true
- pgno: 226
  md: "![](img/72559bd4713b2b89631dcca187d7e2db_226_0.png)\n\nThe Modernizr website\n\
    \nWe create a configuration file for basic Canvas and SVG support as well as additional\
    \ SVG features:\n\n```\n{\n    \"minify\": true,\n    \"options\": [\n       \
    \ \"setClasses\"\n    ],\n    \"feature-detects\": [\n        \"test/canvas\"\
    ,\n        \"test/svg\",\n        \"test/svg/asimg\",\n        \"test/svg/clippaths\"\
    ,\n        \"test/svg/filters\",\n        \"test/svg/foreignobject\",\n      \
    \  \"test/svg/inline\",\n        \"test/svg/smil\"\n    ]\n}\n```"
  merge: -1
  img_proc: true
- pgno: 227
  md: "Finally, we can build our custom Modernizr feature detection script using this\
    \ command:\n\n```\nmodernizr -c modernizr-config.json\n```\n\nYou can also use\
    \ the -d scripts/modernizr.min.js flag to change the installation destination\
    \ of the Modernizr script to the scripts folder. Let's create an HTML document\
    \ that includes this script:\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n    <title>Feature\
    \ Detection using Modernizr</title>\n    <script src=\"scripts/modernizr.min.js\"\
    ></script>\n</head>\n<body>\n\n<script>\n/* here we go * /</script>\n\n</body>\n\
    </html>\n```\n\nThe preceding code shows how we included the Modernizr script\
    \ on the page. Note that, besides using the command-line tool of Modernizr and\
    \ the configuration file, you may also use a plugin for your favorite task runner\
    \ (such as Gulp or Grunt) or simply download your custom build from the Modernizr\
    \ website.\n\n# Using Modernizr in JavaScript\n\nLet's try Modernizr's JavaScript\
    \ API; it exposes all available features directly as properties on the global\
    \ Modernizr object. Checking for SMIL support is as easy as the following code\
    \ snippet:\n\n```\nif (Modernizr.smil) {\n    console.log('SMIL is available');\n\
    }\n```\n\nThis is great; we can now easily check in JavaScript whether all our\
    \ features are available and easily adapt the application and features to the\
    \ target browser of the user.\n\n> The complete list of available features is\
    \ provided on the Modernizr website at https://modernizr.com/docs/#features."
  merge: -1
  img_proc: true
- pgno: 228
  md: "# # Using Modernizr in CSS\n\nUsing Modernizr in JavaScript is great to adapt\
    \ functions and scripts according to the features of the target browser. However,\
    \ when we are dealing with HTML elements rather than JavaScript, we might want\
    \ to use CSS classes to show and hide DOM elements based on the available features\
    \ of the browser.\n\nIn the previous example, we added one option to the configuration\
    \ file, which is called setClasses. This option adds classes to the HTML root\
    \ node for every supported and unsupported feature. We can observe this by looking\
    \ into the DOM tree of the demo page that is displayed in the following figure:\n\
    \n```\n<html class= canvas svg svgasing img svgclippaths svgfilters svgforeignobject\
    \ inlinesvg smil\n> <head>~</head\n> <body\n> <script>~</script\n</body>\n</html>\n\
    ```\n\nThe DOM tree of the website using Modernizr\n\nIn the preceding example,\
    \ we see only the supported features named as classes on the root HTML node. Unsupported\
    \ features will result in a class with a prefix called no-, for example, no-canvas,\
    \ no-svg, and so on. Now, we can add CSS styles to our visualization to show and\
    \ use available features or hide the unsupported functionality:\n\n```\n.no-svg\
    \ .chart {\n  display: none;\n}\n\n.no-svg .sorry-for-not-using-a-modern-browser\
    \ {\n  display: block;\n}\n```\n\nIn the preceding snippet, we remove the charts\
    \ from the page and display an error message to the user that asks him/her to\
    \ update to a modern browser. However, often we don't simply want to disable a\
    \ functionality for a user on a non-compatible browser. Moreover, we want to add\
    \ the missing functionality to the user's browser so that he/she can get a user\
    \ experience that is similar to using the latest browser. Find out more about\
    \ this in the following section.\n\nWe will use Modernizr class-based feature\
    \ detection for the styling of our application more often than for detecting the\
    \ SVG or Canvas support. Just think about a scenario where you want to animate\
    \ some parts of your visualization using CSS3 animations. The advantage is clear:\
    \ you will have the power of native animations in CSS instead of using manual\
    \ timers and DOM transformations in JavaScript."
  merge: -1
  img_proc: true
- pgno: 229
  md: "Therefore, we can include a CSS3-specific animation option in the configuration\
    \ file, such as `cssanimations`, `cstransforms`, `cstransforms3d`, `preserve3d`,\
    \ and more, and check for the availability of these features. Now, we can create\
    \ native animations in CSS and create a fallback solution if CSS transitions are\
    \ not supported:\n\n```\n@keyframes fadeIn {\n    from {opacity: 0.0;}\n    to\
    \ {opacity: 1.0;}\n}\n```\n\n```\n.cssanimations .chart {\n    animation-name:\
    \ fadeIn;\n    animation-duration: 4s;\n}\n```\n\nAs a JavaScript fallback solution,\
    \ we add the following script:\n\n```\n<script>\nd3.selectAll('.no-cssanimations\
    \ .chart')\n    .transition()\n    .duration(4000)\n    .style('opacity', 1.0);\n\
    </script>\n```\n\nNaturally, we can also use the Modernizr JavaScript syntax,\
    \ which is slightly more explicit:\n\n```\n<script>\nif (!Modernizr.csstransitions)\
    \ {\n    d3.selectAll('.chart')\n    .transition()\n    .duration(4000)\n    .style('opacity',\
    \ 1.0);\n}\n</script>\n```\n\nWe can now provide a trade-off between user-experience,\
    \ compatibility, and performance for our visualization by adapting to the features\
    \ of the target browser. Note that this trade-off comes at a cost–having multiple\
    \ redundant pieces of code in your application that need to be tested and maintained.\n\
    \n# Custom implementations of native features\n\nThere are three options for developers\
    \ if a native feature is not available on a target platform or device:\n\n+  \
    \ • Drop the piece of code that uses the native feature"
  merge: -1
  img_proc: true
- pgno: 230
  md: '+   - Drop support for the browser that does not have the native feature

    +   - Use a custom implementation of the native feature


    Not using the feature at all is obvious and not the preferred way most often.
    Developers want to take advantage of modern browsers and their capabilities to
    provide better performance and best features.


    Excluding some browser only because a tiny missing bit of native code is also
    frustrating. Don''t get me wrong, I am not speaking about supporting IE7. New
    native features mostly arrive in one JavaScript engine first with a prefix (such
    as moz, webkit, ms, and more) before they are available across all modern browsers
    without prefix. This process usually takes a couple of years, and it''s not guaranteed
    that all features will be implemented in all engines.


    # Polyfill – implementing missing features


    We want to include native features without breaking the backward compatibility
    of our application to older browsers and different JavaScript engines. This can
    be done by implementing the native feature yourself in JavaScript and using it
    as a fallback solution whenever the native feature is not available — this is
    a so-called polyfill.


    Note that there is, of course, a big difference of polyfilling different native
    functions with JavaScript. A polyfill for providing ECMAScript 5 compatibility
    by implementing array methods, such as forEach, indexOf, map and more, is much
    easier to include than a polyfill for the complete SVG 1.1 specification or the
    CSS Media Query specification.


    A polyfill is usually a function that implements a native feature for a JavaScript
    engine that does not support this feature. If we speak in terms of supporting
    entire APIs, such as the previously mentioned SVG or Media Query specifications,
    we usually speak about abstraction layers rather than polyfills. Here is an example
    (slightly outdated): Internet Explorer 8 and lower versions don''t support the
    SVG specification but their own Vector Markup Language (VML). To use vector graphics
    in these browsers, you have to use an abstraction layer that provides a consistent
    API and generates SVG or VML, depending on the user''s browser; RaphaëlJS would
    be such an abstraction for SVG.


    > A list of popular polyfills can be found in the WIKI of the Modernizr project
    on Github at https://github.com/Modernizr/Modernizr/wiki/HTML5-Cross-Browser-Polyfills.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Shims – intercepting API calls


    If you look for resources about cross-browser compatibility on the Internet, you
    will be confronted with many different terms that are all used in a similar way.
    Shim is one of these terms that is used very often in combination with polyfills.


    A Shim is a general expression of a piece of code that intercepts a native API
    call – for example, a function – to provide a modified behavior of this function.
    This behavior can range from implementing the function, modifying the parameter
    list, and adapting the return values, to anything you can think of. Hence, a Polyfill
    is a Shim that implements the missing functionality of older browsers.


    # Wrappers – abstracting APIs


    I need to apologize for speaking again about IE8– this topic was very popular
    when SVG gained importance. Polyfilling the SVG API for IE8 would be madness and
    would often lead to incompatibilities. Therefore, it is much better to implement
    a Wrapper at the top of both APIs.


    A Wrapper abstracts the behavior of an API, such as SVG, and provides a higher-level
    API to the developer. The goal is to be able to change the underlying technology
    of the wrapper to output for example VML instead of SVG in order to create cross-browser
    vector graphics without modifying the API for the developer.


    # Compatibility of D3


    One might ask how compatible D3 is as a library; however, this question has no
    easy answer. D3 is a library for DOM transformations designed to use the underlying
    technologies such as CSS, HTML, and SVG. It is only the supporting framework that
    lets you access native APIs and features. Of course, the user is not forced to
    use SVG with D3 but could just as well use Canvas. The user can use only map projections,
    the event system, or scales. Therefore, we have to be a bit more general when
    speaking about the cross-browser compatibility of D3.


    > Many of D3''s internal features, such as scales, timers, colors, interpolations,
    and more, are available as extra packages on Github at `https://github.com/d3`.
    This comes handy when you only need a certain piece of D3''s power for your application.


    If you use D3, you will have to check the compatibility of the underlying technologies
    that you are using in your application. If you use D3 to manipulate SVG, you will
    have to check the SVG compatibility; and if you use the SMIL check for SMIL compatibility,
    if you use Canvas, and so on. You see where this is going.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'If you just feel like using single pieces of D3 and are wondering about the
    compatibility of the internal core, then you have to check the compatibility of
    ES5 Array functions. The following screenshot shows the cross-browser support
    for ES5 in general. One can see that IE8 is the trouble maker:


    ![](img/72559bd4713b2b89631dcca187d7e2db_232_0.png)


    The cross-browser compatibility of ES5 (source http://caniuse.com/#feat=es5)


    The recommended polyfill to use D3 functionalities in IE8 and IE7 (Heaven forbid!)
    is the `Aight` library, which mostly includes ES5 Array functions and APIs. The
    library can be found on Github via `https://github.com/shawnbot/aight`.


    # Cross-browser Media Queries


    When creating cross-browser responsive visualizations, you will most likely have
    to deal with the Media Query support, measurement, and unit issues. The last two
    can be easily detected and fixed using Modernizr (`cssvhunit`, `cssvmaxunit`,
    `cssvminunit`, `cssvwunit`, and more) and fallback solutions.


    However, fixing the Media Query support once it is not available is quite tricky.
    Why is that? If detecting the availability of Media Queries is quite easy (using
    Modernizr), polyfilling it is a big hassle. The main reason is that Media Queries
    usually occur in your CSS styles and not in your JavaScript code. Until now, you
    only learned that JavaScript functions and APIs can be polyfilled using JavaScript.
    So, if we would want a polyfill for CSS (it has to be written in JavaScript),
    it always has to parse the complete CSS document to extend its functionality.
    This means instead of the native styling performance, we will have to parse the
    CSS using JavaScript, apply all known styles, and fix new selectors, attributes,
    styles, and more and also apply those. This often leads to a suboptimal solution
    (performance wise).'
  merge: -1
  img_proc: true
- pgno: 233
  md: "# Window.matchMedia() and its Polyfill\n\nThe JavaScript pendant of CSS Media\
    \ Queries is the window.matchMedia() function.\nIf this function is available,\
    \ then CSS Media Queries are supported; if it’s not\navailable, we have to provide\
    \ a polyfill for the function and fix CSS styles using the\nJavaScript polyfill.\n\
    \nIn the following screenshot, we can see the support of the matchMedia function\
    \ in\ndifferent browsers. We can identify IE9 and Opera Mini 8 that are causing\
    \ problems.\nHence, if the application supports both versions, it needs to include\
    \ a polyfill for\nmatchMedia.\n\n![](img/72559bd4713b2b89631dcca187d7e2db_233_0.png)\n\
    \nThe cross-browser compatibility of matchMedia (source: http://caniuse.com/#feat=matchmedia)\n\
    \nYou can install the matchMedia polyfill by downloading the latest source or\
    \ using\nthe bower package manager and running the following command from the\
    \ terminal:\n\n```\nbower install matchmedia\n```\n\nLet’s recall the following\
    \ example from Chapter 1, Getting Started with Responsive\nDesign, Bootstrap,\
    \ and D3.js. Using the matchMedia function, we can apply some code\nonly to certain\
    \ device types in JavaScript:\n\n```\nif (matchMedia('screen and (max-width: 480px)').matches)\
    \ {\n    // user is on a smartphone\n}\n```\n\nHowever, when we look at our style\
    \ sheets, we usually find styles written in CSS,\nsuch as the following snippet:\n\
    \n```\n@media screen and (max-width: 480px) {\n    body {\n        /* user is\
    \ on a smartphone */\n    }\n}\n```\n\nAs we have already found out in the previous\
    \ chapter, we now need to use the\nmatchMedia polyfill to add the Media Query\
    \ functionality to CSS styles. The\nfollowing sections will do exactly this."
  merge: -1
  img_proc: true
- pgno: 234
  md: '# # Min-width and max-width support via Respond.js


    We know what we have to do to polyfill Media Queries for CSS; we need to load
    CSS styles with JavaScript, parse them, find the Queries, pipe them through the
    matchMedia polyfill, and then style all affected DOM elements accordingly. This
    is exactly what the Respond.js library does but only for the min-width and max-width
    queries which are seen as the bare minimum feature set for responsive apps. Respond.js
    is written and maintained by Scott Jehl and available on Github at https://github.com/scottjehl/Respond.
    The following is a screenshot of the Respond.js test runner, which can execute
    in any browser and test the functionality:


    ![](img/72559bd4713b2b89631dcca187d7e2db_234_0.png)


    Respond.js Test Suite in the browser


    You can install Respond.js by downloading the latest source or using the bower
    package manager and running the following command from the terminal:


    ```

    bower install respond

    ```'
