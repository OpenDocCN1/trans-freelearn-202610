- pgno: 41
  md: "To better understand which technology suits the best for our purpose of implementing\
    \ responsive visualizations, we need to take a closer look and discuss their advantages\
    \ and disadvantages.\n\n# # Raster/Pixel graphics with Canvas\n\nCanvas is a JavaScript\
    \ API used to create Raster Graphics (often called Pixel Graphics) in the browser.\
    \ As we can see in the following figure, it is supported in all major browsers\
    \ and Internet Explorer starting from version 9:\n\n> > You can find detailed\
    \ information about the Canvas API on MDN at https://developer.mozilla.org/en/docs/Web/API/Canvas_API.\n\
    \n![](img/72559bd4713b2b89631dcca187d7e2db_41_0.png)\n\nA Pixel Graphic is an\
    \ image that contains all the information about the color of each pixel of the\
    \ image for a certain resolution. Let's assume we have an image with 8 x 8 pixels\
    \ where each of these 64 pixels contains the information about its color; we draw\
    \ a circle in this image:\n\n```\n```html\n<canvas id=\"canvas\"></canvas>\n<script>\n\
    \  var canvas = document.getElementById(\"canvas\");\n  var ctx = canvas.getContext(\"\
    2d\");\n  var centerX = 10, centerY = 10, radius = 10;\n  ctx.beginPath();\n \
    \ ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI, false);\n  ctx.fillStyle =\
    \ \"red\";\n  ctx.fill();\n</script>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 42
  md: 'In the following figure, one can see how the so-called rasterization process
    defines which pixels of this image gets colored (pixels in the blue region) for
    the circle shape and which pixels stays transparent (pixels in the white region):


    ![](img/72559bd4713b2b89631dcca187d7e2db_42_0.png)


    Rasterization of a 8 x 8 pixel circle shape


    If we display this image with a high resolution (see the following figure at the
    left), we see a small circle with crisp edges. On the other hand, if we zoom into
    the image, we see a very pixelated 8 x 8 pixel image (see the following figure
    on the right); this effect is the direct cause of the resolution-dependent rasterization
    process:


    ![](img/72559bd4713b2b89631dcca187d7e2db_42_1.png)


    Pixel graphic, left: high resolution, right: zoomed


    This effect makes it really difficult to use Pixel Graphics for Responsive Design;
    we have to always generate and reload our visualization for the current resolution
    and screen size.


    Another drawback is that the final image is composed of pixels, which make it
    very difficult to attach event listeners, such as mouseover or click events, to
    certain components of the image. The reason for this is that there are no shapes
    or components encoded in the image but only color values for each pixel.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# # Hardware-accelerated Pixel Graphics with WebGL


    WebGL is a JavaScript API based on OpenGL ES 2 to create hardware-accelerated
    3D Pixel Graphics in the browser. This technology is very powerful and allows
    access to the client''s GPUs via so-called Shaders; the final visualization is
    exposed in the browser via the Canvas element. However, browser support is not
    very good, as we can see in the following figure; mobile devices support the API
    only partially and Internet Explorer only from version 11.


    > > You can find more detailed information about the WebGL API on MDN at https://developer.mozilla.org/en/docs/Web/API/WebGL_API.


    ![](img/72559bd4713b2b89631dcca187d7e2db_43_0.png)


    Cross-browser compatibility WebGL from http://caniuse.com/#feat=webgl


    Due to WebGL''s use of the Canvas element, it doesn''t solve any of the limitations
    of Pixel Graphics that we discussed in the Canvas section. Thus, we will look
    at a different type of image representation next.


    # # Vector graphics with SVG


    SVG is an XML specification used to create and compose Vector Graphics. Thanks
    to HTML5, these graphics can simply be embedded into an HTML page, rendered and
    displayed perfectly sharp by the browser in every screen resolution. As we can
    see in the following figure, cross-browser compatibility is very good across all
    the major browsers and Internet Explorer starting from version 9:'
  merge: -1
  img_proc: true
- pgno: 44
  md: '| IE | Edge | Firefox | Chrome | Safari | Opera | iOS Safari | Opera Mini |
    Android Browser | Chrome for Android |

    |---|---|---|---|---|---|---|---|---|---|

    | | | | | | | | | | |


    Cross-browser compatibility SVG from http://caniuse.com/#feat=svg


    Vector Graphics are images where all the information about the image is encoded
    as numerical expressions of geometric shapes (such as rectangles, circles, ellipses,
    paths, and texts) of the elements of the image. The browser always uses this information
    to draw and render the graphic in the best resolution possible. In the following
    figure, we can see a Vector Graphic of a circle with a high resolution, whereas
    on the right, we see a zoom of the image. It’s easy to see that the zoomed image
    is displayed with perfectly crisp edges; this effect of lossless scaling results
    from the resolution-dependent rendering of the browser.


    > You can find detailed information about the SVG specification on the W3 website:
    http://www.w3.org/Graphics/SVG/.


    ![](img/72559bd4713b2b89631dcca187d7e2db_44_0.png)


    Vector Graphic, left: high resolution, right: zoomed


    More advantages result from the fact that the visualization''s elements are simply
    embedded in the HTML page. Now, we can easily attach native JavaScript event listeners,
    such as the `mouseover` or `click` events, on every component of the graphic and
    use CSS to style them together with the rest of the application.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Another great benefit is that we can simply look into the Developer Console
    of the web browser, play around, and debug the visualization. We can click on
    each element of the image to see its attached event handlers, and we can modify
    the CSS styling in real time. Anyone who has ever dealt with OpenGL or WebGL debugging
    will agree that this is a comfort that you can''t miss while developing visualizations
    for the web.


    Now, we already have many arguments in favor of using SVG for responsive cross-browser
    visualizations:


    +   - Simple debugging because the source code of the graphic is simply embedded
    in the HTML document

    +   - Sharp rendering on all screen resolutions because the browser renders the
    graphic according to the client''s screen resolution

    +   - Cross-browser compatibility in all major browsers

    +   - Styling the visualization with CSS

    +   - Native JavaScript event handlers can be attached to all elements of the
    image

    +   - Debugging and live editing of the visualization in the Developer Tools


    # Creating graphics with D3.js


    D3.js (abbreviation for Data-Driven Documents) is a JavaScript library built by
    Mike Bostock and other members of the Stanford Visualization Group for DOM manipulation,
    data transformation, and graphic creation. It uses a jQuery-like, data-driven
    approach and leverages all the capabilities of modern browsers and underlying
    web standards (such as HTML, CSS, and SVG).


    D3.js is open source and hosted on GitHub (https://github.com/mbostock/d3) under
    a slightly modified BSD 3-clause license; therefore, it can be used in open source
    and commercial products without being required to release any modifications. GitHub
    itself uses D3.js to visualize the contribution history of repositories.


    Throughout this book, we will use the stable version 3.5.6, but most examples
    should also work with different minor versions.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Including D3.js


    There are multiple ways to include D3.js to your project:


    +   Using the package manager called bower (recommended), fetch the library by
    running the bower install d3#3.5.6 command from the terminal. Then, link the minified
    CSS file from the bower_components/ directory in the head section of the web page:
    <link rel="stylesheet" href="bower_components/d3/d3.min.css">.


    +   Using a CDN, such as cdnjs (this requires an active Internet connection while
    developing), include the minified CSS file from the CDN in the head section of
    the web page: <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.6/d3.min.js">.


    +   Manually download the 3.5.6 release from GitHub (https://github.com/mbostock/d3/releases)
    and unzip it into the libs/ directory. Then, link the minified CSS file from the
    libs/ directory in the head section of the web page <link rel="stylesheet" href="libs/d3/d3.min.css">.


    I strongly recommend using the package manager called bower to manage your frontend
    dependencies. However, in the examples of the book, we will link D3.js directly
    from cdnjs for simplicity reasons; therefore, all the examples in the source of
    the book require an active Internet connection.


    # Finding additional resources


    The ultimate resource for D3.js is the WIKI page of the GitHub project, which
    can be found at https://github.com/mbostock/d3/wiki. Here, you will also find
    examples and a detailed description of the API.


    Another great resource for examples is Mike Bostock''s page at http://bl.ocks.org/mbostock
    and his blog at http://bost.ocks.org/mike/.


    For more detailed information and examples, I recommend reading the Mastering
    D3.js book by Pablo Navarro Castillo.'
  merge: -1
  img_proc: true
