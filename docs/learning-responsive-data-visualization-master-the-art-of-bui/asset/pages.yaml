    800\" height=\"400\">\n<rect x=\"50\" y=\"50\" width=\"100\" height=\"100\"></rect>\n\
    </svg>\n```\n\nThe preceding code does the exact same thing as the first example\
    \ in the previous section. We observe that the animation code in this example\
    \ has now been separated from the visualization code, which makes the animation\
    \ code more reusable (just as CSS styles). But it makes it more difficult to write.\
    \ It is not very intuitive to define key frames and then declare an animation\
    \ that consists of these key frames.\n\nIn the following figure, we see that the\
    \ support of CSS Animations across all modern browser is pretty decent. However,\
    \ if we try to animate the path element, similar to the previous example, we soon\
    \ reach the limits of CSS animations. Interpolations are simply not as good as\
    \ the ones from SMIL. Moreover, animating the transform attribute in SVG is a\
    \ nightmare; different transform origins, and the lack of support in Internet\
    \ Explorer makes them almost unusable:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_146_0.png)\n\
    \nThe cross-browser compatibility of CSS Animations"
