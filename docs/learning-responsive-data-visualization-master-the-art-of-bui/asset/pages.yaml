- pgno: 136
  md: '# Touch events


    Let''s take a look at the native event APIs in JavaScript. Here is a list of the
    most common touch events in their correct execution order:


    +   - touchstart: The fingertip touches the screen

    +   - touchmove: The fingertip moves on the screen

    +   - touchend: The fingertip stops touching the screen

    +   - touchcancel: The touch event is canceled


    By simply looking at this list, we probably don''t understand why our visualization
    still works perfectly fine for touch input, although we never defined a single
    touchstart event in the code. If we look into the code of the book, we mostly
    see the click events, but how do they get triggered by a touch?


    What we don''t see in the list is a behavior called emulation handling, which
    is done automatically by the browser. The browser simply continues to propagate
    the touch events as emulated mouse events. This means every touch on the screen
    results in the full touch execution chain as well as the full mouse execution
    chain; hence, a touch creates a click event.


    We will take a close look at this execution chain, default handling, and propagations
    in the last chapter, where you will learn to deal with cross-browser compatibility
    issues and optimizing for both touch and mouse. Let''s continue with the mouse
    events.


    More information about touch events can be found on MDN at https://developer.mozilla.org/en-US/docs/Web/API/Touch_events.


    # Mouse events


    Mouse events are a little bit more difficult to handle because we have to know
    not only the names of the events but also the correct execution order (which looks
    somehow arbitrary at first). Here is a list of the most common mouse events listed
    by their execution order when users double-click on an element on the screen:


    +   - mouseenter: The mouse cursor is entering the element

    +   - mouseover: The mouse cursor is hovering the element

    +   - mousemove: The mouse is moved over the element

    +   - mousedown: The mouse button is pressed

    +   - mouseup: The mouse button is released

    +   - click: The element is clicked'
  merge: -1
  img_proc: true
- pgno: 137
  md: '+   * dblclick: The element is double-clicked

    +   * mouseleave: The mouse cursor is leaving the element


    As we see, a simple click with the mouse also triggers the mouseenter, mouseover,
    and mouseleave events. Whenever you deal with events and execution orders, I encourage
    you to memorize or come back to this list and check the execution chain. Don''t
    forget that you can always stop the propagation and prevent the default event
    handling using event.preventDefault() and event.stopPropagation().


    > More information about mouse events can be found on MDN at https://developer.mozilla.org/en-US/docs/Web/API/MouseEvent.


    # # Panning and zooming


    Besides clicking onto the data points, bars, and elements in the visualization,
    a common interaction is zooming and panning. This helps the user to change from
    smaller view to a more detailed view of the data. Having in mind everything you
    have learned so far, it would also make sense to increase the data resolution
    while you zoom. The more the user zooms into the visualization, the higher the
    data resolution.


    Similar to the previous chapter, there are multiple ways to implement them. We
    will look at the different possibilities and compare them by zooming into the
    chart in the following picture:


    ![](img/72559bd4713b2b89631dcca187d7e2db_137_0.png)


    A simple bar chart in a grid layout'
  merge: -1
  img_proc: true
- pgno: 138
  md: "# # A simple zoom\n\nLet's first start with a very simple zoom. In many cases,\
    \ mostly when we use data representations without axis, we want to provide the\
    \ user a way to simply enlarge the view of the visualization.\n\nTo implement\
    \ this effect, we can use SVG's native transform functions, such as scale and\
    \ translate, and apply them to a container element that contains all the zoomable\
    \ components. We can already see that the zoomable components are not even involved\
    \ in this technique as long they are placed inside the container. Here lies the\
    \ great benefit of this method —it is super simple to add to a visualization and\
    \ very easy to implement.\n\nLet's go through the steps using some more D3 functions.\
    \ First, we need to make sure all our data is grouped in a visualization container.\
    \ So, we add a simple container to the chart:\n\n```\n```javascript\nvar $svg\
    \ = d3.select(chart).append('svg');\nvar $vis = $svg.append('g').attr('class',\
    \ 'vis-container');\nvar $axesGroup = $vis.append('g').attr('class', 'axis-container');\n\
    var $dataGroup = $vis.append('g').attr('class', 'data-container');\n```\n```\n\
    \nNext, we initialize a default zoom factor and translation summands. We can use\
    \ the built-in function called d3.behavior.zoom() to create a zoom generator:\n\
    \n```\n```javascript\nvar translate = [0,0];\nvar scale = 1;\nvar zoom = d3.behavior.zoom()\n\
    \  .on(\"zoom\", function() {\n    translate = d3.event.translate;\n    scale\
    \ = d3.event.scale;\n    $vis.attr(\"transform\",\n      \"translate(\" + translate\
    \ + \")scale(\" + scale + \")\");\n  });\n```\n```\n\nIn the preceding example,\
    \ we create a zoom generator function called zoom, which implements a zoom event\
    \ listener function. When a zoom or pan occurs, we simply scale the visualization\
    \ container and translate it according to the zooming or panning movement. Finally,\
    \ we apply the zoom generator to an element:\n\n```\n```javascript\n$svg.call(zoom);\n\
    ```\n```\n\nIn our case, we always want the zoom generator on the svg element.\
    \ That's it, zooming and panning in a couple of lines of code—impressive. And\
    \ it even handles the pinch-to-zoom action as well as zooming using the mouse\
    \ wheel and panning (via mouse and fingers)."
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Let''s look at the output of the previous code; the following figure shows
    the zoomed bar chart using the proposed technique:


    ![](img/72559bd4713b2b89631dcca187d7e2db_139_0.png)


    The zoomed bar chart using a simple zoom


    We can already see the drawbacks from using this simple function: The zoom is
    applied on the whole visualization and works similar to the scaling of the graphic.
    This can be very helpful in a lot of cases, but when we deal with charts it would
    be more helpful to zoom the data along the axis.


    # An axis zoom


    We can set much more options of the d3.behavior.zoom function and change its behavior
    by modifying the zoom event listener. We can tell the built-in zooming function
    that it should use scale objects for zooming and that it should handle all by
    itself.


    In this case, we add xScale and yScale as arguments to the .x() and .y() methods.
    Therefore, the algorithm overwrites the built-in zoom extend from both the functions
    every time the draw function is called:


    ```

    var zoom = d3.behavior.zoom()

    .x(xScale)

    .y(yScale)

    .on("zoom", function() {

    // Event listeners goes here

    });

    $svg.call(zoom);

    ```'
