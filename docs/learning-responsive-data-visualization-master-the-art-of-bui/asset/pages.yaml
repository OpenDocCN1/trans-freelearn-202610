- pgno: 24
  md: '# Create a CSS snippet using Media Queries for these device dimensions:


    ```

    /* phones, default no query */

    /* tablets */

    @media (min-width: 768px) { ... }

    /* desktops */

    @media (min-width: 992px) { ...}

    /* large devices */

    @media (min-width: 1200px) { ... }

    ```


    In the preceding code, we defined four states with three breakpoints between these
    states where each state corresponds to a typical screen dimension and device type.


    We can also see these breakpoints by reducing the size of a browser window while
    looking at a responsive web page; we observe how the design breaks at a certain
    width of the browser window. In the following figure, the breakpoint is visualized
    as a dashed line, showing the moment when one state breaks into a new one:


    ![](img/72559bd4713b2b89631dcca187d7e2db_24_0.png)


    Breakpoint in Responsive Design


    We can observe the same effect when we look at the Google Plus web page in the
    following figure. In the first two figures, the size of browser window changes,
    but the three-column layout stays the same. In the third image, the design breaks
    into a new layout with only two columns:


    ![](img/72559bd4713b2b89631dcca187d7e2db_24_1.png)


    Breakpoints of the Google Plus page'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# # Having the right viewport


    Across mobile and desktop devices, there exists a vast variety of different pixel
    densities and screen resolutions. Displays with much higher resolution would render
    pages much smaller than displays with a lower resolution; this immediately leads
    to readability problems. To prevent this effect and fit bigger pages into smaller
    screens, a virtual window – the so-called viewport (the visible area of a web
    page)–was introduced. This allowed websites to render in the correct pixel resolution
    and scale to the full device width for maximal accessibility; however, developers
    had no control over this device-specific setting. Later, in HTML5, the viewport
    meta tag was introduced in order to give developers full control over these viewport
    settings.


    Today, a mobile-optimized application usually defines the following viewport tag
    in the head section of the web page to render the website normally and scale the
    content to the width of the device:


    ```

    <meta name="viewport" content="width=device-width, initial-scale=1">

    ```


    > > More information about all the valid viewport options can be found on MDN
    at https://developer.mozilla.org/en-US/docs/Mozilla/Mobile/Viewport_meta_tag.


    # # Relative Units – %, REM, and EM


    When dealing with Responsive Design, it is always a good idea to use relative
    units to describe the element’s dimensions based on its parent element. Thus,
    when the parent container changes the size, all children elements adapt their
    sizes accordingly.


    The most popular unit for relative dimensions is %, which defines the dimension
    based on a certain percent of the next absolute positioned parent element.


    However, there are more useful units to describe relative dimensions; for example,
    the following two are based on the font-size:


    +   * em: This is relative to the font size of the element

    +   * rem: This is relative to the font size of the root element


    These units have a big advantage; they are affected by the changes of the font-size
    setting in the browser. A simple example can be the adaption of the paddings when
    the user increases the font size of the browser.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '> A short summary and explanation of all different CSS units can be found on
    MDN at https://developer.mozilla.org/de/docs/Web/CSS/length.


    # # Designing for mobile devices first


    Responsive applications should look and feel great (or work at all) on a huge
    number of devices with a huge number of different screen sizes and resolutions;
    they usually run on mobile devices as well as big TV screens. Thus, in the beginning
    of a project, every developer has to choose an approach to design the responsive
    application to master this transition; in general, we distinguish between the
    following methods:


    +   - Mobile first

    +   - Desktop first


    In the desktop first method, we design for desktop devices and mouse input first,
    then we adjust and scale the design down for mobile devices and touch interactions.
    This often results in a web application with a reduced functionality for mobile
    devices due to a much smaller screen dimension and the lack of touch support.


    In the mobile first method, we design for mobile devices and touch interactions
    first, and then we adjust and scale the design up for bigger devices and mouse
    interactions. This approach makes sure that mobile devices support a complete
    set of features, which can even be used on desktop clients.


    Both methods are equally correct, accepted, and popular nowadays. The only exception
    is that mobile first became a buzzword due to an increase of mobile devices accessing
    the web during the previous years. Throughout the book, we will choose a mobile
    first approach and design for mobile devices and touch support. However, we will,
    of course, extend the visualizations to support mouse input and bigger screens.
    That''s what the responsive design is all about.


    # # Bootstrap – a popular mobile first CSS framework


    If we want to create responsive mobile first web applications, we usually don''t
    want to start from zero and re-implement common patterns and components; we would
    rather want to reuse some well-tested, existing components.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Bootstrap is a very popular HTML and CSS framework built by former Twitter
    employees for easy, fast, and modern frontend development; it provides loads of
    responsive CSS and LESS layouts as well as a huge collection of HTML and JavaScript
    components. Thanks to its MIT license, it can be used in open source and commercial
    software.


    The current stable version 3.3.5 includes LESS styling with these features:


    +   - Containers and grids (static and fluid)

    +   - Responsive helpers (hiding and showing elements on different breakpoints)

    +   - LESS mixins and variable declarations

    +   - Styles for common components such as forms, input fields, and tables

    +   - Icons, HTML, and JavaScript components


    > A complete list of features can be found on the Bootstrap website at http://getbootstrap.com/.


    The new version 4 (which is currently in the alpha stage) will be shipped with
    SASS layouts and loads of other great features and improvements:


    > There also exists an official fork for the SASS precompiler on GitHub at https://github.com/twbs/bootstrap-sass.


    +   - All units are in rem an em

    +   - A new xl grid tier is added

    +   - Optional flexbox support

    +   - A Reboot module is available to reset default browser styles


    > A complete list of new features can be found on the Bootstrap blog at http://blog.getbootstrap.com/2015/08/19/bootstrap-4-alpha/.


    Throughout this book, we will use Bootstrap 3.3.5 version (with LESS) for all
    the examples and explanations if they are not stated differently. We will also
    give some hints about the latest version where it is appropriate.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# # Including Bootstrap


    Make sure you have the Bower package manager installed; this can be done by running
    the following command from the terminal:


    ```

    npm install -g bower

    ```


    More information about the Bower package manager can be found on its website at
    http://bower.io/.


    Throughout this book, we will make use of only the CSS components of Bootstrap
    and thus we only need to include the bootstrap.css file to our project. There
    are multiple ways of doing so:


    +   - Use the package manager called bower (recommended) – First, fetch the library
    by running the following command from the terminal—bower install bootstrap#3.3.5.
    Then, link the minified CSS file from the bower_components/ directory in the head
    section of the web page: <link rel="stylesheet" href="bower_components/bootstrap/dist/css/bootstrap.min.css">.


    +   - Use a Content Delivery Network (CDN), such as MaxCDN (this requires an active
    Internet connection while developing). Simply include the minified CSS file from
    the CDN in the head section of the web page: <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css">.


    +   - Manually, download the 3.3.5 release from GitHub (https://github.com/twbs/bootstrap/releases)
    and unzip it into the libs/ directory. Then, link the minified CSS file from the
    libs/ directory in the head section of the web page: <link rel="stylesheet" href="libs/bootstrap/dist/css/bootstrap.min.css">.


    I strongly recommend using the bower package manager to manage your frontend dependencies
    (or similar ones, such as npm or component). However, in the examples of this
    book, we will link Bootstrap directly from MaxCDN for simplicity reasons; therefore,
    all examples in the source of the book require an active Internet connection.


    # # Finding additional resources


    The ultimate resource for Bootstrap is the documentation that can be found at
    http://getbootstrap.com/getting-started/. Here, you will also find examples and
    templates using the Bootstrap framework.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'For more detailed information and examples, I recommend reading the Unraveling
    Bootstrap 3.3 book by Istvan Novak.


    # Understanding grid layouts


    A popular component to organize elements in an application or visualization is
    a grid layout. For responsive design in particular, we are mostly interested in
    grid layouts that adapt their columns to the screen resolution of the client.
    In the following figure, there''s an example of a responsive grid layout with
    three columns per row on a desktop device and one column per row on a mobile device:


    ![](img/72559bd4713b2b89631dcca187d7e2db_29_0.png)


    We then distinguish two different types of responsive grids that adapt the number
    of columns to the screen resolution of the client:


    +   - Normal grids with a fixed width per breakpoint (see following figure on
    the left)

    +   - Fluid grids that always scale to the full width of the current breakpoint
    (see the following figure on the right)


    ![](img/72559bd4713b2b89631dcca187d7e2db_29_1.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: "It's actually quite simple to build a grid system yourself; let's first take\
    \ a look at how to create a fluid grid layout, and afterwards, we will better\
    \ understand how we can use Bootstrap components to get things done quickly and\
    \ properly.\n\nIf we think about a grid as a (flexible) table layout, we need\
    \ two basic components: rows and columns. A popular approach is to use the 12-column\
    \ grid where we divide the width of a row into 12 columns and define column combinations\
    \ that sum up to the full width of 12. The following figure illustrates some of\
    \ these combinations: 12 columns of width 1, 6 columns of width 2, 4 columns of\
    \ width 3, and so on. Also other combinations that sum up to 12 are allowed, such\
    \ as 2, 6 and 4 or 1, 10 and 1 and many more.\n\n![](img/72559bd4713b2b89631dcca187d7e2db_30_0.png)\n\
    \nGrid layout with 12 columns\n\nLet's start and build the .row class that spans\
    \ to the full width of the parent element:\n\n```\n.row {\n    position: relative;\n\
    \    width: 100%;\n}\n```\n\nNext, we want to create column classes .col-1, .col-2,\
    \ ..., and .col-12 that define the width of the column in the percent relative\
    \ to the width of the row. We define a text wrap with the float attribute and\
    \ add padding for the cells. The float attribute indicates that the block element\
    \ should not appear in the original flow but \"float\" on the left side. By doing\
    \ so, we align the elements in the same line instead of placing them into the\
    \ normal text flow:\n\n```\n[class*=\"col-\"] {\n    float: left;\n}\n```"
  merge: -1
  img_proc: true
