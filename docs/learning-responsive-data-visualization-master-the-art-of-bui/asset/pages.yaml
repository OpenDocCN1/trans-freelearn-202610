    ```


    Now, we can start to write JavaScript inside the script element and initialize
    the chart dimensions and the data:


    ```

    // Define the dimensions

    var width = 800;

    var height= 400;


    // Define the inner margins

    var pad = 75;


    // Define the data

    var data = [

    {y: 10, label: ''Milk''},

    {y: 15, label: ''Ham''},

    {y: 18, label: ''Beer''},

    {y: 24, label: ''Eggs''},

    {y: 6, label: ''Bread''}

    ];

    ```


    As a next step, we can already create the svg element and set its dimensions properly:


    ```

    var $svg = d3.select(''body'')

    .append(''svg'')

    .attr({

    width: width,

    height: height

    });

    ```'
