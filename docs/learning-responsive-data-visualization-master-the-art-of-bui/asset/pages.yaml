    \ </div>\n <div class=\"col-md-4\">\n <div class=\"chart\" data-url=\"...\" ...>\n\
    \ </div>\n </div>\n <div class=\"col-md-4\">\n <div class=\"chart\" data-url=\"\
    ...\" ...>\n </div>\n </div>\n </div>\n </div>\n <div class=\"row\">\n <div class=\"\
    col-md-6\">\n <div class=\"chart\" data-url=\"...\" ...>\n </div>\n </div>\n <div\
    \ class=\"col-md-6\">\n <div class=\"chart\" data-url=\"...\" ...>\n </div>\n\
    \ </div>\n </div>\n </div>\n```"
  merge: -1
