- pgno: 14
  md: '# # Preface


    Data visualizations are the best way to understand complex information and data.

    The human brain perceives visual information easily; it can make connections and
    is

    able to understand the complete process easier than without visualizations.


    I am always delighted with the positive feedback from users whenever they

    understand a complex system easily by looking at a data visualization, instead

    of going through explanatory text and raw data. With the power of the Web and

    modern browsers, I can share these visualizations with everyone and make them

    interactive and animated.


    To power cross-browser interactive visualization, I didn''t want any compromise

    with regards to performance, debugging, quality, and interactivity, which led
    me

    to SVG. After deciding for SVG, I looked for a framework for SVG transformations

    giving raw access to all its underlying standards while also providing a rich
    set of

    visualization features - the d3.js library provides all of these.


    D3.js is a visualization toolkit that facilitates the generation and manipulation
    of

    web-based vector graphics and provides full access to underlying SVG standards.

    Moreover, animations and interactive visualizations change the way users perceive

    web applications, and D3.js offers everything you need to make a visualization

    interactive out of the box.


    While this has been working for the last few years, I realized that users are

    increasingly accessing visualizations with their mobile devices, though mostly

    through smartphone and tables. On most tablets, visualizations looked good, though

    interactions did not work anymore. Smartphone users experienced this as well when

    they tried to zoom into a browser but it somehow interfered with the zoom of the

    visualization and randomly toggled interactive features instead. For me, this
    was the

    sign I needed to fix the problem.


    With the rise of responsive web design, there were already plenty of ideas for

    creating cross-browser and cross-platform applications that adapt to a user''s
    device,

    screen size, and resolution. Apart from this, modern browsers already provide
    solid

    CSS and JavaScript functionality to implement responsive designs for all kinds
    of

    web applications.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'The only logical step for me was to combine rich tools in order to create responsive
    applications and introduce the same ideas into data visualizations. I want my
    visualizations to adapt to the user’s device, screen size, and resolution while
    providing cross-platform interactivity for mouse and touch gestures. In this book,
    I will share my knowledge, experience, and best practices on responsive data visualizations
    with you.


    # What this book covers


    Chapter 1, Getting Started with Responsive Design, Bootstrap, and D3.js, gets
    you on track with today''s concepts, technologies, and frameworks to create responsive
    applications.


    Chapter 2, Creating a Bar Chart Using D3.js and SVG, helps you get started with
    `D3.js` and its concepts. You will learn how to draw points, shapes, and simple
    bar charts by the end of this chapter.


    Chapter 3, Loading, Filtering, and Grouping Data, guides you so that you can get
    the maximum information out of real-world data.


    Chapter 4, Making the Chart Responsive Using Bootstrap and Media Queries, goes
    through all of the steps needed to make visualizations responsive and adapt them
    to user devices.


    Chapter 5, Building Responsive Interactions, teaches you to add truly responsive
    interactions to your visualization, which also makes these great to use on user
    devices.


    Chapter 6, Designing Transitions and Animations, teaches you to make a visualization
    appealing to look at by adding gorgeous transitions or custom animations.


    Chapter 7, Creating Maps and Cartographic Visualizations Using GeoJSON, helps
    you get started with geographic data processing and then visualize this data in
    cartographic visualizations.


    Chapter 8, Testing Responsive Visualizations, shows you how to test responsive
    visualizations both manually and in an automated manner, and covers both unit
    and end-to-end testing.


    Chapter 9, Solving Cross-Browser Issues, helps you avoid the most common pitfalls
    when dealing with cross-browser compatibility issues for responsive visualizations.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# What you need for this book


    The first thing you need to get started with is a web browser and text editor,
    such as Sublime Text or Atom. Then, you need to install node.js (http://nodejs.org/)–
    which already includes the npm package manager–and the bower package manager (http://bower.io/).
    I will walk you through the installation of the required packages in the corresponding
    chapters.


    For examples that require you to load data from your local hard drive, I would
    recommend that you install the `http-server` module (https://www.npmjs.com/package/http-server)
    to run all the examples from a local web server. An Internet connection is only
    required to install tools and libraries but not to run the examples.


    # Who this book is for


    This book is intended for data scientists, developers, and motivated beginners
    to implement custom responsive data visualizations using vector graphics. Whether
    you already know a bit about SVG and vector graphics in a browser or you have
    never used any visualization library before, you will be able to master the data-driven
    techniques of D3. In either case, this book will get you up and running as quickly
    as possible and also challenges you if you have already worked with D3.


    # Conventions


    In this book, you will find a number of text styles that distinguish between different
    kinds of information. Here are some examples of these styles and an explanation
    of their meaning.


    Code words in text, database table names, folder names, filenames, file extensions,
    pathnames, dummy URLs, user input, and Twitter handles are shown as follows: "We
    can use the d3.text function and parse the dataset on our own."


    A block of code is set as follows:


    ```

    var lines = data.split(/\\n/g)

    .map(function(line) {

    return line.split(/[-\"]/g) ;

    }) ;

    ```'
