  md: 'Let''s again display the interaction areas of 9.5 mm; we can see the result
    in the following figure:


    ![](img/72559bd4713b2b89631dcca187d7e2db_135_0.png)


    # The scatter plot with highlighted interaction areas


    While this solution works great with all kinds of data, scales, and axis, because
    the distance is measured in a pixel range, we need to be aware of calculating
    the distance of each data point to the click position. Depending on the number
    of data points, this can lead to performance issues when dealing with big datasets.
    As always, a mixture of both examples would be a good solution here.


    In a performance-compatibility balanced solution, we draw a rectangle around the
    click position and use bisectors to return all elements of this rectangle. Then,
    we use the distance function on all elements in this rectangle to obtain the closest
    one. Using this box method, we only have to compute a fraction of the distances
    rather than the distance to every point in every dataset. Slicing the dataset
    with the bisectors is also much faster than computing all distances.'
