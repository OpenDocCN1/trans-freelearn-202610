- pgno: 235
  md: 'Great! Now, we can set up Respond.js to automatically polyfill Media Queries
    (with all performance limitations). We simply have to include Respond.js after
    all included styles; it won''t look for inline, imported, or styles linked after
    it was included. Here is a minimal layout using Respond.js:


    ```

    <!doctype HTML>

    <html>

    <head>

    <title>Media Queries using Respond.js</title>

    <link rel="stylesheet" href="styles/responsive.css">

    <!--[if lte IE 9]>

    <script src="bower_components/respond/dest/respond.min.js"></script>

    <![endif]-->

    </head>

    <body>


    </body>

    </html>

    ```


    In the preceding code, we wrapped Respond.js in conditional HTML comments to only
    load in Internet Explorer with versions less than or equal to 9. This doesn''t
    affect our code in all other browsers and loads the polyfill only for Internet
    Explorer.


    # Media Queries in JavaScript with Enquire.js


    Using Media Queries is a great way to define the dimensions of your responsive
    application as per the resolution of the target browser. However, whenever we
    want to provide cross-browser compatibility, the CSS file somehow has to be reloaded
    and parsed via JavaScript. Instead of doing this tedious reloading of resources,
    one can move the responsive styles directly into JavaScript.


    When we implement responsive styles in JavaScript, we have to run functions once
    a Media Query matches and cleanup functions once a different Query matches. Hence,
    we want a comfortable solution to do so rather than using the raw match Media
    Query itself. The Enquire.js library by Nick Williams provides such an interface
    for registering Media Queries, callbacks, and clean-up functions. The source code
    is available on Github at https://github.com/WickyNilliams/enquire.js.'
  merge: -1
  img_proc: true
- pgno: 236
  md: "![](img/72559bd4713b2b89631dcca187d7e2db_236_0.png)\n\nThe Enquire.js website\n\
    \nYou can install Enquire.js by downloading the latest source or using the bower\
    \ package manager and running the following command from the terminal:\n\n```\n\
    bower install enquire\n```\n\nNow, we can start defining our responsive styles\
    \ in JavaScript rather than in CSS. This has the advantage that, in combination\
    \ with the matchMedia polyfill, no other dependency is needed for compatibility\
    \ on Internet Explorer. We provide only the responsive styles directly in JavaScript,\
    \ which means there's no need to load and parse CSS files.\n\nLet's create a little\
    \ example where we use Enquire.js to hide a menu on mobile devices:\n\n```\n<!doctype\
    \ HTML>\n<html>\n  <head>\n    <title>Media Queries using Enquire.js</title>\n\
    \    <script src=\"bower_components/matchMedia/matchMedia.js\"></script>\n```"
  merge: -1
  img_proc: true
- pgno: 237
  md: "```\n```html\n<script src=\"bower_components/enquire/dist/enquire.min.js\"\
    >\n<script>\n<script>\nenquire.register(\"screen and (max-width: 480px)\", {\n\
    \    match : function() {\n        // Enter smartphone mode\n        document.querySelector('.menu').style.display\
    \ = 'none';\n    },\n    unmatch : function() {\n        //Leave smartphone mode\n\
    \        document.querySelector('.menu').style.display = 'block';\n    }\n});\n\
    </script>\n</head>\n<body>\n<div class=\"menu\">\n    <ul>\n    <li><a href=\"\
    #\">test</a></li>\n    <li><a href=\"#\">test</a></li>\n    <li><a href=\"#\"\
    >test</a></li>\n    </ul>\n</div>\n</body>\n</html>\n```\n```\n\nIn the preceding\
    \ code, we used  the match and unmatch functions to execute the\ncallback, and\
    \ we used the clean-up functions on the Media Query called screen\nand (max-width:\
    \ 480px). This gives us full control of our responsive application,\nis only JavaScript\
    \ and hence fully cross-browser compatibile (only if we include the\nmatchMedia\
    \ polyfill).\n\n# # Cross-browser SVG features\n\nWe already saw in the previous\
    \ chapters that SVG is only supported by Internet\nExplorer 9 and higher versions.\
    \ Providing a complete cross-browser compatibility\nfor the previous versions\
    \ of Internet Explorer is not impossible but challenging.\nTheoretically, you\
    \ can use a wrapper (for example, Raphael .js) to convert D3's\noutput into the\
    \ valid VML; however, this is tricky, difficult, and not a good solution\nperformance\
    \ wise. In this case, it would be even better to not use D3 at all for this\n\
    problem as it will not give you additional benefits."
  merge: -1
  img_proc: true
- pgno: 238
  md: 'Whenever we spoke about SVG support, we were speaking about the basic SVG support
    and hence the SVG 1.1 specification. However, there are more interesting features
    that you can use in your application, where some of them have a different compatibility.
    Let''s look at these features.


    # SVG animations


    We have already talked about SMIL animations in the previous chapters; however,
    we want to bring it up again. Although compatibility doesn''t look bad in the
    current browsers (if we neglect Microsoft browsers for a second), we need to be
    aware that SMIL will not be supported anymore in the future.


    If you are going to implement SMIL animations (because they are easy and cool)
    you should also provide JavaScript fallback solutions for Internet Explorer, Edge,
    and Opera Mini:


    ![](img/72559bd4713b2b89631dcca187d7e2db_238_0.png)


    SMIL animations (source: http://caniuse.com/#feat=svg-smil)


    If you are planning to animate elements along SVG paths using CSS (so-called motion
    paths), be aware that this is also not supported in many browsers:


    ![](img/72559bd4713b2b89631dcca187d7e2db_238_1.png)


    CSS motion paths (source: http://caniuse.com/#feat=css-motion-paths)


    If you still want to animate elements along a motion path, you should use a non-native
    JavaScript approach. There is a great JavaScript function that returns a certain
    point on a custom path, giving the parametric length on the path; this is called
    `getPointAtLength()`.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '> More information about the SVG function getPointAtLength can be found on
    W3C at https://www.w3.org/TR/SVG/paths.html. An example using this function for
    implementing a path motion is available at http://bl.ocks.org/KoGor/8162640.


    # # Using SVG filters


    If you are planning to use filters in SVG, such as blending, blur, turbulence,
    and so on, you can go for it. Filters on SVG elements are supported in most of
    the browsers except Internet Explorer 9:


    ![](img/72559bd4713b2b89631dcca187d7e2db_239_0.png)


    SVG filters (source: http://caniuse.com/#feat=svg-filters)


    Just as with many other SVG features, they are also introduced to HTML elements
    via CSS. However, this will not solve our problem using Internet Explorer 9 but
    will only result in more restrictions.


    ![](img/72559bd4713b2b89631dcca187d7e2db_239_1.png)


    CSS filters (source: http://caniuse.com/#feat=css-filters)


    To support image filters in Internet Explorer 9, I recommend using feature detection
    and the old deprecated DX filters.


    > More information about DX filters can be found on MSDN at https://msdn.microsoft.com/library/ms532853.aspx.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Clipping elements in SVG


    SVG lets a developer create elements that can be reused as clipping paths for
    other elements. Although this is a great feature, and I commonly use it in visualizations
    (I love clipping paths), this is not supported in all browsers. The following
    graphic shows the compatibility of the CSS property for clipping masks using the
    url (#id) syntax:


    | IE | Edge | Firefox | Chrome | Safari | Opera | iOS Safari | Opera Mini | Android
    Browser | Chrome for Android |

    |---|---|---|---|---|---|---|---|---|---|

    | | | | | | | | | | |


    The CSS clip-path property (source: http://caniuse.com/#feat=css-clip-path)


    Another drawback of clipping paths (and fill patterns) is this syntax; the element
    has to be accessible via the URL, ID, and the # hash symbol. I can imagine many
    scenarios where elements cannot be accessed via the URL and the hash symbol—for
    example, a single page applications that use the hash for routing. However, there
    exists no useful solution for this currently, and we need to rely on visualizations
    without clipping masks.


    # Handle touch and mouse events with ease


    Until now, we have always tried to provide both touch and mouse events for users
    on a mobile device and on PC or television screens. With D3, we treated a touch
    event exactly as a mouse click event but only with a different interaction radius.
    However, it can easily happen that a user has both touch (or multi-touch) and
    a mouse as input devices. In this section, we solve caveats for developers when
    providing both input types for the user.


    # Mouse and touch events


    Why could we use a mouse click event to also detect finger touches on a touch
    screen? To answer this question, we will take a look at the execution chains of
    events on a target DOM element mouse and go into touch-enabled device. We combine
    them into one execution chain for touching a target element on a touch device
    with the finger. Here is the list of events that will be propagated:


    +   - touchstart: The fingertip touches the screen

    +   - touchmove: The fingertip moves on the screen'
  merge: -1
  img_proc: true
- pgno: 241
  md: '+   - touchend: The fingertip stops touching the screen

    +   - mouseenter: The mouse cursor is entering the element

    +   - mouseover: The mouse cursor is hovering over the element

    +   - mousemove: The mouse is moved over the element

    +   - mousedown: The mouse button is pressed

    +   - mouseup: The mouse button is released

    +   - click: The element is clicked

    +   - mouseleave: The mouse cursor is leaving the elements


    By looking at the preceding list, many things become clear. For developing responsive
    applications, the preceding list will be your best friend when you deal with designing
    interactions.


    The first thing we notice is that a simple touch with the finger will also propagate
    a click event. This explains why we can use the simple `click` listeners to detect
    both touch and mouse inputs. This is useful, and it will make the basic click
    functionality designed for mouse interaction available for touch interactions.
    However, make sure that you adapt interaction targets when implementing touch
    support.


    The second most important insight of observing the execution chain is directly
    related with the first one. Whenever we support both touch and mouse events, we
    need to make sure that touch events don''t propagate as mouse events in the execution
    chain. We will see in the following section how this works.


    Another interesting insight might not be obvious from looking at the event chain.
    We observe that there is the `touchmove` event at the beginning and the `mousemove`
    event fires some events later. While this is true for a single finger tap, it
    is not true for a touch gesture when the finger moves on the screen. Unfortunately,
    when the finger is moving and firing the `touchmove` events, no `mousemove` event
    is propagated. This means that UIs designed based only on the `mousemove` events
    will not work properly on touch devices due to this behavior.


    # # Breaking the event execution chain


    As we have seen before, if one operates on browsers with touch input, the touch
    events are also propagated as mouse events. This behavior of the browser is called
    mouse-emulation handling and is enabled per default on every touch event. While
    this is a good thing, because it makes the mouse UI usable for touch devices even
    when no touch events are implemented, it slows down the performance when we actually
    use touch events.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'There are many reasons why we would like to intercept the chain of fired events
    and default actions by the browser — to increase performance (as we just said),
    to disable scrolling when using the same gesture in a visualization, and to fully
    control the event chain.


    JavaScript provides a function to disable the default behavior of the browser
    while maintaining the execution chain and propagating the event; this function
    is called `event.preventDefault()`. The default behavior of clicking on a checkbox
    toggling it, and the default behavior of using the mouse wheel scrolls the page.
    Whenever we want to prevent these default actions, we use the preceding function.


    There is another function that does not affect the default actions of an event
    but stops the execution chain of the event; this function is called `event.stopPropagation()`.
    Whenever we want to stop event propagation, we use this function.


    If you want to stop all event listeners for a specific event, you can also use
    `event.stopImmediatePropagation()`. This will stop all custom event listeners
    for a specific event.


    > More information about preventDefault, stopPropagation, and stopImmediatePropagation
    can be found on MDN at https://developer.mozilla.org/en-US/docs/Web/API/Event/preventDefault,
    https://developer.mozilla.org/en-US/docs/Web/API/Event/stopPropagation, and https://developer.mozilla.org/en-US/docs/Web/API/Event/stopImmediatePropagation.


    # Touch events in D3


    We previously saw that touchmove events don''t propagate mousemove events. While
    both events seem to be identical (one used for mouse and one used for touch),
    there is a small difference. This difference will be very important to understanding
    why we should not simply use identical callback handlers that listen for both
    the events and execute the same function.


    To understand the difference between these events, we simply think about their
    purpose. On Desktop computers, users often move the mouse cursor to reach a certain
    element on the screen. Therefore, the `mousemove` event is targeted to the closest
    element underneath the cursor, for example, the mouse is moving over an element.'
  merge: -1
  img_proc: true
- pgno: 243
  md: "However, a touchmove event happens intentionally on a specific element and\
    \ can be seen like a drag (click and move with a mouse) event. The user aims to\
    \ move a specific element. Due to the intention, the touchmove events are targeted\
    \ to the element that was touched at the beginning and to the element that also\
    \ received the touchstart event. While this seems to be a tiny difference in the\
    \ specification of the mousemove event, it has a big impact on how to implement\
    \ event listeners\n\nLet's take a look at a little sample that implements a proper\
    \ touch interface using D3. We draw a full-sized canvas on the screen and then\
    \ process touch events on the canvas; this can be the start of a small drawing\
    \ application:\n\n```\n```\n<svg class=\"drawing\">\n\n</svg>\n<script>\n$canvas\
    \ = d3.select( '.drawing' )\n    .attr( 'width', document.body.clientWidth)\n\
    \    .attr( 'height', document.body.clientHeight );\n\n$canvas.on( \"touchstart\"\
    , touchstart );\n\nfunction touchstart () {\n    console.log( 'Touch started'\
    \ );\n    d3.event.preventDefault();\n    d3.select( d3.event.target )\n     \
    \   .on( \"touchmove\", touchmove)\n        .on( \"touchend\", touchend );\n}\n\
    \nfunction touchmove () {\n    console.log( 'Touch moving' );\n    d3.event.preventDefault();\n\
    }\n\nfunction touchend () {\n    console.log( 'Touch ending' );\n}\n</script>\n\
    ```\n```\n\nIn the preceding application, we register the touchmove and touchend\
    \ events directly on the target of the touchstart event. This is a nice trick,\
    \ so we don't have to worry about a static target of these events. In the following\
    \ screenshot, we can see how touch events are emulated in Chrome to test this\
    \ small sample application:"
  merge: -1
  img_proc: true
- pgno: 244
  md: '![](img/72559bd4713b2b89631dcca187d7e2db_244_0.png)


    Touch Events emulated in Chrome


    However, when using events with D3, we need to make sure that they don''t propagate
    through the full execution chain and result in mouse emulation. As we already
    saw, events are stored globally in the d3.event object when using D3. You can
    still stop the execution chain of the events and prevent default actions using
    the d3.event.preventDefault() and d3.event.stopPropagation() functions.


    # A note on detecting Touch Devices


    In the first section of this chapter, we heard about feature detection and Modernizr.
    We can simply evolve these thoughts and argue that it should be rather easy to
    detect devices with touch support and maybe offer a different user experience
    to touch devices than to desktop devices.


    While detecting touch support is rather easy and straightforward, there is no
    way of detecting touch devices. We can either check if the touchstart event is
    available, if it is working properly, we could check the device width, and so
    on. In the end, it doesn''t matter because there are no classical touch-only and
    mouse-only devices anymore. There are Android tablets with connected mice, convertibles
    with touch and mouse, laptops with touch and trackballs; the list goes on. You
    will quickly realize that it doesn''t make any sense to categorize these devices
    into touch and non-touch.


    Therefore, my advice is to never implement a feature for touch and another feature
    for mouse interactions rather than implement an interaction that can be used with
    both mouse and touch (and even pen).'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# # A hover state for touch


    We will quickly realize that, when dealing with touch and mouse support, the application
    state needs to be adapted. A very common case for these states is the hover state,
    which can be achieved by hovering over an element with the mouse pointer. The
    following figure shows a typical application of the hover state in a visualization;
    it reveals more information about the current position by hovering over a data
    point:


    ![](img/72559bd4713b2b89631dcca187d7e2db_245_0.png)


    A Hover interaction


    While this is a great use of the current mouse pointer position, this state doesn''t
    (usually) exist in only touch devices. Hence, we need to modify this behavior
    such that even touch devices can access this information. We previously read that
    detecting touch devices is impossible, and therefore, we cannot simply add a button
    for touch devices but should instead rethink the interaction.


    In the preceding example, we can implement a cursor that we can drag from an axis
    into the chart. This might not be a perfect replacement for hover states, but
    it brings us on-track to the new interaction model. We can now argue that a hover
    event (or a simple tap) on the chart reveals a cursor at this position (or the
    closest data point). Practically, it is exactly the same interaction as before;
    however, we now have to also think about how to remove the cursor from the visualization
    — maybe by moving it back onto an axis. I hope you get the idea; by rethinking
    the interaction, I mean exactly this — thinking about where the hover state (or
    tap) can still work and enhance the new interaction by implementing and optimizing
    the interaction for touch devices from beginning to end.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'If you want to support both touch and mouse events, you might be better off
    dropping the hover feature completely and replacing it by a different interaction.
    The reason why we often have problems doing this is that the :hover state is a
    valid CSS selector, and hence it can implement many nice features via CSS rather
    than JavaScript.


    However, if you cannot let go of your hover state, you add the focus state (which
    is also a valid CSS selector) to every hover state. This ensures that a single
    tap on a touch device shows the information as the mouse cursor in the hover state.
    The following example shows the difference between the hover (left) and hover
    + focus (right) states; I encourage you to open it with your touch devices and
    play around (the source is provided with this book):


    ![](img/72559bd4713b2b89631dcca187d7e2db_246_0.png)


    Using hover and focus on touch devices


    > > Note that in some browsers, a click also triggers a hover state (this is different
    to the JavaScript execution chain of events though); therefore, the hover state
    will work just by tapping in some browsers on touch devices


    # # Pointer events – combining mouse, touch and pen


    Browser vendors realized that only emulating mouse events on touch events is not
    enough to solve the problem of multiple interaction devices. Therefore, W3C came
    up with an abstraction layer on top of all pointing input devices and wrote the
    pointer events specification.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'The idea is simple, as shown in the following figure, all pointing input devices
    should not be treated separately (by separate events) but instead be combined
    into a single input device called Pointer. Developers would then implement support
    for pointer events and hence automatically provide a great UI for all the types
    of pointing devices.


    ![](img/72559bd4713b2b89631dcca187d7e2db_247_0.png)


    Pointer events (source. https:// www.w3.org/TR/pointerevents/)


    While this sounds amazing and a great step towards multiple pointing input devices,
    the browser vendors are not very keen to implementing this specification. A quick
    look in the cross-browser compatibility chart (see the following figure) reveals
    that the specification is currently not usable:


    | IE | Edge | Firefox | Chrome | Safari | Opera | iOS Safari * | Opera Mini *
    | Android * Browser | Chrome for Android |

    |---|---|---|---|---|---|---|---|---|---|

    | | | | | | | | | | |

    | | | | | | | | | | |

    | | | | | | | | | | |

    | | | | | | | | | | |

    | | | | | | | | | | |


    The cross-browser compatibility of Pointer Events (source: http:// caniuse.com/
    #feat=pointer)'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'While you might be disappointed now and ask why I am teasing you by bringing
    this pointer event thing up, I believe that in the future browsers will support
    this abstraction for pointing devices. However, be aware that, with Apple''s ForceTouch,
    new interaction possibilities will emerge that may require separated treatment.
    While supporting these features on separate device types for an enhanced user
    experience, treat the Web as a common place for user-friendly, accessible and
    multi-platform applications.


    More information about pointer events can be found on MDN at https://developer.mozilla.org/en-US/docs/Web/API/PointerEvent
    and the W3C website at https://www.w3.org/TR/pointerevents/.


    # # Disabling pointer events for elements


    For completeness, I also want to mention the `pointer-events` CSS property that
    should not be confused with the previously discussed pointer events. This property
    can be used to disable pointer events (hence mouse, touch, and more) on a DOM
    element. While this was part of the SVG specification already, it is now also
    supported on HTML.. The following figure shows the complete cross-browser compatibility:


    ![](img/72559bd4713b2b89631dcca187d7e2db_248_0.png)


    The cross-browser compatibility of the pointer-events property (source: http://caniuse.com/#feat=pointer-events)


    The `pointer-events` property is useful whenever you want to block an element
    from receiving events, such as overlays or partially overlaying elements, or whenever
    you want to make sure that proper elements receive events on touch devices.'
  merge: -1
  img_proc: true
- pgno: 249
  md: "# Let's look at a simple example with overlapping circles:\n\n```\n<style>\n\
    circle.focus:hover, circle.focus:focus {\n  fill: rgba(0, 0, 255, 0.5);\n}\n\n\
    .all-events {\n  pointer-events: auto;\n}\n\n.no-events {\n  pointer-events: none;\n\
    }\n</style>\n<svg class=\"drawing\">\n<circle class=\"focus\" r=\"35.9\" cx=\"\
    50\" cy=\"75\" />\n<circle class=\"all-events\" r=\"35.9\" cx=\"50\" cy=\"50\"\
    \ />\n<circle class=\"focus\" r=\"35.9\" cx=\"150\" cy=\"75\" />\n<circle class=\"\
    no-events\" r=\"35.9\" cx=\"150\" cy=\"50\" />\n</svg>\n```\n\nIn the preceding\
    \ code, we set the first overlapping `circle` element to receive all events properly,\
    \ whereas the second does not receive any events. In the resulting application,\
    \ we can now easily click the second underlying circle, whereas the first one\
    \ is very hard to click due to the overlapping element. Here is a screenshot of\
    \ this example:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_249_0.png)\n\nThe\
    \ Point-events property"
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Summary


    In this chapter, you learned how to solve the most common cross-browser issues
    with the best tools. With Modernizr, we can build a lightweight script that detects
    supported browser features in CSS and JavaScript. We can provide polyfills or
    use a wrapper whenever it is necessary.


    For creating an SVG visualization using D3, we need to be aware of the restrictions
    from the supported SVG specification. Hence, we need to take special care when
    dealing with filters, animations, and clipping paths.


    You learned how to create responsive visualizations that work across all browsers.
    One key thing to remember when using Media Queries is the matchMedia polyfill,
    which is commonly used by other tools to polyfill the native JavaScript function.
    Respond.js is a great polyfill for simple CSS Media Queries, and Enquire.JS motivates
    you to move your Media Queries to JavaScript.


    Finally, we discussed different mouse- and touch-related problems and a solution
    for building cross-browser compatible applications for both mouse and touch. Now,
    you are prepared to implement great responsive visualizations using one of the
    best visualization libraries out there: D3.


    I hope you enjoyed this book; it was a pleasure for me to share some of my passion
    and expertise with you. If you are happy with this book or have any questions,
    remarks, or feedback, please contact me on Twitter at @ChrisiKrnr. Happy coding!'
  merge: -1
  img_proc: true
