  md: 'The previous figure shows that everything looks good so far. Great, we are
    almost there. Finally, we can start drawing the bars in our chart. Before we start
    drawing bars, we need to define the width of our bars as the maximal width divided
    by the number of bars:


    ```

    var barWidth = (width - 2*pad) / (data.length + 1);

    ```


    Now, we can create a data join for the bars using the x value of the dataset as
    the identifier:


    ```

    var $bars = $dataGroup.selectAll(''rect'')

    .data(data, xKey);

    ```


    We can go ahead and create the rect node for all elements in the enter set:


    ```

    $bars.enter()

    .append(''rect'');

    ```


    Next, we move the rectangles to their proper position in the chart by simply using
    the scale function on the values of the dataset:


    ```

    $bars

    .attr(''x'', function(d) { return xScale(d.label); })

    .attr(''y'', function(d) { return yScale(d.y); })

    .attr(''height'', function(d) { return yScale(0) - yScale(d.y); })

    .attr(''width'', barWidth);

    ```


    Please note that, due to the SVG coordinate system, we need to define the y values
    and height of the bars by drawing them from the top to the bottom. Finally, for
    completeness, we also add the last step of our data join and remove all the elements
    from the exit set:


    ```

    $bars.exit()

    .remove();

    ```


    In this example, we will never remove bars from the chart, but it is good practice
    to include the preceding lines to your code. This will become very useful once
    you put the code in a function and call it multiple times.


    Let''s make a slight adjustment to the chart to better stick to the responsive
    visualization topic. As a general rule, one can say that every time we define
    static pixel values, the result will look bad on some or the other device. So,
    what can we change? Well, never use explicit static pixel values but relative
    values extracted from the parent element.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'If we follow this strategy, we can use the width of the body element for our
    chart width. All other values (the height and padding) can be defined relative
    to the width of the chart:


    ```

    var $body = d3.select(''body'');


    // Define the dimensions

    var width = $body[0][0].clientWidth;

    var height = width * 0.5;


    // Define the padding

    var pad = width * 0.1;

    ```


    If we replace the old dimensions with these new computed dimensions, the chart
    will look good on every device that opens the web page. Great! I am very happy
    about how far you have come in this chapter; you can be very proud of yourself.
    You build your first (almost) responsive bar chart!


    # Summary


    In this chapter, you learned how to select DOM elements and do data-driven transformations
    using data joins and dynamic properties. We also saw how to use shape and axis
    generator functions to quickly create common shapes such as lines or areas.


    In the end of this chapter, we built our first simple (almost) responsive bar
    chart. The bar chart already adapts to the width of the browser window on the
    page load, but it doesn''t get recomputed when we change the browser dimensions.


    In the next chapter, we will take a look at loading, filtering, and grouping data.
    This is very important because almost always we will have to load remote data
    in a certain format (such as CSV) and then process, filter, or group it afterwards
    in order to visualize it.'
