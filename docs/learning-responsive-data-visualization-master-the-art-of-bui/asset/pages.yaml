- pgno: 48
  md: '# # Creating a Bar Chart Using D3.js and SVG


    In this chapter, you will learn how to create a bar chart, including proper axis
    and scales– this requires some basic knowledge in D3, which will also be covered
    here. You will learn the following:


    +   - How to select and transform DOM elements using D3

    +   - How to use D3 with SVG elements

    +   - How to use a data-driven approach to create visualizations

    +   - How to use data binding and data joins

    +   - How to use dynamic properties

    +   - How to draw lines, areas, and arcs

    +   - How to use scales

    +   - How to draw axis

    +   - How to create a bar chart


    First, we will start with some simple DOM selections and transformations of HTML
    elements and continue creating SVG elements using D3. We will also see how to
    bind data to the DOM and apply data-driven transformations using data joins and
    dynamic properties.


    In the second section, we will see one of the built-in SVG abstractions in D3–
    the so-called generator functions –especially line, area, and arc generators.
    These abstractions facilitate working with shapes enormously compared to modifying
    the d attribute of SVG path elements manually.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'In the next section, you will learn how to create an axis with axis generators.
    We will have to scale data points in our dataset along the axis; thus, we will
    also look into scales. You will learn about linear scales, ordinal scales for
    non-numeric data, and time scales for time series data.


    In the last section, we will apply all the gathered knowledge and create a simple
    bar chart containing bars (of course), axis, scales, and labels.


    # Getting started with D3.js


    In this chapter, we will create our first bar chart using D3.js and SVG; however,
    to get there, we will have to go through some basics. These basic concepts are
    very important because they will give you the freedom to create visualizations
    for almost everything that you have in your mind. The more of them you know and
    understand, the more crazy things you can do with D3.


    D3.js is a powerful JavaScript library for data-driven DOM manipulations and includes
    predefined abstractions, transformations, and helpers to work with SVG elements.
    This makes it an excellent library to write interactive data visualization components
    using web standards and the complete capabilities of modern web browsers.


    Don''t worry if you think that this definition is full of fancy buzzwords because
    in this section, we will walk through all of them. You will understand exactly
    what they mean and why this makes D3 and SVG a great combination to create visualizations.


    # Selecting and manipulating DOM elements


    D3 lets us select, append, insert, and remove elements in the DOM tree. These
    functions will look very familiar if you''ve already worked with other JavaScript
    frameworks, such as jQuery.


    Let''s look at some examples to see how this works in D3. We define a simple shopping
    list in HTML that contains a few items that we need to buy:


    ```

    <ul>

    <li>Ham</li>

    <li>Cheese</li>

    <li>Butter</li>

    <li>Bread</li>

    </ul>

    ```'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'To select elements in the DOM tree, D3 provides the `d3.select(selector)` and
    `d3.selectAll(selector)` methods, which return a **Selection** object. The Selection
    of the first function contains an array with only a single element, whereas the
    second one contains an array with multiple elements; both the functions take a
    CSS3 selector string as an argument (for example, `#id`, `.class`, `tagname`,
    `:pseudo`, and more.).


    > More information about Selections can be found on the D3 Github page at https://github.com/mbostock/d3/wiki/Selections.
    More information about CSS3 Selectors can be found on MDN at https://developer.mozilla.org/en-US/docs/Web/Guide/CSS/Getting_started/Selectors.


    Under the hood, D3 uses the native `document.querySelector(selector)` and `document.querySelectorAll(selector)`
    functions:


    > More information about these functions can be found on MDN at https://developer.mozilla.org/en/docs/Web/API/Document/querySelector
    and https://developer.mozilla.org/en/docs/Web/API/Document/querySelectorAll.


    ```

    var $ul = d3.select(''ul'');

    var $li = d3.selectAll(''li'');

    ```


    In the preceding code, we create the $ul Selection of the ul element and the $li
    Selection, which contains all the li elements.


    > Throughout this book, we will use this convention to prefix selections with
    the $ sign; this will make it easier for you to recognize selections.


    Once we have a Selection, we can add more elements to the DOM. One possibility
    is to append a new DOM node at the end of the Selection using the `selection.append(tagName)`
    method; we need to specify the type of element that we want to append by its tag
    name (for example, `div`, `p`, `span`, `li`, `ul`, and more):


    ```

    var $li1 = $ul.append(''li'');

    $li1.text(''Milk'');

    ```'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'In the preceding code, we can see that the `selection.append (tagName)` method
    returns a Selection that contains the element that was just created. We then use
    the `selection.text (content)` method to set the inner text of the node to ''Milk''.
    We can also insert an element before a certain position using the `selection.insert(tagName,
    selector)` method:


    ```

    var $el2 = $ul.insert(''li'', '':last-child'');

    $el2.text(''Beer'');

    ```


    In the preceding code, we inserted a li element with the Eggs text before the
    last child of the list Selection called $ul. If we want to remove an element from
    the DOM, we can call the `selection.remove()` method:


    ```

    $ul.select('':first-child'').remove();

    ```


    We remove the first child of the list by calling the `selection.remove()` function.
    However, we observe that we can call the function directly on the returned object
    of the `selection.select()` method rather than creating a new variable that contains
    this element. This technique is called **function chaining** and is often used
    when working with D3. We can also chain the `selection.insert()` and `selection.append()`
    functions from the previous examples and apply the `selection.text()` method directly
    on the returned selection.


    We may just want to strike through the last element instead of removing it. The
    `selection.attr(name, value)` function allows us to modify any attribute of the
    selected elements:


    ```

    $ul.select('':first-child'')

    .attr(''class'', ''strike-through'');

    ```


    In the preceding code, we used the `selection.attr(name, value)` method to access
    the class attribute and set it to strike-through. If we now define a class style
    in the header, we see that the first element has a line through the text


    ```

    <style>

    .strike-through {

    text-decoration: line-through;

    }

    </style>

    ```


    Optionally, we can also use the `selection.classed(className, hasClass)` method
    to add or remove classes to the selections:


    ```

    $ul.select('':first-child'')

    .classed(''strike-through'', true);

    ```'
  merge: -1
  img_proc: true
- pgno: 52
  md: "In the preceding code, we observe that we now only mention a single class that\
    \ comes handy when you want to toggle a class and keep the others untouched.\n\
    \n> Under the hood, D3 uses the native element.setAttribute(name, value) and element.setAttributeNS(namespace,\
    \ name, value) functions to access HTML and SVG attributes. This makes D3 very\
    \ powerful as it directly uses the underlying web standards rather than implementing\
    \ an abstraction on top.\n\n# Manipulating SVG elements\n\nUntil now, we have\
    \ only used D3 to manipulate HTML nodes; if you compare this functionality to\
    \ jQuery, you learned nothing new or fancy. The good news is that we can also\
    \ apply all the D3 functions to SVG elements as these elements are also just embedded\
    \ in the DOM tree.\n\nLet's create a small SVG scene that will contain our elements;\
    \ we can also add some styling to the svg element for better visibility:\n\n```\n\
    <style>\nsvg {\n\tborder: 1px dashed black;\n\tbackground-color: #efefef;\n}\n\
    </style>\n<svg width=\"800\" height=\"400\"></svg>\n```\n\nNow, we can again use\
    \ the selection.append() and selection.attr() functions to add elements to the\
    \ scene and define their attributes. Similar to the previous example, we will\
    \ also chain the functions together rather than creating a variable for the new\
    \ element:\n\n```\n// Select the SVG element\nvar $svg = d3.select('svg');\n\n\
    // Append a new circle element\n$svg.append('circle')\n\t.attr({\n\tcx: 75,\n\t\
    cy: 75,\n\tr: 50,\n\tfill: 'red'\n\t});\n```"
  merge: -1
  img_proc: true
- pgno: 53
  md: 'In the preceding example, we can select and manipulate SVG elements exactly
    as we did before with HTML elements. We also observe that the selection.attr()
    function accepts an object that contains multiple name: value pairs. This becomes
    very handy when working with SVG elements as we often have to define multiple
    attributes at once. The following figure shows the output of this example in the
    browser:


    ![](img/72559bd4713b2b89631dcca187d7e2db_53_0.png)


    Simple SVG scene with one circle


    # Data-driven transformations


    In the previous section we saw that the out-of-the box handling of SVG elements
    makes D3 much more suitable for creating visualizations than for example jQuery.
    But this is not the only difference between both the frameworks. One of the most
    important, and also most unique, features of D3 is data joining. Data joins are
    a core concept of D3, and for most of the people this is the most difficult thing
    to understand while learning D3. However, it is just an extension of data binding
    that also takes the current selection into account. You will quickly find out
    that it is a very logical rather than mysterious feature.


    # Data Binding and Dynamic Properties


    D3 stands for data-driven documents; but what is a data-driven approach? Data-driven
    means that the visualization is implicitly defined through the data itself rather
    than explicitly looping through the data.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Let''s take an example using the explicit loop to draw multiple circles on
    the scene.

    We are use the same SVG scene as the previous example:


    ```

    // Explicit for loop

    for (var i=0;i<5;i++){

    $svg.append(''circle'')

    .attr({

    cx: 125 * (i + 1),

    cy: 75,

    r: 50,

    fill: ''red''

    });

    }

    ```


    In the preceding example, we use an explicit loop to iterate over five numbers
    to draw five items. The following figure shows the output of the preceding example

    in the web browser:


    ![](img/72559bd4713b2b89631dcca187d7e2db_54_0.png)


    Obviously, if we are dealing with datasets, which could be an example extracted

    from the logs of an application, we don''t want to use the for() loop but iterate

    over the data array directly using the forEach() loop. Let''s create a pseudo
    data

    array containing the integers in a (0, 5) range (0 is included, but 5 is not included

    anymore) with the d3.range(stop) function:


    ```

    // Create a pseudo dataset

    var data = d3.range(5);

    ```'
  merge: -1
  img_proc: true
- pgno: 55
  md: '```

    // Explicit forEach loop

    data.forEach(function(d, i) {

    $svg.append(''circle'')

    .attr({

    cx: 125 * (d + 1),

    cy: 75,

    r: 50,

    fill: ''red''

    }});

    });

    ```


    The preceding code already looks a little bit cleaner than the primitive for()
    loop. We observe that the callback function has two attributes—d and i. In general,
    d is a reference to the current element of the array, and i is the index of the
    current element in the array. Great! Let''s add one final step to transform the
    loop to a data-driven implementation:


    ```

    // Create a pseudo dataset

    var data = d3.range(5);


    // Data-driven approach

    $svg.selectAll(''circle'')

    .data(data)

    .enter()

    .append(''circle'')

    .attr({

    cy: 75,

    r: 50,

    fill: ''red''

    })


    .attr(''cx'', function(d, i) { return 125 * (d + 1) });

    ```


    First, I want to draw your attention to the .data(data) method; this function
    is used to bind the data array to the Selection. We will discuss this function
    and the preceding .enter() function in more detail in the following section. The
    second line that I would like to point out is .attr(''cx'', function(d, i) { ...
    }); this is the so-called dynamic property – a property that will be dynamically
    computed by the bound data array where the d and i arguments are used exactly
    like in the previous forEach callback.


    Let''s summarize the data-driven approach. We bind a data array to a selection
    of DOM elements and use dynamic properties to define the attributes of the elements
    by the bound data. Thus, we don''t need to loop through the dataset anymore. However,
    the previous example is a little bit more complicated than just this, which is
    due to data joins.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# # Data Join – next-level data binding


    As we saw in the previous example, the `selection.data(data)` function binds a
    dataset to a selection – at least this is what we covered so far. To be more precise,
    the function does a little bit more than this; it creates a join between a selection
    and dataset. In the following figure we can see how the data join looks:


    ![](img/72559bd4713b2b89631dcca187d7e2db_56_0.png)


    We can think of the data join by simply comparing the dataset (the red circle
    in the previous figure) with the Selection (the blue circle in the previous figure)
    of DOM elements. After comparing the elements of the dataset with the elements
    in the Selection, we obtain three possible sets of elements:


    +   - The enter set: These elements exist in the dataset but not in the Selection,
    so we want to create them

    +   - The update set: These elements exist in the dataset and in the Selection,
    so we want to update them

    +   - The exit set: These elements exist in the Selection but not in the dataset,
    so we want to remove them


    To better understand how this works, we will illustrate it with some code. We
    will again use the same HTML setup as we did in the previous examples. First,
    we create a dataset and join it with a Selection:


    ```

    // Create a dataset

    var data = d3.range(3);


    // Create a data join

    var $circles = $svg.selectAll(''circle'')

    .data(data);

    ```'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'In the preceding example, we first create a dataset in the [0, 3) range. Then,
    we create a Selection of all the `circle` elements and join them with the dataset.
    In this case, there are no `circle` elements in the scene, so the Selection is
    empty. This means that the enter set will contain all the three dataset elements;
    the update and exit sets will be empty.


    > Throughout this book, we will use the convention to the _data joins_ prefix
    with two $ signs; this will make it easier for you to spot a Join and differentiate
    it from a Selection.


    We can now use the `join.enter()` function to return the elements of the enter
    set (the data array) and add them to the DOM:


    ```

    // Get the enter set

    $$circles.enter()

    .append(''circle'')

    .attr({cy: 75, r: 50})

    .attr(''cx'', function(d, i) { return 125 * (d + 1) });

    ```


    Calling the `join.enter()` function removes the elements from the enter set and
    adds them to the update set. Imagine that the enter set is an array, that stores
    all values from the dataset that are not in the current selection. After calling
    `.enter()`, one would usually like to add the elements to the DOM. This is why
    D3 automatically assumes this and moves all the values from the enter set to the
    update set. Now, after calling `.enter()`, the enter set gets empty and the update
    set contains all the values from the enter set. We can retrieve the update set
    using the data join as a Selection:


    ```

    // Modify the update set

    $$circles.attr(''fill'', ''blue'');

    ```


    The preceding code will color all the circles in blue because all the elements
    from the dataset exist now in the Selection of HTML elements.


    Finally, we will remove one element from the dataset and join the data again with
    the Selection; we can then access the exit set by calling the `join.exit()` function
    and therefore remove the element from the Selection:


    ```

    // Remove an element from the dataset

    data.splice(0, 1);


    // Create a data join

    ```'
  merge: -1
  img_proc: true
- pgno: 58
  md: '```

    $$circles = $svg.selectAll(''circle'')

    .data(data);


    // Get the exit set

    $$circles.exit()

    .remove();

    ```


    In the preceding code, we see that we can simply join the dataset again with the
    Selection to obtain the updated sets. This is very powerful because we can use
    one function to define how the elements should be drawn on the screen. To update
    the elements, we will again call the function with the updated dataset; all we
    need to do is define what happens with the new, existing, and removed elements.


    To summarize the data join section, I will list the three functions that we used
    to access the three sets of the data join:


    +   - The enter set: selection.data(data).enter()

    +   - The update set: selection.data(data)

    +   - The exit set: selection.data(data).exit()


    The following figure visualizes the first two steps. We start with an empty selection
    at the left of the figure; there are no circles yet in the scene. Then, we join
    the dataset to this empty selection; we obtain an enter set with three elements.
    For each element in the enter set, we create a circle in the scene and configure
    its position using the dynamic property for the cx attribute.


    If we want to update the circles now, we can simply use the data join as a selection.
    This will return an update set that contains all the three circles.


    | Selection | Data | enter | Selection | Data | update | Selection | Selection
    |

    |---|---|---|---|---|---|---|---|

    | | 0 | → | | 0 | → | circle | circle |

    | | 1 | → | | 1 | → | circle | circle |

    | | 2 | → | | 2 | → | circle | circle |


    Data join: enter and update sets'
  merge: -1
  img_proc: true
- pgno: 59
  md: "In the following figure, we remove one element form the dataset, see what happens\
    \ in the update, and exit set. After the previous operation, our selection contained\
    \ three circle elements. If we remove the last element from the dataset, the update\
    \ set will contain only two elements. The last element of the Selection will now\
    \ be in the exit set, and it can be removed from the selection in the following\
    \ step:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_59_0.png)\n\n# Using the update\
    \ pattern\n\nIt is a little bit difficult to understand which set to use in order\
    \ to update specific elements. Therefore, we can use the so-called **Update Pattern**\
    \ that defines the order in which the elements can be updated.\n\nLet's create\
    \ a function to illustrate this pattern:\n\n```\nfunction draw(data) {\n  // Create\
    \ a data join\n  var $$circles = $$svg.selectAll('circle')\n    .data(data);\n\
    \n  // Only previously existing elements\n  $$circles.attr('fill', 'blue');\n\n\
    \  // Only new elements\n  $$circles.enter()\n    .append('circle');\n\n  // All\
    \ elements\n  $$circles.attr('fill', 'red');\n\n  // Only removed elements\n \
    \ $$circles.exit()\n    .remove();\n}\n```"
  merge: -1
  img_proc: true
- pgno: 60
  md: "If we execute the preceding function multiple times with different data arguments,\
    \ we can properly define what happens to the following elements:\n\n+   - Only\
    \ old (previously existing) elements\n+   - Only new elements\n+   - All elements\n\
    +   - Only removed elements\n\n> There are three great examples about the update\
    \ pattern on Mike Bostock's Bl.ocks page. I recommend taking a look at all three\
    \ and trying to understand what exactly is going on in the examples:\n> \n> -\
    \ http://bl.ocks.org/mbostock/3808218\n> - http://bl.ocks.org/mbostock/3808221\n\
    > - http://bl.ocks.org/mbostock/3808234\n\n# Defining an Identifier for the elements\n\
    \nIf we look at the API documentation of the selection.data(data, keyFn) method,\
    \ we can see that this function takes a second argument called keyFn. With this\
    \ keyFn argument, one can define an accessor function that identifies the element\
    \ of the array in a data join.\n\nLet's look at an example where we use the draw(data)\
    \ function that we implemented in the previous section:\n\n```\n// Create 4 elements\n\
    draw([0, 1, 2, 3]);\n// Update 4 elements\ndraw([1, 2, 3, 4]);\n```\n\nIf we don't\
    \ define a keyFn argument, D3 uses the index of the data array as an identifier\
    \ for the element. In the preceding example, the function first creates four circles;\
    \ in the second step, it updates these four circles. However, if we look closely,\
    \ we see that a part of the data is the same but only shifted to the left. Thus,\
    \ we would rather want a behavior in which 0 gets removed from the Selection,\
    \ [1, 2, 3] stays the same, and 4 gets added to the Selection. We can achieve\
    \ this using the array value as an identifier rather than the array index. Let's\
    \ define a custom keyFn that returns the array element as identifier.\n\n```\n\
    var $$circles = $svg.selectAll('circle')\n.data(data, function(d, i){ return d;\
    \ });\n```\n\nIn the preceding example, we define an identifier function in the\
    \ same way as the callback functions that we used in dynamic properties."
  merge: -1
  img_proc: true
- pgno: 61
  md: "# # Drawing shapes with D3\n\nD3 is a great library to create web visualizations\
    \ because it includes a lot of useful abstractions when working with SVG elements.\
    \ In this section, we will look at some of these SVG abstractions to draw shapes.\
    \ These abstractions for drawing shapes are called generators in D3; we will mainly\
    \ use the line-, area-, and arc-generators when creating visualizations.\n\n>\
    \ All SVG shape abstractions can be found in the D3 Github page at https://github.com/mbostock/d3/wiki/API-Reference#d3svg-svg.\n\
    \n# # Drawing Lines and Curves\n\nIf you've ever used the SVG path element and\
    \ the d attribute to create custom shapes or Bézier curves, you already know that\
    \ this is not as easy as it should be. Those who have never used the SVG path\
    \ element only need to know that you would have to learn a special syntax to define\
    \ and concatenate control points for a Bézier curve.\n\n> You can find more information\
    \ about the d attribute on MDN at https://developer.mozilla.org/en-US/docs/Web/SVG/Attribute/d.\n\
    \nThankfully, D3 provides a great abstraction to draw lines. Let's take a look\
    \ at a simple example. First, let's create a dataset containing the x and y coordinates\
    \ of some points:\n\n```\nvar data = [\n    [100, 100], [200, 350], [300, 50],\n\
    \    [400, 200], [500, 250], [600, 40], [700, 100]\n];\n```\n\nNow, we want to\
    \ create a line generator that returns the first element of a data point as the\
    \ x coordinate and the second value of the data point as the y coordinate:\n\n\
    ```\nvar line = d3.svg.line()\n    .x(function(d, i) { return d[0]; })\n    .y(function(d,\
    \ i) { return d[1]; });\n```"
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Perfect! This is already our line generator. The advantage is that we only
    have to define the structure of the line generator, that is, where in the dataset
    it can find the x and y coordinates, and we can then draw any dataset that follows
    the same structure. Let''s draw the line; we need to use the selection.datum()
    method to bind one specific datum to the selection. In contrary to the previously
    discussed data joins, this function will not compute a join but only returns a
    selection. Then, we can apply the line generator to the d attribute of the path,
    which will implicitly look for the bound data and creates the proper d string:


    ```

    $svg.datum(data)

    .append("path")

    .attr("d", line);

    ```


    The following figure shows a result of this example in the web browser:


    ![](img/72559bd4713b2b89631dcca187d7e2db_62_0.png)


    Output of a simple line generator


    In the previous example, you learned how to create a simple line generator that
    only connects the points of the dataset together. We can now easily define an
    interpolation method on the line generator in order to draw a smooth line:


    ```

    var line = d3.svg.line()

    .x(function(d, i) { return d[0]; })

    .y(function(d, i) { return d[1]; })

    .interpolate(''cardinal'');

    ```'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'In the preceding example, we used the `cardinal` interpolation, which is a
    similar interpolation technique used in Bézier curves. If we look at the resulting
    line in the following figure, we see that the lines between the data points are
    now interpolated:


    ![](img/72559bd4713b2b89631dcca187d7e2db_63_0.png)


    Output of an interpolated line


    The smoothness of the interpolation can be controlled by the `.tension(value)`
    function. In the following figure, we can see the difference between tension 1,
    which is the edgy inner line, to tension 0.5, which is the smooth outer line:


    ![](img/72559bd4713b2b89631dcca187d7e2db_63_1.png)


    Line with different tension values'
  merge: -1
  img_proc: true
- pgno: 64
  md: "# Drawing Areas between curves\n\nSimilar to the line generator, D3 also provides\
    \ an area generator that allows us to use 2 y coordinates: y0 and y1. Let's first\
    \ create a dataset where the first element of the data point contains the x value,\
    \ the second element the first y coordinate, and the third element the second\
    \ y coordinate:\n\n```\nvar data = [\n\t[100, 100, 100], [200, 350, 200], [300,\
    \ 50, 50],\n\t[400, 200, 350], [500, 250, 375], [600, 40, 100], [700, 100, 100]\n\
    ];\n```\n\nNow, we can create an area generator similar to the previous example:\n\
    \n```\nvar area = d3.svg.area()\n\t.x(function(d, i) { return d[0]; })\n\t.y0(function(d,\
    \ i) { return d[1]; })\n\t.y1(function(d, i) { return d[2]; })\n\t.interpolate('cardinal');\n\
    ```\n\nFinally, we apply the area generator to the d attribute of the path element:\n\
    \n```\n$svg.datum(data)\n\t.append(\"path\")\n\t.attr(\"d\", area);\n```\n\nThe\
    \ following figure shows the result of the created area path:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_64_0.png)\n\
    \nOutput of an area generator"
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # Drawing arcs


    The third complex shape that is often used in visualizations is an arc. D3 also
    provides a generator function for this to easily draw arcs with polar coordinates.
    Again, if you have ever dealt with arcs in SVG, you will probably be very glad
    to know this generator.


    Let''s create an arc generator:


    ```

    var arc = d3.svg.arc()

    .innerRadius(40)

    .outerRadius(100)

    .startAngle(0)

    .endAngle(Math.PI);

    ```


    In the preceding code, we see that we can define inner and outer radius as well
    as the start and ending angles of the arc in radiant. Similarly to the previous
    example, we can now generate the d attribute for a path element:


    ```

    $svg.append("path")

    .attr("d", arc)

    .attr("transform", "translate(200, 200)");

    ```


    In the previous example, we observe that we need to translate the arc a little
    bit in order to make it visible. The output of the example in the web browser
    is displayed in the following figure:


    ![](img/72559bd4713b2b89631dcca187d7e2db_65_0.png)


    Output of an arc generator


    D3 provides more useful methods on the generator functions, for example, the arc.centroid()
    method. This function returns the center of the arc shape and suits perfectly
    to display labels with an arc.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# # Creating Scales and Axis


    D3 is often mistaken for a charting library, which is not really correct. D3 provides
    loads of built-in functions to easily create interactive charts; however, it is
    not a charting library. One of these typical built-in charting helpers are the
    closely related Scales and axis generators. You will learn about them in this
    section.


    At the end of this section, we want to be able to draw a simple axis as the one
    in the following figure. Therefore, we need to scale our dataset to a specific
    pixel range (using Scales) and create all the SVG elements for the axis (using
    axis generators):


    ![](img/72559bd4713b2b89631dcca187d7e2db_66_0.png)


    Axis in D3


    # # Mapping data values to a Pixel Range with scales


    The concept of scales is very important when we deal with graphics and visualization.
    It is a common task to scale values from a certain domain to a certain range of
    pixels. We need them to create tick values on axes, and we need them to scale
    our data points to the area of the chart.


    The following figure explains the problem a little bit better. Imagine we want
    to map a certain domain of values in our dataset (let''s say only the positive
    values) to a certain pixel range in the chart (let''s say from 20px to 460px).
    Scales give us exactly this functionality in D3:


    ![](img/72559bd4713b2b89631dcca187d7e2db_66_1.png)


    Scale in D3'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'I want to emphasize again on the naming convention in D3. We are speaking in
    terms of domains about a certain extent of the dataset and in terms of ranges
    about a certain pixel range. Whenever we want to apply linear transformations
    (as in the previous figure), we speak about *linear* scales.


    # Linear Scales for linear Mappings


    Let''s take a look at the simplest mappings-linear transformations, and create
    one according to the previous figure:


    ```

    var scale = d3.scale.linear()

    .domain([0, 52])

    .range([20, 460]);

    ```


    In the preceding code, we observe that we can use the `d3.scale.linear()` function
    to create an identity scale (maps domain [0, 1] to a range [0, 1]), and then specify
    a domain and a range for this scale.


    Let''s see how this scale object works; actually, we can just call it as a function,
    and it will now scale any value from the dataset to the pixel range. Let''s try
    this and map the whole dataset with this scale:


    ```

    console.log([0, 3, 9, 24, 45, 52].map(scale));

    ```


    If we check the output in the Developer Tools console, we get an array similar
    to the following:


    ```

    [20, 45.38461538461539, 96.15384615384615, 223.0769230769231,

    400.7692307692308, 460]

    ```


    We can see in the output of the preceding function that every value from the input
    array is transformed with the scale function to the new pixel range.


    # Ordinal scale for Mapping non-numeric data


    Often, we have to deal with non-numerical— the so-called ordinal data; if we look
    into a bar chart, we usually have values that belong to a certain label rather
    than a specific x value. In this case, it''s perfect to use ordinal scales in
    order to map these non-numeric values to the pixel range.


    First, let''s create a simple one:


    ```

    var data = [''Bread'', ''Eggs'', ''Milk'', ''Beer''];

    var scale = d3.scale.ordinal()

    .domain(data)

    .range([0, 1, 2, 3]);

    ```'
  merge: -1
  img_proc: true
- pgno: 68
  md: "In the preceding example, we first create a dataset, which we also define as\
    \ the domain of the ordinal scale. In the second step, we define a range on which\
    \ the data values should be projected. If we map the whole dataset, the result\
    \ is equal to our defined range:\n\n```\nconsole.log(data.map(scale));\n// [ 0,\
    \ 1, 2, 3 ]\n```\n\nIf we want to define a continuous pixel range for the discrete\
    \ points, we can use the .rangePoints() method instead. Let's look at an example:\n\
    \n```\nvar scale = d3.scale.ordinal()\n  .domain(data)\n  .rangePoints([0, 10]);\n\
    \nconsole.log(data.map(scale));\n// [ 0, 3.333333333333335, 6.666666666666667,\
    \ 10 ]\n```\n\nIn addition, we can also define a range that considers the structure\
    \ of a bar chart—namely the .rangeBands() method. This function takes into account\
    \ the fact that we need to shift the bars half the width of one bar to the left\
    \ to match the tick values.\n\n```\nvar scale = d3.scale.ordinal()\n  .domain(data)\n\
    \  .rangeBands([0, 10]);\n\nconsole.log(data.map(scale));\n// [ 0, 2.5, 5, 7.5\
    \ ]\n```\n\n# # Time scales for Mapping time series data\n\nFinally, there also\
    \ exists a scale, when working with time series data, which maps JavaScript Date\
    \ objects to pixel ranges. Let's see an example; first, we define an array of\
    \ Date objects:\n\n```\nvar data = [\n  new Date(2015, 8, 1),\n  new Date(2015,\
    \ 8, 2),\n  new Date(2015, 8, 3),\n  new Date(2015, 8, 4)\n];\n```"
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Now, we can define our scale; we will use the d3.extent(data) function to return
    the [min, max] value of the data:


    ```

    ```javascript

    var scale = d3.time.scale()

    .domain(d3.extent(data))

    .range([20, 460]);

    ```

    ```


    If we map our dataset to the new range, we get values inside the [20, 460] range:


    ```

    ```javascript

    console.log(data.map(scale));

    // [20, 166.666666666666, 313.333333333333, 460]

    ```

    ```


    # # Creating Axis


    When creating axis in D3, we want to use the feature provided by scales in order
    to map the dataset to a range of pixels. In the following figure, we can see an
    example from the Developer Tools and how the final result of the axes looks:


    ![](img/72559bd4713b2b89631dcca187d7e2db_69_0.png)


    D3 axis selected in the Developer Tools


    First, we need to define a scale for the axis that handles the mapping:


    ```

    ```javascript

    var scale = d3.scale.linear()

    .domain([0, 10])

    .range([20, 380]);

    ```

    ```


    Now, we can create an axis generator that works very similarly to the previously
    mentioned generators:


    ```

    ```javascript

    var axis = d3.svg.axis()

    .scale(scale);

    ```

    ```


    Finally, we can draw the axis by simply passing the generator function to the
    .call() method on any (empty) selection in which we want to create the axis:


    ```

    ```javascript

    d3.select(''svg'')

    .call(axis);

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 70
  md: "That was it, no magic, no struggle.\n\n> D3 has loads of built-in functionality\
    \ when dealing with axes. It's absolutely worth taking a look at the corresponding\
    \ section in the Wiki page available at https://github.com/mbostock/d3/wiki/SVG-Axes.\n\
    \n# A simple bar chart\n\nCongratulations, you've gathered all the knowledge to\
    \ build your first bar chart; and this is exactly what we will do in this section.\
    \ In the following figure, we will create a bar chart that has axis, scales, bars,\
    \ and labels.\n\n![](img/72559bd4713b2b89631dcca187d7e2db_70_0.png)\n\nA simple\
    \ bar chart\n\nLet's start with a simple setup—a blank HTML page that loads the\
    \ D3 library from the bower components directory. In addition, we define the crispEdges\
    \ rendering for path elements in the header:\n\n```\n<!doctype HTML>\n<html>\n\
    <head>\n<title>Bar Chart</title>\n<script src=\"bower_components/d3/d3.min.js\"\
    ></script>\n<style>\n.axis path, .axis line {\n    fill: none;\n```"
  merge: -1
  img_proc: true
- pgno: 71
  md: '```

    stroke: #999;

    shape-rendering: crispEdges;

    }

    .data rect {

    stroke: red;

    fill: rgba(255, 0, 0, 0.5);

    }

    </style>

    </head>

    <body>

    <script>

    // Our code goes here

