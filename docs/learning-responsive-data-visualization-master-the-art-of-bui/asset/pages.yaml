    Cross-browser compatibility Media Queries from http://caniuse.com/#feat=css-mediaqueries


    # ## Understanding Breakpoints


    In Responsive Design, we call a **state** when a certain layout and Media Query
    is active, and we call a **breakpoint** the transition from one state to another.


    Let''s look at an example. First, we define some screen dimensions for the following
    devices:


    +   - <768px is for phones

    +   - 768px-992px is for tablets

    +   - 992px-1200px is for desktops

    +   - ≥1200px is for large devices and TVs'
