- pgno: 147
  md: 'While CSS animations are a good choice for animating and transforming HTML
    elements, they limit us for creating complex animated visualizations in SVG.

    When it comes to path interpolations and shape tweens, we better choose an

    approach in JavaScript.


    # # Animating anything using JavaScript


    Are JavaScript Animations the best and most standard way to animate DOM

    element? Well, not really. They allow all kinds of animations: custom path

    interpolations, and so on, but they have to explicitly modify the DOM.


    Let''s try the same example as before where we animate the x position of a rectangle.

    We therefore create a little helper function in JavaScript called animate():


    ```

    <svg width="800" height="600">

    <rect x="50" y="60" width="100" height="100"></rect>

    </svg>

    <script>

    var rects = document.getElementsByTagName(''rect'');


    animate(rects[0], ''x'', 50, 650);


    function animate(elem, attributeName, startValue, endValue) {

    var timeStep = 1;

    var valueStep = 5;


    var intervalId = setInterval(function() {

    var value = parseFloat(elem.getAttribute(attributeName));

    elem.setAttribute(attributeName, value + valueStep);


    if (value >= endValue) {

    elem.setAttribute(attributeName, startValue);

    clearInterval(intervalId);

    }

    }, timeStep);

    }

    </script>

    ```


    In the preceding code, we do the exact same as in the previous example. We animate

    the x position of the rectangle to move it to the right-hand side. However, as
    you can

    see, we have to code everything ourselves, including the handling of the time
    interval.

    We can improve the performance of the preceding example using the highest framerate

    of the browser using the native window.requestAnimationFrame(callback) timer.

    However, whenever we handle timers ourselves, we have to pay extra attention to

    start, pause and stop them properly.'
  merge: -1
  img_proc: true
- pgno: 148
  md: "Hold on, is there something called the Web animations API that would make the\
    \ preceding code much easier? Yeah, exactly; finally, we understand why SMIL has\
    \ been deprecated in the Chrome browser. W3C is already working on a specification\
    \ for a native Web animation API that supports animations natively and provides\
    \ an easy interface for animations. The specification is still in draft, but it\
    \ is already a good time to get excited about it, as it will bring a clean interface\
    \ for animations and a nice performance boost for your JavaScript animations.\n\
    \nLet's see the preceding example with the Web Animation API:\n\n```\n<svg width=\"\
    800\" height=\"600\">\n<rect x=\"50\" y=\"60\" width=\"100\" height=\"100\"></rect>\n\
    </svg>\n<script>\nvar rects = document.getElementsByTagName('rect');\nrects[0].animate([\n\
    \  { x: 50 },\n  { x: 650 }\n], {\n  duration: 1000,\n  fill: 'none'\n});\n</script>\n\
    ```\n\nIn the preceding code, we can see that we get the beautiful declarative\
    \ way of animations paired with a CSS-like native support directly in JavaScript.\
    \ This will be the standard way to do animations in the coming years; however,\
    \ if we look at present (in the following figure), things don't look so good.\
    \ As I said before, the specification is still in draft, and therefore the browser\
    \ support is still pretty bad. This means we will have to use the abstraction\
    \ of JavaScript timers for animation currently, but we should keep this awesome\
    \ API in our heads:\n\n| IE | Edge | Firefox | Chrome | Safari | Opera | iOS Safari\
    \ | Opera Mini | Android Browser | Chrome for Android |\n| :---: | :---: | :---:\
    \ | :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| | | | | | | | |\
    \ | |\n| | | | | | | | | | |\n| | | | | | | | | | |\n| | | | | | | | | | |\n|\
    \ | | | | | | | | | |\n\nThe cross-browser compatibility of the Web Animation\
    \ API"
