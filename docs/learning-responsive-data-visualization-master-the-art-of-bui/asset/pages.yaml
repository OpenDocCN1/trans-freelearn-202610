- pgno: 112
  md: '# # The conclusion of using Viewport scaling


    While this is an excellent solution for certain use cases, it has two major drawbacks:


    +   - The whole chart always gets scaled; we can only prevent strokes from scaling

    +   - Due to the fact that the browser is recomputing all the values automatically,
    we cannot adapt the resolution of the data of charts


    Also, the first point is the major drawback. Scaling the chart to the viewport
    is great in certain situations: however, it is not very flexible, especially because
    we would also be scaling fonts and because we need to preserve the aspect ratio;
    so, we cannot scale the chart to arbitrary dimensions. Moreover, we have to be
    extremely careful with using initial dimensions that are not too big or small
    in order to not scale thin lines too big or scale details too small.


    The second argument doesn''t play a huge role anymore compared to the first one
    and can be circumvented using some additional JavaScript event listeners.


    # ## Using the JavaScript resize event


    The last option is to use JavaScript event handlers and redraw the chart manually
    when the dimensions of the parent container change. Using this technique, we can
    always measure the width of the parent container (in absolute units) and use this
    length to update and redraw the chart accordingly. This gives us great flexibility
    over the data resolution, and we can also adapt the chart to a different aspect
    ratio when needed.


    # ## The native resize event


    Theoretically, this solution sounds brilliant; we simply watch the parent container
    or the SVG container (if it uses a width of 100%) for resize events, and then
    we redraw the chart when the dimensions of the element change. However, there
    does not exist a native resize event on the div or svg element; modern browsers
    only support the resize events on the window element. Hence, it only triggers
    if the dimensions of the browser window change. This also means that we need to
    clean up listeners once we have removed a chart from the page.


    Although this is a limitation, in most cases, we can still use the window resize
    event to adapt the chart to its parent container; we have to just keep this in
    our mind.'
  merge: -1
  img_proc: true
- pgno: 113
  md: "Let's always use the parent container's absolute dimensions to draw and redraw\
    \ the chart; we need to define the following things inside a redraw function:\n\
    \n```\nvar width = chart.clientWidth;\nvar height = width / aspectRatio;\n```\n\
    \nNow, we can add an resize event listener to the window element and call the\
    \ redraw function whenever the window dimensions change:\n\n```\nwindow.addEventListener('resize',\
    \ function(event) {\n    redraw();\n});\n```\n\nThe benefit of this solution is\
    \ that we can do anything we want in the redraw function, for example, modifying\
    \ the aspect ratio, adapting the labels of the axis, or modifying the number of\
    \ displayed elements.\n\nThe following figure shows a resized version of the previous\
    \ chart; we observe that this time, the axis ticks adapt nicely and don't overlap\
    \ anymore. Moreover, the axis ticks now take the full space available:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_113_0.png)\n\
    \nThe resized chart with adapted axis ticks"
  merge: -1
  img_proc: true
- pgno: 114
  md: "# Adapting the resolution of the data\n\nHowever, there is another problem\
    \ that can be solved nicely using these types of manual redraws: the problem of\
    \ data resolution. How much data should be displayed in a small chart and how\
    \ much in a bigger chart?\n\n![](img/72559bd4713b2b89631dcca187d7e2db_114_0.png)\n\
    \nThe small chart with high data resolution\n\nI think you agree that in the preceding\
    \ figure, we display too much data for the size of the graphic. This is bad and\
    \ makes the chart useless. Moreover, we should really adapt the resolution of\
    \ the data according to the small viewport in the redrawing process.\n\nLet's\
    \ implement a function that only ever returns the i-th element of an array:\n\n\
    ```\nfunction adaptResolution(data, resolution) {\n    resolution = resolution\
    \ ? Math.ceil(resolution) : 1;\n    return data.filter(function(d, i) {\n    \
    \    return i % resolution == 0;\n    });\n}\n```\n\nGreat, let's define a width-depended\
    \ data resolution and filter the data accordingly:\n\n```\nvar pixelsPerData =\
    \ 20;\nvar resolution = pixelsPerData * (flatData.length) / width;\n```"
  merge: -1
  img_proc: true
- pgno: 115
