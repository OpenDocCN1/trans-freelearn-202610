- pgno: 209
  md: '# # Emulating mobile devices


    In the next step, we can argue that we not only want to emulate the browser screen

    of the target device, we also emulate the device on its own and use device emulators.

    Those who already develop software for Android or iOS might have their official

    emulator installed. Emulating on a system level leads to much more accurate results

    when testing cross-browser compatibility because of the emulation of the systems

    architecture running the real mobile browser of the target system.


    However, there are some drawbacks of working with emulators. Most importantly,

    there is currently no way to install Android, iOS, and Windows emulators on the

    same operating system without using virtual machines or dual boot; and second,

    working with emulators is horribly slow. To be honest, I haven''t tested the latest

    versions of the official emulators; but the last time I used them, it was simply
    too

    slow to work on a daily basis.


    Starting up the emulator takes a lot of time, and running them takes too many

    resources of the host PC. However, if your target platform is, for example, Android,

    and you already have an Android environment installed, it might be a good way
    to go.


    > You can find more resources about the Android emulator on

    > the Android website at http://tools.android.com/

    > tech-docs/emulator. If you use Android and are looking

    > for a faster emulator, you should take a look at Genymotion at

    > https://www.genymotion.com.


    # # Syncing Real Devices using Browsersync


    I prefer to test my code on real devices, which I have lying around in my office:
    three

    Android phones, one Android tablet, and one Windows phone. The Android phones

    all have different major versions of Android installed.


    Opening the same visualization on all these devices and testing them is a pain.
    It

    would take too much time. Thankfully, there is an amazing tool called Browsersync

    that lets you sync your current page to all the connected devices, push URLs,
    auto-

    reload pages, and mirror clicks and scrolling. I really don''t know how developers

    could ever be productive without a tool like this.


    It has to be installed only on your host computer, which is your local development

    Desktop machine, by running the following code from the command line:


    ```

    npm install -g browser-sync

    ```'
