- pgno: 36
  md: "We remark that the preceding figure looks very similar to the grid layout that\
    \ we created in the beginning of this section. The only small difference in the\
    \ code was the `.container` element to wrap the rows and the usage of the `.col-lg-*`\
    \ classes. However, Bootstrap's grid is responsive, and the columns are arranged\
    \ according to the breakpoints and the browser width. If we reduce the size of\
    \ the browser window smaller than 1200px, we see that the grid jumps into a different\
    \ layout. We can see this effect in the following figure:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_36_0.png)\n\
    \nBrowser output of grid layout with window size smaller than 1200px\n\nThe reason\
    \ for this is that the browser window is no longer in the state of a very large\
    \ device (greater than 1200px) and has jumped to a smaller state. Therefore, the\
