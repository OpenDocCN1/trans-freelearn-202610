- pgno: 20
  md: '# Getting Started with Responsive Design, Bootstrap, and D3.js


    The best way to understand data is to visualize it and explore it using an interactive
    visualization. In this book, we are going to build such an interactive visualization
    (actually many of them) using the latest techniques and web technologies. To make
    the information accessible across all devices, we are going to make the visualizations
    responsive. However, before we can start, we need to understand what this actually
    means. We also want to reuse some existing frameworks to not just do a great job
    but also work in an efficient way.


    This chapter serves as an introduction to the methods, technologies, and frameworks
    that we will use throughout the book, and it will help you understand why we are
    using them to create data visualizations and how they work together.


    In this chapter you will learn the following:


    +   - What exactly is Responsive Design and how can it be applied to create visualizations
    that work across all different screen sizes and resolutions

    +   - What is a Media Query and how it can be used to design visualizations for
    various devices

    +   - Why and how we use Bootstrap to build the visualization on existing components

    +   - Why we use vector graphics, such as SVG, for the web

    +   - Why we use D3.js for data manipulation and graphics creation'
  merge: -1
  img_proc: true
- pgno: 21
  md: "First, you will learn about Responsive Design and how it can be used to design\
    \ a visualization for various screen sizes and resolutions. Then, we will discuss\
    \ the importance of some key technologies such as CSS3 (especially Media Queries)\
    \ and HTML5 (especially the viewport meta tag).\n\nIn the following chapter, we\
    \ will get acquainted to the popular CSS and HTML framework called Bootstrap.\
    \ Don't worry if you have never heard about it; it helps us to build the application\
    \ on the existing and well-tested components, such as grids and LESS Media Queries.\n\
    \nIn the last section of this chapter, you will learn about Scalable Vector Graphics\
    \ (SVG) in the browser; and you will understand why and when it is great to use\
    \ vector graphics for visualizations. Then, we will see a brief introduction to\
    \ D3.js, which is a versatile JavaScript library for data transformations and\
    \ graphics generation. At the end of this chapter, you will understand why SVG\
    \ is a great choice for designing interactive responsive visualizations for the\
    \ web.\n\n# What is Responsive Design?\n\nResponsive Design is a method for designing\
    \ applications that can adapt their appearance and behavior to the user's device.\
    \ It makes the application look and feel good across all different devices, and\
    \ most often, it makes them usable on all devices.\n\nAn important paradigm in\
    \ Responsive Design is to use relative dimensions instead of fixed widths, heights,\
    \ margins, paddings, and font sizes throughout all the application to adapt the\
    \ design to the various types of devices.\n\nFor web browsers, Responsive Design\
    \ was enabled through CSS3 and HTML5 features, such as Media Queries, the viewport\
    \ meta tag, and new dimension units.\n\n# Conditional CSS with Media Queries\n\
    \nMedia Queries were introduced in CSS3 as a more flexible extension of Media\
    \ Types. They allow the developer to apply conditional CSS styles only when a\
    \ statement (a so-called query) matches a certain CSS property (so-called Media\
    \ Features) and a Media Type. A typical Media Query has the following structure:\n\
    \n```\n@media [Media Type [and|not|only]] (Media Feature) {\n   ...\n}\n```"
  merge: -1
  img_proc: true
- pgno: 22
  md: "Here is a small selection of properties that can be used as Media Features:\n\
    \n+   - width, min-width, and max-width\n+   - height, min-height, and max-height\n\
    +   - device-width, min-device-width, and max-device-width\n+   - device-height,\
    \ min-device-height, and max-device-height\n+   - resolution, min-resolution,\
    \ and max-resolution\n\nA complete list of Media Features and Types can be found\
    \ on MDN at https://developer.mozilla.org/de/docs/Web/CSS/Media_Queries/Using_media_queries.\n\
    \nIn Responsive Design, we are mostly interested in querying the min-width or\
    \ max-width property to apply different styles to devices that have different\
    \ widths.\n\nLet's see an example where we can apply a different background color\
    \ depending on the minimal width of the browser window:\n\n```\ndiv {\n  background-color:\
    \ blue;\n}\n\n@media screen and (min-width: 992px) {\n  div {\n    background-color:\
