    # # Transitions


    Until now, you learned a lot about animation, timers, interpolation, and easing,
    but

    does it really need all of this to do simple animations in D3. No; luckily, not
    as long as

    we use simple transitions. A Transition is an animation from a start state to
    one end

    state. The term is often used for animations in general and vice versa, but I
    want to

    emphasize that a transition is a simple animation that is defined by two states
    only;

    here, the interpolation between these states is automatically created from these
    states.'
  merge: -1
  img_proc: true
- pgno: 159
  md: "D3 has a very powerful support to create transitions. The only thing we have\
    \ to do is to provide the starting state, call the .transition() method on a selection,\
    \ and finally provide the ending state and D3 will take care of the rest. The\
    \ .transition() method will return an object that is very similar to a selection\
    \ and has most of its methods. In addition, it provides the .duration(duration),\
    \ .delay(delay), and .easing(easingType) functions to define the duration time,\
    \ delay time, and the easing type of the transition.\n\nGreat, let's see an example\
    \ where we use transitions instead of custom animations:\n\n```\n<svg width=\"\
    800\" height=\"600\">\n<rect x=\"50\" y=\"60\" width=\"100\" height=\"100\"></rect>\n\
    </svg>\n<script>\nvar rect = d3.select('rect:nth-of-type(1)');\n\nanimate(rect,\
    \ 'x', 50, 650);\n\nfunction animate(elem, attributeName, startValue, endValue)\
    \ {\n  elem\n  .attr(attributeName, startValue)\n  .transition()\n  .duration(1000)\n\
    \  .attr(attributeName, endValue);\n}\n</script>\n```\n\nIn the preceding code,\
    \ we can see how easy it is to implement animations as simple transitions in D3.\
    \ Depending on the startValue and endValue attributes, D3 tries to figure out\
    \ which interpolation method it needs to use to create the animation.\n\nLet's\
    \ look at the code from our bar chart component; here is the snippet to remember\
    \ the most important part where we update the dimensions of the bars:\n\n```\n\
    $$bars\n.attr('x', function(d) { return xScale(d.x) + i*barWidth; })\n.attr('y',\
    \ function(d) { return yScale(d.y); })\n.attr('height', function(d) { return (yScale(0)\
    \ - yScale(d.y)); })\n.attr('width', barWidth)\n.attr('fill', colors(data.key));\n\
    ```\n\nLet's add a little tweak, so the bars automatically update with a nice\
    \ animation. Using transitions, we only have to define a starting and ending state:\n\
    \n```\n$$bars\n.attr('x', function(d) { return xScale(d.x) + i*barWidth; })\n\
    .attr('y', function(d) { return yScale(0); })\n```"
  merge: -1
  img_proc: true
- pgno: 160
  md: '```

    .attr(''height'', 0)

    .attr(''width'', barWidth)

    .attr(''fill'', colors(data.key));

    ```


    ```

    $$bars

    .transition()

    .attr(''y'', function(d) { return yScale(d.y); })

    .attr(''height'', function(d) { return (yScale(0)) - yScale(d.y); });

    ```


    That''s it. In the preceding code, we set the default height of the bar to 0 and
