  md: "We observe in the previous chart that the axis and axis ticks are scaled too\
    \ much due to the upscaling to the viewport. Once again we note that for this\
    \ technique, it is necessary to draw the chart on an useful range of coordinates.\n\
    \n# # Prevent Strokes from Scaling\n\nWe can add simple options to prevent strokes\
