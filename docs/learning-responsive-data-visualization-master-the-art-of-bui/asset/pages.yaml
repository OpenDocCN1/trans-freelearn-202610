- pgno: 151
  md: "Let's do a simple example and replace the manual interpolation with a D3 interpolator;\
    \ we can use the internal function called d3.interpolateNumber(a, b) to create\
    \ a numeric interpolator between the both numbers called a and b:\n\n```\n<svg\
    \ width=\"800\" height=\"600\">\n<rect x=\"50\" y=\"60\" width=\"100\" height=\"\
    100\"></rect>\n</svg>\n<script>\nvar rect = d3.select('rect:nth-of-type(1)');\n\
    \nanimate(rect, 'x', 50, 650);\n\nfunction animate(elem, attributeName, startValue,\
    \ endValue) {\n  var duration = 1000;\n  var interpolate = d3.interpolateNumber(startValue,\
    \ endValue);\n\n  d3.timer(function(time) {\n    elem.attr(attributeName, interpolate(time/duration));\n\
    \n    if (time >= duration) {\n      elem.attr(attributeName, startValue);\n \
    \     return true;\n    }\n  });\n}\n</script>\n```\n\nIn the preceding code,\
    \ we observe that the valueStep variable is now gone; instead, we use the interpolator\
    \ function called interpolate(t) generated by the d3.interpolateNumber function.\
    \ It is a parametric functions that takes the argument called t in the range of\
    \ [0, 1] to describe the state of the interpolation. Here, 0 corresponds to the\
    \ initial position and 1 to the final position.\n\nD3 provides the following interpolation\
    \ generators:\n\n+   - d3.interpolateNumber: This create an interpolation function\
    \ for 2 numeric values\n+   - d3.interpolateRound: This creates an interpolation\
    \ function for 2 numeric values that rounds the result to the nearest integer\n\
    +   - d3.interpolateString: This creates an interpolation function for numbers\
    \ embedded in a string"
  merge: -1
  img_proc: true
- pgno: 152
  md: '+   * d3.interpolateRgb, d3.interpolateHsl, d3.interpolateLab, d3.interpolateHcl:
    This creates an interpolation function for the specific color space

    +   * d3.interpolateArray: This creates an interpolation function for the values
    in the two arrays that have the same index in both the arrays

    +   * d3.interpolateObject: This creates an interpolation function for the properties
    in the two objects that have the same key in both the objects

    +   * d3.interpolateTransform: This creates an interpolation function for two
    affine transformations, such as translate, rotate, and scale

    +   * d3.interpolateZoom: This creates a smooth interpolation function for interpolating
    two views optimized for smooth zooming and panning


    Depending on the attribute values, D3 will select a proper interpolation function
    if you use D3 transitions – if it corresponds to one of the types in the preceding
    list. You can even add custom interpolation function by adding the interpolator
    to the array d3.interpolators.


    > > You can find further information about D3 interpolations on the Github page
    of the project https://github.com/mbostock/d3/wiki/Transitions#interpolation.


    # Easing – Animation progress over time


    Until now, we always assumed that we are doing linear interpolations, which means
    the animation proceeds linear with time. Let''s look at the following figure where
    we animate the position of a circle from the start value of 0.0 to the end value
    of 1.0. If the animation has a duration of a second and we take a snapshot every
    0.2 seconds, we see the following transition:


    ![](img/72559bd4713b2b89631dcca187d7e2db_152_0.png)


    A simple animation with linear easing


    We use the term *ease* to describe the relation between the animation process
    and the animation time; in the preceding figure, we spoke of *linear easing*.'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'If we look at motions in the real world, we rarely see linear easing; the reason
    for this is that motion and forces are always damped or accelerated (by gravity).
    If we want to create physically realistic animations, we have to also add damping
    or acceleration to our animations. We do so by modifying the easing function of
    an animation.


    The following figure shows a linear easing function; thus, it represents a linear
    animation''s progress over time.


    ![](img/72559bd4713b2b89631dcca187d7e2db_153_0.png)


    The linear easing function (source: http://cubic-bezier.com/#0,0,1,1)


    By modifying the easing function, we can modify the animation progress to create
    more physically plausible animations. We can make the animation progress faster
    at the end to simulate acceleration or slow it down to simulate damping.


    > Useful information about CSS and JavaScript easing functions can be found at
    http://easings.net/.


    Here comes the part where it may get a little tricky for you. To modify the easing
    function, we normally use Bézier curves. Well, we could also use some quadratic
    equations or parabolas and the output would be exactly the same. However, Bézier
    curves are smooth curves that can be constructed from control points. If you don''t
    care about this, you can safely skip the next section and continue with the other
    easing functions; however, the concept of Bézier curves will appear more often
    than you would have expected, so it cannot hurt you to go through the section.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Bézier curves


    The goal is to create and handle polynomial functions with ease that correspond
    to a certain progress over time. Creating linear functions such as the linear
    easing function that we used in the preceding example is straightforward; you
    learned this in high school mathematics. However, when we think about quadratic
    or cubic functions (degree 2 or 3), this gets much more complicated. It''s not
    straightforward anymore to create a function to describe a desired shape.


    Let''s look at the equation of a cubic polynomial function:


    ```

    f(x) = a \cdot x^3 + b \cdot x^2 + c \cdot x + d

    ```


    Now, I would ask you to find the a, b, c, and d parameters such that the polynomial
    function goes through the 0,0 point and accelerates towards the 1,1 point. This
    is similar as the progress of the function in the following figure:


    ![](img/72559bd4713b2b89631dcca187d7e2db_154_0.png)


    The cubic easing function (source: http://cubic-bezier.com/#.5,0,1,.5)


    You will soon find out that, although it is not impossible to create a function
    for the preceding figure, it is very nasty and not intuitive using a simple polynomial
    function. The reason for this is that changes of the coefficients a, b, c, or
    d lead to unpredictable changes of the described function.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Luckily, the clever guys called De-Casteljau and Bézier developed the concept
    of Bézier curves — a mathematical model for describing polynomial functions by
    the so-called control points. Bézier curves are parametric polynomial functions
    that are described by a parameter t in the range of [0, 1] and a certain number
    of control points (four control points for a polynomial of degree 3). The resulting
    function is the interpolation between the control points at a position where,
    at t=0, the function matches the first control point and, at t=1, the function
    matches the last control point.


    The general equation of a Bézier curve is denoted as follows:


    ```

    f (t) = \sum_{i=0}^{n} B_{i,n} (t) \cdot P_i

    ```


    Here, B is the Bernstein polynomial:


    ```

    B_{i,n} (t) = \binom{n}{i} t^i (1-t)^{n-i}

    ```


    The cubic polynomial function from the preceding can now be written as a parametric
    Bézier curve:


    ```

    f (t) = (1-t)^3 \cdot P_0 + 3t(1-t)^2 \cdot P_1 + 3t^2 (1-t) \cdot P_2 + t^3 \cdot
    P_3

    ```


    Here, P0, P1, P2, and P3 are the control points of the curve. Now, we can create
    the easing function that we want by simply moving the control points at the desired
    position and defining the curvature of the polynomial. In the preceding figure
    of the cubic polynomial, we can see the starting and end points fixed to (0,0)
    and (1,1) and the 2 remaining control points in turquoise and magenta that define
    the progress of the easing function.


    In the following figure, we can see how a cubic polynomial function can easily
    be adjusted by simply defining the control points. We also observe that the curve
    goes through the start and ending points and is smoothly interpolated between
    the control points. We can also see that the resulting function (in blue) is simply
    an interpolation between the control points:'
  merge: -1
  img_proc: true
- pgno: 156
  md: '![](img/72559bd4713b2b89631dcca187d7e2db_156_0.png)


    Bézier curve interpolated between the control points


    Now, we have the knowledge and tools to write all the possible easing functions
    that we can think of by simply defining control points and using Bézier curves.
    The interactive tool from http://cubic-bezier.com/ allows you to easily create
    custom Bézier curves and easing effects.


    > > If you look for the implementations of easing functions rather than Bézier
    curves, take a look at the jQuery easing plugin by Dan Rogers on Github at https://github.com/danro/jquery-easing/blob/master/jquery.easing.js.


    # # Easing functions in D3


    D3 supports multiple out-of-the box easing functions that help to make your animations
    and transitions more plausible. We can create an easing function using the `d3.ease(type)`
    function. Here, `type` is one of the following easing types:


    +   * `linear`: This is the linear easing function

    +   * `quad`: This is the quadratic easing function

    +   * `cubic`: This is the cubic easing function

    +   * `sin`: This is the sine easing function

    +   * `exp`: This is the exponential easing function

    +   * `circle`: This is the quarter circle easing function

    +   * `bounce`: This is the easing function with the bouncing effect'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'By default, the easing functions use the easing mode called `in`; this means
    that the easing motion refers to the element sliding `in` to the target. The easing
    mode can also be modified by simply appending on the following modes the name
    of the easing function:


    +   - in: element sliding into the target

    +   - out: element sliding out of the source

    +   - in-out: element sliding out of the source and into the target

    +   - out-in: inverse easing of in-out


    The default easing function is `cubic-in-out`, which corresponds to a slow sliding
    out and sliding in animation. Let''s look at a simply example:


    ```

    <svg width="800" height="600">

    <rect x="50" y="60" width="100" height="100"></rect>

    </svg>

    <script>

    var rect = d3.select(''rect:nth-of-type(1)'');


    animate(rect, ''x'', 50, 650);


    function animate(elem, attributeName, startValue, endValue) {

    var duration = 1000;

    var interpolate = d3.interpolateNumber(startValue, endValue);

    var ease = d3.ease(''cubic-in-out'');


    d3.timer(function(time) {

    var t = ease(time/duration);

    elem.attr(attributeName, interpolate(t));


    if (t >= 1) {

    elem.attr(attributeName, startValue);

    return true;

    }

    });

    }

    </script>

    ```


    In the preceding code, we create an easing function by calling the `d3.ease(''cubic-in-out'')`
    method. Now, we can use the function to create and modify the `t` parameter for
    the interpolation function according to the easing type.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'The following figure shows an overview and comparison of multiple easing types;

    you can find an animated example in the code that comes with this book:


