  md: '# Summary


    In this chapter, you learned all the necessities to draw cartographic visualizations
    with D3. You learned about the geographic coordinate system, the graticules, and
    color scales.


    GeoJSON is an important format to encode geometric features; it can store different
    types of geometries and values. However, it also stores a lot of redundant information;
