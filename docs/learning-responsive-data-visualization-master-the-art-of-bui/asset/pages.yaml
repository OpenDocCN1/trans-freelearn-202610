- pgno: 89
  md: 'You can already see that by nesting multiple split functions, you can split
    the string into an array of substrings that contain your information. In the next
    step, we need to parse date time values from different string representation into
    the JavaScript representation.


    # # Parsing dates from strings


    As we saw already in the example of the log data, we will often have to deal with
    time series data in a specific string format. To transform, compare, and display
    Dates properly throughout the visualization, we have to first parse the string
    to a valid JavaScript Date object. Fortunately, D3 includes a powerful datetime
    parser to convert datetime strings into Date objects and vice versa.


    To create such a formatter, we have to use the d3.time.format() function, which
    returns a formatter. We can then either use the formatter as a function to format
    Date objects or use the .parse() method to parse the datetime strings. Let''s
    take a look at an example:


    ```

    // Create a formatter

    var formatter = d3.time.format(''%Y-%m-%d'');

    // Parse a string to a Date object

    formatter.parse("2015-01-01");

    // Thu Jan 01 2015 00:00:00 GMT+0100 (CET)

    ```


    As we''ve already discussed, we can also use the formatter function to convert
    Date objects into strings in order to style and format them:


    ```

    // Create a formatter

    var formatter = d3.time.format(''%Y-%m-%d'');

    // Format a Date object to a string

    formatter(new Date(2015, 0, 1));

    // "2015-01-01"

    ```


    > To make yourself familiar with the native Date object, you can take a look at
    the Mozilla Developer website at https://developer.mozilla.org/de/docs/Web/JavaScript/Reference/Global_Objects/Date.


    As we can observe in the preceding code example, D3 uses formatter specifiers
    to define the format of the datetime string. Here, you can find a list of specifiers
    that can be used to for declaring the datetime format, which I took from my previous
    book Data Visualization with D3 and AngularJS by Packt Publishing:


    +   - %a: Abbreviated weekday name

    +   - %A: Full weekday name'
