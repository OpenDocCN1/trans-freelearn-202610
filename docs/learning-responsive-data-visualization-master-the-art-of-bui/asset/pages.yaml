- pgno: 198
  md: '# # Testing Responsive Visualizations


    In the previous chapter, you learned how to create amazing cartographic visualizations
    using D3.js, projections, and geographic maps. Now, it is time to look into the
    testing strategies of responsive visualizations. In this section, you will learn
    the following:


    +   - Learning about common testing strategies

    +   - Understanding the difference of unit and integration tests

    +   - Learning about the importance of manual tests in visualizations

    +   - Learning how to set up an environment for manual testing

    +   - Setting up an environment for Unit and Integration testing

    +   - Running unit tests using Karma on your local machine

    +   - Running integration tests using TravisCI and Sauce Labs using a testing
    environment

    +   - Understanding how the different strategies work together

    +   - Building a testing strategy that fits your budget


    In the first section, you will learn about testing, testing strategies, and different
    types of tests. You will understand the differences between manual and automated
    testing and why it is crucial to have great tools in your workflow for manual
    testing.


    In the next section, we will take a closer look at these manual testing and debugging
    tools. We will find out how to use Browsersync, Browserstack, Device Modes, and
    much more to boost up your local development environment.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Then, we will discuss automated tests, an important part of writing maintainable
    code. We will not only look into some local unit testing with Karma but also integration
    testing using Protractor, Selenium, Travis CI, and Sauce Labs.


    Finally, we will summarize how a great development environment should look when
    you care about testing and code quality.


    # A guide on testing visualizations


    At the end of this chapter, you will have a clear idea about testing strategies
    for responsive visualizations; you will be aware about the costs and benefits
    of testing; and you will be able to implement both manual and automated tests
    with the best tools that are available today.


    If you are new to software development, you may have heard about testing and testing
    strategies and how many developers pretend that they are obsessed about testing.
    However, it is very important to understand the differences between, for example,
    test-driven development in software development and manual testing and debugging,
    in order to compare the costs and benefits for these strategies. If you are already
    writing tests on a daily basis and have a clear strategy about unit and integration
    tests, you might skip this introduction and jump directly to the next section.
    For everyone else, I promise that you will learn some great insights and information
    about testing, so go ahead!


    When testing interactive visualizations, we are somehow in a very difficult domain.
    On the one hand, we write code, so we need to make sure that all functions of
    the code do exactly what they should. However, on the other hand, we produce visualizations
    that should look and feel the same across all different devices, operating systems,
    and browsers—something that can only be evaluated manually. The goal is to combine
    the best of manual testing and automated tools to maximize productivity and maintainability
    and minimize the number of errors in the code.


    > In this chapter, I will mention tools and services that may require a paid subscription.
    My intention is not to sell you a subscription to one of these services but to
    present the best tools for manual and automated cross-browser testing from my
    experience.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# # Why should I care about testing?


    Testing your code is crucial to write a great bug-free and maintainable software.
    However, writing a ton of automated tests too early can slow down development
    and affect productivity. Therefore, we need to find a good trade-off between writing
    code, debugging, and testing.


    Tests greatly improve the maintainability of your code. Unit tests, for example,
    can serve as a documentation for developers which on top can also be executed.
    Whenever a developer modifies the code or refactors it, he/she can always run
    the tests to see if a function still works as expected. This makes the code much
    easier and safer to refactor. Therefore, writing tests is crucial to build maintainable
    software and saves time and costs while maintaining an application.


    The goal of a test is to assure that a function works as expected after re-factorings
    and modifications. Hence, your tests should cover a combination of all the possible
    input arguments and test all the possible output values. By writing good tests,
    you can be quite sure that your application works properly. However, keep in mind
    the following things:


    +   * Tests can never prove the absence of bugs; it can rather guarantee that
    for the given test cases, the software performs as expected

    +   * Bugs can also occur if your software is very well tested and all your tests
    pass

    +   * Tests are usually performed in a testing environment; make sure that your
    test environment is as similar as possible to your production environment, especially
    for integration and system tests


    I want to emphasize that developers should focus on test quality rather than quantity.
    Test quality cannot be measured, whereas the quantity can, by computing how many
    lines of code have actually been executed— this is called the test coverage. If
    the tests have executed every single `if` condition, iterated over every `for`
    loop, and reached every `return` statement, then the test coverage is 100%. This
    leads to the misconception that a high test coverage (optimally 100%) is the most
    important goal.


    However, keep in mind that 100% test coverage doesn''t guarantee bug-free code.
    Actually, it just means that 100% of your code has been executed. It doesn''t
    even tell us anything about the quality of the tests. 80% to 90% test coverage
    with meaningful and good tests should be preferred as a good trade-off.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'One might ask what a good test looks like compared to a bad one. A good test
    is one that finds a bug or unexpected behavior (these two things are actually
    the same). A good test tries to break the software, discover the unexpected behavior,
    and tests all the possible edge cases for the input arguments. The person writing
    the tests should not be gentle and kind to the software but preferably try to
    break it because the purpose of tests is to break the software. A bad test tests
    the behavior of the software only for arguments in its typical range and expected
    output.


    # The different types of test


    I''ve already confused you by speaking about different strategies, so let''s get
    clear about them and take a look at different testing strategies.


    # Manual tests


    When I speak about manual testing, I mean opening the application on your laptop
    or mobile phone and clicking around in it.


    If we are in the domain of software development, manual tests are a no go. You
    would never rely on manual tests and always prefer automated tests as they are
    more reliable, reproducible, and much faster than manual ones.


    However, in UX/UI design and graphics, manual tests are the only reliable way
    of finding errors fast–but why is this? This is because when dealing with graphics,
    humans are much better to spot visual errors or lags of interactive elements.
    It would be much more tedious and time consuming to write automated tests from
    the very beginning of every visualization, transition, or animation. Therefore,
    when dealing with responsive design or graphics, testing your visualizations manually
    is a necessary step in the development pipeline. Manual tests help to identify
    errors quickly and be productive.


    The easiest way to test a responsive application manually would be setting up
    two Chrome windows – one for testing the desktop version and one for testing the
    mobile version (with the mobile device mode enabled). You will always have to
    test your application in each window and reload your application on changes.


    One could enhance the setup by adding an Android, iOS, or Windows Phone emulator
    to the local development system; one would even test the application on some real
    hardware maybe. To optimize the manual testing workflow, add a live-reload or
    browser sync feature to all your devices to avoid manual reloading on all the
    devices. You can also add remote devices from a remote device farm in the cloud
    to your local setup so that your application runs on some real hardware and gets
    controlled through the browser. The section about Manual Testing will help you
    in setting up such an environment step by step and discuss all the preceding options
    in detail.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# # Automated tests


    When I speak about automated testing, I mean a test script that runs a number
    of tests without manual interaction. The result of the automated tests is either
    pass (green) or fail (red) when either _all tests passed_ or _one (or more) tests
    failed_. Ideally, one would run this script after making changes to the local
    files to quickly discover functional bugs. If the test script is slow, one could
    also run it automatically after committing changes to the code repository.


    In the domain of software development, automated tests are always the preferred
    way of testing, as it is a reliable and repeatable way of testing code. Usually,
    we differentiate three strategies for automated testing:


    +   - Unit tests: Testing single units (functions), often called specifications
    (specs)

    +   - Integration tests: testing the integration of units (multiple functions),
    often called end-to-end (e2e) testing

    +   - System tests: testing the whole system


    We can conclude that every strategy should be applied in a different stage and
    under different constraints due to the complexity of the test setup and the runtimes
    of the tests. While unit tests are, in general, very fast, they can be run locally
    on every change of the source files. Integration and system tests are typically
    slow and should run in a remote testing environment, for example, after every
    commit to the source code repository.


    There are many components in visualizations that can be tested in an automated
    way, such as scales, mapping functions, reducers, the drawing of elements, and
    more, both on the local system and a remote testing environment. Hence, I will
    introduce you to the world of unit and integration testing in the section Automated
    Testing, and we will implement a typical automated testing strategy for visual
    components.


    In this book, we only deal with visualization components; and therefore, we will
    only look into unit and integration tests. They are described in the following
    sections.


    # # Semi-automated tests


    Some tests are executed automatically; but determining whether they’ve passed
    or failed can’t be done by a program. What sounds a little bit scary at first
    can be better described with an example.


    Let’s think about a simple cartographic visualization. You add a graticule to
    the visualization to make it easier for the user to perceive distances in the
    map. Your test script is generating a screenshot of your application, and compares
    it to the one from the previous version; to be more precise, it computes the absolute
    difference between the two screenshots. This technique is called **Visual Regression
    Testing**.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'How can the script decide whether the grid has been added intentionally or
    it is a bug that occurs from a change in the code? It simply cannot do so. The
    script runs automatically; however, it requires a human interaction to pass the
    test; this is what we call a semi-automated test. Sometimes, (small) visual changes
    are made intentionally, and sometimes, they can be produced by bugs. It is impossible
    to automatically decide which change is intended.


    In a good data visualization setup, we would generate a set of screenshots and
    provide pictures with the absolute difference from the previous version to the
    developer whenever he/she commits a change to the source code repository. To facilitate
    focusing on the most important changes, the script can only show images to the
    developer that has changed more than a certain threshold of pixels.


    # ## Unit tests


    Unit tests (or specs) aim to test the smallest units of your code for correctness;
    and hence, they provide an executable documentation of all the units of your code.
    While it is debatable what the smallest unit of your code is, in my opinion the
    smallest unit is a single function.


    In data visualizations, it is a good technique to use a functional approach to
    design your components in such a way that every function receives an input, modifies
    it, and returns an output. A good strategy would be to write tests for all these
    functions.


    Units test should only affect the code from the tested unit and not require any
    other units, so everything besides the tested unit should be mocked. Mocks are
    the copies of objects created specifically for testing that (synchronously) return
    a predefined result. Let''s think about `XMLHttpRequest` in one of our functions.
    We can simply create a Mock that synchronously returns a predefined result for
    this request. The benefit is clear. It is much faster as we don''t have to create
    a real request. It''s also repeatable and doesn''t depend on the real result of
    the `XHR`.


    This brings us to the second most important statement about unit tests: they should
    run locally after each change in the source code and therefore be super-fast.
    Thus, we most often run the unit tests in a headless browser (without the graphics),
    such as **PhantomJS**, on our local development environment.


    # ## Integration tests


    Integration tests (or e2e) aim to test the integration of components from the
    position of a user interacting with the component. This means that they test the
    interplay of multiple components in a real browser for user interactions.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'A good strategy for data visualizations would be the testing of each interaction
    possibility, such as drawing, clicking, hover, zooming, filtering, and so on.
    In comparison to unit tests, we need a real browser (with mouse, touch, scrolling,
    and more) and multiple components for integrating tests. Hence, the test suite
    will run much slower than the one for unit tests.


    A good workflow is to run the integration test before you commit a change to your
    repository on your local development environment and every time you push changes
    to your repository in the development environment.


    # ## Continuous Integration


    If you have a setup where a change on the repository trigger tests in a testing
    environment, we speak of a so-called _Continuous Integration_. If you have ever
    worked with code on Github, you must have certainly noticed these tiny Build passing
    badges on some repository Readme files. This is very likely the status file of
    the build/test status from a service called TravisCI which can be tightly integrated
    with Github. However, there are also other services that provide similar functionality
    and badges.


    Besides TravisCI, there exists another great service for continuous integration
    that is called Codeship. It gives you many more options for your testing environment,
    and you can even run your tests in parallel.


    A good setup for a data visualization always uses Continuous Integration. It is
    super easy to set it up, and you can immediately see the test status of all your
    branches.


    # ## Test-driven development (TDD)


    During the last decade, TDD has become very popular among software engineers.
    It''s a technique where you first implement your tests before writing the actual
    code. The goal of this method is to think about the purpose of your function before
    you implement it.


    TDD greatly improves the quality of your code because developers are forced to
    think about the exact purpose of each function before implementing it. This works
    great for good developers when writing components with clearly defined scope and
    purpose.


    However, in data visualizations, most of the work is done iteratively and by exploration;
    we add axis, scales, colors, play around with dimensions, move the legend, and
    so on. It''s more like programmatically designing a graphic with code. I claim
    that it is contra-productive to use TDD for visualizations because you will waste
    a lot of time rewriting tests while experimenting with your visualization.'
  merge: -1
  img_proc: true
