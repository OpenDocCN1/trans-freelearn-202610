- pgno: 124
  md: '# # Building Responsive Interactions


    In the previous chapter, you learned how to make a chart responsive; this means
    to _look_ good on all kind of devices. In this chapter, we will look at responsive
    interactions; this means to _feel_ good on all kind of devices. In this chapter
    you will learn the following:


    +   * Discovering the D3 event system

    +   * Using native events and the D3 event system

    +   * Understanding responsive interactions

    +   * Implementing interaction targets

    +   * Computing the nearest element of the dataset

    +   * Learning about touch events

    +   * Reviewing mouse events

    +   * Implementing a simple zooming behavior

    +   * Applying complex axis zoom


    First, we will look at events in JavaScript and understand how event listeners
    are used to separate and integrate different components. We will also see the
    internal D3 event system and learn how to use it. Event systems help to make code
    cleaner and the execution path easier to follow.


    Then, we will look at responsive events and interactions. We will see four different
    ways to handle interactions on different devices. The most important rule is that
    we don''t use very small interaction targets on small screens.'
  merge: -1
  img_proc: true
- pgno: 125
  md: "Then, we will take an overview of native mouse and touch events and their execution\
    \ order; this will help you to avoid common pitfalls when designing responsive\
    \ interactions and fully understand when you need to stop events from propagating\
    \ the default actions.\n\nIn the last section of this chapter, we will look at\
    \ common interaction techniques, such as zooming and panning. We will compare\
    \ a simple upscaling zoom with a more complex x and y axis zoom in order to understand\
    \ the difference between the two.\n\n# Using an event system\n\nIn many of our\
    \ daily systems and programming languages, the interaction of different instances\
    \ is handled by events and event listeners (these are also called event handlers\
    \ or callbacks). Usually, one part of an application or system triggers a certain\
    \ event and another part of the application or systems — that listens for this\
    \ event—executes the event listener for the specified event.\n\nLet's think about\
    \ a simple example in JavaScript. We want to call a resize function whenever a\
    \ resize event of the browser occurs. Therefore, we have to create an event listener\
    \ that waits (listens) for the `resize` event of the browser window and executes\
    \ the `resize()` event listener whenever the event occurs. This function is as\
    \ follows:\n\n```\nwindow.addEventListener('resize', function(event) {\n    resize();\n\
    });\n```\n\nThis looks quite simple, and it is very easy to understand. The only\
    \ thing we have to know is which events exist on which elements (in which browsers).\
    \ You have already learned in a previous chapter that, besides the `window` element,\
    \ no other DOM element triggers the `resize` even. This means that usually, the\
    \ list of events that can be triggered on elements is standardized and well defined.\n\
    \n# Custom events in D3.js\n\nEvent systems help to integrate separated components\
    \ using standardized events. This becomes very handy when it comes to visualizations.\
    \ You will often find loads of reusable components and parts in a visualization\
    \ that should be tightly integrated but reusable at the same time."
  merge: -1
  img_proc: true
- pgno: 126
  md: "Think about an axis for example. You will need two of them in a simple 2D chart;\
    \ however, you will need three of them in a 3D or 2D chart with two y axis. When\
    \ a user zooms into your chart, the scale of the axis changes in order to display\
    \ a finer domain of the dataset. At the same time, the displayed data points are\
    \ also updated. When using events, we can simply listen in all the components\
    \ for a zoom event and update them accordingly. And the best part is that it doesn't\
    \ matter if you have two, three, or no axis in your chart; it will still work\
    \ properly. This means that an arbitrary number of elements (no element or many\
    \ elements) can automatically listen for events and update when a certain event\
    \ occurs, and the element that triggered the event doesn't have to know about\
    \ them. An event system helps you to build clean, modular, and decoupled components\
    \ that are not directly dependent on each other. This is why I highly recommend\
    \ you to use one and maybe even D3's event system.\n\nHaving this in mind, I encourage\
    \ you to use an event system and custom events in your visualization in order\
    \ to standardize the interactions throughout the visualization to keep all the\
    \ functionality decoupled but integrated. Creating custom events is very easy\
    \ with D3 because it provides all the necessary functionality.\n\nLet's look at\
    \ a simple example; here, we want to propagate the `dataClick` event when a user\
    \ clicks on a bar in the bar chart. First, we need to create a so-called `dispatcher`\
    \ that knows all the events for a certain component. In our case, we will use\
    \ one single dispatcher for the whole chart:\n\n```\n// Create dispatcher\nvar\
    \ dispatch = d3.dispatch(\"dataClick\");\n```\n\nA dispatcher is the piece of\
    \ code that can trigger events. In the preceding code, we initialize a dispatcher\
    \ that can trigger the `dataClick` event. Besides triggering events, the dispatcher\
    \ is also used by other components to listen for events.\n\nNext, we create an\
    \ event listener that is executed whenever the event occurs. This code will usually\
    \ be placed in a reusable component that we want to separate from the chart (axis,\
    \ grid, legend, minimap, and more):\n\n```\n// Register an event listener\ndispatch.on(\"\
    dataClick\", function(args) {\n  console.log(\"Data clicked\", args);\n});\n```"
  merge: -1
  img_proc: true
- pgno: 127
  md: 'In the preceding code, we see that we only need to access the dispatch object
    to register an event listener. It''s very common that the method to listen for
    an event is called `on` and has the signature called `.on(eventName, eventHandler)`.
    We listen for the `dataClick` event and register an event handler (also called
    callback or event listener) that logs the argument to the console. Note that we
    always need to make sure that the component provides a way for other components
    to register event handlers and hence to access the dispatch object.


    Finally, we can trigger the event by simply calling the event as a function on
    the dispatcher object:


    ```

    // Dispatch event

    dispatch.dataClick({foo: ''bar''});

    ```


    We see in the preceding code that we can also send some data together with the
    event. After triggering the event, all event listeners of this event will be executed
    with the event data as argument.


    Again, D3''s event system is perfect to create an event-based architecture for
    your visualization, and I really encourage you to do so. This makes it much easier
    to trace function calls through the application, create reusable, and decoupled
    components, and standardize the communication between the different components.


    > You can find more information about the D3 event system on the Github page of
    the project at https://github.com/mbostock/d3/wiki/Internals#events.


    # # Responsive events


    Making your visualization appealing on mobile devices does not only mean to make
    them look good but also to make them feel good or to make them work at all. And
    an interactive visualization only feels good when you can actually do all the
    interactions not just with a mouse but also with your fingertip. You learned in
    the previous chapter that displaying too much data on a low-resolution device
    is bad because one cannot really differentiate the data points anymore, which
    leads to poor performance and usability. Another good reason to reduce the resolution
    of the data for mobile devices is that it automatically makes the interaction
    areas on the data points bigger.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# # Interaction areas


    While we can draw with pixel precision using a mouse pointer or a digital pencil,
    we need between 7 mm to 9.5mm targets to successfully interact with them using
    our fingertips. This area is much bigger than most buttons, data points, and elements
    on a desktop-optimized application; therefore, interaction with these applications
    is, most of the time, unsatisfying. We have to keep in mind that if we want a
    user to interact with the data points in the visualizations, then the interaction
    area of a data point in the visualization needs to be big enough. In general,
    there are three methods to achieve this:


    +   - Creating bigger targets — therefore, bigger data points

    +   - Creating big invisible interaction targets at the top of data points

    +   - Always interacting with the closest data point from the finger''s position


    It''s a good rule of thumb to make data points big enough so that you can interact
    with them using your fingertips; however, in many cases, it is just not possible
    to scale them up to a radius of 9.5 mm.


    The first point is somewhat obvious; we increase the size of all elements in the
    visualization. While this might result in bigger interaction targets, it might
    also lead to ugly magnification problems, overlapping data samples, and so on.
    However, when there is enough space in the visualization, it is a good enough
    solution.


    To minimize magnification errors and overlaps in the visualization, we simply
    use overlying invisible interaction targets. While this solves the problem of
    ugly overlapping artifacts, it doesn''t solve the problem of overlapping interaction
    targets. When two targets overlap, a touch event will always be received by the
    element that has been created the latest, and there is no easy way to change this
    behavior.


    There is no right way to solve the issue of big interaction areas; I, personally,
    prefer the third point: interacting with the closest data point from the finger''s
    position. Whenever the user touches the visualization, we look up the closest
    data point to the finger position. We can even combine this technique with the
    second point of invisible interaction areas around the data. We can estimate if
    the distance between the finger and the data point center is smaller than 9.5
    mm (or some other threshold). This method prevents overlapping artifacts for the
    data points as well as for the interaction areas; this is a good trade-off but
    slightly more complicated and computationally expensive.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Creating interaction targets


    Let''s take a look at these methods and implement them!


    The quickest solution is to create interaction targets that are much bigger than
    the original data points, overlaid on the original element, and transparent. This
    method doesn''t require a lot of changes because you can use standard `click`
    event handlers on elements, see the elements in the Developer Tools (as before),
    and inspect the interaction targets by making them visible.


    To implement this, you simply need to create circles with a size of 9.5 mm and
    `opacity` 0. Here, you attach click listeners. You can find an example in the
    code that is provided with this book. The screenshots of the examples are identical
    with the ones provided in the following section.


    However, in some situations, especially when you deal with many data points, you
    don''t want to spoil your container with interaction elements. Therefore, we want
    to look at different and more flexible solutions.


    # Computing the nearest data point


    To successfully apply the nearest-point technique, we have to compute the nearest
    data point from the touch position. Let''s think about the steps we will have
    to apply to obtain the nearest element from a `click` event listener on the `svg`
    element:


    ```

    $svg.on(''click'', function(){

    // Get the relative position

    var pos = d3.mouse(this);

    // Computation goes here

    });

    ```


    As we can see in the preceding code, we obtain the position of the finger or mouse
    relative to the `svg` element using the `d3.mouse` function with the `this` argument
    (which is referencing the current `svg` element). This computes and returns the
    relative position of the finger or mouse to the reference element. We use the
    `d3.mouse` function rather than the `d3.touch` or `d3.touches` function to indicate
    that we are only interested in a single click position (with the finger) rather
    than a touch gesture of multiple fingers.


    > You can find more information about `d3.event`, `d3.mouse`, and `d3.touches`
    on the Github page of the project at `https://github.com/mbostock/d3/wiki/ Selections#d3_mouse`.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Next, we need to transform the coordinates of the click position (a value from
    the pixel range) into the domain of the dataset; this is usually done using the
    inverse scale operator in D3:


    ```

    var xValue = xScale.invert(pos[0]);

    ```


    In the preceding code, we reused the xScale object that we created in Chapter
    2, Creating a Bar Chart Using D3.js and SVG in order to map the pixel value to
    a value in the domain of the x values of the dataset. Now, we need to find the
    index on which the value of the click position intersects the array of x values
    in the data set. We can obtain it by iterating the array from the beginning (left)
    or from the end (right) and comparing the value to the array values. We can also
    use d3.bisector to create a bisect function that does exactly this:


    ```

    // Create a left bisector

    var bisect = d3.bisector(xKey).left;

    // Get the index where the intersection occurs

    var index = bisect(data, xValue);

    ```


    In the preceding function, we reused the xKey function and data object from Chapter
    2, Creating a Bar Chart Using D3.js and SVG


    > You can find more information about bisectors on the Github page of the project
    at https://github.com/mbostock/d3/wiki/Arrays#d3_bisector.


    Finally, we just have to check whether the index exists (because of the default
    scale setting for non-clamping scales) and compare whether the current or previous
    value is closer to the click position:


    ```

    if (index == 0 || index > data.length) {

    return;

    }

    var d0 = data[index - 1];

    var d1 = data[index];

    // get the nearest value

    var d = xValue - xKey(d0) > xKey(d1) - xValue ? d1 : d0;

    ```


    Finally, d contains the closest entry of the dataset to our click position. In
    the final step, we check if the data point is closer than a certain threshold:


    ```

    function distance(x0, x1, y0, y1, r) {

    r = r || 0;

    return Math.sqrt(Math.pow(x0+r-x1, 2) + Math.pow(y0+r-y1, 2));

    }

    ```'
