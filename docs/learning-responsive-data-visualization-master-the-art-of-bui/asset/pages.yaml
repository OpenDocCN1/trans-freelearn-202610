- pgno: 93
  md: "# # Grouping data\n\nMost of the time when we find data resources on the Internet,\
    \ it has a flat data structure just as a comma separated list. But often, it contains\
    \ hierarchical structured data. In D3, it is very easy to group data together\
    \ by creating nested tree structures of the dataset. To achieve this, we can use\
    \ the d3.nest() operator. This operator creates a nest object, which can further\
    \ define a grouping key via the .key() method and a sorting function via the .sortKey()\
    \ method. These functions can also be repeated to create multiple nested layers\
    \ of the flat data structures. Let's take a look at the dataset:\n\n```\nvar values\
    \ = [\n  {\n    date: \"04/23/12\",\n    key: \"Group1\",\n    value: \"37\"\n\
    \  },\n  {\n    date: \"04/23/12\",\n    key: \"Group2\",\n    value: \"12\"\n\
    \  },\n  {\n    date: \"04/23/12\",\n    key: \"Group3\",\n    value: \"46\"\n\
    \  }, ...\n];\n```\n\nFirst, we create a nest function that will then group our\
    \ data accordingly:\n\n```\nvar nest = d3.nest()\n  .key(function(d, i){\n   \
    \ return d.date;\n  });\n```\n\nA nest now implements an .entries(data) method,\
    \ which can takes dataset as input and returns a grouped result of the flat data\
    \ structure. If you are curious, you can take a look at the output of the preceding\
    \ nest function applied to our dataset.\n\n```\nconsole.log(nest.entries(data));\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 94
  md: 'The previous code shows a result such as the following figure in the developer
    tools of the browser:


    ![](img/72559bd4713b2b89631dcca187d7e2db_94_0.png)


    Nest function applied to dataset


    > You can find more information about nests on the D3 Github page at https://github.com/mbostock/d3/wiki/Arrays#d3_nest.


    As a logical next step, we can now apply map and reduce functions to count objects,
    occurrences, and values and map them into a simpler structure. It would be a good
    exercise to map the preceding hierarchical object into an array containing {x,
    y} elements with y being the sum of all values for each object.


    Let''s use this nest function together with the reduce function to draw a chart
    similar to the previous example. However, we want to group the entries per day
    and sum over all groups now.'
  merge: -1
  img_proc: true
- pgno: 95
  md: "We can continue doing so by mapping the value property of the elements in the\
    \ values array and summing the values up. We use the +string short notation to\
    \ convert the value properties into numeric values:\n\n```\ndraw(nest.entries(data).map(function(d)\
    \ {\n  return {\n    date: d.key,\n    value: d.values.map(function(d) {\n   \
    \   return +d.value;\n    })\n  }.reduce(sum, 0)\n}));\n```\n\nIn the preceding\
    \ code, we first apply the nest function on the original dataset. Then, we use\
    \ a map function to apply the next processing step to every group of the nested\
    \ groups. In the inner processing step, we map the array of values to an array\
    \ of numbers and sum it up via the reduce function. We can write this a bit more\
    \ elegantly using the d3.sum(arr, accessor) method, which combines the map and\
    \ reduce steps. The resulting code is here:\n\n```\ndraw(nest.entries(data).map(function(d)\
    \ {\n  return {\n    date: d.key,\n    value: d3.sum(d.values, function(d) {\n\
    \      return +d.value;\n    })\n  }\n}));\n```\n\nGreat, this looks much cleaner\
    \ and is also super readable. Now, we can see the result of the browser in the\
    \ following figure:\n\n![](img/72559bd4713b2b89631dcca187d7e2db_95_0.png)\n\n\
    Grouped and aggregated values"
  merge: -1
  img_proc: true
