- pgno: 145
  md: 'In the preceding code, we transform a star into a hexagon by simply adding
    both the element paths to the values attribute. Note that, in this simple case,
    the animation looks good because we use the same number of control points for
    both the shapes. We will discuss this in more detail in a later section of shape
    tweens.


    > > You can find the complete SMIL specification on the W3C website at http://www.w3.org/TR/REC-smil/
    and the section about SMIL Animations at http://www.w3.org/TR/2001/REC-smil-animation-20010904/.
    The specification for SMIL SVG Animations can be found at http://www.w3.org/TR/SVG/animate.html.


    Although, SMIL animations offer a great interface to describe (also complex) SVG
    animations, let’s not get too excited. The following figure shows that SMIL Animations
    are not supported in Internet Explorer or Edge:


    ![](img/72559bd4713b2b89631dcca187d7e2db_145_0.png)


    The cross-browser compatibility of SMIL Animations


    While the lack of SMIL support in Microsoft products makes it a bad choice for
    many projects, there is a worst message hidden in the figure. In Chrome, SMIL
    animations are marked as deprecated since version 45, which means that they can
    be removed in any of the following versions. The decision of the Chrome team to
    stop supporting SMIL animations was to establish and strengthen JavaScript and
    CSS as a web standard for DOM animations. Therefore, developers should also favor
    web standards, such as CSS and JavaScript, when it comes to animations and transitions.


    # # Animating HTML using CSS


    CSS has become the de facto standard for animating DOM elements in recent years.
    It is mainly used to transform HTML elements over time, but it can also be used
    to animate the properties of SVG elements.'
