    ```


    The following image shows a small chart with a low number of values, which is
    perfectly readable even though it is very small:


    ![](img/72559bd4713b2b89631dcca187d7e2db_115_0.png)


    The small chart with a proper data resolution


    In the next figure, we can see the same chart based on the same data, drawn with
    a bigger container. We immediately observe that the data resolution adapts accordingly
    making the chart look nice:


    ![](img/72559bd4713b2b89631dcca187d7e2db_115_1.png)


    The big chart with a proper data resolution'
