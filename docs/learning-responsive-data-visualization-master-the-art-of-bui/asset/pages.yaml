- pgno: 142
  md: '# Designing Transitions and Animations


    In the previous chapters, you learned everything about responsive visualizations
    and interactions. Now, we want to make them beautiful and bring them to life using
    transitions and animations. In this chapter, you will cover the following:


    +   - Understanding why we use JavaScript for Web animations

    +   - Implementing a simple animation using D3 timers

    +   - Learning about interpolation function and how they are used in D3

    +   - Learning about easing functions and how they are used

    +   - Understanding the concept of Bézier curves

    +   - Implementing attribute and path transitions

    +   - Understanding the main problems of shape tweens


    In the first section, you will learn about different web standards used to animate
    DOM elements, and you will learn how to compare their advantages and disadvantages
    for animating visualizations. This will help you understand why we use D3''s built-in
    animations and transitions rather than SMIL or CSS animations.


    In the second section, we will cover the main concepts for animations with D3—timers,
    interpolations, and easing. We will discover that it is very comfortable to use
    D3 abstractions to implement custom animations; however, it is too complex for
    simple transitions.


    In the following section, we will see that transitions are actually very easy
    with D3. We just have to understand what transitions are and how we can construct
    animations out of transitions.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Finally, you will learn about shape tweens in the last section. It is quite
    a difficult task, and there is no flexible open source library for shape tweens
    so far. You will learn about the problems and difficulties in shape tweening and
    all the necessary information to solve it (and to maybe make an Open Source D3
    plugin out of this, just saying).


    # # Is there a web standard for animations?


    One of the great things about D3 is that it directly uses underlying standards,
    such as SVG and CSS, rather than abstracting them with an API. This gives the
    developer access to all the features that are available within SVG and the web
    itself. When it comes to animations, one may ask what the web standard for animations
    is.


    In this first section, we will see different ways and technologies that currently
    exist for animating SVG elements on the web. This will help you to pick the right
    technology for your application and use case.


    # # Animate SVG using SMIL


    Synchronized Multimedia Integration Language(SMIL) is a specification for interactive
    multimedia content on the web. SMIL animation is a specification for animating
    DOM elements with an XML syntax that is directly embedded in the DOM tree. Thanks
    to this, it suits perfectly well to animate SVG visualizations.


    SMIL animations for SVG can be constructed using the following elements:


    +   - `<animate>`: This animates a single attribute/property over time

    +   - `<set>`: This sets an attribute/ property for a specified duration and is
    useful for setting non-numeric attribute values in animations

    +   - `<animateMotion>`: This animates an element along a motion path

    +   - `<animateColor>`: This animates a color over time

    +   - `<animateTransform>`: This animate the tranform attribute of SVG elements


    To animate SVG elements, we simply have to put the SMIL Animation tags inside
    the element that we want to animate (or use an `xlink:href` attribute to specify
    the target). Let''s look at a simple example. If we want to animate a rectangle
    along the x coordinate, we can use this:


    ```

    <svg width="800" height="400">

    <rect x="50" y="50" width="100" height="100">

    <animate attributeName="x" from="50" to="650" dur="1s" />

    </rect>

    </svg>

    ```'
  merge: -1
  img_proc: true
