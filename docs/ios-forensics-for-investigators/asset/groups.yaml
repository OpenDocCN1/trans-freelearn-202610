    # Chapter 9: Photo, Video, and Audio Forensics


    In the first few chapters of the book, we focused on the identification and analysis
    of mobile evidence stored in system-generated artifacts such as databases, PLISTs,
    and log files. However, any type of investigation will also typically involve
    analyzing user-generated content found on a device, such as media files.


    A modern iOS device can contain tens of thousands of media files, and each of
    these files is associated with unique metadata that can be critical to an investigation.
    In this chapter, we will learn how to identify and analyze multimedia content
    such as photos, videos, and audio files.


    We will start the chapter with an introduction to media forensics and discuss
    where photos, videos, and audio recordings are stored on an iOS device. Then,
    we''ll learn all about analyzing media metadata to gain meaningful insights, both
    from the file itself and from the corresponding databases. In the last part of
    the chapter, we will learn how to analyze user behavior to find out what media
    the user has accessed or watched through Apple apps such as Music and Safari,
    and third-party apps such as Spotify or Netflix.


    In this chapter, we will cover the following topics:


    +   - Introducing media forensics

    +   - Analyzing photos and videos

    +   - Introducing EXIF metadata

    +   - Analyzing user viewing activity


    # Introducing media forensics'
