    \ addresses table filtered by ROWID\n\nThe same logic applies to the SUBJECT and\
    \ SUMMARY columns. By now, you should have a general understanding of how to extract\
    \ email metadata. In the following section, we'll learn how to analyze email content.\n\
    \n### Analyzing email content\n\nIdentifying a specific email is a straightforward\
    \ task as Apple Mail stores every email as a separate file. When we previously\
    \ extracted email metadata, we learned that the messages table stores an external_id\
    \ record for each email, which is the name of an EML file. These files are stored\
    \ in /private/var/mobile/Library/Mail/MAILBOX-UUID/.\n\nEML files can be opened\
    \ on a macOS system using the Apple Mail desktop application, and on Windows using\
    \ Microsoft Outlook. It's also possible to view the email content in any web browser,\
    \ by renaming the file extension as .html.\n\nTo get the full content, including\
    \ the email's headers, the EML file can be opened using a text editor or it can\
    \ be viewed through the terminal, as shown in the following screenshot:\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_219_0.png)\n\
    \nFigure 8.4 – An EML file viewed through the terminal showing the email's content\n\
    \nKeep in mind that the content of an email is often split up between multiple\
    \ EML files; in such cases, the partial files must be merged into a single file\
    \ in order to view the entire email.\n\nNow that we have learned where to look\
    \ for email artifacts and how to analyze them, we will focus on messaging forensics\
    \ in the next part of the chapter.\n\n## Understanding messaging forensics\n\n\
    **Short Message Service (SMS)** messages and **Instant Messaging (IM)** chat applications,\
    \ such as **WhatsApp** or **Telegram**, may contain very important information\
    \ that can aid any kind of investigation.\n\n- The `/private/var/mobile/Library/Preferences/com.apple.madrid.plist`\
    \ property list contains a set of properties and user preferences related to SMS,\
    \ iMessage, and FaceTime. In particular, the plist contains a dictionary under\
    \ the allAliases key that indicates all the aliases connected to the iMessage\
    \ account, such as phone numbers and email addresses.\n- `/private/var/mobile/Library/Preferences/com.apple.MobileSMS.plist`\
    \ stores preferences related to SMS and iMessage, including the KeepMessageForDays\
    \ key, which indicates the retention period. By default, this is set to Forever.\n\
    - The `/private/var/mobile/Library/SMS/Attachments/` folder, as the name implies,\
    \ contains attachments that were sent through MMS or iMessage, such as photos,\
    \ videos, and audio recordings.\n- The `/private/var/mobile/Library/SMS/Drafts/`\
    \ folder stores draft messages and pending messages (messages that the user sent\
    \ but that iOS did not send due to, for example, the absence of connectivity).\n\
    - The `/private/var/mobile/Library/SMS/sms.db` database stores all metadata and\
    \ content of all messages, SMS and iMessage.\n- Messages received **Before First\
    \ Unlock (BFU)** are stored in a temporary database, which is located at `/private/var/mobile/Library/SMS/sms-temp.db.`\n\
    \nWe're going to focus on the sms.db file to learn how to extract all messages\
    \ and their metadata from the message, chat_message_join, chat, and attachment\
    \ tables. The following SQL query will do the job:\n\n```\nSELECT\nCASE when LENGTH(chat_message_join.message_date)=18\
    \ THEN\n    datetime(chat_message_join.message_date/100000000 + 978307200,'unixepoch','localtime')\n\
    \    when LENGTH(chat_message_join.message_date)=9 THEN\n    datetime(chat_message_join.message_date\
    \ + 978307200,'unixepoch','localtime')\n    else 'NA'\n```\n"
