    It''s important to keep in mind that data in this database will only be stored
    for approximately four weeks before being purged on a first in-first out basis,
    so if pattern-of-life data is an essential part of the investigation, the device
    should be acquired as soon as possible.


    The main table of interest from a forensic perspective is the ZOBJECT table, which
    contains a row for each event or interaction with data spread over 40 columns.
    We will briefly go over the most interesting columns to understand how this table
    logs events:


