    # ## The KnowledgeC database


    KnowledgeC.db is the SQLite database that tracks almost all activity and device
    events, ranging from battery level to what music was played. The database is located
    at `/private/var/mobile/Library/CoreDuet/Knowledge/`, and it is only accessible
    through a full filesystem acquisition. The database is made of 16 tables, although
    most of the useful data is concentrated in one of them, the ZOBJECT table.


