  mdcn: "\n新的 iOS 更新发布后，这些漏洞可能会被修补，从而使工具失效。\n\n现代调查人员在接触 Apple 设备时必须考虑这些问题，并应根据具体情况决定采用哪种最佳技术，以获取最广泛的有价值证据。\n\
    \n## 剖析 iOS 操作系统\n\n对来自移动设备的数字证据进行取证检查，不仅需要充分理解数据，还需要了解设备本身如何工作以及这些数据是如何生成的基础知识。这在\
    \ iOS 设备上尤其具有挑战性，因为该平台闭源，因而难以理解 iOS 到底如何与所有这些数据交互，以及设备后台发生了什么。\n\nApple 投入大量精力，通过多项安全特性来限制可在其硬件上运行的操作系统和应用软件：Apple\
    \ 设备上运行的应用不直接与底层硬件交互，而是通过系统接口进行交互。iOS 可被定义为设备硬件组件与设备上应用之间的中介。\n\n提示\n\n许多出版物都提供有关\
    \ iOS 硬件的信息。如需完整的 iPhone 组件和设备列表，请参阅 Apple 支持页面：https://support.apple.com/specs/iphone。\n\
    \n## 理解 iOS 文件系统\n\n自 iOS 10 以来，Apple 文件系统（APFS）已取代 HFS+ 成为默认文件系统。APFS 是一个专有文件系统，专为移动设备而设计：它针对\
    \ SSD 存储进行了优化，并支持强加密。在 iOS 设备上，文件系统被配置为两个逻辑磁盘分区——系统分区和用户分区：\n\n- 系统分区包含 iOS 操作系统以及设备随附的所有预加载应用，但这些应用几乎不包含证据信息。系统分区仅在设备执行固件升级时才会更新。\n\
    - 用户分区挂载在 /private/var 目录下，包含所有用户创建的数据，并提供与调查人员相关的大部分证据信息。\n\n## 数据在 iOS 文件系统上存储在哪里？\n\
    \niOS 管理应用与硬件之间通信的例子之一是沙盒机制，它使用户无需直接访问文件系统即可与应用交互，确保每个应用都*被包含*在一个或多个特定容器中，这些容器会在设备上安装新应用时自动创建。这种组织方式让调查人员轻松很多，因为与特定应用相关的所有文件都分组在特定位置。\n\
    \n每个容器都有特定的作用：\n\n- 捆绑包容器包含应用本身，包括从 App Store 下载应用时附带的所有资源。\n- 数据容器保存应用和用户的数据，并进一步划分为多个目录，应用可使用这些目录来组织其数据。\n\
    - 组容器是应用存储数据的地方，这些数据可以与同组的其他应用共享。\n\n下图展示了每个应用的容器：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_18_0.png)\n\
    \n图 1.1 – 应用容器示意图\n\n数据容器包含几个不同的文件夹：\n\n- Documents/：此文件夹包含用户创建的文件，并且会自动纳入 iTunes\
    \ 备份和 iCloud 备份。\n- Library/：此文件夹供应用存储与应用相关的数据，并非由用户创建。此文件夹包含在 iTunes 和 iCloud\
    \ 备份中。\n- Temp/：包含应用相关的临时文件，不包含在备份中。\n\n如你所见，所有应用文件都完美地组织到各自的数据容器中。不过，你可能想知道这些容器到底存储在设备文件系统上的什么位置。设备上的每个应用都通过**全局唯一标识符（GUID）**进行标识，也称为\
    \ BundleID 标识符。该标识符在应用首次安装时唯一生成，如果应用被更新或重新安装，则可能会改变。\n\n应用捆绑包容器存储在 iOS 文件系统的以下路径中：\n\
    \n```\n/private/var/containers/Bundle/Application/<app-GUID>/\n```\n\n应用数据容器存储在以下路径中：\n\
    \n```\n/private/var/mobile/Containers/Data/Application/<app-GUID>/\n```\n\n组容器存储在以下路径中：\n\
    \n```\n/private/var/mobile/Containers/Shared/AppGroup/<app-GUID>/\n```\n\n提示\n\
    \n在本节中，我们了解了应用在 iOS 文件系统上存储数据的位置。但系统工件呢？系统相关的数据分布在文件系统的各个位置，所以我们不会在一个地方找到所有内容！我们将深入探讨系统工件以及在哪里找到它们，详见_第4章，处理常见iOS工件_。\n\
    \n## iOS 文件系统上的数据是如何存储的？\n\n到目前为止，我们学习了 iOS 如何将应用数据组织到容器中，以及这些容器在文件系统上的存储位置。现在，让我们讨论\
    \ iOS 文件系统中通常包含有用证据的文件类型。\n\n除了用户生成的内容（如文档、照片、视频或文本文件）之外，存储在 iOS 设备上的数据通常由以下项目组成：\n\
    \n- **SQLite 数据库**：SQLite 是一个独立、自包含的数据库，可以在一个文件中存储几乎任何类型的数据，包括二进制 BLOB。SQLite\
    \ 数据库是应用和系统数据的主要存储来源，因此解析这些数据库将是大多数数字调查的重点之一。如果你希望尝试恢复已删除的数据，数据库也极其有用，因为已删除的记录通常会在数据库本身或其临时文件中留下数字痕迹。短信、WhatsApp\
    \ 对话、通讯录、通话记录、备忘录和浏览器历史记录等基本工件都存储在 SQLite 数据库中。\n- **属性列表文件（Plists）**：Plists 是\
    \ iOS 和应用用来在设备上存储、组织和访问数据的结构化文件。这些文件可以以 XML 格式或二进制格式存储。通常，plists 用于存储应用设置或用户偏好。\n\
    - **其他文件类型**：包括日志文件、XML 文件、Protocol Buffers 和 Realm 数据库。本书稍后将深入介绍这些文件类型。\n\n以下是\
    \ XML 格式的属性列表示例：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"\
    yes\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\"\n\"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\
    >\n<plist version=\"1.0\">\n    <dict>\n        <key>UUID</key>\n        <string>3bdd52c7-ee36-4689-8517-c5fed2c98s5</string>\n\
    \        <key>ClientID</key>\n```\n\niPhone X，苹果推出了 Face ID，它利用面部识别来解锁设备。\n\n\
    解锁受密码保护的 iOS 设备是移动取证中的主要挑战之一。\n\n由于数字密码的组合数量相对较少，理论上可以使用暴力猜测攻击来利用身份验证机制。然而，这极其危险，因为\
    \ iOS 被设计为对密码输入尝试进行速率限制，如果失败尝试次数过多，设备上的数据可能会被永久删除。\n\n该密码不仅用于解锁设备本身——它还是 iOS 数据保护模型的关键特性之一：密码与硬件加密密钥结合，用于生成一个唯一且极强加密的密钥，该密钥由算法用来加密用户数据。\n\
    \n## 加密与数据保护\n\n虽然用户身份验证在防止未经授权访问物理设备方面提供了一定程度的安全性，但这些机制仍可能通过利用软件或硬件漏洞而被绕过。被入侵的设备可能会允许未经授权访问设备的文件系统。因此，从\
    \ iPhone 4 开始，整个文件系统都使用强大的加密算法进行加密。然而，随着 iPhone 5s 的发布，苹果引入了名为**数据保护**的技术，开创了移动安全的新先例，该技术依靠多个专用组件来支持加密和生物识别。\n\
    \n## 安全隔区\n\niOS 安全的核心是安全隔区，这是一个与主处理器和操作系统隔离的专用**片上系统（SoC）**，为数据保护和密钥管理提供加密操作。\n\
    \n安全隔区的主要组成部分如下：\n\n"
