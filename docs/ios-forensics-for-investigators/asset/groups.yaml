    **SQLite** 实现的，SQLite 是一种开源、小型、自包含的关系型数据库。SQLite 数据库可以通过 `.sqlite` 或 `.sqlite3`
    文件扩展名识别，尽管有些数据库使用 `.db` 扩展名，或其他扩展名。


    SQLite 在移动设备中如此受欢迎的原因在于其简单架构和出色的性能。以下是其部分特性：


    - **SQLite 是自包含的：** 整个数据库包含在一个文件中，该文件可直接集成到应用程序中。其无服务器架构意味着数据库作为一个独立文件工作，而非传统的客户端-服务器协议。

    - **SQLite 跨平台：** 数据库驻留在单个跨平台文件中，可以被 SQLite 支持的所有操作系统访问，包括 Windows、macOS、Linux、Android、iOS、BSD、Solaris
    等。

    - **SQLite 完全符合 ACID：** 这允许多个应用程序或线程安全访问。它还支持大多数 SQL 查询语言，这是与几乎所有现代关系型数据库系统交互的主要方式。


    既然我们已经了解了 SQLite 的特性，让我们来看看它如何存储数据。


    ## 表、列和行


    SQLite 数据库的基本概念应该很容易形象化——数据库包含一个或多个**表**，每个表包含的数据按**列**和**行**组织。列代表单个数据元素，例如 *电话号码*
    或 *地址*，而行代表一组值，每个列一个值。


    SQLite 支持五种不同的数据类型：


    - INTEGER

    - TEXT

    - REAL

    - BLOB

    - NULL


    前三种类型不言自明。**二进制大对象 (BLOB)** 数据类型将任何输入原样保留，而不将其转换为某种类型；BLOB 数据类型通常用于在 SQLite 记录中存储复杂二进制数据结构，例如
    **属性列表** 或 **协议缓冲区**。NULL 数据类型仅存储空值。


    要从数据库检索数据，你运行一个**查询**，它是一组用 **SQL 语言** 编写的逻辑指令，用于解析给定表以提取你想要的数据。查询的结果实际上表示为另一个表，如以下屏幕截图所示。


    为了了解查询的样子，让我们看一个简单示例。以下查询从 sms.db 数据库中提取最后五条消息：


    ```

    SELECT ROWID, text FROM message

    ORDER BY ROWID DESC

    LIMIT 5;

    ```


    输出可在以下屏幕截图中看到：


    ![](img/0b17a17d4cb56b1c25763a396dd83117_115_0.png)


    图 4.1 – DB Browser for SQLite 中显示的查询结果


    在不深入细节的情况下，我们将暂时关注此查询以了解 SQL 语言的基础。显然，如果你正在对 SQLite 数据库进行取证检查，你不希望以任何方式修改数据。因此，所有查询很可能都以
    SELECT 子句开头，这表示我们希望从表中读取数据。


    在第一行，我们选择要包含在结果中的列（ROWID 和 text）以及表名——在本例中为 message 表。查询的第二行指示结果应按什么顺序显示。在示例表中，每条短信都由递增的
    ROWID 列标识，因此为了显示最近的消息，我们按此列以降序排列结果。由于我们只对五条消息感兴趣，我们使用 LIMIT 命令来指示应显示多少行。


    ### 提示


    如果你是 SQL 语言的新手，可以通过访问 SQLite 网站学习如何编写最常见的查询类型


    https://www.sqlite.org/lang.html.


    作为取证检查员，你运行的查询通常涉及过滤和搜索数据，因此你可能想了解 CASE、WHEN 和 WHERE 等命令。我们将在本章中看到更复杂的查询。


    ## 运行 SQL 查询


    大多数取证工具都附带内置数据库查看器，允许调查人员查看整个数据库并在工具内部直接运行查询；然而，还有其他选择：


    - **SQLite 命令行实用程序**，可从 http://www.sqlite.org 下载，允许从命令行直接与数据库交互。

    - 其他免费工具，例如 **DB Browser for SQLite**，允许用户通过 **图形用户界面 (GUI)** 查看数据库并在其上运行查询。DB
    Browser for SQLite 可从 https://sqlitebrowser.org 下载。


    调查人员应熟悉用于直接访问数据库的工具，因为当检查范围仅限于一个或多个 SQLite 数据库时，这些工具将证明是巨大的时间节省者。使用 Cellebrite
    Physical Analyzer 或 Magnet AXIOM 等取证工具分析这些数据库会导致需要将整个提取加载到内存中解析；这可能非常耗时，具体取决于提取数据的大小。


    ## 使用 SQLite 命令行工具


    sqlite3 是 SQLite 库的一部分的命令行实用程序。macOS 和大多数 Linux 发行版已预装它，而 Windows 用户可以从上一节中列出的
    SQLite 网站下载可执行文件。


    要从命令行打开 SQLite 数据库，只需输入以下内容：


    ```

    sqlite3 filename.db

    ```


    如果指定名称的数据库不存在，SQLite 将为你创建它。一旦你打开数据库，将显示一个 SQL 提示符，你可以在其中运行查询和命令。有许多内置命令可以用来获取数据库及其表的基本信息。


    如果你不熟悉数据库布局，可以通过运行 .tables 命令列出其中的所有表：


    ```

    sqlite> .tables

    attachment                 message

    chat                       message_attachment_join

    chat_handle_join           message_processing_task

    chat_message_join          sync_deleted_attachments

    deleted_messages           sync_deleted_chats

    ```


    如果你对特定表感兴趣，输入 .schema 后跟表名以显示表的列和数据类型：


    ```

    sqlite> .schema handle

    CREATE TABLE handle (ROWID INTEGER PRIMARY KEY AUTOINCREMENT UNIQUE, id TEXT NOT
    NULL, country TEXT, service TEXT NOT NULL);

    ```


    通过查看列名和类型，你应该能够大致了解表中存储了什么数据。在此示例中，handle 表中的每一行都有一个自动递增的 ROWID 列和三个 TEXT 类型的列：id、country
    和 service。


    如果你想从表中检索数据，使用 SELECT 查询：


    ```

    SELECT * FROM handle;

    ```


    完成后，输入 `.exit` 或 `.quit` 终止 SQLite 会话。


    ## 页面、真空化和预写日志


    SQLite 的一个特性使其对取证检查员如此有趣，即有可能从数据库中恢复**已删除记录**。根据数据库的范围，这可能意味着恢复已删除的短信、浏览器历史记录或与设备活动相关的日志。为了更好地理解数据恢复如何实现，我们需要退一步，了解
    SQLite 在底层如何管理 `write` 和 `delete` 操作。


    我们已经了解到，从逻辑角度来看，数据库中的数据组织成包含列和行的表。这是一个高级抽象层，允许用户使用简单易于可视化的数据模型（如列和行）与数据库交互；然而，在更低级别，SQLite
    库实际上在文件系统上以不同的方式组织数据，将数据存储到**页面**中。页面类似于文件系统中的块，其目的是以二进制格式存储数据。SQLite 数据库中的每个页面可以有可变大小，默认大小为
    4096 字节，每个页面都有一个不同的编号。第一个页面包含一个 100 字节的头部，可以使用 **十六进制查看器** 分析，例如在 macOS 和 Linux
    上可用的 hexdump 命令行实用程序。


    例如，要查看名为 `sms.db` 的 SQLite 数据库的头部，我们将执行以下命令：


    ```

    ```bash

    hexdump -n 100 -C sms.db

    ```

    ```


    `-n` 参数指定应显示的字节数。由于 SQLite 有固定大小的头部，我们只对前 100 字节感兴趣。`-C` 参数告诉 hexdump 实用程序也以字符串格式显示数据：


