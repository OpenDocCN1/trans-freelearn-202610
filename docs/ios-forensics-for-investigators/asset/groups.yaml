    From a forensic viewpoint, iOS devices maintain the following:


    +   - A list of *low-energy* Bluetooth devices that can connect to the user''s
    device, also called **paired devices**. These are stored in the `/private/var/containers/Shared/SystemGroup/<GUID>/Library/Database/com.apple.MobileBluetooth.ledevices.paired.db`
    database, under the `PairedDevices` table. This table maintains a list of devices,
