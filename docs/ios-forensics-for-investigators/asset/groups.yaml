  - '[PAGE 23]


    +   - **Secure Enclave Processor (SEP)**, which runs an Apple-modified version
    of the L4 microkernel and provides computing power exclusively to Secure Enclave.

    +   - A memory protection engine.

    +   - A **True Random Number Generator (TRNG)**, which is used to generate random
    cryptographic keys.

    +   - Dedicated **Advanced Encryption Standard (AES)** hardware engines, which
    communicate directly with the SEP through a secure channel and perform in-line
    encryption and decryption as files are written or read.

    +   - A **unique ID (UID)**, a cryptographic key that uniquely identifies the
    device. The UID is randomly generated and fused directly into Secure Enclave''s
    hardware during device manufacturing, so it isn''t visible outside the device.

    +   - A dedicated, secure, nonvolatile storage system that can only be accessed
    by Secure Enclave. This is where data encryption keys are stored, ensuring that
    these are never exposed to iOS systems or applications.


    The following diagram shows the different components of Secure Enclave:'
  - '[PAGE 24]


    ![](img/0b17a17d4cb56b1c25763a396dd83117_24_0.png)


    # Figure 1.2 – Secure Enclave components


    Secure Enclave is responsible for several different security-related operations,
    including generating and storing keys necessary for encrypting data on the device
    and evaluating biometric data from Touch ID and Face ID.


    SEP uses the UID to generate cryptographic keys that are tied to the specific
    device. This adds another layer of security: if the device''s SSD storage is physically
    moved to a different device, files can''t be decrypted and thus will be inaccessible,
    since every device has a unique UID and the original UID is required to decrypt
    files.'
  - '[PAGE 25]


    # iOS Data Protection keys


    Data protection on iOS is implemented by generating and managing a hierarchy of
    cryptographic keys.


    To make things easier, before we delve into the details, let''s take a look at
    what keys are used during the encryption and decryption processes and what their
    purpose is:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_25_0.png)


    Figure 1.3 – Cryptographic keys used for iOS data protection


    +   - The device''s UID is an AES 256-bit key that''s fused directly into Secure
    Enclave during manufacturing. This key, together with the user''s passcode, is
    used to unlock *class keys*.

    +   - Class keys are generated when specific events occur on the device; for instance,
    when a device is unlocked, a *complete protection* class key is created. Shortly
    after the device locks, the decrypted class key is discarded. Class keys are used
    to wrap and unwrap file keys.

    +   - File keys are 256-bit keys that are used to encrypt the content of each
    file; these keys are per-file keys and, as such, are randomly generated every
    time a new file is created on the user partition. File keys are encrypted using
    a class key and are then stored in the file''s metadata. The metadata of all the
    files is encrypted with the filesystem key.

    +   - The filesystem key is a random key that is generated when iOS is first installed
    or when the device is wiped. The filesystem key is stored on the device, and it''s
