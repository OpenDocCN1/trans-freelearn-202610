  - '[PAGE 160]


    So far, we have learned how to manually analyze pattern-of-life data by querying
    the SQLite databases. However, there is another option that automates the process
    and allows the investigator to look at all the data in a unified database.


    **Apollo**, which stands for **Apple Pattern of Life Lazy Output''er**, is a Python
    script developed by Sarah Edwards (@iamevltwin) that correlates multiple sources
    of data into a unified **timeline**, simplifying the examiner''s job of finding
    out what exactly was happening on the device.


    The tool consists of dozens of highly configurable modules that each query a specific
    iOS database to extract data and events. The main Python script then compiles
    the results of each module into a unified **CSV** file or SQLite database.


    We''ll now go over the steps required to download the tool, run it, and export
    the results into a single SQLite database:


    +   1. To download Apollo, head over to its GitHub repository located at https://github.com/mac4n6/APOLLO
    and download the latest version as a ZIP archive or by cloning the repository
    by running the git clone command.

    +   2. Next, run the tool by specifying the export format, the location of the
    modules directory, and the location of the data that should be analyzed, such
    as the folder that contains the SQLite databases or the full filesystem extraction.
    For example, running python apollo.py -output sql modules/ fs-extraction/ will
    run Apollo in SQL mode, analyzing the files in the fs-extraction folder and running
    all modules found in the modules folder. Apollo can be run using different options
    too; for a full list of all available command-line options, you can refer to the
    project''s GitHub page.

    +   3. When the tool ends the process, the results will be stored in a file called
    apollo.db.

    +   4. You can then proceed to analyze the SQLite database using your tool of
    choice, such as **DB Browser**.'
