    # Carving for strings


    Data carving is the process of searching for particular strings or bytes within
    a file; the examiner first determines a string or pattern to search for and then,
    using a hex viewer or a command-line tool, initiates a search across a file for
    that string or pattern. This process is a great alternative to manually parsing
    through an SQLite database, as it allows the investigator to instantly verify
    whether a given record can be found in the file, including any locations where
    deleted data is normally hidden.


    The strings tool is a command-line utility that performs string carving in a binary
    file and prints the result to the screen. Displaying all the strings that can
    be found in an SQLite database is as simple as running the following command:


    ```

    strings sms.db

    ```'
  - '[PAGE 132]


    This tool can be combined with other commands, such as grep, to search for a particular
    string or pattern. The following command will search for the Apple word in the
    database we used for the previous example:


    ```

    strings test.db | grep Apple

    Apple

    ```


    As you can see, the Apple string was printed to screen, and this confirms that
    it was found in the SQLite database. This simple tool can be a life-saving hack
    to show all the strings that are stored in a database, including deleted data!


    # Recovering deleted records using FQLite


    The task of manually recovering deleted data from an SQLite database can be a
    daunting process; fortunately, most commercial forensic tools have this feature
    built in, but there are other options too. At the time of writing, FQLite is probably
    the most complete open source SQLite recovery tool, for the following reasons:


    +   - It''s written in Java, so you can run it from any OS.

    +   - It supports the recovery of deleted records from all database pages, including
    free blocks and unallocated space.

    +   - It has built-in support for WAL files.

    +   - Recovered records can be exported in CSV format.


    To download FQLite, visit https://www.staff.hs-mittweida.de/~pawlaszc/fqlite/
    or head over to the GitHub repository that is located at https://github.com/pawlaszczyk/fqlite.


    We will now briefly go through the process of recovering deleted data from the
    sms.db SQLite database:


    +   1. Launch FQLite and select the database from which recovery should be attempted
    by going to File | Open Database.'
  - '[PAGE 133]


    +   2. FQLite will now process the file and analyze the database, searching for
    deleted records. You can follow the progress by looking at the log panel at the
    bottom of the screen.

    +   3. Once FQLite is done, from the left panel, choose the database or WAL file
    you want to examine.

    +   4. FQLite will display a table with all the data that was found in the database,
    including deleted records:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_133_0.png)


    Figure 4.16 – FQLite recovers deleted records from an SQLite database


