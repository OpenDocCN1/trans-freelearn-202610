    ![](img/0b17a17d4cb56b1c25763a396dd83117_46_0.png)


    still obtained during a filesystem acquisition, but the examiner is also granted
    access to raw files stored within the device. This allows investigators to access,
    for example, databases of all third-party applications without restrictions, and
    recovery of deleted artifacts can also be attempted.


    Although there are many tools that allow you to perform this kind of acquisition,
    Apple restricts direct access to the device''s filesystem, so you will have to
    find a workaround to gain full access to the device before a full filesystem acquisition
    can be performed.


    So, you may be wondering – how do I access the device filesystem? Is a **jailbreak**
    required? Although jailbreaking is one of the available options, it is not the
    only one.


    At the time of writing, there are three different solutions to gain access to
    the device''s filesystem:


    - Using tools that leverage Checkm8, a BootROM exploit

    - Using an extraction agent

    - Jailbreaking the device


    ## Checkm8


    The publication of the Checkm8 vulnerability in 2019 by the hacker @axi0mX, which
    is based on an unpatchable vulnerability present in the BootROM of millions of
    iOS devices, is arguably the biggest game changer ever in the forensics industry.


    Checkm8 is compatible with A5 to A11-based devices; this includes all devices
    starting from the iPhone 5s up to the iPhone X, as there is no working implementation
    for 4S hardware.


    Before we get into the details, it''s useful to understand how the iOS boot procedure
    works and why the Checkm8 vulnerability cannot be patched.


    ![](img/0b17a17d4cb56b1c25763a396dd83117_50_0.png)


    Figure 2.3 – iOS secure boot chain


    As you can see, the first step in the boot process is the execution of the code
    from the device''s BootROM. This stage of the process is implicitly trusted because,
    as its name implies, the BootROM is a read-only memory component that cannot be
    modified after manufacturing by anyone, not even by Apple.


    The Checkm8 exploit is based on a vulnerability that resides within this portion
    of read-only memory, so this means that Apple has no way of patching it, leaving
    hundreds of millions of iOS devices vulnerable. To have a better understanding
    of what a breakthrough this is, keep in mind that the previous BootROM exploit
    was discovered in 2010!


    ### Tip


    If you''re interested in the technical details, you can find a full report on
    the Checkm8 vulnerability at the following link:


    In light of these limitations, some vendors have come up with a built-in solution
    that allows investigators to perform a full filesystem acquisition, exploiting
    the Checkm8 vulnerability but *without* actually jailbreaking the device.


    Currently, this feature is available in some of the most popular forensic tools,
    including *Cellebrite UFED*, *Elcomsoft iOS Forensic Toolkit*, and *Oxygen Forensic
    Detective*.


    The difference between these solutions and performing a traditional jailbreak
    through checkra1n is that these tools do not modify the device in any way; the
    exploit is performed in the device''s RAM. Once the acquisition process ends,
    the device will reboot normally, leaving no traces.


    Whenever possible, this should be the preferred method to acquire the full filesystem
    from an iOS device, as this is definitely the most forensically sound solution.


    ## Agent-based acquisitions


    The main drawback in Checkm8 acquisitions is that they''re not supported by newer
    devices like the **iPhone 12** or the **iPhone 13**, as these devices are not
    vulnerable to the Checkm8 exploit.


    In 2020, vendors responded to these limitations by providing an alternative method
    to extract the full filesystem from any iOS device, including the latest iPhone
    12; this solution relies on installing an extraction agent that will exploit software
    vulnerabilities, gain access to the entire filesystem, and establish a secure
    connection between the device and the computer.


    Although this method requires installing an application (**the agent**) on the
    device, this is considered forensically safe, as the agent leaves a drastically
    smaller footprint compared to other solutions, like jailbreaking the device. The
    only traces left on the device are some minor changes in system log files; however,
    because of this, depending on your jurisdiction, you may need authorization or
    legal authority to use this method.


    The following is a list of requirements to use this method:


    - Supported iOS devices: all devices starting from the iPhone 5s up to iPhone
    12.

    - Supported iOS versions: iOS 9.0 through to iOS 14.3.

    - Using an **Apple ID** registered in Apple''s Developer Program is strongly recommended
    for installing the agent on the device, as this relieves the need to open internet
    access on the device.


    Currently, *Elcomsoft iOS Forensic Toolkit* and *Belkasoft Evidence Center X*
    are the only tools that provide agent-based extraction capabilities.


    ## Jailbreaking the device


    Finally, let''s talk about jailbreaks! We''ve seen how it''s possible to extract
    a full filesystem from an iOS device by exploiting the CheckM8 vulnerability or
    by performing an agent-based acquisition. However, as we''ve learned, both these
    methods have their limitations, and there could be some cases where jailbreaking
    the device is your only option to perform a filesystem acquisition.


    Applying a jailbreak will leave some permanent traces on the device, so this option
    should only be considered as a last resort and only if you have the legal authority
    to do so.


    At the moment, the most popular jailbreaks are **checkra1n** and **unc0ver**.
    Both these jailbreaks allow investigators to install third-party tools such as
    SSH, which will give unrestricted access to the device''s filesystem.


    In the following table, you can check the compatibility for both these jailbreaks:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_55_0.png)


    Figure 2.4 – The main checkra1n screen


    - 4. When you''re ready, click **Start**. The device will reboot into recovery
    mode automatically.

    - 5. You will now be presented with instructions on how to reboot the device into
    DFU mode. Follow the instructions until your device shows a black screen:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_56_0.png)


    Figure 2.5 – Follow the instructions to put the device in DFU mode


    - 6. At this point, checkra1n will begin the jailbreak process. The device will
    boot PongoOS and should look like this:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_58_0.png)


    Figure 2.7 – Enter the passcode when requested


    When the device reboots, you will find the checkra1n icon. Launching that application
    will allow you to install Cydia. Once Cydia is installed, you can proceed to install
    any third-party packages, such as SSH.


    Remember that checkra1n is a semi-tethered jailbreak; if you reboot the device,
    you will have to jailbreak it again using the checkra1n tool.


    Once the device has been successfully jailbroken, you can perform a full filesystem
    acquisition using the tool of your choice.


    ## Triaging the device


    When you''re dealing with iOS devices, it''s useful to gather some information
    directly from the device prior to starting the acquisition process. Knowing what
    iOS version is running on the device, for instance, can be useful to determine
    what the best acquisition method is. For this purpose, we''re going to use `libimobiledevice`.


    The `libimobiledevice` library is a cross-platform library that allows users to
    communicate with an iOS device using their native protocol to provide access to
    the device''s filesystem, including information about the device and its internals.
    It works with all devices, including the most recent ones.


    The first step is to head to http://libimobiledevice.org, where the library can
    be downloaded for free. If you''re running Windows, instead of downloading the
    source files and compiling them, you can download precompiled binaries from the
    project''s GitHub repository.


    If you''re running macOS, you can install the library simply by running the following
    command from the terminal:


    ```

    brew install libimobiledevice

    ```


    If you''re running a Linux distribution that supports the apt packet manager,
    you can install the library by running the following command:


    ```

    sudo apt-get install usbmuxd libimobiledevice6

    libimobiledevice-utils

    ```


    Once you have installed the library, connect the device to your forensic workstation
    and run the following command from the terminal:


    ```

    ideviceinfo

    ```


    This command will connect to the device, parse data relevant to the hardware and
    software, and display it on screen. Keep in mind that the device will have to
    be paired with the host system by entering the passcode. If you''re running Linux
    or macOS, you can combine the previous command with the grep command to view some
    key data:


