    # # Understanding Safari forensics


    Analyzing artifacts that have been left by internet browsing activity is typically
    a crucial aspect of mobile forensic investigations. Almost every activity a suspect
    performs while using a browser on a mobile device leaves a trace on the device
    itself, including, of course, searching for information and browsing through web
    pages.


    In this section, we''ll focus on the browser that is built into all iOS devices,
    **Safari**. Keep in mind that dozens of third-party browsers can be installed
    on a device, such as **Chrome**, **Firefox**, and **Opera**: it''s important to
    review these applications and analyze their artifacts as they could potentially
    contain important data. We''ll learn how to analyze third-party applications in
    _Chapter 10, Analyzing Third-Party Apps_.


    Browsing history is likely the most commonly recovered item, but other files should
    be reviewed too. Typically, the following data can be recovered by analyzing Safari
    artifacts:


    +   - Browsing history

    +   - Open/private tabs

    +   - Bookmarks/saved pages

    +   - Cookies

    +   - Cache files


    Most of Safari''s artifacts are stored in `/private/var/mobile/Library/Safari/`.
    Within this folder, you will find the following relevant files:'
  - '[PAGE 207]


    <!-- no content -->'
  - '[PAGE 208]


    ```

    /private/var/mobile/Containers/Data/Application/GUID/Library

    /Cookies/Cookies.binarycookies

    ```


    Safari cookies are stored in this file, in binary format. To understand the format
    specification, please refer to the following link: https://github.com/libyal/dtformats/blob/main/documentation/Safari%20Cookies.asciidoc.
    Cookies can also be extracted using **automated scripts**, such as the Safari-Binary-Cookie-Parser
    Python script by Mari DeGrazia. It can be downloaded from https://github.com/mdegrazia/Safari-Binary-Cookie-Parser.


    ```

    /private/var/mobile/Containers/Data/Application/GUID/Library

    /Safari/

    ```


    This folder should be analyzed as it contains several useful files, such as Safari
    **thumbnails**, **preferences**, **auto-fill data**, and a **downloads** list.


    Finally, let''s cover two different ways of analyzing Safari browsing history.


    # Analyzing Safari history


    As we learned earlier, Safari stores browsing history in the /private/var/mobile/Library/Safari/History.db
    database. It''s important to understand that this file doesn''t just store browsing
    history from the local device – it also contains data that''s been **synced from
    iCloud**, such as the browsing history from other devices. It''s the examiner''s
    job, when analyzing this data, to dissect which websites were visited on the device
    that is being examined and what data has been synced from different devices.


    The following screenshot shows a query example that extracts all the relevant
    data and the resulting records:'
  - '[PAGE 209]


    <!-- no content -->'
  - "[PAGE 210]\n\n```\nLEFT JOIN\n    ZSTRUCTUREDMETADATA\n    ON ZOBJECT.ZSTRUCTUREDMETADATA\
    \ =\nZSTRUCTUREDMETADATA.Z_PK\nLEFT JOIN\n    ZSOURCE\n    ON ZOBJECT.ZSOURCE\
    \ = ZSOURCE.Z_PK\nWHERE\n    ZSTREAMNAME IS \"/safari/history\"\nORDER BY DATE\
    \ ASC;\n```\n\nFirst, we must select the timestamp of when the browser event occurred\
    \ and transform it into a readable string by using the DATETIME function. Then,\
    \ we must perform a JOIN on the ZSTRUCTUREDMETADATA table to extract the title\
    \ of the web page. After that, we must select the URL and calculate the GMT offset.\
    \ Finally, we must order the results chronologically.\n\nThe following screenshot\
    \ shows the results of this query:\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_210_0.png)\n\
    \nFigure 7.9 — Analyzing the browsing history of KnowledgeC.db\n\nWhen analyzing\
    \ the user's browsing history, the investigator should always examine both databases\
    \ since one of them could potentially contain unique data.\n\n# Introducing private\
    \ browsing\n\nTo finish this chapter, we will introduce **private browsing**,\
    \ a feature that Apple introduced in iOS 5. When this feature is active, the details\
    \ of the"
  - '[PAGE 211]


    user''s browsing history are not stored and the websites that have been visited
    are not synced to iCloud.


    > As stated in Apple''s official documentation, *"Safari won''t remember the pages
    you visited, your search history, or your AutoFill information AFTER you close
    a tab in private browsing mode."*


    Theoretically, this poses a problem from a forensic perspective as both `history.db`
    and `KnowledgeC.db` do not store this data. There are, however, other options:


    +   - You can analyze the cookies that are stored on the device. Safari''s web
    cache could also reveal traces of websites that were browsed with private browsing
    active.

    +   - The `BrowserState.db` database stores details of active tabs, **including
    private tabs**. For each tab, there is an entry in the `tab_sessions` table that
    contains a binary PLIST. Converting this PLIST into XML format will allow the
    investigator to parse through the file, which contains the history of the pages
    that were browsed within that tab. This will only work if the private tab is still
    open in Safari.

    +   - As we learned in the previous chapters, deleted data is not permanently
    removed from a SQLite database – it is merely marked as deleted. By using **forensic
    tools**, it is possible to recover deleted records from the `BrowserState.db`
    database, which may include details of tabs that have been opened in private mode.
    To learn how to attempt data recovery from SQLite databases, please refer to *Chapter
    4, Working with Common iOS Artifacts*.


    Internet browsing artifacts are an important part of any mobile forensics investigation.
    Analyzing the browsing history may provide some insight, but accessing the data
    that''s relevant to private internet browsing can be far more enlightening, revealing
    any activity that the user wanted to keep hidden.


