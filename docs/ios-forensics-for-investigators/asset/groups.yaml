    ### 使用取证工具分析位置数据


    我们将重点介绍两种工具：商业工具 Cellebrite **Physical Analyzer**，以及免费工具 **Apollo**。


    ### 使用 Physical Analyzer 查看位置数据


    Cellebrite Physical Analyzer 通过在统一视图中显示 GPS、蜂窝和 Wi-Fi 位置来自动化分析位置数据的任务。请记住，要访问位置数据，您需要执行完整的系统提取，因为感兴趣的文件在逻辑或
    iTunes 备份中不可用。


