  mdcn: "\n\n从取证角度来看，iOS 设备维护以下内容：\n\n- 一份可连接用户设备的 *低功耗* 蓝牙设备列表，也称为 **已配对设备**。这些设备存储在\
    \ `/private/var/containers/Shared/SystemGroup/<GUID>/Library/Database/com.apple.MobileBluetooth.ledevices.paired.db`\
    \ 数据库中，位于 `PairedDevices` 表下。该表维护着设备列表、其名称、其 **媒体访问控制 (MAC)** 地址以及最后看到的时间戳。\n\
    - 其他蓝牙已配对设备（*不仅仅是低功耗*），存储在 `/private/var/containers/Shared/SystemGroup/<GUID>/Library/Preferences/com.apple.MobileBluetooth.devices.plist`\
    \ 文件中。该属性列表维护着设备名称和最后检测时间的列表。\n- 一份 *已见* 蓝牙设备的列表，即在设备附近但未连接的其他可用蓝牙设备。这些设备可以在 `/private/var/containers/Shared/SystemGroup/<GUID>/Library/Database/com.apple.MobileBluetooth.ledevices.other.db`\
    \ 数据库中找到，位于 `OtherDevices` 表下。\n- 蓝牙相关事件的详细日志，例如 **连接** 和 **断开连接** 事件。这些存储在 `knowledgeC.db`\
    \ 数据库中。\n\n由于前三个文件很容易查询，我们将集中精力从 `/private/var/mobile/Library/CoreDuet/Knowledge/knowledgeC.db`\
    \ 数据库中提取蓝牙事件，该数据库我们在 *第 5 章，行为模式取证* 中介绍过。\n\n首先，我们必须从 `ZOBJECT` 表中选择事件的开始和结束日期。然后，我们必须通过搜索\
    \ `/bluetooth/isConnected` 流来筛选结果。我们必须从 `ZSTRUCTUREDMETADATA` 表中提取事件状态和设备详细信息。最后，我们必须按时间顺序排列结果。\n\
    \n最终的查询如下所示：\n\n```\nSELECT\nDATETIME(ZOBJECT.ZSTARTDATE + 978307200, 'unixepoch',\n\
    'localtime') AS \"Start\",\nDATETIME(ZOBJECT.ZENDDATE + 978307200, 'unixepoch',\n\
    'localtime') AS \"End\",\nCASE\n    WHEN ZOBJECT.ZVALUEINTEGER = 0 THEN \"Disconnected\"\
    \n    WHEN ZOBJECT.ZVALUEINTEGER = 1 THEN \"Connected\"\nEND AS \"Status\",\n\
    ZSTRUCTUREDMETADATA.Z_DKBLUETOOTHMETADATAKEY__ADDRESS AS \"Address\",\nZSTRUCTUREDMETADATA.Z_DKBLUETOOTHMETADATAKEY__NAME\
    \ AS \"Device\"\nFROM ZSTRUCTUREDMETADATA\nLEFT JOIN ZOBJECT ON ZSTRUCTUREDMETADATA.Z_PK\
    \ =\nZOBJECT.ZSTRUCTUREDMETADATA\nWHERE ZOBJECT.ZSTREAMNAME = \"/bluetooth/isConnected\"\
    \nORDER BY \"Start\" ASC;\n```\n\n查询完成后，调查人员可以检索每次设备连接到或断开与蓝牙启用设备的连接时记录的事件列表，以及设备的\
    \ MAC 地址；结果显示在以下屏幕截图中：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_205_0.png)\n\
    \n图 7.7 – 显示蓝牙连接事件的查询\n\n蓝牙 artifacts 可以成为调查的重要组成部分。通过利用有关已配对或已见设备的 data，调查人员不仅可以评估设备是否在使用并连接到某个设备，而且\n\
    \n还可以将设备所有者在某个时间点的大致位置确定出来，如果蓝牙设备的位置已知的话。在下一节中，我们将介绍 Safari 取证。\n\n## 了解 Safari\
    \ 取证\n\n分析互联网浏览活动留下的 artifacts 通常是移动取证调查的一个关键方面。嫌疑人在移动设备上使用浏览器执行几乎每项活动都会在设备本身留下痕迹，包括当然是搜索信息和浏览网页。\n\
    \n在本节中，我们将重点关注内置于所有 iOS 设备的浏览器，**Safari**。请记住，数十个第三方浏览器可以安装在设备上，例如 **Chrome**、**Firefox**\
    \ 和 **Opera**：审查这些应用程序并分析其 artifacts 很重要，因为它们可能包含重要数据。我们将在 _第 10 章，分析第三方应用程序_\
    \ 中学习如何分析第三方应用程序。\n\n浏览历史可能是最常恢复的项目，但也应审查其他文件。通常，通过分析 Safari artifacts 可以恢复以下数据：\n\
    \n- 浏览历史\n- 打开/私有标签页\n- 书签/已保存页面\n- Cookies\n- 缓存文件\n\nSafari 的大部分 artifacts 存储在\
    \ `/private/var/mobile/Library/Safari/` 中。在此文件夹中，您将找到以下相关文件：\n\n/private/var/mobile/Containers/Data/Application/GUID/Library\n\
    /Cookies/Cookies.binarycookies\n\nSafari cookies 存储在此文件中，采用二进制格式。要了解格式规范，请参阅以下链接：https://github.com/libyal/dtformats/blob/main/documentation/Safari%20Cookies.asciidoc。Cookies\
    \ 也可以使用 **自动化脚本** 提取，例如 Mari DeGrazia 的 Safari-Binary-Cookie-Parser Python 脚本。它可以从\
    \ https://github.com/mdegrazia/Safari-Binary-Cookie-Parser 下载。\n\n```\n/private/var/mobile/Containers/Data/Application/GUID/Library\n\
    /Safari/\n```\n\n此文件夹应进行分析，因为它包含多个有用的文件，例如 Safari **缩略图**、**首选项**、**自动填充数据** 和\
    \ **下载** 列表。\n\n最后，让我们介绍两种不同的分析 Safari 浏览历史的方法。\n\n## 分析 Safari 历史记录\n\n正如我们之前学到的，Safari\
    \ 将浏览历史存储在 /private/var/mobile/Library/Safari/History.db 数据库中。重要的是要理解，此文件不仅仅存储本地设备的浏览历史——它还包含已从\
    \ **iCloud 同步** 的数据，例如其他设备的浏览历史。分析人员在分析此数据时的工作是区分哪些网站是在正在检查的设备上访问的，哪些数据是从不同设备同步的。\n\
    \n以下屏幕截图显示了一个提取所有相关数据并生成结果记录的查询示例：\n\n```\nLEFT JOIN\n    ZSTRUCTUREDMETADATA\n\
    \    ON ZOBJECT.ZSTRUCTUREDMETADATA =\nZSTRUCTUREDMETADATA.Z_PK\nLEFT JOIN\n \
    \   ZSOURCE\n    ON ZOBJECT.ZSOURCE = ZSOURCE.Z_PK\nWHERE\n    ZSTREAMNAME IS\
    \ \"/safari/history\"\nORDER BY DATE ASC;\n```\n\n首先，我们必须选择浏览器事件发生的时间戳，并使用 DATETIME\
    \ 函数将其转换为可读字符串。然后，我们必须在 ZSTRUCTUREDMETADATA 表上执行 JOIN 以提取网页标题。之后，我们必须选择 URL 并计算\
    \ GMT 偏移量。最后，我们必须按时间顺序排列结果。\n\n以下屏幕截图显示了此查询的结果：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_210_0.png)\n\
    \n图 7.9 — 分析 KnowledgeC.db 的浏览历史\n\n在分析用户的浏览历史时，调查人员应始终检查两个数据库，因为其中一个可能包含独特的数据。\n\
    \n## 介绍私有浏览\n\n为了完成本章，我们将介绍 **私有浏览**，这是 Apple 在 iOS 5 中引入的功能。当此功能处于活动状态时，用户浏览历史的详细信息不会被存储，并且已访问的网站不会同步到\
    \ iCloud。\n\n> 正如 Apple 官方文档所述，*\"在私有浏览模式下关闭标签页后，Safari 不会记住您访问的页面、搜索历史或您的自动填充信息。\"\
    *\n\n从取证角度来看，这在理论上构成了一个问题，因为 `history.db` 和 `KnowledgeC.db` 都不存储此数据。然而，还有其他选择：\n\
    \n- 您可以分析设备上存储的 cookies。Safari 的网页缓存也可能揭示在私有浏览处于活动状态时浏览的网站的痕迹。\n- `BrowserState.db`\
    \ 数据库存储活动标签页的详细信息，**包括私有标签页**。对于每个标签页，`tab_sessions` 表中都有一个条目，其中包含二进制 PLIST。将此\
    \ PLIST 转换为 XML 格式将允许调查人员解析文件，其中包含在该标签页内浏览的页面的历史记录。这仅在私有标签页仍在 Safari 中打开时才有效。\n\
    - 正如我们在前几章中所学到的，已删除的数据并未从 SQLite 数据库中永久删除——它只是被标记为已删除。通过使用 **取证工具**，可以从 `BrowserState.db`\
    \ 数据库中恢复已删除的记录，其中可能包括在私有模式下打开的标签页的详细信息。要了解如何尝试从 SQLite 数据库中恢复数据，请参阅 *第 4 章，使用常见的\
    \ iOS Artifacts*。\n\n互联网浏览 artifacts 是任何移动取证调查的重要组成部分。分析浏览历史可能提供一些见解，但访问与私有互联网浏览相关的数据可能更有启发性，揭示用户想要隐藏的任何活动。\n\
    \n## 总结\n\n"
