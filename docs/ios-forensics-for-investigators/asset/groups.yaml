    \ their output is by using them to analyze a known device, such as your personal\
    \ iPhone. Use your device to perform normal day-to-day activity and take notes.\
    \ Then, extract and analyze data from the device using several tools and check\
    \ that it gets reported correctly.\n\nAlthough forensic tools will greatly aid\
    \ the investigator by speeding up the entire process, this software should not\
    \ substitute the process of manually viewing and assessing the files that were\
    \ extracted in the acquisition process.\n\n## Working with Cellebrite Physical\
    \ Analyzer\n\nCellebrite software is generally regarded as the golden standard\
    \ for mobile forensics among law enforcement and security organizations due to\
    \ its powerful features, wide device compatibility, frequent updates, and easy-to-use\
    \ user interface. Their most popular tools are **Cellebrite Universal Forensic\
    \ Extraction Device (Cellebrite UFED)**, which we used in the previous chapter\
    \ to acquire the device's filesystem, and **Cellebrite Physical Analyzer**, which\
    \ is used for data analysis and reporting.\n\nWe will now learn how to import\
    \ the extracted data into Physical Analyzer and then we'll go over some of the\
    \ main features of this powerful tool.\n\n### Loading evidence and selective decoding\n\
    \nThe first step in a Physical Analyzer examination is loading the evidence into\
    \ the tool. You can accomplish this by using the **case wizard**, which is a step-by-step\
    \ procedure that will guide you through the process and also show you some optional\
    \ features that can be enabled. One of these is **selective decoding**, which\
    \ allows investigators to perform faster parsing and analysis by selecting specific\
    \ applications or specific categories that should be parsed in addition to common\
    \ system artifacts. This is especially useful when you're dealing with devices\
    \ that have dozens of installed applications, but you only need to parse very\
    \ specific artifacts that pertain to a few of these apps.\n\nLet's see how this\
    \ works:\n\n1. From Physical Analyzer's menu, choose **File | Open case** to bring\
    \ up the case wizard.\n\n2. The next step involves choosing which files to load\
    \ depending on the type of acquisition that was performed. If you acquired the\
    \ device using Cellebrite UFED, choose Add | Load extraction and select the UFDX\
    \ or UFD file that was created by Cellebrite UFED. If you used a different forensic\
    \ tool and performed a filesystem acquisition, choose Add | GrayKey and point\
    \ it to the folder or archive where the extracted data is stored. Finally, if\
    \ you performed a logical acquisition, choose Add | Common source | Backup and\
    \ select the folder that contains your iTunes backup. Then, click Next to continue:\n\
    \n   ![](img/0b17a17d4cb56b1c25763a396dd83117_85_0.png)\n\n   *Figure 3.1 – Open\
    \ the case wizard and add the folder or file that contains your data*\n\n3. In\
    \ the next screen, the case wizard will display a set of examination tools that\
    \ can be enabled by selecting their checkbox. Enabling parsing of archives can\
    \ be useful to recover data from log files that have been compressed and archived\
    \ by iOS; however, keep in mind that this will increase decoding time. In this\
    \ example, we're going to use selective decoding to speed up the decoding process,\
    \ so enable this tool and click on **Examine data** to start the process:\n\n\
    \   ![](img/0b17a17d4cb56b1c25763a396dd83117_86_0.png)\n\n   *Figure 3.2 — The\
    \ case wizard also allows you to enable specific examination tools*\n\n4. At this\
    \ point, Physical Analyzer will scan for applications available on the device,\
    \ and when it's done scanning, a list will appear with several filtration options\
    \ – for example, from the **Social networking** category, we can choose to only\
    \ parse **Telegram Messenger** and **WhatsApp Messenger** by checking the boxes.\
    \ When you've finished, click **Continue** to start the decoding process:\n\n\
    \   ![](img/0b17a17d4cb56b1c25763a396dd83117_87_0.png)\n\n   *Figure 3.3 – Choose\
    \ which applications should be decoded*\n\n5. When the process finishes, the **Extraction\
    \ Summary** pane will be displayed, which shows some key data on the device and\
    \ a list of all the artifacts divided into categories:\n\n   **Extraction Summary**\n\
    \n   Extractions: 1\n\n   ![](img/0b17a17d4cb56b1c25763a396dd83117_88_0.png)\n\
