    ## Summary


    In this chapter, we learned which are the most common types of artifacts found
    on an iOS device and how to analyze these files.


    First, we introduced databases and learned how SQLite organizes data into tables,
    columns, and rows. Then, we took a deep dive into SQLite''s internal architecture
    to understand how records are organized at a lower level and where deleted records
    can be found. We discussed possible options to attempt the recovery of deleted
    data, such as manually analyzing the database through a hex viewer or using tools
    such as FQLite.


    Further on in the chapter, we talked about property lists and protocol buffers,
    which can also be found on iOS devices in XML or binary format. To be readable,
    these files first need to be decoded.


    Finally, in the last part of the chapter, we outlined some common locations where
    artifacts can be found and listed some essential files that should be considered
    in every investigation. In the next chapter, we will discuss pattern-of-life forensics.


    ## Chapter 5: Pattern-of-Life Forensics


    In the previous chapter, we learned all about different kinds of artifacts that
    can be found on iOS devices, such as SQLite databases and plists, and how to manually
    analyze these files. In this chapter, we will use this knowledge to work with
    some of the most interesting databases from a forensics perspective, such as the
    **KnowledgeC** database, which is the go-to solution for pattern-of-life forensics.


    Pattern-of-life data is all about the habits that the device owner carries out
    in their day-to-day life. When it comes to smartphones, this includes what apps
    have been used at any given point in time and for how long, when the device was
    unlocked, what the battery temperature was, and what webpage the user was browsing.


    We''ll start the chapter by defining pattern-of-life forensics to get a better
    understanding of what kind of data we may encounter in an iOS device investigation.
    We will then discuss timestamps and how to convert them between different time
    zones. Then, we will take an in-depth look at KnowledgeC, power logs, and device
    events, and we will learn how to identify user interaction. Finally, we will introduce
    Apollo, an open source tool that greatly simplifies the process of locating and
    reviewing pattern-of-life artifacts.


    In this chapter, we will cover the following topics:


    - Introducing pattern-of-life forensics

    - Working with timestamps

    - Logs, events, and user interaction

    - Introducing Apollo


    ### Introducing pattern-of-life forensics


    If you have never had the opportunity to take a close look at an iOS device''s
    pattern-of-life data, you''ll likely be surprised by the amount and variety of
    data that is collected, stored, and processed during normal smartphone use. Typically,
    this data is used by the operating system to provide customized recommendations
    to the user, such as Siri''s suggestions.


    What exactly is pattern-of-life forensics? This data is all about **user behavior**
    and **device usage**, and it allows the investigator to answer questions such
    as the following:


    - What has the user been using the device for?

    - What have they accessed?

    - Who have they communicated with?


    From a forensic perspective, analyzing pattern-of-life data is extremely useful,
    not only to identify all activities performed on the device in a given period
    of time but also to build a profile of the device owner; by analyzing the data
    collected by iOS, the investigator will gain a deep understanding of the owner''s
    habits, such as which apps are used when the user wakes up, which Wi-Fi networks
    the device connects to most often, web history, and notifications. Building a
    profile of the activity that can be considered normal allows the investigator
    to instantly detect **patterns of abnormal behavior** that may be of interest
    to the investigation.


    Surprisingly, pattern-of-life data gets very little attention from the forensic
    community, mostly because of the challenges in obtaining the relevant SQLite databases
    from the device; this data is not accessible during normal use of the device and
    can only be accessed through a **full filesystem acquisition**. Clearly, this
    limits the range of devices from which this kind of data can be extracted, but
    the **checkm8 exploit** and other techniques such as **agent-based acquisitions**
    that rely on public software vulnerabilities allow investigators to access user
    activity and behavior from most iOS devices.


    ### Meaningful SQLite databases


    The following is a list of the most common databases relevant to pattern-of-life
    forensics. We will take an in-depth look at each of these later on in the book:


    - The primary source for user and device activity is the `KnowledgeC.db` SQLite
    database, which can be found on both macOS and iOS devices. On iOS, it is located
    at `/private/var/mobile/Library/CoreDuet/Knowledge/` and can be accessed only
    through a full filesystem acquisition. This database typically contains hundreds
    of thousands of records pertaining to device events and user activity.


    - The `interactionC.db` SQLite database keeps track of recent interactions between
    the device owner and their contacts, such as SMS messages or calls. It''s not
    exactly clear what the retention period is for this database, as the data is not
    consistent among different devices, but generally speaking, an investigator will
    find entries for the last six months. Although `interactionC.db` does not contain
    the actual contents of the conversations, it contains metadata that can be correlated
    with other artifacts. The database can be found at `/private/var/mobile/Library/CoreDuet/People/`.


    - The `CurrentPowerLog.PLSQL` file, located at `/private/var/containers/Shared/SystemGroup/UUID/Library/BatteryLife/`,
    tracks data related to battery life, such as usage and temperature.


    - Another interesting database that can help an investigator understand what processes
    were running on a device at a certain point in time is the `DataUsage.sqlite`
    database, which is located at `/private/var/wireless/Library/Databases/`. This
    database stores network usage stats for every process.

