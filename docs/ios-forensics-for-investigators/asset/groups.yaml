    \ iOS 提取中提取与蜂窝相关的数据，例如设备的 IMSI 和 IMEI 代码。然后，我们分析了 PowerLog 以查看相关事件，例如设备注册到蜂窝网络。\n\
    \n之后，我们重点关注了电话通话，学习了如何从通讯录中提取联系人数据，以及如何访问通话记录，其中包含所有来电和去电的详细信息，包括 FaceTime 视频通话。然后，我们介绍了网络使用的主题，学习了哪些查询能让调查人员查看设备上运行了哪些进程，以及它们消耗了多少网络数据。\n\
    \n最后，我们学习了 Safari 取证。我们深入研究了常见 Safari 工件的存放位置，以及如何通过 `History.db` 和 `KnowledgeC.db`\
    \ 数据库分析浏览历史。我们还简要讨论了一些在隐私浏览模式下恢复数据的选项。\n\n在下一章中，我们将学习电子邮件和消息取证。\n\n## 电子邮件取证简介\n\
    \n在本章的第一部分，我们将介绍电子邮件取证，并重点关注 **Apple Mail** 应用程序。可以肯定地说，Apple Mail 无疑是 iOS 设备上最流行的电子邮件客户端；然而，调查人员应记住，还有更多第三方电子邮件应用可用，例如\
    \ **Outlook**、**Spark**、**Gmail** 和 **Airmail**。分析第三方应用将在*第 10 章“分析第三方应用”*中介绍。对电子邮件工件进行全面取证分析应包括分析\
    \ Apple Mail 以及设备上安装的任何第三方客户端。\n\n调查 Apple Mail 数据的第一步是定位工件：这些工件可以在 `/private/var/mobile/Library/Mail`\
    \ 文件夹中找到。请注意，需要进行完整的文件系统提取。以下是最相关文件及其描述的列表：\n\n- 对于设备上配置的每个电子邮件帐户，`Mail` 文件夹中都会有一个对应的文件夹；该文件夹的名称指向该帐户的唯一标识符。每个文件夹都包含额外的子文件夹，例如\
    \ `Inbox`、`Sent`、`Spam` 和 `Drafts`，其中包含实际的电子邮件，存储为**电子邮件（EML）**文件。\n- `Envelope\
    \ Index` 文件是一个 SQLite 数据库，包含多个表，这些表存储与设备上配置的每个电子邮件帐户相关的**元数据**。\n- `Protected\
    \ Index` 数据库包含与电子邮件相关的实际数据，例如邮件正文的**摘要**、**主题**和**地址**。\n- `MailboxCollections.plist`\
    \ 存储与每个帐户相关的用户偏好设置。\n- `metadata.plist` 文件存储每个邮箱最后一次同步到设备的时间戳。\n\n既然我们知道了电子邮件工件的位置，我们将直接深入这些\
    \ SQLite 数据库，解析电子邮件元数据及其内容。\n\n### 提取电子邮件元数据\n\n我们将从检查 Envelope Index 数据库开始。第一个值得关注的表是\
    \ mailboxes 表。顾名思义，该表存储了设备上配置的所有邮箱的列表。这包括单个帐户的不同文件夹，例如“重要”、“垃圾邮件”、“草稿”和“已删除”。\n\
    \n以下截图显示了 mailboxes 表中的一些示例数据：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_215_0.png)\n\
    \n图 8.1 – DB Browser 中显示的 mailboxes 表\n\n如截图所示，每个帐户由一个通用唯一标识符（UUID）标识（在本例中为 4FD35256-CE13-47FE-9840-EBEB5B9FD9C1），而每个文件夹由一个唯一的\
    \ ROWID 标识。通过分析该表，检查人员可以大致了解设备上配置了多少个电子邮件帐户以及是哪些帐户。\n\n下一步涉及提取和分析存储在 `messages`\
    \ 表中的电子邮件元数据。需要注意的是，该表中存储的某些数据必须与其他记录相关联才能有意义；事实上，数据之间的关系不仅跨越表，还跨越 `Envelope Index`\
    \ 和 `Protected Index` 数据库。\n\n以下是从取证角度值得关注的列列表：\n\n- `external_id` 列表示包含实际电子邮件内容的\
    \ EML 文件的名称。\n- sender 列表示发件人的电子邮件地址；该值需要与 `Protected Index` 数据库中 Addresses 表存储的记录相关联。\n\
    - subject 列也需要与 `Protected Index` 中的 Subjects 表相关联。\n- summary 列与 Summaries 表相关联，存储电子邮件内容的前\
    \ 500 个字节。\n- `date_sent` 列存储电子邮件发送时的时间戳。\n- `mailbox` 列显示哪个帐户和文件夹包含该电子邮件。\n-\
    \ 如果电子邮件已被阅读，`read` 列的值为 1；如果未被阅读，则为 0。\n\n以下查询从表中提取所有相关元数据：\n\n```\nSELECT\n\
    DATETIME(messages.date_sent, 'UNIXEPOCH', 'localtime') AS\n\"DATE / TIME\",\n\
    messages.sender AS SENDER,\nmessages.subject AS SUBJECT,\nmessages.summary AS\
    \ SUMMARY,\nmessages.read AS READ,\nmailboxes.url AS MAILBOX,\nmessages.external_id\
    \ AS \"EML FILENAME\"\nFROM messages\n```\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_218_0.png)\n\
    \n图 8.3 – 按 ROWID 过滤的 addresses 表\n\n同样的逻辑也适用于 SUBJECT 和 SUMMARY 列。至此，您应该对如何提取电子邮件元数据有了大致的了解。在以下部分中，我们将学习如何分析电子邮件内容。\n\
    \n### 分析电子邮件内容\n\n识别特定电子邮件是一项简单的任务，因为 Apple Mail 将每封电子邮件存储为单独的文件。当我们之前提取电子邮件元数据时，我们了解到\
    \ messages 表为每封电子邮件存储了一条 external_id 记录，即 EML 文件的名称。这些文件存储在 `/private/var/mobile/Library/Mail/MAILBOX-UUID/`\
    \ 中。\n\nEML 文件可以在 macOS 系统上使用 Apple Mail 桌面应用程序打开，在 Windows 上使用 Microsoft Outlook\
    \ 打开。也可以在任何 Web 浏览器中查看电子邮件内容，只需将文件扩展名重命名为 .html 即可。\n\n要获取完整内容（包括电子邮件头），可以使用文本编辑器打开\
    \ EML 文件，或通过终端查看，如下面的截图所示：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_219_0.png)\n\
    \n图 8.4 – 通过终端查看的 EML 文件，显示电子邮件内容\n\n请记住，电子邮件的内容通常会被拆分到多个 EML 文件中；在这种情况下，必须将部分文件合并为一个文件才能查看完整的电子邮件。\n\
    \n既然我们已经学习了在哪里查找电子邮件工件以及如何分析它们，我们将在本章的下一部分重点关注消息取证。\n\n## 了解消息取证\n\n**短消息服务（SMS）**\
    \ 消息和**即时消息（IM）** 聊天应用程序（例如 **WhatsApp** 或 **Telegram**）可能包含非常重要的信息，有助于任何类型的调查。\n\
    \n- `/private/var/mobile/Library/Preferences/com.apple.madrid.plist` 属性列表包含一组与\
    \ SMS、iMessage 和 FaceTime 相关的属性和用户偏好设置。特别是，该 plist 在 allAliases 键下包含一个字典，指示连接到\
    \ iMessage 帐户的所有别名，例如电话号码和电子邮件地址。\n- `/private/var/mobile/Library/Preferences/com.apple.MobileSMS.plist`\
    \ 存储与 SMS 和 iMessage 相关的偏好设置，包括 KeepMessageForDays 键，该键指示保留期限。默认情况下，此值设置为“永久”。\n\
    - `/private/var/mobile/Library/SMS/Attachments/` 文件夹，顾名思义，包含通过 MMS 或 iMessage\
    \ 发送的附件，例如照片、视频和音频录音。\n- `/private/var/mobile/Library/SMS/Drafts/` 文件夹存储草稿消息和待发送消息（用户已发送但由于例如没有连接而导致\
    \ iOS 未发送的消息）。\n- `/private/var/mobile/Library/SMS/sms.db` 数据库存储所有消息（SMS 和 iMessage）的所有元数据和内容。\n\
    - 在**首次解锁前（BFU）** 接收到的消息存储在一个临时数据库中，该数据库位于 `/private/var/mobile/Library/SMS/sms-temp.db`。\n\
    \n我们将重点研究 sms.db 文件，学习如何从 message、chat_message_join、chat 和 attachment 表中提取所有消息及其元数据。以下\
    \ SQL 查询可以实现这一点：\n\n```\nSELECT\nCASE when LENGTH(chat_message_join.message_date)=18\
    \ THEN\n    datetime(chat_message_join.message_date/100000000 + 978307200,'unixepoch','localtime')\n\
    \    when LENGTH(chat_message_join.message_date)=9 THEN\n    datetime(chat_message_join.message_date\
    \ + 978307200,'unixepoch','localtime')\n    else 'NA'\n```\n\n"
