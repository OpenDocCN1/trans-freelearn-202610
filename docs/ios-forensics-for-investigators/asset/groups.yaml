    Figure 9.1 – The PhotoData folder contains media metadata


    Each media asset has two different kinds of metadata associated with it – **EXIF
    metadata**, which contains details such as the device that generated the image
    or the location, is stored within the file itself, while iOS-generated metadata
    is stored in the `Photos.sqlite` database.


    In the following section, we''ll analyze the database to learn how to extract
