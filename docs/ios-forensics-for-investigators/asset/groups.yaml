    在 Windows 上，您可以通过右键单击媒体文件并选择 **属性** 来查看文件的元数据。然后，单击 **详细信息** 选项卡并向下滚动以查看 EXIF
    数据。免费工具 exiftool 也可用于相同目的。它可以从 http://exiftool.org 下载，并且兼容 Windows 和 macOS。


    在 macOS 上，您只需使用 **预览** 打开文件即可查看 EXIF。打开后，单击 **工具** 并选择 **显示检查器**。然后，单击 **Exif**
    选项卡。


    在大多数 Linux 发行版中，可以使用 exif 命令行工具来实现此目的。


    到目前为止，您应该对 EXIF 元数据是什么、它如何有利于调查以及如何分析它有了一个大致的了解。


    ## 分析用户查看活动


    到目前为止，我们一直专注于分析照片和视频媒体资产；然而，调查人员可能不仅想了解设备上存储了哪些媒体，还想了解用户查看了哪些媒体。


    这可能包括以下任何内容：


    - 通过 Safari 或其他浏览器流式传输的音频/视频

    - 通过 Apple Music 或第三方应用（如 Spotify）播放的音乐

    - 通过第三方应用（如 YouTube 和 Netflix）播放的视频


    我们将在 *第 5 章*、*生活模式取证* 中讨论的 KnowledgeC.db 数据库跟踪用户日常活动的大部分内容，包括与音频或视频播放相关的事件。


    感兴趣的表是 ZOBJECT 表，它存储设备事件，并按 *流名称* 组织。每当 iOS 检测到用户启动了媒体播放时，就会触发一个 /media/nowPlaying
    事件。


    ## 第 10 章：分析第三方应用


    App Store 于 2008 年发布，允许用户在其 iOS 设备上下载第三方应用。截至 2021 年，可供下载的应用超过 450 万个。一旦应用在商店中可用，开发人员可以发布包含错误修复或新功能的更新，这些更新将自动安装在设备上。这从取证角度来看存在问题，因为许多取证工具无法跟上应用更新的速度，而有些应用根本不受支持。


    当需要对调查中的第三方应用程序进行分析时，检查员很可能不得不求助于手动研究、验证和分析工件，而这正是本章将要讨论的内容。


    我们将首先学习如何了解哪些应用已安装在设备上，它们位于何处，以及调查人员应在哪里查找任何工件。然后，我们将介绍动态应用程序分析并讨论可用于研究和验证目的的几种工具。最后，我们将深入研究一些最受欢迎的第三方应用，例如
    Facebook、Twitter、Instagram、YouTube 等。


    在本章中，我们将涵盖以下主题：


    - 介绍 iOS 应用程序

    - 动态应用程序分析

    - 实用第三方应用程序取证


    ### 介绍 iOS 应用程序


    图 10.1 – 数据容器的目录结构


    Documents 文件夹包含用户创建的工件，Library 文件夹由应用程序用于存储其数据、设置和首选项，tmp 文件夹存储任何临时文件，而 SystemData
    文件夹通常为空。


    如前一个屏幕截图所示，Applications 文件夹包含设备上安装的每个应用的子文件夹；然而，由于文件夹按应用程序的 GUID 命名，因此仅通过查看目录结构就无法了解哪个应用是哪个。


    在以下各节中，我们将学习如何将应用程序与其 GUID 相关联，以了解设备上安装了哪些应用。


    ### 识别已安装的应用


    位于 /private/var/mobile/Library/FrontBoard/ 的 applicationState.db 数据库跟踪设备上安装的任何应用程序的
    Bundle ID，包括已删除的应用程序。通过查询此数据库，检查员不仅可以了解设备上当前安装了哪些应用，还可以了解其工件的位置。


    数据库包含三个感兴趣的表：

    application_identifier_tab、key_tab 和 kvs。第一个表包含在某个时间点安装在设备上的应用程序列表，以其 Bundle ID
    也称为其应用程序标识符标识。


    以下屏幕截图显示了基于我们示例数据集的表内容：


    ![](img/0b17a17d4cb56b1c25763a396dd83117_250_0.png)


    图 10.2 – 来自 applicationState.db 的 application_identifier 表


    kvs 表包含两个感兴趣的列：application_identifier，它将记录映射到上一个表中的 Bundle ID，以及名为 value 的列，其中包含二进制
    BLOB。


    key_tab 表是描述 BLOB 内容的指南。深入研究此表超出了本节的范围，但请记住，key_tab 值为 1 表示相应的应用程序仍安装在设备上。


    基于此逻辑，以下 SQL 查询将提取设备上当前安装的所有应用程序的 Bundle ID：


    ```

    SELECT

    application_identifier_tab.[application_identifier],

    ```

    ```

    kvs.[value]

    FROM kvs, key_tab,application_identifier_tab

    WHERE key_tab.[id] = ''1''

    AND kvs.[key] = key_tab.[id]

    AND application_identifier_tab.[id] = kvs.

    [application_identifier]

    ORDER BY application_identifier_tab.[id];

    ```


    此查询的结果显示在以下屏幕截图中：


    ![](img/0b17a17d4cb56b1c25763a396dd83117_251_0.png)


    图 10.3 – 查询打印所有已安装应用程序的 bundle ID


    如您所见，查询打印了所有已安装应用的 Bundle ID，包括随设备预装的 Apple 开发的应用。


    value 列包含一个 BLOB，我们将在下一节中使用它来查找应用程序存储其数据的位置。


    ### 跟踪应用程序 GUID


    以下屏幕截图显示了通过十六进制查看器显示的二进制 BLOB：


    单元格中当前数据类型：二进制


    1061 字节


    图 10.5 – BLOB 包含二进制 PLIST


    通过查看数据，可以看出一些字符串，例如路径和位置。


    现在，让我们提取 BLOB 并查看生成的 PLIST。请参阅第 4 章，处理常见的 iOS 工件，以了解如何将 BPLIST 转换为基于 XML 的 PLIST。


    以下屏幕截图显示了将数据转换为 XML 然后进行 base-64 解码后的 PLIST：


    ![](img/0b17a17d4cb56b1c25763a396dd83117_254_0.png)


    图 10.6 – PLIST 包含与应用容器相关的详细信息


    如您所见，我们可以从 PLIST 中提取应用数据容器的路径。在我们的示例数据集中，如果我们找到 `/private/var/mobile/Containers/Data/Application/71B2EBD8-B6DF-4118-908C-7B2976A3019E`
    文件夹，我们将找到 Instagram 的工件。


    到目前为止，我们已经学习了如何识别安装在 iOS 设备上的应用以及数据存储在哪里。在以下各节中，我们将深入分析第三方应用程序。


    ### 动态应用程序分析


    第三方应用程序可能是证据工件的巨大来源，因为大多数应用程序都会收集、存储和处理大量用户数据。不幸的是，调查人员很可能不得不求助于手动分析这些应用程序，因为取证工具不可能支持每个应用的每次更新。即使工具
    *确实* 支持某个应用程序，仍应进行手动检查以验证工具的结果并确保所有数据都已正确解析。


    通常，在进行检查之前，检查员必须对感兴趣的应用程序进行一些研究，以了解它是如何工作的，它存储什么数据以及存储在哪里。这需要使用研究设备安装该应用并对其进行分析。


    在分析移动应用程序时，调查人员没有标准流程来检查数据，因为每个应用程序的执行方式都不同；在本章中，我们将学习一种可能的方法，称为 **动态分析**。


    一般来说，应用程序分析有两种方法：


    - **静态分析** 涉及深入查看应用程序的代码，以识别已知函数和 API 调用，从而有助于确定应用程序的确切工作原理。

    - **动态分析** 涉及在受控环境中运行应用程序并分析应用程序的行为以了解其如何


    '
