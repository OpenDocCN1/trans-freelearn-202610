    In this section, we briefly discussed third-party messaging applications and learned
    how and where these apps store conversation data. In the final part of this chapter,
    we''ll learn how to attempt the recovery of deleted messages.


    ### Recovering deleted messages


    One of the most common tasks in a mobile device investigation is to attempt the
    recovery of data that was deleted by the user, such as chats and messages, as
    these may contain invaluable evidence.


    In this chapter, we learned that SMS messages and chats from third-party applications
    are all stored in SQLite databases; this means that the ability to recover deleted
    chats effectively depends on the possibility of recovering any records from the
    SQLite database.


    In Chapter 4, Working with Common iOS Artifacts, we discussed several options
    for the recovery of deleted records, such as the following:


    - Parsing through the database using a hex viewer

    - String carving

    - Analyzing the Write Ahead Log (WAL) files

    - Using forensic tools such as FQLite to recover data from free blocks and unallocated
    space


    All of these solutions can be effective in recovering deleted messages, but only
    if the database was not vacuumed after the records were purged from the database.


    **Tip**


    It''s important to note that to attempt data recovery, the database should be
    extracted through a full filesystem acquisition and not a logical acquisition,
    as the latter will contain a vacuumed copy of the database, which is rebuilt from
    scratch during the backup process. Research has also shown that since iOS 11,
    the sms.db database is regularly vacuumed, so SMS messages and iMessages may be
    purged before the examiner has the possibility of acquiring the device.


    In the following section, we''ll introduce an open source tool that can be used
    to recover deleted messages.


    ### Detecting deleted messages using Mirf


    There are some occasions where recovering deleted messages is simply not possible;
    however, in such circumstances, it may still be possible to detect the fact that
    the user deleted a message, even if its content cannot be recovered.


    Chats and messages are stored in SQLite tables as individual records; each record
    is identified through a unique, progressive identifier called a **primary key**.
    For example, in the following screenshot, which contains an extract of data from
    the WhatsApp ChatStorage.sqlite database, individual messages are referenced using
    an identifier stored in the Z_PK column:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_227_0.png)


    Figure 8.6 – The Z_PK column stores a unique identifier for each message


    By analyzing the values in the Z_PK column, the examiner can look out for any
    missing records: in the previous example, the record associated with value 5 is
    missing. This is sufficient to state that a message has been deleted. Even if
    it is not possible to recover the actual message, it may be possible to deduce
    the timeframe of when the message was sent or received, by looking at the timestamps
    of the previous and next records. Thankfully, this process can be automated by
    using an open source Python script called **Missing Record Finder for SQLite Databases
    (Mirf)**, which can help detect if any rows of data were deleted by discovering
    gaps.


    ![](img/0b17a17d4cb56b1c25763a396dd83117_229_0.png)


    Figure 8.7 — Running Mirf to detect deleted messages


    In this case, one missing record is identified, including date ranges in the UTC
    time zone and the missing record number.


    ### Summary


    In this chapter, we learned all about how iOS stores emails and messages on the
    device and what artifacts an investigator can expect to find.


    First, we introduced the Apple Mail application and discovered where emails are
    stored. We analyzed the relevant SQLite databases to extract email metadata and
    learned how to parse through EML files to view the email''s body.


    Later in the chapter, we focused on messaging forensics by looking at how iOS
    stores SMS and iMessage data on the sms.db database and how a SQL query can be
    used to extract all messages and their metadata. Then, we introduced the topic
    of third-party messaging applications and focused on three of them: WhatsApp,
    Telegram, and Signal. We learned what data can be extracted from these apps and
    which are the most relevant SQL databases.


    Finally, in the last section of this chapter, we discussed different options to
    attempt the recovery of deleted messages, such as using an open source tool called
    Mirf, which can detect gaps between records in a SQL table.


    In the next chapter, we will learn all about photo, video, and music forensics.


    ## Chapter 9: Photo, Video, and Audio Forensics


    In the first few chapters of the book, we focused on the identification and analysis
    of mobile evidence stored in system-generated artifacts such as databases, PLISTs,
    and log files. However, any type of investigation will also typically involve
    analyzing user-generated content found on a device, such as media files.


    A modern iOS device can contain tens of thousands of media files, and each of
    these files is associated with unique metadata that can be critical to an investigation.
    In this chapter, we will learn how to identify and analyze multimedia content
    such as photos, videos, and audio files.


    We will start the chapter with an introduction to media forensics and discuss
    where photos, videos, and audio recordings are stored on an iOS device. Then,
    we''ll learn all about analyzing media metadata to gain meaningful insights, both
    from the file itself and from the corresponding databases. In the last part of
    the chapter, we will learn how to analyze user behavior to find out what media
    the user has accessed or watched through Apple apps such as Music and Safari,
    and third-party apps such as Spotify or Netflix.


    In this chapter, we will cover the following topics:


    - Introducing media forensics

    - Analyzing photos and videos

    - Introducing EXIF metadata

    - Analyzing user viewing activity


    ### Introducing media forensics

