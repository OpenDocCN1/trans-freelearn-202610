    # Checkm8


    The publication of the Checkm8 vulnerability in 2019 by the hacker @axi0mX, which
    is based on an unpatchable vulnerability present in the BootROM of millions of
    iOS devices, is arguably the biggest game changer ever in the forensics industry.


    Checkm8 is compatible with A5 to A11-based devices; this includes all devices
    starting from the iPhone 5s up to the iPhone X, as there is no working implementation
    for 4S hardware.


