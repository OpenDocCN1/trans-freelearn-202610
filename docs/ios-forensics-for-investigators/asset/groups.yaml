    我们首先来指出一些最常见的媒体相关工件存放位置：


    - `/private/var/mobile/Media/DCIM/1**APPLE/`：此文件夹存储由用户创建或保存到设备的照片和视频。通常，图像以 **JPG**、**PNG**
    或 **HEIC** 格式存储，视频则以 **MP4** 或 **MOV** 文件存储。

    - `/private/var/mobile/Media/PhotoData/`：PhotoData 文件夹存储与媒体元数据相关的若干工件，例如 `Photos.sqlite`
    数据库、**缩略图**（存储在 `/private/var/mobile/Media/PhotoData/Thumbnails/V2/DCIM/1**APPLE/IMG_****.JPG/****.JPG`）以及**相册**数据。通常，该文件夹会是设备上存储的任何媒体文件的主要证据来源。我们将在下一节深入分析此文件夹。

    - `/private/var/mobile/Media/PhotoData/PhotoCloudSharingData/`：PhotoCloudSharingData
    文件夹包含与“共享相簿”相关的工件，这是 iOS 的一项功能，允许用户轻松共享照片集。每个共享相簿都有一个子文件夹，其中包含 `Info.plist` 文件（包含相簿元数据，如名称、所有者等）和
    `DCIM_CLOUD.plist`（存储相簿中照片的数量）。

    - `/private/var/mobile/Media/Recordings/*`：此文件夹包含用户录制的**语音备忘录**。


    以下截图显示了 PhotoData 文件夹中可以找到的文件和文件夹：


    ![](img/0b17a17d4cb56b1c25763a396dd83117_234_0.png)


    图 9.1 – PhotoData 文件夹包含媒体元数据


    每个媒体资产都有两种相关的元数据——**EXIF 元数据**包含诸如生成图像的设备或位置等详细信息，存储在文件本身中；而 iOS 生成的元数据则存储在 `Photos.sqlite`
    数据库中。


    在下一节中，我们将分析该数据库，以了解如何为设备上存储的每张图像或视频提取有意义的信息。


    ## 分析照片和视频


    每当通过设备相机拍摄照片或视频，或将其保存到设备时，iOS 都会对其进行分析并生成大量元数据，这些元数据存储在 `Photos.sqlite` 数据库中。


    以下是该过程中发生的事件列表：


    1. 首先，新拍摄或保存的照片或视频以 JPG、HEIC、MP4 或 MOV 文件形式保存在 `/private/var/mobile/Media/DCIM/1**APPLE/`
    中。随着设备上存储的照片或视频增多，文件夹名称会向上迭代（100APPLE、101APPLE、102APPLE，依此类推）。

    2. 此外，还会创建 `PreviewWellImage.tiff` 图像并存储在 `/private/var/mobile/Media/PhotoData/MISC/`
    中。该图像是 **照片** 应用中显示的缩略图，用于展示最近的一张图像。

    3. 当新媒体被存储时，会在 Photos.sqlite 数据库的 ZGENERICASSET 表中创建一条新记录。从 iOS 14 开始，该表改名为 ZASSET。新记录将包含诸如内容保存时的日期和时间、上次编辑的日期和时间、文件名以及色彩空间等元数据。

    4. 在后台，iOS 开始通过运行若干算法（如人脸和物体识别）来处理新创建的媒体。如果 iOS 在媒体文件中识别到的人脸关联了姓名，该照片或视频还会显示在
    **照片** 应用中的 **人物** 相簿中。分析结果随后存储在 Photos.sqlite 数据库和 mediaanalysis.db 中，后者位于 `/private/var/mobile/Media/MediaAnalysis/`。


    如你所见，这其中涉及很多处理过程！既然我们已经知道了工件的位置，接下来将重点分析照片和视频。


    ## 理解 Photos.sqlite


    Photos.sqlite 数据库包含 60 多个数据表，数据量庞大，是 iOS 取证中发现的最大数据集之一。对该数据库的详细分析超出了本书的范围，因此我们将重点从
    ZGENERICASSET（iOS 14 和 15 中为 ZASSET）表中提取最重要的元数据片段。


    使用你选择的工具（例如 *DB Browser for SQLite*）打开文件后，运行以下查询：


    ```

    SELECT

    Z_PK,

    DATETIME(ZDATECREATED + 978307200, ''UNIXEPOCH'') AS "Created

    ```


