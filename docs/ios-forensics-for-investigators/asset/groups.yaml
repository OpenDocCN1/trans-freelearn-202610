    ## 第 1 章：介绍 iOS 取证


    在过去十年中，智能手机经历了一场深刻的革命，以各种可能的方式影响着我们的生活：我们的设备不再只是智能手机——它们已成为存储我们数字生活（以及非数字生活）各种信息的数据中心。


    如今，从手掌中，我们可以冲浪网页、购买戏票、让食物送到门口，或叫一辆 Uber。我们使用设备阅读电子书、做笔记、从事创造性任务，并通过社交媒体与粉丝分享我们的生活。我们逐渐用
    iPhone 相册取代了数码相机。智能手机可以跟踪身体活动、与外部设备交互、为我们提供导航，并提醒我们可能忘记的重要会议。我们使用生产力应用来完成工作，并使用
    Apple Pay 进行支付。当然——我们使用 iPhone 与世界另一端的人取得联系。随着 iPad 和平板电脑的广泛普及，我们的设备不再只是通信设备。它们已成为一个几乎无限的内容平台，我们可以在其中享受电影、电视剧，或
    simply 听我们最喜欢的音乐。


    为了能够提供这些令人惊叹的功能，移动设备收集了大量数据，这些数据由 iOS 处理，有时还会同步到 iCloud。这些信息比任何台式电脑上存储的数据更充分地记录并揭示了用户的想法和活动。


    移动取证就是收集这些数据、保存它、评估它、验证它，并提取可以作为证据呈现的有意义见解的全部过程。


    在本章中，我们将涵盖以下主题：


    - 理解移动取证

    - 剖析 iOS 操作系统

    - 理解 iOS 安全

    - 建立工作流程


    ## 理解移动取证


    由于 Apple 设备提供的用户体验、精美的设计和革命性功能而在全球流行，因此 2016 年 Apple 宣布已售出超过十亿部 iPhone 并不令人意外。在过去
    5 年中，移动设备的使用量增长尤其迅速，2021 年的数据显示，活跃的 iOS 设备数量达到十亿部。


    存储在智能手机上的信息可以帮助调查解决关键问题，揭示个人与谁联系过、在哪里以及他们用设备做了什么。随着新功能被添加到设备中，并且 App Store 上有更多应用可用，存储在
    iOS 设备上的信息量持续增长。


    移动取证可以定义为在法证可靠的条件下使用经过验证的手段从移动设备恢复数字证据的过程。


    我们能从设备上恢复的证据类型取决于设备本身以及用于数据提取的技术，但通常，智能手机包含个人信息，例如通话记录、消息、电子邮件、照片、视频、备忘录、密码、位置数据和传感器数据。没有其他计算设备像手机一样个人化。


    通常，检查过程应揭示所有数字证据，包括可能被隐藏、模糊或删除的痕迹。证据是通过应用既定的科学方法获得的，应充分描述数据的内容和状态，包括其位置、潜在意义以及不同数据源之间的关系。取证过程始于从移动设备提取证据的副本。一旦副本可用，下一步涉及分析数据、识别证据并制定最终报告的内容。


    ## iOS 取证的新黄金时代


    在过去 3 年中，数字取证行业经历了一场重大革命。


    2019 年，针对 iOS 设备的 **checkm8** 漏洞的发现是一个彻底的游戏规则改变者，因为它为数字取证调查员打开了新的大门，允许对数以亿计的 Apple
    设备进行完整文件系统提取。如果你从未见过完整文件系统提取，你可能会对设备存储的数据的范围和种类感到惊讶！


    Checkm8 基于一个无法修补的硬件缺陷，该缺陷直接存在于 iOS 设备的芯片上，从运行 Apple A11 芯片的设备一直到 A5 世代。这包括从 iPhone
    4S 到 iPhone X 以及多款 iPad。


    此漏洞具体是一个 BootROM 漏洞，这意味着它利用了 iOS 设备在启动过程中加载的初始代码中的安全缺陷，并且无法通过 Apple 的软件更新覆盖或修补。


    在 2019 年底，**checkra1n** 发布了，这是基于 checkm8 漏洞的第一个公开、闭源越狱。数字调查员和取证分析师已迅速采用 checkra1n
    来访问设备的文件系统和钥匙串；然而，与所有越狱一样，此解决方案有几个缺点，因为使用越狱不可避免地会修改设备文件系统上的某些数据，并且不被认为在法证上是可靠的。


    出于这些原因，Cellebrite、Elcomsoft 和 Oxygen Forensic 等厂商已开发出基于原始 checkm8 漏洞的专有解决方案，这些解决方案通过修补设备的
    RAM 来工作。这些工具允许调查员在不触及系统和用户分区以及不对设备进行任何更改的情况下执行完整文件系统提取，因为漏洞在内存中运行。


    换句话说，在选定的设备上，可以利用 checkm8 漏洞提取完整文件系统，而无需实际越狱设备。下表显示了容易受到 checkm8 漏洞攻击的设备列表：


    | iPhone 4S | iPhone 5/5c/5s | iPhone 6/6s | iPhone SE |

    |---|---|---|---|

    | iPhone 7 | iPhone 8 | iPhone X | iPad 2nd–7th gen |

    | iPad Mini 2nd and 3rd | iPad Air 1st and 2nd | iPad Pro | Apple Watch 1st–3rd
    |


    表 1.1 – 容易受到 checkm8 漏洞攻击的设备


    要利用 checkm8 进行文件系统提取，你的设备必须兼容，并且必须运行受支持的 iOS 版本。这是一个主要缺点，因为较新的设备，例如最新的 iPhone
    13，并不受支持。然而，还有其他选择。


    在 2020 年，Elcomsoft 和 Belkasoft 等厂商引入了基于代理的提取，这是一种新的采集方法，允许在不越狱设备的情况下进行完整文件系统提取。安装在设备上后，代理通过软件漏洞逃离沙箱，获得对设备的无限制访问，并建立设备与计算机之间的连接。基于代理的提取在法证上是安全的，通常比大多数越狱更快更安全。截至撰写本文时，受支持的设备包括从
    5S 到 iPhone 12 的所有 iPhone，运行 iOS 9.0 到 14.3 版本。


    在 2020 年 5 月，**unc0ver** 越狱发布了重大更新，增加了对基于 A12-A13 芯片的设备的支持。截至撰写本文时，unc0ver 支持从
    iPhone 5s 到 iPhone 12 的所有设备越狱。支持的 iOS 版本范围从 iOS 11 到 iOS 14.3。


    尽管越狱设备允许完整文件系统提取，但它不被认为是一个法证可靠的过程。如果受支持，调查员应首先考虑更安全的选项，例如 checkm8 或基于代理的提取。


    提示


    需要注意 checkm8 基于的提取与通过 checkra1n 或 unc0ver 越狱设备之间的区别。诸如 **Cellebrite UFED** 和 **Elcomsoft
    iOS Forensics Toolkit** 之类的工具利用 checkm8 漏洞通过在设备 RAM 中运行漏洞来临时提供对整个文件系统的访问。提取完成后，设备将正常重启。不会对设备进行永久更改。


    另一方面，越狱设备会留下永久痕迹，并且还需要安装 Cydia 或 AFC2 等第三方软件包，从而对设备进行额外更改。


    ## iOS 取证中的挑战


    智能手机被视为实时、动态系统，因此从取证角度来看，它们带来了几个挑战，因为数据和文件 constantly 变化。


    数字调查员可能面临的主要复杂性之一是处理锁定设备：最近的 iOS 更新使密码破解几乎不可能，其他选项必须被考虑以尽可能多地提取数据。


    设备数量的增长以及它们运行的软件的多样性使得开发单一工具和一致的工作流程来应对所有情况变得极其困难。这通常是因为用于从一台设备提取数据的方法在发布新版本的
    iOS 时会停止工作；事实上，取证提取工具通常依赖于安全漏洞来访问设备的文件系统并提取比 iTunes 备份中通常找到的更多数据，甚至在密码未知时解锁设备。当


