    Analyzing the networking data that''s provided by an iOS device can give the investigator
    a precise idea of what services and applications are consuming bandwidth, and
    which networks the device is connected to.


    We''ll introduce the topic by learning how to extract some basic networking-related
    data from a full filesystem.


    # Airplane mode


    To detect if the device was placed in airplane mode or not, you can examine the
    com.apple.radios.plist file, which is located at /private/var/preferences/SystemConfiguration/.
    The PLIST contains an AirplaneMode key with a value of true or false.


    # Wi-Fi MAC address


    The MAC address of the wireless network interface within the device can be found
    by analyzing the NetworkInterfaces.plist file, which is located at /private/var/preferences/SystemConfiguration/.
    The IOMACAddress key indicates the desired value. Note that each iOS device has
    more than one networking interface and that each of those has a unique MAC address.


    # Known Wi-Fi networks


    A list of known wireless networks is stored in the /private/var/preferences/SystemConfiguration/com.apple.wifi.plist
    file. This PLIST contains a key list of known networks, which is also an array
    of items:


    +   - The SSID_STR key contains a user-readable SSID string that identifies the
    network.

    +   - The BSSID key indicates the MAC address of the access point.'
