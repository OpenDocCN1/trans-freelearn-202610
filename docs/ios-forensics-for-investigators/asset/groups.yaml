    \ state?\n- What's the device's hardware model?\n- Is the device vulnerable to\
    \ Checkm8?\n- What iOS version is the device running?\n- Has the device ever been\
    \ paired to a desktop or laptop computer?\n\nBy answering these questions, the\
    \ examiner will be able to assess what the best course of action might be to gain\
    \ access to the locked device. Before we go further, it's important to understand\
    \ the differences between the BFU and AFU states:\n\n- **BFU**: Devices in a BFU\
    \ state are those that have been powered off or rebooted and have not been unlocked,\
    \ not even once, since the device was powered on.\n- **AFU**: When a device is\
    \ powered on and the correct passcode is entered, the device ends up in AFU mode.\n\
    \nThe point here is that when a device is found in an AFU state, a lot more data\
    \ can be extracted and analyzed, as some encryption keys are actually retained\
    \ in memory.\n\nOnce the device has been successfully identified, the following\
    \ options should be considered:\n\n- Locating and using **lockdown pairing records**\n\
    - Passcode cracking\n- Performing a **BFU acquisition**\n- Sending the device\
    \ to third-party labs or premium services, such as **Cellebrite Advanced Services**\
    \ or **Grayshift's GrayKey**\n- Locating and analyzing **iTunes backups**\n- Downloading\
    \ and analyzing **iCloud backups**\n- Downloading and analyzing iCloud synced\
    \ data\n\nIn the following sections of this chapter, we'll discuss the pros and\
    \ cons of each of these options, starting with using lockdown pairing records.\n\
    \n### Using lockdown pairing records to access the device\n\n**Lockdown records**,\
    \ also called **pairing records**, are essentially files stored on a host computer\
    \ that contain cryptographic keys that are used to allow iOS devices to communicate\
    \ with paired computers.\n\nThe first time an iOS device is connected to a PC\
    \ or macOS computer that has iTunes installed, the user will be prompted to *trust*\
    \ the device by entering the device's passcode. This will create a lockdown record\
    \ on the host, which means that the user will not have to unlock the device every\
    \ time it is connected to the computer.\n\nIf the investigator has physical and\
    \ legal access to a host computer that was paired with the device, the lockdown\
    \ file can be used to access the locked device and successfully perform a logical\
    \ acquisition.\n\nThere are, however, some caveats. First of all, accessing a\
    \ locked device using a pairing record will only work if the device is in an **AFU\
    \ state**; secondarily, lockdown records **expire** after some time. Although\
    \ there is no definite answer as to when exactly these records expire, research\
    \ that has been carried out seems to suggest that lockdown records expire anytime\
    \ between 7 and 30 days after they were created.\n\nOn Windows machines, lockdown\
    \ records are typically stored in `%ProgramData%\\Apple\\Lockdown\\`.\n\nOn macOS\
    \ computers, they can be found in `/var/db/lockdown/`.\n\nOnce the investigator\
    \ has located the lockdown record, a logical acquisition can be performed using\
