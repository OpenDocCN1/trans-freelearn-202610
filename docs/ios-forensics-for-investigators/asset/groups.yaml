    # Chapter 1: Introducing iOS Forensics


    Over the past decade, smartphones have undergone a profound revolution, impacting
    our lives in all possible ways: our devices are no longer just smart phones –
    they have become data hubs that store all kinds of information from our digital
    (and not so digital) life.


    Today, from the palm of our hand, we can surf the web, buy theater tickets, get
    food delivered to our door, or call an Uber. We''re using our devices to read
    eBooks, take notes, engage in creative tasks, and share our lives with our followers
    through social media. We have progressively replaced our digital cameras with
    our iPhone camera roll. Smartphones can keep track of physical activity, interact
    with external devices, give us directions, and remind us of that important meeting
    that we might forget. We use productivity apps to get stuff done and we make payments
    using Apple Pay. And – of course – we use our iPhones to get in touch with people
    on the other side of the world. With the massive spread of iPads and tablets in
    general, our devices are no longer just communication devices. They have become
    an almost unlimited content platform where we can enjoy movies, TV series, or
    simply listen to our favorite music.


    To be able to provide these amazing features, mobile devices collect huge amounts
    of data that is processed by iOS and sometimes synced to iCloud. This information
    documents and reveals the thoughts and activity of a user substantially more than
    any data stored in any desktop computer.


    Mobile forensics is all about collecting this data, preserving it, assessing it,
    validating it, and extracting meaningful insights that can be presented as evidence.


    In this chapter, we will cover the following topics:


    +   Understanding mobile forensics'
