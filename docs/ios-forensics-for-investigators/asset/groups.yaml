    # Analyzing photos and videos


    Every time a photo or video is taken through a device''s camera or saved onto
    a device, iOS analyzes it and generates a multitude of metadata, which is stored
    in the `Photos.sqlite` database.


    The following is a list of events that occur during the process:


    +   1. First, the newly created photo or video is saved in `/private/var/mobile/Media/DCIM/1**APPLE/`
    as a JPG, HEIC, MP4, or MOV file. The folder name will iterate upward (100APPLE,'
  - '[PAGE 235]


    101APPLE, 102APPLE, and so on) as more photos or videos are stored on the device.


    +   2. Additionally, the PreviewWellImage.tiff image is created and stored in
    /private/var/mobile/Media/PhotoData/MISC/. This image is the thumbnail that is
    displayed in the **Photos** app where the most recent image is displayed.

    +   3. As the new media is stored, a new entry is created in the Photos.sqlite
    database, in the ZGENERICASSET table. Since iOS 14, this table is now called ZASSET.
    The new record will contain metadata such as the date and time when the content
    was saved, the date and time of when it was last edited, the filename, and the
    color space.

    +   4. In the background, iOS starts processing the newly created media by running
    several algorithms, such as facial and object recognition. If a name has been
    associated with a face that iOS recognizes in the media file, the photo or video
    will also be displayed in the **People** album, in the **Photos** app. The results
    of the analysis are then stored in the Photos.sqlite database and in mediaanalysis.db,
    which can be found in /private/var/mobile/Media/MediaAnalysis/.


    As you can see, there''s a lot going on! Now that we know where the artifacts
    are located, we will focus on analyzing photos and videos.


    # Understanding Photos.sqlite


    With over 60 tables packed full of data, the Photos.sqlite database is one of
    the largest datasets that can be found in an iOS acquisition. A detailed analysis
    of this database is beyond the scope of this book, so we''ll focus on extracting
    the most important pieces of metadata from the ZGENERICASSET (ZASSET in iOS 14
    and 15) table.


    Once you''ve opened the file with your tool of choice, such as *DB Browser for
    SQLite*, run the following query:


    ```

    SELECT

    Z_PK,

    DATETIME(ZDATECREATED + 978307200, ''UNIXEPOCH'') AS "Created

    ```'
