  - '[PAGE 214]


    # Introducing email forensics


    In the first part of this chapter, we will introduce email forensics and we will
    focus on the **Apple Mail** application. It''s safe to say that Apple Mail is
    certainly the most popular email client on iOS devices; however, investigators
    should keep in mind that there are many more third-party email apps available,
    such as **Outlook**, **Spark**, **Gmail**, and **Airmail**. Analyzing third-party
    apps is covered in *Chapter 10, Analyzing Third-Party Apps*. A comprehensive forensic
    analysis of email artifacts should entail analyzing Apple Mail and any third-party
    clients that have been installed on the device.


    The first step in investigating Apple Mail data is locating the artifacts: these
    can be found in the folder located at `/private/var/mobile/Library/Mail`. Please
    note that a full filesystem extraction is required. The following is a list of
    the most relevant files and their description:


    +   - For each email account configured on the device, there will be a corresponding
    folder within the `Mail` folder; the folder''s name refers to the account''s unique
    identifier. Each of these contains additional subfolders, such as `Inbox`, `Sent`,
    `Spam`, and `Drafts`, which contain the actual emails, stored as **Electronic
    Mail (EML)** files.

    +   - The `Envelope Index` file is a SQLite database that contains a number of
    tables that store **metadata** related to each email account that was configured
    on the device.

    +   - The `Protected Index` database contains the actual data related to emails,
    such as a **summary** of the email''s body, **subjects**, and **addresses**.

    +   - `MailboxCollections.plist` stores user preferences related to every account.

    +   - The `metadata.plist` file stores a timestamp of when each mailbox was last
    synced to the device.'
  - '[PAGE 215]


    Now that we know where email artifacts are located, we''re going to jump right
    into these SQLite databases to parse through email metadata and its content.


    # Extracting email metadata


    We''re going to start by examining the Envelope Index database. The first table
    of interest is mailboxes. As the name suggests, this table stores a list of all
    mailboxes configured on the device. This includes different folders for a single
    account, such as Important, Spam, Drafts, and Trash.


    The following screenshot shows some sample data from the mailboxes table:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_215_0.png)


    Figure 8.1 – The mailboxes table displayed in DB Browser


    As you can see from the screenshot, each account is identified by a Universally
    Unique Identifier (UUID) (in this example, 4FD35256-CE13-47FE-9840-EBEB5B9FD9C1)
    while each folder is identified by a unique ROWID. By analyzing this table, the
    examiner can gain a rough idea of how many, and which, email accounts are configured
    on the device.'
  - '[PAGE 216]


    The next step involves extracting and analyzing email metadata, which is stored
    in the `messages` table. It''s important to note that some of the data stored
    in this table will have to be correlated to other records to make sense; in fact,
    the relationships between data span not only between tables but also between the
    `Envelope Index` and `Protected Index` databases.


    The following is a list of columns of interest from a forensic viewpoint:


    +   - The `external_id` column indicates the name of the EML file that contains
    the actual email content.

    +   - The sender column indicates the email address of the sender; this value
    needs to be correlated to the records stored in the Addresses table, in the `Protected
    Index` database.

    +   - The subject column also needs to be correlated to the Subjects table in
    `Protected Index`.

    +   - The summary column, which is correlated to the Summaries table, stores the
    first 500 bytes of the email''s content.

    +   - The `date_sent` column stores a timestamp of when the email was sent.

    +   - The `mailbox` column shows which account and folder contain the email.

    +   - The `read` column will have a value of 1 if the email was read, or 0 if
    it was not.


    The following query extracts all relevant metadata from the table:


    ```

    SELECT

    DATETIME(messages.date_sent, ''UNIXEPOCH'', ''localtime'') AS

    "DATE / TIME",

    messages.sender AS SENDER,

    messages.subject AS SUBJECT,

    messages.summary AS SUMMARY,

    messages.read AS READ,

    mailboxes.url AS MAILBOX,

    messages.external_id AS "EML FILENAME"

    FROM messages

    ```'
  - '[PAGE 217]


    <!-- no content -->'
  - '[PAGE 218]


    ![](img/0b17a17d4cb56b1c25763a396dd83117_218_0.png)


    Figure 8.3 – The addresses table filtered by ROWID


    The same logic applies to the SUBJECT and SUMMARY columns. By now, you should
    have a general understanding of how to extract email metadata. In the following
    section, we''ll learn how to analyze email content.


    # Analyzing email content


    Identifying a specific email is a straightforward task as Apple Mail stores every
    email as a separate file. When we previously extracted email metadata, we learned
    that the messages table stores an external_id record for each email, which is
    the name of an EML file. These files are stored in /private/var/mobile/Library/Mail/MAILBOX-UUID/.


    EML files can be opened on a macOS system using the Apple Mail desktop application,
    and on Windows using Microsoft Outlook. It''s also possible to view the email
    content in any web browser, by renaming the file extension as .html.


    To get the full content, including the email''s headers, the EML file can be opened
    using a text editor or it can be viewed through the terminal, as shown in the
    following screenshot:'
  - '[PAGE 219]


    ![](img/0b17a17d4cb56b1c25763a396dd83117_219_0.png)


    Figure 8.4 – An EML file viewed through the terminal showing the email''s content


    Keep in mind that the content of an email is often split up between multiple EML
    files; in such cases, the partial files must be merged into a single file in order
    to view the entire email.


    Now that we have learned where to look for email artifacts and how to analyze
    them, we will focus on messaging forensics in the next part of the chapter.


    # # Understanding messaging forensics


    **Short Message Service (SMS)** messages and **Instant Messaging (IM)** chat applications,
    such as **WhatsApp** or **Telegram**, may contain very important information that
    can aid any kind of investigation.'
