    # Passcode cracking


    In the past, there were several methods for attempting to crack a device''s passcode,
    such as *black boxes* that could be connected to the device that would brute force
    every possible combination. Unfortunately, these methods only support legacy devices.


    With the iPhone 5s, Apple introduced the **Secure Enclave**, which effectively
    slows down passcode attempts, rendering brute force attacks impossible.


    There are still some software tools that can be used for the purpose, such as
