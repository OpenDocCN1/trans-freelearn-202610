    +   - Other Bluetooth paired devices (*not just low-energy*), which are stored
    in the `/private/var/containers/Shared/SystemGroup/<GUID>/Library/Preferences/com.apple.MobileBluetooth.devices.plist`
    file. This property list maintains a list of device names and last-detection times.

    +   - A list of *seen* Bluetooth devices, which are other available Bluetooth-enabled
    devices that were close to the device but that did not connect. These devices
    can be found in the `/private/var/containers/Shared/SystemGroup/<GUID>/Library/Database/com.apple.MobileBluetooth.ledevices.other.db`
    database, under the `OtherDevices` table.

    +   - A detailed log of Bluetooth-related events, such as **connection** and **disconnection**
    events. These are stored in the `knowledgeC.db` database.


    As the first three files are trivial to query, we''ll concentrate on extracting
    Bluetooth events from the `/private/var/mobile/Library/CoreDuet/Knowledge/knowledgeC.db`
    database, which we introduced in *Chapter 5, Pattern-of-Life Forensics.*


    First, we must select the start and end dates for the events from the `ZOBJECT`
    table. Then, we must filter down the results by searching for the `/bluetooth/isConnected`
    stream. We must extract the event status and device details from the `ZSTRUCTUREDMETADATA`
    table. Finally, we must order the results chronologically.


