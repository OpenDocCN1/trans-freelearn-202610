    # Tip


    The `CallHistory.storedata` database was introduced in iOS 8. Previously, the
    call log was located in the `call_history.db` file. Also, keep in mind that the
    call history will only be available in an **After First Unlock (AFU)** state.
    Before the first unlock, the data is stored in a temporary file, called `CallHistoryTemp.storedata`.


    The most important data, from a forensic perspective, is stored in the ZCALLRECORD
    table, where you will find the following columns:


    +   - The ZDATE column contains the timestamp of when the call occurred, in Mac
    Absolute Time format.

    +   - ZADDRESS indicates the phone number that was called or where the call originated
    from if it was an incoming call.

    +   - The ZLOCATION column stores the location, which is calculated from the phone
    number.

    +   - The ZDURATION column indicates the call duration, in seconds.

    +   - The ZORIGINATED column indicates whether the call was incoming (0) or outgoing
    (1).

    +   - The ZANSWERED column indicates whether an incoming call was answered (1)
    or not (0).

    +   - The ZSERVICE_PROVIDER column shows the name of the service that generated
    the call. Typically, this will show `com.apple.Telephony` for traditional calls
    or `com.apple.FaceTime` for FaceTime calls.


    The following SQL query will extract meaningful data from the ZCALLRECORD table:


    ```

    SELECT

    DATETIME(ZDATE + 978307200, ''unixepoch'', ''localtime'') AS "Date/Time",

    ZADDRESS AS "Phone Number",

    ZLOCATION AS "Location",

    ZDURATION AS "Call in Seconds",

    ```'
