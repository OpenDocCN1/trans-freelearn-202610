  md: "\nOnce the investigator has acquired a list of geocoordinates, these can be\
    \ used with a map provider to obtain visual feedback of the device's whereabouts.\n\
    \n![](img/0b17a17d4cb56b1c25763a396dd83117_176_0.png)\n\nFigure 6.5 – The query\
    \ results are mapped out to determine the user's journey\n\nIt should be noted\
    \ that different databases store different types of location data that can be\
    \ more or less accurate. From research that has been conducted, this data, which\
    \ is known as **routined location data**, has proven to be highly accurate.\n\n\
    ## Understanding Significant Locations\n\nWith the release of iOS 8, Apple introduced\
    \ a feature known as **Frequent Locations**, which was renamed to **Significant\
    \ Locations** starting from iOS 10. Essentially, every time a device visits a\
    \ location, a record is stored in a SQLite database with details from the device's\
    \ journey. When the device has returned to the same location enough times, that\
    \ becomes a *significant location*.\n\nAs of today, it is still unclear how the\
    \ algorithm that Apple uses works and how many visits to a specific location are\
    \ required for it to be considered significant. In terms of area, research has\
    \ found that whenever a device is within a 250 m radius of a significant location,\
    \ a visit to that location is logged.\n\nIf location services are enabled, Significant\
    \ Locations can be viewed directly from the device by going to **Settings | Privacy\
    \ | Location Services | System Services | Significant Locations.**\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_177_0.png)\n\
    \nFigure 6.6 – Significant Locations can be viewed directly on the device\n\n\
    Please keep in mind that since iOS 15, viewing Significant Locations on the device\
    \ only shows a summary of these locations. The complete data will be available\
    \ only from a full filesystem extraction.\n\nFrom a forensics point of view, frequent\
    \ location data is invaluable, as it allows an investigator to understand what\
    \ locations a user visited often. Also, data pertaining to significant locations\
    \ typically goes way back in time.\n\nTo view this data, we're going to run the\
    \ following query on the Local.sqlite database:\n\n```sql\nSELECT\nDATETIME(ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZENTRYDATE\
    \ + 978307200, 'UNIXEPOCH') AS \"ENTRY\",\nDATETIME(ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZEXITDATE\
    \ + 978307200, 'UNIXEPOCH') AS \"EXIT\",\n(ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZEXITDATE-ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZENTRYDATE)/60.00\
    \ AS \"DURATION (MINUTES)\",\nZRTLEARNEDLOCATIONOFINTERESTMO.ZLOCATIONLATITUDE\
    \ AS \"LATITUDE\",\nZRTLEARNEDLOCATIONOFINTERESTMO.ZLOCATIONLONGITUDE AS \"LONGITUDE\"\
    ,\nZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZLOCATIONUNCERTAINTY AS \"LOCATION UNCERTAINTY\"\
    ,\nZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZDATAPOINTCOUNT AS \"DATA POINTS\"\nFROM\n\
    ZRTLEARNEDLOCATIONOFINTERESTVISITMO\nLEFT JOIN\nZRTLEARNEDLOCATIONOFINTERESTMO\n\
    ON ZRTLEARNEDLOCATIONOFINTERESTMO.Z_PK = ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZLOCATIONOFINTEREST;\n\
    ```\n\nAlthough this query may seem complicated, it's actually a lot easier if\
    \ we break it down into logical steps: first, we use the datetime SQL command\
    \ to convert the timestamps into readable strings. The Entry field refers to when\
    \ the device visited the significant location, and the Exit field indicates when\
    \ the device left the location. Then, we calculate the duration (Duration) of\
    \ the visit and print Latitude, Longitude, and Uncertainty. Finally, we print\
    \ the number of data points (Data Points) for that visit to that particular location.\n\
    \nThe following figure shows the results of the query:\n\n| # | DATE | MAC ADDRESS\
    \ | CHANNEL | RSSI |\n|---|---|---|---|---|\n| 1 | 2020-04-12 12:46:19 | f8:bb:bf:1e:fa:ea\
    \ | 161 | -57 |\n| 2 | 2020-04-12 12:46:19 | f8:bb:bf:1e:fa:e4 | 161 | -57 |\n\
    | 3 | 2020-04-12 12:46:20 | 80:da:13:72:52:64 | 149 | -90 |\n| 4 | 2020-04-12\
    \ 12:46:20 | f8:bb:bf:1e:fa:eb | 48 | -51 |\n| 5 | 2020-04-12 12:46:20 | 58:ef:68:25:35:34\
    \ | 48 | -90 |\n| 6 | 2020-04-12 12:46:20 | d8:d7:75:b6:28:9 | 48 | -89 |\n| 7\
    \ | 2020-04-12 12:46:20 | 80:da:13:72:52:6a | 149 | -89 |\n| 8 | 2020-04-12 12:46:20\
    \ | f8:bb:bf:8d:b9:c2 | 48 | -78 |\n| 9 | 2020-04-12 12:46:20 | f8:bb:bf:90:a8:f2\
    \ | 48 | -70 |\n| 10 | 2020-04-12 12:46:20 | b8:66:85:53:d3:7 | 44 | -85 |\n|\
    \ 11 | 2020-04-12 12:46:20 | 7c:db:98:c2:30:34 | 40 | -89 |\n| 12 | 2020-04-12\
    \ 12:46:20 | f8:bb:bf:1e:fa:e8 | 48 | -50 |\n\nFigure 6.8 – The results show details\
    \ about wireless devices that were scanned by the device\n\nAlthough this table\
    \ does not store geocoordinates such as latitude and longitude, it still provides\
    \ the investigator with details as to when and which wireless signals were captured\
    \ by the device. By correlating this data to external data sources (such as a\
    \ list of known network devices and their MAC addresses), it is possible to place\
    \ the device at a certain location at a certain point in time.\n\n## Understanding\
    \ Harvested Locations\n\nAt the start of the chapter, we introduced the A-GPS\
    \ technology and learned how Apple maintains a peer-based map of locations that\
    \ are downloaded back onto the device when geolocalization is requested from Location\
    \ Services. This data comprises thousands of records related to cell towers and\
    \ Wi-Fi networks that are located in close proximity to the device, along with\
    \ their geographic coordinates. The device can use this data to resolve a radio\
    \ signal into a physical location without needing a GPS signal.\n\nThe data downloaded\
    \ onto the device from Apple is called **Harvested Locations** data and it can\
    \ be found in the `cache_encryptedB.db` database.\n\nHere, we can find several\
    \ tables of interest:\n\n- Cell tower data can be found in the following tables:\n\
    \  - `CdmaCellLocation`, `CellLocation`, and `LteCellLocation`.\n- Wi-Fi device\
    \ data is stored in the `wifiLocation` table.\n\n### Routined Locations versus\
    \ Harvested Locations\n\nBefore we begin analyzing this data, it's important to\
    \ understand the difference between locations that the device visited and locations\
    \ provided by Apple: the data we looked at previously, also known as routined\
    \ location data, is typically very accurate as it comes from the device's GPS\
    \ and can show in detail where the device was located. Harvested Locations data,\
    \ on the other hand, consists of locations provided by Apple as a way to augment\
    \ the device's knowledge about the area. This data is not retrieved from the built-in\
    \ GPS receiver, but rather represents cell towers and wireless devices that are\
    \ located in close proximity to the device.\n\n### Analyzing harvested cell tower\
    \ data\n\nCell tower data is stored in the `cache_encryptedB.db` database and\
    \ is retained for about a week. The following is a list of the most relevant columns:\n\
    \n- MCC, or **Mobile Country Code**, indicates the country code of the cell tower.\n\
    - MNC, or **Mobile Network Code**, identifies the mobile operator.\n- CI, or **Cell\
    \ ID**, is a unique number used to represent each transceiver station of a cell\
    \ tower.\n- The `HorizontalAccuracy` value indicates how precise the device believes\
    \ the coordinates are and is expressed in meters.\n- The `Latitude` and `Longitude`\
    \ columns store the geocoordinates.\n\nWe can extract all cell-related data by\
    \ running a SQL query, such as the one shown in the following code block. On the\
    \ device used for research, cell data was stored in the LTECELLLOCATION table;\
    \ however, this is dependent on the device model and iOS version:\n\n```sql\n\
    SELECT\n    DATETIME(TIMESTAMP + 978307200, 'UNIXEPOCH') AS \"TIMESTAMP\",\n \
    \   MCC AS \"MCC\",\n    MNC AS \"MNC\",\n    CI AS \"CI\",\n    HORIZONTALACCURACY\
    \ AS \"HORIZONTAL ACCURACY\",\n    LATITUDE AS \"LATITUDE\",\n    LONGITUDE AS\
    \ \"LONGITUDE\"\nFROM LTECELLLOCATION;\n```\n\nThe results of the query are shown\
    \ in the following figure:\n\n| # | TIMESTAMP | MCC | MNC | CI | HORIZONTAL ACCURACY\
    \ | LATITUDE | LONGITUDE |\n|---|---|---|---|---|---|---|---|\n| 1 | 2020-12-12\
    \ 22:25:08 | 310 | 260 | 18005506 | 2142.0 | 35.6559143 | -78.87465667 |\n| 2\
    \ | 2020-12-12 22:25:08 | 310 | 260 | 256947784 | 1414.0 | 35.62225341 | -78.87554168\
    \ |\n| 3 | 2020-12-12 22:25:08 | 310 | 260 | 256769850 | 1414.0 | 35.66263961\
    \ | -78.87255859 |\n| 4 | 2020-12-12 22:25:08 | 311 | 480 | 39694094 | 2977.0\
    \ | 35.62737655 | -78.84117126 |\n| 5 | 2020-12-12 22:25:08 | 311 | 480 | 39694096\
    \ | 1414.0 | 35.62499618 | -78.84272003 |\n| 6 | 2020-12-12 22:25:08 | 310 | 410\
    \ | 196794049 | 2094.0 | 35.66758346 | -78.87165069 |\n| 7 | 2020-12-12 22:25:08\
    \ | 310 | 410 | 195403799 | 1414.0 | 35.64883804 | -78.8419876 |\n| 8 | 2020-12-12\
    \ 22:25:08 | 311 | 480 | 116500503 | 1414.0 | 35.63685607 | -78.86347198 |\n|\
    \ 9 | 2020-12-12 22:25:08 | 311 | 480 | 116500504 | 1414.0 | 35.63601303 | -78.86531829\
    \ |\n| 10 | 2020-12-12 22:25:08 | 310 | 410 | 195138569 | 1414.0 | 35.63536071\
    \ | -78.86586761 |\n| 11 | 2020-12-12 22:25:08 | 310 | 410 | 195001864 | 1414.0\
    \ | 35.66678237 | -78.87182617 |\n| 12 | 2020-12-12 22:25:08 | 311 | 480 | 39694114\
    \ | 13696.0 | 35.63697433 | -78.86968231 |\n\nFigure 6.9 – The query results show\
    \ details about cell towers and geolocation\n"
  mdcn: "\n\n一旦调查人员获取了地理坐标列表，这些坐标就可以与地图提供商一起使用，以获得设备所在位置的视觉反馈。\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_176_0.png)\n\
    \n图 6.5 – 查询结果被映射出来以确定用户的行程\n\n需要注意的是，不同数据库存储的定位数据类型各不相同，准确性也高低不等。根据已开展的研究，这种被称为\
    \ **routined location data** 的数据已被证明具有高度准确性。\n\n## 理解重要位置\n\n随着 iOS 8 的发布，苹果引入了一项名为\
    \ **Frequent Locations** 的功能，从 iOS 10 开始更名为 **Significant Locations**。基本上，每当设备访问某个位置时，都会在\
    \ SQLite 数据库中存储一条记录，其中包含设备行程的详细信息。当设备多次返回同一位置时，该位置就成为一个 *significant location*。\n\
    \n截至今天，苹果使用的算法如何工作以及需要多少次访问特定位置才会被视为重要位置，目前仍不清楚。就区域而言，研究发现，只要设备在重要位置 250 m 半径范围内，就会记录对该位置的访问。\n\
    \n如果启用了定位服务，可以通过 **Settings | Privacy | Location Services | System Services |\
    \ Significant Locations** 直接从设备上查看 Significant Locations。\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_177_0.png)\n\
    \n图 6.6 – Significant Locations 可以直接在设备上查看\n\n请记住，自 iOS 15 以来，在设备上查看 Significant\
    \ Locations 仅显示这些位置的摘要。完整数据只有通过完整的文件系统提取才能获得。\n\n从取证角度来看，频繁位置数据非常宝贵，因为它使调查人员能够了解用户经常访问的位置。此外，与重要位置相关的数据通常可以追溯到很久以前。\n\
    \n要查看此数据，我们将在 Local.sqlite 数据库上运行以下查询：\n\n```sql\nSELECT\nDATETIME(ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZENTRYDATE\
    \ + 978307200, 'UNIXEPOCH') AS \"ENTRY\",\nDATETIME(ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZEXITDATE\
    \ + 978307200, 'UNIXEPOCH') AS \"EXIT\",\n(ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZEXITDATE-ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZENTRYDATE)/60.00\
    \ AS \"DURATION (MINUTES)\",\nZRTLEARNEDLOCATIONOFINTERESTMO.ZLOCATIONLATITUDE\
    \ AS \"LATITUDE\",\nZRTLEARNEDLOCATIONOFINTERESTMO.ZLOCATIONLONGITUDE AS \"LONGITUDE\"\
    ,\nZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZLOCATIONUNCERTAINTY AS \"LOCATION UNCERTAINTY\"\
    ,\nZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZDATAPOINTCOUNT AS \"DATA POINTS\"\nFROM\n\
    ZRTLEARNEDLOCATIONOFINTERESTVISITMO\nLEFT JOIN\nZRTLEARNEDLOCATIONOFINTERESTMO\n\
    ON ZRTLEARNEDLOCATIONOFINTERESTMO.Z_PK = ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZLOCATIONOFINTEREST;\n\
    ```\n\n尽管此查询看起来很复杂，但如果我们将其分解为逻辑步骤，实际上会容易得多：首先，我们使用 datetime SQL 命令将时间戳转换为可读的字符串。Entry\
    \ 字段指的是设备访问重要位置的时间，而 Exit 字段表示设备离开该位置的时间。然后，我们计算访问的持续时间（Duration）并打印纬度、经度和不确定性。最后，我们打印该次访问该特定位置的数据点数（Data\
    \ Points）。\n\n下图显示了查询结果：\n\n| # | DATE | MAC ADDRESS | CHANNEL | RSSI |\n|---|---|---|---|---|\n\
    | 1 | 2020-04-12 12:46:19 | f8:bb:bf:1e:fa:ea | 161 | -57 |\n| 2 | 2020-04-12\
    \ 12:46:19 | f8:bb:bf:1e:fa:e4 | 161 | -57 |\n| 3 | 2020-04-12 12:46:20 | 80:da:13:72:52:64\
    \ | 149 | -90 |\n| 4 | 2020-04-12 12:46:20 | f8:bb:bf:1e:fa:eb | 48 | -51 |\n\
    | 5 | 2020-04-12 12:46:20 | 58:ef:68:25:35:34 | 48 | -90 |\n| 6 | 2020-04-12 12:46:20\
    \ | d8:d7:75:b6:28:9 | 48 | -89 |\n| 7 | 2020-04-12 12:46:20 | 80:da:13:72:52:6a\
    \ | 149 | -89 |\n| 8 | 2020-04-12 12:46:20 | f8:bb:bf:8d:b9:c2 | 48 | -78 |\n\
    | 9 | 2020-04-12 12:46:20 | f8:bb:bf:90:a8:f2 | 48 | -70 |\n| 10 | 2020-04-12\
    \ 12:46:20 | b8:66:85:53:d3:7 | 44 | -85 |\n| 11 | 2020-04-12 12:46:20 | 7c:db:98:c2:30:34\
    \ | 40 | -89 |\n| 12 | 2020-04-12 12:46:20 | f8:bb:bf:1e:fa:e8 | 48 | -50 |\n\n\
    图 6.8 – 结果显示了设备扫描到的无线设备的详细信息\n\n尽管此表不存储诸如纬度和经度之类的地理坐标，但它仍然为调查人员提供了有关设备何时以及捕获了哪些无线信号的详细信息。通过将此数据与外部数据源（例如已知网络设备及其\
    \ MAC 地址的列表）相关联，可以在特定时间点将设备定位在特定位置。\n\n## 理解采集的位置\n\n在本章开头，我们介绍了 A-GPS 技术，并了解了苹果如何维护一个基于同行的地图，该地图在\
    \ Location Services 请求地理定位时下载回设备。此数据包含数千条与设备附近的蜂窝基站和 Wi-Fi 网络相关的记录，以及它们的地理坐标。设备可以使用此数据将无线电信号解析为物理位置，而无需\
    \ GPS 信号。\n\n下载到设备上的苹果数据称为 **Harvested Locations** 数据，可在 `cache_encryptedB.db`\
    \ 数据库中找到。\n\n在这里，我们可以找到几个感兴趣的表：\n\n- 蜂窝基站数据可在以下表中找到：\n  - `CdmaCellLocation`、`CellLocation`\
    \ 和 `LteCellLocation`。\n- Wi-Fi 设备数据存储在 `wifiLocation` 表中。\n\n### 常规位置与采集位置\n\n\
    在开始分析此数据之前，了解设备访问的位置与苹果提供的位置之间的区别非常重要：我们之前查看的数据，也称为常规位置数据，通常非常准确，因为它来自设备的 GPS，并且可以详细显示设备所在的位置。另一方面，Harvested\
    \ Locations 数据由苹果提供，作为增强设备对该区域了解的一种方式。此数据不是从内置 GPS 接收器检索的，而是表示位于设备附近的蜂窝基站和无线设备。\n\
    \n### 分析采集的蜂窝基站数据\n\n蜂窝基站数据存储在 `cache_encryptedB.db` 数据库中，并保留约一周。以下是一些最相关的列：\n\
    \n- MCC，或 **Mobile Country Code**，表示蜂窝基站的国家代码。\n- MNC，或 **Mobile Network Code**，标识移动运营商。\n\
    - CI，或 **Cell ID**，是用于表示蜂窝基站每个收发站的唯一编号。\n- `HorizontalAccuracy` 值表示设备认为坐标的精确程度，以米为单位。\n\
    - `Latitude` 和 `Longitude` 列存储地理坐标。\n\n我们可以通过运行 SQL 查询来提取所有蜂窝相关数据，例如以下代码块所示。在用于研究<|message|>的设备上，蜂窝数据存储在\
    \ LTECELLLOCATION 表中；不过，这取决于设备型号和 iOS 版本：\n\n```sql\nSELECT\n    DATETIME(TIMESTAMP\
    \ + 978307200, 'UNIXEPOCH') AS \"TIMESTAMP\",\n    MCC AS \"MCC\",\n    MNC AS\
    \ \"MNC\",\n    CI AS \"CI\",\n    HORIZONTALACCURACY AS \"HORIZONTAL ACCURACY\"\
    ,\n    LATITUDE AS \"LATITUDE\",\n    LONGITUDE AS \"LONGITUDE\"\nFROM LTECELLLOCATION;\n\
    ```\n\n查询结果如下图所示：\n\n| # | TIMESTAMP | MCC | MNC | CI | HORIZONTAL ACCURACY |\
    \ LATITUDE | LONGITUDE |\n|---|---|---|---|---|---|---|---|\n| 1 | 2020-12-12\
    \ 22:25:08 | 310 | 260 | 18005506 | 2142.0 | 35.6559143 | -78.87465667 |\n| 2\
    \ | 2020-12-12 22:25:08 | 310 | 260 | 256947784 | 1414.0 | 35.62225341 | -78.87554168\
    \ |\n| 3 | 2020-12-12 22:25:08 | 310 | 260 | 256769850 | 1414.0 | 35.66263961\
    \ | -78.87255859 |\n| 4 | 2020-12-12 22:25:08 | 311 | 480 | 39694094 | 2977.0\
    \ | 35.62737655 | -78.84117126 |\n| 5 | 2020-12-12 22:25:08 | 311 | 480 | 39694096\
    \ | 1414.0 | 35.62499618 | -78.84272003 |\n| 6 | 2020-12-12 22:25:08 | 310 | 410\
    \ | 196794049 | 2094.0 | 35.66758346 | -78.87165069 |\n| 7 | 2020-12-12 22:25:08\
    \ | 310 | 410 | 195403799 | 1414.0 | 35.64883804 | -78.8419876 |\n| 8 | 2020-12-12\
    \ 22:25:08 | 311 | 480 | 116500503 | 1414.0 | 35.63685607 | -78.86347198 |\n|\
    \ 9 | 2020-12-12 22:25:08 | 311 | 480 | 116500504 | 1414.0 | 35.63601303 | -78.86531829\
