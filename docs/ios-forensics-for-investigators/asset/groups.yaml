  - '[PAGE 106]


    This chapter would not be complete without mentioning some of the best open source
    iOS forensic tools! The **DFIR (Digital Forensics and Incident Response)** community
    is one of the most active and helpful communities out there, and these tools are
    the result of the hard work and passion of security researchers, forensic examiners,
    and developers that have shared their knowledge with the community.


    # Apollo


    The **Apple Pattern of Life Lazy Output''er (APOLLO)** is a Python script written
    by Sarah Edwards (you can find her on Twitter – @iamevltwin) that processes iOS
    and macOS artifacts to extract pattern-of-life data and combines the result into
    a single SQLite database or CSV file for viewing.


    The script is based on a number of different modules (some of these have been
    written by the DFIR community), and each of these runs one or more queries to
    extract specific data from an iOS extraction. We''ll be using this powerful tool
    extensively in *Chapter 5*, *Pattern-of-Life Forensics*.


    You can download APOLLO from the project''s GitHub repository: https://github.com/mac4n6/APOLLO.


    # iLEAPP


    The **iOS Logs, Events, And Plists Parser (iLEAPP)** is a script written in Python
    3 by Alexis Brignoni (Twitter – @AlexisBrignoni), which is a free alternative
    to commercial forensic tools. This tool can parse full filesystem iOS extractions,
    parsing and decoding almost every kind of artifact that you can find on an iOS
    device.


    Personally, I find this is a great tool to be used in addition to commercial software,
    as it can help validate your findings.


    iLEAPP can be downloaded from https://github.com/abrigononi/iLEAPP.


