    ### 使用 Apollo 分析位置数据


    Apollo，我们在上一章中介绍过，是一款将多个数据源关联到统一 **时间线** 的 Python 脚本，简化了检查员弄清设备上到底发生了什么的任务。该工具由数十个高度可配置的模块组成，每个模块查询特定的
    iOS 数据库以提取数据和事件。Apollo 支持常规位置数据和收集数据。


    我们现在将介绍下载该工具、运行它并将位置数据导出为可导入地图提供商服务的 KMZ 文件所需的步骤：


