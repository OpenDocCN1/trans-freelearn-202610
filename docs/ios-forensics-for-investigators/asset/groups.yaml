    一般来说，代理服务器是了解 iOS 应用程序如何与网络交互的绝佳选择。然而，在某些情况下，这种方法可能无法奏效。我们将在下一节讨论更高级的选项。


    ## 高级应用程序分析


    执行动态应用程序分析通常是一项简单的任务；然而，某些应用程序，尤其是像 **Instagram** 或 **Twitter** 这样流行的第三方社交网络，具有一些内置机制来防止
    MITM 攻击。


    其中之一是证书钉扎，这本质上意味着 mitmproxy 的证书将不会被应用程序接受。在这种情况下，监控应用程序的网络流量根本就不会起作用。这是因为数字证书将不会被信任，应用程序将无法连接到其服务器。


    唯一的变通方法是将自定义代码注入到应用程序中以改变其工作方式。最受欢迎的代码插桩工具包之一是 **Frida**，这是一个开源工具，允许您将 JavaScript
    代码注入到任何 iOS 应用程序中。Frida 允许检查人员追踪应用程序调用了哪些函数，打印或修改函数的参数，并在函数调用之前或之后 **注入其代码**。请记住，运行此工具需要设备越狱。


    对 Frida 所有功能的完整介绍超出了本书的范围；您可以通过遵循 [https://frida.re/docs/home/](https://frida.re/docs/home/)
    的教程开始使用该工具，或阅读 *Alexander Fadeev* 的博客文章；例如，[https://fadeevab.com/quick-start-with-frida-to-reverse-engineer-any-ios-application/](https://fadeevab.com/quick-start-with-frida-to-reverse-engineer-any-ios-application/)。


    从取证的角度来看，Frida 可以与其他工具一起使用，例如 **Meduza**，以绕过证书钉扎并允许检查人员分析任何类型的 iOS 应用。Meduza 是由
    *Dima Kovalenko* 开发的开源工具，它分为两个步骤：首先，它分析应用程序并收集应用程序用于连接到其


