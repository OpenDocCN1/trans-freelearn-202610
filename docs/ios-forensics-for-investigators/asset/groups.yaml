    ### 分析地址簿


    在深入研究通话历史数据库之前，有用的是介绍 AddressBook.sqlite 数据库，其中包含设备上存储的联系人的姓名和详细信息。数据库位于 /private/var/mobile/Library/AddressBook/，包含两个感兴趣的表
