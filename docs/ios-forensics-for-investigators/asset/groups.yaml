    apollo.py extract -o sql -p apple -v 14 -k modules/ fs-extraction/ 将以 SQL 模式运行
    Apollo，分析 fs-extraction 文件夹中的文件并运行 modules 文件夹中找到的所有模块。请确保使用 -k 选项输出位置文件。

    - 3. 当工具结束处理后，结果将存储在一个名为 apollo.db 的文件中以及多个 KMZ 文件中。

    - 4. 然后，您可以使用您选择的工具，例如 **Google Earth** 或 **Google Maps** 导入 KMZ 文件。


