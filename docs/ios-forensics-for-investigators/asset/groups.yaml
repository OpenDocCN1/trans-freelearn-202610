    # Analyzing network usage


    Dissecting which services or applications are using the network can help the investigator
    identify any abnormal processes, such as **malware** running on the device.


    Data usage on iOS devices is stored in two different files:


    +   The `CurrentPowerLog.PLSQL` database, which can be found in `/private/var/containers/Shared/SystemGroup/<GUID>/Library/BatteryLife/`,
    contains several tables of interest. By correlating the data from different tables,
    the examiner can extract precise data usage for each process, both from the **Wi-Fi
    interface** and the **WAN interface**. The caveat here is that this database only
    stores process data for approximately 24 hours.


    +   The `DataUsage.db` database, which can be found in `/private/var/wireless/Library/Databases/DataUsage.sqlite`,
    contains two significant tables – ZPROCESS and ZLIVEUSAGE. The first stores the
    app''s name, the app bundle, and the associated process, along with its timestamp;
    the second table stores the data that''s coming in and out of the WAN interface
    for each process. Although this database will generally store several weeks''
    worth of data, keep in mind that, from research that has been carried out, it
    seems that data coming in and out of the Wi-Fi interface is not logged.


    These databases can help the investigator determine not only which processes were
    using the network, but also whether a subject was using an application at a certain
    moment in time.


    Process and network usage data can be extracted from the `DataUsage.db` database
    by running the following query:'
