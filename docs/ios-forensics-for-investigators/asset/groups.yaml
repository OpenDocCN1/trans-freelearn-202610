    git clone https://github.com/abrignoni/iLEAPP.git

    ```


    然后，我们需要安装所需的软件包：


    ```bash

    cd iLEAPP

    pip install -r requirements.txt

    ```


    现在一切就绪，我们可以运行 iLEAPP 了。在此示例中，我们提供一个 ZIP 压缩包作为输入文件，并将报告导出到输出文件夹：


    ```bash

    python3 ileapp.py -t zip -i ../iphone_dump.zip -o output

    ```


    如你所见，我们使用 `-t` 选项指定提供的输入类型，使用 `-i` 选项指定输入文件的路径，使用 `-o` 选项指定输出文件夹的路径。


    iLEAPP 处理完成后，结果将合并到一份 HTML 报告中：


    ![](img/0b17a17d4cb56b1c25763a396dd83117_108_0.png)


    图 3.21 – iLEAPP 生成的报告


    报告将包含各种痕迹和有用的证据，包括**账户数据、蜂窝数据、位置信息、应用程序数据、设备使用数据、联系人、消息**等等！


    这个开源软件是一个非常强大的工具，我绝对建议你多动手操作它，以充分了解它的潜力。


    ## 总结


    在本章中，我们了解了最流行的商业取证工具有哪些，以及通过使用多种工具、比较它们的输出、在开始检验之前运行验证测试来验证结果的重要性。


    请记住，尽管这些工具极其有用，并且大大减轻了调查人员的工作，但工具本身不是证据。报告也不是证据。证据就是证据，检验人员的工作是理解该证据是如何生成的、它代表什么，以及通过分析该证据能获得哪些见解。取证软件确实有其用武之地，但它不应取代对痕迹的手动检查。换句话说，可以使用这些工具，但不要盲目相信它们，并确保你了解后台正在发生的事情。


    在本章后续部分，我们重点介绍了其中两款工具：Cellebrite Physical Analyzer 和 Magnet AXIOM。我们学习了如何将数据导入这些工具，以及如何使用软件的功能（如
    AppGenie 或 Connections 资源管理器）来深入挖掘数据并获得有用的见解。


    最后，在本章的末尾部分，我们了解了一些有用的开源脚本，并使用 iLEAPP 从完整的文件系统提取中提取并分析了痕迹。


    在下一章中，我们将讨论 iOS 文件系统，并学习到哪里查找核心的 iOS 痕迹。


    ## 第 4 章：处理常见的 iOS 痕迹


    在前面的章节中，我们从广义上讨论了 iOS 操作系统的工作方式以及移动检验工作流程的不同阶段。然后，我们学习了各种获取方法，以及如何从设备中提取最丰富的数据。在第三章中，我们研究了取证工具，并通过将数据加载到工具中进行分析来继续我们的检验过程。


    移动取证调查中最关键的方面之一是验证你的发现。我们已经在前面章节中讨论了工具验证的重要性，但这个过程应进一步扩展，以确保所收集数据的完整性，并理解和解释数据的上下文，因为这对于在法庭上将其作为证据出示至关重要。这通常需要追踪源文件，并以原始格式手动查看痕迹。


    在本章中，我们首先介绍 iOS 设备上最常见的痕迹类型，以及如何以其原始格式查看它们。然后，我们将深入探讨 SQLite 数据库，了解它们在内部如何管理数据存储，以及我们有哪些选项可以恢复已删除的记录。最后，我们将仔细查看文件系统，了解系统痕迹位于何处，通过分析这些数据我们能获得哪些见解，以及特定应用程序的痕迹在哪里可以找到。


    在本章中，我们将涵盖以下主题：


    - 理解验证的重要性

    - 处理 iOS 痕迹

    - 定位常见痕迹


    ### 理解验证的重要性


    在第三章“使用取证工具”中，我们了解了 Cellebrite Physical Analyzer 和 Magnet AXIOM 等软件的一些功能，并对这些工具可能分析出的数据有了更好的理解。


    你可能会想，当这些工具已经为你完成了所有繁重的工作时，为什么检验人员还要花时间学习手动分析设备上找到的数据。首先，虽然这些软件是调查人员工具箱中的必备物品，但调查人员也应该了解这些工具的局限性，以及如何处理无法自动解析的痕迹；尽管取证工具声称支持各种不同的应用程序和痕迹，但这并不意味着这些产品能够真正解析与正在检验的特定应用程序相关的所有数据。随着移动应用程序的更新速度，取证工具不支持最近更新的应用程序，或者在某些情况下仅部分支持（只提供部分而非全部可用数据）的情况相当常见。在这种情况下，调查人员必须求助于以原始格式手动检查源文件。


    调查人员想要查看痕迹源文件的另一个原因是验证他们的发现；即使取证工具已经产生了可观的结果，将数据与源文件进行交叉引用以理解该数据的上下文也是非常重要的。例如，通过分析
    SQLite 数据库中的表，调查人员不仅可以理解存储了哪些数据，还可以理解这些数据在设备上是如何存储的，以及操作系统如何记录特定事件，例如来电、短信或通知。


    如果在检验过程中发现了对整个调查至关重要的关键痕迹，检验人员应准备好回答如下问题：


    - 这些数据是如何到达那里的？

    - 当我们将其置于上下文中时，这些数据告诉了我们什么？

    - 该痕迹是用户活动的结果，还是由操作系统生成的？

    - 它与设备上发现的其他数据是如何交互的？


    这些问题的答案往往存在于痕迹的源文件中，因此学习如何手动分析此类文件是负责 iOS 设备检验过程的人员必须具备的技能。


    **验证**的重要性怎么强调都不为过；使用经验证的方法论来检验设备，通过验证工具输出来确保工具正常工作，以及通过深入研究源文件以理解数据的上下文来验证你的发现，这些都可能对调查的最终结果产生巨大影响。在某些情况下，这可能使某人失去工作与否，或者在极端情况下，决定他们是否入狱。


    在我们讨论 iOS 设备上常见痕迹的位置之前，下一节我们将学习如何在典型检验中手动处理你将会遇到的最常见文件类型。


    ### 处理 iOS 痕迹


    一般来说，可以在 iOS 设备上找到的痕迹可分为以下类别之一：


    - SQLite 数据库

    - 属性列表

    - 协议缓冲区

    - XML 文件

    - 日志文件


