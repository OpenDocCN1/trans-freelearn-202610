    \nPlease select an action\n\nLogical acquisition\n  I  DEVICE INFO      - Get\
    \ basic device information\n  R  RECOVERY INFO    - Get information on device\
    \ in DFU/Recovery mode\n  B  BACKUP           - Create iTunes-style backup of\
    \ the device\n  M  MEDIA            - Copy media files from the device\n  S  SHARED\
