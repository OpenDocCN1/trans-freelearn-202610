    ## Vacuuming


    You can confirm the fact that SQLite retains deleted pages by checking that the
    database file size does not change when data is removed. As a result of this behavior,
    under normal circumstances, the file can only grow in size as new data is written
    to the database. Additionally, as new records are added and deleted from the database,
    the data can become fragmented because free pages will be scattered and mixed
    all across the file. This means that the actual parts of a database that hold
    a particular table will not be stored contiguously within the file, which affects
    performance.


    The following diagram illustrates what happens when data is written to and deleted
    from the database, resulting in a fragmented file:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_121_0.png)


    Figure 4.5 — Pages in a fragmented SQLite database


    The process of **vacuuming** an SQLite database solves these problems by reading
    the logical data from the database (tables, columns, and rows) and writing it
    to a temporary file, ignoring free pages. As a result of this process, the database
    file is rebuilt from scratch, active pages are repacked, and data within the file
    is defragmented. Once the process is complete, the contents of the temporary file
    will be copied back into the original database, overwriting it.


    The following diagram shows the same database after running the VACUUM command;
    the records stored in the database are obviously unchanged, but now the active
    pages are stored contiguously and the free pages are not present:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_122_0.png)


    Figure 4.6 – Pages in an SQLite database after the vacuuming process


    It should be clear that recovering deleted records from a database is nearly impossible
    once the vacuuming process is complete. Research has shown that iOS periodically
    runs the VACUUM command for most SQLite databases. At the time of writing, however,
    it is not clear exactly when this happens, as it seems to depend heavily on the
    device model and iOS version.


    ## Write-ahead logging


    Up to this point, we have focused on analyzing the main database file to understand
    how the data is stored in that file and where to look for deleted records. However,
    there are other files that are of interest from a forensic perspective that should
    not be overlooked, such as SQLite temporary files. The most common type of temporary
    file you will find on an iOS device is a journaling file called the Write-Ahead
    Log (WAL).


    WAL files can be easily identified by their filename, since the -wal string is
    appended to the name of the database. So, for example, if we are working on an
    SQLite database called sms.db, the WAL file will be called sms.db-wal, and it
    will be created in the same directory as the main database file. These temporary
    files will not always be present, as only databases that have their journaling
    mode set to WAL will use the write-ahead log method.


    From the research that has been carried out, it''s safe to say that most databases
    on an iOS device have WAL mode enabled. If this is the case, when data is added,
    modified, or deleted, the transaction is stored in the WAL file rather than directly
    in the main SQLite database. Similarly, when reading data from the database, the
    SQLite engine determines where the most recent version of a particular record
    is stored and reads it from the appropriate file:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_123_0.png)


    Figure 4.7 – New records added to the database are appended to the WAL file


    There are many reasons why an application would want to enable WAL mode in its
    database. The most important reason is performance; pages are written to the WAL
    file in sequential order, and every change to the database results in a single
    disk write. Additionally, because of the separate files, an application using
    multiple threads will be able to read from the database while writing to it.

