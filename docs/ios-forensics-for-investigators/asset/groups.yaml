    We will briefly go over the most interesting columns to understand how this table
    logs events:


    - Each row contains a ZCREATIONDATE column that records a timestamp (in MAC format)
    of when the entry was written to the database.

    - The ZSTARTDATE and ZENDDATE columns contain a timestamp for the start and end
    times of the event.

    - The ZSTARTDAYOFWEEK column indicates what day the event occurred.

    - The GMT offset in seconds is indicated in the `ZSECONDSFROMGMT` column.

    - The `ZSTREAMNAME` column indicates the type of event that occurred.

    - The `ZVALUESTRING` column shows the bundle ID for the application relevant to
    the event.


    To gain a better understanding of what kind of events will be logged by this database,
    we’ll analyze the `ZSTREAMNAME` column and check its values. You can see a list
    of the event types by running the following SQL query:


    ```

    SELECT DISTINCT ZOBJECT.ZSTREAMNAME FROM ZOBJECT ORDER BY ZSTREAMNAME;

    ```


    On one of the latest iOS devices running iOS 14.6, this query resulted in more
    than 50 different event types. The following is a list of some of the most common
    event types and how to interpret data from the `ZOBJECT` table.


    #### /device/batteryPercentage


    The batteryPercentage stream type indicates the charge level of the device''s
    battery. The percentage value is stored in the `ZVALUEDOUBLE` column.


    #### /device/isPluggedIn


    This event indicates whether the device was plugged in and charging or not. The
    `ZVALUEINTEGER` column will indicate 0 if the device was unplugged or 1 if the
    device was plugged in.


    #### /displayIsBacklit


    This event stream indicates whether the backlight was lit or not. The `ZVALUEINTEGER`
    column will indicate 0 if the backlight was off or 1 if the backlight was on.
    This event can be useful to detect human interaction


    while the device is locked; simply tapping the screen will light up the display,
    resulting in this event being triggered.


    #### /device/isLocked


    The isLocked stream type indicates whether the device is passcode-locked or not.
    The locked status is stored in the ZVALUEINTEGER column; a value of 0 indicates
    that the device is locked, while a value of 1 indicates an unlocked device.


    #### /app/inFocus


    This event stream indicates which application is active and running in the foreground.
    The ZVALUESTRING column stores the name of the app. The inFocus event can be analyzed
    to track application usage in great detail.


    #### /notification/usage


    This event stream indicates push notification activity. The ZVALUESTRING column
    shows what kind of activity was logged, such as *receive*, *clear*, and *dismiss*.
    This event can also be useful to identify user activity, such as the user dismissing
    a notification when the device is locked.


    #### /app/webUsage


    This event indicates which app is using the internet connection. The ZVALUESTRING
    column shows the name of the application.


    #### /display/orientation


    The orientation event indicates a change in the device''s orientation. The ZVALUEINTEGER
    column will indicate 0 if the device is in portrait mode or 1 if the device is
    in landscape mode.


    #### /media/nowPlaying

