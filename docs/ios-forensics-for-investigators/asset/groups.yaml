    ### 介绍蜂窝取证


    ![](img/0b17a17d4cb56b1c25763a396dd83117_193_0.png)


    图 7.1 – com.apple.commcenter PLIST


    此 PLIST 包含多个有用的蜂窝相关值，例如其 **集成电路卡标识符 (ICCID)**、**国际移动用户识别码 (IMSI)**、**国际移动设备识别码
    (IMEI)**、设备的电话号码，以及设备最后连接的蜂窝基站的详细信息。


    **ICCID**


    ICCID 是 SIM 卡的序列号。此值唯一标识物理 SIM 卡，如果卡被更换，即使电话号码保持不变，该值也会发生变化。此值可以通过查看 PLIST 中的
    LastKnownICCID 键来提取。


    **IMSI**


    **IMSI** 可以通过查看 `lastGoodImsi` 键找到。此值通常长 15 位，标识网络上的 SIM 卡。重要的是要理解，此代码与电话号码绑定，而不是物理
    SIM 卡。IMSI 由移动网络运营商用于连接电话呼叫并与 SIM 卡通信。


    **IMEI**


    **IMEI** 是一个唯一的 15 位代码，用于标识特定的移动设备。此代码与订阅者没有任何关系，仅标识移动电话；然而，当移动设备在 GSM 网络上注册时，它也会提供设备的
    IMEI，因此运营商可以通过将其 IMEI 添加到阻止列表中来阻止被报告为被盗的设备。此代码也可以由执法机构和情报机构用于跟踪移动设备，可以通过分析设备连接的蜂窝基站来定位设备。IMEI
    可以通过查看 PLIST 中的 `kEntitlementsSelfRegistrationUpdateImei` 键找到。


    **MCC 和 MNC**


    **移动国家代码 (MCC)** 和 **移动网络代码 (MNC)** 是唯一标识蜂窝基站的值组合。移动 iOS 设备在 PLIST 下的 `LastKnownServingMcc`
    和 `LastKnownServingMnc` 键中存储最后已知的 MCC 和 MNC 值。这些值与已知蜂窝基站的地图结合使用，可以精确定位设备的最后位置。


    **电话号码**


