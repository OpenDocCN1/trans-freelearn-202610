    智能手机的设计初衷就是通过蜂窝网络、蓝牙连接和无线 Wi-Fi 网络进行通信。为了防止设备通信，尽快隔离设备非常重要。隔离设备可防止新数据（来电、接收消息等）修改现有证据，从而强制执行数据保存。此外，如果允许设备联网，数据销毁就可能发生，因为
    Apple 产品可通过 *kill signal* 远程擦除。


    隔离 Apple 设备最简单的方法是启用 **Airplane** 模式；这会停用设备的无线和蜂窝连接。你可以从设备的 **Settings** 中启用 **Airplane**
    模式，或如果设备已锁定，可直接从控制中心通过从底部向上滑动启用。如果设备是 iPhone X 或更新机型，你可以通过从右上角向下滑动访问控制中心。不过值得注意的是，隔离设备也可以通过将设备放入法拉第袋来实现，法拉第袋是一种由金属屏蔽制成的容器，可阻断蜂窝网络、GPS
    和 Wi-Fi 网络使用的无线电频率。


    不要忘记保持设备充电，以确保其不会关机。一般来说，你希望设备保持你发现时的状态：


    - 如果设备是关的，就保持关机。

    - 如果它是开的，确保你保持开机状态，以免锁定！


    如果设备受密码保护且调查人员没有密码，这一点尤其重要：如果设备断电，它将从 AFU 状态转变为 BFU 状态，从而使数据恢复变得更加困难，在某些情况下甚至不可能。我们将在本章后面了解更多关于设备状态的信息。


    ## Tip


    最常见的错误之一是从未锁定的设备中取出 SIM 卡以将其与蜂窝网络隔离。在处理不同设备时这可能有意义，但你应避免从 iPhone 或 iPad 中取出 SIM
    卡，因为这样做会导致 iOS 自动锁定设备，生物识别解锁将被禁用，并且 USB 限制模式将被激活。


    成功扣押并隔离设备后，应注意维护设备的保管链。NIST 将保管链定义如下：


    > “一种通过记录处理证据的每个人的信息、收集或转移的日期/时间以及转移目的，来跟踪证据在其收集、保护和分析生命周期中的移动的过程。”


    你可以通过访问以下网站了解更多关于此主题的信息：


    [CSRC.nist.gov](https://csrc.nist.gov/)。


    ## Acquisition


    Acquisition 是从设备获取信息和证据的过程。


    在实际采集过程开始之前，你应该清楚地了解自己正在寻找哪种证据，因为这会对你选择的工具产生很大影响。


    一般来说，有三种不同类型的数据采集，调查人员选择的方法会影响可以从设备中提取的数据量：


    - Logical acquisition

    - Full filesystem acquisition

    - Physical acquisition


    在下面的表格中，你可以看到每种方法可以提取哪种数据：


    | | Logical | Filesystem | Physical |

    |---|---|---|---|

    | Calls, calendars, contacts, and messages | ✓ | ✓ | ✓ |

    | User content (photos, videos, notes, and so on) | ✓ | ✓ | P |

    | Keychain | Limited | ✓ | ✓ |

    | Third-party app data | Limited | ✓ | ✓ |

    | Apple Pay | - | ✓ | ✓ |

    | Location data (radio cells, GPS fixes, and so on) | - | ✓ | ✓ |

    | Mail | - | ✓ | ✓ |

    | User activity logs | - | ✓ | ✓ |

    | System logs | - | ✓ | ✓ |

    | Deleted data (unallocated space) | - | - | ✓ |

    | Deleted data (SQLite databases) | Limited | ✓ | ✓ |


    表 1.2 – 不同采集方法可提取数据的比较


    ## Logical and filesystem extractions


    正如你所见，逻辑采集将从设备中提取一些用户生成的数据，例如照片、消息和笔记。逻辑提取通常是最简单、最快速的提取类型，大多数取证工具都支持它。然而，考虑到 iOS
    设备上可用的文件数量，只有获取完整的完整文件系统才能访问宝贵的证据，例如第三方应用数据、精确的位置数据和生活模式信息。


    文件系统提取是设备用户分区的文件和文件夹的表示；通过分析数据库和临时文件（例如 WAL 文件），可以部分恢复已删除的数据。


    ## Physical extraction


    iPhone 4 及更早的设备可以进行完整的、取证可靠的整个原始磁盘物理提取。这种提取提供的数据最多，就像标准硬盘一样，系统和用户分区以及磁盘的未分配区域都会被提取。这非常有用，因为它允许调查人员恢复已删除的数据，包括消息、照片和视频。然而，随着
    iOS 5 的引入，Apple 改变了磁盘上数据的加密方式，并启用了其他安全功能，例如数据保护类密钥。截至撰写本文时，提取现代 iOS 设备的物理镜像是不可能的。


    ## Choosing the best acquisition method


    调查人员应始终先执行逻辑采集，然后如果可能的话，再尝试文件系统或物理采集。


    通常需要越狱设备才能实现对设备文件系统的不受限制访问；然而，越来越多的厂商增加了运行取证可靠的基于 checkm8 的提取（所有操作都在设备的易失性 RAM
    中执行）或基于代理的提取的可能性。这两个选项都允许你在不越狱设备的情况下获取完整的文件系统。


    归根结底，你选择的方法通常取决于四个变量：


    - 你发现设备的状态（锁定或未锁定）

    - 设备型号和 iOS 版本

    - 你可以使用的工具

    - 越狱设备的可能性


    如果设备已锁定且你没有密码，就没有一种简单的解决方案可以始终绕过 iOS 安全。然而，根据设备型号，有几个选项可以提供有限的数据。我们将在下一章详细介绍这些选项。


    如果设备未锁定，根据可用工具，你可以尝试文件系统提取。你应该从较不具侵入性的选项开始，例如内存中的 checkm8 漏洞利用，如果你的工具支持的话。如果设备不允许
    checkm8 漏洞利用，你可以尝试基于代理的提取，如果 iOS 版本兼容的话。虽然这需要安装代理到设备上并且可能会发生一些小的更改，但这被认为在取证上是安全的。如果这两个选项都不可用，你可以考虑通过
    checkra1n 或 unc0ver 越狱设备。确保你了解越狱的工作原理，它如何影响设备以及风险是什么。最后，如果这些选项都不可用，你将不得不进行逻辑采集。


    我们将在下一章学习有关从 iOS 设备提取数据的所有内容，但现在重要的是要注意，手机应使用经过测试、可重复且尽可能取证可靠的方法进行采集。强烈建议在测试设备上使用各种工具进行实验，以确定哪种采集方法和工具最适合不同的设备。


    如果你无法直接访问设备，还有其他证据来源可供考虑，例如 iTunes 备份和 iCloud 提取。


    ## Analysis


    进行取证检查的主要目的是找到、提取和处理与特定案件或调查相关的证据。


    虽然没有标准流程来分析你从设备中提取的内容，但以下是一些可以帮助你入门的指南：


    - 浏览所有可用数据，以熟悉设备上发现的主要证据来源。

    - 使用你的工具和取证软件快速解析常见的数据源，例如 SMS 数据库、已安装应用、通话记录、照片等。

    - 尝试使用软件恢复任何已删除的数据，并通过手动 carving 二进制文件、日志、plists 和 SQLite 数据库进行恢复。


