    ,\n    ZALTITUDE AS \"ALTITUDE\",\n    ZSPEED AS \"SPEED (M/S)\",\n    ZSPEED*2.23694\
    \ AS \"SPEED (MPH)\",\n    ZSPEED*3.6 AS \"SPEED (KMPH)\",\n    ZHORIZONTALACCURACY\
    \ AS \"HORIZONTAL ACCURACY\",\n    ZVERTICALACCURACY AS \"VERTICAL ACCURACY\"\n\
    FROM\n    ZRTCLLOCATIONMO;\n```\n\nFirst, we use the datetime SQL command to convert\
    \ the Mac Absolute timestamp to a readable string. Then, we select the relevant\
    \ columns from the table and calculate the speed at which the device was moving.\n\
    \nThe following figure shows the query results:\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_175_0.png)\n\
    \nFigure 6.4 – The query results show the device's location\n\nAs you can see,\
    \ location artifacts provide the investigator with an accurate idea of where a\
    \ certain user's device was at a given moment. Typically, this data is extremely\
    \ granular and it's not uncommon to see entries logged every second. The differences\
    \ in the data's granularity can be explained by the fact that GPS is not available\
    \ everywhere, so on these occasions, the device reverts to using Wi-Fi networks\
    \ and cell towers to establish its position, if there are any in close proximity."
  md: "\nThose cell towers. Through this mechanism, Location Services can get a rough\
    \ position in a few seconds and then report a more accurate GPS-sourced location\
    \ when available.\n\nEvery iOS device also has an internal cache that stores a\
    \ large quantity of locations, cell towers, and Wi-Fi networks; by accessing the\
    \ local cache, the device is able to resolve locations from Wi-Fi networks without\
    \ needing a data connection. To keep this data up to date, the cache database\
    \ is purged periodically.\n\nOther than this peer-based mechanism, Apple also\
    \ relies on external sources to translate cell towers and wireless networks into\
    \ physical locations; wardriving, for instance, is the act of searching for radio\
    \ signals by a person usually moving in a vehicle, using a laptop or smartphone,\
    \ recording their own GPS coordinates together with the data pertaining to the\
    \ radio signals.\n\n## Satellite GPS\n\nTraditional GPS, also known as satellite\
    \ GPS, is the most accurate source of location data for iOS devices.\n\nThis technology\
    \ is based on a network of over 30 satellites orbiting the earth at an altitude\
    \ of 20,000 kilometers. Each satellite emits a signal that is transmitted to earth\
    \ via radio waves, which contains the satellite's identifier, its current position,\
    \ and a timestamp. Therefore, when a device intercepts a satellite signal, it\
    \ uses the time difference between the time of signal reception and the broadcast\
    \ time to compute the distance, or range, from the receiver to the satellite.\
    \ The device then uses the calculated distance and the satellite's location to\
    \ calculate its approximate position.\n\nIt should be noted that to calculate\
    \ a precise location, the receiver must be locked on to the signal of at least\
    \ three satellites. With four or more satellites in view, the receiver can determine\
    \ its 3D position: **latitude**, **longitude**, and **altitude**.\n\nCertain atmospheric\
    \ factors and other error sources can affect the accuracy of the device's GPS\
    \ receiver; however, receivers are typically accurate to\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_171_0.png)\n\
    \nFigure 6.3 – Cell tower trilateration process\n\nIt's easy to see how the accuracy\
    \ of the trilateration process varies so much depending on the location and density\
    \ of the cell towers.\n\n## Wi-Fi and Bluetooth\n\nSimilar to cell towers, Wi-Fi\
    \ hotspots also broadcast a radio signal and the strength of this signal can be\
    \ measured through the RSSI. Mobile devices are constantly scanning for wireless\
    \ hotspots, searching for known networks, so it makes sense to use these to calculate\
    \ a device's whereabouts. The range of a Wi-Fi signal is only about 70 m outdoors\
    \ and 40-50 m indoors, so if a device picks up the signal, it must be physically\
    \ near to the hotspot.\n\nWith this in mind, it's clear how mobile devices can\
    \ evaluate the RSSI of Wi-Fi networks to establish an approximate distance between\
    \ the device and the hotspot. Then, iOS resolves this data to a physical location\
    \ using the peer-based mechanism described earlier on.\n\nBluetooth beacons can\
    \ also be used in a similar way.\n\n## Locating location artifacts\n\nIn the first\
    \ part of this chapter, we introduced the Location Services API and learned how\
    \ iOS uses different technologies to assess its position. Now, we'll take an in-depth\
    \ look at the SQLite databases where geolocation data is stored.\n\nThe following\
    \ is a list of files of interest that can only be found in a full filesystem extraction:\n\
    \n- `/private/var/mobile/Library/Caches/com.apple.routined/Cache.sqlite`\n\n \
    \ This is the primary storage means for iOS location data. The ZRTCLLOCATIONMO\
    \ table contains several useful records, such as GPS coordinates, timestamps,\
    \ and a horizontal accuracy value, which is an indicator of how accurate the device\
    \ believes the GPS coordinates to be. The ZRTWIFIACCESSPOINTMO table stores a\
    \ list of Wi-Fi networks that the device has scanned. Generally speaking, data\
    \ contained in this database should be considered up to date and accurate.\n\n\
    - `/private/var/mobile/Library/Caches/com.apple.routined/Local.sqlite`\n\n  This\
    \ SQLite database is identical to the `Cache.sqlite` database in its structure.\
    \ Depending on the iOS version, the ZRTLEARNEDLOCATIONOFINTERESTSMO table usually\
    \ contains details for any *frequent locations*, which we will look into later\
    \ on.\n\n- `/private/var/mobile/Library/Caches/com.apple.routined/Cloud-V2.sqlite`\n\
    \n  As the name suggests, this database stores location data that should be synced\
    \ to iCloud.\n\n- `/private/var/root/Library/Caches/locationd/cache_encryptedDB.db`\n\
    \n  This database contains harvested location data received by Apple, such as\
    \ radio cells and Wi-Fi networks; these records refer to cell towers in close\
    \ proximity to the device, although the accuracy of these geo-coordinates should\
    \ always be checked.\n\n- `/private/var/root/Library/Caches/locationd/cache_encryptedC.db`\n\
    \n  This database stores data received from the device's accelerometer, such as\
    \ motion data and generic health-related artifacts.\n\n- `/private/var/root/Library/Caches/locationd/consolidated.db`\n\
    \n  Finally, this database is used by the GeoFence API, and any application that\
    \ creates a geofence will be stored here.\n\nTo gain a better understanding of\
    \ how location-related data is stored in these databases, we'll analyze each of\
    \ them separately and we'll learn what queries can be used to extract meaningful\
    \ insights.\n\n## Analyzing location data\n\nAs we've already learned, iOS devices\
    \ track a multitude of different location-related artifacts. The investigator\
    \ should have a clear understanding of how and where these are stored and which\
    \ ones are locations that the user actually visited, versus locations that were\
    \ simply in close proximity to the device.\n\nThe first step in a forensic analysis\
    \ of location data is the Cache.sqlite database. This database contains an extremely\
    \ accurate history of coordinates provided by the device's GPS receiver. Typically,\
    \ this data is stored for just over a week.\n\nWe're going to start by looking\
    \ at the ZRTCLLOCATIONMO table. The following is the table's structure:\n\n- ZLATITUDE\
    \ and ZLONGITUDE store the geocoordinates.\n- The ZALTITUDE column indicates an\
    \ estimate of the altitude. This data is provided by the device's accelerometer.\n\
    - The ZHORIZONTALACCURACY column indicates how accurate the device believes the\
    \ coordinates to be, expressed in meters.\n- ZVERTICALACCURACY indicates the altitude's\
    \ accuracy, in meters.\n- The ZTIMESTAMP column stores the timestamp, in Mac Absolute\
    \ Time format.\n\nA full history of the device's location data can be obtained\
    \ by running the following query:\n\n```\nSELECT\n    DATETIME(ZTIMESTAMP + 978307200,\
    \ 'UNIXEPOCH') AS \"TIMESTAMP\",\n    ZLATITUDE AS \"LATITUDE\",\n    ZLONGITUDE\
    \ AS \"LONGITUDE\",\n    ZALTITUDE AS \"ALTITUDE\",\n    ZSPEED AS \"SPEED (M/S)\"\
    ,\n    ZSPEED*2.23694 AS \"SPEED (MPH)\",\n    ZSPEED*3.6 AS \"SPEED (KMPH)\"\
    ,\n    ZHORIZONTALACCURACY AS \"HORIZONTAL ACCURACY\",\n    ZVERTICALACCURACY\
    \ AS \"VERTICAL ACCURACY\"\nFROM\n    ZRTCLLOCATIONMO;\n```\n\nFirst, we use the\
    \ datetime SQL command to convert the Mac Absolute timestamp to a readable string.\
    \ Then, we select the relevant columns from the table and calculate the speed\
    \ at which the device was moving.\n\nThe following figure shows the query results:\n\
    \n![](img/0b17a17d4cb56b1c25763a396dd83117_175_0.png)\n\nFigure 6.4 – The query\
    \ results show the device's location\n\nAs you can see, location artifacts provide\
    \ the investigator with an accurate idea of where a certain user's device was\
    \ at a given moment. Typically, this data is extremely granular and it's not uncommon\
    \ to see entries logged every second. The differences in the data's granularity\
    \ can be explained by the fact that GPS is not available everywhere, so on these\
    \ occasions, the device reverts to using Wi-Fi networks and cell towers to establish\
    \ its position, if there are any in close proximity.\n"
  mdcn: "\n这些蜂窝基站。通过这种机制，定位服务可以在几秒内获得粗略位置，然后在可用时报告更精确的 GPS 定位结果。\n\n每台 iOS 设备还有一个内部缓存，存储大量位置、蜂窝基站和\
    \ Wi-Fi 网络信息。通过访问本地缓存，设备无需数据连接即可通过 Wi-Fi 网络解析位置。为了使这些数据保持最新，缓存数据库会定期清除。\n\n除了这种基于对等设备的机制外，Apple\
    \ 还依赖外部来源将蜂窝基站和无线网络转换为物理位置。例如，战争驾驶（wardriving）是指一个人通常驾车移动，使用笔记本电脑或智能手机搜索无线电信号，并记录自己的\
    \ GPS 坐标以及与该无线电信号相关的数据。\n\n## 卫星 GPS\n\n传统 GPS，也称为卫星 GPS，是 iOS 设备最精确的位置数据来源。\n\
    \n该技术基于一个由 30 多颗卫星组成的网络，这些卫星在距地球 20,000 公里的高度绕地运行。每颗卫星都会通过无线电波向地球发射信号，其中包含卫星标识符、当前位置和时间戳。因此，当设备截获卫星信号时，它会利用信号接收时间与广播时间之间的时间差来计算从接收器到卫星的距离。然后，设备利用计算出的距离和卫星的位置来计算其大致位置。\n\
    \n值得注意的是，要计算精确位置，接收器必须锁定至少三颗卫星的信号。当视野中有四颗或更多卫星时，接收器可以确定其 3D 位置：**纬度**、**经度**和**海拔**。\n\
    \n某些大气因素和其他误差源会影响设备 GPS 接收器的精度；不过，接收器通常精度可以达到\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_171_0.png)\n\
    \n图 6.3 – 蜂窝基站三边测量过程\n\n不难看出，三边测量过程的精度会因蜂窝基站的位置和密度而有很大差异。\n\n## Wi-Fi 与蓝牙\n\n\
    与蜂窝基站类似，Wi-Fi 热点也会广播无线电信号，并且可以通过 RSSI 测量信号强度。移动设备会不断扫描无线热点，搜索已知网络，因此利用这些信息来计算设备的位置是有道理的。Wi-Fi\
    \ 信号的覆盖范围在室外仅约 70 米，室内约 40-50 米，因此如果设备收到信号，它一定在物理上靠近热点。\n\n考虑到这一点，移动设备如何通过评估 Wi-Fi\
    \ 网络的 RSSI 来确定设备与热点之间的大致距离就很清楚了。然后，iOS 使用前面描述的基于对等设备的机制将该数据解析为物理位置。\n\n蓝牙信标也可以以类似方式使用。\n\
    \n## 查找位置数据痕迹\n\n在本章的第一部分，我们介绍了定位服务 API，并了解了 iOS 如何使用不同技术来评估其位置。现在，我们将深入探讨存储地理位置数据的\
    \ SQLite 数据库。\n\n以下是一份只有在完整文件系统提取中才能找到的感兴趣文件列表：\n\n- `/private/var/mobile/Library/Caches/com.apple.routined/Cache.sqlite`\n\
    \n  这是 iOS 位置数据的主要存储方式。`ZRTCLLOCATIONMO` 表包含多条有用记录，例如 GPS 坐标、时间戳和水平精度值，该值表示设备认为\
    \ GPS 坐标的准确程度。`ZRTWIFIACCESSPOINTMO` 表存储了设备扫描过的 Wi-Fi 网络列表。一般来说，此数据库中的数据应被视为最新且准确的。\n\
    \n- `/private/var/mobile/Library/Caches/com.apple.routined/Local.sqlite`\n\n \
    \ 此 SQLite 数据库在结构上与 `Cache.sqlite` 数据库相同。根据 iOS 版本的不同，`ZRTLEARNEDLOCATIONOFINTERESTSMO`\
    \ 表通常包含任何*常去位置*的详细信息，我们稍后会研究这一点。\n\n- `/private/var/mobile/Library/Caches/com.apple.routined/Cloud-V2.sqlite`\n\
    \n  顾名思义，此数据库存储应同步到 iCloud 的位置数据。\n\n- `/private/var/root/Library/Caches/locationd/cache_encryptedDB.db`\n\
    \n  此数据库包含 Apple 收集到的位置数据，例如蜂窝小区和 Wi-Fi 网络；这些记录涉及与设备较近的蜂窝基站，但应始终检查这些地理坐标的准确性。\n\
    \n- `/private/var/root/Library/Caches/locationd/cache_encryptedC.db`\n\n  此数据库存储从设备加速度计接收的数据，例如运动数据和一般健康相关数据。\n\
    \n- `/private/var/root/Library/Caches/locationd/consolidated.db`\n\n  最后，此数据库供地理围栏（GeoFence）API\
    \ 使用，任何创建地理围栏的应用都会存储在这里。\n\n为了更好地理解位置相关数据如何存储在这些数据库中，我们将逐一分析它们，并了解可以使用哪些查询来提取有意义的见解。\n\
    \n## 分析位置数据\n\n正如我们已经了解到的，iOS 设备会追踪许多不同的位置相关数据痕迹。调查人员应清楚了解这些数据的存储方式和存储位置，以及哪些位置是用户实际访问过的，哪些只是靠近设备的位置。\n\
    \n位置数据的取证分析第一步是查看 `Cache.sqlite` 数据库。该数据库包含由设备 GPS 接收器提供的极其精确的坐标历史记录。通常，这些数据会存储一周多一点的时间。\n\
    \n我们将从查看 `ZRTCLLOCATIONMO` 表开始。以下是该表的结构：\n\n- `ZLATITUDE` 和 `ZLONGITUDE` 存储地理坐标。\n\
    - `ZALTITUDE` 列表示海拔的估算值。该数据由设备的加速度计提供。\n- `ZHORIZONTALACCURACY` 列表示设备认为坐标的准确程度，以米为单位。\n\
    - `ZVERTICALACCURACY` 表示海拔精度，以米为单位。\n- `ZTIMESTAMP` 列以 Mac 绝对时间格式存储时间戳。\n\n通过运行以下查询，可以获取设备位置数据的完整历史记录：\n\
    \n```\nSELECT\n    DATETIME(ZTIMESTAMP + 978307200, 'UNIXEPOCH') AS \"TIMESTAMP\"\
    ,\n    ZLATITUDE AS \"LATITUDE\",\n    ZLONGITUDE AS \"LONGITUDE\",\n    ZALTITUDE\
    \ AS \"ALTITUDE\",\n    ZSPEED AS \"SPEED (M/S)\",\n    ZSPEED*2.23694 AS \"SPEED\
    \ (MPH)\",\n    ZSPEED*3.6 AS \"SPEED (KMPH)\",\n    ZHORIZONTALACCURACY AS \"\
    HORIZONTAL ACCURACY\",\n    ZVERTICALACCURACY AS \"VERTICAL ACCURACY\"\nFROM\n\
    \    ZRTCLLOCATIONMO;\n```\n\n首先，我们使用 `datetime` SQL 命令将 Mac 绝对时间戳转换为可读字符串。然后，我们从表中选择相关列，并计算设备移动的速度。\n\
    \n下图显示了查询结果：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_175_0.png)\n\n图 6.4 –\
    \ 查询结果显示设备的位置\n\n如你所见，位置数据痕迹为调查人员提供了关于某个用户设备在特定时刻所处位置的准确信息。通常，这些数据粒度非常细，每秒记录一条条目也并不罕见。数据粒度的差异可以解释为：GPS\
    \ 并非在所有地方都可用，因此在这些情况下，设备会转而在附近有 Wi-Fi 网络和蜂窝基站时使用它们来确定其位置。\n"
