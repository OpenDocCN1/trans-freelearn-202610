  \ only (as TAR archive)\n  5  UNINSTALL        - Uninstall acquisition agent from\
  \ device\n\nLegacy devices acquisition\n  A  LEGACY           - Legacy devices acquisition\
  \ (iPhone 4/5/5C)\n\n  X  EXIT\n\n>:\n```\n\n图 11.1 – Elcomsoft iOS Forensic Toolkit\
  \ 可以使用配对记录采集锁定设备\n\n\n\n\n\n如果设备配置为生成未加密的备份，该工具将自动设置一个临时密码，以确保备份过程中所有数据都能被获取。\n\n\
  在下一节中，我们将讨论密码破解。\n\n## 密码破解\n\n过去，有几种方法可以尝试破解设备的密码，例如连接到设备的*黑盒*，可以对所有可能的组合进行暴力破解。不幸的是，这些方法仅支持旧设备。\n\
  \n从 iPhone 5s 开始，苹果引入了**安全隔区**，有效减慢了密码尝试的速度，使暴力破解攻击变得不可能。\n\n仍然有一些软件工具可用于此目的，例如\
  \ Elcomsoft 的 iOS 取证工具包，它可以对运行 iOS 4 至 iOS 10 的 iPhone 4、5 和 5c 进行密码暴力破解。\n\n如果检查人员有幸遇到这些设备之一，可以执行完整的物理获取，破解密码，并有效访问锁定的设备。要执行暴力破解攻击，设备必须启动到**DFU\
  \ 模式**，并通过**Checkm8**漏洞进行利用。对**六位密码**的完整暴力破解攻击在 iPhone 5 上大约需要 21 小时，在 iPhone 4\
  \ 上最多需要 40 小时。\n\n如果密码破解不可行，且未找到锁定记录，执行 BFU 获取可能是唯一的选择。我们将在下一节讨论这些获取方式。\n\n## 锁定设备的\
  \ BFU 获取\n\n在*第 2 章*《*从 iOS 设备获取数据*》中，我们介绍了**Checkm8**漏洞和**checkra1n**越狱，它们允许检查人员完全访问从**iPhone\
  \ 5s**到**iPhone X**设备的文件系统。即使密码未知，也可以利用此漏洞对*锁定*或*已禁用*的设备执行获取。这种获取方式称为**BFU 获取**。\n\
  \n重要的是要理解，BFU 获取仅允许*部分*提取设备数据，因为大多数文件在输入密码之前仍处于加密状态。尽管如此，部分提取（包括钥匙串中的数据）绝对比什么都没有好，因为这些可能包含重要的证据。\n\
  \n下表列出了通过 BFU 获取可以提取的一些最常见的工件：\n\n| 工件 |\n|---|\n| `/private/var/mobile/Library/Preferences/*`\
  \ |\n| `/private/var/preferences/SystemConfiguration/*` |\n| `/private/var/root/Library/Preferences/*`\
  \ |\n| `/private/var/mobile/Library/Accounts/Accounts3.sqlite` |\n| `/private/var/mobile/Library/DataAccess/*`\
  \ |\n| `/private/installd/Library/Logs/MobileInstallation/*` |\n| `/private/var/mobile/Library/SpringBoard/*`\
  \ |\n| `/private/var/mobile/Library/CallHistoryDB/CallHistoryTemp.storedata` |\n\
  | `/private/var/mobile/Library/Preferences/com.apple.*` |\n| `/private/var/mobile/Library/SMS/sms-temp.db`\
  \ |\n| `/private/var/mobile/Library/Preferences/com.apple.preferences.network.plist`\
  \ |\n| `/private/var/wireless/Library/Databases/CellularUsage.db` |\n| `/private/var/root/Library/Caches/locationd/consolidated.db`\
  \ |\n\n表 11.1 – BFU 获取中发现的常见工件\n\n从表中可以看出，只要设备易受 Checkm8 攻击，就可以通过 BFU 获取从锁定设备中提取一些关键工件。\n\
  \n要执行 BFU 获取，首先使用 checkra1n 对设备进行越狱，这不需要设备解锁。然后，部分提取**钥匙串**，并使用诸如 Elcomsoft iOS\
  \ 取证工具包之类的工具执行文件系统获取。一些取证工具，如**Cellebrite UFED**，不需要设备越狱，因为 Checkm8 漏洞利用直接在工具内执行。\n\
  \n### 使用 Elcomsoft iOS 取证工具包执行 BFU 获取\n\n以下步骤描述了使用 Elcomsoft iOS 取证工具包执行 BFU 获取的过程：\n\
  \n1. 首先，将设备置于恢复模式并启动 checkra1n。\n2. 按照说明将设备置于 DFU 模式并应用临时越狱。确保设备使用 USB-A 线缆连接，因为使用\
  \ USB-C 线缆将无法工作。\n3. 启动 Elcomsoft iOS 取证工具包，并选择 **K – Keychain** 选项。\n4. 当工具提示输入密码时，按\
  \ *Enter* 跳过此步骤。\n5. 当过程完成时，从主菜单中选择 **F – File System** 选项以获取设备的文件系统。\n6. 当工具提示输入密码时，按\
  \ *Enter* 并等待过程完成。\n\n以下截图说明了该过程：\n\n图 11.2 – Elcomsoft iOS 取证工具包执行 BFU 获取\n\n接下来，我们将使用不同的工具重复该过程。\n\
  \n### 使用 Cellebrite UFED 执行 BFU 获取\n\n使用 Cellebrite UFED 执行 BFU 获取也很简单，并且不需要通过 checkra1n\
  \ 对设备进行越狱：\n\n1. 启动 Cellebrite UFED。\n2. 选择 Advanced Logical，然后选择 Full File System\
  \ (checkm8) 选项。\n3. 使用 USB-A 线缆连接设备，然后点击 Continue。\n4. 当工具提示输入设备密码时，点击 Cancel。\n\
  5. 点击 YES 以执行 BFU 获取。\n\n```\nWARNING: Please, unlock the device and specify passcode\
  \ (if needed). Otherwise, press any key to proceed in a locked state, but be aware,\
  \ that not all data may be retrieved\n\nYou pressed a key - app will try to dump\
  \ all available items\nOverall dumped 3031 items of class 'genp'\nOverall dumped\
  \ 1 items of class 'inet'\nOverall dumped 29 items of class 'cert'\nOverall dumped\
  \ 117 items of class 'keys'\nOverall dumped 6 items of class 'idnt'\n\nCleaning\
  \ up...\n[INFO] Info: New connection...\n[INFO] Device connected\n[INFO] USBMuxConnectByPort\
  \ OK\nWarning: Permanently added '[localhost]:3022' (RSA) to the list of known hosts.\n\
  \nDone.\n\nPress 'Enter' to continue\n```\n\n以下截图显示了选择 BFU 获取的步骤：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_286_0.png)\n\
  \n图 11.3 – Cellebrite UFED 执行 BFU 获取\n\n获取过程完成后，可以像往常一样手动或使用取证软件（如**Cellebrite Physical\
  \ Analyzer**）分析钥匙串和文件系统转储。\n\n### 提示\n\n值得一提的是，执行 BFU 获取完全绕过了 USB 受限模式；随着 iOS 11\
  \ 的推出，苹果引入了一项安全功能，如果设备在过去一小时内至少未解锁一次，则阻止 USB 配件进行任何数据连接。理论上，这应该限制物理连接的*黑客工具*的攻击面；然而，通过\
  \ Checkm8 利用设备会绕过此安全功能。\n\n尽管 BFU 获取是从锁定设备提取数据的最佳选择，但很明显，较新的设备——不易受 Checkm8 攻击——无法使用此方法获取。试图访问这些设备的调查人员将不得不求助于将手机发送到提供取证服务的第三方实验室，例如\
  \ Cellebrite Advanced Services。\n\n如果无法*直接*获取设备，仍有可能通过定位和分析设备的**备份**来*间接*提取其数据，该备份可能存储在主机或**云**中。\n\
  \n在本章的下一节中，我们将介绍 iTunes 备份，并学习如何提取和分析它们。\n\n## 介绍 iTunes 备份\n\n如果涉案 iPhone 是较新型号，如**iPhone\
  \ 13**或**iPhone 12**，调查一台被未知密码锁定的设备可能会迅速使调查陷入停滞；然而，如果嫌疑人已将其设备备份到台式机或笔记本电脑，并且调查人员可以访问该机器，则可以轻松恢复、提取和分析备份。\n\
  \n检查备份可能有益的另一个原因是，用户可能已从移动设备中删除了一些数据，但这并不会删除备份中存在的数据：事实上，备份文件包含用户认为不再存在的数据是很常见的。\n\
  \n本地备份，也称为**iTunes 备份**，本质上是设备的逻辑获取，通常包含联系人、短信、媒体文件、日志、数据库、钥匙串、偏好设置、配置、浏览痕迹和位置数据等。用户可以手动使用**iTunes**创建备份，或者设备可以配置为在插入机器时自动创建新备份。在\
  \ macOS 计算机上，不再需要 iTunes，备份过程可以直接从**Finder**开始。\n\n创建 iTunes 备份时，iOS 允许用户通过使用密码加密备份来增强安全性。一旦用户设置了密码，所有后续备份都将被加密，并且只有在知道密码的情况下，检查人员才能访问这些文件。然而，密码\n\
  \n\n\ncracking can be attempted, and this will be covered in detail later on in\
  \ the chapter.\n\nIt's important to understand that since iOS 13, iTunes backups\
  \ will not contain user-sensitive data (such as call logs, keychain, and Safari\
  \ history) if encryption is not enabled.\n\n## Locating backup files\n\nAn iTunes\
  \ backup is essentially a folder named with a GUID that contains numerous subfolders\
  \ and files. The following screenshot should give you an idea of what it looks like:\n\
  \n![](img/0b17a17d4cb56b1c25763a396dd83117_288_0.png)\n\nFigure 11.4 – File structure\
  \ of an iTunes backup\n\nOn Windows machines, iOS backups are typically stored at\
  \ C:\\Users\\<user>\\AppData\\Roaming\\Apple Computer\\MobileSync\\Backup. If, however,\
  \ the Windows app version of iTunes is installed, local backups will be stored at\
  \ C:\\Users\\<user>\\Apple\\MobileSync\\Backup.\n\nOn machines running macOS, local\
  \ backups will be stored at /Users/<user>/Library/Application Support/MobileSync/Backup/.\n\
  \nBy examining these locations, the investigator may find multiple backups of the\
  \ same device, or backups for different devices.\n\nIn the root folder of each backup,\
  \ there are four files of interest:\n\n- Info.plist: This property list contains\
  \ details from the device such as the IMEI, ICCID, model number, the list of all\
  \ installed applications, and the timestamp of when the backup was created.\n- Manifest.db:\
  \ The Manifest database is a normal SQLite database, but it will be encrypted if\
  \ a password was specified for the backup. The main table of interest, Files, contains\
  \ a list of all files included in a backup and their properties, such as fileID,\
  \ domain, and path.\n- Manifest.plist: The Manifest property list stores information\
  \ for every application that is installed on the device, such as the path to the\
  \ app's containers. This file also contains the IsEncrypted key, which indicates\
  \ whether the backup was encrypted or not, and the WasPasscodeSet key, which tells\
  \ us whether the device had a passcode.\n- Status.plist: This property list contains\
  \ generic metadata, such as the backup's unique identifier and the timestamp of\
  \ when it was completed.\n\nSince we now have all the information from a backup,\
  \ we can start putting the filesystem back together using our forensic tools.\n\n\
  ## Analyzing iTunes backups\n\nOnce the investigator has located an iTunes backup,\
  \ the filesystem has to be rebuilt and the files will need to be decrypted. Although\
  \ this can also be done manually, the easiest solution is to import the backup into\
  \ any mobile forensic software, such as Cellebrite Physical Analyzer or **Elcomsoft\
  \ Phone Viewer**, and analyze the data as usual.\n\nTo import an iOS backup into\
  \ Cellebrite Physical Analyzer, follow these steps:\n\n- 1. Launch the tool and\
  \ from the main menu, choose **File | Open case**.\n- 2. Then, in **Case wizard**,\
  \ click on **Add**.\n- 3. Choose **Common source | Backup | iTunes backup**.\n-\
  \ 4. Select the folder that contains the backup and click **Continue**.\n\nOnce\
  \ Cellebrite Physical Analyzer has finished parsing the files, the artifacts can\
  \ be examined as if they were a normal logical acquisition. The following screenshot\
  \ shows the correct option within **Case wizard**:\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_290_0.png)\n\
  \nFigure 11.5 – Loading an iTunes backup into Cellebrite Physical Analyzer\n\nPreviously,\
  \ we learned that iTunes backups can be encrypted by setting a custom password.\
  \ On such occasions, if the password is not known, the\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_293_0.png)\n\
  \nFigure 11.7 – Set up a dictionary attack or a brute-force attack\n\n- 4. You can\
  \ set additional parameters, such as the password length, common character sets,\
  \ or custom character sets. Then, click Done.\n- 5. Click on Start recovery to begin\
  \ the process.\n\nFrom the research that has been carried out, it's recommended\
  \ to attempt brute-forcing a four-digit password first, followed by a six-digit\
  \ password and a dictionary attack, as these are the most common and easily crackable.\n\
  \nUnfortunately, there are some cases in which recovering the password to an iTunes\
  \ backup is simply not possible, or there may even be no local backup available.\
  \ In these situations, one of the possible courses of action is to attempt to download\
  \ and extract backups or data synced to iCloud.\n\nThe final section of this chapter\
  \ will discuss iCloud forensics.\n\n## Introducing iCloud forensics\n\nIn October\
  \ 2011, Apple introduced **iCloud**, a cloud-based platform that allows users to\
  \ store and share files between their devices, and backup their data. iCloud is\
  \ integrated directly into iOS and is accessible from Windows machines, macOS computers,\
  \ or directly from the web by browsing to https://www.icloud.com.\n\nFrom a forensic\
  \ viewpoint, cloud forensics is arguably the future of mobile forensics as it allows\
  \ investigators to access data that may not even be stored on the device itself.\
  \ As the majority of new devices do not (yet) support jailbreaks and full filesystem\
  \ acquisitions, performing a cloud acquisition is a great alternative.\n\nBefore\
  \ we dive deep into the technical details of extracting data from iCloud, it's important\
  \ to understand exactly what kind of data we can expect to find, starting with **iCloud\
  \ backups**.\n\n### iCloud backups\n\nSince the release of iOS 5 in 2011, Apple\
  \ allows users to back up their devices automatically to their iCloud accounts.\
  \ These backups are similar to the iTunes backups we discussed in the previous section\
  \ and include most of the data that is stored on a device, such as application data,\
  \ device settings, call logs, messages, notes, and Safari history.\n\nThe user can\
  \ elect to include or exclude certain elements from the backup directly from the\
  \ device by navigating to **Settings | [User] | iCloud | Manage storage | Backups.**\n\
  \nTo perform an iCloud backup, there is no need to connect the device to a computer,\
  \ as the backup process happens automatically during the night when the device is\
  \ charging and connected to a Wi-Fi network. The process can also be started manually\
  \ from the device.\n\nCloud backups are made incrementally to save space and time,\
  \ and typically, at least two or three backups are retained in the cloud. All data\
  \ is securely encrypted both in transit and in storage, and the encryption key is\
  \ stored by Apple in the user's iCloud account. More sensitive data, such as Apple\
  \ Card transactions and health data, is secured with a stronger form of protection\
  \ known as **end-to-end encryption**; this data is encrypted using keys derived\
  \ from information unique to the device, so nobody – not even Apple – has access\
  \ to this data.\n\nTip\n\nWhen an investigation involves a locked device that cannot\
  \ be acquired using any of the methods described in previous chapters, one of the\
  \ possible workarounds is to take advantage of iCloud's automatic backup capabilities.\
  \ Putting the device close to a known Wi-Fi network and charging it for a few hours\
  \ will trigger the creation of a new backup that can then be downloaded and analyzed,\
  \ revealing the data stored on the device.\n\nBackups are not the only thing that\
  \ is stored in iCloud, as iOS also provides automatic syncing capabilities for certain\
  \ data categories.\n\n### iCloud synced data\n\nSyncing data between iOS devices\
  \ has become a seamless experience for the user thanks to iCloud. The following\
  \ is a list of the most common categories that are synced to the cloud:\n\n- Account\
  \ information\n- User settings\n- Mail\n- Call history\n- Messages\n- Contacts,\
  \ notes, and calendars\n- Safari history, tabs, and bookmarks\n- iCloud Keychain\n\
  - Apple Health\n\nThe user has a certain degree of control over what data is synchronized\
  \ to iCloud, as syncing can be enabled on a per-app setting directly from the device.\
  \ The following screenshot shows iCloud syncing settings, which can be accessed\
  \ by going to **Settings** | **[User]** | **iCloud** and toggling individual apps\
  \ in the **Apps using iCloud** section:\n\n\n\n## iCloud\n\n### STORAGE\n\niCloud\
  \ — 已使用 50 GB 中的 13.6 GB\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_297_0.png)\n\
  \n- Photos\n- Backups\n- Docs\n\nManage Storage\n\n### APPS USING iCLOUD\n\n| App\
  \ | Status |\n| --- | --- |\n| Photos | On |\n| Mail | Off |\n| Contacts | On |\n\
  | Calendars | On |\n| Reminders | On |\n| Notes | On |\n| Messages | Off |\n| Safari\
  \ | On |\n| Stocks | On |\n| Home | On |\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_298_0.png)\n\
  \nFigure 11.8 – Apps using iCloud from the device settings\n\niCloud 同步数据可使用取证工具下载，前提是调查人员对云数据的访问具有合法权限。下载同步数据对于调查可能极具价值，因为它能让检查人员快速访问特定证据，无需下载整个备份。\n\
  \n### Accessing iCloud data\n\nApple 可通过法律请求向执法部门提供对 iCloud 备份和同步数据的访问权限。由于 Apple\
  \ 持有用户的 **加密密钥**，他们可以解密用户大部分的 iCloud 数据，除使用端到端加密的敏感数据外。\n\n此解决方案存在若干缺点：\n\n- 由于请求的数据量庞大，处理执法和政府请求的过程非常缓慢。\n\
  - Apple 返回的数据不完整，因为它不包含敏感证据，例如 Apple Card 交易、钥匙串、消息和 Safari 历史记录。\n\n还有其他选项允许调查人员直接从\
  \ iCloud 拉取数据，但这些请求必须由 Apple 服务器授权，需提供某种形式的 **身份验证凭据**。\n\n目前，iCloud 凭据可以以三种不同格式提供：\n\
  \n- **Apple ID 和密码**：如果调查人员对用户的 Apple ID（*电子邮件地址*）和密码具有合法访问权限，则可使用这些凭据访问 iCloud\
  \ 数据、下载备份和同步数据，对其解密并将数据转换为 iTunes 备份。如果账户启用了 **双重验证 (2FA)**，则需要访问设备或 SIM 卡。\n- **身份验证令牌：**\
  \ 令牌是一小部分二进制数据，其作用类似于浏览器 cookie，用于登录网站。身份验证令牌用作用户凭据的替代，允许设备在无需每次请求都提供 Apple ID 和密码的情况下对\
  \ iCloud 进行身份验证。如果用户曾从 Windows 或 macOS 机器登录其 iCloud 账户，且调查人员可访问该计算机，则可使用令牌在无需 Apple\
  \ ID 和密码的情况下访问 iCloud 数据。尽管 Apple 经常更改 iCloud 身份验证协议，目前令牌仅在有限时间内有效，且只能在生成它们的机器上使用。最后，使用令牌只能访问\
  \ iCloud 中存储的部分数据，例如照片、iCloud Drive 文件、电子邮件、通话记录和 Safari 历史记录。截至撰写时，身份验证令牌无法用于访问\
  \ iCloud 备份。令牌可通过 Elcomsoft Phone Breaker 提取。\n- **受信任设备：** 如果没有 Apple ID 和密码，但调查人员可访问用户的设备，仍可能访问用户所有的\
  \ iCloud 数据。设备必须已登录 iCloud 资料，且必须知道设备的密码。要访问 iCloud，请将设备连接到工作站并运行 Elcomsoft Phone\
  \ Breaker。建立信任关系后，该工具将侧载提取代理到设备上，检查人员将看到可提取的 iCloud 备份和数据的列表。目前，此解决方案适用于运行 iOS 9\
  \ 至 14.3 的设备，或越狱设备。\n\n通过向 Apple 服务器提供用户的凭据，调查人员将能够从 iCloud 拉取备份和同步数据，可能揭示设备本身上已不再存在的关键证据。接下来，我们将讨论\
  \ **iCloud 钥匙串**。\n\n### Introducing iCloud Keychain\n\n云取证的强大之处在于，在某些情况下，即使没有对特定设备的物理访问，也有可能获取\
  \ iOS 备份。存储在 iCloud 中的大量用户数据对于任何移动取证调查或事件响应案件都至关重要。\n\n## Summary\n\n在本章中，我们介绍了锁定设备的主题，并了解了各种调查方法，这些方法可导致获取未知密码的设备。首先，我们学习了锁定记录的位置以及如何使用它们对锁定设备执行逻辑获取。然后，我们简要讨论了密码破解，然后转向\
  \ BFU 获取。接下来，我们学习了 iTunes 备份的存储位置以及如何分析其元数据。最后，在本章的最后一节中，我们通过了解哪些数据同步到云端、如何访问它以及如何使用取证工具提取它，介绍了\
  \ iCloud 取证。\n\n在本书的最后一章中，我们将学习如何编写移动取证报告以及如何将设备的证据导出到时间线。\n\n## Section 3 – Reporting\n\
  \n在这一部分，你将了解在报告中正确结构化数据的重要性，以及如何使用时间线来呈现数据。\n\n本书的这一部分包含以下章节：\n\n- *Chapter 12*,\
  \ Writing a Forensic Report and Building a Timeline\n\n### Chain of custody\n\n\
  一份记录良好的 **保管链** 将取证过程联系在一起，并支持证据的完整性，以便其可在法庭上作为证据出示。无法记录保管链的任何阶段都可能损害证据的真实性和完整性，使其在法庭上无用。撰写报告的人员还应描述设备如何与蜂窝和数据网络隔离。\n\
  \n### Device acquisition\n\n整个获取过程应详细描述，从用于该目的的工具名称开始。此数据也可以以表格形式报告，并应包括软件名称、制造商、确切版本号以及工具所使用的任务。如果执行了侵入性技术，例如越狱设备以获取完整文件系统获取，检查人员必须记录执行此类操作的原因。通常，越狱设备或执行基于代理的获取是必要的，因为逻辑获取中不存在所需的特定数据。在这种情况下，检查人员必须提供任何可能在获取过程中发生的数据更改的详细技术说明。\n\
  \n### Analysis process\n\n通常，检查人员在检查过程中会使用多种工具：一种工具用于执行获取，另一种工具用于分析，以及其他工具用于手动解析数据，例如\
  \ SQLite 查看器。报告应明确列出这些工具，说明是否以及何时执行了手动检查以及为何有必要。如果使用了多种工具且数据存在差异，应在报告中包含此信息。这非常常见，因为单一工具不可能支持所有第三方\
  \ iOS 应用程序。\n\n### Evidence\n\n检查结果应在此报告部分中详细列出。根据调查范围，可能存在数千个证据；因此，证据应在报告中按逻辑排列并分为类别，例如电话日志、浏览历史和\
  \ WhatsApp 消息等。对于每个证据，应标明源文件和哈希值。\n\n描述证据的另一种方式是通过 **时间线**，我们将在下一节更详细地介绍。使用时间线，事件列表按特定顺序表示——通常按时间顺序——这是一种很好的技术，用于确定设备在特定时间发生了何种活动。\n\
  \n一些检查人员喜欢在此部分添加注释以解释数据或根据证据得出结论。个人而言，我认为不应在此部分撰写任何结论，因为该部分应以客观方式简单描述证据。数字取证检查员的工作是查找事实并呈现证据，然后由调查员、辩护方或检察官解释证据如何支持调查。\n\
  \n### Comments and conclusions\n\n报告的最后一部分将概述检查的关键点。在此，检查员可以指出任何观察，描述测试和检查的结果。数据的相关性应通过关联不同来源来解释。例如，仅在报告中说明消息是从设备发送的是不够的；消息应用程序的证据应与设备日期和时间、时区、生活模式数据和应用程序使用日志相关联。良好的做法是描述检查员如何\n\
  \n\n**完整报告**，可以自定义包含或排除工具解析出的任何类型的数据项。\n\n让我们从生成初步报告开始。\n\n## 生成初步设备报告\n\n调查团队可以使用初步设备报告，根据将获取数据加载到\
  \ Cellebrite Physical Analyzer 后提取的一些基本数据，快速识别设备。\n\n有两种方式可以生成此报告：\n\n- 从工具的主菜单中，选择\
  \ **报告 | 生成初步设备报告**。\n- 在 **提取摘要** 中，点击 **生成初步设备报告**。\n\n以下截图显示了该按钮的位置：\n\n## 提取摘要\n\
