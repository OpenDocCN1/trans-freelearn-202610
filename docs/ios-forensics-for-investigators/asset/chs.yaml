- "## 第 3 章：使用取证工具\n\n在上一章中，我们学习了有关不同采集技术的所有知识，以及如何使用取证工具从 iOS 设备中提取数据。在本章中，我们将学习用于数据分析的最受欢迎的工具，以及它们的特性和局限性。\n\
  \n尽管使用取证工具进行数据分析并非严格必需，因为理论上可以手动检查文件，但使用这些工具具有许多优势。与手动解析痕迹相比，使用取证工具最明显的好处是时间：如果使用正确，这些工具是巨大的时间节省者，因为它们被编程为自动搜索相关文件、查找模式、分析已知数据结构，并从常见痕迹中提取有意义的见解。使用适当的工具可确保不会遗漏宝贵的痕迹，尽管调查人员应始终验证此类工具的输出并了解其局限性。没有完美的取证工具——每个工具都有其缺陷！大多数工具允许调查人员检查第三方应用程序以及系统应用程序，并且还可以配置为对这些应用程序自动执行自定义数据雕刻。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 了解取证工具\n- 使用 Cellebrite Physical Analyzer\n- 使用 Magnet AXIOM\n\
  - 使用开源工具\n\n### 了解取证工具\n\n一旦 iOS 设备及其存储的证据被成功扣押、保存并通过取证可靠的方式提取\n\n\n\nAcquisition\
  \ process, the next steps involve processing and analyzing the extracted data.\n\
  \nCurrently, there are a number of commercial tools available on the market that\
  \ perform data analysis, such as *Cellebrite Physical Analyzer*, *Oxygen Forensic\
  \ Detective*, *Magnet AXIOM*, *Belkasoft Evidence Center*, *MSAB XRY*, *EnCase Forensic*,\
  \ and many others. In this chapter, we'll work with two of these tools, **Cellebrite\
  \ Physical Analyzer** and **Magnet AXIOM**.\n\nWe've already seen how mobile forensics\
  \ presents several additional challenges compared to digital forensics, and one\
  \ significant difference has to do with how data extracted from iOS devices is analyzed;\
  \ with mobile device forensics, using a single tool to process and analyze the evidence\
  \ is extremely risky, as one solution will not provide all the tools that support\
  \ all devices and all iOS versions. Generally speaking, forensic tools work by parsing\
  \ files of interest (such as SQLite databases, plists, and log files) and running\
  \ a series of **plugins** on these files that look for key evidence in predefined\
  \ locations. What this means is that more recent applications may not be supported\
  \ because if there isn't a plugin for a given app, forensic tools will not automatically\
  \ display data for that application! No one tool can process and analyze all artifacts\
  \ from every mobile device.\n\nTo choose the best tools for your purpose, you need\
  \ to know the following:\n\n- Where the tool will search for data\n- What a tool\
  \ is doing to the extracted data\n- How the tool will represent the data\n\nFor\
  \ instance, iOS devices sometimes compress log files into archives to save space\
  \ on disk. If your tool does not automatically extract files from archives that\
  \ are found in an iOS extraction, you could be missing some key evidence. Make sure\
  \ you understand exactly what files your tool parses and what files it doesn't.\n\
  \n## Tool validation\n\nOnce the investigator has assessed which tool is the best\
  \ fit for a particular scenario, the tool and its output should be **validated**\
  \ before starting the examination process. Validating a tool is the process of determining\
  \ through testing that it performs in a certain way and that the results are consistent.\n\
  \nIn particular, the investigator should verify the following:\n\n- The tool does\
  \ not alter the data in any way.\n- The data provided by the tool is consistent\
  \ with what is displayed on the device.\n- The data represented by the tool is consistent\
  \ with what you find in the source file of that particular piece of data.\n- The\
  \ results are consistent among different forensic tools.\n\nValidation is increasingly\
  \ important when dealing with unsupported third-party applications or **Unidentified\
  \ Forensic Objects (UFOs)**, as some tools have some built-in features that use\
  \ heuristics to attempt data extraction from these artifacts, but sometimes the\
  \ results can be incomplete or inconsistent.\n\n## Tip\n\nOne of the most common\
  \ ways to get to know your tools and validate their output is by using them to analyze\
  \ a known device, such as your personal iPhone. Use your device to perform normal\
  \ day-to-day activity and take notes. Then, extract and analyze data from the device\
  \ using several tools and check that it gets reported correctly.\n\nAlthough forensic\
  \ tools will greatly aid the investigator by speeding up the entire process, this\
  \ software should not substitute the process of manually viewing and assessing the\
  \ files that were extracted in the acquisition process.\n\n## Working with Cellebrite\
  \ Physical Analyzer\n\nCellebrite software is generally regarded as the golden standard\
  \ for mobile forensics among law enforcement and security organizations due to its\
  \ powerful features, wide device compatibility, frequent updates, and easy-to-use\
  \ user interface. Their most popular tools are **Cellebrite Universal Forensic Extraction\
  \ Device (Cellebrite UFED)**, which we used in the previous chapter to acquire the\
  \ device's filesystem, and **Cellebrite Physical Analyzer**, which is used for data\
  \ analysis and reporting.\n\nWe will now learn how to import the extracted data\
  \ into Physical Analyzer and then we'll go over some of the main features of this\
  \ powerful tool.\n\n### Loading evidence and selective decoding\n\nThe first step\
  \ in a Physical Analyzer examination is loading the evidence into the tool. You\
  \ can accomplish this by using the **case wizard**, which is a step-by-step procedure\
  \ that will guide you through the process and also show you some optional features\
  \ that can be enabled. One of these is **selective decoding**, which allows investigators\
  \ to perform faster parsing and analysis by selecting specific applications or specific\
  \ categories that should be parsed in addition to common system artifacts. This\
  \ is especially useful when you're dealing with devices that have dozens of installed\
