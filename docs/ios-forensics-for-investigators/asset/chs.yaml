  \n使用 AXIOM Examine 进行数据分析的起点是案件仪表板；从这个视图中，你可以查看关于案件的信息，并\n\n如果不提及一些最好的开源 iOS 取证工具，本章将不完整！**DFIR（数字取证与事件响应）**社区是现有最活跃、最有帮助的社区之一，这些工具是安全研究人员、取证检验员和开发人员辛勤工作和热情的结晶，他们与社区分享了他们的知识。\n\
  \n### Apollo\n\n**Apple Pattern of Life Lazy Output'er（APOLLO）** 是一个由 Sarah Edwards\
  \ 编写的 Python 脚本（你可以在 Twitter 上找到她——@iamevltwin），它处理 iOS 和 macOS 证据以提取生活模式数据，并将结果合并到单个\
  \ SQLite 数据库或 CSV 文件中以供查看。\n\n该脚本基于许多不同的模块（其中一些由 DFIR 社区编写），每个模块运行一个或多个查询，以从 iOS\
  \ 提取数据中提取特定数据。我们将在*第 5 章*、*生活模式取证*中广泛使用这个强大的工具。\n\n你可以从项目的 GitHub 仓库下载 APOLLO：https://github.com/mac4n6/APOLLO。\n\
  \n### iLEAPP\n\n**iOS 日志、事件和属性列表解析器（iLEAPP）** 是一个由 Alexis Brignoni（Twitter – @AlexisBrignoni）用\
  \ Python 3 编写的脚本，是商业取证工具的免费替代品。该工具可以解析完整的 iOS 文件系统提取数据，解析和解码你在 iOS 设备上能找到的几乎所有类型的证据。\n\
  \n就个人而言，我发现这是除商业软件之外很好用的工具，因为它可以帮助验证你的发现。\n\n你可以从 https://github.com/abrignoni/iLEAPP\
  \ 下载 iLEAPP。\n\n### iOS Triage\n\n\n\n\n\n此工具是一个由 Mattia Epifani（Twitter – @mattiaep）编写的\
  \ Unix **shell 脚本**，可用于从越狱的 iOS 设备中提取数据。如果你需要对设备进行初步分类检查（包括处于 **BFU** 状态的设备），这是一个快速的解决方案。我们将在本书后面的内容中使用\
  \ iOS Triage。\n\n你可以从 GitHub 下载此工具：\nhttps://github.com/RealityNet/ios_triage。\n\
  \n## Sysdiagnose\n\n这是 Mattia Epifani（@mattiaep）、Adrian Leong 和 Heather Mahalik（@HeatherMahalik）对\
  \ iOS 设备生成的**日志文件**进行研究后得出的成果。\n\n这些 Python 脚本将解析日志文件，并提供商业取证工具可能遗漏的有用证据。\n\n你可以从以下地址下载这些脚本：\n\
  https://github.com/cheeky4n6monkey/iOS_sysdiagnose_forensic_scripts。\n\n## 使用 iLEAPP\
  \ 分析数据\n\n让我们来看看 iLEAPP 是如何工作的，以及使用此工具可以提取哪些类型的证据。\n\n在安装 iLEAPP 之前，请确保你的系统上已安装\
  \ Python 3。第一步是通过克隆仓库从 GitHub 下载代码。你可以运行以下命令来完成此操作：\n\n```bash\ngit clone https://github.com/abrignoni/iLEAPP.git\n\
  ```\n\n然后，我们需要安装所需的软件包：\n\n```bash\ncd iLEAPP\npip install -r requirements.txt\n\
  ```\n\n现在一切就绪，我们可以运行 iLEAPP 了。在此示例中，我们提供一个 ZIP 压缩包作为输入文件，并将报告导出到输出文件夹：\n\n```bash\n\
  python3 ileapp.py -t zip -i ../iphone_dump.zip -o output\n```\n\n如你所见，我们使用 `-t`\
  \ 选项指定提供的输入类型，使用 `-i` 选项指定输入文件的路径，使用 `-o` 选项指定输出文件夹的路径。\n\niLEAPP 处理完成后，结果将合并到一份\
  \ HTML 报告中：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_108_0.png)\n\n图 3.21 – iLEAPP\
  \ 生成的报告\n\n报告将包含各种痕迹和有用的证据，包括**账户数据、蜂窝数据、位置信息、应用程序数据、设备使用数据、联系人、消息**等等！\n\n这个开源软件是一个非常强大的工具，我绝对建议你多动手操作它，以充分了解它的潜力。\n\
  \n## 总结\n\n在本章中，我们了解了最流行的商业取证工具有哪些，以及通过使用多种工具、比较它们的输出、在开始检验之前运行验证测试来验证结果的重要性。\n\n\
  请记住，尽管这些工具极其有用，并且大大减轻了调查人员的工作，但工具本身不是证据。报告也不是证据。证据就是证据，检验人员的工作是理解该证据是如何生成的、它代表什么，以及通过分析该证据能获得哪些见解。取证软件确实有其用武之地，但它不应取代对痕迹的手动检查。换句话说，可以使用这些工具，但不要盲目相信它们，并确保你了解后台正在发生的事情。\n\
  \n在本章后续部分，我们重点介绍了其中两款工具：Cellebrite Physical Analyzer 和 Magnet AXIOM。我们学习了如何将数据导入这些工具，以及如何使用软件的功能（如\
  \ AppGenie 或 Connections 资源管理器）来深入挖掘数据并获得有用的见解。\n\n最后，在本章的末尾部分，我们了解了一些有用的开源脚本，并使用\
  \ iLEAPP 从完整的文件系统提取中提取并分析了痕迹。\n\n在下一章中，我们将讨论 iOS 文件系统，并学习到哪里查找核心的 iOS 痕迹。\n"
- "## 第 4 章：处理常见的 iOS 痕迹\n\n在前面的章节中，我们从广义上讨论了 iOS 操作系统的工作方式以及移动检验工作流程的不同阶段。然后，我们学习了各种获取方法，以及如何从设备中提取最丰富的数据。在第三章中，我们研究了取证工具，并通过将数据加载到工具中进行分析来继续我们的检验过程。\n\
  \n移动取证调查中最关键的方面之一是验证你的发现。我们已经在前面章节中讨论了工具验证的重要性，但这个过程应进一步扩展，以确保所收集数据的完整性，并理解和解释数据的上下文，因为这对于在法庭上将其作为证据出示至关重要。这通常需要追踪源文件，并以原始格式手动查看痕迹。\n\
  \n在本章中，我们首先介绍 iOS 设备上最常见的痕迹类型，以及如何以其原始格式查看它们。然后，我们将深入探讨 SQLite 数据库，了解它们在内部如何管理数据存储，以及我们有哪些选项可以恢复已删除的记录。最后，我们将仔细查看文件系统，了解系统痕迹位于何处，通过分析这些数据我们能获得哪些见解，以及特定应用程序的痕迹在哪里可以找到。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 理解验证的重要性\n- 处理 iOS 痕迹\n- 定位常见痕迹\n\n### 理解验证的重要性\n\n在第三章“使用取证工具”中，我们了解了\
  \ Cellebrite Physical Analyzer 和 Magnet AXIOM 等软件的一些功能，并对这些工具可能分析出的数据有了更好的理解。\n\n\
  你可能会想，当这些工具已经为你完成了所有繁重的工作时，为什么检验人员还要花时间学习手动分析设备上找到的数据。首先，虽然这些软件是调查人员工具箱中的必备物品，但调查人员也应该了解这些工具的局限性，以及如何处理无法自动解析的痕迹；尽管取证工具声称支持各种不同的应用程序和痕迹，但这并不意味着这些产品能够真正解析与正在检验的特定应用程序相关的所有数据。随着移动应用程序的更新速度，取证工具不支持最近更新的应用程序，或者在某些情况下仅部分支持（只提供部分而非全部可用数据）的情况相当常见。在这种情况下，调查人员必须求助于以原始格式手动检查源文件。\n\
  \n调查人员想要查看痕迹源文件的另一个原因是验证他们的发现；即使取证工具已经产生了可观的结果，将数据与源文件进行交叉引用以理解该数据的上下文也是非常重要的。例如，通过分析\
  \ SQLite 数据库中的表，调查人员不仅可以理解存储了哪些数据，还可以理解这些数据在设备上是如何存储的，以及操作系统如何记录特定事件，例如来电、短信或通知。\n\
  \n如果在检验过程中发现了对整个调查至关重要的关键痕迹，检验人员应准备好回答如下问题：\n\n- 这些数据是如何到达那里的？\n- 当我们将其置于上下文中时，这些数据告诉了我们什么？\n\
  - 该痕迹是用户活动的结果，还是由操作系统生成的？\n- 它与设备上发现的其他数据是如何交互的？\n\n这些问题的答案往往存在于痕迹的源文件中，因此学习如何手动分析此类文件是负责\
  \ iOS 设备检验过程的人员必须具备的技能。\n\n**验证**的重要性怎么强调都不为过；使用经验证的方法论来检验设备，通过验证工具输出来确保工具正常工作，以及通过深入研究源文件以理解数据的上下文来验证你的发现，这些都可能对调查的最终结果产生巨大影响。在某些情况下，这可能使某人失去工作与否，或者在极端情况下，决定他们是否入狱。\n\
  \n在我们讨论 iOS 设备上常见痕迹的位置之前，下一节我们将学习如何在典型检验中手动处理你将会遇到的最常见文件类型。\n\n### 处理 iOS 痕迹\n\n\
  一般来说，可以在 iOS 设备上找到的痕迹可分为以下类别之一：\n\n- SQLite 数据库\n- 属性列表\n- 协议缓冲区\n- XML 文件\n- 日志文件\n\
  \n\n\n\n\n虽然最后两个文件不会构成任何问题，因为它们本质上是文本文件，可以用几乎任何文本编辑器查看，但其他文件可能（并且通常是）以**二进制格式**存储，因此需要特定的工具或库来解析数据。\n\
  \n## 介绍 SQLite\n\n几乎每款 iOS 设备上的应用程序，包括系统自带的 **Messages**、**Contacts** 或 **Email**，都需要一个长期存储数据的场所。这是通过使用\
  \ **SQLite** 实现的，SQLite 是一种开源、小型、自包含的关系型数据库。SQLite 数据库可以通过 `.sqlite` 或 `.sqlite3`\
  \ 文件扩展名识别，尽管有些数据库使用 `.db` 扩展名，或其他扩展名。\n\nSQLite 在移动设备中如此受欢迎的原因在于其简单架构和出色的性能。以下是其部分特性：\n\
  \n- **SQLite 是自包含的：** 整个数据库包含在一个文件中，该文件可直接集成到应用程序中。其无服务器架构意味着数据库作为一个独立文件工作，而非传统的客户端-服务器协议。\n\
  - **SQLite 跨平台：** 数据库驻留在单个跨平台文件中，可以被 SQLite 支持的所有操作系统访问，包括 Windows、macOS、Linux、Android、iOS、BSD、Solaris\
  \ 等。\n- **SQLite 完全符合 ACID：** 这允许多个应用程序或线程安全访问。它还支持大多数 SQL 查询语言，这是与几乎所有现代关系型数据库系统交互的主要方式。\n\
  \n既然我们已经了解了 SQLite 的特性，让我们来看看它如何存储数据。\n\n## 表、列和行\n\nSQLite 数据库的基本概念应该很容易形象化——数据库包含一个或多个**表**，每个表包含的数据按**列**和**行**组织。列代表单个数据元素，例如\
  \ *电话号码* 或 *地址*，而行代表一组值，每个列一个值。\n\nSQLite 支持五种不同的数据类型：\n\n- INTEGER\n- TEXT\n- REAL\n\
  - BLOB\n- NULL\n\n前三种类型不言自明。**二进制大对象 (BLOB)** 数据类型将任何输入原样保留，而不将其转换为某种类型；BLOB 数据类型通常用于在\
  \ SQLite 记录中存储复杂二进制数据结构，例如 **属性列表** 或 **协议缓冲区**。NULL 数据类型仅存储空值。\n\n要从数据库检索数据，你运行一个**查询**，它是一组用\
  \ **SQL 语言** 编写的逻辑指令，用于解析给定表以提取你想要的数据。查询的结果实际上表示为另一个表，如以下屏幕截图所示。\n\n为了了解查询的样子，让我们看一个简单示例。以下查询从\
  \ sms.db 数据库中提取最后五条消息：\n\n```\nSELECT ROWID, text FROM message\nORDER BY ROWID DESC\n\
  LIMIT 5;\n```\n\n输出可在以下屏幕截图中看到：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_115_0.png)\n\
  \n图 4.1 – DB Browser for SQLite 中显示的查询结果\n\n在不深入细节的情况下，我们将暂时关注此查询以了解 SQL 语言的基础。显然，如果你正在对\
  \ SQLite 数据库进行取证检查，你不希望以任何方式修改数据。因此，所有查询很可能都以 SELECT 子句开头，这表示我们希望从表中读取数据。\n\n在第一行，我们选择要包含在结果中的列（ROWID\
  \ 和 text）以及表名——在本例中为 message 表。查询的第二行指示结果应按什么顺序显示。在示例表中，每条短信都由递增的 ROWID 列标识，因此为了显示最近的消息，我们按此列以降序排列结果。由于我们只对五条消息感兴趣，我们使用\
  \ LIMIT 命令来指示应显示多少行。\n\n### 提示\n\n如果你是 SQL 语言的新手，可以通过访问 SQLite 网站学习如何编写最常见的查询类型\n\
  \nhttps://www.sqlite.org/lang.html.\n\n作为取证检查员，你运行的查询通常涉及过滤和搜索数据，因此你可能想了解 CASE、WHEN\
  \ 和 WHERE 等命令。我们将在本章中看到更复杂的查询。\n\n## 运行 SQL 查询\n\n大多数取证工具都附带内置数据库查看器，允许调查人员查看整个数据库并在工具内部直接运行查询；然而，还有其他选择：\n\
  \n- **SQLite 命令行实用程序**，可从 http://www.sqlite.org 下载，允许从命令行直接与数据库交互。\n- 其他免费工具，例如\
  \ **DB Browser for SQLite**，允许用户通过 **图形用户界面 (GUI)** 查看数据库并在其上运行查询。DB Browser for\
  \ SQLite 可从 https://sqlitebrowser.org 下载。\n\n调查人员应熟悉用于直接访问数据库的工具，因为当检查范围仅限于一个或多个\
  \ SQLite 数据库时，这些工具将证明是巨大的时间节省者。使用 Cellebrite Physical Analyzer 或 Magnet AXIOM 等取证工具分析这些数据库会导致需要将整个提取加载到内存中解析；这可能非常耗时，具体取决于提取数据的大小。\n\
  \n## 使用 SQLite 命令行工具\n\nsqlite3 是 SQLite 库的一部分的命令行实用程序。macOS 和大多数 Linux 发行版已预装它，而\
  \ Windows 用户可以从上一节中列出的 SQLite 网站下载可执行文件。\n\n要从命令行打开 SQLite 数据库，只需输入以下内容：\n\n```\n\
  sqlite3 filename.db\n```\n\n如果指定名称的数据库不存在，SQLite 将为你创建它。一旦你打开数据库，将显示一个 SQL 提示符，你可以在其中运行查询和命令。有许多内置命令可以用来获取数据库及其表的基本信息。\n\
  \n如果你不熟悉数据库布局，可以通过运行 .tables 命令列出其中的所有表：\n\n```\nsqlite> .tables\nattachment   \
  \              message\nchat                       message_attachment_join\nchat_handle_join\
  \           message_processing_task\nchat_message_join          sync_deleted_attachments\n\
  deleted_messages           sync_deleted_chats\n```\n\n如果你对特定表感兴趣，输入 .schema 后跟表名以显示表的列和数据类型：\n\
  \n```\nsqlite> .schema handle\nCREATE TABLE handle (ROWID INTEGER PRIMARY KEY AUTOINCREMENT\
  \ UNIQUE, id TEXT NOT NULL, country TEXT, service TEXT NOT NULL);\n```\n\n通过查看列名和类型，你应该能够大致了解表中存储了什么数据。在此示例中，handle\
  \ 表中的每一行都有一个自动递增的 ROWID 列和三个 TEXT 类型的列：id、country 和 service。\n\n如果你想从表中检索数据，使用 SELECT\
  \ 查询：\n\n```\nSELECT * FROM handle;\n```\n\n完成后，输入 `.exit` 或 `.quit` 终止 SQLite 会话。\n\
  \n## 页面、真空化和预写日志\n\nSQLite 的一个特性使其对取证检查员如此有趣，即有可能从数据库中恢复**已删除记录**。根据数据库的范围，这可能意味着恢复已删除的短信、浏览器历史记录或与设备活动相关的日志。为了更好地理解数据恢复如何实现，我们需要退一步，了解\
  \ SQLite 在底层如何管理 `write` 和 `delete` 操作。\n\n我们已经了解到，从逻辑角度来看，数据库中的数据组织成包含列和行的表。这是一个高级抽象层，允许用户使用简单易于可视化的数据模型（如列和行）与数据库交互；然而，在更低级别，SQLite\
  \ 库实际上在文件系统上以不同的方式组织数据，将数据存储到**页面**中。页面类似于文件系统中的块，其目的是以二进制格式存储数据。SQLite 数据库中的每个页面可以有可变大小，默认大小为\
  \ 4096 字节，每个页面都有一个不同的编号。第一个页面包含一个 100 字节的头部，可以使用 **十六进制查看器** 分析，例如在 macOS 和 Linux\
  \ 上可用的 hexdump 命令行实用程序。\n\n例如，要查看名为 `sms.db` 的 SQLite 数据库的头部，我们将执行以下命令：\n\n```\n\
  ```bash\nhexdump -n 100 -C sms.db\n```\n```\n\n`-n` 参数指定应显示的字节数。由于 SQLite 有固定大小的头部，我们只对前\
  \ 100 字节感兴趣。`-C` 参数告诉 hexdump 实用程序也以字符串格式显示数据：\n\n\n\n```\n00000000  53 51 4c 69\
  \ 74 65 20 66  6f 72 6d 61 74 20 33 00  |SQLite format 3.|\n00000010  10 00 02 02\
  \ 00 40 20 20  00 00 00 13 00 00 00 43  |.....@ ......C|\n00000020  00 00 00 00\
  \ 00 00 00 00  00 00 00 50 00 00 00 04  |..........P...|\n00000030  00 00 00 00\
  \ 00 00 00 00  00 00 00 01 00 00 00 00  |..............|\n00000040  00 00 00 00\
  \ 00 00 00 00  00 00 00 00 00 00 00 00  |..............|\n00000050  00 00 00 00\
  \ 00 00 00 00  00 00 00 00 00 00 00 13  |..............|\n00000060  00 2e 24 80\
  \                                         |..$.|\n00000064\n```\n\n图 4.2 – hexdump\
  \ 命令的输出\n\n如你所见，前 16 个字节包含 SQLite 3 格式字符串。你可以通过以下表格作为参考来解析头部其余部分：\n\n| Offset |\
  \ Size | Description |\n|---|---|---|\n| 0 | 16 | 头部字符串：\"SQLite format 3\\000\"\
  \ |\n| 16 | 2 | 数据库页大小，以字节为单位。 |\n| 18 | 1 | 文件格式写入版本。1 为传统；2 为 WAL。 |\n| 19 | 1\
  \ | 文件格式读取版本。1 为传统；2 为 WAL。 |\n| 20 | 1 | 每个页面末尾未使用的“保留”空间的字节数。通常为 0。 |\n| 21 |\
  \ 1 | 最大嵌入有效载荷比例。必须为 64。 |\n| 22 | 1 | 最小嵌入有效载荷比例。必须为 32。 |\n| 23 | 1 | 叶节点有效载荷比例。必须为\
  \ 32。 |\n| 24 | 4 | 文件更改计数器。 |\n| 28 | 4 | 数据库文件以页为单位的大小。 “头部中的数据库大小”。 |\n| 32 |\
  \ 4 | 第一个空闲列表主干页面的页号。 |\n| 36 | 4 | 空闲页面的总数。 |\n| 40 | 4 | 模式 cookie。 |\n| 44 |\
  \ 4 | 模式格式编号。支持的模式格式为 1、2、3 和 4。 |\n| 48 | 4 | 默认页面缓存大小。 |\n| 52 | 4 | 自动真空模式下最大根\
  \ B 树页面的页号，否则为零。 |\n| 56 | 4 | 数据库文本编码。值为 1 表示 UTF-8。值为 2 表示 UTF-16le。值为 3 表示 UTF-16be。\
  \ |\n| 60 | 4 | 由 user_version pragma 读写和设置的“用户版本”。 |\n| 64 | 4 | 增量真空模式为真（非零）。否则为假（零）。\
  \ |\n| 68 | 4 | 由 PRAGMA application_id 设置的“应用程序 ID”。 |\n| 72 | 20 | 保留用于扩展。必须为零。\
  \ |\n| 92 | 4 | 版本有效期编号。 |\n| 96 | 4 | SQLITE_VERSION_NUMBER |\n\n图 4.3 – SQLite\
  \ 数据库头部参考\n\n为了表示表及其数据，SQLite 使用平衡树（B-tree）数据结构来组织页面，这是一种存储数据的高效方式。实际包含数据的页面，也称为活动页面，被分配给一个节点，该节点的功能是连接页面。\n\
  \n文件中的活动页面进一步细分为 **cells**，它们是页面中包含数据库中每一行数据的段。当添加新单元格时，SQLite 会尝试将它们放置在页面的底部。页面中第一个单元格之前的空闲空间称为\
  \ **unallocated space**。从取证角度来看，未分配空间非常有趣，因为它可能为空，但也可能包含先前删除的数据或先前使用页面的片段。\n\n当数据从数据库中删除时，对应的单元格或页面实际上并未被删除，而是被简单地\
  \ *标记* 为已删除。被标记为删除的页面称为 **free pages**，SQLite 通过将它们添加到另一个数据结构 **free-list** 来管理这些页面。从数据库中删除单个记录会在页面中创建间隙；这些空间称为\
  \ **free blocks**，SQLite 通过将它们添加到链表来跟踪这些空间。\n\n如前表所示，数据库头部在偏移量 32 处告诉我们空闲列表中的第一个页面的编号，而空闲页面的总数可以通过查看偏移量\
  \ 36 处的值来读取。数据库中的每个页面还都有一个 8 或 12 字节的头部，具体取决于页面的类型。以下表格说明了页面头部的格式：\n\n| Offset |\
  \ Size | Description |\n|---:|---:|---|\n| 0 | 1 | 偏移量 0 处的单字节标志，表示 B 树页面类型。 - 值为\
  \ 2（0x02）表示页面是内部索引 B 树页面。 - 值为 5（0x05）表示页面是内部表 B 树页面。 - 值为 10（0x0a）表示页面是叶索引 B 树页面。\
  \ - 值为 13（0x0d）表示页面是叶表 B 树页面。 |\n| 1 | 2 | 偏移量 1 处的双字节整数给出页面上第一个空闲块的起始位置，如果没有空闲块则为零。\
  \ |\n| 3 | 2 | 偏移量 3 处的双字节整数给出页面上的单元格数量。 |\n| 5 | 2 | 偏移量 5 处的双字节整数指定单元格内容区域的起始位置。此整数的值为零时解释为\
  \ 65536。 |\n| 7 | 1 | 偏移量 7 处的单字节整数给出单元格内容区域内的碎片化空闲字节数。 |\n| 8 | 4 | 偏移量 8 处的四字节页号为最右指针。此值仅出现在内部\
  \ B 树页面的头部中，并从所有其他页面中省略。 |\n\n图 4.4 — SQLite 页面头部参考\n\n有了这些信息，我们就可以使用十六进制查看器手动解析文件，并查找包含已从数据库中删除的数据的空闲页面。幸运的是，有工具可以自动化此任务！\n\
  \n## Vacuuming\n\n你可以通过检查删除数据时数据库文件大小是否发生变化来确认 SQLite 保留已删除页面的事实。因此，在正常情况下，文件大小只能随着向数据库写入新数据而增长。此外，随着向数据库添加和删除新记录，数据可能会变得碎片化，因为空闲页面会散布并混合在整个文件中。这意味着数据库中保存特定表的实际部分不会在文件中连续存储，这会影响性能。\n\
  \n下图说明了当数据写入数据库并从中删除时发生的情况，导致文件碎片化：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_121_0.png)\n\
  \n图 4.5 — 碎片化 SQLite 数据库中的页面\n\n对 SQLite 数据库进行 **vacuuming** 的过程通过读取数据库中的逻辑数据（表、列和行）并将其写入临时文件来解决这些问题，同时忽略空闲页面。因此，该过程会从头开始重建数据库文件，重新打包活动页面，并对文件中的数据进行碎片整理。过程完成后，临时文件的内容将被复制回原始数据库，覆盖它。\n\
  \n下图显示了运行 VACUUM 命令后的同一数据库；数据库中存储的记录显然没有变化，但现在活动页面存储在一起且空闲页面不存在：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_122_0.png)\n\
  \n图 4.6 – 真空处理过程后 SQLite 数据库中的页面\n\n应该很清楚，一旦真空处理过程完成，从数据库中恢复已删除记录几乎是不可能的。研究表明，iOS\
  \ 会定期为大多数 SQLite 数据库运行 VACUUM 命令。然而，在撰写本文时，具体何时发生尚不明确，因为它似乎在很大程度上取决于设备型号和 iOS 版本。\n\
  \n## Write-ahead logging\n\n到目前为止，我们一直专注于分析主数据库文件，以了解数据如何在该文件中存储以及在哪里查找已删除记录。然而，从取证角度来看，还有其他不应被忽视的文件，例如\
  \ SQLite 临时文件。你在 iOS 设备上找到的最常见的临时文件类型是称为预写日志（WAL）的日志文件。\n\nWAL 文件可以通过其文件名轻松识别，因为\
  \ -wal 字符串被附加到数据库名称上。因此，例如，如果我们正在处理一个名为 sms.db 的 SQLite 数据库，WAL 文件将被称为 sms.db-wal，并且它将创建在与主数据库文件相同的目录中。这些临时文件并不总是存在，因为只有将日志模式设置为\
  \ WAL 的数据库才会使用预写日志方法。\n\n根据已开展的研究，可以肯定地说，iOS 设备上的大多数数据库都启用了 WAL 模式。如果是这种情况，当添加、修改或删除数据时，事务会存储在\
  \ WAL 文件中，而不是直接存储在主 SQLite 数据库中。同样，在从数据库读取数据时，SQLite 引擎会确定特定记录的最新版本存储在哪里，并从适当的文件中读取它：\n\
  \n![](img/0b17a17d4cb56b1c25763a396dd83117_123_0.png)\n\n图 4.7 – 添加到数据库的新记录会附加到\
  \ WAL 文件\n\n应用程序希望在其数据库中启用 WAL 模式的原因有很多。最重要的原因是性能；页面按顺序写入 WAL 文件，并且对数据库的每次更改都会导致一次磁盘写入。此外，由于文件分离，使用多个线程的应用程序可以在写入数据库的同时从中读取。\n\
  \n\n\n\n\n在某个时间点，WAL 文件中的数据必须转移回主数据库。此过程称为 **checkpoint**。通常，SQLite 会在 WAL 文件达到一定大小时（默认情况下为\
  \ 1,000 页）或在最后一次数据库连接关闭时自动执行 checkpoint：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_124_0.png)\n\
  \nFigure 4.8 – A checkpoint transfers data from the WAL file back into the main\
  \ database\n\n## Tip\n\n需要知道的是，当所有与数据库的连接都已干净关闭时，SQLite 会执行自动 checkpoint。因此，如果你在使用\
  \ DB Viewer 之类的工具时启用了 WAL 关闭数据库，WAL 文件的内容将被转移到主数据库，并且 WAL 文件将被删除。\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_127_0.png)\n\
  \nFigure 4.11 – Using a hex viewer to display the contents of an SQLite file\n\n\
  通过分析数据库头以了解页面大小以及空闲页面和空闲块的位置，检查员可以使用自己选择的工具通过指定偏移量和长度来突出显示文件中的特定页面，从而有效地将该页面与剩余数据隔离开来。然后可以通过以字符串格式显示其内容来分析该页面。\n\
  \n以下步骤描述了手动解析 SQLite 数据库页面的过程：\n\n- 1. 读取数据库头并识别页面大小和页面数量。\n- 2. 计算每个页面的偏移位置。\n\
  - 3. 分析页面头。\n- 4. 如果是活动页面，请在未分配空间或空闲块中搜索任何有用的证据。如果是空闲页面，则分析整个页面。\n- 5. 对数据库中的每个页面重复此过程。\n\
  \n同样的原则也适用于 WAL 文件；由于文件格式有详细记录，检查员可以使用十六进制查看器打开 WAL，计算每个帧的偏移量，隔离每个单独的帧，并通过将其转换为\
  \ UTF-8 字符串来查看数据以识别任何可读字符串。\n\n作为示例，我们将创建一个名为 test.db 的新数据库，其中包含一个名为 Fruits 的表。然后，我们将向数据库中填充几条记录，删除一行数据，并使用十六进制查看器分析文件。为简单起见，数据库将不使用预写日志。\n\
  \n你可以使用自己选择的软件或 sqlite3 命令行工具创建数据库。然后，运行以下查询：\n\n```\nCREATE TABLE \"Fruits\" (\n\
  \    \"ROWID\"    INTEGER,\n    \"Fruit\"    TEXT,\n    PRIMARY KEY(\"ROWID\" AUTOINCREMENT)\n\
  );\nINSERT INTO \"Fruits\" VALUES (1,'Apple');\nINSERT INTO \"Fruits\" VALUES (2,'Peach');\n\
  INSERT INTO \"Fruits\" VALUES (3,'Orange');\nINSERT INTO \"Fruits\" VALUES (4,'Banana');\n\
  DELETE FROM Fruits WHERE ROWID == 1;\n```\n\n正如以下屏幕截图所示，表中现在包含三行，如预期那样：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_128_0.png)\n\
  \nFigure 4.12 – The table contains three rows of data\n\n我们检查的第一步是使用十六进制查看器打开文件并分析\
  \ 100 字节的头，以从数据库中提取任何有用的信息：\n\nbytes, and copy the data to a new window in your\
  \ editor. From now on, the offsets will be relative to the page:\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_130_0.png)\n\
  \nFigure 4.14 – The page header\n\n现在我们已将第二页加载到十六进制编辑器中，下一步涉及检查页面头：\n\n- - 在偏移量\
  \ `01` 处，我们可以读取第一个空闲块的位置，即 `0x0FF6` 或十进制格式的 `4086`。\n- - 偏移量 `04` 处的值表示页面上的活动单元格数量，`3`。\n\
  - - 通过查看偏移量 `05`，我们可以找到第一个非空数据单元格的位置，即 `0x0FD6` 或 `4054`。\n- - 最后，头与第一个数据单元格之间的空间是未分配空间。\n\
  \n有了这些信息，我们可以突出显示从偏移量 4086 开始并延伸到页面底部的空闲块；十六进制查看器的右窗格将数据显示为 UTF-8 字符串：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_131_0.png)\n\
  \nFigure 4.15 – The free block shows previously deleted data\n\n正如你所见，之前从数据库中删除的名为\
  \ Apple 的记录仍然存在于文件中，在第二页的空闲块的右侧。\n\n## Carving for strings\n\n数据雕刻是搜索文件中特定字符串或字节的过程；检查员首先确定要搜索的字符串或模式，然后使用十六进制查看器或命令行工具在文件中搜索该字符串或模式。此过程是手动解析\
  \ SQLite 数据库的绝佳替代方案，因为它允许调查人员立即验证给定记录是否可以在文件中找到，包括已删除数据通常隐藏的位置。\n\nstrings 工具是一个命令行实用程序，可在二进制文件中执行字符串雕刻并将结果打印到屏幕上。显示\
  \ SQLite 数据库中可以找到的所有字符串与运行以下命令一样简单：\n\n```\nstrings sms.db\n```\n\n此工具可以与其他命令（如\
  \ grep）结合使用，以搜索特定字符串或模式。以下命令将在我们之前示例中使用的数据库中搜索 Apple 单词：\n\n```\nstrings test.db\
  \ | grep Apple\nApple\n```\n\n正如你所见，Apple 字符串被打印到屏幕上，这证实了它在 SQLite 数据库中被找到。这个简单的工具可以成为显示数据库中存储的所有字符串的救命技巧，包括已删除的数据！\n\
  \n## Recovering deleted records using FQLite\n\n手动从 SQLite 数据库中恢复已删除数据的任务可能令人望而生畏；幸运的是，大多数商业取证工具都内置了此功能，但也有其他选择。截至撰写本文时，FQLite\
  \ 可能是最完整的开源 SQLite 恢复工具，原因如下：\n\n- - 它是用 Java 编写的，因此你可以在任何操作系统上运行它。\n- - 它支持从所有数据库页面恢复已删除记录，包括空闲块和未分配空间。\n\
  - - 它内置支持 WAL 文件。\n- - 恢复的记录可以以 CSV 格式导出。\n\n要下载 FQLite，请访问 https://www.staff.hs-mittweida.de/~pawlaszc/fqlite/\
  \ 或前往位于 https://github.com/pawlaszczyk/fqlite 的 GitHub 仓库。\n\n我们现在将简要介绍从 sms.db\
  \ SQLite 数据库中恢复已删除数据的过程：\n\n- 1. 启动 FQLite 并通过转到 File | Open Database 选择要尝试恢复的数据库。\n\
  - 2. FQLite 现在将处理文件并分析数据库，搜索已删除记录。你可以通过查看屏幕底部的日志面板来跟踪进度。\n- 3. FQLite 完成后，从左侧面板中选择要检查的数据库或\
  \ WAL 文件。\n- 4. FQLite 将显示一个包含数据库中找到的所有数据的表，包括已删除记录：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_133_0.png)\n\
  \nFigure 4.16 – FQLite recovers deleted records from an SQLite database\n\n到目前为止，你应该对\
  \ SQLite 的工作原理、调查人员如何通过命令行工具检查数据库以及数据恢复的最常见技术有了良好的理解。我们现在将更进一步，查看另一种流行的数据结构。\n\n\
  ## Working with property lists\n\n虽然 Protobufs 在 iOS 设备上并不常见，但仍有一些应用程序使用它们来存储数据，因此调查人员应至少对如何处理这些文件有一个基本的了解。\n\
  \n由于 protobuf 以二进制格式存储，因此它们不可读；protoc 命令行工具允许你显示文件的内容，并让你大致了解数据的结构。\n\n## Tip\n\n\
  protoc 工具是 protocol buffers 包的一部分，可以从位于 https://github.com/protocolbuffers/protobuf\
  \ 的 GitHub 仓库下载。\n\n安装 protoc 工具后，可以通过运行以下命令将 protobuf 的内容打印到屏幕上：\n\n```\nprotoc\
  \ --decode_raw < [protobuf_blob_file]\n```\n\n使用协议缓冲区的应用程序示例包括 Apple **Notes**、Apple\
  \ **Maps** 和 **Spotify** 应用程序。\n\n现在我们对工件的外观以及如何手动分析它们有了更好的理解，下一个部分将提供 iOS 设备上最常见的证据位置的详尽列表，以及我们可以期望获得的见解。\n\
  \n## Locating common artifacts\n\n与应用程序相关的工件对于 iOS 调查至关重要，但设备设置、日志和用户生成的内容也很重要。在本章的最后一部分中，我们将研究\
  \ iOS 文件系统中的一些常见位置，检查员可以快速查看以收集更多信息：\n\n\n\n| Path | Description |\n|---|---|\n\
  | installd/Library/MobileInstallation/LastBuildInfo.plist | OS version |\n| mobile/Library/Preferences/com.apple.springboard.plist\
  \ | Order of apps |\n| mobile/Library/Preferences/com.apple.mobilegestalt.plist\
  \ | Device name |\n| mobile/Library/Preferences/com.apple.Preferences.plist | Disk\
  \ usage |\n| mobile/Library/Preferences/com.apple.purplebuddy.plist | Language |\n\
  | mobile/Library/Preferences/com.apple.commcenter.shared.plist | Phone number |\n\
  | mobile/Library/Preferences/com.apple.corerecents.recentsd.plist | iCloud data\
  \ |\n| preferences/SystemConfiguration/com.apple.networkidentification.plist | Network\
  \ data |\n| preferences/SystemConfiguration/NetworkInterfaces.plist | WiFi data\
  \ |\n| preferences/SystemConfiguration/preferences.plist | Cellular + WiFi |\n\n\
  表 4.2 – 常见的 iOS 设备 artifacts\n\n现在我们知道了在哪里查找设置和日志，接下来我们将快速了解一下用户生成的数据，例如消息或通话存储在哪里。表\
  \ 4.3 说明了一些最受欢迎的文件。像往常一样，路径均相对于 /private/var/：\n\n| Path | Description |\n|---|---|\n\
  | mobile/Library/Mail/Recents.db | Recent SMS and email metadata |\n| mobile/Media/Recordings/Recordings.db\
  \ | Audio recordings |\n| mobile/Media/PhotoData/Photos.sqlite | Photo categorization\
  \ |\n| mobile/Library/CallHistoryDB/CallHistory.storedata | Call log |\n| mobile/Library/SMS/sms.db\
  \ | SMS/MMS/iMessage |\n| mobile/Library/Safari/History.db | Browsing history |\n\
  | mobile/Media/DCIM/* | Photos |\n| mobile/Library/Accounts/Accounts3.sqlite | Account\
  \ details |\n\n表 4.3 – 常见的 iOS 用户 artifacts\n\n需要理解的是，这些表格仅包含一些最受欢迎的 artifacts，但还有很多、很多其他可能对调查有价值的文件。检查员应始终深入查看整个文件系统，以从数据中获得所有可用的见解。\n\
  \n## Summary\n\n在本章中，我们学习了在 iOS 设备上发现的最常见类型的 artifacts 以及如何分析这些文件。\n\n首先，我们介绍了数据库并学习了\
  \ SQLite 如何将数据组织成表、列和行。然后，我们深入研究了 SQLite 的内部架构，以了解记录在更低层级是如何组织的以及已删除记录可以在哪里找到。我们讨论了尝试恢复已删除数据的可能选项，例如通过十六进制查看器手动分析数据库或使用诸如\
  \ FQLite 之类的工具。\n\n在章节的后面部分，我们谈到了属性列表和协议缓冲区，它们也可以以 XML 或二进制格式在 iOS 设备上找到。为了可读，这些文件首先需要解码。\n\
  \n最后，在本章的最后一部分，我们概述了一些 artifacts 可能存在于的常见位置，并列出了在每次调查中都应考虑的一些基本文件。在下一章中，我们将讨论行为模式取证。\n"
- "## Chapter 5: Pattern-of-Life Forensics\n\n在上一章中，我们了解了可以在 iOS 设备上找到的不同类型的 artifacts，例如\
  \ SQLite 数据库和 plists，以及如何手动分析这些文件。在本章中，我们将利用这些知识来处理从取证角度来看最有趣的数据库，例如 **KnowledgeC**\
  \ 数据库，它是行为模式取证的首选解决方案。\n\n行为模式数据关乎设备所有者在日常生活中进行的习惯。对于智能手机而言，这包括在任何给定时间使用了哪些应用以及使用了多长时间，设备何时被解锁，电池温度是多少，以及用户正在浏览哪个网页。\n\
  \n我们将从定义行为模式取证开始，以便更好地理解在 iOS 设备调查中可能遇到的哪种数据。然后，我们将讨论时间戳以及如何在不同时区之间转换。然后，我们将深入研究\
  \ KnowledgeC、电源日志和设备事件，并学习如何识别用户交互。最后，我们将介绍 Apollo，这是一款开源工具，大大简化了定位和审查行为模式 artifacts\
  \ 的过程。\n\n在本章中，我们将涵盖以下主题：\n\n- Introducing pattern-of-life forensics\n- Working\
  \ with timestamps\n- Logs, events, and user interaction\n- Introducing Apollo\n\n\
  ### Introducing pattern-of-life forensics\n\n如果你从未有机会仔细查看 iOS 设备的行为模式数据，你可能会对在正常智能手机使用过程中收集、存储和处理的数据量和种类感到惊讶。通常，这些数据被操作系统用来为用户提供个性化推荐，例如\
  \ Siri 的建议。\n\n行为模式取证到底是什么？这些数据全部关乎 **user behavior** 和 **device usage**，它使调查人员能够回答以下问题：\n\
  \n- 用户使用设备做什么？\n- 他们访问了什么？\n- 他们与谁进行了通信？\n\n从取证角度来看，分析行为模式数据非常有用，不仅可以识别在给定时间段内设备上执行的所有活动，还可以构建设备所有者的画像；通过分析\
  \ iOS 收集的数据，调查人员将深入了解所有者的习惯，例如用户醒来时使用哪些应用，设备最常连接哪些 Wi-Fi 网络，网页历史记录和通知。构建可被视为正常的活动画像使调查人员能够立即检测到可能对调查感兴趣的\
  \ **patterns of abnormal behavior**。\n\n令人惊讶的是，行为模式数据在取证界得到的关注很少，主要是因为从设备获取相关 SQLite\
  \ 数据库的挑战；这些数据在设备正常使用期间无法访问，只能通过 **full filesystem acquisition** 访问。显然，这限制了可以从中提取此类数据的设备范围，但\
  \ **checkm8 exploit** 和其他依赖公共软件漏洞的 **agent-based acquisitions** 等技术使调查人员能够从大多数 iOS\
  \ 设备中访问用户活动和行为。\n\n### Meaningful SQLite databases\n\n以下是与行为模式取证相关的最常见数据库列表。我们将在本书后面对每个数据库进行深入研究：\n\
  \n- 用户和设备活动的主要来源是 `KnowledgeC.db` SQLite 数据库，它可以在 macOS 和 iOS 设备上找到。在 iOS 上，它位于\
  \ `/private/var/mobile/Library/CoreDuet/Knowledge/`，只能通过完整文件系统获取来访问。该数据库通常包含数十万条与设备事件和用户活动相关的记录。\n\
  \n- `interactionC.db` SQLite 数据库跟踪设备所有者与其联系人之间的最近交互，例如短信或通话。目前尚不清楚该数据库的保留期是多少，因为不同设备之间的数据不一致，但一般来说，调查人员会找到最近六个月的条目。虽然\
  \ `interactionC.db` 不包含对话的实际内容，但它包含可以与其他 artifacts 相关联的元数据。数据库可以在 `/private/var/mobile/Library/CoreDuet/People/`\
  \ 找到。\n\n- 位于 `/private/var/containers/Shared/SystemGroup/UUID/Library/BatteryLife/`\
  \ 的 `CurrentPowerLog.PLSQL` 文件跟踪与电池寿命相关的数据，例如使用情况和温度。\n\n- 另一个可以帮助调查人员了解设备在特定时间点运行了哪些进程的有趣数据库是\
  \ `DataUsage.sqlite` 数据库，它位于 `/private/var/wireless/Library/Databases/`。该数据库存储每个进程的网络使用统计信息。\n\
  \n\n\n\n\n与生活模式取证相关的最重要主题之一是位置数据；在 iOS 上，不止一个文件会跟踪用户在任意给定时间点所处的位置，并显示用户更常访问的地点，例如位于\
  \ `/private/var/root/Library/Caches/locationd/` 的 cache_encrypted.db 数据库，或者 consolidated.db\
  \ 数据库。每个数据库包含的数据具有不同的粒度和详细程度，我们将在下一章深入探讨这一主题。\n\n现在我们已经了解了哪些是最常见的生活模式数据来源，你可能会想知道这些数据库中究竟会记录哪些内容。下面的截图展示了在\
  \ Cellebrite Physical Analyzer 中查看的一些最有趣的生活模式数据痕迹：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_145_0.png)\n\
  \n图 5.1 – Cellebrite Physical Analyzer 中的设备事件\n\n### 将 Unix 时间戳转换为可读日期，反之亦然\n\n\
  1633614474 时间戳转人类可读日期 [批量转换]\n\n支持秒、毫秒、微秒和纳秒级别的 Unix 时间戳。\n\n假设该时间戳以秒为单位：\n**GMT**：2021\
  \ 年 10 月 7 日星期四 13:47:54\n**你的时区**：2021 年 10 月 7 日星期四 15:47:54 GMT+02:00 夏令时\n**相对时间**：几秒前\n\
  \n图 5.2 – 将 Unix 时间戳转换为字符串\n\n现在我们知道什么是 Unix 时间戳了，接下来看看如何使用 SQL 查询将其转换为可读的字符串。\n\
  \n在下面的示例中，我们有一个名为 Events 的单一表，包含三列：id、uuid 和 timestamp。timestamp 列使用 Unix 格式：\n\n\
  ```\nSELECT * FROM Events;\n```\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_147_0.png)\n\
  \n要将 Unix 时间戳转换为可读字符串，请运行以下查询：\n\n```\nSELECT id, uuid, datetime(timestamp, 'unixepoch')\
  \ AS date FROM Events;\n```\n\ndatetime SQL 函数会将 timestamp 列中的数值转换为字符串。结果时间以 UTC\
  \ 格式提供：\n\n```sql\nSELECT id, uuid, datetime(timestamp, 'unixepoch') AS date FROM\
  \ Events;\n```\n\n|   | id | uuid | date |\n|---|---:|---|---|\n| 1 | 1 | dbcab8a2-7766-453a-b3b0-3a14a1d6d417\
  \ | 2021-10-04 15:10:29 |\n| 2 | 2 | 25e66b36-f1ce-4fe3-9a30-3379bf724b00 | 2021-10-04\
  \ 15:11:39 |\n| 3 | 3 | 2844e9a3-df4a-4ac0-ab51-d68a47f1d0f... | 2021-10-04 15:13:26\
  \ |\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_148_0.png)\n\n要以本地时间格式显示字符串，请运行以下查询：\n\
  \n```sql\nSELECT id, uuid, datetime(timestamp, 'unixepoch',\n'localtime') AS date\
  \ FROM Events;\n```\n\n时区将反映所使用设备的设置，通常是调查人员的工作站。\n\n### Mac 时间戳\n\n另一种常用的时间戳格式是\
  \ Mac 绝对时间，其定义为自 2001 年 1 月 1 日 00:00:00 的 Mac 纪元以来经过的秒数。Mac 时间戳可以通过在线转换器转换为可读字符串，或者简单地将\
  \ Mac 时间戳加上自 **Unix 纪元**以来的秒数（978307200），然后转换为字符串。\n\n以下查询演示了将 Mac 时间戳转换为本地时区字符串的过程：\n\
  \n```sql\nSELECT id, uuid, datetime(timestamp + 978307200,\n'unixepoch', 'localtime')\
  \ AS date FROM Events;\n```\n\nMac 时间戳通常用于 iOS 的生活模式数据中，例如 KnowledgeC.db 数据库。\n\n\
  ## 日志、事件和用户交互\n\n在本章开头，我们介绍了生活模式取证，并了解了 iOS 如何存储和分析大量用户事件和设备事件。接着，我们学习了最常见的数据来源，如\
  \ KnowledgeC.db 数据库，并了解了 iOS 如何通过 Unix 时间戳和 Mac 绝对时间来表示时间。\n\n现在，我们将深入探讨你在 iOS 设备上会发现的最具取证价值的\
  \ SQLite 数据库之一。\n\n### KnowledgeC 数据库\n\nKnowledgeC.db 是跟踪几乎所有活动和设备事件（从电池电量到播放的音乐）的\
  \ SQLite 数据库。该数据库位于 `/private/var/mobile/Library/CoreDuet/Knowledge/`，只能通过完整文件系统提取来访问。该数据库由\
  \ 16 个表组成，但大部分有用数据都集中在其中一个表——ZOBJECT 表中。\n\n下面的截图展示了该数据库的架构：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_150_0.png)\n\
  \n图 5.5 – KnowledgeC 数据库的架构\n\n务必记住，此数据库中的数据只会保留大约四周，然后按先进先出的原则被清除，因此如果生活模式数据是调查中的关键部分，应尽快获取设备。\n\
  \n从取证角度来看，主要的关注表是 ZOBJECT 表，其中每一行对应一个事件或交互，数据分布在 40 列中。我们将简要介绍最有趣的几列，以理解该表如何记录事件：\n\
  \n- 每行包含一个 ZCREATIONDATE 列，记录条目写入数据库的时间戳（Mac 格式）。\n- ZSTARTDATE 和 ZENDDATE 列包含事件开始和结束时间的时间戳。\n\
  - ZSTARTDAYOFWEEK 列指示事件发生的星期几。\n- `ZSECONDSFROMGMT` 列以秒为单位指示 GMT 偏移量。\n- `ZSTREAMNAME`\
  \ 列指示发生的事件类型。\n- `ZVALUESTRING` 列显示与该事件相关的应用程序的包 ID。\n\n为了更好理解该数据库会记录哪些类型的事件，我们将分析\
  \ `ZSTREAMNAME` 列并检查其值。你可以通过运行以下 SQL 查询来查看事件类型列表：\n\n```\nSELECT DISTINCT ZOBJECT.ZSTREAMNAME\
  \ FROM ZOBJECT ORDER BY ZSTREAMNAME;\n```\n\n在一台运行 iOS 14.6 的最新 iOS 设备上，该查询返回了 50\
  \ 多种不同的事件类型。下面列出了一些最常见的事件类型以及如何解读 `ZOBJECT` 表中的数据。\n\n#### /device/batteryPercentage\n\
  \nbatteryPercentage 流类型表示设备电池的电量水平。百分比值存储在 `ZVALUEDOUBLE` 列中。\n\n#### /device/isPluggedIn\n\
  \n此事件指示设备是否已插入电源并正在充电。如果设备未插入电源，`ZVALUEINTEGER` 列将指示为 0；如果已插入电源，则指示为 1。\n\n####\
  \ /displayIsBacklit\n\n此事件流指示背光是否亮起。如果背光关闭，`ZVALUEINTEGER` 列将指示为 0；如果背光开启，则指示为 1。此事件在设备锁定时可用于检测人为交互；只需轻触屏幕就会点亮显示屏，从而触发此事件。\n\
  \n#### /device/isLocked\n\nisLocked 流类型指示设备是否处于密码锁定状态。锁定状态存储在 ZVALUEINTEGER 列中；值为\
  \ 0 表示设备已锁定，值为 1 表示设备未锁定。\n\n#### /app/inFocus\n\n此事件流指示哪个应用程序处于活动状态并在前台运行。ZVALUESTRING\
  \ 列存储应用程序的名称。可以分析 inFocus 事件以详细了解应用程序的使用情况。\n\n#### /notification/usage\n\n此事件流指示推送通知活动。ZVALUESTRING\
  \ 列显示记录的活动类型，例如 *接收*、*清除* 和 *忽略*。此事件也有助于识别用户活动，例如用户在设备锁定时忽略通知。\n\n#### /app/webUsage\n\
  \n此事件指示哪个应用程序正在使用互联网连接。ZVALUESTRING 列显示应用程序的名称。\n\n#### /display/orientation\n\n\
  orientation 事件指示设备方向的变化。如果设备处于竖屏模式，`ZVALUEINTEGER` 列将指示为 0；如果处于横屏模式，则指示为 1。\n\n\
  #### /media/nowPlaying\n\n\n\n\n此事件表示设备上正在播放多媒体内容。ZVALUESTRING 列将显示正在播放该内容的应用信息，例如\
  \ YouTube 或 Apple Music。\n\n到目前为止，你应该对 KnowledgeC.db 数据库中记录了哪些类型的事件以及如何分析这些记录有了大致的了解。接下来，我们将深入研究更高级的主题，例如详细分析应用程序使用情况。\n\
  \n## 分析应用程序使用情况\n\n通过分析生活模式数据可以获得的最有价值的洞察之一就是应用程序使用情况。通过分析 ZOBJECT 表中的 /app/inFocus\
  \ 事件流，调查人员将能够识别在特定时间范围内设备上使用了哪些应用程序，以及使用了多长时间。\n\n例如，我们将运行一个查询，以识别在 48 小时时间范围内使用了哪些应用程序，时间从\
  \ 2021 年 5 月 24 日 00:00:00 到 2021 年 5 月 26 日 00:00:00。\n\n首先，我们需要将日期和时间转换为 Mac 绝对时间戳：\n\
  \n### 结果\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_153_0.png)\n\n图 5.6 – 使用 https://www.gaijin.at/en/tools/time-converter\
  \ 将日期和时间转换为 Mac 时间戳\n\n现在我们已经有了 Mac 绝对时间戳，我们希望查询 KnowledgeC.db 中所有发生在 643507200\
  \ 时间戳和 643680000 时间戳之间的 /app/inFocus 事件。为此，请运行以下查询：\n\n```sql\nSELECT\ndatetime(ZOBJECT.ZSTARTDATE+978307200,\
  \ 'UNIXEPOCH',\n'LOCALTIME') as \"START\",\ndatetime(ZOBJECT.ZENDDATE+978307200,\
  \ 'UNIXEPOCH',\n'LOCALTIME') as \"END\",\nZOBJECT.ZSECONDSFROMGMT/3600 AS \"GMT\
  \ OFFSET\",\n(ZOBJECT.ZENDDATE-ZOBJECT.ZSTARTDATE) as \"USAGE IN SECONDS\",\nZOBJECT.ZSTREAMNAME,\n\
  ZOBJECT.ZVALUESTRING\nFROM ZOBJECT\nWHERE ZSTREAMNAME IS \"/app/inFocus\"\nAND ZOBJECT.ZSTARTDATE\
  \ > 643507200\nAND ZOBJECT.ZSTARTDATE < 643680000\nORDER BY \"START\";\n```\n\n\
  首先，我们使用 datetime SQL 命令选择开始和结束时间戳，并将其转换为可读的字符串。然后，我们计算以小时为单位的 GMT 偏移量和以秒为单位的事件持续时间。最后，我们通过仅选择之前计算出的时间戳之间发生的\
  \ /app/inFocus 事件来过滤结果。\n\n得到的数据集如下所示：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_154_0.png)\n\
  \n图 5.7 – 查询结果显示了应用程序的使用情况\n\n正如你所看到的，我们详细列出了设备上使用了哪些应用程序、事件的日期和时间，以及应用程序的使用时长。例如，你可以看到在这一天，我使用\
  \ Safari 短暂浏览了网页，然后参加了一个 2 小时的 Zoom 会议，最后在 Safari 中查看了来自某个网站的 PDF 文件。\n\n另一个对调查有用的洞察是分析用户行为，判断他们是否在从事某项长期任务，例如看电影。我们可以通过按\
  \ USAGE 列降序排列结果来实现这一点。在以下示例中，我还移除了所有时间限制：\n\n```sql\nSELECT\ndatetime(ZOBJECT.ZSTARTDATE+978307200,'UNIXEPOCH',\n\
  'LOCALTIME') as \"START\",\ndatetime(ZOBJECT.ZENDDATE+978307200,'UNIXEPOCH',\n'LOCALTIME')\
  \ as \"END\",\nZOBJECT.ZSECONDSFROMGMT/3600 AS \"GMT OFFSET\",\n(ZOBJECT.ZENDDATE-ZOBJECT.ZSTARTDATE)\
  \ as \"USAGE IN SECONDS\",\nZOBJECT.ZSTREAMNAME,\nZOBJECT.ZVALUESTRING\nFROM ZOBJECT\n\
  WHERE ZSTREAMNAME IS \"/app/inFocus\"\nORDER BY \"USAGE IN SECONDS\" DESC;\n```\n\
  \n下面，你可以看到得到的数据：\n\n|  | 开始时间 | 结束时间 | GMT 偏移量 | 使用时长（秒） | ZSTREAMNAME | ZVALUESTRING\
  \ |\n|---|---|---|---:|---:|---|---|\n| 1 | 2021-06-24 08:38:13 | 2021-06-24 10:56:11\
  \ | 2 | 8278 | /app/inFocus | us.zoom.videomeetings |\n| 2 | 2021-06-06 14:53:43\
  \ | 2021-06-06 17:07:49 | 2 | 8046 | /app/inFocus | com.apple.mobilesafari |\n|\
  \ 3 | 2021-05-26 16:25:19 | 2021-05-26 18:38:19 | 2 | 7980 | /app/inFocus | us.zoom.videomeetings\
  \ |\n| 4 | 2021-06-02 11:03:58 | 2021-06-02 12:31:20 | 2 | 5242 | /app/inFocus |\
  \ com.apple.mobilesafari |\n| 5 | 2021-06-25 14:57:21 | 2021-06-25 16:23:48 | 2\
  \ | 5187 | /app/inFocus | com.apple.mobilesafari |\n| 6 | 2021-06-24 13:37:35 |\
  \ 2021-06-24 14:58:41 | 2 | 4866 | /app/inFocus | com.apple.mobilesafari |\n| 7\
  \ | 2021-06-13 18:02:54 | 2021-06-13 19:23:42 | 2 | 4848 | /app/inFocus | com.apple.mobilesafari\
  \ |\n| 8 | 2021-06-13 16:44:36 | 2021-06-13 18:02:54 | 2 | 4698 | /app/inFocus |\
  \ com.apple.mobilesafari |\n| 9 | 2021-05-29 10:52:03 | 2021-05-29 13:09:21 | 2\
  \ | 4638 | /app/inFocus | com.google.ios.youtube |\n| 10 | 2021-05-31 17:47:34 |\
  \ 2021-05-31 19:04:05 | 2 | 4591 | /app/inFocus | us.zoom.videomeetings |\n| 11\
  \ | 2021-06-01 22:03:57 | 2021-06-01 23:19:53 | 2 | 4556 | /app/inFocus | com.netflix.Netflix\
  \ |\n| 12 | 2021-06-06 11:18:07 | 2021-06-06 12:30:11 | 2 | 4504 | /app/inFocus\
  \ | com.apple.mobilesafari |\n\n图 5.8 — 分析长期任务\n\n正如你所看到的，我参与了相当多的长期任务，例如 Zoom 会议、网页浏览，以及在\
  \ YouTube 和 Netflix 上播放媒体内容。现在，假设我们想更深入地挖掘数据，分析 2021 年 6 月 1 日晚上发生了什么。从之前的查询结果中，我们可以看到那天晚上我在使用\
  \ Netflix。但我到底在看什么呢？\n\n首先，我们将计算该日期和时间的 Mac 时间戳，然后运行以下查询：\n\n```sql\nSELECT\ndatetime(ZOBJECT.ZSTARTDATE+978307200,'UNIXEPOCH',\n\
  'LOCALTIME') as \"START\",\ndatetime(ZOBJECT.ZENDDATE+978307200,'UNIXEPOCH',\n'LOCALTIME')\
  \ as \"END\",\nZOBJECT.ZSECONDSFROMGMT/3600 AS \"GMT OFFSET\",\n(ZOBJECT.ZENDDATE-ZOBJECT.ZSTARTDATE)\
  \ as \"USAGE IN SECONDS\",\nZOBJECT.ZSTREAMNAME,\nZOBJECT.ZSTRUCTUREDMETADATA,\n\
  ZOBJECT.ZVALUESTRING\nFROM ZOBJECT\nWHERE ZOBJECT.ZSTARTDATE > 644266800\nAND ZOBJECT.ZSTARTDATE\
  \ < 644277599\nORDER BY \"START\";\n```\n\n结果如下所示：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_156_0.png)\n\
  \n图 5.9 – 查询结果显示感兴趣时间范围内的用户交互\n\n通过分析得到的数据集，我们可以看到 Netflix 应用被启动，触发了 /media/nowPlaying\
  \ 事件，并且设备被旋转为横屏模式。要了解 Netflix 上正在播放什么内容，我们需要分析与该事件关联的元数据。在本例中，关联 ID 为 51732，我们将使用它来查询\
  \ ZSTRUCTUREDMETADATA 表：\n\n```sql\nSELECT\nZ_PK AS \"ID\",\nZ_DKNOWPLAYINGMETADATAKEY__TITLE\n\
  FROM ZSTRUCTUREDMETADATA\nWHERE \"ID\" = \"51732\";\n```\n\n结果如下图所示，显示了正在播放的应用名称\
  \ Netflix，以及我正在观看的电影名称：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_157_0.png)\n\
  \n图 5.10 – 与 /media/nowPlaying 事件关联的元数据\n\n从这些简单的示例可以看出，调查人员能够非常详细地分析用户行为，不仅了解用户正在使用哪个应用程序，还能了解用户在该特定应用程序中具体在做什么。例如，通过定制\
  \ SQL 查询，可以了解用户访问了哪个网站，或者正在阅读哪个 PDF 文件。我们将在接下来的章节中详细讨论这些用例。\n\n**提示**\n\n如果没有 **数字取证与事件响应（DFIR）**\
  \ 社区的慷慨贡献，就不可能从生活模式数据中获取洞察。特别是，本章中使用的大多数查询都基于 Sarah Edwards（@iamevltwin）进行的研究。你可以访问她的博客：[https://www.mac4n6.com](https://www.mac4n6.com)。\n\
  \n## 分析用户交互\n\n在任何涉及智能设备的数字调查中，调查人员通常首先想要回答的问题之一是设备何时被使用，以及何时发生了人机交互。这可以通过查找需要人工交互的事件来轻松发现，例如解锁设备或激活屏幕。\n\
  \n以下查询显示了设备何时被锁定或解锁：\n\n```sql\nSELECT\ndatetime(ZOBJECT.ZSTARTDATE+978307200, 'UNIXEPOCH',\n\
  'LOCALTIME') as \"DATE / TIME\",\nZOBJECT.ZSECONDSFROMGMT/3600 AS \"GMT OFFSET\"\
  ,\nCASE ZOBJECT.ZVALUEINTEGER\n        WHEN '0' THEN 'UNLOCKED'\n        WHEN '1'\
  \ THEN 'LOCKED'\n    END \"IS LOCKED\"\nFROM ZOBJECT\nWHERE ZOBJECT.ZSTREAMNAME\
  \ LIKE \"/device/isLocked\"\nORDER BY \"DATE / TIME\";\n```\n\n结果如下面的截图所示：\n\n\n\
  \n![](img/0b17a17d4cb56b1c25763a396dd83117_159_0.png)\n\n图 5.11 – 查询显示设备锁定状态\n\n\
  如果我们想在每次屏幕被激活时都查找记录，即使设备未被解锁，也可以通过运行以下查询来实现：\n\n```\nSELECT\ndatetime(ZOBJECT.ZSTARTDATE+978307200,\
  \ 'UNIXEPOCH',\n'LOCALTIME') as \"DATE / TIME\",\nZOBJECT.ZSECONDSFROMGMT/3600 AS\
  \ \"GMT OFFSET\"\nFROM ZOBJECT\nWHERE ZOBJECT.ZSTREAMNAME LIKE \"/display/isBacklit\"\
  \nAND ZOBJECT.ZVALUEINTEGER = '1'\nORDER BY \"DATE / TIME\";\n```\n\n resulting\
  \ 记录将显示显示屏被激活的时间。 这些示例中使用的查询应该很容易理解，并且可以轻松自定义以匹配调查中可能感兴趣的其他事件。\n\n我们现在将研究另一种分析生活模式数据的方法，使用开源工具。\n\
  \n## 介绍 Apollo\n\n到目前为止，我们已经学习了如何通过查询 SQLite 数据库手动分析生活模式数据。 然而，还有另一种选择可以自动化该过程，并允许调查人员查看所有数据在统一数据库中。\n\
  \n**Apollo**，全称为 **Apple Pattern of Life Lazy Output'er**，是由 Sarah Edwards (@iamevltwin)\
  \ 开发的 Python 脚本，它将多个数据源关联到统一的 **timeline** 中，简化了检查人员了解设备上到底发生了什么的任务。\n\n该工具由数十个高度可配置的模块组成，每个模块查询特定的\
  \ iOS 数据库以提取数据和事件。 主 Python 脚本随后将每个模块的结果编译成统一的 **CSV** 文件或 SQLite 数据库。\n\n我们现在将介绍下载该工具、运行它并将结果导出到单个\
  \ SQLite 数据库所需的步骤：\n\n- 1. 要下载 Apollo，请前往其 GitHub 仓库 https://github.com/mac4n6/APOLLO\
  \ 并下载最新版本作为 ZIP 归档，或通过运行 git clone 命令克隆仓库。\n- 2. 接下来，通过指定导出格式、模块目录的位置以及应分析的数据位置来运行该工具，例如包含\
  \ SQLite 数据库的文件夹或完整的系统提取。 例如，运行 python apollo.py -output sql modules/ fs-extraction/\
  \ 将以 SQL 模式运行 Apollo，分析 fs-extraction 文件夹中的文件并运行 modules 文件夹中找到的所有模块。 Apollo 也可以使用不同的选项运行；\
  \ 有关所有可用命令行选项的完整列表，您可以参考项目的 GitHub 页面。\n- 3. 当工具结束处理时，结果将存储在名为 apollo.db 的文件中。\n\
  - 4. 然后，您可以使用您选择的工具，例如 **DB Browser**，继续分析 SQLite 数据库。\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_161_0.png)\n\
  \n图 5.12 – DB Browser 中显示的 Apollo 数据库\n\n该数据库包含一个表 APOLLO，其中包含工具模块处理过的所有数据的 timeline。\
  \ 以下是该表列的简要说明：\n\n- Key 列包含事件发生的时间戳，以人类可读的字符串显示。\n- Activity 列显示记录了何种事件的简单描述。\n\
  - Output 列包含与特定事件相关的所有数据的 JSON 对象。\n- Database 列指示事件是从哪个数据库提取的。\n- Module 列指示负责提取和分析事件的模块的名称。\n\
  \n通常，从取证角度来看，输出命令将包含大部分有趣的数据。 下图显示了 `Battery Level` 事件的 JSON 对象是什么样的：\n\n```\n```json\n\
  {\n  \"ADJUSTED_TIMESTAMP\": \"2021-06-19 07:57:09\",\n  \"LEVEL\": 31.0,\n  \"\
  RAW_LEVEL\": 31.2364696962684408,\n  \"IS_CHARGING\": 0,\n  \"FULLY_CHARGED\": 0,\n\
  \  \"ORIGINAL_TIMESTAMP\": \"2021-04-26 05:35:55\",\n  \"OFFSET_TIMESTAMP\": \"\
  2021-04-28 15:48:56\",\n  \"TIME_OFFSET\": 4674074.367777824,\n  \"PLBATTERYAGENT_EVENTBATTERY_TABLE_ID\"\
  : 480012\n}\n```\n```\n\n图 5.13 – 存储在 Apollo Output 列中的 JSON 对象\n\nApollo 的美妙之处在于它是一个完全模块化和可定制的工具，允许调查人员提取所有生活模式数据或选择仅通过使用适当的模块包含某些工件。\
  \ 将结果浓缩到单个文件中意味着调查人员能够查看事件时间线，可以根据日期和时间轻松过滤，或通过搜索特定事件。\n\nApollo 正在积极开发中，模块不断被添加和更新。\
  \ 最后，需要注意的是，该工具不仅支持 iOS，还允许分析来自 MacOS 设备和其他设备的生活模式数据。\n\n## 总结\n\n在本章中，我们了解了生活模式取证是什么，以及调查人员如何通过分析此类数据来可视化用户行为并检测异常模式而受益。\n"
- "## 第 6 章：剖析位置数据\n\n在上一章中，我们了解了可以在 iOS 设备上找到的生活模式工件，例如应用程序使用情况和系统事件，以及如何手动分析数据库和日志。\
  \ 在本章中，我们将重点关注可在移动设备上找到的最有趣的数据类型之一，即位置数据。\n\n移动设备存储了大量位置数据，例如与蜂窝基站、Wi-Fi 网络和与设备接近的蓝牙设备相关的数据。\
  \ 位置工件也可以从第三方应用程序或多媒体文件中提取。\n\n我们将从学习位置数据是什么、设备如何确定其位置以及此数据存储在哪里开始本章。 我们将学习 GPS、蜂窝基站三角定位和\
  \ Wi-Fi 位置之间的区别。 然后，我们将深入研究存储位置数据的一些 SQLite 数据库，并学习如何分析它们以获得有意义的见解。 最后，我们将学习 Cellebrite\
  \ Physical Analyzer 和 Apollo 等取证工具如何加快位置数据分析过程。\n\n在本章中，我们将涵盖以下主题：\n\n- 介绍位置数据\n\
  - GPS 定位、蜂窝基站和 Wi-Fi 网络\n- 定位位置工件\n- 使用取证工具分析位置数据\n\n### 介绍位置数据\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_166_0.png)\n\
  \n图 6.1 – 地理位置使用纬度和经度表示\n\n在接下来的章节中，我们将学习位置服务如何工作以确定设备的位置。\n\n## GPS 定位、蜂窝基站和 Wi-Fi\
  \ 网络\n\nLocation Services iOS API 使用一种称为辅助 GPS (A-GPS) 的技术集合来确定设备的位置。 移动设备使用 A-GPS\
  \ 而不是仅使用传统卫星 GPS 的主要原因是\n\n后者在建筑物内部性能不佳； 它也比其他技术慢，并且会迅速耗尽设备的电池。 A-GPS 通过使用外部源（例如蜂窝基站）来增强卫星\
  \ GPS，从而提高卫星信号的速度、质量和精度。 外部源接收到的数据随后被整合以确定设备的精确位置。\n\n以下是为 A-GPS 提供支持的来源列表：\n\n\
  - 卫星 GPS\n- 蜂窝基站\n- Wi-Fi 网络\n- 蓝牙设备\n\n我们将在以下各节中更详细地研究这些内容。\n\n你可能想知道 iOS 设备如何从\
  \ Wi-Fi 网络或蜂窝基站解析位置； 这是由 Apple 使用 **基于同行的机制** 实现的，其中每个 iOS 设备都贡献创建网络和设备的地图。\n\n\
  通常，该机制包括三个步骤：\n\n- 1. 如果启用了位置服务，每个 iOS 设备会定期收集和存储当前 GPS 位置以及周围蜂窝基站和 Wi-Fi 热点列表。\n\
  - 2. 这些数据随后匿名发送到 Apple 服务器，在那里与其他收集的信息和第三方提供商整合。\n- 3. 当位置服务请求设备位置时，数据会同步回 iOS 设备。\n\
  \n例如，如果位置服务请求设备位置且卫星 GPS 不可用，iOS 将扫描附近的蜂窝基站并查询 Apple 的基于同行生成的地图以查找与\n\n\n这些蜂窝基站。通过这种机制，定位服务可以在几秒内获得粗略位置，然后在可用时报告更精确的\
  \ GPS 定位结果。\n\n每台 iOS 设备还有一个内部缓存，存储大量位置、蜂窝基站和 Wi-Fi 网络信息。通过访问本地缓存，设备无需数据连接即可通过 Wi-Fi\
  \ 网络解析位置。为了使这些数据保持最新，缓存数据库会定期清除。\n\n除了这种基于对等设备的机制外，Apple 还依赖外部来源将蜂窝基站和无线网络转换为物理位置。例如，战争驾驶（wardriving）是指一个人通常驾车移动，使用笔记本电脑或智能手机搜索无线电信号，并记录自己的\
  \ GPS 坐标以及与该无线电信号相关的数据。\n\n## 卫星 GPS\n\n传统 GPS，也称为卫星 GPS，是 iOS 设备最精确的位置数据来源。\n\n\
  该技术基于一个由 30 多颗卫星组成的网络，这些卫星在距地球 20,000 公里的高度绕地运行。每颗卫星都会通过无线电波向地球发射信号，其中包含卫星标识符、当前位置和时间戳。因此，当设备截获卫星信号时，它会利用信号接收时间与广播时间之间的时间差来计算从接收器到卫星的距离。然后，设备利用计算出的距离和卫星的位置来计算其大致位置。\n\
  \n值得注意的是，要计算精确位置，接收器必须锁定至少三颗卫星的信号。当视野中有四颗或更多卫星时，接收器可以确定其 3D 位置：**纬度**、**经度**和**海拔**。\n\
  \n某些大气因素和其他误差源会影响设备 GPS 接收器的精度；不过，接收器通常精度可以达到\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_171_0.png)\n\
  \n图 6.3 – 蜂窝基站三边测量过程\n\n不难看出，三边测量过程的精度会因蜂窝基站的位置和密度而有很大差异。\n\n## Wi-Fi 与蓝牙\n\n与蜂窝基站类似，Wi-Fi\
  \ 热点也会广播无线电信号，并且可以通过 RSSI 测量信号强度。移动设备会不断扫描无线热点，搜索已知网络，因此利用这些信息来计算设备的位置是有道理的。Wi-Fi\
  \ 信号的覆盖范围在室外仅约 70 米，室内约 40-50 米，因此如果设备收到信号，它一定在物理上靠近热点。\n\n考虑到这一点，移动设备如何通过评估 Wi-Fi\
  \ 网络的 RSSI 来确定设备与热点之间的大致距离就很清楚了。然后，iOS 使用前面描述的基于对等设备的机制将该数据解析为物理位置。\n\n蓝牙信标也可以以类似方式使用。\n\
  \n## 查找位置数据痕迹\n\n在本章的第一部分，我们介绍了定位服务 API，并了解了 iOS 如何使用不同技术来评估其位置。现在，我们将深入探讨存储地理位置数据的\
  \ SQLite 数据库。\n\n以下是一份只有在完整文件系统提取中才能找到的感兴趣文件列表：\n\n- `/private/var/mobile/Library/Caches/com.apple.routined/Cache.sqlite`\n\
  \n  这是 iOS 位置数据的主要存储方式。`ZRTCLLOCATIONMO` 表包含多条有用记录，例如 GPS 坐标、时间戳和水平精度值，该值表示设备认为\
  \ GPS 坐标的准确程度。`ZRTWIFIACCESSPOINTMO` 表存储了设备扫描过的 Wi-Fi 网络列表。一般来说，此数据库中的数据应被视为最新且准确的。\n\
  \n- `/private/var/mobile/Library/Caches/com.apple.routined/Local.sqlite`\n\n  此\
  \ SQLite 数据库在结构上与 `Cache.sqlite` 数据库相同。根据 iOS 版本的不同，`ZRTLEARNEDLOCATIONOFINTERESTSMO`\
  \ 表通常包含任何*常去位置*的详细信息，我们稍后会研究这一点。\n\n- `/private/var/mobile/Library/Caches/com.apple.routined/Cloud-V2.sqlite`\n\
  \n  顾名思义，此数据库存储应同步到 iCloud 的位置数据。\n\n- `/private/var/root/Library/Caches/locationd/cache_encryptedDB.db`\n\
  \n  此数据库包含 Apple 收集到的位置数据，例如蜂窝小区和 Wi-Fi 网络；这些记录涉及与设备较近的蜂窝基站，但应始终检查这些地理坐标的准确性。\n\n\
  - `/private/var/root/Library/Caches/locationd/cache_encryptedC.db`\n\n  此数据库存储从设备加速度计接收的数据，例如运动数据和一般健康相关数据。\n\
  \n- `/private/var/root/Library/Caches/locationd/consolidated.db`\n\n  最后，此数据库供地理围栏（GeoFence）API\
  \ 使用，任何创建地理围栏的应用都会存储在这里。\n\n为了更好地理解位置相关数据如何存储在这些数据库中，我们将逐一分析它们，并了解可以使用哪些查询来提取有意义的见解。\n\
  \n## 分析位置数据\n\n正如我们已经了解到的，iOS 设备会追踪许多不同的位置相关数据痕迹。调查人员应清楚了解这些数据的存储方式和存储位置，以及哪些位置是用户实际访问过的，哪些只是靠近设备的位置。\n\
  \n位置数据的取证分析第一步是查看 `Cache.sqlite` 数据库。该数据库包含由设备 GPS 接收器提供的极其精确的坐标历史记录。通常，这些数据会存储一周多一点的时间。\n\
  \n我们将从查看 `ZRTCLLOCATIONMO` 表开始。以下是该表的结构：\n\n- `ZLATITUDE` 和 `ZLONGITUDE` 存储地理坐标。\n\
  - `ZALTITUDE` 列表示海拔的估算值。该数据由设备的加速度计提供。\n- `ZHORIZONTALACCURACY` 列表示设备认为坐标的准确程度，以米为单位。\n\
  - `ZVERTICALACCURACY` 表示海拔精度，以米为单位。\n- `ZTIMESTAMP` 列以 Mac 绝对时间格式存储时间戳。\n\n通过运行以下查询，可以获取设备位置数据的完整历史记录：\n\
  \n```\nSELECT\n    DATETIME(ZTIMESTAMP + 978307200, 'UNIXEPOCH') AS \"TIMESTAMP\"\
  ,\n    ZLATITUDE AS \"LATITUDE\",\n    ZLONGITUDE AS \"LONGITUDE\",\n    ZALTITUDE\
  \ AS \"ALTITUDE\",\n    ZSPEED AS \"SPEED (M/S)\",\n    ZSPEED*2.23694 AS \"SPEED\
  \ (MPH)\",\n    ZSPEED*3.6 AS \"SPEED (KMPH)\",\n    ZHORIZONTALACCURACY AS \"HORIZONTAL\
  \ ACCURACY\",\n    ZVERTICALACCURACY AS \"VERTICAL ACCURACY\"\nFROM\n    ZRTCLLOCATIONMO;\n\
  ```\n\n首先，我们使用 `datetime` SQL 命令将 Mac 绝对时间戳转换为可读字符串。然后，我们从表中选择相关列，并计算设备移动的速度。\n\n\
  下图显示了查询结果：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_175_0.png)\n\n图 6.4 – 查询结果显示设备的位置\n\
  \n如你所见，位置数据痕迹为调查人员提供了关于某个用户设备在特定时刻所处位置的准确信息。通常，这些数据粒度非常细，每秒记录一条条目也并不罕见。数据粒度的差异可以解释为：GPS\
  \ 并非在所有地方都可用，因此在这些情况下，设备会转而在附近有 Wi-Fi 网络和蜂窝基站时使用它们来确定其位置。\n\n\n\n\n一旦调查人员获取了地理坐标列表，这些坐标就可以与地图提供商一起使用，以获得设备所在位置的视觉反馈。\n\
  \n![](img/0b17a17d4cb56b1c25763a396dd83117_176_0.png)\n\n图 6.5 – 查询结果被映射出来以确定用户的行程\n\
  \n需要注意的是，不同数据库存储的定位数据类型各不相同，准确性也高低不等。根据已开展的研究，这种被称为 **routined location data** 的数据已被证明具有高度准确性。\n\
  \n## 理解重要位置\n\n随着 iOS 8 的发布，苹果引入了一项名为 **Frequent Locations** 的功能，从 iOS 10 开始更名为\
  \ **Significant Locations**。基本上，每当设备访问某个位置时，都会在 SQLite 数据库中存储一条记录，其中包含设备行程的详细信息。当设备多次返回同一位置时，该位置就成为一个\
  \ *significant location*。\n\n截至今天，苹果使用的算法如何工作以及需要多少次访问特定位置才会被视为重要位置，目前仍不清楚。就区域而言，研究发现，只要设备在重要位置\
  \ 250 m 半径范围内，就会记录对该位置的访问。\n\n如果启用了定位服务，可以通过 **Settings | Privacy | Location Services\
  \ | System Services | Significant Locations** 直接从设备上查看 Significant Locations。\n\n\
  ![](img/0b17a17d4cb56b1c25763a396dd83117_177_0.png)\n\n图 6.6 – Significant Locations\
  \ 可以直接在设备上查看\n\n请记住，自 iOS 15 以来，在设备上查看 Significant Locations 仅显示这些位置的摘要。完整数据只有通过完整的文件系统提取才能获得。\n\
  \n从取证角度来看，频繁位置数据非常宝贵，因为它使调查人员能够了解用户经常访问的位置。此外，与重要位置相关的数据通常可以追溯到很久以前。\n\n要查看此数据，我们将在\
  \ Local.sqlite 数据库上运行以下查询：\n\n```sql\nSELECT\nDATETIME(ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZENTRYDATE\
  \ + 978307200, 'UNIXEPOCH') AS \"ENTRY\",\nDATETIME(ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZEXITDATE\
  \ + 978307200, 'UNIXEPOCH') AS \"EXIT\",\n(ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZEXITDATE-ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZENTRYDATE)/60.00\
  \ AS \"DURATION (MINUTES)\",\nZRTLEARNEDLOCATIONOFINTERESTMO.ZLOCATIONLATITUDE AS\
  \ \"LATITUDE\",\nZRTLEARNEDLOCATIONOFINTERESTMO.ZLOCATIONLONGITUDE AS \"LONGITUDE\"\
  ,\nZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZLOCATIONUNCERTAINTY AS \"LOCATION UNCERTAINTY\"\
  ,\nZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZDATAPOINTCOUNT AS \"DATA POINTS\"\nFROM\n\
  ZRTLEARNEDLOCATIONOFINTERESTVISITMO\nLEFT JOIN\nZRTLEARNEDLOCATIONOFINTERESTMO\n\
  ON ZRTLEARNEDLOCATIONOFINTERESTMO.Z_PK = ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZLOCATIONOFINTEREST;\n\
  ```\n\n尽管此查询看起来很复杂，但如果我们将其分解为逻辑步骤，实际上会容易得多：首先，我们使用 datetime SQL 命令将时间戳转换为可读的字符串。Entry\
  \ 字段指的是设备访问重要位置的时间，而 Exit 字段表示设备离开该位置的时间。然后，我们计算访问的持续时间（Duration）并打印纬度、经度和不确定性。最后，我们打印该次访问该特定位置的数据点数（Data\
  \ Points）。\n\n下图显示了查询结果：\n\n| # | DATE | MAC ADDRESS | CHANNEL | RSSI |\n|---|---|---|---|---|\n\
  | 1 | 2020-04-12 12:46:19 | f8:bb:bf:1e:fa:ea | 161 | -57 |\n| 2 | 2020-04-12 12:46:19\
  \ | f8:bb:bf:1e:fa:e4 | 161 | -57 |\n| 3 | 2020-04-12 12:46:20 | 80:da:13:72:52:64\
  \ | 149 | -90 |\n| 4 | 2020-04-12 12:46:20 | f8:bb:bf:1e:fa:eb | 48 | -51 |\n| 5\
  \ | 2020-04-12 12:46:20 | 58:ef:68:25:35:34 | 48 | -90 |\n| 6 | 2020-04-12 12:46:20\
  \ | d8:d7:75:b6:28:9 | 48 | -89 |\n| 7 | 2020-04-12 12:46:20 | 80:da:13:72:52:6a\
  \ | 149 | -89 |\n| 8 | 2020-04-12 12:46:20 | f8:bb:bf:8d:b9:c2 | 48 | -78 |\n| 9\
  \ | 2020-04-12 12:46:20 | f8:bb:bf:90:a8:f2 | 48 | -70 |\n| 10 | 2020-04-12 12:46:20\
  \ | b8:66:85:53:d3:7 | 44 | -85 |\n| 11 | 2020-04-12 12:46:20 | 7c:db:98:c2:30:34\
  \ | 40 | -89 |\n| 12 | 2020-04-12 12:46:20 | f8:bb:bf:1e:fa:e8 | 48 | -50 |\n\n\
  图 6.8 – 结果显示了设备扫描到的无线设备的详细信息\n\n尽管此表不存储诸如纬度和经度之类的地理坐标，但它仍然为调查人员提供了有关设备何时以及捕获了哪些无线信号的详细信息。通过将此数据与外部数据源（例如已知网络设备及其\
  \ MAC 地址的列表）相关联，可以在特定时间点将设备定位在特定位置。\n\n## 理解采集的位置\n\n在本章开头，我们介绍了 A-GPS 技术，并了解了苹果如何维护一个基于同行的地图，该地图在\
  \ Location Services 请求地理定位时下载回设备。此数据包含数千条与设备附近的蜂窝基站和 Wi-Fi 网络相关的记录，以及它们的地理坐标。设备可以使用此数据将无线电信号解析为物理位置，而无需\
  \ GPS 信号。\n\n下载到设备上的苹果数据称为 **Harvested Locations** 数据，可在 `cache_encryptedB.db` 数据库中找到。\n\
  \n在这里，我们可以找到几个感兴趣的表：\n\n- 蜂窝基站数据可在以下表中找到：\n  - `CdmaCellLocation`、`CellLocation`\
  \ 和 `LteCellLocation`。\n- Wi-Fi 设备数据存储在 `wifiLocation` 表中。\n\n### 常规位置与采集位置\n\n\
  在开始分析此数据之前，了解设备访问的位置与苹果提供的位置之间的区别非常重要：我们之前查看的数据，也称为常规位置数据，通常非常准确，因为它来自设备的 GPS，并且可以详细显示设备所在的位置。另一方面，Harvested\
  \ Locations 数据由苹果提供，作为增强设备对该区域了解的一种方式。此数据不是从内置 GPS 接收器检索的，而是表示位于设备附近的蜂窝基站和无线设备。\n\
  \n### 分析采集的蜂窝基站数据\n\n蜂窝基站数据存储在 `cache_encryptedB.db` 数据库中，并保留约一周。以下是一些最相关的列：\n\n\
  - MCC，或 **Mobile Country Code**，表示蜂窝基站的国家代码。\n- MNC，或 **Mobile Network Code**，标识移动运营商。\n\
  - CI，或 **Cell ID**，是用于表示蜂窝基站每个收发站的唯一编号。\n- `HorizontalAccuracy` 值表示设备认为坐标的精确程度，以米为单位。\n\
  - `Latitude` 和 `Longitude` 列存储地理坐标。\n\n我们可以通过运行 SQL 查询来提取所有蜂窝相关数据，例如以下代码块所示。在用于研究<|message|>的设备上，蜂窝数据存储在\
  \ LTECELLLOCATION 表中；不过，这取决于设备型号和 iOS 版本：\n\n```sql\nSELECT\n    DATETIME(TIMESTAMP\
  \ + 978307200, 'UNIXEPOCH') AS \"TIMESTAMP\",\n    MCC AS \"MCC\",\n    MNC AS \"\
  MNC\",\n    CI AS \"CI\",\n    HORIZONTALACCURACY AS \"HORIZONTAL ACCURACY\",\n\
  \    LATITUDE AS \"LATITUDE\",\n    LONGITUDE AS \"LONGITUDE\"\nFROM LTECELLLOCATION;\n\
  ```\n\n查询结果如下图所示：\n\n| # | TIMESTAMP | MCC | MNC | CI | HORIZONTAL ACCURACY | LATITUDE\
  \ | LONGITUDE |\n|---|---|---|---|---|---|---|---|\n| 1 | 2020-12-12 22:25:08 |\
  \ 310 | 260 | 18005506 | 2142.0 | 35.6559143 | -78.87465667 |\n| 2 | 2020-12-12\
