  \ BFU 采集\n- 介绍 iTunes 备份\n- 介绍 iCloud 取证\n\n### 采集锁定设备\n\n在本书记载的开头，在 *第 1 章*，*介绍\
  \ iOS 取证* 中，我们讨论了 iOS 操作系统，并学习了 Apple 如何通过加密设备上存储的文件来实现 **数据保护**。\n\n设备的密码是加密过程中的一个重要方面，因为它用于生成\
  \ **加密密钥**，而该密钥又用于解密数据。在用户输入屏幕锁定密码之前，几乎所有数据都无法访问。当然，有些例外，因为某些文件是操作系统运行所必需的，即使设备被锁定也需要始终可访问。\n\
  \n由于这些原因，采集和分析锁定设备并非易事，但有几种选择。当调查人员处理锁定设备时，第一步需要 **识别** 设备及其当前状态，因为可用于尝试数据采集的选项会根据多种因素而有所不同，例如型号和\
  \ iOS 版本。\n\n初始识别阶段应使检查员能够回答以下问题：\n\n- 锁定设备处于 BFU 还是 **首次解锁后 (AFU)** 状态？\n- 设备的硬件型号是什么？\n\
  - 设备是否容易受到 Checkm8 攻击？\n- 设备运行的是什么 iOS 版本？\n- 设备是否曾经与台式机或笔记本电脑配对过？\n\n通过回答这些问题，检查员将能够评估可能获得对锁定设备访问的最佳行动方案。在继续之前，了解\
  \ BFU 和 AFU 状态之间的差异很重要：\n\n- **BFU**：处于 BFU 状态的设备是指已关机或重新启动，并且自设备开机以来尚未解锁，甚至一次都没有的设备。\n\
  - **AFU**：当设备开机并输入正确的密码时，设备进入 AFU 模式。\n\n关键在于，当设备处于 AFU 状态时，可以提取和分析的数据要多得多，因为某些加密密钥实际上保留在内存中。\n\
  \n一旦设备成功识别，应考虑以下选项：\n\n- 定位并使用 **锁定配对记录**\n- 密码破解\n- 执行 **BFU 采集**\n- 将设备发送到第三方实验室或高级服务，例如\
  \ **Cellebrite Advanced Services** 或 **Grayshift's GrayKey**\n- 定位并分析 **iTunes 备份**\n\
  - 下载并分析 **iCloud 备份**\n- 下载并分析 iCloud 同步数据\n\n在本章的以下部分中，我们将讨论这些选项的利弊，首先是使用锁定配对记录。\n\
  \n### 使用锁定配对记录访问设备\n\n**锁定记录**，也称为 **配对记录**，本质上是存储在主机计算机上的文件，其中包含用于允许 iOS 设备与已配对计算机通信的加密密钥。\n\
  \n第一次将 iOS 设备连接到安装了 iTunes 的 PC 或 macOS 计算机时，用户将被提示通过输入设备的密码来 *信任* 该设备。这将在主机上创建锁定记录，这意味着用户每次将设备连接到计算机时无需解锁设备。\n\
  \n如果调查人员对与设备配对的主机计算机拥有物理和合法访问权限，则可以使用锁定文件访问锁定设备并成功执行逻辑采集。\n\n然而，有一些注意事项。首先，使用配对记录访问锁定设备仅在设备处于\
  \ **AFU 状态** 时才有效；其次，锁定记录会在一段时间后 **过期**。虽然没有确切答案说明这些记录何时过期，但已开展的研究似乎表明锁定记录在创建后 7\
  \ 到 30 天之间任何时间过期。\n\n在 Windows 机器上，锁定记录通常存储在 `%ProgramData%\\Apple\\Lockdown\\`\
  \ 中。\n\n在 macOS 计算机上，可以在 `/var/db/lockdown/` 中找到它们。\n\n一旦调查人员找到锁定记录，就可以使用诸如 **Elcomsoft\
  \ iOS Forensic Toolkit** 或 **MOBILedit Forensic Express** 等工具执行逻辑采集。\n\n以下步骤描述了使用\
  \ Elcomsoft iOS Forensic Toolkit 的过程：\n\n1. 首先，启动 Toolkit。\n2. 使用 USB-A 电缆将设备连接到工作站。\n\
  3. 选择 **B – Backup** 选项。\n4. 在提示时，输入锁定记录的路径。\n\n如果接受配对记录，将创建逻辑备份。以下屏幕截图显示了 Toolkit\
  \ 的主菜单：\n\n```\nElcomsoft iOS Forensic Toolkit 7.02\n\n(c) 2011-2021 Elcomsoft Co.\
  \ Ltd.\n\nDevice connected: iPhone\nHardware model: N61AP\nSerial number: F78PNPSKG5MT\n\
  OS version: 12.4.5\nDevice ID: 7cf85b3179a6c136ae723636e6467a27888ab928\n\nPlease\
  \ select an action\n\nLogical acquisition\n  I  DEVICE INFO      - Get basic device\
