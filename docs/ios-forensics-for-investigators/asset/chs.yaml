- '# 第1部分 – 从iOS设备获取数据


  你将学习正确的iOS设备工作流程并了解iOS操作系统的工作原理基础。在第一部分结束时，你将能够成功地从iOS设备提取完整的文件系统镜像。


  本书的这一部分包含以下章节：


  - *第1章,* 介绍iOS取证

  - *第2章,* 从iOS设备获取数据





  '
- "## 第 1 章：介绍 iOS 取证\n\n在过去十年中，智能手机经历了一场深刻的革命，以各种可能的方式影响着我们的生活：我们的设备不再只是智能手机——它们已成为存储我们数字生活（以及非数字生活）各种信息的数据中心。\n\
  \n如今，从手掌中，我们可以冲浪网页、购买戏票、让食物送到门口，或叫一辆 Uber。我们使用设备阅读电子书、做笔记、从事创造性任务，并通过社交媒体与粉丝分享我们的生活。我们逐渐用\
  \ iPhone 相册取代了数码相机。智能手机可以跟踪身体活动、与外部设备交互、为我们提供导航，并提醒我们可能忘记的重要会议。我们使用生产力应用来完成工作，并使用\
  \ Apple Pay 进行支付。当然——我们使用 iPhone 与世界另一端的人取得联系。随着 iPad 和平板电脑的广泛普及，我们的设备不再只是通信设备。它们已成为一个几乎无限的内容平台，我们可以在其中享受电影、电视剧，或\
  \ simply 听我们最喜欢的音乐。\n\n为了能够提供这些令人惊叹的功能，移动设备收集了大量数据，这些数据由 iOS 处理，有时还会同步到 iCloud。这些信息比任何台式电脑上存储的数据更充分地记录并揭示了用户的想法和活动。\n\
  \n移动取证就是收集这些数据、保存它、评估它、验证它，并提取可以作为证据呈现的有意义见解的全部过程。\n\n在本章中，我们将涵盖以下主题：\n\n- 理解移动取证\n\
  - 剖析 iOS 操作系统\n- 理解 iOS 安全\n- 建立工作流程\n\n## 理解移动取证\n\n由于 Apple 设备提供的用户体验、精美的设计和革命性功能而在全球流行，因此\
  \ 2016 年 Apple 宣布已售出超过十亿部 iPhone 并不令人意外。在过去 5 年中，移动设备的使用量增长尤其迅速，2021 年的数据显示，活跃的\
  \ iOS 设备数量达到十亿部。\n\n存储在智能手机上的信息可以帮助调查解决关键问题，揭示个人与谁联系过、在哪里以及他们用设备做了什么。随着新功能被添加到设备中，并且\
  \ App Store 上有更多应用可用，存储在 iOS 设备上的信息量持续增长。\n\n移动取证可以定义为在法证可靠的条件下使用经过验证的手段从移动设备恢复数字证据的过程。\n\
  \n我们能从设备上恢复的证据类型取决于设备本身以及用于数据提取的技术，但通常，智能手机包含个人信息，例如通话记录、消息、电子邮件、照片、视频、备忘录、密码、位置数据和传感器数据。没有其他计算设备像手机一样个人化。\n\
  \n通常，检查过程应揭示所有数字证据，包括可能被隐藏、模糊或删除的痕迹。证据是通过应用既定的科学方法获得的，应充分描述数据的内容和状态，包括其位置、潜在意义以及不同数据源之间的关系。取证过程始于从移动设备提取证据的副本。一旦副本可用，下一步涉及分析数据、识别证据并制定最终报告的内容。\n\
  \n## iOS 取证的新黄金时代\n\n在过去 3 年中，数字取证行业经历了一场重大革命。\n\n2019 年，针对 iOS 设备的 **checkm8**\
  \ 漏洞的发现是一个彻底的游戏规则改变者，因为它为数字取证调查员打开了新的大门，允许对数以亿计的 Apple 设备进行完整文件系统提取。如果你从未见过完整文件系统提取，你可能会对设备存储的数据的范围和种类感到惊讶！\n\
  \nCheckm8 基于一个无法修补的硬件缺陷，该缺陷直接存在于 iOS 设备的芯片上，从运行 Apple A11 芯片的设备一直到 A5 世代。这包括从 iPhone\
  \ 4S 到 iPhone X 以及多款 iPad。\n\n此漏洞具体是一个 BootROM 漏洞，这意味着它利用了 iOS 设备在启动过程中加载的初始代码中的安全缺陷，并且无法通过\
  \ Apple 的软件更新覆盖或修补。\n\n在 2019 年底，**checkra1n** 发布了，这是基于 checkm8 漏洞的第一个公开、闭源越狱。数字调查员和取证分析师已迅速采用\
  \ checkra1n 来访问设备的文件系统和钥匙串；然而，与所有越狱一样，此解决方案有几个缺点，因为使用越狱不可避免地会修改设备文件系统上的某些数据，并且不被认为在法证上是可靠的。\n\
  \n出于这些原因，Cellebrite、Elcomsoft 和 Oxygen Forensic 等厂商已开发出基于原始 checkm8 漏洞的专有解决方案，这些解决方案通过修补设备的\
  \ RAM 来工作。这些工具允许调查员在不触及系统和用户分区以及不对设备进行任何更改的情况下执行完整文件系统提取，因为漏洞在内存中运行。\n\n换句话说，在选定的设备上，可以利用\
  \ checkm8 漏洞提取完整文件系统，而无需实际越狱设备。下表显示了容易受到 checkm8 漏洞攻击的设备列表：\n\n| iPhone 4S | iPhone\
  \ 5/5c/5s | iPhone 6/6s | iPhone SE |\n|---|---|---|---|\n| iPhone 7 | iPhone 8\
  \ | iPhone X | iPad 2nd–7th gen |\n| iPad Mini 2nd and 3rd | iPad Air 1st and 2nd\
  \ | iPad Pro | Apple Watch 1st–3rd |\n\n表 1.1 – 容易受到 checkm8 漏洞攻击的设备\n\n要利用 checkm8\
  \ 进行文件系统提取，你的设备必须兼容，并且必须运行受支持的 iOS 版本。这是一个主要缺点，因为较新的设备，例如最新的 iPhone 13，并不受支持。然而，还有其他选择。\n\
  \n在 2020 年，Elcomsoft 和 Belkasoft 等厂商引入了基于代理的提取，这是一种新的采集方法，允许在不越狱设备的情况下进行完整文件系统提取。安装在设备上后，代理通过软件漏洞逃离沙箱，获得对设备的无限制访问，并建立设备与计算机之间的连接。基于代理的提取在法证上是安全的，通常比大多数越狱更快更安全。截至撰写本文时，受支持的设备包括从\
  \ 5S 到 iPhone 12 的所有 iPhone，运行 iOS 9.0 到 14.3 版本。\n\n在 2020 年 5 月，**unc0ver** 越狱发布了重大更新，增加了对基于\
  \ A12-A13 芯片的设备的支持。截至撰写本文时，unc0ver 支持从 iPhone 5s 到 iPhone 12 的所有设备越狱。支持的 iOS 版本范围从\
  \ iOS 11 到 iOS 14.3。\n\n尽管越狱设备允许完整文件系统提取，但它不被认为是一个法证可靠的过程。如果受支持，调查员应首先考虑更安全的选项，例如\
  \ checkm8 或基于代理的提取。\n\n提示\n\n需要注意 checkm8 基于的提取与通过 checkra1n 或 unc0ver 越狱设备之间的区别。诸如\
  \ **Cellebrite UFED** 和 **Elcomsoft iOS Forensics Toolkit** 之类的工具利用 checkm8 漏洞通过在设备\
  \ RAM 中运行漏洞来临时提供对整个文件系统的访问。提取完成后，设备将正常重启。不会对设备进行永久更改。\n\n另一方面，越狱设备会留下永久痕迹，并且还需要安装\
  \ Cydia 或 AFC2 等第三方软件包，从而对设备进行额外更改。\n\n## iOS 取证中的挑战\n\n智能手机被视为实时、动态系统，因此从取证角度来看，它们带来了几个挑战，因为数据和文件\
  \ constantly 变化。\n\n数字调查员可能面临的主要复杂性之一是处理锁定设备：最近的 iOS 更新使密码破解几乎不可能，其他选项必须被考虑以尽可能多地提取数据。\n\
  \n设备数量的增长以及它们运行的软件的多样性使得开发单一工具和一致的工作流程来应对所有情况变得极其困难。这通常是因为用于从一台设备提取数据的方法在发布新版本的\
  \ iOS 时会停止工作；事实上，取证提取工具通常依赖于安全漏洞来访问设备的文件系统并提取比 iTunes 备份中通常找到的更多数据，甚至在密码未知时解锁设备。当\n\
  \n\n新的 iOS 更新发布后，这些漏洞可能会被修补，从而使工具失效。\n\n现代调查人员在接触 Apple 设备时必须考虑这些问题，并应根据具体情况决定采用哪种最佳技术，以获取最广泛的有价值证据。\n\
  \n## 剖析 iOS 操作系统\n\n对来自移动设备的数字证据进行取证检查，不仅需要充分理解数据，还需要了解设备本身如何工作以及这些数据是如何生成的基础知识。这在\
  \ iOS 设备上尤其具有挑战性，因为该平台闭源，因而难以理解 iOS 到底如何与所有这些数据交互，以及设备后台发生了什么。\n\nApple 投入大量精力，通过多项安全特性来限制可在其硬件上运行的操作系统和应用软件：Apple\
  \ 设备上运行的应用不直接与底层硬件交互，而是通过系统接口进行交互。iOS 可被定义为设备硬件组件与设备上应用之间的中介。\n\n提示\n\n许多出版物都提供有关\
  \ iOS 硬件的信息。如需完整的 iPhone 组件和设备列表，请参阅 Apple 支持页面：https://support.apple.com/specs/iphone。\n\
  \n## 理解 iOS 文件系统\n\n自 iOS 10 以来，Apple 文件系统（APFS）已取代 HFS+ 成为默认文件系统。APFS 是一个专有文件系统，专为移动设备而设计：它针对\
  \ SSD 存储进行了优化，并支持强加密。在 iOS 设备上，文件系统被配置为两个逻辑磁盘分区——系统分区和用户分区：\n\n- 系统分区包含 iOS 操作系统以及设备随附的所有预加载应用，但这些应用几乎不包含证据信息。系统分区仅在设备执行固件升级时才会更新。\n\
  - 用户分区挂载在 /private/var 目录下，包含所有用户创建的数据，并提供与调查人员相关的大部分证据信息。\n\n## 数据在 iOS 文件系统上存储在哪里？\n\
  \niOS 管理应用与硬件之间通信的例子之一是沙盒机制，它使用户无需直接访问文件系统即可与应用交互，确保每个应用都*被包含*在一个或多个特定容器中，这些容器会在设备上安装新应用时自动创建。这种组织方式让调查人员轻松很多，因为与特定应用相关的所有文件都分组在特定位置。\n\
  \n每个容器都有特定的作用：\n\n- 捆绑包容器包含应用本身，包括从 App Store 下载应用时附带的所有资源。\n- 数据容器保存应用和用户的数据，并进一步划分为多个目录，应用可使用这些目录来组织其数据。\n\
  - 组容器是应用存储数据的地方，这些数据可以与同组的其他应用共享。\n\n下图展示了每个应用的容器：\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_18_0.png)\n\
  \n图 1.1 – 应用容器示意图\n\n数据容器包含几个不同的文件夹：\n\n- Documents/：此文件夹包含用户创建的文件，并且会自动纳入 iTunes\
  \ 备份和 iCloud 备份。\n- Library/：此文件夹供应用存储与应用相关的数据，并非由用户创建。此文件夹包含在 iTunes 和 iCloud 备份中。\n\
  - Temp/：包含应用相关的临时文件，不包含在备份中。\n\n如你所见，所有应用文件都完美地组织到各自的数据容器中。不过，你可能想知道这些容器到底存储在设备文件系统上的什么位置。设备上的每个应用都通过**全局唯一标识符（GUID）**进行标识，也称为\
  \ BundleID 标识符。该标识符在应用首次安装时唯一生成，如果应用被更新或重新安装，则可能会改变。\n\n应用捆绑包容器存储在 iOS 文件系统的以下路径中：\n\
  \n```\n/private/var/containers/Bundle/Application/<app-GUID>/\n```\n\n应用数据容器存储在以下路径中：\n\
  \n```\n/private/var/mobile/Containers/Data/Application/<app-GUID>/\n```\n\n组容器存储在以下路径中：\n\
  \n```\n/private/var/mobile/Containers/Shared/AppGroup/<app-GUID>/\n```\n\n提示\n\n\
  在本节中，我们了解了应用在 iOS 文件系统上存储数据的位置。但系统工件呢？系统相关的数据分布在文件系统的各个位置，所以我们不会在一个地方找到所有内容！我们将深入探讨系统工件以及在哪里找到它们，详见_第4章，处理常见iOS工件_。\n\
  \n## iOS 文件系统上的数据是如何存储的？\n\n到目前为止，我们学习了 iOS 如何将应用数据组织到容器中，以及这些容器在文件系统上的存储位置。现在，让我们讨论\
  \ iOS 文件系统中通常包含有用证据的文件类型。\n\n除了用户生成的内容（如文档、照片、视频或文本文件）之外，存储在 iOS 设备上的数据通常由以下项目组成：\n\
  \n- **SQLite 数据库**：SQLite 是一个独立、自包含的数据库，可以在一个文件中存储几乎任何类型的数据，包括二进制 BLOB。SQLite 数据库是应用和系统数据的主要存储来源，因此解析这些数据库将是大多数数字调查的重点之一。如果你希望尝试恢复已删除的数据，数据库也极其有用，因为已删除的记录通常会在数据库本身或其临时文件中留下数字痕迹。短信、WhatsApp\
  \ 对话、通讯录、通话记录、备忘录和浏览器历史记录等基本工件都存储在 SQLite 数据库中。\n- **属性列表文件（Plists）**：Plists 是 iOS\
  \ 和应用用来在设备上存储、组织和访问数据的结构化文件。这些文件可以以 XML 格式或二进制格式存储。通常，plists 用于存储应用设置或用户偏好。\n- **其他文件类型**：包括日志文件、XML\
  \ 文件、Protocol Buffers 和 Realm 数据库。本书稍后将深入介绍这些文件类型。\n\n以下是 XML 格式的属性列表示例：\n\n```\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<!DOCTYPE plist PUBLIC\
  \ \"-//Apple//DTD PLIST 1.0//EN\"\n\"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\
  >\n<plist version=\"1.0\">\n    <dict>\n        <key>UUID</key>\n        <string>3bdd52c7-ee36-4689-8517-c5fed2c98s5</string>\n\
  \        <key>ClientID</key>\n```\n\niPhone X，苹果推出了 Face ID，它利用面部识别来解锁设备。\n\n解锁受密码保护的\
  \ iOS 设备是移动取证中的主要挑战之一。\n\n由于数字密码的组合数量相对较少，理论上可以使用暴力猜测攻击来利用身份验证机制。然而，这极其危险，因为 iOS\
  \ 被设计为对密码输入尝试进行速率限制，如果失败尝试次数过多，设备上的数据可能会被永久删除。\n\n该密码不仅用于解锁设备本身——它还是 iOS 数据保护模型的关键特性之一：密码与硬件加密密钥结合，用于生成一个唯一且极强加密的密钥，该密钥由算法用来加密用户数据。\n\
  \n## 加密与数据保护\n\n虽然用户身份验证在防止未经授权访问物理设备方面提供了一定程度的安全性，但这些机制仍可能通过利用软件或硬件漏洞而被绕过。被入侵的设备可能会允许未经授权访问设备的文件系统。因此，从\
  \ iPhone 4 开始，整个文件系统都使用强大的加密算法进行加密。然而，随着 iPhone 5s 的发布，苹果引入了名为**数据保护**的技术，开创了移动安全的新先例，该技术依靠多个专用组件来支持加密和生物识别。\n\
  \n## 安全隔区\n\niOS 安全的核心是安全隔区，这是一个与主处理器和操作系统隔离的专用**片上系统（SoC）**，为数据保护和密钥管理提供加密操作。\n\
  \n安全隔区的主要组成部分如下：\n\n\n\n- **安全隔区处理器（SEP）**，运行 Apple 修改版的 L4 微内核，并专门为安全隔区提供计算能力。\n\
  - 一个内存保护引擎。\n- 一个**真随机数生成器（TRNG）**，用于生成随机加密密钥。\n- 专用的**高级加密标准（AES）**硬件引擎，通过安全通道直接与\
  \ SEP 通信，并在文件写入或读取时执行内联加密和解密。\n- 一个**唯一 ID（UID）**，是唯一标识设备的加密密钥。UID 是随机生成的，在设备制造过程中直接熔入安全隔区的硬件中，因此在设备外部不可见。\n\
  - 一个专用的、安全的非易失性存储系统，只能由安全隔区访问。数据加密密钥存储在此处，确保这些密钥永远不会暴露给 iOS 系统或应用。\n\n下图显示了安全隔区的各个组件：\n\
  \n![](img/0b17a17d4cb56b1c25763a396dd83117_24_0.png)\n\n### 图 1.2 – 安全隔区组件\n\n安全隔区负责多项与安全相关的操作，包括生成和存储加密设备数据所需的密钥，以及评估来自\
  \ Touch ID 和 Face ID 的生物识别数据。\n\nSEP 使用 UID 生成与特定设备绑定的加密密钥。这增加了一层安全保护：如果设备的 SSD\
  \ 存储被物理移动到另一台设备，文件将无法解密，因此无法访问，因为每台设备都有唯一的 UID，解密文件需要原始的 UID。\n\n### iOS 数据保护密钥\n\
  \niOS 上的数据保护通过生成和管理分层加密密钥来实现。\n\n为了便于理解，在深入细节之前，我们先来看看加密和解密过程中使用了哪些密钥，以及它们的用途是什么：\n\
  \n![](img/0b17a17d4cb56b1c25763a396dd83117_25_0.png)\n\n图 1.3 – 用于 iOS 数据保护的加密密钥\n\
  \n- 设备的 UID 是一个 AES 256 位密钥，在制造过程中直接熔入安全隔区。该密钥与用户的密码一起，用于解锁*类密钥*。\n- 类密钥是在设备上发生特定事件时生成的；例如，当设备被解锁时，会创建一个*完全保护*类密钥。设备锁定后不久，解密后的类密钥即被丢弃。类密钥用于包装和解包文件密钥。\n\
  - 文件密钥是 256 位密钥，用于加密每个文件的内容；这些密钥是每个文件独立的密钥，因此每次在用户分区上创建新文件时都会随机生成。文件密钥使用类密钥加密，然后存储在文件的元数据中。所有文件的元数据都使用文件系统密钥加密。\n\
  - 文件系统密钥是一个随机密钥，在 iOS 首次安装或设备被擦除时生成。文件系统密钥存储在设备上，其设计目的是在用户\n\n*用户认证*类；这允许数据在保持加密的同时可供设备访问。\n\
  \n### iOS 数据加密和解密\n\n当文件写入文件系统时，文件内容使用每个文件唯一的密钥进行加密，该密钥使用类密钥进行包装，并存储在文件的元数据中。然后，元数据使用文件系统密钥进行加密。\n\
  \n我们已经了解了类密钥是如何结合硬件 UID 和用户密码生成的，而文件系统密钥是在 iOS 安装时生成并存储在设备上。现在，让我们逐步分析单个文件的加密过程：\n\
  \n- 1. 每次在文件系统上创建文件时，安全隔区都会生成一个 256 位的文件密钥，并将该密钥传递给硬件 AES 引擎。\n- 2. AES 引擎在文件内容写入闪存时使用提供的文件密钥对其进行加密。\n\
  - 3. 然后，根据分配的保护类别，使用四个类密钥之一对文件密钥进行包装，并存储在文件的元数据中。\n- 4. 所有文件的元数据都使用文件系统密钥进行加密。\n\
  \n所有密钥处理均在安全隔区内进行，因此操作永远不会暴露给系统及其应用。\n\n解密过程则相反：\n\n- 1. 打开文件时，使用文件系统密钥解密其元数据，从而获取被包装的文件密钥和分配的保护类别。\n\
  - 2. 使用类密钥解包文件密钥，然后将其传递给 AES 引擎。\n- 3. 硬件 AES 引擎在从内存读取文件时，使用提供的文件密钥解密文件内容。\n\n这里需要理解的关键点是，你用来检查移动设备并从中提取数据的过程，才是使检查具有取证意义的关键。既不是你使用的软件，也不是你使用的硬件，而是你在检查过程中使用的过程，才使其真正具有取证意义。\n\
  \n随着技术不断发展和不同移动设备的上市，这些指南和流程应定期审查。\n\n## 扣押和识别\n\n第一步涉及对设备的物理扣押。这包括收集设备所涉事件类型的信息，以及至少一些关于设备所有者的基本信息。\n\
  \n扣押的方式取决于你所在的司法管辖区，因此你应熟悉有关扣押和分析智能设备的法律及其要求（通常需要搜查令）。在此阶段，你还应对预期找到的数据有一个大致了解，这将有助于你确定具体目标，并根据你的需求规划后续步骤。\n\
  \n首先，你需要记录你所做的每一件事，并考虑如何保全证据。你*如何*处理设备至关重要，并且可能对调查结果产生巨大影响。\n\n你还应记录设备被发现时的状态。以下是一些示例：\n\
  \n- 设备是开机还是关机？\n- 设备是否受密码保护？\n- 密码是否已知？\n- SIM 卡是否存在？\n- 是否有可见损坏？\n- 设备上的日期和时间是多少？\n\
  - 如果设备处于开机状态，正在运行哪些应用？\n- 基本所有权信息。\n\n取证合规流程的基本要素之一是，操作应在不以任何方式更改或改变设备上数据内容的情况下进行。请注意，iOS\
  \ 设备是活跃的动态计算机系统，因此与设备的任何交互都会导致系统文件和数据库发生变化，更不用说可能无意中删除包含有用证据的临时文件了。除下一节将指出的保全操作外，应小心限制与设备的所有交互。\n\
  \n一旦设备被扣押，调查人员可能会忍不住手动访问设备中的数据，例如运行消息应用并直接查看设备屏幕上的对话；然而，应强烈劝阻这种做法，因为这会导致系统日志和其他与系统相关的文件被更改，这不是取证合规的行为。\n\
  \n在此阶段，调查人员还需要识别设备、其硬件型号以及 iOS 版本。如果你想开始评估调查人员从设备中提取证据有哪些选择，这些信息将会很有用。\n\n对于每次检查，调查人员还应识别以下内容：\n\
  \n- 检查设备的法律权限\n- 检查的目标\n- 其他潜在证据来源（包括云存储）\n\n## 保全\n\n\n\n\n\n智能手机的设计初衷就是通过蜂窝网络、蓝牙连接和无线\
  \ Wi-Fi 网络进行通信。为了防止设备通信，尽快隔离设备非常重要。隔离设备可防止新数据（来电、接收消息等）修改现有证据，从而强制执行数据保存。此外，如果允许设备联网，数据销毁就可能发生，因为\
  \ Apple 产品可通过 *kill signal* 远程擦除。\n\n隔离 Apple 设备最简单的方法是启用 **Airplane** 模式；这会停用设备的无线和蜂窝连接。你可以从设备的\
  \ **Settings** 中启用 **Airplane** 模式，或如果设备已锁定，可直接从控制中心通过从底部向上滑动启用。如果设备是 iPhone X 或更新机型，你可以通过从右上角向下滑动访问控制中心。不过值得注意的是，隔离设备也可以通过将设备放入法拉第袋来实现，法拉第袋是一种由金属屏蔽制成的容器，可阻断蜂窝网络、GPS\
  \ 和 Wi-Fi 网络使用的无线电频率。\n\n不要忘记保持设备充电，以确保其不会关机。一般来说，你希望设备保持你发现时的状态：\n\n- 如果设备是关的，就保持关机。\n\
  - 如果它是开的，确保你保持开机状态，以免锁定！\n\n如果设备受密码保护且调查人员没有密码，这一点尤其重要：如果设备断电，它将从 AFU 状态转变为 BFU\
  \ 状态，从而使数据恢复变得更加困难，在某些情况下甚至不可能。我们将在本章后面了解更多关于设备状态的信息。\n\n### Tip\n\n最常见的错误之一是从未锁定的设备中取出\
  \ SIM 卡以将其与蜂窝网络隔离。在处理不同设备时这可能有意义，但你应避免从 iPhone 或 iPad 中取出 SIM 卡，因为这样做会导致 iOS 自动锁定设备，生物识别解锁将被禁用，并且\
  \ USB 限制模式将被激活。\n\n成功扣押并隔离设备后，应注意维护设备的保管链。NIST 将保管链定义如下：\n\n> “一种通过记录处理证据的每个人的信息、收集或转移的日期/时间以及转移目的，来跟踪证据在其收集、保护和分析生命周期中的移动的过程。”\n\
  \n你可以通过访问以下网站了解更多关于此主题的信息：\n\n[CSRC.nist.gov](https://csrc.nist.gov/)。\n\n## Acquisition\n\
  \nAcquisition 是从设备获取信息和证据的过程。\n\n在实际采集过程开始之前，你应该清楚地了解自己正在寻找哪种证据，因为这会对你选择的工具产生很大影响。\n\
  \n一般来说，有三种不同类型的数据采集，调查人员选择的方法会影响可以从设备中提取的数据量：\n\n- Logical acquisition\n- Full filesystem\
  \ acquisition\n- Physical acquisition\n\n在下面的表格中，你可以看到每种方法可以提取哪种数据：\n\n| | Logical\
  \ | Filesystem | Physical |\n|---|---|---|---|\n| Calls, calendars, contacts, and\
  \ messages | ✓ | ✓ | ✓ |\n| User content (photos, videos, notes, and so on) | ✓\
  \ | ✓ | P |\n| Keychain | Limited | ✓ | ✓ |\n| Third-party app data | Limited |\
  \ ✓ | ✓ |\n| Apple Pay | - | ✓ | ✓ |\n| Location data (radio cells, GPS fixes, and\
  \ so on) | - | ✓ | ✓ |\n| Mail | - | ✓ | ✓ |\n| User activity logs | - | ✓ | ✓ |\n\
  | System logs | - | ✓ | ✓ |\n| Deleted data (unallocated space) | - | - | ✓ |\n\
  | Deleted data (SQLite databases) | Limited | ✓ | ✓ |\n\n表 1.2 – 不同采集方法可提取数据的比较\n\
  \n## Logical and filesystem extractions\n\n正如你所见，逻辑采集将从设备中提取一些用户生成的数据，例如照片、消息和笔记。逻辑提取通常是最简单、最快速的提取类型，大多数取证工具都支持它。然而，考虑到\
  \ iOS 设备上可用的文件数量，只有获取完整的完整文件系统才能访问宝贵的证据，例如第三方应用数据、精确的位置数据和生活模式信息。\n\n文件系统提取是设备用户分区的文件和文件夹的表示；通过分析数据库和临时文件（例如\
  \ WAL 文件），可以部分恢复已删除的数据。\n\n## Physical extraction\n\niPhone 4 及更早的设备可以进行完整的、取证可靠的整个原始磁盘物理提取。这种提取提供的数据最多，就像标准硬盘一样，系统和用户分区以及磁盘的未分配区域都会被提取。这非常有用，因为它允许调查人员恢复已删除的数据，包括消息、照片和视频。然而，随着\
  \ iOS 5 的引入，Apple 改变了磁盘上数据的加密方式，并启用了其他安全功能，例如数据保护类密钥。截至撰写本文时，提取现代 iOS 设备的物理镜像是不可能的。\n\
  \n## Choosing the best acquisition method\n\n调查人员应始终先执行逻辑采集，然后如果可能的话，再尝试文件系统或物理采集。\n\
  \n通常需要越狱设备才能实现对设备文件系统的不受限制访问；然而，越来越多的厂商增加了运行取证可靠的基于 checkm8 的提取（所有操作都在设备的易失性 RAM\
  \ 中执行）或基于代理的提取的可能性。这两个选项都允许你在不越狱设备的情况下获取完整的文件系统。\n\n归根结底，你选择的方法通常取决于四个变量：\n\n- 你发现设备的状态（锁定或未锁定）\n\
  - 设备型号和 iOS 版本\n- 你可以使用的工具\n- 越狱设备的可能性\n\n如果设备已锁定且你没有密码，就没有一种简单的解决方案可以始终绕过 iOS 安全。然而，根据设备型号，有几个选项可以提供有限的数据。我们将在下一章详细介绍这些选项。\n\
  \n如果设备未锁定，根据可用工具，你可以尝试文件系统提取。你应该从较不具侵入性的选项开始，例如内存中的 checkm8 漏洞利用，如果你的工具支持的话。如果设备不允许\
  \ checkm8 漏洞利用，你可以尝试基于代理的提取，如果 iOS 版本兼容的话。虽然这需要安装代理到设备上并且可能会发生一些小的更改，但这被认为在取证上是安全的。如果这两个选项都不可用，你可以考虑通过\
  \ checkra1n 或 unc0ver 越狱设备。确保你了解越狱的工作原理，它如何影响设备以及风险是什么。最后，如果这些选项都不可用，你将不得不进行逻辑采集。\n\
  \n我们将在下一章学习有关从 iOS 设备提取数据的所有内容，但现在重要的是要注意，手机应使用经过测试、可重复且尽可能取证可靠的方法进行采集。强烈建议在测试设备上使用各种工具进行实验，以确定哪种采集方法和工具最适合不同的设备。\n\
  \n如果你无法直接访问设备，还有其他证据来源可供考虑，例如 iTunes 备份和 iCloud 提取。\n\n## Analysis\n\n进行取证检查的主要目的是找到、提取和处理与特定案件或调查相关的证据。\n\
  \n虽然没有标准流程来分析你从设备中提取的内容，但以下是一些可以帮助你入门的指南：\n\n- 浏览所有可用数据，以熟悉设备上发现的主要证据来源。\n- 使用你的工具和取证软件快速解析常见的数据源，例如\
  \ SMS 数据库、已安装应用、通话记录、照片等。\n- 尝试使用软件恢复任何已删除的数据，并通过手动 carving 二进制文件、日志、plists 和 SQLite\
  \ 数据库进行恢复。\n\n\n\n\n\n- 通过搜索特定于调查的关键词和细节来识别关键证据。\n- 从文件中收集元数据并查找隐藏证据（时间戳、地理位置数据、二进制\
  \ BLOB 等）。\n- 查找不同证据之间的关系。\n- 对所有获取的证据进行时间分析，建立相关证据和事件的时间线。\n\n当处理的数据量有限时，可能通过手动浏览工作站上的所有文件夹并查看文件内容来评估证据。然而，当面对数\
  \ GB 的数据源时，包括 SQLite 数据库、缓存和 plists，你很可能不得不求助于取证工具。在这种情况下，调查人员必须制定策略，根据数字证据的类型和调查目标使用最佳工具。\n\
  \n我们将在 *第 2 章，从 iOS 设备获取数据* 和 *第 3 章，使用取证工具* 中详细介绍商业工具，但在那之前，必须指出所有移动取证工具都只是应用软件。这些工具并不是只需点击按钮就能进行自主处理和报告的神奇事物！数字调查人员必须了解每个工具的\
  \ *功能* 和局限性。\n\n移动取证工具通常在可执行的提取类型上有所不同，但不同工具也兼容不同的设备和不同版本的 iOS 操作系统。鉴于各种不同的移动设备类型，没有任何单一软件支持所有移动设备。\n\
  \n自动化工具可以加快处理庞大数据集所需的时间，我坚信现代调查人员应拥有不止一种工具可用。然而，这一过程不能替代系统化、手动的取证检查和验证。\n\n最终，一切都取决于目标设备型号、iOS\
  \ 版本、提取类型、检查的目标以及产生的证据以后可能如何使用。\n\n## 验证\n\n在处理完设备上的证据后，调查人员必须验证已执行的所有步骤的准确性。此过程不应仅专注于验证从设备提取的数据。它还应包括验证用于检查的工具，并验证整个过程以确保其以取证可靠的方式进行。\n\
  \n不幸的是，验证是最容易被忽视的方面之一。\n\n在开始检查之前，强烈建议在测试设备和已知数据集上尝试各种工具，以确定哪些获取和分析工具最适合特定的 iOS\
  \ 设备型号和版本。\n\n既定的程序应指导获取和分析设备的过程。当调查人员处理来自第三方应用或 **未识别取证对象 (UFOs)** 的数据时尤其如此。必须测试实践，以确保获得的结果是\
  \ *有效* 的并且可以独立 *重现*。\n\n被要求就其发现作证的检查员应能够解释不仅 *发现* 了什么证据，还应解释 *在哪里* 发现该数据以及 *如何*\
  \ iOS 操作系统生成了这些证据。这可能涉及手动解码二进制数据和文件雕刻。分析用户数据被解析出的实际二进制文件以及 SQLite 数据库和 plists，为调查人员提供了深入分析\
  \ iOS 设备文件系统的机会，提取出仅依赖自动工具可能遗漏的证据。\n\n以下列表类似于有关验证和确认的最佳实践：\n\n- **哈希值**：在获取过程中应对从设备提取的所有文件进行哈希处理，以确保不会发生任何更改。如果进行文件系统提取，可以在过程结束时为每个文件计算哈希值。数据完整性可以通过为单个文件计算哈希并将其与原始值进行检查来验证。\n\
  - **确定性工具：** 用于检查的所有工具都应是确定性的：在相同情况下，给定工具在给定相同输入数据时应产生相同的输出。\n- **数据验证：** 检查设备上存储的已知数据是否准确报告，未做任何修改。一般来说，从设备提取的数据应与在设备屏幕上查看的数据相匹配。\n\
  - **工具准确性：** 工具输出的质量应通过使用多个工具提取/处理相同数据并比较结果来检查。\n- **流程测试：** 在处理 UFOs 或尚未建立检查流程的证据时，通过在不同设备上和已知控制条件下测试每个解决方案来验证你的发现，并评估每次测试的结果。\n\
  \n## 报告\n\n移动取证过程中的最后一步是报告。报告可以定义为准备一份详细摘要，说明为从移动设备获取和分析数字证据所做的工作。取证报告还应包括所有相关证据，以清晰简洁的方式呈现，以及调查得出的结论。\n\
  \n许多取证工具提供内置的报告功能，允许你自动生成数字报告，其中包含来自调查的项目，例如以下内容：\n\n- 关键证据\n- 设备识别（型号、序列号、电话号码等）\n\
  - 案件编号和分析员姓名\n- 检查进行的日期和时间\n- 用于提取和分析的工具\n\n根据你的司法管辖区，取证报告还应描述数据是如何提取的（逻辑、物理或文件系统提取），并解释为确保整个过程可重复且取证可靠所采取的措施。\n\
  \n## 时间线分析\n\n最常见的取证报告形式之一包括时间分析，其定义为创建设备上在指定日期和时间发生的事件时间线的过程。\n\n时间线通常包括来自各种来源的数据；例如，位置数据、系统日志和消息证据可以结合起来，从而发现发生了什么、在哪里发生以及何时发生。\n\
  \n确定设备上事件发生的时间并通过报告日志、文件和时间戳将设备使用与个人关联起来可能非常有用。\n\n## 总结\n\n在本章中，我们了解了取证检查的目标以及发现\
  \ checkm8 漏洞如何为从 iOS 设备获取数据提供新的机会。\n\n首先，我们介绍了 iOS 操作系统并讨论了其安全架构的一些关键元素，例如安全飞地和数据保护。然后，我们介绍了\
  \ iOS 取证检查的步骤。\n\n第一步是扣押设备并采用保留证据的技术，例如将设备放入法拉第袋或启用飞行模式。有不同的方法可以从 iOS 设备获取数据，这取决于型号、iOS\
  \ 版本和可用工具。本章涵盖了逻辑和文件系统获取技术，以及越狱和基于代理的提取。\n\n分析证据应遵循彻底的验证流程，以确保商业工具产生一致的结果，并且证据已以取证可靠的方式处理。\n\
  \n最后，我们了解了取证报告中应包含的关键要素。\n\n下一章将详细讨论 iOS 数据获取，并提供对用于进行取证检查的工具的实践方法。\n\n\n\n\n"
- '## 第 2 章：从 iOS 设备获取数据


  与台式电脑相比，移动设备在数据获取阶段会带来一套独特的问题。虽然在台式电脑的世界里，有一种成熟的工作流程可以让调查人员进行所谓的 *取证可靠* 的获取，但在处理移动设备时，并没有一种一刀切的程序可以适用于每一种设备。当我们处理
  iOS 设备时，这一点变得更加明显，因为各种机型和不同版本的 iOS 意味着，要实现令人满意的获取，所执行的程序会因设备本身而异。通常，某种特定的工具、漏洞利用或厂商解决方案在设备更新到新的
  iOS 版本后就会停止工作。对于大多数依赖公开漏洞的越狱来说，这就是典型情况，而这些漏洞随后会被苹果修复。另一个挑战是可能需要处理锁定设备；在这种情况下，从设备中提取有用信息的机会要少得多。


  因此，数据获取可以说是 iOS 取证工作流程中最具挑战性的方面。因此，在本章中，我们将讨论各种解决方案，首先区分不同类型的获取方法及其局限性。然后我们将进入实践阶段，学习如何对
  iOS 设备执行逻辑、文件系统和物理获取。


  在本章中，我们将涵盖以下主题：


  - 理解获取方法

  - 越狱设备

  - 快速取证设备

  - 执行逻辑获取

  - 执行完整文件系统获取


  ### 理解获取方法


  在第一章中，我们简要讨论了获取方法以及逻辑、文件系统和物理提取之间的区别。现在我们将在此基础上深入研究更高级的主题，以全面了解它们的工作原理以及我们能从每种获取方法中期望获得何种数据。


  ### 逻辑获取


  逻辑获取通常是从 iOS 设备提取最常见类型证据最简单、最快的方式。如果设备已解锁或你拥有密码，你肯定能够执行逻辑获取，因为所有 iOS 设备都支持它；基于 **Apple
  File Connection (AFC) 协议**，这种获取本质上等同于运行本地（iTunes）备份，一些取证工具实际上会依赖苹果的库和 iTunes 功能从设备中提取数据。


  逻辑获取可以使用免费软件如 **iTunes**、第三方库如 `libimobiledevice`，或使用取证软件来执行。在本章的后续部分中，我们将使用三款最受欢迎的数字取证工具来执行逻辑获取：*Cellebrite
  UFED、Elcomsoft iOS Forensic Toolkit 和 Magnet ACQUIRE。*


  正如我们在上一章中所了解的，逻辑获取的主要限制在于提取数据的深度和质量；虽然它会包含 *大部分* 用户生成内容，例如短信、通话记录、照片和笔记，但它 *不会*
  包含其他珍贵的痕迹，例如电子邮件、位置数据、第三方应用和精确的系统日志。这里的关键点是，苹果和 iOS 开发者可以通过决定哪些文件会包含在备份中、哪些文件不会备份来限制逻辑提取。例如，许多流行应用，如
  **Twitter、Facebook、Instagram、Telegram** 或 **Signal**，不会将其文件包含在本地备份中，因此这些痕迹无法通过逻辑获取获得。


  为了让事情变得更加复杂，在 iOS 4 发布时，苹果引入了一项功能，使用户能够使用密码 **加密** 本地备份。此设置可通过 iTunes 激活，一旦启用，后续所有备份都将使用提供的密码自动加密。换句话说，如果我决定启用备份加密，下一次在任何电脑上尝试本地备份时，就需要密码才能读取备份文件。显然，这对取证调查人员来说在多个方面都构成问题；如果启用了备份加密且密码未知，从逻辑获取中提取的数据将毫无用处，因为无法解密它。一些取证工具，如
  Elcomsoft Phone Breaker，允许调查人员通过暴力破解密码来攻击加密备份；然而，这并不能保证密码会被有效恢复，而且暴力破解攻击通常需要相当长的时间。


  不过，还有另一种选择。自 iOS 11 起，苹果引入了直接从设备中删除用于加密本地备份的密码的可能性。


  这里有个前提：虽然此解决方案效果完美，但它不仅会删除加密密码，还会重置 *所有* 设备的设置。显然，这会对设备中存储的一些文件产生影响，但如果没有备份密码的访问权限，这可能是你唯一的选项。


  以下是重置本地备份加密密码的方法：


  - 1. 在 iOS 设备上，进入 **设置 | 通用 | 还原**。

  - 2. 选择 **还原所有设置** 选项并输入设备密码。

  - 3. 按照步骤还原设备。


  按照此流程，你不会丢失任何用户数据或其他密码，但它会重置通用设备设置，如壁纸、显示设置等。这当然会导致系统文件和数据库发生一些变化；因此，如果你处理的是刑事案件中的设备，请确保你了解对原始设备进行更改的后果，并确保你有法律授权执行此类操作。


  ### 提示


  需要注意的是，自 iOS 13 起，如果用户决定加密本地备份，将包含更多数据，包括来自钥匙串、通话、健康数据、Safari 历史记录等的数据。在执行逻辑获取时，大多数取证工具会检查是否启用了备份加密，如果未启用，则会临时启用以获取尽可能多的数据，并在获取过程结束后再次禁用。请记住这一点——如果你在执行逻辑获取前不加密备份，你将错过关键证据！


  为了更好地了解在逻辑提取中可以期望找到哪些痕迹，请查看以下从 *Cellebrite Physical Analyzer* 截取的屏幕截图，其中显示了通过逻辑获取从
  iOS 设备获取的数据：


  ![](img/0b17a17d4cb56b1c25763a396dd83117_45_0.png)


  图 2.1 – 通过逻辑获取获取的数据


  你想要执行逻辑获取的主要原因是在处理较新设备时，因为它们通常在 iOS 更新发布后就会得到支持，因此你不必等待太久即可开始收集证据；然而，正如我们已经讨论的那样，许多项目不会包含在逻辑获取中。


  与标准逻辑提取相比，完整文件系统提取或物理提取可让调查人员访问 iOS 设备上更多用户数据，包括完全访问钥匙串，其中还将包含可用于解密来自 Signal、Wickr、Snapchat
  或 Facebook 等安全应用的数据的加密密钥。


  通过获取完整文件系统，调查人员还将获得许多系统痕迹的访问权限，例如设备上发生的完整事件历史记录（锁定/解锁状态、用户交互、已安装




  applications, AirDrop, Bluetooth, camera, and airplane mode history). Also, a lot
  more geodata will be available from a full filesystem acquisition, including artifacts
  from cell towers, Wi-Fi connections, and GPS locations with the corresponding geo-coordinates
  and timestamps.


  The following screenshots show the differences between a logical acquisition and
  a full filesystem acquisition from the same device; the full filesystem extraction,
  on the right, contains a lot more data:


  ![](img/0b17a17d4cb56b1c25763a396dd83117_46_0.png)


  still obtained during a filesystem acquisition, but the examiner is also granted
  access to raw files stored within the device. This allows investigators to access,
  for example, databases of all third-party applications without restrictions, and
  recovery of deleted artifacts can also be attempted.


  Although there are many tools that allow you to perform this kind of acquisition,
  Apple restricts direct access to the device''s filesystem, so you will have to find
  a workaround to gain full access to the device before a full filesystem acquisition
  can be performed.


  So, you may be wondering – how do I access the device filesystem? Is a **jailbreak**
  required? Although jailbreaking is one of the available options, it is not the only
  one.


  At the time of writing, there are three different solutions to gain access to the
  device''s filesystem:


  - Using tools that leverage Checkm8, a BootROM exploit

  - Using an extraction agent

  - Jailbreaking the device


  ## Checkm8


  The publication of the Checkm8 vulnerability in 2019 by the hacker @axi0mX, which
  is based on an unpatchable vulnerability present in the BootROM of millions of iOS
  devices, is arguably the biggest game changer ever in the forensics industry.


  Checkm8 is compatible with A5 to A11-based devices; this includes all devices starting
  from the iPhone 5s up to the iPhone X, as there is no working implementation for
  4S hardware.


  Before we get into the details, it''s useful to understand how the iOS boot procedure
  works and why the Checkm8 vulnerability cannot be patched.


  ![](img/0b17a17d4cb56b1c25763a396dd83117_50_0.png)


  Figure 2.3 – iOS secure boot chain


  As you can see, the first step in the boot process is the execution of the code
  from the device''s BootROM. This stage of the process is implicitly trusted because,
  as its name implies, the BootROM is a read-only memory component that cannot be
  modified after manufacturing by anyone, not even by Apple.


  The Checkm8 exploit is based on a vulnerability that resides within this portion
  of read-only memory, so this means that Apple has no way of patching it, leaving
  hundreds of millions of iOS devices vulnerable. To have a better understanding of
  what a breakthrough this is, keep in mind that the previous BootROM exploit was
  discovered in 2010!


  ### Tip


  If you''re interested in the technical details, you can find a full report on the
  Checkm8 vulnerability at the following link:


  In light of these limitations, some vendors have come up with a built-in solution
  that allows investigators to perform a full filesystem acquisition, exploiting the
  Checkm8 vulnerability but *without* actually jailbreaking the device.


  Currently, this feature is available in some of the most popular forensic tools,
  including *Cellebrite UFED*, *Elcomsoft iOS Forensic Toolkit*, and *Oxygen Forensic
  Detective*.


  The difference between these solutions and performing a traditional jailbreak through
  checkra1n is that these tools do not modify the device in any way; the exploit is
  performed in the device''s RAM. Once the acquisition process ends, the device will
  reboot normally, leaving no traces.


  Whenever possible, this should be the preferred method to acquire the full filesystem
  from an iOS device, as this is definitely the most forensically sound solution.


  ## Agent-based acquisitions


  The main drawback in Checkm8 acquisitions is that they''re not supported by newer
  devices like the **iPhone 12** or the **iPhone 13**, as these devices are not vulnerable
  to the Checkm8 exploit.


  In 2020, vendors responded to these limitations by providing an alternative method
  to extract the full filesystem from any iOS device, including the latest iPhone
  12; this solution relies on installing an extraction agent that will exploit software
  vulnerabilities, gain access to the entire filesystem, and establish a secure connection
  between the device and the computer.


  Although this method requires installing an application (**the agent**) on the device,
  this is considered forensically safe, as the agent leaves a drastically smaller
  footprint compared to other solutions, like jailbreaking the device. The only traces
  left on the device are some minor changes in system log files; however, because
  of this, depending on your jurisdiction, you may need authorization or legal authority
  to use this method.


  The following is a list of requirements to use this method:


  - Supported iOS devices: all devices starting from the iPhone 5s up to iPhone 12.

  - Supported iOS versions: iOS 9.0 through to iOS 14.3.

  - Using an **Apple ID** registered in Apple''s Developer Program is strongly recommended
  for installing the agent on the device, as this relieves the need to open internet
  access on the device.


  Currently, *Elcomsoft iOS Forensic Toolkit* and *Belkasoft Evidence Center X* are
  the only tools that provide agent-based extraction capabilities.


  ## Jailbreaking the device


  Finally, let''s talk about jailbreaks! We''ve seen how it''s possible to extract
  a full filesystem from an iOS device by exploiting the CheckM8 vulnerability or
  by performing an agent-based acquisition. However, as we''ve learned, both these
  methods have their limitations, and there could be some cases where jailbreaking
  the device is your only option to perform a filesystem acquisition.


  Applying a jailbreak will leave some permanent traces on the device, so this option
  should only be considered as a last resort and only if you have the legal authority
  to do so.


  At the moment, the most popular jailbreaks are **checkra1n** and **unc0ver**. Both
  these jailbreaks allow investigators to install third-party tools such as SSH, which
  will give unrestricted access to the device''s filesystem.


  In the following table, you can check the compatibility for both these jailbreaks:


  ![](img/0b17a17d4cb56b1c25763a396dd83117_55_0.png)


  Figure 2.4 – The main checkra1n screen


  - 4. When you''re ready, click **Start**. The device will reboot into recovery mode
  automatically.

  - 5. You will now be presented with instructions on how to reboot the device into
  DFU mode. Follow the instructions until your device shows a black screen:


  ![](img/0b17a17d4cb56b1c25763a396dd83117_56_0.png)


  Figure 2.5 – Follow the instructions to put the device in DFU mode


  - 6. At this point, checkra1n will begin the jailbreak process. The device will
  boot PongoOS and should look like this:


  ![](img/0b17a17d4cb56b1c25763a396dd83117_58_0.png)


  Figure 2.7 – Enter the passcode when requested


  When the device reboots, you will find the checkra1n icon. Launching that application
  will allow you to install Cydia. Once Cydia is installed, you can proceed to install
  any third-party packages, such as SSH.


  Remember that checkra1n is a semi-tethered jailbreak; if you reboot the device,
  you will have to jailbreak it again using the checkra1n tool.


  Once the device has been successfully jailbroken, you can perform a full filesystem
  acquisition using the tool of your choice.


  ## Triaging the device


  When you''re dealing with iOS devices, it''s useful to gather some information directly
  from the device prior to starting the acquisition process. Knowing what iOS version
  is running on the device, for instance, can be useful to determine what the best
  acquisition method is. For this purpose, we''re going to use `libimobiledevice`.


  The `libimobiledevice` library is a cross-platform library that allows users to
  communicate with an iOS device using their native protocol to provide access to
  the device''s filesystem, including information about the device and its internals.
  It works with all devices, including the most recent ones.


  The first step is to head to http://libimobiledevice.org, where the library can
  be downloaded for free. If you''re running Windows, instead of downloading the source
  files and compiling them, you can download precompiled binaries from the project''s
  GitHub repository.


  If you''re running macOS, you can install the library simply by running the following
  command from the terminal:


  ```

  brew install libimobiledevice

  ```


  If you''re running a Linux distribution that supports the apt packet manager, you
  can install the library by running the following command:


  ```

  sudo apt-get install usbmuxd libimobiledevice6

  libimobiledevice-utils

  ```


  Once you have installed the library, connect the device to your forensic workstation
  and run the following command from the terminal:


  ```

  ideviceinfo

  ```


  This command will connect to the device, parse data relevant to the hardware and
  software, and display it on screen. Keep in mind that the device will have to be
  paired with the host system by entering the passcode. If you''re running Linux or
  macOS, you can combine the previous command with the grep command to view some key
  data:


  ### Identifying the device model:






  您可以通过运行以下命令来读取设备型号：


  ```

  ideviceinfo | grep ModelNumber

  ```


  ## 识别 iOS 版本：


  要识别设备运行的 iOS 版本，可以运行以下命令：


  ```

  ideviceinfo | grep ProductVersion

  ```


  ## 识别设备序列号：


  可以通过运行以下命令来解析设备的序列号：


  ```

  ideviceinfo | grep SerialNumber

  ```


  ## 识别电话号码：


  最后，要识别设备中 SIM 卡对应的电话号码，请运行以下命令：


  ```

  ideviceinfo | grep PhoneNumber

  ```


  ## 决定最佳获取方法


  一旦设备被扣押、正确隔离，并且您已确认硬件型号和 iOS 版本，检查过程的下一步就是评估哪种获取方法最适合在保持数据完整性的同时从设备中提取最丰富的数据。


  一般来说，在对设备执行任何操作之前，您需要牢记这两个概念：


  - 按照**易失性**的顺序获取证据。

  - 从侵入性较低的方法开始获取证据。


  任何获取过程的第一步都是确定目标数据的易失性；例如，如果调查范围是从设备中提取照片或解析短信，这显然不会引起任何担忧，因为这些数据写入闪存，不易失，任何获取方法都能提取这些痕迹。然而，如果调查旨在了解设备的使用方式、特定日期和时间是否有人机交互，或者设备几天前位于何处，这些痕迹的易失性要高得多，因为
  iOS 设备上的日志文件和数据库会被不断覆盖。例如，位置数据通常会在设备上保留数周；然而，*精确的*位置数据（包括基站数据）只保留几天。在这种情况下，我们需要尽快提取此类数据，以免被覆盖。这意味着在其它操作之前尽可能先执行完整文件系统获取，因为逻辑获取不包含这些数据。


  调查人员应清楚了解取证工具的工作原理及其对数据和设备本身的影响：


  - 您决定做的任何事情（包括什么都不做！）都会对设备产生影响。

  - 您的操作会对数据产生什么影响？

  - 所选的获取方法是否需要重启设备？

  - 相关痕迹能否在设备重启后保留？

  - 痕迹在设备上覆盖前能保留多长时间？

  - 越狱会影响哪些文件或文件夹？

  - 运行 Checkm8 获取会产生哪些变化？


  ## 执行基于代理的获取会发生哪些变化？


  逻辑获取对设备几乎没有任何影响，因此通常这会是您的首选。如果设备易受 Checkm8 攻击，并且您拥有可执行此类获取的工具，那么 Checkm8 获取将是在不对设备做任何更改的情况下访问整个文件系统的最佳选择。如果这不是一个可行选项，下一步就是考虑基于代理的获取。最后，作为最后手段，越狱设备可以让调查人员访问整个文件系统，但请务必了解这将如何影响设备及其数据。


  ## 执行逻辑获取


  现在我们已经学习了理论，是时候通过执行第一次逻辑获取来将其付诸实践了。


  几乎所有取证工具都可以执行逻辑获取；我们将重点介绍其中最流行的两种：Cellebrite UFED 和 Elcomsoft iOS Forensic Toolkit。


  Cellebrite UFED 被视为行业标准，因为它允许调查人员执行多种不同类型的获取，包括传统逻辑获取、部分文件系统获取、通过 Checkm8 进行的完整文件系统获取，以及从已越狱设备进行的完整文件系统获取。


  另一方面，Elcomsoft iOS Forensic Toolkit 可以执行逻辑获取、从越狱设备进行完整文件系统获取、通过基于代理的提取进行完整文件系统获取，并且还支持对旧设备的物理获取。


  ## 使用 Cellebrite UFED 进行逻辑获取


  在本示例中，我们将获取一台运行 iOS 12 的 iPhone 6：


  1. 第一步是启动 Cellebrite UFED，并从主屏幕选择 Mobile device：


  ![](img/0b17a17d4cb56b1c25763a396dd83117_63_0.png)


  图 2.8 – Cellebrite UFED 的主屏幕


  2. 接下来，选择 AUTO DETECT 选项，或使用屏幕左上角的搜索功能选择设备型号：


  ### 图 2.9 – 选择设备或让 UFED 自动检测


  3. 设备被识别后，UFED 将根据 iPhone 型号显示可用的获取方法。选择 Logical (Partial) 获取以继续：


  ### 图 2.10 – 选择获取类型


  4. Cellebrite UFED 的最佳功能之一是它允许您选择要提取的数据。这将大大加快提取过程，让您在几分钟内访问有用的证据。选择应提取的痕迹，然后点击
  Next 开始获取过程：


  ![](img/0b17a17d4cb56b1c25763a396dd83117_65_0.png)


  ### 图 2.11 – 选择应提取的痕迹


  5. 要执行逻辑获取，设备必须已解锁。请考虑在设备设置中禁用 Auto-lock。当设备提示配对请求时，您还应该选择 Trust（信任）此电脑：


  ![](img/0b17a17d4cb56b1c25763a396dd83117_67_0.png)


  图 2.13 – 提取摘要显示已提取的数据


  您可以通过将逻辑获取内容加载到取证工具中来查看提取的数据，例如 Belkasoft Evidence Center X、Elcomsoft Phone Viewer
  或 Cellebrite Physical Analyzer。


  ## 使用 Elcomsoft iOS Forensic Toolkit 进行逻辑获取


  另一个用于从 iOS 设备执行获取的优秀工具是 Elcomsoft 的取证工具包。该工具包专为 iOS 设备设计，并提供一些独特功能，例如基于代理的提取。步骤如下：


  1. 启动 Elcomsoft iOS Forensic Toolkit，并检查设备是否被正确识别。从下面的截图可以看出，该工具分为四个部分，每个部分处理不同的获取过程。在我们的示例中，我们想要获取逻辑镜像，且设备未越狱，因此我们将选择
  Backup 选项，该选项将执行逻辑获取：


  ![](img/0b17a17d4cb56b1c25763a396dd83117_68_0.png)


  图 2.14 – Elcomsoft iOS Forensic Toolkit 的主屏幕


  2. 选择备份文件的存储文件夹：


  ![](img/0b17a17d4cb56b1c25763a396dd83117_69_0.png)


  图 2.15 – 选择备份的存储位置


  3. 为了获得最完整的逻辑镜像，应启用备份加密。工具包将自动检测加密是否已启用；如果未启用，它将通过将密码设置为 123 来启用加密。获取过程结束时，备份加密将被禁用：


  ![](img/0b17a17d4cb56b1c25763a396dd83117_70_0.png)


  图 2.16 – 工具包将在屏幕上显示进度和调试信息


  最后，工具包将给出获取过程的摘要。现在可以使用您选择的取证工具检查提取的文件。


  我们已经了解了如何使用两种不同工具执行逻辑获取。请记住，有多种不同工具可以执行此类获取，包括免费工具。在下一节中，我们将学习如何执行完整文件系统获取。


  ## 执行文件系统获取






  ![](img/0b17a17d4cb56b1c25763a396dd83117_72_0.png)


  **图 2.17 – 选择完整文件系统（checkm8）选项**


  3. 接下来，设备必须关机。关机后，你需要进入 **恢复模式**，然后从那里将设备置于 **DFU 模式**。屏幕上的说明相当准确，但基本上，设备关机后，你应按住
  **Home** 按钮同时连接设备。这会将设备置于 **恢复模式**。从那里，按住 **电源** 按钮和 **Home** 按钮 10 秒，然后松开 **电源**
  按钮，同时继续按住 **Home** 按钮几秒。此操作可能因设备型号而异。一旦设备进入 DFU 模式，**继续** 按钮将亮起：


  ![](img/0b17a17d4cb56b1c25763a396dd83117_73_0.png)


  图 2.18 – UFED 将显示如何进入恢复模式和 DFU 模式的说明


  4. 此时，UFED 将利用 Checkm8 漏洞对设备进行利用。这可能需要几分钟。整个过程在设备的易失性内存中执行，因此设备本身不会发生任何更改，并且在采集过程结束时将恢复正常启动：


  ![](img/0b17a17d4cb56b1c25763a396dd83117_73_1.png)


  图 2.19 – 利用设备可能需要几分钟


  5. 一旦设备被成功利用，采集阶段将开始，设备将显示进度指示器：


  ![](img/0b17a17d4cb56b1c25763a396dd83117_74_0.png)


  图 2.20 – 采集进行中


  6. 完整文件系统将被镜像并归档为 DAR 文件，其类似于 TAR 归档：


  ![](img/0b17a17d4cb56b1c25763a396dd83117_75_0.png)


  图 2.21 – 提取结果将归档为 DAR 文件


  采集过程结束时，设备将自动正常重启。生成的 DAR 归档可以通过导入到 Cellebrite Physical Analyzer 或你选择的工具进行分析。


  ### 基于代理的完整文件系统采集


  Elcomsoft iOS Forensic Toolkit 是少数支持基于代理采集的工具之一。由于此方法需要将应用程序（代理）侧载到设备上，因此你需要一个 Apple
  ID。在 Windows 版本中，你需要一个 Apple Developer ID，而在 macOS 上，你可以使用传统账户：


  1. 开始时，启动工具包并检查设备是否被正确识别：


  图 2.22 – Elcomsoft iOS Forensic Toolkit 主屏幕


  2. 从菜单中选择选项 1，这将把代理安装到设备上。你将被要求提供 Apple ID 凭据，并且需要通过双重身份验证。然后，代理将使用你的 Apple ID 进行签名并安装到设备上：


  ```

