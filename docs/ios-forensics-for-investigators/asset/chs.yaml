  \n### AppGenie 是什么？\n\nAppGenie 是一个研究工具，试图从设备数据库中自动识别特定类型的证据。AppGenie 基于过去的解码支持和启发式规则分析数据库，并可提供额外的应用数据，如联系人、用户账户和聊天记录。\n\
