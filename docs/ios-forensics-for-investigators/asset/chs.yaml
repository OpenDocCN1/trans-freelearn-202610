  \            - Copy media files from the device\n  S  SHARED           - Copy shared\
  \ files of the installed applications\n  L  LOGS             - Copy crash logs\n\
  \nJailbroken devices acquisition\n  D  DISABLE LOCK     - Disable screen lock (until\
  \ reboot)\n  K  KEYCHAIN         - Decrypt device keychain\n  F  FILE SYSTEM   \
  \   - Acquire device file system (as TAR archive)\n\nAcquisition agent (limited\
  \ compatibility)\n  1  INSTALL          - Install acquisition agent on device\n\
  \  2  KEYCHAIN         - Decrypt device keychain\n  3  FILE SYSTEM      - Acquire\
