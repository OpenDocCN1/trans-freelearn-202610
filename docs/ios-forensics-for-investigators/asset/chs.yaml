  ## 总结






  在本章中，我们学习了第三方 iOS 应用程序。首先，我们学习了应用程序将数据存储在何处、如何识别已安装的应用程序，以及如何将应用程序与其 GUID 关联。然后，我们专注于分析第三方应用程序。我们介绍了动态分析的概念，并学习了分析应用程序的逐步流程。我们还学习了如何使用
  cda 工具识别数据容器、如何监控文件系统变化，以及如何可视化应用程序的网络流量。


  最后，我们提供了一份实用的速查表，其中包含可在流行的第三方 iOS 应用程序中找到的最常见工件的路径和描述。


  在下一章中，我们将讨论 iOS 取证中的更高级主题。

