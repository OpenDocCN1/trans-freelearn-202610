    Done.


    Press ''Enter'' to continue

    ```'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'The following screenshot shows the step where a BFU acquisition is selected:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_286_0.png)


    Figure 11.3 – Cellebrite UFED performing a BFU acquisition


    Once the acquisition process completes, the keychain and filesystem dumps can
    be analyzed as usual, manually, or using forensic software, such as **Cellebrite
    Physical Analyzer**.


    # Tip


    It''s worth mentioning that performing a BFU acquisition completely bypasses USB
    Restricted Mode; with iOS 11, Apple introduced a security feature that prevents
    USB accessories from making any data connection if the device wasn''t unlocked
    at least once within the past hour. Theoretically, this should limit the attack
    surface against physically connected *hacking tools*; however, exploiting the
    device through Checkm8 bypasses this security feature.


    Although a BFU acquisition is the best option to extract data from a locked device,
    it''s clear that newer devices – which are not vulnerable to Checkm8 – cannot
    be acquired with this method. Investigators attempting to access'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'these devices will have to resort to sending the phone to a third-party lab
    that offers forensic services, such as Cellebrite Advanced Services.


    If a device cannot be acquired *directly*, it may still be possible to extract
    its data *indirectly*, by locating and analyzing the device''s **backup**, which
    may be stored on a host computer or in the **cloud**.


    In the next section of this chapter, we''ll introduce iTunes backups, and we''ll
    learn how to extract and analyze them.


    # Introducing iTunes backups


    Investigating a device that is locked by an unknown passcode can quickly bring
    an investigation to a halt if the iPhone in question is one of the newer models,
    such as the **iPhone 13** or the **iPhone 12**; however, if the suspect has backed
    up their device to their desktop or laptop and the investigator has access to
    this machine, the backup can easily be recovered, extracted, and analyzed.


    Another reason why examining backups may be beneficial is that the user may have
    deleted some data from their mobile device, but that doesn''t delete the data
    that resides within the backup: it''s quite common, in fact, that backup files
    contain data that the user believes no longer exists.


    Local backups, also called **iTunes backups**, are essentially a logical acquisition
    of the device and typically contain contacts, SMS messages, media files, logs,
    databases, keychains, preferences, configurations, browsing artifacts, and location
    data, for example. A backup can be created manually by the user using **iTunes**,
    or the device can be configured to automatically create a new backup when it is
    plugged into a machine. On macOS computers, iTunes is no longer required, and
    the backup process can be started directly from **Finder**.


    When an iTunes backup is created, iOS allows the user to enhance security by encrypting
    the backup with a password. Once the user sets the password, all subsequent backups
    will be encrypted, and the files will only be accessible to the examiner if the
    password is known. However, password'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'cracking can be attempted, and this will be covered in detail later on in the
    chapter.


    It''s important to understand that since iOS 13, iTunes backups will not contain
    user-sensitive data (such as call logs, keychain, and Safari history) if encryption
    is not enabled.


    # Locating backup files


    An iTunes backup is essentially a folder named with a GUID that contains numerous
    subfolders and files. The following screenshot should give you an idea of what
    it looks like:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_288_0.png)


    Figure 11.4 – File structure of an iTunes backup


    On Windows machines, iOS backups are typically stored at C:\Users\<user>\AppData\Roaming\Apple
    Computer\MobileSync\Backup. If,'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'however, the Windows app version of iTunes is installed, local backups will
    be stored at C:\Users\<user>\Apple\MobileSync\Backup.


    On machines running macOS, local backups will be stored at

    /Users/<user>/Library/Application Support/MobileSync/Backup/.


    By examining these locations, the investigator may find multiple backups of the
    same device, or backups for different devices.


    In the root folder of each backup, there are four files of interest:


    +   - Info.plist: This property list contains details from the device such as
    the IMEI, ICCID, model number, the list of all installed applications, and the
    timestamp of when the backup was created.

    +   - Manifest.db: The Manifest database is a normal SQLite database, but it will
    be encrypted if a password was specified for the backup. The main table of interest,
    Files, contains a list of all files included in a backup and their properties,
    such as fileID, domain, and path.

    +   - Manifest.plist: The Manifest property list stores information for every
    application that is installed on the device, such as the path to the app''s containers.
    This file also contains the IsEncrypted key, which indicates whether the backup
    was encrypted or not, and the WasPasscodeSet key, which tells us whether the device
    had a passcode.

    +   - Status.plist: This property list contains generic metadata, such as the
    backup''s unique identifier and the timestamp of when it was completed.


    Since we now have all the information from a backup, we can start putting the
    filesystem back together using our forensic tools.


    # Analyzing iTunes backups


    Once the investigator has located an iTunes backup, the filesystem has to be rebuilt
    and the files will need to be decrypted. Although this can also be done manually,
    the easiest solution is to import the backup into any mobile'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'forensic software, such as Cellebrite Physical Analyzer or **Elcomsoft Phone
    Viewer**, and analyze the data as usual.


    To import an iOS backup into Cellebrite Physical Analyzer, follow these steps:


    +   1. Launch the tool and from the main menu, choose **File | Open case**.

    +   2. Then, in **Case wizard**, click on **Add**.

    +   3. Choose **Common source | Backup | iTunes backup**.

    +   4. Select the folder that contains the backup and click **Continue**.


    Once Cellebrite Physical Analyzer has finished parsing the files, the artifacts
    can be examined as if they were a normal logical acquisition. The following screenshot
    shows the correct option within **Case wizard**:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_290_0.png)


    Figure 11.5 – Loading an iTunes backup into Cellebrite Physical Analyzer


    Previously, we learned that iTunes backups can be encrypted by setting a custom
    password. On such occasions, if the password is not known, the'
  merge: -1
  img_proc: true
