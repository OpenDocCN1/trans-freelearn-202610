- pgno: 182
  md: 'with their geographic coordinates. The device can use this data to resolve
    a radio signal into a physical location without needing a GPS signal.


    The data downloaded onto the device from Apple is called **Harvested Locations**
    data and it can be found in the `cache_encryptedB.db` database.


    Here, we can find several tables of interest:


    +   - Cell tower data can be found in the following tables:

    +     `CdmaCellLocation`, `CellLocation`, and `LteCellLocation`.

    +   - Wi-Fi device data is stored in the `wifiLocation` table. Routined Locations
    versus Harvested Locations Before we begin analyzing this data, it''s important
    to understand the difference between locations that the device visited and locations
    provided by Apple: the data we looked at previously, also known as routined location
    data, is typically very accurate as it comes from the device''s GPS and can show
    in detail where the device was located. Harvested Locations data, on the other
    hand, consists of locations provided by Apple as a way to augment the device''s
    knowledge about the area. This data is not retrieved from the built-in GPS receiver,
    but rather represents cell towers and wireless devices that are located in close
    proximity to the device.


    # Analyzing harvested cell tower data


    Cell tower data is stored in the `cache_encryptedB.db` database and is retained
    for about a week. The following is a list of the most relevant columns:


    +   - MCC, or **Mobile Country Code**, indicates the country code of the cell
    tower.

    +   - MNC, or **Mobile Network Code**, identifies the mobile operator.

    +   - CI, or **Cell ID**, is a unique number used to represent each transceiver
    station of a cell tower.'
  merge: -1
  img_proc: true
- pgno: 183
  md: "+   - The `HorizontalAccuracy` value indicates how precise the device believes\
    \ the coordinates are and is expressed in meters.\n+   - The `Latitude` and `Longitude`\
    \ columns store the geocoordinates.\n\nWe can extract all cell-related data by\
    \ running a SQL query, such as the one shown in the following code block. On the\
    \ device used for research, cell data was stored in the LTECELLLOCATION table;\
    \ however, this is dependent on the device model and iOS version:\n\n```\nSELECT\n\
    \    DATETIME(TIMESTAMP + 978307200, 'UNIXEPOCH') AS \"TIMESTAMP\",\n    MCC AS\
    \ \"MCC\",\n    MNC AS \"MNC\",\n    CI AS \"CI\",\n    HORIZONTALACCURACY AS\
    \ \"HORIZONTAL ACCURACY\",\n    LATITUDE AS \"LATITUDE\",\n    LONGITUDE AS \"\
