    : 480012\n}\n```\n```\n\nFigure 5.13 – The JSON object stored in Apollo's Output\
    \ column\n\nThe beauty of Apollo is that it is a fully modular and customizable\
    \ tool that allows the investigator to extract all pattern-of-life data or choose\
    \ to only include some artifacts by using the appropriate modules. Condensing\
    \ the result into a single file means that the investigator gains the ability\
    \ to view a timeline of events that can be easily filtered down based on date\
    \ and time or by searching for a specific event.\n\nApollo is under active development\
    \ and modules are continually being added and updated. Finally, it should be noted\
    \ that the tool not only supports iOS but also allows the analysis of pattern-of-life\
    \ data from MacOS devices and others.\n\n# Summary\n\nIn this chapter, we learned\
    \ what pattern-of-life forensics is and how an investigator can benefit from analyzing\
    \ such data to visualize user behavior and detect abnormal patterns."
