  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_127_0.png)


    Figure 4.11 – Using a hex viewer to display the contents of an SQLite file


    By analyzing the database header to understand the page size and location of free
    pages and free blocks, the examiner can use the tool of their choice to highlight
    a specific page in the file by specifying the offset and length, effectively isolating
    the page from the rest of the data. The page can then be analyzed by displaying
    its contents in string format.


    The following steps describe the process of manually parsing through pages of
    an SQLite database:


    +   1. Read the database header and identify the page size and number of pages.

    +   2. Work out the offset location of each page.

    +   3. Analyze the page header.

    +   4. If it''s an active page, search for any useful evidence in unallocated
    space or free blocks. If it''s a free page, analyze the entire page.

    +   5. Continue the process for each page in the database.


    The same principles apply to WAL files; as the file format is well documented,
    the examiner can open the WAL using a hex viewer, calculate'
  merge: -1
