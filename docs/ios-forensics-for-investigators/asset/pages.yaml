- pgno: 171
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_171_0.png)


    Figure 6.3 – Cell tower trilateration process


    It''s easy to see how the accuracy of the trilateration process varies so much
    depending on the location and density of the cell towers.


    # Wi-Fi and Bluetooth


    Wi-Fi networks and hotspots are also part of the A-GPS technology and can be used
    in combination with cell towers and satellite GPS to pinpoint a device''s location.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Similar to cell towers, Wi-Fi hotspots also broadcast a radio signal and the
    strength of this signal can be measured through the RSSI. Mobile devices are constantly
    scanning for wireless hotspots, searching for known networks, so it makes sense
    to use these to calculate a device''s whereabouts. The range of a Wi-Fi signal
    is only about 70 m outdoors and 40-50 m indoors, so if a device picks up the signal,
    it must be physically near to the hotspot.


    With this in mind, it''s clear how mobile devices can evaluate the RSSI of Wi-Fi
    networks to establish an approximate distance between the device and the hotspot.
    Then, iOS resolves this data to a physical location using the peer-based mechanism
    described earlier on.


    Bluetooth beacons can also be used in a similar way.


    # # Locating location artifacts


    In the first part of this chapter, we introduced the Location Services API and
    learned how iOS uses different technologies to assess its position. Now, we''ll
    take an in-depth look at the SQLite databases where geolocation data is stored.


    The following is a list of files of interest that can only be found in a full
    filesystem extraction:


    +   - `/private/var/mobile/Library/Caches/com.apple.routined/Cache.sqlite`


    This is the primary storage means for iOS location data. The ZRTCLLOCATIONMO table
    contains several useful records, such as GPS coordinates, timestamps, and a horizontal
    accuracy value, which is an indicator of how accurate the device believes the
    GPS coordinates to be. The ZRTWIFIACCESSPOINTMO table stores a list of Wi-Fi networks
    that the device has scanned. Generally speaking, data contained in this database
    should be considered up to date and accurate.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '```

    ```text

    /private/var/mobile/Library/Caches/com.apple.routined/Local.sqlite

    ```

    ```


    This SQLite database is identical to the `Cache.sqlite` database in its structure.
    Depending on the iOS version, the ZRTLEARNEDLOCATIONOFINTERESTSMO table usually
    contains details for any *frequent locations*, which we will look into later on.


    ```

    ```text

    /private/var/mobile/Library/Caches/com.apple.routined/Cloud-V2.sqlite

    ```

    ```


    As the name suggests, this database stores location data that should be synced
    to iCloud.


    ```

    ```text

    /private/var/root/Library/Caches/locationd/cache_encryptedDB.db

    ```

    ```


    This database contains harvested location data received by Apple, such as radio
    cells and Wi-Fi networks; these records refer to cell towers in close proximity
    to the device, although the accuracy of these geo-coordinates should always be
    checked.


    ```

    ```text

    /private/var/root/Library/Caches/locationd/cache_encryptedC.db

    ```

    ```


    This database stores data received from the device''s accelerometer, such as motion
    data and generic health-related artifacts.


    ```

    ```text

    /private/var/root/Library/Caches/locationd/consolidated.db

    ```

    ```'
  merge: -1
