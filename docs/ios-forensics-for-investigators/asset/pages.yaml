- pgno: 174
  md: 'Finally, this database is used by the GeoFence API, and any application that
    creates a geofence will be stored here.


    To gain a better understanding of how location-related data is stored in these
    databases, we''ll analyze each of them separately and we''ll learn what queries
    can be used to extract meaningful insights.


    # Analyzing location data


    As we''ve already learned, iOS devices track a multitude of different location-related
    artifacts. The investigator should have a clear understanding of how and where
    these are stored and which ones are locations that the user actually visited,
    versus locations that were simply in close proximity to the device.


    The first step in a forensic analysis of location data is the Cache.sqlite database.
    This database contains an extremely accurate history of coordinates provided by
    the device''s GPS receiver. Typically, this data is stored for just over a week.


    We''re going to start by looking at the ZRTCLLOCATIONMO table. The following is
    the table''s structure:


    +   - ZLATITUDE and ZLONGITUDE store the geocoordinates.

    +   - The ZALTITUDE column indicates an estimate of the altitude. This data is
    provided by the device''s accelerometer.

    +   - The ZHORIZONTALACCURACY column indicates how accurate the device believes
    the coordinates to be, expressed in meters.

    +   - ZVERTICALACCURACY indicates the altitude''s accuracy, in meters.

    +   - The ZTIMESTAMP column stores the timestamp, in Mac Absolute Time format.


    A full history of the device''s location data can be obtained by running the following
    query:'
  merge: -1
  img_proc: true
- pgno: 175
  md: "```\nSELECT\n    DATETIME(ZTIMESTAMP + 978307200, 'UNIXEPOCH') AS \"TIMESTAMP\"\
    ,\n    ZLATITUDE AS \"LATITUDE\",\n    ZLONGITUDE AS \"LONGITUDE\",\n    ZALTITUDE\
    \ AS \"ALTITUDE\",\n    ZSPEED AS \"SPEED (M/S)\",\n    ZSPEED*2.23694 AS \"SPEED\
    \ (MPH)\",\n    ZSPEED*3.6 AS \"SPEED (KMPH)\",\n    ZHORIZONTALACCURACY AS \"\
    HORIZONTAL ACCURACY\",\n    ZVERTICALACCURACY AS \"VERTICAL ACCURACY\"\nFROM\n\
    \    ZRTCLLOCATIONMO;\n```\n\nFirst, we use the datetime SQL command to convert\
    \ the Mac Absolute timestamp to a readable string. Then, we select the relevant\
    \ columns from the table and calculate the speed at which the device was moving.\n\
    \nThe following figure shows the query results:\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_175_0.png)\n\
    \nFigure 6.4 – The query results show the device's location\n\nAs you can see,\
    \ location artifacts provide the investigator with an accurate idea of where a\
    \ certain user's device was at a given moment. Typically, this data is extremely\
    \ granular and it's not uncommon to see entries logged every second. The differences\
    \ in the data's granularity can be explained by the fact that GPS is not available\
    \ everywhere, so on these occasions, the device reverts to using Wi-Fi networks\
    \ and cell towers to establish its position, if there are any in close proximity."
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Once the investigator has acquired a list of geocoordinates, these can be used
    with a map provider to obtain visual feedback of the device''s whereabouts.


    ![](img/0b17a17d4cb56b1c25763a396dd83117_176_0.png)


    Figure 6.5 – The query results are mapped out to determine the user''s journey


    It should be noted that different databases store different types of location
    data that can be more or less accurate. From research that has been conducted,
    this data, which is known as **routined location data**, has proven to be highly
    accurate.


    # Understanding Significant Locations


    With the release of iOS 8, Apple introduced a feature known as **Frequent Locations**,
    which was renamed to **Significant Locations** starting from iOS 10. Essentially,
    every time a device visits a location, a record is stored in a SQLite database
    with details from the device''s journey. When the device has returned to the same
    location enough times, that becomes a *significant location*.'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'As of today, it is still unclear how the algorithm that Apple uses works and
    how many visits to a specific location are required for it to be considered significant.
    In terms of area, research has found that whenever a device is within a 250 m
    radius of a significant location, a visit to that location is logged.


    If location services are enabled, Significant Locations can be viewed directly
    from the device by going to **Settings | Privacy | Location Services | System
    Services | Significant Locations.**


    ![](img/0b17a17d4cb56b1c25763a396dd83117_177_0.png)


    Figure 6.6– Significant Locations can be viewed directly on the device


    Please keep in mind that since iOS 15, viewing Significant Locations on the device
    only shows a summary of these locations. The complete data will be available only
    from a full filesystem extraction.


    From a forensics point of view, frequent location data is invaluable, as it allows
    an investigator to understand what locations a user visited often. Also, data
    pertaining to significant locations typically goes way back in time.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'To view this data, we''re going to run the following query on the Local.sqlite
    database:


    ```

    SELECT

    DATETIME(ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZENTRYDATE + 978307200, ''UNIXEPOCH'')
    AS "ENTRY",

    DATETIME(ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZEXITDATE + 978307200, ''UNIXEPOCH'')
    AS "EXIT",

    (ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZEXITDATE-ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZENTRYDATE)/60.00
    AS "DURATION (MINUTES)",

    ZRTLEARNEDLOCATIONOFINTERESTMO.ZLOCATIONLATITUDE AS "LATITUDE",

    ZRTLEARNEDLOCATIONOFINTERESTMO.ZLOCATIONLONGITUDE AS "LONGITUDE",

    ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZLOCATIONUNCERTAINTY AS "LOCATION UNCERTAINTY",

    ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZDATAPOINTCOUNT AS "DATA POINTS"

    FROM

    ZRTLEARNEDLOCATIONOFINTERESTVISITMO

    LEFT JOIN

    ZRTLEARNEDLOCATIONOFINTERESTMO

    ON ZRTLEARNEDLOCATIONOFINTERESTMO.Z_PK = ZRTLEARNEDLOCATIONOFINTERESTVISITMO.ZLOCATIONOFINTEREST;

    ```


    Although this query may seem complicated, it''s actually a lot easier if we break
    it down into logical steps: first, we use the datetime SQL command to convert
    the timestamps into readable strings. The Entry field refers to when the device
    visited the significant location, and the Exit field indicates when the device
    left the location. Then, we calculate the duration (Duration) of the visit and
    print Latitude, Longitude, and Uncertainty. Finally, we print the number of data
    points (Data Points) for that visit to that particular location.


    The following figure shows the results of the query:'
  merge: -1
  img_proc: true
