    # Understanding Harvested Locations


    At the start of the chapter, we introduced the A-GPS technology and learned how
    Apple maintains a peer-based map of locations that are downloaded back onto the
    device when geolocalization is requested from Location Services. This data comprises
    thousands of records related to cell towers and Wi-Fi networks that are located
    in close proximity to the device, along'
  merge: -1
