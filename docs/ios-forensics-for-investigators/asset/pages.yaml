- pgno: 156
  md: 'As you can see, I was engaged in quite a few long-running tasks, such as Zoom
    meetings, web browsing, and playing media on YouTube and Netflix. Now, let''s
    suppose we want to dig deeper into the data and analyze what happened on the evening
    of 1 June, 2021. From the previous query result, we can see that on that evening,
    I was using Netflix. But what exactly was I watching?


    First, we''ll calculate the Mac timestamps for the date and time, and then run
    the following query:


    ```

    ```sql

    SELECT

    datetime(ZOBJECT.ZSTARTDATE+978307200,''UNIXEPOCH'',

    ''LOCALTIME'') as "START",

    datetime(ZOBJECT.ZENDDATE+978307200,''UNIXEPOCH'',

    ''LOCALTIME'') as "END",

    ZOBJECT.ZSECONDSFROMGMT/3600 AS "GMT OFFSET",

    (ZOBJECT.ZENDDATE-ZOBJECT.ZSTARTDATE) as "USAGE IN SECONDS",

    ZOBJECT.ZSTREAMNAME,

    ZOBJECT.ZSTRUCTUREDMETADATA,

    ZOBJECT.ZVALUESTRING

    FROM ZOBJECT

    WHERE ZOBJECT.ZSTARTDATE > 644266800

    AND ZOBJECT.ZSTARTDATE < 644277599

    ORDER BY "START";

    ```

    ```


