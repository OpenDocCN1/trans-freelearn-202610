- pgno: 282
  md: 'If the device is configured to produce unencrypted backups, the tool will automatically
    set a temporary password to ensure that all data is acquired during the backup
    process.


    In the next section, we''ll discuss passcode cracking.


    # Passcode cracking


    In the past, there were several methods for attempting to crack a device''s passcode,
    such as *black boxes* that could be connected to the device that would brute force
    every possible combination. Unfortunately, these methods only support legacy devices.


    With the iPhone 5s, Apple introduced the **Secure Enclave**, which effectively
    slows down passcode attempts, rendering brute force attacks impossible.


    There are still some software tools that can be used for the purpose, such as
    Elcomsoft''s iOS Forensic Toolkit, which can brute force the passcode for iPhones
    4, 5, and 5c running iOS 4 up to iOS 10.


    If the examiner is fortunate enough to run into one of these devices, a full physical
    acquisition can be performed, cracking the passcode, and effectively accessing
    the locked device. To perform a brute force attack, the device will have to be
    booted in **DFU mode** and exploited through the **Checkm8** vulnerability. A
    full brute force attack of a **six-digit passcode** takes approximately 21 hours
    to complete on an iPhone 5, and up to 40 hours on an iPhone 4.


    If passcode cracking is not an option and a lockdown record is not found, performing
    a BFU acquisition may be the only option. We''ll discuss these acquisitions in
    the next section.


    # BFU acquisition of locked devices'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'In *Chapter 2*, *Data Acquisition from iOS Devices*, we introduced the **Checkm8**
    vulnerability and the **checkra1n** jailbreak, which allows the examiner to gain
    full access to the filesystem of devices ranging from the **iPhone 5s** to the
    **iPhone X**. This vulnerability can be exploited to perform an acquisition from
    *locked* or *disabled* devices, even if the passcode is unknown. This kind of
    acquisition is called a **BFU acquisition.**


    It''s important to understand that a BFU acquisition only allows a *partial* extraction
    of the device''s data, as most files remain encrypted until the passcode is entered.
    Still, a partial extraction, including data from the keychain, is definitely better
    than nothing, as this could include notable evidence.


    The following table lists some of the most popular artifacts that can be extracted
    through a BFU acquisition:


    | Artifacts |

    |---|

    | `/private/var/mobile/Library/Preferences/*` |

    | `/private/var/preferences/SystemConfiguration/*` |

    | `/private/var/root/Library/Preferences/*` |

    | `/private/var/mobile/Library/Accounts/Accounts3.sqlite` |

    | `/private/var/mobile/Library/DataAccess/*` |

    | `/private/installd/Library/Logs/MobileInstallation/*` |

    | `/private/var/mobile/Library/SpringBoard/*` |

    | `/private/var/mobile/Library/CallHistoryDB/CallHistoryTemp.storedata` |

    | `/private/var/mobile/Library/Preferences/com.apple.*` |

    | `/private/var/mobile/Library/SMS/sms-temp.db` |

    | `/private/var/mobile/Library/Preferences/com.apple.preferences.network.plist`
    |

    | `/private/var/wireless/Library/Databases/CellularUsage.db` |

    | `/private/var/root/Library/Caches/locationd/consolidated.db` |


    Table 11.1 – Common artifacts found in BFU acquisition


    As you can see from the table, some key artifacts can be extracted from a locked
    device through a BFU acquisition, provided the device is vulnerable'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'to Checkm8.


    To perform a BFU acquisition, the device is initially jailbroken using checkra1n,
    which doesn''t require it to be unlocked. Then, the **keychain** is partially
    extracted, and a filesystem acquisition is performed using a tool such as the
    Elcomsoft iOS Forensic Toolkit. Some forensic tools, such as the **Cellebrite
    UFED**, don''t require the device to be jailbroken, as the Checkm8 exploit is
    performed directly within the tool.


    # Performing a BFU acquisition using the Elcomsoft iOS Forensic Toolkit


    The following steps describe the process of performing a BFU acquisition using
    the Elcomsoft iOS Forensic Toolkit:


    +   1. First, put the device in recovery mode and start checkra1n.

    +   2. Follow the instructions to put the device in DFU mode and apply the temporary
    jailbreak. Make sure that the device is connected using a USB-A cable, as using
    a USB-C cable will not work.

    +   3. Launch the Elcomsoft iOS Forensic Toolkit and choose the **K – Keychain**
    option.

    +   4. When the tool prompts you for the passcode, skip this step by pressing
    *Enter*.

    +   5. When the process completes, choose the **F – File System** option from
    the main menu to acquire the device''s filesystem.

    +   6. When the tool prompts you for the passcode, press *Enter* and wait for
    the process to finish.


    The following screenshot illustrates the process:'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'Figure 11.2 – Elcomsoft iOS Forensic Toolkit performing a BFU acquisition


    Next, we will repeat the process using a different tool.


    # Performing a BFU acquisition using the Cellebrite UFED


    Performing a BFU acquisition using Cellebrite UFED is also straightforward, and
    it doesn''t require the device to be jailbroken through checkra1n:


    +   1. Launch Cellebrite UFED.

    +   2. Select Advanced Logical and choose the Full File System (checkm8) option.

    +   3. Connect the device using a USB-A cable and click Continue.

    +   4. When the tool prompts you for the device''s password, click Cancel.

    +   5. Click YES to perform a BFU acquisition.


    ```

