    Now that we''ve learned how to extract basic cellular-related data, we will learn
    about analyzing communications. In this chapter, we will focus on phone calls;
    email and messaging will be discussed in more depth in Chapter 8, Email and Messaging
    Forensics.


    # Analyzing the address book


    Before we delve into the call history database, it''s useful to introduce the
    AddressBook.sqlite database, which contains the names and details of the contacts
    stored on the device. The database is located at /private/var/mobile/Library/AddressBook/
    and contains two tables of interest — ABPerson and ABMultiValue. The first contains
    the contact''s name and additional metadata that is used by the device, while
    the second table stores the actual data, such as phone numbers and email addresses.
    The two tables are connected through a one-to-many relationship.


    Now that we know the address book''s basic structure, we can extract the data
    by running the following query:'
  merge: -1
  img_proc: true
- pgno: 197
  md: "```\nSELECT p.First AS \"First Name\",\n       p.Last AS \"Last Name\",\n \
    \      GROUP_CONCAT(c.value) AS \"Contacts\"\nFROM   ABPerson AS p\n       LEFT\
    \ JOIN ABMultiValue AS c\n             ON c.record_id = p.rowid\nGROUP  BY p.rowid,\n\
    \          p.first;\n```\n\nFirst, we must select the columns that are relevant\
    \ to the first name and last name; then, we must use the GROUP_CONCAT SQL function\
    \ to aggregate all the contact data (phone numbers, emails, and so on) into one\
    \ column, Contacts. Then, we must use a JOIN statement to establish a relationship\
    \ between the ABPerson and ABMultiValue tables.\n\nThis query will extract a list\
    \ of all the contacts that are stored in the address book, as shown in the following\
    \ screenshot:\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_197_0.png)\n\nFigure\
    \ 7.3 – Records extracted from the address book\n\nNow that we've learned how\
    \ to extract contact data, we can start analyzing the call log.\n\n# Analyzing\
    \ the call log\n\nAll phone calls and FaceTime calls that have been placed, received,\
    \ or missed are logged in the CallHistory.storedata database, which is located\
    \ at /private/var/mobile/Library/CallHistoryDB/."
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Tip


    The `CallHistory.storedata` database was introduced in iOS 8. Previously, the
    call log was located in the `call_history.db` file. Also, keep in mind that the
    call history will only be available in an **After First Unlock (AFU)** state.
    Before the first unlock, the data is stored in a temporary file, called `CallHistoryTemp.storedata`.


    The most important data, from a forensic perspective, is stored in the ZCALLRECORD
    table, where you will find the following columns:


    +   - The ZDATE column contains the timestamp of when the call occurred, in Mac
    Absolute Time format.

    +   - ZADDRESS indicates the phone number that was called or where the call originated
    from if it was an incoming call.

    +   - The ZLOCATION column stores the location, which is calculated from the phone
    number.

    +   - The ZDURATION column indicates the call duration, in seconds.

    +   - The ZORIGINATED column indicates whether the call was incoming (0) or outgoing
    (1).

    +   - The ZANSWERED column indicates whether an incoming call was answered (1)
    or not (0).

    +   - The ZSERVICE_PROVIDER column shows the name of the service that generated
    the call. Typically, this will show `com.apple.Telephony` for traditional calls
    or `com.apple.FaceTime` for FaceTime calls.


    The following SQL query will extract meaningful data from the ZCALLRECORD table:


    ```

    SELECT

    DATETIME(ZDATE + 978307200, ''unixepoch'', ''localtime'') AS "Date/Time",

    ZADDRESS AS "Phone Number",

    ZLOCATION AS "Location",

    ZDURATION AS "Call in Seconds",

    ```'
  merge: -1
  img_proc: true
- pgno: 199
