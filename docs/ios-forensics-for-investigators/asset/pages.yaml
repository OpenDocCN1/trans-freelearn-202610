  md: '# Figure 3.10 – A summary of applications that should be parsed by the AppGenie


    +   5. Once the AppGenie is done, any extracted data will be added to the project
    tree in the category called **AppGenie Analyzed Data**.


    As you''ve seen in this brief introduction, Cellebrite Physical Analyzer makes
    browsing through thousands of artifacts a straightforward task; all data is categorized
    and easily accessible directly from the examination summary, and the AppGenie
    can help uncover unparsed evidence.


    An in-depth look at all Physical Analyzer''s features is beyond the scope of this
    chapter, so make sure you take the time to fully explore this tool and get familiar
    with all the rest of its useful features, such as **keyword searching, evidence
    tagging, Python scripts, and built-in reporting capabilities**.


    # Working with Magnet AXIOM


    Magnet AXIOM is one of the most popular tools for digital forensics. It supports
    both computer forensics and mobile forensics, with complete support for almost
    all Android and iOS devices. The software has two modules, **AXIOM Process** and
    **AXIOM Examine**. The first module is responsible for acquiring evidence from
    a device or loading an existing extraction, and performs data parsing and decoding.
    When the decoding process is done, you can use AXIOM Examine to review all recovered
    artifacts and analyze the data.


    # Loading evidence and on-the-fly

    processing


    One of the key features of Magnet AXIOM is that it allows investigators to start
    analyzing artifacts while the data is being processed. This is a life-saving feature
    in all those circumstances where time is a critical factor and evidence needs
    to be reviewed as soon as possible.'
  merge: -1
  img_proc: true
