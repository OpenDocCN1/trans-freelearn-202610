- pgno: 164
  md: '# # Chapter 6: Dissecting Location Data


    In the previous chapter, we learned all about pattern-of-life artifacts that can
    be found on iOS devices, such as application usage and system events, and how
    to manually analyze databases and logs. In this chapter, we will focus on one
    of the most interesting types of data that can be found on a mobile device, which
    is location data.


    Mobile devices store a wealth of location data, such as data pertaining to cell
    towers, Wi-Fi networks, and Bluetooth devices that come into close proximity with
    the device. Location artifacts can also be extracted from third-party applications
    or multimedia files.


    We''ll start the chapter by learning what location data is, how a device determines
    its position, and where this data is stored. We will learn the differences between
    GPS, cell tower triangulation, and Wi-Fi locations. Then, we will take an in-depth
    look at some of the SQLite databases that store location data, and we will learn
    how to analyze them to gain meaningful insights. Finally, we will learn how forensic
    tools such as Cellebrite Physical Analyzer and Apollo can speed up the process
    of analyzing location data.


    In this chapter, we will cover the following topics:


    +   - Introducing location data

    +   - GPS fixes, cell towers, and Wi-Fi networks

    +   - Locating location artifacts

    +   - Analyzing location data using forensic tools


    # ## Introducing location data'
  merge: -1
  img_proc: true
- pgno: 165
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 166
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_166_0.png)


    Figure 6.1 – Geographic locations are expressed using latitude and longitude


    In the following part of the chapter, we will learn how Location Services works
    to determine the device''s position.


    # GPS fixes, cell towers, and Wi-Fi networks


    The Location Services iOS API uses a collection of technologies known as Assisted
    GPS (A-GPS) to determine the device''s position. The main reason why mobile devices
    use A-GPS instead of only traditional satellite GPS is'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'that the latter does not perform well inside buildings; it is also slower than
    other technologies and quickly drains a device''s battery. A-GPS works by augmenting
    satellite GPS by using external sources (such as cell towers) that enhance the
    speed, quality, and precision of satellite signals. Data received by external
    sources is then consolidated to figure out the device''s precise location.


    The following is a list of sources that power A-GPS:


    +   - Satellite GPS

    +   - Cell towers

    +   - Wi-Fi networks

    +   - Bluetooth devices


    We will look into these in more detail in the following sections.


    You may be wondering how an iOS device manages to resolve locations from Wi-Fi
    networks or cell towers; this is implemented by Apple using a **peer-based mechanism**
    where each iOS device contributes to create a map of networks and devices.


    In general, this mechanism consists of three steps:


    +   1. If Location Services is enabled, each iOS device periodically collects
    and stores the current GPS position and a list of surrounding cell towers and
    Wi-Fi hotspots.

    +   2. This data is then sent to Apple servers anonymously, where it is consolidated
    with other collected information and third-party providers.

    +   3. The data is synced back to the iOS device when a location service requests
    the device''s position.


    For instance, if a location service requests the device''s position and satellite
    GPS is unavailable, iOS will scan for nearby cell towers and query Apple''s peer-generated
    map to find any geolocation coordinates associated with'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'those cell towers. Through this mechanism, Location Services can get a rough
    position in a few seconds and then report a more accurate GPS-sourced location
    when available.


    Every iOS device also has an internal cache that stores a large quantity of locations,
    cell towers, and Wi-Fi networks; by accessing the local cache, the device is able
    to resolve locations from Wi-Fi networks without needing a data connection. To
    keep this data up to date, the cache database is purged periodically.


    Other than this peer-based mechanism, Apple also relies on external sources to
    translate cell towers and wireless networks into physical locations; wardriving,
    for instance, is the act of searching for radio signals by a person usually moving
    in a vehicle, using a laptop or smartphone, recording their own GPS coordinates
    together with the data pertaining to the radio signals.


    # Satellite GPS


    Traditional GPS, also known as satellite GPS, is the most accurate source of location
    data for iOS devices.


    This technology is based on a network of over 30 satellites orbiting the earth
    at an altitude of 20,000 kilometers. Each satellite emits a signal that is transmitted
    to earth via radio waves, which contains the satellite''s identifier, its current
    position, and a timestamp. Therefore, when a device intercepts a satellite signal,
    it uses the time difference between the time of signal reception and the broadcast
    time to compute the distance, or range, from the receiver to the satellite. The
    device then uses the calculated distance and the satellite''s location to calculate
    its approximate position.


    It should be noted that to calculate a precise location, the receiver must be
    locked on to the signal of at least three satellites. With four or more satellites
    in view, the receiver can determine its 3D position: **latitude**, **longitude**,
    and **altitude**.


    Certain atmospheric factors and other error sources can affect the accuracy of
    the device''s GPS receiver; however, receivers are typically accurate to'
  merge: -1
  img_proc: true
