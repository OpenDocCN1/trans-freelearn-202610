- pgno: 27
  md: '*User Authentication* class; this allows data to be accessible to the device
    while keeping it encrypted.


    # iOS data encryption and decryption


    When a file is written to the filesystem, the content of the file is encrypted
    with a per-file key, which is wrapped with a class key and stored in a file''s
    metadata. The metadata is then encrypted using the filesystem key.


    We''ve already seen how class keys are generated using a combination of the hardware''s
    UID and the user''s passcode while the filesystem key is generated upon iOS installation
    and stored on the device. Now, let''s analyze the individual file encryption process
    step by step:


    +   1. Every time a file is created on the filesystem, Secure Enclave creates
    a 256-bit file key and passes this key to the hardware AES engine.

    +   2. The AES engine encrypts file content while it is written to flash memory
    using the provided file key.

    +   3. The file key is then wrapped with one of the four class keys, depending
    on the assigned protection class, and is stored in the file''s metadata.

    +   4. Metadata for all the files is encrypted with the filesystem key.


    All key handling happens in Secure Enclave, thus never exposing the operations
    to the system and its applications.


    The decryption process works the other way round:


    +   1. When a file is opened, its metadata is decrypted using the filesystem key,
    revealing the wrapped file key and the assigned protection class.

    +   2. The file key is unwrapped using the class key and is then passed to the
    AES engine.

    +   3. The hardware AES engine decrypts file content while it reads the file from
    memory, using the provided file key.'
  merge: -1
  img_proc: true
