- pgno: 81
  md: '# Chapter 3: Using Forensic Tools


    In the previous chapter, we learned all about the different acquisition techniques
    and how to use forensic tools to extract data from iOS devices. In this chapter,
    we will learn which are the most popular tools for data analysis, and their features
    and limitations.


    Although using forensic tools for data analysis is not strictly required since
    theoretically it is possible to examine files manually, using these tools has
    many advantages. The most evident benefit of using forensic tools compared to
    manually parsing artifacts is time: if used correctly, these tools are huge time
    savers as they''re programmed to automatically search for relevant files, look
    for patterns, analyze known data structures, and extract meaningful insights from
    common artifacts. Using the appropriate tools ensures that precious artifacts
    are not missed, although the investigator should always validate the output of
    such tools and know their limitations. There are no perfect forensic tools – every
    tool has its flaws! Most tools allow investigators to examine third-party applications
    as well as system apps, and can also be configured to automatically perform custom
    data carving on such applications.


    In this chapter, we will cover the following topics:


    +   - Understanding forensic tools

    +   - Working with Cellebrite Physical Analyzer

    +   - Working with Magnet AXIOM

    +   - Using open source tools


    # Understanding forensic tools


    Once the iOS device and the evidence stored within it have been successfully seized,
    preserved, and extracted through a forensically sound'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'acquisition process, the next steps involve processing and analyzing the extracted
    data.


    Currently, there are a number of commercial tools available on the market that
    perform data analysis, such as *Cellebrite Physical Analyzer*, *Oxygen Forensic
    Detective*, *Magnet AXIOM*, *Belkasoft Evidence Center*, *MSAB XRY*, *EnCase Forensic*,
    and many others. In this chapter, we''ll work with two of these tools, **Cellebrite
    Physical Analyzer** and **Magnet AXIOM.**


    We''ve already seen how mobile forensics presents several additional challenges
    compared to digital forensics, and one significant difference has to do with how
    data extracted from iOS devices is analyzed; with mobile device forensics, using
    a single tool to process and analyze the evidence is extremely risky, as one solution
    will not provide all the tools that support all devices and all iOS versions.
    Generally speaking, forensic tools work by parsing files of interest (such as
    SQLite databases, plists, and log files) and running a series of **plugins** on
    these files that look for key evidence in predefined locations. What this means
    is that more recent applications may not be supported because if there isn''t
    a plugin for a given app, forensic tools will not automatically display data for
    that application! No one tool can process and analyze all artifacts from every
    mobile device.


    To choose the best tools for your purpose, you need to know the following:


    +   - Where the tool will search for data

    +   - What a tool is doing to the extracted data

    +   - How the tool will represent the data


    For instance, iOS devices sometimes compress log files into archives to save space
    on disk. If your tool does not automatically extract files from archives that
    are found in an iOS extraction, you could be missing some key evidence. Make sure
    you understand exactly what files your tool parses and what files it doesn''t.


    # Tool validation'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Once the investigator has assessed which tool is the best fit for a particular
    scenario, the tool and its output should be **validated** before starting the
    examination process. Validating a tool is the process of determining through testing
    that it performs in a certain way and that the results are consistent.


    In particular, the investigator should verify the following:


    +   - The tool does not alter the data in any way.

    +   - The data provided by the tool is consistent with what is displayed on the
    device.

    +   - The data represented by the tool is consistent with what you find in the
    source file of that particular piece of data.

    +   - The results are consistent among different forensic tools.


    Validation is increasingly important when dealing with unsupported third-party
    applications or **Unidentified Forensic Objects (UFOs)**, as some tools have some
    built-in features that use heuristics to attempt data extraction from these artifacts,
    but sometimes the results can be incomplete or inconsistent.


    # Tip


    One of the most common ways to get to know your tools and validate their output
    is by using them to analyze a known device, such as your personal iPhone. Use
    your device to perform normal day-to-day activity and take notes. Then, extract
    and analyze data from the device using several tools and check that it gets reported
    correctly.


    Although forensic tools will greatly aid the investigator by speeding up the entire
    process, this software should not substitute the process of manually viewing and
    assessing the files that were extracted in the acquisition process.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# # Working with Cellebrite Physical Analyzer


    Cellebrite software is generally regarded as the golden standard for mobile forensics
    among law enforcement and security organizations due to its powerful features,
    wide device compatibility, frequent updates, and easy-to-use user interface. Their
    most popular tools are **Cellebrite Universal Forensic Extraction Device (Cellebrite
    UFED)**, which we used in the previous chapter to acquire the device''s filesystem,
    and **Cellebrite Physical Analyzer**, which is used for data analysis and reporting.


    We will now learn how to import the extracted data into Physical Analyzer and
    then we''ll go over some of the main features of this powerful tool.


    # ## Loading evidence and selective decoding


    The first step in a Physical Analyzer examination is loading the evidence into
    the tool. You can accomplish this by using the **case wizard**, which is a step-by-step
    procedure that will guide you through the process and also show you some optional
    features that can be enabled. One of these is **selective decoding**, which allows
    investigators to perform faster parsing and analysis by selecting specific applications
    or specific categories that should be parsed in addition to common system artifacts.
    This is especially useful when you''re dealing with devices that have dozens of
    installed applications, but you only need to parse very specific artifacts that
    pertain to a few of these apps.


    Let''s see how this works:


    +   1. From Physical Analyzer''s menu, choose **File | Open case** to bring up
    the case wizard.'
  merge: -1
  img_proc: true
- pgno: 85
