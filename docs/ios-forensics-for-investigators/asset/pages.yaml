- pgno: 317
  md: 'Figure 12.3 – An example of a preliminary device report


    The report includes data that identifies the device, such as the model, iOS version,
    serial number, ICCID, IMEI, and phone number, and details that relate to the device''s
    owner, such as the **Apple ID** that was signed into the device or the user accounts
    that were found in the extraction.


    In the following section, we''ll learn how to create a complete report.


    # Generating a complete report


    The first step in the process of creating a report in Cellebrite Physical Analyzer
    is deciding which artifacts should be included in the report. An examiner will
    typically include all of the data but, on some occasions, especially if the investigation
    is focused only on a few artifacts, including every piece of data would make the
    report too long and the most important details may be missed.


    For every single record of every artifact, the examiner can choose to include
    it or exclude it from the report by ticking the checkbox that is highlighted in
    the following screenshot:'
