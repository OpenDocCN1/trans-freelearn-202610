- pgno: 240
  md: '+   - By checking the `Has_Adjustments` column, the investigator can understand
    whether the media asset was adjusted, edited, or cropped on the device.

    +   - If location services were enabled, the `Latitude` and `Longitude` columns
    store the coordinates of the location where a photo or video was taken.

    +   - Finally, the `UUID` column indicates the asset''s unique identifier.


    As we can see from the result of this query, there is a significant amount of
    metadata stored within the database; however, this is not the only source of media
    metadata. In the following section, we''ll focus on extracting information from
    the media file itself.


    # Introducing EXIF metadata


    The `Photos.sqlite` database can be a huge source of metadata, but there may be
    some occasions in which the database is not available, and the investigator only
    has access to the media file. Thankfully, images and videos often contain embedded
    metadata, which is known as **Exchangeable Image File Format (EXIF)**.


    EXIF metadata can provide a wealth of information to investigators, such as the
    following:


    +   - The device model

    +   - Camera settings

    +   - Exposure and lens specifications

    +   - Timestamps

    +   - Location data

    +   - Altitude and bearing

    +   - Speed reference'
