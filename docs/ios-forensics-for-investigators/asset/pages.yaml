- pgno: 29
  md: 'The key point to understand here is that the process you use to examine the
    mobile device and extract data from it is what makes the examination forensic.
    It is neither the software nor the hardware you use, but solely the process that
    you use during the examination that makes it truly forensic.


    These guidelines and processes should be periodically reviewed as technology continues
    to evolve and different mobile devices are marketed.


    # Seizure and identification


    The first step pertains to the physical seizure of the device. This involves gathering
    information on the type of incident that the device was involved in and at least
    some basic information on the device''s owner.


    The way the seizure occurs depends on your jurisdiction, so you should be familiar
    with laws regarding seizing and analyzing smart devices and what the requirements
    are (that is, a search warrant is usually required). At this stage, you should
    also have a general understanding of what data you are expected to find, as this
    will help you define specific objectives and plan the next steps according to
    your requirements.


    First and foremost, you need to document everything you do and consider how to
    preserve evidence. *How* you handle the device matters and it can have a huge
    impact on the outcome of the investigation.


    You should also note the state that the device was found in. The following are
    some examples:


    +   - Is the device powered on or off?

    +   - Is the device protected by a passcode?

    +   - Is the passcode known?

    +   - Is the SIM card present?

    +   - Is there any visible damage?'
  merge: -1
  img_proc: true
- pgno: 30
  md: '+   - What''s the date and time on the device?

    +   - If the device is on, what apps are running?

    +   - Basic ownership information.


    One of the fundamental aspects of a forensically sound process is that operations
    should be carried out without altering or changing the contents of data that resides
    on the device in any way. Note that iOS devices are live, dynamic computer systems,
    so any kind of interaction with the device would result in changes to system files
    and databases, not to mention the possibility of inadvertently deleting temporary
    files that could contain useful evidence. Care should be taken to limit all interaction
    with the device, except for the preservation operations, which will be indicated
    in the next section.


    Once the device has been seized, an investigator could be tempted to manually
    access data from the device, such as by running messaging apps and viewing conversations
    directly from the device''s screen; however, this should be strongly discouraged
    as this would result in system logs and other system-related files being altered,
    which is not forensically sound behavior.


    At this stage, the investigator will also have to identify the device, its hardware
    model, and the iOS version. This information will be useful if you wish to start
    assessing what options the investigator has for extracting evidence from the device.


    For each examination, the investigator should also identify the following:


    +   - The legal authority for examining the device

    +   - The goals of the examination

    +   - Other sources of potential evidence (including cloud storage)


    # Preservation'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Smartphones are, by design, meant to communicate through cellular networks,
    Bluetooth connections, and wireless Wi-Fi networks. To prevent the device from
    communicating, it is important to isolate the device as soon as possible. Isolating
    the device prevents new data (incoming calls, incoming messages, and so on) from
    modifying existing evidence and thus enforces data preservation. Additionally,
    if the device were allowed network access, data destruction could occur as Apple
    products can be remotely wiped via a *kill signal.*


    The easiest way to isolate an Apple device is by enabling **Airplane** mode; this
    deactivates the device''s wireless and cellular connections. You can enable **Airplane**
    mode from the device''s **Settings** or, if the device is locked, directly from
    the control center by swiping up from the bottom. If the device is an iPhone X
    or newer, you can access the control center by swiping down from the top-right
    corner. However, it''s worth noting that isolating the device can also be accomplished
    by putting the device in a Faraday bag, a container made of metallic shielding
    that blocks the radio frequencies used by cellular networks, GPS, and Wi-Fi networks.


    Don''t forget to keep the device charged to ensure it doesn''t power off. Generally
    speaking, you want the device to remain in the state in which you found it:


    +   - If the device was off, leave it off.

    +   - If it was on, make sure you leave it on so that it doesn''t lock!


    This is particularly important if the device is passcode protected and the investigator
    doesn''t have the code: if the device powers off, it would transition from an
    AFU state to a BFU state, rendering data recovery much more challenging and, in
    some cases, impossible. We will learn more about device states later in this chapter.


    # Tip


    One of the most common mistakes is removing the SIM card from an unlocked device
    to isolate it from a cellular network. This may make sense when you''re working
    with different devices, but you want to avoid'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'removing the SIM card from iPhones or iPads because doing so will result in
    iOS automatically locking the device, biometric unlock will be disabled, and USB
    restricted mode will be activated.


    After successfully seizing and isolating the device, care should be taken to maintain
    the device''s chain of custody. NIST defines the chain of custody as follows:


    > > "A process that tracks the movement of evidence through its collection, safeguarding,
    and analysis life cycle by documenting each person who handled the evidence, the
    date/time it was collected or transferred, and the purpose for the transfer."


    You can learn more about this topic by visiting the following website:


    [CSRC.nist.gov](https://csrc.nist.gov/).


    # Acquisition


    Acquisition is the process of obtaining information and evidence from a device.


    Before the actual acquisition process begins, you should have a clear understanding
    of what kind of evidence you''re looking for as this will have a great influence
    on the tools you choose to use.


    Generally speaking, there are three different kinds of data acquisition, and the
    method the investigator chooses affects how much data can be extracted from the
    device:


    +   - Logical acquisition

    +   - Full filesystem acquisition

    +   - Physical acquisition


    In the following table, you can see what kind of data can be extracted with each
    method:'
  merge: -1
  img_proc: true
- pgno: 33
  md: '| | Logical | Filesystem | Physical |

    |---|---|---|---|

    | Calls, calendars, contacts, and messages | ✓ | ✓ | ✓ |

    | User content (photos, videos, notes, and so on) | ✓ | ✓ | P |

    | Keychain | Limited | ✓ | ✓ |

    | Third-party app data | Limited | ✓ | ✓ |

    | Apple Pay | - | ✓ | ✓ |

    | Location data (radio cells, GPS fixes, and so on) | - | ✓ | ✓ |

    | Mail | - | ✓ | ✓ |

    | User activity logs | - | ✓ | ✓ |

    | System logs | - | ✓ | ✓ |

    | Deleted data (unallocated space) | - | - | ✓ |

    | Deleted data (SQLite databases) | Limited | ✓ | ✓ |


    Table 1.2 – Comparison of data that can be extracted with different acquisition
    methods


    # Logical and filesystem extractions


    As you can see, a logical acquisition will extract some user-generated data from
    the device such as photos, messages, and notes. A logical extraction will usually
    be the easiest and quickest type of extraction and most forensic tools support
    it. However, considering the number of files available on an iOS device, only
    acquiring the full filesystem will give access to precious evidence such as third-party
    app data, precise location data, and pattern-of-life information.


    A filesystem extraction is a representation of the files and folders from the
    user partition of the device; it is possible to partially recover deleted data
    by analyzing databases and temporary files, such as WAL files.


    # Physical extraction


    Devices up to and including the iPhone 4 can undergo a full, forensically sound
    physical extraction of the entire raw disk. This kind of extraction delivers the
    most data as, much like a standard hard drive, both the system'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'and the user partitions are extracted, as well as unallocated areas of the
    disk. This is incredibly useful as it allows investigators to recover deleted
    data, including messages, photos, and videos. However, with the introduction of
    iOS 5, Apple changed the way data was encrypted on disk and enabled other security
    features, such as data protection class keys. At the time of writing, extracting
    a physical image of modern iOS devices is simply not possible.


    # Choosing the best acquisition method


    Investigators should always perform a logical acquisition first and then, if possible,
    attempt a filesystem or physical acquisition.


    Jailbreaking the device is generally required to enable unrestricted access to
    the device''s filesystem; however, more and more vendors are adding the possibility
    to run forensically sound checkm8-based extractions (all operations are performed
    in the device''s volatile RAM) or agent-based extractions. Both options allow
    you to obtain the full filesystem without jailbreaking the device.


    At the end of the day, the method you choose will usually depend on four variables:


    +   - The state in which you find the device (locked or unlocked)

    +   - The device model and iOS version

    +   - The tools you have access to

    +   - The possibility of jailbreaking the device


    If the device is locked and you don''t have the passcode, there is not a simple
    solution that can consistently bypass iOS security. However, depending on the
    device model, several options can provide a limited amount of data. We will examine
    these in detail in the next chapter.


    If the device is unlocked, depending on the available tools, you can attempt a
    filesystem extraction. You should start with the less intrusive option, such'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'as an in-memory checkm8 exploit, if your tools support it. If the device doesn''t
    allow checkm8 exploiting, you can attempt an agent-based extraction if the iOS
    version is compatible. Although this entails installing an agent on the device
    and some minor changes can occur, this is considered forensically safe. If neither
    of these options is available, you can consider jailbreaking the device through
    checkra1n or unc0ver. Make sure you understand how the jailbreak works, how it
    affects the device, and what the risks are. Finally, if none of these options
    are available, you will have to go for a logical acquisition.


    We will learn all about extracting data from iOS devices in the next chapter,
    but for now, it''s important to note that the phone should be acquired using a
    tested method that is repeatable and is as forensically sound as possible. It
    is highly recommended to experiment with various tools on test devices to determine
    which acquisition method and tool work best with different devices.


    If you don''t have direct access to the device, there are other sources of evidence
    you can consider, such as iTunes backups and iCloud extractions.


    # Analysis


    The main point of doing a forensic examination is to find, extract, and process
    evidence related to a particular case or investigation.


    Although there is no standard process to analyze what you extracted from a device,
    here are some guidelines that should help you get started:


    +   - Go through all the available data to become familiar with the main sources
    of evidence found on the device.

    +   - Use your tools and forensic software to quickly parse common data sources,
    such as SMS databases, installed apps, call logs, photos, and so on.

    +   - Attempt to recover any deleted data both with software and by manually carving
    binary files, logs, plists, and SQLite databases.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '+   - Identify key artifacts by searching for keywords and details that are
    specific to your investigation.

    +   - Harvest metadata from files and look for hidden evidence (timestamps, geolocation
    data, binary BLOBs, and so on).

    +   - Find relationships between different artifacts.

    +   - Perform temporal analysis on all acquired evidence, building a timeline
    of relevant artifacts and events.


    When you''re dealing with a limited amount of data, it may be possible to assess
    evidence by manually browsing through all the folders and viewing the contents
    of the files on your workstation. However, when you''re looking at gigabytes of
    data sources, including SQLite databases, caches, and plists, you''ll probably
    have to resort to using forensics tools. In such cases, investigators must develop
    a strategy to use the best tools, depending on the type of digital evidence and
    the goals of your investigation.


    We''ll cover commercial tools in detail in *Chapter 2, Data Acquisition from iOS
    Devices* and *Chapter 3, Using Forensic Tools*, but before that, it must be noted
    that all mobile forensics tools are just application software. These tools are
    not magical things that conduct autonomous processing and reporting simply by
    clicking a button! Digital investigators must understand the *features* and limits
    of each tool.


    Mobile forensic tools typically differ in the kind of extraction that can be done,
    but different tools are also compatible with different devices and different versions
    of the iOS operating system. With the variety of different types of mobile devices,
    no single software supports all mobile devices.


    Automated tools can speed up the time it takes to process huge datasets and I
    strongly believe that the modern investigator should have more than one tool available.
    However, this process is not a substitute for a methodical, manual forensic examination
    and validation.


    In the end, it all comes down to the target device model, the iOS version, the
    type of extraction, the goal of the examination, and how the produced evidence
    might be used later.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Validation


    After processing evidence from the device, the investigator must verify the accuracy
    of all the steps that have been carried out. This process should not focus exclusively
    on verifying the data extracted from the device. It should also entail validating
    the tools that were used for the examination and validating the entire process
    to ensure it has been carried out in a forensically sound way.


    Unfortunately, validation is one of the most overlooked aspects.


    Before starting an examination, it is highly recommended to experiment with various
    tools on test devices and known datasets to determine which acquisition and analysis
    tools work best with specific iOS device models and versions.


    Established procedures should lead to the process of acquisition and analyzing
    a device. This is especially true when an investigator is working on data from
    third-party apps or **Unidentified Forensic Objects (UFOs)**. Practices must be
    tested to ensure that the results that have been obtained are *valid* and independently
    *reproducible*.


    An examiner who is called to testify on their findings should be able to explain
    not only *what* evidence was found, but also *where* that data was found and *how*
    the iOS operating system generated those artifacts. This could entail manually
    decoding binary data and file carving. Analyzing actual binary files that user
    data was parsed from, along with SQLite databases and plists, offers the investigator
    the opportunity to perform deep analysis of the iOS device''s filesystem, extracting
    evidence that could be missed by relying only on automatic tools.


    The following list resembles some of the best practices regarding verification
    and validation:


    +   - **Hash values**: All the files that are extracted from the device should
    be hashed during the acquisition process to ensure that no changes occur. If you''re
    doing a filesystem extraction, you can calculate the hashes for'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'each file at the end of the process. Data integrity can be verified by calculating
    the hash for a single file and checking it against the original value.


    +   - **Deterministic tools:** All the tools that are used for an examination
    should be deterministic: a given tool should produce the same output when given
    the same input data, under the same circumstances.

    +   - **Data verification:** Check if known data stored on the device is reported
    accurately, without any modifications. Generally, data that''s extracted from
    the device should match the data that''s viewed on the device''s screen.

    +   - **Tool accuracy:** The quality of the output of a tool should be checked
    by using multiple tools to extract/process the same data and compare results.

    +   - **Process testing:** When working on UFOs or artifacts where there is not
    an established examination process yet, validate your findings by testing each
    solution on different devices and under known control conditions and evaluate
    the results of each test.


    # Reporting


    The last step in the mobile forensics process is reporting. Reporting can be defined
    as the process of preparing a detailed summary of what was done to acquire and
    analyze digital evidence from a mobile device. A forensic report should also include
    all the relevant evidence, presented in a clear, concise manner, and the conclusions
    that were reached in the investigation.


    Many forensic tools provide a built-in reporting feature that allows you to automatically
    generate a digital report that includes items from the investigation, such as
    the following:


    +   - Key artifacts

    +   - Device identification (model, s/n, phone number, and so on)

    +   - Case number and the analyst''s name'
  merge: -1
  img_proc: true
- pgno: 39
  md: '+   - Date and time of when the examination took place

    +   - Tools that were used for extraction and analysis


    Depending on your jurisdiction, a forensic report should also describe how the
    data was extracted (logical, physical, or filesystem extraction) and explain what
    measures were taken to ensure the entire process was repeatable and forensically
    sound.


    # Timeline analysis


    One of the most common forms of forensic reporting includes temporal analysis,
    which is defined as the process of creating a timeline of events that occurred
    on the device at a specified date and time.


    A timeline generally includes data from a variety of sources; for example, location
    data, system logs, and messaging evidence can be combined and can lead to the
    discovery of what happened, where it happened, and when it happened.


    Determining when events occurred on the device and associating device usage with
    an individual by reporting logs, files, and timestamps can be extremely useful.


    # Summary


    In this chapter, we learned what the goal of a forensic examination is and how
    the discovery of the checkm8 vulnerability provides new opportunities for data
    acquisition from iOS devices.


    First, we introduced the iOS operating system and discussed some key elements
    of its security architecture, such as Secure Enclave and Data Protection. Then,
    we went through the steps of an iOS forensic examination.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'The first step is seizing the device and adopting techniques to preserve evidence,
    such as placing the device in a Faraday bag or enabling Airplane mode. There are
    different ways to acquire data from an iOS device, depending on the model, iOS
    version, and what tools are available. This chapter covered logical and filesystem
    acquisition techniques, as well as jailbreaking and agent-based extractions.


    Analyzing artifacts should be done by following a thorough validation process
    that ensures that commercial tools produce consistent results and that evidence
    has been processed in a forensically sound way.


    Finally, we learned what key elements should be included in a forensic report.


    The next chapter will discuss iOS data acquisition in detail and provide a hands-on
    approach to the tools that are used to conduct a forensic examination.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Chapter 2: Data Acquisition from iOS Devices


    Mobile devices present a unique set of challenges compared to desktop computers
    when approaching the data acquisition phase. While in the world of desktop computers
    there is a consolidated workflow that allows an investigator to carry out a so-called
    *forensically sound* acquisition, when we''re dealing with mobile devices there
    is no single, one-size-fits-all procedure that can be adapted to each and every
    device. This becomes even more evident when we are dealing with iOS devices, as
    the variety of models and different versions of iOS implies that the procedure
    to be carried out to achieve a satisfactory acquisition will be different, depending
    on the device itself. Often, a particular tool, exploit, or vendor solution will
    stop working if the device is updated to a new iOS release. This is the case for
    most jailbreaks that rely on publicly disclosed vulnerabilities that are subsequently
    patched by Apple. A further challenge is represented by the possibility of dealing
    with locked devices; in this case, the chances of extracting useful information
    from the device are much more limited.


    For these reasons, data acquisition is arguably the most challenging aspect of
    the iOS forensic workflow. In this chapter, therefore, we will discuss various
    solutions, starting by distinguishing the different types of acquisition methods
    and their limits. We will then move on to the practical phase, in which we will
    learn how to perform a logical, a filesystem, and a physical acquisition of an
    iOS device.


    In this chapter, we will cover the following topics:


    +   - Understanding acquisition methods

    +   - Jailbreaking the device

    +   - Triaging the device

    +   - Performing a logical acquisition'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Performing a full filesystem acquisition


    # Understanding acquisition methods


    In the first chapter, we briefly discussed acquisition methods and the difference
    between a logical, filesystem, and physical extraction. We will now be building
    on that foundation and diving deep into more advanced topics to gain a full understanding
    of how they work and what kind of data we can expect from each of these acquisition
    methods.


    # Logical acquisitions


    A logical acquisition is usually the easiest and fastest way to extract the most
    common types of evidence from an iOS device. If the device is unlocked or if you
    have the passcode, you will certainly be able to perform a logical acquisition,
    as all iOS devices support it; based on the **Apple File Connection (AFC) protocol**,
    this acquisition is essentially equivalent to running a local (iTunes) backup,
    and some forensic tools will actually rely on Apple''s libraries and iTunes capabilities
    to extract data from the device.


    A logical acquisition can be performed using free software like **iTunes**, third-party
    libraries such as `libimobiledevice`, or by using forensic software. In the following
    sections of this chapter, we will use three of the most popular digital forensics
    tools to perform a logical acquisition: *Cellebrite UFED, Elcomsoft iOS Forensic
    Toolkit, and Magnet ACQUIRE.*


    As we''ve learned from the previous chapter, the main limitation in a logical
    acquisition is the depth and quality of the data that is extracted; although it
    will include *most* user-generated content, such as text messages, call logs,
    photos, and notes, it will *not* include other precious artifacts, such as emails,
    location data, third-party apps, and precise system logs. The key point to understand
    here is that both Apple and iOS developers can restrict logical extractions by
    deciding which files will be included in a backup and which files will not be
    backed up. For instance, many popular applications, such as **Twitter, Facebook,
    Instagram, Telegram**, or **Signal**, do not include their'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'files in a local backup, so these artifacts will not be available through a
    logical acquisition.


    To make things even more complicated, with the release of iOS 4, Apple introduced
    a feature that enables the user to **encrypt** local backups using a password.
    This setting can be activated by using iTunes and, once enabled, all subsequent
    backups will be automatically encrypted using the provided password. In other
    words, if I decide to enable backup encryption, the next time I attempt a local
    backup on any computer, the password will be required to read the backup files.
    Clearly, this poses a problem for the forensic investigator on several fronts;
    if backup encryption is enabled and the password is unknown, data extracted from
    a logical acquisition will be useless, as it won''t be possible to decrypt it.
    Some forensic tools, such as Elcomsoft Phone Breaker, allow investigators to attack
    the encrypted backup by brute-forcing the password; however, this does not guarantee
    that the password will be effectively recovered, and brute-force attacks usually
    take quite a long time.


    There is, however, another option. Since iOS 11, Apple introduced the possibility
    of removing the password used to encrypt local backups *directly* from the device.


    Here''s the caveat: although this solution works perfectly, it does not only remove
    the encryption password but also resets *all* the device''s settings. Clearly,
    this will have an effect on some of the files stored in the device, but it may
    be your only option if you don''t have access to the backup password.


    Here''s how to reset the local backup encryption password:


    +   1. From the iOS device, go to **Settings | General | Reset**.

    +   2. Select the **Reset All Settings** option and enter the device passcode.

    +   3. Follow the steps to reset the device.


    By following this procedure, you will not lose any user data or other passwords,
    but it will reset general device settings, such as wallpaper, display settings,
    and so on. This will, of course, cause some changes to system files and databases;
    for this reason, if you''re dealing with a device in'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'a criminal case, be sure you understand the consequences of making changes
    to the original device and make sure you have the legal authority to perform this
    kind of operation.


    # Tip


    It''s important to note that, since iOS 13, if the user decides to encrypt a local
    backup, a lot more data will be included, including some data from Keychain, calls,
    health data, Safari history, and so on. When performing a logical acquisition,
    most forensic tools check whether backup encryption is enabled, and if it''s not,
    it is temporarily enabled to acquire the biggest amount of data and then disabled
    again when the acquisition process finishes. Keep this in mind – if you don''t
    encrypt backups before performing a logical acquisition, you will miss crucial
    evidence!


    To have a better understanding of what artifacts you can expect to find in a logical
    extraction, take a look at the following screenshot taken from *Cellebrite Physical
    Analyzer*, which shows what data was acquired from an iOS device through a logical
    acquisition:'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_45_0.png)


    Figure 2.1 – Data acquired through a logical acquisition


    The main reason why you would want to perform a logical acquisition is when working
    with newer devices, because they are generally supported following the release
    of an iOS update, so you won''t have to wait too long to start collecting evidence;
    however, as we''ve already discussed, many items will not be included in a logical
    acquisition.


    In comparison with a standard logical extraction, a full filesystem extraction
    or a physical extraction gives investigators access to a lot more user data on
    iOS devices, including full access to Keychain, which will also include encryption
    keys that can be used to decrypt data from secure apps, such as Signal, Wickr,
    Snapchat, or Facebook.


    By acquiring the full filesystem, investigators will also gain access to many
    of the system artifacts, such as the complete history of events that occurred
    on the device (locked/unlocked states, user interaction, installed'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'applications, AirDrop, Bluetooth, camera, and airplane mode history). Also,
    a lot more geodata will be available from a full filesystem acquisition, including
    artifacts from cell towers, Wi-Fi connections, and GPS locations with the corresponding
    geo-coordinates and timestamps.


    The following screenshots show the differences between a logical acquisition and
    a full filesystem acquisition from the same device; the full filesystem extraction,
    on the right, contains a lot more data:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_46_0.png)'
  merge: -1
  img_proc: true
- pgno: 47
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 48
  md: 'still obtained during a filesystem acquisition, but the examiner is also granted
    access to raw files stored within the device. This allows investigators to access,
    for example, databases of all third-party applications without restrictions, and
    recovery of deleted artifacts can also be attempted.


    Although there are many tools that allow you to perform this kind of acquisition,
    Apple restricts direct access to the device''s filesystem, so you will have to
    find a workaround to gain full access to the device before a full filesystem acquisition
    can be performed.


    So, you may be wondering – how do I access the device filesystem? Is a **jailbreak**
    required? Although jailbreaking is one of the available options, it is not the
    only one.


    At the time of writing, there are three different solutions to gain access to
    the device''s filesystem:


    +   - Using tools that leverage Checkm8, a BootROM exploit

    +   - Using an extraction agent

    +   - Jailbreaking the device


    # Checkm8


    The publication of the Checkm8 vulnerability in 2019 by the hacker @axi0mX, which
    is based on an unpatchable vulnerability present in the BootROM of millions of
    iOS devices, is arguably the biggest game changer ever in the forensics industry.


    Checkm8 is compatible with A5 to A11-based devices; this includes all devices
    starting from the iPhone 5s up to the iPhone X, as there is no working implementation
    for 4S hardware.


    Before we get into the details, it''s useful to understand how the iOS boot procedure
    works and why the Checkm8 vulnerability cannot be patched.'
  merge: -1
  img_proc: true
- pgno: 49
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_50_0.png)


    Figure 2.3 – iOS secure boot chain


    As you can see, the first step in the boot process is the execution of the code
    from the device''s BootROM. This stage of the process is implicitly trusted because,
    as its name implies, the BootROM is a read-only memory component that cannot be
    modified after manufacturing by anyone, not even by Apple.


    The Checkm8 exploit is based on a vulnerability that resides within this portion
    of read-only memory, so this means that Apple has no way of patching it, leaving
    hundreds of millions of iOS devices vulnerable. To have a better understanding
    of what a breakthrough this is, keep in mind that the previous BootROM exploit
    was discovered in 2010!


    # Tip


    If you''re interested in the technical details, you can find a full report on
    the Checkm8 vulnerability at the following link:'
  merge: -1
  img_proc: true
- pgno: 51
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 52
  md: 'In light of these limitations, some vendors have come up with a built-in solution
    that allows investigators to perform a full filesystem acquisition, exploiting
    the Checkm8 vulnerability but *without* actually jailbreaking the device.


    Currently, this feature is available in some of the most popular forensic tools,
    including *Cellebrite UFED*, *Elcomsoft iOS Forensic Toolkit*, and *Oxygen Forensic
    Detective*.


    The difference between these solutions and performing a traditional jailbreak
    through checkra1n is that these tools do not modify the device in any way; the
    exploit is performed in the device''s RAM. Once the acquisition process ends,
    the device will reboot normally, leaving no traces.


    Whenever possible, this should be the preferred method to acquire the full filesystem
    from an iOS device, as this is definitely the most forensically sound solution.


    # Agent-based acquisitions


    The main drawback in Checkm8 acquisitions is that they''re not supported by newer
    devices like the **iPhone 12** or the **iPhone 13**, as these devices are not
    vulnerable to the Checkm8 exploit.


    In 2020, vendors responded to these limitations by providing an alternative method
    to extract the full filesystem from any iOS device, including the latest iPhone
    12; this solution relies on installing an extraction agent that will exploit software
    vulnerabilities, gain access to the entire filesystem, and establish a secure
    connection between the device and the computer.


    Although this method requires installing an application (**the agent**) on the
    device, this is considered forensically safe, as the agent leaves a drastically
    smaller footprint compared to other solutions, like jailbreaking the device. The
    only traces left on the device are some minor changes in system log files; however,
    because of this, depending on your jurisdiction, you may need authorization or
    legal authority to use this method.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'The following is a list of requirements to use this method:


    +   - Supported iOS devices: all devices starting from the iPhone 5s up to iPhone
    12.

    +   - Supported iOS versions: iOS 9.0 through to iOS 14.3.

    +   - Using an **Apple ID** registered in Apple''s Developer Program is strongly
    recommended for installing the agent on the device, as this relieves the need
    to open internet access on the device.


    Currently, *Elcomsoft iOS Forensic Toolkit* and *Belkasoft Evidence Center X*
    are the only tools that provide agent-based extraction capabilities.


    # # Jailbreaking the device


    Finally, let''s talk about jailbreaks! We''ve seen how it''s possible to extract
    a full filesystem from an iOS device by exploiting the CheckM8 vulnerability or
    by performing an agent-based acquisition. However, as we''ve learned, both these
    methods have their limitations, and there could be some cases where jailbreaking
    the device is your only option to perform a filesystem acquisition.


    Applying a jailbreak will leave some permanent traces on the device, so this option
    should only be considered as a last resort and only if you have the legal authority
    to do so.


    At the moment, the most popular jailbreaks are **checkra1n** and **unc0ver**.
    Both these jailbreaks allow investigators to install third-party tools such as
    SSH, which will give unrestricted access to the device''s filesystem.


    In the following table, you can check the compatibility for both these jailbreaks:'
  merge: -1
  img_proc: true
