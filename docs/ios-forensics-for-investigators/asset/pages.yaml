  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_223_0.png)


    # Figure 8.5 – Extracting message data from sms.db


    The first thing to keep in mind is that since **iOS 11**, Apple started storing
    timestamps as 18-digit numbers, while previously, message timestamps were only
    nine digits long. This means that the sms.db database will most likely contain
    both nine-digit and 18-digit timestamps. Our query begins by verifying the length
    of the timestamp and displaying the date and time of when the message was sent
    accordingly. Then, we extract the text column and the service column, which indicates
    whether the message is a traditional SMS, or an iMessage. The account and account_login
    columns show the phone number or email address that the user was using to send
    or receive the message. The chat_identifier column stores the phone number or
    email address of the person the user was communicating with. Finally, the Date
    Read, Message Direction, and Last Read columns are self-explanatory.


    During an investigation that involves SMS and iMessage forensics, the Drafts and
    Attachments folders should not be overlooked, as these may'
