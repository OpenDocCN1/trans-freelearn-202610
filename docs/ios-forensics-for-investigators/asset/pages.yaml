- pgno: 186
  md: 'So far, we have learned how to manually analyze location-related data by running
    SQL queries on databases. However, there are other options that automate the process,
    such as using forensic tools.


    # Analyzing location data using forensic tools


    We will focus on two tools: a commercial tool, Cellebrite **Physical Analyzer**,
    and a free tool, **Apollo**.


    # Viewing location data with Physical Analyzer


    Cellebrite Physical Analyzer automates the task of analyzing location data by
    displaying GPS, cellular, and Wi-Fi locations in a unified view. Keep in mind
    that, to access location data, you will need to perform a full filesystem acquisition,
    as the files of interest are not available in a logical or iTunes backup.


    To view location data, from the menu on the left side, choose **Location Related
    | Device Locations | Native Locations:**'
  merge: -1
  img_proc: true
- pgno: 187
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_187_0.png)


    Figure 6.10 – Viewing location data in Physical Analyzer


    The following figure shows the remaining columns in detail:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_187_1.png)


    Figure 6.11 – Physical Analyzer specifies the source file for the artifact'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'As you can see from the preceding figure, for each record, Physical Analyzer
    will specify the source file from which the record was parsed. Keep in mind that
    just because a location appears in the results, it doesn''t necessarily mean that
    the device actually visited that location, as this tool will also display harvested
    data.


    # Analyzing location data with Apollo


    Apollo, which we introduced in the previous chapter, is a Python script that correlates
    multiple sources of data into a unified **timeline**, simplifying the examiner''s
    job of finding out what exactly was happening on the device. The tool consists
    of dozens of highly configurable modules that each query a specific iOS database
    to extract data and events. Apollo supports both routined location data and harvested
    data.


    We''ll now go over the steps required to download the tool, run it, and export
    location data into a KMZ file that can be imported into a map provider service:


    +   1. To download Apollo, head over to its GitHub repository located at https://github.com/mac4n6/APOLLO
    and download the latest version as a ZIP archive or by cloning the repository
    by running the git clone command.

    +   2. Next, run the tool by specifying the export format, the location of the
    module''s directory, and the location of the data that should be analyzed, such
    as the folder that contains the SQLite databases or the full filesystem extraction.
    For example, running python3 apollo.py extract -o sql -p apple -v 14 -k modules/
    fs-extraction/ will run Apollo in SQL mode, analyzing the files in the fs-extraction
    folder and running all modules found in the modules folder. Make sure you use
    the -k option to output location files.

    +   3. When the tool ends the process, the results will be stored in a file called
    apollo.db and in several KMZ files.

    +   4. You can then proceed to import the KMZ files using your tool of choice,
    such as **Google Earth** or **Google Maps**.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'The following figure shows one of the KMZ files outputted by Apollo imported
    into Google Maps:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_189_0.png)


    Figure 6.12 – Google Maps displaying location data exported by Apollo


    As you can see from the preceding figure, importing location-related data into
    a map service allows the investigator to instantly visualize the device''s whereabouts
    and, possibly, the user''s journey.


    # Summary


    In this chapter, we learned all about location artifacts and how an investigator
    can benefit from analyzing such data.


    First, we introduced the Location Services API. Then, we learned how A-GPS uses
    multiple technologies to figure out a device''s position, such as satellite GPS,
    Wi-Fi, and cell towers. We learned how iOS manages Significant Locations and where
    this data is stored.'
  merge: -1
  img_proc: true
