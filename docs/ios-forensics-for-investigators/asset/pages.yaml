- pgno: 276
  md: 'In this chapter, we learned about third-party iOS applications. First, we learned
    where an application stores its data, how to identify installed applications,
    and how to associate an app with its GUID. Then, we focused on analyzing third-party
    apps. We introduced the concept of dynamic analysis and learned about the step-by-step
    process of analyzing an application. We also learned how to identify data containers
    using the cda tool, how to monitor filesystem changes, and how to visualize an
    application''s network traffic.


    Finally, we provided a practical cheat sheet with paths and descriptions of the
    most common artifacts that can be found in popular third-party iOS applications.


    In the next chapter, we will discuss more advanced topics in iOS forensics.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Chapter 11: Locked Devices, iTunes Backups, and iCloud Forensics


    Up to this point in the book, we have learned how to perform an iOS acquisition
    using different methods and how to analyze the extracted data to gain meaningful
    insights, such as interpreting location artifacts, parsing through media files,
    or analyzing pattern-of-life data. Everything we have covered so far relies on
    the fact that the iOS device that is being examined is unlocked, or the passcode
    is known; however, this is not always the case. There are some occasions in which
    the investigator may have to deal with locked devices, and that will be the focus
    of this chapter.


    We will start the chapter by learning how to deal with locked devices, what options
    the examiner has, and how to attempt passcode cracking. Then, we will discuss
    **Before First Unlock (BFU)** acquisitions and learn what kind of data we can
    expect to find in such extractions. Later on in the chapter, we will introduce
    iTunes backups and we will learn how to extract and analyze them. In the final
    part of the chapter, we''ll discuss iCloud forensics and learn how to extract
    backups, the keychain, and data synced to iCloud.


    In this chapter, we will cover the following topics:


    +   - Acquiring locked devices

    +   - BFU acquisition of locked devices

    +   - Introducing iTunes backups

    +   - Introducing iCloud forensics


    # Acquiring locked devices


    At the start of this book, in *Chapter 1*, *Introducing iOS Forensics*, we discussed
    the iOS operating system and learned how Apple achieves **data protection** by
    encrypting files stored on the device.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'The device''s passcode is an essential aspect of the encryption process, as
    it is used to generate the **encryption key**, which, in turn, is used to decrypt
    the data. Until the user enters the screen lock passcode, almost every piece of
    data remains inaccessible. Of course, there are some exceptions, as some files
    are required for the operating system to work and they need to be always accessible,
    even when the device is locked.


    For these reasons, acquiring and analyzing a locked device is no easy task but
    there are a few options. When an investigator is tackling a locked device, the
    first step requires **identifying** the device and its current state, as the options
    available to attempt data acquisition will vary depending on a number of factors,
    such as the model and iOS version.


    The initial identification phase should allow the examiner to answer the following
    questions:


    +   - Is the locked device in a BFU or **After First Unlock (AFU)** state?

    +   - What''s the device''s hardware model?

    +   - Is the device vulnerable to Checkm8?

    +   - What iOS version is the device running?

    +   - Has the device ever been paired to a desktop or laptop computer?


    By answering these questions, the examiner will be able to assess what the best
    course of action might be to gain access to the locked device. Before we go further,
    it''s important to understand the differences between the BFU and AFU states:


    +   - **BFU**: Devices in a BFU state are those that have been powered off or
    rebooted and have not been unlocked, not even once, since the device was powered
    on.

    +   - **AFU**: When a device is powered on and the correct passcode is entered,
    the device ends up in AFU mode.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'The point here is that when a device is found in an AFU state, a lot more data
    can be extracted and analyzed, as some encryption keys are actually retained in
    memory.


    Once the device has been successfully identified, the following options should
    be considered:


    +   - Locating and using **lockdown pairing records**

    +   - Passcode cracking

    +   - Performing a **BFU acquisition**

    +   - Sending the device to third-party labs or premium services, such as **Cellebrite
    Advanced Services** or **Grayshift''s GrayKey**

    +   - Locating and analyzing **iTunes backups**

    +   - Downloading and analyzing **iCloud backups**

    +   - Downloading and analyzing iCloud synced data


    In the following sections of this chapter, we''ll discuss the pros and cons of
    each of these options, starting with using lockdown pairing records.


    # Using lockdown pairing records to access the device


    **Lockdown records**, also called **pairing records**, are essentially files stored
    on a host computer that contain cryptographic keys that are used to allow iOS
    devices to communicate with paired computers.


    The first time an iOS device is connected to a PC or macOS computer that has iTunes
    installed, the user will be prompted to *trust* the device by entering the device''s
    passcode. This will create a lockdown record on the host, which means that the
    user will not have to unlock the device every time it is connected to the computer.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'If the investigator has physical and legal access to a host computer that was
    paired with the device, the lockdown file can be used to access the locked device
    and successfully perform a logical acquisition.


    There are, however, some caveats. First of all, accessing a locked device using
    a pairing record will only work if the device is in an **AFU state**; secondarily,
    lockdown records **expire** after some time. Although there is no definite answer
    as to when exactly these records expire, research that has been carried out seems
    to suggest that lockdown records expire anytime between 7 and 30 days after they
    were created.


    On Windows machines, lockdown records are typically stored in `%ProgramData%\Apple\Lockdown\`.


    On macOS computers, they can be found in `/var/db/lockdown/`.


    Once the investigator has located the lockdown record, a logical acquisition can
    be performed using tools such as the **Elcomsoft iOS Forensic Toolkit** or **MOBILedit
    Forensic Express**.


    The following steps describe the process using the Elcomsoft iOS Forensic Toolkit:


    +   1. First, launch the Toolkit.

    +   2. Connect the device to the workstation using a USB-A cable.

    +   3. Select the **B – Backup** option.

    +   4. When prompted, enter the path to the lockdown record.


    If the pairing record is accepted, a logical backup will be created. The following
    screenshot shows the Toolkit''s main menu:'
  merge: -1
  img_proc: true
