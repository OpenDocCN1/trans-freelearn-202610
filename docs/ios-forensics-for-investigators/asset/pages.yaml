- pgno: 159
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_159_0.png)


    Figure 5.11 – The query shows the device lock status


    If, however, we want to find out every time the screen was activated, even if
    the device was not unlocked, we can do so by running this query:


    ```

    SELECT

    datetime(ZOBJECT.ZSTARTDATE+978307200, ''UNIXEPOCH'',

    ''LOCALTIME'') as "DATE / TIME",

    ZOBJECT.ZSECONDSFROMGMT/3600 AS "GMT OFFSET"

    FROM ZOBJECT

    WHERE ZOBJECT.ZSTREAMNAME LIKE "/display/isBacklit"

    AND ZOBJECT.ZVALUEINTEGER = ''1''

    ORDER BY "DATE / TIME";

    ```


    The resulting records will show when the display was activated. The queries used
    in these examples should be straightforward to understand and can easily be customized
    to match other events that can be of interest to the investigation.


    We will now look into another option to analyze pattern-of-life data, using an
    open source tool.


    # Introducing Apollo'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'So far, we have learned how to manually analyze pattern-of-life data by querying
    the SQLite databases. However, there is another option that automates the process
    and allows the investigator to look at all the data in a unified database.


    **Apollo**, which stands for **Apple Pattern of Life Lazy Output''er**, is a Python
    script developed by Sarah Edwards (@iamevltwin) that correlates multiple sources
    of data into a unified **timeline**, simplifying the examiner''s job of finding
    out what exactly was happening on the device.


    The tool consists of dozens of highly configurable modules that each query a specific
    iOS database to extract data and events. The main Python script then compiles
    the results of each module into a unified **CSV** file or SQLite database.


    We''ll now go over the steps required to download the tool, run it, and export
    the results into a single SQLite database:


    +   1. To download Apollo, head over to its GitHub repository located at https://github.com/mac4n6/APOLLO
    and download the latest version as a ZIP archive or by cloning the repository
    by running the git clone command.

    +   2. Next, run the tool by specifying the export format, the location of the
    modules directory, and the location of the data that should be analyzed, such
    as the folder that contains the SQLite databases or the full filesystem extraction.
    For example, running python apollo.py -output sql modules/ fs-extraction/ will
    run Apollo in SQL mode, analyzing the files in the fs-extraction folder and running
    all modules found in the modules folder. Apollo can be run using different options
    too; for a full list of all available command-line options, you can refer to the
    project''s GitHub page.

    +   3. When the tool ends the process, the results will be stored in a file called
    apollo.db.

    +   4. You can then proceed to analyze the SQLite database using your tool of
    choice, such as **DB Browser**.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'The following screenshot shows the output database in DB Browser:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_161_0.png)


    Figure 5.12 – The Apollo database displayed in DB Browser


    The database consists of a single table, APOLLO, which contains a timeline of
    all the data that was processed by the tool''s modules. The following is a brief
    description of the table''s columns:


    +   - The Key column contains the timestamp of when the event occurred, displayed
    as a human-readable string.

    +   - The Activity column shows a simple description of what kind of event was
    logged.

    +   - The Output column contains a JSON object with all the data pertaining to
    a specific event.

    +   - The Database column indicates from which database the event was extracted.'
  merge: -1
  img_proc: true
- pgno: 162
  md: "+   - The Module column indicates the name of the module that was responsible\
    \ for extracting and analyzing the event.\n\nTypically, the output command will\
    \ contain most of the interesting data from a forensic perspective. The following\
    \ figure shows what the JSON object looks like for a `Battery Level` event:\n\n\
    ```\n```json\n{\n  \"ADJUSTED_TIMESTAMP\": \"2021-06-19 07:57:09\",\n  \"LEVEL\"\
