- pgno: 221
  md: "+   - The `/private/var/mobile/Library/Preferences/com.apple.madrid.plist`\
    \ property list contains a set of properties and user preferences related to SMS,\
    \ iMessage, and FaceTime. In particular, the plist contains a dictionary under\
    \ the allAliases key that indicates all the aliases connected to the iMessage\
    \ account, such as phone numbers and email addresses.\n+   - `/private/var/mobile/Library/Preferences/com.apple.MobileSMS.plist`\
    \ stores preferences related to SMS and iMessage, including the KeepMessageForDays\
    \ key, which indicates the retention period. By default, this is set to Forever.\n\
    +   - The `/private/var/mobile/Library/SMS/Attachments/` folder, as the name implies,\
    \ contains attachments that were sent through MMS or iMessage, such as photos,\
    \ videos, and audio recordings.\n+   - The `/private/var/mobile/Library/SMS/Drafts/`\
    \ folder stores draft messages and pending messages (messages that the user sent\
    \ but that iOS did not send due to, for example, the absence of connectivity).\n\
    +   - The `/private/var/mobile/Library/SMS/sms.db` database stores all metadata\
    \ and content of all messages, SMS and iMessage.\n+   - Messages received **Before\
    \ First Unlock (BFU)** are stored in a temporary database, which is located at\
    \ `/private/var/mobile/Library/SMS/sms-temp.db.`\n\nWe're going to focus on the\
    \ sms.db file to learn how to extract all messages and their metadata from the\
    \ message, chat_message_join, chat, and attachment tables. The following SQL query\
    \ will do the job:\n\n```\nSELECT\nCASE when LENGTH(chat_message_join.message_date)=18\
    \ THEN\n    datetime(chat_message_join.message_date/100000000 + 978307200,'unixepoch','localtime')\n\
    \    when LENGTH(chat_message_join.message_date)=9 THEN\n    datetime(chat_message_join.message_date\
    \ + 978307200,'unixepoch','localtime')\n    else 'NA'\n```"
