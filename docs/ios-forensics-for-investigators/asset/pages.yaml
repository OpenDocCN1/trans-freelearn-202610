- pgno: 200
  md: 'Analyzing the networking data that''s provided by an iOS device can give the
    investigator a precise idea of what services and applications are consuming bandwidth,
    and which networks the device is connected to.


    We''ll introduce the topic by learning how to extract some basic networking-related
    data from a full filesystem.


    # Airplane mode


    To detect if the device was placed in airplane mode or not, you can examine the
    com.apple.radios.plist file, which is located at /private/var/preferences/SystemConfiguration/.
    The PLIST contains an AirplaneMode key with a value of true or false.


    # Wi-Fi MAC address


    The MAC address of the wireless network interface within the device can be found
    by analyzing the NetworkInterfaces.plist file, which is located at /private/var/preferences/SystemConfiguration/.
    The IOMACAddress key indicates the desired value. Note that each iOS device has
    more than one networking interface and that each of those has a unique MAC address.


    # Known Wi-Fi networks


    A list of known wireless networks is stored in the /private/var/preferences/SystemConfiguration/com.apple.wifi.plist
    file. This PLIST contains a key list of known networks, which is also an array
    of items:


    +   - The SSID_STR key contains a user-readable SSID string that identifies the
    network.

    +   - The BSSID key indicates the MAC address of the access point.'
  merge: -1
  img_proc: true
- pgno: 201
  md: "+   - The `lastJoined` key stores a timestamp of the last time the user manually\
    \ accessed the network.\n+   - The `lastAutoJoined` key indicates the last time\
    \ the device automatically connected to the wireless access point:\n\n```\n```xml\n\
    <key>SSID</key>\n<data>\nQ2Nvb2tpZXNEY2FzdGlugR3Vlc3Q=\n</data>\n<key>SSID_STR</key>\n\
    <string>Cookiesdcastler5 Guest</string>\n<key>SaveDataMode</key>\n<integer>2</integer>\n\
    <key>ScaledRSSI</key>\n<real>0.82863259315490723</real>\n<key>ScaledRate</key>\n\
    <real>1</real>\n<key>ShareableStatus</key>\n<integer>1</integer>\n<key>Strength</key>\n\
    <real>0.82863259315490723</real>\n<key>VHT_CAPS_IE</key>\n<dict>\n    <key>VHT_CAPS</key>\n\
    \    <integer>864041394</integer>\n    <key>VHT_SUPPORTED_MCS_SET</key>\n    <data>\n\
    \    +v8AArP/AAA=\n    </data>\n</dict>\n<key>WiFiAutoInstantHotspotJoining</key>\n\
    <false/>\n<key>WiFiInstantHotspotJoining</key>\n<false/>\n<key>WiFiManagerKnownNetworksEventType</key>\n\
    <integer>1</integer>\n<key>WiFiNetworkAttributeIsKnown</key>\n<true/>\n<key>WiFiNetworkAttributeIsMoving</key>\n\
    <false/>\n<key>WiFiNetworkAttributeIsPotentiallyMoving</key>\n<true/>\n<key>WiFiNetworkAttributeLowPopularity</key>\n\
    <true/>\n<key>WiFiNetworkAttributePopularityScore</key>\n<integer>0</integer>\n\
