- pgno: 293
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_293_0.png)


    Figure 11.7 – Set up a dictionary attack or a brute-force attack


    +   4. You can set additional parameters, such as the password length, common
    character sets, or custom character sets. Then, click Done.


    +   5. Click on Start recovery to begin the process.


    From the research that has been carried out, it''s recommended to attempt brute-forcing
    a four-digit password first, followed by a six-digit password and a dictionary
    attack, as these are the most common and easily crackable.


    Unfortunately, there are some cases in which recovering the password to an iTunes
    backup is simply not possible, or there may even be no local backup available.
    In these situations, one of the possible courses of action is to attempt to download
    and extract backups or data synced to iCloud.


    The final section of this chapter will discuss iCloud forensics.


    # Introducing iCloud forensics'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'In October 2011, Apple introduced **iCloud**, a cloud-based platform that allows
    users to store and share files between their devices, and backup their data. iCloud
    is integrated directly into iOS and is accessible from Windows machines, macOS
    computers, or directly from the web by browsing to https://www.icloud.com.


    From a forensic viewpoint, cloud forensics is arguably the future of mobile forensics
    as it allows investigators to access data that may not even be stored on the device
    itself. As the majority of new devices do not (yet) support jailbreaks and full
    filesystem acquisitions, performing a cloud acquisition is a great alternative.


    Before we dive deep into the technical details of extracting data from iCloud,
    it''s important to understand exactly what kind of data we can expect to find,
    starting with **iCloud backups**.


    # iCloud backups


    Since the release of iOS 5 in 2011, Apple allows users to back up their devices
    automatically to their iCloud accounts. These backups are similar to the iTunes
    backups we discussed in the previous section and include most of the data that
    is stored on a device, such as application data, device settings, call logs, messages,
    notes, and Safari history.


    The user can elect to include or exclude certain elements from the backup directly
    from the device by navigating to **Settings | [User] | iCloud | Manage storage
    | Backups.**


    To perform an iCloud backup, there is no need to connect the device to a computer,
    as the backup process happens automatically during the night when the device is
    charging and connected to a Wi-Fi network. The process can also be started manually
    from the device.


    Cloud backups are made incrementally to save space and time, and typically, at
    least two or three backups are retained in the cloud. All data is securely encrypted
    both in transit and in storage, and the encryption key is stored by Apple in the
    user''s iCloud account. More sensitive data, such as'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'Apple Card transactions and health data, is secured with a stronger form of
    protection known as **end-to-end encryption**; this data is encrypted using keys
    derived from information unique to the device, so nobody – not even Apple – has
    access to this data.


    Tip


    When an investigation involves a locked device that cannot be acquired using any
    of the methods described in previous chapters, one of the possible workarounds
    is to take advantage of iCloud''s automatic backup capabilities. Putting the device
    close to a known Wi-Fi network and charging it for a few hours will trigger the
    creation of a new backup that can then be downloaded and analyzed, revealing the
    data stored on the device.


    Backups are not the only thing that is stored in iCloud, as iOS also provides
    automatic syncing capabilities for certain data categories.


    # iCloud synced data


    Syncing data between iOS devices has become a seamless experience for the user
    thanks to iCloud. The following is a list of the most common categories that are
    synced to the cloud:


    +   - Account information

    +   - User settings

    +   - Mail

    +   - Call history

    +   - Messages

    +   - Contacts, notes, and calendars

    +   - Safari history, tabs, and bookmarks

    +   - iCloud Keychain

    +   - Apple Health'
  merge: -1
  img_proc: true
- pgno: 296
