- pgno: 191
  md: '# Chapter 7: Analyzing Connectivity Data


    In the previous chapter, we introduced location-related artifacts and learned
    how an investigation can leverage such data to obtain a general geographical location
    of where the device may have been. In this chapter, we will focus on connectivity
    data.


    The modern mobile phone has evolved from being a simple handheld device that''s
    used to communicate via voice into a mobile computing device that communicates
    with the internet. Almost every interaction between a device and the external
    world is logged by the operating system, so it shouldn''t come as a surprise that
    connectivity data has become the single most important source of evidence in virtually
    every type of investigation: artifacts such as call logs and internet navigation
    history are invaluable for the modern investigator.


    We''ll start this chapter by looking at cellular-related artifacts, contacts,
    and phone calls, including FaceTime videocalls. Then, we''ll learn all about networking
    forensics, including how to analyze a device''s favorite Wi-Fi networks and detailed
    network usage. We will also briefly look into Bluetooth forensics. Finally, we''ll
    learn about internet-related artifacts and how to analyze Safari history.


    In this chapter, we will cover the following topics:


    +   - Introducing cellular forensics

    +   - Analyzing networking data

    +   - Introducing Bluetooth forensics

    +   - Understanding Safari forensics


    # Introducing cellular forensics'
  merge: -1
  img_proc: true
- pgno: 192
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 193
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_193_0.png)


    Figure 7.1 – The com.apple.commcenter PLIST


    This PLIST contains several useful cellular-related values, such as its **Integrated
    Circuit Card Identifier (ICCID)**, **International Mobile Subscriber Identity
    (IMSI)**, **International Mobile Equipment Identity (IMEI)**, the device''s phone
    number, and details of the last cell tower that the device connected to.


    # ICCID


    The ICCID is the SIM card''s serial number. This value uniquely identifies the
    physical SIM card and will change if the card is replaced, even if the phone number
    remains the same. This value can be extracted from the PLIST by looking at the
    LastKnownICCID key.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# IMSI


    The **IMSI** can be found by looking at the `lastGoodImsi` key. This value is
    typically 15 digits long and identifies a SIM card on its network. It''s important
    to understand that this code is tied to the phone number, not the physical SIM
    card. The IMSI is used by mobile network operators to connect phone calls and
    communicate with the SIM card.


    # IMEI


    The **IMEI** is a unique 15-digit code that identifies a particular mobile device.
    This code has no relationship with the subscriber and only identifies the mobile
    phone; however, when a mobile device registers on a GSM network, it also provides
    the device''s IMEI, so operators can block devices that have been reported as
    stolen by adding their IMEI to a blocklist. This code can also be used by law
    enforcement and intelligence agencies to track mobile devices, which can be located
    by analyzing the cell tower the device connects to. The IMEI can be found in the
    PLIST by looking at the `kEntitlementsSelfRegistrationUpdateImei` key.


    # MCC and MNC


    The **Mobile Country Code (MCC)** and **Mobile Network Code (MNC)** are a combination
    of values that uniquely identify a cell tower. Mobile iOS devices store the last
    known MCC and MNC values in the PLIST under the `LastKnownServingMcc` and `LastKnownServingMnc`
    keys. These values, together with a map of known cell towers, can be used to pinpoint
    the device''s last position.


    # Phone number


    Finally, the device''s phone number is also stored in the PLIST, under the `NetworkPhoneNumber`
    key. It''s important to keep in mind that iOS devices'
  merge: -1
  img_proc: true
