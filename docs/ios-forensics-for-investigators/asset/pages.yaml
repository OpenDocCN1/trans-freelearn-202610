  md: 'Although Protobufs are not as common on iOS devices, there are still some apps
    that use them to store data so an investigator should have at least a basic understanding
    of how to work with these files.


    As protobufs are stored in binary format, they aren''t human-readable; the protoc
    command-line tool allows you to display the contents of the file and gives you
    a general idea of how the data is structured.


    # Tip


    The protoc tool is part of the protocol buffers package and can be downloaded
    from the GitHub repository located at https://github.com/protocolbuffers/protobuf.


    Once the protoc tool has been installed, the contents of a protobuf can be printed
    to the screen by running the following command:


    ```

    protoc --decode_raw < [protobuf_blob_file]

    ```


    Examples of applications that make use of protocol buffers include Apple **Notes**,
    Apple **Maps**, and the **Spotify** application.


    Now that we have a better understanding of what artifacts look like and how these
    can be manually analyzed, the next section will provide an exhaustive list of
    the most common evidence locations on iOS devices and what insights we can expect
    to gain.


    # Locating common artifacts


