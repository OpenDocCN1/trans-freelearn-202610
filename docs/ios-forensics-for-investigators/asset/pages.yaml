- pgno: 58
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_58_0.png)


    Figure 2.7 – Enter the passcode when requested


    When the device reboots, you will find the checkra1n icon. Launching that application
    will allow you to install Cydia. Once Cydia is installed, you can proceed to install
    any third-party packages, such as SSH.


    Remember that checkra1n is a semi-tethered jailbreak; if you reboot the device,
    you will have to jailbreak it again using the checkra1n tool.


    Once the device has been successfully jailbroken, you can perform a full filesystem
    acquisition using the tool of your choice.


    # Triaging the device


    When you''re dealing with iOS devices, it''s useful to gather some information
    directly from the device prior to starting the acquisition'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'process. Knowing what iOS version is running on the device, for instance, can
    be useful to determine what the best acquisition method is. For this purpose,
    we''re going to use `libimobiledevice`.


    The `libimobiledevice` library is a cross-platform library that allows users to
    communicate with an iOS device using their native protocol to provide access to
    the device''s filesystem, including information about the device and its internals.
    It works with all devices, including the most recent ones.


    The first step is to head to http://libimobiledevice.org, where the library can
    be downloaded for free. If you''re running Windows, instead of downloading the
    source files and compiling them, you can download precompiled binaries from the
    project''s GitHub repository.


    If you''re running macOS, you can install the library simply by running the following
    command from the terminal:


    ```

    brew install libimobiledevice

    ```


    If you''re running a Linux distribution that supports the apt packet manager,
    you can install the library by running the following command:


    ```

    sudo apt-get install usbmuxd libimobiledevice6

    libimobiledevice-utils

    ```


    Once you have installed the library, connect the device to your forensic workstation
    and run the following command from the terminal:


    ```

    ideviceinfo

    ```


    This command will connect to the device, parse data relevant to the hardware and
    software, and display it on screen. Keep in mind that the device will have to
    be paired with the host system by entering the passcode. If you''re running Linux
    or macOS, you can combine the previous command with the grep command to view some
    key data:


    # Identifying the device model:'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'You can read the device model by running the following command:


    ```

    ideviceinfo | grep ModelNumber

    ```


    # Identifying the iOS version:


    To identify what version of iOS the device is running, you can run the following
    command:


    ```

    ideviceinfo | grep ProductVersion

    ```


    # Identifying the device serial number:


    The device''s serial number can be parsed by running the following command:


    ```

    ideviceinfo | grep SerialNumber

    ```


    # Identifying the phone number:


    Finally, to identify the phone number related to the SIM card in the device, run
    the following command:


    ```

    ideviceinfo | grep PhoneNumber

    ```


    # Deciding the best acquisition method


    Once the device has been seized, it has been correctly isolated, and you have
    identified the hardware model and iOS version, the next step in the examination
    process is assessing what the best acquisition method is to extract the richest
    dataset from the device while preserving data integrity.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'Generally speaking, you''ll want to keep these two concepts in mind before
    performing any actions on the device:


    +   - Acquire evidence by order of **volatility**.

    +   - Acquire evidence, starting with the less intrusive method.


    The first step in any acquisition process is determining the volatility of the
    data of interest; for example, if the scope of the investigation is to extract
    photos from a device or parse text messages, clearly this doesn''t pose any kind
    of concern because this data is written on the flash memory, it isn''t volatile,
    and any acquisition method will extract these artifacts. However, if the investigation
    seeks to understand how the device was used, or if there was any human interaction
    on a particular date and time, or where the device was located a few days ago,
    these artifacts are much more volatile, as log files and databases on iOS devices
    are constantly overwritten. For instance, location data is generally maintained
    on the device for several weeks; however, *precise* location data, including cell
    tower data, is only maintained for a few days. In this case, we''ll want to extract
    this kind of data as soon as possible before it gets overwritten. This means performing
    a full filesystem acquisition (if possible) before anything else, as logical acquisitions
    do not contain this data.


    The investigator should have a clear understanding of how forensic tools work
    and what impact they have on data and on the device itself:


    +   - Anything you decide to do (including nothing!) will have an impact on the
    device.

    +   - What impact will your actions have on the data?

    +   - Does the chosen acquisition method require a device reboot?

    +   - Will artifacts of interest survive a device reboot?

    +   - How long are artifacts stored on the device before being overwritten?

    +   - What files or folders will be affected by a jailbreak?

    +   - What changes will occur by running a Checkm8 acquisition?'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# What changes will occur by performing an agent-based acquisition?


    A logical acquisition will have virtually no impact on the device, so most often,
    this will be your first choice. If the device is vulnerable to Checkm8 and if
    you have tools that can perform this kind of acquisition, a Checkm8 acquisition
    will be the best option to gain access to the entire filesystem without making
    any changes to the device. If this is not an option, the next step would be considering
    an agent-based acquisition. Finally, as a last resort, jailbreaking the device
    will give the investigator access to the entire filesystem, but make sure you
    understand how this will affect the device and its data.


    # Performing a logical acquisition


    Now that we''ve learned the theory, it''s time to put it into practice by performing
    our first logical acquisition.


    Almost all forensic tools can perform a logical acquisition; we''ll concentrate
    on two of the most popular ones, Cellebrite UFED and Elcomsoft iOS Forensic Toolkit.


    Cellebrite UFED is considered the industry standard, as it allows investigators
    to perform a variety of different acquisitions, including a traditional logical
    acquisition, a partial filesystem, a full filesystem acquisition through Checkm8,
    and a full filesystem acquisition from devices that have been jailbroken.


    Elcomsoft iOS Forensic Toolkit, on the other hand, can perform logical acquisitions,
    a full filesystem acquisition from jailbroken devices, full filesystem acquisitions
    through agent-based extractions, and it also supports physical acquisitions from
    older devices.


    # Logical acquisition with Cellebrite UFED'
  merge: -1
  img_proc: true
