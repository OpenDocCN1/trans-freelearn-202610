- pgno: 231
  md: '# Chapter 9: Photo, Video, and Audio Forensics


    In the first few chapters of the book, we focused on the identification and analysis
    of mobile evidence stored in system-generated artifacts such as databases, PLISTs,
    and log files. However, any type of investigation will also typically involve
    analyzing user-generated content found on a device, such as media files.


    A modern iOS device can contain tens of thousands of media files, and each of
    these files is associated with unique metadata that can be critical to an investigation.
    In this chapter, we will learn how to identify and analyze multimedia content
    such as photos, videos, and audio files.


    We will start the chapter with an introduction to media forensics and discuss
    where photos, videos, and audio recordings are stored on an iOS device. Then,
    we''ll learn all about analyzing media metadata to gain meaningful insights, both
    from the file itself and from the corresponding databases. In the last part of
    the chapter, we will learn how to analyze user behavior to find out what media
    the user has accessed or watched through Apple apps such as Music and Safari,
    and third-party apps such as Spotify or Netflix.


    In this chapter, we will cover the following topics:


    +   - Introducing media forensics

    +   - Analyzing photos and videos

    +   - Introducing EXIF metadata

    +   - Analyzing user viewing activity


    # Introducing media forensics'
  merge: -1
  img_proc: true
- pgno: 232
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 233
  md: 'We''re going to start by highlighting some of the most common locations where
    media-related artifacts are located:


    +   - `/private/var/mobile/Media/DCIM/1**APPLE/`: This folder stores photos and
    videos that were created by the user or saved to the device. Typically, images
    will be stored in **JPG**, **PNG**, or **HEIC** format, and videos will be stored
    as **MP4** or **MOV** files.

    +   - `/private/var/mobile/Media/PhotoData/`: The PhotoData folder stores several
    artifacts related to the media metadata, such as the `Photos.sqlite` database,
    **thumbnails** (which are stored in `/private/var/mobile/Media/PhotoData/Thumbnails/V2/DCIM/1**APPLE/IMG_****.JPG/****.JPG`),
    and **photo album** data. Generally, this folder will be the primary source of
    evidence for any kind of media file stored on the device. We''ll take an in-depth
    look at this folder in the next section.

    +   - `/private/var/mobile/Media/PhotoData/PhotoCloudSharingData/`: The PhotoCloudSharingData
    folder contains artifacts pertaining to Shared Albums, an iOS feature that allows
    users to easily share photo collections. Each shared album will have a subfolder
    that contains an `Info.plist` file, which contains album metadata (the name, the
    owner, and more), and `DCIM_CLOUD.plist`, which stores the number of photos in
    the album.

    +   - `/private/var/mobile/Media/Recordings/*`: This folder contains user-recorded
    **voice memos.**


    The following screenshot shows which files and folders can be found in the PhotoData
    folder:'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_234_0.png)


    Figure 9.1 – The PhotoData folder contains media metadata


    Each media asset has two different kinds of metadata associated with it – **EXIF
    metadata**, which contains details such as the device that generated the image
    or the location, is stored within the file itself, while iOS-generated metadata
    is stored in the `Photos.sqlite` database.


    In the following section, we''ll analyze the database to learn how to extract
    meaningful information for each image or video that is stored on the device.


    # Analyzing photos and videos


    Every time a photo or video is taken through a device''s camera or saved onto
    a device, iOS analyzes it and generates a multitude of metadata, which is stored
    in the `Photos.sqlite` database.


    The following is a list of events that occur during the process:


    +   1. First, the newly created photo or video is saved in `/private/var/mobile/Media/DCIM/1**APPLE/`
    as a JPG, HEIC, MP4, or MOV file. The folder name will iterate upward (100APPLE,'
  merge: -1
  img_proc: true
- pgno: 235
  md: '101APPLE, 102APPLE, and so on) as more photos or videos are stored on the device.


    +   2. Additionally, the PreviewWellImage.tiff image is created and stored in
    /private/var/mobile/Media/PhotoData/MISC/. This image is the thumbnail that is
    displayed in the **Photos** app where the most recent image is displayed.

    +   3. As the new media is stored, a new entry is created in the Photos.sqlite
    database, in the ZGENERICASSET table. Since iOS 14, this table is now called ZASSET.
    The new record will contain metadata such as the date and time when the content
    was saved, the date and time of when it was last edited, the filename, and the
    color space.

    +   4. In the background, iOS starts processing the newly created media by running
    several algorithms, such as facial and object recognition. If a name has been
    associated with a face that iOS recognizes in the media file, the photo or video
    will also be displayed in the **People** album, in the **Photos** app. The results
    of the analysis are then stored in the Photos.sqlite database and in mediaanalysis.db,
    which can be found in /private/var/mobile/Media/MediaAnalysis/.


    As you can see, there''s a lot going on! Now that we know where the artifacts
    are located, we will focus on analyzing photos and videos.


    # Understanding Photos.sqlite


    With over 60 tables packed full of data, the Photos.sqlite database is one of
    the largest datasets that can be found in an iOS acquisition. A detailed analysis
    of this database is beyond the scope of this book, so we''ll focus on extracting
    the most important pieces of metadata from the ZGENERICASSET (ZASSET in iOS 14
    and 15) table.


    Once you''ve opened the file with your tool of choice, such as *DB Browser for
    SQLite*, run the following query:


    ```

    SELECT

    Z_PK,

    DATETIME(ZDATECREATED + 978307200, ''UNIXEPOCH'') AS "Created

    ```'
