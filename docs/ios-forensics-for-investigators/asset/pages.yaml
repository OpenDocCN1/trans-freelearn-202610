- pgno: 158
  md: "Gaining insights from pattern-of-life data would not be possible without the\
    \ generous contributions from the **Digital Forensics and Incident Response (DFIR)**\
    \ community. In particular, most of the queries used in this chapter are based\
    \ on the research carried out by Sarah Edwards (@iamevltwin). You can view her\
    \ blog by going to [https://www.mac4n6.com](https://www.mac4n6.com).\n\n# # Analyzing\
    \ user interaction\n\nIn any kind of digital investigation involving a smart device,\
    \ typically one of the first questions investigators want to answer is when the\
    \ device was used and when human-device interaction occurred. This can easily\
    \ be discovered by looking out for events that require human interaction, such\
    \ as unlocking the device or activating the screen.\n\nThe following query shows\
    \ when the device was locked or unlocked:\n\n```\n```sql\nSELECT\ndatetime(ZOBJECT.ZSTARTDATE+978307200,\
    \ 'UNIXEPOCH',\n'LOCALTIME') as \"DATE / TIME\",\nZOBJECT.ZSECONDSFROMGMT/3600\
    \ AS \"GMT OFFSET\",\nCASE ZOBJECT.ZVALUEINTEGER\n        WHEN '0' THEN 'UNLOCKED'\n\
    \        WHEN '1' THEN 'LOCKED'\n    END \"IS LOCKED\"\nFROM ZOBJECT\nWHERE ZOBJECT.ZSTREAMNAME\
    \ LIKE \"/device/isLocked\"\nORDER BY \"DATE / TIME\";\n```\n```\n\nThe result\
    \ is shown in the following screenshot:"
