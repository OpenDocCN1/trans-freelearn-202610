- pgno: 147
  md: '# Convert epoch to human-readable date and vice versa


    1633614474 Timestamp to Human date [batch convert]


    Supports Unix timestamps in seconds, milliseconds, microseconds and nanoseconds.


    Assuming that this timestamp is in seconds:

    **GMT**: Thursday 7 October 2021 13:47:54

    **Your time zone**: giovedì 7 ottobre 2021 15:47:54 GMT+02:00 DST

    **Relative**: A few seconds ago


    Figure 5.2 – Converting a Unix timestamp to a string


    Now that we know what a Unix timestamp is, let''s see how we can convert it to
    a readable string using a SQL query.


    In the example below, we have a single table called Events that has three columns:
    id, uuid, and timestamp. The timestamp is in Unix format:


    ```

    SELECT * FROM Events;

    ```


    ![](img/0b17a17d4cb56b1c25763a396dd83117_147_0.png)


    To convert the Unix timestamp to a human-readable string, run the following query:


    ```

    SELECT id, uuid, datetime(timestamp, ''unixepoch'') AS date FROM Events;

    ```'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'The datetime SQL function converts the numeric value in the timestamp column
    to a string. The resulting time is supplied in UTC format:


    ```

    ```sql

    SELECT id, uuid, datetime(timestamp, ''unixepoch'') AS date FROM Events;

    ```

    ```


    |   | id | uuid | date |

    |---|---:|---|---|

    | 1 | 1 | dbcab8a2-7766-453a-b3b0-3a14a1d6d417 | 2021-10-04 15:10:29 |

    | 2 | 2 | 25e66b36-f1ce-4fe3-9a30-3379bf724b00 | 2021-10-04 15:11:39 |

    | 3 | 3 | 2844e9a3-df4a-4ac0-ab51-d68a47f1d0f... | 2021-10-04 15:13:26 |


    ![](img/0b17a17d4cb56b1c25763a396dd83117_148_0.png)


    To display the string in local time format, run this query instead:


    ```

    ```sql

    SELECT id, uuid, datetime(timestamp, ''unixepoch'',

    ''localtime'') AS date FROM Events;

    ```

    ```


    The time zone will reflect the settings of the device that is being used, usually
    the investigator''s workstation.


    # Mac timestamps


    Another commonly used timestamp format is Mac absolute time, which is defined
    as the number of seconds elapsed since the Mac epoch on 01/01/2001 00:00:00. A
    Mac timestamp can be converted to a human-readable string by using online converters
    or simply by adding the number of seconds since the **Unix epoch** (978307200)
    to the Mac timestamp and then converting it to a string.


    The following query illustrates the process of converting a Mac timestamp to a
    string in the local time zone:'
  merge: -1
  img_proc: true
- pgno: 149
  md: '```

    ```sql

    SELECT id, uuid, datetime(timestamp + 978307200,

    ''unixepoch'', ''localtime'') AS date FROM Events;

    ```

    ```


    Mac timestamps are commonly used in iOS pattern-of-life data, such as in the KnowledgeC.db
    database.


    # # Logs, events, and user interaction


    At the start of this chapter, we introduced pattern-of-life forensics, and we
    learned how iOS stores and analyzes a number of user events and device events.
    Then, we went through the most common sources of data, such as the KnowledgeC.db
    database, and learned how iOS represents time through Unix timestamps and Mac
    absolute time.


    Now, we''ll take an in-depth look at one of the most forensically interesting
    SQLite databases you will find on an iOS device.


    # ## The KnowledgeC database


    KnowledgeC.db is the SQLite database that tracks almost all activity and device
    events, ranging from battery level to what music was played. The database is located
    at `/private/var/mobile/Library/CoreDuet/Knowledge/`, and it is only accessible
    through a full filesystem acquisition. The database is made of 16 tables, although
    most of the useful data is concentrated in one of them, the ZOBJECT table.


    The following screenshot shows the database schema:'
  merge: -1
  img_proc: true
- pgno: 150
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_150_0.png)


    Figure 5.5 – The schema of the KnowledgeC database


    It''s important to keep in mind that data in this database will only be stored
    for approximately four weeks before being purged on a first in-first out basis,
    so if pattern-of-life data is an essential part of the investigation, the device
    should be acquired as soon as possible.


    The main table of interest from a forensic perspective is the ZOBJECT table, which
    contains a row for each event or interaction with data spread over 40 columns.
    We will briefly go over the most interesting columns to understand how this table
    logs events:


    +   - Each row contains a ZCREATIONDATE column that records a timestamp (in MAC
    format) of when the entry was written to the database.

    +   - The ZSTARTDATE and ZENDDATE columns contain a timestamp for the start and
    end times of the event.

    +   - The ZSTARTDAYOFWEEK column indicates what day the event occurred.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '+   - The GMT offset in seconds is indicated in the `ZSECONDSFROMGMT` column.

    +   - The `ZSTREAMNAME` column indicates the type of event that occurred.

    +   - The `ZVALUESTRING` column shows the bundle ID for the application relevant
    to the event.


    To gain a better understanding of what kind of events will be logged by this database,
    we’ll analyze the `ZSTREAMNAME` column and check its values. You can see a list
    of the event types by running the following SQL query:


    ```

    SELECT DISTINCT ZOBJECT.ZSTREAMNAME FROM ZOBJECT ORDER BY ZSTREAMNAME;

    ```


    On one of the latest iOS devices running iOS 14.6, this query resulted in more
    than 50 different event types. The following is a list of some of the most common
    event types and how to interpret data from the `ZOBJECT` table.


    # /device/batteryPercentage


    The batteryPercentage stream type indicates the charge level of the device''s
    battery. The percentage value is stored in the `ZVALUEDOUBLE` column.


    # /device/isPluggedIn


    This event indicates whether the device was plugged in and charging or not. The
    `ZVALUEINTEGER` column will indicate 0 if the device was unplugged or 1 if the
    device was plugged in.


    # /displayIsBacklit


    This event stream indicates whether the backlight was lit or not. The `ZVALUEINTEGER`
    column will indicate 0 if the backlight was off or 1 if the backlight was on.
    This event can be useful to detect human interaction'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'while the device is locked; simply tapping the screen will light up the display,
    resulting in this event being triggered.


    # /device/isLocked


    The isLocked stream type indicates whether the device is passcode-locked or not.
    The locked status is stored in the ZVALUEINTEGER column; a value of 0 indicates
    that the device is locked, while a value of 1 indicates an unlocked device.


    # /app/inFocus


    This event stream indicates which application is active and running in the foreground.
    The ZVALUESTRING column stores the name of the app. The inFocus event can be analyzed
    to track application usage in great detail.


    # /notification/usage


    This event stream indicates push notification activity. The ZVALUESTRING column
    shows what kind of activity was logged, such as *receive*, *clear*, and *dismiss*.
    This event can also be useful to identify user activity, such as the user dismissing
    a notification when the device is locked.


    # /app/webUsage


    This event indicates which app is using the internet connection. The ZVALUESTRING
    column shows the name of the application.


    # /display/orientation


    The orientation event indicates a change in the device''s orientation. The ZVALUEINTEGER
    column will indicate 0 if the device is in portrait mode or 1 if the device is
    in landscape mode.


    # /media/nowPlaying'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'This event indicates that multimedia is playing on the device. The ZVALUESTRING
    column will display information on the app that is playing it, such as YouTube
    or Apple Music.


    By now, you should have a rough idea of what kind of events are logged in the
    KnowledgeC.db database and how to analyze such records. We will now look into
    more advanced topics, such as analyzing application usage in detail.


    # Analyzing application usage


    One of the most valuable insights that can be gained by analyzing pattern-of-life
    data is application usage. By analyzing the /app/inFocus event stream from the
    ZOBJECT table, the investigator will be able to identify what apps were being
    used on a device in a certain time span and for how long.


    As an example, we''ll run a query to identify what applications were used over
    a 48-hour time span, starting from 24/05/2021 00:00:00 up to 26/05/2021 00:00:00.


    First, we need to convert our date and time to a Mac absolute timestamp:


    # Result


    ![](img/0b17a17d4cb56b1c25763a396dd83117_153_0.png)


    Figure 5.6 – Converting date and time to a MAC timestamp using https://www.gaijin.at/en/tools/time-converter


    Now that we have our Mac absolute timestamps, we want to query KnowledgeC.db for
    all /app/inFocus events that occurred between the'
  merge: -1
  img_proc: true
- pgno: 154
  md: '643507200 timestamp and the 643680000 timestamp. To do so, run the following
    query:


    ```

    SELECT

    datetime(ZOBJECT.ZSTARTDATE+978307200, ''UNIXEPOCH'',

    ''LOCALTIME'') as "START",

    datetime(ZOBJECT.ZENDDATE+978307200, ''UNIXEPOCH'',

    ''LOCALTIME'') as "END",

    ZOBJECT.ZSECONDSFROMGMT/3600 AS "GMT OFFSET",

    (ZOBJECT.ZENDDATE-ZOBJECT.ZSTARTDATE) as "USAGE IN SECONDS",

    ZOBJECT.ZSTREAMNAME,

    ZOBJECT.ZVALUESTRING

    FROM ZOBJECT

    WHERE ZSTREAMNAME IS "/app/inFocus"

    AND ZOBJECT.ZSTARTDATE > 643507200

    AND ZOBJECT.ZSTARTDATE < 643680000

    ORDER BY "START";

    ```


    First, we use the datetime SQL command to select the start and end timestamps
    and convert them to a readable string. Then, we calculate the GMT offset in hours
    and the duration of the event in seconds. Finally, we filter down the results
    by only selecting /app/inFocus events that occurred between the timestamps we
    calculated previously.


    The resulting dataset is shown below:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_154_0.png)


    Figure 5.7 – The query result shows application usage'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'As you can see, we have a detailed breakdown of what applications were used
    on the device, the date and time of the event, and how long the app was used.
    For example, you can see that on this day, I briefly navigated the web using Safari,
    then attended a 2-hour Zoom meeting, and finally viewed a PDF file from a website
    in Safari.


    Another insight that can be useful for the investigation is analyzing the user''s
    behavior and determining whether they were engaged in any long task, such as watching
    a movie. We can achieve this by ordering the result in descending order based
    on the USAGE column. In the following example, I have also removed all time constraints:


    ```

