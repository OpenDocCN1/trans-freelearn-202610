- pgno: 298
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_298_0.png)


    Figure 11.8 – Apps using iCloud from the device settings


    iCloud synced data can be downloaded using forensic tools, provided the investigator
    has legal access to cloud data. Downloading synced data can be extremely valuable
    for an investigation as it gives examiners quick access to specific artifacts,
    removing the need to download an entire backup.


    # Accessing iCloud data


    Access to iCloud backups and synced data can be provided to law enforcement by
    Apple through the course of legal requests. As Apple holds the user''s **encryption
    keys**, they can decrypt most of a user''s iCloud data, except for sensitive data,
    which is encrypted with end-to-end encryption.


    This solution, however, has several drawbacks:


    +   - Processing law enforcement and government requests is a very slow process
    due to the large volumes of data requested.

    +   - The data that is returned by Apple is incomplete, as it doesn''t include
    sensitive artifacts, such as Apple card transactions, the keychain, messages,
    and Safari history.


    There are other options that allow the investigator to pull the data directly
    from iCloud, but these requests will have to be authorized by Apple servers by
    providing some sort of **authentication credentials**.


    Currently, iCloud credentials can be supplied in three different formats:


    +   - **Apple ID and password**: If the investigator has legal access to the user''s
    Apple ID (*email address*) and password, these credentials can be used to access
    iCloud data, download backups, and synced data, decrypt'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'them, and convert the data to an iTunes backup. If **two-factor authentication
    (2FA)** is enabled for the account, access to the device or SIM card is required.


    +   • **Authentication token:** A token is a small portion of binary data that
    works like a browser cookie to log in to a website. Authentication tokens are
    used as a replacement for user credentials and allow devices to authenticate with
    iCloud without requesting an Apple ID and password for every request. If a user
    logged into their iCloud account from a Windows or macOS machine, and the investigator
    has access to the computer, the token can be used to access iCloud data without
    the need for the Apple ID and password. Although Apple frequently changes iCloud
    authentication protocols, at present, tokens only work for a limited period of
    time and can only be used from the machine that generated them. Finally, using
    a token will only provide access to some of the data stored in iCloud, such as
    photos, iCloud Drive files, emails, call logs, and Safari history. At the time
    of writing, authentication tokens cannot be used to access iCloud backups. Tokens
    can be extracted by using Elcomsoft Phone Breaker.

    +   • **Trusted device:** If the Apple ID and password are not available but the
    investigator has access to a user''s device, it may still be possible to access
    all of the user''s iCloud data. The device must be logged into the iCloud profile
    and the device''s passcode must be known. To gain access to iCloud, connect the
    device to the workstation and run Elcomsoft Phone Breaker. Once a trust relationship
    has been established, the tool will sideload an extraction agent onto the device
    and the examiner will be presented with a list of iCloud backups and data that
    can be extracted. Currently, this solution works with devices running iOS 9 through
    14.3, or jailbroken devices.


    By supplying the user''s credentials to Apple servers, the investigator will be
    able to pull backups and synced data from iCloud, potentially revealing critical
    evidence that may no longer be present on the device itself. Next, we''ll discuss
    **iCloud Keychain**.


    # Introducing iCloud Keychain'
  merge: -1
  img_proc: true
