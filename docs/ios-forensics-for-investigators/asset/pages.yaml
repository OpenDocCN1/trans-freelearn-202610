- pgno: 243
  md: 'On Windows, you can view a file''s metadata by right-clicking on the media
    and selecting **Properties**. Then, click on the **Details** tab and scroll down
    to view the EXIF data. The exiftool free tool can also be used for the same purpose.
    It can be downloaded from http://exiftool.org and is compatible with both Windows
    and macOS.


    On macOS, you can view EXIF simply by opening the file using **Preview**. Once
    open, click on **Tools** and select **Show Inspector**. Then, click on the **Exif**
    tab.


    On most Linux distributions, the exif command-line tool can be used for this purpose.


    By now, you should have a general understanding of what EXIF metadata is, how
    it can be beneficial to an investigation, and how to analyze it.


    # Analyzing user viewing activity


    So far, we have focused on analyzing photo and video media assets; however, the
    investigator may want to understand not only what media was stored on a device
    but also what media the user viewed.


    This may include any of the following:


    +   - Audio/video streamed through Safari or other browsers

    +   - Music played through Apple Music or third-party apps such as Spotify

    +   - Videos played through third-party apps such as YouTube and Netflix


    The KnowledgeC.db database, which we discussed in *Chapter 5*, *Pattern-of-Life
    Forensics*, tracks most of the user''s day-to-day activity, including events related
    to audio or video playback.


    The table of interest is the ZOBJECT table, which stores device events, organizing
    them by *stream name*. Every time iOS detects that the user has initiated media
    playback, a /media/nowPlaying event is triggered.'
  merge: -1
  img_proc: true
