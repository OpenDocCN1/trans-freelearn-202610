- pgno: 311
  md: '# Chain of custody


    A well-documented **chain of custody** is what holds the forensics process together
    and supports the integrity of the evidence so that it can be presented as evidence
    in court. The inability to document any phase of the chain of custody could potentially
    compromise the authenticity and integrity of the evidence, rendering it useless
    in court. The person writing the report should also describe how the device was
    isolated from the cellular and data networks.


    # Device acquisition


    The entire acquisition process should be described in detail, starting with the
    names of the tools that were used for the purpose. This data can also be reported
    in a table and should include the name of the software, the manufacturer, the
    exact version number, and the task that the tool was used for. If an invasive
    technique was performed, such as jailbreaking the device to obtain a full filesystem
    acquisition, the examiner must document the reasons why such actions were necessary.
    Typically, jailbreaking a device or performing an agent-based acquisition is necessary
    when specific data is required that is not present in a logical acquisition. On
    such occasions, it''s important that the examiner provides a detailed technical
    explanation of any data changes that may have occurred during the acquisition
    process.


    # Analysis process


    Typically, an examiner will use multiple tools during the examination process:
    one tool is used to perform the acquisition, a different tool for the analysis,
    and additional tools to manually parse through the data, such as SQLite viewers.
    The report should distinctly outline these tools, specifying if and when a manual
    examination was performed and the reasons why this was necessary. If multiple
    tools were used and there were any discrepancies in the data, this should be included
    in the report. This is extremely common,'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'due to the fact that a single tool cannot possibly support every third-party
    iOS application.


    # Evidence


    The findings of an examination should be listed in detail in this section of the
    report. Depending on the scope of the investigation, there may potentially be
    thousands of artifacts; for this reason, the evidence should be arranged logically
    within the report and broken into categories, such as phone log, browsing history,
    and WhatsApp messages, for example. For each artifact, the source file and hash
    should be indicated.


    Another way of describing the artifacts is through a **timeline**, which we''ll
    look at in more detail in the next section. Using a timeline, a list of events
    is represented in a particular order – usually in chronological order – and this
    is a great technique to determine what kind of activity occurred on a device at
    a certain time.


    Some examiners like to add comments to this section to explain the data or draw
    conclusions based on the evidence. Personally, I believe that no conclusions should
    be written in this part of the report, as this section should simply describe
    the evidence in an objective manner. The digital forensic examiner''s job is to
    find facts and present the evidence, and it is then up to the investigator, the
    defense, or the prosecutor to explain how the evidence supports the investigation.


    # Comments and conclusions


    The final section of the report will outline the key points of the examination.
    Here, the examiner can point out any observations, describing the results of the
    tests and examinations. The relevance of the data should be explained by correlating
    different sources. For example, merely stating in the report that a message was
    sent from the device is not enough; the artifacts from the messaging application
    should be correlated to the data regarding the device''s date and time, time zone,
    pattern-of-life data, and application usage logs. It is good practice to describe
    how the examiner'
  merge: -1
  img_proc: true
