- pgno: 106
  md: 'This chapter would not be complete without mentioning some of the best open
    source iOS forensic tools! The **DFIR (Digital Forensics and Incident Response)**
    community is one of the most active and helpful communities out there, and these
    tools are the result of the hard work and passion of security researchers, forensic
    examiners, and developers that have shared their knowledge with the community.


    # Apollo


    The **Apple Pattern of Life Lazy Output''er (APOLLO)** is a Python script written
    by Sarah Edwards (you can find her on Twitter – @iamevltwin) that processes iOS
    and macOS artifacts to extract pattern-of-life data and combines the result into
    a single SQLite database or CSV file for viewing.


    The script is based on a number of different modules (some of these have been
    written by the DFIR community), and each of these runs one or more queries to
    extract specific data from an iOS extraction. We''ll be using this powerful tool
    extensively in *Chapter 5*, *Pattern-of-Life Forensics*.


    You can download APOLLO from the project''s GitHub repository: https://github.com/mac4n6/APOLLO.


    # iLEAPP


    The **iOS Logs, Events, And Plists Parser (iLEAPP)** is a script written in Python
    3 by Alexis Brignoni (Twitter – @AlexisBrignoni), which is a free alternative
    to commercial forensic tools. This tool can parse full filesystem iOS extractions,
    parsing and decoding almost every kind of artifact that you can find on an iOS
    device.


    Personally, I find this is a great tool to be used in addition to commercial software,
    as it can help validate your findings.


    iLEAPP can be downloaded from https://github.com/abrigononi/iLEAPP.


    # iOS Triage'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'This tool is a Unix **shell script** written by Mattia Epifani (Twitter – @mattiaep)
    that can be used to extract data from a jailbroken iOS device. This is a quick
    solution if you need to triage a device, including devices that are in **BFU**
    state. We''ll be using iOS Triage later on in the book.


    You can download this tool from GitHub:

    https://github.com/RealityNet/ios_triage.


    # Sysdiagnose


    This is the result of research carried out by Mattia Epifani (@mattiaep), Adrian
    Leong, and Heather Mahalik (@HeatherMahalik) on **log files** generated by iOS
    devices.


    These Python scripts will parse log files and provide useful evidence that could
    be missed by commercial forensic tools.


    You can download the scripts from

    https://github.com/cheeky4n6monkey/iOS_sysdiagnose_forensic_scripts.


    # Analyzing data with iLEAPP


    Let''s take a look at how iLEAPP works and what kind of evidence can be extracted
    by using this tool.


    Before installing iLEAPP, make sure that you have Python 3 installed on your system.
    The first step is downloading the code from GitHub by cloning the repository.
    You can do this by running the following command:


    ```

    ```bash

    git clone https://github.com/abrignoni/iLEAPP.git

    ```

    ```


    Then, we need to install the required packages:


    ```

    ```bash

    cd iLEAPP

    pip install -r requirements.txt

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Now that everything is set, we can run iLEAPP. In this example, we''re providing
    a ZIP archive as the input file and we''re exporting the report to the output
    folder:


    ```

    ```bash

    python3 ileapp.py -t zip -i ../iphone_dump.zip -o output

    ```

    ```


    As you can see, we''re using the `-t` option to specify what kind of input is
    provided, the `-i` option to specify the path to the input file, and the `-o`
    option to specify the path to the output folder.


    Once iLEAPP is done processing, the results will be combined into an HTML report:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_108_0.png)


    Figure 3.21 – The report generated by iLEAPP


    The report will include all sorts of artifacts and useful evidence, including
    **accounts data, cellular data, locations, application data, device usage data,
    contacts, messaging**, and much, much more!


    This open source software is such a powerful tool that I absolutely recommend
    you play around with it to understand its full potential.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Summary


    In this chapter, we learned what the most popular commercial forensic tools are
    and the importance of validating results by using multiple tools, comparing their
    outputs, and running validation tests before starting the examination.


    Keep in mind that although these tools are extremely useful and make the investigator''s
    job a lot easier, the tool itself is not the evidence. The report is not the evidence
    either. The evidence is the evidence, and it''s the examiner''s job to understand
    how that evidence was created, what it represents, and what insights can be gained
    from the analysis of that evidence. Forensic software definitely has a place,
    but it should not substitute manually examining the artifacts. In other words,
    use these tools but don''t blindly trust them, and make sure you understand what
    is happening behind the scenes.


    Further on in the chapter, we concentrated on two of these tools, Cellebrite Physical
    Analyzer and Magnet AXIOM. We learned how to import data into these tools and
    how to use the software''s features – such as the AppGenie or the Connections
    explorer – to dig deeper into the data and gain useful insights.


    Finally, in the last part of this chapter, we discovered some useful open source
    scripts and used iLEAPP to extract and analyze artifacts from a full filesystem
    extraction.


    In the next chapter, we will discuss the iOS filesystem and we''ll learn where
    to find core iOS artifacts.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Chapter 4: Working with Common iOS Artifacts


    In previous chapters, we discussed in broad terms how the iOS operating system
    works and the different phases of the mobile examination workflow. Then, we learned
    all about different acquisition methods and how to extract the richest amount
    of data from a device. In the third chapter, we looked at forensic tools and continued
    our examination process by loading the data into the tool for analysis.


    One of the most critical aspects of a mobile forensics investigation is validating
    your findings. We''ve already discussed the importance of tool validation in earlier
    chapters, but the process should be extended to ensure the integrity of the data
    collected and to understand and explain the context of the data, as this is essential
    for presenting it as evidence in court. This usually entails following the source
    file and manually viewing the artifacts in their native format.


    In this chapter, we first look at the most common types of artifacts found on
    an iOS device and how you can view them in their native format. Then, we will
    dive deep into SQLite databases to learn how they manage data storage internally
    and what options we have to recover deleted records. Finally, we''ll take a closer
    look at the filesystem to understand where system artifacts are located, what
    insights we can gain by analyzing this data, and where application-specific artifacts
    can be found.


    In this chapter, we will cover the following topics:


    +   - Understanding the importance of validation

    +   - Working with iOS artifacts

    +   - Locating common artifacts'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Understanding the importance of validation


    In Chapter 3, Using Forensic Tools, we learned about some of the features of software
    such as Cellebrite Physical Analyzer and Magnet AXIOM, and gained a better understanding
    of what data we can expect to see analyzed by these tools.


    You may be wondering why an examiner would invest time in learning how to manually
    analyze data found on a device when these tools do all the hard work for you.
    Well, for starters, while this software is an essential item in the investigator''s
    toolbox, the investigator should also understand the limitations of these tools
    and how to deal with artifacts that are not automatically parsed; while forensic
    tools claim to support a variety of different apps and artifacts, this does not
    mean that the products can actually parse all of the data that pertains to a specific
    application that is being examined. With the rate at which mobile apps are updated,
    it is quite common for a forensic tool to not support a recently updated application
    or, in some cases, only partially support it by providing some but not all of
    the available data. In such situations, the investigator must resort to manually
    examining the source file in its native format.


    Another reason an investigator might want to look at the source file of an artifact
    is to validate their findings; even if a forensic tool has produced an appreciable
    output, it is important to cross-reference the data to the source files to understand
    the context of that data. For example, by analyzing the tables in an SQLite database,
    the investigator can understand not only what data is stored but also how that
    data is stored on the device, and how the operating system logs a particular event,
    such as an incoming phone call, text message, or notification.


    If some key artifacts are found during the examination process that are fundamental
    to the overall investigation, the examiner should be prepared to answer questions
    such as the following:'
  merge: -1
  img_proc: true
- pgno: 112
  md: '+   - How did that data get there?

    +   - What does that data tell us when we put it in context?

    +   - Was that artifact the result of user activity or was it generated by the
    operating system?

    +   - How did it interact with other data found on the device?


    The answer to these questions can often lie in the source file of the artifact,
    so learning how to manually analyze such files is a must for the person responsible
    for the examination process of an iOS device.


    The importance of **validation** cannot be stressed enough; using a validated
    methodology to examine a device, making sure tools are working correctly by validating
    their output, and validating your findings by diving deep into the source files
    to understand the context of the data can have a huge impact on the final outcome
    of an investigation. In some cases, this can be the difference between someone
    losing their job or not, or, in extreme cases, the difference between them going
    to jail or not.


    Before we discuss where common artifacts are located on an iOS device, in the
    next section we will learn how to manually work with the most common file types
    you''ll encounter in a typical examination.


    # Working with iOS artifacts


    Generally speaking, the artifacts that can be found on an iOS device can be grouped
    into one of the following categories:


    +   - SQLite databases

    +   - Property lists

    +   - Protocol buffers

    +   - XML files

    +   - Log files'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'While the last two files don''t pose any kind of concern as they are essentially
    text files and, as such, can be viewed with pretty much any text editor, the others
    may be (and often are) stored in **binary format**, so they require specific tools
    or libraries to parse through the data.


    # Introducing SQLite


    Almost every application on an iOS device, including system ones like **Messages**,
    **Contacts**, or **Email**, needs a place to store data for the long term. This
    is achieved by using **SQLite**, which is an open source, small, self-contained
    relational database. SQLite databases can be recognized by the `.sqlite` or `.sqlite3`
    file extensions, although some databases are given the `.db` extension, or other
    extensions as well.


    The reason why SQLite is so popular among mobile devices is due to its simple
    architecture and great performance. The following are some of its features:


    +   - **SQLite is self-contained:** The entire database is contained within a
    single file that integrates directly with applications. Its serverless architecture
    means that the database works as a standalone file, as opposed to the traditional
    client-server protocol.

    +   - **SQLite is cross-platform:** The database resides in a single, cross-platform
    file that can be accessed by all operating systems supported by SQLite, including
    Windows, macOS, Linux, Android, iOS, BSD, Solaris, and so on.

    +   - **SQLite is fully ACID-compliant:** This allows safe access to multiple
    applications or threads. It also supports most of the SQL query language, which
    is the main means of interacting with nearly all modern relational database systems.


    Now that we''ve seen SQLite''s features, let''s take a look at how it stores data.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Tables, columns, and rows


    The basic concepts of an SQLite database should be easy to visualize – a database
    contains one or more **tables**, which each contain data that is organized into
    **columns** and **rows**. A column represents a single data element, such as a
    *phone number* or *address*, while a row represents a set of values, one for each
    column.


    SQLite supports five different data types:


    +   - INTEGER

    +   - TEXT

    +   - REAL

    +   - BLOB

    +   - NULL


    The first three types are self-explanatory. The **Binary Large Object (BLOB)**
    data type preserves any input exactly as is, without casting it as a certain type;
    BLOB data types are commonly used to store complex binary data structures such
    as **property lists** or **protocol buffers** in an SQLite record. The NULL data
    type simply stores an empty value.


    To retrieve data from a database, you run a **query**, which is a set of logical
    instructions written in **SQL language** that parses through a given table to
    extract the data you want. The result of the query is actually represented as
    another table, as you can see in the following screenshot.


    To understand what a query looks like, let''s see a simple example. The following
    query extracts the last five messages from the sms.db database:


    ```

    SELECT ROWID, text FROM message

    ORDER BY ROWID DESC

    LIMIT 5;

    ```


    The output can be seen in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 115
  md: '![](img/0b17a17d4cb56b1c25763a396dd83117_115_0.png)


    Figure 4.1 – The result of a query displayed in DB Browser for SQLite


    Without going into too much detail, we will focus on this query for a moment to
    understand the basics of SQL language. Obviously, if you''re doing a forensic
    examination of an SQLite database, you do not want to modify the data in any way.
    Therefore, all queries will probably start with the SELECT clause, which indicates
    that we want to read data from a table.


    On the first line, we select which columns to include in the result (ROWID and
    text) and the name of the table – in this case, the message table. The second
    line of the query indicates the order in which the results should be displayed.
    In the example table, each SMS message is identified by a progressive ROWID column,
    so to display the most recent messages, we''re ordering the results in descending
    order based on this column. As we''re only interested in five messages, we use
    the LIMIT command to indicate how many rows should be displayed.


    # Tip


    If you''re new to SQL language, you can learn how to write the most common types
    of queries by visiting the SQLite website at'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'https://www.sqlite.org/lang.html.


    As a forensic examiner, the queries you run usually entail filtering and searching
    through the data, so you may want to look into commands such as CASE, WHEN, and
    WHERE. We''ll see more complex queries over the course of the chapter.


    # Running SQL queries


    Most forensic tools come with a built-in database viewer that allows the investigator
    to view the entire database and run queries directly within the tool itself; there
    are, however, other options:


    +   - **The SQLite command-line utility**, which can be downloaded from http://www.sqlite.org,
    allows direct interaction with the database from the command line.

    +   - Other free tools, such as **DB Browser for SQLite**, allow the user to view
    the database through a **Graphical User Interface (GUI)** and run queries on it.
    DB Browser for SQLite can be downloaded from https://sqlitebrowser.org.


    The investigator should be familiar with the tools used to access the database
    directly, as these will prove to be huge timesavers when the scope of the examination
    is limited to one or more SQLite databases. Analyzing these databases with forensic
    tools such as Cellebrite Physical Analyzer or Magnet AXIOM results in the need
    to load and parse the entire extraction into memory; this can be very time-consuming,
    depending on the size of the data extracted.


    # Using the SQLite command-line tool


    sqlite3 is a command-line utility that is part of the SQLite library. macOS and
    most Linux distributions have it already installed, while Windows users can download
    the executable from SQLite''s website, which is listed in the preceding section.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'To open an SQLite database from the command line, just type the following:


    ```

    sqlite3 filename.db

    ```


    If a database with the specified name doesn''t exist, SQLite will create it for
    you. Once you''ve opened a database, a SQL prompt will be displayed, where you
    can run queries and commands. There are a number of built-in commands you can
    issue to obtain basic information on the database and its tables.


    If you''re not familiar with the database layout, you can list all the tables
    in it by running the .tables command:


    ```

    sqlite> .tables

    attachment                 message

    chat                       message_attachment_join

    chat_handle_join           message_processing_task

    chat_message_join          sync_deleted_attachments

    deleted_messages           sync_deleted_chats

    ```


    If you''re interested in a specific table, type .schema followed by the name of
    the table to display the columns and data types of the table:


    ```

    sqlite> .schema handle

    CREATE TABLE handle (ROWID INTEGER PRIMARY KEY AUTOINCREMENT UNIQUE, id TEXT NOT
    NULL, country TEXT, service TEXT NOT NULL);

    ```


    By looking at the column names and types, you should be able to get a basic understanding
    of what data is stored in the table. In this example, every row in the handle
    table has an auto-incrementing ROWID column and three columns of TEXT type: id,
    country, and service.


    If you want to retrieve data from the table, you use a SELECT query:


    ```

    SELECT * FROM handle;

    ```'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'When you are finished, type `.exit` or `.quit` to terminate the SQLite session.


    # # Pages, vacuuming, and write-ahead logs


    One of the features of SQLite that makes it so interesting to forensic examiners
    is the possibility of recovering **deleted records** from a database. Depending
    on the scope of the database, this could mean recovering deleted text messages,
    browser history, or logs relating to device activity. To have a better understanding
    of how data recovery is possible, we need to take a step back and learn how SQLite
    manages `write` and `delete` operations under the hood.


    We''ve already learned that, from a logical point of view, the data in a database
    is organized into tables that each contain columns and rows. This is a high-level
    abstraction layer that allows users to interact with a database with a simple
    data model that is easy to visualize, such as columns and rows; however, at a
    lower level, the SQLite library actually organizes data differently on the filesystem,
    storing data into **pages**. Pages are similar to blocks in a filesystem, and
    their purpose is to store data in binary format. Each page in an SQLite database
    can have a variable size, with the default size being 4096 bytes, and each page
    has a distinct number. The first page contains a 100-byte header, which can be
    analyzed by using a **hex viewer**, such as the hexdump command-line utility available
    on macOS and Linux.


    For example, to view the header from an SQLite database called `sms.db`, we would
    execute the following command:


    ```

    ```bash

    hexdump -n 100 -C sms.db

    ```

    ```


    The `-n` argument specifies the number of bytes that should be displayed. As SQLite
    has a fixed-size header, we''re only interested in the first 100 bytes. The `-C`
    argument tells the hexdump utility to also display data in string format:'
  merge: -1
  img_proc: true
- pgno: 119
  md: '```

    00000000  53 51 4c 69 74 65 20 66  6f 72 6d 61 74 20 33 00  |SQLite format 3.|

    00000010  10 00 02 02 00 40 20 20  00 00 00 13 00 00 00 43  |.....@ ......C|

    00000020  00 00 00 00 00 00 00 00  00 00 00 50 00 00 00 04  |..........P...|

    00000030  00 00 00 00 00 00 00 00  00 00 00 01 00 00 00 00  |..............|

    00000040  00 00 00 00 00 00 00 00  00 00 00 00 00 00 00 00  |..............|

    00000050  00 00 00 00 00 00 00 00  00 00 00 00 00 00 00 13  |..............|

    00000060  00 2e 24 80                                         |..$.|

    00000064

    ```


    Figure 4.2 – The output from the hexdump command


    As you can see, the first 16 bytes contain the SQLite 3 format string. You can
    parse the rest of the header by using the following table as a reference:


    | Offset | Size | Description |

    |---|---|---|

    | 0 | 16 | The header string: "SQLite format 3\000" |

    | 16 | 2 | The database page size in bytes. |

    | 18 | 1 | File format write version. 1 for legacy; 2 for WAL. |

    | 19 | 1 | File format read version. 1 for legacy; 2 for WAL. |

    | 20 | 1 | Bytes of unused "reserved" space at the end of each page. Usually 0.
    |

    | 21 | 1 | Maximum embedded payload fraction. Must be 64. |

    | 22 | 1 | Minimum embedded payload fraction. Must be 32. |

    | 23 | 1 | Leaf payload fraction. Must be 32. |

    | 24 | 4 | File change counter. |

    | 28 | 4 | Size of the database file in pages. The "in-header database size".
    |

    | 32 | 4 | Page number of the first freelist trunk page. |

    | 36 | 4 | Total number of freelist pages. |

    | 40 | 4 | The schema cookie. |

    | 44 | 4 | The schema format number. Supported schema formats are 1, 2, 3, and
    4. |

    | 48 | 4 | Default page cache size. |

    | 52 | 4 | The page number of the largest root b-tree page when in auto-vacuum
    or zero otherwise. |

    | 56 | 4 | The database text encoding. A value of 1 means UTF-8. A value of 2
    means UTF-16le. A value of 3 means UTF-16be. |

    | 60 | 4 | The "user version" as read and set by the user_version pragma. |

    | 64 | 4 | True (non-zero) for incremental-vacuum mode. False (zero) otherwise.
    |

    | 68 | 4 | The "Application ID" set by PRAGMA application_id. |

    | 72 | 20 | Reserved for expansion. Must be zero. |

    | 92 | 4 | The version-valid-for number. |

    | 96 | 4 | SQLITE_VERSION_NUMBER |


    Figure 4.3 – The SQLite database header reference


    To represent a table along with its data, SQLite organizes pages using a balanced
    tree (B-tree) data structure, which is a highly efficient way of storing data.
    Pages that actually contain data, also called active pages, are assigned to a
    node that serves the function of connecting pages to each other.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Active pages in the file are further divided into **cells**, which are segments
    of a page that contain the data for every row in the database. When new cells
    are added, SQLite will attempt to place them at the bottom of the page. The free
    space within the page before the first cell is called **unallocated space**. From
    a forensic viewpoint, unallocated space is of great interest, as it may be empty,
    but it may also contain previously deleted data or fragments of previously used
    pages.


    When data is removed from the database, the corresponding cell or page is not
    actually deleted but merely *marked* as deleted. Pages that have been marked for
    deletion are called **free pages**, and SQLite manages these by adding them to
    another data structure, the **free-list**. Deleting individual records from a
    database creates gaps in a page; these spaces are called **free blocks** and are
    tracked by SQLite by adding them to a linked list.


    As you can see from the previous table, the database header at offset 32 tells
    us the number of the first page in the free-list, while the total number of free
    pages can be read by looking at the value at offset 36. Every page in a database
    also has an 8 or 12-byte header, depending on the type of page. The following
    table illustrates the format of the page header:


    | Offset | Size | Description |

    |---:|---:|---|

    | 0 | 1 | The one-byte flag at offset 0 indicating the b-tree page type.\n\n-
    A value of 2 (0x02) means the page is an interior index b-tree page.\n- A value
    of 5 (0x05) means the page is an interior table b-tree page.\n- A value of 10
    (0x0a) means the page is a leaf index b-tree page.\n- A value of 13 (0x0d) means
    the page is a leaf table b-tree page. |

    | 1 | 2 | The two-byte integer at offset 1 gives the start of the first freeblock
    on the page, or is zero if there are no freeblocks. |

    | 3 | 2 | The two-byte integer at offset 3 gives the number of cells on the page.
    |

    | 5 | 2 | The two-byte integer at offset 5 designates the start of the cell content
    area. A zero value for this integer is interpreted as 65536. |

    | 7 | 1 | The one-byte integer at offset 7 gives the number of fragmented free
    bytes within the cell content area. |

    | 8 | 4 | The four-byte page number at offset 8 is the right-most pointer. This
    value appears in the header of interior b-tree pages only and is omitted from
    all other pages. |


    Figure 4.4 — The SQLite page header reference


    With all this information in mind, we could manually parse through the file with
    a hex viewer and look out for free pages that contain data that was'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'deleted from the database. Thankfully, there are tools that automate this task!


    # Vacuuming


    You can confirm the fact that SQLite retains deleted pages by checking that the
    database file size does not change when data is removed. As a result of this behavior,
    under normal circumstances, the file can only grow in size as new data is written
    to the database. Additionally, as new records are added and deleted from the database,
    the data can become fragmented because free pages will be scattered and mixed
    all across the file. This means that the actual parts of a database that hold
    a particular table will not be stored contiguously within the file, which affects
    performance.


    The following diagram illustrates what happens when data is written to and deleted
    from the database, resulting in a fragmented file:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_121_0.png)


    Figure 4.5 — Pages in a fragmented SQLite database


    The process of **vacuuming** an SQLite database solves these problems by reading
    the logical data from the database (tables, columns, and rows) and writing it
    to a temporary file, ignoring free pages. As a result of this process, the database
    file is rebuilt from scratch, active pages are repacked, and data within the file
    is defragmented. Once the process is complete, the'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'contents of the temporary file will be copied back into the original database,
    overwriting it.


    The following diagram shows the same database after running the VACUUM command;
    the records stored in the database are obviously unchanged, but now the active
    pages are stored contiguously and the free pages are not present:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_122_0.png)


    Figure 4.6 – Pages in an SQLite database after the vacuuming process


    It should be clear that recovering deleted records from a database is nearly impossible
    once the vacuuming process is complete. Research has shown that iOS periodically
    runs the VACUUM command for most SQLite databases. At the time of writing, however,
    it is not clear exactly when this happens, as it seems to depend heavily on the
    device model and iOS version.


    # Write-ahead logging


    Up to this point, we have focused on analyzing the main database file to understand
    how the data is stored in that file and where to look for deleted records. However,
    there are other files that are of interest from a forensic perspective that should
    not be overlooked, such as SQLite temporary files. The most common type of temporary
    file you will find on an iOS device is a journaling file called the Write-Ahead
    Log (WAL).'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'WAL files can be easily identified by their filename, since the -wal string
    is appended to the name of the database. So, for example, if we are working on
    an SQLite database called sms.db, the WAL file will be called sms.db-wal, and
    it will be created in the same directory as the main database file. These temporary
    files will not always be present, as only databases that have their journaling
    mode set to WAL will use the write-ahead log method.


    From the research that has been carried out, it''s safe to say that most databases
    on an iOS device have WAL mode enabled. If this is the case, when data is added,
    modified, or deleted, the transaction is stored in the WAL file rather than directly
    in the main SQLite database. Similarly, when reading data from the database, the
    SQLite engine determines where the most recent version of a particular record
    is stored and reads it from the appropriate file:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_123_0.png)


    Figure 4.7 – New records added to the database are appended to the WAL file


    There are many reasons why an application would want to enable WAL mode in its
    database. The most important reason is performance; pages are written to the WAL
    file in sequential order, and every change to the database results in a single
    disk write. Additionally, because of the separate files, an application using
    multiple threads will be able to read from the database while writing to it.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'At some point in time, the data in the WAL file will have to be transferred
    back into the main database. This process is called a **checkpoint**. Typically,
    SQLite automatically performs a checkpoint when the WAL file reaches a certain
    size (by default, this is 1,000 pages) or when the last database connection is
    closed:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_124_0.png)


    Figure 4.8 – A checkpoint transfers data from the WAL file back into the main
    database


    # Tip


    It''s important to know that SQLite does an automatic checkpoint when all connections
    to the database have been closed cleanly. So, if you close a database with WAL
    enabled when using a tool like DB Viewer, the contents of the WAL file will be
    transferred to the main database and the WAL file will be removed.'
  merge: -1
  img_proc: true
