- pgno: 11
  md: '# Chapter 1: Introducing iOS Forensics


    Over the past decade, smartphones have undergone a profound revolution, impacting
    our lives in all possible ways: our devices are no longer just smart phones –
    they have become data hubs that store all kinds of information from our digital
    (and not so digital) life.


    Today, from the palm of our hand, we can surf the web, buy theater tickets, get
    food delivered to our door, or call an Uber. We''re using our devices to read
    eBooks, take notes, engage in creative tasks, and share our lives with our followers
    through social media. We have progressively replaced our digital cameras with
    our iPhone camera roll. Smartphones can keep track of physical activity, interact
    with external devices, give us directions, and remind us of that important meeting
    that we might forget. We use productivity apps to get stuff done and we make payments
    using Apple Pay. And – of course – we use our iPhones to get in touch with people
    on the other side of the world. With the massive spread of iPads and tablets in
    general, our devices are no longer just communication devices. They have become
    an almost unlimited content platform where we can enjoy movies, TV series, or
    simply listen to our favorite music.


    To be able to provide these amazing features, mobile devices collect huge amounts
    of data that is processed by iOS and sometimes synced to iCloud. This information
    documents and reveals the thoughts and activity of a user substantially more than
    any data stored in any desktop computer.


    Mobile forensics is all about collecting this data, preserving it, assessing it,
    validating it, and extracting meaningful insights that can be presented as evidence.


    In this chapter, we will cover the following topics:


    +   Understanding mobile forensics'
  merge: -1
  img_proc: true
- pgno: 12
  md: '+   - Dissecting the iOS operating system

    +   - Understanding iOS security

    +   - Establishing a workflow


    # Understanding mobile forensics


    Apple devices are popular all over the world due to the user experience they provide,
    their magnificent design, and their revolutionary features, so it shouldn''t come
    as a surprise that in 2016, Apple announced that over one billion iPhones had
    been sold. Over the past 5 years, mobile device usage has grown particularly fast,
    with data from 2021 indicating that there were one billion *active* iOS devices.


    The information that''s stored on a smartphone can help address crucial questions
    in an investigation, revealing whom an individual has been in contact with, where
    they have been, and what they''ve been doing with the device. As new features
    are added to the device and more apps are made available through the App Store,
    the amount of information that''s stored on iOS devices is continuously growing.


    Mobile forensics can be defined as the process of recovering digital evidence
    from a mobile device under forensically sound conditions using validated means.


    The kind of evidence we can recover from a device depends on the device itself
    and what techniques are used for data extraction, but generally, smartphones contain
    personal information such as call history, messages, emails, photos, videos, memos,
    passwords, location data, and sensor data. No other computing device is as personal
    as a mobile phone.


    Typically, the examination process should reveal all digital evidence, including
    artifacts that may have been hidden, obscured, or deleted. Evidence is gained
    by applying established scientifically based methods and should describe the content
    and state of the data fully, including where it is located, the potential significance,
    and how different data sources relate to'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'each other. The forensic process begins by extracting a copy of the evidence
    from the mobile device. Once a copy is available, the next step involves analyzing
    the data, identifying evidence, and developing the contents of a final report.


    # The new golden age for iOS forensics


    Over the past 3 years, the digital forensics industry has undergone a major revolution.


    In 2019, the discovery of the **checkm8** exploit for iOS devices was a complete
    game-changer as it opened new doors for digital forensics investigators, allowing
    full filesystem extractions of hundreds of millions of Apple devices. If you''ve
    never seen a full filesystem extraction before, you''ll probably be surprised
    by the extent and variety of data that the device stores!


    Checkm8 is based on an un-patchable hardware flaw that lives directly on the chips
    of iOS devices, ranging from devices running Apple''s A11 chip down to the A5
    generation. This includes devices from the iPhone 4S to iPhone X and several iPads.


    This vulnerability is specifically a BootROM exploit, which means it takes advantage
    of a security flaw in the initial code that iOS devices load during the boot process,
    and it can''t be overwritten or patched by Apple through a software update.


    At the end of 2019, **checkra1n** was released, the first public, closed source
    jailbreak based on the checkm8 exploit. Digital investigators and forensics analysts
    have quickly adopted checkra1n to get access to the device''s filesystem and keychain;
    however, as with all jailbreaks, this solution has several drawbacks as using
    a jailbreak inevitably modifies some data on the device''s filesystem and is not
    considered forensically sound.


    For these reasons, vendors such as Cellebrite, Elcomsoft, and Oxygen Forensic
    have developed proprietary solutions based on the original checkm8 exploit that
    work by patching the device''s RAM. These tools'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'allow investigators to perform full filesystem extractions without touching
    system and user partitions and without making any changes to the device as the
    exploit runs in memory.


    In other words, on selected devices, the checkm8 vulnerability can be exploited
    to extract the full filesystem *without* actually jailbreaking the device. The
    following table shows the list of devices that are vulnerable to the checkm8 exploit:


    | iPhone 4S | iPhone 5/5c/5s | iPhone 6/6s | iPhone SE |

    |---|---|---|---|

    | iPhone 7 | iPhone 8 | iPhone X | iPad 2nd–7th gen |

    | iPad Mini 2nd and 3rd | iPad Air 1st and 2nd | iPad Pro | Apple Watch 1st–3rd
    |


    Table 1.1 – Devices that are vulnerable to the checkm8 exploit


    To exploit checkm8 for a filesystem extraction, your device must be compatible,
    and it must be running a supported iOS version. This is a major drawback as newer
    devices, such as the latest iPhone 13, are not supported. There are, however,
    other options.


    In 2020, vendors such as Elcomsoft and Belkasoft introduced agent-based extraction,
    a new acquisition method that allows full filesystem extractions without jailbreaking
    the device. Once installed on the device, the agent escapes the sandbox through
    software exploits, gaining unrestricted access to the device and establishing
    a connection between the device and the computer. Agent-based extraction is forensically
    safe, and it is usually a lot faster and safer than most jailbreaks. At the time
    of writing, supported devices include all iPhones from the 5S up to the iPhone
    12, running iOS versions 9.0 to 14.3.


    In May 2020, a major update for the **unc0ver** jailbreak was released, adding
    support for devices based on A12-A13 chips. At the time of writing, unc0ver supports
    jailbreaking all devices from the iPhone 5s up to the iPhone 12. Supported iOS
    versions range from iOS 11 to iOS 14.3.


    Although jailbreaking a device allows full filesystem extraction, it''s not considered
    a forensically sound process. An investigator should consider'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'safer options such as checkm8 or agent-based extractions first if they''re
    supported.


    Tip


    It''s important to note the difference between checkm8-based extractions and jailbreaking
    the device through checkra1n or unc0ver. Tools such as **Cellebrite UFED** and
    **Elcomsoft iOS Forensics Toolkit** leverage the checkm8 exploit to temporarily
    provide access to the entire filesystem by running the exploit in the device''s
    RAM. When the extraction is complete, the device will reboot as normal. No permanent
    changes will be made to the device.


    On the other hand, jailbreaking the device will leave permanent traces and will
    also require installing third-party packages such as Cydia or AFC2, making additional
    changes to the device.


    # Challenges in iOS forensics


    Smartphones are considered live, dynamic systems, and for this reason, they pose
    several challenges from a forensic perspective because data and files are constantly
    changing.


    One of the main complications that a digital investigator may face is dealing
    with a locked device: recent iOS updates make passcode cracking almost impossible
    and other options will have to be considered to extract as much data as possible.


    The growing number of devices and the variety of the software they run makes it
    extremely difficult to develop a single tool and a consistent workflow to address
    all eventualities. This is usually because a particular method that''s used to
    extract data from one device will stop working when a new version of iOS is released;
    in fact, forensic extraction tools usually rely on security vulnerabilities to
    gain access to the device''s filesystem and extract a lot more data than what
    you would normally find in an iTunes backup, or even to unlock a device when the
    passcode is unknown. When a'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'new iOS update is released, these vulnerabilities could potentially be patched,
    thus rendering the tools useless.


    The modern investigator will have to take these issues into account when approaching
    an Apple device and decide, on a case-by-case basis, what the best technique will
    be to obtain the broadest amount of valuable evidence.


    # Dissecting the iOS operating system


    Performing a forensic examination of digital evidence from a mobile device requires
    not only a full understanding of the data but also basic knowledge of how the
    device itself works and how that data was generated. This is particularly challenging
    on iOS devices due to the closed source nature of the platform, which makes it
    difficult to understand how exactly iOS interfaces with all this data and what''s
    going on behind the scenes on the device.


    Apple invests heavily in restricting the operating system and application software
    that can run on their hardware through several security features: applications
    running on Apple devices don''t interact directly with the underlying hardware
    – they do so through a system interface. The iOS can be defined as an intermediary
    between the device''s hardware components and the applications on the device.


    Tip


    Many publications provide information regarding iOS hardware. For a full list
    of iPhone components and devices, you can refer to the Apple Support page: https://support.apple.com/specs/iphone.


    # Understanding the iOS filesystem


    Since iOS 10, Apple File System (APFS) has replaced HFS+ as the default filesystem.
    APFS is a proprietary filesystem that has been designed with'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'mobile devices in mind: it''s optimized for SSD storage and supports strong
    encryption. On iOS devices, the filesystem is configured into two logical disk
    partitions – the system partition and the user partition:


    +   - The system partition contains the iOS operating system and all the preloaded
    applications that come with the device but contain little evidentiary information.
    The system partition is only updated when a firmware upgrade is performed on the
    device.

    +   - The user partition, which is mounted to the /private/var directory, contains
    all user-created data and provides most of the evidentiary information that''s
    pertinent to investigators.


    # Where is data stored on the iOS filesystem?


    One of the examples of how iOS manages communication between applications and
    hardware is sandboxing, which enables users to interact with an application without
    accessing the filesystem directly, ensuring that each app is *contained* within
    one or more specified containers that are automatically created when a new app
    is installed on the device. This organization makes things a lot easier for investigators
    as all the files related to a specific app are grouped in specific locations.


    Each container has a specific role:


    +   - The bundle container contains the application itself, including all the
    assets that come with the application when it is downloaded from the App Store.

    +   - The data container holds data for both the application and the user and
    is further divided into several directories that the application can use to organize
    its data.

    +   - The group container is where applications can store data that can be shared
    with other apps of the same group.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'The following diagram shows the containers for each application:


    ![](img/0b17a17d4cb56b1c25763a396dd83117_18_0.png)


    Figure 1.1 – A representation of application containers


    The data container contains several different folders:


    +   - Documents/: This folder contains user-created files and is automatically
    included in iTunes backups and iCloud backups.

    +   - Library/: This folder is used by the application to store app-related data
    and is not created by the user. This folder is included in iTunes and iCloud backups.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '+   - Temp/: Contains application-related temporary files and is not included
    in backups.


    As you can see, all application files are perfectly organized into their respective
    data containers. However, you may be wondering where exactly these containers
    are stored on the device''s filesystem. Each application on a device is identified
    through a **globally unique identifier (GUID)**, also known as a BundleID identifier.
    This identifier is uniquely generated when an application is first installed and
    can change if the app is updated or reinstalled.


    Application bundle containers are stored at the following path on the iOS filesystem:


    ```

    `/private/var/containers/Bundle/Application/<app-GUID>/`

    ```


    Application data containers are stored at the following path:


    ```

    `/private/var/mobile/Containers/Data/Application/<app-GUID>/`

    ```


    Group containers are stored at the following path:


    ```

    `/private/var/mobile/Containers/Shared/AppGroup/<app-GUID>/`

    ```


    # Tip


    In this section, we''ve seen where applications store data on the iOS filesystem.
    But what about system artifacts? System-related data is stored all over the filesystem,
    so we won''t find everything all in one place! We''ll dive deep into system artifacts
    and where to find them in _Chapter 4, Working with Common iOS Artifacts_.


    # How is data stored on the iOS filesystem?'
  merge: -1
  img_proc: true
- pgno: 20
  md: "So far, we've learned how iOS organizes application data into containers and\
    \ where these containers are stored on the filesystem. Now, let's discuss the\
    \ types of files that commonly contain useful evidence within the iOS filesystem.\n\
    \nOther than user-generated content (such as documents, photos, videos, or text\
    \ files), data stored on an iOS device usually consists of the following items:\n\
    \n+   - **SQLite databases**: SQLite is a standalone, self-contained database\
    \ that can store just about any kind of data, including binary BLOBs, all in one\
    \ file. SQLite databases are the primary source of storage for applications and\
    \ system data, so parsing these databases will be one of the focus points of most\
    \ digital investigations. Databases can also be extremely useful if you wish to\
    \ attempt to recover deleted data, as deleted records usually leave a digital\
    \ trace in the database itself or its temporary files. Essential artifacts such\
    \ as SMS messages, WhatsApp conversations, contacts, call logs, notes, and browser\
    \ history are all stored in SQLite databases.\n+   - **Property List Files (Plists)**:\
    \ Plists are structured files that are used by iOS and applications to store,\
    \ organize, and access data on the device. These can be stored in XML format or\
    \ binary format. Typically, plists are used to store application settings or user\
    \ preferences.\n+   - **Other file types**: This includes log files, XML files,\
    \ Protocol Buffers, and Realm databases. These file types will be covered in depth\
    \ later in this book.\n\nThis is what a property list looks like in XML format:\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<!DOCTYPE\
    \ plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\"\n\"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\
    >\n<plist version=\"1.0\">\n    <dict>\n        <key>UUID</key>\n        <string>3bdd52c7-ee36-4689-8517-c5fed2c98s5</string>\n\
    \        <key>ClientID</key>\n```"
  merge: -1
  img_proc: true
