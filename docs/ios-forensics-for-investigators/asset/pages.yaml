- pgno: 79
  md: 'In this chapter, we learned the differences between acquisition methods and
    what kind of data we can expect to find in an iOS extraction. We learned how the
    Checkm8 exploit works, how this vulnerability can be used to gain access to a
    device''s filesystem, and its limits. Then, we discussed agent-based acquisitions
    and learned what iOS versions support this acquisition.


    Jailbreaks are a fascinating topic in the iOS world; we discussed two of the most
    popular ones, checkra1n and unc0ver, and their compatibility. Then, we learned
    how to jailbreak a device using checkra1n.


    Finally, we learned how to perform a logical acquisition using Cellebrite UFED
    and Elcomsoft iOS Forensic Toolkit, and we approached two different options to
    perform a full filesystem acquisition.


    Keep in mind that in this chapter, we focused on **After First Unlock (AFU)**
    acquisition methods, so it''s imperative that the examiner has full access to
    the device. Over the course of the next chapters, we will look into **Before First
    Unlock (BFU)** acquisition methods to understand what kind of artifacts we can
    find in locked devices.


    In the next chapter, we will discuss forensic tools, which ones are most popular,
    and how to use these to analyze extracted data.'
  merge: -1
  img_proc: true
- pgno: 80
