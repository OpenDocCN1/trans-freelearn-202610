  md: '# What is AppGenie?


    AppGenie is a research tool that tries to automatically identify specific artifact
    types from device databases. The AppGenie analyzes databases based on past decoding
    support, heuristics and can provide additional app data such as Contacts, User
    accounts and Chats.


    As a research tool, the suggested results do not replace native PA decoding and
    should be used as preliminary/triage results for manual review, because it may
    include false-positives and partial results. It''s recommended to review results
    before including them in your reports.


