- pgno: 202
  md: 'Figure 7.5 – The com.apple.wifi.plist showing details of known networks


    Now that we know how to analyze the basic networking data on the device, let''s
    take a closer look at network usage artifacts.


    # Analyzing network usage


    Dissecting which services or applications are using the network can help the investigator
    identify any abnormal processes, such as **malware** running on the device.


    Data usage on iOS devices is stored in two different files:


    +   The `CurrentPowerLog.PLSQL` database, which can be found in `/private/var/containers/Shared/SystemGroup/<GUID>/Library/BatteryLife/`,
    contains several tables of interest. By correlating the data from different tables,
    the examiner can extract precise data usage for each process, both from the **Wi-Fi
    interface** and the **WAN interface**. The caveat here is that this database only
    stores process data for approximately 24 hours.


    +   The `DataUsage.db` database, which can be found in `/private/var/wireless/Library/Databases/DataUsage.sqlite`,
    contains two significant tables – ZPROCESS and ZLIVEUSAGE. The first stores the
    app''s name, the app bundle, and the associated process, along with its timestamp;
    the second table stores the data that''s coming in and out of the WAN interface
    for each process. Although this database will generally store several weeks''
    worth of data, keep in mind that, from research that has been carried out, it
    seems that data coming in and out of the Wi-Fi interface is not logged.


    These databases can help the investigator determine not only which processes were
    using the network, but also whether a subject was using an application at a certain
    moment in time.


    Process and network usage data can be extracted from the `DataUsage.db` database
    by running the following query:'
  merge: -1
  img_proc: true
- pgno: 203
  md: "```\nSELECT\n    DATETIME(ZPROCESS.ZTIMESTAMP+ 978307200,\n'UNIXEPOCH') AS\
    \ \"PROCESS TIMESTAMP\",\n    ZPROCESS.ZPROCNAME AS \"PROCESS NAME\",\n    ZPROCESS.ZBUNDLENAME\
    \ AS \"BUNDLE ID\",\n    ZLIVEUSAGE.ZWWANIN AS \"WWAN IN\",\n    ZLIVEUSAGE.ZWWANOUT\
    \ AS \"WWAN OUT\"\nFROM ZLIVEUSAGE\nLEFT JOIN ZPROCESS ON ZLIVEUSAGE.ZHASPROCESS\
    \ =\nZPROCESS.Z_PK;\n```\n\nThe following screenshot shows the output; it includes\
    \ some valuable data for the investigator, especially if application usage is\
    \ of interest in an investigation:\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_203_0.png)\n\
    \nFigure 7.6 – The query results showing the processes running on the device and\
    \ their data usage\n\nIn the next section, we'll introduce Bluetooth forensics.\n\
    \n# Introducing Bluetooth forensics\n\nUsing Bluetooth technology, users can transfer\
    \ data between different devices and attach headphones, speakers, or any kind\
    \ of wireless device to their smartphone. Typically, iOS devices operate as Class\
    \ 2 Bluetooth devices, which means they can operate at a range of approximately\
    \ 10 meters (33 feet)."
  merge: -1
  img_proc: true
- pgno: 204
  md: 'From a forensic viewpoint, iOS devices maintain the following:


    +   - A list of *low-energy* Bluetooth devices that can connect to the user''s
    device, also called **paired devices**. These are stored in the `/private/var/containers/Shared/SystemGroup/<GUID>/Library/Database/com.apple.MobileBluetooth.ledevices.paired.db`
    database, under the `PairedDevices` table. This table maintains a list of devices,
    their names, their **Media Access Control (MAC)** addresses, and their last-seen
    timestamps.

    +   - Other Bluetooth paired devices (*not just low-energy*), which are stored
    in the `/private/var/containers/Shared/SystemGroup/<GUID>/Library/Preferences/com.apple.MobileBluetooth.devices.plist`
    file. This property list maintains a list of device names and last-detection times.

    +   - A list of *seen* Bluetooth devices, which are other available Bluetooth-enabled
    devices that were close to the device but that did not connect. These devices
    can be found in the `/private/var/containers/Shared/SystemGroup/<GUID>/Library/Database/com.apple.MobileBluetooth.ledevices.other.db`
    database, under the `OtherDevices` table.

    +   - A detailed log of Bluetooth-related events, such as **connection** and **disconnection**
    events. These are stored in the `knowledgeC.db` database.


    As the first three files are trivial to query, we''ll concentrate on extracting
    Bluetooth events from the `/private/var/mobile/Library/CoreDuet/Knowledge/knowledgeC.db`
    database, which we introduced in *Chapter 5, Pattern-of-Life Forensics.*


    First, we must select the start and end dates for the events from the `ZOBJECT`
    table. Then, we must filter down the results by searching for the `/bluetooth/isConnected`
    stream. We must extract the event status and device details from the `ZSTRUCTUREDMETADATA`
    table. Finally, we must order the results chronologically.


    The final query looks like this:'
  merge: -1
  img_proc: true
- pgno: 205
  md: "```\nSELECT\nDATETIME(ZOBJECT.ZSTARTDATE + 978307200, 'unixepoch',\n'localtime')\
    \ AS \"Start\",\nDATETIME(ZOBJECT.ZENDDATE + 978307200, 'unixepoch',\n'localtime')\
    \ AS \"End\",\nCASE\n    WHEN ZOBJECT.ZVALUEINTEGER = 0 THEN \"Disconnected\"\n\
    \    WHEN ZOBJECT.ZVALUEINTEGER = 1 THEN \"Connected\"\nEND AS \"Status\",\nZSTRUCTUREDMETADATA.Z_DKBLUETOOTHMETADATAKEY__ADDRESS\
    \ AS \"Address\",\nZSTRUCTUREDMETADATA.Z_DKBLUETOOTHMETADATAKEY__NAME AS \"Device\"\
    \nFROM ZSTRUCTUREDMETADATA\nLEFT JOIN ZOBJECT ON ZSTRUCTUREDMETADATA.Z_PK =\n\
    ZOBJECT.ZSTRUCTUREDMETADATA\nWHERE ZOBJECT.ZSTREAMNAME = \"/bluetooth/isConnected\"\
    \nORDER BY \"Start\" ASC;\n```\n\nOnce the query completes, the investigator can\
    \ retrieve the list of events that were logged every time the device connected\
    \ or disconnected from a Bluetooth-enabled device, along with the device's MAC\
    \ address; the results are shown in the following screenshot:\n\n![](img/0b17a17d4cb56b1c25763a396dd83117_205_0.png)\n\
    \nFigure 7.7 – The query displaying Bluetooth connection events\n\nBluetooth artifacts\
    \ can be an essential part of an investigation. By leveraging data about paired\
    \ or seen devices, the investigator can assess not only whether the device was\
    \ in use and connected to a certain device, but"
  merge: -1
  img_proc: true
- pgno: 206
  md: 'also put the owner in an approximate location at a point in time, if the location
    of the Bluetooth device is known. In the next section, we''ll introduce Safari
    forensics.


    # # Understanding Safari forensics


    Analyzing artifacts that have been left by internet browsing activity is typically
    a crucial aspect of mobile forensic investigations. Almost every activity a suspect
    performs while using a browser on a mobile device leaves a trace on the device
    itself, including, of course, searching for information and browsing through web
    pages.


    In this section, we''ll focus on the browser that is built into all iOS devices,
    **Safari**. Keep in mind that dozens of third-party browsers can be installed
    on a device, such as **Chrome**, **Firefox**, and **Opera**: it''s important to
    review these applications and analyze their artifacts as they could potentially
    contain important data. We''ll learn how to analyze third-party applications in
    _Chapter 10, Analyzing Third-Party Apps_.


    Browsing history is likely the most commonly recovered item, but other files should
    be reviewed too. Typically, the following data can be recovered by analyzing Safari
    artifacts:


    +   - Browsing history

    +   - Open/private tabs

    +   - Bookmarks/saved pages

    +   - Cookies

    +   - Cache files


    Most of Safari''s artifacts are stored in `/private/var/mobile/Library/Safari/`.
    Within this folder, you will find the following relevant files:'
  merge: -1
  img_proc: true
- pgno: 207
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 208
  md: '```

