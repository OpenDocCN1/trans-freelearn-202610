- pgno: 55
  md: '# # Adding Randomness and Probability


    In this chapter, we will introduce randomness and probability techniques that
    can be used to add randomness, chance, and character to AI, which would otherwise
    be perfect. We will start with a quick "Probability 101" to explain some basic
    concepts; then, we will demonstrate how to use Stream to control a non-uniform
    distribution of numbers and use these results to demonstrate probability. We will
    cover how these are used within Unreal Engine 4. Finally, we will build on top
    of our enemy AIController to have it randomly perform an action.


    This chapter will cover:


    +   - Probability, probability distribution, and non-uniform distribution

    +   - Using RandomStream in UE4 to add randomness to our AI

    +   - Adding random behavior to enemy AI-based states


    # ## Introducing probability


    We know an event will occur, but how often will it occur? This is how we can quantify
    probability, and this is what we will use to control the frequency of an outcome.
    So, let''s say we flip a quarter. The event we know will occur is heads (H), but
    it can still land on tails (T). So, the way we would write the probability of
    landing on heads is P (H) = ?'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'At this point, we know that heads will occur, although we still don''t know
    how often it will occur. To understand this, we must first get the number of possible
    outcomes that meet our conditions, which is 1 for heads. Then, we must get the
    number of events that are equally likely to occur, which is 2. So, now we need
    to put this in the equation for probability:


    ```

    # of possible met conditions / # of equality likely outcomes

    ```


    If we do some basic math and break it down further, we will have 50%:


    ```

    P (H) = 1/2 = 50%

    ```


    So what this says is, if you flipped a coin a million or even a billion times,
    the more the number of times you flip it, the closer it will get to 50% of the
    events landing equally on heads and on tails. This is useful when controlling
    the chance that a function will execute.


    In our example, we will demonstrate a lottery-type probability. We determined
    that we have a 20% chance of getting gold, which translates to a decimal of .2.
    We will generate a random number from 0 through 1. We get .19, and we''re in the
    money! We roll again, and we get .57, we''re out of money!


    These are some ways to control the execution flow of your AI. You could also apply
    this to other behaviors that are directly linked to the traits of the specific
    AI. So, if this character is of a certain class, certain monsters may be more
    frightened by this class of characters.


    # Probabilistic distribution


    A probabilistic distribution of numbers means that we will know the finite numbers
    of equal outcomes. So, we would use this if, for example, we had a monster with
    a lot of weapons. We don''t want all of the weapons to drop if the monster dies.
    Although, if we just applied a simple rule to limit the number of weapons dropped,
    there is still an equal chance that they could get the rare sword versus the crappy
    sword that no one wants.


    Say we applied probabilistic distribution to the selection of weapons. Here is
    the scenario. We have 50% items ranked crappy through okay and 35% items ranked
    well through best, ending with rare items at 15%. Now, we will generate a random
    number of weapons they can get, and the individual items selected will be generated
    with probabilistic distribution.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Non-uniform distribution


    A non-uniform distribution of numbers means that we will not know the finite number
    of outcomes. We know that 0 through 1 will be generated but not whether 0 or 1
    is more likely to be generated. With this said, this is perfect for creating many
    unpredictable scenarios. In UE4, we have the typical Random and RandomStream tool.
    The explicit difference between the two is the fact that we can control the seed
    that generates our random output.


    So, to say it another way, non-uniform distribution is a random generation of
    numbers that are not equally likely to occur. The true behavior of randomness
    can be replicated but at the cost of time and efficiency. So, we''ve come up with
    algorithms to generate random numbers. One of the tools that UE4 provides to generate
    random numbers is RandomStream.


    # RandomStream in Unreal Engine 4


    Say you want to freeze the randomly generated trees you''ve made. Typically, when
    using a random node from UE4''s artillery, this information will be lost once
    you exit the game. With RandomStream, you can actually save the seed that generated
    the random output and load the same random output by calling on this seed. So
    in UE4, you will find a blueprint node called Make RandomStream. This node has
    one input pin called Initial Seed.


    The reason we use a seed is because this is a pseudo random-number generator.
    This means that the numbers are calculated and are deterministic. Pseudo means
    that we will use algorithms to calculate the randomness; however, by calculating
    the randomness, we technically know what it will be beforehand, thus making it
    deterministic. The contrast is true randomness, which captures noise from a forest,
    waterfalls, the atmosphere, or even a TV channel. The reason this will be indefinitely
    more random is that the noise captured is unlikely to ever repeat, as with many
    things in life. With calculations, there is always a capacity because the task
    is to replicate the phenomenon at a fraction of the cost. Initially, when we created
    computers, memory was very important—it still is. But at this point, we created
    algorithms to replace the need for storing noise, but we would rather have a key
    or seed as we are more familiar with them. The reason for which it can be considered
    a key is that, by having it, two people on separate computers can generate identical
    random numbers.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Now technically, if we were to increase the length of the seed to something
    exponentially high, it would be practically infinitely random. You have to add
    this because we know that there is a definite end, while with life there is no
    finite end. So in UE4, randomizing the seed will directly affect the randomness
    of the numbers calculated. This is what I do to create practically unpredictable
    randomness.


    # The plan


    We will continue from where we left off in _Chapter 2, Creating Basic AI_, and
    continue to make changes to our two AIControllers. In the past chapter, we set
    up our Enemy to chase our Hero indefinitely. In this chapter, we will introduce
    another state to our Enemy AI, which will allow it to either run away from us
    or run toward us. This represents the Enemy attacking us or fleeing, depending
    on the shock probability when we encounter the Enemy.


    Let''s get started!


    # Adding Wander


    Here, we will define three states of AI. This will make it easier when specifying
    actions in different states. Now, the first state we will add is Wander. It will
    make the AI move randomly and indefinitely. This will be the initial state of
    the AI, and it will be capable of transitioning into other states once we approach
    the AI. The other two states are the two reactions that we give the AI. The idea
    is that when we approach the AI, there is a chance that it will flee or attack.
    The chance is the probability that we determined and created in the blueprint.


    # Setting up the project


    Let''s open Unreal Engine 4! Perform the following steps:


    +   1. First, we have to change our Enemy to act as a wandering frightened monster.
    So, double-click on the **Enemy** AIController. Now, navigate to **Event Graph**
    and zoom in.

    +   2. We want to create a new variable for **State** and make this **Integer**.

    +   3. Next, we have to change the **Find Hero** script. We will adapt this to
    detect the Hero. What we also want to keep is the chasing of the Hero blueprint.
    This will be used to chase or run from us scared, which is the inverse. So, focus
    on the script.'
  merge: -1
  img_proc: true
