    +   7. Right-click on **EventGraph** and search for **Get Controlled Pawn**.

    +   8. From the **Return Value** pin of **Get Controlled Pawn**, pull the **Get
    Actor Location** node.

    +   9. From the **Return Value** pin of **GetActorLocation**, pull a vector and
    then drop it in an empty area.

