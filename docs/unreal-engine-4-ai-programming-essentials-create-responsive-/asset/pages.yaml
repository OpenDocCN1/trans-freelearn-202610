    ![](img/aaaa027482c900e215ba6bfab3c17337_177_0.png)


    Now, with all these nodes here, you have a complete enemy AI, which you can now
    fight and take on for yourself! Congratulations on coming this far!


    # Summary


    This chapter contains everything necessary to get started with some impressive
    AI. We talked about Behavior Trees, which help create decisions for your AI based
    on situations it encounters. Then, we talked about creating a mid-range attack
    for you, the player, and the AI to use. We set up the controllers and began setting
    up the controllers for more functions. The last thing to do before getting everything
    running in Behavior Tree was to set up the waypoints for the AI to patrol. Finally,
    we integrated everything into Behavior Tree.


    You just learned how to create the basic form of game AI using the tools available
    within Unreal Engine 4.


    We are done! We have created some fun and challenging AI. Let''s now get ready
    for our next chapter. After learning all of this material on AI and Unreal Engine
    4 and how they mix together, it is important that we spend a chapter reviewing
    everything that has been talked about. I will also point out the things we could
    have done differently. Then, we will be that much closer to a new beginning in
    the world of game AI!'
  merge: -1
  img_proc: true
