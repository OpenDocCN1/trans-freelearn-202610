    ![](img/aaaa027482c900e215ba6bfab3c17337_125_0.png)


    10. Now, if the statement is **True**, we want to create a new **Branch** node
    to check whether our enemy is in the line of sight. Pulling from **Return Value**
    of the **getAiController** node, let''s create a new node called **Line Of Sight**.


    11. Then, grabbing our **Enemy Actor** variable, we will plug this into our other
