- pgno: 46
  md: '# # Traces


    We will use this to trace from the player''s location to 255 units in front of
    the character. If anything collides with the trace, we will face the pawn to the
    right based on the pawn''s rotation. This simple check will be enough to make
    our bot run along the walls indefinitely; so, perform the following steps:


    +   1. Pull the Return Value pin from GetActorLocation and drop it. Then, search
    for Vector + Vector.


    +   2. We now need to select Get Controlled Pawn and pull Get Actor Forward Vector
    from it. This contains vector information going in the direction that is in front
    of our pawn.


    +   3. So we will multiply Return Value by 255. This is the vector we want to
    add to the actor''s location. This results in adding 255 units in the direction
    ahead of the pawn''s current location.


    +   4. Now, we need to take the results of the addition of the End pin for the
    LineTraceByChannel node. This will trace directly in front of our pawn:


    ![](img/aaaa027482c900e215ba6bfab3c17337_46_0.png)


    +   5. Pull from the Vector + Vector node again, and this time we will plug it
    into the Dest pin for the Move to Location node. This will move the character
    forward indefinitely:'
  merge: -1
  img_proc: true
