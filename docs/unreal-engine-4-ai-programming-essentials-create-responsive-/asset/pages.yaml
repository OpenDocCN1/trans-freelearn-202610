- pgno: 115
  md: '# # AI Perception components


    There are two components that are currently available. The first one is what you''re
    already familiar with: the AI Perception component. The other is the AIPerceptionStimuliSource
    component. The latter is used to easily register the pawn as a source of stimuli,
    allowing it to be detected by other AI Perception components. This comes in handy,
    particularly in our case. Now, follow these steps:


    +   1. With PlayerSense open, let''s add a new component called AIPerceptionStimuliSource.
    Then, under the Details tab, let''s select Auto Register as Source.


    +   2. Next, we want to add new senses to create a source for. So, looking at
    Register as Source for Senses, there is an AISense array.


    +   3. Populate this array with the AISense_Sight blueprint in order to be detected
