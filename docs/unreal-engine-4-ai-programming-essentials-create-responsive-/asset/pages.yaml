    +   1. First, name our new project `AI Sense` and hit **create project**.

    +   After it finishes loading, we want to start by creating a new AIController
    that will be responsible for sending our AI the appropriate instructions.


    +   2. Let''s navigate to the **Blueprint** folder and create a new AIController
    class, naming it `EnemyPatrol`.


    +   3. Now, to assign `EnemyPatrol`, we need to place a pawn into the world then
    assign the controller to it.


    +   4. After placing the pawn, click on the **Details** tab within the editor.
    Next, we want to search for **AI Controller**. By default, it is the parent class
    **AI Controller**, but we want this to be `EnemyPatrol`:


    ![](img/aaaa027482c900e215ba6bfab3c17337_114_0.png)


    +   5. Next, we will create a new PlayerController named `PlayerSense`.


    +   6. Then, we need to introduce the AI Perception component to those who we
    want to be seen by or to see. Let''s open the `PlayerSense` controller first and
    then add the necessary components.'
  merge: -1
