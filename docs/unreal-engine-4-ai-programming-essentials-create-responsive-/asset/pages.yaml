- pgno: 43
  md: '# Small tips on MoveToLocation


    Here are some basic tips on MoveToLocation:


    +   * **AcceptanceRadius**: This allows you to increase the radius that is acceptable
    for a completed move. Let''s suppose that there is an enemy holding a sword who
    wants to attack the player. The **AcceptanceRadius** option will help you define
    how far this enemy should be standing away from his target—ideally 1 meter – and
    then perform an attack animation to swing the sword.

    +   * **bStopOnOverlap**: This tells your bot to stop if it overlaps the point
    rather than going precisely there. This will take into consideration the radius
    of the collision mesh attached to the bot.

    +   * **bUsePathFinding**: If this is selected, the bot will use the **NavMesh**
    option to find its destination. If unselected, the bot will simply move in a straight
    line to the destination, not taking into account any obstacles. This helps save
    the performance in some situations.

    +   * **bProjectDestinationToNavigation**: This projects the location on the navigation
    data before using it. This helps validate the target actor’s location – that is,
    whether it exists on a playable area or not.

    +   * **bCanStrafe**: This determines whether the AI can transverse diagonally
    on **NavMesh** or not.

    +   * **FilterClass**: This allows you to use **AreaClass**, which is another
    navigation component that affects the navigation of the AI. This effects changes
    such as exclusion or exclusive access to areas of **NavMesh** and alters the navigation
    cost.


    # Reviewing the current progress


    You can wipe the sweat from your forehead; the hard work has yet to begin.

    So, what have we done so far?


    +   * We''ve set up our AI project

    +   * We''ve set up our pawn with our new AIController

    +   * We''ve sent instructions to our pawn using AIController


    We''re halfway there. This simple setup allows us to put all our instructions
    on our AIController, which will possess the pawn we created from the sample content.
    The AIController is assigned to pawns, which means that multiple pawns can share
    the same AIController.'
  merge: -1
  img_proc: true
