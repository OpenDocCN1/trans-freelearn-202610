- pgno: 152
  md: '# Summary


    Let''s take some time to briefly talk about what we did in this chapter. First,
    we set up our agents to bounce off walls. This allows us to watch the agents simulate
    movement and how the four behaviors would affect them. Next, we will implement
    the Follower and Leader behavior, and this creates groups within the agents during
    simulation.


    The last thing we did was implement the flocking movement, which is broken up
    into three different behaviors. The first behavior is Alignment, and it is responsible
    for aligning agents with nearby agents. The second behavior is Cohesion, and it
    is responsible for directing agents towards the center of the nearby agents. The
    third behavior is Separation, and it is responsible for directing the agent away
    from nearby agents.


    Then, we simply created a UI to control the weights we created in the course and
    reset the agents at any time during the simulation.


    Now that we are done covering different movement behaviors, it is time we combined
    all that we demonstrated about AI in this book. In the next chapter, we will create
    an AI character, which will patrol, seek, and destroy any enemy. So, let''s move
    on to the next chapter to get started!'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# # Creating Patrol, Chase, and Attack AI


    In this chapter, we will combine some of the components we used in the previous
    chapters, including AI Sense and other components, to have AI navigate. Then,
    we will add some randomness in the time-out time that will make the AI chase after
    the characters it detects. Now, in this chapter, we can create AI using Behavior
    Tree while utilizing other AI components. A combination of these components can
    create responsive and convincing AI behavior.


    The goal of this chapter is to create an AI that will fire at you using Behavior
    Tree; this last AI component will benefit you because there is no perfect solution.
    So, understanding each of the available tools allows you to exploit the advantages
    of each component for your use in AI. These tools allow you to create AI that
    is responsive and convincing.


    # ## Creating a Blackboard


    Blackboards define the local variable space for Behavior Trees. These Blackboards
    can also sync with other instances of the same Blackboard. Blackboards can be
    created first because you''ll find yourself modifying them often until you discover
    everything you need for your Behavior Tree.


    We will create our Blackboard data first and then supply it to our Behavior Tree.
    Now, let''s start! Here are the steps:


    +   1. Right-click on the Content folder and create a new folder named AI.

    +   2. Now, right-click inside the folder and scroll down to find Artificial Intelligence;
    then, click on Blackboard. Let''s name this EnemyData.'
  merge: -1
  img_proc: true
