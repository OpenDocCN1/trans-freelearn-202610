  md: '# Steering behavior: Flocking


    Flocking is a steering behavior that combines Separation, Cohesion, and Alignment.
    Separation behavior avoids other nearby agents. Cohesion behavior keeps the agents
    in a group. Alignment behavior averages the forward direction by aligning with
    nearby agents.


    What we will do here is replicate the steering behavior, flocking, in blueprint.
    We will also use UMG to aid the manipulation of weights for each behavior. Let''s
    start now and create the variables we will need in this part of the chapter.


    # Flocking agents


    We must first start off by creating the variables necessary to calculate individual
    behaviors. Then, we must add the results to normalize a final forward direction
    for our agent.


    Let''s focus on our RollingGameMode game mode and add the three new global variables
    we will have to use later in this chapter. In correlation to the three behaviors,
    we need to create GlobalAlignment, GlobalCohesion, and GlobalSeparation by performing
    the following steps:


    +   1. Open RollingGameMode and focus on EventGraph. Then, from there, create
    the three variables as a Float type with a default value of 0.0.


    ![](img/aaaa027482c900e215ba6bfab3c17337_141_0.png)


    +   2. We need to create three vector variables: NCohesion, NAlignment, and NSeperation.


    +   3. Focus in on the SphereOverlapActors node before ForEachLoop. Here, we will
    clear any previous values of the three vectors we just created. We will do this
    for each of our flocking behaviors, setting it to 0,0,0.'
  merge: -1
  img_proc: true
