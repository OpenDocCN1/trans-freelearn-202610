    \ branch is executed. Today, we will utilize these functions. The first Event\
    \ Receive Activation node notifies us that the Branch node is activated, and this\
    \ is perfect for initializing variables within the Blackboard related to this\
    \ branch. The next node we will use is Event Receive Search Start, and this notifies\
    \ us when a branch is being chosen. We will take advantage of this and change\
