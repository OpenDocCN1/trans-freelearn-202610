- pgno: 61
  md: "# Creating probability\n\nThe Blueprint script we are about to create demonstrates\
    \ a simple yet effective probability. The system works off the idea of the simple\
    \ lottery of 0-1 with a variant. So, you first determined the chance that TRUE\
    \ will return from the function. Next, you determined the range that the lottery\
    \ will span for, which is 1 by default. The rest is left to the script. It now\
    \ takes Change Weight, and Number Span then calculates an offset. From there,\
    \ we will calculate a range of probabilities from Chance Weight. Then, we will\
    \ generate a random number within the range of our Number Span and check whether\
    \ it's within the range of the probability we determined before. This small variant\
    \ makes the probability less predictable. The following image shows the simple\
    \ lottery probability script checking for a random value within the determined\
    \ probability range:\n\n![](img/aaaa027482c900e215ba6bfab3c17337_61_0.png)\n\n\
    Note Offset from Lottery in the second one, which lands as true. Next time, the\
    \ range of probability will not be there, and a new random value will be calculated.\n\
    \n# Non-uniform distribution with RandomStream\n\nThe first thing we want to do\
    \ is initialize RandomStream. We can do this by creating a Make RandomStream node\
    \ and populating the initial seed pin with a random integer in Range. RandomStream\
    \ allows us to control the random generation of output. If we do not change the\
    \ seed within RandomStream, it will constantly produce the same results. So, with\
    \ that in mind, we must constantly reset the seed within the stream so that the\
    \ random output changes. Perform the following steps:\n\n+   1. Focusing back\
    \ to the Enemy AIController, create Random Integer in Range and set the Max value\
    \ to 65535. Then, pull from Return Value and type Make RandomStream.\n+   \n+\
    \   2. Now, we need to create variables to update RandomStream. Create an Offset\
    \ float with a default value of 0. Then, create a ChanceWeight float with a default\
    \ value of .25. Create a Max N float with a default value of 1."
  merge: -1
  img_proc: true
