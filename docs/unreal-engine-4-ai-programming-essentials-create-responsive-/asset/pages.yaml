- pgno: 69
  md: '# # Introducing Movement


    In this chapter, you will learn how to introduce movement into our AI characters
    within Unreal Engine 4. We will also go over the fundamental algorithms that allow
    us to instruct our characters to navigate to a point on a 2D plane. We will use
    other tools that will aid our AI in navigating the designated paths.


    The topics that we will cover in this chapter include the following:


    +   - Path Finding

    +   - NavMesh

    +   - Navigation and navigation modifier

    +   - Blueprint navigation nodes


    # ## Overview


    In this chapter, movement will be the main goal. How we achieve movement or use
    other tools to introduce movement are the questions we have to ask. Now that you''re
    comfortable with some of the tools we use in AI, we have to make the AI capable
    of its most common action: movement. The system we use to introduce movement into
    AI is called Path Finding.


    The way Path Finding works is by getting positions within the space designated
    as traversable. These start and end positions are fed to a function that computes
    the shortest path between the two positions. The algorithm uses relative position
    information, such as whether or not it is blocked by an object or actor, and prevents
    this position from being traversable. This is extremely useful when trying to
    generate a path in a world with dynamically moving objects.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# # Path Finding


    We will break the operation of Path Finding into different components that all
    work cohesively. The first component is NavMesh, which represents the traversable
    path. This isn''t the only Navigable Mesh generation component, but this is also
    the most commonly used representation of the Navigable Mesh. Another component
    is NavMeshModifiers, which can serve different purposes. A few examples are as
    follows:


    +   * **Influence Mapping**: This allows you to feed the AI input information
    based on their location on NavMesh

    +   * **Null Paths**: These simply allow you to cut out areas of NavMesh

    +   * **Allowed Paths**: These simply allow you to block any AI that isn''t allowed
    to navigate this area of NavMesh


    # # The A* algorithm


    At the core of the Path Finding system is an algorithm that calculates the shortest
    navigable path between two points on NavMesh. Dijkstra''s algorithm is named after
    the computer scientist Edsger Dijkstra, who originally created it in 1956 and
    later published it in 1959 to find the shortest paths between two points. There
    are a few path finding algorithms worth mentioning, but the most commonly used
    in gaming is a variant of Dijkstra''s algorithm. The variant is called the A*
    algorithm. A* works by having a list of traversable points. Then, from the start
    position, we want to search for the shortest path in each available direction.
    We can determine this by heuristic values. These values will tell us how much
    it costs to traverse to the next point based on some predefined rules. In A*,
    we traverse from a point to another point to reduce the exploration cost. The
    big difference between the two algorithms is the fact in A* that you have a heuristic
    value, which affects your pathing decisions. Heuristic values are obstacles to
    the predictive cost to travel to the next possible point. When the path is generated,
    we want the lowest heuristic value. So this means that by setting the heuristic
    values to 0, the algorithm is the same as Dijkstra''s. Dijkstra''s algorithm scans
    more nodes, usually making it less efficient because it doesn''t predict the cost
    of traversing paths.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Let''s take the following grid as an example:


    ![](img/aaaa027482c900e215ba6bfab3c17337_71_0.png)


    Dijkstra''s algorithm takes every available point into account. So, in this example,
    we''ll start from the upper-left corner and try to get to the lower-right corner,
    and all the adjacent nodes are considered to be connected and can be traversed
    from each other. Perform the following steps:


    +   1. The algorithm scans all the available nodes, keeping a record of the shortest
    found path. Nodes with a different grayscale represent that the algorithm has
    to explore different locations to find the path:


    ![](img/aaaa027482c900e215ba6bfab3c17337_71_1.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: '+   2. Once the goal is discovered, a trace back sequence is put in action,
    thus creating the path.


    This can take a lot of steps, and that''s the reason for which we adapted heuristics
    in A*. Instead of searching each node, we will continue from the shortest current
    path to the goal.


    An example with A* is represented in the following grid. The algorithm will start
    from the first node (in the upper-left corner) and then scan the neighboring nodes
    to calculate the movement cost. The node at which the cost is the least is selected,
    and the nodes that are not selected are put on the list of the scanned nodes.
    This avoids us having to go to these nodes again for this query:


    ![](img/aaaa027482c900e215ba6bfab3c17337_72_0.png)


    From step 1, the neighbouring nodes are scanned and checked for heuristic values
    or path cost to determine the next optimal step. What results is a direct path
    (if unobstructed).


    There are other algorithms available, but A* is easy to implement and isn''t resource-heavy,
    so it is commonly implemented in gaming engines as a way of creating paths between
    two points on a grid.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Navigation Mesh


    Navigation Mesh in Unreal Engine 4 allows us to tell the engine where our traversable
    path should be generated, and we can optimize this to help generate more accurate
    paths for our AI. We will call Navigation Mesh "NavMesh" for short as most game
    developers are familiar with this term. If you''re in Unreal Engine and you navigate
    to the **Modes** panel under **Volumes**, you''ll see **NavMeshBoundsVolume**.
    This is a volume that you can use to cover the geometry and generate NavMesh on.
    I have a sample of what this would look like. If you can''t see the green mesh
    generated by NavMesh, make sure you check the **Navigation** option (press `P`
    for shortcut) in the **Show** menu onscreen:


    ![](img/aaaa027482c900e215ba6bfab3c17337_73_0.png)


    # RecastNavMesh


    On each level, you''ll see a node within World Outliner called **RecastNavMesh-Default**.
    If you click on it, you can explore the default options that affect Navigation
    Mesh within the level.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'If you go down to **Generation**, this is what you will begin to tweak according
    to your needs. If you''re trying to get more performance when rebuilding at runtime,
    or precision with your agent''s movement, try to optimize these values:


    ![](img/aaaa027482c900e215ba6bfab3c17337_74_0.png)


    I will briefly go over some of the properties to give you an understanding of
    what role they play and how they affect performance. Let''s look at some of the
    most important properties in **RecastNavMesh**:


    +   - **Cell Size**: This is the 2D size of the voxel, basically a 3D pixel, which
    represents a space to navigate. This is the floor area of the voxel. This directly
    correlates to the resolution of NavMesh. Smaller sizes here generate more voxels,
    resulting in better movement precision. Unfortunately, performance takes a hit
    during the generation of NavMesh due to this.

    +   - **Cell Height**: This is the height of the voxel. This value correlates
    to **Agent Max Step Height**, and it is suggested to be kept at half its value.
    NavMesh will not be generated if the **Cell Height** value isn''t at least .1
    less than that of **Agent Max Step Height**.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   - **Tile Size UU**: When this is at lower values, it increases the NavMesh
    Generation performance. Try enabling **Draw Poly Edges** to see this in action.

    +   - **Agent settings (Radius, Height, Max Height, Max Slope, Max Step Height)**:
    are specific to your agents and should be specified appropriately.

    +   - **Min Region Area**: This gets rid of what looks to be artifacts of pieces
    of NavMesh Generation, which are too insignificant to navigate.


    If you have any obstacles in your NavMesh and NavMesh is being generated on top
    the obstacles, then this object is treated as geometry, and for better performance,
    you can make your mesh be recognized as a Dynamic Obstacle. This prevents NavMesh
    from being generated on top of it. Now, to affect this area, you must set the
    Offset and Extent values for the Box Collision property as well. Take a look at
    the following screenshot:


    ![](img/aaaa027482c900e215ba6bfab3c17337_75_0.png)


    Let''s walk through the steps:


    +   1. Let''s create a new **Box Collision** element. This will populate the array
    with an element containing two values.

    +   2. We need to set the **Offset** value to the negative of half the width,
    length, and height of NavMesh. The **Offset** value is the position that the collision
    begins from.

    +   3. Next, set our **Extent** value to half the width, length, and height of
    our NavMesh. The **Extent** value is how much it extends from the center point
    of NavMesh. This means that it correlates to half the volume size.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'In this NavMesh, for example, I''ve set the properties accordingly; take a
