- pgno: 119
  md: '# # State machines


    Traditionally, we would default to the AI Behavior Tree, which is available to
    anyone using UE4. However, in our scenario, we will break the job of Behavior
    Tree into components directly written in blueprint. So, the next thing we need
    to create is a way to maintain a state. Then, we can essentially create a state
    machine by updating the variable, allowing our AI to transition into different
    states by controlling the execution flow.


    We will establish this using an event that will update our state when the conditions
    we specify are met. To start this off, let''s continue to the next step!


    +   1. First, let''s create a new Int variable in our AIController called **State**.
    This will maintain our current state within our state machine.


    +   2. We now need a new event, and we will call it **NextRoute**. So, upon right-clicking
    on the event graph and going under **Add Event**, we will notice **Add New Event**.
    Let''s name this new event `NextRoute`.


    +   3. Now, after our assigned event **ReceiveMoveCompleted**, we should call
    **NextRoute** to initiate or enter the state machine:


    ![](img/aaaa027482c900e215ba6bfab3c17337_119_0.png)


    +   4. Next, focusing on **ReceiveMoveCompleted**, let''s switch on **Result**.
    From the switch node, let''s pull **Success**. This means that only when the move
    is completed by our AI will we continue on to the next step in the execution flow.


    +   5. From **Success**, let''s create a new **Branch** node and set up a new
    condition. This condition will check whether our **State** Int variable currently
    equals **0**. The value **0** represents our default state.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '6. If our **State** variable''s value is **0**, let''s create a **Retriggerable
    Delay** node and set it at **0.2** seconds. Next, we want to check whether our
    **Current Point** variable is valid; if so, we want to grab the variable we created
    earlier to define the next route in the linked list.


    7. From there, we want to set this new variable into our **Current Point** variable.
    This will allow us to indefinitely navigate between waypoints.


    8. Next, we want to create two new variables that will be responsible for delaying
    the amount of time till we continue to the next route.


    9. So, let''s create a new Float variable called **RoutePauseDelay**, which will
    define how long we will wait. Next, we want to create deviations so that the wait
    time isn''t always the same. So, now create a new Float variable called **RoutePauseDevia.**


    10. Let''s pump **RoutePauseDeviation** into **Random Float in Range** and add
    this to **RoutePauseDelay**. Then, this will be pumped into a **Delay** node.


    11. From the **Delay** node, we want to call the **NextRoute** event, which we
    created earlier.


    12. Focusing on the newly created **NextRoute** event, let''s check whether our
    **State** variable is equal to **0** and create a **Branch** node to check the
    results when executed:


    ![](img/aaaa027482c900e215ba6bfab3c17337_120_0.png)


    13. Next, we should get our AIController from our Actor, and check whether our
    **Current Point** variable is valid.


    14. Next, if our **Current Point** variable is valid, then we should pull from
    **Return Value** of the **getAIController** and **Move to Actor** nodes.


    15. From there, pull the **Current Point** variable we checked and put this into
    the goal of the node. Now, when the AIController takes possession of the actor
    it belongs to, it will call this event. Once the move is completed, it will update
    the route and continue to the next route.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Pawn detection


    To give our pawn the most up-to-date information, we need to create an event that
    will catch and respond to the sensory update events from the AI Perception component.
    We will establish this by creating a new event that is solely responsible for
    processing detected pawns. Here are the steps:


    +   1. Let''s right-click anywhere and go under **Add Event**. From there, we
    want to add a custom event, and we will name the new event `Detected Enemies`.
    We have to also create a new actor array parameter named `Detected Actors` to
    hold the array of **Updated Actors**.


    +   2. Now, in the next step, we need to recompile a blueprint to call the AIController
    and the **Detected Enemies** function from our **OnPerceptionUpdated** event:


    ![](img/aaaa027482c900e215ba6bfab3c17337_121_0.png)


    +   3. In the next steps, we will handle the transitions between different states.
    For example, we can be in the default state and find a new enemy. From there,
    we need to stop the current movement and move toward the detected enemy. If we
    lose sight of an enemy that we''ve been chasing for a specific amount of time,
    we can cancel the movement and go back to navigating our waypoints.


    +   4. Now, we want to focus again on the **DetectedEnemies** event we created
    earlier. Now that this event is called by our AI Perception component, we want
    to use these actors appropriately for each state.


    +   5. Let''s pull from this event and create a **Branch** node. Next, we want
    to create the condition for this branch. We need to pull our **State** variable
    and check whether it equals **0**. If it is **True**, we will check whether we
    detected any enemies.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '6. So, pull from **True**; let''s check whether the length of our **Detected
    Actors** array is longer than or equal to **1**. If it is, we have enemies, and
    we can move forward in the process. So, pull from **True** of the previous **Branch**
    node and then create a new branch. This will check for the length of the **Detected
    Actor** array.


    7. Next, if we found an Enemy, we will change the state to change the execution
    path. We can do this by setting the **State** variable as **1**:


    ![](img/aaaa027482c900e215ba6bfab3c17337_122_0.png)


    8. Next, we create a new switch statement for our **State** variable. This will
    help us with the execution flow. We want the start of the index to begin from
    1 and have no default pin.


    9. Now, we can backtrack to our first **Branch** condition, where we will check
    whether the state is equal to **0**. Then, when this statement is **False** —
    meaning we''re currently in a state of searching for our enemy — we would want
    this to lead to the switch statement as well. This will allow our state to transition
    out of the state if we''ve lost the enemy at some point.


    10. Focusing on the switch node, let''s add another break for index **2**. Then,
    pulling from one, let''s call **GetAIController**. If **Found** is executed, then
    we''re ready to move forward.


    11. Let''s pull the **Detected Actors** parameters from our event and create a
    **ForEachLoopWithBreak** node. From this node, let''s check whether the enemy
    detected is within sight. Right-click and search for **Line of Sight To**, keeping
    **Target** to self. Then, **Other** should be the **ArrayElement** variable.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '12. Pulling from Return Value, we will create a new Branch node. This branch
    condition will need to check whether we have Current Enemy; if not, we will set
    a new enemy. From the True value of the Branch node, let''s set an Enemy actor
    from Array Element.


    13. Pulling from GetAiController, we want to set focus on the enemy we just set
    in Enemy actor.


    14. Next, we want to get our AIController again and create the Move To Actor node.
    Then, we will set the Enemy actor to our goal for the node. This will navigate
    our AI to our new found enemy.


    15. Next, let''s switch on Return Value from the Move To Actor node. We will get
    a node that switches on Failed, Already At Goal, and Request Successful. Let''s
    pull from Request Successful and set our State variable to 2.


    16. From our Set State variable, we want to then break our ForEachLoopWithBreak
    node. This way, we won''t continue to search for enemies once we find them:


    ![](img/aaaa027482c900e215ba6bfab3c17337_123_0.png)


    17. Let''s go back in our loop at our first Branch node, and from False, we will
    create another branch. This will check whether the Array Element pin, our enemy
    that we just selected Line Of Sight To for that failed, is the enemy we currently
    have targeted. If so, we want clear to our Enemy Actor variable, and focus and
    set our State value back to 0.'
  merge: -1
  img_proc: true
- pgno: 124
  md: "# # State transition\n\nThis concludes what is necessary for our transition\
    \ out of state 1. Next, we will do what is required for state 2, and this will\
    \ allow us to detect the changes necessary to exit this state back to state 0\
    \ once we no longer see the enemy. Perform the following steps:\n\n+   1. Going\
    \ back to the switch node on State, which we created earlier (in Step 55) and\
    \ creating a new connection from 2, let's create GetAiController.\n+   \n+   2.\
    \ Next, we need to check whether our Enemy Actor variable is valid. We will do\
    \ this by dropping out the Enemy Actor variable, pulling from the pin, and then\
    \ creating the IsValid node.\n+   \n+   3. If the variable is valid, we want to\
    \ move our AIController toward our enemy. We can do this by pulling from Return\
    \ Value on GetAiController and then creating Move To Actor. Then, we can connect\
    \ our valid Enemy Actor variable to our Move To Actor goal input.\n+   \n+   4.\
    \ Next, we want to use the Tick event within the AIController to check whether\
    \ we have the line of sight of our enemy when we're in state 2. We can do this\
    \ by focusing on the Tick event, pulling from it and then creating a Branch node.\n\
    +   \n+   5. Then, drop the State variable and check whether it equals 2. The\
    \ results of this equal node are pumped into the condition of the Branch node.\n\
    +   \n+   6. Looking at the Branch node, pull from True and create the getAiController\
    \ node. Then, we will pull from Found and create a Branch node.\n+   \n+   Now,\
    \ we need to create two new variables to maintain the chasing of our enemy. This\
    \ will allow us to either timeout our chase after a designated amount of time\
    \ or have the case end immediately, forcing the AI to return to routing between\
    \ the waypoints we created.\n+   \n+   7. So, let's create a new variable called\
    \ TimeoutChase; this will be a Boolean. Next, create a ChaseTime variable, and\
    \ this will be a Float. This will tell our execution line to switch between different\
    \ flows if we don't want to timeout our chase.\n+   \n+   8. Focusing again on\
    \ the last Branch node we created, we want to plug in our newly created Timeout\
    \ Chase variable into the condition."
  merge: -1
  img_proc: true
- pgno: 125
  md: '9. If this **Branch** node is **False**, we want to plug it into the **getAiController**
    node from our previous switch statement. It should look similar to the following
