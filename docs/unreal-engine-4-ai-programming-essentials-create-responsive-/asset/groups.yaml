    \ perform:\n\n- 1. Let's go to General | Appearance within Editor Preferences\
    \ and under User Interface, select the User Small Tool Bar Icons option and unselect\
    \ the Show Friendly Variable Names option. Your settings should look like the\
    \ following screenshot:\n\n  ![](img/aaaa027482c900e215ba6bfab3c17337_36_0.png)\n\
    \n- 2. Navigate to the **Blueprints** folder within the project:\n\n  ![](img/aaaa027482c900e215ba6bfab3c17337_37_0.png)\n\
    \n- 3. Now we will possess our pawn. Right-click and hit the **Blueprint** option\
    \ to create a blueprint:\n\n  ![](img/aaaa027482c900e215ba6bfab3c17337_37_1.png)\n\
    \n- 4. Next, we will create our AIController class. Go to Custom Classes and type\
    \ AIController. Select it and then click on Select, as shown in the following\
    \ screenshot:\n\n  ![](img/aaaa027482c900e215ba6bfab3c17337_38_0.png)\n\nThis\
    \ will create the blueprint, and I named it MyController here.\n\n## Using our\
    \ new AIController class\n\nEver notice how one player can be any character they\
    \ desire? This is the hierarchy that creates the pawn and the controller. The\
    \ controller is what the player inherits after waiting for some time in the game\
    \ lobby. It is used to manage the input and connection from the player. This class\
    \ comes with additional functions to help navigate the bot and the ability to\
    \ assign a Behavior Tree to the controller. In this demonstration, we will cover\
    \ some of the basics of the AIController class.\n\n## Assigning the AIController\
    \ class\n\nSo, now that we have what we need to create an AI, we will assign the\
