    double-back flip, no hands, or the triple somersault and jazz hands.


    +   • **Steering behaviors**: Steering behaviors affect the way AI moves while
    navigating to avoid obstacles. This also means using Steering to create formations
    with your fleets that you have set to attack the king''s wall. Steering can be
    used in many ways to influence the movement of the character.


    +   • **Sensory systems**: Sensory systems can provide critical details, such
