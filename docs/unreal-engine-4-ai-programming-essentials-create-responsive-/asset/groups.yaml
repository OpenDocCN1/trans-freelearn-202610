    # The AIController


    We previously used the AIController to move our pawns in Chapter 2, Creating Basic
    AI, and Chapter 3, Adding Randomness and Probability, but never took the time
    to understand what''s happening within Unreal Engine 4 to make it happen. Having
    this understanding allows you to expand on movement components when, for example,
    you want to create your special extensions of the movement component to support
    the receiving of instructions such as Move to Location for a vehicle.


