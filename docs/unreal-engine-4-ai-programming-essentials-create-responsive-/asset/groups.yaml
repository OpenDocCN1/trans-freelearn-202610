    \ **获稿编辑**\n- 拉丽萨·平托\n-  \n- **内容开发编辑**\n- 梅林特·托马斯·马修\n-  \n- **技术编辑**\n- 迪拉杰·昌丹什维\n\
    -  \n- **文字编辑**\n- 施鲁蒂·艾耶\n-  \n- **项目协调员**\n- 朱迪·乔斯\n-  \n- **校对员**\n- Safis\
    \ Editing\n-  \n- **索引编制员**\n- 特贾尔·达鲁瓦莱·索尼\n-  \n- **制作协调员**\n- 阿帕娜·巴加特\n-  \n\
    - **封面工作**\n- 阿帕娜·巴加特\n\n## 关于作者\n\n**彼得·L·纽顿** 小时候就对计算机产生了浓厚兴趣。随着对技术的兴趣日益增长，Web\
    \ 应用程序是他初次探索开发的领域。编程的乐趣让彼得不断深入探索不同的软件设计和编程模式。他是一名自学编程的程序员，花费了无数小时对汇编和 ARM 指令可执行文件进行逆向工程，仅仅为了学习的乐趣。彼得拥有多年\
    \ Web 开发人员、软件开发人员、数据库架构师和硬件技术员的工作经验。近年来，他专注于虚拟现实/游戏行业，曾与 Create、索尼影业以及虚幻引擎 4 开发商\
    \ Epic Games 等公司合作。\n\n彼得最近的 VR 项目是 *你能走稳吗？*，该作品荣获了 Digital Hollywood 的“基于电影或电视体验的最佳虚拟现实”奖项。\n\
    \n感谢读者们对我 AI 探险之旅的持续支持！我创作了许多教程，由于热烈的反响，Epic Games 联系了我，请求我担任 AI 程序员。我还结交了不少朋友，例如\
    \ Micheal Allar、Chance Ivey、Nick Whiting、Alexander Paschall、Yoeri、Jan、Pete 等，还有许多我可能会忘记的人，这里只是举几例。这是一段美好的时光！Epic\
    \ 万岁！\n\n**Jie Feng** 来自中国嘉兴。他目前是哥伦比亚大学的博士候选人，专注于机器学习和计算机视觉。他开展过的研究涵盖图像中物体检测与识别、从大规模数据库中检索相似图像，以及理解视频中的人类行为等问题。Jie\
    \ 的研究成果已在国际顶级会议上发表，并获得了一项美国专利。他还是一名软件设计师和开发人员，曾就职于微软、亚马逊和 Adobe。Jie 热衷于将人工智能应用于解决现实问题。他利用\
    \ Microsoft Kinect 分析健身运动的项目在 2013 年纽约创新健康科技竞赛中荣获了大众选择奖。Jie 目前正在开发一款名为 EyeStyle\
    \ 的时尚发现产品。\n\n电子游戏正是促使他学习计算机科学的动力。他最喜欢的类型是动作冒险游戏。《生化危机》、《古墓丽影》和《未知海域》等作品激发了他的创新思维。本书让\
    \ Jie 有了一个独特的机会，将其人工智能知识应用于游戏设计，并探索使用虚幻引擎 4 创建智能角色的潜力。\n\n> 我想感谢我的父母，感谢他们对我工作和我人生所做的每一个决定所给予的无条件的爱与支持。我很幸运能拥有许多才华横溢的人作为我的朋友和同事，无论在中国还是在美国。最后，但同样重要的是，我想向所有游戏设计师和开发人员表示感谢，是他们创造了启发人们并丰富人们生活的奇幻世界。\n\
    \n## 关于评审者\n\n**哈马德·A·阿尔-哈桑** 对游戏和游戏开发充满热情，这使他远离了巴林的海岸，他在巴林大学计算机科学专业毕业。担任软件工程师几年后，他跨越海洋前往美国，成为\
    \ Action Mobile Games 的 gameplay 程序员，参与开发《受感染战争》（Infected Wars）一作。哈马德对虚幻引擎产生了热情，这使他先后前往塞尔维亚的\
    \ Digital Arrow 以及沙特阿拉伯，担任 Semanoor（即《伊本·巴图塔足迹》的出版商）的顾问。此后，他担任当地游戏工作室 Empire Studios\
    \ 的技术总监，在建立该工作室方面发挥了关键作用，并负责监督一款未公布手机游戏的所有技术方面。\n\n自 2010 年以来，哈马德参与过多种系统的开发，无论是玩家移动、摄像头与控制、人工智能、网络与复制、武器、各种定制、HUD\
    \ 还是菜单。他同样精通虚幻编辑器及其工具，在材质和着色器创建方面也拥有深厚专长。回到巴林后，哈马德在继续自由职业的同时，开展自己的项目。\n\n您可以通过\
