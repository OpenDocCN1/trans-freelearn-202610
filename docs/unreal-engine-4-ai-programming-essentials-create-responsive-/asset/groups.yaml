  - '[PAGE 36]


    # Environment


    Even though we are using the Third Person blueprint template, these techniques
    can be used on other templates as well. You must adapt what you learn here.

    That being said, what you start to understand is that these techniques are tools.

    Understanding how to create a state, sensory component, navigation component,

    and so on is generally perceived to be the same thing, but what is used, and how

    it is used, is dictated by the AI environment.


    # Prerequisites


    Note that my windows and function names are different. I will run you through
    my

    settings so that you can have the same setup as I do. Here are the steps to perform:


    +   1. Let''s go to General | Appearance within Editor Preferences and under

    +   User Interface, select the User Small Tool Bar Icons option and unselect

    +   the Show Friendly Variable Names option. Your settings should look like

    +   the following screenshot:


    ![](img/aaaa027482c900e215ba6bfab3c17337_36_0.png)'
  - '[PAGE 37]


    2. Navigate to the **Blueprints** folder within the project:


    ![](img/aaaa027482c900e215ba6bfab3c17337_37_0.png)


    3. Now we will possess our pawn. Right-click and hit the **Blueprint** option
    to create a blueprint:


    ![](img/aaaa027482c900e215ba6bfab3c17337_37_1.png)'
  - '[PAGE 38]


    4. Next, we will create our AIController class. Go to Custom Classes and type
    AIController. Select it and then click on Select, as shown in the following screenshot:


    ![](img/aaaa027482c900e215ba6bfab3c17337_38_0.png)


    This will create the blueprint, and I named it MyController here.


    # Using our new AIController class


    Ever notice how one player can be any character they desire? This is the hierarchy
    that creates the pawn and the controller. The controller is what the player inherits
    after waiting for some time in the game lobby. It is used to manage the input
    and connection from the player. This class comes with additional functions to
    help navigate the bot and the ability to assign a Behavior Tree to the controller.
    In this demonstration, we will cover some of the basics of the AIController class.'
  - '[PAGE 39]


    # Assigning the AIController class


    So, now that we have what we need to create an AI, we will assign the MyController
    class to the MyCharacter base. To do so, go to the Defaults section within the
    MyCharacter blueprint. Search for AIController Class and set it to MyController,
    as shown in the following screenshot:


    ![](img/aaaa027482c900e215ba6bfab3c17337_39_0.png)


    When a character isn''t possessed, it will automatically be possessed by AIController.
    So, with the change we just made, the default AIController class that possesses
    our MyCharacter blueprint will be MyController.'
