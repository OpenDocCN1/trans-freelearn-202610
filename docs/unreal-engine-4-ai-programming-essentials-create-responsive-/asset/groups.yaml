    ## Introduction to Game AI


    This chapter will introduce the basic idea of **Artificial Intelligence** (AI)
    and how it directly affects and enhances the gaming experience. You will learn
    the differences between the traditional and also the game-specific goals of AI.
    We will introduce various techniques used in game AI, including navigation, Behavior
    Tree, sensor systems, and so on. You will learn in brief which tools we utilize
    for AI within Unreal Engine 4’s editor. After this chapter, readers will gain
    a basic understanding of how AI can be applied to game development for a better
    gaming experience. The AI techniques that we will briefly cover here will be taught
    in the subsequent chapters.


    ### Game Artificial Intelligence


    When you first think of Artificial Intelligence, robots immediately come to mind.
    AI is derived from the idea of intelligence that helps living creatures make decisions.
    We take inputs, context, and our personal reasoning to decide on the actions we
    will perform. In AI, we try to virtually replicate this process to create systems
    that can have autonomous behavior. Assuming you have a fairly extensive gaming
    history, you would know that game AI is generally not smarter than some older
    games where your enemy may get stuck in a corner and fail to get out. Game AI
    now is by no means comparable to the general AI in scientific research. Game AI
    is designed to work in a well-controlled, predictable virtual world. It mainly
    consists of hardcoded rules to allow game actors to make proper actions corresponding
    to different situations. Game AI is meant to be fun, so it only needs to seem
    smart to the player within this context.


    It is fair to say that AI is a very broad topic, so implementing every possible
    technique isn’t the plan. So, it goes without saying that we will only cover what
    is necessary for you to create an awesome game AI. Keep in mind, though, that
    we will only touch on very specific game AI techniques; the world of AI is as
    vast as it is great.


    ## How AI affects the gaming experience


    Players seek a realistic and immersive experience in games. AI plays a huge part
    in forming this gaming experience by bringing realism and fun to the virtual world.
    Imagine that you are accompanied by a dog as you walk around or a flock of birds
    scatters when you make some noise. An enemy opponent is perhaps the most common
    and important implementation of game AI. The few types of game AI — navigating,
    fighting, assisting, or analytical — add the missing elements to other players
    to make them feel real and challenging to compete. This dates back to when it
    was used most notably in Chess, Nim, Pong, and Pac-Man. Up until now, it has been
    used in a war frame, with procedurally built levels. As the modern game design
    moves quickly by introducing new features to game play, such as the open world,
    massive in-game characters, and social interaction, it also introduces problems
    because these features cause AI decision making to require more input in unpredictable
    environments. Even now, AAA titles have their own complications with AI that result
    in poor user satisfaction. We will introduce in the following sections some powerful
    techniques to help create this important AI module and discuss how they are implemented
    in Unreal Engine.


    ## Techniques and practices of game AI


    There exist many techniques to cover different aspects in game AI, from fundamental
    movement to advanced environment sensing and decision making. Let''s look at them
    one by one.


    ### Navigation


    Navigation for AI is usually built up of the following tools:


    - **Navigation Mesh**: Using tools such as Navigation Mesh, also known as **NavMesh**,
    you can designate areas in which AI can traverse. NavMesh is a simplified polygonal
    representation of a level (the green region in the following screenshot), where
    each polygon acts as a single node connected to its nearby ones. Usually, this
