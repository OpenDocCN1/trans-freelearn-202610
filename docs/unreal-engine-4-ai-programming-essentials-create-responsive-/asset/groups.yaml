    ## 导航行为：群体


    群体是一种结合了分离、聚集和对齐的导航行为。分离行为避开其他附近的代理。聚集行为使代理保持在一个群体中。对齐行为通过与附近代理对齐来平均前进方向。


    我们在这里要做的是在蓝图中复制导航行为，群体。我们还将使用 UMG 来帮助操作每种行为的权重。现在就开始，创建我们在本章这部分需要的变量。


