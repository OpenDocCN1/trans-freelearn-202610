    # # Navigation


    Now that we have our soldiers in the world, we want to navigate them to their
    respective waypoints. This will be done through the AIController we set up on
    our soldier. If we focus again on Unreal Engine, we can get started! Follow these
    steps:


    +   1. Open the AIController class we created earlier and named `SoldierAI`.

    +   2. Then, we want to navigate to the **EventGraph** section. From there, we
    want our AIController to begin navigating to its first route as soon as it possesses
    a worthy pawn. So, let''s add an event to drive this action (I encourage the use
    of events). The one we are looking for is called **Event On Possess**. This will
    also return the pawn it possessed, which we can use to compare with the `Allowed
    Access` list from waypoints.

    +   3. Pull from the exec pin, and let''s assign a new event called **ReceiveMoveCompleted**.
    This event will continue the pawn to the next route as soon as it completes the
    previous one:


    ![](img/aaaa027482c900e215ba6bfab3c17337_82_0.png)'
  - '[PAGE 83]


    4. Now, after the **Bind Event** exec pin, let''s put in **Do Once** to prevent
    this from being called twice.


    5. Next, let''s right-click, search for the **Get All Actors of Class** node,
    and select our custom blueprint called **Waypoints**. We want to now search through
    the available list of waypoints and check whether we''re allowed to navigate there.


    6. So, create a **ForEachLoop** node from the **Out Array of Actors** array and
    pull the **Allowed Access** array from **Array Element**. Then, we want to pull
    the pawn returned from the **Event On Possess** variable and cast it to the ThirdPersonCharacter
    pawn.


    7. From there, let''s try to find the pawn in the **Allowed Access** array. The
    array will return -1 if nothing is found, which means that we do not have access!


    ![](img/aaaa027482c900e215ba6bfab3c17337_83_0.png)


    8. We need to pull a **Compare Int != Int Boolean** operation and compare our
    results from **Find** with -1. This will then be pumped into a **Branch** node.


    9. Now, when this **Branch** node returns **True**, this means that we are allowed
    to navigate to the current **Array Element** pin, and we should add it to our
    points to navigate to.


    10. Now, let''s create a new **Routes** array on our pawn to hold the waypoints
    we can navigate. Then, we will pull this node to the **Branch** node we just created
    and pull **Add** from the array node. This will allow us to quickly access the
    routes we have assigned to us.'
