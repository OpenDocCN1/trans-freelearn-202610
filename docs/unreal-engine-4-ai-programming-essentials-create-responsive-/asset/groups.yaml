    ## 导航


    现在我们已在世界中拥有士兵，希望将它们导航到各自的路点。这将通过我们在士兵上设置的 AIController 完成。如果我们再次关注 Unreal Engine，就可以开始了！请遵循以下步骤：


    - 1. Open the AIController class we created earlier and named `SoldierAI`.

    - 2. Then, we want to navigate to the **事件图** section. From there, we want our
    AIController to begin navigating to its first route as soon as it possesses a
    worthy pawn. So, let''s add an event to drive this action (I encourage the use
    of events). The one we are looking for is called **拥有时事件**. This will also return
    the pawn it possessed, which we can use to compare with the `Allowed Access` list
    from waypoints.

    - 3. Pull from the exec pin, and let''s assign a new event called **接收移动完成**.
    This event will continue the pawn to the next route as soon as it completes the
    previous one:


    ![](img/aaaa027482c900e215ba6bfab3c17337_82_0.png)


    - 4. Now, after the **绑定事件** exec pin, let''s put in **仅执行一次** to prevent this
    from being called twice.


    - 5. Next, let''s right-click, search for the **获取类的所有 actor** node, and select
    our custom blueprint called **路点**. We want to now search through the available
    list of waypoints and check whether we''re allowed to navigate there.


    - 6. So, create a **foreach 循环** node from the **输出 actor 数组** array and pull
    the **允许访问** array from **数组元素**. Then, we want to pull the pawn returned from
    the **拥有时事件** variable and cast it to the 第三人称角色 pawn.


    - 7. From there, let''s try to find the pawn in the **允许访问** array. The array
    will return -1 if nothing is found, which means that we do not have access!


    ![](img/aaaa027482c900e215ba6bfab3c17337_83_0.png)


    - 8. We need to pull a **整型不等于整型布尔值** operation and compare our results from **查找**
    with -1. This will then be pumped into a **分支** node.


    - 9. Now, when this **分支** node returns **真**, this means that we are allowed
    to navigate to the current **数组元素** pin, and we should add it to our points to
    navigate to.


    - 10. Now, let''s create a new **路线** array on our pawn to hold the waypoints
    we can navigate. Then, we will pull this node to the **分支** node we just created
    and pull **添加** from the array node. This will allow us to quickly access the
    routes we have assigned to us.


    - 11. Now, we need to tell the pawn to navigate to the waypoint after this operation
    is completed. This can be done by pulling another **路线** array out past the last
    nodes we placed.


    - 12. We want to shuffle our **路线** array so that our next destination is random.
    You can do this by pulling from the array and searching for **洗牌**. This should
    be called last before our next operation:


    ![](img/aaaa027482c900e215ba6bfab3c17337_84_0.png)


    - 13. Next, we have the location that the pawn needs to go to, and we need to
    tell the pawn to move. We have two options: the first is to provide the **移动到位置**
    node with a location, and the second is to provide an actor and allow the engine
    to handle finding the destination. I will choose the latter for this example.


    - 14. Right-click and search for the **移动到 actor** node, and we want to pump the
    first actor in the index from the **路线** array we created earlier:


    ![](img/aaaa027482c900e215ba6bfab3c17337_85_0.png)


    - 15. From there, let''s track back to our **接收移动完成** event and pull from this
    to our **洗牌** node. Now that this is completed, we want to go back to the editor.
    Let''s simulate and see what AI does!


    ![](img/aaaa027482c900e215ba6bfab3c17337_85_1.png)


    Now, let''s get back!


    ## 导航修改器


    Do you remember when we talked about heuristics? Navigation Modifiers allow you
    to directly affect the cost of navigating areas in which the modifier directly
    overlaps. You can also represent this affected area with a new color.


    你还记得我们讨论过启发式吗？导航修改器允许你直接影响修改器直接重叠的区域的导航成本。你也可以用新颜色表示这个受影响的区域。


    Now, in our example, we will analyze the behavior of AI as it traverses the different
    Navigation Modifiers we set up. What you want to understand from this is that
    heuristics help to find an optimal solution faster than Dijkstra''s algorithm
    alone while utilizing the same method of discovery.


    现在，在我们的示例中，我们将分析 AI 在遍历我们设置的不同导航修改器时的行为。你想从中理解的是，启发式比仅使用 Dijkstra 算法更快地找到最优解，同时利用相同的发现方法。


    So, for example, if you have a cityscape and want your AI to stay on the sidewalks
    and out of the streets as much as possible, you could place Navigation Modifiers
    in the streets, which makes traversing the area highly costly. So, your AI will
    only ever traverse these areas if the appropriate path is blocked off by other
    high costs, such as obstacles.


    例如，如果你有一个城市景观，并且希望你的 AI 尽可能待在人行道上而避开街道，你可以在街道上放置导航修改器，这使得穿越该区域成本很高。因此，你的 AI 只有在适当的路径被其他高成本（例如障碍物）阻断时，才会穿越这些区域。


    Now, let''s head to Unreal Engine 4 editor and get ready to create our own obstacles
    to see this behavior in action. We will also touch on **导航修改器体积** and how you
    can use it in Unreal Engine 4.


    现在，让我们前往 Unreal Engine 4 编辑器，准备创建我们自己的障碍物来观察这种行为。我们还将涉及 **导航修改器体积** 以及如何在 Unreal
    Engine 4 中使用它。


    ## 回到编辑器


    Let''s navigate and look at the **模式** window. In the first tab, we want to click
    on **体积**. Now, within **体积**, you''ll see 导航修改器体积, and this will need to be dragged
    into the level:


    让我们导航并查看 **模式** 窗口。在第一个选项卡中，我们想要单击 **体积**。现在，在 **体积** 中，你会看到 导航修改器体积，这需要被拖入关卡：


    - 1. Drag **多个导航修改器体积** into the level. We want these volumes to block the direct
    paths between the waypoints we created earlier.


    - 2. So, after dragging the volumes out, we should have some nice separation between
    **导航修改器体积** and **路点**. The screen should look similar to the following screenshot:


    ![](img/aaaa027482c900e215ba6bfab3c17337_87_0.png)


    - 3. Next, we need to create **导航区域**, which will override the properties of the
    Navigation Mesh that **导航修改器体积** overlaps.


    ## 导航区域类


    This class is responsible for applying the adjusted cost of NavModifierVolume.
    This also goes to say that NavModifierVolume is used to affect the Navigation
    Mesh.

    NavArea classes are used explicitly to override properties or functions in the
    affected Navigation Mesh. Today, we will create two NavArea classes to represent
    two different types of environmental situations. One will be the representation
    of water and the other, mud. The theory behind this is that water would have a
    high entry cost because it is not as fast as stepping in mud, but mud would have
    a low travel cost increase because it''s not easy to walk in.


    这个类负责应用 导航修改器体积 的调整成本。这也意味着 导航修改器体积 用于影响导航网格。

    导航区域类用于明确覆盖受影响的导航网格中的属性或函数。今天，我们将创建两个 导航区域 类来表示两种不同的环境情况。一个代表水，另一个代表泥浆。其理论是，水会有较高的进入成本，因为它不像踩在泥浆中那么快，但泥浆的行进成本增加较低，因为在泥浆中行走不容易。


    With this in mind, let''s move on to the next step, which is creating different
    NavArea classes to apply to our NavModifierVolume actors:


    考虑到这一点，让我们继续下一步，即创建不同的 导航区域 类以应用到我们的 导航修改器体积 actor 上：


    - 1. Right click on our Blueprint folder within Content Browser and go to Blueprint
    Class.

    - 2. From there, we want to go to Custom Classes at the bottom of the window.

    - 3. Search for NavArea, and let''s create a new subclass from this.

    - 4. After creating one more NavArea, let''s name one AreaOfMud and the other,
    AreaOfWater.

    - 5. Double-click on AreaOfMud, and let''s go to Default Properties.

    - 6. In there, you will see Default Cost and Fixed Area Entering Cost.

    - 7. We want the Default Cost value to be 2.5, and this will affect the NavModifierVolume
    actor it belongs to.

    - 8. For Fixed Area Entering Cost, we will leave this at 0.0 for mud. Lastly,
    change the Draw Color color so that we know what''s affecting the Navigation Mesh.
    As we stated earlier, entering mud is relatively easy in comparison to water:


    ![](img/aaaa027482c900e215ba6bfab3c17337_88_0.png)


    - 9. Let''s close this and then open AreaOfWater.

    - 10. We want to change **默认成本** to **1.5**, and let''s change **固定区域进入成本** to
    **35**. These values could be tuned according to the specific game you are working
    on. And of course, change **绘制颜色** to something similar to light blue to represent
    water.

    - 11. Save and close and then go back to the editor!

    - 12. Now, let''s go and apply these NavAreas to the NavModifierVolumes we placed
    on the level earlier.

    - 13. Once you do that, you should now see **绘制颜色** updated. Let''s hit **开始游戏**
    and now observe our AI!


    ![](img/aaaa027482c900e215ba6bfab3c17337_89_0.png)


