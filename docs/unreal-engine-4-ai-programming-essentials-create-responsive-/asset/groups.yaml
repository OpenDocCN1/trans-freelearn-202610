    +   1. So, with this in mind, let''s head to the Content Browser and select our
    AI folder. Right-click on the folder and go to Misc and then to Environment Query.
    Name it EQS_PointsAround.


    +   2. Let''s open this and go to root. In here, you''ll notice a similar visual
    interface to that of Behavior Tree. Pull from the root and find SimpleGrid. This
    will generate a grid of items around our actor to be scored and returned to the
    requester.


