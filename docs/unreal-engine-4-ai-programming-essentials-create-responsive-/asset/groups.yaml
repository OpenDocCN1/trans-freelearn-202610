    - 7. 右键单击 **事件图** 并搜索 **获取受控 Pawn**。

    - 8. 从 **获取受控 Pawn** 的 **返回值** 引脚拉出 **获取角色位置** 节点。

    - 9. 从 **获取角色位置** 的 **返回值** 引脚拉出一个向量，然后将其放置在空白区域。

    - 10. 搜索 **按通道线追踪**，它位于 **碰撞** 类别下，如下图所示：


    ![](img/aaaa027482c900e215ba6bfab3c17337_45_0.png)


    ## 线追踪


    我们将使用此功能从玩家位置向角色前方 255 单位进行追踪。如果有任何物体与追踪发生碰撞，我们将根据 Pawn 的旋转使其面向右侧。此简单检查足以让我们的机器人沿着墙壁无限期奔跑；因此，执行以下步骤：


    - 1. 从 获取角色位置 拉出 返回值 引脚并放置。然后，搜索 向量 + 向量。

    - 2. 我们现在需要选择 获取受控 Pawn，并从中拉出 获取角色前向量。它包含朝向 Pawn 前方的方向向量信息。

    - 3. 因此，我们将 返回值 乘以 255。这是我们要添加到角色位置的向量。这会在 Pawn 当前位置前方添加 255 个单位。

    - 4. 现在，我们需要获取 **按通道线追踪** 节点 **终点** 引脚的加法结果。这将直接在我们的 Pawn 前方进行追踪：


    ![](img/aaaa027482c900e215ba6bfab3c17337_46_0.png)


    - 5. 再次从 向量 + 向量 节点拉出，这次我们将其插入到 **移动到位置** 节点的 **目标** 引脚中。这将使角色无限期向前移动：


    ![](img/aaaa027482c900e215ba6bfab3c17337_47_0.png)


    让我们试试吧！点击 **模拟**，观察你的角色无限期向前移动！唯一的问题是它目前还无法避开墙壁。我们将通过引入 **选择向量** 节点来改变这一点，当 **线追踪**
    检测到碰撞时，该节点会选择不同的方向：


    ![](img/aaaa027482c900e215ba6bfab3c17337_47_1.png)


    - 6. 再次，我们将从 **获取受控 Pawn** 节点拉出并搜索 **获取角色右向量**。

    - 7. 从此节点，我们将拉出向量并将其乘以 512。

    - 8. 我们将此添加到 Pawn 的当前位置。因此，类似于之前向前移动的做法，我们将向 Pawn 当前位置的右侧添加 512 个单位：


    ![](img/aaaa027482c900e215ba6bfab3c17337_48_0.png)


    - 9. 在 **事件图** 部分右键单击并搜索 **选择向量**。

    - 10. 从 **按通道线追踪** 节点拉出 **返回值** 并将其连接到 **选择向量** 节点。然后，选择 **A**。

    - 11. 现在，从右侧位置拉出到 **选择向量** 节点的 **A**。

    - 12. 然后，从前方位置拉出到 **选择向量** 节点的 **B**。

    - 13. 选择 **选择向量** 节点，并从 **返回值** 拉出到 **移动到位置** 的 **目标** 引脚。

    - 14. 选择节点并创建注释：


    ![](img/aaaa027482c900e215ba6bfab3c17337_48_1.png)


    让我们看看在游戏中是这个效果：


    ![](img/aaaa027482c900e215ba6bfab3c17337_49_0.png)


    似乎运行完美！这将为本项目的下一次添加创建追逐效果。


    ## 审查当前进度


    现在，我们已经创建了 Hero 角色，虽然他并不算什么英雄，只是无限期奔跑，但那是另一个故事。以下是当前的更改：


    - 我们更新了 AI 指令

    - 我们演示了一个基本的感官组件


    现在，让我们继续创建敌人 AI。


    ## 敌人逻辑


    敌人需要能够找到并朝 Hero 奔跑。我们将通过搜索 Hero 角色、计算方向差异，并使敌人面向 Hero 来实现这一点。


    ## 添加敌人 AI


    让我们回到虚幻引擎并关注内容浏览器。我们现在需要一个对手。要添加它，请执行以下步骤：


    - 1. 右键单击并选择 蓝图。

    - 2. 在窗口的下端，让我们放下所有类并搜索 AIController。

    - 3. 在 Controller 下选择 AIController 并在右下角点击 Select。

    - 4. 我们将此 AIController 命名为 Enemy。

    - 5. 打开 Enemy AIController 并转到 事件图 部分。


    首先，我们必须找到 Hero，然后将其存储在局部变量中以便随时使用。要执行此操作，请执行以下步骤：


    - 1. 在 事件图 的空白区域右键单击并搜索 开始玩游戏时。

    - 2. 从 exec 引脚拉出并搜索 获取指定类的所有角色。

    - 3. 将 角色类 引脚设置为 Hero。

    - 4. 从 **输出角色数组** 拉出并搜索 **带中断的 ForEach 循环**：


    ![](img/aaaa027482c900e215ba6bfab3c17337_51_0.png)


    我们想要在返回的 `MyCharacter` Pawn 中为 `Hero` 类添加过滤器。要执行此操作，请执行以下步骤：


    - 1. 从 **数组元素** 引脚拉出并搜索 **转换为 MyCharacter**。

    - 2. 然后，从 **作为 MyCharacter** 引脚拉出并搜索 **获取控制器**。

    - 3. 使用 **获取类** 节点获取控制器的类。

    - 4. 使用 **类 = 类** 节点比较 `Hero` 类。

    - 5. 从 **相等** 的返回值创建一个 **分支** 节点。

    - 6. 从 **循环体** 引脚链接新创建的分支。

    - 7. 从 **分支** 节点的 **真** 执行引脚创建 **设置** 节点。

    - 8. 然后，从刚才创建的纯 cast 拉出到 **设置** 节点。


    - 9. 我们想要对此进行注释并将此部分命名为 查找 Hero：


    ![](img/aaaa027482c900e215ba6bfab3c17337_52_0.png)


    我们现在需要不断更新敌人的指令，使其朝向正在逃跑的 Hero 角色移动。请注意，有一些节点可以直接实现这一点，例如 Simple Move to Actor、AI
    MoveTo 等等。我们将实现类似行为，以让您了解这在内部是如何完成的。执行以下步骤：


    - 1. 在 **事件图** 部分右键单击并搜索 **每帧事件**。

    - 2. 从 exec 引脚拖放并搜索 **延迟**。

    - 3. 将 **持续时间** 引脚设置为 .05 秒。

    - 4. 从 **完成** 拉出并创建新节点 **移动到位置**：


    ![](img/aaaa027482c900e215ba6bfab3c17337_52_1.png)


    现在，我们需要获取从 Enemy 到 Hero 的方向，并沿此方向移动 Enemy。我们可以这样做：


    - 1. 获取 `Hero` 变量并将其放置在 **延迟** 节点附近。

    - 2. 从 `Hero` 变量获取角色的位置。

    - 3. 从 **获取角色位置** 节点的 **返回值** 拉出，放置并搜索 **获取方向向量**。

    - 4. 现在，右键单击并搜索 **获取受控 Pawn**。

    - 5. 从 **获取受控 Pawn** 的 **返回值** 引脚拉出并获取 **获取角色位置**。

    - 6. 然后，从 **获取角色位置** 节点的 **返回值** 引脚拉出并插入到 **获取方向向量** 节点的 **起点** 引脚中。

    - 7. 从 **获取方向向量** 节点的 **返回值** 拉出并使用 **根据 X 生成旋转**。

    - 8. 从 **根据 X 生成旋转** 拉出并使用 **获取前向量**。

    - 9. 现在，从 **获取前向量**，我们将其乘以 **255** 以获取前向量方向上的 **255** 个单位。

    - 10. 最后，我们将此添加到 Hero Pawn 的 **获取角色位置** 节点。

    - 11. 加法的结果是 **移动到位置** 的目标：


    ![](img/aaaa027482c900e215ba6bfab3c17337_53_0.png)


    - 12. 现在，在此周围放置注释并将其命名为 `追逐 Hero`。


    全部保存！


    现在，返回到 视图 部分并点击 **模拟**。您现在应该看到我们的 Hero 角色正在向前奔跑，并在检测到前方有障碍物时向右转弯。我们的 Enemy 角色正在紧随其后快速追赶。现在，想象一下如果你处于
    Hero 角色的位置；你将会感到极度恐惧！


    ## 摘要


    这里我们演示了如何创建一个追赶玩家或另一个 AI 的敌人 AI。这种行为可用于创建挑战并为玩家提供反馈，从而带来更好的游戏体验。AI 当然可以更加复杂，但只有在需要改善游戏体验时才应这样做。在下一章中，我们将向
    AI 角色添加随机性和概率，以使其行为更加有趣。


    '
