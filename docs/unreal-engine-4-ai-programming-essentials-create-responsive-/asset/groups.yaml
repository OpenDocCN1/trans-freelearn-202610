  mdcn: "\n\n这里，我们将使用第三人称射击模板，这使我们可以轻松观察角色在环境中的移动方式。执行以下步骤：\n\n- 1. 如果您尚未进入新建项目窗口，请前往：\n\
    \n  ![](img/aaaa027482c900e215ba6bfab3c17337_35_0.png)\n\n- 2. 选择第三人称蓝图项目：\n\n\
    \  ![](img/aaaa027482c900e215ba6bfab3c17337_35_1.png)\n\n- 3. 按您喜欢的方式命名项目；我将我的项目命名为\
    \ ImprovedAI。然后，在窗口右下角点击“创建项目”。\n\n## Environment\n\n尽管我们使用的是第三人称蓝图模板，但这些技术也可以用于其他模板。你必须应用在这里所学的知识。话虽如此，你开始理解到，这些技术是工具。通常认为，了解如何创建状态、感官组件、导航组件等是一回事，但使用什么以及如何使用，取决于\
    \ AI 环境。\n\n## Prerequisites\n\n请注意，我的窗口和函数名称可能不同。我将带您了解我的设置，以便您可以拥有与我相同的配置。执行以下步骤：\n\
    \n- 1. 让我们转到编辑器偏好设置中的“常规 | 外观”，在“用户界面”下，选择“用户小型工具栏图标”选项，并取消选择“显示友好变量名”选项。您的设置应如下图所示：\n\
    \n  ![](img/aaaa027482c900e215ba6bfab3c17337_36_0.png)\n\n- 2. 在项目中导航到 **Blueprints**\
    \ 文件夹：\n\n  ![](img/aaaa027482c900e215ba6bfab3c17337_37_0.png)\n\n- 3. 现在我们将控制我们的载体。右键单击并点击\
    \ **Blueprint** 选项以创建蓝图：\n\n  ![](img/aaaa027482c900e215ba6bfab3c17337_37_1.png)\n\
    \n- 4. 接下来，我们将创建 AIController 类。转到自定义类并输入 AIController。选择它，然后点击“选择”，如下图所示：\n\n\
    \  ![](img/aaaa027482c900e215ba6bfab3c17337_38_0.png)\n\n这将创建蓝图，我在此处将其命名为 MyController。\n\
    \n## Using our new AIController class\n\n您是否注意到，一名玩家可以扮演任何他们想要的角色？这就是创建载体和控制器的层次结构。控制器是玩家在游戏大厅等待一段时间后继承的内容。它用于管理来自玩家的输入和连接。此类带有额外函数，可帮助导航机器人，并能为控制器分配行为树。在此演示中，我们将介绍\
    \ AIController 类的一些基础知识。\n\n## Assigning the AIController class\n\n现在，既然我们拥有创建\
    \ AI 所需的一切，我们将把 MyController 类分配给 MyCharacter 基础。为此，请转到 MyCharacter 蓝图中的“默认值”部分。搜索\
    \ AIController 类并将其设置为 MyController，如下图所示：\n\n  ![](img/aaaa027482c900e215ba6bfab3c17337_39_0.png)\n\
    \n当角色未被控制时，它会自动由 AIController 控制。因此，通过我们刚刚所做的更改，控制我们 MyCharacter 蓝图的默认 AIController\
    \ 类将是 MyController。\n\n## Placing the pawn\n\n我们假设您明白这样简单的任务！让我们通过从内容浏览器中拖放我们新设置的载体，将其放入这个明亮美丽的世界中：\n\
    \n  ![](img/aaaa027482c900e215ba6bfab3c17337_40_0.png)\n\n将 MyCharacter 蓝图拖放到关卡中以创建载体\n\
    \n> 有很长一串人因为崩溃和其他意外而丢失工作；如果您想加入他们，请跳过此步骤。否则，在对关卡进行重大更改时，请转到“文件 | 保存全部”。\n\n##\
    \ Sending the instructions\n\n既然我们的项目已经设置并保存——或者对于我们那些勇敢的家伙来说，可能未保存——让我们继续进入有趣的部分：蓝图！让我们来看看发送指令的步骤：\n\
    \n- 1. 在 **内容浏览器** 中打开您的 `MyController` 蓝图，并缩放到 **EventGraph**：计划是让我们的机器人随机移动。这将以简单的方式构建，因此我们将手动进行计算。\n\
    - 2. 首先，让我们创建一个 **Event Tick** 节点，它将在游戏运行时的每一帧触发。\n- 3. 我们将添加一个 **Delay** 节点，以接收来自\
    \ **Event Tick** 的信号，并将 **Duration** 引脚设置为 **1**。\n- 4. 接下来，我们将添加一个 **Move To\
    \ Location** 节点，它将向 `AIController` 类发送信号，指示其载体移动到指定的目标点。\n- 5. 由于我们此时未使用 **Path\
    \ Finding**（这是我们稍后将要涉及的主题），请转到 **MoveToLocation** 节点并将 **bUsePathFinding** 设置为\
    \ false 或保持未选中状态。\n\n您的 `MyController` 类的 EventGraph 应类似于以下屏幕截图：\n\n  ![](img/aaaa027482c900e215ba6bfab3c17337_41_0.png)\n\
    \n- 6. 在 **MoveToLocation** 节点准备就绪后，我们现在需要为其提供一个随机位置。我们将获取受控载体的当前位置，为 **X** 和\
    \ **Y** 变量创建一个值为 -255 到 255 的随机额外向量，并将 **Z** 保留为 **0.0**。然后，我们将受控载体的位置添加到我们刚刚创建的向量中。您的蓝图应类似于以下设置：\n\
    \n  ![](img/aaaa027482c900e215ba6bfab3c17337_42_0.png)\n\n- 7. 让我们完成此步骤，并将这个新的随机位置蓝图移动到我们之前设置的\
    \ **MoveToLocation** 节点。现在，让我们将两个向量相加的结果连接到 **MoveToLocation** 节点的目标位置。完成后，您的蓝图设置应类似于以下预览：\n\
    \n  ![](img/aaaa027482c900e215ba6bfab3c17337_42_1.png)\n\n全部保存！\n\n## Small tips\
    \ on MoveToLocation\n\n以下是 MoveToLocation 的一些基本提示：\n\n- **AcceptanceRadius**：这允许您增加完成移动可接受的半径。假设有一个拿着剑的敌人想要攻击玩家。**AcceptanceRadius**\
    \ 选项将帮助您定义该敌人应距离其目标多远——理想情况下为 1 米——然后执行挥剑的攻击动画。\n- **bStopOnOverlap**：这告诉您的机器人，如果它与点重叠而不是精确地到达该点，则停止。这将考虑附加到机器人上的碰撞网格的半径。\n\
    - **bUsePathFinding**：如果选中此项，机器人将使用 **NavMesh** 选项来查找其目的地。如果未选中，机器人将简单地沿直线移动到目的地，不考虑任何障碍物。这在某些情况下有助于节省性能。\n\
    - **bProjectDestinationToNavigation**：这在使用前将位置投影到导航数据上。这有助于验证目标角色的位置——即它是否存在于可玩区域中。\n\
    - **bCanStrafe**：这决定 AI 是否可以在 **NavMesh** 上对角移动。\n- **FilterClass**：这允许您使用 **AreaClass**，这是另一种影响\
    \ AI 导航的导航组件。这会更改 **NavMesh** 区域的排斥或独占访问等内容，并改变导航成本。\n\n## Reviewing the current\
    \ progress\n\n您可以擦去额头上的汗水；艰苦的工作才刚刚开始。那么，我们迄今为止做了什么？\n\n- 我们已设置 AI 项目\n- 我们已使用新的\
    \ AIController 设置我们的载体\n- 我们已使用 AIController 向我们的载体发送了指令\n\n我们已经完成一半。这个简单的设置允许我们将所有指令放在\
    \ AIController 上，它将控制我们从示例内容中创建的载体。AIController 被分配给载体，这意味着多个载体可以共享同一个 AIController。如我们所见，我们的\
    \ AI 现在无限运行。完美！让我们继续进入本章的第二部分！\n\n## Adding the challenge\n\n现在，我们将向 AI 角色添加射线检测。在我们的演示中，我们将使用射线检测来检测载体前方的墙壁。在\
    \ AI 中使用射线检测的其他示例包括视线检查、获取表面旋转和获取附近的角色。\n\n让我们返回到虚幻引擎关卡编辑器，并在 **内容浏览器** 中查找。执行以下步骤：\n\
    \n- 1. 将我们的 `MyController` 蓝图重命名为 `Hero`；此角色将在此场景中充当玩家。\n- 2. 打开我们的 `Hero` 蓝图并转到\
    \ **EventGraph** 部分。\n- 3. 现在，除了 **Event Tick** 和 **Move to Location** 节点外，删除每个节点。我们将用新的蓝图脚本替换这些节点：\n\
    \n  ![](img/aaaa027482c900e215ba6bfab3c17337_44_0.png)\n\n删除不必要的节点后的蓝图\n\n- 4.\
    \ 从 **Event Tick** 节点的返回执行引脚拖出并创建一个 **Delay** 节点。\n\n"
