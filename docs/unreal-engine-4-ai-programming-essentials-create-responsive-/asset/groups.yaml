    \nWhen a character isn't possessed, it will automatically be possessed by AIController.\
    \ So, with the change we just made, the default AIController class that possesses\
    \ our MyCharacter blueprint will be MyController.\n\n## Placing the pawn\n\nIt's\
    \ assumed you understand such a simple task! Let's place our newly set up pawn\
    \ into the bright beautiful world by dragging and dropping it from Content Browser:\n\
    \n  ![](img/aaaa027482c900e215ba6bfab3c17337_40_0.png)\n\nDrag and drop MyCharacter\
