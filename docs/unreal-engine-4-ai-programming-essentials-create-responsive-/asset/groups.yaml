    在窗格中有几个字段我们需要注意：


    - 让我们从 Flow Control 开始。它有两个属性：Notify Observer 和 Observer aborts。Notify Observer
    告诉 Flow Control 触发哪个操作。当进入此树的计算条件发生变化时，On Result Change 会触发。因此，如果我们最初在叫，但现在处于空闲状态，树的
    Flow Control 将触发一个 Abort 事件。树中哪个部分被中止由 Observer aborts 控制。第一个选项是 Self。这很简单，即它中止此树内的进一步执行。第二个选项是
    Low Priority。此选项基本上表示树的其余部分将被中止。如果你希望整个树重新开始，这很有用。最后一个选项只是我提到的前两个选项的组合。


    - 下一个字段是 **黑板**，它负责告诉装饰器哪个条件返回 **真**。在此示例中，我们要将 **黑板键** 设置为 **状态**。注意属性会发生变化。将
    **键查询** 值更改为我们应用到 **键** 值的条件。最后，将 **键** 值设置为我们正在检查条件的值。


    让我们回到我们的行为树：


    - Sequence 分支中的第一个节点是一个 **选择器** 节点。我们希望这种行为，因为我们有两个想要检查的条件，但我们知道同一时间只能满足一个条件。我们需要在这个
