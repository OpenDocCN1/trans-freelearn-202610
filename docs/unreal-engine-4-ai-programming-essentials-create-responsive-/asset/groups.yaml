    # Steering behavior: Flocking


    Flocking is a steering behavior that combines Separation, Cohesion, and Alignment.
    Separation behavior avoids other nearby agents. Cohesion behavior keeps the agents
    in a group. Alignment behavior averages the forward direction by aligning with
    nearby agents.


    What we will do here is replicate the steering behavior, flocking, in blueprint.
    We will also use UMG to aid the manipulation of weights for each behavior. Let''s
    start now and create the variables we will need in this part of the chapter.


