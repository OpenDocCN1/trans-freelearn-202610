    ## 状态机器


    传统上，我们会默认使用 AI 行为树，任何使用 UE4 的人都可以使用它。但是，在我们的场景中，我们将把行为树的工作分解为直接在蓝图中编写的组件。因此，我们需要创建的下一件事是一种维护状态的方式。然后，我们可以通过更新变量本质上创建一个状态机，从而允许我们的
    AI 通过控制执行流程在不同状态之间切换。


    我们将使用一个事件来建立这个，当我们指定的条件满足时，该事件会更新我们的状态。要开始，让我们继续下一步！


    - 1. 首先，让我们在我们的 AI控制器 中创建一个名为 **状态** 的新 Int 变量。这将维护我们状态机中的当前状态。

