    our Follower and Leader actors when operating in a free setup. We also need `LeaderDirection`
    to hold the direction that the agent should be moving in. Lastly, we can mark
    agents to be followers or leaders by enabling or disabling a Boolean called `isLeader`.


    With these variables, we can keep track and prevent leaders from following followers,
    which can create interesting movement behavior but not what we intend to make
    happen in this demonstration.


    ### Follow or lead


    Let''s open our `FlockingBall BP` class and view EventGraph. Find where we will
    update our `RelativeRotation` pin for our `Spring Arm` variable. Between this
    and `Calculate Direction`, we will add this new set of instructions:


    - 1. First, we need to reference any actor near our agent. We can do this by the
    `SphereOverlapActors` node. Right-click on the graph and search for this.

    - 2. Now, let''s get the `Get Actor Location` node. Right-click, find this, and
    plug it into `Sphere Pos` of the node we created in the previous step. Next, set
    the `Sphere Radius` value to `300`. Now, let''s pull from `Object Types` and create
    the `Make Array` node. So, we should populate `Object Types` with `Physics Body`.
    Next, we want to set our `Actor Class Filter` node to `Flocking Ball` to prevent
    unwanted results. Lastly, create another `Make Array` node, right-click on the
    graph, and search for it. Then, populate the first element with a reference to
    `Self`. Then, plug this array into actors to ignore. Comment this area `Search
    for nearby FlockingBalls`.

    - 3. Now, let''s focus on the `Out Actors` array. Right-click on the graph and
    search for `For Each Loop`. Let''s pull from `Array Element` and cast this to
    `FlockingBall`.


    We have to know whether the agent we attempt to follow is following us. Otherwise,
    we can experience unwanted movement behavior.


    - 4. From the Casting variable, let''s find the **Leader** variable and compare
    it to **Self** with equal (==). Take the **Condition** pin and create a **Branch**
    node. If it is **False**, we need to check now whether we are Leader, and if we
