    # Preface


    Artificial Intelligence (AI) is an essential part of any game. It makes the virtual
    world we create more immersive and fun to play in. Game AI is different from the
    general scientific AI that we know; it is more targeted to solve key problems
    in game design, including navigation, which is how a **nonplayer character** (NPC)
    should move from one point to another and avoid obstacles; decision making, which
    is how to perform certain actions based on different situations; and environment
    sensing, which is the ability to understand what exists in the environment and
    what its status is. These techniques make it possible to create a dynamic and
    realistic gameplay so that the players will be more engaged in the world that
    is created for them.


    Game AI is complicated and brings a lot of challenges if you want to develop on
    your own. Unreal Engine 4 is a powerful game engine that provides rich functionalities
    to create cross-platform 3D and 2D games. It is well known for its advanced graphics
    and highly customizable components. Now, it is free to use and open source, which
    makes it one of the most popular game engines out there. Unreal Engine 4 comes
    with a complete suite of tools for game AI, including NavMesh, Behavior Trees,
    and Environment Query System. With these tools in hand, it is much easier to bring
    AI to your games. For game designers, you can even use a visual scripting tool
    called Blueprints to build your game logic, including AI, by just connecting nodes
    and without even writing a single line of code.


    This book is our effort to introduce these wonderful tools in Unreal Engine 4
    to build game AI to game creators who are interested in making their virtual world
    more interesting. It will cover all the components we have mentioned and show
    you how to use each tool to build different character behaviors and combine them
    to create more complex scenes.


    We can''t wait to see what you will create!'
