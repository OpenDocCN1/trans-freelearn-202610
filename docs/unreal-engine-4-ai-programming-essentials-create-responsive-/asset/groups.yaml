    ## 路点


    与 **AI 感知** 项目类似，这些路点将对下一个路点有一个引用。两个路点之间的这种简单链接允许我们为 AI 创建可导航的路径。


    现在，我们应该开始制作这些路点；执行以下步骤：


    - 1. 首先，让我们在 **文件夹** 部分内的空白处右键单击并进入 **蓝图**。在底部，在 **所有类** 中搜索 **目标点**。选择它并单击 **选择**
    以创建它。然后，将其命名为 **路点** 并在 **事件图** 中打开它。

    - 2. 在左侧 **我的蓝图** 下，添加一个名为 **下一个路点** 的路点变量。我们将使用它来查找下一个要遍历的路点。

    - 3. 在关卡中添加四个路点，并使用 **下一个路点** 变量将它们相互链接。连接应类似于 A->B->C->D->。然后，**D** 应连接到 **A**，从而创建一个循环。


    ## 行为树组合节点、任务、装饰器和服务


    任务由 **组合节点** 执行。**组合节点** 很重要，因为它们直接影响 **行为树** 内的流程控制。


    在撰写本文时，**组合节点** 有三种形式：**序列**、**选择器** 和 **简单并行**。以下是各自的描述：


    - **序列**：这将执行每个节点，在最后一个节点上返回成功；但是，如果任何节点失败，它将立即返回失败并中止其余叶子。

    - **选择器**：这将执行每个节点，立即返回成功并中止其余叶子。如果一个节点返回失败，它将继续只在最后一个子节点返回失败时才返回失败。

    - **简单并行**：这将同时执行一个任务和一个子树，这允许你行走，并允许另一个决策树位于行走任务的顶部，例如。


    任务通常是被调用的最后一个节点，因为它们包含直接影响 AI 行为的代码。我们将制作自己的任务，并学习它如何与 **行为树** 通信。


    **装饰器** 在 **组合节点** 或任务的入口处执行，它可以确定是否应该执行 **组合节点** 或节点。这些非常适合为特定任务创建自定义检查。例如，仅当具有
    **门** 和 **野兽** 模式时才执行 **破门**。


    **服务** 在子树处于活动状态时执行。这意味着它有一个可用的 tick。这使我们可以收集或更新信息以在游戏中立即进行更改。例如，射击服务将负责在玩家处于视线范围内时进行射击。这还允许您管理射击，并在不希望发生时防止中断。


    在本节中，我们将使用除 **简单并行** 之外的所有内容。让我们开始吧！

