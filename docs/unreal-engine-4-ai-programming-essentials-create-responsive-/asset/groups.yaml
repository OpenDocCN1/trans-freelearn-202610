    - **Cell Size**: This is the 2D size of the voxel, basically a 3D pixel, which
    represents a space to navigate. This is the floor area of the voxel. This directly
    correlates to the resolution of NavMesh. Smaller sizes here generate more voxels,
    resulting in better movement precision. Unfortunately, performance takes a hit
    during the generation of NavMesh due to this.

    - **Cell Height**: This is the height of the voxel. This value correlates to **Agent
    Max Step Height**, and it is suggested to be kept at half its value. NavMesh will
    not be generated if the **Cell Height** value isn''t at least .1 less than that
    of **Agent Max Step Height**.

    - **Tile Size UU**: When this is at lower values, it increases the NavMesh Generation
    performance. Try enabling **Draw Poly Edges** to see this in action.

