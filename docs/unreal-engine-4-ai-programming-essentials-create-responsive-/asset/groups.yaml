    Behavior Tree is a tree of nodes whose structural diagram dictates the flow control,
    each leaf node representing the actual code for the AI to execute. This results
    in the AI making a sequence of decisions appropriate to the input it receives.
    To see a sample of what we will end up making today, here is how Behavior Tree
    looks in Unreal Engine 4:


    ![](img/aaaa027482c900e215ba6bfab3c17337_155_0.png)


    There are many forms of state machines available in the world. Behavior Tree is
    a form of a tree with a subtree of nodes. It has composites that allow you flow
    control, resulting in the execution of leaves, which also have additional flow
    control. This level of control allows you to create deep Behavior Trees with a
