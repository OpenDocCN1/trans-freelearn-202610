    \ **AreaClass**, which is another navigation component that affects the navigation\
    \ of the AI. This effects changes such as exclusion or exclusive access to areas\
    \ of **NavMesh** and alters the navigation cost.\n\n## Reviewing the current progress\n\
    \nYou can wipe the sweat from your forehead; the hard work has yet to begin. So,\
