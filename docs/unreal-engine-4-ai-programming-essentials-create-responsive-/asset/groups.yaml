    - 8. We need to pull a **Compare Int != Int Boolean** operation and compare our
    results from **Find** with -1. This will then be pumped into a **Branch** node.


    - 9. Now, when this **Branch** node returns **True**, this means that we are allowed
    to navigate to the current **Array Element** pin, and we should add it to our
    points to navigate to.


    - 10. Now, let''s create a new **Routes** array on our pawn to hold the waypoints
    we can navigate. Then, we will pull this node to the **Branch** node we just created
    and pull **Add** from the array node. This will allow us to quickly access the
    routes we have assigned to us.


    - 11. Now, we need to tell the pawn to navigate to the waypoint after this operation
    is completed. This can be done by pulling another **Routes** array out past the
    last nodes we placed.


    - 12. We want to shuffle our **Routes** array so that our next destination is
    random. You can do this by pulling from the array and searching for **SHUFFLE**.
    This should be called last before our next operation:


    ![](img/aaaa027482c900e215ba6bfab3c17337_84_0.png)


    - 13. Next, we have the location that the pawn needs to go to, and we need to
    tell the pawn to move. We have two options: the first is to provide the **Move
