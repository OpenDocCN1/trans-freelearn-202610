    Delay** 节点将继续被重置。一旦失去视线，另一条执行路径将执行 **DoOnce**，尝试重置我们 AI 的 **State** 变量。一旦 **Retriggerable
    Delay** 节点按指定的 **Chase Time** 值完成延迟，它将重置 **DoOnce**，从而允许我们的机器人重置其状态。执行以下步骤：


    - 1. 现在让我们查看刚才创建的 **Branch** 节点，从 **False** 引出并创建一个新的 **DoOnce** 节点。我们可以将 **Start
    Closed** 保留为默认值。


    - 2. 如果我们回溯到先前 **Branch** 节点的 **True**，我们可以从 **True** 引出，然后创建一个 **Sequence** 节点。


    - 3. 从第一个 **Then 0** 执行引脚引出并创建一个 **Retriggerable Delay** 节点。接下来，让我们将 **Chase Time**
    变量插入到 **Duration** 变量中。最后，让我们将 **Completed** 插入到我们先前创建的 **DoOnce** 节点的 **Reset**
    输入执行中：


    ![](img/aaaa027482c900e215ba6bfab3c17337_126_0.png)


    - 4. 回到 **Sequence** 节点，我们需要将 **Then 1** 路由到我们先前的 **Move To Actor** 节点，就像我们在 *状态转换*
    部分所做的那样。


    所以，当我们看到敌人时，我们将继续朝他们移动，直到失去敌人，届时它将切换到另一条执行路径。现在，如果你希望 AI 移动到敌人所在位置，你需要获取角色位置并执行此操作。这将导致
    AI 向敌人的最后已知位置移动，然后才最终被重置。


    - 5. 现在，聚焦于 **DoOnce** 节点，让我们从链中先前创建的 **getAiController** 节点引出。然后，在 **DoOnce**
    节点之后创建一个名为 **Stop Movement** 的新节点。这将取消任何朝向敌人的移动。


    - 6. 接下来，我们需要将 **Enemy Actor** 变量设置为 **null**。我们将把 **State** 变量设置为 **0**。最后，我们将调用
    **Next Route** 事件。强制 AI 再次返回航点之间的路由，我们将等待敌人出现在视线中。


    ## 模拟与游玩


    现在，如果我们点击 **Play**，应该能看到 AI 追逐你，直到你打破视线！


    因此，机器人将像之前一样进行路由，直到敌人进入视线范围。如果机器人处于状态 0，一旦 AI 感知组件检测到敌人，它将进入状态 1。接下来，如果这些敌人之一在视线范围内且我们没有当前敌人，我们将把状态改为
    2 并设置我们的敌人。最后，我们将继续朝敌人移动，直到失去对他们的视线，这会导致我们被重置回状态 0。下图说明了这些转换：


    ![](img/aaaa027482c900e215ba6bfab3c17337_127_0.png)


    这就是在没有行为树协助的情况下创建 AI 的方法。最终，你仍然需要创建一个状态机，因为这是编程中用于创建基于函数间共享变量相互转换的函数的基本方法。通过直接在蓝图中执行此操作，我们可以更深入地理解基于状态转换的行为控制机制，这对于简单的
    AI 行为很有帮助。


    ## 总结


    本章关于 AI Sense 组件的内容到此结束。这个工具非常棒，可以轻松地将新的响应式传感器集成到 AI 的输入中，而你无需从 Ray Traces 之类的东西自己创建它们。


    接下来，我们将专注于更高级的移动，例如使用 Unreal Engine 提供的一些工具让我们的 AI 避开障碍物，以及如何让我们的 AI 互相跟随，类似于小队的行为。


