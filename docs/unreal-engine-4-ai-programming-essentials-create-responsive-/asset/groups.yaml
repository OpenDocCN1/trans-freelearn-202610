    ## 摘要


    让我们花点时间简要讨论本章做了什么。首先，我们设置代理撞墙弹开。这让我们观察代理模拟移动以及四种行为如何影响它们。接下来，我们将实现 Follower 和
    Leader 行为，这会在模拟期间在代理中创建群组。


    我们做的最后一件事是实现群体移动，它分为三种不同的行为。第一种行为是 Alignment，负责使代理与附近代理对齐。第二种行为是 Cohesion，负责将代理引导向附近代理的中心。第三种行为是
    Separation，负责将代理引导远离附近代理。


    然后，我们仅仅创建了一个 UI 来控制在课程中创建的权重，并在模拟期间随时重置代理。


    既然我们已经介绍完不同的移动行为，是时候将本书中关于 AI 的所有演示内容结合起来了。在下一章中，我们将创建一个 AI 角色，它将巡逻、追击并摧毁任何敌人。那么，让我们进入下一章开始吧！


    ## 创建巡逻、追击和攻击 AI


    在本章中，我们将结合之前章节中使用的一些组件，包括 AI Sense 和其他组件，以便 AI 进行导航。然后，我们将在超时时间中添加一些随机性，这将使 AI
    追击其检测到的角色。现在，在本章中，我们可以使用 Behavior Tree 创建 AI，同时利用其他 AI 组件。这些组件的组合可以创建出响应迅速且可信的
    AI 行为。


    本章的目标是创建一个使用 Behavior Tree 向你开火的 AI；这个最后的 AI 组件将对你有帮助，因为没有完美的解决方案。因此，理解每个可用工具可以让你为自己的
    AI 用途利用每个组件的优势。这些工具让你能够创建出响应迅速且可信的 AI。


    ### 创建黑板


    黑板为行为树定义了局部变量空间。这些黑板还可以与同一黑板的其他实例同步。可以先创建黑板，因为你会发现自己经常修改它们，直到发现行为树所需的一切。


    我们将先创建黑板数据，然后将其提供给行为树。现在，让我们开始！以下是步骤：


    - 1. 在 Content 文件夹上右键点击，创建一个名为 AI 的新文件夹。


    - 2. 现在，在文件夹内右键点击，向下滚动找到 Artificial Intelligence；然后，点击 Blackboard。我们将其命名为 EnemyData。


    - 3. 我们将打开 EnemyData，然后创建两个供行为树使用的对象变量。将第一个命名为 TargetActor，下一个命名为 CurrentRoute。


    > 如果你使用 Enumeration，可以像我们为这些对象定义演员那样定义枚举。


    - 4. 点击 TargetActor，并在下拉菜单中选择 Key Type 选项。然后，将 Base Class 值更改为 Actor。我们希望对 CurrentRoute
    也做同样的操作，如下面的截图所示：


    ![](img/aaaa027482c900e215ba6bfab3c17337_154_0.png)


    行为树是节点组成的树，其结构图决定流程控制，每个叶节点代表 AI 执行的实际代码。这导致 AI 根据其接收到的输入做出一系列适当的决策。要查看我们今天要制作的示例，以下是
    Unreal Engine 4 中行为树的样子：


    ![](img/aaaa027482c900e215ba6bfab3c17337_155_0.png)


    世界上有许多形式的状态机可用。行为树是一种具有子树节点的树形结构。它具有允许你进行流程控制的合成节点，从而导致叶节点的执行，叶节点也具有额外的流程控制。这种控制级别允许你创建具有大量控制力的深层行为树。


    让我们开始创建我们自己的，并快速了解课程后期的预期：


    - 1. 我们将在 EventGraph 上右键点击，并向下滚动到 Artificial Intelligence。现在，点击 Behavior Tree
    并将其命名为 EnemyAI。


    - 2. 打开 EnemyAI，你应该在 ROOT 节点中看到已填充的 EnemyData。如果没有，点击 ROOT 节点并将 Blackboard 资产设置为
    EnemyData：


    ![](img/aaaa027482c900e215ba6bfab3c17337_156_0.png)


    ## 中距离攻击


    这将是从我们眼睛中心进行的射线追踪。这就是你攻击 AI 的方式，也是 AI 攻击你的方式。我们将简单地运行射线追踪，然后在此绘制一条调试线，从玩家额头创造出一道酷炫的红色光束！我们将测试它是否有效，之后，我们将其集成到两个玩家中。


    现在，要开始创建此功能，我们将做一些不同的事情来节省时间。我们将函数放入 Blueprint 函数库，以便在每个蓝图图表中共享。


    为了使函数对 AIController 和 PlayerController 都有用，我们希望将控制器作为输入，然后输出一个角色。此函数还将在必要时处理绘制红色光束：


    - 1. 让我们右键点击，进入 Blueprints，然后进入 Blueprint Function Library。将其命名为 EnemyLibrary
    并打开它。


    - 2. 在左侧，添加新函数。将其命名为 LaserFromController。将第一个输入设置为名为 theController 的控制器，然后输出名为
    Hit Actor 的角色。最后，创建名为 foundActor 的局部变量。将类型设为 Actor。


    - 3. 从控制器拉出并搜索 Get Controlled Pawn。然后，从这里，我们将基于角色的旋转创建射线追踪。从 Get Controlled Pawn
    拉出并搜索 Get Actor Forward Vector。


    - 4. 我们希望将 Get Actor Forward Vector 乘以 9999999。


    - 5. 返回步骤 3 中的 Get Controlled Pawn。然后，将其转换为 ThirdPersonCharacter，现在我们可以访问 Mesh
    变量。我们想要使用 Get Socket Location 获取头部骨骼的位置。


    - 6. 然后，从 ReturnValue 拉出并找到 Vector + Vector；现在，在 Z 变量中添加 12.0：


    ![](img/aaaa027482c900e215ba6bfab3c17337_157_0.png)


    - 7. 现在，我们必须使用 Vector + Vector 节点将步骤 4 的结果与步骤 6 的结果相加。然后，我们将继续对多个对象进行射线追踪。搜索 LineTraceForObjects，然后将结果插入我们刚刚创建的节点的
    End 引脚。


    - 8. 现在，让我们将先前步骤中创建的节点的 Start 值设置为来自 Vector + Vector 节点的输出到起点。然后，我们应该看到一束光从他头部开始并在空间中向前绘制。


    - 9. 从 Object Types 拉出并创建一个数组；然后，填充 Pawn。


    - 10. 从 ActorsToIgnore 拉出并创建一个数组；然后，将 Cast to ThirdPersonCharacter 节点填充到第 0 个元素。


    - 11. 从 LineTraceForObjects，拆分 OutHitResult。现在，从 OutHit bBlockingHit 拉出并搜索 Branch。


