    # # Environment Query System


    I want to cover this more in the next chapter, which covers how our AI can sense
    the environment, but I will at least introduce the idea and how we will use it
    today. Environment Query System is responsible for allowing the context object
    to call a query request to generate information based on filters and the test
    applied to the request. A query would contain a template of instructions for EQS
    to run. So, for example, if you want to scan an area for possible hiding places,
    you can scan for those actors that represent the hiding places. Then, you can
    apply filters to your query to get rid of the results you don''t want to score
    and score your results based on direction from enemy for the most optimal hiding
    position.'
