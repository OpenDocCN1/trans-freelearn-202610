  - '[PAGE 165]


    # # BT Composites, Task, Decorator, and Service


    Tasks are executed by composites. Composites are important because they directly
    affect the flow control within your Behavior Tree.


    Composites come in three forms at the time of writing this: Sequence, Selector,
    and Simple Parallel. Here''s a description of each:


    +   - **Sequence**: This executes each node, returning success on the last node;
    however, if any node fails, it will immediately return failure and abort the rest
    of the leaves.

    +   - **Selectors**: This executes each node, returning success immediately and
    aborting the rest of the leaves. If a node returns failure, it continues to only
    return failure if the last child returns failure.

    +   - **Simple Parallel**: This executes one task and a subtree at the same time,
    which allows you to walk and allow another tree of decision making to be at the
    top of the walk task, for example.


    Tasks are usually the last node in the change to be called as they contain the
    code that would affect the AI actions directly. We will make our own task and
    learn how it communicates with the Behavior Tree.


    **Decorators** are executed on the entry of a composite or task, which can determine
    whether the composite or node should be executed. These are great to create custom
    checks for this specific task. For example, it only executes Break Door if it
    has the Door and Beast modes.


    **Services** are executed while a subtree is active. This means that it has an
    available tick. This allows us to gather or update information to make immediate
    changes in game. The shooting service, for example, would be responsible for shooting
    whenever the player is in line of sight. This also then allows you to govern the
    shooting and prevent interruptions when you don''t want them.


    In this section, we will use everything except Simple Parallel. Let''s begin!'
