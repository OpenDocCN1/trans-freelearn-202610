    compare it to **Self** with not equal (**!=**). Create an **AND** logic gate and
    connect the first pin to the results of the not equal (**!=**) condition.

    - 10. Next, let''s grab the **Follower** variable from the reroute. Then, compare
    this node using equal (**==**). Next, connect this to the **AND** logic gate in
    the previous step.

    - 11. Lastly, connect this **AND** logic gate to the **Branch** node. If this
    node returns **True**, then let''s set the **Follower** pin from the reroute.
    Plug in a reference to **Self** into the **Follower** pin. Then, set the local
    **Leader** variable from reroute. Comment this area **If we don''t have a leader,
    and we are not one. Find one:**


    ![](img/aaaa027482c900e215ba6bfab3c17337_139_0.png)


    - 12. Now, go to the **Completed** pin of the **For Each Loop** node. Let''s create
    a local **Leader** variable and check whether it is valid using **Is Valid** (which
    is a function). Now, create a **Branch** node and plug in the **Condition** pin
