    ## 前言


    人工智能（AI）是任何游戏不可或缺的一部分。它使我们创建的虚拟世界更具沉浸感，也更好玩。游戏 AI 与我们所知的通用科学 AI 不同；它更侧重于解决游戏设计中的关键问题，包括导航，即
    **非玩家角色**（NPC）应如何从一个点移动到另一个点并避开障碍物；决策制定，即如何根据不同情况执行特定动作；以及环境感知，即理解环境中存在什么及其状态的能力。这些技术使创建动态且真实的游戏玩法成为可能，从而让玩家更投身于为他们创建的世界中。


    如果要独自开发，游戏 AI 很复杂，并且会带来许多挑战。虚幻引擎 4 是一款功能强大的游戏引擎，可用于创建跨平台的 3D 和 2D 游戏，并提供丰富的功能。它以先进的图形和高度可定制的组件而闻名。现在，它免费使用且开源，因此成为目前最流行的游戏引擎之一。虚幻引擎
    4 自带一套完整的游戏 AI 工具，包括 NavMesh、行为树和环境查询系统。有了这些工具，将 AI 添加到您的游戏中变得容易得多。对于游戏设计师，您甚至可以使用名为
    Blueprints 的可视化脚本工具来构建游戏逻辑（包括 AI），只需连接节点，甚至无需编写一行代码。


    本书是我们致力于向有兴趣使其虚拟世界更具趣味性的游戏创作者介绍虚幻引擎 4 中这些用于构建游戏 AI 的绝佳工具的成果。它将涵盖我们提到的所有组件，并向您展示如何使用每个工具构建不同的角色行为，并将它们组合起来创建更复杂的场景。


    我们迫不及待地想看看您会创造出什么！


    ## 本书涵盖的内容


    第 1 章《游戏 AI 简介？》介绍了 AI 的基本理念及其如何直接影响和提升游戏体验。您将了解传统 AI 目标与游戏特定 AI 目标之间的区别。


    第 2 章《创建基础 AI》将帮助您逐步创建第一个 AI，并沿途讨论我们将演示的技术。我们将直接进入虚幻引擎 4，使用创建具有随机移动的单一状态所需的基本组件来为您的
    AI 构建。


    第 3 章《添加随机性和概率》将教您如何创建可用于为 AI 增加随机性、机会性和角色特色的随机及概率技术，从而使游戏变得不可预测且更具趣味性。我们将介绍这些技术在虚幻引擎
    4 中的应用。


    第 4 章《引入移动》解释了如何在虚幻引擎 4 中为我们的 AI 角色引入移动。将使用路径查找来允许角色在关卡中智能导航。


    第 5 章《为 AI 提供选择》解释了如何使用行为树为我们的角色引入自主行为。行为树是一种方法论，允许您以可视化的树状结构构建 AI 逻辑，并可在不同角色中重复使用。


    第 6 章《我们的 AI 如何感知？》解释了如何使用虚幻引擎 4 中可用的不同组件，使我们的 AI 能够感知其他 AI 以及我们将在世界中放置的 Pawn。


    第 7 章《更高级的移动》侧重于群聚和更高级的路径跟随行为。群聚允许我们为多个 AI 角色创建群体行为。


    第 8 章《创建巡逻、追逐和攻击 AI》结合了我们在前几章中使用的一些组件，包括 AI 感知和移动，以使我们的 AI 角色能够导航。然后，我们将对 AI 角色追逐其检测到的角色所花费的时间应用随机性。


    第 9 章《我们学到了什么？》将简要回顾前几章。我们还将讨论结合这些课程可以实现的其他示例。


    ## 本书所需内容


    您只需要虚幻引擎 4.7.0，并可从 https://www.unrealengine.com 下载。


    ## 适用读者


    本书适用于希望扩展与虚幻引擎 4 相关的游戏 AI 知识的程序员和艺术家。建议您在阅读本书之前有一些探索虚幻引擎 4 的经验，因为我们将直接进入游戏 AI
    的开发。


    ## 约定


    在本书中，您会看到多种文本样式，用于区分不同种类的信息。以下是这些样式的一些示例及其含义说明。


    文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、示例 URL、用户输入和 Twitter 帐号将显示为：“现在，在此处添加注释并将其命名为
    Chase Hero。”


    **新术语** 和 *重要词汇* 将以粗体显示。您在屏幕上看到的词（例如，在菜单或对话框中）将以如下形式出现在文本中：“如果您在虚幻引擎中，导航到 **Volumes**
    下的 **Modes** 面板，您将看到 **NavMeshBoundsVolume**。”


    警告或重要说明将显示在类似这样的框中。


    技巧和窍门将以类似这样的形式出现。


