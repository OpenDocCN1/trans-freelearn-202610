    our AIController to begin navigating to its first route as soon as it possesses
    a worthy pawn. So, let''s add an event to drive this action (I encourage the use
    of events). The one we are looking for is called **Event On Possess**. This will
    also return the pawn it possessed, which we can use to compare with the `Allowed
    Access` list from waypoints.

    - 3. Pull from the exec pin, and let''s assign a new event called **ReceiveMoveCompleted**.
    This event will continue the pawn to the next route as soon as it completes the
    previous one:


    ![](img/aaaa027482c900e215ba6bfab3c17337_82_0.png)


    - 4. Now, after the **Bind Event** exec pin, let''s put in **Do Once** to prevent
