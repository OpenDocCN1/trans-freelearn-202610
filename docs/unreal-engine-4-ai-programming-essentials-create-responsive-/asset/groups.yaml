    ### 使用控件的优缺点


    以下是一个优点：


    - 将 AI 移动到精确位置


    以下是缺点：


    - 必须手动创建路径


    - 路径受控件限制


    你可以快速看出两种用途的优势。在受控情况下，你会使用巡逻点。这些点会将 AI 在 3D 空间中精确地引导至移动位置。这非常适合将 AI 引导至关卡中你希望它到达的地方。因此，如果这是游戏中的秘密安保单位，它将巡逻你指定的区域。然后，你可以在接触时消灭玩家。


    ### 添加随机性和概率


    本章中，我们专注于调整之前的示例以实现随机性和概率。因此，我们关注了随机性和概率的优缺点。如果你预先确定输出，随机性可能与概率重叠。例如，如果你希望每次玩家进行拳击攻击时播放不同的动画，你可以拥有一个不同动画的数组并随机从中选择。但是，假设有五个可用选项；这样一来，你有
    20% 的机会选择其中任何一个选项。


