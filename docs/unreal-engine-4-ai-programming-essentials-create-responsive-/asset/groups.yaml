    ## The pros and cons of using randomness


    The following are the pros:


    - There is virtually no limit to the output

    - This introduces balance to systems


    The following are the cons:


    - You must create a large output table for increased deviation

    - The paths are limited to control


    ## The pros and cons of using probability


    The following are the pros:


    - You can predetermine the output

    - You can dictate the frequency of output

    - You can introduce balance to systems


    The following are the cons:


    - It is not as random

    - You must determine the output table


    Probability is powerful when you want to predetermine the output. Probability
    allows you to choose how often an output is given. Randomness doesn''t give you
    any control on the output. Introducing these can add another layer of abstraction
    to player experience.


    ## Introducing movement


    We only covered movement for pawns because this book is just an introduction.
    However, if you had any interest in getting other pawn types to move, you have
    to recreate the junction box, which is the movement component. This movement component
    for a type of pawn is responsible for taking input delta and converting it into
    acceleration.


    What this means for the car AI is first getting the direction from one point to
    another, resulting in the position direction. Then, we need to make this position
    direction relative to the car AI by subtracting it from the car AI''s forward
    direction. This results in a direction delta, which can be applied to the car
    AI''s direction. You can do something similar in 3D space for a spaceship as well.
    What this means is that if you want to create a spider AI that can''t be moved
    by the default movement component, then by creating a custom movement component,
    you can tell the spider AI to move anywhere you wish and still be able to integrate
    it into the Behavior Tree.


    ### Giving our AI choice


    In this chapter, we focused on creating AI with multiple states using Behavior
    Tree. We also talked briefly about using EQS on the dog to randomly choose an
    area within its location. This particular example was simple, but when you begin
    to use filters, the power of EQS shines.


    For example, you wanted to get all the enemies within 500 units of your location
    and eliminate those who aren''t within the line of sight. Then, we cleared any
    enemies not within a 60-degree view angle. Lastly, we got the one closest to the
    character.


    In Blueprint, this can be done, but it then requires you to put it in either Blueprint
    Library or a node. If we make it in EQS, we are only required to create the conditions
    in the UI. However, it''s easier to share and doesn''t require any scripting.


    Let''s compare using EQS and Blueprint to sense the environment.


    ### The pros and cons of using EQS


    The following is a pro:


    - No blueprint is required, and it is more intuitive to specify conditions


    The following is a con:


    - It is limited to the available options in UI


    ### The pros and cons of using Blueprint


    The following is a pro:


    - There is maximum flexibility for implementation


    The following are the cons:


    - You must create it from scratch

    - It is more difficult to reuse


    EQS is a very powerful tool when the purpose of the tool is fully understood.
    It is capable of quickly and precisely querying a scene without the need to juggle
    any blueprint code. Paired with blueprint code, you can unlock its true purpose.
    You can create interfaces, which can be used in the EQS computations, and get
    the results you want, such as the safest unoccupied place for an AI to run for
    cover to.


    ## How does our AI sense?


    We explained what components to use in order to have our AI sense other pawns
    in the world. We could customize settings for sight and sound. The perception
    system would then return any pawn matching these criteria with each update.


    We could potentially use the pawns we sense for more than attacking. If we also
    use it to calculate the best cover, our AI would be reactive to our location.
    Setting certain criteria allows us to then tell the AI when it''s the best time
    to enter or leave cover. Then, adding additional criteria will allow control over
    the enter and exit movement behavior.


    ## More advanced movement


    Advanced movement allows for flocking behavior. This type of movement behavior
    is commonly seen by flocks of birds or schools of fish. There is more movement
    behavior, such as queuing, which tells only one unit to go through a door at a
    time, for example. Squad behavior is great when you have units that protect each
    other.


    The advantage of using movement behavior is that it doesn''t require additional
    decision making for your AI. This also allows you to take some of the computation
    out of the tree and calculate it on the pawn.


    ## Creating patrol, chase, and attack AI


    We demonstrated how to create AI that will patrol between waypoints you lay within
    the world. Then, if you ever get in sight of the AI, it will immediately begin
    to chase you. If you are within the attack range of AI, it will shoot its laser!


    I believe each component has its strengths and that they create the most intelligent
    and responsive AI together. After creating AI without Behavior Tree, you start
    to wonder whether it''s truly necessary to use. The problem dictates the solution,
    and when you use one solution for every problem, you don''t solve anything. I
    find that using the strengths of Behavior Tree and other components to fill in
    the weakness results in the most promising behavior.


    ## The pros and cons of using Behavior Tree


    The following are the pros:


    - It is easily extensible

    - It syncs the Blackboard instances


    The following are the cons:


    - The design dictates the execution flow

    - Setup is required


    ## The pros and cons of using blueprint for AI


    The following are the pros:


    - There is less work for more results

    - It doesn''t require AIController


    The following is a con:


    - There is no access to EQS


    Using blueprint scripts outside of the tree in order to feed more information
    to the tree, you can overcome some obstacles of the execution flow within Behavior
    Trees. For example, if you told the AI to move to a location, you''re unable to
    check for seen enemies during movement unless you use a service. Then, you have
    to ask whether this service will be useful to this branch specifically or to the
    tree as a whole.


    ## Summary


    I hope I was able to cover everything to get you to confidently start approaching
    game AI in Unreal Engine 4. Explore the different ideas here and feed your curiosity
    while exploring game AI. This subject may seem intimidating, but if you''ve followed
    everything in this book, you''re more than ready to start!


    I''ve had a blast demonstrating the different AI components available in Unreal
    Engine 4. If you have any questions, feel free to e-mail me at peterlnewton.com,
    and I will get back to you as soon as possible!


