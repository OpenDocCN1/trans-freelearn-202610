    # # Blackboard Compare Decorator


    There are a few fields we want to take notice of in the pane:


    +   • Let''s start with Flow Control. This has two properties: Notify Observer
    and Observer aborts. Notify Observer tells Flow Control which operation to fire
    on. The On Result Change fires when the computed condition to enter this tree
    changes. So, if we were barking originally but are now idle, the tree''s Flow
    Control will fire off an Abort event. Which part of the tree is aborted is controlled
    by Observer aborts. The first option is Self. This is straightforward in that
    it aborts further execution within this tree. The second option is Low Priority.
    This option basically sees the rest of the tree will be aborted. This is good
    if you want the whole tree to start over. The last option is simply a combination
    of the first two options I mentioned.'
