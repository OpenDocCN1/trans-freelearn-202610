  - "[PAGE 41]\n\n# # Sending the instructions\n\nNow that we have our project set\
    \ up and saved—or not saved for our brave fellows—let’s move forward to the fun\
    \ part: blueprints! Let’s take a look at the steps to send the instructions:\n\
    \n+   1. Open your `MyController` blueprint within **Content Browser** and zoom\
    \ in to the **EventGraph**:\n+      So, the plan is to have our bot move around\
    \ randomly. This will be built in a simple fashion, so we will do the computing\
    \ by hand.\n+   \n+   2. First, let’s create an **Event Tick** node that will\
    \ be triggered in every frame as the game runs.\n+   \n+   3. We will add a **Delay**\
    \ node to receive signals from **Event Tick** to set the **Duration** pin to **1**.\n\
    +   \n+   4. Next, we will add a **Move To Location** node, which will signal\
    \ the `AIController` class to tell its pawn to move to the destination point specified.\n\
    +   \n+   5. As we didn’t use **Path Finding** at this time, which is a subject\
    \ we will touch upon later, go to the **MoveToLocation** node and set **bUsePathFinding**\
    \ to false or leave it unselected.\n\nThe EventGraph for your `MyController` class\
    \ should look similar to the following screenshot:\n\n![](img/aaaa027482c900e215ba6bfab3c17337_41_0.png)"
  - '[PAGE 42]


    6. With the **MoveToLocation** node ready, we now need to supply it with a random
    location. We will grab the current location of the controlled pawn, create an
    additional vector with a random value of -255 to 255 for the **X** and **Y** variables,
    leaving **Z** to **0.0**. Then, we will add the location from the controlled pawn
    to the vector we just created. You should have a blueprint similar to the following
    setup:


    ![](img/aaaa027482c900e215ba6bfab3c17337_42_0.png)


    7. Let''s finalize this and move this new random location blueprint to the **MoveToLocation**
    node that we set up previously. Now, let''s connect the results of the addition
    of the two vectors to the destination of the **MoveToLocation** node. With this
    done, you should have a blueprint setup similar to the following preview:


    ![](img/aaaa027482c900e215ba6bfab3c17337_42_1.png)


    Save it all!'
  - '[PAGE 43]


    # Small tips on MoveToLocation


    Here are some basic tips on MoveToLocation:


    +   * **AcceptanceRadius**: This allows you to increase the radius that is acceptable
    for a completed move. Let''s suppose that there is an enemy holding a sword who
    wants to attack the player. The **AcceptanceRadius** option will help you define
    how far this enemy should be standing away from his target—ideally 1 meter – and
    then perform an attack animation to swing the sword.

    +   * **bStopOnOverlap**: This tells your bot to stop if it overlaps the point
    rather than going precisely there. This will take into consideration the radius
    of the collision mesh attached to the bot.

    +   * **bUsePathFinding**: If this is selected, the bot will use the **NavMesh**
    option to find its destination. If unselected, the bot will simply move in a straight
    line to the destination, not taking into account any obstacles. This helps save
    the performance in some situations.

    +   * **bProjectDestinationToNavigation**: This projects the location on the navigation
    data before using it. This helps validate the target actor’s location – that is,
    whether it exists on a playable area or not.

    +   * **bCanStrafe**: This determines whether the AI can transverse diagonally
    on **NavMesh** or not.

    +   * **FilterClass**: This allows you to use **AreaClass**, which is another
    navigation component that affects the navigation of the AI. This effects changes
    such as exclusion or exclusive access to areas of **NavMesh** and alters the navigation
    cost.


    # Reviewing the current progress


    You can wipe the sweat from your forehead; the hard work has yet to begin.

    So, what have we done so far?


    +   * We''ve set up our AI project

    +   * We''ve set up our pawn with our new AIController

    +   * We''ve sent instructions to our pawn using AIController


    We''re halfway there. This simple setup allows us to put all our instructions
    on our AIController, which will possess the pawn we created from the sample content.
    The AIController is assigned to pawns, which means that multiple pawns can share
    the same AIController.'
  - '[PAGE 44]


    As we can see, our AI now runs indefinitely. Perfect! Let''s move on to the second
    section of this chapter!


    # # Adding the challenge


    Now, we will add line traces to the AI character. In our demonstration, we will
    use traces to detect the wall in front of the pawn. Other examples of using traces
    in the AI include Line of Sight checking, getting surface rotation, and getting
    nearby actors.


    Let''s go back to Unreal Engine Level Editor and look within **Content Browser**.
    Perform the following steps:


    +   1. Rename our `MyController` blueprint `Hero`; this will act as the player
    in this scenario.

    +   2. Open our `Hero` blueprint and go to the **EventGraph** section.

    +   3. Now, remove every node except the **Event Tick** and **Move to Location**
    nodes. We will replace these with new blueprint scripting:


    ![](img/aaaa027482c900e215ba6bfab3c17337_44_0.png)


    Blueprint after removing unnecessary nodes


    +   4. Pull from the return exec pin on the **Event Tick** node and create a **Delay**
    node.'
  md: "\nHere, we will use the Third Person Shooter template, which allows us to easily\
