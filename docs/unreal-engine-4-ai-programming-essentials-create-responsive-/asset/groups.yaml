  - '[PAGE 99]


    3. Let''s create **Event Dispatcher** by adding in the **My Blueprint** pane.
    Drag it to EventGraph and select **Call**. This **Event Dispatcher** will be responsible
    for notifying the tree of changes. Let''s name this event `MailmanFound` and give
    it an input type of **ThirdPersonCharacter** named `Mailman`.


    4. From our **Overlap** event, we will cast **Other Actor** to ThirdPersonCharacter,
    call `MailmanFound`, and supply the casted actor:


    ![](img/aaaa027482c900e215ba6bfab3c17337_99_0.png)


    5. Now, let''s head to `MailmanRadar` and set up some other variables to respond
    to this event. We need to add a few variables to hold references while this radar
    scans for possible mailman targets:


    +   - First, we need a Blackboard Key Selector variable named `State`, which is
    editable

    +   - Next, we need a Blackboard Key Selector variable named `Mailman`, which
    is also editable

    +   - Next, we need a Float variable named `MailmanRadius`, which is editable
    and has a default value of 512

    +   - Lastly, we need to create a type Actor variable and call it `thisPawn`


    The screen should look like the following screenshot:


    ![](img/aaaa027482c900e215ba6bfab3c17337_99_1.png)'
  - '[PAGE 100]


    +   6. Start with our initializing event, Event Receive Activation.


    +   7. We will use this to initialize our Blackboard variables. So, let''s get
    our State variable so that we can set the initial state.


    +   8. Pulling from the Get State variable, we want to find Set Blackboard Value
    as Enum. Get state from the variables, and this time, we want Get Blackboard Value
    as Enum. We will choose a new random state for our AI. We will do this by incrementing
    our State variable randomly once or twice. So, let''s pull from this, create Byte
    + Byte, and then create a modulo (%). This modulo will take our results from the
    addition (+) node, but we want 3 to be put in the last position. So, we will have
    something similar to Input % 3 = Range (0-2) (which translates to Hungry, Barking,
    and Idle).


    +   9. Now, let''s create Random Integer in Range and set the Min value to 1 and
    the Max value to 2. Then, we want to pump this into the Byte + Byte addition node.
    The False value from our previous Branch node will pin into our Set Blackboard
    Value as Enum node.


    +   10. Lastly, pin the results of our modulo (%) to our Set Blackboard Value
    as Enum node to update our current State variable:


    The screen should look like the following screenshot:


    ![](img/aaaa027482c900e215ba6bfab3c17337_100_0.png)


    # State transitions


    What we will do here is randomly increment our state forward. This simply demonstrates
    the state transition. This operation is important because how you handle transitions
    can create virtually coherent AI. This is established when you have goal-oriented
    AI. Instead of being purely reactive, it actively chooses the best scored state
    to achieve said goal. This makes it seem as though AI has a level of intelligence.'
