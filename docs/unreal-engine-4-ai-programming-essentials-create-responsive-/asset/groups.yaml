  mdcn: '

    ## 导航网格


    在虚幻引擎 4 中，导航网格允许我们告诉引擎可遍历路径应在哪里生成，我们可以优化它，以帮助为我们的 AI 生成更准确的路径。我们将简称为“NavMesh”，因为大多数游戏开发者都熟悉这个术语。如果你在虚幻引擎中，导航到
    **Volumes** 下的 **Modes** 面板，你将看到 **NavMeshBoundsVolume**。这是一个你可以用来覆盖几何体并在其上生成导航网格的体积。我有一个示例，展示它的样子。如果你无法看到
    NavMesh 生成的绿色网格，请确保在屏幕上的 **Show** 菜单中勾选 **Navigation** 选项（按 `P` 作为快捷键）：


    ![](img/aaaa027482c900e215ba6bfab3c17337_73_0.png)


    ## RecastNavMesh


    在每个关卡中，你会在世界大纲中看到名为 **RecastNavMesh-Default** 的节点。如果你点击它，可以探索影响关卡中导航网格的默认选项。


    如果向下滚动到 **Generation**，这就是你将根据需求开始调整的内容。如果你在运行时重建时想要获得更多性能，或者想要代理移动的精度，请尝试优化这些值：


    ![](img/aaaa027482c900e215ba6bfab3c17337_74_0.png)


    我将简要介绍一些属性，让你了解它们的作用以及如何影响性能。让我们看看 **RecastNavMesh** 中的一些最重要属性：


    - **Cell Size**：这是体素的 2D 大小，基本上是一个 3D 像素，表示可导航的空间。这是体素的底面积。这与导航网格的分辨率直接相关。这里更小的尺寸会生成更多体素，从而获得更好的移动精度。不幸的是，由于这一点，导航网格生成期间性能会受到影响。

    - **Cell Height**：这是体素的高度。此值与 **Agent Max Step Height** 相关联，建议将其保持在其一半的值。如果 **Cell
    Height** 值不比 **Agent Max Step Height** 至少少 .1，则不会生成导航网格。

    - **Tile Size UU**：当此值较低时，会提高导航网格生成性能。尝试启用 **Draw Poly Edges** 以查看效果。

    - **Agent settings (Radius, Height, Max Height, Max Slope, Max Step Height)**：特定于你的代理，应适当指定。

    - **Min Region Area**：这会去除导航网格生成中看似无关紧要的碎片，这些碎片不足以进行导航。


    如果你的导航网格中有任何障碍物，并且导航网格是在障碍物上方生成的，则该对象被视为几何体。为了更好的性能，你可以将网格设置为动态障碍物。这将防止导航网格在其上方生成。现在，要影响该区域，你还必须为
    **Box Collision** 属性设置 **Offset** 和 **Extent** 值。请看下面的截图：


    ![](img/aaaa027482c900e215ba6bfab3c17337_75_0.png)


    让我们逐步演示：


    1. 让我们创建一个新的 **Box Collision** 元素。这将用一个包含两个值的元素填充数组。

    2. 我们需要将 **Offset** 值设置为导航网格宽度、长度和高度一半的负值。**Offset** 值是碰撞开始的位置。

    3. 接下来，将我们的 **Extent** 值设置为导航网格宽度、长度和高度的一半。**Extent** 值是它从导航网格中心点延伸的量。这意味着它与体积大小的一半相关联。


    在这个导航网格中，例如，我已相应地设置了属性；请看：


    ![](img/aaaa027482c900e215ba6bfab3c17337_76_0.png)


    如下图在游戏中所示，正确位置受我们在 **Is Dynamic Obstacle** 选项上设置的 **NavArea_Null** 类影响：


    ![](img/aaaa027482c900e215ba6bfab3c17337_76_1.png)


    ## 移动组件


    移动组件是动画背后的驱动力。与其他类型的移动组件类似，例如车辆的移动组件，我们将提供输入，这些输入随后会与后端的其他组件通信，以正确模拟动画或齿轮比变化。这意味着其他功能也可以影响拥有移动组件的控制体。因此，如果我们的行为树告诉
    AIController 关注另一个控制体，AIController 将影响其所控制控制体所面向的方向。这意味着不必显式地将这些信息告诉你的控制体，非常有用。


    ## AIController


    我们在第 2 章“创建基础 AI”和第 3 章“添加随机性与概率”中曾使用 AIController 来移动我们的控制体，但从未花时间去了解虚幻引擎 4 内部发生了什么来实现这一点。有了这种理解，你就可以扩展移动组件，例如，当你想要创建移动组件的特殊扩展以支持接收诸如
    Move to Location 之类的指令来用于车辆时。


    AIController 是专为 AI 构建的控制器。与 PlayerController 类似，它控制当前拥有的控制体。主要区别在于 AIController
    自带一些函数，允许你使用 Move to Location 之类的工具来移动 AI。使用 Move to Location 时，你可以指定 Acceptance
    Radius 值、是否使用路径查找（Path Finding）以及其他有用选项。还有一个 Move to Location 的简化版，它有时以牺牲无法更改选项为代价，提供更平滑的移动。这意味着所有选项都是默认值，如
    Move to Location 节点所示。


    它被称为 **Simple Move to Location**，位置如下图所示：


    ![](img/aaaa027482c900e215ba6bfab3c17337_78_0.png)


    ## 开始！


    打开虚幻引擎 4，让我们创建一个新的第三人称模板项目。我们希望这样做，以便可以将第三人称控制体作为我们 AI 控制的控制体之一。因此，按如下截图选择设置并点击
    Create Project：


    ![](img/aaaa027482c900e215ba6bfab3c17337_79_0.png)


    接下来，我们想要创建新的 AIController，它将负责指示我们的控制体在两个点之间移动。计划是引入一些障碍物，以查看我们可以对 AI 的路径产生的影响。执行以下步骤：


    1. 首先进入 **Blueprint** 文件夹。右键单击以创建一个新的 AIController 类并将其命名为 `SoldierAI`。此 AIController
    将负责导航初始内容提供的控制体。

    2. 删除 Content Example 最初在关卡中设置的控制体。然后，我们想在关卡中面对面放置两个新的 **ThirdPersonCharacter**
    控制体。接下来，我们想打开这个 **ThirdPersonCharacter** 蓝图并访问其默认值。

    3. 从此处，找到此控制体的默认 AIController，并将此值更改为我们名为 `SoldierAI` 的新 AIController 类。这将确保我们的控制体始终与我们的
    AIController 一起生成：


    ![](img/aaaa027482c900e215ba6bfab3c17337_80_0.png)


    全部保存！让我们继续本章的下一部分！


    ## 路点


    在本章中，路点表示机器人导航到的点。我们将对路点进行额外更改，以限制谁可以遍历这些点。这将通过在单个路点上创建一个演员数组来建立。当控制体访问可用路点列表时，它们只会添加它们被允许的路点。执行以下步骤：


    1. 首先在与之前相同的 **Blueprint** 文件夹中开始。右键单击它并创建一个新蓝图。转到 **Custom Classes** 并选择 **Target
    Point** 演员。我们将使用它提供的精灵图。

    2. 将这个新的 **Target Point** 子类命名为 `waypoint` 并点击 **Okay**。

    3. 打开我们的新 `Waypoint` 自定义蓝图，创建一个名为 `Allowed Access` 的新公共 **ThirdPersonCharacter**
    控制体数组变量。然后，选择 **Editable**，以便我们可以直接在虚幻编辑器中修改此值：


    ![](img/aaaa027482c900e215ba6bfab3c17337_81_0.png)


    4. 现在，在世界中放置一些路点，我们想尝试使其随机化。这将允许我们在本章后面讨论其他主题时，对控制体的路径有更多控制。

    5. 我选择在我的世界中放置七个路点，并让它们共享大约三个，以在路径中创造一些独特性。因此，在一个节点内，让我们添加先前在世界中放置的两个可用控制体。

    '
