    计算一组概率范围。然后，我们将在 Number Span 的范围内生成一个随机数，并检查它是否在我们之前确定的概率范围内。这个小变体使概率不那么可预测。以下图片显示了简单的彩票概率脚本，用于检查确定的概率范围内的随机值：


    ![](img/aaaa027482c900e215ba6bfab3c17337_61_0.png)


    注意第二个中的 Offset from Lottery，它落在 true 上。下次，概率范围将不存在，并且将计算一个新的随机值。


    ## 带有 RandomStream 的非均匀分布


    我们要做的第一件事是初始化 RandomStream。我们可以通过创建 Make RandomStream 节点并将初始 seed 引脚填充为 Range
    中的随机整数来实现这一点。RandomStream 允许我们控制输出的随机生成。如果我们不在 RandomStream 中更改 seed，它将不断产生相同的结果。因此，出于这个原因，我们必须不断在流中重置
    seed，以便随机输出发生变化。执行以下步骤：


    - 1. 重新将焦点放回 Enemy AIController，创建 Random Integer in Range 并将 Max 值设置为 65535。然后，从
    Return Value 拉出线并输入 Make RandomStream。


    - 2. 现在，我们需要创建变量来更新 RandomStream。创建一个默认值为 0 的 Offset 浮点数。然后，创建一个默认值为 .25 的 ChanceWeight
    浮点数。创建一个默认值为 1 的 Max N 浮点数。


    - 3. 然后，创建 Event Begin Play。拖出 Offset 变量并创建一个 SET 节点。从 Event Begin Play 的 exec
    引脚拖动到你刚刚创建的 SET 节点。接下来，从 Stream 中创建 Random Float in Range，并从 Return Value 拉出线到
    Offset 浮点数：


    ![](img/aaaa027482c900e215ba6bfab3c17337_62_0.png)


    - 4. 我们现在需要将我们的 RandomStream 插入此节点，并将 Max N 变量连接到 Random Float in Range from Stream
    的 Max Float。这将在游戏开始时创建一个随机偏移量。


    - 5. 现在，让我们开始概率脚本。让我们获取我们的变量并从 Stream 中创建 Random Float in Range。然后，我们要从此创建两个节点来比较
    Return Value。我们要检查该值是大于还是小于。然后，拉出一个引脚并创建一个 AND 逻辑门。最后，拉出另一个布尔比较。


    - 6. 接下来，将 AND 的结果拉到一个新的 Branch 节点。我们接下来需要做的是将随机结果与使用 Offset 计算出的 Lottery Probability
    Range 进行比较：


    ![](img/aaaa027482c900e215ba6bfab3c17337_62_1.png)


    - 7. 所以，从变量中获取 **偏移量**。我们想将其放入模运算（%）中，然后将其连接到大于（>）比较节点。


    - 8. 接下来，我们想从变量中获取 **概率权重**。然后，我们将用 **最大 N** 值乘以它来计算概率范围。我们将对计算结果做两件事，如下一步所示。


    - 9. 首先，我们想从 **最大 N** 值与结果中获取差值。然后，我们将其连接到模运算（%）。


    - 10. 接下来，我们想将概率范围添加到模运算（%）的结果中。然后，我们将其管道传输到 clamp 中以确保安全。我们将 **最小值** 设置为 0，**最大值**
    设置为 **最大 N**。此 clamp 的结果插入到如下所示的比较节点的小于（<）中：


    ![](img/aaaa027482c900e215ba6bfab3c17337_63_0.png)


    ## 创建转换


    转换有助于将适当的动作应用到 AI 环境中所感知的内容上。它们还继续执行流程，这就是有限状态机如此特别的原因。我们将在项目中应用此功能，转换为 Flee 或
    Attack 状态，过一段时间后，它将计算是应该逃跑还是继续攻击。一旦未找到敌人，AI 将转换回游荡状态。执行以下步骤：


    - 1. 所以，从我们上次创建的 **分支** 节点，让我们在 **分支** 节点的 **真** 引脚上设置我们的 **状态** 变量。然后，我们将在 **分支**
    节点的 **假** 引脚上设置另一个 **状态** 变量。从那里，让我们将 **真设置状态** 值设置为 **1**，然后将 **假设置状态** 设置为 **2**。


    - 2. 接下来，让我们将我们的 **英雄** 变量重命名为 **目标** 以使其更易于处理。接下来，我们想要在另外两个 **设置状态** 变量之后设置 **目标**。


    - 3. 然后，我们想将两个 **设置状态** 变量节点连接到 **设置目标** 变量节点。**设置目标** 节点应设置为 **中断 ForEachLoopWithBreak**。


    - 4. 现在重置 RandomStream。让我们缩小并找到 Event Tick 节点。从那里，让我们拉出引脚并在 Switch on Int 之间创建
    Sequence。


    - 5. 从 Sequence 节点的 Then 1，让我们创建 Duration 为 0.2 秒的 Delay。然后，从 Make Random Stream
    的 Return Value 拉出线并找到 Reset Random Stream。这将重置流，如果你像我们一样连接了 Random Integer in
    Range，它将在每次重置时生成一个新的随机 Int。


    - 6. 将此插入 Delay 之后，以便每秒重置一次。然后，我们想要从 reset 拉出线到我们从 Event 创建的 SET 节点的 offset 变量：


    ![](img/aaaa027482c900e215ba6bfab3c17337_64_0.png)


    将 offset 设置为随机值


    - 7. 现在，让我们通过从 Switch on Int 节点的 index 1 拉出线来创建一个新的 Sequence 节点。然后，将 Switch on
    Int 节点的 index 2 连接到之前的 Sequence 节点。


    - 8. 现在，让我们从 Sequence 节点的 Then 1 拉出线并创建一个 Delay 节点。此节点将我们的 AI 转换回 Wandering 状态，从此处可以再次检测敌人。


    - 9. 所以，让我们从 Stream 中创建 Random Float in Range 并将 Stream 连接到我们之前创建的 Random Stream。然后，将
    Min 值设置为 3，Max 值设置为 5。


    - 10. 在 Delay 节点之后，将 State 变量设置为 0。然后，将 Target 设置为 none：


    ![](img/aaaa027482c900e215ba6bfab3c17337_65_0.png)


    ## 逃跑和攻击


    所以，我们将从我们的旧部分获取并添加一个小变化，这将使角色远离 Target 而不是向它跑动。这基本上将演示你可以给 AI 各种刺激的反应的概率。执行以下操作：


    - 1. 我们将获取我们的 State 变量。然后，我们想要从中减去 1，得到 0 或 1 索引。接下来，我们想要创建一个 Select 节点并将减法的结果插入该节点。


    - 2. 从那里，我们想要 Option 0 为 1，Option 1 为 -1。这将使角色要么 Run 要么 Flee 远离 Target。现在，缩小到
    Get Direction Vector 节点。


    - 3. 让我们将 Return Value 乘以 Get Direction Vector 节点的结果。你必须首先将 Int 转换为 Float。然后，将此乘以向量。然后，将向量拉回
    Make Rot from X：


    ![](img/aaaa027482c900e215ba6bfab3c17337_65_1.png)


