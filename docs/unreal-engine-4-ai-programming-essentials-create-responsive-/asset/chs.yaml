  ### 导航


  现在我们已在世界中拥有士兵，希望将它们导航到各自的路点。这将通过我们在士兵上设置的 AIController 完成。如果我们再次关注 Unreal Engine，就可以开始了！请遵循以下步骤：


  - 1. Open the AIController class we created earlier and named `SoldierAI`.

  - 2. Then, we want to navigate to the **事件图** section. From there, we want our AIController
  to begin navigating to its first route as soon as it possesses a worthy pawn. So,
  let''s add an event to drive this action (I encourage the use of events). The one
  we are looking for is called **拥有时事件**. This will also return the pawn it possessed,
  which we can use to compare with the `Allowed Access` list from waypoints.

  - 3. Pull from the exec pin, and let''s assign a new event called **接收移动完成**. This
  event will continue the pawn to the next route as soon as it completes the previous
  one:


  ![](img/aaaa027482c900e215ba6bfab3c17337_82_0.png)


  - 4. Now, after the **绑定事件** exec pin, let''s put in **仅执行一次** to prevent this from
  being called twice.


  - 5. Next, let''s right-click, search for the **获取类的所有 actor** node, and select
  our custom blueprint called **路点**. We want to now search through the available
  list of waypoints and check whether we''re allowed to navigate there.


  - 6. So, create a **foreach 循环** node from the **输出 actor 数组** array and pull the
  **允许访问** array from **数组元素**. Then, we want to pull the pawn returned from the **拥有时事件**
  variable and cast it to the 第三人称角色 pawn.


  - 7. From there, let''s try to find the pawn in the **允许访问** array. The array will
  return -1 if nothing is found, which means that we do not have access!


  ![](img/aaaa027482c900e215ba6bfab3c17337_83_0.png)


  - 8. We need to pull a **整型不等于整型布尔值** operation and compare our results from **查找**
  with -1. This will then be pumped into a **分支** node.


  - 9. Now, when this **分支** node returns **真**, this means that we are allowed to
  navigate to the current **数组元素** pin, and we should add it to our points to navigate
  to.


  - 10. Now, let''s create a new **路线** array on our pawn to hold the waypoints we
  can navigate. Then, we will pull this node to the **分支** node we just created and
  pull **添加** from the array node. This will allow us to quickly access the routes
  we have assigned to us.


  - 11. Now, we need to tell the pawn to navigate to the waypoint after this operation
  is completed. This can be done by pulling another **路线** array out past the last
  nodes we placed.


  - 12. We want to shuffle our **路线** array so that our next destination is random.
  You can do this by pulling from the array and searching for **洗牌**. This should
  be called last before our next operation:


  ![](img/aaaa027482c900e215ba6bfab3c17337_84_0.png)


  - 13. Next, we have the location that the pawn needs to go to, and we need to tell
  the pawn to move. We have two options: the first is to provide the **移动到位置** node
  with a location, and the second is to provide an actor and allow the engine to handle
  finding the destination. I will choose the latter for this example.


  - 14. Right-click and search for the **移动到 actor** node, and we want to pump the
  first actor in the index from the **路线** array we created earlier:


  ![](img/aaaa027482c900e215ba6bfab3c17337_85_0.png)


  - 15. From there, let''s track back to our **接收移动完成** event and pull from this to
  our **洗牌** node. Now that this is completed, we want to go back to the editor. Let''s
  simulate and see what AI does!


  ![](img/aaaa027482c900e215ba6bfab3c17337_85_1.png)


  Now, let''s get back!


  ### 导航修改器


  Do you remember when we talked about heuristics? Navigation Modifiers allow you
  to directly affect the cost of navigating areas in which the modifier directly overlaps.
  You can also represent this affected area with a new color.


  你还记得我们讨论过启发式吗？导航修改器允许你直接影响修改器直接重叠的区域的导航成本。你也可以用新颜色表示这个受影响的区域。


  Now, in our example, we will analyze the behavior of AI as it traverses the different
  Navigation Modifiers we set up. What you want to understand from this is that heuristics
  help to find an optimal solution faster than Dijkstra''s algorithm alone while utilizing
  the same method of discovery.


  现在，在我们的示例中，我们将分析 AI 在遍历我们设置的不同导航修改器时的行为。你想从中理解的是，启发式比仅使用 Dijkstra 算法更快地找到最优解，同时利用相同的发现方法。


  So, for example, if you have a cityscape and want your AI to stay on the sidewalks
  and out of the streets as much as possible, you could place Navigation Modifiers
  in the streets, which makes traversing the area highly costly. So, your AI will
  only ever traverse these areas if the appropriate path is blocked off by other high
  costs, such as obstacles.


  例如，如果你有一个城市景观，并且希望你的 AI 尽可能待在人行道上而避开街道，你可以在街道上放置导航修改器，这使得穿越该区域成本很高。因此，你的 AI 只有在适当的路径被其他高成本（例如障碍物）阻断时，才会穿越这些区域。


  Now, let''s head to Unreal Engine 4 editor and get ready to create our own obstacles
  to see this behavior in action. We will also touch on **导航修改器体积** and how you can
  use it in Unreal Engine 4.


  现在，让我们前往 Unreal Engine 4 编辑器，准备创建我们自己的障碍物来观察这种行为。我们还将涉及 **导航修改器体积** 以及如何在 Unreal
  Engine 4 中使用它。


