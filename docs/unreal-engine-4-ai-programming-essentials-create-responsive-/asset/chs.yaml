  \ `State` 变量：\n\nThe screen should look like the following screenshot:\n\n屏幕应如以下屏幕截图所示：\n\
  \n![](img/aaaa027482c900e215ba6bfab3c17337_100_0.png)\n\n### 状态过渡\n\nWhat we will\
  \ do here is randomly increment our state forward. This simply demonstrates the\
  \ state transition. This operation is important because how you handle transitions\
  \ can create virtually coherent AI. This is established when you have goal-oriented\
  \ AI. Instead of being purely reactive, it actively chooses the best scored state\
  \ to achieve said goal. This makes it seem as though AI has a level of intelligence.\n\
  \n我们在这里将做的是随机向前增加我们的状态。这只是演示状态过渡。此操作很重要，因为你处理过渡的方式可以创建几乎连贯的 AI。当你拥有目标导向的 AI 时，就会建立这一点。它不是纯粹的反应，而是主动选择得分最高的状态来实现目标。这让\
  \ AI 似乎具有一定的智能水平。\n\nOur AI randomly chooses its next state, but if the AI could\
  \ make its new state decision based on the information we collected, it would make\
  \ our AI appear intelligent. These examples will provide you with the knowledge\
  \ to take on more challenging projects:\n\n我们的 AI 随机选择其下一个状态，但如果 AI 能根据我们收集的信息做出新状态决策，它会让我们的\
  \ AI 显得智能。这些示例将为你提供承担更具挑战性项目的知识：\n\n- 1. Looking back at **事件接收激活**, let's pull\
