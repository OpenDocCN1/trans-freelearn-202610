  ### 导航区域类


  This class is responsible for applying the adjusted cost of NavModifierVolume. This
  also goes to say that NavModifierVolume is used to affect the Navigation Mesh.

  NavArea classes are used explicitly to override properties or functions in the affected
  Navigation Mesh. Today, we will create two NavArea classes to represent two different
  types of environmental situations. One will be the representation of water and the
  other, mud. The theory behind this is that water would have a high entry cost because
  it is not as fast as stepping in mud, but mud would have a low travel cost increase
  because it''s not easy to walk in.


  这个类负责应用 导航修改器体积 的调整成本。这也意味着 导航修改器体积 用于影响导航网格。

  导航区域类用于明确覆盖受影响的导航网格中的属性或函数。今天，我们将创建两个 导航区域 类来表示两种不同的环境情况。一个代表水，另一个代表泥浆。其理论是，水会有较高的进入成本，因为它不像踩在泥浆中那么快，但泥浆的行进成本增加较低，因为在泥浆中行走不容易。


  With this in mind, let''s move on to the next step, which is creating different
  NavArea classes to apply to our NavModifierVolume actors:


  考虑到这一点，让我们继续下一步，即创建不同的 导航区域 类以应用到我们的 导航修改器体积 actor 上：


  - 1. Right click on our Blueprint folder within Content Browser and go to Blueprint
  Class.

  - 2. From there, we want to go to Custom Classes at the bottom of the window.

  - 3. Search for NavArea, and let''s create a new subclass from this.

  - 4. After creating one more NavArea, let''s name one AreaOfMud and the other, AreaOfWater.

  - 5. Double-click on AreaOfMud, and let''s go to Default Properties.

  - 6. In there, you will see Default Cost and Fixed Area Entering Cost.

  - 7. We want the Default Cost value to be 2.5, and this will affect the NavModifierVolume
  actor it belongs to.

  - 8. For Fixed Area Entering Cost, we will leave this at 0.0 for mud. Lastly, change
  the Draw Color color so that we know what''s affecting the Navigation Mesh. As we
  stated earlier, entering mud is relatively easy in comparison to water:


  ![](img/aaaa027482c900e215ba6bfab3c17337_88_0.png)


  - 9. Let''s close this and then open AreaOfWater.

  - 10. We want to change **默认成本** to **1.5**, and let''s change **固定区域进入成本** to **35**.
  These values could be tuned according to the specific game you are working on. And
  of course, change **绘制颜色** to something similar to light blue to represent water.

  - 11. Save and close and then go back to the editor!

  - 12. Now, let''s go and apply these NavAreas to the NavModifierVolumes we placed
  on the level earlier.

  - 13. Once you do that, you should now see **绘制颜色** updated. Let''s hit **开始游戏**
  and now observe our AI!


