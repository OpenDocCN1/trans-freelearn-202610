  \n### Using our new AIController class\n\n您是否注意到，一名玩家可以扮演任何他们想要的角色？这就是创建载体和控制器的层次结构。控制器是玩家在游戏大厅等待一段时间后继承的内容。它用于管理来自玩家的输入和连接。此类带有额外函数，可帮助导航机器人，并能为控制器分配行为树。在此演示中，我们将介绍\
