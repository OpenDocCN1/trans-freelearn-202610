  ### 摘要


  让我们花点时间简要讨论本章做了什么。首先，我们设置代理撞墙弹开。这让我们观察代理模拟移动以及四种行为如何影响它们。接下来，我们将实现 Follower 和 Leader
  行为，这会在模拟期间在代理中创建群组。


  我们做的最后一件事是实现群体移动，它分为三种不同的行为。第一种行为是 Alignment，负责使代理与附近代理对齐。第二种行为是 Cohesion，负责将代理引导向附近代理的中心。第三种行为是
  Separation，负责将代理引导远离附近代理。


  然后，我们仅仅创建了一个 UI 来控制在课程中创建的权重，并在模拟期间随时重置代理。


  既然我们已经介绍完不同的移动行为，是时候将本书中关于 AI 的所有演示内容结合起来了。在下一章中，我们将创建一个 AI 角色，它将巡逻、追击并摧毁任何敌人。那么，让我们进入下一章开始吧！

