  行为树是节点组成的树，其结构图决定流程控制，每个叶节点代表 AI 执行的实际代码。这导致 AI 根据其接收到的输入做出一系列适当的决策。要查看我们今天要制作的示例，以下是
  Unreal Engine 4 中行为树的样子：


  ![](img/aaaa027482c900e215ba6bfab3c17337_155_0.png)


  世界上有许多形式的状态机可用。行为树是一种具有子树节点的树形结构。它具有允许你进行流程控制的合成节点，从而导致叶节点的执行，叶节点也具有额外的流程控制。这种控制级别允许你创建具有大量控制力的深层行为树。


