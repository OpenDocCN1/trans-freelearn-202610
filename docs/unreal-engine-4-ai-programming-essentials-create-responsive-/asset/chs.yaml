  ### 导航开销


  由此可见，AI完全按照你的预期行动。它会避开泥地，因为在遍历NavModifierVolume时会应用开销，有时，水域的固定区域进入开销也会劝退AI，不过大多数情况下，AI仍会被发现穿越水域，因为一旦进入，一切就都没问题了！这通常就是我的诀窍。所以说这些，希望你已经理解了A*算法及其寻找最优路径的搜索过程。


