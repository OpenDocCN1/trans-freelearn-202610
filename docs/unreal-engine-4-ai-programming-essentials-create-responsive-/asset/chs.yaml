  AI 的基础知识。我们未涵盖的是我们可能遇到的问题。我们演示的技术有哪些弱点和优点？在本章中，我们将回答这些问题。


  ### 创建基础 AI


  还有其他形式的 AI 可用。在本书中，我们创建了基础 AI。在组件层次结构中，有一个控制器。控制器随后决定运行哪个行为树。然后，根据树中决策的顺序选择任务。


  在控制器中，我们可以有一个适合不同任务的不同行为树数组。然后，一旦我们接近任务，树中包含有助于得出解决方案的子任务。引入这种抽象级别需要理解需要进入哪个状态。


  我们演示了如何创建一个足够基础以无限运行的 AI。使用数学，我们能够帮助 AI 避免与墙壁接触。大概，这对某些场景来说是你所需要的全部。如果你需要你的单位彼此独立运行并根据需要避开墙壁，此脚本将非常适合你。但是，如果你需要对单位有更多控制，仅凭此技术无法实现。


  替代方案是使用控制小部件（例如样条线）来精确控制 AI 的去向。如果你获取指向样条线上位置的方向，可以指示 AI 移动到那里，而不是朝向英雄，如我们在第 2 章
  创建基础 AI 中所示。


  以下是使用控件来指定 AI 应该去哪里的优缺点。


  ### 使用控件的优缺点


  以下是一个优点：


  - 将 AI 移动到精确位置


  以下是缺点：


  - 必须手动创建路径


  - 路径受控件限制


  你可以快速看出两种用途的优势。在受控情况下，你会使用巡逻点。这些点会将 AI 在 3D 空间中精确地引导至移动位置。这非常适合将 AI 引导至关卡中你希望它到达的地方。因此，如果这是游戏中的秘密安保单位，它将巡逻你指定的区域。然后，你可以在接触时消灭玩家。


  ### 添加随机性和概率


  本章中，我们专注于调整之前的示例以实现随机性和概率。因此，我们关注了随机性和概率的优缺点。如果你预先确定输出，随机性可能与概率重叠。例如，如果你希望每次玩家进行拳击攻击时播放不同的动画，你可以拥有一个不同动画的数组并随机从中选择。但是，假设有五个可用选项；这样一来，你有
  20% 的机会选择其中任何一个选项。






  ### 使用随机性的优缺点


  以下是优点：


  - 输出几乎没有限制

  - 这为系统引入了平衡


  以下是缺点：


  - 为增大偏差，必须创建一个大型输出表

  - 路径受到控制限制


  ### 使用概率的优缺点


  以下是优点：


  - 可以预先确定输出

  - 可以规定输出频率

  - 可以为系统引入平衡


  以下是缺点：


  - 随机性不够

  - 必须确定输出表


  当你想要预先确定输出时，概率非常强大。概率允许你选择输出的频率。随机性不会让你对输出有任何控制。引入这些可以为玩家体验增加另一层抽象。


  ### 介绍移动


  我们只介绍了棋子的移动，因为这本书只是一个入门。然而，如果你有兴趣让其他类型的棋子移动，就必须重新创建连接盒，即移动组件。针对某种棋子的这个移动组件负责获取输入增量并将其转换为加速度。


  这对汽车 AI 的含义是：首先获取从一个点到另一个点的方向，从而得到位置方向。然后，我们需要通过从汽车 AI 的前进方向中减去它，使这个位置方向相对于汽车 AI。这会产生一个方向增量，可以应用于汽车
  AI 的方向。在 3D 空间中，你也可以为飞船做类似的事情。这意味着，如果你想创建一个无法被默认移动组件移动的蜘蛛 AI，那么通过创建自定义移动组件，你可以告诉蜘蛛
  AI 移动到任何你希望的位置，并仍然能够将其集成到行为树中。


  ### 给予 AI 选择


  在本章中，我们专注于使用行为树创建具有多个状态的 AI。我们也简要地讨论了在狗身上使用 EQS 来随机选择其位置内的一个区域。这个特定的例子很简单，但当你开始使用过滤器时，EQS
  的威力就体现出来了。


  例如，你想获取位置 500 单位范围内的所有敌人，并排除那些不在视线范围内的敌人。然后，我们清除了不在 60 度视角内的任何敌人。最后，我们得到了距离角色最近的一个。


  在蓝图中，这可以完成，但随后需要将其放入蓝图库或一个节点中。如果我们在 EQS 中制作，只需在 UI 中创建条件。然而，它更容易共享且不需要任何脚本。


  让我们比较使用 EQS 和蓝图来感知环境。


  ### 使用 EQS 的优缺点


  以下是优点：


  - 不需要蓝图，且指定条件更直观


  以下是缺点：


  - 受限于 UI 中可用的选项


  ### 使用蓝图的优缺点


  以下是优点：


  - 实现具有最大灵活性


  以下是缺点：


  - 必须从头开始创建

  - 更难以复用


  当充分理解工具用途时，EQS 是一个非常强大的工具。它能够快速且精确地查询场景，而无需处理任何蓝图代码。与蓝图代码配合使用，你可以释放其真正用途。你可以创建可在
  EQS 计算中使用的接口，并获得你想要的结果，例如 AI 可用于掩护的最安全的空闲位置。


  ### 我们的 AI 如何感知？


  我们解释了为了让 AI 感知世界中其他棋子应使用哪些组件。我们可以自定义视觉和听觉设置。感知系统会在每次更新时返回任何匹配这些标准的棋子。


  我们可能不仅将感知到的棋子用于攻击，还可以用于计算最佳掩体，这样我们的 AI 就会对我们的位置做出反应。设定某些标准可以让我们告诉 AI 什么时候是进入或离开掩体的最佳时机。然后，添加更多标准将允许控制进入和退出的移动行为。


  ### 更高级的移动


  高级移动允许群体行为。这种移动行为通常可见于鸟群或鱼群。还有更多移动行为，例如排队，它一次只告诉一个单位通过一扇门。当你有互相保护的单位时，小队行为非常出色。


  使用移动行为的优势在于它不需要为 AI 进行额外的决策。这还允许你将部分计算从树中移出并在棋子上计算。


  ### 创建巡逻、追踪和攻击 AI


  我们演示了如何创建在世界中布置的路点之间巡逻的 AI。然后，如果 AI 看到你，它会立即开始追踪你。如果你处于 AI 的攻击范围内，它会发射激光！


  我相信每个组件都有其优势，并且它们共同创造了最智能、最灵敏的 AI。在不使用行为树创建 AI 后，你会开始怀疑它是否真的有必要使用。问题决定解决方案，当你用一个解决方案解决所有问题时，你并没有解决任何问题。我发现，利用行为树和其他组件的优势来弥补弱点，能产生最有希望的行为。


  ### 使用行为树的优缺点


  以下是优点：


  - 易于扩展

  - 它同步黑板实例


  以下是缺点：


  - 设计决定执行流程

  - 需要设置


  ### 为 AI 使用蓝图的优缺点


  以下是优点：


  - 付出更少的努力获得更多结果

  - 不需要 AIController


  以下是缺点：


  - 无法访问 EQS


  在树之外使用蓝图脚本为树提供更多信息，你可以克服行为树中执行流程的一些障碍。例如，如果你告诉 AI 移动到某个位置，除非使用服务，否则无法在移动过程中检查已看到的敌人。然后，你需要问自己这个服务是仅对这个分支有用，还是对整棵树有用。


  ### 总结


  希望我涵盖了所有内容，让你能够自信地开始在虚幻引擎 4 中接触游戏 AI。在探索游戏 AI 的过程中，探索这里的不同想法并满足你的好奇心。这个主题可能看起来令人生畏，但如果你跟随本书的所有内容，你已经准备好开始了！


