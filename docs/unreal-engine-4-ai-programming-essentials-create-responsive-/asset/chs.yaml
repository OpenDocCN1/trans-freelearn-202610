  在本章中，我们介绍了用于控制和影响AI移动行为的不同工具，使用NavModifierVolumes和其他recast属性。我们还学习了如何指示受控AI的pawn导航到属于它们的航点。最后，我们介绍了更多基础知识，例如最初由Edsger
  Dijkstra创建的寻路算法。接下来，我们了解到可以优化他的原始算法以换取性能和资源，并通过启发式方法实现这一点。


