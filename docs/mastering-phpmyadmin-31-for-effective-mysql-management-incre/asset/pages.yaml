- pgno: 260
  md: 'Here is another example generated from the same book table''s PDF page definition.
    This time the grid is shown, but no colors.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_260_0.png)


    # A note about fonts used


    All the text we see in the PDF schema is drawn using a specific font. phpMyAdmin
    3.1.x uses the DejaVuSans font (http://dejavu.sourceforge.net), which covers a
    wide range of characters.


    For actual PDF generation, phpMyAdmin relies on the tcpdf library (http://tcpdf.sourceforge.net),
    which itself is an adaptation of the fpdf library (http://www.fpdf.org). These
    libraries have two ways of using fonts—embedded and not embedded. Embedded fonts
    produce a bigger PDF file because the whole font is included in the PDF. This
    is the default option chosen by phpMyAdmin because the library does not depend
    on the presence of a specific TrueType font in the client operating system.


    The fonts are located in libraries/tcpdf/font under the main phpMyAdmin directory.


    To use a different font file, we must first add it to the library (tools are present
    in the original tcpdf kit and a tutorial is available on the http://www.fpdf.org
    website) and then modify phpMyAdmin''s pdf_schema.php source code.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Using the Designer for PDF layout


    The Designer feature (available in the Database view) offers a more refined way
    of moving the tables on screen as the column links follow the table movements.
    Therefore, an interface exists between the tables'' coordinates, as saved by the
    Designer, and the coordinates for the PDF schema. Let''s enter the Designer and
    click the small PDF logo.


    This brings us to a panel where we can choose the (existing) PDF schema name and
    the action we want to perform — in our case, to export the Designer coordinates
    to the PDF schema. We could also use the Create a new page dialog, entering a
    PDF page name and clicking Go to create an empty page. From here, we can subsequently
    export the coordinates saved from the Designer workspace.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_261_0.png)


    > There is a difference in the span of tables managed by the Designer and by the
    Edit PDF feature. The Designer manipulates every table of a database, whereas
    the Edit PDF panel offers us a choice of tables enabling us to represent a subset
    of the relations in case there are many tables.


    # Summary


    This chapter covers the documentation features offered by phpMyAdmin — the print
    view for a database or a table and the data dictionary for a complete column list.
    The chapter also covers PDF relational schemas. In particular, it focuses on how
    to create and modify a PDF schema page, and how to use the visual editor (scratchboard).
    The next chapter will explain how to apply transformations to data, in order to
    customize its format at view time.'
  merge: -1
  img_proc: true
