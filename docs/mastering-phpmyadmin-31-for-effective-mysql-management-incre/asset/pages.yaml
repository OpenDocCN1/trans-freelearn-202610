- pgno: 175
  md: '# 9

    Searching Data


    In this chapter, we present mechanisms that can be used to find the data we are
    looking for, instead of just browsing tables page-by-page and sorting them. This
    chapter covers single-table searches besides entire database searches. Chapter
    13 is a complement to this chapter and presents multi-table query with examples.


    # Daily usage of phpMyAdmin


    For some users, the main use of phpMyAdmin is the Search mode, which is used for
    finding and updating data. For this, the phpMyAdmin team has made it possible
    to define which subpage is the starting page in Table view, with the `$cfg[''DefaultTabTable'']`
    parameter. Setting it to `''tbl_select.php''` defines the default subpage for
    search.


    With this mode, application developers can look for data in ways not expected
    by the interface they are building—adjusting and sometimes repairing data.


    # Single-table searches


    This section describes the Search subpage where a single-table search is available.


    # Entering the search subpage


    The Search subpage can be accessed by clicking the Search link in the Table view.
    This has been done here for the book table:'
  merge: -1
  img_proc: true
- pgno: 176
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_176_0.png)


    The most commonly used section of the Search interface (the query by example)
    is the one immediately displayed, whereas other dialogs are hidden in a slider
    that can be activated by the Options link (more on these dialogs later in this
    chapter).


    # Search criteria by field—query by example


    The main use of the Search panel is to enter criteria for some fields so as to
    retrieve only the data we are interested in. This is called query by example because
    we give an example of what we are looking for. Our first retrieval will concern
    finding the book with ISBN 1-234567-89-0. We simply enter this value in the isbn
    box and choose the Operator ''=''.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_176_1.png)


    Clicking on Go gives these results (shown partially in the following screenshot).


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_176_2.png)'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'This is a standard results page. If the results ran in pages, we could navigate
    through them, and edit and delete data for the subset we have chosen during the
    process. Another feature of phpMyAdmin is that the fields used as the criteria
    are highlighted by changing the border color of the columns to better reflect
    their importance on the results page.


    It isn''t necessary to specify that the isbn column be displayed even though this
    is the column in which we search. We could have selected only the title column
    for display (see the Selecting Fields to be Displayed section) and chosen the
    isbn column as a criterion.


    # Searching for empty / non-empty values


    In version 3.1.0, two handy operators have been added in the operator''s list:


    ```

    = ''''

    != ''''

    ```


    Those are the ones to use when you want to search for an empty (= '''') or not
    empty ( != '''') value in some field. Normally, typing nothing in a field''s Value
    means that this field does not participate in the search process. However, with
    one of these operators, this field is included in the generated search query.


    Please do not confuse this method with searching for a NULL value, which is quite
    different. Indeed, a NULL value (refer to http://en.wikipedia.org/wiki/Null_(SQL)
    for a more complete explanation) is a special value that conveys that some information
    is missing in this column.


    # Print view


    We see the Print view and Print view (with full texts) links on the results page.
    These links produce a more formal report of the results (without the navigation
    interface) directly to the printer. In our case, using Print view would produce
    the following:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_177_0.png)'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'This report contains information about the server, database, time of generation,
    version of phpMyAdmin, version of MySQL, and generated SQL query. The other link,
    Print view (with full texts) would print the contents of the TEXT fields in their
    entirety.


    # Wildcard search


    Let''s assume we are looking for something less precise—all books with "cinema"
    in their title. First, we go back to the search page. For this type of search,
    we will use SQL''s LIKE operator. This operator accepts wildcard characters—the
    % character (which matches any number of characters) and the underscore (_) character
    (which matches a single character). Thus we can use %cinema% to let phpMyAdmin
    find any substring that matches the word "cinema". If we left out both wildcard
    characters, we will get exact matches with only that single word.


    This substring matching is easier to access, being part of the Operator drop-down
    list. We only have to enter the word cinema and use the operator LIKE %...% to
    perform that match. We should avoid using this form of the LIKE operator on big
    tables (thousands of rows), as MySQL does not use an index for data retrieval
    in this case, leading to wait time that could add up to half an hour (or more).
    This is why this operator is not the default one in the drop-down list, even though
    this method of search is commonly used on smaller tables.


    Here is a screenshot showing how we ask for a search on cinema with the operator
    LIKE %...%:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_178_0.png)


    > The LIKE operator can be used for other types of wildcard searches, for example
    History%, which would search for this word at the beginning of a title. This form
    of LIKE query also has the benefit of using an index, if MySQL finds one that
    speeds up data retrieval.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Using either of these methods of doing the query produces the following results:


    |  |  |  | isbn | title | page_count | author_id | language | description |

    |---|---|---|---|---|---|---|---|---|

    | ☐ | ✎ | ✕ | 1-234567-89-0 | A hundred years of cinema (volume 1) | 600 | 1 |
    en |  |

    | ☐ | ✎ | ✕ | 1-234567-90-0 | A hundred years of cinema (volume 2) | 602 | 1 |
    en |  |


    The % character (which matches any number of characters) and the underscore (_)
    character (which matches a single character) are the wildcard characters available
    here.


    # Case sensitivity


    In the previous example, we could have replaced cinema with CINEMA and achieved
    similar results. The reason is that the collation of the title column is latin1_swedish_ci.
    Here, ci means that comparisons are done in a case-insensitive way. Please refer
    to http://dev.mysql.com/doc/refman/5.1/en/case-sensitivity.html for more details.


    # Combining criteria


    We can use multiple criteria for the same query (for example, to find all the
    English books of more than 300 pages). There are more comparative choices in Operator
    because the page_count field is numeric, as shown in the following screenshot:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_179_0.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Search options


    The Options slider reveals additional panels to further refine the search process.


    # Selecting the fields to be displayed


    In the Options slider, a Select fields panel facilitates selection of the fields
    to be displayed in the results. All fields are selected by default, but we can
    control-click other fields to make the necessary selections. Mac users would use
    command-click to select/unselect the fields.


    Here are the fields of interest in this example:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_180_0.png)


    We can also specify the number of rows per page in the textbox next to the field
    selection. The Add search conditions box will be explained in the Applying a WHERE
    clause section, which will follow shortly.


    # Ordering the results


    The Display order dialog permits the specification of an initial sorting order
    for the results to come. In this dialog, a drop-down menu contains all the table''s
    columns; it''s up to us to select the one on which we want to sort. By default,
    the sorting will be in Ascending order, but a choice of Descending order is also
    available.


    It should be noted that on the results page, we can change the sort order using
    the techniques explained in Chapter 4.


    # Applying a WHERE clause


    Sometimes, we may want to enter a search condition that is not offered in the
    Function list of the query by example section. The list cannot contain every possible
    variation in the language. Let''s say we want to find all the English or French
    books using the IN clause. To do this, we can use the Add search conditions section.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_181_0.png)


    > The complete search expression is generated by combining the search conditions,
    a logical AND, and the other criteria entered in the query by example lines.


    We could have a more complex list of search conditions that would be entered in
    the same textbox, possibly with brackets and operators such as AND or OR.


    A Documentation link points to the MySQL manual, where we can see a huge choice
    of available functions. (Each function is applicable to a specific field type.)


    # Obtaining distinct results


    Sometimes, we may want to avoid getting the same results more than once. For example,
    if we want to know in which cities we have clients, displaying each city name
    once would be enough. Here, we want to know in which languages our books are written.
    In the Select Fields dialog, we choose just the language field, and we check DISTINCT,
    as shown in the following screenshot:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_181_1.png)


    Clicking on Go produces the following image:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_181_2.png)'
  merge: -1
