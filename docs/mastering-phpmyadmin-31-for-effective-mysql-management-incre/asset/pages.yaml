- pgno: 296
  md: '# Exporting


    It is possible to generate event-related statements at the end of an SQL database
    export by putting a check mark next to the Add CREATE PROCEDURE/ FUNCTION / EVENT
    option. Please remember that some events may have an ending moment; Hence, they
    may have vanished between the time you create them and the time you attempt an
    export!


    # BLOB streaming


    Starting with version 3.1.0, phpMyAdmin supports the Scalable BLOB streaming infrastructure
    for MySQL. The http://blobstreaming.org website explains the goals of this project.
    Please note that some of its documentation relates to command-line utilities which
    have few or no use in the context of a web interface such as phpMyAdmin. You should
    be familiar with BLOB streaming terms, such as repository and field references,
    before reading further.


    In this section, we will use this technology to upload a movie and watch it after
    streaming from within phpMyAdmin.


    # System requirements


    The chosen method of implementation in phpMyAdmin relies on all of these components:


    +   - MySQL 5.1

    +   - PBXT (PrimeBase XT storage engine)

    +   - PBMS (PrimeBase Media Streaming)


    PBXT is a streaming enabled storage engine. Although other non-streaming enabled
    storage engines are supported via PBMS UDFs, this mechanism is not implemented
    in phpMyAdmin.


    The presence of the required components can be verified from the phpMyAdmin''s
    homepage, by clicking the Engines link and looking for these lines:


    ```

    PBXT / High performance, multi-versioning transactional engine

    PBMS / The Media Stream engine for MySQL

    ```


    In case these lines are not present, please follow the instructions on http://www.primebase.org
    to install PBXT, or on the BLOB Streaming website to install PBMS.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '> You won''t see PBMS in the storage engine choices of the **Operations** subpage
    for a table. PBMS is not a storage engine that can be associated with the structure
    of a table.


    # Configuration


    Some PBMS system variables have an impact on BLOB streaming behaviour, and can
    be defined in `config.inc.php`. More details about them on http://blobstreaming.org/documentation/#sysvar.
    The recommended values to be put in your server''s definition are:


    ```

    $cfg[''Servers''][$i][''bs_garbage_threshold''] = 50;

    $cfg[''Servers''][$i][''bs_repository_threshold''] = ''32M'';

    $cfg[''Servers''][$i][''bs_temp_blob_timeout''] = 600;

    $cfg[''Servers''][$i][''bs_temp_log_threshold''] = ''32M'';

    ```


    # Implementation limitations in phpMyAdmin


    In the current 3.1.1 version of phpMyAdmin, a few limitations exist, with respect
    to using BLOB streaming. The first limitation has to do with the MySQL server.
    On a server which has just started, the `pbms_field_references` global MySQL variable
    may be set to **off**. As field references are used extensively for BLOB referencing,
    phpMyAdmin tries to set the parameter to on, and this can be done only by a user
    possessing the SUPER privilege. Therefore, such a user must log in once via phpMyAdmin
    to set this parameter to the appropriate value, and this will have to be repeated
    on each restart of the MySQL server.


    The second limitation is related to the upload mechanism used to send data to
    the BLOB repository. The data has to travel first from your workstation to the
    web server, and then from the web server to the MySQL server. The first travel
    occurs via a normal HTTP upload. Please refer to Chapter 8, *Importing Structure
    and Data*, in the *Limits for the transfer* section, for more details on the requirements
    for uploading. To avoid being hindered by this limit, you can use the web server
    upload directory (also described in Chapter 8).


    > An important note about the host name is due here: In `config.inc.php`, your
    server name in `$cfg[''Servers''][$i][''host'']` should be a **FQDN (fully-qualified
    domain name)**. It should not something like "localhost"; otherwise, the links
    used to retrieve streaming data will not work.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Creating the PBMS system tables


    If all the requirements have been met, we can go to the marc_book database in
    the Operations subpage. We should see a BLOB Repository dialog, a Status: Disabled
    message, and an Enable button. We now have to click Enable to create the PBMS
    system tables inside this database. There are two system tables required by PBMS
    (pbms_repository and pbms_reference), and another one (pbms_custom_content_type)
    for phpMyAdmin''s internal needs.


    After creation, we''ll see Status: Enabled on the same page, but not the newly
    created system tables. Usually, these tables are kept invisible from within phpMyAdmin
    because a user should not play with them directly.


    We also see a Disable button. Clicking on it shows a warning:


    > You are about to DISABLE a BLOB Repository! Are you sure you want to disable
    all BLOB references for database marc_book?


    Confirming this warning message would make PBMS forget all the BLOB references
    in this database, which would eventually delete all BLOB streaming data previously
    referenced from this database (if no other reference exists for it from another
    database).


    # Table preparation


    For this exercise, we''ll use the book.cover_photo column, and LONGBLOB to hold
    the BLOB reference (remember that the stream data itself is located in the BLOB
    repository, and the LONGBLOB column is only there to contain the reference). We
    ensure that the book table is under the PBXT storage engine, and if it''s not
    the case, we just need to go to Operations for this table and change the engine,
    as explained in Chapter 10.


    > Using a LONGBLOB for BLOB reference is currently a PBXT requirement.


    # Uploading to BLOB repository


    We are finally ready to try our first upload to the repository. In the book table,
    we access the Insert panel (or we edit an existing row). Note the new Upload to
    BLOB repository option in the dialog for the cover_photo column:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_298_0.png)'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'One might ask why this new option is shown. After all, don''t we want to upload
    to the BLOB repository? Maybe! But as this LONGBLOB column may also hold regular
    data, two possibilities exist:


    +   - Clicking the **Upload to BLOB repository** option, and then browsing for
    a file or picking one in the web server upload directory. This will send the file
    to the repository for streaming later.

    +   - Not clicking the option, thereby sending the data directory to this column
    (not for streaming later).


    Obviously, we pick the first choice and upload our favorite movie (we can try
    a short one first). If the upload works well, we''ll see a query similar to this:


    ```

    UPDATE `marc_book`.`book`

    SET `cover_photo` = ''~*marc_book/~1-150-15591197-0*3907219''

    WHERE `book`.`isbn` = ''1-234567-22-0'' LIMIT 1;

    ```


    Here, cover_photo was updated with the BLOB reference, a number generated by the
    PBMS storage engine.


    # Streaming the data from repository


    When browsing our table and looking at the row for which we made an upload into
    the BLOB repository, we see, under the cover_photo column, depending on the data
    format, one of these messages:


    +   - View image

    +   - Play audio

    +   - View video

    +   - Download file


    Clicking on the displayed message starts streaming directly from the server''s
    port 8080 to our browser, sending the appropriate MIME type to inform the browser
    about which format to expect.


    We also see the MIME type of the uploaded data (here video/mp4).


    |  |  |  | 1-234567-22-0 | Future souvenirs | 200 | 2 | en |  | video/mp4 (Download
    file) |

    |---|---|---|---|---|---|---|---|---|---|

    | □ |  | X | 1-234567-22-0 | Future souvenirs | 200 | 2 | en |  | video/mp4 (Download
    file) |'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Changing repository data


    In case the MIME type for the uploaded data was not interpreted correctly, it''s
    possible to modify it by clicking this link and typing in the correct type. Note
    that this feature is a work in progress in version 3.1.1.


    Finally, when editing this row, we''ll see a **Remove BLOB Repository Reference**
    option. Putting a check mark on this option and saving the row tells the PBMS
    engine to forget about this reference, eventually eliminating the BLOB data from
    the repository.


    # Summary


    MySQL 5.0''s new features helped the product comply with standards. Even though
    phpMyAdmin has limited support for these features (especially lacking a syntax-oriented
    editor), it has a basic set of features to work with views, routines, triggers
    and information_schema, and to display profiling information. phpMyAdmin also
    supports MySQL 5.1 partitions and events, the PBXT storage engine, and BLOB streaming.
    The next chapter covers administration of a MySQL server, focusing on the management
    of user accounts and privileges.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# 18


    # MySQL Server Administration


    This chapter will discuss how a system administrator can use the phpMyAdmin server
    management features for day-to-day user account maintenance, server verification,
    and server protection. Non-administrators can also obtain server information from
    phpMyAdmin.


    Server administration is mostly done via the Server view, which is accessed via
    the menu tabs available on phpMyAdmin''s homepage.


    # User and privileges management


    The **Privileges** subpage (visible only if we are logged in as a privileged user)
    contains dialogs to manage MySQL user accounts. It also contains dialogs to manage
    privileges on global, database, and table levels. This subpage is hierarchical.
    For example, when editing a user''s privileges, we can see the global privileges
    as well as the database-specific privileges. We can then go deeper to see the
    table-specific privileges for this database-user combination.


    # The user overview


    The first page displayed when we enter the **Privileges** subpage is called **User
    overview**. This shows all user accounts and a summary of their global privileges,
    as shown in the next screenshot:'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# MySQL Server Administration


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_302_0.png)


    From this page, we can:


    +   - Edit a user''s privileges with the **Edit** link on a user''s line

    +   - Use the checkboxes to remove users with the **Remove selected users** dialog

    +   - Access the page where the **Add a new User** dialog is available


    The displayed users'' list has columns with the following characteristics:


    +   - **User**: The user account we are defining.

    +   - **Host**: The machine name, or IP address, from which this user account
    will be connecting to the MySQL server. A % value here indicates all hosts.

    +   - **Password**: Contains **Yes** if a password is defined and **No** if it
    isn''t. The password itself cannot be seen from phpMyAdmin''s interface, or by
    directly looking at the `mysql.user` table, as it is obfuscated with a one-way
    hashing algorithm.

    +   - **Global privileges**: Listed for each user.

    +   - **Grant**: Contains **Yes** if the user can grant his/her privileges to
    others.


    # Privileges reload


    At the bottom of User Overview, this message is displayed:


    > Note: phpMyAdmin gets the users'' privileges directly from MySQL''s privilege
    tables. The content of these tables may differ from the privileges the server
    uses, if they have been changed manually. In this case, you should reload the
    privileges before you continue.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'Here, **reload the privileges** is clickable. The effective privileges (the
    ones against which the server bases its access decisions) are the privileges that
    are located in the server''s memory. Privilege modifications, to be made from
    the **User overview** page, are made both in memory and on disk, in the mysql
    database. Modifications made directly to the mysql database do not have immediate
    effect. The **reload the privileges** operation reads the privileges from the
    database and makes them effective in memory.


    # Adding a user


    The **Add a new User** link brings a dialog for user account creation. First,
    we see the panel where we''ll describe the account itself.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_303_0.png)


    The second part of the **Add a new User** dialog is where we''ll specify this
    user''s global privileges, which apply to the server as a whole (see the *Global
    privileges* section).


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_303_1.png)'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# User name


    The User name menu offers two choices. We can choose Use text field and input
    a user name in the box, or we can choose Any user to create an anonymous user
    (the blank user). Let''s choose Use text field and enter bill.


    # Host


    By default, this menu is set to Any host with % as the host value. The Local choice
    means "localhost". The Use host table choice (which creates a blank value in the
    host field) means to look in the mysql.hosts table for database-specific privileges.
    Choosing Use text field allows us to input the exact host value we want. Let''s
    choose Local.


    # Password


    Even though it''s possible to create a user without a password (with the No password
    choice), it''s best to have a password. We have to enter it twice (as we cannot
    see what is entered) to confirm the intended password. Let''s input bingo.


    Some administrators prefer to improve security by having phpMyAdmin generate a
    password itself. In the Generate Password dialog, a click on Generate puts a random
    password (in clear) on screen. At this point, we should note the password so that
    we can pass it on to the user. Then a click on Copy puts this password in the
    Password and Re-Type fields.


    # Database creation and rights


    A frequent convention is to assign a user, the rights to a database, having the
    same name as this user. To accomplish this, the Database for user section offers
    the checkbox Create database with same name and grant all privileges,. Clicking
    this checkbox automates the process by creating both the database and the corresponding
    rights. Please note that, with this method, each user would be limited to one
    database (user bill, database bill).


    Another possibility is to allow users to create databases that have the same prefix
    as their usernames. Therefore, the other choice Grant all privileges on wildcard
    name (username\_%) performs this function by assigning a wildcard privilege. With
    this in place, user bill could create the databases bill_test, bill_2, bill_payroll,
    and so on; phpMyAdmin does not pre-create the databases in this case.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Global privileges


    Global privileges determine the user''s access to all databases. Hence, these
    are sometimes known as "superuser privileges". A normal user should not have any
    of these privileges unless there is a good reason.


    Of course, if we are really creating a superuser, we will select every global
    privilege that he/she needs. These privileges are further divided into **Data**,
    **Structure**, and **Administration** groups.


    In our example, **bill** will not have any global privileges.


    # Resource limits


    We can limit the resources used by this user on this server (for example, the
    maximum queries per hour). Zero means no limit. We will not impose any resources
    limits on **bill**.


    The following screenshot shows the status of the screen, just before hitting **Go**
    to create this user''s definition (with the fields that are left being set to
    default):


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_305_0.png)'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Editing a user


    The page used to edit a user appears after a user''s creation, or whenever we
    click Edit for a user in the User overview page. There are four sections on this
    page, each with its own Go button. Hence, each section is operated independently
    and has a distinct purpose.


    # Edit privileges


    The section for editing the user''s privileges has the same look as the Add a
    new User dialog, and is used to view and to change global privileges.


    # Database-specific privileges


    In this section, we define the databases to which our user has access, and his/her
    exact privileges.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_306_0.png)


    As shown in the above screenshot, we see None because we haven''t defined any
    privileges yet. There are two ways of defining database privileges. First, we
    can choose one of the existing databases from the drop-down menu.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_306_1.png)'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'This assigns privileges only for the chosen database. We can also choose **Use
    text field** and enter a database name. We could insert a non-existent database
    name, so that this user can create it later (provided we give him/her the CREATE
    privilege in the next panel). We can also use special characters, such as the
    underscore and the percent sign for wildcards.


    For example, entering **bill** here would enable him to create a **bill** database,
    and entering **bill%** would enable him to create a database with any name that
    starts with **bill**. For our example, we will enter **bill**.


    The next screen is used to set **bill**''s privileges on the **bill** database
    and create table-specific privileges.


    To learn more about the meaning of a specific privilege, we can move the mouse
    over a privilege name (which is always in English), and an explanation about this
    privilege appears in the current language. We give **SELECT, INSERT, UPDATE, DELETE,
    CREATE, ALTER, INDEX, and DROP** privileges to **bill** on this database. We then
    click **Go**.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_307_0.png)'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'After the privileges have been assigned, the interface stays at the same place,
    so that we can refine these privileges further. We cannot assign table-specific
    privileges for the moment, as the database yet does not exist.


    The way to go back to **bill**''s general privileges page is to click the **''bill''@''localhost''**
    title.


    This brings us back to the familiar page, except for a change in one section.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_308_0.png)


    We see the existing privileges on the **bill** database for user **bill** (which
    we can **Edit** or **Revoke**), and we can add privileges for **bill** on another
    database. We also see that **bill** has no table-specific privilege on the **bill**
    database.


    # Changing the password


    This dialog is part of the **Edit user** page, and we can use it either to change
    **bill**''s password or to remove it. Removing the password will enable **bill**
    to login without a password.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_308_1.png)


    # Changing login information or copying a user


    This dialog can be used to change the user''s login information, or to copy his/her
    login information to a new user. For example, suppose that Bill calls and tells
    us that he prefers the login name **billy** instead of **bill**. We just have
    to add a y to the user name, choose **Local** as the host, and select **delete
    the old one from the user tables**.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_309_0.png)


    After this operation, bill no longer exists in the mysql database. Also, all his
    privileges, including the privileges on the bill database, will have been transferred
    to the new user – billy. But bill''s user definition will still exist in memory,
    and hence it is still effective. If we had chosen the delete the old one from
    the user tables and reload the privileges afterwards option instead, bill''s user
    definition would immediately have ceased to be valid.


    Alternatively, we could have created another user based on bill, by making use
    of the keep the old one choice. We can transfer the password to the new user by
    choosing Do not change the password, or change it by entering a new password twice.
    The revoke all active privileges... option immediately terminates the effective
    current privileges for this user if he/she is logged in.


    # Removing a user


    This is done from the User overview section of the Privileges page. We select
    the user to be removed. Then (in Removing selected users) we can choose Drop,
    to remove any databases that have the same name as the users we are deleting.
    A click on Go effectively removes the selected users.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Database information


    The Databases subpage is intended to quickly get privileges information for each
    database. Optionally, it can also be used to obtain global statistics on these
    databases, without having to click on each database in the navigation panel. When
    we enter the Databases subpage, we see the list of existing databases.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_310_0.png)


    We also see an Enable Statistics link. By default, statistics are not enabled
    because computing the size of data and indexes for all the tables in all the databases
    may cost valuable MySQL server resources.


    # Enabling statistics


    If we click this Enable Statistics link, a modified page appears. For each database,
    we get the default collation for tables in this database, along with the number
    of tables and the total number of rows for all tables. Next, information about
    the space used by the data portion of the tables is given, followed by the space
    taken by all indexes and total space for all tables. Finally, the space that could
    be reclaimed by optimizing some tables in this database is presented under Overhead.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_311_0.png)


    # Sorting statistics


    By default, the list is sorted by database name in ascending order. If we need
    to find the database with the most tables or the database that takes the most
    space, a simple click on the Tables or Total column header sorts them accordingly.
    A second click reverses the sort order.


    # Checking the database privileges


    Clicking the Check Privileges icon displays all the privileges on a specific database.
    A user''s global privilege might be shown here, as it gives him/her access to
    this database as well. We can also see the privileges specific to this database.
    An Edit link takes us to another page that is used to edit the user''s privileges.


    Users having access to "marc_book"


    | User | Host | Type | Privileges | Grant | Action |

    |------|------|------|------------|-------|--------|

    | admin | % | global | ALL PRIVILEGES | Yes | |

    | marc | % | wildcard: marc% | SELECT, INSERT, UPDATE, DELETE, CREATE, DROP |
    No | |

    | root | % | global | ALL PRIVILEGES | Yes | |


    # Dropping selected databases


    This is an operation that should not be taken lightly. To drop one or more databases,
    we put check marks next to the names of the databases to be dropped, and click
    on the red X next to With selected. We then get a confirmation screen.


    # Server information


    The Status, Variables, and Processes menu tabs are available to get information
    about the MySQL server, or to act upon specific processes.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Server status verification


    These statistics reflect the MySQL server''s total activity, including (but not
    limited to) the activity generated by queries sent from phpMyAdmin.


    # The general status page


    Clicking the Status link produces runtime information about the server. The page
    has several sections. First, we get information about the elapsed running time
    and the startup time. Then we get the total and average values, for traffic and
    connections (where the ø means average).


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_312_0.png)


    Next, the statistics about the queries are displayed (shown in part here). The
    average number of queries per hour, minute, and second give a good indication
    of the server load.


    This is followed by statistics about each MySQL command, the absolute number of
    times, hour average, and the number of times as a percentage of the total.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_312_1.png)'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'Depending on the MySQL version, many other sections containing server information
    are displayed.


    # InnoDB status


