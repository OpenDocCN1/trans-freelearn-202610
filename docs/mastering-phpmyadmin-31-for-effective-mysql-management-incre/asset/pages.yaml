- pgno: 279
  md: '# 17


    # MySQL 5.0 and 5.1 Support


    MySQL 5.0 introduced a number of new features. The announcement of these features
    calmed down a number of developers and industry observers who were claiming that
    MySQL was an inferior product as compared to some competitors'' products, which
    already had these features. Views, stored procedures, triggers, a standard INFORMATION_SCHEMA,
    and (more recently) a profiling mechanism are now present in the MySQL spectrum.


    Among the new features of MySQL 5.1, the ones that relate to a web interface (for
    example, partitioning and events) are supported in phpMyAdmin.


    # Views


    MySQL 5.0 introduced support for the named, and updatable views. A view is a derived
    table (consider it a virtual table) whose definition is stored in the database.
    A SELECT statement done on one or more tables (or even on views), is stored as
    a view and can also be queried.


    Views can be used to:


    +   - Limit the visibility of columns (for example, do not show the salary)

    +   - Limit the visibility of rows (for example, do not show data for specific
    world regions)

    +   - Hide a changed table structure (so that legacy applications can continue
    to work)


    As a view, by itself, has some permissions attached to it, it is easier to GRANT
    permissions on the view as a whole, rather than define cumbersome, column-specific
    privileges on the underlying tables.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'To activate the support for views on a server after an upgrade from a pre-5.0
    version, the administrator has to execute the mysql_fix_privileges_tables script,
    as described in the MySQL manual.


    > Each user must have the appropriate SHOW_VIEW or CREATE_VIEW privilege to be
    able to see or manipulate views. These privileges exist at the global (server),
    database, and table levels.


    phpMyAdmin supports two ways of creating a view. We''ll explain the manual method
    first, and then go on with a more visual way.


    # Manually creating a view


    To create a view manually, we use the query box to enter the appropriate statement.
    Let''s input the following lines and click Go:


    ```

    CREATE VIEW book_author AS

    SELECT book.isbn, book.title, author.name FROM book

    LEFT JOIN author ON author.id = book.author_id

    ```


    > Creating a view implies that the user has privileges on the tables involved,
    or at least a privilege such as, SELECT or UPDATE on all the columns mentioned
    in the view.


    At this point, the view has been created, and the left panel is updated to reflect
    this fact. If we refresh our browser''s page and then access the marc_book database,
    we will see:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_280_0.png)


    In the left panel, there is a different icon next to the book_author view indicating
    it''s not a regular table. In the right panel, we see the information on newly-created
    view. The number of records for the view currently indicates 0 (more on this in
    the Performance Hint section later in this chapter), and View is indicated in
    the Type column. There is no collation or size associated with a view.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'This creation step was completed manually. Other operations on views are handled
    by the phpMyAdmin interface.


    # Right panel and views


    As a view has certain similarities with a table, its name is available in the
    navigation panel, along with the names of the ordinary tables. On clicking the
    view name, a panel similar to the one seen for tables is displayed, but with fewer
    menu tabs than seen in a normal table. Indeed, some operations do not make sense
    on a view—for example, Import. This is because a view does not actually contain
    data. However, other actions, such as Browse, are perfectly acceptable.


    Let''s browse this view:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_281_0.png)


    We notice that, in the generated SQL query, we do not see our original CREATE
    VIEW statement. The reason is that we are selecting from the view using a SELECT
    statement, hiding the fact that we are pulling data from a view. However, exporting
    the view''s structure would show how MySQL internally stored our view.


    ```

    CREATE ALGORITHM=UNDEFINED DEFINER=`marc`@`%` SQL SECURITY DEFINER VIEW `book_author`
    AS select `book`.`isbn` AS `isbn`, `book`.`title` AS `title`, `author`.`name`
    AS `name` from (`book` left join `author` on((`book`.`author_id` = `author`.`id`)));

    ```'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'The right panel''s menu may look similar to that of a table. However, when
    necessary, phpMyAdmin generates the appropriate syntax for handling views. For
    example, a click on **Drop** would produce:


    **Do you really want to: DROP VIEW ''book_author''**


    At this point, we can confirm (or not) this view''s deletion.


    > To perform actions on existing views, a user needs to have the appropriate privilege
    at the view level, but not necessarily any privilege on the tables involved in
    this view. This is how we can achieve column and table hiding.


    # Creating a view from results


    Creating a complex view may require typing the complete statement into a query
    box. Another possibility is to take advantage of phpMyAdmin''s **Search** (at
    the table level) or **Query** (at the database level) features to build a rather
    complex query, execute it, and then easily create a view from the results. We''ll
    see how this is done.


    We mentioned that a view can be used to limit the visibility of columns (and in
    fact, of tables). Let''s say that the number of pages in a book is highly classified
    information. We open the book table, click **Search**, and choose a subset of
    the columns:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_282_0.png)


    Clicking **Go** produces a results page, where we see a **CREATE VIEW** link in
    the **Query results operations** section. We use this link to access the view
    creation panel, which already has the underlying query in the **AS** box. We need
    to choose a name for this view (here **book_public_info**), and we can optionally
    set different column names for it (here **number, title**). The other options
    can influence the view''s behavior, and have been explained in the MySQL manual
    (http://dev.mysql.com/doc/refman/5.1/en/create-view.html).'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'A click on Go generates the view we asked for.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_283_0.png)


    The CHECK OPTION clause influences the behavior of the updateable views (this
    is explained in the MySQL manual at the page cited previously).


    # Renaming a view


    phpMyAdmin does not support renaming a view directly from the interface. However,
    since MySQL 5.0.14, the RENAME TABLE statement has been allowed to be used (from
    a phpMyAdmin''s query box) as long as we are renaming inside the same database.
    For example, RENAME TABLE book_public_info TO book_public_info2.


    # Performance hint


    phpMyAdmin has a configuration parameter, $cfg[''MaxExactCountViews''], that controls
    the rows counting phase of phpMyAdmin. Sometimes, a view comprises many huge tables
    and browsing it would make a large number of virtual rows appear. Therefore, the
    default value of 0 for this parameter ensures that no row counting happens for
    views. In this case, we''ll see rather strange results when browsing a view: Showing
    rows 0 -1 (0 total, Query took 0.0006 sec). But this is more acceptable than slowing
    down a server.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'Nonetheless, if we prefer to see a more exact row count for views, we can put
    a larger value in this parameter which acts as an upper limit for the rows counting
    phase.


    # Routines—stored procedures and functions


    It took a while before phpMyAdmin started to include support for these features.
    The reason is that stored procedures and functions are blocks of code (like a
    subprogram) that are kept as part of the database, and phpMyAdmin, being a web
    interface, is more oriented towards operations that are done quickly using a mouse.


    Nonetheless, phpMyAdmin has a few features that permit a developer to create such
    routines, save them, recall them to make some modifications, and then delete them.


    Procedures are accessed by a CALL statement to which we can pass parameters. On
    the other hand, functions are accessed from SQL statements (for example, SELECT),
    similar to other MySQL internal functions returning a value.


    > The CREATE ROUTINE and ALTER ROUTINE privileges are needed to be able to create,
    see, and delete a stored procedure or function. The EXECUTE privilege is needed
    to run the routine, although the privilege is normally granted automatically to
    its creator.


    # Creating a stored procedure


    We''ll create a procedure to change the page count for a specific book, by adding
    a specific number of pages. The book''s ISBN and the number of pages to be added,
    will be the input parameters to this procedure.


    # Changing the delimiter


    The standard SQL delimiter is the semicolon, and this character will be used inside
    our procedure to delimit SQL statements. However, the CREATE PROCEDURE statement
    is by itself an SQL statement; hence, we must come up with a way to indicate to
    the MySQL parser where this statement ends. The query box has a Delimiter input
    box, which contains a semicolon by default. Therefore, we change it to another
    string, which, by convention, is a double slash //.'
  merge: -1
  img_proc: true
- pgno: 285
  md: "![](img/cb8c75b631b4e1f7afe5a0d39becfda9_285_0.png)\n\n# Entering the procedure\n\
    \nWe then enter the procedure's code in the main query box:\n\n```\nCREATE PROCEDURE\
    \ `add_page`(IN param_isbn VARCHAR(25), IN param_pages INT, OUT param_message\
    \ VARCHAR(100))\nBEGIN\n  IF param_pages > 100 THEN\n    SET param_message = 'the\
    \ number of pages is too big';\n  ELSE\n    UPDATE book SET page_count = page_count\
    \ + param_pages WHERE isbn=param_isbn;\n    SET param_message = 'success';\n \
    \ END IF;\nEND\n//\n```\n\nOn clicking Go, we get a success message if the syntax\
    \ is correct. If it is not, well, it's time to revise our typing abilities or\
    \ debug our syntax. Unfortunately, MySQL does not come with a procedure debugger.\n\
    \n# Testing the procedure\n\nAgain, in the query box, we test our procedure by\
    \ entering the following statements. Here, we are using an SQL variable, @message,\
    \ which will receive the contents of the OUT parameter param_message:\n\n```\n\
    call add_page('1-234567-22-0', 4, @message);\nSELECT @message;\n```\n\nWe can\
    \ then verify whether the page count for this book has increased. We also need\
    \ to test the problematic case:\n\n```\ncall add_page('1-234567-22-0', 101, @message);\n\
    SELECT @message;\n```\n\nThis procedure is now available for calling from PHP,\
    \ using the mysqli extension."
  merge: -1
  img_proc: true
- pgno: 286
  md: "# Manipulation\n\nA procedure is stored inside a database, and is not tied\
    \ to a specific table. Therefore, the interface to manipulate procedures and functions\
    \ can be found at the database level, on the Structure page, under the Routines\
    \ slider.\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_286_0.png)\n\nThe first\
    \ icon brings this procedure's text into a query box for editing. The second icon\
    \ would be used to delete this procedure. When editing the procedure, we notice\
    \ that the text has been somewhat modified.\n\n```\nDROP PROCEDURE `add_page`\
    \ //\nCREATE DEFINER=`marc`@`%` PROCEDURE `add_page`(IN param_isbn VARCHAR(25),\
    \ IN param_pages INT, OUT param_message VARCHAR(100))\nBEGIN\n  IF param_pages\
    \ > 100 THEN\n    SET param_message = 'the number of pages is too big';\n  ELSE\n\
    \    UPDATE book SET page_count = page_count + param_pages WHERE isbn=param_isbn;\n\
    \    SET param_message = 'success';\n  END IF;\nEND\n```\n\nFirst, a DROP PROCEDURE\
    \ appears. This is normal since MySQL does not offer a statement that would permit\
    \ a change to the body of a procedure. Therefore, we have to delete a procedure\
    \ every time we want to change it. It's true that the ALTER PROCEDURE statement\
    \ exists, but it can only change the procedure's characteristics—for example,\
    \ adding a comment. Then, a DEFINER clause is shown. It was generated at the creation\
    \ time, and indicates who created this procedure.\n\nAt this point, we make any\
    \ changes we need to the code and hit Go to save this procedure."
  merge: -1
  img_proc: true
- pgno: 287
  md: "![](img/cb8c75b631b4e1f7afe5a0d39becfda9_287_0.png)\n\n> It might be tempting\
    \ to open the book table on its Structure page and look for a list of procedures\
    \ that manipulate this table, such as our add_page() procedure. However, all procedures\
    \ are stored at the database level, and there is no direct link between the code\
    \ itself (UPDATE book) and the place where the procedure is stored.\n\n# Manually\
    \ creating a function\n\nFunctions are similar to stored procedures. However,\
    \ a function may return just one value, whereas a stored procedure can have more\
    \ than one OUT parameter. On the other hand, using a stored function from within\
    \ a SELECT statement may seem more natural because it avoids the need for an intermediate\
    \ SQL variable to hold the value of an OUT parameter.\n\nWhat is the goal of functions?\
    \ As an example, a function can be used to calculate the total cost of an order,\
    \ including tax and shipping. Putting this logic inside the database, instead\
    \ of at the application level, helps document the application-database interface.\
    \ It also avoids duplicating business logic in every application that needs to\
    \ deal with this logic.\n\nWe should not confuse MySQL 5.0 functions with UDF\
    \ (User-Defined Functions), which existed prior to MySQL 5.0. A UDF constitutes\
    \ code written in C or C++, compiled into a shared object, and referenced with\
    \ a CREATE FUNCTION statement and the SONAME keyword.\n\nphpMyAdmin's treatment\
    \ of functions is in many ways similar to what we have covered in procedures:\n\
    \n+   - A query box to input a function\n+   - The use of a delimiter\n+   - A\
    \ mechanism to manipulate a function that is already defined\n\nLet's define a\
    \ function that retrieves the country name, based on its code. I prefer to use\
    \ a param_ prefix to clearly identify the parameters inside the function's definition,\
    \ and a var_ prefix for local variables. We'll use our trusty SQL query box to\
    \ input the function's code, again indicating to this box to use // as the delimiter.\n\
    \n```\nCREATE FUNCTION get_country_name(param_country_code CHAR(2))\n  RETURNS\
    \ VARCHAR(50)\nBEGIN\n  DECLARE var_country_name VARCHAR(50) DEFAULT 'not found';\n\
    \  SELECT description\n```"
  merge: -1
  img_proc: true
- pgno: 288
  md: "# MySQL 5.0 and 5.1 Support\n\n```\n```sql\n    INTO var_country_name\n   \
    \ FROM country\n    WHERE code = param_country_code;\n    RETURN var_country_name;\n\
    \    END\n    //\n```\n```\n\nWe should note that our newly created function can\
    \ be seen on the database's Structure page, along with its friend, the add_page\
    \ procedure:\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_288_0.png)\n\n# Testing\
    \ the function\n\nOn testing this function:\n\n```\n```sql\nSELECT CONCAT('ca->',\
    \ get_country_name('ca'), ', zz->', get_country_name('zz')) as test;\n```\n```\n\
    \nWe get this result:\n\nca->Canada, zz->not found\n\n# Exporting stored procedures\
    \ and functions\n\nWhen exporting a database, procedures and functions do not\
    \ appear (by default) in an SQL export. A checkbox, Add CREATE PROCEDURE / FUNCTION\
    \ / EVENT, exists in the Structure dialog of the Export page, to include those\
    \ in the SQL export file. If we try it, we obtain:\n\n```\n```sql\nDELIMITER $$\n\
    --\n-- Procedures\n--\nCREATE DEFINER=`marc`@`%` PROCEDURE `add_page`(IN param_isbn\
    \ VARCHAR(25), IN param_pages INT, OUT param_message VARCHAR(100))\nBEGIN\n  IF\
    \ param_pages > 100 THEN\n    SET param_message = 'the number of pages is too\
    \ big';\n  ELSE\n    UPDATE book SET page_count = page_count + param_pages WHERE\
    \ isbn=param_isbn;\n    SET param_message = 'success';\n```\n```"
  merge: -1
  img_proc: true
- pgno: 289
  md: "```\nEND IF;\nEND$$ \n--\n-- Functions\n--\nCREATE DEFINER=`marc`@`%` FUNCTION\
    \ `get_country_name`\n(param_country_code CHAR(2)) RETURNS varchar(50) CHARSET\
    \ latin1\nBEGIN\n  DECLARE var_country_name VARCHAR(50) DEFAULT 'not found';\n\
    \  SELECT description into var_country_name FROM country WHERE code = param_country_code;\n\
    \  RETURN var_country_name;\nEND$$\n\nDELIMITER ;\n```\n\n# Triggers\n\nTriggers\
    \ are code that we associate with a table to be executed when certain actions\
    \ occur – for example, after a new INSERT in the table book. The action does not\
    \ need to happen from within phpMyAdmin.\n\nContrary to routines that are related\
    \ to an entire database and visible on the database's Structure page, triggers\
    \ for each table are accessed from this specific table's Structure page.\n\n>\
    \ Prior to MySQL 5.1.6, we needed the SUPER privilege to create and delete triggers.\
    \ In version 5.1.6, a TRIGGER table-level privilege was added to the privilege\
    \ system. Hence, a user no longer needs the powerful SUPER privilege for these\
    \ tasks.\n\nIn order to perform the following exercise, we'll need a new INT column\
    \ – total_page_count – in our author table.\n\nThe idea here is that every time\
    \ a new book is created, its page count will be added to the author's total page\
    \ count. I know that some people may advocate that it would be better not to keep\
    \ a separate column for the total here, instead compute the total every time we\
    \ need it. In fact, a design decision must be made when dealing with this situation\
    \ in the real world. Do we need to retrieve the total page count very quickly,\
    \ for example, for web purposes? And what is the response time to compute this\
    \ value from a production table with thousands of rows? Anyway, since I need it\
    \ as an example, the design decision is easy to make here."
  merge: -1
  img_proc: true
- pgno: 290
  md: "Let's not forget that following its addition to the table's structure, the\
    \ total_page_count column should initially be seeded with the correct total. (However,\
    \ this is not the purpose of our trigger.)\n\n# Manually creating a trigger\n\n\
    The current phpMyAdmin version does not have an interface for trigger creation.\
    \ Therefore, we input the trigger definition in a query box, taking special care\
    \ of entering // in the delimiter box:\n\n```\nCREATE TRIGGER after_book_insert\
    \ AFTER INSERT ON book\nFOR EACH ROW\nBEGIN\n  UPDATE author\n    SET total_page_count\
    \ = total_page_count + NEW.page_count\n    WHERE id = NEW.author_id;\nEND\n```\n\
    \nAfterwards, the Structure page for our book table reveals under the Details\
    \ slider a new Triggers section that can be used the same way as routines, to\
    \ edit or delete a trigger:\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_290_0.png)\n\
    \n# Testing the trigger\n\nContrary to testing stored procedures or functions,\
    \ there is neither a CALL sequence nor a function inside a SELECT statement to\
    \ execute the trigger. Any time the defined operation (a book INSERT) happens,\
    \ the code will execute (in our case, after the insertion). Therefore, we just\
    \ have to insert a new book to see that the author.total_page_count column is\
    \ updated.\n\nOf course, a completely automatic management of this column would\
    \ involve creating AFTER UPDATE and AFTER DELETE triggers on the book table."
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Information_schema


    In the SQL:2003 standard, access to the data dictionary (or database metadata)
    is provided by a structure called information_schema. As this is part of the standard,
    and already exists in other database systems, the decision to implement this feature
    into MySQL was a very good one.


    > MySQL has added some information that is not part of the standard—for example,
    INFORMATION_SCHEMA.COLUMNS.COLUMN_TYPE. Beware of the fact that if you plan to
    use this information in a software project, it has to remain portable to other
    SQL implementations.


    A phpMyAdmin user sees the information_schema as a normal database containing
    views that describe many aspects of the structure of the databases hosted on this
    server. Here is a subset of what can be seen (and in fact, the only possible operation
    on this database is SELECT).


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_291_0.png)


    Internally, phpMyAdmin calls the information_schema for some of its operations
    instead of the corresponding SHOW statements to retrieve metadata. However, phpMyAdmin
    developers have noticed—and this was confirmed by other developers at the 2007
    MySQL Users Conference—that some SELECT operations involving a WHERE clause on
    information_schema are really slow (many minutes of wait time) when the server
    hosts hundreds of databases or tables. Therefore, in the current state of MySQL,
    caution must be exercised about using this feature in our programming projects.'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'The $cfg[''Servers''][$i][''hide_db''] parameter can be used to hide this "database"
    to users who might be confused by the sudden apparition of a database they know
    nothing about. It will probably depend on their level of expertise in MySQL. On
    a multi-user installation of phpMyAdmin, we cannot please everyone about this
    parameter''s value.


    # Profiling


    Profiling support has been added in the MySQL versions 5.0.37 and 5.1.28. We have
    previously seen the Profiling checkbox appear in query results.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_292_0.png)


    When this box is checked, phpMyAdmin will analyze every query (including the current
    one), and a report about the execution time of each MySQL internal operation is
    displayed.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_292_1.png)'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Although the profiling system can report additional information about operations
    (such as, the CPU time, and even the internal server''s function names), phpMyAdmin
    currently displays only the name of the operation and its duration.


    # Partitioning


    User-defined partitioning (http://dev.mysql.com/doc/refman/5.1/en/partitioning.html)
    is offered in MySQL 5.1. Using this feature in phpMyAdmin requires knowledge of
    its syntax because there are many partition types. Also, for each partition type,
    the number of partitions and the values associated with each partition are too
    random to be easily represented on a web interface.


    # Table creation


    Let''s try it by creating a table named test with one field. On the table creation
    panel, if connected to a MySQL 5.1 server, phpMyAdmin shows a PARTITION definition
    dialog:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_293_0.png)


    Here, we type in a PARTITION BY RANGE clause, which will create partitions on
    the id column.'
  merge: -1
  img_proc: true
- pgno: 294
  md: "# Operations\n\nOn a table on which a partition has been defined, the Operations\
    \ subpage displays a Partition maintenance dialog where we can:\n\n+   - Choose\
    \ a partition and then ask for an action such as Rebuild on it\n+   - Remove all\
    \ the partitioning\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_294_0.png)\n\n\
    # Exporting\n\nFinally, exporting this test table in SQL mode produces statements\
    \ with embedded comments that a MySQL 5.1 server would recognize and interpret\
    \ to recreate the same partitions.\n\n```\nCREATE TABLE `test` (\n  `id` int(11)\
    \ NOT NULL\n) ENGINE=MyISAM DEFAULT CHARSET=latin1\n/*!50100 PARTITION BY RANGE\
    \ (id)\n(PARTITION p0 VALUES LESS THAN (1000) ENGINE = MyISAM,\n PARTITION p1\
    \ VALUES LESS THAN (2000) ENGINE = MyISAM,\n PARTITION p2 VALUES LESS THAN (3000)\
    \ ENGINE = MyISAM) */;\n```\n\n# Event scheduler\n\nThe Event Scheduler (http://dev.mysql.com/doc/refman/5.1/en/events.html),\
    \ another new feature of MySQL 5.1, permits the creation of tasks that will run\
    \ automatically according to a schedule. The schedule is quite flexible and permits,\
    \ for example, a statement to be run every ten seconds, starting from midnight,\
    \ May 18, 2011. These can be one-time events or recurring ones.\n\n# Activating\
    \ the scheduler\n\nWe should first verify whether the scheduler is active on our\
    \ server. If not, we need to activate it. Otherwise, nothing will happen! We start\
    \ by typing this statement in the query box:\n\n```\nSHOW VARIABLES LIKE `event%`;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 295
  md: "Next, we look for a variable named event_scheduler. If this variable is set\
    \ to OFF, we need to ask the system administrator (or someone with the SUPER privilege)\
    \ to execute the following statement:\n\n```\nSET GLOBAL event_scheduler = ON;\n\
    ```\n\n# Granting EVENT permission\n\nEvery user who wants to create or drop an\
    \ event needs the EVENT privilege, either globally, or on the database on which\
    \ he/she plans to add the event. Please refer to Chapter 18 for details about\
    \ granting such privileges.\n\n# Creating an event\n\nThe current 3.1.x phpMyAdmin\
    \ version does not have a web interface on which we could choose the various parts\
    \ of the CREATE EVENT statement. Therefore, the only method left is to use the\
    \ SQL query box to enter the statement and to know its syntax! Here, we'll use\
    \ a totally fictitious example:\n\n```\nCREATE EVENT add_page_count\n    ON SCHEDULE\n\
    \        EVERY 1 MINUTE\n    DO\n        UPDATE author set total_page_count =\
    \ total_page_count + 1 WHERE id = 1;\n```\n\nYou can now get some amusement by\
    \ browsing the author table once in a while, and see the counter incrementing\
    \ for author 1.\n\n# Event manipulation\n\nEvents are related to one database,\
    \ which is why you see an Events slider on the Structure page for the marc_book\
    \ database. Activating it reveals this panel:\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_295_0.png)\n\
    \nIndeed, this is a recurring event. We can use the first icon to edit the event\
    \ (which will have the effect of deleting and recreating the event), and the X\
    \ icon to remove it."
