- pgno: 319
  md: '# A History of phpMyAdmin


    This appendix details the birth and evolution of phpMyAdmin over its ten-year
    history. A one-person hobby project back in 1998, this software has grown, in
    terms of both the features and the number of people involved. As a testimony to
    this growth, the earliest source kit I could find (for version 1.1.0) occupied
    9 KB, compared to version 3.1.2''s size of 3.4 MB.


    # Early events


    The first internal version (0.9.0) was programmed by Tobias Ratschiller from Switzerland,
    and bears the date September 09, 1998. He then released version 1.0.1 on October
    26, 1998. The early versions were offered on Tobias''s site http://www.phpwizard.net
    (this site is no longer associated with him). Tobias wrote in the accompanying
    notes:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_319_0.png)


    > > "This work is based on Peter Koppelwieser''s MySQL-Webadmin. It was his idea
    to create a web-based interface to MySQL using PHP3. Although I have not used
    any of his source-code, there are some concepts I''ve borrowed from him. phpMyAdmin
    was created because Peter told me he wasn''t going to further develop his (great)
    tool."


    Compared to today''s version (ten years after the original), the first version
    was somewhat limited in features. Nevertheless it could be used to create databases
    and tables, edit their structures, and enter and retrieve data. In the figure
    that follows, you can see that the left panel was already in place to list database
    names (not table names yet), and the right panel was the workspace to manage a
    database or table. This is how the interface for databases looked like in version
    1.3.0:'
  merge: -1
  img_proc: true
- pgno: 320
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_320_0.png)


    To work on a table, you had the following screen:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_320_1.png)


    I was using phpMyAdmin version 1.2.0 (released November 29, 1998), and was immediately
    hooked to the idea of being able to use a web application to maintain a remote
    database. However, students at Collège de Sherbrooke, where I work in Québec,
    Canada, are French speaking folks. Therefore, I contacted Tobias and offered to
    transform his source code by outsourcing all messages in a message file. He accepted
    the offer, and I created both the English and French message files. Then, on December
    27, 1998, Tobias released version 1.3.1, the first multi-language version. (Meanwhile,
    he had managed to create the German message file.)'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'In 1999, and the first half of 2000, Tobias improved the navigation system,
    added features, and merged more language files. His project site maintained a
    discussion forum allowing new ideas to come along and patches to be discussed.
    Version 2.1.0 was released on August 06, 2000, which was the last version released
    by Tobias, who had no more time to devote to this project.


    # Project re-launch


    However, user base had already multiplied, and they were asking for more of the
    product. Patches were floating on the Internet, with no way of coordinating them.
    A security alert (and fix) had been published by a third-party, but no new version
    was being released. Finally, on March 31, 2001, Olivier Müller registered the
    phpMyAdmin project on SourceForge.net, and released a 2.2.0 pre-launch version.
    It was then called the unofficial version. This restart of the project attracted
    some developers, who now had the SourceForge infrastructure (CVS server, forums,
    bug trackers, and mailing lists) to help speed up the development. I personally
    re-joined the project in May 2001, and started fixing and improving the code,
    as my co-developers were doing.


    We became official on May 28, 2001, as Tobias accepted our version as the new
    official one. I remember those months of very intense development effort, with
    daily improvements and bug fixes, along with new documentation sections. This
    effort culminated on August 31, 2001, with the release of version 2.2.0.


    Here''s an excerpt from the announcement file for 2.2.0:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_321_0.png)


    > "After five months, five beta releases, and four release candidate versions,
    the phpMyAdmin developers are pleased to announce the availability of phpMyAdmin
    2.2.0. [...] on March 31, 2001. Olivier Müller (Switzerland), supported by Marc
    Delisle (Québec), Loïc Chapeaux (France), and a team of eight other developers
    re-started the phpMyAdmin project on SourceForge.net, with the authorization of
    the original package maintainer. Now, after five months of patches, bug fixes,
    new features, and testing, the version 2.2.0 is finally ready."


    This version had security fixes and seven new languages (with dynamic language
    detection). The code had been reworked to be CSS2 and XHTML 1.0 compliant, and
    to follow the PEAR coding guidelines. The bookmarks feature appeared in this version,
    and this came from a separate add-on called "phpMyBookmark".'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'During the following year, the development continued, with the release of seven
    minor versions. The last version of the 2.2.x series is 2.2.7-pl1, which is also
    the last to have been fully tested under PHP 3. We registered phpmyadmin.net as
    the official domain name for the project on April 03, 2002—the date is worth being
    noted.


    # Distributors


    The list of distributors for phpMyAdmin would be too long and complex to gather,
    but here are a few pointers. First, the Downloads page of MySQL''s website had
    a "contrib" section in which phpMyAdmin was mentioned very early after its birth.
    Also, many, if not all, Linux distributors included phpMyAdmin in their kit. Finally,
    a number of package builders prepare kits for various platforms. I''ll just mention
    the renowned XAMPP kit from Apache Friends, available at http://www.xampp.org.
    Back in mid-2002, the Apache Friends group was already busy integrating Apache,
    PHP, MySQL, and phpMyAdmin.


    # Evolution


    On August 11, 2002, version 2.3.0 was released. There had been so many new features
    that the pages were becoming too long. So, this version was the "great split version",
    creating subpages to group together related features, and thereby enhancing the
    Database and Table views.


    The team started a schedule of releasing a new minor version (2.3.1, 2.3.2 ...)
    every two months. Version 2.4.0, released on February 23, 2003, included a new
    server/user management facility. Then came version 2.5.0, on May 11, 2003, to
    mark the new MIME-type cell transformation system.


    Version 2.6.0—released on September 27, 2004—added support for the new mysqli
    extension available in PHP 5 for better performance and improved security. The
    interface for this version has been redesigned, including new icons and a theme
    manager. All these features are explained in this book. On April 16, 2005, version
    2.6.2 was born, adding basic support for MySQL''s views.


    In June 2005, the first meeting of phpMyAdmin''s development team took place in
    Karlsruhe, Germany, during LinuxTag 2005. Six members of the team from Switzerland,
    Germany, Czech Republic, and Canada were present, displaying phpMyAdmin and discussing
    its features with the event''s attendees. We also celebrated PHP''s and MySQL''s
    10th anniversary on the same occasion, along with the respective fathers of these
    products—Rasmus Lerdorf and Michael "Monty" Widenius. A few weeks before that,
    at the MySQL Users Conference in Santa Clara, a presentation was titled "PHP 5
    + MySQL 5 = A Perfect 10". Indeed, we were aware of what this anniversary meant
    in terms of the product''s maturity.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'Version 2.7.0 was released on December 04, 2005. With this version, we ended
    support for older configuration files – those prior to phpMyAdmin 2.3.0. Also,
    in 2.7.0, a new plug-in-based import module made its debut.


    Version 2.8.0 was made available on March 06, 2006. It included a new web-based
    setup mechanism. With 2.8.0, the team started a new numbering scheme for version
    releases. The 2.8 family contains fixes for only those features that are already
    present in 2.8.0. Here are some examples of the versions, which were expected
    to follow 2.8.0:


    +   - 2.8.0.1, for anything urgent like a security fix

    +   - 2.8.1, containing normal fixes for the 2.8 family

    +   - 2.9.0, with new features


    Version 2.9.0, released on September 20, 2006, added many small improvements such
    as a font size selector, new export formats, and the possibility of using an external
    authentication method. Version 2.10.0, released on February 27, 2007, had its
    main attraction as the Designer – a new graphical Ajax-based relation manager.
    Version 2.11.0, released on August 21, 2007, offered support for creating views.
    It also offered support for managing procedures, functions, and triggers.


    # GoPHP5 and the 3.x branch


    phpMyAdmin finally accepted an invitation to become an initial member of the GoPHP5
    initiative (see http://GoPHP5.org). This initiative promotes the adoption of PHP
    5 among web hosts. This means that the new feature releases of phpMyAdmin, after
    February 05, 2008, require a server that can at least run PHP 5.2.


    To better indicate the new PHP requirements, the team switched the major version
    number to 3. At the same time, it was decided to stop supporting MySQL prior to
    version 5.0 in the 3.x branch.


    Version 3.0 was released on September 27, 2008, with support for MySQL 5.1 features,
    such as partitioning and the event scheduler. This version also had a new start
    page and made use of JavaScript effects. Then, on November 11, 2008, version 3.1
    incorporated a new setup script and support for BLOB streaming – the work of two
    students from Google Summer of Code 2008. This version also added support for
    Swekey hardware authentication.


    phpMyAdmin continues to be popular. The cumulative downloads, since April 2001,
    have reached an impressive count of more than seventeen million in January 2009,
    at the time of writing this book.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Awards


    phpMyAdmin has won some awards, as can be seen in the "Awards" section of the
    project''s homepage. First, it was awarded "Project of the Month" for December
    2002, by the administrators of SourceForge. In the interview-style document that
    we prepared to put on the SourceForge POTM page, I wrote that I was impressed
    by the download rate of our product, which was three per minute at that time.
    (Since then, we have reached ten per minute on peak days.)


    phpMyAdmin received 75% of the votes from the readers of both the German PHP Magazine
    and its international version, in the category "Best PHP Application/Tool" for
    2003. This award was officially presented to two members of the team at the International
    PHP Conference, held at Frankfurt in November 2003. The German PHP Magazine hosted
    the readers'' choice again in 2005 and 2006, which phpMyAdmin won in both the
    years.


    SourceForge.net hosted its "Community Choice Awards" for the first time in 2006,
    and phpMyAdmin won in two categories – Databases and System Administration. I
    represented the team at LinuxWorld, Boston, in April for the Awards presentation.
    The project also won "Best PHP Application of the Year" at the fifth Annual OS/2
    World Awards. At the end of 2006, our project won a Silver Trophy at the third
    "Trophées du Libre" contest; I went to France to receive the trophy.


    In 2007, at the SourceForge.net "Community Choice Awards", phpMyAdmin was nominated
    in the "Best Tool or Utility for Developers" category, and won the "Best Tool
    or Utility for SysAdmins" Award.


    At the beginning of 2008, MySQL AB was acquired by Sun Microsystems for an amount
    of $1billion. I assume this gave SourceForge.net the idea to propose a new award
    category: "Most Likely to Be the Next $1B Acquisition". However, as envisaged,
    phpMyAdmin won this award too, along with "Best Tool or Utility for SysAdmins".
    phpMyAdmin was also a finalist for "Best Tool or Utility for Developers".'
  merge: -1
  img_proc: true
- pgno: 325
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_325_0.png)


    PhpMyAdmin also won the InfoWorld''s "Best of open source platforms and middleware
    (MySQL administration)" prize for year 2008.


    # Summary


    This appendix covers phpMyAdmin''s history — from its roots back in 1998, through
    the project re-launch in 2001, and its subsequent evolution. It details each major
    version, explains the role of phpMyAdmin in the GoPHP5 initiative, and presents
    the list of awards collected by this software product. The next appendix explains
    how to troubleshoot phpMyAdmin, by examining some of its error messages and proposing
    solutions.'
  merge: -1
  img_proc: true
- pgno: 326
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 327
  md: '# B


    # Troubleshooting and Support


    This appendix proposes guidelines for solving some common problems, and gives
    hints on how to avoid them. It also explains how to interact with the development
    team for support, bug reports, and contributions.


    # System requirements


    A section at the beginning of the Documentation.html file (which is included with
    the downloaded kit), discusses system requirements for the particular phpMyAdmin
    version we are using. It is crucial that these requirements be met, and that the
    environment be properly configured so that problems are avoided.


    Some problems, such as phpMyAdmin bugs, are in fact caused by the server environment.
    Sometimes, the web server is not configured to interpret .php files correctly,
    or the PHP component inside the web server does not run with the mysqli or mysqli
    extensions. MySQL accounts may be badly configured. This can happen on home servers
    as well as on hosted servers.


    When we suspect that something is wrong, we can try a simple PHP script, test.php,
    which contains the following to check if the PHP component answers correctly.


    ```

    <?php

    echo ''hello'';

    ?>

    ```


    We should see the hello message. If this works, we can try another script:


    ```

    <?php

    phpinfo();

    ?>

    ```'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'This script displays information about the PHP component, including the available
    extensions. We should at least see a section about MySQL (proving that the mysql
    extension is available), which gives information about the MySQL Client API version.


    We can also try other PHP scripts that make a connection to MySQL, to see if the
    problem is more general than just phpMyAdmin not working. As a general rule, we
    should be running the latest stable versions of every component.


    # Base configuration


    We should always double-check the way we made the installation, including proper
    permissions and ownerships. Typos may occur while modifying config.inc.php.


    # Solving common errors


    To help solve a problem, we should first pinpoint the origin of the error message.
    Here are the various components that can generate an error message:


    +   - MySQL server: These messages are relayed by phpMyAdmin, which displays MySQL
    said followed by the message

    +   - PHP component of the web server: For example, Parser error

    +   - Web server: The error can be seen from the browser, or in the web server''s
    log files.

    +   - Web browser: For example, JavaScript errors


    The Error Messages and Other Problems sections are mostly based on various messages
    found on phpMyAdmin''s help forum and in the FAQ section of Documentation.html.


    # Error messages


    This section refers to explicit error messages, as displayed by phpMyAdmin.


    # Cannot load MySQL extension


    To connect to a MySQL server, PHP needs the mysql extension (mysqli extension
    is recommended for MySQL 4.1+), which is a set of MySQL functions. This extension
    may be compiled as a part of the PHP server. Or it may need to be loaded dynamically,
    in which case, phpMyAdmin may have tried to load it and failed. This error implies
    that no other PHP script can make connections to a MySQL server.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'The required extension is contained in a file that can be named mysql.so or
    mysqli.so on Linux or UNIX, or mysql.dll (maybe mysqli.dll) on Windows. If our
    PHP server comes from a software package, we can find and install another software
    package—probably called php-mysql or php-mysqli. (The name is distribution dependent.)
    Otherwise, we can compile our own PHP server with the appropriate extension, as
    explained in the PHP documentation.


    # #2003 - Can''t connect to MySQL server


    This message indicates that the MySQL server is not running, or cannot be reached
    from the web server. It can also be a socket (Linux/UNIX) or a named pipe (Windows)
    configuration problem.


    # Socket problem (Linux/UNIX)


    The socket configured in php.ini (an example of which is given below) does not
    correspond to the socket of the running MySQL server.


    ```

    mysql.default_socket = /tmp/mysql.sock

    ```


    As a result, PHP cannot reach MySQL. We can change it to:


    ```

    mysql.default_socket = /var/lib/mysql/mysql.sock

    ```


    However, to be sure, we must find the exact location of this socket.


    # Named pipe problem (Windows)


    This is a problem similar to that indicated above, but on Windows. It can be solved
    by adjusting mysql.default_socket with the correct named pipe used to connect
    locally to a MySQL server. For example:


    ```

    mysql.default_socket = MySQL

    ```


    # MySQL said: Access denied


    This error can be solved when we understand the relevant login parameters.


    # When using http authentication


    We cannot use the web server security mechanism based on a .htaccess file and
    the http authentication in config.inc.php together. As a workaround, use cookie
    as the authentication type instead of http.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# When using http, cookie, or config authentication


    The host parameter in config.inc.php must match the host defined in the user access
    privileges. Sometimes, a system administrator may create an account authorizing
    user bill and host localhost. If we try to use 127.0.0.1 host in config.inc.php,
    it will be rejected by MySQL even though it points to the same machine. The same
    problem can occur if we try the real name of the machine (mysql.domain.com) and
    the definition has been made for localhost.


    # Access denied ... "using password: NO"


    If the message ends with using password: NO, it means that we are not transmitting
    a password, and MySQL is rejecting this login attempt. The password value may
    not have been set in config.inc.php.


    # Access denied ... "using password: YES"


    A password is transmitted, but the host/username/password combination has been
    rejected by MySQL.


    # Warning: cannot add header information


    This problem is caused by some characters (such as blank lines or spaces) being
    present in config.inc.php – either before the <?php tag at the beginning, or after
    the ?> tag at the end. We should remove these with an editor that supports .php
    files (as discussed in Chapter 1).


    # MySQL said: Error 127, Table Must Be Repaired


    In the left panel, we click on the database name. In the right panel, we select
    the name of the table for which there is an error (using the relevant checkbox).
    We then choose Repair from the lower drop-down list. More details are available
    in Chapter 10.


    # BLOB column used in key specification without a key length


    MySQL requires that an index set on a BLOB column be limited in size. The simple
    index creation technique available when creating a column, does not permit the
    size to be specified. Therefore, we need to create the column without an index.
    We then come back to the Structure page, and use the Create an index dialog to
    choose the BLOB column and set a size for the index.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# IIS: No Input File Specified


    This is a permission problem. **Internet Information Server (IIS)** must be able
    to read our scripts. As the server is running under the user **IUSR_machinename**,
    we have to follow the steps mentioned next:


    +   1. Right-click on the folder where we installed phpMyAdmin.

    +   2. Choose **Properties**.

    +   3. Click on **Add** under the **Security** tab, and select the **IUSR_machinename**
    user from the list.

    +   4. Ensure that this user has read permission to the directory.


    # A "404: page not found" error when modifying a row


    This happens when the $cfg[''PmaAbsoluteUri''] parameter in config.inc.php is
    not set properly. Chapter 1 explains how to take care of this parameter.


    # Other problems


    Here, we cover solutions to problems that do not show up on screen as a specific
    error message.


    # Blank page or weird characters


    By default, phpMyAdmin uses output buffering and compression techniques to speed
    up the transmission of results to the browser. These techniques can interfere
    with other components of the web server, causing display troubles. We can set
    $cfg[''OBGzip''] to FALSE in config.inc.php. This should solve the problem.


    # Not being able to create a database


    **No privileges** appears next to the **Create database** dialog on the homepage,
    if phpMyAdmin detects that the account used to log in does not have the permissions
    to create a database. This situation occurs frequently on hosted servers, where
    the system administrator prefers to create one database for each customer.


    If we are not on a hosted server, this message simply reflects the fact that we
    have neither the global **CREATE** privilege nor any **CREATE** privilege on a
    wildcard database specification.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Problems importing large files or uploading large BLOB files


    Usually, these problems indicate that we have hit a limit during the transfer.
    Chapter 8 explains these limits and the recommended course of action. As a last
    resort, we might have to split our large text files. (Search the Internet for
    **file splitters**.)


    # MySQL root password lost


    The MySQL manual explains the general solution at http://www.mysql.com/doc/en/Resetting_permissions.html.


    The solution involves stopping the MySQL server and restarting it with the special
    option `skip-grant-tables` (which basically starts the server without security).
    The way to stop and restart the server depends on the server platform used. We
    can then connect to the server from phpMyAdmin as a superuser (like root) and
    any password. The next step is to change the root''s password (see Chapter 18).
    We can then stop the MySQL server and restart it using normal procedures. (Security
    will become active again.)


    # Duplicate field names when creating a table


    Here is a curious symptom. When we try to create a table containing, for example,
    one field named FIELD1 of type VARCHAR(15), it looks like phpMyAdmin has sent
    a command to create two identical fields named FIELD1. The problem is not caused
    by phpMyAdmin, but by the environment. In this case, the Apache web server seems
    well-configured to run PHP scripts when in fact it is not. However, this bug appears
    only for some scripts.


    The problem occurs when two different (and conflicting) sets of directives are
    used in the Apache configuration file. The first set of directives are:


    ```

    SetOutputFilter PHP

    SetInputFilter PHP

    ```


    and the second one:


    ```

    AddType application/x-httpd-php .php

    ```'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'These sets of directives may be in two different Apache configuration files,
    and hence, difficult to notice. The recommended way is to use AddType. Using this,
    we just need to put comments on the other lines (as shown in the following snippet)
    and restart Apache.


    ```

    #SetOutputFilter PHP

    #SetInputFilter PHP

    ```


    # Authentication window displayed more than once


    This problem occurs when we try to start phpMyAdmin with a URL other than the
    one set in $cfg[''PmaAbsoluteUri'']. For example, a server may have more than
    one name, or we may try to use the IP address instead of the name.


    # Column size changed by phpMyAdmin


    For a more efficient column definition, MySQL itself sometimes decides to change
    the column type and size. This happens mostly with CHAR and VARCHAR.


    # Seeing many databases that are not ours


    This problem occurs mostly after an upgrade to MySQL 4. The automatic server upgrade
    procedure gives the global privileges CREATE TEMPORARY TABLES, SHOW DATABASES,
    and LOCK TABLES to all users. These privileges also enable users to see the names
    of all the databases (but not their tables) until we upgrade the GRANT tables
    privilege as described in the MySQL manual. If the users do not need these privileges,
    we can revoke the privileges. The users will then see only those databases to
    which they have access rights.


    # Not being able to store a value greater than 127


    This is normal if we have defined a column of type TINYINT, as 127 is the maximum
    value for this column type. Similar problems may arise with other numeric column
    types. Changing the type to INT expands the available range of values.


    # Seeking support


    The starting point for support is the homepage, http://www.phpmyadmin.net, which
    has sections on documentation and support. There, you will find links to the discussion
    forums and to various trackers, such as:


    +   - Bug tracker

    +   - Feature requests tracker'
  merge: -1
  img_proc: true
- pgno: 334
  md: '+   - Translations tracker

    +   - Patches tracker

    +   - Support tracker


    # FAQs


    The Documentation.html file, which is part of the product, contains a lengthy
    FAQ section with numbered questions and answers. It is recommended to peruse this
    FAQ section as the first source for help.


    # Help forums


    The development team recommends that you first use the product''s forums to search
    for the problem encountered, and then start a new forum discussion before opening
    a bug report.


    # Creating a SourceForge account


    Creating a (free) SourceForge user account, and using it for posting on forums,
    is highly recommended. This enables better tracking of questions and answers.


    # Choosing the thread title


    It is important to choose the summary title carefully when you start a new forum
    thread. Titles like "Help me!", "Help a newbie!", "Problem", or "phpMyAdmin error!"
    are difficult to deal with, as the answers are threaded to these titles and further
    reference becomes problematic. Better titles would be: "Import with UploadDir",
    "User can''t but root can login", or "Server not responding".


    # Reading the answers


    As people will read, and almost always answer your question(s), giving feedback
    in the forum about the answers can really help the person who answered, and others
    who have the same problem.


    # Support tracker


    This is another place to ask for support. Also, if we have submitted a bug report,
    which is in fact a support request, the report will be moved to the support tracker.
    With your SourceForge user account, you will be notified of this tracker change.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Bug tracker


    In this tracker, we see bugs that have not yet been fixed, along with the bugs
    that have been fixed for the next version. (This is to avoid getting duplicate
    bug reports.)


    # Environment description


    As developers will try to reproduce the problem mentioned, it helps to describe
    your environment. This description can be short, but should contain the following
    items:


    +   - phpMyAdmin version (the team, however, expects that it is the current stable
    version)

    +   - Web server name and version

    +   - PHP version

    +   - MySQL version

    +   - Browser name and version


    Usually, it isn''t necessary to specify the operating system on which the server
    or the client is running, unless we notice that the bug pertains to only one OS.
    For example, FAQ 5.1 describes a problem where the user could not create a table
    having more than fourteen fields. This happens only under Windows 98.


    # Bug description


    We should give a precise description of what happens (including any error message,
    the expected results, and the effective results we get). Reports are easily managed
    if they describe only one problem per bug report (unless the problems are clearly
    linked).


    Sometimes, it might help to attach a short export file to the bug report, to help
    developers reproduce the problem. Screenshots are welcome.


    # Contributing to the project


    Since 1998, hundreds of people have contributed translations, code for new features,
    suggestions, and bug fixes.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# The code base


    The development team maintains an evolving code base from which they periodically
    issue releases. A paragraph on the download homepage section describes how to
    use Subversion to get the latest version in development. (This can also be done
    by downloading the Subversion snapshot.) A contribution (translation update, patch,
    new feature, and so on) will be considered with a higher priority if it refers
    to the latest code base, and not to an outdated phpMyAdmin version.


    # Translation updates


    Taking a look at the project''s current list of 55 languages, you will notice
    that they are not equally well maintained. The details about translations are
    available at http://www.phpmyadmin.net/home_page/translations.php. You can try
    to email the official translator for a particular language to propose corrections
    or translations of recently added messages. If this person does not answer, you
    can send your modifications to the translation tracker, inside a compressed (.zip)
    file.


    # Patches


    The development team can manage patches more easily if they are submitted in the
    form of a context diff against the current code base, with an explanation of the
    solved problem or the new feature achieved. Contributors are officially credited
    in Documentation.html, or at least in ChangeLog.


    # Future phpMyAdmin versions


    Here are the points that the development team is considering for the next versions:


    +   - Improved support of MySQL''s new features

    +   - User preferences in permanent storage

    +   - Internal code improvements


    # Summary


    This appendix covers how to prevent problems with a properly configured server,
    along with where and how to ask for help. The appendix also explains some common
    errors and suggests solutions. Moreover, the Contributing to the Project section
    covers how one can contribute to help improve phpMyAdmin.'
  merge: -1
  img_proc: true
