- pgno: 182
  md: '> Using **DISTINCT**, we see each language only once. Without this option,
    the row containing **en** would have appeared three times.


    # Complete database search


    In the previous examples, searching was limited to one table. This assumes knowledge
    of the exact table (and columns) where the necessary information might be stored.


    When the data is hidden somewhere in the database, or when the same data can be
    presented in various columns (for example, a **title** column or a **description**
    column), it is easier to use the database search method.


    We enter the **Search** page in the Database view for the `marc_book` database:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_182_0.png)


    In the **Word(s) or value(s)** section, we enter what we want to find. The % wildcard
    character can prove useful here. We enter **souvenirs**.


    In the **Find** section, we specify how to treat the values entered. We might
    need to find **at least one of the words** entered, **all words** (in no particular
    order), or **the exact phrase** (words in the same order, somewhere in a column).
    Another choice is to use a **regular expression**, which is a more complex way
    of doing pattern matching. We will keep the default value — **at least one of
    the words**.


    We can choose the tables to restrict the search or select all the tables. As we
    only have two (small) tables, we select both.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '> As the search will be done on each row of every table selected, we might
    hit some time limits if the number of rows or tables is too big. Thus, this feature
    can be deactivated by setting $cfg[''UseDbSearch''] to FALSE. (It is set to TRUE
    by default).


    Clicking Go finds the following for us:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_183_0.png)


    This is an overview of the number of matches and the relevant tables. We might
    get some matches in the tables in which we may not be interested. However, for
    the matches that look promising, we can Browse the results page, or we can Delete
    the unwanted rows.


    # Restricting search to a column


    Sometimes, a particular column name is part of one (or many) tables, and we want
    to search only inside this column. For example, suppose that we are looking for
    "Marc", but this name could be also part of a book''s title. So, we want to restrict
    the search to only the "name" column in all the chosen tables. This can be achieved
    by entering "name" in the Inside field choice.


    # Summary


    In this chapter, we take an overview of single table searches with "query by example
    criteria" and additional criteria specification – selecting displayed values and
    ordering results. We also look at wildcard searches and full database search.
    The next chapter will explain how to perform the operations on tables – for example,
    changing a table''s attributes, such as its storage engine. The subjects of repairing
    and optimizing tables are covered in this chapter as well.'
