- pgno: 185
  md: '# 10


    # Table and Database Operations


    In the previous chapters, we dealt mostly with table fields. In this chapter,
    we will learn how to perform some operations that influence tables or databases
    as a whole. We will cover table attributes and how to modify them, and will also
    discuss multi-table operations.


    Various links that enable table operations have been put together on the Operations
    subpage of the Table view. Here is an overview of this subpage:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_185_0.png)'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Table maintenance


    During the lifetime of a table, it repeatedly gets modified; so, it continually
    grows and shrinks. Outages may occur on the server, leaving some tables in a damaged
    state.


    Using the Operations subpage, we can perform various operations, which are listed
    next. However, not every operation is available for every table type.


    +   - **Check table:** Scans all rows to verify that deleted links are correct.
    Also, a checksum is calculated to verify the integrity of the keys; we should
    get an OK message if everything is all right.

    +   - **Analyze table:** Analyzes and stores the key distribution; this will be
    used on subsequent JOIN operations to determine the order in which the tables
    should be joined.

    +   - **Repair table:** Repairs any corrupted data for tables in the MyISAM and
    ARCHIVE engines. Note that a table might be so corrupted that we cannot even go
    into Table view for it! In such a case, refer to the *Multi-Table Operations*
    section for the procedure to repair it.

    +   - **Optimize table:** This is useful when the table contains overheads. After
    massive deletions of rows or length changes for VARCHAR fields, lost bytes remain
    in the table. phpMyAdmin warns us in various places (for example, in the Structure
    view) if it feels the table should be optimized. This operation is a kind of defragmentation
    for the table. In MySQL 4.x, this operation works only on tables in the MyISAM,
    Berkeley (DB), and InnoDB engines. In case of MySQL 5.x, the concerned tables
    are in the MyISAM, InnoDB, and ARCHIVE engines.

    +   - **Flush table:** This must be done when there have been many connection
    errors and the MySQL server blocks further connections. Flushing will clear some
    internal caches and allow normal operations to resume.

    +   - **Defragment table:** Random insertions or deletions in an InnoDB table
    fragment its index. The table should be periodically defragmented for faster data
    retrieval.


    > The operations are based on the available underlying MySQL queries — phpMyAdmin
    only calls those queries.


    # Changing table attributes


    Table attributes are the various properties of a table. This section discusses
    the settings for some of them.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Table storage engine


    The first attribute we can change is called Storage Engine.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_187_0.png)


    This controls the whole behavior of the table — its location (on-disk or in-memory),
    the index structure, and whether it supports transactions and foreign keys. The
    drop-down list varies depending on the storage engines supported by our MySQL
    server.


    > Changing a table''s storage engine may be a long operation if the number of
    rows is large.


    # Table comments


    This allows us to enter comments for the table.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_187_1.png)


    These comments will be shown at appropriate places — for example, in the navigation
    panel, next to the table name in the Table view, and in the export file. Here
    is what the navigation panel looks like when the $cfg[''ShowTooltip''] parameter
    is set to its default value of TRUE:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_187_2.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'The default value (FALSE) of $cfg[''ShowTooltipAliasDB''] and $cfg[''ShowTooltipAliasTB'']
    produces the behavior we saw earlier — the true database and table names are displayed
    in the left panel and in the Database view for the Structure subpage. Comments
    appear when the mouse pointer is moved over a table name. If one of these parameters
    is set to TRUE, the corresponding item (database names for DB and table names
    for TB) will be shown as the tooltip instead of the names. This time, the mouseover
    shows the true name for the item. This is convenient when the real table names
    are not meaningful.


    There is another possibility for $cfg[''ShowTooltipAliasTB''] — the ''nested''
    value. Here is what happens if we use this feature:


    +   - The true table name is displayed in the left panel

    +   - The table comment (for example project__) is interpreted as the project
    name and is displayed as it is (see the Nested display of tables within a database
    section in Chapter 3)


    # Table order


    When we browse a table, or execute a statement such as SELECT * from book without
    specifying a sort order, MySQL uses the order in which the rows are physically
    stored. This table order can be changed with the Alter table order by dialog.
    We can choose any field and the table will be reordered once on this field. We
    choose author_id in the example, and after we click Go, the table gets sorted
    on this field.


    Reordering is convenient if we know that we will be retrieving rows in this order
    most of the time. Moreover, if we use an ORDER BY clause later on, and the table
    is already physically sorted on this field, the performance should be higher.


    This default ordering will last as long as there are no changes in the table (no
    insertions, deletions, or updates). This is why phpMyAdmin shows the (singly)
    warning.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_188_0.png)'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'After the sort has been done on **author_id**, books for author **1** will
    be displayed first, followed by the books for author **2**, and so on (we are
    talking about a default browsing of the table without explicit sorting). We can
    also specify the sort order as **Ascending** or **Descending.**


    If we insert another row, describing a new book from author **1**, and then click
    **Browse**, the book will not be displayed along with the other books for this
    author because the sort was done before the insertion.


    # Table collation


    To better see the issues of collation change at various levels, let''s first create
    a new author with a character **é** in his name:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_189_0.png)


    The name column currently has a **latin1_swedish_ci** collation, as can be seen
    via the **Structure** page. On the **Operations** page, if we change the collation
    for table author from **latin1_swedish_ci** to, say, **utf8_general_ci**, this
    generates:


    ```

    ALTER TABLE `author` DEFAULT CHARACTER SET utf8 COLLATE

    utf8_general_ci

    ```


    Therefore, we only changed the default collation for future columns that will
    be added to this table.


    In an effort to further test collation changes, we can go to **Structure** page
    and change the collation of author''s **name** column to **utf8_general_ci** (by
    clicking the **Change** icon). Having done that, we browse the **author** table
    and still see correctly the **é** character, because MySQL updated the contents
    of this column on collation change.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Impact of switching connection collation


    Changing the connection collation (from the homepage collation dialog) can have
    unexpected effects. Let''s switch it to latin1_bin and browse our author table
    again:


    |  |  |  | id | name | phone |

    |---|---|---|---|---|---|

    | ☐ | ✏️ | ❌ | 1 | John Smith | +01 445 789-1234 |

    | ☐ | ✏️ | ❌ | 2 | Maria Sunshine | 333-3333 |

    | ☐ | ✏️ | ❌ | 3 | Andr♦ Smith | 888-9999 |


    The data encoded in UTF-8 in the database is now (wrongly) interpreted as being
    in latin1, introducing an inconsistency in the display. Therefore, we have to
    be careful with our collation changes, and you should revert the collation changes
    made in this section and the previous one.


    # Table options


    Other attributes that influence the table''s behavior may be specified using the
    Table options dialog:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_190_0.png)


    The options are:


    +   - **PACK_KEYS**: Setting this attribute results in a smaller index. This can
    be read faster but takes more time to update. Available for the MyISAM storage
    engine.

    +   - **CHECKSUM**: This makes MySQL compute a checksum for each row. This results
    in slower updates, but finding of corrupted tables becomes easier. Available for
    MyISAM only.

    +   - **DELAY_KEY_WRITE**: This instructs MySQL not to write the index updates
    immediately, but to queue them for writing later. This improves performance. Available
    for MyISAM only.

    +   - **ROW_FORMAT**: To the storage engines that support this feature (MyISAM,
    InnoDB, PBXT, and Maria), a choice of row format is presented. The default value
    being the current state of this table''s row format.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '+   - **TRANSACTIONAL, PAGE_CHECKSUM**: Applies to the Maria storage engine.
    Currently documented at http://dev.mysql.com/doc/refman/5.1-maria/en/se-maria-tableoptions.html.

    +   - **auto-increment**: This changes the auto-increment value. It is shown only
    if the table''s primary key has the auto-increment attribute.


    # Renaming, moving, and copying tables


    The **Rename** operation is the easiest to understand — the table simply changes
    its name and stays in the same database.


    The **Move** operation (shown in the following screen) can manipulate a table
    in two ways — change its name and also the database in which it is stored.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_191_0.png)


    Moving a table is not directly supported by MySQL. So, phpMyAdmin has to create
    the table in the target database, copy the data, and then finally drop the source
    table.


    The **Copy** operation leaves the original table intact and copies its structure
    or data (or both) to another table, possibly in another database. Here, the **book-copy**
    table will be an exact copy of the book source table. After the copy, we remain
    in the Table view for the book table, unless we select **Switch to copied table**.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_191_1.png)


    The **Structure only** copy is done to create a test table with the same structure.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Appending data to a table


    The Copy dialog may also be used to append (add) data from one table to another.
    Both tables must have the same structure. This operation is achieved by entering
    the table to which we want to copy the data and choosing Data only.


    For example, we would want to append data when book data, coming from various
    sources (various publishers), is stored in more than one table, and we want to
    aggregate all the data to one place. For MyISAM, a similar result can be obtained
    by using the Merge storage engine (which is a collection of identical MyISAM tables).
    However, if the table is InnoDB, we need to rely on phpMyAdmin''s Copy feature.


    # Multi-table operations


    In the Database view, there is a checkbox next to each table name and a drop-down
    menu under the table list. This enables us to quickly choose some tables and perform
    an operation on all those tables at once. Here, we select the book-copy and the
    book tables, and choose the Check table operation for the selected tables.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_192_0.png)


    We could also quickly select or deselect all the checkboxes with Check All / Uncheck
    All.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Repairing an "in use" table


    The multi-table mode is the only method (unless we know the exact SQL query to
    type) for repairing a corrupted table. Such tables may be shown with the in use
    flag in the database list. Users seeking help in the support forums for phpMyAdmin
    often receive this tip from experienced phpMyAdmin users.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_193_0.png)


    # Database operations


    The Operations tab in the Database view gives access to a panel that enables us
    to perform operations on a database taken as a whole.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_193_1.png)'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Renaming a database


    A Rename database to dialog is available. Although this operation is not directly
    supported by MySQL, phpMyAdmin does it indirectly by creating a new database,
    renaming each table (thus sending it to the new database), and dropping the original
    database.


    # Copying a database


    It is also possible to do a complete copy of a database, even if MySQL itself
    does not support this operation natively.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_194_0.png)


    # Summary


    This chapter covers the operations we can perform on entire tables or databases.
    It also looks at table maintenance operations for table repair and optimization,
    changing various table attributes, table movements (including renaming and moving
    to another database), and multi-table operations. In the next chapter, we will
    begin to examine advanced features that rely on the linked-tables infrastructure,
    such as the relational system.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 11


    # The Relational System


    Welcome to the section of the book where we start to cover advanced features.
    The relational system allows users to work more closely with phpMyAdmin, as we
    will see in the following chapters. This chapter explains how to define inter-table
    relations. It also explains how to install the linked-tables infrastructure —
    a prerequisite for the advanced features.


    # Relational MySQL


    When application developers use PHP and MySQL to build web interfaces or other
    data manipulation applications, they usually establish relations between tables
    using the underlying SQL queries. Examples of this would be: "get an invoice and
    all its items" and "get all books by an author".


    In the first versions of phpMyAdmin, MySQL stored information about which table
    belonged to which database. However, the relational data structure (how tables
    relate to each other) was not stored into MySQL. Relations were temporarily made
    by the applications to generate meaningful results. In other words, the relations
    were in our head.


    This was considered a shortcoming of MySQL by phpMyAdmin developers and users.
    Hence, the team started to build an infrastructure to support relations for MyISAM
    tables. The infrastructure evolved to support a growing array of special features.
    We can describe this infrastructure as metadata, that is, data about data.


    phpMyAdmin 2.2.0 already had the bookmarks feature, that is, the ability to recall
    frequently used queries (described in Chapter 14), and version 2.3.0 generalized
    the metadata system. Subsequent versions were built on this facility. Examples
    of this would be: the 2.5.x family with its MIME-based transformations (as described
    in Chapter 16) and the 2.10.x family with a graphical relation builder called
    Designer (described in this chapter).'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# InnoDB and PBXT


    InnoDB is a MySQL storage engine having its own webpage at http://www.innod...com.
    It is developed by Innobase Oy, a subsidiary of Oracle. As the InnoDB sub-system
    must be activated by a system administrator, it may not be available on every
    MySQL server.


    The PrimeBase XT storage engine or PBXT (http://www.primebase.org) is available
    for MySQL 5.1 and 6.0, and is developed by PrimeBase Technologies. The minimum
    MySQL required version is 5.1, as this version supports the pluggable storage
    engine API that is used by PBXT and other third-parties to offer alternative storage
    engines. This transactional storage engine is newer than InnoDB. It is usually
    installed after downloading it from their website and then going through a compile
    step. For some operating systems, a precompiled binary is available – please visit
    the aforementioned website for download and installation instructions.


    When considering the relational aspect, here are the benefits of using the InnoDB
    or PBXT storage engine for a table:


    +   - They support referential integrity based on foreign keys, which are the
    keys in a foreign (or reference) table. By contrast, using only phpMyAdmin''s
    internal relations (discussed later) brings no automatic referential integrity
    verification.

    +   - The exported structure for InnoDB and PBXT tables contains the defined relations.
    Therefore, they are easily imported back for better cross-server interoperability.


    The foreign key feature of these storage engines can effectively replace the part
    of phpMyAdmin''s infrastructure that deals with relations. We will see how phpMyAdmin
    interfaces with the InnoDB and PBXT foreign key system.


    > > The other parts of phpMyAdmin''s infrastructure (for example, bookmarks) have
    no equivalent in InnoDB, PBXT, or MySQL. Hence, they are still required to access
    the complete phpMyAdmin feature set. However, in MySQL 5.x, views are supported,
    and have similarities with phpMyAdmin''s bookmarks.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_196_0.png)


    # Linked-tables infrastructure


    The relational system''s infrastructure is stored in tables that follow a predetermined
    structure. The data in these tables is generated and maintained by phpMyAdmin
    on the basis of our actions from the interface.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Goal of the infrastructure


    Metadata tables contain, for all storage engines, information to support the special
    phpMyAdmin''s features such as bookmarks and transformations. Moreover, for tables
    in a storage engine that does not support foreign keys, relations between tables
    are kept in this infrastructure.


    # Location of the infrastructure


    There are two possible places to store these tables:


    +   - A user''s database—to facilitate every web developer owning a database to
    benefit from these features.

    +   - A dedicated database called pmaDB (phpMyAdmin database). In a multi-user
    installation (discussed later), this database may be accessible to a number of
    users while keeping the metadata private.


    As this infrastructure does not exist by default, and because phpMyAdmin''s developers
    want to promote it, the interface displays the following error message for every
    database when on the Operations subpage in the Database view:


    ```

    The additional features for working with linked tables have been deactivated.
    To find out why click here.

    ```


    This message can be disabled with the following parameter (which, by default,
    is set to FALSE):


    ```

    $cfg[''PmaNoRelation_DisableWarning''] = TRUE;

    ```


    > The message is the same regardless of the current database, as the infrastructure
    is shared for all our databases and tables (or all users on a multi-user installation).


    # Installing linked-tables infrastructure


    The previous error message is displayed even if only a part of the infrastructure
    is lacking. Of course, on a fresh installation, all parts are lacking—our database
    has not yet heard of phpMyAdmin and needs to be outfitted with this infrastructure.
    Following the here link in the previous message brings up a panel explaining that
    the pmaDB, and the tables that are supposed to be a part of it, are either missing
    or undefined.'
  merge: -1
  img_proc: true
- pgno: 198
  md: "It's important to realize that the relational system will work only if two\
    \ conditions are met:\n\n+   - Proper definitions are present in config.inc.php\n\
    +   - The corresponding tables (and maybe the database) are created\n\nTo create\
    \ the necessary structure that matches our current version of phpMyAdmin, a command\
    \ file called create_tables.sql is available in the scripts subdirectory of the\
    \ phpMyAdmin installation directory. However, we should not blindly execute it\
    \ before understanding the possible choices – multi-user installation or single-user\
    \ installation.\n\n# Multi-user installation\n\nIn this setup, we will have a\
    \ distinct database – pmadb – to store the metadata tables. Our control user will\
    \ have specific rights to this database. Each user will work with his/her login\
    \ name and password, which will be used to access his/her databases. However,\
    \ whenever phpMyAdmin itself accesses pmadb to obtain some metadata, it will use\
    \ the control user's privileges.\n\n> Setting a multi-user installation is possible\
    \ only for a MySQL system administrator who has the privileges of assigning rights\
    \ to another user (here, the pma user). If you are not in this situation, please\
    \ refer to the Single-user installation section.\n\nWe first ensure that the control\
    \ user pma has been created, as explained in Chapter 2, and that its definition\
    \ in config.inc.php is appropriate.\n\n```\n$cfg['Servers'][$i]['controluser']\
    \ = 'pma';\n$cfg['Servers'][$i]['controlpass'] = 'bingo';\n```\n\nWe then look\
    \ in the scripts directory for create_tables.sql. There might be the other scripts\
    \ available for different MySQL versions, so we should pick the one which looks\
    \ the most appropriate. Next, we copy this script to our local workstation and\
    \ edit it. We replace the following lines:\n\n```\n-- GRANT SELECT, INSERT, DELETE,\
    \ UPDATE ON `phpmyadmin`.* TO\n--   `pma`@localhost;\n```\n\nwith these:\n\n```\n\
    GRANT SELECT, INSERT, DELETE, UPDATE ON `phpmyadmin`.* TO\n  `pma`@localhost;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 199
  md: 'We then execute this script by importing it (see Chapter 8). The net effect
    is to create the phpmyadmin database, assign proper rights to user pma, and populate
    the database with all the necessary tables.


    # Infrastructure and config.inc.php


    It is now time to adjust all the relational-features related parameters in config.inc.php.
    This can be done easily with the setup script as seen in Chapter 1, or by pasting
    the appropriate lines from the config.sample.inc.php file. These database and
    table names are the ones that have just been created:


    ```

    $cfg[''Servers''][$i][''pmadb''] = ''phpmyadmin'';

    $cfg[''Servers''][$i][''bookmarktable''] = ''pma_bookmark'';

    $cfg[''Servers''][$i][''relation''] = ''pma_relation'';

    $cfg[''Servers''][$i][''table_info''] = ''pma_table_info'';

    $cfg[''Servers''][$i][''table_coords''] = ''pma_table_coords'';

    $cfg[''Servers''][$i][''pdf_pages''] = ''pma_pdf_pages'';

    $cfg[''Servers''][$i][''column_info''] = ''pma_column_info'';

    $cfg[''Servers''][$i][''history''] = ''pma_history'';

    $cfg[''Servers''][$i][''designer_coords''] = ''pma_designer_coords'';

    ```


    > As table names are case sensitive, we must use the same names as the tables
    created by the installation script. We are free to change the table names (see
    the right-hand part of the configuration directives listed), provided we change
    them accordingly in the database.


    The pmadb and each table have a specific function as listed next:


    +   - pmadb: Defines the database where all tables are located

    +   - bookmarktable: Contains the bookmarks (explained in Chapter 14)

    +   - relation: Defines inter-table relations, as used in many of the phpMyAdmin''s
    features

    +   - table_info: Contains the display field (explained later in this chapter)

    +   - table_coords and pdf_pages: Contain the metadata necessary for drawing a
    schema of the relations in a PDF format (explained in Chapter 15)

    +   - column_info: Used for column-commenting and MIME-based transformations (explained
    in Chapter 16)

    +   - history: Contains SQL query history information (explained in Chapter 12)

    +   - designer_coords: Holds the coordinates used by the Designer feature (explained
    later in this chapter)'
  merge: -1
  img_proc: true
- pgno: 200
  md: "Between each phpMyAdmin version, the infrastructure may be enhanced. (The changes\
    \ are explained in Documentation.html.) This is why phpMyAdmin has various checks\
    \ to ascertain the structure of the tables. If we know we are using the latest\
    \ structure, $cfg['Servers'][$i]['verbose_check'] can be set to FALSE to avoid\
    \ checks, thereby slightly increasing phpMyAdmin's speed.\n\nThe installation\
    \ is now complete. We will test the features in the coming sections and chapters.\
    \ We can do a quick check by going back to the homepage; the warning message should\
    \ be gone.\n\n# Single-user installation\n\nEven if we are entitled to only one\
    \ database by the system administrator, we can still use all the relational features\
    \ of phpMyAdmin.\n\nIn this setup, we will use our normal database (let's assume\
    \ its name is marc_book) to store the metadata tables, and will define our own\
    \ login name (marc) as the control user in config.inc.php.\n\n```\n$cfg['Servers'][$i]['controluser']\
    \ = 'marc';\n$cfg['Servers'][$i]['controlpass'] = 'bingo';\n```\n\nThe next step\
    \ is to modify a local copy of the scripts/create_tables.sql file to populate\
    \ our database with all the needed tables. They will have the prefix pma_ to make\
    \ them easily recognizable. (See also the remark in the Multi-user installation\
    \ section about other scripts that may be available in the scripts directory.)\n\
    \nIf we are using scripts/create_tables.sql, the modification we need is to remove\
    \ the following lines:\n\n```\nCREATE DATABASE IF NOT EXISTS `phpmyadmin`\n  DEFAULT\
    \ CHARACTER SET utf8 COLLATE utf8_bin;\nUSE phpmyadmin;\n```\n\nThis is done because\
    \ we won't be using a phpmyadmin database. Next, we should open our marc_book\
    \ database in phpMyAdmin. We are now ready to execute the script. There are two\
    \ ways of doing this:\n\n+   - As we already have the script in our editor, we\
    \ can just copy the lines and paste them in the query box of the SQL subpage.\n\
    +   - Another way is to use the import technique shown in Chapter 8. We select\
    \ the create_tables.sql script that we just modified."
  merge: -1
  img_proc: true
- pgno: 201
  md: 'After the creation, the left panel shows us the special pma_ tables along with
    our normal tables.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_201_0.png)


    The last step is to adjust all the parameters in config.inc.php that relate to
    relational features. Please refer to the previous section, except for the database
    name in the pmadb parameter:


    ```

    $cfg[''Servers''][$i][''pmadb''] = ''marc_book'';

    ```


    # Defining relations with the relation view


    After the installing of the linked-tables infrastructure, there are now more options
    available in the Database view and the Table view. We will now examine a new link
    – Relation view – in the Structure subpage of the Table view.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_201_1.png)


    This view is used to:


    +   - Define the relations of the current table with the other tables

    +   - Choose the display field'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'Our goal here is to create a relation between the **book** table (which contains
    the **author** ID) and the **author** table (which describes each author by an
    ID). We start on the Table view for the **book** table, go to **Structure**, and
    click the **Relation view** link.


    # Internal relations


    As the **book** table is in MyISAM format, we see the following screen (otherwise,
    the display would be different, as explained in the *Foreign Key Relations* section
    later):


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_202_0.png)


    This screen allows us to create **Internal relations** (stored in the pma_**relation**
    table) because MySQL itself does not have any relational notion for MyISAM tables.
    The empty drop-down list next to each column indicates that there are no relations
    (links) to any foreign table.


    # Defining the relation


    We can relate each field of the **book** table to a field in another table (or
    in the same table, because self-referencing relations are sometimes necessary).
    The interface finds both the unique and the non-unique keys in all the tables
    of the same database, and presents the keys in drop-down lists. (Creating internal
    relations to other databases from the interface is not currently supported.) The
    appropriate choice for the **author_id** field is to select the corresponding
    **author_id** field from the **author** table – also called **defining the foreign
    key**.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_203_0.png)


    We then click Save, and the definition is saved in phpMyAdmin''s infrastructure.
    To remove the relation, we just come back to the screen, select the empty choice,
    and click Save.


    # Defining the display field


    The primary key of our author table is the author_id, which is a unique number
    that we made up for key purposes. The name field in our table—the name— represents
    the author''s name. It would be interesting to see the author''s name as a description
    of each row of the book table. This is the purpose of the display field. We should
    normally define a display field for each table that participates in a relation
    as a foreign table.


    We will see how this information is displayed in the Benefits of the Defined Relations
    section. We now go to the Relation view for the author table (which is the foreign
    table in this case) and specify the display field. We choose name as the display
    field and click Save.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_203_1.png)


    phpMyAdmin offers to define only one display field for a table, and this field
    is used in all the relations where this table is used as a foreign table.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'The definition of this relation is now done. Although we did not relate any
    of the fields in the author table to another table, it can be done. For example,
    we could have a country code in this table and could create a relation to the
    country code of a country table.


    We will discuss the benefits of having defined this relation in a later section.
    For now, we will see what happens if our tables are under the control of the InnoDB
    or PBXT storage engine.


    # Foreign key relations


    The InnoDB and PBXT storage engines offer us a foreign key system.


    > At your choice, the exercises in this section can be accomplished with either
    InnoDB or PBXT. InnoDB has been chosen in the text.


    First, we will switch our book and author tables to the InnoDB storage engine.
    We can do this from the Operations subpage in the Table view. We start by doing
    this for the author table, as shown in the following screenshot:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_204_0.png)


    A problem arises when the storage engine of the book table is changed to InnoDB.
    We have a full-text index in this table, and the InnoDB engine currently does
    not support this kind of index:


    ```

    ALTER TABLE `book` ENGINE = InnoDB;

    MySQL said:

    #1214 - The used table type doesn''t support FULLTEXT indexes

    ```'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'To get rid of this error message, we go back to the **Structure** for the book
    table and remove the full-text index on the **description** field. While we are
    on this screen, let''s also remove the combined index we created on **author_id**
    and **language**. We will do this because we want to see the consequences of a
    missing index later in this chapter. At this point, we are able to switch the
    book table to InnoDB.


    The foreign key system in InnoDB maintains integrity between the related tables.
    Hence, we cannot add a non-existent author ID to the book table. In addition,
    actions are programmable when DELETE or UPDATE operations are performed on the
    master table (in our case, book).


    Opening the book table on its **Structure** subpage and entering the **Relation
    view**, now displays a different page:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_205_0.png)


    This page tells us:


    +   - We have an internal relation defined for **author_id** to the author table.

    +   - We don''t yet have any InnoDB relations defined.

    +   - We will be able to remove the internal relation, when the same relation
    has been defined in InnoDB. Indeed, phpMyAdmin advises us that: "**An internal
    relation is not necessary when a corresponding FOREIGN KEY relation exists**".
    So, it would be better to remove it.

    +   - **ON DELETE** and **ON UPDATE** options are available for InnoDB relations.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'In the possible choices for the related key, we see the keys defined in all
    the InnoDB tables of the same database. (Creating a cross-database relation is
    currently not supported in phpMyAdmin.) We even see the keys defined in the current
    table, as self-referring relations are possible. We now remove the internal relation
    for the **author_id** field and click **Save**. We would like to add an InnoDB-type
    relation for the **author_id** field, but we cannot. We see the **No index defined!**
    message on this line. This is because foreign key definitions in InnoDB or PBXT
    can be done only if both the fields are defined as indexes.


    > Other conditions regarding constraints are explained in the MySQL manual. Please
    refer to http://dev.mysql.com/doc/refman/5.0/en/innodb-foreign-key-constraints.html.


    Thus, we come back to the **Structure** page for the book table and add an ordinary
    (non-unique) index to the **author_id** field producing:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_206_0.png)


    In the **Relation view**, we can try again to add the relation we wanted; it works
    this time!


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_206_1.png)


    We can also set some actions with the **ON DELETE** and **ON UPDATE** options.
    For example, **ON DELETE CASCADE** would make MySQL automatically delete all the
    rows in the related (foreign) table when the corresponding row is deleted from
    the parent table. This would be useful, for example, when the parent table is
    **invoices**, and the foreign table is **invoice-items**.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '> If we have not done so already, we should define the display field for the
    author table, as explained in the Internal phpMyAdmin Relations section.


    # Foreign keys without linked-tables infrastructure


    We see the Relation View link on the Structure page of a InnoDB or PBXT table,
    even though the linked-tables infrastructure is not installed. This brings us
    to a screen where we can define the foreign keys, in this case for the book table.


    Note that, if we choose this, the display field for the linked table (author here)
    cannot be defined, as it belongs to phpMyAdmin''s infrastructure. Thus, we would
    lose the benefit of seeing the associated description of the foreign key.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_207_0.png)


    # Defining relations with the Designer


    The Ajax-based Designer feature appeared in phpMyAdmin 2.10. It offers a mouse-driven
    way of managing relations (both internal and foreign key-based), and defining
    the display field for each table. It can also act as:


    +   - A menu to access the structure of existing tables and to access the table
    creation page.

    +   - A PDF schema manager, if we want a PDF schema encompassing all our tables.


    On the Designer workspace, we can work on the relations for all tables on the
    same panel. On the other hand, the Relation view shows the relations for only
    a single table at a time.


    We access this feature from the Database view by clicking the Designer menu tab.


    > If this menu tab does not appear, it''s because we are yet to install the linked-tables
    infrastructure as described previously in this chapter — especially the designer_coords
    special table.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Interface overview


    The Designer page contains the main workspace where the tables can be seen. This
    workspace will dynamically grow and shrink, depending on the position of our tables.
    A top menu contains icons whose description is revealed by hovering the mouse
    over them. Here is a summary of the goals for the top menu''s icons:


    +   - **Show/Hide left menu**: For left menu presence

    +   - **Save position**: Saves the current state of the workspace to the infrastructure

    +   - **Create table**: Quits the designer and enters a dialog to create a table

    +   - **Create relation**: Puts the designer in a relation creating mode

    +   - **Choose field to display**: Specifies which field represents a table

    +   - **Reload**: Fetches information about the tables again

    +   - **Help**: Brings an explanation about selecting the relations

    +   - **Angular links/Direct links**: Specifies the shape of relation links

    +   - **Snap to grid**: Influences the behavior of table movements, relative to
    an imaginary grid

    +   - **Small/Big All**: Hides or displays the list of columns for every table

    +   - **Toggle small/big**: Reverses the display mode of columns for every table,
    as this mode can be chosen by the table with its corner icon V or >

    +   - **Import/Export**: Generates PDF

    +   - **Move Menu**: The top menu can move to right and back again


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_208_0.png)'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'A side menu appears when clicking the **Show/Hide left menu** icon. Its purpose
    is to present the complete list of tables, to decide which table appears on the
    workspace, and to enable access to the **Structure** page of a specific table.
    In this example, we choose to remove the **book-copy** table from the workspace
    as shown here:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_209_0.png)


    If we want this removal to be permanent, we click on the **Save position** top
    icon. This icon also saves the current position of our tables on the workspace.


    Tables can be moved on the workspace by dragging their title bars, and the list
    of columns for a table can be made visible/invisible with the help of upper-left
    icon of each table. In this list of columns, small icons show us the data type
    (numeric, text, date), and also tell us whether this column is a key.


    # Defining relations


    As we have already defined a relation with the Relation view, we''ll first see
    how to remove it. The Designer does not permit a change in a relation. However,
    the Designer allows the relation to be removed and defined.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'The question mark top icon displays a panel that explains where to click, in
    order to select a relation for subsequent deletion.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_210_0.png)


    Let''s click at the appropriate place to delete this relation. We get a confirmation
    panel on which we click Delete.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_210_1.png)


    We can then proceed to recreate it. To do this, we start by clicking the Create
    relation icon. The cursor then takes the form of a short message saying Select
    referenced key. In our case, the referenced key is the id column of the author
    table; so we bring the cursor on this column and click it. A validation is done,
    ensuring that we chose a primary or unique key.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Next, having changed the cursor to **Select foreign key**, we bring it to the
    **author_id** column of the book table and click again. This confirms the creation
    of the relation. Currently, the interface does not permit the creation of compound
    keys (having more than one column).


    # Foreign key relations


    The procedure to delete or define a relation between InnoDB or PBXT tables, is
    the same as that for internal relations. The only exception is that, at the time
    of creation, a different confirmation panel appears, enabling us to specify the
    ON DELETE and ON UPDATE actions.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_211_0.png)


    # Defining the display field


    On the workspace, we notice in the **author** table that the name column has a
    special background color. This indicates that this column serves as the display
    field. We can simply click the **Choose field to display** top icon, and drag
    the short message **Choose field to display** onto another column – for example,
    the phone column. This changes the display field to this column. If we were to
    drag the message to an existing display field column, we would have removed this
    column as a display field for the table.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Exporting for PDF schema


    In Chapter 15, we''ll see how to produce a PDF schema for a subset of our database.
    We can import the co-ordinates of tables from such a schema into the Designer''s
    workspace, and conversely export them to the PDF schema. The Import/export coordinates
    top icon is available for that purpose.


    # Benefits of the defined relations


    In this section, we will look at the benefits of the defined relations that we
    can currently test. Other benefits will be described in chapters 13 and 15. Additional
    benefits of the linked-tables infrastructure will appear in chapters 14 and 16.


    These benefits are available for both internal and foreign key relations.


    # Foreign key information


    Let''s browse the book table by entering the Search subpage and choosing to display
    the first four columns. We see that the related key (author_id) is now a link.
    Moving the mouse pointer over any author_id value reveals the author''s name (as
    defined by the display field of the author table).


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_212_0.png)


    Clicking on the author_id brings us to the relevant table—author—for this specific
    author:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_212_1.png)'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# The drop-down list of foreign keys


    Going back to the book table, in Insert mode (or in Edit mode), we now see a drop-down
    list of the possible keys for each field that has a defined relation. The list
    contains the keys and the description (display field) in both orders — key to
    the display field as well as display field to the key. This enables us to use
    the keyboard, and type the first letter of either the key or the display field.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_213_0.png)


    Only the key (in this case 1) will be stored in the book table. The display field
    is there only to assist us.


    By default, this drop-down list will appear if there are a maximum of 100 rows
    in the foreign table. This is controlled by the following parameter:


    ```

    $cfg[''ForeignKeyMaxLimit''] = 100;

    ```


    For foreign tables bigger than that, a distinct window appears — the foreign-table
    window (see the next section) that can be browsed.


    We might prefer to see information differently in the drop-down list. Here, John
    Smith is the content and 1 is the ID. The default display is controlled by


    ```

    $cfg[''ForeignKeyDropdownOrder''] = array( ''content-id'', ''id-content'');

    ```


    We can use one or both of the strings — content-id and id-content — in the defining
    array and in the order we prefer. Thus, defining $cfg[''ForeignKeyDropdownOrder'']
    to array(''id-content'') would produce a list with only those choices:


    +   1 – John Smith

    +   2 – Maria Sunshine

    +   3 – André Smith'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# The browseable foreign-table window


    Our current author tables have very few entries. Thus, to illustrate this mechanism,
    we will set the $cfg[''ForeignKeyMaxLimit''] to an artificially low number, 1.
    Now in the Insert mode for the book table, we see a small table-shaped icon for
    author_id. This icon opens another window, which will present the values of the
    table author and a Search input field. On the left, the values are sorted by key
    value (here, the author_id column), and on the right, they are sorted by description.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_214_0.png)


    Choosing one of the values (by clicking either a key value or a description) closes
    this window and brings the value back to the author_id column.


    # Referential integrity checks


    We discussed the Operations subpage and its Table maintenance section, in Chapter
    10. For this exercise, we suppose that both the book and author tables are not
    under the control of the InnoDB or PBXT storage engine. If we have defined an
    internal relation for the author table, a new choice appears for the book table
    – Check referential integrity.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_214_1.png)


    A link (author_id -> author.id) appears for each defined relation, and clicking
    it starts verification. For each row, the presence of the corresponding key in
    the foreign table is verified and errors, if any, are reported. If the resulting
    page reports zero rows, it is good news!'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'This operation exists because for tables under the storage engines that do
    not support foreign key natively, neither MySQL nor phpMyAdmin enforce referential
    integrity. It is perfectly possible, for example, to import data in the book table
    with invalid values for **author_id**.


    # Automatic updates of metadata


    phpMyAdmin keeps the metadata for internal relations synchronized with every change
    that is made to the tables via phpMyAdmin. For example, renaming a column that
    is part of a relation would make phpMyAdmin rename this column in the metadata
    for the relation. This guarantees an internal relation continues to function,
    even after a column''s name is changed. The same thing happens when a column or
    table is dropped.


    > Metadata should be maintained manually in case a change in the structure is
    done from outside phpMyAdmin.


    # Column-commenting


    Prior to MySQL 4.1, the MySQL structure itself did not support the addition of
    comments to a column. Nevertheless, thanks to phpMyAdmin''s metadata — we could
    comment on columns. However, since MySQL 4.1, native column commenting has been
    supported. The good news is that for any MySQL version, column commenting in phpMyAdmin
    is always accessed via the **Structure** page by editing the structure of each
    field. In the following example, we need to comment three columns. Hence, we choose
    them and click the pencil icon near the **With selected** choice.


    |   | Field | Type |

    |---|---|---|

    | ☑ | isbn | varchar(25) |

    | ☐ | title | varchar(100) |

    | ☑ | page_count | int(11) |

    | ☑ | author_id | int(11) |'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'To obtain the next panel, as seen here, we are working in vertical mode by
    setting $cfg[''DefaultPropDisplay''] to ''vertical''. We enter the following comments:


    +   - isbn: book number

    +   - page_count: approximate

    +   - author_id: cf author table


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_216_0.png)


    We then click Save.


    These comments appear at various places—for example, in the export file (see Chapter
    7) on the PDF relational schema (see Chapter 15), and in the browse mode.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_216_1.png)


    If we do not want the comments to appear in browse mode, we can set $cfg[''ShowBrowseComments'']
    to FALSE. (It is TRUE by default.)


    Column comments also appear as a tool tip in the Structure page, and column names
    are underlined with dashes. To deactivate this behavior, we can set $cfg[''ShowPropertyComments'']
    to FALSE. (This one is also TRUE by default.)


    # Automatic migration


    Whenever phpMyAdmin detects that column comments have been stored in its metadata,
    and that we are using MySQL 4.1.2 or a later version, it automatically migrates
    these column comments to the native MySQL column comments.'
  merge: -1
  img_proc: true
- pgno: 217
