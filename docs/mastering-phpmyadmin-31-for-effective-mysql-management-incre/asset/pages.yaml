- pgno: 148
  md: '+   - **Export type:** The choices are **INSERT**, **UPDATE**, and **REPLACE**.
    The most well-known of these types is the default **INSERT** – using **INSERT**
    statements to import back our data. At import time, however, we could be in a
    situation where a table already exists and contains valuable data, and we just
    want to update the fields that are in the current table we are exporting. **UPDATE**
    generates statements like UPDATE `author` SET `id` = 1, `name` = `John Smith`,
    `phone` = `111-1111` WHERE `id` = `1`; updating a row when the same primary or
    unique key is found. The third possibility, **REPLACE**, produces statements like
    REPLACE INTO `author` VALUES (1, `John Smith`, `111-1111`); These act like an
    INSERT statement for new rows and update existing rows, based on primary or unique
    keys.


    # The "Save as file" subpanel


    In the previous examples, the results of the export operation were displayed on
    screen, and of course, no compression was made on the data. We can choose to transmit
    the export file via HTTP by checking the Save as file checkbox. This triggers
    a Save dialog into the browser, which ultimately saves the file on our local station.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_148_0.png)


    # File name template


    The name of the proposed file will obey the File name template. In this template,
    we can use the special __SERVER__, __DB__, and __TABLE__ placeholders. These placeholders
    will be replaced by the current server, database, or table name (for a single-table
    export). Note that there are two underscore characters before and after the words.
    We can also use any special character from the PHP strftime function; this is
    useful for generating an export file based on the current date or hour. Finally,
    we can put any other string of characters (not part of the strftime special characters),
    which will be used literally. The file extension is generated according to the
    type of export. In this case, it will be .sql. Here are some examples for the
    template:'
  merge: -1
  img_proc: true
- pgno: 149
  md: '+   - __DB__ would generate **marc_book.sql**

    +   - __DB__-%Y%m%d would give **marc_book-20071206.sql**


    The **remember template** option, when activated, stores the entered template
    settings into cookies (for database, table, or server exports) and brings them
    back the next time we use the same kind of export.


    The default templates are configurable, via the following parameters:


    ```

    $cfg[''Export''][''file_template_table''] = ''__TABLE__'';

    $cfg[''Export''][''file_template_database''] = ''__DB__'';

    $cfg[''Export''][''file_template_server''] = ''__SERVER__'';

    ```


    # Compression


    To save transmission time and get a smaller export file, phpMyAdmin can compress
    to ZIP, GZIP, or BZIP2 formats. phpMyAdmin has native support for the ZIP format.
    However, the GZIP and BZIP2 formats work only if the PHP server has been compiled
    with the --with-zlib or --with-bz2 configuration option respectively. The following
    parameters control which compression choices are presented in the panel:


    ```

    $cfg[''ZipDump''] = TRUE;

    $cfg[''GZipDump''] = TRUE;

    $cfg[''BZipDump''] = TRUE;

    ```


    A system administrator installing phpMyAdmin for a number of users could choose
    to set all these parameters to FALSE, so as to avoid the potential overhead incurred
    by a lot of users compressing their exports at the same time. This situation usually
    causes more overhead than if all the users were transmitting their uncompressed
    files at the same time.


    In older phpMyAdmin versions, the compression file was built in the web server
    memory. Some problems caused by this were:


    +   - File generation depended on the memory limits assigned to running PHP scripts.

    +   - During the time the file was generated and compressed, no transmission occurred.
    Hence, users were inclined to think that the operation was not working and that
    something had crashed.

    +   - Compression of large databases was impossible to achieve.


    The $cfg[''CompressOnFly''] parameter (set to TRUE by default) was added to generate
    (for gzip and bzip2 formats) a compressed file containing more headers. Now, the
    transmission starts almost immediately. The file is sent in smaller chunks so
    that the whole process consumes much lesser memory.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Choice of character set


    This section explains a little-known feature—the possibility of choosing the exact
    character set for our exported file.


    This feature is activated by setting $cfg[''AllowAnywhereRecoding''] to TRUE.
    We can see here the effect on the interface.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_150_0.png)


    When this parameter is switched on, phpMyAdmin verifies that the conditions for
    recoding are met. For the actual encoding of data, the PHP component of the web
    server must support the iconv or the recode module. If this is not the case and
    the parameter has been set to TRUE, the following error message will be generated:


    **Couldn''t load the iconv or recode extension needed for charset conversion.
    Either configure PHP to enable these extensions or disable charset conversion
    in phpMyAdmin.**


    If this message is displayed, consult your system''s documentation (PHP or the
    operating system) for the installation procedures.


    Another parameter ($cfg[''RecodingEngine'']) specifies the actual recoding engine—the
    choices being auto, iconv, and recode. If it is set to auto, phpMyAdmin will first
    try the iconv module and then the recode module.


    # Kanji support


    If phpMyAdmin detects the use of the Japanese language, it checks whether PHP
    supports the mb_convert_encoding() multibyte strings function. If it does, additional
    radio buttons—export, import, and query box— are displayed on the following pages,
    so that we can choose between the EUC-JP and SJIS Japanese encodings.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Here is an example taken from the Export page:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_151_0.png)


    # CSV


    This format is understood by a lot of programs, and you may find it useful for
    exchanging data. Note that it is a data-only format — no SQL structure here.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_151_1.png)


    The available options are:


    +   - **Fields terminated by:** We put a comma here, which means that a comma
    will be placed after each field.

    +   - **Fields enclosed by:** We place an enclosing character here (like the quote)
    to ensure that a field containing the terminating character (comma) is not taken
    for two fields.

    +   - **Fields escaped by:** If the export generator finds the **Fields enclosed
    by** character inside a field, the **Fields escaped by** character will be placed
    before it in order to protect it. For example, "John \"The Great\" Smith".'
  merge: -1
  img_proc: true
- pgno: 152
  md: '+   - **Lines terminated by**: This decides the character that ends each line.
    We should use the proper line delimiter here depending on the operating system
    on which we will manipulate the resulting export file. The default value of this
    option comes from the $cfg[''Export''][''csv_terminated''] parameter, which contains
    `AUTO` by default. The `AUTO` value produces a value of \r\n if the browser''s
    OS is Windows and \n otherwise. However, this might not be the best choice if
    the export file is intended for a machine with a different OS.

    +   - **Replace NULL by**: This determines which string occupies the place in
    the export file of any NULL value found in a field.

    +   - **Put fields names in the first row**: This gets some information about
    the meaning of each field. Some programs will use this information to name the
    column.


    Finally, we select the **author** table.


    The result is:


    ```

    "id","name","phone"

    "1","John Smith","+01 445 789-1234"

    "2","Maria Sunshine","+01 455 444-5683"

    ```


    # CSV for MS Excel


    This export mode produces a CSV file intended for Microsoft Excel. We can select
    the exact Microsoft Excel edition.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_152_0.png)'
  merge: -1
