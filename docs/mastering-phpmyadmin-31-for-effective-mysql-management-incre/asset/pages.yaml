- pgno: 263
  md: '# 16

    MIME-Based

    Transformations


    In this chapter, we will cover a powerful phpMyAdmin feature — its ability to
    transform a column''s contents during a table **Browse**, based on certain specific
    rules called transformations. Normally, browsing a table shows only the original
    data that resides in it. However, MIME-based transformations permit alteration
    of the display format.


    # Display behavior in browse mode


    Normally, the exact contents of each row are displayed, except that:


    +   - The **TEXT** and **CHARACTER** fields might be truncated, according to $cfg[''LimitChars''],
    depending on whether we have chosen to see **Full Texts** or not

    +   - **BLOB** fields might be replaced by a message such as [**BLOB - 1.5 KB**]


    We will use the term **cell** to indicate a specific column of a specific row.
    The cell containing the cover photograph for the "Future souvenirs" book (a **BLOB**
    column) is currently displayed as cryptic data such as %oPNG\r\nZ\n\0\0\0\rIHDR\0
    or as a message stating the **BLOB** field''s size. It would be interesting to
    see a thumbnail (shown in the second screenshot under the *Clickable thumbnail*
    section) of the picture directly in phpMyAdmin and possibly the full-size picture
    itself. This will be made possible with proper transformation.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Display options


    In Browse mode, the Options link reveals a slider that contains, among other choices,
    a Hide Browser transformation checkbox. We can use it whenever we want to switch
    between seeing the real data of a cell and its transformed version.


    # Enabling transformations


    We define transformation as a mechanism by which all the cells related to a column
    are transformed at browse time, using the metadata defined for this column. Only
    the cells visible on the results page are transformed. The transformation logic
    itself is coded in PHP scripts, stored in libraries/transformations, and is called
    using a plug-in architecture.


    To enable this feature, we must set $cfg[''BrowseMIME''] to TRUE in config.inc.php.
    The linked-tables infrastructure must be in place (see Chapter 11) because the
    metadata necessary for the transformations is not available in the official MySQL
    table structure. It is an addition made especially for phpMyAdmin.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_264_0.png)


    > In the documentation section on phpMyAdmin''s homesite, there is a link pointing
    to additional information for developers who would like to learn the internal
    structure of the plug-ins in order to code their own transformations.


    # The MIME column''s settings


    If we go to the Table view of the Structure page for the book table and click
    the Change link for the cover_photo, we see three additional attributes for the
    fields (provided the transformations feature is enabled):


    +   - MIME type

    +   - Browser transformation

    +   - Transformation options'
  merge: -1
  img_proc: true
- pgno: 265
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_265_0.png)


    For a specific field, it is possible to indicate only one type of transformation.
    Here, the field is a BLOB field. Hence, it can hold any kind of data. In order
    for phpMyAdmin to interpret and act correctly on the data, the transformation
    system must be informed of the data format and the intended results. Accordingly,
    we have to ensure that we upload data that always follows the same file format.


    We will first learn the purpose of those attributes and then try some possibilities
    in the Examples of transformation section.


    # MIME types


    The MIME specification (http://en.wikipedia.org/wiki/MIME) has been chosen as
    a metadata attribute to categorize the kind of data a column holds. Multipurpose
    Internet Mail Extensions (MIME), originally designed to extend mail, are now used
    to describe content types for other protocols as well. In the context of phpMyAdmin,
    the current possible values are:


    +   - image/jpeg

    +   - image/png

    +   - text/plain

    +   - application/octetstream


    The text/plain type can be chosen for a column containing any kind of text (for
    example, XHTML or XML text). In the Examples of Transformations section, you''ll
    see which MIME type you are required to choose to achieve a specific effect.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Browser transformations


    This is where we set the exact transformation to be done. More than one transformation
    may be supported per MIME type. For example, for the **image/jpeg** MIME type,
    we have two transformations available — **image/jpeg: inline** for a clickable
    thumbnail of the image and **image/jpeg: link** to display just a link.


    As we can see in the following image, moving the mouse over each choice in the
    drop-down menu provides a short explanation of the corresponding transformation.
    A more complete transformation explanation and the possible options are available
    on clicking the **transformation descriptions** link.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_266_0.png)


    # Transformation options


    In the *Examples of transformations* section, we will see that some transformations
    accept options. For example, a transformation that generates an image will need
    the width and height in pixels. A comma is used to separate the values in the
    options list, and some options may need to be enclosed within quotes.


    Some options have a default value, and we must be careful to respect the documented
    order for options. For example, if there are two options, and we only want to
    specify a value for the second option, we can use empty quotes as a placeholder
    for the first option to let the system use its default value.


    # Requirements for image generation


    Normal thumbnail generation requires that some components exist on the web server,
    and that a parameter in config.inc.php be correctly configured.'
  merge: -1
  img_proc: true
- pgno: 267
  md: "# The GD2 library\n\nphpMyAdmin uses some internal functions to create the\
    \ thumbnails. These functions need the GD2 library to be present on our PHP server.\n\
    \nphpMyAdmin can detect the presence of the correct GD2 library, but this detection\
    \ takes some time. It also takes place not once per session, but almost every\
    \ time an action is taken in phpMyAdmin.\n\nSetting the $cfg['GD2Available'] parameter\
    \ in config.inc.php to its default value 'auto' indicates that the detection of\
    \ the library's presence and version is needed.\n\nIf we know that the GD2 library\
    \ is available, setting $cfg['GD2Available'] to yes will make execution quicker.\
    \ If the GD2 library is not available, you are recommended to set this parameter\
    \ to no.\n\nTo find out which GD2 library we have on the server, we can go to\
    \ phpMyAdmin's homepage and click Show PHP information. If this link is not present,\
    \ we have to set the $cfg['ShowPhpInfo'] parameter to true. We then look for a\
    \ section titled gd and verify which version is identified.\n\ngd\n\n|  |  |\n\
    |---|---| \n| GD Support | enabled |\n| GD Version | bundled (2.0.28 compatible)\
    \ |\n| GIF Read Support | enabled |\n| GIF Create Support | enabled |\n| JPG Support\
    \ | enabled |\n| PNG Support | enabled |\n| WBMP Support | enabled |\n| XBM Support\
    \ | enabled |\n\n# The JPEG and PNG libraries\n\nOur PHP server needs to have\
    \ support for the JPEG and PNG images if we or our users want to generate thumbnails\
    \ for those types of images. For more details, please refer to http://php.net/manual/en/ref.image.php.\n\
    \n# Memory limits\n\nOn some PHP servers, the default value in php.ini for memory_limit\
    \ is 8 MB. This is too low for correct image manipulation because the GD functions\
    \ used to produce the final images need some working memory. For example, in one\
    \ test, a value of 11 MB in memory_limit was needed to generate the thumbnail\
    \ from a 300 KB JPEG image."
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Examples of transformations


    We will now discuss a few transformation examples.


    # Clickable thumbnail (.jpeg or .png)


    We will start by changing our cover_photo field type from BLOB to MEDIUMBLOB to
    ensure that we can upload photographs, which that are bigger than 65 KB in size.


    We then enter the following attributes:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_268_0.png)


    Here, the options are presented in the form of width and height. If we omit the
    options, the default values are 100 and 100. The thumbnail generation code preserves
    the original aspect ratio of the image. Therefore, the values entered are the
    maximum width and height of the generated image. We then upload a .jpeg file in
    a cell (using instructions from Chapter 6). As a result, we get the following
    in Browse mode for this table:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_268_1.png)


    This thumbnail can be clicked to reveal the full-size photograph.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '> > The thumbnail is not stored anywhere in MySQL, but generated each time
    we go into Browse mode for this set of rows. On a double Xeon 3.2GHz server, we
    commonly experience a generation rate of six JPEG images per second.


    For a .png file, we have to use **image/png** as the MIME type and **image/png:
    inline** as the transformation.


    # Links to an image


    To get a link without thumbnails, we use the **image/jpeg: link** transformation.

    There are no transformation options. This link can be used to view the photograph
    (by left-clicking on the link) and then possibly download it (by right-clicking
    on the photograph itself).


    | isbn book number | title | page_count approximate | author_id of author table
    | language | description | cover_photo | genre |

    |---|---|---|---|---|---|---|---|

    | 1-234567-22-0 | Future souvenirs | 200 | 2 | en |  | [BLOB] |  |


    # Date formatting


    We have a field named **date_published** in our book table; let''s change its
    type to **DATETIME**. Then, we set its MIME type to **text/plain** and the browser
    transformation to **text/plain: dateformat**. The next step is to edit the row
    for the "Future souvenirs" book, and enter **2003-01-01 14:56:00** in the **date_published**
    field.

    When we browse the table, we now see the field has been formatted. Moving the
    mouse over the field reveals the unformatted original contents.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_269_0.png)'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'This transformation accepts two options. The first is the number of hours that
    will be added to the original value, which is zero by default. Adding the number
    of hours can be useful if we store all times based on **Universal Coordinated
    Time (UTC)**, but want to display them for a specific zone (UTC+5). The second
    option is the time format we want to use, made from any PHP `strftime` parameters.
    So, if we put this in the transformation options – ''0'',''Year: %Y'' – we will
    get:


    | date_published | stamp |

    |---|---|

    | Year: 2003 | 2006-07-22 09:51:50 |

    | Year: 19?? | 2000-00-00 00:00:00 |

    | Year: 1999 | 0000-00-00 00:00:00 |


    # Links from text


    Suppose that we have put a complete URL – http://domain.com/abc.pdf – in the **description**
    field in our book table. The text of the link will be displayed while browsing
    the table, but we would not be able to click it. We''ll now see the use of the
    **text/plain** MIME type in such a situation.


    # text/plain: link


    If we use a **text/plain** MIME type and a **text/plain: link** browser transformation
    in the scenario just mentioned, we will still see the text for the link, and it
    will be clickable.


    | isbn book number | title | page_count approximate | author_id of author table
    | language | description |

    |---|---|---|---|---|---|

    | 1-234567-22-0 | Future souvenirs | 200 | 2 | en | http://domain.com/abc.pdf
    |

    | 1-234567-89-0 | A hundred years of cinema (volume 1) | 600 | 1 | en |  |


    If all the documents that we want to point to are located at a common URL prefix,
    we can put this prefix (for example, http://domain.com/) in the first transformation
    option, within the enclosing quotes. Then, we would only need to put the last
    part of the URL (abc.pdf) in each cell.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'A second transformation option is available for setting a title. This would
    be displayed in the Browse mode instead of the URL contents, but a click would
    nonetheless bring us to the intended URL.


    > If we use only the second transformation option, we have to put quotes where
    the first option is to be entered. It could be done as: ` `, `this is the title`


    # text/plain: imagelink


    This transformation is similar to the previous one, except that in the cell, we
    place a URL that points to an image. This image will be fetched and displayed
    in the cell along with the link text. The image could be anywhere on the Web,
    including our local server.


    Here we have the following three options available:


    +   - The common URL prefix (like the one for text/plain: link)

    +   - The width of the image in pixels (default: 100)

    +   - The height (default: 50)


    For our test URL, you should enter these options:


    ```

    ` `, `100`, `123`

    ```


    If the text for the link is too long, the transformation does not occur. By default,
    the Partial Texts display option is selected.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_271_0.png)'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'In this case, we can switch to Full Texts to reveal the complete link. We can
    then see the complete image.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_272_0.png)


    Other transformations, such as image/jpeg: inline and image/png: inline, specify
    the exact MIME type of the image. In these cases, phpMyAdmin uses GD2 library
    functions for the thumbnail generation. However, the link contained in a text/plain:
    imagelink transformation may refer to any browser-supported image type. Therefore,
    phpMyAdmin just displays a resized image with an HTML img tag and its width and
    height attributes, according to the size options defined in the transformation.
    To see the original image, we can click either the link or the thumbnail.


    # Preserving the original formatting


    Normally, when displaying text, phpMyAdmin helps you get rid of special characters.
    For example, if we entered This book is <b>good</b> in the description field for
    one book, we would normally see This book is <b>good</b> when browsing the table.
    However, if we used the transformation text/plain: formatted for this field, we
    would get the following while browsing:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_272_1.png)


    In this example, the results are correct. However, other HTML entered in the data
    field could produce surprising results (including invalid HTML pages). For example,
    because phpMyAdmin presents results using HTML tables, a non-escaped </table>
    tag in the data field would ruin the output.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Displaying parts of a text


    The text/plain: substr transformation is available for displaying only a portion
    of the text. Here are the options:


    +   - First: where to start in the text (default: 0)

    +   - Second: how many characters (default: all the remaining text)

    +   - Third: what to display as a suffix to show that truncation has occurred;
    the default is to display ellipses (...)


    Remember that $cfg[''LimitChars''] is doing a character truncation for every non-numeric
    field. Hence, text/plain: substr is a mechanism for fine-tuning this field-by-field.


    # Download link


    Let''s say we want to store a small audio comment about each book inside MySQL.
    We add a new field to the book table, with the name audio_contents, and type MEDIUMBLOB.
    We set its MIME type to application/octetstream and choose the application/octetstream:
    download transformation. In the Transformation options, we insert ''comment.wav''.


    |  |  |

    |---|---|

    | MIME type | application/octetstream |

    | Browser transformation | application/octetstream: download |

    | Transformation options³ | ''comment.wav'' |


    This MIME type and extension will inform our browser about the incoming data,
    and the browser should open the appropriate player. To insert a comment, we first
    record it in a .wav format, and then upload the contents of the file into the
    audio_contents field for one of the books. When browsing our table, we can see
    a link comment.wav for our audio comment.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_273_0.png)


    > Chapter 17 describes the BLOB streaming technique, which is more appropriate
    for bigger chunks of data (for example, using phpMyAdmin to watch a movie stored
    in MySQL!).'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Hexadecimal representation


    Characters are stored in MySQL (computers in general) as numeric data, and converted
    into something meaningful for the screen or printer. Users sometimes cut and paste
    data from one application to phpMyAdmin, leading to unexpected results if the
    characters are not directly supported by MySQL. I remember a case that involved
    special quotation marks entered in a Microsoft Word document and pasted to phpMyAdmin.
    It helps to be able to see the exact hexadecimal codes, and this can be done by
    using the application/octetstream: hex transformation.


    In the following example, this transformation will be applied to the title field
    of our book table. When browsing the row containing the Future souvenirs title,
    we can see:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_274_0.png)


    As we know which character set this column is encoded with, we can compare its
    contents with a chart describing each character. For instance, http://en.wikipedia.org/wiki/Latin1
    describes the latin1 character set.


    # SQL pretty printing


    The term pretty printing (http://en.wikipedia.org/wiki/Pretty_printing) refers
    to a way of "beautifying" source code. Let''s say we are using a table to store
    the text of a course about SQL. In one column, we might have put sample SQL statements.
    With the text/plain: sql transformation, these SQL statements will be displayed
    in color, with syntax highlighting, when the table is browsed.


    # IP address


    An IP (v4) address can be encoded into a long integer (for example, via the PHP
    iptolong() function), and stored into a MySQL UNSIGNED INT column. To convert
    it back to the familiar dotted string (for example, 127.0.0.1), you can use the
    text/plain: longToIpv4 transformation.


    # External applications


    The transformations that have been described previously are implemented directly
    from within phpMyAdmin. However, some transformations are better executed via
    existing external applications.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'The text/plain: external transformation enables us to send a cell''s data to
    another application that will be started on the web server, capture this application''s
    output, and display it in the cell''s position.


    This feature is supported only on a Linux or UNIX server (under Microsoft Windows,
    output and error redirection cannot be easily captured by the PHP process). Furthermore,
    PHP should not be running in safe mode. Hence, the feature may not be available
    on hosted servers.


    For security reasons, the exact path and name of the application cannot be set
    from within phpMyAdmin as a transformation option. The application names are set
    directly inside one of the phpMyAdmin scripts.


    First, in the phpMyAdmin installation directory, we edit the text_plain_external.inc.php
    file in libraries/transformations/, and find the following section:


    ```

    $allowed_programs = array();

    //$allowed_programs[0] = ''/usr/local/bin/tidy'';

    //$allowed_programs[1] = ''/usr/local/bin/validate'';

    ```


    No external application is configured by default, and we have to explicitly add
    our own.


    > The names of the transformation scripts are constructed using the following
    format—the MIME type, a double underscore, and then a part indicating which transformation
    takes place.


    Every program that is allowed, along with its complete path, must be described
    here, with an index number starting from 0. Then we save the modifications to
    this script and put it back on the server if needed. The remaining setup is completed
    from the panel where we chose the options for the other browser transformations.


    Of course, we will now choose text/plain: external in the transformations menu.


    As the first option, we place the application number (for example, 0 would be
    for the tidy application). The second option holds the parameters we need to pass
    to this application. If we want phpMyAdmin to apply the htmlspecialchars() function
    to the results, we put 1 as the third parameter—done by default. We could put
    a 0 there to avoid protecting the output with htmlspecialchars().


    If we want to avoid reformatting the cell''s lines, we put 1 as the fourth parameter.
    This will use the NOWRAP modifier, and is done by default.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# External application example: In-cell sort


    This example shows how to sort the text contents of one cell. We start by modifying
    the **text_plain_external.inc.php** script, as mentioned in the above section,
    to add the **sort** program:


    ```

    $allowed_programs[0] = ''/bin/sort'';

    ```


    Note that our new program bears the index number 0.


    We then add a **TEXT** field and **keywords** to our book table. Finally, we fill
    in the MIME-related information, entering ''0'',''-r'' as the transformation options.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_276_0.png)


    The ''0'' here refers to the index number for **sort**, and the ''-r'' is a parameter
    for **sort**, which makes the program sort in the reverse order.


    Next, we **Edit** the row for the book "A hundred years of cinema (volume 1)",
    entering some keywords in no particular order (as seen in the following screenshot)
    and hitting **Go** in order to save the changes.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_276_1.png)'
  merge: -1
