    # Summary


    This chapter covers various aspects including opening the query generator, choosing
    tables, entering column criteria, sorting and showing columns, and altering the
    number of criteria rows or columns. It also shows us how to use the AND and OR
    operators to define relations between the rows and columns, and how to use automatic
