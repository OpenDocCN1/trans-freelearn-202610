- pgno: 155
  md: '# LaTeX


    LaTeX is a typesetting language. phpMyAdmin can generate a .tex file that represents
    the table''s structure and/or data in a sideways tabular format. Note that this
    file is not directly viewable, and must be processed further or converted for
    the intended final media.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_155_0.png)


    The available options are:


    +   - **Include table caption**: Display captions in the tabular output.

    +   - **Structure and Data**: The familiar choice to request structure, data,
    or both.

    +   - **Table caption**: The caption to go on the first page.

    +   - **Continued table caption**: The caption to go on, page after page.

    +   - **Relations, Comments, MIME-type**: Other structure information we want
    as output. These choices are available if the relational infrastructure is in
    place (see Chapter 11 for details).'
  merge: -1
  img_proc: true
