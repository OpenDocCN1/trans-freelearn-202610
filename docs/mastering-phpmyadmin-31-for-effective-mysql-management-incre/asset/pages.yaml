    \ Please note that this is a MySQL non-standard extension, and it's available\
    \ only for MyISAM, ISAM, MEMORY, and ARCHIVE tables.\n+   - **Use ignore inserts**:\
    \ Normally, at import time, we cannot insert duplicate values for unique keys,\
