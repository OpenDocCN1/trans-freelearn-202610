    +   - Various options in phpMyAdmin that allow us to import data

    +   - The different mechanisms involved in importing SQL and CSV files

    +   - The limits that we might hit when trying a transfer, and ways to bypass
    these limits


    Chapter 9 will explain how to do single-table searches (covering search criteria
    specification) and how to search in the whole database.'
