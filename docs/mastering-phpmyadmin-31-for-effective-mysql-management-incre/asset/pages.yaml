- pgno: 219
  md: '# 12


    # Entering SQL Commands


    This chapter explains how we can enter our own SQL commands (queries) into phpMyAdmin,
    and how we can keep a history of those queries.


    # The SQL query box


    phpMyAdmin allows us to accomplish many database operations via its graphical
    interface. However, there will be times when we have to rely on SQL query input
    to achieve complex operations. Here are some examples of complex queries:


    ```

    SELECT department, AVG(salary) FROM employees GROUP BY department

    HAVING years_experience > 10;

    SELECT FROM_DAYS(TO_DAYS(CURDATE()) +30);

    ```


    To enter such queries, the query box is available from a number of places within
    phpMyAdmin.


    # The Database view


    We encounter our first query box when going to the SQL menu available in the Database
    view.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_219_0.png)'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'This box is simple — we type in some valid (hopefully) MySQL statement and
    click Go. Under the query text area, there are bookmark-related choices (explained
    later in Chapter 14). Usually, we don''t have to change the standard SQL delimiter,
    which is a semicolon. However, there is a Delimiter dialog in case we need it
    (see chapter 17).


    For a default query to appear in this box, we can set it with the $cfg[''DefaultQueryDatabase'']
    configuration directive, which is empty by default. We could put a query like
    SHOW TABLES FROM %d in this directive. The %d parameter in this query would be
    replaced by the current database name, resulting in SHOW TABLES FROM `marc_book`
    in the query box.


    # The Table view


    A slightly different box is available in the Table view from the SQL menu.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_220_0.png)


    There is a Fields selector and an Insert button (<<) on the right. The box already
    has a default query as seen in the previous screenshot.


    This default query is generated from the $cfg[''DefaultQueryTable''] configuration
    directive, which contains SELECT * FROM %t WHERE 1. Here, the %t is replaced by
    the current table name. Another placeholder available in $cfg[''DefaultQueryTable'']
    is %f. This placeholder would be replaced by the complete field list of this table,
    thus producing the following query:


    ```

    SELECT `isbn`, `title`, `page_count`, `author_id`, `language`, `description`,
    `cover_photo`, `genre`, `date_published`, `stamp`, `some_bits` FROM `book` WHERE
    1.

    ```'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'WHERE 1 is a condition that is always true. Therefore, the query can be executed
    as it is. We can replace 1 with the condition we want, or we can type a completely
    different query.


    # The Fields selector


    The Fields selector is a way to speed up query generation. By choosing a field
    and clicking on the arrows <<, this field name is copied at the current cursor
    position in the query box. Here, we select the author_id field, remove the digit
    1, and click <<. Then we add the condition = 2.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_221_0.png)


    The Show this query here again option (checked by default) ensures that the query
    stays in the box after its execution if we are still on the same page. This can
    be seen more easily for a query like an UPDATE or DELETE, which affects a table,
    but does not produce a separate results page.


    # Clicking into the query box


    We might want to change the behavior of a click inside the query box with the
    $cfg[''TextareaAutoSelect''] configuration directive. Its default value is FALSE,
    which means that no automatic selection of the contents is done upon a click.
    Should you change this directive to TRUE, the first click inside this box will
    select all its contents. (This is a way to quickly copy the contents elsewhere
    or delete them from the box.) The next click would put the cursor at the click
    position.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# The Query window


    In Chapter 3, we discussed the purpose of this window, and the procedure for changing
    some parameters (like dimensions). This window can easily be opened from the left
    panel using the SQL icon or the Query window link, and is very convenient for
    entering a query and testing it.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_222_0.png)


    The following screenshot shows the Query window that appears over the right panel:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_222_1.png)'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The window seen in the screenshot contains the same **Fields** selector and
    **<<** button as that used in a Table view context. This distinct Query window
    is a feature supported only on JavaScript-enabled browsers.


    # Query window options


    The **SQL** tab is the default active tab in this window. This comes from the
    configuration directive `$cfg[''QueryWindowDefTab'']`, which contains **sql**
    by default.


    If we want another tab to be the default active tab, we can replace **sql** with
    **files** or **history**. Another value, **full**, shows the contents of all the
    three tabs at once.


    In the Query window, we see a checkbox for the **Do not overwrite this query from
    outside the window** choice. Normally, this is not checked. The changes we make
    while generating queries are reflected in the Query window. This is called **synchronization**.
    For example, choosing a different database or table from the left or right panel
    would update the Query window accordingly. However, if we start to type a query
    directly in this window, the checkbox will get checked in order to protect its
    contents and remove synchronization. This way, the query composed here will be
    locked and protected.


    # Session based SQL history


    This feature collects all the successful SQL queries we execute, as PHP session
    data, and modifies the Query window to make them available. This default type
    of history is temporary, as `$cfg[''QueryHistoryDB'']` is set to FALSE by default.


    # Database based SQL history (permanent)


    As we installed the linked-tables infrastructure (see Chapter 11), a more powerful
    history mechanism is available. This mechanism is triggered by setting `$cfg[''QueryHistoryDB'']`
    to TRUE.


    After we try some queries from one of the query boxes, a history is built, visible
    only from the Query window.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_223_0.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'We see (in the reverse order) the last successful queries and the database
    on which they were made. Queries, typed only from the query box are kept in this
    history. Queries generated by phpMyAdmin (such as those generated by clicking
    on **Browse**) aren''t kept here.


    They are clickable for immediate execution, and the **Edit** icon is available
    to insert a recorded query into the query box for editing.


    The number of queries that will be kept is controlled by $cfg[''QueryHistoryMax''],
    which is set to 25 by default. This limit is not kept for performance reasons,
    but as a practical limit in order to achieve a visually unencumbered view. Extra
    queries are eliminated at login time in a process traditionally called **garbage
    collection**. The queries are stored in the table configured in $cfg[''Servers''][$i][''history''].


    # Editing queries in the query window


    On the results page of a successful query, a header containing the executed query
    appears as shown in the following screenshot:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_224_0.png)


    Clicking **Edit** opens the Query window''s **SQL** tab, with this query ready
    to be modified. This happens because of the following default setting for this
    parameter:


    ```

    $cfg[''EditInWindow''] = TRUE;

    ```


    When it is set to FALSE, a click on **Edit** will not open the Query window; instead,
    the query will appear inside the query box of the **SQL** subpage.


    # Multi-statement queries


    In PHP and MySQL programming, we can send only one query at a time using the mysql_query()
    function call. phpMyAdmin allows us to send many queries in one transmission,
    using a semicolon as a separator. Suppose we type the following query in the query
    box:


    ```

    INSERT INTO author VALUES (100,''Paul Smith'',''111-2222'');

    INSERT INTO author VALUES (101,''Melanie Smith'',''222-3333'');

    UPDATE author SET phone=''444-5555'' WHERE name LIKE ''%Smith%'';

    ```'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'We will receive the following results screen:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_225_0.png)


    We see the number of affected rows through comments because $cfg[''VerboseMultiSubmit'']
    is set to TRUE.


    Let''s send the same list of queries again and watch the results:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_225_1.png)


    It is normal to receive a Duplicate entry error that says, the value 100 exists
    already. We are seeing the results of the first INSERT statement; but what happens
    to the next one? Execution stops at the first error because $cfg[''IgnoreMultiSubmitErrors'']
    is set to FALSE telling phpMyAdmin not to ignore errors in multiple statements.
    If it is set to TRUE, the program successively tries all the statements, and we
    see two Duplicate entry errors.


    This feature would not work as expected, if we tried more than one SELECT statement.
    We would see the results of only the last SELECT statement.


    # Pretty printing (syntax-highlighting)


    By default, phpMyAdmin parses and highlights the various elements of any MySQL
    statement it processes. This is controlled by $cfg[''SQP''][''fmtType''], which
    is set to ''html'' by default. This mode uses a specific color for each different
    element (a reserved word, a variable, a comment, and so on) as described in the
    $cfg[''SQP''][''fmtColor''] array located in the theme-specific layout.inc.php
    file.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'In the previous examples, fmtType was set to `text` because this mode is more
    legible in a book. This mode inserts line breaks at logical points inside a MySQL
    statement, but there is no color involved. With fmtType set to `html`, phpMyAdmin
    would report the SQL statements with syntax highlighting. However, setting fmtType
    to `none` removes every kind of formatting, leaving our syntax intact.


    > The multi-dimensional arrays used for holding some parameters in the configuration
    file reflect a programming style adopted by the phpMyAdmin development team. This
    ensures that parameter names are not very long.


    # The SQL Validator


    Each time phpMyAdmin transmits a query, the MySQL server interprets it and provides
    feedback. The syntax of the query must follow MySQL rules, which are not the same
    as standard SQL. However, conforming to standard SQL ensures that our queries
    are usable on other SQL implementations.


    A free external service, the Mimer SQL Validator, is available to us. It validates
    our query according to the Core SQL-99 rules and generates a report. The Validator
    is available directly from phpMyAdmin, and its homepage is located at http://developer.mimer.com/validator/index.htm.


    > For statistical purposes, this service anonymously stores on its server, the
    queries it receives. When storing the queries, it replaces database, table, and
    column names with generic names. Strings and numbers that are part of the query,
    are replaced with generic values so as to protect the original information.


    # System requirements


    This Validator is available as a SOAP service. Our PHP server must have XML, PCRE,
    and PEAR support. We need some PEAR modules too. The following command (executed
    on the server by the system administrator) installs the modules we need:


    ```

    pear install Net_Socket Net_URL HTTP_Request Mail_Mime Net_DIME SOAP

    ```


    If we have problems with this command due to some of the modules being in a beta
    state, we can execute the following command, which installs SOAP and other dependent
    modules:


    ```

    pear -d preferred_state=beta install -a SOAP

    ```'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Making the Validator available


    Some parameters must be configured in config.inc.php. Setting $cfg[''SQLQuery''][''Validate'']
    to TRUE enables the Validate SQL link.


    We should also enable the Validator itself (as other validators might be available
    on future phpMyAdmin versions). This is done by setting $cfg[''SQLValidator''][''use'']
    to TRUE.


    The Validator is accessed with an anonymous Validator account by default, as configured
    using the following commands:


    ```

    $cfg[''SQLValidator''][''username''] = '''';

    $cfg[''SQLValidator''][''password''] = '''';

    ```


    Instead, if the company has provided us with an account, we can use that account
    information here.


    # Validator results


    There are two kinds of reports returned by the Validator – one if the query conforms
    to the standard, and the other if it does not conform.


    # Standard-conforming queries


    We will try a simple query: SELECT COUNT(*) FROM book. As usual, we enter this
    query in the query box and send it. On the results page, we now see an additional
    link – Validate SQL.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_227_0.png)


    Clicking on Validate SQL produces the following report:


    ```

    Conforms to Core SQL-99

    SQL queries stored anonymously for statistical purposes.

    ```


    We have the option of clicking Skip Validate SQL to see our original query.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Non-standard-conforming queries


    Let''s try another query, which works correctly in MySQL: SELECT * FROM book WHERE
    language = ''en''. Sending it to the Validator produces the following report:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_228_0.png)


    Each time the Validator finds a problem, it adds a message such as {error: 1}
    at the point of the error and adds a footnote in the report. This time, the language
    column name is non-standard. Hence, the Validator tells us that it was expecting
    an identifier at this point. Another non-standard error is reported about the
    use of a LIMIT clause, which was added to the query by phpMyAdmin.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Another case is that of the backquotes. If we just click on **Browse** for
    the book table, phpMyAdmin generates SELECT * FROM `book`, enclosing the table
    name with backquotes. This is MySQL''s way of protecting identifiers, which might
    contain special characters, such as spaces, international characters, or reserved
    words. However, sending this query to the Validator shows us that the backquotes
    do not conform to standard SQL. We may even get two errors, one for each backquote.


    # Summary


    This chapter helps us understand the purpose of query boxes and shows us where
    to find them. It also gives us an overview of the Query window options, multi-statement
    queries, how to use the field selector, how to use the SQL Validator, and finally,
    how to get a history of the typed commands. The next chapter will show how to
    produce multi-table queries without typing, thanks to phpMyAdmin''s query generator.'
  merge: -1
  img_proc: true
- pgno: 230
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 231
  md: '# 13

    The Multi-Table Query Generator


    The **Search** pages in the Database or Table view are intended for single-table
    lookups. This chapter covers the multi-table **Query by example (QBE)** feature
    available in the Database view.


    Many phpMyAdmin users work in the Table view, table by table, and thus tend to
    overlook the multi-table query generator, which is a wonderful feature for fine-tuning
    queries. The query generator is useful not only in multi-table situations but
    also in single table situations. It enables us to specify multiple criteria for
    a column, a feature that the **Search** page in the Table view does not possess.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_231_0.png)


    > The examples in this chapter assume that a multi-user installation of the linked-tables
    infrastructure has been made (see Chapter 11), and that the book-copy table created
    during an exercise of Chapter 10 is still there in the marc_book database.


    To open the page for this feature, we go to the Database view for a specific database
    (the query generator supports working on only one database at a time) and click
    on **Query**.


    The screenshot overleaf shows the initial QBE page. It contains the following
    elements:


    +   - Criteria columns

    +   - An interface to add criteria rows

    +   - An interface to add criteria columns

    +   - A table selector'
