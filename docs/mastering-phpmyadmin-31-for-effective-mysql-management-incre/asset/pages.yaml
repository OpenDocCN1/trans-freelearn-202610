- pgno: 23
  md: '# Preface


    Providing a powerful graphical interface for managing MySQL, phpMyAdmin is one
    of the most popular open source applications. While most developers use routine
    features of phpMyAdmin every day, few are aware of the power and potential its
    advanced features have. This book builds a solid understanding of the core capabilities
    of phpMyAdmin, and then walks you through every facet of this legendary tool.


    Used by millions of developers, MySQL is the most popular open source database.
    It supports numerous large, dynamic websites and applications. MySQL has acquired
    this wide popularity by virtue of its open source nature, performance, reliability,
    robustness, and support for multiple platforms. However, this popularity has also
    been helped by the existence of phpMyAdmin – the industry standard administration
    tool that makes database management easy for both, the experienced developer and
    the novice one.


    Bringing a web interface to MySQL has made phpMyAdmin an indispensable tool for
    MySQL and web developers, be they professionals or in the classroom. Every user
    can benefit from phpMyAdmin, by unlocking the full potential of this powerful
    application.


    # What this book covers


    Chapter 1 gives us the reasons why we should use phpMyAdmin as a means of developing
    web applications. It then covers the downloading and installation procedures for
    phpMyAdmin.


    Chapter 2 provides an overview of various authentication types used in MySQL.
    It then covers the security issues related to phpMyAdmin installation.


    Chapter 3 gives us an overview of the phpMyAdmin interface. It includes the login
    panel, the left and the right panel including the Light and the Full mode, and
    the Query window.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Chapter 4 is all about database creation. It teaches us how to create a table,
    how to insert data manually, and how to sort the data.


    Chapter 5 covers the aspects of data editing in phpMyAdmin. It teaches us handling
    NULL values, multi-row editing. Finally, it covers an important aspect of any
    database tool—data deletion.


    Chapter 6 explores the subject of changing the structure of tables. Its primary
    focus is on editing field attributes and index management.


    Chapter 7 deals with backups and exports. It lists various ways to trigger an
    export, available export formats, the options associated with export formats,
    and the various places where the export files may be sent.


    Chapter 8 tells us how to bring back exported data created for backup and transfer
    purposes. It provides an overview of the various options available in phpMyAdmin
    to import data, and different mechanisms involved in importing SQL and CSV files.
    Finally, it covers the limitations that may be faced while importing files, and
    the ways to overcome them.


    Chapter 9 presents the mechanisms that are useful for searching data effectively.


    Chapter 10 covers ways to perform some operations that influence and can be performed
    on entire tables or databases as a whole. Finally, it deals with table maintenance
    operations for table repair and optimization.


    Chapter 11 is where we start covering advanced features of phpMyAdmin. The chapter
    explains how to define inter-table relations. It also explains how to install
    the linked-tables infrastructure—a prerequisite for the advanced features.


    Chapter 12 helps us enter our own SQL commands. The chapter also gives us an overview
    of Query window—the window used to edit an SQL query. Finally, it also helps us
    to obtain the history of typed commands.


    Chapter 13 covers the multi-table query generator, which allows us to produce
    multi-table queries without actually typing them.


    Chapter 14 covers Bookmarks—one of the features of the linked-tables infrastructure.
    It covers how to record bookmarks and how to manipulate them. Finally, it covers
    passing parameters to bookmarks, and executing bookmarks directly from the pma_bookmark
    table.


    Chapter 15 gives an overview of how to produce documentation, which explains the
    structure of the databases, using the tools offered by phpMyAdmin.'
  merge: -1
