- pgno: 4
  md: "# About the author\n\nMarc Delisle, owing to his involvement with phpMyAdmin,\
    \ is a member of the MySQL Developers Guild that regroups community developers.\
    \ He began contributing to this popular MySQL web interface in December 1998,\
    \ when he made its first multi-language version. As a developer and project administrator,\
    \ he has been actively involved with this software project since 2001.\n\nSince\
    \ 1980 Marc has worked at Cegep de Sherbrooke, Québec, Canada, as an application\
    \ programmer and network manager. He has also been teaching networking, security,\
    \ and PHP/MySQL application development. In one of his classes, he was pleased\
    \ to meet a phpMyAdmin user from Argentina. Marc lives in Sherbrooke with his\
    \ wife, and they enjoy spending time with their four children.\n\nThis book is\
    \ an update to Marc's first book on phpMyAdmin, published by Packt Publishing\
    \ in 2004, followed by \"Creating your MySQL Database: Practical Design Tips and\
    \ Techniques\", also by Packt Publishing.\n\n> I am truly grateful to Louay Fatoohi,\
    \ who approached me for this book project, and to the Packt team whose sound comments\
    \ were greatly appreciated during production. My thanks also go to Garvin Hicking,\
    \ Alexander Marcus Turek, and Kai 'Oswald' Seidler—the reviewers for the successive\
    \ editions of this book. Their sharp eyes helped in making this book clearer and\
    \ more complete.\n> \n> Finally, I wish to thank all contributors to phpMyAdmin's\
    \ source code, translations, and documentation. The time they gave to this project\
    \ still inspires me and continues to push me forward."
  merge: -1
  img_proc: true
- pgno: 5
  md: '# About the reviewer


    **Kai "Oswald" Seidler** was born in Hamburg in 1970. He graduated from the Technical
    University of Berlin with a Diplom-Informatiker degree (the equivalent of a Master
    of Science degree) in Computer Science. In the ''90s, he created and managed Germany''s
    biggest IRCnet server — irc.fu-berlin.de, and co-managed one of the world''s largest
    anonymous FTP servers — ftp.cs.tu-berlin.de.


    He set up his first professional public web server in 1993. From 1993 to 1998,
    he was a member of Projektgruppe Kulturraum Internet — a research project on net
    culture and network organization. In 2002, he co-founded Apache Friends and created
    the multi-platform Apache web server bundle XAMPP. Around 2005, XAMPP became the
    most popular Apache stack worldwide.


    In 2006, his third book, "Das XAMPP-Handbuch", was published by Addison Wesley.'
