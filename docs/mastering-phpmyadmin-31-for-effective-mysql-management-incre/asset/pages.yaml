- pgno: 258
  md: '> When we are satisfied with the layout, we must click **Save**.


    # Displaying a page


    The last section of the screen is the PDF report generation dialog. Now that we
    have created a page, the **Display PDF schema** is also available from the **Operations**
    subpage of the Database view. We''ll have a look at this dialog from the Operations
    page because the option set is more complete on this page.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_258_0.png)


    The available options are:


    +   - **Show grid**: The schema will have a grid layer with the coordinates displayed.

    +   - **Show color**: The links between tables, table names, and special columns
    (primary keys and display fields) will be in color.

    +   - **Show dimensions of tables**: The visual dimension of each table in the
    table title (for example, 32x30) will be displayed.

    +   - **Display all tables with the same width**: All tables will be displayed
    using the same width. (Normally, the width adjusts itself according to the length
    of the table and the column names.)

    +   - **Data Dictionary**: The data dictionary, which was covered earlier in this
    chapter, will be included at the beginning of the report.

    +   - **Only show keys**: Do not show the columns on which there are no indexes
    defined.'
  merge: -1
  img_proc: true
