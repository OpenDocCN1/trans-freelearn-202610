- pgno: 153
  md: '# PDF


    Since version 2.8.0, it''s possible to create a PDF report of a table by exporting
    in PDF. This feature works on only one table at a time, and we must click the
    **Save as file** checkbox for normal operation. We can add a title for this report,
    and it also gets automatically paginated. In versions 2.8.0 to 2.8.2, this export
    format does not support non-textual (BLOB) data as in the book table. If we try
    it in this table, it will produce the wrong results.


    Here, we test it on the author table.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_153_0.png)


    PDF is interesting because of its inherent vectorial nature – the results can
    be zoomed. Let''s have a look at the generated report, as seen from the Acrobat
    Reader:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_153_1.png)


    # Microsoft Excel 2000


    This export format directly produces an .x1s file suitable for all software that
    understand the Excel 2000 format. We can specify which string should replace a
    NULL value. The **Put field names in the first row** option, when activated, generates
    the table''s column names as the first line of the spreadsheet. Again, the **Save
    as file** checkbox should be checked. This produces a file, where each table''s
    column becomes a spreadsheet column.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_153_2.png)'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Microsoft Word 2000


    This export format directly produces a .doc file suitable for all software that
    understand the Word 2000 format. We find options similar to those in the Microsoft
    Excel 2000 export, and a few more. We can independently export the table''s Structure
    and Data.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_154_0.png)


    Note that, for this format and the Excel format, we can choose many tables for
    one export. However, unpleasant results happen if one of these tables has non-textual
    data. Here are the results for the author table:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_154_1.png)'
  merge: -1
