- pgno: 241
  md: '# 14

    Bookmarks


    This chapter covers query bookmarks — one of the features of the linked-tables
    infrastructure. Being able to label queries, and recall them by label, can be
    a real time saver. Bookmarks are queries that are:


    +   - Stored permanently

    +   - Viewable

    +   - Erasable

    +   - Related to one database

    +   - Recorded only as a consequence of a user''s wish

    +   - Labeled

    +   - Private by default (only available to the user creating them), but possibly
    public


    A bookmark can also have a variable part, as explained in the Passing a parameter
    value to a bookmark section later in this chapter.


    There is no bookmark subpage to manage bookmarks. Instead, the various actions
    on bookmarks are available on specific pages, such as results pages or query box
    pages.


    # Comparing bookmark and query history features


    In Chapter 12, we learned about the SQL history feature, which automatically stores
    queries (temporarily or permanently). There are similarities between queries stored
    in the history and bookmarks. After all, both features are intended to store queries
    for later execution. However, there are important differences, regarding the way
    they are stored and the action that triggers the recording of a query.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'There is a configurable limit (see Chapter 12) on the number of queries stored
    in the permanent history; however, the number of bookmarks is not limited. Also,
    the history feature presents the queries in the reverse order of the time they
    were sent. However, the bookmarks are shown by label (not showing the query text
    directly). Finally, query storing in the history is automatic, whereas a query
    is saved as a bookmark via an explicit request from the user.


    To summarize, the automatic query history is useful when we neither plan to recall
    a query, nor wish to remember which queries we typed. This contrasts with the
    bookmark facility where we intentionally ask the system to remember a query, even
    giving it a name (label). Therefore, we can do more with bookmarks than with the
    query history, but both features have their own importance.


    # Bookmark creation


    There are two moments when it is possible to create a query – after a query is
    executed (in this case we don''t need to plan ahead its creation) or before sending
    the query to the MySQL server for execution. Both these options are explored in
    the following sections.


    # Creating a bookmark after a successful query


    Initial bookmark creation is made possible by the Bookmark this SQL query button.
    This button appears only after executing a query that generates a result (when
    at least one row is found); so this method for creating bookmarks only stores
    SELECT statements. For example, a complex query produced by the multi-table query
    generator (as seen in Chapter 13) could be stored as a bookmark this way, provided
    it finds some results.


    Let''s see an example. In the Search page for the book table, we select the fields
    that we want in the results, and enter the search values as shown in the following
    screenshot:'
  merge: -1
  img_proc: true
- pgno: 243
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_243_0.png)


    After clicking Go, we see that the results page shows a bookmark dialog. We enter
    only a label for this bookmark, and click Bookmark this SQL query to save this
    query as a bookmark. Bookmarks are saved in the table defined by `$cfg[''Servers''][$i][''bookmarktable'']`.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_243_1.png)'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'This bookmark dialog can be seen on any page that contains results. As a test,
    we could just click **Browse** for a table to get results, and then store this
    query as a bookmark. However, it does not make much sense to store (in a bookmark)
    a query that can easily be made with one click.


    # Storing a bookmark before sending a query


    Sometimes, we may want to store a bookmark even if a query does not find any results.
    This may be the case if the matching data is not yet present, or if the query
    is not a SELECT statement. To achieve this, we have the **Bookmark this SQL query**
    dialog available in the **SQL** tab of the Database view, Table view, and the
    query window.


    We now go to the **SQL** subpage of the **book** table, enter a query, and directly
    put the **books in French** bookmark label in the **Bookmark this SQL query**
    field. If this bookmark label has been used previously, a new bookmark with the
    same name will be created unless we select the **Replace existing bookmark of
    same name** checkbox. Bookmarks carry an internal identifying number, as well
    as a label chosen by the user.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_244_0.png)


    On clicking **Go**, the query is executed and stored as a bookmark. It does not
    matter if the query does not find anything. This is how we can generate bookmarks
    for non-SELECT queries such as UPDATE, DELETE, CREATE TABLE, and so on.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '> This technique can also be used for a SELECT statement that either returns
    results or does not return results.


    # Public bookmarks


    All bookmarks we create are private by default. When a bookmark is created, the
    user name using which we are logged in, is stored with the bookmark. Let''s suppose
    that we choose Let every user access this bookmark as shown in the following screenshot:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_245_0.png)


    This would have the following effect:


    +   - All users having access to the same database (the current one) will have
    access to the bookmark.

    +   - A user''s ability to see meaningful results from the bookmark depends on
    the privileges they have on the tables referenced in the bookmark.

    +   - Users will be able to delete the bookmark.


    # The default initial query for a table


    In the previous examples, we chose bookmark labels according to our preferences.
    However, by convention, if a bookmark has the same name as a table, it will be
    executed when Browse is clicked for this table. Thus, instead of seeing the normal
    Browse results of this table, we''ll see the bookmark''s results.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Bookmarks


    Suppose that we are interested in viewing (by default, in the Browse mode) the
    books with a page count lower than 300. We first generate the appropriate query,
    which can be done easily from the Search page, and then we use book as a label
    on the results page.


    ```

    SELECT `isbn`, `title`, `page_count`, `author_id`

    FROM `book`

    WHERE `page_count` <300

    LIMIT 0, 30

    ```


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_246_0.png)


    # Multi-query bookmarks


    A single bookmark can also store more than one query (separated by semicolon).
    This is mostly useful for non-SELECT queries. As an example, let''s assume that
    we need to clean data about authors by removing an invalid area code from the
    phone numbers, on a regular basis. This operation would always be followed by
    a display of the author table.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'To accomplish this goal, we store a bookmark (before sending it for execution)
    that contains these queries:


    ```

    update author set phone = replace(phone,''(123)'',''(456)'');

    select * from author;

    ```


    In the bookmark, we could put many data modification statements such as INSERT,
    UPDATE, or DELETE, followed optionally by one SELECT statement. Stacking a lot
    of SELECT statements would not yield the intended result because we would only
    see the data fetched by the last SELECT statement.


    # Recalling from the bookmarks list


    These bookmarks can now easily be found on the following pages:


    +   - The Table view: SQL subpage of any table from marc_book

    +   - The query window: The SQL-History tab

    +   - While browsing the pma_bookmark table (see the Executing Bookmarks from
    the pma_bookmark Table section later)

    +   - The Database view: SQL subpage of the marc_book database


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_247_0.png)


    Three choices are available when recalling a bookmark—Submit, View only, and Delete
    (Submit being the default).


    # Bookmark execution


    Choosing the first bookmark and hitting Go executes the stored query and displays
    its results. The page resulting from a bookmark execution does not have another
    dialog to create a bookmark, as this would be superfluous.


    > The results we get are not necessarily the same as when we created the bookmark.
    They reflect the current contents of the database. Only the query is stored as
    a bookmark.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Bookmark manipulation


    Sometimes, we may just want to ascertain the contents of a bookmark. This is done
    by choosing a bookmark and selecting **View only**. Only the query will be displayed.
    We could then click **Edit** and rework its contents. By doing so, we would be
    editing a copy of the original bookmarked query. To keep this new edited query,
    we can save it as a bookmark. Again, this will create another bookmark even if
    we choose the same bookmark label, unless we explicitly ask for the original bookmark
    to be replaced.


    A bookmark can be erased with the **Delete** option. There is no confirmation
    dialog to confirm the deletion of the bookmark. Deletion is followed only by a
    message stating: **The bookmark has been deleted.**


    # Bookmark parameters


    If we look again at the first bookmark we created (finding all books for **author
    1**), we realize that although it is useful, it is limited to finding the same
    author.


    Special query syntax enables the passing of parameters to bookmarks. This syntax
    uses the fact that SQL comments enclosed within /* and */ are ignored by MySQL.
    If the /*[VARIABLE]*/ construct exists somewhere in the query, it will be expanded
    at execution time with the value provided when recalling the bookmark.


    # Creating a parameterized bookmark


    Let''s say we want to find all the books for a given author when we don''t know
    the author''s name. We first enter the following query:


    ```

    ```sql

    SELECT author.name, author.id, book.title

    FROM book, author

    WHERE book.author_id = author.id

    /* AND author.name LIKE ''%[VARIABLE]%'' */

    ```

    ```


    The part between the comments characters (/* */) will be expanded later, and the
    tags will be removed. We label this query as a bookmark named **find author by
    name** and click **Go**. The first execution of the query just stores the bookmark
    while retrieving all books by all the authors, as this time we haven''t passed
    a parameter to the query.


    In this example, we have two conditions in the WHERE clause, of which one contains
    the special syntax. If our only criterion in the WHERE clause needs a parameter,
    we can use a syntax such as WHERE 1 /* and author_id = [VARIABLE] */.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Passing a parameter value to a bookmark


    To test the bookmark, we recall it as usual and enter a value in the Variable
    field.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_249_0.png)


    When we click Go, we see the expanded query and the author Smith''s books.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_249_1.png)'
  merge: -1
