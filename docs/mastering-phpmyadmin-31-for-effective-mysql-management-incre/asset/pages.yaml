- pgno: 233
  md: '# Column criteria


    Three criteria columns are provided by default. This section discusses the options
    we have for editing their criteria. These include options for selecting fields,
    sorting individual columns, entering conditions for individual columns, and so
    on.


    # Field selector: Single-column or all columns


    The Field selector contains all the individual columns for the selected tables,
    plus a special choice ending with an asterisk (*) for each table, which means
    that all the fields are selected.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_233_0.png)


    To display all the fields in the author table, we would choose `author`.* and
    check the Show checkbox, without entering anything in the Sort and the Criteria
    boxes. In our case, we select `author`.`name`, as we want to enter some criteria
    for the author''s name.


    # Sorts


    For each selected individual column, we can specify a sort (in Ascending or Descending
    order), or let this line remain intact (no sorting). If we choose more than one
    sorted column, the sorting will be carried out from left to right.


    > When we ask for a column to be sorted, we normally check the Show checkbox.
    But this is not necessary, as we might want to do just the sorting operation without
    displaying this column.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Showing a column


    We check the Show checkbox so that we can see the column in the results. Sometimes,
    we may just want to apply a criterion on a column, and not include it in the resulting
    page. Here, we add the phone column, ask for it to be sorted, and choose to show
    both the name and the phone number. We also ask for a sort on the name in the
    ascending order. The sort will be done first by name, and then by the phone number
    if the names are identical. This is because the name is in a column criterion
    to the left of the phone column, and thus has a higher priority.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_234_0.png)


    # Updating the query


    At any point, we can click the Update Query button to see the progress of our
    generated query. We have to click it at least once before executing the query.
    For now, let''s click it and see the query generated in the query area. In the
    following examples, we will click Update Query after each modification.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_234_1.png)


    We have selected two tables, but have not yet chosen any column from the book
    table. Hence, this table is not mentioned in the generated query.


    # Criteria


    In the Criteria box, we can enter a condition (respecting the SQL WHERE clause''s
    syntax) for each of the corresponding columns. By default, we have two criteria
    rows. To find all the authors with Smith in their names, we use a LIKE criterion
    (LIKE ''%SMITH%'') and click Update Query.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_235_0.png)


    We have another line available to enter an additional criterion. Let''s say we
    want to find the author **Maria Sunshine** as well. This time, we use an = condition.
    The two condition rows will be joined by the OR operator, selected by default
    from the left side of the interface.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_235_1.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'To demonstrate that the OR operator links both the criteria rows better, let''s
    now add a condition, LIKE ''%8%'', on the phone number.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_236_0.png)


    By examining the positioning of the AND and OR operators, we can see that the
    first row of the conditions is linked by the AND (because AND is chosen under
    the name column) operator, and the second row of conditions is linked to the rest
    by the OR operator. The condition we''ve just added (LIKE ''%8%'') is not meant
    to find anyone, since, we changed the phone number of all the authors with the
    name "Smith" to "444-5555" (in Chapter 12).


    If we want another criterion on the same column, we just add a criteria row.


    # Adjusting the number of criteria rows


    The number of criteria rows can be changed in two ways. First, we can select the
    Ins checkbox under Criteria to add one criteria row (after clicking on Update
    Query). As this checkbox can add only one criteria row at a time, we''ll uncheck
    it and use the Add/Delete Criteria Row dialog instead. In this dialog, we choose
