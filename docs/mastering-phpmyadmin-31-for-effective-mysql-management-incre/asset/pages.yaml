    # Summary


    In this chapter, we learn how to improve the browsing experience by transforming
    data using various methods. The chapter also gives an overview of the thumbnail
    and full-size images of the .jpeg and .png BLOB fields, how to generate links,
    format dates, display only parts of texts, and how to execute external programs
    to reformat cell contents. Chapter 17 will cover phpMyAdmin''s support for the
    MySQL features that are new in versions 5.0 and 5.1.'
