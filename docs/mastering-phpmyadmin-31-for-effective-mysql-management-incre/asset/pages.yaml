- pgno: 25
  md: 'Chapter 16 explains how to apply transformations to the data in order to customize
    its format at view time.


    Chapter 17 covers phpMyAdmin''s support for the MySQL features that are new in
    versions 5.0 and 5.1.


    Chapter 18 is about the administration of a MySQL server, focusing on the management
