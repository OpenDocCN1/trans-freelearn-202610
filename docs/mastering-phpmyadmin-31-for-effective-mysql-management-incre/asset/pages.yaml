- pgno: 44
  md: 'Other configuration parameters can be set with these web-based setup pages.
    To do so, we would have to:


    +   1. Enable read and write access to the config directory

    +   2. Copy the config.inc.php there

    +   3. Ensure that read and write access are provided to this file for the web
    server

    +   4. Start the web-based setup tool


    You are invited to peruse the remaining menus to get a sense of the available
    configuration possibilities, either now, or later when we cover a related subject.


    In order to keep this book''s text lighter, we will only refer to the parameters''
    textual values in the following chapters.


    # Manual creation of config.inc.php


    We can create this text file from scratch using our favorite text editor, or by
    using config.sample.inc.php as a starting point. The exact procedure depends upon
    which client operating system we are using. We can refer to the next section for
    further information.


    The default values for all possible configuration parameters that can be located
    inside config.inc.php are defined in libraries/config.default.php. We can take
    a look at this file to see the syntax used as well as further comments about configuration.
    See the important note about this file in the Upgrading phpMyAdmin section of
    this chapter.


    # Tips for editing config.inc.php on a Windows Client


    This file contains special characters (Unix-style end of lines). Hence, we must
    open it with a text editor that understands this format. If we use the wrong text
    editor, this file will be displayed with very long lines.


    The best choice is a standard PHP editor. Another choice would be WordPad, Metapad,
    or UltraEdit. We should be careful not to add any characters (even blank lines)
    at the beginning or end of the file. This would disturb the execution of phpMyAdmin
    and generate the Cannot send header output... error message. If this happens,
    refer to Appendix B.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Every time the config.inc.php file is modified, it will have to be transferred
    again to our webspace. This transfer is done via an FTP or an SFTP client. You
    have the option to use a standalone FTP/SFTP client such as FileZilla, or save
    directly via FTP/SFTP if your PHP editor supports this feature.


    # Description of some configuration parameters


    In this chapter and the next one, we will concentrate on the parameters that deal
    with connection and authentication. Other parameters will be discussed in the
    chapters where the corresponding features are explained.


    # PmaAbsoluteUri


    The first parameter we will look at is $cfg[''PmaAbsoluteUri''] = '''';


    PMA is a familiar abbreviation for phpMyAdmin. For configuration parameters, the
    chosen convention is to capitalize the first letter, producing Pma in this case.
    At some places in its code, phpMyAdmin sends an HTTP Location header and must
    know the absolute URI of its installation point. Using an absolute URI in this
    case is required by RFC 2616, section 14.30.


    In most cases, we can leave this one empty, as phpMyAdmin tries to auto-detect
    the correct value. If we browse a table later, and then edit a row and click Save,
    we will receive an error message from our browser saying, for example, This document
    does not exist. This means that the absolute URI that phpMyAdmin built in order
    to reach the intended page was wrong, indicating that we must manually put the
    correct value in this parameter.


    For example, we would change it to:


    ```

    $cfg[''PmaAbsoluteUri''] = ''http://www.mydomain.com/phpMyAdmin/'';

    ```


    # Server-specific sections


    The next section of the file contains server-specific configurations, each starting
    with:


    ```

    $i++;

    $cfg[''Servers''][$i][''host''] = '''';

    ```'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'If we examine only the normal server parameters (other parameters will be covered
    starting with Chapter 11), we see a section that looks like the following for
    each server:


    ```

    $i++;

    $cfg[''Servers''][$i][''host'']      = '''';

    $cfg[''Servers''][$i][''port'']      = '''';

    $cfg[''Servers''][$i][''socket'']    = '''';

    $cfg[''Servers''][$i][''connect_type''] = ''tcp'';

    $cfg[''Servers''][$i][''extension''] = ''mysqli'';

    $cfg[''Servers''][$i][''compress'']  = FALSE;

    $cfg[''Servers''][$i][''controluser''] = '''';

    $cfg[''Servers''][$i][''controlpass''] = '''';

    $cfg[''Servers''][$i][''auth_type''] = ''cookie'';

    $cfg[''Servers''][$i][''user'']      = '''';

    $cfg[''Servers''][$i][''password'']  = '''';

    $cfg[''Servers''][$i][''only_db'']   = '''';

    $cfg[''Servers''][$i][''hide_db'']   = '''';

    $cfg[''Servers''][$i][''verbose'']   = '''';

    ```


    In this section, we have to enter in $cfg[''Servers''][$i][''host''], the hostname
    or IP address of the MySQL server – for example, mysql.mydomain.com or localhost.
    If this server is running on a non-standard port or socket, we fill in the correct
    values in $cfg[''Servers''][$i][''port''] or $cfg[''Servers''][$i][''socket''].
    See the section on connect_type for more details about sockets.


    The displayed server name inside phpMyAdmin''s interface will be the one entered
    in `host` (unless we enter a non-blank value in the following parameter). For
    example:


    ```

    $cfg[''Servers''][$i][''verbose''] = ''Test server'';

    ```


    This feature can thus be used to hide the real server hostname as seen by the
    users.


    # extension


    The traditional mechanism PHP uses to communicate with a MySQL server, as available
    in PHP before version 5, is the mysql extension. This extension is still available
    in PHP 5. However, a new extension called mysqli has been developed and should
    be preferred for PHP 5, because of its improved performance and its support of
    the full functionality of MySQL family 4.1.x. This extension is designed to work
    with MySQL version 4.1.3 and higher.


    In phpMyAdmin version 2.6.0, a new library has been implemented. This has made
    possible the use of both extensions, choosing either one for a particular server.
    We indicate the extension we want to use in $cfg[''Servers''][$i][''extension''].'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# PersistentConnections


    Another important parameter (which is not server-specific but applies to all server
    definitions) is $cfg[''PersistentConnections'']. For every server we connect to
    using the mysql extension, this parameter, when set to TRUE, instructs PHP to
    keep the connection to the MySQL server open. This speeds up the interaction between
    PHP and MySQL. However, it is set to FALSE by default in config.inc.php because
    persistent connections are often a cause of resource depletion on servers. So
    you will find MySQL refusing new connections. For this reason, the option is not
    even available for the mysqli extension. Hence they setting it to TRUE here would
    have no effect if you are connecting with this extension.


    # connect_type, socket and port


    Both the mysql and mysqli extensions automatically use a socket to connect to
    MySQL if the server is on localhost. Consider this configuration:


    ```

    $cfg[''Servers''][$i][''host'']      = ''localhost'';

    $cfg[''Servers''][$i][''port'']      = '''';

    $cfg[''Servers''][$i][''socket'']    = '''';

    $cfg[''Servers''][$i][''connect_type''] = ''tcp'';

    $cfg[''Servers''][$i][''extension''] = ''mysql'';

    ```


    The default value for connect_type is tcp. However, the extension will use a socket
    because it concludes that this is more efficient as the host is localhost. So
    in this case, we can use tcp or socket as the connect_type. To force a real tcp
    connection, we can specify 127.0.0.1 instead of localhost in the host parameter.
    Because the socket parameter is empty, the extension will try the default socket.
    If this default socket, as defined in php.ini, does not correspond to the real
    socket assigned to the MySQL server, we have to put the socket name (for example,
    /tmp/mysql.sock) in $cfg[''Servers''][$i][''socket''].


    If the hostname is not localhost, a tcp connection will occur—here, on the special
    port 3307. However, leaving the port value empty would use the default 3306 port:


    ```

    $cfg[''Servers''][$i][''host'']        = ''mysql.mydomain.com'';


    $cfg[''Servers''][$i][''port'']        = ''3307'';


    $cfg[''Servers''][$i][''socket'']      = "";


    $cfg[''Servers''][$i][''connect_type'']  = ''tcp'';


    $cfg[''Servers''][$i][''extension'']    = ''mysql'';

    ```'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# compress configuration


    Starting with PHP 4.3.0 and MySQL 3.23.49, the protocol used to communicate between
    PHP and MySQL allows a compressed mode. Using this mode provides better efficiency.
    To take advantage of this mode, simply specify:


    ```

    $cfg[''Servers''][$i][''compress''] = TRUE;

    ```


    # Upgrading phpMyAdmin


    Normally, upgrading is just a matter of installing the newer version into a separate
    directory and copying the previous version''s config.inc.php to the new directory.
    If the previous version is phpMyAdmin 2.6.0 or older, we cannot copy its config.inc.php
    to the new version because the file format has changed too much.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_48_0.png)


    > An upgrade path or the first-installation path, which should not be taken is
    to copy libraries/config.default.php to config.inc.php. This is because the default
    configuration file is version-specific, and is not guaranteed to work for the
    future versions.


    New parameters appear from version to version. They are documented in Documentation.html
    and defined in libraries/config.default.php. If a configuration parameter is not
    present in config.inc.php, its value from libraries/config.default.php will be
    used. Therefore, we do not have to include it in config.inc.php if the default
    value suits us.


    Special care must be taken to propagate the changes we might have made to the
    layout.inc.php files depending on the themes used. We may even have to copy our
    custom themes subdirectories if we added our own themes to the structure.


    # Summary


    This chapter covers how the web has evolved as a means of delivering applications,
    and why we should use PHP/MySQL to develop these applications. The chapter also
    gives an overview of why phpMyAdmin is recognized as a leading application to
    interface MySQL from the Web and a brief list of its features. It then discusses
    common reasons for installing phpMyAdmin, steps for downloading it from the main
    site, basic configuration, uploading phpMyAdmin to our web server, and also about
    upgrading.


    Now that the basic installation has been done, the next chapter will deal with
    the configuration subject in depth, by exploring the authentication and security
    aspects.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 2


    # Authentication and Security


    There are many ways of configuring authentication in phpMyAdmin—depending on our
    goals, the presence of other applications, and the level of security we need.
    This chapter explores the available possibilities.


    # MySQL authentication


    When we type in a username and password, although it seems that we are logging
    in to phpMyAdmin, we are not! The authentication system is a function of the MySQL
    server. We are merely using phpMyAdmin (which is running on the web server) as
    an interface that sends our username and password information to the MySQL server.
    Strictly speaking, we do not log in to phpMyAdmin, but **through** phpMyAdmin.


    This is why in user support forums about phpMyAdmin, people asking for help about
    authentication are often referred back to their MySQL server''s administrator,
    because a lost MySQL user or password is not really a phpMyAdmin problem.


    This section explains the various authentication modes offered by phpMyAdmin.


    # Root user without password


    In many cases, MySQL''s default installation leaves a server open to intrusion
    because it creates a MySQL account named `root` without a password. To counter
    this problem, phpMyAdmin 3.1.0 has introduced a server-specific configuration
    parameter, `$cfg[''Servers''][$i][''AllowNoPasswordRoot'']`, which by default
    is `false`. Generally, this directive should remain `false` to avoid this kind
    of access via phpMyAdmin, as hackers are actively probing the web for insecure
    MySQL servers. Go through the *Security* section for other ideas about protecting
    your server.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '> > If this parameter is set to **false** and a login attempt is made with
    the **root** account and no password, an **Access denied** message is displayed.


    # Single-user authentication using config


    For our first example, we will use the config authentication type, which is easy
    to understand. However, in the *Multi-user authentication* section, we will see
    more powerful and versatile ways of authenticating.


    > > Using the **config** authentication type leaves our phpMyAdmin open to intrusion,
    unless we protect it as explained in the *Security* section of this chapter.


    Here we ask for config authentication, and enter our username and password for
    this MySQL server:


    ```

    $cfg[''Servers''][$i][''auth_type''] = ''config'';

    $cfg[''Servers''][$i][''user'']      = ''marc'';

    $cfg[''Servers''][$i][''password'']  = ''bingo'';

    ```


    We can then save the changes we made in config.inc.php.


    # Testing the connection


    Now it''s time to start phpMyAdmin and try connecting with the values we configured.
    This will test the following:


    +   - The values we entered in the config file or on the web-based setup

    +   - The setup of the PHP component inside the web server, if we did a manual
    configuration

    +   - Communication between web and MySQL servers


    We start our browser and point it to the directory where we installed phpMyAdmin,
    as in http://www.mydomain.com/phpMyAdmin. If this does not work, we try http://www.mydomain.com/phpMyAdmin/index.php.
    (This would mean that our web server is not configured to interpret index.php
    as the default starting document.)


    If you still get an error, refer to Appendix B for troubleshooting and support.
    We should now see phpMyAdmin''s homepage. Chapter 3 gives an overview of the panels
    seen now.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Multi-user authentication


    We might want to allow a single copy of phpMyAdmin to be used by a group of persons,
    each having their own MySQL username and password, and seeing only the databases
    they have rights to. Or we might prefer to avoid having our username and password
    in clear text in config.inc.php.


    # Authentication types offered


    Instead of relying on a username and password stored in config.inc.php, phpMyAdmin
    will communicate with the browser and get authentication data from it. This enables
    true login for all users defined in a specific MySQL server, without having to
    define them in the configuration file. There are three modes offered that allow
    a controlled login to MySQL via phpMyAdmin—http, cookie, and signon. We will have
    to choose the one that suits our specific situation and environment (more on this
    in a moment). The http and cookie modes may require that we first define a control
    user.


    # The control user


    Defining the control user has two purposes:


    +   - On a MySQL server previous to version 4.1.2 or running with --skip-show-database,
    the control user permits the use of multi-user authentication. This aspect is
    described in the current section.

    +   - On all versions of MySQL server, this user is necessary to be able to use
    the advanced relational features of phpMyAdmin, which are described starting at
    Chapter 11.


    To be able to use authentication types for every kind of MySQL user (in MySQL,
    user privileges may be expressed in various ways), we should define a control
    user and a password in the server-specific section of a server. If we do not define
    one, users who have been defined in MySQL with a syntax of `user`@`hostname` or
    `user`@`%`, will be able to function normally with phpMyAdmin''s features like
    creating a database, while others won''t.


    For authentication purposes, the control user is a special user (the usual name
    we choose for it is pma) who has the rights to read some fields in the special
    mysql database (which contains all the user definitions). phpMyAdmin sends queries
    with this special control user only for the specific needs of authentication,
    and not for normal operation. The commands to create the control user are available
    in phpMyAdmin''s Documentation.html and may vary from one version to the other.
    This documentation contains the most current commands.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'When our control user is created in the MySQL server, we fill in the parameters
    as in the following example:


    ```

    $cfg[''Servers''][$i][''controluser''] = ''pma'';

    $cfg[''Servers''][$i][''controlpass''] = ''bingo'';

    ```


    > I use the bingo password when I teach phpMyAdmin; it is recommended to avoid
    using the same password for your own installation.


    # Logging out


    Since version 2.10, a mechanism is available to indicate phpMyAdmin, as to which
    URL it should pass control after a logout. This feature works for all authentication
    types. Here is an example:


    ```

    $cfg[''Servers''][$i][''LogoutURL''] = ''http://www.mydomain.com'';

    ```


    This directive must contain an absolute URL, including the protocol.


    # HTTP authentication


    This mode—http—is the traditional mode offered in HTTP, in which the browser asks
    for the username and password, sends them to phpMyAdmin, and keeps sending them
    until all the browser''s windows are closed.


    To enable this mode, we simply use the following line:


    ```

    $cfg[''Servers''][$i][''auth_type''] = ''http'';

    ```


    This mode has some limitations:


    +   - PHP, depending on the version, might not support HTTP authentication. It
    works when PHP is running as a module under Apache; for other cases, we should
    consult the PHP documentation for our version.

    +   - If we want to protect phpMyAdmin''s directory with a .htaccess file (see
    the Security section in this chapter), this will interfere with HTTP authentication
    type; we cannot use both.

    +   - There is not a true logout, as we will have to close all browser windows
    to be able to login again with the same username.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Even considering those limitations, this mode may be a valuable choice for
    the following reasons:


    +   - Some browsers can store the authentication information in an unencrypted
    form

    +   - It is a bit faster than cookie processing


    # Cookie authentication


    The cookie authentication mode is superior to http in terms of the functionalities
    offered. It offers true login and logout, and can be used with PHP running on
    any kind of web server. It presents a login panel (see the following figure) from
    within phpMyAdmin. This can be customized, as we have the application source code.
    However, as you may have guessed, for cookie authentication, the browser must
    accept cookies coming from the web server — true for all authentication modes
    starting with phpMyAdmin 2.8.0.


    This mode stores the username typed in the login screen into a permanent cookie
    in our browser. The password is stored as a temporary cookie. In a multi-server
    configuration, the username and password corresponding to each server are stored
    separately. To protect the username and password secrecy against some attack methods
    that target cookie content, they are encrypted using the Blowfish mechanism. So,
    to use this mode, we have to define (once) in config.inc.php, a secret password
    that will be used to securely encrypt all passwords stored as cookies from this
    phpMyAdmin installation.


    This is done by putting a secret password here:


    ```

    $cfg[''blowfish_secret''] = ''SantaLivesInCanada'';

    ```


    Then, for each server-specific section, use the following:


    ```

    $cfg[''Servers''][$i][''auth_type''] = ''cookie'';

    ```'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'The next time we start phpMyAdmin, we will see the login panel as shown in
    the following figure:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_54_0.png)


    By default, phpMyAdmin displays (in the login panel) the last username for which
    a successful login was achieved for this particular server, as retrieved from
    the permanent cookie. If this behavior is not acceptable (if we would prefer that
    someone else who logs in from the same workstation should not see the previous
    username), we can set the following parameter to FALSE:


    ```

    $cfg[''LoginCookieRecall''] = FALSE;

    ```


    A security feature was added in phpMyAdmin 2.6.0—a time limit for the validity
    of the entered password. This feature helps to protect the working session. After
    a successful login, our password is stored in a cookie, along with a timer. Every
    action in phpMyAdmin resets the timer. If we stay inactive for a certain number
    of seconds, as defined in $cfg[''LoginCookieValidity''], we are disconnected and
    have to log in again. The default is 1800 seconds.


    > The Blowfish algorithm used to protect the username and password requires many
    computations. To achieve the best possible speed, the PHP''s mcrypt extension
    and its accompanying library must be installed on our web server. Otherwise, phpMyAdmin
    relies on an internally-coded algorithm, which works, but causes delays of several
    seconds on almost every operation done from phpMyAdmin! This is because the username
    and password information must be decoded on every mouse click to be able to connect
    to MySQL.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Signon authentication


    Since version 2.10, the signon mode enables us to use the credentials from another
    application to authenticate to phpMyAdmin. Some applications have their own authentication
    mechanism, so it''s convenient to be able to use this fact to avoid another cumbersome
    login panel. In order for this to work, this other application has to store the
    proper credentials into PHP''s session data to be retrieved later by phpMyAdmin.


    To enable this mode, we start with this directive:


    ```

    ```php

    $cfg[''Servers''][$i][''auth_type''] = ''signon'';

    ```

    ```


    Let''s suppose that the authenticating application has used a session named FirstApp
    to store the credentials. We tell this to phpMyAdmin:


    ```

    ```php

    $cfg[''Servers''][$i][''SignonSession''] = ''FirstApp'';

    ```

    ```


    We must take care of users that would try to access phpMyAdmin before the other
    application; in this case, phpMyAdmin will redirect users to the authenticating
    application. This is done with


    ```

    ```php

    $cfg[''Servers''][$i][''SignonURL''] = ''http://www.mydomain.com/FirstApp'';

    ```

    ```


    How does the authenticating application store credentials in a format that phpMyAdmin
    can understand? An example is included as scripts/signon.php. In this script,
    there is a simple HTML form to input the credentials and logic that initializes
    the session—we would use FirstApp as a session name, and create the user, password,
    and host information into this session:


    ```

    ```php

    $_SESSION[''PMA_single_signon_user''] = $_POST[''user''];

    $_SESSION[''PMA_single_signon_password''] = $_POST[''password''];

    $_SESSION[''PMA_single_signon_host''] = $_POST[''host''];

    ```

    ```


    > Note that FirstApp does not need to ask the MySQL''s credentials to the user.
    These could be hard coded inside the application, as they are secret or there
    is a known correspondence between the credentials of this application and that
    of MySQL''s.


    The authenticating application then uses a way of its choosing—a link or a button—to
    let its users start phpMyAdmin.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Multi-server configuration


    The config.inc.php file contains at least one server-specific section; however,
    we can add more, enabling a single copy of phpMyAdmin to manage many servers.
    Let us see how to configure more servers.


    # Servers defined in the configuration file


    In the server-specific sections of the config.inc.php file, we see lines referring
    to $cfg[''Servers''][$i] for each server. Here, the variable $i is used so that
    one can easily cut and paste whole sections of the configuration file to configure
    more servers. While copying such sections, we should take care that the $i++;
    instruction, which precedes each section and is crucial to delimit the server
    sections, is also copied.


    Then, at the end of the sections, the following line controls what happens at
    startup:


    ```

    $cfg[''ServerDefault''] = 1;

    ```


    The default value, 1, means that phpMyAdmin will connect by itself to the first
    server defined or present this server choice by default when using advanced authentication
    (more on this later in this chapter). We can specify any number, for the corresponding
    server-specific section. We can also enter the value 0, signifying no default
    server.


    This configuration can also be done via web-based setup. Given here is an example
    of a multi-server definition, with the default server being set to let the user
    choose.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_56_0.png)'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'With no default server defined, phpMyAdmin will present a server choice:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_57_0.png)


    # Arbitrary server


    Another mechanism can be used if we want to be able to connect to an undefined
    MySQL server. First, we have to set the following parameter:


    ```

    $cfg[''AllowArbitraryServer''] = TRUE;

    ```


    We also have to put back the default value of 1 into $cfg[''ServerDefault''].
    Then, we need to use the cookie authentication type. We will be able to choose
    the server and enter a username and a password.


    > Allowing an arbitrary server means that any MySQL server accessible from our
    web server could be connected to via phpMyAdmin. Therefore, this feature should
    probably be used in conjunction with a reinforced security mechanism (see the
    Security section).


    As seen here, we still can choose one of the defined servers in Server Choice.
    In addition, we can also enter an arbitrary server name, a username, and a password:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_57_1.png)


    As the tooltip indicates, you can also enter a port number (of course separated
    from hostname/IP address by space), if this MySQL server is listening on a non-standard
    port.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Security


    Security can be examined at various levels:


    +   - How we can protect the phpMyAdmin installation directory

    +   - Which workstations can access phpMyAdmin

    +   - The databases that a legitimate user can see

    +   - How in-transit data protection and access protection can be enforced via
    a physical USB key on the workstation


    # Directory-level protection


    Suppose an unauthorized person is trying to execute our copy of phpMyAdmin. If
    we use the simple config authentication type, anyone knowing the URL of our phpMyAdmin
    will have the same effective rights to our data as we do. In this case, we should
    use the directory protection mechanism offered by our web server (for example,
    .htaccess, a file name with a leading dot) to add a level of protection.


    If we decide on using http or cookie authentication types, our data would be safe
    enough. However, we should take normal precautions with our password (including
    its periodic change).


    The directory where phpMyAdmin is installed contains sensitive data. Not only
    the configuration file but also all scripts stored there must be protected from
    alteration. We should ensure that apart from us, only the web server effective
    user has read access to the files contained in this directory, and that only we
    can write to them.


    > > phpMyAdmin''s scripts never have to modify anything inside this directory,
    except when we use the Save export file to server feature (explained in Chapter
    7).


    Another possible attack is from other developers having an account on the same
    web server as we do. In this kind of attack, someone can try to open our config.inc.php
    file. As this file is readable by the web server, someone could try to include
    our file from their PHP scripts. This is why it is recommended to use PHP''s open_basedir
    feature, possibly applying it to all directories from which such attacks could
    originate.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Error handling


    Version 3.0 has introduced a new PHP error trapping behavior in phpMyAdmin, based
    on PHP''s custom error handler mechanism. One of the benefits of this error handler
    is to avoid path disclosure, which is considered a security weakness. The default
    settings related to this are:


    ```

    $cfg[''Error_Handler''] = array();

    $cfg[''Error_Handler''][''display''] = false;

    ```


    You should let the default value for display to be false, unless you are developing
    a new phpMyAdmin feature and want to see all PHP errors and warnings.


    # IP-based access control


    An additional level of protection can be added, this time verifying the Internet
    Protocol (IP) address of the machine from which the request to use phpMyAdmin
    is received.


    To achieve this level of protection, we construct rules allowing or denying access,
    and specify the order in which these rules will be applied.


    # Rules


    The format of a rule is:


    ```

    <''allow'' | ''deny''> <username> [from] <source>

    ```


    from being optional, here are some examples:


    | Rule | Description |

    |---|---|

    | allow Bob from 1.2.3.4 | User Bob is allowed access from IP address 1.2.3.4.
    |

    | allow Bob from 1.2.3/24 | User Bob is allowed from any address matching the
    network 1.2.3 (this is CIDR IP matching). |

    | deny Alice from 4.5/16 | User Alice cannot access when located on network 4.5.
    |

    | allow Melanie from all | User Melanie can login from anywhere. |'
  merge: -1
  img_proc: true
- pgno: 60
  md: "| Rule | Description |\n|------|-------------|\n| allow **Julie** from **localhost**\
    \ | Equivalent to 127.0.0.1 |\n| deny % from **all** | **all** can be used as\
    \ an equivalent to 0.0.0.0/0, meaning any host. Here, the % sign means any user.\
    \ |\n\nThe source part can also be formed with the special names **localnetA**,\
    \ **localnetB**, or **localnetC**. These represent the complete class A, B, or\
    \ C network in which the web server is located. Note that phpMyAdmin relies on\
    \ the $_SERVER[\"SERVER_ADDR\"] PHP parameter for this feature. Usually we will\
    \ have several rules. Let's say we wish to have the two rules that follow:\n\n\
    ```\nallow Marc from 45.34.23.12\nallow Melanie from all\n```\n\nWe have to put\
    \ them in config.inc.php (in the related server-specific section) as follows:\n\
    \n```\n$cfg['Servers'][$i]['AllowDeny']['rules'] =\n  array('allow Marc from 45.34.23.12',\n\
    \    'allow Melanie from all');\n```\n\nWhen defining a single rule or multiple\
    \ rules, a PHP array is used. We must follow its syntax, enclosing each complete\
    \ rule within single quotes and separating each rule from the next with a comma.\
    \ Thus, if we have only one rule, we must still use an array to specify it like\
    \ this:\n\n```\n$cfg['Servers'][$i]['AllowDeny']['rules'] =\n  array('allow Marc\
    \ from 45.34.23.12');\n```\n\nThe next parameter explains the order in which rules\
    \ are interpreted.\n\n# Order of interpretation for rules\n\nBy default, this\
    \ parameter is empty:\n\n```\n$cfg['Servers'][$i]['AllowDeny']['order'] = '';\n\
    ```\n\nThis means that no IP-based verification is made.\n\nSuppose we want to\
    \ allow access by default, denying access only to some username/ IP pairs. We\
    \ should use:\n\n```\n$cfg['Servers'][$i]['AllowDeny']['order'] = 'deny,allow';\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 61
  md: 'In this case, all deny rules will be applied first, followed by allow rules.
    If a case is not mentioned in the rules, access is granted. Being more restrictive,
    we''d want to deny by default. We can use:


    ```

    $cfg[''Servers''][$i][''AllowDeny''][''order''] = ''allow,deny'';

    ```


    This time, all allow rules are applied first, followed by deny rules. If a case
    is not mentioned in the rules, access is denied. The third (and most restrictive)
    way of specifying rules order is:


    ```

    $cfg[''Servers''][$i][''AllowDeny''][''order''] = ''explicit'';

    ```


    Now, deny rules are applied before allow rules. But for them to be accepted, a
    username/IP address must be listed in the allow rules, and not in the deny rules.


    # Simplified rule for root access


    As the root user is present in almost all MySQL installations, it''s often the
    target of attacks. Starting with phpMyAdmin 2.6.1, a parameter permits us to easily
    block all logins of the MySQL''s root account, using the following:


    ```

    $cfg[''Servers''][$i][''AllowRoot''] = FALSE;

    ```


    # Restricting the list of databases


    Sometimes it is useful to avoid showing in the left panel, all the databases a
    user has access to. phpMyAdmin offers two ways of restricting—only_db and hide_db.


    To specify the list of what can be seen, the only_db parameter is used. It may
    contain a database name or a list of database names. Only these databases will
    be seen in the left panel:


    ```

    $cfg[''Servers''][$i][''only_db''] = ''payroll'';

    $cfg[''Servers''][$i][''only_db''] = array(''payroll'', ''hr'');

    ```


    The database names can contain MySQL wildcard characters like _ and %. If an array
    is used to specify many databases, they will be displayed on the interface in
    the same order they are listed in the array.


    Another feature of only_db is that you can use it not to restrict the list, but
    instead to put emphasis on certain names that will be displayed on top of the
    list. Here, the myspecial database name will appear first, followed by all other
    names:


    ```

    $cfg[''Servers''][$i][''only_db''] = array(''myspecial'', ''*'');

    ```'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'We can also indicate which database names must be hidden with the hide_db parameter.
    It contains a regular expression (http://en.wikipedia.org/wiki/Regular_expression)
    representing what to exclude. If we do not want users to see all databases whose
    names begin with ''secret'', we would use:


    ```

    $cfg[''Servers''][$i][''hide_db''] = ''^secret'';

    ```


    These parameters apply to all users for this server-specific configuration.


    > These mechanisms do not replace the MySQL privilege system. Users'' rights on
    other databases still apply, but they cannot use phpMyAdmin''s left panel to navigate
    to their other databases or tables.


    # Protecting in-transit data


    HTTP is not inherently immune to network sniffing (grabbing sensitive data off
    the wire). So, if we want to protect not only our username and password but all
    the data that travels between our web server and browser, we have to use HTTPS.


    To do so, assuming that our web server supports HTTPS, we just have to start phpMyAdmin
    by putting https instead of http in the URL as follows:


    ```

    https://www.mydomain.com/phpMyAdmin

    ```


    If we are using PmaAbsoluteUri auto-detection:


    ```

    $cfg[''PmaAbsoluteUri''] = '''';

    ```


    phpMyAdmin will see that we are using HTTPS in the URL and react accordingly.
    If not, we must put the https part in this parameter as follows:


    ```

    $cfg[''PmaAbsoluteUri''] = ''https://www.mydomain.com/phpMyAdmin'';

    ```


    Also, since phpMyAdmin 2.7.0, we can automatically switch users to an HTTPS connection
    with this setting:


    ```

    $cfg[''ForceSSL''] = TRUE;

    ```


    # Swekey hardware authentication


    Since version 3.1, support for the Swekey hardware authentication key has been
    merged to cookie-based authentication in phpMyAdmin. Reference for this USB key
    is available at http://phpmyadmin.net/auth_key. A Swekey can be used with all
    compatible web applications to add a level of security, based on the possession
    of this physical device. In the case of phpMyAdmin, it does not replace the normal
    MySQL authentication.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Configuration


    The contrib/swekey.sample.conf sample file should be used as a starting point
    to configure this feature. This file contains sample configuration commands and
    comments from the vendor. The principle is simple – each Swekey device contains
    a unique id, and this id must be associated with a MySQL username in the Swekey
    configuration file. These lines are part of the sample file:


    ```

    0000000000000000000000000000763A:root


    000000000000000000000000000089E4:steve


    0000000000000000000000000000231E:scott

    ```


    This means that the person responsible with the phpMyAdmin configuration, tracks
    which Swekey is given to each user and puts this information in the file. The
    vendor does not need to be informed about this association. They only keep track
    of which Swekey are sold and which are deactivated. Hence, Swekey can be passed
    from one user to another, provided that the configuration is updated accordingly.


    Other security-related directives are in the sample file, and it''s recommended
    to refrain from changing them — SERVER_CHECK, SERVER_RNDTOKEN, and SERVER_STATUS
    in particular. This is because these directives access servers via https, which
    is a guaranty of a secure channel between our web server and the vendor''s.


    Once modified, this file should be copied over to a directory outside the web
    server''s document root (suggested place is /etc/swekey-pma.conf). Then, a configuration
    parameter in config.inc.php must be set as well:


    ```

    $cfg[''Servers''][$i][''auth_swekey_config''] = ''/etc/swekey-pma.conf'';

    ```


    # Usage


    Let''s see what happens now when phpMyAdmin is started and no Swekey is connected
    to your workstation:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_63_0.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'We notice three changes:


    +   - The username field cannot be typed in

    +   - A small key icon is displayed

    +   - An error message appears


    It''s normal that the username field is deactivated, as user names are now taken
    from the Swekey configuration file. The icon can be clicked to reach the vendor''s
    website. There is a testing mechanism on this site, to verify if a Swekey is connected.
    Drivers can also be downloaded in case the automatic installation did not work.


    Now if you connect your Swekey, assuming that user marc has been defined and associated
    to this device, a reassuring panel is displayed:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_64_0.png)


    # Security note


    It would not make sense to rely on the protection offered by this device, if our
    users have access to a webspace on which they can install their own copy of phpMyAdmin.
    Obviously, phpMyAdmin has to be configured accordingly to make use of the Swekey.
    Hence, a user-installed copy of phpMyAdmin would circumvent the protection. This
    means that a host provider should permit access to his MySQL server, only from
    a web server on which he/she installed a controlled copy of phpMyAdmin, and on
    which other users cannot install their own copy.


    # Summary


    This chapter gives us an overview of how to use a single copy of phpMyAdmin to
    manage multiple servers, and also the usage of authentication types to fulfill
    the needs of a users'' group while protecting authentication credentials. The
    chapter also covers the ways of securing our phpMyAdmin installation.


    We''ll now have a look at all the panels and windows that comprise the user interface
    of phpMyAdmin.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# 3

    Interface Overview


    Before delving into task-oriented chapters, such as searching and the like, it''s
    appropriate to have a look at the general organization of phpMyAdmin''s interface.
    We''ll also see configuration parameters and settings that influence the interface
    as a whole.


    # Panels and windows


    The phpMyAdmin interface is composed of various panels and windows, each one having
    a specific function. We will first provide a quick overview of each panel, and
    then take a detailed look later in this chapter.


    # Login panels


    The login panel that appears depends on the authentication type chosen. For the
    http type, it will take the form of our browser''s HTTP authentication pop up
    screen. For the cookie type, the phpMyAdmin-specific login panel will be displayed.
    (This is covered in Chapter 2.) For the external authentication (signon), the
    login panel is handled by the external application itself. By default, a Server
    choice dialog and a Language selector are present on this panel.


    However, if we are using the config authentication type, no login panel is displayed,
    and the first displayed interface contains the left and the right panels.


    # Left and right panels


    These panels go together and are displayed during most of our working session
    with phpMyAdmin. The left panel is our navigation guide through the databases
    and tables. The right panel is the main working area where the data is managed
    and results appear. Its exact layout depends on the choices made from the left
    panel and the sequence of operations performed. For right-to-left languages like
    Hebrew, the navigation panel is located on the right side and the main panel is
    on the left.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_66_0.png)


    # Homepage


    The right panel can take the form of the homepage. The homepage will then contain
    various links related to MySQL operations or phpMyAdmin information, a Language
    selector, and possibly the themes selector.


    # Views


    In the right panel, we can see the Database view — where we can take various actions
    about a specific database, or the Table view — where we can access many functions
    to manage a table. There is also a Server view, useful for both system administrators
    and non-administrator users. All these views have a top menu, which takes the
    form of tabs that lead to different subpages used to present information regrouped
    by common functions (table structure, privileges, and so on).


    > Please do not confuse the term view — used here in the interface sense — with
    the MySQL 5.0''s notion of SQL views (covered in Chapter 17).


    # Query window


    This is a distinct window that is usually opened from the left panel — and sometimes
    from the right panel when editing an SQL query. Its main purpose is to facilitate
    work on queries and display the results on the right panel.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Starting page


    When we start phpMyAdmin, we will see the following (depending on the authentication
    type specified in config.inc.php, and on whether it has more than one server defined
    in it):


    +   - One of the login panels

    +   - The left and right panels with the homepage displayed in the right panel


    # General customization


    This section describes settings that have an impact on many panels. These settings
    modify the appearance of titles in windows, of information icons, and how the
    list of tables is sorted. The whole visual style of all pages is controlled by
    the theme system, which is covered here altogether.


    # Window titles configuration


    When the left and right panels are displayed, the window''s title changes to reflect
    which MySQL server, database, and table are active. phpMyAdmin also shows some
    information about the web server''s host name if $cfg[''ShowHttpHostTitle''] is
    set to TRUE. What is displayed depends on another setting – $cfg[''SetHttpHostTitle''].
    If this setting is empty (as it is by default), the true web server''s host name
    appears in the title. We can put another string, such as "my Web server", and
    this will be shown instead of the true host name.


    Seeing the web server''s host name can come in handy when we have many phpMyAdmin
    windows open, thus being connected to more than one web server. Of course, each
    phpMyAdmin window can itself give access to many MySQL servers.


    # Icon configuration


    When various warning, error, or information messages are displayed, they can be
    accompanied by an icon, if $cfg[''ErrorIconic''] is set to TRUE. Another parameter,
    $cfg[''ReplaceHelpImg''], when set to TRUE, displays a small icon containing a
    question mark at every place where documentation is available for a specific subject.
    These two parameters are set to TRUE by default, thus producing:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_67_0.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'They can be independently set to FALSE. Setting both to FALSE would give:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_68_0.png)


    # Natural sort order for database and table names


    Usually, computers sort items in lexical order, which gives the following results
    for a list of tables:


    ```

    table1

    table10

    table2

    table3

    ```


    phpMyAdmin implements "natural sort order" by default, as specified by $cfg[''NaturalOrder'']
    being TRUE. Thus the database and table lists in left and right panels are sorted
    as:


    ```

    table1

    table2

    table3

    table10

    ```


    # Site-specific header and footer


    Some users may want to display a company logo, a link to the helpdesk, or other
    information on the phpMyAdmin interface. In the main phpMyAdmin directory, for
    this purpose, we can create two scripts—config.header.inc.php and config.footer.inc.php.
    We can put our own PHP or XHTML code in these scripts, and it will appear either
    at the beginning (for header) or end of page (for footer) in case of the following:


    +   - On the cookie login page

    +   - On the right panel


    For example, creating a config.footer.inc.php containing these lines:


    ```

    <hr />

    <em>All the information on this page is confidential.</em>

    ```'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'would produce the intended message on all pages:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_69_0.png)


    # MySQL documentation links


    phpMyAdmin displays links to the MySQL documentation at various places on its
    interface. These links refer to the exact point in the official MySQL documentation
    to learn about a MySQL command. We can customize the location, language, and manual
    type referred to, with the following configuration parameters:


    ```

    $cfg[''MySQLManualBase''] = ''http://www.mysql.com/doc/en'';

    $cfg[''MySQLManualType''] = ''searchable'';

    ```


    You may take a look at http://www.mysql.com/documentation to see the languages
    in which the manual is available, and change the parameters accordingly. For the
    manual type, the most up-to-date possible values are explained as comments in
    config.inc.php. Users who prefer to keep a copy of this documentation on a local
    server would specify a local link here.


    The $cfg[''ReplaceHelpImg''] parameter controls how the links are displayed. Its
    default value of TRUE makes phpMyAdmin display small question-mark icons. However,
    if it has FALSE value, we are shown the Documentation link.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Themes


    A theme system is available in phpMyAdmin starting with version 2.6.0. The color
    parameters and the various icons are located in a directory structure under the
    `themes` subdirectory. For each available theme, there is a subdirectory named
    after the theme. It contains:


    +   - `layout.inc.php` for the theme parameters

    +   - `css` directory with the various CSS scripts

    +   - `img` directory containing the icons

    +   - `screen.png`, a screenshot of this theme


    The downloaded kit contains two themes, and more themes are available at http://phpmyadmin.net/home_page/themes.php.


    # Theme configuration


    In `config.inc.php`, the `$cfg[''ThemePath'']` parameter contains `themes` by
    default, indicating which subdirectory the required structure is located in. This
    could be changed to point to another directory where our company''s specific phpMyAdmin
    themes are located.


    The default chosen theme is specified in `$cfg[''ThemeDefault'']`, and is set
    to `original`. If no theme selection is available for users, this theme will be
    used.


    > The `original` subdirectory should never be deleted; phpMyAdmin relies on it
    for normal operations.


    # Theme selection


    On the Homepage, we can offer a theme selector to users. Setting `$cfg[''ThemeManager'']`
    to TRUE (the default) shows the selector:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_70_0.png)'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'To help choose a suitable theme, the color palette icon next to **Theme/Style**
    brings us screenshots of the available themes. We can then click on **take it**
    under the theme we want. The chosen theme is remembered in a cookie. By default,
    the remembered theme applies to all servers we connect to. To make phpMyAdmin
    remember one theme per MySQL server, we set `$cfg[''ThemePerServer'']` to TRUE.


    # The color picker


    Here is a feature—the custom color picker— that may seem frivolous but has its
    utility. We''ll discuss first the *how* and then the *why*.


    Located on the homepage, the small rainbow icon gives access to a picker, which
    controls the background color of both panels. The phpMyAdmin team merged the MooRainbow
    code from Djamil Legato (http://moorainbow.woolly-sheep.net) to offer this feature.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_71_0.png)


    You can operate the picker in many ways—moving the slider, moving the mouse in
    the big square, or directly entering values in the fields. When you are done,
    you click **Select** to clear the picker.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'The purpose of this feature is to help users who are working simultaneously
    on many MySQL servers, and like to have visual clues about each server. Another
    possible scenario — a busy database administrator — who takes calls from customers
    and opens many phpMyAdmin windows. He then assigns priorities using the color
    picker, say red for top priority — you get the idea.


    # Sliders


    You''ll see on some pages, a small plus sign followed by a controlling label —
    either **Options** or **Details**. A click on the label opens a slider to reveal
    a section of the interface, which is believed to be less often used in day-to-day
    work. As some persons prefer to immediately see the whole interface — at the expense
    of screen space — there is a configuration parameter that controls how the sliders
    are initially set:


    ```

    $cfg[''InitialSlidersState''] = ''closed'';

    ```


    The default value of **closed** means that sliders must be opened by a click on
    the label; you might have guessed that the reverse value is open. This Javascript
    feature comes from the Mootools library located at http://mootools.net.


    # Character sets, collations and language


    A **character set** describes how symbols for a specific language or dialect are
    encoded. A **collation** contains rules to compare and sort the characters of
    a character set. The character set used to store our data may be different from
    the one used to display it, leading to data discrepancies. Thus, a need to transform
    the data arises.


    Since MySQL 4.1.x, the MySQL server does the character recoding work for us. Also,
    MySQL enables us to indicate the character set and collation for each database,
    each table, and even each field. A default character set for a database applies
    to each of its tables, unless it is overridden at the table level. The same principle
    applies to every field.


    # Collations


    When strings have to be compared and sorted, precise rules must be followed by
    the system (MySQL in this case). For example, is "A" equivalent to "a"? Is ''André''
    equivalent to "Andre"? A set of these rules is called a collation.


    A proper choice of collation is important for obtaining the intended results when
    searching data (for example from phpMyAdmin''s **Search** page), and also when
    sorting data.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'For an introduction to collations, see http://dev.mysql.com/doc/mysql/en/Charset-general.htm,
    and for a more technical explanation of the algorithms involved, refer to http://www.unicode.org/reports/tr10/.


    # Unicode and UTF-8


    > Unicode is an industry standard designed to allow text and symbols [...] to
    be consistently represented and manipulated by computers.


    For more information, visit http://en.wikipedia.org/wiki/Unicode and http://www.unicode.org/.


    Unicode currently supports more than 600 languages, which is its main advantage
    over other character sets available with ISO or Windows. This is especially important
    with a multi-language product like phpMyAdmin.


    To represent or encode these Unicode characters, many Unicode Transformation Formats
    (UTF) exist. A popular transformation format is UTF-8, which uses one to four
    octets per character. For more details, visit http://en.wikipedia.org/wiki/UTF-8.


    Note that the browser must support UTF-8 (as most current browsers do). The phpMyAdmin
    distribution kit includes a UTF-8 version of every language file in the lang subdirectory.


    # Language selection


    A Language selector appears on the login panel (if any) and on the homepage. The
    default behavior of phpMyAdmin is to use the language defined in our browser''s
    preferences, if there is a corresponding language file for this version.


    The default language used—in case the program cannot detect one—is defined in
    config.inc.php, in the $cfg[''DefaultLang''] parameter with ''en-utf-8''. This
    value can be changed. The possible values for language names are defined in the
    libraries/select_lang.lib.php script as an array.


    Even if the default language is defined, each user (especially on a multi-user
    installation) can choose his/her preferred language from the selector. The user''s
    choice will be remembered in a cookie whenever possible.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'We can also force a single language by setting the $cfg[''Lang''] parameter
    with a value, such as ''fr-utf-8''. Starting with version 2.7.0, another parameter,
    $cfg[''FilterLanguages''], is available. Suppose we want to shorten the list of
    available languages to English and Français – French, as those are the ones used
    exclusively by our users. This is accomplished building a regular expression indicating
    which languages we want to display based on the ISO 639 codes of these languages.
    To continue with our example, we would use:


    ```

    $cfg[''FilterLanguages''] = ''^(fr|en)'';

    ```


    In this expression, the caret (^) means starting with and the (|) means or. The
    expression indicates that we are restricting the list to languages whose corresponding
    ISO codes start with fr or en.


    By default, this parameter is empty, meaning that no filter is applied to the
    list of available languages.


    The small information icon beside Language gives access to phpMyAdmin''s translator
    page, which lists, by language, the official translator and the contact information.
    This way, we can reach the translator for corrections, or to offer help on untranslated
    messages.


    # Effective character sets and collations


    On the homepage, we can see the MySQL charset information and a MySQL connection
    collation selector. Here is the MySQL charset information:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_74_0.png)


    The character set information (as seen here after MySQL charset) comes directly
    from the $charset variable located in the language file that corresponds to the
    currently selected language. It is used to generate HTML information, which tells
    the browser what is the page''s character set.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'We can also choose which character set and collation will be used for our connection
    to the MySQL server using the MySQL connection collation dialog. This is passed
    to the MySQL server. MySQL then transforms the characters that will be sent to
    our browser into this character set. MySQL also interprets what it receives from
    the browser according to the character set information. Remember that all tables
    and fields have a character set information describing how their data is encoded.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_75_0.png)


    Normally, the default value should work. However, if we are entering some characters
    using a different character set, we can choose the proper character set in this
    dialog.


    The following parameter defines both the default connection collation and character
    set:


    ```

    $cfg[''DefaultConnectionCollation''] = ''utf8_unicode_ci'';

    ```


    # Left panel (navigation)


    The left panel contains the following elements:


    +   - The logo (see the next section)

    +   - The server list (if $cfg[''LeftDisplayServers''] is set to TRUE)

    +   - The Home link or icon (takes you back to the phpMyAdmin homepage)

    +   - A Log out link or icon

    +   - A link or icon leading to the Query window

    +   - Icons to display phpMyAdmin and MySQL documentation

    +   - The databases and tables with statistics about the number of tables per
    database


    If $cfg[''MainPageIconic''] is set to TRUE (the default), we see the icons. However,
    if it is set to FALSE, we see the Home, Log out, and Query window links.


    The left panel can be resized by clicking and moving the vertical separation line
    in the preferred direction to reveal more data, in case the database or table
    names are too long for the default left panel size.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'We can customize the appearance of this panel. Generally, all parameters are
    located in `themes/themename/layout.inc.php` unless stated otherwise. `$cfg[''LeftWidth'']`
    contains the default width of the left frame in pixels. The background color is
    defined in `$cfg[''LeftBgColor'']` with a default value of `''#D0DCE0''`. The
    `$cfg[''LeftPointerColor'']` parameter, with a default value of `''#CCFFCC''`,
    defines the pointer color. (The pointer appears when we are using the Full mode,
    discussed shortly.) To activate the left pointer for any theme being used, a master
    setting, `$cfg[''LeftPointerEnable'']`, exists in `config.inc.php`. Its default
    value is TRUE.


    # Logo configuration


    The logo display behavior is controlled by a number of parameters. First, `$cfg[''LeftDisplayLogo'']`
    has to be set to TRUE, to enable any displaying of the logo. It is true by default.
    A click on this logo brings the interface to the page listed in the `$cfg[''LeftLogoLink'']`
    parameter, which is usually the main phpMyAdmin page (default value `main.php`),
    but can be any URL. Finally, the `$cfg[''LeftLogoLinkWindow'']` parameter indicates
    in which window the new page appears after a click on the logo. By default, it''s
    on the main page (value `main`). However, it could be on a brand new window by
    using the value `new`.


    The logo image itself comes from the `logo_left.png` file, which is located in
    each specific theme directory structure.


    # Database and table list


    The following examples show that no database has been chosen yet:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_76_0.png)'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'It is also possible to see the following screen:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_77_0.png)


    This means that our current MySQL rights do not allow us to see any existing databases.


    > A MySQL server always has at least one database (named **mysql**), but in this
    case, we do not have the right to see it. Moreover, as MySQL 5.0.2, a special
    database called **information_schema** appears at all times in the database list.
    It contains a set of views describing the metadata visible for the logged-in user.


    We may have the right to create one, as explained in Chapter 4.


    # Light mode


    The left panel can be shown in two ways—the Light mode and the Full mode. The
    Light mode is used by default, defined by a TRUE value in $cfg[''LeftFrameLight''].
    This mode shows a drop-down list of the available databases, and only tables of
    the currently chosen database are displayed. It is more efficient than Full Mode;
    the reason is explained in the Full Mode section appearing later in the chapter.
    Here we have chosen the **mysql** database:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_77_1.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Clicking on a name opens the right panel in the **Database** view, and clicking
    on a table name opens the right panel in the **Table** view to browse this table.
    (see the *Right Panel* section for details.)


    # Tree display of database names


    A user might be allowed to work on a single database—for example **marc**.

    Some system administrators offer a more flexible scheme by allowing user **marc**
    to create many databases, provided all have their names starting with **marc**,
    such as **marc_airline** and **marc_car**. In this situation, the left panel can
    be set to display a tree of these database names, like this:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_78_0.png)


    This feature is currently offered only in light mode, and is controlled by these
    parameters:


    ```

    $cfg[''LeftFrameDBTree''] = TRUE;

    $cfg[''LeftFrameDBSeparator''] = ''_'';

    ```


    The default value of TRUE in $cfg[''**LeftFrameDBTree**''] ensures that this feature
    is activated. A popular value for the separator is ''_''.


    # Full mode


    The previous examples were shown in Light mode, but setting the $cfg[''**LeftFrameLight**'']
    parameter to FALSE produces a complete layout of our databases and tables using
    collapsible menus (if supported by the browser):'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_79_0.png)


    The number of tables per database is shown in brackets. The Full mode is not selected
    by default; it can increase network traffic and server load if our current rights
    give us access to a large number of databases and tables. Links must be generated
    in the left panel to enable table access and quick-browse access to every table.
    Also, the server has to count the number of rows for all tables.


    # Table short statistics


    Moving the cursor over a table name displays comments about the table (if any),
    and the number of rows currently in it:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_79_1.png)'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Table quick-access icon


    Starting with version 3.0, it was established that the most common action on a
    table must be to browse it. Therefore, a click on the table name itself opens
    it in browse mode. The small icon beside each table name is a quick way to do
    another action on each table, and by default, it brings us to Structure view.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_80_0.png)


    The $cfg[''LeftDefaultTabTable''] parameter controls this action. It has a default
    value of ''tbl_structure.php'', which is the script showing the table''s structure.
    Other possible values for this parameter are listed in Documentation.html.


    # Nested display of tables within a database


    MySQL''s data structure is based on two levels — databases and tables. This does
    not allow subdivisions of tables per project, a feature often requested by MySQL
    users. They must rely on having multiple databases, but this is not always allowed
    by their provider. To help them with this regard, phpMyAdmin introduces a nested-levels
    feature, based on the table naming.


    Let''s say we have access to the db1 database, and we want to represent two projects,
    marketing and payroll. Using a special separator (by default a double underscore)
    between the project name and the table name, we create the payroll__employees
    and payroll__jobs tables, achieving a visually interesting effect:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_80_1.png)


    This feature is parameterized with $cfg[''LeftFrameTableSeparator''] (set here
    to ''__'') to choose the characters that will mark each level change, and $cfg[''LeftFrameTableLevel'']
    (set here to ''1'') for the number of sub-levels.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '> The nested-level feature is intended only for improving the left panel look.
    The proper way to reference the tables in MySQL statements stays the same – for
    example, db1.payroll__jobs.


    Beginning with phpMyAdmin 2.6.0, a click in the left panel on the project name
    (here payroll) opens this project in the right panel, showing only those tables
    associated with that project.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_81_0.png)


    # Server-list choice


    If we have to manage multiple servers from the same phpMyAdmin window and often
    need to switch between servers, it might prove useful to always have the list
    of servers in the left panel.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_81_1.png)'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'For this, the $cfg[''LeftDisplayServers''] parameter must be set to TRUE. The
    list of servers can have two forms—a drop-down list or links. Which form appears
    depends on $cfg[''DisplayServersList'']. By default, this parameter is set to
    FALSE, so we see a drop-down list of servers. Setting $cfg[''DisplayServersList'']
    to TRUE produces a list of links to all defined servers:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_82_0.png)


    # Handling many databases or tables


    This section describes some techniques to cope with a server holding a huge number
    of databases and tables.


    # Limits on the interface


    Before phpMyAdmin 2.11, it was difficult to work with the interface if we had
    access to hundreds or even thousands of databases, or hundreds of tables in the
    same database. Loading of the navigation panel was slow, or did not work at all.
    In 2.11, the interface has been reworked to take care of this.


    Two new parameters, shown here with their default values, establish a limit on
    the number of databases and tables displayed, by adding a page selector and navigation
    links:


    ```

    $cfg[''MaxDbList''] = 100;

    $cfg[''MaxTableList''] = 250;

    ```


    The effect of $cfg[''MaxDbList''] can be seen on the main panel in Server view:'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_83_0.png)


    We can also see the effect in the navigation panel:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_83_1.png)


    # Improving fetch speed


    Version 3.0 introduced two configuration parameters that have an effect on the
    speed of database names retrieval and table counting. The first one is


    ```

    $cfg[''Servers''][$i][''ShowDatabasesCommand''] = ''SHOW DATABASES'';

    ```


    Every time phpMyAdmin needs to obtain the list of databases from the server, it
    uses the command listed in this parameter. The default command SHOW DATABASES
    is fine in ordinary situations. However, on servers with many databases, speed
    improvements can be observed by trying other commands like one of these:


    ```

    SHOW DATABASES LIKE ''*user#\_%''

    ```


    ```

    SELECT DISTINCT TABLE_SCHEMA FROM information_schema.SCHEMA_PRIVILEGES*

    ```


    ```

    SELECT SCHEMA_NAME FROM information_schema.SCHEMATA

    ```


    In the first example, #user# is replaced by the current username.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'In extreme situations (thousands of databases), a user who installs his own
    copy of phpMyAdmin should put `false` in this parameter. This would block any
    database names fetching, and would require to populate the `$cfg[''Servers''][$i][''only_db'']`
    parameter with this user''s database list.


    Another parameter that can help is `$cfg[''Servers''][$i][''CountTables'']`, which
    has a default value of `true`. Setting it to `false` would instruct phpMyAdmin
    to avoid counting the tables when producing the list of databases and tables in
    the navigation panel (in Full mode).


    # Right panel (main)


    The right panel is the main working area, and all the possible views for it are
    explained in the following sections. Its appearance can be customized. The background
    color is defined in `$cfg[''RightBgColor'']`, and the default color is #F5F5F5.
    We can also select a background image by setting the URI of the image we want
    (for example, http://www.domain.com/images/clouds.jpg) in `$cfg[''RightBgImage'']`.


    # Homepage


    The homepage may contain a varying number of links depending on the login mode
    and the user''s rights. A normal user may see it as:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_84_0.png)'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'The **Home** link from the left panel is used to display this page. It shows
    the phpMyAdmin and MySQL versions, the MySQL server name, and the logged-in user.
    We also see that this user does not have the privileges to create a database.
    We see some links that relate to MySQL or phpMyAdmin itself. The **Log out** link
    might not be there if the user did not log in, as indicated by the configuration
    file''s $cfg[''Servers''][$i][''auth_type''] parameter being set to config.


    In this example, a normal user is allowed to change his/her password from the
    interface. To disallow this password change, we set $cfg[''ShowChgPassword'']
    to FALSE. Privileged users have more options on the homepage. They can always
    create databases and have more links to manage the server as a whole — for example
    the **Privileges** link (more on this in Chapter 18). Another setting, $cfg[''ShowPhpInfo''],
    can be set to TRUE if we want to see the **Show PHP Information** link on the
    homepage.


    # Database view


    phpMyAdmin goes into this view (shown in the screenshot that follows) every time
    we click on a database name from the left frame, or if the USE command followed
    by a database name is typed in a SQL box.


    This is where we can see an overview of the database — the existing tables, a
    link to create a table, the tabs to the Database view subpages, and some special
    operations we might do on this database to generate documentation and statistics.
    There is a checkbox beside each table to make global operations on that table
    (covered in Chapter 10). The table is chosen by using the checkbox or by clicking
    anywhere on the row''s background. We can also see each table''s size, if $cfg[''ShowStats'']
    is set to TRUE. This parameter also controls the display of table-specific statistics
    in the Table view.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Interface Overview


    The initial screen that appears here is the database Structure subpage. We might
    want a different initial subpage to appear while entering the Database view. This
    is controlled by the $cfg[''DefaultTabDatabase''] parameter, and the available
    choices are given in the configuration file as comments.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_86_0.png)


    The number of records is obtained using a quick method, the SHOW TABLE STATUS
    statement— not by using a SELECT COUNT(*) FROM TABLENAME. This quick method is
    usually accurate, except for InnoDB tables, which returns an approximate number
    of records. To help get the correct number of records, even for InnoDB, the $cfg[''MaxExactCount'']
    parameter is available. If the approximate number of records is lower than this
    parameter''s value—by default, 20000—the slower SELECT COUNT(*) method will be
    used.


    > Do not put a value too high for this parameter. You would get correct results,
    but only after waiting for a few minutes, if there are hundreds of thousands of
    records in your InnoDB table.


    A user might be surprised when seeing the term KiB in the Size and Overhead columns.
    phpMyAdmin has adopted the International Electrotechnical Commission (IEC) binary
    prefixes (see http://en.wikipedia.org/wiki/Binary_prefix). The displayed values
    are defined in each language file. Here is the definition for English:


    ```

    $byteUnits = array(''B'', ''KiB'', ''MiB'', ''GiB'', ''TiB'', ''PiB'', ''EiB'');

    ```'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Table view


    This is a commonly used view, giving access to all table-specific subpages. Usually,
    the initial screen is the table''s Structure screen, which shows all fields and
    (under the Details link) the indexes. Note that the header for this screen always
    shows the current database and table names. We also see the comments set for the
    table:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_87_0.png)


    The $cfg[''DefaultTabTable''] parameter defines the initial subpage on the Table
    view. Some users prefer to avoid seeing the structure because in production they
    routinely run saved queries or enter the Search subpage (explained in Chapter
    9).


    # Server view


    This view is entered each time we go back to the homepage. A privileged user will
    of course see more choices in the Server view. The Server view panel was created
    to group together related server management subpages, and enable easy navigation
    between them.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_87_1.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'The default Server page is controlled by the $cfg[''DefaultTabServer''] parameter.
    This parameter defines the initial starting page as well. For multi-user installations,
    it is recommended to keep the default value (main.php), which displays the traditional
    homepage. We could choose to display server statistics instead by changing this
    parameter to server_status.php, or to see the user''s list with server_privileges.php.
    Other possible choices are explained in the configuration file, and the server
    administration pages are explained in Chapter 18.


    # Icons for homepage and menu tabs


    A configuration parameter, $cfg[''MainPageIconic''], controls the appearance of
    icons at various places on the right panel:


    +   - On the homepage

    +   - At top of page when listing the Server, Database, and Table information

    +   - On the menu tabs in Database, Table, and Server views


    This parameter is set to TRUE by default producing, for example:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_88_0.png)


    We can also display menu items without tabs by setting the $cfg[''LightTabs'']
    parameter to true, producing:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_88_1.png)


    # Query window


    It is often convenient to have a distinct window in which we can type and refine
    queries, and which is synchronized with the right panel. This window is called
    the Query window. We can open this window by using the small SQL icon, or the
    Query window link from the left panel''s icons or links zone.


    This link or icon is displayed if $cfg[''QueryFrame''] is set to TRUE. The TRUE
    for $cfg[''QueryFrameJS''] tells phpMyAdmin to open a distinct window and update
    it using JavaScript commands; of course, this only works for a JavaScript-enabled
    browser. If this is set to FALSE, clicking on Query window will only open the
    right panel, and will display the normal SQL subpage.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '> The full usability of the Query window is only achieved with the distinct
    window mode.


    The Query window itself has subpages, and it appears here over the right panel:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_89_0.png)


    We can choose the dimensions (in pixels) of this window with $cfg[''QueryWindowWidth'']
    and $cfg[''QueryWindowHeight'']. Chapter 12 explains the Query window in more
    details, including the available SQL query history features.


    # Summary


    This chapter covers:


    +   - The language selection system

    +   - The purpose of the left and right panels

    +   - The contents of the left panel, including Light mode and Full mode

    +   - The contents of the right panel, with its various views depending on the
    context

    +   - The Query window and the customization of MySQL documentation links


    The next chapter will guide you with simple steps to accomplish with a freshly-installed
    phpMyAdmin—initial table creation, data insertion and retrieval.'
  merge: -1
  img_proc: true
- pgno: 90
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 91
  md: '# 4

    First Steps


    Having seen the overall layout of phpMyAdmin''s panel, we are ready to create
    a database, our first table, insert some data in it, and browse it. These first
    steps are intentionally simple, but they will give you the foundation on which
    more complex operations are achieved later. Moreover, at the end of the chapter,
    we will have at our disposition, the two basic tables on which the remaining of
    the exercises are based.


    # Database creation


    Before creating a table, we must ensure that we have a database for which the
    MySQL server''s administrator has given us the CREATE privilege. Various possibilities
    exist:


    +   - The administrator has already created a database for us, and we see its
    name in the left panel; we don''t have the right to create an additional database

    +   - We have the right to create databases from phpMyAdmin

    +   - We are on a shared host, and the host provider has installed a general Web
    interface (for example, Cpanel) to create MySQL databases and accounts


    Note that a configuration parameter, $cfg[''ShowCreateDb''], controls the display
    of the Create new database dialog. By default, it is set to true, which shows
    this dialog.


    # No privileges?


    If you do not have the privilege to create a database, the homepage displays a
    No privileges message under the Create new database label. This means that you
    must work with the databases already created for you, or ask the MySQL server''s
    administrator to give you the necessary CREATE privilege.


    > If you are the MySQL server''s administrator, refer to Chapter 18.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# First database creation is authorized


    If phpMyAdmin detects that we have the right to create a database, the homepage
    appears as shown in the following figure:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_92_0.png)


    In the input field, a suggested database name appears if the $cfg[''SuggestDBName'']
    parameter is set to TRUE – which is the default setting. The suggested database
    name is built according to the privileges we possess.


    If we are restricted to the use of a prefix, the prefix might be suggested in
    the input field. (A popular choice for this prefix is the username.) Note that,
    in this case, the prefix is followed by an ellipsis mark. We should remove this
    ellipsis mark and complete the input field with an appropriate name.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_92_1.png)


    The Collation choice can be left unchanged for now; but with this dialog, we could
    pick a default character set and collation for this database. This setting can
    be changed later (see Chapter 10 for more explanation on this).


    We will assume here that we have the right to create a database named marc_book.
    We enter marc_book in the input field and click on Create. Once the database is
    created, we will see the following screen:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_92_2.png)'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Notice the following:


    +   - The main title of the right panel has changed to reflect the fact that we
    are now located in this database.

    +   - A confirmation message regarding the creation is displayed.

    +   - The left panel has been updated; we see **marc_book (0)**. Here, the name
    indicates that the **marc_book** database has been created, and the number **0**
    indicates that it contains no tables.

    +   - By default, the SQL query sent to the server by phpMyAdmin to create the
    database is displayed in color.


    > phpMyAdmin displays the query it generated, because $cfg[''ShowSQL''] is set
    to TRUE. Looking at the generated queries can be a good way of learning SQL.


    As the generated queries could be large and take much on screen room, the $cfg[''MaxCharactersInDisplayedSQL'']
    acts as a limit. Its default value of 1000 should be a good balance between seeing
    too few and seeing too much of the queries, especially when doing large imports.


    It is important to examine the phpMyAdmin feedback to ascertain the validity of
    the operations we make through the interface. This way, we can detect errors like
    typos in the names, or creation of a table in the wrong database.


    # Creating our first table


    Now that we have a new database, it''s time to create a table in it. The example
    table we will use is a table named **book**.


    # Choosing the fields


    Before creating a table, we should plan the information we want to store. This
    is usually done during database design. In our case, a simple analysis leads us
    to the following book related data we want to keep:


    +   - **International Standard Book Number (ISBN)**

    +   - Title

    +   - Number of pages

    +   - Author identification'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'For now, it is not important to have the complete list of fields (or columns)
    for our **book** table. We will modify it by prototyping the application and refine
    it later. At the end of the chapter, we will add a second table, **author**, containing
    information about each author.


    # Table creation


    We have chosen our table name and we know the number of fields. We enter this
    information in the **Create new table** dialog and click **Go** to start creating
    the table:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_94_0.png)


    We then see a panel specifying field information. As we asked for four fields,
    we get four rows. Each row refers to information specific to one field. The following
    image represents the left side for this panel:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_94_1.png)'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'And the next one represents the right side.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_95_0.png)


    > On pre-4.1 MySQL versions, the Collation and Comments columns might not be shown
    at this point. Please refer to Chapter 3, for collation issues, and to Chapter
    11, for column commenting.


    The MySQL documentation explains valid characters for the table and field names
    (if we search for Legal names). This may vary depending on the MySQL version.
    Usually, any character that is allowed in a file name (except the dot and the
    slash) is acceptable in a table name, and the length of the name must not exceed
    64 characters. The 64-character limit exists for field names as well, but we can
    use any character.


    We enter our field names under the Field column. Each field has a type, and the
    most commonly used types are located at the beginning of the drop-down list.'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'The **VARCHAR** (variable character) type is widely used when the field content
    is alphanumeric, because the contents will occupy only the space needed for it.
    This type requires a maximum length, which we specify. If we forget to do so,
    a small pop-up message reminds us later when we save. For the page count and the
    author identification, we have chosen **INT** type (integer), as depicted in the
    following screenshot:


    | Field | Type | Length/Values |

    |---|---|---|

    | isbn | VARCHAR | 25 |

    | title | VARCHAR | 100 |

    | page_count | INT |  |

    | author_id | INT |  |


    There are other attributes for fields, but we will leave them empty in this example.
    You might notice the **Add 1 Field(s)** dialog at the bottom of the screen. We
    can use it to add some fields to this table creation panel by entering the appropriate
    value and hitting **Go**. The number of rows would change according to the new
    number of fields, leaving intact the information already entered about the first
    four fields. Before saving the page, let''s define some keys.


    # Choosing keys


    A table should normally have a primary key (a field with unique content that represents
    each row). Having a primary key is recommended for row identification, better
    performance, and possible cross-table relations. A good value here is the ISBN;
    so, in the **Index** dialog we select **PRIMARY** for the **isbn** field. Other
    possibilities for index type include **INDEX**, **UNIQUE**, and **FULLTEXT** (more
    on this in Chapter 6).


    > Index management (also referred to as Key management) can be done at initial
    table creation, or later in the **Structure** subpage of Table view.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'To improve the speed of the queries that we will make by author ID, we should
    add an index on this field. The right part of our screen now looks like this:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_97_0.png)


    At this point, we could pick a different Storage Engine from the corresponding
    drop-down menu. However, for time being, we will just accept the default storage
    engine.


    Now we are ready to create the table by clicking on Save. If all goes well, the
    next screen confirms that the table has been created; we are now in the Structure
    subpage of Table view.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_97_1.png)


    Should we forget to specify a value in the Length column for a CHAR or VARCHAR,
    phpMyAdmin would remind us before trying to create the table.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Of the various tabs leading to other subpages, some are not active, because
    it would not make sense to browse or search a table if there are no rows in it.
    However, it would be acceptable to export a table, as we can export a table''s
    structure even if it contains no data.


    # Manual data insertion


    Now that we have a table, let''s put some data in it manually. Before we do that,
    here are some useful references on data manipulation within this book:


    +   - Chapter 5 explains how to change data

    +   - Chapter 8 explains how to import data from existing files

    +   - Chapter 10 explains how to copy data from other tables

    +   - Chapter 11 explains the relational system (in our case, we will want to
    link to the author table)


    For now, click on the Insert link, which will lead us to the data-entry (or edit)
    panel. This screen has room to enter information for two rows, that is, two books
    in our example. This is because the default value of $cfg[''InsertRows''] is 2.
    In the lower part of the screen, the dialog Restart insertion with 2 rows can
    be used if the default number of rows does not suit our needs. But beware, any
    data already on screen would be lost. By default, the Ignore checkbox is ticked,
    which means that the second group of fields will be ignored. But as soon as we
    enter some information in one field of this group and exit the field, the Ignore
    box is unchecked.


    We can enter the following sample information for two books:


    +   - ISBN: 1-234567-89-0, title: A hundred years of cinema (volume 1), 600 pages,
    author ID: 1

    +   - ISBN: 1-234567-22-0, title: Future souvenirs, 200 pages, author ID: 2


    We start by entering data for the first and the second rows. The Value column
    width obeys the maximum length for the character fields. For this example, we
    keep the lower drop-down selector to its default value of Insert as new row. We
    then click on Go to insert the data. There is a Go button after each set of columns
    that represent a row, and another one on the lower part of the screen. All these
    have the same effect of saving the entered data.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_99_0.png)


    If our intention had been to enter data for more books after these two, we would
    have selected **Insert another new row** from the first drop-down before clicking
    on **Go**.


    # Data entry panel tuning for CHAR and VARCHAR


    By default, phpMyAdmin displays an input field on a single line for the field
    types, CHAR and VARCHAR. This is controlled by setting $cfg[''CharEditing''] to
    ''input''. Sometimes, we may want to insert line breaks (new lines) within the
    field. (This insertion might be done manually with the Enter key, or by copying
    and pasting lines of text from another on screen source.) This can be done by
    changing $cfg[''CharEditing''] to ''textarea''. This is a global setting, and
    will apply to all the fields of all the tables, for all users of this copy of
    phpMyAdmin.


    We can tune the number of columns and rows of this text area with:


    ```

    $cfg[''CharTextareaCols'']   = 40;

    $cfg[''CharTextareaRows'']   = 2;

    ```'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Here, 2 for $cfg[''CharTextareaRows''] means that we should be able to see
    at least two lines before the browser starts to display a vertical scroll bar.
    These settings apply to all CHAR and VARCHAR fields. Applying those settings would
    generate a different Insert screen as follows:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_100_0.png)


    > With this entry mode, the maximum length of each field no longer applies visually.
    It would be enforced by MySQL at insert time.


    # Browse mode


    There are many ways to enter this mode. In fact, it is used each time the query
    results are displayed. We can enter this mode by clicking on the table name on
    the navigation panel, or by clicking Browse when we are in Table view for a specific
    table.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_100_1.png)'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# SQL query links


    In the Browse results, the first part displayed is the query itself, along with
    a few links. The displayed links may vary depending on our actions and some configuration
    parameters.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_101_0.png)


    The Profiling checkbox will be covered in Chapter 17.


    The Edit link appears if $cfg[''SQLQuery''][''Edit''] is set to TRUE. Its purpose
    is to open the Query window, so that you can edit this query (see Chapter 12 for
    more details).


    Explain SQL is displayed if $cfg[''SQLQuery''][''Explain''] is set to TRUE. We
    will see in Chapter 6, what this link can be used for.


    The Create PHP Code link can be clicked to reformat the query to the syntax expected
    in a PHP script. It can then be copied and pasted directly at the place where
    we need the query in the PHP script we are working on. Note that after a click,
    this link changes to Without PHP Code, which would bring back the normal query
    display. This link is available if $cfg[''SQLQuery''][''ShowAsPHP''] is set to
    TRUE.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_101_1.png)


    Refresh is used to execute the same query again. The results might change, as
    a MySQL server is a multi-user server, and other users might be modifying the
    same tables. This link is shown if $cfg[''SQLQuery''][''Refresh''] is set to TRUE.


    All these four parameters have a default value of TRUE in config.inc.php.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Navigation bar


    This bar is displayed at the top of results and also at the bottom. Column headers
    can be repeated at certain intervals among results depending on the value entered
    in repeat headers after....


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_102_0.png)


    The bar enables us to navigate from page to page, displaying an arbitrary number
    of records (or rows), starting at some point in the results. As we entered browse
    mode by clicking Browse, the underlying query that generated the results includes
    the whole table. However, this is not always the case.


    Notice that we are positioned at record number 0, and are seeing records in horizontal
    mode.


    The default display mode is ''horizontal'', as defined in $cfg[''DefaultDisplay''].
    We can also set this to ''vertical'' if we usually prefer this mode. Even if our
    preferred mode is set in this configuration parameter, we can always use the Show
    dialog to change it on the fly.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_102_1.png)'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Another possibility is the ''horizontalflipped'' choice, which rotates the
    column headers by 90 degrees. If we try this choice, another parameter, $cfg[''HeaderFlipType''],
    plays a role. Its default value, css, displays true rotated headers. Not every
    browser supports this; however, Internet Explorer 7 does support this feature
    and produces:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_103_0.png)


    On other browsers, it seems the best we can achieve is by setting $cfg[''HeaderFlipType'']
    to fake.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_103_1.png)


    We are currently using a table containing a small number of rows. With larger
    tables, we could see a more complete set of navigation buttons. To simulate this,
    let''s use the Show dialog to change the default number of rows from 30 to 1;
    we then click Show. We can see that the navigation bar adapts itself:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_103_2.png)'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'This time, there are buttons labeled <<, <, >, and >> for easy access to the
    first page, previous page, next page, and the last page of the results respectively.
    The buttons appear only when necessary; for example, the first page button is
    not displayed if we already are on the first page. These symbols are displayed
    in this manner, as the default setting of $cfg[''NavigationBarIconic''] is TRUE.
    A FALSE here would produce a different set of labels.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_104_0.png)


    There is also a Page number drop-down menu, to go directly to one of the pages
    located near the current page. As there can be hundreds or thousands of pages,
    this menu is kept small, with only a few page numbers before and after the current
    page.


    By design, phpMyAdmin always tries to give quick results, and one way to achieve
    this result is to add a LIMIT clause in SELECT. If a LIMIT clause is already there
    in the original query, phpMyAdmin will respect it. The default limit is 30 rows,
    set in $cfg[''MaxRows'']. The multiple users on the server help keep the server
    load to a minimum.


    Another button is available on the navigation bar, but must be activated by setting
    $cfg[''ShowAll''] to TRUE. It would be very tempting for users to use this button
    often. Hence, on a multi-user installation of phpMyAdmin, it is recommended that
    the button be disabled (FALSE). When enabled, the navigation bar is augmented
    with a Show all button. Clicking on this button retrieves all the rows of the
    current results set, which might hit the execution time limit in PHP or a memory
    limit in the server or browser.


    > If we enter a big number in the Show...rows dialog, the same results will be
    achieved (and we may face the same problems).


    # Query results operations


    A section labeled Query results operations is located under the results. It contains
    links to print the results (with or without the FULL TEXT columns), to export
    these results (see Exporting Partial Query Results section in Chapter 7), or to
    create a view from this query (more on this in Chapter 17).'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Sorting results


    In SQL, we can never be sure of the order in which the data is retrieved, unless
    we explicitly sort the data. Some implementations of the retrieving engine may
    show results in the same order as the one in which data was entered, or according
    to a primary key. However, a sure way to get results in the order we want is by
    sorting them explicitly.


    When browsing results are displayed, any column header can be clicked to sort
    on this column, even if it is not part of an index. Let''s click on the **author_id**
    column header.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_105_0.png)


    We can confirm that the sorting has occurred, by watching the SQL query at the
    top of screen; it contains an **ORDER BY** clause.


    We now see a small red triangle pointing upwards beside the **author_id** header.
    This means that the current sort order is ''ascending''. Moving the mouse cursor
    over the **author_id** header makes the red triangle change direction, to indicate
    what will happen if we click on the header — a sort by descending **author_id**.


    Another way to sort is by key. The Sort dialog shows all the keys already defined.
    Here we see a key named **PRIMARY** — the name given to our primary key on the
    **isbn** field when we checked **Primary** for this field at creation time:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_105_1.png)


    This might be the only way to sort on multiple fields at once (for multi-fields
    indexes).


    The default initial sort order is defined in `$cfg[''Order'']` with ASC for ascending,
    DESC for descending. The sort order can also be or SMART, which means that fields
    of type DATE, TIME, DATETIME, and TIMESTAMP would be sorted in descending order,
    whereas other field types will be sorted in ascending order.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Headwords


    Because we can change the number of records displayed on a page, it is quite possible
    that we do not see the whole data. In this case, it would help to see headwords
    — indications about the first and last row of displayed data. This way, you can
    click **Next** or **Previous** without scrolling to the bottom of the window.


    However, which column should phpMyAdmin base his headwords generation on? A simple
    assumption has been made: if you click on a column''s header to indicate your
    intention of sorting on this column, phpMyAdmin uses this column''s data as a
    headword. For our current book table, we do not have enough data to clearly notice
    the benefits of this technique. However, we can nonetheless see that after a sort,
    the top part of the screen now contains this message:


    ```

    Showing rows 0 - 1 (2 total, Query took 0.0006 sec) [author_id: 1 - 2]

    ```


    Here, the message between square brackets means that **author_id** number **1**
    is on the first displayed row and number **2** is on the last one.


    # Color-marking rows


    When moving the mouse between rows, the row background color may change to the
    color defined in $cfg[''BrowsePointerColor'']. This parameter can be found in
    themes/themename/layout.inc.php. To enable this, browse pointer for all themes
    — $cfg[''BrowsePointerEnable''] — must be set to TRUE (the default) in config.inc.php.


    It may be interesting to visually mark some rows to highlight their importance
    for personal comparison of data, or when showing data to people. Highlighting
    is done by clicking the row. Clicking again removes the mark on the row. The chosen
    color is defined by $cfg[''BrowseMarkerColor''] (see themes/themename/layout.inc.php).
    This feature must be enabled by setting $cfg[''BrowseMarkerEnable''] to TRUE,
    this time in config.inc.php. This sets the feature for all the themes. We can
    mark more than one row. Marking the row also activates the checkbox for this row.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_106_0.png)'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Limiting the length of each column


    In the previous examples, we always saw the full contents of each column, as each
    column had the number of characters within the limit defined by $cfg[''LimitChars''].
    This is a limit enforced on all non-numeric fields. If this limit was lower (say
    10), the display would be as follows:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_107_0.png)


    This would help us see more columns at the same time (at the expense of seeing
    less of each column).


    # Display options


    In order to see the full texts, we will now make use of the Options slider, which
    reveals some display options. The option that concerns us at the moment is the
    Partial Texts/Full Texts pair; we can choose Full Texts to see all of the text
    that was truncated. Even if we elect not to change the $cfg[''LimitChars''] parameter,
    there will be a time when asking for full texts will be useful (when we work with
    TEXT field type—more on this in Chapter 6).


    # Browsing distinct values


    There is a quick way to display all distinct values and the number of occurrences
    for each value for each field. This feature is available on the Structure page.
    For example, we want to know how many different authors we have in our book table
    and how many books each one wrote. On the line describing the field we want to
    browse (here author_id) we click the Browse distinct values icon or link.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_107_1.png)'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'We have a limited test set, but can nonetheless see the results.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_108_0.png)


    # Browse-mode customization


    Following are additional more parameters that control the appearance of results.

    These parameters—except $cfg[''RepeatCells'']—are located in themes/themename/layout.inc.php.


    +   - $cfg[''Border'']: The HTML tables used to present results have no border
    by default because this parameter is set to 0; we can put a higher number (for
    example 1 or 2) to add borders to the tables

    +   - $cfg[''ThBgcolor'']: The tables mentioned have headers with #D3DCE3 as the
    default background color

    +   - $cfg[''BgcolorOne''], $cfg[''BgcolorTwo'']: When displaying rows of results,
    two background colors are used alternately; by default, those are #CCCCCC and
    #DDDDDD.

    +   - $cfg[''RepeatCells'']: When many rows of data are displayed, we may lose
    track of the meaning of each column. By default, at each 100th cell, the column
    headers are displayed'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Creating an additional table


    In our (simple) design, we know that we need another table—the author table. The
    author table will contain:


    +   - Author identification

    +   - Full name

    +   - Phone number


    To create this table, we must go back to the Database view. We click on marc_book
    in the navigation panel, and request the creation of another table with three
    fields as indicated in the following screenshot:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_109_0.png)


    Using the same techniques used when creating the first table, we type this in:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_109_1.png)


    As we have three fields or less, the display is now in vertical mode (see the
    Vertical Mode section in Chapter 6 for more details).'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'The field name **id**, which is our primary key in this new table, relates
    to the **author_id** field from the book table. After saving the table structure,
    we enter some data for authors 1 and 2. Use your imagination for this!


    # Summary


    This chapter explains how to create a database and tables, and how to enter data
    manually in the tables. It also covers how to confirm the presence of data by
    using the browse mode, which includes the SQL query links, navigation bar, sorting
    options, and row marking.


    The next chapter explains how to edit data rows and covers the various aspects
    of deletion of rows, tables, and databases.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 5

    Changing Data


    Data is not static, it changes often. This chapter focuses on editing and deleting
    data and its supporting structures – tables and databases.


    # Edit mode


    When we browse a table or view results from a search on any single-table query,
    small icons appear on the left or right of each table row as shown in the following
    screenshot:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_111_0.png)


    The row can be edited with the pencil-shaped icon and deleted with the X-shaped
    icon. The exact form and location of these controls are governed by:


    ```

    $cfg[''PropertiesIconic''] = TRUE;

    $cfg[''ModifyDeleteAtLeft''] = TRUE;

    $cfg[''ModifyDeleteAtRight''] = FALSE;

    ```


    We can decide whether to display them on the left side, the right side, or on
    both sides. The $cfg[''PropertiesIconic''] parameter can have the values TRUE,
    FALSE, or both. TRUE displays icons as seen in the previous image, FALSE displays
    Edit and Delete (or their translated equivalent) as links, and both displays the
    icon and the text.


    The small checkbox beside each row is explained in the Multi-Row Edit and the
    Deleting Many Rows sections later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Clicking on the Edit icon or link brings the following panel, which is similar
    to the data entry panel (except for the lower part):


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_112_0.png)


    In this panel, we can change data by typing directly (or by cutting and pasting
    via the normal operating system mechanisms). We can also revert to the original
    contents using the Reset button.


    By default, the lower drop-down menus are set to Save (so that we make changes
    to this row) and Go back to previous page (so that we can continue editing another
    row on the previous results page). We might want to stay on the current page after
    clicking Go—in order to save and then continue editing—we can choose Go back to
    this page. If we want to insert yet another new row after saving the current row,
    we just have to choose Insert another new row before saving. The Insert as new
    row choice—below the Save choice—is explained in the Duplicating Rows of Data
    section later in this chapter.


    # Moving to next field with the tab key


    People who prefer to use the keyboard can use the Tab key to go to the next field.
    Normally, the cursor goes from left to right and from top to bottom, so it would
    travel into the fields in the Function column (more on this in a moment). However,
    to ease data navigation in phpMyAdmin, the normal order of navigation has been
    altered. The Tab key first goes through each field in the Value column, and then
    through each one in the Function column.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Moving with arrows


    Another way of moving between fields is with the Ctrl+arrows keys. This method
    might be easier than using the Tab key when many fields are on screen. For this
    to work, the $cfg[''CtrlArrowsMoving''] parameter must be set to true, which is
    the default value.


    > On a Mac OS X 10.5 with Spaces enabled, Ctrl+arrows are the default shortcut
    to switch between virtual desktops; so this technique cannot be used for moving
    between fields.


    # Handling NULL values


    If the table''s structure permits a NULL value inside a field, a small checkbox
    appears in the field''s Null column. Checking it puts a NULL value in the field.
    A special mechanism has also been added to phpMyAdmin to ensure that, if data
    is typed into the Value column for this field, the Null checkbox is cleared automatically.
    (This is possible in JavaScript-enabled browsers.)


    Here, we have modified the structure of the phone field in the author table, to
    permit a NULL value (refer Editing field attributes section in Chapter 6). The
    Null checkbox is not checked here:


    | Field | Type | Function | Null | Value |

    |---|---|---|---|---|

    | id | int(11) |  |  | 1 |

    | name | varchar(30) |  |  | John Smith |

    | phone | varchar(30) |  | ☐ | +01 445 789-1234 |

    |  |  |  |  | Go |


    The data is erased after checking the Null box, as shown in the following screenshot:


    | Field | Type | Function | Null | Value |

    |---|---|---|---|---|

    | id | int(11) |  |  | 1 |

    | name | varchar(30) |  |  | John Smith |

    | phone | varchar(30) |  | ☑ |  |

    |  |  |  |  | Go |


    The Edit panel will appear this way if this row is ever brought on screen again.'
  merge: -1
  img_proc: true
- pgno: 114
  md: "# Applying a function to a value\n\nThe MySQL language offers some functions\
    \ that we may apply to data before saving. Some of these functions appear in a\
    \ drop-down menu beside each field, if $cfg['ShowFunctionFields'] is set to TRUE.\n\
    \nThe function list is defined in the $cfg['Functions'] array. The most commonly\
    \ used functions for a certain data type are displayed first in the list. Some\
    \ restrictions are defined in the $cfg['RestrictColumnTypes'] and $cfg['RestrictFunctions']\
    \ arrays, to control which functions are displayed first.\n\nHere are the definitions\
    \ that restrict the function names to be displayed for the VARCHAR type:\n\n```\n\
    $cfg['RestrictColumnTypes'] = array(\n    'VARCHAR'     => 'FUNC_CHAR',  [...]\
    \ \n\n$cfg['RestrictFunctions'] = array(\n    'FUNC_CHAR'  => array(\n       \
    \ 'ASCII',\n        'CHAR',\n        'SOUNDEX',\n        'LCASE',\n        'UCASE',\n\
    \        'PASSWORD',\n        'OLD_PASSWORD',\n        'MD5',\n        'SHA1',\n\
    \        'ENCRYPT',\n        'COMPRESS',\n        'UNCOMPRESS',\n        'LAST_INSERT_ID',\n\
    \        'USER',\n        'CONCAT'\n    ), [...]\n```\n\nAs depicted in the following\
    \ screenshot, we apply the UPPER function to the title when saving this row:\n\
    \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_114_0.png)"
  merge: -1
  img_proc: true
- pgno: 115
  md: 'To gain some screen space (to be able to see more of the data), this feature
    may be disabled by setting $cfg[''ShowFunctionFields''] to FALSE. Moreover, the
    Function column header is clickable, so we can disable this feature on the fly.


    When the feature is disabled — either by clicking or via the configuration parameter
    — a Show: Function link appears in order to display this Function column with
    a single click.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_115_0.png)


    # Duplicating rows of data


    During the course of data maintenance (for permanent duplication or for test purposes),
    we often have to generate a copy of a row. If this is done in the same table,
    we must respect the rules of key uniqueness.


    An example is in order here. Our author has written Volume 2 of his book about
    cinema. Hence, the fields that need a slight change are the ISBN, title, and page
    count. We bring the existing row on screen, change these three fields, and choose
    Insert as new row, as shown in the following screenshot:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_115_1.png)'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'When we click Go, another row is created with the modified information, leaving
    the original row unchanged:


    |  | isbn | title | page_count | author_id |

    |---|---|---|---|---|

    | ☐ ✏️ ❌ | 1-234567-89-0 | A hundred years of cinema (volume 1) | 600 | 1 |

    | ☐ ✏️ ❌ | 1-234567-22-0 | Future souvenirs | 200 | 2 |

    | ☐ ✏️ ❌ | 1-234567-90-0 | A hundred years of cinema (volume 2) | 602 | 1 |


    # Multi-row editing


    The multi-row edit feature enables us to use checkboxes on the rows we want to
    edit, and use the Edit link (or the pencil-shaped icon) in the With selected menu.
    The Check All / Uncheck All links can also be used to quickly check or uncheck
    all the boxes. We can also click anywhere on the row''s data to activate the corresponding
    checkbox.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_116_0.png)


    This brings up an Edit panel containing all the chosen rows. The editing process
    may continue while the data from these rows is seen, compared, and changed.


    > When we mark some rows with the checkboxes, we can also perform two other actions
    on them—delete (see the Deleting Many Rows section in this chapter) and export
    (see Chapter 7).


    # Editing the next row


    Sequential editing is possible on tables that have a primary key on an integer
    field. Our author table meets the criteria. Let''s see what happens when we start
    editing the row having the id value 1:'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_117_0.png)


    The editing panel appears, and we can edit author number 1. However, in the drop-down
    menu, the Edit next row choice is available. If chosen, the next author—the first
    one whose primary key value is greater than the current primary key value —will
    be available for edit.


    # Deleting data


    phpMyAdmin''s interface enables us to delete the following:


    +   - Single rows of data

    +   - Multiple rows of a table

    +   - All the rows in a table

    +   - All the rows in multiple tables


    # Deleting a single row


    We can use the small X-shaped icon beside each row to delete the row. If the value
    of $cfg[''Confirm''] is set to TRUE, every MySQL DELETE statement has to be confirmed
    before execution. This is the default, since it might not be prudent to allow
    a row to be deleted with just one click!'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'The form of the confirmation varies depending on the browser''s ability to
    execute JavaScript. A JavaScript-based confirmation pop up would look like the
    following screenshot:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_118_0.png)


    If JavaScript has been disabled in our browser, a distinct panel appears.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_118_1.png)


    The actual DELETE statement will use whatever information is needed to ensure
    the deletion of only the intended row. In our case, a primary key had been defined
    and was used in the WHERE clause. In the absence of a primary key, a longer WHERE
    clause will be generated based on the value of each field. The generated WHERE
    clause might even prevent the correct execution of the DELETE operation, especially
    if there are TEXT or BLOB fields. This is because the HTTP transaction, used to
    send the query to the web server, may be limited in length by the browser or the
    server. This is another reason why defining a primary key is strongly recommended.


    # Deleting many rows


    A feature added to phpMyAdmin in version 2.5.4 is the multi-row delete. Let''s
    say we examine a page of rows and decide that some rows have to be destroyed.
    Instead of deleting them one-by-one with the Delete link or icon—and because sometimes
    the decision to delete must be made while examining a group of rows—there are
    checkboxes beside rows in Table view mode:'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/cb8c75b631b4e1f7afe5a0d39becfda9_119_0.png)


    These are used with the With selected X-shaped icon. A confirmation screen appears
    listing all the rows that are about to be deleted. It is also possible to click
    anywhere on the row''s data to activate the corresponding checkbox.


    # Deleting all the rows in a table


    To completely erase all the rows in a table (leaving its structure intact), we
    go to the Database view and click on the database name in the left panel. We then
    click on the trash can icon located on the same line as the table we want to empty:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_119_1.png)


    We get a message confirming the TRUNCATE statement (the MySQL statement used to
    quickly empty a table). For our exercise, we won''t delete this precious data!


    Emptying a table can also be done in Table view with the Empty link located on
    the top menu:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_119_2.png)


    > Deleting data, either row-by-row or by emptying a table, is a permanent action.
    No recovery is then possible except by using a backup.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Deleting all rows in many tables


    The first screenshot under the previous section, shows a checkbox to the left
    of each table name. We can choose some tables. Then, in the With selected menu,
    choose the Empty operation as shown in the following screen:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_120_0.png)


    Of course, this decision must not be taken lightly!


    # Deleting tables


    Deleting a table erases the data and the table''s structure. We can delete tables
    using the Drop link in Table view:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_120_1.png)


    In the Database view, we can delete a specific table by using the X-shaped icon
    for that table. The same mechanism also exists for deleting more than one table
    (with the drop-down menu and the Drop action).


    > The Empty and Drop actions are marked in red, to better indicate the inherent
    danger of these actions on data.


    # Deleting databases


    We can delete an entire database (including all its tables) using the Drop link
    in Database view.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_120_2.png)'
