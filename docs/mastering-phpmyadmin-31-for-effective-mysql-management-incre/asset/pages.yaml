- pgno: 314
  md: '# Server variables


    The Variables subpage displays various settings of the MySQL server, which can
    be defined in, say, the my.cnf MySQL configuration file. These values can''t be
    changed from within phpMyAdmin.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_314_0.png)


    # Server processes


    The Processes subpage is available to superusers and normal users. A normal user
    would see only the processes belonging to him/her, whereas a superuser sees all
    the processes.


    This page lists all active processes on the server. There is a Kill link that
    allows us to terminate a specific process.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_314_1.png)


    This example has only one running process—the one created by the SHOW PROCESSLIST
    command itself. This process is not killable because it is no longer running when
    we get to see the page. We would normally see more processes running on a server.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Storage engines


    Information about the various storage engines is available on a two-level format.
    First, the Engines tab displays an overview of the possible engines for the current
    MySQL version. The names of the engines that are enabled on this server are clickable.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_315_0.png)


    A click on one engine name brings a detailed panel about its settings. Moving
    the mouse over the numbers in superscript reveals even more information about
    a particular setting.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_315_1.png)'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Available character sets and collations


    The **Charsets** menu tab on the homepage opens the Server view for the **Charsets**
    subpage, which lists the character sets and collations supported by the MySQL
    server. The default collation for each character set is shown with a different
    background color (using the row-marking color defined in `$cfg[''BrowseMarkerColor'']`).


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_316_0.png)


    # The binary log


    If MySQL''s binary log is active on our server, the menu in the Server view changes
    so that a **Binary log** tab appears. This tab gives access to an interface through
    the `SHOW BINLOG EVENTS` command. This command produces the list of SQL statements
    that have updated data on our servers. This list could be huge, and currently
    phpMyAdmin does not limit its display with a pagination technique. Hence, we could
    hit the browser''s memory limits, which depend on the particular browser we are
    using.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'In the following screen, we choose the binary log that we want to examine (unless
    the server has only one binary log), and the statements are then displayed.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_317_0.png)


    # Summary


    This chapter covers various features available to system administrators, such
    as user account management, privileges management, database privileges checks,
    and server status verification. Appropriate knowledge of the MySQL privileges
    system is crucial to maintain a MySQL server adequately, and this chapter proposes
    exercises centered around the notion of a user and his/her privileges. Next is
    the Appendix A, which tells the history of the phpMyAdmin project.'
  merge: -1
  img_proc: true
