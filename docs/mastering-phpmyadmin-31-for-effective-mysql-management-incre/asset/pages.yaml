- pgno: 250
  md: '# Executing bookmarks by browsing the pma_bookmark table


    This feature is available only to users who can directly see the pma_bookmark
    table. This is the default name given when the linked-tables infrastructure is
    installed. In a multi-user installation, this table is usually located in a database
    invisible to unprivileged users. Browsing this table displays a new Execute bookmarked
    query button, which triggers the execution of the query:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_250_0.png)


    We can now click the pencil icon to open the Edit page for a specific row to see
    the query''s complete text.


    # Summary


    In this chapter, we get an overview of how to record bookmarks (after or before
    sending a query), how to manipulate them, and how some bookmarks can be made public.
    The chapter also introduced us to the default initial query for Browse mode. It
    also covers passing parameters to bookmarks and executing bookmarks directly from
    the pma_bookmark table. The next chapter will explain how to produce documentation
    that explains the structure of your databases via the tools offered by phpMyAdmin.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 15

    System Documentation


    Producing and maintaining good documentation about data structure is crucial for
    a project''s success, especially when it''s a team project. Indeed, being able
    to show the current data dictionary and proposed column changes to the other team
    members provides a valuable means of communication. Moreover, a graphical display
    of the inter-table relations quickly demonstrates the inner workings of the database.
    Fortunately, phpMyAdmin has features that take care of this.


    # Structure reports


    From the Structure subpage of either the Database or the Table view, the Print
    view link is available to produce reports about our database''s structure. Moreover,
    a Data Dictionary link in Database view produces a different report. These are
    detailed in the following sections. In the next major section, the visual relational
    schema in PDF is explained.


    # Using print view


    When phpMyAdmin generates results, there is always a Print view link that can
    be used to generate a printable report of the data. The Print view feature can
    also be used to produce basic structure documentation. This is done in two steps.
    The first click on Print view puts a report on the screen, with a Print button
    at the end of the page. This Print button generates a report formatted for the
    printer.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# The database print view


    Clicking Print view on the Structure subpage for a database generates a list of
    tables. This list contains the number of records, storage engine, size, comments,
    the dates of creation, and the last update for each table.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_252_0.png)


    # The selective database print view


    Sometimes, we prefer to get a report only for certain tables. This can be done
    from the Structure subpage for a database by selecting the tables we want, and
    choosing Print view from the drop-down menu.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_252_1.png)


    # The table print view


    There is also a Print view link on the Structure subpage for each table. Clicking
    this produces information about columns, indexes, space usage, and row statistics.'
  merge: -1
  img_proc: true
