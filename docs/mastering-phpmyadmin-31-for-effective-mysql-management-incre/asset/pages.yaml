- pgno: 255
  md: 'We then add a **country_code** column (same type and size as that of the code
    column of the **country** table) to the **author** table, and in the **Relation
    view**, we link it to the newly-created **country** table. We must remember to
    click **Save** for the relation to be recorded. For this example, it is not necessary
    to enter any country data for an author, as we are interested only in the relational
    schema.


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_255_0.png)


    # Editing PDF pages


    Each relational schema is called a **page**. We can create or edit a page by clicking
    **Edit PDF pages** in the **Operations** subpage of the **Database view**.


    # Page planning


    In phpMyAdmin version 3.1.x, a relational schema cannot span multiple databases.
    But even working with just one database, the number of tables might be large.
    Representing the various table relations in a clear way could be a challenge.
    This is why we may use many pages, each showing some tables and their relations.


    We must also take into account the dimensions of the final output. Printing on
    letter-size paper gives us less space to show all our tables and still have a
    legible schema.


    # Creating a new page


    As there are no existing pages, we need to create one. Again, as our most important
    table is book, we will also name this page, **book**.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'We will choose which tables we wish to see in the relational schema. We could
    choose each table individually. However, for a good start, checking the appropriate
    **Automatic layout** checkbox is recommended. Doing this puts all the related
    tables from our database onto the list of tables to be included in the schema.
    It then generates appropriate coordinates so that the tables will appear in a
    spiral layout, starting from the center of the schema. These coordinates are expressed
    in millimeters, with (0, 0) being located at the upper left corner. We then click
    **Go.**


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_256_0.png)


    # Editing a page


    We now get a page with three different sections. The first one is the master menu,
    where we choose the page on which we want to work (from the drop-down menu). We
    can also delete the chosen page. We could also eventually create a second schema
    (page).


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_256_1.png)


    The next section is the table placement portion. We can now see the benefit of
    the **Automatic layout** feature — we already have our three tables selected,
    with the (X, Y) coordinates filled in. We can add a table (on the last line),
    delete a table (using the checkbox), and change the coordinates (which represent
    the position of the upper left corner of each table on the schema).'
