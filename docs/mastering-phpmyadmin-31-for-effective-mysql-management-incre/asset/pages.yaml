- pgno: 139
  md: '# 7


    # Exporting Structure and Data (Backup)


    Keeping good backups is crucial to a project. Backups consist of up-to-date backups
    and intermediary snapshots taken during development and production phases. The
    export feature of phpMyAdmin can generate backups, and can also be used to send
    data to other applications.


    # Dumps, backups, and exports


    Let''s first clarify some vocabulary. In MySQL documentation, you will encounter
    the term dump, and in other applications, the term backup or export. All these
    terms have the same meaning in the phpMyAdmin context.


    MySQL includes mysqldump — a command-line utility that can be used to generate
    export files. But the shell access needed for command-line utilities is not offered
    by every host provider. Also, access to the export feature from within the Web
    interface is more convenient. This is why phpMyAdmin (since version 1.2.0) offers
    the export feature with more export formats than mysqldump. This chapter will
    focus on phpMyAdmin''s export features.


    Before starting an export, we must have a clear picture of the intended goal of
    the export. The following questions may be of help:


    +   - Do we need the complete database or just some tables?

    +   - Do we need just the structure, just the data, or both?

    +   - Which utility will be used to import back the data? (Not every export format
    can be imported by phpMyAdmin.)

    +   - Do we want only a subset of the data?

    +   - What is the size of the intended export, and of the link speed between us
    and the server?'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Scope of the export


    When we click an Export link from phpMyAdmin, we can be in one of these views
    or contexts—Database view, Table view, or Server view (more on this later in Chapter
    18). According to the current context, the resulting export''s scope will be a
    complete database, a single table, or even a multi-database export as in the case
    of Server view. We will first explain database exports and all the relevant export
    types. Then we''ll go on with table and multi-database exports, underlining the
    difference for these modes of exporting.


    # Database exports


    In the Database view, click the Export link. The default export panel looks like
    this:


    ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_140_0.png)'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'The default values selected here depend on config.inc.php, more specifically
    on the $cfg[''Export''] array of parameters. For example, the $cfg[''Export''][''format'']
    parameter is set to ''sql'', so that the SQL export mode is chosen by default.


    The export panel has three subpanels. The top panel **Export** and the bottom
    panel **Save as file** are always there. However, the third panel varies (using
    dynamic menu techniques) in order to show the options for the export mode chosen
    (which is SQL here).


    # The export subpanel


    This subpanel contains a table selector, from where we choose the tables and the
    format that we want. The SQL format is useful for our needs, as it creates standard
    SQL commands that would work on any SQL server. Other possible formats include
    LaTeX, PDF, Microsoft Excel 2000, Microsoft Word 2000, **Comma-Separated Values
    (CSV)**, YAML, CodeGen, Texy! text, Open Document Spreadsheet, Open Document Text,
    and XML. Another format, Native MS Excel, is available after further software
    installation and configuration. (See the section on *Native MS Excel* in this
    chapter.)


    We shall now discuss the formats (and the options available once they have been
    chosen) that can be selected with the **Export** subpanel.


    > Even if we can export from phpMyAdmin into all these formats, only the SQL and
    CSV formats can be imported back using the current phpMyAdmin version. Use only
    these two formats for backup.


    # SQL


    We will start by clicking **Select All**; we want all the tables. We know that
    the tables are small, so the on screen export will not be too large. For the moment,
    let''s deselect the **Extended inserts** checkbox. We then click **Go**, which
    produces the following output:


    ```

    -- phpMyAdmin SQL Dump

    -- version 3.1.1

    -- http://www.phpmyadmin.net

    --

    -- Host: localhost

    -- Generation Time: Dec 21, 2008 at 12:55 PM

    -- Server version: 5.0.67

    -- PHP Version: 5.2.6

    SET SQL_MODE="NO_AUTO_VALUE_ON_ZERO";

    ```'
  merge: -1
