  ## 摘要


  本附录涵盖了 phpMyAdmin 的历史——从 1998 年的起源，到 2001 年的项目重新启动，以及其后的演变。它详细介绍了每个主要版本，解释了 phpMyAdmin
  在 GoPHP5 计划中的作用，并列出了该软件产品获得的奖项列表。下一个附录通过检查一些错误信息并提出解决方案，解释了如何排查 phpMyAdmin 的故障。

  '
- '# B 故障排除和支持


  ## 故障排除和支持


  本附录提出了解决一些常见问题的指南，并提供了避免这些问题的提示。它还解释了如何与开发团队互动以获得支持、报告错误和贡献。


  ## 系统要求


  Documentation.html 文件（随下载包一起提供）开头的一个部分讨论了我们使用的特定 phpMyAdmin 版本的系统要求。必须满足这些要求，并且环境必须正确配置以避免出现问题。


  一些问题，例如 phpMyAdmin 错误，实际上是由服务器环境引起的。有时，Web 服务器未正确配置为解释 .php 文件，或者 Web 服务器内部的 PHP
  组件未使用 mysql 或 mysqli 扩展运行。MySQL 账户可能配置不当。这可能发生在家庭服务器以及托管服务器上。


  当我们怀疑有问题时，可以尝试一个简单的 PHP 脚本 test.php，其中包含以下内容以检查 PHP 组件是否正确响应。


  ```

  <?php

  echo ''hello'';

  ?>

  ```


  我们应该看到 hello 消息。如果这有效，我们可以尝试另一个脚本：


  ```

  <?php

  phpinfo();

  ?>

  ```


  该脚本显示有关 PHP 组件的信息，包括可用的扩展。我们至少应该看到关于 MySQL 的部分（证明 mysql 扩展可用），其中提供有关 MySQL 客户端 API
  版本的信息。


  我们还可以尝试其他连接到 MySQL 的 PHP 脚本，以查看问题是否比 phpMyAdmin 不能工作更普遍。一般来说，我们应该运行每个组件的最新稳定版本。


  ## 基础配置


  我们应始终仔细检查安装方式，包括正确的权限和所有权。在修改 config.inc.php 时可能会出现拼写错误。


  ## 解决常见错误


  为帮助解决问题，我们应首先确定错误消息的来源。以下是可能生成错误消息的各种组件：


  - MySQL 服务器：这些消息由 phpMyAdmin 转发，后者显示 MySQL said 后跟消息

  - Web 服务器的 PHP 组件：例如，Parser error

  - Web 服务器：错误可以从浏览器中看到，或在 Web 服务器的日志文件中看到。

  - Web 浏览器：例如，JavaScript 错误


  错误消息和其他问题部分主要基于 phpMyAdmin 帮助论坛上的各种消息以及 Documentation.html 的 FAQ 部分。


  ## 错误消息


  本节指的是 phpMyAdmin 显示的明确错误消息。


  ## 无法加载 MySQL 扩展


  要连接到 MySQL 服务器，PHP 需要 mysql 扩展（对于 MySQL 4.1+ 推荐使用 mysqli 扩展），它是一组 MySQL 函数。该扩展可能作为
  PHP 服务器的一部分编译。也可能需要动态加载，在这种情况下，phpMyAdmin 可能尝试加载它但失败。此错误意味着没有其他 PHP 脚本可以连接到 MySQL
  服务器。


  所需扩展包含在文件中，在 Linux 或 UNIX 上可以命名为 mysql.so 或 mysqli.so，在 Windows 上为 mysql.dll（可能是
  mysqli.dll）。如果我们的 PHP 服务器来自软件包，我们可以找到并安装另一个软件包——可能称为 php-mysql 或 php-mysqli。（名称取决于发行版。）否则，我们可以根据
  PHP 文档说明自行编译 PHP 服务器并使用适当的扩展。


  ## #2003 - 无法连接到 MySQL 服务器


  此消息表明 MySQL 服务器未运行，或无法从 Web 服务器访问。它也可能是套接字（Linux/UNIX）或命名管道（Windows）配置问题。


  ## 套接字问题（Linux/UNIX）


  php.ini 中配置的套接字（下面给出示例）与正在运行的 MySQL 服务器的套接字不对应。


  ```

  mysql.default_socket = /tmp/mysql.sock

  ```


  因此，PHP 无法访问 MySQL。我们可以将其更改为：


  ```

  mysql.default_socket = /var/lib/mysql/mysql.sock

  ```


  然而，为了确保，我们必须找到该套接字的确切位置。


  ## 命名管道问题（Windows）


  这是与上面指示类似的问题，但发生在 Windows 上。可以通过使用正确的命名管道调整 mysql.default_socket 来解决，该命名管道用于本地连接到
  MySQL 服务器。例如：


  ```

  mysql.default_socket = MySQL

  ```


  ## MySQL said: Access denied


  当我们了解相关的登录参数时，可以解决此错误。


  ## 使用 http 身份验证时


  我们不能同时使用基于 .htaccess 文件的 Web 服务器安全机制和 config.inc.php 中的 http 身份验证。作为变通方法，请改用 cookie
  作为身份验证类型而不是 http。


  ## 使用 http、cookie 或 config 身份验证时


  config.inc.php 中的 host 参数必须与用户访问权限中定义的 host 匹配。有时，系统管理员可能会创建一个授权用户 bill 和主机 localhost
  的账户。如果我们在 config.inc.php 中尝试使用 127.0.0.1 主机，MySQL 将拒绝它，即使它指向同一台机器。如果我们尝试使用机器的真实名称（mysql.domain.com）而定义为
  localhost，也会出现相同问题。


  ## Access denied ... "using password: NO"


  如果消息以 using password: NO 结尾，则意味着我们未传输密码，MySQL 正在拒绝此登录尝试。config.inc.php 中可能未设置密码值。


  ## Access denied ... "using password: YES"


  已传输密码，但主机/用户名/密码组合已被 MySQL 拒绝。


  ## Warning: cannot add header information


  此问题是由 config.inc.php 中存在某些字符（例如空行或空格）引起的——要么在开头的 <?php 标签之前，要么在结尾的 ?> 标签之后。我们应该使用支持
  .php 文件的编辑器将其删除（如第 1 章所述）。


  ## MySQL said: Error 127, Table Must Be Repaired


  在左侧面板中，我们单击数据库名称。在右侧面板中，我们选择出现错误的表的名称（使用相关复选框）。然后我们从下方的下拉列表中选择 Repair。更多详细信息请参见第
  10 章。


  ## BLOB 列在键规范中使用但未指定键长度


  MySQL 要求对 BLOB 列设置的索引大小受限。创建列时可用的简单索引创建技术不允许指定大小。因此，我们需要不带索引创建列。然后我们返回 Structure
  页面，并使用 Create an index 对话框选择 BLOB 列并为索引设置大小。




  ## IIS：未指定输入文件


  这是一个权限问题。**Internet Information Server (IIS)** 必须能够读取我们的脚本。由于服务器以用户 **IUSR_machinename**
  运行，我们必须按照以下步骤操作：


  - 1. 右键单击安装 phpMyAdmin 的文件夹。

  - 2. 选择 **属性**。

  - 3. 在 **安全** 选项卡下单击 **添加**，并从列表中选择 **IUSR_machinename** 用户。

  - 4. 确保该用户对目录具有读取权限。


  ## 修改行时出现“404：未找到页面”错误


  这发生在 config.inc.php 中的 $cfg[''PmaAbsoluteUri''] 参数未正确设置时。第 1 章说明了如何处理此参数。


  ## 其他问题


  在这里，我们介绍那些不会以特定错误消息显示在屏幕上的问题的解决方案。


  ## 空白页面或奇怪字符


  默认情况下，phpMyAdmin 使用输出缓冲和压缩技术来加快结果向浏览器的传输。这些技术可能会干扰 Web 服务器的其他组件，导致显示问题。我们可以在 config.inc.php
  中将 $cfg[''OBGzip''] 设置为 FALSE。这应该可以解决问题。


  ## 无法创建数据库


  如果 phpMyAdmin 检测到用于登录的帐户没有创建数据库的权限，则 **无权限** 会出现在主页上的 **创建数据库** 对话框旁边。这种情况在托管服务器上经常发生，因为系统管理员更喜欢为每个客户创建一个数据库。


  如果我们不在托管服务器上，此消息只是反映了我们既没有全局 **CREATE** 权限，也没有对通配符数据库规范的任何 **CREATE** 权限。


  ## 导入大型文件或上传大型 BLOB 文件时出现问题


  通常，这些问题表明我们在传输过程中达到了限制。第 8 章解释了这些限制和建议的处理方法。作为最后的手段，我们可能需要拆分大型文本文件。（在互联网上搜索 **文件分割器**。）


  ## MySQL root 密码丢失


  MySQL 手册在 http://www.mysql.com/doc/en/Resetting_permissions.html 解释了通用解决方案。


  该解决方案涉及停止 MySQL 服务器并使用特殊选项 `skip-grant-tables` 重新启动它（这基本上是在没有安全性的情况下启动服务器）。停止和重新启动服务器的方式取决于所使用的服务器平台。然后我们可以使用
  phpMyAdmin 以超级用户（如 root）的身份和任意密码连接到服务器。下一步是更改 root 的密码（参见第 18 章）。然后我们可以使用正常程序停止
  MySQL 服务器并重新启动它。（安全性将再次生效。）


  ## 创建表时字段名称重复


  这是一个奇怪的症状。当我们尝试创建包含例如一个名为 FIELD1 且类型为 VARCHAR(15) 的字段的表时，看起来 phpMyAdmin 已发送命令创建两个同名字段
  FIELD1。该问题不是由 phpMyAdmin 引起的，而是由环境引起的。在这种情况下，Apache Web 服务器似乎配置良好，可以运行 PHP 脚本，而实际上并非如此。然而，此错误仅在某些脚本中出现。


  该问题发生在 Apache 配置文件中使用两组不同的（且冲突的）指令时。第一组指令为：


  ```

  SetOutputFilter PHP

  SetInputFilter PHP

  ```


  第二组为：


  ```

  AddType application/x-httpd-php .php

  ```


  这些指令集可能位于两个不同的 Apache 配置文件中，因此难以注意到。推荐的方式是使用 AddType。使用此方法，我们只需对其他行添加注释（如以下代码段所示）并重新启动
  Apache。


  ```

  #SetOutputFilter PHP

  #SetInputFilter PHP

  ```


  ## 身份验证窗口显示多次


  当我们尝试使用与 $cfg[''PmaAbsoluteUri''] 中设置的不同 URL 启动 phpMyAdmin 时会出现此问题。例如，服务器可能有多个名称，或者我们可能尝试使用
  IP 地址而不是名称。


  ## phpMyAdmin 修改了列大小


  为了更高效的列定义，MySQL 本身有时会决定更改列类型和大小。这主要发生在 CHAR 和 VARCHAR 上。


  ## 看到许多不属于我们的数据库


  此问题大多在升级到 MySQL 4 后出现。自动服务器升级程序会向所有用户授予全局权限 CREATE TEMPORARY TABLES、SHOW DATABASES
  和 LOCK TABLES。这些权限还使用户能够查看所有数据库的名称（但不能查看其表），直到我们按照 MySQL 手册中所述升级 GRANT 表权限。如果用户不需要这些权限，我们可以撤销这些权限。用户然后只能看到他们有权访问的数据库。


  ## 无法存储大于 127 的值


  如果我们定义了类型为 TINYINT 的列，则这是正常的，因为 127 是此列类型的最大值。类似问题也可能出现在其他数值列类型中。将类型更改为 INT 可扩展可用值的范围。


