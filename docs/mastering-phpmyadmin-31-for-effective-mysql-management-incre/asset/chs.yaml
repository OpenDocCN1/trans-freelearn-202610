  \ = 'A4';\n```\n\n以下截图显示了生成的报告的最后一页（模式页）在 PDF 格式中的样子。前四页包含数据字典，并具有附加功能。在每一页中，都可以通过点击表名到达模式，而在模式中，可以通过点击相应表到达数据字典中的每一页。\n\
  \n箭头指向相应的外表。如果选择了 Show color，主键以灰色显示，显示字段以黑色显示。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_259_0.png)\n\
  \n\n\n这是根据同一本书表 PDF 页面定义生成的另一个示例。这次网格显示了，但没有颜色。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_260_0.png)\n\
  \n## A note about fonts used\n\n所有在 PDF 模式中看到的文本都是使用特定字体绘制的。phpMyAdmin 3.1.x 使用\
  \ DejaVuSans 字体 (http://dejavu.sourceforge.net)，它涵盖了广泛的字符。\n\n对于实际的 PDF 生成，phpMyAdmin\
  \ 依赖于 tcpdf 库 (http://tcpdf.sourceforge.net)，它本身是对 fpdf 库 (http://www.fpdf.org)\
  \ 的改编。这些库使用字体有两种方式——嵌入和不嵌入。嵌入字体会产生更大的 PDF 文件，因为整个字体包含在 PDF 中。这是 phpMyAdmin 选择的默认选项，因为该库不依赖于客户端操作系统中特定\
  \ TrueType 字体是否存在。\n\n字体位于主 phpMyAdmin 目录下的 libraries/tcpdf/font 中。\n\n要使用不同的字体文件，我们必须先将其添加到库中（原始\
  \ tcpdf 工具包中包含工具，且在 http://www.fpdf.org 网站上有教程），然后修改 phpMyAdmin 的 pdf_schema.php\
  \ 源代码。\n\n## Using the Designer for PDF layout\n\n设计器功能（在数据库视图中可用）提供了一种更精细的方式在屏幕上移动表，因为列链接会跟随表的移动。因此，设计器保存的表的坐标与\
  \ PDF 模式的坐标之间存在接口。让我们进入设计器并点击小 PDF 标志。\n\n这会带我们进入一个面板，在其中我们可以选择（已存在的）PDF 模式名称以及要执行的操作——在我们的例子中，是将设计器坐标导出到\
  \ PDF 模式。我们也可以使用“创建新页面”对话框，输入 PDF 页面名称并点击 Go 来创建空白页面。从这里，我们随后可以导出从设计器工作区保存的坐标。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_261_0.png)\n\n> 设计器管理的表范围与编辑 PDF 功能管理的表范围存在差异。设计器操作数据库中的每个表，而编辑\
  \ PDF 面板提供表选择，使我们能够在表很多的情况下表示关系的一个子集。\n\n## Summary\n\n本章涵盖了 phpMyAdmin 提供的文档功能——数据库或表的打印视图以及完整的列列表的数据字典。本章还涵盖了\
  \ PDF 关系模式。特别是，它重点介绍了如何创建和修改 PDF 模式页面，以及如何使用可视编辑器（草稿板）。下一章将解释如何在查看时应用转换来定制数据的格式。\n"
- '# 16 MIME-Based Transformations


  在本章中，我们将介绍 phpMyAdmin 的一个强大功能——在表 **Browse** 期间根据称为转换的特定规则转换列内容的能力。通常，浏览表只显示其中存储的原始数据。然而，基于
  MIME 的转换允许更改显示格式。


  ## Display behavior in browse mode


  通常，每个行的确切内容都会显示，除了：


  - **TEXT** 和 **CHARACTER** 字段可能会根据 $cfg[''LimitChars''] 被截断，具体取决于我们是否选择查看 **Full
  Texts**

  - **BLOB** 字段可能会被诸如 [**BLOB - 1.5 KB**] 的消息替换


  我们将使用术语 **cell** 来表示特定行的特定列。包含“Future souvenirs”书封面照片的单元格（一个 **BLOB** 列）目前显示为诸如
  %oPNG\r\nZ\n\0\0\0\rIHDR\0 之类的神秘数据，或显示 **BLOB** 字段大小的消息。能够直接在 phpMyAdmin 中看到图片的缩略图（在
  *Clickable thumbnail* 部分下的第二张截图中显示）以及可能的全尺寸图片本身会很有趣。这将通过适当的转换实现。


  ## Display options


  在 Browse 模式下，Options 链接会显示一个滑块，其中包含其他选项，如隐藏浏览器转换复选框。我们可以在想要在单元格的真实数据与其转换版本之间切换时使用它。


  ## Enabling transformations


  我们将转换定义为一种机制，通过该机制，使用为该列定义的元数据，在浏览时转换与列相关的所有单元格。只有结果页面上可见的单元格会被转换。转换逻辑本身是用 PHP 脚本编写的，存储在
  libraries/transformations 中，并使用插件架构调用。


  要启用此功能，我们必须在 config.inc.php 中将 $cfg[''BrowseMIME''] 设置为 TRUE。必须建立链接表基础设施（参见第 11
  章），因为转换所需的元数据在官方 MySQL 表结构中不可用。这是专门为 phpMyAdmin 做的补充。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_264_0.png)


  > 在 phpMyAdmin 主页的文档部分，有一个链接指向更多信息，供希望学习插件内部结构以编写自己的转换的开发人员参考。


  ## The MIME column''s settings


  如果我们进入书表的结构页面的表视图并点击 cover_photo 的 Change 链接，我们会看到字段的三个额外属性（前提是转换功能已启用）：


  - MIME 类型

  - 浏览器转换

  - 转换选项


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_265_0.png)


  对于特定字段，只能指定一种转换类型。这里，字段是 BLOB 字段。因此，它可以保存任何类型的数据。为了使 phpMyAdmin 正确解释和操作数据，转换系统必须被告知数据格式和预期结果。因此，我们必须确保上传的数据始终遵循相同的格式。


  我们将首先了解这些属性的用途，然后在转换示例部分尝试一些可能性。


  ## MIME types


  MIME 规范 (http://en.wikipedia.org/wiki/MIME) 被选为元数据属性，用于对列保存的数据类型进行分类。多用途互联网邮件扩展
  (MIME) 最初设计用于扩展邮件，现在也用于描述其他协议的内容类型。在 phpMyAdmin 的上下文中，当前可能的值为：


  - image/jpeg

  - image/png

  - text/plain

  - application/octetstream


  text/plain 类型可以为包含任何类型文本的列选择（例如 XHTML 或 XML 文本）。在转换示例部分，您将看到要实现特定效果需要选择哪种 MIME 类型。


  ## Browser transformations


  这里设置要执行的确切转换。每个 MIME 类型可能支持多个转换。例如，对于 **image/jpeg** MIME 类型，我们有两个可用转换——**image/jpeg:
  inline** 用于图片的可点击缩略图，以及 **image/jpeg: link** 用于仅显示链接。


  如以下图片所示，将鼠标移到下拉菜单中的每个选项上会提供相应转换的简短说明。更完整的转换说明和可能选项可在点击 **transformation descriptions**
  链接后获得。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_266_0.png)


  ## Transformation options


  在 *Examples of transformations* 部分，我们将看到某些转换接受选项。例如，生成图片的转换需要以像素为单位的宽度和高度。选项列表中的值用逗号分隔，一些选项可能需要在引号中括起来。


  一些选项有默认值，我们必须注意遵守选项的文档顺序。例如，如果有两个选项，而我们只想为第二个选项指定值，可以使用空引号作为第一个选项的占位符，让系统使用其默认值。


  ## Requirements for image generation


  正常的缩略图生成要求 Web 服务器上存在某些组件，并且 config.inc.php 中的参数配置正确。




  ## GD2 库


  phpMyAdmin 使用一些内部函数来创建缩略图。这些函数需要在我们的 PHP 服务器上存在 GD2 库。


  phpMyAdmin 可以检测正确的 GD2 库是否存在，但此检测需要一些时间。它并非在每个会话中只进行一次，而是在 phpMyAdmin 中几乎每次执行操作时都会进行。


  将 config.inc.php 中的 $cfg[''GD2Available''] 参数设置为其默认值 ''auto'' 表示需要检测库的存在性和版本。


  如果我们知道 GD2 库可用，将 $cfg[''GD2Available''] 设置为 yes 将使执行更快。如果 GD2 库不可用，建议将此参数设置为 no。


  要了解服务器上有哪些 GD2 库，我们可以进入 phpMyAdmin 的主页并点击显示 PHP 信息。如果此链接不存在，我们必须将 $cfg[''ShowPhpInfo'']
  参数设置为 true。然后我们查找标题为 gd 的部分并验证识别的版本。


  gd


  |  |  |

  |---|---|

  | GD 支持 | enabled |

  | GD 版本 | bundled (2.0.28 compatible) |

  | GIF 读取支持 | enabled |

  | GIF 创建支持 | enabled |

  | JPG 支持 | enabled |

  | PNG 支持 | enabled |

  | WBMP 支持 | enabled |

  | XBM 支持 | enabled |


  ## JPEG 和 PNG 库


  如果我们或我们的用户想要为这些类型的图像生成缩略图，则我们的 PHP 服务器需要支持 JPEG 和 PNG 图像。有关更多详细信息，请参阅 http://php.net/manual/en/ref.image.php。


  ## 内存限制


  在某些 PHP 服务器上，php.ini 中 memory_limit 的默认值是 8 MB。这对于正确的图像处理来说太低了，因为用于生成最终图像的 GD 函数需要一些工作内存。例如，在一次测试中，从
  300 KB 的 JPEG 图像生成缩略图需要 memory_limit 中的 11 MB 值。


  ## 转换示例


  我们现在将讨论一些转换示例。


  ## 可点击缩略图（.jpeg 或 .png）


  我们将首先将 cover_photo 字段类型从 BLOB 改为 MEDIUMBLOB，以确保我们可以上传大小超过 65 KB 的照片。


  然后我们输入以下属性：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_268_0.png)


  这里，选项以宽度和高度的形式呈现。如果我们省略选项，默认值是 100 和 100。缩略图生成代码保留图像的原始宽高比。因此，输入的值是生成图像的最大宽度和高度。然后我们使用第
  6 章中的说明在单元格中上传 .jpeg 文件。结果，我们在该表的浏览模式下得到以下内容：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_268_1.png)


  可以点击此缩略图以显示全尺寸照片。


  > 缩略图不会存储在 MySQL 中的任何位置，而是在每次进入此行集的浏览模式时生成。在双 Xeon 3.2GHz 服务器上，我们通常会体验到每秒生成六张 JPEG
  图像的速度。


  对于 .png 文件，我们必须使用 **image/png** 作为 MIME 类型，并使用 **image/png: inline** 作为转换。


  ## 图像链接


  要获取没有缩略图的链接，我们使用 **image/jpeg: link** 转换。

  没有转换选项。此链接可用于查看照片（通过左键单击链接），然后可能下载它（通过右键单击照片本身）。


  | isbn 书号 | 标题 | page_count 近似 | author_id 作者表 | 语言 | 描述 | cover_photo | 类型 |

  |---|---|---|---|---|---|---|---|

  | 1-234567-22-0 | Future souvenirs | 200 | 2 | en |  | [BLOB] |  |


  ## 日期格式化


  我们在 book 表中有名为 **date_published** 的字段；让我们将其类型更改为 **DATETIME**。然后，我们将其 MIME 类型设置为
  **text/plain**，浏览器转换设置为 **text/plain: dateformat**。下一步是编辑“Future souvenirs”书籍的行，并在
  **date_published** 字段中输入 **2003-01-01 14:56:00**。

  当我们浏览表时，现在可以看到该字段已被格式化。将鼠标移过该字段会显示未格式化的原始内容。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_269_0.png)


  此转换接受两个选项。第一个是将被添加到原始值的小时数，默认为零。如果我们基于 **通用协调时间 (UTC)** 存储所有时间，但希望为特定时区（UTC+5）显示它们，则添加小时数会很有用。第二个选项是我们想要使用的时间格式，由任意
  PHP `strftime` 参数组成。因此，如果我们在转换选项中放入此内容 – ''0'',''Year: %Y'' – 我们将得到：


  | date_published | stamp |

  |---|---|

  | Year: 2003 | 2006-07-22 09:51:50 |

  | Year: 19?? | 2000-00-00 00:00:00 |

  | Year: 1999 | 0000-00-00 00:00:00 |


  ## 文本中的链接


  假设我们在 book 表的 **description** 字段中放入了一个完整的 URL – http://domain.com/abc.pdf –。在浏览表时，链接的文本会显示，但我们无法点击它。我们现在将看到在这种情况下
  **text/plain** MIME 类型的用途。


  ## text/plain: link


  如果我们在刚才提到的场景中使用 **text/plain** MIME 类型和 **text/plain: link** 浏览器转换，我们仍然会看到链接的文本，并且可以点击它。


  | isbn 书号 | 标题 | page_count 近似 | author_id 作者表 | 语言 | 描述 |

  |---|---|---|---|---|---|

  | 1-234567-22-0 | Future souvenirs | 200 | 2 | en | http://domain.com/abc.pdf |

  | 1-234567-89-0 | A hundred years of cinema (volume 1) | 600 | 1 | en |  |


  如果我们想要指向的所有文档都位于一个公共 URL 前缀下，我们可以将此前缀（例如，http://domain.com/）放在第一个转换选项中，并在引号内。然后，我们只需在每个单元格中放入
  URL 的最后一部分（abc.pdf）。


  可用第二个转换选项来设置标题。这将在浏览模式下显示，而不是 URL 内容，但点击仍会带我们到预期的 URL。


  > 如果我们仅使用第二个转换选项，我们必须在应输入第一个选项的位置加上引号。可以这样做：` `, `this is the title`


  ## text/plain: imagelink


  此转换与前一个类似，只是单元格中放置的是指向图像的 URL。此图像将被获取并与链接文本一起在单元格中显示。该图像可以在 Web 上的任何位置，包括我们的本地服务器。


  这里我们有以下三个可用选项：


  - 常用 URL 前缀（如 text/plain: link 中的）

  - 图像宽度（以像素为单位，默认值：100）

  - 高度（默认值：50）


  对于我们的测试 URL，您应输入以下选项：


  ```

  ` `, `100`, `123`

  ```


  如果链接的文本太长，则转换不会发生。默认情况下，选择了部分文本显示选项。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_271_0.png)


  在这种情况下，我们可以切换到完整文本以显示完整的链接。然后我们可以看到完整的图像。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_272_0.png)


  其他转换，例如 image/jpeg: inline 和 image/png: inline，指定图像的确切 MIME 类型。在这些情况下，phpMyAdmin
  使用 GD2 库函数进行缩略图生成。然而，text/plain: imagelink 转换中包含的链接可能引用任何浏览器支持的图像类型。因此，phpMyAdmin
  只会根据转换中定义的大小选项，使用 HTML img 标签及其宽度和高度属性显示调整大小后的图像。要查看原始图像，我们可以点击链接或缩略图。


  ## 保留原始格式


  通常，在显示文本时，phpMyAdmin 会帮助您去掉特殊字符。例如，如果我们在某本书的 description 字段中输入 This book is <b>good</b>，在浏览表时我们通常会看到
  This book is <b>good</b>。然而，如果我们对该字段使用转换 text/plain: formatted，浏览时我们将得到以下内容：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_272_1.png)


  在此示例中，结果是正确的。然而，数据字段中输入的其他 HTML 可能会产生令人惊讶的结果（包括无效的 HTML 页面）。例如，由于 phpMyAdmin 使用
  HTML 表格呈现结果，数据字段中未转义的 </table> 标签会破坏输出。




  ## 显示文本的一部分


  text/plain: substr 转换可用于仅显示文本的一部分。以下是选项：


  - First：文本中开始的位置（默认值：0）

  - Second：字符数（默认值：所有剩余文本）

  - Third：显示为后缀以表明已发生截断的内容；默认显示省略号 (...)


  请记住 $cfg[''LimitChars''] 会对每个非数值字段进行字符截断。因此，text/plain: substr 是一种逐字段微调的机制。


  ## 下载链接


  假设我们想在 MySQL 中为每本书存储一个小的音频评论。我们在 book 表中添加一个新字段，名称为 audio_contents，类型为 MEDIUMBLOB。我们将其
  MIME 类型设置为 application/octetstream 并选择 application/octetstream: download 转换。在“转换选项”中，我们插入
  ''comment.wav''。


  |  |  |

  |---|---|

  | MIME 类型 | application/octetstream |

  | 浏览器转换 | application/octetstream: download |

  | 转换选项³ | ''comment.wav'' |


  此 MIME 类型和扩展名会通知浏览器传入的数据，浏览器应打开适当的播放器。要插入评论，我们首先以 .wav 格式录制它，然后将文件内容上传到某本书的 audio_contents
  字段中。在浏览表时，我们可以看到用于音频评论的链接 comment.wav。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_273_0.png)


  > 第 17 章描述了 BLOB 流技术，这更适合更大的数据块（例如，使用 phpMyAdmin 观看存储在 MySQL 中的电影！）。


  ## 十六进制表示


  字符在 MySQL（一般来说是计算机）中以数值数据存储，并转换为屏幕或打印机可理解的内容。用户有时会从一个应用程序剪切并粘贴数据到 phpMyAdmin，如果字符未被
  MySQL 直接支持，则会导致意外结果。我记得一个案例，涉及在 Microsoft Word 文档中输入的特殊引号并粘贴到 phpMyAdmin。能够看到确切的十六进制代码很有帮助，这可以通过使用
  application/octetstream: hex 转换来实现。


  在以下示例中，此转换将应用于我们 book 表的 title 字段。浏览包含 Future souvenirs 标题的行时，我们可以看到：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_274_0.png)


  由于我们知道该列使用哪种字符集编码，因此可以将内容与描述每个字符的图表进行比较。例如，http://en.wikipedia.org/wiki/Latin1 描述了
  latin1 字符集。


  ## SQL 漂亮打印


  术语 pretty printing (http://en.wikipedia.org/wiki/Pretty_printing) 指的是“美化”源代码的一种方式。假设我们使用一个表来存储关于
  SQL 的课程文本。在一个列中，我们可能放置了示例 SQL 语句。使用 text/plain: sql 转换时，在浏览表时这些 SQL 语句将以彩色并带语法高亮显示。


  ## IP 地址


  IP（v4）地址可以编码为长整数（例如，通过 PHP ip2long() 函数），并存储到 MySQL UNSIGNED INT 列中。要将其转换回熟悉的点分字符串（例如，127.0.0.1），可以使用
  text/plain: longToIpv4 转换。


  ## 外部应用程序


  先前描述的转换直接在 phpMyAdmin 内部实现。然而，一些转换最好通过现有的外部应用程序执行。


  text/plain: external 转换使我们能够将单元格的数据发送到在 Web 服务器上启动的另一个应用程序，捕获该应用程序的输出，并在单元格位置显示它。


  此功能仅在 Linux 或 UNIX 服务器上受支持（在 Microsoft Windows 下，输出和错误重定向无法被 PHP 进程轻松捕获）。此外，PHP
  不应在安全模式下运行。因此，该功能可能在托管服务器上不可用。


  出于安全原因，应用程序的确切路径和名称不能在 phpMyAdmin 中作为转换选项设置。应用程序名称直接设置在 phpMyAdmin 脚本之一内部。


  首先，在 phpMyAdmin 安装目录中，我们编辑 libraries/transformations/ 中的 text_plain_external.inc.php
  文件，并找到以下部分：


  ```

  $allowed_programs = array();

  //$allowed_programs[0] = ''/usr/local/bin/tidy'';

  //$allowed_programs[1] = ''/usr/local/bin/validate'';

  ```


  默认情况下未配置任何外部应用程序，我们必须显式添加自己的应用程序。


  > 转换脚本的名称使用以下格式构造——MIME 类型、双下划线，然后是指示转换发生的部分。


  每个允许的程序及其完整路径必须在此描述，索引号从 0 开始。然后我们保存对该脚本的修改，并在需要时将其放回服务器。剩余的设置在选择其他浏览器转换选项的面板中完成。


  当然，我们现在将在转换菜单中选择 text/plain: external。


  作为第一个选项，我们放置应用程序编号（例如，0 用于 tidy 应用程序）。第二个选项保存我们需要传递给该应用程序的参数。如果我们希望 phpMyAdmin 对结果应用
  htmlspecialchars() 函数，我们将第三个参数设为 1——默认情况下已完成。我们也可以在那里放置 0 以避免使用 htmlspecialchars()
  保护输出。


  如果我们想避免重新格式化单元格的行，我们将第四个参数设为 1。这将使用 NOWRAP 修饰符，并且默认情况下已完成。


  ## 外部应用程序示例：单元格内排序


  此示例展示了如何对一个单元格的文本内容进行排序。我们首先修改 **text_plain_external.inc.php** 脚本，如上文所述，以添加 **sort**
  程序：


  ```

  $allowed_programs[0] = ''/bin/sort'';

  ```


  请注意，我们的新程序的索引号为 0。


  然后我们在 book 表中添加一个 **TEXT** 字段和 **keywords**。最后，我们填写 MIME 相关信息，将转换选项输入为 ''0'',''-r''。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_276_0.png)


  这里的 ''0'' 指的是 **sort** 的索引号，而 ''-r'' 是 **sort** 的一个参数，使程序按相反顺序排序。


  接下来，我们 **Edit** 书籍 "A hundred years of cinema (volume 1)" 的行，以任意顺序输入一些关键词（如以下屏幕截图所示）并点击
  **Go** 以保存更改。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_276_1.png)


  为了测试外部程序的效果，我们浏览表并查看单元格内已排序的关键词。


  | date_published | stamp | keywords |

  |---|---|---|

  | Year: 2003 | 2006-07-22 10:20:10 |  |

  | Year: 1999 | 2006-07-22 10:58:39 | sport

  history

  cinema |


  请注意，关键词以逆序排序显示。


  ## 摘要


  在本章中，我们学习如何通过各种方法转换数据来改善浏览体验。本章还概述了 .jpeg 和 .png BLOB 字段的缩略图和全尺寸图像，如何生成链接、格式化日期、仅显示文本的一部分以及如何执行外部程序来重新格式化单元格内容。第
  17 章将介绍 phpMyAdmin 对 MySQL 5.0 和 5.1 版本中新功能 的支持。

  '
- "# 17 MySQL 5.0 和 5.1 支持\n\n## MySQL 5.0 和 5.1 支持\n\nMySQL 5.0 引入了许多新功能。这些功能的发布平息了许多开发人员和行业观察者的说法，他们声称\
  \ MySQL 相比于已经具备这些功能的某些竞争对手产品是一个较差的产品。视图、存储过程、触发器、标准的 INFORMATION_SCHEMA 以及（最近）分析机制现在已出现在\
  \ MySQL 体系中。\n\n在 MySQL 5.1 的新功能中，与 Web 界面相关的内容（例如分区和事件）在 phpMyAdmin 中得到支持。\n\n\
  ## 视图\n\nMySQL 5.0 引入了对命名和可更新视图的支持。视图是一个派生表（可将其视为虚拟表），其定义存储在数据库中。对一个或多个表（甚至视图）执行的\
  \ SELECT 语句被存储为视图，也可以被查询。\n\n视图可用于：\n\n- 限制列的可见性（例如，不显示薪资）\n- 限制行的可见性（例如，不显示特定世界地区的数据）\n\
  - 隐藏更改的表结构（以便旧应用程序可以继续工作）\n\n由于视图本身附带一些权限，因此授予整个视图的权限比在底层表上定义繁琐的列特定权限更容易。\n\n\n\n\
  在从 5.0 之前的版本升级后，要在服务器上激活对视图的支持，管理员必须执行 mysql_fix_privileges_tables 脚本，如 MySQL 手册所述。\n\
  \n> 每个用户必须具有适当的 SHOW VIEW 或 CREATE VIEW 权限才能查看或操作视图。这些权限存在于全局（服务器）、数据库和表级别。\n\n\
  phpMyAdmin 支持两种创建视图的方式。我们先解释手动方法，然后再介绍更直观的方式。\n\n## 手动创建视图\n\n要手动创建视图，我们使用查询框输入相应的语句。让我们输入以下行并点击\
  \ Go：\n\n```\nCREATE VIEW book_author AS\nSELECT book.isbn, book.title, author.name\
  \ FROM book\nLEFT JOIN author ON author.id = book.author_id\n```\n\n> 创建视图意味着用户对所涉及的表具有权限，或者至少对视图中提及的所有列具有\
  \ SELECT 或 UPDATE 等权限。\n\n此时，视图已创建，左侧面板已更新以反映这一事实。如果我们刷新浏览器页面然后访问 marc_book 数据库，我们将看到：\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_280_0.png)\n\n在左侧面板中，book_author 视图旁边有一个不同的图标，表示它不是普通表。在右侧面板中，我们看到新创建视图的信息。视图的记录数目前显示为\
  \ 0（本章后面的性能提示部分会详细介绍），Type 列中显示为 View。视图没有关联的排序规则或大小。\n\n此创建步骤是手动完成的。视图上的其他操作由 phpMyAdmin\
  \ 界面处理。\n\n## 右侧面板和视图\n\n由于视图与表具有某些相似性，其名称可在导航面板中与普通表名称一起使用。点击视图名称后，会显示一个类似于表的面板，但菜单选项卡比普通表少。事实上，某些操作对视图来说没有意义——例如，Import。这是因为视图实际上不包含数据。然而，其他操作，如\
  \ Browse，则完全可以接受。\n\n让我们浏览此视图：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_281_0.png)\n\
  \n我们注意到，在生成的 SQL 查询中，看不到我们原始的 CREATE VIEW 语句。原因是我们使用 SELECT 语句从视图中选择，隐藏了我们是从视图中提取数据的事实。然而，导出视图的结构将显示\
  \ MySQL 内部如何存储我们的视图。\n\n```\nCREATE ALGORITHM=UNDEFINED DEFINER=`marc`@`%` SQL SECURITY\
  \ DEFINER VIEW `book_author` AS select `book`.`isbn` AS `isbn`, `book`.`title` AS\
  \ `title`, `author`.`name` AS `name` from (`book` left join `author` on((`book`.`author_id`\
  \ = `author`.`id`)));\n```\n\n右侧面板的菜单可能看起来与表相似。然而，在必要时，phpMyAdmin 会生成处理视图的适当语法。例如，点击\
  \ **Drop** 将会产生：\n\n**是否真的要：DROP VIEW 'book_author'**\n\n此时，我们可以确认（或不确认）此视图的删除。\n\
  \n> 要对现有视图执行操作，用户需要在视图级别具有适当的权限，但不一定需要在该视图涉及的表上具有任何权限。这就是我们实现列和表隐藏的方式。\n\n## 从结果创建视图\n\
  \n创建复杂视图可能需要在查询框中输入完整的语句。另一种可能性是利用 phpMyAdmin 的 **Search**（表级）或 **Query**（数据库级）功能构建一个相当复杂的查询，执行它，然后轻松地从结果创建视图。我们将看到这是如何完成的。\n\
  \n我们提到视图可用于限制列（事实上是表）的可见性。假设书籍的页数是高度机密信息。我们打开 book 表，点击 **Search**，并选择列的子集：\n\n\
  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_282_0.png)\n\n点击 **Go** 会生成结果页面，其中在 **Query\
  \ results operations** 部分可以看到 **CREATE VIEW** 链接。我们使用此链接访问视图创建面板，其中 **AS** 框中已包含底层查询。我们需要为此视图选择一个名称（此处为\
  \ **book_public_info**），并且可以为其可选地设置不同的列名（此处为 **number, title**）。其他选项可以影响视图的行为，已在\
  \ MySQL 手册中解释（http://dev.mysql.com/doc/refman/5.1/en/create-view.html）。\n\n点击 Go\
  \ 会生成我们请求的视图。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_283_0.png)\n\nCHECK OPTION\
  \ 子句会影响可更新视图的行为（这在前面引用的 MySQL 手册页面中有解释）。\n\n## 重命名视图\n\nphpMyAdmin 不支持直接从界面重命名视图。然而，自\
  \ MySQL 5.0.14 起，只要我们在同一数据库内重命名，就允许使用 RENAME TABLE 语句（从 phpMyAdmin 的查询框）。例如，RENAME\
  \ TABLE book_public_info TO book_public_info2。\n\n## 性能提示\n\nphpMyAdmin 有一个配置参数\
  \ $cfg['MaxExactCountViews']，它控制 phpMyAdmin 的行计数阶段。有时，视图包含许多巨大的表，浏览它会使大量虚拟行出现。因此，该参数的默认值\
  \ 0 确保视图不会进行行计数。在这种情况下，浏览视图时我们会看到相当奇怪的结果：Showing rows 0 -1 (0 total, Query took\
  \ 0.0006 sec)。但这比减慢服务器速度更可接受。\n\n尽管如此，如果我们希望看到视图的更精确行数，我们可以在该参数中放置一个更大的值，该值充当行计数阶段的上限。\n\
  \n## 过程—存储过程和函数\n\n在 phpMyAdmin 开始包含这些功能支持之前花了一些时间。原因在于存储过程和函数是代码块（如子程序），作为数据库的一部分保存，而\
  \ phpMyAdmin 作为 Web 界面，更偏向于使用鼠标快速完成的操作。\n\n尽管如此，phpMyAdmin 提供了一些功能，允许开发人员创建此类例程，保存它们，召回它们以进行一些修改，然后删除它们。\n\
  \n过程通过 CALL 语句访问，我们可以向其传递参数。另一方面，函数从 SQL 语句（例如 SELECT）访问，类似于返回值的其他 MySQL 内部函数。\n\
  \n> 需要 CREATE ROUTINE 和 ALTER ROUTINE 权限才能创建、查看和删除存储过程或函数。需要 EXECUTE 权限来运行例程，尽管该权限通常会自动授予其创建者。\n\
  \n## 创建存储过程\n\n我们将创建一个过程，通过添加特定数量的页数来更改特定书籍的页数。该书籍的 ISBN 和要添加的页数将是此过程的输入参数。\n\n\
  ## 更改分隔符\n\n标准 SQL 分隔符是分号，并且该字符将在我们的过程中用于分隔 SQL 语句。然而，CREATE PROCEDURE 语句本身就是一条\
  \ SQL 语句；因此，我们必须想出一种方法来指示 MySQL 解析器该语句在哪里结束。查询框有一个 Delimiter 输入框，默认包含分号。因此，我们将其更改为另一个字符串，按惯例是双斜杠\
  \ //。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_285_0.png)\n\n## 输入过程\n\n然后我们在主查询框中输入过程的代码：\n\
  \n```\nCREATE PROCEDURE `add_page`(IN param_isbn VARCHAR(25), IN param_pages INT,\
  \ OUT param_message VARCHAR(100))\nBEGIN\n  IF param_pages > 100 THEN\n    SET param_message\
  \ = 'the number of pages is too big';\n  ELSE\n    UPDATE book SET page_count =\
  \ page_count + param_pages WHERE isbn=param_isbn;\n    SET param_message = 'success';\n\
  \  END IF;\nEND\n//\n```\n\n点击 Go 后，如果语法正确，我们会收到成功消息。如果不是，嗯，是时候重新检查我们的打字能力或调试语法了。不幸的是，MySQL\
  \ 不带过程调试器。\n\n## 测试过程\n\n再次在查询框中，我们通过输入以下语句来测试我们的过程。这里，我们使用 SQL 变量 @message，它将接收\
  \ OUT 参数 param_message 的内容：\n\n```\ncall add_page('1-234567-22-0', 4, @message);\n\
  SELECT @message;\n```\n\n然后我们可以验证该书籍的页数是否已增加。我们还需要测试有问题的案例：\n\n```\ncall add_page('1-234567-22-0',\
  \ 101, @message);\nSELECT @message;\n```\n\n此过程现在可使用 mysqli 扩展从 PHP 调用。\n\n\n\n\
  ## 操作\n\n存储过程存储在数据库内部，并且不绑定到特定的表。因此，操作存储过程和函数的界面可以在数据库级别的“结构”页面下的“例程”滑块中找到。\n\n\
  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_286_0.png)\n\n第一个图标会将该存储过程的文本调入查询框进行编辑。第二个图标用于删除该存储过程。编辑存储过程时，我们注意到文本已被部分修改。\n\
  \n```\nDROP PROCEDURE `add_page` //\nCREATE DEFINER=`marc`@`%` PROCEDURE `add_page`(IN\
  \ param_isbn VARCHAR(25), IN param_pages INT, OUT param_message VARCHAR(100))\n\
  BEGIN\n  IF param_pages > 100 THEN\n    SET param_message = 'the number of pages\
  \ is too big';\n  ELSE\n    UPDATE book SET page_count = page_count + param_pages\
  \ WHERE isbn=param_isbn;\n    SET param_message = 'success';\n  END IF;\nEND\n```\n\
  \n首先出现了 DROP PROCEDURE。这很正常，因为 MySQL 没有提供可以修改存储过程体的语句。因此，每次想要更改存储过程时都必须先删除它。确实存在\
  \ ALTER PROCEDURE 语句，但它只能更改存储过程的特性——例如添加注释。然后显示了 DEFINER 子句。它是在创建时生成的，表示创建该存储过程的用户。\n\
  \n此时，我们对代码进行必要的修改，然后点击 Go 保存该存储过程。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_287_0.png)\n\
  \n> 可能很诱人打开 book 表的结构页面并查找操作该表的存储过程列表，例如我们的 add_page() 存储过程。然而，所有存储过程都存储在数据库级别，代码本身（UPDATE\
  \ book）与存储过程的存储位置之间没有直接链接。\n\n## 手动创建函数\n\n函数与存储过程类似。然而，函数只能返回一个值，而存储过程可以有多个 OUT\
  \ 参数。另一方面，在 SELECT 语句中使用存储函数似乎更自然，因为它避免了使用中间 SQL 变量来保存 OUT 参数值的需要。\n\n函数的目的是什么？例如，函数可用于计算订单的总成本，包括税费和运费。将此逻辑放在数据库内部而不是应用层，有助于记录应用-数据库接口。它还避免了在每个需要处理此逻辑的应用中重复业务逻辑。\n\
  \n我们不应将 MySQL 5.0 的函数与 UDF（用户定义函数）混淆，后者在 MySQL 5.0 之前就已存在。UDF 由用 C 或 C++ 编写的代码构成，编译为共享对象，并通过\
  \ CREATE FUNCTION 语句和 SONAME 关键字引用。\n\nphpMyAdmin 对函数的处理在许多方面与我们之前介绍的存储过程类似：\n\n\
  - 用于输入函数的查询框\n- 使用分隔符\n- 操作已定义函数的机制\n\n让我们定义一个根据代码检索国家名称的函数。我更喜欢使用 param_ 前缀来明确标识函数定义中的参数，并使用\
  \ var_ 前缀表示局部变量。我们将使用可靠的 SQL 查询框输入函数的代码，同样指示该框使用 // 作为分隔符。\n\n```\nCREATE FUNCTION\
  \ get_country_name(param_country_code CHAR(2))\n  RETURNS VARCHAR(50)\nBEGIN\n \
  \ DECLARE var_country_name VARCHAR(50) DEFAULT 'not found';\n  SELECT description\n\
  \    INTO var_country_name\n    FROM country\n    WHERE code = param_country_code;\n\
  \    RETURN var_country_name;\nEND\n//\n```\n\n我们应注意，我们新建的函数可以在数据库的结构页面上看到，与其朋友\
  \ add_page 存储过程一起：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_288_0.png)\n\n##\
  \ 测试函数\n\n测试该函数：\n\n```sql\nSELECT CONCAT('ca->', get_country_name('ca'), ', zz->',\
  \ get_country_name('zz')) as test;\n```\n\n我们得到的结果：\n\nca->Canada, zz->not found\n\
  \n## 导出存储过程和函数\n\n导出数据库时，存储过程和函数默认不会出现在 SQL 导出中。在导出页面的结构对话框中，存在一个复选框“Add CREATE\
  \ PROCEDURE / FUNCTION / EVENT”，用于将它们包含在 SQL 导出文件中。如果我们尝试，就会得到：\n\n```sql\nDELIMITER\
  \ $$\n--\n-- Procedures\n--\nCREATE DEFINER=`marc`@`%` PROCEDURE `add_page`(IN param_isbn\
  \ VARCHAR(25), IN param_pages INT, OUT param_message VARCHAR(100))\nBEGIN\n  IF\
  \ param_pages > 100 THEN\n    SET param_message = 'the number of pages is too big';\n\
  \  ELSE\n    UPDATE book SET page_count = page_count + param_pages WHERE isbn=param_isbn;\n\
  \    SET param_message = 'success';\nEND IF;\nEND$$\n--\n-- Functions\n--\nCREATE\
  \ DEFINER=`marc`@`%` FUNCTION `get_country_name`\n(param_country_code CHAR(2)) RETURNS\
  \ varchar(50) CHARSET latin1\nBEGIN\n  DECLARE var_country_name VARCHAR(50) DEFAULT\
  \ 'not found';\n  SELECT description into var_country_name FROM country WHERE code\
  \ = param_country_code;\n  RETURN var_country_name;\nEND$$\n\nDELIMITER ;\n```\n\
  \n## 触发器\n\n触发器是我们关联到表上的代码，在某些操作发生时执行——例如在 book 表中进行新的 INSERT 之后。该操作不需要在 phpMyAdmin\
  \ 内部发生。\n\n与与整个数据库相关的且在数据库结构页面可见的例程相反，每个表的触发器都从该特定表的结构页面访问。\n\n> 在 MySQL 5.1.6 之前，我们需要\
  \ SUPER 权限来创建和删除触发器。在 5.1.6 版本中，TRIGGER 表级权限被添加到权限系统中。因此，用户不再需要强大的 SUPER 权限来执行这些任务。\n\
  \n为了执行以下练习，我们需要在 author 表中添加一个新 INT 列——total_page_count。\n\n这里的想法是，每次创建新书时，其页数将被加到作者的总页数中。我知道有些人可能会主张在这里不保留单独的总计列，而是在需要时每次都计算总计。事实上，在现实世界中处理这种情况时必须做出设计决策。我们是否需要非常快速地检索总页数，例如用于网页目的？而从包含数千行的生产表中计算该值的响应时间是多少？无论如何，由于我需要它作为示例，这里做出设计决策很容易。\n\
  \n不要忘记，在将其添加到表结构之后，total_page_count 列应最初用正确的总数进行初始化。（然而，这不是我们触发器的目的。）\n\n## 手动创建触发器\n\
  \n当前 phpMyAdmin 版本没有触发器创建的界面。因此，我们在查询框中输入触发器定义，特别注意在分隔符框中输入 //：\n\n```\nCREATE TRIGGER\
  \ after_book_insert AFTER INSERT ON book\nFOR EACH ROW\nBEGIN\n  UPDATE author\n\
  \    SET total_page_count = total_page_count + NEW.page_count\n    WHERE id = NEW.author_id;\n\
  END\n```\n\n之后，我们的 book 表的结构页面在“详细信息”滑块下显示一个新的“触发器”部分，可像例程一样使用，以编辑或删除触发器：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_290_0.png)\n\
  \n## 测试触发器\n\n与测试存储过程或函数相反，没有 CALL 序列，也没有 SELECT 语句中的函数来执行触发器。只要定义的 operation（book\
  \ INSERT）发生，代码就会执行（在我们的例子中，在插入之后）。因此，我们只需插入一本新书即可看到 author.total_page_count 列已更新。\n\
  \n当然，对该列进行完全自动管理将涉及在 book 表上创建 AFTER UPDATE 和 AFTER DELETE 触发器。\n\n\n\n## 信息架构\n\
  \n在 SQL:2003 标准中，对数据字典（或数据库元数据）的访问由一个名为 information_schema 的结构提供。由于这是标准的一部分，并且已存在于其他数据库系统中，将此功能实现到\
  \ MySQL 中的决定是非常好的。\n\n> MySQL 添加了一些标准中没有的信息——例如，INFORMATION_SCHEMA.COLUMNS.COLUMN_TYPE。请注意，如果您计划在软件项目中使用此信息，它必须保持对其他\
  \ SQL 实现的可移植性。\n\nphpMyAdmin 用户将 information_schema 看作是一个普通的数据库，其中包含视图，用于描述托管在此服务器上的数据库结构的许多方面。以下是可以看到的一个子集（事实上，对此数据库的唯一可能操作是\
  \ SELECT）。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_291_0.png)\n\n在内部，phpMyAdmin\
  \ 在检索元数据时，对其某些操作调用 information_schema 而不是相应的 SHOW 语句。然而，phpMyAdmin 开发者注意到——并且在 2007\
  \ 年 MySQL 用户大会上其他开发者也证实了这一点——当服务器托管数百个数据库或表时，涉及 information_schema 上 WHERE 子句的一些\
  \ SELECT 操作非常缓慢（等待时间长达数分钟）。因此，在 MySQL 的当前状态下，在我们的编程项目中使用此功能时必须谨慎。\n\n$cfg['Servers'][$i]['hide_db']\
  \ 参数可用于将此“数据库”隐藏给可能会因突然出现一个自己一无所知的数据库而感到困惑的用户。这可能取决于他们在 MySQL 方面的专业水平。在 phpMyAdmin\
  \ 的多用户安装中，我们无法让每个人都满意此参数的值。\n\n## 性能分析\n\n在 MySQL 5.0.37 和 5.1.28 版本中添加了分析支持。我们之前看到分析复选框出现在查询结果中。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_292_0.png)\n\n当此框被选中时，phpMyAdmin 将分析每个查询（包括当前查询），并显示每个\
  \ MySQL 内部操作的执行时间报告。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_292_1.png)\n\n\
  尽管分析系统可以报告有关操作的额外信息（例如，CPU 时间，甚至内部服务器的函数名称），phpMyAdmin 目前仅显示操作的名称及其持续时间。\n\n## 分区\n\
  \n用户定义的分区（http://dev.mysql.com/doc/refman/5.1/en/partitioning.html）在 MySQL 5.1 中提供。在\
  \ phpMyAdmin 中使用此功能需要了解其语法，因为有许多分区类型。此外，对于每种分区类型，分区的数量和与每个分区关联的值过于随机，无法在 Web 界面上轻松表示。\n\
  \n## 表创建\n\n让我们通过创建一个名为 test 的表来尝试一下，该表包含一个字段。在表创建面板上，如果连接到 MySQL 5.1 服务器，phpMyAdmin\
  \ 会显示一个 PARTITION 定义对话框：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_293_0.png)\n\
  \n在这里，我们输入一个 PARTITION BY RANGE 子句，它将在 id 列上创建分区。\n\n## 操作\n\n对于已定义分区的表，Operations\
  \ 子页面显示一个分区维护对话框，我们可以在其中：\n\n- 选择一个分区然后要求对其执行诸如 Rebuild 之类的操作\n- 删除所有分区\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_294_0.png)\n\
  \n## 导出\n\n最后，以 SQL 模式导出此 test 表会产生带有嵌入注释的语句，MySQL 5.1 服务器会识别并解释这些语句以重新创建相同的分区。\n\
  \n```\nCREATE TABLE `test` (\n  `id` int(11) NOT NULL\n) ENGINE=MyISAM DEFAULT CHARSET=latin1\n\
  /*!50100 PARTITION BY RANGE (id)\n(PARTITION p0 VALUES LESS THAN (1000) ENGINE =\
  \ MyISAM,\n PARTITION p1 VALUES LESS THAN (2000) ENGINE = MyISAM,\n PARTITION p2\
  \ VALUES LESS THAN (3000) ENGINE = MyISAM) */;\n```\n\n## 事件调度器\n\n事件调度器（http://dev.mysql.com/doc/refman/5.1/en/events.html），MySQL\
  \ 5.1 的另一个新功能，允许创建将根据计划自动运行的任务。计划非常灵活，例如，可以让一个语句从 2011 年 5 月 18 日午夜开始每十秒运行一次。这些可以是一次性事件或循环事件。\n\
  \n## 激活调度器\n\n我们应该首先验证调度器是否在我们的服务器上处于活动状态。如果不是，我们需要激活它。否则，什么都不会发生！我们首先在查询框中输入以下语句：\n\
  \n```\nSHOW VARIABLES LIKE `event%`;\n```\n\n接下来，我们查找名为 event_scheduler 的变量。如果此变量设置为\
  \ OFF，我们需要要求系统管理员（或拥有 SUPER 权限的人）执行以下语句：\n\n```\nSET GLOBAL event_scheduler = ON;\n\
  ```\n\n## 授予 EVENT 权限\n\n每个想要创建或删除事件的用户都需要 EVENT 权限，要么是全局的，要么是在他/她计划添加事件的数据库上。请参阅第\
  \ 18 章，了解授予此类权限的详细信息。\n\n## 创建事件\n\n当前的 3.1.x phpMyAdmin 版本没有用于选择 CREATE EVENT 语句各个部分的\
  \ Web 界面。因此，唯一剩下的方法是使用 SQL 查询框输入语句并了解其语法！这里，我们将使用一个完全虚构的示例：\n\n```\nCREATE EVENT\
  \ add_page_count\n    ON SCHEDULE\n        EVERY 1 MINUTE\n    DO\n        UPDATE\
  \ author set total_page_count = total_page_count + 1 WHERE id = 1;\n```\n\n现在，您可以通过不时浏览\
  \ author 表来获得一些乐趣，并看到 author 1 的计数器在递增。\n\n## 事件操作\n\n事件与一个数据库相关，这就是为什么您会在 marc_book\
  \ 数据库的结构页面上看到一个 Events 滑块。激活它会显示此面板：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_295_0.png)\n\
  \n事实上，这是一个循环事件。我们可以使用第一个图标来编辑事件（这将具有删除并重新创建事件的效果），并使用 X 图标将其删除。\n\n## 导出\n\n通过在\
  \ Add CREATE PROCEDURE/ FUNCTION / EVENT 选项旁边打勾，可以在 SQL 数据库导出的末尾生成与事件相关的语句。请记住，一些事件可能有结束时间；因此，它们可能在您创建它们和您尝试导出之间已经消失！\n\
  \n## BLOB 流式传输\n\n从 3.1.0 版本开始，phpMyAdmin 支持 MySQL 的可扩展 BLOB 流式传输基础设施。http://blobstreaming.org\
  \ 网站解释了该项目的目标。请注意，其某些文档涉及命令行实用程序，这些实用程序在 phpMyAdmin 等 Web 界面的上下文中几乎没有或没有用处。在继续阅读之前，您应该熟悉\
  \ BLOB 流式传输术语，例如存储库和字段引用。\n\n在本节中，我们将使用此技术上传一部电影并在 phpMyAdmin 中从流式传输中观看它。\n\n##\
  \ 系统要求\n\nphpMyAdmin 中所选的实现方法依赖于以下所有组件：\n\n- MySQL 5.1\n- PBXT（PrimeBase XT 存储引擎）\n\
  - PBMS（PrimeBase Media Streaming）\n\nPBXT 是一个支持流式传输的存储引擎。虽然通过 PBMS UDF 支持其他非流式传输存储引擎，但此机制未在\
  \ phpMyAdmin 中实现。\n\n所需组件的存在可以从 phpMyAdmin 的主页上通过单击 Engines 链接并查找以下行来验证：\n\n```\n\
  PBXT / High performance, multi-versioning transactional engine\nPBMS / The Media\
  \ Stream engine for MySQL\n```\n\n如果这些行不存在，请按照 http://www.primebase.org 上的说明安装 PBXT，或按照\
  \ BLOB Streaming 网站上的说明安装 PBMS。\n\n> 您不会在表的 **Operations** 子页面存储引擎选择中看到 PBMS。PBMS\
  \ 不是可以与表结构关联的存储引擎。\n\n## 配置\n\n一些 PBMS 系统变量会影响 BLOB 流式传输行为，可以在 `config.inc.php`\
  \ 中定义。有关它们的更多详细信息请参阅 http://blobstreaming.org/documentation/#sysvar。要放入服务器定义中的推荐值是：\n\
  \n```\n$cfg['Servers'][$i]['bs_garbage_threshold'] = 50;\n$cfg['Servers'][$i]['bs_repository_threshold']\
  \ = '32M';\n$cfg['Servers'][$i]['bs_temp_blob_timeout'] = 600;\n$cfg['Servers'][$i]['bs_temp_log_threshold']\
  \ = '32M';\n```\n\n## phpMyAdmin 中的实现限制\n\n在当前的 3.1.1 版本的 phpMyAdmin 中，使用 BLOB 流式传输存在一些限制。第一个限制与\
  \ MySQL 服务器有关。在刚刚启动的服务器上，全局 MySQL 变量 `pbms_field_references` 可能设置为 **off**。由于字段引用在\
  \ BLOB 引用中被广泛使用，phpMyAdmin 尝试将参数设置为 on，而这只能由拥有 SUPER 权限的用户完成。因此，此类用户必须通过 phpMyAdmin\
  \ 登录一次以将此参数设置为适当的值，并且每次 MySQL 服务器重新启动时都必须重复此操作。\n\n第二个限制与用于将数据发送到 BLOB 存储库的上传机制有关。数据必须首先从工作站传输到\
  \ Web 服务器，然后从 Web 服务器传输到 MySQL 服务器。第一次传输通过正常的 HTTP 上传进行。请参阅第 8 章 *导入结构和数据* 中的 *传输限制*\
  \ 部分，了解有关上传要求的更多详细信息。为了避免被此限制阻碍，您可以使用 Web 服务器上传目录（也在第 8 章中描述）。\n\n> 这里需要说明一个关于主机名的重要注意事项：在\
  \ `config.inc.php` 中，您服务器名称在 `$cfg['Servers'][$i]['host']` 中应为 **FQDN（完全限定域名）**。它不应该是诸如“localhost”之类的名称；否则，用于检索流式传输数据的链接将无法工作。\n\
  \n\n\n## 创建 PBMS 系统表\n\n如果所有要求都已满足，我们可以进入 Operations 子页面中的 marc_book 数据库。我们应该会看到一个\
  \ BLOB Repository 对话框、一个 Status: Disabled 消息以及一个 Enable 按钮。我们现在需要点击 Enable 来在此数据库内部创建\
  \ PBMS 系统表。PBMS 需要两个系统表（pbms_repository 和 pbms_reference），以及另一个（pbms_custom_content_type）用于\
  \ phpMyAdmin 的内部需求。\n\n创建后，我们会在同一页面看到 Status: Enabled，但看不到新创建的系统表。通常，这些表在 phpMyAdmin\
  \ 内部保持不可见，因为用户不应直接操作它们。\n\n我们还看到一个 Disable 按钮。点击它会显示一个警告：\n\n> 你即将禁用一个 BLOB Repository！你确定要禁用数据库\
  \ marc_book 的所有 BLOB 引用吗？\n\n确认此警告消息会使 PBMS 忘记此数据库中的所有 BLOB 引用，这最终会删除从此数据库引用的所有\
  \ BLOB 流数据（如果该数据没有来自其他数据库的其他引用）。\n\n## 表准备\n\n对于本次练习，我们将使用 book.cover_photo 列，并使用\
  \ LONGBLOB 来保存 BLOB 引用（请记住，流数据本身位于 BLOB 仓库中，而 LONGBLOB 列仅用于包含引用）。我们确保 book 表使用 PBXT\
  \ 存储引擎，如果不是这样，我们只需转到该表的 Operations 并更改引擎，如第 10 章所述。\n\n> 目前，使用 LONGBLOB 作为 BLOB\
  \ 引用是 PBXT 的要求。\n\n## 上传到 BLOB 仓库\n\n我们终于准备好尝试第一次向仓库上传。在 book 表中，我们访问 Insert 面板（或编辑现有行）。注意\
  \ cover_photo 列对话框中的新的 Upload to BLOB repository 选项：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_298_0.png)\n\
  \n有人可能会问为什么会显示这个新选项。毕竟，我们不是想上传到 BLOB 仓库吗？也许！但由于此 LONGBLOB 列也可能保存常规数据，因此存在两种可能性：\n\
  \n- 点击 **Upload to BLOB repository** 选项，然后浏览文件或在 Web 服务器上传目录中选择一个文件。这将把文件发送到仓库以便稍后流式传输。\n\
  - 不点击该选项，从而将数据直接发送到此列（不用于稍后流式传输）。\n\n显然，我们选择第一个选项并上传我们喜欢的电影（我们可以先尝试一个较短的）。如果上传成功，我们会看到类似以下的查询：\n\
  \n```\nUPDATE `marc_book`.`book`\nSET `cover_photo` = '~*marc_book/~1-150-15591197-0*3907219'\n\
  WHERE `book`.`isbn` = '1-234567-22-0' LIMIT 1;\n```\n\n这里，cover_photo 被更新为 BLOB\
  \ 引用，由 PBMS 存储引擎生成的一个数字。\n\n## 从仓库流式传输数据\n\n当浏览我们的表并查看我们已向 BLOB 仓库上传的行时，我们会在 cover_photo\
  \ 列下，根据数据格式，看到以下其中一条消息：\n\n- View image\n- Play audio\n- View video\n- Download\
  \ file\n\n点击显示的消息会直接从服务器的 8080 端口向浏览器流式传输，并发送适当的 MIME 类型以告知浏览器应期望的格式。\n\n我们还看到已上传数据的\
  \ MIME 类型（此处为 video/mp4）。\n\n|  |  |  | 1-234567-22-0 | Future souvenirs | 200 |\
  \ 2 | en |  | video/mp4 (Download file) |\n|---|---|---|---|---|---|---|---|---|---|\n\
  | □ |  | X | 1-234567-22-0 | Future souvenirs | 200 | 2 | en |  | video/mp4 (Download\
  \ file) |\n\n## 更改仓库数据\n\n如果上传数据的 MIME 类型未被正确解释，可以通过点击此链接并输入正确的类型来修改它。请注意，此功能在 3.1.1\
  \ 版本中仍在开发中。\n\n最后，在编辑此行时，我们会看到 **Remove BLOB Repository Reference** 选项。在此选项上打勾并保存行会告诉\
  \ PBMS 引擎忘记此引用，最终从仓库中消除 BLOB 数据。\n\n## 摘要\n\nMySQL 5.0 的新功能帮助产品符合标准。尽管 phpMyAdmin\
  \ 对这些功能的支持有限（尤其是缺乏面向语法的编辑器），但它提供了一组基本功能来处理视图、例程、触发器和 information_schema，并显示分析信息。phpMyAdmin\
  \ 还支持 MySQL 5.1 分区和事件、PBXT 存储引擎以及 BLOB 流式传输。下一章介绍 MySQL 服务器的管理员，重点是用户账户和权限的管理。\n"
- '# 18 MySQL 服务器管理


  ## MySQL 服务器管理


  本章将讨论系统管理员如何使用 phpMyAdmin 服务器管理功能进行日常用户账户维护、服务器验证和服务器保护。非管理员也可以从 phpMyAdmin 获取服务器信息。


  服务器管理主要是通过 Server 视图进行的，可通过 phpMyAdmin 主页上的菜单标签访问。


  ## 用户和权限管理


  **Privileges** 子页面（仅在以特权用户登录时可见）包含用于管理 MySQL 用户账户的对话框。它还包含用于在全局、数据库和表级别管理权限的对话框。此子页面是分层的。例如，在编辑用户的权限时，我们可以看到全局权限以及数据库特定的权限。然后我们可以深入查看此数据库-用户组合的表特定权限。


  ## 用户概览


  进入 **Privileges** 子页面时显示的第一个页面称为 **User overview**。它显示所有用户账户及其全局权限的摘要，如下图所示：


  ## MySQL 服务器管理


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_302_0.png)


  从此页面，我们可以：


  - 使用用户行上的 **Edit** 链接编辑用户的权限

  - 使用复选框通过 **Remove selected users** 对话框删除用户

  - 访问提供 **Add a new User** 对话框的页面


  显示的用户列表具有以下特征的列：


  - **User**：我们正在定义的用户账户。

  - **Host**：此用户账户将连接到 MySQL 服务器的机器名称或 IP 地址。此处的值为 % 表示所有主机。

  - **Password**：如果定义了密码则包含 **Yes**，如果没有则包含 **No**。密码本身无法从 phpMyAdmin 界面看到，也无法通过直接查看
  `mysql.user` 表看到，因为它使用单向哈希算法进行混淆。

  - **Global privileges**：为每个用户列出。

  - **Grant**：如果用户可以将自己的权限授予他人，则包含 **Yes**。


  ## 权限重载


  在 User Overview 底部，显示以下消息：


  > 注意：phpMyAdmin 直接从 MySQL 的权限表获取用户的权限。如果这些表的内容因手动更改而与服务器使用的权限不同，则应继续之前重新加载权限。


  这里，**reload the privileges** 可以点击。有效的权限（服务器基于其进行访问决策的权限）是位于服务器内存中的权限。从 **User overview**
  页面进行的权限修改同时在内存和磁盘上的 mysql 数据库中进行。直接对 mysql 数据库所做的修改不会立即生效。**reload the privileges**
  操作从数据库读取权限并使其在内存中生效。


  ## 添加用户


  **Add a new User** 链接会打开一个用于创建用户账户的对话框。首先，我们看到描述账户本身的面板。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_303_0.png)


  **Add a new User** 对话框的第二部分是指定此用户的全局权限的位置，这些权限适用于整个服务器（参见 *Global privileges* 部分）。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_303_1.png)




  ## 用户名


  用户名菜单提供两个选项。我们可以选择“使用文本字段”并在框中输入用户名，或选择“任意用户”来创建匿名用户（空白用户）。让我们选择“使用文本字段”并输入 bill。


  ## 主机


  默认情况下，此菜单设置为“任意主机”，主机值为 %。 “本地”选项表示“localhost”。 “使用主机表”选项（会在主机字段中创建空白值）表示在 mysql.hosts
  表中查找数据库特定权限。选择“使用文本字段”允许我们输入想要的确切主机值。让我们选择“本地”。


  ## 密码


  即使可以不使用密码创建用户（使用“无密码”选项），最好还是设置密码。我们必须输入两次（因为看不到输入内容）以确认预期的密码。让我们输入 bingo。


  一些管理员更喜欢通过让 phpMyAdmin 自己生成密码来提高安全性。在“生成密码”对话框中，点击“生成”会在屏幕上显示一个随机密码（明文）。此时，我们应记下密码以便转交给用户。然后点击“复制”会将此密码填入“密码”和“重新输入”字段。


  ## 数据库创建和权限


  一种常见惯例是为用户分配与其同名的数据库的权限。为此，“用户数据库”部分提供复选框“创建与名称相同的数据库并授予所有权限”。点击此复选框可自动完成流程，同时创建数据库和相应的权限。请注意，使用此方法，每个用户将仅限于一个数据库（用户
  bill，数据库 bill）。


  另一种可能性是允许用户创建与用户名具有相同前缀的数据库。因此，另一个选项“在通配符名称上授予所有权限（username\_%）”通过分配通配符权限来实现此功能。这样设置后，用户
  bill 就可以创建数据库 bill_test、bill_2、bill_payroll 等；phpMyAdmin 在此情况下不会预先创建数据库。


  ## 全局权限


  全局权限决定用户对所有数据库的访问权限。因此，这些权限有时被称为“超级用户权限”。除非有充分理由，否则普通用户不应拥有这些权限中的任何一个。


  当然，如果我们确实要创建超级用户，我们将选择他/她需要的每个全局权限。这些权限进一步分为 **Data**、**Structure** 和 **Administration**
  组。


  在我们的示例中，**bill** 不会有任何全局权限。


  ## 资源限制


  我们可以限制该用户在此服务器上使用的资源（例如，每小时最大查询数）。零表示无限制。我们不会对 **bill**   imposing 任何资源限制。


  以下屏幕截图显示了屏幕的状态，就在点击 **Go** 创建此用户定义之前（剩余字段设置为默认值）：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_305_0.png)


  ## 编辑用户


  编辑用户的页面在用户创建后出现，或在用户概览页面中点击某个用户的“编辑”时出现。此页面上有四个部分，每个部分都有自己的 Go 按钮。因此，每个部分独立操作，具有不同的用途。


  ## 编辑权限


  编辑用户权限的部分与“添加新用户”对话框的外观相同，用于查看和更改全局权限。


  ## 数据库特定权限


  在此部分，我们定义用户有权访问的数据库及其确切权限。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_306_0.png)


  如上图所示，我们看到 None，因为我们尚未定义任何权限。定义数据库权限有两种方法。首先，我们可以从下拉菜单中选择一个现有数据库。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_306_1.png)


  这仅为所选数据库分配权限。我们也可以选择 **Use text field** 并输入数据库名称。我们可以插入一个不存在的数据库名称，以便该用户稍后创建它（前提是在下一面板中给予他/她
  CREATE 权限）。我们还可以使用特殊字符，例如下划线和百分号作为通配符。


  例如，在此处输入 **bill** 将使他能够创建 **bill** 数据库，而输入 **bill%** 将使他能够创建以 **bill** 开头的任何名称的数据库。对于我们的示例，我们将输入
  **bill**。


  下一个屏幕用于设置 **bill** 在 **bill** 数据库上的权限并创建表特定权限。


  要了解特定权限的含义，我们可以将鼠标移到权限名称上（权限名称始终为英文），当前语言中会显示有关该权限的解释。我们为 **bill** 在此数据库上授予 **SELECT,
  INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, and DROP** 权限。然后点击 **Go**。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_307_0.png)


  分配权限后，界面仍停留在同一位置，以便我们进一步细化这些权限。目前我们无法分配表特定权限，因为数据库尚未存在。


  返回 **bill** 的常规权限页面的方法是点击 **''bill''@''localhost''** 标题。


  这会带我们回到熟悉的页面，除了一个部分发生变化。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_308_0.png)


  我们看到用户 **bill** 在 **bill** 数据库上的现有权限（我们可以 **Edit** 或 **Revoke**），并且可以为 **bill**
  在另一个数据库上添加权限。我们还看到 **bill** 在 **bill** 数据库上没有表特定权限。


  ## 更改密码


  此对话框是 **Edit user** 页面的组成部分，我们可以使用它来更改 **bill** 的密码或删除它。删除密码将使 **bill** 能够无需密码登录。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_308_1.png)


  ## 更改登录信息或复制用户


  此对话框可用于更改用户的登录信息，或将他的/她的登录信息复制到新用户。例如，假设 Bill 打电话告诉我们，他更喜欢登录名 **billy** 而不是 **bill**。我们只需在用户名后添加
  y，选择 **Local** 作为主机，并选择 **delete the old one from the user tables**。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_309_0.png)


  此操作后，bill 在 mysql 数据库中不再存在。此外，他的所有权限，包括对 bill 数据库的权限，都将被转移到新用户 billy。但 bill 的用户定义仍存在于内存中，因此仍然有效。如果我们改为选择
  delete the old one from the user tables and reload the privileges afterwards 选项，bill
  的用户定义将立即失效。


  或者，我们也可以基于 bill 创建另一个用户，使用 keep the old one 选项。我们可以通过选择 Do not change the password
  将密码转移到新用户，或通过输入两次新密码来更改它。revoke all active privileges... 选项会立即终止该用户如果已登录时的有效当前权限。


  ## 删除用户


  这是在权限页面的用户概览部分完成的。我们选择要删除的用户。然后（在 Removing selected users 中）我们可以选择 Drop，以删除与我们正在删除的用户同名的任何数据库。点击
  Go 会有效地删除所选用户。


  ## 数据库信息


  数据库子页面旨在快速获取每个数据库的权限信息。可选地，它还可用于在无需点击导航面板中每个数据库的情况下获取这些数据库的全局统计信息。当我们进入数据库子页面时，会看到现有数据库的列表。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_310_0.png)


  我们还看到一个 Enable Statistics 链接。默认情况下，统计信息未启用，因为计算所有数据库中所有表的大小和索引的大小可能会消耗宝贵的 MySQL
  服务器资源。


  ## 启用统计


  如果我们点击此 Enable Statistics 链接，会出现一个修改后的页面。对于每个数据库，我们会得到该数据库中表的默认排序规则，以及表数量和所有表的总行数。接下来，给出表数据部分使用的空间信息，然后是所有索引占用的空间和所有表的总空间。最后，在
  Overhead 下呈现通过优化该数据库中的某些表可以收回的空间。





  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_311_0.png)


  ## 排序统计


  默认情况下，列表按数据库名称按升序排序。如果我们需要找到表最多的数据库或占用空间最多的数据库，只需单击 Tables 或 Total 列标题即可相应地进行排序。再次单击则会反转排序顺序。


  ## 检查数据库权限


  单击“检查权限”图标会显示特定数据库上的所有权限。用户的全局权限可能会在此处显示，因为它也赋予其访问此数据库的权限。我们还可以查看特定于此数据库的权限。“编辑”链接会带我们进入另一个页面，用于编辑用户的权限。


  有权访问“marc_book”的用户


  | 用户 | 主机 | 类型 | 权限 | 授权 | 操作 |

  |------|------|------|------------|-------|--------|

  | admin | % | global | ALL PRIVILEGES | Yes | |

  | marc | % | wildcard: marc% | SELECT, INSERT, UPDATE, DELETE, CREATE, DROP | No
  | |

  | root | % | global | ALL PRIVILEGES | Yes | |


  ## 删除选定的数据库


  这是一项不应轻率对待的操作。要删除一个或多个数据库，我们在要删除的数据库名称旁放置复选标记，然后单击“已选择”旁边的红色 X。然后我们会看到一个确认屏幕。


  ## 服务器信息


  状态、变量和进程菜单选项卡可用于获取有关 MySQL 服务器的信息，或对特定进程进行操作。


  ## 服务器状态验证


  这些统计数据反映了 MySQL 服务器的总活动，包括（但不限于）phpMyAdmin 发送的查询产生的活动。


  ## 通用状态页面


  单击“状态”链接会生成有关服务器的运行时信息。该页面包含多个部分。首先，我们会获得已用运行时间和启动时间的信息。然后我们会获得流量和连接的总数和平均值（其中 ø
  表示平均值）。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_312_0.png)


  接下来，显示有关查询的统计信息（此处仅部分显示）。每小时、每分钟和每秒的平均查询数可很好地反映服务器负载。


  随后是每个 MySQL 命令的统计信息，包括绝对次数、每小时平均值以及占总数的百分比。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_312_1.png)


  根据 MySQL 版本的不同，还会显示包含服务器信息的许多其他部分。


  ## InnoDB 状态


  在支持 InnoDB 的服务器上，**InnoDB 部分**末尾会出现一个链接。单击该链接后，会显示有关 InnoDB 子系统 的信息，包括最近一次发生的 InnoDB
  错误的信息。


  ```

