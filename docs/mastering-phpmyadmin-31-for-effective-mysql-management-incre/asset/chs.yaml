  ## 摘要


  本章解释了如何创建数据库和表，以及如何手动在表中输入数据。它还介绍了如何通过使用浏览模式来确认数据的存在，其中包括 SQL 查询链接、导航栏、排序选项和行标记。


  下一章将解释如何编辑数据行，并涵盖删除行、表和数据库的各个方面。

