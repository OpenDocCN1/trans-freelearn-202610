  \ MySQL Developers Guild 的成员。他于 1998 年 12 月开始为这个流行的 MySQL Web 界面做出贡献，当时他制作了其第一个多语言版本。作为一名开发人员和项目管理员，他自\
  \ 2001 年以来一直积极参与该软件项目。\n\n自 1980 年以来，Marc 在加拿大魁北克谢布鲁克的 Cegep de Sherbrooke 工作，担任应用程序程序员和网络管理员。他还教授网络、安全以及\
  \ PHP/MySQL 应用程序开发。在他的其中一门课程中，他很高兴遇到了来自阿根廷的 phpMyAdmin 用户。Marc 与妻子住在谢布鲁克，他们喜欢与四个孩子共度时光。\n\
