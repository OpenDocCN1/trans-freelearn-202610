  ## 服务器变量


  Variables 子页面显示 MySQL 服务器的各种设置，这些设置可以在例如 my.cnf MySQL 配置文件中定义。这些值无法在 phpMyAdmin
  中更改。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_314_0.png)


  ## 服务器进程


  Processes 子页面可供超级用户和普通用户使用。普通用户只能看到属于他/她的进程，而超级用户可以看到所有进程。


  此页面列出服务器上的所有活动进程。有 Kill 链接，允许我们终止特定进程。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_314_1.png)


  此示例中只有一个正在运行的进程——即 SHOW PROCESSLIST 命令本身创建的进程。由于我们在看到页面时该进程已不再运行，因此该进程无法被终止。通常情况下，服务器上会运行更多进程。


  ## 存储引擎


  有关各种存储引擎的信息以两级格式提供。首先，Engines 选项卡显示当前 MySQL 版本可能使用的引擎概览。此服务器上已启用的引擎名称可点击。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_315_0.png)


  单击某个引擎名称会显示其设置的详细面板。将鼠标悬停在上标数字上会显示有关特定设置的更多信息。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_315_1.png)


  ## 可用的字符集和排序规则


  主页上的 **字符集** 菜单选项卡会打开 Server 视图中的 **字符集** 子页面，其中列出了 MySQL 服务器支持的字符集和排序规则。每个字符集的默认排序规则会以不同的背景颜色显示（使用
  `$cfg[''BrowseMarkerColor'']` 中定义的行标记颜色）。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_316_0.png)


  ## 二进制日志


  如果 MySQL 的二进制日志在我们的服务器上处于活动状态，则 Server 视图中的菜单会更改，以便出现 **二进制日志** 选项卡。此选项卡通过 `SHOW
  BINLOG EVENTS` 命令提供对界面的访问。此命令生成已更新我们服务器数据的 SQL 语句列表。该列表可能非常庞大，目前 phpMyAdmin 未使用分页技术限制其显示。因此，我们可能会达到浏览器的内存限制，这取决于我们使用的特定浏览器。


  在以下屏幕中，我们选择要检查的二进制日志（除非服务器只有一个二进制日志），然后语句将被显示。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_317_0.png)


  ## 摘要


  本章涵盖了系统管理员可用的各种功能，例如用户账户管理、权限管理、数据库权限检查和服务器状态验证。适当的 MySQL 权限系统知识对于妥善维护 MySQL 服务器至关重要，本章提出了以用户及其权限概念为中心的练习。接下来是附录
  A，其中讲述了 phpMyAdmin 项目的历史。


  ## phpMyAdmin 历史


  本附录详细介绍了 phpMyAdmin 在其十年历史中的诞生和演变。这是一款始于 1998 年的个人业余项目，该软件在功能和参与人数方面都得到了发展。作为这一增长的证明，我能找到的最早的源代码包（版本
  1.1.0）占用了 9 KB，而版本 3.1.2 的大小为 3.4 MB。


  ## 早期事件


  第一个内部版本（0.9.0）由来自瑞士的 Tobias Ratschiller 编程，日期为 1998 年 9 月 9 日。他随后于 1998 年 10 月 26
  日发布了版本 1.0.1。早期版本在 Tobias 的网站 http://www.phpwizard.net 上提供（该网站已不再与其关联）。Tobias 在随附的说明中写道：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_319_0.png)


  > > "这项工作基于 Peter Koppelwieser 的 MySQL-Webadmin。是他的想法使用 PHP3 创建 MySQL 的基于 Web 的界面。虽然我没有使用他的任何源代码，但有一些概念是我借鉴他的。phpMyAdmin
  的创建是因为 Peter 告诉我他不会再进一步开发他的（很棒的）工具。"


  与今天的版本（距原版十年后）相比，第一个版本在功能上 somewhat 有限。尽管如此，它仍可用于创建数据库和表、编辑其结构以及输入和检索数据。在下面的图中，您可以看到左侧面板已就位以列出数据库名称（尚未列出表名称），右侧面板是管理数据库或表的
  workspace。这就是版本 1.3.0 中数据库界面的样子：



  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_320_0.png)


  处理表格时，你会看到以下界面：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_320_1.png)


  我当时使用的是 phpMyAdmin 1.2.0 版本（1998 年 11 月 29 日发布），立刻被能够使用 Web 应用维护远程数据库的想法所吸引。然而，我在加拿大魁北克省谢布鲁克学院工作的学生都是法语使用者。因此，我联系了
  Tobias，提议通过将所有信息外包到一个信息文件中来改造他的源代码。他接受了提议，我创建了英语和法语的信息文件。然后，在 1998 年 12 月 27 日，Tobias
  发布了 1.3.1 版本，这是第一个多语言版本。（同时，他也成功创建了德语信息文件。）


  1999 年及 2000 年上半年，Tobias 改进了导航系统，添加了功能，并合并了更多语言文件。他的项目站点维护着一个讨论论坛，允许提出新想法并讨论补丁。2.1.0
  版本于 2000 年 8 月 6 日发布，这是 Tobias 发布的上一个版本，他已无更多时间投入该项目。


  ## 项目重启


  然而，用户群已经成倍增长，他们要求获得更多产品功能。补丁在互联网上流传，但没有协调方式。第三方已发布安全警报（及修复），但没有发布新版本。最后，在 2001 年
  3 月 31 日，Olivier Müller 在 SourceForge.net 上注册了 phpMyAdmin 项目，并发布了 2.2.0 预发布版本。当时被称为非官方版本。这次项目重启吸引了一些开发者，他们现在有了
  SourceForge 基础设施（CVS 服务器、论坛、错误跟踪器和邮件列表）来加快开发。我个人于 2001 年 5 月重新加入项目，并开始修复和改进代码，就像我的共同开发者一样。


  我们于 2001 年 5 月 28 日成为官方版本，因为 Tobias 接受了我们的版本作为新的官方版本。我记得那几个月非常紧张的开发工作，每天都有改进和错误修复，以及新的文档部分。这项努力在
  2001 年 8 月 31 日达到顶峰，发布了 2.2.0 版本。


  以下是 2.2.0 版本公告文件中的摘录：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_321_0.png)


  > “在五个月、五个 beta 版本和四个候选版本之后，phpMyAdmin 开发者很高兴地宣布 phpMyAdmin 2.2.0 可用。[...] 2001
  年 3 月 31 日。Olivier Müller（瑞士）在 Marc Delisle（魁北克）、Loïc Chapeaux（法国）以及另外八名开发者的支持下，在原包维护者的授权下，在
  SourceForge.net 上重启了 phpMyAdmin 项目。现在，经过五个月的补丁、错误修复、新功能和测试，2.2.0 版本终于准备就绪。”


  该版本包含安全修复和七种新语言（带动态语言检测）。代码已被重构以符合 CSS2 和 XHTML 1.0，并遵循 PEAR 编码规范。书签功能出现在该版本中，这来自名为“phpMyBookmark”的独立插件。


  在随后的一年里，开发继续进行，发布了七个次要版本。2.2.x 系列的最后一个版本是 2.2.7-pl1，它也是最后一个在 PHP 3 下完全测试的版本。我们于
  2002 年 4 月 3 日注册了 phpmyadmin.net 作为项目的官方域名——这个日期值得注意。


  ## 分发商


  phpMyAdmin 的分发商列表太长且复杂，难以收集，但这里有一些提示。首先，MySQL 网站的“下载”页面有一个“contrib”部分，其中在 phpMyAdmin
  诞生后不久就提到了它。此外，许多如果不是全部的 Linux 分发商都在其套件中包含了 phpMyAdmin。最后，一些打包构建者为各种平台准备套件。我只提一下
  Apache Friends 的著名 XAMPP 套件，可在 http://www.xampp.org 获取。早在 2002 年中，Apache Friends
  小组就已经忙于集成 Apache、PHP、MySQL 和 phpMyAdmin。


  ## 演进


  2002 年 8 月 11 日，2.3.0 版本发布。由于新功能太多，页面变得过长。因此，该版本是“大拆分版本”，创建子页面以将相关功能分组，从而增强数据库和表格视图。


  团队开始每两个月发布一个新次要版本（2.3.1、2.3.2……）的计划。2.4.0 版本于 2003 年 2 月 23 日发布，包含新的服务器/用户管理功能。然后是
  2003 年 5 月 11 日发布的 2.5.0 版本，以标记新的 MIME 类型单元格转换系统。


  2.6.0 版本于 2004 年 9 月 27 日发布，增加了对 PHP 5 中可用的新 mysqli 扩展的支持，以获得更好的性能和改进的安全性。该版本的界面已重新设计，包括新图标和主题管理器。本书中解释了所有这些功能。2005
  年 4 月 16 日，2.6.2 版本诞生，增加了对 MySQL 视图的基本支持。


  2005 年 6 月，phpMyAdmin 开发团队的首次会议在德国卡尔斯鲁厄的 LinuxTag 2005 期间举行。来自瑞士、德国、捷克共和国和加拿大的六名团队成员出席，展示了
  phpMyAdmin 并与活动参与者讨论其功能。我们还在同一场合庆祝了 PHP 和 MySQL 的 10 周年纪念，以及这些产品的各自创始人——Rasmus Lerdorf
  和 Michael “Monty” Widenius。在此之前几周，在圣克拉拉的 MySQL 用户大会上，一场演讲的标题为“PHP 5 + MySQL 5 =
  A Perfect 10”。事实上，我们意识到这一周年纪念在产品成熟度方面意味着什么。


  2.7.0 版本于 2005 年 12 月 4 日发布。通过该版本，我们结束了对旧配置文件的支持——即 phpMyAdmin 2.3.0 之前的配置文件。此外，在
  2.7.0 中，新的基于插件的导入模块首次亮相。


  2.8.0 版本于 2006 年 3 月 6 日发布。它包含了一个新的基于 Web 的设置机制。从 2.8.0 开始，团队开始采用新的版本号方案。2.8 系列仅包含对
  2.8.0 中已存在功能的修复。以下是预计在 2.8.0 之后发布的版本示例：


  - 2.8.0.1，用于紧急事项如安全修复

  - 2.8.1，包含 2.8 系列的常规修复

  - 2.9.0，包含新功能


  2.9.0 版本于 2006 年 9 月 20 日发布，增加了许多小改进，如字体大小选择器、新导出格式以及使用外部身份验证方法的可能性。2.10.0 版本于 2007
  年 2 月 27 日发布，其主要亮点是 Designer——一个基于图形的 Ajax 关系管理器。2.11.0 版本于 2007 年 8 月 21 日发布，提供了创建视图的支持。它还提供了管理存储过程、函数和触发器的支持。


  ## GoPHP5 与 3.x 分支


  phpMyAdmin 最终接受邀请成为 GoPHP5 倡议（见 http://GoPHP5.org）的初始成员。该倡议促进 Web 主机采用 PHP 5。这意味着
  phpMyAdmin 在 2008 年 2 月 5 日之后的新功能发布需要服务器至少运行 PHP 5.2。


  为了更好地体现新的 PHP 要求，团队将主版本号切换为 3。同时，决定在 3.x 分支中停止支持 MySQL 5.0 之前的版本。


  3.0 版本于 2008 年 9 月 27 日发布，支持 MySQL 5.1 功能，如分区和事件调度器。该版本还具有新的起始页面并使用 JavaScript 效果。然后，在
  2008 年 11 月 11 日，3.1 版本整合了新的设置脚本和 BLOB 流支持——这是 Google Summer of Code 2008 两名学生的成果。该版本还增加了对
  Swekey 硬件身份验证的支持。


  phpMyAdmin 持续流行。自 2001 年 4 月以来，累计下载量在本书撰写时（2009 年 1 月）已达到令人印象深刻的超过一千七百万次。




