  新参数会随版本而出现。它们记录在 Documentation.html 中，并在 libraries/config.default.php 中定义。如果 config.inc.php
  中不存在配置参数，则将使用 libraries/config.default.php 中的值。因此，如果默认值适合我们，就无需在 config.inc.php
  中包含它。


  必须特别注意传播我们可能对 layout.inc.php 文件所做的更改，具体取决于所使用的主题。我们甚至可能需要复制自定义主题子目录，如果我们向结构中添加了自己的主题。


