  我们不仅仅寻找已出版的作者；如果您具备强大的技术技能但没有写作经验，我们经验丰富的编辑可以帮助您发展写作事业，或为您提供专业知识的额外回报。


  ## 关于 Packt Publishing


  Packt，发音为 ''packed''，于 2004 年 4 月出版了第一本书《Mastering phpMyAdmin for Effective MySQL
  Management》，随后继续专注于出版针对特定技术和解决方案的高度聚焦的书籍。


  我们的书籍和出版物分享了您同行的 IT 专业人士在适应和定制当今系统、应用程序和框架方面的经验。我们的解决方案型书籍为您提供定制正在使用的软件和技术的知识和能力，以完成工作。与您过去看到的
