  \        'USER',\n        'CONCAT'\n    ), [...]\n```\n\n如以下屏幕截图所示，我们在保存此行时将 UPPER\
  \ 函数应用于标题：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_114_0.png)\n\n为了节省一些屏幕空间（以便能够看到更多数据），可以通过将\
  \ $cfg['ShowFunctionFields'] 设置为 FALSE 来禁用此功能。此外，Function 列标题是可点击的，因此我们可以即时禁用此功能。\n\
  \n当功能被禁用时——无论是通过点击还是通过配置参数——都会出现一个 Show: Function 链接，以便通过单击显示此 Function 列。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_115_0.png)\n\
  \n## 复制数据行\n\n在数据维护过程中（用于永久复制或测试目的），我们经常需要生成一行的副本。如果在同一表中执行此操作，我们必须遵守键唯一性的规则。\n\n\
  这里举一个例子。我们的作者写了他的关于电影的书的第 2 卷。因此，需要稍作更改的字段是 ISBN、标题和页数。我们将现有行调出屏幕，更改这三个字段，然后选择 Insert\
  \ as new row，如以下屏幕截图所示：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_115_1.png)\n\
  \n当我们点击 Go 时，会创建另一行，其中包含修改后的信息，而原始行保持不变：\n\n|  | isbn | title | page_count | author_id\
  \ |\n|---|---|---|---|---|\n| ☐ ✏️ ❌ | 1-234567-89-0 | 电影百年（第1卷） | 600 | 1 |\n|\
  \ ☐ ✏️ ❌ | 1-234567-22-0 | 未来纪念品 | 200 | 2 |\n| ☐ ✏️ ❌ | 1-234567-90-0 | 电影百年（第2卷）\
  \ | 602 | 1 |\n\n## 多行编辑\n\n多行编辑功能使我们能够在要编辑的行上使用复选框，并在 With selected 菜单中使用 Edit\
  \ 链接（或铅笔形图标）。Check All / Uncheck All 链接也可以用来快速选中或取消选中所有框。我们也可以点击行数据的任何位置来激活相应的复选框。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_116_0.png)\n\n这会打开一个包含所有所选行的 Edit 面板。在编辑过程中，可以查看、比较和更改这些行的数据。\n\
  \n> 当我们用复选框标记一些行时，我们还可以对它们执行另外两个操作——删除（参见本章的 Deleting Many Rows 部分）和导出（参见第 7 章）。\n\
  \n## 编辑下一行\n\n顺序编辑可以在具有整数字段主键的表上进行。我们的 author 表满足条件。让我们看看当我们开始编辑 id 值为 1 的行时会发生什么：\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_117_0.png)\n\n编辑面板出现，我们可以编辑作者编号 1。然而，在下拉菜单中，Edit\
  \ next row 选项可用。如果选择，则下一个作者——主键值大于当前主键值的第一个作者——将可供编辑。\n\n## 删除数据\n\nphpMyAdmin 的界面使我们能够删除以下内容：\n\
  \n- 单个数据行\n- 表的多个行\n- 表中的所有行\n- 多个表中的所有行\n\n## 删除单行\n\n我们可以使用每行旁边的 X 形小图标来删除该行。如果\
  \ $cfg['Confirm'] 的值为 TRUE，则每个 MySQL DELETE 语句在执行前都必须得到确认。这是默认值，因为允许仅通过一次点击就删除一行可能并不明智！\n\
  \n确认的形式取决于浏览器执行 JavaScript 的能力。基于 JavaScript 的确认弹出窗口看起来像以下屏幕截图：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_118_0.png)\n\
  \n如果在浏览器中禁用了 JavaScript，则会出现一个不同的面板。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_118_1.png)\n\
  \n实际的 DELETE 语句将使用所需的信息来确保仅删除预期的行。在我们的例子中，已定义了主键并在 WHERE 子句中使用。在没有主键的情况下，将根据每个字段的值生成更长的\
  \ WHERE 子句。生成的 WHERE 子句甚至可能阻止 DELETE 操作的正确执行，尤其是在存在 TEXT 或 BLOB 字段时。这是因为用于将查询发送到\
  \ Web 服务器的 HTTP 事务的长度可能受到浏览器或服务器的限制。这也是强烈建议定义主键的另一个原因。\n\n## 删除多行\n\n在 phpMyAdmin\
  \ 2.5.4 版本中添加的功能是多行删除。假设我们检查一页行并决定某些行必须被销毁。除了使用 Delete 链接或图标逐一删除它们之外——并且有时删除的决定必须在检查一组行时做出——在\
