  ## Tips for editing config.inc.php on a Windows Client


  此文件包含特殊字符（Unix 风格的行尾）。因此，我们必须使用理解此格式的文本编辑器打开它。如果我们使用错误的文本编辑器，此文件将以非常长的行显示。


  最佳选择是标准的 PHP 编辑器。另一个选择是 WordPad、Metapad 或 UltraEdit。我们应注意不要在文件开头或结尾添加任何字符（即使是空白行）。这会干扰
  phpMyAdmin 的执行并生成 Cannot send header output... 错误消息。如果发生这种情况，请参阅附录 B。


  每次修改 config.inc.php 文件时，都必须再次将其传输到我们的 Web 空间。此传输通过 FTP 或 SFTP 客户端完成。你可以选择使用独立的 FTP/SFTP
  客户端，如 FileZilla，或如果你的 PHP 编辑器支持此功能，则直接通过 FTP/SFTP 保存。


  ## Description of some configuration parameters


  在本章和下一章中，我们将集中讨论处理连接和身份验证的参数。其他参数将在解释相应功能的章节中讨论。


  ### PmaAbsoluteUri


  我们将查看的第一个参数是 $cfg[''PmaAbsoluteUri''] = '''';


  PMA 是 phpMyAdmin 的常用缩写。对于配置参数，所选的约定是首字母大写，在本例中产生 Pma。在其代码的某些位置，phpMyAdmin 发送 HTTP
  Location 头部并必须知道其安装点的绝对 URI。在这种情况下使用绝对 URI 是由 RFC 2616 第 14.30 节要求的。


  在大多数情况下，我们可以将其留空，因为 phpMyAdmin 会尝试自动检测正确的值。如果我们稍后浏览一个表，然后编辑一行并点击保存，我们将收到浏览器发出的错误消息，例如
  This document does not exist。这意味着 phpMyAdmin 为了到达预期页面而构建的绝对 URI 是错误的，表明我们必须在此参数中手动输入正确的值。


  例如，我们会将其更改为：


  ```

  $cfg[''PmaAbsoluteUri''] = ''http://www.mydomain.com/phpMyAdmin/'';

  ```


  ### Server-specific sections


  文件的下一部分包含特定于服务器的配置，每个配置都以以下内容开头：


  ```

  $i++;

  $cfg[''Servers''][$i][''host''] = '''';

  ```


  如果我们只检查正常的服务器参数（其他参数将从第 11 章开始介绍），我们会看到每个服务器看起来像以下部分：


  ```

  $i++;

  $cfg[''Servers''][$i][''host'']      = '''';

  $cfg[''Servers''][$i][''port'']      = '''';

  $cfg[''Servers''][$i][''socket'']    = '''';

  $cfg[''Servers''][$i][''connect_type''] = ''tcp'';

  $cfg[''Servers''][$i][''extension''] = ''mysqli'';

  $cfg[''Servers''][$i][''compress'']  = FALSE;

  $cfg[''Servers''][$i][''controluser''] = '''';

  $cfg[''Servers''][$i][''controlpass''] = '''';

  $cfg[''Servers''][$i][''auth_type''] = ''cookie'';

  $cfg[''Servers''][$i][''user'']      = '''';

  $cfg[''Servers''][$i][''password'']  = '''';

  $cfg[''Servers''][$i][''only_db'']   = '''';

  $cfg[''Servers''][$i][''hide_db'']   = '''';

  $cfg[''Servers''][$i][''verbose'']   = '''';

  ```


  在此部分中，我们必须在 $cfg[''Servers''][$i][''host''] 中输入 MySQL 服务器的主机名或 IP 地址——例如 mysql.mydomain.com
  或 localhost。如果此服务器在非标准端口或套接字上运行，我们在 $cfg[''Servers''][$i][''port''] 或 $cfg[''Servers''][$i][''socket'']
  中填写正确的值。有关套接字的更多详细信息，请参阅 connect_type 部分。


  phpMyAdmin 界面中显示的服务器名称将是 `host` 中输入的名称（除非我们在以下参数中输入非空白值）。例如：


  ```

  $cfg[''Servers''][$i][''verbose''] = ''Test server'';

  ```


  因此，此功能可用于隐藏用户所见的真实服务器主机名。


  ### extension


  PHP 用于与 MySQL 服务器通信的传统机制，如 PHP 5 之前可用的是 mysql 扩展。此扩展在 PHP 5 中仍然可用。然而，已经开发了一个名为 mysqli
  的新扩展，并且由于其改进的性能及其对 MySQL 系列 4.1.x 全部功能的支持，应优先用于 PHP 5。此扩展设计为与 MySQL 版本 4.1.3 及更高版本一起使用。


  在 phpMyAdmin 版本 2.6.0 中，实现了一个新的库。这使得可以使用两个扩展成为可能，为特定服务器选择其中一个。我们在 $cfg[''Servers''][$i][''extension'']
  中指示要使用的扩展。




  ## 持久连接


  另一个重要参数（该参数并非特定于服务器，而是适用于所有服务器定义）是 $cfg[''PersistentConnections'']。对于使用 mysql 扩展连接的每个服务器，当该参数设置为
  TRUE 时，会指示 PHP 保持与 MySQL 服务器的连接打开。这加快了 PHP 与 MySQL 之间的交互。然而，它在 config.inc.php 中默认设置为
  FALSE，因为持久连接通常是服务器资源耗尽的原因。因此你会发现 MySQL 拒绝新的连接。出于这个原因，该选项甚至不适用于 mysqli 扩展。因此，如果你使用此扩展进行连接，将其设置为
  TRUE 也不会产生任何效果。


  ## connect_type、socket 和端口


  mysql 和 mysqli 扩展如果服务器位于 localhost，则会自动使用 socket 连接到 MySQL。考虑以下配置：


  ```

  $cfg[''Servers''][$i][''host'']      = ''localhost'';

  $cfg[''Servers''][$i][''port'']      = '''';

  $cfg[''Servers''][$i][''socket'']    = '''';

  $cfg[''Servers''][$i][''connect_type''] = ''tcp'';

  $cfg[''Servers''][$i][''extension''] = ''mysql'';

  ```


  connect_type 的默认值是 tcp。然而，扩展会使用 socket，因为它认为当主机为 localhost 时这样更高效。因此，在这种情况下，我们可以将
  connect_type 用作 tcp 或 socket。要强制进行真正的 tcp 连接，我们可以在 host 参数中指定 127.0.0.1 而不是 localhost。因为
  socket 参数为空，扩展将尝试默认 socket。如果此默认 socket（在 php.ini 中定义）与分配给 MySQL 服务器的实际 socket 不对应，我们必须将
  socket 名称（例如，/tmp/mysql.sock）放入 $cfg[''Servers''][$i][''socket''] 中。


  如果主机名不是 localhost，将发生 tcp 连接——这里使用特殊端口 3307。然而，留空端口值将使用默认 3306 端口：


  ```

  $cfg[''Servers''][$i][''host'']        = ''mysql.mydomain.com'';


  $cfg[''Servers''][$i][''port'']        = ''3307'';


  $cfg[''Servers''][$i][''socket'']      = "";


  $cfg[''Servers''][$i][''connect_type'']  = ''tcp'';


  $cfg[''Servers''][$i][''extension'']    = ''mysql'';

  ```


  ## 压缩配置


  从 PHP 4.3.0 和 MySQL 3.23.49 开始，用于 PHP 与 MySQL 之间通信的协议允许压缩模式。使用此模式可提供更好的效率。要利用此模式，只需指定：


  ```

  $cfg[''Servers''][$i][''compress''] = TRUE;

  ```


  ## 升级 phpMyAdmin


  通常，升级只是将新版本安装到单独的目录并将上一个版本的 config.inc.php 复制到新目录的问题。如果上一个版本是 phpMyAdmin 2.6.0 或更旧，则无法将其
  config.inc.php 复制到新版本，因为文件格式已更改太多。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_48_0.png)


  > 不应采用的升级路径或首次安装路径是将 libraries/config.default.php 复制到 config.inc.php。这是因为默认配置文件是特定于版本的，并且不能保证适用于未来的版本。


  新参数会随版本而出现。它们记录在 Documentation.html 中，并在 libraries/config.default.php 中定义。如果 config.inc.php
  中不存在配置参数，则将使用 libraries/config.default.php 中的值。因此，如果默认值适合我们，就无需在 config.inc.php
  中包含它。


  必须特别注意传播我们可能对 layout.inc.php 文件所做的更改，具体取决于所使用的主题。我们甚至可能需要复制自定义主题子目录，如果我们向结构中添加了自己的主题。


  ## 摘要


  本章介绍了 Web 作为交付应用程序的手段是如何演变的，以及为什么我们应该使用 PHP/MySQL 来开发这些应用程序。本章还概述了为什么 phpMyAdmin
  被公认为从 Web 接口 MySQL 的领先应用程序，并简要列出了其功能。然后讨论了安装 phpMyAdmin 的常见原因、从主站点下载的步骤、基本配置、将 phpMyAdmin
  上传到我们的 Web 服务器以及升级的相关内容。


  现在基本安装已经完成，下一个章节将深入探讨配置主题，通过探索身份验证和安全方面。


