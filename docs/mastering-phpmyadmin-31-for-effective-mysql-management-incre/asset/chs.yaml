- "# 2 身份验证和安全\n\n## 身份验证和安全\n\n在 phpMyAdmin 中配置身份验证的方式有很多——取决于我们的目标、其他应用程序的存在以及我们需要的[content]\n\
  在 phpMyAdmin 中配置身份验证的方式有很多——取决于我们的目标、其他应用程序的存在以及我们需要的[content]\n安全级别。本章探讨可用的可能性。\n\
  \n## MySQL 身份验证\n\n当我们输入用户名和密码时，虽然看起来我们在登录 phpMyAdmin，但事实并非如此！身份验证系统是 MySQL 服务器的功能。我们只是使用\
  \ phpMyAdmin（在 Web 服务器上运行）作为一个接口，将我们的用户名和密码信息发送到 MySQL 服务器。严格来说，我们不是登录到 phpMyAdmin，而是**通过**\
  \ phpMyAdmin。\n\n这就是为什么在关于 phpMyAdmin 的用户支持论坛中，询问身份验证帮助的人经常被转回他们的 MySQL 服务器管理员，因为丢失的\
  \ MySQL 用户或密码并不是真正的 phpMyAdmin 问题。\n\n本节解释了 phpMyAdmin 提供的各种身份验证模式。\n\n## 无密码的 root\
  \ 用户\n\n在许多情况下，MySQL 的默认安装会使服务器暴露于入侵，因为它创建了一个名为 `root` 且没有密码的 MySQL 账户。为了解决这个问题，phpMyAdmin\
  \ 3.1.0 引入了一个特定于服务器的配置参数，`$cfg['Servers'][$i]['AllowNoPasswordRoot']`，其默认值为 `false`。通常，此指令应保持为\
  \ `false`，以避免通过 phpMyAdmin 进行此类访问，因为黑客正在积极探测 Web 上的不安全 MySQL 服务器。请阅读 *Security*\
  \ 部分以获取有关保护服务器的其他建议。\n\n> > 如果此参数设置为 **false** 且使用 **root** 账户且无密码进行登录尝试，将显示 **Access\
  \ denied** 消息。\n\n## 使用 config 进行单用户身份验证\n\n对于我们的第一个示例，我们将使用 config 身份验证类型，它易于理解。然而，在\
  \ *Multi-user authentication* 部分，我们将看到更强大和多样的身份验证方式。\n\n> > 使用 **config** 身份验证类型会使我们的\
  \ phpMyAdmin 暴露于入侵，除非我们按照本章 *Security* 部分所述对其进行保护。\n\n这里我们请求 config 身份验证，并输入此 MySQL\
  \ 服务器的用户名和密码：\n\n```\n$cfg['Servers'][$i]['auth_type'] = 'config';\n$cfg['Servers'][$i]['user']\
  \      = 'marc';\n$cfg['Servers'][$i]['password']  = 'bingo';\n```\n\n然后我们可以保存我们在\
  \ config.inc.php 中所做的更改。\n\n## 测试连接\n\n现在是启动 phpMyAdmin 并尝试使用我们配置的值进行连接的时候了。这将测试以下内容：\n\
  \n- 我们在配置文件或基于 Web 的设置中输入的值\n- 如果我们进行了手动配置，则 Web 服务器内部 PHP 组件的设置\n- Web 服务器与 MySQL\
  \ 服务器之间的通信\n\n我们启动浏览器并指向安装 phpMyAdmin 的目录，如 http://www.mydomain.com/phpMyAdmin。如果这不起作用，我们尝试\
  \ http://www.mydomain.com/phpMyAdmin/index.php。（这意味着我们的 Web 服务器未配置为将 index.php 解释为默认起始文档。）\n\
  \n如果仍然出现错误，请参阅附录 B 以获取故障排除和支持。我们现在应该看到 phpMyAdmin 的主页。第 3 章概述了现在看到的面板。\n\n## 多用户身份验证\n\
  \n我们可能希望允许 phpMyAdmin 的单个副本被一组人员使用，每个人都有自己的 MySQL 用户名和密码，并且只能看到他们有权访问的数据库。或者我们可能更喜欢避免在\
  \ config.inc.php 中以明文形式保存用户名和密码。\n\n## 提供的身份验证类型\n\n与其依赖存储在 config.inc.php 中的用户名和密码，phpMyAdmin\
  \ 将与浏览器通信并从中获取身份验证数据。这使得所有在特定 MySQL 服务器中定义的用户都可以真正登录，而无需在配置文件中定义它们。有三种模式可供选择，允许通过\
  \ phpMyAdmin 受控登录到 MySQL——http、cookie 和 signon。我们必须选择适合我们特定情况和环境的一种（稍后会详细介绍）。http\
  \ 和 cookie 模式可能要求我们首先定义一个控制用户。\n\n## 控制用户\n\n定义控制用户有两个目的：\n\n- 在版本 4.1.2 之前的 MySQL\
  \ 服务器或使用 --skip-show-database 运行的服务器上，控制用户允许使用多用户身份验证。此方面在本节中描述。\n- 在所有版本的 MySQL\
  \ 服务器上，此用户是使用 phpMyAdmin 的高级关系功能所必需的，这些功能从第 11 章开始描述。\n\n为了能够为每种类型的 MySQL 用户使用身份验证类型（在\
  \ MySQL 中，用户权限可以用各种方式表达），我们应该在服务器的特定于服务器的部分中定义一个控制用户和密码。如果我们不定义一个，则使用 `user`@`hostname`\
  \ 或 `user`@`%` 语法在 MySQL 中定义的用户将能够正常使用 phpMyAdmin 的功能，如创建数据库，而其他用户则不能。\n\n出于身份验证目的，控制用户是一个特殊用户（我们通常为其选择的名称是\
  \ pma），它有权读取特殊 mysql 数据库中的某些字段（其中包含所有用户定义）。phpMyAdmin 仅为身份验证的特定需求使用此特殊控制用户发送查询，而不用于正常操作。创建控制用户的命令可在\
  \ phpMyAdmin 的 Documentation.html 中获得，并且可能因版本而异。此文档包含最新的命令。\n\n\n\n当我们在 MySQL 服务器中创建控制用户时，我们按以下示例填写参数：\n\
  \n```\n$cfg['Servers'][$i]['controluser'] = 'pma';\n$cfg['Servers'][$i]['controlpass']\
  \ = 'bingo';\n```\n\n> 我在教授 phpMyAdmin 时使用 bingo 密码；建议不要为自己的安装使用相同的密码。\n\n## 注销\n\
  \n自 2.10 版本起，可用一种机制来指示 phpMyAdmin 在注销后应将控制权传递到哪个 URL。此功能适用于所有身份验证类型。示例如下：\n\n```\n\
  $cfg['Servers'][$i]['LogoutURL'] = 'http://www.mydomain.com';\n```\n\n该指令必须包含绝对\
  \ URL，包括协议。\n\n## HTTP 身份验证\n\n此模式——http——是 HTTP 中提供的传统模式，其中浏览器会询问用户名和密码，将其发送给 phpMyAdmin，并在所有浏览器窗口关闭之前一直发送。\n\
  \n要启用此模式，我们只需使用以下行：\n\n```\n$cfg['Servers'][$i]['auth_type'] = 'http';\n```\n\n\
  此模式存在一些限制：\n\n- PHP 根据版本可能不支持 HTTP 身份验证。当 PHP 作为 Apache 下的模块运行时，它可以工作；对于其他情况，我们应查阅我们版本的\
  \ PHP 文档。\n- 如果我们想用 .htaccess 文件保护 phpMyAdmin 目录（参见本章的安全部分），这将干扰 HTTP 身份验证类型；两者不能同时使用。\n\
  - 没有真正的注销，因为我们必须关闭所有浏览器窗口才能使用相同的用户名再次登录。\n\n即使考虑到这些限制，出于以下原因，此模式仍可能是一个有价值的选择：\n\n\
  - 一些浏览器可以以未加密的形式存储身份验证信息\n- 它比 cookie 处理稍快\n\n## Cookie 身份验证\n\nCookie 身份验证模式在提供的功能方面优于\
  \ http。它提供真正的登录和注销，并且可以在任何类型的 Web 服务器上运行 PHP 时使用。它在 phpMyAdmin 内部呈现登录面板（见下图）。由于我们拥有应用程序源代码，因此可以对其进行自定义。然而，正如你可能猜到的那样，对于\
  \ Cookie 身份验证，浏览器必须接受来自 Web 服务器的 Cookie —— 自 phpMyAdmin 2.8.0 起的所有身份验证模式均为如此。\n\n\
  此模式将登录屏幕中输入的用户名存储到浏览器中的永久 Cookie 中。密码以临时 Cookie 的形式存储。在多服务器配置中，每个服务器对应的用户名和密码分别存储。为了保护用户名和密码的保密性，防止针对\
  \ Cookie 内容的某些攻击方法，使用 Blowfish 机制对其进行加密。因此，要使用此模式，我们必须在 config.inc.php 中（一次）定义一个秘密密码，该密码将用于安全地加密此\
  \ phpMyAdmin 安装中以 Cookie 形式存储的所有密码。\n\n这是通过在此处放置一个秘密密码来完成的：\n\n```\n$cfg['blowfish_secret']\
  \ = 'SantaLivesInCanada';\n```\n\n然后，对于每个特定服务器的区段，使用以下内容：\n\n```\n$cfg['Servers'][$i]['auth_type']\
  \ = 'cookie';\n```\n\n下次启动 phpMyAdmin 时，我们将看到如下图所示的登录面板：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_54_0.png)\n\
  \n默认情况下，phpMyAdmin 会在登录面板中显示针对该特定服务器成功登录的最后一个用户名，该用户名是从永久 Cookie 中检索到的。如果这种行为不可接受（如果我们希望从同一工作站登录的其他人看不到之前的用户名），我们可以将以下参数设置为\
  \ FALSE：\n\n```\n$cfg['LoginCookieRecall'] = FALSE;\n```\n\n在 phpMyAdmin 2.6.0 中添加了一个安全功能——输入密码的有效时间限制。此功能有助于保护工作会话。成功登录后，我们的密码连同计时器一起存储在\
  \ Cookie 中。phpMyAdmin 中的每个操作都会重置计时器。如果我们在 $cfg['LoginCookieValidity'] 中定义的一定秒数内保持不活动状态，我们将被断开连接并必须重新登录。默认值为\
  \ 1800 秒。\n\n> 用于保护用户名和密码的 Blowfish 算法需要大量计算。为了获得最佳速度，必须在我们的 Web 服务器上安装 PHP 的 mcrypt\
  \ 扩展及其附带库。否则，phpMyAdmin 依赖于内部编码的算法，该算法可以工作，但会导致在 phpMyAdmin 上执行的几乎每个操作都延迟数秒！这是因为每次单击鼠标以便连接到\
  \ MySQL 时，都必须解码用户名和密码信息。\n\n## Signon 身份验证\n\n自 2.10 版本起，signon 模式使我们能够使用来自另一个应用程序的凭据来对\
  \ phpMyAdmin 进行身份验证。一些应用程序具有自己的身份验证机制，因此能够利用这一事实来避免另一个繁琐的登录面板是很方便的。为了使此功能正常工作，该应用程序必须将正确的凭据存储到\
  \ PHP 的会话数据中，以便稍后由 phpMyAdmin 检索。\n\n要启用此模式，我们从以下指令开始：\n\n```php\n$cfg['Servers'][$i]['auth_type']\
  \ = 'signon';\n```\n\n假设身份验证应用程序已使用名为 FirstApp 的会话来存储凭据。我们将此告知 phpMyAdmin：\n\n```php\n\
  $cfg['Servers'][$i]['SignonSession'] = 'FirstApp';\n```\n\n我们必须注意那些在其他应用程序之前尝试访问\
  \ phpMyAdmin 的用户；在这种情况下，phpMyAdmin 将用户重定向到身份验证应用程序。这是通过以下方式完成的\n\n```php\n$cfg['Servers'][$i]['SignonURL']\
  \ = 'http://www.mydomain.com/FirstApp';\n```\n\n身份验证应用程序如何以 phpMyAdmin 可理解的格式存储凭据？scripts/signon.php\
  \ 中包含了一个示例。在此脚本中，有一个简单的 HTML 表单用于输入凭据以及初始化会话的逻辑——我们将使用 FirstApp 作为会话名称，并在此会话中创建用户、密码和主机信息：\n\
  \n```php\n$_SESSION['PMA_single_signon_user'] = $_POST['user'];\n$_SESSION['PMA_single_signon_password']\
  \ = $_POST['password'];\n$_SESSION['PMA_single_signon_host'] = $_POST['host'];\n\
  ```\n\n> 请注意，FirstApp 不需要向用户询问 MySQL 的凭据。这些可以硬编码在应用程序内部，因为它们是秘密的，或者应用程序的凭据与 MySQL\
  \ 的凭据之间存在已知的对应关系。\n\n然后，身份验证应用程序使用其选择的方式——链接或按钮——让其用户启动 phpMyAdmin。\n\n## 多服务器配置\n\
  \nconfig.inc.php 文件至少包含一个特定服务器的区段；然而，我们可以添加更多，从而使单个 phpMyAdmin 副本能够管理多个服务器。让我们看看如何配置更多服务器。\n\
  \n### 配置文件中定义的服务器\n\n在 config.inc.php 文件的特定服务器区段中，我们看到针对每个服务器引用 $cfg['Servers'][$i]\
  \ 的行。这里使用变量 $i，以便可以轻松地剪切和粘贴配置文件的整个区段来配置更多服务器。在复制此类区段时，我们应注意在每个区段之前出现的 $i++; 指令，该指令对于分隔服务器区段至关重要，也应被复制。\n\
  \n然后，在区段末尾，以下行控制启动时发生的情况：\n\n```\n$cfg['ServerDefault'] = 1;\n```\n\n默认值 1 表示 phpMyAdmin\
  \ 将自行连接到第一个定义的服务器，或在使用高级身份验证时默认显示此服务器选择（本章后面会详细介绍）。我们可以指定任意数字，对应相应的特定服务器区段。我们也可以输入值\
  \ 0，表示没有默认服务器。\n\n此配置也可以通过基于 Web 的设置完成。下面给出了多服务器定义的示例，默认服务器设置为让用户选择。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_56_0.png)\n\
  \n\n\n未定义默认服务器时，phpMyAdmin 将显示服务器选择：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_57_0.png)\n\
  \n## 任意服务器\n\n如果我们想要能够连接到未定义的 MySQL 服务器，可以使用另一种机制。首先，我们必须设置以下参数：\n\n```\n$cfg['AllowArbitraryServer']\
  \ = TRUE;\n```\n\n我们还必须将默认值 1 恢复到 $cfg['ServerDefault'] 中。然后，需要使用 cookie 认证类型。这样我们就能选择服务器并输入用户名和密码。\n\
  \n> 允许任意服务器意味着任何可从我们的 Web 服务器访问的 MySQL 服务器都可以通过 phpMyAdmin 连接。因此，此功能最好与增强的安全机制结合使用（请参阅安全部分）。\n\
  \n如图所示，我们仍然可以在“服务器选择”中选择其中一个已定义的服务器。此外，我们还可以输入任意服务器名称、用户名和密码：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_57_1.png)\n\
  \n如工具提示所示，如果此 MySQL 服务器监听在非标准端口上，您还可以输入端口号（当然用空格与主机名/IP 地址分隔）。\n\n## 安全\n\n安全可以从多个层面进行检查：\n\
  \n- 如何保护 phpMyAdmin 安装目录\n- 哪些工作站可以访问 phpMyAdmin\n- 合法用户可以看到哪些数据库\n- 如何通过工作站上的物理\
  \ USB 密钥强制执行传输中数据保护和访问保护\n\n### 目录级保护\n\n假设有未经授权的人试图执行我们的 phpMyAdmin 副本。如果我们使用简单的\
  \ config 认证类型，任何知道我们 phpMyAdmin URL 的人对我们数据的有效权限都与我们相同。在这种情况下，我们应使用 Web 服务器提供的目录保护机制（例如\
  \ .htaccess，一个以点开头的文件名）来增加一层保护。\n\n如果我们决定使用 http 或 cookie 认证类型，我们的数据就足够安全了。然而，我们仍应对密码采取正常预防措施（包括定期更改）。\n\
  \nphpMyAdmin 安装所在的目录包含敏感数据。不仅配置文件，而且存储在其中的所有脚本都必须防止被篡改。我们应确保除我们之外，只有 Web 服务器的有效用户对该目录中的文件具有读取权限，并且只有我们才能写入这些文件。\n\
  \n> phpMyAdmin 的脚本永远不需要修改此目录中的任何内容，除非我们使用“保存导出文件到服务器”功能（在第 7 章中解释）。\n\n另一种可能的攻击来自在同一\
  \ Web 服务器上拥有账户的其他开发者。在这种攻击中，有人可能会尝试打开我们的 config.inc.php 文件。由于该文件可被 Web 服务器读取，有人可能会尝试从其\
  \ PHP 脚本中包含我们的文件。这就是为什么建议使用 PHP 的 open_basedir 功能，必要时将其应用于可能发起此类攻击的所有目录。\n\n###\
  \ 错误处理\n\n版本 3.0 在 phpMyAdmin 中引入了基于 PHP 自定义错误处理机制的新 PHP 错误捕获行为。此错误处理程序的好处之一是避免路径泄露，而路径泄露被视为安全弱点。与此相关的默认设置如下：\n\
  \n```\n$cfg['Error_Handler'] = array();\n$cfg['Error_Handler']['display'] = false;\n\
  ```\n\n除非您正在开发新的 phpMyAdmin 功能并希望查看所有 PHP 错误和警告，否则应将 display 的默认值保持为 false。\n\n\
  ### 基于 IP 的访问控制\n\n可以再增加一层保护，这次验证发出使用 phpMyAdmin 请求的机器的 Internet 协议（IP）地址。\n\n为了达到这一保护级别，我们构建允许或拒绝访问的规则，并指定这些规则的应用顺序。\n\
  \n### 规则\n\n规则的格式为：\n\n```\n<'allow' | 'deny'> <username> [from] <source>\n```\n\
  \nfrom 为可选，以下是一些示例：\n\n| Rule | Description |\n|---|---|\n| allow Bob from 1.2.3.4\
  \ | 用户 Bob 允许从 IP 地址 1.2.3.4 访问。 |\n| allow Bob from 1.2.3/24 | 用户 Bob 允许从匹配网络 1.2.3\
  \ 的任何地址访问（这是 CIDR IP 匹配）。 |\n| deny Alice from 4.5/16 | 用户 Alice 在位于网络 4.5 时无法访问。\
  \ |\n| allow Melanie from all | 用户 Melanie 可以从任何地方登录。 |\n| allow **Julie** from\
  \ **localhost** | 等同于 127.0.0.1 |\n| deny % from **all** | **all** 可用作 0.0.0.0/0\
  \ 的等价物，表示任何主机。这里 % 符号表示任何用户。 |\n\n源部分也可以使用特殊名称 **localnetA**、**localnetB** 或 **localnetC**\
  \ 构成。这些代表 Web 服务器所在的完整 A 类、B 类或 C 类网络。请注意，phpMyAdmin 依赖于此功能的 $_SERVER[\"SERVER_ADDR\"\
  ] PHP 参数。通常我们会有多个规则。假设我们希望使用以下两个规则：\n\n```\nallow Marc from 45.34.23.12\nallow Melanie\
  \ from all\n```\n\n我们必须将它们放入 config.inc.php（在相关的服务器特定部分）中，如下所示：\n\n```\n$cfg['Servers'][$i]['AllowDeny']['rules']\
  \ =\n  array('allow Marc from 45.34.23.12',\n    'allow Melanie from all');\n```\n\
  \n在定义单个规则或多个规则时，使用 PHP 数组。我们必须遵循其语法，用单引号将每个完整规则括起来，并用逗号分隔每个规则。因此，如果只有一个规则，我们仍必须使用数组来指定它，如下所示：\n\
  \n```\n$cfg['Servers'][$i]['AllowDeny']['rules'] =\n  array('allow Marc from 45.34.23.12');\n\
  ```\n\n下一个参数说明规则的解释顺序。\n\n### 规则解释顺序\n\n默认情况下，此参数为空：\n\n```\n$cfg['Servers'][$i]['AllowDeny']['order']\
  \ = '';\n```\n\n这意味着不进行基于 IP 的验证。\n\n假设我们希望默认允许访问，仅拒绝某些用户名/IP 对。我们应使用：\n\n```\n\
  $cfg['Servers'][$i]['AllowDeny']['order'] = 'deny,allow';\n```\n\n在这种情况下，所有 deny\
  \ 规则将首先应用，然后是 allow 规则。如果规则中未提及某情况，则授予访问权限。更严格的做法是默认拒绝。我们可以使用：\n\n```\n$cfg['Servers'][$i]['AllowDeny']['order']\
  \ = 'allow,deny';\n```\n\n这次，所有 allow 规则将首先应用，然后是 deny 规则。如果规则中未提及某情况，则拒绝访问。指定规则顺序的第三种（也是最严格的）方法是：\n\
  \n```\n$cfg['Servers'][$i]['AllowDeny']['order'] = 'explicit';\n```\n\n现在，deny 规则在\
  \ allow 规则之前应用。但要被接受，用户名/IP 地址必须列在 allow 规则中，且不在 deny 规则中。\n\n### root 访问的简化规则\n\
  \n由于 root 用户存在于几乎所有 MySQL 安装中，它经常成为攻击目标。从 phpMyAdmin 2.6.1 开始，一个参数允许我们轻松阻止 MySQL\
  \ root 账户的所有登录，使用以下设置：\n\n```\n$cfg['Servers'][$i]['AllowRoot'] = FALSE;\n```\n\n\
  ### 限制数据库列表\n\n有时避免在左侧面板中显示用户有权访问的所有数据库是有用的。phpMyAdmin 提供了两种限制方式——only_db 和 hide_db。\n\
  \n要指定可见的列表，使用 only_db 参数。它可能包含数据库名称或数据库名称列表。只有这些数据库会在左侧面板中显示：\n\n```\n$cfg['Servers'][$i]['only_db']\
  \ = 'payroll';\n$cfg['Servers'][$i]['only_db'] = array('payroll', 'hr');\n```\n\n\
  数据库名称可以包含 MySQL 通配符，如 _ 和 %。如果使用数组指定多个数据库，它们将在界面上按在数组中列出的相同顺序显示。\n\nonly_db 的另一个功能是，您可以使用它不是限制列表，而是强调某些名称，使其显示在列表顶部。这里，myspecial\
  \ 数据库名称将首先出现，其后是所有其他名称：\n\n```\n$cfg['Servers'][$i]['only_db'] = array('myspecial',\
  \ '*');\n```\n\n\n\n我们还可以使用 hide_db 参数指定必须隐藏的数据库名称。它包含一个正则表达式 (http://en.wikipedia.org/wiki/Regular_expression)\
  \ 表示要排除的内容。如果我们不希望用户看到所有名称以 'secret' 开头的数据库，我们将使用：\n\n```\n$cfg['Servers'][$i]['hide_db']\
  \ = '^secret';\n```\n\n这些参数适用于此服务器特定配置中的所有用户。\n\n> 这些机制并不能替代 MySQL 权限系统。用户对其他数据库的权限仍然有效，但他们无法使用\
  \ phpMyAdmin 的左侧面板导航到其它的数据库或表。\n\n## 传输中数据保护\n\nHTTP 本身并不能抵御网络嗅探（从线路上抓取敏感数据）。因此，如果我们不仅想保护用户名和密码，还想保护在\
  \ Web 服务器和浏览器之间传输的所有数据，就必须使用 HTTPS。\n\n为此，假设我们的 Web 服务器支持 HTTPS，我们只需将 URL 中的 http\
  \ 替换为 https 启动 phpMyAdmin，如下所示：\n\n```\nhttps://www.mydomain.com/phpMyAdmin\n```\n\
  \n如果我们使用 PmaAbsoluteUri 自动检测：\n\n```\n$cfg['PmaAbsoluteUri'] = '';\n```\n\nphpMyAdmin\
  \ 将检测到我们在 URL 中使用 HTTPS 并相应地做出反应。如果没有，我们必须按如下方式在此参数中填入 https 部分：\n\n```\n$cfg['PmaAbsoluteUri']\
  \ = 'https://www.mydomain.com/phpMyAdmin';\n```\n\n此外，自 phpMyAdmin 2.7.0 起，我们可以使用此设置自动将用户切换到\
  \ HTTPS 连接：\n\n```\n$cfg['ForceSSL'] = TRUE;\n```\n\n## Swekey 硬件认证\n\n自 3.1 版本起，Swekey\
  \ 硬件认证密钥的支持已合并到 phpMyAdmin 的基于 cookie 的认证中。此 USB 密钥的参考信息可在 http://phpmyadmin.net/auth_key\
  \ 获取。Swekey 可与所有兼容的 Web 应用程序一起使用，基于对该物理设备的持有来增加安全级别。在 phpMyAdmin 的情况下，它并不会取代正常的\
  \ MySQL 认证。\n\n## 配置\n\ncontrib/swekey.sample.conf 示例文件应作为配置此功能的基础。该文件包含来自厂商的示例配置命令和注释。原理很简单——每个\
  \ Swekey 设备都包含一个唯一 ID，且该 ID 必须在 Swekey 配置文件中与一个 MySQL 用户名关联。以下行是示例文件的一部分：\n\n```\n\
  0000000000000000000000000000763A:root\n\n000000000000000000000000000089E4:steve\n\
  \n0000000000000000000000000000231E:scott\n```\n\n这意味着负责 phpMyAdmin 配置的人员需要跟踪每个用户分配了哪个\
  \ Swekey，并将此信息写入文件。厂商无需知晓这种关联。他们只跟踪哪些 Swekey 已售出以及哪些已被停用。因此，只要相应更新配置，Swekey 就可以从一个用户传递给另一个用户。\n\
  \n示例文件中还包含其他与安全相关的指令，建议不要更改它们——尤其是 SERVER_CHECK、SERVER_RNDTOKEN 和 SERVER_STATUS。这是因为这些指令通过\
  \ https 访问服务器，这保证了我们 Web 服务器与厂商之间存在安全通道。\n\n修改后，此文件应复制到 Web 服务器文档根目录之外的目录（建议位置为\
  \ /etc/swekey-pma.conf）。然后，还必须在 config.inc.php 中设置一个配置参数：\n\n```\n$cfg['Servers'][$i]['auth_swekey_config']\
  \ = '/etc/swekey-pma.conf';\n```\n\n## 使用\n\n让我们看看现在当 phpMyAdmin 启动且工作站未连接 Swekey\
  \ 时会发生什么：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_63_0.png)\n\n我们注意到三处变化：\n\
  - 用户名字段无法输入\n- 显示了一个小钥匙图标\n- 出现错误消息\n\n用户名字段被停用是正常的，因为用户名现在取自 Swekey 配置文件。图标可以被点击以访问厂商网站。该网站上有一个测试机制，用于验证是否已连接\
  \ Swekey。如果自动安装未成功，还可以下载驱动程序。\n\n现在如果您连接 Swekey，假设用户 marc 已定义并与该设备关联，将显示一个令人安心的面板：\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_64_0.png)\n\n## 安全说明\n\n如果我们的用户可以访问他们可以在其上安装自己的\
  \ phpMyAdmin 副本的 Web 空间，那么依赖该设备提供的保护就没有意义。显然，必须相应地配置 phpMyAdmin 才能使用 Swekey。因此，用户安装的\
  \ phpMyAdmin 副本将绕过保护。这意味着主机提供商应仅允许从他/她安装了受控 phpMyAdmin 副本且其他用户无法在其上安装自己的副本的 Web\
  \ 服务器访问其 MySQL 服务器。\n\n## 摘要\n\n本章概述了如何使用单个 phpMyAdmin 副本管理多个服务器，以及如何使用认证类型来满足用户组的需要同时保护认证凭据。本章还涵盖了保护\
  \ phpMyAdmin 安装的方法。\n\n我们现在将查看构成 phpMyAdmin 用户界面的所有面板和窗口。\n"
- '# 3 界面概述


  在深入研究任务导向的章节（如搜索等）之前，适当了解一下 phpMyAdmin 界面的整体组织是合适的。我们还将看到影响整个界面的配置参数和设置。


  ## 面板和窗口


  phpMyAdmin 界面由各种面板和窗口组成，每个都有特定功能。我们首先对每个面板进行快速概述，然后在本章后面再详细说明。


  ## 登录面板


  出现的登录面板取决于所选择的认证类型。对于 http 类型，它将采用浏览器 HTTP 认证弹出屏幕的形式。对于 cookie 类型，将显示 phpMyAdmin
  专用的登录面板。（这在第 2 章中有所介绍。）对于外部认证（signon），登录面板由外部应用程序本身处理。默认情况下，此面板上存在服务器选择对话框和语言选择器。


  然而，如果我们使用 config 认证类型，则不会显示登录面板，首次显示的界面包含左侧和右侧面板。


  ## 左侧和右侧面板


  这些面板一起出现，并在我们使用 phpMyAdmin 的大部分工作会话中显示。左侧面板是我们浏览数据库和表的导航指南。右侧面板是主要工作区域，数据在此管理并显示结果。其确切布局取决于从左侧面板做出的选择和执行的操作顺序。对于希伯来语等从右到左的语言，导航面板位于右侧，主要面板位于左侧。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_66_0.png)


  ## 主页


  右侧面板可以采用主页的形式。主页随后将包含与 MySQL 操作或 phpMyAdmin 信息相关的各种链接、语言选择器以及可能的主题选择器。


  ## 视图


  在右侧面板中，我们可以看到数据库视图——可以在其中对特定数据库执行各种操作，或表视图——可以在其中访问许多用于管理表的函数。还有服务器视图，对系统管理员和非管理员用户都很有用。所有这些视图都有一个顶部菜单，其形式为选项卡，引导至不同的子页面，用于按通用功能（表结构、权限等）分组展示信息。


  > 请不要将此处以界面意义使用的“视图”术语与 MySQL 5.0 的 SQL 视图概念（在第 17 章中介绍）混淆。


  ## 查询窗口


  这是一个独立的窗口，通常从左侧面板打开——有时在从右侧面板编辑 SQL 查询时也会打开。其主要目的是便于查询工作并在右侧面板上显示结果。




  ## 起始页


  当我们启动 phpMyAdmin 时，我们会看到以下内容（取决于 config.inc.php 中指定的身份验证类型，以及其中是否定义了多个服务器）：


  - 其中一个登录面板

  - 左侧和右侧面板，首页显示在右侧面板中


  ## 通用自定义


  本节描述了对许多面板产生影响的设置。这些设置修改了窗口中标题的外观、信息图标以及表列表的排序方式。所有页面的整体视觉风格由主题系统控制，这里将一并介绍。


  ## 窗口标题配置


  当左侧和右侧面板显示时，窗口的标题会更改以反映当前活动的 MySQL 服务器、数据库和表。phpMyAdmin 如果 $cfg[''ShowHttpHostTitle'']
  设置为 TRUE，也会显示有关 Web 服务器主机名的一些信息。显示的内容取决于另一个设置 – $cfg[''SetHttpHostTitle'']。如果此设置为空（默认情况下为空），则真正的
  Web 服务器主机名会出现在标题中。我们可以放置另一个字符串，例如 "my Web server"，它将代替真正的主机名显示。


  在打开多个 phpMyAdmin 窗口时，能看到 Web 服务器的主机名会很有帮助，因为这样可能连接到多个 Web 服务器。当然，每个 phpMyAdmin 窗口本身也可以访问多个
  MySQL 服务器。


  ## 图标配置


  当显示各种警告、错误或信息消息时，如果 $cfg[''ErrorIconic''] 设置为 TRUE，它们可以附带一个图标。另一个参数 $cfg[''ReplaceHelpImg'']，当设置为
  TRUE 时，会在每个有特定主题文档可用的地方显示一个包含问号的小图标。这两个参数默认都设置为 TRUE，因此会产生：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_67_0.png)


  它们可以独立设置为 FALSE。两者都设置为 FALSE 时会得到：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_68_0.png)


  ## 数据库和表名的自然排序


  通常，计算机按字典顺序对项目进行排序，这对于表列表会产生以下结果：


  ```

  table1

  table10

  table2

  table3

  ```


  phpMyAdmin 默认实现“自然排序”，由 $cfg[''NaturalOrder''] 设置为 TRUE 指定。因此，左侧和右侧面板中的数据库和表列表按如下方式排序：


  ```

  table1

  table2

  table3

  table10

  ```


  ## 站点特定页眉和页脚


  一些用户可能希望在 phpMyAdmin 界面上显示公司标志、帮助台链接或其他信息。为此，在主 phpMyAdmin 目录中，我们可以创建两个脚本——config.header.inc.php
  和 config.footer.inc.php。我们可以在这些脚本中放入自己的 PHP 或 XHTML 代码，并在以下情况下在页面开头（页眉）或结尾（页脚）显示：


  - 在 cookie 登录页面上

  - 在右侧面板上


  例如，创建一个包含以下行的 config.footer.inc.php：


  ```

  <hr />

  <em>All the information on this page is confidential.</em>

  ```


  会在所有页面上产生预期消息：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_69_0.png)


  ## MySQL 文档链接


  phpMyAdmin 在其界面的各个位置显示指向 MySQL 文档的链接。这些链接指向官方 MySQL 文档中了解 MySQL 命令的确切位置。我们可以使用以下配置参数自定义引用的位置、语言和手册类型：


  ```

  $cfg[''MySQLManualBase''] = ''http://www.mysql.com/doc/en'';

  $cfg[''MySQLManualType''] = ''searchable'';

  ```


  您可以查看 http://www.mysql.com/documentation 以了解手册可用的语言，并相应地更改参数。对于手册类型，最新的可能值作为注释在
  config.inc.php 中解释。喜欢在本地服务器上保留此文档副本的用户会在此处指定本地链接。


  $cfg[''ReplaceHelpImg''] 参数控制链接的显示方式。其默认值 TRUE 使 phpMyAdmin 显示小问号图标。但是，如果其值为 FALSE，则会显示
  Documentation 链接。


  ## 主题


  从 phpMyAdmin 2.6.0 版本开始提供主题系统。颜色参数和各种图标位于 `themes` 子目录下的目录结构中。对于每个可用主题，都有一个以主题命名的子目录。它包含：


  - `layout.inc.php` 用于主题参数

  - `css` 目录包含各种 CSS 脚本

  - `img` 目录包含图标

  - `screen.png`，该主题的截图


  下载的套件包含两个主题，更多主题可在 http://phpmyadmin.net/home_page/themes.php 获取。


  ## 主题配置


  在 `config.inc.php` 中，`$cfg[''ThemePath'']` 参数默认包含 `themes`，表示所需结构所在的哪个子目录。这可以更改为指向公司特定的
  phpMyAdmin 主题所在的另一个目录。


  默认选择的主题在 `$cfg[''ThemeDefault'']` 中指定，设置为 `original`。如果用户无法选择主题，则会使用此主题。


  > `original` 子目录绝不应被删除；phpMyAdmin 依赖它进行正常操作。


  ## 主题选择


  在主页上，我们可以为用户提供主题选择器。将 `$cfg[''ThemeManager'']` 设置为 TRUE（默认值）会显示选择器：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_70_0.png)


  为了帮助选择合适的主题，**Theme/Style** 旁边的调色板图标会为我们提供可用主题的屏幕截图。然后我们可以在想要的主题下点击 **take it**。选择的主题会保存在
  cookie 中。默认情况下，记住的主题适用于我们连接的所有服务器。要使 phpMyAdmin 为每个 MySQL 服务器记住一个主题，我们将 `$cfg[''ThemePerServer'']`
  设置为 TRUE。


  ## 颜色选择器


  这里有一个功能——自定义颜色选择器——可能看起来有些轻浮，但也有其用途。我们先讨论*如何*，然后再讨论*为什么*。


  位于主页上的小彩虹图标可访问一个选择器，它控制两个面板的背景颜色。phpMyAdmin 团队合并了 Djamil Legato 的 MooRainbow 代码（http://moorainbow.woolly-sheep.net）来提供此功能。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_71_0.png)


  您可以以多种方式操作选择器——移动滑块、在大正方形中移动鼠标，或直接在字段中输入值。完成后，您点击 **Select** 以关闭选择器。


  ## 滑块


  您会在某些页面上看到，一个小加号后跟一个控制标签——要么是 **Options** 要么是 **Details**。点击标签会打开一个滑块以显示界面中被认为在日常工作中使用较少的部分。由于有些人更喜欢立即看到整个界面——以牺牲屏幕空间为代价——有一个配置参数控制滑块的初始设置：


  ```

  $cfg[''InitialSlidersState''] = ''closed'';

  ```


  默认值 **closed** 表示滑块必须通过点击标签打开；您可能已经猜到相反的值是 open。此 JavaScript 功能来自位于 http://mootools.net
  的 Mootools 库。


  ## 字符集、排序规则和语言


  **字符集** 描述了特定语言或方言的符号如何编码。**排序规则** 包含比较和排序字符集字符的规则。用于存储数据的字符集可能与用于显示它的字符集不同，从而导致数据不一致。因此，需要转换数据。


  自 MySQL 4.1.x 起，MySQL 服务器为我们执行字符重新编码工作。此外，MySQL 允许我们为每个数据库、每个表甚至每个字段指定字符集和排序规则。数据库的默认字符集适用于其每个表，除非在表级别被覆盖。相同的原则适用于每个字段。


  ## 排序规则


  当字符串需要比较和排序时，系统（此处为 MySQL）必须遵循精确的规则。例如，“A”是否等同于“a”？''André'' 是否等同于 "Andre"？一组此类规则称为排序规则。


  选择合适的排序规则对于在搜索数据（例如来自 phpMyAdmin 的 **Search** 页面）时获得预期结果，以及对数据进行排序时非常重要。




  关于排序规则的介绍，请参阅 http://dev.mysql.com/doc/mysql/en/Charset-general.htm，关于所涉及算法的更技术性解释，请参阅
  http://www.unicode.org/reports/tr10/。


  ## Unicode and UTF-8


  > Unicode 是一种行业标准，旨在使文本和符号 [...] 能够被计算机一致地表示和处理。


  获取更多信息，请访问 http://en.wikipedia.org/wiki/Unicode 和 http://www.unicode.org/。


  Unicode 目前支持超过 600 种语言，这是其相对于 ISO 或 Windows 可用的其他字符集的主要优势。对于像 phpMyAdmin 这样的多语言产品来说，这一点尤其重要。


  为了表示或编码这些 Unicode 字符，存在许多 Unicode 转换格式（UTF）。一种流行的转换格式是 UTF-8，它每个字符使用一到四个八位字节。详情请访问
  http://en.wikipedia.org/wiki/UTF-8。


  请注意，浏览器必须支持 UTF-8（大多数当前浏览器都支持）。phpMyAdmin 分发包包含 lang 子目录中每个语言文件的 UTF-8 版本。


  ## Language selection


  语言选择器会出现在登录面板（如果有）和主页上。phpMyAdmin 的默认行为是使用浏览器首选项中定义的语言，前提是该版本存在对应的语言文件。


  默认语言——如果程序无法检测到——在 config.inc.php 中定义，参数为 $cfg[''DefaultLang'']，值为 ''en-utf-8''。此值可以更改。语言名称的可能值在
  libraries/select_lang.lib.php 脚本中作为数组定义。


  即使定义了默认语言，每个用户（尤其是在多用户安装中）仍可从选择器中选择其首选语言。用户的选择在可能的情况下会保存在 cookie 中。


  我们还可以通过设置 $cfg[''Lang''] 参数并赋予值，例如 ''fr-utf-8'' 来强制使用单一语言。从 2.7.0 版本开始，还有另一个参数 $cfg[''FilterLanguages'']
  可用。假设我们希望将可用语言列表缩短为 English 和 Français – French，因为这些是用户唯一使用的语言。这是通过构建一个正则表达式来实现的，该表达式根据这些语言的
  ISO 639 代码指示我们希望显示的语言。继续我们的示例，我们将使用：


  ```

  $cfg[''FilterLanguages''] = ''^(fr|en)'';

  ```


