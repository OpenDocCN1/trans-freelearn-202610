  开发团队建议您首先使用产品的论坛搜索遇到的问题，然后在提交错误报告之前开始新的论坛讨论。


  ## 创建 SourceForge 帐户


  创建（免费）SourceForge 用户帐户并将其用于在论坛上发帖是强烈推荐的。这可以更好地跟踪问题和答案。


  ## 选择主题标题


  开始新的论坛主题时，仔细选择摘要标题非常重要。标题如 "Help me!"、"Help a newbie!"、"Problem" 或 "phpMyAdmin error!"
  难以处理，因为答案会与这些标题关联，进一步引用会变得有问题。更好的标题是："Import with UploadDir"、"User can''t but root
  can login" 或 "Server not responding"。


  ## 阅读答案


  由于人们会阅读并几乎总是回答您的问题，在论坛上对答案提供反馈确实可以帮助回答者，以及有相同问题的人。


  ## 支持跟踪器


  这是另一个寻求支持的地方。此外，如果我们提交的错误报告实际上是支持请求，该报告将被移至支持跟踪器。使用您的 SourceForge 用户帐户，您将收到此跟踪器更改的通知。


  ## 错误跟踪器


  在此跟踪器中，我们可以看到尚未修复的错误，以及为下一个版本修复的错误。（为避免出现重复的错误报告。）


  ## 环境描述


  由于开发人员会尝试重现提到的问题，因此描述您的环境会有所帮助。此描述可以简短，但应包含以下项目：


  - phpMyAdmin 版本（团队不过期望它是当前稳定版本）

  - Web 服务器名称和版本

  - PHP 版本

  - MySQL 版本

  - 浏览器名称和版本


  通常，无需指定服务器或客户端运行的操作系统，除非我们注意到该错误仅与一个操作系统相关。例如，FAQ 5.1 描述了一个用户无法创建包含超过十四列的表的问题。这仅在
  Windows 98 下发生。


  ## 错误描述


  我们应提供发生情况的精确描述（包括任何错误消息、预期结果和我们获得的实际结果）。如果报告每个错误报告仅描述一个问题（除非问题明显相关），则报告很容易管理。


  有时，附上简短的导出文件以帮助开发人员重现问题可能会有所帮助。欢迎提供屏幕截图。


  ## 为项目贡献


  自 1998 年以来，数百人贡献了翻译、新功能代码、建议和错误修复。




  ## 代码库

  开发团队维护着一个不断演进的代码库，并定期发布版本。下载主页部分的一段文字描述了如何使用 Subversion 获取开发中的最新版本。（也可以通过下载 Subversion
  快照来完成。）如果贡献（翻译更新、补丁、新功能等）指的是最新的代码库，而不是过时的 phpMyAdmin 版本，将会得到更高优先级的考虑。


  ## 翻译更新

  查看项目当前 55 种语言的列表，您会注意到它们维护情况并不均衡。有关翻译的详细信息可在 http://www.phpmyadmin.net/home_page/translations.php
  获取。您可以尝试通过电子邮件联系特定语言的官方翻译人员，以提出对最近添加消息的修正或翻译。如果此人未回复，您可以将修改发送到翻译跟踪器，放在压缩的 (.zip)
  文件中。


  ## 补丁

  如果补丁以相对于当前代码库的上下文差异形式提交，并附带已解决问题的说明或实现的新功能，开发团队可以更轻松地管理补丁。贡献者将在 Documentation.html
  中正式署名，或至少在 ChangeLog 中署名。


  ## 未来的 phpMyAdmin 版本

  以下是开发团队正在考虑的下一版本的要点：

  - 对 MySQL 新功能的改进支持

  - 用户偏好设置永久存储

  - 内部代码改进


