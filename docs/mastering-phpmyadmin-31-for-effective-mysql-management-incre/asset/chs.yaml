- '# 10 Table and Database Operations


  ## Table and Database Operations


  在前几章中，我们主要处理表字段。 在本章中，我们将学习如何执行影响整个表或数据库的一些操作。 我们将介绍表属性及其修改方法，并讨论多表操作。


  各种启用表操作的链接已放在表视图的 Operations 子页面上。 以下是此子页面的概览：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_185_0.png)


  ## Table maintenance


  在表的生命周期中，它会反复被修改；因此，它会不断增长和缩小。 服务器可能会出现故障，导致某些表处于损坏状态。


  使用 Operations 子页面，我们可以执行各种操作，接下来列出。 然而，并非每个操作都适用于每种表类型。


  - **Check table:** 扫描所有行以验证已删除的链接是否正确。 同时，还会计算校验和以验证键的完整性；如果一切正常，我们应该会收到 OK 消息。

  - **Analyze table:** 分析并存储键分布；这将在后续的 JOIN 操作中使用，以确定表应连接的顺序。

  - **Repair table:** 修复 MyISAM 和 ARCHIVE 引擎中表的任何损坏数据。 请注意，表可能损坏到我们甚至无法进入其表视图！ 在这种情况下，请参阅
  *Multi-Table Operations* 部分以获取修复程序。

  - **Optimize table:** 当表包含开销时很有用。 在大量删除行或 VARCHAR 字段长度更改后，表中会残留丢失的字节。 phpMyAdmin
  会在各个地方（例如在 Structure 视图中）警告我们，如果它认为表应该被优化。 此操作是对表的某种碎片整理。 在 MySQL 4.x 中，此操作仅适用于
  MyISAM、Berkeley (DB) 和 InnoDB 引擎中的表。 在 MySQL 5.x 的情况下，相关表位于 MyISAM、InnoDB 和 ARCHIVE
  引擎中。

  - **Flush table:** 当出现许多连接错误且 MySQL 服务器阻止进一步连接时，必须执行此操作。 刷新将清除一些内部缓存并允许正常操作恢复。

  - **Defragment table:** InnoDB 表中的随机插入或删除会使其索引碎片化。 表应定期进行碎片整理以加快数据检索。


  > 操作基于可用的底层 MySQL 查询——phpMyAdmin 仅调用这些查询。


  ## Changing table attributes


  表属性是表的各种属性。 本节讨论其中一些的设置。


  ## Table storage engine


  我们可以更改的第一个属性称为 Storage Engine。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_187_0.png)


  这控制着表的整体行为——其位置（磁盘上或内存中）、索引结构，以及是否支持事务和外键。 下拉列表根据我们 MySQL 服务器支持的存储引擎而变化。


  > 如果行数很大，更改表的存储引擎可能是一项耗时操作。


  ## Table comments


  这允许我们为表输入注释。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_187_1.png)


  这些注释将在适当位置显示——例如，在导航面板中，在表视图中表名称旁边，以及在导出文件中。 当 $cfg[''ShowTooltip''] 参数设置为其默认值 TRUE
  时，导航面板如下所示：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_187_2.png)


  $cfg[''ShowTooltipAliasDB''] 和 $cfg[''ShowTooltipAliasTB''] 的默认值（FALSE）会产生我们之前看到的行为——真正的数据库和表名称显示在左侧面板中，并在
  Database 视图的 Structure 子页面中显示。 当鼠标指针移到表名称上时，会出现注释。 如果其中一个参数设置为 TRUE，则相应的项（DB 的数据库名称和
  TB 的表名称）将作为工具提示显示，而不是名称。 这次，鼠标悬停会显示该项的真实名称。 当真实的表名没有意义时，这很方便。


  $cfg[''ShowTooltipAliasTB''] 还有另一种可能性——''nested'' 值。 如果我们使用此功能，会发生以下情况：


  - 真正的表名显示在左侧面板中

  - 表注释（例如 project__）被解释为项目名称并按原样显示（参见第 3 章中的 Nested display of tables within a database
  部分）


  ## Table order


  当我们浏览表，或执行诸如 SELECT * from book 之类的语句而不指定排序顺序时，MySQL 使用行物理存储的顺序。 此表顺序可以使用 Alter
  table order by 对话框进行更改。 我们可以选择任何字段，表将按该字段重新排序一次。 我们在示例中选择 author_id，并在点击 Go 后，表按该字段排序。


  如果我们知道大部分时间将按此顺序检索行，则重新排序很方便。 此外，如果我们稍后使用 ORDER BY 子句，并且表已在该字段上物理排序，则性能应该更高。


  只要表中没有更改（没有插入、删除或更新），这种默认排序就会持续。 这就是为什么 phpMyAdmin 显示（单个）警告的原因。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_188_0.png)




  在对 **author_id** 进行排序后，作者 **1** 的书籍会先显示，其后是作者 **2** 的书籍，以此类推（我们说的是在没有显式排序的情况下对表的默认浏览）。我们还可以将排序顺序指定为
  **升序** 或 **降序**。


  如果我们插入另一行，描述作者 **1** 的新书籍，然后点击 **浏览**，该书籍不会与该作者的其他书籍一起显示，因为排序是在插入之前完成的。


  ## 表排序规则


  为了更好地了解各层级排序规则更改的问题，让我们先创建一个名字中包含字符 **é** 的新作者：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_189_0.png)


  name 列当前具有 **latin1_swedish_ci** 排序规则，可通过 **结构** 页面查看。在 **操作** 页面，如果我们将 author 表的排序规则从
  **latin1_swedish_ci** 改为例如 **utf8_general_ci**，则会生成：


  ```

  ALTER TABLE `author` DEFAULT CHARACTER SET utf8 COLLATE

  utf8_general_ci

  ```


  因此，我们只更改了将来将添加到此表的列的默认排序规则。


  为了进一步测试排序规则更改，我们可以进入 **结构** 页面并将 author 的 **name** 列的排序规则更改为 **utf8_general_ci**（通过点击
  **更改** 图标）。完成此操作后，我们浏览 **author** 表，仍然能正确看到 **é** 字符，因为 MySQL 在排序规则更改时更新了该列的内容。


  ## 切换连接排序规则的影响


  更改连接排序规则（来自主页排序规则对话框）可能会产生意想不到的效果。让我们将其切换为 latin1_bin 并再次浏览我们的 author 表：


  |  |  |  | id | 名称 | 电话 |

  |---|---|---|---|---|---|

  | ☐ | ✏️ | ❌ | 1 | John Smith | +01 445 789-1234 |

  | ☐ | ✏️ | ❌ | 2 | Maria Sunshine | 333-3333 |

  | ☐ | ✏️ | ❌ | 3 | Andr♦ Smith | 888-9999 |


  数据库中以 UTF-8 编码的数据现在（错误地）被解释为 latin1，导致显示不一致。因此，我们必须小心排序规则的更改，并且应撤消本节和上一节中进行的排序规则更改。


  ## 表选项


  其他影响表行为的属性可以使用 表选项 对话框指定：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_190_0.png)


  选项如下：


  - **PACK_KEYS**: 设置此属性会导致索引更小。可以更快地读取，但更新需要更多时间。适用于 MyISAM 存储引擎。

  - **CHECKSUM**: 这会使 MySQL 为每一行计算校验和。这会导致更新变慢，但查找损坏的表变得更容易。仅适用于 MyISAM。

  - **DELAY_KEY_WRITE**: 这指示 MySQL 不要立即写入索引更新，而是将其排队以便稍后写入。这可以提高性能。仅适用于 MyISAM。

  - **ROW_FORMAT**: 对于支持此功能的存储引擎（MyISAM、InnoDB、PBXT 和 Maria），会提供行格式的选择。默认值是该表行格式的当前状态。

  - **TRANSACTIONAL, PAGE_CHECKSUM**: 适用于 Maria 存储引擎。目前记录在 http://dev.mysql.com/doc/refman/5.1-maria/en/se-maria-tableoptions.html。

  - **auto-increment**: 这会更改自动递增值。仅当表的 primary key 具有自动递增属性时才显示。


  ## 重命名、移动和复制表


  **重命名** 操作最容易理解——表只是更改其名称并保留在同一数据库中。


  **移动** 操作（如下图所示）可以以两种方式操作表——更改其名称以及存储它的数据库。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_191_0.png)


  MySQL 不直接支持移动表。因此，phpMyAdmin 必须在目标数据库中创建表，复制数据，然后最终删除源表。


  **复制** 操作保持原始表不变，并将其结构或数据（或两者）复制到另一个表，可能在另一个数据库中。这里，**book-copy** 表将是 book 源表的精确副本。复制后，我们仍停留在
  book 表的表视图中，除非选择 **切换到已复制的表**。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_191_1.png)


  **仅结构** 复制用于创建具有相同结构的测试表。


  ## 向表追加数据


  复制对话框也可以用于将数据从一个表追加（添加）到另一个表。两个表必须具有相同的结构。此操作是通过输入要复制数据的表并选择 仅数据 来实现的。


  例如，当来自各种来源（各种出版商）的书籍数据存储在多个表中，并且我们希望将所有数据汇总到一个地方时，我们希望追加数据。对于 MyISAM，可以使用 Merge
  存储引擎（它是一组相同的 MyISAM 表）获得类似的结果。但是，如果表是 InnoDB，我们需要依赖 phpMyAdmin 的复制功能。


  ## 多表操作


  在数据库视图中，每个表名旁边都有一个复选框，表列表下方有一个下拉菜单。这使我们能够快速选择一些表并一次对所有这些表执行操作。在这里，我们选择 book-copy
  和 book 表，并为所选表选择 检查表 操作。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_192_0.png)


  我们也可以使用 全选 / 取消全选 快速选择或取消选择所有复选框。


  ## 修复“正在使用”的表


  多表模式是修复损坏表的唯一方法（除非我们知道要输入的确切 SQL 查询）。此类表可能在数据库列表中显示为正在使用标志。在 phpMyAdmin 支持论坛寻求帮助的用户经常从经验丰富的
  phpMyAdmin 用户那里收到此提示。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_193_0.png)


  ## 数据库操作


  数据库视图中的 操作 选项卡提供了访问面板，可让我们对整个数据库执行操作。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_193_1.png)


  ## 重命名数据库


  提供了一个 重命名数据库为 对话框。虽然此操作不直接受 MySQL 支持，但 phpMyAdmin 通过创建新数据库，重命名每个表（从而将其发送到新数据库）并删除原始数据库来间接执行此操作。


  ## 复制数据库


  即使 MySQL 本身不原生支持此操作，也有可能完全复制数据库。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_194_0.png)


  ## 总结


  本章涵盖了我们可以对整个表或数据库执行的各种操作。它还介绍了表维护操作，用于表修复和优化，更改各种表属性，表移动（包括重命名和移动到另一个数据库）以及多表操作。在下一章中，我们将开始研究依赖于链接表基础设施的高级功能，例如关系系统。

  '
- "# 11 关系系统\n\n## 关系系统\n\n欢迎来到本书的章节，我们开始介绍高级功能。关系系统允许用户更紧密地使用 phpMyAdmin，正如我们在以下章节中将看到的那样。本章解释了如何定义表间关系。它还解释了如何安装链接表基础设施——高级功能的前提条件。\n\
  \n## 关系型 MySQL\n\n当应用程序开发人员使用 PHP 和 MySQL 构建 Web 界面或其他数据操作应用程序时，他们通常使用底层 SQL 查询在表之间建立关系。示例包括：“获取发票及其所有项目”和“获取作者的所有书籍”。\n\
  \n在 phpMyAdmin 的早期版本中，MySQL 存储了哪个表属于哪个数据库的信息。然而，关系数据结构（表如何相互关联）并未存储到 MySQL 中。关系是由应用程序临时建立的，以生成有意义的结果。换句话说，关系在我们脑海中。\n\
  \nphpMyAdmin 的开发人员和用户认为这是 MySQL 的不足之处。因此，团队开始构建基础设施以支持 MyISAM 表的关系。该基础设施不断发展，以支持日益增长的特殊功能。我们可以将此基础设施描述为元数据，即关于数据的数据。\n\
  \nphpMyAdmin 2.2.0 已具有书签功能，即召回经常使用的查询的能力（在第 14 章中描述），而版本 2.3.0 概括了元数据系统。后续版本建立在此设施之上。示例包括：具有基于\
  \ MIME 的转换的 2.5.x 系列（在第 16 章中描述）和具有名为 Designer 的图形关系构建器的 2.10.x 系列（在本章中描述）。\n\n\n\
  \n## InnoDB 与 PBXT\n\nInnoDB 是一种 MySQL 存储引擎，其网页为 http://www.innodb.com。它由 Oracle\
  \ 的子公司 Innobase Oy 开发。由于 InnoDB 子系统必须由系统管理员激活，因此它可能并非在每个 MySQL 服务器上都可用。\n\nPrimeBase\
  \ XT 存储引擎或 PBXT（http://www.primebase.org）可用于 MySQL 5.1 和 6.0，由 PrimeBase Technologies\
  \ 开发。最低要求的 MySQL 版本为 5.1，因为该版本支持 PBXT 及其他第三方用于提供替代存储引擎的可插拔存储引擎 API。该事务性存储引擎比 InnoDB\
  \ 更新。通常在从其网站下载后进行编译步骤安装。对于某些操作系统，提供预编译的二进制文件——请访问上述网站获取下载和安装说明。\n\n在考虑关系方面时，使用 InnoDB\
  \ 或 PBXT 存储引擎为表带来的好处如下：\n\n- 它们支持基于外键的引用完整性，外键是外表（或引用表）中的键。相比之下，仅使用 phpMyAdmin 的内部关系（稍后讨论）则不会进行自动引用完整性验证。\n\
  - InnoDB 和 PBXT 表的导出结构包含已定义的关联。因此，它们可以轻松导入回以实现更好的跨服务器互操作性。\n\n这些存储引擎的外键功能可以有效替代\
  \ phpMyAdmin 基础设施中处理关联的部分。我们将看到 phpMyAdmin 如何与 InnoDB 和 PBXT 外键系统交互。\n\n> phpMyAdmin\
  \ 基础设施的其他部分（例如书签）在 InnoDB、PBXT 或 MySQL 中没有等价物。因此，仍需要它们才能访问完整的 phpMyAdmin 功能集。然而，在\
  \ MySQL 5.x 中，视图是受支持的，并且与 phpMyAdmin 的书签相似。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_196_0.png)\n\
  \n## 关联表基础设施\n\n关系系统的基础设施存储在遵循预定结构的表中。这些表中的数据由 phpMyAdmin 根据我们在界面上的操作生成和维护。\n\n\
  ## 基础设施的目标\n\n元数据表包含针对所有存储引擎的信息，以支持 phpMyAdmin 的特殊功能，如书签和转换。此外，对于不支持外键的存储引擎中的表，表之间的关系保存在此基础设施中。\n\
  \n## 基础设施的位置\n\n这些表可以存储在两个可能的位置：\n\n- 用户的数据库——以便每个拥有数据库的 Web 开发人员都能受益于这些功能。\n- 一个名为\
  \ pmaDB（phpMyAdmin 数据库）的专用数据库。在多用户安装（稍后讨论）中，此数据库可供多个用户访问，同时保持元数据私有。\n\n由于此基础设施默认不存在，并且\
  \ phpMyAdmin 的开发人员希望推广它，因此在数据库视图的“操作”子页面中，界面会为每个数据库显示以下错误消息：\n\n```\nThe additional\
  \ features for working with linked tables have been deactivated. To find out why\
  \ click here.\n```\n\n此消息可通过以下参数禁用（默认情况下设置为 FALSE）：\n\n```\n$cfg['PmaNoRelation_DisableWarning']\
  \ = TRUE;\n```\n\n> 无论当前数据库如何，该消息都相同，因为基础设施是为我们所有的数据库和表（或多用户安装中的所有用户）共享的。\n\n##\
  \ 安装关联表基础设施\n\n即使基础设施只有一部分缺失，之前的错误消息也会显示。当然，在全新安装时，所有部分都缺失——我们的数据库尚未了解 phpMyAdmin，需要配备此基础设施。按照上一条消息中的链接，会弹出一个面板，解释\
  \ pmaDB 及其 supposed 部分的表要么缺失要么未定义。\n\n必须认识到，只有满足以下两个条件，关系系统才能正常工作：\n\n- config.inc.php\
  \ 中存在正确的定义\n- 对应的表（以及可能数据库）已创建\n\n为了创建与当前 phpMyAdmin 版本相匹配的必要结构，phpMyAdmin 安装目录的\
  \ scripts 子目录中提供了一个名为 create_tables.sql 的命令文件。但是，在了解可能的选项——多用户安装或单用户安装之前，我们不应盲目执行它。\n\
  \n## 多用户安装\n\n在此设置中，我们将有一个独立的数据库——pmadb——用于存储元数据表。我们的控制用户将对该数据库拥有特定权限。每个用户将使用其登录名和密码工作，用于访问其数据库。然而，每当\
  \ phpMyAdmin 本身访问 pmadb 以获取某些元数据时，它将使用控制用户的权限。\n\n> 只有具有为另一用户（此处为 pma 用户）分配权限的 MySQL\
  \ 系统管理员才能设置多用户安装。如果您不处于此情况，请参阅“单用户安装”部分。\n\n我们首先确保控制用户 pma 已创建，如第 2 章所述，并且其在 config.inc.php\
  \ 中的定义是合适的。\n\n```\n$cfg['Servers'][$i]['controluser'] = 'pma';\n$cfg['Servers'][$i]['controlpass']\
  \ = 'bingo';\n```\n\n然后我们在 scripts 目录中查找 create_tables.sql。可能有针对不同 MySQL 版本的其他脚本可用，因此我们应选择最合适的那个。接下来，我们将此脚本复制到本地工作站并编辑它。我们替换以下行：\n\
  \n```\n-- GRANT SELECT, INSERT, DELETE, UPDATE ON `phpmyadmin`.* TO\n--   `pma`@localhost;\n\
  ```\n\n为这些：\n\n```\nGRANT SELECT, INSERT, DELETE, UPDATE ON `phpmyadmin`.* TO\n\
  \  `pma`@localhost;\n```\n\n然后我们通过导入执行此脚本（参见第 8 章）。净效果是创建 phpmyadmin 数据库，为用户 pma\
  \ 分配适当的权限，并用所有必要的表填充数据库。\n\n## 基础设施和 config.inc.php\n\n现在是时候调整 config.inc.php 中所有与关系功能相关的参数了。这可以通过第\
  \ 1 章中看到的设置脚本轻松完成，或通过从 config.sample.inc.php 文件粘贴适当的行来完成。这些数据库和表名称就是刚刚创建的：\n\n```\n\
  $cfg['Servers'][$i]['pmadb'] = 'phpmyadmin';\n$cfg['Servers'][$i]['bookmarktable']\
  \ = 'pma_bookmark';\n$cfg['Servers'][$i]['relation'] = 'pma_relation';\n$cfg['Servers'][$i]['table_info']\
  \ = 'pma_table_info';\n$cfg['Servers'][$i]['table_coords'] = 'pma_table_coords';\n\
  $cfg['Servers'][$i]['pdf_pages'] = 'pma_pdf_pages';\n$cfg['Servers'][$i]['column_info']\
  \ = 'pma_column_info';\n$cfg['Servers'][$i]['history'] = 'pma_history';\n$cfg['Servers'][$i]['designer_coords']\
  \ = 'pma_designer_coords';\n```\n\n> 由于表名区分大小写，我们必须使用安装脚本创建的表名。我们可以自由更改表名（参见所列配置指令的右侧部分），前提是在数据库中相应更改。\n\
  \npmadb 和每个表都有特定的功能，如下所列：\n\n- pmadb: Defines the database where all tables are\
  \ located\n- bookmarktable: Contains the bookmarks (explained in Chapter 14)\n-\
  \ relation: Defines inter-table relations, as used in many of the phpMyAdmin's features\n\
  - table_info: Contains the display field (explained later in this chapter)\n- table_coords\
  \ and pdf_pages: Contain the metadata necessary for drawing a schema of the relations\
  \ in a PDF format (explained in Chapter 15)\n- column_info: Used for column-commenting\
  \ and MIME-based transformations (explained in Chapter 16)\n- history: Contains\
  \ SQL query history information (explained in Chapter 12)\n- designer_coords: Holds\
  \ the coordinates used by the Designer feature (explained later in this chapter)\n\
  \n\n\n每个 phpMyAdmin 版本之间，基础设施可能会得到增强。（更改在 Documentation.html 中有说明。）这就是为什么 phpMyAdmin\
  \ 有各种检查来确定表的结构的原因。如果我们知道正在使用最新结构，可以将 $cfg['Servers'][$i]['verbose_check'] 设置为 FALSE\
  \ 以避免检查，从而略微提高 phpMyAdmin 的速度。\n\n安装现已完成。我们将在接下来的章节中测试功能。我们可以通过返回主页进行快速检查；警告信息应该已经消失。\n\
  \n## 单用户安装\n\n即使系统管理员只允许我们使用一个数据库，我们仍然可以使用 phpMyAdmin 的所有关系功能。\n\n在此设置中，我们将使用我们的普通数据库（假设其名称为\
  \ marc_book）来存储元数据表，并在 config.inc.php 中将我们自己的登录名（marc）定义为控制用户。\n\n```\n$cfg['Servers'][$i]['controluser']\
  \ = 'marc';\n$cfg['Servers'][$i]['controlpass'] = 'bingo';\n```\n\n下一步是修改 scripts/create_tables.sql\
  \ 文件的本地副本，以用所有需要的表填充我们的数据库。它们将具有 pma_ 前缀以便轻松识别。（另请参阅多用户安装部分中关于 scripts 目录中可能可用的其他脚本的说明。）\n\
  \n如果我们使用 scripts/create_tables.sql，需要做的修改是删除以下行：\n\n```\nCREATE DATABASE IF NOT\
  \ EXISTS `phpmyadmin`\n  DEFAULT CHARACTER SET utf8 COLLATE utf8_bin;\nUSE phpmyadmin;\n\
  ```\n\n这是因为我们不会使用 phpmyadmin 数据库。接下来，我们应该在 phpMyAdmin 中打开我们的 marc_book 数据库。现在我们可以执行脚本了。有两种方法可以做到这一点：\n\
  \n- 由于我们已经在编辑器中有脚本，可以直接复制行并粘贴到 SQL 子页面的查询框中。\n- 另一种方法是使用第 8 章中显示的导入技术。我们选择刚刚修改的\
  \ create_tables.sql 脚本。\n\n创建后，左侧面板会显示特殊的 pma_ 表以及我们的普通表。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_201_0.png)\n\
  \n最后一步是调整 config.inc.php 中与关系功能相关的所有参数。请参考上一节，除了 pmadb 参数中的数据库名称：\n\n```\n$cfg['Servers'][$i]['pmadb']\
  \ = 'marc_book';\n```\n\n## 使用关系视图定义关系\n\n在安装了链接表基础设施后，数据库视图和表视图中现在有更多选项可用。我们现在将在表视图的结构子页面中检查一个新的链接\
  \ – 关系视图。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_201_1.png)\n\n此视图用于：\n\n-\
  \ 定义当前表与其他表的关系\n- 选择显示字段\n\n我们的目标在这里是在 **book** 表（包含 **author** ID）和 **author**\
  \ 表（按 ID 描述每个作者）之间创建关系。我们从 **book** 表的表视图开始，进入 **Structure**，然后单击 **Relation view**\
  \ 链接。\n\n### 内部关系\n\n由于 **book** 表采用 MyISAM 格式，我们会看到以下屏幕（否则显示会不同，如后面 *Foreign Key\
  \ Relations* 部分所述）：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_202_0.png)\n\n此屏幕允许我们创建\
  \ **Internal relations**（存储在 pma_**relation** 表中），因为 MySQL 本身对 MyISAM 表没有任何关系概念。每个列旁边的空下拉列表表示没有任何关系（链接）到任何外表。\n\
  \n### 定义关系\n\n我们可以将 **book** 表的每个字段关联到另一个表（或同一表中的字段，因为有时需要自引用关系）中的字段。界面会在同一数据库的所有表中查找唯一和非唯一键，并在下拉列表中显示这些键。（目前不支持从界面创建到其他数据库的内部关系。）对于\
  \ **author_id** 字段的适当选择是从 **author** 表中选择相应的 **author_id** 字段——也称为 **defining the\
  \ foreign key**。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_203_0.png)\n\n然后我们单击保存，定义将保存在\
  \ phpMyAdmin 的基础设施中。要删除关系，只需返回屏幕，选择空选项，然后单击保存即可。\n\n### 定义显示字段\n\n我们 author 表的主键是\
  \ author_id，这是一个我们为键目的而编造的唯一数字。我们表中的 name 字段——name——表示作者姓名。将作者姓名作为 book 表中每一行的描述会很有趣。这就是显示字段的目的。我们通常应为每个作为外表参与关系的表定义一个显示字段。\n\
  \n我们将在“已定义关系的优势”部分看到此信息如何显示。我们现在进入 author 表（在本例中为外表）的关系视图并指定显示字段。我们选择 name 作为显示字段并单击保存。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_203_1.png)\n\nphpMyAdmin 仅允许为一个表定义一个显示字段，并且该字段在该表用作外表的任何关系中都使用。\n\
  \n此关系的定义现已完成。虽然我们没有将 author 表中的任何字段关联到另一个表，但可以这样做。例如，我们可以在此表中有一个国家代码，并可以创建与国家表国家代码的关系。\n\
  \n我们将在后面的部分讨论已定义此关系的益处。现在，我们将看看如果我们的表受 InnoDB 或 PBXT 存储引擎控制会发生什么。\n\n## 外键关系\n\n\
  InnoDB 和 PBXT 存储引擎为我们提供了一个外键系统。\n\n> 您可以选择，本节中的练习可以用 InnoDB 或 PBXT 完成。文中选择了 InnoDB。\n\
  \n首先，我们将 book 和 author 表切换到 InnoDB 存储引擎。我们可以从表视图中的 Operations 子页面执行此操作。我们首先对 author\
  \ 表执行此操作，如以下屏幕截图所示：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_204_0.png)\n\n当\
  \ book 表的存储引擎更改为 InnoDB 时会出现问题。此表中有全文索引，而 InnoDB 引擎目前不支持这种类型的索引：\n\n```\nALTER TABLE\
  \ `book` ENGINE = InnoDB;\nMySQL said:\n#1214 - The used table type doesn't support\
  \ FULLTEXT indexes\n```\n\n为了消除此错误消息，我们返回 book 表的 **Structure** 并删除 **description**\
  \ 字段上的全文索引。当我们在此屏幕上时，让我们也删除我们在 **author_id** 和 **language** 上创建的组合索引。我们这样做是因为我们希望在本章后面看到缺少索引的后果。此时，我们能够将\
  \ book 表切换到 InnoDB。\n\nInnoDB 中的外键系统在相关表之间维护完整性。因此，我们不能向 book 表添加不存在的作者 ID。此外，当对主表（在我们的例子中为\
  \ book）执行 DELETE 或 UPDATE 操作时，操作是可编程的。\n\n在 **Structure** 子页面打开 book 表并进入 **Relation\
  \ view**，现在会显示不同的页面：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_205_0.png)\n\n\
  此页面告诉我们：\n\n- 我们已为 **author_id** 到 author 表定义了内部关系。\n- 我们尚未定义任何 InnoDB 关系。\n- 当在\
  \ InnoDB 中定义了相同的关系时，我们将能够删除内部关系。事实上，phpMyAdmin 建议我们：“**An internal relation is not\
  \ necessary when a corresponding FOREIGN KEY relation exists**”。因此，最好将其删除。\n- InnoDB\
  \ 关系可用于 **ON DELETE** 和 **ON UPDATE** 选项。\n\n\n\n在可能的相关键选择中，我们可以看到同一数据库中所有 InnoDB\
  \ 表中定义的键。（在 phpMyAdmin 中，目前不支持跨数据库关系。）我们甚至可以看到当前表中定义的键，因为自引用关系是可能的。我们现在删除 **author_id**\
  \ 字段的内部关系并点击 **保存**。我们希望为 **author_id** 字段添加一个 InnoDB 类型的关系，但我们无法做到。在这一行我们看到 **未定义索引！**\
  \ 消息。这是因为在 InnoDB 或 PBXT 中定义外键只有在两个字段都定义为索引时才可以进行。\n\n> 有关约束的其他条件在 MySQL 手册中进行了说明。请参阅\
  \ http://dev.mysql.com/doc/refman/5.0/en/innodb-foreign-key-constraints.html。\n\n\
  因此，我们回到 book 表的 **结构** 页面并为 **author_id** 字段添加一个普通（非唯一）索引，生成：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_206_0.png)\n\
  \n在 **关系视图** 中，我们可以再次尝试添加我们想要的关系；这次它成功了！\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_206_1.png)\n\
  \n我们还可以使用 **ON DELETE** 和 **ON UPDATE** 选项设置一些操作。例如，**ON DELETE CASCADE** 会使 MySQL\
  \ 在从父表中删除对应行时自动删除相关（外键）表中的所有行。例如，当父表为 **invoices**，外键表为 **invoice-items** 时，这将很有用。\n\
  \n> 如果我们尚未这样做，我们应该为 author 表定义显示字段，如 Internal phpMyAdmin Relations 部分所述。\n\n## 无关联表基础设施的外键\n\
  \n即使未安装关联表基础设施，我们仍会在 InnoDB 或 PBXT 表的 结构 页面上看到 Relation View 链接。这会带我们进入一个屏幕，在此我们可以定义外键，在本例中为\
  \ book 表。\n\n请注意，如果我们选择此方式，则无法定义关联表（此处为 author）的显示字段，因为它属于 phpMyAdmin 的基础设施。因此，我们将失去查看外键关联描述的好处。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_207_0.png)\n\n## 使用 Designer 定义关系\n\n\
  基于 Ajax 的 Designer 功能出现在 phpMyAdmin 2.10 中。它提供了一种基于鼠标的管理关系（内部和基于外键）以及为每个表定义显示字段的方式。它还可以充当：\n\
  \n- 访问现有表结构并访问表创建页面的菜单。\n- 如果我们想要包含所有表的 PDF 架构，则为 PDF 架构管理器。\n\n在 Designer 工作区中，我们可以在同一面板上处理所有表的关系。另一方面，Relation\
  \ view 每次仅显示单个表的关系。\n\n我们可以通过点击 Database view 中的 Designer 菜单选项卡来访问此功能。\n\n> 如果此菜单选项卡未出现，则是因为我们尚未安装本章前面所述的关联表基础设施——尤其是\
  \ designer_coords 特殊表。\n\n## 界面概览\n\nDesigner 页面包含可查看表的主工作区。该工作区会根据表的位置动态地扩大和缩小。顶部菜单包含图标，将鼠标悬停在其上时会显示其描述。以下是顶部菜单图标功能的摘要：\n\
  \n- **显示/隐藏左侧菜单**：用于左侧菜单的显示\n- **保存位置**：将工作区的当前状态保存到基础设施中\n- **创建表**：退出设计器并进入创建表的对话框\n\
  - **创建关系**：将设计器置于创建关系模式\n- **选择显示字段**：指定代表表的字段\n- **重新加载**：再次获取表的信息\n- **帮助**：提供关于选择关系的说明\n\
  - **Angular 链接/直接链接**：指定关系链接的形状\n- **吸附到网格**：影响表移动相对于想象网格的行为\n- **全部小/大**：隐藏或显示每个表的列列表\n\
  - **切换小/大**：反转每个表的列显示模式，因为该模式可通过表的角图标 V 或 > 选择\n- **导入/导出**：生成 PDF\n- **移动菜单**：顶部菜单可以向右移动并返回\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_208_0.png)\n\n点击 **显示/隐藏左侧菜单** 图标时会出现侧边菜单。其目的是展示完整的表列表，决定哪些表出现在工作区，并启用访问特定表的\
  \ **结构** 页面。在此示例中，我们选择如图所示从工作区中移除 **book-copy** 表：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_209_0.png)\n\
  \n如果我们希望此移除永久生效，我们点击顶部的 **保存位置** 图标。该图标还会保存我们表在工作区上的当前位置。\n\n表可以通过拖动其标题栏在工作区上移动，表的列列表可以通过每个表的左上角图标使其可见/不可见。在此列列表中，小图标显示我们的数据类型（数字、文本、日期），并告诉我们该列是否为键。\n\
  \n## 定义关系\n\n由于我们已经使用 Relation view 定义了一个关系，我们将首先了解如何删除它。Designer 不允许更改关系。然而，Designer\
  \ 允许删除和定义关系。\n\n问号顶部图标显示一个面板，解释在哪里点击以选择关系以便后续删除。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_210_0.png)\n\
  \n让我们在适当的位置点击以删除此关系。我们会得到一个确认面板，在其上点击 Delete。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_210_1.png)\n\
  \n然后我们可以继续重新创建它。为此，我们首先点击 Create relation 图标。此时光标会变成一条简短的消息，显示 Select referenced\
  \ key。在我们的例子中，被引用键是 author 表的 id 列；因此我们将光标移到该列上并点击它。会进行验证，确保我们选择的是主键或唯一键。\n\n接下来，光标变为\
  \ **Select foreign key** 后，我们将其移到 book 表的 **author_id** 列并再次点击。这确认了关系的创建。目前，界面不允许创建复合键（具有多于一列的键）。\n\
  \n## 外键关系\n\n在 InnoDB 或 PBXT 表之间删除或定义关系的流程与内部关系相同。唯一的例外是，在创建时会出现不同的确认面板，使我们能够指定\
  \ ON DELETE 和 ON UPDATE 操作。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_211_0.png)\n\
  \n## 定义显示字段\n\n在工作区中，我们注意到 **author** 表中的 name 列具有特殊的背景颜色。这表明该列用作显示字段。我们只需点击顶部的\
  \ **选择显示字段** 图标，并将简短消息 **选择显示字段** 拖到另一列——例如 phone 列。这会将显示字段更改为该列。如果我们将消息拖到现有的显示字段列上，我们将移除该列作为表的显示字段。\n\
  \n## 导出为 PDF 架构\n\n在第 15 章中，我们将了解如何为数据库的子集生成 PDF 架构。我们可以将此类架构中的表坐标导入 Designer's\
  \ 工作区，反之亦可将其导出到 PDF 架构。为此提供了 Import/export coordinates 顶部图标。\n\n## 已定义关系的好处\n\n\
  在本节中，我们将查看当前可以测试的已定义关系的好处。其他好处将在第 13 章和第 15 章中描述。关联表基础设施的额外好处将在第 14 章和第 16 章中出现。\n\
  \n这些好处适用于内部和外键关系。\n\n## 外键信息\n\n让我们通过进入 Search 子页面并选择显示前四列来浏览 book 表。我们看到相关键（author_id）现在是一个链接。将鼠标指针移到任何\
  \ author_id 值上会显示作者姓名（由 author 表的显示字段定义）。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_212_0.png)\n\
  \n点击 author_id 会带我们到与此特定作者相关的表——author——：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_212_1.png)\n\
  \n\n\n## 外键的下拉列表\n\n回到书表，在插入模式（或编辑模式）中，我们现在会看到每个具有定义关系的字段的可能键的下拉列表。该列表以两种顺序包含键和描述（显示字段）——键到显示字段以及显示字段到键。这使我们能够使用键盘，并输入键或显示字段的首字母。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_213_0.png)\n\n只有键（本例中为 1）会被存储在书表中。显示字段仅用于辅助我们。\n\
  \n默认情况下，如果外表中的行数最多为 100 行，则会显示此下拉列表。这由以下参数控制：\n\n```\n$cfg['ForeignKeyMaxLimit']\
  \ = 100;\n```\n\n对于更大的外表，会出现一个不同的窗口——外表窗口（见下一节），可以浏览。\n\n我们可能希望在下拉列表中以不同的方式查看信息。这里，John\
  \ Smith 是内容，1 是 ID。默认显示由以下控制\n\n```\n$cfg['ForeignKeyDropdownOrder'] = array( 'content-id',\
  \ 'id-content');\n```\n\n我们可以在定义数组中使用一个或两个字符串——content-id 和 id-content——并按我们偏好的顺序排列。因此，将\
  \ $cfg['ForeignKeyDropdownOrder'] 定义为 array('id-content') 将只产生以下选择：\n\n- 1 – John\
  \ Smith\n- 2 – Maria Sunshine\n- 3 – André Smith\n\n## 可浏览的外表窗口\n\n我们当前的作者表条目很少。因此，为了说明此机制，我们将把\
  \ $cfg['ForeignKeyMaxLimit'] 设置为人为的低数值 1。现在在书表的插入模式中，我们会看到 author_id 的一个小表形图标。此图标会打开另一个窗口，该窗口将显示\
  \ author 表的值以及一个搜索输入字段。左侧的值按键值排序（这里是 author_id 列），右侧按描述排序。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_214_0.png)\n\
  \n选择其中一个值（通过点击键值或描述）会关闭此窗口并将值带回 author_id 列。\n\n## 引用完整性检查\n\n我们在第 10 章讨论了操作子页面及其表维护部分。对于此练习，我们假设书表和作者表都不受\
  \ InnoDB 或 PBXT 存储引擎控制。如果我们为作者表定义了内部关系，则书表会出现一个新的选择 – 检查引用完整性。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_214_1.png)\n\
  \n对于每个定义的关联都会出现一个链接（author_id -> author.id），点击它会开始验证。对于每一行，都会验证外表中对应键的存在性，并报告错误（如有）。如果结果页面报告零行，则是好消息！\n\
  \n此操作存在的原因是，对于不原生支持外键的存储引擎下的表，MySQL 和 phpMyAdmin 都不会强制执行引用完整性。例如，完全可能将无效的 **author_id**\
  \ 值导入书表。\n\n## 元数据的自动更新\n\nphpMyAdmin 会将内部关系的元数据与通过 phpMyAdmin 对表所做的每一次更改保持同步。例如，重命名关系的一部分列会使\
  \ phpMyAdmin 在关系的元数据中重命名此列。这保证了内部关系即使在列名更改后仍能继续 functioning。删除列或表时也会发生同样的情况。\n\n\
  > 如果结构更改是在 phpMyAdmin 之外进行的，则应手动维护元数据。\n\n## 列注释\n\n在 MySQL 4.1 之前，MySQL 结构本身不支持为列添加注释。尽管如此，得益于\
  \ phpMyAdmin 的元数据——我们可以对列进行注释。然而，自 MySQL 4.1 以来，原生列注释已被支持。好消息是，对于任何 MySQL 版本，phpMyAdmin\
  \ 中的列注释始终通过 **Structure** 页面访问，通过编辑每个字段的结构。在以下示例中，我们需要注释三个列。因此，我们选择它们并点击 **With\
  \ selected** 选择附近的铅笔图标。\n\n|   | Field | Type |\n|---|---|---|\n| ☑ | isbn | varchar(25)\
  \ |\n| ☐ | title | varchar(100) |\n| ☑ | page_count | int(11) |\n| ☑ | author_id\
  \ | int(11) |\n\n为了获得此处所示的下一个面板，我们通过将 $cfg['DefaultPropDisplay'] 设置为 'vertical'\
  \ 以垂直模式工作。我们输入以下注释：\n\n- isbn: book number\n- page_count: approximate\n- author_id:\
  \ cf author table\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_216_0.png)\n\n然后我们点击保存。\n\
  \n这些注释会出现在各个地方——例如，在导出文件（见第 7 章）中，在 PDF 关系模式（见第 15 章）中，以及在浏览模式中。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_216_1.png)\n\
  \n如果我们不希望注释出现在浏览模式中，可以将 $cfg['ShowBrowseComments'] 设置为 FALSE。（默认值为 TRUE。）\n\n列注释也会作为工具提示出现在\
  \ Structure 页面中，并且列名会用破折号下划线标出。要停用此行为，可以将 $cfg['ShowPropertyComments'] 设置为 FALSE。（该项默认也为\
  \ TRUE。）\n\n## 自动迁移\n\n每当 phpMyAdmin 检测到列注释已存储在其元数据中，并且我们使用的是 MySQL 4.1.2 或更高版本时，它会自动将这些列注释迁移到原生的\
  \ MySQL 列注释。\n\n## 摘要\n\n本章介绍了如何安装保持特殊元数据（关于表的数据）所需的必要基础设施，以及如何在 InnoDB 和非 InnoDB\
  \ 表之间定义关系。它还检查了 phpMyAdmin 在存在关系时的修改行为以及外键。最后，它涵盖了 Designer 功能、列注释以及如何从表中获取信息。第\
  \ 12 章将介绍输入 SQL 命令的手段，当 phpMyAdmin 的界面不足以完成我们所需的操作时，这些命令很有用。\n"
- '# 12 输入 SQL 命令


  ## 输入 SQL 命令


  本章解释了我们如何将自己的 SQL 命令（查询）输入到 phpMyAdmin 中，以及如何保留这些查询的历史记录。


  ## SQL 查询框


  phpMyAdmin 允许我们通过其图形界面完成许多数据库操作。然而，在某些时候，我们必须依赖 SQL 查询输入来实现复杂操作。以下是一些复杂查询的示例：


  ```

  SELECT department, AVG(salary) FROM employees GROUP BY department

  HAVING years_experience > 10;

  SELECT FROM_DAYS(TO_DAYS(CURDATE()) +30);

  ```


  要输入此类查询，查询框可在 phpMyAdmin 内的多个位置获得。


  ## 数据库视图


  我们遇到的第一个查询框是在数据库视图中进入 SQL 菜单时。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_219_0.png)


  此框很简单——我们输入一些有效的（希望是）MySQL 语句并点击 Go。在查询文本区域下方，有与书签相关的选择（第 14 章后面会解释）。通常，我们不必更改标准的
  SQL 分隔符，即分号。然而，如果需要，有分隔符对话框（见第 17 章）。


  要使默认查询出现在此框中，我们可以使用 $cfg[''DefaultQueryDatabase''] 配置指令来设置，默认情况下它是空的。我们可以在此指令中放置一个类似
  SHOW TABLES FROM %d 的查询。此查询中的 %d 参数将被当前数据库名称替换，从而在查询框中得到 SHOW TABLES FROM `marc_book`。


  ## 表视图


  在表视图的 SQL 菜单中，有一个略有不同的框。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_220_0.png)


  右侧有一个字段选择器和一个插入按钮（<<）。该框已具有如前一屏幕截图所示的默认查询。


  此默认查询由 $cfg[''DefaultQueryTable''] 配置指令生成，其中包含 SELECT * FROM %t WHERE 1。这里，%t 被当前表名替换。$cfg[''DefaultQueryTable'']
  中还提供了一个占位符 %f。此占位符将被此表的完整字段列表替换，从而生成以下查询：


  ```

  SELECT `isbn`, `title`, `page_count`, `author_id`, `language`, `description`, `cover_photo`,
  `genre`, `date_published`, `stamp`, `some_bits` FROM `book` WHERE 1.

  ```




  WHERE 1 是一个始终为真的条件。因此，查询可以照常执行。我们可以用想要的条件替换 1，或者输入一个完全不同的查询。


  ## 字段选择器


  字段选择器是一种加快查询生成的方式。通过选择一个字段并点击箭头 <<，该字段名称会被复制到查询框中当前光标位置。这里，我们选择 author_id 字段，删除数字
  1，然后点击 <<。接着添加条件 = 2。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_221_0.png)


  “再次在此处显示此查询”选项（默认情况下已选中）可确保如果我们仍在同一页面，查询在执行后会保留在框中。对于像 UPDATE 或 DELETE 这样会影响表但不会产生单独结果页面的查询，这种情况更容易看到。


  ## 点击查询框


  我们可能希望使用 $cfg[''TextareaAutoSelect''] 配置指令来更改查询框内点击的行为。其默认值是 FALSE，这意味着点击时不会自动选择内容。如果将此指令更改为
  TRUE，则首次点击此框时会选择其所有内容。（这是一种快速将内容复制到别处或从框中删除内容的方式。）下一次点击会将光标置于点击位置。


  ## 查询窗口


  在第 3 章中，我们讨论了此窗口的目的以及更改某些参数（如尺寸）的步骤。此窗口可通过左侧面板中的 SQL 图标或查询窗口链接轻松打开，非常适合输入查询并进行测试。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_222_0.png)


  以下屏幕截图显示了出现在右侧面板上的查询窗口：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_222_1.png)


  屏幕截图中看到的窗口包含与表视图上下文中使用的相同的 **字段** 选择器和 **<<** 按钮。此独立的查询窗口仅在启用 JavaScript 的浏览器中受支持。


  ## 查询窗口选项


  **SQL** 选项卡是此窗口中的默认活动选项卡。这来自配置指令 `$cfg[''QueryWindowDefTab'']`，其默认包含 **sql**。


  如果我们希望另一个选项卡成为默认活动选项卡，可以将 **sql** 替换为 **文件** 或 **历史**。另一个值 **完整** 会同时显示三个选项卡的所有内容。


  在查询窗口中，我们看到一个 **不要从窗口外部覆盖此查询** 的复选框。通常情况下，该复选框未选中。我们在生成查询时所做的更改会反映在查询窗口中。这称为 **同步**。例如，从左侧或右侧面板选择不同的数据库或表会相应地更新查询窗口。但是，如果我们开始直接在此窗口中输入查询，复选框将被选中以保护其内容并移除同步。这样，此处编写的查询将被锁定并受到保护。


  ## 基于会话的 SQL 历史记录


  此功能会将我们执行的全部成功 SQL 查询作为 PHP 会话数据收集，并修改查询窗口以使其可用。这种默认类型的历史记录是临时的，因为 `$cfg[''QueryHistoryDB'']`
  默认设置为 FALSE。


  ## 基于数据库的 SQL 历史记录（永久）


  由于我们已安装了关联表基础设施（参见第 11 章），因此有更强大的历史机制可用。通过将 `$cfg[''QueryHistoryDB'']` 设置为 TRUE
  来触发此机制。


  在我们从其中一个查询框尝试一些查询后，会建立一个历史记录，只能从查询窗口中看到。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_223_0.png)


  我们可以看到（按相反顺序）最近的成功查询以及它们所执行的数据库。仅从查询框输入的查询会保留在此历史记录中。由 phpMyAdmin 生成的查询（例如通过点击 **浏览**
  生成的查询）不会保留在此处。


  它们可以点击立即执行，并且 **编辑** 图标可用于将记录的查询插入查询框以进行编辑。


  将保留的查询数量由 $cfg[''QueryHistoryMax''] 控制，默认设置为 25。此限制并非出于性能原因，而是为了实现视觉上无障碍的视图而设定的实用限制。额外的查询在登录时会被消除，这一过程传统上称为
  **垃圾回收**。查询存储在 $cfg[''Servers''][$i][''history''] 中配置的表中。


  ## 在查询窗口中编辑查询


  在成功查询的结果页面上，会出现一个包含已执行查询的标题，如以下屏幕截图所示：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_224_0.png)


  点击 **编辑** 会打开查询窗口的 **SQL** 选项卡，并准备好修改此查询。这是因为该参数的以下默认设置：


  ```

  $cfg[''EditInWindow''] = TRUE;

  ```


  当其设置为 FALSE 时，点击 **编辑** 不会打开查询窗口；相反，查询会出现在 **SQL** 子页面的查询框中。


  ## 多语句查询


  在 PHP 和 MySQL 编程中，我们只能使用 mysql_query() 函数调用一次发送一个查询。phpMyAdmin 允许我们使用分号作为分隔符在一次传输中发送多个查询。假设我们在查询框中输入以下查询：


  ```

  INSERT INTO author VALUES (100,''Paul Smith'',''111-2222'');

  INSERT INTO author VALUES (101,''Melanie Smith'',''222-3333'');

  UPDATE author SET phone=''444-5555'' WHERE name LIKE ''%Smith%'';

  ```


  我们将收到以下结果屏幕：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_225_0.png)


  我们通过注释看到受影响的行数，因为 $cfg[''VerboseMultiSubmit''] 设置为 TRUE。


  让我们再次发送相同的查询列表并观察结果：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_225_1.png)


  收到一条 Duplicate entry 错误，提示值 100 已存在，这是正常的。我们看到的是第一个 INSERT 语句的结果；那下一个会怎样？执行在第一个错误处停止，因为
  $cfg[''IgnoreMultiSubmitErrors''] 设置为 FALSE，指示 phpMyAdmin 不要忽略多语句中的错误。如果将其设置为 TRUE，程序将依次尝试所有语句，我们会看到两个
  Duplicate entry 错误。


  如果我们尝试多个 SELECT 语句，此功能将无法按预期工作。我们将只看到最后一个 SELECT 语句的结果。


  ## 漂亮打印（语法高亮）


  默认情况下，phpMyAdmin 会解析并高亮显示其处理的任何 MySQL 语句的各个元素。这由 $cfg[''SQP''][''fmtType''] 控制，默认设置为
  ''html''。此模式为每个不同元素（保留字、变量、注释等）使用特定颜色，如位于主题特定 layout.inc.php 文件中的 $cfg[''SQP''][''fmtColor'']
  数组所述。


  在之前的示例中，fmtType 设置为 `text`，因为这种模式在书中更易读。此模式会在 MySQL 语句内部的逻辑点插入换行符，但不涉及颜色。当 fmtType
  设置为 `html` 时，phpMyAdmin 会以语法高亮报告 SQL 语句。然而，将 fmtType 设置为 `none` 会移除所有格式，保持我们的语法不变。


  > 配置文件中用于保存某些参数的多维数组反映了 phpMyAdmin 开发团队采用的编程风格。这确保了参数名称不会过长。


  ## SQL 验证器


  每次 phpMyAdmin 传输查询时，MySQL 服务器都会对其进行解释并提供反馈。查询的语法必须遵循 MySQL 规则，这与标准 SQL 不同。然而，符合标准
  SQL 可确保我们的查询可在其他 SQL 实现中使用。


  我们可以使用一个免费的外部服务 Mimer SQL Validator。它根据 Core SQL-99 规则验证我们的查询并生成报告。Validator 可直接从
  phpMyAdmin 使用，其主页位于 http://developer.mimer.com/validator/index.htm。


  > 出于统计目的，此服务会在其服务器上匿名存储收到的查询。在存储查询时，它会将数据库、表和列名替换为通用名称。查询中包含的字符串和数字会被替换为通用值以保护原始信息。


  ## 系统要求


  此 Validator 以 SOAP 服务的形式提供。我们的 PHP 服务器必须支持 XML、PCRE 和 PEAR。我们还需要一些 PEAR 模块。以下命令（由系统管理员在服务器上执行）安装我们需要的模块：


  ```

  pear install Net_Socket Net_URL HTTP_Request Mail_Mime Net_DIME SOAP

  ```


  如果由于某些模块处于 beta 状态而导致此命令出现问题，我们可以执行以下命令，该命令将安装 SOAP 及其他依赖模块：


  ```

  pear -d preferred_state=beta install -a SOAP

  ```




  ## 使验证器可用


  一些参数必须在 config.inc.php 中进行配置。将 $cfg[''SQLQuery''][''Validate''] 设置为 TRUE 可启用 Validate
  SQL 链接。


  我们还应启用 Validator 本身（因为在未来的 phpMyAdmin 版本中可能提供其他验证器）。这可通过将 $cfg[''SQLValidator''][''use'']
  设置为 TRUE 来完成。


  Validator 默认使用匿名 Validator 账户访问，如以下命令配置：


  ```

  $cfg[''SQLValidator''][''username''] = '''';

  $cfg[''SQLValidator''][''password''] = '''';

  ```


  相反，如果公司已为我们提供了一个账户，我们可以在此处使用该账户信息。


  ## 验证器结果


  Validator 返回两种报告——一种是在查询符合标准时，另一种是在查询不符合标准时。


  ## 符合标准的查询


  我们将尝试一个简单的查询：SELECT COUNT(*) FROM book。像往常一样，我们在查询框中输入此查询并发送。在结果页面上，我们现在看到一个额外的链接——Validate
  SQL。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_227_0.png)


  点击 Validate SQL 会产生以下报告：


  ```

  Conforms to Core SQL-99

  SQL queries stored anonymously for statistical purposes.

  ```


  我们可以选择点击 Skip Validate SQL 来查看原始查询。


  ## 不符合标准的查询


  让我们尝试另一个在 MySQL 中能正确工作的查询：SELECT * FROM book WHERE language = ''en''。将其发送到 Validator
  会产生以下报告：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_228_0.png)


  每次 Validator 发现问题时，它都会在错误位置添加类似 {error: 1} 的消息，并在报告中添加脚注。这次，language 列名是非标准的。因此，Validator
  告诉我们它在此处期望一个标识符。关于 LIMIT 子句的使用还报告了另一个非标准错误，该子句是由 phpMyAdmin 添加到查询中的。


  另一个例子是反引号。如果我们只是为 book 表点击 **Browse**，phpMyAdmin 会生成 SELECT * FROM `book`，用反引号将表名括起来。这是
  MySQL 保护标识符的方式，标识符可能包含特殊字符，例如空格、国际字符或保留字。然而，将此查询发送到 Validator 会显示反引号不符合标准 SQL。我们甚至可能收到两个错误，每个反引号一个。


  ## 摘要


  本章帮助我们了解查询框的目的并展示它们的位置。它还概述了 Query 窗口选项、多语句查询、如何使用字段选择器、如何使用 SQL Validator，以及最后如何获取已输入命令的历史记录。下一章将展示如何借助
  phpMyAdmin 的查询生成器在不输入的情况下生成多表查询。

  '
- '# 13 多表查询生成器


  数据库视图或表视图中的 **Search** 页面用于单表查找。本章介绍数据库视图中可用的多表 **Query by example (QBE)** 功能。


  许多 phpMyAdmin 用户在表视图中逐表工作，因此往往会忽略多表查询生成器，而这是一个用于微调查询的绝佳功能。查询生成器不仅在多表情况下有用，在单表情况下也很有用。它使我们能够为一列指定多个条件，而表视图中的
  **Search** 页面不具备此功能。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_231_0.png)


  > 本章中的示例假定已完成链接表基础设施的多用户安装（参见第 11 章），并且在第 10 章练习期间创建的 book-copy 表仍存在于 marc_book
  数据库中。


  要打开此功能页面，我们进入特定数据库的数据库视图（查询生成器一次仅支持在一个数据库上工作）并点击 **Query**。


  对面页面的截图显示了初始 QBE 页面。它包含以下元素：


  - 条件列

  - 添加条件行的界面

  - 添加条件列的界面

  - 表选择器


  ## 多表查询生成器


  - 查询区域

  - 更新或执行查询的按钮


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_232_0.png)


  ## 选择表


  初始选择包含所有表。在此示例中，我们假设链接表基础设施已安装在 marc_book 数据库中。（参见第 11 章中的“Single-user installation”部分。）因此，字段选择器包含大量字段。对于我们的示例，我们将仅使用
  author 和 book 表。因此，我们仅从 Use Tables 选择器中选择这些表。


  然后我们点击 Update Query。这会刷新屏幕并减少字段选择器中可用的字段数量。我们始终可以使用浏览器在下拉菜单中进行多项选择的机制（通常是 control-click）稍后更改所选表。


  ## 列条件


  默认情况下提供三个条件列。本节讨论编辑其条件的选项。这些包括选择字段、排序单个列、为单个列输入条件等选项。


  ## 字段选择器：单列或所有列


  字段选择器包含所选表的各个列，以及每个表以星号 (*) 结尾的特殊选择，这意味着所有字段都被选中。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_233_0.png)


  要显示 author 表中的所有字段，我们将选择 `author`.* 并勾选 Show 复选框，而不在 Sort 和 Criteria 框中输入任何内容。在我们的例子中，我们选择
  `author`.`name`，因为我们想为作者姓名输入一些条件。


  ## 排序


  对于每个选定的单个列，我们可以指定排序（升序或降序），或让该行保持不变（不排序）。如果我们选择多个排序列，排序将从左到右进行。


  > 当我们要求对列进行排序时，我们通常会勾选 Show 复选框。但这不是必要的，因为我们可能只想执行排序操作而不显示该列。


  ## 显示列


  我们勾选 Show 复选框以便在结果中看到该列。有时，我们可能只想对列应用条件，而不将其包含在结果页面中。在这里，我们添加 phone 列，要求对其进行排序，并选择同时显示
  name 和 phone number。我们还要求按升序对 name 进行排序。排序将首先按 name 进行，如果姓名相同，则按 phone number 进行。这是因为
  name 在 phone 列左侧的条件列中，因此优先级更高。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_234_0.png)


  ## 更新查询


  在任何时候，我们都可以点击 Update Query 按钮查看生成的查询进度。我们必须在执行查询之前至少点击一次。现在，让我们点击它并查看查询区域中生成的查询。在以下示例中，我们将在每次修改后点击
  Update Query。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_234_1.png)


  我们已选择了两个表，但尚未从 book 表中选择任何列。因此，该表未在生成的查询中提及。


  ## 条件


  在 Criteria 框中，我们可以为每个对应列输入条件（遵守 SQL WHERE 子句的语法）。默认情况下，我们有两个条件行。要查找姓名中包含 Smith 的所有作者，我们使用
  LIKE 条件（LIKE ''%SMITH%''）并点击 Update Query。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_235_0.png)


  我们还有另一行可用于输入额外条件。假设我们还想找到作者 **Maria Sunshine**。这次我们使用 = 条件。两个条件行将由 OR 运算符连接，该运算符默认从界面左侧选择。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_235_1.png)




  为了演示 OR 运算符能更好地连接条件行，现在让我们在电话号码上添加一个条件 LIKE ''%8%''。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_236_0.png)


  通过检查 AND 和 OR 运算符的位置，我们可以看到条件的第一行是由 AND（因为在 name 列下选择了 AND）运算符连接的，而第二行条件是通过 OR 运算符连接到其余部分的。我们刚刚添加的条件（LIKE
  ''%8%''）并不意味着要查找任何人，因为我们已将姓名为 "Smith" 的所有作者的电话号码更改为 "444-5555"（在第 12 章中）。


  如果我们想在同一列上添加另一个条件，只需添加一个条件行即可。


  ## 调整条件行数


  条件行数可以通过两种方式更改。首先，我们可以在 Criteria 下选择 Ins 复选框来添加一个条件行（在点击 Update Query 之后）。由于此复选框一次只能添加一个条件行，我们将取消选中它并改用
  Add/Delete Criteria Row 对话框。在此对话框中，我们选择添加两行。


  再次点击 **Update Query** 按钮会显示以下屏幕：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_237_0.png)


  现在，你可以看到有两条额外的条件行（目前为空）。我们也可以删除条件行。这可以通过在 **Add/Delete Criteria Row** 对话框中选择负数，或通过勾选要删除的行旁边的
  **Del** 复选框来完成。让我们删除我们刚刚添加的两行，因为我们现在不需要它们。**Update Query** 按钮会刷新页面以应用指定的调整。


  ## 调整条件列数


  使用类似的机制，我们可以通过勾选每列下的 INS 或 Del 复选框，或使用 Add/Delete Field Columns 对话框来添加或删除列。我们已经有一个未使用的列（为节省空间，未在之前的图片中显示）。在这里，我们使用位于未使用列下方的
  Ins 复选框添加了一列（这次我们需要它）：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_238_0.png)


  ## 自动连接


  phpMyAdmin 可以为其构建的查询生成表之间的连接。现在让我们用 book 表中的 title 和 genre 字段填充我们两个未使用的列，并看看更新查询时会发生什么。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_238_1.png)


  现在有两个额外的条件列，分别与 `book`.`title` 和 `book`.`genre` 列相关。phpMyAdmin 利用其对表之间定义的关系的了解，在
  author_id 键字段上生成了一个 LEFT JOIN 子句（在前一图中突出显示）。当前版本的不足之处在于只检查内部关系，而不检查 InnoDB 关系。


  > 连接中可能涉及两个以上的表。


  ## 执行查询


  点击 Submit Query 按钮会将查询发送以执行。在以下图中，你可以看到上半部分完整的生成查询和下半部分的结果数据行：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_239_0.png)


  一旦提交查询，除了使用浏览器的 **Back** 按钮外，没有简单的方法返回到查询生成页面。下一章讨论如何保存生成的查询以便以后执行。


  ## 摘要


  本章涵盖了各个方面，包括打开查询生成器、选择表、输入列条件、排序和显示列，以及更改条件行或列的数量。它还向我们展示了如何使用 AND 和 OR 运算符来定义行和列之间的关系，以及如何使用表之间的自动连接。第
  14 章将向你展示如何永久保存查询的书签。

  '
- '# 14 书签


  本章介绍查询书签——链接表基础设施的一项功能。能够为查询标记标签并按标签召回，可以节省大量时间。书签是以下类型的查询：


  - 永久存储

  - 可查看

  - 可擦除

  - 与一个数据库相关

  - 仅在用户意愿下记录

  - 有标签

  - 默认私有（仅创建者可用），但可能公开


  书签也可以有一个可变部分，如本章后面 Passing a parameter value to a bookmark 部分所述。


  没有用于管理书签的书签子页面。相反，书签的各种操作可在特定页面上进行，例如结果页面或查询框页面。


  ## 比较书签和查询历史功能


  在第 12 章中，我们了解了 SQL 历史功能，它会自动存储查询（临时或永久）。历史中存储的查询与书签之间存在相似之处。毕竟，这两个功能都旨在为以后执行而存储查询。然而，在存储方式和触发查询记录的操作方面存在重要差异。


  永久历史中存储的查询数量有一个可配置的限制（参见第 12 章）；然而，书签的数量没有限制。此外，历史功能按发送时间的逆序显示查询。然而，书签按标签显示（不直接显示查询文本）。最后，历史中的查询存储是自动的，而查询作为书签保存则是通过用户的明确请求。


  总结一下，自动查询历史在我们既不打算召回查询，也不希望记住输入了哪些查询时很有用。这与书签功能形成对比，在书签功能中，我们有意要求系统记住一个查询，甚至为其命名（标签）。因此，我们可以用书签做更多事情，而不是查询历史，但两者各有重要性。


  ## 书签创建


  创建查询有两个时机——在查询执行后（这种情况下我们不需要提前计划其创建）或在将查询发送到 MySQL 服务器执行之前。以下各节将探讨这两种选项。


  ## 在成功查询后创建书签


  初始书签创建由 Bookmark this SQL query 按钮实现。该按钮仅在执行生成结果的查询后出现（当至少找到一行时）；因此，这种创建书签的方法仅存储
  SELECT 语句。例如，第 13 章中看到的多表查询生成器产生的复杂查询，如果找到一些结果，可以通过这种方式存储为书签。


  让我们看一个例子。在 book 表的 Search 页面中，我们选择希望在结果中显示的字段，并按以下屏幕截图所示输入搜索值：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_243_0.png)


  点击 Go 后，我们看到结果页面显示了一个书签对话框。我们仅为此书签输入一个标签，然后点击 Bookmark this SQL query 将此查询保存为书签。书签保存在由
  `$cfg[''Servers''][$i][''bookmarktable'']` 定义的表中。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_243_1.png)


  此书签对话框可在任何包含结果的页面上看到。作为测试，我们只需为某个表点击 **Browse** 以获取结果，然后将此查询存储为书签即可。然而，将一个只需点击一下即可轻松完成的查询存储在书签中并没有多大意义。


  ## 在发送查询前存储书签


  有时，即使查询没有找到任何结果，我们也可能想存储一个书签。如果匹配的数据尚未存在，或查询不是 SELECT 语句，则可能出现这种情况。为此，我们在 Database
  视图、Table 视图和查询窗口的 **SQL** 选项卡中提供了 **Bookmark this SQL query** 对话框。


  现在我们进入 **book** 表的 **SQL** 子页面，输入一个查询，并直接在 **Bookmark this SQL query** 字段中输入 **books
  in French** 书签标签。如果此书签标签以前使用过，除非我们选择 **Replace existing bookmark of same name**
  复选框，否则将创建具有相同名称的新书签。书签带有内部标识号以及用户选择的标签。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_244_0.png)


  点击 **Go** 后，查询将被执行并存储为书签。即使查询没有找到任何内容也没关系。这就是我们如何为非 SELECT 查询（如 UPDATE、DELETE、CREATE
  TABLE 等）生成书签的方式。




  > 此技术也可用于返回结果或不返回结果的 SELECT 语句。


  ## 公共书签


  我们创建的所有书签默认都是私有的。当创建书签时，我们登录时使用的用户名会与书签一起存储。假设我们选择让每个用户访问此书签，如以下屏幕截图所示：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_245_0.png)


  这将产生以下效果：


  - 可以访问同一数据库（当前数据库）的所有用户都将可以访问该书签。

  - 用户从书签中看到有意义的结果的能力取决于他们对书签中引用的表所拥有的权限。

  - 用户将能够删除该书签。


  ## 表的默认初始查询


  在之前的示例中，我们根据自己的喜好选择了书签标签。然而，按惯例，如果书签的名称与表名相同，则在为该表点击 Browse 时会执行它。因此，我们将不会看到该表的正常
  Browse 结果，而是会看到书签的结果。


  ## 书签


  假设我们有兴趣查看（默认在 Browse 模式下）页数少于 300 的书籍。我们首先生成适当的查询，这可以很容易地从 Search 页面完成，然后我们在结果页面上使用
  book 作为标签。


  ```

  SELECT `isbn`, `title`, `page_count`, `author_id`

  FROM `book`

  WHERE `page_count` <300

  LIMIT 0, 30

  ```


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_246_0.png)


  ## 多查询书签


  单个书签也可以存储多个查询（用分号分隔）。这主要对非 SELECT 查询有用。例如，假设我们需要定期清理作者数据，从电话号码中删除无效区号。此操作总是会随后显示
  author 表。


  为实现此目标，我们存储一个书签（在发送执行之前），其中包含以下查询：


  ```

  update author set phone = replace(phone,''(123)'',''(456)'');

  select * from author;

  ```


  在书签中，我们可以放置许多数据修改语句，如 INSERT、UPDATE 或 DELETE，可选择跟随一个 SELECT 语句。堆叠大量 SELECT 语句不会产生预期结果，因为我们只能看到最后一个
  SELECT 语句获取的数据。


  ## 从书签列表中召回


  这些书签现在可以很容易地在以下页面找到：


  - 表视图：marc_book 中任何表的 SQL 子页面

  - 查询窗口：SQL-History 选项卡

  - 在浏览 pma_bookmark 表时（请参阅后面的“通过浏览 pma_bookmark 表执行书签”部分）

  - 数据库视图：marc_book 数据库的 SQL 子页面


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_247_0.png)


  召回书签时有三种选择——Submit、View only 和 Delete（Submit 为默认值）。


  ## 书签执行


  选择第一个书签并点击 Go 会执行存储的查询并显示其结果。书签执行后的页面没有创建书签的另一个对话框，因为这将是多余的。


  > 我们得到的结果不一定与创建书签时相同。它们反映了数据库的当前内容。只有查询被存储为书签。


  ## 书签操作


  有时，我们可能只想确定书签的内容。这是通过选择一个书签并选择 **仅查看** 来完成的。只会显示查询。然后我们可以点击 **编辑** 并重新处理其内容。这样做时，我们将编辑原始书签查询的副本。为了保留这个新编辑的查询，我们可以将其保存为书签。同样，即使我们选择相同的书签标签，这也会创建另一个书签，除非我们明确要求替换原始书签。


  书签可以用 **删除** 选项擦除。删除书签时没有确认对话框。删除后只会显示一条消息：**书签已被删除。**


  ## 书签参数


  如果我们再次查看我们创建的第一个书签（查找所有 **作者 1** 的书籍），我们意识到虽然它很有用，但仅限于查找同一作者。


  特殊的查询语法使能够向书签传递参数。此语法利用了 SQL 注释在 /* 和 */ 之间会被 MySQL 忽略的事实。如果 /*[VARIABLE]*/ 构造存在于查询中的某个位置，它将在执行时使用召回书签时提供的值进行扩展。


  ## 创建参数化书签


  假设我们想查找给定作者的所有书籍，但我们不知道作者的名字。我们首先输入以下查询：


  ```sql

  SELECT author.name, author.id, book.title

  FROM book, author

  WHERE book.author_id = author.id

  /* AND author.name LIKE ''%[VARIABLE]%'' */

  ```


  注释字符（/* */）之间的部分稍后将被扩展，并且标签将被删除。我们将此查询标记为名为 **按名称查找作者** 的书签并点击 **执行**。查询的第一次执行只是存储书签，同时检索所有作者的所有书籍，因为这次我们没有向查询传递参数。


  在此示例中，WHERE 子句中有两个条件，其中一个包含特殊语法。如果 WHERE 子句中唯一的条件需要参数，我们可以使用类似 WHERE 1 /* and author_id
  = [VARIABLE] */ 的语法。


  ## 向书签传递参数值


  为了测试书签，我们像往常一样召回它，并在 Variable 字段中输入一个值。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_249_0.png)


  当我们点击 Go 时，我们会看到扩展后的查询和作者 Smith 的书籍。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_249_1.png)


  ## 通过浏览 pma_bookmark 表执行书签


  此功能仅适用于可以直接看到 pma_bookmark 表的用户。这是安装链接表基础设施时给出的默认名称。在多用户安装中，此表通常位于无特权用户不可见的数据库中。浏览此表会显示一个新的
  Execute bookmarked query 按钮，该按钮会触发查询的执行：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_250_0.png)


  现在我们可以点击铅笔图标打开特定行的 Edit 页面以查看查询的完整文本。


  ## 摘要


  在本章中，我们概述了如何记录书签（在发送查询之后或之前）、如何操作它们以及如何使某些书签公开。本章还介绍了 Browse 模式的默认初始查询。它还涵盖了向书签传递参数以及直接从
  pma_bookmark 表执行书签。下一章将解释如何通过 phpMyAdmin 提供的工具生成解释数据库结构的文档。

  '
