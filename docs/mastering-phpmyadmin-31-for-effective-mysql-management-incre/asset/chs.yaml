  \ `name`, `phone`) VALUES(2, 'Maria Sunshine', '333-3333');\n-- --------------------------------------------------------\n\
  --\n-- Table structure for table `book`\n--\nCREATE TABLE IF NOT EXISTS `book` (\n\
  \  `isbn` varchar(25) NOT NULL,\n  `title` varchar(100) NOT NULL,\n  `page_count`\
  \ int(11) NOT NULL,\n  `author_id` int(11) NOT NULL,\n  `language` char(2) NOT NULL\
  \ default 'en',\n  `description` text NOT NULL,\n  `cover_photo` blob NOT NULL,\n\
  \  `genre` set('Fantasy','Child','Novel') NOT NULL default 'Fantasy',\n  `date_published`\
  \ datetime NOT NULL,\n  `stamp` timestamp NOT NULL default '0000-00-00 00:00:00'\
  \ on update CURRENT_TIMESTAMP,\n```\n```\n`some_bits` bit(3) NOT NULL,\nPRIMARY\
  \ KEY (`isbn`),\nKEY `by_title` (`title`(30)),\nKEY `author_language` (`author_id`,`language`),\n\
  KEY `isbn` (`isbn`),\nFULLTEXT KEY `description` (`description`)\n) ENGINE=MyISAM\
  \ DEFAULT CHARSET=latin1;\n\n--\n-- Dumping data for table `book`\n--\n\nINSERT\
  \ INTO `book` (`isbn`, `title`, `page_count`, `author_id`, `language`, `description`,\
  \ `cover_photo`, `genre`, `date_published`, `stamp`, `some_bits`) VALUES('1-234567-89-0',\
  \ 'A hundred years of cinema (volume 1)', 600, 1, 'en', '', '0x89504e470d0a1a0a000000d494844',\
  \ '', '0000-00-00 00:00:00', '2008-12-20 14:14:35', b'011');\nINSERT INTO `book`\
  \ (`isbn`, `title`, `page_count`, `author_id`, `language`, `description`, `cover_photo`,\
  \ `genre`, `date_published`, `stamp`, `some_bits`) VALUES('1-234567-22-0', 'Future\
  \ souvenirs', 200, 2, 'en', '', '', '', '0000-00-00 00:00:00', '0000-00-00 00:00:00',\
  \ '\\0');\nINSERT INTO `book` (`isbn`, `title`, `page_count`, `author_id`, `language`,\
  \ `description`, `cover_photo`, `genre`, `date_published`, `stamp`, `some_bits`)\
  \ VALUES('1-234567-90-0', 'A hundred years of cinema (volume 2)', 602, 1, 'en',\
  \ '', '', '', '0000-00-00 00:00:00', '0000-00-00 00:00:00', 'N0');\n```\n\n在此导出示例中，其中一本书（以\
  \ 0x8950 开头）的数据已被截断以简洁起见。实际上，它将包含该书 cover_photo 字段的完整十六进制表示。\n\n导出的第一部分包含注释（以字符\
  \ -- 开头），其中详细说明了创建该文件的工具（及版本）、日期和其他环境信息。随后我们可以看到每个表的 CREATE 和 INSERT 查询。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_143_0.png)\n\
  \n> phpMyAdmin 在导出文件中生成 ANSI 兼容的注释。这些注释以 -- 开头。它们有助于将文件导入到其他 ANSI SQL 兼容的系统上。在 2.6.0\
  \ 之前的版本中，使用了 MySQL 特定的字符 '#'。\n\n## SQL 选项\n\nSQL 选项用于精确定义导出将包含的信息。我们可能希望查看结构、数据或两者。选择\
  \ Structure 会生成包含 CREATE 查询的部分，而选择 Data 会生成 INSERT 查询：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_144_0.png)\n\
  \n通用的 SQL 选项是：\n\n- **在标题中添加自定义注释**：我们可以为此导出添加自己的注释（例如，**每月备份**），它将显示在导出标题中（在 PHP\
  \ 版本号之后）。如果注释有多行，我们必须使用特殊字符 \\n 来分隔每一行。\n- **注释**：在此处取消选中复选标记会导致导出中完全没有注释。\n- **将导出包含在事务中**：从\
  \ MySQL 4.0.11 开始，我们可以使用 START TRANSACTION 语句。此命令结合开头处的 SET AUTOCOMMIT=0 和结尾处的 COMMIT，要求\
  \ MySQL 在一次事务中执行导入（当我们重新导入此文件时），确保所有更改作为一个整体完成。\n- **禁用外键检查**：在导出文件中，我们可以添加 `DROP\
  \ TABLE` 语句。然而，通常如果表在外键约束中被引用，则无法删除该表。此选项通过在导出文件中添加 `SET FOREIGN_KEY_CHECKS=0` 来覆盖验证。\n\
  - **SQL 兼容模式**：这让我们可以选择导出的 SQL 方言。我们必须了解打算导入此文件的系统。选项包括 **MySQL 3.23**、**MySQL 4.0**、**Oracle**\
  \ 和 **ANSI**。\n\n**结构** 部分的选项是：\n\n- **添加 DROP TABLE / DROP VIEW**：在每个 `CREATE TABLE`\
  \ 语句之前添加 `DROP TABLE IF EXISTS` 语句，例如：`DROP TABLE IF EXISTS `author``。这样，我们可以确保导出文件在已存在相同表的数据库上执行，更新其结构但销毁之前的表内容。`DROP\
  \ VIEW` 用于视图。\n- **添加 IF NOT EXISTS**：向 `CREATE TABLE` 语句添加 `IF NOT EXISTS` 修饰符，避免在表已存在时导入时出错。\n\
  - **添加 AUTO_INCREMENT 值**：将表的自增信息放入导出中，确保表中插入的行将获得下一个确切的自增 ID 值。\n- **用反引号括起表名和字段名**：反引号是保护可能包含特殊字符的表名和字段名的常规方式。在大多数情况下，有它们是有用的。然而，如果目标服务器（导出文件将被导入到该服务器）运行的是早于\
  \ 3.23.6 的 MySQL 版本，则不建议使用反引号，因为该版本不支持反引号。\n- **添加 CREATE PROCEDURE / FUNCTION**：这会将此数据库中找到的所有存储过程和函数包含在导出中。\n\
  - **添加到注释中**：这会添加信息（以 SQL 注释的形式），这些信息无法直接导入，但仍然是有价值且可读的表信息。这里的信息量取决于关系系统设置（参见第 11\
  \ 章）。事实上，使用已激活的关系系统，我们将获得以下选择：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_145_0.png)\n\
  \n选择 **关系** 和 **MIME 类型** 将在结构导出中生成一个额外的部分。\n\n```\n-- COMMENTS FOR TABLE `book`:\n\
  --  `isbn`\n--   `book number`\n--  `page_count`\n--   `approximate`\n--  `author_id`\n\
  --   `see author table`\n--\n--\n-- MIME TYPES FOR TABLE `book`:\n--  `cover_photo`\n\
  --   `image/jpeg`\n--  `date_released`\n--   `text_plain`\n--  `description`\n--\
  \   `text_plain`\n--\n--\n-- RELATIONS FOR TABLE `book`:\n--  `author_id`\n--  \
  \ `author` -> `id`\n--\n```\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_146_0.png)\n\
  \n数据 部分可用的选项是：\n\n```\n```sql\nINSERT INTO `author` (`id`, `name`, `phone`)\nVALUES\
  \ (1, 'John Smith', '+01 445 789-1234');\nINSERT INTO `author` (`id`, `name`, `phone`)\n\
  VALUES (2, 'Maria Sunshine', '+01 455 444-5683');\n```\n```\n\n```\n```sql\nINSERT\
  \ INTO `author` VALUES (1, 'John Smith', '+01 445 789-1234'), (2, 'Maria Sunshine',\
  \ '+01 455 444-5683');\n```\n```\n\n- **完整插入**：为 author 表生成以下导出：\n\n请注意，每个语句中都包含每个列名。生成的文件更大，但在各种\
  \ SQL 系统上更具可移植性，并且文档性更好。\n- **扩展插入**：将整个表数据打包到单个 INSERT 语句中：\n\n这种插入数据的方法比使用多个 INSERT\
  \ 语句更快，但不太方便，因为它使 resultant 文件更难阅读。扩展插入还生成更小的文件，但该文件的每一行本身都不可执行，因为每一行都没有 INSERT\
  \ 语句。如果您无法一次性导入完整文件，则无法使用文本编辑器拆分文件并分块导入。\n- **创建查询的最大长度**：为扩展插入生成的单个 INSERT 语句可能变得太大并导致问题。因此，我们为该语句的长度设置字符数限制。\n\
  - **使用延迟插入**：向 INSERT 语句添加 DELAYED 修饰符。这会加速 INSERT 操作，因为它会被排队到服务器，服务器将在表未使用时执行它。请注意，这是一个\
  \ MySQL 非标准扩展，仅适用于 MyISAM、ISAM、MEMORY 和 ARCHIVE 表。\n- **使用忽略插入**：通常，在导入时，我们不能为唯一键插入重复值，因为这会中止插入操作。此选项向\
  \ INSERT 和 UPDATE 语句添加 IGNORE 修饰符，从而跳过生成重复键错误的 行。\n- **对 BLOB 使用十六进制**：此选项使 phpMyAdmin\
  \ 以 0x 格式编码 BLOB 字段的内容。这种格式很有用，因为根据将用于操作导出文件的软件（例如文本编辑器或邮件程序），处理包含 8 位数据的文件可能有问题。然而，使用此选项会产生\
  \ BLOB 导出，其大小可能是原来的两倍，甚至更大。\n\n\n\n\n- **导出类型：** 选项有 **INSERT**、**UPDATE** 和 **REPLACE**。其中最知名的是默认的\
  \ **INSERT** —— 使用 **INSERT** 语句将我们的数据导入回来。然而在导入时，我们可能处于表已存在且包含有价值数据的情况，而我们只想更新当前导出表中存在的字段。**UPDATE**\
  \ 生成类似 UPDATE `author` SET `id` = 1, `name` = `John Smith`, `phone` = `111-1111`\
  \ WHERE `id` = `1`; 的语句；当找到相同的 primary 或 unique 键时更新一行。第三种可能性 **REPLACE** 生成类似 REPLACE\
  \ INTO `author` VALUES (1, `John Smith`, `111-1111`); 的语句；这些语句对于新行像 INSERT 语句一样工作，并基于\
  \ primary 或 unique 键更新现有行。\n\n## “Save as file” 子面板\n\n在之前的示例中，导出操作的结果显示在屏幕上，当然，数据也没有进行压缩。我们可以通过勾选\
  \ Save as file 复选框来通过 HTTP 传输导出文件。这会在浏览器中触发一个保存对话框，最终将文件保存到我们的本地工作站。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_148_0.png)\n\
  \n## 文件名模板\n\n建议文件的名称将遵循文件名模板。在此模板中，我们可以使用特殊的 __SERVER__、__DB__ 和 __TABLE__ 占位符。这些占位符将被当前服务器、数据库或表名（对于单表导出）替换。请注意，单词前后各有两个下划线字符。我们还可以使用\
  \ PHP strftime 函数中的任何特殊字符；这对于根据当前日期或小时生成导出文件很有用。最后，我们可以放置任何其他字符字符串（不属于 strftime\
  \ 特殊字符），它将被原样使用。文件扩展名根据导出类型生成。在本例中，它将为 .sql。以下是模板的一些示例：\n\n- __DB__ 将生成 **marc_book.sql**\n\
  - __DB__-%Y%m%d 将给出 **marc_book-20071206.sql**\n\n**remember template** 选项在激活时，会将输入的模板设置存储到\
  \ cookie 中（用于数据库、表或服务器导出），并在下次使用同类导出时将其带回。\n\n默认模板可通过以下参数配置：\n\n```\n$cfg['Export']['file_template_table']\
  \ = '__TABLE__';\n$cfg['Export']['file_template_database'] = '__DB__';\n$cfg['Export']['file_template_server']\
  \ = '__SERVER__';\n```\n\n## 压缩\n\n为了节省传输时间并获得更小的导出文件，phpMyAdmin 可以压缩为 ZIP、GZIP\
  \ 或 BZIP2 格式。phpMyAdmin 原生支持 ZIP 格式。然而，GZIP 和 BZIP2 格式仅在 PHP 服务器分别使用 --with-zlib\
  \ 或 --with-bz2 配置选项编译时才有效。以下参数控制面板中呈现哪些压缩选项：\n\n```\n$cfg['ZipDump'] = TRUE;\n$cfg['GZipDump']\
  \ = TRUE;\n$cfg['BZipDump'] = TRUE;\n```\n\n安装 phpMyAdmin 为多位用户使用的系统管理员可以选择将所有这些参数设置为\
  \ FALSE，以避免大量用户同时压缩其导出时产生的潜在开销。这种情况通常造成的开销比所有用户同时传输未压缩文件的情况更大。\n\n在旧版本的 phpMyAdmin\
  \ 中，压缩文件是在 Web 服务器内存中构建的。这导致了一些问题：\n\n- 文件生成取决于分配给运行 PHP 脚本的内存限制。\n- 在文件生成和压缩期间，没有传输发生。因此，用户倾向于认为操作未在工作且出现崩溃。\n\
  - 无法实现大型数据库的压缩。\n\n$cfg['CompressOnFly'] 参数（默认设置为 TRUE）被添加以生成（对于 gzip 和 bzip2 格式）包含更多头的压缩文件。现在，传输几乎立即开始。文件以更小的块发送，因此整个过程消耗的内存要少得多。\n\
  \n## 字符集选择\n\n本节解释了一个鲜为人知的功能——选择导出文件的确切字符集的可能性。\n\n此功能通过将 $cfg['AllowAnywhereRecoding']\
  \ 设置为 TRUE 来激活。我们可以在此处看到它对界面的影响。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_150_0.png)\n\
  \n当此参数打开时，phpMyAdmin 会验证重新编码的条件是否满足。对于数据的实际编码，Web 服务器的 PHP 组件必须支持 iconv 或 recode\
  \ 模块。如果不是这种情况并且参数已设置为 TRUE，则会生成以下错误消息：\n\n**无法加载进行字符集转换所需的 iconv 或 recode 扩展。要么配置\
  \ PHP 以启用这些扩展，要么在 phpMyAdmin 中禁用字符集转换。**\n\n如果显示此消息，请查阅系统文档（PHP 或操作系统）以获取安装程序。\n\
  \n另一个参数（$cfg['RecodingEngine']）指定实际的重新编码引擎——选项为 auto、iconv 和 recode。如果设置为 auto，phpMyAdmin\
  \ 将首先尝试 iconv 模块，然后尝试 recode 模块。\n\n## 汉字支持\n\n如果 phpMyAdmin 检测到使用日语，它会检查 PHP 是否支持\
  \ mb_convert_encoding() 多字节字符串函数。如果支持，则在以下页面上会显示额外的单选按钮——export、import 和 query box，以便我们可以选择\
  \ EUC-JP 和 SJIS 日文编码。\n\n以下是来自导出页面的示例：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_151_0.png)\n\
  \n## CSV\n\n此格式被大量程序理解，您可能会发现它在交换数据时很有用。请注意，这是一个仅包含数据格式——这里没有 SQL 结构。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_151_1.png)\n\
  \n可用的选项有：\n\n- **字段以...终止：** 我们在此处放置一个逗号，这意味着每个字段后都会放置一个逗号。\n- **字段被...包围：** 我们在此处放置一个包围字符（例如引号），以确保包含终止字符（逗号）的字段不会被视为两个字段。\n\
  - **字段转义符：** 如果导出生成器在字段内找到 **字段被...包围** 字符，则 **字段转义符** 字符将被放置在其前面以保护它。例如，\"John\
  \ \\\"The Great\\\" Smith\"。\n- **行以...终止**：这决定了结束每一行的字符。我们应该根据将操作生成的导出文件的操作系统在此处使用适当的行分隔符。此选项的默认值来自\
  \ $cfg['Export']['csv_terminated'] 参数，其默认包含 `AUTO`。`AUTO` 值在浏览器操作系统为 Windows 时生成\
  \ \\r\\n 值，否则为 \\n。然而，如果导出文件 intended for a machine with a different OS，这可能不是最佳选择。\n\
  - **将 NULL 替换为**：这决定了导出文件中任何字段中发现的 NULL 值的占位字符串。\n- **在第一行放置字段名**：这获取有关每个字段含义的一些信息。一些程序将使用此信息来命名列。\n\
  \n最后，我们选择 **author** 表。\n\n结果是：\n\n```\n\"id\",\"name\",\"phone\"\n\"1\",\"John\
  \ Smith\",\"+01 445 789-1234\"\n\"2\",\"Maria Sunshine\",\"+01 455 444-5683\"\n\
  ```\n\n## 适用于 MS Excel 的 CSV\n\n此导出模式生成适用于 Microsoft Excel 的 CSV 文件。我们可以选择确切的 Microsoft\
  \ Excel 版本。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_152_0.png)\n\n## PDF\n\n\
  从版本 2.8.0 起，可以通过导出为 PDF 来创建表的 PDF 报告。此功能一次仅适用于一个表，并且我们必须勾选 **Save as file** 复选框以正常操作。我们可以为此报告添加标题，并且它也会自动分页。在\
  \ 2.8.0 到 2.8.2 版本中，此导出格式不支持非文本（BLOB）数据，如 book 表中所示。如果我们在该表中尝试它，将会产生错误结果。\n\n在这里，我们在\
  \ author 表上测试它。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_153_0.png)\n\nPDF 由于其固有的矢量特性而有趣——结果可以缩放。让我们看看从\
  \ Acrobat Reader 看到的生成的报告：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_153_1.png)\n\
  \n## Microsoft Excel 2000\n\n此导出格式直接生成适用于所有理解 Excel 2000 格式的软件的 .xls 文件。我们可以指定应替换\
  \ NULL 值的字符串。**在第一行放置字段名** 选项在激活时，会将表的列名作为电子表格的第一行生成。同样，**Save as file** 复选框应被勾选。这会生成一个文件，其中每个表的列成为电子表格列。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_153_2.png)\n\n\n\n## Microsoft Word 2000\n\
  \n此导出格式直接生成适用于所有理解 Word 2000 格式的软件的 .doc 文件。我们发现的选项与 Microsoft Excel 2000 导出中的选项相似，还有一些更多。我们可以独立导出表的结构和数据。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_154_0.png)\n\n请注意，对于此格式和 Excel 格式，我们可以为一次导出选择多个表。但是，如果其中一个表包含非文本数据，就会产生不愉快的结果。以下是\
  \ author 表的结果：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_154_1.png)\n\n## LaTeX\n\
  \nLaTeX 是一种排版语言。phpMyAdmin 可以生成一个 .tex 文件，以横向表格格式表示表的结构和/或数据。请注意，此文件无法直接查看，必须进一步处理或转换才能用于预期的最终媒体。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_155_0.png)\n\n可用的选项是：\n\n- **包含表格标题**：在表格输出中显示标题。\n\
  - **结构和数据**：熟悉的选择，用于请求结构、数据或两者。\n- **表格标题**：放在第一页的标题。\n- **续表标题**：放在每一页上的标题。\n-\
  \ **关系、注释、MIME 类型**：我们希望作为输出的其他结构信息。如果关系基础设施已就位，则可以使用这些选项（详见第 11 章）。\n\n## XML\n\
  \n这种格式在当今数据交换中非常流行。在 **导出** 界面中选择 **XML** 不会提供选项选择。下面是 **author** 表的输出。\n\n```\n\
  <?xml version=\"1.0\" encoding=\"utf-8\" ?>\n<!--\n-\n- phpMyAdmin XML Dump\n- version\
  \ 3.1.1\n- http://www.phpmyadmin.net\n-\n- Host: localhost\n- Generation Time: Dec\
  \ 21, 2007 at 01:13 PM\n- Server version: 5.0.67\n- PHP Version: 5.2.6\n-->\n\n\
  <!--\n- Database: `marc_book`\n-->\n<marc_book>\n    <!-- Table author -->\n   \
  \ <author>\n        <id>1</id>\n        <name>John Smith</name>\n        <phone>+01\
  \ 445-789-1234</phone>\n    </author>\n    <author>\n        <id>2</id>\n      \
  \  <name>Maria Sunshine</name>\n        <phone>333-3333</phone>\n    </author>\n\
  </marc_book>\n```\n\n## Native MS Excel (pre-Excel 2000)\n\nphpMyAdmin 提供了一个实验性模块，可直接导出为\
  \ **.xls** 格式——MS Excel 和 OpenOffice Calc 理解的原生电子表格格式。当此支持被激活时（稍后会详细介绍），我们会看到一个新的导出选项\
  \ **Native MS Excel**，以及与 Microsoft Excel 2000 相同的选项。\n\n我们可以选择将字段名称放在电子表格的第一行，使用\
  \ **将字段名称放在第一行**。\n\n此功能依赖于 PEAR 模块 **Spreadsheet_Excel_Writer**，其当前版本为 0.9.1，并生成\
  \ Excel 5.0 格式文件。该模块记录在 http://pear.php.net/package/Spreadsheet_Excel_Writer，但 phpMyAdmin\
  \ 环境下的完整安装记录如下：\n\n- 1. 确保 PHP 服务器具有 PEAR 支持。（如果没有 PEAR 支持，pear 命令将失败。）PEAR 本身记录在\
  \ http://pear.php.net。\n- 2. 如果我们以安全模式运行 PHP，必须确保允许包含 PEAR 模块。假设模块位于 /usr/local/share/pear\
  \ 下，我们应在 php.ini 中有 safe_mode_include_dir = /usr/local/share/pear 这一行。\n- 3. 然后我们使用\
  \ pear -d preferred_state=beta install -a Spreadsheet_Excel_Writer 安装该模块（因为该模块目前处于\
  \ beta 状态）。此命令通过互联网获取必要的模块并将其安装到我们的 PEAR 基础设施中。\n- 4. 我们需要在 phpMyAdmin 主目录下为 .xls\
  \ 生成准备一个临时目录。在 Linux 系统上，可以使用 mkdir tmp ; chmod o+rwx tmp 创建。\n- 5. 我们将 config.inc.php\
  \ 中的 $cfg['TempDir'] 参数设置为 './tmp'。\n\n我们现在应该能够看到新的 **Native MS Excel data** 导出选项。\n\
  \n## Open document spreadsheet\n\n此电子表格格式是开放文档（http://en.wikipedia.org/wiki/OpenDocument）的一个子集，该格式因\
  \ OpenOffice.org 办公套件而流行。我们需要只选择一个表进行导出，以便获得连贯的电子表格。以下是我们的 author 表，导出为名为 author.ods\
  \ 的文件，随后从 OpenOffice 查看：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_157_0.png)\n\
  \n## Open document text\n\n这是开放文档标准的另一个子集，这次面向文本处理。可用选项如以下屏幕截图所示：\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_158_0.png)\n\
  \n我们的 author 表现已导出并从 OpenOffice 查看。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_158_1.png)\n\
  \n## YAML\n\nYAML 的全称是 YAML Ain't Markup Language。YAML 是一种人类可读的数据序列化格式；其官方网站是 http://www.yaml.org。此格式在\
  \ phpMyAdmin 内部没有可供选择的选项。以下是 author 表的 YAML 导出：\n\n```\n1:\n  id: 1\n  name: John\
  \ Smith\n  phone: +01 445-789-1234\n\n2:\n  id: 2\n  name: Maria Sunshine\n  phone:\
  \ 333-3333\n```\n\n## CodeGen\n\n此选项将来可能支持与代码开发相关的许多格式。目前，它可以导出为 NHibernate 对象关系映射（ORM）格式。更多详情请参阅\
  \ http://en.wikipedia.org/wiki/Nhibernate。\n\n## Texy! text\n\nTexy! 是一种格式化工具（http://texy.info/en/），具有自己的简化语法。以下是此格式的导出示例：\n\
  \n```\n===Database marc_book\n\n== Table structure for table author\n|------|\n\
  |Field|Type|Null|Default|\n|------|\n|/**id**/|int(11)|Yes|NULL\n|name|varchar(30)|Yes|NULL\n\
  |phone|varchar(30)|Yes|NULL\n\n== Dumping data for table author\n|1|John Smith|+01\
  \ 445 789-1234\n|2|Maria Sunshine|333-3333\n```\n\n## Table exports\n\n表视图中的导出链接会打开特定表的导出子面板。它与数据库导出面板类似，但没有表选择器。然而，在“另存为文件”子面板之前，还有一个用于拆分导出的额外部分。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_160_0.png)\n\n## Split-file exports\n\
  \n“转储从记录 # 0 开始的 2 行”对话框使我们能够将文件拆分为块。根据确切的行大小，我们可以尝试不同的行数值，以确定在 Web 服务器达到内存或执行时间限制之前，单个导出文件可以容纳多少行。然后我们可以使用类似\
  \ book00.sql 和 book01.sql 的名称为导出文件命名。\n\n## Selective exports\n\n在 phpMyAdmin 界面的各个位置，我们可以导出所看到的结果，或选择要导出的行。\n\
  \n## Exporting partial query results\n\n当 phpMyAdmin 显示结果时（此处为查询 author_id 为 2 的书籍的结果），页面底部会出现一个导出链接。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_161_0.png)\n\n点击此链接会打开一个特殊的导出面板，顶部包含查询以及其他表导出选项。通过此面板生成的导出将仅包含此结果集的数据。\n\
  \n> 单表查询的结果可以用所有可用格式导出，而多表查询的结果只能以 CSV、XML 和 LaTeX 格式导出。\n\n## Exporting and checkboxes\n\
  \n无论何时我们看到结果（例如浏览或搜索时），都可以勾选想要的行旁边的复选框，并使用“已选择：导出”图标生成仅包含这些行的部分导出文件。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_162_0.png)\n\
  \n## Multi-database exports\n\n任何用户都可以在一次操作中导出其有权访问的数据库。\n\n在主页上，导出链接会将我们带到下一页所示的屏幕。它与其它导出页面的结构相同，只是数据库列表不同。\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_162_1.png)\n\n> 导出大型数据库可能成功也可能不成功。这取决于其大小、所选选项以及\
  \ Web 服务器的 PHP 组件设置（尤其是内存大小和执行时间）。\n\n\n\n## 在服务器上保存导出文件\n\n与其通过 HTTP 在网络上传输导出文件，可以直接将其保存到\
  \ Web 服务器的文件系统中。这可能更快，并且对执行时间限制不那么敏感，因为从服务器到客户端浏览器的整个传输过程被绕过。最终，可以使用 FTP 或 SFTP\
  \ 等文件传输协议来检索文件，因为将其留在同一台机器上并不能提供良好的备份保护。\n\n在服务器上保存导出文件之前，必须在 Web 服务器上创建一个特殊目录。通常，这是\
  \ phpMyAdmin 主目录的子目录。我们将使用 save_dir 作为示例。该目录必须具有特殊权限。首先，Web 服务器必须对该目录具有写入权限。此外，如果\
  \ Web 服务器的 PHP 组件以安全模式运行，则 phpMyAdmin 脚本的所有者必须与 save_dir 相同。\n\n在 Linux 系统上，假设 Web\
  \ 服务器以组 apache 运行，并且脚本由用户 \"marc\" 拥有，以下命令即可解决问题：\n\n```\n# mkdir save_dir\n# chown\
  \ marc.apache save_dir\n# chmod g=rwx save_dir\n```\n\n> 适当的拥有权和权限掩码高度取决于所选择的 Web\
  \ 服务器和所使用的 SAPI（服务器应用程序编程接口）（请参阅 http://en.wikipedia.org/wiki/Server_Application_Programming_Interface），它会影响目录和文件的创建和访问方式。PHP\
  \ 可能使用脚本的所有者作为访问用户，也可能是 Web 服务器本身的用户/组。\n\n我们还必须在 $cfg['SaveDir'] 中定义 './save_dir'\
  \ 目录名。这里我们使用相对于 phpMyAdmin 目录的路径，但绝对路径同样适用。\n\n“另存为文件”部分将出现一个新的“保存到服务器...”部分：\n\n\
  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_163_0.png)\n\n单击 Go 后，我们将收到确认消息或错误消息（如果\
  \ Web 服务器没有保存文件的必要权限）。\n\n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_164_0.png)\n\n\
  > 再次保存文件并使用相同的文件名时，请选中 **覆盖现有文件(s)** 复选框。\n\n## 用户特定的保存目录\n\n我们可以在 $cfg['SaveDir']\
  \ 参数中使用特殊字符串 %u。该字符串将被已登录的用户名替换。例如，使用\n\n```\n$cfg['SaveDir'] = './save_dir/%u';\n\
  ```\n\n这将给我们一个屏幕上的选择，**保存到服务器上的 /save_dir/marc/ 目录**。这些目录（每个潜在用户一个）必须存在并且必须具有适当的权限，如上一节所述。\n\
  \n## 内存限制\n\n生成导出文件会使用一定量的内存，这取决于表的大小和所选的选项。$cfg['MemoryLimit'] 参数可以包含正在运行的 PHP\
  \ 脚本使用的内存量的限制（以字节为单位）。默认情况下，该参数设置为 0，表示没有限制。请注意，如果 PHP 已激活安全模式，更改 $cfg['MemoryLimit']\
  \ 没有任何效果。相反，强制执行的限制来自 php.ini 中的 memory_limit 指令。\n\n## 摘要\n\n在本章中，我们检查了触发导出的各种方式——从数据库视图、表视图或结果页面。我们还列出了各种可用的导出格式、其选项、压缩导出文件的可能性以及它可能被发送到的各种位置。\n\
  \n在下一章中，只要所选格式受 phpMyAdmin 支持，我们就有机会将我们的结构和数据导入回来。\n"
- '# 8 导入结构和数据


  在本章中，我们将学习如何将为备份或传输目的而创建的导出数据带回。导出数据也可能来自其他应用程序的作者，并且可能包含这些应用程序的整个基础结构和一些示例数据。


  当前的 phpMyAdmin 版本（3.1）可以直接导入包含 MySQL 语句的文件（通常具有 .sql 后缀，但不一定如此）和 CSV 文件（逗号分隔值，尽管分隔符不一定是逗号）。未来的版本可能能够导入更多格式的文件。还有一个
  MySQL LOAD DATA INFILE 语句的接口，使我们能够加载包含数据（也称为 CSV）的文本文件。第 6 章中介绍的二进制字段上传可以说属于导入家族。


  > 在此上下文中，导入和上传是同义词。


  可以从多个面板访问导入功能：


  - 可从主页、数据库视图或表视图访问的 **导入** 菜单

  - 在 **查询窗口** 内提供的 **导入文件** 菜单（如第 12 章所述）


  在 2.11.0 版本中添加了一个功能：导入文件可能包含 DELIMITER 关键字。这使 phpMyAdmin 能够模仿 mysql 命令行解释器。DELIMITER
  分隔符用于界定包含存储过程的文件部分，因为这些过程本身可能包含分号。


  导入界面的默认值在 $cfg[''Import''] 中定义。


  在检查实际导入对话框之前，让我们讨论一些限制问题。


  ## 传输限制


  当我们导入时，源文件通常位于我们的客户端机器上；因此，它必须通过 HTTP 传输到服务器。此传输需要时间并使用可能在 Web 服务器的 PHP 配置中受限的资源。


  而不是使用 HTTP，我们可以使用 FTP 等协议将文件上传到服务器，如“Web 服务器上传目录”部分所述。此方法绕过了 Web 服务器的 PHP 上传限制。


  ## 时间限制


  首先，让我们考虑时间限制。在 config.inc.php 中，$cfg[''ExecTimeLimit''] 配置指令默认将任何 phpMyAdmin 脚本（包括文件上传后处理数据的脚本）的最大执行时间分配为
  300 秒（五分钟）。值为 0 可移除限制，理论上可让我们无限时间完成导入操作。如果 PHP 服务器以安全模式运行，修改 $cfg[''ExecTimeLimit'']
  将没有任何效果。这是因为在 php.ini 或用户相关的 Web 服务器配置文件（如 .htaccess 或虚拟主机配置文件）中设置限制优先于此参数。


  当然，实际花费的时间取决于两个关键因素：


  - Web 服务器负载

  - MySQL 服务器负载


  > 文件在客户端和服务器之间传输所花费的时间不计入执行时间，因为 PHP 脚本仅在文件已接收到服务器后才开始执行。因此，$cfg[''ExecTimeLimit'']
  参数仅对处理数据（如解压缩或发送到 MySQL 服务器）所使用的时间产生影响。


  ## 其他限制


  系统管理员可以使用 php.ini 文件或 Web 服务器的虚拟主机配置文件来控制服务器上的上传。


  upload_max_filesize 参数指定可通过 HTTP 上传的上限或最大文件大小。这很明显，但另一个不太明显的参数是 post_max_size。由于
  HTTP 上传是通过 POST 方法完成的，因此此参数可能会限制我们的传输。有关 POST 方法的更多详细信息，请参阅 http://en.wikipedia.org/wiki/Http#Request_methods。


  memory_limit 参数用于防止 Web 服务器子进程占用过多的服务器内存——phpMyAdmin 也作为子进程运行。因此，正常文件上传的处理，特别是压缩转储，可能会因给此参数一个较小的值而受到影响。这里无法推荐首选值；该值取决于上传数据的大小。内存限制也可以通过
  config.inc.php 中的 $cfg[''MemoryLimit''] 参数进行调整，如第 7 章所述。


  最后，必须通过将 file_uploads 设置为 on 来允许文件上传。否则，phpMyAdmin 甚至不会显示“文本文件位置”对话框。显示此对话框毫无用处，因为稍后会被
  Web 服务器的 PHP 组件拒绝连接。


  ## 部分导入


  如果文件太大，有几种方法可以解决这种情况。如果我们仍有权访问原始数据，我们可以使用 phpMyAdmin 生成较小的 CSV 导出文件，选择“转储 n 行，从记录
  # n 开始”对话框。如果不可能，我们将不得不使用文本编辑器将文件拆分为较小的部分。另一种可能性是使用上传目录机制，该机制访问 $cfg[''UploadDir'']
  中定义的目录。本章后面将解释此功能


  在最近的 phpMyAdmin 版本中，部分导入功能也可以解决此文件大小问题。通过选择“允许中断...”复选框，如果导入过程检测到接近时间限制，它将自行中断。我们还可以指定要从开头跳过的查询数量，以防我们成功导入若干行并希望从该点继续。


  ## 临时目录


  在某些服务器上，可以设置一个名为 open_basedir 的安全功能，其方式会阻碍上传机制。在这种情况下，或出于任何其他原因，当上传有问题时，可以将 $cfg[''TempDir'']
  参数设置为临时目录的值。这很可能是一个 phpMyAdmin 主目录的子目录，Web 服务器允许将上传的文件放在其中。




  ## 导入 SQL 文件


  任何包含 MySQL 语句的文件都可以通过此机制导入。该对话框可在数据库视图或表视图中通过导入子页面，或在查询窗口中使用。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_168_0.png)


  > 当前选择的表（此处为 author）与将要导入的 SQL 文件的实际内容之间没有关系。SQL 文件的所有内容都将被导入，并且是这些内容决定了哪些表或数据库受到影响。但是，如果导入的文件不包含选择数据库的
  SQL 语句，则导入文件中的所有语句都将在当前选择的数据库上执行。


  让我们尝试一个导入练习。首先，我们确保拥有 book 表的当前 SQL 导出文件（如第 7 章所述）。该导出文件必须包含结构和数据。然后我们删除 book 表——是的，真的！我们也可以简单地重命名它。（有关操作步骤，请参见第
  10 章。）


  现在是时候将文件导入回来了。我们应该在导入子页面上，在那里可以看到文本文件位置对话框。我们只需点击浏览按钮并选择文件即可。


  phpMyAdmin 能够检测文件是否应用了压缩方法（如果有的话）。根据 phpMyAdmin 版本以及 Web 服务器 PHP 组件中可用的扩展，程序能够解压缩的格式会有所不同。


  然而，要成功导入，phpMyAdmin 必须获知要导入文件的字符集。默认值是 **utf8**。但是，如果我们知道导入文件是用另一种字符集创建的，则应在此处指定。


  导入时提供 **SQL 兼容模式** 选择器。此模式应根据数据先前导出的服务器类型进行调整，以匹配即将导入的实际数据。


  要开始导入，我们点击 **Go**。导入过程继续，我们收到消息：**导入已成功完成，已执行 2 条查询**。我们可以浏览新创建的表以确认导入操作成功。


  该文件可以导入到不同的数据库中进行测试，甚至导入到 MySQL 服务器中。


  ## 导入 CSV 文件


  在本节中，我们将研究如何导入 CSV 文件。有两种可能的方法——**CSV** 和 **CSV using LOAD DATA**。第一种方法由 phpMyAdmin
  内部实现，因其简单性而被推荐。使用第二种方法，phpMyAdmin 接收要加载的文件并将其传递给 MySQL。理论上，此方法应该更快。然而，由于 MySQL 本身的原因，它有更多要求（请参阅
  *CSV using LOAD DATA* 部分的 *Requirements* 小节）。


  ## SQL 与 CSV 格式的差异


  这两种格式之间存在一些差异。CSV 文件格式仅包含数据，因此我们必须已经有一个现有的表。该表不需要与原始表（数据来源）具有相同的结构；**列名** 对话框使我们能够选择目标表中受影响的列。


  由于表必须在导入前存在，CSV 导入对话框仅可在表视图中的 **导入** 子页面中使用，而不在数据库视图中使用。


  ## 导出测试文件


  在尝试导入之前，让我们从 author 表生成一个 author.csv 导出文件。我们使用 CSV 导出选项中的默认值。然后我们可以清空 author 表——我们应避免删除此表，因为我们仍然需要表结构。


  ## CSV


  从 author 表菜单中，我们选择导入然后选择 CSV。


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_170_0.png)


  我们可以通过多种方式影响导入行为。默认情况下，导入不会修改现有数据（基于主键或唯一键）。然而，Replace table data with file 选项指示
  phpMyAdmin 使用 REPLACE 语句而不是 INSERT 语句，以便用导入的数据替换现有行。


  使用 Ignore duplicate rows，会生成 INSERT IGNORE 语句。这些语句会导致 MySQL 在插入期间忽略任何重复键问题。导入文件中的重复键不会替换现有数据，并且处理继续进行到
  CSV 数据的下一行。


  然后我们可以指定终止每个字段的字符、包围数据的字符以及转义包围字符的字符。通常这是 \。例如，对于双引号包围字符，如果数据字段包含双引号，则必须表示为 "some
  data \" some other data"。


  对于 Lines terminated by，phpMyAdmin 的最新版本提供 auto 选项，应首先尝试，因为它会自动检测行结束字符。我们也可以手动指定终止行的字符。通常的选择是
  UNIX 系统的 \n，DOS 或 Windows 系统的 \r\n，以及 Mac 系统的 \r（最高到 Mac OS 9）。如果不确定，我们可以使用客户端计算机上的十六进制文件编辑器（不属于
  phpMyAdmin 的一部分）来检查确切的代码。


  默认情况下，phpMyAdmin 预期 CSV 文件具有与目标表相同数量的字段和相同的字段顺序。但这可以通过在 Column names 中输入以逗号分隔的列名列表来更改，遵守源文件格式。例如，假设我们的源文件仅包含作者
  ID 和作者姓名信息：


  ```

  "1","John Smith"

  "2","Maria Sunshine"

  ```


  我们必须在 Column names 中输入 id, name 以匹配源文件。


  当我们点击 Go 时，导入被执行并且我们得到确认。如果文件的总大小不大，我们也可能会看到生成的实际 INSERT 查询。


  ```

  Import has been successfully finished, 2 queries executed.

  INSERT INTO `author` VALUES (''1'', ''John Smith'', ''+01 445 789-1234'')

  # 1 row(s) affected.


  INSERT INTO `author` VALUES (''2'', ''Maria Sunshine'', ''333-3333'')

  # 1 row(s) affected.

  ```


  ## CSV using LOAD DATA


  使用此方法，phpMyAdmin 依赖于服务器的 LOAD DATA INFILE 或 LOAD DATA LOCAL INFILE 机制来执行实际导入，而不是在内部处理数据。这些语句是
  MySQL 中导入文本的最快方式。它们会导致 MySQL 从位于 MySQL 服务器上的文件（LOAD DATA INFILE）或从其他位置（LOAD DATA
  LOCAL INFILE）开始读取操作，在此上下文中，始终是 Web 服务器的文件系统。如果 MySQL 服务器位于与 Web 服务器不同的计算机上，我们将无法使用
  LOAD DATA INFILE 机制。


  ## 要求


  依赖 MySQL 服务器会带来一些后果。使用 LOAD DATA INFILE 要求登录用户拥有全局 FILE 权限。此外，文件本身必须可由 MySQL 服务器进程读取。


  > 第 18 章解释了 phpMyAdmin 的界面，供系统管理员管理权限。


  LOAD DATA LOCAL INFILE 中 LOCAL 修饰符的使用必须由 MySQL 服务器和 PHP 使用的 MySQL 客户端库允许。


  两种 LOAD 方法都可从 phpMyAdmin LOAD 接口获得，该接口尝试选择最佳的默认选项。


  ## 使用 LOAD DATA 接口


  我们从 author 表菜单中选择导入。选择 CSV using LOAD DATA 会弹出以下对话框：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_172_0.png)


  > 可用选项已在 CSV 部分中介绍过。


  在熟悉的文本文件位置问题中，我们选择我们的 author.csv 文件。最后，我们可以通过选择 Use LOCAL keyword 选项来选择 LOAD 方法，如前所述。然后我们点击
  Go。


  如果一切顺利，我们可以看到如下确认屏幕：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_172_1.png)


  此屏幕显示使用的确切 **LOAD DATA LOCAL INFILE** 语句。以下是发生的情况：


  - 我们选择了 **author.csv**。

  - 该文件的内容通过 HTTP 传输并被 Web 服务器接收。

  - Web 服务器内部的 PHP 组件将此文件保存在工作目录中（此处为 **/opt/php-upload-tmp/**）并为其分配临时名称。

  - phpMyAdmin 获知此工作文件的位置后，构建了 **LOAD DATA LOCAL INFILE** 命令并将其发送到 MySQL。请注意，只执行了一个查询，该查询加载了多行。

  - MySQL 服务器读取并将文件内容加载到我们的目标表中。然后它返回受影响的行数（2），phpMyAdmin 在结果页面中显示了该数字。


  ## Web 服务器上传目录


  为了避免 Web 服务器 PHP 配置完全禁用上传或上传限制过小的情况，phpMyAdmin 可以从 Web 服务器文件系统上的特殊目录读取上传文件。此机制适用于
  SQL 和 CSV 导入。


  我们首先在 $cfg[''UploadDir''] 参数中指定我们选择的目录名，例如 ''./upload''。我们还可以使用第 7 章所述的 %u 字符串来表示用户名。


  现在，让我们返回到导入子页面。我们收到错误消息：


  **您设置的上传工作目录无法访问。**


  此错误消息是预期的，因为目录不存在。它应该已在当前 phpMyAdmin 安装目录内创建。该消息也可能表示目录存在，但 Web 服务器无法读取它。（在 PHP
  安全模式下，目录的所有者和 phpMyAdmin 安装脚本的所有者必须相同。）


  使用 SFTP 或 FTP 客户端，我们创建必要的目录，现在可以在那里上传文件（例如 book.sql），从而绕过任何 PHP 超时或上传最大限制。请注意，文件本身必须具有允许
  Web 服务器读取它的权限。在大多数情况下，最简单的方法是允许所有人读取文件。




  刷新“导入”子页面会显示以下内容：


  ![](img/cb8c75b631b4e1f7afe5a0d39becfda9_174_0.png)


  点击“Go”应执行该文件。


  上传目录中的文件也支持自动解压。文件名应具有 .bz2、.gz、.sql.bz2 或 .sql.gz 等扩展名。


  > 使用双扩展名（.sql.bz2）是更好的方式来表示 .sql 文件已生成后被压缩，因为我们可以看到生成该文件所使用的所有步骤。


  ## 摘要


  本章涵盖：


  - phpMyAdmin 中允许我们导入数据的各种选项

  - 导入 SQL 和 CSV 文件所涉及的不同机制

  - 在尝试传输时可能遇到的限制以及绕过这些限制的方法


  第 9 章将解释如何进行单表搜索（涵盖搜索条件指定）以及如何在整个数据库中搜索。

