  通常，升级只是将新版本安装到单独的目录并将上一个版本的 config.inc.php 复制到新目录的问题。如果上一个版本是 phpMyAdmin 2.6.0 或更旧，则无法将其
  config.inc.php 复制到新版本，因为文件格式已更改太多。


