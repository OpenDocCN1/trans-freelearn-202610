  \ = 'http://www.mysql.com/doc/en';\n$cfg['MySQLManualType'] = 'searchable';\n```\n\
  \n当我们希望引起您对代码块中某一特定部分的注意时，相关行或项目将以粗体显示：\n\n```\n$cfg['Servers'][$i]['AllowDeny']['order']\
