  \n这些与 With selected X 形图标一起使用。确认屏幕会出现，列出即将被删除的所有行。也可以点击行数据的任何位置来激活相应的复选框。\n\n##\
  \ 删除表中的所有行\n\n要完全擦除表中的所有行（保持其结构不变），我们进入 Database view 并点击左侧面板中的数据库名称。然后我们点击位于要清空的表同一行上的垃圾桶图标：\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_119_1.png)\n\n我们会收到一条确认 TRUNCATE 语句的消息（用于快速清空表的\
  \ MySQL 语句）。对于我们的练习，我们不会删除这些珍贵的数据！\n\n清空表也可以在 Table view 中通过顶部菜单上的 Empty 链接完成：\n\
  \n![](img/cb8c75b631b4e1f7afe5a0d39becfda9_119_2.png)\n\n> 删除数据，无论是逐行删除还是清空表，都是一项永久性操作。除非使用备份，否则无法恢复。\n\
