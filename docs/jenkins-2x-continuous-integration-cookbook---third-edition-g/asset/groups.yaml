    7. 同一页面上另一个重要的配置是“Jenkins 位置”。您可以指定 Jenkins 安装的 HTTP 地址，因为 Jenkins 无法可靠地从自身检测到这样的
    Jenkins URL：


    # Jenkins 位置


    Jenkins URL http://10.0.0.5:8080/


    系统管理员电子邮件地址 尚未配置 <nobody@nowhere>


    '
