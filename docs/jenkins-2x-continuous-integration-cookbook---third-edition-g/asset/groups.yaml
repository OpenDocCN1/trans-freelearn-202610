    <groupId>org.jenkins-ci.main</groupId>

    <artifactId>jenkins-war</artifactId>

    <version>1.437</version>

    <type>war</type>

    <scope>runtime</scope>

    </dependency>

    </dependencies>

    <repositories>

    <repository>

    <id>Jenkins</id>

    <url>http://repo.jenkins-ci.org/releases</url>

    </repository>

    </repositories>

    </project>

    ```


    ```

    <Context logEffectiveWebXml="true" path="/"></Context>

    ```


    ```

    mvn package

    ```


    ## How it works...


    Jenkins has its WAR files exposed through a central Maven repository. This allows
    you to pull in specific versions of Jenkins through standard Maven dependency
    management.


    Maven uses conventions. It expects to find the content to overlay at `src/main/webapp`
    or `src/main/resources`.


    The `context.xml` file defines certain behaviors for a web application such as
    database settings. In this example, the `logEffectiveWebXML` setting is asking
    Tomcat to log specific information on startup of the application (http://tomcat.apache.org/tomcat-7.0-doc/config/context.html).
    The setting was recommended in the Jenkins Wiki (https://wiki.jenkins-ci.org/display/JENKINS/Installation+via+Maven+WAR+Overlay).
    The file is placed in the `META-INF` directory as Tomcat picks up the settings
    here without the need for a server restart.


    The `<packaging>war</packaging>` tag tells Maven to use the WAR plugin for packaging.


    You used the same version number in the name of the final overlayed WAR as the
    original Jenkins WAR version. It makes it easier to spot if the Jenkins version
    changes. This again highlights that using conventions aids readability and decreases
    the opportunity for mistakes. When deploying from your acceptance environment
    to production, you should remove the version number.


    In the `pom.xml` file, you defined http://repo.jenkins-ci.org/ as the repository
    in which to find Jenkins.


    The Jenkins WAR file is pulled in as a dependency of type `war` and scope `runtime`.
    The runtime scope indicates that the dependency is not required for compilation,
    but is for execution. For more detailed information on scoping, review http://maven.apache.org/guides/introduction/introduction-to-dependency-mechanism.html#Dependency_Scope.


    For further details about WAR overlays, review http://maven.apache.org/plugins/maven-war-plugin/index.html.


    Avoiding work:


    To limit maintenance effort, it is better to install extra content rather than
    replacing content that might be used elsewhere or by third-party plugins.


    ## There''s more...


    There are a lot of details that you need to cover if you wish to fully modify
    the look and feel of Jenkins. The following sections mention some of the details.


    ## Which types of content can you replace?


    The Jenkins server deploys to two main locations. The first location is the core
    application and the second is the workspace, which stores information that changes.
    To gain a fuller understanding of the content, review the directory structure.
    A useful command in Linux is the tree command, which displays the directory structure.
    To install under Ubuntu, use the following command:


    ```

    apt-get install tree

    ```


    In Windows OS it''s available by default in the Command Prompt.


    For the Jenkins Ubuntu workspace, using the following command helps you to generate
    a tree view of the workspace:


    ```

    tree -d -L 1 /var/lib/jenkins

    ```


    - `fingerprints`: This is the directory that is used to store checksums to uniquely
    identify files

    - `jobs`: This stores job configuration and build results

    - `plugins`: This is where plugins are deployed and usually configured

    - `tools`: This is where tools such as Maven and Ant are deployed

    - `updates`: This is used for updates

    - `userContent`: The content is made available under the URL `/userContent`

    - `users`: This is the user information displayed under the `/me` URL


    The default Ubuntu location of the web app is `/var/run/jenkins/war`. If you are
    running Jenkins from the command line, then the option for placing the web app
    is as follows:


    ```

    -webroot

    ```


    - `css`: This is the location of Jenkins style sheets

    - `executable`: This is used for running Jenkins from the command line

    - `favicon.ico`: This is the icon we replaced in this recipe

    - `help`: This is the directory with help content

    - `images`: This includes the graphics in different sizes

    - `META-INF`: This is the location for the manifest file and the the pom.xml file
    that generated the WAR

    - `robots.txt`: This is used to tell search engines where they are allowed to
    crawl

    - `scripts`: This is the location of the JavaScript library

    - `WEB-INF`: This is the main location for the servlet part of the web application

    - `winstone.jar`: This is the servlet container available at http://winstone.sourceforge.net/


    ## Search engines and robots.txt


    If you are adding your own custom content, such as user home pages, company contact
    information, or product details, then consider modifying the top-level `robots.txt`
    file. At present, it excludes search engines from all content:


    ```

    # we don''t want robots to click "build" links

    User-agent: *

    Disallow: /

    ```


    You can find the full details of the structure of the `robots.txt` at http://www.w3.org/TR/html4/appendix/notes.html#h-B.4.1.1.


    Google uses richer structures that allow as well as disallow; refer to https://developers.google.com/webmasters/control-crawl-index/docs/robots_txt?csw=1.


    The following `robots.txt` allows access by the Google crawler to the directory
    `/userContent/corporate/`. It is an open question whether all web crawlers will
    honor the intent.


    ```

    User-agent: *

    Disallow: /

    User-agent: Googlebot

    Allow: /userContent/corporate/

    ```


    To help secure your Jenkins infrastructure, refer to the recipes in Chapter 3,
    Managing Security.


    ## Generating a home page


    The user''s home page is a great place to express your organization''s identity.
    You can create a consistent look and feel that expresses your team''s spirit.


    This recipe will explore the manipulation of home pages found under the `/user/userid`
    directory and configured by the user through the Jenkins/me URL.


    A similar plugin worth reviewing is the Gravatar plugin. You can find the plugin''s
    home page at https://wiki.jenkins-ci.org/display/JENKINS/Gravatar+plugin.

    '
