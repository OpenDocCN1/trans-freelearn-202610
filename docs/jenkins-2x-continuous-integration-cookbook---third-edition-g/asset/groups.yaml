    # # Generating a home page


    The user''s home page is a great place to express your organization''s identity.
    You can create a consistent look and feel that expresses your team''s spirit.


    This recipe will explore the manipulation of home pages found under the `/user/userid`
    directory and configured by the user through the Jenkins/me URL.


    A similar plugin worth reviewing is the Gravatar plugin. You can find the plugin''s
    home page at [https://wiki.jenkins-ci.org/display/JENKINS/Gravatar+plugin](https://wiki.jenkins-ci.org/display/JENKINS/Gravatar+plugin).'
