    \ Yes：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_51_0.png)\n\n27. 打开浏览器并导航到\
    \ URL，http://localhost:8080。\n28. 它会要求输入管理员密码：\n\n"
