    Once a plugin is uploaded successfully, we can utilize extensibility provided
    by the plugin that is uploaded into Jenkins.


    ## Configuring proxy in Jenkins


    Jenkins is often installed in organizations behind the proxy server. In such scenarios,
    it is important to configure a proxy in the Jenkins dashboard so plugin updates
    can be installed successfully.


    ## Getting ready


    Get all the details related to the server name, port number, and credentials that
    are allowed to access the proxy server.


    ## How to do it...


    +   1. Go to the Jenkins dashboard.

    +   2. Click on Manage Jenkins.

    +   3. Click on Manage plugins.

    +   4. Go to the Advanced tab.

    +   5. Provide Server, Port, User name, Password, and No Proxy Host:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_77_0.png)


    +   6. Click on Submit.


