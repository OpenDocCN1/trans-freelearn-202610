  - '[PAGE 573]


    # Saving screen space with the Dashboard View plugin


    In the *Efficient use of views* recipe, you discovered that you can save horizontal
    tab space using the `views` plugin. In this recipe, you will use the `Dashboard
    View` plugin to condense the use of the horizontal space. Condensing the horizontal
    space aids in assimilating information efficiently.


    The `Dashboard View` plugin allows you to configure areas of a view to display
    specific functionality, for example, a grid view of the jobs or an area of the
    view that shows the subset of jobs failing. The user can drag and drop the areas
    around the screen.


    The developers have made the dashboard easily extensible, so expect more choices
    later.'
