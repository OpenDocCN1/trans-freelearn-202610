    # There''s more...


    The sound plugin also allows you to stream arbitrary sounds to connected web browsers.
    Not only is this useful for practical jokes and motivational speeches directed
    at your distributed team, you can also perform useful actions such as a 10-minute
    warning alert before restarting a server.


    You can find some decent sound collections at http://www.archive.org/details/opensource_audio.


    For example, you can find a copy of the One Laptop per Child music library at
    http://www.archive.org/details/OpenPathMusic44V2. Within the collection, you will
    discover `shenai.wav`. First, add the sound somewhere on the internet where it
    can be found. A good place is the Jenkins `userContent` directory. To play the
    sound on any connected web browser, you will need to visit the trigger address
    (replacing `localhost:8080` with your own address):


    ```

    http://localhost:8080/sounds/playSound?src=http://localhost:8080/userContent/shenai.wav

    ```'
  md: "\n# See also\n\n- The *Saving screen space with the Dashboard View plugin*\
    \ recipe\n\n# Saving screen space with the Dashboard View plugin\n\nIn the *Efficient\
    \ use of views* recipe, you discovered that you can save horizontal tab space\
    \ using the `views` plugin. In this recipe, you will use the `Dashboard View`\
    \ plugin to condense the use of the horizontal space. Condensing the horizontal\
    \ space aids in assimilating information efficiently.\n\nThe `Dashboard View`\
    \ plugin allows you to configure areas of a view to display specific functionality,\
    \ for example, a grid view of the jobs or an area of the view that shows the subset\
    \ of jobs failing. The user can drag and drop the areas around the screen.\n\n\
    The developers have made the dashboard easily extensible, so expect more choices\
    \ later.\n\n## How to do it...\n\n1. The Dashboard View plugin divides up the\
    \ screen into areas. During dashboard configuration, you choose the jobs grid\
    \ and the unstable job portlets. Other dashboard portlets include a jobs list,\
    \ latest builds, slave statistics, test statistics chart or grid, and the test\
    \ trend chart. There will be more choices as the plugin matures.\n2. As a Jenkins\
    \ administrator, log in to the home page of your Jenkins instance.\n3. Create\
    \ a new view by clicking on the plus sign in the second tab at the top of the\
    \ screen.\n4. Choose the Dashboard view.\n5. Click on OK:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_575_0.png)\n\
    \n6. Select Jobs in Job Filters:\n7. Select the Dashboard Portlets:\n\n### Dashboard\
    \ Portlets\n\n- ☑ Show standard Jenkins list at the top of the page\n- ☐ Full\
    \ screen view - hide standard Jenkins panels\n- ☐ Set CSS custom parameters\n\n\
    8. Add or remove columns to keep in Dashboard view:\n\n### Columns\n\nStatus\n\
    \nDelete\n\nName\n\nDelete\n\nBuild Button\n\nDelete\n\nLast Success\n\nDelete\n\
    \nAdd column\n\n### Dashboard Portlets\n\n- Show standard Jenkins list at the\
    \ top of the page\n- Full screen view - hide standard Jenkins panels\n- Set CSS\
    \ custom parameters\n\n9. Click on Save and verify the New Dashboard view:\n\n\
    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_579_0.png)\n\n10. You can add Dashboard\
    \ Portlets in different sections of the page:\n\n### Dashboard Portlets\n\n- ☑\
    \ Show standard Jenkins list at the top of the page\n- ☐ Full screen view - hide\
    \ standard Jenkins panels\n- ☐ Set CSS custom parameters\n\n### Portlets at the\
    \ top of the page\n\nAdd Dashboard Portlet to the top of the view\n\n- Android\
    \ Lint issues per project\n- Android Lint issues trend graph (new vs. fixed)\n\
    - Android Lint issues trend graph (priority distribution)\n- Build Pipeline Dashboard\
    \ View\n- Build statistics\n- Iframe Portlet\n- Image\n- Jenkins jobs list\n-\
    \ Job statistics\n- Jobs Grid\n- Latest builds\n- Slaves statistics\n- Test Statistics\
    \ Chart\n\n11. Select the Build statistics portlet and Save:\n\n### Dashboard\
    \ Portlets\n\n- ☑ Show standard Jenkins list at the top of the page\n- ☐ Full\
    \ screen view - hide standard Jenkins panels\n- ☐ Set CSS custom parameters\n\n\
    ### Portlets at the top of the page\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_580_0.png)\n\
    \n12. Verify the new portlet after saving the configuration in the Jenkins dashboard:\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_581_0.png)\n\nThe Job grid portlet\
    \ saves space compared to other views, as the density of jobs displayed is high.\n\
    \nIf you are also using the Many Views tab (see the preceding recipe) there is\
    \ a little glitch. When you click on the dashboard tag, the original set of views\
    \ is displayed rather than the select box.\n\n# There's more...\n\nThe Dashboard\
    \ plugin provides a framework for other plugin developers to create dashboard\
    \ views. One example of this type of usage is the `Project Statistics` plugin\
    \ (https://wiki.jenkins-ci.org/display/JENKINS/Project+Statistics+Plugin).\n\n\
    # See also\n\n- The *Creating HTML reports* recipe\n- The *Efficient use of views*\
    \ recipe\n\n# Making noise with HTML5 browsers\n\nThis recipe describes how to\
    \ send a custom sound to a Jenkins user's browser when an event occurs, such as\
    \ a successful build. You can also send sound messages at arbitrary times. Not\
    \ only is this good for developers who enjoy being shouted at, sang at by famous\
    \ actors, and so on, but also for system administrators who are looking for a\
    \ computer in a large server farm.\n\n## Getting ready\n\nInstall the Jenkins\
    \ sounds plugin (https://wiki.jenkins-ci.org/display/JENKINS/Jenkins+Sounds+plugin).\
    \ Make sure that you have a compliant web browser installed, such as a current\
    \ version of Firefox or Chrome.\n\nFor more details of HTML5 compliancy in browsers,\
    \ consider reviewing: http://en.wikipedia.org/wiki/Comparison_of_layout_engines_%28HTML5%29.\n\
    \n## How to do it...\n\n1. Log in as a Jenkins administrator and visit the Configure\
    \ System screen `/configure`.\n2. Under the Jenkins Sound section, check Play\
    \ through HTML5 Audio enabled Browser.\n\nIf Jenkins has problems finding the\
    \ sound archive with an error message such as `File not found 'file:/C:/Users/Alan/.jenkins/jar:file:/C:/Users/Alan/.jenkins/plugins/sounds/WEB-INF/lib/classes.jar/sound-archive.zip'`,\
    \ then unzip the `classes.jar` file and move the `sounds-archive.zip` file to\
    \ the same directory mentioned in the error message. Finally, point the configuration\
    \ to the archive, for example, `file:/C:/Users/Alan/.jenkins/plugins/sounds/WEB-INF/lib/sound-archive.zip`.\n\
    3. Click on the Save button.\n4. Select the Job creation link found on the Jenkins\
    \ home page.\n5. Create a New Job with the Job name `ch4.sound`.\n6. Select Build\
    \ a free-style software project.\n7. Click on OK.\n8. In the Post-build Actions\
    \ section, check the Jenkins Sounds option.\n9. Add two sounds: EXPLODE and doh.\n\
    10. Click on Save.\n11. Click on the Build now link.\n12. On success, your browser\
    \ will play the `EXPLODE` wav file.\n13. Edit your job so that it fails, for example,\
    \ by adding a non-existent source code repository.\n14. Build the job again. On\
    \ failure, your web browser will play the `doh` wav file.\n\n## How it works...\n\
    \nYou have successfully configured your job to play different sounds based on\
    \ the success or failure of the build.\n\nYou can refine how the plugin reacts\
    \ further by configuring which event transitions will trigger a sound, for example,\
    \ if the previous build result was a failure and the current build result is a\
    \ success. This is defined in the For previous build result set of checkboxes.\n\
    \nThe plugin works as a page decorator. It adds the following JavaScript that\
    \ asynchronously polls for new sounds. Your browser is doing the majority of the\
    \ work, freeing server resources:\n\n```\n```html\n<script src=\"/sounds/script\"\
    \n     type=\"text/javascript\"></script><script type=\"text/javascript\"\n  \
    \   defer=\"defer\">function _sounds_ajaxJsonFetcherFactory(onSuccess,\n     onFailure)\
    \ {\nreturn function() {\nnew Ajax.Request(\"/sounds/getSounds\", {\nparameters:\
    \ { version: VERSION },\nonSuccess: function(rsp) {\nonSuccess(eval('x='+rsp.responseText))\n\
    },\nonFailure: onFailure\n});\n}\n}\nif (AUDIO_CAPABLE) {\n    _sounds_pollForSounds(_sounds_ajaxJsonFetcherFactory);\n\
    }</script>\n```\n```\n\n# There's more...\n\nThe sound plugin also allows you\
    \ to stream arbitrary sounds to connected web browsers. Not only is this useful\
    \ for practical jokes and motivational speeches directed at your distributed team,\
    \ you can also perform useful actions such as a 10-minute warning alert before\
    \ restarting a server.\n\nYou can find some decent sound collections at http://www.archive.org/details/opensource_audio.\n\
    \nFor example, you can find a copy of the One Laptop per Child music library at\
    \ http://www.archive.org/details/OpenPathMusic44V2. Within the collection, you\
    \ will discover `shenai.wav`. First, add the sound somewhere on the internet where\
    \ it can be found. A good place is the Jenkins `userContent` directory. To play\
    \ the sound on any connected web browser, you will need to visit the trigger address\
    \ (replacing `localhost:8080` with your own address):\n\n```\nhttp://localhost:8080/sounds/playSound?src=http://localhost:8080/userContent/shenai.wav\n\
    ```\n"
  mdcn: "\n\n# 另请参阅\n\n-   *使用 Dashboard View 插件节省屏幕空间*方法\n\n# 使用 Dashboard View 插件节省屏幕空间\n\
    \n在 *高效使用视图* 方法中，你发现可以使用 `views` 插件节省水平标签页空间。在本方法中，你将使用 `Dashboard View` 插件来压缩水平空间的利用。压缩水平空间有助于高效地整合信息。\n\
    \n`Dashboard View` 插件允许你配置视图的各个区域以显示特定功能，例如，作业的网格视图，或显示失败作业子集的视图区域。用户可以拖放这些区域在屏幕上的位置。\n\
    \n开发人员已经让仪表板易于扩展，所以未来会有更多选择。\n\n## 如何操作...\n\n1. Dashboard View 插件将屏幕划分为多个区域。在仪表板配置期间，你选择作业网格和不稳定作业小工具。其他仪表板小工具包括作业列表、最新构建、从站统计、测试统计图表或网格，以及测试趋势图。随着插件成熟，将有更多选择。\n\
    2. 作为 Jenkins 管理员，登录你的 Jenkins 实例主页。\n3. 通过单击屏幕顶部第二个选项卡中的加号创建新视图。\n4. 选择 Dashboard\
    \ 视图。\n5. 单击 OK：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_575_0.png)\n\n6.\
    \ 在“作业筛选器”中选择“作业”：\n7. 选择“仪表板小工具”：\n\n### 仪表板小工具\n\n- ☑ 在页面顶部显示标准 Jenkins 列表\n\
    - ☐ 全屏视图 - 隐藏标准 Jenkins 面板\n- ☐ 设置 CSS 自定义参数\n\n8. 添加或删除要在 Dashboard 视图中保留的列：\n\
    \n### 列\n\n状态\n\n删除\n\n名称\n\n删除\n\n构建按钮\n\n删除\n\n上次成功\n\n删除\n\n添加列\n\n### 仪表板小工具\n\
    \n- 在页面顶部显示标准 Jenkins 列表\n- 全屏视图 - 隐藏标准 Jenkins 面板\n- 设置 CSS 自定义参数\n\n9. 单击“保存”并验证新的\
    \ Dashboard 视图：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_579_0.png)\n\n10.\
    \ 你可以将仪表板小工具添加到页面的不同部分：\n\n### 仪表板小工具\n\n- ☑ 在页面顶部显示标准 Jenkins 列表\n- ☐ 全屏视图 -\
    \ 隐藏标准 Jenkins 面板\n- ☐ 设置 CSS 自定义参数\n\n### 页面顶部的小工具\n\n将仪表板小工具添加到视图顶部\n\n- 每个项目的\
    \ Android Lint 问题\n- Android Lint 问题趋势图（新增 vs. 已修复）\n- Android Lint 问题趋势图（按优先级分布）\n\
    - 构建流水线仪表板视图\n- 构建统计\n- Iframe 小工具\n- 图像\n- Jenkins 作业列表\n- 作业统计\n- 作业网格\n- 最新构建\n\
    - 从站统计\n- 测试统计图表\n\n11. 选择“构建统计”小工具并保存：\n\n### 仪表板小工具\n\n- ☑ 在页面顶部显示标准 Jenkins\
    \ 列表\n- ☐ 全屏视图 - 隐藏标准 Jenkins 面板\n- ☐ 设置 CSS 自定义参数\n\n### 页面顶部的小工具\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_580_0.png)\n\
    \n12. 在 Jenkins 仪表板中保存配置后，验证新的小工具：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_581_0.png)\n\
    \n与其他视图相比，作业网格小工具节省了空间，因为显示的作业密度很高。\n\n如果你还使用了“多视图”选项卡（参见上一个方法），会有个小问题。当你单击仪表板标签时，显示的是原始视图集合，而不是选择框。\n\
    \n# 更多内容...\n\nDashboard 插件为其他插件开发者提供了一个创建仪表板视图的框架。这种用法的一个示例是 `Project Statistics`\
    \ 插件（https://wiki.jenkins-ci.org/display/JENKINS/Project+Statistics+Plugin）。\n\
    \n# 另请参阅\n\n- *创建 HTML 报告*方法\n- *高效使用视图*方法\n\n# 使用 HTML5 浏览器发出声音\n\n本方法介绍如何在事件发生时（例如构建成功）向\
    \ Jenkins 用户的浏览器发送自定义声音。你也可以在任意时间发送声音消息。这不仅适合那些喜欢被喊叫、被著名演员唱歌等开发者，也适合在大型服务器场中寻找计算机的系统管理员。\n\
    \n## 准备工作\n\n安装 Jenkins 声音插件（https://wiki.jenkins-ci.org/display/JENKINS/Jenkins+Sounds+plugin）。确保你安装了符合\
    \ HTML5 规范的浏览器，例如当前版本的 Firefox 或 Chrome。\n\n有关浏览器中 HTML5 合规性的更多详细信息，请参考：http://en.wikipedia.org/wiki/Comparison_of_layout_engines_%28HTML5%29。\n\
    \n## 如何操作...\n\n1. 以 Jenkins 管理员身份登录，并访问“配置系统”屏幕 `/configure`。\n2. 在“Jenkins 声音”部分，勾选“通过支持\
    \ HTML5 音频的浏览器播放”。\n\n如果 Jenkins 在查找声音归档时出现问题，并出现诸如 `File not found 'file:/C:/Users/Alan/.jenkins/jar:file:/C:/Users/Alan/.jenkins/plugins/sounds/WEB-INF/lib/classes.jar/sound-archive.zip'`\
    \ 的错误消息，则解压 `classes.jar` 文件，并将 `sounds-archive.zip` 文件移动到错误消息中提到的相同目录。最后，将配置指向该归档，例如\
    \ `file:/C:/Users/Alan/.jenkins/plugins/sounds/WEB-INF/lib/sound-archive.zip`。\n\
    \n3. 单击“保存”按钮。\n4. 选择 Jenkins 主页上的“创建作业”链接。\n5. 创建一个新作业，作业名称为 `ch4.sound`。\n6.\
    \ 选择“构建一个自由风格的软件项目”。\n7. 单击 OK。\n8. 在“构建后操作”部分，勾选“Jenkins 声音”选项。\n9. 添加两个声音：EXPLODE\
    \ 和 doh。\n10. 单击“保存”。\n11. 单击“立即构建”链接。\n12. 成功后，你的浏览器将播放 `EXPLODE` wav 文件。\n13.\
    \ 编辑你的作业使其失败，例如，通过添加一个不存在的源代码仓库。\n14. 再次构建该作业。失败时，你的 Web 浏览器将播放 `doh` wav 文件。\n\
    \n## 工作原理...\n\n你已成功配置作业，使其根据构建的成功或失败播放不同的声音。\n\n你可以通过配置哪些事件转换将触发声音来进一步调整插件的响应方式，例如，如果上一次构建结果为失败而当前构建结果为成功。这可以在“对于上一次构建结果”复选框组中定义。\n\
    \n该插件作为一个页面装饰器工作。它添加了以下 JavaScript，用于异步轮询新声音。你的浏览器承担了大部分工作，从而释放了服务器资源：\n\n```html\n\
    <script src=\"/sounds/script\"\n     type=\"text/javascript\"></script><script\
    \ type=\"text/javascript\"\n     defer=\"defer\">function _sounds_ajaxJsonFetcherFactory(onSuccess,\n\
    \     onFailure) {\nreturn function() {\nnew Ajax.Request(\"/sounds/getSounds\"\
    , {\nparameters: { version: VERSION },\nonSuccess: function(rsp) {\nonSuccess(eval('x='+rsp.responseText))\n\
    },\nonFailure: onFailure\n});\n}\n}\nif (AUDIO_CAPABLE) {\n    _sounds_pollForSounds(_sounds_ajaxJsonFetcherFactory);\n\
    }</script>\n```\n\n# 更多内容...\n\n声音插件还允许你将任意声音流式传输到已连接的 Web 浏览器。这不仅对针对分布式团队的恶作剧和激励演讲有用，你还可以执行有用的操作，例如在重启服务器前发出\
    \ 10 分钟警告警报。\n\n你可以在 http://www.archive.org/details/opensource_audio 找到一些不错的声音集。\n\
    \n例如，你可以在 http://www.archive.org/details/OpenPathMusic44V2 找到“每个孩子一台笔记本电脑”音乐库的副本。在该集合中，你会发现\
    \ `shenai.wav`。首先，将声音添加到互联网上可以找到的地方。一个合适的位置是 Jenkins 的 `userContent` 目录。要在任何已连接的\
    \ Web 浏览器上播放该声音，你需要访问触发地址（将 `localhost:8080` 替换为你自己的地址）：\n\n```\nhttp://localhost:8080/sounds/playSound?src=http://localhost:8080/userContent/shenai.wav\n\
    ```\n\n"
