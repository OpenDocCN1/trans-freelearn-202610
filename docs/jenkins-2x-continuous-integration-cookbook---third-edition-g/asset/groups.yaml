    # # How it works...


    Wapiti loads in different modules. By default, all modules are used. You will
    have to be selective; for Version 2.2.1 on Ubuntu Linux, this causes Wapiti to
    crash or timeout.


    To load in specific modules, use the `-m` option.


    The `-m "-all,xss,exec"` statement tells Wapiti to ignore all modules except the
    xss and exec modules.


    The exec module is very good at finding 500 errors in Jenkins. This is mostly
    due to unexpected input, which Jenkins does not handle well. This is purely a
    cosmetic set of issues. However, if you start to see errors associated with resources
    such as files or database services, then you should give the issues higher priority
    and send in bug reports.


    The `-x` option specifies which URLs to ignore. In this case, we don''t want to
    cause work for the plugin manager. If we do, it will then generate a lot of requests
    to an innocent external service.


    Wapiti crawls websites. If you are not careful, the tool might follow a link to
    locations that you do not want testing. To avoid embarrassment, carefully use
    the exclude URL''s option, `-x`.


    The `-v2` option sets the verbosity of logging up to its highest so that you can
    see all the attacks.


    In the second run of Wapiti, you also used the permanentxss module, which at times
    finds bonafide XSS attacks, depending on the race between developers building
    features and cleaning bugs:


    Fuzzers are good at covering a large portion of an application''s URL space, triggering
    errors that would be costly in terms of time to search out. Consider automating
    through a Jenkins job as part of a project''s QA process.'
  - '[PAGE 267]


    # There''s more...


    The reports you generated in this recipe mention many more server errors than
    XSS attacks. This is because many of the errors generated are due to unexpected
    input causing failures that are only caught by the final layer of error handling;
    in this case, the bug report page. If you consider the error worth reporting,
    then follow the instructions found on the bug report page.


    Here are some guidelines for the meaning behind the output of the stack traces:


    +   - `java.lang.SecurityException`: If a Jenkins user is doing something that
    the programmer considers insecure, such as hitting a URL, this should only be
    reachable once you have logged in.

    +   - `java.lang.IllegalArgumentException`: Jenkins checked for a valid range
    for your parameter and the parameter value was outside that range. This is a deliberately
    thrown exception.

    +   - `java.lang.NumberFormatException`: Jenkins did not check for a valid string
    and then tried to parse a non-conformant string to a number.

    +   - `java.lang.NullPointerException`: This normally happens when you hit a URL
    without all the parameters set that Jenkins expects. In programmer''s language,
    the code is expecting an object that does not exist, and then tries to call a
    method of the nonexistent object without checking that the object exists. The
    programmer needs to add more error-checking. Write a bug report.'
