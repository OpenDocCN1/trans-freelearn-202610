    # # How to do it...


    +   1. Jenkins'' stable and recent versions are available in a YUM repository.

    +   2. Open the Apache JMeter console and create a Test Plan.

    +   3. Right-click on the Test Plan and click on Add; select Threads (Users).

    +   4. Select Thread Group.

    +   5. Provide the Thread Group name.

    +   6. In the Thread Group properties, provide the Number of Threads, Ramp-up
    Period, and Loop Count.

    +   7. Right-click on Thread Group. Click on Add. Click on Sampler. Click on HTTP
    Request.

    +   8. In HTTP Request, provide the Server Name or IP. In our case, it will be
    localhost or an IP address.

    +   9. Give the Port Number where your web server is running.

    +   10. Select the GET method and provide a path to the load test:'
