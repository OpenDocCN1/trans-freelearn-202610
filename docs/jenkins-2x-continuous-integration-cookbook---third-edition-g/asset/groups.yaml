    \ the URL of an Azure Web App from your browser and verify that it is ready for\
    \ hosting our sample spring application, PetClinic:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_424_0.png)\n\
    \nClick on All Settings, and go to Deployment credentials in the DEPLOYMENT section.\
    \ Provide an FTP/deployment username and Password, and save your changes:\n\n\
    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_424_1.png)\n\nLet's install the `Publish\
    \ Over FTP` plugin in Jenkins. We will use the Azure Web App's FTP details to\
    \ publish the PetClinic WAR file.\n\n### How to do it...\n\n1. Let's go to the\
    \ Jenkins dashboard. Click on New Item and select Freestyle project.\n2. In Jenkins,\
    \ go to Manage Jenkins and click on Configure | Configure FTP settings. Provide\
    \ a Hostname, Username, and Password, available in the Azure portal.\n3. Go to\
    \ [azurewebsites.net](https://azurewebsites.net) and go to the Kudu console. Navigate\
    \ through the different options and find the site directory and webapps directory.\
    \ In the App Service URL, add `.scm` after the name of the Web App.\n4. Click\
    \ on Test Configuration and, once you get a Success message, you are ready to\
    \ deploy the PetClinic application:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_425_0.png)\n\
    \n5. In the build job we created, go to the Build section and configure Copy artifacts\
    \ from another project. We will copy the WAR file to a specific location on a\
    \ virtual machine.\n6. In Post-build Actions, click on Send build artifacts over\
    \ FTP. Select the FTP Server Name that is configured in Jenkins. Configure Source\
    \ files and the Remove prefix for the deployment of an Azure Web App.\n7. Select\
    \ Verbose output in the Console:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_426_0.png)\n\
    \n8. Click on Build now and see what happens behind the scenes:\n9. Go to the\
    \ Kudu console, click on DebugConsole, and go to Powershell. Go to site | wwwroot\
    \ | webapps. Check whether the WAR file has been copied:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_426_1.png)\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_426_2.png)\n\nNow we have an application\
    \ deployed on an Azure Web App.\n\n## Promoting builds\n\nIt is essential to differentiate\
    \ builds from each other, based on verification or passing certain stages.\n\n\
    ### Getting ready\n\nGo to Manage Jenkins | Manage Plugins | Available. Install\
    \ the promoted builds plugin.\n\n### How to do it...\n\n1. Go to project configuration\
    \ and check Promote builds when...:\n2. This build is promoted immediately once\
    \ the build is complete, irrespective of its status.\n3. You can configure promotion\
    \ for manual approval too.\n\n## Continuous Testing\n\nIn this chapter, we will\
    \ cover the following recipes:\n\n- Getting started with continuous testing\n\
    - Creating a Selenium test case using Eclipse\n- Integrating Jenkins and Selenium\
    \ for functional testing\n- Jenkins and Cucumber test reports\n- Creating a load\
    \ test in Apache JMeter\n- Executing a load test from Jenkins\n- Reporting JMeter\
    \ performance metrics\n- Testing with FitNesse\n\n### Getting ready\n\nYou will\
    \ need Eclipse Java EE IDE for Web Developers, Version: Mars.2 Release (4.5.2),\
    \ Build ID: 20160218-0600.\n\nGo to the Eclipse Marketplace and install the Maven\
    \ integration for the Eclipse plugin:\n\n1. Create a Maven Project using a wizard\
    \ in Eclipse IDE:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_434_0.png)\n\n2.\
    \ Select Create a simple project (skip archetype selection) and click on Next:\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_435_0.png)\n\n3. Go through the wizard\
    \ and create a project. It will take some time to create a project in Eclipse.\
    \ Provide the Artifact, Version, Packaging, Name, and Description. Click on Finish.\n\
    \n4. Wait until the Maven project is created and configured. Make sure that Maven\
    \ is installed and configured properly. In the case of the Maven behind the proxy,\
    \ configure the proxy details into conf .xml, available in the Maven directory.\n\
    \n5. In pom.xml, we need to add Maven, Selenium, TestNG, and JUnit dependencies\
    \ in the `<project>` node. The following is a modified pom.xml:\n\n```xml\n<project\
    \ xmlns=\"http://maven.apache.org/POM/4.0.0\"\n         xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0\n         http://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    >\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>com.tiny</groupId>\n  <artifactId>test</artifactId>\n\
    \  <version>0.0.1-SNAPSHOT</version>\n  <name>test</name>\n  <build>\n    <plugins>\n\
    \      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n       \
    \ <artifactId>maven-compiler-plugin</artifactId>\n        <version>3.6.1</version>\n\
    \        <configuration>\n          <source>1.8</source>\n          <target>1.8</target>\n\
    \        </configuration>\n      </plugin>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
    \        <artifactId>maven-surefire-plugin</artifactId>\n        <version>2.19.1</version>\n\
    \        <configuration>\n          <suiteXmlFiles>\n            <suiteXmlFile>testng.xml</suiteXmlFile>\n\
    \          </suiteXmlFiles>\n        </configuration>\n      </plugin>\n    </plugins>\n\
    \  </build>\n  <dependencies>\n    <dependency>\n      <groupId>org.seleniumhq.selenium</groupId>\n\
    \      <artifactId>selenium-java</artifactId>\n      <version>3.6.0</version>\n\
    \    </dependency>\n    <dependency>\n      <groupId>org.testng</groupId>\n  \
    \    <artifactId>testng</artifactId>\n      <version>6.10</version>\n      <scope>test</scope>\n\
    \    </dependency>\n  </dependencies>\n</project>\n```\n\n6. Save pom.xml after\
    \ adding these changes and build the project again from the Project menu. It will\
    \ download new dependencies:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_436_0.png)\n\
    \n7. Click on the Details button of the dialog box to verify the operation in\
    \ progress.\n\n8. The next task is to write the TestNG class. Install the TestNG\
    \ plugin. Go to Help and click on Install New Software. Add Repository:\n\n###\
    \ How to do it...\n\n1. Now let's create a TestNG class:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_438_0.png)\n\
    \n2. Provide a Class name:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_439_0.png)\n\
    \n3. Give a Package name and click on Finish.\n4. The newly created class will\
    \ look like the following screenshot:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_440_0.png)\n\
    \n5. Right-click on the test file and click on TestNG, convert to TestNG.\n6.\
    \ It will create a `testng.xml` file that has details about the test suite.\n\
    7. Right-click on Project and click on Run Configurations.\n8. Right-click on\
    \ TestNG and click on New:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_441_0.png)\n\
    \n9. Provide the Project name and select `testng.xml` in the Suite.\n10. Click\
    \ OK and Apply.\n11. Click on Run:\n\nRun Configurations\n\nCreate, manage, and\
    \ run configurations\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_442_0.png)\n\n\
    12. If Windows Firewall blocks it, then click on Allow Access.\n\nThere is no\
    \ configuration available in testng.xml for execution, hence, even if the Maven\
    \ execution runs successfully, no suite will be executed.\n\nGenerate the TestNG\
    \ class under the test folder.\n\n1. Select the location, suite name, and class\
    \ name:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE suite\
    \ SYSTEM \"http://testng.org/testng-1.0.dtd\">\n<suite name=\"Suite\">\n<test\
    \ name=\"Test\">\n<classes>\n<class name=\"example.PetClinicTest\"/>\n</classes>\n\
    </test><!-- Test -->\n</suite><!-- Suite -->\n```\n"
