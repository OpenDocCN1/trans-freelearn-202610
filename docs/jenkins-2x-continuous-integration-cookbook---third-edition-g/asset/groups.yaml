  md: "\n## Getting ready\n\nMake sure that you have all the build jobs available\
    \ that you created in earlier chapters, such as the deployment of WAR files, functional\
    \ testing, and load testing.\n\nfrom the PetClinic-FuncTest job, you will configure\
    \ PetClinic-LoadTest as a downstream job in Post-build Actions:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_497_0.png)\n\
    \nOnce load testing is completed, you should deploy the application in the Prod\
    \ environment, so from the PetClinic-LoadTest job, you will configure PetClinic-Prod\
    \ as a downstream job in Post-build Actions:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_497_1.png)\n\
    \n## Configuring a build pipeline\n\nNow you have configured all upstream and\
    \ downstream jobs. You know the sequence so you can execute the first build and\
    \ the rest of the builds will follow until any job fails in the sequence. You\
    \ can configure to move ahead with unstable builds as well.\n\nHowever, it is\
    \ more useful if you have the visualization of the flow of execution you have\
    \ configured as upstream and downstream jobs.\n\nThe build pipeline plugin provides\
    \ visualization of the execution flow based on the upstream and downstream jobs\
    \ configuration.\n\n## Getting ready\n\nInstall the plugin from Manage Jenkins\
    \ | Manage Plugins:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_499_0.png)\n\n\
    Verify the successful installation of the Build Pipeline Plugin:\n\n# Installing\
    \ Plugins/Upgrades\n\nPreparation\n\n- Checking internet connectivity\n- Checking\
    \ update center connectivity\n- Success\n\n- TestNG Results Plugin  Success\n\
    - promoted builds plugin  Success\n- Run Condition Plugin  Success\n- Conditional\
    \ BuildStep  Success\n- Parameterized Trigger plugin  Success\n- Build Pipeline\
    \ Plugin  Success\n\nGo back to the top page\n(you can start using the installed\
    \ plugins right away)\n\nRestart Jenkins when installation is complete and no\
    \ jobs are running\n\nNow, you are ready to create a build pipeline and configure\
    \ it with an initial job.\n\n## How to do it...\n\n- 1. Go to the Jenkins dashboard\
    \ and click on the + sign on the tabs available.\n- 2. Provide the View name and\
    \ select Build Pipeline View.\n- 3. Click on Save:\n\n## Jenkins\n\nOpen Blue\
    \ Ocean\n\nsearch\n\nadmin | log out\n\n- New Item\n- People\n- Build History\n\
    - Project Relationship\n- Check File Fingerprint\n- Manage Jenkins\n- My Views\n\
    - Disk Usage\n- Credentials\n\nView name\n\nPetClinic\n\nBuild Pipeline View\n\
    Shows the jobs in a build pipeline view. The complete pipeline of jobs that a\
    \ version propagates through are shown as a row in the view.\n\nDashboard\nCustomizable\
    \ view that contains various portlets containing information about your job(s)\n\
    \nList View\nShows items in a simple list format. You can choose which jobs are\
    \ to be displayed in which view.\n\nMy View\nThis view automatically displays\
    \ all the jobs that the current user has an access to.\n\nOK\n\nBuild Queue\n\
    No builds in the queue.\n\nBuild Executor Status\n\n4. Verify that the Layout\
    \ is configured as Based on upstream/downstream relationship.\n\n5. You want to\
    \ execute PetClinic-code as a first job and you want to see the visualization\
    \ from that job, so select it in the Select Initial Job:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_502_0.png)\n\
    \n- 6. Select the rest of the configuration as per your requirements.\n- 7. Change\
    \ the No Of Displayed Builds from 1 to 3 so it will display the latest three build\
    \ pipelines executed.\n- 8. Click on OK:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_502_1.png)\n\
    \n9. Verify the Build Pipeline view in the Jenkins dashboard:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_503_0.png)\n\
    \nBuild Pipeline in Initial Phase\n\n10. What if you want to continue the execution\
    \ of the pipeline even if some build is unstable? In such cases, you need to select\
    \ Trigger even if the build is unstable option in Post-build Actions, as seen\
    \ in the following screenshot:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_503_1.png)\n\
    \n11. Click on the run in Build Pipeline view. Wait till the complete pipeline\
    \ is executed:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_504_0.png)\n\n## Successful\
    \ Build Pipeline Execution\n\n12. Done. This is how you can create a sequence\
    \ of execution for different build jobs and achieve end-to-end automation for\
    \ the application life cycle management. In the next recipe, you will achieve\
    \ similar things using a the pipeline as a code feature.\n\n## Creating a pipeline\
    \ job\n\nIn a pipeline, you model all related tasks to decide the sequence of\
    \ execution. You will perform\nthe same tasks you performed with the build pipeline,\
    \ but with code.\n\n## Getting ready\n\nOpen the Jenkins dashboard.\n\n## How\
    \ to do it...\n\n- 1. Click on New Item. Enter an item name and select Pipeline.\n\
    - 2. Click OK:\n\n## Enter an item name\n\nFirstPipeline\n\n- **Freestyle project**\
    \ — This is the central feature of Jenkins. Jenkins will build your project, combining\
    \ any SCM with any build system, and this can be even used for something other\
    \ than software build.\n- **Maven project** — Build a maven project. Jenkins takes\
    \ advantage of your POM files and drastically reduces the configuration.\n- **Pipeline**\
    \ — Orchestrates long-running activities that can span multiple build slaves.\
    \ Suitable for building pipelines (formerly known as workflows) and/or organizing\
    \ complex activities that do not easily fit in free-style job type.\n- **External\
    \ Job** — This type of job allows you to record the execution of a process run\
    \ outside Jenkins, even on a remote machine. This is designed so that you can\
    \ use Jenkins as a dashboard of your existing automation system.\n- **Multi-configuration\
    \ project** — Suitable for projects that need a large number of different configurations,\
    \ such as testing on multiple environments, platform-specific builds, etc.\n\n\
    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_508_0.png)\n\n## Using a sample pipeline\
    \ for execution\n\nJenkins provides sample syntax to get a feel for how to configure\
    \ a pipeline.\n\n## Getting ready\n\nWith Jenkins 2, the pipeline and other features\
    \ are installed with the default installation with the suggested plugins.\n\n\
    ## How to do it...\n\n- 1. Go to the Jenkins dashboard | New item | Pipeline.\n\
    - 2. It will open the configuration of a newly created pipeline job.\n- 3. Go\
    \ to the Pipeline section:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_511_0.png)\n\
    \n4. In the try sample Pipeline... dropdown, select GitHub + Maven. It will automatically\
    \ generate the syntax for the sample code. Make sure that mvnHome has the proper\
    \ value as per the path given for Maven in your system:\n\n## Pipeline\n\nDefinition\n\
    \nPipeline script\n\nScript\n\n```\nnode {\n    def mvnHome\n    stage('Preparation')\
    \ { // for display purposes\n        // Get some code from a GitHub repository\n\
    \        git 'https://github.com/jglick/simple-maven-project-with-tests.git'\n\
    \        // Get the Maven tool\n        // ** NOTE: This 'M3' Maven tool must\
    \ be configured\n        // **       in the global configuration.\n        mvnHome\
    \ = tool 'M3'\n    }\n    stage('Build') {\n        // Run the maven build\n \
    \       if (isUnix()) {\n            sh \"${mvnHome}/bin/mvn\" -Dmaven.test.failure.ignore\
    \ clean package\"\n        } else {\n            bat(\"/${mvnHome}/bin/mvn\" -Dmaven.test.failure.ignore\
    \ clean package/)\n        }\n    }\n```\n\nGitHub + Maven\n\nUse Groovy Sandbox\n\
    \nPipeline Syntax\n\nSave\n\nApply\n\n- 5. Click on Save and execute the build\
    \ to verify it.\n- 6. However, you will create your own pipeline with the same\
    \ sequence you tried with the Build Pipeline plugin in the next recipe.\n\n##\
    \ Configuring a pipeline job for end-to-end automation\n\nIn this recipe, you\
    \ will create script to create a pipeline similar to what you configured with\
    \ the `Build Pipeline` plugin.\n\n## Getting ready\n\nClick on Pipeline Syntax\
    \ to generate the syntax for specific tasks you want to execute.\n\nYou can select\
    \ the steps and configure the required things, and then click on Generate Pipeline\
    \ Script to get the syntax that you can directly utilize in your pipeline:\n"
  mdcn: "\n\n## 准备工作\n\n确保你拥有在前几章中创建的所有构建作业，例如 WAR 文件的部署、功能测试和负载测试。\n\n在 PetClinic-FuncTest\
    \ 作业中，你将在 Post-build Actions 中将 PetClinic-LoadTest 配置为下游作业：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_497_0.png)\n\
    \n负载测试完成后，你应该在 Prod 环境中部署应用程序，因此在 PetClinic-LoadTest 作业中，你将在 Post-build Actions\
    \ 中将 PetClinic-Prod 配置为下游作业：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_497_1.png)\n\
