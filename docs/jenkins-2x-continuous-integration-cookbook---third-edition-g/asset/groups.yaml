    ## Avoiding sign-up bots with JCaptcha


    **CAPTCHA** stands for **Completely Automated Public Turing test to tell Computers
    and Humans Apart**. The most commonly viewed CAPTCHAs are sequential letters and
    numbers displayed as graphics that you have to correctly feed into a text input.


    If you let anyone sign up for an account on your Jenkins server, then the last
    thing you want are bots (automated scripts) creating accounts. Bots have an economy
    of scale, being able to scan the internet rapidly and never getting bored. CAPTCHAs
    are a necessary defense against these dumb attacks.


    The negative purposes of bots are as follows:


    - Performing a **Denial Of Service (DOS)** attack on your server, for example,
    by automatically creating numerous heavyweight jobs

    - **Distributed Denial Of Service attack (DDOS)** on other servers by harvesting
    many Jenkins servers to fire off large numbers of requests

    - Injecting unwanted advertisements or content that then points to malicious sites

    - Adding scripts that are stored permanently and run when a user accidentally
    browses the Jenkins site


    There are commercial motivations for criminals to circumvent CAPTCHAs that have
    led to well-documented law cases. You can find one such law case at [http://www.wired.com/2010/10/hacking-captcha/](http://www.wired.com/2010/10/hacking-captcha/).


    ## Getting ready


    Make sure you have backed up your sacrificial Jenkins server. You are going to
    modify its security settings. It is easy to make a service-changing mistake.


    The JCaptcha plugin is based on Java implementation that you can find at https://jcaptcha.atlassian.net/wiki/display/general/Home.


    ## How to do it...


    - 1. Log in as an administrator.

    - 2. Click on the Configure Global Security link.

    - 3. Select Jenkins'' own user database under Security Realm.

    - 4. Select Allow users to sign up:

    - 5. Press Save.

    - 6. Browse to the signup location, http://localhost:8080/signup.

    - 7. Click on the Manage Plugins link in the Manage Jenkins page.

    - 8. Select the Available tab.

    - 9. Install the JCaptcha plugin.

    - 10. Click on the Configure Global Security link under the Manage Jenkins page.

    - 11. Select Jenkins'' own user database under Security Realm.

    - 12. Select Enable captcha on sign up.

    - 13. Press Save and then click on the Log Out link.

    - 14. Browse to the signup location, http://localhost:8080/signup. The page is
    now defended by a CAPTCHA.


    ## How it works...


    Installing the plugin adds the CAPTCHA image to the signup process. The image
    needs pattern recognition to decipher it. Humans are very good at this; automated
    processes are a lot worse, but improving.


    ## Improving Code Quality


    In this chapter, we will cover the following recipes:


    - Integrating Jenkins with SonarQube

    - The updating center in SonarQube

    - Quality gates, quality profiles, and rules

    - Verifying HTML, CSS, and JavaScript validity using SonarQube

    - Verifying Java code using SonarQube

    - Configuring SonarQube as a Windows service


