    # How it works...


    Groovy runs basic Ant tasks without the need for extra dependencies. An `AntBuilder`
    instance (http://groovy.codehaus.org/Using+Ant+Libraries+with+AntBuilder) is created
    and then the Ant echo task is called. Under the bonnet, Groovy calls the Java
    classes that Ant uses to perform the `echo` command. Within the `echo` command,
    a date is printed by directly creating an anonymous object:


    ```

    ant.echo("\n\nVerified at ${new Date()}").

    ```


    You configured the `pom.xml` file to fire off the Groovy scripts in two phases:
    the test phase, and then later in the verify phase. The test phase occurs before
    the generation of a JAR file, and thus avoids creating a warning about an empty
    JAR file. As the name suggests, this phase is useful for testing before packaging.


    The second example script highlights the strength of combining Groovy with Ant.
    The SCP task (http://ant.apache.org/manual/Tasks/scp.html) is run many times across
    many servers. The script first asks for the username and password, avoiding storage
    on your filesystem or your revision control system. The Groovy script expects
    you to inject the `host`, `full_path_to_location`, and `myfile` variables.


    Observe the similarity between the Ant SCP task and the way it is expressed in
    the `pom_ant_contrib.xml` file.'
  - '[PAGE 357]


    # There''s more...


    Another example of running Ant through Groovy is the creation of custom property
    files on the fly. This allows you to pass on information from one Jenkins job
    to another.


    You can create property files through AntBuilder using the echo task. The following
    lines of code create a value.properties file with two lines, x=1 and y=2:


    ```

    def ant = new AntBuilder()

    ant.echo(message: "x=1\n", append: "false", file: "values.properties")

    ant.echo(message: "y=2\n", append: "true", file: "values.properties")

    ```


    The first echo command sets append to false, so that every time a build occurs,
    a new properties file is created. The second echo appends its message.


    You can remove the second append attribute as the default value is set to true.'
