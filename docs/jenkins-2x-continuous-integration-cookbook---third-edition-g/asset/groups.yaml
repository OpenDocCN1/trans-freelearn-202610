    ## Managing Jenkins build jobs using Eclipse


    Can we execute a Jenkins job from Eclipse? Yes we can! So, let''s see how to do
    that.


    ### Getting ready


    1. Go to Help | Install New Software...:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_137_0.png)


