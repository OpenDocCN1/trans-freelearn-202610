  md: "\n## There's more...\n\nThere are some important configurations that you need\
    \ to do here in the Configure System section, such as SCM Polling, E-mail Notification,\
    \ Extended E-mail Notification, Git plugin, Disk usage, Quality Gates - SonarQube,\
    \ Build Pipeline Plugin, Copyartifact: Upstream build that triggered this job,\
    \ Audit Trail, SonarQube servers, and so on.\n\n## Configuring JENKINS_HOME\n\n\
    The `.jenkins` is the main directory that contains all the details for Jenkins\
    \ installation files, configurations, plugins, build job configuration, and so\
    \ on.\n\n## Getting ready\n\nIt is important to keep the `.jenkins` directory\
    \ at a location where a good amount of free space is available. By default, Jenkins\
    \ creates `.jenkins` (or `JENKINS_HOME`) at a specific location considering the\
    \ operating systems.\n\nFor example, in Windows it is available at `c:\\Users\\\
    <USER_NAME>\\.jenkins`.\n\n## How to do it...\n\n- 1. In Windows, to change to\
    \ `JENKINS_HOME`, go to the Control Panel | All Control Panel Items | System.\n\
    - 2. Click on Advanced System Settings.\n- 3. Click on Environment Variables.\n\
    - 4. Create a new variable JENKINS_HOME and give the path:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_86_0.png)\n\
    \n- 5. In Ubuntu, go to `/etc/default/Jenkins`.\n- 6. Change the `JENKINS_HOME`\
    \ location:\n\n```\nmitesh51@Jenkins:~$ vi /etc/default/jenkins\ndefaults for\
    \ Jenkins automation server\n\n# pulled in from the init script; makes things\
    \ easier.\nNAME=jenkins\n\n# location of java\nJAVA=/usr/bin/java\n\n# arguments\
    \ to pass to java\n# Allow graphs etc. to work even when an X server is present\n\
    JAVA_ARGS=\"-Djava.awt.headless=true\"\n\n#JAVA_ARGS=\"-Xmx256m\"\n\n# make jenkins\
    \ listen on IPv4 address\n#JAVA_ARGS=\"-Djava.net.preferIPv4Stack=true\"\n\nPIDFILE=/var/run/$NAME/$NAME.pid\n\
    \n# user and group to be invoked as (default to jenkins)\nJENKINS_USER=$NAME\n\
    JENKINS_GROUP=$NAME\n\n# location of the jenkins war file\nJENKINS_WAR=/usr/share/$NAME/$NAME.war\n\
    \n# jenkins home location\nJENKINS_HOME=/var/lib/$NAME\n\n# set this to false\
    \ if you don't want Jenkins to run by itself\n# in this set up, you are expected\
    \ to provide a servlet container\n# to host jenkins.\nRUN_STANDALONE=true\n\n\
    # log location. this may be a syslog facility.priority\nJENKINS_LOG=/var/log/$NAME/$NAME.log\n\
    #JENKINS_LOG=daemon.info\n```\n\n7. Once changes are done, save the changes.\n\
    \n## There's more...\n\nThe following table describes the default location of\
    \ `JENKINS_HOME` in different operating systems:\n\n| Operating system | $JENKINS_HOME\
    \ location |\n|---|---|\n| Windows | C:\\Program Files (x86)\\jenkins or c:\\\
    Users\\<USER>\\.jenkins |\n| Mac OSX | Macintosh HD/Users/Shared/Jenkins |\n|\
    \ Ubuntu/Debian | /var/lib/jenkins |\n| Red Hat/CentOS/Fedora | /var/lib/jenkins\
    \ |\n| OpenSUSE | /var/lib/jenkins |\n| FreeBSD | /usr/local/etc/jenkins |\n|\
    \ OpenBSD | /usr/local/etc/jenkins |\n\n## Understanding JENKINS_HOME directory\n\
    \nIn this recipe, we will discuss the directories available in the `JENKINS_HOME`\
    \ directory.\n\n## Getting ready\n\nLocate the `JENKINS_HOME` directory from the\
    \ Environment Variables, or go to the default locations where `JENKINS_HOME` is\
    \ available in different operating systems.\n\n## How to do it...\n\n- 1. You\
    \ have many files and directories in the `JENKINS_HOME` directory. We will give\
    \ brief information on some important files and directories:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_93_0.png)\n\
    \n2. The following are some important files and directories in the `JENKINS_HOME`\
    \ directory:\n\n- `config.xml` — Jenkins root configuration file\n- `fingerprints`\
    \ — It stores fingerprint records, if any\n- `plugins` — It is a root directory\
    \ for all Jenkins plugins\n- `jobs` — It is a root directory for all Jenkins jobs\n\
    - `logs` — It stores all log files\n- `secrets` — It is a root directory for the\
    \ secret + key for credential decryption\n- `users` — It stores all user-related\
    \ details in Jenkins\n- `war` — It stores all details related to the `JENKINS_WAR`\
    \ file\n- `workspace` — It stores all the files and artifacts related to different\
    \ build jobs, and it moves content to jobs directory when archiving elements.\n\
    \n## See also\n\nIn the `JENKINS_HOME` directory, open `config.xml` in any of\
    \ the text editors and review the options available in the file.\n\n## Using different\
    \ ports for Jenkins\n\nBy default, Jenkins runs on port number 8080.\n\n## How\
    \ to do it...\n\nLet's change a port on which Jenkins runs:\n\n- 1. If you run\
    \ Jenkins using the command line, then you can execute a command such as `java\
    \ -jar -httpPort=9999 jenkins.war` to change the existing port from `8080` to\
    \ `9999`.\n- 2. Another way to change the port while Jenkins is installed using\
    \ the Windows package is as follows:\n  - Go to the `Program Files/Jenkins` directory\
    \ where you installed Jenkins\n  - Open the `Jenkins.xml` in the editor\n  - Find\
    \ `\"--httpPort=8080\"` and replace the port `8080` with the new port number\n\
    \n## How it works...\n\nFirst, you installed a virtual image of Ubuntu, changed\
    \ the password so that it is harder for others to log in, and updated the guest\
    \ OS for security patches.\n\n## Configuring JAVA_HOME in Jenkins\n\nJenkins is\
    \ an open source automation server that can be used to configure Continuous Integration\
    \ for projects written in many programming languages. Let's consider the case\
    \ of an application that is Java-based.\n\nWe need to tell Jenkins where Java\
    \ is installed.\n\n## How to do it...\n\n- 1. Open the Jenkins dashboard.\n- 2.\
    \ Go to Manage Jenkins.\n- 3. Go to Global Tool Configuration to configure tools,\
    \ their locations, and automatic installers.\n- 4. Go to the JDK section.\n- 5.\
    \ Give the Name and tick the Install automatically option; provide details for\
    \ the Oracle account to download JDK successfully.\n- 6. You can give a logical\
    \ name such as JDK 1.7 or JDK 1.8 to identify the correct version while configuring\
    \ a build job.\n- 7. You can add multiple JDKs based on the version, so if different\
    \ applications require different JDKs then the scenario can be managed easily\
    \ by adding JDK in Jenkins:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_101_0.png)\n\
    \n## How it works...\n\nWhen you create a build job in Jenkins and configure it,\
    \ you need to specify the Java version that will be used by the build execution.\
    \ You can use existing Java available on the system as well if you don't want\
    \ to install automatically.\n\nIn the general section of the build job, we can\
    \ select a JDK from the list. This list contains all the JDKs that we have configured\
    \ in the Global Tool Configuration.\n\n## Configuring Git in Jenkins\n\nJenkins\
    \ can be integrated with many source code repositories, and Git is one of them.\
    \ Let's consider the case of an application that is Java-based and the source\
    \ code is stored in Git, Gitlab, and/or GitHub.\n\nWe need to tell Jenkins where\
    \ Git is installed in the local system.\n\n## Getting ready\n\nDownload the required\
    \ Git version based on the operating system, or install automatically.\n\n## How\
    \ to do it...\n\n- 1. Open the Jenkins dashboard.\n- 2. Go to Manage Jenkins.\n\
    - 3. Go to Global Tool Configuration to configure the tools, their locations,\
    \ and automatic installers.\n- 4. Go to the Git section.\n- 5. Give the Name and\
    \ click on Install Automatically, or provide a path to Git.\n- 6. You can add\
    \ multiple Gits based on the version or for the specific agent. You need to give\
    \ a meaningful name so it can be identified easily while configuring the build\
    \ job:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_105_0.png)\n\n## How it works...\n\
    \nWhen you create a build job in Jenkins and configure it, you need to specify\
    \ the Git version that will be used by the build execution. You can use existing\
    \ Git installation available on the system as well if you don't want to install\
    \ automatically.\n\nIn the Source Code Management section, select the appropriate\
    \ Git that is configured in Global Tool Configuration from the list.\n\nGo to\
    \ the Git executable configuration to change the Git installable.\n"
  mdcn: "\n\n## 还有更多...\n\n在 Configure System 部分，这里有一些重要的配置需要你进行，例如 SCM Polling、E-mail\
    \ Notification、Extended E-mail Notification、Git plugin、Disk usage、Quality Gates\
    \ - SonarQube、Build Pipeline Plugin、Copyartifact: Upstream build that triggered\
    \ this job、Audit Trail、SonarQube servers 等等。\n\n## 配置 JENKINS_HOME\n\n`.jenkins`\
    \ 是包含 Jenkins 安装文件、配置、插件、构建作业配置等所有详细信息的核心目录。\n\n## 准备工作\n\n`.jenkins` 目录应保存在有充足可用空间的位置。默认情况下，Jenkins\
    \ 会根据操作系统在特定位置创建 `.jenkins`（或 `JENKINS_HOME`）。\n\n例如，在 Windows 中它位于 `c:\\Users\\\
    <USER_NAME>\\.jenkins`。\n\n## 如何操作...\n\n- 1. 在 Windows 中，要更改 `JENKINS_HOME`，请前往\
    \ 控制面板 | 所有控制面板项 | 系统。\n- 2. 点击 高级系统设置。\n- 3. 点击 环境变量。\n- 4. 创建一个新变量 JENKINS_HOME\
    \ 并给出路径：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_86_0.png)\n\n- 5. 在 Ubuntu\
    \ 中，前往 `/etc/default/Jenkins`。\n- 6. 更改 `JENKINS_HOME` 位置：\n\n```\nmitesh51@Jenkins:~$\
    \ vi /etc/default/jenkins\ndefaults for Jenkins automation server\n\n# pulled\
    \ in from the init script; makes things easier.\nNAME=jenkins\n\n# location of\
    \ java\nJAVA=/usr/bin/java\n\n# arguments to pass to java\n# Allow graphs etc.\
    \ to work even when an X server is present\nJAVA_ARGS=\"-Djava.awt.headless=true\"\
    \n\n#JAVA_ARGS=\"-Xmx256m\"\n\n# make jenkins listen on IPv4 address\n#JAVA_ARGS=\"\
    -Djava.net.preferIPv4Stack=true\"\n\nPIDFILE=/var/run/$NAME/$NAME.pid\n\n# user\
    \ and group to be invoked as (default to jenkins)\nJENKINS_USER=$NAME\nJENKINS_GROUP=$NAME\n\
    \n# location of the jenkins war file\nJENKINS_WAR=/usr/share/$NAME/$NAME.war\n\
    \n# jenkins home location\nJENKINS_HOME=/var/lib/$NAME\n\n# set this to false\
    \ if you don't want Jenkins to run by itself\n# in this set up, you are expected\
    \ to provide a servlet container\n# to host jenkins.\nRUN_STANDALONE=true\n\n\
    # log location. this may be a syslog facility.priority\nJENKINS_LOG=/var/log/$NAME/$NAME.log\n\
    #JENKINS_LOG=daemon.info\n```\n\n7. 完成更改后，保存更改。\n\n## 还有更多...\n\n下表描述了不同操作系统中\
    \ `JENKINS_HOME` 的默认位置：\n\n| 操作系统 | $JENKINS_HOME 位置 |\n|---|---|\n| Windows |\
    \ C:\\Program Files (x86)\\jenkins or c:\\Users\\<USER>\\.jenkins |\n| Mac OSX\
    \ | Macintosh HD/Users/Shared/Jenkins |\n| Ubuntu/Debian | /var/lib/jenkins |\n\
    | Red Hat/CentOS/Fedora | /var/lib/jenkins |\n| OpenSUSE | /var/lib/jenkins |\n\
    | FreeBSD | /usr/local/etc/jenkins |\n| OpenBSD | /usr/local/etc/jenkins |\n\n\
    ## 理解 JENKINS_HOME 目录\n\n在本教程中，我们将讨论 `JENKINS_HOME` 目录中可用的目录。\n\n## 准备工作\n\n从环境变量中定位\
    \ `JENKINS_HOME` 目录，或前往不同操作系统中 `JENKINS_HOME` 可用的默认位置。\n\n## 如何操作...\n\n- 1. `JENKINS_HOME`\
    \ 目录中有许多文件和目录。我们将对一些重要文件和目录进行简要说明：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_93_0.png)\n\
    \n2. `JENKINS_HOME` 目录中一些重要的文件和目录如下：\n\n- `config.xml` — Jenkins 根配置文件\n- `fingerprints`\
    \ — 它存储指纹记录，如有\n- `plugins` — 它是所有 Jenkins 插件的根目录\n- `jobs` — 它是所有 Jenkins 作业的根目录\n\
    - `logs` — 它存储所有日志文件\n- `secrets` — 它是用于凭据解密的密钥的根目录\n- `users` — 它存储 Jenkins 中所有与用户相关的详细信息\n\
    - `war` — 它存储与 `JENKINS_WAR` 文件相关的所有详细信息\n- `workspace` — 它存储与不同构建作业相关的所有文件和工件，并在归档元素时将内容移至\
    \ jobs 目录。\n\n## 另请参阅\n\n在 `JENKINS_HOME` 目录中，用任意文本编辑器打开 `config.xml` 并查看文件中可用的选项。\n\
    \n## 为 Jenkins 使用不同的端口\n\n默认情况下，Jenkins 运行在端口号 8080。\n\n## 如何操作...\n\n让我们更改 Jenkins\
    \ 运行的端口：\n\n- 1. 如果你使用命令行运行 Jenkins，则可以执行类似 `java -jar -httpPort=9999 jenkins.war`\
    \ 的命令，将现有端口从 `8080` 更改为 `9999`。\n- 2. 另一种更改端口的方法是在使用 Windows 包安装 Jenkins 时如下：\n\
    \  - 前往你安装 Jenkins 的 `Program Files/Jenkins` 目录\n  - 在编辑器中打开 `Jenkins.xml`\n \
    \ - 找到 `\"--httpPort=8080\"` 并将端口 `8080` 替换为新端口号\n\n## 其工作原理...\n\n首先，你安装了 Ubuntu\
    \ 的虚拟镜像，更改了密码以使其更难被他人登录，并为安全补丁更新了客户机操作系统。\n\n## 在 Jenkins 中配置 JAVA_HOME\n\nJenkins\
    \ 是一个开源自动化服务器，可用于为多种编程语言编写的项目配置持续集成。让我们考虑一个基于 Java 的应用程序的情况。\n\n我们需要告诉 Jenkins\
    \ Java 安装在何处。\n\n## 如何操作...\n\n- 1. 打开 Jenkins 仪表板。\n- 2. 前往 管理 Jenkins。\n- 3.\
    \ 前往 全局工具配置 以配置工具、其位置和自动安装程序。\n- 4. 前往 JDK 部分。\n- 5. 输入名称并勾选 自动安装 选项；提供 Oracle\
    \ 账户的详细信息以成功下载 JDK。\n- 6. 你可以给出 JDK 1.7 或 JDK 1.8 等逻辑名称，以便在配置构建作业时识别正确版本。\n- 7.\
    \ 你可以根据版本添加多个 JDK，因此如果不同应用程序需要不同的 JDK，则可以通过在 Jenkins 中添加 JDK 轻松管理该场景：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_101_0.png)\n\
    \n## 其工作原理...\n\n当你在 Jenkins 中创建构建作业并配置它时，你需要指定构建执行将使用的 Java 版本。如果你不想自动安装，也可以使用系统上已有的\
    \ Java。\n\n在构建作业的常规部分，我们可以从列表中选择一个 JDK。该列表包含我们在全局工具配置中配置的所有 JDK。\n\n## 在 Jenkins\
    \ 中配置 Git\n\nJenkins 可以与许多源代码存储库集成，Git 就是其中之一。让我们考虑一个基于 Java 的应用程序的情况，其源代码存储在\
    \ Git、Gitlab 和/或 GitHub 中。\n\n我们需要告诉 Jenkins Git 在本地系统中的安装位置。\n\n## 准备工作\n\n根据操作系统下载所需的\
    \ Git 版本，或自动安装。\n\n## 如何操作...\n\n- 1. 打开 Jenkins 仪表板。\n- 2. 前往 管理 Jenkins。\n-\
    \ 3. 前往 全局工具配置 以配置工具、其位置和自动安装程序。\n- 4. 前往 Git 部分。\n- 5. 输入名称并点击 自动安装，或提供 Git 的路径。\n\
    - 6. 你可以根据版本或特定代理添加多个 Git。你需要给出有意义的名称，以便在配置构建作业时易于识别：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_105_0.png)\n\
    \n## 其工作原理...\n\n当你在 Jenkins 中创建构建作业并配置它时，你需要指定构建执行将使用的 Git 版本。如果你不想自动安装，也可以使用系统上已有的\
    \ Git 安装。\n\n在源代码管理部分，从列表中选择在全局工具配置中配置的适当 Git。\n\n前往 Git 可执行文件配置以更改 Git 安装程序。\n\
    \n"
