  - '[PAGE 17]


    # # Preface


    Jenkins is a Java-based automation server that supports the discovery of defects
    early in the

    software cycle and the deployment of application packages in an automated manner.
    Thanks to a

    rapidly growing number of plugins, Jenkins communicates with many types of systems,
    building

    and triggering a wide variety of tests and integrations with various release management
    services.


    CI involves making small changes to software and then building and applying quality
    assurance

    processes. Defects not only occur in the code, but also appear in naming conventions,

    documentation, how the software is designed, build scripts, the process of deploying
    the software

    to servers, and so on. CI forces the defects to emerge early, rather than waiting
    for the software

    to be fully produced. If defects are caught in the later stages of the software
    development life

    cycle, the process will be more expensive. The cost of repair radically increases
    as soon as the

    bugs escape into production. Estimates suggest it is 100 to 1,000 times cheaper
    to capture defects

    early. Effective use of a CI server, such as Jenkins, could be the difference
    between enjoying a

    holiday and working unplanned hours to heroically save the day. And as you can
    imagine, in my

    day job as a senior developer with aspirations for quality assurance, I like long
    boring days, at

    least for mission-critical production environments.


    Continuous Delivery (CD) involves the deployment of applications in web servers
    or application

    servers located on-premise or in cloud environments. Jenkins supports integration
    with many

    cloud service providers and also supports integration with Platform as a Service
    offerings too.

    With shell script and command execution support, many deployment and configuration
    scenarios

    can be achieved too.


    Jenkins can automate the building of software regularly and trigger tests, pulling
    in the results

    and failing based on defined criteria. Failing early via build failure lowers
    the costs, increases

    confidence in the software produced, and has the potential to morph subjective
    processes into an

    aggressive metrics-based process that the development team feels is unbiased.


    Jenkins is not just an automation server, it is also a vibrant and highly active
    community.

    Enlightened self-interest dictates participation.'
  - '[PAGE 18]


    # # What this book covers


    **Chapter 1, Getting Started with Jenkins**, covers how to install Jenkins 2.x
    on Windows, CentOs, Microsoft Azure, and AWS. There are important recipes that
    show how to install or upload plugins, how to configure Proxy, how to configure
    JENKINS_HOME and tools in Manage Jenkins. This chapter will also cover how to
    create freestyle jobs for Ant and Maven projects


    **Chapter 2, Management and Monitoring of Jenkins**, helps us understand master/agent
    architecture, how to manage Jenkins Build jobs using Eclipse, backing up and restoring
    Jenkins, command-line options in Jenkins using Jenkins CLI, managing disk usage,
    shutting down Jenkins safely, monitoring Jenkins, and configuring email notifications.


    **Chapter 3, Managing Security**, covers how to improve security with Jenkins
    configuration, configure Matrix-based Security and handle a Project-based Matrix
    Authorization Strategy. It will also cover Jenkins and its integration with OpenLDAP
    and Active Directory. Later in the chapter, we will cover Jenkins and OWASP Zed
    Attack Proxy Integration, finding 500 errors and XSS attacks in Jenkins through
    fuzzing, exploring the OWASP Dependency-Check plugin, and working with the Audit
    Trail plugin.


    **Chapter 4, Improve Code Quality**, explores the use of source code metrics.
    To save money and improve quality, you need to remove defects in the software
    life cycle as early as possible. This chapter covers details on how to integrate
    Jenkins with SonarQube, how to update center in SonarQube, quality gates, quality
    profiles and rules, verifying HTML, CSS, and JavaScript validity using SonarQube,
    verifying Java code using SonarQube, and configuring SonarQube as a Windows service.


    **Chapter 5, Building Applications in Jenkins**, details approaches to configuring
    Ant, Maven, and Android projects for execution, how to configure environment variables,
    running Groovy scripts through Maven, running Ant through Groovy in Maven, and
    remotely triggering jobs through the Jenkins API.


    **Chapter 6, Continuous Delivery**, discusses Continuous Delivery, how to archive
    artifacts, copying artifact from other build jobs, integrating Jenkins with Artifactory,
    deploying a WAR file from Jenkins to Tomcat, AWS Beanstalk, Azure App Services,
    and how to promote builds.


    **Chapter 7, Continuous Testing**, details Continuous Testing, how to publish
    unit testing reports from Jenkins, creating Selenium test cases using Eclipse,
    integrating Jenkins and Selenium for functional testing, Jenkins and Cucumber
    Test reports, creating load tests in Apache JMeter, executing load tests from
    Jenkins, reporting JMeter performance metrics, and testing with FitNesse.


    **Chapter 8, Orchestration**, explores orchestration of a pipeline, understanding
    upstream and downstream jobs, configuring upstream and downstream jobs, configuring
    a build pipeline, creating a pipeline job, using a sample pipeline for execution,
    configuring a pipeline job for end- to-end automation, and getting started with
    the Blue Ocean dashboard.


    **Chapter 9 , Jenkins UI Customization**, details skinning Jenkins with the simple
    themes plugin, skinning and provisioning Jenkins using a WAR overlay, generating
    a home page, creating HTML reports, efficient use of views, saving screen space
    with the Dashboard View plugin,'
