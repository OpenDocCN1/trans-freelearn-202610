    +   1. Create a Freestyle project with the project name `ch3.RunMe`.

    +   2. Check This Build is parameterized, select String Parameter, and add the
    following details:

    +      1. Name: `myvariable`

    +      2. DefaultValue: `Default`

    +      3. Description: `This is my example variable`

    +   3. Under the Build Triggers section, check Trigger builds remotely (for example,
    from scripts).

    +   4. In the Authentication Token textbox, add `changeme`.

    +   5. Click on the Save button.

    +   6. Click on the Build with Parameters link.

    +   7. You will be asked for the variable named `myvariable`. Click on Build.

    +   8. Visit your personal configuration page, such as http://localhost:8080/,
    where you replace `your_user` with your Jenkins username.

    +   9. In the API Token section, click on the Show API Token... button.

    +   10. Copy the token to `apiToken`.

    +   11. From a terminal console, run `wget` to log in and run the job remotely:

    +   12. Check the Jenkins job to verify that it has not run and returns a 405
    HTTP status code:

    +   13. From a terminal console, run `wget` to log in and run the job, returning
    a 201 HTTP status code:


    ```

