  - '[PAGE 129]


    # # Understanding master/agent architecture


    Jenkins supports the master/agent architecture. In master/agent architecture,
    we can install Jenkins on master and then utilize other agents for distributing
    the load.


    We shoulddelegate Jenkins jobs to agents for execution. This way, we can support
    multiple executions using different resources.


    There are specific scenarios where master/agent architecture is extremely useful,
    such as following:


    +   - The Jenkins machine has limited capacity; even with the higher capacity,
    there will be a time where it can''t fulfil all requests. By distributing the
    load on agent nodes, we can free resources available on the system where Jenkins
    is installed.

    +   - Different jobs require different kinds of resources, and they are restricted
    to specific machines only. In such a case, we can only utilize that machine and
    it is not possible to configure it on a system where Jenkins is installed, so
    it''s often better to utilize that machine as an agent.

    +   - Different operating systems are required or some tools work only in specific
    OS, so we can utilize those tools by making a system agent on which they are installed.

    +   - To avoid a single point of failure by installing each and every tool on
    the Jenkins machine.


    Murphy as a friend:


    You should assume the worst for all of the recipes in this book: aliens attacking,
    coffee on the motherboard, cats eating your cable, the cable eating the cat, and
    so on. Make sure that you are using a test Jenkins instance.'
  - '[PAGE 130]


    # # Getting ready


    The important thing here is we don''t install Jenkins on any agent nodes at all.
    We only install Jenkins on master and utilize that Jenkins for orchestrating master/agent
    architecture.


    Just to note: on whichever system we install Jenkins, it becomes the master. Just
    verify that by navigating to Manage Jenkins | Manage Nodes.


    +   1. Navigate to Manage Jenkins | Manage Nodes and click on New Node:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_130_0.png)


    +   2. Give the Node name and select Permanent Agent; click OK:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_130_1.png)'
  md: "\n## Configuring ANT_HOME in Jenkins\n\nJenkins is an open source automation\
    \ server that can be used to configure Continuous Integration for projects written\
    \ in many programming languages. Let's consider the case of an application that\
    \ is Java-based, and which has Ant as a build tool.\n\nWe need to tell Jenkins\
    \ where the Ant installable directory is available.\n\n### Getting ready\n\nDownload\
    \ the required Ant version or install automatically.\n\n### How it works...\n\n\
    When you create a build job in Jenkins and configure it, you need to specify the\
    \ Ant version that will be used by the build execution. You can use existing Ant\
    \ installation available on the system as well if you don't want to install automatically.\n\
    \n## Configuring MAVEN_HOME in Jenkins\n\nJenkins is an open source automation\
    \ server that can be used to configure Continuous Integration for projects written\
    \ in many programming languages. Let's consider the case of an application that\
    \ is Java-based and which has Maven as a build tool.\n\nWe need to tell Jenkins\
    \ where the Maven installable directory is available.\n\n### Getting ready\n\n\
    Download the required Maven version or install automatically.\n\n### How to do\
    \ it...\n\n- 1. Open the Jenkins dashboard.\n- 2. Go to Manage Jenkins.\n- 3.\
    \ Go to Global Tool Configuration to configure the tools, their locations, and\
    \ automatic installers.\n- 4. Go to the Maven section.\n- 5. Give the Name and\
    \ click on Install Automatically, or give the path to the existing location where\
    \ the Maven installation is available.\n- 6. You can give a logical name such\
    \ as `Maven 3.5.0` or `Maven 3.4.0` to identify the correct version while configuring\
    \ a build job:\n- 7. You can add multiple Mavens based on the version in Jenkins.\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_113_0.png)\n\n### How it works...\n\
    \nWhen you create a build job in Jenkins and configure it, you need to specify\
    \ the Maven version that will be used by the build execution. You can use existing\
    \ Maven installation available on the system as well if you don't want to install\
    \ automatically.\n\n## Configuring GRADLE_HOME in Jenkins\n\nJenkins is an open\
    \ source automation server that can be used to configure Continuous Integration\
    \ for projects written in many programming languages. Let's consider the case\
    \ of an application that is Android-based, and which has Gradle as a build tool.\n\
    \nWe need to tell Jenkins where the Gradle installable directory is available.\n\
    \n### Getting ready\n\nDownload the required Gradle version or install automatically.\n\
    \n### How to do it...\n\n- 1. Open the Jenkins dashboard.\n- 2. Go to Manage Jenkins.\n\
    - 3. Go to Global Tool Configuration to configure the tools, their locations,\
    \ and automatic installers.\n- 4. Go to the Gradle section.\n- 5. Give the Name\
    \ and click on Install Automatically,\n  or give the path to the existing location\
    \ where the Gradle installation is available.\n- 6. You can give a logical name\
    \ such as `Gradle 4.0.1` or `Gradle 4.0.0` to identify the correct version while\
    \ configuring a build job:\n- 7. You can add multiple Gradles based on the version\
    \ in Jenkins.\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_117_0.png)\n\n## Creating\
    \ a Freestyle job for Ant Project\n\nA build job is a basic execution unit in\
    \ Jenkins. We can perform many actions using build jobs. We can execute commands,\
    \ send notifications, configure Continuous Integration, and so on.\n\n### Getting\
    \ ready\n\nYou will need to configure tools based on the application, such as\
    \ Ant, Gradle, Java, Git, and so on.\n\n### How to do it...\n\n- 1. Open the Jenkins\
    \ dashboard.\n- 2. Click on New Item.\n- 3. Enter an item name.\n- 4. Select a\
    \ template Freestyle project.\n- 5. Click on OK:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_121_0.png)\n\
    \n- 6. Go to the Source Code Management section and select Git.\n- 7. Provide\
    \ the Repository URL.\n- 8. Provide Credentials, as demonstrated in the next screenshot:\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_121_1.png)\n\n- 9. In the Build section,\
    \ click on the Add build step and select Invoke Ant.\n- 10. Select the Ant name\
    \ based on our Global Tool Configuration.\n- 11. Provide Targets. In Ant, we can\
    \ give a target based on the targets defined in the build.xml file:\n- 12. Click\
    \ on Save.\n\n### How it works...\n\nWhen you go to the Build Job page and click\
    \ on Build now, it will execute the build based on the configuration.\n\n### Getting\
    \ ready\n\nYou will need to configure the tools based on the application, such\
    \ as Maven, Java, Git, and so on.\n\n### How to do it...\n\n- 1. Open the Jenkins\
    \ dashboard.\n- 2. Click on New Item.\n- 3. Enter an item name.\n- 4. Select a\
    \ template Maven project.\n- 5. Click on OK:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_126_0.png)\n\
    \n- 6. Go to the Source Code Management section and select Git.\n- 7. Provide\
    \ the Repository URL.\n- 8. Provide Credentials.\n- 9. In the Build section, the\
    \ Root POM name will be already available.\n- 10. Maven has its own set of goals\
    \ and we can execute any one of those goals based on requirements. These steps\
    \ are demonstrated in this next screenshot:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_126_1.png)\n\
    \n- 11. Click on Save.\n\n## Management and Monitoring of Jenkins\n\nIn this chapter,\
    \ we will cover the following recipes:\n\n- Understanding master/agent architecture\n\
    - Managing Jenkins Build jobs using Eclipse\n- Backing up and restoring Jenkins\n\
