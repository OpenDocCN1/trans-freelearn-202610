    \n- 9. 在 构建 部分，点击 添加构建步骤 并选择 调用 Ant。\n- 10. 根据我们的全局工具配置选择 Ant 名称。\n- 11. 提供目标。在\
    \ Ant 中，我们可以根据 build.xml 文件中定义的目标给出一个目标：\n- 12. 点击 保存。\n\n### 工作原理...\n\n当你进入构建作业页面并点击\
    \ 立即构建 时，它将根据配置执行构建。\n\n### 准备工作\n\n你需要根据应用程序配置工具，例如 Maven、Java、Git 等等。\n\n###\
    \ 如何操作...\n\n- 1. 打开 Jenkins 仪表盘。\n- 2. 点击 新建任务。\n- 3. 输入项目名称。\n- 4. 选择模板 Maven\
    \ project。\n- 5. 点击 确定：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_126_0.png)\n\
    \n- 6. 进入 源代码管理 部分并选择 Git。\n- 7. 提供 仓库 URL。\n- 8. 提供凭据。\n- 9. 在 构建 部分，Root POM\
    \ 名称将已可用。\n- 10. Maven 有自己的一套目标，我们可以根据需求执行其中任何一个目标。这些步骤在下一张截图中演示：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_126_1.png)\n\
    \n- 11. 点击 保存。\n\n## Jenkins 的管理和监控\n\n在本章中，我们将介绍以下配方：\n\n- 理解 master/agent 架构\n\
    - 使用 Eclipse 管理 Jenkins 构建作业\n- 备份和恢复 Jenkins\n- 使用 Jenkins CLI 的 Jenkins 命令行选项\n\
    - 从命令行修改 Jenkins 配置\n- 管理磁盘使用\n- 安全关闭 Jenkins\n- 使用 JavaMelody 监控 Jenkins\n- 使用\
    \ Build Monitor View 监控 Jenkins 作业\n- 配置邮件通知\n-  signaling the need to archive\n\
    \n### 理解 master/agent 架构\n\nJenkins 支持 master/agent 架构。在 master/agent 架构中，我们可以在\
    \ master 上安装 Jenkins，然后利用其他 agent 来分发负载。\n\n我们应该将 Jenkins 作业委托给 agent 执行。这样，我们就可以使用不同的资源支持多次执行。\n\
    \nmaster/agent 架构在以下特定场景中非常有用，例如：\n\n- Jenkins 机器容量有限；即使容量更高，也会有无法满足所有请求的时候。通过将负载分发到\
    \ agent 节点，我们可以释放 Jenkins 安装系统上可用的资源。\n- 不同作业需要不同种类的资源，并且仅限于特定机器。在这种情况下，我们只能利用该机器，并且不可能在\
    \ Jenkins 安装的系统上配置它，因此最好将该机器用作 agent。\n- 需要不同的操作系统或某些工具仅在特定操作系统中工作，因此我们可以通过在安装了这些工具的系统上创建\
    \ agent 来利用这些工具。\n- 通过不在 Jenkins 机器上安装每一个工具来避免单点故障。\n\nMurphy 作为朋友：\n\n你应该为本书中的所有配方假设最坏的情况：外星人攻击、咖啡洒在主板上、猫吃掉你的电缆、电缆吃掉猫等等。确保你使用的是测试\
    \ Jenkins 实例。\n\n### 准备工作\n\n这里重要的是我们根本不在任何 agent 节点上安装 Jenkins。我们只在 master 上安装\
    \ Jenkins 并利用该 Jenkins 来编排 master/agent 架构。\n\n仅供参考：在我们安装 Jenkins 的任何系统上，它都成为\
    \ master。只需通过导航到 管理 Jenkins | 管理节点 来验证。\n\n- 1. 导航到 管理 Jenkins | 管理节点 并点击 新建节点：\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_130_0.png)\n\n- 2. 输入节点名称并选择 永久代理；点击\
    \ 确定：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_130_1.png)\n\n"
