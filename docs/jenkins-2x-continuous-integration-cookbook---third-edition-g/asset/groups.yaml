    ## About the Authors


    **Mitesh Soni** is an avid learner with 10 years of experience in the IT industry.
    He is an SCJP, SCWCD, VCP, IBM UrbanCode, and IBM Bluemix certified professional
    and Certified Scrum Master. He loves DevOps and cloud computing and he also has
    an interest in programming in Java. He finds design patterns fascinating. He believes
    a picture is worth a thousand words.


    He occasionally contributes to etutorialsworld.com. He loves to play with kids,
    fiddle with his camera, and take photographs at Indroda Park. He is addicted to
    taking pictures without knowing many technical details. He lives in the capital
    of Mahatma Gandhi''s home state.


    Mitesh has also authored the following books with Packt:


    - Jenkins Essentials, Second Edition

    - DevOps Bootcamp

    - Implementing DevOps with Microsoft Azure

    - DevOps for Web Development

    - Jenkins Essentials

    - Learning Chef


    > "I''ve missed more than 9,000 shots in my career. I''ve lost almost 300 games.
    26 times, I''ve been trusted to take the game-winning shot and missed. I''ve failed
    over and over and over again in my life. And that is why I succeed."

    >

    > — Michael Jordan.


    **Alan Mark Berg**, BSc, MSc, PGCE, has been the lead developer at Central Computer
    Services at the University of Amsterdam since 1998. He is currently working in
    an Innovation Work Group that accelerates the creation of new and exciting services.
    In his famously scarce spare time, he writes. Alan has a bachelor''s degree, two
    master''s degrees, a teaching qualification, and quality assurance certifications.
    He has also coauthored two Packt Publishing books about Sakai (http://sakaiproject.org),
    a highly successful open source learning management platform used by millions
    of students around the world. He has won a couple of awards, including the Sakai
    Fellowship and Teaching With Sakai Innovation Award (TWSIA).


    Alan enjoys working with talent; this forces him to improve his own competencies.
    This motivation is why Alan enjoys working in energetic, open source communities
    of interest. At the time of writing, he is on the board of directors of the Apereo
    Foundation and is the community officer for its Learning Analytics Initiative
    (https://confluence.sakaiproject.org/display/LAI/Learning+Analytics+Initiative).


    In previous incarnations, Alan was a QA director, a technical writer, an Internet/Linux
    course writer, a product line development officer, and a teacher. He likes to
    get his hands dirty with building, gluing systems, exploring data, and turning
    it into actionable information. He remains agile by ruining various development
    and acceptance environments and generally rampaging through the green fields of
    technological opportunity.


    ## About the Reviewers


    **Juan Vicente Herrera Ruiz de Alejo** has a degree in computer science. He is
    the leader of the Madrid DevOps meetup. He is the teacher of DevOps master''s
    program at Alcala de Henares University in Madrid and has been working in IT companies
    for the past 12 years.


    He also works as a volunteer at an NGO dedicated to fighting breast cancer.


    He is currently working for Logtrust.com and has worked for companies such as
    Colt telecom, Everis, and BBVA.


    _I would like to thank my wife, Emma, and my entire family for all their support._


    **Javier Delgado** is an automation fanatic, continuous tasks (inspection, testing,
    and delivery) evangelist, and perpetual new-knowledge addict.


    He works as a continuous delivery expert at ING Bank NV.


