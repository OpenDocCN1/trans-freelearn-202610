    \ better to utilize that machine as an agent.\n- Different operating systems are\
    \ required or some tools work only in specific OS, so we can utilize those tools\
    \ by making a system agent on which they are installed.\n- To avoid a single point\
    \ of failure by installing each and every tool on the Jenkins machine.\n\nMurphy\
    \ as a friend:\n\nYou should assume the worst for all of the recipes in this book:\
    \ aliens attacking, coffee on the motherboard, cats eating your cable, the cable\
    \ eating the cat, and so on. Make sure that you are using a test Jenkins instance.\n\
    \n### Getting ready\n\nThe important thing here is we don't install Jenkins on\
    \ any agent nodes at all. We only install Jenkins on master and utilize that Jenkins\
    \ for orchestrating master/agent architecture.\n\nJust to note: on whichever system\
    \ we install Jenkins, it becomes the master. Just verify that by navigating to\
    \ Manage Jenkins | Manage Nodes.\n\n- 1. Navigate to Manage Jenkins | Manage Nodes\
    \ and click on New Node:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_130_0.png)\n\
    \n- 2. Give the Node name and select Permanent Agent; click OK:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_130_1.png)\n"
