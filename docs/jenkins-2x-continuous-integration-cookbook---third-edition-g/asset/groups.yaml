  md: "\n# See also\n\n- The *Running Ant through Groovy in Maven* recipe\n\n# Running\
    \ Ant through Groovy in Maven\n\nJenkins interacts with an audience with a wide\
    \ technological background. There are many developers who became proficient in\
    \ Ant scripting before moving on to using Maven, developers who might be happier\
    \ with writing an Ant task than editing a pom.xml file. There are mission-critical\
    \ Ant scripts that still run in a significant proportion of organizations.\n\n\
    In Maven, you can run Ant tasks directly with the AntRun plugin (http://maven.apache.org/plugins/maven-antrun-plugin/),\
    \ or through Groovy (http://docs.codehaus.org/display/GROOVY/Using+Ant+from+Groovy).\
    \ AntRun represents a natural migration path. This is the path of least initial\
    \ work.\n\nThe Groovy approach makes sense for Jenkins administrators who use\
    \ Groovy as part of their tasks. Groovy, being a first-class programming language,\
    \ has a wide range of control structures that are hard to replicate in Ant. You\
    \ can partially do this by using the Ant-contrib library (http://ant-contrib.sourceforge.net).\
    \ However, Groovy, as a feature-rich programming language, is much more expressive.\n\
    \nThis recipe details how you can run two Maven POMs involving Groovy and Ant.\
    \ The first POM shows you how to run the simplest of Ant tasks within Groovy,\
    \ and the second performs an Ant-Contrib task to securely copy files from a large\
    \ number of computers.\n\n# Getting ready\n\nCreate a directory named `ch3.building_software/antbuilder`.\n\
    \n## How to do it...\n\n- 1. Create a template file and name it `pom_ant_simple.xml`.\n\
    - 2. Change the values of `groupId`, `artifactId`, `version`, and `name` to suit\
    \ your preferences.\n- 3. Add the following XML fragment just before the `</project>`\
    \ tag:\n\n```xml\n<build>\n  <plugins><plugin>\n    <groupId>org.codehaus.gmaven</groupId>\n\
    \    <artifactId>gmaven-plugin</artifactId>\n    <version>1.3</version>\n    <executions>\n\
    \      <execution>\n        <id>run-myGroovy-test</id>\n        <goals><goal>execute</goal></goals>\n\
    \        <phase>test</phase>\n        <configuration>\n          <source>\n  \
    \          def ant = new AntBuilder()\n            ant.echo(\"\\n\\nTested ---->\
    \ With Groovy\")\n          </source>\n        </configuration>\n      </execution>\n\
    \      <execution>\n        <id>run-myGroovy-verify</id>\n        <goals><goal>execute</goal></goals>\n\
    \        <phase>verify</phase>\n        <configuration>\n          <source>\n\
    \            def ant = new AntBuilder()\n            ant.echo(\"\\n\\nVerified\
    \ at ${new Date()}\")\n          </source>\n        </configuration>\n      </execution>\n\
    \    </executions>\n  </plugin></plugins>\n</build>\n```\n\n- 4. Run `mvn test\
    \ -f pom_ant_simple.xml`. Review the output (note that there are no warnings about\
    \ empty JAR files):\n- 5. Run `mvn verify -f pom_ant_simple.xml`. Review the output;\
    \ it should look similar to the following screenshot:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_354_0.png)\n\
    \n- 4. Create a second template file named `pom_ant_contrib.xml`.\n- 5. Change\
    \ the values of `groupId`, `artifactId`, `version`, and `name` to suit your preferences.\n\
    - 6. Add the following XML fragment just before the `</project>` tag:\n\n```xml\n\
    <build>\n<plugins><plugin>\n<groupId>org.codehaus.gmaven</groupId>\n<artifactId>gmaven-plugin</artifactId>\n\
    <version>1.3</version>\n<executions>\n<id>run-myGroovy</id>\n<goals><goal>execute</goal></goals>\n\
    <phase>verify</phase>\n<configuration>\n<source>\ndef ant = new AntBuilder()\n\
    host=\"Myhost_series\"\nprint \"user: \"\nuser = new String(System.console().readPassword())\n\
    print \"password: \"\npw = new String(System.console().readPassword())\n\nfor\
    \ ( i in 1..920) {\n  counterStr=String.format('%02d',i)\n  ant.scp(trust:'true',file:\"\
    ${user}:${pw}@${host}${counterStr}:/${full_path_to_loca\n\nlocalTofile:\"${myfile}-${counterStr}\"\
    , verbose:\"true\")\n}\n</source>\n</configuration>\n</execution>\n</executions>\n\
    <dependencies>\n<dependency>\n<groupId>ant</groupId>\n<artifactId>ant</artifactId>\n\
    <version>1.6.5</version>\n</dependency>\n<dependency>\n```\n\n```xml\n<groupId>ant</groupId>\n\
    <artifactId>ant-launcher</artifactId>\n<version>1.6.5</version>\n</dependency>\n\
    <dependency>\n<groupId>ant</groupId>\n<artifactId>ant-jsch</artifactId>\n<version>1.6.5</version>\n\
    </dependency>\n<dependency>\n<groupId>com.jcraft</groupId>\n<artifactId>jsch</artifactId>\n\
    <version>0.1.42</version>\n</dependency>\n</dependencies>\n</plugin></plugins>\n\
    </build>\n```\n\nThis is only representative code, unless you have set it up to\
    \ point to real files on real servers:\n\n```text\nmvn verify -f pom_ant_simple.xml\
    \ will fail\n```\n\n# How it works...\n\nGroovy runs basic Ant tasks without the\
    \ need for extra dependencies. An `AntBuilder` instance (http://groovy.codehaus.org/Using+Ant+Libraries+with+AntBuilder)\
    \ is created and then the Ant echo task is called. Under the bonnet, Groovy calls\
    \ the Java classes that Ant uses to perform the `echo` command. Within the `echo`\
    \ command, a date is printed by directly creating an anonymous object:\n\n```\n\
    ant.echo(\"\\n\\nVerified at ${new Date()}\").\n```\n\nYou configured the `pom.xml`\
    \ file to fire off the Groovy scripts in two phases: the test phase, and then\
    \ later in the verify phase. The test phase occurs before the generation of a\
    \ JAR file, and thus avoids creating a warning about an empty JAR file. As the\
    \ name suggests, this phase is useful for testing before packaging.\n\nThe second\
    \ example script highlights the strength of combining Groovy with Ant. The SCP\
    \ task (http://ant.apache.org/manual/Tasks/scp.html) is run many times across\
    \ many servers. The script first asks for the username and password, avoiding\
    \ storage on your filesystem or your revision control system. The Groovy script\
    \ expects you to inject the `host`, `full_path_to_location`, and `myfile` variables.\n\
    \nObserve the similarity between the Ant SCP task and the way it is expressed\
    \ in the `pom_ant_contrib.xml` file.\n\n# There's more...\n\nAnother example of\
    \ running Ant through Groovy is the creation of custom property files on the fly.\
    \ This allows you to pass on information from one Jenkins job to another.\n\n\
    You can create property files through AntBuilder using the echo task. The following\
    \ lines of code create a value.properties file with two lines, x=1 and y=2:\n\n\
    ```\ndef ant = new AntBuilder()\nant.echo(message: \"x=1\\n\", append: \"false\"\
    , file: \"values.properties\")\nant.echo(message: \"y=2\\n\", append: \"true\"\
    , file: \"values.properties\")\n```\n\nThe first echo command sets append to false,\
    \ so that every time a build occurs, a new properties file is created. The second\
    \ echo appends its message.\n\nYou can remove the second append attribute as the\
    \ default value is set to true.\n\n# Getting ready\n\nCreate a directory named\
    \ `ch3.building_software/jsp_example`.\n\n```html\n</html>\n```\n\n- 6. Create\
    \ a WAR file by using the `mvn package` command.\n- 7. Modify `./src/main/webapp/index.jsp`\
    \ by adding `if (evilInput==null)` underneath the line starting with `if`, so\
    \ that it is no longer a valid JSP file.\n- 8. Run the `mvn package` command.\
    \ The build will now fail with the following error message:\n\n```text\n[ERROR]\
    \ Failed to execute goal org.mortbay.jetty:maven-jetty-jspc-\nplugin:6.1.14:jspc\
    \ (jspc) on project jsp_example: Failure processing jsps ->\n[Help 1]\n```\n\n\
    ## How it works...\n\nYou created a template project using an archetype.\n\nThe\
    \ Maven plugin, upon seeing the `index.jsp` page, compiles it into a class with\
    \ the name `jsp.index_jsp`, placing the compiled class under `WEB-INF/classes`.\
    \ The plugin then defines the class as a servlet in `WEB-INF/web.xml` with a mapping\
    \ to `/index.jsp`. Let's take a look at the following example:\n\n```xml\n<servlet>\n\
    <servlet-name>jsp.index_jsp</servlet-name>\n<servlet-class>jsp.index_jsp</servlet-class>\n\
    </servlet>\n\n<servlet-mapping>\n<servlet-name>jsp.index_jsp</servlet-name>\n\
    <url-pattern>/index.jsp</url-pattern>\n</servlet-mapping>\n```\n\nThe list of\
    \ archetypes is increasing over time. You can find the full list at [http://maven-repository.com/archetypes](http://maven-repository.com/archetypes).\
    \ If you are running Ubuntu, you will find a local XML catalog listing all the\
    \ archetypes named `archetype-catalog.xml` in the `~/.m2` directory.\n"
  mdcn: "\n# 另请参阅\n\n-   *《在 Maven 中通过 Groovy 运行 Ant》*配方\n\n# 在 Maven 中通过 Groovy 运行\
    \ Ant\n\nJenkins 所面向的用户具有广泛的技术背景。许多开发者在转向使用 Maven 之前就已精通 Ant 脚本编写，他们可能更乐于编写 Ant\
    \ 任务，而不是编辑 pom.xml 文件。在相当一部分组织中，仍然运行着关键业务的 Ant 脚本。\n\n在 Maven 中，你可以直接使用 AntRun\
    \ 插件（http://maven.apache.org/plugins/maven-antrun-plugin/）或通过 Groovy（http://docs.codehaus.org/display/GROOVY/Using+Ant+from+Groovy）来运行\
    \ Ant 任务。AntRun 代表了一条自然的迁移路径，也是初期工作最少的路径。\n\n对于将 Groovy 作为任务一部分的 Jenkins 管理员来说，Groovy\
    \ 方法很有意义。作为一种一流的编程语言，Groovy 拥有许多 Ant 难以复制的控制结构。你可以使用 Ant-contrib 库（http://ant-contrib.sourceforge.net）来部分实现这些控制结构。然而，作为一种功能丰富的编程语言，Groovy\
    \ 的表达能力要强得多。\n\n本配方详细介绍了如何运行两个涉及 Groovy 和 Ant 的 Maven POM 文件。第一个 POM 展示了如何在 Groovy\
    \ 中运行最简单的 Ant 任务，第二个 POM 则执行一个 Ant-Contrib 任务，以安全地从大量计算机复制文件。\n\n# 准备工作\n\n创建一个名为\
    \ `ch3.building_software/antbuilder` 的目录。\n\n# 如何操作...\n\n- 1. 创建一个模板文件并将其命名为\
    \ `pom_ant_simple.xml`。\n- 2. 将 `groupId`、`artifactId`、`version` 和 `name` 的值改为适合你的值。\n\
    - 3. 在 `</project>` 标签之前添加以下 XML 片段：\n\n```xml\n<build>\n  <plugins><plugin>\n\
    \    <groupId>org.codehaus.gmaven</groupId>\n    <artifactId>gmaven-plugin</artifactId>\n\
    \    <version>1.3</version>\n    <executions>\n      <execution>\n        <id>run-myGroovy-test</id>\n\
    \        <goals><goal>execute</goal></goals>\n        <phase>test</phase>\n  \
    \      <configuration>\n          <source>\n            def ant = new AntBuilder()\n\
    \            ant.echo(\"\\n\\nTested ----> With Groovy\")\n          </source>\n\
    \        </configuration>\n      </execution>\n      <execution>\n        <id>run-myGroovy-verify</id>\n\
    \        <goals><goal>execute</goal></goals>\n        <phase>verify</phase>\n\
    \        <configuration>\n          <source>\n            def ant = new AntBuilder()\n\
    \            ant.echo(\"\\n\\nVerified at ${new Date()}\")\n          </source>\n\
    \        </configuration>\n      </execution>\n    </executions>\n  </plugin></plugins>\n\
    </build>\n```\n\n- 4. 运行 `mvn test -f pom_ant_simple.xml`。查看输出（注意不会出现关于空 JAR 文件的警告）：\n\
    - 5. 运行 `mvn verify -f pom_ant_simple.xml`。查看输出，它应该类似于以下截图：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_354_0.png)\n\
    \n- 4. 创建第二个模板文件并将其命名为 `pom_ant_contrib.xml`。\n- 5. 将 `groupId`、`artifactId`、`version`\
    \ 和 `name` 的值改为适合你的值。\n- 6. 在 `</project>` 标签之前添加以下 XML 片段：\n\n```xml\n<build>\n\
    <plugins><plugin>\n<groupId>org.codehaus.gmaven</groupId>\n<artifactId>gmaven-plugin</artifactId>\n\
    <version>1.3</version>\n<executions>\n<id>run-myGroovy</id>\n<goals><goal>execute</goal></goals>\n\
    <phase>verify</phase>\n<configuration>\n<source>\ndef ant = new AntBuilder()\n\
    host=\"Myhost_series\"\nprint \"user: \"\nuser = new String(System.console().readPassword())\n\
    print \"password: \"\npw = new String(System.console().readPassword())\n\nfor\
    \ ( i in 1..920) {\n  counterStr=String.format('%02d',i)\n  ant.scp(trust:'true',file:\"\
    ${user}:${pw}@${host}${counterStr}:/${full_path_to_loca\n\nlocalTofile:\"${myfile}-${counterStr}\"\
    , verbose:\"true\")\n}\n</source>\n</configuration>\n</execution>\n</executions>\n\
    <dependencies>\n<dependency>\n<groupId>ant</groupId>\n<artifactId>ant</artifactId>\n\
    <version>1.6.5</version>\n</dependency>\n<dependency>\n```\n\n```xml\n<groupId>ant</groupId>\n\
    <artifactId>ant-launcher</artifactId>\n<version>1.6.5</version>\n</dependency>\n\
    <dependency>\n<groupId>ant</groupId>\n<artifactId>ant-jsch</artifactId>\n<version>1.6.5</version>\n\
    </dependency>\n<dependency>\n<groupId>com.jcraft</groupId>\n<artifactId>jsch</artifactId>\n\
    <version>0.1.42</version>\n</dependency>\n</dependencies>\n</plugin></plugins>\n\
    </build>\n```\n\n这只是示例代码，除非你已将其设置为指向真实服务器上的真实文件：\n\n```text\nmvn verify -f pom_ant_simple.xml\
    \ will fail\n```\n\n# 工作原理...\n\nGroovy 无需额外依赖即可运行基本的 Ant 任务。系统会创建一个 `AntBuilder`\
    \ 实例（http://groovy.codehaus.org/Using+Ant+Libraries+with+AntBuilder），然后调用 Ant\
    \ 的 echo 任务。在底层，Groovy 会调用 Ant 用于执行 `echo` 命令的 Java 类。在 `echo` 命令中，通过直接创建一个匿名对象来打印日期：\n\
    \n```\nant.echo(\"\\n\\nVerified at ${new Date()}\").\n```\n\n你将 `pom.xml` 文件配置为在两个阶段触发\
    \ Groovy 脚本：test 阶段，以及随后的 verify 阶段。test 阶段发生在生成 JAR 文件之前，因此避免了创建空 JAR 文件的警告。顾名思义，该阶段适用于打包前的测试。\n\
    \n第二个示例脚本凸显了 Groovy 与 Ant 结合的优势。SCP 任务（http://ant.apache.org/manual/Tasks/scp.html）在多台服务器上被多次运行。脚本首先要求输入用户名和密码，避免将其存储在文件系统或版本控制系统中。Groovy\
    \ 脚本需要你注入 `host`、`full_path_to_location` 和 `myfile` 变量。\n\n请注意 Ant SCP 任务与其在 `pom_ant_contrib.xml`\
    \ 文件中的表达方式之间的相似性。\n\n# 更多内容...\n\n通过 Groovy 运行 Ant 的另一个示例是即时创建自定义属性文件。这允许你将信息从一个\
    \ Jenkins 任务传递到另一个任务。\n\n你可以通过 AntBuilder 使用 echo 任务创建属性文件。以下代码行创建一个包含两行（x=1 和\
    \ y=2）的 value.properties 文件：\n\n```\ndef ant = new AntBuilder()\nant.echo(message:\
    \ \"x=1\\n\", append: \"false\", file: \"values.properties\")\nant.echo(message:\
    \ \"y=2\\n\", append: \"true\", file: \"values.properties\")\n```\n\n第一个 echo\
    \ 命令将 append 设置为 false，因此每次构建时都会创建一个新的属性文件。第二个 echo 命令则追加其消息。\n\n你可以移除第二个 append\
    \ 属性，因为其默认值为 true。\n\n# 准备工作\n\n创建一个名为 `ch3.building_software/jsp_example` 的目录。\n\
    \n```html\n</html>\n```\n\n- 6. 使用 `mvn package` 命令创建 WAR 文件。\n- 7. 通过在以 `if`\
    \ 开头的行下方添加 `if (evilInput==null)` 来修改 `./src/main/webapp/index.jsp`，使其不再是一个有效的\
    \ JSP 文件。\n- 8. 运行 `mvn package` 命令。现在构建将失败，并显示以下错误消息：\n\n```text\n[ERROR] Failed\
    \ to execute goal org.mortbay.jetty:maven-jetty-jspc-\nplugin:6.1.14:jspc (jspc)\
    \ on project jsp_example: Failure processing jsps ->\n[Help 1]\n```\n\n# 工作原理...\n\
    \n你使用一个原型（archetype）创建了一个模板项目。\n\nMaven 插件在检测到 `index.jsp` 页面后，会将其编译成一个名为 `jsp.index_jsp`\
    \ 的类，并将编译后的类放在 `WEB-INF/classes` 下。随后，插件会在 `WEB-INF/web.xml` 中将该类定义为 servlet，并映射到\
    \ `/index.jsp`。让我们看下面的示例：\n\n```xml\n<servlet>\n<servlet-name>jsp.index_jsp</servlet-name>\n\
    <servlet-class>jsp.index_jsp</servlet-class>\n</servlet>\n\n<servlet-mapping>\n\
    <servlet-name>jsp.index_jsp</servlet-name>\n<url-pattern>/index.jsp</url-pattern>\n\
    </servlet-mapping>\n```\n\n原型（archetype）列表会随时间不断增长。你可以在 [http://maven-repository.com/archetypes](http://maven-repository.com/archetypes)\
    \ 找到完整列表。如果你运行的是 Ubuntu，你会在 `~/.m2` 目录下找到一个名为 `archetype-catalog.xml` 的本地 XML\
    \ 目录文件，其中列出了所有原型。\n"
