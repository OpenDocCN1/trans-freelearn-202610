    ## Configuring an Android project for execution


    You have already created a Freestyle project in Jenkins in [Chapter 1](#), *getting
    Started with Jenkins*, in the recipe *Creating a Freestyle Job for an Ant project*.
    You need to create Freestyle project for an Android project.


    ## Getting ready


    You can use Android Lint for static code analysis. Before configuring Continuous
    Integration, install the required plugins.


    Go to Jenkins dashboard | Manage Jenkins | ManagePlugins | Available


    Install the Android Lint plugin:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_338_0.png)


    Wait until the plugin has been installed successfully:


    # Installing Plugins/Upgrades


    Preparation


    - Checking internet connectivity

    - Checking update center connectivity

    - Success


    - Static Analysis Utilities — Success

    - Android Lint Plugin — Success


    - [Go back to the top page](#) (you can start using the installed plugins right
    away)

    - Restart Jenkins when installation is complete and no jobs are running


    Go to Jenkins dashboard | Manage Jenkins | Global Tool Configuration | Gradle
    | Add Gradle, as shown in this screenshot:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_338_1.png)


    Go to Jenkins dashboard | Manage Jenkins|Configure system | Global properties
    | Environment variables.


    Provide the Android SDK path for `ANDROID_HOME`:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_339_0.png)


    Now, you can configure the Android build and code analysis using Lint and publish
    the Android Lint results in Jenkins.


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_342_0.png)


    5. To analyze the code with Android Lint, use lint in the Tasks bar:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_342_1.png)


    6. Publish Android Lint results from Post-build Actions, as demonstrated in the
    following screenshot:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_343_0.png)


    7. In this way, we can configure Ant, Maven, and Android projects for Continuous
    Integration or execution to create a package file that we can distribute or deploy.


    ## Manipulating environmental variables


    This recipe shows you how to pass variables from Jenkins to your build job, and
    how different variables are overwritten. It also describes one way of failing
    the build if crucial information has not been correctly passed.


    In a typical development/acceptance/production environment, you will want to keep
    the same `pom.xml` files, but pass different configurations. One example is the
    extension names of property files such as `.dev`, `.acc`, and `.prd`. You would
    want to fail the build if critical configuration values are missing due to human
    error.


    Jenkins has a number of plugins for passing information to builds, including the
    EnvFile plugin ([https://wiki.jenkins-ci.org/display/JENKINS/Envfile+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/Envfile+Plugin))
    and the EnvInject plugin ([https://wiki.jenkins-ci.org/display/JENKINS/EnvInject+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/EnvInject+Plugin)).
    The EnvInject plugin was chosen for this recipe as it is reported to work with
    nodes and offers a wide range of property injection options.


    ### How to do it...


    1. Create a `pom.xml` file that is readable by Jenkins with the following lines
    of code:


    ```

    ```xml

    <project xmlns="http://maven.apache.org/POM/4.0.0"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    xsi:schemaLocation="http://maven.apache.org/POM/4.0.0

    http://maven.apache.org/maven-v4_0_0.xsd">

    <modelVersion>4.0.0</modelVersion>

    <groupId>org.berg</groupId>

    <artifactId>ch3.jenkins.builds.properties</artifactId>

    <version>1.0-SNAPSHOT</version>

    <name>${project.name}</name>

    <properties><project.build.sourceEncoding>UTF8</project.build.sourceEncoding>

    </properties>

    <build>

    <plugins><plugin>

    <groupId>org.codehaus.gmaven</groupId>

    <artifactId>gmaven-plugin</artifactId>

    <version>1.3</version>

    <executions>

    <execution>

    <id>run-myGroovy</id>

    <goals><goal>execute</goal></goals>

    <phase>verify</phase>

    <configuration>

    <source>

    def environment = System.getenv()

    println "---Environment"

    environment.each{println it }

    println "---Property"

    println(System.getProperty("longname"))

    println "---Project and session"

    println "Project: ${project.class}"

    println "Session: ${session.class}"

    println "longname: ${project.properties.longname}"

    println "Project name: ${project.name}"

    println "JENKINS_HOME: ${project.properties.JENKINS_HOME}"

    </source>

    </configuration>

    </execution></executions>

    </plugin></plugins>

    </build>

    </project>

    ```

    ```


    2. Create a file named `my.properties` and place it in the same directory as the
    `pom.xml` file. Then, add the following lines of code in the `my.properties` file:


    ```

    ```properties

    project.type=prod

    secrets.file=/etc/secrets

    enable.email=true

    JOB_URL=I AM REALLY NOT WHAT I SEEM

    ```

    ```


    3. Create a blank Freestyle job with the job name `ch3.environment`.


    4. In the Source Code Management section, check File System and add a fully qualified
    path for your directory, such as `/var/lib/jenkins/cookbook/ch3.building_software/environment`,
    in the Path field.


    5. In the Build section, select Add a build step for Invoke top-level Maven targets.
    In the newly expanded section, add the following details:


    ```

    ```text

    Maven version: 3.2.1

    Goals: verify

    ```

    ```


    6. Click on the Advanced button and type `longname=SuperGood` in Properties.


    ### How it works...


    The EnvInject plugin is useful for injecting properties into a build.


    During the recipe, Maven is run twice. The first time, it is run without the `name.from.jenkins`
    variable defined, and the Jenkins job fails. The second time, it is run with the
    variable defined, and the Jenkins job now succeeds.


    Maven expects that the `name.from.jenkins` variable is defined, or the name of
    the project will also not be defined. Normally, this would not be enough to stop
    your job succeeding. However, when running the Groovy code, the `println "Project
    name: ${project.name}"` line, specifically the `project.name` call, will fail
    the build. This is great for protecting against missing property values.


    The Groovy code can see instances of the `org.apache.Maven.model.Model` project
    and the `org.apache.Maven.execution.MavenSession` class. The project instance
    is a model of the XML configuration that you can programmatically access. You
    can get the longname property by referencing it through `project.properties.longname`.
    Your Maven goal will fail if the property does not exist. You can also get to
    the property through the `System.getProperty("longname")` call. However, you cannot
    get to the property by using the `System.getenv()` environment call.


    It is well worth learning the various options:


    - **Keep Jenkins environment variables and keep Jenkins build variables:** Both
    these options affect the Jenkins-related variables that your job sees. It is good
    to keep your environment as clean as possible as it will aid you in debugging
    later.

    - **Properties content:** You can override specific values in the properties files.

    - **Environment script file path:** This option points to a script that will set
    up your environment. This is useful if you want to detect specific details of
    the running environment and configure your build accordingly.

    - **Populate build cause:** You enable Jenkins to set the `BUILD_CAUSE` environment
    variable. The variable contains information about the event that triggered the
    job.


    ### There''s more...


    Maven has a plugin for reading properties (http://mojo.codehaus.org/properties-maven-plugin/).
    To choose between property files, you will need to set a variable in the plugin
    configuration and call it as part of the Jenkins job, as follows:


    ```

    <build>

    <plugins>

    <plugin>

    <groupId>org.codehaus.mojo</groupId>

    <artifactId>properties-maven-plugin</artifactId>

    <version>1.0-alpha-2</version>

    <executions>

    <execution>

    <phase>initialize</phase>

    <goals>

    <goal>read-project-properties</goal>

    </goals>

    <configuration>

    <files>

    <file>${fullpath.to.properties}</file>

    </files>

    </configuration>

    </execution>

    </executions>

    </plugin>

    </plugins>

    </build>

    ```


    If you use a relative path to the `properties` file, then the file can reside
    in your source code. If you use a full path, then the `properties` file can be
    stored on the Jenkins server. The second option is preferable if sensitive passwords,
    such as those for database connections, are included.


    Jenkins has the ability to ask for variables when you run a job manually. This
    is called a parameterized build (https://wiki.jenkins-ci.org/display/JENKINS/Parameterized+Build).
    At build time, you can choose your property files by selecting from a choice of
    property file locations.

