    \n然而，如果你能可视化你配置的上游和下游作业的执行流程会更有用。\n\n构建流水线插件可基于上游和下游作业的配置对执行流程进行可视化。\n\n## 准备工作\n\
    \n从 Manage Jenkins | Manage Plugins 安装插件：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_499_0.png)\n\
    \n验证 Build Pipeline Plugin 是否成功安装：\n\n# Installing Plugins/Upgrades\n\nPreparation\n\
    \n- Checking internet connectivity\n- Checking update center connectivity\n- Success\n\
    \n- TestNG Results Plugin  Success\n- promoted builds plugin  Success\n- Run Condition\
    \ Plugin  Success\n- Conditional BuildStep  Success\n- Parameterized Trigger plugin\
    \  Success\n- Build Pipeline Plugin  Success\n\nGo back to the top page\n(you\
    \ can start using the installed plugins right away)\n\nRestart Jenkins when installation\
    \ is complete and no jobs are running\n\n现在，你可以创建构建流水线并使用初始作业进行配置。\n\n## 如何操作...\n\
    \n- 1. 进入 Jenkins 仪表盘并点击标签页上方的 + 号。\n- 2. 提供 View 名称并选择 Build Pipeline View。\n\
    - 3. 点击 Save：\n\n## Jenkins\n\nOpen Blue Ocean\n\nsearch\n\nadmin | log out\n\n\
    - New Item\n- People\n- Build History\n- Project Relationship\n- Check File Fingerprint\n\
    - Manage Jenkins\n- My Views\n- Disk Usage\n- Credentials\n\nView name\n\nPetClinic\n\
    \nBuild Pipeline View\nShows the jobs in a build pipeline view. The complete pipeline\
    \ of jobs that a version propagates through are shown as a row in the view.\n\n\
    Dashboard\nCustomizable view that contains various portlets containing information\
    \ about your job(s)\n\nList View\nShows items in a simple list format. You can\
    \ choose which jobs are to be displayed in which view.\n\nMy View\nThis view automatically\
    \ displays all the jobs that the current user has an access to.\n\nOK\n\nBuild\
    \ Queue\nNo builds in the queue.\n\nBuild Executor Status\n\n4. 验证 Layout 是否配置为\
    \ Based on upstream/downstream relationship。\n\n5. 你希望以 PetClinic-code 作为第一个作业执行并从该作业开始可视化，因此在\
    \ Select Initial Job 中选择它：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_502_0.png)\n\
    \n- 6. 根据你的需求选择其余配置。\n- 7. 将 No Of Displayed Builds 从 1 改为 3，以便显示最近执行的三个构建流水线。\n\
    - 8. 点击 OK：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_502_1.png)\n\n9. 在 Jenkins\
    \ 仪表盘中验证 Build Pipeline 视图：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_503_0.png)\n\
    \nBuild Pipeline in Initial Phase\n\n10. 如果你希望即使某些构建不稳定也继续执行流水线怎么办？在这种情况下，你需要在\
    \ Post-build Actions 中选择 Trigger even if the build is unstable 选项，如以下屏幕截图所示：\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_503_1.png)\n\n11. 在 Build Pipeline\
    \ 视图中点击 run。等待整个流水线执行完毕：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_504_0.png)\n\
    \n## Successful Build Pipeline Execution\n\n12. 完成。这就是如何为不同的构建作业创建执行序列并实现应用程序生命周期管理的端到端自动化。在下一个配方中，你将使用\
    \ pipeline as a code 功能实现类似的事情。\n\n## 创建流水线作业\n\n在流水线中，你对所有相关任务进行建模以决定执行顺序。你将执行与使用构建流水线时相同的任务，但使用代码完成。\n\
    \n## 准备工作\n\n打开 Jenkins 仪表盘。\n\n## 如何操作...\n\n- 1. 点击 New Item。输入项目名称并选择 Pipeline。\n\
    - 2. 点击 OK：\n\n## Enter an item name\n\nFirstPipeline\n\n- **Freestyle project**\
    \ — This is the central feature of Jenkins. Jenkins will build your project, combining\
    \ any SCM with any build system, and this can be even used for something other\
    \ than software build.\n- **Maven project** — Build a maven project. Jenkins takes\
    \ advantage of your POM files and drastically reduces the configuration.\n- **Pipeline**\
    \ — Orchestrates long-running activities that can span multiple build slaves.\
    \ Suitable for building pipelines (formerly known as workflows) and/or organizing\
    \ complex activities that do not easily fit in free-style job type.\n- **External\
    \ Job** — This type of job allows you to record the execution of a process run\
    \ outside Jenkins, even on a remote machine. This is designed so that you can\
    \ use Jenkins as a dashboard of your existing automation system.\n- **Multi-configuration\
    \ project** — Suitable for projects that need a large number of different configurations,\
    \ such as testing on multiple environments, platform-specific builds, etc.\n\n\
    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_508_0.png)\n\n## 使用示例流水线进行执行\n\nJenkins\
    \ 提供示例语法以帮助你了解如何配置流水线。\n\n## 准备工作\n\n在 Jenkins 2 中，流水线和其他功能已随默认安装及建议插件一起安装。\n\n\
    ## 如何操作...\n\n- 1. 进入 Jenkins 仪表盘 | New item | Pipeline。\n- 2. 它将打开新创建的流水线作业的配置。\n\
    - 3. 进入 Pipeline 部分：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_511_0.png)\n\n\
    4. 在 try sample Pipeline... 下拉菜单中选择 GitHub + Maven。它将自动生成示例代码的语法。确保 mvnHome 具有与系统中的\
    \ Maven 路径相符的正确值：\n\n## Pipeline\n\nDefinition\n\nPipeline script\n\nScript\n\n\
    ```\nnode {\n    def mvnHome\n    stage('Preparation') { // for display purposes\n\
    \        // Get some code from a GitHub repository\n        git 'https://github.com/jglick/simple-maven-project-with-tests.git'\n\
    \        // Get the Maven tool\n        // ** NOTE: This 'M3' Maven tool must\
    \ be configured\n        // **       in the global configuration.\n        mvnHome\
    \ = tool 'M3'\n    }\n    stage('Build') {\n        // Run the maven build\n \
    \       if (isUnix()) {\n            sh \"${mvnHome}/bin/mvn\" -Dmaven.test.failure.ignore\
    \ clean package\"\n        } else {\n            bat(\"/${mvnHome}/bin/mvn\" -Dmaven.test.failure.ignore\
    \ clean package/)\n        }\n    }\n```\n\nGitHub + Maven\n\nUse Groovy Sandbox\n\
    \nPipeline Syntax\n\nSave\n\nApply\n\n- 5. 点击 Save 并执行构建以验证其是否有效。\n- 6. 然而，你将在下一个配方中创建自己的流水线，其序列与使用\
    \ Build Pipeline 插件时尝试的序列相同。\n\n## 配置流水线作业以实现端到端自动化\n\n在本配方中，你将创建脚本以创建与使用 `Build\
    \ Pipeline` 插件配置的类似流水线。\n\n## 准备工作\n\n点击 Pipeline Syntax 以生成你想要执行的特定任务的语法。\n\n\
    你可以选择步骤并配置所需内容，然后点击 Generate Pipeline Script 以获取可直接在流水线中使用的语法：\n\n"
