    ## Configuring SonarQube as a Windows service


    It is a pain to start SonarQube every time we start the system. It is better to
    have a situation where SonarQube has started automatically when the system is
    started.


    ## Getting ready


    Open Command Prompt by selecting Run as administrator:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_319_0.png)


    It is important to start Command Prompt as Administrator.


    ## How to do it...


