    ## Getting ready


    Through user management, we can provide access to Jenkins to multiple users and
    provide them with roles based on project-based access when it is required. The
    Manage Users will only appear if the selected security realm is Jenkins'' own
    user database.


    - 1. Go to Manage Jenkins and click on Manage Users:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_195_0.png)


    - 2. Verify the existing admin user available in Jenkins:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_195_1.png)


    - 3. Click on the Create User link and provide details:


    4. Verify the list of users in Manage Jenkins| Manage Users:


    # Users


    These users can log into Jenkins. This is a sub set of this list, which also contains
    auto-created users who really just made some commits on some projects and have
    no direct Jenkins access.


    | User Id | Name |

    |---|---|

    | admin | admin |

    | Shreyansh | Shreyansh Soni |


    You can change or delete users from Manage Jenkins | Manage Users.


    ## How to do it...


    - 1. To allow sign up and access to only logged in users, go to Manage Jenkins
    | Configure Global Security.

    - 2. In the Access Control section, click on Jenkins'' own user database and select
    Allow users to sign up:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_197_0.png)


    - 3. So, this is how we can create users and allow users to sign up, as well as
    to access Jenkins.


