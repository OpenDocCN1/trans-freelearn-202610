    \ option.\n- 4. Create a build.xml file at the top level of your project with\
    \ the following content:\n\n```\n```xml\n<project default=\"jmeter.tests\">\n\
    \  <property name=\"jmeter\" location=\"/var/lib/jenkins/jmeter\" />\n  <property\
    \ name=\"target\" location=\"${basedir}/target\" />\n  <echo message=\"Running...\
    \ Expecting variables [jvarg,desc]\" />\n  <echo message=\"For help please read\
    \ ${basedir}/README\" />\n  <echo message=\"[DESCRIPTION] ${desc}\" />\n  <taskdef\
    \ name=\"jmeter\" classname=\"org.programmerplanet.ant.taskdefs.jmeter.JMeterTask\"\
    \ classpath=\"${jmeter}/extras/ant-jmeter-1.0.9.jar\" />\n  <target name=\"jmeter.init\"\
    >\n    <mkdir dir=\"${basedir}/jmeter_results\"/>\n    <delete includeemptydirs=\"\
    true\">\n      <fileset dir=\"${basedir}/jmeter_results\" includes=\"**/*\" />\n\
    \    </delete>\n  </target>\n  <target name=\"jmeter.tests\" depends=\"jmeter.init\"\
    \ description=\"launch jmeter load tests\">\n    <echo message=\"[Running] jmeter\
    \ tests...\" />\n    <jmeter jmeterhome=\"${jmeter}\" resultlog=\"${basedir}/jmeter_results/LoadTestResults.jtl\"\
    >\n      <testplans dir=\"${basedir}/plans\" includes=\"*.jmx\"/>\n      <jvmarg\
    \ value=\"${jvarg}\" />\n      <property name=\"csv\" value=\"${basedir}/data/URLS.csv\"\
    \ />\n    </jmeter>\n  </target>\n</project>\n```\n```\n\n- 5. Commit the updates\
    \ to your subversion project.\n- 6. Log in to Jenkins.\n- 7. Create a new freestyle\
    \ job with the name `ch6.remote.jmeter`.\n- 8. Under Source Code Management, check\
    \ Subversion, adding your subversion repository URL to the repository URL.\n-\
    \ 9. Within the Build section, add the build step, Invoke Ant.\n- 10. Click on\
    \ Advanced in the new Invoke Ant subsection, adding the following for properties:\n\
    \n```\n```properties\njvarg=-Xmx512m\ndesc= This is the first iteration in a performance\
    \ test\nenvironment - Driven by Jenkins\n```\n```\n\n- 11. In the Post-build Actions\
    \ section, check Publish Performance test result report. Add the input `jmeter_results/*.jtl`\
    \ to Report Files.\n- 12. Click on Save.\n- 13. Run the job a couple of times\
    \ and review the results found under the Performance trend link.\n\n## How it\
    \ works...\n\nThe `build.xml` file is an Ant script that sets up the environment\
    \ and then calls the JMeter Ant tasks defined in the library `/extras/ant-jmeter-1.0.9.jar`.\
    \ The JAR file is installed as part of the standard JMeter distribution.\n\nAny\
    \ JMeter test plan found under the plans directory will be run. Moving the test\
    \ plan from the `examples` directory to the `plans` directory activates it. The\
    \ results are aggregated in `jmeter_results/LoadTestResults.jtl`.\n\nThe Ant script\
    \ passes the `csv` variable to the JMeter test plan; the location of the `.csv`\
    \ file, `${basedir}/data/URLS.csv`. `${basedir}`, is automatically defined by\
    \ Ant. As the name suggests, it is the base directory of the Ant project.\n\n\
    You can call JMeter functions within its elements using the structure `${__functioncall(parameters)}`.\
    \ You have added the function call `${__property(csv)}` to the test plan CSV Data\
    \ Set Config element. The function pulls in the value of `.csv` that was defined\
    \ in the Ant script.\n\nThe Jenkins job runs the Ant script, which in turn runs\
    \ the JMeter test plans and aggregates the results. The Jenkins performance plugin\
    \ then parses the results, creating a report.\n\n## There's more...\n\nTo build\
    \ complex test plans speedily, consider using the transparent proxy ([http://jmeter.apache.org/usermanual/component_reference.html#HTTP_Proxy_Server](http://jmeter.apache.org/usermanual/component_reference.html#HTTP_Proxy_Server))\
    \ built into JMeter. You can run it on a given port on your local machine, setting\
    \ the proxy preferences in your web browser to match. The recorded JMeter elements\
    \ will then give you a good idea of the parameters sent in the captured requests.\n\
    \nAn alternative is Badboy ([http://www.badboysoftware.biz/docs/jmeter.html](http://www.badboysoftware.biz/docs/jmeter.html)),\
    \ which has its own built-in web browser. It allows you to record your actions\
    \ in a similar way to Selenium IDE and then save them to a JMeter plan.\n\n##\
    \ Testing with FitNesse\n\nFitNesse ([http://fitnesse.org](http://fitnesse.org))\
    \ is a fully integrated standalone wiki and acceptance-testing framework. You\
    \ can write tests in tables and run them. Writing tests in a wiki language widens\
    \ the audience of potential test writers and decreases the initial efforts required\
    \ to learn a new framework.\n\nIf a test passes, the table row is displayed in\
    \ green. If it fails, it is displayed in red. The tests can be surrounded by wiki\
    \ content delivering context information, such as user stories, at the same location\
    \ as the tests. You can also consider creating mock-ups of your web applications\
    \ in FitNesse next to the tests, and pointing the tests at those mock-ups.\n\n\
    This recipe describes how to run FitNesse remotely and display the results within\
    \ Jenkins.\n"
