    # Processes that Improve Quality


    Quality assurance requires that the experts pay attention to a wide range of details.
    Rather than being purely technical, many of these details relate to human behavior.
    This chapter mentions both the soft skills needed to run successful projects and
    the configuration skills codified in the recipes of this book. Here are a few
    hard-learned observations.


    ## Culture and collaboration


    - DevOps is a cultural movement and it is all about changing the culture of an
    organization to make the processes more effective and to make people more productive
    with the use of tools.

    - Culture of an organization is the key to success. Over the years, templates,
    best practices, and patterns are created in the organizations considering the
    resource capabilities, environment, and many other factors. If the culture of
    an organization can adapt to change, then it is a blessing in a dynamic environment
    of today''s day and age.

    - If the culture of an organization supports knowledge sharing and collaboration,
    then it not only creates robust assets that can be utilized over and over, but
    it also creates scopes of innovation and applies them across different business
    units.

    - Planning for processes to setup Continuous Development, Continuous Integration,
    Continuous Testing, and Continuous Deployment require collaboration across different
    stakeholders for better implementation and effective results.


    ## Fail early or fail faster


    It is always better to avoid or prevent problems rather than solving them later
    in a situation where lot of things are at stake and the cost interns of price,
    reputation, and market scenario is much harder to deal with. The later in the
    software life cycle you correct a problem, the costlier it will prove to be. Failing
    early is significantly cheaper than failing later. Continuous Integration allows
    you to automatically fail software early. Adding extra tests through plugins or
    connected cloud services gives greater opportunity to face your issues early,
    improving quality and decreasing costs. Embrace acknowledging issues because you
    are saving time and money. Failing later in the project creates a situation of
    no point of return. Even in case of infrastructure provisioning, cloud computing
    has changed a scenario. Because of pay-as-you-go billing models, organizations
    and SMBs can also afford resources that they wouldn''t have dreamt of earlier.
    You can use the same type of resources in Dev and Test environments for a specific
    amount of time and you know exactly what kind of issues will take place and how
    to solve them. Environment is going to be same in production as well, and hence
    you won''t have to deal with any major issues later in the application development
    life cycle because you have already faced these issues and you are very well aware
    how to deal with them quickly.


    Often, the experience of failing early helps to create a framework or best practices
    that not only solves the issues but also makes the overall scenario more robust
    and leads to the creation of design patterns of specific solutions.


    ## Data-driven testing


    You can efficiently cover your testing surface if you use a data-driven testing
    approach. For example, when writing JMeter test plans, you can use the CSV configuration
    element to read in variables from text files. This allows JMeter to read out parameters
    from your CSV files, such as hostname, and transverse your infrastructure. This
    enables one test plan to attack many servers. The same is true for SoapUI; by
    adding an Excel data source and looping through the rows, you can test an application
    with many different test users who each have a range of roles. Data-driven testing
    has a tendency to be maintainable. During refactoring, instead of changing your
    test plan as the URLs in your application change, you can factor the URLs out
    into CSV files.


    ## Learning from history


    Teams tend to have their own coding habits and this varies from organization to
    organization because of the tools they use and coding standards they follow. If
    a project fails because of the quality of the code, try to work out which code
    metrics would have stopped the code reaching production. Which mistakes are seen
    repeatedly? Take a look at the following examples:


    - **Friday afternoon code failure:** We all are human and have secondary agendas.
    By the end of the week, programmers may have their minds focused elsewhere other
    than on the code. A small subset of programmers have their code quality affected,
    consistently injecting more defects toward the tail end of their roster. Consider
    scheduling a weekly Jenkins job that has harsher thresholds for quality metrics
    near the time of least attention.

    - **Code churn:** A sudden surge in code commits just before a product is being
    moved from an acceptance environment to product indicates that there is a last-minute
    rush. For some teams with a strong sense of code quality, this is also a sign
    of extra vigilance. For other less-disciplined teams, this could be a naïve push
    toward destruction. If a project fails and QA is overwhelmed due to a surge of
    code changes, look at setting up a warning Jenkins job based on commit velocity.
    If necessary, you can display your own custom metrics.

    - **A rogue coder:** Not all developers create code of the same uniform high quality.
    It is possible that there is consistent underachievement within a project. Rogue
    coders are caught by human code review. However, for a secondary defense, consider
    setting thresholds on static code review reports from SonarQube, FindBugs, and
    PMD. If a particular developer is not following accepted practice, builds will
    fail with great regularity.

    - **The GUI does not make sense:** Isn''t it painful when you build a web application
    only to be told at the last moment that the GUI does not quite interact in the
    way that the product owner expected? One solution is to write a mockup in FitNesse
    and surround it with automatic functional tests, using fixtures. When the GUI
    diverges from the planned workflow, then Jenkins will start shouting.

    - **Tracking responsibility:** Mistakes are made and lessons need to be learned.
    However, if there is no clear chain of documented responsibility, it is difficult
    to pin down who needs the learning opportunity. One approach is to structure the
    workflow in Jenkins through a series of connected jobs and use the promoted builds
    plugin to make sure the right group verifies at the right point. This methodology
    is also good for reminding the team of the short-term tasks.


    For better code quality, you can create a Jenkins build that takes the code from
