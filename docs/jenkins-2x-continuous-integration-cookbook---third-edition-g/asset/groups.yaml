  - '[PAGE 372]


    # # Running jobs from within Maven


    With little fuss, you can run wget through the Maven-AntRun plugin. The following
    is the equivalent `pom.xml` fragment:


    ```

    ```xml

    <build>

    <plugin>

    <groupId>org.apache.maven.plugins</groupId>

    <artifactId>maven-antrun-plugin</artifactId>

    <version>1.7</version>

    <executions><execution>

    <phase>compile</phase>

    <configuration>

    <tasks>

    <exec executable="wget">

    <arg line="--auth-no-challenge --http-user=username --http-password=apiToken http://localhost:8080/job/ch3.RunMe/build?token=changeme"
    />

    </exec>

    </tasks>

    </configuration>

    <goals><goal>run</goal></goals>

    </execution></executions>

    </plugin>

    </build>

    ```

    ```


    You can use the Exec Maven plugin for the same purpose as the Maven-AntRun plugin.
    For more details, visit [http://mojo.codehaus.org/exec-maven-plugin/](http://mojo.codehaus.org/exec-maven-plugin/).'
  - '[PAGE 373]


    # Remotely generating jobs


    There is also a project that allows you to create Jenkins jobs through Maven remotely
    ([https://github.com/evgeny-goldin/maven-plugins/tree/master/jenkins-maven-plugin](https://github.com/evgeny-goldin/maven-plugins/tree/master/jenkins-maven-plugin)).
    The advantage of this approach is its ability to enforce consistency and reuse
    between jobs. You can use one parameter to choose a Jenkins server and populate
    it. This is useful for generating a large set of consistently structured jobs.'
