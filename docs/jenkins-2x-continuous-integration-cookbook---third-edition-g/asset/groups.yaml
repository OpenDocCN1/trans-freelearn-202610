  md: "\n## There's more...\n\nHere are a few things you should consider.\n\n## Eclipse\
    \ templates for JSP pages\n\nEclipse is a popular open source IDE for Java developers\
    \ (http://www.eclipse.org/). If you are using Eclipse with its default template\
    \ for JSP pages, then your pages may fail to compile. This is because, at the\
    \ time of writing, the default compiler does not like the meta-information mentioned\
    \ before the <html> tag, as follows:\n\n```\n<%@ page language=\"java\" contentType=\"\
    text/html;charset=UTF-8\"\npageEncoding=\"UTF-8\"%>\n<!DOCTYPE html PUBLIC \"\
    -//W3C//DTD HTML 4.01 Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\"\
    >\n```\n\nAs the meta-information follows the JSP specification, it is likely\
    \ that later the JSP compiler will accept the information. Until that day, simply\
    \ remove the lines before compiling, or change the JSP compiler that you use.\n\
    \n## Remotely triggering jobs through the Jenkins API\n\nJenkins has a remote\
    \ API that allows you to enable, disable, run, and delete jobs; it also lets you\
    \ change the configuration. The API is increasing with each Jenkins version. To\
    \ get the most up-to-date details, you will need to review `http://yourhost/job/Name_of_Job/api/`.\
    \ Where `yourhost` is the location of your Jenkins server, `Name_of_Job` is the\
    \ name of a job that exists on your server.\n\nThis recipe details how you can\
    \ trigger builds remotely by using security tokens. This will allow you to run\
    \ other jobs from within Maven.\n\n## Getting ready\n\nThis recipe expects Jenkins\
    \ security to be turned on so that you can log in as a user. It also assumes you\
    \ have a modern version of wget (http://www.gnu.org/software/wget/) installed.\n\
    \n## How to do it...\n\n- 1. Create a Freestyle project with the project name\
    \ `ch3.RunMe`.\n- 2. Check This Build is parameterized, select String Parameter,\
    \ and add the following details:\n  - 1. Name: `myvariable`\n  - 2. DefaultValue:\
    \ `Default`\n  - 3. Description: `This is my example variable`\n- 3. Under the\
    \ Build Triggers section, check Trigger builds remotely (for example, from scripts).\n\
    - 4. In the Authentication Token textbox, add `changeme`.\n- 5. Click on the Save\
    \ button.\n- 6. Click on the Build with Parameters link.\n- 7. You will be asked\
    \ for the variable named `myvariable`. Click on Build.\n- 8. Visit your personal\
    \ configuration page, such as http://localhost:8080/, where you replace `your_user`\
    \ with your Jenkins username.\n- 9. In the API Token section, click on the Show\
    \ API Token... button.\n- 10. Copy the token to `apiToken`.\n- 11. From a terminal\
    \ console, run `wget` to log in and run the job remotely:\n- 12. Check the Jenkins\
    \ job to verify that it has not run and returns a 405 HTTP status code:\n- 13.\
    \ From a terminal console, run `wget` to log in and run the job, returning a 201\
    \ HTTP status code:\n\n```\nwget --auth-no-challenge --http-user=username --http-password=apiToken\n\
    http://localhost:8080/job/ch3.RunMe/build?token=changeme\n```\n\n```\nResolving\
    \ localhost (localhost)... 127.0.0.1\nConnecting to localhost (localhost)|127.0.0.1|:8080...\
    \ connected.\nHTTP request sent, awaiting response... 405 Method Not Allowed\n\
    2014-08-14 15:08:43 ERROR 405: Method Not Allowed.\n```\n\n```\nwget --auth-no-challenge\
    \ --http-user=username --http-password=apiToken\nhttp://localhost:8080/job/ch3.RunMe/buildWithParameters?\n\
    token=changeme&myvariable='Hello World'\nConnecting to localhost (localhost)|127.0.0.1|:8080...\
    \ connected.\nHTTP request sent, awaiting response... 201 Created\n```\n\nHTTP\
    \ can be packet-sniffed by a third party. Use HTTPS when transporting passwords.\n\
    \n## There's more...\n\nHere are a few things you should consider.\n\n## Running\
    \ jobs from within Maven\n\nWith little fuss, you can run wget through the Maven-AntRun\
    \ plugin. The following is the equivalent `pom.xml` fragment:\n\n```\n```xml\n\
    <build>\n<plugin>\n<groupId>org.apache.maven.plugins</groupId>\n<artifactId>maven-antrun-plugin</artifactId>\n\
    <version>1.7</version>\n<executions><execution>\n<phase>compile</phase>\n<configuration>\n\
    <tasks>\n<exec executable=\"wget\">\n<arg line=\"--auth-no-challenge --http-user=username\
    \ --http-password=apiToken http://localhost:8080/job/ch3.RunMe/build?token=changeme\"\
    \ />\n</exec>\n</tasks>\n</configuration>\n<goals><goal>run</goal></goals>\n</execution></executions>\n\
    </plugin>\n</build>\n```\n```\n\nYou can use the Exec Maven plugin for the same\
    \ purpose as the Maven-AntRun plugin. For more details, visit http://mojo.codehaus.org/exec-maven-plugin/.\n\
    \n## Remotely generating jobs\n\nThere is also a project that allows you to create\
    \ Jenkins jobs through Maven remotely (https://github.com/evgeny-goldin/maven-plugins/tree/master/jenkins-maven-plugin).\
    \ The advantage of this approach is its ability to enforce consistency and reuse\
    \ between jobs. You can use one parameter to choose a Jenkins server and populate\
    \ it. This is useful for generating a large set of consistently structured jobs.\n\
    \n## See also\n\n- The *Running Ant through Groovy in Maven* recipe\n\n## Continuous\
    \ Delivery\n\nIn this chapter, we will cover the following recipes:\n\n- Archiving\
    \ artifacts\n- Copying an artifact from another build job\n- Integrating Jenkins\
    \ with Artifactory\n- Deploying a WAR file from Jenkins to Tomcat\n- Deploying\
    \ a WAR file from Jenkins to AWS Beanstalk\n- Deploying a WAR file from Jenkins\
    \ to Azure App Services\n- Promoting builds\n\n## Introduction\n\n**Continuous\
    \ Delivery (CD)** is a DevOps practice that is used to deploy an application quickly\
    \ while maintaining a high quality with an automated approach in a non-production\
    \ environment. It is about the way application package is deployed in the Web\
    \ Server or in the Application Server in environment such as dev, test or staging.\
    \ Deployment of an application can be done using shell script, batch file, or\
    \ plugins available in Jenkins. Approach of automated deployment in case of Continuous\
    \ Delivery and Continuous Deployment will be always same most of the time. In\
    \ the case of Continuous Delivery, the application package is always production\
    \ ready.\n\n## Archiving artifacts\n\nArtifact archiving is useful when you want\
    \ to use an installable or distribution package in another project or build job.\
    \ Normally, you create a different project to achieve a pipeline for end-to-end\
    \ automation.\n\n## How to do it...\n\n- 1. Go to Jenkins dashboard | Jenkins\
    \ project or build job | Post-build Actions | Add post-build action | Archive\
    \ the artifacts:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_380_0.png)\n\n2.\
    \ You can use wildcards, such as `module/dist/**/*.zip`. The artifact archiver\
    \ uses Ant `org.apache.tools.ant.DirectoryScanner`, which excludes the following\
    \ patterns by default: `**/%*, **/.git/**, **/.bzr, **/hg/**, **/.bzrignore, **/.git,\
    \ **/SCCS/**, **/hg, **/#*`\n\n## See also\n\n- The *Copying an artifact from\
    \ other build job* recipe is useful for copying an archived artifact from another\
    \ project into Jenkins\n\n## Copying an artifact from another build job\n\nIn\
    \ this recipe, we will copy artifact/file/package from one build to other. It\
    \ helps in the deployment or copy operations. Even with Master/Agent architecture,\
    \ we can copy artifacts effortlessly using the `Copy Artifact` Plugin.\n\n## Getting\
    \ ready\n\nYou need to allow read access to anonymous users, as the Copyartifact\
    \ plugin treats builds running as an anonymous. To allow read access to anonymous,\
    \ do the following:\n\nGo to Manage Jenkins | Global Security Configuration:\n\
    \n## Jenkins › Configure Global Security\n\nEnable security\nDisable remember\
    \ me\nAccess Control\n\n## Security Realm\n\nActive Directory\nDelegate to servlet\
    \ container\nJenkins' own user database\nAllow users to sign up\nEnable captcha\
    \ on sign up\nCaptcha Support\nJCaptcha\nLDAP\n\n## Authorization\n\nAnyone can\
    \ do anything\nLegacy mode\nLogged-in users can do anything\nMatrix-based security\n\
    \n| User/group | Overall | Credentials | Agent | Job |\n| Anonymous | Administer\
    \ Read Create Delete Manage Domains Update View Build Configure Connect Create\
    \ Delete Disconnect Provision Build Cancel Configure Create Delete Discover |\n\
    \nUser/group to add: [ ] Add\n\nSave   Apply\n\nClick on Save.\n"
  mdcn: "\n## 更多内容...\n\n这里有一些你应该考虑的事项。\n\n## 用于JSP页面的Eclipse模板\n\nEclipse是一个流行的Java开发者开源IDE（http://www.eclipse.org/）。如果你使用Eclipse及其默认的JSP页面模板，那么你的页面可能无法编译。这是因为，在撰写本文时，默认编译器不喜欢在<html>标签之前提到的元信息，如下所示：\n\
    \n```\n<%@ page language=\"java\" contentType=\"text/html;charset=UTF-8\"\npageEncoding=\"\
    UTF-8\"%>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n\"\
    http://www.w3.org/TR/html4/loose.dtd\">\n```\n\n由于元信息遵循JSP规范，很可能之后JSP编译器会接受该信息。在那之前，只需在编译前删除这些行，或者更换你使用的JSP编译器。\n\
    \n## 通过Jenkins API远程触发作业\n\nJenkins有一个远程API，允许你启用、禁用、运行和删除作业；它还允许你更改配置。该API随着每个Jenkins版本而增加。要获取最新的详细信息，你需要查看`http://yourhost/job/Name_of_Job/api/`。其中`yourhost`是你Jenkins服务器的位置，`Name_of_Job`是你服务器上存在的作业名称。\n\
    \n本教程详细介绍了如何使用安全令牌远程触发构建。这将允许你从Maven内部运行其他作业。\n\n## 准备工作\n\n本教程期望Jenkins安全已开启，以便你可以作为用户登录。它还假设你安装了现代版本的wget（http://www.gnu.org/software/wget/）。\n\
    \n## 操作步骤...\n\n- 1. 创建一个Freestyle项目，项目名称为`ch3.RunMe`。\n- 2. 勾选“此构建已参数化”（This\
    \ Build is parameterized），选择“字符串参数”（String Parameter），并添加以下详细信息：\n  - 1. 名称（Name）：`myvariable`\n\
    \  - 2. 默认值（DefaultValue）：`Default`\n  - 3. 描述（Description）：`This is my example\
    \ variable`\n- 3. 在“构建触发器”（Build Triggers）部分，勾选“远程触发构建（例如，从脚本）”（Trigger builds\
    \ remotely (for example, from scripts)）。\n- 4. 在“身份验证令牌”（Authentication Token）文本框中，添加`changeme`。\n\
    - 5. 点击“保存”（Save）按钮。\n- 6. 点击“使用参数构建”（Build with Parameters）链接。\n- 7. 系统会要求你输入名为`myvariable`的变量。点击“构建”（Build）。\n\
    - 8. 访问你的个人配置页面，例如http://localhost:8080/，将`your_user`替换为你的Jenkins用户名。\n- 9. 在“API令牌”（API\
    \ Token）部分，点击“显示API令牌...”（Show API Token...）按钮。\n- 10. 将令牌复制到`apiToken`。\n- 11.\
    \ 从终端控制台运行`wget`以登录并远程运行作业：\n- 12. 检查Jenkins作业，验证它尚未运行并返回405 HTTP状态码：\n- 13. 从终端控制台运行`wget`以登录并运行作业，返回201\
    \ HTTP状态码：\n\n```\nwget --auth-no-challenge --http-user=username --http-password=apiToken\n\
    http://localhost:8080/job/ch3.RunMe/build?token=changeme\n```\n\n```\nResolving\
    \ localhost (localhost)... 127.0.0.1\nConnecting to localhost (localhost)|127.0.0.1|:8080...\
    \ connected.\nHTTP request sent, awaiting response... 405 Method Not Allowed\n\
    2014-08-14 15:08:43 ERROR 405: Method Not Allowed.\n```\n\n```\nwget --auth-no-challenge\
    \ --http-user=username --http-password=apiToken\nhttp://localhost:8080/job/ch3.RunMe/buildWithParameters?\n\
    token=changeme&myvariable='Hello World'\nConnecting to localhost (localhost)|127.0.0.1|:8080...\
    \ connected.\nHTTP request sent, awaiting response... 201 Created\n```\n\nHTTP可能会被第三方进行数据包嗅探。传输密码时请使用HTTPS。\n\
    \n## 更多内容...\n\n这里有一些你应该考虑的事项。\n\n## 从Maven内部运行作业\n\n无需多费周折，你可以通过Maven-AntRun插件运行wget。以下是等价的`pom.xml`片段：\n\
    \n```\n```xml\n<build>\n<plugin>\n<groupId>org.apache.maven.plugins</groupId>\n\
    <artifactId>maven-antrun-plugin</artifactId>\n<version>1.7</version>\n<executions><execution>\n\
    <phase>compile</phase>\n<configuration>\n<tasks>\n<exec executable=\"wget\">\n\
    <arg line=\"--auth-no-challenge --http-user=username --http-password=apiToken\
    \ http://localhost:8080/job/ch3.RunMe/build?token=changeme\" />\n</exec>\n</tasks>\n\
    </configuration>\n<goals><goal>run</goal></goals>\n</execution></executions>\n\
    </plugin>\n</build>\n```\n```\n\n你可以使用Exec Maven插件来达到与Maven-AntRun插件相同的目的。更多详情，请访问http://mojo.codehaus.org/exec-maven-plugin/。\n\
    \n## 远程生成作业\n\n还有一个项目允许你通过Maven远程创建Jenkins作业（https://github.com/evgeny-goldin/maven-plugins/tree/master/jenkins-maven-plugin）。这种方法的好处是能够在作业之间强制实现一致性和复用。你可以使用一个参数来选择Jenkins服务器并填充它。这对于生成大量结构一致的作业非常有用。\n\
    \n## 另请参阅\n\n- *通过Maven中的Groovy运行Ant*的教程\n\n## 持续交付\n\n在本章中，我们将介绍以下教程：\n\n- 归档构件\n\
    - 从另一个构建作业复制构件\n- 将Jenkins与Artifactory集成\n- 从Jenkins将WAR文件部署到Tomcat\n- 从Jenkins将WAR文件部署到AWS\
    \ Beanstalk\n- 从Jenkins将WAR文件部署到Azure应用服务\n- 提升构建\n\n## 引言\n\n**持续交付（CD）**是一种DevOps实践，用于在非生产环境中通过自动化方法快速部署应用程序，同时保持高质量。它关乎应用程序包在开发、测试或预发布等环境中的Web服务器或应用服务器上的部署方式。应用程序的部署可以使用shell脚本、批处理文件或Jenkins中可用的插件来完成。在持续交付和持续部署的情况下，自动化部署的方法在大多数时候总是相同的。在持续交付的情况下，应用程序包始终是生产就绪的。\n\
    \n## 归档构件\n\n当你想在另一个项目或构建作业中使用可安装或分发包时，构件归档非常有用。通常，你会创建一个不同的项目来实现端到端自动化的流水线。\n\
    \n## 操作步骤...\n\n- 1. 转到Jenkins仪表盘 | Jenkins项目或构建作业 | 构建后操作 | 添加构建后操作 | 归档构件：\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_380_0.png)\n\n2. 你可以使用通配符，例如`module/dist/**/*.zip`。构件归档器使用Ant的`org.apache.tools.ant.DirectoryScanner`，默认情况下排除以下模式：`**/%*,\
    \ **/.git/**, **/.bzr, **/hg/**, **/.bzrignore, **/.git, **/SCCS/**, **/hg, **/#*`\n\
    \n## 另请参阅\n\n- *从其他构建作业复制构件*的教程对于将已归档的构件从另一个项目复制到Jenkins非常有用\n\n## 从另一个构建作业复制构件\n\
    \n在本教程中，我们将把构件/文件/包从一个构建复制到另一个构建。这有助于部署或复制操作。即使使用Master/Agent架构，我们也可以使用`Copy Artifact`插件轻松复制构件。\n\
    \n## 准备工作\n\n你需要允许匿名用户具有读权限，因为Copyartifact插件将运行中的构建视为匿名。要允许匿名用户读访问，请执行以下操作：\n\n\
    转到管理Jenkins | 全局安全配置：\n\n## Jenkins › 配置全局安全\n\n启用安全\n禁用记住我\n访问控制\n\n## 安全域\n\n\
    Active Directory\n委托给servlet容器\nJenkins自己的用户数据库\n允许用户注册\n在注册时启用验证码\n验证码支持\nJCaptcha\n\
    LDAP\n\n## 授权\n\n任何人都可以做任何事\n传统模式\n已登录用户可以做任何事\n基于矩阵的安全\n\n| 用户/组 | 总体 | 凭据 |\
    \ 代理 | 作业 |\n| 匿名 | 管理 读取 创建 删除 管理域 更新 查看 构建 配置 连接 创建 删除 断开 配置 构建 取消 配置 创建 删除\
    \ 发现 |\n\n要添加的用户/组： [ ] 添加\n\n保存   应用\n\n点击“保存”。\n\n"
