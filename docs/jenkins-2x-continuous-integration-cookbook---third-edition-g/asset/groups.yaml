    /userContent/myjavascript.js\" type=\"text/javascript\">\n</script>\n```\n\nJavaScript\
    \ 会在生成页面的顶部附近写入一个带有 `id=\"test\"` 的标题。通过 CSS 定位器 `#test` 触发级联样式表规则，即可将相机图标添加到背景中。\n\
    \n图片尺寸并不适合屏幕顶部；它们会被浏览器裁剪。这个问题你可以稍后通过实验来解决。\n\n第二条 CSS 规则针对 `main-table` 触发，这是\
    \ Jenkins 生成的标准首页的一部分。完整的相机图标会显示在那里。\n\n在访问 Jenkins 的其他部分时，你会注意到相机图标看起来与上下文不符且尺寸过大。你需要花时间来修改\
    \ CSS 和 JavaScript 以产生更好的效果。凭借细致的自定义代码，你可以为 Jenkins 定制皮肤，以符合你的企业形象。\n\nCSS 3 怪癖：\n\
    \n不同浏览器类型和版本对各种 CSS 标准的支持存在一些怪癖。如需概览，请访问 [http://www.quirksmode.org/css/contents.html](http://www.quirksmode.org/css/contents.html)。\n\
    \n## 更多内容...\n\n这里还有一些需要考虑的要点。\n\n## CSS 3\n\nCSS 3 具有许多特性。要在 JavaScript 生成的标题周围绘制一个按钮，请将\
    \ CSS 文件中的 `#test` 部分改为以下代码：\n\n```css\n#test {\nwidth: 180px; height: 60px;\n\
    background: red; color: yellow;\ntext-align: center;\n-moz-border-radius: 40px;\
    \ -webkit-border-radius: 40px;\n}\n```\n\n使用 Firefox 时，CSS 规则会生成以下按钮：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_542_0.png)\n\
    \n## JENKINS_HOME 中的图片\n\n如果你没有耐心，可以在 Smashing Magazine 网站下载 CSS 3 速查表：\n\n[http://coding.smashingmagazine.com/wp-content/uploads/images/css3-cheat-sheet/css3-cheat-sheet.pdf](http://coding.smashingmagazine.com/wp-content/uploads/images/css3-cheat-sheet/css3-cheat-sheet.pdf)\n\
    \n## 附带的 JavaScript 库框架\n\nJenkins 使用 `YUI` 库：http://yuilibrary.com/。每个 HTML 页面都包含核心\
    \ `YUI` 库（`/scripts/yui/yahoo/yahoo-min.js`），以便直接重用。然而，许多 Web 开发人员习惯于使用 jQuery。你也可以通过安装\
    \ `jQuery` 插件（https://wiki.jenkins-ci.org/display/JENKINS/jQuery+Plugin）将此库包含进来。你还可以考虑通过\
    \ WAR 覆盖（请参阅下一个技巧）将你喜欢的 JavaScript 库添加到 `Jenkins/scripts` 目录中。\n\n## 信任但要验证\n\n\
    能力越大，责任越大。如果只有少数管理员维护你的 Jenkins 部署，那么你很可能可以信任每个人添加 JavaScript 而不会产生有害的副作用。然而，如果你有大量管理员使用各种各样的\
    \ Java 库，那么你的维护和安全风险会迅速增加。请考虑你的安全策略，并至少添加审计跟踪插件（[https://wiki.jenkins-ci.org/display/JENKINS/Audit+Trail+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/Audit+Trail+Plugin)）来跟踪操作。\n\
    \n该插件会在 Jenkins 主配置页面中添加一个 **审计跟踪** 部分。在这里，你可以配置日志位置和设置（文件大小和轮转日志文件数量），以及记录请求的\
    \ URI 模式。默认选项会选择大多数影响显著的操作，如创建/配置/删除作业和视图，或删除/永久保存/启动构建。日志按配置写入磁盘，最近条目也可以在“管理/系统日志”部分查看。\n\
    \n另外，请参阅 JobConfigHistory 插件，以记录对作业配置所做的实际更改：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_544_0.png)\n\
    \n## 更多内容\n\n- 要直接更改任何图片或图标，你可以前往 `JENKINS_HOME/war/images`：\n\n  ![](img/2a4d2e09d9af2c678ea8f43ea344059d_546_0.png)\n\
