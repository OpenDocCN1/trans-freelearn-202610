  - '[PAGE 570]


    # How it works...


    The form works as long as the bread crumbing security feature in Jenkins is turned
    off. The feature, when turned on, generates a random number that the form has
    to return when you submit. This allows Jenkins to know that the form is part of
    a valid conversation with the server. The HTTP status error generated is in the
    4xx range, which implies that the client input is invalid. If Jenkins returned
    a 5xx error, then that would imply a server error. We therefore had to turn the
    feature off when submitting our own data. We do not recommend this in a production
    environment.


    Once you have logged in to Jenkins as an administrator, you can create jobs. You
    can do this through the GUI or by sending POST information. In this recipe, we
    copied a job named `Template1` to new jobs starting with the name `CH9.fake`,
    as shown in the following code:


    ```

    <form action=http://localhost:8080/createItem?mode=copy

    method=POST>

    <input type=text name=name value=CH9.fake.1>

    <input type=text name=from value=Template1 >

    <input type=submit value=''Create CH9.fake.1''>

    </form>

    ```


    The POST variables you used were `name` for the name of the new job, and `from`
    for the name of your template job. The URL for the POST action is `/createItem?mode=copy`.


    To change the hostname and port number, you will have to update the `$host` variable
    found in the Perl script.


    To delete a job, the Perl script generated forms with actions pointing to `/job/Jobname/doDelete`
    (for example, `/job/CH9.fake.1/doDelete`). No extra variables were needed.


    To increase the number of form entries, you can change the variable `$end` from
    20.'
  - '[PAGE 571]


    # There''s more...


    Jenkins uses a standard library, Stapler ([http://stapler.kohsuke.org/what-is.html](http://stapler.kohsuke.org/what-is.html)),
    to bind services to URLs. Plugins also use Stapler. When you install plugins,
    the number of potential actions also increases. This means that you can activate
    a lot of actions through HTML forms similar to this recipe. You will learn in
    [Chapter 7](#), *Exploring Plugins*, that writing binding code to Stapler requires
    minimal effort.'
  md: "\n## Creating HTML reports\n\nThe left-hand side menu of a job's dashboard\
    \ is valuable real estate. The developer's eyes naturally scan this area. This\
    \ recipe describes how you can add a link from a custom HTML report to the menu,\
    \ getting the report noticed more quickly.\n\n### Getting ready\n\nInstall the\
    \ HTML publisher plugin (https://wiki.jenkins-ci.org/display/JENKINS/HTML+Publisher+Plugin).\
    \ We assume that you have a subversion repository with the Packt code committed.\n\
    \n### How to do it...\n\n- 1. Create a free-style software project and name it\
    \ `CH9.html_report`.\n- 2. Under the Source Code Management section, click on\
    \ Subversion.\n- 3. Under the Modules section, add `Repo/CH9.communicating/html_report`\
    \ to Repository URL, where `Repo` is the URL to your subversion repository.\n\
    - 4. Under the Post-build Actions section, check Publish HTML reports. Add the\
    \ following details:\n  - HTML directory to archive: `target/custom_report`\n\
    \  - Index pages[s]: `index.html`\n  - Report title: `My HTML Report`\n  - Tick\
    \ the Keep past HTML reports checkbox\n- 5. Click on Save.\n- 6. Run the job and\
    \ review the left-hand side menu. You will now see a link to your report, as shown\
    \ in the following screenshot:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_562_0.png)\n\
    \n### How it works...\n\nYour subversion repo contains an `index.html` file that\
    \ is pulled into the workspace of the job. The plugin works as advertised and\
    \ adds a link pointing to the HTML report. This allows your audience to efficiently\
    \ find your custom-generated information.\n\n### There's more...\n\nThe example\
    \ report is shown as follows:\n\n```\n```html\n<html><head><title>Example Report</title>\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"/css/style.css\" /></head>\n\
    <body>\n<h2>Generated Report</h2>\nExample icon: <img title=\"A Jenkins Icon\"\
    \ alt=\"Schedule a build\" src=\"/images/24x24/clock.png\"\n/>\n</body></html>\n\
    ```\n```\n\nIt pulls in the main Jenkins style sheet `/css/style.css`.\n\nIt is\
    \ possible that when you update a style sheet in an application, you do not see\
    \ the changes in your browser until you have cleaned your browser cache. Jenkins\
    \ gets around this latency issue in a clever way. It uses a URL with a unique\
    \ number that changes with each Jenkins version. For example, for the `css` directory,\
    \ you have two URLs:\n\n- `/css`\n- `/static/uniquenumber/css`\n\nMost Jenkins\
    \ URLs use the latter form. Consider doing so for your style sheets.\n\nThe unique\
    \ number changes per version, so you will need to update the URL for each upgrade\n\
    \nWhen running the site goal in a Maven build, a local website is generated (http://maven.apache.org/plugins/maven-site-plugin).\
    \ This website has a fixed URL inside the Jenkins job that you can point at with\
    \ the My HTML Report link. This brings documentation such as test results within\
    \ easy reach.\n\n### See also\n\n- The *Efficient use of views* recipe\n- The\
    \ *Saving screen space with the Dashboard View plugin* recipe\n\n## Efficient\
    \ use of views\n\nJenkins' addictive ease of configuration lends itself to creating\
    \ a large number of jobs. This increases the volume of information exposed to\
    \ developers. Jenkins needs to avoid chaos by utilizing browser space efficiently.\
    \ One approach is to define minimal views. In this recipe, you will use the `DropDownViewsTabBar`\
    \ plugin. It removes views as tabs and replaces the tabs with one select box.\
    \ This aids in quicker navigation. You will also be shown how to provision lots\
    \ of jobs quickly using a simple HTML form generated by a script.\n\nIn this recipe,\
    \ you will be creating a large number of views that you may want to delete later.\
    \ If you are using a virtual box image, consider cloning the image and deleting\
    \ it after you have finished.\n\n### Getting ready\n\nInstall the `DropDownViewsTabBar`\
    \ plugin (https://wiki.jenkins-ci.org/display/JENKINS/DropDown+Views+TabBar+Plugin).\n\
    \n### How to do it...\n\n- 1. Copy and paste the following Perl script into an\
    \ executable file named create.pl:\n- 2. Create an HTML file from the output of\
    \ the Perl script, for example:\n- 3. In a web browser, as an administrator, log\
    \ in to Jenkins.\n- 4. Create the Template1 job, adding any details you wish.\
    \ This is your template job that will be copied into many other jobs.\n- 5. Load\
    \ form.html into the same browser.\n- 6. Click on one of the Create CH9.fake buttons.\
    \ Jenkins returns an error message:\n- 7. Visit Configure Global Security on http://localhost:8080/configureSecurity\
    \ and uncheck the Prevent Cross Site Request Forgery exploits box.\n- 8. Click\
    \ on Save.\n- 9. Click on all of the Create CH9.fake buttons.\n- 10. Visit the\
    \ front page of Jenkins and verify that the jobs have been created and are based\
    \ on the Template1 job.\n- 11. Create a large number of views with a random selection\
    \ of jobs. Review the front page, noting the chaos.\n- 12. Visit the configuration\
    \ screen /configure; selecting DropDownViewsTabBar provides a drop-down menu for\
    \ selecting views in the View Tab Bar select box. In the DropDown ViewsTabBar\
    \ subsection, check the Show Job Counts box, as shown in the following screenshot:\n\
    \n```\n#!/usr/bin/perl\n$counter=0;\n$end=20;\n$host='http://localhost:8080';\n\
    while($end > $counter){\n    $counter++;\n    print \"<form action=$host/createItem?mode=copy\
    \ method=POST>\\n\";print \"<input type=text name=name value=CH9.fake.$counter>\\\
    n\";\n    print \"<input type=text name=from value=Template1 >\\n\";\n    print\
    \ \"<input type=submit value='Create CH9.fake.$counter'>\\n\";\n    print \"</form><br>\\\
    n\";\n    print \"<form action=$host/job/CH9.fake.$counter/doDelete method=POST>\\\
    n\";print \"<input type=submit value='Delete CH9.fake.$counter'>\\n\";\n    print\
    \ \"</form><br>\\n\";\n}\n```\n\n```\nperl create.pl > form.html\n```\n\n```\n\
    HTTP ERROR 403\nProblem accessing /createItem. Reason:\nNo valid crumb was included\
    \ in the request\n```\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_568_0.png)\n\
    \n- 13. Click on the Save button:\n- 14. In Jenkins, visit Configure Global Security\
    \ at `http://localhost:8080/configureSecurity` and check the Prevent Cross Site\
    \ Request Forgery exploits box.\n- 15. Click on Save.\n\n### How it works...\n\
    \nThe form works as long as the bread crumbing security feature in Jenkins is\
    \ turned off. The feature, when turned on, generates a random number that the\
    \ form has to return when you submit. This allows Jenkins to know that the form\
    \ is part of a valid conversation with the server. The HTTP status error generated\
    \ is in the 4xx range, which implies that the client input is invalid. If Jenkins\
    \ returned a 5xx error, then that would imply a server error. We therefore had\
    \ to turn the feature off when submitting our own data. We do not recommend this\
    \ in a production environment.\n\nOnce you have logged in to Jenkins as an administrator,\
    \ you can create jobs. You can do this through the GUI or by sending POST information.\
    \ In this recipe, we copied a job named `Template1` to new jobs starting with\
    \ the name `CH9.fake`, as shown in the following code:\n\n```\n<form action=http://localhost:8080/createItem?mode=copy\n\
    method=POST>\n<input type=text name=name value=CH9.fake.1>\n<input type=text name=from\
    \ value=Template1 >\n<input type=submit value='Create CH9.fake.1'>\n</form>\n\
    ```\n\nThe POST variables you used were `name` for the name of the new job, and\
    \ `from` for the name of your template job. The URL for the POST action is `/createItem?mode=copy`.\n\
    \nTo change the hostname and port number, you will have to update the `$host`\
    \ variable found in the Perl script.\n\nTo delete a job, the Perl script generated\
    \ forms with actions pointing to `/job/Jobname/doDelete` (for example, `/job/CH9.fake.1/doDelete`).\
    \ No extra variables were needed.\n\nTo increase the number of form entries, you\
    \ can change the variable `$end` from 20.\n\n### There's more...\n\nJenkins uses\
    \ a standard library, Stapler (http://stapler.kohsuke.org/what-is.html), to bind\
    \ services to URLs. Plugins also use Stapler. When you install plugins, the number\
    \ of potential actions also increases. This means that you can activate a lot\
    \ of actions through HTML forms similar to this recipe. You will learn in Chapter\
    \ 7, *Exploring Plugins*, that writing binding code to Stapler requires minimal\
    \ effort.\n"
  mdcn: "\n\n## 创建 HTML 报告\n\n作业仪表盘左侧菜单是宝贵的空间。开发者的目光自然会扫向该区域。本食谱描述了如何从自定义 HTML 报告添加一个链接到菜单，使报告能更快被注意到。\n\
    \n### 准备工作\n\n安装 HTML Publisher 插件 (https://wiki.jenkins-ci.org/display/JENKINS/HTML+Publisher+Plugin)。我们假设你有一个\
    \ Subversion 仓库，其中已提交 Packt 的代码。\n\n### 如何操作...\n\n- 1. 创建一个自由风格软件项目，并将其命名为 `CH9.html_report`。\n\
    - 2. 在源代码管理部分，点击 Subversion。\n- 3. 在模块部分，将 `Repo/CH9.communicating/html_report`\
    \ 添加到仓库 URL，其中 `Repo` 是你的 Subversion 仓库的 URL。\n- 4. 在构建后操作部分，勾选发布 HTML 报告。添加以下详细信息：\n\
    \  - 要归档的 HTML 目录：`target/custom_report`\n  - 索引页[s]：`index.html`\n  - 报告标题：`My\
    \ HTML Report`\n  - 勾选保留过去的 HTML 报告复选框\n- 5. 点击保存。\n- 6. 运行作业并查看左侧菜单。你现在会看到指向报告的链接，如以下屏幕截图所示：\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_562_0.png)\n\n### 工作原理...\n\n你的 Subversion\
    \ 仓库包含一个 `index.html` 文件，该文件会被拉取到作业的工作区中。插件按广告所述工作，并添加一个指向 HTML 报告的链接。这使你的受众能够高效地找到你自定义生成的信息。\n\
    \n### 更多内容...\n\n示例报告如下所示：\n\n```\n```html\n<html><head><title>Example Report</title>\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"/css/style.css\" /></head>\n\
    <body>\n<h2>Generated Report</h2>\nExample icon: <img title=\"A Jenkins Icon\"\
    \ alt=\"Schedule a build\" src=\"/images/24x24/clock.png\"\n/>\n</body></html>\n\
    ```\n```\n\n它引入了主 Jenkins 样式表 `/css/style.css`。\n\n有可能当你在应用程序中更新样式表时，直到你清理浏览器缓存后才会在浏览器中看到更改。Jenkins\
    \ 以一种巧妙的方式解决了这种延迟问题。它使用一个随每次 Jenkins 版本更改而变化的唯一数字的 URL。例如，对于 `css` 目录，你有两个 URL：\n\
    \n- `/css`\n- `/static/uniquenumber/css`\n\n大多数 Jenkins URL 使用后一种形式。建议对你的样式表也这样做。\n\
    \n唯一数字会随版本更改，因此每次升级时你都需要更新 URL\n\n在 Maven 构建中运行 site 目标时，会生成一个本地网站 (http://maven.apache.org/plugins/maven-site-plugin)。该网站在\
    \ Jenkins 作业内部有一个固定的 URL，你可以用 My HTML Report 链接指向它。这使诸如测试结果等文档触手可及。\n\n### 另请参阅\n\
    \n- *Efficient use of views* 食谱\n- *Saving screen space with the Dashboard View\
    \ plugin* 食谱\n\n## 高效使用视图\n\nJenkins 上瘾般的易配置性使其容易创建大量作业。这增加了向开发者展示的信息量。Jenkins\
    \ 需要通过高效利用浏览器空间来避免混乱。一个方法是定义最小化视图。在本食谱中，你将使用 `DropDownViewsTabBar` 插件。它将视图作为标签移除，并用一个选择框替换标签。这有助于更快导航。你还将学习如何使用脚本生成的简单\
    \ HTML 表单快速配置大量作业。\n\n在本食谱中，你将创建大量可能稍后想要删除的视图。如果你使用的是虚拟机镜像，请考虑克隆镜像，并在完成后删除它。\n\
    \n### 准备工作\n\n安装 `DropDownViewsTabBar` 插件 (https://wiki.jenkins-ci.org/display/JENKINS/DropDown+Views+TabBar+Plugin)。\n\
    \n### 如何操作...\n\n- 1. 复制并粘贴以下 Perl 脚本到名为 create.pl 的可执行文件中：\n- 2. 从 Perl 脚本的输出创建一个\
    \ HTML 文件，例如：\n- 3. 在 Web 浏览器中，以管理员身份登录 Jenkins。\n- 4. 创建 Template1 作业，添加你想要的任何详细信息。这是你的模板作业，将被复制到许多其他作业中。\n\
    - 5. 将 form.html 加载到同一浏览器中。\n- 6. 点击其中一个 Create CH9.fake 按钮。Jenkins 返回错误消息：\n\
    - 7. 访问 http://localhost:8080/configureSecurity 上的配置全局安全，并取消勾选防止跨站请求伪造攻击复选框。\n\
    - 8. 点击保存。\n- 9. 点击所有 Create CH9.fake 按钮。\n- 10. 访问 Jenkins 的首页并验证作业是否已创建，并且基于\
    \ Template1 作业。\n- 11. 创建大量包含随机作业选择的视图。查看首页，注意混乱情况。\n- 12. 访问配置屏幕 /configure；选择\
    \ DropDownViewsTabBar 提供一个用于在视图标签栏选择框中选择视图的下拉菜单。在 DropDown ViewsTabBar 子部分中，勾选显示作业计数框，如以下屏幕截图所示：\n\
    \n```\n#!/usr/bin/perl\n$counter=0;\n$end=20;\n$host='http://localhost:8080';\n\
    while($end > $counter){\n    $counter++;\n    print \"<form action=$host/createItem?mode=copy\
    \ method=POST>\\n\";print \"<input type=text name=name value=CH9.fake.$counter>\\\
    n\";\n    print \"<input type=text name=from value=Template1 >\\n\";\n    print\
    \ \"<input type=submit value='Create CH9.fake.$counter'>\\n\";\n    print \"</form><br>\\\
    n\";\n    print \"<form action=$host/job/CH9.fake.$counter/doDelete method=POST>\\\
    n\";print \"<input type=submit value='Delete CH9.fake.$counter'>\\n\";\n    print\
    \ \"</form><br>\\n\";\n}\n```\n\n```\nperl create.pl > form.html\n```\n\n```\n\
    HTTP ERROR 403\nProblem accessing /createItem. Reason:\nNo valid crumb was included\
    \ in the request\n```\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_568_0.png)\n\
    \n- 13. 点击保存按钮：\n- 14. 在 Jenkins 中，访问 `http://localhost:8080/configureSecurity`\
    \ 配置全局安全并勾选防止跨站请求伪造攻击复选框。\n- 15. 点击保存。\n\n### 工作原理...\n\n只要 Jenkins 中的面包屑安全功能关闭，表单就能正常工作。该功能在开启时，会生成一个随机数，表单在提交时必须返回该数。这使\
    \ Jenkins 能知道表单是与服务器有效对话的一部分。生成的 HTTP 状态错误在 4xx 范围内，这意味着客户端输入无效。如果 Jenkins 返回\
    \ 5xx 错误，则意味着服务器错误。因此我们在提交自己的数据时必须关闭该功能。我们不建议在生产环境中这样做。\n\n一旦你以管理员身份登录 Jenkins，你就可以创建作业。你可以通过\
    \ GUI 或发送 POST 信息来完成。在本食谱中，我们将名为 `Template1` 的作业复制到以 `CH9.fake` 开头的新作业中，如以下代码所示：\n\
    \n```\n<form action=http://localhost:8080/createItem?mode=copy\nmethod=POST>\n\
    <input type=text name=name value=CH9.fake.1>\n<input type=text name=from value=Template1\
    \ >\n<input type=submit value='Create CH9.fake.1'>\n</form>\n```\n\n你使用的 POST\
    \ 变量为 `name` 表示新作业的名称，`from` 表示模板作业的名称。POST 操作的 URL 为 `/createItem?mode=copy`。\n\
    \n要更改主机名和端口号，你需要更新 Perl 脚本中找到的 `$host` 变量。\n\n要删除作业，Perl 脚本生成了指向 `/job/Jobname/doDelete`\
    \ 的操作表单（例如，`/job/CH9.fake.1/doDelete`）。不需要额外变量。\n\n要增加表单条目数量，你可以将变量 `$end` 从 20\
    \ 改为其他值。\n\n### 更多内容...\n\nJenkins 使用标准库 Stapler (http://stapler.kohsuke.org/what-is.html)\
    \ 将服务绑定到 URL。插件也使用 Stapler。当你安装插件时，可用操作的数量也会增加。这意味着你可以通过与本食谱类似的 HTML 表单激活大量操作。你将在第\
    \ 7 章 *Exploring Plugins* 中了解到，为 Stapler 编写绑定代码所需的努力极小。\n\n"
