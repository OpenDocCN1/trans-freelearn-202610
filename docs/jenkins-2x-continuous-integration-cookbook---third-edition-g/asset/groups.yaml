    # See also


    - The *Keeping in contact with Jenkins through Firefox* recipe in [Chapter 1](Chapter
    1), *Getting Started with Jenkins*


    ## An extreme view for reception areas


    Agile projects emphasize the role of communication over the need to document.
    Information radiators aid in returning feedback quickly. Information radiators
    have two main characteristics: they change over time and the data presented is
    easy to digest.


    The extreme Feedback Panel plugin is one example of an information radiator. It
    is a highly visual Jenkins view. If the layout is formatted consistently and displayed
    on a large monitor, it is ideal for the task. Consider this also as a positive
    advertisement of your development process. You can display it behind your reception
    desk or in a well-visited social area such as near the coffee machine or project
    room.


    In this recipe, you will add the `eXtreme Feedback Panel` plugin and modify its
    appearance through HTML tags in the description.


    ## Getting ready


    Install the `eXtreme Feedback Panel` plugin ([https://wiki.jenkins-ci.org/display/JENKINS/eXtreme+Feedback+Panel+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/eXtreme+Feedback+Panel+Plugin)).


    ## How to do it...


    1. Create a job with a descriptive name such as `Blackboard Report Pro Access`
    and add the following description:


    ```html

    <center>

    <p>Writes Blackboard sanity reports<br>

    and sends them to a list.

    <table border="1" class="myclass"><tr><td>More Details</td></tr></table>

    </center>

    ```


    2. Create a new view (`/newView`) named eXtreme. Check the eXTremeFeedBack Panel
    and then click on OK.

    3. Select 6-24 already created jobs, including the one previously created in this
    recipe.

    4. Set the number of columns as 2.

    5. Select the refresh time in seconds as 20.

    6. Click on Show Job descriptions.

    7. Click on OK.


    8. Experiment with the settings (especially the pixel size of the fonts). Optimizing
    the view depends on the monitors used and the distance from the monitor that the
    audience view at, as shown in the following screenshot:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_592_0.png)


    | 功能 | 内容 | 数量 | 报价(元/次) |

    | --- | --- | --- | --- |

