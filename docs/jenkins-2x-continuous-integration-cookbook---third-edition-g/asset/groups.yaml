    ## 使用 JavaMelody 监控 Jenkins


    JavaMelody (http://code.google.com/p/javamelody/) 是一个开源项目，提供全面的监控。Jenkins 插件同时监控
    Jenkins 的主实例及其节点。插件提供大量详细的重要信息。您可以查看从 1 天或 1 周到数月的演变图表，显示主要指标，如 CPU 或内存。演变图表非常擅长定位资源消耗大的计划作业。


    `Monitoring` 插件提供使用 JavaMelody 对 Jenkins 的监控。它提供 CPU、内存、系统负载平均值、HTTP 响应时间等的图表。它还提供
    HTTP 会话、错误和日志、垃圾回收操作、堆转储、无效会话等详细信息。


    ## 准备工作


    从 Jenkins 仪表盘安装 Monitoring 插件：


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_168_0.png)


