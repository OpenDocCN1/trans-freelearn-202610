    \ `java -jar jenkins-cli.jar -s http://localhost:8080/ help` 命令查看 CLI 命令的帮助信息：\n\
    \n```text\nC:\\Users\\Mitesh\\Downloads>java -jar jenkins-cli.jar -s http://localhost:8080/\
    \ help\n  add-job-to-view\n    Adds jobs to view.\n  build\n    Builds a job,\
    \ and optionally waits until its completion.\n  cancel-quiet-down\n    Cancel\
    \ the effect of the \"quiet-down\" command.\n  clear-queue\n    Clears the build\
    \ queue.\n  connect-node\n    Reconnect to a node(s)\n  console\n    Retrieves\
    \ console output of a build.\n  copy-job\n    Copies a job.\n  create-credentials-by-xml\n\
    \    Create Credential by XML\n  create-credentials-domain-by-xml\n    Create\
    \ Credentials Domain by XML\n  create-job\n    Creates a new job by reading stdin\
    \ as a configuration XML file.\n  create-node\n    Creates a new node by reading\
    \ stdin as a XML configuration.\n  create-view\n    Creates a new view by reading\
    \ stdin as a XML configuration.\n  declarative-linter\n    Validate a Jenkinsfile\
    \ containing a Declarative Pipeline\n  delete-builds\n    Deletes build record(s).\n\
    \  delete-credentials\n    Delete a Credential\n  delete-credentials-domain\n\
    \    Delete a Credentials Domain\n  delete-job\n    Deletes job(s).\n  delete-node\n\
    \    Deletes node(s)\n  delete-view\n    Deletes view(s).\n```\n\n2. 执行以下命令：\n\
    \n```text\njava -jar jenkins-cli.jar -s http://localhost:8080/ version\njava -jar\
    \ jenkins-cli.jar -s http://localhost:8080/ who-am-i\njava -jar jenkins-cli.jar\
    \ -s http://localhost:8080/ list-jobs\n```\n\n3. 验证输出，如下所示：\n\n```text\nC:\\Users\\\
    Mitesh\\Downloads>java -jar jenkins-cli.jar -s http://localhost:8080/ version\n\
    2.73\n\nC:\\Users\\Mitesh\\Downloads>java -jar jenkins-cli.jar -s http://localhost:8080/\
    \ who-am-i\nAuthenticated as: anonymous\nAuthorities:\nanonymous\n\nC:\\Users\\\
    Mitesh\\Downloads>java -jar jenkins-cli.jar -s http://localhost:8080/ list-jobs\n\
    AzureAppDeploy\nCucumberProject\nCucumberProject2\nFirstAndroidProject\nFirstAntExample\n\
    FirstJob\nFirstPipeline\nMain-PetClinic\nMaven-Sample\nmitesh51\nPetClinic-Code\n\
    PetClinic-Deploy\nPetClinic-FuncTest\nPetClinic-LoadTest\nPetClinic-Package\n\
    PetClinic-Prod\nPetClinicWebHook\nSonarHTMLCSSJS\nSpringBoot\nTest\nTestPipeline\n\
    ZapTest\nZapTestBackup\n\nC:\\Users\\Mitesh\\Downloads>\n```\n\n4. 请自行尝试其他命令。\n\
    \n## 从命令行修改 Jenkins 配置\n\n你可能对 Jenkins 工作区顶层的 XML 文件感到好奇。这些是配置文件。`config.xml`\
    \ 是处理默认服务器值的主要文件，但任何通过 GUI 设置值的插件也有对应的特定配置文件。\n\n工作区下还有一个 `jobs` 子目录。每个单独的任务配置都包含在与任务同名的子目录中。任务特有的配置存储在子目录内的\
    \ `config.xml` 中。`users` 目录的情况类似：每个用户都有一个子目录，个人信息存储在 `config.xml` 中。\n\n在受控情况下，如果你基础设施中的所有\
    \ Jenkins 服务器具有相同的插件和版本级别，你可以在一台测试机上测试，然后将配置文件推送到所有其他机器。然后你可以使用**命令行界面（CLI）**重启\
    \ Jenkins 服务器。\n\n本教程将帮助你熟悉主要的 XML 配置结构，然后根据 XML 的细节提供有关插件 API 的提示。\n\n### 准备工作\n\
    \n你需要一台启用了安全性的 Jenkins 服务器，并且能够编辑文件，可以通过登录后使用命令行操作，也可以使用文本编辑器进行编辑。\n\n### 操作步骤...\n\
    \n让我们看看如何修改 Jenkins 配置。\n\n1. 在 Jenkins 的顶层目录中，找到 `config.xml` 文件。编辑包含 `numExecutors`\
    \ 的那一行，将数字 2 改为 3：\n\n   ```text\n   <numExecutors>3</numExecutors>\n   ```\n\n\
    2. 重启服务器。你会看到执行器数量从默认的两个增加到三个。\n\n3. 插件通过 XML 文件持久化其配置。为了证明这一点，请查找 `thinBackup.xml`\
    \ 文件。除非你已安装 `thinBackup` 插件，否则你找不到它。\n\n### 工作原理...\n\nJenkins 使用 **XStream**（[http://xstream.codehaus.org/](http://xstream.codehaus.org/)）将其配置持久化为可读的\
    \ XML 格式。工作区中的 XML 文件是插件、任务以及其他各种持久化信息的配置文件。`config.xml` 是主配置文件。安全设置和全局配置都在此处设置，并反映通过\
    \ GUI 所做的更改。插件使用相同的结构，XML 值对应于底层插件类中的成员值。GUI 本身是通过 Jelly 框架（[http://commons.apache.org/jelly/](http://commons.apache.org/jelly/)）从\
    \ XML 创建的。\n\n通过重启服务器，你可以确保任何配置更改都会在初始化阶段被加载。\n\n也可以使用“管理 Jenkins”页面中的**从磁盘重新加载配置**，无需重启即可加载更新后的配置。\n\
    \n## 管理磁盘使用情况\n\nJenkins 存储多个任务，并且创建的多个构建也存储在机器上。跟踪磁盘使用情况非常重要，因为随着时间的推移，多个项目的构建会占用大量空间。\n\
    \n### 准备工作\n\n转到 Dashboard | Manage Jenkins | Manage Plugins | Available | 安装\
    \ Disk Usage 插件。\n\n### 操作步骤...\n\n该插件提供 Jenkins 安装所在系统的磁盘使用情况详细信息。\n\n1. 转到 Dashboard\
    \ | Manage Jenkins | Disk Usage：\n\n2. 转到 Manage Jenkins，点击 Configure System。转到\
    \ Disk usage 部分，勾选 Show disk usage trend graph on the project page：\n\n   **磁盘使用**\n\
    \n   - 启用构建计算\n   - 计算时间间隔\n   - 启用任务计算\n   - 计算时间间隔\n   - 启用工作区计算\n   - 计算时间间隔\n\
    \   - 当某些大小超限时发出警告\n   - 在项目页面显示磁盘使用趋势图\n   - 在全局图表中显示任务目录的可用空间\n   - 全局磁盘使用历史的长度\n\
    \   - 计算从节点工作区的超时时间（分钟）\n   - 也从从节点端控制工作区\n   - 排除在磁盘使用计算之外的任务\n\n3. 转到一个特定项目，验证\
    \ Disk Usage Trend 图表是否可用：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_160_0.png)\n\
    \n## 安全关闭 Jenkins\n\n是否有可能停止执行新的构建，以便最终可以安全地关闭系统？让我们在下面的教程中了解。\n"
