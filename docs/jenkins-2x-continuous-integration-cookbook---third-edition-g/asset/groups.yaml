    # Introduction


    This chapter explores the use of Jenkins plugins to display code metrics and failed
    builds. Automation lowers costs and improves consistency. The process does not
    get tired. If you decide the success and failure criteria before a project starts,
    then this will remove a degree of subjective debate from release meetings.


    In 2002, NIST estimated that software defects were costing America around 60 billion
    dollars per year (http://www.abeacha.com/NIST_press_release_bugs_cost.html). Expect
    the cost to have increased considerably since. To save money and improve quality,
    you need to remove defects as early in the software lifecycle as possible.


    You will also find recipes in this chapter on static code review through SonarQube.
    Static means that you can look at the code without running it. Good documentation
    and source code structure aid the maintainability and readability of your code.


    There are a number of good introductions to software metrics. These include a
    Wikibook on the details of the metrics (http://en.wikibooks.org/wiki/Introduction_to_Software_Engineering/Quality/Metrics)
    and a well-written book called *Code Quality: The Open Source Perspective*, by
    Diomidis Spinellis.


    In the *Integrating Jenkins with SonarQube* recipe of this chapter, you will link
    Jenkins projects to Sonar reports. Sonar is a specialized tool that collects software
    metrics and breaks them down into understandable reports. Sonar details the quality
    of a project. It uses a wide range of metrics including the results of tools such
    as FindBugs and PMD, mentioned in this chapter. The project itself is evolving
    rapidly. Consider using Jenkins for early warnings and to spot obvious defects,
    such as a bad commit. You can then use Sonar for a deeper review.


