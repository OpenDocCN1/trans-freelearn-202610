    3. Review the items to be installed and click on Next >.


    4. Accept the terms of the license agreement and then click on Finish. It will
    start installing the Mylyn package.


    5. Once it is finished, Restart Eclipse.


    ### How to do it...


    Let''s see how to trigger a Jenkins build from Eclipse.


    1. In the Windows menu, click on Views.


    2. Select Mylyn and click on Builds. Then, click OK:


