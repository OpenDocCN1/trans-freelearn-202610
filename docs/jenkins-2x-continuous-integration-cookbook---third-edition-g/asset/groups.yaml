    There will be instances where you have all the plugins downloaded from [https://updates.jenkins-ci.org/download/plugins/](https://updates.jenkins-ci.org/download/plugins/),
    or you may create your own plugin and you want to utilize that in Jenkins. This
    recipe will explain how to upload these plugins in Jenkins.


    ## Getting ready


    Download the required plugin https://updates.jenkins-ci.org/download/plugins/
    or create a plugin using the Plugin tutorial, https://wiki.jenkins.io/display/JENKINS/Plugin+tutorial.


    ## How to do it...


    For this recipe, we will download a plugin and upload it from the Jenkins dashboard:


    +   1. Download the copyartifact plugin (`.hpi`) file:


