    +   - 例如，在 `PetClinic-Package` 项目中你可以创建一个 WAR 文件以部署到应用服务器。

    +   - 在 `PetClinic-Package` 的 General 部分，勾选 Permission to Copy Artifact 并提供可以复制构件的项目名称：


    +   - 点击保存。


    ## 将 Jenkins 与 Artifactory 集成


