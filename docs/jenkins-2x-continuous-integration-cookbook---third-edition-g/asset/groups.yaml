    ## Getting ready


    Download the latest stable FitNesse JAR from [http://fitnesse.org/FitNesseDownload](http://fitnesse.org/FitNesseDownload).
    Install the FitNesse plugins for Jenkins from [https://wiki.jenkins-ci.org/display/JENKINS/FitNesse+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/FitNesse+Plugin).


    ## How to do it...


    1. Create the `fit/logs` directories and place them in the `fit` directory, `fitnesse-standalone.jar`.

    2. Run the FitNess help from the command line and review the options:


    ```

    java -jar fitnesse-standalone.jar -help

    Usage: java -jar fitnesse.jar [-vpdrleoab]

    -p <port number> {80}

    -d <working directory> {.}

    -r <page root directory> {FitNesseRoot}

    -l <log directory> {no logging}

    -f <config properties file> {plugins.properties}

    -e <days> {14} Number of days before page versions expire

    -o omit updates

    -a {user:pwd | user-file-name} enable authentication.

    -i Install only, then quit.

    -c <command> execute single command.

    -b <filename> redirect command output.

    -v {off} Verbose logging

    ```

    3. Run FitNesse from the command line and review the startup output:


    ```

    java -jar fitnesse-standalone.jar -p 39996 -l logs -a tester:test

    Bootstrapping FitNesse, the fully integrated standalone wiki and acceptance

    testing framework.

    root page: fitnesse.wiki.fs.FileSystemPage at ./FitNesseRoot#latest

    logger: /home/alan/Desktop/X/fitness/logs

    authenticator: fitnesse.authentication.OneUserAuthenticator

    page factory: fitnesse.html.template.PageFactory

    page theme: fitnesse_straight

    Starting FitNesse on port: 39996

    ```

    4. Using a web browser, visit http://localhost:39996.

    5. Click on the Acceptance Test link.

    6. Click on the Suite link. This will activate a set of tests. Depending on your
    computer, the tests may take a few minutes to complete. The direct link is http://localhost:39996/FitNesse.SuiteAcceptanceTests?suite.

    7. Click on the Test History link. You will need to log on as user `tester` with
    the password `test`.

    8. Review the log in the `fit/logs` directory. After running the suite again,
    you will now see an entry similar to the following:


    ```

    127.0.0.1 - tester [01/Oct/2014:11:14:59 +0100] "GET

    /FitNesse.SuiteAcceptanceTests?suite HTTP/1.1" 200 6086667

    ```

    9. Log in to Jenkins and create a freestyle software project named `ch6.remote.fitnesse`.

    10. In the Build section, select the Execute fitnesse tests option from the Add
    Build step.

    11. Check the option FitNesse instance is already running, adding:


    - Fitnesses Host: `localhost`

    - Fitnesses Port: `39996`

    - Target Page: `FitNesse.SuiteAcceptanceTests?suite`

    - Check the Is target a suite option

    - HTTP Timeout (ms): `180000`

    - Path to fitnesse xml results file: `fitnesse-results.xml`

    12. In the Post-build Actions section, check the Publish FitNesse results report
    option.

    13. Add the fitnesse-results.xml value to the input Path to fitnesse xml results
    file.

    14. Click on Save.

    15. Run the job.

    16. Review the latest job by clicking on the link FitNesse Results.


    ## How it works...


    FitNesse has a built-in set of acceptance tests that it uses to check itself for
    regressions. The Jenkins plugin calls the test and asks for the results to be
    returned in XML format using an HTTP GET request with the URL: `http://localhost:39996/FitNesse.SuiteAcceptanceTests?suite&format=xml`.
    The results look similar to the following:


    ```xml

    <testResults>

    <FitNesseVersion>v20140901</FitNesseVersion>

    <rootPath>FitNesse.SuiteAcceptanceTests</rootPath>

    <result>

    <counts><right>103</right>

    <wrong>0</wrong>

    <ignores>0</ignores>

    <exceptions>0</exceptions>

    </counts>

    <runTimeInMillis>27</runTimeInMillis>

    <relativePageName>CopyAndAppendLastRow</relativePageName>

    <pageHistoryLink>

    FitNesse.SuiteAcceptanceTests.SuiteFitDecoratorTests.CopyAndAppend

    LastRow?pageHistory&resultDate=20141101164526

    </pageHistoryLink>

    </result>

    ```


    The Jenkins plugin then parses the XML and generates a report.


    By default, there is no security enabled on FitNesse pages. In this recipe, a
    username and password were defined during startup. However, we did not take this
    further and define the security permissions on the page. To activate, you will
    need to go to the properties link on the left-hand side of the page and check
    the security permission for secure-test.


    You can also authenticate through a list of users in a text file or Kerberos/Active
    Directory. For more details, review [http://fitnesse.org/FitNesse.FullReferenceGuide.UserGuide.AdministeringFitNesse.SecurityDescr](http://fitnesse.org/FitNesse.FullReferenceGuide.UserGuide.AdministeringFitNesse.SecurityDescr)


    There is also a contributed plugin for LDAP authentication: [https://github.com/timander/fitnesse-ldap-authenticator](https://github.com/timander/fitnesse-ldap-authenticator).


    Consider applying security in depth; adding IP restrictions through a firewall
    on the FitNesse server creates an extra layer of defense. For example, you can
    place an Apache server in front of the wiki, and enabling SSL/TLS ensures encrypted
    passwords. A thinner alternative to Apache is NGINX: [http://wiki.nginx.org](http://wiki.nginx.org).


    ## See also...


    You will find the source code with information on building the newest version
    of FitNesse at its GitHub home: https://github.com/unclebob/fitnesse.


    ## Orchestration


    In this chapter, we will cover the following recipes:


    - Introduction

    - Understanding upstream and downstream jobs

    - Configuring upstream and downstream jobs

    - Configuring a build pipeline

    - Creating a pipeline job

    - Using a sample pipeline for execution

    - Configuring a pipeline job for end-to-end automation

    - Getting started with the Blue Ocean dashboard


    ## Introduction


    An orchestration or pipeline is all about defining a sequence of execution to
    manage an application life cycle based on requirements.


    A simple example can be that you may want to perform a static code analysis first;
    if it complies to the defined quality gate, then it should only perform Continuous
    Integration and create an application package that can be deployed in a specific
    environment.


    Once the package is ready, deploy it into a test environment for manual or automated
    testing based on the requirements and defined policies in the organization. Once
    it is promoted for UAT or the staging environment, then you may want to perform
    functional test execution and performance testing.


    Once this flow is completed, you may want to deploy it in a production environment,
    but not without the approval of the specific stakeholder.


    This is the orchestration of build jobs or the defined flow of execution.


    ## Getting ready


    You need to divide the end-to-end automation of the application life cycle management
    process into multiple distinct projects.


    The benefit of this strategy is that you can isolate automation tasks and execute
    independently on different agents.


    ## How to do it...


    Let''s start with the first job for upstream and downstream jobs configuration.
    Keep a project that executes static code analysis as the first job:


    1. Go to the Post-build Actions section in the configuration of the PetClinic-Code
    build job.

    2. Select Build other projects from the available options:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_493_0.png)


    3. You should create the package after static code analysis is done, so you should
    select PetClinic-Package where Continuous Integration is configured for compilation
    of the source code, unit test execution, and package file creation.

    4. Click Save.


    Thus, for PetClinic-Code, PetClinic-Package is a downstream job while for PetClinic-Package,
    PetClinic-Code is an upstream job.


    ## Configuring upstream and downstream jobs


    Let''s configure a complete flow using upstream and downstream jobs.

    '
  mdcn: '


    ## 准备工作


    从 [http://fitnesse.org/FitNesseDownload](http://fitnesse.org/FitNesseDownload)
    下载最新的稳定版 FitNesse JAR 包。从 [https://wiki.jenkins-ci.org/display/JENKINS/FitNesse+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/FitNesse+Plugin)
    安装适用于 Jenkins 的 FitNesse 插件。


    ## 操作步骤


    1. 创建 `fit/logs` 目录，并将 `fitnesse-standalone.jar` 放入 `fit` 目录中。

    2. 在命令行中运行 FitNesse 帮助命令，查看相关选项：


    ```

    java -jar fitnesse-standalone.jar -help

    Usage: java -jar fitnesse.jar [-vpdrleoab]

    -p <port number> {80}

    -d <working directory> {.}

    -r <page root directory> {FitNesseRoot}

    -l <log directory> {no logging}

    -f <config properties file> {plugins.properties}

    -e <days> {14} Number of days before page versions expire

    -o omit updates

    -a {user:pwd | user-file-name} enable authentication.

    -i Install only, then quit.

    -c <command> execute single command.

    -b <filename> redirect command output.

    -v {off} Verbose logging

    ```

    3. 在命令行中运行 FitNesse，查看启动输出：


    ```

    java -jar fitnesse-standalone.jar -p 39996 -l logs -a tester:test

    Bootstrapping FitNesse, the fully integrated standalone wiki and acceptance

    testing framework.

    root page: fitnesse.wiki.fs.FileSystemPage at ./FitNesseRoot#latest

    logger: /home/alan/Desktop/X/fitness/logs

    authenticator: fitnesse.authentication.OneUserAuthenticator

    page factory: fitnesse.html.template.PageFactory

    page theme: fitnesse_straight

    Starting FitNesse on port: 39996

    ```

    4. 使用 Web 浏览器访问 http://localhost:39996。

    5. 点击 **Acceptance Test** 链接。

    6. 点击 **Suite** 链接。这将启动一组测试。根据你的计算机性能，测试可能需要几分钟才能完成。直接链接为 http://localhost:39996/FitNesse.SuiteAcceptanceTests?suite。

    7. 点击 **Test History** 链接。你需要使用用户名 `tester` 和密码 `test` 登录。

    8. 查看 `fit/logs` 目录中的日志。再次运行测试套件后，你将看到类似于以下内容的记录：


    ```

    127.0.0.1 - tester [01/Oct/2014:11:14:59 +0100] "GET

    /FitNesse.SuiteAcceptanceTests?suite HTTP/1.1" 200 6086667

    ```

    9. 登录 Jenkins，创建一个名为 `ch6.remote.fitnesse` 的自由风格软件项目。

    10. 在 **构建** 部分，从 **添加构建步骤** 中选择 **Execute fitnesse tests** 选项。

    11. 勾选 **FitNesse instance is already running** 选项，并填写：


    - FitNesse 主机：`localhost`

    - FitNesse 端口：`39996`

    - 目标页面：`FitNesse.SuiteAcceptanceTests?suite`

    - 勾选 **Is target a suite** 选项

    - HTTP 超时时间（毫秒）：`180000`

    - FitNesse XML 结果文件路径：`fitnesse-results.xml`

    12. 在 **构建后操作** 部分，勾选 **Publish FitNesse results report** 选项。

    13. 在 **Path to fitnesse xml results file** 输入框中添加 `fitnesse-results.xml` 值。

    14. 点击 **保存**。

    15. 运行该任务。

    16. 点击 **FitNesse Results** 链接查看最新任务结果。


    ## 工作原理


    FitNesse 内置了一套验收测试，用于检查自身是否存在回归问题。Jenkins 插件通过 HTTP GET 请求调用测试，并要求以 XML 格式返回结果，其
    URL 为：`http://localhost:39996/FitNesse.SuiteAcceptanceTests?suite&format=xml`。结果类似于以下内容：


    ```xml

    <testResults>

    <FitNesseVersion>v20140901</FitNesseVersion>

    <rootPath>FitNesse.SuiteAcceptanceTests</rootPath>

    <result>

    <counts><right>103</right>

    <wrong>0</wrong>

    <ignores>0</ignores>

    <exceptions>0</exceptions>

    </counts>

    <runTimeInMillis>27</runTimeInMillis>

    <relativePageName>CopyAndAppendLastRow</relativePageName>

    <pageHistoryLink>

    FitNesse.SuiteAcceptanceTests.SuiteFitDecoratorTests.CopyAndAppend

    LastRow?pageHistory&resultDate=20141101164526

    </pageHistoryLink>

    </result>

    ```


    随后，Jenkins 插件解析该 XML 并生成报告。


    默认情况下，FitNesse 页面未启用任何安全机制。在本教程中，我们在启动时定义了用户名和密码。然而，我们并未进一步在页面上定义安全权限。要激活安全权限，你需要点击页面左侧的
    **properties** 链接，并勾选 **secure-test** 的安全权限。


    你还可以通过文本文件中的用户列表或 Kerberos/Active Directory 进行身份验证。更多详情，请参阅 [http://fitnesse.org/FitNesse.FullReferenceGuide.UserGuide.AdministeringFitNesse.SecurityDescr](http://fitnesse.org/FitNesse.FullReferenceGuide.UserGuide.AdministeringFitNesse.SecurityDescr)


    此外，还有一个用于 LDAP 认证的社区贡献插件：[https://github.com/timander/fitnesse-ldap-authenticator](https://github.com/timander/fitnesse-ldap-authenticator)。


    建议考虑深度防御；在 FitNesse 服务器上通过防火墙添加 IP 限制可形成额外的防御层。例如，你可以在 wiki 前放置 Apache 服务器，并启用
    SSL/TLS 以确保密码加密传输。Apache 的一个更轻量级替代方案是 NGINX：[http://wiki.nginx.org](http://wiki.nginx.org)。


    ## 另请参阅


    你可以在 FitNesse 的 GitHub 主页上找到包含构建最新版本信息的源代码：https://github.com/unclebob/fitnesse。


    ## 编排


    在本章中，我们将介绍以下内容：


    - 简介

    - 理解上游和下游任务

    - 配置上游和下游任务

    - 配置构建流水线

    - 创建流水线任务

    - 使用示例流水线执行

    - 配置用于端到端自动化的流水线任务

    - Blue Ocean 仪表盘入门


    ## 简介


    编排或流水线是指根据需求定义一系列执行序列，以管理应用程序的生命周期。


    一个简单的例子是：你可能希望先执行静态代码分析；如果它符合所定义的质量门禁，那么才执行持续集成并创建可部署到特定环境的应用程序包。


    包准备就绪后，根据组织中的需求和既定策略，将其部署到测试环境中进行手动或自动化测试。一旦被提升至 UAT 或预发布环境，你可能需要执行功能测试和性能测试。


    此流程完成后，你可能希望将其部署到生产环境，但必须经过特定利益相关者的批准。


    这就是构建任务的编排或已定义的执行流程。


    ## 准备工作


    你需要将应用程序生命周期管理流程的端到端自动化划分为多个不同的项目。


    这种策略的好处在于，你可以隔离自动化任务，并在不同的代理上独立执行。


    ## 操作步骤


    让我们从第一个任务开始，进行上游和下游任务的配置。将执行静态代码分析的项目作为第一个任务：


    1. 在 **PetClinic-Code** 构建任务的配置中，进入 **构建后操作** 部分。

    2. 从可用选项中选择 **Build other projects**：


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_493_0.png)


    3. 你应该在静态代码分析完成后创建包，因此应选择 **PetClinic-Package**，该任务已配置了源代码编译、单元测试执行和包文件生成的持续集成。

    4. 点击 **保存**。


    因此，对于 **PetClinic-Code** 而言，**PetClinic-Package** 是下游任务；而对于 **PetClinic-Package**
    而言，**PetClinic-Code** 是上游任务。


    ## 配置上游和下游任务


    让我们使用上游和下游任务配置一个完整的流程。


    '
