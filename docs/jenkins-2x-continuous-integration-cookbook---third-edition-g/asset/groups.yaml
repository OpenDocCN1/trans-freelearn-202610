    \ | 40 MB | ↓ |\n\n全部下载\n\n在本章中，你使用了 Build Pipeline 插件以及 Jenkins 2 及更高版本中的流水线即代码功能创建了一个流水线。\n\
    \n## Jenkins 界面定制\n\n在本章中，我们将介绍以下操作指南：\n\n- 使用 simple themes 插件为 Jenkins 换肤\n\
    - 使用 WAR 覆盖层为 Jenkins 换肤并配置资源\n- 生成主页\n- 创建 HTML 报告\n- 高效使用视图\n- 使用 Dashboard\
    \ View 插件节省屏幕空间\n- 利用 HTML5 浏览器发出提醒\n- 为接待区提供极限视图\n\n## 引言\n\n本章探讨如何通过 Jenkins\
    \ 进行沟通，并认识到存在不同的目标受众。\n\nJenkins 是一位才华横溢的沟通者。其主页显示所有任务的状态，让你能够快速做出决策。你可以轻松设置多个视图，自然地优先展示信息。Jenkins\
    \ 拥有大量插件，可通过电子邮件、仪表板和 Google 服务通知你。它通过移动设备向你呼喊，当你走过大屏幕时向外辐射信息，还会用 USB 海绵导弹发射器向你开火。\n\
    \n它的主要受众是开发者，但不要忘记那些想要使用正在开发的软件的更广泛受众。看到 Jenkins 以一致的视图和企业风格进行定期构建，会增强人们对软件路线图的信心。本章包含一些操作指南，帮助你触及这些更广泛的受众。\n\
    \n在制定一致的沟通策略时，有许多 Jenkins 特有的细节需要配置。以下是在本章中将考虑的几个方面：\n\n- **通知**：当出现问题时，开发者需要迅速知晓。Jenkins\
    \ 有许多插件；你应该选择几个适合团队精神的插件。\n- **页面装饰**：页面装饰器是一种为每个页面添加内容的插件。你可以通过添加自己的样式表和 JavaScript\
    \ 来低成本地打造企业外观和风格。\n- **覆盖 Jenkins**：使用 Maven WAR 插件，你可以在 Jenkins 之上覆盖自己的内容。你可以利用它添加自定义内容并预置主页等资源，从而增强企业外观和风格。\n\
    - **优化视图**：首页视图是以标签页形式显示的任务列表。受众使用首页快速决定选择哪个任务进行查看。插件扩展了视图类型的选项，并优化信息消化。这有可能避免进一步查看的需要，节省宝贵时间。\n\
    - **路过通知**：在视觉上辐射信息的极限视图在大显示器上看起来很棒。如果你在接待处或咖啡机等聚集地放置一台显示器，路人便会吸收任务状态变化的起起伏伏。这种视图巧妙地暗示了你公司的专业性和产品路线图的稳定性。\n\
    - **跟踪受众**：如果你公开沟通，那么应该跟踪使用模式，以便改进服务。考虑将 Jenkins 页面连接到 Google Analytics 或 Piwik（一个开源分析应用）。\n\
    \n## 使用 simple themes 插件为 Jenkins 换肤\n\n本节操作指南通过 themes 插件修改 Jenkins 的外观和风格。\n\
    \nthemes 插件是一个页面装饰器；它会用额外的 HTML 标签装饰每个页面。该插件允许你上传样式表和 JavaScript 文件。之后可通过本地 URL\
    \ 访问这些文件。然后，每个 Jenkins 页面都会使用这些 URL 的 HTML 标签来加载你上传的文件。虽然简单直接，但若设计得当，视觉效果会非常强大。\n\
    \n## 准备工作\n\n1. 安装 themes 插件（https://wiki.jenkins-ci.org/display/JENKINS/Simple+Theme+Plugin）。\n\
    2. 点击“安装而不重启”：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_534_0.png)\n\n3. 等待插件安装成功：\n\
    \n# 正在安装插件/升级\n\n准备\n\n- 检查互联网连接\n- 检查更新中心连接\n- 成功\n\nStatic Analysis Utilities\
    \ 成功\nAndroid Lint Plugin 成功\nSimple Theme Plugin 成功\n\n返回顶部页面\n（你可以立即开始使用已安装的插件）\n\
    \n当安装完成且没有任务在运行时，重启 Jenkins\n\n4. 转到 Jenkins 仪表板，点击 管理 Jenkins | 配置系统 | 主题：\n\n\
    ## 主题\n\n主题 CSS 的 URL\n\n指定主题 CSS 的 URL。\n\n主题 JS 的 URL\n\n指定主题 JS 的 URL。\n\n\
    你需要在此处提供自定义 CSS 和自定义 JS 文件，以更改 Jenkins 仪表板的外观和风格。\n\n## 操作步骤...\n\n1. 在 Jenkins\
    \ 的 userContent 目录下，创建一个名为 my.js 的文件，包含以下代码行：\n   \n       document.write(\"<h1\
    \ id='test'>Example Location</h1>\")\n2. 在 Jenkins 的 userContent 目录下创建一个 mycss.css\
    \ 文件，包含以下代码行：\n   \n       @charset \"utf-8\";\n       #test {\n       background-image:\
    \ url(/userContent/camera.png);\n       }\n       #main-table{\n       background-image:\
    \ url(/userContent/camera.png)\n       !important;\n3. 从 http://sourceforge.net/projects/openiconlibrary/files/0.11/open_icon_library-standard-0.11.tar.bz2/download\
    \ 下载并解压图标存档，查看可用的图标。或者，你可以使用本书网站（www.packtpub.com/support）下载中包含的图标。将图标添加到 userContent\
    \ 目录，并将其重命名为 camera.png。\n4. 访问 Jenkins 主配置页面：/configure。在“主题”部分，填写 CSS 和 JavaScript\
    \ 文件的位置：\n   - 主题 CSS 的 URL：/userContent/mycss.css\n   - 主题 JS 的 URL：/userContent/myjavascript.js\n\
    5. 点击“保存”。\n6. 返回 Jenkins 主页并检查你的成果，如下图所示：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_536_0.png)\n\
    \n另一种更改 Jenkins 主题的方法是在 CSS 字段中使用以下任一 URL 来更改外观和风格：\n\n- https://jenkins-contrib-themes.github.io/jenkins-material-theme/dist/material-red.css\n\
