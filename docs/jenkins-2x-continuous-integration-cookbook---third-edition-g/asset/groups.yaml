  - '[PAGE 608]


    # Avoiding human bottlenecks


    The simpler your testing environment is, the less skill you''ll need to maintain
    it. As you learn to use the plugins and explore the potential of new tools and
    scripting languages, the more knowledge the organization needs in order to maintain
    a stable system. If you wish to go on holidays without random text messages asking
    for advice, make sure that your knowledge is transferred to at least a second
    person. This sounds obvious, but in the rush of your daily load, this principle
    is often forgotten or put to one side.


    One of the easiest ways to share knowledge is to send a couple of developers off
    to the same conferences and events together (https://www.CloudBees.com/company/events/juc).
    Learn best practices from Jenkins user conferences and other conferences too.


    This is where managers play a significant role in knowledge dissemination. They
    need to plan in time and activities for the sharing of knowledge, rather than
    expecting it to happen by magic.'
  - '[PAGE 609]


    # Avoiding groupthink


    It is easy to be perfect on paper, defining the importance of a solid set of Javadocs
    and unit tests. However, the real world on its best days is chaotic. Project momentum,
    motivated by the need to deliver, is an elusive force to push back against.


    Related to project momentum is the potential of groupthink

    (http://en.wikipedia.org/wiki/Groupthink) by the project team or resource owners.
    If the team has the wrong collective attitude, as a quality assurance professional
