    - Monitoring Jenkins with JavaMelody\n- Monitoring Jenkins job using Build Monitor\
    \ View\n- Configuring mail notifications\n- Signaling the need to archive\n\n\
    ### Understanding master/agent architecture\n\nJenkins supports the master/agent\
    \ architecture. In master/agent architecture, we can install Jenkins on master\
    \ and then utilize other agents for distributing the load.\n\nWe should delegate\
    \ Jenkins jobs to agents for execution. This way, we can support multiple executions\
    \ using different resources.\n\nThere are specific scenarios where master/agent\
    \ architecture is extremely useful, such as following:\n\n- The Jenkins machine\
    \ has limited capacity; even with the higher capacity, there will be a time where\
