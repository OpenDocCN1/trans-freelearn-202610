    # # Testing for OWASP''s top 10 security issues


    This recipe details the automatic testing of Jenkins for well-known security issues
    with w3af, a penetration testing tool from the **Open Web Application Security
    Project (OWASP)**. For more information, visit [http://w3af.sourceforge.net](http://w3af.sourceforge.net).
    OWASP''s purpose is to make application security visible. The OWASP''s top 10
    lists of insecurities for 2010 include the following:


    +   - **A2-Cross-site Scripting (XSS):** An XSS attack can occur when an application
    returns an unescaped input to a client''s browser. The Jenkins administrator can
    do this by default through the job description.

    +   - **A6-Security Misconfiguration:** A Jenkins plugin gives you the power to
    write custom authentication scripts. It is easy to get scripts wrong through misconfiguration.

    +   - **A7-Insecure Cryptographic Storage:** There are over 600 plugins for Jenkins,
    each storing its configuration in separate XML files. It is quite possible that
    there could be a rare mistake with the storage of passwords in plain text. You
    will need to double-check.

    +   - **A9-Insufficient Transport Layer Protection:** Jenkins runs over HTTP by
    default. It can be a hassle and involves extra costs to obtain a trusted certificate.
    You might be tempted not to implement TLS, leaving your packets open.


    You will find that OWASP''s top 10 lists of insecurities for 2013 have some changes
    compared with the 2010 version. The most significant change is the inclusion of
    **A9-Using Known Vulnerable Components**. If your software depends on older libraries,
    then there is a window of opportunity for the manipulation of known weaknesses.


    Jenkins has a large set of plugins written by a motivated, diffuse, and hardworking
    community. It is possible, due to the large churn of code, that security defects
    are inadvertently added. Examples include leaving passwords in plain text in configuration
    files or using unsafe rendering that does not remove suspicious JavaScript. You
    can find the first type of defect by reviewing the configuration files manually.
    The second type is accessible to a wider audience and is thus more readily crackable.
    You can attack the new plugins by hand. There are helpful cheat sheets available
    on the internet ([http://hackers.org/xss.html](http://hackers.org/xss.html)).
    The effort required is tedious; automated tests can cover more ground and can
    be scheduled as part of a Jenkins job.


    In the recipe named *Exploring the OWASP dependency-check plugin*, you will configure
    Jenkins to give you warning of known attack vectors, based on automatically reviewing
    your code dependencies.


