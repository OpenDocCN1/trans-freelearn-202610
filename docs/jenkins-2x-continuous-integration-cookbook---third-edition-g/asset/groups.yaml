    ### How it works...


    Let''s see how the script will be executed:


    - A warning string is defined and the current date is now stored. Each job in
    Jenkins is programmatically iterated via the `for` statement.

    - Jenkins has a class to store build run information. The runtime information
    is retrieved via `job.getLastSuccessfulBuild()` and is stored in the `lastSuccessfulBuild`
    instance. If no successful build has occurred, then `lastSuccessfulBuild` is set
    to null; otherwise, it has the runtime information.

    - The time of the last successful build is retrieved and then stored in the `time`
    instance via `lastSuccessfulBuild.getTimestamp().getTime()`.


    The current year is compared with the year of the last successful build and, if
    they are different and the warning string has not already been added to the front
    of the job description, then the description is updated.


    Javadoc:


    You will find the job API mentioned at [http://javadoc.jenkins-ci.org/hudson/model/Job.html](http://javadoc.jenkins-ci.org/hudson/model/Job.html)
    and the run information at [http://javadoc.jenkins-ci.org/hudson/model/Run.html](http://javadoc.jenkins-ci.org/hudson/model/Run.html).


    ## Managing Security


    In this chapter, we will cover the following recipes:


    - Improving security with Jenkins configuration

    - Configuring Authorization - Matrix-based security

    - Configuring a Project-based Matrix Authorization Strategy

    - Jenkins and OpenLDAP integration

    - Jenkins and Active Directory integration

    - Jenkins and OWASP Zed Attack Proxy integration

    - Testing for OWASP''s top 10 security issues

    - Finding 500 errors and XSS attacks in Jenkins through fuzzing

    - Avoiding sign-up bots with JCaptcha


    ### Introduction


    In this chapter, we''ll discuss the security of Jenkins, taking into account that
    Jenkins can live in a rich variety of infrastructures. We will also look at how
    to scan for known security issues in the libraries used by Java code that Jenkins
    compiles.


    The only perfectly secure system is a system that does not exist. For real services,
    you will need to pay attention to the different surfaces open to attack. Jenkins''
    primary surfaces are its web-based graphical user interface and its trust relationships
    with its slave nodes and the native OS. Online services need vigorous attention
    to their security surface. For Jenkins, there are three main reasons why:


    - Jenkins has the ability to communicate with a wide range of infrastructures
    through either its plugins or the master-slave topology

    - The rate of code change around the plugins is high and open to the accidental
    inclusion of security-related defects

    - You need to harden the default install


    Another positive thing is that Jenkins code is freely available for review and
    the core community keeps a vigilant eye.


    ### Improving security with Jenkins configuration


    In this section, we will cover how to manage multiple users.

    '
