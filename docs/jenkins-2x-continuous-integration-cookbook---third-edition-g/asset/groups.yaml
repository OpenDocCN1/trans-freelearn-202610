    \ installed plugins:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_288_0.png)\n\n\
    - 2. You can uninstall plugins from the Installed tab also.\n\n## Quality gates,\
    \ quality profiles, and rules\n\nIn this section, we will look at the default\
    \ quality gate that defines the base level for passing or failing code analysis,\
    \ and quality profiles is rule specific to a particular programming language.\n\
    \n## How to do it...\n\n- 1. As of now there is no project available in the SonarQube\
    \ dashboard:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_291_0.png)\n\n- 2. Quality\
    \ Gate is used to enforce policy in the organization for static code analysis.\n\
    - 3. The SonarQube way is the default Quality Gate and you assign it to different\
    \ projects based on the policies required.\n- 4. You can also add conditions based\
    \ on your requirement and policies you want to enforce:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_291_1.png)\n\
    \n- 5. Click on the Quality Profiles tab to get details on the default quality\
    \ profiles available in SonarQube.\n- 6. Quality Profiles is at the heart of SonarQube;\
    \ it is just a set of rules specific to a language. If not mentioned explicitly,\
    \ all the projects are analyzed with default profiles. However, it is ideal to\
    \ have a profile for each project so that specific rules can be set or deactivated.\
    \ Each language has a default profile named Sonar way:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_292_0.png)\n\
    \n7. Click on the Rules tab to get more details about the existing rules available\
    \ in profiles:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_293_0.png)\n\n8. Click\
    \ on rule to get more insight into it:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_294_0.png)\n\
    \n- 9. Go to Quality Profiles and select the Sonar way default profile. Observe\
    \ the total Active and Inactive Rules.\n\n## Verifying HTML, CSS and JavaScript\
    \ validity using SonarQube\n\nYou are going to perform static code analysis on\
    \ the sample application that comprises HTML, CSS, and JavaScript files.\n\n##\
    \ Getting ready\n\n- 1. Go to the Jenkins dashboard and click on New Item.\n-\
    \ 2. Give the Name and select Freestyle project:\n\n## Enter an item name\n\n\
    SonarHTMLCSSJS\n\n» Required field\n\n- **Freestyle project**\n  This is the central\
    \ feature of Jenkins. Jenkins will build your project, combining any SCM with\
    \ any build system, and this can be even used for something other than software\
    \ build.\n- **Maven project**\n  Build a maven project. Jenkins takes advantage\
    \ of your POM files and drastically reduces the configuration.\n- **Pipeline**\n\
    \  Orchestrates long-running activities that can span multiple build slaves. Suitable\
    \ for building pipelines (formerly known as workflows) and/or organizing complex\
    \ activities that do not easily fit in free-style job type.\n- **External Job**\n\
    \  This type of job allows you to record the execution of a process run outside\
    \ Jenkins, even on a remote machine. This is designed so that you can use Jenkins\
    \ as a dashboard of your existing automation system.\n- **Multi-configuration\
    \ project**\n  ... for projects that need a large number of different configurations,\
    \ such as testing on multiple environments, platform-specific builds, etc.\n\n\
    3. Provide the Repository URL in the Source Code Management section:\n"
  mdcn: "\n3. 在命令行窗口中执行 `StartSonar.bat`，因为我们使用的是 Windows 操作系统：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_275_0.png)\n\
    \n如果启动成功，您将在控制台中看到“SonarQube is up”信息。\n\n- 一旦 SonarQube 启动并运行，请在浏览器中打开 `http://localhost:9000`\
    \ 访问 SonarQube 仪表盘。\n- 您可能希望查看 [https://docs.sonarqube.org/display/SONAR/Requirements](https://docs.sonarqube.org/display/SONAR/Requirements)\
    \ 上的要求，并在 [https://docs.sonarqube.org/display/SONAR/Setup+and+Upgrade](https://docs.sonarqube.org/display/SONAR/Setup+and+Upgrade)\
    \ 上进行设置和升级。\n\n## 将 Jenkins 与 SonarQube 集成\n\nSonarQube（以前称为 Sonar）是一款快速发展的应用程序，用于报告质量指标和发现代码热点。本教程详细介绍了如何通过\
    \ Jenkins 插件生成代码指标，然后直接将其推送到 Sonar 数据库。\n\n## 准备工作...\n\n- 1. 转到 Jenkins 仪表盘，点击“管理\
    \ Jenkins”。进入“管理插件”，在“可选插件”选项卡中找到 SonarQube 插件。\n- 2. 点击“不重启安装”：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_277_0.png)\n\
    \n- 3. 转到 Jenkins 仪表盘，点击“管理 Jenkins”。\n- 4. 点击“系统配置”，找到 SonarQube 部分。\n- 5. 现在，我们去\
    \ SonarQube 获取令牌，以便集成 Jenkins 和 SonarQube。\n- 6. 一旦 SonarQube 启动并运行，请在浏览器中打开 http://localhost:9000\
    \ 访问 SonarQube 仪表盘：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_277_1.png)\n\n\
    - 7. 点击“登录”，输入默认用户名和密码（admin/admin）以管理员身份登录。\n- 8. 点击“登录”：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_278_0.png)\n\
    \n- 9. 目前，SonarQube 仪表盘中还没有可用的项目。\n- 10. 点击 *Administration* 选项卡，在 Security 菜单中点击\
    \ Users：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_278_1.png)\n\n- 11. 最初，没有签发任何令牌；Administrator\
    \ 的令牌数为 0：\n\n## 12. 点击 Tokens：\n\nSCM Accounts\nGroups\nTokens\nAdministrator\
    \ admin\nsonar-administrators\nsonar-users\n0\nUpdate Tokens\n\n## 13. 在 Generate\
    \ Tokens 部分输入名称，然后点击 Generate：\n\nsonarqube Projects Issues Rules Quality Profiles\
    \ Quality Gates Administration Administrator\nAdministration\nConfiguration Security\
    \ Projects System\nUsers\nCreate and administer individual users.\nCreate User\n\
    Search\nSCM Accounts\nGroups\nTokens\nAdministrator admin\nsonar-administrators\n\
    sonar-users\n0\n1/1 shown\nEmbedded database should be used for evaluation purpose\
    \ only\nThe embedded database will not scale, it will not support upgrading to\
    \ newer versions of SonarQube, and there is no support for migrating your data\
    \ out of it into a different database engine.\nSonarQube™ technology is powered\
    \ by SonarSource SA\nVersion 6.3.1 (build 21392) - LGPL v3 - Community - Documentation\
    \ - Get Support - Plugins - Web API - About\n\n## 如何操作...\n\n- 1. 转到 Jenkins 仪表盘，点击“管理\
    \ Jenkins”。\n- 2. 点击“系统配置”，找到 SonarQube 部分。\n- 3. 点击“添加 SonarQube”。\n- 4. 提供名称、服务器\
    \ URL 和服务器版本。\n- 5. 将令牌值粘贴到 Jenkins 中并保存：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_281_0.png)\n\
    \n- 6. 转到“全局工具配置”，配置“添加 SonarQube Scanner”：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_281_1.png)\n\
    \n- 7. 现在，您已准备好对项目进行静态代码分析。\n\n## SonarQube 中的更新中心\n\n管理员可以利用更新中心通过安装插件和更新插件来保持\
    \ SonarQube 的最新状态。\n\n## 准备工作\n\n- 1. 转到 Administration | System | Update Center：\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_284_0.png)\n\n- 2. 更新中心包含四个选项卡：Installed、Updates\
    \ Only、Available 和 System Upgrades：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_285_0.png)\n\
    \n3. 如前所述，我们可以安装和更新不同的插件，以便执行静态代码分析。\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_287_0.png)\n\
    \n## 5. 点击 Restart：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_287_1.png)\n\n\
    ## 6. 重启 SonarQube：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_287_2.png)\n\n\
    ## 7. 等待服务器重启：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_287_3.png)\n\n8. 这样，我们就可以使用更新中心来安装、卸载和更新\
    \ SonarQube 中可用的插件。\n\n## 更多内容...\n\n- 1. 转到 Administration | System | Update\
    \ Center | Installed 选项卡，验证所有新安装的插件：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_288_0.png)\n\
    \n- 2. 您也可以从 Installed 选项卡卸载插件。\n\n## 质量门、质量配置文件和规则\n\n在本节中，我们将了解默认的质量门，它定义了代码分析通过或失败的基础标准，而质量配置文件则是针对特定编程语言的规则集。\n\
    \n## 如何操作...\n\n- 1. 目前，SonarQube 仪表盘中还没有可用的项目：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_291_0.png)\n\
    \n- 2. 质量门用于在组织中强制实施静态代码分析策略。\n- 3. “SonarQube 方式”是默认的质量门，您可以根据所需的策略将其分配给不同的项目。\n\
    - 4. 您还可以根据需求和要强制实施的策略添加条件：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_291_1.png)\n\
    \n- 5. 点击 Quality Profiles 选项卡，查看 SonarQube 中可用的默认质量配置文件详情。\n- 6. 质量配置文件是 SonarQube\
    \ 的核心；它只是一组特定于某语言的规则。如果没有明确说明，所有项目都将使用默认配置文件进行分析。然而，理想情况下，每个项目都应有一个配置文件，以便可以设置或停用特定规则。每种语言都有一个名为“Sonar\
    \ way”的默认配置文件：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_292_0.png)\n\n7. 点击\
    \ Rules 选项卡，了解更多关于配置文件中现有规则的详细信息：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_293_0.png)\n\
    \n8. 点击规则以获取更多相关信息：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_294_0.png)\n\n\
    - 9. 转到 Quality Profiles，选择 “Sonar way” 默认配置文件。观察总的启用规则和停用规则数量。\n\n## 使用 SonarQube\
    \ 验证 HTML、CSS 和 JavaScript 的有效性\n\n您将对一个包含 HTML、CSS 和 JavaScript 文件的示例应用程序执行静态代码分析。\n\
    \n## 准备工作\n\n- 1. 转到 Jenkins 仪表盘，点击“新建任务”。\n- 2. 输入名称并选择“自由风格项目”：\n\n## 输入任务名称\n\
    \nSonarHTMLCSSJS\n\n» 必填字段\n\n- **自由风格项目**\n  这是 Jenkins 的核心功能。Jenkins 将构建您的项目，将任何\
    \ SCM 与任何构建系统相结合，甚至可以用于软件构建之外的其他用途。\n- **Maven 项目**\n  构建 Maven 项目。Jenkins 利用您的\
    \ POM 文件，大大减少了配置。\n- **流水线**\n  编排可跨多个构建从属节点运行的长时间活动。适用于构建流水线（以前称为工作流）和/或组织不适合自由风格任务类型的复杂活动。\n\
    - **外部任务**\n  此任务类型允许您记录在 Jenkins 外部（甚至在远程机器上）运行的进程执行情况。这样您就可以将 Jenkins 用作现有自动化系统的仪表盘。\n\
    - **多配置项目**\n  ...适用于需要大量不同配置的项目，例如在多个环境中测试、特定平台的构建等。\n\n3. 在源代码管理部分提供仓库 URL：\n\
    \n"
