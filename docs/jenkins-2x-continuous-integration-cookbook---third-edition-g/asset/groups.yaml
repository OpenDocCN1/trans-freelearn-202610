    \ 定制外观和资源\n\n本技巧描述如何将内容覆盖到 Jenkins WAR 文件上。通过 WAR 覆盖，你可以更改 Jenkins 的外观和感觉，为企业品牌和主页内容配置做好准备。这里使用了添加自定义\
    \ favicon.ico（Web 浏览器地址栏中的图标）的基本示例。要包含更多内容，只需很少的功夫。\n\nJenkins 将其版本作为依赖项保存在 Maven\
