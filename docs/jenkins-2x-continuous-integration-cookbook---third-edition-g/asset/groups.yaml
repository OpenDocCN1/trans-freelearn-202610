    高级...


    ### 工作原理...


    让我们看看脚本是如何执行的：


    - 定义了一个警告字符串，并存储了当前日期。通过 `for` 语句以编程方式遍历 Jenkins 中的每个作业。

    - Jenkins 有一个类来存储构建运行信息。通过 `job.getLastSuccessfulBuild()` 获取运行时信息，并存储在 `lastSuccessfulBuild`
    实例中。如果没有发生成功构建，则 `lastSuccessfulBuild` 设置为 null；否则，它包含运行时信息。

    - 通过 `lastSuccessfulBuild.getTimestamp().getTime()` 获取最后一次成功构建的时间，并将其存储在 `time`
    实例中。


    将当前年份与最后一次成功构建的年份进行比较，如果它们不同且警告字符串尚未添加到作业描述的开头，则更新描述。


    Javadoc：


    你将在 [http://javadoc.jenkins-ci.org/hudson/model/Job.html](http://javadoc.jenkins-ci.org/hudson/model/Job.html)
    找到作业 API，并在 [http://javadoc.jenkins-ci.org/hudson/model/Run.html](http://javadoc.jenkins-ci.org/hudson/model/Run.html)
    找到运行信息。


    ## 安全管理


    在本章中，我们将介绍以下方案：


    - 通过 Jenkins 配置提高安全性

    - 配置授权 - 基于矩阵的安全性

    - 配置基于项目的矩阵授权策略

    - Jenkins 与 OpenLDAP 集成

    - Jenkins 与 Active Directory 集成

    - Jenkins 与 OWASP Zed Attack Proxy 集成

    - 测试 OWASP 十大安全问题

    - 通过模糊测试发现 Jenkins 中的 500 错误和 XSS 攻击

    - 使用 JCaptcha 避免注册机器人


    ### 简介


    在本章中，我们将讨论 Jenkins 的安全性，考虑到 Jenkins 可以运行在各种各样的基础设施中。我们还将研究如何扫描 Jenkins 编译的 Java
    代码所用库中的已知安全问题。


    唯一完全安全的系统是不存在的系统。对于真实服务，你需要注意不同可攻击面。Jenkins 的主要攻击面是其基于 Web 的图形用户界面，以及它与从节点和本地操作系统之间的信任关系。在线服务需要对其安全面给予高度重视。对于
    Jenkins，主要有三个原因：


    - Jenkins 能够通过其插件或主从拓扑与各种基础设施进行通信

    - 插件的代码变更速度很快，并且容易意外包含与安全相关的缺陷

    - 你需要加固默认安装


    另一个积极因素是，Jenkins 代码可免费供人审查，核心社区也时刻保持警惕。


    ### 通过 Jenkins 配置提高安全性


    在本节中，我们将介绍如何管理多个用户。


    '
