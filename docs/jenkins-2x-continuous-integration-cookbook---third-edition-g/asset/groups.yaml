    ## How it works...


    Behind the scene, the template creates all the resources that are required to
    host Jenkins, including virtual network, network security group, virtual machine,
    and so on, based on the best practices; and then Jenkins is installed and configured
    in a secured environment in Microsoft Azure.


    ## Installing Jenkins as a Service in Windows


    Installing Jenkins as a Windows service allows you to start Jenkins as soon as
    the machine starts, and regardless of who is interactively using Jenkins.


    ## Getting ready


    Install and configure Jenkins on Windows.


    ## How to do it...


    Follow these steps to install Jenkins as a service in Windows:


    +   1. Go to the Jenkins dashboard.

    +   2. Click on Manage Jenkins.

    +   3. Click on Install as Windows Service, as shown in the following diagram:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_59_0.png)


    +   4. Keep Installation Directory as the default and click on Install:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_59_1.png)


    +   5. Once Windows as a Service installation is successfully completed, click
    on Yes:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_59_2.png)


    +   6. Now Jenkins will be available as a service in the Windows system.


    ## How it works...


    Go to Control Panel and search for Services.


    Click on Services (Local) to view:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_60_0.png)


    Once the Jenkins service is available, you can right-click on it and start, stop,
    or restart services based on your requirements.


    ## Installing plugins in Jenkins


    Jenkins is an open source automation server that is widely used and extensible
    due to more than 400+ plugins. Plugins make Jenkins'' integration with other tools
    very easy. You can create your own plugins also.


    ## Getting ready


    There are various categories of plugins available, such as Source Code Management,
    Slave launchers and controllers, Build triggers, Build tools, Build notifies,
    Build reports, Other Post- build Actions, External site/tool integrations, UI
    plugins, Authentication and user management, Android development, iOS development,
    .NET development, Ruby development, Library plugins, and so on.


    ## How to do it...


    +   1. Go to the Jenkins dashboard. Click on Manage Jenkins and then Manage Plugins:


    ## Manage Jenkins


    +   - Configure System

    +   Configure global settings and paths.

    +   - Configure Global Security

    +   Secure Jenkins: define who is allowed to access/use the system.

    +   - Configure Credentials

    +   Configure the credential providers and types

    +   - Global Tool Configuration

    +   Configure tools, their locations and automatic installers.

    +   - Reload Configuration from Disk

    +   Discard all the loaded data in memory and reload everything from file system.
    Useful when you modified config files directly on disk.

    +   - Manage Plugins

    +   Add, remove, disable or enable plugins that can extend the functionality of
    Jenkins.

    +   - System Information

    +   Displays various environmental information to assist trouble-shooting.

    +   - System Log

    +   System log captures output from `java.util.logging` output related to Jenkins.

    +   - Load Statistics

    +   Check your resource utilization and see if you need more computers for your
    builds.


    2. Go to Available tab and select any plugin to install. Click on Install without
    restart:


