    # How it works...


    w3af is written by security professionals. It is a pluggable framework with extensions
    written for different types of attacks. The profiles define which plugins and
    their associated configurations you are going to use in the penetration test.


    You first attack using the OWASP_TOP10 profile and then attack again with a fuller
    set of plugins.


    The results will vary according to your setup. Depending on the plugin, security
    issues are occasionally flagged that do not exist. You will need to verify any
    issues mentioned by hand.


    At the time of writing, no significant defects were found using this approach.
    However, the tool pointed out slow links and generated server-side exceptions.
    This is the sort of information you would like to note in bug reports.'
