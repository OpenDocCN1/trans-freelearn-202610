    ## Signaling the need to archive


    Each development team is unique. Teams have their own way of doing business. In
    many organizations, there are one-off tasks that need to be done periodically.
    For example, at the end of each year, making a full backup of the entire filesystem.


    This recipe details a script that checks for the last successful run of any job;
    if the year is different to the current year, then a warning is set at the beginning
    of the job''s description. Thus, it is hinting to you that it''s time to perform
    an action, such as archiving and then deleting. You can of course programmatically
    do the archiving. However, for high-value actions, it is worth forcing interceding,
    letting the Groovy scripts focus your attention.


    ### How to do it...


    - 1. Within the Manage Jenkins page, click on the Script Console link and run
    the following script:

    - 2. Provide the script in Script Console and click on Run:


    ```groovy

    def warning=''[You can ARCHIVE this Job]''

    def now=new Date()


    for (job in hudson.model.Hudson.instance.items) {

    println "\nName: ${job.name}"

    Run lastSuccessfulBuild = job.getLastSuccessfulBuild()

    if (lastSuccessfulBuild != null) {

    def time = lastSuccessfulBuild.getTimestamp().getTime()

    if (now.year.equals(time.year)){

    println("Project has same year as build");

    }else {

    if (job.description.startsWith(warning)){

    println("Description has already been changed");

    }else{

    job.setDescription("${warning}")

    }

    }

    }

    }

    ```


