    \nGet Credentials Names\n\nAWS Region\n\nus-east-1\n\nAWS Region Text\n\nApplication\
    \ Name\n\npetclinic\n\npetclinic\n\nGet Available Applications\n\nEnvironmentLookup\n\
    \n#### Get Environments By Name\n\nEnvironment Names\n\ne-y2fmvwri3n\n\npetclinic\n\
    \nGet Available Environments\n\n7. Save the configuration and click on **Build\
    \ now**.\n\n8. Now, let's go to the AWS management console to check whether the\
    \ WAR file is being copied in Amazon S3 or not:\n\n9. Go to S3 Services and check\
    \ the available buckets:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_416_0.png)\n\
    \n10. Since the WAR file is large, it will take a while to upload to Amazon S3.\
    \ Once it is uploaded, it will be available in the Amazon S3 bucket.\n\n11. Check\
    \ the build job's execution status in Jenkins. Some sections of the expected output\
    \ are the following:\n\n- The test case execution and WAR file creation were successful\n\
    - The build was successful\n\n12. Now, check the AWS management console:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_418_0.png)\n\
    \n16. Once the application deployment is successful, terminate the environment.\
    \ Go to Specific environment and click on **Actions** to **Terminate** the environment.\
    \ We have successfully deployed our application on Elastic Beanstalk.\n\n## Deploying\
    \ a WAR file from Jenkins to Azure App Services\n\nMicrosoft Azure App services\
    \ is a PaaS. In this section, we will look at the Azure web app and how we can\
    \ deploy our PetClinic application.\n\n## Getting ready\n\nWe need to have a Microsoft\
    \ Azure subscription. Go to App Services and click **+ Add**:\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_420_0.png)\n\
    \nThen, click on **Create**:\n\n### Web App\n\nMicrosoft\n\nCreate and deploy\
    \ web sites in seconds, as powerful as you need them.\n\nLeverage your existing\
    \ tools to create and deploy applications without the hassle of managing infrastructure.\
    \ Microsoft Azure Web Sites offers secure and flexible development, deployment,\
    \ and scaling options for any sized web application. Use frameworks and templates\
    \ to create web sites in seconds. Choose from source control options like TFS,\
    \ GitHub, and BitBucket. Use any tool or OS to develop your site with .NET, PHP,\
    \ Node.js or Python.\n\n- Fastest way to build for the cloud\n- Provision and\
    \ deploy fast\n- Secure platform that scales automatically\n- Great experience\
    \ for Visual Studio developers\n- Open and flexible for everyone\n- Monitor, alert,\
    \ and auto scale (preview)\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_421_0.png)\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_421_1.png)\n\nCreate\n\nGo to the Microsoft\
    \ Azure portal at https://portal.azure.com. Click on App Services and then on\
    \ **+ Add**. Provide values for App name, Subscription, Resource Group, and App\
    \ Service plan/Location. Then, click on **Create**.\n"
  mdcn: "\n\n## 从 Jenkins 部署 WAR 文件到 Tomcat\n\n对于应用程序部署，我们可以使用多种方法将应用部署到 Web 服务器或应用服务器。我们可以使用批处理脚本或\
    \ shell 脚本复制持续集成过程后创建的包文件，也可以使用 Jenkins 插件部署应用。\n\n## 准备工作\n\n转到“管理 Jenkins |\
    \ 管理插件”并安装“Deploy to container Plugin”：\n\n| 安装 ↓ | 名称 | 版本 |\n|---|---|---|\n\
    | Deploy to container Plugin | 1.10 |\n| Deploy to Websphere container Plugin\
    \ | 1.0 |\n\n筛选器：Deploy to  \n选项卡：更新、可用、已安装、高级  \n按钮：不重启安装、立即下载并在重启后安装、立即检查  \n\
    更新信息获取时间：1天2小时前\n\n等待插件成功安装。\n\n5. 使用 Jenkins 插件指定要部署的 WAR 文件路径。从“构建后操作”中选择**将\
    \ war/ear 部署到容器**。点击**添加容器**并选择最新版本的 Tomcat。输入 Tomcat URL。输入我们在 `tomcat-users.xml`\
    \ 中定义的用户名和密码：\n\n6. 通过点击**立即构建**执行构建。验证应用程序部署的日志：\n\n```\nResults :\n\nTests run:\
    \ 59, Failures: 0, Errors: 0, Skipped: 0\n\n[INFO]\n[INFO] --- maven-war-plugin:2.3.1:war\
    \ (default-war) @ spring-petclinic ---\n[INFO] Packaging webapp\n[INFO] Assembling\
    \ webapp [spring-petclinic] in [d:\\jenkins\\workspace\\PetClinic-Test\\target\\\
    spring-petclinic-4.2.5-SNAPSHOT]\n[INFO] Processing war project\n[INFO] Copying\
    \ webapp resources [d:\\jenkins\\workspace\\PetClinic-Test\\src\\main\\webapp]\n\
    [INFO] Webapp assembled in [1669 msecs]\n[INFO] Building war: d:\\jenkins\\workspace\\\
    PetClinic-Test\\target\\spring-petclinic-4.2.5-SNAPSHOT.war\n[INFO] ------------------------------------------------------------------------\n\
    [INFO] BUILD SUCCESS\n[INFO] ------------------------------------------------------------------------\n\
    [INFO] Total time: 28.772 s\n[INFO] Finished at: 2016-07-06T22:59:37+05:30\n[INFO]\
    \ Final Memory: 29M/261M\n[INFO] ------------------------------------------------------------------------\n\
    Deploying d:\\jenkins\\workspace\\PetClinic-Test\\target\\spring-petclinic-4.2.5-SNAPSHOT.war\
    \ to container Tomcat 7.x Remote\n[d:\\jenkins\\workspace\\PetClinic-Test\\target\\\
    spring-petclinic-4.2.5-SNAPSHOT.war] is not deployed.\nDoing a fresh deployment.\n\
    \  Deploying [d:\\jenkins\\workspace\\PetClinic-Test\\target\\spring-petclinic-4.2.5-SNAPSHOT.war]\n\
    Finished: SUCCESS\n```\n\n7. 打开浏览器，使用 Tomcat URL 和应用程序上下文访问该应用：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_410_0.png)\n\
    \n8. 在下一节中，我们将把 PetClinic 应用部署到位于 AWS EC2 实例中的 Tomcat。\n\n## 从 Jenkins 部署 WAR\
    \ 文件到 AWS Beanstalk\n\nAWS Elastic Beanstalk 是一种**平台即服务（PaaS）**。我们将使用它部署 PetClinic\
    \ 应用。以下是在 AWS Elastic Beanstalk 上部署应用需要遵循的步骤：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_411_0.png)\n\
    \n## 准备工作\n\n让我们在 Elastic Beanstalk 中创建一个示例应用，以了解 Elastic Beanstalk 的工作原理。然后，我们将使用\
    \ Jenkins 插件将应用部署到其中。\n\n在 AWS 管理控制台中点击**服务**，选择**AWS Elastic Beanstalk**。创建一个名为\
    \ `petclinic` 的新应用。选择**Tomcat**作为平台，并选择**示例应用**单选按钮：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_412_0.png)\n\
    \n验证创建示例应用的事件顺序：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_412_1.png)\n\n这需要一些时间，一旦环境创建完成，它将以绿色高亮显示：\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_413_0.png)\n\n点击 petclinic 环境，并在仪表板中验证运行状况和运行版本：\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_413_1.png)\n\n验证环境 ID 和 URL。点击该 URL\
    \ 并验证默认页面：\n\n## 恭喜\n\n您的第一个 AWS Elastic Beanstalk 应用现在已在 AWS 云中您自己的专属环境中运行。\n\
    \n### 下一步是什么？\n\n- 了解如何使用 AWS Elastic Beanstalk 构建、部署和管理您自己的应用\n- AWS Elastic\
    \ Beanstalk 概念\n- 了解如何创建新的应用版本\n- 了解如何管理您的应用环境\n\n### 下载 AWS 参考应用\n\n- 使用 AWS\
    \ SDK for Java 探索一个功能完整的参考应用\n\n### 适用于 Eclipse 的 AWS 工具包\n\n- 开发人员可以直接从 Eclipse\
    \ 构建和部署 AWS Elastic Beanstalk 应用\n- 通过观看此视频开始使用 Eclipse 和 AWS Elastic Beanstalk\n\
    - 查看所有 AWS Elastic Beanstalk 文档\n\n## 操作步骤...\n\n1. 安装 AWS Elastic Beanstalk Publisher\
    \ 插件。更多详细信息，请访问 https://wiki.jenkins-ci.org/display/JENKINS/AWS+Beanstalk+Publisher+Plugin：\n\
    \n2. 在“构建后操作”中会出现一个用于 Elastic Beanstalk 的新区域。\n\n3. 点击 Jenkins 仪表板并选择“凭据”；添加您的\
    \ AWS 凭据。\n\n4. 转到您的 Jenkins 构建，并选择在全局配置中设置的 AWS 凭据。\n\n5. 从列表中选择 AWS 区域，然后点击**获取可用应用程序**。由于我们已经创建了一个示例应用，它将像下面这样显示。\n\
    \n6. 在**环境查找**中，于**按名称获取环境**框中提供环境 ID，然后点击**获取可用环境**：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_415_0.png)\n\
    \n### Elastic Beanstalk 应用程序\n\nAWS 凭据\n\nAWS：AKI\n\n按名称查找 AWS 凭据\n\n获取凭据名称\n\n\
    AWS 区域\n\nus-east-1\n\nAWS 区域文本\n\n应用程序名称\n\npetclinic\n\npetclinic\n\n获取可用应用程序\n\
    \n环境查找\n\n#### 按名称获取环境\n\n环境名称\n\ne-y2fmvwri3n\n\npetclinic\n\n获取可用环境\n\n7. 保存配置并点击**立即构建**。\n\
    \n8. 现在，让我们转到 AWS 管理控制台，检查 WAR 文件是否正在复制到 Amazon S3：\n\n9. 转到 S3 服务并检查可用的存储桶：\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_416_0.png)\n\n10. 由于 WAR 文件较大，上传到 Amazon\
    \ S3 需要一些时间。上传完成后，它将出现在 Amazon S3 存储桶中。\n\n11. 在 Jenkins 中检查构建任务的执行状态。预期输出的部分内容如下：\n\
    \n- 测试用例执行和 WAR 文件创建成功\n- 构建成功\n\n12. 现在，检查 AWS 管理控制台：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_418_0.png)\n\
    \n16. 应用程序部署成功后，请终止环境。转到特定环境，点击**操作**中的**终止**来终止环境。至此，我们已成功在 Elastic Beanstalk\
    \ 上部署了应用。\n\n## 从 Jenkins 部署 WAR 文件到 Azure 应用服务\n\nMicrosoft Azure 应用服务是一种 PaaS。在本节中，我们将了解\
    \ Azure Web 应用以及如何部署我们的 PetClinic 应用。\n\n## 准备工作\n\n我们需要有一个 Microsoft Azure 订阅。转到“应用服务”并点击**+\
    \ 添加**：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_420_0.png)\n\n然后，点击**创建**：\n\
    \n### Web 应用\n\nMicrosoft\n\n在数秒内创建和部署网站，功能强大，满足您的需求。\n\n利用现有工具创建和部署应用，无需管理基础架构的麻烦。Microsoft\
    \ Azure Web Sites 为任意规模的 Web 应用提供安全、灵活的开发、部署和扩展选项。使用框架和模板，在数秒内创建网站。从 TFS、GitHub、BitBucket\
    \ 等源代码控制选项中进行选择。使用任何工具或操作系统，通过 .NET、PHP、Node.js 或 Python 开发您的网站。\n\n- 构建云应用的最快方式\n\
    - 快速预置和部署\n- 可自动扩展的安全平台\n- 为 Visual Studio 开发人员提供出色体验\n- 对所有人开放且灵活\n- 监控、警报和自动扩展（预览）\n\
    \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_421_0.png)\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_421_1.png)\n\
    \n创建\n\n转到 Microsoft Azure 门户 https://portal.azure.com。点击“应用服务”，然后点击**+ 添加**。为“应用名称”、“订阅”、“资源组”和“应用服务计划/位置”提供值。然后，点击**创建**。\n\
    \n"
