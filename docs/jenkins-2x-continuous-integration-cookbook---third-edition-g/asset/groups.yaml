  - '[PAGE 584]


    # Making noise with HTML5 browsers


    This recipe describes how to send a custom sound to a Jenkins user''s browser
    when an event occurs, such as a successful build. You can also send sound messages
    at arbitrary times. Not only is this good for developers who enjoy being shouted
    at, sang at by famous actors, and so on, but also for system administrators who
    are looking for a computer in a large server farm.'
  - '[PAGE 585]


    # # Getting ready


    Install the Jenkins sounds plugin ([https://wiki.jenkins-ci.org/display/JENKINS/Jenkins+Sounds+plugin](https://wiki.jenkins-ci.org/display/JENKINS/Jenkins+Sounds+plugin)).
    Make sure that you have a compliant web browser installed, such as a current version
    of Firefox or Chrome.


    For more details of HTML5 compliancy in browsers, consider reviewing: [http://en.wikipedia.org/wiki/Comparison_of_layout_engines_%28HTML5%29](http://en.wikipedia.org/wiki/Comparison_of_layout_engines_%28HTML5%29).'
  - '[PAGE 586]


    # How to do it...


    +   1. Log in as a Jenkins administrator and visit the Configure System screen
    `/configure`.

    +   2. Under the Jenkins Sound section, check Play through HTML5 Audio enabled
    Browser.


    If Jenkins has problems finding the sound archive with an error message such as
    `File not found ''file:/C:/Users/Alan/.jenkins/jar:file:/C:/Users/Alan/.jenkins/plugins/sounds/WEB-INF/lib/classes.jar/sound-archive.zip''`,
    then unzip the `classes.jar` file and move the `sounds-archive.zip` file to the
    same directory mentioned in the error message. Finally, point the configuration
    to the archive, for example, `file:/C:/Users/Alan/.jenkins/plugins/sounds/WEB-INF/lib/sound-archive.zip`.


    +   3. Click on the Save button.

    +   4. Select the Job creation link found on the Jenkins home page.

    +   5. Create a New Job with the Job name `ch4.sound`.

    +   6. Select Build a free-style software project.

    +   7. Click on OK.

    +   8. In the Post-build Actions section, check the Jenkins Sounds option.

    +   9. Add two sounds: EXPLODE and doh.

    +   10. Click on Save.

    +   11. Click on the Build now link.

    +   12. On success, your browser will play the `EXPLODE` wav file.

    +   13. Edit your job so that it fails, for example, by adding a non-existent
    source code repository.

    +   14. Build the job again. On failure, your web browser will play the `doh`
    wav file.'
  - "[PAGE 587]\n\n# # How it works...\n\nYou have successfully configured your job\
    \ to play different sounds based on the success or failure of the build.\n\nYou\
    \ can refine how the plugin reacts further by configuring which event transitions\
    \ will trigger a sound, for example, if the previous build result was a failure\
    \ and the current build result is a success. This is defined in the For previous\
    \ build result set of checkboxes.\n\nThe plugin works as a page decorator. It\
    \ adds the following JavaScript that asynchronously polls for new sounds. Your\
    \ browser is doing the majority of the work, freeing server resources:\n\n```\n\
    ```html\n<script src=\"/sounds/script\"\n     type=\"text/javascript\"></script><script\
    \ type=\"text/javascript\"\n     defer=\"defer\">function _sounds_ajaxJsonFetcherFactory(onSuccess,\n\
    \     onFailure) {\nreturn function() {\nnew Ajax.Request(\"/sounds/getSounds\"\
    , {\nparameters: { version: VERSION },\nonSuccess: function(rsp) {\nonSuccess(eval('x='+rsp.responseText))\n\
    },\nonFailure: onFailure\n});\n}\n}\nif (AUDIO_CAPABLE) {\n    _sounds_pollForSounds(_sounds_ajaxJsonFetcherFactory);\n\
    }</script>\n```\n```"
