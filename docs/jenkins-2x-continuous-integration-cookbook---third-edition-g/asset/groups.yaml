    ## 关于作者


    **Mitesh Soni** 是一位热爱学习的 IT 行业从业者，拥有 10 年经验。他是 SCJP、SCWCD、VCP、IBM UrbanCode 和
    IBM Bluemix 认证专业人士，也是认证 Scrum 大师。他热爱 DevOps 和云计算，也对 Java 编程感兴趣。他认为设计模式非常迷人。他相信一图胜千言。


    他偶尔为 etutorialsworld.com 贡献内容。他喜欢和孩子们玩耍，摆弄他的相机，并在 Indroda Park 拍照。他沉迷于拍照，却不了解太多技术细节。他生活在圣雄甘地家乡的首府。


    Mitesh 还与 Packt 合著了以下书籍：


    - Jenkins Essentials, Second Edition

    - DevOps Bootcamp

    - Implementing DevOps with Microsoft Azure

    - DevOps for Web Development

    - Jenkins Essentials

    - Learning Chef


    > “在我职业生涯中，我已经投丢了超过 9,000 次投篮。我输掉了几乎 300 场比赛。26 次，我被信任去投出制胜球并且投丢了。我在生活中一次又一次地失败。而这就是我成功的原因。”

    >

    > — Michael Jordan.


    **Alan Mark Berg**, BSc, MSc, PGCE，自 1998 年以来一直担任阿姆斯特丹大学中央计算机服务部的首席开发人员。他目前在一项创新工作组中工作，该工作组加速了新颖且令人兴奋的服务的创建。在他那极其稀缺的业余时间里，他从事写作。Alan
    拥有学士学位、两个硕士学位、教学资格和质量保证认证。他还与 Packt Publishing 合著了两本关于 Sakai (http://sakaiproject.org)
    的书籍，Sakai 是一款备受成功的开源学习管理平台，被全球数百万学生使用。他曾获得多个奖项，包括 Sakai 奖学金和 Sakai 教学创新奖 (TWSIA)。


    Alan 喜欢与人才合作；这迫使他提升自己的能力。这种动力就是 Alan 喜欢在充满活力的开源兴趣社区中工作的原因。截至撰写本文时，他是 Apereo 基金会的董事会成员，并担任其学习分析倡议
    (https://confluence.sakaiproject.org/display/LAI/Learning+Analytics+Initiative)
    的社区负责人。


    在之前的职业生涯中，Alan 曾担任 QA 总监、技术作家、互联网/Linux 课程作者、产品线开发官和教师。他喜欢亲手构建、粘合系统、探索数据并将其转化为可操作的资讯。他通过破坏各种开发和验收环境并在技术机遇的绿野中横冲直撞来保持敏捷。


    ## 关于审阅者


    **Juan Vicente Herrera Ruiz de Alejo** 拥有计算机科学学位。他是马德里 DevOps 聚会的负责人。他是马德里阿卡莱哈德埃纳雷斯大学
    DevOps 硕士项目的教师，并在过去 12 年里一直在 IT 公司工作。


    他还作为志愿者在一家致力于抗击乳腺癌的非政府组织工作。


    他目前在 Logtrust.com 工作，曾在 Colt telecom、Everis 和 BBVA 等公司工作过。


    _I would like to thank my wife, Emma, and my entire family for all their support._


    **Javier Delgado** 是一名自动化狂热者、持续任务（检查、测试和交付）传教士，以及永恒的新知识成瘾者。


    他担任 ING Bank NV 的持续交付专家。


    ## www.PacktPub.com


    有关本书的支持文件和下载，请访问 www.PacktPub.com。


    您知道 Packt 提供每本出版书籍的电子书版本吗？提供 PDF 和 ePub 文件？您可以在 www.PacktPub.com 升级到电子书版本，作为印刷书籍客户，您有权享受电子书的折扣。请通过
    service@packtpub.com 与我们联系了解更多详情。


    在 www.PacktPub.com，您还可以阅读大量免费技术文章，订阅各种免费通讯，并获得 Packt 书籍和电子书的独家折扣和优惠。


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_6_0.png)


    https://www.packtpub.com/mapt


    使用 Mapt 获得最受欢迎的软件技能。Mapt 让您完全访问 Packt 的所有书籍和视频课程，以及帮助您规划个人发展和推进职业生涯的行业领先工具。


    ## 为什么订阅？


    - 在 Packt 出版的每本书中完全可搜索

    - 复制、粘贴、打印和书签内容

    - 按需访问，并通过网络浏览器访问


    ## 客户反馈


    感谢您购买这本 Packt 书籍。在 Packt，质量是我们编辑流程的核心。为了帮助我们改进，请在本书的亚马逊页面 https://www.amazon.com/dp/1788297946
    上留下诚实的评价。


    如果您想加入我们的常驻审阅者团队，您可以发送电子邮件至 customerreviews@packtpub.com。我们会用免费的电子书和视频作为对您宝贵反馈的回报。帮助我们无情地改进我们的产品！


    我将这本书献给所有那些空荡的公交车站、长椅、自行车、相机、道路和树木，他们见证了我的愤怒、情感、爱和敌意。没有他们，人们就会遇到真正的我（双关语）。


    我提前道歉，如果我遗漏了任何名字。我已尽力回忆与我分享美好回忆的每一个名字。我没有很好的“记忆”，这有时是祝福也是诅咒。


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_8_0.png)


    说正经的，我想将这本书献给 Shreyansh（Shreyu-我妹妹 Jigisha 的宝贝儿子）向我展示了天真和微笑的力量，Vinay Kher 教我如何不断改进并一直保留我的短信，我的父母始终默默在那里为我祈祷，Simba（Priyanka
    Agashe）一直支持和鼓励我并强迫我相信自己，印度陆军和所有身着制服的勇敢士兵保护我们。


    Ashita A, Sourabh Mishra 和 Gowri，感谢你们在需要时向我照出镜子。我珍惜你们在我生活中的存在。和你们一起学习生活很有趣。我可能第二天就忘记了你们教给我的所有东西。对不起我幼稚，但我无法改变。


    我非常感谢 Rinka, Bhagyashri, Avanti, Aishwarya P, Vijay, Priya, Harshal, Tejas, Sharvil
    P, Apoorva S, Nandan, Bhavna, Vishakha S, Pradnya B, Viral I, Chaitali, Sudeep,
    Amit R, Manisha Y, Vaishnavi, Parinda, Arpita, Jinesh, Vihan, Saurabh S, 和 Raghav
    H，他们多年来一直帮助我，让我微笑，让我的生活更轻松。


    我想说谢谢……并分享我对我所得到的一切祝福的感激。我想感谢 Jigisha-Nitesh, Dada-Dadi, Priyanka-Hemant, Anupama-Mihir,
    Nalini 和家人, Kim 和 Yaashi, Kirti, Bindiya, Jai Jamba, Nitesh, Munal, Ashish B,
    Mayur Mothliya, Rohini, Aakanksha, Yohan Wadia, Rohan C, Chintan Solanki, Vijay
    Patel, Nikul, Paresh, Raju, Yogendra, Ajay, Ruchi, Navrang O, Dharmesh R, 我的村庄朋友,
    Prakash, Mitul, Kanak, Bapu, Ravi, Vimal, Chitrang, Krimali, Saputara Group, Subhash,
    Ranjit, Rangusinh, Setan, Jayesh 和他的家人, Ramesh 和他的家人, Vijay Prajapati, Munni Bhabhi
    和她的家人以及老师们。


    Divya, Deepti, 和 Sneha……如果没有你们，这一切都不可能实现。感谢你们激励我并让我保持警惕。


