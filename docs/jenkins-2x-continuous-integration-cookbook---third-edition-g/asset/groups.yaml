    \ Results 选项卡。\n\n## 工作原理...\n\nw3af 由安全专业人士编写。它是一个可插拔的框架，带有针对不同类型攻击编写的扩展。配置文件定义了你在渗透测试中将使用哪些插件及其相关配置。\n\
    \n你首先使用 OWASP_TOP10 配置文件进行攻击，然后使用更完整的插件集再次攻击。\n\n结果将根据你的设置而有所不同。根据插件不同，有时会标记出不存在的问题。你需要手动验证提到的任何问题。\n\
    \n在撰写本文时，使用这种方法没有发现重大缺陷。但是，该工具指出了缓慢的链接并生成了服务器端异常。这是你希望在错误报告中记录的信息类型。\n\n## 更多内容...\n\
    \n持续保护你的应用程序需要经验丰富的对细节的关注。这里还有一些内容供你查看。\n\n### 使用 WebGoat 进行靶机练习\n\n十大安全缺陷列表有时看起来难以理解。如果你有空闲时间并且想针对一个故意不安全的应用程序进行练习，你应该尝试\
    \ WebGoat（[https://www.owasp.org/index.php/Category:OWASP_WebGoat_Project](https://www.owasp.org/index.php/Category:OWASP_WebGoat_Project)）。\n\
    \nWebGoat 文档完善，带有提示系统和视频教程链接；它几乎不会让你对攻击产生误解。\n\n### 行业中的更多工具\n\nw3af 是一个强大的工具，但与以下工具配合使用时效果更好：\n\
    \n- **Nmap** (http://nmap.org/): 一个易于使用、非常受欢迎、屡获殊荣的网络扫描器。\n- **Nikto** (http://cirt.net/nikto2):\
    \ 一个 Perl 脚本，可快速汇总系统详细信息并查找最明显的缺陷。\n- **Skipfish** (https://code.google.com/p/skipfish/downloads/list):\
    \ 一个 C 程序，可在长时间内处理大量请求。你可以从不同的攻击字典中进行选择。这是一个极好的穷人压力测试；如果你的系统保持运行，你就知道它已达到最低稳定性水平。\n\
    - **Wapiti** (http://wapiti.sourceforge.net/): 一个基于 Python 的脚本，可发现可攻击的 URL，然后循环遍历一系列恶意参数。\n\
    \nJenkins 非常灵活，因此你可以通过作业中运行的脚本调用各种工具，包括提到的安全工具。\n\n有许多保护原生操作系统的好资源，包括 Debian 安全指南（https://www.debian.org/doc/manuals/securing-debian-howto/）；对于\
    \ Windows，有 MSDN 安全中心下的文章（http://msdn.microsoft.com/en-us/security/）；对于 Mac，有\
    \ Apple 官方安全指南（https://www.apple.com/support/security/guides/）。在线服务需要密切关注其安全攻击面。\n\
    \n## 通过模糊测试在 Jenkins 中发现 500 错误和 XSS 攻击\n\n本教程介绍如何使用模糊测试器在 Jenkins 服务器中查找服务器端错误和\
    \ XSS 攻击。\n\n模糊测试器会遍历一系列 URL，盲目附加不同的参数，并检查服务器的响应。输入的参数是脚本命令的变体，例如 `<script>alert(\"\
    random string\");</script>`。如果服务器的响应包含未转义的脚本版本，则表明发现了攻击向量。\n\n跨站脚本攻击目前是较流行的攻击形式之一（http://en.wikipedia.org/wiki/Cross-site_scripting）。该攻击涉及将脚本片段注入客户端的浏览器，使脚本运行起来就像来自受信任的网站。例如，一旦你登录应用程序，你的会话\
    \ ID 很可能存储在 cookie 中。注入的脚本可能会读取 cookie 中的值，然后将信息发送到另一台服务器，以便尝试重用。\n\n模糊测试器会发现在其攻击的网站上的链接以及网站网页中存在的表单变量。对于发现的网页，它基于历史攻击和大量微小变体反复发送输入。如果响应与发送的相同随机字符串一起返回，模糊测试器就知道它发现了一个恶意\
    \ URL。\n\n为了与基于 Web 的应用程序的构建过程完全集成，你需要构建应用程序、部署并运行应用程序、通过脚本运行模糊测试器，最后，如果输出中提及恶意\
    \ URL，则使用日志解析来使构建失败。此过程与你希望集成的其他命令行工具类似。有关日志解析的更多信息，请参阅第 1 章“开始使用 Jenkins”中的 *通过日志解析故意使构建失败*\
    \ 配方。\n\n### 准备工作\n\n备份你的牺牲 Jenkins 服务器并关闭其安全设置。预计在攻击结束时应用程序会不稳定。\n\n你需要在计算机上安装\
    \ Python 编程语言。要下载并安装 Wapiti，你需要遵循 http://wapiti.sourceforge.net 上的说明。\n\n如果你是在本机攻击本机，那么你可以关闭其网络功能。攻击将停留在回环网络驱动器中，并且不会有数据包逃逸到互联网。\n\
    \n在本教程中，方法论和命令行选项是正确的。然而，在撰写本文时，提到的结果可能不存在。Jenkins 经历了一个快速的生命周期，开发人员会迅速移除错误。\n\
    \n### 如何操作...\n\n1. 在 wapiti bin 目录中，运行以下命令：\n\n   ```bash\n   python wapiti http://localhost:8080\
    \ -m \"-all,xss,exec\" -x http://localhost:8080/pluginManager/* -v2\n   ```\n\n\
    2. 命令运行完毕后，你将在控制台输出中看到最终报告的位置：\n\n   ```\n   Report\n   !!!!\n   A report has\
    \ been generated in the file\n   ~/.wapiti/generated_report\n   You can open ~/.wapiti/generated_report/index.html\
    \ with a browser to see this report.\n   ```\n\n3. 在 Web 浏览器中打开报告并查看它。\n4. 点击\
    \ Internal Server Error 链接。\n5. 对于名为“在 /iconSize 中发现异常”的条目之一，从 URL command line\
    \ 选项卡复制 URL。\n6. 在 Web 浏览器中打开该 URL。现在你将看到一个新生成的 Jenkins 错误报告页面，如下图所示。\n7. 运行以下命令：\n\
    \n   ```bash\n   python wapiti http://localhost:8080 -m \"-all,xss,permanentxss\"\
    \ -x http://localhost:8080/pluginManager/*\n   ```\n\n8. 查看输出以确认 permanentxss\
    \ 模块已运行：\n\n   ```\n   [*] Loading modules :\n   mod_crlf, mod_exec, mod_file,\
    \ mod_sql, mod_xss,      mod_backup, mod_htaccess,\n   mod_blindsql, mod_permanentxss,\
    \ mod_nikto\n   [+] Launching module xss\n   [+] Launching module permanentxss\n\
    \   ```\n\n"
