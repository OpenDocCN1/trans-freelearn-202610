    5. 将刷新时间设置为 20 秒。

    6. 点击“Show Job descriptions”。

    7. 点击 OK。

    8. 尝试调整设置（尤其是字体的像素大小）。优化视图取决于所使用的显示器以及观众观看显示器的距离，如下面的截图所示：


