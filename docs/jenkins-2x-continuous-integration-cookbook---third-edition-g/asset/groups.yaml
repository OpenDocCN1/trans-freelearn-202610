    ## There''s more...


    Monitoring is the foundation of comprehensive testing and troubleshooting. This
    section explores the relationship between these issues and the measurements exposed
    in the plugin.


    ## Troubleshooting with JavaMelody - memory


    Your Jenkins server can at times have memory issues due to greedy builds, leaky
    plugins, or some hidden complexity in the infrastructure. JavaMelody has a comprehensive
    range of memory measurements, including a heap dump and a memory histogram.


    The Java virtual machine divides memory into various areas and, to clean up, it
    removes objects that have no references to other objects. Garbage collection can
    be CPU-intensive when it is busy, and the nearer to consumption of full memory,
    the busier garbage collection becomes. To an external monitoring agent, this looks
    like a CPU spike that is often difficult to track down. Just because the garbage
    collector manages memory, it is also a fallacy to believe that there is no potential
    for memory leakage in Java. Memory can be held for too long by many common practices
    such as custom caches or calls to native libraries.


    Slow burning memory leaks will show up as gentle slopes on memory-related evolution
    graphs. If you suspect that you have a memory leak, then you can get the plugin
    to force a full garbage collection through the Execute the garbage collector link.
    If it is not a memory leak, the gentle slope will abruptly fall.


    Memory issues can also express themselves as large CPU spikes as the garbage collector
    frantically tries to clean up, but can barely clean enough space. The garbage
    collector can also pause the application while comprehensively looking for no-longer
    referenced objects ("stop the world garbage collection"), thus causing long response
    times for web browser requests. This can be seen through the mean and max times
    in Statistics http - 1 day.


    ## Troubleshooting with JavaMelody - painful jobs


    You should consider the following points:


    - **Offload work:** For a stable infrastructure, offload as much work from the
    master instance as possible. If you have scheduled tasks, keep the heaviest ones
    separate in time. Time separation not only evens out load, but also makes finding
    the problematic build easier through the observation of the evolution charts of
    JavaMelody. Also consider spatial separation; if a given node or a labeled set
    of nodes shows problematic issues, then start switching around the machine location
    of jobs and view their individual performance characteristics through http://host:port/monitoring/nodes.

    - **Hardware is cheap:** Compared to paying for human hours, buying an extra 8
    GB is roughly equivalent to one man hour''s effort.


    A common gotcha is to add memory to the server, while forgetting to update the
    init scripts to allow Jenkins to use more memory.


    - **Review the build scripts:** Javadoc generation and custom Ant scripts can
    fork JVMs and reserve memory defined within their own configuration. Programming
    errors can also be the cause of frustration. Don''t forget to review JavaMelody''s
    report on Statistic system error log and Statistic http system errors.

    - **Don''t forget external factors:** Factors include backups, cron jobs, updating
    the locate database, and network maintenance. These will show up as periodic patterns
    in the evolution charts.

    - **Strength in numbers:** Use JavaMelody in combination with the disk usage plugin
    and others to keep a comprehensive overview of the vital statistics. Each plugin
    is simple to configure, but their usefulness to you will grow more quickly than
    the maintenance costs of adding extra plugins.


    ## Monitoring a Jenkins Job using a Build Monitor View


    The `Build Monitor` plugin provides a visualization of the status and progress
    of selected Jenkins jobs. It displays an updated view automatically every couple
    of seconds using AJAX. It can easily accommodate different computer screen sizes
    too.

