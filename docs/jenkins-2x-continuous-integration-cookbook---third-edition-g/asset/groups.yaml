    exec 模块非常擅长发现 Jenkins 中的 500 错误。这主要是因为意外输入，而 Jenkins 对此处理得并不好。这纯粹是一组外观问题。但是，如果你开始看到与文件或数据库服务等资源相关的错误，那么你应该优先处理这些问题并提交错误报告。


    `-x` 选项指定要忽略哪些 URL。在本例中，我们不想给插件管理器造成负担。如果我们这样做，它就会对无辜的外部服务产生大量请求。


    Wapiti 会爬取网站。如果你不小心，该工具可能会顺着链接到达你不想测试的位置。为避免尴尬，请谨慎使用排除 URL 选项 `-x`。


    `-v2` 选项将日志记录详细程度设置为最高，以便你能看到所有攻击。


    在第二次运行 Wapiti 时，你还使用了 permanentxss 模块，该模块有时会发现真正的 XSS 攻击，这取决于开发人员在开发功能和清理 bug
    之间的竞赛：


    模糊测试工具擅长覆盖应用程序 URL 空间的很大一部分，触发那些需要花费大量时间才能发现的错误。可以考虑通过 Jenkins 作业进行自动化，作为项目 QA
    流程的一部分。


    ## 更多内容...


    你在本菜谱中生成的报告提到的服务器错误远多于 XSS 攻击。这是因为许多生成的错误是由于意外输入导致的失败，而这些失败只有最后一层错误处理才能捕获；在本例中，也就是
    bug 报告页面。如果你认为该错误值得报告，请按照 bug 报告页面上的说明进行操作。


    以下是一些关于堆栈跟踪输出含义的指南：


    - `java.lang.SecurityException`：如果 Jenkins 用户正在做程序员认为不安全的事情，例如访问某个 URL，则该 URL
    应该只在登录后才可访问。

    - `java.lang.IllegalArgumentException`：Jenkins 检查了参数的有效范围，而参数值超出了该范围。这是一个故意抛出的异常。

    - `java.lang.NumberFormatException`：Jenkins 没有检查字符串是否有效，然后尝试将不符合格式的字符串解析为数字。

    - `java.lang.NullPointerException`：这通常发生在你访问一个未设置 Jenkins 期望的所有参数的 URL 时。用程序员的话说，代码期望一个不存在的对象，然后在不检查对象是否存在的情况下尝试调用该不存在对象的方法。程序员需要添加更多的错误检查。请写一个错误报告。


    ## 另请参阅


    - *测试 OWASP 十大安全问题* 菜谱


    ## 使用 JCaptcha 防止注册机器人


    **CAPTCHA** 的全称是 **全自动区分计算机和人类的公开图灵测试**。最常见的 CAPTCHA 是以图形形式显示的连续字母和数字，你必须正确地将它们输入到文本输入框中。


    如果你允许任何人在你的 Jenkins 服务器上注册帐户，那么你最不希望看到的就是机器人（自动化脚本）创建帐户。机器人具有规模经济效应，能够快速扫描互联网，而且永远不会感到厌倦。CAPTCHA
    是抵御这些愚蠢攻击的必要防御手段。


    机器人的恶意用途如下：


    - 对你的服务器执行**拒绝服务（DOS）**攻击，例如通过自动创建大量重量级作业

    - 通过收集大量 Jenkins 服务器向其他服务器发起大量请求，从而实施**分布式拒绝服务攻击（DDOS）**

    - 注入不需要的广告或内容，然后指向恶意网站

    - 添加永久存储的脚本，当用户意外浏览 Jenkins 站点时运行这些脚本


    犯罪分子有商业动机去规避 CAPTCHA，这已经导致了有据可查的法律案件。你可以在 [http://www.wired.com/2010/10/hacking-captcha/](http://www.wired.com/2010/10/hacking-captcha/)
    找到一个这样的法律案件。


    ## 准备工作


    确保你已经备份了你的可牺牲的 Jenkins 服务器。你将要修改其安全设置。很容易犯下改变服务的错误。


    JCaptcha 插件基于 Java 实现，你可以在 https://jcaptcha.atlassian.net/wiki/display/general/Home
    找到相关内容。


    ## 操作步骤...


    - 1. 以管理员身份登录。

    - 2. 单击 “Configure Global Security”（配置全局安全性）链接。

    - 3. 在 “Security Realm”（安全域）下选择 “Jenkins’ own user database”（Jenkins 自己的用户数据库）。

    - 4. 选择 “Allow users to sign up”（允许用户注册）：

    - 5. 单击 “Save”（保存）。

    - 6. 浏览到注册位置 http://localhost:8080/signup。

    - 7. 在 “Manage Jenkins”（管理 Jenkins）页面中单击 “Manage Plugins”（插件管理）链接。

    - 8. 选择 “Available”（可用）选项卡。

    - 9. 安装 JCaptcha 插件。

    - 10. 在 “Manage Jenkins”（管理 Jenkins）页面下单击 “Configure Global Security”（配置全局安全性）链接。

    - 11. 在 “Security Realm”（安全域）下选择 “Jenkins’ own user database”（Jenkins 自己的用户数据库）。

    - 12. 选择 “Enable captcha on sign up”（在注册时启用验证码）。

    - 13. 单击 “Save”（保存），然后点击 “Log Out”（注销）链接。

    - 14. 浏览到注册位置 http://localhost:8080/signup。该页面现在受到 CAPTCHA 的保护。


    ## 工作原理...


    安装插件会在注册过程中添加 CAPTCHA 图像。解读该图像需要模式识别。人类非常擅长这一点；自动化过程则差得多，不过在不断改进。


    ## 提升代码质量


    在本章中，我们将介绍以下菜谱：


    - 将 Jenkins 与 SonarQube 集成

    - SonarQube 中的更新中心

    - 质量门、质量配置文件和规则

    - 使用 SonarQube 验证 HTML、CSS 和 JavaScript 的有效性

    - 使用 SonarQube 验证 Java 代码

    - 将 SonarQube 配置为 Windows 服务


    ## 引言


    本章探讨如何使用 Jenkins 插件来显示代码指标和失败的构建。自动化可以降低成本并提高一致性。该过程不会疲倦。如果你在项目开始之前就确定成功和失败的标准，那么这将消除发布会议中的一定程度的主观争论。


    2002 年，NIST 估计软件缺陷每年给美国造成约 600 亿美元的损失（http://www.abeacha.com/NIST_press_release_bugs_cost.html）。可以预期此后成本已大幅增加。为了节省资金和提高质量，你需要在软件生命周期中尽可能早地消除缺陷。


    你还会在本章中找到有关通过 SonarQube 进行静态代码审查的菜谱。静态意味着你可以在不运行代码的情况下查看代码。良好的文档和源代码结构有助于提高代码的可维护性和可读性。


    有许多不错的软件指标介绍。其中包括关于指标细节的维基教科书（http://en.wikibooks.org/wiki/Introduction_to_Software_Engineering/Quality/Metrics）以及
    Diomidis Spinellis 所著的一本名为 *Code Quality: The Open Source Perspective* 的优秀书籍。


    在本章的 *将 Jenkins 与 SonarQube 集成* 菜谱中，你会将 Jenkins 项目链接到 Sonar 报告。Sonar 是一种专门收集软件指标并将其分解为可理解报告的工具。Sonar
    详细描述项目的质量。它使用广泛的指标，包括本章提到的 FindBugs 和 PMD 等工具的结果。该项目本身发展迅速。考虑使用 Jenkins 进行早期警告并发现明显缺陷，例如糟糕的提交。然后你可以使用
    Sonar 进行更深入的审查。


    从 https://www.sonarqube.org/downloads/ 下载 SonarQube 并将其解压到系统中：


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_274_0.png)


    SonarQube 支持 20+ 种编程语言：Java Android、JavaScript、HTML、CSS、Objective-C、C#、C/C++、PHP、Python、PL/SQL、Flex、Groovy、COBOL、Swift（付费插件）等。它支持有关
    bug、漏洞、代码异味、重复代码、代码覆盖率、注释等的报告。


    - 1. 运行 SonarQube 需要先安装 Java 8。

    - 2. 在 Windows 操作系统中，转到 `bin` 目录，然后根据操作系统及其平台，进入相应的子目录。


    '
