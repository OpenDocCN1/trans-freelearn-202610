    ## Jenkins and Active Directory integration


    In this section, we will configure Active Directory, which is already available
    to integrate with Jenkins so all available users in a specific domain of Active
    Directory can utilize Jenkins with their own Active Directory credentials based
    on the given access.


    ### How to do it...


    - 1. Go to the Jenkins dashboard | Manage Jenkins | Configure Global Security
    | Enable security | Select Active Directory:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_246_0.png)


    - 2. Select Specify custom Active Directory domain name, click on Add Domain,
    provide the Domain Name, and save it:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_246_1.png)


    - 3. If the configuration and access is correct, then we can use all the users
    in the domain directly in Jenkins.


    ## Jenkins and OWASP Zed Attack Proxy integration


    **OWASP Zed Attack Proxy(ZAP)** is an open source web application security scanner.
    You can integrate ZAP security tool with the Jenkins CI environment.


    ### Getting ready


    Go to https://github.com/zaproxy/zaproxy/wiki/Downloads and download the Windows
    (64) Installer.


    Install it on Windows.


    Open OWASP ZAP in Windows, click on File | Persist Session and save it in the
    Jenkins workspace in the directory of the build job:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_248_0.png)


    Now you are good to configure ZAP plugins in Jenkins.


