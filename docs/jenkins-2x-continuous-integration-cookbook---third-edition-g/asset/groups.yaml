    # # An extreme view for reception areas


    Agile projects emphasize the role of communication over the need to document.
    Information radiators aid in returning feedback quickly. Information radiators
    have two main characteristics: they change over time and the data presented is
    easy to digest.


    The extreme Feedback Panel plugin is one example of an information radiator. It
    is a highly visual Jenkins view. If the layout is formatted consistently and displayed
    on a large monitor, it is ideal for the task. Consider this also as a positive
    advertisement of your development process. You can display it behind your reception
    desk or in a well-visited social area such as near the coffee machine or project
    room.


    In this recipe, you will add the `eXtreme Feedback Panel` plugin and modify its
    appearance through HTML tags in the description.'
