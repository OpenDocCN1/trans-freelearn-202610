  \ Jenkins 安装为 Windows 服务后，您可以在机器启动时立即启动 Jenkins，并且不受交互使用 Jenkins 的用户身份影响。\n\n##\
  \ 准备工作\n\n在 Windows 上安装并配置 Jenkins。\n\n## 操作步骤...\n\n按照以下步骤在 Windows 中将 Jenkins\
  \ 安装为服务：\n\n+   1. 转到 Jenkins 仪表盘。\n+   2. 点击“管理 Jenkins”。\n+   3. 点击“安装为 Windows\
  \ 服务”，如下图所示：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_59_0.png)\n\n+   4. 将“安装目录”保留为默认值，然后点击“安装”：\n\
  \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_59_1.png)\n\n+   5. “Windows 服务”安装成功完成后，点击“是”：\n\
  \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_59_2.png)\n\n+   6. 现在，Jenkins 将作为 Windows\
  \ 系统中的一个服务运行。\n\n## 工作原理...\n\n转到“控制面板”并搜索“服务”。\n\n点击“服务（本地）”进行查看：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_60_0.png)\n\
  \n一旦 Jenkins 服务可用，您可以根据需要右键单击它并启动、停止或重启服务。\n\n## 在 Jenkins 中安装插件\n\nJenkins 是一个开源自动化服务器，由于拥有\
  \ 400 多个插件，它被广泛使用且具有高度扩展性。插件使 Jenkins 与其他工具的集成变得非常容易。您也可以创建自己的插件。\n\n## 准备工作\n\n\
  可用的插件有各种类别，例如源代码管理、从属启动器和控制器、构建触发器、构建工具、构建通知、构建报告、其他构建后操作、外部站点/工具集成、UI 插件、身份验证和用户管理、Android\
  \ 开发、iOS 开发、.NET 开发、Ruby 开发、库插件等等。\n\n## 操作步骤...\n\n+   1. 转到 Jenkins 仪表盘。点击“管理\
  \ Jenkins”，然后点击“管理插件”：\n\n## 管理 Jenkins\n\n+   - 配置系统\n+   配置全局设置和路径。\n+   - 配置全局安全性\n\
  +   保护 Jenkins：定义允许访问/使用系统的用户。\n+   - 配置凭据\n+   配置凭据提供程序和类型\n+   - 全局工具配置\n+   配置工具、它们的位置和自动安装程序。\n\
  +   - 从磁盘重新加载配置\n+   丢弃内存中所有已加载的数据，并从文件系统重新加载所有内容。当您直接在磁盘上修改配置文件时很有用。\n+   - 管理插件\n\
  +   添加、删除、禁用或启用可扩展 Jenkins 功能的插件。\n+   - 系统信息\n+   显示各种环境信息以协助故障排除。\n+   - 系统日志\n\
  +   系统日志捕获与 Jenkins 相关的来自 `java.util.logging` 的输出。\n+   - 负载统计\n+   检查资源利用率，查看是否需要为构建添加更多计算机。\n\
  \n2. 转到“可选插件”选项卡，选择要安装的任何插件。点击“无重启安装”：\n\n## 更多内容...\n\nJenkins 定义了用于建模构建系统某一方面的接口或抽象类。接口或抽象类定义了需要实现内容的协定；Jenkins\
  \ 使用插件来扩展这些实现。\n\n## 在 Jenkins 中上传插件\n\n有些情况下，您已经从 [https://updates.jenkins-ci.org/download/plugins/](https://updates.jenkins-ci.org/download/plugins/)\
  \ 下载了所有插件，或者您创建了自己的插件并希望在 Jenkins 中使用。本教程将说明如何在 Jenkins 中上传这些插件。\n\n## 准备工作\n\n\
  下载所需插件 https://updates.jenkins-ci.org/download/plugins/ 或使用插件教程 https://wiki.jenkins.io/display/JENKINS/Plugin+tutorial\
  \ 创建插件。\n\n## 操作步骤...\n\n在本教程中，我们将下载一个插件并从 Jenkins 仪表盘上传它：\n\n+   1. 下载 copyartifact\
  \ 插件（`.hpi`）文件：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_71_0.png)\n\n+   2.\
  \ 将最新版本下载到您的系统：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_71_1.png)\n\n+   3.\
  \ 转到 Jenkins 仪表盘。\n+   4. 点击“管理 Jenkins”。\n+   5. 点击“管理插件”。\n+   6. 转到“高级”选项卡。在“上传插件”部分点击“选择文件”：\n\
  \n## 工作原理...\n\n一旦插件成功上传，我们就可以利用上传到 Jenkins 的插件所提供的扩展性。\n\n## 在 Jenkins 中配置代理\n\n\
  Jenkins 通常安装在使用代理服务器的组织中。在这种情况下，在 Jenkins 仪表盘中配置代理非常重要，这样插件更新才能成功安装。\n\n## 准备工作\n\
  \n获取服务器名称、端口号以及允许访问代理服务器的凭据等所有详细信息。\n\n## 操作步骤...\n\n+   1. 转到 Jenkins 仪表盘。\n+ \
  \  2. 点击“管理 Jenkins”。\n+   3. 点击“管理插件”。\n+   4. 转到“高级”选项卡。\n+   5. 提供“服务器”、“端口”、“用户名”、“密码”和“无代理主机”：\n\
  \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_77_0.png)\n\n+   6. 点击“提交”。\n\n## 在 Jenkins\
  \ 中配置全局设置\n\n“配置系统”是进行初始设置的地方，并且非常有用。您可以配置 SMTP 服务器详细信息、SonarQube 服务器详细信息、环境变量等。\n\
  \n## 准备工作\n\n要配置全局设置和路径，我们需要进入 Jenkins 仪表盘中的“配置系统”。\n\n## 操作步骤...\n\n+   1. 转到 Jenkins\
  \ 仪表盘。\n+   2. 点击“管理 Jenkins”。\n+   3. 点击“配置系统”。\n+   4. 验证“主目录”是否可用：\n\n5. 在“配置系统”页面中，我们也可以定义环境变量，以便在构建作业执行期间使用它们。\n\
  \n6. 例如，我们可以在“环境变量”中配置 ANDROID SDK 路径，以便为 Android 应用设置持续集成。\n\n## 全局属性\n\n环境变量\n\
  \n变量列表\n\n名称 PROP_LOC\n\n值 <属性文件的路径>\n\n删除\n\n添加\n\n7. 同一页面上另一个重要的配置是“Jenkins 位置”。您可以指定\
  \ Jenkins 安装的 HTTP 地址，因为 Jenkins 无法可靠地从自身检测到这样的 Jenkins URL：\n\n## Jenkins 位置\n\n\
  Jenkins URL http://10.0.0.5:8080/\n\n系统管理员电子邮件地址 尚未配置 <nobody@nowhere>\n\n\n\n\n\
  \n## 还有更多...\n\n在 Configure System 部分，这里有一些重要的配置需要你进行，例如 SCM Polling、E-mail Notification、Extended\
  \ E-mail Notification、Git plugin、Disk usage、Quality Gates - SonarQube、Build Pipeline\
  \ Plugin、Copyartifact: Upstream build that triggered this job、Audit Trail、SonarQube\
  \ servers 等等。\n\n## 配置 JENKINS_HOME\n\n`.jenkins` 是包含 Jenkins 安装文件、配置、插件、构建作业配置等所有详细信息的核心目录。\n\
  \n## 准备工作\n\n`.jenkins` 目录应保存在有充足可用空间的位置。默认情况下，Jenkins 会根据操作系统在特定位置创建 `.jenkins`（或\
  \ `JENKINS_HOME`）。\n\n例如，在 Windows 中它位于 `c:\\Users\\<USER_NAME>\\.jenkins`。\n\n\
  ## 如何操作...\n\n- 1. 在 Windows 中，要更改 `JENKINS_HOME`，请前往 控制面板 | 所有控制面板项 | 系统。\n- 2.\
  \ 点击 高级系统设置。\n- 3. 点击 环境变量。\n- 4. 创建一个新变量 JENKINS_HOME 并给出路径：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_86_0.png)\n\
  \n- 5. 在 Ubuntu 中，前往 `/etc/default/Jenkins`。\n- 6. 更改 `JENKINS_HOME` 位置：\n\n```\n\
  mitesh51@Jenkins:~$ vi /etc/default/jenkins\ndefaults for Jenkins automation server\n\
  \n## pulled in from the init script; makes things easier.\nNAME=jenkins\n\n### location\
  \ of java\nJAVA=/usr/bin/java\n\n# arguments to pass to java\n# Allow graphs etc.\
  \ to work even when an X server is present\nJAVA_ARGS=\"-Djava.awt.headless=true\"\
  \n\n#JAVA_ARGS=\"-Xmx256m\"\n\n# make jenkins listen on IPv4 address\n#JAVA_ARGS=\"\
  -Djava.net.preferIPv4Stack=true\"\n\nPIDFILE=/var/run/$NAME/$NAME.pid\n\n# user\
  \ and group to be invoked as (default to jenkins)\nJENKINS_USER=$NAME\nJENKINS_GROUP=$NAME\n\
  \n# location of the jenkins war file\nJENKINS_WAR=/usr/share/$NAME/$NAME.war\n\n\
  # jenkins home location\nJENKINS_HOME=/var/lib/$NAME\n\n# set this to false if you\
  \ don't want Jenkins to run by itself\n# in this set up, you are expected to provide\
  \ a servlet container\n# to host jenkins.\nRUN_STANDALONE=true\n\n# log location.\
  \ this may be a syslog facility.priority\nJENKINS_LOG=/var/log/$NAME/$NAME.log\n\
  #JENKINS_LOG=daemon.info\n```\n\n7. 完成更改后，保存更改。\n\n## 还有更多...\n\n下表描述了不同操作系统中 `JENKINS_HOME`\
  \ 的默认位置：\n\n| 操作系统 | $JENKINS_HOME 位置 |\n|---|---|\n| Windows | C:\\Program Files\
  \ (x86)\\jenkins or c:\\Users\\<USER>\\.jenkins |\n| Mac OSX | Macintosh HD/Users/Shared/Jenkins\
  \ |\n| Ubuntu/Debian | /var/lib/jenkins |\n| Red Hat/CentOS/Fedora | /var/lib/jenkins\
  \ |\n| OpenSUSE | /var/lib/jenkins |\n| FreeBSD | /usr/local/etc/jenkins |\n| OpenBSD\
  \ | /usr/local/etc/jenkins |\n\n## 理解 JENKINS_HOME 目录\n\n在本教程中，我们将讨论 `JENKINS_HOME`\
  \ 目录中可用的目录。\n\n## 准备工作\n\n从环境变量中定位 `JENKINS_HOME` 目录，或前往不同操作系统中 `JENKINS_HOME` 可用的默认位置。\n\
  \n## 如何操作...\n\n- 1. `JENKINS_HOME` 目录中有许多文件和目录。我们将对一些重要文件和目录进行简要说明：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_93_0.png)\n\
  \n2. `JENKINS_HOME` 目录中一些重要的文件和目录如下：\n\n- `config.xml` — Jenkins 根配置文件\n- `fingerprints`\
  \ — 它存储指纹记录，如有\n- `plugins` — 它是所有 Jenkins 插件的根目录\n- `jobs` — 它是所有 Jenkins 作业的根目录\n\
  - `logs` — 它存储所有日志文件\n- `secrets` — 它是用于凭据解密的密钥的根目录\n- `users` — 它存储 Jenkins 中所有与用户相关的详细信息\n\
  - `war` — 它存储与 `JENKINS_WAR` 文件相关的所有详细信息\n- `workspace` — 它存储与不同构建作业相关的所有文件和工件，并在归档元素时将内容移至\
  \ jobs 目录。\n\n## 另请参阅\n\n在 `JENKINS_HOME` 目录中，用任意文本编辑器打开 `config.xml` 并查看文件中可用的选项。\n\
  \n## 为 Jenkins 使用不同的端口\n\n默认情况下，Jenkins 运行在端口号 8080。\n\n## 如何操作...\n\n让我们更改 Jenkins\
  \ 运行的端口：\n\n- 1. 如果你使用命令行运行 Jenkins，则可以执行类似 `java -jar -httpPort=9999 jenkins.war`\
  \ 的命令，将现有端口从 `8080` 更改为 `9999`。\n- 2. 另一种更改端口的方法是在使用 Windows 包安装 Jenkins 时如下：\n\
  \  - 前往你安装 Jenkins 的 `Program Files/Jenkins` 目录\n  - 在编辑器中打开 `Jenkins.xml`\n  -\
  \ 找到 `\"--httpPort=8080\"` 并将端口 `8080` 替换为新端口号\n\n## 其工作原理...\n\n首先，你安装了 Ubuntu\
  \ 的虚拟镜像，更改了密码以使其更难被他人登录，并为安全补丁更新了客户机操作系统。\n\n## 在 Jenkins 中配置 JAVA_HOME\n\nJenkins\
  \ 是一个开源自动化服务器，可用于为多种编程语言编写的项目配置持续集成。让我们考虑一个基于 Java 的应用程序的情况。\n\n我们需要告诉 Jenkins Java\
  \ 安装在何处。\n\n## 如何操作...\n\n- 1. 打开 Jenkins 仪表板。\n- 2. 前往 管理 Jenkins。\n- 3. 前往 全局工具配置\
  \ 以配置工具、其位置和自动安装程序。\n- 4. 前往 JDK 部分。\n- 5. 输入名称并勾选 自动安装 选项；提供 Oracle 账户的详细信息以成功下载\
  \ JDK。\n- 6. 你可以给出 JDK 1.7 或 JDK 1.8 等逻辑名称，以便在配置构建作业时识别正确版本。\n- 7. 你可以根据版本添加多个 JDK，因此如果不同应用程序需要不同的\
  \ JDK，则可以通过在 Jenkins 中添加 JDK 轻松管理该场景：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_101_0.png)\n\
  \n## 其工作原理...\n\n当你在 Jenkins 中创建构建作业并配置它时，你需要指定构建执行将使用的 Java 版本。如果你不想自动安装，也可以使用系统上已有的\
  \ Java。\n\n在构建作业的常规部分，我们可以从列表中选择一个 JDK。该列表包含我们在全局工具配置中配置的所有 JDK。\n\n## 在 Jenkins\
  \ 中配置 Git\n\nJenkins 可以与许多源代码存储库集成，Git 就是其中之一。让我们考虑一个基于 Java 的应用程序的情况，其源代码存储在 Git、Gitlab\
  \ 和/或 GitHub 中。\n\n我们需要告诉 Jenkins Git 在本地系统中的安装位置。\n\n## 准备工作\n\n根据操作系统下载所需的 Git\
  \ 版本，或自动安装。\n\n## 如何操作...\n\n- 1. 打开 Jenkins 仪表板。\n- 2. 前往 管理 Jenkins。\n- 3. 前往\
  \ 全局工具配置 以配置工具、其位置和自动安装程序。\n- 4. 前往 Git 部分。\n- 5. 输入名称并点击 自动安装，或提供 Git 的路径。\n- 6.\
  \ 你可以根据版本或特定代理添加多个 Git。你需要给出有意义的名称，以便在配置构建作业时易于识别：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_105_0.png)\n\
  \n## 其工作原理...\n\n当你在 Jenkins 中创建构建作业并配置它时，你需要指定构建执行将使用的 Git 版本。如果你不想自动安装，也可以使用系统上已有的\
  \ Git 安装。\n\n在源代码管理部分，从列表中选择在全局工具配置中配置的适当 Git。\n\n前往 Git 可执行文件配置以更改 Git 安装程序。\n\n\
  \n\n\n\n## 在 Jenkins 中配置 ANT_HOME\n\nJenkins 是一个开源自动化服务器，可用于为多种编程语言编写的项目配置持续集成。让我们考虑一个基于\
  \ Java 的应用程序，并且使用 Ant 作为构建工具的情况。\n\n我们需要告诉 Jenkins Ant 可安装目录的位置。\n\n### 准备工作\n\n\
  下载所需的 Ant 版本或自动安装。\n\n### 工作原理...\n\n当你在 Jenkins 中创建构建作业并进行配置时，需要指定构建执行将使用的 Ant\
  \ 版本。如果你不想自动安装，也可以使用系统上已有的 Ant 安装。\n\n## 在 Jenkins 中配置 MAVEN_HOME\n\nJenkins 是一个开源自动化服务器，可用于为多种编程语言编写的项目配置持续集成。让我们考虑一个基于\
  \ Java 的应用程序并且使用 Maven 作为构建工具的情况。\n\n我们需要告诉 Jenkins Maven 可安装目录的位置。\n\n### 准备工作\n\
  \n下载所需的 Maven 版本或自动安装。\n\n### 如何操作...\n\n- 1. 打开 Jenkins 仪表盘。\n- 2. 进入 管理 Jenkins。\n\
  - 3. 进入 全局工具配置 以配置工具、其位置和自动安装程序。\n- 4. 进入 Maven 部分。\n- 5. 输入名称并点击 自动安装，或提供现有 Maven\
  \ 安装可用的位置路径。\n- 6. 你可以给出一个逻辑名称，例如 `Maven 3.5.0` 或 `Maven 3.4.0`，以便在配置构建作业时识别正确的版本：\n\
  - 7. 你可以在 Jenkins 中根据版本添加多个 Maven。\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_113_0.png)\n\
  \n### 工作原理...\n\n当你在 Jenkins 中创建构建作业并进行配置时，需要指定构建执行将使用的 Maven 版本。如果你不想自动安装，也可以使用系统上已有的\
  \ Maven 安装。\n\n## 在 Jenkins 中配置 GRADLE_HOME\n\nJenkins 是一个开源自动化服务器，可用于为多种编程语言编写的项目配置持续集成。让我们考虑一个基于\
  \ Android 的应用程序，并且使用 Gradle 作为构建工具的情况。\n\n我们需要告诉 Jenkins Gradle 可安装目录的位置。\n\n###\
  \ 准备工作\n\n下载所需的 Gradle 版本或自动安装。\n\n### 如何操作...\n\n- 1. 打开 Jenkins 仪表盘。\n- 2. 进入\
  \ 管理 Jenkins。\n- 3. 进入 全局工具配置 以配置工具、其位置和自动安装程序。\n- 4. 进入 Gradle 部分。\n- 5. 输入名称并点击\
  \ 自动安装，\n  或提供现有 Gradle 安装可用的位置路径。\n- 6. 你可以给出一个逻辑名称，例如 `Gradle 4.0.1` 或 `Gradle\
  \ 4.0.0`，以便在配置构建作业时识别正确的版本：\n- 7. 你可以在 Jenkins 中根据版本添加多个 Gradle。\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_117_0.png)\n\
  \n## 为 Ant 项目创建 Freestyle 作业\n\n构建作业是 Jenkins 中的基本执行单元。我们可以使用构建作业执行许多操作。我们可以执行命令、发送通知、配置持续集成等等。\n\
  \n### 准备工作\n\n你需要根据应用程序配置工具，例如 Ant、Gradle、Java、Git 等等。\n\n### 如何操作...\n\n- 1. 打开\
  \ Jenkins 仪表盘。\n- 2. 点击 新建任务。\n- 3. 输入项目名称。\n- 4. 选择模板 Freestyle project。\n- 5.\
  \ 点击 确定：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_121_0.png)\n\n- 6. 进入 源代码管理\
  \ 部分并选择 Git。\n- 7. 提供 仓库 URL。\n- 8. 提供凭据，如下一张截图所示：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_121_1.png)\n\
  \n- 9. 在 构建 部分，点击 添加构建步骤 并选择 调用 Ant。\n- 10. 根据我们的全局工具配置选择 Ant 名称。\n- 11. 提供目标。在\
  \ Ant 中，我们可以根据 build.xml 文件中定义的目标给出一个目标：\n- 12. 点击 保存。\n\n### 工作原理...\n\n当你进入构建作业页面并点击\
  \ 立即构建 时，它将根据配置执行构建。\n\n### 准备工作\n\n你需要根据应用程序配置工具，例如 Maven、Java、Git 等等。\n\n### 如何操作...\n\
