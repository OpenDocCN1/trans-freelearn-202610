  \ completed build (#20), 16 hr ago\n\n现在我们已完成 Jenkins 中用户管理、基于角色的访问和基于项目的访问，作为保护\
  \ Jenkins 的一部分。\n\n## Jenkins 和 OpenLDAP 集成\n\n**Lightweight Directory Access Protocol\
  \ (LDAP)** 提供了一种非常流行的开放标准目录服务。它被许多组织用于向世界展示用户信息。LDAP 也用作中央服务来保存用于身份验证的用户密码，并且可以包含用于邮件路由、POSIX\
  \ 账户管理以及外部系统可能需要的各种其他信息。Jenkins 可以直接连接到 LDAP 进行身份验证，或间接通过 CAS SSO 服务器（[http://www.jasig.org/cas](http://www.jasig.org/cas)）进行连接，后者然后使用\
  \ LDAP 作为其密码容器。Jenkins 还具有一个邮件插件（[https://wiki.jenkins-ci.org/display/JENKINS/LDAP+Email+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/LDAP+Email+Plugin)），可从\
  \ LDAP 中提取其路由信息。\n\n由于 LDAP 是一种常见的企业服务，Jenkins 在作为构建应用程序测试基础设施的一部分运行集成测试时也可能会遇到\
  \ LDAP。\n\n本教程展示了如何快速安装名为 slapd 的 OpenLDAP 服务器，然后通过 **LDAPData Interchange Format\
  \ (LDIF)** 添加组织、用户和组，LDIF 是一种用于存储 LDAP 记录的简单文本格式（[http://en.wikipedia.org/wiki/LDAP_Data_Interchange_Format](http://en.wikipedia.org/wiki/LDAP_Data_Interchange_Format)）。\n\
  \nActive Directory 在企业环境中也很流行。Jenkins 有一个 Active Directory 插件（[https://wiki.jenkins-ci.org/display/JENKINS/Active+Directory+plugin](https://wiki.jenkins-ci.org/display/JENKINS/Active+Directory+plugin)）。\n\
  \n## 准备工作\n\n对于本教程，您将在 Ubuntu 14.04 LTS 或更新版本上安装 OpenLDAP。您可以使用 VirtualBox 或 VMware\
