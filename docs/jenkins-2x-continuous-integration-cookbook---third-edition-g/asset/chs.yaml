  \n在本章中，我们将讨论如何安装和配置 Jenkins，以及从 Jenkins 2 及更高版本中可用的新功能或 UI 改进。我们将涵盖以下配方：\n\n- 在\
  \ Windows 上安装 Jenkins 2\n- 在 CentOS 上安装 Jenkins 2\n- 在 Azure 上安装 Jenkins 2\n- 在\
  \ Windows 上将 Jenkins 安装为服务\n- 在 Jenkins 中安装插件\n- 在 Jenkins 中上传插件\n- 在 Jenkins 中配置代理\n\
  - 在 Jenkins 中配置全局设置\n- 配置 JENKINS_HOME\n- 了解 JENKINS_HOME 目录\n- 为 Jenkins 使用不同的端口\n\
  - 在 Jenkins 中配置 JAVA_HOME\n- 在 Jenkins 中配置 Git\n- 在 Jenkins 中配置 ANT_HOME\n- 在 Jenkins\
  \ 中配置 MAVEN_HOME\n- 在 Jenkins 中配置 GRADLE_HOME\n- 为 Ant 项目创建 Freestyle 作业\n- 为 Maven\
  \ 项目创建 Maven 作业\n\n## 引言\n\nJenkins 是一个开源自动化服务器，被许多组织广泛用于实施流行的 DevOps 实践，例如持续集成和持续交付。Jenkins\
  \ 功能丰富，并且可通过插件大幅扩展。此外，Jenkins 及其插件改进迅速。Jenkins 每周都会发布新的次要版本，主要是改进，偶尔会有错误。社区通过使用\
  \ Jenkins 的长期支持版本来管理核心稳定性，该版本成熟且与最新版本相比功能较少。对于复杂环境中的稳定系统，您需要监控、清理存储、备份、控制 Jenkins\
  \ 脚本，并持续清理和打磨。本章包含最常见任务的配方。适当的维护可降低故障风险，例如：\n\n- **新插件导致异常**：有很多优秀的插件以快速的版本变化编写。在这种情况下，很容易意外添加带有新缺陷的插件新版本。在升级期间，曾多次出现插件突然无法工作的情况。为对抗插件异常的风险，请考虑在发布到关键系统之前先使用测试\
  \ Jenkins 实例。\n- **存储因工件溢出**：如果您保留包含工件的构建历史，例如 WAR 文件、大量 JAR 文件或其他类型的二进制文件和源代码，那么您的存储空间将被惊人的速度消耗。存储成本已大幅下降，但存储使用量相当于更长的备份时间和从从节点到主节点的更多通信。为最大限度降低磁盘溢出的风险，您需要考虑备份和恢复策略以及作业高级选项中表达的关联构建保留策略。\n\
  - **脚本意大利面条**：由于作业由各个开发团队编写，所包含脚本的位置和风格各不相同。这使您难以跟踪。请考虑为脚本使用明确定义的位置，并通过插件管理的脚本存储库。\n\
  - **资源耗尽**：随着内存被消耗，或密集作业数量增加，Jenkins 会变慢。适当的监控和快速反应可减少影响。\n- **由于有机增长导致作业之间普遍缺乏一致性**：Jenkins\
  \ 易于安装和使用。无缝打开插件的能力令人上瘾。Jenkins 在组织内的采用速度令人瞠目结舌。如果没有一致的策略，您的团队将引入大量插件，也将引入大量执行相同工作的方式。约定可提高作业的一致性和可读性，从而降低维护成本。\n\
  \nJenkins 社区正在竭尽全力为您服务。如果您看到问题，请报告回来。\n\n加入社区：\n\n要添加社区错误报告或修改 wiki 页面，您需要在以下位置创建账户：https://wiki.jenkins-ci.org/display/JENKINS/Issue+Tracking。\n\
  \n\n\n\n\n## 在 Windows 上安装 Jenkins 2\n\n让我们在 Windows 操作系统上安装 Jenkins 2。它可以是物理机，也可以是云上可用的虚拟机。\n\
  \n### 准备工作\n\n要执行本菜谱，你需要下载 Jenkins。\n\n对于业务部门，建议具备以下要求：\n\n- Java 8\n- 4 GB+ RAM\n\
  - 500 GB+ 可用磁盘空间\n\n### 如何操作...\n\n让我们按照以下步骤安装 Jenkins：\n\n1. 访问 https://jenkins.io。\n\
  \n2. 点击 Download，如以下屏幕截图所示：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_34_0.png)\n\
  \n3. 从 Jenkins 下载最新的 Windows 安装包，地址为：http://mirrors.jenkins.io/windows/latest。\n\
  \n4. 点击该安装包并按照分步说明进行安装。\n\n## 在 CentOS 上安装 Jenkins 2\n\n让我们查看在 CentOS 上安装 Jenkins\
  \ 所需的步骤。\n\n### 准备工作\n\n对于业务部门，建议具备以下要求：\n\n- Java 8\n- 4 GB+ RAM\n- 500 GB+ 可用磁盘空间\n\
  \nJenkins 需要 Java。要安装 Java，请执行：\n\n```\nsudo yum install java\n```\n\n### 如何操作...\n\
  \n1. Jenkins 的稳定版和最新版本可在 YUM 仓库中使用。\n2. 将 Jenkins 仓库添加到 yum 源：\n\n```\nsudo wget\
  \ -O /etc/yum.repos.d/jenkins.repo http://pkg.jenkins-ci.org/redhat/jenkins.repo\n\
  ```\n\n3. 对于稳定版，执行：\n\n```\nsudo wget -O /etc/yum.repos.d/jenkins.repo http://pkg.jenkins-ci.org/redhat-stable/jenkins.repo\n\
  ```\n\n4. 导入以下密钥：\n\n```\nsudo rpm --import https://jenkins-ci.org/redhat/jenkins-ci.org.key\n\
  ```\n\n5. 通过执行以下命令安装 Jenkins：\n\n```\nsudo yum install jenkins\n```\n\n### 还有更多...\n\
  \n- 要启动 Jenkins 服务，执行：\n\n  ```\n  sudo service jenkins start\n  ```\n\n- 要停止 Jenkins\
  \ 服务，执行：\n\n  ```\n  sudo service jenkins stop\n  ```\n\n- 要重启 Jenkins 服务，执行：\n\n\
