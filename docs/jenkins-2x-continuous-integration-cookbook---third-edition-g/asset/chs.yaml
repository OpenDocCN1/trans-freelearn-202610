  \ JCaptcha 避免注册机器人\n\n### 简介\n\n在本章中，我们将讨论 Jenkins 的安全性，考虑到 Jenkins 可以运行在各种各样的基础设施中。我们还将研究如何扫描\
  \ Jenkins 编译的 Java 代码所用库中的已知安全问题。\n\n唯一完全安全的系统是不存在的系统。对于真实服务，你需要注意不同可攻击面。Jenkins\
  \ 的主要攻击面是其基于 Web 的图形用户界面，以及它与从节点和本地操作系统之间的信任关系。在线服务需要对其安全面给予高度重视。对于 Jenkins，主要有三个原因：\n\
  \n- Jenkins 能够通过其插件或主从拓扑与各种基础设施进行通信\n- 插件的代码变更速度很快，并且容易意外包含与安全相关的缺陷\n- 你需要加固默认安装\n\
  \n另一个积极因素是，Jenkins 代码可免费供人审查，核心社区也时刻保持警惕。\n\n### 通过 Jenkins 配置提高安全性\n\n在本节中，我们将介绍如何管理多个用户。\n\
