  \ 提示需要归档\n\n每个开发团队都是独特的。团队有自己的做事方式。在许多组织中，有一些需要定期完成的一次性任务。例如，在每年年底，对整个文件系统进行完整备份。\n\
  \n本方案详细介绍了一个脚本，该脚本检查任何作业的最后一次成功运行；如果年份与当前年份不同，则在作业描述的开头设置一条警告。因此，这提示你是时候执行某个操作了，例如归档然后删除。当然，你可以通过编程方式执行归档。但是，对于高价值操作，值得强制干预，让\
  \ Groovy 脚本引起你的注意。\n\n### 如何操作...\n\n- 1. 在“系统管理”页面中，点击“脚本控制台”链接并运行以下脚本：\n- 2. 在“脚本控制台”中提供脚本并点击“运行”：\n\
  \n```groovy\ndef warning='[You can ARCHIVE this Job]'\ndef now=new Date()\n\nfor\
