  \ http://localhost:8080/ version\njava -jar jenkins-cli.jar -s http://localhost:8080/\
  \ who-am-i\njava -jar jenkins-cli.jar -s http://localhost:8080/ list-jobs\n```\n\
  \n3. 验证输出，如下所示：\n\n```text\nC:\\Users\\Mitesh\\Downloads>java -jar jenkins-cli.jar\
  \ -s http://localhost:8080/ version\n2.73\n\nC:\\Users\\Mitesh\\Downloads>java -jar\
