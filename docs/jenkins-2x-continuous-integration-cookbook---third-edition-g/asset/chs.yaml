- "## 在 Jenkins 中构建应用程序\n\n在本章中，我们将涵盖以下内容：\n\n+   - 配置 Ant 项目以执行构建\n+   - 配置 Maven\
  \ 项目以执行构建\n+   - 配置 Android 项目以执行构建\n+   - 操作环境变量\n+   - 在 Maven 中通过 Groovy 运行 Ant\n\
  +   - 基于 JSP 语法错误导致的 Jenkins 构建失败\n+   - 通过 Jenkins API 远程触发构建任务\n\n## 简介\n\n本章将回顾\
  \ Jenkins 与 Ant、Gradle 和 Maven 构建之间的关系，并简要介绍如何使用 Groovy 和 Ant 编写脚本。\n\nJenkins 极其灵活，能够很好地支持多种平台和技术。Jenkins\
  \ 拥有直观的界面和清晰的配置设置，非常适合完成构建任务。然而，明确划分 Jenkins 插件与 Maven 构建文件之间的边界同样非常重要。如果缺乏这种划分，你会过度依赖\
  \ Jenkins。如果你确定始终通过 Jenkins 运行构建，那么可以将部分核心工作放在 Jenkins 插件中，从而获得一些有用的额外功能。\n\nJenkins\
  \ 与具体技术无关，可以将企业内不同项目技术、开发团队以及软件生命周期中的各个阶段无缝衔接在一起。Jenkins 支持你选择任意脚本语言，并能轻松地通过 Git、Subversion、CVS\
  \ 以及其他版本控制系统获取源代码。如果 Jenkins 不兼容，稍加练习的开发者也可以编写自己的集成方式。\n\n在本书中，你会看到 Subversion 和\
  \ Git 项目都有提及，这反映了现实中的混合使用情况。许多人认为 Git 比 Subversion 更灵活。你可以放心地在本书示例中使用 Git 作为首选代码仓库。Jenkins\
  \ 从一开始就设计为让你能够轻松地在不同的版本控制系统之间进行选择。\n\n如果你查看 2014 年初 Ohoh 中具有代表性的 Git 与 Subversion\
  \ 使用情况，Git 有 247,103 个代码仓库（占总数的 37%），而 Subversion 有 324,895 个代码仓库（占总数的 48%）。\n\n\
  传统企业由于不愿改变工作流程，往往在使用最新技术方面落后于其他企业。因此，与规模较小的组织相比，这类企业使用 Subversion 仓库的比例会更高。\n\n\
  ## 配置 Ant 项目以执行构建\n\n让我们在 Jenkins 中配置一个 Ant 项目，包括静态代码分析、文件编译、创建包文件以及归档，这样你就可以在后续的其他构建任务或项目中使用它。\n\
