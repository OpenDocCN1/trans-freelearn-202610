  \ 性能指标\n\n在本节中，你将了解如何配置 Jenkins 来运行 JMeter 测试计划，然后收集并报告结果。还将解释如何将变量从 Ant 脚本传递到 JMeter。\n\
  \n## 准备工作\n\n假设你已经完成了上一节创建 JMeter 测试计划的内容。你还需要安装 Jenkins 性能插件（[https://wiki.jenkins-ci.org/display/JENKINS/Performance+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/Performance+Plugin)）。\n\
  \n## 操作步骤...\n\n- 1. 在 JMeter 中打开 `./examples/jmeter_example.jmx`，并另存为 `./plans/URL_ping.jmx`。\n\
  - 2. 选择 CSV Data Set Config，将文件名改为 `${__property(csv)}`。\n- 3. 在“文件”菜单下，选择“保存”选项。\n\
  - 4. 在项目的顶层创建一个 `build.xml` 文件，内容如下：\n\n```\n```xml\n<project default=\"jmeter.tests\"\
  >\n  <property name=\"jmeter\" location=\"/var/lib/jenkins/jmeter\" />\n  <property\
  \ name=\"target\" location=\"${basedir}/target\" />\n  <echo message=\"Running...\
  \ Expecting variables [jvarg,desc]\" />\n  <echo message=\"For help please read\
  \ ${basedir}/README\" />\n  <echo message=\"[DESCRIPTION] ${desc}\" />\n  <taskdef\
  \ name=\"jmeter\" classname=\"org.programmerplanet.ant.taskdefs.jmeter.JMeterTask\"\
  \ classpath=\"${jmeter}/extras/ant-jmeter-1.0.9.jar\" />\n  <target name=\"jmeter.init\"\
  >\n    <mkdir dir=\"${basedir}/jmeter_results\"/>\n    <delete includeemptydirs=\"\
  true\">\n      <fileset dir=\"${basedir}/jmeter_results\" includes=\"**/*\" />\n\
  \    </delete>\n  </target>\n  <target name=\"jmeter.tests\" depends=\"jmeter.init\"\
  \ description=\"launch jmeter load tests\">\n    <echo message=\"[Running] jmeter\
  \ tests...\" />\n    <jmeter jmeterhome=\"${jmeter}\" resultlog=\"${basedir}/jmeter_results/LoadTestResults.jtl\"\
  >\n      <testplans dir=\"${basedir}/plans\" includes=\"*.jmx\"/>\n      <jvmarg\
  \ value=\"${jvarg}\" />\n      <property name=\"csv\" value=\"${basedir}/data/URLS.csv\"\
  \ />\n    </jmeter>\n  </target>\n</project>\n```\n```\n\n- 5. 将更新提交到你的 Subversion\
  \ 项目。\n- 6. 登录 Jenkins。\n- 7. 创建一个名为 `ch6.remote.jmeter` 的新自由风格任务。\n- 8. 在“源码管理”下，勾选\
  \ Subversion，将你的 Subversion 仓库 URL 添加到“仓库 URL”中。\n- 9. 在“构建”部分中，添加构建步骤“调用 Ant”。\n\
  - 10. 在新的“调用 Ant”子部分中，单击“高级”，并为属性添加以下内容：\n\n```\n```properties\njvarg=-Xmx512m\n\
  desc= This is the first iteration in a performance test\nenvironment - Driven by\
  \ Jenkins\n```\n```\n\n- 11. 在“构建后操作”部分中，勾选“发布性能测试结果报告”。将输入 `jmeter_results/*.jtl`\
  \ 添加到“报告文件”中。\n- 12. 单击“保存”。\n- 13. 运行任务几次，并在“性能趋势”链接下查看结果。\n\n## 工作原理...\n\n`build.xml`\
  \ 文件是一个 Ant 脚本，它负责设置环境，然后调用库 `/extras/ant-jmeter-1.0.9.jar` 中定义的 JMeter Ant 任务。该\
  \ JAR 文件是标准 JMeter 发行版的一部分。\n\n位于 `plans` 目录下的任何 JMeter 测试计划都将运行。将测试计划从 `examples`\
  \ 目录移动到 `plans` 目录即可激活它。结果汇总在 `jmeter_results/LoadTestResults.jtl` 中。\n\nAnt 脚本将\
  \ `csv` 变量传递给 JMeter 测试计划；`.csv` 文件的位置为 `${basedir}/data/URLS.csv`。`${basedir}`\
  \ 由 Ant 自动定义。顾名思义，它是 Ant 项目的基本目录。\n\n你可以使用 `${__functioncall(parameters)}` 结构在其元素内调用\
  \ JMeter 函数。你已在测试计划的 CSV Data Set Config 元素中添加了函数调用 `${__property(csv)}`。该函数会拉取\
  \ Ant 脚本中定义的 `.csv` 值。\n\nJenkins 任务运行 Ant 脚本，Ant 脚本依次运行 JMeter 测试计划并汇总结果。随后，Jenkins\
  \ 性能插件解析结果，生成报告。\n\n## 更多内容...\n\n为了快速构建复杂的测试计划，可以考虑使用 JMeter 内置的透明代理（[http://jmeter.apache.org/usermanual/component_reference.html#HTTP_Proxy_Server](http://jmeter.apache.org/usermanual/component_reference.html#HTTP_Proxy_Server)）。你可以在本地机器的指定端口上运行它，并在\
  \ Web 浏览器中设置匹配的代理首选项。录制到的 JMeter 元素将让你清楚地了解所捕获请求中发送的参数。\n\n另一种选择是 Badboy（[http://www.badboysoftware.biz/docs/jmeter.html](http://www.badboysoftware.biz/docs/jmeter.html)），它有自己的内置\
  \ Web 浏览器。它允许你以类似于 Selenium IDE 的方式记录操作，然后将它们保存到 JMeter 测试计划。\n\n## 使用 FitNesse\
  \ 进行测试\n\nFitNesse（[http://fitnesse.org](http://fitnesse.org)）是一个完全集成的独立 wiki 和验收测试框架。你可以在表格中编写测试并运行它们。使用\
  \ wiki 语言编写测试扩大了潜在测试编写者的范围，并减少了学习新框架所需的最初工作量。\n\n如果测试通过，表格行会以绿色显示；如果失败，则以红色显示。测试可以被\
  \ wiki 内容包围，在同一位置提供上下文信息，例如用户故事。你还可以考虑在 FitNesse 中创建 Web 应用程序的模型（mock-ups），与测试放在一起，并将测试指向这些模型。\n\
  \n本节介绍如何在远程运行 FitNesse，并在 Jenkins 中显示结果。\n\n\n\n\n## 准备工作\n\n从 [http://fitnesse.org/FitNesseDownload](http://fitnesse.org/FitNesseDownload)\
  \ 下载最新的稳定版 FitNesse JAR 包。从 [https://wiki.jenkins-ci.org/display/JENKINS/FitNesse+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/FitNesse+Plugin)\
  \ 安装适用于 Jenkins 的 FitNesse 插件。\n\n## 操作步骤\n\n1. 创建 `fit/logs` 目录，并将 `fitnesse-standalone.jar`\
  \ 放入 `fit` 目录中。\n2. 在命令行中运行 FitNesse 帮助命令，查看相关选项：\n\n```\njava -jar fitnesse-standalone.jar\
  \ -help\nUsage: java -jar fitnesse.jar [-vpdrleoab]\n-p <port number> {80}\n-d <working\
  \ directory> {.}\n-r <page root directory> {FitNesseRoot}\n-l <log directory> {no\
  \ logging}\n-f <config properties file> {plugins.properties}\n-e <days> {14} Number\
  \ of days before page versions expire\n-o omit updates\n-a {user:pwd | user-file-name}\
  \ enable authentication.\n-i Install only, then quit.\n-c <command> execute single\
  \ command.\n-b <filename> redirect command output.\n-v {off} Verbose logging\n```\n\
  3. 在命令行中运行 FitNesse，查看启动输出：\n\n```\njava -jar fitnesse-standalone.jar -p 39996 -l\
  \ logs -a tester:test\nBootstrapping FitNesse, the fully integrated standalone wiki\
  \ and acceptance\ntesting framework.\nroot page: fitnesse.wiki.fs.FileSystemPage\
  \ at ./FitNesseRoot#latest\nlogger: /home/alan/Desktop/X/fitness/logs\nauthenticator:\
  \ fitnesse.authentication.OneUserAuthenticator\npage factory: fitnesse.html.template.PageFactory\n\
  page theme: fitnesse_straight\nStarting FitNesse on port: 39996\n```\n4. 使用 Web\
  \ 浏览器访问 http://localhost:39996。\n5. 点击 **Acceptance Test** 链接。\n6. 点击 **Suite**\
  \ 链接。这将启动一组测试。根据你的计算机性能，测试可能需要几分钟才能完成。直接链接为 http://localhost:39996/FitNesse.SuiteAcceptanceTests?suite。\n\
  7. 点击 **Test History** 链接。你需要使用用户名 `tester` 和密码 `test` 登录。\n8. 查看 `fit/logs` 目录中的日志。再次运行测试套件后，你将看到类似于以下内容的记录：\n\
  \n```\n127.0.0.1 - tester [01/Oct/2014:11:14:59 +0100] \"GET\n/FitNesse.SuiteAcceptanceTests?suite\
  \ HTTP/1.1\" 200 6086667\n```\n9. 登录 Jenkins，创建一个名为 `ch6.remote.fitnesse` 的自由风格软件项目。\n\
  10. 在 **构建** 部分，从 **添加构建步骤** 中选择 **Execute fitnesse tests** 选项。\n11. 勾选 **FitNesse\
  \ instance is already running** 选项，并填写：\n\n- FitNesse 主机：`localhost`\n- FitNesse\
  \ 端口：`39996`\n- 目标页面：`FitNesse.SuiteAcceptanceTests?suite`\n- 勾选 **Is target a suite**\
  \ 选项\n- HTTP 超时时间（毫秒）：`180000`\n- FitNesse XML 结果文件路径：`fitnesse-results.xml`\n12.\
