  \n- 5. 点击 Quality Profiles 选项卡，查看 SonarQube 中可用的默认质量配置文件详情。\n- 6. 质量配置文件是 SonarQube\
  \ 的核心；它只是一组特定于某语言的规则。如果没有明确说明，所有项目都将使用默认配置文件进行分析。然而，理想情况下，每个项目都应有一个配置文件，以便可以设置或停用特定规则。每种语言都有一个名为“Sonar\
