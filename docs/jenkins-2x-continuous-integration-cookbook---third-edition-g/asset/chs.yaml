  \ >”：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_138_0.png)\n\n3. 查看要安装的项，并点击“下一步\
  \ >”。\n\n4. 接受许可协议的条款，然后点击“完成”。将开始安装 Mylyn 软件包。\n\n5. 安装完成后，重启 Eclipse。\n\n### 如何操作...\n\
