- "# 10. 提升质量的流程\n## 文化与协作\n## 尽早失败或更快失败\n## 基于数据的测试\n## 从历史中学习\n## 将测试自动化视为软件项目\n\
  ## 可视化、可视化、再可视化！\n## 规范是好的\n## 测试框架和商业选择日益增多\n## 将工作转移到 Jenkins 节点\n## 饥饿的 QA/集成服务器\n\
  ## 阅读 Jenkins 的变更日志\n## 避免人为瓶颈\n## 避免群体思维\n## 培训与社区\n##  公开奖励成功的开发者\n## 稳定性与代码维护\n\
  ## 质量保证资源\n## 总是有更多\n## 最后的评论\n\n## 前言\n\nJenkins 是一个基于 Java 的自动化服务器，支持在软件周期早期发现缺陷并以自动化方式部署应用程序包。得益于数量迅速增长的插件，Jenkins\
  \ 可以与许多类型的系统通信，构建并触发各种测试，以及与各种发布管理服务集成。\n\nCI 涉及对软件进行小幅更改，然后构建并应用质量保证流程。缺陷不仅出现在代码中，还出现在命名规范、文档、软件设计方式、构建脚本、将软件部署到服务器的过程等方面。CI\
  \ 迫使缺陷尽早暴露，而不是等到软件完全制作完成。如果缺陷在软件开发生命周期的后期阶段被发现，流程将更加昂贵。一旦错误逃逸到生产环境，修复成本就会急剧增加。估计显示，尽早捕获缺陷的成本要低\
  \ 100 到 1,000 倍。有效使用 Jenkins 等 CI 服务器，可能就是在享受假期和加班不计其数地英雄式拯救之间的区别。而且正如你能想象的，在我的日常工作中作为一名具有质量保证抱负的高级开发人员，我喜欢无聊的日子，至少对于关键任务的生产环境而言。\n\
  \n持续交付（CD）涉及在本地或云环境中的 Web 服务器或应用程序服务器上部署应用程序。Jenkins 支持与许多云服务提供商的集成，也支持与平台即服务提供的集成。借助\
  \ shell 脚本和命令执行支持，还可以实现许多部署和配置场景。\n\nJenkins 可以定期自动化构建软件并触发测试，提取结果并根据定义的标准进行失败。早期通过构建失败而失败可降低成本，增加对所生产软件的信心，并有可能将主观流程转变为开发团队认为无偏见的积极的基于指标的流程。\n\
  \nJenkins 不仅仅是一个自动化服务器，它也是一个充满活力且高度活跃的社区。开明的自利决定了参与。\n\n## 本书涵盖内容\n\n**第 1 章，开始使用\
  \ Jenkins**，介绍如何在 Windows、CentOs、Microsoft Azure 和 AWS 上安装 Jenkins 2.x。包含重要的配方，展示如何安装或上传插件，如何配置代理，如何在管理\
  \ Jenkins 中配置 JENKINS_HOME 和工具。本章还将介绍如何为 Ant 和 Maven 项目创建自由风格作业\n\n**第 2 章，Jenkins\
  \ 的管理和监控**，帮助我们理解主/代理架构，如何使用 Eclipse 管理 Jenkins 构建作业，备份和恢复 Jenkins，使用 Jenkins CLI\
  \ 的命令行选项，管理磁盘使用情况，安全关闭 Jenkins，监控 Jenkins，以及配置电子邮件通知。\n\n**第 3 章，管理安全**，介绍如何通过 Jenkins\
  \ 配置提高安全性，配置基于矩阵的安全性和处理基于项目的矩阵授权策略。它还将介绍 Jenkins 及其与 OpenLDAP 和 Active Directory\
  \ 的集成。稍后在本章中，我们将介绍 Jenkins 与 OWASP Zed Attack Proxy 集成的主题，通过模糊测试在 Jenkins 中查找 500\
  \ 错误和 XSS 攻击，探索 OWASP Dependency-Check 插件，以及使用 Audit Trail 插件。\n\n**第 4 章，改进代码质量**，探讨源代码度量的使用。为了节省资金并提高质量，需要尽早在软件生命周期中消除缺陷。本章介绍如何将\
  \ Jenkins 与 SonarQube 集成，如何在 SonarQube 中更新中心、质量门、质量配置文件和规则，使用 SonarQube 验证 HTML、CSS\
  \ 和 JavaScript 的有效性，使用 SonarQube 验证 Java 代码，以及将 SonarQube 配置为 Windows 服务。\n\n**第\
  \ 5 章，在 Jenkins 中构建应用程序**，详细介绍为执行配置 Ant、Maven 和 Android 项目的方法，如何配置环境变量，通过 Maven\
  \ 运行 Groovy 脚本，通过 Maven 中的 Groovy 运行 Ant，以及通过 Jenkins API 远程触发作业。\n\n**第 6 章，持续交付**，讨论持续交付，如何归档工件，从其他构建作业复制工件，将\
  \ Jenkins 与 Artifactory 集成，从 Jenkins 将 WAR 文件部署到 Tomcat、AWS Beanstalk、Azure 应用服务，以及如何提升构建。\n\
  \n**第 7 章，持续测试**，详细介绍持续测试，如何从 Jenkins 发布单元测试报告，使用 Eclipse 创建 Selenium 测试用例，将 Jenkins\
  \ 和 Selenium 集成用于功能测试，Jenkins 和 Cucumber 测试报告，在 Apache JMeter 中创建负载测试，从 Jenkins\
  \ 执行负载测试，报告 JMeter 性能指标，以及使用 FitNesse 进行测试。\n\n**第 8 章，编排**，探讨流水线的编排，了解上游和下游作业，配置上游和下游作业，配置构建流水线，创建流水线作业，使用示例流水线进行执行，为端到端自动化配置流水线作业，以及开始使用\
  \ Blue Ocean 仪表板。\n\n**第 9 章，Jenkins UI 自定义**，详细介绍使用 simple themes 插件为 Jenkins 换肤，使用\
  \ WAR 覆盖层对 Jenkins 进行换肤和配置，生成主页，创建 HTML 报告，高效使用视图，\n\n使用 Dashboard View 插件节省屏幕空间，\n\
  \n使用 HTML5 浏览器发出噪音，以及为接待区提供极端视图。\n\n## 你需要什么\n\n本书面向初学者。假设你至少熟悉 Java 编程语言。了解核心 Java\
  \ 和 JEE 对于使用本书获得更好见解至关重要。对程序逻辑的深入理解将为你提供使用插件编写 shell 命令时在 Jenkins 中保持生产力的背景。\n\n\
  由于应用程序开发生命周期通常涵盖许多工具，因此掌握 SVN 和 Git 等存储库、Eclipse 等 IDE 工具以及 Ant 和 Maven 等构建工具等知识至关重要。\n\
  \n了解代码分析工具将使配置和集成工作更轻松；然而，对于本书中给出的练习来说，这并不是必不可少的。大多数配置步骤都已明确说明。用于代码分析的是 SonarQuve\
  \ 6.3 版本。\n\n你将逐步了解在基于 Windows 和 Linux 的主机上安装 Jenkins 所需的步骤。为了立即成功，你需要对运行现代版本的 Windows\
  \ 和 Linux 的主机具有管理员访问权限；Windows 10 将用于演示目的。如果你是更有经验的读者，那么几乎任何发行版的最新版本也同样适用（但你可能需要做一些书中未概述的额外工作）。\n\
  \n你可以使用 Microsoft Azure 的免费试用版来完成一些配方。\n\n此外，你需要访问互联网来下载你尚未拥有的插件，以及 Jenkins 的安装。任何正常的硬件配置都足够，例如\
  \ 4 GB RAM 和 500 GB 硬盘。\n\n\n\n\n\n## 本书适合谁\n\n_Jenkins Continuous Integration Cookbook_\
  \ 适合初学者和高级用户。本书面向参与应用程序开发生命周期的开发人员和系统管理员，并希望对其进行自动化。开发人员、技术负责人、测试人员和运维专业人员是本书的目标读者，可快速启动\
  \ Jenkins。读者应了解开发和运维团队面临的问题，因为他们是应用程序生命周期管理流程中的利益相关者。启动 Jenkins 的原因是为了了解持续集成（CI）、持续测试和持续交付（CD）对有效应用程序生命周期管理所做的重要贡献。\n\
  \n## 约定\n\n在本书中，您会找到多种文本样式来区分不同类型的信息。以下是这些样式的示例及其含义。\n\n正文中出现的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 Twitter 账号显示如下：\"We can include other contexts through the use of the\
  \ include directive.\"\n\n代码块设置如下：\n\n```\n@charset \"utf-8\";\n#test {\nbackground-image:\
  \ url(/userContent/camera.png);\n}\n#main-table{\nbackground-image: url(/userContent/camera.png)\n\
  !important;\n}\n```\n\n当我们希望引起您对代码块中特定部分的注意时，相关行或项目以粗体显示：\n\n```\n<project xmlns=\"\
  http://maven.apache.org/POM/4.0.0\"\nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \nxsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0\nhttp://maven.apache.org/maven-v4_0_0.xsd\"\
  >\n<modelVersion>4.0.0</modelVersion>\n<groupId>nl.uva.berg</groupId>\n```\n\n任何命令行输入或输出都写成如下形式：\n\
  \n```\n---Project and session\nProject: class org.apache.Maven.model.Model\nSession:\
