  \n6. 从构建后操作中发布 Android Lint 结果，如下图所示：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_343_0.png)\n\
  \n7. 这样，我们就可以为持续集成或执行配置 Ant、Maven 和 Android 项目，以创建可分发给或部署的包文件。\n\n## 操作环境变量\n\n\
  本方案介绍如何将变量从 Jenkins 传递到构建任务，以及不同变量如何被覆盖。它还描述了一种在关键信息未正确传递时导致构建失败的方法。\n\n在典型的开发/验收/生产环境中，您希望保留相同的\
  \ `pom.xml` 文件，但传递不同的配置。一个例子是属性文件的扩展名，如 `.dev`、`.acc` 和 `.prd`。如果由于人为错误导致关键配置值缺失，您希望构建失败。\n\
  \nJenkins 有许多插件可用于向构建传递信息，包括 EnvFile 插件（[https://wiki.jenkins-ci.org/display/JENKINS/Envfile+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/Envfile+Plugin)）和\
  \ EnvInject 插件（[https://wiki.jenkins-ci.org/display/JENKINS/EnvInject+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/EnvInject+Plugin)）。本方案选择\
  \ EnvInject 插件，因为据报道它可以与节点配合使用，并提供多种属性注入选项。\n\n### 操作步骤...\n\n1. 创建一个 Jenkins 可读的\
  \ `pom.xml` 文件，包含以下代码行：\n\n```xml\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\"\
  \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:schemaLocation=\"\
  http://maven.apache.org/POM/4.0.0\nhttp://maven.apache.org/maven-v4_0_0.xsd\">\n\
  <modelVersion>4.0.0</modelVersion>\n<groupId>org.berg</groupId>\n<artifactId>ch3.jenkins.builds.properties</artifactId>\n\
  <version>1.0-SNAPSHOT</version>\n<name>${project.name}</name>\n<properties><project.build.sourceEncoding>UTF8</project.build.sourceEncoding>\n\
  </properties>\n<build>\n<plugins><plugin>\n<groupId>org.codehaus.gmaven</groupId>\n\
  <artifactId>gmaven-plugin</artifactId>\n<version>1.3</version>\n<executions>\n<execution>\n\
  <id>run-myGroovy</id>\n<goals><goal>execute</goal></goals>\n<phase>verify</phase>\n\
  <configuration>\n<source>\ndef environment = System.getenv()\nprintln \"---Environment\"\
  \nenvironment.each{println it }\nprintln \"---Property\"\nprintln(System.getProperty(\"\
  longname\"))\nprintln \"---Project and session\"\nprintln \"Project: ${project.class}\"\
  \nprintln \"Session: ${session.class}\"\nprintln \"longname: ${project.properties.longname}\"\
  \nprintln \"Project name: ${project.name}\"\nprintln \"JENKINS_HOME: ${project.properties.JENKINS_HOME}\"\
  \n</source>\n</configuration>\n</execution></executions>\n</plugin></plugins>\n\
  </build>\n</project>\n```\n\n2. 创建一个名为 `my.properties` 的文件，并将其放在与 `pom.xml` 文件相同的目录中。然后，在\
  \ `my.properties` 文件中添加以下代码行：\n\n```properties\nproject.type=prod\nsecrets.file=/etc/secrets\n\
  enable.email=true\nJOB_URL=I AM REALLY NOT WHAT I SEEM\n```\n\n3. 创建一个名为 `ch3.environment`\
  \ 的空白 Freestyle 任务。\n\n4. 在“源代码管理”部分，勾选“文件系统”，并在“路径”字段中为您的目录添加一个完整路径，例如 `/var/lib/jenkins/cookbook/ch3.building_software/environment`。\n\
  \n5. 在“构建”部分，选择“调用顶层 Maven 目标”添加一个构建步骤。在新展开的部分中，添加以下详细信息：\n\n```text\nMaven version:\
  \ 3.2.1\nGoals: verify\n```\n\n6. 点击“高级”按钮，并在“属性”中键入 `longname=SuperGood`。\n\n###\
  \ 工作原理...\n\nEnvInject 插件对于向构建中注入属性非常有用。\n\n在本方案中，Maven 会运行两次。第一次运行时未定义 `name.from.jenkins`\
  \ 变量，Jenkins 任务失败。第二次运行时定义了该变量，Jenkins 任务成功。\n\nMaven 期望定义 `name.from.jenkins` 变量，否则项目的名称也将不会被定义。通常，这不足以阻止任务成功。然而，在运行\
  \ Groovy 代码时，`println \"Project name: ${project.name}\"` 这一行，特别是 `project.name`\
  \ 调用，会导致构建失败。这对于防止属性值缺失非常有用。\n\nGroovy 代码可以查看 `org.apache.Maven.model.Model` 项目和\
  \ `org.apache.Maven.execution.MavenSession` 类的实例。项目实例是 XML 配置的模型，您可以以编程方式访问。您可以通过\
  \ `project.properties.longname` 引用 longname 属性。如果该属性不存在，您的 Maven 目标将失败。您还可以通过 `System.getProperty(\"\
  longname\")` 调用来获取该属性。但是，您无法通过 `System.getenv()` 环境调用获取该属性。\n\n非常值得了解各种选项：\n\n-\
  \ **保留 Jenkins 环境变量和保留 Jenkins 构建变量：** 这两个选项都会影响您的任务所看到的与 Jenkins 相关的变量。最好保持环境尽可能干净，因为这有助于您稍后进行调试。\n\
  - **属性内容：** 您可以覆盖属性文件中的特定值。\n- **环境脚本文件路径：** 此选项指向一个将设置环境的脚本。如果您想检测运行环境的特定细节并相应地配置构建，这很有用。\n\
  - **填充构建原因：** 您可以启用 Jenkins 设置 `BUILD_CAUSE` 环境变量。该变量包含有关触发任务的事件的信息。\n\n### 扩展阅读...\n\
  \nMaven 有一个用于读取属性的插件（http://mojo.codehaus.org/properties-maven-plugin/）。要在属性文件之间进行选择，您需要在插件配置中设置一个变量，并将其作为\
  \ Jenkins 任务的一部分调用，如下所示：\n\n```\n<build>\n<plugins>\n<plugin>\n<groupId>org.codehaus.mojo</groupId>\n\
  <artifactId>properties-maven-plugin</artifactId>\n<version>1.0-alpha-2</version>\n\
  <executions>\n<execution>\n<phase>initialize</phase>\n<goals>\n<goal>read-project-properties</goal>\n\
  </goals>\n<configuration>\n<files>\n<file>${fullpath.to.properties}</file>\n</files>\n\
  </configuration>\n</execution>\n</executions>\n</plugin>\n</plugins>\n</build>\n\
  ```\n\n如果您使用指向 `properties` 文件的相对路径，那么该文件可以位于您的源代码中。如果您使用完整路径，则 `properties` 文件可以存储在\
  \ Jenkins 服务器上。如果包含敏感密码（例如数据库连接密码），则第二种选择更佳。\n\nJenkins 可以在您手动运行任务时请求变量。这称为参数化构建（https://wiki.jenkins-ci.org/display/JENKINS/Parameterized+Build）。在构建时，您可以从一系列属性文件位置中进行选择，从而选择您的属性文件。\n\
  \n\n\n\n## 另请参阅\n\n-   *《在 Maven 中通过 Groovy 运行 Ant》*配方\n\n## 在 Maven 中通过 Groovy\
  \ 运行 Ant\n\nJenkins 所面向的用户具有广泛的技术背景。许多开发者在转向使用 Maven 之前就已精通 Ant 脚本编写，他们可能更乐于编写 Ant\
  \ 任务，而不是编辑 pom.xml 文件。在相当一部分组织中，仍然运行着关键业务的 Ant 脚本。\n\n在 Maven 中，你可以直接使用 AntRun 插件（http://maven.apache.org/plugins/maven-antrun-plugin/）或通过\
  \ Groovy（http://docs.codehaus.org/display/GROOVY/Using+Ant+from+Groovy）来运行 Ant 任务。AntRun\
  \ 代表了一条自然的迁移路径，也是初期工作最少的路径。\n\n对于将 Groovy 作为任务一部分的 Jenkins 管理员来说，Groovy 方法很有意义。作为一种一流的编程语言，Groovy\
  \ 拥有许多 Ant 难以复制的控制结构。你可以使用 Ant-contrib 库（http://ant-contrib.sourceforge.net）来部分实现这些控制结构。然而，作为一种功能丰富的编程语言，Groovy\
  \ 的表达能力要强得多。\n\n本配方详细介绍了如何运行两个涉及 Groovy 和 Ant 的 Maven POM 文件。第一个 POM 展示了如何在 Groovy\
  \ 中运行最简单的 Ant 任务，第二个 POM 则执行一个 Ant-Contrib 任务，以安全地从大量计算机复制文件。\n\n## 准备工作\n\n创建一个名为\
  \ `ch3.building_software/antbuilder` 的目录。\n\n## 如何操作...\n\n- 1. 创建一个模板文件并将其命名为 `pom_ant_simple.xml`。\n\
  - 2. 将 `groupId`、`artifactId`、`version` 和 `name` 的值改为适合你的值。\n- 3. 在 `</project>`\
  \ 标签之前添加以下 XML 片段：\n\n```xml\n<build>\n  <plugins><plugin>\n    <groupId>org.codehaus.gmaven</groupId>\n\
  \    <artifactId>gmaven-plugin</artifactId>\n    <version>1.3</version>\n    <executions>\n\
  \      <execution>\n        <id>run-myGroovy-test</id>\n        <goals><goal>execute</goal></goals>\n\
  \        <phase>test</phase>\n        <configuration>\n          <source>\n    \
  \        def ant = new AntBuilder()\n            ant.echo(\"\\n\\nTested ----> With\
  \ Groovy\")\n          </source>\n        </configuration>\n      </execution>\n\
  \      <execution>\n        <id>run-myGroovy-verify</id>\n        <goals><goal>execute</goal></goals>\n\
  \        <phase>verify</phase>\n        <configuration>\n          <source>\n  \
  \          def ant = new AntBuilder()\n            ant.echo(\"\\n\\nVerified at\
  \ ${new Date()}\")\n          </source>\n        </configuration>\n      </execution>\n\
  \    </executions>\n  </plugin></plugins>\n</build>\n```\n\n- 4. 运行 `mvn test -f\
  \ pom_ant_simple.xml`。查看输出（注意不会出现关于空 JAR 文件的警告）：\n- 5. 运行 `mvn verify -f pom_ant_simple.xml`。查看输出，它应该类似于以下截图：\n\
  \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_354_0.png)\n\n- 4. 创建第二个模板文件并将其命名为 `pom_ant_contrib.xml`。\n\
  - 5. 将 `groupId`、`artifactId`、`version` 和 `name` 的值改为适合你的值。\n- 6. 在 `</project>`\
  \ 标签之前添加以下 XML 片段：\n\n```xml\n<build>\n<plugins><plugin>\n<groupId>org.codehaus.gmaven</groupId>\n\
  <artifactId>gmaven-plugin</artifactId>\n<version>1.3</version>\n<executions>\n<id>run-myGroovy</id>\n\
  <goals><goal>execute</goal></goals>\n<phase>verify</phase>\n<configuration>\n<source>\n\
  def ant = new AntBuilder()\nhost=\"Myhost_series\"\nprint \"user: \"\nuser = new\
  \ String(System.console().readPassword())\nprint \"password: \"\npw = new String(System.console().readPassword())\n\
  \nfor ( i in 1..920) {\n  counterStr=String.format('%02d',i)\n  ant.scp(trust:'true',file:\"\
  ${user}:${pw}@${host}${counterStr}:/${full_path_to_loca\n\nlocalTofile:\"${myfile}-${counterStr}\"\
  , verbose:\"true\")\n}\n</source>\n</configuration>\n</execution>\n</executions>\n\
  <dependencies>\n<dependency>\n<groupId>ant</groupId>\n<artifactId>ant</artifactId>\n\
  <version>1.6.5</version>\n</dependency>\n<dependency>\n```\n\n```xml\n<groupId>ant</groupId>\n\
  <artifactId>ant-launcher</artifactId>\n<version>1.6.5</version>\n</dependency>\n\
  <dependency>\n<groupId>ant</groupId>\n<artifactId>ant-jsch</artifactId>\n<version>1.6.5</version>\n\
  </dependency>\n<dependency>\n<groupId>com.jcraft</groupId>\n<artifactId>jsch</artifactId>\n\
  <version>0.1.42</version>\n</dependency>\n</dependencies>\n</plugin></plugins>\n\
  </build>\n```\n\n这只是示例代码，除非你已将其设置为指向真实服务器上的真实文件：\n\n```text\nmvn verify -f pom_ant_simple.xml\
  \ will fail\n```\n\n## 工作原理...\n\nGroovy 无需额外依赖即可运行基本的 Ant 任务。系统会创建一个 `AntBuilder`\
  \ 实例（http://groovy.codehaus.org/Using+Ant+Libraries+with+AntBuilder），然后调用 Ant 的\
  \ echo 任务。在底层，Groovy 会调用 Ant 用于执行 `echo` 命令的 Java 类。在 `echo` 命令中，通过直接创建一个匿名对象来打印日期：\n\
  \n```\nant.echo(\"\\n\\nVerified at ${new Date()}\").\n```\n\n你将 `pom.xml` 文件配置为在两个阶段触发\
  \ Groovy 脚本：test 阶段，以及随后的 verify 阶段。test 阶段发生在生成 JAR 文件之前，因此避免了创建空 JAR 文件的警告。顾名思义，该阶段适用于打包前的测试。\n\
  \n第二个示例脚本凸显了 Groovy 与 Ant 结合的优势。SCP 任务（http://ant.apache.org/manual/Tasks/scp.html）在多台服务器上被多次运行。脚本首先要求输入用户名和密码，避免将其存储在文件系统或版本控制系统中。Groovy\
  \ 脚本需要你注入 `host`、`full_path_to_location` 和 `myfile` 变量。\n\n请注意 Ant SCP 任务与其在 `pom_ant_contrib.xml`\
  \ 文件中的表达方式之间的相似性。\n\n## 更多内容...\n\n通过 Groovy 运行 Ant 的另一个示例是即时创建自定义属性文件。这允许你将信息从一个\
  \ Jenkins 任务传递到另一个任务。\n\n你可以通过 AntBuilder 使用 echo 任务创建属性文件。以下代码行创建一个包含两行（x=1 和 y=2）的\
  \ value.properties 文件：\n\n```\ndef ant = new AntBuilder()\nant.echo(message: \"\
  x=1\\n\", append: \"false\", file: \"values.properties\")\nant.echo(message: \"\
  y=2\\n\", append: \"true\", file: \"values.properties\")\n```\n\n第一个 echo 命令将 append\
  \ 设置为 false，因此每次构建时都会创建一个新的属性文件。第二个 echo 命令则追加其消息。\n\n你可以移除第二个 append 属性，因为其默认值为\
  \ true。\n\n## 准备工作\n\n创建一个名为 `ch3.building_software/jsp_example` 的目录。\n\n```html\n\
  </html>\n```\n\n- 6. 使用 `mvn package` 命令创建 WAR 文件。\n- 7. 通过在以 `if` 开头的行下方添加 `if\
  \ (evilInput==null)` 来修改 `./src/main/webapp/index.jsp`，使其不再是一个有效的 JSP 文件。\n- 8.\
  \ 运行 `mvn package` 命令。现在构建将失败，并显示以下错误消息：\n\n```text\n[ERROR] Failed to execute goal\
  \ org.mortbay.jetty:maven-jetty-jspc-\nplugin:6.1.14:jspc (jspc) on project jsp_example:\
  \ Failure processing jsps ->\n[Help 1]\n```\n\n## 工作原理...\n\n你使用一个原型（archetype）创建了一个模板项目。\n\
  \nMaven 插件在检测到 `index.jsp` 页面后，会将其编译成一个名为 `jsp.index_jsp` 的类，并将编译后的类放在 `WEB-INF/classes`\
  \ 下。随后，插件会在 `WEB-INF/web.xml` 中将该类定义为 servlet，并映射到 `/index.jsp`。让我们看下面的示例：\n\n```xml\n\
  <servlet>\n<servlet-name>jsp.index_jsp</servlet-name>\n<servlet-class>jsp.index_jsp</servlet-class>\n\
  </servlet>\n\n<servlet-mapping>\n<servlet-name>jsp.index_jsp</servlet-name>\n<url-pattern>/index.jsp</url-pattern>\n\
  </servlet-mapping>\n```\n\n原型（archetype）列表会随时间不断增长。你可以在 [http://maven-repository.com/archetypes](http://maven-repository.com/archetypes)\
  \ 找到完整列表。如果你运行的是 Ubuntu，你会在 `~/.m2` 目录下找到一个名为 `archetype-catalog.xml` 的本地 XML 目录文件，其中列出了所有原型。\n\
  \n\n\n## 更多内容...\n\n这里有一些你应该考虑的事项。\n\n## 用于JSP页面的Eclipse模板\n\nEclipse是一个流行的Java开发者开源IDE（http://www.eclipse.org/）。如果你使用Eclipse及其默认的JSP页面模板，那么你的页面可能无法编译。这是因为，在撰写本文时，默认编译器不喜欢在<html>标签之前提到的元信息，如下所示：\n\
  \n```\n<%@ page language=\"java\" contentType=\"text/html;charset=UTF-8\"\npageEncoding=\"\
  UTF-8\"%>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n\"\
  http://www.w3.org/TR/html4/loose.dtd\">\n```\n\n由于元信息遵循JSP规范，很可能之后JSP编译器会接受该信息。在那之前，只需在编译前删除这些行，或者更换你使用的JSP编译器。\n\
  \n## 通过Jenkins API远程触发作业\n\nJenkins有一个远程API，允许你启用、禁用、运行和删除作业；它还允许你更改配置。该API随着每个Jenkins版本而增加。要获取最新的详细信息，你需要查看`http://yourhost/job/Name_of_Job/api/`。其中`yourhost`是你Jenkins服务器的位置，`Name_of_Job`是你服务器上存在的作业名称。\n\
  \n本教程详细介绍了如何使用安全令牌远程触发构建。这将允许你从Maven内部运行其他作业。\n\n## 准备工作\n\n本教程期望Jenkins安全已开启，以便你可以作为用户登录。它还假设你安装了现代版本的wget（http://www.gnu.org/software/wget/）。\n\
  \n## 操作步骤...\n\n- 1. 创建一个Freestyle项目，项目名称为`ch3.RunMe`。\n- 2. 勾选“此构建已参数化”（This Build\
  \ is parameterized），选择“字符串参数”（String Parameter），并添加以下详细信息：\n  - 1. 名称（Name）：`myvariable`\n\
  \  - 2. 默认值（DefaultValue）：`Default`\n  - 3. 描述（Description）：`This is my example\
  \ variable`\n- 3. 在“构建触发器”（Build Triggers）部分，勾选“远程触发构建（例如，从脚本）”（Trigger builds remotely\
  \ (for example, from scripts)）。\n- 4. 在“身份验证令牌”（Authentication Token）文本框中，添加`changeme`。\n\
  - 5. 点击“保存”（Save）按钮。\n- 6. 点击“使用参数构建”（Build with Parameters）链接。\n- 7. 系统会要求你输入名为`myvariable`的变量。点击“构建”（Build）。\n\
  - 8. 访问你的个人配置页面，例如http://localhost:8080/，将`your_user`替换为你的Jenkins用户名。\n- 9. 在“API令牌”（API\
  \ Token）部分，点击“显示API令牌...”（Show API Token...）按钮。\n- 10. 将令牌复制到`apiToken`。\n- 11.\
  \ 从终端控制台运行`wget`以登录并远程运行作业：\n- 12. 检查Jenkins作业，验证它尚未运行并返回405 HTTP状态码：\n- 13. 从终端控制台运行`wget`以登录并运行作业，返回201\
  \ HTTP状态码：\n\n```\nwget --auth-no-challenge --http-user=username --http-password=apiToken\n\
  http://localhost:8080/job/ch3.RunMe/build?token=changeme\n```\n\n```\nResolving\
  \ localhost (localhost)... 127.0.0.1\nConnecting to localhost (localhost)|127.0.0.1|:8080...\
  \ connected.\nHTTP request sent, awaiting response... 405 Method Not Allowed\n2014-08-14\
  \ 15:08:43 ERROR 405: Method Not Allowed.\n```\n\n```\nwget --auth-no-challenge\
  \ --http-user=username --http-password=apiToken\nhttp://localhost:8080/job/ch3.RunMe/buildWithParameters?\n\
  token=changeme&myvariable='Hello World'\nConnecting to localhost (localhost)|127.0.0.1|:8080...\
  \ connected.\nHTTP request sent, awaiting response... 201 Created\n```\n\nHTTP可能会被第三方进行数据包嗅探。传输密码时请使用HTTPS。\n\
  \n## 更多内容...\n\n这里有一些你应该考虑的事项。\n\n## 从Maven内部运行作业\n\n无需多费周折，你可以通过Maven-AntRun插件运行wget。以下是等价的`pom.xml`片段：\n\
  \n```\n```xml\n<build>\n<plugin>\n<groupId>org.apache.maven.plugins</groupId>\n\
  <artifactId>maven-antrun-plugin</artifactId>\n<version>1.7</version>\n<executions><execution>\n\
  <phase>compile</phase>\n<configuration>\n<tasks>\n<exec executable=\"wget\">\n<arg\
  \ line=\"--auth-no-challenge --http-user=username --http-password=apiToken http://localhost:8080/job/ch3.RunMe/build?token=changeme\"\
  \ />\n</exec>\n</tasks>\n</configuration>\n<goals><goal>run</goal></goals>\n</execution></executions>\n\
  </plugin>\n</build>\n```\n```\n\n你可以使用Exec Maven插件来达到与Maven-AntRun插件相同的目的。更多详情，请访问http://mojo.codehaus.org/exec-maven-plugin/。\n\
  \n## 远程生成作业\n\n还有一个项目允许你通过Maven远程创建Jenkins作业（https://github.com/evgeny-goldin/maven-plugins/tree/master/jenkins-maven-plugin）。这种方法的好处是能够在作业之间强制实现一致性和复用。你可以使用一个参数来选择Jenkins服务器并填充它。这对于生成大量结构一致的作业非常有用。\n\
  \n## 另请参阅\n\n- *通过Maven中的Groovy运行Ant*的教程\n"
- "## 持续交付\n\n在本章中，我们将介绍以下教程：\n\n- 归档构件\n- 从另一个构建作业复制构件\n- 将Jenkins与Artifactory集成\n\
  - 从Jenkins将WAR文件部署到Tomcat\n- 从Jenkins将WAR文件部署到AWS Beanstalk\n- 从Jenkins将WAR文件部署到Azure应用服务\n\
  - 提升构建\n\n## 引言\n\n**持续交付（CD）**是一种DevOps实践，用于在非生产环境中通过自动化方法快速部署应用程序，同时保持高质量。它关乎应用程序包在开发、测试或预发布等环境中的Web服务器或应用服务器上的部署方式。应用程序的部署可以使用shell脚本、批处理文件或Jenkins中可用的插件来完成。在持续交付和持续部署的情况下，自动化部署的方法在大多数时候总是相同的。在持续交付的情况下，应用程序包始终是生产就绪的。\n\
  \n## 归档构件\n\n当你想在另一个项目或构建作业中使用可安装或分发包时，构件归档非常有用。通常，你会创建一个不同的项目来实现端到端自动化的流水线。\n\n\
  ## 操作步骤...\n\n- 1. 转到Jenkins仪表盘 | Jenkins项目或构建作业 | 构建后操作 | 添加构建后操作 | 归档构件：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_380_0.png)\n\
  \n2. 你可以使用通配符，例如`module/dist/**/*.zip`。构件归档器使用Ant的`org.apache.tools.ant.DirectoryScanner`，默认情况下排除以下模式：`**/%*,\
  \ **/.git/**, **/.bzr, **/hg/**, **/.bzrignore, **/.git, **/SCCS/**, **/hg, **/#*`\n\
  \n## 另请参阅\n\n- *从其他构建作业复制构件*的教程对于将已归档的构件从另一个项目复制到Jenkins非常有用\n\n## 从另一个构建作业复制构件\n\
  \n在本教程中，我们将把构件/文件/包从一个构建复制到另一个构建。这有助于部署或复制操作。即使使用Master/Agent架构，我们也可以使用`Copy Artifact`插件轻松复制构件。\n\
  \n## 准备工作\n\n你需要允许匿名用户具有读权限，因为Copyartifact插件将运行中的构建视为匿名。要允许匿名用户读访问，请执行以下操作：\n\n\
  转到管理Jenkins | 全局安全配置：\n\n## Jenkins › 配置全局安全\n\n启用安全\n禁用记住我\n访问控制\n\n## 安全域\n\n\
