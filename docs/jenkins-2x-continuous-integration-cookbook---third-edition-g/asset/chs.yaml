  \n### 构建历史\n\n趋势\n\n查找\n\n所有 RSS   失败 RSS\n\n## Jenkins 与 Active Directory 集成\n\n\
  在本节中，我们将配置 Active Directory，它已可用于与 Jenkins 集成，从而使 Active Directory 特定域中的所有可用用户都可以根据所授予的访问权限，使用他们自己的\
  \ Active Directory 凭据来使用 Jenkins。\n\n### 操作步骤...\n\n- 1. 前往 Jenkins 仪表板 | 管理 Jenkins\
