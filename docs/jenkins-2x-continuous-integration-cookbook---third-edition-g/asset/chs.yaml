  \n队列中没有构建\n\n构建执行器状态\n\n- 1 空闲\n- 2 空闲\n\n## 另请参阅\n\n- *使用 WAR 覆盖为 Jenkins 定制外观和资源*\
  \ 技巧\n- *生成主页* 技巧\n\n## 使用 WAR 覆盖为 Jenkins 定制外观和资源\n\n本技巧描述如何将内容覆盖到 Jenkins WAR\
  \ 文件上。通过 WAR 覆盖，你可以更改 Jenkins 的外观和感觉，为企业品牌和主页内容配置做好准备。这里使用了添加自定义 favicon.ico（Web\
  \ 浏览器地址栏中的图标）的基本示例。要包含更多内容，只需很少的功夫。\n\nJenkins 将其版本作为依赖项保存在 Maven 存储库中。你可以使用 Maven\
  \ 拉取 WAR 文件，解压，添加内容，然后重新打包。这使你可以配置资源，例如图片、主页、地址栏中的图标（称为 favicon），以及影响搜索引擎浏览内容的 `robots.txt`。\n\
  \n请注意，如果 Jenkins 的结构和图形内容不会随时间发生根本变化，那么使用 WAR 覆盖的成本很低。然而，如果覆盖确实破坏了结构，那么你可能直到执行详细的功能测试时才会发现。\n\
  \n你还可以考虑通过 WAR 覆盖进行最小更改，也许只更改 `favicon.ico`，添加图片和 `userContent`，然后使用简单主题插件（参见前面的技巧）来进行样式设置。\n\
  \n\n\n\n## 准备工作\n\n为本操作指南中的文件创建名为 `CH9.communicating/war_overlay` 的目录。\n\n## 操作步骤...\n\
  \n- 1. 浏览位于 http://repo.jenkins-ci.org/releases/org/jenkins-ci/main/jenkins-war/\
  \ 的 Maven 仓库，并查看 Jenkins 依赖。\n- 2. 创建以下 pom.xml 文件。可以随意更新到较新的 Jenkins 版本：\n- 3.\
  \ 访问一个 favicon.ico 生成网站，例如 http://www.favicon.cc/。按照其说明创建你自己的 favicon.ico。或者，使用提供的示例。\n\
  - 4. 将 favicon.ico 添加到 src/main/webapp 位置。\n- 5. 创建目录 src/main/webapp/META-INF，并添加一个名为\
  \ context.xml 的文件，内容为以下代码行：\n- 6. 在你的顶级目录中，运行以下命令：\n- 7. 在新建的 target 目录中，你会看到 WAR\
  \ 文件 overlay-1.437.war。检查内容，确认已经修改了 favicon.ico。\n- 8. （可选）将 WAR 文件部署到本地 Tomcat\
  \ 服务器，验证并浏览更新后的 Jenkins 服务器：\n\n```\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\"\
  \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:schemaLocation=\"\
  http://maven.apache.org/POM/4.0.0\nhttp://maven.apache.org/maven-v4_0_0.xsd\">\n\
  <modelVersion>4.0.0</modelVersion>\n<groupId>nl.uva.berg</groupId>\n<artifactId>overlay</artifactId>\n\
  <packaging>war</packaging>\n<!-- Keep version the same as Jenkins as a hint -->\n\
  <version>1.437</version>\n<name>overlay Maven Webapp</name>\n<url>http://maven.apache.org</url>\n\
  <dependencies>\n<dependency>\n<groupId>org.jenkins-ci.main</groupId>\n<artifactId>jenkins-war</artifactId>\n\
  <version>1.437</version>\n<type>war</type>\n<scope>runtime</scope>\n</dependency>\n\
  </dependencies>\n<repositories>\n<repository>\n<id>Jenkins</id>\n<url>http://repo.jenkins-ci.org/releases</url>\n\
  </repository>\n</repositories>\n</project>\n```\n\n```\n<Context logEffectiveWebXml=\"\
  true\" path=\"/\"></Context>\n```\n\n```\nmvn package\n```\n\n## 工作原理...\n\nJenkins\
  \ 将其 WAR 文件发布在中央 Maven 仓库中。这使你可以通过标准的 Maven 依赖管理拉取特定版本的 Jenkins。\n\nMaven 遵循约定。它期望在\
  \ `src/main/webapp` 或 `src/main/resources` 中找到要覆盖的内容。\n\n`context.xml` 文件定义了 Web\
  \ 应用程序的某些行为，例如数据库设置。在本示例中，`logEffectiveWebXML` 设置要求 Tomcat 在应用程序启动时记录特定信息（http://tomcat.apache.org/tomcat-7.0-doc/config/context.html）。该设置是\
  \ Jenkins Wiki（https://wiki.jenkins-ci.org/display/JENKINS/Installation+via+Maven+WAR+Overlay）中推荐的。该文件放在\
  \ `META-INF` 目录中，因为 Tomcat 会在此处获取设置，无需重启服务器。\n\n`<packaging>war</packaging>` 标签告诉\
  \ Maven 使用 WAR 插件进行打包。\n\n你在最终覆盖后的 WAR 文件名中使用了与原始 Jenkins WAR 版本相同的版本号。这样可以更容易地发现\
  \ Jenkins 版本的变化。这再次突出表明，使用约定有助于提高可读性并减少出错机会。从验收环境部署到生产环境时，你应该移除版本号。\n\n在 `pom.xml`\
  \ 文件中，你将 http://repo.jenkins-ci.org/ 定义为查找 Jenkins 的仓库。\n\nJenkins WAR 文件作为类型为 `war`、作用域为\
  \ `runtime` 的依赖被引入。`runtime` 作用域表示该依赖在编译时不需要，但在运行时需要。有关作用域的更多详细信息，请查看 http://maven.apache.org/guides/introduction/introduction-to-dependency-mechanism.html#Dependency_Scope。\n\
  \n有关 WAR 覆盖的更多详细信息，请查看 http://maven.apache.org/plugins/maven-war-plugin/index.html。\n\
  \n避免重复劳动：\n\n为减少维护工作量，最好添加额外内容，而不是替换可能在其他地方或第三方插件中使用的内容。\n\n## 更多内容...\n\n如果你希望全面修改\
  \ Jenkins 的外观和体验，需要处理很多细节。以下部分提到了其中一些细节。\n\n## 可以替换哪些类型的内容？\n\nJenkins 服务器部署到两个主要位置。第一个位置是核心应用程序，第二个是工作区，存储动态变化的信息。为了更全面地理解内容，请查看目录结构。Linux\
  \ 中一个有用的命令是 tree 命令，它可以显示目录结构。要在 Ubuntu 下安装，请使用以下命令：\n\n```\napt-get install tree\n\
  ```\n\n在 Windows 操作系统中，它默认在命令提示符中可用。\n\n对于 Jenkins Ubuntu 工作区，使用以下命令可以帮助你生成工作区的树状视图：\n\
  \n```\ntree -d -L 1 /var/lib/jenkins\n```\n\n- `fingerprints`：这是用于存储校验和以唯一标识文件的目录\n\
  - `jobs`：存储作业配置和构建结果\n- `plugins`：这是插件部署并通常进行配置的位置\n- `tools`：这是 Maven 和 Ant 等工具部署的位置\n\
  - `updates`：用于更新\n- `userContent`：内容可通过 URL `/userContent` 访问\n- `users`：这是通过 `/me`\
  \ URL 显示的用户信息\n\nUbuntu 中 Web 应用的默认位置是 `/var/run/jenkins/war`。如果你从命令行运行 Jenkins，则用于指定\
  \ Web 应用位置的选项如下：\n\n```\n-webroot\n```\n\n- `css`：Jenkins 样式表的位置\n- `executable`：用于从命令行运行\
  \ Jenkins\n- `favicon.ico`：我们在本操作指南中替换的图标\n- `help`：包含帮助内容的目录\n- `images`：包含不同尺寸的图片\n\
  - `META-INF`：这是存放清单文件和生成 WAR 的 pom.xml 文件的位置\n- `robots.txt`：用于告诉搜索引擎允许爬取的位置\n-\
  \ `scripts`：JavaScript 库的位置\n- `WEB-INF`：这是 Web 应用程序 servlet 部分的主要位置\n- `winstone.jar`：这是可在\
  \ http://winstone.sourceforge.net/ 获取的 servlet 容器\n\n## 搜索引擎与 robots.txt\n\n如果你要添加自己的自定义内容，例如用户主页、公司联系信息或产品详情，那么请考虑修改顶层\
  \ `robots.txt` 文件。目前，它禁止搜索引擎访问所有内容：\n\n```\n## we don't want robots to click \"\
  build\" links\nUser-agent: *\nDisallow: /\n```\n\n你可以在 http://www.w3.org/TR/html4/appendix/notes.html#h-B.4.1.1\
  \ 找到 `robots.txt` 结构的完整详细信息。\n\nGoogle 使用更丰富的结构，可同时包含允许和禁止规则；请参阅 https://developers.google.com/webmasters/control-crawl-index/docs/robots_txt?csw=1。\n\
  \n以下 `robots.txt` 允许 Google 爬虫访问 `/userContent/corporate/` 目录。所有 Web 爬虫是否会遵循这一意图，仍是一个悬而未决的问题。\n\
  \n```\nUser-agent: *\nDisallow: /\nUser-agent: Googlebot\nAllow: /userContent/corporate/\n\
  ```\n\n为了帮助保护你的 Jenkins 基础设施，请参阅第 3 章“管理安全性”中的操作指南。\n\n## 生成主页\n\n用户主页是展现你组织身份的好地方。你可以创建一致的外观和体验，以表达你团队的精神。\n\
  \n本操作指南将探讨如何定制位于 `/user/userid` 目录下、由用户通过 Jenkins/me URL 配置的主页。\n\n另一个值得查看的类似插件是\
  \ Gravatar 插件。你可以在 https://wiki.jenkins-ci.org/display/JENKINS/Gravatar+plugin 找到该插件的主页。\n\
  \n\n\n\n\n## 创建 HTML 报告\n\n作业仪表盘左侧菜单是宝贵的空间。开发者的目光自然会扫向该区域。本食谱描述了如何从自定义 HTML 报告添加一个链接到菜单，使报告能更快被注意到。\n\
  \n### 准备工作\n\n安装 HTML Publisher 插件 (https://wiki.jenkins-ci.org/display/JENKINS/HTML+Publisher+Plugin)。我们假设你有一个\
  \ Subversion 仓库，其中已提交 Packt 的代码。\n\n### 如何操作...\n\n- 1. 创建一个自由风格软件项目，并将其命名为 `CH9.html_report`。\n\
  - 2. 在源代码管理部分，点击 Subversion。\n- 3. 在模块部分，将 `Repo/CH9.communicating/html_report`\
  \ 添加到仓库 URL，其中 `Repo` 是你的 Subversion 仓库的 URL。\n- 4. 在构建后操作部分，勾选发布 HTML 报告。添加以下详细信息：\n\
  \  - 要归档的 HTML 目录：`target/custom_report`\n  - 索引页[s]：`index.html`\n  - 报告标题：`My\
  \ HTML Report`\n  - 勾选保留过去的 HTML 报告复选框\n- 5. 点击保存。\n- 6. 运行作业并查看左侧菜单。你现在会看到指向报告的链接，如以下屏幕截图所示：\n\
  \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_562_0.png)\n\n### 工作原理...\n\n你的 Subversion\
  \ 仓库包含一个 `index.html` 文件，该文件会被拉取到作业的工作区中。插件按广告所述工作，并添加一个指向 HTML 报告的链接。这使你的受众能够高效地找到你自定义生成的信息。\n\
  \n### 更多内容...\n\n示例报告如下所示：\n\n```\n```html\n<html><head><title>Example Report</title>\n\
  <link rel=\"stylesheet\" type=\"text/css\" href=\"/css/style.css\" /></head>\n<body>\n\
  <h2>Generated Report</h2>\nExample icon: <img title=\"A Jenkins Icon\" alt=\"Schedule\
  \ a build\" src=\"/images/24x24/clock.png\"\n/>\n</body></html>\n```\n```\n\n它引入了主\
  \ Jenkins 样式表 `/css/style.css`。\n\n有可能当你在应用程序中更新样式表时，直到你清理浏览器缓存后才会在浏览器中看到更改。Jenkins\
  \ 以一种巧妙的方式解决了这种延迟问题。它使用一个随每次 Jenkins 版本更改而变化的唯一数字的 URL。例如，对于 `css` 目录，你有两个 URL：\n\
  \n- `/css`\n- `/static/uniquenumber/css`\n\n大多数 Jenkins URL 使用后一种形式。建议对你的样式表也这样做。\n\
  \n唯一数字会随版本更改，因此每次升级时你都需要更新 URL\n\n在 Maven 构建中运行 site 目标时，会生成一个本地网站 (http://maven.apache.org/plugins/maven-site-plugin)。该网站在\
  \ Jenkins 作业内部有一个固定的 URL，你可以用 My HTML Report 链接指向它。这使诸如测试结果等文档触手可及。\n\n### 另请参阅\n\
  \n- *Efficient use of views* 食谱\n- *Saving screen space with the Dashboard View\
  \ plugin* 食谱\n\n## 高效使用视图\n\nJenkins 上瘾般的易配置性使其容易创建大量作业。这增加了向开发者展示的信息量。Jenkins 需要通过高效利用浏览器空间来避免混乱。一个方法是定义最小化视图。在本食谱中，你将使用\
  \ `DropDownViewsTabBar` 插件。它将视图作为标签移除，并用一个选择框替换标签。这有助于更快导航。你还将学习如何使用脚本生成的简单 HTML\
  \ 表单快速配置大量作业。\n\n在本食谱中，你将创建大量可能稍后想要删除的视图。如果你使用的是虚拟机镜像，请考虑克隆镜像，并在完成后删除它。\n\n### 准备工作\n\
  \n安装 `DropDownViewsTabBar` 插件 (https://wiki.jenkins-ci.org/display/JENKINS/DropDown+Views+TabBar+Plugin)。\n\
  \n### 如何操作...\n\n- 1. 复制并粘贴以下 Perl 脚本到名为 create.pl 的可执行文件中：\n- 2. 从 Perl 脚本的输出创建一个\
  \ HTML 文件，例如：\n- 3. 在 Web 浏览器中，以管理员身份登录 Jenkins。\n- 4. 创建 Template1 作业，添加你想要的任何详细信息。这是你的模板作业，将被复制到许多其他作业中。\n\
  - 5. 将 form.html 加载到同一浏览器中。\n- 6. 点击其中一个 Create CH9.fake 按钮。Jenkins 返回错误消息：\n- 7.\
  \ 访问 http://localhost:8080/configureSecurity 上的配置全局安全，并取消勾选防止跨站请求伪造攻击复选框。\n- 8.\
  \ 点击保存。\n- 9. 点击所有 Create CH9.fake 按钮。\n- 10. 访问 Jenkins 的首页并验证作业是否已创建，并且基于 Template1\
  \ 作业。\n- 11. 创建大量包含随机作业选择的视图。查看首页，注意混乱情况。\n- 12. 访问配置屏幕 /configure；选择 DropDownViewsTabBar\
  \ 提供一个用于在视图标签栏选择框中选择视图的下拉菜单。在 DropDown ViewsTabBar 子部分中，勾选显示作业计数框，如以下屏幕截图所示：\n\n\
  ```\n#!/usr/bin/perl\n$counter=0;\n$end=20;\n$host='http://localhost:8080';\nwhile($end\
  \ > $counter){\n    $counter++;\n    print \"<form action=$host/createItem?mode=copy\
  \ method=POST>\\n\";print \"<input type=text name=name value=CH9.fake.$counter>\\\
  n\";\n    print \"<input type=text name=from value=Template1 >\\n\";\n    print\
  \ \"<input type=submit value='Create CH9.fake.$counter'>\\n\";\n    print \"</form><br>\\\
  n\";\n    print \"<form action=$host/job/CH9.fake.$counter/doDelete method=POST>\\\
  n\";print \"<input type=submit value='Delete CH9.fake.$counter'>\\n\";\n    print\
  \ \"</form><br>\\n\";\n}\n```\n\n```\nperl create.pl > form.html\n```\n\n```\nHTTP\
  \ ERROR 403\nProblem accessing /createItem. Reason:\nNo valid crumb was included\
  \ in the request\n```\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_568_0.png)\n\n\
  - 13. 点击保存按钮：\n- 14. 在 Jenkins 中，访问 `http://localhost:8080/configureSecurity` 配置全局安全并勾选防止跨站请求伪造攻击复选框。\n\
  - 15. 点击保存。\n\n### 工作原理...\n\n只要 Jenkins 中的面包屑安全功能关闭，表单就能正常工作。该功能在开启时，会生成一个随机数，表单在提交时必须返回该数。这使\
  \ Jenkins 能知道表单是与服务器有效对话的一部分。生成的 HTTP 状态错误在 4xx 范围内，这意味着客户端输入无效。如果 Jenkins 返回 5xx\
  \ 错误，则意味着服务器错误。因此我们在提交自己的数据时必须关闭该功能。我们不建议在生产环境中这样做。\n\n一旦你以管理员身份登录 Jenkins，你就可以创建作业。你可以通过\
  \ GUI 或发送 POST 信息来完成。在本食谱中，我们将名为 `Template1` 的作业复制到以 `CH9.fake` 开头的新作业中，如以下代码所示：\n\
  \n```\n<form action=http://localhost:8080/createItem?mode=copy\nmethod=POST>\n<input\
  \ type=text name=name value=CH9.fake.1>\n<input type=text name=from value=Template1\
  \ >\n<input type=submit value='Create CH9.fake.1'>\n</form>\n```\n\n你使用的 POST 变量为\
  \ `name` 表示新作业的名称，`from` 表示模板作业的名称。POST 操作的 URL 为 `/createItem?mode=copy`。\n\n要更改主机名和端口号，你需要更新\
  \ Perl 脚本中找到的 `$host` 变量。\n\n要删除作业，Perl 脚本生成了指向 `/job/Jobname/doDelete` 的操作表单（例如，`/job/CH9.fake.1/doDelete`）。不需要额外变量。\n\
  \n要增加表单条目数量，你可以将变量 `$end` 从 20 改为其他值。\n\n### 更多内容...\n\nJenkins 使用标准库 Stapler (http://stapler.kohsuke.org/what-is.html)\
  \ 将服务绑定到 URL。插件也使用 Stapler。当你安装插件时，可用操作的数量也会增加。这意味着你可以通过与本食谱类似的 HTML 表单激活大量操作。你将在第\
  \ 7 章 *Exploring Plugins* 中了解到，为 Stapler 编写绑定代码所需的努力极小。\n\n\n\n\n\n## 另请参阅\n\n-\
  \   *使用 Dashboard View 插件节省屏幕空间*方法\n\n## 使用 Dashboard View 插件节省屏幕空间\n\n在 *高效使用视图*\
  \ 方法中，你发现可以使用 `views` 插件节省水平标签页空间。在本方法中，你将使用 `Dashboard View` 插件来压缩水平空间的利用。压缩水平空间有助于高效地整合信息。\n\
  \n`Dashboard View` 插件允许你配置视图的各个区域以显示特定功能，例如，作业的网格视图，或显示失败作业子集的视图区域。用户可以拖放这些区域在屏幕上的位置。\n\
