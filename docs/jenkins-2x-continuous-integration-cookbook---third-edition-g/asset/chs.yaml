  \n- 3. 如果配置和访问均正确，那么我们可以直接在 Jenkins 中使用该域中的所有用户。\n\n## Jenkins 与 OWASP Zed Attack\
  \ Proxy 集成\n\n**OWASP Zed Attack Proxy（ZAP）**是一款开源 Web 应用安全扫描器。你可以将 ZAP 安全工具与 Jenkins\
  \ CI 环境集成。\n\n### 准备工作\n\n前往 https://github.com/zaproxy/zaproxy/wiki/Downloads 下载\
  \ Windows（64 位）安装程序。\n\n在 Windows 上安装它。\n\n在 Windows 中打开 OWASP ZAP，点击“文件 | 持久化会话”，并将其保存到\
  \ Jenkins 工作空间中该构建作业的目录下：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_248_0.png)\n\
  \n现在你可以开始配置 Jenkins 中的 ZAP 插件了。\n\n### 操作步骤...\n\n- 1. 前往 Jenkins 仪表板 | 配置系统 | 全局属性\
  \ | 环境变量，创建 `ZAPPROXY_HOME` 变量：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_249_0.png)\n\
  \n- 2. 前往 Jenkins 仪表板 | Zap 项目 | 构建 | 添加构建步骤 | 执行 ZAP。\n- 3. 将主机和端口设置保留为默认值，或根据你的\
  \ OWASP ZAP 安装情况进行更改：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_249_1.png)\n\n\
  - 4. 提供 `ZAPPROXY_HOME`：\n\n- 5. 提供 ZAP 主目录的路径，注意这不是安装目录。\n\n- 6. 提供你保存在工作空间中的会话名称：\n\
  \n- 7. 配置攻击模式：\n\n- 8. 配置“生成报告”部分：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_251_0.png)\n\
  \n- 9. 发布 HTML 报告。点击“保存”：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_251_1.png)\n\
  \n### 另请参阅\n\n- 运行 Jenkins 构建，它将创建 HTML 报告。导航到 HTML 报告并验证扫描报告：\n\n## ZAP 扫描报告\n\n\
  ### 警报摘要\n\n| 风险级别 | 警报数量 |\n|---|---:|\n| 高 | 1 |\n| 中 | 1 |\n| 低 | 2 |\n| 信息 |\
  \ 0 |\n\n### 警报详情\n\n| 字段 | 值 |\n|---|---|\n| 高（中） | SQL 注入 |\n| 描述 | 可能存在 SQL 注入。\
  \ |\n| URL | `http://localhost:9999/petclinic/oups.htm;jsessionid=E47011BD0E9AC2E848D2F180797D2E7E?query=query%22+AND+%221%22%3D%221`\
  \ |\n| 方法 | GET |\n| 参数 | query |\n| 攻击 | `query\" AND \"1\"=\"1` |\n| URL | `http://localhost:9999/petclinic/oups.htm;jsessionid=E47011BD0E9AC2E848D2F180797D2E7E?query=query+AND+1%3D1+--`\
  \ |\n| 方法 | GET |\n| 参数 | query |\n| 攻击 | `query AND 1=1 --` |\n| URL | `http://localhost:9999/petclinic/oups.htm;jsessionid=E47011BD0E9AC2E848D2F180797D2E7E?query=query+AND+1%3D1+--+`\
  \ |\n| 方法 | GET |\n\n- 你已将 Jenkins 与 OWASP ZAP 集成用于安全测试，也可以将其集成到流水线中。\n\n## 测试 OWASP\
  \ 的十大安全问题\n\n本教程详细介绍了使用 w3af 对 Jenkins 进行自动测试以发现已知安全问题的方法。w3af 是来自 **开放 Web 应用程序安全项目（OWASP）**\
  \ 的渗透测试工具。更多信息，请访问 [http://w3af.sourceforge.net](http://w3af.sourceforge.net)。OWASP\
  \ 的目标是让应用安全可见。OWASP 2010 年的十大不安全清单包括：\n\n- **A2-跨站脚本（XSS）：** 当应用程序将未转义的输入返回给客户端浏览器时，就可能发生\
  \ XSS 攻击。默认情况下，Jenkins 管理员可以通过作业描述执行此操作。\n\n- **A6-安全配置错误：** Jenkins 插件让你能够编写自定义身份验证脚本。通过错误配置很容易把脚本弄错。\n\
  \n- **A7-不安全的加密存储：** Jenkins 有 600 多个插件，每个插件都将配置存储在单独的 XML 文件中。极有可能出现一种罕见错误：以明文形式存储密码。你需要仔细检查。\n\
  \n- **A9-传输层保护不足：** 默认情况下，Jenkins 通过 HTTP 运行。获取受信任的证书可能很麻烦，而且涉及额外成本。你可能会想不实施 TLS，从而使数据包暴露在外。\n\
  \n你会发现，与 2010 版本相比，OWASP 2013 年的十大不安全清单有些变化。最重要的变化是加入了 **A9-使用已知易受攻击组件**。如果你的软件依赖于较旧的库，那么就存在利用已知弱点进行操纵的机会窗口。\n\
  \nJenkins 拥有大量由积极、分散且勤奋的社区编写的插件。由于代码变动频繁，可能会无意中加入安全缺陷。例如，在配置文件中以明文形式保留密码，或使用不会移除可疑\
  \ JavaScript 的不安全渲染。你可以通过手动检查配置文件来发现第一类缺陷。第二类缺陷面向更广泛的受众，因此更容易被破解。你可以手动攻击新插件。互联网上有有用的速查表（[http://hackers.org/xss.html](http://hackers.org/xss.html)）。这项工作枯燥乏味；自动化测试可以覆盖更多内容，并可以作为\
  \ Jenkins 作业的一部分进行调度。\n\n在名为 *探索 OWASP dependency-check 插件* 的教程中，你将配置 Jenkins，使其基于对代码依赖项的自动审查，向你发出已知攻击媒介的警告。\n\
  \n### OWASP 店面：\n\nOWASP 每年都会发布一份针对 Web 应用的十大最常见安全攻击媒介清单。他们通过 [http://lulu.com](http://lulu.com)\
  \ 发布这份文档以及大量书籍。在 Lulu，你可以免费访问 OWASP 文档的 PDF 版本，也可以购买廉价的按需印刷版本。官方店面位于：[http://stores.lulu.com/owasp](http://stores.lulu.com/owasp)。\n\
  \n\n\n\n\n## 准备工作\n\n渗透测试有可能损坏正在运行的应用程序。请确保你拥有 Jenkins 工作区的备份副本。你可能需要重新安装。另外，请关闭\
  \ Jenkins 中任何已启用的安全设置：这允许 w3af 自由地扫描安全表面。\n\n从 SourceForge（[http://w3af.org/download/](http://w3af.org/download/)）下载最新版本的\
  \ w3af，并从 [https://www.owasp.org/index.php/Category:OWASP_Top_Ten_Project](https://www.owasp.org/index.php/Category:OWASP_Top_Ten_Project)\
  \ 下载并阅读 OWASP 十大知名攻击列表。\n\nw3af 同时提供 Windows 和 *NIX 安装包；你可以选择你喜欢的操作系统安装包。然而，Windows\
  \ Installer 不再受支持，而且没有 Installer 的安装过程很复杂。因此，最好使用该工具的 *NIX 版本。\n\nw3af 的 Debian\
  \ 软件包比 SourceForge 上用于 Linux 的软件包更旧、更不稳定。因此，不要使用 apt-get 和 yum 安装方法，而应使用从 SourceForge\
  \ 下载的软件包。\n\n## 如何操作...\n\n1. 要安装 w3af，请遵循开发者网站上给出的说明（[http://w3af.org/download/](http://w3af.org/download/)）。如果\
  \ Ubuntu 有任何无法解决的依赖问题，请回退到 apt-get 安装方法并安装旧版本的工具，如下所示：\n\n   ```bash\n   sudo apt-get\
  \ install w3af\n   ```\n\n2. 运行 w3af。\n3. 在 Profiles 选项卡下，选择 OWASP_TOP10。\n4. 在\
  \ Target address 窗口中，填写 `http://localhost:8080/`，并修改主机名以适合你的环境。\n5. 点击 Start 按钮。渗透测试现在将开始，Start\
  \ 按钮将变为 Stop。扫描结束时，Stop 按钮将变为 Clear。\n6. 通过选择 Log 选项卡查看攻击历史。\n7. 通过点击 Results 选项卡查看结果。\n\
  8. 在第一次扫描后，在 Profiles 下选择 full_audit。\n9. 点击 Clear 按钮。\n10. 在 Target address 窗口中输入\
  \ `http://localhost:8080/`。\n11. 点击 Start 按钮。\n12. 等待扫描完成，然后查看 Results 选项卡。\n\n\
  ## 工作原理...\n\nw3af 由安全专业人士编写。它是一个可插拔的框架，带有针对不同类型攻击编写的扩展。配置文件定义了你在渗透测试中将使用哪些插件及其相关配置。\n\
  \n你首先使用 OWASP_TOP10 配置文件进行攻击，然后使用更完整的插件集再次攻击。\n\n结果将根据你的设置而有所不同。根据插件不同，有时会标记出不存在的问题。你需要手动验证提到的任何问题。\n\
  \n在撰写本文时，使用这种方法没有发现重大缺陷。但是，该工具指出了缓慢的链接并生成了服务器端异常。这是你希望在错误报告中记录的信息类型。\n\n## 更多内容...\n\
  \n持续保护你的应用程序需要经验丰富的对细节的关注。这里还有一些内容供你查看。\n\n### 使用 WebGoat 进行靶机练习\n\n十大安全缺陷列表有时看起来难以理解。如果你有空闲时间并且想针对一个故意不安全的应用程序进行练习，你应该尝试\
  \ WebGoat（[https://www.owasp.org/index.php/Category:OWASP_WebGoat_Project](https://www.owasp.org/index.php/Category:OWASP_WebGoat_Project)）。\n\
  \nWebGoat 文档完善，带有提示系统和视频教程链接；它几乎不会让你对攻击产生误解。\n\n### 行业中的更多工具\n\nw3af 是一个强大的工具，但与以下工具配合使用时效果更好：\n\
  \n- **Nmap** (http://nmap.org/): 一个易于使用、非常受欢迎、屡获殊荣的网络扫描器。\n- **Nikto** (http://cirt.net/nikto2):\
  \ 一个 Perl 脚本，可快速汇总系统详细信息并查找最明显的缺陷。\n- **Skipfish** (https://code.google.com/p/skipfish/downloads/list):\
  \ 一个 C 程序，可在长时间内处理大量请求。你可以从不同的攻击字典中进行选择。这是一个极好的穷人压力测试；如果你的系统保持运行，你就知道它已达到最低稳定性水平。\n\
  - **Wapiti** (http://wapiti.sourceforge.net/): 一个基于 Python 的脚本，可发现可攻击的 URL，然后循环遍历一系列恶意参数。\n\
  \nJenkins 非常灵活，因此你可以通过作业中运行的脚本调用各种工具，包括提到的安全工具。\n\n有许多保护原生操作系统的好资源，包括 Debian 安全指南（https://www.debian.org/doc/manuals/securing-debian-howto/）；对于\
  \ Windows，有 MSDN 安全中心下的文章（http://msdn.microsoft.com/en-us/security/）；对于 Mac，有 Apple\
  \ 官方安全指南（https://www.apple.com/support/security/guides/）。在线服务需要密切关注其安全攻击面。\n\n##\
  \ 通过模糊测试在 Jenkins 中发现 500 错误和 XSS 攻击\n\n本教程介绍如何使用模糊测试器在 Jenkins 服务器中查找服务器端错误和 XSS\
  \ 攻击。\n\n模糊测试器会遍历一系列 URL，盲目附加不同的参数，并检查服务器的响应。输入的参数是脚本命令的变体，例如 `<script>alert(\"\
  random string\");</script>`。如果服务器的响应包含未转义的脚本版本，则表明发现了攻击向量。\n\n跨站脚本攻击目前是较流行的攻击形式之一（http://en.wikipedia.org/wiki/Cross-site_scripting）。该攻击涉及将脚本片段注入客户端的浏览器，使脚本运行起来就像来自受信任的网站。例如，一旦你登录应用程序，你的会话\
  \ ID 很可能存储在 cookie 中。注入的脚本可能会读取 cookie 中的值，然后将信息发送到另一台服务器，以便尝试重用。\n\n模糊测试器会发现在其攻击的网站上的链接以及网站网页中存在的表单变量。对于发现的网页，它基于历史攻击和大量微小变体反复发送输入。如果响应与发送的相同随机字符串一起返回，模糊测试器就知道它发现了一个恶意\
  \ URL。\n\n为了与基于 Web 的应用程序的构建过程完全集成，你需要构建应用程序、部署并运行应用程序、通过脚本运行模糊测试器，最后，如果输出中提及恶意\
  \ URL，则使用日志解析来使构建失败。此过程与你希望集成的其他命令行工具类似。有关日志解析的更多信息，请参阅第 1 章“开始使用 Jenkins”中的 *通过日志解析故意使构建失败*\
  \ 配方。\n\n### 准备工作\n\n备份你的牺牲 Jenkins 服务器并关闭其安全设置。预计在攻击结束时应用程序会不稳定。\n\n你需要在计算机上安装\
  \ Python 编程语言。要下载并安装 Wapiti，你需要遵循 http://wapiti.sourceforge.net 上的说明。\n\n如果你是在本机攻击本机，那么你可以关闭其网络功能。攻击将停留在回环网络驱动器中，并且不会有数据包逃逸到互联网。\n\
  \n在本教程中，方法论和命令行选项是正确的。然而，在撰写本文时，提到的结果可能不存在。Jenkins 经历了一个快速的生命周期，开发人员会迅速移除错误。\n\n\
  ### 如何操作...\n\n1. 在 wapiti bin 目录中，运行以下命令：\n\n   ```bash\n   python wapiti http://localhost:8080\
  \ -m \"-all,xss,exec\" -x http://localhost:8080/pluginManager/* -v2\n   ```\n\n\
  2. 命令运行完毕后，你将在控制台输出中看到最终报告的位置：\n\n   ```\n   Report\n   !!!!\n   A report has been\
  \ generated in the file\n   ~/.wapiti/generated_report\n   You can open ~/.wapiti/generated_report/index.html\
  \ with a browser to see this report.\n   ```\n\n3. 在 Web 浏览器中打开报告并查看它。\n4. 点击 Internal\
  \ Server Error 链接。\n5. 对于名为“在 /iconSize 中发现异常”的条目之一，从 URL command line 选项卡复制 URL。\n\
  6. 在 Web 浏览器中打开该 URL。现在你将看到一个新生成的 Jenkins 错误报告页面，如下图所示。\n7. 运行以下命令：\n\n   ```bash\n\
  \   python wapiti http://localhost:8080 -m \"-all,xss,permanentxss\" -x http://localhost:8080/pluginManager/*\n\
  \   ```\n\n8. 查看输出以确认 permanentxss 模块已运行：\n\n   ```\n   [*] Loading modules :\n\
  \   mod_crlf, mod_exec, mod_file, mod_sql, mod_xss,      mod_backup, mod_htaccess,\n\
  \   mod_blindsql, mod_permanentxss, mod_nikto\n   [+] Launching module xss\n   [+]\
  \ Launching module permanentxss\n   ```\n\n\n\n## 工作原理...\n\nWapiti 会加载不同的模块。默认情况下，所有模块都会被使用。你需要有选择性地加载；对于\
  \ Ubuntu Linux 上的版本 2.2.1，这会导致 Wapiti 崩溃或超时。\n\n要加载特定模块，请使用 `-m` 选项。\n\n`-m \"-all,xss,exec\"\
  ` 语句告诉 Wapiti 忽略除 xss 和 exec 模块之外的所有模块。\n\nexec 模块非常擅长发现 Jenkins 中的 500 错误。这主要是因为意外输入，而\
  \ Jenkins 对此处理得并不好。这纯粹是一组外观问题。但是，如果你开始看到与文件或数据库服务等资源相关的错误，那么你应该优先处理这些问题并提交错误报告。\n\
  \n`-x` 选项指定要忽略哪些 URL。在本例中，我们不想给插件管理器造成负担。如果我们这样做，它就会对无辜的外部服务产生大量请求。\n\nWapiti 会爬取网站。如果你不小心，该工具可能会顺着链接到达你不想测试的位置。为避免尴尬，请谨慎使用排除\
  \ URL 选项 `-x`。\n\n`-v2` 选项将日志记录详细程度设置为最高，以便你能看到所有攻击。\n\n在第二次运行 Wapiti 时，你还使用了 permanentxss\
  \ 模块，该模块有时会发现真正的 XSS 攻击，这取决于开发人员在开发功能和清理 bug 之间的竞赛：\n\n模糊测试工具擅长覆盖应用程序 URL 空间的很大一部分，触发那些需要花费大量时间才能发现的错误。可以考虑通过\
  \ Jenkins 作业进行自动化，作为项目 QA 流程的一部分。\n\n## 更多内容...\n\n你在本菜谱中生成的报告提到的服务器错误远多于 XSS 攻击。这是因为许多生成的错误是由于意外输入导致的失败，而这些失败只有最后一层错误处理才能捕获；在本例中，也就是\
  \ bug 报告页面。如果你认为该错误值得报告，请按照 bug 报告页面上的说明进行操作。\n\n以下是一些关于堆栈跟踪输出含义的指南：\n\n- `java.lang.SecurityException`：如果\
  \ Jenkins 用户正在做程序员认为不安全的事情，例如访问某个 URL，则该 URL 应该只在登录后才可访问。\n- `java.lang.IllegalArgumentException`：Jenkins\
  \ 检查了参数的有效范围，而参数值超出了该范围。这是一个故意抛出的异常。\n- `java.lang.NumberFormatException`：Jenkins\
  \ 没有检查字符串是否有效，然后尝试将不符合格式的字符串解析为数字。\n- `java.lang.NullPointerException`：这通常发生在你访问一个未设置\
  \ Jenkins 期望的所有参数的 URL 时。用程序员的话说，代码期望一个不存在的对象，然后在不检查对象是否存在的情况下尝试调用该不存在对象的方法。程序员需要添加更多的错误检查。请写一个错误报告。\n\
  \n## 另请参阅\n\n- *测试 OWASP 十大安全问题* 菜谱\n\n## 使用 JCaptcha 防止注册机器人\n\n**CAPTCHA** 的全称是\
  \ **全自动区分计算机和人类的公开图灵测试**。最常见的 CAPTCHA 是以图形形式显示的连续字母和数字，你必须正确地将它们输入到文本输入框中。\n\n如果你允许任何人在你的\
  \ Jenkins 服务器上注册帐户，那么你最不希望看到的就是机器人（自动化脚本）创建帐户。机器人具有规模经济效应，能够快速扫描互联网，而且永远不会感到厌倦。CAPTCHA\
  \ 是抵御这些愚蠢攻击的必要防御手段。\n\n机器人的恶意用途如下：\n\n- 对你的服务器执行**拒绝服务（DOS）**攻击，例如通过自动创建大量重量级作业\n\
  - 通过收集大量 Jenkins 服务器向其他服务器发起大量请求，从而实施**分布式拒绝服务攻击（DDOS）**\n- 注入不需要的广告或内容，然后指向恶意网站\n\
  - 添加永久存储的脚本，当用户意外浏览 Jenkins 站点时运行这些脚本\n\n犯罪分子有商业动机去规避 CAPTCHA，这已经导致了有据可查的法律案件。你可以在\
  \ [http://www.wired.com/2010/10/hacking-captcha/](http://www.wired.com/2010/10/hacking-captcha/)\
  \ 找到一个这样的法律案件。\n\n## 准备工作\n\n确保你已经备份了你的可牺牲的 Jenkins 服务器。你将要修改其安全设置。很容易犯下改变服务的错误。\n\
  \nJCaptcha 插件基于 Java 实现，你可以在 https://jcaptcha.atlassian.net/wiki/display/general/Home\
  \ 找到相关内容。\n\n## 操作步骤...\n\n- 1. 以管理员身份登录。\n- 2. 单击 “Configure Global Security”（配置全局安全性）链接。\n\
  - 3. 在 “Security Realm”（安全域）下选择 “Jenkins’ own user database”（Jenkins 自己的用户数据库）。\n\
  - 4. 选择 “Allow users to sign up”（允许用户注册）：\n- 5. 单击 “Save”（保存）。\n- 6. 浏览到注册位置 http://localhost:8080/signup。\n\
  - 7. 在 “Manage Jenkins”（管理 Jenkins）页面中单击 “Manage Plugins”（插件管理）链接。\n- 8. 选择 “Available”（可用）选项卡。\n\
  - 9. 安装 JCaptcha 插件。\n- 10. 在 “Manage Jenkins”（管理 Jenkins）页面下单击 “Configure Global\
  \ Security”（配置全局安全性）链接。\n- 11. 在 “Security Realm”（安全域）下选择 “Jenkins’ own user database”（Jenkins\
  \ 自己的用户数据库）。\n- 12. 选择 “Enable captcha on sign up”（在注册时启用验证码）。\n- 13. 单击 “Save”（保存），然后点击\
  \ “Log Out”（注销）链接。\n- 14. 浏览到注册位置 http://localhost:8080/signup。该页面现在受到 CAPTCHA 的保护。\n\
  \n## 工作原理...\n\n安装插件会在注册过程中添加 CAPTCHA 图像。解读该图像需要模式识别。人类非常擅长这一点；自动化过程则差得多，不过在不断改进。\n"
- "## 提升代码质量\n\n在本章中，我们将介绍以下菜谱：\n\n- 将 Jenkins 与 SonarQube 集成\n- SonarQube 中的更新中心\n\
  - 质量门、质量配置文件和规则\n- 使用 SonarQube 验证 HTML、CSS 和 JavaScript 的有效性\n- 使用 SonarQube 验证\
  \ Java 代码\n- 将 SonarQube 配置为 Windows 服务\n\n## 引言\n\n本章探讨如何使用 Jenkins 插件来显示代码指标和失败的构建。自动化可以降低成本并提高一致性。该过程不会疲倦。如果你在项目开始之前就确定成功和失败的标准，那么这将消除发布会议中的一定程度的主观争论。\n\
  \n2002 年，NIST 估计软件缺陷每年给美国造成约 600 亿美元的损失（http://www.abeacha.com/NIST_press_release_bugs_cost.html）。可以预期此后成本已大幅增加。为了节省资金和提高质量，你需要在软件生命周期中尽可能早地消除缺陷。\n\
  \n你还会在本章中找到有关通过 SonarQube 进行静态代码审查的菜谱。静态意味着你可以在不运行代码的情况下查看代码。良好的文档和源代码结构有助于提高代码的可维护性和可读性。\n\
  \n有许多不错的软件指标介绍。其中包括关于指标细节的维基教科书（http://en.wikibooks.org/wiki/Introduction_to_Software_Engineering/Quality/Metrics）以及\
  \ Diomidis Spinellis 所著的一本名为 *Code Quality: The Open Source Perspective* 的优秀书籍。\n\
  \n在本章的 *将 Jenkins 与 SonarQube 集成* 菜谱中，你会将 Jenkins 项目链接到 Sonar 报告。Sonar 是一种专门收集软件指标并将其分解为可理解报告的工具。Sonar\
  \ 详细描述项目的质量。它使用广泛的指标，包括本章提到的 FindBugs 和 PMD 等工具的结果。该项目本身发展迅速。考虑使用 Jenkins 进行早期警告并发现明显缺陷，例如糟糕的提交。然后你可以使用\
  \ Sonar 进行更深入的审查。\n\n从 https://www.sonarqube.org/downloads/ 下载 SonarQube 并将其解压到系统中：\n\
  \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_274_0.png)\n\nSonarQube 支持 20+ 种编程语言：Java\
  \ Android、JavaScript、HTML、CSS、Objective-C、C#、C/C++、PHP、Python、PL/SQL、Flex、Groovy、COBOL、Swift（付费插件）等。它支持有关\
  \ bug、漏洞、代码异味、重复代码、代码覆盖率、注释等的报告。\n\n- 1. 运行 SonarQube 需要先安装 Java 8。\n- 2. 在 Windows\
  \ 操作系统中，转到 `bin` 目录，然后根据操作系统及其平台，进入相应的子目录。\n\n\n\n\n3. 在命令行窗口中执行 `StartSonar.bat`，因为我们使用的是\
  \ Windows 操作系统：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_275_0.png)\n\n如果启动成功，您将在控制台中看到“SonarQube\
  \ is up”信息。\n\n- 一旦 SonarQube 启动并运行，请在浏览器中打开 `http://localhost:9000` 访问 SonarQube\
  \ 仪表盘。\n- 您可能希望查看 [https://docs.sonarqube.org/display/SONAR/Requirements](https://docs.sonarqube.org/display/SONAR/Requirements)\
  \ 上的要求，并在 [https://docs.sonarqube.org/display/SONAR/Setup+and+Upgrade](https://docs.sonarqube.org/display/SONAR/Setup+and+Upgrade)\
  \ 上进行设置和升级。\n\n## 将 Jenkins 与 SonarQube 集成\n\nSonarQube（以前称为 Sonar）是一款快速发展的应用程序，用于报告质量指标和发现代码热点。本教程详细介绍了如何通过\
  \ Jenkins 插件生成代码指标，然后直接将其推送到 Sonar 数据库。\n\n## 准备工作...\n\n- 1. 转到 Jenkins 仪表盘，点击“管理\
  \ Jenkins”。进入“管理插件”，在“可选插件”选项卡中找到 SonarQube 插件。\n- 2. 点击“不重启安装”：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_277_0.png)\n\
