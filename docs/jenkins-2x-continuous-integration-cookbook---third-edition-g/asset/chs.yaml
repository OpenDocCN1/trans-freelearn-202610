- "## Jenkins 的管理和监控\n\n在本章中，我们将介绍以下配方：\n\n- 理解 master/agent 架构\n- 使用 Eclipse 管理 Jenkins\
  \ 构建作业\n- 备份和恢复 Jenkins\n- 使用 Jenkins CLI 的 Jenkins 命令行选项\n- 从命令行修改 Jenkins 配置\n\
  - 管理磁盘使用\n- 安全关闭 Jenkins\n- 使用 JavaMelody 监控 Jenkins\n- 使用 Build Monitor View 监控\
  \ Jenkins 作业\n- 配置邮件通知\n-  signaling the need to archive\n\n### 理解 master/agent\
  \ 架构\n\nJenkins 支持 master/agent 架构。在 master/agent 架构中，我们可以在 master 上安装 Jenkins，然后利用其他\
  \ agent 来分发负载。\n\n我们应该将 Jenkins 作业委托给 agent 执行。这样，我们就可以使用不同的资源支持多次执行。\n\nmaster/agent\
  \ 架构在以下特定场景中非常有用，例如：\n\n- Jenkins 机器容量有限；即使容量更高，也会有无法满足所有请求的时候。通过将负载分发到 agent 节点，我们可以释放\
  \ Jenkins 安装系统上可用的资源。\n- 不同作业需要不同种类的资源，并且仅限于特定机器。在这种情况下，我们只能利用该机器，并且不可能在 Jenkins\
  \ 安装的系统上配置它，因此最好将该机器用作 agent。\n- 需要不同的操作系统或某些工具仅在特定操作系统中工作，因此我们可以通过在安装了这些工具的系统上创建\
  \ agent 来利用这些工具。\n- 通过不在 Jenkins 机器上安装每一个工具来避免单点故障。\n\nMurphy 作为朋友：\n\n你应该为本书中的所有配方假设最坏的情况：外星人攻击、咖啡洒在主板上、猫吃掉你的电缆、电缆吃掉猫等等。确保你使用的是测试\
  \ Jenkins 实例。\n\n### 准备工作\n\n这里重要的是我们根本不在任何 agent 节点上安装 Jenkins。我们只在 master 上安装\
  \ Jenkins 并利用该 Jenkins 来编排 master/agent 架构。\n\n仅供参考：在我们安装 Jenkins 的任何系统上，它都成为 master。只需通过导航到\
  \ 管理 Jenkins | 管理节点 来验证。\n\n- 1. 导航到 管理 Jenkins | 管理节点 并点击 新建节点：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_130_0.png)\n\
  \n- 2. 输入节点名称并选择 永久代理；点击 确定：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_130_1.png)\n\
  \n\n\n\n\n## 如何操作...\n\n1. Jenkins 稳定版及更新版本在 YUM 仓库中可用。以下是配置代理（Agents）的详细信息表：\n\n\
  | 配置项 | 详情 |\n|---|---|\n| 执行器数量 | • 此处可指定 Jenkins 可在该代理节点上执行的并发构建数量。<br>• 代理必须至少有一个执行器；若我们不希望执行任何构建，可将此设置配置为\
  \ 0。 |\n| 远程根目录 | • 代理节点需要有一个专用于 Jenkins 的目录。请在代理上指定该目录的路径。<br>• 仅使用绝对路径。所有作业配置、构建日志和工件均存储在主节点（master）上。<br>•\
  \ 工作区位于代理节点上。 |\n| 标签 | • 标签（Labels）或标记（tags）可用于将多个代理节点分组为一个逻辑集合。<br>• 最好的地方在于，我们可以利用此机制作为资源池，在\
  \ Jenkins 中执行构建作业。<br>• 例如，我们有多个代理设置了测试基础设施。我们有两三个项目的自动化测试由 QA 团队负责。<br>• 在这种情况下，我们可以为所有具备测试基础设施的代理节点提供相同的“Test”标签，并为这些项目分配相同的“Test”标签。<br>•\
  \ 这样，构建作业将在带有“Test”标签的任一测试代理上执行，而不是在没有该标签的代理上执行。 |\n| 用法 | • 此设置控制 Jenkins 如何在特定代理节点上调度构建。<br>•\
  \ 尽可能使用此节点：这是默认设置，大多数时候代理节点将用于作业执行。<br>• 仅构建与此节点匹配的标签表达式的作业：使用此设置，当项目配置为通过标签表达式在此节点上执行时，Jenkins\
  \ 将在此代理节点上执行构建。 |\n| 启动方式 | • 此设置控制 Jenkins 如何启动特定代理节点。<br>• 通过 Java Web Start 启动代理：允许使用\
  \ Java Web Start 启动代理。<br>• 在主节点上执行命令来启动代理：通过远程在另一台机器上执行进程，例如通过 SSH 或 RSH。<br>•\
  \ 通过 SSH 启动从属代理：通过安全的 SSH 连接发送命令。<br>• 让 Jenkins 将此 Windows 从属节点作为 Windows 服务控制，因为它通过\
  \ Windows 内置的远程管理功能启动 Windows 从属节点。 |\n| 可用性 | • 此设置控制 Jenkins 何时启动和停止此代理。<br>•\
  \ 尽可能保持此代理在线。<br>• 在特定时间将此代理设为在线和离线。<br>• 按需将此代理设为在线，空闲时设为离线。 |\n| 环境变量 | • 我们可在此定义代理节点特定的环境变量。\
  \ |\n| 工具位置 | • 我们可在此定义代理节点特定的工具位置。 |\n\n2. 配置设置并点击“保存”：\n\n### \U0001F512 配置全局安全\n\
  \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_134_0.png)\n\n7. 再次转到代理节点，在代理节点的终端或命令行中执行给定命令，然后它应连接到主节点：\n\
  \n![](img/2a4d2e09d9af2c678ea8f43ea344059d_134_1.png)\n\n8. 要将作业配置到特定节点，请转到构建作业并点击“配置”。\n\
  \n9. 在“常规”部分，选择“限制此项目可运行的位置”，并提供我们创建的代理节点的标签：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_134_2.png)\n\
  \n10. 转到“管理节点”，选择代理节点，以验证与其关联的构建作业：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_135_0.png)\n\
  \n11. 这就是我们创建主/代理架构并在只有一个主节点的情况下将负载分布到各代理的方法。\n\n## 使用 Eclipse 管理 Jenkins 构建作业\n\
  \n我们能否从 Eclipse 执行 Jenkins 作业？当然可以！下面我们来看看如何操作。\n\n### 准备工作\n\n1. 转到“帮助”|“安装新软件...”：\n\
