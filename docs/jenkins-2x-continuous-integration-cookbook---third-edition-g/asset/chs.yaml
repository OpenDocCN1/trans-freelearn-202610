  \ Jenkins 中配置它们，以验证 Jenkins 中的 Cucumber 报告。\n\n## 在 Apache JMeter 中创建负载测试\n\nApache\
  \ JMeter 是一个开源的 Apache 项目。它是一个纯 Java 应用程序。Apache JMeter 用于负载测试、分析和衡量服务的性能。\n\nJMeter（http://jmeter.apache.org）是一款用于压力测试的开源工具。它允许你以可视化方式创建测试计划，然后基于该计划对系统进行加压测试。\n\
  \nJMeter 可以发起多种类型的请求，称为采样器（samplers）。它可以对 HTTP、LDAP 和数据库进行采样，还可以使用脚本等等。它可以通过监听器（listeners）以可视化方式回传报告。\n\
  \n一本适合初学者的 JMeter 书籍是 *Apache JMeter*，作者 Emily H. Halili，由 Packt Publishing 出版，ISBN\
  \ 1847192955（http://www.packtpub.com/beginning-apache-jmeter）。\n\n同一家出版社还有两本更高级的书籍：https://www.packtpub.com/application-development/performance-testing-jmeter-29\
  \ 和 https://www.packtpub.com/application-development/jmeter-cookbook-raw。\n\n在本节中，你将编写一个测试计划，用于访问在文本文件中定义\
  \ URL 的网页。在下一节 *报告 JMeter 测试计划* 中，你将配置 Jenkins 以运行 JMeter 测试计划。\n\n## 准备工作\n\n从\
  \ http://jmeter.apache.org/download_jmeter.cgi 下载 Apache JMeter。解压文件并进入 `bin` 目录。执行\
  \ `jmeter.bat` 或 `jmeter.sh`。\n\n## 操作步骤...\n\n- 1. Jenkins 的稳定版和最新版可在 YUM 仓库中获取。\n\
  - 2. 打开 Apache JMeter 控制台并创建一个测试计划（Test Plan）。\n- 3. 右键单击测试计划，点击“添加”（Add），然后选择“线程（用户）”（Threads\
  \ (Users)）。\n- 4. 选择“线程组”（Thread Group）。\n- 5. 提供线程组名称。\n- 6. 在线程组属性中，提供线程数（Number\
  \ of Threads）、启动周期（Ramp-up Period）和循环次数（Loop Count）。\n- 7. 右键单击线程组。点击“添加”（Add）。点击“采样器”（Sampler）。点击“HTTP\
  \ 请求”（HTTP Request）。\n- 8. 在 HTTP 请求中，提供服务器名称或 IP。在我们的示例中，它将是 localhost 或一个 IP 地址。\n\
  - 9. 提供你的 Web 服务器运行所在的端口号。\n- 10. 选择 GET 方法并为负载测试提供路径：\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_469_0.png)\n\
  \n### Apache JMeter HTTP 请求配置\n\n- 11. 保存 .jmx 文件。\n- 12. 按 Ctrl + R 运行测试计划。\n-\
  \ 13. 点击“查看结果树”（View Results Tree）。\n\n## 补充说明\n\nJMeter 使用线程并行运行请求。每个线程大约用于模拟一个用户。实际上，真实用户对系统的访问强度远低于一个线程。线程每秒钟可以多次访问系统，而典型情况下，用户大约每\
  \ 20 秒点击一次。\n\n测试计划使用了许多元素：\n\n- 线程组：定义运行的线程数量。\n- Cookie 管理器：跟踪每个线程的 Cookie。如果你想在请求之间跟踪\
  \ Cookie，这一点很重要。例如，如果某个线程登录到 Tomcat 服务器，则需要为每个线程存储唯一的 JSESSIONID。\n- CSV 数据集配置：该元素解析\
  \ CSV 文件的内容，将值放入 HOST、PORT 和 URL 变量中。每次迭代时，每个线程都会读取 CSV 文件的新一行。通过使用 `${variable_name}`\
  \ 表示法在元素中展开变量。\n- 查看结果树：此监听器在 GUI 中以请求和响应的树形结构显示结果。这对调试非常有用，但之后应该将其移除。\n\n一个常见的错误是认为一个线程等同于一个用户。主要区别在于线程的响应速度比普通用户更快。如果你不在请求中添加延迟因素，那么少量线程就能真正压垮你的应用程序。例如，阿姆斯特丹大学的在线系统通常每点击一次会有\
  \ 25 秒的延迟。\n\n如果你想在应用程序中排查多线程问题，那么应使用随机延迟元素，而不是固定延迟。这也能更好地模拟典型的用户交互。\n\n\n\n\n##\
