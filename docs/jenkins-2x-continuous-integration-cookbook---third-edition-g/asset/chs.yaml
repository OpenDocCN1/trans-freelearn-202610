  \n## 准备工作\n\n- 1. 转到 Jenkins 仪表盘，点击“新建任务”。\n- 2. 输入名称并选择“自由风格项目”：\n\n## 输入任务名称\n\
  \nSonarHTMLCSSJS\n\n» 必填字段\n\n- **自由风格项目**\n  这是 Jenkins 的核心功能。Jenkins 将构建您的项目，将任何\
  \ SCM 与任何构建系统相结合，甚至可以用于软件构建之外的其他用途。\n- **Maven 项目**\n  构建 Maven 项目。Jenkins 利用您的\
  \ POM 文件，大大减少了配置。\n- **流水线**\n  编排可跨多个构建从属节点运行的长时间活动。适用于构建流水线（以前称为工作流）和/或组织不适合自由风格任务类型的复杂活动。\n\
  - **外部任务**\n  此任务类型允许您记录在 Jenkins 外部（甚至在远程机器上）运行的进程执行情况。这样您就可以将 Jenkins 用作现有自动化系统的仪表盘。\n\
  - **多配置项目**\n  ...适用于需要大量不同配置的项目，例如在多个环境中测试、特定平台的构建等。\n\n3. 在源代码管理部分提供仓库 URL：\n\n\
