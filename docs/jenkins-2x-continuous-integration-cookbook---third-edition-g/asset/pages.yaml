- pgno: 597
  md: '# # Culture and collaboration


    +   - DevOps is a cultural movement and it is all about changing the culture of
    an organization to make the processes more effective and to make people more productive
    with the use of tools.

    +   - Culture of an organization is the key to success. Over the years, templates,
    best practices, and patterns are created in the organizations considering the
    resource capabilities, environment, and many other factors. If the culture of
    an organization can adapt to change, then it is a blessing in a dynamic environment
    of today''s day and age.

    +   - If the culture of an organization supports knowledge sharing and collaboration,
    then it not only creates robust assets that can be utilized over and over, but
    it also creates scopes of innovation and applies them across different business
    units.

    +   - Planning for processes to setup Continuous Development, Continuous Integration,
    Continuous Testing, and Continuous Deployment require collaboration across different
    stakeholders for better implementation and effective results.'
  merge: -1
  img_proc: true
- pgno: 598
  md: '# # Fail early or fail faster


    It is always better to avoid or prevent problems rather than solving them later
    in a situation where lot of things are at stake and the cost interns of price,
    reputation, and market scenario is much harder to deal with. The later in the
    software life cycle you correct a problem, the costlier it will prove to be. Failing
    early is significantly cheaper than failing later. Continuous Integration allows
    you to automatically fail software early. Adding extra tests through plugins or
    connected cloud services gives greater opportunity to face your issues early,
    improving quality and decreasing costs. Embrace acknowledging issues because you
    are saving time and money. Failing later in the project creates a situation of
    no point of return. Even in case of infrastructure provisioning, cloud computing
    has changed a scenario. Because of pay-as-you-go billing models, organizations
    and SMBs can also afford resources that they wouldn''t have dreamt of earlier.
    You can use the same type of resources in Dev and Test environments for a specific
    amount of time and you know exactly what kind of issues will take place and how
    to solve them. Environment is going to be same in production as well, and hence
    you won''t have to deal with any major issues later in the application development
    life cycle because you have already faced these issues and you are very well aware
    how to deal with them quickly.


    Often, the experience of failing early helps to create a framework or best practices
    that not only solves the issues but also makes the overall scenario more robust
    and leads to the creation of design patterns of specific solutions.'
  merge: -1
  img_proc: true
- pgno: 599
  md: '# Data-driven testing


    You can efficiently cover your testing surface if you use a data-driven testing
    approach. For example, when writing JMeter test plans, you can use the CSV configuration
    element to read in variables from text files. This allows JMeter to read out parameters
    from your CSV files, such as hostname, and transverse your infrastructure. This
    enables one test plan to attack many servers. The same is true for SoapUI; by
    adding an Excel data source and looping through the rows, you can test an application
    with many different test users who each have a range of roles. Data-driven testing
    has a tendency to be maintainable. During refactoring, instead of changing your
    test plan as the URLs in your application change, you can factor the URLs out
    into CSV files.'
  merge: -1
  img_proc: true
- pgno: 600
  md: '# # Learning from history


    Teams tend to have their own coding habits and this varies from organization to
    organization because of the tools they use and coding standards they follow. If
    a project fails because of the quality of the code, try to work out which code
    metrics would have stopped the code reaching production. Which mistakes are seen
    repeatedly? Take a look at the following examples:


    +   - **Friday afternoon code failure:** We all are human and have secondary agendas.
    By the end of the week, programmers may have their minds focused elsewhere other
    than on the code. A small subset of programmers have their code quality affected,
    consistently injecting more defects toward the tail end of their roster. Consider
    scheduling a weekly Jenkins job that has harsher thresholds for quality metrics
    near the time of least attention.

    +   - **Code churn:** A sudden surge in code commits just before a product is
    being moved from an acceptance environment to product indicates that there is
    a last-minute rush. For some teams with a strong sense of code quality, this is
    also a sign of extra vigilance. For other less-disciplined teams, this could be
    a naïve push toward destruction. If a project fails and QA is overwhelmed due
    to a surge of code changes, look at setting up a warning Jenkins job based on
    commit velocity. If necessary, you can display your own custom metrics.

    +   - **A rogue coder:** Not all developers create code of the same uniform high
    quality. It is possible that there is consistent underachievement within a project.
    Rogue coders are caught by human code review. However, for a secondary defense,
    consider setting thresholds on static code review reports from SonarQube, FindBugs,
    and PMD. If a particular developer is not following accepted practice, builds
    will fail with great regularity.

    +   - **The GUI does not make sense:** Isn''t it painful when you build a web
    application only to be told at the last moment that the GUI does not quite interact
    in the way that the product owner expected? One solution is to write a mockup
    in FitNesse and surround it with automatic functional tests, using fixtures. When
    the GUI diverges from the planned workflow, then Jenkins will start shouting.

    +   - **Tracking responsibility:** Mistakes are made and lessons need to be learned.
    However, if there is no clear chain of documented responsibility, it is difficult
    to pin down who needs the learning opportunity. One approach is to structure the
    workflow in Jenkins through a series of connected jobs and use the promoted builds
    plugin to make sure the right group verifies at the right point. This methodology
    is also good for reminding the team of the short-term tasks.


    For better code quality, you can create a Jenkins build that takes the code from
    the central repository every night, performs static code analysis using SonarQube,
    and sends the results to stakeholders daily. By doing this, we are not only communicating
    issues daily, but we are also creating a culture for Continuous Improvement by
    cultivating habits. There may come a time when programmers will know exactly what
    kind of programming they need to avoid and hence the quality of the code will
    start getting better.'
  merge: -1
  img_proc: true
- pgno: 601
  md: '# Considering test automation as a software project


    If you see automated testing as a software project and apply well-known principles,
    then you will save on maintenance costs and increase the reliability of tests.


    The **Don''t Repeat Yourself (DRY)** principle is a great example. Under time
    pressure, it is tempting to cut and paste similar tests from one area of the code
    base to another, don''t. Projects evolve bending the shape of the code base; the
    tests need to be reusable to adapt to that change. Fragile tests push up maintenance
    costs. If you separate the code into pages, then when the workflow between pages
    changes, most of the testing code remains intact.


    The **Keep It Simple Stupid (KISS)** principle implies keeping every aspect of
    the project as simple as possible. For example, it is possible to use real browsers
    for automated functional tests or the HtmlUnit framework to simulate a browser.
    The second choice avoids the need to set up an in-memory X server or VNC (http://en.wikipedia.org/wiki/Virtual_Network_Computing)
    and will also keep track of browser versioning. These extra chores decrease the
    reliability of running a Jenkins job, but do increase the value of the tests.
    Therefore, for small projects, consider starting with `HtmlUnit`. For larger projects,
    the extra effort is worth the cost.


    Consider if you need a standalone integration server or if you can get away with
    using a Jetty server called during the integration goal in Maven.'
  merge: -1
  img_proc: true
- pgno: 602
  md: '# Visualize, visualize, and visualize!


    There is a popular phrase in India called *entertainment, entertainment, and entertainment.*
    Visualization is extremely effective to keep things robust. When you have many
    projects scattered across multiple servers developed by different teams and individuals,
    it is difficult to understand the key metrics and emerging issues.


    With 80 percent of information going through to your brain being visual and your
    brain being an excellent pattern recognizer, one of the tricks to understand the
    underlying complexity is to visualize the results of your Jenkins jobs.


    SonarQube is an excellent starting point to visualize and gain an overview of
    the overall quality of projects and for delving into relationships and couplings
    between different areas of the code.


    However, if you have specialized requirements, you will need to build graph generation.
    Test results are usually stored in XML or CSV format. Once you have accumulated
    the results, you can easily transform them with your language of choice.


    You can also create a monitoring view or build pipeline to have visualization
    of different jobs running in Jenkins.'
  merge: -1
  img_proc: true
- pgno: 603
  md: '# Conventions are good


    By following conventions, you decrease the amount of maintenance and lower the
    number of defects hidden in your code. Coding conventions are particularly important
    when more than one developer is involved in writing the code. Conventions aid
    readability. Consistently indented code focuses the eye on poorly-written sections.
    Well-structured variable names help avoid naming collisions between code written
    in different parts of the organization. Structure in naming highlights the data
    that you can later move to configuration files and it also increases the opportunity
    for semi-automatic refactoring using regular expressions, for example, you can
    write a short piece of R code to visualize the number of global variables you
    have per module. The more global variables you have, the greater the risk of using
    the same variable for multiple purposes. Hence, the plot is a rough indicator
    of smelly code.


    Properly followed conventions help to minimize the issues and also help in troubleshooting.
    It creates a unique culture in the organization.'
  merge: -1
  img_proc: true
- pgno: 604
  md: '# # Test frameworks and commercial choices are increasing


    Test frameworks and commercial choices are increasing. In the past few years,
    there has been a lot of improvement in test automation. One example is that static
    code review is being used more thoroughly for security checks. SonarQube is an
    all-encompassing reporter of project quality and new frameworks are emerging to
    improve on the old. Here are a few implications:


    +   - **SonarQube:** This measures the project quality. Its community is active.
    SonarQube will evolve faster than the full range of Jenkins quality metrics plugins.
    Consider using Jenkins plugins for early warnings of negative quality changes
    and SonarQube for in-depth reporting.

    +   - You can find the SonarQube Jenkins plugin at: [https://wiki.jenkins.io/display/JENKINS/SonarQube+plugin](https://wiki.jenkins.io/display/JENKINS/SonarQube+plugin):


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_604_0.png)


    +   - **Static code review tools:** These are improving. FindBugs has moved comment-making
    into the cloud. More bug pattern detectors are being developed. Static code review
    tools are getting better at finding security defects. Expect significantly improved
    tools over time, possibly just by updating the version of your current tools.

    +   - **Code search:** Wouldn''t it be great if code search engines ranked the
    position in their search results of a particular piece of code, based on the defect
    density or coding practice? You could then search a wide range of open source
    products for best practices. You could search for defects to remove and then send
    patches back to the code''s communities.

    +   - **The cloud:** CloudBees allows you to create on-demand slave nodes in the
    cloud. Expect more kinds of cloud-like integrations around Jenkins.


    For more information about SonarQube''s features and the CloudBees cloud service,
    visit [http://www.sonarqube.org/features/](http://www.sonarqube.org/features/)
    and [http://www.CloudBees.com/products/dev](http://www.CloudBees.com/products/dev).'
