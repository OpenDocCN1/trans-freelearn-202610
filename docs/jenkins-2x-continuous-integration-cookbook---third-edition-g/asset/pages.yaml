- pgno: 348
  md: '# # How it works...


    The EnvInject plugin is useful for injecting properties into a build.


    During the recipe, Maven is run twice. The first time, it is run without the `name.from.jenkins`
    variable defined, and the Jenkins job fails. The second time, it is run with the
    variable defined, and the Jenkins job now succeeds.


    Maven expects that the `name.from.jenkins` variable is defined, or the name of
    the project will also not be defined. Normally, this would not be enough to stop
    your job succeeding. However, when running the Groovy code, the `println "Project
    name: ${project.name}"` line, specifically the `project.name` call, will fail
    the build. This is great for protecting against missing property values.


    The Groovy code can see instances of the `org.apache.Maven.model.Model` project
    and the `org.apache.Maven.execution.MavenSession` class. The project instance
    is a model of the XML configuration that you can programmatically access. You
    can get the longname property by referencing it through `project.properties.longname`.
    Your Maven goal will fail if the property does not exist. You can also get to
    the property through the `System.getProperty("longname")` call. However, you cannot
    get to the property by using the `System.getenv()` environment call.


    It is well worth learning the various options:


    +   - **Keep Jenkins environment variables and keep Jenkins build variables:**
    Both these options affect the Jenkins-related variables that your job sees. It
    is good to keep your environment as clean as possible as it will aid you in debugging
    later.

    +   - **Properties content:** You can override specific values in the properties
    files.

    +   - **Environment script file path:** This option points to a script that will
    set up your environment. This is useful if you want to detect specific details
    of the running environment and configure your build accordingly.

    +   - **Populate build cause:** You enable Jenkins to set the `BUILD_CAUSE` environment
    variable. The variable contains information about the event that triggered the
    job.'
