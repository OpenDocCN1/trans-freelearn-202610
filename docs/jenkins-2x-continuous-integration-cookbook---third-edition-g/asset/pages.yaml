- pgno: 544
  md: '# # Trust but verify


    With great power comes great responsibility. If only a few administrators maintain
    your Jenkins deployment, then you can most likely trust everyone to add JavaScript
    with no harmful side effects. However, if you have a large set of administrators
    who use a wide range of Java libraries, then your maintenance and security risks
    increase rapidly. Consider your security policy and at least add the audit trail
    plugin ([https://wiki.jenkins-ci.org/display/JENKINS/Audit+Trail+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/Audit+Trail+Plugin))
    to keep track of the actions.


    This plugin adds an **Audit Trail** section in the main Jenkins configuration
    page. Here you can configure log location and settings (file size and number of
    rotating log files), and a URI pattern for requests to be logged. The default
    options select most actions with significant effect such as creating/configuring/deleting
    jobs and views or delete/save-forever/start a build. The log is written to disk
    as configured and recent entries can also be viewed in the Manage/System Log section.


    Also, see the JobConfigHistory plugin for recording actual changes made to job
    configurations:


    ![](img/2a4d2e09d9af2c678ea8f43ea344059d_544_0.png)'
  merge: -1
