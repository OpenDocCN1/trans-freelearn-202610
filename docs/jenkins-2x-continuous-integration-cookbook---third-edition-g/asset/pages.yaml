- pgno: 566
  md: '# Efficient use of views


    Jenkins'' addictive ease of configuration lends itself to creating a large number
    of jobs. This increases the volume of information exposed to developers. Jenkins
    needs to avoid chaos by utilizing browser space efficiently. One approach is to
    define minimal views. In this recipe, you will use the `DropDownViewsTabBar` plugin.
    It removes views as tabs and replaces the tabs with one select box. This aids
    in quicker navigation. You will also be shown how to provision lots of jobs quickly
    using a simple HTML form generated by a script.


    In this recipe, you will be creating a large number of views that you may want
    to delete later. If you are using a virtual box image, consider cloning the image
    and deleting it after you have finished.'
  merge: -1
  img_proc: true
- pgno: 567
  md: '# Getting ready


    Install the `DropDownViewsTabBar` plugin ([https://wiki.jenkins-ci.org/display/JENKINS/DropDown+Views+TabBar+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/DropDown+Views+TabBar+Plugin)).'
  merge: -1
