- pgno: 4
  md: "# # About the Authors\n\n**Mitesh Soni** is an avid learner with 10 years of\
    \ experience in the IT industry. He is an SCJP, SCWCD, VCP, IBM Urbancode, and\
    \ IBM Bluemix certified professional and Certified Scrum Master. He loves DevOps\
    \ and cloud computing and he also has an interest in programming in Java. He finds\
    \ design patterns fascinating. He believes a picture is worth a thousand words.\n\
    \nHe occasionally contributes to etutorialsworld.com. He loves to play with kids,\
    \ fiddle with his camera, and take photographs at Indroda Park. He is addicted\
    \ to taking pictures without knowing many technical details. He lives in the capital\
    \ of Mahatma Gandhi's home state.\n\nMitesh has also authored the following books\
    \ with Packt:\n\n+   - Jenkins Essentials, Second Edition\n+   - DevOps Bootcamp\n\
    +   - Implementing DevOps with Microsoft Azure\n+   - DevOps for Web Development\n\
    +   - Jenkins Essentials\n+   - Learning Chef\n\n> \"I've missed more than 9,000\
    \ shots in my career. I've lost almost 300 games. 26 times, I've been trusted\
    \ to take the game-winning shot and missed. I've failed over and over and over\
    \ again in my life. And that is why I succeed.\"\n> \n> — Michael Jordan.\n\n\
    **Alan Mark Berg**, BSc, MSc, PGCE, has been the lead developer at Central Computer\
    \ Services at the University of Amsterdam since 1998. He is currently working\
    \ in an Innovation Work Group that accelerates the creation of new and exciting\
    \ services. In his famously scarce spare time, he writes. Alan has a bachelor's\
    \ degree, two master's degrees, a teaching qualification, and quality assurance\
    \ certifications. He has also coauthored two Packt Publishing books about Sakai\
    \ (http://sakaiproject.org), a highly successful open source learning management\
    \ platform used by millions of students around the world. He has won a couple\
    \ of awards, including the Sakai Fellowship and Teaching With Sakai Innovation\
    \ Award (TWSIA).\n\nAlan enjoys working with talent; this forces him to improve\
    \ his own competencies. This motivation is why Alan enjoys working in energetic,\
    \ open source communities of interest. At the time of writing, he is on the board\
    \ of directors of the Apereo Foundation and is the community offi cer for its\
    \ Learning Analytics Initiative (https://confluence.sakaiproject.org/display/LAI/Learning+Analytics+Initiative).\n\
    \nIn previous incarnations, Alan was a QA director, a technical writer, an Internet/Linux\
    \ course writer, a product line development officer, and a teacher. He likes to\
    \ get his hands dirty with building, gluing systems, exploring data, and turning\
    \ it into actionable information. He remains agile by ruining various development\
    \ and acceptance environments and generally rampaging through the green fields\
    \ of technological opportunity"
  merge: -1
  img_proc: true
