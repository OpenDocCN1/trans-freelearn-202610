- pgno: 366
  md: '# Eclipse templates for JSP pages


    Eclipse is a popular open source IDE for Java developers (http://www.eclipse.org/).
    If you are using Eclipse with its default template for JSP pages, then your pages
    may fail to compile. This is because, at the time of writing, the default compiler
    does not like the meta-information mentioned before the <html> tag, as follows:


    ```

    <%@ page language="java" contentType="text/html;charset=UTF-8"

    pageEncoding="UTF-8"%>

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"

    "http://www.w3.org/TR/html4/loose.dtd">

    ```


    As the meta-information follows the JSP specification, it is likely that later
    the JSP compiler will accept the information. Until that day, simply remove the
    lines before compiling, or change the JSP compiler that you use.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# Remotely triggering jobs through the Jenkins API


    Jenkins has a remote API that allows you to enable, disable, run, and delete jobs;
    it also lets you change the configuration. The API is increasing with each Jenkins
    version. To get the most up-to-date details, you will need to review `http://yourhost/job/Name_of_Job/api/`.
    Where `yourhost` is the location of your Jenkins server, `Name_of_Job` is the
    name of a job that exists on your server.


    This recipe details how you can trigger builds remotely by using security tokens.
    This will allow you to run other jobs from within Maven.'
  merge: -1
  img_proc: true
