- pgno: 344
  md: '# # Manipulating environmental variables


    This recipe shows you how to pass variables from Jenkins to your build job, and
    how different variables are overwritten. It also describes one way of failing
    the build if crucial information has not been correctly passed.


    In a typical development/acceptance/production environment, you will want to keep
    the same `pom.xml` files, but pass different configurations. One example is the
    extension names of property files such as `.dev`, `.acc`, and `.prd`. You would
    want to fail the build if critical configuration values are missing due to human
    error.


    Jenkins has a number of plugins for passing information to builds, including the
    EnvFile plugin ([https://wiki.jenkins-ci.org/display/JENKINS/Envfile+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/Envfile+Plugin))
    and the EnvInject plugin ([https://wiki.jenkins-ci.org/display/JENKINS/EnvInject+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/EnvInject+Plugin)).
    The EnvInject plugin was chosen for this recipe as it is reported to work with
    nodes and offers a wide range of property injection options.'
  merge: -1
  img_proc: true
- pgno: 345
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 346
  md: '# # How to do it...


    +   1. Create a `pom.xml` file that is readable by Jenkins with the following
    lines of code:


    ```

    ```xml

    <project xmlns="http://maven.apache.org/POM/4.0.0"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    xsi:schemaLocation="http://maven.apache.org/POM/4.0.0

    http://maven.apache.org/maven-v4_0_0.xsd">

    <modelVersion>4.0.0</modelVersion>

    <groupId>org.berg</groupId>

    <artifactId>ch3.jenkins.builds.properties</artifactId>

    <version>1.0-SNAPSHOT</version>

    <name>${project.name}</name>

    <properties><project.build.sourceEncoding>UTF8</project.build.sourceEncoding>

    </properties>

    <build>

    <plugins><plugin>

    <groupId>org.codehaus.gmaven</groupId>

    <artifactId>gmaven-plugin</artifactId>

    <version>1.3</version>

    <executions>

    <execution>

    <id>run-myGroovy</id>

    <goals><goal>execute</goal></goals>

    <phase>verify</phase>

    <configuration>

    <source>

    def environment = System.getenv()

    println "---Environment"

    environment.each{println it }

    println "---Property"

    println(System.getProperty("longname"))

    println "---Project and session"

    println "Project: ${project.class}"

    println "Session: ${session.class}"

    println "longname: ${project.properties.longname}"

    println "Project name: ${project.name}"

    println "JENKINS_HOME: ${project.properties.JENKINS_HOME}"

    </source>

    </configuration>

    </execution></executions>

    </plugin></plugins>

    </build>

    </project>

    ```

    ```


    +   2. Create a file named `my.properties` and place it in the same directory
    as the `pom.xml` file. Then, add the following lines of code in the `my.properties`
    file:


    ```

    ```properties

    project.type=prod

    secrets.file=/etc/secrets

    enable.email=true

    JOB_URL=I AM REALLY NOT WHAT I SEEM

    ```

    ```


    +   3. Create a blank Freestyle job with the job name `ch3.environment`.


    +   4. In the Source Code Management section, check File System and add a fully
    qualified path for your directory, such as `/var/lib/jenkins/cookbook/ch3.building_software/environment`,
    in the Path field.


    +   5. In the Build section, select Add a build step for Invoke top-level Maven
    targets. In the newly expanded section, add the following details:


    ```

    ```text

    Maven version: 3.2.1

    Goals: verify

    ```

    ```


    +   6. Click on the Advanced button and type `longname=SuperGood` in Properties.'
  merge: -1
