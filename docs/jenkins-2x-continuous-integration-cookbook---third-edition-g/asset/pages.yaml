- pgno: 515
  md: "![](img/2a4d2e09d9af2c678ea8f43ea344059d_515_0.png)\n\nBefore creating your\
    \ first script for a pipeline, let's understand some important terms.\n\nThe node\
    \ defines the node created in the context of the Jenkins' master agent architecture.\
    \ It executes the step the moment the executor is available on node. It creates\
    \ a workspace or a directory for the pipeline to keep files. The following is\
    \ the sample syntax:\n\n```\n```groovy\nnode {\n    // execute the pipeline on\
    \ Master node\n}\nnode('windows') {\n    // execute the pipeline on node labelled\
    \ as Windows\n}\n```\n```\n\nThe stage is a step that can be considered as a logically\
    \ separate step, such as Init, Build, Test, Deploy, and so on.\n\nA step or a\
    \ build step is a task that can be executed to perform some activity such as copy\
    \ artifact, archive artifact, checkout code from GitHub, and define an environment\
    \ variable.\n\nThe script for the pipeline follows:\n\n```\n```groovy\nnode {\n\
    def mvnHome\nstage('Preparation') { // for display purposes\n    // Get Pipeline\
    \ code from a GitHub repository\ngit 'https://github.com/mitesh51/spring-petclinic.git'\n\
    \    // Get the Maven tool.\n    // ** NOTE: This 'apache-maven-3.3.1' Maven tool\
    \ must\n    // be configured in the global configuration.\nmvnHome = tool 'apache-maven-3.3.1'\n\
    }\nstage('SonarQube analysis') {\n    // requires SonarQube Scanner 3.0+\ndef\
    \ scannerHome = tool 'SonarQube Scanner 3.0.3';\n// Sonarqube6.3 must be configured\
    \ in the Jenkins\n// Configuration -> Add SonarWube server\nwithSonarQubeEnv('Sonarqube6.3')\
    \ {\n//provide all required properties for Sonar\n// execution\nbat \"${scannerHome}/bin/sonar-scanner\
    \ -\nDsonar.host.url=http://localhost:9000/ -\n```\n```\n```"
  merge: -1
  img_proc: true
