- pgno: 255
  md: '# # Testing for OWASP''s top 10 security issues


    This recipe details the automatic testing of Jenkins for well-known security issues
    with w3af, a penetration testing tool from the **Open Web Application Security
    Project (OWASP)**. For more information, visit [http://w3af.sourceforge.net](http://w3af.sourceforge.net).
    OWASP''s purpose is to make application security visible. The OWASP''s top 10
    lists of insecurities for 2010 include the following:


    +   - **A2-Cross-site Scripting (XSS):** An XSS attack can occur when an application
    returns an unescaped input to a client''s browser. The Jenkins administrator can
    do this by default through the job description.

    +   - **A6-Security Misconfiguration:** A Jenkins plugin gives you the power to
    write custom authentication scripts. It is easy to get scripts wrong through misconfiguration.

    +   - **A7-Insecure Cryptographic Storage:** There are over 600 plugins for Jenkins,
    each storing its configuration in separate XML files. It is quite possible that
    there could be a rare mistake with the storage of passwords in plain text. You
    will need to double-check.

    +   - **A9-Insufficient Transport Layer Protection:** Jenkins runs over HTTP by
    default. It can be a hassle and involves extra costs to obtain a trusted certificate.
    You might be tempted not to implement TLS, leaving your packets open.


    You will find that OWASP''s top 10 lists of insecurities for 2013 have some changes
    compared with the 2010 version. The most significant change is the inclusion of
    **A9-Using Known Vulnerable Components**. If your software depends on older libraries,
    then there is a window of opportunity for the manipulation of known weaknesses.


    Jenkins has a large set of plugins written by a motivated, diffuse, and hardworking
    community. It is possible, due to the large churn of code, that security defects
    are inadvertently added. Examples include leaving passwords in plain text in configuration
    files or using unsafe rendering that does not remove suspicious JavaScript. You
    can find the first type of defect by reviewing the configuration files manually.
    The second type is accessible to a wider audience and is thus more readily crackable.
    You can attack the new plugins by hand. There are helpful cheat sheets available
    on the internet ([http://hackers.org/xss.html](http://hackers.org/xss.html)).
    The effort required is tedious; automated tests can cover more ground and can
    be scheduled as part of a Jenkins job.


    In the recipe named *Exploring the OWASP dependency-check plugin*, you will configure
    Jenkins to give you warning of known attack vectors, based on automatically reviewing
    your code dependencies.


    # ## OWASP storefront:


    OWASP publish a list of the top 10 most common security attack vectors for web
    applications each year. They publish this document and a wide range of books through
    [http://lulu.com](http://lulu.com). At Lulu, you have free access to PDF versions
    of OWASP''s documents, or you can buy cheap, on-demand printed versions. You can
    find the official storefront at: [http://stores.lulu.com/owasp](http://stores.lulu.com/owasp).'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Getting ready


    Penetration tests have the potential to damage a running application. Make sure
    that you have a backed-up copy of your Jenkins workspace. You might have to reinstall.
    Also, turn off any enabled security within Jenkins: this allows w3af to freely
    roam the security surface.


    Download the newest version of w3af from SourceForge ([http://w3af.org/download/](http://w3af.org/download/))
    and also download and read OWASP''s top 10 list of well-known attacks from [https://www.owasp.org/index.php/Category:OWASP_Top_Ten_Project](https://www.owasp.org/index.php/Category:OWASP_Top_Ten_Project).


    w3af has both Windows and *NIX installation packages; use the OS installation
    of your choice. However, the Windows Installer is no longer supported and the
    installation process without the Installer is complex. Therefore, it''s better
    to use a *NIX version of the tool.


    The Debian package for w3af is older and more unstable than the SourceForge package
    for Linux. Therefore, do not use the apt-get and yum methods of installation,
    but rather, use the downloaded package from SourceForge.'
  merge: -1
  img_proc: true
- pgno: 257
  md: "# # How to do it...\n\n+   1. To install w3af, follow the instructions given\
    \ on the developer site ([http://w3af.org/download/](http://w3af.org/download/)).\
    \ If there are any unsolvable dependency issues for Ubuntu, fall back to the apt-get\
    \ installation approach and install an older version of the tool as follows:\n\
    +   \n+   2. Run w3af.\n+   3. Under the Profiles tab, select OWASP_TOP10.\n+\
    \   4. Under the Target address window, fill in `http://localhost:8080/`, changing\
    \ the hostname to suit your environment.\n+   5. Click on the Start button. The\
    \ penetration tests will now take place and the Start button will change to Stop.\
    \ At the end of the scan, the Stop button will change to Clear.\n+   6. View the\
    \ attack history by selecting the Log tab.\n+   7. Review the results by clicking\
    \ on the Results tab.\n+   8. After the first scan, select full_audit under Profiles.\n\
    +   9. Click on the Clear button.\n+   10. Type `http://localhost:8080/` in the\
    \ Target address window.\n+   11. Click on the Start button.\n+   12. Wait until\
    \ the scan has finished and review the Results tab.\n\n```\n```bash\nsudo apt-get\
    \ install w3af\n```\n```"
  merge: -1
  img_proc: true
- pgno: 258
  md: '# How it works...


    w3af is written by security professionals. It is a pluggable framework with extensions
    written for different types of attacks. The profiles define which plugins and
    their associated configurations you are going to use in the penetration test.


    You first attack using the OWASP_TOP10 profile and then attack again with a fuller
    set of plugins.


    The results will vary according to your setup. Depending on the plugin, security
    issues are occasionally flagged that do not exist. You will need to verify any
    issues mentioned by hand.


    At the time of writing, no significant defects were found using this approach.
    However, the tool pointed out slow links and generated server-side exceptions.
    This is the sort of information you would like to note in bug reports.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# There''s more...


    Consistently securing your applications requires experienced attention to detail.
    Here are a few more things for you to review.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Target practice with WebGoat


    The top 10 list of security defects can at times seem difficult to understand.
    If you have some spare time and would like to practice against a deliberately
    insecure application, you should try WebGoat ([https://www.owasp.org/index.php/Category:OWASP_WebGoat_Project](https://www.owasp.org/index.php/Category:OWASP_WebGoat_Project)).


    WebGoat is well-documented with a hints system and links to video tutorials; it
    leaves little room for misunderstanding the attacks.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# More tools of the trade


    w3af is a powerful tool, but works better in conjunction with the following tools:


    +   - **Nmap** (http://nmap.org/): A simple to use, highly popular, award-winning
    network scanner.

    +   - **Nikto** (http://cirt.net/nikto2): A Perl script that quickly summarizes
    system details and looks for the most obvious defects.

    +   - **Skipfish** (https://code.google.com/p/skipfish/downloads/list): A C program
    that bashes away at many requests over a prolonged period. You can choose from
    different dictionaries of attacks. This is an excellent poor man''s stress test;
    if your system stays up, you know that it has reached a minimal level of stability.

    +   - **Wapiti** (http://wapiti.sourceforge.net/): A Python-based script that
    discovers attackable URLs and then cycles through a list of evil parameters.


    Jenkins is flexible, so you can call a wide range of tools through scripts running
    in jobs, including the security tools mentioned:


    There are a number of great resources for securing native OSes, including the
    Debian security how-to (https://www.debian.org/doc/manuals/securing-debian-howto/);
    for Windows, articles found underneath the MSDN security center (http://msdn.microsoft.com/en-us/security/);
    and for Mac, Apple''s official security guides (https://www.apple.com/support/security/guides/).
    Online services need vigorous attention to their security surface.'
