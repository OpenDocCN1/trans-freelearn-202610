- pgno: 167
  md: '# Monitoring Jenkins with JavaMelody


    JavaMelody (http://code.google.com/p/javamelody/) is an open source project that
    provides comprehensive monitoring. The Jenkins plugin monitors both the master
    instance of Jenkins and also its nodes. The plugin provides a detailed wealth
    of important information. You can view evolution charts ranging from 1 day or
    1 week to months for the main quantities, such as CPU or memory. Evolution charts
    are very good at pinpointing scheduled jobs that are resource-hungry.


    The `Monitoring` plugin provides the monitoring of Jenkins with JavaMelody. It
    provides charts for CPU, memory, system load average, HTTP response time, and
    so on. It also provides details of HTTP sessions, errors and logs, actions for
    garbage collection, heap dumps, invalid session(s), and so on.'
  merge: -1
  img_proc: true
