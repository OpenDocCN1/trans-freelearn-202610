  md: '# # Creating a load test in Apache JMeter


    Apache JMeter is an open source Apache project. It is a pure Java application.
    Apache JMeter is used to load test, analyze, and measure the performance of services.


    JMeter ([http://jmeter.apache.org](http://jmeter.apache.org)) is an open source
    tool for stress testing. It allows you to visually create a test plan and then
    hammer systems based on that plan.


    JMeter can make many types of requests, known as samplers. It can sample HTTP,
    LDAP, and databases, use scripts, and much more. It can report back visually with
    listeners.


    A beginner''s book on JMeter is *Apache JMeter* by Emily H. Halili, published
    by Packt Publishing, ISBN 1847192955 ([http://www.packtpub.com/beginning-apache-jmeter](http://www.packtpub.com/beginning-apache-jmeter)).


    Two more advanced books from the same publisher are [https://www.packtpub.com/application-development/performance-testing-jmeter-29](https://www.packtpub.com/application-development/performance-testing-jmeter-29)
    and [https://www.packtpub.com/application-development/jmeter-cookbook-raw](https://www.packtpub.com/application-development/jmeter-cookbook-raw).


    In this recipe, you will write a test plan for hitting web pages whose URLs are
    defined in a text file. In the next recipe, *Reporting JMeter test plans*, you
    will configure Jenkins to run JMeter test plans.'
  merge: -1
  img_proc: true
