- pgno: 532
  md: '# Introduction


    This chapter explores communication through Jenkins, recognizing that there are
    different target audiences.


    Jenkins is a talented communicator. Its home page displays the status of all jobs,
    allowing you to make quick decisions. You can easily set up multiple views, prioritizing
    information naturally. Jenkins, with its hordes of plugins, notifies you by email,
    dashboards, and Google services. It shouts at you through mobile devices, radiates
    information as you walk past big screens, and fires at you with USB sponge missile
    launchers.


    Its primary audience is developers, but don''t forget the wider audience that
    wants to use the software being developed. Seeing Jenkins regularly building with
    consistent views and a corporate look and feel builds confidence in the software''s
    roadmap. This chapter includes recipes to help you reach this wider audience.


    When creating a coherent communication strategy, there are many Jenkins-specific
    details to configure. Here are a few that will be considered in this chapter:


    +   - **Notifications**: Developers need to know quickly when something is broken.
    Jenkins has many plugins; you should select a few that suit the team''s ethos.

    +   - **Page decoration**: A page decorator is a plugin that adds content to each
    page. You can cheaply generate a corporate look and feel by adding your own style
    sheets and JavaScript.

    +   - **Overlaying Jenkins**: Using the Maven WAR plugin, you can overlay your
    own content on top of Jenkins. You can use this to add custom content and provision
    resources such as home pages, which will enhance the corporate look and feel.

    +   - **Optimize the views**: Front page views are lists of jobs that are displayed
    in a tab. The front page is used by the audience to quickly decide which job to
    select for review. Plugins expand the choice of view types and optimize information
    digestion. This potentially avoids the need to look further, saving precious time.

    +   - **Drive by notification**: Extreme views that radiate information visually
    look great on large monitors. If you place a monitor by watering holes such as
    receptions or coffee machines, then passers-by will absorb the ebb and flow of
    job status changes. The view sublimely hints at the professionalism of your company
    and the stability of your product''s roadmap.

    +   - **Keeping track of your audience**: If you are openly communicating, then
    you should track usage patterns so that you can improve services. Consider connecting
    your Jenkins pages to Google Analytics or Piwik, an open source analytics application.'
  merge: -1
  img_proc: true
- pgno: 533
  md: '# # Skinning Jenkins with the simple themes plugin


    This recipe modifies the Jenkins look and feel through the themes plugin.


    The themes plugin is a page decorator; it decorates each page with extra HTML
    tags. The plugin allows you to upload a style sheet and JavaScript file. The files
    are then reachable through a local URL. Each Jenkins page is then decorated with
    HTML tags that use the URLs to pull in your uploaded files. Although straightforward,
    when properly crafted, the visual effects are powerful.'
  merge: -1
  img_proc: true
