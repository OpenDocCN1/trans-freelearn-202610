- pgno: 470
  md: '# There''s more


    JMeter uses threads to run requests in parallel. Each thread is supposed to approximately
    simulate one user. In reality, a real user hits the system a lot less hard than
    a thread. Threads can hit the system many times a second, whereas, typically,
    a user clicks approximately once every 20 seconds.


    The test plan uses a number of elements:


    +   - Thread Group: This defines the number of threads that run.

    +   - Cookie manager: This keeps the track of cookies per thread. This is important
    if you want to keep track of cookies between requests. For example, if a thread
    logs in to a Tomcat server, the unique JSESSIONID needs to be stored for each
    thread.

    +   - CSV Data Set Config: This element parses the content of a CSV file, putting
    values in the HOST, PORT, and URL variables. A new line of the CSV file is read
    for each thread, once per iteration. The variables are expanded in the elements
    by using the `${variable_name}` notation.

    +   - View Results Tree: This listener displays the results in the GUI as a tree
    of requests and responses. This is great for debugging but should be removed later.


    A common mistake is to assume that a thread is equivalent to a user. The main
    difference is that threads can respond faster than an average user. If you do
    not add delay factors in the request, then you can really hammer your applications
    with a few threads. For example, a delay of 25 seconds per click is typical for
    the online systems at the University of Amsterdam.


    If you are looking to coax out multithreading issues in your applications, then
    use a random delay element rather than a constant delay. This is also a better
    simulation of a typical user interaction.'
  merge: -1
  img_proc: true
