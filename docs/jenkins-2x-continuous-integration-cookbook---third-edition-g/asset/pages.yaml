- pgno: 564
  md: '# There''s more...


    The example report is shown as follows:


    ```

    ```html

    <html><head><title>Example Report</title>

    <link rel="stylesheet" type="text/css" href="/css/style.css" /></head>

    <body>

    <h2>Generated Report</h2>

    Example icon: <img title="A Jenkins Icon" alt="Schedule a build" src="/images/24x24/clock.png"

    />

    </body></html>

    ```

    ```


    It pulls in the main Jenkins style sheet `/css/style.css`.


    It is possible that when you update a style sheet in an application, you do not
    see the changes in your browser until you have cleaned your browser cache. Jenkins
    gets around this latency issue in a clever way. It uses a URL with a unique number
    that changes with each Jenkins version. For example, for the `css` directory,
    you have two URLs:


    +   - `/css`

    +   - `/static/uniquenumber/css`


    Most Jenkins URLs use the latter form. Consider doing so for your style sheets.


    The unique number changes per version, so you will need to update the URL for
    each upgrade


    When running the site goal in a Maven build, a local website is generated ([http://maven.apache.org/plugins/maven-site-plugin](http://maven.apache.org/plugins/maven-site-plugin)).
    This website has a fixed URL inside the Jenkins job that you can point at with
    the My HTML Report link. This brings documentation such as test results within
    easy reach.'
  merge: -1
  img_proc: true
