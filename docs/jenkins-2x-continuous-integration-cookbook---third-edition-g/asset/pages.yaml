  md: '# Enter an item name


    FirstPipeline


    +   - **Freestyle project** — This is the central feature of Jenkins. Jenkins
    will build your project, combining any SCM with any build system, and this can
    be even used for something other than software build.

    +   - **Maven project** — Build a maven project. Jenkins takes advantage of your
    POM files and drastically reduces the configuration.

    +   - **Pipeline** — Orchestrates long-running activities that can span multiple
    build slaves. Suitable for building pipelines (formerly known as workflows) and/or
    organizing complex activities that do not easily fit in free-style job type.

    +   - **External Job** — This type of job allows you to record the execution of
    a process run outside Jenkins, even on a remote machine. This is designed so that
    you can use Jenkins as a dashboard of your existing automation system.

    +   - **Multi-configuration project** — Suitable for projects that need a large
    number of different configurations, such as testing on multiple environments,
    platform-specific builds, etc.


