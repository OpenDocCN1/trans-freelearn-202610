- pgno: 568
  md: "# How to do it...\n\n+   1. Copy and paste the following Perl script into an\
    \ executable file named create.pl:\n+   2. Create an HTML file from the output\
    \ of the Perl script, for example:\n+   3. In a web browser, as an administrator,\
    \ log in to Jenkins.\n+   4. Create the Template1 job, adding any details you\
    \ wish. This is your template job that will be copied into many other jobs.\n\
    +   5. Load form.html into the same browser.\n+   6. Click on one of the Create\
    \ CH9.fake buttons. Jenkins returns an error message:\n+   7. Visit Configure\
    \ Global Security on http://localhost:8080/configureSecurity and uncheck the Prevent\
    \ Cross Site Request Forgery exploits box.\n+   8. Click on Save.\n+   9. Click\
    \ on all of the Create CH9.fake buttons.\n+   10. Visit the front page of Jenkins\
    \ and verify that the jobs have been created and are based on the Template1 job.\n\
    +   11. Create a large number of views with a random selection of jobs. Review\
    \ the front page, noting the chaos.\n+   12. Visit the configuration screen /configure;\
    \ selecting DropDownViewsTabBar provides a drop-down menu for selecting views\
    \ in the View Tab Bar select box. In the DropDown ViewsTabBar subsection, check\
    \ the Show Job Counts box, as shown in the following screenshot:\n\n```\n#!/usr/bin/perl\n\
    $counter=0;\n$end=20;\n$host='http://localhost:8080';\nwhile($end > $counter){\n\
    \    $counter++;\n    print \"<form action=$host/createItem?mode=copy method=POST>\\\
    n\";print \"<input type=text name=name value=CH9.fake.$counter>\\n\";\n    print\
    \ \"<input type=text name=from value=Template1 >\\n\";\n    print \"<input type=submit\
    \ value='Create CH9.fake.$counter'>\\n\";\n    print \"</form><br>\\n\";\n   \
    \ print \"<form action=$host/job/CH9.fake.$counter/doDelete method=POST>\\n\"\
    ;print \"<input type=submit value='Delete CH9.fake.$counter'>\\n\";\n    print\
    \ \"</form><br>\\n\";\n}\n```\n\n```\nperl create.pl > form.html\n```\n\n```\n\
    HTTP ERROR 403\nProblem accessing /createItem. Reason:\nNo valid crumb was included\
    \ in the request\n```\n\n![](img/2a4d2e09d9af2c678ea8f43ea344059d_568_0.png)"
  merge: -1
