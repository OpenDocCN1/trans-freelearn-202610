- pgno: 190
  md: '# # How it works...


    Let''s see how the script will be executed:


    +   - A warning string is defined and the current date is now stored. Each job
    in Jenkins is programmatically iterated via the `for` statement.

    +   - Jenkins has a class to store build run information. The runtime information
    is retrieved via `job.getLastSuccessfulBuild()` and is stored in the `lastSuccessfulBuild`
    instance. If no successful build has occurred, then `lastSuccessfulBuild` is set
    to null; otherwise, it has the runtime information.

    +   - The time of the last successful build is retrieved and then stored in the
    `time` instance via `lastSuccessfulBuild.getTimestamp().getTime()`.


    The current year is compared with the year of the last successful build and, if
    they are different and the warning string has not already been added to the front
    of the job description, then the description is updated.


    Javadoc:


    You will find the job API mentioned at [http://javadoc.jenkins-ci.org/hudson/model/Job.html](http://javadoc.jenkins-ci.org/hudson/model/Job.html)
    and the run information at [http://javadoc.jenkins-ci.org/hudson/model/Run.html](http://javadoc.jenkins-ci.org/hudson/model/Run.html).'
  merge: -1
  img_proc: true
