- pgno: 605
  md: '# # Offsetting work to Jenkins nodes


    Thanks to its wealth of plugins, Jenkins can easily connect many types of systems.
    Therefore, Jenkins'' usage can grow virally in an organization. Testing and Javadoc
    generation takes up system resources. A master Jenkins is best used to report
    back quickly on the jobs distributed across a range of Jenkins nodes. This approach
    makes it easier to analyze where the failure lies in the infrastructure.


    If you are using JMeter for your performance tests at scale, consider offloading
    from Jenkins to a cloud service such as BlazeMeter ([http://blazemeter.com/](http://blazemeter.com/)).


    For functional testing with Selenium, there is also a wide range of cloud services.
    Consider using them not only because of load, but also because of the use of a
    wide range of browser types and versions offered. One example of a commercial
    service is Sauce Labs ([https://saucelabs.com/](https://saucelabs.com/)). It is
    worth periodically reviewing the market for new cloud services.


    There are other scenarios as well where you can utilize distributed architecture
    in Jenkins. For example, to keep Android and iOS agents and bind them with the
    Jenkins master so all jobs related to Android and iOS apps are offloaded from
    the master Jenkins.'
  merge: -1
  img_proc: true
- pgno: 606
  md: '# Starving QA/integration servers


    A few hundred years ago, coal miners would die because of the build-up of methane
    and carbon monoxide in the mines. To give early warning of this situation, canaries
    were brought into the mines. Being more sensitive, the birds would faint first,
    giving the miners enough time to escape. Consider doing the same for your integration
    servers in your acceptance environment: deliberately starve them of resources.
    If they fall over, you will have enough time to review before watching the explosion
    in production.'
  merge: -1
  img_proc: true
- pgno: 607
  md: '# # Reading the change log of Jenkins


    Jenkins practices what it preaches. Minor version number releases occur about
    once a week. New features appear, bugs are resolved, and new bugs introduced.
    In general, the great majority of changes lead to improvement, but a few do not.
    However, when introduced, bugs are generally caught early and removed quickly.


    Before updating Jenkins for new features and potential stability glitches, it''s
    worth reading the changelog ([http://jenkins-ci.org/changelog](http://jenkins-ci.org/changelog)).
    Occasionally, you might want to speed up a deployment to production because of
    a security issue or miss a version due to a stability blooper.'
  merge: -1
  img_proc: true
- pgno: 608
  md: '# Avoiding human bottlenecks


    The simpler your testing environment is, the less skill you''ll need to maintain
    it. As you learn to use the plugins and explore the potential of new tools and
    scripting languages, the more knowledge the organization needs in order to maintain
    a stable system. If you wish to go on holidays without random text messages asking
    for advice, make sure that your knowledge is transferred to at least a second
    person. This sounds obvious, but in the rush of your daily load, this principle
    is often forgotten or put to one side.


    One of the easiest ways to share knowledge is to send a couple of developers off
    to the same conferences and events together (https://www.CloudBees.com/company/events/juc).
    Learn best practices from Jenkins user conferences and other conferences too.


    This is where managers play a significant role in knowledge dissemination. They
    need to plan in time and activities for the sharing of knowledge, rather than
    expecting it to happen by magic.'
  merge: -1
  img_proc: true
- pgno: 609
  md: '# Avoiding groupthink


    It is easy to be perfect on paper, defining the importance of a solid set of Javadocs
    and unit tests. However, the real world on its best days is chaotic. Project momentum,
    motivated by the need to deliver, is an elusive force to push back against.


    Related to project momentum is the potential of groupthink

    (http://en.wikipedia.org/wiki/Groupthink) by the project team or resource owners.
    If the team has the wrong collective attitude, as a quality assurance professional
    it is much harder to inject hard-learned realism. Quality assurance is not only
    about finding and capturing defects as early as possible, it is also about injecting
    objective criteria for success or failure into the different phases of a project''s
    cycle.


    Consider adding measurable criteria into the Jenkins build. Obviously, if the
    code fails to compile, then the product should not go to acceptance and production.
    Less obvious, are the rules around code coverage of unit tests worth defending
    in release management meetings.


    Try getting the whole team involved at the start of the project before any coding
    has taken place and agree on metrics that fail a build. One approach is to compare
    a small successful project to a small failed project. If later there is a disagreement,
    then the debate is about process and numbers rather than personality.'
  merge: -1
  img_proc: true
