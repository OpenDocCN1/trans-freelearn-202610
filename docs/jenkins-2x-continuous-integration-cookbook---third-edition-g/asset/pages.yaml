- pgno: 479
  md: '# Getting ready


    It is assumed that you have run through the last recipe creating the JMeter test
    plan. You will also need to install the Jenkins performance plugin ([https://wiki.jenkins-ci.org/display/JENKINS/Performance+Plugin](https://wiki.jenkins-ci.org/display/JENKINS/Performance+Plugin)).'
  merge: -1
  img_proc: true
- pgno: 480
  md: "# # How to do it...\n\n+   1. Open `./examples/jmeter_example.jmx` in JMeter\
    \ and save as `./plans/URL_ping.jmx`.\n+   2. Select CSV Data Set Config changing\
    \ the filename to `${__property(csv)}`.\n+   3. Under the File menu, select the\
    \ Save option.\n+   4. Create a build.xml file at the top level of your project\
    \ with the following content:\n\n```\n```xml\n<project default=\"jmeter.tests\"\
    >\n  <property name=\"jmeter\" location=\"/var/lib/jenkins/jmeter\" />\n  <property\
    \ name=\"target\" location=\"${basedir}/target\" />\n  <echo message=\"Running...\
    \ Expecting variables [jvarg,desc]\" />\n  <echo message=\"For help please read\
    \ ${basedir}/README\" />\n  <echo message=\"[DESCRIPTION] ${desc}\" />\n  <taskdef\
    \ name=\"jmeter\" classname=\"org.programmerplanet.ant.taskdefs.jmeter.JMeterTask\"\
    \ classpath=\"${jmeter}/extras/ant-jmeter-1.0.9.jar\" />\n  <target name=\"jmeter.init\"\
    >\n    <mkdir dir=\"${basedir}/jmeter_results\"/>\n    <delete includeemptydirs=\"\
    true\">\n      <fileset dir=\"${basedir}/jmeter_results\" includes=\"**/*\" />\n\
    \    </delete>\n  </target>\n  <target name=\"jmeter.tests\" depends=\"jmeter.init\"\
    \ description=\"launch jmeter load tests\">\n    <echo message=\"[Running] jmeter\
    \ tests...\" />\n    <jmeter jmeterhome=\"${jmeter}\" resultlog=\"${basedir}/jmeter_results/LoadTestResults.jtl\"\
    >\n      <testplans dir=\"${basedir}/plans\" includes=\"*.jmx\"/>\n      <jvmarg\
    \ value=\"${jvarg}\" />\n      <property name=\"csv\" value=\"${basedir}/data/URLS.csv\"\
    \ />\n    </jmeter>\n  </target>\n</project>\n```\n```\n\n+   5. Commit the updates\
    \ to your subversion project.\n+   6. Log in to Jenkins.\n+   7. Create a new\
    \ freestyle job with the name `ch6.remote.jmeter`.\n+   8. Under Source Code Management,\
    \ check Subversion, adding your subversion repository URL to the repository URL.\n\
    +   9. Within the Build section, add the build step, Invoke Ant.\n+   10. Click\
    \ on Advanced in the new Invoke Ant subsection, adding the following for properties:\n\
    \n```\n```properties\njvarg=-Xmx512m\ndesc= This is the first iteration in a performance\
    \ test\nenvironment - Driven by Jenkins\n```\n```\n\n+   11. In the Post-build\
    \ Actions section, check Publish Performance test result report. Add the input\
    \ `jmeter_results/*.jtl` to Report Files.\n+   12. Click on Save.\n+   13. Run\
    \ the job a couple of times and review the results found under the Performance\
    \ trend link."
  merge: -1
  img_proc: true
- pgno: 481
  md: '# How it works...


    The `build.xml` file is an Ant script that sets up the environment and then calls
    the JMeter Ant tasks defined in the library `/extras/ant-jmeter-1.0.9.jar`. The
    JAR file is installed as part of the standard JMeter distribution.


    Any JMeter test plan found under the plans directory will be run. Moving the test
    plan from the `examples` directory to the `plans` directory activates it. The
    results are aggregated in `jmeter_results/LoadTestResults.jtl`.


    The Ant script passes the `csv` variable to the JMeter test plan; the location
    of the `.csv` file, `${basedir}/data/URLS.csv`. `${basedir}`, is automatically
    defined by Ant. As the name suggests, it is the base directory of the Ant project.


    You can call JMeter functions within its elements using the structure `${__functioncall(parameters)}`.
    You have added the function call `${__property(csv)}` to the test plan CSV Data
    Set Config element. The function pulls in the value of `.csv` that was defined
    in the Ant script.


    The Jenkins job runs the Ant script, which in turn runs the JMeter test plans
    and aggregates the results. The Jenkins performance plugin then parses the results,
    creating a report.'
  merge: -1
  img_proc: true
- pgno: 482
  md: '# There''s more...


    To build complex test plans speedily, consider using the transparent proxy ([http://jmeter.apache.org/usermanual/component_reference.html#HTTP_Proxy_Server](http://jmeter.apache.org/usermanual/component_reference.html#HTTP_Proxy_Server))
    built into JMeter. You can run it on a given port on your local machine, setting
    the proxy preferences in your web browser to match. The recorded JMeter elements
    will then give you a good idea of the parameters sent in the captured requests.


    An alternative is Badboy ([http://www.badboysoftware.biz/docs/jmeter.html](http://www.badboysoftware.biz/docs/jmeter.html)),
    which has its own built-in web browser. It allows you to record your actions in
    a similar way to Selenium IDE and then save them to a JMeter plan.'
  merge: -1
  img_proc: true
- pgno: 483
  md: '# # Testing with FitNesse


    FitNesse ([http://fitnesse.org](http://fitnesse.org)) is a fully integrated standalone
    wiki and acceptance-testing framework. You can write tests in tables and run them.
    Writing tests in a wiki language widens the audience of potential test writers
    and decreases the initial efforts required to learn a new framework.


    If a test passes, the table row is displayed in green. If it fails, it is displayed
    in red. The tests can be surrounded by wiki content delivering context information,
    such as user stories, at the same location as the tests. You can also consider
    creating mock-ups of your web applications in FitNesse next to the tests, and
    pointing the tests at those mock-ups.


    This recipe describes how to run FitNesse remotely and display the results within
    Jenkins.'
  merge: -1
  img_proc: true
- pgno: 484
