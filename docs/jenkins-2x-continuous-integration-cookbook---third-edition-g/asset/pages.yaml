- pgno: 153
  md: '# # Modifying the Jenkins configuration from the command line


    You may well be wondering about the XML files at the top level of the Jenkins
    workspace. These are configuration files. The `config.xml` file is the main one
    that deals with the default server values, but there are also specific ones for
    any plugins that have values set through the GUI.


    There is also a `jobs` subdirectory underneath the workspace. Each individual
    job configuration is contained in a subdirectory with the same name as the job.
    The job-specific configuration is then stored in `config.xml` within the subdirectory.
    It''s a similar situation for the users directory: there is one subdirectory per
    user, with the personal information stored in `config.xml`.


    Under a controlled situation where all the Jenkins servers in your infrastructure
    have the same plugins and version levels, it is possible for you to test on one
    test machine and then push the configuration files to all the other machines.
    You can then restart the Jenkins servers with the **command-line interface (CLI)**.


    This recipe familiarizes you with the main XML configuration structure and then
    provides hints about the plugin API based on the details of the XML.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Getting ready


    You will need a Jenkins server with security enabled and the ability to edit files,
    either by logging in and working from the command line or through editing with
    a text editor.'
  merge: -1
  img_proc: true
- pgno: 155
  md: "# How to do it...\n\nLet's see how to modify the Jenkins configuration.\n\n\
    +   1. In the top-level directory of Jenkins, look for the `config.xml` file.\
    \ Edit the line with `numExecutors`, changing the number 2 to 3:\n+   \n+    \
    \   `<numExecutors>3</numExecutors>`\n+   \n+   2. Restart the server. You will\
    \ see that the number of executors has increased from the default two to three.\n\
    +   3. Plugins persist their configuration through XML files. To prove this point,\
    \ look for the `thinBackup.xml` file. You will not find it unless you have installed\
    \ the `thinBackup` plugin.\n\n```\n<numExecutors>3</numExecutors>\n```"
  merge: -1
  img_proc: true
- pgno: 156
  md: '# How it works...


    Jenkins uses **XStream** ([http://xstream.codehaus.org/](http://xstream.codehaus.org/))
    to persist its configuration into a readable XML format. The XML files in the
    workspace are configuration files for plugins, tasks, and an assortment of other
    persisted information. The `config.xml` file is the main configuration file. Security
    settings and global configuration are set here and reflect changes made through
    the GUI. Plugins use the same structure and the XML values correspond to member
    values in the underlying plugin classes. The GUI itself is created from XML via
    the Jelly framework ([http://commons.apache.org/jelly/](http://commons.apache.org/jelly/)).


    By restarting the server, you are certain that any configuration changes are picked
    up during the initialization phase.


    It is also possible to use Reload configuration from a storage feature from the
    Manage Jenkins page, and to load an updated configuration without restarting.'
  merge: -1
  img_proc: true
