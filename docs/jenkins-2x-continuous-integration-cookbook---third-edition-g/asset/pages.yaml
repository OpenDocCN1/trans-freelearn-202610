- pgno: 554
  md: '# # Which types of content can you replace?


    The Jenkins server deploys to two main locations. The first location is the core
    application and the second is the workspace, which stores information that changes.
    To gain a fuller understanding of the content, review the directory structure.
    A useful command in Linux is the tree command, which displays the directory structure.
    To install under Ubuntu, use the following command:


    ```

    apt-get install tree

    ```


    In Windows OS it''s available by default in the Command Prompt.


    For the Jenkins Ubuntu workspace, using the following command helps you to generate
    a tree view of the workspace:


    ```

    tree -d -L 1 /var/lib/jenkins

    ```


    +   - `fingerprints`: This is the directory that is used to store checksums to
    uniquely identify files

    +   - `jobs`: This stores job configuration and build results

    +   - `plugins`: This is where plugins are deployed and usually configured

    +   - `tools`: This is where tools such as Maven and Ant are deployed

    +   - `updates`: This is used for updates

    +   - `userContent`: The content is made available under the URL `/userContent`

    +   - `users`: This is the user information displayed under the `/me` URL


    The default Ubuntu location of the web app is `/var/run/jenkins/war`. If you are
    running Jenkins from the command line, then the option for placing the web app
    is as follows:


    ```

    -webroot

    ```


    +   - `css`: This is the location of Jenkins style sheets

    +   - `executable`: This is used for running Jenkins from the command line

    +   - `favicon.ico`: This is the icon we replaced in this recipe

    +   - `help`: This is the directory with help content

    +   - `images`: This includes the graphics in different sizes

    +   - `META-INF`: This is the location for the manifest file and the `thepom.xml`
    file that generated the WAR

    +   - `robots.txt`: This is used to tell search engines where they are allowed
    to crawl

    +   - `scripts`: This is the location of the JavaScript library

    +   - `WEB-INF`: This is the main location for the servlet part of the web application

    +   - `winstone.jar`: This is the servlet container available at [http://winstone.sourceforge.net/](http://winstone.sourceforge.net/)'
  merge: -1
  img_proc: true
- pgno: 555
  md: '# Search engines and robots.txt


    If you are adding your own custom content, such as user home pages, company contact
    information, or product details, then consider modifying the top-level `robots.txt`
    file. At present, it excludes search engines from all content:


    ```

    # we don''t want robots to click "build" links

    User-agent: *

    Disallow: /

    ```


    You can find the full details of the structure of the `robots.txt` at http://www.w3.org/TR/html4/appendix/notes.html#h-B.4.1.1.


    Google uses richer structures that allow as well as disallow; refer to https://developers.google.com/webmasters/control-crawl-index/docs/robots_txt?csw=1.


    The following `robots.txt` allows access by the Google crawler to the directory
    `/userContent/corporate/`. It is an open question whether all web crawlers will
    honor the intent.


    ```

    User-agent: *

    Disallow: /

    User-agent: Googlebot

    Allow: /userContent/corporate/

    ```


    To help secure your Jenkins infrastructure, refer to the recipes in Chapter 3,
    Managing Security.'
  merge: -1
  img_proc: true
