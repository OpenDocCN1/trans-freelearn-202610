- pgno: 363
  md: '# # How it works...


    You created a template project using an archetype.


    The Maven plugin, upon seeing the `index.jsp` page, compiles it into a class with
    the name `jsp.index_jsp`, placing the compiled class under `WEB-INF/classes`.
    The plugin then defines the class as a servlet in `WEB-INF/web.xml` with a mapping
    to `/index.jsp`. Let''s take a look at the following example:


    ```

    ```xml

    <servlet>

    <servlet-name>jsp.index_jsp</servlet-name>

    <servlet-class>jsp.index_jsp</servlet-class>

    </servlet>


    <servlet-mapping>

    <servlet-name>jsp.index_jsp</servlet-name>

    <url-pattern>/index.jsp</url-pattern>

    </servlet-mapping>

    ```

    ```


    The list of archetypes is increasing over time. You can find the full list at
    [http://maven-repository.com/archetypes](http://maven-repository.com/archetypes).
    If you are running Ubuntu, you will find a local XML catalog listing all the archetypes
    named `archetype-catalog.xml` in the `~/.m2` directory.'
  merge: -1
