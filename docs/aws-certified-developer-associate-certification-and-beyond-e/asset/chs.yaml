  \ 4. 接下来，点击**删除对象**按钮。\n+   5. 对象删除完成后，返回到你运行`sam deploy`命令的终端/命令提示符窗口。请确保你仍在同一个文件夹中。\n\
  +   6. 运行`sam delete --no-prompts`命令。\n+   7. SAM 现在将执行堆栈删除操作。这可能需要几分钟才能完成。\n+ \
  \  8. 如果你返回 CloudFront 和 Amazon S3，应该会发现资源已被删除。\n\n## 摘要\n\n在本章中，你学习了 AWS SAM，这是一个开源框架，它简化了在\
  \ AWS 上开发、测试和部署无服务器应用程序的过程。SAM 使用 AWS CloudFormation 来帮助构建支持无服务器应用程序的底层基础设施。它提供了一种语法来表达函数、API\
  \ 和数据库，允许你定义和管理你的 IaC（基础设施即代码）。\n\n你还发现了 AWS AppSync 与 Amazon DynamoDB 的集成，展示了这些服务在构建可扩展、无服务器和实时应用程序方面提供的强大组合。通过定义\
  \ GraphQL 模式，并配置解析器将 GraphQL 操作直接映射到 DynamoDB 中的数据操作，你了解了这种无需中间层的高效数据同步和管理的无缝交互，使其成为开发现代应用程序的高效解决方案。\n\
  \n使用 AppSync，你可以运行查询和变更来与 DynamoDB 交互，利用直接数据映射，并在需要更复杂逻辑时使用 AWS Lambda。通过由 GraphQL\
  \ 订阅促进的实时功能，你发现了 AppSync 如何随着数据库中数据的变化向客户端应用程序提供实时更新。\n\n这种集成简化了后端基础设施并加速了开发过程，使你能够更多地专注于创建引人入胜的用户体验，而不是管理数据库操作和数据流。无论你是构建移动应用、Web\
  \ 应用程序还是具有多个数据源的复杂系统，AppSync 和 DynamoDB 的组合都提供了解决现代应用程序需求的可扩展且高效的解决方案。\n\n## 备考演练\
