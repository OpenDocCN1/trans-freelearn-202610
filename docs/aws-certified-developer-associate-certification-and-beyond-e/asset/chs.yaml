  - 7. 在组织单元名称下输入 `DevelopmentOU`。\n- 8. 在标签部分点击添加标签。标签是您可以添加到 AWS 资源的键值对，以帮助识别、组织和保护您的\
  \ AWS 资源。每个资源最多可以有 50 个标签。创建两个标签，一个键为 Name，值为 DevelopmentOU；另一个键为 Project，值为 ProductivityApps，如图\
  \ 1.15 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_55_0.png)\n\n图 1.15 – AWS\
  \ 组织标签\n\n- 9. 点击创建组织单元。\n- 10. 重复步骤 5 到 9，创建另一个名为 ProductionOU 的组织单元，这样你的组织中现在有两个组织单元，如图\
  \ 1.16 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_55_1.png)\n\n图 1.16 – AWS\
  \ 组织单元\n\n现在你已经为组织创建了组织单元，是时候创建更多 AWS 账户了，这将在下一个练习中描述。\n\n## 项目任务 1.4 – 创建开发和生产\
  \ AWS 账户\n\n在本练习中，你将创建两个额外的 AWS 账户：开发账户和生产账户。在本学习指南的后面部分，你将学习如何在这些账户中构建工作负载，还将了解应用程序开发如何按照最佳实践从开发环境过渡到生产环境。请执行以下步骤：\n\
  \n- 1. 重新登录你的 AWS 账户，如有必要，导航到 **AWS Organizations** 管理控制台。\n- 2. 在左侧菜单中，确保选择了 **AWS\
  \ Accounts**。\n- 3. 在右侧窗格中，点击 **添加 AWS 账户** 按钮。\n- 4. 你将可以选择创建新的 AWS 账户或邀请现有账户。选择\
  \ **创建 AWS 账户** 选项。\n- 5. 在 **创建 AWS 账户** 部分，为你的 AWS 账户提供名称——在本例中为 `TodoPlus Development`。\n\
  - 6. 对于电子邮件地址，请提供开发电子邮件别名，如本章前面的 *技术要求* 部分所述。\n- 7. 你还会注意到 IAM 角色已预填为 **OrganizationAccountAccessRole**\
  \ 角色（将在下一章详细讨论）。这使得管理账户能够访问成员账户中的资源。\n- 8. 在 **标签** 部分点击 **添加标签**。创建两个标签，一个键为 `Name`，值为\
  \ `DevAccount`；另一个键为 `Project`，值为 `ProductivityApps`。\n- 9. 点击 **创建 AWS 账户**。\n\
  - 10. AWS 将需要一些时间来创建你的新 AWS 开发账户。\n\n以这种方式创建的每个 AWS 账户都有该账户的根用户。根用户由你创建账户时使用的电子邮件地址定义。请注意，你没有设置密码。要为成员账户的根用户定义密码，你必须从\
  \ AWS 主登录页面请求对这些账户进行密码重置。密码重置链接将发送到成员 AWS 账户根用户的电子邮件地址，允许你设置一个复杂的密码。然后你可以登录这些成员\
  \ AWS 账户。\n\n重复 *步骤 1 到 10* 为生产工作负载设置另一个 AWS 账户。确保将此账户命名为 `Todo Plus Production`。对于标签，创建一个键为\
  \ `Name`、值为 `ProdAccount`，另一个键为 `Project`、值为 `ProductivityApps`。\n\n现在你已经设置了开发和生产账户，建议将这些账户放入你在上一个练习中设置的适当组织单元中，这将在下一个练习中进行配置。\n\
  \n## 项目任务 1.5 – 将 AWS 账户分配到相应的组织单元\n\n在本练习中，你将把上一个练习中创建的账户关联到相关的组织单元：\n\n- 1. 仍在\
  \ AWS Organizations 控制台中，点击选择组织结构下的 Todo Plus Development 账户。\n- 2. 在 AWS 账户下的操作下拉菜单中点击移动。\n\
  - 3. 你将导航到“移动 AWS 账户 ‘Todo Plus Development’”页面。\n- 4. 在“目标”下选择 DevelopmentOU。\n\
