  \ VPC link，它在网关和负载均衡器之间充当安全隧道，以允许流量通过。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_304_0.png)\n\
  \n图 7.28 – 使用 Auto Scaling 和 ALB 的 Todo List 应用架构\n\n此步骤涉及的组件包括：\n\n- * 额外的 Amazon\
  \ S3 存储桶将托管应用程序源代码并充当存储库\n- * 修改 IAM 角色，使其包含从 AWS Secrets Manager 访问凭据数据的额外权限，以及从新的\
  \ Amazon S3 存储桶下载应用程序源代码的能力\n- * 创建 EC2 密钥对，作为最佳实践\n- * 创建目标组，用于托管 EC2 实例并执行运行状况检查\n\
  - * 创建启动模板，为应用服务器选择正确的 AMI，并使用应用程序对其进行配置\n- * 创建 Auto Scaling 组，以定义 EC2 实例群的参数以及适用的扩展策略\n\
  - * 创建 ALB，将传入的 HTTP 流量分发到 EC2 实例群\n\n接下来，让我们继续构建应用架构的最后一个组件，即内部 ALB。\n\n## 项目任务\
  \ 7.7 – 应用程序负载均衡器\n\n在此项目任务中，你将部署一个 ALB，用于将入站流量分发到由 Auto Scaling 组部署的 EC2 实例。负载均衡器使你能够在多个实例之间分配流量，这些实例都提供对同一应用程序的访问，从而为你的应用程序实现高可用性。如果某个\
  \ EC2 实例发生故障，负载均衡器会将流量重定向到其他健康实例。\n\n尽管本章提供了构建内部 ALB 的说明，你也可以自由尝试部署面向 Internet 的负载均衡器。你需要确保负载均衡器注册在公有子网中。然后，你可以测试后端工作实例的路径，例如\
  \ `/`、`/health` 和 `/doc`，用于测试目的。完成后，终止该负载均衡器，并将其替换为内部负载均衡器。\n\n只有在下一章中部署 API Gateway\
