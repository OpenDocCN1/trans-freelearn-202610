  \ Manager 中的密钥，以获取连接数据库所需的数据库凭据。\n\n## 项目任务 6.2 – 集成 AWS Secrets Manager\n\n在本项目任务中，你将配置一个密钥来托管你在前一个任务中创建的数据库的\
