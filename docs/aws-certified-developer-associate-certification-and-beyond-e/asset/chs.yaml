- "## Incorporating Edge Network Services to Connect to Your Application with Amazon\
  \ CloudFront and Route 53\n\n在快节奏的在线服务世界中，应用程序性能不仅仅是一个功能，而是用户体验的基石。对即时访问内容和无缝应用程序性能的期望比以往任何时候都高。当你的用户群分布在全球各地时，确保对内容和应用程序的低延迟访问尤为重要。\n\
  \n这正是 Amazon CloudFront，AWS 的强大 **content delivery network (CDN)**，发挥作用的地方。它为高速、安全和高效的内容分发提供了骨干。\n\
  \n此外，你必须提供一套完整的 **Domain Name System (DNS)** 服务，以确保对应用程序和资源的无缝访问。使用自定义域名进一步增强了你的业务品牌，同时确保到资源的最佳路由，同时提供灵活性和故障转移能力。这正是\
  \ Amazon Route 53，一项完全托管的 DNS 服务，派上用场的地方。\n\n从 AWS Certified Developer – Associate\
  \ 证书考试的角度来看，CloudFront 和 Route 53 是可以帮助你解决应用程序部署策略的服务。CloudFront 是一个关键组件，因为它支持内容缓存，从而降低延迟，这是\
  \ *Task Statement 3: Optimize applications by using AWS services and features of\
  \ Domain 4: Troubleshooting and Optimization* 的要求。此外，CloudFront 有助于进一步加强你的安全态势，因为它可以强制执行对源站内容的受保护访问。\n\
  \n本章深入探讨 Amazon CloudFront 和 Route 53 的复杂性，探讨这些服务如何增强应用程序的性能、可用性和弹性。\n\n对于我们的虚构客户\
  \ **TodoPlus Limited** 而言，Amazon CloudFront 是一项可以为其即将推出的 **Todo List** 应用程序提供所有功能的服务。Amazon\
  \ CloudFront 将为应用程序托管的任何静态内容提供安全功能和低延迟访问以及改进的性能。这些可能包括有关如何使用应用程序的培训视频，以便最终用户不会遇到延迟或缓冲问题。\n\
  \n此外，通过支持抵御 DDoS 攻击和应用防火墙，TodoPlus Limited 可以为应用程序提供更高级别的安全性，确保其可靠性和高可用性。在下一节中，你将更详细地了解这些功能。\n\
  \n## Incorporating CloudFront into Your Application Architecture\n\n下图说明了一个使用 CloudFront\
  \ 创建分发端点并提供 CDN 服务的简单架构。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_351_0.png)\n\
  \nFigure 9.1: Simple architecture using CloudFront to cache static web pages\n\n\
  该架构的关键组件如下：\n\n- **Client browser**：用户的网络浏览器请求查看网站或 Web 应用程序。\n- **Route 53**：该服务是一个\
  \ DNS Web 服务。它将 www.example.com 等友好域名翻译成计算机用于连接的 IP 地址。Route 53 还提供流量路由服务，可将用户引导至最近的\
  \ CloudFront 分发点以实现更快的 content delivery。Amazon Route 53 将在本章后面详细讨论。\n\n\n\n\n\n\
  - **CloudFront**：Amazon CloudFront 是一项快速 CDN 服务，能够以低延迟和高传输速度安全地向全球客户交付数据、视频、应用程序和\
  \ API。CloudFront 的工作原理是将内容缓存到离最终用户最近的边缘站点，从而最大限度地减少数据传输距离，降低延迟并缩短加载时间。\n- **Amazon\
  \ S3**：Amazon S3 是一项对象存储服务，提供业界领先的可扩展性、数据可用性、安全性和性能。在此架构中，S3 存储静态网页以及需要交付到客户端浏览器的资源。S3\
  \ 具有高持久性和高可用性，是托管静态内容的绝佳选择。\n\n在此架构中，CloudFront 的优势包括更好的性能、可扩展性、成本效益、安全性、高可用性和内容缓存。\n\
  \n接下来，你将了解 CloudFront 的核心功能和配置模式。\n\n## 轻松失效\n\n存储在边缘站点或区域边缘缓存中的内容具有定义的**生存时间（TTL）**。如果内容在\
  \ TTL 内未被访问，它将被清除，以免缓存过期内容。如果需要在缓存过期之前刷新内容，CloudFront 允许在缓存过期前需要刷新内容时轻松地使缓存对象失效。例如，假设你更新了需要立即提供的内容，或者你发现内容不正确。在这种情况下，你必须确保用户能够访问准确的信息。作为使用失效功能的替代方案（该功能会产生费用），你可以使用文件版本控制来提供文件的不同版本。\n\
  \n> **注意**\n> 在即将进行的项目中，你将部署 Todo List 应用程序的最终版本。如果你对前端代码进行了任何更改，可以使用失效功能，确保通过 CloudFront\
  \ URL 访问时能立即反映你的更改。\n\n在下一节中，你将进一步了解如何使用 CloudFront 配置缓存。\n\n## 什么是缓存键？\n\n**缓存键**是\
  \ CloudFront 用于缓存对象的标识符。当 CloudFront 收到请求时，它会在缓存中查找与请求的缓存键匹配的对象。如果找到，则返回该对象；否则，将请求转发到源站。缓存键通常包含所请求对象的\
  \ URL，并且根据缓存策略，还可以包含查询字符串、标头和 Cookie。\n\n## 缓存未命中和缓存命中\n\n当 CloudFront 在缓存中找到所请求的对象时，就会发生缓存命中，这意味着它无需回到源服务器。另一方面，当缓存中找不到该对象时，就会发生缓存未命中，促使\
  \ CloudFront 从源服务器获取该对象。如果找到了内容，则直接通过缓存提供（缓存命中）。如果没有，CloudFront 会从源站获取内容并将其存储在缓存中，以供将来请求使用（缓存未命中）。此概念如图\
  \ 9.2 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_353_0.png)\n\n图 9.2：缓存命中与缓存未命中\n\
  \n该图描绘了一个 CDN 场景。图中展示了三个主要组件：\n\n- **客户端**：这代表用户的设备、计算机或任何能够发送 HTTP 请求的设备。它发送一个\
  \ HTTP 请求，请求名为 beach.jpg 的资源，指定大小为 300 x 300。该请求包含 HTTP 标头，例如 User-Agent（用于识别浏览器类型和操作系统，此处表示旧浏览器，可能是\
  \ Windows NT 上的 Internet Explorer 5.01）、Host（从中请求资源的域）和 Accept-Encoding（表示客户端可以处理\
  \ gzip 和 deflate 编码）。\n- **边缘站点**：这是 CDN 基础设施的一部分。它充当客户端和源服务器之间的中介。边缘站点接收来自客户端的\
  \ HTTP 请求，如果其本地缓存中有请求的资源，则直接将其提供给客户端，以减少延迟并减轻源服务器的负载。如果资源不在缓存中，边缘站点会将请求转发到源服务器。该图表明，边缘站点会将客户端的所有查询字符串和请求标头转发到源站。\n\
  \n## 将标头转发到源站\n\n对于每个请求都需要特定标头的应用程序而言，此过程至关重要：\n\n- **始终转发：** 如果你的应用程序要求每个请求都带有特定标头，你可以配置\
  \ CloudFront 始终将它们转发到源站。但是，这会降低缓存的有效性，因为 CloudFront 必须更频繁地访问源站。\n- **最佳实践：** 只转发源站处理请求所必需的标头。\n\
  \n通过正确理解和配置缓存策略，你可以确保高效的内容交付，同时实现最佳性能和成本节约。\n\n## 缓存策略与源站请求策略\n\n这两种策略在 CloudFront\
  \ 如何处理缓存和请求方面起着至关重要的作用。理解它们之间的区别是有效管理内容交付的关键：\n\n- **缓存策略：** 这定义了 CloudFront 如何缓存内容，包括缓存\
  \ TTL、标头、Cookie 和查询字符串的设置。它本质上是一组规则，决定 CloudFront 可以缓存什么内容以及缓存多长时间。\n- **源站请求策略：**\
  \ 此策略控制哪些请求标头、Cookie 和查询字符串被发送到源站，无论请求方法（GET、POST 等）如何。源站请求策略确保源站能够收到生成并返回所请求内容所需的信息。\n\
  \n在下一节中，你将了解更多关于缓存行为的内容。\n\n## 缓存行为\n\nCloudFront 中的缓存行为控制如何处理不同内容或路径模式的请求。你可以为特定的\
  \ URL 路径模式定义缓存行为，并自定义内容的缓存和提供方式。\n\n当用户从你的 CloudFront 分配请求内容时，CloudFront 会检查请求的路径是否与缓存行为中指定的任何路径模式匹配。如果匹配，CloudFront\
  \ 将应用相应的缓存行为规则来处理该请求。如果没有匹配项，CloudFront 将使用默认缓存行为。\n\n缓存行为可以配置各种选项：\n\n- **路径模式**：定义缓存行为适用于哪些请求，例如\
  \ `/images/*` 适用于图片目录中的所有文件，或 `/videos/high-def.mp4` 适用于特定的视频文件\n- **查看者请求**：根据请求标头、Cookie、查询字符串和\
  \ HTTP 方法等因素，决定是转发、重定向还是阻止用户请求\n- **缓存方法**：设置内容在缓存中保留多长时间的规则（TTL 设置），以及是否根据标头、Cookie\
  \ 或查询字符串进行缓存\n- **内容处理**：决定 CloudFront 在内容未被缓存时应如何处理（例如，从源站获取、提供自定义错误页面）\n\n使用缓存的好处包括：根据内容类型优化加载时间从而提高性能，对缓存内容进行细粒度控制，通过减少源站获取来节约成本，以及增强安全性。\n\
  \n下一节将教你如何保护和限制内容访问。\n\n## CloudFront 安全访问和内容安全\n\n出于多种原因，建议通过 CloudFront 访问内容。除了\
  \ CloudFront 提供的缓存服务和性能改进之外，你还可以使用 CloudFront 原生可配置的各种安全措施来保护你的内容及其访问方式。CloudFront\
  \ 与其他 AWS 安全工具（如 WAF）集成。在配置资源访问和实施内容限制时，你必须了解以下关键领域。\n\n在以下小节中，你将学习如何根据地理位置限制访问。\n\
  \n### CloudFront 地理限制\n\n地理限制（也称为 Geo-blocking）可防止特定地理位置的用户访问你通过 CloudFront 分发的内容。如果你拥有的内容权限仅在特定国家/地区有效，则可以配置\
  \ CloudFront，根据请求来源国家/地区阻止或允许访问。此概念如图 9.3 所示。\n\n\n\n\n\n图 9.4 中的流程确保只有拥有有效签名 cookie\
  \ 的用户或应用程序才能访问私有存储桶中的内容，而该内容只能通过使用私钥的 RESTful 服务获取。这是在云存储服务中保护内容的典型模式，通过加密方法提供受控访问。\n\
  \n同时也必须理解，签名者必须创建签名 URL 或签名 cookie。这可以是创建于 CloudFront 的受信任密钥组，也可以是包含 CloudFront\
  \ 密钥对的 AWS 账户。AWS 建议使用受信任密钥组配合签名 URL 和签名 cookie。做出此建议有几个原因。\n\n使用受信任密钥组时，无需使用 AWS\
  \ 账户根用户来管理公钥。AWS 建议你不要将根用户用于日常操作。此外，密钥组允许对密钥进行更灵活的管理，例如在不更改 CloudFront 分发的情况下轮换密钥。你还可以定义\
  \ IAM 权限以限制不同用户可以执行的操作；例如，允许用户上传公钥但不允许删除它们。此外，作为一项附加功能，可以将更多公钥与分发关联。\n\n使用 CloudFront\
  \ 密钥对时，它们与 AWS 账户根用户绑定，并且在管理方面灵活性较低。你按图 9.5 在根用户安全凭证环境中进行配置：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_359_0.png)\n\
  \n图 9.5：不建议为根用户配置 CloudFront 密钥对\n\n重要的是，你每个 AWS 账户只能拥有两个活动的 CloudFront 密钥对。\n\n\
  在受信任密钥组和 CloudFront 密钥对之间进行选择通常取决于你的运营规模和管理偏好。受信任密钥组为更大、更动态的环境提供更好的控制和管理。\n\n当通过\
  \ CloudFront 分发 URL 分发内容时，绕过此 URL 直接连接到源是可能的，具体取决于源类型。例如，如果你在 Amazon S3 存储桶上创建静态网站并且对\
  \ S3 存储桶具有完全的公共访问权限，那么任何知道 URL 地址的人都可以通过网站端点 URL 连接到它。如果你想防止此类访问，下一个部分将介绍称为源访问身份（OAI）和源访问控制（OAC）的功能，它们有助于实现这一点。\n\
  \n## CloudFront OAI 和 OAC\n\nAmazon CloudFront 提供两种选项来确保查看者只能通过 CloudFront 分发点访问你的内容。\n\
  \nCloudFront OAI 是一项功能，可让你强制仅使用你在 CloudFront 分发中创建的 OAI 身份来访问托管在源中的内容，例如 Amazon\
  \ S3 存储桶。一旦配置此功能，你必须更新存储桶策略以仅允许来自 OAI 用户的内容访问。你通过将以下内容添加到存储桶策略来实现：\n\n```json\n\"\
  Principal\": {\n    \"AWS\": \"arn:aws:iam::cloudfront:user/CloudFront Origin Access\
  \ Identity <origin access identity ID>\"\n}\n```\n\n这确保 OAI 代表用户授予对存储桶中托管内容的访问权限。存储桶策略的此更新可以在完成\
  \ CloudFront 分发时自动创建，也可手动创建策略。如果用户尝试使用 Amazon S3 端点直接访问内容，将被拒绝访问。\n\n然而，此功能存在一些缺点，包括以下内容：\n\
  \n- OAI 不支持所有 AWS 区域。\n- OAI 不原生支持使用 AWS KMS 的 Amazon S3 服务器端加密（SSE-KMS）。它仅支持使用\
  \ Amazon S3 管理密钥的服务器端加密（SSE-S3）。\n- 不支持动态请求，例如 PUT、POST 或 DELETE。\n\n新的 OAC 解决了这些缺点，接下来将讨论。\n\
  \n使用 OAC 是 AWS 推荐的方法，用于授予用户访问托管在源中的内容的方法，例如 Amazon S3 存储桶。在 CloudFront 分发中配置 OAC\
  \ 之前，你必须允许 CloudFront 服务主体（cloudfront.amazonaws.com）访问你的 Amazon S3 存储桶。具体来说，你可以定义一个存储桶策略，其中仅在请求通过\
  \ CloudFront 分发到达时才授予访问权限，使用 Condition 元素。以下示例策略显示了这一点，该策略允许用户同时读取和写入存储桶中的内容：\n\n\
  ```json\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": {\n        \"Sid\"\
  : \"AllowCloudFrontServiceReadWritePermission\",\n        \"Effect\": \"Allow\"\
  ,\n        \"Principal\": {\n            \"Service\": \"cloudfront.amazonaws.com\"\
  \n        },\n        \"Action\": [\n            \"s3:GetObject\",\n           \
  \ \"s3:PutObject\"\n        ],\n        \"Resource\": \"arn:aws:s3:::<S3 bucket\
  \ name>/*\",\n        \"Condition\": {\n            \"StringEquals\": {\n      \
  \          \"AWS:SourceArn\": \"arn:aws:cloudfront::<AWS account ID>:distribution/<CloudFront\
  \ distribution ID>\"\n            }\n        }\n    }\n}\n```\n\n虽然确保用户通过 CloudFront\
  \ 分发访问你的内容可以增强安全性，但你也希望保护最终用户与内容之间的网络流量。下一节讨论传输加密，以保护使用 Amazon CloudFront 时内容的连接性。这涉及在最终用户与\
  \ CloudFront 分发之间配置 HTTPS，并强制 CloudFront 与源之间的 HTTPS 连接，无论是自定义源还是 Amazon S3 源。\n\
  \n## 在用户与 Amazon CloudFront 之间配置 HTTPS\n\n为确保最终用户与通过 CloudFront 访问的内容之间的流量在传输过程中得到加密，你可以使用\
  \ HTTPS。你可以同时使用 HTTPS 进行最终用户与 CloudFront 分发点之间的通信以及 CloudFront 与源之间的通信。\n\n图 9.6\
  \ 描述了此通信的高级概述：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_361_0.png)\n\n图 9.6：通过\
  \ CloudFront 分发建立到你的内容的 HTTPS 连接\n\n以下是在前述图中描绘的流量流程中的关键步骤：\n\n1. 最终用户尝试与 CloudFront\
  \ 建立 HTTPS 连接，这会导致 SSL/TLS 协商。\n2. 建立后，最终用户提交加密请求。\n3. 如果发生缓存命中，即请求的 content 存在于缓存中，则将其返回给最终用户，后者然后解密内容。\n\
  4. 如果发生缓存未命中，CloudFront 将连接到源并执行 SSL/TLS 协商。\n5. CloudFront 然后将加密请求转发到源。\n6. 源解密请求并处理消息。然后它加密响应并发送给\
  \ CloudFront。\n7. CloudFront 解密响应并重新加密，确保将其副本存储在缓存中并转发给最终用户。\n8. 最终用户然后解密响应。\n\n\
  在配置 HTTPS 连接时，你可以为最终用户与 CloudFront 分发之间的连接以及从 CloudFront 分发到源的连接配置 HTTPS。以下部分概述了这两个配置组件。\n\
  \n## 配置最终用户与 CloudFront 分发之间的 HTTPS 通信\n\n这涉及配置缓存行为以要求最终用户/查看者与分发之间的通信使用 HTTPS。你也可以将此通信配置为同时允许\
  \ HTTP 和 HTTPS，从而允许你通过 HTTP 提供某些内容但强制其他内容仅通过 HTTPS。\n\n在这里，你有两个配置选项：\n\n- **使用默认域名：**\
  \ 如果你使用提供的分发域名，例如 `x12121212ebcdef9.cloudfront.net`，你必须将查看器协议策略配置为 **Redirect HTTP\
  \ to HTTPS** 或 **HTTPS Only** 设置。HTTP GET 和 HEAD 请求将使用前一个选项重定向到 HTTPS 请求。POST、PUT、DELETE、OPTIONS\
  \ 或 PATCH 请求仅在你使用 HTTP 1.1 或更高版本时重定向到 HTTPS。\n- **使用自定义域名：** 如果你使用自定义域名，你将需要使用 SSL/TLS\
  \ 证书，你可以使用 **AWS 证书管理器（ACM）** 配置，或购买第三方证书并将其导入 ACM。\n\n除了在最终用户与 CloudFront 分发之间配置\
  \ HTTPS 外，你还可以配置 CloudFront 分发与其源之间的 HTTPS。这可以是自定义源或 Amazon S3 源。\n\n\n\n\n## 配置\
  \ CloudFront 与自定义源之间的 HTTPS 流量\n\n自定义源可以是 Elastic Load Balancer、EC2 实例或其他源。配置要求您将源的\
  \ **Origin Protocol Policy（源协议策略）** 设置更改为 **HTTPS Only（仅 HTTPS）** 或 **Match Viewer（匹配查看者）**。在使用\
  \ Match Viewer 时，通信取决于终端用户/查看者使用的协议。例如，如果终端用户使用 HTTPS 请求内容，CloudFront 在向源发出的请求中将使用\
  \ HTTPS。\n\n此外，您需要将 **Secure Sockets Layer (SSL)（安全套接字层）**/**Transport Layer Security\
  \ (TLS)（传输层安全协议）** 证书安装到您的自定义源上。\n\n## 配置 CloudFront 与 Amazon S3 源之间的 HTTPS 流量\n\
  \n对于 Amazon S3，如果您将存储桶配置为静态网站，则只能使用 HTTP 协议在 CloudFront 和 S3 存储桶之间进行通信。请注意，在此配置中，**HTTPS**\
  \ 和 **Match Viewer** 选项是灰色的，如以下截图所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_363_0.png)\n\
  \n图 9.7：配置 CloudFront 分配用于 Amazon S3 源\n\n如果您使用标准 API 端点配置 Amazon S3 存储桶（未配置静态网站托管），则可以通过\
  \ HTTPS 提供内容。在这种情况下，CloudFront 将使用 **Match Value（匹配值）** 设置将请求转发到 S3，从而确保查看者使用的协议与转发到源的协议相同。为了确保流量通过\
  \ HTTPS 发送，您必须将 Viewer Protocol Policy（查看者协议策略）设置为 **Redirect HTTP to HTTPS（将 HTTP\
  \ 重定向到 HTTPS）** 或 **HTTPS Only。**\n\n接下来，您将了解另一种称为 **field-level encryption（字段级加密）**\
  \ 的加密解决方案。\n\n## *字段级加密*\n\nCloudFront 的字段级加密通过在提交到 CloudFront 的 HTTP 表单中启用字段级加密来增加一层安全性。它在将\
  \ POST 数据转发到源之前使用特定的加密密钥对其进行加密，确保敏感信息（如信用卡详情）得到安全传输。\n\n在下一节中，您将学习如何使用同一分配从不同的源和服务提供不同类型的\
  \ 内容。这可以帮助组织构建包含不同内容类型的复杂解决方案。\n\n## 多个源和源组\n\nCloudFront 允许您在同一分配中配置多个源。这对于从不同位置或服务提供不同类型的\
  \ 内容非常有用。例如，静态内容可以从 S3 存储桶提供，而动态内容可以从 EC2 实例或 Elastic Load Balancer 提供。\n\n源组允许您为分配设置多个源。您可以定义从\
  \ Amazon S3 存储桶提供静态内容，以及从处理由一组 EC2 实例处理的后台应用程序的应用负载均衡器提供动态内容。\n\n此外，您还可以配置故障转移功能。例如，您可以创建一个包含主源和次要源的源组。如果主源失败（变得不可用），CloudFront\
  \ 将自动切换到组中的次要源。这为您的应用程序提供了高可用性和容错能力。这可能适用于多种用例，例如主站点宕机或因延迟导致的超时问题。\n\n考虑一个电子商务网站，该网站有一个存储产品图片的\
  \ S3 存储桶（主源），并配置了一个从 EC2 实例提供图片的次要源。如果 S3 服务出现故障，CloudFront 将自动将请求路由到 EC2 实例，确保用户仍可查看产品图片。\n\
  \n监控您的 CloudFront 分配是一项关键的操作任务，您必须执行此操作以确保应用程序的可靠性。下一节将介绍 Amazon CloudFront 的日志记录功能。\n\
  \n## 实时日志\n\nCloudFront 提供实时日志，使您能够查看发送到您分配的请求。日志可以交付到 Amazon Kinesis Data Streams，在那里您可以实时分析和可视化数据。此功能允许您快速响应查看者流量的变化，排查问题，并提高内容交付的性能和安全性。\n\
  \n在使用这些功能时，请考虑它们与您用例的兼容性以及对价格的影响。例如，实时日志可能会生成大量数据，可能需要额外的处理和存储，从而可能产生额外成本。字段级加密提供增强的安全性，但它还需要谨慎的密钥管理，并可能增加应用程序逻辑的复杂性。源组提高了可用性和容错能力，这对于维持高质量的用户体验至关重要。\n\
  \n通过结合使用 CloudFront、S3 和 Route 53，该架构确保了一种健壮、安全且高效的方式，通过 CDN 的优势向终端用户提供静态内容。\n\n\
  在探索了 Amazon CloudFront 如何构建强大的 CDN 之后，下一节将讨论使用 Lambda@Edge 服务增强这些网络，您可以在其中执行无服务器函数来定制和优化内容交付。\n\
  \n## 将 Lambda@Edge 服务集成到 Amazon CloudFront\n\n**Lambda@Edge** 是 AWS 中的一项功能，允许您响应\
  \ CloudFront 事件运行无服务器函数。它通过在 AWS 全球各位置执行函数，将计算能力拉近用户，从而降低延迟并提高动态 Web 应用程序的性能。以下部分概述了它如何增强\
  \ Amazon CloudFront 的功能。\n\n## 边缘自定义\n\n通过 **Lambda@Edge**，您可以执行用于自定义通过 CloudFront\
  \ 提供的内容的函数。您可以运行修改 HTTP 响应的代码，基于设备、位置或语言自定义用户体验，甚至实现特定的安全协议。*图 9.8* 展示了一个示例函数：\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_366_0.png)\n\nLambda@Edge 函数是无服务器的，因此您无需管理服务器、配置计算资源或扩展它们。由于\
  \ AWS 处理基础设施，这使得扩展和维护变得容易。\n\n您通过 CloudFront 事件触发 Lambda@Edge 函数，例如当发出查看者请求或 CloudFront\
  \ 从源服务器接收到响应时。这允许在网络边缘进行实时的内容修改和决策。Lambda@Edge 减少了请求返回源服务器的需求，从而降低延迟并提高内容交付速度。\n\
  \n## 简化的开发和部署\n\nLambda@Edge 与 AWS CloudFormation 和 AWS **Serverless Application\
  \ Model (SAM)（无服务器应用程序模型）** 无缝集成，简化了无服务器应用程序的创建、部署和管理。您可以在标准的 AWS Lambda 环境中开发和测试您的\
  \ Lambda 函数，并将其与 CloudFront 分配关联，如下图所示。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_367_0.png)\n\
  \n图 9.9：使用 Lambda@Edge 的架构\n\n此处展示的 Lambda@Edge 用例涉及用户通过 CloudFront 发出请求。如果需要执行函数来修改请求或生成响应，则会触发\
  \ Lambda@Edge。请求也可以先通过应用负载均衡器路由，然后由 AWS 云中的 Lambda 函数处理。响应随后交付回给用户，可能会在经过另一个 Lambda@Edge\
  \ 函数修改后交付。\n\n此设置通常用于向全球受众提供低延迟内容的用例，并且需要在最接近最终用户的边缘进行动态内容生成或实时处理。Lambda@Edge 函数可用于各种用途，如网站自定义、安全和隐私控制、智能路由以及图像转换。由于计算发生在比源服务器更接近用户的位置，这有助于降低延迟，而源服务器在地理位置上可能距离用户较远。\n\
  \n下一节介绍 AWS 的 DNS 服务 Amazon Route 53。\n\n## 使用 Amazon Route 53 为应用程序部署自定义域名\n\n\
  在云计算和 Web 应用程序中，如 Amazon Route 53 等 DNS 服务的作用至关重要。它不仅仅是将域名链接到 IP 地址；它是编排网络流量的交响乐，确保持久、快速、可靠地访问托管在\
  \ AWS 上的应用程序。Route 53 提供了一系列功能，远超典型的 DNS 服务，使其成为 AWS 架构师工具箱中不可或缺的工具。\n\n\n\n\n\n\
  ## DNS 路由\n\n从核心来看，Route 53 对于将人类可读的域名（例如 `www.example.com`）翻译成计算机用于连接的 IP 地址至关重要。Amazon\
  \ Route 53 使用全球权威 DNS 服务器网络响应 DNS 查询，通过将每个查询路由到最近的 DNS 服务器来降低延迟。这种方法确保运行在 AWS 上的终端用户应用程序具有高可用性和可达性。\n\
  \n要有效使用 Route 53，您必须创建托管区。这是一个包含有关如何为域名（例如 `example.com`）及其子域名（例如 `www.example.com`、`shop.example.com`\
  \ 等）路由流量的信息的容器。有两种类型的托管区，将在以下小节中讨论。\n\n### 公共托管区\n\n**公共托管区** 是您在希望域名可通过互联网访问时使用的。当您创建公共托管区时，Amazon\
  \ Route 53 会将您在该区域中创建的 DNS 记录发布到其全球 DNS 服务器。这允许互联网上的任何用户找到您的域名并连接到它。\n\n### 私有托管区\n\
  \n**私有托管区** 在一个或多个 **Amazon 虚拟私有云（VPCs）** 内路由流量。这种类型的区域无法从互联网访问。它对于管理内部网络资源的 DNS\
  \ 非常有用。例如，您可能在 AWS 基础设施内有一个只能由同一 VPC 内的其他服务或用户访问的内部应用程序。使用私有托管区，您可以创建只能在该 VPC 内解析的\
  \ DNS 记录。\n\n私有托管区中的记录可以有效地指向任何 IP 地址，而不仅仅是 AWS 资源的地址。这种效率使您能够为内部资源使用私有 DNS 名称，从而更轻松地在\
  \ AWS 环境中管理网络管理与资源访问。\n\n您还可以将私有托管区与同一或不同 AWS 区域中的多个 VPC 关联。这种设置对于复杂网络场景非常有益，例如在开发、测试和生产环境中创建一致的\
  \ DNS 命名空间。\n\n总之，公共托管区适用于需要在互联网上可访问的域名，而私有托管区用于需要在一个或多个私有网络（VPCs）内解析的域名。两种托管区都可以通过\
  \ Route 53 控制台或 API 管理，并且可以包含各种 DNS 记录，例如地址记录（A）、IPv6 地址记录（AAAA）、规范名称记录（CNAME）、邮件交换记录（MX）、指针记录（PTR）等。\n\
  \n下一节将更深入地探讨 Route 53 服务的应用。\n\n## Amazon Route 53 实践应用\n\n考虑一个实际场景：您正在 AWS 上部署一个全球电子商务平台。该平台将拥有用户，您需要确保其始终可用、安全且性能最佳。Route\
  \ 53 在此场景中可以发挥重要作用，如图 9.10 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_369_0.png)\n\
  \n图 9.10：电子商务应用架构\n\n在该架构图的上下文中，Route 53 将是用户请求的入口点，它随后将请求路由到 Amazon CloudFront\
  \ 分发以获取边缘缓存内容，或路由到相应可用区中的 Elastic Load Balancer。Elastic Load Balancer 然后将在 VPC 内的多个目标（例如\
  \ EC2 实例、容器和 IP 地址）之间分配传入的应用流量。\n\nElastic Load Balancer 会自动根据传入的应用流量进行调整，将其分配到一个或多个可用区中的多个目标，从而降低了单个资源过载并可能导致服务中断的风险。\n\
  \n此外，Route 53 与 AWS 服务（如 CloudFront 和 Elastic Load Balancer）的集成允许实现无缝的数据流，这对于保持运营弹性并提供流畅的用户体验至关重要。通过利用\
  \ AWS 的全球网络基础设施，Route 53 有助于确保电子商务应用程序无论用户位于何处或系统承受多少需求，都保持可访问和响应。下一节将更深入地探讨使用 Route\
  \ 53 进行流量管理。\n\n## 使用 Amazon Route 53 管理全球流量\n\nAmazon Route 53 凭借其强大的功能集，在管理此全球流量中发挥着关键作用，确保用户请求被智能路由到最合适的端点。为了管理应用程序的流量流，您可以使用\
  \ Route 53 配置以下关键路由策略：\n\n- **基于延迟的路由：** 这允许您将流量路由到为终端用户提供最低延迟的区域。Route 53 会自动对\
  \ DNS 查询做出响应，提供响应最快的 AWS 区域的 IP 地址。这非常适合用户体验取决于响应时间的全球服务。\n- **地理位置路由：** Route 53\
  \ 根据用户的地理位置路由流量。此功能对于提供本地化内容、遵守法律要求或在不同区域之间平衡流量非常有用。\n- **地理邻近路由（带流量流）：** 地理邻近路由让您能够根据资源地理位置路由流量，并可选择将流量从一个位置的资源转移到另一个位置的资源。使用偏差值，您可以调整发送到资源的地理区域大小。\n\
  - **加权路由：** 这允许您为不同资源分配权重并指定路由到每个资源的流量比例。它对于 A/B 测试和逐步将流量从一个端点转移到另一个端点特别有用。\n- **故障转移路由：**\
  \ 对于需要高可用性的应用程序，可以配置故障转移路由以在主站点失败时将流量路由到次要站点。这对于灾难恢复策略至关重要。\n\n在下一节中，您将继续进行我们客户\
  \ Todo Plus Limited 的项目练习。您现在已达到可以整合 CloudFront 分发点以通过安全连接使应用程序可通过互联网访问的阶段。\n\n\
