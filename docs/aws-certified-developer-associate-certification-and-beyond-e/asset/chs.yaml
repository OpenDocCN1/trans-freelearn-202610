  \n\n\n\n## 步骤 2：配置操作\n在此步骤中，在“警报状态触发器”下选择**警报中**。\n\n单击**创建新主题**。\n\n在**创建新主题**下提供一个描述性名称...例如，你可以提供一个名称，如\
  \ `TodoPlus-Billing-Alarm`。\n\n提供一个你希望接收警报的电子邮件地址，然后按照以下截图单击**创建主题**：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_63_0.png)\n\
  \n图 1.24 – 创建通知主题并定义电子邮件端点\n\n滚动到屏幕底部，单击**下一步**。\n\n## 步骤 3：添加名称和描述\n在此步骤中，你将定义警报名称和可选描述。\n\
  \n单击**下一步**。\n\n## 步骤 4：预览并创建\n在此步骤中，你将检查设置，然后点击屏幕底部的**创建警报**按钮。\n\n9. 虽然你现在已经创建了警报，但在你验证对通知主题的订阅之前，你将无法收到电子邮件警报。为此，你必须登录在前面的步骤中指定的电子邮件账户并确认订阅。\n\
  \n在下一节中，我们将提供本章的总结。\n\n# 总结\n\n本章讨论了多账户架构的重要性，探讨了设置和管理多个 AWS 账户的广泛用例。它属于 *AWS 认证开发人员助理考试*中的*领域\
  \ 2：安全*，特别关注任务声明*为应用程序和 AWS 服务实现身份验证和/或授权*。具体来说，你了解到在不同的 AWS 账户中托管不同的工作负载甚至不同的环境，对于确保更高水平的安全性和减少一个环境中的事故影响另一个环境中的工作负载至关重要。通过多个\
  \ AWS 账户，你可以分离各个应用程序，甚至可以为其开发生命周期设立单独的账户。\n\n通过多个 AWS 账户，你还可以将内部应用程序和工作负载与面向客户的应用程序和工作负载分开，进一步增强安全性。在本章中，你学习了如何使用\
  \ AWS Organizations 管理 AWS 账户。你学习了如何应用服务控制策略来防止成员账户使用特定服务、资源和区域。AWS 组织中的管理账户拥有最高权限，你甚至可以防止成员账户的管理员离开组织。\n\
  \n尽管 AWS Organizations 提供了为成员账户构建护栏的能力，但谁或什么可以使用这些被允许的服务并进行 API 调用，仍然需要通过 AWS IAM\
  \ 或定义基于资源的策略来定义。我们将在下一章对 IAM 服务进行深入研究。\n\n# 进一步阅读\n\n以下是必读资源，帮助你了解在为你的企业和客户设计多账户架构时可以在现实世界中使用的方案：\n\
  \n- *使用多个账户组织你的 AWS 环境*：`https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/organizing-your-aws-environment.html`\n\
  - *服务控制策略示例*：`https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples.html`\n\
  \n# 考试准备练习 – 章节复习题\n\n除了扎实理解关键概念外，在时间压力下快速思考的能力也是帮助你在认证考试中脱颖而出的技能。这就是为什么在学习之旅的早期就锻炼这些技能至关重要。\n\
  \n章节复习题旨在随着你学习的每一章逐步提高你的应试技能，同时复习你对本章关键概念的理解。你可以在每章末尾找到这些题目。\n\n> **如何获取这些资料**\n\
  > 要了解如何访问这些资源，请前往标题为*第 17 章，访问在线资源*的章节。\n\n要打开本章的章节复习题，请执行以下步骤：\n\n1. 单击链接 – `https://packt.link/DVAC02_CH01`。\n\
  \   或者，你可以扫描以下**二维码**（*图 1.25*）：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_65_0.png)\n\
  \n图 1.25 – 为已登录用户打开章节复习题的二维码\n\n2. 登录后，你将看到一个类似于图 1.26 所示的页面：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_66_0.png)\n\
  \n图 1.26 – 第 1 章的章节复习题\n\n3. 准备好后，开始以下练习，多次重新尝试测验。\n\n# 考试准备练习\n\n对于前三次尝试，不要担心时间限制。\n\
  \n## 尝试 1\n\n第一次，目标至少达到 40%。查看你做错的答案，并重新阅读本章中的相关部分，以弥补学习差距。\n\n## 尝试 2\n\n第二次，目标至少达到\
  \ 60%。查看你做错的答案，并重新阅读本章中的相关部分，以弥补任何剩余的学习差距。\n\n## 尝试 3\n\n第三次，目标至少达到 75%。一旦你得分达到\
  \ 75% 或以上，你就可以开始练习时间掌控。\n\n> **提示**\n> 你可能需要超过**三次**尝试才能达到 75%。这没关系。只需复习本章中的相关部分，直到你达到目标。\n\
  \n## 练习时间掌控\n\n**目标**：你的目标是在尽可能快速回答这些问题的同时保持相同的分数。以下是你接下来的尝试应该是什么样子的示例：\n\n| 尝试次数\
