  \ 分发，你将在下一步实现。\n\n## 项目任务 9.4 – 创建 CloudFront 分发\n\n在此任务中，你将创建一个 CloudFront 分发，它将用作你的网站和应用程序的入口点。Amazon\
  \ CloudFront 将通过 AWS 全球分布的边缘位置和代理服务器网络，以高速网络分发你的静态和动态内容，这些服务器缓存内容并降低延迟：\n\n- 1.\
  \ 确保你已登录到你的 AWS 开发账户并在 N. Virginia 区域工作。\n- 2. 使用管理控制台页面顶部的搜索栏搜索并导航到 Amazon S3 网页控制台。\n\
