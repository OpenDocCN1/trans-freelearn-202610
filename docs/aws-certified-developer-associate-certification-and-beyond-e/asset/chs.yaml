  \ 60%。查看您答错的题目，并再次阅读章节中的相关部分以弥补剩余的学习差距。\n\n### 尝试 3\n\n第三次，目标至少达到 75%。一旦您得分达到 75%\
  \ 或以上，就可以开始练习答题速度。\n\n> 提示\n> 您可能需要超过**三次**尝试才能达到 75%。这没关系。只需回顾章节中的相关部分，直到您达到目标。\n\
  \n### 提高答题速度\n\n**目标**：您的目标是在尽可能快地回答这些问题的同时保持分数不变。以下是一个示例，展示您接下来的尝试应该是什么样子：\n\n\
