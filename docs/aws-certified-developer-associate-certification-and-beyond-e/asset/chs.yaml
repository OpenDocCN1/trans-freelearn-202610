  \ RDS 数据库。\n\n## 项目任务 10.2 – 创建安全组\n\n在这个项目任务中，你将创建两个安全组，这些安全组是托管应用程序的 EC2 实例向后端数据库发送流量所必需的，这些数据库你将很快部署。Amazon\
  \ Elastic Beanstalk 还将置备一组自己的安全组：一个允许来自互联网到 Application Load Balancers 的流量，另一个安全组将关联到它部署的\
  \ EC2 实例，启用 Application Load Balancer 将传入的 HTTP 请求分发到这些实例。\n\n如下面图表所示，最终配置意味着你的\
  \ EC2 实例将附加两个安全组，一个用于端口 `80`（HTTP）的入站流量，另一个用于启用这些实例向你的 Amazon RDS 数据库发送数据库请求：\n\n\
  ![](img/34ff9b5b5a734dae3450ab701e223c73_419_0.png)\n\n图 10.12：安全组配置\n\n虽然 Elastic\
  \ Beanstalk 将为 Application Load Balancer 和它部署的 EC2 实例创建安全组，但你必须还配置另外两个安全组 – 一个用于\
  \ EC2 实例，另一个用于你即将部署的 RDS 数据库。\n\n+   1. 确保你仍然登录到 AWS 开发账户并位于伦敦区域。\n+   2. 如有必要，导航到\
  \ VPC 仪表板。\n+   3. 从左侧菜单中，点击 Security 部分下的 Security groups。\n+   4. 在右侧窗格中，点击 Create\
  \ security group 按钮。\n+   5. 为安全组提供一个名称，例如 App-Security-Group。\n+   6. 提供你选择的适当描述。\n\
  +   7. 确保从 VPC 下拉列表中选择了正确的 VPC，在这种情况下为 Todo-List-EB-VPC，除非你为你的 VPC 选择了其他名称。\n+ \
  \  8. 滚动到页面底部，点击 Tags – optional 部分中的 Add new tag。创建一个新标签，将 Key 设置为 Name，将 Value\
  \ – optional 设置为 App-Security-Group。这将确保安全组被标记且易于识别。\n+   9. 点击 Create security\
  \ group 按钮。安全组现在将被创建。你在配置 Elastic Beanstalk 服务和定义 EC2 实例配置时将引用此组。请注意，你未为此安全组创建入站规则。这是完全没问题的，因为当你配置\
  \ Elastic Beanstalk 时，该服务将为你的 EC2 实例置备另一个安全组，以从 Application Load Balancer 接受端口 80（HTTP）的入站流量。记住，一个\
  \ EC2 实例可以关联多个安全组。\n+   10. 你现在将为 RDS 数据库配置安全组。从左侧菜单中，再次点击 Security groups。在右侧窗格中，点击\
  \ Create security group 按钮。\n+   11. 为你的安全组提供一个合适的名称，例如 Data-Security-Group，以及适当的描述。\n\
  \n\n\n\n12. 确保从VPC下拉列表中选择了正确的VPC。\n13. 您必须按如下方式配置入站规则设置：\n14. 单击“添加规则”，并从下拉列表中将“类型”设置为“MYSQL/Aurora”。接下来，对于“来源”，确保选择了“自定义”，然后从“来源”下拉列表中选择您刚才创建的“App-Security-Group”，如下面的屏幕截图所示。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_420_0.png)\n\n图10.13：安全组配置\n\n15. 请注意，您正在配置此安全组，以允许来自与App-Security-Group关联的任何实例在端口3306（MYSQL/AURORA）上的入站流量，该流量将流向Elastic\
  \ Beanstalk部署的EC2实例。\n\nI. 继续向下滚动，在“标签”部分单击“添加新标签”。\nII. 接下来，创建一个新标签，将“键”设置为Name，“值\
  \ - 可选”设置为Data-Security-Group。这将确保安全组带有标签且易于识别。\nIII. 单击“创建安全组”按钮。\nIV. 您应该会收到一条消息，提示安全组已成功创建。\n\
  \n还需要向数据安全组添加一条入站规则。回想一下，在第6章“使用AWS关系型和非关系型（NoSQL）数据库管理多个数据集”中的项目任务6.2先决条件——配置VPC为Secrets\
  \ Manager做准备中，您必须为数据库安全组添加一条额外的入站规则。之所以需要这条额外规则，是因为您将配置AWS Secrets Manager，以定期自动轮换RDS数据库凭据，从而增强安全性。Secrets\
  \ Manager将在您的VPC中、与数据库实例相同的子网内部署一个Lambda函数来完成此任务。因此，需要一条安全组规则来确保该Lambda函数也能向数据库发送请求。实现此目标的最快方法是确保安全组允许来自自身的端口3306（MYSQL/AURORA）入站流量。\n\
  \nV. 在VPC控制台左侧菜单的“安全”部分，单击“安全组”。在右侧窗格中，选中Data-Security-Group对应的复选框。\nVI. 在底部窗格中，单击**入站规则**。\n\
  VII. 单击**编辑入站规则**。\nVIII. 在**编辑入站规则**页面上，单击**添加规则**。\nIX. 从*类型*下拉列表中选择**MySQL/Aurora**。\n\
  X. 确保**来源**设置为**自定义**，并在搜索框中选择`Data-Security-Group`，如下面的屏幕截图所示。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_421_0.png)\n\
  \nXI. 单击**保存规则**。\n\n既然您已配置了所需的安全组，就可以继续进行下一个项目任务，该任务涉及创建数据库子网组并部署MySQL RDS数据库实例。\n\
  \n## 项目任务10.3 – 创建数据库子网组并启动RDS数据库\n\n在此项目任务中，您将部署一个MySQL RDS数据库实例来存储待办事项。首先，您必须配置数据库子网组。该组用于标识将用于RDS数据库实例的子网。\n\
  \n1. 确保您仍以IAM用户“Alice”的身份登录AWS开发账户，并且位于伦敦区域。\n2. 从顶部搜索栏中搜索并导航到Amazon RDS管理控制台。\n\
  3. 从左侧菜单中，单击**子网组**。\n4. 在右侧窗格中，单击**创建数据库子网组**按钮。\n5. 为您的子网组提供一个名称，例如`Todo-RDS-Subnet-Group`。\n\
  6. 提供适当的描述。\n7. 从**选择VPC**下拉列表中，选择您在*项目任务10.1*中配置的VPC。\n8. 在**添加子网**部分，从**可用区**下拉列表中选择`eu-west-2a`和`eu-west-2b`可用区。\n\
  \n9. 在**子网**下拉列表中，确保选择了您为数据库创建的子网。您可以将子网ID与VPC管理控制台进行交叉对照，因为此控制台页面不显示您为子网标记的名称。但是，如果您正确执行了上述步骤，您的数据库子网应配置为`10.5.20.0/24`和`10.5.21.0/24`\
  \ CIDR块，如下面的屏幕截图所示，因此它们很容易识别。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_422_0.png)\n\
  \n图10.15：选择用于创建子网组的数据库子网\n\n10. 单击页面底部的**创建**按钮。\n11. 您的Todo-RDS子网组现在应该已成功创建。接下来，您将部署MySQL\
  \ RDS数据库。\n12. 在Amazon RDS控制台的左侧菜单中，单击**数据库**。\n13. 在右侧窗格中，单击**创建数据库**按钮。\n14. 您将看到**创建数据库**配置网页。确保在**选择数据库创建方式**部分选择**标准创建**。\n\
  15. 在**引擎**选项中，选择**MySQL**。\n16. 在**模板**部分，选择**免费套餐**。\n17. 继续向下滚动，在**设置**部分，将**数据库实例标识符**设置为`tododb`之类的名称。\n\
  18. 在**凭据设置**部分，确保**主用户名**设置为`admin`。\n\n19. 对于**凭据管理**，选择**自行管理**，如下面的屏幕截图所示。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_423_0.png)\n\n图10.16：Amazon RDS凭据管理\n\
  \n20. 目前，您将使用一组自行管理的凭据来配置数据库。稍后，您将配置AWS Secrets Manager来管理凭据。\n21. 为您的数据库提供密码。记下此密码以备后用。然后，在**确认主密码**文本框中输入相同的密码。\n\
  22. 再向下滚动一点，进入**存储**部分。在这里，确保**分配的存储空间**设置为**20GiB**。\n23. 展开**存储自动扩展**子部分，并取消选中**启用存储自动扩展**复选框。\n\
  24. 再向下滚动一点，进入**连接**部分。确保在**计算资源**下选择了**不连接到EC2计算资源**。\n25. 从**虚拟私有云（VPC）**下拉列表中，选择您在*项目任务10.1*中创建的VPC。\n\
  26. 继续向下滚动，确认已选择正确的数据库子网组，该组应为您在此项目任务前面创建的子网组。\n27. 对于**公开访问**，选择**否**。\n28. 在VPC安全组（防火墙）部分，确保选择了“选择现有”，并从“现有VPC安全组”下拉列表中选择您在项目任务10.2中为数据库创建的安全组，应为Data-Security-Group。同时，确保从列表中取消选择默认安全组，如下面的屏幕截图所示：\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_424_0.png)\n\n图10.17：RDS数据库的VPC安全组（防火墙）配置\n\
  \n29. 从“可用区”下拉列表中选择eu-west-2a可用区。\n30. 继续向下滚动，确保在“数据库身份验证”部分选择了“密码身份验证”。\n31. 向下滚动并展开“其他配置”部分。将“初始数据库名称”设置为tododb。\n\
  32. 在“备份”下，选中“启用自动备份”旁边的复选框，并将“备份保留期”设置为1天。\n33. 将所有其余设置保留为默认值，然后滚动到页面底部。单击“创建数据库”按钮。您的MySQL数据库现在将进行预配置。这可能需要几分钟才能完成。完成后，您应该会看到数据库现在可用，如下面的屏幕截图所示：\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_425_0.png)\n\n在下一个项目任务中，您将在AWS Secrets\
  \ Manager中配置一个密钥来管理RDS数据库凭据。\n\n## 项目任务10.4 – 在AWS Secrets Manager中配置RDS密钥\n\n在此项目任务中，您将在AWS\
  \ Secrets Manager中为MySQL数据库创建一个数据库凭据密钥，然后配置自动轮换以增强数据库的凭据安全性。\n\n1. 确保您仍以IAM用户“Alice”的身份登录AWS开发账户，并且位于伦敦区域。\n\
  2. 从AWS管理控制台顶部的搜索栏中搜索并导航到**Secrets Manager**。\n3. 从左侧菜单中，单击**密钥**。\n4. 在右侧窗格中，单击**存储新密钥**。\n\
  5. 在**密钥类型**部分，选择**Amazon RDS数据库的凭据**选项。\n6. 提供您在*项目任务10.3*中创建的数据库的当前用户名和密码。\n\n\
  \n\n\n7. 在**数据库**部分，按照以下截图选择您创建的 MySQL 数据库，例如 `tododb`：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_426_0.png)\n\
  \n图 10.19：在 AWS Secrets Manager 中为 MySQL 数据库配置密钥\n\n8. 点击页面底部的 **Next**。\n\n9. 在\
  \ **Configure secret** 页面，为您的密钥提供一个名称，例如 `tododbsecret`。\n\n10. 提供一个可选的描述（由您决定），然后点击\
  \ **Next**。\n\n11. 在 **Configure rotation – optional** 部分，启用 **Automatic rotation**\
  \ 切换开关。\n\n12. 将 **Time unit** 设置为 **Days**，并将 **Days** 设置为 7。\n\n13. 在 **Rotation\
  \ function** 部分，确保已选择 **Create a rotation function**，然后为您的 Lambda 轮换函数提供一个名称。请注意，AWS\
  \ Secrets Manager 会在您选择的名称前添加 `SecretsManager` 作为前缀，参见以下截图：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_427_0.png)\n\
  \n图 10.20：配置密钥轮换并创建轮换函数\n\n14. 对于 **Rotation strategy**，确保已选择 **Single user**。点击\
  \ **Next**。\n\n15. 查看配置，然后点击页面底部的 **Store** 按钮。\n\n您现在已在 AWS Secrets Manager 中创建了一个名为\
  \ `tododbsecret` 的密钥。Lambda 轮换函数的创建需要几分钟时间，由 AWS CloudFormation 完成。Secrets Manager\
  \ 现在正在管理您的数据库凭据，每隔七天轮换一次，以确保定期生成新的凭据集以增强安全性。\n\n在下一节中，您将创建一个具有必要策略的 IAM 角色，以允许 Elastic\
  \ Beanstalk 服务与您的环境（例如 EC2 实例）进行交互，并查询 Secrets Manager 以动态检索凭据数据并将其存储在环境变量中。\n\n\
  ## 项目任务 10.5 – 为您的 Elastic Beanstalk 应用配置 IAM 角色\n\n在此项目任务中，您需要创建一个 IAM 角色，该角色需包含以下由\
  \ AWS 管理的策略：\n\n- `AWSElasticBeanstalkWebTier`\n- `AWSElasticBeanstalkMulticontainerDocker`\n\
  - `AWSElasticBeanstalkWorkerTier`\n\n此外，您还需要一个内联策略，该策略授予访问 AWS Secrets Manager 中密钥的权限。然后，该角色将被配置为由\
  \ Elastic Beanstalk 服务部署的 EC2 实例假定（assumed）。\n\n1. 在 AWS 管理控制台中，搜索并导航至 **AWS Identity\
  \ and Access Management (IAM)** 服务。\n2. 从左侧菜单中，点击 **Roles**。\n3. 在右侧窗格中，点击 **Create\
  \ role** 按钮。\n4. 对于 **Trusted entity type**，选择 **AWS service**。\n5. 接下来，从 **Service\
  \ or use case** 下拉列表中选择 **EC2**，然后选择 **EC2** 作为 **Use case**。点击 **Next**。\n6. 在\
  \ **Add Permissions** 页面，搜索并选择前面提到的三个 AWS Elastic Beanstalk 策略，然后点击 **Next**。\n\
  7. 为角色提供一个名称，例如 `Todo-EB-SM-IAM-Role`。\n8. 滚动到页面底部并点击 **Create role**。\n9. 您的角色将被创建。接下来，在可用的角色列表中的搜索框中搜索该角色，参见以下截图（*图\
  \ 10.21*）：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_429_0.png)\n\n图 10.21：用于\
  \ Elastic Beanstalk 和 Secrets Manager 的 IAM 角色\n\n10. 点击该角色以选中它。\n11. 在 Permissions\
  \ 选项卡中，点击 Add permissions 下拉列表并选择 Create inline policy。\n12. 在 Specify permissions\
  \ 页面中，在 Service 部分的下拉列表中选择 **Secrets Manager**（从 Choose a service 下拉列表中选择）。\n13.\
  \ 展开 **Read** 访问级别选项，并选择 **GetSecretValue** 操作。\n14. 点击 Resources 下方的 **Add ARNs**\
  \ 链接。在出现的对话框中，您需要提供您在 Secrets Manager 中创建的密钥的 Amazon Resource Name (ARN)。要获取 ARN，请执行以下操作：\n\
  \    1. 在单独的浏览器标签页中打开 Secrets Manager。\n    2. 从左侧菜单中点击 **Secrets**，然后在右侧窗格中点击您创建的密钥。\n\
  \    3. 从 Secret details 部分中，将密钥的 ARN 复制到您的剪贴板。\n    4. 在您的 IAM 浏览器标签页对话框中的 **Specify\
  \ ARN(s)** 部分，将您从 Secrets Manager 控制台中复制的 ARN 粘贴到 Resource ARN 旁边的文本框中。对话框中的其他字段将自动填充。\n\
  \    5. 点击 **Add ARNs**。\n\n15. 您将被带回 Specify permissions 页面，该页面应与图 10.22 类似：\n\n\
  ![](img/34ff9b5b5a734dae3450ab701e223c73_430_0.png)\n\n图 10.22：配置内联策略以访问 AWS Secrets\
  \ Manager 中的密钥\n\n16. 滚动到页面底部并点击 **Next**。\n17. 提供一个策略名称，例如 `Todo-EB-Secret-IAM-Policy`。\n\
  18. 点击页面底部的 **Create policy**。\n19. 您的内联策略已创建并添加到您刚才定义的 IAM 角色中。\n\n既然 IAM 角色和策略现已定义，您可以继续创建您的\
  \ Elastic Beanstalk 应用和环境。\n\n## 项目任务 10.6 – 创建 Elastic Beanstalk 应用\n\n在此项目任务中，您将创建一个\
  \ Elastic Beanstalk 应用和环境。然后，您将从 GitHub 仓库下载的应用代码进行上传，并将该应用程序部署到一组 EC2 实例中。Amazon\
  \ Elastic Beanstalk 将在自动扩展组中预置 EC2 实例，部署应用程序负载均衡器，并通过您定义的环境变量配置到后端数据库的连接。\n\n1.\
  \ 使用 AWS 管理控制台顶部的搜索栏搜索并导航至 Elastic Beanstalk 服务。\n2. 确保您仍处于 London 区域。\n3. 从左侧菜单中点击\
  \ **Applications**，然后在右侧窗格中点击 **Create application** 按钮。\n4. 为您的应用程序提供一个名称，例如 `Todo-List-EB-App`。\n\
  5. 提供您的应用程序描述。\n6. 点击 **Create** 按钮。\n7. 在 **Application Todo-List-EB-App environments**\
  \ 页面上，点击右侧窗格中的 **Create new environment** 按钮。\n8. 您将被带到 Configure environment 页面。确保从\
  \ Environment tier 中选择了 **Web server environment**。\n9. 您将注意到，**Environment name**\
  \ 已预填为您的应用程序名称后跟 `-env`。例如，`Todo-List-EB-App-env`。您可以保持原样。\n10. 向下滚动到页面的 **Platform**\
  \ 部分。从 **Platform** 下拉列表中选择 **PHP**。接受默认的平台分支，应该是运行在 64 位 Amazon Linux 2023 上的 PHP\
  \ 8.3。\n11. 在 **Application code** 部分中，点击 **Upload your code** 单选按钮。\n12. 提供一个版本标签，例如\
  \ `v1`。\n13. 在 Source code origin 下选择 **Local file**。最大大小 500 MB。\n14. 点击 **Choose\
  \ file** 按钮，导航到您保存从我们的 GitHub 仓库下载的应用程序源代码的位置。选择要上传的 `.zip` 文件，参见以下截图：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_432_0.png)\n\
  \n图 10.23：将您的源代码上传到 Elastic Beanstalk\n\n15. 在 **Presets** 下，选择 **High availability**。\n\
  16. 点击 **Next**。\n17. 在 **Configure service access** 部分中，在 Service role 下选择 **Create\
  \ and use new service role** 选项。\n18. 从 **EC2 instance profile** 下拉列表中选择您在项目任务 10.5\
  \ 中创建的 IAM 角色。点击 **Next**。\n19. 在 **Set up networking, databases, and tags** 部分中，从\
  \ **VPC** 下拉列表中选择您在项目任务 10.1 中创建的 VPC。\n20. 接下来，选择您希望部署 EC2 实例的可用区（AZs）和子网。这些将是应用子网（app\
  \ subnets）。具体来说，这些将是 `AppSubnet01` 和 `AppSubnet02`，参见以下截图：\n\n### 实例子网\n\n筛选实例子网\n\
