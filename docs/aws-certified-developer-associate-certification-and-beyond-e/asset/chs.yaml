- "## 使用AWS CI/CD工具掌握DevOps\n\n近年来，DevOps已成为软件开发中不可或缺的一部分。它通过促进开发团队与运维团队之间的协作与沟通，使团队能够更快、更高效地交付高质量软件。DevOps的一个关键组成部分是**持续集成和持续部署/持续交付（CI/CD）**，它帮助团队自动化软件开发流程。\n\
  \nAWS提供了一系列CI/CD工具，包括AWS CodeCommit、AWS CodeBuild、AWS CodePipeline和AWS CodeDeploy。这些工具帮助团队自动化软件开发工作流，涵盖从编写代码、构建应用程序，到测试、部署以及向最终用户交付软件的各个环节。\n\
  \n本章探讨如何利用AWS CI/CD工具开启DevOps之旅。你将学习CI/CD的基础知识，以及它如何融入DevOps体系。本章将详细讲解每种CI/CD工具，探讨其特性、优势，以及它们如何帮助团队简化软件开发流程。\n\
  \n无论你是DevOps新手还是经验丰富的从业者，本章都将全面介绍如何开始使用AWS CI/CD工具，以及它们如何帮助你更快、更高效地交付高质量软件。学完本章后，你将扎实掌握如何使用AWS\
  \ CI/CD工具在云端构建、测试、部署和管理应用程序。\n\nDevOps和CI/CD属于*AWS认证开发者助理（AWS Certified Developer\
  \ Associate）考试大纲中的领域3：部署*的范畴。你必须理解版本控制、如何准备部署工件，以及AWS CodePipeline和CI/CD工作流中的手动与自动审批。\n\
  \n在虚构公司TodoPlus Limited的需求基础上，你将获得实施DevOps原则的实践经验，使用AWS的CI/CD工具套件改进**Todo List**任务管理应用程序的开发与部署。例如，每当有变更提交到AWS\
  \ CodeCommit中的应用程序代码库时，它就会自动触发AWS CodeBuild编译代码并运行测试。如果测试通过，AWS CodeDeploy可以自动将变更部署到生产环境。AWS\
  \ CodePipeline可以编排整个工作流，确保每次变更都能自动、高效、可靠地交付给用户。\n\n实施这些CI/CD实践可以显著提高其应用程序开发和部署流程的速度、效率与可靠性。接下来的章节将帮助你更深入地理解这些原则和工具，并展示TodoPlus如何将其整合到运营中。\n\
  \n### 什么是DevOps？\n\nDevOps是一场彻底改变了软件开发行业的文化与技术运动。它代表着软件开发从传统的孤岛式模式——开发与运维团队分属不同部门——向更加集成和敏捷的模式转变。DevOps文化强调开发团队与运维团队之间的协作与沟通，从而实现更快、更高效的软件交付。\n\
  \n图12.1中的图示说明了DevOps生命周期：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_500_0.png)\n\
  \n图12.1 – DevOps生命周期\n\n在讨论DevOps时，理解这一图示至关重要。DevOps生命周期通常以循环形式描绘，以强调该过程的持续性。以下是对循环中每个阶段的详细说明：\n\
  \n- **规划：** 这是确定项目行动方案的阶段，涉及需求收集、进度安排，以及在开始实际开发之前的所有准备工作。\n- **创建：** 软件开发在此阶段进行。编写代码以创建新功能、修复缺陷或更新软件。\n\
  - **验证：** 软件开发完成后需要进行测试。此阶段包括质量保证测试、单元测试、集成测试及其他测试，以验证代码是否符合质量标准。\n- **打包：** 此阶段涉及打包代码以便部署，通常包括对软件进行版本管理，并将其准备为可部署的格式，如容器或虚拟机镜像。\n\
  - **发布：** 此阶段是软件准备就绪以待部署的阶段。最终检查确保软件已准备妥当并获得发布审批。持续交付和持续部署实践即属于此阶段。\n- **配置：** 在生产环境中对软件进行配置，包括搭建必要的基础设施，并可通过基础设施即代码实践实现自动化。\n\
  - **监控：** 软件部署后需要对其进行监控，以确保其按预期运行。此阶段包括使用日志记录、性能指标和实时监控来快速发现并解决问题。\n\n圆环的两半，即Dev和Ops，分别代表循环中的开发与运维部分，凸显了**软件开发（Dev）**与**IT运维（Ops）**之间的集成与协作。这种集成是DevOps的核心概念，旨在缩短开发生命周期，并以高软件质量实现持续交付。循环图表明，在监控之后，我们利用洞察和反馈来规划新的变更，循环由此周而复始——因此才有了“持续集成”和“持续交付/持续部署”这两个术语。\n\
  \n### 通过CI/CD实施DevOps\n\n要在组织中实施DevOps文化，你必须建立持续集成和持续交付/持续部署的原则。\n\n\n\n\n\n## 持续集成\n\
  \nDevOps 实践是指将由开发者进行的软件代码更改合并到中央存储库的发布分支中。应鼓励开发者定期提交代码。由于较小的代码提交在解决错误和冲突时更直接，这样可以确保更少的集成问题。代码更改在推送到中央存储库之前，还必须进行单元测试。\n\
  \n存储库的示例包括 AWS CodeCommit、GitHub 或 Bitbucket。一旦开发者提交了应用程序代码的更改，并将其推送到中央存储库中的某个分支，就应该启动自动化的构建和测试过程。这个过程会生成一个或多个二进制文件及相关工件。根据图\
  \ 12.2 中的示意图，任何必要的单元测试也可以在此阶段纳入：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_502_0.png)\n\
  \n图 12.2 – 使用 AWS CodeCommit 和 CodeBuild 进行 CI\n\n作为 CI 工作流的一部分，开发者将获得关于测试通过或失败的反馈。这使开发者能够修复问题和错误，并更快地部署代码。\n\
  \n## 持续交付\n\n这是 CI 的后续环节。假设应用程序代码成功构建并通过所有测试。在这种情况下，理想情况下下一步是将代码部署到暂存环境（通常是生产环境的副本）。根据图\
  \ 12.3 中的示意图，可以执行额外的测试，例如集成测试和负载测试：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_503_0.png)\n\
  \n图 12.3 – 使用 AWS CodeDeploy 将构建部署到暂存环境\n\nCodeDeploy 阶段还可能包括使用基础设施即代码（IaC）对必要基础设施进行动态设置和配置。您也可以使用\
  \ Elastic Beanstalk 来预置环境，或将其部署到 EC2、Lambda、ECS 等计算资源，甚至部署到本地服务器。\n\n根据您的方法，您也可以在此阶段集成一个手动审批流程，以确保应用程序按预期运行后再部署到生产环境，如图\
  \ 12.4 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_503_1.png)\n\n图 12.4 – 使用\
  \ AWS CodeDeploy 将构建部署到生产环境。\n\n一旦您遵循了审批流程，就可以发布您的生产应用程序了。\n\n## 持续部署\n\n有了持续交付，您的更改不一定会立即部署到生产环境。您可能希望集成一个决策流程，以确保所部署的输出已完全获得授权。从本质上讲，这个阶段是推出任何更改的业务决策，由于所有测试和审计都已完成，因此不应造成任何中断。\n\
  \n持续交付确保软件在手动批准后即可发布，而持续部署是 CI/CD 流水线的最后阶段。它可能包括将软件版本完全自动化地部署到生产环境的过程，如图 12.5 中的示意图所示：\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_504_0.png)\n\n图 12.5 – 持续部署到生产环境并正式发布\n\
  \n下一节将教您更多关于使用核心 AWS DevOps 工具来构建 CI/CD 流水线的知识。\n\n## DevOps 团队使用的工具和流程\n\nDevOps\
  \ 团队工具箱的核心是 CI/CD 工具，例如 AWS CodeCommit、CodeBuild、CodeDeploy 和 CodePipeline，它们可以实现软件交付流程的自动化。AWS\
  \ CodeBuild 是一项编译源代码、运行测试并生成可立即部署的软件包的服务。CodeDeploy 可将应用程序自动部署到各种 AWS 服务，例如 Amazon\
  \ EC2、AWS Fargate 和 AWS Lambda。CodePipeline 是一项持续交付服务，可实现发布流水线的自动化，从而快速可靠地更新应用程序。\n\
  \n容器服务（如 Amazon Elastic Container Service（ECS）和 Amazon Elastic Kubernetes Service（EKS））也至关重要，它们使用\
  \ Docker 和 Kubernetes 为应用程序部署提供可扩展且安全的环境。它们支持微服务架构（DevOps 理念的一个关键原则），使团队能够构建、部署和管理由小型、独立、松散耦合的服务组成的应用程序。\n\
  \n此外，团队通常利用 IaC 工具（如 AWS CloudFormation、AWS Cloud Development Kit（CDK）或 Terraform）使用代码来定义和预置\
  \ AWS 基础设施。这种做法允许建立和维护可重复、受版本控制和自动化的环境。\n\nDevOps 团队旨在创造一种文化与环境，使软件的构建、测试和发布能够快速、频繁且可靠地进行。他们利用\
  \ AWS 工具来提高效率、增强安全性并保持可扩展性。\n\n接下来，您将了解 AWS 提供的核心 DevOps 工具。\n\n## AWS CodeCommit\n\
  \nAWS CodeCommit 是一个版本控制系统，使开发人员能够就共享的应用程序资产（如文档、源代码和二进制文件）进行协作。它遵循 Git 的原则来创建和管理源代码。\n\
  \n> **注意**\n> \n> Git 是一个分布式**版本控制系统（VCS）**，用于跟踪软件开发过程中源代码的更改。它被设计用于快速高效地处理从小型到超大型的项目。Linus\
  \ Torvalds 于 2005 年创建了 Git，用于 Linux 内核的开发，此后它已成为世界上使用最广泛的 VCS 之一。\n\nAWS CodeCommit\
  \ 提供了多项与 Git 一致的好处。用户可以轻松创建和管理存储库及分支，将存储库克隆到本地开发环境，根据需要进行更改，然后将其推送回 CodeCommit 存储库。\n\
  \nAWS CodeCommit 提供了多种特性和好处，包括与其他 DevOps 工具（如 AWS CodeBuild 和 AWS CodeDeploy）的紧密集成。这使您能够轻松定义和构建软件发布流水线。\n\
  \nAWS CodeCommit 的主要好处包括以下内容：\n\n- 能够与其他开发人员协作：每位开发人员都可以执行拉取请求，处理其他开发人员的代码，并在准备好后将更改合并回主分支。\n\
  - 安全存储您的代码：使用 Amazon KMS 进行静态加密和传输加密。\n- 扩展版本控制项目：可以处理包含大量文件或分支、大文件大小以及庞大修订历史的存储库。\n\
  - 访问控制：支持使用 IAM 角色授予访问权限，并促进跨账户访问能力。\n- 使用开发人员熟悉的 Git 工具，使用与 Git 相同的命令，例如 `git clone`、`git\
  \ add`、`git pull` 和 `git push` 等。\n\n## AWS CodeBuild\n\nAWS CodeBuild 是一项完全托管的构建服务，让您无需费力即可构建、测试和部署软件。借助\
  \ AWS CodeBuild，您可以以安全、可扩展且经济高效的方式创建、测试和部署代码。\n\n首先，您必须设置 AWS CodeBuild 项目。构建项目详细说明了如何运行构建、从哪里获取源代码、使用哪个构建环境、运行哪些构建命令以及将构建输出存储在哪里。\n\
  \nAWS CodeBuild 可以自动检测代码更改并启动构建过程。每次更改代码时，AWS CodeBuild 都会自动启动构建过程来编译、测试和打包代码。构建过程涉及多个步骤，包括编译代码、运行单元测试以及创建可部署的软件包。\n\
  \n要向 CodeBuild 提供一组用于执行构建的构建命令和设置，您必须在名为 `buildspec.yml` 的文件中提供一些信息。\n\n### 关于 buildspec.yml\
  \ 的更多信息\n\n该文件必须以 YAML 格式编写，并存储在源代码目录的根目录中。但是，您可以覆盖文件名及其位置。您可以在同一存储库中为不同的构建重命名该文件，例如，一个用于暂存环境，另一个用于生产环境。如果您重命名该文件或希望将其存储在其他位置，则在创建或更新项目时，必须指示\
  \ AWS CodeBuild 指定相对于内置环境变量 `CODEBUILD_SRC_DIR` 值的文件路径。\n\n在 `buildspec.yml` 文件中，您可以将环境变量定义为标准明文变量，或者从\
  \ AWS Systems Manager Parameter Store 或 AWS Secrets Manager 动态访问变量。\n\n此外，您可以定义构建的各个阶段，包括以下内容：\n\
  \n- `Install` - 安装构建所需的依赖项\n- `Pre_build` - 在构建之前执行的命令\n- `Build` - 用于构建应用程序的命令\n\
  - `Post_build` - 任何构建后操作，例如创建 `.zip` 文件输出\n\n图 12.6 中的截图是 `buildspec.yml` 文件的一个示例，您将使用它来更新\
  \ Todo List 前端网站应用程序：\n\n\n```yaml\nversion: 0.2\nphases:\n  build:\n    commands:\n\
  \      - npm i && npm run build\n      # Please change the s3 bucket URI\n     \
  \ - aws s3 cp --recursive dist/ s3://todo-plus-frontend/\n      # Please change\
  \ the distribution id\n      - aws cloudfront create-invalidation --distribution-id\
  \ E2A4WHGXZQDJJ8 --paths \"/*\"\n```\n\n图 12.6 – buildspec.yml 文件示例\n\n你会注意到，buildspec.yml\
  \ 文件中并非所有阶段都需要包含。在图 12.6 的示例文件中，这些命令指示 AWS CodeBuild 使用可用源代码运行构建任务，将构建产物复制到托管应用程序前端组件的\
  \ Amazon S3 存储桶，并使现有 CloudFront 分发失效，以确保新应用程序上线并可通过 CloudFront 访问。\n\n如果构建过程成功，AWS\
  \ CodeBuild 会将你的代码部署到目标环境。此过程确保你的代码以一致且可靠的方式部署。\n\n在整个构建和部署过程中，你可以按照图 12.7 在 AWS\
  \ CodeBuild 控制台中监控进度并查看构建日志。这样你可以随时了解代码的状态，并快速处理构建过程中出现的任何问题。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_507_0.png)\n\
  \n图 12.7 – AWS CodeBuild 的界面\n\n- `CodeDeployDefault.HalfAtATime`：AWS CodeDeploy\
  \ 一次将应用程序修订版部署到一半的实例。如果实例数为奇数，则部署将覆盖一半的实例，小数部分向下取整。例如，如果你有九个实例，它将首先部署到四个实例。如果应用程序修订版已部署到至少一半的实例（小数部分向上取整），则认为部署成功。这意味着当你的实例组中有九个实例时，至少要有五个实例成功部署，部署才算成功。\n\
  \n- `CodeDeployDefault.OneAtATime`：AWS CodeDeploy 一次只将应用程序修订版部署到一个实例。在这里，只有当应用程序成功部署到所有实例时，部署才算成功。但有一个例外：如果你将应用程序部署到一组实例，那么只要除最后一个实例外的所有实例都成功部署，部署仍被视为成功。如果任何实例（除最后一个实例外）部署失败，则整个部署失败。对于包含九个实例的部署组，如果前八个实例部署成功，但最后一个实例部署失败，则整个部署仍被视为成功。\n\
  \n请注意，如果你未指定部署配置选项，CodeDeploy 将使用 `CodeDeployDefault.OneAtATime`。就地部署的缺点是，你的实例组中至少有一个实例将处于离线状态（如\
  \ `OneAtATime` 配置的情况）。\n\n## 蓝/绿部署\n\n蓝/绿部署的优势在于，在环境就绪之前保持现有环境不变，然后将流量转移到新环境。你可以使用蓝/绿部署类型将应用程序部署到\
  \ EC2 实例、Lambda 函数或 ECS 容器。\n\n对于 **EC2 计算平台**部署，实例在替换环境中预置，并安装应用程序修订版。如果需要，可以设置可选的等待时间，以便进行测试和验证。然后，替换环境中的实例将注册到负载均衡器，负载均衡器将流量从旧环境转移到新环境。部署选项采用\
  \ `CodeDeployDefault.OneAtATime` 方法。流量也一次路由到一个替换实例。如果流量路由到所有替换实例，则部署成功。只要第一次重新路由失败，即视为部署失败。但同样，如果部署中最后一个实例失败，仍然视为成功。\n\
  \n对于 **ECS 计算平台**部署，AWS CodeDeploy 会创建一个新的任务集，并在同一 ECS 服务中将流量从当前任务集转移到更新后的替换任务集。对于\
  \ **AWS Lambda**，AWS CodeDeploy 会部署新版本的 Lambda 函数，然后将流量从旧版本转移到新版本。\n\n在将蓝/绿部署用于\
  \ AWS Lambda 或 Amazon ECS 部署时，你必须指定如何将流量从应用程序的旧版本转移到新版本。以下部署配置可用于定义流量转移方式：\n\n-\
  \ **Canary（金丝雀）**：使用金丝雀部署时，流量分两次转移。你可以选择预定义的金丝雀选项，该选项指定第一次转移的流量百分比。然后，在指定的时间间隔后，转移剩余流量。\n\
  - **Linear（线性）**：使用此选项时，流量以相等的增量转移，每个增量之间定义相等的分钟时间间隔。这确保了流量从旧资源逐渐转移到新版本。\n- **All-at-once（一次性全部转移）**：所有流量在一次转移中从\
  \ Lambda 函数或 ECS 任务的旧版本转移到新版本。\n\n下面的截图（*图 12.8*）展示了可用于 Amazon ECS 部署的预定义部署配置。选中的是\
  \ `CodeDeployDefault.ECSAllAtOnce`，它一次性将所有流量转移到更新后的 Amazon ECS 容器。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_511_0.png)\n\
  \n图 12.8 — Amazon ECS/CodeDeploy 部署配置选项\n\n除了选择部署选项和定义所需的部署配置外，你还需要向 AWS CodeDeploy\
  \ 提供如何管理实际部署过程的详细信息。这通过一个名为 **Application-Specific (appspec) 文件**的配置文件完成。\n\n##\
  \ 应用程序特定文件\n\nappspec 文件是一个 YAML 或 JSON 文件（EC2/本地实例仅使用 YAML 格式版本），通过一系列**生命周期事件挂钩**提供有关执行部署的配置信息。每个挂钩表示部署过程中的一个事件。\n\
  \n根据你部署到的计算平台，appspec 文件结构会有所不同。对于 EC2/本地部署，你会看到一个高层级结构，如图 12.9 所示：\n\n```yaml\n\
  1  version: 0.0\n2  os: operating-system-name\n3  files:\n4    source-destination-files-mappings\n\
  5  permissions:\n6    permissions-specifications\n7  hooks:\n8    deployment-lifecycle-event-mappings\n\
  ```\n\n图 12.9 – 适用于 EC2/本地计算平台的 appspec 文件格式\n\n对于 EC2/本地计算平台，你有一个 files 部分，用于指定在安装过程中应复制并安装到实例上的文件名称。你还有一个\
  \ permissions 部分，详细说明应应用于被复制的文件和文件夹的特定权限。\n\n对于 ECS 和 Lambda 部署，结构略有不同，如下所示：\n\n\
  - 对于 Lambda，你有一个 resources 部分，用于定义要部署的 Lambda 函数的名称、别名、当前版本以及要将流量转移到的 Lambda 函数目标版本，如图\
  \ 12.10 所示：\n\n```yaml\n1 resources:\n2   - name-of-function-to-deploy:\n3     type:\
  \ \"AWS::Lambda::Function\"\n4     properties:\n5       name: name-of-lambda-function-to-deploy\n\
  6       alias: alias-of-lambda-function-to-deploy\n7       currentversion: version-of-the-lambda-function-currently-points-to\n\
  8       targetversion: version-of-the-lambda-function-to-shift-traffic-to\n```\n\
  \n图 12.10 – Lambda appspec 文件示例\n\n- 对于 **ECS 部署**，`resources` 部分包含任务定义、容器和端口的详细信息，如图\
  \ 12.11 所示：\n\n```yaml\n1  Resources:\n2    - TargetService:\n3      Type: AWS::ECS::Service\n\
  4      Properties:\n5        TaskDefinition: \"task-definition-arn\"\n6        LoadBalancerInfo:\n\
  7          ContainerName: \"ecs-container-name\"\n8          ContainerPort: \"ecs-application-port\"\
  \n```\n\n图 12.11 – ECS appspec 文件示例\n\n生命周期事件挂钩使你能够定义部署期间执行的任务流程。同样，事件挂钩根据你部署到的计算平台而有所不同。图\
  \ 12.12 展示了 EC2/本地部署的主要事件挂钩：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_513_0.png)\n\
  \n```yaml\n1  version: 0.0\n2  os: linux\n3  files:\n4    - source: Config/config.txt\n\
  5      destination: /webapps/Config\n6    - source:\n7      destination: /webapps/myApp\n\
  8  hooks:\n9    BeforeInstall:\n10   - location: Scripts/UnzipResourceBundle.sh\n\
  11   - location: Scripts/UnzipDataBundle.sh\n12  AfterInstall:\n13   - location:\
  \ Scripts/RunResourceTests.sh\n14   timeout: 180\n15  ApplicationStart:\n16   -\
  \ location: Scripts/RunFunctionalTests.sh\n17   timeout: 3600\n18  ValidateService:\n\
  19   - location: Scripts/MonitorService.sh\n20   timeout: 3600\n21  runas: codedeployuser\n\
  ```\n\n示例 appspec.yml\n\n图 12.12 – appspec 生命周期事件挂钩示例\n\n\n\n此处列出了应用配置（appspec）生命周期中的部分事件钩子：\n\
  \n-   **ApplicationStop**：运行脚本以优雅地关闭应用程序，或者移除当前已安装的软件包并为新安装做准备。如果您之前已经部署过应用程序的修订版本，这一点尤为重要。\n\
  -   **DownloadBundle**：CodeDeploy 会将应用程序修订版本的文件复制到一个临时位置。\n-   **BeforeInstall**：执行任何预安装任务，例如创建当前应用程序修订版本的备份。\n\
  -   **Install**：执行实际安装，并将文件从临时位置复制到最终目标位置。\n-   **AfterInstall**：执行任何安装后配置，例如更改文件权限。\n\
  -   **ApplicationStart**：重启应用程序服务。\n-   **ValidateService**：这是最后一个部署生命周期，也是确保部署成功的关键组件。\n\
  \n理解这些步骤以及这些钩子的处理顺序至关重要。此外，请注意，如果缺少某个事件钩子，则不会对该事件执行任何操作。\n\n## AWS CodePipeline\n\
  \nAWS CodePipeline 是一个集成式的、完全托管的持续交付服务，旨在自动化您的发布流程。它通过与其他 AWS 服务（如 AWS CodeCommit、AWS\
  \ CodeBuild 和 AWS CodeDeploy）集成，使您可以快速构建、测试和部署应用程序。AWS CodePipeline 的核心理念是流水线（Pipeline）。每个流水线由多个阶段组成，代表发布流程中的不同步骤，例如构建代码、运行测试或部署到生产环境。\n\
  \n图 12.13 展示了涉及 AWS CodeCommit、AWS CodeBuild 和 AWS CodeDeploy 的 AWS CodePipeline\
  \ 中所有可用步骤的示意图：\n\nAWS CodePipeline 还提供了一套全面的工具和特性来管理您的发布流程。您可以监控流水线的状态，设置通知，并查看详细日志。与其他\
  \ AWS 服务（如 AWS CloudWatch 和 AWS SNS）集成可以为您提供对发布流程的额外控制和可见性。\n\n除了自动化，AWS CodePipeline\
  \ 还为管理您的发布流程提供了灵活且可扩展的解决方案。它可以快速适应发布流程的变化，其服务也能扩展以满足您不断增长的应用程序的需求。\n\n图 12.14 展示了一个\
  \ AWS CI/CD 流水线，但它主要关注部署过程，主要使用 AWS 服务来处理容器化应用程序。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_516_0.png)\n\
  \n以下是逐步说明：\n\n-   **开发人员**：开发人员向源代码提交变更。\n-   **AWS CodePipeline**：该服务编排由流水线描述的工作流。\n\
  -   **Amazon CodeCommit**：AWS CodeCommit 用作源代码控制服务，开发人员的代码存储在此处。\n-   **AWS CodeBuild**：AWS\
  \ CodeBuild 是编译源代码、运行测试并生成可部署的应用程序版本的服务。\n-   **弹性容器注册表 (ECR)**：构建过程完成后，生成的 Docker\
  \ 镜像（如果应用程序是容器化的）将存储在 ECR 中，ECR 是一个 Docker 容器注册表，方便开发人员存储、管理和部署 Docker 容器镜像。\n-\
  \   **暂存环境 ECS 操作**：在应用程序部署到生产环境之前，它会先使用 Amazon ECS 部署到暂存环境，ECS 是一个支持 Docker 容器的容器管理服务。\n\
  -   **手动审批**：这是工作流中的一个检查点，需要人工手动批准流水线的继续，通常是在验证暂存环境按预期运行之后。\n-   **简单通知服务 (SNS)**：AWS\
  \ SNS 是一个灵活、完全托管的发布/订阅消息和移动通知服务，用于协调向订阅端点和客户端传递消息。在此处，它用于通知相关人员审查并批准暂存环境中的变更。\n\
  -   **CodeDeploy ECS 蓝/绿操作**：一旦变更获得批准，将使用 AWS CodeDeploy 将应用程序部署到生产环境。具体来说，ECS 蓝/绿部署模式涉及流量切换，使得新版本（绿）在最小停机时间和风险的情况下与旧版本（蓝）并行部署。\n\
  -   **流水线通知**：这些可能是流水线各个阶段发送的通知，例如构建完成、等待手动审批或部署成功时。它们可以与各种通知渠道集成，如电子邮件、短信或聊天应用程序。\n\
  \n该图说明了一个自动化流水线，允许安全地部署应用程序。它确保代码自动构建和测试，并且变更在部署到生产环境之前会在暂存环境中进行审查，并使用蓝/绿部署策略实现最小停机时间。\n\
  \n总之，AWS CodePipeline 是一个通用的持续交付服务，为构建、测试和部署应用程序提供了一站式解决方案。其自动化功能、灵活性、可扩展性以及与其他\
  \ AWS 服务的集成使其成为管理发布流程的绝佳选择。\n\n## 在多账户环境中使用 AWS CodePipeline\n\nAWS CodePipeline\
  \ 是 AWS 提供的一项持续交付服务，用于自动化软件应用程序的构建、测试和部署。在多账户环境中，CodePipeline 可用于管理跨越多个 AWS 账户的交付流水线。\n\
  \n在多账户环境中使用 CodePipeline 的一个主要好处是，它允许组织将开发、测试和生产环境分离到不同的账户中。这有助于通过防止开发人员修改生产环境来确保安全和合规性，并降低不同环境之间交叉污染的风险。\n\
  \n该图表示了一个使用各种 AWS 服务阐述 CI/CD 流水线的 AWS 架构示意图。以下是各组件及其交互的分解：\n\n-   **用户和当地工作站**：\n\
  \  -   用户在当地工作站将代码提交到 Git 仓库。\n-   **DevOps AWS 账户**：\n  -   **CodeCommit 仓库**：这是托管仓库的\
  \ AWS 源代码控制服务（如 GitHub）。\n  -   **EventBridge**：此 AWS 服务用于构建事件驱动的应用程序。它可以检测 CodeCommit\
  \ 仓库中的更改并触发响应。\n  -   **用于跨账户访问的 IAM 角色**：这里的 IAM 角色用于授予一个账户中的 AWS 服务访问另一个账户中资源的权限。\n\
  \  -   **用于 CodePipeline 产物的密钥管理服务 (KMS) 密钥**：AWS KMS 用于创建和控制加密密钥。在此处，它用于保护 CodePipeline\
  \ 过程中生成的产物。\n-   **开发人员、暂存或生产 AWS 账户**：\n  -   **AWS CodePipeline**：该服务在您每次进行代码更改时自动执行发布流程的构建、测试和部署阶段。\n\
  \  -   **Amazon CodeCommit 阶段**：这是流水线中从 AWS CodeCommit 仓库获取源代码的阶段。\n  -   **AWS\
  \ CodeBuild 阶段**：在此阶段，AWS CodeBuild 编译源代码，运行测试，并生成准备部署的软件包。\n  -   **Amazon EventBridge**：与\
  \ DevOps 账户中一样，这里的 EventBridge 可能用于在特定事件上触发流水线或将事件传递给其他 AWS 服务。\n  -   **AWS CodePipeline\
  \ 服务角色**：一个允许 CodePipeline 代表用户与其他 AWS 服务交互的 IAM 角色。\n  -   **S3 存储桶上的产物存储**：Amazon\
  \ S3 用于存储构建和部署产物，这些产物是 CodeBuild 阶段的结果，用于后续阶段或部署。\n  -   **CodeBuild 服务角色**：一个允许\
  \ CodeBuild 访问 AWS 资源（例如从 CodeCommit 拉取源代码或将构建产物存储在 S3 存储桶中）的 IAM 角色。\n\n\n\n该过程通常遵循以下步骤：\n\
  \n1. 用户在其本地工作站将代码提交到 CodeCommit 存储库。\n2. DevOps AWS 账户中的 EventBridge 检测到更改并触发操作（通常会启动\
  \ CodePipeline 流水线）。\n3. CodePipeline 从 CodeCommit 存储库获取最新代码，并使用 CodeBuild 开始构建过程。\n\
  4. CodeBuild 编译代码、运行测试并生成构建产物，然后将其存储在 S3 存储桶中。\n5. 流水线随后可以将构建产物部署到开发、预发布或生产等各种环境。\n\
  \n这种架构实现了关注点分离。CI/CD 过程由 DevOps 账户管理，该账户与开发环境和生产环境分离。这确保了更好的安全性和访问控制，从而实现稳健的部署流程。\n\
  \n现在您已经了解了 AWS 平台上 CI/CD 工具的相关理论概念，接下来可以将其优势应用到我们的客户 TodoPlus Limited 中。TodoPlus\
  \ 经常需要发布更新和功能增强，甚至修复 bug。在接下来的项目任务中，我们将研究如何让 Todo List 应用程序借助前端网站元素和后端应用层（包含业务逻辑和\
  \ API）的后续修订版自动更新。具体来说，即将进行的修订更新涉及为应用程序添加一些额外功能的需求。\n\n客户一直在提供反馈，要求添加一些功能，例如在错误输入待办事项时提供删除按钮，以及在出现简单拼写错误时编辑现有任务。此外，当前版本的应用不允许按任务类型或状态进行筛选，而这些都是公司希望在下一迭代中推出的实用功能。\n\
  \n使用 CI/CD 流水线将帮助您实现此类更新的自动化流程。虽然具体项目任务并未涵盖 AWS 提供的所有 CI/CD 工具集，但这些任务有望让您在应用程序设计中融入\
  \ DevOps 流程，获得良好的动手实践机会。\n\n## 项目任务 – 为 Todo List 应用程序设计 CI/CD 流水线\n\n在接下来的项目练习中，您将设计并实现一个用于\
  \ Todo List 应用程序的 CI/CD 流水线。这将使您在管理应用程序生命周期时受益于 DevOps 原则和方法论。使用 CI/CD，您可以安全地存储并实现对应用程序源代码的版本控制。您可以确保对应用程序所做的更改和增强进行自动化构建和测试，快速部署\
  \ bug 修复，并解决应用程序问题，无论这些问题与用户体验还是性能相关。通过将 CI/CD 作为应用程序设计不可或缺的一部分，您可以确保快速响应市场变化，解决安全问题，提高客户满意度并降低成本。\n\
  \nTodo List 应用程序包含两个关键组件：前端用户界面和负责用户体验的后端组件。该应用程序旨在为最终用户提供直观且吸引人的体验。在接下来的项目任务中，您将构建两个\
  \ CI/CD 流水线（而不是一个），从而能够独立发布前端和后端层的更新代码。\n\n以下内容总结了应通过 CI/CD 流水线实现的更新后的应用程序功能：\n\n\
  - 前端网站 – 为最终用户体验提出的更改：\n  - 能够根据类别（任务类型）和状态筛选数据\n  - 每个条目都有 **编辑** 和 **删除** 按钮。最终用户很可能在任务描述中出现简单的拼写错误。**编辑**\
  \ 按钮能让用户解决此类问题。同样，如果条目是误创建的，最终用户也应该能够删除它。\n- 后端应用程序 – 为应用程序提出的更改：\n  - 提供用于编辑和删除待办事项的\
  \ API。\n\n*图 12.16* 展示了两个流水线的创建方式：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_522_0.png)\n\
  \n图 12.16 – Todo List 应用程序 CI/CD 架构\n\n根据架构图，以下是您将在接下来的项目任务中构建的高级组件：\n\n1. 为 Todo\
  \ List 应用程序前端代码创建一个 AWS CodeCommit 存储库。\n2. 为 Todo List 应用程序后端代码创建一个 AWS CodeCommit\
  \ 存储库。\n3. 从本地开发机器创建并上传 SSH 密钥以连接到您的存储库。这将使您能够将代码上传到存储库。\n4. 对于 CI/CD 流水线，您将在 AWS\
  \ CodeBuild 中创建构建项目。这将构建前端应用程序的新版本。\n5. 对于 CI/CD 流水线，您将使用 AWS CodePipeline 创建新流水线。\n\
  6. 然后，您将使用 AWS CodeBuild 为后端应用程序组件创建构建项目。\n7. 然后，您将为应用程序的后端组件配置新流水线。\n8. 作为流水线配置的一部分，您将部署提供程序定义为\
  \ Amazon ECS，并将其配置为流水线部署阶段的一部分。\n\n## 技术要求\n\n在接下来的项目任务中，您必须登录到您一直在其中架构和部署 Todo\
