  \n## Summary\n\n在本章中，您了解了 AWS 上的关系型和非关系型数据库。每个应用的核心都是数据；您不仅需要一种工具以高效且经济的方式存储数据，还需要能够扫描、查询并最终操作这些数据以从中提取关键信息。\n\
  \n根据应用需求，您可能需要部署传统的数据库引擎，如 MySQL 或 Oracle，或非关系型键值存储数据库，如 Amazon DynamoDB。此外，您的应用可能还需要内存缓存引擎，以帮助改善延迟并降低成本。无论您选择哪种数据库模型，了解数据库的基础知识以及它们应如何配置和部署，对于任何应用都至关重要。\n\
  \n到目前为止，您已了解 AWS 提供的核心基础设施服务，主要包括计算、网络、存储，以及本章中的数据库。这四个关键基础设施组件构成了任何多层应用架构的基础。在下一章中，您将研究如何使用这四项关键技术部署多层解决方案。您还将探索更多可用于确保应用解决方案具有高可用性和可扩展性的工具。\n\
  \n## Exam Readiness Drill – Chapter Review Questions\n\n除了对关键概念有扎实的理解外，在时间压力下快速思考的能力将帮助您顺利通过认证考试。这就是为什么在学习之旅早期就练习这些技能至关重要。\n\
