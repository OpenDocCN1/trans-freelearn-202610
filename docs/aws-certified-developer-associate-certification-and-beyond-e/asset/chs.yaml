  \ Amazon CloudWatch Logs 中以供进一步分析。\n\n流日志可以帮助开发人员执行多项监控和故障排除任务，例如：\n\n+   - 诊断限制性的安全组规则\n\
  \n+   - 监控和跟踪到达您的实例、容器和其他资源的流量\n\n+   - 排查问题并识别潜在的恶意攻击\n\n下一节将提供本章的总结。\n\n## 总结\n\
  \n本章探讨了 AWS 为您的 AWS 基础设施和资源提供的两个最强大的监控工具：Amazon CloudWatch 和 AWS CloudTrail。这些服务对于在\
  \ AWS 环境中保持运营效率、确保安全性和实现合规性至关重要。\n\nAmazon CloudWatch 是一个强大的监控平台，可提供对 AWS 资源和应用程序的全面可见性。它实时收集和跟踪指标、日志和事件数据，使管理员能够高效地监督\
  \ AWS 部署的运行状况。CloudWatch 支持从基本指标收集和自定义指标到高级日志分析和仪表盘可视化等一系列功能。这些功能有助于性能优化、实时事件响应和主动的系统可用性管理。\n\
  \nAWS CloudTrail 是对 CloudWatch 的补充，它提供了对 AWS 账户内所有操作的详细审计跟踪。该服务对于满足监管合规要求至关重要，因为它会记录每个\
  \ API 调用，包括 API 调用者的身份、调用时间和源 IP 地址。CloudTrail 通过识别可能表明安全威胁的异常活动来增强安全监控，并确保所有用户操作都可追究责任，从而有助于取证调查和合规性审计。\n\
  \n本章还介绍了 AWS X-Ray，该服务旨在帮助您分析和调试分布式应用程序及微服务架构。虽然强烈建议摆脱单体设计，但分布式应用程序也带来了自身的挑战。使用\
  \ X-Ray，您可以快速、直观地识别性能问题和瓶颈，使开发人员能够迅速找到问题的根本原因。\n\n## 考试准备练习 – 章节复习题\n\n除了对关键概念的扎实理解外，在时间压力下快速思考的能力也是帮助您在认证考试中取得优异成绩的一项技能。这就是为什么在学习旅程的早期就培养这些技能至关重要。\n\
