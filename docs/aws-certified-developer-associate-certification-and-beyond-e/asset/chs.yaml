  \n图 1.19 – 可用的SCP列表\n\n- 10. 点击选择 **DenyOrgLeave** 策略，然后从 **操作** 下拉菜单中点击 **附加策略**。\n\
  - 11. 接下来，点击 **Production** 和 **Development** 两个组织单元。\n- 12. 点击 **附加策略** 按钮。\n-\
  \ 13. 从左侧菜单中，点击 **账户**。\n- 14. 接下来，在右侧窗格中，展开 **Development** 组织单元。\n\n- 15. 点击 **Todo\
  \ Plus Development 账户**。这将带你进入成员账户详细信息页面。\n- 16. 在右侧窗格的下半部分，点击 **策略** 选项卡。你应该会看到\
  \ **FullAWSAccess** 和 **DenyOrgLeave** 策略均被列出。某些完全访问权限也从根账户继承。\n\n在本练习中，你配置了默认未启用的SCP，然后设置了一个新的SCP，以防止成员账户的管理员离开组织。在下一个练习中，你将在\
  \ **Todo Plus Development** 账户上测试此策略。\n\n## 项目任务 1.7 – 测试SCP\n\n要完成本练习，请登录 **Todo\
  \ Plus Development** AWS账户。由于你只知道该账户的电子邮件地址而不知道密码，你需要重置密码。你必须首先提供你的电子邮件地址并完成验证码挑战。接下来，按照根用户登录页面上的流程，点击\
  \ **忘记密码** 链接来重置密码：\n\n- 1. 密码重置电子邮件将发送到你之前设置 **Todo Plus Development** AWS账户时提供的地址。请务必使用邮件中的链接重置密码。重置密码后，你就可以登录该\
  \ AWS 账户。\n- 2. 搜索 `AWS Organizations` 并导航到其管理控制台页面。你将注意到此账户是 **Management** AWS\
  \ 组织的成员。\n- 3. 进一步向下滚动，点击 **离开此组织** 按钮。系统将提示你确认操作。点击 **离开组织** 按钮。\n- 4. 你应该会看到一条错误消息，内容是\
  \ **您没有权限访问此资源。**，如图 1.20 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_60_0.png)\n\
  \n图 1.20 – SCP防止DevAccount的根用户离开组织\n\n如你所见，即使是 **Todo Plus Development** 账户的根用户现在也无法离开组织。最终，此策略将确保只有管理账户的管理员才能控制成员账户的成员资格。\n\
  \n现在你已经配置了你的 AWS 账户并定义了某个 AWS 组织，你已准备好开始学习本指南其余部分中的项目任务。但在继续项目任务之前，强烈建议你创建一个账单告警，以便在练习中超过建议的\
