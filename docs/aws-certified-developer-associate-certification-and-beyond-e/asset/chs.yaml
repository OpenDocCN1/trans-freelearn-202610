  \ IAM 角色命名为 IAM-User-S3-AccessRole。”\n\n代码块如下：\n\n```\n{\n  \"Version\": \"2012-10-17\"\
  ,\n  \"Statement\": {\n    \"Effect\": \"Allow\",\n    \"Action\": \"sts:AssumeRole\"\
  ,\n    \"Resource\": \"arn:aws:iam::Developer-Account-ID:role/S3AccessRole\"\n \
