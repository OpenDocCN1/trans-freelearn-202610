  \n## 总结\n\n在本章中，您已经了解了如何在AWS云上部署高可用架构。高可用系统值得信赖，因为即使某些部件发生故障，它们也能持续运行。这些系统也很健壮，这意味着它们能够承受运行中的冲击而不损害其功能，并且在遇到挫折后能够快速、轻松地恢复。可用时间百分比是衡量可用性的标准指标。“几个九”通常被用作衡量极高可用性的指标。例如，“四个九”的正常运行时间表示系统在99.99%的时间内可用，每年停机时间不超过1小时。\n\
  \n负载均衡器提供了构建高可用系统的能力，而Auto Scaling是一项能够让您为应用程序设计弹性的服务。随着应用程序需求的增加，AWS Auto Scaling可以通过部署额外的EC2实例来快速应对负载。利用创新的扩缩策略，您可以配置同一服务在需求下降时终止不必要的实例，从而确保成本得到控制。\n\
  \n至此，您已经构建了应用程序的主要组件。负载均衡器将提供高可用性，Auto Scaling服务将确保弹性和可扩展性。下一章将介绍API Gateway服务，以及它如何允许您创建、管理和保护API，从而访问后端应用程序的数据、逻辑和功能。就我们的Todo\
  \ List应用程序而言，这些后端组件将实现与数据库的交互，该数据库将托管最终用户的待办事项列表项，并允许用户创建和更新其待办事项。\n\n## 考试准备练习\
