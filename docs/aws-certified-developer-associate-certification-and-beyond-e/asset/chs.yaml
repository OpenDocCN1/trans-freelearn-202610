  \ detail 部分。\n- 15. 在 IAM instance profile 下拉列表下，选择您在上一个任务中创建的 IAM 角色。\n- 16. 滚动到页面底部，然后点击\
  \ Launch instance。\n- 17. 您应该会收到确认实例已启动的成功消息。\n- 18. 从左侧菜单中点击 Instances。\n- 19.\
  \ 实例需要几分钟才能成功启动。请确保 Status check 部分确认两个检查均已通过，如图 5.14 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_199_0.png)\n\
  \n在右侧窗格中，通过点击 Name 实例旁边的复选框选择实例并点击 Connect 按钮。\n\n您有四种连接实例的方法。选择 Session Manager\
  \ 并点击 Connect 按钮。\n\n这将使您连接到 EC2 实例 shell 界面，如以下屏幕截图所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_199_1.png)\n\
  \n使用 Session Manager 连接时，您将使用 SSM-User 账户登录。通过键入 `sudo su` 命令并按 **Enter** 将您的用户更改为\
  \ root 用户。\n\n执行以下步骤以安装所需的软件包：\n\n通过键入 `yum update -y` 命令并按 **Enter** 更新操作系统。如果没有需要执行的更新，您将被通知。\n\
  \n键入 `curl -fsSL https://rpm.nodesource.com/setup_20.x -o nodesource_setup.sh` 并按\
  \ Enter。\n\n键入 `bash nodesource_setup.sh` 并按 **Enter**。\n\n键入 `yum install -y nodejs`\
  \ 并按 **Enter**。\n\n键入 `npm i -g pm2` 并按 **Enter**。\n\n您的 EC2 实例现在已拥有构建 AMI 所需的所有软件包。在下一个项目任务中，您将创建此\
  \ EC2 实例的 AMI。此 AMI 然后可用于部署您的 EC2 实例，这些实例将执行所有后端操作并托管您的 API。\n\n## 项目任务 5.3 – 创建自定义\
  \ AMI\n\n您现在将为当前 EC2 实例创建 AMI：\n\n- 1. 确保您已以 IAM 用户 Alice 的身份登录到开发账户。\n- 2. 像之前一样导航到\
  \ EC2 仪表板。\n- 3. 从左侧菜单中选择 Instances。\n- 4. 在右侧窗格中，点击 Todo AMI Image Instance 实例标签旁边的复选框，如图\
  \ 5.16 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_200_0.png)\n\n- 5. 您最好先关闭实例再制作映像。从\
  \ Instance state 下拉列表中选择 Stop instance。\n- 6. 系统会提示您确认停止实例。请继续点击 Stop。\n- 7. 实例关闭后，从\
  \ Actions 下拉列表中选择 Image and templates，然后选择 Create image，如图 5.17 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_200_1.png)\n\
  \n- 8. 您将看到 Create image 页面。在这里，您会注意到 EC2 实例已被列为您正在创建映像的对象。\n- 9. 为您的映像提供一个名称 –\
  \ 例如，todolist-worker-ami。\n\n\n\n\n\n10. 提供描述，然后点击屏幕底部的 **Create image**。\n11. 你会看到一条通知，表示\
  \ AMI 正在创建中。\n12. 从左侧菜单中，在 **Images** 下选择 **AMIs**。\n13. 在右侧窗格中，你会注意到 AMI 被创建，并在几分钟后处于\
  \ **Available** 状态，如 *Figure 5.18* 所示。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_201_0.png)\n\
  \nFigure 5.18 – Available AMIs\n\n14. 你将在后续章节中使用此 AMI 来启动你的 worker 实例。由于你不再需要此 EC2\
  \ 实例，可以终止该实例。点击左侧菜单中的 **Instances**，在右侧窗格中选择该实例。\n15. 接下来，从 **Instance state** 下拉菜单中选择\
  \ **Terminate instance**。\n16. 在出现的对话框中，点击 **Terminate** 按钮。你的实例现在将被终止。\n\n创建和管理\
  \ AMI 以满足你的计算需求可确保你能快速有效地部署新实例。此外，通过对 AMI 构建方式应用严格的配置控制，你可以确保符合企业政策和治理要求，并满足任何监管要求。\n\
  \n## Summary\n\n在本章中，你学习了如何创建和管理名为 Amazon Elastic Compute Cloud (EC2) 实例的虚拟服务器，以在云中运行应用程序和服务。你还了解了\
  \ Amazon machine images (AMIs)，它们是预配置的模板，可使启动 EC2 实例更快更简单。\n\n此外，你还学习了如何将 Elastic\
  \ Block Store (EBS) 存储附加到你的 EC2 实例，这提供了在可轻松附加和分离的虚拟硬盘上存储数据的能力。你还了解了 Amazon Elastic\
  \ File System (EFS)，这是一种完全托管且可扩展的文件存储服务，用于在云中创建和配置文件系统。AWS Certified Developer Associate\
  \ 考试将测试你对 EC2 服务核心概念以及 EBS 和 EFS 存储服务的知识。你还将被测试 AMI 的使用、用户数据和元数据以及安全功能。\n\n下一章将介绍\
  \ AWS 上的数据库服务，重点探讨可用的不同数据库平台，包括用于关系数据库的 Amazon Relational Database Service (RDS)\
  \ 和用于非关系数据库的 Amazon DynamoDB。\n\n2. 登录后，你会看到与 Figure 5.20 所示类似的页面：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_203_0.png)\n\
  \n3. 准备好后，开始以下练习测验，多次重做测验。\n\n## Exam Readiness Drill\n\n前三次尝试时，不必担心时间限制。\n\n##\
