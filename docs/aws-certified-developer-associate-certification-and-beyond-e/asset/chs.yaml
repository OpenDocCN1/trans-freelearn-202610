  \ **创建组织** 按钮。这将创建您的 AWS 组织，并将您的 AWS 账户配置为主要根管理账户，如 *图 1.14* 所示。然后，此账户可以托管其他成员 AWS\
  \ 账户，应用安全策略，并作为所有成员的 AWS 账户的中央计费账户。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_54_1.png)\n\
  \n图 1.14 – AWS 组织\n\n现在您已经创建了您的 AWS 组织，是时候配置一些 OU 了。这些 OU 使我们能够管理共享常见工作负载类型的多个账户，例如软件开发环境，如开发、测试和生产。\n\
