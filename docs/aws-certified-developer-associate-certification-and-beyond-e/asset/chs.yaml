  \ Amazon Elastic Beanstalk 部署的待办事项列表 Web 应用程序\n\n恭喜，你现在已成功使用 Amazon Elastic Beanstalk\
  \ 部署了你的多层应用程序堆栈。此 PaaS 可以配置你所需的基础架构，管理应用程序部署、版本更新和升级，并支持各种部署策略。\n\n# 摘要\n\nAWS Elastic\
  \ Beanstalk 是一种 PaaS 解决方案，旨在帮助你快速轻松地部署应用程序，而无需过多关注底层基础设施。AWS Elastic Beanstalk 可以设置和配置支持你的应用程序及其各种环境（阶段）所需的所有必要基础设施。你完全控制底层基础设施的构建方式，无论是部署为单个测试服务器，还是支持高可用性和扩展能力的多层架构。\n\
  \n该服务支持广泛的发展环境和编程语言，包括用于 Java 应用的 Apache Tomcat、用于 PHP 和 Python 的 Apache HTTPS Server，以及用于\
  \ .NET 应用的 Microsoft IIS 7.5、8.0 和 8.5。\n\nAWS Elastic Beanstalk 使用 Amazon CloudFormation\
  \ 来构建你的应用程序所需的底层基础设施。虽然你可以将标准配置项定义为架构的一部分，但也可以使用存储在名为 `.ebextensions` 文件夹中的 Elastic\
  \ Beanstalk 配置文件来进一步自定义环境中资源的预配方式。配置文件应使用 YAML 或 JSON 编写，扩展名为 `.config`，与应用源代码包放在一起并部署到你的\
  \ Elastic Beanstalk 环境中。你可以使用此文件进行各种配置更改和自定义 – 例如，你可以安装 Linux 实例上应用程序可能依赖的软件包。\n\
  \nElastic Beanstalk 的一个重要功能是通过各种部署选项管理应用程序的生命周期。这些选项包括一次性部署、滚动部署、带有附加批次的滚动部署、不可变部署、流量分割和蓝绿部署。\n\
  \n需要了解的另一个重要概念是，虽然你可以将后端数据库（如 Amazon RDS）作为整体 Elastic Beanstalk 配置和环境设置的一部分来整合，但你可能希望将数据库部署在配置之外，以确保其与应用程序生命周期分开。这种方法也有助于蓝绿部署能力。\n\
  \n最后，在本章中，你学习了如何使用 AWS Secrets Manager 存储和管理敏感数据（如数据库凭据和 API 密钥）来改善你的应用程序安全态势并保护你的数据库。你需要确保你的应用程序被设计为在运行时从\
  \ Secrets Manager 检索任何必要的数据，但这额外的设计努力将保护你的环境免受恶意攻击。\n\n在下一章中，我们将通过研究 DevOps 概念和原则来扩展我们对软件开发生命周期的知识。你将学习**持续集成和持续开发/部署**（CI/CD）工具以及\
  \ AWS 在管理应用程序开发、发布和更新过程中涉及的流程。DevOps 在帮助组织简化其应用程序开发、测试和部署生命周期方面发挥着基本作用，将其核心框架纳入你的应用程序设计和管理中是在敏捷环境中工作的基础。\n\
  \n# 备考演练 – 章节复习题\n\n除了对关键概念有扎实的理解外，在时间压力下快速思考的能力也是帮助你通过认证考试的技能。这就是为什么在学习初期磨练这些技能至关重要。\n\
