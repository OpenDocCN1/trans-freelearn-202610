  \ List 应用架构的前端和后端组件，见证一个完全功能的应用。\n\n## Summary\n\n本章探讨了 AWS 上的无服务器计算，重点关注 AWS Lambda\
  \ 和 API Gateway 等关键组件。其设计目的是传授实践技能和深入理解，使你能够在 AWS 平台上有效地构建和管理无服务器应用程序。\n\n本章首先概述了\
  \ AWS Lambda，介绍了该无服务器计算服务的 fundamentals。你学习了事件驱动架构以及 Lambda 函数如何由各种 AWS 服务触发。本节为理解无服务器计算范式和\
  \ AWS Lambda 的运营效率奠定了基础。\n\n超越基础知识后，本章深入探讨了更复杂的主题，例如环境变量、用于资源管理的标签，以及在 VPC 中运行 Lambda\
  \ 函数。这些高级知识使你能够优化 Lambda 函数的安全性、成本效率和更好的资源管理。\n\n重点随后转向 API Gateway。你被引导完成创建和管理\
  \ REST 和 HTTP API 的过程。本节对于理解如何安全高效地公开后端服务至关重要，涉及 API 路由、数据转换以及防止未经授权访问的安全 API 等主题。\n\
  \n## Exam Readiness Drill – Chapter Review Questions\n\n除了对关键概念的扎实理解外，在时间压力下快速思考的能力也是帮助你通过认证考试的技能。因此，在学习之旅早期就培养这些技能至关重要。\n\
