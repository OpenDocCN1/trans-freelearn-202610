- "## Building Application Solutions with High Availability, Elasticity, and Data\
  \ Security\n\n与托管网站或 Web 应用相关的一个最大挑战是确保其始终可供最终用户使用，并且能够处理业务所需处理的任何流量。您必须将应用架构设计为\
  \ **高可用** 且 **可扩展**。\n\n客户在讨论网站扩展计划时可能会使用“水平扩展”和“微服务”等术语，但他们可能并不完全了解如何开始扩展其网站。本章讨论各种扩展选项。例如，本地解决方案可以利用云，即使现有工作负载托管在传统数据中心，也可以扩展操作同时保持成本低廉。如果您的工作负载已在云中，您也可以使用预配置的解决方案。\n\
  \n本章将教您如何架构基于服务器的环境，使用 Amazon Elastic Load Balancers 将流量分发到您的应用。根据用例，您将学习配置哪种类型的负载均衡器，以及健康检查和监听器规则。此外，本章还介绍了自动水平扩展，旨在为您的应用提供弹性并使用\
  \ Amazon Auto Scaling 管理应用需求。\n\n本章还旨在帮助您为 AWS Certified Developer Associate 考试做准备。它涵盖与应用部署方法相关的概念，特别是根据\
  \ *Domain 2: Security, Task Statement 2: Implement encryption using AWS services*\
  \ 的数据安全概念。\n\n在我们的业务场景基础上，本章还将探讨 **TodoPlus Limited** 如何利用 AWS 云服务的强大功能，将其任务管理应用\
  \ **Todo List** 设计为高可用、弹性且安全的系统。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_267_0.png)\n\
  \n图 7.1 – 垂直扩展存在局限性\n\n需要指出的是，垂直扩展在实例发生故障或托管实例的可用区发生中断时无法提供支持，从而导致客户体验不佳。\n\nAWS\
  \ 提供了另一种扩展配置，称为 **水平扩展**。在此配置中，多个实例充当托管您应用副本的舰队中的 *节点*。此外，您可以将节点分布在每个区域的多个可用区中。这意味着如果一个节点发生故障或特定可用区发生中断，用户可以被重定向到舰队中的其他节点。\n\
  \n通过水平扩展，流量可以使用 **Elastic Load Balancing** 服务在实例舰队（节点）之间进行分发。AWS Elastic Load Balancing\
  \ 是一项服务，旨在将流量分发到资源舰队（在本例中为 EC2 实例），这有助于避免某些实例过载而其他实例闲置，并改善响应时间。通过将客户端/用户请求分发到根据图\
  \ 7.2 中的图表部署在多个可用区中的实例，您可以在区域内实现 **高可用性** —— 这是使用云计算的关键优势。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_267_1.png)\n\
  \n图 7.2 – 水平扩展访问可用区有助于实现高可用性\n\n\n\n\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_269_0.png)\n\
  \nALBs 可以根据流量类型和内容进行流量定向，包括以下内容：\n\n- **基于主机的路由：** 流量根据 HTTP 头中的主机字段进行转发。\n- **基于路径的路由：**\
  \ 流量根据 URL 进行转发，使你能够将流量在应用程序的不同服务或组件之间拆分。\n- **请求属性**（例如 X-Forwarded-For 头）：流量根据请求头中的字段进行转发，包括查询参数、源\
  \ IP 地址等。\n- **重定向：** 你可以将请求从一个 URL 重定向到另一个 URL。\n- **Lambda 函数：** 流量可以定向到 Lambda\
  \ 函数。\n- **容器化应用程序：** 流量可以定向到容器任务以及更多内容。\n\nALBs 还通过 SSL/TLS 协议提供应用程序安全加密，确保数据在传输过程中得到加密。\n\
  \n接下来，让我们来看网络负载均衡器。\n\n## 网络负载均衡器 (NLBs)\n\nNLBs 在 OSI 模型的第 4 层运行。这种负载均衡器旨在通过 **TCP、UDP、TCP_UDP**\
  \ 和 TLS 协议分发网络流量。NLBs 可以 **每秒处理数百万个请求**，应对 **流量波动**，并 **支持负载均衡器的静态 IP 地址**。还可以为负载均衡器的每个子网分配一个\
  \ Elastic IP 地址。\n\nNLBs 使用基于流的路由机制，这意味着一旦连接建立，网络数据包就会沿着相同的路由。 这意味着 NLBs 高效处理 TCP、UDP\
  \ 和 TLS 流量。NLBs 还支持通过对等连接在 VPC 之间以及通过 AWS Direct Connect 从本地连接的连接。NLBs 更适合网络型应用程序、监控工具、物联网遥测数据或媒体流。\n\
  \n与 ALBs 一样，你必须为 NLBs 配置一个或多个目标组，这些目标组将托管 EC2 实例、微服务和容器等目标。此外，一个目标可以属于多个目标组。 一个关键区别是，你的侦听器必须配置为侦听\
  \ TCP、TLS、UDP 和 TCP_UDP 等网络协议。\n\n一些附加功能包括以下内容：\n\n- **TLS 卸载：** NLB 处理所有 TLS 终止任务并保留应用程序的源\
  \ IP 地址。这可以释放后端 Web 服务器专注于响应客户端请求，而不是使用宝贵的计算资源来加密和解密流量。\n- **会话保持：** 确保来自客户端的请求被路由并继续传递到特定目标。\n\
  - **保留源 IP 地址：** 确保后端应用程序可以看到源客户端的 IP 地址。\n- **DNS 故障转移：** 确保如果某个区域没有健康的后端目标或该区域的负载均衡器节点发生故障，则流量会被路由到另一个可用区中的其他节点。这种故障转移和重定向由\
  \ Amazon Route53 处理，我们将在本学习指南后面讨论。\n\n接下来，让我们讨论网关负载均衡器。\n\n## 网关负载均衡器 (GWLBs)\n\n\
  进入和离开应用程序的网络流量通常需要在允许入站和出站之前进行检查和分析。 公司通常部署第三方防火墙解决方案、**入侵检测/预防系统 (IDSs/IPSs)**\
  \ 和 DDoS 保护设备。\n\n其中许多设备如今在 AWS Marketplace 上提供，并且可以轻松部署到你的 AWS 账户中。 客户选择这些设备是因为其功能和丰富的网络保护能力。\n\
  \n管理进入和离开这些设备的流量需要确保这些服务的高可用性并最大限度地减少停机时间。 你希望这些网络工具能够持续访问和可用，并且能够处理大量流量，并在流量进入和离开你的网络和资源时执行安全处理。\n\
  \nAWS GWLBs 解决了这些问题。 GWLBs 旨在帮助你部署、管理和扩展第三方虚拟设备。 GWLB 由网关服务和负载均衡器服务组成。\n\n如图 7.4\
  \ 所示的图表中，当源发送流量到目标时，其数据包需要首先由你的虚拟设备检查。\n\n流量首先通过第 3 层网关组件，该组件代表路由中的下一跳，且不进行数据包重写。\
  \ 一旦 GWLB 接收到流量，它就充当第 4 层负载均衡器，提供典型的功能，例如扩展和流粘性，这使设备能够在两个方向上看到流量并对其采取行动。\n\n它还执行健康检查。\
  \ 如果设备发生故障，流量可以被重新路由到另一个设备。 原始流量还使用 Geneve（通用网络虚拟化封装）协议封装在第 3 层头中。 这确保第 3 层数据包不会被更改而看到。\
  \ 设备可以看到数据包原样，可以解封装并检查它，并采取适当措施将其重新发送到目标。 这里的关键好处是源和目标应用程序无需意识到 GWLB 的存在，确保无需进行任何应用层更改。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_271_0.png)\n\n图 7.4 – GWLB\n\nGWLBs 旨在为你在\
  \ AWS 上管理第三方设备群提供容错、扩展性和高可用性。\n\n最后，让我们简要讨论经典负载均衡器。\n\n## 经典负载均衡器 (CLB)\n\n经典负载均衡器是上一代负载均衡器，AWS\
  \ 不建议将其用于任何现代生产级应用程序环境。 如以下屏幕截图所示，CLB 可以支持第 7 层和第 4 层流量，但缺乏 ALB 和 NLB 的许多高级功能和健壮性。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_272_0.png)\n\n图 7.5 – 设置 CLB\n\nCLBs\
  \ 支持 SSL 终止，如图 7.5 所示的图表中，将加密任务卸载到负载均衡器，并管理 SSL 证书。 还支持 IPv4 和 IPv6 流量。\n\n在本节中，我们详细研究了\
  \ AWS Elastic Load Balancers，并了解了如何构建应用程序架构以通过处理和分发流量到托管在你的 AWS 账户中的资源来提供高可用性。 在下一节中，你将了解有关可扩展性的更多信息，可扩展性是使组织能够设计弹性解决方案、确保一致性、可靠性、可访问性和成本控制的重要因素。\
  \ 下一节将讨论 EC2 实例的 Auto Scaling。\n\n## 使用 Amazon Auto Scaling 扩展你的应用程序\n\n虽然负载均衡使你能够在不同可用区中的多个\
  \ EC2 实例之间分发流量，确保高可用性，但定义你需要多少实例来支持你的用户群是整体架构设计的关键组成部分。\n\n为了确保你在 AWS 上部署的 **Todo\
  \ List** 应用程序能够处理终端用户需求，你必须确保你的 EC2 集群具有足够的节点并且容量符合要求。 通常，很难预测需求，过去这意味着公司会遵循 **峰值负载配置**\
  \ 的概念。 这就是你采购必要的<|message|> 基础设施和资源以处理你的峰值负载需求。 通常，这会导致需求低时资源浪费，并且资源处于空闲状态。\n\n\
  Amazon Auto Scaling 服务（无论是用于你的 EC2 实例、RDS 数据库，还是提供自动扩展能力的其他服务）通过在需求增加时部署额外的实例和节点，并在需求下降时终止这些资源来解决此问题。\
  \ 这不仅可以让你控制成本，还能满足 Well-Architected Framework 可持续性支柱的要求。\n\n### 什么是 EC2 的 Auto Scaling？\n\
  \nAmazon EC2 Auto Scaling 确保你的应用程序始终拥有足够的 EC2 实例来处理工作负载。 EC2 实例被分组到 **Auto Scaling\
  \ 组** 中，你可以为每个组设置最小实例数。 Amazon EC2 Auto Scaling 永不会允许组大小低于此阈值。 你还可以限制组中的最大实例数，这有助于确保某些异常进程不会导致\
  \ Auto Scaling 服务部署不必要的实例。\n\n如果在建立组时指定了所需的容量，Auto Scaling 服务将确保你的组具有指定数量的实例。 该服务可以根据你定义的扩展参数自动启动和终止实例，以响应应用程序使用量的峰值和低谷。\n\
  \n多个 AWS 服务可以促进基础设施元素的自动扩展并减少扩展的管理负担。 Amazon CloudWatch，一项监控服务，作为两者之间的中介，提供数据和洞察来监控你的应用程序和基础设施并适应性能或资源使用变化。\n\
  \n\n\n\n\n缩放可以通过手动向 Auto Scaling 组中添加或移除 EC2 实例，或通过动态定义基于资源使用或需求增加或减少组容量的规则来实现。这允许创建响应负载变化的规则，例如请求数、CPU\
  \ 和内存使用情况。\n\n以下讨论了可用的三种 **动态扩展策略** 类型：\n\n- **目标跟踪**：此策略根据给定指标的目标值调整 Auto Scaling\
  \ 组的当前预期容量，例如 CPU 或内存利用率。此策略可确保容量保持一致，并在需要时添加或移除 EC2 实例以维持所需的利用率水平，例如 60%。\n- **阶梯式扩展**：此策略根据预先确定的扩展调整集，在当前容量基础上向\
  \ Auto Scaling 组添加或移除 EC2 实例，这些调整会根据警报违规的严重程度而增加或减少。例如，如果 Auto Scaling 组有三个用于监控\
  \ CPU 利用率的级别，则在 CPU 利用率为 40% 时会触发警报，添加一台 EC2 实例；在 CPU 利用率为 60% 时，添加两台 EC2 实例；在 CPU\
  \ 利用率为 80% 时，添加三台 EC2 实例。\n- **简单扩展**：此策略允许通过单一扩展调整来增加或减少 Auto Scaling 组的容量。当预先确定的警报被触发时，可以启动新的\
  \ EC2 实例。\n\n按需实例扩展和 Spot Fleet 实例自动扩展功能使能够根据需求动态增加或减少 Spot Fleet 的容量。AWS Auto Scaling\
  \ 机制依赖于多个组件，必须在利用之前创建，我们将在下一节中讨论这些组件。\n\n## 使用 AWS 组件自动调整容量\n\nAmazon **Elastic\
  \ Compute Cloud (EC2)** Auto Scaling 依赖于多个组件来管理工作负载，包括以下内容：\n\n- **自动扩展组** 将实例分组在一起以便于扩展和管理。在创建组时可以设置最小、最大和首选实例数。\n\
  - **配置模板**，例如启动配置或启动模板，允许自定义实例详细信息，例如 AMI ID、实例类型、密钥对、安全组和块设备映射。\n- **扩展选项** 允许\
  \ Auto Scaling 组以多种方式进行扩展，使用 Amazon EC2 Auto Scaling。组可以根据特定触发器或预定计划动态扩展。\n\n以下部分将讨论在应用程序中实现自动扩展机制。\n\
  \n## 使用 Auto Scaling 提供高可用性应用程序\n\n通过将 Amazon EC2 Auto Scaling 纳入应用程序设计中，您可以最大化\
  \ AWS 云的好处。例如，自动扩展通过自动关闭不健康的实例并用新实例替换它们来提供更高的容错能力。Amazon EC2 Auto Scaling 还可以使用多个可用区在不同区域部署实例。\n\
  \n自动扩展还通过自动调整资源以满足用户需求来提高商品和服务的可用性。这确保您的应用程序拥有高效运行所需的资源。\n\n此外，Amazon EC2 Auto Scaling\
  \ 通过允许按需弹性扩展资源来实现更智能的预算。仅在需要时启动 EC2 实例，并在不使用时终止它们，有助于节省成本，因为您只需为使用的实例付费。\n\n在将 EC2\
  \ 自动扩展纳入以实现弹性、负载均衡和高可用性时，您最终会得到一个提供可靠性、可扩展性和成本效益的强大解决方案。\n\n现在您已经了解了构建可扩展、高可用且经济高效的解决方案的架构模式，是时候检查您的数据和应用程序的安全性了。在下一节中，您将转向\
  \ AWS 上的加密技术，并检查 AWS Key Management Service（AWS KMS）。\n\n## AWS 和 KMS 加密简介\n\n当您计划在云中托管和访问应用程序时，安全性至关重要。在第\
  \ 2 章《使用 AWS Identity and Access Management 安全访问》中，您发现了身份验证和授权的重要性。后来，在第 4 章《使用\
  \ Amazon VPC 在云中构建私有网络》中，您了解了网络安全以及确保仅允许与我们的应用程序相关的特定流量的措施。在本节中，您将了解数据加密以及 AWS 上的服务，这些服务可以帮助确保您的数据对没有授权查看数据的人不可读。这是您整体安全设计的关键组成部分。\n\
  \n以下是您在处理数据时需要了解的两种加密方法：\n\n- **传输中加密** – 这是指网络端点之间传输的加密数据。它可能以未加密的形式存储在磁盘上。\n-\
  \ **静态加密** – 这是指存储在磁盘上时加密的数据。当数据在存储系统上创建/存储时，它会被加密。从磁盘访问数据需要先解密才能使其可读。\n\n根据您在 AWS\
  \ 上使用的服务，您可以选择加密您的数据。对于端到端加密要求，您通常会同时实施这两种选项。\n\nAWS KMS 是 Amazon S3 和 AWS 上其他服务用于加密的重要服务。让我们通过讨论\
  \ KMS 的关键功能以及如何使用此服务有效地管理您的加密需求来深入了解。\n\n### AWS KMS 概述\n\n**AWS KMS** 是您用于构建和集成托管在\
  \ AWS 上的应用程序和数据的加密功能的主要服务。**AWS KMS 符合 FIPS 140-2 标准并使用共享安全硬件模块**来生成加密密钥，用于执行加密操作。\n\
  \n**AWS KMS 密钥**（以前称为客户主密钥或 CMK）执行所有数据加密、解密和重新加密。CMK 设计为仅加密最大 4KB 的数据。要加密更大的数据集，您必须创建数据密钥，如后面所述。\n\
  \n**AWS KMS 密钥**可以是客户管理的或 AWS 管理的。以下是区别：\n\n**客户管理的 CMK** 是您创建、拥有和管理的密钥。您完全控制密钥策略并能够启用和禁用它们。您可以选择性地定义密钥轮换策略，后续可以禁用，而\
  \ AWS 管理的密钥则不能。\n\n**AWS 管理的 CMK** 是由任何使用 AWS KMS 的原生服务代表您创建、管理和使用。虽然某些服务会让您选择 AWS\
  \ 管理的密钥或客户管理的密钥，但通常，除非您需要对密钥有更大的控制权，否则您可以选择 AWS 管理的密钥。对于 AWS 管理的密钥，密钥轮换每年自动执行且无法禁用，并且密钥无法删除。AWS\
  \ 管理的密钥也不收费。\n\n需要了解的一个重要概念是，您可以处理两种类型的加密 – *对称* 和 *非对称加密* – 相应地，您将使用对称密钥或非对称密钥。让我们接下来看看这些。\n\
  \n### 对称 KMS 密钥\n\n对称 KMS 加密密钥用于您希望使用相同的密钥执行加密和解密操作时。密钥安全存储在 KMS 中；您必须调用 KMS 来执行所需的加密和解密任务。请注意，与\
  \ KMS 集成的 AWS 服务仅使用对称加密。\n\n对称密钥可用于加密、解密和重新加密数据。它们还可用于生成数据密钥和数据密钥 *对*，我们将在本节后面讨论。支持多区域对称加密，并且如果您愿意，可以导入您的密钥材料。\n\
  \n\n\n\n## 非对称 KMS 密钥\n\n非对称 KMS 加密密钥由密钥对组成——一个私钥和一个公钥。当你需要让外部方对稍后需要由你解密的数据执行加密操作时，这种加密选项具有优势。使用公钥/私钥密钥对可以保持安全性，即使你自由地在\
  \ AWS 环境外分发公钥，因为只有你能使用私钥解密任何已加密的数据。\n\n私钥存储在 KMS 中，且永远不会以未加密的形式离开。你需要调用 KMS 来使用此私钥执行解密操作。\n\
  \n选择哪种加密密钥选项取决于你的用例。如果你需要在 AWS 外部执行加密操作，且无法访问 KMS，你可以使用非对称密钥。如果你需要使用 AWS 服务（如 Amazon\
  \ S3）来存储和管理所有加密和解密操作，那么对称加密密钥是一个绝佳的选择。\n\n如前所述，你可能需要创建数据密钥甚至数据密钥对来加密大于 4 KB 的数据。让我们接下来探讨这个概念。\n\
  \n## 什么是数据密钥？\n\nAWS KMS 密钥（AWS 管理或客户管理）用于加密和解密最大大小为 4 KB 的明文数据。由于你通常需要加密大得多的数据集，你可以使用\
  \ KMS 密钥通过 GenerateDataKey API 创建和加密数据密钥。这些数据密钥是对称的，用于数据加密，因为它们可以加密超过 4 KB 大小的数据，并且可以下载并在\
  \ AWS 外部使用。该操作将同时返回数据密钥的明文副本和加密副本。\n\n让我们查看使用数据密钥加密数据的工作流程，如*图 7.7*所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_278_0.png)\n\
  \n图 7.7 – 使用数据密钥加密你的数据\n\n以下是工作流程的步骤：\n\n- 1. 使用 AWS KMS 生成的数据密钥；加密的数据密钥及其明文格式可供下载。\n\
  - 2. 使用数据密钥的明文版本加密你的数据，然后从内存中丢弃该密钥。\n- 3. 将加密的数据和数据密钥的加密版本发送给接收方。加密的数据密钥需要首先使用 KMS\
  \ 进行解密以生成明文数据密钥。\n- 4. 然后使用明文数据密钥解密加密的数据。\n\nKMS 将使用 KMS 密钥创建数据密钥和数据密钥的加密版本。KMS\
  \ 将能够使用 KMS 密钥解密加密的数据密钥。\n\n除了之前提到的 GenerateDataKey API，你还可以编程调用其他 API 来与 KMS 进行接口交互和工作。常见的\
  \ API 调用包括：\n\n- **GenerateDataKeyPair** – 此操作返回一个非对称数据密钥对，你可以将其用于 AWS KMS 之外。你将获得明文公钥，以及私钥的明文和加密副本。\n\
  - **GenerateDataKeyWithoutPlaintext** – 此操作返回用于 AWS KMS 之外的对称数据密钥。通过此操作，你获得指定加密密钥下的加密数据密钥。此操作不返回数据密钥的明文副本，当你不打算立即加密数据时很有用。当你需要执行加密操作时，你调用加密密钥副本上的\
  \ Decrypt 操作。\n- **Encrypt** – 此操作用 KMS 密钥加密最大 4 KB 大小的明文，可用于对小型数据（如个人标识符、密钥或数据库密码）执行对称和非对称加密。你不使用此操作来加密数据密钥。对于数据密钥，你改用\
  \ GenerateDataKey 和 GenerateDataKeyPair 操作。\n\n既然你了解了 AWS KMS 工作原理的基础，让我们看看一些与加密功能无缝集成的\
  \ AWS 服务。我们将从查看 Amazon S3 服务以及数据是如何加密的开始。\n\n在你想强制使用特定 KMS 密钥进行服务端加密的情况下，你必须使用 `s3:amz-server-side-encryption-aws-kms-key-id`\
  \ 头。如果你不指定 AWS KMS 密钥 ID，Amazon 将改用 AWS 管理的 KMS 密钥。\n\n## 使用 AWS KMS 密钥的双层服务端加密\
  \ (DSSE-KMS)\n\n此选项使用两层对象级加密。当你将数据上传到 Amazon S3 时，它自动使用 S3 管理的密钥对其进行加密。DSSE-KMS\
  \ 允许你使用 AWS KMS 密钥来加密 S3 管理的密钥，从而创建双层加密。如果你需要多层加密来满足监管要求，此选项非常有用。使用 KMS，你对密钥有更多的控制权，并可以安全地管理它们。请注意，DSSE-KMS\
  \ 密钥必须与存储桶位于同一区域。\n\n## 使用客户提供的密钥的服务端加密 (SSE-C)\n\n这使你能够完全管理加密密钥，而 AWS 处理所有加密或解密任务。\n\
  \n## 客户端加密\n\n这指的是在客户端加密数据并将其上传到 Amazon S3 的过程。客户必须创建和管理密钥及加密过程。使用客户端加密的关键好处是你的数据对任何第三方（如\
  \ AWS）都不可访问。AWS 接收完全加密的数据，无法读取该数据。由于你在客户端加密数据，AWS 不会对数据执行任何加密或解密活动。它也不会识别该数据已被加密，只将其视为正常数据。\n\
  \n如果你的组织需要遵循某些严格的监管要求，你可能会选择客户端加密。\n\n请注意，在涉及 Amazon S3 加密时，被加密的是对象，而不是存储桶。在将对象上传到\
  \ Amazon S3 时，你可以通过创建**存储桶策略**来强制对象加密，该策略拒绝任何 PUT 请求，除非请求中包含 `x-amz-server-side-encryption`\
  \ 头。在指定此头时，你可以使用 AES256 作为 S3 管理密钥，或使用 `aws:kms` 作为 KMS 管理密钥。\n\n以下是你通常可以使用的一个策略示例，如*图\
  \ 7.8*所示：\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Id\": \"PutObjPolicy\"\
  ,\n  \"Statement\": [\n    {\n      \"Sid\": \"DenyIncorrectEncryptionHeader\",\n\
  \      \"Effect\": \"Deny\",\n      \"Principal\": \"*\",\n      \"Action\": \"\
  s3:PutObject\",\n      \"Resource\": \"arn:aws:s3:::<bucket_name>/*\",\n      \"\
  Condition\": {\n        \"StringNotEquals\": {\n          \"s3:x-amz-server-side-encryption\"\
  : \"AES256\"\n        }\n      }\n    },\n    {\n      \"Sid\": \"DenyUnencryptedObjectUploads\"\
  ,\n      \"Effect\": \"Deny\",\n      \"Principal\": \"*\",\n      \"Action\": \"\
  s3:PutObject\",\n      \"Resource\": \"arn:aws:s3:::<bucket_name>/*\",\n      \"\
  Condition\": {\n        \"Null\": {\n          \"s3:x-amz-server-side-encryption\"\
  : true\n        }\n      }\n    }\n  ]\n}\n```\n\n图 7.8 – 强制对象上传加密\n\n对于此策略，你必须指定你的存储桶的正确\
  \ Amazon 资源名称（arn）。\n\n到目前为止，你已经查看了 Amazon S3 可用的加密选项。在下一节中，你将了解如何将加密应用于其他类型的存储服务。\n\
  \n## Amazon EBS 加密\n\n**待办事项列表**应用程序的后端服务将运行在分布在弗吉尼亚北区多个可用区中的 EC2 实例群上。这将确保存储在存储服务上的所有数据将继续位于美国境内，以满足业务的数据驻留要求。虽然由待办事项列表应用程序的最终客户创建和管理的数据将驻留在上一章中部署的\
  \ Amazon RDS 数据库中，但同样重要的是要考虑加密托管后端应用程序的实例所附带的 EBS 卷。\n\nAmazon EBS 使用 AWS KMS 进行所有加密服务，使你能够使用\
  \ AES-256 数据加密来加密根卷和数据卷。当你加密 EBS 卷时，驻留在卷上的所有数据以及卷和实例之间移动的任何数据都会被加密。加密操作在托管 EC2 实例的服务器上执行。\n\
  \n\n\n\n\n你可以在同一时间将加密和非加密卷同时附加到 EC2 实例上。此外，从加密卷创建的快照以及由此类快照产生的后续卷也将被加密。\n\n接下来，你将了解有关\
  \ Amazon RDS 加密的更多信息。\n\n## Amazon RDS 加密\n\nAmazon RDS 提供静态数据加密，其中包括底层存储、自动备份、快照、日志和只读副本。与\
  \ Amazon EBS 类似，Amazon RDS 使用行业标准的 AES-256 位加密，并使用 AWS KMS 密钥执行所有加密操作。\n\n需要了解的一些重要概念包括以下内容：\n\
  \n- 如果只读副本与主数据库实例位于同一区域，则必须使用相同的 KMS 密钥。\n- 如果只读副本与主实例位于不同区域，则必须使用只读副本所在目标区域的 KMS\
  \ 密钥。\n- 你可以使用 **透明数据加密 (TDE)** 对 Oracle 和 SQL Server 数据库实例进行加密。\n- 复制加密快照时，可以使用与用于加密原始快照的密钥不同的\
  \ KMS 密钥。\n\n此外，加密 Amazon RDS 数据存在某些限制，其中一些列如下：\n\n- 你只能在首次创建数据库实例时对其进行加密。数据库启动后无法再对其进行加密。变通方法是创建快照，将快照复制到另一位置，并在复制过程中对其进行加密，然后从加密的快照中恢复数据库。\n\
  - 一旦创建了加密的数据库实例，就无法禁用加密。\n- 你无法为未加密的实例创建加密快照。\n\n总之，AWS KMS 与多个 AWS 服务提供原生集成以提供数据加密。你可以选择使用\
  \ AWS 管理的密钥或使用自己的客户托管密钥以获得更大的控制权。将数据的加密纳入应用程序架构设计模式中非常重要，以增加额外的安全层。\n\n下一节将引导你完成项目任务，了解\
  \ TodoPlus Limited 如何部署一个高可用且可扩展的应用程序。之前，你已在第 3 章 *使用 Amazon S3、混合存储和静态网站托管理解对象存储*\
  \ 中部署了前端用户界面。在本章中，你将部署后端应用程序组件，该组件托管 API 以使你的终端用户能够与数据库交互并存储他们的待办事项列表。\n\n## 项目任务\
  \ – 为待办事项列表应用程序部署一个高可用且可扩展的后端应用程序组件\n\n到目前为止，你已经构建了核心基础设施的很大一部分，如下图所示，该基础设施将用于部署和托管待办事项列表应用程序。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_284_0.png)\n\n具体来说，你已部署了以下核心基础设施服务：\n\
  \n1. IAM 的设置和配置，具有对账户的访问权限的特定用户，定义了一些具有权限的 IAM 角色以连接到 AWS Session Manager，从而实现我们将部署的应用程序服务器的远程管理。该角色将在项目任务进行过程中进一步修改以包含额外的策略。\n\
  2. Amazon Cognito 用户池的设置和配置，将用于创建和管理我们应用程序的虚构用户。\n3. Amazon S3 静态网站目前托管应用程序的前端 **用户界面\
  \ (UI)**。将在 Amazon S3 上执行额外的任务，例如托管登录用户可见的网页并托管应用程序源代码作为部署的存储库。\n4. 一个多层 VPC 托管六个子网、一个互联网网关、安全组和路由表以分离子网角色。本章在部署\
  \ NAT 网关时将执行额外的任务。\n5. 一个包含预安装的基础软件的 EC2 AMI，包括 Node.js 和 PM2，将用于加快未来应用程序层部署。\n\
  6. 一个 RDS 数据库，将托管终端用户的待办事项列表数据，并配置为将其凭据存储在 Amazon Secrets Manager 中。\n\n在本节中，我们将继续构建我们的架构解决方案，通过使用负载均衡器构建一个高可用组件，并添加可扩展性选项以部署我们的后端服务器。\n\
  \n## 技术要求\n\n你应已完成之前章节中的所有任务以完成本章的项目任务。确保在以 IAM 用户 Alice 登录时使用你的 AWS 开发账户。\n\n此外，你需要从我们的\
  \ GitHub 仓库链接下载源代码和 UserData 脚本文档：https://packt.link/LJB2S。\n\n### 项目任务 7.1 – Amazon\
  \ S3 – 创建应用程序源代码存储库\n\n在此步骤中，你将创建另一个 Amazon S3 存储桶用作应用程序源代码的存储库。你有两个网页 – 前端网页，邀请用户注册账户并登录，以及后端\
  \ Web 应用程序，使已注册用户能够访问他们的待办事项列表数据并创建和修改他们的待办事项列表。后端应用程序的源代码将存储在此 Amazon S3 存储桶中：\n\
  \n1. 登录你的 AWS 开发账户，即你为所有过去项目任务所使用的账户。确保以具有完全管理员访问权限的 IAM 用户 Alice 登录。\n2. 从 AWS\
  \ 管理控制台页面，使用顶部的搜索栏搜索 Amazon S3，然后在新的浏览器标签页中打开 Amazon S3 控制台。\n3. 你会注意到一个现有的存储桶托管待办事项列表应用程序的前端网页。点击控制台右侧窗格中的\
  \ **Create bucket** 按钮。\n4. 提供存储桶名称并确保你在 **US East (N. Virginia) us-east-1** 区域创建此存储桶，如以下屏幕截图所示：\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_286_0.png)\n\n*Figure 7.10 – Creating\
  \ an Amazon S3 bucket to host your application source code*\n\n5. 滚动到 **Bucket Versioning**\
  \ 并点击 **Enable** 单选按钮。\n6. 将所有其他设置保留为默认值，然后点击页面底部的 **Create bucket** 按钮。\n7. 在存储桶创建完成后，它已准备好供你上传源代码。代码可在我们的\
  \ **Github Repository** 中找到，具体在技术存储库部分。请确保在继续上传之前将源代码下载到本地计算机。\n8. 要上传源代码，请导航到你刚刚创建的\
  \ Amazon S3 存储桶，如以下屏幕截图所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_287_0.png)\n\
  \n*Figure 7.11 – Amazon S3 bucket to be used as your source code repository*\n\n\
  - 点击 **Upload** 按钮。\n- 点击 **Add files** 然后从本地计算机选择 `todo-plus-nodejs.zip` 文件。\n\
  - 点击 **Upload** 按钮，如以下屏幕截图所示。你应收到上传成功的消息。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_287_1.png)\n\
  \n*Figure 7.12 – Uploading the source code to your bucket*\n\n现在你已设置好 Amazon S3\
  \ 存储桶并为待办事项列表后端应用程序上传了源代码文件，你应创建一个 IAM 策略，该策略将授予你的 EC2 实例从存储桶下载源代码文件的权限。稍后，你将创建一个\
  \ IAM 角色，该角色将用于授予你的 EC2 实例此策略中定义的权限。\n\n1. 在另一个浏览器标签页中，导航到位于此处的 AWS 策略生成器网站：`https://awsypolicygen.s3.amazonaws.com/policygen.html`。\n\
  2. 从 **Select Type of Policy** 下拉列表中选择 **IAM Policy**。确保 **Effect** 设置为 **Allow**。\n\
  3. 从 **AWS Service** 下拉列表中选择 **Amazon S3**。\n4. 在 **Actions** 下拉列表中，选择 **GetObject**\
  \ 操作。\n5. 你需要提供存储桶的 **Amazon Resource Name (ARN)**。你可以在 Amazon S3 控制台中，在存储桶的 **Properties**\
  \ 选项卡下找到它，如以下屏幕截图所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_288_0.png)\n\n\
  *Figure 7.13 – The ARN of your Amazon S3 bucket*\n\n6. 复制此 ARN 值并将其粘贴到策略生成器网页上 **Amazon\
  \ Resource Name (ARN)** 文本框标签旁边的文本框中。你必须确保也在存储桶的 ARN 后添加值 *斜杠和星号* (`/*`)。这表示你授予对存储桶内所有内容的访问权限。参见屏幕截图以明确说明：\n\
  \n\n\n\n## 步骤 2：添加语句\n\n语句是单一权限的正式描述。请查看您可以用于语句中的元素说明。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_289_0.png)\n\
  \n图 7.14 – 指定存储桶的 ARN，后跟斜杠和通配符 (/*)\n\n- 7. 单击**添加语句**。\n- 8. 接下来，单击**生成策略**。您应该会得到一个类似以下内容的\
  \ JSON 策略语句（将此策略复制到剪贴板）：\n\n### 策略 JSON 文档\n\n单击下方进行编辑。若要保存策略，请将下方文本复制到文本编辑器中。在下方所做的更改不会反映在策略生成工具中。\n\
  \n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\"\
  : \"Stmt1700830761340\",\n      \"Action\": [\n        \"s3:GetObject\"\n      ],\n\
  \      \"Effect\": \"Allow\",\n      \"Resource\": \"arn:aws:s3:::todoapprepo/*\"\
  \n    }\n  ]\n}\n```\n\n图 7.15 – 示例 JSON 策略\n\n- 9. 从 AWS 管理控制台中，搜索 IAM 并在单独的浏览器标签页中导航到\
  \ IAM 控制台。\n- 10. 从左侧菜单中，选择**策略**。\n- 11. 在右侧窗格中，单击**创建策略**。\n- 12. 单击**JSON**按钮。这将打开**策略编辑器**。\n\
  - 13. 删除现有的示例策略，并将您在策略生成器中创建的 JSON 策略粘贴进去。\n- 以下代码片段中提供了一个策略示例。请将 `YOUR BUCKET NAME`\
  \ 占位符替换为您用作源代码存储库的存储桶名称：\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\"\
  : [\n    {\n      \"Sid\": \"Stmt1716962066285\",\n      \"Action\": [\n       \
  \ \"s3:GetObject\"\n      ],\n      \"Effect\": \"Allow\",\n      \"Resource\":\
  \ \"arn:aws:s3:::[YOUR BUCKET NAME]/*\"\n    }\n  ]\n}\n```\n\n- 14. 为您的策略提供一个名称，例如\
  \ `todo-list-s3-sourcecode-access-policy`，以及可选的描述。\n- 15. 滚动到页面底部并单击**创建策略**按钮。\n\
  - 16. 您应该会收到一条消息通知，指出策略已创建。稍后您将在此 IAM 角色中使用此策略。\n\n既然您已经拥有源代码存储桶并配置了 IAM 策略，我们可以继续本项目练习的*步骤\
  \ 2*。\n\n## 项目任务 7.2 – 修改当前已为您的 EC2 实例配置的 IAM 角色\n\n在本步骤中，您将针对我们在*第 5 章、使用 Amazon\
  \ EC2 和存储选项了解 AWS 计算服务*中为我们的 EC2 实例创建的现有 IAM 角色执行多项配置。这是因为您一次只能为您的 EC2 实例附加一个 IAM\
  \ 角色。然而，每个角色可以关联多个 IAM 策略。在*第 5 章、使用 Amazon EC2 和存储选项了解 AWS 计算服务*中，您配置了一个名为 `todo-ec2-iam-master-role`\
  \ 的 IAM 角色。该角色配置了 AmazonSSMManagedInstanceCore，使您能够使用 AWS Systems Manager 会话管理器服务远程连接与此角色关联的任何\
  \ EC2 实例。\n\n在本步骤中，您将向同一角色添加两个额外的策略；第一个策略允许运行在 EC2 实例上的应用程序访问包含 RDS 数据库凭证数据的密钥，应用程序需要这些数据来连接。您将附加到角色的第二个策略是您在上一步骤中创建的策略：\n\
  \n- 1. 从主**AWS 管理控制台**页面，在新的浏览器标签页中导航到 IAM 控制台。\n- 2. 从左侧菜单中，选择**策略**。\n- 3. 单击**创建策略**按钮。\n\
  - 4. 您将使用可视化编辑器创建策略。从**选择服务**下拉列表中，选择**Secrets Manager**。\n- 5. 展开**读取**访问级别，并选择**GetSecretValue**访问级别，如下截图所示：\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_291_0.png)\n\n图 7.16 – 配置 IAM 策略以从 AWS\
  \ Secrets Manager 读取密钥值\n\n- 6. 在**资源**下，您需要指定您在*第 6 章、使用 AWS 关系型和非关系型（NoSQL）数据库管理多个数据集*中创建的密钥的\
  \ ARN。在另一个浏览器标签页中，导航到 AWS Secrets Manager 控制台。单击您创建的密钥，从详细信息页面中，将**Secret ARN**值复制到剪贴板，如下截图所示：\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_292_0.png)\n\n图 7.17 – AWS Secrets Manager，您在*第\
  \ 6 章*中创建的密钥的 ARN\n\n- 7. 接下来，回到您正在创建 IAM 策略的浏览器标签页。\n- 8. 在策略配置的**资源**部分下，选择**特定**。\n\
