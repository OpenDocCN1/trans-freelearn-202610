  \ URL。\n- 5. 接下来，从网页顶部的搜索栏搜索 `CloudFront` 并在另一个浏览器标签页中导航到其网页控制台页面。\n- 6. 从右侧窗格中单击\
  \ **Create a CloudFront distribution** 按钮。\n- 7. 将 S3 存储桶的静态网站 URL 粘贴到 **Origin\
  \ domain** 下的搜索框中。如果你单击搜索框，它将列出帐户中可用于配置 CloudFront 分发的所有可能端点。然而，对于 Amazon S3 静态网站托管，你必须使用网站端点而不是简单的存储桶端点。\n\
  - 8. 如果你对为你选择的默认名称不满意，请在 **Name** 文本框中提供一个名称。\n- 9. 确保在 **Origin access** 下选择了 **Public**。\n\
  - 10. 接下来，滚动到 **Web Application Firewall (WAF)** 部分。在这里，选择 **Do not enable security\
  \ protection** 选项。出于本次实验的目的，你没有为你的应用程序配置任何 WAF 安全。\n- 11. 接下来，滚动到页面底部并单击 **Create\
  \ distribution** 按钮。分发将需要几分钟才能完全部署，如下图所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_382_0.png)\n\
