  \ 1.17 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_57_0.png)\n\n图 1.17 – 使用组织单元构建你的\
  \ AWS 账户\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n   \
  \ {\n      \"Effect\": \"Deny\",\n      \"Action\": [\n        \"organizations:LeaveOrganization\"\
