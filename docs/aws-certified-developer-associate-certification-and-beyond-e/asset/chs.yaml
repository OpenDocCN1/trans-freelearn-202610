  \n下一节提供本章摘要。\n\n## 摘要\n\n在本章中，你探索了 Amazon CloudFront 和 Route 53 在提升 AWS 上应用程序的性能、路由和可访问性方面的作用。这种探索让你深入了解了这些服务如何单独及协同工作，以优化全球\
  \ Web 应用的用户体验。\n\n你学习了 Amazon CloudFront（AWS 的 CDN 服务），并考察了其关键特性和功能。本章讨论了 CloudFront\
  \ 如何通过将 Web 内容缓存到离用户最近的边缘站点来加速内容交付，从而显著减少延迟并缩短加载时间。你还探索了 CloudFront 的安全能力，包括与 AWS\
  \ Shield 集成以提供 DDoS 保护，以及与 AWS WAF 集成以提供 Web 应用程序安全。\n\n接下来，你学习了 Amazon Route 53，探索了它在域名管理和\
  \ DNS 服务中的关键作用。重点介绍了 Route 53 在 DNS 路由、健康检查、流量路由以及与其他 AWS 服务无缝集成方面的功能。你还发现了一些高级功能，例如基于延迟的路由、地理定位路由和故障转移路由，这些功能对于管理全球流量以及确保应用程序的高可用性和弹性至关重要。\n\
  \n- 2. 登录后，你将看到一个与*图 9.34*类似的页面：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_392_0.png)\n\
  \n- 3. 准备好后，开始以下练习演练，多次重新尝试测验。\n\n## 考试准备练习\n\n对于前三次尝试，不要担心时间限制。\n\n### 尝试 1\n\n\
  第一次尝试，目标至少达到 **40%**。查看你答错的题目，并重新阅读章节中的相关部分，以弥补学习上的不足。\n\n### 尝试 2\n\n第二次尝试，目标至少达到\
  \ **60%**。查看你答错的题目，并重新阅读章节中的相关部分，以弥补任何剩余的学习不足。\n\n### 尝试 3\n\n第三次尝试，目标至少达到 **75%**。一旦你的分数达到\
  \ 75% 或以上，就可以开始练习答题速度。\n\n> **提示**  \n> 你可能需要超过**三次**尝试才能达到 75%。这没关系。只需复习章节中的相关部分，直到你达到目标。\n\
  \n### 计时训练\n\n**目标**：你的目标是在保持相同分数的情况下，尽可能快地回答这些问题。以下是你后续尝试应达到效果的示例：\n\n| 尝试 | 分数\
