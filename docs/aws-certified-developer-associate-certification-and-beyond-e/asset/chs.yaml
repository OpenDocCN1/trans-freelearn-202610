  \ 命令\n\n## 项目任务 12.5 – 为前端应用程序创建 CI/CD 流水线\n\n在本项目任务中，您将开始从 Web 应用程序的前端组件配置您的 CI/CD\
  \ 流水线。这将更新前面讨论过的前端 **用户界面 (UI)**。\n\n按照以下步骤编辑前端源代码包中的 `buildspec.yml` 文件：\n\n- 1.\
  \ 导航至您已解压到本地计算机 `frontend` 目录的 `todoplus_frontend` 文件夹。在您最喜欢的代码编辑器（如 Notepad++ 或\
  \ Visual Studio Code）中打开 `buildspec.yml` 文件，如图 12.40 所示：\n\n```\nversion: 0.2\n\n\
  phases:\n  build:\n    commands:\n      - npm i && npm run build\n      # Please\
  \ change the s3 bucket URI\n      - aws s3 cp --recursive dist/ s3://mytodolistapp\n\
  \      # Please change the distribution id\n      - aws cloudfront create-invalidation\
  \ --distribution-id E1771XGVB0AXK5 --paths \"/*\"\n```\n\n图 12.40 – 编辑 buildspec.yml\
  \ 文件\n\n- 2. 您需要将高亮显示的 s3 端点地址编辑为您 Amazon S3 存储库的地址。这是您的存储库名称。\n\n- 3. 接下来，您必须将您的\
  \ CloudFront 分发 ID 编辑为您的分发 ID。您可以在 Amazon CloudFront 控制台中找到该 ID，如图 12.41 所示：\n\n\
  ![](img/34ff9b5b5a734dae3450ab701e223c73_538_0.png)\n\n图 12.41 – 识别您的 CloudFront\
  \ 分发 ID\n\n- 4. 接下来，确保保存该文件。\n\n- 5. 打开您的终端窗口（如果使用 Mac）或命令提示符（如果使用 Windows），并导航至前端代码文件夹。列出目录和文件，以确保您位于包含刚刚更新的\
  \ `buildspec.yml` 文件的正确文件夹中。\n\n- 6. 接下来，输入 `git add .` 命令并按 *Enter*。\n\n- 7. 接下来，输入\
  \ `git commit -m \"buildspec file updated\"` 命令并按 *Enter*。这里，您正在提交对 buildspec 文件所做的更改。您应该会收到更改的确认。\n\
  \n- 8. 接下来，输入 `git push` 命令并按 *Enter* 以将代码推送到 AWS CodeCommit。如果您之前创建了密码短语，系统可能会提示您输入密码短语。然后您应该会看到\
  \ `git push` 操作的确认，如图 12.42 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_538_1.png)\n\
  \n图 12.42 – Git 推送已更新的代码文件\n\n### 创建 CodeBuild 项目\n\n- 1. 接下来，您需要创建一个 CodeBuild\
  \ 项目文件。确保您仍以 IAM 用户 Alice 的身份登录到 AWS 开发账户。\n\n- 2. 从顶部搜索栏中，搜索 AWS CodeBuild 并导航至\
  \ CodeBuild Web 控制台。\n\n- 3. 从左侧菜单中，点击 **入门（Getting Started）**，然后在右侧窗格中点击 **创建项目（Create\
  \ project）** 按钮。\n\n- 4. 接下来，为您的项目提供一个名称，例如 `todolist-frontend-build`。\n\n- 5. 接下来，将源代码提供商设置为\
  \ **AWS CodeCommit**。\n\n- 6. 对于 **存储库（Repository）**，确保您选择了 `todolist-frontend`（如果您给前端源代码存储库起了不同的名称，请确保选择正确的那个）。\n\
  \n- 7. 在 **分支（Branch）** 下的下拉列表中，选择 **main**。\n\n- 8. 在环境部分，记下自动为您创建的 IAM 角色的 **角色名称（Role\
  \ name）**。\n\n- 9. 接下来，向下滚动至 **Buildspec** 部分，并选择 **使用 buildspec 文件（Use a buildspec\
  \ file）**。\n\n- 10. 最后，点击屏幕底部的 **创建构建项目（Create build project）**。\n\n- 11. 然后您应该会收到项目已创建的确认，如图\
  \ 12.43 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_539_0.png)\n\n*图 12.43 –\
  \ 构建项目已创建*\n\n请注意，系统会自动为您创建一个 IAM 角色，接下来您需要对其进行编辑。此更新确保为您的项目提供必要的权限，以更新托管在 Amazon\
  \ S3 存储库中的前端代码，并对您的 CloudFront 分发执行失效请求（invalidation request）。角色名称取决于您的构建项目名称，因此您应该能够快速在\
  \ IAM 中识别出它。\n\n\n\n\n\n## 更新您的 IAM 角色\n\n- 1. 在单独的浏览器标签页中导航到 AWS IAM 管理控制台。\n-\
  \ 2. 在 IAM 控制台中，从左侧菜单点击 **Roles**，然后在右侧窗格中搜索您在 *Step 16* 中记下的 IAM 角色名称。\n- 3. 点击该角色，然后从\
  \ **Add Permissions** 下拉箭头中点击 **Create inline policy**。对于此内联策略，您可以使用可视化编辑器或 **JSON**\
  \ 选项卡并粘贴以下 JSON 代码，确保为粗体突出显示的占位符提供正确的值：\n\n```json\n{\n    \"Version\": \"2012-10-17\"\
  ,\n    \"Statement\": [\n        {\n            \"Sid\": \"VisualEditor0\",\n  \
  \          \"Effect\": \"Allow\",\n            \"Action\": [\n                \"\
  s3:PutObject\",\n                \"s3:GetObject\",\n                \"cloudfront:CreateInvalidation\"\
  \n            ],\n            \"Resource\": [\n                \"arn:aws:cloudfront::[Account\
  \ ID]:distribution/[CLOUDFRONT DISTRIBUTION ID]\",\n                \"arn:aws:s3:::[AMAZON\
  \ S3 BUCKET NAME]/*\"\n            ]\n        }\n    ]\n}\n```\n\n> **Note:**\n\
  > \n> 您可以从我们在技术要求部分提到的 GitHub 仓库下载此策略示例\n\n- 4. 点击 **Next**。\n- 5. 在标记为 **Policy\
  \ name** 的文本框中为您的策略提供一个名称，然后点击 **Create policy**。\n- 6. 您应该为此角色有两个策略，如 *Figure 12.44*\
  \ 所示。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_541_0.png)\n\nFigure 12.44 – Additional\
  \ inline policy to grant access to S3 and CloudFront\n\n接下来，您将为您的 CI/CD 部署创建管道。\n\
  \n## 创建您的 CI/CD 管道\n\n在本任务的这一部分中，您将创建 CI/CD 管道，该管道将用于触发更新的前端代码的部署：\n\n- 1. 在 AWS\
  \ 管理控制台的顶部搜索栏中搜索并导航到单独浏览器标签页中的 AWS CodePipeline 控制台。\n- 2. 从左侧菜单选择 Pipelines under\
  \ CodePipeline。\n- 3. 在右侧窗格中，点击 Create pipeline 按钮。\n- 4. 为您的管道提供一个描述性名称，例如 todolist-frontend-pipeline。\n\
  - 5. 确保在 Execution mode 下选择了 Queued（Pipeline type V2 required），然后点击页面底部的 Next。注意，此过程还将自动创建一个\
  \ IAM 角色。\n- 6. 在页面的 Source 部分中选择 AWS CodeCommit 作为 Source provider。\n- 7. 接下来，确保为\
  \ Repository name 选择 todolist-frontend 仓库。\n- 8. 接下来，确保在 Branch name 下选择 main。\n\
  \n9. 点击 Next，如 Figure 12.45 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_542_0.png)\n\
  \nFigure 12.45 – Configuring the source of your pipeline\n\n10. 对于 Build provider，确保选择\
  \ AWS CodeBuild。\n\n11. 接下来，确保区域设置为 US East（N. Virginia）。\n\n12. 接下来，确保选择您在 Step\
  \ 12 中创建的构建的正确项目名称。\n\n13. 点击 Next。\n\n14. 您现在将被提示 Add deploy stage。对于此阶段，点击 Skip\
  \ deploy stage 按钮。系统会提示您确认您的选择。请继续点击 Skip 按钮。\n\n15. 接下来，您会看到 Review 部分。确保所有设置都已正确定义，如前面的步骤所述，然后点击\
  \ Create pipeline 按钮。\n\n您的 AWS CodePipeline 现在将初始化并继续构建您的 CI/CD 管道，接收仓库中的更新代码并更新\
  \ Web 应用程序的前端组件。片刻之后，您应该会看到管道已成功创建，并且您的源和构建过程也已成功完成，如 Figure 12.46 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_543_0.png)\n\
  \n如果您导航到托管前端网站代码的 Amazon S3 存储桶的内容，您会注意到文件已使用时间戳更新，如 Figure 12.47 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_543_1.png)\n\
  \n接下来，您必须为后端应用程序代码构建 CI/CD 管道。\n\n## Project Task 12.6 – 为您的后端应用程序创建 CI/CD 管道\n\n\
  现在您的前端代码已通过 AWS CodePipeline 更新，您可以为后端代码创建管道。\n\n在设置 CI/CD 管道之前，请注意用于构建该后端 Fargate\
  \ 容器的 Docker 镜像的 URI。在单独的浏览器标签页中导航到您的 Amazon ECR 管理控制台。记下您的后端 Docker 镜像的镜像 URI，如\
  \ *Figure 12.48* 所示。您将在即将到来的步骤中需要它。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_544_0.png)\n\
  \nFigure 12.48 – Image URI of your Docker image\n\n### 创建 CodeBuild 项目\n\n- 1. 在单独的浏览器标签页中导航到\
  \ AWS CodeBuild 管理控制台。\n- 2. 在右侧窗格中，点击 **Create project** 按钮。\n- 3. 为您的项目提供一个名称，例如\
  \ `todolist-backend-build`。\n- 4. 接下来，在 **Source** 部分选择 **AWS CodeCommit as Source\
  \ provider**。\n- 5. 从 **Repository** 搜索框中选择 `todolist-backend` 仓库。\n- 6. 接下来，从 **Branch**\
  \ 下拉列表中选择 **main**。\n- 7. 接下来，在 **Environment** 部分，注意将创建为新服务角色的 **Role name** 值。\n\
  - 8. 向下滚动并展开 **Additional configuration** 子部分。\n- 9. 在 **Environmental variables**\
  \ 部分，创建一个名为 `REPOSITORY_URI` 的新环境变量，并将您在此项目任务开始时记下的 Docker 镜像 URI 粘贴为值，如 *Figure\
  \ 12.49* 所示。`buildspec.yml` 文件中的 docker build 命令引用此环境变量以知道要构建哪个容器镜像。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_545_0.png)\n\
  \nFigure 12.49 – Environmental variables used in your CodeBuild project\n\n- 10.\
  \ 接下来，滚动到 **Buildspec** 部分。在这里，选择 **Use a buildspec file** 选项。\n- 11. 最后，点击屏幕底部的\
  \ **Create build project** 按钮。您应该会收到一条消息，说明您已成功创建项目。\n\n## 更新您的 IAM 角色\n\n- 1. 在单独的浏览器标签页中导航到\
  \ IAM 管理控制台。\n- 2. 从左侧菜单点击 **Roles**。\n- 3. 在右侧窗格中搜索并点击访问您在 *Step 7* 中记下的角色，CodeBuild\
  \ 自动创建了该角色。\n- 4. 点击 **Add permissions** 上的下拉箭头并选择 **Create inline policy**。\n-\
  \ 5. 在 **Policy editor** 中选择 **JSON** 选项并粘贴以下策略，确保将区域名称和 ECR 镜像名称替换为与您的 Amazon ECR\
  \ 仓库中 ARN 匹配的名称：\n\n```\n{\n\"Version\": \"2012-10-17\",\n\"Statement\": [\n{\n\"\
  Sid\": \"VisualEditor0\",\n\"Effect\": \"Allow\",\n\"Action\": [\n```\n\n```\n\"\
  ecr:CompleteLayerUpload\",\n\"ecr:UploadLayerPart\",\n\"ecr:InitiateLayerUpload\"\
  ,\n\"ecr:BatchCheckLayerAvailability\",\n\"ecr:PutImage\"\n],\n\"Resource\": \"\
  arn:aws:ecr:[REGION NAME]:[Account ID]:repository/[ECR IMAGE NAME]\"\n},\n{\n\"\
  Sid\": \"VisualEditor1\",\n\"Effect\": \"Allow\",\n\"Action\": \"ecr:GetAuthorizationToken\"\
  ,\n\"Resource\": \"*\"\n}\n]\n}\n```\n\n> **Note:**\n> 您可以从我们在技术要求部分提到的 GitHub 仓库下载此策略示例\n\
  \n- 6. 点击 **Next**。\n- 7. 为您的策略提供一个名称，例如 todolist-backend-policy-ecr。\n- 8. 点击 **Create\
  \ policy** 按钮。\n- 9. 接下来，返回 AWS CodeBuild 控制台。点击 **Start build** 按钮，如 Figure 12.50\
  \ 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_546_0.png)\n\nFigure 12.50 – Start\
  \ build to test the build\n\n10. 如果构建成功，您将在构建项目的 **Build logs** 部分注意到详细信息。如果您导航到\
  \ ECR 管理控制台，您还将注意到带有最新提交哈希的新容器镜像版本，如 Figure 12.51 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_547_0.png)\n\
  \nFigure 12.51 – New image version in Amazon ECR\n\n接下来，您可以继续构建 CI/CD 管道。\n\n##\
  \ 创建您的 CI/CD 管道\n\n- 1. 在单独的浏览器标签页中导航到 AWS CodePipeline 管理控制台。\n- 2. 在右侧窗格中，点击 **Create\
  \ pipeline** 按钮。\n- 3. 为您的管道提供一个名称，例如 `todolist-backend-pipeline`。\n- 4. 接下来，接受默认值并点击\
  \ **Next** 按钮。\n- 5. 对于 **Source provider**，选择 **AWS CodeCommit**。\n- 6. 接下来，从 **Repository\
  \ name** 搜索框中选择您的后端仓库。\n- 7. 确保将 **main** 设置为 **Branch name**。\n- 8. 点击 **Next**。\n\
  - 9. 选择 **AWS CodeBuild** 作为 **Build provider**。\n- 10. 确保为 **Region** 选择 **US East\
  \ (N.Virginia)**。\n\n\n\n\n\n11. 接下来，请根据图 12.52 从项目名称搜索框中选择正确的构建项目：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_548_0.png)\n\
  \n图 12.52 – 向您的流水线添加构建阶段\n\n- 12. 单击下一步。\n- 13. 选择 Amazon ECS 作为部署提供商。\n- 14. 接下来，在集群名称搜索框中选择您的\
  \ ECS 集群，例如，todo-plus-cluster。\n- 15. 接下来，在服务名称中选择您在第 11 章《使用 Amazon ECS、Fargate\
  \ 和 EKS 部署多层应用程序堆栈》中创建的正确的 ECS 服务名称，例如，todo-plus-ecs-service。\n- 16. 接下来，在图像定义文件\
  \ – 可选 下方的文本框中提供名称 taskdef.json。此图像文件名引用自后端 buildspec 文件。\n\n- 17. 单击 **下一步**。\n\
  - 18. 查看您的配置并单击屏幕底部的 **创建流水线** 按钮。\n\n您的后端流水线现在将处理您的请求并经过应用程序的源、构建和部署阶段，您应该会得到成功完成，如\
  \ *图 12.53* 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_549_0.png)\n\n图 12.53\
  \ – CI/CD 流水线成功\n\n接下来，您现在可以测试您的应用程序。如有必要，导航到 CloudFront Web 管理控制台，将分发域名复制到剪贴板，然后将其粘贴到浏览器标签的地址栏中。\n\
  \n您的 Todo List 应用程序网站应该打开，您应该能够使用上一章中使用的相同凭据登录。如果您添加了任何待办条目，它们应该会反映在您的待办列表中。\n\n\
  更重要的是，您应该注意到用户界面更改和功能，如本项目任务开始时讨论的那样。您现在可以编辑现有任务、删除可能错误输入的任务，甚至可以根据 **任务类型** 和 **状态**\
  \ 过滤任务。图 12.54 说明了应用程序用户界面：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_550_0.png)\n\
  \n图 12.54 – 最终应用程序用户界面和用户体验\n\n## 摘要\n\n本章致力于帮助组织利用 AWS CI/CD 工具实施软件开发和部署的 DevOps\
  \ 方法。本章强调了 DevOps 的重要性，这是一种促进开发人员和运维团队之间协作和沟通以加快高质量软件交付的理念。它还介绍了各种 AWS CI/CD 工具，如\
  \ AWS CodeBuild、AWS CodeDeploy 和 AWS CodePipeline。它演示了如何使用这些工具自动执行软件应用程序的构建、测试和部署。\n\
  \n此外，本章提供了利用 AWS CI/CD 工具的最佳实践，包括使用 AWS IAM 策略控制对资源的访问以及使用 AWS 资源级权限在每个账户内调节对资源的访问。本章以强调持续改进的重要性以及随着项目不断发展需要监控和增强流水线而结束。\n\
  \n## 考试准备演练 – 章节复习问题\n\n除了对关键概念有扎实的理解之外，在时间压力下快速思考的能力将帮助您顺利通过认证考试。这就是为什么在学习之旅早期就练习这些技能很关键。\n\
  \n章节复习问题旨在随着您学习和复习每一章而逐步提高您的应试技巧，同时检查您对本章关键概念的理解。您会在每一章的末尾找到这些问题。\n\n如何访问这些材料\n\n\
  要了解如何访问这些资源，请前往标题为 *第 17 章，访问在线资源* 的章节。\n\n要打开本章的章节复习问题，请执行以下步骤：\n\n- 1. 单击链接 –\
  \ https://packt.link/DVAC02_CH12。\n- \n\n      或者，您可以扫描以下二维码（图 12.55）：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_551_0.png)\n\
  \n图 12.55 – 打开已登录用户的章节复习问题的二维码\n\n2. 登录后，您会看到与图 12.56 所示类似的页面：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_552_0.png)\n\
  \n图 12.56 – 第 12 章章节复习问题\n\n3. 准备好后，开始以下练习测验，多次重做测验。\n\n## 考试准备演练\n\n前三次尝试不必担心时间限制。\n\
  \n## 第一次尝试\n\n第一次，至少达到 40%。查看答错的答案并再次阅读章节中的相关部分以弥补学习差距。\n\n## 第二次尝试\n\n第二次，至少达到\
  \ 60%。查看答错的答案并再次阅读章节中的相关部分以弥补剩余的学习差距。\n\n## 第三次尝试\n\n第三次，至少达到 **75%**。一旦得分达到 75%\
  \ 或以上，您就开始练习时间。\n\n> **提示**\n> 您可能需要超过 **三次** 尝试才能达到 75%。这没关系。只要一直复习章节中的相关部分，直到达到目标为止。\n\
  \n## 练习时间\n\n**目标：** 您的目标是在尽可能快地回答这些问题的同时保持相同的分数。以下是您下一次尝试应如何进行的示例：\n\n| 尝试 | 分数\
  \ | 用时 |\n| --- | --- | --- |\n| 第 5 次尝试 | 77% | 21 分 30 秒 |\n| 第 6 次尝试 | 78% |\
  \ 18 分 34 秒 |\n| 第 7 次尝试 | 76% | 14 分 44 秒 |\n\n表 12.1 – 在线平台上的示例计时练习测验\n\n> **注意**\n\
  > 上表中显示的时间限制只是示例。根据网站上测验的时间限制，为每次尝试设定自己的时间限制。\n\n随着每次新的尝试，您的分数应保持在 **75%** 以上，而完成所需“用时”应“减少”。重复尽可能多的尝试，直到您对时间压力感到有信心为止。\n"
- "## 使用 CloudFormation 和云开发工具包（CDK）通过代码构建基础设施\n\n在当今快节奏的数字世界中，构建和管理基础设施变得越来越复杂和耗时。随着云计算的快速增长，组织不断寻找自动化其基础设施部署和管理的方法。这就是\
  \ CloudFormation 和 **云开发工具包（CDK）** 发挥作用的地方。\n\nAWS CloudFormation 是一项 AWS 服务，允许您以\
  \ **基础设施即代码（IaC）** 的方式建模和设置基础设施。它提供了一种自动化创建、更新和删除 AWS 资源的方式，使其井然有序、可预测。这减少了人为错误的可能性，并使部署和维护基础设施更高效。\n\
  \n在此基础上，AWS 提供了另一项服务，称为 **AWS 云开发工具包（AWS CDK）**。该服务为使用 Python、JavaScript、TypeScript、C#、Go\
  \ 或 Java 等流行编程语言开发云应用程序提供了高级库。CDK 为 AWS 提供更高级别的编程接口，使开发人员能够使用更熟悉的语法以代码形式定义其基础设施。CDK\
  \ 使用 CloudFormation 模板和堆栈部署您的代码，但还提供多个内置构造，使创建、部署和管理云基础设施变得更容易。\n\nAWS CloudFormation\
  \ 和 CDK 属于 AWS 认证开发者助理认证的 **第 3 域：部署** 范围，您明确期望了解如何使用 IaC 部署基础设施和应用程序。\n\n## AWS\
  \ CloudFormation 概述\n\n当您在 AWS 上设计、构建和部署基础设施和应用程序时，通常会执行重复性任务。使用 AWS 管理控制台甚至 CLI\
  \ 执行这些任务需要大量手动操作。对于多个环境，想象一下反复部署具有相同配置项（IP地址范围、子网、路由表、NAT 网关和安全工具）的复杂 VPC。您可能希望在这些环境中保持相同的配置。然而，如果您手动使用鼠标点击或\
  \ CLI 命令执行所有必要的配置任务，您很可能会在环境之间出现配置漂移。AWS CloudFormation 是一项服务，可实现以代码形式创建、部署和管理云基础设施。它允许组织以可预测、有序的方式建模和自动化创建、更新和删除\
  \ AWS 资源的过程。使用代码构建所需的基础设施，CloudFormation 提供了一种简单的方法来定义所需状态，该状态可根据需要轻松创建、更新和删除。\n\
  \n使用 CloudFormation，基础设施可以以编程方式管理，使自动化重复性任务变得更容易，并减少人为错误的可能性。此外，CloudFormation 与其他\
  \ AWS 服务（如 EC2、S3 和 VPC）集成，使部署和管理复杂云基础设施变得容易。通过使用 CloudFormation，组织可以受益于改进的基础设施效率、可靠性和可扩展性。\n\
  \nAWS CloudFormation 允许您使用两种 **声明式语言** 中的一种来定义基础设施 – **JavaScript 对象表示法（JSON）**\
  \ 或 **另一种标记语言（YAML）**。使用这些标记语言，您构建 **CloudFormation 模板**，以指定要创建的资源，以及这些资源之间的属性和关系。您希望构建的基础设施因此可以重现，这要归功于名为\
  \ AWS CloudFormation 的 IaC 服务。\n\n以下高级图表说明了使用 YAML 定义的模板部署 CloudFormation 堆栈以构建\
  \ VPC。\n\n\n\n\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_557_0.png)\n\n## 图 13.1：CloudFormation\
  \ 堆栈\n\n图 13.1 中的示例模板定义了与典型 VPC 关联的配置项。在模板中，你将定义子网、路由表、安全组以及 NAT 网关等组件。CloudFormation\
  \ 服务随后将使用模板中的信息构建一个堆栈，即作为单个单元管理的资源集合。由 CloudFormation 模板定义的堆栈可使用 AWS 管理控制台、AWS CLI\
  \ 或 CloudFormation API 进行创建、更新和删除。\n\n当你将模板上传到 CloudFormation 时，服务会在 AWS 管理的 S3\
  \ 存储桶中创建并存储该模板。如果你愿意，也可以使用自己的 S3 存储桶。此 AWS CloudFormation 模板可以从部署少量资源的简单配置定义到更复杂的架构不等。在下一节中，你将了解有关\
  \ CloudFormation 模板结构方面的更多信息。\n\n## CloudFormation 模板的结构\n\nAWS CloudFormation 模板由多个组件组成。示例片段如下所示：\n\
  \n```\nResources:\n  VPC:\n    Type: AWS::EC2::VPC\n    Properties:\n      CidrBlock:\
  \ !Ref VpcCIDR\n      EnableDnsSupport: true\n```\n\n```\nEnableDnsHostnames: true\n\
  Tags:\n- Key: Name\n  Value: !Ref EnvironmentName\nInternetGateway:\nType: AWS::EC2::InternetGateway\n\
  Properties:\nTags:\n- Key: Name\n  Value: !Ref EnvironmentName\nInternetGatewayAttachment:\n\
  Type: AWS::EC2::VPCGatewayAttachment\nProperties:\nInternetGatewayId: !Ref InternetGateway\n\
  VpcId: !Ref VPC\n```\n\nCloudFormation 模板的组件解释如下：\n\n### 格式版本\n\n模板的这一部分是可选的，用于标识模板的功能。AWS\
  \ CloudFormation 要求你使用当前模板版本 2010-09-09。这在模板中按以下代码片段指定：\n\n```\nAWSTemplateFormatVersion:\
  \ \"2010-09-09\"\n```\n\n### 描述\n\n此部分是可选的。它使你能够提供有关模板的一些信息，这对于需要审阅和使用它的人来说非常有帮助：\n\
  \n```\nDescription: This template deploys a VPC for Todo Plus Limited, with a pair\
  \ of public and four private subnets spread across two Availability Zones. It deploys\
  \ an internet gateway, with a default route on the public subnets. It deploys a\
  \ pair of NAT gateways (one in each AZ), and default routes for them in the private\
  \ subnets.\n```\n\n### 参数\n\nAWS CloudFormation 允许你在模板中定义参数。虽然是一个可选部分，但参数非常有价值，因为它们会在部署\
  \ CloudFormation 堆栈时使你能够提供额外的配置信息，特别是当你无法在部署前提供这些配置细节时。\n\n由于一个堆栈的配置可能与另一个堆栈不同，参数使你能够在不同堆栈之间重用模板，从而提供灵活性和延长模板的生命周期。\n\
  \n参数的示例在以下片段中显示：\n\n```\nParameters:\n  InstanceType:\n    Description: Webserver\
  \ EC2 instance type\n    Type: String\n    AllowedValues:\n      - t2.nano\n   \
  \   - t2.micro\n      - t2.small\n    Default: t2.micro\n    ConstraintDescription:\
  \ must be a valid EC2 instance type\n```\n\n如上代码所示，当使用 CloudFormation 部署此模板时，用户会被提示接受\
  \ *default* 实例类型（在本例中为 `t2.micro`）来启动 EC2 实例，或从允许值的 *array* 中选择另一个实例类型。在本例中，允许的值为\
  \ `t2.nano`、`t2.micro` 和 `t2.small`。\n\n每个参数都将有一个逻辑名称（逻辑 ID），该名称必须在模板中的所有其他逻辑名称中唯一。在本例中，参数的逻辑名称为\
  \ `InstanceType`。\n\n所选值随后作为变量存储在参数中，你可以使用 `Fn::Ref` 内在函数从模板的 **Resources** 和 **Outputs**\
  \ 部分引用它。当创建 YAML 格式的模板时，你可以使用 **!Ref** 函数，如以下片段所示：\n\n```\nParameters:\n  **InstanceType:**\n\
  \    Description: Webserver EC2 instance type\n    Type: String\n    AllowedValues:\n\
  \      - t2.nano\n      - t2.micro\n      - t2.small\n    Default: t2.micro\n  \
  \  ConstraintDescription: must be a valid EC2 instance type\nResources:\n  EC2Instance:\n\
  \    Type: AWS::EC2::Instance\n    Properties:\n      InstanceType: **!Ref InstanceType**\n\
  ```\n\n如前述代码块所示，实例类型在启动 EC2 实例时是必需的细节，但它并未硬编码在模板中。相反，它是通过使用 !Ref 内在函数获取存储在参数中的值获得的。这在部署\
  \ CloudFormation 堆栈时提供了额外的灵活性。你可以在模板的任何位置使用 !Ref 内在函数引用参数和资源。\n\n在定义参数时，你必须指定数据类型，如前一代码块第\
  \ 4 行所示。数据类型可以是以下任何类型：\n\n- **String**：字母数字字符 – 例如，MyVPCName。\n- **Number**：可以是整数或浮点数。请注意，虽然\
  \ CloudFormation 会将参数值验证为数字，但当使用 `!Ref` 内在函数在模板中引用时，该值将作为字符串传递。\n- **List\\<Number\\\
  >**：可以是整数或浮点数的数组。\n- **CommaDelimitedLists**：以逗号分隔的字符串列表 – 例如，`test,dev,prod`。\n\
  - **AWS-specific parameter types**：AWS 定义这些类型，有助于捕获用户可能输入的无效值。AWS 会将用户的输入与 AWS 账户中现有值进行验证。例如，`AWS::EC2::VPC::Id`\
  \ 参数类型必须与 AWS 账户中现有的 VPC ID 匹配。\n- **SSM parameter**：这使你能够从 SSM 参数存储中获取参数值。如果 SSM\
  \ 参数来自外部账户共享，则必须提供该参数的完整 ARN。\n\n还可以使用 `Parameters` 部分定义多个附加属性。其中一些属性如下：\n\n- **AllowedPattern**：这使你能够在文本中定义正则表达式（regex），以确保其符合特定模式。这允许你快速验证条目并避免错误。\n\
  - **AllowedValues**：这是可用于定义参数值的允许值数组。\n- **MaxLength**：这是定义 `string` 类型最大字符数的整数值。`MinLength`\
  \ 相反，定义最小字符数。\n- **MaxValue**：这是定义 `number` 类型最大数值的数值。`MinValue` 相反，定义允许的最小数值。\n\
  - **NoEcho**：当你需要防止值在控制台中显示时使用，例如数据库密码。\n\n此外，你还可以使用 AWS CloudFormation 定义的几个伪参数。这些参数是预定义的；你无需在模板中声明它们。这些伪参数包括以下内容：\n\
  \n- **AWS::AccountId**：返回正在创建 CloudFormation 堆栈的 AWS 账户 ID。\n- **AWS::Region**：返回资源正在创建的区域\
  \ – 例如，`us-east-1`。\n- **AWS::StackId**：返回 CloudFormation 堆栈 ID。\n- **AWS::NoValue**：在使用\
  \ `Fn::If` 内在函数时，如果条件评估为 false，则用于删除相应的资源属性。\n\n### 资源\n\nResources 部分是任何 CloudFormation\
  \ 模板中唯一的 **mandatory section**。这很有意义，因为 CloudFormation 模板定义了必须部署的资源。构成堆栈的资源示例包括\
  \ VPC、EC2 实例和 S3 存储桶。\n\nResources 部分的格式在以下片段中显示：\n\n```\nResources:\n  LogicalID:\n\
  \    Type: Resource type\n    Properties:\n      Set of Properties\n```\n\n资源部分包含以下几个组件：\n\
  \n- **Logical ID**：这是你在 CloudFormation 模板中分配给资源的逻辑名称。逻辑名称（ID）必须在整个模板中唯一，以便在必要时引用它们。例如，对于\
  \ Todo List 应用程序，将托管后端应用程序的 EC2 实例的逻辑 ID 可能是 **TodoAppEC2Instance**。某些资源还将被分配物理\
  \ ID。例如，CloudFormation 为后端应用程序部署的 EC2 实例也将具有物理 ID，例如 `i-29f8bg54`。此物理 ID 在 EC2 实例创建后定义，允许你在\
  \ CloudFormation 模板之外引用该资源。\n- **Resource type**：这定义了你希望 CloudFormation 创建的资源类型。例如，对于\
  \ Todo List 应用程序，**TodoAppEC2Instance** 的资源类型将为 **AWS::EC2::Instance。**\n\n\n\n\n\
  \n- **资源属性**：这些是你为资源指定的附加选项。对于 **TodoListAppInstance** 资源，你必须指定以下代码片段中所示的 **Amazon\
  \ Machine Image (AMI) ID**：\n\n```yaml\nResources:\n  TodoListAppInstance:\n   \
  \ Type: \"AWS::EC2::Instance\"\n    Properties:\n      ImageId: \"ami-0ff8a91507f77f867\"\
  \n```\n\n- 请注意，这有一个逻辑名称，后面跟着一个资源类型，将其指定为 EC2 实例。此外，可能需要一个或多个属性来配置资源。在此示例中，AMI ID\
  \ 是 CloudFormation 启动实例所需的一个强制属性。\n- 属性值可以是字面字符串、布尔值、参数、伪引用，甚至是函数返回的值。\n\n## Mappings\n\
  \n通常，你可能需要根据资源部署的方式和位置来定义其属性。这时映射就派上用场了。例如，在启动 EC2 实例时，你必须指定要部署的镜像的 AMI ID。AMI 是区域特定的，这意味着你必须根据部署实例的区域选择正确的\
  \ AMI ID。\n\n**Mappings** 部分使你能够将一个键映射到对应的名称-值对集合。例如，假设你希望根据实例部署的区域以及 EC2 实例使用的计算架构来选择\
  \ AMI ID。在这种情况下，你可以创建一个映射，使用区域名称作为键来定义一组值（在此情况下为 AMI ID），其中包含名称-值对组合。\n\n在下面的代码片段中，请注意基于区域键标识区域名称的\
  \ AMI ID 列表：\n\n```yaml\nMappings:\n  RegionMap:\n    us-east-1:\n      HVM64: ami-0ff8a91507f77f867\n\
  \      HVMG2: ami-0a584ac55a7631c0c\n    us-west-1:\n      HVM64: ami-0bdb828fd58c52235\n\
  \      HVMG2: ami-066ee5fd4a9ef77f1\n    eu-west-1:\n      HVM64: ami-047bb4163c506cd98\n\
  \      HVMG2: ami-0a7c483d527806435\n    ap-northeast-1:\n      HVM64: ami-06cd52961ce9f0d85\n\
  \      HVMG2: ami-053cdd503598e4a9d\n    ap-southeast-1:\n      HVM64: ami-08569b978cc4dfa10\n\
  \      HVMG2: ami-0be9df32ae9f92309\n```\n\n你可以有多个映射，每个映射都需要自己的逻辑名称，如本示例中映射名称为 **RegionMap**。\n\
  \n你可以在映射键中包含包含多个字符串值的名称-值对（us-east-1、us-west-1……等）。例如，在前面的代码片段中，你有键映射到两组名称-值对：一组名为\
  \ HVM64，另一组名为 HVMG2。\n\n一旦你定义了映射，你就可以使用 `Fn::FindInMap` 内在函数根据特定键调用一个值。你也可以引用 **伪参数**\
  \ 来识别详细信息，例如你所在的区域或你部署 CloudFormation 堆栈的 AWS 账户 ID。这可以动态识别信息并根据 **Mappings** 部分中定义的名称-值对自定义你的部署。\n\
  \n在下面的代码片段中，请注意 AMI 的选择基于使用 CloudFormation 模板部署堆栈的区域：\n\n```yaml\nAWSTemplateFormatVersion:\
  \ \"2010-09-09\"\nMappings:\n  RegionMap:\n    us-east-1:\n      HVM64: ami-0ff8a91507f77f867\n\
  \      HVMG2: ami-0a584ac55a7631c0c\n    us-west-1:\n      HVM64: ami-0bdb828fd58c52235\n\
  \      HVMG2: ami-066ee5fd4a9ef77f1\n    eu-west-1:\n      HVM64: ami-047bb4163c506cd98\n\
  \      HVMG2: ami-0a7c483d527806435\nResources:\n  myEC2Instance:\n    Type: \"\
  AWS::EC2::Instance\"\n    Properties:\n      ImageId: !FindInMap [RegionMap, !Ref\
  \ \"AWS::Region\", HVM64]\n      InstanceType: m1.small\n```\n\n你可以使用 `!FindInMap`（YAML\
  \ 格式）函数来识别名为 `RegionMap` 的映射，并提取对应于堆栈部署所在区域的 AMI ID 的值。这是因为你使用 `!Ref AWS::Region`\
  \ 内在函数获取区域信息，然后选择该区域中对应 HVM64 架构的 AMI。\n\n## Conditions\n\n条件允许你在堆栈部署中获得更大的灵活性。你可以根据条件验证为真或假来定义部署中的变化。你可能希望在部署位于开发环境与生产环境时以特定方式配置堆栈。\n\
  \n例如，你可以定义一个 **EnvType** 输入参数，它具有默认值，但也允许你从 dev、test 或 prod 中选择。你也可以使用伪参数来定义预定义条件。\n\
  \n接下来，你可以在模板中定义一个 Conditions 部分，使用内在条件函数来确定关联资源是否创建。最后，你可以将条件与你希望根据条件为真而创建的资源或输出关联。如果条件验证为假，则不会创建资源或输出。\n\
  \n在定义条件时，你必须使用以下条件内在函数之一来验证它：\n\n- `Fn::And`\n- `Fn::Equals`\n- `Fn::ForEach`\n\
  - `Fn::If`\n- `Fn::Not`\n- `Fn::Or`\n\n> **注意**\n> 使用 YAML 格式的模板时，内在函数的语法略有不同。例如，JSON\
  \ 中的 Fn::Equals 在 YAML 中写为 !Equals。\n\n在下面的代码片段中，请注意已设置一个条件，如果 EC2 实例部署在 prod 环境中，它将被配置为具有\
  \ EBS 卷：\n\n```yaml\nAWSTemplateFormatVersion: \"2010-09-09\"\nParameters:\n  EnvType:\n\
  \    Description: Environment type.\n    Default: test\n    Type: String\n    AllowedValues:\
  \ [prod, dev, test]\n    ConstraintDescription: must specify prod, dev, or test.\n\
  Conditions:\n  CreateProdResources: !Equals [!Ref EnvType, \"prod\"]\n  CreateDevResources:\
  \ !Equals [!Ref EnvType, \"dev\"]\nResources:\n  EC2Instance:\n    Type: \"AWS::EC2::Instance\"\
  \n    Properties:\n      ImageId: !FindInMap [RegionMap, !Ref \"AWS::Region\", AMI]\n\
  \      InstanceType: !If [CreateProdResources, c1.xlarge, !If [CreateDevResources,\
  \ m1.large, m1.small]]\n  MountPoint:\n    Type: \"AWS::EC2::VolumeAttachment\"\n\
  \    Condition: CreateProdResources\n    Properties:\n      InstanceId: !Ref EC2Instance\n\
  \      VolumeId: !Ref NewVolume\n      Device: /dev/sdh\n  NewVolume:\n    Type:\
  \ \"AWS::EC2::Volume\"\n    Condition: CreateProdResources\n    Properties:\n  \
  \    Size: 100\n      AvailabilityZone: !GetAtt EC2Instance.AvailabilityZone\n```\n\
  \n在前面的代码片段中，请注意已定义了一个名为 EnvType 的输入参数。此参数允许用户指示此堆栈将部署在开发、测试或生产环境中。\n\n接下来，对于 EC2\
  \ 实例资源，将部署的实例类型为 `c1.xlarge`，如果 `CreateProdResources` 条件使用 `!Equals` 内在函数设置为 true。或者，如果\
  \ `CreateDevResources` 条件为 true，则只有 `m1.large` 或 `m1.small` 实例类型可用。\n\n*MountPoint*\
  \ 和 *NewVolume* 资源与 `CreateProdResources` 条件语句相关联，仅在 `EnvType` 参数设置为 `prod` 时创建。\n\
  \n## Transforms\n\n`Transform` 部分是另一个可选部分，指定 CloudFormation 可用于处理模板的一个或多个宏。宏按定义的顺序执行。\n\
  \n这些宏可以执行简单任务或对模板进行更广泛的转换。你也可以引用存储在其他地方的代码，例如 Amazon S3 存储桶或 Lambda 函数中。\n\n你可以使用\
  \ AWS 提供和托管的宏，例如以下内容：\n\n- `AWS::Serverless`：此转换将使用 **AWS Serverless Application\
  \ Model (AWS SAM)** 语法构建的模板转换为兼容的 CloudFormation 模板。\n- `AWS::Include`：此转换可与与主 CloudFormation\
  \ 模板分开存储的模板片段一起使用。\n\n## Outputs\n\nOutputs 部分也是另一个可选部分。此部分允许你在创建和配置 CloudFormation\
  \ 根据模板构建的资源时声明输出值。这在你需要识别已创建的资源时通常很有用。\n\n在下面的示例代码片段中，输出名为 LoadBalancerDNSName 返回具有逻辑\
  \ ID 的资源的 DNS 名称：\n\n```yaml\nOutputs:\n  LoadBalancerDNSName:\n    Description:\
  \ The DNS Name of the backup load balancer\n    Value: !GetAtt LoadBalancer.DNSName\n\
  ```\n\n请注意使用了另一个内在函数 `Fn::GetAtt`（YAML 中为 `!GetAtt`）。此内在函数返回模板中资源的属性值。该函数有两个组成部分，如下所示：\n\
  \n`!GetAtt logicalNameOfResource.attributeName`\n\n- `logicalNameOfResource`：这是包含你需要引用的属性的资源的逻辑\
  \ ID。\n- `attributeName`：这是你想要值的资源特定属性。\n\n resulting 输出值也可以用作其他堆栈的输入值（如果先导出它们）。这也允许你创建\
  \ **跨堆栈** 引用。跨堆栈引用带来诸多好处，使你能够轻松定义可被其他堆栈引用的 **共享资源**。这允许你以服务导向的方式构建堆栈组件并创建可轻松重用的资源。\n\
  \n在编写 Outputs 部分时，你需要导出资源值，然后其他堆栈可以导入它，如以下代码片段所示：\n\n```yaml\nOutputs:\n  LogicalID:\n\
  \    Description: Information about the Value\n    Value: Value to return\n    Export:\n\
  \      Name: Name of resource to Export\n```\n\n\n\n例如，你可以创建一个堆栈（Stack），用于构建共享的\
  \ VPC 并创建诸如公有子网和安全组等资源。然后，可以将子网 ID 和安全组 ID 作为该堆栈的输出进行导出。接下来，你可以构建另一个堆栈，用于在同一 VPC\
  \ 中部署 EC2 实例，以托管你的应用程序。在第二个堆栈中，你需要导入确保 EC2 实例部署在正确的子网中并附加到相关安全组所需的 VPC ID、子网 ID\
  \ 和安全组 ID。下图说明了这一概念。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_567_0.png)\n\n\
  在使用跨堆栈模板时，你需要使用 `Fn::ImportValue` 将所需的值导入正在构建的第二个堆栈中。\n\n最终，`Outputs` 部分使你能够轻松获取已创建的资源详情，这在跨堆栈\
  \ CloudFormation 配置中经常用到。\n\n在下一节中，你将了解一种名为 CloudFormation 能力（Capabilities）的安全特性。当你使用\
  \ CloudFormation 创建特定资源时，这一特性会发挥作用，你需要确认某些类型的资源将被创建，作为一种安全措施。\n\n## CloudFormation\
  \ 能力（Capabilities）\n\n通常，你可能需要创建特定资源，但即使你有权限这样做，你仍然必须向 CloudFormation *确认* 你正在创建此类资源。这更多的是出于安全和确保你知晓模板正在创建的资源类型的目的。\n\
  \n以下截图演示了 AWS 要求此类确认的过程。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_568_0.png)\n\
  \n图 13.3：AWS CloudFormation 能力（Capabilities）\n\n在这里，你会注意到资源需要 `AWS::IAM::ManagedPolicy`\
  \ 能力，且用户被提示确认此能力。\n\n在使用 CLI 部署 CloudFormation 模板时，你可以使用 `--capabilities` 选项来确认堆栈将创建影响你的\
  \ AWS 账户权限的资源，例如创建 **AWS 身份和访问管理（IAM）** 用户或角色。\n\n有三个你可以指定的能力选项：\n\n- `CAPABILITY_IAM`：如果你的堆栈将影响\
  \ IAM 资源，例如创建 IAM 用户，则需要此选项。\n- `CAPABILITY_NAMED_IAM`：如果你为要创建的 IAM 资源提供了自定义名称，则需要此选项。\n\
  - `CAPABILITY_AUTO_EXPAND`：如果你使用模板宏，例如 `AWS::Serverless` 转换宏（它将**无服务器应用程序模型（SAM）**\
  \ 模板转换为 CloudFormation 模板），则需要此选项。\n\n在下一节中，你将了解 CloudFormation 的一个称为变更集（Change\
  \ Sets）的功能。通常，你可能需要更新或修改现有堆栈中的资源。此功能使你在实施更改之前可以直观地查看变更，并可作为你整体变更管理流程的一部分。\n\n##\
  \ CloudFormation 变更集（Change Sets）\n\n通常，你可能需要更新和修改之前使用 CloudFormation 模板部署的基础架构。你可以创建**变更集**并要求\
  \ CloudFormation 更新堆栈。你可以提供修改后的模板或输入参数值，以向堆栈提交变更。\n\n在执行任何更新之前，CloudFormation 会通知你更新模板中提议的变更。一些变更将终止并替换现有资源，例如，如果你更改了\
  \ EC2 实例的可用区。其他变更可能只需要修改现有资源。一些修改可以在不中断资源的情况下进行，而另一些则可能导致中断。使用变更集，你可以查看变更将如何影响你的资源，并确认你是否仍想继续实施变更，或在推出更新前对模板进行进一步修改。\n\
  \n以下代码块中的 CloudFormation 模板允许你部署单个 EC2 实例。由于我们没有指定其他参数值，EC2 实例将部署在默认 VPC、默认子网以及\
  \ us-east-1a 可用区中：\n\n```\nResources:\n  MyInstances:\n    Type: AWS::EC2::Instance\n\
  \    Properties:\n      AvailabilityZone: us-east-1a\n      ImageId: ami-07caf09b362be10b8\n\
  \      InstanceType: t2.micro\n```\n\n注意，正在创建的资源是一个 EC2 实例。Properties 部分详细说明了实例将部署的可用区、将使用的\
  \ AMI ID 以及实例类型。\n\n部署此模板并创建 CloudFormation 堆栈将产生如以下截图所示的事件。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_569_0.png)\n\
  \n图 13.4：CloudFormation 堆栈创建事件\n\n假设你现在意识到应该将此实例部署在 us-east-1b 可用区中。你可以创建一个具有修改后模板的变更集。根据你请求的变更，CloudFormation\
  \ 要么添加新资源，要么修改现有资源，这可能要求删除并替换现有资源。\n\n在以下 CloudFormation 模板片段中，注意可用区从 us-east-1a\
  \ 更改为 us-east-1b：\n\n```\nResources:\n  MyInstances:\n    Type: AWS::EC2::Instance\n\
  \    Properties:\n      AvailabilityZone: us-east-1b\n      ImageId: ami-07caf09b362be10b8\n\
  \      InstanceType: t2.micro\n```\n\n上传此修改后的模板并请求变更集，将允许你查看变更将如何影响资源，如以下截图所示。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_570_0.png)\n\n图 13.5 – CloudFormation\
  \ 变更选项卡，详细说明了执行变更的结果动作\n\n在接受并执行变更集后，AWS CloudFormation 将在 us-east-1b 中部署新实例，并终止\
  \ us-east-1a 中的现有 EC2 实例。以下截图说明了执行此变更集后发生的事件：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_571_0.png)\n\
  \n图 13.6 – 由变更集执行产生的 CloudFormation 事件\n\n注意，CloudFormation 模板作为更新过程的一部分创建新实例，然后作为清理过程的一部分删除\
  \ us-east-1a 中的现有实例。\n\n在下一节中，你将了解 CloudFormation 的一个称为回滚（Rollbacks）的功能。\n\n## CloudFormation\
  \ 回滚（Rollbacks）\n\n你的 CloudFormation 部署可能因模板错误、缺失或配置详情不正确，或简单如引用了不正确的资源（如错误的 AMI\
  \ ID）而失败。在这些情况下，你需要一种机制来回滚你的部署，以便返回到干净的状态。\n\nAWS CloudFormation 提供了一套复杂的回滚功能，允许你选择在堆栈部署失败时采取何种行动，如以下截图所示。\n\
  \n堆栈故障选项\n\n配置失败时的行为\n指定堆栈故障的回滚行为。了解更多\n\n- [x] 回滚所有堆栈资源\n  将堆栈回滚到最后已知的稳定状态。\n-\
  \ [ ] 保留成功配置的资源\n  保留成功配置的资源状态，同时将失败的资源回滚到最后已知的稳定状态。没有最后已知稳定状态的资源将在下一次堆栈操作中删除。\n\
  \n在回滚期间删除新创建的资源\n指定在失败操作期间创建的资源是否应删除，而不管其删除策略如何。了解更多\n\n- [x] 使用删除策略\n  根据附加的删除策略保留或删除已创建的资源。\n\
  - [ ] 删除所有新创建的资源\n  在回滚期间删除创建的资源，而不管其附加的删除策略如何。\n\n图 13.7：堆栈故障选项\n\n根据图 13.7，你可以让堆栈回滚到最后已知的稳定状态，这将导致删除任何新创建的资源。或者，你可以保留任何成功配置的资源，同时将失败的资源回滚到其之前的状态。\n\
  \n有时，在执行更新时，堆栈可能进入 UPDATE_ROLLBACK_FAILED 状态，因为 CloudFormation 无法在完成失败的更新时回滚所有变更。一个例子是，当你试图回滚到旧的数据库实例，但该实例之前已在\
  \ CloudFormation 管理流程之外被手动删除。由于 CloudFormation 无法回滚到它预期的前一个数据库实例，这可能导致回滚尝试失败。在大多数情况下，你需要修复导致更新回滚失败的错误，然后才能继续回滚操作。\n\
  \n通常，当你删除 CloudFormation 堆栈时，该过程会删除所有已创建的资源。有时，即使项目结束，你可能需要保留某些资源，例如后端数据库。在这种情况下，你可以配置删除策略，这在下一节中讨论。\n\
  \n## CloudFormation 删除策略属性（Deletion Policy Attribute）\n\n在删除 CloudFormation 堆栈时，默认行为是删除其所有资源。由于此行为是默认设置，因此没有必要定义此删除策略。\n\
  \n\n\n\n不过，即使删除了堆栈，您可能仍希望保留某些资源，因为根据合规性或备份要求，您需要存储作为项目一部分生成或收集的数据。例如，即使删除了创建该存储桶的堆栈，您可能仍希望保留用于存储已上传数据的\
  \ S3 存储桶。在这种情况下，您可以配置删除策略以在删除堆栈后保留 S3 存储桶。下面的代码片段展示了一个云formation 代码示例来说明此配置：\n\n\
  ```\nAWSTemplateFormatVersion: '2010-09-09'\n  Resources:\n    myS3Bucket:\n   \
  \   Type: AWS::S3::Bucket\n      DeletionPolicy: Retain\n```\n\n以下是您可以配置的四种删除策略选项：\n\
  \n- **Delete**：这是删除堆栈时的默认配置，您无需指定 DeletionPolicy。不过，您应注意，对于某些资源，默认策略设置为 Snapshot，例如\
  \ AWS::RDS::DBCluster 和 AWS::RDS::DBInstance。\n- **Retain**：当堆栈被删除时，CloudFormation\
  \ 将保留资源而不是删除它们。您需要在该模板的资源类型中添加删除策略。\n- **RetainExceptOnCreate**：这与 Retain 类似，但如果堆栈操作创建了该资源然后需要回滚，CloudFormation\
  \ 将删除该资源。在堆栈删除操作中，CloudFormation 将保留该资源。\n- **Snapshot**：这适用于支持快照的资源。CloudFormation\
  \ 将在删除资源之前创建快照。RDS DB 实例和 RDS DB 集群就是此类资源的示例。\n\n> **重要提示**\n> 对于 Amazon S3 存储桶，只有当存储桶为空时，设置为\
  \ delete 的删除策略才有效。通常，您可能会发现堆栈因 S3 存储桶非空而删除失败，因此，您必须手动清空存储桶或配置自定义资源，这将在本章后续部分讨论。\n\
  \n有时，当 CloudFormation 没有您所需的资源类型时，您可能需要创建自定义资源。这也可以包括在 CloudFormation 模板中配置自定义逻辑。在下一节中，您将了解有关自定义资源的更多信息。\n\
  \n# CloudFormation 自定义资源\n\n当您需要定义目前 CloudFormation 中不可用的资源类型时，可以使用自定义资源。当您需要为 CloudFormation\
  \ 堆栈的创建、更新或删除定义自定义逻辑时，也可以使用自定义资源。\n\n要定义自定义资源，您需要使用模板中的 AWS::CloudFormation::CustomResource\
  \ 或 Custom::MyCustomResourceTypeName 资源类型。\n\n例如，如果您需要在堆栈删除请求的一部分中删除 Amazon S3 存储桶，您必须首先确保\
  \ S3 存储桶是空的。如果 S3 存储桶包含任何对象，删除请求将失败。在这种情况下，您可以定义一个自定义资源，首先调用一个 Lambda 函数来清空 S3 存储桶，以便您可以执行存储桶删除操作。\n\
  \n在构建自定义资源时，您将定义一个属性，即服务令牌（service token），指定 CloudFormation 应发送请求的位置，例如 Lambda 函数的\
  \ ARN。请注意，服务令牌必须位于您创建堆栈的同一区域中。下面的代码片段展示了这一点。\n\n```\nResources:\n  MyCustomResources:\n\
  \    Type: AWS::CloudFormation::CustomResource\n    Properties:\n      ServiceToken:\
  \ String\n```\n\n通常，您可能需要模板中的逻辑来确保某些资源在其他资源之前创建。在此示例中，您必须确保在删除 S3 存储桶之前先将其清空。在这里，您可以使用\
  \ DependsOn 属性。当您向资源添加 DependsOn 属性时，该资源仅在 DependsOn 属性中指定的资源创建之后才会创建。因此，在我们的示例中，S3\
  \ 存储桶的删除将依赖于先调用 Lambda 函数以清空 S3 存储桶的自定义资源。\n\n在下一节中，您将了解 CloudFormation 的另一个功能，称为嵌套堆栈。\n\
  \n# CloudFormation 嵌套堆栈\n\n嵌套堆栈对于跨多个账户和区域快速部署基础设施和应用程序组件非常有用。此外，它们允许您确保使用集中定义的模板集来描述和配置其他位置的资源。\n\
  \n在 AWS 上构建基础设施资源时，您可能会重复使用作为整体架构一部分的通用组件。例如，在部署应用程序解决方案的 EC2 实例时，您首先需要配置 VPC、一些子网以及与实例关联的安全组。\n\
  \n这里的一个重要说明是，对于您创建的每个 CloudFormation 堆栈，每个堆栈最多限制为 500 个资源。在高度复杂的堆栈中，您可能会发现这一限制是个问题。此外，由一个堆栈创建的资源可能无法在另一个堆栈中使用。例如，在以\
  \ Todo Plus Limited 为现实世界的示例中，您会为开发、测试和生产等各个环境希望拥有不同的 CloudFormation 堆栈。您不希望将开发环境中创建的\
  \ VPC 组件用于生产工作负载。最终，每个堆栈的生命周期会有所不同，您绝对希望隔离各个环境。\n\n与其重复添加通用组件（如 VPC、子网和安全组）的配置，您可以为这些组件创建专用模板，并从主\
  \ CloudFormation 模板中引用这些模板。例如，您可以创建定义 VPC 配置的单独模板，并从主应用程序堆栈中引用它，而不是在主应用程序堆栈模板中包含\
  \ VPC 配置。这允许您在为任意数量的解决方案创建的多个堆栈中重用相同的 VPC 模板。这些被称为嵌套堆栈。嵌套堆栈还可以包含其他嵌套堆栈，这意味着您可以构建堆栈层次结构。下面的图说明了嵌套堆栈的概念。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_575_0.png)\n\n图 13.8：嵌套堆栈示例\n\n嵌套堆栈可以使用\
  \ AWS::CloudFormation::Stack 资源创建。此资源所需的唯一属性是 TemplateURL，这是 CloudFormation 知道如何查找资源模板的方式。\n\
  \n在构建嵌套堆栈时，根堆栈是包含所有嵌套堆栈的顶层堆栈。此根堆栈也称为父堆栈。子堆栈可以具有进一步的嵌套堆栈，对于这些堆栈，子堆栈将成为父堆栈，依此类推。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_577_0.png)\n\n促进使用 StackSets 的一个关键组件是使用\
  \ IAM 角色，以确保在目标账户和区域中部署堆栈所必需的权限存在。您可以使用自管理权限或服务管理权限创建 StackSets：\n\n- 自管理权限：您创建并配置必要的\
  \ IAM 角色，以在管理账户和目标账户之间建立信任关系。\n- 服务管理权限：您将堆栈实例部署到由 AWS Organizations 管理的账户中。这阻止您手动创建和管理自己的\
  \ IAM 角色，并简化了在未来创建的账户中部署堆栈的过程。\n\nStackSets 的一个基本组件是堆栈实例。这指的是目标账户中的堆栈，允许 StackSets\
  \ 在目标账户中部署堆栈。堆栈实例包含有关目标账户中堆栈的信息。如果目标账户中无法创建堆栈，堆栈实例可以在没有堆栈的情况下存在。在这种情况下，堆栈实例将显示失败的原因。\n\
  \n在下一节中，您将了解有关 CloudFormation 堆栈角色的更多信息。请记住，在 AWS 上，除非您明确授予权限，否则不允许执行任何操作，CloudFormation\
  \ 也不例外。\n\n\n\n\n\n## CloudFormation 堆栈角色\n\n在部署 CloudFormation 堆栈时，该服务使用登录到 AWS\
  \ 账户的 IAM 主体的身份来执行必要的堆栈操作，例如创建、更新或删除。因此，IAM 主体必须通过附加到其上的策略（或用户所属的组）拥有所需的权限，或通过承担角色获得。\n\
  \n通常，在大型组织中，您可能需要将创建和更新堆栈的能力分配给团队成员，而这些成员不应拥有创建和管理构成堆栈的各个资源的完全访问权限。例如，您可能有一个帮助台团队，可以授予其部署\
  \ CloudFormation 堆栈的能力，但他们不得在 CloudFormation 之外单独部署堆栈的资源。在此场景中，您可以为 CloudFormation\
  \ 配置服务角色。使用服务角色，您可以确保遵循最小权限原则。流程如下：\n\n- 管理员创建一个 IAM 角色，该角色授予创建 CloudFormation 堆栈所需的资源所需的权限。管理员必须创建信任策略，其中受信任实体为\
  \ CloudFormation 服务，如以下策略代码所示：\n\n  ```\n  {\n    \"Version\": \"2012-10-17\",\n\
  \    \"Statement\": {\n      \"Effect\": \"Allow\",\n      \"Principal\": {\"Service\"\
  : \"cloudformation.amazonaws.com\"},\n      \"Action\": \"sts:AssumeRole\"\n   \
  \ }\n  }\n  ```\n\n- 然后必须授予帮助台员工使用 CloudFormation 创建、更新或删除堆栈的权限，并确保 CloudFormation\
  \ 拥有配置资源的权限。帮助台团队应被分配使用 `iam:PassRole` 操作将 IAM 角色传递给 CloudFormation 的权限，如以下代码片段所示：\n\
  \n  ```\n  {\n    \"Sid\": \"AllowPassingAppRoles\",\n    \"Effect\": \"Allow\"\
  ,\n    \"Action\": \"iam:PassRole\",\n    \"Resource\": \"arn:aws:iam::<account\
  \ ID>:role/cfnroles/*\"\n  }\n  ```\n\n使用 CloudFormation 堆栈角色，您可以增加一层安全性，以确保只有授权人员可以直接操作资源。其他可能需要部署基础设施组件的用户只能通过\
  \ AWS CloudFormation 进行部署。\n\n到目前为止，我们已详细介绍了 AWS CloudFormation，探讨了在构建和设计云基础设施时如何采用强大的\
  \ IaC 解决方案，使用可重复和可再现的方法来提高效率、安全、速度和敏捷性。\n\n在下一节中，我们将转向 AWS CDK。该服务允许您使用高级库在流行的编程语言中开发云应用程序及其相关基础设施。\n\
  \n## AWS CDK 概述\n\nAWS Cloud Development Kit（CDK）是一个软件开发框架，用于以代码形式定义云基础设施并通过 AWS\
  \ CloudFormation 进行配置。借助 CDK，开发人员可以使用熟悉的编程语言，包括 TypeScript、Python、Java 和 C#，来定义其基础设施。CDK\
  \ 使用熟悉的编程结构，例如类和对象，来定义云资源，使开发人员更容易使用和理解。\n\nCDK 为 AWS 服务提供了一个高级、面向对象的接口，使开发人员能够以比传统\
  \ CloudFormation 模板更抽象、更简洁的方式定义其基础设施。例如，而不是在 JSON 或 YAML 文件中指定 EC2 实例的属性，开发人员可以使用其首选编程语言中的类和对象来定义实例。\n\
  \nCDK 还提供了一组构造，它们是用于定义基础设施的预写、可重用的构建块。构造包括从 EC2 实例和 RDS 数据库等基本组件到 Auto Scaling 组和负载均衡器等更复杂组件的一切。使用构造可以更轻松、更快地定义基础设施，并减少需要编写的代码量。\n\
  \nCDK 的另一个好处是与 AWS CLI 和其他 AWS 工具的集成，包括 AWS CloudFormation、AWS CloudWatch 和 AWS\
  \ CodeDeploy。这种集成允许开发人员使用其首选工具和工作流程来管理其基础设施，并有助于确保其开发和生产环境之间的一致性和稳定性。\n\nAWS CDK\
  \ 的主要组件如下：\n\n- **构造**：构造是应用程序的组件，表示由 CloudFormation 创建的一个或多个资源。例如，构造可以表示您的 EC2\
  \ 实例或 RDS 数据库实例。您将构造定义为导入到 CDK 应用程序中的类。您可以从 AWS Constructs 库访问预定义的构造，创建自己的构造或使用第三方构建的构造。\n\
  - **堆栈**：堆栈是 CDK 中作为单个单元创建和管理的 AWS 资源集合。它们可以包含一个或多个构造，并用于定义和管理云中特定的一组资源。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_581_0.png)\n\
  \n图 13.10 – 生产 VPC 的架构参考\n\n您的 CloudFormation 堆栈的关键组件如下：\n\n- VPC 使用 10.10.0.0/16\
  \ 的 CIDR 范围进行配置。请记住，您在开发账户中为 VPC 使用的 CIDR 范围是 10.0.0.0/16。建议您的 VPC 不要使用重叠的 IP 地址，以确保在需要时可以建立\
  \ VPC 对等连接。\n- CloudFormation 模板定义了一个互联网网关，然后将其附加到 VPC。\n- 配置包括六个子网——跨两个可用区的两个公有子网和四个私有子网（两个用于计算资源，如\
  \ EC2、ECS 等，两个用于数据库资源）。\n- 模板中声明了一个 NAT 网关，以实现私有子网中计算资源对互联网的安全访问。请注意，在本实验项目中，您只会部署单个\
  \ NAT 网关以尽量减少成本，因为这是收费服务。AWS 建议您每个 AZ 部署一个 NAT 网关。\n- 路由表用于确保流量在 VPC 中路由到正确的端点，并与其相关子网关联。虽然不是绝对必要，但模板为每个子网定义了一个路由表。\n\
  - 然后在模板中声明安全组，以确保对内部资源的流量按端口/协议和源进行限制。\n\n此处的意图是展示您如何使用 CloudFormation 模板快速部署基础设施，并让您了解如何快速准确地跨多个账户为不同环境部署解决方案。\n\
  \n## 技术要求\n\n请记住，您在创建 Todo Plus 生产账户时并未使用 AWS Organizations 服务登录该账户，因此您需要导航到 AWS\
  \ 管理控制台的主登录页面，并为生产账户的根用户请求密码重置，如图 13.11 所示。具体来说，您必须提供与 AWS 账户根用户关联的电子邮件地址。\n\n另外，请确保从以下链接的\
  \ GitHub 仓库下载 CloudFormation 模板并将其保存在桌面本地：https://packt.link/xM0tt\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_582_0.png)\n\
  \n图 13.11 – 请求重置您的生产账户密码\n\n重置根用户密码后，您可以登录并为生产账户创建一个具有完全管理权限的新 IAM 用户。建议您首先创建一个名为\
  \ **ProdAdmins** 的 IAM 组，将 **AdministratorAccess** IAM 策略分配给该组，然后创建一个属于该组 IAM 用户的\
  \ IAM 用户。为清晰起见，您可以将此 IAM 用户称为 **Bob**，因为 *Alice* 是开发账户的高级管理员。\n\n要创建名为 Bob 的 IAM\
  \ 用户，请按照 *第 2 章《使用 AWS Identity and Access Management 安全访问》中的练习 2.1* 中的说明进行操作，确保\
  \ IAM 用户的名称设置为 **Bob**。\n\n创建 Bob IAM 用户后，请以根用户身份退出生产账户，然后以 Bob IAM 用户身份再次登录，然后再继续项目任务。\n\
  \n## 项目任务 13.1：为 VPC 堆栈创建 CloudFormation 模板\n\n现在您可以按照以下步骤为 VPC 堆栈创建 CloudFormation\
  \ 模板：\n\n1. 以 Bob IAM 用户身份登录您的 Todo Plus 生产账户（按照 *技术要求* 部分中的说明进行操作）。\n2. 在顶部搜索栏中搜索并导航到\
  \ CloudFormation 控制台。\n3. 单击 **Create stack** 按钮。\n4. 在 **Prerequisite – Prepare\
  \ template** 部分，确保选择 **Choose an existing template**。\n5. 在 **Specify template**\
  \ 部分选择 **Update a template file** 选项。\n6. 单击 **Choose file** 按钮下的 **Upload a template\
  \ file**，如下图所示。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_583_0.png)\n\n图 13.12\
  \ – 选择 Choose file 按钮以上传您从 GitHub 仓库下载的模板\n\n\n\n\n\n7. 在出现的对话框中，导航到您从 GitHub 仓库下载模板的位置，然后选择\
  \ `todo-plus-final.yaml` 文件。AWS CloudFormation 服务将自动预置一个 S3 存储桶并将文件上传到该存储桶。\n8.\
  \ 单击**下一步**。\n9. 为您的堆栈提供一个描述性名称。\n10. 请注意，默认的 **EnvironmentName** 值为 **todo-plus-production**，您可以更改。您也可以更改默认的\
  \ CIDR 范围，但请确保您的子网正确定义为 VPC CIDR 范围的子集。单击**下一步**。\n11. 将所有其他设置保留为默认值，然后点击**下一步**。\n\
  12. 在**审核并创建**步骤中查看配置，然后点击页面底部的**提交**。\n13. CloudFormation 现在将按照模板中的说明预置您的堆栈，您的堆栈将进入\
  \ **CREATE_IN_PROGRESS** 阶段，如下图所示。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_584_0.png)\n\
  \n图 13.13：CloudFormation CREATE_IN_PROGRESS 事件\n\n14. 几分钟之内，CloudFormation 将预置您的\
  \ VPC 及其所有组件。您可以在堆栈的**事件**选项卡中监控进度。完成后，您将看到 VPC 的 **CREATE_COMPLETE** 状态，如下图所示。\n\
  \n| 时间戳 | 逻辑 ID | 状态 | 详细状态 |\n|---|---|---|---|\n| 2024-05-07 12:40:07 UTC+0530\
  \ | Todo-List-App-Prod | CREATE_COMPLETE | |\n| 2024-05-07 12:40:06 UTC+0530 | DefaultPrivateRoute1\
  \ | CREATE_COMPLETE | |\n| 2024-05-07 12:40:06 UTC+0530 | DefaultPrivateRoute4 |\
  \ CREATE_COMPLETE | |\n\n图 13.14：CREATE_COMPLETE 状态\n\n15. 单击**输出**选项卡查看已创建的各种 VPC\
  \ 组件的输出信息。您也可以在 VPC 控制台中查看这些组件，如下图所示。\n\n| 名称 | 子网 ID | 状态 |\n|---|---|---|\n| todo-plus-production\
  \ Private Subnet (for compute EC2/ECS etc) (AZ1) | subnet-020488e715af36... | 可用\
  \ |\n| todo-plus-production Private Subnet (for compute EC2/ECS etc) (AZ2) | subnet-00a896326dcd...\
  \ | 可用 |\n| todo-plus-production Private Subnet (for database) (AZ1) | subnet-0b4d7b613b6be...\
  \ | 可用 |\n| todo-plus-production Private Subnet (for database) (AZ2) | subnet-09ffc27897e21d...\
  \ | 可用 |\n| todo-plus-production Public Subnet (AZ1) | subnet-0b4a8f94d5a5c0...\
  \ | 可用 |\n| todo-plus-production Public Subnet (AZ2) | subnet-0639973a767fb... |\
  \ 可用 |\n\n图 13.15：Todo Plus Production VPC 的子网\n\n16. 在您查看完 VPC 及其各种组件后，建议删除堆栈以删除\
  \ VPC，避免产生不必要的费用。\n\n## 项目任务 13.2：删除 CloudFormation 堆栈\n\n以下步骤将帮助您删除 CloudFormation\
  \ 堆栈：\n\n- 1. 在仍以 Bob 身份登录 AWS 生产账户的情况下，导航到 CloudFormation 控制台。\n- 2. 在左侧菜单中，单击**堆栈**。\n\
  - 3. 在右侧窗格中，选择您刚刚创建的堆栈。\n- 4. 单击**堆栈**窗格右上角的**删除**按钮。\n- 5. 在出现的对话框中，单击**删除**按钮进行确认。\n\
  - 6. 您的 CloudFormation 堆栈现在将被删除，同时会移除 VPC 及其各种资源。您可以通过导航到**事件**选项卡并查看删除事件来审查删除过程。\n\
  - 7. 在下一节中，您将找到本章关键点的总结。\n\n## 总结\n\n本章涵盖了两个用于以基础设施即代码方式管理基础设施的关键 AWS 服务。CloudFormation\
  \ 允许您使用 YAML 或 JSON 模板定义和部署 AWS 资源。AWS CDK 是一个软件开发框架，用于以代码定义云基础设施，并通过 AWS CloudFormation\
  \ 进行预置。\n\n本章解释了 CloudFormation 和 AWS CDK 的主要组件，并提供了一个示例 CloudFormation 模板，该模板创建了一个包含子网、网关、路由表和安全组的\
  \ VPC。\n\n本章还重点介绍了使用 CloudFormation 的一些最佳实践，例如在部署前定义和测试模板、创建更改集，以及针对不同配置选项的策略（如\
  \ StackSets 和嵌套堆栈），并详细讨论了 CloudFormation 模板的结构。\n\nCloudFormation 和 CDK 可以帮助您在几分钟内创建可重复、可复现的应用程序和基础设施解决方案。您可以避免配置漂移，并确保您的环境按预期构建。此外，您还可以在部署中实施治理和安全。\n\
  \n2. 登录后，您将看到一个类似于图 13.17 所示的页面：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_588_0.png)\n\
  \n图 13.17 – 第 13 章章节复习题\n\n3. 准备好后，开始以下练习，多次重新尝试测验。\n\n## 考试准备练习\n\n前三次尝试，不用担心中间的时间限制。\n\
