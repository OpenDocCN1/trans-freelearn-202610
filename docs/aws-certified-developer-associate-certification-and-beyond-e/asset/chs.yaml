  \ 34 秒 |\n| 尝试 7 | 76% | 14 分 44 秒 |\n\n表 1.1 – 在线平台上的时间掌控练习示例\n\n> **注意**\n> 上表中显示的时间限制只是示例。根据网站上测验的时间限制，为每次尝试设置自己的时间限制。\n\
