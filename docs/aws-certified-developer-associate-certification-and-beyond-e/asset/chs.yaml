- "# 使用 AWS 身份和访问管理保护访问\n\n保护 AWS 托管的应用程序免受未经授权的访问对任何企业都至关重要。作为一个组织，你必须确保只有经过授权的实体才能对你的工作负载进行身份验证。此外，这些实体只能被允许创建和管理资源，并执行其获授权的任务。这个概念就是**最小权限原则（POLP）**，它是构建安全环境的基础。本章将教你为什么身份验证和授权服务至关重要。你将理解提供各种访问选项以对内部用户进行身份验证的重要性，并且在需要时，根据应用程序用例提供匿名的公共访问。\n\
  \n在本章中，你将学习 AWS 提供的基础安全服务之一：**身份和访问管理（IAM）**。你将学习如何创建用户、组和角色，以及如何使用 IAM 策略授予访问服务和配置资源的权限。你还必须了解的另一项服务称为\
  \ **IAM Identity Center**（以前称为 **AWS Single Sign-On**）。除其他功能外，此服务最适合让你的技术用户从单个门户访问多个\
  \ AWS 账户。此外，你还可以使用你的员工可能正在使用的现有第三方**身份提供商（IdPs）** 对 AWS 平台进行身份验证——这被称为**身份联合**。\n\
  \n本章还探讨了 **Amazon Cognito** 服务，这是一个无服务器且完全托管的身份管理系统，可以为你的 Web 或移动应用程序提供身份验证和授权功能。本章旨在让你掌握必要的知识，以利用\
  \ AWS 安全服务构建可靠、健壮且安全的云架构。任何有云雄心的企业都不可避免地会面临类似的挑战。你的架构设计模式必须始终遵循一个简单的原则——“安全设计”。\n\
  \n\n\n\n\n本章讨论的主题属于 AWS 认证开发者助理考试指南中的 *Domain 2: Security*。具体来说，它涵盖 *Task Statement\
  \ 1: Implement authentication and/or authorization for applications and AWS services.*\n\
  \n本章涵盖的主题如下：\n\n- Introduction to IAM\n- Improving your security posture with **multifactor\
  \ authentication (MFA)**\n- Accessing AWS accounts using identity federation with\
  \ **Security Assertion Markup Language 2.0 (SAML 2.0)** and Microsoft **Active Directory\
  \ (AD)**\n- Using web identity federation for application authentication\n- Application\
  \ authentication and authorization with Amazon Cognito\n- Using AWS **Security Token\
  \ Service (STS)** to create and manage temporary tokens\n- Overview of the AWS IAM\
  \ Identity Center\n- Exercise 2.1 – creating an IAM user and an IAM group within\
  \ your developer account\n- Project task – creating an Amazon Cognito user pool\
  \ for the Todo List application\n\n在上一章讨论的业务场景的基础上，您将在本章中了解如何保护您的 AWS 账户。就我们的客户\
  \ **TodoPlus** Limited 而言，AWS IAM 可用于为用户和应用程序创建 IAM 用户、组和角色，并使用策略指定他们在 AWS 账户中被允许执行的操作。这些策略可以细化以遵循\
  \ POLP，仅授予执行任务所需的必要访问权限。\n\n通过利用这些 IAM 功能，**TodoPlus** Limited 可以确保其 AWS 环境和任务管理应用程序的安全性和完整性，这是建立用户信任和确保应用程序成功的关键方面。\n\
  \n**TodoPlus** Todo List 应用程序也需要以安全为出发点进行设计。希望订阅该应用程序的终端用户需要能够注册和登录。Amazon Cognito\
  \ 可用于帮助构建 Todo List 应用程序的强大且安全的终端用户身份验证和授权机制。\n\n## Introduction to IAM\n\n每个组织都有其独特的工具、系统、环境、项目和核心功能。在组织内部，存在许多人员群体、部门和业务单元共享相同的服务。然而，每个群体根据其在组织中的职能和角色，需要对这些服务拥有不同级别的访问权限。\n\
  \n例如，开发人员需要访问开发环境，以便他们能够试验和设计新的应用程序功能，而他们对生产环境的访问必须受到限制。同样，初级系统管理员只能被允许执行某些任务，而不能对关键工作负载拥有完全的管理权限。\n\
  \n在本节中，您将了解 AWS IAM 以及它如何用于实施云安全的重要元素。AWS IAM 是一项完全托管的服务，可帮助您定义谁或什么可以访问您的 AWS 账户，可以访问哪些服务，可以创建和配置哪些资源。通过\
  \ AWS IAM，您可以为 IAM 用户、组和角色配置特定的权限，这些权限可由人类用户或应用程序等实体使用以与您的 AWS 账户交互。\n\n### But\
  \ First, Let’s Talk about the Root User\n\n当您创建 AWS 账户时，会自动配置一个 root 用户。它是您 AWS\
  \ 账户的主要所有者，并且有权关闭账户。由于其对 AWS 账户拥有完全不受限制的访问权限，因此确保您保护此账户并妥善保管其凭证至关重要。\n\n> **Best\
  \ practice**\n>\n> 作为最佳实践，不建议将 root 用户账户用于日常操作。AWS 建议您创建单独的个人 IAM 用户（稍后会讨论），并赋予其执行履行其工作职能所需的所有任务的足够权限。\n\
  \n### What Are the IAM Components?\n\nAWS IAM 允许您为 AWS 账户创建和配置身份。您可以将权限应用于这些身份，以确定授予的访问级别。\n\
  \n接下来，您将了解构成 AWS IAM 的各个组件。\n\n### IAM Users\n\nIAM 用户可能是一个登录 AWS 界面的真人，也是一个需要以编程方式向您的\
  \ AWS 环境发出服务请求的程序。可以将 IAM 用户账户分配给公司中任何需要使用 AWS 服务的人员，例如程序员、系统管理员和数据科学家。用户身份验证可以是交互式的，通过\
  \ Web 控制台，或以编程方式使用 **command-line interface (CLI)**。此外，应用程序可以使用 AWS 的 **software\
  \ development kits (SDKs)** 来获得编程访问权限并执行 **application programming interface (API)**\
  \ 调用以与服务和资源交互。\n\n> **Best practice**\n>\n> 在授予服务访问权限时，您必须遵循 AWS 推荐的 POLP。这确保了这些身份仅被提供执行经批准的任务并履行其工作职能所需的必要访问权限。\n\
  \n如以下图所示，root 用户拥有不受限制的访问权限。然而，您首次创建 IAM 用户时，他们没有任何权限。尽管这些 IAM 用户可以登录 AWS 账户，但他们将无法访问任何服务或创建资源。IAM\
  \ 用户需要由您可以附加到这些用户（或用户所属的组）的策略定义的权限。这些权限定义了这些用户在您的账户中可以执行的操作。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_72_0.png)\n\
  \nFigure 2.1 – Conceptual vision of the AWS user access\n\n在 AWS 之旅开始时，将基于其工作职能拥有足够权限的\
  \ IAM 用户纳入其中是一项关键的安全最佳实践。\n\n对于我们的虚构客户 TodoPlus Limited，您将创建一个代表组织开发人员之一的 IAM 用户。您将以此用户身份登录以执行本学习指南中的各种练习。（请参阅本章后面的练习\
  \ 2.1。）\n\n### IAM Groups\n\nIAM 组使您能够汇总具有共同工作职能的单个 IAM 用户。这使您可以将权限分配给整个组，而组成员用户将继承这些权限。从管理角度来看，将权限分配给组要容易得多，因为它避免了直接为每个用户创建和附加多个策略。这使得管理权限分配和审计变得更加简单。\n\
  \n### IAM Roles\n\n这种类型的身份独立于任何特定用户，具有一组定义的权限。这些权限在附加到角色的一个或多个策略中描述。角色可以被用户或应用程序承担，以获得对\
  \ AWS 账户内其他服务和资源的临时访问权限。通常没有某些权限的用户可能会被授予承担特定角色的能力，这些角色在需要时提供提升的访问级别。一个例子是 **Break\
  \ Glass** 概念，其中团队中的初级成员可能能够承担一个角色，该角色在特定条件下授予特殊权限以执行受限任务。\n\n角色也可以由使用第三方 IdP 的身份承担，从而实现身份联合。示例包括\
  \ OpenID 提供商，如 Facebook 和 Google，或企业目录服务，如支持 SAML 2.0 协议的 Microsoft AD。您还可以使用角色允许来自其他\
  \ AWS 账户的用户通过跨账户访问和角色切换访问您 AWS 账户中的服务和资源。\n\nIAM 角色使用由 STS 创建和管理的临时凭证。角色未配置长期凭证（用户名和密码或访问密钥）。相反，当实体承担角色并请求访问资源时，它会获得用于针对服务或资源进行身份验证的临时凭证。这些凭证很快就会过期，如果请求继续并且实体继续拥有承担角色所需的权限，则会创建新的凭证。通过\
  \ IAM 角色，是 STS 服务在后台处理这些临时凭证的创建和管理。\n\nIAM 角色也由相互交互的 AWS 服务使用。因此，如果 EC2 实例需要访问存储平台（如\
  \ Amazon Simple Storage Service (**Amazon S3**)) 或数据库服务（如 DynamoDB）上的某些数据，则该 EC2\
  \ 实例必须能够承担一个角色，从而授予其必要的权限。\n\n例如，关于我们的 Todo List 应用程序，如果网站前端托管在 EC2 实例上并提供时间管理技能视频，则这些视频可以托管在\
  \ Amazon S3 等廉价存储平台上，该平台旨在托管视频、图像和文档等资产。（我们将在第 3 章《Understanding Object Storage\
  \ with Amazon S3, Hybrid Storage, and Static Website Hosting》中讨论 Amazon S3。）\n\n\
  为了允许在 EC2 实例上运行的应用程序访问这些时间管理视频，必须创建一个具有访问 S3 存储桶中视频所需权限的角色。然后将此角色分配给 EC2 实例。此过程涉及创建称为\
  \ EC2 实例配置文件的东西，它是您希望分配给实例的 IAM 角色的容器。一旦分配，EC2 实例上运行的应用程序就可以向 S3 存储桶发出 API 调用，以便最终用户可以访问视频。如果没有此\
  \ IAM 角色，尝试访问存储在 S3 存储桶中的视频将生成 **Access Denied** 错误。\n\n\n\n\n\n替代方案是为一个“虚拟”的 IAM\
  \ 用户硬编码凭证数据，该用户已被分配了一个 IAM 策略（稍后讨论），该策略授予该用户访问 S3 存储桶中视频的权限。这显然是不良做法，因为如果有人入侵应用程序代码，他们现在也将能够访问访问\
  \ S3 存储桶的凭证。无论如何，在应用程序代码中管理硬编码凭证是一项巨大的管理负担。因此，IAM 角色使您能够使用临时凭证授予对资源的访问权限，这些凭证管理更高效，并且消除了在应用程序源代码中硬编码凭证数据所带来的大部分风险。\n\
  \n在此处显示的图中，我们来看一下其架构上是如何工作的：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_74_0.png)\n\
  \n图 2.2 – Todo List 应用程序架构 – 配置了包含 IAM 角色的实例配置文件 的 EC2 实例，该角色授予对 Amazon S3 存储桶的访问权限\n\
  \n以下是图 2.2 中所示配置的快速高层次分解：\n\n- 1. 为 EC2 服务创建一个 IAM 角色。这意味着 EC2 是受信任的实体。附加到该角色的权限策略授予对包含\
  \ Web 应用程序所需对象的 Amazon S3 存储桶的访问权限。在本例中，将是时间管理视频。\n- 2. 然后通过实例配置文件将 IAM 角色附加到 EC2\
  \ 实例。一次只能分配一个角色。但是，角色可以有一个或多个策略文档来定义不同的权限集。\n- 3. 用户访问 Web 应用程序并尝试观看/下载时间管理视频。\n\
  - 4. EC2 实例承担该角色并被授予对 S3 存储桶中对象的访问权限。Amazon STS 服务创建必要的临时凭证并在后台管理访问。\n\n与其直接将规则分配给\
  \ IAM 中的单个用户或组，管理员必须将其分配给角色。可以将多个 IAM 策略应用于单个 IAM 角色，然后该角色可以分配给一组用户或一个组。根据业务需求，存在几种类型的\
  \ IAM 角色。不同的 IAM 角色如下：\n\n- **AWS IAM 角色：** 一个独立于任何特定用户或应用程序的身份，具有一个或多个策略来定义访问 AWS\
  \ 上的服务和资源的权限集。\n- **AWS 服务角色：** 由 AWS 服务用于代表您访问和管理您的 AWS 账户。服务角色对每个服务都是唯一的，并且只能用于控制单个\
  \ AWS 账户内的访问。我们在前面的示例中讨论了将角色附加到 EC2 实例。这种类型的角色称为服务角色。需要注意的是，此角色可以在 EC2 实例生命周期中的任何时间附加或分离。为了防止意外更改设置并确保实例从开始时就安全，建议在启动\
  \ Amazon EC2 实例时附加此角色。\n- **AWS 服务链接角色：** 此类型角色授予服务特定功能调用其他 AWS 服务所需的权限。这些权限是预先确定的并在角色中定义。角色可以由服务自动创建或删除，并通过服务特定程序或向导进行修改或删除。许多\
  \ AWS 服务，例如 AWS Lambda 和 EC2 Auto Scaling，都使用服务链接角色。\n- **角色链：** 角色链是一种旨在将命令行或 API\
  \ 请求限制为最多一小时会话的机制。在通过 `AssumeRole` API 方法承担角色时，您可以使用 `DurationSeconds` 参数设置角色会话的时间限制，最长持续时间为\
  \ 43,200 秒（12 小时）。请注意，使用角色链时，如果将 `DurationSeconds` 参数设置为大于一小时的值，操作将失败。有关更多详细信息，请查看本文：https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_terms-and-concepts.html。\n\
  - **委派：** 这是指需要访问您 AWS 账户中资源的外部用户或应用程序。该过程涉及在包含资源（称为 **信任账户**）的账户与需要访问这些资源（称为 **受信任账户**）的账户之间建立安全连接。委派过程需要在受信任账户和信任账户之间建立信任策略。\n\
  \n以下图表说明了如何在两个 AWS 账户之间建立委派访问：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_76_0.png)\n\
  \n图 2.3 – 使用 IAM 角色配置跨账户访问\n\n如图 2.3 所示，我们以 Identities 账户中的开发人员需要访问 development\
  \ 账户中的 S3 存储桶（称为 TodoApp）为例。这称为跨账户访问，配置它涉及的主要步骤如下：\n\n- I. 在 development 账户中，您必须配置一个具有信任策略的角色，该策略标识受信任的账户（在本例中为\
  \ Identities 账户）。在本例中，我们将 IAM 角色命名为 IAM-User-S3-AccessRole。配置要求您提供 Account A 的 ID。\n\
  - II. 您还需要配置一个包含对 Account B 中 TodoApp S3 存储桶执行读/写操作所需权限的策略。\n- III. 最后，在 Account\
  \ A 中，您需要配置另一个策略，授予开发人员承担在 Account B 中创建的 S3AccessRole 的能力。您通过在策略语句中指定 Account B\
  \ 的 Account ID 和角色来执行此操作。策略将根据以下 JSON 脚本授予 sts:AssumeRole 权限：\n\n```json\n{\n  \"\
  Version\": \"2012-10-17\",\n  \"Statement\": {\n    \"Effect\": \"Allow\",\n   \
  \ \"Action\": \"sts:AssumeRole\",\n    \"Resource\": \"arn:aws:iam::Developer-Account-ID:role/S3AccessRole\"\
  \n  }\n}\n```\n\n一旦完成上述配置，开发人员就可以切换角色并访问 AWS Account B 中的 TodoApp S3 存储桶。\n\n**注意**\n\
  使用新的 IAM Identity Center 服务（以前称为 AWS Single Sign-On），您可能不需要大量使用跨账户访问来访问 IAM 用户。这是因为\
  \ IAM Identity Center 提供了一种替代方法，可让您的员工用户访问您 AWS Organizations 中多个即用型账户中的账户。这些用户可以来自\
  \ AWS IdPs 以及外部提供商。我们将在本章后面讨论 IAM Identity Center。\n\n- **联合身份验证：** 应用程序可以使用身份联合验证使用外部\
  \ IdP 对外部用户进行身份验证，而无需自定义登录代码。这可以使用与 **OpenID Connect (OIDC)**、Microsoft AD 或协议（LDAP）兼容的\
  \ Amazon、Facebook、Google 或其他 IdP 实现，这些 IdP 支持 SAML 2.0。通过这样做，可以在外部 IdP 和托管在 AWS\
  \ 上的应用程序之间开发基于令牌的身份验证策略，从而消除对单独用户账户和密码的需求。\n\n## IAM 策略\n\nJSON 文档遵循 IAM 策略标准，该标准概述了特定\
  \ IAM 角色定义的权限。以下是此类策略的示例，该策略允许访问存储在 TodoApp S3 存储桶中的对象：\n\n```json\n{\n    \"Version\"\
  : \"2012-10-17\",\n    \"Statement\": [\n        {\n            \"Sid\": \"AccessToDoAppBucket\"\
  ,\n            \"Action\": [\n                \"s3:GetObject\",\n              \
  \  \"s3:ListBucket\"\n            ],\n            \"Effect\": \"Allow\",\n     \
  \       \"Resource\": [\n                \"arn:aws:s3:::todoapp\",\n           \
  \     \"arn:aws:s3:::todoapp/*\"\n            ]\n        }\n    ]\n}\n```\n\n现在，让我们探讨与\
  \ IAM 角色关联的策略类型：\n\n- **信任策略**：此策略定义了被信任的服务。每个角色只能有一个信任策略。可以信任的服务包括 EC2、EMR、EC2\
  \ 容器服务、**关系数据库服务（RDS）**、Lex 和 Glue。\n- **权限策略**：授权策略指定角色可以访问哪些资源以及角色可以在这些资源上执行哪些操作。策略可以由\
  \ AWS 控制或由客户端控制，也可以与角色本身内联添加。更多信息请参见 https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-vs-inline.html。\n\
  \n## 权限边界\n\n此功能允许您设置边界或限制 IAM 策略可以分配的最大权限。权限边界允许您限制执行特定任务的访问权限。当组织中有大量员工时，这是有益的，您希望允许他们创建和自定义自己的策略，同时确保他们不会超过权限边界指定的权限。\n\
  \n例如，假设您有一组系统管理员，他们应该完全访问 IAM、S3 和 RDS。您希望确保他们不会启动任何 EC2 实例。您可以向其账户添加一个策略，拒绝他们启动\
  \ EC2 实例的能力。但是，如果他们完全访问 IAM，他们可以删除该限制或创建另一个具有启动 EC2 实例权限的 IAM 用户。\n\n可以将其权限边界应用于其账户，以便他们只能在附加了相同权限边界的情况下创建其他\
  \ IAM 用户账户。此外，权限边界将明确拒绝启动 EC2 实例的能力。现在，您有一个场景，即使管理员之一尝试创建另一个 IAM 用户账户，该新用户账户仍将被拒绝启动\
  \ EC2 实例的能力，从而防止任何规避策略的机会。\n\n在本节中，我们回顾了 AWS IAM 的基本概念，包括其关键组件，例如 IAM 用户、IAM 角色和\
  \ IAM 策略。\n\n默认情况下，以 IAM 用户身份访问 Web 控制台需要用户名和密码组合。此外，您还需要访问密钥（包括访问密钥 ID 和秘密访问密钥）进行命令行访问。\n\
  \n仅由用户名和密码组成的凭证存在安全风险，可以通过 MFA 来缓解。在下一节中，我们将详细研究这项技术。\n\n## 使用 MFA 改善您的安全态势\n\n\
  MFA 是一种安全功能，通过要求用户除了用户名和密码之外还输入六位数字令牌来增强身份验证过程。AWS 强烈建议为您的 root 用户账户和 IAM 用户启用 MFA\
  \ 以提高安全性。\n\n\n\n\n\n## 基于安全令牌的多因素认证（MFA）\n\n启用 MFA 后，必须由可信来源提供认证码才能访问管理控制台。您可以使用基于硬件或软件（虚拟）的\
  \ MFA 设备，为 AWS API 调用和用户控制台登录设置 MFA。\n\nAWS 提供**通用第二因子（U2F）**作为基于开放认证标准的 MFA 选项。U2F\
  \ 可以使用专用 USB 密钥或**近场通信（NFC）**设备（如智能卡技术），但 AWS 仅支持基于 USB 的 U2F，不支持 NFC 设备用于 MFA。\n\
  \n有关 U2F 的更多详细信息，请参阅 https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa_enable_u2f.html\
  \ 上的信息。\n\n用户必须拥有 IAM 用户账户才能使用 MFA 令牌，MFA 令牌采用基于时间同步的一次性 PIN 码方式，使用六位数字进行身份识别。MFA\
  \ 提供了额外的保护层，需要同时提供 MFA 令牌、用户名和密码才能访问账户。IAM 用户的 MFA 令牌仅由同步的 MFA 设备生成，并会定期更换。\n\n\
  ## 使用 SAML 2.0 和 Microsoft AD 通过身份联合访问 AWS 账户\n\nMicrosoft AD 是各类规模企业中使用最广泛的 IAM\
  \ 服务，尤其是在本地工作负载方面。Microsoft AD 存储了整个组织中的用户、角色和权限信息，并为 AWS 平台提供了一种替代认证方式。在下一节中，您将学习如何将\
  \ AWS 账户链接到现有的 **AD 联合服务（AD FS）**。\n\n在本节中，我们讨论另一种利用现有 IdP 的选项：使用 Microsoft AD 和\
  \ SAML 2.0 对您的 AWS 账户进行认证。SAML 2.0 是一种开放标准，用于在 IdP（如 Microsoft AD FS）和**服务提供商（SP）**（此处指\
  \ AWS）之间交换认证和授权令牌。SAML 2.0 通常用于实现**单点登录（SSO）**功能，使用户能够使用一套凭据访问多个服务，而无需分别登录每个服务。\n\
  \n许多企业使用 AD 环境来管理本地托管服务的认证和授权。在拥有数千至数百万用户的大型组织中，用户的凭据、权限策略以及跨多个平台的访问可能变得越来越难以管理。身份联合允许您为外部身份授予使用\
  \ AWS 管理控制台或 API 的权限，从而无需为现有用户创建新的 IAM 用户账户，减少了管理开销。通过使用 AD FS，您可以将组织的 AD 资源无缝连接到\
  \ AWS。\n\n下图描述了如何配置 AD FS 服务，以允许 AD 环境中的用户进行联合访问：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_80_0.png)\n\
  \n图 2.4 – 使用 AD 进行认证的流程\n\n以下是使用 AD FS 访问管理控制台的步骤分解，如图 2.4 所示：\n\n- 1. 在互联网浏览器中，您请求访问一个\
  \ AD FS 网站。https://HostName/adfs/ls/IdpInitiatedSignOn.aspx 是该 URL 的一个示例。当您在基于 Windows\
  \ 的服务器上启用 AD FS 服务时，它会在您的 Web 服务器上生成一个名为 adfs 的虚拟目录。登录页面会自动生成。\n- 2. 收到凭据后，AD FS\
  \ 会对照 Windows AD 验证用户身份。\n- 3. AD FS 向用户浏览器提供 SAML 断言，以促进认证响应。\n- 4. 用户浏览器将 SAML\
  \ 断言发布到 AWS 端点。在底层，AssumeRoleWithSAML 会请求临时令牌，然后生成一个登录链接，用于登录 AWS Web 界面。\n- 5.\
  \ 用户随后可以使用该登录 URL，并被重定向到管理控制台。\n\nMicrosoft AD 非常适合保护内部资源，但外部应用程序/资源呢？在下一节中，我们将了解如何使用\
  \ Amazon Cognito 和第三方 IdP 来保护您的工作负载。\n\n## 使用 Web 身份联合进行应用程序认证\n\n大多数 Web 和移动应用程序在终端用户使用其服务之前，都需要在应用程序层进行某种形式的认证和授权。\n\
  \n对于新的 Todo List 应用程序，客户需要注册订阅。接下来，为了确保只有有效客户才能访问此应用程序，需要构建一个登录流程，作为应用程序认证和授权安全功能的一部分。\n\
  \n开发用户数据库并验证其凭据是任何应用程序开发生命周期中的关键步骤。然而，将凭据数据存储在应用程序代码或设备中是极不安全且有风险的。为了解决这个问题，Amazon\
  \ 建议在 Web 和移动应用程序的认证工作流中使用 Web 身份联合。这允许应用程序从 IdP 动态请求临时安全凭据，IAM 角色可以通过令牌提供者生成这些凭据。\n\
  \nWeb 身份联合支持使用各种可信的第三方 IdP（如 Amazon、Google 和其他符合 OIDC 标准的 IdP）进行注册和登录，无需创建用户名和密码。一旦用户通过验证，软件便会颁发令牌，授予临时\
  \ AWS 访问权限。请注意，这些凭据与特定的 IAM 角色相关联，并且只能用于该角色明确授权的任务。\n\n为了避免在应用程序中嵌入或分发凭据的安全风险，强烈建议将\
  \ Amazon Cognito 与 Web 身份联合结合使用，而不是开发自定义解决方案。Amazon Cognito 简化了移动和 Web 应用程序的注册和登录流程，支持第三方\
  \ IdP 的认证。\n\n`https://aws.amazon.com/blogs/aws/aws-iam-now-supports-amazon-facebook-and-google-identity-federation/`\
  \ 上的博客文章提供了使用在线身份联合的绝佳示例。\n\n在下一节中，我们将了解 Amazon Cognito 如何帮助您简化应用程序的认证和授权工作流。\n\n\
  ## 使用 Amazon Cognito 进行应用程序认证和授权\n\nAmazon Cognito 是适用于您的 Web 和移动应用程序的身份服务。该服务允许您创建用户目录，或与\
  \ Google、Amazon、Facebook 等外部 IdP 联合。内部目录（或外部 IdP）用于验证用户身份并授权其访问您的应用程序。该服务消除了为应用程序创建自定义身份服务的相关开销。\n\
  \nAmazon Cognito 由两个关键组件组成，它们可以独立使用，也可以组合使用。我们接下来讨论这些组件。\n\n### Amazon Cognito 用户池\n\
  \nAmazon Cognito 用户池是一项用户目录服务，为您的应用程序提供用户创建、管理和认证服务。终端用户可以注册用户账户，从而创建用户配置文件。您可以创建托管在\
  \ Amazon Cognito 中的独立用户目录，并使用 OIDC 生成的**JSON Web 令牌（JWT）**进行认证和授权。\n\n或者，您也可以使用\
  \ Facebook、Google 和 Amazon 等第三方 IdP，在用户通过认证后，将这些第三方令牌交换为 Cognito 令牌。这使您能够避免创建另一个目录，避免用户再去记住另一套凭据。\n\
  \nAmazon Cognito 用户池允许您构建注册和登录工作流，并具有存储和管理用户数据的附加功能。您还可以使用组来更有效地管理用户。\n\n其他关键功能包括：\n\
  \n- 可使用托管的**用户界面（UI）**进行注册和登录，或创建自定义 UI\n- 使用用户名和密码进行认证；注册需要通过邮件等方式进行验证\n- 实施 MFA\
  \ 以增强安全性\n- OAuth 2.0 流程\n- 与 Facebook、Google 或 Amazon 等第三方 IdP 集成\n- 集成 Lambda\
  \ 触发器，在登录流程中添加钩子以实现附加功能\n- 您还可以从第三方现有池迁移到 Cognito 用户池\n\n用户通过 Cognito 用户池设置登录后，系统会颁发\
  \ JWT 等访问令牌，这些令牌可用于保护对某些 AWS 服务的访问。\n\n#### 使用用户池访问后端资源\n\n使用用户池时，您的用户登录后，您的 Web\
  \ 或移动应用程序将收到用户池令牌，这些令牌可用于授予对后端资源的访问权限，如下方图表所示。例如，如果用户需要在社交媒体平台上更新其个人资料信息，数据最终存储在后台数据库中。为了使用户的更新成功执行，用户必须首先通过认证和授权，在此场景中由\
  \ Cognito 处理。\n\n\n\n\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_83_0.png)\n\n\
  Figure 2.5 – 使用用户池访问后端资源\n\n另一种选择是通过 API Gateway 或 Application Load Balancer 访问托管在\
  \ AWS 上的应用程序和 API。具体来说，你将使用你的令牌来保护 API 并实现对其访问的授权。这可以通过使用 Cognito authorizer（类型为\
  \ COGNITO_USER_POOLS）来完成，以通过 API Gateway 或 Application Load Balancer 授予对应用程序的访问权限。\n\
  \nAPI 部署后，已通过身份验证的用户可以检索身份或访问令牌，并使用它在授权头中附加令牌的情况下调用 API 方法。\n\n下图说明了此工作流程：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_83_1.png)\n\
  \nFigure 2.6 – 使用用户池通过 API Gateway 和 Lambda 访问资源\n\nAmazon Cognito 用户池旨在用于限制 Web\
  \ 和移动应用程序的 API 访问。\n\n然而，用户池不能用于直接访问其他 AWS 服务，例如 Amazon S3 或 Kinesis。为此要求，你需要创建\
  \ Amazon Cognito **身份池**。让我们接下来讨论这个问题。\n\n## Amazon Cognito Identity Pools\n\nAmazon\
  \ Cognito 身份池旨在用于在你想要授权经过身份验证或甚至匿名用户直接访问你的资源时使用。使用身份池时，你要么使用来自 Cognito 用户池的身份，要么使用第三方\
  \ IdP 的身份，并将用户池令牌（或第三方 IdP 的令牌）交换为临时的 AWS 凭证。然后你使用这些凭证访问 AWS API 和 AWS CLI。\n\n\
  当你的应用程序将凭证会话分配给经过身份验证的用户时，你可以授予对后端 AWS 资源（如 Amazon S3、Kinesis 和 DynamoDB）的访问权限。\n\
  \nCognito 身份池的另一个功能是能够授予访客用户（匿名访问，如前所述）的访问权限。这涉及在用户未通过 IdP 进行身份验证的情况下向用户授予唯一标识符和\
  \ AWS 凭证。要启用访客访问，你需要在身份池的用户选项卡中激活它。\n\n你还可以结合使用 Amazon Cognito 用户池和身份池，如下图所示，以促进你的用户注册和登录、管理他们的个人资料、访问你的应用程序，甚至访问后端\
  \ AWS 服务和资源。如果你不需要直接访问后端资源，则不需要这些临时的 AWS 凭证，在这种情况下，Amazon Cognito 用户池足以满足你的使用场景。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_84_0.png)\n\nFigure 2.7 – 使用用户池和身份池访问\
  \ AWS 服务\n\n最终，你可能会根据需求使用用户池、身份池，甚至两者兼用。总结来说，用户池旨在限制对 Web 和移动应用程序的 API 访问，仅限授权用户——你可以创建和管理自己的池来管理用户的身份（或与第三方提供商联合）。你还可以创建组并将用户关联起来。用户通过身份验证后，Amazon\
  \ Cognito 会颁发访问令牌，然后用于通过 API Gateway 或 Application Load Balancer 授予对 API 的访问权限。\n\
  \n如果需要直接提供对后端服务（如 Amazon S3 或 DynamoDB）的访问，则需要使用身份池，因为你需要将访问令牌交换为 AWS 临时凭证。这些 AWS\
  \ 临时凭证由 Amazon STS 创建和管理，我们接下来讨论它。\n\n## How AWS STS Generates Temporary Tokens\n\
  \nSTS 服务将自动生成凭证，这些凭证根据附加到身份的策略文档中定义的权限授予对 AWS 资源的有限访问。IAM 用户和联合用户都可以分配临时凭证。\n\n\
  临时安全凭证与 IAM 用户的永久访问密钥之间存在一些差异。虽然它们功能相似，但临时安全凭证具有一些独特功能：\n\n- 临时凭证是为指定持续时间创建的，并在特定时间后过期\n\
  - 你可以配置凭证过期时间，从几分钟到数小时不等\n- AWS 在过期后不再识别这些凭证，过期后进行的任何 API 请求都将被拒绝，除非继续具有续期凭证的权限\n\
  \n默认情况下，对 AWS STS 的调用会发送到其全局端点 https://sts.amazonaws.com，该端点会将请求重定向到 N. Virginia（us-east-1）区域。然而，你应考虑使用区域端点，其中大多数默认启用，以确保低延迟、增加冗余并提高会话令牌有效性。\n\
  \n以下是你可以使用 AWS STS 服务执行的常见操作：\n\n- **AssumeRole**: 这会返回可用于访问你 AWS 账户中的资源或执行跨账户访问的临时凭证。凭证将包括访问密钥\
  \ ID、秘密访问密钥和安全令牌。在前面讨论的 IAM 角色部分中，你了解到如果 Todo List 前端网站托管在 EC2 实例上，并且网站需要访问托管在 S3\
  \ 存储桶中的媒体内容，则需要将适当的角色分配给 EC2 实例作为实例配置文件。在这里，IAM 角色将由两个策略组成：一个信任策略，定义谁或什么可以承担该角色，在本例中为\
  \ EC2 服务。另一个策略包括承担角色的实体可以对资源执行的一组权限。因此，在本例中，它将是使用 GET 请求检索托管在 S3 中的媒体内容的能力。下图说明了此\
  \ AssumeRole 信任策略：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_86_0.png)\n\nFigure\
  \ 2.8 – AWS STS AssumeRole 信任策略\n\n- **AssumeRoleWithSAML**: 这会返回通过 SAML 身份验证流程分配给经过身份验证用户的临时凭证。通常用于企业身份联合以实现\
  \ SSO 功能，组织可以通过其默认 IdP 联合身份验证。这允许用户使用现有的 IdP 身份验证凭证登录，并启用基于角色的 AWS 访问。使用 AssumeRoleWithSAML\
  \ 生成的临时凭证默认持续 1 小时，但可配置为 1 小时到 12 小时之间的值。\n\n- **AssumeRoleWithWebIdentity**: 这会为通过\
  \ Web IdP（如 OAuth 2.0 提供商，例如 Amazon、Google 或 Facebook）在 Web 或移动应用程序中进行身份验证的用户返回临时凭证。这使你能够构建和部署应用程序以请求临时凭证，而无需在应用程序中存储长期凭证。这是因为用户使用来自\
  \ Web IdP 的令牌进行身份验证。\n\n- GetSessionToken: 这会为 IAM 用户返回临时凭证，通常用于当你希望通过 MFA 对某些 AWS\
  \ API 操作（如 EC2 StopInstances）提供额外保护时。IAM 用户将使用 GetSessionToken 函数并提供其 MFA 设备上的 MFA\
  \ 代码，从而能够执行实例停止请求。\n\n在本节中，你了解了 AWS STS 以及它如何促进临时安全凭证的创建和管理，这些凭证被 IAM 角色等功能使用。\n\
  \n接下来，让我们看一下 Todo List 应用程序设计架构的高级概述，并特别强调 Amazon Cognito 服务以及它如何集成到设计中。\n\n## Amazon\
  \ Cognito and the Todo List Application\n\n我们的客户 TodoPlus Limited 将利用 Amazon Cognito\
  \ 服务来促进其 Todo List 应用程序的终端用户注册和登录流程。对于此应用程序的目的，你还将使用自定义 UI 而不是托管 UI。Amazon Cognito\
  \ 将与多个其他 AWS 服务集成以提供安全功能。这些包括防止分布式拒绝服务（DDoS）攻击以及与 API Gateway 集成以控制谁调用这些 API 操作。\n\
  \n在下图中，你将看到 Todo List 应用程序的整体应用程序架构。此时架构工作流程可能看起来有点不熟悉也没关系。随着你逐步学习本学习指南，你将了解用于在\
  \ AWS 上设计、构建和部署此应用程序的核心基础技术。对于现在，我们在高层次上突出一些我们将使用的关键 AWS 服务。然后在后续章节中深入研究每个服务。\n\n\
  ![](img/34ff9b5b5a734dae3450ab701e223c73_87_0.png)\n\nFigure 2.9 – Todo List 应用程序的高级架构设计\n\
  \n\n\n\n应用架构如[图 2.9](#)所示，由多个 AWS 组件组成。部分组件如下：\n\n- **专有虚拟网络（VPC）**：使您能够创建隔离的网络以分离工作负载和应用程序。某些提供虚拟机计算服务的服务，例如\
  \ EC2 实例，必须托管在 VPC 中。您将使用 VPC 将面向公众的工作负载与您的 Todo List 应用程序的私有工作负载分离。\n- **Amazon\
  \ Cognito**：为您的 Web 和移动应用程序提供身份验证和授权服务。如前所述，Amazon Cognito 将允许最终用户登录 Todo List 应用程序。\n\
  - **Amazon S3**：这是一个高度可扩展且持久的对象存储平台，也可用于托管我们的 Todo List 应用程序的静态网站。\n- **CloudFront**：提供了在边缘位置分发和缓存内容的能力，以确保低延迟连接。CloudFront\
  \ 还可以与 **Lambda@Edge** 集成，以响应流入 CloudFront 的请求提供额外的功能。\n- **API Gateway**：使开发者能够创建、发布和管理其\
  \ API。它还用于接受和处理多达数十万并发 API 调用，管理 API 流量，提供**跨源资源共享（CORS）**支持、授权、访问控制、限流、监控和 API\
  \ 版本管理。\n- **弹性负载均衡器**：自动将传入的应用程序流量分布到一个或多个**可用区（AZ）**中的多个目标（如 EC2 实例）和虚拟设备上。有不同类型的负载均衡器，本学习指南稍后部分将讨论适用于我们应用解决方案的类型。\n\
  - **自动缩放组**：为您的计算资源集群（如 EC2 实例）提供自动缩放功能。\n- **Amazon RDS**：这是一项完全托管的关系数据库服务，将托管最终用户的所有\
  \ Todo List 数据。\n- **AWS Secrets Manager**：帮助您管理、获取和轮换数据库凭据和应用程序凭据。您将使用 AWS Secrets\
  \ Manager 存储 RDS 数据库凭据以进行安全访问。\n\n在任务 2.1 – 为 Todo List 应用程序创建 Amazon Cognito 用户池中，您将有机会创建一个\
  \ Amazon Cognito 用户池，随着本学习指南的深入，该用户池将被用于您的应用程序架构。\n\n除了 IAM 和 Amazon Cognito，AWS\
  \ 还发布了新的 IAM Identity Center。它之前被称为 AWS Single-Sign-On，旨在帮助加速从其他 AWS 账户和外部 IdP 到第三方基于\
  \ SaaS 的应用程序集成的联邦访问构建。IAM Identity Center 非常适合管理跨越多个 AWS 账户的员工身份。接下来，让我们讨论一下该服务的概览。\n\
  \n## AWS IAM Identity Center 概览\n\nIAM Identity Center 旨在帮助集中创建和管理您的员工身份。该服务实际上是\
  \ IAM 和 AWS Single Sign-On 服务的叠加。使用 IAM Identity Center，您可以使用默认的内部 AWS IdP 或连接并同步到外部\
  \ IdP（如 Microsoft AD Domain Services）。这使得授予 SSO 能力比标准 IAM 更简单。\n\n您可以使用多账户权限将用户访问权限分配给\
  \ AWS Organizations 内的所有 AWS 账户。这比尝试配置跨账户访问和多个 IAM 角色以允许一个 AWS 账户中的用户访问组织内其他 AWS\
  \ 账户的方法要容易得多。\n\n使用 IAM Identity Center，您还可以分配对与 Identity Center 集成的应用程序或提供 SAML\
  \ 2.0 集成的第三方应用程序的访问权限。在使用 IAM Identity Center 代替 AWS IAM 时存在多种用例，尤其是在员工用户管理方面。\n\
  \n就我们的客户 TodoPlus Limited 而言，您应该考虑使用 AWS IAM Identity Center 授予现有员工的访问权限。假设 TodoPlus\
