  \ 端点，两者都允许 Lambda 函数与位于 VPC 外部的 Secrets Manager 通信。\n\n为了促进从 VPC 发出的此出站通信，你还需要设置\
  \ NAT 网关。这将使 Lambda 函数能够将流量发送到 VPC 外部。请注意，NAT 网关是一项收费服务，不属于免费套餐提供的内容：\n\n- 1. 在你的\
