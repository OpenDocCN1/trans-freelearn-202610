  \ PDF 和其他福利发送到您的电子邮件。\n\n## AWS 账户和全球基础设施简介\n\n云计算是按需交付 IT 服务，使客户能够配置基础设施、平台和软件组件等\
  \ IT 资源来托管和管理其应用程序。云计算相比传统本地解决方案具有多项优势，例如访问尖端技术、弹性和可扩展性以及降低管理开销。转向云的最大优势之一是能够将固定成本转变为可变成本——这是因为客户无需购买任何基础设施硬件，而是使用按需付费模式租用提供商底层基础设施的容量。\n\
  \n**Amazon Web Services (AWS)** 是当今最大的云计算服务提供商，其次是微软和谷歌，根据 Gartner 2023 年战略云平台服务魔力象限。AWS\
  \ 提供超过 200 项服务，旨在帮助各规模的企业在云中构建、设计和部署可扩展、安全且经济高效的解决方案。此外，AWS 提供其全球数据中心的访问，使企业能够将应用程序部署到更靠近客户的位置，而无需在这些位置采购和配置基础设施。即使是小型初创企业也可以接触全球客户群并满足合规和监管要求。\n\
  \n本书将教您通过 AWS Certified Developer Associate 认证所需的所有技能，并在云开发人员、初级 DevOps 工程师、云工程师等典型职位中脱颖而出。它涵盖了遵循行业标准最佳实践的\
  \ AWS 架构设计模式，并帮助您在 AWS 上开发、部署和调试基于云的应用程序方面建立熟练程度。本书还旨在帮助您从零开始培养现实世界的实践技能。这是通过在章节中融入一个场景来实现的，这样当您学习新技术和概念时，您也可以通过提供的项目练习培养将这些知识付诸实践的技能。\n\
