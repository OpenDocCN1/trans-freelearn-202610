  ## Summary\n\n在本章中，你已经发现了 AWS 上的一项关键服务——Amazon S3。该服务因其低成本、耐用性和可靠性而广受欢迎。它允许 AWS\
  \ 用户存储各种各样的数据，从归档到为数据工程和分析项目设计具有成本效益的数据湖。\n\nAmazon S3 的一个关键特性是其能够托管静态网站，这些网站可以作为大多数当代应用程序的入口点。此外，Amazon\
  \ S3 的这一特性非常适合设计完整的端到端无服务器架构，这将在本书后面进行讨论。\n\n除了在云中提供存储解决方案外，还可以在云中构建私有网络。AWS 提供了一个名为\
  \ **Virtual Private Cloud (VPC)** 的功能，允许你定义和配置私有网络，从而实现工作负载的分离。\n\n借助 VPC，你可以通过建立单独的网络来容纳它们，从而将可能在同一\
  \ AWS 账户中运行的应用程序分开。这提供了额外的安全性，以及更好地管理资源如何配置和分配。\n\n在下一章中，你将了解云中的网络并探索虚拟私有网络。你还将探索\
  \ Amazon Route 53，它提供域名命名服务，并帮助你设计流量如何定向到你的资源，无论是通过互联网还是在 VPC 内部。\n\n## Exam Readiness\
