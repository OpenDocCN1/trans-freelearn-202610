  \ 分 34 秒 |\n| 尝试 7 | 76% | 14 分 44 秒 |\n\n表 13.1 – 在线平台上的计时练习示例\n\n> 注意\n> 上表中显示的时间限制仅为示例。请根据网站上测验的时间限制，为每次尝试设置自己的时间限制。\n\
  \n每次新尝试，您的分数应保持在 75% 以上，而完成测验所用的“时间”应“减少”。您可以随心所欲地重复多次尝试，直到您有信心应对时间压力。\n"
- "## 使用 AWS Serverless Application Model (SAM) 和 AWS AppSync 设计无服务器应用程序\n\n在现代应用程序开发领域，高效且有效地管理数据是一项核心挑战。当我们深入研究无服务器架构时，重点转向利用能够自动扩展、减少运营开销并简化部署流程的服务。AWS\
  \ 提供了一套强大的无服务器技术，无需传统的服务器管理即可简化动态数据集的处理。\n\n本章重点介绍一个包含 AWS Serverless Application\
  \ Model (SAM)、AWS Lambda、Amazon API Gateway 和 Amazon DynamoDB 的无服务器应用程序栈。这些服务构成了可扩展、高效且高可用的无服务器应用程序的骨干。我们将通过为虚构客户\
  \ Todo Plus Limited 开展的实际项目练习来学习这些技术，使您能够将所学概念应用到实际场景中。\n\nAWS Lambda 支持在无需预置或管理服务器的情况下响应事件执行代码，非常适合不可预测的工作负载。Amazon\
  \ API Gateway 充当 Lambda 的前门，管理并保护对函数的访问。Amazon DynamoDB 提供快速、灵活的 NoSQL 数据库服务，具有无缝可扩展性，非常适合管理无服务器应用程序所需的各种数据结构。\n\
  \n本章介绍的技术配置和部署实践旨在帮助您充分准备 AWS Certified Developer Associate 考试，并深入理解这些无服务器组件如何交互和扩展。\n\
  \n\n\n\n\n本章涵盖的关键主题如下：\n\n- 使用 AWS Serverless Application Model (SAM) 开发和部署无服务器应用程序\n\
  - AWS AppSync 概述\n- 项目任务 – 使用 SAM 部署待办事项应用程序的“即将推出”页面\n\n在本章结束时，你不仅将掌握这些无服务器技术的核心概念和高级功能，还将了解它们在构建和扩展应用程序方面的实际应用，而无需管理底层基础设施。这种方法增强了敏捷性，并专注于成本效率和性能，这对于当今快节奏的软件环境至关重要。\n\
  \n## 使用 AWS Serverless Application Model (SAM) 开发和部署无服务器应用程序\n\n### AWS SAM 概述\n\
  \nAWS SAM 是一个专为在 AWS 上构建无服务器应用程序而设计的开源框架。它以 AWS CloudFormation 语法提供了对无服务器基础设施的简化定义。AWS\
  \ SAM 是 CloudFormation 的扩展，并提供简写语法来表达函数、API、数据库和事件源映射。使用 SAM，你只需在 YAML 配置文件中用几行代码即可定义你的无服务器应用程序。\n\
  \n### AWS SAM 的关键组件\n\nAWS SAM 主要由三个主要组件组成：\n\n- **SAM 模板：** 一个遵循 YAML 格式的配置文件。该文件使用\
  \ SAM 语法定义无服务器应用程序中的资源。你使用模板来声明要为无服务器应用程序配置的资源。你可以在 CloudFormation 模板中声明的资源也可以在\
  \ SAM 模板中声明。\n- **SAM CLI：** 一个提供构建、测试和部署 AWS SAM 应用程序工具的 CLI。\n- **部署方法：** AWS\
  \ SAM 与 AWS CloudFormation 集成，利用其功能将无服务器应用程序作为堆栈部署并在其生命周期内管理它们。\n\n接下来提供了使用 SAM\
  \ 开发应用程序的概述。\n\n## 使用 AWS SAM 开发\n\n### 创建新的 SAM 应用程序\n\n要使用 AWS SAM 初始化新的无服务器应用程序，你必须使用\
  \ SAM CLI，你需要先安装它。本章后面的项目任务部分将以详细的分步方式指导你完成此过程。然后你可以使用 sam init 代码命令，使用预定义的模板和目录结构创建新的\
  \ SAM 项目，帮助你快速开始，如以下示例命令所示：\n\n```\nsam init --runtime python3.9 --name todo-list-application\n\
  ```\n\n### 在 SAM 模板中定义资源\n\n要使用 SAM 服务，你需要创建一个 SAM 模板，在其中定义你的 AWS 资源，例如 Lambda 函数、API\
  \ Gateway API 和 DynamoDB 表。SAM 模板的格式与你在第 13 章《使用 CloudFormation 和 Cloud Development\
  \ Kit (CDK) 通过代码构建基础设施》中学到的 CloudFormation 模板非常相似。\n\nTransform 和 Resources 部分是\
  \ SAM 模板中唯一的必需组件。以下是描述 SAM 模板结构的骨架模板：\n\n```\nTransform: AWS::Serverless-2016-10-31\n\
  Globals:\n  set of globals\nDescription:\n  string\nMetadata:\n  template metadata\n\
  Parameters:\n  set of parameters\nMappings:\n  set of mappings\nConditions:\n  set\
  \ of conditions\nResources:\n  set of resources\nOutputs:\n  set of outputs\n```\n\
  \n作为 SAM 模板的一部分，你必须将 Transform 部分声明为 Transform: AWS::Serverless-2016-10-31，因为这标识该模板为\
  \ SAM 模板文件。\n\nAWS::Serverless transform 是由 CloudFormation 主持的一个宏，它转换 SAM 语法并将其扩展为符合规范的\
  \ CloudFormation 模板，使 CloudFormation 能够构建你的无服务器架构。它指定 AWS CloudFormation 用于处理模板的一个或多个宏。你可以在模板中声明一个或多个宏。AWS\
  \ CloudFormation 按指定的顺序执行宏。\n\n模板的一些关键组件如下：\n\n- **Globals (可选)：** Globals 部分允许你声明具有通用配置的资源。例如，你可能有必须在\
  \ AWS::Serverless::Function 资源中声明的相同 Runtime、Environment 或 VPCConfig 配置。 rather\
  \ than 在各个资源中重复这些变量，你可以在 Globals 部分中声明它们，并使你的资源继承它们。\n- **Resources (必需)：** 在你的\
  \ SAM 模板中，你可以创建多种资源类型。包括以下内容：\n  - `AWS::Serverless::Api`：使你能够创建一组 API Gateway 资源和方法，你可以通过\
  \ HTTPS 端点使用它们。\n  - `AWS::Serverless::Application`：允许你从 AWS Serverless Application\
  \ Repository 或 S3 存储桶嵌入一个无服务器应用程序作为嵌套应用程序。这对于具有通用应用程序组件的多个应用程序非常有用。通过嵌套这些组件，你可以专注于应用程序特有的业务逻辑。\n\
  \  - `AWS::Serverless::HttpApi`：使你能够创建 HTTP API 而不是 REST API，它更便宜且延迟更低。REST API\
  \ 和 HTTP API 都是 API Gateway 支持的 RESTful API 产品。然而，REST API 提供更多功能，例如 API 密钥、按客户端限流、请求验证、与\
  \ AWS WAF（Web Application Firewall）的集成或私有 API 端点。\n  - `AWS::Serverless::Function`：使你能够使用\
  \ Lambda 执行角色创建 Lambda 函数，以及触发函数的任何事件源映射。事件源映射的示例可以是 SQS 队列或 SNS 主题。\n  - `AWS::Serverless::LayerVersion`：使你能够创建包含\
  \ Lambda 函数所需的任何运行时代码或库的 Lambda LayerVersion 资源。\n  - `AWS::Serverless::SimpleTable`：创建\
  \ DynamoDB 表。\n- **Parameters (可选)：** 你可以声明 Parameters，这将允许 sam deploy --guided\
  \ 提示用户输入额外的值。sam deploy 命令将在稍后进行解释。\n\nSAM template.yaml 文件的示例片段如下所示。应用程序有一个由 API\
  \ Gateway 的 API 调用触发的 Lambda 函数：\n\n```\nAWS::TemplateFormatVersion: '2010-09-09'\n\
  Transform: AWS::Serverless-2016-10-31\n\nDescription: Todo List Application\n\n\
  Resources:\n  TodoFunction:\n    Type: AWS::Serverless::Function\n    Properties:\n\
  \      CodeUri: src/\n      Handler: app.handler\n      Runtime: python3.9\n   \
  \   Events:\n        Type: Api\n        Properties:\n          Path: /todos\n  \
  \        Method: get\n```\n\n你会注意到模板中的 Transform 部分，它表明这是一个 SAM 模板。你还会注意到资源类型是一个\
  \ Lambda 函数。\n\n接下来，你将了解更多关于如何在部署前在本地调用和测试应用程序的信息。\n\n### 本地测试和调试\n\n你可以使用 SAM CLI\
  \ 在本地测试你的应用程序。你可以直接调用函数或启动本地 API 网关来测试 HTTP 端点。这对于调试特别有用。sam local invoke 可以与事件文件一起使用，甚至可以使用\
  \ stdin 命令作为事件使用标准输入。命令在以下代码片段中说明：\n\n```\nsam local invoke TodoFunction --event\
  \ events/event.json\nsam local start-api\n```\n\n在下一节中，你将了解更多关于使用 SAM CLI 命令部署应用程序的信息。\n\
  \n### 部署你的应用程序\n\n要部署你的无服务器应用程序，SAM 在幕后使用 CloudFormation 来创建和管理资源。你可以使用 SAM CLI\
  \ 命令来打包和部署你的应用程序，如上一节中提到的命令。sam deploy 命令会创建你的代码和依赖项的 .zip 文件并将其上传到 Amazon S3。\n\
  \n\n\n\n\n它还提供了一个 AWS SAM 模板的副本，将对本地制品的引用替换为命令上传制品的 Amazon S3 位置。此模板副本名为 packaged.yaml，并且是\
  \ `sam deploy` 命令用于使用 CloudFormation 将应用程序部署到 AWS 云的该文件。请注意，您必须在运行以下命令之前创建存储桶：\n\
  \n```\n```bash\nsam package --output-template-file packaged.yaml --s3-bucket [Your-Bucket-Name]\n\
  sam deploy --template-file packaged.yaml --stack-name [Your-Stack-Name] --capabilities\
  \ CAPABILITY_IAM\n```\n```\n\n您可能还注意到 CLI 命令使用了名为 `--capabilities` 的选项。与 CloudFormation\
  \ 能力类似，您需要确认使用某些功能。此确认允许 SAM 生成可能潜在更改您 AWS 账户中权限的特定堆栈资源，例如创建 IAM 角色或用户。对于需要自定义名称的\
  \ IAM 资源创建，必须指定 `CAPABILITY_NAMED_IAM` 选项。\n\n在部署应用程序时，AWS 提供了一些最佳实践建议。其中包括以下内容：\n\
  \n- **安全管理应用程序密钥：** 对敏感数据使用 AWS Secrets Manager 或环境变量。\n- **监控和调试：** 利用 Amazon CloudWatch\
  \ 记录和监控无服务器应用程序的行为。\n- **优化性能：** 查看并调整 Lambda 函数的内存和超时设置，以平衡性能和成本。您还可以使用 AWS Compute\
  \ Optimizer，它可以分析 AWS 资源配置和利用率指标，并提供优化建议，重点是降低成本和提高应用程序性能。该服务可以为各种计算服务提供此类建议，包括\
  \ AWS Lambda。\n\nAWS SAM 简化了在 AWS 上开发、部署和管理无服务器应用程序的体验。通过抽象掉大部分样板代码并提供强大的本地测试工具，AWS\
  \ SAM 让开发人员更专注于编写业务逻辑，而减少配置基础设施的工作。随着无服务器技术的不断发展，像 AWS SAM 这样的工具对于希望充分发挥云潜力的开发人员来说非常宝贵。\n\
  \n使用 SAM 管理任何更新的代码更改也并不复杂，这将在下一节中进一步讨论。\n\nAWS SAM CLI 使开发人员能够快速构建并将无服务器应用程序部署到\
  \ AWS 云，并提供支持其应用程序所需的所有底层基础设施。AWS SAM 使用 CloudFormation 进行所有基础设施部署，并使用更少的代码。它使您能够高效地管理无服务器应用程序生命周期，并使用\
  \ SAM 连接器快速在资源之间设置权限。此外，您可以在开发应用程序时将本地更改同步到云中。\n\n在下一节中，您将了解另一项托管服务，称为 AWS AppSync。该服务使用\
  \ GraphQL 使您的应用程序能够检索所需的数据。GraphQL 可以将来自一个以上数据源的数据组合成单个图。\n\n## AWS AppSync 概述\n\
  \nAWS AppSync 是一种托管的无服务器 GraphQL 服务，可促进在各种 AWS 服务上构建可扩展的应用程序，例如 Amazon DynamoDB、AWS\
  \ Lambda 和 Amazon OpenSearch。它允许开发人员通过单个 API 调用安全地访问、操作和组合来自一个或多个数据源的数据，从而创建灵活的交互式应用程序。AppSync\
  \ 使用 GraphQL，这是一种开放标准的查询语言，使开发人员能够请求所需的数据，而不会收到无关信息。\n\n## AWS AppSync 的核心功能\n\n\
  AWS AppSync 提供了一系列功能，旨在增强用户体验、提高数据一致性并简化后端操作。AWS AppSync 的核心功能如下所述：\n\n- **实时数据同步：**\
  \ AppSync 通过 GraphQL 订阅提供数据的实时更新，确保应用程序数据在所有客户端和设备之间保持一致，而无需手动轮询或额外代码。\n- **离线数据访问：**\
  \ 它支持设备离线时的本地数据访问。更改会缓存在本地，并在设备重新连接后与服务器同步，从而在连接不稳定的环境中增强用户体验。\n- **细粒度访问控制：** AppSync\
  \ 与 **AWS Identity and Access Management (IAM)** 和 Amazon Cognito 集成，用于用户身份验证和细粒度访问控制，允许您在\
  \ GraphQL 查询中指定谁可以在字段级别访问什么数据。AWS 建议使用 AppSync 在设备之间同步应用程序数据，例如用户应用偏好设置或游戏状态数据。\n\
  \n## AWS AppSync 如何工作\n\n以下步骤提供了如何为您的应用程序配置和使用 AWS AppSync 的概述。\n\n### 第 1 步：定义架构\n\
  \n您首先定义一个 GraphQL 架构。此架构是 GraphQL API 的骨干，描述了应用程序支持的类型、查询、变更和订阅。以下是使用 AWS AppSync\
  \ 的简单“待办事项列表”应用程序的 GraphQL 架构示例。此架构包括根据以下代码片段查询和操作待办事项的定义：\n\n```\ntype Todo {\n\
  \    id: ID!\n    completed: Boolean!\n    description: String\n    title: String!\n\
  }\n\ntype Query {\n    getTodo(id: ID!): Todo\n    listTodos: [Todo]\n}\n\ntype\
  \ Mutation {\n    addTodo(title: String!, description: String, complete: Boolean):\
  \ Todo\n    updateTodo(id: ID!, title: String, description: String, completed: Boolean):\
  \ Todo\n    deleteTodo(id: ID!): Todo\n}\n\nschema {\n    query: Query\n    mutation:\
  \ Mutation\n}\n```\n\n在代码片段中，您会注意到某些字段的值以感叹号 (!) 结尾。在 GraphQL 架构中，这些表示某个字段为非空。字段必须始终具有不能为\
  \ null 的值。\n\n以下详细说明了前面代码片段中提到的 GraphQL 定义的不同组件：\n\n### 类型定义\n\n- Todo：表示待办事项，其字段包括：\n\
  \  - id：每个待办事项的唯一标识符\n  - title：待办事项的标题\n  - completed：指示待办事项是否已完成的布尔值\n  - description：提供有关待办事项更多细节的可选字段\n\
  \n### 查询类型\n\n- getTodo：通过其 ID 获取单个待办事项\n- listTodos：返回所有待办事项的列表\n\n### 变更类型\n\n\
  - addTodo：创建新的待办事项。需要 title，并可选择接受 description 和 completed 状态。\n- updateTodo：更新由\
  \ id 标识的现有待办事项。除 id 外的所有字段都是可选的，将根据提供的内容进行更新。\n- deleteTodo：通过其 ID 删除待办事项。\n\n您还可以实现待办事项添加、更新或删除时的实时更新；您可以将此架构扩展为\
  \ GraphQL 订阅，允许客户端订阅更改并立即接收更新。以下是您可能如何为待办事项列表定义订阅的示例代码片段：\n\n```\ntype Subscription\
  \ {\n    onTodoAdded: Todo\n        @aws_subscribe(mutations: [\"addTodo\"])\n \
  \   onTodoUpdated: Todo\n        @aws_subscribe(mutations: [\"updateTodo\"])\n \
  \   onTodoDeleted: Todo\n        @aws_subscribe(mutation: [\"deleteTodo\"])\n}\n\
  ```\n\n### 第 2 步：连接数据源\n\n架构定义后，您可以将其连接到一个或多个数据源。AppSync 支持多种数据源，包括 AWS Lambda、Amazon\
  \ DynamoDB、Amazon Elasticsearch 和 HTTP API。\n\n### 第 3 步：配置解析器\n\n您为架构中的每个字段配置解析器，以规定如何获取或写入数据。这些解析器可以直接连接到您的数据源，或执行您在\
  \ AWS Lambda 函数中定义业务逻辑。\n\n### 第 4 步：部署和查询\n\n配置 GraphQL API 后，AppSync 会自动部署它。然后，您的客户端应用程序可以使用标准\
  \ GraphQL 操作对其进行查询。\n\n在下一节中，您将了解 AWS AppSync 的更多用例。\n\n## 将 AWS AppSync 与 Amazon\
  \ DynamoDB 集成\n\nAWS AppSync 和 Amazon DynamoDB 对于构建可扩展的无服务器实时应用程序非常强大。AWS AppSync\
  \ 是一种托管的 GraphQL 服务，通过使开发人员能够创建灵活的 API 来安全地访问、操作和组合来自一个或多个数据源的数据，从而简化应用程序开发。与 Amazon\
  \ DynamoDB 这种快速灵活的 NoSQL 数据库服务配对时，它允许以最少的设置实现无缝的数据同步和管理。\n\n下一节提供了 AppSync 数据管理和流配置的概述。\n\
  \n## 数据管理与流\n\n- **架构定义：** 在 AWS AppSync 中，您定义一个 GraphQL 架构，指定客户端如何与数据交互。架构包括类型、查询、变更和订阅。\n\
  - **解析器配置：** 对于架构中定义的每个操作（查询、变更和订阅），您配置解析器。解析器确定 GraphQL 查询或变更如何转换为 DynamoDB 中的数据操作。\n\
  - **直接数据源集成：** AppSync 允许您使用 **Velocity Template Language (VTL)** 模板或 AWS Lambda\
  \ 函数将 GraphQL 字段直接链接到 DynamoDB 项。这种直接集成抽象了数据库操作，让您无需中间件即可直接在 DynamoDB 表上执行 CRUD\
  \ 操作。\n\n接下来，您将了解有关查询和变更的更多信息。\n\n\n\n\n\n## 查询和变更示例\n\n- **查询**：GraphQL 查询可以通过\
  \ DynamoDB 主键或任何二级索引，从 DynamoDB 表中拉取记录。在 AWS AppSync 控制台中，你可以将此查询连接到 DynamoDB 数据源，并配置解析器通过\
  \ `id` 检索数据。\n- **变更**：类似地，更新或插入数据到 DynamoDB 的变更会在 GraphQL schema 中定义。例如，以下代码片段展示了如何添加一个新的待办事项：\n\
  \n  ```\n  type Mutation {\n    addTodo(title: String!, description: String): Todo\n\
  \  }\n  ```\n\n  此变更的解析器将指定 GraphQL 请求中的数据如何映射到 DynamoDB 表属性，通常使用 Apache VTL 模板来格式化请求并处理响应。AWS\
  \ AppSync 使用 VTL 将 GraphQL 中的客户端请求转换为你的数据源能够理解的请求，同时也会将数据源的响应转换回 GraphQL。这使你可以处理应用程序的标准请求和响应，并处理输入验证和格式化、遍历列表、映射和数组以提取所需信息、执行复杂的授权检查等更多操作。\n\
  \n下一节将讨论如何使用订阅处理实时数据。\n\n## 使用订阅实现实时数据\n\nAppSync 中的订阅用于实时数据操作。当一次变更修改 DynamoDB\
  \ 中的数据时，AppSync 可以自动将新数据通知给所有已订阅的客户端，这要归功于与 GraphQL 集成的订阅机制。\n\n设想一个待办事项列表应用，用户可以添加、更新和跟踪任务。通过将\
  \ AppSync 与 DynamoDB 集成，你可以创建一个健壮的后端，其中：\n\n- 1. 用户从客户端应用提交 GraphQL 查询和变更。\n- 2.\
  \ AppSync 根据配置的解析器处理这些请求。\n- 3. DynamoDB 处理数据存储，确保高性能和可扩展性。\n- 4. 任务的更改通过 GraphQL\
  \ 订阅实时推送给所有在线用户，从而增强协作体验。\n\n将 AWS AppSync 与 Amazon DynamoDB 集成，可以通过简化高效的数据操作、实时更新和可扩展解决方案，以极低的后端复杂性释放无服务器架构的全部潜力。这种集成非常适合构建需要可靠、安全且即时数据交互的动态\
  \ Web 和移动应用程序。\n\nAWS AppSync 通过管理繁重的数据管理任务并提供强大的平台来构建复杂的数据驱动应用程序，从而简化了应用程序开发。凭借实时同步、离线数据访问以及与\
  \ AWS 服务的无缝集成等强大功能，AppSync 使开发人员能够专注于创造独特的用户体验，同时不损害性能和可扩展性。无论是构建移动应用还是 Web 应用，AWS\
  \ AppSync 都是现代开发人员的不二之选。\n\n下一节将提供有关使用 AWS SAM 和创建无服务器架构来部署**待办事项列表即将推出**网页的分步教程。\n\
  \n## 项目任务：使用 SAM 部署待办事项列表应用的“即将推出”页面\n\n到目前为止，你一直在开发账户中构建和部署待办事项列表应用。你已经通过使用各种 AWS\
  \ 技术构建和部署应用及其各个组件，获得了宝贵的经验。\n\nTodo Plus 一直在审查你的进度，并对这个新应用感到兴奋。当你继续使用各种技术在开发账户中托管应用并不断磨练技能时，现在也是时候开始同步向世界推广即将推出的应用了。在本项目中，你将部署托管在\
