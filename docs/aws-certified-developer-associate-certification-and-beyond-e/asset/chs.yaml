  \n- 4. 确认OpenSSH客户端已安装后，即可生成您的公钥-私钥对。\n- 5. 通过在Windows桌面上的搜索栏中搜索cmd来打开命令提示符。\n-\
  \ 6. 在命令提示符中，输入ssh-keygen命令并按回车键。您将看到以下提示，如图12.23所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_528_0.png)\n\
