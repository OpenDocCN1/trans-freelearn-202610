  第二次尝试，目标至少达到 60%。查看答错的题目并重新阅读章节中的相关部分以弥补剩余的学习差距。\n\n## ATTEMPT 3\n\n第三次尝试，目标至少达到\
  \ **75%**。一旦得分达到 75% 或以上，你就开始练习时间。\n\n> **Tip**  \n> 你可能需要超过 **three** 次尝试才能达到 75%。这没关系。只要在达到目标前不断复习章节中的相关部分即可。\n\
  \n## Working On Timing\n\n**Target:** 你的目标是在保持分数不变的同时，尽可能快速地回答这些问题。以下是你的下几次尝试应有的示例：\n\
