  > 上表中显示的时间限制只是示例。请根据网站上测验的时间限制，为每次尝试设定自己的时间限制。\n\n随着每次新尝试，你的分数应保持在 **75%** 以上，而完成测验的“所用时间”应“减少”。你可以根据需要重复多次尝试，直到你确信自己能够应对时间压力。\n"
- "## 10. 使用 AWS Elastic Beanstalk 设计部署策略\n\n到目前为止，你一直在将各种基础设施服务作为独立组件进行架构设计和配置，然后将它们用于托管应用程序或工作负载。这使你能够了解应用程序所需的各种基础设施组件，例如计算、网络、存储和数据库。\n\
  \n虽然这很有益处，但开发人员通常更关注应用程序架构设计和定义合适的部署策略，而不是专注于底层基础设施服务的繁重工作。\n\n**平台即服务（PaaS）**解决方案旨在减轻与基础设施预置相关的复杂性，使开发人员能够更多地专注于应用程序代码、构建和部署生命周期。**Amazon\
  \ Web Services（AWS）**提供了这样一种 PaaS 工具：**AWS Elastic Beanstalk**。\n\n本章属于 AWS Certified\
  \ Developer Associate 认证考试的**领域 3：部署**。除了理解 AWS Elastic Beanstalk 的基础知识外，本章还涵盖了部署策略以及使用这些策略部署应用程序版本的能力。这些策略范围从滚动更新到蓝绿部署。这在实时生产环境中尤为重要，因为重点在于确保最小干扰，并在必要时能够回滚。本章还介绍了安全概念，特别是与安全访问应用程序配置和连接后端数据库相关的安全概念。\n\
  \n在本章中，我们将 Amazon Elastic Beanstalk 视为一种工具，使开发人员能够快速预置必要的环境，以托管和管理其应用程序及其生命周期。\n\
  \n本章中的项目任务还将使您获得使用 Elastic Beanstalk 部署端到端应用程序解决方案的真实动手经验。虽然底层基础设施的大部分配置由 PaaS 服务处理，但对于其他几个组件，你可能希望预先配置，或者至少定义\
  \ Elastic Beanstalk 如何预置它们。\n\n本章涵盖的关键主题如下：\n\n- Amazon Elastic Beanstalk 应用程序部署简介\n\
  - 理解各种部署策略\n- Beanstalk 高级功能\n- 项目任务 – 使用 Elastic Beanstalk 和 AWS Secrets Manager\
  \ 部署多层应用程序\n\n### Amazon Elastic Beanstalk 应用程序部署简介\n\nAmazon Elastic Beanstalk\
  \ 是 AWS 提供的一种 PaaS 服务，通过预置必要的底层资源、托管应用程序本身并管理其生命周期，使客户能够轻松部署应用程序。\n\n尽管与 Amazon\
  \ CloudFormation（将在本学习指南后面讨论）类似，但诸如 Amazon Elastic Beanstalk 之类的 PaaS 产品专注于一个特定应用，并仅预置支持托管该应用所需的资源。另一方面，Amazon\
  \ CloudFormation 是一项**基础设施即代码（IaC）**服务，用于架构和构建可用于托管多个应用程序的端到端基础设施组件。Amazon Elastic\
  \ Beanstalk 使用 Amazon CloudFormation 来预置这些底层资源。\n\n虽然 Amazon Elastic Beanstalk 负责资源创建，但它确实为客户提供了对基础设施构建方式的广泛控制——例如，如果你希望在给定区域的不同网络子网中跨多个**可用区（AZ）**部署应用程序，以支持高可用性。\n\
  \n如下图所示，Amazon Elastic Beanstalk 负责为应用程序构建整个环境，其中将包括任何必要的网络配置（Amazon VPC）、EC2 实例、Web\
  \ 应用程序环境（例如 Apache、Tomcat、Node.js 等），以及负载均衡器、自动伸缩组甚至 **Amazon Relational Database\
  \ Service（RDS）**数据库等支持性基础设施组件。\n\n\n\n\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_397_0.png)\n\
  \n图 10.1：AWS Elastic Beanstalk 示例\n\n该服务支持部署在 EC2 实例上的标准应用程序以及在 **Elastic Container\
  \ Service (ECS)** 上的 Docker 容器。\n\n由于 Elastic Beanstalk 将与您的代码协同工作，为您的应用程序提供必要的基础设施和平台，因此您需要确保您的代码使用受支持的语言构建，例如\
  \ Java、.NET、PHP、Ruby、Node.js、Python 和 Docker Web 应用程序。Amazon Elastic Beanstalk 支持以下开发堆栈：\n\
  \n- Java SE\n- 用于 Java 应用程序的 Apache Tomcat\n- 用于 PHP 和 Python 的 Apache HTTP Server\n\
  - 用于 Node.js 的 NGINX 或 Apache HTTP Server\n- 用于 .NET 应用程序的 Microsoft IIS 7.5、8.0\
  \ 和 8.5\n- 用于 Ruby 应用程序的 Passenger 或 Puma\n- Docker\n- Go 等\n\n接下来，让我们来看一下 Amazon\
  \ Elastic Beanstalk 的核心组件。\n\n## Amazon Elastic Beanstalk 组件\n\nAmazon Elastic Beanstalk\
  \ 会为您的应用程序配置所需的所有资源。这些是应用程序运行的环境。多个组件定义了您的 Elastic Beanstalk 应用程序架构，接下来将进行讨论。\n\n\
  ### Application\n\nAmazon Elastic Beanstalk 应用程序是环境、版本和配置项等组件的集合，可以将其视为应用程序堆栈的容器。\n\
  \n### Application Version\n\n这是指您应用程序代码的特定迭代。Amazon Elastic Beanstalk 会将您应用程序的所有版本存储在托管的\
  \ S3 存储桶中，作为可部署的代码，例如 Java WAR 文件。版本可以根据需要应用于任何环境，并且每个应用程序版本都是唯一的。应用程序版本可用于不同的环境，其中最新迭代例如可在开发或测试环境中进行测试，而生产环境仍托管您应用程序的先前稳定版本。\n\
  \n### Environment\n\n这是一组 AWS 资源（例如 EC2 实例、负载均衡器、Auto Scaling 组和 Relational Database\
  \ Service (RDS) 数据库），用于托管特定应用程序版本。每个环境一次只能运行一个应用程序版本。例如，您可能有三个不同的应用程序版本——稳定的生产版本、测试版本和正在进一步开发以添加新功能或修复错误的一个版本。\n\
  \n除此之外，您还可以拥有两种不同的环境层：\n\n- Web 服务器层：旨在托管前端 Web 应用程序，通过端口 80/443 提供 HTTP/HTTPS 请求。\n\
  - Worker 层：旨在从 Amazon Simple Queue Service (Amazon SQS) 中提取任务，以处理由 Web 服务器层接受的请求。\n\
  \n下图说明了使用 Amazon Elastic Beanstalk 如何构建 Web 服务器层和 Worker 层：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_399_0.png)\n\
  \n图 10.2：具有环境层和 SQS 队列的 Elastic Beanstalk 架构\n\n上图说明了如何将您的应用程序部署到 Elastic Beanstalk，并提供支持其所需的基础设施。作为部署的一部分，您会确定需要配置的环境层；相应地，AWS\
  \ 将创建必要的资源。\n\n### Environment Configuration\n\n此设置集合控制环境及其相关资源如何交互。如有必要，可以更新配置，这将导致\
  \ Elastic Beanstalk 对现有资源应用更改，或在必要时删除并部署新资源。\n\n### Save Configuration\n\n您可以将配置存储为模板，可用作创建独特环境的起点。当用于反映不同阶段（例如开发、测试和生产）的环境的标准配置时，它特别有用。\n\
  \n### Platform\n\n这结合了 **操作系统 (OS)**，例如 Linux 或 Windows、运行时、Web 服务器、应用程序服务器以及其他必要的组件、库等。在下图中，平台为\
  \ Node.js，使用最新分支用于 Amazon Linux 2023，版本为 6.1.7 作为推荐版本。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_400_0.png)\n\
  \n图 10.3：平台类型\n\n在下一节中，您将了解 Elastic Beanstalk 应用程序的不同部署选项。\n\n## 了解各种部署策略\n\n在 Elastic\
  \ Beanstalk 上部署应用程序时，通常需要使用新版本进行更新以适应功能增强或错误修复。定期发布应用程序的新版本也是推荐的做法，而不是在相当长的时间间隔后尝试发布重大升级，这可能会导致更多技术和用户体验问题。\n\
  \nAmazon Elastic Beanstalk 提供了多种战略选项，帮助客户推出应用程序的新版本。每个选项在工作量、成本和最小化停机时间方面各不相同。在下一节中，您将探索\
  \ Amazon Elastic Beanstalk 中可用的各种部署选项。\n\n### All-at-Once Deployment\n\n这是推出更新的最快选项。该策略涉及一次性将更新推送到所有应用程序节点并执行必要的升级操作。然而，这确实会在新版本应用程序安装和配置完成之前导致一定的停机时间。此部署方法不会产生额外的资源成本。\n\
  \n如果您定期推出更新并且不在意停机时间，尤其是停机时间很短的情况下，此选项是理想的。您可以计划在工作时间之外或预计流量非常少时进行此类推出，例如星期日午夜。为了确保客户不会感到惊慌，您可能希望就此类计划停机发送必要的通知。\n\
  \n### Rolling Deployment\n\n在此部署类型中，您一次将更新推出到一部分计算节点，直到所有节点都已更新为应用程序的最新版本。这导致一次只有一部分节点被移出集群，从而可以避免对最终用户造成完全的服务中断。\n\
  \n根据需要更新的节点数量以及在更新推出期间可以移出服务的节点的可接受百分比，此过程需要一些时间才能使所有节点都配置为最新版本的应用程序。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_401_0.png)\n\
  \n图 10.4：滚动部署策略\n\n上图说明了滚动更新将如何完成。假设您有四个节点需要更新，您可以从两个节点开始并对这些节点执行更新（导致它们被移出服务）如步骤\
  \ 2 所示。一旦这些节点已更新，其余两个节点可以按步骤 4 进行更新。在步骤 5 中，所有四个节点都已更新为最新应用程序版本。\n\n这里需要注意的一个重要点是，在更新生命周期期间，一些用户可能会连接到提供新版本的节点，而其他用户将继续体验旧版本，直到相关节点得到更新。如果这种不一致不会造成任何问题，滚动部署是执行应用程序部署的可行选项。最后，此策略不会产生额外成本。\n\
  \n### Rolling with Additional Batch\n\n通过此部署策略，您可以避免在等待某些节点完成应用程序更新过程期间可用性降低。这是通过部署额外的节点来覆盖正在进行应用程序升级过程的节点来实现的，从而使您能够为最终用户保持相同的带宽吞吐量。\n\
  \n让我们看一下下图以提供一些背景信息：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_402_0.png)\n\n\
  图 10.5：带额外批次的滚动部署策略\n\n\n\n\n为了确保不会出现可用性降低的情况，在*步骤 2*中引入额外的一批两个节点，使节点总数达到六个。在*步骤\
  \ 3*中，前两个节点进行升级，并使其离线。然而，为最终用户提供服务的节点数量仍为四个。\n\n在*步骤 5*中，下一组两个节点进行升级。当这两个节点因升级而离线时，集群中仍有同等数量的可用节点，从而避免可用性降低。升级完成后，你将拥有六个节点（包括为部署策略额外添加的两个节点）。\n\
  \n最后，一旦所有现有节点都已升级到最新的应用程序版本，额外的那批节点就会被删除。\n\n在此示例中，为支持这种部署策略而部署额外的一批节点会产生额外成本。此外，升级过程也比之前的批次更长。但是，你也会受益于最终用户不会遇到性能问题或服务可用性降低的情况。\n\
  \n## 不可变部署\n\n作为滚动部署的替代方案，此策略侧重于在单独的自动扩缩组中预配置新资源，以测试新应用程序，并在必要时通过简单删除自动扩缩组来回滚。这将确保你现有的集群不受影响，并且现有实例的可用性不会降低。\n\
  \n采用这种部署策略时，Amazon Elastic Beanstalk 会创建第二个自动扩缩组，并预配置一个实例来测试新的配置和应用程序代码。启动成功后，Amazon\
  \ Elastic Beanstalk 将预配置额外实例以匹配原始自动扩缩组。当所有实例都通过必要的健康检查后，Elastic Beanstalk 会将实例移入原始自动扩缩组，并终止临时自动扩缩组和旧实例。\n\
  \n关于这种部署策略，应注意以下几点：\n\n- 在更新过程中，环境的总容量会在短时间内翻倍。此时，新的自动扩缩组会在原始自动扩缩组的实例被终止之前处理请求，从而产生额外成本。请注意，这还可能影响你的配额和限制，因此你需要确保在更新过程中不会超出任何此类限制。\n\
  - 不可变更新会为你要部署的每个新版本预配置新实例。你可能需要确保使用正确的**亚马逊机器镜像（AMI）**版本启动实例，并在推出前对你的 AMI 镜像进行任何必要的修改。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_405_0.png)\n\n图 10.6：蓝/绿部署\n\n你还可以使用\
  \ Route 53 执行加权路由策略作为测试的一部分，这样你可以继续使用两个环境，仅将一小部分流量发送到绿色部署以验证和测试新部署。当你准备好上线时，可以禁用加权路由策略，最后执行\
  \ URL 切换，使所有流量都指向新版本。\n\n在本节中，我们讨论了使用 Elastic Beanstalk 时可用的各种部署选项。这些选项使你能在应用程序生命周期中执行常规更新。在下一节中，我们将介绍一些你需要在考试中注意的\
  \ Elastic Beanstalk 高级主题。\n\n## Elastic Beanstalk 高级功能\n\n本节介绍 Elastic Beanstalk\
  \ 的各种高级功能，这些功能可以帮助你更高效地设计部署，并更好地管理环境和应用程序。\n\n### Elastic Beanstalk 生命周期策略\n\n在上一节中，你了解了如何将应用程序的新版本上传到\
  \ Elastic Beanstalk，并查看了可用的各种部署选项。需要记住的是，每次上传应用程序的新版本时，Elastic Beanstalk 都会创建一个新的**应用程序版本**。默认情况下，Amazon\
  \ 在每个 AWS 账户的每个区域最多支持 1,000 个应用程序版本。\n\n如果你达到此限制，就无法再部署任何应用程序版本。为帮助你管理版本，Elastic\
  \ Beanstalk 允许你配置**应用程序版本生命周期策略**。生命周期策略让你可以定义 Elastic Beanstalk 何时删除应用程序版本——你可以告诉\
  \ Elastic Beanstalk 删除应用程序的旧版本，或指定要保留的版本总数，超过该数量后旧版本将被删除。\n\n以下是一些需要注意的额外要点：\n\n\
  - 旧版本的应用程序会在新版本创建后被删除。新版本的创建不会增加策略定义的最大数量计数。当前正在使用的应用程序版本不会被删除。\n- 应用程序版本配额适用于特定区域和所有应用程序——因此，如果你有\
  \ 10 个应用程序，且应用程序版本最大配额为 1,000，那么该配额会在这 10 个应用程序之间分配。\n\n接下来，让我们探讨如何通过编程方式为 Elastic\
  \ Beanstalk 环境引入各种配置选项。\n\n### Elastic Beanstalk 扩展\n\nAmazon Elastic Beanstalk\
  \ 使用另一个 AWS 服务——AWS CloudFormation——来预配置应用程序所需的资源。AWS CloudFormation 是一种 IaC 工具，可帮助你使用\
  \ JSON 或 YAML 脚本代码定义要部署哪些资源以及如何配置它们。这些脚本随后可用作模板，以促进可重复的部署以及以编程方式创建环境和资源。你将在后续章节中了解更多关于\
  \ AWS CloudFormation 的内容。\n\n由于 Elastic Beanstalk 使用 CloudFormation 来预配置所需的环境和资源，因此你可以使用\
  \ Elastic Beanstalk 配置文件（称为 `.ebextensions`）来自定义资源或向部署中添加新资源。\n\n你可能首先需要修改此配置，以确保你要么创建快照，要么最好保留数据库。此更改必须首先执行，并且与实际解耦操作分开进行。这是因为如果你在提交更改的同时尝试执行解耦操作，该更改将被忽略，并且将遵循之前在数据库删除策略中定义的任何策略。\n\
  \n一旦你解耦了数据库，就可以从其他环境连接到它。但是，你仍然需要执行所需的连接步骤，例如定义环境属性，以便从新的环境和应用程序连接到数据库。\n\n### 配置\
  \ Elastic Beanstalk 使用 HTTPS\n\n可通过互联网访问的现代 Web 应用程序应使用更高级别的安全性进行架构设计，并防范恶意攻击。一种常见的配置选项是确保最终用户与应用程序之间的流量经过加密。这被称为传输中加密，通过部署**安全套接层**（SSL）证书来实现，该证书用于在数据通过互联网传输时对其进行加密。\n\
  \n默认情况下，在设置 Elastic Beanstalk 时，流量通过标准 HTTP 传输，而这是不加密的。你可以使用 HTTPS 来确保流量加密，该过程涉及将\
  \ SSL 证书分配给环境的 Elastic Load Balancer。这可以在控制台中完成，也可以通过 `.ebextensions/securelistener-[alb|nlb].config`\
  \ 文件来完成。\n\n此类文件的示例配置如下：\n\n```yaml\noption_settings:\n  aws.elbv2.listener:443:\n\
  \    ListenerEnabled: 'true'\n    Protocol: HTTPS\n    SSLCertificateArns: arn:aws:acm:us-east-1:xxxxxxxxxx:certificate/##########################\n\
  ```\n\n该过程还要求你更新相关的安全组，以确保允许 HTTPS（端口 443）上的入站连接。\n\n此外，你还可以使用自定义域名供最终用户连接，并使用 **AWS\
  \ Certificate Manager**（ACM）来设置和管理证书。\n\n\n\n\n## 克隆现有的 Elastic Beanstalk 环境\n\n\
  Elastic Beanstalk 的另一个有用功能是克隆环境的能力。当你想要部署应用程序的测试版本以使用不同的平台分支并评估应用程序的性能时，这尤其有用。克隆使你能够使用与原始环境相同的设置快速创建新环境。这样，你就避免了手动配置选项设置、环境变量和其他配置的需要。\n\
  \n当你执行环境克隆时，请注意 Elastic Beanstalk 将为克隆的环境复制任何 AWS 资源，例如负载均衡器、安全组和 RDS 数据库。克隆存在一些限制，如以下列表所示：\n\
  \n- 虽然你可以克隆 RDS 环境，但 RDS 数据不会从原始环境复制过来。\n- 虽然你可以克隆环境以使用不同的平台版本，但你无法更改平台分支，因为 Elastic\
  \ Beanstalk 无法保证兼容性。\n- 如果你的 Elastic Beanstalk 环境之前已配置为使用经典负载均衡器，则你的新克隆环境也将配置为使用经典负载均衡器。如果需要更改负载均衡器类型，你将需要创建一个新环境并将应用程序部署到该新环境。之后，你可以使用\
  \ URL 交换将流量定向到新环境。\n\n接下来，让我们看看如何将 Elastic Beanstalk 与 Docker 和容器一起使用。\n\n## Elastic\
  \ Beanstalk 和 Docker\n\n除了在上述平台上部署标准应用程序外，你还可以将应用程序作为 Docker 容器部署。这进一步使你能够部署各种应用程序，因为你不受仅限于受支持平台的限制。Docker\
  \ 容器是自包含的环境，包含平台、编程语言、运行时、库等多种内容。作为一种 OS 层虚拟化形式，Docker 容器比标准虚拟机提供更大的灵活性，允许你在单个主机机器上部署多个容器。你将在\
  \ *第 11 章，使用 Amazon ECS、Fargate 和 EKS 部署多层应用程序堆栈* 中更详细地探索 Docker。\n\n就目前而言，足以说明你也可以使用\
  \ Elastic Beanstalk 部署 Docker 容器，并提供以下两种选项：\n\n- **Single Docker：** 此选项是指在 EC2 实例上部署单个或多个容器。Docker\
  \ 镜像可以通过提供 Dockerfile 或检索 Docker 镜像来构建。此外，你可以使用 Docker Compose 来指定要使用的镜像以及需要在 `docker-compose.yml`\
  \ 文件中提供的其他组件和选项。\n- **ECS：** 此选项使用 Amazon ECS，这是由 AWS 提供的容器编排和管理解决方案。我们将在第 11 章\
  \ *使用 Amazon ECS、Fargate 和 EKS 部署多层应用程序堆栈* 中详细介绍 Amazon ECS。使用此选项时，Amazon ECS 将执行容器部署并管理\
  \ Docker 环境。Elastic Beanstalk 执行所有 Amazon ECS 活动，例如创建集群、任务定义和任务执行。对于此选项，你必须使用 `Dockerrun.aws.json`\
  \ 版本 2 文件。该文件描述了如何将 Docker 容器作为 Elastic Beanstalk 应用程序部署，并提供对多个容器的支持。\n\n关于 ECS\
  \ 选项的一个重要点是，你的 Docker 镜像必须预先构建并存储在存储库中，该存储库可以是公共的也可以是私有的。Elastic Beanstalk 不支持为\
  \ ECS 管理的 Docker 平台使用 Dockerfile，因此你无法在部署期间使用 Dockerfile 构建自定义镜像。\n\n到目前为止，在本节中，你已经了解了\
  \ Elastic Beanstalk 的一些高级功能。使用这些功能，你最终可以配置端到端的基础设施环境，能够在 AWS 上支持最复杂的应用程序。此外，我们还讨论了使用\
  \ Elastic Beanstalk 部署时管理后端数据库的重要性，特别是围绕将 Amazon RDS 数据库与 Elastic Beanstalk 配置解耦的概念，以确保项目结束后或应用程序生命周期结束时数据库得以保留。\n\
  \n无论使用传统的分层架构设计还是使用 Elastic Beanstalk 等 PaaS 解决方案，一个重要的应用程序安全概念都是该应用程序如何连接到后端数据库解决方案。虽然使用\
  \ IAM 角色是一种向应用程序授予临时凭证以连接到数据库的方法，但你可能还需要使用标准的数据库用户名和密码，仅仅因为应用程序就是这样构建的。\n\n在 *第\
  \ 6 章，使用 AWS 关系型和非关系型（NoSQL）数据库管理多个数据库* 中，你发现了 AWS Secrets Manager 服务，该服务旨在存储配置数据和机密信息，例如应用程序通常需要的安全连接后端数据库的凭证。然后可以动态检索这些凭证数据并存储为环境变量，供应用程序引用。这种方法比在应用程序源代码中硬编码凭证数据要好得多。此外，AWS\
  \ Secrets Manager 使你能够在计划的间隔内自动轮换数据库凭证，从而增强应用程序堆栈的安全性。\n\n在下一节中，你将有机会使用 Elastic\
  \ Beanstalk 服务部署多层应用程序。遵循本章中讨论的一些最佳实践，你将学习如何将 RDS 数据库实例部署在 Elastic Beanstalk 配置之外，并使用\
  \ AWS Secrets Manager 安全地管理你的数据库凭证。\n\n### 项目任务 – 使用 Elastic Beanstalk 和 AWS Secrets\
  \ Manager 部署多层应用程序\n\n到目前为止，在本研究中，你一直在为我们的虚构公司 *Todo Plus Limited* 设计、构建和部署一个名为\
  \ *Todo List* 的多层应用程序。完成前几章中的所有项目任务后，你现在拥有一个功能齐全的 Web 应用程序，该应用程序使用各种 AWS 服务和资源。\n\
  \n> **重要说明**\n>\n> 请勿终止你在 `us-east-1` 区域中根据前几章的项目任务已部署的应用程序。在即将到来的章节中，你将使用同一个应用程序并更改其部分基础设施组件，以检查替代架构并帮助培养在其他技术方面的必要实践经验。\n\
  \n在本章中，你将使用 Amazon Elastic Beanstalk 部署同一应用程序的替代、精简版本。应用程序的功能保持不变，只是我们移除了某些功能，例如用于注册和登录的\
  \ Amazon Cognito 服务和 API Gateway 服务。之所以使用同一应用程序的精简版本，是为了让你能够专注于 Elastic Beanstalk\
  \ 配置。本章中即将进行的项目任务将有助于培养在 AWS 的 PaaS 产品上工作的实践动手经验。\n\n为避免混淆，你将在伦敦区域（`eu-west-2`）部署\
  \ *Todo List* 应用程序的此替代版本。\n\n你将要构建的架构如以下图所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_413_0.png)\n\
  \n图 10.8：Todo List 应用程序的 Elastic Beanstalk 架构\n\n作为架构的一部分，你将配置以下服务和资源：\n\n- **VPC**：你将在伦敦区域创建一个新的\
  \ VPC，包含六个子网——两个公共子网、两个应用程序层私有子网和两个数据库层私有子网。架构设计为通过将子网分布在两个可用区中提供高可用性。此外，你还将部署一个\
  \ NAT 网关，以确保由 Elastic Beanstalk 服务部署的实例可以访问互联网。\n- **安全组配置**：Amazon Elastic Beanstalk\
  \ 将提供一组安全组以允许来自互联网的流量访问应用程序负载均衡器，后者进而将该入站 Web 流量分发到 EC2 实例。然而，根据本章中强调的推荐最佳实践，你将把后端数据库配置在\
  \ Elastic Beanstalk 配置之外。这意味着你还必须配置一组安全组以启用从 EC2 实例到后端数据库的流量——这在架构图中显示为 **App-Security-Group**\
  \ 和 **Data-Security-Group**。此外，此外部数据库可以通过不绑定到特定的 Elastic Beanstalk 环境来帮助实现蓝绿部署。\n\
  - **数据库子网组和 RDS 数据库**：如本章前面所述，强烈建议你将 RDS 数据库部署在 Elastic Beanstalk 配置之外，以确保在关闭和终止\
  \ Elastic Beanstalk 环境时数据库得以保留。因此，你将在 VPC 中配置数据库子网组，并在数据子网中部署 MySQL RDS 数据库。对于此实验，你将只部署单个\
  \ RDS 实例。在实际场景中，请考虑为你的 RDS 部署配置多可用区和只读副本。\n\n\n\n\n\n+   4. **AWS Secrets Manager：**\
  \ 你将在 AWS Secrets Manager 中配置一个机密，以存储数据库凭据详细信息，这些详细信息将通过环境变量访问你的应用程序 Elastic Beanstalk\
  \ 环境。这是一种比在应用程序中硬编码凭据更加安全的方法。\n+   5. **IAM 角色和策略：** 通常，你还需要配置 IAM 角色，以启用 Elastic\
  \ Beanstalk 服务接收机密并在你的 VPC 中置备 EC2 实例。作为 Elastic Beanstalk 配置的一部分，你将置备一个自动伸缩组和启动配置——同样，需要相应的\
  \ IAM 角色。\n+   6. **Elastic Beanstalk 应用程序：** 在所有基础设施组件配置完成后，你可以构建你的 Elastic Beanstalk\
  \ 应用程序和环境。在这里，你将提供配置详细信息，以便 Elastic Beanstalk 能够置备你的自动伸缩组和自动伸缩策略，置备负载均衡器，并部署你的应用程序。\n\
  \n## 技术要求\n\n要完成本章的项目任务，你需要执行以下操作：\n\n- 你必须以 IAM 用户“Alice”的身份登录到 AWS 开发账户。请确保你位于伦敦区域（eu-west-2）。\n\
