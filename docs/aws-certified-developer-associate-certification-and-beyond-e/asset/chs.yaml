- "# 使用 Amazon CloudWatch 和 AWS CloudTrail 进行监控\n\n随着企业不断转向更复杂和分布式的架构，对精细化监控和审计系统的需求变得至关重要。从传统设置向现代云环境过渡，需要能够跟踪系统性能和健康状况，并在所有操作中确保合规性和安全性的工具。本章深入探讨\
  \ Amazon CloudWatch、AWS CloudTrail 和 AWS X-Ray 服务，这些服务旨在提供全面的监控和详细的审计功能，帮助在 AWS\
  \ 中管理和优化以及保护应用程序。\n\n这些工具的集成使组织能够增强运营监督、简化问题解决、保持严格的安全标准并识别与应用程序相关的问题。通过 AWS 强大的监控服务套件，开发人员和\
  \ IT 管理员可以掌握其系统健康状况、跟踪用户活动，并主动应对变化和潜在威胁。\n\n本章的主题涵盖 AWS 认证开发者助理考试指南的 **第 4 域：故障排除和优化**，这将帮助你为考试做准备。\n\
  \n阅读完本章后，你将了解如何监控 AWS 资源运行状况并自动化修复操作以确保性能效率。此外，你将能够识别和配置可帮助你分析和排查应用程序性能问题的工具。最后，项目任务将使你获得监控虚拟私有网络进出网络流量的实践经验。\n\
  \n涵盖的关键主题如下：\n\n+   - 使用 Amazon CloudWatch 监控和维护应用程序可用性\n+   - 使用 AWS CloudTrail\
  \ 进行审计和合规\n+   - AWS X-Ray 简介\n\n# 使用 Amazon CloudWatch 监控和维护应用程序可用性\n\nAmazon CloudWatch\
  \ 是一款专为 AWS 云资源和你在 AWS 上运行的应用程序设计的综合监控服务。它提供收集和跟踪指标、设置警报并自动响应 AWS 资源变化的功能。CloudWatch\
  \ 还便于收集、查看和分析日志以进行故障排除并维护 AWS 资源的运行健康状况。本章将探讨 CloudWatch 在确保应用程序最佳性能和运行健康状况、增强其可用性方面的关键作用。\n\
  \nCloudWatch 提供两种监控选项 – 基础和详细（增强）监控：\n\n+   - **基础监控** 免费提供一组默认的 CloudWatch 指标。例如，EC2\
  \ 实例指标如 `CPUUtilization`、`DiskReadOps`、`DiskWriteOps`、`NetworkIn` 和 `NetworkOut`\
  \ 只是基础监控下每五分钟发送到 CloudWatch 的指标中的几个例子。\n+   - **详细监控** 由某些服务提供并收费。例如，对于某些服务，如 EC2\
  \ 实例，指标以一分钟间隔发布，而不是基础指标的五分钟间隔。这为你提供了更多的数据点来分析趋势并快速响应变化或问题。其他服务提供更精细的指标，例如 Amazon\
  \ S3。详细监控特别推荐用于生产工作负载和应用程序。\n\n以下是 CloudWatch 的关键功能。\n\n# CloudWatch 指标\n\nCloudWatch\
  \ 在你提供的所有 AWS 资源中收集指标数据。指标是按时间顺序排列的相关数据点的集合。针对某项服务收集的指标将取决于资源类型。例如，对于 EC2 实例，CloudWatch\
  \ 收集 **CPU 利用率** 作为指标以识别实例的 CPU 消耗。同样，CloudWatch 会为弹性负载均衡器收集 `RequestCount` 和 `NewConnectCount`\
  \ 等指标。\n\n下图是 CloudWatch 仪表板的屏幕截图，视觉上展示了 EC2 核心指标和健康监控，如图 16.1 所示。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_663_0.png)\n\
  \n图 16.1：Amazon CloudWatch 仪表板\n\n图 16.1 中的屏幕截图展示了一个仪表板，显示了多个 EC2 实例的指标。这些指标包括 CPU\
  \ 利用率、DiskReadBytes 等。这些指标是 CloudWatch 提供的内置指标。仪表板提供了资源性能的快速视觉表示，以及它们是否过度使用或使用不足。\n\
  \n你也可以使用另一项服务 AWS Compute Optimizer，它与 Amazon CloudWatch 集成，提供有关优化计算资源配置的建议。该服务可帮助你避免在\
  \ EC2 实例、EBS 卷、在 Fargate 上运行的 ECS 服务、Lambda 函数和 RDS 数据库实例等计算资源上过度配置或配置不足。\n\n该服务将分析你的计算使用模式、配置以及来自\
  \ Amazon CloudWatch 和应用程序监控工具的利用率数据以生成建议。这些建议可以导出到 Amazon S3 并与 AWS Cost Explorer\
  \ 和 AWS Systems Manager 集成。根据这些建议，你可以重新配置资源以提高性能并发现节省成本的机会。\n\nCloudWatch 可以收集两种类型的指标\
  \ – 内置指标和自定义指标。这些将在下一节中讨论。\n\n\n\n\n\n## CloudWatch 内置指标\n\n内置指标是由 AWS 生成的预定义指标，并发送到\
  \ CloudWatch。例如，内置指标包括监控 CPU 利用率和网络流量。磁盘活动，如磁盘读写，也包括在内。\n\nCloudWatch 需要从许多 AWS\
  \ 服务中摄取指标信息，这意味着它需要高效地管理指标信息。为了实现这一点，指标被分为三个不同的级别，如下所示：\n\n- **命名空间：** 在顶层，你有命名空间，它是\
  \ CloudWatch 指标的容器。每个 AWS 服务都有一个命名空间，使 CloudWatch 能够区分该服务及其指标收集，如下图所示：\n\n  ![](img/34ff9b5b5a734dae3450ab701e223c73_664_0.png)\n\
  \n  例如，与 Amazon EC2 相关的指标被分组到定义为 `AWS/EC2` 的命名空间中，而 `AWS/RDS` 命名空间则包含数据库实例级别的指标。名称在命名空间内是唯一的；例如，对于\
  \ `AWS/EC2`，`CPUUtilization` 与 `DiskReadOps` 是不同的。你可以使用命名空间为你的应用程序定义任何其他外部服务。请注意，`AWS/`\
  \ 命名空间仅保留给 AWS 服务使用。\n\n- **维度：** 在你的命名空间内，指标根据维度进一步组织。维度有助于识别你的服务的各个资源以及每个资源的指标值。例如，如果你有一组六个\
  \ EC2 实例，你想要识别每个实例的 `CPUUtilization` 指标。维度是名称-值对，允许 CloudWatch 按资源或其他视角分离指标，以提供更多上下文信息。你最多可以向一个指标添加\
  \ 30 个维度。当为你的 `AWS/EC2` 服务发送 `CPUUtilization` 指标的数据点时，AWS 还提供实例 ID 和实例类型等信息作为维度。因此，你现在可以查看你的账户中启动的每个\
  \ EC2 实例的 `CPUUtilization` 指标，如图 16.3 中的截图所示。\n\n以下截图展示了 **TodoListApp** CloudWatch\
  \ 仪表盘，该仪表盘展示了各种 AWS 资源中的一些指标。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_666_0.png)\n\
  \n图 16.4 – TodoListApp CloudWatch 仪表盘开发环境\n\nCloudWatch 使用命名空间、维度和指标的组合来洞察你的 AWS\
  \ 资源的性能。你可以为你的资源集合创建一个仪表盘，以可视化资源消耗和性能。在下一节中，你将了解更多关于 CloudWatch 自定义指标的内容。\n\n##\
  \ CloudWatch 自定义指标\n\nAWS 还允许你定义自定义指标。当你想要为 EC2 实例发送系统级指标（如内存和磁盘利用率）时，这尤其有用，而这些指标在\
  \ CloudWatch 提供的内置指标中不可用。使用自定义指标的另一个原因是，当你希望捕获应用级指标的数据点时，例如当前观看者人数或已完成的事务数。\n\n\
  要捕获系统级指标，如系统级别上的**内存和磁盘使用情况**数据点，你必须安装**统一的 CloudWatch 代理**。此代理可以安装在 EC2 实例和本地服务器上。该代理还允许你收集可以摄取到\
  \ CloudWatch 的日志文件。需要注意的是，除了在 EC2 实例或本地服务器上安装 CloudWatch 代理外，你还必须确保代理配置有 CloudWatch\
  \ 的 IAM 权限。\n\n此外，如果你希望在应用级别捕获自定义指标，你可以使用 CLI 或应用程序的 SDK 将指标发送到 CloudWatch，例如使用\
  \ `PutMetricData` API 调用。自定义指标有两种不同的分辨率，如下所示：\n\n- **标准分辨率：** 数据以一分钟的粒度摄取\n- **高分辨率：**\
  \ 数据以一秒的粒度摄取\n\n高分辨率指标可对亚分钟级活动提供及时洞察，并可根据 10 秒或 30 秒的间隔快速触发告警。你将在下一节中了解告警。\n\n##\
  \ CloudWatch 告警概述\n\n当你捕获指标时，你可以使用这些指标在特定指标超过你为指定时间段定义的阈值时触发告警。当超过该时间段内的阈值时触发告警这一概念非常重要。你不想仅仅因为一次奇怪的尖峰而触发告警。\n\
  \n有两种类型的告警，如下所示：\n\n- **指标告警：** 与单个 CloudWatch 指标或基于 CloudWatch 指标的数学表达式结果相关联。\n\
  - **复合告警：** 使用规则表达式并包含多个告警。使用复合告警有助于减少总体噪音。这是因为你可以将复合告警配置为仅在所有底层指标告警也处于 **ALARM**\
  \ 状态时才进入 **ALARM** 状态。\n\n告警可以处于以下三种状态之一：\n\n- **OK：** 指标处于阈值范围内\n- **ALARM：** 指标超出阈值范围\n\
  - **INSUFFICIENT_DATA：** 没有足够的数据，通常在你刚刚配置告警并需要等待指标数据点收集时发生\n\n一旦告警进入 **ALARM** 状态，你可以自动执行各种操作以响应告警。你可以向\
  \ Amazon SNS 主题发送警报，然后该主题可以向开发人员发送电子邮件警报。你还可以触发自动扩缩组，该组可以根据触发的告警启动或终止实例，从而使你能够自动向外扩展或向内扩展。\n\
  \n此外，你还可以触发 Lambda 操作，允许你从与资源和 CloudWatch 指标相同的账户或从另一个账户调用 Lambda 函数，如图 16.5 中的截图所示。你必须提供\
  \ Lambda ARN，并确保你有足够的权限。\n\n### Lambda 操作\n\n- **告警状态触发器：** 定义将触发此操作的告警状态。\n  -\
  \ **处于告警状态：** 指标或表达式超出定义的阈值。\n  - **OK：** 指标或表达式处于定义的阈值内。\n  - **数据不足：** 告警刚刚开始或没有足够的数据可用。\n\
  \  - **移除**\n- **函数类型：** 选择 Lambda 函数的类型\n  - **从已登录的账户中选择 Lambda 函数**\n  - **输入跨账户函数的函数\
  \ ARN**\n  - **选择函数：** 选择 Lambda 函数\n  - **已登录账户上的现有 Lambda 函数，输入跨账户函数的函数 ARN**\n\
  \  - **配置版本/别名**\n  - **添加 Lambda 操作**\n\n图 16.5 – 配置 CloudWatch 告警以触发 Lambda 操作\n\
  \n除了上述内容，专门针对 EC2 实例，CloudWatch 告警提供了一组你可以执行的 EC2 操作，如下所示：\n\n- **停止此实例：** 当针对某个特定\
  \ EC2 实例触发告警时，你可以指示 CloudWatch 停止该实例。实例必须由 EBS 卷支持，因为实例存储卷在你关闭其所属的实例时会终止。\n- **终止此实例：**\
  \ 这允许你终止实例，前提是实例上未启用终止保护。\n- **重启此实例：** 这与操作系统重启相同。\n- **恢复此实例：** 这会尝试通过在另一台主机上启动实例来恢复该实例。当\
  \ AWS 在 `StatusCheckFailed_System` 失败错误后检测到底层硬件故障时，会触发此操作。\n- 你还可以使用*简化自动恢复*，这是受支持实例默认启用的功能。如果检测到系统状态检查错误，AWS\
  \ 将尝试将实例修复到健康状态。存在某些限制，例如不支持使用实例存储卷的实例或作为自动扩缩组成员的实例。\n\n\n\n\n在下一节中，你将了解另一个名为 CloudWatch\
  \ Logs 的功能。\n\n## Amazon CloudWatch Logs\n\n借助 CloudWatch Logs，你可以捕获、存储和监控日志数据。你可以从其他\
  \ AWS 服务捕获日志，例如 VPC Flow Logs、CloudTrail、Elastic Beanstalk、Lambda、IoT 设备以及本地服务器。你还可以存储\
  \ Route 53 DNS 日志请求。\n\nCloudWatch Logs 还允许你从操作系统和应用程序捕获系统和应用程序日志数据，并将其导入 CloudWatch。对于此类日志数据，你必须安装\
  \ CloudWatch 代理或使用 AWS SDK、API 或 CLI。\n\n你可以为日志文件定义过期策略，并对日志进行加密。你可以在 CloudWatch\
  \ Logs 中查看日志数据，并将其发送到 Amazon S3、Kinesis Data Streams 和 Firehose。\n\n*图 16.6* 中的图表说明了\
  \ CloudWatch 日志记录的工作原理。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_669_0.png)\n\
  \n图 16.6 – CloudWatch Logs 架构\n\n上图注明了 CloudWatch Logs 服务的各个组件。在此示例中，从三个与 Apache\
  \ 访问日志数据相关的 EC2 实例捕获日志信息，并将其导入一个 CloudWatch Logs 日志组。\n\nCloudWatch Logs 服务的核心组件包括以下部分：\n\
  \n- **日志事件：** 日志事件由时间戳和原始消息组成。事件消息必须采用 UTF-8 编码。日志文件中的每条记录称为一个日志事件。\n- **日志流：**\
  \ 一系列共享同一来源的日志事件。因此，在图 16.6 的示例中，你会看到三个日志流，分别对应每个正在捕获 Apache 日志访问文件数据的 EC2 实例。\n\
  - **日志组：** 对于给定的资源，你会有一个日志组，其中包含一个或多个日志流。在每个日志组中，日志流将共享相同的保留期、监控设置以及通过 IAM 角色和策略设置的任何访问权限。\n\
  \n使用 CloudWatch Logs 的一个重要好处是能够创建**指标筛选器**。这些筛选器允许你在日志流中的 CloudWatch Logs 事件里识别模式，然后从该筛选器创建一个指标并开始监控。例如，你可以使用指标筛选器提取并监控失败的登录或错误，一旦超过指定的阈值，就可以触发告警。\n\
  \nCloudWatch Logs 还附带其他功能，这些功能将在接下来的章节中进一步讨论。\n\n### 导出和流式传输 CloudWatch Logs 数据\n\
  \n你还可以通过将日志数据发送到 Amazon S3 来从 CloudWatch 导出日志数据。这样可以长期保留日志数据，或供其他应用程序和系统用于分析和处理。此处，使用\
  \ `CreateExportTask` 操作导出日志数据。请注意，日志数据最多可能需要 12 小时才能用于导出。\n\n除了将日志数据导出到 Amazon S3，你还可以使用订阅将\
  \ CloudWatch 日志数据配置为实时或近实时地处理并发送到其他目标。这些目标包括 Kinesis Data Streams、Firehose 或 AWS\
  \ Lambda，可用于自定义处理或加载到其他 AWS 服务。你可以定义订阅筛选器，以筛选哪些日志事件被传送到目标资源。\n\n### CloudWatch Logs\
  \ Insights\n\nCloudWatch Logs Insights 提供一种专用的查询语言，使你可以按照图 16.7 中的截图，以交互方式在 CloudWatch\
  \ 中搜索和分析日志数据。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_671_0.png)\n\n图 16.7 –\
  \ CloudWatch Logs Insights\n\nCloudWatch Logs Insights 可以快速发现来自各种 AWS 服务（如 Lambda、CloudTrail\
  \ 和 VPC Flow Logs）日志中的字段，或任何提供日志事件（如 JSON）的自定义日志中的字段。\n\n你还可以使用自然语言创建 CloudWatch\
  \ Logs Insights 查询。你可以询问或描述你要查找的数据。AI 辅助功能会根据你的提示生成查询，并逐行解释该查询的工作原理。\n\n> **重要说明**\n\
  >\n> CloudWatch Logs Insights 无法访问时间戳早于日志组创建时间的日志事件。\n\n在下一节中，你将进一步了解 CloudWatch\
  \ Events。\n\n## CloudWatch Events（Amazon EventBridge）\n\nCloudWatch Events 现已发展成为一个成熟的产品，并更名为\
  \ **Amazon EventBridge**。这项完全托管的服务使构建事件驱动型应用程序成为可能，让你能够进一步设计松耦合架构，使其真正分布式，并避免单点故障。\n\
  \n从高层来看，EventBridge 可以监控你的 AWS 账户中何时发生事件，然后做出响应。EventBridge 使用事件总线（event bus）的概念，它本质上是你账户中任何\
  \ AWS 服务和资源所发生事件的流。该事件总线监控状态变化，如果发生变化，它可以触发一个事件来调用目标。目标可以是另一个受支持的 AWS 服务，例如 Lambda\
  \ 函数或发送到 SNS 主题的通知。\n\n例如，当你的某个用户停止特定 EC2 实例时，EventBridge 可以触发向 SNS 主题发送通知，如图 16.8\
  \ 所示。你可能需要收到此类事件的通知，例如用于审计目的。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_672_0.png)\n\
  \n图 16.8 – 以 SNS 主题为目标的 EventBridge\n\n使用 Cron Job 工具，你还可以配置 EventBridge，以安排在特定时间触发事件。例如，你可能希望触发一个事件来调用\
  \ Lambda 函数，在工作日结束时（下午 6 点）自动停止测试服务器。你可能还希望每天上午 9 点重新启动这些实例，并在每个工作日自动重复此操作。此外，你还可以配置事件按速率表达式发生，例如每\
  \ 10 分钟触发一次操作。\n\nAmazon CloudWatch 可以为你 AWS 账户及其资源的运行状况提供有价值的洞察。它提供广泛的日志记录、监控以及必要的修复操作能力。\n\
  \n在下一节中，你将了解另一项 AWS 服务 AWS CloudTrail，它帮助你从审计角度监控 AWS 账户，并确保合规性和安全性。\n\n## AWS CloudTrail\
  \ 简介\n\nAWS CloudTrail 记录你 AWS 账户中的事件，提供用户操作、角色或 AWS 服务的详细记录。CloudTrail 捕获的每个事件都提供全面的信息，可用于安全分析、合规审计和运维故障排查。\n\
  \n你对 AWS 账户进行的每一次 API 调用，无论是通过管理控制台、CLI 还是使用 SDK，都会被记录在 AWS CloudTrail 中。这使你能够确定账户中发生了什么操作、由谁执行、何时执行，从而形成全面的审计跟踪。默认情况下，管理事件会被记录并保留\
  \ 90 天。但是，你可以创建 CloudTrail 跟踪，将事件记录到 Amazon S3 存储桶并无限期保留。你还可以将捕获的事件发送到 CloudWatch\
  \ Logs 和 Amazon EventBridge。\n\nCloudTrail 跟踪可以为单个区域创建，也可以作为多区域跟踪创建。多区域跟踪捕获所有区域的事件，是推荐的最佳实践。如果\
  \ AWS 新建了一个区域，它会自动添加到你的多区域跟踪中，使你能够捕获全球基础设施中与资源相关的所有活动。使用 AWS Management Console\
  \ 创建跟踪时，它会创建一个多区域跟踪。如果需要创建单区域跟踪，则必须使用 AWS CLI。\n\nCloudTrail 可以捕获三种类型的事件，如下所示：\n\
  \n- **管理事件**提供有关对 AWS 账户中资源执行操作的信息，例如启动新的 EC2 实例、创建新的 IAM 角色、附加 IAM 策略或终止 RDS 数据库实例。默认情况下，跟踪配置为记录所有管理事件。\n\
  - **数据事件**提供有关对资源执行或在资源内部执行的资源操作的详细信息。例如，当用户尝试下载对象时，会对 S3 存储桶中的对象执行 GetObject 操作。你还可以在\
  \ Lambda 函数执行时捕获其执行活动，例如 Invoke API。\n- **洞察事件**使你能够识别并响应由写 API 调用或读/写 API 的错误率引起的异常活动。CloudTrail\
  \ Insights 通过分析正常 API 调用和 API 错误率来建立基线，并在这些调用量或错误率超出正常模式时生成事件。\n\n管理 CloudTrail\
  \ 事件的安全性至关重要，使用加密和 IAM 权限可以确保只有授权用户才能加密和解密 CloudTrail 日志文件。默认情况下，CloudTrail 使用带有\
  \ KMS 密钥的服务器端加密（SSE-KMS）将日志文件传送到你的存储桶，除非你未启用 KMS 加密。在这种情况下，CloudTrail 将使用 SSE-S3\
  \ 加密日志文件。\n\n请注意，要使用带有 S3 存储桶密钥的现有 S3 存储桶，你需要在密钥策略中授予 CloudTrail 执行 GenerateDataKey\
  \ 和 DescribeKey AWS KMS 操作的权限。如果没有这些权限，你将无法创建或更新跟踪。\n\n使用 KMS 进行加密的好处在于你可以自行管理密钥，并且可以使用同一密钥在所有区域的所有账户中加密和解密日志文件。要从\
  \ S3 存储桶访问日志文件，用户必须对该存储桶具有读取权限，并且应用了允许通过 KMS 密钥策略进行解密的策略或角色。这进一步增强了你的安全性。\n\n在下一节中，你将学习如何使用\
  \ Amazon EventBridge 捕获特定 CloudTrail 事件并响应这些事件。\n\n\n\n\n# Amazon EventBridge 与\
  \ AWS CloudTrail\n\n在记录 CloudTrail 事件时，您可能希望通过触发 Lambda 函数或发送通知警报来对某些特定事件类型做出反应。在这种情况下，您可以将\
  \ Amazon EventBridge 与 CloudTrail 集成，以对 AWS 服务发出的特定 API 调用做出反应，该调用由 AWS CloudTrail\
  \ 记录。\n\n例如，您可能希望在用户停止 EC2 实例时触发由 Amazon SNS 生成的电子邮件警报以通知管理员。此设计架构可按照图 16.9 中的图表进行配置。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_674_0.png)\n\n图 16.9 – EventBridge 与\
  \ CloudTrail 集成\n\n要配置此架构，您需要创建一个 CloudTrail 轨迹，该轨迹可以使用管理控制台或 CLI 创建。作为创建轨迹的一部分，您必须创建或选择现有的\
  \ Amazon S3 存储桶来存储日志文件。以下屏幕截图说明了一个示例轨迹，显示了存储日志文件的存储桶位置：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_674_1.png)\n\
  \n图 16.10 – CloudTrail 轨迹常规详细信息\n\n接下来，您必须配置一个 SNS 主题，EventBridge 将向其发送警报。SNS 主题需要订阅者，在本例中将是管理员的电子邮件地址，通知类型为电子邮件通知。\n\
  \n接下来，您必须配置一个 EventBridge 事件规则。为此，您必须将事件源配置为 EC2，事件类型配置为通过 CloudTrail 的 AWS API\
  \ 调用。在此示例中，您还可以捕获特定操作，在本例中为 StopInstances API 调用。以下屏幕截图说明了您将在 EventBridge 中配置的事件模式：\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_675_0.png)\n\n图 16.11 – EventBridge 事件模式\n\
  \n作为配置的一部分，您还必须配置目标，即您之前创建的 SNS 主题。这将确保当捕获到有人停止任何 EC2 实例的事件时，它会触发向 SNS 主题推送通知，从而向订阅者发送电子邮件。\n\
  \n实施 AWS CloudTrail 使您能够访问全面的事件日志信息，并确保您的组织保持高安全、合规和运营卓越标准。\n\n在监控您的 AWS 账户时，账户内配置的资源的性能、健康和安全非常重要。您可能还想监控应用程序的健康状况和性能。这将在下一节中讨论，您将在其中了解\
  \ AWS X-Ray 服务。\n\n## 使用 AWS X-Ray 进行分布式追踪\n\nAWS X-Ray 是一款功能强大的服务，可帮助开发人员分析和调试分布式应用程序，例如使用微服务架构构建的应用程序。X-Ray\
  \ 可提供应用程序请求在各种服务中传输的端到端可见性，提供有关应用程序性能和运行状况的见解。\n\nAWS X-Ray 由以下各种组件组成：\n\n- **Segments：**\
  \ AWS X-Ray 以段的形式接收来自应用程序中运行的资源的数据。段提供了有关跟踪中请求的详细信息，包括主机 IP、开始和结束时间、持续时间以及请求方法，例如\
  \ POST 和 GET 请求。段还允许您识别任何问题，例如错误、故障和异常。在以下屏幕截图中，您可以看到跟踪的典型段详细信息：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_677_0.png)\n\
  \n图 16.13 – 段详细信息\n\n- **Annotations** 是用于向跟踪数据添加用户特定自定义属性的键值对。它们会被编入索引，可用于使用过滤器表达式进行查询。您可以使用注释为搜索提供更多上下文并创建组。通过将这些自定义属性添加为注释，您可以使用过滤器表达式根据这些属性限制返回的结果。您可以在控制台中使用它们对跟踪进行分组，或在调用\
  \ GetTraceSummaries API 时使用它们。\n- **Metadata** 由未编入索引的键值对组成。值可以是任何类型，包括对象和列表。您可以使用元数据记录存储在跟踪中的其他数据，但不需要将其用于搜索。\n\
  \n最终，AWS X-Ray 是监控应用程序、调试跟踪以及通过处理跟踪检索服务映射和其他数据的绝佳工具。它还可以帮助您识别和排除微服务架构中性能问题和错误的根本原因，并在应用程序堆栈中识别瓶颈。\n\
  \n在下一节中，您将学习如何创建 VPC 流日志并将日志数据发送到 CloudWatch Logs。\n\n## 项目任务 – 创建 VPC 流日志\n\nTodo\
  \ List 应用程序部署在跨多个 AWS Fargate 容器服务的 VPC 中。运行在这些容器上的应用程序会调用也在同一 VPC 私有子网中托管的 Amazon\
  \ RDS 数据库。\n\nVPC 已按照特定的最佳实践指南进行配置，纳入了安全协议和规则，以确保只有特定类型的流量被允许进入网络。\n\n在此项目练习中，您将创建一个\
  \ VPC 流日志，并将日志数据摄取到 CloudWatch Logs。VPC Flow Logs 使您能够捕获进入和离开 VPC 中网络接口的 IP 数据包信息。该信息提供了有关\
  \ IP 流量的来源、目标 IP 地址、源端口、目标端口、使用的协议以及数据包是否被接受或拒绝的见解。\n\n当您将流日志发布到 CloudWatch Logs\
  \ 时，日志数据会发布到日志组。VPC 中的每个网络接口都有一个日志流，用于在日志组中捕获流日志记录。VPC Flow Logs 可帮助您识别潜在的恶意流量或安全组过于严格的情况，是您应用程序堆栈整体故障排除过程的一部分。\n\
