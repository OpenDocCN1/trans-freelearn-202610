  \ 镜像。在此项目任务中，你将构建任务定义：\n\n1. 确保你仍以 IAM 用户 Alice 的身份登录到你的 AWS 开发账户。\n\n2. 从 AWS 管理控制台网页顶部搜索栏搜索\
