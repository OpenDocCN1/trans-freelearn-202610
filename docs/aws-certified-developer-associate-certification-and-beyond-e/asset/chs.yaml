  \n## 项目任务9.1 – 更新应用程序后端代码\n\n你需要更新应用程序，以确保它能与Cognito中经过身份验证的用户进行连接。回想一下，托管应用程序API的EC2实例当前在自动扩缩组中运行，你希望确保任何更新都自动复制到EC2实例。由于应用程序代码存放在Amazon\
