  ![](img/34ff9b5b5a734dae3450ab701e223c73_258_0.png)\n\n在图 6.34 的截图中，你可以选择‘单用户’或‘交替用户’轮换策略。‘单用户’策略适用于大多数使用场景，但在密钥轮换期间数据库拒绝调用的风险略有增加。这种风险源于在轮换过程中，数据库中的密码变更与密钥更新之间存在非常短暂的时间间隔。‘交替用户’策略涉及在一个密钥中创建两个用户。每次启动轮换操作时，一个用户的密码会更新，而另一个用户保留之前的有效密码。此策略适用于需要高可用性并降低轮换过程中拒绝风险的应用程序。\n\
