- "## 11 使用Amazon ECS、Fargate和EKS部署多层应用堆栈\n\n容器化彻底改变了开发者打包和部署应用程序的方式。通过将应用程序及其依赖项封装到容器中，开发者可以确保从开发到生产的不同环境中保持一致。这种变革性的方法消除了开发者针对特定主机环境定制应用程序代码的需求。\n\
  \n你不再需要为特定的主机环境构建应用程序代码，并且可以轻松地将应用程序从台式计算机迁移到虚拟服务器，或从Linux迁移到Windows操作系统。\n\n传统的虚拟机（VM）架构有其局限性。每台虚拟机都托管一个客户操作系统，导致系统臃肿、敏捷性降低，并因重复而造成浪费。相比之下，容器共享宿主机的操作系统内核。这使得容器轻量且启动迅速，与虚拟机相比，同一物理硬件上可以托管显著更多的容器。\n\
  \n本章将帮助你全面了解AWS生态系统中的容器编排！通过详细讲解、动手示例和最佳实践，你将学习如何有效利用Amazon Elastic Container Service（Amazon\
  \ ECS）和Amazon Elastic Kubernetes Service（Amazon EKS）来编排你的容器化应用程序。\n\n无论你是想部署微服务架构、管理批处理作业，还是在多个环境中扩展应用程序，ECS和EKS都能提供实现目标所需的工具和功能。\n\
  \nAWS认证开发者-助理级认证要求你理解Elastic Container Service的核心概念，以便使用容器化技术部署应用程序。该主题也与考试指南中的领域3：部署相契合。\n\
  \n本章还将探讨**TodoPlus Limited**如何利用容器化和编排服务来增强其任务管理应用程序的开发、部署和管理。利用AWS强大的容器服务（例如用于基于Docker的容器管理的Amazon\
  \ ECS），TodoPlus可以显著简化和自动化其应用程序工作流，实现可扩展性、可靠性和效率。\n\n本章涵盖以下主题：\n\n- 容器和Docker简介\n\
  - 使用Amazon ECS大规模运行和管理容器\n- 使用Amazon EKS大规模运行和管理容器\n- 项目任务 – 重新设计Todo List Node.js应用程序，使用容器化替代虚拟机\n\
  \n### 容器和Docker简介\n\n在软件开发和部署中，容器化已成为一种革命性的方法，为传统虚拟机提供了高效的替代方案。这场革命的核心是Docker，一个标准化的容器创建和管理平台，使开发者能够更简单地在各种环境中一致地打包和部署应用程序。\n\
  \n### 理解容器化\n\n容器化涉及将应用程序及其依赖项封装到一个轻量级、独立的可执行包中。容器包含运行应用程序所需的一切：代码、运行时、系统工具、库和设置。虽然容器彼此隔离并与主机系统隔离，但它们按需共享主机操作系统内核、库和资源。这种隔离确保了应用程序无论部署在哪里都能统一、安全地运行。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_447_0.png)\n\n图11.1：容器化与虚拟机系统架构对比\n\n\
  图11.1所示的架构清晰地展示了容器化。在图的左侧，你可以看到多个标记为App A到App F的容器，每个容器代表一个带有其依赖项的隔离应用程序（进程）。这些容器都位于一个Docker层之上，表示Docker\
  \ Engine在管理容器生命周期中的作用。Docker层下面是主机操作系统，它提供共享的内核和操作系统功能。整个堆栈建立在基础设施之上，该基础设施可以是物理服务器或基于云的虚拟机。\n\
  \n右侧的插图展示了典型的虚拟机架构。每台虚拟机都必须托管其客户操作系统，这会导致重复和臃肿。与容器化方案相比，托管相同数量的应用程序还需要更多的硬件资源。另一个关键事实是，容器旨在执行特定任务，精简高效，不会承载通常捆绑在客户操作系统中的不必要的工具和实用程序。\n\
  \n容器被视为一大福音的另一个领域是现代应用程序设计模式中从单体架构向微服务架构的转变。微服务是一种软件开发方法，鼓励你将应用程序组件构建为独立的服务，这些服务通过标准协议（如HTTP）或基于定义良好的API的轻量级异步消息传递进行通信。每个组件由小型独立团队设计、构建和管理，这些团队可以专注于其核心专业领域，并确保应用程序具有可扩展性，且开发快速、迭代迅速。使用容器构建微服务架构意味着你可以实现快速扩展，具备跨环境迁移的能力，并能轻松避免单点故障。\n\
  \n### Docker的作用\n\nDocker在普及容器技术方面发挥了关键作用。通过提供一个轻量级的容器管理平台，Docker使开发者能够高效地以容器形式构建、共享和运行应用程序。这种简单性极大地促进了Docker的广泛采用，使其成为容器化的事实标准。\n\
  \nDocker采用客户端-服务器架构，Docker客户端与Docker守护进程通信，后者负责构建、运行和分发Docker容器的繁重工作。Docker容器可以在任何安装了Docker守护进程的机器上运行，从而确保开发、测试和生产环境之间的一致性。\n\
  \n### 使用Docker的优势\n\n- **跨环境一致性：** 通过容器化应用程序，开发者可以消除“在我机器上能运行”的问题。打包为Docker容器的应用程序无论部署在哪里，运行方式都相同。\n\
  - **快速部署和扩展：** 容器可以在几秒内启动和停止，便于动态横向扩展应用程序。\n- **资源效率：** 容器比传统或虚拟机环境需要更少的系统资源，因为它们共享主机系统的内核，而无需自己的操作系统。\n\
  \n在Docker的引领下，容器化代表了应用程序开发、交付和运行方式的重大转变。这种方法简化了开发流程，并提高了部署和扩展方面的运营效率。所提供的示意图直观地展示了容器化的本质，并与传统的虚拟机方法形成对比，强调了通过容器化应用程序部署获得的优势和效率。\n\
  \n虽然容器将你的应用程序堆栈作为隔离且独立的单元进行托管，但你仍然需要一种机制来管理容器的创建、部署和编排。这正是Amazon Elastic Container\
  \ Service（Amazon ECS）发挥作用的地方，下一节将对其进行讨论。\n\n### 使用Amazon ECS大规模运行和管理容器\n\nAmazon\
  \ ECS是一项完全托管的容器编排服务，使你能够在由你管理的Amazon EC2实例集群上，或在AWS Fargate（AWS管理所有底层基础设施的无服务器替代方案）上运行和管理Docker容器。借助ECS，你可以通过简单的API调用来启动和停止基于容器的应用程序，查询集群的完整状态，并访问许多熟悉的特性，例如安全组、弹性负载均衡、EBS卷和IAM角色。\n\
  \n\n\nAmazon ECS的架构旨在为应用程序的运行方式提供灵活性和控制能力。它由多个组件组成，使您能够创建和管理容器，包括存储和网络功能以及通过负载均衡器进行流量分发。这些组件如图11.2所示，接下来将进行讨论。\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_449_0.png)\n\n图11.2 – Amazon ECS组件\n\n\
  以下是Amazon ECS的核心组件：\n\n- **Dockerfile**：这是一个文本文件，包含如何构建Docker镜像的说明。通常包含一个基础镜像（如某个版本的Node.js或基础操作系统应用层），该文件将包含构建可部署到容器的镜像的命令。命令包括要运行的运行时环境、应用程序的构建指令、要使用的工作目录等。\n\
  - **Docker（容器）镜像**：该镜像包含所有必要的组件，例如库、运行时、要暴露的端口以及处于构建状态的应用程序，这些均基于Dockerfile的指令。\n\
  - **容器注册中心 – Amazon Elastic Container Registry (ECR)**：构建好Docker（容器）镜像后，必须将其存储在仓库中。Amazon\
  \ ECR是一项完全托管的容器注册中心服务，可与IAM和KMS等其他服务良好集成，确保容器镜像的安全托管。它提供公有和私有仓库。\n- **任务定义**：这些是应用程序的蓝图，定义容器应如何在集群上部署。它们包括使用哪些Docker（容器）镜像、CPU和内存分配、网络设置等详细信息。\n\
  - **ECS服务**：ECS服务允许您在ECS集群中同时运行和维护指定数量的任务定义实例。这些类似于为EC2实例提供的自动扩展服务。您可以定义容量、要使用的扩展策略以及要配置的触发器。失败的任务会被ECS服务自动替换，确保连续性和可用性。\n\
  - **任务**：任务定义在容器实例上运行的一个实例。任务可以手动运行，也可以由服务管理。\n- **ECS集群**：服务或任务的逻辑分组。在ECS集群中，您可以定义可用的基础设施容量以及运行任务的网络环境，例如VPC和相关子网、监控选项等。\n\
  \n## ECS启动类型：EC2与Fargate\n\nAmazon ECS使您能够使用两种主要启动类型来编排和部署容器：**EC2启动类型**和**Fargate启动类型**。您还可以使用**外部启动类型**部署ECS集群，该类型指在本地环境中部署容器化应用程序。\n\
  \n了解这些启动类型之间的差异，对于高效且经济地架构容器化应用程序至关重要。本节将探讨这两种启动类型并提供详细比较。*图11.3*展示了这些选项：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_450_0.png)\n\
  \n图11.3：在EC2和Fargate启动类型之间选择\n\n## EC2启动类型\n\nEC2启动类型允许您在所管理的Amazon EC2实例集群上运行容器。这种启动类型对底层基础设施提供了最大的控制力，使您能够针对特定的计算、内存和网络配置进行优化。主要特性如下：\n\
  \n- **控制**：完全控制实例类型、操作系统和集群的生命周期。但是，您需要管理实例以及任何实例级别的扩展需求。请注意，任务启动时间取决于实例启动和性能水平。\n\
  - **定制化**：能够根据应用的具体需求优化集群配置。\n- **成本效益**：通过预留实例、竞价实例或专用实例节省成本。\n\n## Fargate启动类型\n\
  \nFargate是适用于容器的无服务器计算引擎，无需管理服务器或集群。使用Fargate，您只需指定容器的CPU和内存需求，其余由ECS处理。主要特性包括：\n\
  \n- **简单性**：无需预置、配置或扩展虚拟机集群即可运行容器。任务在由AWS管理的共享环境中运行，并可通过注入到您指定的VPC子网中的弹性网络接口进行访问。Fargate启动类型最适合将简单性和可扩展性优先于对托管环境的直接控制的应用程序。\n\
  - **可扩展性**：自动扩展计算资源以匹配应用程序的具体需求。\n- **安全性**：每个任务都在其隔离环境中运行，降低了安全风险。\n\nEC2启动类型非常适合大型工作负载以及价格是决定因素的情况。在考虑大型工作负载时，通常需要为工作负载的不同组件（如前端和后端服务）创建不同的任务。此时，可以使用EC2启动类型来确定每种类型所需的计算资源。此外，使用EC2启动类型，您还可以使用预留实例并享受其提供的折扣，尤其是针对长期资源。如果您需要更多控制及其提供的高级功能，也建议使用EC2启动类型。\n\
  \nFargate启动类型非常适合刚开始使用容器、可能没有专业知识或能力管理底层基础设施的公司。如果您运行的是轻量级或批处理型工作负载，它也非常理想。使用Fargate，您无法指定实例类型，也无法运行DaemonSet或特权Pod，这会导致集群上的某些服务不可用。\n\
  \n编排容器并让容器化应用程序与其他AWS服务集成的另一个关键组件，是了解ECS如何与IAM配合使用。通过使用策略和角色，您必须按照最小权限访问原则，为容器实例及其内部运行的任务授予必要的权限。虽然这适用于所有AWS服务，但了解ECS中必须定义适当角色和权限的关键要素，对于确保安全性并授予正常运作所需的访问级别是必要的。IAM角色将在下一节讨论。\n\
  \n## 为ECS定义IAM角色\n\n根据您使用的启动类型、任务和应用程序的要求以及所需的特定AWS服务集成，您可以为ECS环境定义各种IAM角色。\n\n\
  您可能配置的三种典型IAM角色如下：\n\n- Amazon ECS容器实例角色\n- Amazon ECS任务执行角色\n- 任务IAM角色\n\n### Amazon\
  \ ECS容器实例角色\n\n如果您计划使用EC2启动类型托管容器，则必须配置一个IAM角色，使实例上安装的容器代理能够代表您调用AWS API。您可以将AWS提供的托管策略AmazonEC2ContainerServiceforEC2Role附加到该角色，授予使用整个ECS功能集的权限。该策略授予多项权限，例如注册容器实例、向CloudWatch发送日志事件、访问Amazon\
  \ ECR仓库等。\n\n### Amazon ECS任务执行角色\n\n任务执行角色授予ECS容器代理和Fargate代理进行API调用的权限。权限包括从与容器相同账户或另一个账户中的ECR私有仓库拉取容器镜像，以及使用awslogs日志驱动发送CloudWatch日志。还可以授予其他权限，例如使任务定义能够调用Secrets\
  \ Manager机密或AWS Systems Manager Parameter Store中的参数。您可以使用提供的托管策略AmazonECSTaskExecutionRolePolicy，该策略授予日常使用场景所需的权限。\n\
  \n\n\n\n## Task IAM Roles\n\n除了定义任务执行角色之外，您还可以为任务中运行的容器定义角色。如果您的应用程序（容器）需要进行 API\
  \ 调用，例如访问数据库或存储服务，任务 IAM 角色可以帮助您定义必要的权限并在需要时授予临时凭证。任务 IAM 角色作为任务定义的一部分定义，或使用 RunTask\
  \ API 操作定义。任务 IAM 角色还使您能够为不同的任务定义不同的权限。这确保了最小权限原则的应用。\n\n除了确保您的任务具有访问各种 AWS 服务的正确权限之外，您还必须了解这些任务在您的\
  \ AWS 账户中是如何部署的。任务放置策略允许您定义任务的部署方式——例如，您希望任务在多个可用区运行还是在单个可用区运行。在下一节中，您将了解有关任务放置策略的更多信息。\n\
  \n## Task Placements\n\n当您使用 EC2 启动类型启动任务时，必须定义这些任务运行的位置以及使用哪些实例。任务放置的参数基于 CPU、内存和端口等要求。您还可以定义在缩容时终止任务的策略，从而允许\
  \ ECS 确定首先终止哪些任务。\n\n除了基于 CPU、内存和端口放置任务之外，您还可以基于任务放置约束定义任务放置的位置，并按如下方式定义任务放置策略。\n\
  \n### Task Placement Constraints\n\n任务放置约束是管理任务放置方式的规则。它们可以在创建新的 ECS 服务或更新现有服务时设置，或者您可以为独立任务指定它们。\n\
  \n约束由类型组成，该类型定义规则，以及表达式，该表达式指定实例属性。Amazon ECS 支持以下类型的约束：\n\n- **distinctInstance**：任务放置在不同的容器实例上。\n\
  - **memberOf**：将任务放置在满足表达式的容器实例上。您可以在运行任务、创建新服务、新任务定义或现有任务定义的新修订版时指定 memberOf 约束。\n\
  \n您可以拥有自定义或内置属性，例如 ecs.ami-id、ecs.os-type 和 ecs.instance-type。例如，您可以定义一个约束来将实例类型限制为仅\
  \ t2.micro。\n\n您还可以使用集群查询语言对容器实例进行分组。例如，您可以使用可用区、实例类型或其他自定义属性等属性对容器实例进行分组。然后，您可以根据此组自定义\
  \ ECS 如何放置任务。\n\n表达式具有以下语法：subject operator [argument]。例如，以下表达式使用位于 eu-west-2a 或\
  \ eu-west-2b 可用区的实例：\n\n```\nattribute:ecs.availability-zone in [eu-west-2a, eu-west-2b]\n\
  ```\n\n另一个示例是任务亲和性，您可以在其中选择托管 service:development 组中任务的实例：\n\n```\ntask:group ==\
  \ service:development\n```\n\n接下来，您可以定义任务放置策略。\n\n### Task Placement Strategies\n\
  \nAmazon ECS 支持以下放置策略：\n\n- **Binpack Strategy**：在 binpack 策略中，任务放置在实例上，以使未使用的 CPU\
  \ 或内存量最少。这种放置策略可让您最大限度地减少分配给任务的容器实例数量。\n\n  此策略的示例如下：\n\n  ```\n  \"placementStrategy\"\
  : [\n    {\n      \"field\": \"memory\",\n      \"type\": \"binpack\"\n    }\n \
  \ ]\n  ```\n\n  在这里，策略是 binpack，任务的放置基于内存。\n\n- **Random Strategy**：在随机策略中，任务随机放置。以下是此策略的示例：\n\
  \n  ```\n  \"placementStrategy\": [\n    {\n      \"type\": \"random\"\n    }\n\
  \  ]\n  ```\n\n- **Spread Strategy**：spread 策略是根据定义的值将任务均匀放置。可接受的值可以是 instanceId、host\
  \ 或应用于容器实例的另一个自定义属性，例如 attribute:ecs:availability-zone，这使您可以将任务均匀地分布在可用区中。\n\n \
  \ 以下是 spread 策略的示例：\n\n  ```\n  \"placementStrategy\": [\n      {\n          \"\
  field\": \"attribute:ecs.availability-zone\",\n          \"type\": \"spread\"\n\
  \      }\n  ]\n  ```\n\n您还可以使用各种策略按您希望执行的顺序定义多个任务放置策略。例如，您可以拥有一个任务放置策略，该策略将任务均匀地分布在可用区中，然后再根据内存对这些任务进行\
  \ binpack。以下是示例：\n\n```\n\"placementStrategy\": [\n    {\n        \"field\": \"\
  attribute:ecs.availability-zone\",\n        \"type\": \"spread\"\n    },\n    {\n\
  \        \"field\": \"memory\",\n        \"type\": \"binpack\"\n    }\n]\n```\n\n\
  任务放置策略也可以使用 CLI 以及控制台定义，如图 11.4 所示：\n\n![Figure 11.4: Task placement strategies](img/34ff9b5b5a734dae3450ab701e223c73_455_0.png)\n\
  \n请注意，这些任务放置策略仅在使用 EC2 启动类型时使用，而不是 Fargate。虽然任务放置约束和策略使您可以配置任务的放置方式和位置，但您还必须考虑应用程序的可扩展性要求。Amazon\
  \ ECS 提供任务层和容器层可扩展性选项，将在下一节中讨论。\n\n## Amazon ECS Scaling Options\n\nAmazon ECS 提供两种不同的扩展选项。第一个是服务自动扩展功能，可增加或减少集群中任务的数量。第二个是集群扩展选项，可处理托管任务的\
  \ EC2 实例的扩展和缩减。\n\n### Service Auto-Scaling\n\nECS 服务自动扩展会自动扩展和缩减在集群中运行的任务数量，并使用\
  \ Application Auto Scaling 服务。这适用于 EC2 启动类型和 Fargate。Amazon ECS 将发布 CloudWatch 指标，指定平均\
  \ CPU 和内存利用率，然后用于确定何时扩展和缩减。\n\n图 11.5 描述了自动扩展过程：\n\n![Figure 11.5: Auto-scaling\
  \ process](img/34ff9b5b5a734dae3450ab701e223c73_456_0.png)\n\n前图中自动扩展工作流程如下：\n\n\
  - 缩放策略设置为在平均 CPU 利用率达到 70% 时触发。\n- CloudWatch 生成警报并通知 Application Auto Scaling 服务。\n\
  - Amazon ECS 服务启动另一个任务以进行补偿。\n\n以下缩放策略可与 Amazon ECS 配合使用：\n\n- **Target tracking\
  \ scaling policies**：Amazon ECS 将根据特定指标的预定义目标值启动或终止任务。例如，如果您将平均 CPU 利用率目标值设置为 50%，ECS\
  \ 将仅启动足够多的任务以确保满足此目标值。它不会启动额外的任务来使平均 CPU 利用率低于此值。\n\n- **Step scaling**：Amazon ECS\
  \ 将根据警报违规启动或终止任务，并且警报违规的大小用于定义要启动的任务数量。\n\n- **Schedule scaling**：Amazon ECS 将根据您指定的日期和时间启动或终止任务。\n\
  \n### Cluster Auto Scaling\n\n集群自动扩展是指扩展底层 EC2 实例以确保为集群中运行的任务提供足够的资源。\n\n为了确定实例是否需要扩展，ECS\
  \ 使用启用了托管扩展的 **Auto Scaling group capacity provider**。Amazon ECS 创建两个自定义 CloudWatch\
  \ 指标——一个用于低 CloudWatch 指标警报，另一个用于高 CloudWatch 指标警报。然后它使用附加到自动扩展组的 **target tracking**\
  \ 缩放策略。ECS 然后根据任务的资源利用率管理缩减和扩展操作。\n\nCapacityProviderReservation 是用于确定自动扩展组中剩余容量的指标。如果此指标大于\
  \ targetCapacity，则表示正在运行更多任务并消耗更高比例的容量。作为响应，自动扩展组启动注册到集群的额外 EC2 实例。相反，如果此指标小于 targetCapacity，自动扩展组将缩减。\n\
  \n为了确保您仅终止没有运行 Amazon ECS 任务的实例，您还必须打开 **managed termination protection** 功能。\n\n\
  接下来，我们将讨论为什么在 Amazon ECS 上部署应用程序时网络至关重要。它决定了容器如何相互通信以及与外部世界的通信。ECS 提供多种网络模式，每种模式都适用于不同的用例。\n\
  \n\n\n\n\n## Amazon ECS 上的网络\n\nAmazon ECS 上的网络使您能够定义应用程序如何从 VPC 内部以及外部流量访问。以下网络模式在\
  \ Amazon ECS 上可用：\n\n- **awsvpc 网络模式：** 此模式为每个运行的 ECS 任务分配一个弹性网络接口（ENI），为其在 VPC\
  \ 中提供 IP 地址。此设置非常适合需要高网络隔离以及直接访问 VPC 中其他 AWS 服务或资源的任务。它通过允许任务直接通过 AWS 网络与数据库、缓存和其他服务交互，从而简化了网络架构。\n\
  \n- **bridge 网络模式：** 在此模式下，同一 EC2 实例上的容器共享网络桥，促进它们之间的通信。此模式适用于需要简单容器间通信且不需要 awsvpc\
  \ 模式提供的高级功能或隔离的应用。端口映射将容器端口暴露给主机，允许外部流量到达容器。\n\n- **host 网络模式：** 此模式通过消除容器与主机之间的网络隔离，为容器提供最高性能的网络。它最有利于不需要其他模式提供的网络隔离的高吞吐量应用。容器使用\
  \ EC2 实例的网络栈；开发人员或架构师必须管理端口冲突。\n\n在下一节中，您还将学习如何使用负载均衡来分发到您的 Amazon ECS 部署的传入流量。\n\
  \n## Amazon ECS 的负载均衡\n\nAmazon ECS 可以配置为使用 Elastic Load Balancing 在任务之间分发流量。您可以使用\
  \ Application Load Balancer 处理 HTTP/HTTPS 流量，并使用 Network Load Balancer 处理 TCP/UDP\
  \ 流量。\n\nAmazon Elastic Load Balancers 是容器感知的，这意味着您可以从单个 ECS 服务在同一容器实例上运行多个任务。这是通过一种称为动态主机端口映射的概念实现的。让我们从架构角度结合\
  \ *Figure 11.6:* 中的图表来审视这一点：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_459_0.png)\n\
  \n需要注意的要点如下：\n\n- Application Load Balancer 在端口 80 上监听传入请求。\n- 运行 Web 服务应用的容器将通过\
  \ HTTP（80）提供内容。\n- 主机端口从 32768 到 61000 之间的临时端口范围内动态分配。\n\n当容器（任务）启动时，它会作为实例 ID 和端口组合注册到\
  \ Application Load Balancer。这种对主机端口的感知可确保流量被路由到该实例 ID 以及对应容器的端口。\n\n这种动态主机端口映射使您能够使用单个\
  \ ECS 服务运行多个容器，同时确保根据前述图表，正确的应用程序可从互联网访问。\n\n在 awsvpc 网络模式下配置目标组时，您必须将目标类型定义为 **IP**\
  \ 而不是 **Instance**。这是因为您的任务与弹性网络接口相关联，而不是 EC2 实例。\n\n另请注意，如果您的容器托管在 VPC 的私有子网中，您必须配置\
  \ NAT 网关以启用出站互联网访问，如 *Figure 11.6* 所示。\n\n在下一节中，您将获得 Amazon ECS Copilot 服务的快速概述。\n\
  \n## Amazon ECS Copilot 简介\n\nAmazon ECS Copilot 是一种命令行工具，使您能够快速构建和部署生产就绪的容器化应用程序。Copilot\
  \ 不仅仅是一个 CLI 工具。该服务遵循 AWS Well-Architected Framework 和最佳实践，为您的应用程序栈构建必要的<|message|>\
  \ 基础设施组件 – VPC、子网、负载均衡器和存储服务。\n\nAmazon ECS Copilot 还与持续集成和持续部署（CI/CD）工具集成，使您能够自动将更新和新版本部署到您的应用程序栈。\n\
  \n要使用 Copilot，您需要执行以下操作：\n\n- 1. 安装 AWS Copilot CLI。目前为 Linux 和 macOS 操作系统提供支持。\n\
  - 2. 安装并配置 AWS CLI。\n- 3. 运行 AWS configure 实用程序以访问凭据。\n- 4. 安装并运行 Docker。\n\nAmazon\
  \ ECS 彻底改变了开发人员如何在 AWS 上设计、打包和部署应用程序的方式。使用共享操作系统内核以及将应用程序代码与运行所需的所有文件和库一起打包的能力，具有超出传统虚拟化基础设施的诸多优势。\n\
  \nAmazon ECS 也有一个替代方案：一个名为 Kubernetes 的厂商无关产品。Kubernetes 是一种开源容器编排解决方案，用于 AWS、Azure\
  \ 和 Google Cloud 等各种云提供商。这使得在多云平台架构中更轻松地管理容器。\n\n为了确保兼容性并占领市场份额，AWS 提供了 Amazon Elastic\
  \ Kubernetes Service（Amazon EKS），这是一种托管的 Kubernetes 解决方案，与其他 AWS 服务和工具紧密集成。在后续章节中，您将获得\
  \ Amazon EKS 的概述。\n\n## 使用 Amazon EKS 大规模运行和管理容器\n\n在云计算的动态世界中，采用容器化技术已成为部署可扩展且高效应用程序的重要策略。在这些技术中，Kubernetes\
  \ 已成为编排容器化应用程序的事实标准，提供强大的功能来大规模管理复杂部署。Amazon Elastic Kubernetes Service（EKS）是 AWS\
  \ 的完全托管解决方案，将 Kubernetes 的敏捷性、可扩展性和可靠性带到云中，使开发人员和运维团队能够专注于构建软件，而无需管理底层基础设施的开销。\n\
  \n## 了解 Amazon EKS\n\nAmazon EKS 通过管理 Kubernetes 控制平面来简化在 AWS 上运行 Kubernetes，该控制平面是负责编排容器的核心组件。此托管服务自动化诸如版本升级、修补和扩展控制平面等任务，确保您的\
  \ Kubernetes 环境始终保持最新、安全且高度可用。\n\n## Amazon EKS 的关键特性\n\nAmazon EKS 提供了一系列功能，使其成为在\
  \ AWS 上运行 Kubernetes 的强大而灵活的选择。以下是其中的一些功能：\n\n- **完全托管的 Kubernetes 控制平面**：EKS 免除了您管理控制平面的运营负担，在多个\
  \ AWS 可用区提供高可用性。\n- **与 AWS 服务集成**：EKS 与 AWS 服务提供无缝集成，包括用于分发应用程序流量的 Elastic Load\
  \ Balancing、用于身份验证的 IAM、用于网络的 Amazon VPC、用于日志记录和监控的 Amazon CloudWatch，以及用于镜像管理的\
  \ Amazon ECR。\n- **灵活性和可移植性**：使用 EKS，您可以使用 Amazon EC2 实例或 AWS Fargate 实现无服务器体验，在\
  \ AWS 上运行 Kubernetes 应用程序。与标准 Kubernetes 的兼容性可确保您的应用程序在不同环境中保持可移植性。\n\n## 控制平面\n\
  \n控制平面是任何 Kubernetes 集群的核心，负责管理集群状态、调度部署以及处理扩展和自愈操作。在 Amazon EKS 中，控制平面具有以下几个关键特性：\n\
  \n- **完全托管**：Amazon EKS 自动化 Kubernetes 控制平面的配置、扩展和维护，确保其始终可用并与最新 Kubernetes 版本保持同步。\n\
  - **高可用性**：控制平面在区域内的多个 AWS 可用区运行，降低了单点故障的风险，确保您的应用程序保持可访问。\n- **安全性**：工作节点与控制平面之间的通信使用\
  \ AWS Identity and Access Management（IAM）和 Kubernetes 基于角色的访问控制（RBAC）进行保护，提供细粒度的访问控制。\n\
  \n\n\n\n\n图 11.7 说明了你现在构建的架构，并且希望你对如何在 AWS 上构建和设计应用程序解决方案有了扎实的理解：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_464_0.png)\n\
  \n## 图 11.7 – 使用 EC2 实例作为后端服务的应用程序架构\n\n在即将到来的项目任务中，你将通过用在 Elastic Container Service（Fargate）上运行的容器替换托管后端功能的\
  \ EC2 实例来修改架构。\n\nTodoPlus Limited 将从本章讨论的各种原因中受益于这种架构变更。其中包括删除与运行自己的 EC2 实例相关的管理和维护开销。使用\
  \ Fargate，你无法访问底层计算基础设施，因此无需负责修补和更新运行容器的操作系统或核心服务器组件。这种共享责任模型的转变是公司始终追求的目标，因为它带来了巨大的成本节约。此外，通过使用无服务器架构和\
  \ AWS 的托管服务，你将更好地与 Well-Architected Framework 对齐，包括可持续性支柱，通过为环境尽一份力。\n\n此外，应用程序将更加轻量、可在不同服务器之间移植，并且效率更高。\n\
  \n虽然从技术上讲，从虚拟机转向容器的转变是显而易见的，但在任何生产环境中，你必须考虑变更的影响。在以下项目练习中，你将首先部署和配置 ECS 服务并将流量转移到该服务，然后终止之前的\
  \ Auto Scaling Group 配置，该配置部署了本章之前记录的架构中的 EC2 版本。\n\n虽然本章未讨论部署策略，但在现实场景中你必须考虑此类策略，其中一些已在\
  \ *第 10 章，使用 AWS Elastic Beanstalk 设计部署策略* 中进行了探讨。\n\n*图 11.8* 说明了使用 ECS Fargate\
  \ 服务更新的修改后架构。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_465_0.png)\n\n图 11.8：使用\
  \ ECS（Fargate）的应用程序架构\n\n在前面的图中，你会注意到所做的更改，已编号以帮助识别纳入设计中的组件。以下是构成架构更改的关键服务和资源的分解：\n\
  \n- **Amazon Elastic Container Registry (ECR)：** Amazon ECR 服务取代了以前用于托管应用程序源文件 ZIP\
  \ 格式的 S3 存储桶。回想一下，之前当 Auto Scaling 组启动 EC2 实例以提供后端操作时，用户数据脚本会运行，将此 ZIP 文件从存储桶复制到\
  \ EC2 实例并执行各种配置任务。在此更改中，你将创建一个 ECR 仓库来托管 Docker 镜像，该镜像将用于部署你的 Fargate 容器。\n- **Dockerfile**：Dockerfile\
  \ 包含构建 Docker（容器）镜像的指令。\n- **Task and Task Execution Roles**：作为构建的一部分，你需要一个任务角色和一个任务执行角色。任务角色使任务中的容器能够访问其他\
  \ AWS 服务，例如 Secrets Manager，以检索应用程序连接所需的数据库端点和主机详细信息，或 Amazon S3 以上传或下载内容。任务执行角色授予你的\
  \ ECS 容器或 Fargate 代理权限以执行特定操作，例如访问 ECR 注册表以提取容器镜像或将日志数据发送到 Amazon CloudWatch。\n\
  - **Task Definition**：你的任务定义将包含部署容器所需的所有参数，例如使用哪个容器镜像、网络模式、CPU 和内存分配、映射端口、操作系统以及任何环境变量。\n\
  - **ECS Cluster**：你必须部署一个 ECS 集群，在其中定义用于容器的 VPC 和子网等参数。\n- **ECS Service**：在 ECS\
  \ 中，你将定义创建的任务定义、部署容器的子网、安全组、将流量分发到这些容器的负载均衡器和目标组，以及任何服务自动扩展参数。\n- **AWS Fargate**：一旦你部署了\
  \ ECS 服务，这将触发在 AWS Fargate 中启动你的容器。对这些容器的访问将通过在你的 VPC 中指定的子网中部署的 ENI 提供。\n\n现在你已经对架构设计变更有了高层次的概述，是时候继续进行项目任务以执行配置更改了。\n\
  \n## 技术要求\n\n在即将到来的项目任务中，你必须登录到 AWS 开发账户，在该账户中你一直在设计和部署 Todo List 应用程序。确保你以 IAM\
  \ 用户 Alice 的身份登录。\n\n你还需要安装和配置 Docker 引擎，该引擎将用于创建你的容器镜像。由于并非每个人都能在其本地机器上安装此类工具（例如，如果你使用的是具有某些限制的工作笔记本电脑），因此提供了逐步指南，说明如何启动账户中的额外\
  \ EC2 实例以构建 Docker 镜像。你可以在创建 Docker 镜像并将其上传到 Amazon ECR 仓库后关闭该实例。\n\n本章的代码可以在此 GitHub\
  \ 仓库链接中找到：`https://packt.link/m5DnU`\n\n## 项目任务 11.1 – 创建 Amazon Elastic Container\
  \ Registry（ECR）仓库\n\n在此任务中，你将在 Amazon ECR 中创建一个新仓库来托管你的 Docker（容器）镜像：\n\n- 1. 以\
  \ IAM 用户 Alice 的身份登录到 AWS 开发账户。\n- 2. 通过在 AWS 管理控制台主页顶部搜索栏中搜索该服务，导航到 ECR 控制台。\n\
  - 3. 检查页面右上角选择的区域，以确保你位于 N.Virginia 区域。\n- 4. 从左侧菜单中选择 **Repositories**。\n- 5. 在右侧窗格中，单击\
  \ *Create repository* 按钮。\n- 6. 在 **Visibility settings** 下，选择 **Private**。\n- 7.\
  \ 在默认仓库名称后添加后缀以唯一标识你的仓库。例如，你可以添加名称 **todo-plus**，如图 11.9 所示。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_467_0.png)\n\
  \n- 8. 滚动到页面底部并单击 *Create repository* 按钮。\n- 9. 你将被重定向回仓库列表，你应该会找到为你创建的仓库。确保记下此仓库的\
  \ URL，因为你将在下一个项目任务中使用它。\n\n接下来，你将构建更新后的 Node.js 应用程序的 Docker 镜像，该镜像将用于构建你的容器。\n\n\
  ## 项目任务 11.2 – 启动用于创建 Docker 镜像的实例\n\n如本章技术要求部分所述，为了便于创建你的容器镜像，你需要部署一个额外的 EC2 实例并使用它来构建你的镜像。\n\
  \n作为部署此额外 EC2 实例的前奏，你必须创建一个 IAM 角色，该角色授予 EC2 权限以将 Docker 镜像推送到 ECR 仓库。你还需要权限通过 Systems\
  \ Manager 和 Session Manager 远程访问该实例。这种对实例的远程连接更加安全，因为你无需打开端口或配置防火墙规则：\n\n- 1. 确保你仍登录到\
  \ AWS 开发账户。还确保你正在 N.Virginia（us-east-1）区域中操作。\n- 2. 通过在控制台主页的搜索栏中搜索该服务，导航到 IAM 管理控制台。\n\
  - 3. 从左侧菜单中单击 Roles，然后在右侧窗格中单击 Create role 按钮。\n- 4. 选择 AWS service 作为受信任实体类型，然后在\
  \ Use case 下选择 EC2。单击 Next。\n- 5. 在 Permissions policies 部分的搜索框中，搜索并选择 AmazonSSMManagedInstanceCore\
  \ 和 EC2InstanceProfileForImageBuilderECRContainerBuilds 策略。\n- 6. 确保两个策略都已正确选择，如图\
  \ 11.10 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_468_0.png)\n\n图 11.10：授予\
  \ EC2 实例访问 ECR 并通过 Session Manager 启用远程连接的策略\n\n- 7. 单击 Next。\n- 8. 为你的 IAM 角色提供一个名称，例如\
  \ iam-role-grant-ec2-access-to-ecr。\n- 9. 单击屏幕底部的 Create role 按钮。\n\n\n\n\n\n+ \
  \  10. 在 Web 控制台顶部的搜索栏中搜索 EC2 服务，导航到 EC2 管理控制台。\n+   11. 从左侧菜单中，点击 **实例**，然后在右侧窗格中，点击\
  \ **启动实例**。\n+   12. 为您的实例提供一个名称，例如 **DockerImage-Server-01**。\n+   13. 确保已选择 **Amazon\
  \ Linux 2003 AMI**。\n+   14. 对于实例类型，请确保选择 **t2.micro**。\n+   15. 对于 **密钥对（登录）**，选择\
  \ **继续而不使用密钥对（不推荐）**。您不需要密钥对，因为您将向此实例附加一个 IAM 角色，以便可以使用 AWS Systems Manager Session\
  \ Manager 连接到它。\n+   16. 点击 **网络设置** 部分中的 **编辑** 按钮。接下来，从 **VPC – 必选** 下拉列表中选择 **todolist-vpc**，如图\
  \ 11.11 所示：\n+   17. 确保您也选择了 **todolist-app-subnet01** 子网。由于您将使用 Session Manager\
  \ 连接到实例，因此不需要它拥有公有 IP 地址——这是一项额外的安全措施。\n+   18. 接下来，点击 **选择现有安全组** 选项，并从 **常用安全组**\
  \ 下拉列表中选择 **default** 安全组。\n+   19. 进一步向下滚动页面，展开 **高级详细信息** 部分。\n+   20. 接下来，从 IAM\
  \ 实例配置文件下拉列表中选择 **iam-role-grant-ec2-access-to-ecr**。\n+   21. 最后，滚动到页面底部，点击 **启动实例**\
  \ 按钮。\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_469_0.png)\n\n图 11.11：DockerImage-Server-01\
  \ 的 VPC 和子网选择\n\n22. 您的 EC2 实例需要几分钟才能启动，理想情况下，您必须等待它通过所有检查后再连接到它。从左侧菜单点击实例链接，您应该会在右侧窗格中看到您的实例。检查以确保实例已通过两项检查，如图\
  \ 11.12 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_470_0.png)\n\n图 11.12：DockerImage-Server\
  \ 状态检查\n\n## 项目任务 11.3 – 构建 Docker 镜像\n\n+   1. 既然您的实例正在运行，现在该连接到它了。确保您已登录到您的 AWS\
  \ 开发账户和 EC2 管理控制台。\n+   2. 从左侧菜单中，点击实例并选择 DockerImage-Server-01 实例。\n+   3. 点击屏幕右上角的连接按钮。\n\
  +   4. 您将被重定向到“连接到实例”网页。\n+   5. 选择 Session Manager 选项卡，然后点击连接按钮，如图 11.13 所示：\n\n\
  ![](img/34ff9b5b5a734dae3450ab701e223c73_470_1.png)\n\n图 11.13：使用 Session Manager\
  \ 连接到实例\n\n6. 当您连接到实例时，您应该会看到以下屏幕：\n\n会话 ID：root-7rtyphzgodxtqmx67gsdvppjce 实例 ID：i-0ff02a553fb1b10af\n\
  \n![](img/34ff9b5b5a734dae3450ab701e223c73_471_0.png)\n\n图 11.14：使用 Session Manager\
  \ 连接到您的实例\n\n7. 接下来，您必须在此服务器上安装 Docker 引擎：\n\n+   I. 输入 `sudo yum update -y` 命令并按\
  \ Enter 键。这将执行操作系统上的任何待处理更新。在大多数情况下，不需要进行更新。使用 sudo 将提升您的权限以运行这些命令。\n\n+   II. 接下来，输入\
  \ `sudo yum install docker` 命令并按 Enter 键。这将显示 Docker 软件包的安装状态。系统将要求您确认是否要下载并安装这些软件包。继续输入\
  \ y 并按 Enter 键。\n\n+   III. 下载和安装成功后，您将看到 Complete! 消息，如图 11.15 所示：\n\n![](img/34ff9b5b5a734dae3450ab701e223c73_471_1.png)\n\
  \n图 11.15：成功安装 Docker\n\n+   IV. 接下来，输入 `clear` 命令并按 Enter 键。这将清除屏幕，使其不会过于杂乱，便于阅读。\n\
  \nV. 接下来，您需要启动 Docker 服务。输入 `sudo service docker start` 命令并按 Enter 键。您应该会收到以下确认信息：\n\
  \n```\nsh-5.2$ sudo service docker start\nRedirecting to /bin/systemctl start docker.service\n\
  sh-5.2$\n```\n\n图 11.16：启动 Docker 服务\n\nVI. 接下来，您需要为实例上的内置账户 ec2-user 分配与 Docker\
  \ 服务交互和工作的能力。目前，该账户没有权限，需要通过将 ec2-user 添加到 Docker 组来分配这些权限。输入 `sudo usermod -a -G\
  \ docker ec2-user` 命令并按 Enter 键。该命令将被接受，并会出现一个新的光标行。\n\nVII. 接下来，为了确保新权限可用，您必须退出会话并重新登录。输入\
  \ `exit` 并按 Enter 键。这将断开您与会话的连接，您必须重新登录。\n\nVIII. 导航回 EC2 管理控制台，点击左侧菜单中的实例，然后在右侧选择\
  \ DockerImage-Server-01 实例。按照项目任务 11.2 中步骤 16 到 19 所述的过程连接到实例。\n\n8. 既然您已使用 Session\
  \ Manager 重新登录到您的实例，请将用户切换到 ec2-user 账户。为此，输入 `sudo su ec2-user` 命令并按 Enter 键。您应该会看到以下输出：\n\
  \n会话 ID：root-b4lr55s6jdn dfxpsv27s2ntbti 实例 ID：\n\n```\nsh-5.2$ sudo su ec2-user\n\
  [ec2-user@ip-10-0-1-28 bin]$\n```\n\n图 11.17：连接到实例并将用户切换为 ec2-user\n\n9. 您现在可以使用以下说明构建您的\
  \ Docker 镜像：\n\n+   I. 输入 `cd /` 并按 Enter 键。\n\n+   II. 接下来，输入 `cd home` 并按 Enter\
  \ 键，导航到 home 文件夹。您应该会看到类似于以下屏幕截图的输出，显示 home 文件夹的内容：\n\n```\n```\n[ec2-user@ip-10-0-1-141\
  \ bin]$ cd /\n[ec2-user@ip-10-0-1-141 /]$ ls\nbin boot dev etc home lib lib64 local\
  \ media mnt opt proc\n[ec2-user@ip-10-0-1-141 /]$ cd home\n[ec2-user@ip-10-0-1-141\
  \ home]$ ls\nec2-user ssm-user\n[ec2-user@ip-10-0-1-141 home]$ \n```\n```\n\n图 11.18：在服务器上导航到主目录\n\
  \n+   III. 接下来，输入 `cd ec2-user` 命令并按 Enter 键。您将进入 `ec2-user` 目录。\n\n+   IV. 接下来，您需要下载更新的\
  \ Todo List 后端应用程序，其中包含执行所有后端操作所需的所有 API。此下载还将包含您将用来构建 Docker 镜像的 Docker 文件。仍在 `ec2-user`\
  \ 目录中时，输入 `wget` 命令并按 Enter 键。\n\n+   V. 此 `wget` 命令将 ZIP 文件从 GitHub 存储库直接下载到您的\
  \ `ec2-user` 目录。\n\n+   VI. 接下来，输入 `ls` 命令并按 Enter 键。您将看到 `todo-plus-nodejs-updated.zip`\
  \ 文件已下载。\n\n+   VII. 输入 `unzip todo-plus-nodejs-updated.zip` 命令以解压缩文件内容。这将创建一个名为\
  \ `todo-plus-nodejs` 的目录，其中包含您构建 Docker 镜像所需的所有文件。输入 `cd todo-plus-nodejs` 并按 Enter\
  \ 键，导航到该文件夹中。\n\n+   VIII. 接下来，输入 `ls` 并按 Enter 键，您应该会看到此文件夹的内容，如图 11.19 所示：\n\n\
  ```\n```\n[ec2-user@ip-10-0-1-141 ~]$ ls\ntodo-plus-nodejs  todo-plus-nodejs-updated.zip\n\
  [ec2-user@ip-10-0-1-141 ~]$ cd todo-plus-nodejs/\n[ec2-user@ip-10-0-1-141 todo-plus-nodejs]$\
  \ ls\nDockerfile docker-compose-mysql.yml package-lock.json prisma test tsconfig.json\n\
  README.md nest-cli.json package.json src tsconfig.build.json user-data.sh\n[ec2-user@ip-10-0-1-141\
  \ todo-plus-nodejs]$\n```\n```\n\n图 11.19：解压缩 todo-plus-nodejs-updated.zip 文件夹\n\
  \n+   IX. 解压缩后的文件夹包含一个 Dockerfile。在您喜欢的编辑器中打开该文件以进行查看。\n\n10. 使用提供的 Dockerfile 创建一个\
  \ Docker（容器）镜像：\n\n+   I. 仍通过 Session Manager 连接到实例，并且与 Dockerfile 位于同一文件夹中时，输入\
