    \ 文件中，在之前的 location 块下添加以下 location 块：\n\n```\nlocation / {\n    include uwsgi_params;\n\
    \    uwsgi_modifier1 9;\n    uwsgi_pass 127.0.0.1:9000;\n}\n```\n\n在 `/usr/lib/cgi-bin`\
    \ 中，我们将创建一个名为 `temp.py` 的文件，它将简单地为浏览器返回一个 HTTP 头和 CPU 温度文本。这里缩进很重要，因为它定义了函数块：\n\
    \n```\n#!/usr/bin/env python\nimport os\n# Return CPU temperature as a character\
    \ string\ndef getCPUtemperature():\n    res = os.popen('vcgencmd measure_temp').readline()\n\
    \    return(res.replace(\"temp=\",\"\").replace(\"'C\\n\",\"\"))\n\n#We have to\
    \ print a valid HTTP header first so the browser\n#will know how to decode the\
    \ data\nprint \"Content-type: text/html\\n\\n\"\ntempl=float(getCPUtemperature())\n\
    print templ\n```\n\n我们需要做的最后一件事是使 Python 脚本可执行：\n\n```\nchmod +x temp.py\n```\n\
    \n如果你重新加载使用提供的示例代码的网页，你现在应该能在 Python 段落中每秒看到 Raspberry Pi 的温度刷新。你也可以通过在浏览器中导航到\
    \ http://raspberrypi/cgi-bin/temp.py 来测试它。\n\n这是一个极其基础的示例，说明如何以 Web API 的方式从 Python\
    \ 提供数据。这不是标准的 Web API JSON/XML 实现，但它极其轻量且快速，是通过 HTTP 请求提供数据的一种简便方法。\n\n## Node.js\n\
    \nNode.js 是一个基于 Google V8 JavaScript 引擎构建的平台，使用事件驱动和非阻塞 I/O。\n\n它被称为 JavaScript\
    \ Web 编程语言。表面上这是正确的，但在 Node.js 二进制的深处，它使用 C/C++ 来访问本地系统资源，然后用 JavaScript 编写的标准模块（文件系统、网络缓冲、密码学、数据流等）公开\
    \ API，你可以从中扩展自己的应用程序。你永远不需要实际编写任何 C/C++，所有软件包都以 JavaScript 提供；这就是 Node.js 易于使用并被称为\
    \ JavaScript 编程语言的原因。\n\n它是对 Raspberry Pi 的绝佳运行时环境，因为它对资源极其轻量，但经过优化可处理数百个跨多个 node\
    \ 应用的请求。\n\n### 安装 Node.js\n\n我们将使用 Node.js 的自动设置脚本。执行以下命令：\n\n```\ncurl -sL https://deb.nodesource.com/setup\
    \ | sudo bash -\n```\n\n现在我们可以从新仓库安装 Node.js。\n\n```\nsudo apt-get install nodejs\n\
    ```\n\nNode.js 和 NPM 现在已安装。要检查 Node.js 是否正确安装，可以执行以下命令：\n\n```\nnode --version\n\
    ```\n\n```\nnpm --version\n```\n\n### 什么是 NPM\n\n**NPM 代表 Node Package Manager。**\
    \ 你可以在 http://www.npmjs.com 找到许多即用型应用程序和库。它们可通过单个命令行安装，该命令行在软件包的着陆页上提供。\n\n> 尝试在网站上搜索\
    \ Raspberry，以找到一些专门为 Raspberry Pi 制作的有趣软件包。\n\n### Node.js 服务器\n\n通常，你会使用 node\
    \ helloworld.js 执行 Node.js 文件，这将运行程序但不具备任何 Web 功能。为了以 Web API 的方式使用 Node.js，我们需要创建一个\
    \ Node HTTP 服务器，然后它可以响应通过 Nginx 代理的 Web 请求。\n\n与所有示例一样，我们希望 nginx 能够提供一种标准且简单的方式，通过端口\
    \ 80 将 Web 请求代理到 Raspberry Pi 内部运行的应用程序中。这使得记住 URL 变得容易，更简单地构建前端页面，并在你将 Raspberry\
    \ Pi 开放给万维网时提供一些安全性。\n\n我们将在 /etc/sites-available/nginxhtml 目录中的现有文件添加一个新的 location\
    \ 块：\n\n> 你可以通过创建新的 location 块名称（虚拟目录）并调整你的 node 应用程序绑定的 proxy pass 设置来像这样运行多个\
    \ node 应用程序。\n\n```\nlocation /node {\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
    \    proxy_set_header Host $http_host;\n    proxy_set_header X-NginX-Proxy true;\n\
    \    proxy_pass http://127.0.0.1:5000;\n    proxy_redirect off;\n}\n```\n\n我们将安装两个软件包来帮助获取\
    \ Raspberry Pi 的电压设置。首先，我们将安装一个名为 **express** 的软件包，它将允许我们轻松创建 RESTful API，然后是\
    \ pi-volts 模块。\n\n使用软件包的典型方法是在你的应用程序目录中安装它们，该目录保存在 /node_modules 中且仅对该应用程序可访问。我们将使用\
    \ -g 开关，这将一次性将软件包安装到 /usr/lib/node_modules/ 目录中，该目录将对你创建的任何 node 应用程序全局可用。这可以节省\
    \ SD 卡上的空间，但意味着使用该全局软件包的所有应用程序必须使用该特定版本。你也可以将软件包如 express 全局安装，然后为单个应用程序如 pi-volts\
    \ 安装一个小型软件包。\n\n每当你创建一个新的应用程序目录时，你必须使用 npm 初始化应用程序。这会创建一个配置文件并让 Node.js 知道你希望将应用程序特定的软件包（非全局）安装到此目录。会显示几个屏幕问题；如果你愿意，可以对所有问题都按\
    \ Enter。因为 nginx 不执行或提供原始 Node.js 文件，我们将保持命名约定与 Python 相似。我将在接下来的几行命令中演示这种方法：\n\
    \n```\nsudo npm install express -g\ncd /usr/lib\nsudo mkdir node_bin\ncd node_bin\n\
    sudo mkdir volts\ncd volts\nnpm init\nsudo npm install pi-volts\ntouch index.js\n\
    ```\n\n你现在已为你的应用程序设置了基本框架，并仅为此 Node.js 应用程序安装了 pi-volts 软件包。编辑 index.js 并插入以下文本：\n\
    \n```\nvar http = require('http');\nvar express = require('express');\nvar app\
    \ = express();\nvar volt = require(\"pi-volts\");\n\n// Express route for incoming\
    \ requests (GET)\napp.get('/node/core/voltage/', function(req, res) {\n  res.send(String(volts));\n\
    });\n\n// configure Express to listen on port 5000\napp.listen(5000);\n```\n"
