    \ is guaranteed to run every 60 seconds to the microsecond. This is crucial to\
    \ make sure that you can run an algorithmic function, which uses your wind counter\
    \ to save the wind speed. On an event driven OS, you may get highly inaccurate\
    \ readings caused by delayed processor queues or the optimized execution.\n\n\
    ## Analog inputs\n\nThe Raspberry Pi lacks analog inputs. MCUs usually have more\
    \ analog inputs than digital ones. On tiny versions, they may even completely\
    \ lack digital inputs.\n\nAnalog inputs will be very useful to read the direction\
    \ of the wind, as wind vanes usually output a calculated sub-voltage from the\
    \ input voltage to inform you of the direction. Something like a potentiometer,\
    \ but more simply, it is like various resistors connected to a reed switch, which\
    \ will activate a given circuit.\n\nThere are still a lot of other applications\
    \ that can be useful for analog inputs.\n\n## Parts required\n\nThe most affordable\
    \ and pretty complete package is offered by Sparkfun—a wind vane, anemometer,\
    \ and rain counter, with cables and a complete installation mount. Adding extras\
    \ to this, such as instruments to measure UV light, atmospheric pressure, and\
    \ temperature, is a breeze.\n\nYou will also need a Raspberry Pi and a programmed\
    \ Arduino MCU or similar.\n\n## Storing data on the Cloud\n\nAt some point of\
    \ any project, you will, most certainly, want to store collected data somewhere.\
    \ Usually, this is from collecting sensors, but it could also be debugging data.\n\
    \nThe Cloud is a network of servers that can provision virtual machines for any\
    \ use. Usually, you start from one server, but you always have the ability to\
    \ increase the size or bundle several virtual machines to act as one endpoint.\
    \ All this is usually handled by a nice frontend, such as Azure, Amazon AWS, or\
    \ the Google Cloud platform.\n\n## Phant\n\nPhant is a logging tool developed\
    \ by Sparkfun Electronics and is ready to be used free of charge at https://data.sparkfun.com;\
    \ it stores data in JSON format. JSON is easy to read and compress, but most importantly,\
    \ it's dynamic; dynamic meaning that you don't build relationships between each\
    \ data packet, as in traditional SQL servers. This means that each data packet\
    \ can contain any variety of structures that you save to Phant.\n\nYou can find\
    \ yourself a very cheap Linux-based virtual machine and install your own Phant\
    \ platform to take full control of your cloud data. This is an extremely easy\
    \ way to allow you access to shared data anywhere in the world, as long as you\
    \ have an Internet connection.\n\n## Summary\n\nIn this chapter, you learned the\
    \ basics of electrical engineering and the external system's integration. The\
    \ possibilities are endless and only confined to your own imagination. In case\
    \ you ever seem to get stuck, it is worth visiting some of these great sites for\
    \ more information.\n\nFor Stack Exchange, use the following:\n\n- Electrical\
    \ Engineering: http://electronics.stackexchange.com/\n- Raspberry Pi: http://raspberrypi.stackexchange.com/\n\
    - Stack Overflow (Programming): http://stackoverflow.com/\n- Ask Ubuntu (Linux\
    \ related): http://askubuntu.com/\n\nFor other sites, use the following:\n\n-\
    \ Arduino Forums: https://forum.arduino.cc/\n- PICAXE Forums: http://www.picaxeforum.co.uk/\n\
