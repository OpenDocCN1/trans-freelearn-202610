    如果你计划使用 Asterisk 进行 VoIP，微小的上行带宽可能会导致严重的延迟和抖动。但 Asterisk 附带了许可的 GSM 编解码器，对于单次通话，上行带宽为
    64 千比特即可工作。你可以购买闭源编解码器，它们可以在更慢的连接上工作，但会以语音质量为代价。


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_48_0.png)


    ## Internet 配置


    在成功托管任何类型的 Internet 应用之前，需要解决一些障碍。解决方案受 ISP 为你提供的套餐影响，但几乎每个问题都可以找到变通方法。


    ## 家用套餐


    家用套餐最基本的部分是你几乎总是拥有一个动态 IP 地址。IPv6 的日益普及旨在通过为你的所有设备分配一个 IPv6 地址来消除这个问题，任何知道该地址的人都可以从世界任何地方访问。一些
    ISP 会允许你升级到静态 IP，但仍可能存在一些限制。拥有动态 IP 的问题在于它可能会在没有通知的情况下更改。因此，如果你某天尝试使用该 IP 从 Internet
    访问你的网络，它肯定会在一段时间后停止工作。这个租期因 ISP 而异，因为有些租期短至几个小时，而其他租期可长达数年。如果你身处偏远地区而不知道当前的 Internet
    IP 地址，查明它会相当不方便。


    最为人所知的解决方案之一是使用动态 DNS 服务。许多 Internet 路由器都会提供某种动态 DNS 设置，甚至你 ISP 提供的路由器也不例外。动态
    DNS 客户端是一个程序，可自动更新公共域名 的 DNS 记录。有少数免费的动态 DNS 服务。


    ## 企业套餐


    企业套餐几乎总是包含静态 IP 地址或购买选项。这确实省去了为家用套餐需要应用的变通方法的大量工作。你可以使用 ISP 提供的 IP 地址，但在极少数情况下，它可能会更改为另一个
    IP；不过，你会提前收到警告。


    其他好处是 ISP 会允许你更改 IP 的反向 DNS 查找，这项服务在家庭套餐中不可用。如果计划运行小型邮件服务器，这项服务非常重要。这是需要配置的前提条件之一，以便其他邮件域知道你的身份。在家解决此问题的唯一方法是使用付费邮件交换，使用自定义域名发送和接收电子邮件。


    许多企业套餐提供无限且未整形的流量。ISP 可能会故意限制家庭宽带连接上的某些端口，使其变慢且可靠性降低。一些 ISP 会采取极端措施，在家庭套餐上阻止这些端口；例如，端口
    25、80、110 和 443 用于邮件和 Web 服务器。


    如果你计划将 Raspberry Pi 用于一些家庭实验、私人使用或教育目的，那么你需要做的就是花一些额外时间正确配置一切。但请注意，在家庭宽带上托管生产服务可能会违反你的合同条款和条件。如果你预计使用量很高，购买企业套餐是更好的选择。


    ## 动态 DNS


    动态 DNS 是更新公共 DNS 名称记录的一种方式。付费解决方案通常提供实时更新，而免费服务在更改发布前有最短时间。


    我一直在使用 NO-IP 的付费服务，其价格对于提供的功能来说相当合理。它还提供免费域名和服务。它还为许多操作系统提供客户端，包括兼容 Raspbian Linux
    的客户端。你可以使用任何你喜欢的服务，因为协议对每个人都相同。


    ## 安装客户端


    我在 NO-IP 注册了一个高级账户。我分配了一个名为 pi.kula.solutions 的子域名。它自动检测到我的公共 IP 并相应地设置了域名的记录。


    > 访问 http://www.mxtoolbox.com 以验证域名记录的实时更改。它还有其他几个有用的工具。


    一旦你创建了动态 DNS 账户，你就可以在 Raspberry Pi 上安装客户端。在安装过程中，系统会要求你提供凭据以及要更新的域名。


    > make -j4 命令可加快 Raspberry Pi 2 上的编译时间。如果你没有使用它，请不要使用 -j4。


    安装客户端的命令如下：


    ```

    mkdir /home/pi/noip

    cd /home/pi/noip

    wget http://www.no-ip.com/client/linux/noip-duc-linux.tar.gz

    tar xzvf noip-duc-linux.tar.gz

    cd noip-{version}

    sudo make -j4

    sudo make install

    ```


    运行 make 安装后，系统会提示你使用 No-IP 账户用户名和密码登录。间隔必须为 5 分钟或更长。现在你可以启动服务：


    ```

    sudo /usr/local/bin/noip2

    ```


    现在你有一个指向家庭 IP 地址的域名。随着本书的进展，你可能想测试各种应用程序，为此你需要在路由器上开放端口。


    不幸的是，配置路由器不在本书范围内，因为每个厂商的处理方式不同。请参阅随路由器附带的说明书，了解如何开放和转发端口。开放不必要的端口会使你面临更高的被黑客攻击风险。


    ## 免费动态 DNS 域名的变通方法


    你可能不喜欢动态 DNS 提供商提供的域名，或者你可能负担不起高级服务。相反，你可能想使用你已经拥有的但托管在其他地方的域名。我拥有另一个未在 NO-IP
    注册的域名，称为 http://www.piotrkula.com。我将以此为例，使用免费的 NO-IP 域名（如 http://randomname.no-ip.me）通过
    http://pi.piotrkula.com/ 访问我的 Raspberry Pi。


    登录你的域名 DNS 面板，并添加一个新子域名。编辑 DNS 记录，并确保它们没有任何关联的 A 记录。你需要添加一个新的 CNAME 记录及其值；在我的例子中，它是
    randomname.no-ip.me。


    现在 http://pi.piotrkula.com/ 域名会告诉访客改查看 randomname.no-ip.me 的 DNS 记录。访客将在 NO-IP
    处找到一个 A 记录，这将告诉他们正确的 IP 地址，即你的家庭 IP 且端口 80 转发到 Raspberry Pi。这不是重定向，顶级域名不会更改。访客甚至不会知道你在使用动态
    DNS，除非他们检查你的私有域名记录并追踪该 CNAME 属于动态 DNS 公司。但只要域名正常工作，就没有理由去检查它。


    使用此变通方法的唯一缺点是速度。每当访客首次查找 DNS 记录时，建立连接可能需要几秒钟。首次请求后，一切都很顺利，因为客户端通常会在会话期间缓存 IP，无论你的
    A 记录上设置了什么 TTL。每次新会话都可能出现此延迟，因为 TTL 迫使客户端再次读取 DNS。一些动态 DNS 提供商甚至可能会故意减慢 DNS 查找速度，希望你升级到付费
    DNS 服务器以获得高级服务。据我所知，NO-IP 从未这样做，即使我使用免费域名时也表现得非常快。


    ## 摘要


    了解你的网络如何配置非常重要；这包括 Internet 端和本地网络。这种深入的理解肯定会帮助你自行排查特定问题。


    我们现在已将 Raspberry Pi 连接到私有网络，并配置了一个可供 Internet 上任何人访问的域名。


    在接下来的几章中，你将了解更多可通过 Internet 提供给朋友的各种服务。

    '
