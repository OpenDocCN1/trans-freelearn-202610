    # 8

    Setting Up the Pi as

    a Media Center Server


    The Raspberry Pi has an HDMI output that is capable of streaming high definition
    audio video, and it also supports CEC to share remote control functions. In this
    chapter, we will look at how to use the Raspberry Pi as a media server directly
    from the command line, displaying images and playing audio. We will briefly look
    at some other solutions that people have come up with, and finally install OSMC
    (previously known as RaspBMC – an XBMC media center), which uses hardware decoding
    and CEC out of the box.


    If you are going to use Raspbian for these examples, it would be advisable to
    allocate some more GPU RAM. A recommended value is 512MB for the Raspberry Pi
    2. You can change core system settings by typing `raspi-config` in the command
    line.


    # Slideshows


    Linux users are familiar with the command-line program called `fbi` (frame buffer
    image viewer). We will connect a widescreen monitor or HD TV using an HDMI cable.


    > You should be aware that square aspect computer monitors smaller than 19 inches
    or non-HD TVs are generally not supported with HDMI output.'
  - '[PAGE 116]


    There is a project called HDMI Pi that offers an affordable 9-inch, HD 1280 x
    800 LCD screen, which plugs into the HDMI port without any extra parts. There
    are other smaller LCD screens available, but they can be quite expensive, and
    you need to check compatibility.


    # Using fbi


    On the Raspberry Pi, you can load original sized photos from high quality cameras,
    but it is recommended to use a fast class 10 SD card or other fast storage. The
    new quad core processor speeds up loading times considerably. On the Raspberry
    Pi 1, it was recommended to downsize photos to help loading times. With the Raspberry
    Pi, it is still advised to downsize, but you can easily keep the images in an
    HD resolution, which is near 3 megapixels (2048 x 1536). To produce the crispest
    images, it suggested to match the image resolution to the display resolution and
    the aspect ratio.


    Use the following command lines over SSH. This will install fbi and start a simple
    slideshow over SSH, but the output will be the attached monitor on HDMI:


    ```

    sudo apt-get install fbi

    cd /home/pi/photos

    sudo fbi -T 1 -a -noverbose -t 5 *.*

    ```


    fbi will now loop through all the images in the directory, changing them every
    5 seconds until you stop it.


    The T -1 command tells fbi to use the terminal one output (in SSH only), which
    will be the HDMI port. We tell it to auto resize the images to fit the screen,
    while -a -t 5 changes the image every 5 seconds, and -noverbose disables any debugging
    information.


    You will notice that fbi does not block the console and runs in the background.
    It is possible to run fbi again, and it will not complain about another instance.
    However, this may cause out-of-memory errors and unwanted behavior.


    To stop fbi, we use the killall command:


    ```

    sudo killall fbi

    ```


    # Playing videos


    We can play video and audio files using OMXPlayer, which was specifically designed
    by the XBMC project, and it uses hardware decoding on the Raspberry Pi. Since
    OMXPlayer uses hardware decoders, it is possible for you to use any additionally
    purchased video licenses.'
  - '[PAGE 117]


    > OMXPlayer requires at least 256 MB GPU RAM to run.


    # OMXPlayer for video playback


    Download an MP4 file onto the Raspberry Pi (for example, we can use the site http://www.hd-trailers.net/
    to find some links) and we will use OMXPlayer to play video and sound to the HDMI
    port. You can also use RTMP streams directly instead of video files. Replace the
    URL in wget with an existing file on the Internet:


    ```

    sudo apt-get install omxplayer

    cd /tmp

    sudo wget http://videosite.com/filename.mp4

    omxplayer -o hdmi filename.mp4

    ```


    # Playing audio


    The latest Raspbian image comes with all the sound drivers and utilities installed.
    The packages that are used belong to ALSA. The Raspberry Pi has no way to record
    audio as it has no microphone jack, and the GPIO pins are all digital. To record
    audio using GPIO, we need to use an A/D (analog-to-digital) device or a USB sound
    device that has a microphone input.


    # Aplay for audio playback


    The following is a pre-installed package that plays WAV files:


    ```

    cd /tmp

    wget http://goo.gl/Ps3paV

    mv Ps3paV siren.wav

    aplay siren.wav

    ```


    # OMXPlayer for audio playback


    OMXPlayer is not just used to play videos. It also supports the playback of audio
    files, such as MP3 files, and it will try to use hardware decoding if possible:


    ```

    omxplayer audio-test.mp3

    ```'
  - '[PAGE 118]


    # Using AirPlayer


    There is a project called shairport that works really well on the Raspberry Pi.
    It does not support videos or photos, but streaming music in it is very stable.
    We will need to get the project and compile it. This will only take a few minutes:


    ```

    cd /tmp

    git clone -b 1.0-dev git://github.com/abrasive/shairport.git

    cd shairport

    sudo ./configure && sudo make && sudo make install

    ```


    The files on /tmp will be deleted during the next boot, which is fine because
    the binaries are now installed on the Raspberry Pi. Run the server with the following
    command and the AirPlay icon will show up on your Apple devices that play music:


    ```

    shairport -a ''ShairPortPi''

    ```


    This will block the console, and you will see some messages pop up from time to
    time about packets, but this is normal.


    # Using alsamixer


    You can log into another SSH console and control the volume using alsamixer. The
    Raspberry Pi only has one output by default, and pressing the up or down key will
    make it louder or quieter:


    ```

    alsamixer

    ```


    # Installing OSMC


    OSMC is a free and open source media center, which was originally known as RaspBMC;
    it is based on XBMC. In this section, we will burn a new image on the SD card.
    You can either use another SD card or wipe the one you have been using until now.


    We can use a UI installer made for Windows, Mac OS X, and Linux:


    +   1. Open your browser and navigate to https://osmc.tv/download.

    +   2. Select the UI download link, which matches the operating system that you
    will burn the network from; download it and run it.

    +   3. Select your language and then select Raspberry Pi 2.'
  - '[PAGE 119]


    4. On the following screen, try and select the latest version.


    > Network image means that on the first boot, it will download the latest files,
    so it recommended to connect a wired network with Internet access for first boot.


    The UI installer also gives us an option to install OSMC on a USB drive instead
    of an SD card. If you select this option, you will need a USB storage device connected
    during the first boot. You will also need a keyboard.


    The first boot can take about 10 minutes to complete, after which it will reboot
    and the installation will be complete.


    # Configuring OSMC


    OSMC can be configured from the user interface, but you can still log into SSH
    to install your own services or tweak some advanced settings. The default root
    login and password is OSMC, and you also get a web remote if you navigate your
    browser to http://osmc.local.


    > On the remote page, you can use your keyboard arrows to control the user interface
    instead of clicking on the buttons.


    # Enabling other codecs


    OSMC uses OMXPlayer, which was maintained by XBMC. As we know, OMXPlayer uses
    the Pi''s hardware to decode videos and render the GUI.


    If you have MPEG-2 or VC-1 encoded files, you can simply purchase licenses and
    enter codes using the OSMC interface. The H264 codec is already licensed in the
    price of the Raspberry Pi. Do this by navigating to: Programs | OSMC Settings
    | Pi Config (Raspberry ICON) | GPU Mem & Config and then enter your keys and reboot
    the system.


    # Wireless configuration


    You should have been able to setup wireless connection during the first setup
    wizard if you had a wireless adapter plugged in. You can still configure Wi-Fi,
    and if your adapter supports it, you can also enable tethering (known as an Access
    Point), which is a great feature to extend your Wi-Fi range if your Raspberry
    Pi is connected via Ethernet. Navigate to Programs | OSMC Settings | Network (3
    CONNECTED CIRCLES ICON)'
  md: '

    ## 8 Setting Up the Pi as a Media Center Server


    The Raspberry Pi has an HDMI output that is capable of streaming high definition
    audio video, and it also supports CEC to share remote control functions. In this
    chapter, we will look at how to use the Raspberry Pi as a media server directly
    from the command line, displaying images and playing audio. We will briefly look
    at some other solutions that people have come up with, and finally install OSMC
    (previously known as RaspBMC – an XBMC media center), which uses hardware decoding
    and CEC out of the box.


    If you are going to use Raspbian for these examples, it would be advisable to
    allocate some more GPU RAM. A recommended value is 512MB for the Raspberry Pi
    2. You can change core system settings by typing `raspi-config` in the command
    line.


    ### Slideshows


    Linux users are familiar with the command-line program called `fbi` (frame buffer
    image viewer). We will connect a widescreen monitor or HD TV using an HDMI cable.


    > You should be aware that square aspect computer monitors smaller than 19 inches
    or non-HD TVs are generally not supported with HDMI output.


    There is a project called HDMI Pi that offers an affordable 9-inch, HD 1280 x
    800 LCD screen, which plugs into the HDMI port without any extra parts. There
    are other smaller LCD screens available, but they can be quite expensive, and
    you need to check compatibility.


    ### Using fbi


    On the Raspberry Pi, you can load original sized photos from high quality cameras,
    but it is recommended to use a fast class 10 SD card or other fast storage. The
    new quad core processor speeds up loading times considerably. On the Raspberry
    Pi 1, it was recommended to downsize photos to help loading times. With the Raspberry
    Pi, it is still advised to downsize, but you can easily keep the images in an
    HD resolution, which is near 3 megapixels (2048 x 1536). To produce the crispest
    images, it is suggested to match the image resolution to the display resolution
    and the aspect ratio.


    Use the following command lines over SSH. This will install fbi and start a simple
    slideshow over SSH, but the output will be the attached monitor on HDMI:


    ```

    sudo apt-get install fbi

    cd /home/pi/photos

    sudo fbi -T 1 -a -noverbose -t 5 *.*

    ```


    fbi will now loop through all the images in the directory, changing them every
    5 seconds until you stop it.


    The -T 1 command tells fbi to use terminal 1 output (in SSH only), which will
    be the HDMI port. We tell it to auto resize the images to fit the screen, while
    -a -t 5 changes the image every 5 seconds, and -noverbose disables any debugging
    information.


    You will notice that fbi does not block the console and runs in the background.
    It is possible to run fbi again, and it will not complain about another instance.
    However, this may cause out-of-memory errors and unwanted behavior.


    To stop fbi, we use the killall command:


    ```

    sudo killall fbi

    ```


    ### Playing videos


    We can play video and audio files using OMXPlayer, which was specifically designed
    by the XBMC project, and it uses hardware decoding on the Raspberry Pi. Since
    OMXPlayer uses hardware decoders, it is possible for you to use any additionally
    purchased video licenses.


    > OMXPlayer requires at least 256 MB GPU RAM to run.


    ### OMXPlayer for video playback


    Download an MP4 file onto the Raspberry Pi (for example, we can use the site http://www.hd-trailers.net/
    to find some links) and we will use OMXPlayer to play video and sound to the HDMI
    port. You can also use RTMP streams directly instead of video files. Replace the
    URL in wget with an existing file on the Internet:


    ```

    sudo apt-get install omxplayer

    cd /tmp

    sudo wget http://videosite.com/filename.mp4

    omxplayer -o hdmi filename.mp4

    ```


    ### Playing audio


    The latest Raspbian image comes with all the sound drivers and utilities installed.
    The packages that are used belong to ALSA. The Raspberry Pi has no way to record
    audio as it has no microphone jack, and the GPIO pins are all digital. To record
    audio using GPIO, we need to use an A/D (analog-to-digital) device or a USB sound
    device that has a microphone input.


    ### Aplay for audio playback


    The following is a pre-installed package that plays WAV files:


    ```

    cd /tmp

    wget http://goo.gl/Ps3paV

    mv Ps3paV siren.wav

    aplay siren.wav

    ```


    ### OMXPlayer for audio playback


    OMXPlayer is not just used to play videos. It also supports the playback of audio
    files, such as MP3 files, and it will try to use hardware decoding if possible:


    ```

    omxplayer audio-test.mp3

    ```


    ### Using AirPlayer


    There is a project called shairport that works really well on the Raspberry Pi.
    It does not support videos or photos, but streaming music in it is very stable.
    We will need to get the project and compile it. This will only take a few minutes:


    ```

    cd /tmp

    git clone -b 1.0-dev git://github.com/abrasive/shairport.git

    cd shairport

    sudo ./configure && sudo make && sudo make install

    ```


    The files on /tmp will be deleted during the next boot, which is fine because
    the binaries are now installed on the Raspberry Pi. Run the server with the following
    command and the AirPlay icon will show up on your Apple devices that play music:


    ```

    shairport -a ''ShairPortPi''

    ```


    This will block the console, and you will see some messages pop up from time to
    time about packets, but this is normal.


    ### Using alsamixer


    You can log into another SSH console and control the volume using alsamixer. The
    Raspberry Pi only has one output by default, and pressing the up or down key will
    make it louder or quieter:


    ```

    alsamixer

    ```


    ### Installing OSMC


    OSMC is a free and open source media center, which was originally known as RaspBMC;
    it is based on XBMC. In this section, we will burn a new image on the SD card.
    You can either use another SD card or wipe the one you have been using until now.


    We can use a UI installer made for Windows, Mac OS X, and Linux:


    - 1. Open your browser and navigate to https://osmc.tv/download.

    - 2. Select the UI download link, which matches the operating system that you
    will burn the image from; download it and run it.

    - 3. Select your language and then select Raspberry Pi 2.

    - 4. On the following screen, try to select the latest version.


    > Network image means that on the first boot, it will download the latest files,
    so it is recommended to connect a wired network with Internet access for first
    boot.


    The UI installer also gives us an option to install OSMC on a USB drive instead
    of an SD card. If you select this option, you will need a USB storage device connected
    during the first boot. You will also need a keyboard.


    The first boot can take about 10 minutes to complete, after which it will reboot
    and the installation will be complete.


    ### Configuring OSMC


    OSMC can be configured from the user interface, but you can still log into SSH
    to install your own services or tweak some advanced settings. The default root
    login and password is OSMC, and you also get a web remote if you navigate your
    browser to http://osmc.local.


    > On the remote page, you can use your keyboard arrows to control the user interface
    instead of clicking on the buttons.


    ### Enabling other codecs


    OSMC uses OMXPlayer, which was maintained by XBMC. As we know, OMXPlayer uses
    the Pi''s hardware to decode videos and render the GUI.


    If you have MPEG-2 or VC-1 encoded files, you can simply purchase licenses and
    enter codes using the OSMC interface. The H264 codec is already licensed in the
    price of the Raspberry Pi. Do this by navigating to: Programs | OSMC Settings
    | Pi Config (Raspberry ICON) | GPU Mem & Config and then enter your keys and reboot
    the system.


    ### Wireless configuration


    You should have been able to setup wireless connection during the first setup
    wizard if you had a wireless adapter plugged in. You can still configure Wi-Fi,
