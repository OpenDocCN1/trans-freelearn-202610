  mdcn: "\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_0_0.png)\n\n社区经验精粹\n\n## Raspberry\
    \ Pi 2 服务器精要\n\n使用本实用且易懂的教程，将你的 Raspberry Pi 转变为支持整个多媒体世界的通用 Web 服务器！\n\nPiotr\
    \ J Kula\n\n[PACKT] 出版\n\n## Raspberry Pi 2 服务器精要\n\n使用本实用且易懂的教程，将你的 Raspberry\
    \ Pi 转变为支持整个多媒体世界的通用 Web 服务器！\n\nPiotr J Kula\n\n[PACKT]\n出版\nBIRMINGHAM - MUMBAI\n\
    \n## Raspberry Pi 2 服务器精要\n\n版权所有 © 2016 Packt Publishing\n\n保留所有权利。本书的任何部分，未经出版者事先书面许可，不得以任何形式或任何手段复制、存储于检索系统或传播，但嵌入关键文章或评论中的简短引文除外。\n\
    \n本书的准备过程中已尽最大努力确保所提供信息的准确性。然而，本书所包含的信息按“原样”出售，不提供任何明示或暗示的保证。作者、Packt Publishing\
    \ 及其经销商和分销商不对因本书直接或间接造成或声称造成的任何损害承担责任。\n\nPackt Publishing 已努力通过适当使用大写字母为本书中提及的所有公司和产品提供商标信息。然而，Packt\
    \ Publishing 不能保证此信息的准确性。\n\n首次出版：2016 年 4 月\n\n生产参考：1220416\n\n由 Packt Publishing\
    \ Ltd. 出版。\nLivery Place\n35 Livery Street\nBirmingham B3 2PB, UK.\n\nISBN 978-1-78398-569-2\n\
    \nwww.packtpub.com\n\n## Credits\n\n**作者**\nPiotr J Kula\n\n**审阅者**\nIan McAlpine\n\
    Cédric Verstraeten\n\n**策划编辑**\nPriya Singh\n\n**收购编辑**\nUsha Iyer\nReshma Raman\n\
    \n**内容开发编辑**\nSanjeet Rao\n\n**技术编辑**\nJayesh Sonawane\n\n**校对编辑**\nYesha Gangani\n\
    \n**项目协调员**\nJudie Jose\n\n**校对员**\nSafis Editing\n\n**索引员**\nMonica Ajmera Mehta\n\
    \n**图形**\nDisha Haria\n\n**制作协调员**\nNilesh Mohite\n\n**封面设计**\nNilesh Mohite\n\
    \n## About the Author\n\n**Piotr J Kula** 从 6 岁时拆开父亲的 IBM PC/XT 机器开始，对计算机技术的热情就被点燃了。机器重建后成功启动，证明了\
    \ Piotr 在技术方面与生俱来的能力。\n\n25 年后，Piotr 在不同国家的各种公司工作。他一直解决复杂问题或从事新体验。只要有某种处理器，Piotr\
    \ 总是第一个尝试、修复或配置它。\n\n今天，Piotr 是其在英国的公司 Kula Solution Ltd. 的首席执行官。Piotr 在多项 Microsoft\
    \ 技术方面获得认证，并专门从事 Microsoft 和 Linux 技术。\n\nPiotr 的梦想是 Linux 和 Microsoft 之间实现统一体验。他从未因任何一方的负面情绪而气馁，反而努力在这些遥远的巨头之间架起桥梁。在发现\
    \ Raspberry Pi 后，他完全用它取代了拥有的所有其他嵌入式设备，并成功发布了 *Raspberry Pi Server Essentials*，由\
    \ *Packt Publishing* 出版。\n\n今天，随着 *Raspberry Pi 2 Server Essentials* 的发布，Piotr\
    \ 距离实现梦想又近了一步。本书主要关于 Linux，但也谈到了在你心爱的 Raspberry Pi 上集成和运行 Windows。\n\n我谨向我的了不起的妻子\
    \ Katarzyna Kula 表示感谢，她帮助我决定何时工作已足够！感谢她在我所有项目和无数在电脑前度过的时光中一直支持我。我还要感谢整个 Raspberry\
    \ Pi 社区，特别是 Stack Exchange 上的成员，*Packt Publishing* 的每一个人，以及以各种方式帮助我完成本书的人。\n\n\
    ## About the Reviewers\n\n**Ian McAlpine** 第一次接触计算机是在他学校的 Research Machines RML-380Z，以及他的物理老师的\
    \ Compukit UK101。随后是 Sinclair ZX81，然后是他至今仍拥有的 BBC Micro Model A。这份兴趣促使他获得了 Aston\
    \ University 的电子系统工程 MEng 学位和利物浦大学的信息技术 MSc 学位。Ian 目前在加拿大温哥华 SAP Labs 的 BI & Analytics\
    \ 能力中心担任产品专家。\n\nRaspberry Pi 的引入不仅重新点燃了他 *tinker* 的欲望，还提供了回馈社区的机会。因此，Ian 积极担任志愿者，参与\
    \ The MagPi 的工作，这是一本关于 Raspberry Pi 的月刊杂志，你可以在网上阅读或免费从 `https://www.raspberrypi.org/magpi`\
    \ 下载。他还持有业余无线电执照（呼号 VE7FTO），并担任当地社区应急管理办公室的通讯志愿者。他曾担任 *Packt Publishing* 出版的 *Raspberry\
    \ Pi Cookbook for Python Programmers* 和 *Raspberry Pi Projects for Kids* 书籍的技术审阅者。\n\
    \n我谨向我亲爱的妻子 Louise，以及我棒极了的孩子 Emily 和 Molly 表示感谢，感谢她们允许我消失在我的“办公室”里……并感谢她们训练我们的狗来把我找回来！\n\
    \n**Cédric Verstraeten** 拥有工程硕士学位，主要活跃于 C++ 社区。他担任软件工程师，是开源的狂热爱好者。他将大部分时间花在可以自动化和简化人们生活的副项目上。他是\
    \ Raspberry Pi Belgium 聚会的组织者，也是开源视频监控系统 Kerberos.io 的创始人。\n\n> 我要感谢 Packt Publishing\
