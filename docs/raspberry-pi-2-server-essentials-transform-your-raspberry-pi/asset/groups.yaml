    ## Resistors, fuses, and diodes


    These are typically the easiest elements of electrical design to understand. If
    you are planning to create a device, you should find a basic electronics course
    to gain good understanding of these basics before continuing.


    ## Transistors


    Everybody that uses a computer will have probably heard of a transistor. What
    is a transistor really? It is a semiconductor device that can be used to amplify
    or switch electronic signals and electrical power. A semiconductor is a solid
    substance that can conduct electricity when a certain condition has been met;
    otherwise they act as an insulator.


    Their packages are easily identified as they usually consist of three wires (legs).
    These legs are named Base (b), Collector (c), and Emitter (e):


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_160_0.png)


    The preceding illustration shows various packages that a transistor can be found
    in. The ones that look like they have two legs, actually have their base on the
    other side.


    The illustration also shows two different types of transistors: NPN and PNP. They
    essentially do the same thing, but NPN transistors are used to switch higher voltages
    and PNP lower voltage than what''s used in your main circuit. Also, PNP transistors
    are turned on when pulling the base low while NPN is turned on when you provide
    a voltage to the base.


    Usually, in prototyping, we are mostly interested in switching higher voltages,
    and from here on, we will be working with NPN transistors.


    It may sound confusing at first, but just think of a transistor as a plain old
    switch. When you apply the correct amount of current to an NPN transistor''s base,
    it is like your finger pushing a button. Once you get to the correct pressure,
    the switch will turn on, and the current will flow through the collector to the
    emitter. The amount of power (A) used to trigger a transistor is typically very
    low and safe for the GPIO''s on the Raspberry Pi.


    Looking at the sample circuit (bottom right) in the illustration, you can see
    a 9v power source connected to a resistor, LED, and then to the collector of the
    transistor. The emitter is connected to GND. This is pretty much how you will
    wire a switch. In the digital world, to turn on this switch, we need an extra
    input—base. For example, we will use GPIO PIN 4. This can be an output from any
    kind of embedded device with a 3.3v, 5.0v, or a higher voltage. The maximum voltage
    depends on the resistor''s technical specification.


    The 10k resistor can be of any value between 1K and 20K, and it should always
    be connected before the base of the transistor. The resistor is there to limit
    the maximum current that flows through the base of the transistor, preventing
    damage to the transistor.


    Once the I/O is set high in software, the switch will close and the LED will illuminate.


    > You just learned the basics of transistors. As you build more designs, you will
    find new circuits that require a combination of transistors to achieve a specific
    goal.


    Using transistors in such a way makes switching other voltages much easier from
    an embedded platform, using a low amount of current.


    You should always try and find the transistor marking, and you should search for
    its datasheet to understand the minimum and maximum values it can handle. The
    datasheet will also provide the minimum current required on the base to turn it
    on.


    Transistors are typically used in low-voltage designs. To turn on high voltage,
    such as 220 volts, you should almost always use a relay. Yes, you can use the
    transistor to turn the relay on.


