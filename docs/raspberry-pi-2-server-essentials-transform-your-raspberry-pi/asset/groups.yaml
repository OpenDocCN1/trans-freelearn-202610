  - '[PAGE 148]


    # Permissions


    ownCloud will store all your files as normal files in a directory. It uses the
    database to index files to improve querying speeds. If, for whatever reason, your
    ownCloud stops functioning properly, you can still access all the files directly
    without any complicated recovery procedures.


    ownCloud runs under www-data. To fix file permission issues, the easiest solution
    is to add www-data to the pi group, and then create a subfolder with the www-data
    owner applied to it:


    ```

    sudo usermod -a -G pi www-data

    ```


    The following two commands require you to add your directory destination depending
    on how and where you have mounted your file system. We will create a new subdirectory
    and assign the ownership to www-data. We also need to create a temporary directory
    for uploaded files:


    ```

    sudo mkdir -p /mnt/{your mount point}/owncloud

    sudo chown -R www-data:www-data /mnt/{your mount point}/owncloud

    ```


    ```

    sudo mkdir -p /mnt/{your mount point}/owncloud/tmp

    sudo chown -R www-data:www-data /mnt/{your mount point}/owncloud/tmp

    ```


    # The first configuration


    By this point, everything has been preconfigured for the ownCloud application.
    The final step, which is only required once, is to run through a step-by-step
    configuration wizard using your browser:


    +   1. Open your browser and type in the IP address or DNS name of your Raspberry
    Pi.

    +   2. You will see a certificate error. Depending on the browser you use, you
    may add this certificate to trusted, or click on the button to continue:'
