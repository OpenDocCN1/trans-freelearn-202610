    # Enabling CEC and remotes


    CEC (Consumer Electronics Control) is a standardized protocol used in new televisions,
    media players, and sound equipment. You need to have everything connected using
    HDMI cables. In general, most remote controllers or systems allow these functions.
    CEC is enabled by default, but you can change the settings as you like. To do
    this, navigate to Settings | System | Input Devices | Peripherals | CEC.


    If you have a smart TV using a CEC compliant HDMI cable, you should be able to
    control the volume and navigate OSMC using the arrow buttons. More support varies
    between devices.


    You can also look at enabling other remotes in the system configuration. You may
    need to manually configure Bluetooth or IR adapters to get these enabled. Navigate
    to Programs | OSMC Settings | Remotes (Remote Icon).


    # Performance optimization


    OSMC will run best on the Raspberry Pi 2, and you do not need to change any settings.


    There is a Raspberry Pi installer too, which is already tweaked for best performance
    and lacks a lot of the fancy stuff, but it will play HD video.


    # Overclocking


    Generally, it is not recommended to overclock the Raspberry Pi because it tends
    to create problems with networking and stability. But if you have a good reason
    to do so, then the option can be found here: Programs | OSMC Settings | Overclock
    (Gauge Icon). You can select Turbo, a predefined overclock setting, or set your
    own custom range.


    # Summary


    In this chapter, you learned how to play audio, make slideshows, and watch videos
    from the console. We also explored how to install a new operating system based
    on RaspBMC, which is known as OSMC.


    In the next chapter, we will look at how to run your Raspberry Pi using batteries.'
