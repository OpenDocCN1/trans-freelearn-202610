    # 11

    Running Your ownCloud


    This chapter covers how to install the open source ownCloud on to the Raspberry
    Pi 2, which is a great, free, self-hosted alternative to services such as DropBox,
    Google Drive, or Live Drive.


    If you feel like you would like full control over the data, how you share it,
    and who can access it, ownCloud is a great solution. It is a self-hosted file
    sync and share server, which provides access through a web interface, the sync
    clients of WebDAV.


    There are clients available for most operating systems, but even when you don''t
    have a client, you can always use a modern browser to get straight into your data.


    # Installation


    As of this writing this chapter, ownCloud version 8 is the latest version available
    for installation.


    You may already have a few things that you require installed if have you followed
    the previous chapters. In case you need a few extra packages, it is best to go
    through the entire installation process from the beginning as described here.


    # Requirements


    ownCloud requires a database storage engine, PHP, a web server, and data. As usual,
    I recommend to use nginx as it is lightweight and powerful. You can learn how
    to install nginx in Chapter 4, Using Fast Web Servers and Databases. It is also
    recommended by the developers of ownCloud to use nginx as the web server.


    To be able to access ownCloud from the World Wide Web (WWW), refer to the dynamic
    DNS section in Chapter 2, Preparing a Network.'
