  mdcn: "\n如果你使用有线连接来设置无线连接，你需要按下 C，这将连接到接入点。留意你的 Wi-Fi 上的状态 LED（如果有的话）。你应该会看到它开始闪烁，几秒钟后它会变得常亮，这意味着连接已建立。此时，SSH\
