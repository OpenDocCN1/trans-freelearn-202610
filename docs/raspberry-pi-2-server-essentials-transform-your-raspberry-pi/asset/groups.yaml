  - '[PAGE 25]


    In an independent test, the best USB charger turned out to be the HP TouchPad
    charger (P/N 157-10157-00), and the next best ones are Apple A1265, Apple iPad
    A1357, and Samsung Cube ETA0U80JBE. They are considered to be the best because
    they produce very clean DC power and can handle peak loads for extended periods
    of time. Be careful, though, as a lot of counterfeit chargers are also being sold
    now, especially Apple A1265. As time passes, some of these power supplies may
    become obsolete. Try and search for newer tests.


    To help visualize the DC noise problem, examine the following image. The waveform
    on the left-hand side is extremely noisy and will cause serious problems for communication
    peripherals such as Wi-Fi, bluetooth, or even serial. The waveform on the right-hand
    side is considered to be clean and stable:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_25_0.png)


    Search the Internet for tips on how to identify counterfeit chargers.


    # USB hub


    When you purchase a powered USB hub, it is usually supplied with a 2 or 3 amp
    power supply. This is enough to power USB devices such as a Wi-Fi adapter, a USB
    hard drive, a few other peripherals, and even the Raspberry Pi itself.


    A typical problem occurs with HD USB cameras where the picture goes black after
    a running for some time. Using a powered USB hub will solve this problem.'
  - '[PAGE 26]


    # SD cards


    SD cards all look alike, but, in fact, some use a multitude of different controllers
    and NAND Flash memory chips. All these combinations make up the reliability and
    speed of the card; the cheapest is the worst, usually. That said, spending a fortune
    on an SD card is not a good idea either. The speeds of SD cards are marked with
    a numeric symbol ranging from 1, the slowest, to 10, the fastest. A class 6 or
    8 SD card is a good balance between performance and price.


    However, not all Class 10 cards are the best choice either. The only way to be
    sure is to use a trusted speed test application to verify that the card is performing
    at the advertised read and write speeds; this is the best way to identify counterfeit
    cards:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_26_0.png)


    The SD card should only act as the primary partition for an operating system and
    applications installed on it. Using an SD card for frequently changing data, such
    as databases, is not a good idea as it degrades the life of the card faster than
    expected. Instead, we should use external storage devices, such as hard drives
    or Network Attached Storage (NAS), to handle frequently changing data but also
    help with storing large amounts of media.


    This book assumes that you are using at least an 8 GB SD card.


    # Extra peripherals


    The Raspberry Pi is branded as a computer, and it is expected that we can connect
    various different devices to it. Raspbian is based on Debian, and an immense effort
    has been made to port the majority of drivers and software available for Raspbian.
    You might have some old USB peripherals lying around, for example, a joystick.
    If you can find a driver for any other Linux platform, it should be possible to
    make it work with Raspbian. Plug it in, use the `lsusb` command-line utility,
    and check whether it has been detected. If you manage to get it working with your
    knowledge, you should share this knowledge on a forum for the benefit of other
    users.'
  - '[PAGE 27]


    # Essential peripherals


    You should consider buying these peripherals and dedicating them for the use of
    your Raspberry Pi. They will really make it easier to set everything up and are
    even used for long-term purposes:


    +   - **Wireless USB network adapters**: At the time of writing this book, the
    current Raspbian image supports a variety of wireless adapters without the need
    to install any extra drivers. Many of the mini, nano, or micro versions run directly
    from the Pi''s USB ports and do not require a powered USB hub.

    +   - **USB hubs**: Because some versions of the Raspberry Pi are limited to two
    USB ports, it might be wise to have a compatible, powered USB hub. Powered is
    the key word here, as this will allow you to plug in any USB device or several
    devices at the same time without affecting the Pi''s power stability. At the time
    of writing this, Raspbian is not fully compatible with three USB hubs yet.

    +   - **Keyboards and mice**: Most wired keyboards and mice will run directly
    off the Raspberry Pi USB port. Many Bluetooth keyboards and mice also work directly
    off the Pi''s USB ports but require initial setup using a wired keyboard. Some
    wireless keyboards, such as the Microsoft 3000 series, do not need any configuration
    as the USB dongle emulates a PS/2 wired keyboard and can be used straight away
    at boot time without any extra configuration.


    > You can visit http://elinux.org/RPi_VerifiedPeripherals for an up-to-date list
    of compatible peripherals.


    # Useful peripherals


    As you grow more familiar with your Raspberry Pi, you will think of new a bigger
    ideas for your projects. With such ideas, you might need a few more useful devices
    to help you out.


    # Internet 3G dongles


    You can connect to the Internet using a 3G dongle. These require a lot of power
    and will need to run from a powered hub to operate at full speed. They are a really
    easy way to connect your Raspberry Pi to the Internet even in the most remote
    places of your country. As long as you have a basic voice signal, you should always
    be able to use GPRS (single channel 57.5 kbps or dual channel 115 kbps), which
    can be enough to send plenty of logging text data. Some countries offer free text
    messages, and this can also be used to send and receive the bare minimum of data.
    If you plan to run a server, it would be recommended that you use LAN or Wi-Fi
    connected to an ADSL/DSL connection instead.'
  - '[PAGE 28]


    # Audio recording


    The Raspberry Pi has its own sound output hardware, which is really good at giving
    you a high definition sound over HDMI or analog audio via the 3.5 mm jack.


    You might find yourself in a situation where you would like to record audio from
    a line input or microphone; you could then use any USB 1.1 or USB 2.0 sound capture
    device to do this.


    # Other media add-ons


    +   - **IR receivers**: Infrared (IR) receivers are a great way to control your
    Raspberry Pi using conventional remote controls. The FLIRC USB IR remote dongle
    is a great way for you to start doing this.

    +   - **TV and radio receivers**: This is the ultimate way to turn your Raspberry
    Pi into a full DVR system. Record, playback, or pause live TV from HD satellite
    or digital TV. You can listen to your favorite radio channels too.

    +   - **Webcams**: The Raspberry Pi has a port for its own dedicated HD camera
    module. Owning one of these cameras is a real treat, and the latest versions of
    Raspbian support UV4L (Video for Linux). A variety of USB webcams are also supported
    and support UV4L. Once a fairly complicated task, it has now become a lot easier
    to work with.

    +   - **Multicard readers**: These come in handy if you work with various card
    types. Support is limited on generic types, but the USB 3.0 USRobotics all-in-one
    card works really well, and you can mount all six cards at the same time.

    +   - **Alamode**: WyoLum is a start-up business that creates useful add-ons for
    various applications. Specifically, AlaMode is an Arduino-compatible board with
    a real-time clock and microSD slot that sits on top of the Raspberry Pi. You can
    communicate with Arduino using the Pi''s dedicated UART (Universal Asynchronous
    Receiver/Transmitter), and it can run off the Pi''s power source. If you like
    electronic projects and are already familiar with Arduino, this is worth looking
    at. You can even use it to flash other Arduino-compatible chips or upload firmware
    to run on its own!

    +   - **HDMI to VGA**: If you use an older or spare monitor, television, or LCD
    screen that only works with VGA, you can purchase an inline HDMI to VGA converter
    from your favorite online auction shops or electronic stores. You must make sure
    to buy an active converter, which is slightly more expensive than a passive convertor.
    Active means that it contains a microcontroller that uses power from the HDMI
    port to convert the digital signal into the VGA standard. The Raspberry Pi is
    capable of powering this type of device.'
