    \ This same method is used to synchronize GSM voice calls on mobile phone technologies\
    \ across the world.\n\nAnother method is to use the time broadcasted by long wave\
    \ radio signals. These also broadcast extremely accurate time using atomic clocks.\
    \ The availability depends on your location, though. These are currently available\
    \ in Colorado for most of the US; Germany, Russia, the UK for Europe; and finally,\
    \ Japan. The radio waves operate on different frequencies and more research is\
    \ required for this method.\n\n## References\n\nThe following are the references\
    \ for this chapter:\n\n- Visit for more information on the USB power benchmark\
    \ http://www.righto.com/2012/10/a-dozen-usb-chargers-in-lab-apple-is.html.\n-\
    \ Crystal Disk Mark is a great SD card benchmarking tool with a lot of test results\
    \ available online for comparison.\n\n## Summary\n\nOne of the most popular questions\
    \ found on the Internet was how to increase the Pi's performance! With the release\
    \ of the Generation 2, ARM V7, quad core 900 MHz, this is no longer the case.\
    \ At the time of writing this book, one of the most popular questions is how to\
    \ run the Raspberry Pi using batteries, which we will cover in a later chapter!\n\
    \nThe purpose of understanding the architecture is vital to a successful long\
    \ term project. The Raspberry Pi works like any other computer, but it was designed\
    \ purely for experimental and learning purposes. It should not be used in production\
    \ environments, but it is an extremely attractive solution for production nevertheless.\n\
    \nIt is an excellent platform to share media between friends at school; it is\
    \ fantastic to stream HD media on your TV and is robust enough for many standalone\
    \ applications.\n\nIn the next chapter, you learn how to set up networks on the\
    \ Raspberry Pi.\n\n## 2 Preparing a Network\n\nIt is important to learn how your\
    \ network works, especially if you plan to connect your Raspberry Pi to the Internet.\
    \ A home user will typically use an Internet package designed to browse websites\
    \ and read e-mails. Business packages, on the other hand, need to do a lot more\
    \ than you think. These two different ISP packages usually carry important technical\
    \ differences that dictate how your network can be reached.\n\nIn this chapter,\
    \ you will learn how to connect to the Internet and look at how to solve some\
    \ common problems for home users. You will also learn how to benchmark your network\
    \ and try to isolate any network-related issues.\n\n## Local Area Network (LAN)\n\
    \nUsing the standard Raspbian package, both essential and non-essential drivers\
    \ are included. All essential drivers are loaded and some non-essential ones are\
    \ as well.\n\nWe will start by plugging in a network cable between the Raspberry\
    \ Pi and the router provided by your ISP. By default, your router has a DHCP server\
    \ that automatically assigns an IP address to your Raspberry Pi.\n\nYou may also\
    \ use network switches to make a more complex network but because the Raspberry\
    \ Pi has a 100 megabit network port, it may downgrade your entire network to 100\
    \ megabits. Some switches can negotiate separate connections to lower speed interfaces\
    \ without downgrading the entire network, but you need to consult the specifications\
    \ of the device in order to do this.\n\nTo check whether your LAN is up and running,\
    \ just type `ifconfig`, and you will get text containing your current settings:\n\
    \n```\neth0      Link encap:Ethernet  HWaddr b8:27:eb:45:bb:fa\n          inet\
    \ addr:192.168.1.135  Bcast:192.168.1.255  Mask:255.255.255.0\n          inet6\
    \ addr: fe80::ba27:ebff:fe45:bbfa/64 Scope:Link\n          UP BROADCAST RUNNING\
    \ MULTICAST  MTU:1500  Metric:1\n          RX packets:89  errors:0  dropped:0\
    \  overruns:0  frame:0\n          TX packets:96  errors:0  dropped:0  overruns:0\
    \  carrier:0\n          collisions:0  txqueuelen:1000\n          RX bytes:7943\
    \  (7.7 KiB)  TX bytes:14104  (13.7 KiB)\n\nlo        Link encap:Local Loopback\n\
    \          inet addr:127.0.0.1  Mask:255.0.0.0\n          inet6 addr:  ::1/128\
    \ Scope:Host\n          UP LOOPBACK RUNNING  MTU:16436  Metric:1\n          RX\
    \ packets:0  errors:0  dropped:0  overruns:0  frame:0\n          TX packets:0\
    \  errors:0  dropped:0  overruns:0  carrier:0\n          collisions:0  txqueuelen:0\n\
    \          RX bytes:0  (0.0 B)  TX bytes:0  (0.0 B)\n```\n\nLet's try to understand\
    \ the different keywords from the preceding output:\n\n- **HWaddr**: This is your\
    \ Pi's MAC address, which identifies a vendor and should ideally provide a globally\
    \ unique address.\n- **inet addr**: This is your current LAN IP address, which\
    \ belongs to a private range of either `10.x.y.z` (Class A), `172.16.x.x` (Class\
    \ B), or `192.168.x.x` (Class C). They are known as private addresses because\
    \ they do not exist on the Internet.\n- **Bcast**: This is a reserved address\
    \ that's calculated by your network mask, and it transmits global messages within\
    \ your private network.\n- **Mask**: This is used in all networks but should only\
    \ be concerned with advanced configurations. Masks divide a network into subnetworks\
    \ and depend on the class your network belongs to.\n- **inet6 addr**: This is\
    \ your IPv6 address. It will show only if your router supports this, but it is\
    \ more difficult to remember.\n- **RX**: This shows how many packets have been\
    \ received.\n- **TX**: This shows how many packets have been sent.\n\n## The eth0\
    \ port\n\nThe Raspberry Pi will typically use **eth0** as its on-board LAN interface.\
    \ If you add USB LAN devices, they will have an incremented number after *eth*;\
    \ this will increment the interface number.\n"
  mdcn: "\nAll that dedicated hardware means that while those sections of the chip\
    \ are fully utilized, the ARM CPU will be idle or hardly used. This allows you\
    \ to compute other transactions synchronously, and this is what makes the Raspberry\
    \ Pi a truly unique single board, credit card-sized computer!\n\n## 硬件限制\n\nAll\
    \ this hardware that is crammed into one tiny space has its drawbacks. Some are\
    \ deliberate and others are not. You should consider that these are theoretical\
    \ calculations; real-world performance may vary, but are usually slower than theoretically\
    \ estimated.\n\n## 网络速度\n\nIt may be disappointing that the Raspberry Pi Foundation\
    \ decided to use a 100 Mbps LAN chip instead of a gigabit one. We need to crunch\
    \ some numbers to justify this decision, though. Let's convert megabits to a more\
    \ familiar megabytes. To get to megabytes per second from megabits per second,\
    \ we divide 100 Mbps by 8 (there are eight bits in a byte). This equates to 12.5\
    \ megabytes per second at 100% LAN capacity. For a single user, this is only roughly\
    \ 20% of what the USB hub can handle. This means that by design, this is an unchangeable\
    \ bandwidth limitation for networking.\n\nIf you plan to share files with several\
    \ users at the same time, each new user will bump down the other user's bandwidth\
    \ to accommodate their own. As a workaround, you could add a USB gigabit LAN peripheral.\
    \ But due to speed constraints of the USB hub, you will only use approximately\
    \ 48% of the gigabit LAN. To make matters worse, any hard drives running on the\
    \ USB port will start to fight for bandwidth. The USB controller has to share\
    \ 480 Mbps across all ports! One port is used by the 100 Mbit network card, and\
    \ the other connects the hub to the GPU. For one user, this means a maximum bandwidth\
    \ of 240 Mbps. Why 240 Mbps? This is because 240 Mbps goes to the LAN and 240\
    \ Mbps goes to the hard drive, and theoretically, there is no USB bandwidth left\
    \ for anything else.\n\nThis could be a problem for a multiuser environment, but\
    \ for home use, you would not run into any major problems as the bandwidth can\
    \ accommodate HD video streams while serving other clients. This is why the cheaper\
    \ 100 Mbps version was used.\n\n## USB 瓶颈\n\nAs it was made clear by the bottlenecks\
    \ found in the LAN, the worst thing about USB bottlenecks is that there is no\
    \ way to work around this problem! This is because the USB controller connects\
    \ to the Broadcom and LAN chips, respectively, on the PCB without any possibility\
    \ of expanding or bypassing this chip.\n\n## 时间\n\nThe Raspberry Pi also does\
    \ not come with a real-time clock, so timekeeping is left to Internet-based time\
    \ servers. For many people, this might not cause a problem, but if you wanted\
    \ to create a remote, disconnected device that depends on recording events at\
    \ various times of the day, you might be left a little bit disappointed.\n\nOne\
    \ easy and reliable way to do this is to connect a USB or I²C RTC that runs off\
    \ a small battery. There is an easier and free option, though, but it is not as\
    \ accurate; you may want to install the fake-hwclock package. All you need to\
    \ do is set the time once, and the software will keep track of time using a file.\
    \ If you have a power outage, the software will read the file and set the time\
    \ back to the last known time. The drawback is that you lose that time as there\
    \ is no way to determine how long the outage lasted for.\n\nTo get time without\
