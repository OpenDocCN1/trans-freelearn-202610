    \ 755 /etc/init.d/btsync\nsudo update-rc.d btsync defaults\nsudo service btsync\
    \ start\n```\n\nBTSync will now start every time your Raspberry Pi 2 reboots.\
    \ You can check out the configuration file at /opt/btsync/bin/btsync.conf but\
    \ the defaults work pretty well.\n\nYou can now navigate a browser on the same\
    \ network to your Pi's address at http://raspberrypi:8888/gui."
  md: "\n## Connecting with FileZilla\n\nFileZilla is open source and can be run on\
    \ Windows, Mac OS X, or Linux. Download and install it on your computer. We connect\
    \ to the Raspberry Pi using the following steps:\n\n- 1. In the Host field, enter\
    \ the IP address or the DNS name of your Pi;\n- 2. In the Username field, enter\
    \ the name of the user on the Pi. For example, root.\n- 3. In the Password field,\
    \ enter the password of this user.\n- 4. In the Port field, enter the name of\
    \ the port as 22. This tells FileZilla that you want to connect using SFTP.\n\n\
    The following screenshot will show how FileZilla is connected to our Pi:\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_86_0.png)\n\
    \n## Connecting with WinSCP\n\nWinSCP is the client preferred by all Windows users\
    \ who need to connect to any Linux box running the SSH or SFTP server.\n\nWinSCP\
    \ also offers Secure Copy Protocol (SCP), which is not specified by any standard.\
    \ It uses Secure Shell for data transfers and the same authentication method.\n\
    \nGo to http://winscp.net/ and find the [Go to Download page] link from where\
    \ you will get the installer or portable binary.\n\nJust like with FileZilla,\
    \ you will enter the hostname, username, and password. You can use SFTP or SCP\
    \ as shown in the following screenshot:\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_87_0.png)\n\
    \n## The Samba service\n\nSamba is an implementation of the SMB/CIFS networking\
    \ protocol, which is mostly used on computers running Microsoft Windows. It is\
    \ basically a way of allowing a Windows computer to connect to Linux systems and\
    \ access their shared files or printers. It is not created by Windows and was\
    \ originally developed by Andrew Tridgell.\n\nIf you want to share media from\
    \ Linux with other Windows computers on your network, Samba is the best software\
    \ option.\n\n### Installing and configuring Samba\n\nYou need to install Samba\
    \ and a common library that is used by Samba using the following command line:\n\
    \n```\nsudo apt-get install samba samba-common-bin\n```\n\nYou can then navigate\
    \ to `/etc/samba` and edit the `smb.conf` file. On a private network for personal\
    \ use, you may skip any step that requires the use of passwords to mount network\
    \ shares. In an exposed or production environment, always use authentication.\n\
    \nIf you do not like to put security on internal network shares, then this is\
    \ perfectly safe. Since these files cannot be accessed from the Internet, you\
    \ may just want to browse your network freely and copy or move files around without\
    \ the extra pain of entering passwords.\n\nBy default, Samba is set for anonymous\
    \ (unauthenticated) access. To change this, scroll down and uncomment the `security\
    \ = user` line by removing the preceding `#`. This will tell Samba to authenticate\
    \ against the users that you have created.\n\nWe will quickly create a user for\
    \ the purpose of demonstration as there is an extra step required to add the user\
    \ to the Samba authentication list. The following command-line snippet is an example\
    \ of creating a system user to access Samba:\n\n```bash\nsudo useradd bond007\
    \ -m -G users\nsudo passwd bond007\nsudo smbpasswd -a bond007\n```\n\n### Network\
    \ shares\n\nAt the bottom of the `smb.conf` file, we will add two shares, as shown\
    \ in the following command-line snippet. One account is for guests without authentication,\
    \ whereas the other account will only be accessible by our new user—James Bond:\n\
    \n```ini\n[public] comment = Media share\npath = /nas/USB001/public\nforce user\
    \ = \"root\"\nread only = no\nguest ok = yes\npublic = yes\n\n[work]\ncomment\
    \ = Work share\npath = /nas/USB001/work\nvalid users = \"bond007\" #or @users\
    \ to allow the group users access\nforce group = users\nread only = no\nwriteable\
    \ = yes\n```\n\nSamba can be quite difficult to understand in terms of permissions.\
    \ Let's start off with the public share. You will notice that we put a line in\
    \ smb.conf that says force user = \"root\". We do this because we created the\
    \ public directory as root user, so the permissions applied to the directory and\
    \ all the files to be created later can only be for the user root! So, we tell\
    \ Samba to imitate guests, as root, so that they can read/write as the root user.\n\
    \nThe same will apply for the user James Bond and his directory. If you have created\
    \ the work directory as the root user or Raspberry Pi, even James Bond will not\
    \ be allowed to write new files. To overcome this problem, you can simply change\
    \ the owner of the folder by typing the following command line:\n\n```\nchown\
    \ bond007:users /mnt/USB001/work\n```\n\nYou can also assign a directory to an\
    \ entire group by replacing bond007 with users. The command will look like chown\
    \ users:users. This means that anybody in the group can write and delete files\
    \ on this folder now.\n\nThe configuration file has many advanced features, and\
    \ I recommend reading the online manual to learn more about security, sharing\
    \ printers, and even how to get Samba to act like a Windows domain server!\n\n\
    You can now use any Windows computer to browse the network and access the newly\
    \ created shares.\n\n## AFP for Macintosh\n\nSamba also works with Macintosh,\
    \ but Apple has its own networking protocol called Apple Filing Protocol (AFP).\
    \ There is software that you can install on the Raspberry Pi so that your Macintosh\
    \ computers can detect the Raspberry Pi.\n\n### Installing and configuring Netatalk\n\
    \nInstalling Netatalk has become really easy as most of the configuration is set\
    \ up by default. At the time of writing this book, the version used was 2.3.3:\n\
    \n```\nsudo apt-get install netatalk\n```\n\nWithin 30 seconds, you will see your\
    \ Raspberry Pi pop up in the shared section on your Macintosh. The default directory\
    \ that is shared is the home directory of the user that you log in as, for example,\
    \ user Pi.\n\n### Shares and Time Machine\n\nWe will create a few entries to use\
    \ your external drive for the shares that you need, and this version of Netatalk\
    \ also supports Time Machine.\n\nYou will need to edit this file to customize\
    \ some of the settings as follows:\n\n/etc/netatalk/AppleVolumes.default\n#Amend\
    \ default to look like this\n:DEFAULT: options:upriv,usedots,rw,tm\n#Add this\
    \ to end of the file\n/nas/USB001/public \"Public\"\n/nas/USB001/work \"James\
    \ Bond\"\n\nRead the configuration file for more options and adjusting security.\
    \ After saving, you must restart Netatalk using the following command:\n\n```\n\
    service netatalk restart\n```\n\n## BitTorrent Sync\n\nAll the bad things that\
    \ you may have heard about torrents were primarily caused by private companies\
    \ who were deliberately placing infected files to try and track users sharing\
    \ copyrighted material or malicious users who were after your personal details.\n\
    \nSync is not a public network; it only uses the revolutionary peer-to-peer technology\
    \ from conventional torrents, which allows you to share an unlimited amount of\
    \ data with an unlimited number of computers. Files are not stored on the cloud.\
    \ They are stored on all the computers that have BTSync installed on them, and\
    \ you can control who has access and where these files will be stored. BTSync\
    \ includes file versioning, sharing with mobile phones, LAN synchronizing, and\
    \ delta updates. It also allows massive file transfers of gigabytes without any\
    \ problem as long as your file system can support such large files.\n\n### Installing\
    \ BTSync 2\n\nAt the time of writing this book, there were a few repositories\
    \ that kept this package with startup scripts. A word of warning: do not trust\
    \ sources other than the ones that are enabled by default. People can easily alter\
    \ code and place their own version of the binary with some nasty backdoors. Go\
    \ to the official website, or use the links provided by the official website.\n\
    \nWe will create a new directory, download the ARM version of BTSync, and extract\
    \ it as shown in the following command-line snippet:\n\n```\nmkdir ~/.btsync &&\
    \ cd ~/.btsync\nwget http://download-cdn.getsyncapp.com/stable/linux-arm/BitTorrent-Sync_arm.tar.gz\
    \ -O btsync_arm.tar.gz\ntar -xvf btsync_arm.tar.gz\n```\n\nWe will create a service\
    \ file. In /etc/init.d, create the btsync file and copy the following text:\n\n\
    ```\n#!/bin/sh\n# /etc/init.d/btsync\n#\n# Carry out specific functions when asked\
    \ to by the system\ncase \"$1\" in\nstart)\n    /opt/btsync/bin/btsync --config\
    \ /opt/btsync/bin/btsync.conf\n;;\nstop)\n    killall btsync\n;;\n*)\n    echo\
    \ \"Usage: /etc/init.d/btsync {start|stop}\"\n    exit 1\n;;\nesac\n\nexit 0\n\
    ```\n\nWe need to set correct permissions for the new file:\n\n```\nsudo chmod\
    \ 755 /etc/init.d/btsync\nsudo update-rc.d btsync defaults\nsudo service btsync\
    \ start\n```\n\nBTSync will now start every time your Raspberry Pi 2 reboots.\
    \ You can check out the configuration file at /opt/btsync/bin/btsync.conf but\
    \ the defaults work pretty well.\n\nYou can now navigate a browser on the same\
    \ network to your Pi's address at http://raspberrypi:8888/gui.\n"
  mdcn: "\n## 使用 FileZilla 连接\n\nFileZilla 是开源的，可以在 Windows、Mac OS X 或 Linux 上运行。在你的电脑上下载并安装它。我们使用以下步骤连接到树莓派：\n\
    \n- 1. 在“主机”字段中，输入你的 Pi 的 IP 地址或 DNS 名称；\n- 2. 在“用户名”字段中，输入 Pi 上的用户名。例如，root。\n\
    - 3. 在“密码”字段中，输入该用户的密码。\n- 4. 在“端口”字段中，将端口名称输入为 22。这告诉 FileZilla 你想要使用 SFTP 连接。\n\
    \n以下屏幕截图将展示 FileZilla 如何连接到我们的 Pi：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_86_0.png)\n\
    \n## 使用 WinSCP 连接\n\nWinSCP 是所有需要连接到运行 SSH 或 SFTP 服务器的 Linux 主机的 Windows 用户首选客户端。\n\
    \nWinSCP 还提供 Secure Copy Protocol（SCP），该协议未被任何标准指定。它使用 Secure Shell 进行数据传输并使用相同的身份验证方法。\n\
    \n前往 http://winscp.net/ 并找到 [前往下载页面] 链接，从那里你将获得安装程序或便携式二进制文件。\n\n就像使用 FileZilla\
    \ 一样，你将输入主机名、用户名和密码。你可以使用 SFTP 或 SCP，如以下屏幕截图所示：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_87_0.png)\n\
    \n## Samba 服务\n\nSamba 是 SMB/CIFS 网络协议的实现，该协议主要用于运行 Microsoft Windows 的计算机上。它基本上是一种允许\
    \ Windows 计算机连接到 Linux 系统并访问其共享文件或打印机的机制。它不是由 Windows 创建，最初由 Andrew Tridgell 开发。\n\
    \n如果你想在网络上的其他 Windows 计算机之间共享来自 Linux 的媒体，Samba 是最佳的软件选择。\n\n### 安装和配置 Samba\n\
    \n你需要使用以下命令行安装 Samba 以及 Samba 使用的通用库：\n\n```\nsudo apt-get install samba samba-common-bin\n\
    ```\n\n然后你可以导航到 `/etc/samba` 并编辑 `smb.conf` 文件。在个人使用的私有网络上，你可以跳过任何需要使用密码挂载网络共享的步骤。在暴露或生产环境中，始终使用身份验证。\n\
    \n如果你不喜欢在内部网络共享上设置安全性，那么这是完全安全的。由于这些文件无法从互联网访问，你可能只想自由浏览网络并在不输入密码的额外痛苦下复制或移动文件。\n\
    \n默认情况下，Samba 设置为匿名（未经身份验证）访问。要更改此设置，请向下滚动并通过删除前面的 `#` 来取消注释 `security = user`\
    \ 行。这将告诉 Samba 对你创建的用户进行身份验证。\n\n我们将快速创建一个用户用于演示，因为需要额外步骤将用户添加到 Samba 身份验证列表中。以下命令行片段是创建系统用户以访问\
    \ Samba 的示例：\n\n```bash\nsudo useradd bond007 -m -G users\nsudo passwd bond007\n\
    sudo smbpasswd -a bond007\n```\n\n### 网络共享\n\n在 `smb.conf` 文件底部，我们将添加两个共享，如以下命令行片段所示。一个帐户是用于无需身份验证的访客，而另一个帐户将只能由我们的新用户——James\
    \ Bond 访问：\n\n```ini\n[public] comment = Media share\npath = /nas/USB001/public\n\
    force user = \"root\"\nread only = no\nguest ok = yes\npublic = yes\n\n[work]\n\
    comment = Work share\npath = /nas/USB001/work\nvalid users = \"bond007\" #or @users\
    \ to allow the group users access\nforce group = users\nread only = no\nwriteable\
    \ = yes\n```\n\nSamba 在权限方面可能相当难以理解。我们先从公共共享开始。你会注意到我们在 smb.conf 中放置了一行说 force\
    \ user = \"root\"。我们这样做是因为我们以 root 用户身份创建了公共目录，所以应用于目录和稍后创建的所有文件的权限只能用于 root 用户！因此，我们告诉\
    \ Samba 模仿访客，作为 root，以便他们可以像 root 用户一样进行读写。\n\n同样适用于用户 James Bond 及其目录。如果你以 root\
    \ 用户或 Raspberry Pi 身份创建了 work 目录，即使是 James Bond 也不会被允许写入新文件。为了解决这个问题，你可以简单地通过输入以下命令行来更改文件夹的所有者：\n\
    \n```\nchown bond007:users /mnt/USB001/work\n```\n\n你也可以通过将 bond007 替换为 users\
    \ 来将目录分配给整个组。命令将如下所示 chown users:users。这意味着现在组中的任何人都可以写入和删除此文件夹上的文件。\n\n配置文件具有许多高级功能，我建议阅读在线手册以了解有关安全性、共享打印机以及如何让\
    \ Samba 充当 Windows 域服务器的更多信息！\n\n现在你可以使用任何 Windows 计算机浏览网络并访问新创建的共享。\n\n## 用于\
    \ Macintosh 的 AFP\n\nSamba 也适用于 Macintosh，但 Apple 有自己的网络协议称为 Apple Filing Protocol（AFP）。你可以在树莓派上安装软件，以便你的\
    \ Macintosh 计算机可以检测到树莓派。\n\n### 安装和配置 Netatalk\n\n安装 Netatalk 已变得非常容易，因为大多数配置默认已设置。在撰写本书时，使用的是\
    \ 2.3.3 版本：\n\n```\nsudo apt-get install netatalk\n```\n\n在 30 秒内，你将在 Macintosh\
    \ 的共享部分看到你的树莓派弹出。共享的默认目录是你登录时使用的用户的 home 目录，例如用户 Pi。\n\n### 共享和 Time Machine\n\
    \n我们将创建一些条目以使用你的外部驱动器进行所需的共享，并且此版本的 Netatalk 还支持 Time Machine。\n\n你需要按如下方式编辑此文件以自定义一些设置：\n\
    \n/etc/netatalk/AppleVolumes.default\n#Amend default to look like this\n:DEFAULT:\
    \ options:upriv,usedots,rw,tm\n#Add this to end of the file\n/nas/USB001/public\
    \ \"Public\"\n/nas/USB001/work \"James Bond\"\n\n阅读配置文件以了解更多选项和调整安全性。保存后，你必须使用以下命令重启\
    \ Netatalk：\n\n```\nservice netatalk restart\n```\n\n## BitTorrent Sync\n\n你可能听说过有关\
    \ torrent 的所有坏事，主要是由私人公司故意放置感染文件以试图跟踪分享受版权保护材料的用户或恶意用户试图获取你的个人详细信息所造成的。\n\nSync\
    \ 不是公共网络；它只使用来自传统 torrent 的革命性点对点技术，这使你能够与无限数量的计算机共享无限量的数据。文件不会存储在云端。它们存储在安装了\
    \ BTSync 的所有计算机上，你可以控制谁有权访问以及这些文件存储在哪里。BTSync 包括文件版本控制、与手机共享、LAN 同步和增量更新。它还允许在文件系统支持此类大文件的情况下，无问题地进行数\
    \ GB 的大规模文件传输。\n\n### 安装 BTSync 2\n\n在撰写本书时，有几个存储库保留了此软件包及其启动脚本。警告：不要信任默认启用的以外的其他来源。人们可以轻松更改代码并放置自己的二进制版本，其中包含一些讨厌的后门。前往官方网站，或使用官方网站提供的链接。\n\
    \n我们将创建新目录、下载 BTSync 的 ARM 版本并按以下命令行片段所示提取它：\n\n```\nmkdir ~/.btsync && cd ~/.btsync\n\
    wget http://download-cdn.getsyncapp.com/stable/linux-arm/BitTorrent-Sync_arm.tar.gz\
    \ -O btsync_arm.tar.gz\ntar -xvf btsync_arm.tar.gz\n```\n\n我们将创建一个服务文件。在 /etc/init.d\
    \ 中，创建 btsync 文件并复制以下文本：\n\n```\n#!/bin/sh\n# /etc/init.d/btsync\n#\n# Carry out\
    \ specific functions when asked to by the system\ncase \"$1\" in\nstart)\n   \
    \ /opt/btsync/bin/btsync --config /opt/btsync/bin/btsync.conf\n;;\nstop)\n   \
    \ killall btsync\n;;\n*)\n    echo \"Usage: /etc/init.d/btsync {start|stop}\"\n\
    \    exit 1\n;;\nesac\n\nexit 0\n```\n\n我们需要为新文件设置正确的权限：\n\n```\nsudo chmod 755\
    \ /etc/init.d/btsync\nsudo update-rc.d btsync defaults\nsudo service btsync start\n\
    ```\n\nBTSync 现在将在你的 Raspberry Pi 2 每次重启时启动。你可以查看 /opt/btsync/bin/btsync.conf\
    \ 配置文件，但默认值效果相当好。\n\n现在你可以在同一网络上的浏览器中导航到你的 Pi 的地址 http://raspberrypi:8888/gui。\n"
