    \ it quickly and all the data that we resynchronize will be stored without any\
    \ loss. The following is a figure explaining each feature of a SATA Port replicator:\n\
    \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_94_0.png)\n\n## Summary\n\nThis chapter\
    \ demonstrates that the Raspberry Pi is capable of doing anything that a normal\
    \ computer or server can do. It is capable of sharing files with various platforms.\
    \ You can connect to the Raspberry Pi using the latest secure FTP. It is capable\
    \ of storing a great amount of data using some clever hardware add-ons.\n\nIn\
    \ the next chapter, we will set up various gaming servers.\n\n## 6\n\n## Setting\
