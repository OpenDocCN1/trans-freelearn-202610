    should read Chapter 2, Preparing a Network, to learn how to set up dynamic DNS.


    # Summary


    In this chapter, you learned how to use another non-default Jessie repository
    and how to set up various gaming servers on the Raspberry Pi. You also learned
    how to install OpenTTD, Freeciv, and OpenArena from aptitude. We covered how to
    set up a high-performance Minecraft server using Java Hard-Float.


    In the next chapter, we will be setting up live video streaming.'
