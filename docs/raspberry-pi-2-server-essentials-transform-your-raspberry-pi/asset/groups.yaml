    \nSeveral libraries will be installed during this time. You may be presented with\
    \ a blue screen, which asks you if you want to restart some services in order\
    \ to complete the package installation. It is safe to agree to this. This can\
    \ take several minutes to complete.\n\n## Configuring OpenTTD\n\nThe configuration\
    \ file called `openttd.cfg` can be found at `~/.openttd`. It contains a few hundred\
    \ settings that you can tweak according to your preferences, but some of the important\
    \ ones are as follows:\n\n- `lan_internet`: This sets the condition for the LAN\
    \ access. For lan0, allow the Internet, and for lan1, use LAN only.\n- `server_name`:\
    \ This is a unique name to identify the server on the Internet.\n- `server_advertise`:\
    \ We set this to `true` so that it will be visible on the server list.\n- `server_bind_ip`:\
    \ We set this to `0.0.0.0`; this allows the address to bind to any network.\n\
