    You might have some old USB peripherals lying around, for example, a joystick.
    If you can find a driver for any other Linux platform, it should be possible to
    make it work with Raspbian. Plug it in, use the `lsusb` command-line utility,
    and check whether it has been detected. If you manage to get it working with your
    knowledge, you should share this knowledge on a forum for the benefit of other
    users.


    ## Essential peripherals


