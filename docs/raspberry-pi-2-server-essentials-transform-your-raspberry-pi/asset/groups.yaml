    \ and click on **OK**. After a short while, a final screen will ask about `dbconfig-common`;\
    \ click on **NO**.\n\nWe need to manually configure phpMyAdmin just like any other\
    \ website for nginx. PhpMyAdmin places its files in the shared location `/usr/share/phpmyadmin`,\
    \ and anyone with access to the system can use this shared website to access only\
    \ their database.\n\nIn `sites-available`, create a new file called `phpmyadmin`;\
    \ now use the following configuration. Remember to create a symbolic link in `sites-enabled`\
    \ and then reload nginx:\n\n```\nserver {\n    location /phpmyadmin {\n      \
    \  root /usr/share/;\n        index index.php;\n    }\n    location ~ ^/phpmyadmin/(.+\\\
    .php)$ {\n        try_files $uri =404;\n        root /usr/share/;\n        fastcgi_pass\
    \ unix:/var/run/php5-fpm.sock;\n        fastcgi_index index.php;\n        fastcgi_param\
    \ SCRIPT_FILENAME $document_root$fastcgi_script_name;\n        include /etc/nginx/fastcgi_params;\n\
    \    }\n    location ~* ^/phpmyadmin/(.+\\.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt))$\
    \ {\n        root /usr/share/;\n    }\n    location /phpMyAdmin {\n        rewrite\
    \ ^/* /phpmyadmin last;\n    }\n}\n```\n\nThis virtual host is configured to run\
    \ on port 80, but in a virtual directory. The application in this virtual directory\
    \ runs on its own thread, separate from anything else running on port 80. You\
    \ can configure the previous virtual hosts to run in the same way if you prefer\
    \ this over different port numbers.\n\nYou can now browse to http://raspberrypi/phpmyadmin/setup\
    \ and follow the onscreen instructions. You can ignore the message about the config\
    \ directory for now. You will need your MySQL root database password. In the servers\
    \ section, click new on the Server button and enter the password for root under\
    \ the Authentication tab.\n\n> Follow the guides on screen to get the most up-to-date\
    \ versions and information on the best practice.\n\nOnce you are complete, you\
    \ can navigate your browser to the virtual directory, http://raspberrypi/phpmyadmin,\
    \ and log in with your root credentials. The first thing you should do is set\
    \ up a new user.\n\n## Installing SQLite\n\nSQLite3 is a self-contained, easy-to-install,\
    \ lightweight transactional database. The product's website boasts that it is\
    \ the most deployed database in the world. As we know from Wikipedia, it is actually\
    \ the most deployed database on embedded devices, which still leaves MySQL as\
    \ the most used database. None of this really matters to us because both these\
    \ databases are very good at what they do, except that SQLite is a better choice\
    \ if you are looking for much better performance on your Raspberry Pi 1:\n\n```\n\
    sudo apt-get install sqlite3 php5-sqlite\n```\n\nWe will be using phpliteadmin,\
    \ a single-file administration utility made specifically for SQLite versions 2\
    \ and 3. Also, create a new subdirectory for phpliteadmin. Note that the Google\
    \ code is closing and the package may be moved to GitHub soon. You can search\
    \ the Internet if the link doesn't resolve:\n\n```\nsudo mkdir /var/www/phpliteadmin/\n\
    sudo mkdir /var/www/phpliteadmin/web\ncd /var/www/phpliteadmin/web\nwget https://phpliteadmin.googlecode.com/files/phpliteAdmin_v1-9-5.zip\n\
    sudo unzip phpliteAdmin_v1-9-5.zip\n```\n\nThe easiest way to get phpliteadmin\
    \ working locally is by running it on its own dedicated port.\n\nCreate a new\
    \ virtual host file sqladmin with the following content:\n\n```\nserver {\n  \
    \  listen 81;\n\n    root /var/www/phpliteadmin/web/;\n    index phpliteadmin.php;\n\
    \    location ~ \\.php$ {\n        fastcgi_pass   unix:/var/run/php5-fpm.sock;\n\
    \        fastcgi_index  phpliteadmin.php;\n        include        fastcgi_params;\n\
    \    }\n}\n```\n\nReload nginx and navigate to http://raspberrypi:81. The default\
    \ password is admin. At this point, you will get an error message saying that\
    \ there are no databases and the directory is not writeable.\n\nSQLite creates\
    \ flat files that contain all the data, and you can manage where you would like\
    \ to keep these files. There is no server managing these files, and any SQLite-compatible\
    \ client can connect to these files.\n\nYou can create a test database in /var/www/phpliteadmin/web\
    \ using the SQLite3 command line:\n\n```\nsudo sqlite3 test.db\nBEGIN;\nCREATE\
    \ TABLE temps (theDate DATE, name TEXT);\nCOMMIT;\n.exit\n```\n\nRefresh the web\
    \ page where you navigated to `phpliteadmin`. You will see a new layout with a\
    \ list of databases on the left-hand side. If you made the directory writeable,\
    \ you can also create new databases.\n\n> It is highly recommended not to allow\
    \ access to this virtual website from the Internet as there are no security features\
    \ implemented.\n\n## Summary\n\nIn this chapter, we covered how to create various\
    \ basic websites running on .NET or PHP hosting platforms. Nginx is truly a versatile\
    \ and fast proxy server, which helps us achieve the variety of web applications\
    \ that we can provide.\n\nWe had a look at how to host .NET MVC and PHP as well\
    \ as install two different types of database engines, all running side by side\
    \ in harmony.\n\nIn the next chapter, we will set up file sharing for your local\
    \ network and *ownCloud* for Internet-based storage.\n"
  mdcn: "\n## 安装 PHP\n\n如前所述，nginx 是一个代理，可极快地处理 Web 请求，而要让 PHP 与 nginx 协同工作，我们需要安装一个名为\
    \ **FastCGI** 的接口。这将允许 nginx 向 PHP 发送请求并接收和显示响应。为了提高 PHP 性能，我们还将安装一个名为 APC 的 PHP\
    \ 扩展，其全称为 **Alternative PHP Cache**。它比标准 PHP 缓存更快，使用资源更少。\n\n安装后，PHP 应该正在运行，但我们将重启它以确保所有扩展都已正确加载：\n\
    \n```\nsudo apt-get install php5-fpm php-apc\nsudo service php5-fpm restart\n\
    ```\n\n在 `/var/www/` 下创建一个名为 `PHP` 的新目录，并在其中创建子目录 `web`。在 `web` 目录中，我们将创建一个名为\
    \ `index.php` 的新文件并添加以下内容：\n\n```\n<?php\n    phpinfo();\n?>\n```\n\n这次我们将在不同的端口上运行它，因为\
    \ PHP 有不同的要求。我们将新主机绑定到 888 端口。我们将创建一个新的 server 块；你可以将其放在现有配置文件中，也可以按需创建一个新的 `sites-available/php`\
    \ 文件：\n\n> 请避免使用端口 8080，因为它稍后将被用于实时流媒体。\n> 请注意 `fastcgi_pass` 设置，该设置也将用于任何其他 PHP\
    \ 网站。\n\n```\nserver {\n    listen 888;\n    root /var/www/php/web;\n    index\
    \ index.php;\n\n    location ~ \\.php$ {\n        fastcgi_pass unix:/var/run/php5-fpm.sock;\n\
    \        fastcgi_index index.php;\n        include fastcgi_params;\n    }\n}\n\
    ```\n\n重启 nginx，然后在另一台计算机的浏览器中访问 http://raspberrypi:888。你应该会看到如下页面：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_76_0.png)\n\
    \n## 安装数据库\n\n当我们想到 Linux 机器上的数据库时，首先想到的通常是 MySQL。它是首选，因为它免费、开源、可靠，并且附带丰富的工具集。在具有四核的\
    \ Raspberry Pi 2 上，MySQL 变得更具吸引力，但我仍将介绍轻量且稳健的 SQLite 替代方案。\n\n### 安装 MySQL\n\n\
    MySQL 已存在很长时间，除非你正在寻找特定版本，否则你可以使用当前仓库安装 MySQL 5.5 版本：\n\n```\nsudo apt-get update\n\
    sudo apt-get install mysql-server\n```\n\n你将看到带有蓝色背景的屏幕，要求你输入 root 用户密码。你应该将其记下并保存在安全位置，但将密码存储在\
    \ `KeePass` 等应用程序中会更方便也更安全。\n\n> 最佳实践是永远不要对 Web 应用程序，尤其是可在互联网上访问的生产环境，使用 MySQL\
    \ 的 root 用户。\n\n### 安装 phpMyAdmin\n\n一个非常流行的 SQL 管理工具 `phpMyAdmin` 可以安装并用于进一步管理你的数据库，甚至对其进行操作。\n\
    \n`phpMyAdmin` 是唯一需要以 root 设置运行的应用程序，以便它可以完全管理 MySQL。`phpMyAdmin` 的最佳实践是仅允许通过本地网络或\
    \ SSH 进行管理连接。这是因为它将用于创建或删除数据库、用户和密码，并对这些数据库应用权限访问。如果你需要，可以创建权限较低的用户通过互联网登录：\n\n\
    ```\nsudo apt-get install phpMyAdmin\n```\n\n在安装过程中，你将看到另一个蓝色屏幕，要求选择应自动配置的 Web\
    \ 服务器。可惜的是，`nginx` *不在* 列表中；不要勾选任何框并点击 **OK**。过一会儿，最终屏幕会询问 `dbconfig-common`；点击\
    \ **NO**。\n\n我们需要像为 nginx 配置任何其他网站一样手动配置 phpMyAdmin。PhpMyAdmin 将其文件放在共享位置 `/usr/share/phpmyadmin`，并且任何有权访问系统的人都可以使用此共享网站仅访问其数据库。\n\
    \n在 `sites-available` 中，创建一个名为 `phpmyadmin` 的新文件；现在使用以下配置。记得在 `sites-enabled`\
    \ 中创建符号链接，然后重新加载 nginx：\n\n```\nserver {\n    location /phpmyadmin {\n       \
    \ root /usr/share/;\n        index index.php;\n    }\n    location ~ ^/phpmyadmin/(.+\\\
    .php)$ {\n        try_files $uri =404;\n        root /usr/share/;\n        fastcgi_pass\
    \ unix:/var/run/php5-fpm.sock;\n        fastcgi_index index.php;\n        fastcgi_param\
    \ SCRIPT_FILENAME $document_root$fastcgi_script_name;\n        include /etc/nginx/fastcgi_params;\n\
    \    }\n    location ~* ^/phpmyadmin/(.+\\.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt))$\
    \ {\n        root /usr/share/;\n    }\n    location /phpMyAdmin {\n        rewrite\
    \ ^/* /phpmyadmin last;\n    }\n}\n```\n\n此虚拟主机配置为在端口 80 上运行，但位于虚拟目录中。该虚拟目录中的应用程序在自己的线程上运行，与端口\
    \ 80 上运行的其他任何内容分开。如果你更喜欢这种方式而不是不同的端口号，可以将之前的虚拟主机配置为以相同方式运行。\n\n现在你可以浏览到 http://raspberrypi/phpmyadmin/setup\
    \ 并按照屏幕上的说明进行操作。你可以暂时忽略有关配置目录的消息。你需要你的 MySQL root 数据库密码。在服务器部分，点击 Server 按钮上的\
    \ new 并在 Authentication 选项卡下输入 root 的密码。\n\n> 按照屏幕上的指南获取最新版本和有关最佳实践的信息。\n\n完成后，你可以将浏览器导航到虚拟目录\
    \ http://raspberrypi/phpmyadmin，并使用 root 凭据登录。你应该做的第一件事是设置一个新用户。\n\n## 安装 SQLite\n\
    \nSQLite3 是一个自包含、易于安装、轻量级的事务数据库。该产品的网站宣称它是世界上部署最广泛的数据库。据维基百科所知，它实际上是嵌入式设备上部署最广泛的数据库，这仍然使\
    \ MySQL 成为使用最广泛的数据库。这些对我们来说其实并不重要，因为这两种数据库在各自的领域都很出色，只是如果你希望在 Raspberry Pi 1 上获得更好的性能，SQLite\
    \ 是更好的选择：\n\n```\nsudo apt-get install sqlite3 php5-sqlite\n```\n\n我们将使用 phpliteadmin，这是一个专门为\
    \ SQLite 2 和 3 版本制作的单文件管理实用程序。同时，为 phpliteadmin 创建一个新子目录。请注意，Google 代码库即将关闭，该软件包可能很快会迁移到\
    \ GitHub。如果你无法解析链接，可以在互联网上搜索：\n\n```\nsudo mkdir /var/www/phpliteadmin/\nsudo\
    \ mkdir /var/www/phpliteadmin/web\ncd /var/www/phpliteadmin/web\nwget https://phpliteadmin.googlecode.com/files/phpliteAdmin_v1-9-5.zip\n\
    sudo unzip phpliteAdmin_v1-9-5.zip\n```\n\n让 phpliteadmin 在本地工作的最简单方法是将其运行在自己的专用端口上。\n\
    \n使用以下内容创建一个新的虚拟主机文件 sqladmin：\n\n```\nserver {\n    listen 81;\n\n    root /var/www/phpliteadmin/web/;\n\
    \    index phpliteadmin.php;\n    location ~ \\.php$ {\n        fastcgi_pass \
    \  unix:/var/run/php5-fpm.sock;\n        fastcgi_index  phpliteadmin.php;\n  \
    \      include        fastcgi_params;\n    }\n}\n```\n\n重新加载 nginx 并导航到 http://raspberrypi:81。默认密码是\
    \ admin。此时，你会收到错误消息，提示没有数据库且目录不可写。\n\nSQLite 创建包含所有数据的平面文件，你可以管理这些文件的位置。没有服务器管理这些文件，任何\
    \ SQLite 兼容的客户端都可以连接这些文件。\n\n你可以使用 SQLite3 命令行在 /var/www/phpliteadmin/web 中创建一个测试数据库：\n\
    \n```\nsudo sqlite3 test.db\nBEGIN;\nCREATE TABLE temps (theDate DATE, name TEXT);\n\
    COMMIT;\n.exit\n```\n\n刷新你导航到 `phpliteadmin` 的网页。你将看到新的布局，左侧列出数据库。如果你使目录可写，还可以创建新数据库。\n\
    \n> 强烈建议不要允许从互联网访问此虚拟网站，因为未实现任何安全功能。\n\n## 总结\n\n在本章中，我们介绍了如何在 .NET 或 PHP 主机平台上创建各种基本网站。Nginx\
    \ 确实是一个多功能且快速的代理服务器，有助于我们实现可以提供的各种 Web 应用程序。\n\n我们研究了如何托管 .NET MVC 和 PHP，以及安装两种不同类型的数据库引擎，所有这些都在和谐地并行运行。\n\
    \n在下一章中，我们将为本地网络设置文件共享，并为基于互联网的存储设置 *ownCloud*。\n"
