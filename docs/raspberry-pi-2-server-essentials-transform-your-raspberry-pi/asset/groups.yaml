    same versions of the server and client, you will see it in LAN.


    # OpenArena


    **OpenArena** is a free, first-person shooter based on the Quake 3 engine. It
    aims to be a clone of Quake 3, but it replaces proprietary content with brand
    new features.


    # Installing OpenArena


    The server installation can take up to 500 MB. Make sure you have enough free
    space, and then we can install the game using the Jessie repository:


    ```

    sudo apt-get -t jessie install openarena-server

    ```


    Several libraries will be installed during this time. You might be presented with
    a blue screen, which asks you if you want to restart some services in order to
    complete the package installation. It is safe to agree with this. This can take
    several minutes to complete.


    # Configuring OpenArena


    If you would like to share your server on the Internet, you should open and forward
    UDP ports 27960 and 27950 on your router. Go through the settings found at `/etc/openarena-server/server.cfg`:


    +   - `set dedicated 2`: We use 2 for the Internet while 1 (default) is LAN

    +   - `sv_hostname "Raspberry Pi"`: This is used to set the name of your server

    +   - `sv_master1 "dpmaster.deathmask.net"`: This sets the Internet server that
    keeps lists

    +   - `sv_maxclients 16`: This is the maximum amount or the number of clients
    that are allowed to connect

    +   - `capturelimit 8`: This is used to set the capture limit in CTF

    +   - `timelimit 15`: This is used to set the time limit

    +   - `fraglimit 35`: This is used to set the frag limit

    +   - `g_motd "This Pie is delicious!"`: This is used to set the message of the
    day

    +   - `g_gametype 0`: This is used to set gametype to Free for All; it is also
    known as Deathmatch'
  - '[PAGE 100]


    You can find hundreds of extra settings on the OpenArena Wiki. Remember that the
    server must not be run as root.


    The OpenArena server runs as a service. We should stop the service and run it
    on a console to make sure that everything runs fine. Once you are happy that everything
    is configured properly, you can start the service again:


    ```

    ```

    sudo service openarena-server stop

    /usr/games/openarena-server +exec /etc/openarena-server/server.cfg

    ```

    ```


    # Playing OpenArena


    The game can be played on Windows, Mac OS X, or Linux. You should go to the website
    for platform-specific clients.


    # Minecraft


    Minecraft is a sandbox indie game where you are in control of a person that can
    build anything you imagine. There are complex blocks that can be used or programmed
    to do various server-side calculations. If you would like to see the complete
    potential of Minecraft, you should visit BitVegas. This will be more difficult
    than the other servers as we need to install and configure a lot of dependencies.


    # Installing the Java Hard-Float


    We will need to go to https://jdk8.java.net/download.html, accept the terms, and
    copy the link to the Linux ARM 32bit for this. Now, we need to download the file,
    ignoring any certificate problems:


    ```

    ```

    sudo wget --no-check-certificate <URL>

    ```

    ```


    Then, enter these lines into the console and replace <filename> with the latest
    file you that have downloaded:


    ```

    ```

    mkdir -p /opt

    sudo tar zxvf <filename> -C /opt

    sudo /opt/jdk????/bin/java -version

    ```

    ```


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_100_0.png)


    You can start typing the filename and then press Tab. This will autocomplete the
    filename or display a list of similar names for your convenience.'
  - '[PAGE 101]


    If you get a response from the version command line, then you now have Java Hard-Float
    installed on your Raspberry Pi.


    # Installing the Minecraft server


    Minecraft servers are actively developed by various crowds, and there are many
    configurations to choose from. Spigot is a high performance Minecraft server implementation,
    and we can install it with the following command:


    ```

    cd /home/pi

    sudo wget http://ci.md-5.net/job/Spigot/lastStableBuild /artifact/Spigot-Server/target/spigot.jar

    ```


    ```

    # This is the command line use on Pi 2 1GB ram

    sudo /opt/jdk1.8.0/bin/java -Xms512M -Xmx992M -jar /home/pi/spigot.jar nogui

    ```


    ```

    #This is the command line use on Model B with 512 ram

    sudo /opt/jdk1.8.0/bin/java -Xms256M -Xmx496M -jar /home/pi/spigot.jar nogui

    ```


    It takes about 10 minutes to start up for the first time. Once it is ready, you
    can log on locally from another machine and explore your new world. You should
    exit shortly and configure the server for performance.


    # Configuring Minecraft


    To allow players from the Internet to connect, you will need to open and forward
    the port called 25565 to the Raspberry Pi from your router.


    These are the settings that seem to be best for running on the Raspberry Pi. You
    can adjust them as you go along:


    ```

    server-name=Raspberry Picraft!

    motd=Pie is Delicious

    allow-flight=false

    spawn-monsters=true

    generate-structures=true

    enable-query=false

    enable-rcon=false

    level-name=world

    spawn-protection=16

    online-mode=true

    ```'
