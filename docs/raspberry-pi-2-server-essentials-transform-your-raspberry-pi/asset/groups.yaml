    # Installing a database


    When we think of a database on a Linux machine, the first thing that often comes
    to our mind is MySQL. It is the first choice because it is free, open source,
    reliable, and comes with a rich toolset. On Raspberry Pi 2 with quad cores, MySQL
    has become an even more attractive solution, but I will still cover the alternative
    to SQLite that is lightweight and robust.


    # Installing MySQL


    MySQL has been around for a very long time, and unless you are looking for a specific
    version, you can use the current repository to install MySQL version 5.5:


    ```

    sudo apt-get update

    sudo apt-get install mysql-server

    ```'
  - "[PAGE 77]\n\nYou will be presented with blue-background screens asking you for\
    \ the root user password. You should write these down and keep them in a secure\
    \ location, but it is more convenient and secure to store passwords in an application\
    \ such as `KeePass`.\n\n> It is good practice to never use the root user with\
    \ MySQL for web applications, especially the production ones available on the\
    \ Internet.\n\n# Installing phpMyAdmin\n\nA very popular SQL management tool called\
    \ `phpMyAdmin` can be installed and used to further manage your databases and\
    \ even transact against them.\n\nThe `phpMyAdmin` is the only application that\
    \ needs to run with root settings so that it can fully manage MySQL. The best\
    \ practice for `phpMyAdmin` is to only allow local network connections for administration\
    \ or via SSH. This is because it will be used to create or delete databases, users,\
    \ and passwords, and apply permission access to these databases. You can create\
    \ less privileged users to log in via the Internet if you need too:\n\n```\n```bash\n\
    sudo apt-get install phpMyAdmin\n```\n```\n\nDuring installation, you will get\
    \ another blue screen asking for the web server that should be automatically configured.\
    \ Regrettably, `nginx` is *not* on the list; do not check any box and click on\
    \ **OK**. After a short while, a final screen will ask about `dbconfig-common`;\
    \ click on **NO**.\n\nWe need to manually configure phpMyAdmin just like any other\
    \ website for nginx. PhpMyAdmin places its files in the shared location `/usr/share/phpmyadmin`,\
    \ and anyone with access to the system can use this shared website to access only\
    \ their database.\n\nIn `sites-available`, create a new file called `phpmyadmin`;\
    \ now use the following configuration. Remember to create a symbolic link in `sites-enabled`\
    \ and then reload nginx:\n\n```\n```nginx\nserver {\n    location /phpmyadmin\
    \ {\n        root /usr/share/;\n        index index.php;\n    }\n    location\
    \ ~ ^/phpmyadmin/(.+\\.php)$ {\n        try_files $uri =404;\n        root /usr/share/;\n\
    \        fastcgi_pass unix:/var/run/php5-fpm.sock;\n        fastcgi_index index.php;\n\
    \    }\n}\n```\n```"
  - "[PAGE 78]\n\n```\nfastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;\n\
    \    include /etc/nginx/fastcgi_params;\n    }\n    location ~* ^/phpmyadmin/(.+\\\
    .(jpg|jpeg|gif|css|png|js|ico|html|xml|txt))$\n    {\n        root /usr/share/;\n\
    \    }\n    }\n    location /phpMyAdmin {\n    rewrite ^/* /phpmyadmin last;\n\
    \    }\n}\n```\n\nThis virtual host is configured to run on port 80, but in a\
    \ virtual directory. The application in this virtual directory runs on its own\
    \ thread, separate from anything else running on port 80. You can configure the\
    \ previous virtual hosts to run in the same way if you prefer this over different\
    \ port numbers.\n\nYou can now browse to http://raspberrypi/phpmyadmin/setup and\
    \ follow the onscreen instructions. You can ignore the message about the config\
    \ directory for now. You will need your MySQL root database password. In the servers\
    \ section, click new on the Server button and enter the password for root under\
    \ the Authentication tab.\n\n> Follow the guides on screen to get the most up-to-date\
    \ versions and information on the best practice.\n\nOnce you are complete, you\
    \ can navigate your browser to the virtual directory, http://raspberrypi/phpmyadmin,\
    \ and log in with your root credentials. The first thing you should do is set\
    \ up a new user.\n\n# Installing SQLite\n\nSQLite3 is a self-contained, easy-to-install,\
    \ lightweight transactional database. The product's website boasts that it is\
    \ the most deployed database in the world. As we know from Wikipedia, it is actually\
    \ the most deployed database on embedded devices, which still leaves MySQL as\
    \ the most used database. None of this really matters to us because both these\
    \ databases are very good at what they do, except that SQLite is a better choice\
    \ if you are looking for much better performance on your Raspberry Pi 1:\n\n```\n\
    sudo apt-get install sqlite3 php5-sqlite\n```"
  - "[PAGE 79]\n\nWe will be using phpliteadmin, a single-file administration utility\
    \ made specifically for SQLite versions 2 and 3. Also, create a new subdirectory\
    \ for phpliteadmin. Note that the Google code is closing and the package may be\
    \ moved to GitHub soon. You can search the Internet if the link doesn't resolve:\n\
    \n```\nsudo mkdir /var/www/phpliteadmin/\nsudo mkdir /var/www/phpliteadmin/web\n\
    cd /var/www/phpliteadmin/web\nwget https://phpliteadmin.googlecode.com/files/phpliteAdmin_v1-9-5.zip\n\
    sudo unzip phpliteAdmin_v1-9-5.zip\n```\n\nThe easiest way to get phpliteadmin\
    \ working locally is by running it on its own dedicated port.\n\nCreate a new\
    \ virtual host file sqladmin with the following content:\n\n```\nserver\n{\n \
    \   listen 81;\n\n    root /var/www/phpliteadmin/web/;\n    index phpliteadmin.php;\n\
    \    location ~ \\.php$\n    {\n        fastcgi_pass   unix:/var/run/php5-fpm.sock;\n\
    \        fastcgi_index  phpliteadmin.php;\n        include        fastcgi_params;\n\
    \    }\n}\n```\n\nReload nginx and navigate to http://raspberrypi:81. The default\
    \ password is admin. At this point, you will get an error message saying that\
    \ there are no databases and the directory is not writeable.\n\nSQLite creates\
    \ flat files that contain all the data, and you can manage where you would like\
    \ to keep these files. There is no server managing these files, and any SQLite-compatible\
    \ client can connect to these files.\n\nYou can create a test database in /var/www/phpliteadmin/web\
    \ using the SQLite3 command line:\n\n```\nsudo sqlite3 test.db\nBEGIN;\nCREATE\
    \ TABLE temps (theDate DATE, name TEXT);\nCOMMIT;\n.exit\n```"
