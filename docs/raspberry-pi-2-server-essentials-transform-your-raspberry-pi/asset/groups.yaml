  - '[PAGE 109]


    # Text overlay


    Text overlay is a feature that allows you to superimpose text lines onto video
    frames without any transcoding. The UV4L driver works extremely well with HD streams
    and framerates higher than 30, and supports mjpeg, H264, yuv420, and other video
    formats.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_109_0.png)


    > When enabled, the image width and height should be a multiple of 16. For 1080p
    you would need to use 1920 x 1088, 720p would be 1280 x 720, and so on.


    At the most basic level, text is read from a JSON-formatted file, which contains
    properties for each line''s position, color, thickness, and scale. The default
    configuration file will display the video frame rate as it is being transmitted.
    The configuration file gets loaded when the camera is started for the first time,
    but it can be updated with a specific command, making heads-up displays (HUDs)
    a practical reality.


    To enable the text overlay, you need to start the driver with the following /etc/uv41/uv41-raspicam.conf
    configuration before loading the camera page for the first time. You cannot enable
    this feature if there is already an ongoing stream:


    ```

    text-overlay = yes

    text-filename = /usr/share/uv4l/raspicam/text.json

    ```


    The text.json file contains a sample of all the options that are available to
    you. It is a good idea to copy this file to /home/pi.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_109_1.png)


    > If you plan on updating the file frequently, it is recommended to store the
    file in /tmp as the file will actually be stored in RAM.


    After restarting the uv4l_raspicam service, you will now see some sample overlay
    text on your video stream.


    You can edit the text.json file and execute the following command in the console
    for the overlay text to be updated:


    ```

    v412-ctl --set-ctrl=text_overlay=1

    ```


    This is a very basic approach to updating the overlay on your video stream, for
    example, running a separate program you wrote that will overwrite the file every
    so often and issue the refresh command.


    Using this approach, you will not be able to update the overlay any faster than
    1 second at a time. If you would like to achieve real-time overlay updates, refer
    to The HUD sample section.'
  - '[PAGE 110]


    More details about how to remove the http://www.linux-projects.org overlay are
    provided further on in this chapter.


    # Object detection and tracking


    Object detection and tracking can be turned off and on at any time. This feature
    only works with the yuv420, H264, and mjpeg encodings.


    This feature requires more CPU overhead depending on how complex a task you are
    doing. For example, on the Pi 2, you can use face recognition with 640 x 480 at
    15 FPS with some heavy CPU usage. On the Pi 1, it is about half of this:


    ```

    uv41 --driver raspicam --auto-video_nr --object-detection --min-object-size 80
    80 --main-classifier /usr/share/uv4l/raspicam/lbpcascade_frontalface.xml --object-detection-mode
    accurate_detection --width 320 --height 240 --framerate 15 --encoding h264

    ```


    # Removing the overlay watermark


    I have been in contact with Luca Risolia, the author of UV4L, and he has agreed
    to provide you with an exclusive deal; as the reader of this book, you will be
    the very first person to know that he has agreed to provide you with a way to
    remove the white http://www.linux-projects.org watermark on the 3 Raspberry Pi''s
    that you own!


    All you need to do is send an e-mail to info@linux-projects.com with the following
    details from your Raspberry Pi by executing and copying the results of this command:


    ```

    uv41 --driver raspicam --serial-number

    ```


    I am sure Luca will be grateful for a small donation in return for three serial
    numbers, and this will allow him to continue to create more features for this
    excellent driver.


    # The HUD sample


    As defined by Wikipedia, a heads-up display, also known as a HUD, is a transparent
    display that presents data without requiring users to look away from the main
    activity. The origin of the name comes from a pilot being able to view information
    with their head positioned up or straight ahead, instead of looking down at some
    instruments.'
  - '[PAGE 111]


    So, to stop us from looking down into the console, I thought it would be a nice
    idea to see some information about our Raspberry Pi directly on the video stream.


    With some help from Luca, I have created the C++ code that allows you to update
    the overlay pretty much on every frame using the UV4L API directly, which means
    hardly any CPU overhead is used.


    If you feel comfortable with C++11, I have provided the complete code sample on
    the code download page, and you can add your own variables.


    I have also provided a compiled binary with a variety of popular resource variables
    that you can use easily place in the template file once, and will be updated in
    real time on your stream.


    # Using the overlay binary


    The binary requires two parameters: the source video device and the source file,
    which will be referred to as the template file. The template file is exactly the
    same format as text.json, but the difference is that you construct the text fields
    with the inline variables listed here. It is recommended to copy your template
    file to /tmp/file.tpl and provide it as the source template.


    You will also need to update the uv1_raspicam.config file to point to a new location,
    /tmp/text.json (not the template file), and restart the UV4L service. A new file
    will be created in /tmp/text.json from which the UV4L API call will read the replaced
    variables. Do not alter this file. Working with these files in /tmp is critical
    for achieving the best video performance but also eliminating I/O from your SD
    card, which may cause unnecessary wear during long periods of use.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_111_0.png)


    > In case you are wondering, you can update the template /tmp/file.tpl file while
    the binary is running. The C++ binary file reads the template file using a stream
    open in read-only mode with minimal locks.


    Use this command line to execute the binary:


    ```

    ./overlay /dev/video0 /tmp/text.tpl

    ```


    # Inline variables


    Here are some useful variables from the general Raspberry Pi resources:


    +   - {sysnfo.cputemp}'
  - '[PAGE 112]


    Wireless info (the default is wlan0):


    +   - `{signfo.level}`: Signal strength

    +   - `{signfo.quality}`: Signal quality

    +   - `{signfo.bitrate}`: Bitrate


    Network bandwidth (the default is eth0):


    +   - `{nnfo.downspeed}`

    +   - `{nnfo.upspeed}`


    A sample text line will look like this:


    ```

    "ETH0 UP: {nnfo.upspeed} CPU temp {sysnfo.cputemp}"

    ```


    To change the default values you need to amend the C++ file and recompile it.
    If you are already going to edit the code, use the base code as an example and
    try to add something else. If you have never edited C++ or any other code, just
    try to understand the main class line by line, and by the time you get to the
    end, you will understand the basic C++.


    # Compiling the overlay code yourself


    The C++ code was written in the C++11 standard, and it is necessary to install
    G++ version 4.8 to be able to compile this code. No extra libraries, such as libboost,
    are required for this sample:


    ```

    sudo apt-get install g++-4.8

    ```


    Once you have installed the latest G++, you can then simply compile the main code
    file and extra code files with any changes you have made by executing the following
    command:


    ```

    sudo g++-4.8 -Ofast -std=c++11 *.cpp -o overlay

    ```


    Luca has also provided a text-scrolling example that can be downloaded from http://www.linux-projects.org/downloads/examples/uv4l-overlay.cpp,
    but it requires the Boost C++ library. Unfortunately, the inclusion of this library
    causes the code to take considerably longer to compile. This is why I have removed
    all dependencies from the Boost library in my code; it provides a lot of extra
    support for tasks and structures used in modern programming languages and is worth
    a try:


    ```

    sudo apt-get install libboost-all-dev

    ```'
  - '[PAGE 113]


    If you are a Visual Studio developer, you will be happy to know that I have created
    the overlay binary using Visual Studio with **VisualGDB**. VisualGDB allows you
    to write code with C++ intellisense in Visual Studio on your desktop. It will
    automagically copy your files and compile them on the Raspberry Pi over SSH. Another
    great feature is that you can debug the code running on the Pi within Visual Studio!
    You do not need to install any extra software on the Raspberry Pi. A tutorial
    on how to start using VisualGDB is available at `http://visualgdb.com/tutorials/raspberry/`.


    There are other tutorials on the site you may find interesting. There is a 30-day
    trial you can use.


    # Summary


    Streaming videos is still one of the most popular search terms on the Internet
    for the Raspberry Pi. There are a lot of different examples and solutions, some
    very complex some very easy.


    Thanks to the work put into the UV4L driver, video streaming is becoming much
    easier to achieve. Compared to *Raspberry Pi Server Essentials, Packt Publishing,
    my* previous book, this chapter has been extremely shortened due to the easy that
    it has accomplishes now. Not only is it shorter, we have many more features to
    work with and can enjoy HD video streaming on the Raspberry Pi 2 with the smallest
    amount of effort.


    In the next chapter, we will look at how to set up the Pi as a media center.'
