    \ times. Recently, Addonics developed another device that can be daisy chained\
    \ infinitely!\n\nLet's assume that we can daisy chain up to three levels, and\
    \ we use 2 TB hard drives. We configure all the multipliers to span data across\
    \ all drives with no redundancy; that is, five times five, times five. We end\
    \ up with 125 usable SATA ports and a total of 250 terabytes of storage. This\
    \ figure is highly impractical for home users because all these hard drives consume\
