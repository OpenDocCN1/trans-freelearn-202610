    # 3


    # Configuring Extra Features


    There are some extra features on the Broadcom chip that can be used out of the
    box or activated using extra licenses that can be purchased. Many of these features
    are undocumented, and are found by developers or hobbyists working on various
    projects for Raspberry Pi.


    In this chapter, you will learn how to keep Raspberry Pi up to date and also how
    to use the extra features of the GPU.


    # Updating Raspberry Pi


    The Raspberry Pi essentially has three software layers: the closed source GPU
    boot process, the boot loader (also known as the firmware), and the operating
    system. At the time of writing book, we cannot update the GPU code. But maybe,
    one day, Broadcom or hardware hackers will tell us how do to this.


    This leaves us with the firmware and the operating system packages. Broadcom releases
    regular updates for the firmware as precompiled binaries to the Raspberry Pi Foundation,
    which then releases them to the public. The Foundation and other community members
    work on Raspbian, and release updates via the aptitude repository; this is where
    we get all our wonderful applications from.


    It is essential to keep both the firmware and the packages up to date so that
    you can benefit from bug fixes and new or improved functionality from the Broadcom
    chip.


    Raspberry Pi 2 uses ARMv7 as opposed to Pi 1, which uses ARMv6. It is recommended
    to use the latest version of the Raspbian release to benefit from the speed increase.
    Thanks to the upgrade to ARMv7, it now also supports the standard Debian Hard
    Float packages and other ARMv7 operating systems, such as Windows IoT Core.'
  - '[PAGE 54]


    # Updating the firmware


    Updating the firmware used to be quite an involved process, but thanks to a user
    on GitHub, who goes under the alias Hexxeh, we have some code to automatically
    do this for us. You don''t need to run this as often as `apt-update`, but if you
    constantly upgrade the operating system, you may need to run this if advised or
    if you are experiencing problems with new features or instability.


    The `rpi-update` command is now included as standard in the Raspbian image, and
    we can simply run the following command:


    ```

    sudo rpi-update

    ```


    After the process is complete, you will need to restart your Raspberry Pi in order
    to load the new firmware.


    # Updating packages


    Keeping Raspbian packages up to date is also very important, as many changes might
    work together with the fixes published in the firmware. Firstly, we will update
    the source list, which downloads a list of packages and their versions to the
    aptitude cache. Then, we will run the `upgrade` command, which will compare the
    packages that are already installed and also compare their dependencies, and then
    download and update them accordingly:


    ```

    sudo apt-get update

    ```


    ```

    sudo apt-get upgrade

    ```


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_54_0.png)


    > Updating some packages might break your existing custom code or applications
    if there are major changes in the libraries. If you are running custom code, you
    should always check the release notes if you need to change anything in your code
    before updating.


    # Updating distribution


    We may find that running the firmware update process and package updates does
    not always solve a particular problem.


    If you are using a release such as `debian-armhf`, you can use the following commands
    without the need to set everything up again:


    ```

    sudo apt-get dist-upgrade

    ```


    ```

    sudo apt-get install raspberrypi-ui-mods

    ```'
  - '[PAGE 55]


    # Outcomes


    If you have a long-term or production project that will be running independently,
    it is not a good idea to log in from time to time to update the packages. With
    Linux, it is acceptable to configure your system and let it run for long periods
    of time without any software maintenance. You should be aware of critical updates
    though, and you should evaluate if you need to install them. For example, consider
    the major Heartbleed vulnerability in SSH. If you had a Raspberry Pi directly
    connected to the public Internet, this would require instant action.


    Windows users are conditioned to be updated frequently, and it is very rare that
    something will go wrong. But on Linux, running updates will update your software
    and operating system components, which could cause incompatibilities with other
    custom software. For example, you used an open source CMS web application to host
    some of your articles. It was specifically designed for PHP version x, but upgrading
    to version y also requires the entire CMS system to be upgraded. Sometimes, less
    popular open source sources may take several months before the code gets refactored
    to work with the latest PHP version, and consequently, they may unknowingly upgrade
    to the latest PHP or may partially break your CMS.


    One way to try and work around this is to clone your SD card and perform the updates
    on one card. If you encounter any issues, you can easily go back and use the other
    SD card.


    A distribution called CentOS tries to deal with this problem by releasing updates
    once a year. This is intended to make sure that everybody has enough time to test
    their software before you can do a full update with minimal or even no breaking
    changes. Unfortunately, CentOS has no ARM support, but you could follow this guideline
    by updating packages when you need them.


    # Hardware watchdog


    A hardware watchdog is a digital clock that needs to be regularly restarted before
    it reaches a certain time.


    Just like in the TV series Lost, there is a dead man''s switch hidden on the island
    that needs to be pressed at regular intervals; otherwise, an unknown event will
    begin. In terms of the Broadcom GPU, if the switch is not pressed, it means that
    the system has stopped responding, and the reaction event is to restart Raspberry
    Pi and reload the operating system with the expectation that it will resolve the
    issue, at least temporarily.'
  - '[PAGE 56]


    Raspbian has a kernel module included — which is disabled by default — that deals
    with the watchdog hardware. A configurable daemon that runs on the software layer
    sends regular events (like pressing a button), referred to as a heartbeat to the
    watchdog, via the kernel module.


    # Enabling the watchdog and daemon


    To get everything up and running, we need to do a few things, as follows:


    +   1. Add the following in the console:

    +   ```

    +   sudo modprobe bcm2708_wdog

    +   sudo vi /etc/modules

    +   ```

    +   2. Type the line of text bcm2708_wdog to the file. Then, save and exit by
    pressing Esc and typing :wq command.

    +   3. Next, we need to install the daemon that will send the heartbeat signals
    every 10 seconds. We use chkconfig, add it to the startup process, and then enable
    it, as follows:

    +   ```

    +   sudo apt-get install watchdog chkconfig

    +   sudo chkconfig --add watchdog

    +   chkconfig watchdog on

    +   ```

    +   4. We can now configure the daemon to do simple checks. Edit the following
    file:

    +   ```

    +   sudo vi /etc/watchdog.conf

    +   ```

    +   5. Uncomment the lines max-load-1 = 24 and watchdog-device by removing the
    hash (#) character. The max load means that it will take 24 Pi''s to complete
    the task in 1 minute. In normal usage, this should never happen and would only
    really occur when the Raspberry Pi has hung.

    +   6. You can now start the watchdog with which configuration. Each time you
    change something, you will need to restart the watchdog:

    +   ```

    +   sudo /etc/init.d/watchdog start

    +   ```


    There are some other examples in the configuration file that may be of interest.'
  - '[PAGE 57]


    # Testing the watchdog


    In Linux, you can easily place a function into a separate thread that runs in
    a new process using the & character on the command line. Exploiting this feature
    together with some anonymous functions, we can issue a very crude but effective
    system halt. This is a quick way to test whether the watchdog daemon is working
    correctly, and it should not be used to halt the Raspberry Pi. It is known as
    a fork bomb, and many operating systems are susceptible to this.


    The random-looking series of characters are actually anonymous functions that
    create other new anonymous function. This is an endless and uncontrollable loop.
    It most likely adopted the name bomb, because once it starts, it cannot be stopped.
    Even if you try to kill the original thread, it creates several new threads that
    need to be killed. It is just impossible to stop, and eventually, it bombs the
    system into a critical state, also known as a stack overflow. Type these characters
    into the command line and press Enter:


    ```

    : () { : | : & } ; :

    ```


    After you press Enter, the Raspberry Pi should restart after about 30 seconds,
    but it might take up to a minute.


    # Enabling extra decoders


    The Broadcom chip actually has extra hardware for encoding and decoding a few
    other well-known formats. The Raspberry Pi Foundation did not include these licenses
    because they wanted to keep the costs down to a minimum, but they have included
    the H.264 license. This allows you to watch HD media on your TV, use the webcam
    module, or transcode media files.


    They did provide a way for users to buy separate licenses if you want to use these
    extra encoders or decoders.


    At the time of writing, the only project to use these hardware codecs was the
    OMXPlayer project maintained by XBMC. The latest Raspbian package has the omx
    package included.


    # Buying licenses


    You can go to http://www.raspberrypi.com/license-keys/ to buy licenses, which
    can be used once per device. Follow the instructions on the website to get your
    license key.'
  md: "\n## 3 Configuring Extra Features\n\nThere are some extra features on the Broadcom\
    \ chip that can be used out of the box or activated using extra licenses that\
    \ can be purchased. Many of these features are undocumented, and are found by\
    \ developers or hobbyists working on various projects for Raspberry Pi.\n\nIn\
    \ this chapter, you will learn how to keep Raspberry Pi up to date and also how\
    \ to use the extra features of the GPU.\n\n### Updating Raspberry Pi\n\nThe Raspberry\
    \ Pi essentially has three software layers: the closed source GPU boot process,\
    \ the boot loader (also known as the firmware), and the operating system. At the\
    \ time of writing the book, we cannot update the GPU code. But maybe, one day,\
    \ Broadcom or hardware hackers will tell us how to do this.\n\nThis leaves us\
    \ with the firmware and the operating system packages. Broadcom releases regular\
    \ updates for the firmware as precompiled binaries to the Raspberry Pi Foundation,\
    \ which then releases them to the public. The Foundation and other community members\
    \ work on Raspbian, and release updates via the aptitude repository; this is where\
    \ we get all our wonderful applications from.\n\nIt is essential to keep both\
    \ the firmware and the packages up to date so that you can benefit from bug fixes\
    \ and new or improved functionality from the Broadcom chip.\n\nRaspberry Pi 2\
    \ uses ARMv7 as opposed to Pi 1, which uses ARMv6. It is recommended to use the\
    \ latest version of the Raspbian release to benefit from the speed increase. Thanks\
    \ to the upgrade to ARMv7, it now also supports the standard Debian Hard Float\
    \ packages and other ARMv7 operating systems, such as Windows IoT Core.\n\n###\
    \ Updating the firmware\n\nUpdating the firmware used to be quite an involved\
    \ process, but thanks to a user on GitHub, who goes under the alias Hexxeh, we\
    \ have some code to automatically do this for us. You don't need to run this as\
    \ often as `apt-get update`, but if you constantly upgrade the operating system,\
    \ you may need to run this if advised or if you are experiencing problems with\
    \ new features or instability.\n\nThe `rpi-update` command is now included as\
    \ standard in the Raspbian image, and we can simply run the following command:\n\
    \n```\nsudo rpi-update\n```\n\nAfter the process is complete, you will need to\
    \ restart your Raspberry Pi in order to load the new firmware.\n\n### Updating\
    \ packages\n\nKeeping Raspbian packages up to date is also very important, as\
    \ many changes might work together with the fixes published in the firmware. Firstly,\
    \ we will update the source list, which downloads a list of packages and their\
    \ versions to the aptitude cache. Then, we will run the `upgrade` command, which\
    \ will compare the packages that are already installed and also compare their\
    \ dependencies, and then download and update them accordingly:\n\n```\nsudo apt-get\
    \ update\n```\n\n```\nsudo apt-get upgrade\n```\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_54_0.png)\n\
    \n> Updating some packages might break your existing custom code or applications\
    \ if there are major changes in the libraries. If you are running custom code,\
    \ you should always check the release notes if you need to change anything in\
    \ your code before updating.\n\n### Updating distribution\n\nWe may find that\
    \ running the firmware update process and package updates does not always solve\
    \ a particular problem.\n\nIf you are using a release such as `debian-armhf`,\
    \ you can use the following commands without the need to set everything up again:\n\
    \n```\nsudo apt-get dist-upgrade\n```\n\n```\nsudo apt-get install raspberrypi-ui-mods\n\
    ```\n\n### Outcomes\n\nIf you have a long-term or production project that will\
    \ be running independently, it is not a good idea to log in from time to time\
    \ to update the packages. With Linux, it is acceptable to configure your system\
    \ and let it run for long periods of time without any software maintenance. You\
    \ should be aware of critical updates though, and you should evaluate if you need\
    \ to install them. For example, consider the major Heartbleed vulnerability in\
    \ SSH. If you had a Raspberry Pi directly connected to the public Internet, this\
    \ would require instant action.\n\nWindows users are conditioned to be updated\
    \ frequently, and it is very rare that something will go wrong. But on Linux,\
    \ running updates will update your software and operating system components, which\
    \ could cause incompatibilities with other custom software. For example, you used\
    \ an open source CMS web application to host some of your articles. It was specifically\
    \ designed for PHP version x, but upgrading to version y also requires the entire\
    \ CMS system to be upgraded. Sometimes, less popular open source sources may take\
    \ several months before the code gets refactored to work with the latest PHP version,\
    \ and consequently, they may unknowingly upgrade to the latest PHP or may partially\
    \ break your CMS.\n\nOne way to try and work around this is to clone your SD card\
    \ and perform the updates on one card. If you encounter any issues, you can easily\
    \ go back and use the other SD card.\n\nA distribution called CentOS tries to\
    \ deal with this problem by releasing updates once a year. This is intended to\
    \ make sure that everybody has enough time to test their software before you can\
    \ do a full update with minimal or even no breaking changes. Unfortunately, CentOS\
    \ has no ARM support, but you could follow this guideline by updating packages\
    \ when you need them.\n\n### Hardware watchdog\n\nA hardware watchdog is a digital\
    \ clock that needs to be regularly restarted before it reaches a certain time.\n\
    \nJust like in the TV series Lost, there is a dead man's switch hidden on the\
    \ island that needs to be pressed at regular intervals; otherwise, an unknown\
    \ event will begin. In terms of the Broadcom GPU, if the switch is not pressed,\
    \ it means that the system has stopped responding, and the reaction event is to\
    \ restart Raspberry Pi and reload the operating system with the expectation that\
    \ it will resolve the issue, at least temporarily.\n\nRaspbian has a kernel module\
    \ included — which is disabled by default — that deals with the watchdog hardware.\
    \ A configurable daemon that runs on the software layer sends regular events (like\
    \ pressing a button), referred to as a heartbeat to the watchdog, via the kernel\
    \ module.\n\n### Enabling the watchdog and daemon\n\nTo get everything up and\
    \ running, we need to do a few things, as follows:\n\n- 1. Add the following in\
    \ the console:\n  ```\n  sudo modprobe bcm2708_wdog\n  sudo vi /etc/modules\n\
    \  ```\n- 2. Type the line of text bcm2708_wdog to the file. Then, save and exit\
    \ by pressing Esc and typing :wq command.\n- 3. Next, we need to install the daemon\
    \ that will send the heartbeat signals every 10 seconds. We use chkconfig, add\
    \ it to the startup process, and then enable it, as follows:\n  ```\n  sudo apt-get\
    \ install watchdog chkconfig\n  sudo chkconfig --add watchdog\n  chkconfig watchdog\
    \ on\n  ```\n- 4. We can now configure the daemon to do simple checks. Edit the\
    \ following file:\n  ```\n  sudo vi /etc/watchdog.conf\n  ```\n- 5. Uncomment\
    \ the lines max-load-1 = 24 and watchdog-device by removing the hash (#) character.\
    \ The max load means that it will take 24 Pi's to complete the task in 1 minute.\
    \ In normal usage, this should never happen and would only really occur when the\
    \ Raspberry Pi has hung.\n- 6. You can now start the watchdog with this configuration.\
    \ Each time you change something, you will need to restart the watchdog:\n  ```\n\
    \  sudo /etc/init.d/watchdog start\n  ```\n\nThere are some other examples in\
    \ the configuration file that may be of interest.\n\n### Testing the watchdog\n\
    \nIn Linux, you can easily place a function into a separate thread that runs in\
    \ a new process using the & character on the command line. Exploiting this feature\
    \ together with some anonymous functions, we can issue a very crude but effective\
    \ system halt. This is a quick way to test whether the watchdog daemon is working\
    \ correctly, and it should not be used to halt the Raspberry Pi. It is known as\
    \ a fork bomb, and many operating systems are susceptible to this.\n\nThe random-looking\
    \ series of characters are actually anonymous functions that create other new\
    \ anonymous functions. This is an endless and uncontrollable loop. It most likely\
    \ adopted the name bomb, because once it starts, it cannot be stopped. Even if\
    \ you try to kill the original thread, it creates several new threads that need\
    \ to be killed. It is just impossible to stop, and eventually, it bombs the system\
    \ into a critical state, also known as a stack overflow. Type these characters\
    \ into the command line and press Enter:\n\n```\n: () { : | : & } ; :\n```\n\n\
    After you press Enter, the Raspberry Pi should restart after about 30 seconds,\
    \ but it might take up to a minute.\n\n### Enabling extra decoders\n\nThe Broadcom\
    \ chip actually has extra hardware for encoding and decoding a few other well-known\
    \ formats. The Raspberry Pi Foundation did not include these licenses because\
    \ they wanted to keep the costs down to a minimum, but they have included the\
    \ H.264 license. This allows you to watch HD media on your TV, use the webcam\
    \ module, or transcode media files.\n\nThey did provide a way for users to buy\
    \ separate licenses if you want to use these extra encoders or decoders.\n\nAt\
    \ the time of writing, the only project to use these hardware codecs was the OMXPlayer\
    \ project maintained by XBMC. The latest Raspbian package has the omx package\
    \ included.\n\n### Buying licenses\n\nYou can go to http://www.raspberrypi.com/license-keys/\
    \ to buy licenses, which can be used once per device. Follow the instructions\
    \ on the website to get your license key.\n"
  mdcn: "\n## 3 配置额外功能\n\nBroadcom 芯片上有一些额外功能，可以直接使用或通过购买额外许可证激活。其中许多功能未有文档记录，是由在各种\
    \ Raspberry Pi 项目上工作的开发者或爱好者发现的。\n\n在本章中，您将学习如何保持 Raspberry Pi 保持最新状态，以及如何使用 GPU\
    \ 的额外功能。\n\n### 更新 Raspberry Pi\n\nRaspberry Pi 本质上具有三个软件层：闭源的 GPU 启动过程、引导加载程序（也称为固件）和操作系统。在本书撰写时，我们无法更新\
    \ GPU 代码。但也许有一天，Broadcom 或硬件黑客会告诉我们如何做到这一点。\n\n这就剩下固件和操作系统软件包了。Broadcom 会定期以预编译的二进制文件向\
    \ Raspberry Pi 基金会发布固件更新，后者再将其发布给公众。基金会和其他社区成员负责 Raspbian，并通过 aptitude 仓库发布更新；这就是我们获取所有精彩应用程序的地方。\n\
    \n保持固件和软件包的最新状态至关重要，这样您才能从 Broadcom 芯片的错误修复以及新功能或改进功能中受益。\n\nRaspberry Pi 2 使用\
    \ ARMv7，而 Pi 1 使用 ARMv6。建议使用最新版本的 Raspbian 发布版以受益于速度提升。得益于升级到 ARMv7，它现在还支持标准的\
    \ Debian 硬浮点软件包和其他 ARMv7 操作系统，例如 Windows IoT Core。\n\n### 更新固件\n\n更新固件过去曾是一个相当复杂的过程，但由于\
    \ GitHub 上一位化名为 Hexxeh 的用户，我们有了一些代码可以自动为我们完成此操作。您不需要像 `apt-get update` 那样频繁运行它，但如果您不断升级操作系统，如果建议这样做或您遇到新功能或不稳定问题时，可能需要运行它。\n\
    \n`rpi-update` 命令现在作为 Raspbian 映像的标准组件包含在内，我们可以简单地运行以下命令：\n\n```\nsudo rpi-update\n\
    ```\n\n过程完成后，您需要重新启动 Raspberry Pi 以加载新的固件。\n\n### 更新软件包\n\n保持 Raspbian 软件包为最新状态也很重要，因为许多更改可能会与固件中发布的修复程序一起工作。首先，我们将更新源列表，该列表会将软件包列表及其版本下载到\
    \ aptitude 缓存中。然后，我们将运行 `upgrade` 命令，该命令将比较已安装的软件包并比较其依赖关系，然后相应地下载并更新它们：\n\n```\n\
    sudo apt-get update\n```\n\n```\nsudo apt-get upgrade\n```\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_54_0.png)\n\
    \n> 更新某些软件包如果库中有重大更改，可能会破坏您现有的自定义代码或应用程序。如果您正在运行自定义代码，在更新之前应始终查看发行说明，看看是否需要在代码中进行更改。\n\
    \n### 更新发行版\n\n我们可能会发现，运行固件更新过程和软件包更新并不总是能解决特定问题。\n\n如果您使用的是 `debian-armhf` 等发行版，可以使用以下命令而无需重新设置一切：\n\
    \n```\nsudo apt-get dist-upgrade\n```\n\n```\nsudo apt-get install raspberrypi-ui-mods\n\
    ```\n\n### 结果\n\n如果您有一个长期运行或生产项目将独立运行，不建议不时登录来更新软件包。在 Linux 中，配置系统后让其在长时间内无需任何软件维护运行是可以接受的。您应该注意关键更新，并评估是否需要安装它们。例如，考虑\
    \ SSH 中的重大 Heartbleed 漏洞。如果您有一台 Raspberry Pi 直接连接到公共互联网，这将需要立即采取行动。\n\nWindows\
    \ 用户习惯于频繁更新，很少出现问题。但在 Linux 中，运行更新会更新您的软件和操作系统组件，这可能会与其他自定义软件不兼容。例如，您使用了一个开源 CMS\
    \ 网络应用程序来托管一些文章。它专门为 PHP 版本 x 设计，但升级到版本 y 也需要整个 CMS 系统升级。有时，较不受欢迎的开源来源可能需要几个月的时间才能重构代码以使用最新的\
    \ PHP 版本，因此他们可能在不知情的情况下升级到最新的 PHP 或部分破坏您的 CMS。\n\n一种解决方法是克隆您的 SD 卡并在一张卡上执行更新。如果遇到任何问题，您可以轻松返回并使用另一张\
    \ SD 卡。\n\n一个名为 CentOS 的发行版试图通过每年发布一次更新来解决这个问题。其目的是确保每个人都有足够的时间在您进行完整更新时测试他们的软件，而不会出现最小或甚至没有破坏性更改。不幸的是，CentOS\
    \ 没有 ARM 支持，但您可以遵循这一指导原则，在需要时更新软件包。\n\n### 硬件看门狗\n\n硬件看门狗是一个数字时钟，需要在达到特定时间之前定期重新启动。\n\
    \n就像电视剧《迷失》中一样，岛上隐藏着一个死人开关，需要定期按下；否则，将开始一个未知事件。就 Broadcom GPU 而言，如果开关未被按下，则意味着系统已停止响应，反应事件是重新启动\
    \ Raspberry Pi 并重新加载操作系统，希望至少暂时解决该问题。\n\nRaspbian 包含一个用于处理看门狗硬件的内核模块——默认情况下处于禁用状态——。一个在软件层上运行的可配置守护进程会通过内核模块向看门狗发送定期事件（例如按下按钮），称为心跳。\n\
    \n### 启用看门狗和守护进程\n\n要让一切正常运行，我们需要做以下几件事：\n\n- 1. 在控制台中添加以下内容：\n  ```\n  sudo modprobe\
    \ bcm2708_wdog\n  sudo vi /etc/modules\n  ```\n- 2. 在文件中输入文本行 bcm2708_wdog。然后通过按\
    \ Esc 并输入 :wq 命令保存并退出。\n- 3. 接下来，我们需要安装守护进程，该守护进程每 10 秒发送一次心跳信号。我们使用 chkconfig，将其添加到启动过程中，然后启用它，如下所示：\n\
    \  ```\n  sudo apt-get install watchdog chkconfig\n  sudo chkconfig --add watchdog\n\
    \  chkconfig watchdog on\n  ```\n- 4. 现在我们可以配置守护进程以执行简单检查。编辑以下文件：\n  ```\n  sudo\
    \ vi /etc/watchdog.conf\n  ```\n- 5. 通过删除哈希（#）字符取消注释行 max-load-1 = 24 和 watchdog-device。最大负载意味着完成任务需要\
    \ 24 个 Pi 在 1 分钟内。在正常使用中，这永远不应该发生，只有在 Raspberry Pi 挂起时才会真正发生。\n- 6. 现在您可以使用此配置启动看门狗。每次更改某些内容时，您都需要重新启动看门狗：\n\
    \  ```\n  sudo /etc/init.d/watchdog start\n  ```\n\n配置文件中还有一些其他示例可能引起兴趣。\n\n###\
    \ 测试看门狗\n\n在 Linux 中，您可以使用命令行上的 & 字符轻松将函数放入单独的线程中，在新进程中运行。利用此功能以及一些匿名函数，我们可以发出非常粗糙但有效的系统停止。这是测试看门狗守护进程是否正常工作的快速方法，不应用于停止\
    \ Raspberry Pi。它被称为 fork 炸弹，许多操作系统都容易受到此攻击。\n\n看似随机的字符序列实际上是创建其他新匿名函数的匿名函数。这是一个无休止且不可控的循环。它很可能采用炸弹这个名字，因为一旦开始就无法停止。即使您尝试杀死原始线程，它也会创建多个需要被杀死的线程。根本不可能停止，最终它会将系统炸入关键状态，也称为堆栈溢出。输入这些字符到命令行并按\
    \ Enter：\n\n```\n: () { : | : & } ; :\n```\n\n按 Enter 后，Raspberry Pi 应在大约 30 秒后重新启动，但可能需要长达一分钟。\n\
    \n### 启用额外解码器\n\nBroadcom 芯片实际上具有用于编码和解码其他几种知名格式的额外硬件。Raspberry Pi 基金会未包含这些许可证，因为他们希望将成本降至最低，但他们已包含\
    \ H.264 许可证。这使您可以在电视上观看高清媒体、使用网络摄像头模块或转码媒体文件。\n\n他们确实为用户提供了一种购买单独许可证的方式，如果您想使用这些额外编码器或解码器。\n\
    \n在撰写本文时，使用这些硬件编解码器的唯一项目是 XBMC 维护的 OMXPlayer 项目。最新的 Raspbian 软件包已包含 omx 软件包。\n\
    \n### 购买许可证\n\n您可以前往 http://www.raspberrypi.com/license-keys/ 购买许可证，每个设备只能使用一次。按照网站上的说明获取您的许可证密钥。\n"
