    we can only send a maximum of 12 MBps of data via Ethernet anyway.


    If you really want to squeeze out more transfer speed, you can use a compatible
    802.11n or 802.11ac wireless USB peripheral. You may achieve in excess of 100
    MBps with WiFi, but there is the extra process of making sure your signal is good
    and that your general environment is not occupied by any other wireless router.
    The most optimistic transfer speed you can expect is about 25-30 MBps.


    ### Preparing the storage medium


    At this stage, it is a very good idea to use an externally-powered USB hub. USB-attached
    hard drives will need this extra power to operate properly. If you are using a
    wireless adapter and any other USB peripheral, you should consider moving them
    over to the powered USB hub.


    > Make sure that you are not using a drive with important files. This chapter
    will show you how to format drives and use other file systems. All the data on
    your drives will be lost.


    For simplicity, in this chapter, we will be using an 8 GB USB flash drive; but
    the concept is the same for USB hard drives.


    ### Listing the available drives


    In the console, you can use the fdisk command to get a list of drives, and partitions
    as shown in the following command line:


    ```

    sudo fdisk -l

    ```


    The fdisk command will show you the names of the disks used in Linux, their full
    sizes, and partitions. The drive under /dev/mmcblk is the internal SD card, and
    you do not want to do anything with this device. Instead, you should always look
    for drives marked /dev/sdXn, where x is usually a letter representing a physical
    drive and n is a number representing the partitions of the device in ascending
    order.


    Unfortunately, device names are not assigned in any particular order, and there
    is no guarantee that the same name will be used for the same drive. This can become
    a problem when you start to use two or more hard drives. The partition numbers
    never change, though, and they represent the exact order in which the partitions
    were created.


    The following screenshot shows that the USB flash drive has come up as the /dev/sda
    device, and it has 7803 MB with a FAT32 file system:


    ```

    root@raspberrypi:~# fdisk -l


    Disk /dev/mmcblk0: 3904 MB, 3904897024 bytes

    4 heads, 16 sectors/track, 119168 cylinders, total 7626752 sectors

    Units = sectors of 1 * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/optimal): 512 bytes / 512 bytes

    Disk identifier: 0x000c7b31


    Device Boot      Start         End      Blocks   Id  System

    /dev/mmcblk0p1            8192      122879      57344   c  W95 FAT32 (LBA)

    /dev/mmcblk0p2          122880     7626751     3751936  83  Linux


    Disk /dev/sda: 7803 MB, 7803174912 bytes

    122 heads, 58 sectors/track, 2153 cylinders, total 15240576 sectors

    Units = sectors of 1 * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/optimal): 512 bytes / 512 bytes

    Disk identifier: 0xc3072e18


    Device Boot      Start         End      Blocks   Id  System

    /dev/sda1   *           8064    15240575     7616256   b  W95 FAT32

    ```


    ### Formatting a drive


    The Raspberry Pi is capable of reading and writing to NTFS, which Windows uses.
    It can also read/write HFS+, which is used by Macintosh. Both these methods are
    fine for the temporary attachment of removable media if you need to copy something
    quickly.


    The NTFS and HFS+ file systems are not native to Linux, and they take a lot of
    overhead to convert data between what Linux understands and what the other file
    systems understand. Some unexpected errors might occur and cause loss of data,
    which nobody wants!


    Ext4 is the preferred storage file system in Linux. Media mounted using this file
    system in Linux is really fast and reliable. There are ways to use it on Mac OS
    X and Windows, but this is not the goal of this chapter. You should commit to
    using the media as long-term storage that will stay connected to the Raspberry
    Pi.


    We first need to prepare hard drives by wiping them back to a clean state.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_83_0.png)


    > A word of warning is that this step will destroy all data on the target drive.


    This command will quickly remove everything from your hard drive, including partitions
    and boot sectors. Be sure to use the correct device name that you saw in fdisk.
    In this case, it is sda, but you need to double check this on your Raspberry Pi
    as it may be different. This can be done using the following command:


    ```

    sudo dd if=/dev/zero of=/dev/sda bs=512 count=1

    ```


    ### Creating an EXT4 partition


    We will create a new partition using fdisk. I want to use the entire drive and
    defaults that fdisk provides. You can use the m command in fdisk at any time for
    more help, as shown in the following command-line snippet:


    ```

    sudo fdisk /dev/sda

    n "new partition"

    <enter> "Uses p as the default"

    <enter> "Uses l as the default"

    <enter> "Uses default first sector"

    <enter> "Uses last sector available on drive"

    w "write partition data and exit"

    ```


    The last command that we will issue is used to create the EXT4 file system on
    the partition on sda1. The -L flag in the following command line provides the
    name of the partition. You can use any short name that you like:


    ```

    sudo mkfs.ext4 /dev/sda1 -L nas001

    ```


    ### Mounting the drives


    Linux has a directory called /mnt where you can create mount points for various
    hard drives or other network connections. There is also a directory called /media
    where you can mount drives. This is a convention used throughout Linux so that
    people have an idea of how to organize all these files. These are just normal
    directories; and if you wish, you can create your own directory called /nas, and
    you can mount all your drives associated with Network Attached Storage (NAS) there.


    I will create a directory called /nas and mount my USB drive here. Then, I will
    create a subdirectory called USB001. We will also create directories that we will
    use for sharing, as shown in the following command-line snippet:


    ```

    sudo mkdir /nas

    cd /nas

    sudo mkdir USB001

    ```


    ```

    sudo mount -t ext4 -v /dev/sda1 /nas/USB001/

    cd USB001

    sudo mkdir public

    sudo mkdir work

    ```


    ### Remounting a disk after reboot


    The quickest way to get your drives remounted after a reboot is to add a few lines
    to the fstab file, which controls the file system configuration and can be found
    at /etc/fstab.


    Simply add the following lines. The first part is the partition, and the latter
    part is the mount point. You need to adjust these into your hardware. The final
    options are used for automounting. Do not change these options:


    /dev/sda1 /media/USB001 auto noatime 0 0


    ### Accessing files


    We will go over several ways of allowing access to files on the Raspberry Pi,
    the network, and the Internet. You should choose the method that suits you best,
    as enabling more than one way makes it easier to compromise your system over the
    network.


    ### The FTP service


    The File Transfer Protocol specification was originally published in 1971, but
    we currently use a specification from 1985 that everybody should really start
    moving away from. FTP uses port 21.


    A much newer specification, known as Secure FTP (SFTP), supports the IPv6 and
    Secure Socket Layer (SSL) encryption. Installing FTP will just be a waste of time
    as OpenSSL (SSH) comes with built-in support and is enabled by default to use
    SFTP. SFTP generally uses port 22, which is the same port as SSH.


    You should create and use a separate user for the SFTP access. I will demonstrate
    how to connect to your Raspberry Pi with two popular clients using the root account
    for simplicity.

