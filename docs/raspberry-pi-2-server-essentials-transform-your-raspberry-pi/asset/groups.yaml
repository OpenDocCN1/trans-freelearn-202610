  - "[PAGE 75]\n\n# Installing PHP\n\nAs mentioned before, nginx is a proxy that handles\
    \ web requests extremely quickly, and to get PHP to work with nginx, we need to\
    \ install an interface called **FastCGI**. This will allow nginx to send requests\
    \ to PHP and receive and display the response. To help improve PHP performance,\
    \ we will also install a PHP extension called APC, which stands for **Alternative\
    \ PHP Cache**. It is much faster and uses fewer resources than the standard PHP\
    \ caching.\n\nAfter installing, PHP should be running, but we will restart it\
    \ to make sure all the extensions were loaded correctly:\n\n```\nsudo apt-get\
    \ install php5-fpm php-apc\nsudo service php5-fpm restart\n```\n\nCreate a new\
    \ directory under `/var/www/` called `PHP` with a subdirectory `web`. In the `web`\
    \ directory, we will create a new file called `index.php` and add the following\
    \ content:\n\n```\n<?php\n    phpinfo();\n?>\n```\n\nThis time we will run it\
    \ on a different port, as PHP has different requirements. We will bind the new\
    \ host to port 888. We will create a new server block; you can place it in the\
    \ existing configuration file or create a new `sites-available/php` file if you\
    \ wish:\n\n> Please avoid using port 8080, as it will be used for real-time streaming\
    \ later.\n> Note the `fastcgi_pass` setting that will be used for any other PHP\
    \ website.\n\n```\nserver {\n    listen 888;\n    root /var/www/php/web;\n   \
    \ index index.php;\n\n    location ~ \\.php$ {\n        fastcgi_pass unix:/var/run/php5-fpm.sock;\n\
    \        fastcgi_index index.php;\n        include fastcgi_params;\n    }\n}\n\
    ```"
