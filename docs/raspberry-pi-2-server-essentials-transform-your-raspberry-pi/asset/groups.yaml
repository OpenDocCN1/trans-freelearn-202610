    \ The next input asks you about your data folder. This is where you input the\
    \ directory that we created earlier and set the permission on.\n- 6. In the last\
    \ step, we need to input the database settings with the username, password, and\
    \ database that we created earlier. The user name is owncloud (not owncloud@localhost),\
    \ followed by the password you entered, and the table name of owncloud. Leave\
    \ the localhost as it is.\n- 7. Finally, we can click on Finish Setup. Then, ownCloud\
    \ will configure the database and test for any issues that may need to be resolved.\n\
    \nAfter several seconds, you will see the main dashboard presented with a welcome\
    \ to the ownCloud page, offering several apps to be downloaded and ways to connect\
    \ to ownCloud.\n\n## The admin configuration\n\nIf you have just logged in as\
    \ the admin to the dashboard, it is highly recommended to create a user that you\
    \ will be using for your daily cloud tasks:\n\n- 1. In the top-right corner, you\
    \ will see your admin username and a drop-down menu. Click on it, and then click\
    \ on **Users**.\n- 2. Before creating a user on this page, click on groups and\
    \ click on + **Add Group** to create a new user group, for example, **users**.\n\
    - 3. Now, you can simply type in your username and password; make sure the new\
    \ group is ticked, and click on **Create**:\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_150_0.png)\n\
    \nBy creating a new group, you can now better manage restrictions or options that\
    \ you would like to use for anybody under this or other new groups later on.\n\
    \nFor example, on this page, you can set quotas for each group.\n\n## The server\
    \ admin\n\nWhile still logged in as admin, click on the admin user name in the\
    \ top-right corner, and then click on **Admin**. You will land on the sharing\
    \ options page by default.\n\nOn this page, you may notice a few security and\
    \ set up warnings. If you see anything critical, you can endeavor to resolve the\
    \ issues by reading the documentation online.\n\nAs a standard, there is nothing\
    \ critical that needs to be changed here, but reading through the available options,\
    \ you may spot something you like or dislike and adjust it accordingly.\n\nThe\
    \ first option that allows you to tune for groups is **Restrict users to only\
    \ share with users in their groups**.\n"
  mdcn: "\n- 2. 安装完所有必需的软件包后，您可以创建一个新的网页文件夹，下载 ownCloud 的最新版本，并将其解压到名为 owncloud 的新文件夹中：\n\
    ```\nsudo mkdir -p /var/www/owncloud\ncd /var/www\nsudo wget https://download.owncloud.org/community/owncloud-8.1.3.tar.bz2\n\
    sudo tar -xvf owncloud-8.1.3.tar.bz2\nsudo chown -R www-data:www-data /var/www\n\
    ```\n- 3. 我们将生成一个自签名证书，但您可以从 https://letsencrypt.org 获取免费证书。自签名证书会在浏览器中显示错误消息，但在您继续后，您的所有流量仍将被加密：\n\
    ```\nsudo mkdir -p /etc/nginx/ssl\nsudo openssl req -x509 -nodes -days 36500 -newkey\
    \ rsa:2048 -keyout /etc/nginx/ssl/owncloud.key -out /etc/nginx/ssl/owncloud.crt\n\
    ```\n- 4. 在证书生成过程中，您将被要求输入各种其他信息。您可以将国家名称、州、地区名称、组织等留空，但对于通用名称，您必须输入您的动态 DNS 地址。\n\
    - 5. 我们现在将在 /etc/nginx/sites-available/owncloud 创建并编辑 nginx 配置文件。\n- 6. 如果您决定为\
    \ WWW 访问使用域名，则需要相应地调整 server_name 属性。您的 Raspberry Pi 的 DNS 名称和私有 IP 如下：\n```\n\
    server_name {domain.name.com},{pi's IP};\n```\n- 7. 为了简单起见，我只使用我的 Pi 的 IP 地址，而不是\
    \ DNS 的 IP 地址。\n\n第一个 server 块会强制将所有非 SSL 请求永久重定向到 SSL 配置的 server 块。\n\nSSL server\
    \ 块具有相当大的配置区域。您可以在代码包中找到文本版本。\n\n如果您运行了其他站点，则应注意 root 指令。如果您将 `/var/www/` 用作 root，那么只需在\
    \ URL 中添加 `/owncloud` 即可访问站点。如果您希望仅将 Raspberry Pi 用于 ownCloud，您可以将 root 更改为 `/var/www/owncloud/`，然后您就可以使用\
    \ IP 或 DNS 访问 ownCloud，而无需在 URL 中添加子文件夹。我已按多租户配置的推荐方式保留，这样您需要在 URL 中添加 `/owncloud`。您也可以选择设置一个锁定到\
    \ `/owncloud` 目录的子域名，这是一个不错的替代方案。您应在此决定一次，因为稍后更改可能会破坏 ownCloud：\n```\nserver {\n\
    \    listen 80;\n    server_name 192.168.1.21;\n    return 301 https://$server_name$request_uri;\
    \  # enforce https\n}\n\nserver {\n    listen 443 ssl;\n    server_name 192.168.1.21;\n\
    \    access_log /var/log/nginx/sitename.access.log;\n    error_log /var/log/nginx/sitename.error.log;\n\
    \n    ssl_certificate /etc/nginx/ssl/owncloud.crt;\n    ssl_certificate_key /etc/nginx/ssl/owncloud.key;\n\
    \n    # Path to the root of your installation\n    root /var/www/;\n    client_max_body_size\
    \ 10G; # set max upload size\n    fastcgi_buffers 64 4K;\n\n    # Some rewrite\
    \ rules, more to come later\n    rewrite ^/owncloud/caldav((/|$).*) $ /owncloud/remote.php/caldav$1\n\
    \    last;\n    rewrite ^/owncloud/carddav((/|$).*) $ /owncloud/remote.php/carddav$1\n\
    \    last;\n    rewrite ^/owncloud/webdav((/|$).*) $ /owncloud/remote.php/webdav$1\n\
    \    last;\n\n    # Protecting sensitive files from the evil outside world\n \
    \   location ~ ^/owncloud/(data|config|\\.ht|db_structure.xml|README) {\n    \
    \    deny all;\n    }\n    # Configure the root location with proper rewrite rules\n\
    \    location /owncloud/ {\nrewrite ^/owncloud/.well-known/host-meta /public.php?service=host-meta\
    \ last;\nrewrite ^/owncloud/.well-known/host-meta.json /public.php?service=host-meta-json\
    \ last;\nrewrite ^/owncloud/.well-known/carddav /remote.php/carddav/ redirect;\n\
    rewrite ^/owncloud/.well-known/caldav /remote.php/caldav/ redirect;\nrewrite ^/owncloud/apps/calendar/caldav.php\
    \ /remote.php/caldav/ last;\nrewrite ^/owncloud/apps/contacts/carddav.php /remote.php/carddav/\
    \ last;\nrewrite ^/owncloud/apps/([^\\*/])(/.*\\.(css|php))$ /index.php?app=$1&getfile=$2\
    \ last;\nrewrite ^(/owncloud/core/doc[^\\*/]+)$ $1/index.html;\ntry_files $uri\
    \ $uri/ index.php;\n}\nlocation ~ \\.php(?:$|/) {\n    fastcgi_split_path_info\
    \ ^(.+\\.php)(/.+)$;\n    include fastcgi_params;\n    fastcgi_param SCRIPT_FILENAME\
    \ $document_root$fastcgi_script_name;\n    fastcgi_param PATH_INFO $fastcgi_path_info;\n\
    \    fastcgi_param HTTPS on;\n    fastcgi_pass unix:/var/run/php5-fpm.sock;\n\
    }\n# Optional: set long EXPIRES header on static assets\nlocation ~* \\.(?:jpg|jpeg|gif|bmp|ico|png|css|js|swf)$\
    \ {\n    expires 30d;\n    # Optional: Don't log access to assets\n    access_log\
    \ off;\n}\n}\n```\n\n现在您已启用 ownCloud，如果您刚刚安装了 nginx，则已禁用默认配置：\n```\nsudo ln -s\
    \ /etc/nginx/sites-available/owncloud /etc/nginx/sites-enabled/owncloud\n```\n\
    ```\nsudo unlink /etc/nginx/sites-enabled/default\n```\n\n最后，我们需要重启所有服务以使新配置生效：\n\
    ```\nsudo service nginx restart\n```\n```\nsudo service php5-fpm restart\n```\n\
    \n## 权限\n\nownCloud 会将所有文件作为普通文件存储在目录中。它使用数据库对文件进行索引以提高查询速度。如果由于某种原因，您的 ownCloud\
    \ 停止正常运行，您仍然可以直接访问所有文件，而无需任何复杂的恢复程序。\n\nownCloud 在 www-data 下运行。为了解决文件权限问题，最简单的解决方案是将\
    \ www-data 添加到 pi 组中，然后创建一个应用了 www-data 所有者的子文件夹：\n```\nsudo usermod -a -G pi\
    \ www-data\n```\n\n以下两个命令要求您根据文件系统挂载的位置和方法添加目录目标。我们将创建一个新的子目录并将其所有权分配给 www-data。我们还需要为上传的文件创建一个临时目录：\n\
    ```\nsudo mkdir -p /mnt/{your mount point}/owncloud\nsudo chown -R www-data:www-data\
    \ /mnt/{your mount point}/owncloud\n```\n```\nsudo mkdir -p /mnt/{your mount point}/owncloud/tmp\n\
    sudo chown -R www-data:www-data /mnt/{your mount point}/owncloud/tmp\n```\n\n\
    ## 首次配置\n\n到目前为止，ownCloud 应用程序已全部预配置。最后一步，仅需执行一次，即使用浏览器运行逐步配置向导：\n\n- 1. 打开浏览器并输入您的\
    \ Raspberry Pi 的 IP 地址或 DNS 名称。\n- 2. 您将看到证书错误。根据您使用的浏览器，您可以将其证书添加到受信任列表，或单击按钮继续：\n\
    \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_149_0.png)\n\n- 3. 如果一切按计划进行，您将看到 ownCloud\
    \ 的初始配置屏幕。\n- 4. 输入管理员用户名和密码（请使用强密码，因为我们不应经常使用此账户）。这是能够创建新用户、更改配置等的用户。创建管理员后，我们将创建一个普通用户，您应从此开始使用。\n\
    - 5. 下一个输入会询问您的 data 文件夹。这是您输入我们之前创建并设置权限的目录的地方。\n- 6. 在最后一步，我们需要输入数据库设置，其中包括我们之前创建的用户名、密码和数据库。用户名是\
    \ owncloud（不是 owncloud@localhost），后面跟您输入的密码，以及 owncloud 的表名。保持 localhost 不变。\n\
    - 7. 最后，我们可以单击 Finish Setup。然后，ownCloud 将配置数据库并测试可能需要解决的任何问题。\n\n经过几秒钟，您将看到主仪表板，显示欢迎使用\
    \ ownCloud 页面，提供多个可下载的应用程序以及连接 ownCloud 的方式。\n\n## 管理员配置\n\n如果您刚刚以管理员身份登录到仪表板，强烈建议您创建一个用户，用于日常云任务：\n\
    \n- 1. 在右上角，您将看到您的管理员用户名和一个下拉菜单。单击它，然后单击 **用户**。\n- 2. 在此页面创建用户之前，单击 groups 并单击\
    \ + **添加组** 以创建新的用户组，例如 **用户**。\n- 3. 现在，您只需输入用户名和密码；确保已勾选新组，然后单击 **创建**：\n\n\
    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_150_0.png)\n\n通过创建新组，您现在可以更好地管理限制或选项，以便以后对该组或其他新组下的任何人使用。\n\
    \n例如，在此页面上，您可以为每个组设置配额。\n\n## 服务器管理员\n\n在仍以管理员身份登录的情况下，单击右上角的管理员用户名，然后单击 **管理员**。默认情况下，您将进入共享选项页面。\n\
    \n在此页面上，您可能会注意到一些安全和设置警告。如果看到任何关键问题，您可以通过阅读在线文档来尝试解决这些问题。\n\n作为标准，这里没有什么关键的内容需要更改，但阅读可用选项时，您可能会发现喜欢或不喜欢的内容并相应地进行调整。\n\
    \n第一个允许您为组进行调整的选项是 **限制用户仅与所在组的用户共享**。\n"
