    5. Insert the SD card into the Raspberry Pi. Plug in your HDMI or other video\
    \ cable with a compatible keyboard and power it up.\n6. The Pi will boot up and\
    \ present the list of operating systems; select **Raspbian**.\n7. If your display\
    \ is blank, try to press the numeric keys, as listed here, while the Pi is booted\
    \ up:\n   - 1: HDMI mode\n   - 2: HDMI safe mode\n   - 3: Composite PAL\n   -\
    \ 4: Composite NTSC\n\n## Understanding the design of the Raspberry Pi\n\nThe\
    \ Raspberry Pi has two identifiable microchips on the PCB:\n\n- In the center\
    \ is one that's clearly marked with a Broadcom logo and text starting with BCM283x,\
    \ which is the main processor\n- The Raspberry Pi 2 has its RAM chip at the back\
    \ of the PCB.\n- Near the USB port, there is a smaller chip that is either a USB\
    \ hub or a USB/LAN chip, depending on the model.\n\nBCM283x is actually a high-performance\
    \ GPU with an embedded ARM processor. It is a SoC (System on Chip), which means\
    \ that there is small amount of space for code that executes when it gets turned\
    \ on. This is known as Stage 1 in the boot process.\n\n## Boot process\n\nSome\
    \ network actions need to be performed during the boot process, and it is good\
    \ to understand the various stages in case you need to troubleshoot something.\
    \ The boot process is as follows:\n\n1. Stage 1 begins on the GPU and executes\
    \ the code SoC firmware, which starts to load Stage 2 code to the L2 cache.\n\
    2. Stage 2 reads `bootcode.bin` from the SD card. It initializes SDRAM (synchronous\
    \ dynamic random access memory) and loads Stage 3.\n3. Stage 3 is the `loader.bin`\
    \ file. This loads `start.elf`, which starts the GPU.\n4. During `start.elf`,\
    \ it prepares to load `kernel.img`.\n5. The kernel image then reads `config.txt`,\
    \ `cmdline.txt`, and `bcm283x.dtb`.\n6. If the `.dtb` file exists, it is loaded\
    \ at 0x100, and the kernel is loaded at 0x8000 in memory.\n7. The kernel image\
    \ is the first binary that runs on the ARM CPU, and it can be compiled with custom\
    \ support for specific hardware.\n8. The operating system starts to load.\n\n\
    All the source code in stages 1 to 3 are closed source and protected by Broadcom.\
    \ These closed source files are compiled and released by Broadcom only; you can\
    \ update them on your SD card by running a firmware upgrade in Raspbian, which\
    \ is covered later.\n\nThe `kernel.img` file connects the application to the hardware.\
    \ Any computer with an operating system has a kernel of some sort. In Linux, it\
    \ is possible to compile your own kernel, and it might be the first file that\
    \ you might want to amend yourself. This allows you to change the boot screen,\
    \ load custom drivers, or perform other tasks that you might need. This is an\
    \ advanced task and is not covered in this book.\n\n## Other capabilities\n\n\
    BCM283x also has dedicated audio hardware together with video encoding/decoding.\
    \ This allows the Raspberry Pi to playback HD (MPEG-4) content, such as videos,\
    \ or render games using OpenGL ES. You can buy additional encoder/decoder licenses\
    \ for extra functionality, such as MPEG-2, used in DVD video encoding and VC-1,\
    \ which is used by Microsoft's WMV formats. This is also used for Silverlight\
    \ live streaming.\n\nThe SD card is also directly interfaced by the Broadcom chip\
    \ using dedicated hardware inputs/outputs and interrupts.\n"
  mdcn: "\n## 有趣的外设\n\n你可能在你的小工具箱里有一些这些东西。希望阅读关于这些使用较少的设备的内容能激发一些创造性的想法：\n\n- **摇杆**：微软的\
    \ Xbox 360 手柄在使用 **xboxdrv** 时在 X 中像鼠标一样工作，该程序可以从软件包仓库安装。其他摇杆可能需要移植的驱动程序，可以在互联网论坛上找到。\n\
    - **USB 转 SATA**：你可以购买简单的 USB 转 SATA 控制器，使用专用电源为其供电，从而连接 SATA 硬盘。真正的乐趣始于使用基于硬件\
    \ RAID 的 USB 转 SATA 控制器，它们可以以各种配置串联使用，从而提供海量存储、高冗余或最大性能。\n- **CAN 总线**：CAN 总线是所有现代机动车使用的标准。它是一个标准端口，提供任何人都可以解读的强制性数据，例如油门值、气缸失火或空燃比。PEAK-System\
    \ 拥有多种与树莓派兼容的外设和软件。如果你能够访问制造商特定的代码，甚至可以用这些工具调整发动机映射。\n- **家庭自动化**：名为 TellStick\
    \ 的兼容设备作为树莓派的第三方家庭自动化设备运行良好，但作为高级 Linux 用户，你应该努力使用实时微控制器自行制作应用程序，例如 AlaMode 上的\
    \ Arduino，或非常便宜的 PICAXE 微控制器。\n- **USB 导弹发射器**：可在各种网站和商店获得，这是如果你需要向不明物体发射毛绒导弹的完美小工具！这纯粹是一个娱乐外设，但你也可以将其用于\
    \ DIY 项目。\n\n> 然而要小心，你能达到的最大吞吐速度受 USB 2.0 带宽的限制。理论上，这最大速度为 60 MBps，但由控制器上的所有设备共享，而不是每个端口。有关此内容的更多信息将在本书后面介绍。\n\
    \n> 调整非标准值可能会损坏你的 ECU 并使任何保修失效。\n\n- **指纹扫描仪：** Futronic 的指纹扫描仪与 Raspbian 配合良好，并且网上可以找到许多示例。它们是独立的可编程设备，通过\
    \ USB-UART 使用简单消息与 Pi 通信，并且随设备提供详尽的文档。\n- **气象站：** Sparkfun 销售一套相当完整的气象站，包括风向标、风速计和翻斗式雨量计。套件包含夹具和安装支架。你可以轻松且不花太多钱添加光照、温度和湿度传感器。挑战在于使用实时微控制器并构建自己的数据库来记录所有数据。但不用担心，网上有许多教程可以帮助你更进一步。\n\
    \n## 在树莓派上安装 Raspbian\n\nPi 上可以运行许多发行版。有些是特定的实时操作系统，例如 RISC OS，或主流操作系统，例如 Raspbian\
    \ 或 Archlinux。还有一些家庭媒体中心版本，例如 OpenElec 或 OSMC（以前称为 XBMC）。截至 2015 年 6 月，你还将能够安装\
    \ Windows 10 物联网。近期不预计会有 Android 支持。\n\n树莓派基金会建议你使用他们名为 NOOBS（New Out Of Box Software，即开箱即用软件）的镜像，其中包含经常更新的不同操作系统的列表。在本书中，我们将使用\
    \ Raspbian。它由基金会支持，并且在易用性方面具有最佳兼容性。Raspbian 基于 Debian，与许多其他 Linux 操作系统相似。安装 Raspbian\
    \ 的步骤如下：\n\n1. 对于 Windows 和 Macintosh 用户，树莓派基金会建议你使用来自 `http://www.sdcard.org/`\
    \ 的 SD Formatter。\n   对于 Windows，请执行以下步骤：\n   1. 安装 SD 卡格式化工具。\n   2. 在 **选项**\
    \ 菜单中将 **格式化大小调整** 选项设置为 **开启**。\n   3. 确保已选择正确的 SD 卡。\n   4. 点击 **格式化** 按钮。\n\
    \   对于 Macintosh，请执行以下步骤：\n   1. 安装 SD 卡格式化工具。\n   2. 选择 **覆盖格式化**。\n   3. 确保已选择正确的\
    \ SD 卡。\n   4. 点击 **格式化** 按钮。\n\n对于 Linux，请执行以下步骤：\n   1. 建议你在 Linux 中使用 GParted\
    \ 或 Parted 工具。\n   2. 将整个磁盘格式化为 FAT。\n\n2. 你应该从 http://www.raspberrypi.org/downloads/\
    \ 下载最新的 NOOBS 归档文件。\n3. 解压归档文件。\n4. 将提取的文件复制到格式化的 SD 卡上。\n5. 将 SD 卡插入树莓派。插入 HDMI\
    \ 或其他视频线缆，连接兼容的键盘并通电。\n6. Pi 将启动并显示操作系统列表；选择 **Raspbian**。\n7. 如果你的显示器空白，请在 Pi\
    \ 启动时尝试按此处列出的数字键：\n   - 1：HDMI 模式\n   - 2：HDMI 安全模式\n   - 3：复合 PAL\n   - 4：复合\
    \ NTSC\n\n## 了解树莓派的设计\n\n树莓派的 PCB 上有两个可识别的微芯片：\n\n- 中央有一个芯片，上面清楚地标有 Broadcom 标志和以\
    \ BCM283x 开头的文字，这是主处理器\n- 树莓派 2 的 RAM 芯片位于 PCB 背面。\n- 靠近 USB 端口处有一个较小的芯片，具体取决于型号，它是\
    \ USB 集线器或 USB/LAN 芯片。\n\nBCM283x 实际上是一个高性能 GPU，内置 ARM 处理器。它是一个 SoC（片上系统），这意味着在它打开时执行的代码有少量空间。这在启动过程中被称为第\
    \ 1 阶段。\n\n## 启动过程\n\n启动过程中需要执行一些网络操作，了解各个阶段是有益的，以防需要排查问题。启动过程如下：\n\n1. 第 1 阶段在\
    \ GPU 上开始并执行 SoC 固件代码，该代码开始将第 2 阶段代码加载到 L2 缓存中。\n2. 第 2 阶段从 SD 卡读取 `bootcode.bin`。它初始化\
    \ SDRAM（同步动态随机存取存储器）并加载第 3 阶段。\n3. 第 3 阶段是 `loader.bin` 文件。它加载 `start.elf`，从而启动\
    \ GPU。\n4. 在 `start.elf` 期间，它准备加载 `kernel.img`。\n5. 然后内核映像读取 `config.txt`、`cmdline.txt`\
    \ 和 `bcm283x.dtb`。\n6. 如果 `.dtb` 文件存在，它将在 0x100 处加载，而内核将在内存中 0x8000 处加载。\n7. 内核映像是在\
    \ ARM CPU 上运行的第一个二进制文件，并且可以编译为特定硬件提供自定义支持。\n8. 操作系统开始加载。\n\n第 1 到第 3 阶段的所有源代码均为闭源并受\
    \ Broadcom 保护。这些闭源文件仅由 Broadcom 编译和发布；你可以通过在 Raspbian 中运行固件升级来更新 SD 卡上的这些文件，这将在后面介绍。\n\
    \n`kernel.img` 文件将应用程序连接到硬件。任何具有操作系统的计算机都有某种内核。在 Linux 中，可以编译自己的内核，这可能是你想要自行修改的第一个文件。这允许你更改启动画面、加载自定义驱动程序或执行可能需要的其他任务。这是一项高级任务，本书不涵盖。\n\
    \n## 其他功能\n\nBCM283x 还具有专用音频硬件以及视频编码/解码功能。这使树莓派能够播放高清（MPEG-4）内容，例如视频，或使用 OpenGL\
    \ ES 渲染游戏。你可以购买额外的编码器/解码器许可证以获得额外功能，例如用于 DVD 视频编码的 MPEG-2 和用于微软 WMV 格式的 VC-1。这也用于\
    \ Silverlight 直播。\n\nSD 卡也由 Broadcom 芯片使用专用硬件输入/输出和中断直接接口。\n"
