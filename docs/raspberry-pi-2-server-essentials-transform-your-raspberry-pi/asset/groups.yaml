    \ Raspberry Pi 入门\n\n连接到网络应该像插入一根电缆一样简单。问题是，在连接到互联网或本地网络后，我们可以在 Raspberry Pi 上做什么？这就是为什么必须了解\
    \ Raspberry Pi 的硬件前提和功能，以便您的想法在理论上是可实现的。同样，深入了解您的硬件将使本书后面处理故障排除问题变得容易得多。\n\n与\
    \ Raspberry Pi 相关的最常见问题与电源有关。这些问题可能导致其重新启动、出现意外行为，或如果您连接了外部显示器，在启动过程中可能显示彩虹屏。\n\
    \n本章全部关于识别您正在使用或可能与之一起使用的 Raspberry Pi 及其外设。您应该了解有关 Raspberry Pi 的两个主要信息：型号和版本。\n\
    \n### 硬件要求\n\n本书假设您使用的是 Raspberry Pi 2，型号 B。\n\nRaspberry Pi 2 与其前身大部分向后兼容。每当出现兼容性问题时，都会明确告知用户，如果可能，会提供替代解决方案。\n\
    \nRaspberry Pi 的最新版本在最基本层面上只需要电源和 Micro SD 卡即可运行。为了使初始配置更轻松，建议您还配备 HDMI 电缆、带 HDMI\
    \ 输入的宽屏显示器或电视、以太网电缆以及 USB 键盘。\n\n下表描述了各种型号之间的主要差异：\n\n| 型号 | 第二代 Model B | Model\
    \ B+ | Model A+ |\n|---|---|---|---|\n| SoC | BCM2836 | BCM2835 |  |\n| CPU |\
    \ 900 MHz Quad Core ARMv7 | 700 MHz single core ARMv6 |  |\n| GPU | VideoCore\
    \ IV @ 250Mhz / OpenGL ES 2.0 / H.264/MPEG-4 AVC | VideoCore IV @ 250Mhz / OpenGL\
    \ ES 2.0 / H.264/MPEG-4 AVC | VideoCore IV @ 250Mhz / OpenGL ES 2.0 / H.264/MPEG-4\
    \ AVC |\n| SDRAM | 1 GB | 512 MB | 256 MB |\n| USB | 4 | 2 | 1 |\n| 音频输入 | 无直接输入，两块修订版板通过\
    \ I2S，均使用 USB | 无直接输入，两块修订版板通过 I2S，均使用 USB | 无直接输入，两块修订版板通过 I2S，均使用 USB |\n| 网络\
    \ | 10/100 Mbit/s | 10/100 Mbit/s | None |\n| GPIO | 17 | 17 | 17 |\n| 接口 | 40\
    \ pins | 26 pins | 26 pins |\n| 功耗 | 800 mA (4.0 W) | 800 mA (4.0 W) | 200 mA\
    \ (1 W) |\n| SD 卡 | Micro SD slot | Micro SD slot | Micro SD slot |\n\n随着 Raspberry\
    \ Pi 的最新型号，大多数外设应可即插即用，因为这些版本已升级为专用电源电路，以处理峰值负载，同时降低整体功耗。只有 plus 型号才具有此新电路，而所有旧版本的\
    \ Raspberry Pi 可能因电路效率低下而出现电源问题。最节能的 Raspberry Pi 是 Model A+，通常使用电池供电。我们将在本书后面的章节讨论使用电池为\
    \ Raspberry Pi 供电。\n\n### 电源\n\nRaspberry Pi 2 理想情况下应使用 2 安培 USB 电源供电，如果您计划将外设连接到\
    \ USB 端口。家中最常见的电源是 1 安培电源，通常随智能手机、平板电脑或迷你电脑提供。这些充电器通常由优质组件制成，可以轻松处理额外电力、电力峰值，并产生干净的直流电源，这对于\
    \ Wi-Fi 或串行外设非常重要。\n\n您还应注意使用的 USB 电缆，因为有些电缆生产廉价，内部铜线非常细，在需要时难以提供 1 安培或更多的电流。\n"
