    SD 卡应仅用作安装在其上的操作系统和应用程序的主分区。将 SD 卡用于频繁更改的数据（如数据库）并不是一个好主意，因为它会比预期更快地降低卡的使用寿命。相反，我们应使用外部存储设备，如硬盘或网络附加存储（NAS）来处理频繁更改的数据，同时也有助于存储大量媒体。


    本书假定您至少使用 8 GB 的 SD 卡。


    ## Extra peripherals


    Raspberry Pi 被品牌化为一台计算机，我们期望可以连接各种不同的设备。Raspbian 基于 Debian，并且为 Raspbian 移植了绝大多数驱动程序和软件付出了巨大的努力。你可能有一些旧的
    USB 外设，比如一个游戏手柄。如果你在其他任何 Linux 平台上能找到驱动程序，就应该能够让它在 Raspbian 上工作。将其插入，使用 `lsusb`
    命令行实用程序，并检查是否已被检测到。如果你凭借自己的知识成功让它工作，你应该在论坛上分享这些知识以造福其他用户。


    ## Essential peripherals


    你应该考虑购买这些外设并专门用于你的 Raspberry Pi。它们将使设置一切变得更容易，并且甚至可用于长期用途：


    - **Wireless USB network adapters**: 在撰写本书时，当前的 Raspbian 镜像支持多种无线适配器，无需安装任何额外驱动程序。许多迷你、纳米或微型版本可以直接从
    Pi 的 USB 端口运行，不需要带电 USB 集线器。

    - **USB hubs**: 因为某些版本的 Raspberry Pi 仅限于两个 USB 端口，所以拥有一个兼容的带电 USB 集线器是明智的。带电是关键，因为这将允许你同时插入任何
    USB 设备或多个设备，而不会影响 Pi 的供电稳定性。在撰写本文时，Raspbian 尚未完全兼容三个 USB 集线器。

    - **Keyboards and mice**: 大多数有线键盘和鼠标可以直接从 Raspberry Pi USB 端口运行。许多蓝牙键盘和鼠标也可以直接从
    Pi 的 USB 端口工作，但需要使用有线键盘进行初始设置。一些无线键盘，例如 Microsoft 3000 系列，无需任何配置，因为 USB  dongle
    模拟了 PS/2 有线键盘，可以在启动时直接使用，无需额外配置。


    > 你可以访问 http://elinux.org/RPi_VerifiedPeripherals 获取兼容外设的最新列表。


    ## Useful peripherals


    随着你对 Raspberry Pi 越来越熟悉，你会为你的项目想出新的、更大的想法。有了这些想法，你可能需要一些更有用的设备来帮助你。


    ## Internet 3G dongles


    你可以使用 3G 加密狗连接到互联网。这些设备需要大量电力，并且需要从带电集线器运行才能全速工作。它们是在你所在国家最偏远的地方也能轻松将 Raspberry
    Pi 连接到互联网的绝佳方式。只要你有基本的语音信号，你就应该始终能够使用 GPRS（单通道 57.5 kbps 或双通道 115 kbps），这足以发送大量的日志文本数据。一些国家提供免费短信，这也可以用来收发最少量的数据。如果你计划运行服务器，建议你改用连接到
    ADSL/DSL 连接的 LAN 或 Wi-Fi。


    ## Audio recording


    Raspberry Pi 拥有自己的音频输出硬件，能够通过 HDMI 或通过 3.5 毫米插孔的模拟音频为你提供高清音质。


    你可能会遇到想要从线路输入或麦克风录制音频的情况；你可以使用任何 USB 1.1 或 USB 2.0 声音采集设备来完成此操作。


    ## Other media add-ons


    - **IR receivers**: 红外（IR）接收器是使用传统遥控器控制 Raspberry Pi 的绝佳方式。FLIRC USB IR 遥控 dongle
    是你开始这样做的绝佳方式。

    - **TV and radio receivers**: 这是将你的 Raspberry Pi 变成完整 DVR 系统的终极方式。从 HD 卫星或数字电视录制、播放或暂停直播电视。你也可以收听你喜欢的广播频道。

    - **Webcams**: Raspberry Pi 有一个专用的 HD 摄像头模块端口。拥有其中一个摄像头是一种真正的享受，最新版本的 Raspbian
    支持 UV4L（Video for Linux）。多种 USB 网络摄像头也受支持并支持 UV4L。曾经是一项相当复杂的任务，现在变得容易多了。

    - **Multicard readers**: 如果你使用各种卡类型，这些会很有帮助。通用类型的支持有限，但 USB 3.0 USRobotics 一体式读卡器工作得非常好，你可以同时挂载全部六张卡。

    - **AlaMode**: WyoLum 是一家初创企业，创建了适用于各种应用的有用附加组件。具体来说，AlaMode 是一款 Arduino 兼容板，带有实时时钟和
    microSD 插槽，放置在 Raspberry Pi 之上。你可以使用 Pi 的专用 UART（通用异步收发传输器）与 Arduino 通信，并且它可以从
    Pi 的电源运行。如果你喜欢电子项目并且已经熟悉 Arduino，这值得一看。你甚至可以用它来刷新其他 Arduino 兼容芯片或上传固件使其独立运行！

    - **HDMI to VGA**: 如果你使用较旧或备用的仅支持 VGA 的显示器、电视或 LCD 屏幕，你可以从你喜欢的在线拍卖网站或电子商店购买一条内置
    HDMI 转 VGA 转换器。你必须确保购买主动转换器，其价格略高于被动转换器。主动意味着它包含一个微控制器，使用 HDMI 端口的电力将数字信号转换为 VGA
    标准。Raspberry Pi 能够为这种类型的设备供电。

    '
