    \nIf you have checked out the configuration pages, you can log out as admin and\
    \ log in as the user you have created for yourself using the Web GUI.\n\nFor computers\
    \ and devices running on your local network, you can install the client applications\
    \ to your desktop or mobile computer and use your internal IP or Pi's DNS.\n\n\
    ## The World Wide Access\n\nIf you have decided to use ownCloud on WWW using a\
    \ dynamic DNS service, the first thing is to check whether it is configured properly.\
    \ An easy way to do this is to download the client application onto your smart\
    \ phone or 3G-enabled tablet.\n\nInstall the application, and then switch off\
    \ Wi-Fi to get on to a mobile network, such as 3G. Not all routers support the\
    \ loopback DNS lookup, which means that trying to access your IP from your IP\
    \ may fail, but using an external network will verify that your ports have been\
    \ forwarded properly.\n\nStart the application and enter your details on the login\
    \ screen. The client application will do a quick connectivity test and inform\
    \ you about the state.\n\nIf you have logged in, you can try and turn your Wi-Fi\
    \ back on and see if the client will carry on as normal.\n\n## Summary\n\nThe\
    \ Raspberry Pi 2 can now be your solution to going independent on cloud storage.\
    \ As long as you have some redundancy setup on your storage media, you will be\
    \ able to mostly disconnect from the big corporate giants and gain full control\
    \ over your data again.\n\nIn the next chapter, we will look at using some of\
    \ the server-side applications, such as databases and nginx, to work with storing\
    \ GPIO data to monitor the weather.\n\n## 12 The Internet of Things – Sensors\
    \ in the Cloud\n\nNow that you have learned the essentials of running software\
    \ applications on your Raspberry Pi 2, it is time to apply your newly acquired\
    \ knowledge. This chapter will be about Operating System agnostic language programming.\n\
    \nYour mission, if you wish to accept it, is to find your favorite flavor of Operating\
    \ System and programming language while I help you build a foundation on the electrical\
    \ prototyping.\n\nIn this chapter, we will focus on the following topics:\n\n\
    - Understanding power requirements and selecting correct cables\n- Working with\
    \ transistors\n- Getting to know Integrated Circuits (IC) and their purpose\n\
    - Windows IoT, events, and real-time systems\n- Working with the Cloud for the\
    \ IoT integration\n\nThese topics will expand your basic electronics knowledge\
    \ and show you good prototyping practices that can be used on any embedded platform,\
    \ such as your Raspberry Pi 2.\n\nUltimate decisions on the software completely\
    \ depend on your own personal preferences. By doing this, you will gain confidence\
    \ in problem solving and appreciate the vast amount of tools and resources available\
    \ on the Internet.\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_156_0.png)\n\n\
    If you ever get stuck on a software problem, the best solution is to take a 90-minute\
    \ break away from your computer, or go to bed and come back to it the next day.\
    \ If it seems like you are stuck on a particular software problem for days, consider\
    \ asking your question differently. Do not get hung up on one particular way,\
    \ as your problem has, most probably, already been solved, and there is already\
    \ a great solution to it out there.\n\n## What is IoT?\n\nThe Internet of Things\
    \ are *things* with sensors that are embedded with electronics and software. The\
    \ things are connected to a network, most likely the Internet.\n\nThe Internet\
    \ of Things started with machine-to-machine devices, such as alarm systems or\
    \ GPS trackers, and slowly expanded to home convenience gadgets, such as power\
    \ grid monitoring tools or some form of home automation.\n\n> \"Experts estimate\
    \ that the IoT will consist of almost 50 billion objects by 2020.\"\n> \n> – Wikipedia\n\
    \nTo build a successful IoT device, you will need to learn about software, the\
    \ essentials of which are covered in this book. You also need to learn about electronics,\
    \ which will also be covered in this chapter.\n\n## Ohm's law\n\nOhm's law is\
    \ a fundamental concept to try and understand before you venture into the prototyping\
    \ world. One of the main reasons Ohm's law is so widely misunderstood is because\
    \ it has various equations that originate from a single, mathematical equation.\n\
    \nYou can find more information about this diagram and Ohm's law in *Chapter 9,\
    \ Running Your Pi from a Battery's Power Source*. I have included this diagram\
    \ here for quick reference as I will demonstrate how to use some of the provided\
    \ equations:\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_157_0.png)\n\n## How\
    \ much power?\n\nIn Ohm's law, power (W) is known as watts. Understanding how\
    \ to calculate watts is pretty much the most important question that you should\
    \ be able to answer easily.\n\nFor example, what size cable do I need?\n\n- Cables\
    \ are rated at how many amps they can carry. If you know how many amps you require,\
    \ then you know which cable to use.\n\n> If you select an incorrect cable size,\
    \ this usually results in electrical fires, as friction will heat these cables\
    \ up until they melt and eventually ignite.\n\nTo work out how many watts (W)\
    \ a device uses, you will typically multiply volts (E) by amps (I).\n\n> Watts\
    \ = Volts x Amps (W = EI)\n\n- 5 volts x 1 amp = 5 watts (such as the Raspberry\
    \ Pi)\n- If you have a device that requires 60 watts and is rated for 240 volts,\
    \ then you can work out these amps by dividing watts by volts.\n\n> Amps = Watts\
    \ / Volts (I = W/E)\n\n- 60 watts / 240 volts = 0.25 amps (this is a light bulb)\n\
    - Once you know how many amps you need to transfer, you can use an American Wire\
    \ Gauge (AWG) table to check the size of cable that you will require over the\
    \ distance needed:\n\nAmerican Wire Gauge (AWG)\n| Length (feet) | Length (meters)\
    \ | 5 | 10 | 15 | 20 | 25 | 30 | 40 | 50 | 60 | 70 |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n\
    | 3 | 1 | 18 | 18 | 18 | 18 | 16 | 16 | 16 | 12 | 12 | 12 |\n| 15 | 4 | 16 | 12\
    \ | 10 | 10 | 8 | 8 | 6 | 6 | 4 | 4 |\n| 20 | 6 | 14 | 12 | 10 | 8 | 8 | 6 | 6\
    \ | 4 | 4 | 4 |\n| 25 | 7 | 14 | 10 | 8 | 8 | 6 | 6 | 4 | 4 | 2 | 2 |\n| 30 |\
    \ 9 | 12 | 10 | 8 | 6 | 6 | 4 | 4 | 2 | 2 | 2 |\n| 40 | 12 | 12 | 8 | 6 | 6 |\
    \ 4 | 4 | 2 | 2 | 1 | 1/0 |\n| 50 | 15 | 10 | 8 | 6 | 4 | 4 | 2 | 2 | 1 | 1/0\
    \ | 1/0 |\n| 60 | 18 | 10 | 6 | 6 | 4 | 2 | 2 | 1 | 1/0 | 2/0 | 2/0 |\n| 70 |\
    \ 21 | 10 | 6 | 4 | 2 | 2 | 2 | 1/0 | 2/0 | 2/0 | 3/0 |\n| 80 | 24 | 8 | 6 | 4\
    \ | 2 | 2 | 1 | 1/0 | 2/0 | 3/0 | 3/0 |\n| 90 | 27 | 8 | 4 | 4 | 2 | 1 | 1/0 |\
    \ 2/0 | 3/0 | 3/0 | 4/0 |\n\n> It is always recommended to go a size lower (thicker\
    \ cable) if you are close to the limit of the cable. This is generally within\
    \ 10% of the capacity.\n\nHere is an illustration of how the AWG size works and\
    \ a conversion to metric millimeters for radius and millimeters squared for the\
    \ area:\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_158_0.png)\n"
  mdcn: "\n当发布更新时，您将重新访问此页面以启用更新模式，并创建配置备份。\n\n您可以使用左侧的菜单跳转到页面的各个部分。\n\n## 安装应用\n\n\
    通过 WebGUI 以管理员身份登录时，您可以点击左上角的链接，该链接位于 ownCloud 图标旁边。下拉菜单将会出现，您会看到一个添加应用的按钮：\n\n\
    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_151_0.png)\n\n免费版提供基本的文件支持和一些不错的附加功能。企业版提供对\
    \ **Calendar**、联系人管理和同步的官方支持。\n\n在此页面上，您将看到已启用的官方应用列表，例如图片或 PDF 查看器。还有一些应用处于禁用状态；要查看它们，请点击右侧的\
    \ **Not Enabled** 菜单项。\n\n不过无需担心应用数量不足，因为 ownCloud 设计为可扩展的。您可以在 https://apps.owncloud.com\
    \ 免费安装大量用户制作的应用。\n\n在应用页面，点击左下角的齿轮图标，并启用 **Experimental Apps** 以允许安装第三方应用。\n\n\
    如果您在查看或启动下载的应用时遇到任何问题，可能需要将您创建的文件夹的所有者设置为 **www-data**。\n\n## 日历\n\n要在 ownCloud\
    \ 上启用日历功能，我们将安装一款评分很高的应用，名为 Calendar Plus：\n\n- 1. 在 `https://apps.owncloud.com`\
    \ 网站上搜索此应用并下载它。\n- 2. 将 zip 文件解压到名为 calendar plus 的目录中。\n- 3. 要安装应用，我们需要将解压后的目录上传到位于\
    \ `/var/www/owncloud/apps` 的 `/apps` 目录。使用 Filezilla 通过 SFTP 连接到您的 Raspberry Pi，并将目录上传到\
    \ apps 目录。\n- 4. 在 WebGUI 的 **Apps** 页面上，点击 **Not Enabled** 并在页面底部找到 **Calendar+**。点击\
    \ **Enable**：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_152_0.png)\n\n## 其他应用\n\
    \n`https://apps.owncloud.com` 网站拥有大量各种应用可供选择，您可以以相同的方式安装它们，除非作者在应用描述中提供了额外步骤。\n\
    \n## 日常功能\n\n如果您已查看配置页面，您可以注销管理员账号，并使用 Web GUI 以您为自己创建的用户身份登录。\n\n对于在本地网络上运行的计算机和设备，您可以将客户端应用程序安装到桌面或移动计算机上，并使用内部\
    \ IP 或 Pi 的 DNS。\n\n## 全球访问\n\n如果您决定使用动态 DNS 服务在 WWW 上使用 ownCloud，第一件事是检查其是否配置正确。一种简单的方法是将客户端应用程序下载到您的智能手机或支持\
    \ 3G 的平板电脑上。\n\n安装应用程序，然后关闭 Wi-Fi 以接入移动网络，例如 3G。并非所有路由器都支持回环 DNS 查找，这意味着尝试从您的\
    \ IP 访问您的 IP 可能会失败，但使用外部网络可以验证您的端口是否已正确转发。\n\n启动应用程序并在登录屏幕上输入您的详细信息。客户端应用程序将进行快速连接测试并告知您状态。\n\
    \n如果您已登录，可以尝试重新打开 Wi-Fi，看看客户端是否会正常继续运行。\n\n## 摘要\n\nRaspberry Pi 2 现在可以成为您实现云存储独立的解决方案。只要在存储介质上设置了一些冗余，您就可以基本摆脱大型企业巨头，重新完全控制您的数据。\n\
    \n在下一章中，我们将研究使用一些服务器端应用程序，例如数据库和 nginx，来处理存储 GPIO 数据以监测天气。\n\n## 12 物联网 – 云中的传感器\n\
    \n现在您已经学习了在 Raspberry Pi 2 上运行软件应用程序的基础知识，是时候应用您新获得的知识了。本章将介绍与操作系统无关的语言编程。\n\n\
    如果您愿意接受任务，请在我在电气原型制作方面帮助您建立基础的同时，找到您最喜欢的操作系统和编程语言。\n\n在本章中，我们将重点关注以下主题：\n\n- 了解功耗需求并选择正确的电缆\n\
    - 使用晶体管\n- 了解集成电路（IC）及其用途\n- Windows IoT、事件和实时系统\n- 为物联网集成而使用云\n\n这些主题将扩展您基本的电子知识，并展示可在任何嵌入式平台上使用的良好原型制作实践，例如您的\
    \ Raspberry Pi 2。\n\n软件的最终决定完全取决于您个人的偏好。通过这样做，您将增强解决问题的信心，并欣赏互联网上庞大的工具和资源。\n\n\
    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_156_0.png)\n\n如果您在软件问题上遇到困难，最好的解决方案是离开电脑休息\
    \ 90 分钟，或去睡觉，第二天再回来处理。如果您似乎在某个特定的软件问题上卡了好几天，请考虑换一种方式提问。不要执着于一种特定方法，因为您的问题很可能已经被解决，并且已经有很好的解决方案存在。\n\
    \n## 什么是物联网？\n\n物联网是 *things*，它们配备传感器并嵌入电子设备和软件。这些事物连接到网络，很可能是互联网。\n\n物联网始于机器对机器设备，例如报警系统或\
    \ GPS 追踪器，并逐渐扩展到家庭便利小工具，例如电网监控工具或某种形式的家庭自动化。\n\n> “专家估计，到 2020 年物联网将包含近 500 亿个物体。”\n\
    > \n> – Wikipedia\n\n要构建成功的物联网设备，您需要学习软件，其基础知识在本书中有所介绍。您还需要学习电子知识，这也将在本章中介绍。\n\
    \n## 欧姆定律\n\n欧姆定律是在您进入原型制作领域之前需要尝试理解的基本概念。欧姆定律被广泛误解的主要原因之一是它有各种方程，这些方程源自一个单一的数学方程。\n\
    \n您可以在 *Chapter 9, Running Your Pi from a Battery's Power Source* 中找到有关此图表和欧姆定律的更多信息。我在此包含此图表以供快速参考，因为我将演示如何使用提供的一些方程：\n\
    \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_157_0.png)\n\n## 功率有多大？\n\n在欧姆定律中，功率（W）称为瓦特。理解如何计算瓦特几乎是最重要的问题，您应该能够轻松回答。\n\
    \n例如，我需要多大的电缆？\n\n- 电缆的额定值为可承载多少安培。如果您知道所需的安培数，那么您就知道使用哪种电缆。\n\n> 如果您选择了错误的电缆尺寸，通常会导致电气火灾，因为摩擦会使这些电缆发热直至熔化并最终点燃。\n\
    \n要计算设备使用多少瓦特（W），通常将伏特（E）乘以安培（I）。\n\n> 瓦特 = 伏特 x 安培 (W = EI)\n\n- 5 伏特 x 1 安培\
    \ = 5 瓦特（例如 Raspberry Pi）\n- 如果您有一个需要 60 瓦且额定电压为 240 伏的设备，那么您可以通过将瓦特除以伏特来计算这些安培。\n\
    \n> 安培 = 瓦特 / 伏特 (I = W/E)\n\n- 60 瓦 / 240 伏 = 0.25 安培（这是一个灯泡）\n- 一旦您知道需要传输多少安培，您可以使用美国线规（AWG）表来检查在所需距离上所需的电缆尺寸：\n\
    \n美国线规 (AWG)\n| 长度（英尺） | 长度（米） | 5 | 10 | 15 | 20 | 25 | 30 | 40 | 50 | 60 | 70\
    \ |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 3 | 1 | 18 | 18 | 18\
    \ | 18 | 16 | 16 | 16 | 12 | 12 | 12 |\n| 15 | 4 | 16 | 12 | 10 | 10 | 8 | 8 |\
    \ 6 | 6 | 4 | 4 |\n| 20 | 6 | 14 | 12 | 10 | 8 | 8 | 6 | 6 | 4 | 4 | 4 |\n| 25\
    \ | 7 | 14 | 10 | 8 | 8 | 6 | 6 | 4 | 4 | 2 | 2 |\n| 30 | 9 | 12 | 10 | 8 | 6\
    \ | 6 | 4 | 4 | 2 | 2 | 2 |\n| 40 | 12 | 12 | 8 | 6 | 6 | 4 | 4 | 2 | 2 | 1 |\
    \ 1/0 |\n| 50 | 15 | 10 | 8 | 6 | 4 | 4 | 2 | 2 | 1 | 1/0 | 1/0 |\n| 60 | 18 |\
    \ 10 | 6 | 6 | 4 | 2 | 2 | 1 | 1/0 | 2/0 | 2/0 |\n| 70 | 21 | 10 | 6 | 4 | 2 |\
    \ 2 | 2 | 1/0 | 2/0 | 2/0 | 3/0 |\n| 80 | 24 | 8 | 6 | 4 | 2 | 2 | 1 | 1/0 | 2/0\
    \ | 3/0 | 3/0 |\n| 90 | 27 | 8 | 4 | 4 | 2 | 1 | 1/0 | 2/0 | 3/0 | 3/0 | 4/0 |\n\
    \n> 通常建议如果接近电缆的极限，则选择更小一号（更粗的电缆）。这通常在容量的 10% 以内。\n\n这里有一幅说明 AWG 尺寸如何工作以及半径和面积的公制毫米转换的插图：\n\
    \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_158_0.png)\n"
