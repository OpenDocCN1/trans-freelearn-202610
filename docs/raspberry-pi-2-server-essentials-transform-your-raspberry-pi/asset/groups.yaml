  - "[PAGE 98]\n\n# Freeciv\n\n> \"This is a free and open source empire-building\
    \ strategy game inspired by the history of human civilization.\"\n> \n> – Freeciv\n\
    \nThe game reminds me of Civilization by Sid Meier. Its user interface is very\
    \ similar, but once you start playing the game, you will notice a lot more features\
    \ and possibilities that are built into the game.\n\n# Installing Freeciv\n\n\
    We can install the server from the Raspberry repository:\n\n```\nsudo apt-get\
    \ -t jessie install freeciv-server\n```\n\nSeveral libraries will be installed\
    \ during this time. You may be presented with a blue screen, which asks you if\
    \ you want to restart some service in order to complete the package installation.\
    \ It is safe to agree with this. This can take several minutes to complete.\n\n\
    # Configuring Freeciv\n\nThe default settings are good enough for you to play\
    \ straight away. You can start the server by typing the following in the console:\n\
    \n```\nfreeciv-server\n```\n\nThe server should not be run with the sudo command\
    \ or as the root user but as a normal unprivileged user.\n\nThis will actually\
    \ present you with another console provided by the freeciv server. You can adjust\
    \ settings of the server by typing in commands. You can try to type in help and\
    \ press Enter.\n\nIf you would like to publish your server to the online community,\
    \ you need to forward port 5555 to the Raspberry Pi through your router, and then\
    \ start the server with the extra command line called --meta."
