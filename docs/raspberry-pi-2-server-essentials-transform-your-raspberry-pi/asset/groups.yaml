    \ by typing in commands. You can try to type in help and press Enter.\n\nIf you\
    \ would like to publish your server to the online community, you need to forward\
    \ port 5555 to the Raspberry Pi through your router, and then start the server\
    \ with the extra command line called --meta.\n\n## Playing Freeciv\n\nYou can\
    \ now install and run `freeciv` on your computer. If you are running the same\
