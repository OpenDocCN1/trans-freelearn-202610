    # 7


    # Streaming Live HD Video


    In this chapter, we are going to use the official HD camera module designed by
    the Raspberry Pi Foundation. Thanks to the new quad core processor and the author
    of UV4L, we can now stream a video directly into a browser with low latency.


    Before starting this chapter, you should have the camera module installed and
    enabled as described with the instructions included with the camera module. It
    is recommended to have 256 MB GPU RAM allocated.


    This chapter is only suitable for the Raspberry Pi 2 or newer with the quad processor
    or better.


    # Installing UV4L


    UV4L is a userspace webcam driver specifically designed for the Raspberry Pi.
    It also includes some other features that will be discussed in this chapter. U4VL
    is custom code that is written and developed by Luca Risolia, who runs the website
    http://linux-projects.org. We will add his repository to get the UV4L driver:


    ```

    curl http://www.linux-projects.org/listing/uv4l_repo/lrkey.asc | sudo apt-key
    add -

    ```


    Add the following line to /etc/apt/sources.list:


    ```

    deb http://www.linux-projects.org/listing/uv4l_repo/raspbian/ wheezy main

    ```


    > If you have not yet run rpi-update, then it is recommended to do it now. The
    UV4L driver requires the latest foundation kernels and modules to install properly.'
  md: "\n## Freeciv\n\n> \"This is a free and open source empire-building strategy\
