    \nFor security reasons, you should only allow ports forwarded to the ports defined\
    \ in your nginx virtual hosts and block the rest, for example, Kestrel's 5004.\
    \ This is to ensure that any vulnerabilities within Kestrel cannot be exploited,\
    \ while it's still developed as a development server. The only downside is that\
    \ services such as Netcraft will identify this website as nginx and not Microsoft's\
    \ Kestrel. But from a security point of view, this is good, since a potential\
    \ attacker will not know what is actually going on behind the powerful nginx proxy.\n\
    \n## Other .NET applications\n\nMono supports the full .NET 5 stack, which means\
    \ that you can now easily create console applications in Visual Studio and execute\
    \ them on Raspberry Pi. Simply copy your .exe file and run it using `MONO file.exe`.\n\
    \nYou can also create traditional Windows Forms and execute them within LXDE using\
    \ the same method of `MONO formsapp.exe`. Native styled forms should appear within\
    \ LXDE.\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_74_0.png)\n\n> With Windows\
    \ IoT installed as your operating system, you will be able to create Universal\
    \ Apps leveraging the Windows 10 API, creating full hardware rendered forms, and\
    \ gain access to OpenGL via DirectX graphics and a rich API for developing Internet\
    \ of Things applications for Raspberry Pi 2. The basics will be covered in Chapter\
    \ 10, Windows IoT Core.\n"
  mdcn: "\n我们现在可以运行这个基础的 Node 服务器，它提供一个简单的 API 文本响应，返回当前的 CPU 核心电压。你可以在 http://raspberrypi/node/core/voltage\
    \ 发起一个 AJAX GET 请求，由于这是 GET 请求，你只需在启动服务器后将该地址输入浏览器即可测试：\n\n```\nnode index.js\n\
    ```\n\n现在，你可以更新位于 /var/www/html/web 的 index.html 文件，并使用 jQuery 执行一个简单的 GET 请求来更新页面上的元素。结果在\
    \ 1.2 到 1.3125 之间变化（完整示例在代码库中提供）：\n\n```\n$.get('/node/core/voltage', function(data)\
    \ {\n  $('#cpuvoltage').text(data);\n});\n```\n\n## .NET and ASP.NET MVC\n\n为了使用\
    \ Microsoft 的 .NET 框架，我们首先需要安装最新版本的 Mono。典型的方法是从 Git 源码编译 Mono，但在 Raspberry Pi\
    \ 2 上完成大约需要 6 小时。我曾尝试制作一个交叉编译教程，但未能找到足够简单或稳健的内容以在此书中演示。\n\n不幸的是，当时 Wheezy 和 Jessie\
    \ 仓库中只有不支持 .NET 5 的版本。更快更好的一种方式是使用官方 Xamarin 仓库维护的新版本。\n\n以下命令将添加官方 Xamarin 仓库，更新任何必需的软件包，最后安装\
    \ Mono，约需 300 MB 空间，耗时约 10 分钟。输入以下命令：\n\n```\nsudo apt-key adv --keyserver keyserver.ubuntu.com\
    \ --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF\n```\n\n```\necho \"deb\
    \ http://download.mono-project.com/repo/debian wheezy main\" | sudo tee /etc/apt/sources.list.d/mono-xamarin.list\n\
    ```\n\n```\nsudo apt-get update && sudo apt-get upgrade\n```\n\n```\nsudo apt-get\
    \ install mono-complete\n```\n\n## Prerequisites for .NET 5\n\n> 请注意，随着 .NET vNext\
    \ 项目推进到版本 1，术语和命令可能会发生变化。如果任何命令无法工作，请参考 https://github.com/aspnet/home 获取更多信息。\n\
    \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_71_0.png)\n\n此时，我们可以通过输入以下命令检查 Mono\
    \ 是否已正确安装：\n\n```\nmono --version\n```\n\n为了让 Kestrel 正常工作，我们需要手动编译 Libuv 并链接新的库：\n\
    \n```\nsudo apt-get install automake libtool curl unzip\nwget https://github.com/libuv/libuv/archive/v1.4.2.tar.gz\n\
    sudo tar zxfv v1.4.2.tar.gz -C /usr/local/src\ncd /usr/local/src/libuv-1.4.2\n\
    sudo sh autogen.sh\nsudo ./configure\nsudo make\nsudo make install\nsudo ldconfig\n\
    ```\n\nLinux 上的 .NET 5 带来了一些新的术语，我会尽力解释：\n\nDNX 是 Dot Net Execution Environment\
    \ 的缩写，用于引导和执行 .NET 应用程序。要安装 DNX，我们首先需要安装 DNVM，即 Dot Net Version Manager 的缩写。\n\
    \nDNVM 允许你并行安装多个版本的 DNX，以便应用程序能够在不同版本的 .NET 5 上运行。\n\nDNU，即 Dot Net Package Updater\
    \ 的缩写，本质上提供了一种在 Pi 上恢复项目所依赖的 NuGet 包的方式，类似于 Node.js 的 NPM。\n\n## Installing DNVM,\
    \ DNU and DNX\n\nDNVM、DNU 和 DNX 可以通过终端上的单行命令安装，这得益于一个脚本，该脚本将执行所有其他必需操作。请注意，稳定版使用旧的命令行：K、KRE、KPM\
    \ 和 KVM。为了保持与补丁同步，我们将使用 dev（前沿）分支。这些补丁移除了许多额外的命令，这里不会涉及。一旦版本 1 发布，请使用稳定分支：\n\n\
    ```bash\ncd /home/pi\ncurl -sSL https://raw.githubusercontent.com/aspnet/Home/dev/dnvminstall.sh\
    \ | DNX_BRANCH=dev sh && source /home/pi/.dnx/dnvm/dnvm.sh\n```\n\n## Installing\
    \ DNX\n\n要安装最新版本的 DNX（.NET 5），截至撰写时为 Beta4，在 dev 上，我们现在只需输入以下单行命令：\n\n```bash\n\
    dnvm upgrade\ndnx\n```\n\n恭喜，你现在已在 Raspberry Pi 上安装了 .NET 5！\n\n## Running the\
    \ MVC website\n\n在之前的过程中，只安装了 .NET 5 运行时环境，这允许跨平台执行 .NET 应用程序。\n\n为了快速运行一个 MVC\
    \ 网站，我们将使用 ASPNET Github 仓库中的示例。在 beta 期间，请确保选择已安装的 DNX 版本的正确目录。本章其余部分我们将使用 v1.0.0-beta4\
    \ 目录和 DNX。当最终版发布时，它将被命名为 v1.0.0。\n\n> 请再次核对你使用的 DNX 版本和示例版本。不匹配的 DNX 和示例会导致部分示例无法运行。\n\
    \n我们将克隆主要的 ASPNET Home 示例并进入特定的 beta 目录。我们将在此目录中运行包恢复以安装所有必需的依赖项，例如 Kestrel：\n\
    \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_73_0.png)\n\n> DNU restore 第一次下载所需包可能需要一些时间。dnx\
    \ . kestrel 命令第一次执行也可能需要一些时间；它会在 Kestrel 启动并绑定端口之前引导并预构建 MVC 网站。\n\n```\ncd /var/www\n\
    sudo mkdir dotnet\ncd dotnet\nsudo git clone -b dev https://github.com/aspnet/Home.git\n\
    ```\n\nGit clone 以 root 用户执行，将 /Home 目录中的所有文件创建为 root。这会在恢复包时导致问题，并可能出现其他奇怪情况。我们需要递归地将该目录的用户更改为\
    \ pi 以修复权限问题：\n\n```\nsudo chown -R pi /var/www/dotnet/Home\n```\n\n我们现在将从官方稳定仓库恢复所需的包。你需要在任何新项目（或示例项目）上始终运行此操作，但会快很多，因为包现在已缓存（将\
    \ beta 替换为你正在运行的 DNX 版本）：\n\n```\ncd /Home/samples/v1.0.0-beta4/HelloMVC\ndnu\
    \ restore\ndnx . kestrel\n```\n\n最后一条命令使用 dnx 根据名为 project.json 的配置文件中指定的配置启动\
    \ MVC 网站。Kestrel 绑定的端口也在 project.json 文件中定义，默认为 5004。\n\n运行 dnx . kestrel 后，你的终端屏幕将被占用并显示\
    \ .NET 生成的一些消息。服务器启动后，会显示一条消息告知它已启动并绑定了哪个端口。直到你按 Enter 终止服务器之前，会看到一个闪烁的下划线。\n\n\
    在按 Enter 之前，使用网络上另一台计算机的 Web 浏览器导航到 http://raspberrypi:5004。你现在应该能看到一个基础的 MVC\
    \ 示例网站。\n\n继续尝试编译其他示例或使用 Visual Studio Community 版创建自己的项目。\n\n## MVC and nginx\n\
    \n你可以在不安装 nginx 的情况下直接使用 Kestrel 使用 MVC，但强烈建议使用 nginx 作为前端代理，这将允许你在混合环境中管理各种 Web\
    \ 应用程序。Nginx 还提供更多功能，例如绑定 SSL 证书，而 Kestrel 单独使用时尚不支持。\n\n我们现在可以为 `dotnet` 代理添加另一个\
    \ location 块：\n\n```\nlocation /dotnet {\n    proxy_pass http://127.0.0.1:5004;\n\
    }\n```\n\n你现在可以导航浏览器到 http://raspberrypi/dotnet，你应该会看到与 5004 端口相同的页面。\n\n这样做的好处是，你现在已配置\
    \ nginx 对此虚拟主机执行更高级的操作。\n\n出于安全原因，你应仅允许转发到 nginx 虚拟主机中定义的端口，并阻止其余端口，例如 Kestrel\
    \ 的 5004。这样可以确保在 Kestrel 仍作为开发服务器开发期间，其中的任何漏洞都无法被利用。唯一的缺点是像 Netcraft 这样的服务会将此网站识别为\
    \ nginx 而非 Microsoft 的 Kestrel。但从安全角度来看这是好的，因为潜在攻击者不会知道强大的 nginx 代理后面实际发生了什么。\n\
    \n## Other .NET applications\n\nMono 支持完整的 .NET 5 堆栈，这意味着你现在可以在 Visual Studio\
    \ 中轻松创建控制台应用程序并在 Raspberry Pi 上执行。只需复制你的 .exe 文件并使用 `MONO file.exe` 运行即可。\n\n\
    你也可以创建传统的 Windows Forms 并使用相同的方法 `MONO formsapp.exe` 在 LXDE 中执行。原生样式的表单应出现在 LXDE\
    \ 中。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_74_0.png)\n\n> 如果将 Windows IoT\
    \ 安装为你的操作系统，你将能够利用 Windows 10 API 创建通用应用，创建全硬件渲染的表单，并通过 DirectX 图形访问 OpenGL 以及用于开发\
    \ Raspberry Pi 2 物联网应用的丰富 API。基础内容将在第 10 章《Windows IoT Core》中介绍。\n"
