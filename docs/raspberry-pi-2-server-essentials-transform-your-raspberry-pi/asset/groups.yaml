    ```\ndeb http://mirrordirector.raspbian.org/raspbian/ jessie main contrib non-free\
    \ rpi\ndeb http://archive.raspbian.org/raspbian jessie main contrib non-free rpi\n\
    ```\n\nThe next step is to tell aptitude to use the `wheezy` repository for normal\
    \ updates and that you would like to use Jessie from time to time. These settings\
    \ should be typed into the file found at `/etc/apt/preferences`. Create this file\
    \ if it does not exist:\n\n```\nPackage: *\nPin: release n=wheezy\nPin-Priority:\
    \ 900\n\nPackage: *\nPin: release n=jessie\nPin-Priority: 300\n\nPackage: *\n\
    Pin: release o=Raspbian\nPin-Priority: -10\n```\n\nAfter adding these settings\
    \ and saving the files, run `sudo apt-get update`.\n\nWe will be using `apt-get`\
    \ with an extra switch to use the new packages. You should only use this switch\
    \ when it is advised. Upgrading core packages could result in unstable behavior.\
    \ The syntax we will be using is as follows, where `<package>` will be replaced\
    \ with the game package that we require in the following paragraphs:\n\n```\n\
    sudo apt-get -t jessie install <package>\n```\n\n## Game servers\n\nWe will only\
    \ be focusing on running the server parts of games that do not require desktop\
    \ interaction. Instead, you run the client on another computer and connect to\
    \ Raspberry Pi. Some clients can run on Pi's X desktop, and they would do reasonably\
    \ well on the Raspberry Pi 2 but might not be very pleasant.\n\n## OpenTTD\n\n\
    **OpenTTD** is a reimplementation of the original Transport Tycoon made by MicroProse.\
    \ The game is dangerously addictive, and adding Internet play to the mix can give\
