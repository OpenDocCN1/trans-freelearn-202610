  \ Raspberry Pi 社区，特别是 Stack Exchange 上的成员，*Packt Publishing* 的每一个人，以及以各种方式帮助我完成本书的人。\n\
  \n## About the Reviewers\n\n**Ian McAlpine** 第一次接触计算机是在他学校的 Research Machines RML-380Z，以及他的物理老师的\
