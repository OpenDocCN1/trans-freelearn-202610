  \ 7. 最后，我们可以单击 Finish Setup。然后，ownCloud 将配置数据库并测试可能需要解决的任何问题。\n\n经过几秒钟，您将看到主仪表板，显示欢迎使用\
  \ ownCloud 页面，提供多个可下载的应用程序以及连接 ownCloud 的方式。\n\n## 管理员配置\n\n如果您刚刚以管理员身份登录到仪表板，强烈建议您创建一个用户，用于日常云任务：\n\
  \n- 1. 在右上角，您将看到您的管理员用户名和一个下拉菜单。单击它，然后单击 **用户**。\n- 2. 在此页面创建用户之前，单击 groups 并单击\
  \ + **添加组** 以创建新的用户组，例如 **用户**。\n- 3. 现在，您只需输入用户名和密码；确保已勾选新组，然后单击 **创建**：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_150_0.png)\n\
  \n通过创建新组，您现在可以更好地管理限制或选项，以便以后对该组或其他新组下的任何人使用。\n\n例如，在此页面上，您可以为每个组设置配额。\n\n## 服务器管理员\n\
  \n在仍以管理员身份登录的情况下，单击右上角的管理员用户名，然后单击 **管理员**。默认情况下，您将进入共享选项页面。\n\n在此页面上，您可能会注意到一些安全和设置警告。如果看到任何关键问题，您可以通过阅读在线文档来尝试解决这些问题。\n\
  \n作为标准，这里没有什么关键的内容需要更改，但阅读可用选项时，您可能会发现喜欢或不喜欢的内容并相应地进行调整。\n\n第一个允许您为组进行调整的选项是 **限制用户仅与所在组的用户共享**。\n\
  \n\n\n当发布更新时，您将重新访问此页面以启用更新模式，并创建配置备份。\n\n您可以使用左侧的菜单跳转到页面的各个部分。\n\n## 安装应用\n\n通过\
  \ WebGUI 以管理员身份登录时，您可以点击左上角的链接，该链接位于 ownCloud 图标旁边。下拉菜单将会出现，您会看到一个添加应用的按钮：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_151_0.png)\n\
  \n免费版提供基本的文件支持和一些不错的附加功能。企业版提供对 **Calendar**、联系人管理和同步的官方支持。\n\n在此页面上，您将看到已启用的官方应用列表，例如图片或\
  \ PDF 查看器。还有一些应用处于禁用状态；要查看它们，请点击右侧的 **Not Enabled** 菜单项。\n\n不过无需担心应用数量不足，因为 ownCloud\
  \ 设计为可扩展的。您可以在 https://apps.owncloud.com 免费安装大量用户制作的应用。\n\n在应用页面，点击左下角的齿轮图标，并启用\
  \ **Experimental Apps** 以允许安装第三方应用。\n\n如果您在查看或启动下载的应用时遇到任何问题，可能需要将您创建的文件夹的所有者设置为\
  \ **www-data**。\n\n## 日历\n\n要在 ownCloud 上启用日历功能，我们将安装一款评分很高的应用，名为 Calendar Plus：\n\
  \n- 1. 在 `https://apps.owncloud.com` 网站上搜索此应用并下载它。\n- 2. 将 zip 文件解压到名为 calendar\
  \ plus 的目录中。\n- 3. 要安装应用，我们需要将解压后的目录上传到位于 `/var/www/owncloud/apps` 的 `/apps` 目录。使用\
  \ Filezilla 通过 SFTP 连接到您的 Raspberry Pi，并将目录上传到 apps 目录。\n- 4. 在 WebGUI 的 **Apps**\
  \ 页面上，点击 **Not Enabled** 并在页面底部找到 **Calendar+**。点击 **Enable**：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_152_0.png)\n\
  \n## 其他应用\n\n`https://apps.owncloud.com` 网站拥有大量各种应用可供选择，您可以以相同的方式安装它们，除非作者在应用描述中提供了额外步骤。\n\
  \n## 日常功能\n\n如果您已查看配置页面，您可以注销管理员账号，并使用 Web GUI 以您为自己创建的用户身份登录。\n\n对于在本地网络上运行的计算机和设备，您可以将客户端应用程序安装到桌面或移动计算机上，并使用内部\
  \ IP 或 Pi 的 DNS。\n\n## 全球访问\n\n如果您决定使用动态 DNS 服务在 WWW 上使用 ownCloud，第一件事是检查其是否配置正确。一种简单的方法是将客户端应用程序下载到您的智能手机或支持\
  \ 3G 的平板电脑上。\n\n安装应用程序，然后关闭 Wi-Fi 以接入移动网络，例如 3G。并非所有路由器都支持回环 DNS 查找，这意味着尝试从您的 IP\
  \ 访问您的 IP 可能会失败，但使用外部网络可以验证您的端口是否已正确转发。\n\n启动应用程序并在登录屏幕上输入您的详细信息。客户端应用程序将进行快速连接测试并告知您状态。\n\
  \n如果您已登录，可以尝试重新打开 Wi-Fi，看看客户端是否会正常继续运行。\n\n## 摘要\n\nRaspberry Pi 2 现在可以成为您实现云存储独立的解决方案。只要在存储介质上设置了一些冗余，您就可以基本摆脱大型企业巨头，重新完全控制您的数据。\n\
  \n在下一章中，我们将研究使用一些服务器端应用程序，例如数据库和 nginx，来处理存储 GPIO 数据以监测天气。\n"
- "## 12 物联网 – 云中的传感器\n\n现在您已经学习了在 Raspberry Pi 2 上运行软件应用程序的基础知识，是时候应用您新获得的知识了。本章将介绍与操作系统无关的语言编程。\n\
  \n如果您愿意接受任务，请在我在电气原型制作方面帮助您建立基础的同时，找到您最喜欢的操作系统和编程语言。\n\n在本章中，我们将重点关注以下主题：\n\n- 了解功耗需求并选择正确的电缆\n\
  - 使用晶体管\n- 了解集成电路（IC）及其用途\n- Windows IoT、事件和实时系统\n- 为物联网集成而使用云\n\n这些主题将扩展您基本的电子知识，并展示可在任何嵌入式平台上使用的良好原型制作实践，例如您的\
  \ Raspberry Pi 2。\n\n软件的最终决定完全取决于您个人的偏好。通过这样做，您将增强解决问题的信心，并欣赏互联网上庞大的工具和资源。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_156_0.png)\n\
  \n如果您在软件问题上遇到困难，最好的解决方案是离开电脑休息 90 分钟，或去睡觉，第二天再回来处理。如果您似乎在某个特定的软件问题上卡了好几天，请考虑换一种方式提问。不要执着于一种特定方法，因为您的问题很可能已经被解决，并且已经有很好的解决方案存在。\n\
  \n## 什么是物联网？\n\n物联网是 *things*，它们配备传感器并嵌入电子设备和软件。这些事物连接到网络，很可能是互联网。\n\n物联网始于机器对机器设备，例如报警系统或\
  \ GPS 追踪器，并逐渐扩展到家庭便利小工具，例如电网监控工具或某种形式的家庭自动化。\n\n> “专家估计，到 2020 年物联网将包含近 500 亿个物体。”\n\
  > \n> – Wikipedia\n\n要构建成功的物联网设备，您需要学习软件，其基础知识在本书中有所介绍。您还需要学习电子知识，这也将在本章中介绍。\n\n\
  ## 欧姆定律\n\n欧姆定律是在您进入原型制作领域之前需要尝试理解的基本概念。欧姆定律被广泛误解的主要原因之一是它有各种方程，这些方程源自一个单一的数学方程。\n\
  \n您可以在 *Chapter 9, Running Your Pi from a Battery's Power Source* 中找到有关此图表和欧姆定律的更多信息。我在此包含此图表以供快速参考，因为我将演示如何使用提供的一些方程：\n\
  \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_157_0.png)\n\n## 功率有多大？\n\n在欧姆定律中，功率（W）称为瓦特。理解如何计算瓦特几乎是最重要的问题，您应该能够轻松回答。\n\
  \n例如，我需要多大的电缆？\n\n- 电缆的额定值为可承载多少安培。如果您知道所需的安培数，那么您就知道使用哪种电缆。\n\n> 如果您选择了错误的电缆尺寸，通常会导致电气火灾，因为摩擦会使这些电缆发热直至熔化并最终点燃。\n\
  \n要计算设备使用多少瓦特（W），通常将伏特（E）乘以安培（I）。\n\n> 瓦特 = 伏特 x 安培 (W = EI)\n\n- 5 伏特 x 1 安培 =\
  \ 5 瓦特（例如 Raspberry Pi）\n- 如果您有一个需要 60 瓦且额定电压为 240 伏的设备，那么您可以通过将瓦特除以伏特来计算这些安培。\n\
  \n> 安培 = 瓦特 / 伏特 (I = W/E)\n\n- 60 瓦 / 240 伏 = 0.25 安培（这是一个灯泡）\n- 一旦您知道需要传输多少安培，您可以使用美国线规（AWG）表来检查在所需距离上所需的电缆尺寸：\n\
  \n美国线规 (AWG)\n| 长度（英尺） | 长度（米） | 5 | 10 | 15 | 20 | 25 | 30 | 40 | 50 | 60 | 70\
  \ |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 3 | 1 | 18 | 18 | 18 |\
  \ 18 | 16 | 16 | 16 | 12 | 12 | 12 |\n| 15 | 4 | 16 | 12 | 10 | 10 | 8 | 8 | 6 |\
  \ 6 | 4 | 4 |\n| 20 | 6 | 14 | 12 | 10 | 8 | 8 | 6 | 6 | 4 | 4 | 4 |\n| 25 | 7 |\
  \ 14 | 10 | 8 | 8 | 6 | 6 | 4 | 4 | 2 | 2 |\n| 30 | 9 | 12 | 10 | 8 | 6 | 6 | 4\
  \ | 4 | 2 | 2 | 2 |\n| 40 | 12 | 12 | 8 | 6 | 6 | 4 | 4 | 2 | 2 | 1 | 1/0 |\n| 50\
  \ | 15 | 10 | 8 | 6 | 4 | 4 | 2 | 2 | 1 | 1/0 | 1/0 |\n| 60 | 18 | 10 | 6 | 6 |\
  \ 4 | 2 | 2 | 1 | 1/0 | 2/0 | 2/0 |\n| 70 | 21 | 10 | 6 | 4 | 2 | 2 | 2 | 1/0 |\
  \ 2/0 | 2/0 | 3/0 |\n| 80 | 24 | 8 | 6 | 4 | 2 | 2 | 1 | 1/0 | 2/0 | 3/0 | 3/0 |\n\
  | 90 | 27 | 8 | 4 | 4 | 2 | 1 | 1/0 | 2/0 | 3/0 | 3/0 | 4/0 |\n\n> 通常建议如果接近电缆的极限，则选择更小一号（更粗的电缆）。这通常在容量的\
  \ 10% 以内。\n\n这里有一幅说明 AWG 尺寸如何工作以及半径和面积的公制毫米转换的插图：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_158_0.png)\n\
  \n\n\nHigher voltage is your friend over longer distances. Generally, the higher\
  \ the voltage, the thinner the cable you need to use to supply the same amount of\
  \ amps, reducing the cost of the cable.\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_159_0.png)\n\
  \n> In most cases, the highest voltage that we can use is what is supplied to our\
  \ home grid 110v/220v, and this will still be the most efficient way to transport\
  \ power for distances up to 300 feet (100 meters).\n\nYou will find this useful\
  \ in many projects that you are ready to put into *生产* away from your prototyping\
  \ bench. For example, to power remote devices, such as a weather station that controls\
  \ an irrigation system 120 meters away from the nearest socket, but it may as well\
  \ be something in your loft, connected within one box:\n\n- Raspberry Pi 2: 5 volts\
  \ 1 amp\n- USB GPRS Modem: 5 volts 0.8 amp\n- Medium water pump: 24 volts 2.5 amp\n\
  - 6 x Solenoids: 9 volts 1 amp\n- Relay board: 12 volts 0.5 amp\n\nYou will learn\
  \ how to apply Ohm's law and use IC to deal with this problem efficiently later\
  \ in this chapter.\n\n## Choosing sensors\n\nThe answer to this question depends\
  \ on what you want to build. Sensors come as a variety of packages, operated by\
  \ various voltages, and interfaced with some kind of communication standard.\n\n\
  ## Resistors, fuses, and diodes\n\nThese are typically the easiest elements of electrical\
  \ design to understand. If you are planning to create a device, you should find\
  \ a basic electronics course to gain good understanding of these basics before continuing.\n\
  \n## Transistors\n\nEverybody that uses a computer will have probably heard of a\
  \ transistor. What is a transistor really? It is a semiconductor device that can\
  \ be used to amplify or switch electronic signals and electrical power. A semiconductor\
  \ is a solid substance that can conduct electricity when a certain condition has\
  \ been met; otherwise they act as an insulator.\n\nTheir packages are easily identified\
  \ as they usually consist of three wires (legs). These legs are named Base (b),\
  \ Collector (c), and Emitter (e):\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_160_0.png)\n\
  \nThe preceding illustration shows various packages that a transistor can be found\
  \ in. The ones that look like they have two legs, actually have their base on the\
  \ other side.\n\nThe illustration also shows two different types of transistors:\
  \ NPN and PNP. They essentially do the same thing, but NPN transistors are used\
  \ to switch higher voltages and PNP lower voltage than what's used in your main\
  \ circuit. Also, PNP transistors are turned on when pulling the base low while NPN\
  \ is turned on when you provide a voltage to the base.\n\nUsually, in prototyping,\
  \ we are mostly interested in switching higher voltages, and from here on, we will\
  \ be working with NPN transistors.\n\nIt may sound confusing at first, but just\
  \ think of a transistor as a plain old switch. When you apply the correct amount\
  \ of current to an NPN transistor's base, it is like your finger pushing a button.\
  \ Once you get to the correct pressure, the switch will turn on, and the current\
  \ will flow through the collector to the emitter. The amount of power (A) used to\
  \ trigger a transistor is typically very low and safe for the GPIO's on the Raspberry\
  \ Pi.\n\nLooking at the sample circuit (bottom right) in the illustration, you can\
  \ see a 9v power source connected to a resistor, LED, and then to the collector\
  \ of the transistor. The emitter is connected to GND. This is pretty much how you\
  \ will wire a switch. In the digital world, to turn on this switch, we need an extra\
  \ input—base. For example, we will use GPIO PIN 4. This can be an output from any\
  \ kind of embedded device with a 3.3v, 5.0v, or a higher voltage. The maximum voltage\
  \ depends on the resistor's technical specification.\n\nThe 10k resistor can be\
  \ of any value between 1K and 20K, and it should always be connected before the\
  \ base of the transistor. The resistor is there to limit the maximum current that\
  \ flows through the base of the transistor, preventing damage to the transistor.\n\
  \nOnce the I/O is set high in software, the switch will close and the LED will illuminate.\n\
  \n> You just learned the basics of transistors. As you build more designs, you will\
  \ find new circuits that require a combination of transistors to achieve a specific\
  \ goal.\n\nUsing transistors in such a way makes switching other voltages much easier\
  \ from an embedded platform, using a low amount of current.\n\nYou should always\
  \ try and find the transistor marking, and you should search for its datasheet to\
  \ understand the minimum and maximum values it can handle. The datasheet will also\
  \ provide the minimum current required on the base to turn it on.\n\nTransistors\
  \ are typically used in low-voltage designs. To turn on high voltage, such as 220\
  \ volts, you should almost always use a relay. Yes, you can use the transistor to\
  \ turn the relay on.\n\n## Integrated Circuit Packages\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_162_0.png)\n\
  \nThese are a variety of other IC packages that you will find. You should be able\
  \ to use any of these with nothing more than a soldering iron or breadboard.\n\n\
  > Other packages such as QFN require specialist equipment to be prototyped with.\
  \ An example of such a package is BCM2836, and it can be found on your Raspberry\
  \ Pi 2.\n\n## Putting it all together\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_163_0.png)\n\
  \nThis circuit demonstrates switching a high-voltage 48 volt DC motor.\n\n> Be very\
  \ careful when working with high voltages. Incorrect wiring will cause irreparable\
  \ damage. Switching mains voltages may be lethal, and please do not attempt this\
  \ if you are in doubt.\n\n## Accurate data using Arduino\n\nThe Raspberry Pi typically\
  \ runs on event-driven Operating Systems. This means that a queue of events gets\
  \ processed by the processor as fast as the processor can handle it. Unfortunately,\
  \ even if your processor is idle, there is still an overhead in the event system\
  \ that causes significant problems with real-time sensors or applications.\n\nThere\
  \ are real-time Operating Systems for the Raspberry Pi, but this will severely limit\
  \ the capabilities that you have learned to use and love. Real-time Operating systems\
  \ guarantee that an action, such as some code, will be completed in the predefined\
  \ time. A very popular Operating System for these types of simple yet extremely\
  \ accurate tasks is the Arduino family IC. They are amongst the best for doing millions\
  \ of tasks over and in a very precise time.\n\nWe will look at some examples of\
  \ how an Arduino IC will help you gather data by showing a use case of building\
  \ a weather station.\n\n## Building a weather station\n\nA great project to work\
  \ on is building a weather station. The Raspberry Pi 2 has so much processing power\
  \ to offer:\n\n- It can store a large amount of data in a database with ease\n-\
  \ It can be its own web server running with a variety of programming languages\n\
  - It can crunch numbers, create statistics, and eventually become nice graphs\n\
  - It can even stream live videos using WebRTC or RTSP\n\n## Real-time embedded devices\n\
  \nAtmel AVR (used on Arduino) and PICAXE are very well-known microcontrollers that\
  \ run code with real-time precision. The advantage of these microcontrollers is\
  \ that you can program them with simple code once, upload the code, disconnect them\
  \ from the development board, and use them like a standalone IC.\n\nYour initial\
  \ cost for a development board may be about the same as a Raspberry Pi on its own,\
  \ but after this, getting the programmable Microcontroller Unit (MCU) will cost\
  \ a few dollars, and will be even cheaper for tiny versions.\n\nThere are expansion\
  \ boards available for some of these embedded devices, mostly for Arduino.\n\n##\
  \ The data communication\n\nReal-time devices also offer very precise or faster\
  \ data communication between various other devices by not only offering hardware\
  \ interfaces but also software bit banging.\n\n> Bit banging is a technique for\
  \ any kind of serial communication using software instead of some dedicated hardware.\n\
  \n## Real-time events\n\nThe essential benefit of an MCU is that you would require\
  \ it when building a weather station. It is required when counting time-sensitive\
  \ actions, such as wind speed, which must be calculated every second without any\
  \ delay.\n\nYou write a small function of code that executes when a selected pin\
  \ is triggered. This is known as an interrupt. This code is as simple as incrementing\
  \ a counter.\n\n\n\nThe main program is an endless loop of code or an internal-timed\
  \ interrupt. Not all MCUs offer internal-timed interrupts, but what is critical\
  \ is that it always runs at a selected time, for example, every 60 seconds. On an\
  \ MCU, this is guaranteed to run every 60 seconds to the microsecond. This is crucial\
  \ to make sure that you can run an algorithmic function, which uses your wind counter\
  \ to save the wind speed. On an event driven OS, you may get highly inaccurate readings\
  \ caused by delayed processor queues or the optimized execution.\n\n## Analog inputs\n\
  \nThe Raspberry Pi lacks analog inputs. MCUs usually have more analog inputs than\
  \ digital ones. On tiny versions, they may even completely lack digital inputs.\n\
  \nAnalog inputs will be very useful to read the direction of the wind, as wind vanes\
  \ usually output a calculated sub-voltage from the input voltage to inform you of\
  \ the direction. Something like a potentiometer, but more simply, it is like various\
  \ resistors connected to a reed switch, which will activate a given circuit.\n\n\
  There are still a lot of other applications that can be useful for analog inputs.\n\
  \n## Parts required\n\nThe most affordable and pretty complete package is offered\
  \ by Sparkfun—a wind vane, anemometer, and rain counter, with cables and a complete\
  \ installation mount. Adding extras to this, such as instruments to measure UV light,\
  \ atmospheric pressure, and temperature, is a breeze.\n\nYou will also need a Raspberry\
  \ Pi and a programmed Arduino MCU or similar.\n\n## Storing data on the Cloud\n\n\
  At some point of any project, you will, most certainly, want to store collected\
  \ data somewhere. Usually, this is from collecting sensors, but it could also be\
  \ debugging data.\n\nThe Cloud is a network of servers that can provision virtual\
  \ machines for any use. Usually, you start from one server, but you always have\
  \ the ability to increase the size or bundle several virtual machines to act as\
  \ one endpoint. All this is usually handled by a nice frontend, such as Azure, Amazon\
  \ AWS, or the Google Cloud platform.\n\n## Phant\n\nPhant is a logging tool developed\
  \ by Sparkfun Electronics and is ready to be used free of charge at https://data.sparkfun.com;\
  \ it stores data in JSON format. JSON is easy to read and compress, but most importantly,\
  \ it's dynamic; dynamic meaning that you don't build relationships between each\
  \ data packet, as in traditional SQL servers. This means that each data packet can\
  \ contain any variety of structures that you save to Phant.\n\nYou can find yourself\
  \ a very cheap Linux-based virtual machine and install your own Phant platform to\
  \ take full control of your cloud data. This is an extremely easy way to allow you\
  \ access to shared data anywhere in the world, as long as you have an Internet connection.\n\
  \n## Summary\n\nIn this chapter, you learned the basics of electrical engineering\
  \ and the external system's integration. The possibilities are endless and only\
  \ confined to your own imagination. In case you ever seem to get stuck, it is worth\
  \ visiting some of these great sites for more information.\n\nFor Stack Exchange,\
  \ use the following:\n\n- Electrical Engineering: http://electronics.stackexchange.com/\n\
  - Raspberry Pi: http://raspberrypi.stackexchange.com/\n- Stack Overflow (Programming):\
  \ http://stackoverflow.com/\n- Ask Ubuntu (Linux related): http://askubuntu.com/\n\
