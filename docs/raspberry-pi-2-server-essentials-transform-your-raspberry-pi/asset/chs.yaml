- "## 1 使用 Raspberry Pi 入门\n\n连接到网络应该像插入一根电缆一样简单。问题是，在连接到互联网或本地网络后，我们可以在 Raspberry\
  \ Pi 上做什么？这就是为什么必须了解 Raspberry Pi 的硬件前提和功能，以便您的想法在理论上是可实现的。同样，深入了解您的硬件将使本书后面处理故障排除问题变得容易得多。\n\
  \n与 Raspberry Pi 相关的最常见问题与电源有关。这些问题可能导致其重新启动、出现意外行为，或如果您连接了外部显示器，在启动过程中可能显示彩虹屏。\n\
  \n本章全部关于识别您正在使用或可能与之一起使用的 Raspberry Pi 及其外设。您应该了解有关 Raspberry Pi 的两个主要信息：型号和版本。\n\
  \n### 硬件要求\n\n本书假设您使用的是 Raspberry Pi 2，型号 B。\n\nRaspberry Pi 2 与其前身大部分向后兼容。每当出现兼容性问题时，都会明确告知用户，如果可能，会提供替代解决方案。\n\
  \nRaspberry Pi 的最新版本在最基本层面上只需要电源和 Micro SD 卡即可运行。为了使初始配置更轻松，建议您还配备 HDMI 电缆、带 HDMI\
  \ 输入的宽屏显示器或电视、以太网电缆以及 USB 键盘。\n\n下表描述了各种型号之间的主要差异：\n\n| 型号 | 第二代 Model B | Model\
  \ B+ | Model A+ |\n|---|---|---|---|\n| SoC | BCM2836 | BCM2835 |  |\n| CPU | 900\
  \ MHz Quad Core ARMv7 | 700 MHz single core ARMv6 |  |\n| GPU | VideoCore IV @ 250Mhz\
  \ / OpenGL ES 2.0 / H.264/MPEG-4 AVC | VideoCore IV @ 250Mhz / OpenGL ES 2.0 / H.264/MPEG-4\
  \ AVC | VideoCore IV @ 250Mhz / OpenGL ES 2.0 / H.264/MPEG-4 AVC |\n| SDRAM | 1\
  \ GB | 512 MB | 256 MB |\n| USB | 4 | 2 | 1 |\n| 音频输入 | 无直接输入，两块修订版板通过 I2S，均使用 USB\
  \ | 无直接输入，两块修订版板通过 I2S，均使用 USB | 无直接输入，两块修订版板通过 I2S，均使用 USB |\n| 网络 | 10/100 Mbit/s\
  \ | 10/100 Mbit/s | None |\n| GPIO | 17 | 17 | 17 |\n| 接口 | 40 pins | 26 pins |\
  \ 26 pins |\n| 功耗 | 800 mA (4.0 W) | 800 mA (4.0 W) | 200 mA (1 W) |\n| SD 卡 | Micro\
  \ SD slot | Micro SD slot | Micro SD slot |\n\n随着 Raspberry Pi 的最新型号，大多数外设应可即插即用，因为这些版本已升级为专用电源电路，以处理峰值负载，同时降低整体功耗。只有\
  \ plus 型号才具有此新电路，而所有旧版本的 Raspberry Pi 可能因电路效率低下而出现电源问题。最节能的 Raspberry Pi 是 Model\
  \ A+，通常使用电池供电。我们将在本书后面的章节讨论使用电池为 Raspberry Pi 供电。\n\n### 电源\n\nRaspberry Pi 2 理想情况下应使用\
  \ 2 安培 USB 电源供电，如果您计划将外设连接到 USB 端口。家中最常见的电源是 1 安培电源，通常随智能手机、平板电脑或迷你电脑提供。这些充电器通常由优质组件制成，可以轻松处理额外电力、电力峰值，并产生干净的直流电源，这对于\
  \ Wi-Fi 或串行外设非常重要。\n\n您还应注意使用的 USB 电缆，因为有些电缆生产廉价，内部铜线非常细，在需要时难以提供 1 安培或更多的电流。\n\n\
  \n\n在一次独立测试中，最佳 USB 充电器被证明是 HP TouchPad 充电器（P/N 157-10157-00），其次是 Apple A1265、Apple\
  \ iPad A1357 和 Samsung Cube ETA0U80JBE。它们被认为是最好的，因为它们产生的直流电非常干净，并且能够在长时间内承受峰值负载。不过要小心，因为现在也有很多假冒充电器在销售，尤其是\
  \ Apple A1265。随着时间的推移，其中一些电源可能会过时。尝试搜索更新的测试。\n\n为了帮助可视化直流噪声问题，请查看以下图像。左侧的波形极其嘈杂，会对\
  \ Wi-Fi、Bluetooth 或甚至串口等通信外设造成严重问题。右侧的波形被认为干净且稳定：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_25_0.png)\n\
  \n在互联网上搜索如何识别假冒充电器的技巧。\n\n## USB hub\n\n当您购买带电 USB 集线器时，通常会配备 2 或 3 安培的电源。这足以为 Wi-Fi\
  \ 适配器、USB 硬盘、一些其他外设，甚至是 Raspberry Pi 本身供电。\n\n典型的問題出現在 HD USB 相機上，運行一段時間後畫面會變黑。使用带电\
  \ USB 集线器可以解决这个问题。\n\n## SD cards\n\nSD 卡看起来都一样，但实际上有些使用多种不同的控制器和 NAND Flash 内存芯片。所有这些组合构成了卡的可靠性和速度；通常最便宜的也是最差的。话虽如此，花大价钱购买\
  \ SD 卡也不是一个好主意。SD 卡的速度用数字符号标记，从 1（最慢）到 10（最快）。Class 6 或 8 的 SD 卡在性能和价格之间取得了良好的平衡。\n\
  \n然而，并非所有 Class 10 卡都是最佳选择。唯一确定的方法是使用可靠的速度测试应用程序来验证卡是否达到标称的读写速度；这是识别假冒卡的最佳方法：\n\n\
  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_26_0.png)\n\nSD 卡应仅用作安装在其上的操作系统和应用程序的主分区。将\
  \ SD 卡用于频繁更改的数据（如数据库）并不是一个好主意，因为它会比预期更快地降低卡的使用寿命。相反，我们应使用外部存储设备，如硬盘或网络附加存储（NAS）来处理频繁更改的数据，同时也有助于存储大量媒体。\n\
  \n本书假定您至少使用 8 GB 的 SD 卡。\n\n## Extra peripherals\n\nRaspberry Pi 被[content]\n在一次独立测试中，最佳\
  \ USB 充电器被证明是 HP TouchPad 充电器（P/N 157-10157-00），其次是 Apple A1265、Apple iPad A1357\
  \ 和 Samsung Cube ETA0U80JBE。它们被认为是最好的，因为它们产生的直流电非常干净，并且能够在长时间内承受峰值负载。不过要小心，因为现在也有很多假冒充电器在销售，尤其是\
  \ Apple A1265。随着时间的推移，其中一些电源可能会过时。尝试搜索更新的测试。\n\n为了帮助可视化直流噪声问题，请查看以下图像。左侧的波形极其嘈杂，会对\
  \ Wi-Fi、Bluetooth 或甚至串口等通信外设造成严重问题。右侧的波形被认为干净且稳定：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_25_0.png)\n\
  \n在互联网上搜索如何识别假冒充电器的技巧。\n\n## USB hub\n\n当您购买带电 USB 集线器时，通常会配备 2 或 3 安培的电源。这足以为 Wi-Fi\
  \ 适配器、USB 硬盘、一些其他外设，甚至是 Raspberry Pi 本身供电。\n\n典型的問題出現在 HD USB 相機上，運行一段時間後畫面會變黑。使用带电\
  \ USB 集线器可以解决这个问题。\n\n## SD cards\n\nSD 卡看起来都一样，但实际上有些使用多种不同的控制器和 NAND Flash 内存芯片。所有这些组合构成了卡的可靠性和速度；通常最便宜的也是最差的。话虽如此，花大价钱购买\
  \ SD 卡也不是一个好主意。SD 卡的速度用数字符号标记，从 1（最慢）到 10（最快）。Class 6 或 8 的 SD 卡在性能和价格之间取得了良好的平衡。\n\
  \n然而，并非所有 Class 10 卡都是最佳选择。唯一确定的方法是使用可靠的速度测试应用程序来验证卡是否达到标称的读写速度；这是识别假冒卡的最佳方法：\n\n\
  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_26_0.png)\n\nSD 卡应仅用作安装在其上的操作系统和应用程序的主分区。将\
  \ SD 卡用于频繁更改的数据（如数据库）并不是一个好主意，因为它会比预期更快地降低卡的使用寿命。相反，我们应使用外部存储设备，如硬盘或网络附加存储（NAS）来处理频繁更改的数据，同时也有助于存储大量媒体。\n\
  \n本书假定您至少使用 8 GB 的 SD 卡。\n\n## Extra peripherals\n\nRaspberry Pi 被品牌化为一台计算机，我们期望可以连接各种不同的设备。Raspbian\
  \ 基于 Debian，并且为 Raspbian 移植了绝大多数驱动程序和软件付出了巨大的努力。你可能有一些旧的 USB 外设，比如一个游戏手柄。如果你在其他任何\
  \ Linux 平台上能找到驱动程序，就应该能够让它在 Raspbian 上工作。将其插入，使用 `lsusb` 命令行实用程序，并检查是否已被检测到。如果你凭借自己的知识成功让它工作，你应该在论坛上分享这些知识以造福其他用户。\n\
  \n## Essential peripherals\n\n你应该考虑购买这些外设并专门用于你的 Raspberry Pi。它们将使设置一切变得更容易，并且甚至可用于长期用途：\n\
  \n- **Wireless USB network adapters**: 在撰写本书时，当前的 Raspbian 镜像支持多种无线适配器，无需安装任何额外驱动程序。许多迷你、纳米或微型版本可以直接从\
  \ Pi 的 USB 端口运行，不需要带电 USB 集线器。\n- **USB hubs**: 因为某些版本的 Raspberry Pi 仅限于两个 USB 端口，所以拥有一个兼容的带电\
  \ USB 集线器是明智的。带电是关键，因为这将允许你同时插入任何 USB 设备或多个设备，而不会影响 Pi 的供电稳定性。在撰写本文时，Raspbian 尚未完全兼容三个\
  \ USB 集线器。\n- **Keyboards and mice**: 大多数有线键盘和鼠标可以直接从 Raspberry Pi USB 端口运行。许多蓝牙键盘和鼠标也可以直接从\
  \ Pi 的 USB 端口工作，但需要使用有线键盘进行初始设置。一些无线键盘，例如 Microsoft 3000 系列，无需任何配置，因为 USB  dongle\
  \ 模拟了 PS/2 有线键盘，可以在启动时直接使用，无需额外配置。\n\n> 你可以访问 http://elinux.org/RPi_VerifiedPeripherals\
  \ 获取兼容外设的最新列表。\n\n## Useful peripherals\n\n随着你对 Raspberry Pi 越来越熟悉，你会为你的项目想出新的、更大的想法。有了这些想法，你可能需要一些更有用的设备来帮助你。\n\
  \n## Internet 3G dongles\n\n你可以使用 3G 加密狗连接到互联网。这些设备需要大量电力，并且需要从带电集线器运行才能全速工作。它们是在你所在国家最偏远的地方也能轻松将\
  \ Raspberry Pi 连接到互联网的绝佳方式。只要你有基本的语音信号，你就应该始终能够使用 GPRS（单通道 57.5 kbps 或双通道 115 kbps），这足以发送大量的日志文本数据。一些国家提供免费短信，这也可以用来收发最少量的数据。如果你计划运行服务器，建议你改用连接到\
  \ ADSL/DSL 连接的 LAN 或 Wi-Fi。\n\n## Audio recording\n\nRaspberry Pi 拥有自己的音频输出硬件，能够通过\
  \ HDMI 或通过 3.5 毫米插孔的模拟音频为你提供高清音质。\n\n你可能会遇到想要从线路输入或麦克风录制音频的情况；你可以使用任何 USB 1.1 或\
  \ USB 2.0 声音采集设备来完成此操作。\n\n## Other media add-ons\n\n- **IR receivers**: 红外（IR）接收器是使用传统遥控器控制\
  \ Raspberry Pi 的绝佳方式。FLIRC USB IR 遥控 dongle 是你开始这样做的绝佳方式。\n- **TV and radio receivers**:\
  \ 这是将你的 Raspberry Pi 变成完整 DVR 系统的终极方式。从 HD 卫星或数字电视录制、播放或暂停直播电视。你也可以收听你喜欢的广播频道。\n\
  - **Webcams**: Raspberry Pi 有一个专用的 HD 摄像头模块端口。拥有其中一个摄像头是一种真正的享受，最新版本的 Raspbian 支持\
  \ UV4L（Video for Linux）。多种 USB 网络摄像头也受支持并支持 UV4L。曾经是一项相当复杂的任务，现在变得容易多了。\n- **Multicard\
  \ readers**: 如果你使用各种卡类型，这些会很有帮助。通用类型的支持有限，但 USB 3.0 USRobotics 一体式读卡器工作得非常好，你可以同时挂载全部六张卡。\n\
  - **AlaMode**: WyoLum 是一家初创企业，创建了适用于各种应用的有用附加组件。具体来说，AlaMode 是一款 Arduino 兼容板，带有实时时钟和\
  \ microSD 插槽，放置在 Raspberry Pi 之上。你可以使用 Pi 的专用 UART（通用异步收发传输器）与 Arduino 通信，并且它可以从\
  \ Pi 的电源运行。如果你喜欢电子项目并且已经熟悉 Arduino，这值得一看。你甚至可以用它来刷新其他 Arduino 兼容芯片或上传固件使其独立运行！\n\
  - **HDMI to VGA**: 如果你使用较旧或备用的仅支持 VGA 的显示器、电视或 LCD 屏幕，你可以从你喜欢的在线拍卖网站或电子商店购买一条内置\
  \ HDMI 转 VGA 转换器。你必须确保购买主动转换器，其价格略高于被动转换器。主动意味着它包含一个微控制器，使用 HDMI 端口的电力将数字信号转换为 VGA\
  \ 标准。Raspberry Pi 能够为这种类型的设备供电。\n\n\n\n## 有趣的外设\n\n你可能在你的小工具箱里有一些这些东西。希望阅读关于这些使用较少的设备的内容能激发一些创造性的想法：\n\
  \n- **摇杆**：微软的 Xbox 360 手柄在使用 **xboxdrv** 时在 X 中像鼠标一样工作，该程序可以从软件包仓库安装。其他摇杆可能需要移植的驱动程序，可以在互联网论坛上找到。\n\
  - **USB 转 SATA**：你可以购买简单的 USB 转 SATA 控制器，使用专用电源为其供电，从而连接 SATA 硬盘。真正的乐趣始于使用基于硬件 RAID\
  \ 的 USB 转 SATA 控制器，它们可以以各种配置串联使用，从而提供海量存储、高冗余或最大性能。\n- **CAN 总线**：CAN 总线是所有现代机动车使用的标准。它是一个标准端口，提供任何人都可以解读的强制性数据，例如油门值、气缸失火或空燃比。PEAK-System\
  \ 拥有多种与树莓派兼容的外设和软件。如果你能够访问制造商特定的代码，甚至可以用这些工具调整发动机映射。\n- **家庭自动化**：名为 TellStick 的兼容设备作为树莓派的第三方家庭自动化设备运行良好，但作为高级\
  \ Linux 用户，你应该努力使用实时微控制器自行制作应用程序，例如 AlaMode 上的 Arduino，或非常便宜的 PICAXE 微控制器。\n- **USB\
  \ 导弹发射器**：可在各种网站和商店获得，这是如果你需要向不明物体发射毛绒导弹的完美小工具！这纯粹是一个娱乐外设，但你也可以将其用于 DIY 项目。\n\n\
  > 然而要小心，你能达到的最大吞吐速度受 USB 2.0 带宽的限制。理论上，这最大速度为 60 MBps，但由控制器上的所有设备共享，而不是每个端口。有关此内容的更多信息将在本书后面介绍。\n\
  \n> 调整非标准值可能会损坏你的 ECU 并使任何保修失效。\n\n- **指纹扫描仪：** Futronic 的指纹扫描仪与 Raspbian 配合良好，并且网上可以找到许多示例。它们是独立的可编程设备，通过\
  \ USB-UART 使用简单消息与 Pi 通信，并且随设备提供详尽的文档。\n- **气象站：** Sparkfun 销售一套相当完整的气象站，包括风向标、风速计和翻斗式雨量计。套件包含夹具和安装支架。你可以轻松且不花太多钱添加光照、温度和湿度传感器。挑战在于使用实时微控制器并构建自己的数据库来记录所有数据。但不用担心，网上有许多教程可以帮助你更进一步。\n\
  \n## 在树莓派上安装 Raspbian\n\nPi 上可以运行许多发行版。有些是特定的实时操作系统，例如 RISC OS，或主流操作系统，例如 Raspbian\
  \ 或 Archlinux。还有一些家庭媒体中心版本，例如 OpenElec 或 OSMC（以前称为 XBMC）。截至 2015 年 6 月，你还将能够安装 Windows\
  \ 10 物联网。近期不预计会有 Android 支持。\n\n树莓派基金会建议你使用他们名为 NOOBS（New Out Of Box Software，即开箱即用软件）的镜像，其中包含经常更新的不同操作系统的列表。在本书中，我们将使用\
  \ Raspbian。它由基金会支持，并且在易用性方面具有最佳兼容性。Raspbian 基于 Debian，与许多其他 Linux 操作系统相似。安装 Raspbian\
  \ 的步骤如下：\n\n1. 对于 Windows 和 Macintosh 用户，树莓派基金会建议你使用来自 `http://www.sdcard.org/`\
  \ 的 SD Formatter。\n   对于 Windows，请执行以下步骤：\n   1. 安装 SD 卡格式化工具。\n   2. 在 **选项** 菜单中将\
  \ **格式化大小调整** 选项设置为 **开启**。\n   3. 确保已选择正确的 SD 卡。\n   4. 点击 **格式化** 按钮。\n   对于 Macintosh，请执行以下步骤：\n\
  \   1. 安装 SD 卡格式化工具。\n   2. 选择 **覆盖格式化**。\n   3. 确保已选择正确的 SD 卡。\n   4. 点击 **格式化**\
  \ 按钮。\n\n对于 Linux，请执行以下步骤：\n   1. 建议你在 Linux 中使用 GParted 或 Parted 工具。\n   2. 将整个磁盘格式化为\
  \ FAT。\n\n2. 你应该从 http://www.raspberrypi.org/downloads/ 下载最新的 NOOBS 归档文件。\n3. 解压归档文件。\n\
  4. 将提取的文件复制到格式化的 SD 卡上。\n5. 将 SD 卡插入树莓派。插入 HDMI 或其他视频线缆，连接兼容的键盘并通电。\n6. Pi 将启动并显示操作系统列表；选择\
  \ **Raspbian**。\n7. 如果你的显示器空白，请在 Pi 启动时尝试按此处列出的数字键：\n   - 1：HDMI 模式\n   - 2：HDMI\
  \ 安全模式\n   - 3：复合 PAL\n   - 4：复合 NTSC\n\n## 了解树莓派的设计\n\n树莓派的 PCB 上有两个可识别的微芯片：\n\n\
  - 中央有一个芯片，上面清楚地标有 Broadcom 标志和以 BCM283x 开头的文字，这是主处理器\n- 树莓派 2 的 RAM 芯片位于 PCB 背面。\n\
  - 靠近 USB 端口处有一个较小的芯片，具体取决于型号，它是 USB 集线器或 USB/LAN 芯片。\n\nBCM283x 实际上是一个高性能 GPU，内置\
  \ ARM 处理器。它是一个 SoC（片上系统），这意味着在它打开时执行的代码有少量空间。这在启动过程中被称为第 1 阶段。\n\n## 启动过程\n\n启动过程中需要执行一些网络操作，了解各个阶段是有益的，以防需要排查问题。启动过程如下：\n\
  \n1. 第 1 阶段在 GPU 上开始并执行 SoC 固件代码，该代码开始将第 2 阶段代码加载到 L2 缓存中。\n2. 第 2 阶段从 SD 卡读取 `bootcode.bin`。它初始化\
  \ SDRAM（同步动态随机存取存储器）并加载第 3 阶段。\n3. 第 3 阶段是 `loader.bin` 文件。它加载 `start.elf`，从而启动\
  \ GPU。\n4. 在 `start.elf` 期间，它准备加载 `kernel.img`。\n5. 然后内核映像读取 `config.txt`、`cmdline.txt`\
  \ 和 `bcm283x.dtb`。\n6. 如果 `.dtb` 文件存在，它将在 0x100 处加载，而内核将在内存中 0x8000 处加载。\n7. 内核映像是在\
  \ ARM CPU 上运行的第一个二进制文件，并且可以编译为特定硬件提供自定义支持。\n8. 操作系统开始加载。\n\n第 1 到第 3 阶段的所有源代码均为闭源并受\
  \ Broadcom 保护。这些闭源文件仅由 Broadcom 编译和发布；你可以通过在 Raspbian 中运行固件升级来更新 SD 卡上的这些文件，这将在后面介绍。\n\
  \n`kernel.img` 文件将应用程序连接到硬件。任何具有操作系统的计算机都有某种内核。在 Linux 中，可以编译自己的内核，这可能是你想要自行修改的第一个文件。这允许你更改启动画面、加载自定义驱动程序或执行可能需要的其他任务。这是一项高级任务，本书不涵盖。\n\
  \n## 其他功能\n\nBCM283x 还具有专用音频硬件以及视频编码/解码功能。这使树莓派能够播放高清（MPEG-4）内容，例如视频，或使用 OpenGL\
  \ ES 渲染游戏。你可以购买额外的编码器/解码器许可证以获得额外功能，例如用于 DVD 视频编码的 MPEG-2 和用于微软 WMV 格式的 VC-1。这也用于\
  \ Silverlight 直播。\n\nSD 卡也由 Broadcom 芯片使用专用硬件输入/输出和中断直接接口。\n\n\n\nAll that dedicated\
  \ hardware means that while those sections of the chip are fully utilized, the ARM\
  \ CPU will be idle or hardly used. This allows you to compute other transactions\
  \ synchronously, and this is what makes the Raspberry Pi a truly unique single board,\
  \ credit card-sized computer!\n\n## 硬件限制\n\nAll this hardware that is crammed into\
  \ one tiny space has its drawbacks. Some are deliberate and others are not. You\
  \ should consider that these are theoretical calculations; real-world performance\
  \ may vary, but are usually slower than theoretically estimated.\n\n## 网络速度\n\n\
  It may be disappointing that the Raspberry Pi Foundation decided to use a 100 Mbps\
  \ LAN chip instead of a gigabit one. We need to crunch some numbers to justify this\
  \ decision, though. Let's convert megabits to a more familiar megabytes. To get\
  \ to megabytes per second from megabits per second, we divide 100 Mbps by 8 (there\
  \ are eight bits in a byte). This equates to 12.5 megabytes per second at 100% LAN\
  \ capacity. For a single user, this is only roughly 20% of what the USB hub can\
  \ handle. This means that by design, this is an unchangeable bandwidth limitation\
  \ for networking.\n\nIf you plan to share files with several users at the same time,\
  \ each new user will bump down the other user's bandwidth to accommodate their own.\
  \ As a workaround, you could add a USB gigabit LAN peripheral. But due to speed\
  \ constraints of the USB hub, you will only use approximately 48% of the gigabit\
  \ LAN. To make matters worse, any hard drives running on the USB port will start\
  \ to fight for bandwidth. The USB controller has to share 480 Mbps across all ports!\
  \ One port is used by the 100 Mbit network card, and the other connects the hub\
  \ to the GPU. For one user, this means a maximum bandwidth of 240 Mbps. Why 240\
  \ Mbps? This is because 240 Mbps goes to the LAN and 240 Mbps goes to the hard drive,\
  \ and theoretically, there is no USB bandwidth left for anything else.\n\nThis could\
  \ be a problem for a multiuser environment, but for home use, you would not run\
  \ into any major problems as the bandwidth can accommodate HD video streams while\
  \ serving other clients. This is why the cheaper 100 Mbps version was used.\n\n\
  ## USB 瓶颈\n\nAs it was made clear by the bottlenecks found in the LAN, the worst\
  \ thing about USB bottlenecks is that there is no way to work around this problem!\
  \ This is because the USB controller connects to the Broadcom and LAN chips, respectively,\
  \ on the PCB without any possibility of expanding or bypassing this chip.\n\n##\
  \ 时间\n\nThe Raspberry Pi also does not come with a real-time clock, so timekeeping\
  \ is left to Internet-based time servers. For many people, this might not cause\
  \ a problem, but if you wanted to create a remote, disconnected device that depends\
  \ on recording events at various times of the day, you might be left a little bit\
  \ disappointed.\n\nOne easy and reliable way to do this is to connect a USB or I²C\
  \ RTC that runs off a small battery. There is an easier and free option, though,\
  \ but it is not as accurate; you may want to install the fake-hwclock package. All\
  \ you need to do is set the time once, and the software will keep track of time\
  \ using a file. If you have a power outage, the software will read the file and\
  \ set the time back to the last known time. The drawback is that you lose that time\
  \ as there is no way to determine how long the outage lasted for.\n\nTo get time\
  \ without using the Internet, you can find a cheap GPS receiver. When the GPS gets\
  \ a good lock, it will provide you with extremely accurate time. This same method\
  \ is used to synchronize GSM voice calls on mobile phone technologies across the\
  \ world.\n\nAnother method is to use the time broadcasted by long wave radio signals.\
  \ These also broadcast extremely accurate time using atomic clocks. The availability\
  \ depends on your location, though. These are currently available in Colorado for\
  \ most of the US; Germany, Russia, the UK for Europe; and finally, Japan. The radio\
  \ waves operate on different frequencies and more research is required for this\
  \ method.\n\n## 参考文献\n\nThe following are the references for this chapter:\n\n-\
  \ 有关 USB 功耗基准的更多信息请访问 http://www.righto.com/2012/10/a-dozen-usb-chargers-in-lab-apple-is.html.\n\
  - Crystal Disk Mark is a great SD card benchmarking tool with a lot of test results\
  \ available online for comparison.\n\n## 总结\n\nOne of the most popular questions\
  \ found on the Internet was how to increase the Pi's performance! With the release\
  \ of the Generation 2, ARM V7, quad core 900 MHz, this is no longer the case. At\
  \ the time of writing this book, one of the most popular questions is how to run\
  \ the Raspberry Pi using batteries, which we will cover in a later chapter!\n\n\
  The purpose of understanding the architecture is vital to a successful long term\
  \ project. The Raspberry Pi works like any other computer, but it was designed purely\
  \ for experimental and learning purposes. It should not be used in production environments,\
  \ but it is an extremely attractive solution for production nevertheless.\n\nIt\
  \ is an excellent platform to share media between friends at school; it is fantastic\
  \ to stream HD media on your TV and is robust enough for many standalone applications.\n\
  \nIn the next chapter, you learn how to set up networks on the Raspberry Pi.\n"
- "## 2 准备网络\n\nIt is important to learn how your network works, especially if you\
  \ plan to connect your Raspberry Pi to the Internet. A home user will typically\
  \ use an Internet package designed to browse websites and read e-mails. Business\
  \ packages, on the other hand, need to do a lot more than you think. These two different\
  \ ISP packages usually carry important technical differences that dictate how your\
  \ network can be reached.\n\nIn this chapter, you will learn how to connect to the\
  \ Internet and look at how to solve some common problems for home users. You will\
  \ also learn how to benchmark your network and try to isolate any network-related\
  \ issues.\n\n## 本地局域网 (LAN)\n\nUsing the standard Raspbian package, both essential\
  \ and non-essential drivers are included. All essential drivers are loaded and some\
  \ non-essential ones are as well.\n\nWe will start by plugging in a network cable\
  \ between the Raspberry Pi and the router provided by your ISP. By default, your\
  \ router has a DHCP server that automatically assigns an IP address to your Raspberry\
  \ Pi.\n\nYou may also use network switches to make a more complex network but because\
  \ the Raspberry Pi has a 100 megabit network port, it may downgrade your entire\
  \ network to 100 megabits. Some switches can negotiate separate connections to lower\
  \ speed interfaces without downgrading the entire network, but you need to consult\
  \ the specifications of the device in order to do this.\n\nTo check whether your\
  \ LAN is up and running, just type `ifconfig`, and you will get text containing\
  \ your current settings:\n\n```\neth0      Link encap:Ethernet  HWaddr b8:27:eb:45:bb:fa\n\
  \          inet addr:192.168.1.135  Bcast:192.168.1.255  Mask:255.255.255.0\n  \
  \        inet6 addr: fe80::ba27:ebff:fe45:bbfa/64 Scope:Link\n          UP BROADCAST\
  \ RUNNING MULTICAST  MTU:1500  Metric:1\n          RX packets:89  errors:0  dropped:0\
  \  overruns:0  frame:0\n          TX packets:96  errors:0  dropped:0  overruns:0\
  \  carrier:0\n          collisions:0  txqueuelen:1000\n          RX bytes:7943 \
  \ (7.7 KiB)  TX bytes:14104  (13.7 KiB)\n\nlo        Link encap:Local Loopback\n\
  \          inet addr:127.0.0.1  Mask:255.0.0.0\n          inet6 addr:  ::1/128 Scope:Host\n\
  \          UP LOOPBACK RUNNING  MTU:16436  Metric:1\n          RX packets:0  errors:0\
  \  dropped:0  overruns:0  frame:0\n          TX packets:0  errors:0  dropped:0 \
  \ overruns:0  carrier:0\n          collisions:0  txqueuelen:0\n          RX bytes:0\
  \  (0.0 B)  TX bytes:0  (0.0 B)\n```\n\nLet's try to understand the different keywords\
  \ from the preceding output:\n\n- **HWaddr**: This is your Pi's MAC address, which\
  \ identifies a vendor and should ideally provide a globally unique address.\n- **inet\
  \ addr**: This is your current LAN IP address, which belongs to a private range\
  \ of either `10.x.y.z` (Class A), `172.16.x.x` (Class B), or `192.168.x.x` (Class\
  \ C). They are known as private addresses because they do not exist on the Internet.\n\
  - **Bcast**: This is a reserved address that's calculated by your network mask,\
  \ and it transmits global messages within your private network.\n- **Mask**: This\
  \ is used in all networks but should only be concerned with advanced configurations.\
  \ Masks divide a network into subnetworks and depend on the class your network belongs\
  \ to.\n- **inet6 addr**: This is your IPv6 address. It will show only if your router\
  \ supports this, but it is more difficult to remember.\n- **RX**: This shows how\
  \ many packets have been received.\n- **TX**: This shows how many packets have been\
  \ sent.\n\n## eth0 端口\n\nThe Raspberry Pi will typically use **eth0** as its on-board\
  \ LAN interface. If you add USB LAN devices, they will have an incremented number\
  \ after *eth*; this will increment the interface number.\n\n\n\n## wlan0 接口\n\n\
  当我们添加无线适配器时，ifconfig 会使用 wlan 而不是 eth 前缀来表示这些接口。所有细节都相同，但有助于直观区分有线网络和无线网络。\n\n##\
  \ 回环（LO）接口\n\n这被称为回环地址，因为它指的是本地设备，并且有一个保留范围，从 127.0.0.1 开始，到 127.255.255.254 结束。这是一个虚拟接口，绕过本地硬件接口和规则。它通常因安全原因和在软件测试期间而使用。例如，您可能只允许\
  \ MySQL 对 localhost 的 root 访问（这将包括 IPv4 的 127.0.0.1 或 IPv6 的 ::1）。这意味着只有计算机上的用户或服务才会被授予访问此资源的权限。它是保留的，localhost\
  \ 也不可以 127.x.y.z 分配给互联网上的用户。\n\n## 无线配置（Wi-Fi）\n\nWi-Fi 是一种方便的方式，让您的 Raspberry Pi\
  \ 在无线网络内的无线环境中运行。对于服务器来说，这并不是理想的解决方案，因为传输数据时延迟会增加，而且许多 Wi-Fi 网络会受到同一频率上其他网络产生的噪声影响。\n\
  \n有许多类型的无线适配器可用，并非所有驱动程序都包含在 Raspbian 中。您可能需要安装特定的驱动程序，但这通常是一个简单的过程。谈到无线配置时，您需要针对适配器上使用的芯片，而不是销售它的最终厂商。\n\
  \n## 推荐的无线适配器\n\n最稳定且价格实惠的芯片组之一是 Realtek RT8191，它支持 802.11n 标准。它也兼容较旧的 802.11b/g\
  \ 规范，以防您的路由器不支持更新的 802.11n 规范。然而，它不支持 5 GHz 频率或 40 MHz 双频带。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_39_0.png)\n\
  \n> 在 http://elinux.org/RPi_USB_Wi-Fi_Adapters 上有兼容适配器的全面列表。\n\n多方比较以找到最佳价格，最好不要选择那些声称是\
  \ Raspberry Pi 唯一和最佳的昂贵适配器。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_40_0.png)\n\
  \n> 您应该注意，默认情况下，无线和有线网络不能以组合模式工作。配置 Wi-Fi 后，您需要移除有线连接并重新启动 Raspberry Pi。这将正确配置无线接口。连接有线连接通常会在\
  \ Raspberry Pi 启动后使无线连接掉线。\n\n## 从桌面设置\n\n在桌面上使用菜单栏中找到的 Wi-Fi 配置工具是几秒钟内连接到无线网络最方便的方式。如果您刚刚安装了\
  \ Raspbian 并计划使用 Wi-Fi 而不是以太网连接，建议您从这里开始。您的 SSID，即无线接入点的可读名称，必须由您的路由器广播才能工作。如果您将其隐藏，则应改用控制台方法。按照以下步骤设置桌面：\n\
  \n- 1. 在右侧菜单栏末尾左键单击网络图标。\n- 2. 所有未隐藏的网络都将显示。\n- 3. 左键单击您想要连接的网络。\n- 4. 输入您的密码并单击确定。\n\
  - 5. 经过几秒钟后，图标将停止闪烁。\n- 6. 您可以通过右键单击网络图标来调整网络设置。\n\n## 从控制台设置\n\n如果您计划以无头模式运行 Raspberry\
  \ Pi（即未连接显示器或键盘），默认情况下您不需要访问桌面，也无法使用桌面网络实用程序。\n\n在 Raspbian 的最新发行版中，SSH 服务默认启用，您可以\
  \ SSH 进入 Raspberry Pi。如果您刚刚加入 Wi-Fi 网络，可以调整其设置。这是在使用以太网设置 Wi-Fi 时的意图。现在您可以通过 SSH\
  \ 登录，并输入以下命令：\n\n```\nsudo nano /etc/network/interfaces\n```\n\n这将打开包含的文件编辑器 nano，并向您展示当前的接口配置。我们关注最后几行。如果您看不到某些行，可以手动输入：\n\
  \n```\nauto lo\n\niface lo inet loopback\niface eth0 inet dhcp\n\nallow-hotplug\
  \ wlan0\nauto wlan0\n\niface wlan0 inet dhcp\n    wpa-ssid \"ssid\"\n    wpa-psk\
  \ \"yourpassword\"\n```\n\n要保存文件，请按 CTRL + X，然后按 Y，最后按 Enter 完成。\n\nallow-hotplug\
  \ 命令将按其名称所述执行：它允许您插拔分配给 wlan0 接口的无线适配器。Auto wlan0 告诉 Raspbian 根据您提供的设置自动配置接口。\n\n\
  我们需要用路由器详细信息替换 SSID 和密码，保持文本在引号内。这是可以使用最基本的配置。\n\n不过此配置有一个问题：如果无线与路由器断开连接，接口不会自动重新启动。有许多脚本试图解决这个问题。配置要求您了解有关无线配置的额外详细信息。下一节提供了一种完全自动化的方式来执行此操作。我们将使用\
  \ wpa-supplicant，它现在默认随 Raspbian 安装。在 /etc/network/interfaces 中，我们将最后几行更改为以下内容：\n\
  \n```\nallow-hotplug wlan0\niface wlan0 inet manual\nwpa-roam /etc/wpa_supplicant/wpa_supplicant.conf\n\
  iface default inet dhcp\n```\n\n我们需要进入 /etc/wpa_supplicant 目录，创建文件并编辑 wpa_supplicant.conf：\n\
  \n```\nsudo touch wpa_supplicant.conf\nnano wpa_supplicant.conf\n```\n\n## 下载示例代码\n\
  \n您可以从 http://www.packtpub.com 的账户下载本书的示例代码文件。如果您在其他地方购买了本书，可以访问 http://www.packtpub.com/support\
  \ 并注册以直接将文件通过电子邮件发送给您。\n\n您可以通过以下步骤下载代码文件：\n\n- 使用您的电子邮件地址和密码登录或注册我们的网站。\n- 将鼠标指针悬停在顶部\
  \ **SUPPORT** 选项卡上。\n- 单击 **Code Downloads & Errata**。\n- 在 **Search** 框中输入书名。\n\
  - 选择您要下载代码文件的书籍。\n- 从下拉菜单中选择您购买本书的来源。\n- 单击 **Code Download**。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_42_0.png)\n\
  \n您也可以通过单击 Packt Publishing 网站上书籍网页上的 **Code Files** 按钮来下载代码文件。可以通过在 **Search**\
  \ 框中输入书名来访问此页面。请注意，您需要登录到您的 Packt 账户。\n\n下载文件后，请确保使用最新版本解压缩或提取文件夹：\n\n- Windows\
  \ 的 WinRAR / 7-Zip\n- Mac 的 Zipeg / iZip / UnRarX\n- Linux 的 7-Zip / PeaZip\n\n\
  在 nano 中，一个简单的文本编辑器，我们需要输入以下内容：\n\n```\nctrl_interface=DIR=/var/run/wpa_supplicant\
  \ GROUP=netdev\nupdate_config=1\n\nnetwork={\n    ssid=\"ssid\"\n    proto=WPA RSN\n\
  \    key_mgmt=WPA-PSK\n    pairwise=CCMP TKIP\n    group=CCMP TKIP\n    psk=\"password\"\
  \n}\n```\n\n配置文件包含有关连接的一些额外详细信息。supplicant 的工作方式是它将尝试使用为 proto、pairwise 和 group\
  \ 定义的参数进行连接。您可能需要调整 key_mgmt，但 WPA-PSK 是现代无线路由器最常见的配置。\n\n此方法还允许您在路由器不广播其 SSID 时连接到路由器。\n\
  \n> 普遍的误解是禁用 SSID 广播可以保护您的网络。即使您关闭了此功能，使用普通无线网卡仍有工具可以毫不费力地找到 SSID 名称。最佳的安全措施是使用最新的加密协议和复杂的密码。\n\
  \n## 使用 wicd-curses\n\n使用 wicd-curses 包是在控制台中设置无线甚至有线接口的更简单方法。该包允许您编辑高级选项，例如静态 IP、DNS\
  \ 和主机名。后台还运行一个守护进程，如果无线信号中断会自动重新连接接口，这是在信号较差区域维护无线网络的更可靠方式。要使用此包，您应该在 wpa_supplicant\
  \ 接口文件中注释掉任何设置：\n\n> 安装此包将安装许多其他依赖包，并可能占用超过 8 MB 的额外空间。一些来源还声称运行此守护进程会使用更多开销，但这听起来是为了易用性和可靠性而付出的公平价格，尤其是在\
  \ Raspberry Pi 2 上。\n\n```\nsudo apt-get install wicd-curses\nsudo wicd-curses\n\
  ```\n\n您将获得一个控制台屏幕，其中列出可用的无线接入点。使用光标键选择您的接入点，然后按右箭头键编辑其属性。\n\n> 如果您看到未检测到无线网络的消息，请尝试按\
  \ P 打开首选项窗口，并在无线接口字段中输入 wlan0。\n\n一旦进入无线网络配置首选项屏幕，您只需在密钥字段中输入密码即可。按 F10 保存设置。\n\n\
  \n\n如果你使用有线连接来设置无线连接，你需要按下 C，这将连接到接入点。留意你的 Wi-Fi 上的状态 LED（如果有的话）。你应该会看到它开始闪烁，几秒钟后它会变得常亮，这意味着连接已建立。此时，SSH\
  \ 会话很可能会中断，因为有线连接会被禁用。你应该拔掉有线连接，并使用无线 IP 或主机名重新连接。\n\n> 可以通过 Web 界面登录路由器并查看 DHCP\
  \ 列表来找到无线 IP。\n\n## 静态网络地址\n\n有些路由器的 DHCP 服务器倾向于不时更改你的私有地址。设置静态私有地址是防止这种情况发生的快速方法，而且更容易记住\
  \ IP 地址是什么。\n\n然而，许多较新的路由器能够在 DHCP 设置中分配首选 IP 地址，或根据设备的 MAC 地址自动分配长期 IP。长期 IP 通常意味着路由器被重置为出厂默认设置，或它将耗尽\
  \ IP 地址并替换 DHCP 列表中最旧的条目。\n\n使用大多数家用路由器时使用静态地址的弊端是路由器可能不知道此设备。原因在于它必须无休止地扫描整个网络，从而占用宝贵的资源。如果\
  \ DNS 服务未通告 Raspberry Pi 的 IP 地址，你将无法使用其主机名（默认为 `raspberry`），而必须输入完整的 IP 地址。此外，如果你想将\
  \ Raspberry Pi 用作媒体中心，它将花费更长时间或甚至可能不会出现在网络列表中。最糟糕的是，如果设备不在 DHCP 客户端列表中，一些路由器将不允许你将端口转发到你的\
  \ Raspberry Pi。\n\n最好始终让 DHCP 服务器控制网络上的 IP 地址分配，以便与其并行运行的 DNS 服务器能够正常工作。使用 `wicd-curses`\
  \ 设置静态 IP 地址很容易，但你也可以在路由器上禁用 DHCP 和 DNS，并使用 Raspberry Pi 作为独立的防火墙、DHCP 和 DNS 服务器。\n\
  \n本书未涵盖设置自己的 DHCP 和 DNS，因为该主题本身根据你的需求可能需要数章篇幅。\n\n## 测试和基准测试你的网络\n\n这些是可执行的必要测试，用于排查网络问题。\n\
  你也可以使用这些高级技术来基准测试你的网络。\n\n### 基础测试\n\n检查是否已连接到互联网的最简单方法是 ping 远程地址。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_45_0.png)\n\
  \n> 以下测试是在 Wi-Fi 上进行的，不仅是为了测试 Wi-Fi 连接的可靠性，也是为了实现最佳稳定性；始终建议使用以太网连接。这些示例演示了使用 Wi-Fi\
  \ 时可能遇到的各种瓶颈。\n\n我们可以 ping http://www.google.com，但我们也可以使用简写和易于记忆的 IP 地址，例如 8.8.8.8，这是\
  \ Google 的公共 DNS 服务器。此 IP 地址将解析到你所在区域最近的 Google DNS 服务器，即使它宕机，也有许多备份服务器，使其成为可靠的测试：\n\
  \n```\nping -c 1 google.com\nping -c 1 8.8.8.8\n```\n\n```\nroot@nas:~# ping -c\
  \ 1 www.google.com\nPING www.google.com (31.55.166.217) 56(84) bytes of data.\n\
  64 bytes from 31.55.166.217: icmp_req=1 ttl=57 time=16.7 ms\n\n--- www.google.com\
  \ ping statistics ---\n1 packets transmitted, 1 received, 0% packet loss, time 0ms\n\
  rtt min/avg/max/mdev = 16.720/16.720/16.720/0.000 ms\nroot@nas:~#\nroot@nas:~#\n\
  root@nas:~# ping -c 1 8.8.8.8\nPING 8.8.8.8 (8.8.8.8) 56(84) bytes of data.\n64\
  \ bytes from 8.8.8.8: icmp_req=1 ttl=43 time=31.1 ms\n\n--- 8.8.8.8 ping statistics\
  \ ---\n1 packets transmitted, 1 received, 0% packet loss, time 0ms\nrtt min/avg/max/mdev\
  \ = 31.118/31.118/31.118/0.000 ms\nroot@nas:~#\n```\n\nping 可以帮助你确定是否可以访问互联网。你可能想检查向\
  \ Raspberry Pi 下载文件的速度。我们将使用热门网站 http://www.speedtest.com 来帮助我们直接在命令行中执行此操作。这可以用一行表示：\n\
  \n```\nwget --output-document=/dev/null\n    http://speedtest.wdc01.softlayer.com/downloads/test500.zip\n\
  ```\n\n我的 Raspberry Pi 连接到一个快速的无线网络连接，该连接连接到一个 75 兆比特下行能力 ISP。在下面的屏幕截图中，你可以看到我实现了大约\
  \ 4.27 兆字节。这因站点而异。这里使用的服务器位于美国。\n\n```\nroot@nas:~# wget --output-document=/dev/null\
  \ http://speedtest.wdc01.softlayer.com/downloads/test500.zip\n--2013-09-02 22:38:56--\
  \  http://speedtest.wdc01.softlayer.com/downloads/test500.zip\nResolving speedtest.wdc01.softlayer.com\
  \ (speedtest.wdc01.softlayer.com)... 208.43.102.250\nConnecting to speedtest.wdc01.softlayer.com\
  \ (speedtest.wdc01.softlayer.com)|208.43.102.250|:80... connected.\nHTTP request\
  \ sent, awaiting response... 200 OK\nLength: 524288000 (500M) [application/zip]\n\
  Saving to: '/dev/null'\n\n2% [>                                                \
  \                                         ] 14,135,558  4.27M/s   eta 2m 21s\n```\n\
  \n### 高级基准测试工具\n\n你可能对网络性能更感兴趣。以下是一些将网络推向最大极限的高级方法。\n\n### 速度测试应用程序\n\nGitHub 上有一个速度测试应用程序可用。它提供的选项比我们之前使用的命令行技术更先进，因为它会自动选择最近的服务器并从那里下载大文件。使用最近服务器的好处将更好地展示你的无线网络或使用有线连接时的\
  \ ISP 下行最大容量。\n\n此外，该应用程序还对你的上行带宽进行基准测试。如果你考虑为公共互联网使用托管应用程序，这可能对你很重要。\n\n我们需要使用\
  \ aptitude 的包管理器安装 git。我们通过在命令行中输入 apt-get 来执行此操作：\n\n```\nsudo apt-get install\
  \ git-core\n```\n\n按照屏幕上的说明安装 git 包。使用 /tmp 目录非常适合短期应用程序。Raspbian 中的此目录在每次重启或断电时都会被清除。如果你希望将速度测试应用程序保留供将来使用，请在主目录中创建一个新目录并相应地更新路径：\n\
  \n```\ncd /tmp\ngit clone https://github.com/sivel/speedtest-cli.git\ncd speedtest-cli\n\
  ./speedtest_cli.py\n```\n\n### iPerf\n\niPerf 是网络管理员的秘密工具，已包含在 Raspbian 中。它是一种通过创建\
  \ TCP 和 UDP 流来测试网络的工具。iPerf 具有客户端和服务器功能，因此需要另一台计算机，即服务器。这可以是另一台安装了 iPerf 的 Raspberry\
  \ Pi 或计算机。\n\n此应用程序将推动你的网络接口和架构的极限。你也可以使用 iPerf 检测复杂网络，例如互联网中的丢包。如果你在互联网上有虚拟机，请尝试在上面安装\
  \ iPerf 并将你的本地网络结果与互联网上的结果进行比较。让我们在 Raspberry Pi 和远程计算机上安装 iPerf：\n\n```\nsudo apt-get\
  \ install iperf\n```\n\n服务器将侦听连接类型，因此输入以下内容：\n\n```\niperf -s\n```\n\n客户端将显示与所执行测试相关的所有统计信息：\n\
  \n```\niperf -c <ip address of server or domain name of public server>\n```\n\n\
  ## 推荐带宽\n\n对于任何低使用托管，推荐的基本带宽为 256 千比特的上行和下行。你可以用 64 千比特应付个人使用，例如基本网站或传输 JSON 等文本数据。\n\
  \n家庭 ISP 提供商提供远大于此的下行带宽已成为标准做法，随着许多国家将互联网重新分类为公共事业，访问互联网应该比以前更快、更容易。但家庭和企业套餐之间有一个主要区别：当尝试向互联网上的用户提供内容时，上行带宽很重要。通常，家庭互联网的上行带宽仅为下行带宽的一小部分，而企业通过购买同步\
  \ DSL（SDSL）可获得更大比例的上行带宽，有时甚至相等。\n\n\n\n\n如果你计划使用 Asterisk 进行 VoIP，微小的上行带宽可能会导致严重的延迟和抖动。但\
  \ Asterisk 附带了许可的 GSM 编解码器，对于单次通话，上行带宽为 64 千比特即可工作。你可以购买闭源编解码器，它们可以在更慢的连接上工作，但会以语音质量为代价。\n\
  \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_48_0.png)\n\n## Internet 配置\n\n在成功托管任何类型的\
  \ Internet 应用之前，需要解决一些障碍。解决方案受 ISP 为你提供的套餐影响，但几乎每个问题都可以找到变通方法。\n\n## 家用套餐\n\n家用套餐最基本的部分是你几乎总是拥有一个动态\
  \ IP 地址。IPv6 的日益普及旨在通过为你的所有设备分配一个 IPv6 地址来消除这个问题，任何知道该地址的人都可以从世界任何地方访问。一些 ISP 会允许你升级到静态\
  \ IP，但仍可能存在一些限制。拥有动态 IP 的问题在于它可能会在没有通知的情况下更改。因此，如果你某天尝试使用该 IP 从 Internet 访问你的网络，它肯定会在一段时间后停止工作。这个租期因\
  \ ISP 而异，因为有些租期短至几个小时，而其他租期可长达数年。如果你身处偏远地区而不知道当前的 Internet IP 地址，查明它会相当不方便。\n\n\
  最为人所知的解决方案之一是使用动态 DNS 服务。许多 Internet 路由器都会提供某种动态 DNS 设置，甚至你 ISP 提供的路由器也不例外。动态 DNS\
  \ 客户端是一个程序，可自动更新公共域名 的 DNS 记录。有少数免费的动态 DNS 服务。\n\n## 企业套餐\n\n企业套餐几乎总是包含静态 IP 地址或购买选项。这确实省去了为家用套餐需要应用的变通方法的大量工作。你可以使用\
  \ ISP 提供的 IP 地址，但在极少数情况下，它可能会更改为另一个 IP；不过，你会提前收到警告。\n\n其他好处是 ISP 会允许你更改 IP 的反向 DNS\
  \ 查找，这项服务在家庭套餐中不可用。如果计划运行小型邮件服务器，这项服务非常重要。这是需要配置的前提条件之一，以便其他邮件域知道你的身份。在家解决此问题的唯一方法是使用付费邮件交换，使用自定义域名发送和接收电子邮件。\n\
  \n许多企业套餐提供无限且未整形的流量。ISP 可能会故意限制家庭宽带连接上的某些端口，使其变慢且可靠性降低。一些 ISP 会采取极端措施，在家庭套餐上阻止这些端口；例如，端口\
  \ 25、80、110 和 443 用于邮件和 Web 服务器。\n\n如果你计划将 Raspberry Pi 用于一些家庭实验、私人使用或教育目的，那么你需要做的就是花一些额外时间正确配置一切。但请注意，在家庭宽带上托管生产服务可能会违反你的合同条款和条件。如果你预计使用量很高，购买企业套餐是更好的选择。\n\
  \n## 动态 DNS\n\n动态 DNS 是更新公共 DNS 名称记录的一种方式。付费解决方案通常提供实时更新，而免费服务在更改发布前有最短时间。\n\n我一直在使用\
  \ NO-IP 的付费服务，其价格对于提供的功能来说相当合理。它还提供免费域名和服务。它还为许多操作系统提供客户端，包括兼容 Raspbian Linux 的客户端。你可以使用任何你喜欢的服务，因为协议对每个人都相同。\n\
  \n## 安装客户端\n\n我在 NO-IP 注册了一个高级账户。我分配了一个名为 pi.kula.solutions 的子域名。它自动检测到我的公共 IP 并相应地设置了域名的记录。\n\
  \n> 访问 http://www.mxtoolbox.com 以验证域名记录的实时更改。它还有其他几个有用的工具。\n\n一旦你创建了动态 DNS 账户，你就可以在\
  \ Raspberry Pi 上安装客户端。在安装过程中，系统会要求你提供凭据以及要更新的域名。\n\n> make -j4 命令可加快 Raspberry Pi\
  \ 2 上的编译时间。如果你没有使用它，请不要使用 -j4。\n\n安装客户端的命令如下：\n\n```\nmkdir /home/pi/noip\ncd /home/pi/noip\n\
  wget http://www.no-ip.com/client/linux/noip-duc-linux.tar.gz\ntar xzvf noip-duc-linux.tar.gz\n\
  cd noip-{version}\nsudo make -j4\nsudo make install\n```\n\n运行 make 安装后，系统会提示你使用\
  \ No-IP 账户用户名和密码登录。间隔必须为 5 分钟或更长。现在你可以启动服务：\n\n```\nsudo /usr/local/bin/noip2\n\
  ```\n\n现在你有一个指向家庭 IP 地址的域名。随着本书的进展，你可能想测试各种应用程序，为此你需要在路由器上开放端口。\n\n不幸的是，配置路由器不在本书范围内，因为每个厂商的处理方式不同。请参阅随路由器附带的说明书，了解如何开放和转发端口。开放不必要的端口会使你面临更高的被黑客攻击风险。\n\
  \n## 免费动态 DNS 域名的变通方法\n\n你可能不喜欢动态 DNS 提供商提供的域名，或者你可能负担不起高级服务。相反，你可能想使用你已经拥有的但托管在其他地方的域名。我拥有另一个未在\
  \ NO-IP 注册的域名，称为 http://www.piotrkula.com。我将以此为例，使用免费的 NO-IP 域名（如 http://randomname.no-ip.me）通过\
  \ http://pi.piotrkula.com/ 访问我的 Raspberry Pi。\n\n登录你的域名 DNS 面板，并添加一个新子域名。编辑 DNS\
  \ 记录，并确保它们没有任何关联的 A 记录。你需要添加一个新的 CNAME 记录及其值；在我的例子中，它是 randomname.no-ip.me。\n\n\
  现在 http://pi.piotrkula.com/ 域名会告诉访客改查看 randomname.no-ip.me 的 DNS 记录。访客将在 NO-IP 处找到一个\
  \ A 记录，这将告诉他们正确的 IP 地址，即你的家庭 IP 且端口 80 转发到 Raspberry Pi。这不是重定向，顶级域名不会更改。访客甚至不会知道你在使用动态\
  \ DNS，除非他们检查你的私有域名记录并追踪该 CNAME 属于动态 DNS 公司。但只要域名正常工作，就没有理由去检查它。\n\n使用此变通方法的唯一缺点是速度。每当访客首次查找\
  \ DNS 记录时，建立连接可能需要几秒钟。首次请求后，一切都很顺利，因为客户端通常会在会话期间缓存 IP，无论你的 A 记录上设置了什么 TTL。每次新会话都可能出现此延迟，因为\
  \ TTL 迫使客户端再次读取 DNS。一些动态 DNS 提供商甚至可能会故意减慢 DNS 查找速度，希望你升级到付费 DNS 服务器以获得高级服务。据我所知，NO-IP\
  \ 从未这样做，即使我使用免费域名时也表现得非常快。\n\n## 摘要\n\n了解你的网络如何配置非常重要；这包括 Internet 端和本地网络。这种深入的理解肯定会帮助你自行排查特定问题。\n\
  \n我们现在已将 Raspberry Pi 连接到私有网络，并配置了一个可供 Internet 上任何人访问的域名。\n\n在接下来的几章中，你将了解更多可通过\
  \ Internet 提供给朋友的各种服务。\n\n\n"
- "## 3 配置额外功能\n\nBroadcom 芯片上有一些额外功能，可以直接使用或通过购买额外许可证激活。其中许多功能未有文档记录，是由在各种 Raspberry\
  \ Pi 项目上工作的开发者或爱好者发现的。\n\n在本章中，您将学习如何保持 Raspberry Pi 保持最新状态，以及如何使用 GPU 的额外功能。\n\n\
  ### 更新 Raspberry Pi\n\nRaspberry Pi 本质上具有三个软件层：闭源的 GPU 启动过程、引导加载程序（也称为固件）和操作系统。在本书撰写时，我们无法更新\
  \ GPU 代码。但也许有一天，Broadcom 或硬件黑客会告诉我们如何做到这一点。\n\n这就剩下固件和操作系统软件包了。Broadcom 会定期以预编译的二进制文件向\
  \ Raspberry Pi 基金会发布固件更新，后者再将其发布给公众。基金会和其他社区成员负责 Raspbian，并通过 aptitude 仓库发布更新；这就是我们获取所有精彩应用程序的地方。\n\
  \n保持固件和软件包的最新状态至关重要，这样您才能从 Broadcom 芯片的错误修复以及新功能或改进功能中受益。\n\nRaspberry Pi 2 使用 ARMv7，而\
  \ Pi 1 使用 ARMv6。建议使用最新版本的 Raspbian 发布版以受益于速度提升。得益于升级到 ARMv7，它现在还支持标准的 Debian 硬浮点软件包和其他\
  \ ARMv7 操作系统，例如 Windows IoT Core。\n\n### 更新固件\n\n更新固件过去曾是一个相当复杂的过程，但由于 GitHub 上一位化名为\
  \ Hexxeh 的用户，我们有了一些代码可以自动为我们完成此操作。您不需要像 `apt-get update` 那样频繁运行它，但如果您不断升级操作系统，如果建议这样做或您遇到新功能或不稳定问题时，可能需要运行它。\n\
  \n`rpi-update` 命令现在作为 Raspbian 映像的标准组件包含在内，我们可以简单地运行以下命令：\n\n```\nsudo rpi-update\n\
  ```\n\n过程完成后，您需要重新启动 Raspberry Pi 以加载新的固件。\n\n### 更新软件包\n\n保持 Raspbian 软件包为最新状态也很重要，因为许多更改可能会与固件中发布的修复程序一起工作。首先，我们将更新源列表，该列表会将软件包列表及其版本下载到\
  \ aptitude 缓存中。然后，我们将运行 `upgrade` 命令，该命令将比较已安装的软件包并比较其依赖关系，然后相应地下载并更新它们：\n\n```\n\
  sudo apt-get update\n```\n\n```\nsudo apt-get upgrade\n```\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_54_0.png)\n\
  \n> 更新某些软件包如果库中有重大更改，可能会破坏您现有的自定义代码或应用程序。如果您正在运行自定义代码，在更新之前应始终查看发行说明，看看是否需要在代码中进行更改。\n\
  \n### 更新发行版\n\n我们可能会发现，运行固件更新过程和软件包更新并不总是能解决特定问题。\n\n如果您使用的是 `debian-armhf` 等发行版，可以使用以下命令而无需重新设置一切：\n\
  \n```\nsudo apt-get dist-upgrade\n```\n\n```\nsudo apt-get install raspberrypi-ui-mods\n\
  ```\n\n### 结果\n\n如果您有一个长期运行或生产项目将独立运行，不建议不时登录来更新软件包。在 Linux 中，配置系统后让其在长时间内无需任何软件维护运行是可以接受的。您应该注意关键更新，并评估是否需要安装它们。例如，考虑\
  \ SSH 中的重大 Heartbleed 漏洞。如果您有一台 Raspberry Pi 直接连接到公共互联网，这将需要立即采取行动。\n\nWindows 用户习惯于频繁更新，很少出现问题。但在\
  \ Linux 中，运行更新会更新您的软件和操作系统组件，这可能会与其他自定义软件不兼容。例如，您使用了一个开源 CMS 网络应用程序来托管一些文章。它专门为\
  \ PHP 版本 x 设计，但升级到版本 y 也需要整个 CMS 系统升级。有时，较不受欢迎的开源来源可能需要几个月的时间才能重构代码以使用最新的 PHP 版本，因此他们可能在不知情的情况下升级到最新的\
  \ PHP 或部分破坏您的 CMS。\n\n一种解决方法是克隆您的 SD 卡并在一张卡上执行更新。如果遇到任何问题，您可以轻松返回并使用另一张 SD 卡。\n\n\
  一个名为 CentOS 的发行版试图通过每年发布一次更新来解决这个问题。其目的是确保每个人都有足够的时间在您进行完整更新时测试他们的软件，而不会出现最小或甚至没有破坏性更改。不幸的是，CentOS\
  \ 没有 ARM 支持，但您可以遵循这一指导原则，在需要时更新软件包。\n\n### 硬件看门狗\n\n硬件看门狗是一个数字时钟，需要在达到特定时间之前定期重新启动。\n\
  \n就像电视剧《迷失》中一样，岛上隐藏着一个死人开关，需要定期按下；否则，将开始一个未知事件。就 Broadcom GPU 而言，如果开关未被按下，则意味着系统已停止响应，反应事件是重新启动\
  \ Raspberry Pi 并重新加载操作系统，希望至少暂时解决该问题。\n\nRaspbian 包含一个用于处理看门狗硬件的内核模块——默认情况下处于禁用状态——。一个在软件层上运行的可配置守护进程会通过内核模块向看门狗发送定期事件（例如按下按钮），称为心跳。\n\
  \n### 启用看门狗和守护进程\n\n要让一切正常运行，我们需要做以下几件事：\n\n- 1. 在控制台中添加以下内容：\n  ```\n  sudo modprobe\
  \ bcm2708_wdog\n  sudo vi /etc/modules\n  ```\n- 2. 在文件中输入文本行 bcm2708_wdog。然后通过按\
  \ Esc 并输入 :wq 命令保存并退出。\n- 3. 接下来，我们需要安装守护进程，该守护进程每 10 秒发送一次心跳信号。我们使用 chkconfig，将其添加到启动过程中，然后启用它，如下所示：\n\
  \  ```\n  sudo apt-get install watchdog chkconfig\n  sudo chkconfig --add watchdog\n\
  \  chkconfig watchdog on\n  ```\n- 4. 现在我们可以配置守护进程以执行简单检查。编辑以下文件：\n  ```\n  sudo\
  \ vi /etc/watchdog.conf\n  ```\n- 5. 通过删除哈希（#）字符取消注释行 max-load-1 = 24 和 watchdog-device。最大负载意味着完成任务需要\
  \ 24 个 Pi 在 1 分钟内。在正常使用中，这永远不应该发生，只有在 Raspberry Pi 挂起时才会真正发生。\n- 6. 现在您可以使用此配置启动看门狗。每次更改某些内容时，您都需要重新启动看门狗：\n\
  \  ```\n  sudo /etc/init.d/watchdog start\n  ```\n\n配置文件中还有一些其他示例可能引起兴趣。\n\n###\
  \ 测试看门狗\n\n在 Linux 中，您可以使用命令行上的 & 字符轻松将函数放入单独的线程中，在新进程中运行。利用此功能以及一些匿名函数，我们可以发出非常粗糙但有效的系统停止。这是测试看门狗守护进程是否正常工作的快速方法，不应用于停止\
  \ Raspberry Pi。它被称为 fork 炸弹，许多操作系统都容易受到此攻击。\n\n看似随机的字符序列实际上是创建其他新匿名函数的匿名函数。这是一个无休止且不可控的循环。它很可能采用炸弹这个名字，因为一旦开始就无法停止。即使您尝试杀死原始线程，它也会创建多个需要被杀死的线程。根本不可能停止，最终它会将系统炸入关键状态，也称为堆栈溢出。输入这些字符到命令行并按\
  \ Enter：\n\n```\n: () { : | : & } ; :\n```\n\n按 Enter 后，Raspberry Pi 应在大约 30 秒后重新启动，但可能需要长达一分钟。\n\
  \n### 启用额外解码器\n\nBroadcom 芯片实际上具有用于编码和解码其他几种知名格式的额外硬件。Raspberry Pi 基金会未包含这些许可证，因为他们希望将成本降至最低，但他们已包含\
  \ H.264 许可证。这使您可以在电视上观看高清媒体、使用网络摄像头模块或转码媒体文件。\n\n他们确实为用户提供了一种购买单独许可证的方式，如果您想使用这些额外编码器或解码器。\n\
  \n在撰写本文时，使用这些硬件编解码器的唯一项目是 XBMC 维护的 OMXPlayer 项目。最新的 Raspbian 软件包已包含 omx 软件包。\n\n\
  ### 购买许可证\n\n您可以前往 http://www.raspberrypi.com/license-keys/ 购买许可证，每个设备只能使用一次。按照网站上的说明获取您的许可证密钥。\n\
  \n\n\n## MPEG-2\n\n被称为 H.222/H.262，它是数字电视、有线电视和卫星电视广泛使用的视频和音频编码标准。它也是用于在 DVD 上存储视频和音频数据的格式。\n\
  \n这意味着从 USB DVD-ROM 驱动器观看 DVD 应该可以在没有任何 CPU 开销的情况下完成。不幸的是，没有任何软件包可以直接使用此硬件。但希望在不久的将来，这将像购买此许可证一样简单，这将使我们能够轻松观看\
  \ DVD 或以此格式流式传输视频。\n\n## VC-1\n\nVC-1 正式名称为 SMPTE 421M，由 Microsoft 开发。今天，它是 Xbox\
  \ 和 Silverlight 框架中使用的官方视频格式。该格式受 HD-DVD 和 Blu-ray 播放器支持。\n\n此编解码器的唯一用途是观看 Silverlight\
  \ 打包的媒体；多年来其受欢迎程度有所增长，但仍然不是很受欢迎。如果您想使用 Windows 10 IoT API 流式传输视频，则可能需要购买此编解码器。\n\
  \n## 硬件监控\n\n树莓派基金会提供了一个名为 vcgencmd 的工具，可为您提供有关树莓派中各种硬件的详细数据。该工具会不时更新，可用于记录 GPU\
  \ 温度、电压水平、处理器频率等。以下是一些监控命令：\n\n- 要查看支持的命令列表，我们在控制台中输入以下内容：\n  `vcgencmd commands`\n\
  - 随着新版本的发布，这里将提供更多命令。要检查当前 GPU 温度，我们将使用以下命令：\n  `vcgencmd measure_temp`\n- 我们可以使用以下命令检查\
  \ RAM 在 CPU 和 GPU 之间的分配情况：\n  `vcgencmd get_mem arm/gpu`\n- 要检查固件版本，我们可以使用以下命令：\n\
  \  `vcgencmd version`\n\n所有这些命令的输出都是可以解析并显示在网站上或存储在数据库中的简单文本。\n\n## 总结\n\n树莓派拥有功能强大的\
  \ GPU 和 ARM 系统级芯片（SOC），其功能可能尚未公开或发现。开源开发受到阻碍的原因是 Broadcom 保持许多方面为闭源；即使有人瞥见一些源代码，他们也会执行严格的保密条款和条件。Raspbian\
  \ 已经成熟了几年，自硬件首次发布以来已开发出许多改进。树莓派周围仍然存在强烈的炒作，这吸引了你、我和成千上万的人来到这个黑客空间。\n\n本章的目的是教您硬件如何依赖良好的软件，但最重要的是向您展示如何使用现成的软件包利用硬件。\n\
  \n在下一章中，我们将研究如何配置 Web 服务器和数据库。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_59_0.png)\n\
  \n供参考，您可以访问以下链接：\nhttp://www.elinux.org/RPI_vcgencmd_usage\n"
- "## 4 使用快速 Web 服务器和数据库\n\n## \n\n得益于其四核架构，Raspberry Pi 2 现在作为 Web 服务器的工作效果更好。本章中描述的所有内容仍然与\
  \ Raspberry Pi 1 兼容，但在此运行的任何性能测试严格适用于 Raspberry Pi 2。本章将涵盖以下主题：\n\n- Apache 与 nginx\
  \ 与 Kestrel 对比\n- nginx 的额外框架\n- 安装数据库\n\n## Apache 与 nginx 与 Kestrel 对比\n\n随着 .NET\
  \ 5 的发布，Microsoft 已成功将完整的 C# 部署目标堆栈带到 Linux。诸如流行的 ASP.MVC 之类的 ASP Web 应用程序可以通过使用\
  \ Kestrel 在 Linux 上托管，Kestrel 是一个基于 libuv 的开发 Web 服务器。Libuv 主要为 Node.js 开发，专注于异步输入/输出。\n\
  \nNginx 仍然是嵌入式设备中管理 HTTP 流量的首选，因为它是一个极其快速且轻量级的反向代理服务器，优于 Apache。\n\nApache 仍然是最受欢迎的\
  \ HTTP 服务器之一，因为它随镜像一起捆绑，而且也非常易于安装和配置。然而，它通常用于完整的桌面机器或服务器，因为它需要大量资源。不建议在 Raspberry\
  \ Pi 或其他嵌入式设备上使用 Apache，本书中也不会涵盖它。\n\n从 Netcraft 报告中，我们可以看到前三大服务器是 Apache、Microsoft\
  \ 和 nginx。Microsoft 一直在努力超越 Apache，但在 2014 年 8 月，在过去 10 年中首次，他们成功在一个月内获得了第一名。这很可能导致\
  \ ASP.NET 5 在 beta 版本 1 发布，数百万开发者涌入测试 ASP.NET 在 Linux、Macintosh 和 Windows 上的运行。\n\
  \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_62_0.png)\n\n为了实现完全的灵活性，我们将配置 nginx 作为前端\
  \ HTTP 代理，这将使我们能够同时运行各种编程语言的组合。Nginx 将允许我们托管生产就绪的服务器。对于托管网站，nginx 几乎没有限制，在本章中，我将演示其中最受欢迎的一些。Nginx\
  \ 本身非常适合提供静态文件，例如 HTML、JavaScript 或图像。\n\n## 安装 nginx\n\n安装 nginx 的最简单方法是使用 apt-get。不幸的是，wheezy\
  \ 仓库只有 1.2 版本的软件包：\n\n```\nsudo apt-get update\nsudo apt-get install nginx\n```\n\
  \n> 要升级到更高版本的 nginx，请按照第 6 章《设置游戏服务器》中的选择性升级说明进行操作。然后，使用 -t jessie 开关重新安装 nginx。\n\
  \n默认情况下，nginx 从 /usr/share/nginx/www 提供页面，但大多数 Linux 管理员更熟悉 /var/www 位置。只要您选择一个约定并坚持使用它，文件保存在哪里并不重要。我们将在本章中使用\
  \ /var/www：\n\n```\nsudo mkdir /var/www\n```\n\n在此目录内，我们将创建更多目录来保存各种虚拟主机。虚拟主机是域名（在\
  \ nginx 中称为 server blocks），它们告诉 Web 服务器有关请求域或子域的配置。我们最初将创建一个名为 html 的目录和一个名为 web\
  \ 的目录来保存静态文件，但稍后会添加新的 location 块，称为虚拟目录：\n\n```\nsudo mkdir /var/www/html\n```\n\
  \n```\nsudo mkdir /var/www/html/web\n```\n\n## 配置 nginx 虚拟主机\n\n在 nginx 中，虚拟主机是一组称为\
  \ server blocks 的规则，指定如何为指定域提供 HTTP 流量。在我们的配置中，我们将在端口 80 上为任何域提供内容。您可以使用具有特定域名的单独\
  \ server blocks 为不同的域或子域提供服务，这需要更多配置，本书中未涵盖。\n\nNginx 使用目录 /etc/nginx/sites-available/\
  \ 来存储虚拟主机的配置文件。启动时，它会检查另一个目录 /etc/nginx/sites-enabled/，通常这些文件是 sites-available 中配置文件的符号链接。如果文件存在于那里，它将加载配置文件。\n\
  \n应该有一个名为 default 的文件，这是 nginx 提供服务的默认网站。我们将删除默认网站的符号链接，创建一个新的配置文件和符号链接，最后重新启动 nginx：\n\
  \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_63_0.png)\n\n> 我们将使用符号名称 nginxhtml，但您可以随意为虚拟主机使用任何名称。\n\
  \n```\nsudo service nginx stop\n```\n\n```\nsudo unlink /etc/nginx/sites-enabled/default\n\
  ```\n\n```\nsudo touch /etc/nginx/sites-available/nginxhtml\n```\n\n编辑位于 `/etc/nginx/sites-available/nginxhtml`\
  \ 的配置文件并添加以下内容：\n\n```\nserver {\n    listen 80 default_server;\n\n    location\
  \ / {\n        root /var/www/html/web;\n        index index.html;\n    }\n}\n```\n\
  \n这是为任何浏览器提供标准静态文件最基本的配置。这足以让我们使用 jQuery 运行客户端脚本，该脚本将使用 AJAX 请求我们稍后在本章中创建的 API。让我们启用网站：\n\
  \n```\ncd /etc/nginx/sites-enabled\nsudo ln -s /etc/nginx/sites-available/nginxhtml\n\
  sudo service nginx start\n```\n\n要开始提供基本页面，请按照以下步骤操作：\n\n- 1. 在 `/var/www directory`\
  \ 中创建一个名为 `index.html` 的文件名。\n- 2. 在其中放置一些基本的 HTML 标记（请查看代码文件夹，其中包含完整的示例文件，其中包含\
  \ jQuery 下载说明以及调用我们将创建的各种 API 的示例）。\n- 3. 在可以访问您的 Raspberry Pi 的网络上的另一台计算机上使用浏览器，并输入地址\
  \ `http://raspberrypi` 或 `http://your.pi.ip.address`。\n- 4. 您现在应该可以看到您的基本网页。\n\n\
  每次配置更改后，我们都应通过键入以下命令行重新加载 nginx：\n\n```\nservice nginx reload\n```\n\n如果您收到 `start\
  \ failed`，您可以运行以下命令来测试配置文件，这将显示任何错误及其详细信息：\n\n```\nsudo nginx -c /etc/nginx/nginx.conf\
  \ -t\n```\n\n\n\n## Nginx 的额外框架\n\n现在 nginx 已经运行起来，我们有多种框架或编程语言可供选择，可用于创建程序以向我们的基本\
  \ HTML 页面公开 API。\n\n我们将利用 nginx location 块（虚拟目录），以便混合搭配编程语言，使用 jQuery JavaScript\
  \ 向简单的 HTML 页面提供丰富的内容。\n\n## Python API\n\nPython 已预装在 Raspbian 中，是 Raspberry Pi\
  \ 的首选编程语言。它拥有丰富的库，可让你访问 GPIO 和其他系统软件，并且在互联网上可获得大量文档。\n\n它是一种易于学习的入门语言，因为你可以用比 C++\
  \ 或 Java 更少的代码行创建应用程序。你需要明白 Python 是一种编程语言，而不是 Web 内容交付框架。话虽如此，通过编写特定响应，仍然可以用 Python\
  \ 交付 Web 内容。这将使我们能够利用 Python 编程语言创建简单的 API，为调用 API URL 的任何其他软件提供数据。\n\n### 执行 Python\n\
  \n你可以在终端执行任何 Python 脚本，但 nginx 无法直接执行 Python 脚本。为此，我们需要安装 uWSGI。我们将配置一个新的 location\
  \ 块，让 uWSGI 代替 nginx 执行 Python， resulting 文本将发送回客户端。我们将使用直接从其网站下载的最新版 uWSGI。这将在\
  \ `/home/pi` 目录中构建并放置必要的文件。在 Raspberry Pi 2 上编译大约需要 80 秒：\n\n```\ncd /home/pi\n\
  sudo curl http://uwsgi.it/install | bash -s cgi /home/pi/uwsgi\n```\n\n这会将 uWSGI\
  \ 二进制文件放置在 /home/pi 中，我们需要在该目录中为 uWSGI 创建一个配置文件。创建一个名为 uwsgi_config.ini 的文件并输入以下文本：\n\
  \n```\n[uwsgi]\nplugins = cgi\nsocket = 127.0.0.1:9000\nchdir = /usr/lib/cgi-bin/\n\
  ```\n\n```\nmodule = pyindex\ncgi=/cgi-bin=/usr/lib/cgi-bin/\ncgi-helper =.py=python\n\
  ```\n\n实际的 Python 脚本文件将位于 `/usr/lib/cgi-bin` 而不是 `/var/www/`，因为 `nginx` 并不会真正执行\
  \ Python 文件；它将执行重定向到 `uWSGI`。我们还需要在 `uWSGI` 配置文件中将 `nginx` location 块 `/cgi-bin`\
  \ 映射到 `/usr/lib/cgi-bin`。现在我们可以使用配置启动 `uWSGI` 进程。这会阻塞你的终端；它必须一直运行，以便 `nginx` 能够与守护进程通信。打开一个新的终端或在\
  \ `screen` 中运行：\n\n```\ncd /home/pi\nsudo ./uwsgi ./uwsgi_config.ini\n```\n\n接下来，我们将为默认服务器添加一个新的\
  \ location 块，专门用于 Python 的执行。这个新的 location 块也称为虚拟目录，其中对位置 http://raspberrypi/cgi-bin\
  \ 的每个请求实际上都会要求 `uWSGI` 在 `/usr/lib/cgi-bin` 目录中执行 Python 文件。\n\n在现有的 `nginxhtml`\
  \ 文件中，在之前的 location 块下添加以下 location 块：\n\n```\nlocation / {\n    include uwsgi_params;\n\
  \    uwsgi_modifier1 9;\n    uwsgi_pass 127.0.0.1:9000;\n}\n```\n\n在 `/usr/lib/cgi-bin`\
  \ 中，我们将创建一个名为 `temp.py` 的文件，它将简单地为浏览器返回一个 HTTP 头和 CPU 温度文本。这里缩进很重要，因为它定义了函数块：\n\n\
  ```\n#!/usr/bin/env python\nimport os\n### Return CPU temperature as a character\
  \ string\ndef getCPUtemperature():\n    res = os.popen('vcgencmd measure_temp').readline()\n\
  \    return(res.replace(\"temp=\",\"\").replace(\"'C\\n\",\"\"))\n\n#We have to\
  \ print a valid HTTP header first so the browser\n#will know how to decode the data\n\
  print \"Content-type: text/html\\n\\n\"\ntempl=float(getCPUtemperature())\nprint\
  \ templ\n```\n\n我们需要做的最后一件事是使 Python 脚本可执行：\n\n```\nchmod +x temp.py\n```\n\n如果你重新加载使用提供的示例代码的网页，你现在应该能在\
  \ Python 段落中每秒看到 Raspberry Pi 的温度刷新。你也可以通过在浏览器中导航到 http://raspberrypi/cgi-bin/temp.py\
  \ 来测试它。\n\n这是一个极其基础的示例，说明如何以 Web API 的方式从 Python 提供数据。这不是标准的 Web API JSON/XML 实现，但它极其轻量且快速，是通过\
  \ HTTP 请求提供数据的一种简便方法。\n\n## Node.js\n\nNode.js 是一个基于 Google V8 JavaScript 引擎构建的平台，使用事件驱动和非阻塞\
  \ I/O。\n\n它被称为 JavaScript Web 编程语言。表面上这是正确的，但在 Node.js 二进制的深处，它使用 C/C++ 来访问本地系统资源，然后用\
  \ JavaScript 编写的标准模块（文件系统、网络缓冲、密码学、数据流等）公开 API，你可以从中扩展自己的应用程序。你永远不需要实际编写任何 C/C++，所有软件包都以\
  \ JavaScript 提供；这就是 Node.js 易于使用并被称为 JavaScript 编程语言的原因。\n\n它是对 Raspberry Pi 的绝佳运行时环境，因为它对资源极其轻量，但经过优化可处理数百个跨多个\
  \ node 应用的请求。\n\n### 安装 Node.js\n\n我们将使用 Node.js 的自动设置脚本。执行以下命令：\n\n```\ncurl -sL\
  \ https://deb.nodesource.com/setup | sudo bash -\n```\n\n现在我们可以从新仓库安装 Node.js。\n\
  \n```\nsudo apt-get install nodejs\n```\n\nNode.js 和 NPM 现在已安装。要检查 Node.js 是否正确安装，可以执行以下命令：\n\
  \n```\nnode --version\n```\n\n```\nnpm --version\n```\n\n### 什么是 NPM\n\n**NPM 代表\
  \ Node Package Manager。** 你可以在 http://www.npmjs.com 找到许多即用型应用程序和库。它们可通过单个命令行安装，该命令行在软件包的着陆页上提供。\n\
  \n> 尝试在网站上搜索 Raspberry，以找到一些专门为 Raspberry Pi 制作的有趣软件包。\n\n### Node.js 服务器\n\n通常，你会使用\
  \ node helloworld.js 执行 Node.js 文件，这将运行程序但不具备任何 Web 功能。为了以 Web API 的方式使用 Node.js，我们需要创建一个\
  \ Node HTTP 服务器，然后它可以响应通过 Nginx 代理的 Web 请求。\n\n与所有示例一样，我们希望 nginx 能够提供一种标准且简单的方式，通过端口\
  \ 80 将 Web 请求代理到 Raspberry Pi 内部运行的应用程序中。这使得记住 URL 变得容易，更简单地构建前端页面，并在你将 Raspberry\
  \ Pi 开放给万维网时提供一些安全性。\n\n我们将在 /etc/sites-available/nginxhtml 目录中的现有文件添加一个新的 location\
  \ 块：\n\n> 你可以通过创建新的 location 块名称（虚拟目录）并调整你的 node 应用程序绑定的 proxy pass 设置来像这样运行多个 node\
  \ 应用程序。\n\n```\nlocation /node {\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n\
  \    proxy_set_header Host $http_host;\n    proxy_set_header X-NginX-Proxy true;\n\
  \    proxy_pass http://127.0.0.1:5000;\n    proxy_redirect off;\n}\n```\n\n我们将安装两个软件包来帮助获取\
  \ Raspberry Pi 的电压设置。首先，我们将安装一个名为 **express** 的软件包，它将允许我们轻松创建 RESTful API，然后是 pi-volts\
  \ 模块。\n\n使用软件包的典型方法是在你的应用程序目录中安装它们，该目录保存在 /node_modules 中且仅对该应用程序可访问。我们将使用 -g 开关，这将一次性将软件包安装到\
  \ /usr/lib/node_modules/ 目录中，该目录将对你创建的任何 node 应用程序全局可用。这可以节省 SD 卡上的空间，但意味着使用该全局软件包的所有应用程序必须使用该特定版本。你也可以将软件包如\
  \ express 全局安装，然后为单个应用程序如 pi-volts 安装一个小型软件包。\n\n每当你创建一个新的应用程序目录时，你必须使用 npm 初始化应用程序。这会创建一个配置文件并让\
  \ Node.js 知道你希望将应用程序特定的软件包（非全局）安装到此目录。会显示几个屏幕问题；如果你愿意，可以对所有问题都按 Enter。因为 nginx 不执行或提供原始\
  \ Node.js 文件，我们将保持命名约定与 Python 相似。我将在接下来的几行命令中演示这种方法：\n\n```\nsudo npm install express\
  \ -g\ncd /usr/lib\nsudo mkdir node_bin\ncd node_bin\nsudo mkdir volts\ncd volts\n\
  npm init\nsudo npm install pi-volts\ntouch index.js\n```\n\n你现在已为你的应用程序设置了基本框架，并仅为此\
  \ Node.js 应用程序安装了 pi-volts 软件包。编辑 index.js 并插入以下文本：\n\n```\nvar http = require('http');\n\
  var express = require('express');\nvar app = express();\nvar volt = require(\"pi-volts\"\
  );\n\n// Express route for incoming requests (GET)\napp.get('/node/core/voltage/',\
  \ function(req, res) {\n  res.send(String(volts));\n});\n\n// configure Express\
  \ to listen on port 5000\napp.listen(5000);\n```\n\n\n\n我们现在可以运行这个基础的 Node 服务器，它提供一个简单的\
  \ API 文本响应，返回当前的 CPU 核心电压。你可以在 http://raspberrypi/node/core/voltage 发起一个 AJAX GET\
  \ 请求，由于这是 GET 请求，你只需在启动服务器后将该地址输入浏览器即可测试：\n\n```\nnode index.js\n```\n\n现在，你可以更新位于\
  \ /var/www/html/web 的 index.html 文件，并使用 jQuery 执行一个简单的 GET 请求来更新页面上的元素。结果在 1.2 到\
  \ 1.3125 之间变化（完整示例在代码库中提供）：\n\n```\n$.get('/node/core/voltage', function(data) {\n\
  \  $('#cpuvoltage').text(data);\n});\n```\n\n## .NET and ASP.NET MVC\n\n为了使用 Microsoft\
  \ 的 .NET 框架，我们首先需要安装最新版本的 Mono。典型的方法是从 Git 源码编译 Mono，但在 Raspberry Pi 2 上完成大约需要 6\
  \ 小时。我曾尝试制作一个交叉编译教程，但未能找到足够简单或稳健的内容以在此书中演示。\n\n不幸的是，当时 Wheezy 和 Jessie 仓库中只有不支持\
  \ .NET 5 的版本。更快更好的一种方式是使用官方 Xamarin 仓库维护的新版本。\n\n以下命令将添加官方 Xamarin 仓库，更新任何必需的软件包，最后安装\
  \ Mono，约需 300 MB 空间，耗时约 10 分钟。输入以下命令：\n\n```\nsudo apt-key adv --keyserver keyserver.ubuntu.com\
  \ --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF\n```\n\n```\necho \"deb http://download.mono-project.com/repo/debian\
  \ wheezy main\" | sudo tee /etc/apt/sources.list.d/mono-xamarin.list\n```\n\n```\n\
  sudo apt-get update && sudo apt-get upgrade\n```\n\n```\nsudo apt-get install mono-complete\n\
  ```\n\n## Prerequisites for .NET 5\n\n> 请注意，随着 .NET vNext 项目推进到版本 1，术语和命令可能会发生变化。如果任何命令无法工作，请参考\
  \ https://github.com/aspnet/home 获取更多信息。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_71_0.png)\n\
  \n此时，我们可以通过输入以下命令检查 Mono 是否已正确安装：\n\n```\nmono --version\n```\n\n为了让 Kestrel 正常工作，我们需要手动编译\
  \ Libuv 并链接新的库：\n\n```\nsudo apt-get install automake libtool curl unzip\nwget https://github.com/libuv/libuv/archive/v1.4.2.tar.gz\n\
  sudo tar zxfv v1.4.2.tar.gz -C /usr/local/src\ncd /usr/local/src/libuv-1.4.2\nsudo\
  \ sh autogen.sh\nsudo ./configure\nsudo make\nsudo make install\nsudo ldconfig\n\
  ```\n\nLinux 上的 .NET 5 带来了一些新的术语，我会尽力解释：\n\nDNX 是 Dot Net Execution Environment\
  \ 的缩写，用于引导和执行 .NET 应用程序。要安装 DNX，我们首先需要安装 DNVM，即 Dot Net Version Manager 的缩写。\n\n\
  DNVM 允许你并行安装多个版本的 DNX，以便应用程序能够在不同版本的 .NET 5 上运行。\n\nDNU，即 Dot Net Package Updater\
  \ 的缩写，本质上提供了一种在 Pi 上恢复项目所依赖的 NuGet 包的方式，类似于 Node.js 的 NPM。\n\n## Installing DNVM,\
  \ DNU and DNX\n\nDNVM、DNU 和 DNX 可以通过终端上的单行命令安装，这得益于一个脚本，该脚本将执行所有其他必需操作。请注意，稳定版使用旧的命令行：K、KRE、KPM\
  \ 和 KVM。为了保持与补丁同步，我们将使用 dev（前沿）分支。这些补丁移除了许多额外的命令，这里不会涉及。一旦版本 1 发布，请使用稳定分支：\n\n```bash\n\
  cd /home/pi\ncurl -sSL https://raw.githubusercontent.com/aspnet/Home/dev/dnvminstall.sh\
  \ | DNX_BRANCH=dev sh && source /home/pi/.dnx/dnvm/dnvm.sh\n```\n\n## Installing\
  \ DNX\n\n要安装最新版本的 DNX（.NET 5），截至撰写时为 Beta4，在 dev 上，我们现在只需输入以下单行命令：\n\n```bash\n\
  dnvm upgrade\ndnx\n```\n\n恭喜，你现在已在 Raspberry Pi 上安装了 .NET 5！\n\n## Running the MVC\
  \ website\n\n在之前的过程中，只安装了 .NET 5 运行时环境，这允许跨平台执行 .NET 应用程序。\n\n为了快速运行一个 MVC 网站，我们将使用\
  \ ASPNET Github 仓库中的示例。在 beta 期间，请确保选择已安装的 DNX 版本的正确目录。本章其余部分我们将使用 v1.0.0-beta4\
  \ 目录和 DNX。当最终版发布时，它将被命名为 v1.0.0。\n\n> 请再次核对你使用的 DNX 版本和示例版本。不匹配的 DNX 和示例会导致部分示例无法运行。\n\
  \n我们将克隆主要的 ASPNET Home 示例并进入特定的 beta 目录。我们将在此目录中运行包恢复以安装所有必需的依赖项，例如 Kestrel：\n\n\
  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_73_0.png)\n\n> DNU restore 第一次下载所需包可能需要一些时间。dnx\
  \ . kestrel 命令第一次执行也可能需要一些时间；它会在 Kestrel 启动并绑定端口之前引导并预构建 MVC 网站。\n\n```\ncd /var/www\n\
  sudo mkdir dotnet\ncd dotnet\nsudo git clone -b dev https://github.com/aspnet/Home.git\n\
  ```\n\nGit clone 以 root 用户执行，将 /Home 目录中的所有文件创建为 root。这会在恢复包时导致问题，并可能出现其他奇怪情况。我们需要递归地将该目录的用户更改为\
  \ pi 以修复权限问题：\n\n```\nsudo chown -R pi /var/www/dotnet/Home\n```\n\n我们现在将从官方稳定仓库恢复所需的包。你需要在任何新项目（或示例项目）上始终运行此操作，但会快很多，因为包现在已缓存（将\
  \ beta 替换为你正在运行的 DNX 版本）：\n\n```\ncd /Home/samples/v1.0.0-beta4/HelloMVC\ndnu restore\n\
  dnx . kestrel\n```\n\n最后一条命令使用 dnx 根据名为 project.json 的配置文件中指定的配置启动 MVC 网站。Kestrel\
  \ 绑定的端口也在 project.json 文件中定义，默认为 5004。\n\n运行 dnx . kestrel 后，你的终端屏幕将被占用并显示 .NET\
  \ 生成的一些消息。服务器启动后，会显示一条消息告知它已启动并绑定了哪个端口。直到你按 Enter 终止服务器之前，会看到一个闪烁的下划线。\n\n在按 Enter\
  \ 之前，使用网络上另一台计算机的 Web 浏览器导航到 http://raspberrypi:5004。你现在应该能看到一个基础的 MVC 示例网站。\n\n\
  继续尝试编译其他示例或使用 Visual Studio Community 版创建自己的项目。\n\n## MVC and nginx\n\n你可以在不安装 nginx\
  \ 的情况下直接使用 Kestrel 使用 MVC，但强烈建议使用 nginx 作为前端代理，这将允许你在混合环境中管理各种 Web 应用程序。Nginx 还提供更多功能，例如绑定\
  \ SSL 证书，而 Kestrel 单独使用时尚不支持。\n\n我们现在可以为 `dotnet` 代理添加另一个 location 块：\n\n```\nlocation\
  \ /dotnet {\n    proxy_pass http://127.0.0.1:5004;\n}\n```\n\n你现在可以导航浏览器到 http://raspberrypi/dotnet，你应该会看到与\
  \ 5004 端口相同的页面。\n\n这样做的好处是，你现在已配置 nginx 对此虚拟主机执行更高级的操作。\n\n出于安全原因，你应仅允许转发到 nginx\
  \ 虚拟主机中定义的端口，并阻止其余端口，例如 Kestrel 的 5004。这样可以确保在 Kestrel 仍作为开发服务器开发期间，其中的任何漏洞都无法被利用。唯一的缺点是像\
  \ Netcraft 这样的服务会将此网站识别为 nginx 而非 Microsoft 的 Kestrel。但从安全角度来看这是好的，因为潜在攻击者不会知道强大的\
  \ nginx 代理后面实际发生了什么。\n\n## Other .NET applications\n\nMono 支持完整的 .NET 5 堆栈，这意味着你现在可以在\
  \ Visual Studio 中轻松创建控制台应用程序并在 Raspberry Pi 上执行。只需复制你的 .exe 文件并使用 `MONO file.exe`\
  \ 运行即可。\n\n你也可以创建传统的 Windows Forms 并使用相同的方法 `MONO formsapp.exe` 在 LXDE 中执行。原生样式的表单应出现在\
  \ LXDE 中。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_74_0.png)\n\n> 如果将 Windows\
  \ IoT 安装为你的操作系统，你将能够利用 Windows 10 API 创建通用应用，创建全硬件渲染的表单，并通过 DirectX 图形访问 OpenGL\
  \ 以及用于开发 Raspberry Pi 2 物联网应用的丰富 API。基础内容将在第 10 章《Windows IoT Core》中介绍。\n\n\n\n\
  ## 安装 PHP\n\n如前所述，nginx 是一个代理，可极快地处理 Web 请求，而要让 PHP 与 nginx 协同工作，我们需要安装一个名为 **FastCGI**\
  \ 的接口。这将允许 nginx 向 PHP 发送请求并接收和显示响应。为了提高 PHP 性能，我们还将安装一个名为 APC 的 PHP 扩展，其全称为 **Alternative\
  \ PHP Cache**。它比标准 PHP 缓存更快，使用资源更少。\n\n安装后，PHP 应该正在运行，但我们将重启它以确保所有扩展都已正确加载：\n\n\
  ```\nsudo apt-get install php5-fpm php-apc\nsudo service php5-fpm restart\n```\n\
  \n在 `/var/www/` 下创建一个名为 `PHP` 的新目录，并在其中创建子目录 `web`。在 `web` 目录中，我们将创建一个名为 `index.php`\
  \ 的新文件并添加以下内容：\n\n```\n<?php\n    phpinfo();\n?>\n```\n\n这次我们将在不同的端口上运行它，因为 PHP\
  \ 有不同的要求。我们将新主机绑定到 888 端口。我们将创建一个新的 server 块；你可以将其放在现有配置文件中，也可以按需创建一个新的 `sites-available/php`\
  \ 文件：\n\n> 请避免使用端口 8080，因为它稍后将被用于实时流媒体。\n> 请注意 `fastcgi_pass` 设置，该设置也将用于任何其他 PHP\
  \ 网站。\n\n```\nserver {\n    listen 888;\n    root /var/www/php/web;\n    index index.php;\n\
  \n    location ~ \\.php$ {\n        fastcgi_pass unix:/var/run/php5-fpm.sock;\n\
  \        fastcgi_index index.php;\n        include fastcgi_params;\n    }\n}\n```\n\
  \n重启 nginx，然后在另一台计算机的浏览器中访问 http://raspberrypi:888。你应该会看到如下页面：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_76_0.png)\n\
  \n## 安装数据库\n\n当我们想到 Linux 机器上的数据库时，首先想到的通常是 MySQL。它是首选，因为它免费、开源、可靠，并且附带丰富的工具集。在具有四核的\
  \ Raspberry Pi 2 上，MySQL 变得更具吸引力，但我仍将介绍轻量且稳健的 SQLite 替代方案。\n\n### 安装 MySQL\n\nMySQL\
  \ 已存在很长时间，除非你正在寻找特定版本，否则你可以使用当前仓库安装 MySQL 5.5 版本：\n\n```\nsudo apt-get update\n\
  sudo apt-get install mysql-server\n```\n\n你将看到带有蓝色背景的屏幕，要求你输入 root 用户密码。你应该将其记下并保存在安全位置，但将密码存储在\
  \ `KeePass` 等应用程序中会更方便也更安全。\n\n> 最佳实践是永远不要对 Web 应用程序，尤其是可在互联网上访问的生产环境，使用 MySQL 的\
  \ root 用户。\n\n### 安装 phpMyAdmin\n\n一个非常流行的 SQL 管理工具 `phpMyAdmin` 可以安装并用于进一步管理你的数据库，甚至对其进行操作。\n\
  \n`phpMyAdmin` 是唯一需要以 root 设置运行的应用程序，以便它可以完全管理 MySQL。`phpMyAdmin` 的最佳实践是仅允许通过本地网络或\
  \ SSH 进行管理连接。这是因为它将用于创建或删除数据库、用户和密码，并对这些数据库应用权限访问。如果你需要，可以创建权限较低的用户通过互联网登录：\n\n\
  ```\nsudo apt-get install phpMyAdmin\n```\n\n在安装过程中，你将看到另一个蓝色屏幕，要求选择应自动配置的 Web 服务器。可惜的是，`nginx`\
  \ *不在* 列表中；不要勾选任何框并点击 **OK**。过一会儿，最终屏幕会询问 `dbconfig-common`；点击 **NO**。\n\n我们需要像为\
  \ nginx 配置任何其他网站一样手动配置 phpMyAdmin。PhpMyAdmin 将其文件放在共享位置 `/usr/share/phpmyadmin`，并且任何有权访问系统的人都可以使用此共享网站仅访问其数据库。\n\
  \n在 `sites-available` 中，创建一个名为 `phpmyadmin` 的新文件；现在使用以下配置。记得在 `sites-enabled` 中创建符号链接，然后重新加载\
  \ nginx：\n\n```\nserver {\n    location /phpmyadmin {\n        root /usr/share/;\n\
  \        index index.php;\n    }\n    location ~ ^/phpmyadmin/(.+\\.php)$ {\n  \
  \      try_files $uri =404;\n        root /usr/share/;\n        fastcgi_pass unix:/var/run/php5-fpm.sock;\n\
  \        fastcgi_index index.php;\n        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;\n\
  \        include /etc/nginx/fastcgi_params;\n    }\n    location ~* ^/phpmyadmin/(.+\\\
  .(jpg|jpeg|gif|css|png|js|ico|html|xml|txt))$ {\n        root /usr/share/;\n   \
  \ }\n    location /phpMyAdmin {\n        rewrite ^/* /phpmyadmin last;\n    }\n\
  }\n```\n\n此虚拟主机配置为在端口 80 上运行，但位于虚拟目录中。该虚拟目录中的应用程序在自己的线程上运行，与端口 80 上运行的其他任何内容分开。如果你更喜欢这种方式而不是不同的端口号，可以将之前的虚拟主机配置为以相同方式运行。\n\
  \n现在你可以浏览到 http://raspberrypi/phpmyadmin/setup 并按照屏幕上的说明进行操作。你可以暂时忽略有关配置目录的消息。你需要你的\
  \ MySQL root 数据库密码。在服务器部分，点击 Server 按钮上的 new 并在 Authentication 选项卡下输入 root 的密码。\n\
  \n> 按照屏幕上的指南获取最新版本和有关最佳实践的信息。\n\n完成后，你可以将浏览器导航到虚拟目录 http://raspberrypi/phpmyadmin，并使用\
  \ root 凭据登录。你应该做的第一件事是设置一个新用户。\n\n## 安装 SQLite\n\nSQLite3 是一个自包含、易于安装、轻量级的事务数据库。该产品的网站宣称它是世界上部署最广泛的数据库。据维基百科所知，它实际上是嵌入式设备上部署最广泛的数据库，这仍然使\
  \ MySQL 成为使用最广泛的数据库。这些对我们来说其实并不重要，因为这两种数据库在各自的领域都很出色，只是如果你希望在 Raspberry Pi 1 上获得更好的性能，SQLite\
  \ 是更好的选择：\n\n```\nsudo apt-get install sqlite3 php5-sqlite\n```\n\n我们将使用 phpliteadmin，这是一个专门为\
  \ SQLite 2 和 3 版本制作的单文件管理实用程序。同时，为 phpliteadmin 创建一个新子目录。请注意，Google 代码库即将关闭，该软件包可能很快会迁移到\
  \ GitHub。如果你无法解析链接，可以在互联网上搜索：\n\n```\nsudo mkdir /var/www/phpliteadmin/\nsudo mkdir\
  \ /var/www/phpliteadmin/web\ncd /var/www/phpliteadmin/web\nwget https://phpliteadmin.googlecode.com/files/phpliteAdmin_v1-9-5.zip\n\
  sudo unzip phpliteAdmin_v1-9-5.zip\n```\n\n让 phpliteadmin 在本地工作的最简单方法是将其运行在自己的专用端口上。\n\
  \n使用以下内容创建一个新的虚拟主机文件 sqladmin：\n\n```\nserver {\n    listen 81;\n\n    root /var/www/phpliteadmin/web/;\n\
  \    index phpliteadmin.php;\n    location ~ \\.php$ {\n        fastcgi_pass   unix:/var/run/php5-fpm.sock;\n\
  \        fastcgi_index  phpliteadmin.php;\n        include        fastcgi_params;\n\
  \    }\n}\n```\n\n重新加载 nginx 并导航到 http://raspberrypi:81。默认密码是 admin。此时，你会收到错误消息，提示没有数据库且目录不可写。\n\
  \nSQLite 创建包含所有数据的平面文件，你可以管理这些文件的位置。没有服务器管理这些文件，任何 SQLite 兼容的客户端都可以连接这些文件。\n\n你可以使用\
  \ SQLite3 命令行在 /var/www/phpliteadmin/web 中创建一个测试数据库：\n\n```\nsudo sqlite3 test.db\n\
  BEGIN;\nCREATE TABLE temps (theDate DATE, name TEXT);\nCOMMIT;\n.exit\n```\n\n刷新你导航到\
  \ `phpliteadmin` 的网页。你将看到新的布局，左侧列出数据库。如果你使目录可写，还可以创建新数据库。\n\n> 强烈建议不要允许从互联网访问此虚拟网站，因为未实现任何安全功能。\n\
  \n## 总结\n\n在本章中，我们介绍了如何在 .NET 或 PHP 主机平台上创建各种基本网站。Nginx 确实是一个多功能且快速的代理服务器，有助于我们实现可以提供的各种\
  \ Web 应用程序。\n\n我们研究了如何托管 .NET MVC 和 PHP，以及安装两种不同类型的数据库引擎，所有这些都在和谐地并行运行。\n\n在下一章中，我们将为本地网络设置文件共享，并为基于互联网的存储设置\
  \ *ownCloud*。\n\n\n"
- "## 5 将 Raspberry Pi 设置为文件服务器\n\n## \n\nWindows、Linux 和 Mac OS X 都使用不同的文件系统，并且它们在网络上共享文件的方式也不同。除此之外，您还会有网络特定的协议，例如在互联网上使用的协议。\n\
  \n如果您在想哪一个最好，您永远找不到答案；相反，您应该使用最适合您的应用并且您最熟悉的技术。\n\n### 连接外部存储\n\nRaspberry Pi 没有\
  \ SATA 接口，连接此存储的唯一方式是通过 USB 端口。您可以通过连接一个带电的 USB 集线器来进一步扩展 USB 端口的数量。\n\n由于 USB 总线上有\
  \ 480 MBps 的限制，我们应该考虑最优的设置。我们为以太网保留 100 MBps，这足以流式传输任何高清视频。这就剩下 380 Mbps（47 MBps），这很好，因为我们通过以太网最多也只能发送\
  \ 12 MBps 的数据。\n\n如果您真的想榨取更多传输速度，可以使用兼容的 802.11n 或 802.11ac 无线 USB 外设。使用 WiFi 您可能会达到超过\
  \ 100 MBps，但需要额外确保信号良好，并且您的整体环境没有被其他无线路由器占用。您期望的最乐观传输速度大约为 25-30 MBps。\n\n### 准备存储介质\n\
  \n此时，使用外部供电的 USB 集线器是非常好的主意。通过 USB 连接的硬盘需要这种额外的电力才能正常运行。如果您正在使用无线适配器和其他 USB 外设，您应该考虑将它们移到带电的\
  \ USB 集线器上。\n\n> 请确保您没有使用包含重要文件的驱动器。本章将向您展示如何格式化驱动器和使用其他文件系统。您驱动器上的所有数据都将丢失。\n\n\
  为了简单起见，在本章中，我们将使用一个 8 GB 的 USB 闪存盘；但概念对于 USB 硬盘也是相同的。\n\n### 列出可用驱动器\n\n在控制台中，您可以使用\
  \ fdisk 命令来获取驱动器和分区的列表，如以下命令行所示：\n\n```\nsudo fdisk -l\n```\n\nfdisk 命令会向您显示 Linux\
  \ 中使用的磁盘名称、其完整大小和分区。/dev/mmcblk 下的驱动器是内置 SD 卡，您不希望对该设备做任何操作。相反，您应该始终查找标记为 /dev/sdXn\
  \ 的驱动器，其中 x 通常是代表物理驱动器的字母，n 是代表设备分区按升序排列的数字。\n\n不幸的是，设备名称不是按任何特定顺序分配的，并且不能保证相同的名称会用于相同的驱动器。当您开始使用两个或更多硬盘时，这可能会成为一个问题。分区号永远不会改变，它们代表分区创建的确切顺序。\n\
  \n以下屏幕截图显示 USB 闪存盘已作为 /dev/sda 设备出现，并且它具有 7803 MB 的 FAT32 文件系统：\n\n```\nroot@raspberrypi:~#\
  \ fdisk -l\n\nDisk /dev/mmcblk0: 3904 MB, 3904897024 bytes\n4 heads, 16 sectors/track,\
  \ 119168 cylinders, total 7626752 sectors\nUnits = sectors of 1 * 512 = 512 bytes\n\
  Sector size (logical/physical): 512 bytes / 512 bytes\nI/O size (minimum/optimal):\
  \ 512 bytes / 512 bytes\nDisk identifier: 0x000c7b31\n\nDevice Boot      Start \
  \        End      Blocks   Id  System\n/dev/mmcblk0p1            8192      122879\
  \      57344   c  W95 FAT32 (LBA)\n/dev/mmcblk0p2          122880     7626751  \
  \   3751936  83  Linux\n\nDisk /dev/sda: 7803 MB, 7803174912 bytes\n122 heads, 58\
  \ sectors/track, 2153 cylinders, total 15240576 sectors\nUnits = sectors of 1 *\
  \ 512 = 512 bytes\nSector size (logical/physical): 512 bytes / 512 bytes\nI/O size\
  \ (minimum/optimal): 512 bytes / 512 bytes\nDisk identifier: 0xc3072e18\n\nDevice\
  \ Boot      Start         End      Blocks   Id  System\n/dev/sda1   *          \
  \ 8064    15240575     7616256   b  W95 FAT32\n```\n\n### 格式化驱动器\n\nRaspberry Pi\
  \ 能够读写 Windows 使用的 NTFS。它也可以读写 Macintosh 使用的 HFS+。如果您需要快速复制某些内容，这两种方法对于临时连接可移动介质都是可以的。\n\
  \nNTFS 和 HFS+ 文件系统不是 Linux 原生的，并且在 Linux 理解的数据和其它文件系统理解的数据之间进行转换需要大量开销。可能会发生一些意外的错误并导致数据丢失，而这不是任何人想要的！\n\
  \nExt4 是 Linux 中首选的存储文件系统。使用该文件系统在 Linux 中挂载的介质非常快速可靠。有方法可以在 Mac OS X 和 Windows\
  \ 上使用它，但这不是本章的目标。您应该承诺将介质用作长期存储，并保持连接到 Raspberry Pi。\n\n我们首先需要通过将其擦除回干净状态来准备硬盘。\n\
  \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_83_0.png)\n\n> 警告：此步骤将销毁目标驱动器上的所有数据。\n\
  \n此命令将快速从您的硬盘中删除所有内容，包括分区和引导扇区。请务必使用您在 fdisk 中看到的正确设备名称。在本例中，它是 sda，但您需要在 Raspberry\
  \ Pi 上再次仔细检查，因为它可能不同。这可以使用以下命令完成：\n\n```\nsudo dd if=/dev/zero of=/dev/sda bs=512\
  \ count=1\n```\n\n### 创建 EXT4 分区\n\n我们将使用 fdisk 创建一个新分区。我想使用整个驱动器并使用 fdisk 提供的默认值。您可以在\
  \ fdisk 中随时使用 m 命令获取更多帮助，如以下命令行片段所示：\n\n```\nsudo fdisk /dev/sda\nn \"new partition\"\
  \n<enter> \"Uses p as the default\"\n<enter> \"Uses l as the default\"\n<enter>\
  \ \"Uses default first sector\"\n<enter> \"Uses last sector available on drive\"\
  \nw \"write partition data and exit\"\n```\n\n我们将发出的最后一个命令用于在 sda1 分区上创建 EXT4 文件系统。以下命令行中的\
  \ -L 标志提供分区名称。您可以使用任何喜欢的简短名称：\n\n```\nsudo mkfs.ext4 /dev/sda1 -L nas001\n```\n\n\
  ### 挂载驱动器\n\nLinux 有一个名为 /mnt 的目录，您可以在其中为各种硬盘或其他网络连接创建挂载点。还有一个名为 /media 的目录，您可以在其中挂载驱动器。这是\
  \ Linux 中通用的约定，以便人们知道如何组织这些文件。这些只是普通目录；如果您愿意，您可以创建一个名为 /nas 的目录，并在其中挂载所有与网络附加存储\
  \ (NAS) 相关的驱动器。\n\n我将创建一个名为 /nas 的目录并在此处挂载我的 USB 驱动器。然后，我将创建一个名为 USB001 的子目录。我们还将创建用于共享的目录，如以下命令行片段所示：\n\
  \n```\nsudo mkdir /nas\ncd /nas\nsudo mkdir USB001\n```\n\n```\nsudo mount -t ext4\
  \ -v /dev/sda1 /nas/USB001/\ncd USB001\nsudo mkdir public\nsudo mkdir work\n```\n\
  \n### 重启后重新挂载磁盘\n\n在重启后重新挂载驱动器的最快方法是向控制文件系统配置的 fstab 文件添加几行，该文件位于 /etc/fstab。\n\n\
  只需添加以下行。第一部分是分区，后一部分是挂载点。您需要根据硬件进行调整。最后的选项用于自动挂载。不要更改这些选项：\n\n/dev/sda1 /media/USB001\
  \ auto noatime 0 0\n\n### 访问文件\n\n我们将介绍几种允许访问 Raspberry Pi、网络和互联网上的文件的方法。您应选择最适合您的方法，因为启用多种方式会更容易在网络上使系统受到损害。\n\
  \n### FTP 服务\n\n文件传输协议规范最初于 1971 年发布，但我们目前使用的是 1985 年的规范，每个人真的应该开始远离。FTP 使用端口 21。\n\
  \n一种更新得多的规范，被称为安全文件传输协议 (SFTP)，支持 IPv6 和安全套接层 (SSL) 加密。安装 FTP 只会浪费时间，因为 OpenSSL\
  \ (SSH) 已内置支持并默认启用 SFTP。SFTP 通常使用端口 22，这与 SSH 相同。\n\n您应该为 SFTP 访问创建并使用单独的用户。为了简化，我将演示如何使用\
  \ root 账户通过两个流行客户端连接到您的 Raspberry Pi。\n\n\n\n\n## 使用 FileZilla 连接\n\nFileZilla 是开源的，可以在\
  \ Windows、Mac OS X 或 Linux 上运行。在你的电脑上下载并安装它。我们使用以下步骤连接到树莓派：\n\n- 1. 在“主机”字段中，输入你的\
  \ Pi 的 IP 地址或 DNS 名称；\n- 2. 在“用户名”字段中，输入 Pi 上的用户名。例如，root。\n- 3. 在“密码”字段中，输入该用户的密码。\n\
  - 4. 在“端口”字段中，将端口名称输入为 22。这告诉 FileZilla 你想要使用 SFTP 连接。\n\n以下屏幕截图将展示 FileZilla 如何连接到我们的\
  \ Pi：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_86_0.png)\n\n## 使用 WinSCP 连接\n\
  \nWinSCP 是所有需要连接到运行 SSH 或 SFTP 服务器的 Linux 主机的 Windows 用户首选客户端。\n\nWinSCP 还提供 Secure\
  \ Copy Protocol（SCP），该协议未被任何标准指定。它使用 Secure Shell 进行数据传输并使用相同的身份验证方法。\n\n前往 http://winscp.net/\
  \ 并找到 [前往下载页面] 链接，从那里你将获得安装程序或便携式二进制文件。\n\n就像使用 FileZilla 一样，你将输入主机名、用户名和密码。你可以使用\
  \ SFTP 或 SCP，如以下屏幕截图所示：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_87_0.png)\n\n\
  ## Samba 服务\n\nSamba 是 SMB/CIFS 网络协议的实现，该协议主要用于运行 Microsoft Windows 的计算机上。它基本上是一种允许\
  \ Windows 计算机连接到 Linux 系统并访问其共享文件或打印机的机制。它不是由 Windows 创建，最初由 Andrew Tridgell 开发。\n\
  \n如果你想在网络上的其他 Windows 计算机之间共享来自 Linux 的媒体，Samba 是最佳的软件选择。\n\n### 安装和配置 Samba\n\n\
  你需要使用以下命令行安装 Samba 以及 Samba 使用的通用库：\n\n```\nsudo apt-get install samba samba-common-bin\n\
  ```\n\n然后你可以导航到 `/etc/samba` 并编辑 `smb.conf` 文件。在个人使用的私有网络上，你可以跳过任何需要使用密码挂载网络共享的步骤。在暴露或生产环境中，始终使用身份验证。\n\
  \n如果你不喜欢在内部网络共享上设置安全性，那么这是完全安全的。由于这些文件无法从互联网访问，你可能只想自由浏览网络并在不输入密码的额外痛苦下复制或移动文件。\n\
  \n默认情况下，Samba 设置为匿名（未经身份验证）访问。要更改此设置，请向下滚动并通过删除前面的 `#` 来取消注释 `security = user` 行。这将告诉\
  \ Samba 对你创建的用户进行身份验证。\n\n我们将快速创建一个用户用于演示，因为需要额外步骤将用户添加到 Samba 身份验证列表中。以下命令行片段是创建系统用户以访问\
  \ Samba 的示例：\n\n```bash\nsudo useradd bond007 -m -G users\nsudo passwd bond007\n\
  sudo smbpasswd -a bond007\n```\n\n### 网络共享\n\n在 `smb.conf` 文件底部，我们将添加两个共享，如以下命令行片段所示。一个帐户是用于无需身份验证的访客，而另一个帐户将只能由我们的新用户——James\
  \ Bond 访问：\n\n```ini\n[public] comment = Media share\npath = /nas/USB001/public\n\
  force user = \"root\"\nread only = no\nguest ok = yes\npublic = yes\n\n[work]\n\
  comment = Work share\npath = /nas/USB001/work\nvalid users = \"bond007\" #or @users\
  \ to allow the group users access\nforce group = users\nread only = no\nwriteable\
  \ = yes\n```\n\nSamba 在权限方面可能相当难以理解。我们先从公共共享开始。你会注意到我们在 smb.conf 中放置了一行说 force user\
  \ = \"root\"。我们这样做是因为我们以 root 用户身份创建了公共目录，所以应用于目录和稍后创建的所有文件的权限只能用于 root 用户！因此，我们告诉\
  \ Samba 模仿访客，作为 root，以便他们可以像 root 用户一样进行读写。\n\n同样适用于用户 James Bond 及其目录。如果你以 root\
  \ 用户或 Raspberry Pi 身份创建了 work 目录，即使是 James Bond 也不会被允许写入新文件。为了解决这个问题，你可以简单地通过输入以下命令行来更改文件夹的所有者：\n\
  \n```\nchown bond007:users /mnt/USB001/work\n```\n\n你也可以通过将 bond007 替换为 users 来将目录分配给整个组。命令将如下所示\
  \ chown users:users。这意味着现在组中的任何人都可以写入和删除此文件夹上的文件。\n\n配置文件具有许多高级功能，我建议阅读在线手册以了解有关安全性、共享打印机以及如何让\
  \ Samba 充当 Windows 域服务器的更多信息！\n\n现在你可以使用任何 Windows 计算机浏览网络并访问新创建的共享。\n\n## 用于 Macintosh\
  \ 的 AFP\n\nSamba 也适用于 Macintosh，但 Apple 有自己的网络协议称为 Apple Filing Protocol（AFP）。你可以在树莓派上安装软件，以便你的\
  \ Macintosh 计算机可以检测到树莓派。\n\n### 安装和配置 Netatalk\n\n安装 Netatalk 已变得非常容易，因为大多数配置默认已设置。在撰写本书时，使用的是\
  \ 2.3.3 版本：\n\n```\nsudo apt-get install netatalk\n```\n\n在 30 秒内，你将在 Macintosh\
  \ 的共享部分看到你的树莓派弹出。共享的默认目录是你登录时使用的用户的 home 目录，例如用户 Pi。\n\n### 共享和 Time Machine\n\n\
  我们将创建一些条目以使用你的外部驱动器进行所需的共享，并且此版本的 Netatalk 还支持 Time Machine。\n\n你需要按如下方式编辑此文件以自定义一些设置：\n\
  \n/etc/netatalk/AppleVolumes.default\n#Amend default to look like this\n:DEFAULT:\
  \ options:upriv,usedots,rw,tm\n#Add this to end of the file\n/nas/USB001/public\
  \ \"Public\"\n/nas/USB001/work \"James Bond\"\n\n阅读配置文件以了解更多选项和调整安全性。保存后，你必须使用以下命令重启\
  \ Netatalk：\n\n```\nservice netatalk restart\n```\n\n## BitTorrent Sync\n\n你可能听说过有关\
  \ torrent 的所有坏事，主要是由私人公司故意放置感染文件以试图跟踪分享受版权保护材料的用户或恶意用户试图获取你的个人详细信息所造成的。\n\nSync\
  \ 不是公共网络；它只使用来自传统 torrent 的革命性点对点技术，这使你能够与无限数量的计算机共享无限量的数据。文件不会存储在云端。它们存储在安装了 BTSync\
  \ 的所有计算机上，你可以控制谁有权访问以及这些文件存储在哪里。BTSync 包括文件版本控制、与手机共享、LAN 同步和增量更新。它还允许在文件系统支持此类大文件的情况下，无问题地进行数\
  \ GB 的大规模文件传输。\n\n### 安装 BTSync 2\n\n在撰写本书时，有几个存储库保留了此软件包及其启动脚本。警告：不要信任默认启用的以外的其他来源。人们可以轻松更改代码并放置自己的二进制版本，其中包含一些讨厌的后门。前往官方网站，或使用官方网站提供的链接。\n\
  \n我们将创建新目录、下载 BTSync 的 ARM 版本并按以下命令行片段所示提取它：\n\n```\nmkdir ~/.btsync && cd ~/.btsync\n\
  wget http://download-cdn.getsyncapp.com/stable/linux-arm/BitTorrent-Sync_arm.tar.gz\
  \ -O btsync_arm.tar.gz\ntar -xvf btsync_arm.tar.gz\n```\n\n我们将创建一个服务文件。在 /etc/init.d\
  \ 中，创建 btsync 文件并复制以下文本：\n\n```\n#!/bin/sh\n### /etc/init.d/btsync\n#\n### Carry\
  \ out specific functions when asked to by the system\ncase \"$1\" in\nstart)\n \
  \   /opt/btsync/bin/btsync --config /opt/btsync/bin/btsync.conf\n;;\nstop)\n   \
  \ killall btsync\n;;\n*)\n    echo \"Usage: /etc/init.d/btsync {start|stop}\"\n\
  \    exit 1\n;;\nesac\n\nexit 0\n```\n\n我们需要为新文件设置正确的权限：\n\n```\nsudo chmod 755\
  \ /etc/init.d/btsync\nsudo update-rc.d btsync defaults\nsudo service btsync start\n\
  ```\n\nBTSync 现在将在你的 Raspberry Pi 2 每次重启时启动。你可以查看 /opt/btsync/bin/btsync.conf 配置文件，但默认值效果相当好。\n\
  \n现在你可以在同一网络上的浏览器中导航到你的 Pi 的地址 http://raspberrypi:8888/gui。\n\n\n\n\n在 GUI 中，添加硬盘上的目录。现在，在你的\
  \ Mac OS X、Windows、Linux 机器或智能手机上安装该应用程序。使用 GUI 在用户之间共享目录。它可以检测同一网络上的机器，从而提高同步速度。\n\
  \nSync 尽力配置端口，并使用协议通过互联网进行通信。理论上，你现在可以打电话给朋友，请他们安装 Sync，并通过电子邮件共享目录。他们现在将开始看到与你相同的文件。\n\
  \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_92_0.png)\n\n> BitTorrent Sync 2 用于跟踪目的的外部分服务器，但实际文件不会存储在上面；跟踪器文件没有公共访问权限。\n\
  > \n> BitTorrent Sync 声称使用 SRP 进行相互身份验证和前向保密，其中所有数据随后使用 AES-128 Counter Mode 和唯一的会话密钥进行加密。这是一种非常复杂的方式来确保没有人能猜出你的密钥，甚至\
  \ BitTorrent 也不能。所有内容都是动态即时生成的，然后客户端在传输过程中协商更多密钥。这听起来非常好，但你必须相信他们的话，因为该项目是闭源的。\n\
  \n## 硬件 RAID\n\n树莓派板载没有 SATA 控制器，除了通过 USB 端口外，没有办法连接额外的硬盘。好消息是你可以使用 USB RAID 控制器。这使得树莓派上的文件存储成为一个非常有吸引力的选择。技术上，这里需要的外设称为\
  \ USB SATA 倍增器。\n\n## 配置\n\n没有一步到位的指南来配置这些倍增器。有些需要使用 Windows 或 Linux 中的软件进行配置，而其他一些可能具有\
  \ DIP 开关，可将倍增器配置为特定配置。\n\nAddonics 是一款知名且相对容易采购的倍增器。你需要在互联网、在线拍卖和商店中搜索它。价格与树莓派大致相同，但如果你正在寻找冗余存储，那么这些就是你能找到的最便宜的选择。\n\
  \n## 海量存储\n\n如果你想创建真正海量的存储，可以轻松地将一个倍增器与另一个串联，有时可达三到四次。最近，Addonics 开发了另一种可以无限串联的设备！\n\
  \n假设我们可以串联最多三级，并使用 2 TB 硬盘。我们将所有倍增器配置为在所有驱动器上跨越数据且无冗余；也就是说，五乘五，再乘五。我们最终得到 125 个可用\
  \ SATA 端口，总共 250 TB 的存储空间。这个数字对于家庭用户来说非常不切实际，因为所有这些硬盘都会消耗大量电力。有些人在家里有这样的硬盘设备，所以我认为使用六个倍增器实现\
  \ 25 个 SATA 端口对某些读者来说是完全可行且便宜的选择！下图是使用 SATA 端口倍增器将一个 SATA 端口复制为另外五个端口的简单示例：\n\n\
  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_93_0.png)\n\n## 冗余存储\n\n我们所有人一生中都丢失过太多重要数据，所以你应该考虑冗余而不是海量存储。我们可以使用一组四个\
  \ 1 TB 硬盘，配置为 RAID 5 + S。这给了我们 3 TB 的可用空间。此外，如果任何一个硬盘崩溃，你可以快速更换它，所有重新同步的数据都将无损存储。以下是解释\
  \ SATA 端口复制器每个功能的图示：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_94_0.png)\n\n##\
  \ 总结\n\n本章演示了树莓派能够做任何普通计算机或服务器能做的事情。它能够与各种平台共享文件。你可以使用最新的安全 FTP 连接到树莓派。它能够使用一些巧妙的硬件附加组件存储大量数据。\n\
  \n在下一章中，我们将设置各种游戏服务器。\n"
- "## 6 设置游戏服务器\n\n## \n\n在树莓派上运行 Counter Strike 服务器会很棒，但由于运行此类游戏服务器的高要求，这是不可能的。主要是由于\
  \ RAM 不足，但一些服务器也需要强大的处理器为所有玩家提供低延迟性能，每个游戏最多可达 24 名玩家。\n\n在本章中，你将了解由对特定类型游戏充满热情的人开发的开源游戏。这些游戏是逆向工程的、从头构建的，或仅仅因其简单性而变得流行。\n\
  \n## 更新到 Jessie\n\n在撰写本书时，树莓派的主要发行版仍是 Debian Wheezy。Debian Jessie 大约在 2013 年 6 月为树莓派测试而添加，但已在桌面机器上使用。截至\
  \ 2015 年 4 月，似乎已有树莓派的稳定版本。许多游戏服务器软件包仅在 Jessie 中更新，因为依赖项更新。\n\n你可以将整个树莓派升级到 Jessie，但建议在官方镜像发布前不要这样做。相反，我们将在保持整个发行版在\
  \ Wheezy 稳定的同时，从 Jessie 安装选定的特定软件包。如果您已在使用 Jessie，可以跳过这些步骤。\n\n## 选择性设置\n\n我们可以将以下两行添加到\
  \ /etc/apt/sources.list：\n\n```\ndeb http://mirrordirector.raspbian.org/raspbian/\
  \ jessie main contrib non-free rpi\ndeb http://archive.raspbian.org/raspbian jessie\
  \ main contrib non-free rpi\n```\n\n下一步是告诉 aptitude 对正常更新使用 `wheezy` 仓库，并且你希望不时使用\
  \ Jessie。这些设置应输入到位于 `/etc/apt/preferences` 的文件中。如果文件不存在，请创建它：\n\n```\nPackage: *\n\
  Pin: release n=wheezy\nPin-Priority: 900\n\nPackage: *\nPin: release n=jessie\n\
  Pin-Priority: 300\n\nPackage: *\nPin: release o=Raspbian\nPin-Priority: -10\n```\n\
  \n添加这些设置并保存文件后，运行 `sudo apt-get update`。\n\n我们将使用 `apt-get` 并带有一个额外开关来使用新软件包。你应该仅在建议时使用此开关。升级核心软件包可能导致不稳定行为。我们将使用的语法如下，其中\
  \ `<package>` 将被以下段落中所需的游戏软件包替换：\n\n```\nsudo apt-get -t jessie install <package>\n\
  ```\n\n## 游戏服务器\n\n我们将只关注运行不需要桌面交互的游戏的服务器部分。相反，你在另一台计算机上运行客户端并连接到树莓派。一些客户端可以在 Pi\
  \ 的 X 桌面上运行，它们在树莓派 2 上运行效果相当不错，但可能不太愉快。\n\n## OpenTTD\n\n**OpenTTD** 是由 MicroProse\
  \ 制作的原版《运输大亨》的重新实现。这款游戏极具上瘾性，加入网络游戏可以给你额外的竞争优势。\n\n你必须对物流、策略和实时模拟充满热情才能享受这款游戏。目标只是尽可能高效地控制火车和卡车，并在运输货物时获利。\n\
  \n## 安装 OpenTTD\n\n最新软件包仅保留在 Jessie 上：\n\n```\nsudo apt-get -t jessie install openttd\n\
  ```\n\n在此期间将安装多个库。你可能会看到一个蓝色屏幕，询问你是否要重启某些服务以完成软件包安装。同意是安全的。这可能需要几分钟才能完成。\n\n## 配置\
  \ OpenTTD\n\n名为 `openttd.cfg` 的配置文件可以在 `~/.openttd` 找到。它包含几百个可根据偏好调整的设置，但其中一些重要设置如下：\n\
  \n- `lan_internet`: 这设置了 LAN 访问条件。对于 lan0，允许互联网，对于 lan1，仅使用 LAN。\n- `server_name`:\
  \ 这是用于在互联网上标识服务器的唯一名称。\n- `server_advertise`: 我们将其设置为 `true`，以便它在服务器列表中可见。\n- `server_bind_ip`:\
  \ 我们将其设置为 `0.0.0.0`；这允许地址绑定到任何网络。\n- `server_port`: 对此，我们保留默认值；这是其他人从互联网连接到网络的方式。\n\
  \n> 要允许人们从互联网连接，你应该在路由器中将 3979 和 3978 端口转发到树莓派。\n\n使用以下选项启动服务器：\n\n```\n/usr/games/openttd\
  \ -D\n```\n\n## 游玩 OpenTTD\n\n你现在可以在其他计算机上安装并运行 OpenTTD，并邀请一些朋友加入你。\n\n点击 **Multiplayer**，如果已为游戏转发端口，则选择\
  \ **Internet**。点击 **find**，将显示服务器列表。\n\n\n\n\n## Freeciv\n\n> \"这是一款受人类文明历史启发的免费开源帝国建设策略游戏。\"\
  \n> \n> – Freeciv\n\n这款游戏让我想起 Sid Meier 的《文明》。它的用户界面非常相似，但一旦开始游玩，你会注意到游戏中内置了更多功能和可能性。\n\
  \n## 安装 Freeciv\n\n我们可以从 Raspberry 仓库安装服务器：\n\n```\nsudo apt-get -t jessie install\
  \ freeciv-server\n```\n\n在此期间会安装多个库。你可能会看到一个蓝色屏幕，询问你是否要重启某些服务以完成软件包安装。同意是安全的。这可能需要几分钟才能完成。\n\
  \n## 配置 Freeciv\n\n默认设置足以让你立即游玩。你可以通过在控制台输入以下内容来启动服务器：\n\n```\nfreeciv-server\n\
  ```\n\n服务器不应使用 sudo 命令或以 root 用户身份运行，而应以普通无特权用户身份运行。\n\n这实际上会为你提供由 freeciv 服务器提供的另一个控制台。你可以通过输入命令来调整服务器设置。你可以尝试输入\
  \ help 并按 Enter。\n\n如果你想将服务器发布到在线社区，你需要通过路由器将端口 5555 转发到 Raspberry Pi，然后使用额外的命令行\
  \ --meta 启动服务器。\n\n## 游玩 Freeciv\n\n你现在可以在电脑上安装并运行 `freeciv`。如果你运行的是服务器和客户端的相同版本，你将在局域网中看到它。\n\
  \n## OpenArena\n\n**OpenArena** 是一款基于 Quake 3 引擎的免费第一人称射击游戏。它的目标是成为 Quake 3 的克隆版，但它用全新的内容替换了专有内容。\n\
  \n## 安装 OpenArena\n\n服务器安装可能占用多达 500 MB。请确保有足够的可用空间，然后我们可以使用 Jessie 仓库安装游戏：\n\n\
  ```\nsudo apt-get -t jessie install openarena-server\n```\n\n在此期间会安装多个库。你可能会看到一个蓝色屏幕，询问你是否要重启某些服务以完成软件包安装。同意是安全的。这可能需要几分钟才能完成。\n\
  \n## 配置 OpenArena\n\n如果你想在互联网上共享服务器，你应该在路由器上打开并转发 UDP 端口 27960 和 27950。查看位于 `/etc/openarena-server/server.cfg`\
  \ 的设置：\n\n- `set dedicated 2`: 我们在互联网上使用 2，而 1（默认）是局域网\n- `sv_hostname \"Raspberry\
  \ Pi\"`: 用于设置你的服务器名称\n- `sv_master1 \"dpmaster.deathmask.net\"`: 设置保存列表的互联网服务器\n\
  - `sv_maxclients 16`: 这是允许连接的客户端的最大数量\n- `capturelimit 8`: 用于设置 CTF 中的捕获限制\n- `timelimit\
  \ 15`: 用于设置时间限制\n- `fraglimit 35`: 用于设置爆头限制\n- `g_motd \"This Pie is delicious!\"\
  `: 用于设置每日信息\n- `g_gametype 0`: 用于将游戏类型设置为自由混战；也称为死亡竞赛\n\n你可以在 OpenArena Wiki 上找到数百个额外设置。请记住服务器不得以\
  \ root 身份运行。\n\nOpenArena 服务器作为服务运行。我们应该停止服务并在控制台上运行它，以确保一切正常运行。一旦你确认一切配置正确，你可以再次启动服务：\n\
  \n```\nsudo service openarena-server stop\n/usr/games/openarena-server +exec /etc/openarena-server/server.cfg\n\
  ```\n\n## 游玩 OpenArena\n\n该游戏可以在 Windows、Mac OS X 或 Linux 上游玩。你应该前往网站获取特定平台的客户端。\n\
  \n## Minecraft\n\nMinecraft 是一款沙盒独立游戏，你控制一个可以建造你想象中任何东西的人。有复杂的方块可以被使用或编程来执行各种服务器端计算。如果你想看到\
  \ Minecraft 的完整潜力，你应该访问 BitVegas。这比其他服务器更困难，因为我们需要安装和配置大量依赖项。\n\n## 安装 Java Hard-Float\n\
  \n我们需要前往 https://jdk8.java.net/download.html，接受条款，并复制适用于 Linux ARM 32 位的链接。现在，我们需要下载文件，忽略任何证书问题：\n\
  \n```\nsudo wget --no-check-certificate <URL>\n```\n\n然后，在控制台中输入以下行，并将 <filename>\
  \ 替换为你下载的最新文件：\n\n```\nmkdir -p /opt\nsudo tar zxvf <filename> -C /opt\nsudo /opt/jdk????/bin/java\
  \ -version\n```\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_100_0.png)\n\n你可以开始输入文件名然后按\
  \ Tab。这将自动补全文件名或为方便起见显示类似名称的列表。\n\n如果你从版本命令行得到响应，那么你现在已在 Raspberry Pi 上安装了 Java\
  \ Hard-Float。\n\n## 安装 Minecraft 服务器\n\nMinecraft 服务器由各个群体积极开发，有许多配置可供选择。Spigot\
  \ 是一款高性能的 Minecraft 服务器实现，我们可以使用以下命令安装它：\n\n```\ncd /home/pi\nsudo wget http://ci.md-5.net/job/Spigot/lastStableBuild\
  \ /artifact/Spigot-Server/target/spigot.jar\n```\n\n```\n### This is the command\
  \ line use on Pi 2 1GB ram\nsudo /opt/jdk1.8.0/bin/java -Xms512M -Xmx992M -jar /home/pi/spigot.jar\
  \ nogui\n```\n\n```\n#This is the command line use on Model B with 512 ram\nsudo\
  \ /opt/jdk1.8.0/bin/java -Xms256M -Xmx496M -jar /home/pi/spigot.jar nogui\n```\n\
  \n第一次启动大约需要 10 分钟。一旦准备就绪，你可以从另一台机器本地登录并探索你的新世界。你应该稍后退出并为性能配置服务器。\n\n## 配置 Minecraft\n\
  \n要允许互联网上的玩家连接，你需要从路由器打开并转发名为 25565 的端口到 Raspberry Pi。\n\n这些设置似乎最适合在 Raspberry Pi\
  \ 上运行。你可以根据需要进行调整：\n\n```\nserver-name=Raspberry Picraft!\nmotd=Pie is Delicious\n\
  allow-flight=false\nspawn-monsters=true\ngenerate-structures=true\nenable-query=false\n\
  enable-rcon=false\nlevel-name=world\nspawn-protection=16\nonline-mode=true\n```\n\
  \n```\ndifficulty=1\ngamemode=0\nspawn-animals=true\n```\n\n设置游戏服务器\n\n```\nview-distance=4\n\
  level-seed=\nhardcore=false\nsnooper-enabled=false\nlevel-type=DEFAULT\npvp=true\n\
  texture-pack=\nmax-players=20\nserver-ip=\nmax-build-height=240\nspawn-npcs=true\n\
  server-port=25565\nwhite-list=false\ngenerator-settings=\nallow-nether=false\n```\n\
  \n## 游玩 Minecraft\n\n要连接到你的服务器，你需要在网络设置中输入你的 Raspberry IP 地址。如果你希望其他人从互联网加入，你应该阅读第\
  \ 2 章《准备网络》，以了解如何设置动态 DNS。\n\n## 摘要\n\n在本章中，你学习了如何使用另一个非默认的 Jessie 仓库以及如何在 Raspberry\
  \ Pi 上设置各种游戏服务器。你还学习了如何从 aptitude 安装 OpenTTD、Freeciv 和 OpenArena。我们介绍了如何使用 Java\
  \ Hard-Float 设置高性能 Minecraft 服务器。\n\n在下一章，我们将设置实时视频流。\n"
- "## 7 流式传输实时高清视频\n\n## \n\n在本章中，我们将使用由 Raspberry Pi 基金会设计的官方 HD 摄像头模块。借助新的四核处理器和\
  \ UV4L 的作者，我们现在可以直接以低延迟将视频流式传输到浏览器。\n\n在开始本章之前，你应该已按照随摄像头模块附带的说明安装并启用摄像头模块。建议分配\
  \ 256 MB GPU 内存。\n\n本章仅适用于 Raspberry Pi 2 或更新版本，配备四核处理器或更好。\n\n## 安装 UV4L\n\nUV4L\
  \ 是一个专为 Raspberry Pi 设计的用户空间网络摄像头驱动程序。它还包含本章将讨论的其他一些功能。UV4L 是由运营网站 http://linux-projects.org\
  \ 的 Luca Risolia 编写和开发的定制代码。我们将添加他的仓库以获取 UV4L 驱动程序：\n\n```\ncurl http://www.linux-projects.org/listing/uv4l_repo/lrkey.asc\
  \ | sudo apt-key add -\n```\n\n在 /etc/apt/sources.list 中添加以下行：\n\n```\ndeb http://www.linux-projects.org/listing/uv4l_repo/raspbian/\
  \ wheezy main\n```\n\n> 如果你尚未运行 rpi-update，则建议现在执行。UV4L 驱动程序需要最新的基金会内核和模块才能正确安装。\n\
  \n\n\n\n现在我们需要更新仓库列表，然后就可以安装 UV4L 驱动程序。我们将使用以下命令执行这些操作：\n\n```bash\nsudo apt-get\
  \ update\nsudo apt-get install uv4l uv4l-raspicam\nsudo apt-get install uv4l-server\
  \ uv4l-raspicam-extras\n```\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_104_0.png)\n\
  \n> UV4L 驱动程序使从树莓派流式传输视频变得非常容易。考虑通过访问他的网站来支持 Luca，为他的事业捐款或购买本章后面描述的叠加模块的序列号。\n\n\
  ## 配置 UV4L-RaspiCAM\n\n配置文件位于 /etc/uv4l/uv4l-raspicam.conf，用于配置初始视频流。存在一些默认设置，以下要点是文件中包含的设置，您可能有兴趣手动更改以供自己使用。\n\
  \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_104_1.png)\n\n> 如果使用 VLC 捕获流，这些是您可能想要使用的一些典型设置。驱动程序是自适应的，如果您请求\
  \ MJPEG 流，它将更改配置，或者它将从浏览器启动 WebSockets 流，从技术上允许您进行多路流。多路流是实验性的，不过。\n\n以下是一些典型设置：\n\
  \n- 编码：\n  - 流式传输：H264, mjpeg, jpeg, yuv420\n  - 专用：nv21, yuv420, rgb565, rgb565x,\
  \ rgb24, bgr24, rgba.\n- 帧率：\n  - 0 设置为自动\n  - 1080p 下为 30\n  - 720p 下为 60\n  -\
  \ VGA 下为 90.\n- 比特率：17000000（默认值）\n- 帧内周期：这仅用于 H264；如果您在流中遇到伪影，请尝试调整此值。通常，伪影是由丢失的帧和糟糕的网络性能引起的。此值越低，使用带宽越多。良好的起点是\
  \ FPS / 2。\n- 质量：\n  - 这仅适用于 JPEG 和 MJPEG 流式传输\n  - 85 是默认值。\n- * 文本叠加：取消注释这两个属性，因为本章后面需要它。\n\
  - * 无预览：如果您将显示器连接到 HDMI，您将看到原始流预览。如果您在使用 1 A 电源和 Wi-Fi 时遇到树莓派重启，请取消注释此项。\n\n其中大多数配置设置可以通过导航到\
  \ http://raspberrypi:8080 的 Web 界面进行更改。带 * 标记的选项必须在配置文件中配置，并且必须重新启动 UV4L。\n\n##\
  \ 安装 WebRTC\n\nWeb 实时通信（WebRTC）是一种协议，允许现代 Web 浏览器建立点对点链接以交换数据。UV4L 使用 WebRTC 创建到树莓派的套接字并接收实时\
  \ H264 视频流，消除了转码的需求，并允许我们直接在浏览器中观看高质量、低延迟的视频。\n\n要为 uv4l-server 安装 WebRTC 模块，我们只需要发出一个命令并重新启动\
  \ UV4L：\n\n```bash\nsudo apt-get install uv4l-webrtc\nsudo service uv4l_raspicam\
  \ restart\n```\n\n## WebRTC 流式传输\n\n请注意，UV4L WebRTC 流以自适应比特率和分辨率进行流式传输。流式传输到客户端的比特率和分辨率将根据连接质量自适应调整。这意味着您应用的任何配置都不会适用于\
  \ WebRTC 流，但叠加层仍将工作。它也可能断开不使用 WebRTC 的其他流。\n\n## 流式传输实时高清视频\n\n您现在可以导航到 http://raspberrypi:8080，您将看到类似以下内容的屏幕：\n\
  \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_106_0.png)\n\n您可以点击通过 WebRTC 的音频/视频流。然后，在下一页上，点击开始按钮。建立链接可能需要几秒钟，如果一切按计划进行，您现在将看到来自树莓派摄像头的实时流。\n\
  \n在树莓派 1 上，设置类似的流极其复杂，几乎没有资源留给 Pi。WebRTC 模块在从树莓派流式传输方面确实节省了大量时间。\n\n## 实时 HTTP 流式传输\n\
  \n要配置 HTTP 流，您可以点击 UV4L 网页上的“相机控制面板”链接并设置您想要的格式和其他选项。\n\n或者，如果您不想访问网页，您可以按需配置 raspicam\
  \ 配置文件，然后您可以在 VLC 或第三方应用程序中使用相应的 URL 捕获流：\n\n- HTTP/MJPEG：http://raspberrypi:8080/stream/video.mjpeg\n\
  - HTTP/原始 H264：http://raspberrypi:8080/stream/video.h264\n- HTTP/JPEG：http://raspberrypi:8080/stream/video.jpeg\n\
  \n要使用 VLC 接收 H264 流，我发现调整一些插件设置对我来说效果最好：\n\n- 1. 点击 **工具** | **首选项**。\n- 2. 在左下角的\
  \ **显示设置** 面板中点击 **全部**。\n- 3. 点击 **输入/编解码器** | **解复用器**。\n- 4. 将解复用模块从 **自动** 更改为\
  \ **H264** 视频解复用器。\n- 5. 点击 **解复用器** | **H264**。\n- 6. 您会注意到它设置为每秒 25 帧。不幸的是，更改此值不会按预期工作。您最好更改树莓派上的配置以以每秒\
  \ 25 帧的速度流式传输。\n- 7. 在树莓派上，为您的流选择合适的比特率。在局域网中，这可能是默认值，但在 Wi-Fi 上，我建议您尝试较低的比特率。\n\
  \n此配置最适合更高质量的流式传输。有必要将 VLC 解复用器更改为 H264，因为它似乎无法自行识别格式。您也可以指定额外的选项 `:demux=h264`，但我发现严格将解复用器设置为\
  \ H264 效果更好。\n\n我们还需要将树莓派上的帧率调整为 25 fps，以匹配 VLC 中 H264 模块的默认值。将 VLC 模块中的帧率调整为 30fps\
  \ 没有帮助。调整帧率的原因是我注意到移动物体上出现了奇怪的伪影。这表明存在带宽问题，但在局域网上也会发生。\n\n我最终找到了这个解决方案，并意识到树莓派发送的是\
  \ 30 fps，而解复用器以 25 fps 解码，导致关键帧不同步。尽管听起来很奇怪，但它确实能产生高质量的流，尽管缓冲时间约为 1+ 秒。\n\n如果您遇到无视频、大量伪影或长时间延迟，请参阅第\
  \ 2 章 *准备网络*，了解如何运行 `iperf` 测试以确保您拥有足够的带宽。带宽问题也可能是由电源不良引起的，尤其是在使用无线适配器时。\n\n## 网络会议\n\
  \n在 UV4L 的最新版本中，有一个有趣的用于音频和视频网络会议的新功能。此功能内置于 `webrtc` 模块中，无需额外配置。\n\n任何支持 WebRTC\
  \ 的设备，例如智能手机、笔记本电脑或标准台式机，只要使用现代浏览器，都可以通过访问 http://raspberrypi:8080/conference 加入会议。这将在您的局域网内工作，但如果您希望允许来自互联网的连接，您需要在信令服务器字段中提供正确的\
  \ IP 地址并打开必要的端口。\n\n这纯粹作为服务器工作，不使用 Pi 的摄像头，但您可以在 X 客户端和浏览器中从树莓派加入会议。如果您想在树莓派上使用音频，请确保已安装\
  \ pulseaudio 并配备兼容的 USB sound 卡和麦克风。\n\n## 流式传输 X 桌面\n\n您也可以使用 UV4L 驱动程序流式传输实际的\
  \ X 桌面。可以将其视为类似屏幕投射的东西，类似于 Miracast。如果您的智能电视浏览器支持 WebRTC，您只需输入 URL 即可在电视上获得桌面的无线视频\
  \ feed。\n\n要使用此功能，我们需要安装一个额外的模块。\n\n```bash\nsudo apt-get install uv4l-xscreen\n\
  ```\n\n然后您可以使用 raspi-config 启用启动到桌面/scratch 以在启动时启动。如 WebRTC 部分所述，目前唯一的限制是它仅适用于特定分辨率。未来可能会支持其他分辨率。您需要按如下方式编辑\
  \ /boot/config.txt 文件：\n\n```\nframebuffer_width=640\nframebuffer_height=480\nframebuffer_depth=32\n\
  framebuffer_ignore_alpha=1\n```\n\n您现在可以通过 SSH 登录到树莓派并发出以下命令：\n\n```\nuv4l --driver\
  \ xscreen --auto-video_nr --display :0 --framerate 10 --server-option '--port=9000'\n\
  ```\n\n忽略所有警告。此命令启动一个新的 UV4L 服务器并创建一个名为 /dev/video1 的设备，可以使用实时 HTTP 流式传输部分中描述的相同命令。它在\
  \ 9000 端口下创建 Web 服务器。8080 端口仍然有效，可以继续流式传输您的网络摄像头，同时单独流式传输 X 视频。\n\n您可以在以下地址查看视频传输：http://raspberrypi:9000/stream/webrtc。\n\
  \n\n\n## 文本叠加\n\n文本叠加是一个功能，允许您在不进行任何转码的情况下将文本行叠加到视频帧上。UV4L 驱动程序在高清流和高帧率（高于 30）下工作得非常出色，并支持\
  \ mjpeg、H264、yuv420 等视频格式。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_109_0.png)\n\
  \n> 启用时，图像的宽度和高度应为 16 的倍数。对于 1080p，您需要使用 1920 x 1088，720p 则为 1280 x 720，以此类推。\n\n\
  在最基本层面上，文本从 JSON 格式的文件中读取，该文件包含每行位置、颜色、粗细和缩放属性。默认配置文件将显示视频帧率，如正在传输时。配置文件在首次启动摄像头时加载，但可以用特定命令更新，使抬头显示器（HUD）成为现实。\n\
  \n要启用文本叠加，您需要在首次加载摄像头页面之前使用以下 /etc/uv4l/uv4l-raspicam.conf 配置启动驱动程序。如果已有正在进行的流，则无法启用此功能：\n\
  \n```\ntext-overlay = yes\ntext-filename = /usr/share/uv4l/raspicam/text.json\n\
  ```\n\ntext.json 文件包含您可用的所有选项的示例。将此文件复制到 /home/pi 是一个好主意。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_109_1.png)\n\
  \n> 如果您计划频繁更新文件，建议将文件存储在 /tmp 中，因为文件实际上会存储在 RAM 中。\n\n重新启动 uv4l_raspicam 服务后，您现在将在视频流上看到一些示例叠加文本。\n\
  \n您可以编辑 text.json 文件并在控制台执行以下命令以更新叠加文本：\n\n```\nv4l2-ctl --set-ctrl=text_overlay=1\n\
  ```\n\n这是一种非常基本的方法来更新视频流上的叠加，例如运行您编写的单独程序，每隔一段时间覆盖文件并发出刷新命令。\n\n使用这种方法，您无法比每秒一次更快地更新叠加。如果您希望实现实时叠加更新，请参阅\
  \ HUD 示例部分。\n\n有关如何删除 http://www.linux-projects.org 叠加的更多详细信息将在本章后面提供。\n\n## 对象检测与跟踪\n\
  \n对象检测和跟踪可以随时打开和关闭。此功能仅适用于 yuv420、H264 和 mjpeg 编码。\n\n此功能所需的 CPU 开销取决于您执行的任务的复杂程度。例如，在\
  \ Pi 2 上，您可以使用 640 x 480 在 15 FPS 下进行人脸识别，并伴随较重的 CPU 使用。在 Pi 1 上，大约是其一半：\n\n```\n\
  uv4l --driver raspicam --auto-video_nr --object-detection --min-object-size 80 80\
  \ --main-classifier /usr/share/uv4l/raspicam/lbpcascade_frontalface.xml --object-detection-mode\
  \ accurate_detection --width 320 --height 240 --framerate 15 --encoding h264\n```\n\
  \n## 删除叠加水印\n\n我已与 UV4L 作者 Luca Risolia 联系，他同意为您提供独家优惠；作为本书的读者，您将是第一个知道他同意为您提供一种方法来删除您拥有的\
  \ 3 台 Raspberry Pi 上的白色 http://www.linux-projects.org 水印的人！\n\n您需要做的就是发送电子邮件至 info@linux-projects.com，并附上从您的\
  \ Raspberry Pi 执行并复制此命令结果的以下详细信息：\n\n```\nuv4l --driver raspicam --serial-number\n\
  ```\n\n我确信 Luca 会感谢您为三个序列号提供的少量捐赠，这将使他能够继续为这个出色的驱动程序创建更多功能。\n\n## HUD 示例\n\n如 Wikipedia\
  \ 所定义，抬头显示器，也称为 HUD，是一种透明显示器，可在用户无需将视线从主要活动移开的情况下呈现数据。名称的起源来自飞行员能够在头部保持抬起或向前的位置查看信息，而不是向下看一些仪器。\n\
  \n因此，为了让我们不要低头看控制台，我认为在视频流上直接查看有关我们 Raspberry Pi 的一些信息是个好主意。\n\n在 Luca 的帮助下，我创建了\
  \ C++ 代码，该代码允许您使用 UV4L API 直接几乎在每一帧上更新叠加，这意味着几乎没有 CPU 开销。\n\n如果您熟悉 C++11，我已在代码下载页面上提供了完整的代码示例，您可以添加自己的变量。\n\
  \n我还提供了一个编译好的二进制文件，其中包含多种流行的资源变量，您只需将其放置在模板文件中使用一次，即可在流上实时更新。\n\n## 使用叠加二进制文件\n\n\
  二进制文件需要两个参数：源视频设备和源文件，将其称为模板文件。模板文件与 text.json 的格式完全相同，但不同之处在于您使用此处列出的内联变量构造文本字段。建议将模板文件复制到\
  \ /tmp/file.tpl 并将其作为源模板提供。\n\n您还需要更新 uv4l-raspicam.conf 文件以指向新位置 /tmp/text.json（不是模板文件），并重新启动\
  \ UV4L 服务。将在 /tmp/text.json 中创建一个新文件，UV4L API 调用将从中读取替换后的变量。请勿更改此文件。在 /tmp 中使用这些文件对于实现最佳视频性能至关重要，同时也可以消除\
  \ SD 卡的 I/O，这可能会在长时间使用期间导致不必要的磨损。\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_111_0.png)\n\
  \n> 顺便说一下，您可以在二进制文件运行时更新模板 /tmp/file.tpl 文件。C++ 二进制文件使用以只读模式打开且锁定最少的流读取模板文件。\n\n\
  使用以下命令行执行二进制文件：\n\n```\n./overlay /dev/video0 /tmp/text.tpl\n```\n\n## 内联变量\n\n\
  以下是来自 Raspberry Pi 通用资源的某些有用变量：\n\n- {sysinfo.cputemp}\n\n无线信息（默认为 wlan0）：\n\n-\
  \ `{wlaninfo.level}`: 信号强度\n- `{wlaninfo.quality}`: 信号质量\n- `{wlaninfo.bitrate}`:\
  \ 比特率\n\n网络带宽（默认为 eth0）：\n\n- `{netinfo.downspeed}`\n- `{netinfo.upspeed}`\n\n示例文本行将如下所示：\n\
  \n```\n\"ETH0 UP: {netinfo.upspeed} CPU temp {sysinfo.cputemp}\"\n```\n\n要更改默认值，您需要修改\
  \ C++ 文件并重新编译。如果您已经要编辑代码，请以基础代码为例并尝试添加其他内容。如果您从未编辑过 C++ 或任何其他代码，只需逐行理解主类，到最后您将理解基本的\
  \ C++。\n\n## 自己编译叠加代码\n\nC++ 代码以 C++11 标准编写，需要安装 G++ 版本 4.8 才能编译此代码。此示例不需要额外的库，例如\
  \ libboost：\n\n```\nsudo apt-get install g++-4.8\n```\n\n安装最新 G++ 后，您只需通过执行以下命令编译主代码文件和额外代码文件以及您所做的任何更改：\n\
  \n```\nsudo g++-4.8 -Ofast -std=c++11 *.cpp -o overlay\n```\n\nLuca 还提供了一个文本滚动示例，可以从\
  \ http://www.linux-projects.org/downloads/examples/uv4l-overlay.cpp 下载，但它需要 Boost\
  \ C++ 库。不幸的是，包含此库会导致代码编译时间明显更长。这就是我在代码中删除了所有 Boost 库依赖项的原因；它为现代编程语言中使用的任务和结构提供了大量额外支持，值得一试：\n\
  \n```\nsudo apt-get install libboost-all-dev\n```\n\n如果您是 Visual Studio 开发者，您会很高兴知道我已使用\
  \ **VisualGDB** 在 Visual Studio 中创建了叠加二进制文件。VisualGDB 允许您在桌面上的 Visual Studio 中使用\
  \ C++ IntelliSense 编写代码。它将自动复制您的文件并通过 SSH 在 Raspberry Pi 上编译它们。另一个很棒的功能是您可以在 Visual\
  \ Studio 中调试在 Pi 上运行的代码！您无需在 Raspberry Pi 上安装任何额外软件。有关如何开始使用 VisualGDB 的教程可在 `http://visualgdb.com/tutorials/raspberry/`\
  \ 获取。\n\n该网站上还有其他教程您可能会感兴趣。您可以使用 30 天试用。\n\n## 摘要\n\n流式传输视频仍然是 Raspberry Pi 在互联网上最受欢迎的搜索词之一。有很多不同的示例和解决方案，有些非常复杂，有些非常简单。\n\
  \n得益于 UV4L 驱动程序的工作，视频流式传输变得更容易实现。与 *Raspberry Pi Server Essentials, Packt Publishing,\
  \ 我的* 前一本书相比，本章由于现在实现的简易性而被极大地缩短了。不仅更短，我们还有更多功能可以使用，并且可以用最少的努力在 Raspberry Pi 2 上享受高清视频流式传输。\n\
  \n在下一章中，我们将研究如何将 Pi 设置为媒体中心。\n\n\n"
- '## 8 将 Pi 设置为媒体中心服务器


  树莓派具有 HDMI 输出，能够流式传输高清音视频，并且还支持 CEC 以共享遥控功能。在本章中，我们将介绍如何直接从命令行使用树莓派作为媒体服务器，显示图像和播放音频。我们将简要介绍人们提出的某些其他解决方案，最后安装
  OSMC（以前称为 RaspBMC——一个 XBMC 媒体中心），它开箱即用硬件解码和 CEC。


  如果你要使用 Raspbian 进行这些示例，建议分配更多 GPU 内存。树莓派 2 推荐的值为 512MB。你可以通过在命令行中输入 `raspi-config`
  来更改核心系统设置。


  ### 幻灯片


  Linux 用户熟悉名为 `fbi`（帧缓冲图像查看器）的命令行程序。我们将使用 HDMI 电缆连接宽屏显示器或 HD 电视。


  > 您应注意，小于 19 英寸的方形比例计算机显示器或非 HD 电视通常不被 HDMI 输出支持。


  有一个名为 HDMI Pi 的项目，提供了一款经济实惠的 9 英寸、HD 1280 x 800 LCD 屏幕，可直接插入 HDMI 端口而无需任何额外部件。还有其他更小的
  LCD 屏幕可供选择，但它们可能相当昂贵，并且需要检查兼容性。


  ### 使用 fbi


  在树莓派上，您可以加载来自高质量相机的原始尺寸照片，但建议使用高速 Class 10 SD 卡或其他快速存储。新的四核处理器可显著加快加载时间。在树莓派 1 上，建议缩小照片尺寸以帮助加载时间。对于树莓派，仍然建议缩小尺寸，但您可以轻松将图像保持在
  HD 分辨率，约为 300 万像素（2048 x 1536）。为了获得最清晰的图像，建议将图像分辨率与显示分辨率和宽高比相匹配。


  通过 SSH 使用以下命令行。这将安装 fbi 并通过 SSH 启动简单的幻灯片放映，但输出将是 HDMI 上连接的显示器：


  ```

  sudo apt-get install fbi

  cd /home/pi/photos

  sudo fbi -T 1 -a -noverbose -t 5 *.*

  ```


  fbi 现在将循环浏览目录中的所有图像，每 5 秒更换一次，直到您停止它。


  -T 1 命令告诉 fbi 使用终端 1 输出（仅在 SSH 中），这将是 HDMI 端口。我们告诉它自动调整图像大小以适应屏幕，而 -a -t 5 每 5 秒更换一次图像，-noverbose
  禁用任何调试信息。


  您会注意到 fbi 不会阻塞控制台并在后台运行。可以再次运行 fbi，它不会抱怨另一个实例。然而，这可能会导致内存不足错误和不想要的行为。


  要停止 fbi，我们使用 killall 命令：


  ```

  sudo killall fbi

  ```


  ### 播放视频


  我们可以使用 OMXPlayer 播放视频和音频文件，它是专门由 XBMC 项目设计的，并在树莓派上使用硬件解码。由于 OMXPlayer 使用硬件解码器，您可以使用任何额外购买的视频许可证。


  > OMXPlayer 运行至少需要 256 MB GPU 内存。


  ### OMXPlayer for video playback


  将 MP4 文件下载到树莓派上（例如，我们可以使用网站 http://www.hd-trailers.net/ 找到一些链接），我们将使用 OMXPlayer
  将视频和声音播放到 HDMI 端口。您也可以直接使用 RTMP 流代替视频文件。将 wget 中的 URL 替换为互联网上现有的文件：


  ```

  sudo apt-get install omxplayer

  cd /tmp

  sudo wget http://videosite.com/filename.mp4

  omxplayer -o hdmi filename.mp4

  ```


  ### 播放音频


  最新 Raspbian 镜像已安装所有声音驱动程序和实用工具。使用的软件包属于 ALSA。树莓派无法录制音频，因为它没有麦克风插孔，并且 GPIO 引脚都是数字的。要使用
  GPIO 录制音频，我们需要使用 A/D（模拟-数字）设备或具有麦克风输入的 USB 声音设备。


  ### Aplay for audio playback


  以下是一个预安装的软件包，可播放 WAV 文件：


  ```

  cd /tmp

  wget http://goo.gl/Ps3paV

  mv Ps3paV siren.wav

  aplay siren.wav

  ```


  ### OMXPlayer for audio playback


  OMXPlayer 不仅用于播放视频。它还支持音频文件的播放，例如 MP3 文件，如果可能的话会尝试使用硬件解码：


  ```

  omxplayer audio-test.mp3

  ```


  ### 使用 AirPlayer


  有一个名为 shairport 的项目在树莓派上运行得非常好。它不支持视频或照片，但其中的音乐流媒体非常稳定。我们需要获取该项目并编译它。这只需要几分钟：


  ```

  cd /tmp

  git clone -b 1.0-dev git://github.com/abrasive/shairport.git

  cd shairport

  sudo ./configure && sudo make && sudo make install

  ```


  /tmp 上的文件将在下次启动时被删除，这没问题，因为二进制文件现在已安装在树莓派上。使用以下命令运行服务器，AirPlay 图标将显示在播放音乐的 Apple
  设备上：


  ```

  shairport -a ''ShairPortPi''

  ```


  这将阻塞控制台，您会不时看到有关数据包的一些消息弹出，但这是正常的。


  ### 使用 alsamixer


  您可以登录到另一个 SSH 控制台并使用 alsamixer 控制音量。树莓派默认只有一个输出，按上或下键会使声音更大或更小：


  ```

  alsamixer

  ```


  ### 安装 OSMC


  OSMC 是一个免费开源的媒体中心，最初称为 RaspBMC；它基于 XBMC。在本节中，我们将在 SD 卡上烧录新镜像。您可以使用另一张 SD 卡或擦除到目前为止一直使用的卡。


  我们可以使用适用于 Windows、Mac OS X 和 Linux 的 UI 安装程序：


  - 1. 打开浏览器并导航到 https://osmc.tv/download.

  - 2. 选择与您将从中烧录镜像的操作系统相匹配的 UI 下载链接；下载并运行它。

  - 3. 选择您的语言，然后选择 Raspberry Pi 2.

  - 4. 在以下屏幕中，尝试选择最新版本。


  > 网络镜像意味着在首次启动时，它将下载最新文件，因此建议在首次启动时连接有互联网访问的有线网络。


  UI 安装程序还为我们提供了一个选项，可将 OSMC 安装在 USB 驱动器而不是 SD 卡上。如果您选择此选项，您需要在首次启动时连接 USB 存储设备。您还需要一个键盘。


  首次启动可能需要大约 10 分钟才能完成，之后它将重新启动，安装即完成。


  ### 配置 OSMC


  OSMC 可以从用户界面进行配置，但您仍然可以登录 SSH 来安装自己的服务或调整一些高级设置。默认的 root 登录名和密码是 OSMC，如果您将浏览器导航到
  http://osmc.local，您还将获得一个网络遥控器。


  > 在遥控器页面上，您可以使用键盘箭头来控制用户界面，而无需点击按钮。


  ### 启用其他编解码器


  OSMC 使用 OMXPlayer，它由 XBMC 维护。正如我们所知，OMXPlayer 使用 Pi 的硬件来解码视频并渲染 GUI。


  如果您有 MPEG-2 或 VC-1 编码的文件，您只需购买许可证并使用 OSMC 界面输入代码即可。H264 编解码器已包含在树莓派的价格许可中。通过导航到：Programs
  | OSMC Settings | Pi Config (Raspberry ICON) | GPU Mem & Config 然后输入您的密钥并重新启动系统。


  ### 无线配置


  如果您已插入无线适配器，您应该能够在首次设置向导期间设置无线连接。您仍然可以配置 Wi-Fi，并且如果您的适配器支持，您还可以启用网络共享（称为接入点），这是一个很棒的功能，如果您的树莓派通过以太网连接，可以扩展您的
  Wi-Fi 范围。导航到 Programs | OSMC Settings | Network (3 CONNECTED CIRCLES ICON)




  ## 媒体来源


  你可以开始添加存储在 USB 驱动器上的文件的位置。

  为此，请导航到以下选项：


  - **视频 | 文件 | 添加视频**

  - **音乐 | 添加音乐**


  如果插入了硬盘或 USB 闪存盘，你将能够浏览到该位置。要访问 Samba 或 NFS，你需要在 NAS 的 IP 地址前输入特定的前缀以指定所需的协议：


  - `smb://192.168.0.1/movies`

  - `nfs://192.168.0.1/music`


  ## 使用附加组件


  OSMC 只有一个附加组件存储库，但你也可以安装自定义附加组件。

  你可以在以下存储库中找到一些很棒的附加组件：


  **程序 | 获取更多...**


  许多附加组件正在移植到 OSMC，随着时间的推移，你应该会发现越来越多有趣的程序可供安装和使用。


  在 Raspberry Pi 上，你还可以访问有限的 OSMC 应用商店程序：


  **程序 | OSMC 设置 | 应用商店** (购物车图标)


  ## AirPlay


  作为 Apple 用户，你会欣赏 OSMC 可用作目标来流式传输你的媒体：


  **设置 | 服务 | AirPlay | 允许 AirPlay 内容**


  现在你将在你的 Apple 设备上找到 AirPlay 图标。


  ## 启用 CEC 和遥控器


  CEC（消费电子控制）是一种标准化协议，用于新型电视、媒体播放器和音响设备。你需要使用 HDMI 电缆连接所有设备。通常，大多数遥控器或系统都允许这些功能。CEC
  默认启用，但你可以按需更改设置。为此，请导航到 设置 | 系统 | 输入设备 | 外设 | CEC。


  如果你使用符合 CEC 标准的 HDMI 电缆的智能电视，你应该能够使用方向按钮控制音量并导航 OSMC。不同设备之间的支持程度各不相同。


  你也可以在系统配置中查看启用其他遥控器。你可能需要手动配置蓝牙或红外适配器以启用它们。导航到 程序 | OSMC 设置 | 遥控器 (遥控器图标)。


  ## 性能优化


  OSMC 在 Raspberry Pi 2 上运行最佳，且无需更改任何设置。


  还有一个 Raspberry Pi 安装程序，它已针对最佳性能进行了调整，缺少很多花哨的功能，但可以播放高清视频。


  ## 超频


  通常不建议超频 Raspberry Pi，因为它往往会导致网络和稳定性问题。但如果你有充分的理由这样做，则可以在此处找到该选项：程序 | OSMC 设置 | 超频
  (仪表图标)。你可以选择 Turbo 预定义超频设置，或设置自己的自定义范围。


  ## 摘要


  在本章中，你学习了如何从控制台播放音频、制作幻灯片和观看视频。我们还探讨了如何安装基于 RaspBMC 的新操作系统，即 OSMC。


  在下一章中，我们将了解如何使用电池为 Raspberry Pi 供电。

  '
- "## 9 使用电池电源运行你的 Pi\n\n## \n\n你通常会使用市电供电的 USB 适配器运行服务器。Raspberry Pi 体积非常小，与完整的台式电脑不同，如果电池设置正确，它可以长时间由电池供电。\n\
  \n你可能需要为远程控制应用使用电池为 Raspberry Pi 供电，例如偏远地区的气象站、遥控汽车等类似情况。\n\n嵌入式设备最常见的问题与电源有关。你购买了\
  \ 2 A 电源，但你看不到的一点是电源产生的噪声有多大。\n\n本章会很短，但我将演示如何创建一个持久、超干净、99.8% 无噪声的电源。这对于依赖干净稳定电源的无线通信非常理想。\n\
  \n## 硬件要求\n\n如果你真的认真考虑使用电池为 Raspberry Pi 供电，你需要为一些额外设备准备预算。这些要求不会让你倾家荡产，但我也会包含更昂贵的解决方案及其优点。本章基于我通常使用的最低必要设备。\n\
  \n最低要求如下：\n\n- 一个电池充电站\n- NiMH 电池组\n- 一个电压调节器\n\n这些是获得一个相当不错且安全的电池电源所需的最小部件。\n\n\
  电池充电站和电压调节器可以重复使用多年，唯一的额外费用将是新电池或更高质量的设备部件。\n\n剩余章节将使用这些部件作为我的测试平台，每个组件的估计价格如下：\n\
  \n- Charger: IMAX B6 (35 EUR/40 USD)\n- Batteries: 2 x 1500 mAh 6.0V NiMH High power\
  \ series (18 EUR/22 USD)\n- Voltage regulator: 3 A/5 A UBEC with capacitor (4 EUR/6\
  \ USD)\n\n## 充电站\n\n这将是你需要购买的最昂贵的部分，但它是一次性支出。我推荐的充电站是众所周知的 IMAX B6。它可以为多种电池充电：Li-ion、LiPo、LiFe、NiCd、NiMH\
  \ 以及 Pb。它具有内置安全功能；非常可靠且紧凑，几乎是最便宜的全能充电解决方案。\n\n这个充电器的最后一个优点是，你可以使用 12V 至 18V 之间的任何电源包为其供电。不过需要注意的是，电压越接近\
  \ 12V，电源砖所需的安培数越高，但这也取决于你为电池充电的速率。如果你决定使用快速充电电池，请使用更高电压和安培数的电源包。请看下一张图片：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_124_0.png)\n\
  \n> 我强烈建议你尝试采购正品，以保证电池使用寿命最长。使用仿制品可能足够安全，但请尝试降低最高充电限制或遵循校准说明以防止过充。请始终在安全且通风良好的房间远离易燃物并远离儿童的地方为电池充电。\n\
  \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_125_0.png)\n\n## 电池组\n\n在我的短名单中，我推荐 NiMH（镍金属氢化物）电池，因为它们是最安全的电池。这些电池在过充时不会变得不稳定；换句话说，你不必担心其他类型电池可能发生的剧烈爆炸。过充这些电池会造成永久性损坏，如果发生这种情况，电池必须更换。\n\
  \n不过它们有较快的自放电率，因此如果充满电后存放以备后用，不会持续很久。最好在充电后不久使用它们。\n\n一个重要因素是它们购买价格相当便宜。随着最近的纳米电池\
  \ NiMH 技术，你可以多付一点钱来获得比领先的 Li-Po 电池更好的功率输出和容量。请看以下图片：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_126_0.png)\n\
  \n## 电压调节器\n\n你可能想知道为什么我们不直接使用 5V 电池为 Raspberry Pi 供电，从而减少额外电池和电压调节器的成本。\n\n这都取决于与家庭用电相同的原理。发电站以超过数万伏的极高电压传输电力，但你的电脑运行只需要\
  \ 12V。\n\n所有这些的答案是欧姆定律。要以最简单的术语理解这一定律，你可以想象一个跷跷板，一侧是伏特，另一侧是安培（电流）。请看以下图片：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_127_0.png)\n\
  \n伏特越多，你需要使用的安培数就越少。安培数越多，你需要提供的伏特数就越少。欧姆定律是通用的且易于调整，但你仍需记住电阻，它始终在跷跷板两侧与你对抗，这与你使用的电线厚度有关。\n\
  \n使用 2 x 6V（12V）电池组电源为 5V 系统供电，我们可以获得一些好处：\n\n- 我们可以在一段时间内提供更高的恒定功率（安培）\n- 我们可以将电池电芯用到最后一伏特；它会在不向\
  \ Raspberry Pi 断电的情况下为我们提供电力\n- 提供峰值功率（高功率需求的突发）要容易得多，如果你想使用电机或传输高功率数据突发，这非常理想，而且使用更高电压这样做更高效\n\
  - 通常，在这种情况下，这是 Raspberry Pi 最稳定的配置\n\n\n\n## 欧姆定律\n\n下图是欧姆定律的简化版本。它展示了计算特定值所需的所有计算，如前所述。例如，如果你想计算需要多少安培，你可以找到安培标题并选择合适的方程。合适的方程是指你可以在右侧填入所有未知数的方程。应用计算，结果就出来了：\n\
  \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_128_0.png)\n\n## 放电曲线\n\n当电池电芯开始耗尽时，在其容量的最后\
  \ 10% 内提供的电压会下降得快得多。查看此图表，你可以轻松了解在各种放电速率下该曲线是什么样的。如果我们使用 5V 电池电源，树莓派只能运行约 60% 的电池电量，因为它很快就会降至稳定运行所需的\
  \ 4.9V 以下。但如果我们使用更高电压的电芯，就能利用每一滴电压来保持树莓派运行：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_128_1.png)\n\
  \n## 放电特性\n\n随着每个电芯的电压下降，电压调节器会从电池中抽取更多功率（安培）以保持输出电压稳定。还记得跷跷板效应和欧姆定律吗？最后一部分电量会被迅速用完，但会持续为\
  \ Pi 提供稳定的输出功率：\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_129_0.png)\n\n## 综合起来\n\
  \n要找到所有额外的部件，例如连接器和电线，你应该去最近的 RC 爱好商店。你可以购买所有零件并自行压接，但也有为此特定设置准备好的成品线。\n\n我强烈建议你通过\
  \ USB 连接器为 Raspberry Pi 2 供电。Raspberry Pi 基金会在 Raspberry Pi 2 上特别注意创建了一个新的电源滤波系统，以帮助稳定\
  \ Raspberry Pi。主要是因为市面上有很多奇怪的 USB 电源，额外的滤波和保护总是好的。\n\n如果你有任何额外的外设，最好将它们直接连接到电压调节器输出，而不是从\
  \ Pi 的 GPIO 或 USB 端口供电。这将减轻 Raspberry Pi 的不必要压力，而电压调节器可以轻松处理更高的负载。\n\n## 能用多久？\n\
  \n电池容量使用 mAh（毫安小时）来衡量：\n\n- 通过串联电池，如本设计所示，你不会获得更多容量而是获得更高电压\n- 通过并联电池，你会获得更多容量但电压保持不变。\n\
  - 找到最佳平衡取决于你的需求\n\n要正确计算电池能运行多久可能会变得非常复杂。你需要考虑很多因素。在本设计中，使用更高电压可以让我们有更多时间，因为电压调节器需要使用更少的电流（安培）；更高的放电电流会降低电池可用性。\n\
  \n在理想世界中，你可以说我们能够提供每小时 1,500 毫安。这相当于整整一小时的 1.5 安培。如果你想延长电池寿命，可以在现有电路的并联上添加一个单独的电池电路，例如本章中演示的那样。这样，你就可以获得\
  \ 2 小时的 1.5 安培或 1 小时的 3 安培。\n\n根据我的经验，我能够通过 Wi-Fi 将 HD 视频流式传输到我网络上的另一台计算机，持续近 3\
  \ 小时。\n\n## 总结\n\n你了解到，如果不了解欧姆定律和电池的一些基本特性，使用电池供电很快就会变得复杂。\n\n使用这种经过测试的设计，你现在应该能够更轻松地扩展你的需求，但我鼓励你在更改此设计的某些方面时始终进行更多研究。\n\
  \n如果有疑问，请找一家口碑良好的 RC 爱好商店；他们在这种设备中使用的原理在这里完全相同，你可以在那里获得所有零件和知识。\n\n在下一章中，你将学习如何安装\
  \ Windows IoT 并在 Visual Studio Community 中创建简单的通用应用程序。\n"
- '## 10 Windows IoT Core


  Windows IoT Core 的主要目标是教育和业余爱好用户。它确实有一个 GUI 堆栈，但仅限于微软的通用应用平台（UAP），如果你有兴趣使用 XAML
  或 HTML 开发 C# 应用程序，这并不是坏事。


  你并不严格局限于前面提到的技术。微软试图支持一些其他编程语言，例如使用 UAP SDK 的 C++ 和 Python，但也支持具有一些限制的原生 Win32 应用程序或服务。


  开发通用应用的另一个好处是，你可以将其安装在运行 Windows 10 的任何设备上，甚至是完整的桌面。因此，很容易将一个代码库分发到 Raspberry Pi
  2、Intel Galileo 或 MinnowBoard 用于嵌入式应用。也可用于远程管理控制台到你的 Windows 10 手机、平板电脑、桌面或 Xbox。


  Windows IoT 因 Linux 社区对其为何要费心做这一切而受到很多批评。本质上，目的不是取代 Linux 或试图排挤 Linux 用户，而是帮助更多人参与嵌入式原型制作。作为一名
  .NET 开发者，你会欣赏到你终于可以在你喜爱的 IDE 中为嵌入式设备创建应用，实现流畅的工作流程。Visual Studio 具有完整的调试功能，能够在可以测量你鱼缸温度的设备上嵌入你最喜欢的
  NuGet 包。


  > 在撰写本章时，请注意 IoT 刚刚发布；仍有许多问题有待解决，还有更多功能有待添加，因此从现在起只会越来越好。


  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_131_0.png)


  ### 开始


  要充分受益于本章，你需要一台 Windows 7 或更高版本的桌面机器。推荐 Windows 10 但不是必需的。


  要为 Windows 创建通用应用程序，IoT 需要安装 Visual Studio 2015。你可以安装一个完全免费的版本，称为 Community 版。只有
  2015 版支持通用应用。你也可以在 Community 版中完全免费创建其他类型的项目。


  要开始开发通用应用，你必须拥有 Visual Studio 2015。你可以免费下载 Community 版，但你需要创建一个实时账户并在 Visual Studio
  社区中登录该账户，以保持你的免费订阅处于活跃状态。


  ### 刷写 IoT


  建议使用 Windows 10 桌面下载并烧录 IoT 镜像到 SD 卡。要获取镜像，你需要打开 https://dev.windows.com/en-us/iot
  并点击 Get started now。然后你可以点击 Raspberry Pi 2 并按照那里的步骤操作。


  SD 卡镜像以仅在 Windows 10 上支持的 FFU 格式分发。为了能够在旧版本的 Windows 上烧录，我们需要将镜像转换为原始镜像文件。


  ### 适用于 Linux 或 Windows 7 和 8 的 Python


  Windows 10 具有 DISM 二进制的新版本，用于将 FFU 镜像文件类型烧录到 SD 卡。在以前版本的 Windows 中，我们需要使用 Python。Python
  也用于基于 Linux 的机器。


  如果你在 Windows 或 Linux 机器上安装了 Python，可以使用一个由昵称为 t0x0 的人创建的脚本，它可以从以下位置下载。该脚本同时适用于 Windows
  版 Python 和 Linux 版 Python：https://raw.githubusercontent.com/t0x0/random/master/ffu2img.py


  此时，你需要为 Windows 安装 Python 2.7 或更新版本，你可以从 https://www.python.org/downloads 获取最新的安装文件。


  将 FFU2IMG Python 脚本复制到你提取 Windows IoT 镜像的目录中。打开一个命令窗口，导航到该目录，并使用以下命令转换镜像：


  ```

  python ffu2img.py Flash.ffu

  ```


  Then, you can flash the image onto an 8 GB minimum SD card from your Linux machine:


  ```

  sudo dd bs=1m if=Flash.img of=/dev/<your_SD_card>

  ```


  Or you can use Win32 DiskImager to burn the image from Windows, as described in
  Chapter 1, Getting Started with the Raspberry Pi for Raspbian.


  ## 首次启动


  插入 SD 卡，连接有线网络和 HDMI 显示器，然后打开电源。首次启动需要几分钟，屏幕会出现闪烁和奇怪的图形或文字。它会自动重启，然后你会看到语言选择屏幕。如果没有连接键盘，默认（英语）会自动被选中；之后，你会看到类似下图的屏幕：


  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_133_0.png)


  在此屏幕上，你会看到分配给 Raspberry Pi 的 IP 地址。你可以将 IP 地址加上端口 8080 输入浏览器，即可看到 Web GUI。


  默认用户名是 administrator，密码是 p@ssw0rd。


  ## 远程连接


  你可以通过 Windows 中的 PowerShell 或 SSH 连接连接到 Windows IoT，这将为你提供在 Windows IoT 上运行的 PowerShell
  命令行。


  最简单的方法是使用 Putty 或类似工具通过 SSH 连接，就像你通常连接到任何基于 Linux 的机器一样。


  要从 Windows 使用 PowerShell 连接，请执行以下操作：


  - 1. 点击 **开始** 菜单并开始输入 `powershell`。

  - 2. 右键点击 **Powershell** 并点击 **以管理员身份运行**。

  - 3. 然后，我们需要输入几条命令以便首次连接到 IoT：


  ```

  net start WinRM

  Set-Item WSMan:\localhost\Client\TrustedHosts -Value <IP Address>

  ```


  之后，你就可以使用以下命令从 Windows PowerShell 连接到 IoT PowerShell：


  ```

  Enter-PSSession -ComputerName <IP> -Credential localhost\Administrator

  ```


  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_134_0.png)


  > 连接过程可能需要长达 30 秒。

  > 建立连接后，你会在提示符前看到设备的 IP 地址。


  ## Visual Studio (VS)


  本节将介绍如何为 IoT 准备 Visual Studio 2015，并查看 Hello World 应用程序以熟悉 IDE。


  ## 安装 Visual Studio 2015


  使用你喜欢的浏览器搜索 **Visual Studio 2015 Community edition**，它完全免费使用且没有时间限制；下载并安装它。


  安装 VS 后启动一次，并在需要时使用下载 VS 时使用的 Live 账户登录。一旦全部加载完成，我们需要关闭它以安装用于 Raspberry Pi（或其他运行
  Win 10 IoT 的嵌入式设备）开发所需的 IoT 模板


  再次使用你喜欢的搜索引擎搜索 **Windows IoT Core Project Templates**。你应使用官方 Microsoft `http://www.visualstudiogallery.msdn.microsoft.com/`
  链接。那里可能有重要信息，请阅读。点击 **下载** 按钮并运行可执行文件。这将安装额外的 **通用 Windows 平台 (UWP)** 模板，这些模板不仅能让你为
  Visual Studio 在无头 Pi 上编写后台应用程序，还包含我们在通用应用中会使用的特定库。


  再次启动 Visual Studio，并在 C# 下找到新模板。验证模板是否已正确安装：


  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_135_0.png)


  ## Hello World 应用程序


  此应用程序需要连接显示器，因为我们首先要创建一个 Windows 通用应用程序。它还展示了如何准备解决方案以便在 Raspberry Pi 上使用：


  - 1. 我们将使用此模板创建一个新项目；导航到 **模板** | **Visual C#** | **Windows** | **通用** | **空白应用**（通用）。

  - 2. 将其命名为 `HelloWorld` 并点击 **确定**。

  - 3. 如果你使用的是 Windows 10，可能会提示 **启用开发者模式**；导航到 **设置** | **更新和安全** | **开发者**。

  - 4. 最后一步是添加对 Raspberry Pi 特定功能（如 GPIO）所需的 IoT 扩展的引用。

  - 5. 右键点击 **引用** | **添加引用** | **通用 Windows** | **扩展** 并勾选 **Windows IoT Extensions
  for the UWP**。


  Windows 使用 XAML 标记设计。如果你曾经使用过 Silverlight，那么你应该熟悉 XAML。XAML 是一种通用对象实例化语言，大多是声明式的，如
  HTML，但带有 XML 的特点。但无需担心底层标记，因为 Visual Studio 允许你可视化设计！


  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_136_0.png)


  > 还有一个专门的软件叫做 Blend，纯粹用于为可能需要的应用程序创建复杂的 XAML 布局。


  - 1. 在 Windows 中的 **解决方案资源管理器** 窗格中，找到并双击 **MainPage.xaml**。

  - 2. 一个新的空白设计器视图将打开。

  - 3. 从顶部选择 `40" IoT Device`，因为我们将为大屏幕的 IoT 设备制作此视图。如果你使用迷你 LCD，也可选较小的屏幕选项。这有助于你在透视图中布局设计。在高级技术中，你可以使用单独的
  XAML 文件为各种设备创建单独的视图。这些视图将尽可能最好地缩放以适应可用屏幕。

  - 4. 现在你可以展开右侧的 **工具箱** 并查看 **XAML 控件** 下的内容。

  - 5. 从工具箱中，点击并拖动按钮控件到白色设计器区域。然后将其放入 **TextBlock**。

  - 6. 调整按钮控件大小，使其更大，因为它可能以非常小的尺寸放置。

  - 7. 在按钮控件被选中的情况下，将右侧视图中的 **窗格** 更改为 **属性**。

  - 8. 找到 **常规** 选项卡并更改内容值以更改按钮上显示的文本；例如，`Hello World!`

  - 9. 你也可以更改文本块的一些属性，例如字体大小。

  - 10. 然后在设计视图中双击按钮。这会创建代码片段；将视图更改为代码区域，并将光标定位在按钮点击事件代码上：


  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_137_0.png)


  在代码中，我们将使用以下一行代码更改 textBlock.Text 值：


  ```

  this.textBlock.Text = "Hello World!";

  ```


  ## 部署应用程序


  将应用程序部署到 Raspberry Pi 非常简单，但首先我们将更改包名。不幸的是这并不明显，但请按照以下步骤操作：


  - 1. 在 **解决方案资源管理器** 窗格窗口中，点击 **解决方案资源管理器** 选项卡。

  - 2. 右键点击 **HelloWorld** 项目（不是解决方案）并选择 **属性**。

  - 3. 导航到 Package **清单 | 打包**。

  - 4. 包名中的默认值是一个唯一 ID，这是在 IoT 上创建的进程的名称。现在我们可以将其更改为不带空格的 **HelloWorld**。当你想将应用发布到商店时，你需要使用
  **命名空间**，例如 `My.RaspberryPi.HelloWorld`。

  - 5. 按下 *Ctrl + S* 保存解决方案，然后关闭窗口。


  现在，要发布，我们需要更改一些设置并选择目标设备：


  - 1. 将顶部工具栏中的 `x86` 值更改为 `ARM`。

  - 2. 接下来，在绿色播放按钮旁边有一个小下拉按钮；点击它并选择 **远程机器**。

  - 3. 这将打开一个新窗口，自动发现网络上运行的 Windows IoT 设备。确保你的 Raspberry Pi 已启动到 Windows 10 仪表板应用。

  - 4. 点击在 **自动检测** 下找到的设备条目，然后点击 **选择**（每个会话只需执行一次）。

  - 5. 项目将开始构建；如果没有错误，它将被发布到 Raspberry Pi 并运行你的应用程序。Visual Studio 不处于调试模式！

  - 6. 在 Raspberry Pi 上，点击你的按钮，文本框将使用你在代码中输入的文本进行更新。

  - 7. 要停止调试，点击红色的 **停止** 按钮。


  你现在已经为 Raspberry Pi 创建了第一个通用应用程序。


  ## 调试


  Visual Studio 最伟大的功能之一是调试功能。所有这些功能已在安装在你的 Raspberry Pi 上的 Windows 10 IoT 上启用，无需额外配置。




  After you click on **部署** (the green start button), Visual Studio automatically
  goes into debug mode. In this mode, you cannot change any of the code; you can add
  or remove breakpoints, view output in the debug console, and use various other debug
  tools.


  Visual Studio will also automatically break on unexpected errors and take you to
  the code that caused this exception with details about the problem.


  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_139_0.png)


  > As a long-time C# developer, I can admit that these errors might not make a lot
  of sense sometimes. The best thing is to search the Web for part of the error message
  and see what other developers have done to correct the problem. Stack Overflow usually
  provides high-quality answers for many ambiguous error messages.


  ## 断点


  While the application is in the code edit mode, look at the source code of the button
  that we created earlier. You can add or remove breakpoints by clicking on the dark
  grey bar at the left, which will highlight the line of code in red:


  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_139_1.png)


  Click on **部署并运行**. Your breakpoint will be hit before you click on the button.
  To continue, click on the green Play button again, or *F10* for step over, or *F11*
  to step in (if it is a method you created or the source code is available)


  ## 未处理的异常


  To experience this feature, we will create a deliberate unhandled exception.

  It would be nice to demonstrate a Stack Overflow, but let''s stick with a basic
  arithmetic function:


  - 1. Under your breakpoint, add these lines of code, and do not add any breakpoint
  to them:

  - 2. Click on Deploy and run.

  - 3. Click on the button on the IoT device and your first breakpoint will become
  a hit.

  - 4. Press Continue to continue executing the code.

  - 5. Straight after continuing, you should get an unhandled exception message:


  ```

  int zero = 0;

  this.textBlock.Text = (0 / zero).ToString();

  ```


  ```

  DivideByZeroException was unhandled by user code

  ```


  This is a simple, self-explanatory exception. If you ever run into deeper water,
  you can use View Detail... under action to reveal some more debugging information.


  These types of exception cause the application to crash whether you are in the Debug
  or Release mode.


  If you suspect that an operation may result in an unhandled exception, for example,
  lots of arithmetic calculations, working with indexes, long running operations,
  or external calls, you can wrap this code in try block, which will prevent your
  application from crashing.


  Amend the divide by the zero code as follows:


  ```

  try

  {

  int zero = 0;

  this.textBlock.Text = (0 / zero).ToString();

  }

  catch (Exception ex)

  {

  this.textBlock.Text = ex.ToString();

  }

  ```


  You can use the method to display error messages to the user or log exceptions to
  a database.


  ## 示例


  There is a large sample code package available to download from the code area. These
  are official Microsoft Samples, and they demonstrate not only how to create more
  advanced applications but also how to use the GPIO and other features on the Raspberry
  Pi.


  ## Windows 10 IoT WebGUI


  You can access your Raspberry Pi via your browser. Simply enter the IP with port
  8080 and use the default username and password provided earlier in this chapter.


  As time goes on, this page will be updated to support more features and may even
  completely change in the future. For now, we have access to various common commands,
  such as Shutdown, reboot, processes, live performance graph, and so on.


  ## 设置启动应用


  The following are the steps to set up the startup app:


  - 1. You can click on **应用** on the left-hand side menu.

  - 2. From the installed apps, find your app and click on it.

  - 3. Once it is selected, click on **设为默认**.

  - 4. Your application will now start up after each boot:


  ![](img/a8753cacc9d454dfc09eda1ed5012bd3_141_0.png)


  - 5. Click on **重启** to test it.


  WebGUI will still be available while your application runs.


  ## 外设


  I tried to plug in various devices and see what happens with most of them not doing
  anything. Popular ones seem to work, such as a USB mouse and keyboard transceiver.


  Just remember that power is still an issue on USB, so it may be a good idea to use
  a powered hub.


  You can find more information on supported devices by visiting: http://ms-iot.github.io/content/en-US/win10/SupportedInterfaces.htm.


  ## 蓝牙


  Bluetooth is still a fairly new addition to Windows IoT as of writing this chapter.
  I tried a generic Bluetooth dongle (unbranded), and it was installed successfully.
  It found my TV and my Bluetooth keyboard while I was on WebGUI.


  I was successful in pairing my keyboard and navigating the screen.


  You may also succeed in pairing Bluetooth serial port transceivers as it seems to
  be supported on generic Bluetooth.


  ## 无线


  Wireless support has been rapidly extended since the release candidate, and it supports
  the official Raspberry Pi dongle and other popular chipsets used in many other brands.


  ## 总结


  Even though Windows has various other ARM and MCU systems, Windows IoT was developed
  from a blank canvas. With time, the support will continue to grow for new devices
  and other ways to develop applications.


  If you are interested in learning C# or are already a seasoned C# developer, this
  finally looks like the light at the end of the tunnel for an alternative embedded
  OS, other than the ever dominating *nix operating systems that were designed for
  these sorts of devices years ago.


  There are many advantages in using Visual Studio and the Universal App architecture,
  but as of writing this chapter, there is still a lot of work to do for Microsoft.

