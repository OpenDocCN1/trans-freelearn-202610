  \ 是 Packt 的在线数字图书库。在这里，你可以搜索、访问和阅读 Packt 的整个图书库。\n\n## Why subscribe?\n\n- 在 Packt\
  \ 出版的每本书中完全可搜索\n- 复制、粘贴、打印和书签内容\n- 按需访问，并通过网络浏览器访问\n\n## 前言\n\n本书的目的是帮助你入门 Raspberry\
  \ Pi，但本书的章节侧重于 Raspberry Pi 2。此处的核心目标是为你的项目提供一些坚实的硬件和编程技巧，这些都是必不可少的。\n\n## 本书涵盖内容\n\
  \n第 1 章《使用 Raspberry Pi 入门》将涵盖我们使用本书所需的基本设备。我们将研究已购买的其他外设，以了解 Raspberry 的工作原理。然后我们将了解如何将最新的\
  \ Raspbian 镜像刷写到 SD 卡上。\n\n第 2 章《准备网络》将说明如何设置 LAN 和无线连接以连接到我们的网络连接到互联网。我们将设置一些网络基准并了解其一些局限性。我们还将研究动态\
  \ DNS 主机。\n\n第 3 章《配置额外功能》将说明如何更新 Raspberry Pi 的软件和固件。你将学习有关看门狗的知识并了解如何购买额外的解码器许可证。\n\
  \n第 4 章《使用快速 Web 服务器和数据库》将说明如何使用 nginx 和 PHP 设置快速 Web 服务器，我们可以决定是否使用 MySQL 或 SQLite。\n\
  \n第 5 章《设置 Raspberry Pi 作为文件服务器》将说明如何连接和格式化 USB 存储介质。我们不仅会研究向 Raspberry Pi 发送数据的各种方式，还将了解如何在网络上共享媒体。作为额外任务，我们将研究创建硬件\
  \ RAID！\n\n第 6 章《设置游戏服务器》将探索存储库中可用的开源游戏引擎。我们还将对处于测试阶段的 Jessie 存储库进行一窥。\n\n第 7 章《流式传输实时高清视频》将探索摄像头模块并说明流式传输视频的简单技术。本章包含独家的流媒体教程。\n\
  \n第 8 章《将 Pi 设置为媒体中心服务器》将说明如何连接 HD 显示器并播放之前录制或存储的视频。我们还将研究 OSMC，并探索将其作为专用媒体播放器运行的好处。\n\
  \n第 9 章《使用电池电源运行 Pi》将解释各种电池技术的优点以及如何在不花费太多钱的情况下获得最佳性能。\n\n第 10 章《Windows IoT Core》现已在嵌入式\
  \ ARM 上可用，它将探索将 IoT 作为操作系统运行的能力，并附带使用 C# 的基础编程教程。\n\n第 11 章《运行自己的 ownCloud》将讨论如何在\
  \ Pi 上安装 ownCloud 软件，并让你摆脱私有服务。\n\n第 12 章《物联网 – 云端传感器》更多的是一个案例研究，说明如何通过存储可在云端任何地方访问的准确数据来完成你的项目。\n\
  \n## 你需要为本书准备的内容\n\n你至少需要一台 Raspberry Pi 2，推荐 8 GB SD 卡，1 安培 micro USB 电源，以及连接到具有互联网的路由器的网线。\n\
  \n## 本书适合谁\n\n寻求为一些新技术项目获取灵感？想要从你的 Raspberry Pi 中获得更多？本书就是专门为你创建的！\n\n## 约定\n\n\
