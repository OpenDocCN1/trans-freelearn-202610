reviews:
- 'no': 2
  overturn_probability: 0.78
  alternative: 正文小标题
  counter_evidence:
  - 标题后紧跟 **作者**/**审阅者**/**策划编辑** 等元数据字段列表，无章标题典型的后1~3行概述段落，上下文为出版信息而非内容统领
  - Credits、About the Author、About the Reviewers、eBooks 等均属于前言、致谢、关于作者等正文之前的内容块，按规则应统一划分为一章，Credits
    只是该前置块内的子节，不应单独作为分章点
  - 标题未编号、语义为出版归属信息，不具备统领后续正文的概括性，更接近前置块的内部小标题而非全书最高层级大章
  keep_split: false
