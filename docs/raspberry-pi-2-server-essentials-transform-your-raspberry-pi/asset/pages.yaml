- pgno: 74
  md: "# MVC and nginx\n\nYou may use MVC as it is with Kestrel without installing\
    \ nginx, but it is strongly recommended to use nginx as the frontend proxy, which\
    \ will allow you to manage various web applications in a mixed environment. Nginx\
    \ also provides you with more functionality, such as binding SSL certificates,\
    \ which Kestrel on its own doesn't support yet.\n\nWe can now add another location\
    \ block for the `dotnet` proxy:\n\n```\nlocation /dotnet {\n    proxy_pass http://127.0.0.1:5004;\n\
    }\n```\n\nYou can now navigate your browser to http://raspberrypi/dotnet and you\
    \ should see the same page as on port 5004.\n\nThe benefit of doing this is that\
    \ you have now configured nginx to do more advanced things with this virtual host.\n\
    \nFor security reasons, you should only allow ports forwarded to the ports defined\
    \ in your nginx virtual hosts and block the rest, for example, Kestrel's 5004.\
    \ This is to ensure that any vulnerabilities within Kestrel cannot be exploited,\
    \ while it's still developed as a development server. The only downside is that\
    \ services such as Netcraft will identify this website as nginx and not Microsoft's\
    \ Kestrel. But from a security point of view, this is good, since a potential\
    \ attacker will not know what is actually going on behind the powerful nginx proxy.\n\
    \n# Other .NET applications\n\nMono supports the full .NET 5 stack, which means\
    \ that you can now easily create console applications in Visual Studio and execute\
    \ them on Raspberry Pi. Simple copy your .exe file and run it using `MONO file.exe`.\n\
    \nYou can also create traditional Windows Forms and execute them within LXDE using\
    \ the same method of `MONO formsapp.exe`. Native styled forms should appear within\
    \ LXDE.\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_74_0.png)\n\n> With Windows\
    \ IoT installed as your operating system, you will be able to create Universal\
    \ Apps leveraging the Windows 10 API, creating full hardware rendered forms, and\
    \ gain access to OpenGL via DirectX graphics and a rich API for developing Internet\
    \ of Things applications for Raspberry Pi 2. The basics will be covered in Chapter\
    \ 10, Windows IoT Core."
  merge: -1
  img_proc: true
- pgno: 75
  md: "# Installing PHP\n\nAs mentioned before, nginx is a proxy that handles web\
    \ requests extremely quickly, and to get PHP to work with nginx, we need to install\
    \ an interface called **FastCGI**. This will allow nginx to send requests to PHP\
    \ and receive and display the response. To help improve PHP performance, we will\
    \ also install a PHP extension called APC, which stands for **Alternative PHP\
    \ Cache**. It is much faster and uses fewer resources than the standard PHP caching.\n\
    \nAfter installing, PHP should be running, but we will restart it to make sure\
    \ all the extensions were loaded correctly:\n\n```\nsudo apt-get install php5-fpm\
    \ php-apc\nsudo service php5-fpm restart\n```\n\nCreate a new directory under\
    \ `/var/www/` called `PHP` with a subdirectory `web`. In the `web` directory,\
    \ we will create a new file called `index.php` and add the following content:\n\
    \n```\n<?php\n    phpinfo();\n?>\n```\n\nThis time we will run it on a different\
    \ port, as PHP has different requirements. We will bind the new host to port 888.\
    \ We will create a new server block; you can place it in the existing configuration\
    \ file or create a new `sites-available/php` file if you wish:\n\n> Please avoid\
    \ using port 8080, as it will be used for real-time streaming later.\n> Note the\
    \ `fastcgi_pass` setting that will be used for any other PHP website.\n\n```\n\
    server {\n    listen 888;\n    root /var/www/php/web;\n    index index.php;\n\n\
    \    location ~ \\.php$ {\n        fastcgi_pass unix:/var/run/php5-fpm.sock;\n\
    \        fastcgi_index index.php;\n        include fastcgi_params;\n    }\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Restart nginx, and then with a browser on another computer, browse to http://raspberrypi:888.
