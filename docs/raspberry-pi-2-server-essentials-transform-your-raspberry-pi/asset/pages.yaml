- pgno: 148
  md: '# Permissions


    ownCloud will store all your files as normal files in a directory. It uses the
    database to index files to improve querying speeds. If, for whatever reason, your
    ownCloud stops functioning properly, you can still access all the files directly
    without any complicated recovery procedures.


    ownCloud runs under www-data. To fix file permission issues, the easiest solution
    is to add www-data to the pi group, and then create a subfolder with the www-data
    owner applied to it:


    ```

    sudo usermod -a -G pi www-data

    ```


    The following two commands require you to add your directory destination depending
    on how and where you have mounted your file system. We will create a new subdirectory
    and assign the ownership to www-data. We also need to create a temporary directory
    for uploaded files:


    ```

    sudo mkdir -p /mnt/{your mount point}/owncloud

    sudo chown -R www-data:www-data /mnt/{your mount point}/owncloud

    ```


    ```

    sudo mkdir -p /mnt/{your mount point}/owncloud/tmp

    sudo chown -R www-data:www-data /mnt/{your mount point}/owncloud/tmp

    ```


    # The first configuration


    By this point, everything has been preconfigured for the ownCloud application.
    The final step, which is only required once, is to run through a step-by-step
    configuration wizard using your browser:


    +   1. Open your browser and type in the IP address or DNS name of your Raspberry
    Pi.

    +   2. You will see a certificate error. Depending on the browser you use, you
    may add this certificate to trusted, or click on the button to continue:'
  merge: -1
  img_proc: true
- pgno: 149
  md: '![](img/a8753cacc9d454dfc09eda1ed5012bd3_149_0.png)


    +   3. If everything went as planned, you will see the initial configuration screen
    of ownCloud.

    +   4. Type in an Admin username and password (use a strong password as we should
    not be using this account often). This is the user that will be able to create
    new users, change configuration, and so on. After creating an admin, we will create
    a normal user that you should use from here on.

    +   5. The next input asks you about your data folder. This is where you input
    the directory that we created earlier and set the permission on.

    +   6. In the last step, we need to input the database settings with the username,
    password, and database that we created earlier. The user name is owncloud (not
    owncloud@localhost), followed by the password you entered, and the table name
    of owncloud. Leave the localhost as it is.

    +   7. Finally, we can click on Finish Setup. Then, ownCloud will configure the
    database and test for any issues that may need to be resolved.


    After several seconds, you will see the main dashboard presented with a welcome
    to the ownCloud page, offering several apps to be downloaded and ways to connect
    to ownCloud.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# The admin configuration


    If you have just logged in as the admin to the dashboard, it is highly recommended
    to create a user that you will be using for your daily cloud tasks:


    +   1. In the top-right corner, you will see your admin username and a drop-down
    menu. Click on it, and then click on **Users**.

    +   2. Before creating a user on this page, click on groups and click on + **Add
    Group** to create a new user group, for example, **users**.

    +   3. Now, you can simply type in your username and password; make sure the new
    group is ticked, and click on **Create**:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_150_0.png)


    By creating a new group, you can now better manage restrictions or options that
    you would like to use for anybody under this or other new groups later on.


    For example, on this page, you can set quotas for each group.


    # The server admin


    While still logged in as admin, click on the admin user name in the top-right
    corner, and then click on **Admin**. You will land on the sharing options page
    by default.


    On this page, you may notice a few security and set up warnings. If you see anything
    critical, you can endeavor to resolve the issues by reading the documentation
    online.


    As a standard, there is nothing critical that needs to be changed here, but reading
    through the available options, you may spot something you like or dislike and
    adjust it accordingly.


    The first option that allows you to tune for groups is **Restrict users to only
    share with users in their groups**.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'When an update is released, you will revisit this page to enable the update
    mode, and create configuration backups.


    You can jump to various sections of the page using the menu on the left.


    # Installing apps


    While logged in as admin via the WebGUI, you can click on the top-left link, which
    is next to the ownCloud icon. A drop-down menu will appear, and you will see a
    button to add apps:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_151_0.png)


    The free edition comes with basic file support and some nice extras. The Enterprise
    edition comes with official support for **Calendar**, contact management, and
    synchronization.


    On this page, you will see a list-enabled official apps, such as the picture or
    PDF viewers. There a few more apps that are disabled; to view them click on the
    **Not Enabled** menu item on the right-hand side.


    No need to worry about the lack of apps though, as ownCloud was designed to be
    extensible. There is a massive collection of user made apps that you can install
    for free from https://apps.owncloud.com.


    On the apps page, click on the cog icon in the bottom-left corner, and enable
    **Experimental Apps** to allow third-party apps to be installed.


    If you experience any problems with viewing or starting downloaded apps, you may
    need to set the **www-data** owner on the folders that you will be creating.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Calendar


    To enable calendar functionality on ownCloud, we will install a highly rated app
    called Calendar Plus:


    +   1. On the `https://apps.owncloud.com` site, search for this app and download
    it.

    +   2. Extract the zip file into a directory called calendar plus.

    +   3. To install the app, we need to upload the unzipped directory into the `/apps`
    directory located at `/var/www/owncloud/apps`. Use Filezilla to connect to your
    Raspberry Pi over SFTP, and upload the directory into the apps directory.

    +   4. In the WebGUI on the **Apps** page, click on **Not Enabled** and find **Calendar+**
    at the bottom of the page. Click on **Enable**:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_152_0.png)


    # Other apps


    The `https://apps.owncloud.com` website has an incredible collection of various
    apps available, and you can install all of them in the same way unless the author
    provides extra steps in the description of the app.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Daily functionality


    If you have checked out the configuration pages, you can log out as admin and
    log in as the user you have created for yourself using the Web GUI.


    For computers and devices running on your local network, you can install the client
    applications to your desktop or mobile computer and use your internal IP or Pi''s
    DNS.


    # The World Wide Access


    If you have decided to use ownCloud on WWW using a dynamic DNS service, the first
    thing is to check whether it is configured properly. An easy way to do this is
    to download the client application onto your smart phone or 3G-enabled tablet.


    Install the application, and then switch off Wi-Fi to get on to a mobile network,
    such as 3G. Not all routers support the loopback DNS lookup, which means that
    trying to access your IP from your IP may fail, but using an external network
    will verify that your ports have been forwarded properly.


    Start the application and enter your details on the login screen. The client application
    will do a quick connectivity test and inform you about the state.


    If you have logged in, you can try and turn your Wi-Fi back on and see if the
    client will carry on as normal.


    # Summary


    The Raspberry Pi 2 can now be your solution to going independent on cloud storage.
    As long as you have some redundancy setup on your storage media, you will be able
    to mostly disconnect from the big corporate giants and gain full control over
    your data again.


    In the next chapter, we will look at using some of the server-side applications,
    such as databases and nginx, to work with storing GPIO data to monitor the weather.'
  merge: -1
  img_proc: true
