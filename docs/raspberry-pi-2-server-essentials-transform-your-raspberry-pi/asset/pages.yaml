- pgno: 123
  md: '# 9


    # Running Your Pi from a Battery''s Power Source


    You would typically run your server from a mains powered USB adapter. The Raspberry
    Pi is very small, and unlike full desktop PCs, it can run from batteries for an
    extended period of time if the battery setup has been done properly.


    You may find the need to run the Raspberry Pi using batteries for remote controlled
    applications, for example, weather stations in remote areas, a remote controlled
    car, and similar situations.


    The most common problems with embedded device are related to power. You purchased
    a 2 A power supply, but one thing you cannot see is how much noise the power supply
    generates.


    This chapter will be short, but I will demonstrate how to create a long lasting,
    super clean, 99.8% noise-free power source. This is great for wireless communications
    that rely on clean and stable power sources.


    # Hardware requirements


    If you are really serious about running your Raspberry Pi from batteries, you
    will have to prepare a budget for some extra equipment. These requirements will
    not clear out your bank account, but I will also include more expensive solutions
    and their benefits. This chapter is based on the minimum required equipment, which
    I typically use.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'The minimum requirements are as follows:


    +   - A battery charging station

    +   - NiMH battery packs

    +   - A voltage regulator


    These are the minimum parts required to get a fairly decent and safe battery power
    source.


    The battery charging station and voltage regulator can be reused for years to
    come, and the only further expense will be new batteries or higher quality equipment
    parts.


    The remaining chapter will use these parts as my test rig, and the estimated price
    of each component is as follows:


    +   - Charger: IMAX B6 (35 EUR/40 USD)

    +   - Batteries: 2 x 1500 mAh 6.0V NiMH High power series (18 EUR/22 USD)

    +   - Voltage regulator: 3 A/5 A UBEC with capacitor (4 EUR/6 USD)


    # Charging stations


    This will be the most expensive part that you will need to acquire, but it is
    only a one-off expense. The charging station that I recommend is the well-known
    IMAX B6. It can charge a variety of batteries: Li-ion, LiPo, LiFe, NiCd, NiMH,
    as well as Pb. It has built-in safety features; it is very reliable and compact,
    pretty much the cheapest all-round charging solution to be found.


    One last advantage to this charger is that you can power it using any kind of
    power pack between 12V and 18V. A caveat is, though, the closer to 12V you go,
    the higher the amps you need on the power brick, but it also depends on the rate
    at which you are charging your batteries. If you decide to get fast charging batteries,
    use a higher voltage and amp power pack. Take a look at next image:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_124_0.png)


    > I strongly advise that you try source a genuine product if you would like to
    guarantee the longest life of your batteries. Using imitation products maybe safe
    enough, but try and reduce your top-charging limits or follow calibration instructions
    to prevent over-charging. Always charge batteries in a safe and well ventilated
    room away from flammable objects and out of reach of children.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/a8753cacc9d454dfc09eda1ed5012bd3_125_0.png)


    # Battery packs


    In my shortlist, I recommended NiMH (nickel-metal hydride) batteries because they
    are the safest batteries to use. These batteries do not become volatile when overcharged;
    in other words, you don''t have to worry about the violent explosions that may
    happen with other types of battery. Overcharging these batteries will cause permanent
    damage, and the batteries must be replaced if that ever happens.


    They have a fast self-discharge rate though, so they will not last long if fully
    charged and stored for later use. They are best used shortly after charging them.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'An important factor is that they are pretty cheap to purchase. With the recent
    nano cell NiMH technology, you can pay slightly more to benefit from even better
    power output and capacities than leading Li-Po batteries. Look at the following
    image:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_126_0.png)


    # Voltage regulator


    You maybe wondering why we don''t just use 5V batteries to power the Raspberry
    Pi and reduce the cost of extra batteries and voltage regulators.


    It all depends on the same principle as electricity in your home. The power station
    transports power in extremely high voltages exceeding tens of thousands of volts,
    but your computer only requires 12V to run.


    The answer to all of this is Ohm''s law. To understand this law in the simplest
    terms, you can imagine a seesaw with volts on one side and amps (the current)
    on the other side. Look at the following image:'
  merge: -1
  img_proc: true
- pgno: 127
  md: '![](img/a8753cacc9d454dfc09eda1ed5012bd3_127_0.png)


    The more volts you have, the fewer amps you need to use. The more amps you have,
    the fewer volts you need to provide. Ohm''s law is universal and easy to adjust,
    but you still have to remember about resistance, which always works against you
    on each side of the seesaw, and this is related to the thickness of the wire you
    are using.


    Using a 2 x 6V (12V) battery pack power supply to power a 5V system, we get a
    few benefits:


    +   - We can provide higher constant power (amps) for a consistent period of time

    +   - We can use the battery cells down to the very last volt; it will give us
    without losing power to the Raspberry Pi

    +   - It is much easier to provide peak power (bursts of high power demand), which
    is great if you want to use motors or transmit high power bursts of data, and
    it is more efficient to do so with higher voltages

    +   - Generally, this is the most stable configuration in this scenario for the
    Raspberry Pi'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Ohm''s Law


    The following diagram is a simplified version of Ohm''s law. It demonstrates all
    the calculations you need to work out a specific value, as discussed earlier.
    As a simple example, if you want to work out how many Amperes you need, you find
    the Amperes heading and pick a suitable equation. A suitable equation is one where
    you can fill in all the unknowns on the right-hand side. Apply the calculation
    and there is your answer:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_128_0.png)


    # Discharge curves


    When a battery cell starts to deplete, the voltage it provides drops a lot faster
    in the last 10% of its capacity. Looking at this graph, you can easily understand
    what this curve looks like at various discharge rates. If we used a 5V battery
    source, the Raspberry Pi would only run for about 60% of the batteries, power
    as it will soon drop below the 4.9V required for stable operation. But if we use
    higher voltage cells, we can utilize every last drop of voltage to keep the Raspberry
    Pi going:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_128_1.png)'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# Discharge characteristics


    As the voltages drop in each cell, the voltage regulator draws more power (amps)
    from the batteries to keep the output voltage stable. Remember the seesaw effect
    and Ohm''s law? The last bit of power gets used up very quickly but constantly
    provides stable output power for the Pi:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_129_0.png)


    # Putting it all together


    To find all the extra parts, such as connectors and wires, you should visit your
    nearest RC hobby shop. You can buy all the parts and crimp everything yourself,
    but there are also premade wires for this exact setup.


    I strongly recommend that you power your Raspberry Pi 2 via the USB connector.
    The Raspberry Pi Foundation has taken extra care to create a new power filtering
    system on the Raspberry Pi 2 to help stabilize the Raspberry Pi. Mostly because
    of all the strange USB power supplies out there, extra filtering and protection
    is always good.


    If you have any extra peripherals, it would be best to connect them directly to
    the voltage regulator output instead of powering it from the Pi''s GPIO or USB
    port. This will take unnecessary stress away from the Raspberry Pi, and the voltage
    regulator will easily handle higher loads.


    # How long will it last?


    Battery capacities are measured using mAh (milli Ampere hour):


    +   - By adding batteries in series, such as in this design, you do not gain more
    capacity but more voltage'
  merge: -1
  img_proc: true
- pgno: 130
  md: '+   - By adding batteries in parallel, you gain more capacity but stay at the
    same voltage.

    +   - Finding the best balance depends on your requirements


    To properly calculate how long your batteries will run can become a very complex
    calculation. You need to take a lot of things into consideration. In this design,
    using a higher voltage gives us more time because the voltage regulator needs
    to use less current (amps); a higher draw of charge reduces battery usability.


    In an ideal world, you could say that we will be able to supply 1,500 milliamps
    per hour. This is 1.5 amps for an entire hour. If you want to extend battery life,
    you can add a separate battery circuit, such as the one demonstrated in this chapter,
    in parallel to the existing one. So, this would give you 1.5 amps for 2 hours
    or 3 amps for an hour.


    In my own experience, I was able to stream an HD video over Wi-Fi to another computer
    on my network for nearly 3 hours.


    # Summary


    You learned that running on batteries can quickly become a complicated task if
    you do not understand Ohm''s law and some fundamental characteristics of batteries.


    Using this tested design, you should be able to scale your requirements a lot
    more easily now, but I encourage you to always do more research when changing
    certain aspects of this design.


    If in doubt, find a well-recommended RC hobby shop; the principles they use in
    this type of equipment is exactly the same here, and you will have all the parts
    and knowledge right there.


    In the next chapter, you will learn how to install Windows IoT and create a simple
    Universal Application in Visual Studio Community.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# 10

    Windows IoT Core


    Windows IoT Core''s main target is education and hobbyist users. It does have
    a GUI stack but is limited to Microsoft''s Universal App Platform (UAP), which
    is not a bad thing if you are interested in developing C# applications using XAML
    or HTML.


    You are not strictly limited to the previously mentioned technologies. Microsoft
    tries to support a few other programming languages, such as C++ and Python with
    UAP SDK, but also native Win32 applications or services with some limitations.


    The other benefit of developing universal apps is that you can install them on
    any device running Windows 10, even a full desktop. So, it is easy to distribute
    one code base to the Raspberry Pi 2, Intel Galileo, or MinnowBoard for embedded
    applications. Also, for remote managing console to your Windows 10 Phone, Tablet,
    Desktop, or Xbox.


    Windows IoT comes with a lot of criticism from the Linux community as to why Microsoft
    even bothered doing all of this. Essentially, the point is not to replace Linux
    or try to displace Linux users but help more people to get involved with embedded
    prototyping. As a .NET developer, you will appreciate that you can finally create
    apps within a smooth workflow for embedded devices using the IDE that you love.
    Visual Studio, with full debugging capabilities with the ability to embed your
    favorite NuGet packages on a device that will measure the temperature of your
    aquarium.


    > As of writing this chapter, appreciate that IoT has only been released; there
    are many issues that are still to be resolved and many more features to be added,
    so it will only get better from here on.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_131_0.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Getting started


    To fully benefit from this chapter, you will need a Windows 7 or better desktop
    machine. Windows 10 is recommended but not essential.


    To create universal applications for Windows, IoT will need to install Visual
    Studio 2015. You can install a completely free version called Community edition.
    Only 2015 supports universal apps. You can also create other types of projects
    in the Community edition completely free.


    To get started with developing universal apps, you must have Visual Studio 2015.
    You can download the Community edition for free, but you need to create a live
    account and log into the account in the Visual Studio community to keep your free
    subscription active.


    # Flashing IoT


    It is recommended to use Windows 10 desktop to download and burn the IoT image
    to an SD card. To get your image, you need to open https://dev.windows.com/en-us/iot
    and click on Get started now. You can then click on the Rasperry Pi 2 and follow
    the steps there.


    The SD card image is distributed in an FFU format supported only on Windows 10.
    To be able to burn it on an older version of Windows, we need to convert the image
    into a raw image file.


    # Python for Linux or Windows 7 and 8


    Windows 10 has a new version of the DISM binary, which is used to burn the FFU
    image file types onto SD cards. In previous version of Windows, we will need to
    use Python. Python is also used on Linux-based machines.


    If you have python installed on your Windows or Linux machine, you can use a script
    created by somebody that goes by the nick name of t0x0, and it can be downloaded
    from the following location. This script works both on Python for Windows and
    Python for Linux: https://raw.githubusercontent.com/t0x0/random/master/ffu2img.py


    At this point, you will need to install Python 2.7 or a newer version for Windows,
    and you can get the latest installation files from https://www.python.org/downloads.


    Copy the FFU2IMG Python script into the directory where you extracted the Windows
    IoT image. Open a command window, navigate to the directory, and use the following
    command to convert the image:


    ```

    python ffu2img.py Flash.ffu

    ```'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Then, you can flash the image onto an 8 GB minimum SD card from your Linux
    machine:


    ```

    sudo dd bs=1m if=Flash.img of=/dev/<you_SD_card>

    ```


    Or you can use Win32 DiskImager to burn the image from Windows, as described in
    Chapter 1, Getting Started with the Raspberry Pi for Rasbpian.


    # The first boot


    Insert your SD card, plug in a wired internet connection and an HDMI display,
    and turn on the power. The first boot will take a few minutes with some screen
    flashing and strange looking graphics or text. It will automatically reboot, and
    you will see a screen with a language selection. If you don''t have a keyboard
    hooked up, the default (English) will get connected automatically; and then, you
    will see a screen similar to this one:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_133_0.png)


    On this screen, you will see the IP address assigned to the Raspberry Pi. You
    can type the IP with the port 8080 address into your browser, and you will be
    presented with a web GUI.


    The default username is administrator and the password is p@ssw0rd.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Remote connections


    You can connect to Windows IoT by either using PowerShell in Windows or SSH connections,
    which will present you with a PowerShell command line running on Windows IoT.


    The easiest way is to connect using SSH with Putty or similar as you would normally
    connect to any Linux-based machine.


    To connect from Windows using PowerShell, perform the following:


    +   1. Click on the **Start** menu and start typing `powershell`.

    +   2. Right-click on **Powershell** and click on **Run As Administrator**.

    +   3. Then, we need to type in a few commands in order to connect to IoT for
    the first time:


    ```

    net start WinRM

    Set-Item WSMan:\localhost\Client\TrustedHosts -Value <IP Address>

    ```


    After this, you will be able to connect from Windows PowerShell to IoT PowerShell
    using the following command:


    ```

    Enter-PSSession -ComputerName <IP> -Credential localhost\Administrator

    ```


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_134_0.png)


    > The connection process may take up to 30 seconds.

    > When a connection is established, you will see the IP Address of your device
    before the prompt.


    # Visual Studio (VS)


    In this section, we will go through how to prepare Visual Studio 2015 for IoT,
    and we will also take a look at the Hello World application to get familiar with
    the IDE.


    # Installing Visual Studio 2015


    Use your favorite browser to search for **Visual Studio 2015 Community edition**,
    which is completely free to use without any time limits; download and install
    it.


    After installing VS start it up once and log in, if required, to the Live account
    you used to download VS. Once it all seems loaded up we will need to shut it down
    to install the IoT templates required to develop for the Raspberry Pi (or other
    embedded devices running Win 10 IoT)'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Once again, use your favorite search engine and search for **Windows IoT Core
    Project Templates**. You should use the official Microsoft `http://www.visualstudiogallery.msdn.microsoft.com/`
    link. There may be important messages there, so read those. Click on the **Download**
    button and run the executable. This will install additional **Universal Windows
    Platform (UWP)** templates that will not only enable you to write background applications
    on unheaded Pis for Visual Studio but also specific libraries that we will be
    using in universal apps.


    Start Visual Studio up again, and find the new template under C#. Verify that
    the template has installed correctly:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_135_0.png)


    # The Hello World application


    This application will require you to have a monitor connected as we are first
    going to create a Windows Universal Application. It also shows you how to prepare
    your solution so that it can be used on the Raspberry Pi:


    +   1. We will create a new project using this template; navigate to **Templates**
    | **Visual C#** | **Windows** | **Universal** | **Blank App** (Universal).

    +   2. Give it the name of `HelloWorld` and click on **OK**.

    +   3. You may be prompted to **Enable Developer Mode** if you are using Windows
    10; navigate to **Settings** | **Update And Security** | **For Developers**.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '+   4. The final step will be to add a reference to the IoT extensions required
    for the Raspberry Pi specific features, such as GPIO.

    +   5. Right-click on **References** | **Add Reference** | **Universal Windows**
    | **Extensions** and check **Windows IoT Extensions for the UWP**.


    Windows is designed using the XAML mark up. If you have ever worked with Silverlight,
