- pgno: 155
  md: '# 12

    The Internet of Things – Sensors in the Cloud


    Now that you have learned the essentials of running software applications on your
    Raspberry Pi 2, it is time to apply your newly acquired knowledge. This chapter
    will be about Operating System and agnostic language programming.


    Your mission, if you wish to accept it, is to find your favorite flavor of Operating
    System and programming language while I help you build a foundation on the electrical
    prototyping.


    In this chapter, we will focus on the following topics:


    +   - Understanding power requirements and selecting correct cables

    +   - Working with transistors

    +   - Getting to know Integrated Circuits (IC) and their purpose

    +   - Windows IoT, events, and real-time systems

    +   - Working with the Cloud for the IoT integration


    These topics will expand your basic electronics knowledge and show your good prototyping
    practices that can be used on any embedded platform, such as your Raspberry Pi
    2.


    Ultimate decisions on the software completely depend on your own personal preferences.
    By doing this, you will gain confidence in problem solving and appreciate the
    vast amount of tools and resources available on the Internet.'
  merge: -1
  img_proc: true
- pgno: 156
  md: "![](img/a8753cacc9d454dfc09eda1ed5012bd3_156_0.png)\n\nIf you ever get stuck\
    \ on a software problem, the best solution is to take a 90-minute break away from\
    \ your computer, or go to bed and come back to it the next day. If it seems like\
    \ you are stuck on a particular software problem for days, consider asking your\
    \ question differently. Do not get hung up on one particular way, as your problem\
    \ has, most probably, already been solved, and there is already a great solution\
    \ to it out there.\n\n# What is IoT?\n\nThe Internet of Things are *things* with\
    \ sensors that are embedded with electronics and software. The things are connected\
    \ to a network, most likely the Internet.\n\nThe Internet of Things started with\
    \ machine-to-machine devices, such as alarm systems or GPS trackers, and slowly\
    \ expanded to home convenience gadgets, such as power grid monitoring tools or\
    \ some form of home automation.\n\n> \"Experts estimate that the IoT will consist\
    \ of almost 50 billion objects by 2020.\"\n> \n> – Wikipedia\n\nTo build a successful\
    \ IoT device, you will need to learn about software, the essentials of which are\
    \ covered in this book. You also need to learn about electronics, which will also\
    \ be covered in this chapter.\n\n# Ohm's law\n\nOhm's law is a fundamental concept\
    \ to try and understand before you venture into the prototyping world. One of\
    \ the main reasons Ohm's law is so widely misunderstood is because it has various\
    \ equations that originate from a single, mathematical equation.\n\nYou can find\
    \ more information about this diagram and Ohm's law in *Chapter 9, Running Your\
    \ Pi from a Battery's Power Source*. I have included this diagram here for quick\
    \ reference as I will demonstrate how to use some of the provided equations:"
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/a8753cacc9d454dfc09eda1ed5012bd3_157_0.png)


    # How much power?


    In Ohm''s law, power (W) is know as watts. Understanding how to calculate watts
    is pretty much the most important question that you should be able to answer easily.


    For example, what size cable do I need?


    +   - Cables are rated at how many amps they can carry. If you know how many amps
    you require, then you know which cable to use.


    > If you select an incorrect cable size, this usually results in electrical fires,
    as friction will heat these cables up until they melt and eventually ignite.


    To work out how many watts (W) a device uses, you will typically multiply volts
    (E) by amps (I).


    > Watts = Volts x Amps (W = EI)


    +   - 5 volts x 1 amp = 5 watts (such as the Raspberry Pi)

    +   - If you have a device that requires 60 watts and is rated for 240 volts,
    then you can work out these amps by dividing watts by volts.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '> Amps = Watts / Volts (I = W/E)


    +   - 60 watts / 240 volts = 0.25 amps (this is a light bulb)

    +   - Once you know how many amps you need to transfer, you can use an American
    Wire Gauge (AWG) table to check the size of cable that you will require over the
    distance needed:


    American Wire Guage (AWG)

    | Length (feet) | Length (meters) | 5 | 10 | 15 | 20 | 25 | 30 | 40 | 50 | 60
    | 70 |

    |---|---|---|---|---|---|---|---|---|---|---|---|

    | 3 | 1 | 18 | 18 | 18 | 18 | 16 | 16 | 16 | 12 | 12 | 12 |

    | 15 | 4 | 16 | 12 | 10 | 10 | 8 | 8 | 6 | 6 | 4 | 4 |

    | 20 | 6 | 14 | 12 | 10 | 8 | 8 | 6 | 6 | 4 | 4 | 4 |

    | 25 | 7 | 14 | 10 | 8 | 8 | 6 | 6 | 4 | 4 | 2 | 2 |

    | 30 | 9 | 12 | 10 | 8 | 6 | 6 | 4 | 4 | 2 | 2 | 2 |

    | 40 | 12 | 12 | 8 | 6 | 6 | 4 | 4 | 2 | 2 | 1 | 1/0 |

    | 50 | 15 | 10 | 8 | 6 | 4 | 4 | 2 | 2 | 1 | 1/0 | 1/0 |

    | 60 | 18 | 10 | 6 | 6 | 4 | 2 | 2 | 1 | 1/0 | 2/0 | 2/0 |

    | 70 | 21 | 10 | 6 | 4 | 2 | 2 | 2 | 1/0 | 2/0 | 2/0 | 3/0 |

    | 80 | 24 | 8 | 6 | 4 | 2 | 2 | 1 | 1/0 | 2/0 | 3/0 | 3/0 |

    | 90 | 27 | 8 | 4 | 4 | 2 | 1 | 1/0 | 2/0 | 3/0 | 3/0 | 4/0 |


    > It is always recommended to go a size lower (thicker cable) if you are close
    to the limit of the cable. This is generally within 10% of the capacity.


    Here is an illustration of the how the AWG size works and a conversion to metric
    millimeters for radius and millimeters squared for the area:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_158_0.png)'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Higher voltage is your friend over longer distances. Generally, the higher
    the voltage, the thinner the cable you need to use to supply the same amount of
    amps, reducing the cost of the cable.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_159_0.png)


    > In most cases, the highest voltage that we can use is what is supplied to our
    home grid 110v/220v, and this will still be the most efficient way to transport
    power for distances up to 300 feet (100 meters).


    You will find this useful in many projects that you are ready to put into *production*
    away from your prototyping bench. For example, to power remote devices, such as
    a weather station that controls an irrigation system 120 meters away from the
    nearest socket, but it may as well be something in your loft, connected within
    one box:


    +   - Raspberry Pi 2: 5 volts 1 amp

    +   - USB GPRS Modem: 5 volts 0.8 amp

    +   - Medium water pump: 24 volts 2.5 amp

    +   - 6 x Solenoids: 9 volts 1 amp

    +   - Relay board: 12 volts 0.5 amp


    You will learn how to apply Ohm''s law and use IC to deal with this problem efficiently
    later in this chapter.


    # Choosing sensors


    The answer to this question depends on what you want to build. Sensors come as
    a variety of packages, operated by various voltages, and interfaced with some
    kind of communication standard.


    # Resistors, fuses, and diodes


    These are typically the easiest elements of electrical design to understand. If
    you are planning to create a device, you should find a basic electronics course
    to gain good understanding of these basics before continuing.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Transistors


    Everybody that uses a computer will have probably heard of a transistor. What
    is a transistor really? It is a semiconductor device that can be used to amplify
    or switch electronic signals and electrical power. A semiconductor is a solid
    substance that can conduct electricity when a certain condition has been met;
    otherwise they act as an insulator.


    Their packages are easily identified as they usually consist of three wires (legs).
    These legs are named Base (b), Collector (c), and Emitter (e):


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_160_0.png)


    The preceding illustration shows various packages that a transistor can be found
    in. The ones that look like they have two legs, actually have their base on the
    other side.


    The illustration also shows two different types of transistors: NPN and PNP. They
    essentially do the same thing, but NPN transistors are used to switch higher voltages
    and PNP lower voltage than what''s used in your main circuit. Also, PNP transistors
    are turned on when pulling the base low while NPN is turned on when you provide
    a voltage to the base.'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'Usually, in prototyping, we are mostly interested in switching higher voltages,
    and from here on, we will be working with NPN transistors.


    It may sound confusing at first, but just think of a transistor as a plain old
    switch. When you apply the correct amount of current to an NPN transistor''s base,
    it is like your finger pushing a button. Once you get to the correct pressure,
    the switch will turn on, and the current will flow through the collector to the
    emitter. The amount of power (A) used to trigger a transistor is typically very
    low and sage for the GPIO''s on the Raspberry Pi.


    Looking at the sample circuit (bottom right) in the illustration, you can see
    a 9v power source connected to a resistor, LED, and then to the collector of the
    transistor. The emitter is connected to GND. This is pretty much how you will
    wire a switch. In the digital world, to turn on this switch, we need an extra
    input—base. For example, we will use GPIO PIN 4. This can be an output from any
    kind of embedded device with a 3.3v, 5.0v, or a higher voltage. The maximum voltage
    depends on the resistor''s technical specification.


    The 10k resistor can be of any value between 1K and 20K, and it should always
    be connected before the base of the transistor. The resistor is there to limit
    the maximum current that flows through the base of the transistor, preventing
    damage to the transistor.


    Once the I/O is set high in software, the switch will close and the LED will illuminate.


    > You just learned the basics of transistors. As you build more designs, you will
    find new circuits that require a combination of transistors to achieve a specific
    goal.


    Using transistors in such a way makes switching other voltages much easier from
    an embedded platform, using a low amount of current.


    You should always try and find the transistor marking, and you should search for
    its datasheet to understand the minimum and maximum values it can handle. The
    datasheet will also provide the minimum current required on the base to turn it
    on.


    Transistors are typically used in low-voltage designs. To turn on high voltage,
    such as 220 volts, you should almost always use a relay. Yes, you can use the
    transistor to turn the relay on.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Integrated Circuit Packages


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_162_0.png)


    These are a variety of other IC packages that you will find. You should be able
    to use any of these with nothing more than a soldering iron or breadboard.


    > Other packages such as QFN require specialist equipment to be prototyped with.
    An example of such a package is BCM2836, and it can be found on your Raspberry
    Pi 2.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Putting it all together


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_163_0.png)


    This circuit demonstrates switching a high-voltage 48 volt DC motor.


    > Be very careful when working with high voltages. Incorrect wiring will cause
    irreparable damage. Switching mains voltages may be lethal, and please do not
    attempt this if you are in doubt.


    # Accurate data using Arduino


    The Raspberry Pi typically runs on event-driven Operating Systems. This mean that
    a queue of events gets processed by the processor as fast as the processor can
    handle it. Unfortunately, even if your processor is idle, there is still an overhead
    in the event system that causes significant problems with real-time sensors or
    applications.


    There are real-time Operating Systems for the Raspberry Pi, but this will severely
    limit the capabilities that you have learned to use and love. Real-time Operating
    systems guarantee that an action, such as some code, will be completed in the
    predefined time. A very popular Operating System for these types of simple yet
    extremely accurate tasks is the Arduino family IC. They are amongst the best for
    doing millions of tasks over and in a very precise time.


    We will look at some examples of how an Arduino IC will help you gather data by
    showing a use case of building a weather station.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Building a weather station


    A great project to work on is building a weather station. The Raspberry Pi 2 has
    so much processing power to offer:


    +   - It can store a large amount of data in a database with ease

    +   - It can be its own web server running with a variety of programming languages

    +   - It can crunch numbers, create statistics, and eventually become nice graphs

    +   - It can even stream live videos using WebRTC or RTSP


    # Real-time embedded devices


    Atmel AVR (used on Arduino) and PICAXE are very well-known microcontrollers that
    run code with real-time precision. The advantage of these microcontrollers is
    that you can program them with simple code once, upload the code, disconnect them
    from the development board, and use them like a standalone IC.


    Your initial cost for a development board maybe about the same as a Raspberry
    Pi on its own, but after this, getting the programmable Microcontroller Unit (MCU)
    will cost a few dollars, and will be even cheaper for tiny versions.


    There are expansion boards available for some of these embedded devices, mostly
    for Arduino.


    # The data communication


    Real-time devices also offer very precise or faster data communication between
    various other devices by not only offering hardware interfaces but also software
    bit banging.


    > Bit banging is a technique for any kind of serial communication using software
    instead of some dedicated hardware.


    # Real-time events


    The essential benefit of an MCUs is that you would require it when building a
    weather station is required when counting time sensitive actions, such as wind
    speed, which must be calculated every second without any delay.


    You write a small function of code that executes when a selected pin is triggered.
    This is known as an interrupt. This code is as simple as incrementing a counter.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'The main program is an endless loop of code or an internal-timed interrupt.
    Not all MCUs offer internal-timed interrupts, but what is critical is that it
    always runs at a selected time, for example, every 60 seconds. On an MCU, this
    is guaranteed to run every 60 seconds to the microsecond. This is crucial to make
    sure that you can run an algorithmic function, which uses your wind counter to
    save the wind speed. On an event driven OS, you may get highly inaccurate readings
    caused by delayed processor queues or the optimized execution.


    # Analog inputs


    The Raspberry Pi lacks analog inputs. MCUs usually have more analog inputs than
    digital ones. On tiny versions, they may even completely lack digital inputs.


    Analog inputs will be very useful to read the direction of the wind, as wind vanes
    usually output a calculated subvoltage from the input voltage to inform you of
    the direction. Something like a potentiometer, but more simply, it is like various
    resistors connected to a reed switch, which will activate a given circuit.


    There are still a lot of other applications that can be useful for analog inputs.


    # Parts required


    The most affordable and pretty complete package is offered by Sparkfun—a wind
    vane, anemometer, and rain counter, with cables and a complete installation mount.
    Adding extras to this, such as instruments to measure UV light, atmospheric pressure,
    and temperature, is a breeze.


    You will also need a Raspberry Pi and a programmed Arduino MCU or similar.


    # Storing data on the Cloud


    At some point of any project, you will, most certainly, want to store collected
    data somewhere. Usually, this is from collecting sensors, but it could also be
    debugging data.


    The Cloud is a network of servers that can provision virtual machines for any
    use. Usually, you start from one server, but you always have the ability to increase
    the size or bundle several virtual machines to act as one endpoint. All this is
    usually handled by a nice frontend, such as Azure, Amazon AWS, or the Google Cloud
    platform.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Phant


    Phant is a logging tool developed by Sparkfun Electronics and is ready to be used
    free of charge at https://data.sparkfun.com; it stores data in JSON format. JSON
    is easy to read and compress, but most importantly, it''s dynamic; dynamic meaning
    that you don''t build relationships between each data packet, as in traditional
    SQL servers. This means that each data packet can contain any variety of structures
    that you save to Phant.


    You can find yourself a very cheap Linux-based virtual machine and install your
    own Phant platform to take full control of your cloud data. This is an extremely
    easy way to allow you access to shared data anywhere in the world, as long as
    you have an Internet connection.


    # Summary


    In this chapter, you learned the basics of electrical engineering and the external
    system''s integration. The possibilities are endless and only confined to your
    own imagination. In case you ever seem to get stuck, it is worth visiting some
    of these great sites for more information.


    For Stack Exchange, use the following:


    +   - Electrical Engineering: http://electronics.stackexchange.com/

    +   - Raspberry Pi: http://raspberrypi.stackexchange.com/

    +   - Stack Overflow (Programming): http://stackoverflow.com/

    +   - Ask Ubuntu (Linux related): http://askubuntu.com/


    For other sites, use the following:


    +   - Arduino Forums: https://forum.arduino.cc/

    +   - PICAXE Forums: http://www.picaxeforum.co.uk/

    +   - Searching the internet


    Thank you for your interest in this book, and I wish you happy prototyping!'
  merge: -1
  img_proc: true
