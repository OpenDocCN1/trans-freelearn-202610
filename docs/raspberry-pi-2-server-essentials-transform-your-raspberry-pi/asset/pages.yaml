- pgno: 4
  md: '# About the Author


    **Piotr J Kula** started his passion for computer technologies when he took apart
    his father''s IBM PC/XT machine at the age of 6. It became clear that Piotr had
    a natural ability with technology after he reconstructed the machine, and it booted.


    After 25 years, Piotr has worked for various companies in different countries.
    He has always solved complex problems or engaged in new experiences. As long as
    it had a processor of some sort, Piotr was always the first to try, fix, or configure
    it.


    Today, Piotr is the CEO of his own company, Kula Solution Ltd., in the United
    Kingdom. Piotr is certified in several Microsoft technologies, and he specializes
    in Microsoft and Linux technologies.


    Piotr''s dream is for a unified experience between Linux and Microsoft. He has
    never been deterred by negativity from either side, and instead, he has strived
    to find a way to build a bridge between these distant giants. After discovering
    Raspberry Pi, he completely replaced every other embedded device that he owned
    and was successful at releasing *Raspberry Pi Server Essentials*, with *Packt
    Publishing*.


    Today, Piotr is one step closer to fulfilling his dream with the release of *Raspberry
    Pi 2 Server Essentials*. This book is mostly about Linux, but it also talks about
    integrating and running Windows on your beloved Raspberry Pi.


    I would like to thank Katarzyna Kula, my amazing wife who helps me decide when
    enough work, is enough! For always supporting me through all my projects and countless
    hours spent on my computers. I would also like to thank the entire Raspberry Pi
    community, especially the members on Stack Exchange, everybody at *Packt Publishing*,
    and those who helped me in various ways to complete this book.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# About the Reviewers


    **Ian McAlpine**''s first introduction to computers was his school''s Research
    Machines RML-380Z and his Physics teacher''s Compukit UK101. This was followed
    by a Sinclair ZX81 and then a BBC Micro Model A, which he still has. This interest
    resulted in a MEng in Electronic Systems Engineering from Aston University and
    an MSc in Information Technology from the University of Liverpool. Ian is currently
    a product expert in the BI & Analytics Competency Centre, at SAP Labs, in Vancouver,
    Canada.


    The introduction of Raspberry Pi not only rekindled his desire to *tinker* but
    also provided an opportunity to give back to the community. Consequently, Ian
    was a very active volunteer working on The MagPi, a monthly magazine for Raspberry
    Pi, which you can read online or download for free from `https://www.raspberrypi.org/magpi`.
    He also holds an amateur radio license (callsign VE7FTO) and is a communications
    volunteer for his local community Emergency Management Office. He was a technical
    reviewer for the *Raspberry Pi Cookbook for Python Programmers* and *Raspberry
    Pi Projects for Kids* books, both published by *Packt Publishing*.


    I would like to thank my darling wife, Louise, and my awesome kids Emily and Molly
    for allowing me to disappear into my "office"... and for training our dog to fetch
    me!'
  merge: -1
  img_proc: true
