  md: '```

    sudo mount -t ext4 -v /dev/sda1 /nas/USB001/

    cd USB001

    sudo mkdir public

    sudo mkdir work

    ```


    # Remounting a disk after reboot


    The quickest way to get your drives remounted after a reboot is to add a few lines
    to the fstab file, which controls the file system configuration and can be found
    at /etc/fstab.


    Simply add the following lines. The first part is the partition, and the latter
    part is the mount point. You need to adjust these into your hardware. The final
    options are used for automounting. Do not change these options:


    ```

    /dev/sda1 /media/USB001 auto noatime 0 0

    ```


    # Accessing files


    We will go over several ways of allowing access to files on the Raspberry Pi,
    the network, and the Internet. You should choose the method that suits you best,
    as enabling more than one way makes it easier to compromise your system over the
    network.


    # The FTP service


    The File Transfer Protocol specification was originally published in 1971, but
    we currently use a specification from 1985 that everybody should really start
    moving away from. FTP uses port 21.


    A much newer specification, known as Secure FTP (SFTP), supports the IPv6 and
    Secure Socket Layer (SSL) encryption. Installing FTP will just be a waste of time
    as OpenSSL (SSH) comes with built-in support and is enabled by default to use
    SFTP. SFTP generally uses port 22, which is the same port as SSH.


    You should create and use a separate user for the SFTP access. I will demonstrate
    how to connect to your Raspberry Pi with two popular clients using the root account
    for simplicity.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Connecting with FileZilla


    FileZilla is open source and can be run on Windows, Mac OS X, or Linux. Download
    and install it on your computer. We connect to the Raspberry Pi using the following
    steps:


    +   1. In the Host field, enter the IP address or the DNS name of your Pi;

    +   2. In the Username field, enter the name of the user on the Pi. For example,
    root.

    +   3. In the Password field, enter the password of this user.

    +   4. In the Port field, enter the name of the port as 22. This tells FileZilla
    that you want to connect using SFTP.


    The following screenshot will show how FileZilla is connected to our Pi:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_86_0.png)


    # Connecting with WinSCP


    WinSCP is the client preferred by all Windows users who need to connect to any
    Linux box running the SSH or SFTP server.


    WinSCP also offers Secure Copy Protocol (SCP), which is not specified by any standard.
    It uses Secure Shell for data transfers and the same authentication method.


    Go to http://winscp.net/ and find the [Go to Download page] link from where you
    will get the installer or portable binary.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Just like with FileZilla, you will enter the hostname, username, and password.
    You can use SFTP or SCP as shown in the following screenshot:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_87_0.png)


    # The Samba service


    Samba is an implementation of the SMB/CIFS networking protocol, which is mostly
    used on computers running Microsoft Windows. It is basically a way of allowing
    a Windows computer to connect to Linux systems and access their shared files or
    printers. It is not created by Windows and was originally developed by Andrew
    Tridgell.


    If you want to share media from Linux with other Windows computers on your network,
    Samba is the best software option.


    # Installing and configuring Samba


    You need to install Samba and a common library that is used by Samba using the
    following command line:


    ```

    sudo apt-get install samba samba-common-bin

    ```'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'You can then navigate to `/etc/samba` and edit the `smb.conf` file. On a private
    network for personal use, you may skip any step that requires the use of passwords
    to mount network shares. In an exposed or production environment, always use authentication.


    If you do not like to put security on internal network shares, then this is perfectly
    safe. Since these files cannot be accessed from the Internet, you may just want
    to browse your network freely and copy or move files around without the extra
    pain of entering passwords.


    By default, Samba is set for anonymous (unauthenticated) access. To change this,
    scroll down and uncomment the `security = user` line by removing the preceding
    `#`. This will tell Samba to authenticate against the users that you have created.


    We will quickly create a user for the purpose of demonstration as there is an
    extra step required to add the user to the Samba authentication list. The following
    command-line snippet is an example of creating a system user to access Samba:


    ```

    ```bash

    sudo useradd bond007 -m -G users

    sudo passwd bond007

    sudo smbpasswd -a bond007

    ```

    ```


    # Network shares


    At the bottom of the `smb.conf` file, we will add two shares, as shown in the
    following command-line snippet. One account is for guests without authentication,
    whereas the other account will only be accessible by our new user—James Bond:


    ```

    ```ini

    [public] comment = Media share

    path = /nas/USB001/public

    force user = "root"

    read only = no

    guest ok = yes

    public = yes


    [work]

    comment = Work share

    path = /nas/USB001/work

    valid users = "bond007" #or @users to allow the group users access

    force group = users

    read only = no

    writeable = yes

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Samba can be quite difficult to understand in terms of permissions. Let''s
    start off with the public share. You will notice that we put a line in smb.conf
    that says force user = "root". We do this because we created the public directory
    as root user, so the permissions applied to the directory and all the files to
    be created later can only be for the user root! So, we tell Samba to imitate guests,
    as root, so that they can read/write as the root user.


    The same will apply for the user James Bond and his directory. If you have created
    the work directory as the root user or Raspberry Pi, even James Bond will not
    be allowed to write new files. To overcome this problem, you can simply change
    the owner of the folder by typing the following command line:


    ```

    chown bond007:users /mnt/USB001/work

    ```


    You can also assign a directory to an entire group by replacing bond007 with users.
    The command will look like chown users:users. This means that anybody in the group
    can write and delete files on this folder now.


    The configuration file has many advanced features, and I recommend reading the
    online manual to learn more about security, sharing printers, and even how to
    get Samba to act like a Windows domain server!


    You can now use any Windows computer to browse the network and access the newly
    created shares.


    # AFP for Macintosh


    Samba also works with Macintosh, but Apple has its own networking protocol called
    Apple Filing Protocol (AFP). There is software that you can install on the Raspberry
    Pi so that your Macintosh computers can detect the Raspberry Pi.


    # Installing and configuring Netatalk


    Installing Netatalk has become really easy as most of the configuration is set
    up by default. At the time of writing this book, the version used was 2.3.3:


    ```

    sudo apt-get install netatalk

    ```


    Within 30 seconds, you will see your Raspberry Pi pop up in the shared section
    on your Macintosh. The default directory that is shared is the home directory
    of the user that you log in as, for example, user Pi.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Shares and Time Machine


    We will create a few entries to use your external drive for the shares that you
    need, and this version of Netatalk also supports Time Machine.


    You will need to edit this file to customize some of the settings as follows:


    ```

    /etc/netatalk/AppleVolumes.default

    #Ammend default to look like this

    :DEFAULT: options:upriv,usedots,rw,tm

    #Add this to end of the file

    /nas/USB001/public "Public"

    /nas/USB001/work "James Bond"

    ```


    Read the configuration file for more options and adjusting security. After saving,
    you must restart Netatalk using the following command:


    ```

    service netatalk restart

    ```


    # BitTorrent Sync


    All the bad things that you may have heard about torrents were primarily caused
    by private companies who were deliberately placing infected files to try and track
    users sharing copyrighted material or malicious users who were after your personal
    details.


    Sync is not a public network; it only uses the revolutionary peer-to-peer technology
    from conventional torrents, which allows you to share an unlimited amount of data
    with an unlimited number of computers. Files are not stored on the cloud. They
    are stored on all the computers that have BTSync installed on them, and you can
    control who has access and where these files will be stored. BTSync includes file
    versioning, sharing with mobile phones, LAN synchronizing, and delta updates.
    It also allows massive file transfers of gigabytes without any problem as long
    as your file system can support such large files.


    # Installing BTSync 2


    At the time of writing this book, there were a few repositories that kept this
    package with startup scripts. A word of warning: do not trust sources other than
    the ones that are enabled by default. People can easily alter code and place their
    own version of the binary with some nasty backdoors. Go to the official website,
    or use the links provided by the official website.'
  merge: -1
  img_proc: true
- pgno: 91
  md: "We will create a new directory, download the ARM version of BTSync, and extract\
    \ it as shown in the following command-line snippet:\n\n```\nmkdir ~/.btsync &&\
    \ cd ~/.btsync\nwget http://download-cdn.getsyncapp.com/stable/linux-arm/BitTorrent-Sync_arm.tar.gz\
    \ -O btsync_arm.tar.gz\ntar -xvf btsync_arm.tar.gz\n```\n\nWe will create a service\
    \ file. In /etc/init.d, create the btsync file and copy the following text:\n\n\
    ```\n#!/bin/sh\n# /etc/init.d/btsync\n#\n# Carry out specific functions when asked\
    \ to by the system\ncase \"$1\" in\nstart)\n    /opt/btsync/bin/btsync --config\
    \ /opt/btsync/bin/btsync.conf\n;;\nstop)\n    killall btsync\n;;\n*)\n    echo\
    \ \"Usage: /etc/init.d/btsync {start|stop}\"\n    exit 1\n;;\nesac\n\nexit 0\n\
    ```\n\nWe need to set correct permissions for the new file:\n\n```\nsudo chmod\
    \ 755 /etc/init.d/btsync\nsudo update-rc.d btsync defaults\nsudo service btsync\
    \ start\n```\n\nBTSync will now start every time your Raspberry Pi 2 reboots.\
    \ You can check out the configuration file at /opt/btsync/bin/btsync.conf but\
    \ the defaults work pretty well.\n\nYou can now navigate a browser on the same\
    \ network to your Pi's address at http://raspberrypi:8888/gui."
  merge: -1
  img_proc: true
- pgno: 92
  md: "In the GUI, add the directory on the hard drive. Now, install the application\
    \ on your Mac OS X, Windows, Linux machine, or smart phone. Use the GUI to share\
    \ directories between users. It can detect machines on the same network, which\
    \ increases the speed of synchronization.\n\nSync tries its best to configure\
    \ ports, and it uses protocols to communicate over the Internet. In theory, you\
    \ can now call your friend on the phone, ask them to install Sync, and share the\
    \ directory via an e-mail. They will now start seeing the same files as you.\n\
    \n![](img/a8753cacc9d454dfc09eda1ed5012bd3_92_0.png)\n\n> BitTorrent Sync 2 uses\
    \ external servers for tracking purposes, but no actual files are stored on them;\
    \ there is no public access to the tracker files.\n> \n> BitTorrent Sync claims\
    \ to use SRP for mutual authentication and Perfect Forward Secrecy in which all\
    \ data is then encrypted with AES-128 Counter Mode and unique session keys. It\
    \ is a very complex way to ensure nobody can guess your key, not even BitTorrent.\
    \ It is all dynamically generated on the fly, and then clients negotiate more\
    \ keys during transfers. This sounds really good, but you will have to take them\
    \ on their word as the project is closed source.\n\n# The hardware RAID\n\nThe\
    \ Raspberry Pi does not have a SATA controller on board, and there is no way to\
    \ attach extra hard drives except via USB ports. The cool thing is that you can\
    \ get a USB RAID controller. This makes file storage on the Raspberry Pi a very\
    \ attractive option. Technically, the peripheral needed here is called the USB\
    \ SATA multiplier.\n\n# Configuration\n\nThere is no one-step guide to configuring\
    \ these multipliers. Some need to be configured using software in Windows or Linux,\
    \ while others may have DIP switches that configure the multiplier to a specific\
    \ configuration.\n\nAddonics is a well-known and fairly easy-to-source multiplier.\
    \ You will need to search around on the Internet, online auctions, and shops for\
    \ it. The prices are around the same as the Raspberry Pi but if you are looking\
    \ for redundant storage, then these are the cheapest options you will find."
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Massive storage


    If you are looking to create really massive storage, you can easily daisy chain
    a multiplier with another, sometimes up to three or four times. Recently, Addonics
    developed another device that can be daisy chained infinitely!


    Let''s assume that we can daisy chain up to three levels, and we use 2 TB hard
    drives. We configure all the multipliers to span data across all drives with no
    redundancy; that is, five times five, times five. We end up with 125 usable SATA
    ports and a total of 250 terabytes of storage. This figure is highly impractical
    for home users because all these hard drives consume a lot of power. There are
    some people who have hard drive rigs such as these at home, so I would think using
    six multipliers to achieve 25 SATA ports would be a completely viable and cheap
    option for some readers! The following figure is a simple example of how to replicate
    one SATA port into five more ports using SATA port multipliers:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_93_0.png)'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Redundant storage


    We all have lost important data way too many times in our lives, so you should
    consider redundancy over massive storage. We can use a set of four 1 TB hard drives
    that are configured in RAID 5 + S. This gives us 3 TB of usable space. Also, if
    any one hard drive crashes, you can just replace it quickly and all the data that
    we resynchronize will be stored without any loss. The following is a figure explaining
    each feature of a SATA Port replicator:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_94_0.png)


    # Summary


    This chapter demonstrates that the Raspberry Pi is capable of doing anything that
    a normal computer or server can do. It is capable of sharing files with various
    platforms. You can connect to the Raspberry Pi using the latest secure FTP. It
    is capable of storing a great amount of data using some clever hardware add-ons.


    In the next chapter, we will set up various gaming servers.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# 6


    # Setting Up Game Servers


    As great as it would be to run a Counter Strike server on Raspberry Pi, it is
    just not possible due to the high requirements of running such game servers. Mostly,
    this is due to the shortfall of RAM, but some servers also require powerful processors
    to deliver low-latency performance for all players, which could be up to 24 players
    per game.


    In this chapter, you will be introduced to open source games that have been developed
    by people with a passion for a particular genre of games. These games were reverse
    engineered, built from scratch, or just became popular due to their simplicity.


    # Updating to Jessie


    At the time of writing this book, the main distribution for the Rasbperry Pi was
    still Debian Wheezy. Debian Jessie was added around June 2013 for testing on the
    Rasspbery Pi but is already used on desktop machines. As of April 2015, there
    seems to be a stable version for the Raspberry Pi. A lot of game server packages
    were updated only in Jessie because of newer dependencies.


    You can upgrade the entire Raspberry Pi to Jessie, but you are advised not to
    do this until the official image is released. Instead, we will install selected,
    specific packages from Jessie while keeping the entire distribution stable in
    Wheezy. These steps can be skipped if you are already using Jessie.


    # Selective settings


    We can add the following two lines to /etc/apt/sources.list:


    ```

    deb http://mirrordirector.raspbian.org/raspbian/ jessie main contrib non-free
    rpi

    deb http://archive.raspbian.org/raspbian jessie main contrib non-free rpi

    ```'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'The next step is to tell aptitude to use the `wheezy` repository for normal
    updates and that you would like to use Jessie from time to time. These settings
    should be typed into the file found at `/etc/apt/preferences`. Create this file
    if it does not exist:


    ```

    ```

    Package: *

    Pin: release n=wheezy

    Pin-Priority: 900


    Package: *

    Pin: release n=jessie

    Pin-Priority: 300


    Package: *

    Pin: release o=Raspbian

    Pin-Priority: -10

    ```

    ```


    After adding these settings and saving the files, run `sudo apt-get update`.


    We will be using `apt-get` with an extra switch to use the new packages. You should
    only use this switch when it is advised. Upgrading core packages could result
    in unstable behavior. The syntax we will be using is as follows, where `<package>`
    will be replaced with the game package that we require in the following paragraphs:


    ```

    ```

    sudo apt-get -t jessie install <package>

    ```

    ```


    # Game servers


    We will only be focusing on running the server parts of games that do not require
    desktop interaction. Instead, you run the client on another computer and connect
    to Raspberry Pi. Some clients can run on Pi''s X desktop, and they would do reasonably
    well on the Raspberry Pi 2 but might not be very pleasant.


    # OpenTTD


    **OpenTTD** is a reimplementation of the original Transport Tycoon made by MicroProse.
    The game is dangerously addictive, and adding Internet play to the mix can give
    you an extra competitive edge.


    You have to have a passion for logistics, strategy, and real-time simulation to
    enjoy this game. The goal is just something to do with controlling trains and
    trucks as efficiently as possible and make profit while transporting cargo.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Installing OpenTTD


    The latest package is kept only on Jessie:


    ```

    sudo apt-get -t jessie install openttd

    ```


    Several libraries will be installed during this time. You may be presented with
    a blue screen, which asks you if you want to restart some services in order to
    complete the package installation. It is safe to agree to this. This can take
    several minutes to complete.


    # Configuring OpenTTD


    The configuration file called `openttd.cfg` can be found at `~/.open`. It contains
    a few hundred settings that you can tweak according to your preferences, but some
    of the important ones are as follows:


    +   - `lan_internet`: This sets the condition for the LAN access. For lan0, allow
    the Internet, and for lan1, use LAN only.

    +   - `server_name`: This is a unique name to identify the server on the Internet.

    +   - `server_advertise`: We set this to `true` so that it will be visible on
    the server list.

    +   - `server_bind_ip`: We set this to `0.0.0.0`; this allows the address to bind
    to any network.

    +   - `server_port`: For this, we keep the default value; this is how other people
    from the Internet will connect over to the network.


    > To allow people to connect from the Internet, you should forward the 3979 and
    3978 ports to the Raspberry Pi in your router.


    Start the server with the following options:


    ```

    ./usr/games/openttd -D

    ```


    # Playing OpenTTD


    You can now install and run OpenTTD on other computers and invite some friends
    to join you.


    Click on **Multiplayer**, and select **Internet** if you have forwarded the ports
    for the game. Click on **find**, and a list of servers will be displayed.'
  merge: -1
  img_proc: true
