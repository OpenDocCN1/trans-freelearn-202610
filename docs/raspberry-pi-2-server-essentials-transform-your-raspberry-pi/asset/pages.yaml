- pgno: 103
  md: '# 7


    # Streaming Live HD Video


    In this chapter, we are going to use the official HD camera module designed by
    the Raspberry Pi Foundation. Thanks to the new quad core processor and the author
    of UV4L, we can now stream a video directly into a browser with low latency.


    Before starting this chapter, you should have the camera module installed and
    enabled as described with the instructions included with the camera module. It
    is recommended to have 256 MB GPU RAM allocated.


    This chapter is only suitable for the Raspberry Pi 2 or newer with the quad processor
    or better.


    # Installing UV4L


    UV4L is a userspace webcam driver specifically designed for the Raspberry Pi.
    It also includes some other features that will be discussed in this chapter. U4VL
    is custom code that is written and developed by Luca Risolia, who runs the website
    http://linux-projects.org. We will add his repository to get the UV4L driver:


    ```

    curl http://www.linux-projects.org/listing/uv4l_repo/lrkey.asc | sudo apt-key
    add -

    ```


    Add the following line to /etc/apt/sources.list:


    ```

    deb http://www.linux-projects.org/listing/uv4l_repo/raspbian/ wheezy main

    ```


    > If you have not yet run rpi-update, then it is recommended to do it now. The
    UV4L driver requires the latest foundation kernels and modules to install properly.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Now we need to update the repository list, and then we can install the UV4L
    driver. We will do these with the following commands:


    ```

    ```bash

    sudo apt-get update

    sudo apt-get install uv41 uv41-raspicam

    sudo apt-get install uv41-server uv41-raspicam-extras

    ```

    ```


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_104_0.png)


    > The UV4L driver makes it really easy to stream video from the Raspberry Pi.
    Consider supporting Luca by visiting his website and donating to his cause or
    purchasing a serial key for the overlay module that is described later in the
    chapter.


    # Configuring the UV4L-RaspiCAM


    The configuration file can be found at /etc/uv41/uv41-raspicam.conf and is used
    to configure the initial video stream. There are default settings that are used,
    and the following bullet points are settings found within the file that you may
    be interested in changing manually for your own use.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_104_1.png)


    > These are some typical settings that you may want to use if capturing a stream
    using VLC. The driver is adaptive and will change configurations if you request
    MJPEG stream, or it will start a WebSockets stream from the browser, technically
    allowing you multiple streams. Multi-streaming is experimental, though.


    Here are some typical settings:


    +   - Encoding:

    +     Streaming: H264, mjpeg, jpeg, yuv420

    +     Specialist: nv21, yvu420, rgb565, rgb565x, rgb24, bgr24, rgba.

    +   - Framerate:

    +     0 sets auto

    +     30 at 1080p

    +     60 at 720p

    +     90 at VGA.

    +   - Bitrate: 17000000 (default value)'
  merge: -1
  img_proc: true
- pgno: 105
  md: '+   - The Intra-period: This is used for H264 only; if you experience artifacts
    in the stream, try adjusting this value. Usually, artifacts are caused by lost
    frames and poor network performance. The lower this value, the more bandwidth
    is used. A good start is FPS / 2.

    +   - Quality:

    +     This applies to JPEG and MJEP streaming only

    +     85 is the default value.

    +   - * text overlay: Uncomment the two properties as this will be required later
    in the chapter.

    +   - * no preview: If you have a monitor connected to HDMI, you will see the
    original stream preview. Uncomment this if you are experiencing Raspberry Pi reboot
    with a 1 A power supply and Wi-Fi.


    Most of these configuration settings can be altered through the web interface
    by navigating to http://raspberrypi:8080. The options with the * mark must be
    configured in the configuration file, and UV4L must be restarted.


    # Installing WebRTC


    Web Real-Time Communication (WebRTC) is a protocol that allows modern web browsers
    to establish a peer-to-peer link to exchange data. UV4L uses WebRTC to create
    a socket to the Raspberry Pi and receive a live H264 video stream, eliminating
    the need for transcoding and allowing us to watch a high-quality, low-latency
    video directly in our browser.


    To install the WebRTC module for uv4l-server, we just need to issue one command
    and restart UV4L:


    ```

    ```

    sudo apt-get install uv4l-webrtc

    sudo service uv4l_raspicam restart

    ```

    ```


    # WebRTC streaming


    Please be aware that UV4L WebRTC streams in an adaptive bitrate and resolution.
    The bitrate and resolution streamed to the client will adaptively adjust based
    on the connection quality. This means that any configuration that you have applied
    will not apply to WebRTC streams, but the overlay will still work. It may also
    disconnect other streams that do not use WebRTC.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Streaming Live HD Video


    You can now navigate to http://raspberrypi:8080, and you will be presented with
    a screen similar to the following:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_106_0.png)


    You can click on audio/video stream via WebRTC. Then, on the next page, click
    on the start button. It may take a few seconds to establish a link, and if everything
    goes as planned, you will know see a live stream from the Raspberry Pi camera.


    With the Raspberry Pi 1, it was extremely complicated to set up a stream similar
    to this one, leaving almost no resources left on the Pi at all. The WebRTC module
    is truly a time saver in terms of streaming from your Raspberry Pi.


    # Real time HTTP streaming


    To configure the HTTP stream, you can click on the Camera Control Panel link on
    the UV4L web page and set the format and other options you would like.


    Alternatively, if you don''t want to access the webpage, you can just configure
    the raspicam configuration file as you need it, and then you can use the corresponding
    URL in VLC or a third-party app to capture the stream:


    +   - HTTP/MJPEG: http://raspberrypi:8080/stream/video.mjpeg

    +   - HTTP/Raw H264: http://raspberrypi:8080/stream/video.h264

    +   - HTTP/JPEG: http://raspberrypi:8080/stream/video.jpeg'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'To receive a H264 stream using VLC, I have found that tweaking some of the
    plugin settings worked best for me:


    +   1. Click on **Tools** | **Preferences**.

    +   2. Click on **All** in the **Show settings** panel in the bottom-left corner.

    +   3. Click on **Input / Codecs** | **Demuxers**.

    +   4. Change the demux module from the **Automatic** to **H264** video demuxer.

    +   5. Click on **Demuxers** | **H264**.

    +   6. You will notice that it is set to 25 frames per second. Unfortunately,
    changing this value does not work as expected. You should rather change your configuration
    on the Raspberry Pi to stream at 25 frames per second.

    +   7. On the Raspberry Pi, choose a suitable bit rate for your stream. On the
    LAN, this maybe the default, but on Wi-Fi, I suggest you try lower bitrates.


    This configuration works best for higher quality streaming. It is necessary to
    change the VLC demuxer to H264 because it does not seem to be able to recognize
    the format on its own. You can also specify an additional option of `:demux=h264`,
    but I find that strictly setting the demuxer to H264 works better.


    We also need to adjust the frame rate on the Raspberry Pi to 25 fps to match the
    default in the H264 module in VLC. Adjusting the frame rate in the module on VLC
    to 30fps did not help. The reason behind adjusting the frame rate is that I noticed
    strange artifacts on moving objects. This suggested bandwidth problems, but it
    even happened on the LAN.


    I finally found this solution and realized that the Raspberry Pi was sending 30
    fps while the demuxer was decoding at 25 fps, causing the key frames to be out
    of sync. As strange as this may sound, it really does produce a good quality stream,
    albeit with about 1+ seconds of buffering.


    If you are experiencing no video, lots of artifacts, or long lags, refer to Chapter
    2, *Preparing a Network* on how to run the `iperf` test to make sure you have
    good enough bandwidth. Bandwidth problems may also be caused by a poor power supply,
    especially if you are using a wireless adapter.


    # Web conferencing


    In the latest version of UV4L, there is an interesting new feature for web conferencing
    with audio and video. This feature is built into the `webrtc` module, and no extra
    configuration is necessary.'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'Any WebRTC compatible device, such as a smart phone, note book, or standard
    desktop, with a modern browser can join into the conference by going to http://raspberrypi:8080/conference.
    This will work inside your LAN, but if you would like to allow connections from
    the Internet, you need to provide the correct IP address in the Signaling Server
    Field and open the necessary ports.


    This works purely as a server and does not use the Pi''s camera, but you can join
    the conference from your Raspberry Pi from within the X client and a browser.
    If you want to use audio on the Raspberry Pi, make sure you have pulseaudio installed
    and a compatible USB sound card with a microphone.


    # Streaming the X desktop


    It is also possible to stream your actual X desktop using the UV4L driver. Consider
    it something like screen casting, similar to Miracast. If your smart TV''s browser
    supports WebRTC, you can simply enter the URL and have a wireless video feed of
    the desktop on the TV.


    To use this feature, we need to install an extra module.


    ```

    sudo apt-get install uv4l-xscreen

    ```


    You can then use raspi-config to enable boot to desktop/scratch to start up on
    the boot. As mentioned in the WebRTC section, the only caveat at the moment is
    that this will only work with a specific resolution. Other resolutions may be
    supported in the future. You will need to edit your /boot/config.txt file as follows:


    ```

    framebuffer_width=640

    framebuffer_height=480

    framebuffer_depth=32

    framebuffer_ignore_alpha=1

    ```


    You can now log into your Raspberry Pi over SSH and issue the following command:


    ```

    uv4l --driver xscreen --auto-video_nr --display :0 --framerate 10 --server-option
    ''--port=9000''

    ```


    Ignore all warnings. This command starts a new UV4L server and creates a device
    called /dev/video1 that can be used with the same commands as described in the
    real-time HTTP streaming section. It creates the webserver under port 9000. Port
    8080 still works and can continue to stream your webcam while streaming the X
    video separately.


    You can view the video transmission at: http://raspberrypi:9000/stream/webrtc.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Text overlay


    Text overlay is a feature that allows you to superimpose text lines onto video
    frames without any transcoding. The UV4L driver works extremely well with HD streams
    and framerates higher than 30, and supports mjpeg, H264, yuv420, and other video
    formats.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_109_0.png)


    > When enabled, the image width and height should be a multiple of 16. For 1080p
    you would need to use 1920 x 1088, 720p would be 1280 x 720, and so on.


    At the most basic level, text is read from a JSON-formatted file, which contains
    properties for each line''s position, color, thickness, and scale. The default
    configuration file will display the video frame rate as it is being transmitted.
    The configuration file gets loaded when the camera is started for the first time,
    but it can be updated with a specific command, making heads-up displays (HUDs)
    a practical reality.


    To enable the text overlay, you need to start the driver with the following /etc/uv41/uv41-raspicam.conf
    configuration before loading the camera page for the first time. You cannot enable
    this feature if there is already an ongoing stream:


    ```

    text-overlay = yes

    text-filename = /usr/share/uv4l/raspicam/text.json

    ```


    The text.json file contains a sample of all the options that are available to
    you. It is a good idea to copy this file to /home/pi.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_109_1.png)


    > If you plan on updating the file frequently, it is recommended to store the
    file in /tmp as the file will actually be stored in RAM.


    After restarting the uv4l_raspicam service, you will now see some sample overlay
    text on your video stream.


    You can edit the text.json file and execute the following command in the console
    for the overlay text to be updated:


    ```

    v412-ctl --set-ctrl=text_overlay=1

    ```


    This is a very basic approach to updating the overlay on your video stream, for
    example, running a separate program you wrote that will overwrite the file every
    so often and issue the refresh command.


    Using this approach, you will not be able to update the overlay any faster than
    1 second at a time. If you would like to achieve real-time overlay updates, refer
    to The HUD sample section.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'More details about how to remove the http://www.linux-projects.org overlay
    are provided further on in this chapter.


    # Object detection and tracking


    Object detection and tracking can be turned off and on at any time. This feature
    only works with the yuv420, H264, and mjpeg encodings.


    This feature requires more CPU overhead depending on how complex a task you are
    doing. For example, on the Pi 2, you can use face recognition with 640 x 480 at
    15 FPS with some heavy CPU usage. On the Pi 1, it is about half of this:


    ```

    uv41 --driver raspicam --auto-video_nr --object-detection --min-object-size 80
    80 --main-classifier /usr/share/uv4l/raspicam/lbpcascade_frontalface.xml --object-detection-mode
    accurate_detection --width 320 --height 240 --framerate 15 --encoding h264

    ```


    # Removing the overlay watermark


    I have been in contact with Luca Risolia, the author of UV4L, and he has agreed
    to provide you with an exclusive deal; as the reader of this book, you will be
    the very first person to know that he has agreed to provide you with a way to
    remove the white http://www.linux-projects.org watermark on the 3 Raspberry Pi''s
    that you own!


    All you need to do is send an e-mail to info@linux-projects.com with the following
    details from your Raspberry Pi by executing and copying the results of this command:


    ```

    uv41 --driver raspicam --serial-number

    ```


    I am sure Luca will be grateful for a small donation in return for three serial
    numbers, and this will allow him to continue to create more features for this
    excellent driver.


    # The HUD sample


    As defined by Wikipedia, a heads-up display, also known as a HUD, is a transparent
    display that presents data without requiring users to look away from the main
    activity. The origin of the name comes from a pilot being able to view information
    with their head positioned up or straight ahead, instead of looking down at some
    instruments.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'So, to stop us from looking down into the console, I thought it would be a
    nice idea to see some information about our Raspberry Pi directly on the video
    stream.


    With some help from Luca, I have created the C++ code that allows you to update
    the overlay pretty much on every frame using the UV4L API directly, which means
    hardly any CPU overhead is used.


    If you feel comfortable with C++11, I have provided the complete code sample on
    the code download page, and you can add your own variables.


    I have also provided a compiled binary with a variety of popular resource variables
    that you can use easily place in the template file once, and will be updated in
    real time on your stream.


    # Using the overlay binary


    The binary requires two parameters: the source video device and the source file,
    which will be referred to as the template file. The template file is exactly the
    same format as text.json, but the difference is that you construct the text fields
    with the inline variables listed here. It is recommended to copy your template
    file to /tmp/file.tpl and provide it as the source template.


    You will also need to update the uv1_raspicam.config file to point to a new location,
    /tmp/text.json (not the template file), and restart the UV4L service. A new file
    will be created in /tmp/text.json from which the UV4L API call will read the replaced
    variables. Do not alter this file. Working with these files in /tmp is critical
    for achieving the best video performance but also eliminating I/O from your SD
    card, which may cause unnecessary wear during long periods of use.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_111_0.png)


    > In case you are wondering, you can update the template /tmp/file.tpl file while
    the binary is running. The C++ binary file reads the template file using a stream
    open in read-only mode with minimal locks.


    Use this command line to execute the binary:


    ```

    ./overlay /dev/video0 /tmp/text.tpl

    ```


    # Inline variables


    Here are some useful variables from the general Raspberry Pi resources:


    +   - {sysnfo.cputemp}'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Wireless info (the default is wlan0):


    +   - `{signfo.level}`: Signal strength

    +   - `{signfo.quality}`: Signal quality

    +   - `{signfo.bitrate}`: Bitrate


    Network bandwidth (the default is eth0):


    +   - `{nnfo.downspeed}`

    +   - `{nnfo.upspeed}`


    A sample text line will look like this:


    ```

    "ETH0 UP: {nnfo.upspeed} CPU temp {sysnfo.cputemp}"

    ```


    To change the default values you need to amend the C++ file and recompile it.
    If you are already going to edit the code, use the base code as an example and
    try to add something else. If you have never edited C++ or any other code, just
    try to understand the main class line by line, and by the time you get to the
    end, you will understand the basic C++.


    # Compiling the overlay code yourself


    The C++ code was written in the C++11 standard, and it is necessary to install
    G++ version 4.8 to be able to compile this code. No extra libraries, such as libboost,
    are required for this sample:


    ```

    sudo apt-get install g++-4.8

    ```


    Once you have installed the latest G++, you can then simply compile the main code
    file and extra code files with any changes you have made by executing the following
    command:


    ```

    sudo g++-4.8 -Ofast -std=c++11 *.cpp -o overlay

    ```


    Luca has also provided a text-scrolling example that can be downloaded from http://www.linux-projects.org/downloads/examples/uv4l-overlay.cpp,
    but it requires the Boost C++ library. Unfortunately, the inclusion of this library
    causes the code to take considerably longer to compile. This is why I have removed
    all dependencies from the Boost library in my code; it provides a lot of extra
    support for tasks and structures used in modern programming languages and is worth
    a try:


    ```

    sudo apt-get install libboost-all-dev

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'If you are a Visual Studio developer, you will be happy to know that I have
    created the overlay binary using Visual Studio with **VisualGDB**. VisualGDB allows
    you to write code with C++ intellisense in Visual Studio on your desktop. It will
    automagically copy your files and compile them on the Raspberry Pi over SSH. Another
    great feature is that you can debug the code running on the Pi within Visual Studio!
    You do not need to install any extra software on the Raspberry Pi. A tutorial
    on how to start using VisualGDB is available at `http://visualgdb.com/tutorials/raspberry/`.


    There are other tutorials on the site you may find interesting. There is a 30-day
    trial you can use.


    # Summary


    Streaming videos is still one of the most popular search terms on the Internet
    for the Raspberry Pi. There are a lot of different examples and solutions, some
    very complex some very easy.


    Thanks to the work put into the UV4L driver, video streaming is becoming much
    easier to achieve. Compared to *Raspberry Pi Server Essentials, Packt Publishing,
    my* previous book, this chapter has been extremely shortened due to the easy that
    it has accomplishes now. Not only is it shorter, we have many more features to
    work with and can enjoy HD video streaming on the Raspberry Pi 2 with the smallest
    amount of effort.


    In the next chapter, we will look at how to set up the Pi as a media center.'
  merge: -1
