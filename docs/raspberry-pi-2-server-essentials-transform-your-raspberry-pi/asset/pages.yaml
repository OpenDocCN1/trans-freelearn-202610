- pgno: 138
  md: '# Deploying the application


    It is very simple to deploy the application to the Raspberry Pi, but first, we
    will change the package name. Doing this is not that obvious unfortunately, but
    follow these steps:


    +   1. In the **Solution Explorer Snap** window, click on the **Solution Explorer
    Snap** in tab.

    +   2. Right-click on the **HelloWorld** project (not the Solution) and **Properties**.

    +   3. Navigate to Package **Manifest | Packaging**.

    +   4. The default value in the Package name is a Unique ID, and this is the name
    of the process that will be created on IoT. For now, we can change this to **HelloWorld**
    without spaces. When you want to publish an app to the store, you will need to
    use **NameSpace**, for example, `My.RaspberryPi.HelloWorld`.

    +   5. Press *Ctrl + S* to save the solution, then close the window.


    Now, to publish, we need to change a few settings and select the target device:


    +   1. Change the `x86` value in the top toolbar to `ARM`.

    +   2. Next, to the green Play button, there is a small drop-down button; click
    on it and select the **Remote machine**.

    +   3. This will bring up a new window, which automatically discovers Windows
    IoT devices running on your network. Make sure your Raspberry Pi is booted into
    the Windows 10 Dashboard app.

    +   4. Click on the device entry found under **Auto Detected** and then **Select**
    (you will only need to do this once per session).

    +   5. The project will build; if there are no errors, it will get published on
    the Raspberry Pi and run your application. Visual Studio is not in Debug Mode!

    +   6. On the Raspberry Pi, click on your button, and the text box will be updated
    with the text you entered in the code earlier.

    +   7. To stop debugging, click on the red **Stop** button.


    You have now created your first Universal Application for the Raspberry Pi.


    # Debugging


    One of the greatest features in Visual Studio is the debugging functionality.
    All these features are already enabled on Windows 10 IoT installed on your Raspberry
    Pi, and no extra configuration is required.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'After you click on **Deploy** (the green start button), Visual Studio automatically
    goes into debug mode. In this mode, you cannot change any of the code; you can
    add or remove breakpoints, view output in the debug console, and use various other
    debug tools.


    Visual Studio will also automatically break on unexpected errors and take you
    to the code that caused this exception with details about the problem.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_139_0.png)


    > As a long-time C# developer, I can admit that these errors might not make a
    lot of sense sometimes. The best thing is to search the Web for part of the error
    message and see what other developers have done to correct the problem. Stack
    Overflow usually provides high-quality answers for many ambiguous error messages.


    # Breakpoints


    While the application is in the code edit mode, look at the source code of the
    button that we created earlier. You can add or remove breakpoints by clicking
    on the dark grey bar at the left, which will highlight the line of code in red:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_139_1.png)


    Click on **Deploy and run**. Your break point will be hit before when you click
    on the button. To continue, click on the green Play button again, or *F10* for
    step over, or *F11* to step in (if it is a method you created or the source code
    is available)'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Unhandled exceptions


    To experience this feature, we will create a deliberate unhandled exception.

    It would be nice to demonstrate a Stack Overflow, but let''s stick with a basic
    arithmetic function:


    +   1. Under your break point, add these lines of code, and do not add any breakpoint
    to them:

    +   2. Click on Deploy and run.

    +   3. Click on the button on the IoT device and your first break point will become
    a hit.

    +   4. Press Continue to continue executing the code.

    +   5. Straight after continuing that you should get an unhandled exception message:


    ```

    int zero = 0;

    this.textBlock.Text = (0 / zero).ToString();

    ```


    ```

    DivideByZeroException was unhandled by user code

    ```


    This is a simple, self-explanatory exception. If you ever run into deeper water,
    you can use View Detail... under action to reveal some more debugging information.


    These types of exception cause the application to crash whether you are in the
    Debug or Release mode.


    If you suspect that an operation may result in an unhandled exception, for example,
    lots of arithmetic calculations, working with indexes, long running operations,
    or external calls, you can wrap this code in try block, which will prevent your
    application from crashing.


    Amend the divide by the zero code as follows:


    ```

    try

    {

    int zero = 0;

    this.textBlock.Text = (0 / zero).ToString();

    }

    catch (Exception ex)

    {

    this.textBlock.Text = ex.ToString();

    }

    ```


    You can use the method to display error messages to the user or log exceptions
    to a database.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Samples


    There is a large sample code package available to download from the code area.
    These are official Microsoft Samples, and they demonstrate not only how to create
    more advanced applications but also how to use the GPIO and other features on
    the Raspberry Pi.


    # Windows 10 IoT WebGUI


    You can access your Raspberry Pi via your browser. Simply enter the IP with port
    8080 and use the default username and password provided earlier in this chapter.


    As time goes on, this page will be updated to support more features and may even
    completely change in the future. For now, we have access to various common commands,
    such as Shutdown, reboot, processes, live performance graph, and so on.


    # Setting up the startup app


    The following are the steps to set up the startup app:


    +   1. You can click on **Apps** on the left-hand side menu.

    +   2. From the installed apps, find your app and click on it.

    +   3. Once it is selected, click on **Set Default**.

    +   4. You application will now start up after each boot:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_141_0.png)


    +   5. Click on **Reboot** to test it.


    WebGUI will still be available while your application runs.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Peripherals


    I tried to plug in various devices and see what happens with most of them not
    doing anything. Popular ones seem to work, such as a USB mouse and keyboard transceiver.


    Just remember that power is still an issue on USB, so it may be a good idea to
    use a powered hub.


    You can find more information on supported devices by visiting: http://ms-iot.github.io/content/en-US/win10/SupportedInterfaces.htm.


    # Bluetooth


    Bluetooth is still a fairly new addition to Windows IoT as of writing this chapter.
    I tried a generic Bluetooth dongle (unbranded), and it was installed successfully.
    It found my TV and my Bluetooth keyboard while I was on WebGUI.


    I was successful in pairing my keyboard and navigating the screen.


    You may also succeed in paring Bluetooth serial port transceivers as it seems
    to be supported on generic Bluetooth.


    # Wireless


    Wireless support has been rapidly extended since the release candidate, and it
    supports the official Raspberry Pi dongle and other popular chipsets used in many
    other brands.


    # Summary


    Even though Windows has various other ARM and MCU systems, Windows IoT was developed
    from a blank canvas. With time, the support will continue to grow for new devices
    and other ways to develop applications.


    If you are interested in learning C# or are already a seasoned C# developer, this
    finally looks like the light at the end of the tunnel for an alternative embedded
    OS, other than the ever dominating *nix operating systems that were designed for
    these sorts of devices years ago.


    There are many advantages in using Visual Studio and the Universal App architecture,
    but as of writing this chapter, there is still a lot of work to do for Microsoft.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 11

    Running Your ownCloud


    This chapter covers how to install the open source ownCloud on to the Raspberry
    Pi 2, which is a great, free, self-hosted alternative to services such as DropBox,
    Google Drive, or Live Drive.


    If you feel like you would like full control over the data, how you share it,
    and who can access it, ownCloud is a great solution. It is a self-hosted file
    sync and share server, which provides access through a web interface, the sync
    clients of WebDAV.


    There are clients available for most operating systems, but even when you don''t
    have a client, you can always use a modern browser to get straight into your data.


    # Installation


    As of this writing this chapter, ownCloud version 8 is the latest version available
    for installation.


    You may already have a few things that you require installed if have you followed
    the previous chapters. In case you need a few extra packages, it is best to go
    through the entire installation process from the beginning as described here.


    # Requirements


    ownCloud requires a database storage engine, PHP, a web server, and data. As usual,
    I recommend to use nginx as it is lightweight and powerful. You can learn how
    to install nginx in Chapter 4, Using Fast Web Servers and Databases. It is also
    recommended by the developers of ownCloud to use nginx as the web server.


    To be able to access ownCloud from the World Wide Web (WWW), refer to the dynamic
    DNS section in Chapter 2, Preparing a Network.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# MySQL


    Update your repositories and install MySQL:


    ```

    sudo apt-get update

    ```


    ```

    sudo apt-get install mysql-server

    ```


    During installation, you will be asked to set a root mysql password on a blue
    screen.


    > Use a strong password and save it into a program such as Keepass so that you
    can quickly recover it for the next time you need it.


    After installation, we will enter into the MySQL database console and create a
    table for ownCloud. You should replace the password in the script with your own
    strong password:


    ```

    mysql -u root -p

    ```


    ```

    CREATE DATABASE owncloud;

    CREATE USER owncloud@localhost IDENTIFIED BY ''password'';

    GRANT ALL PRIVILEGES ON owncloud.* TO owncloud@localhost;

    FLUSH PRIVILEGES;

    ```


    ```

    exit

    ```


    Remember the username, password, and table name if you have changed it, as it
    will be required in the First Configuration section.


    # nginx and PHP


    We will install a variety of packages for PHP followed by nginx as follows:


    +   1. Run the following command:

    +   ```

    +   sudo apt-get install php5-mysql openssl ssl-cert php5-cli php5-common php5-cgi
    php-pear php-apc curl libapr1 libtool php5-curl libcurl4-openssl-dev php-xml-parser
    php5-dev php5-gd memcached php5-memcache

    +   ```

    +   ```

    +   sudo apt-get install php5-fpm nginx

    +   ```'
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   2. After you have installed all the required packages, you can create a
    new web folder, download the latest version of ownCloud, and unpack it to a new
    folder called owncloud:

    +   ```

    +   sudo mkdir -p /var/www/owncloud

    +   cd /var/www

    +   sudo wget https://download.owncloud.org/community/owncloud-8.1.3.tar.bz2

    +   sudo tar -xvf owncloud-8.1.3.tar.bz2

    +   sudo chown -R www-data:www-data /var/www

    +   ```

    +   3. We will generate a self-signed certificate, but you can get a free certificate
    from https://letsencrypt.org. A self-signed certificate will show up an error
    message on your browser, but all your traffic will still be encrypted after you
    continue:

    +   ```

    +   sudo mkdir -p /etc/nginx/ssl

    +   sudo openssl req -x509 -nodes -days 36500 -newkey rsa:2048 -keyout /etc/nginx/ssl/owncloud.key
    -out /etc/nginx/ssl/owncloud.crt

    +   ```

    +   4. You will be asked to input various other information during the certificate
    generation process. You can leave Country Name, State, Locality Name, Organization,
    and so on, blank, but for Common Name, you must enter your dynamic DNS address.

    +   5. We will now create and edit the nginx configuration file at /etc/nginx/sites-available/owncloud.

    +   6. If you have decided to use a domain name for the WWW access, you will need
    to adjust the server_name property accordingly. The DNS name and the private IP
    of your Raspberry Pi is as follows:

    +   ```

    +   server_name {domain.name.com},{pi''s IP};

    +   ```

    +   7. For simplicity, I only use my Pi''s IP address and not DNS''s IP address.


    The first server block forces all non-SSL requests to be permanently redirected
    to the SSL configured server block.


    The SSL server block has quite a large configuration area. You can find the text
    version in the code pack.'
  merge: -1
  img_proc: true
- pgno: 146
  md: "If you have other sites running, you should pay attention to the root directive.\
    \ If you use `/var/www/` as the root, you can then simply access the site by adding\
    \ `/owncloud` to your URL. If you would like to use your Raspberry Pi solely for\
    \ ownCloud, you can change the root to `/var/www/owncloud/`, and then you can\
    \ access ownCloud with your IP or DNS without adding a subfolder to your URL.\
    \ I have left as recommended for multi-tenant configuration where you are required\
    \ to add `/owncloud` to your URL. You may also choose to set up a subdomain locked\
    \ to the `/owncloud` directory, which is a good alternative solution. You should\
    \ decide on this once as changing it later may break ownCloud:\n\n```\nserver\
    \ {\n    listen 80;\n    server_name 192.168.1.21;\n    return 301 https://$server_name$request_uri;\
    \  # enforce https\n}\n\nserver {\n    listen 443 ssl;\n    server_name 192.168.1.21;\n\
    \    access_log /var/log/nginx/sitename.access.log;\n    error_log /var/log/nginx/sitename.error.log;\n\
    \n    ssl_certificate /etc/nginx/ssl/owncloud.crt;\n    ssl_certificate_key /etc/nginx/ssl/owncloud.key;\n\
    \n    # Path to the root of your installation\n    root /var/www/;\n    client_max_body_size\
    \ 10G; # set max upload size\n    fastcgi_buffers 64 4K;\n\n    # Some rewrite\
    \ rules, more to come later\n    rewrite ^/owncloud/caldav((/|$).*) $ /owncloud/remote.php/caldav$1\n\
    \    last;\n    rewrite ^/owncloud/carddav((/|$).*) $ /owncloud/remote.php/carddav$1\n\
    \    last;\n    rewrite ^/owncloud/webdav((/|$).*) $ /owncloud/remote.php/webdav$1\n\
    \    last;\n\n    # Protecting sensitive files from the evil outside world\n \
    \   location ~ ^/owncloud/(data|config|\\.ht|db_structure.xml|README) {\n    \
    \    deny all;\n    }\n    # Configure the root location with proper rewrite rules\n\
    \    location /owncloud/ {\n```"
  merge: -1
  img_proc: true
- pgno: 147
  md: "```\nrewrite ^/owncloud/.well-known/host-meta /public.php?service=host-meta\
    \ last;\nrewrite ^/owncloud/.well-known/host-meta.json /public.php?service=host-meta-json\
    \ last;\nrewrite ^/owncloud/.well-known/carddav /remote.php/carddav/ redirect;\n\
    rewrite ^/owncloud/.well-known/caldav /remote.php/caldav/ redirect;\nrewrite ^/owncloud/apps/calendar/caldav.php\
    \ /remote.php/caldav/ last;\nrewrite ^/owncloud/apps/contacts/carddav.php /remote.php/carddav/\
    \ last;\nrewrite ^/owncloud/apps/([^\\*/])(/.*\\.(css|php))$ /index.php?app=$1&getfile=$2\
    \ last;\nrewrite ^(/owncloud/core/doc[^\\*/]+)$ $1/index.html;\ntry_files $uri\
    \ $uri/ index.php;\n}\nlocation ~ \\.php(?:$|/) {\n    fastcgi_split_path_info\
    \ ^(.+\\.php)(/.+)$;\n    include fastcgi_params;\n    fastcgi_param SCRIPT_FILENAME\
    \ $document_root$fastcgi_script_name;\n    fastcgi_param PATH_INFO $fastcgi_path_info;\n\
    \    fastcgi_param HTTPS on;\n    fastcgi_pass unix:/var/run/php5-fpm.sock;\n\
    }\n# Optional: set long EXPIRES header on static assets\nlocation ~* \\.(?:jpg|jpeg|gif|bmp|ico|png|css|js|swf)$\
    \ {\n    expires 30d;\n    # Optional: Don't log access to assets\n    access_log\
    \ off;\n}\n}\n```\n\nNow you have enable ownCloud and disabled the default configuration\
    \ if you just installed nginx:\n\n```\nsudo ln -s /etc/nginx/sites-available/owncloud\
    \ /etc/nginx/sites-enabled/owncloud\n```\n\n```\nsudo unlink /etc/nginx/sites-enabled/default\n\
    ```\n\nFinally, we need to restart everything for the new configuration to take\
