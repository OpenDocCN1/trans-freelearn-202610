    # Minecraft


    Minecraft is a sandbox indie game where you are in control of a person that can
    build anything you imagine. There are complex blocks that can be used or programmed
    to do various server-side calculations. If you would like to see the complete
    potential of Minecraft, you should visit BitVegas. This will be more difficult
    than the other servers as we need to install and configure a lot of dependencies.


