- pgno: 37
  md: '# 2

    Preparing a Network


    It is important to learn how your network works, especially if you plan to connect
    your Raspberry Pi to the Internet. A home user will typically use an Internet
    package designed to browse websites and read e-mails. Business packages, on the
    other hand, need to do a lot more than you think. These two different ISP packages
    usually carry important technical differences that dictate how your network can
    be reached.


    In this chapter, you will learn how to connect to the Internet and look at how
    to solve some common problems for home users. You will also learn how to benchmark
    your network and try to isolate any network-related issues.


    # Local Area Network (LAN)


    Using the standard Raspbian package, both essential and non-essential drivers
    are included. All essential drivers are loaded and some non-essential ones are
    as well.


    We will start by plugging in a network cable between the Raspberry Pi and the
    router provided by your ISP. By default, your router has a DHCP server that automatically
    assigns an IP address to your Raspberry Pi.


    You may also use network switches to make a more complex network but because the
    Raspberry Pi has a 100 megabit network port, it may downgrade your entire network
    to 100 megabits. Some switches can negotiate separate connections to lower speed
    interfaces without downgrading the entire network, but you need to consult the
    specifications of the device in order to do this.'
  merge: -1
  img_proc: true
- pgno: 38
  md: "To check whether your LAN is up and running, just type `ifconfig`, and you\
    \ will get text containing your current settings:\n\n```\neth0      Link encap:Ethernet\
    \  HWaddr b8:27:eb:45:bb:fa\n          inet addr:192.168.1.135  Bcast:192.168.1.255\
    \  Mask:255.255.255.0\n          inet6 addr: fe80::ba27:ebff:fe45:bbfa/64 Scope:Link\n\
    \          UP BROADCAST RUNNING MULTICAST  MTU:1500  Metric:1\n          RX packets:89\
    \  errors:0  dropped:0  overruns:0  frame:0\n          TX packets:96  errors:0\
    \  dropped:0  overruns:0  carrier:0\n          collisions:0  txqueuelen:1000\n\
    \          RX bytes:7943  (7.7 KiB)  TX bytes:14104  (13.7 KiB)\n\nlo        Link\
    \ encap:Local Loopback\n          inet addr:127.0.0.1  Mask:255.0.0.0\n      \
    \    inet6 addr:  ::1/128 Scope:Host\n          UP LOOPBACK RUNNING  MTU:16436\
    \  Metric:1\n          RX packets:0  errors:0  dropped:0  overruns:0  frame:0\n\
    \          TX packets:0  errors:0  dropped:0  overruns:0  carrier:0\n        \
    \  collisions:0  txqueuelen:0\n          RX bytes:0  (0.0 B)  TX bytes:0  (0.0\
    \ B)\n```\n\nLet's try to understand the different keywords from the preceding\
    \ output:\n\n+   - **HWaddr**: This is your Pi's MAC address, which identifies\
    \ a vendor and should ideally provide a globally unique address.\n+   - **inet\
    \ addr**: This is your current LAN IP address, which belongs to a private range\
    \ of either `10.x.y.z` (Class A), `172.16.y.x` (Class B), or `192.168.x.x` (Class\
    \ C). They are known as private addresses because they do not exist on the Internet.\n\
    +   - **Bcast**: This is a reserved address that's calculated by your network\
    \ mask, and it transmits global messages within your private network.\n+   - **Mask**:\
    \ This is used in all networks but should only be concerned with advanced configurations.\
    \ Masks divide a network into subnetworks and depend on the class your network\
    \ belongs to.\n+   - **inet6 addr**: This is your IPv6 address. It will show only\
    \ if your router supports this, but it is more difficult to remember.\n+   - **RX**:\
    \ This shows how many packets have been received.\n+   - **TX**: This shows how\
    \ many packets have been sent.\n\n# The eth0 port\n\nThe Raspberry Pi will typically\
    \ use **eth0** as its on-board LAN interface. If you add USB LAN devices, they\
    \ will have an incremented number after *eth*; this will increment the interface\
    \ number."
  merge: -1
  img_proc: true
- pgno: 39
  md: '# The wlan0 interface


    When we add a wireless adapter, ifconfig will represent these interfaces using
    wlan instead of the eth prefix. All the details are the same, but it helps to
    visually identify wired networks from wireless ones.


    # The loopback (LO) interface


    This is known as the home address because it refers to the local device and has
    a reserved range starting from 127.0.0.1 and ending at 127.255.255.254. This is
    a virtual interface that bypasses local hardware interfaces and rules. It is commonly
    used for security reasons and during software testing. For example, you may only
    allow the root access of MySQL to a localhost (this will include 127.0.0.1 for
    IPv4 or ::1 for IPv6). This means that only the user or service on the computer
    will be granted access to this resource. It is reserved, and neither the localhost
    nor 127.x.y.z can be assigned to users on the Internet.


    # A wireless configuration (Wi-Fi)


    Wi-Fi is a convenient way to allow your Raspberry Pi to operate in a wireless
    environment within a wireless network. It is not an ideal solution for servers,
    though, as there is an increased latency in transmitting data, and many Wi-Fi
    networks suffer from noise generated by other networks on the same frequency.


    There are many types of wireless adapter available, and not all drivers are included
    with Raspbian. You might have to install a specific driver, but this is usually
    a simple process. When talking about wireless configuration, you have to target
    the chip that is used on the adapter and not the end vendor who is selling it.


    # Recommended wireless adapters


    One of the most stable and affordable chipsets is Realtek RT8191, which works
    with the 802.11n standard. It is also compatible with the older 802.11b/g specifications,
    just in case your router does not support the newer 802.11n specification. However,
    it does not support 5 GHz frequencies or the 40 MHz dual band.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_39_0.png)


    > There is a comprehensive list of compatible adapters available at http://elinux.org/RPi_USB_Wi-Fi_Adapters.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Shop around to find the best price, and it''s best to not go for overpriced
    adapters that claim to be the only and the best ones for your Raspberry Pi.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_40_0.png)


    > You should be aware that, by default, wireless and wired networks do not work
    in combined mode. After configuring Wi-Fi you will need to remove your wired connection
    and reboot the Raspberry Pi. This will configure the wireless interface correctly.
    Connecting the wired connection usually drops the wireless connection after the
    Raspberry Pi has been booted.


    # Setting up from a desktop


    Using the Wi-Fi configuration tool found in the menu bar while you''re on the
    desktop is the most convenient way to connect to your wireless within seconds.
    It is recommended that you start with this if you have just installed Raspbian
    and plan on using Wi-Fi instead of an Ethernet connection. Your SSID, which is
    the readable name of your wireless access point, has to be broadcasted by your
    router for this to work. If you have it hidden, you should use the console method
    instead. Follow these steps to set up a desktop:


    +   1. Left-click on the network icon found at the end of the menu bar on the
    right-hand side.

    +   2. All unhidden networks will be displayed.

    +   3. Left-click on the network you would like to connect to.

    +   4. Enter your password and click on OK.

    +   5. After a few seconds, the icon will stop flashing.

    +   6. You can right-click on the network icon to adjust the network settings.


    # Setting up from a console


    If you plan to run your Raspberry Pi in headless mode (where you do not have a
    monitor or the keyboard connected), you do not need to access the desktop by default,
    and you also cannot use the desktop network utility.


    In the latest distributions of Raspbian, the SSH service is enabled by default,
    and you can SSH into your Raspberry Pi. If you have just joined your Wi-Fi network,
    you can tweak its settings. This is intended when you use Ethernet in order to
    set up the Wi-Fi. You can now log in via the SSH, and enter the following command:


    ```

    sudo nano /etc/network/interfaces

    ```'
  merge: -1
  img_proc: true
- pgno: 41
  md: "This will open the included file editor, called nano, and present you with\
    \ your current interface configuration. We are interested in the last few lines.\
    \ If you do not see some of the lines, you can type them in manually:\n\n```\n\
    auto lo\n\niface lo inet loopback\niface eth0 inet dhcp\n\nallow-hotplug wlan0\n\
    auto wlan0\n\niface wlan0 inet dhcp\n    wpa-ssid \"ssid\"\n    wpa-psk \"yourpassword\"\
    \n```\n\nTo save the file, press CTRL + X, followed by Y, and finish by pressing\
    \ Enter.\n\nThe allow-hotplug command will do as its name suggests: it allows\
    \ you to plug wireless adapters in and out assigned to the wlan0 interface. Auto\
    \ wlan0 tells Raspbian to configure the interface automatically based on the settings\
    \ you provide.\n\nWe need to replace SSID and the password with the details of\
    \ your router, keeping the text enclosed within quotation marks. This is the most\
    \ basic configuration that can be used.\n\nThere is one problem with this configuration,\
    \ though: if the wireless disconnects from your router, the interface will not\
    \ be brought back up automatically. There are many scripts that try to solve this\
    \ problem. The configuration requires that you know extra details about the wireless\
    \ configuration. The next section offers a fully automatic way to do this. We\
    \ will use wpa-supplicant, which is now installed by default with Raspbian. In\
    \ /etc/network/interfaces, we change the last few lines to the following:\n\n\
    ```\nallow-hotplug wlan0\niface wlan0 inet manual\nwpa-roam /etc/wpa_supplicant/wpa_supplicant.conf\n\
    iface default inet dhcp\n```\n\nWe need to go to the /etc/wpa_supplicant directory,\
    \ create the file, and edit wpa_supplicant.conf:\n\n```\nsudo touch wpa_supplication.conf\n\
    nano wpa_supplication.conf\n```"
  merge: -1
  img_proc: true
- pgno: 42
  md: "# Downloading the example code\n\nYou can download the example code files for\
    \ this book from your account at http://www.packtpub.com. If you purchased this\
    \ book elsewhere, you can visit http://www.packtpub.com/support and register to\
    \ have the files e-mailed directly to you.\n\nYou can download the code files\
    \ by following these steps:\n\n+   - Log in or register to our website using your\
    \ e-mail address and password.\n+   - Hover the mouse pointer on the **SUPPORT**\
    \ tab at the top.\n+   - Click on **Code Downloads & Errata**.\n+   - Enter the\
    \ name of the book in the **Search** box.\n+   - Select the book for which you're\
    \ looking to download the code files.\n+   - Choose from the drop-down menu where\
    \ you purchased this book from.\n+   - Click on **Code Download**.\n\n![](img/a8753cacc9d454dfc09eda1ed5012bd3_42_0.png)\n\
    \nYou can also download the code files by clicking on the **Code Files** button\
    \ on the book's webpage at the Packt Publishing website. This page can be accessed\
    \ by entering the book's name in the **Search** box. Please note that you need\
    \ to be logged in to your Packt account.\n\nOnce the file is downloaded, please\
    \ make sure that you unzip or extract the folder using the latest version of:\n\
    \n+   - WinRAR / 7-Zip for Windows\n+   - Zipeg / iZip / UnRarX for Mac\n+   -\
    \ 7-Zip / PeaZip for Linux\n\nIn nano, a simple text editor, we need to type the\
    \ following:\n\n```\n```\nctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev\n\
    update_config=1\n\nnetwork={\n    ssid=\"ssid\"\n    proto=WPA RSN\n    key_mgmt=WPA-PSK\n\
    \    pairwise=CCMP TKIP\n    group=CCMP TKIP\n    psk=\"password\"\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 43
  md: 'The configuration file contains some extra details about the connection. The
    way the supplicant works is that it will try to connect using the defined parameters
    for proto, pairwise, and group. You might have to adjust key_mgmt, but WPA-PSK
    is the most common configuration for modern wireless routers.


    This method will also allow you to connect to your router if it does not broadcast
    its SSID.


    > It is a common misconception that disabling the SSID broadcast protects your
    network. There are tools that can still find SSID names using normal wireless
    cards without any effort, even though you have turned this off. The best security
    is to use the latest encryption protocol and a complex password.


    # Using wicd-curses


    Using the wicd-curses package is a simpler way of setting up wireless and even
    wired interfaces in the console. The package allows you to edit advanced options
    such as a static IP, DNS, and hostnames. A daemon also runs in the background,
    which automatically reconnects the interface if the wireless signal drops out
    and is a more reliable way of maintaining a wireless network in poor signal areas.
    To use this package, you should comment out any settings in the wpa_supplicant
    interfaces file:


    > Installing this package will install many other dependency packages and can
    take up in excess of 8 MB of extra space. Some sources also claim that running
    this daemon uses more overhead, but this sounds like a fair price to pay for ease
    of use and reliability, especially with Raspberry Pi 2.


    ```

    ```

    sudo apt-get install wicd-curses

    sudo wicd-curses

    ```

    ```


    You will get a console screen with a list of available wireless access points.
    Use the cursor keys to select your access point, and press the right arrow key
    to edit its properties.


    > If you see the message that no wireless networks were detected, try to open
    the preferences window by pressing P, and type wlan0 in the wireless interface
    field.


    Once you are in the configuring preferences screen for wireless networks, you
    would only need to enter your password in the key field. Save the settings by
    pressing F10.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'If you set up the wireless connection using a wired connection, you will need
    to press C, which will connect to the access point. Keep an eye on the status
    LED on your Wi-Fi (if it has one). You should see it start to flicker, and after
    a few seconds, it should become solid, which means a connection has been established.
    At this point, it is highly likely that the SSH session will be dropped because
    the wired connection gets disabled. You should unplug the wired connection and
    reconnect using the wireless IP or hostname.


    > You can find the wireless IP by logging into your router via the web interface
    and looking at the DHCP list.


    # A static network address


    Some DHCP servers on routers tend to change your private address every now and
    then. Setting a static private address is a quick way to prevent this from happening,
    and it is easier to remember what the IP address is.


    However, many newer routers have the ability to assign a preferred IP address
    in the DHCP settings or will automatically assign a long-term IP to the device
    based on its MAC address. A long-term IP usually means that the router is reset
    to factory defaults or it will run out of IP addresses and replace the oldest
    entry in the DHCP list.


    The downfall of using static addresses with most home routers is that the router
    might not know about this device. The reason for this is because it would have
    to scan the entire network endlessly, thus taking up valuable resources. If the
    DNS service does not advertise the IP address of the Raspberry Pi, you will not
    be able to use its hostname (which is, by default, `raspberry`), and instead,
    you will have to type in the full IP address. Furthermore, if you want to use
    your Raspberry Pi as a media center, it will take much longer or may even not
    show up in the network list. Worst of all, some routers will not allow you to
    forward ports to your Raspberry Pi if it is not in the DHCP client list.


    It is good practice to always have a DHCP server control that''s assigned IP addresses
    on the network so that the DNS server running beside it can work properly. Assigning
    a static IP address is easy with `wicd-curses`, but you could disable DHCP and
    DNS on your router and use your Raspberry Pi as a separate firewall, DHCP, and
    DNS server.


    Setting up your own DHCP and DNS is not covered in this book as the topic itself
    could span several chapters depending on your needs.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Testing and benchmarking your network


    These are essential tests that can be carried out to troubleshoot network problems.

    You can also use some of these advanced techniques to benchmark your network.


    # Basic tests


    The simplest way to check whether you are connected to the Internet is to ping
    a remote address.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_45_0.png)


    > The following tests were carried out over Wi-Fi to not only test the reliability
    of the Wi-Fi connection but to also achieve the best stability; it is always recommended
    that you use an Ethernet connection. These examples demonstrate the various bottlenecks
    that you may encounter when using Wi-Fi.


    We can ping http://www.google.com, but we can also use shorthand and an easy-to-remember
    IP address, such as 8.8.8.8, which is Google''s public DNS server. This IP address
    will resolve to the nearest Google DNS server in your area, and even if it goes
    down, there are many backup servers, making this a reliable test:


    ```

    ping -c 1 google.com

    ping -c 1 8.8.8.8

    ```


    ```

    root@nas:~# ping -c 1 www.google.com

    PING www.google.com (31.55.166.217) 56(84) bytes of data.

    64 bytes from 31.55.166.217: icmp_req=1 ttl=57 time=16.7 ms


    --- www.google.com ping statistics ---

    1 packets transmitted, 1 received, 0% packet loss, time 0ms

    rtt min/avg/max/mdev = 16.720/16.720/16.720/0.000 ms

    root@nas:~#

    root@nas:~#

    root@nas:~# ping -c 1 8.8.8.8

    PING 8.8.8.8 (8.8.8.8) 56(84) bytes of data.

    64 bytes from 8.8.8.8: icmp_req=1 ttl=43 time=31.1 ms


    --- 8.8.8.8 ping statistics ---

    1 packets transmitted, 1 received, 0% packet loss, time 0ms

    rtt min/avg/max/mdev = 31.118/31.118/31.118/0.000 ms

    root@nas:~#

    ```'
  merge: -1
  img_proc: true
- pgno: 46
  md: "A ping can help you determine whether you have access to the Internet. You\
    \ may want to check how fast you can download files to the Raspberry Pi. We will\
    \ use popular website, http://www.speedtest.com, to help us do this directly in\
    \ the command line. This can be represented in one line:\n\n```\nwget --output-document=/dev/null\n\
    \    http://speedtest.wdc01.softlayer.com/downloads/test500.zip\n```\n\nMy Raspberry\
    \ Pi is connected to a fast wireless network connection, which is connected to\
    \ a 75 megabit downstream-capable ISP. In the following screenshot, you can see\
    \ that I've achieved about 4.27 megabytes. This varies greatly from site to site.\
    \ The server used here is in America.\n\n```\nroot@nas:~# wget --output-document=/dev/null\
    \ http://speedtest.wdc01.softlayer.com/downloads/test500.zip\n--2013-09-02 22:38:56--\
    \  http://speedtest.wdc01.softlayer.com/downloads/test500.zip\nResolving speedtest.wdc01.softlayer.com\
    \ (speedtest.wdc01.softlayer.com)... 208.43.102.250\nConnecting to speedtest.wdc01.softlayer.com\
    \ (speedtest.wdc01.softlayer.com)|208.43.102.250|:80... connected.\nHTTP request\
    \ sent, awaiting response... 200 OK\nLength: 524288000 (500M) [application/zip]\n\
    Saving to: '/dev/null'\n\n2% [>                                              \
    \                                           ] 14,135,558  4.27M/s   eta 2m 21s\n\
    ```\n\n# Advanced benchmarking tools\n\nYou may be a bit more serious about the\
    \ performance of your network. Here are a few advanced ways to push your network\
    \ to the maximum.\n\n# A speedtest application\n\nThere is a speed test application\
    \ available on GitHub. It offers more advanced options than the command-line technique\
    \ we used earlier as it automatically picks the nearest server and starts downloading\
    \ a large file from there. The benefit of using the closest server will better\
    \ demonstrate the maximum capacity of your wireless network or your ISP downstream\
    \ using a wired connection.\n\nFurthermore, the application also benchmarks your\
    \ upstream bandwidth. This may be important to you if you were thinking of hosting\
    \ applications for public Internet usage.\n\nWe will need to install git using\
    \ aptitude's package manager. We do this by typing apt-get in the command line:\n\
    \n```\nsudo apt-get install git-core\n```"
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Follow the on-screen instruction to install the git package. Using the /tmp
    directory is ideal for short term applications. This directory in Raspbian is
    cleared out on each reboot or power failure. If you wish to keep the speed test
    application for future use, create a new directory in your home directory and
    update the path appropriately:


    ```

    cd /tmp

    git clone https://github.com/sivel/speedtest-cli.git

    cd speedtest-cli

    ./speedtest_cli.py

    ```


    # iPerf


    iPerf is a network administrator''s secret tool that is included with Raspbian.
    It is a tool that tests a network by creating TCP and UDP streams. iPerf has client
    and server functionality, so it requires another computer, which known as the
    server. This can be another Raspberry Pi or computer that has iPerf installed
    on it.


    This application will push the boundaries of your network interface and architecture.
    You can also use iPerf is to detect packet loss in a complex network, such as
    the Internet. If you have a virtual machine on the Internet, try installing iPerf
    on it and comparing the results of your local network against those found on the
    Internet. Let''s install iPerf on the Raspberry Pi and remote computer:


    ```

    sudo apt-get install iperf

    ```


    The server will be listening for a connections type, so type the following:


    ```

    iperf -s

    ```


    The client will show you all the statistics related to the tests that are carried
    out:


    ```

    iperf -c <ip address of server or domain name of public server>

    ```


    # Recommended bandwidth


    A basic bandwidth of 256 kilobits of an up-and downstream is recommended for low
    use hosting of any kind. You can get away with 64 kilobits for personal use in
    the form of a basic website or the transfer of text data such as JSON.


    It is standard practice for home ISP providers to supply you with a much larger
    downstream bandwidth, and with many countries reclassifying the Internet as a
    public utility, access to it should be faster and easier than before. But there
    is one main difference between home and business packages: it is the upstream
    bandwidth that matters when trying to serve content to users on the Internet.
    Typically, home Internet is only a fraction of the downstream, whereas businesses
    get a larger portion of the upstream, sometimes even equal, by purchasing Synchronous
    DSL (SDSL).'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'If you plan on using VoIP with Asterisk, a small upstream might cause terrible
    delays and jitters. But Asterisk comes licensed with GSM codecs that should work
    with an upstream bandwidth of 64 kilobits for a single call. You may purchase
    closed source codecs that work on much slower connections at the cost of voice
    quality.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_48_0.png)


    # Internet configurations


    There are some obstacles to resolve before you can successfully host any kind
    of Internet application. The solutions are influenced by the package that your
    ISP provides to you, but almost every problem can be worked around.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Home packages


    The most fundamental part of home packages is that you almost always have a dynamic
    IP address. The increasing implementation of IPv6 is meant to eliminate this problem
    by assigning an IPv6 address to all your devices, accessible by anyone that knows
    it, from anywhere in the world. Some ISPs will allow you to upgrade to a static
    IP, but there can still be some limitations. The problem with having a dynamic
    IP is that it may change without notice. So, if you try to access your network
    from the Internet using an IP one day, it will certainly stop working after a
    while. This lease time varies from ISP to ISP because some are as short as a few
    hours, and others can last for years. If you don''t know your current Internet
    IP address while you are in a remote place, finding out what it is can be quite
    inconvenient.


    One of the best known solutions is to use a dynamic DNS service. Many Internet
    routers will have some kind of dynamic DNS setting available, even the one provided
    by your ISP. A dynamic DNS client is a program that automatically updates the
    DNS records of a public domain name. There are a handful of free dynamic DNS services.


    # Business packages


    Business packages will almost always include a static IP address or an option
    to purchase one. This really gets rid a lot of work for workarounds that need
    to be applied with home packages. You can use the IP address provided to you,
    but even on the rarest occasion, it may be changed to another IP; however, you
    will be warned about this in advance.


    The other benefits are that ISPs will allow you to change the reverse DNS lookup
    of your IP, a service that is unavailable with home packages. This service is
    very important if you plan on running a small mail server. This is one of the
    prerequisites that needs to be configured so that other mail domains know who
    you are. The only way to solve this problem at home is to use a paid for mail
    exchange to send and receive e-mails using custom domain names.


    Many business packages offer unlimited and unshaped traffic. ISPs might deliberately
    throttle certain ports on home broadband connections to make them slower and less
    reliable. Some ISPs go to extreme measures and block these ports on home packages;
    for example, ports 25, 80, 110, and 443 are used for mail and web servers.


    If you plan on using the Raspberry Pi for some home experiments, private use,
    or educational purposes, then all you need to do is spend a little extra time
    configuring everything correctly. Be aware, though, that hosting production services
    on a home broadband may be against the terms and conditions of your contract.
    If you anticipate high usage, it is a much better option to purchase a business
    package.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Dynamic DNS


    Dynamic DNS is a way of updating name records for a public DNS. Paid solutions
    usually offer real-time updates and free services have a minimum time before the
    change is published.


    I have been using the paid service by NO-IP, which is fairly priced for the features
    it provides. It also offers free domains and services. It also provides clients
    for many operating systems, including a Raspbian Linux-compatible client. You
    may use any service you like as the protocol is the same for everybody.


    # Installing a client


    I have a premium account registered with NO-IP. I allocated a subdomain called
    pi.kula.solutions. It automatically detected my public IP and set the record of
    the domain accordingly.


    > Visit http://www.mxtoolbox.com to verify live changes to domain name records.
    It also has several other useful tools.


    Once you have created a dynamic DNS account, you can install the client on the
    Raspberry Pi. During the installation, you will be asked for your credentials
    and which domains to update.


    > The make -j4 command speeds up compile time on Raspberry Raspberry Pi 2. If
    you are not using one, do not use -j4.


    The commands to install a client are as follows:


    ```

    ```

    mkdir /home/pi/noip

    cd /home/pi/noip

    wget http://www.no-ip.com/client/linux/noip-duc-linx.tar.gz

    tar vzx f noip-duc-linx-tar.gz

    cd noip-{version}

    sudo make -j4

    sudo make -j4 install

    ```

    ```


    After running the make installation, you will be prompted to log in with your
    No-IP account username and password. The interval must be 5 minutes or more. You
    can now start the service:


    ```

    ```

    sudo /usr/local/bin/noip2

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'You now have a domain name that points to your home IP address. As we progress
    through this book, you might want to test various applications, and to do this,
    you will need to open ports on your router.


    Unfortunately, configuring your router is not part of this book as each vendor
    handles this differently. Consult the manual that came with your router to learn
    how to open and forward ports. Opening unnecessary ports can put you at a higher
    risk of being hacked.


    # The free Dynamic DNS domain workaround


    You might not like the domain names provided by the Dynamic DNS providers, or
    you may not be able to afford a premium service. Instead, you may want to use
    a domain that you already own but is hosted somewhere else. I own another domain
    that is not registered with NO-IP called http://www.piotrkula.com. I will use
    this as an example to access my Raspberry Pi using http://pi.piotrkula.com/ with
    a free NO-IP domain such as http://randomname.no-ip.me.


    Log in to your domain name DNS panel, and add a new subdomain. Edit the DNS records
    and make sure that they have absolutely no A records associated with them. You
    will need to add a new CNAME record and the value; in my case, it is randomname.no-ip.me.


    Now the http://pi.piotrkula.com/ domain tells visitors to take a look at the randomname.no-ip.me
    DNS record instead. The visitor will find an A record at NO-IP, and this will
    tell them the correct IP address, which is your home IP with port 80 forwarded
    to the Raspberry Pi. This is NOT a redirect and the top domain name will NOT change.
    Visitors will not even know you are using a dynamic DNS unless they inspect your
    private domain record and track down that CNAME belongs to a dynamic DNS company.
    But as long as the domain works, there is no reason to inspect it.


    The only drawback of using this workaround is speed. Whenever a visitor looks
    up the DNS records for the first time, it might take several seconds before a
    connection is established. After the first request, things go smoothly as the
    client usually caches the IP for the duration of the session, regardless of what
    TTL is set on your A record. Every new session might experience this delay as
    TTL forces the client to read the DNS again. Some dynamic DNS providers might
    even deliberately slow down DNS lookups in the hope that you will upgrade to premium
    DNS servers for a premium service. As far as I know, NO-IP has never done this
    and performed really fast, even when I used it for free domains.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Summary


    It is important to understand how your networks are configured; this includes
    both the Internet side and your local network. This in-depth understanding will
    surely help you troubleshoot particular problems on your own.


    We now have our Raspberry Pi connected to our private network and configured a
    domain name that can be accessed by anybody on the Internet.


    In the next few chapters, you will learn more about various services that can
    be made available to friends over the Internet.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 3


    # Configuring Extra Features


    There are some extra features on the Broadcom chip that can be used out of the
    box or activated using extra licenses that can be purchased. Many of these features
    are undocumented, and are found by developers or hobbyists working on various
    projects for Raspberry Pi.


    In this chapter, you will learn how to keep Raspberry Pi up to date and also how
    to use the extra features of the GPU.


    # Updating Raspberry Pi


    The Raspberry Pi essentially has three software layers: the closed source GPU
    boot process, the boot loader (also known as the firmware), and the operating
    system. At the time of writing book, we cannot update the GPU code. But maybe,
    one day, Broadcom or hardware hackers will tell us how do to this.


    This leaves us with the firmware and the operating system packages. Broadcom releases
    regular updates for the firmware as precompiled binaries to the Raspberry Pi Foundation,
    which then releases them to the public. The Foundation and other community members
    work on Raspbian, and release updates via the aptitude repository; this is where
    we get all our wonderful applications from.


    It is essential to keep both the firmware and the packages up to date so that
    you can benefit from bug fixes and new or improved functionality from the Broadcom
    chip.


    Raspberry Pi 2 uses ARMv7 as opposed to Pi 1, which uses ARMv6. It is recommended
    to use the latest version of the Raspbian release to benefit from the speed increase.
    Thanks to the upgrade to ARMv7, it now also supports the standard Debian Hard
    Float packages and other ARMv7 operating systems, such as Windows IoT Core.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Updating the firmware


    Updating the firmware used to be quite an involved process, but thanks to a user
    on GitHub, who goes under the alias Hexxeh, we have some code to automatically
    do this for us. You don''t need to run this as often as `apt-update`, but if you
    constantly upgrade the operating system, you may need to run this if advised or
    if you are experiencing problems with new features or instability.


    The `rpi-update` command is now included as standard in the Raspbian image, and
    we can simply run the following command:


    ```

    sudo rpi-update

    ```


    After the process is complete, you will need to restart your Raspberry Pi in order
    to load the new firmware.


    # Updating packages


    Keeping Raspbian packages up to date is also very important, as many changes might
    work together with the fixes published in the firmware. Firstly, we will update
    the source list, which downloads a list of packages and their versions to the
    aptitude cache. Then, we will run the `upgrade` command, which will compare the
    packages that are already installed and also compare their dependencies, and then
    download and update them accordingly:


    ```

    sudo apt-get update

    ```


    ```

    sudo apt-get upgrade

    ```


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_54_0.png)


    > Updating some packages might break your existing custom code or applications
    if there are major changes in the libraries. If you are running custom code, you
    should always check the release notes if you need to change anything in your code
    before updating.


    # Updating distribution


    We may find that running the firmware update process and package updates does
    not always solve a particular problem.


    If you are using a release such as `debian-armhf`, you can use the following commands
    without the need to set everything up again:


    ```

    sudo apt-get dist-upgrade

    ```


    ```

    sudo apt-get install raspberrypi-ui-mods

    ```'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Outcomes


    If you have a long-term or production project that will be running independently,
    it is not a good idea to log in from time to time to update the packages. With
    Linux, it is acceptable to configure your system and let it run for long periods
    of time without any software maintenance. You should be aware of critical updates
    though, and you should evaluate if you need to install them. For example, consider
    the major Heartbleed vulnerability in SSH. If you had a Raspberry Pi directly
    connected to the public Internet, this would require instant action.


    Windows users are conditioned to be updated frequently, and it is very rare that
    something will go wrong. But on Linux, running updates will update your software
    and operating system components, which could cause incompatibilities with other
    custom software. For example, you used an open source CMS web application to host
    some of your articles. It was specifically designed for PHP version x, but upgrading
    to version y also requires the entire CMS system to be upgraded. Sometimes, less
    popular open source sources may take several months before the code gets refactored
    to work with the latest PHP version, and consequently, they may unknowingly upgrade
    to the latest PHP or may partially break your CMS.


    One way to try and work around this is to clone your SD card and perform the updates
    on one card. If you encounter any issues, you can easily go back and use the other
    SD card.


    A distribution called CentOS tries to deal with this problem by releasing updates
    once a year. This is intended to make sure that everybody has enough time to test
    their software before you can do a full update with minimal or even no breaking
    changes. Unfortunately, CentOS has no ARM support, but you could follow this guideline
    by updating packages when you need them.


    # Hardware watchdog


    A hardware watchdog is a digital clock that needs to be regularly restarted before
    it reaches a certain time.


    Just like in the TV series Lost, there is a dead man''s switch hidden on the island
    that needs to be pressed at regular intervals; otherwise, an unknown event will
    begin. In terms of the Broadcom GPU, if the switch is not pressed, it means that
    the system has stopped responding, and the reaction event is to restart Raspberry
    Pi and reload the operating system with the expectation that it will resolve the
    issue, at least temporarily.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Raspbian has a kernel module included — which is disabled by default — that
    deals with the watchdog hardware. A configurable daemon that runs on the software
    layer sends regular events (like pressing a button), referred to as a heartbeat
    to the watchdog, via the kernel module.


    # Enabling the watchdog and daemon


    To get everything up and running, we need to do a few things, as follows:


    +   1. Add the following in the console:

    +   ```

    +   sudo modprobe bcm2708_wdog

    +   sudo vi /etc/modules

    +   ```

    +   2. Type the line of text bcm2708_wdog to the file. Then, save and exit by
    pressing Esc and typing :wq command.

    +   3. Next, we need to install the daemon that will send the heartbeat signals
    every 10 seconds. We use chkconfig, add it to the startup process, and then enable
    it, as follows:

    +   ```

    +   sudo apt-get install watchdog chkconfig

    +   sudo chkconfig --add watchdog

    +   chkconfig watchdog on

    +   ```

    +   4. We can now configure the daemon to do simple checks. Edit the following
    file:

    +   ```

    +   sudo vi /etc/watchdog.conf

    +   ```

    +   5. Uncomment the lines max-load-1 = 24 and watchdog-device by removing the
    hash (#) character. The max load means that it will take 24 Pi''s to complete
    the task in 1 minute. In normal usage, this should never happen and would only
    really occur when the Raspberry Pi has hung.

    +   6. You can now start the watchdog with which configuration. Each time you
    change something, you will need to restart the watchdog:

    +   ```

    +   sudo /etc/init.d/watchdog start

    +   ```


    There are some other examples in the configuration file that may be of interest.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Testing the watchdog


    In Linux, you can easily place a function into a separate thread that runs in
    a new process using the & character on the command line. Exploiting this feature
    together with some anonymous functions, we can issue a very crude but effective
    system halt. This is a quick way to test whether the watchdog daemon is working
    correctly, and it should not be used to halt the Raspberry Pi. It is known as
    a fork bomb, and many operating systems are susceptible to this.


    The random-looking series of characters are actually anonymous functions that
    create other new anonymous function. This is an endless and uncontrollable loop.
    It most likely adopted the name bomb, because once it starts, it cannot be stopped.
    Even if you try to kill the original thread, it creates several new threads that
    need to be killed. It is just impossible to stop, and eventually, it bombs the
    system into a critical state, also known as a stack overflow. Type these characters
    into the command line and press Enter:


    ```

    : () { : | : & } ; :

    ```


    After you press Enter, the Raspberry Pi should restart after about 30 seconds,
    but it might take up to a minute.


    # Enabling extra decoders


    The Broadcom chip actually has extra hardware for encoding and decoding a few
    other well-known formats. The Raspberry Pi Foundation did not include these licenses
    because they wanted to keep the costs down to a minimum, but they have included
    the H.264 license. This allows you to watch HD media on your TV, use the webcam
    module, or transcode media files.


    They did provide a way for users to buy separate licenses if you want to use these
    extra encoders or decoders.


    At the time of writing, the only project to use these hardware codecs was the
    OMXPlayer project maintained by XBMC. The latest Raspbian package has the omx
    package included.


    # Buying licenses


    You can go to http://www.raspberrypi.com/license-keys/ to buy licenses, which
    can be used once per device. Follow the instructions on the website to get your
    license key.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# MPEG-2


    Known as H.222/H.262, it is the standard of video and audio encoding widely used
    by digital television, cable, and satellite TV. It is also the format used to
    store video and audio data on DVDs.


    This means that watching DVDs from a USB DVD-ROM drive should be possible without
    any CPU overhead whatsoever. Unfortunately, there are no packages that use this
    hardware directly. But hopefully, in the near future, it will be as simple as
    buying this license, which will allow us to watch DVDs or stream videos in this
    format with ease.


    # VC-1


    VC-1 was formally known as SMPTE 421M and was developed by Microsoft. Today, it
    is the official video format used in the Xbox and Silverlight framework. The format
    is supported by HD-DVD and Blu-ray players.


    The only use for this codec would be to watch Silverlight-packaged media; its
    popularity has grown over the years, but it still not very popular. This codec
    may need to be purchased if you would like to stream videos using the Windows
    10 IoT API.


    # Hardware monitoring


    The Raspberry Pi Foundation provides a tool called vcgencmd, which gives you detailed
    data about various hardware used in the Raspberry Pi. This tool is updated from
    time to time and can be used to log the temperature of the GPU, voltage levels,
    processor frequencies, and so on. Some commands for monitoring are as follows:


    +   - To see a list of supported commands, we type the following in the console:

    +     `vcgencmd commands`

    +   - As newer versions are released, there will be more commands available here.
    To check the current GPU temperature, we will use the following command:

    +     `vcgencmd measure_temp`

    +   - We can use the following command to check how RAM is split between the CPU
    and GPU:

    +     `vcgencmd get_mem arm/gpu`

    +   - To check the firmware version, we can use the following command:

    +     `vcgencmd version`'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The output of all these commands is a simple text that can be parsed and displayed
    on a website or stored in a database.


    # Summary


    Raspberry Pi has a very capable GPU and ARM System on Chip (SOC) with features
    that might not have been disclosed or discovered yet. Open development is slowed
    down by the fact that Broadcom is keeping many aspects closed source; and even
    if somebody gets a peek at some source code, they enforce strict nondisclosure
    terms and conditions. Raspbian has had a few years to mature and many improvements
    have been developed since the initial release of the hardware. There is still
    a strong hype around Raspberry Pi, which has brought you, me, and thousands of
    people to this hack space.


    This chapter''s intention was to teach you about how hardware relies on good software,
    but most importantly to show you how to use leverage hardware using ready-made
    software packages.


    In the next chapter, we will look at how to configure a web server and a database.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_59_0.png)


    For reference, you can visit the following link:

    http://www.elinux.org/RPI_vcgencmd_usage'
  merge: -1
