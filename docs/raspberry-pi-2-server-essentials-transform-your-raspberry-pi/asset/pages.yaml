- pgno: 101
  md: 'If you get a response from the version command line, then you now have Java
    Hard-Float installed on your Raspberry Pi.


    # Installing the Minecraft server


    Minecraft servers are actively developed by various crowds, and there are many
    configurations to choose from. Spigot is a high performance Minecraft server implementation,
    and we can install it with the following command:


    ```

    cd /home/pi

    sudo wget http://ci.md-5.net/job/Spigot/lastStableBuild /artifact/Spigot-Server/target/spigot.jar

    ```


    ```

    # This is the command line use on Pi 2 1GB ram

    sudo /opt/jdk1.8.0/bin/java -Xms512M -Xmx992M -jar /home/pi/spigot.jar nogui

    ```


    ```

    #This is the command line use on Model B with 512 ram

    sudo /opt/jdk1.8.0/bin/java -Xms256M -Xmx496M -jar /home/pi/spigot.jar nogui

    ```


    It takes about 10 minutes to start up for the first time. Once it is ready, you
    can log on locally from another machine and explore your new world. You should
    exit shortly and configure the server for performance.


    # Configuring Minecraft


    To allow players from the Internet to connect, you will need to open and forward
    the port called 25565 to the Raspberry Pi from your router.


    These are the settings that seem to be best for running on the Raspberry Pi. You
    can adjust them as you go along:


    ```

    server-name=Raspberry Picraft!

    motd=Pie is Delicious

    allow-flight=false

    spawn-monsters=true

    generate-structures=true

    enable-query=false

    enable-rcon=false

    level-name=world

    spawn-protection=16

    online-mode=true

