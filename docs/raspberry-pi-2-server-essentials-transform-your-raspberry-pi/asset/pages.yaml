- pgno: 17
  md: '# Preface


    The purpose of this book is to get you started with Raspberry Pi, but this book
    has chapters focused on Raspberry Pi 2. The main goal here is to get your projects
    started with some solid hardware and programming tips, which are essential.


    # What this book covers


    Chapter 1, Getting Started with the Raspberry Pi, will cover the basic equipment
    that we need to use with this book. We will have to look into other peripherals
    that we have bought to see how the Raspberry works. We will then see how to flash
    the newest Raspbian image to our SD card.


    Chapter 2, Preparing a Network, will illustrate how to set up LAN and a wireless
    connection to our network to connect to the Internet. We will set some network
    benchmarks and understand some of its limitations. We will also look into Dynamic
    DNS hosting.


    Chapter 3, Configuring Extra Features, will illustrate how to update the software
    and firmware of Raspberry Pi. You will learn about the watchdog and understand
    how to buy extra decoder licenses.


    Chapter 4, Using Fast Web Servers and Databases, will illustrate how to set up
    a quick web server using nginx with PHP, and we can decide whether we want to
    use MySQL or SQLite.


    Chapter 5, Setting Up the Raspberry Pi as a File Server, will illustrate how to
    attach and format a USB storage medium. We will not only look into the various
    ways of sending data to Raspberry Pi, but we will also understand how to share
    media on the network. As an extra task, we will look into creating the hardware
    RAID!'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Chapter 6, Setting Up Game Servers, will explore open source game engines that
    are available on the repository. We will also have a sneak peek at the Jessie
    repository, which is in beta testing.


    Chapter 7, Streaming Live HD Video, will explore the camera module and illustrate
    a simple technique to stream a video. This chapter contains exclusive streaming
    tutorials.


    Chapter 8, Setting Up the Pi as a Media Center Server, will illustrate how to
    connect an HD monitor and play some videos that were recorded or stored earlier.
    We will also look into OSMC, and we will explore the benefits of running it as
    a dedicated media player.


    Chapter 9, Running Your Pi from a Battery''s Power Source, will explain the benefits
    of various types of battery technology and how to get the best performance without
    spending too much money.


    Chapter 10, Windows IoT Core, is finally available on the embedded ARM, and it
    will explore the capabilities of running IoT as an Operating System with a basic
    programming tutorial with C#.


    Chapter 11, Running Your ownCloud, will discuss how to install the ownCloud software
    on your Pi, and it will free you from privately owned services.


    Chapter 12, The Internet of Things – Sensors in the Cloud, is more of a case study
    about how to complete your projects by storing accurate data accessible anywhere
    in the cloud.


    # What you need for this book


    You need at least a Raspberry Pi 2 with a recommended 8 GB SD card, 1 amp micro
    USB power supply, and a network cable connected to a router with the Internet.


    # Who this book is for


    Seeking inspiration for some new tech projects? Want to get more from your Raspberry
    Pi? This book has been created especially for you!


    # Conventions


    In this book, you will find a number of text styles that distinguish between different
    kinds of information. Here are some examples of these styles and an explanation
    of their meaning.'
  merge: -1
  img_proc: true
