- pgno: 61
  md: '# 4


    # Using Fast Web Servers

    and Databases


    Raspberry Pi 2 is even better at working as a webserver now, thanks to its quad
    core architecture. Everything described in this chapter is still compatible with
    Raspberry Pi 1, but any performance tests run here are strictly for Raspberry
    Pi 2. The following topics will be covered in the chapter:


    +   - Apache versus nginx versus Kestrel

    +   - Extra frameworks for nginx

    +   - Installing a database


    # Apache versus nginx versus Kestrel


    With the release of .NET 5, Microsoft has managed to bring a full stack of C#
    deployment targets to Linux. ASP web applications, such as the popular ASP.MVC,
    can be hosted on Linux by using Kestrel, a development web server based on libuv.
    Libuv was primarily developed for use by Node.js and focuses on asynchronous input/output.


    Nginx is still the first choice in embedded devices for managing HTTP traffic
    as an extremely fast and lightweight reverse proxy server, ahead of Apache.


    Apache remains one of the more popular HTTP servers due to the fact that it comes
    bundled with images, but is also extremely easy to install and configure. However,
    it is typically used on full desktop machines or servers because it requires a
    lot of resources. It is not recommended to use Apache on a Raspberry Pi or other
    embedded device, and it will not be covered in this book.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'From the Netcraft report, we can see that the three top servers are Apache,
    Microsoft, and nginx. Microsoft has been struggling to overtake Apache, but in
    August 2014, for the very first time in the last 10 years, they managed to secure
    the first place for a month. This was most likely caused by the fact that ASP.NET
    5 was released in beta version 1 and millions of developers rushed in to test
    ASP.NET on Linux, Macintosh, and Windows.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_62_0.png)


    To achieve full flexibility, we will configure nginx as the frontend HTTP Proxy,
    which will allow us to run various combinations of programming languages in tandem.
    Nginx will allow us to host production-ready servers. There are almost no limits
    with nginx for hosting websites, and in this chapter, I will demonstrate some
    of the most popular ones. Nginx on its own is excellent for serving up static
    files, such as HTML, JavaScript, or Images.


    # Installing nginx


    The easiest way to install nginx is to use apt-get. Unfortunately, the wheezy
    repository only has the version 1.2 package:


    ```

    sudo apt-get update

    sudo apt-get install nginx

    ```


    > To upgrade to a later version of nginx, follow the instructions for selective
    upgrades in Chapter 6, Setting Up Game Servers. Then, reinstall nginx with the
    -t jessie switch.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'By default, nginx serves pages from /usr/share/nginx/www, but most Linux admins
    tend to be more familiar with the location /var/www . It does not matter where
    you keep the files as long as you choose a convention and stick with it. We will
    use /var/www in this chapter:


    ```

    sudo mkdir /var/www

    ```


    Inside this directory, we will create more directories that will hold various
    virtual hosts. Virtual hosts are domain names (known as server blocks in nginx),
    which tell the webserver about the configuration for that requested domain or
    subdomain. We will initially create a directory called html and a directory named
    web that will hold static files, but will add new location blocks later, known
    as virtual directories:


    ```

    sudo mkdir /var/www/html

    ```


    ```

    sudo mkdir /var/www/html/web

    ```


    # Configuring the nginx virtual hosts


    A virtual host in nginx is a set of rules called server blocks, which specify
    how to serve HTTP traffic for a specified domain. In our configuration, we will
    serve content to any domain on port 80. You may have many virtual hosts to serve
    different domains or subdomains using separate server blocks with specific domain
    names. This requires some more configuration and is not covered in this book.


    Nginx uses the directory /etc/nginx/sites-available/ to store configuration files
    for virtual hosts. On starting up, it will check another directory, /etc/nginx/sites-enabled/,
    and usually these files are symbolic links to the configuration files in sites-available.
    If a file exists there, it will load the configuration file.


    There should be a file called default, which is the default website that nginx
    serves. We will remove the symbolic link of the default website, create a new
    configuration file and symbolic link, and finally, restart nginx:


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_63_0.png)


    > We will use the symbolic name nginxhtml, but feel free to use any name you like
    for the virtual host.


    ```

    sudo service nginx stop

    ```


    ```

    sudo unlink /etc/nginx/sites-enabled/default

    ```


    ```

    sudo touch /etc/nginx/sites-available/nginxhtml

    ```'
  merge: -1
  img_proc: true
- pgno: 64
  md: "Edit the configuration file found at `/etc/nginx/sites-available/nginxhtml`\
    \ and add the following to it:\n\n```\nserver {\n    listen 80 default_server;\n\
    \n    location / {\n        root /var/www/html/web;\n        index index.html;\n\
    \    }\n}\n```\n\nThis is the most basic configuration to serve up standard static\
    \ files for any browser. This will be enough for us to use jQuery to run a client-side\
    \ script, which will use AJAX requests to our APIs created later in this chapter.\
    \ Let's enable the website:\n\n```\ncd /etc/nginx/sites-enabled\nsudo ln -s /etc/nginx/sites-available/nginxhtml\n\
    sudo service nginx start\n```\n\nTo start serving up basic pages, follow these\
    \ steps:\n\n+   1. Create a filename called `index.html` in the `/var/www directory`.\n\
    +   2. Place some basic HTML markup into it (check the code folder for a complete\
    \ sample file with the jQuery download instructions and examples of calling the\
    \ various APIs we will create).\n+   3. Use a browser on another computer on your\
    \ network that can access your Raspberry Pi and type the address `http://rapsberrypi`\
    \ or `http://your.pi.ip.address`.\n+   4. You should see your basic webpage now.\n\
    \nWe should reload nginx after each configuration change by typing in the following\
    \ command line:\n\n```\nservice nginx reload.\n```\n\nIf you get `start failed`,\
    \ you can run the next command to test the configuration file, which will display\
    \ any errors with details:\n\n```\nsudo nginx -c /etc/nginx/nginx.conf -t\n```"
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Extra frameworks for nginx


    Now that we have nginx up and running, we have a wide choice of frameworks or
    programming languages that we can use to create programs that will expose APIs
    to our basic HTML page.


    We will leverage the nginx location blocks (virtual directories) to allow us to
    mix and match programming languages to deliver rich content to simple HTML pages
    using jQuery Java Scripting.


    # Python API


    Python comes pre-installed with Raspbian and is the programming language of choice
    for Raspberry Pi. It has a rich library that allows you to access the GPIO and
    other system software, and there is an abundance of documentation available on
    the Internet.


    It is an easy first language to learn, as you can create applications with fewer
    lines of code than in C++ or Java. You need to understand that Python is a programming
    language and not a web content delivery framework. This said, it is still possible
    to deliver web content with Python by writing specific responses. This will allow
    us to leverage the Python programming language to create simple APIs that can
    deliver data to any other software calling the API''s URL.


    # Executing Python


    You can execute any Python script in the terminal, but nginx cannot directly execute
    Python scripts. To fix this, we need to install uWSGI. We will configure a new
    location block that will ask uWSGI to execute Python on behalf of nginx, and the
    resulting text will be sent back to the client. We will use the latest build of
    uWSGI downloaded directly from their website. This will build and place the necessary
    files into the /home/pi directory. It should take about 80 seconds to compile
    on a Raspberry Pi 2:


    ```

    cd /home/pi

    sudo curl http://uwsgi.it/install | bash -s cgi /home/pi/uwsgi

    ```


    This places the uWSGI binary in /home/pi, and we need to create a configuration
    file for uWSGI in that directory. Create a file named uwsgi_config.ini and enter
    the following text:


    ```

    [uwsgi]

    plugins = cgi

    socket = 127.0.0.1:9000

    chdir = /usr/lib/cgi-bin/

    ```'
  merge: -1
  img_proc: true
- pgno: 66
  md: "```\nmodule = pyindex\ncgi=/cgi-bin=/usr/lib/cgi-bin/\ncgi-helper =.py=python\n\
    ```\n\nThe actual Python script files will be located in `/usr/lib/cgi-bin` instead\
    \ of `/var/www/`, as `nginx` doesn't actually execute Python files; it redirects\
    \ execution to `uWSGI`. We also need to map the `nginx` location block `/cgi-bin`\
    \ to `/usr/lib/cgi-bin` inside the `uWSGI` configuration file. We can now start\
    \ the `uWSGI` process with the configuration. This will block your terminal; it\
    \ has to run the whole time for `nginx` to be able to communicate with the daemon.\
    \ Open a new terminal or run it in `screen`:\n\n```\ncd /home/pi\nsudo ./uwsgi\
    \ ./uwsgi_config.ini\n```\n\nNext, we will add a new location block for our default\
    \ server that is purely for Python's execution. This new location block is also\
    \ known as a virtual directory, where every request on the location http://raspberrypi/cgi-bin\
    \ will actually ask `uWSGI` to execute Python files in the `/usr/lib/cgi-bin`\
    \ directory.\n\nAdd the following location block under the previous location block\
    \ in the existing `nginxhtml` file:\n\n```\nlocation / {\n    include uwsgi_params;\n\
    \    uwsgi_modifier1 9;\n    uwsgi_pass 127.0.0.1:9000;\n}\n```\n\nIn `/usr/lib/cgi-bin`,\
    \ we will create a file called `temp.py` that will simply return an HTTP header\
    \ for the browser and the CPU temperature as text. Indentation is important here\
    \ as it defines the function block:\n\n```\n#!/usr/bin/env python\nimport os\n\
    # Return CPU temperature as a character string\ndef getCPUtemperature():\n   \
    \ res = os.popen('vcgencmd measure_temp').readline()\n    return(res.replace(\"\
    temp=\",\"\").replace(\"'C\\n\",\"\"))\n\n#We have to print a valid HTTP header\
    \ first so the browser\n#will know how to decode the data\nprint \"Content-type:\
    \ text/html\\n\\n\"\ntempl=float(getCPUtemperature())\nprint templ\n```"
  merge: -1
  img_proc: true
- pgno: 67
  md: 'One last thing we need to do is make the Python script executable:


    ```

    chmod +x temp.py

    ```


    If you reload the webpage that uses the sample code provided, you should now you
    can see the Raspberry Pi''s temperature refreshed every second in the Python paragraph.
    You can also test it by navigating your browser to http://raspberrypi/cgi-bin/temp.py.


    This is an extremely basic sample of how you could provide data from Python in
    a Web API way. This is not a standard Web API JSON/XML implementation, but it
    is extremely lightweight and fast and an easy way to provide data via HTTP requests.


    # Node.js


    Node.js is a platform built on the Google V8 JavaScript engine that uses event-driven
    and non-blocking I/O.


    It is known as the JavaScript web programming language. On the surface, this is
    true, but deep inside Node.js binary, it uses C/C++ to access the local system
    resources, and then standard modules written in JavaScript (file system, networking
    buffering, cryptography, data streams, and so on) expose APIs from which you can
    then extend your own application with. You will never actually need to write any
    C/C++, and all the packages are provided as JavaScript; this is why Node.js is
    so easy to use and dubbed the JavaScript programming language.


    It is a great runtime environment for Raspberry Pi because it is extremely lightweight
    on resources but optimized to handle hundreds of requests across many node applications.


    # Installing Node.js


    We will use an auto setup script for Node.js. Execute the following command:


    ```

    curl -sL https://deb.nodesource.com/setup | sudo bash -

    ```


    We can now install Node.js from the new repository.


    ```

    sudo apt-get install nodejs

    ```


    Node.js and NPM are now installed. To check whether Node.js is installed correctly,
    you can execute the following command:


    ```

    node --version

    ```


    ```

    npm -version

    ```'
  merge: -1
  img_proc: true
- pgno: 68
  md: "# What is NPM\n\n**NPM stands for Node Package Manager.** You can find many\
    \ ready to use applications and libraries at http://www.npmjs.com. These are ready\
    \ to be installed with a single command line, which is provided at the packages'\
    \ landing page.\n\n> Try and search for Raspberry on the website to find some\
    \ interesting packages made specifically for Raspberry Pi.\n\n# The Node.js server\n\
    \nTypically, you would execute Node.js files using nodejs helloword.js and that\
    \ would run the program without any web capabilities. In order for us to use Node\
    \ JS in a Web API way, we need to create a Node HTTP server, which can then react\
    \ to your Web Requests proxied via Nginx.\n\nAs with all the examples, we want\
    \ nginx to be able to provide a standard and easy way to proxy web requests via\
    \ port 80 into Raspberry Pi's internally running applications. This makes it easy\
    \ to remember URLs and simpler to build frontend pages and offer some security\
    \ if you are going to open your Raspberry Pi to the World Wide Web.\n\nWe will\
    \ add a new location block to the existing file in the /etc/sites-available/nginxhtml\
    \ directory:\n\n> You can run multiple node applications like this by creating\
    \ new location block names (virtual directories) and adjusting the proxy pass\
    \ setting that your node application is bound to.\n\n```\nlocation /node {\n \
    \   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header\
    \ Host $http_host;\n    proxy_set_header X-NginX-Proxy true;\n    proxy_pass http://127.0.0.1:5000;\n\
    \    proxy_redirect off;\n}\n```\n\nWe will install two packages to help get Raspberry\
    \ Pi's voltage settings. Firstly, we will install a package called **express**,\
    \ which will allow us to easily create RESTful APIs, and then a pi-volts module."
  merge: -1
  img_proc: true
- pgno: 69
  md: "The typical approach with packages is to install them in your application directory,\
    \ which is saved in /node_modules and is only accessible by that application.\
    \ We will use the -g switch, which will install the package once into the /usr/lib/node_modules/\
    \ directory, which will be available globally to any node application you create.\
    \ This saves some space on your SD card, but it means that all your applications\
    \ using that global package must use that one specific version of the package.\
    \ You can, however, install packages, such as express globally, and then install\
    \ a small package for just one application, such as pi-volts.\n\nWhenever you\
    \ create a new application directory, you must use npm to initialize the application.\
    \ This creates a configuration file and lets Node.js know that you want to install\
    \ your application-specific packages (non-global) into this directory. A few onscreen\
    \ questions will be displayed; you can just press Enter on all the questions if\
    \ you like. Because nginx does not execute or serve up the raw Node.js files,\
    \ we will keep our naming convention similar to Python. I will demonstrate this\
    \ approach in the next few command lines:\n\n```\nsudo npm install express -g\n\
    cd /usr/lib\nsudo mkdir node_bin\ncd node_bin\nsudo mkdir volts\ncd volts\nnpm\
    \ init\nsudo npm install pi-volts\ntouch index.js\n```\n\nYou have now set up\
    \ the basic framework for your application and installed the pi-volts package\
    \ just for this Node.js application. Edit index.js and insert the following text:\n\
    \n```\nvar http = require('http');\nvar express = require('express');\nvar app\
    \ = express();\nvar volt = require(\"pi-volts\");\n\n// Express route for incoming\
    \ requests (GET)\napp.get('/node/core/voltage/', function(req, res) {\n  res.send(String(volts));\n\
    });\n\n// configure Express to listen on port 5000\napp.listen(5000);\n```"
