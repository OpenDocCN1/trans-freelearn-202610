- pgno: 71
  md: '# Prerequisites for .NET 5


    > Please be aware that the terminology and commands may change as the .NET vNext
    project leads up to version 1. If any commands do not work, please refer to https://github.com/aspnet/home
    for more information.


    ![](img/a8753cacc9d454dfc09eda1ed5012bd3_71_0.png)


    At this point, we can check that Mono has been properly installed by typing in
    the following command:


    ```

    mono --version

    ```


    For Kestrel to work properly, we need to compile Libuv and link the new libraries
    manually:


    ```

    sudo apt-get install automake libtool curl unzip

    wget https://github.com/libuv/libuv/archive/v1.4.2.tar.gz

    sudo tar zxfv v1.4.2.tar.gz -C /usr/local/src

    cd /usr/local/src/libuv-1.4.2

    sudo sh autogen.sh

    sudo ./configure

    sudo make

    sudo make install

    sudo ldconfig

    ```


    .NET 5 for Linux comes with some new terminology, which I will try my best to
    explain:


    DNX is short for Dot Net Execution Environment and is used to bootstrap and execute
    .NET applications. To install DNX, we first need to install DNVM, which stands
    for Dot Net Version Manager.


    DNVM allows you to install various versions of DNX side by side as a way to allow
    applications to run on various versions of .NET 5.


    DNU, which stands for Dot Net Package Updater, essentially provides a way to restore
    NuGet packages on Pi on which the project depends, similar to Node.js NPM.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Installing DNVM, DNU and DNX


    DNVM, DNU, and DNX can be installed using a one-line command on the terminal thanks
    to a script that will execute all the other required operations. Please note that
    the stable uses old command lines: K, KRE, KPM, and KVM. To stay up to date with
    patches, we will use the dev (bleeding edge) branch. These patches remove a lot
    of extra commands that will not be covered here. As soon as version 1 is released,
    please use the stable branch:


    ```

    ```bash

    cd /home/pi

    curl -sSL https://raw.githubusercontent.com/aspnet/Home/dev/dnvminstall.sh | DNX_BRANCH=dev
    sh && source /home/pi/.dnx/dnvm/dnvm.sh

    ```

    ```


    # Installing DNX


    To install the latest version of DNX (.NET 5), which as of writing is Beta4, on
    the dev, we can now just type in the following one-line command:


    ```

    ```bash

    dnvm upgrade

    dnx

    ```

    ```


    Congratulations, you now have .NET 5 installed on your Raspberry Pi!


    # Running the MVC website


    During the previous process, only the .NET 5 runtime environment was installed,
    which allowed for cross-platform execution of the .NET applications.


    To get a quick MVC website running, we will use the examples from the ASPNET Github
    repository. During beta, please make sure you select the correct directory of
    the DNX version that was installed. In the rest of this chapter, we be using the
    v1.0.0-beta4 directories and DNX. When the final is released, it will be known
    as v1.0.0.


    > Please double-check the DNX version and the sample version you are using. A
    mismatched DNX and sample will result in some of the samples failing to run.


    We will clone the main APSNET Home Sample and change into the specific beta directory.
    We will run a package restore in this directory to install all the required dependencies,
    such as Kestrel:'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/a8753cacc9d454dfc09eda1ed5012bd3_73_0.png)


    > DNU restore might take some time to download the required packages for the first
    time. The dnx . kestrel command might also take some time for the first time;
    it will bootstraps and prebuild the MVC website before Kestrel launches and binds
    to a port.


    ```

    cd /var/www

    sudo mkdir dotnet

    cd dotnet

    sudo git clone -b dev https://github.com/aspnet/Home.git

    ```


    The Git clone was executed as the root user, creating all the files in the /Home
    directory as the root. This will cause a problem while restoring packages and
    other strange things may happen. We need to change the user recursively to pi
    on this directory to fix permission problems:


    ```

    sudo chown -R pi /var/www/dotnet/Home

    ```


    We will now restore the required packages from the official stable repository.
    You always need to run this on any new (or sample) project, but it will be a lot
    faster, since the packages are now cached (replace the beta with the DNX version
    you are running):


    ```

    cd /Home/samples/v1.0.0-beta4/ HelloMVC

    dnu restore

    dnx . kestrel

    ```


    The last command uses dnx to launch the MVC website using the configuration specified
    in the configuration file named project.json. The port to which Kestrel binds
    is also defined in the project.json file and is 5004 by default.


    After running dnx . kestrel, your terminal screen will be blocked and will show
    some messages generated by .NET. Once the server has started, a message will be
    displayed telling you that it has started and which port it is bound to. A blinking
    underscore will be visible, until you press Enter to terminate the server.


    Before you press Enter, use a web browser on another computer on your network
    and navigate to http://raspberrypi:5004. You should now see a basic MVC example
    website.


    Go ahead and try to compile the other samples or create your own project using
    the Visual Studio Community edition.'
  merge: -1
