    \ Fixed Flange 之间始终会存在一个很小的间隙。\n\n唯一可以设置的参数是法兰的长度，这包括直的（折叠过来的）部分以及弯曲区域的外侧。\n\n\
    - Open：此类型与 Closed 类型非常相似，但允许设置间隙距离。同样，Hem 的长度包括弯曲区域。因此，更大的间隙会使弯曲半径更大，从而对于任何给定的\
    \ Hem 长度，直线部分会更短，如图 3.17 所示。\n\n请注意，Hems（以及许多其他特征）可以通过双击快速编辑构成它们的參數：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_94_1.png)\n\
    \n图 3.17：Hem 长度包括弯曲区域，因此更大的间隙会减少直线部分的长度\n\n- **Tear Drop**：顾名思义，此选项创建了一个卷起的 Hem，具有形成水滴形状的倾斜直线部分。两个参数决定\
    \ **Tear Drop** Hem 的大小：弯曲的内半径和直线部分的夹角。角度是在 Hem 的直线部分与 **Fixed Flange** 之间测量的，必须在\
    \ 180 到 270° 之间。尝试调整角度，注意 Hem 边缘与 **Fixed Flange** 之间的间隙保持不变时，直线部分的长度会自动调整。\n\
    - **Rolled**：Hem 的最后一种类型与 **Tear Drop** 选项非常相似，但只是去除了材料的直线部分。**Rolled** 选项也由弯曲的内半径和角度控制，但在此情况下可以设置任何角度。但是，请注意，虽然可以使用大角度，但超过约\
    \ 300° 的角度可能会导致 Hem 的材料与其自身发生碰撞，这可能会导致制造问题。\n\n6. 与许多其他 **Sheet Metal** 工具类似，如果需要，我们还可以为\
    \ **Hem** 特征调整 **Custom Bend Allowance** 和 **Custom Relief Type** 值。\n\n**Hems**\
    \ 是一种非常有用的小特征，主要用于改善边缘并增加强度。有四种类型，并且都可以以与其它法兰类似的方式添加到多个边缘。现在，我们将介绍 **Sketched\
    \ Bends** 特征，它允许我们使用草图线在板材上的任何位置添加弯曲。\n\n## Adding Sketched Bends\n\n除了在现有边缘添加弯曲外，我们还可以使用草图来精确定义弯曲的位置：\n\
    \n- 1. 打开上一节中的 **Base Flange** *part* 并删除任何额外的法兰、切割或凸片，以便仅保留 **Base Flange**。或者，您可以开始一个新的\
    \ *part* 文档并创建一个尺寸为 200×300mm、厚度为 1mm 的 **Base Flange**。\n- 2. Sketched Bend 从草图开始，因此选择\
    \ **Base Flange** 的顶部面并开始草图。\n\n与许多 SolidWorks 工具一样，也可以先选择 **Sketched Bend** 特征。如果这样做，您将被提示创建或选择用于该特征的草图。\n\
    \n3. 使用 **Line** 工具在 **Base Flange** 的一个角上绘制一条对角线。使该线的每个端点距离 **Base Flange** 的角为\
    \ 100mm，如图 3.18 所示。该线将决定弯曲的位置：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_96_0.png)\n\
    \n图 3.18：添加草图线以定义 Sketched Bend 的位置\n\n4. 从 **Sheet Metal** 选项卡或工具栏中选择 **Sketched\
    \ Bend** 特征。\n\n5. 在 **Property Manager** 中，确保顶部已选中 **Fixed Face** 框（应为蓝色）。Fixed\
    \ Face 是在创建弯曲时不会移动的模型部分。\n\n6. 通过左键单击选择 **Base Flange** 表面的较大区域。应出现黄色预览，显示 **Base\
    \ Flange** 的三角形角沿草图线向上弯曲，如图 3.19 所示。\n\n尝试取消选择 **Fixed Face**，然后选择较小的三角形区域，以查看每次选择之间的差异：\n\
    \n![](img/4e9c736de6bac4449096a7b92c28af4c_97_0.png)\n\n图 3.19：选择较大区域后，较小区域将沿草图线弯曲\n\
    \n- 7. 清除 Fixed Face 选择，然后重新选择 Base Flange 表面的原始较大区域。\n- 8. 可以使用 Property Manager\
    \ 中的值调整弯曲角度，并通过单击 Reverse Direction 框翻转方向。如果需要，还可以调整 Bend Radius 值。\n- 9. 有四种\
    \ Bend Position 选项，都非常容易理解：\n\n  - Bend Centerline：这会将第一个弯曲的中心放置在草图线的位置。\n  -\
    \ Material Inside：这会将整个弯曲法兰放置在草图线在 Fixed Face 上的轮廓内。\n  - Material Outside：这会将弯曲法兰放置在草图线在\
    \ Fixed Face 上的轮廓之外（以便弯曲法兰的内表面与草图线对齐）。但是，部分实际弯曲区域仍可能位于 Fixed Face 上的草图线内。\n  -\
    \ **Bend Outside**：这会将整个弯曲放置在草图线之外。这意味着弯曲法兰将根据 **Bend Radius** 大小从草图线略微偏移。\n\n\
    10. 如果需要，可以设置 **Custom Bend Allowance** 值。使用 **Sketched Bends** 的好处之一是，我们可以确保平坦板材的大小从制造角度来看始终完全正确。如果使用其他工具（如\
    \ **Edge Flanges**）将弯曲添加到 **Base Flange**，则展开板材的大小可能会有所不同，具体取决于弯曲的定义方式。但是，通过使用\
    \ **Sketched Bends**，我们可以始终确保展开板材的大小保持完全相同。\n\n实际上，这通常不是问题，但如果模型的精度至关重要，并且您使用的是非标准的\
    \ Bend Allowances，则应考虑使用 **Sketched Bends** 而不是其他类型的法兰。\n\n11. 按 **OK** 创建 **Sketched\
    \ Bend**。\n\n12. 要编辑 **Sketched Bend** 参数，请在 FeatureManager 设计树中单击 **Sketched\
    \ Bend** 特征并选择 **Edit Feature**。要编辑驱动弯曲的基础草图，请展开 **Sketched Bend** 特征并编辑其中的草图。\n\
    \n**Sketched Bends** 是在没有现有边缘时添加弯曲的绝佳方法，也是精确指定弯曲位置的好方法。以下部分介绍 **Jogs**，它会自动使用两个\
    \ **Sketched Bends** 来偏移法兰。\n\n## Creating and using Jogs\n\n**Jogs** 是一种特殊的折弯形式，使用两个相反的弯曲来偏移板材，形成\
    \ Z 或 S 形。**Jogs** 可用于偏移边缘以使其适合其他零件（例如将盖子的边缘安装在盒子内部），或加固零件的边缘。它们在连接具有平坦外表面的两个板材时也特别有用。*图\
    \ 3.20* 显示了使用 **Jog** 和铆钉连接的两张金属板：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_98_0.png)\n\
    \n图 3.20：Jog 特征用于连接两张板材的示例\n\n"
