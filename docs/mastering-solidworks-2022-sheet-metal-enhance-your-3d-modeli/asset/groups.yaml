    \ | Sketches.\n- 4. Note also that the Flat-Pattern folder at the end of the FeatureManager\
    \ Design Tree is now unsuppressed and so is no longer grayed out (labeled iii\
    \ in Figure 1.23).\n\nUsing the Flatten option essentially unsuppresses (or switches\
    \ on) the Flat-Pattern folder, which flattens the part. If you expand the Flat-Pattern\
    \ folder, then the Flat Pattern feature will be seen, and this contains the bend\
    \ details of the part.\n\n- 5. To unflatten—or fold up—the part, simply click\
    \ the Flatten button on the Sheet Metal tab or toolbar again or click the Flatten\
    \ button that can be seen in the top right of the graphics area (labeled iv in\
    \ Figure 1.23). Note that the part folds up and the Flat-Pattern folder is now\
    \ suppressed (or switched off) again.\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_47_0.png)\n\
    \nFigure 1.23: Flatten option\n\nThe Flatten option is a vital aspect of SolidWorks\
    \ Sheet Metal that allows parts to be unfolded. As we progress through the book\
    \ and learn about the Sheet Metal tools, we will see this option in use in a more\
    \ practical setting.\n\n## A recap of Base Flange options and flattening parts\n\
    \nThere are three types of Base Flange (See Fig. 1.24):\n\n- 1. **Single Closed\
    \ Profile**: This is one of the most basic types of Base Flange and uses one single\
    \ profile that is fully closed, such as a simple rectangle or square. Although\
    \ it is simple, this type of Base Flange is extremely useful and is likely to\
    \ make up the majority of Base Flanges for Sheet Metal parts.\n- 2. **Multiple\
    \ Contained Closed**: Closed profiles can also contain smaller, closed profiles\
    \ such as cutouts and holes. While these types of Base Flanges can be useful in\
    \ certain situations, it is generally better practice to create simple Base Flanges\
    \ using a Single Closed Profile and then add any extra holes, cuts, or details\
    \ as separate features. This makes modification of these features at a later stage\
    \ much easier.\n- 3. **Single Open Contour**: Base Flanges can also be created\
    \ using a collection of single Sketch Entities such as lines, arcs, and splines.\
    \ This type of Base Flange can be useful when creating items such as brackets.\n\
    \n![](img/4e9c736de6bac4449096a7b92c28af4c_48_0.png)\n\nFigure 1.24: Types of\
    \ Base Flange; left to right: Single Closed Profile, Multiple Contained Closed,\
    \ Single Open Contour\n\nFlattening is a vital aspect of SolidWorks Sheet Metal\
    \ and parts with bends can be flattened by simply selecting the Flatten option\
    \ from the Sheet Metal tools. This will unsuppress the Flat-Pattern folder and\
    \ unfold any bends in the part.\n\nSo far in this chapter, we have learned how\
    \ to start Sheet Metal parts and how to create the first feature of most of these\
    \ parts—the Base Flange. We have also looked at how to edit the various Sheet\
    \ Metal properties that are important to those parts. So, now that we have a reasonable\
    \ idea of how to start virtual Sheet Metal parts, we will jump briefly into a\
    \ real-world aspect of sheet metal and take a look at the various sheet metal\
    \ materials available.\n\n## Considerations when selecting sheet metal materials\n\
    \nThere are dozens of types of metal that could be used to create sheet metal\
    \ parts and these all vary in use, physical properties, cost, and availability.\
    \ The following pages will give you an idea of which might be best for your project.\n\
    \nThis section is not an exhaustive list of materials; rather, it is just an overview\
    \ of some of the most common ones that you are likely to encounter. Within these\
    \ materials, there are also many specific grades (sub-types) of metal, each with\
    \ slightly different properties. If in doubt, discuss your needs and budget with\
