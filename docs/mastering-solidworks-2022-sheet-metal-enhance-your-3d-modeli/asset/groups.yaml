    ## 在 SolidWorks 中保存


    请养成定期保存模型的习惯，因为 SolidWorks 在使用过程中偶尔会崩溃。


    我们现在已经创建了一个简单的外壳底座，在下一节中，我们将在此基础上添加更多特征。


    ## 为外壳添加更多细节


    现在我们有了外壳底座的基本结构，我们可以开始添加一些更多特征来扩展其功能。我们将首先在底座的前面上添加一些圆形切口。这些孔可能是用于 LED 指示灯、电缆，甚至可能是通风。


    在 SolidWorks 板金中，我们可以制作圆形切口主要有三种方法：


    - **简单孔**：此工具允许在板材上切割基本圆形。圆的直径使用工具的属性管理器指定，但此工具是三个选项中最不实用的，因为随后需要编辑该特征的草图来指定孔的确切位置。因此，使用另外两个选项之一通常同样快捷。

    - **拉伸切除**：此选项可与 **圆** 工具一起使用来制作圆形孔，但在创建非圆形切口时更有用。这将在本节后面创建矩形开口时详细介绍。

    - **孔向导**：孔向导通常是创建圆形孔的最佳选择，因为它允许从一系列预设尺寸或使用自定义参数指定确切的孔尺寸和类型。然后可以快速添加多个孔，并且在后续阶段对其进行定位和编辑非常容易。


    在上述三个选项中，孔向导通常最适合创建圆形孔，而拉伸切除最适合非圆形切口。简单孔是最不实用的选项。


    继续使用上一节中的底座外壳模型，我们现在可以使用孔向导切割一些孔，然后在本节后面使用拉伸切除制作矩形切口：


    - 1. 选择 **孔向导** 工具。此工具可在 **特征** 选项卡上找到。

    - 2. 首先，设置孔类型和尺寸。有许多选项可供选择，但对于简单的圆形孔，一个不错的选择是 **孔** 类型（右上角按钮 – 见图 13.4）和 **销孔**
    子类型（从下拉菜单中选择）。然后可以从一系列预设尺寸中选择孔直径，或通过在 **显示自定义尺寸** 框中打勾然后添加值来输入确切尺寸。


    在本例中，我创建了一个直径为 20mm 的孔：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_267_0.png)


    图 13.4 – 设置孔类型和尺寸


    在此阶段，我们还可以将端部条件设置为盲孔，深度为 10mm。这将防止孔完全穿透外壳的前后两个面。


    3. 现在孔的细节已指定，我们可以设置其位置。选择孔向导属性管理器顶部的 **位置** 选项卡，然后选择将添加孔的面。在我们的示例中，这将是外壳的前面。


    光标将变为 **点** 工具，孔将在添加点的任何位置放置。向前面添加两个孔，如图 13.5 所示：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_268_0.png)


    图 13.5 – 在外壳前表面添加两个直径 20mm 的孔


    > **使用中心线对齐孔**

    > 使用孔向导（和其他基于草图的特征）时，中心线非常有用。在图 13.5 所示的示例中，在前面垂直边的两个中点之间添加了一条中心线。这样，孔就可以沿着面的垂直中心对齐。


    4. 使用智能尺寸、关系和中心线（如果需要）完全定义孔的位置，然后按 **OK** 添加孔。


    ## 设计意图：在尺寸标注时，以及将孔放置在边缘和弯曲处附近


    在 SolidWorks 中标注尺寸时，始终考虑您的设计意图。例如，在图 13.6 中，考虑我们如何标注这两个孔的尺寸。


    如果两个孔都从外壳的左侧边缘标注尺寸（图 13.6 – 左），然后更改第一个孔的位置，则第二个孔的位置不受影响。


    然而，如果孔相对于彼此标注尺寸（图 13.6 – 右），然后更改第一个孔的位置，则第二个孔也会移动。


    您标注特征和草图的确切方式将取决于您的设计要求，但在建模时请记住这一点。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_269_0.png)


    图 13.6 – 尺寸标注时的设计意图


    5. 在添加了前两个孔之后，我们现在可以创建一个矩形切口。这可能用于容纳诸如 USB 端口之类的东西。在制作这些非圆形形状时，通常最好使用拉伸切除选项。


    首先，在前面开始一个草图，然后绘制切口轮廓，如图 13.7 所示。


    这是使用 **中心矩形** 和 **草图倒角** 来圆角化角部制作的。再次，中心线对于将草图实体与诸如两个孔之类的其他元素对齐非常有用。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_270_0.png)


    图 13.7 – 在前面绘制切口轮廓


    ## 使用外部引用


    如果您正在创建使用现有组件的设计，那么创建一个包含所有零件的 SolidWorks 装配体，然后在装配体内编辑新零件会很有用。


    例如，如果此外壳设计有一个相关的 PCB 模型，那么我们可以创建一个包含外壳和 PCB 文件的装配体。然后，我们可以在装配体内编辑外壳零件，并使用 PCB
    零件来对齐任何切口或其他细节。这意味着如果 PCB 零件以后发生变化，则外壳零件将自动更新以匹配这些变化。


