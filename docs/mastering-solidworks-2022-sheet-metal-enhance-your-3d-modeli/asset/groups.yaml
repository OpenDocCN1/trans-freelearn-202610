    **Smart Dimension** 工具中输入毫米数值后跟 mm。这将自动将毫米值转换为英寸（或您选择的单位类型）。


    ### Terminology


    在整本书中，“sheet metal”（小写）指的是现实世界中通用的行业和制造方法，而“Sheet Metal”（大写）则特指 SolidWorks Sheet
    Metal 模块。


    术语“part”指的是现实生活中的组件或物品，而 *part*（斜体）则特指 SolidWorks *part* 文档。


    ## Introducing Sheet Metal


    钣金零件是指——顾名思义——由金属平板制成的零件。众多不同的制造技术，如弯曲、切割和成型，使这些简单的平板能够转变为复杂的 3D 零件。钣金的流行在现代时代急剧增长，因为它允许设计师和工程师使用广泛可用的材料类型——平板——并使用相对低成本的工具和工艺以工业规模创建复杂产品。


    很可能您在家里、车库或工作场所快速环顾四周，就会发现数十件使用钣金技术制作的物品。这些物品的范围从非常简单的物品，如直角支架，到更复杂的产品，如家具，一直到精细的设计，如计算机或电子外壳。钣金还用于制造飞机零件或汽车车身等非常复杂的物品，尽管最先进的成型零件超出了
    SolidWorks Sheet Metal 的范围。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_22_0.png)


    Figure 1.1: Examples of sheet metal parts


    SolidWorks Sheet Metal 模块的美妙之处在于它允许用户创建这些 3D 形状，然后将其展平为板材，并导出为可用于制造的 **二维 (2D)**
    设计。


    SolidWorks Sheet Metal 的另一个优点是，尽管名称如此，它不必仅用于纯金属零件。Sheet Metal 可用于创建任何类型的可展平 3D
    零件，无论其现实生活中的材料如何。尝试跳出“金属”标题的思维，就能解锁更广泛的用途。例如，Sheet Metal 可用于创建纸板包装。这可以在 3D 中建模，然后在虚拟中展开以便打印，用模切机裁切，然后制成
    3D 盒子。Sheet Metal 甚至可用于创建纸艺折纸艺术品等多样化物品。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_23_0.png)


    Figure 1.2: Sheet Metal isn''t just for metal but any material, such as this cardboard
    packaging


    Sheet Metal 是一套多样化的制造方法，将把您的建模和设计提升到下一个水平。总结如下：


    - Sheet metal uses flat sheets to create 2D or 3D parts.

    - Techniques include cutting, bending, and forming.

    - SolidWorks Sheet Metal parts don''t have to be metal!


    在下一节中，我们将了解如何在 SolidWorks 中通过创建 Base Flange 来实际开始制作 Sheet Metal 零件，该 Base Flange
    将成为这些零件的基础特征。


    ## Creating a Base Flange


    SolidWorks Sheet Metal 零件可以主要通过两种方式开始——要么创建 Base Flange，要么将现有的 3D 零件转换为 Sheet
    Metal 零件。本节将介绍 Base Flanges 的使用，这是开始新 Sheet Metal 零件最简单但也最灵活的方式。


