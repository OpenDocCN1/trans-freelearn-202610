    \ create a **Base Flange** (*Figure 1.22*). It can be seen that although the underlying\
    \ sketch had sharp corners, the actual **Base Flange** feature has automatically\
    \ been created with the bent corners using the **Bend Radius** that was specified\
    \ in the **Sheet Metal** properties:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_46_0.png)\n\
    \nFigure 1.22: Single Open Contour Base Flange\n\n**Using Single Open Contours**\
    \ to create **Base Flanges** can be a good way to simplify the production of parts\
    \ such as simple brackets.\n\nNote that these types of sketches don’t just need\
    \ to use straight lines—they can also use arcs and splines if required.\n\n##\
    \ Flattening parts\n\nNow that we have created a *part* with bends in it, we can\
    \ explore how 3D Sheet Metal *parts* can be flattened. Flattening is one of the\
    \ features of the SolidWorks Sheet Metal module that really does add huge value\
    \ to the design process because it allows *parts* to be accurately converted from\
    \ finished *parts* into a state that can be easily created from sheets of flat\
    \ stock material.\n\nTo flatten Sheet Metal parts:\n\n- 1. From within a Sheet\
    \ Metal part, select the Flatten option from the Sheet Metal tab or toolbar (labeled\
    \ i in Figure 1.23).\n- 2. The part will be unfolded into a flat sheet. Note the\
    \ dotted outline, which indicates the bounding box of the flattened part, and\
    \ the sketch lines, which show the location of Bend Lines (labeled ii in Figure\
