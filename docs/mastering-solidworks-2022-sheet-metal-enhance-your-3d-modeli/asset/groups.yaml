    ## About the author


    Johno Ellison is a UK design engineer who has worked with SolidWorks 3D CAD since
    2006. He has a wide range of product design and engineering experience, covering
    areas including mechanisms, 3D printing, materials selection, and rapid prototyping.


    His online SolidWorks courses have been taken by hundreds of thousands of students
    and he has worked with over 300 clients from all around the world. He holds a
    first-class honors degree in Sustainable Product Design from a top 25 UK university
    and has completed a range of SolidWorks-certified training courses in the UK.
    He also holds two Guinness World Records (Longest Distance covered, and Highest
    Altitude reached), for driving a London Taxi.


    > I would like to thank the entire team at Packt for helping to make this process
    go so smoothly, particularly Adrija for being such a great editor to work with,
    Kaustubh for overseeing the project, and Vaideeshwari Muralikrishnan for initially
    reaching out to me.

    > I''d also like to thank my wife, Lindsay, for listening to me bang on about
    K-factors, and for helping to make sure that everything made sense!


    ## About the reviewer


    **Thomas P. McDunn** is an automation engineer with experience in machine design,
    electronics, and software of all kinds. Tom holds bachelor''s and master''s degrees
    in mechanical engineering. He currently teaches classes and workshops in 3D CAD
    and 3D printing. He practices 3D design for 3D printing with eight of his own
    machines. He also uses 3D CAD design for CNC router projects. Thomas holds a patent
    for an industrial automation controller. He is passionate about computer control
    and robotics and volunteers at the local makerspace. He enjoys helping designers
    gain proficiency in CAD with his workshops and classes. Tom has worked with SolidWorks
    since the 1990s. He was a reviewer of the Packt Publication *Hands-On 3D Modeling
    with SolidWorks.*


