    \ on the **Command Manager** (labeled i in Figure 1.4).\n- 2. Select the **Toolbars**\
    \ sub-option and ensure that there is a check mark next to the **Sheet Metal**\
    \ option.\n\n> **Should You Use the Sheet Metal Toolbar or the Sheet Metal Tab?**\n\
    > By default, the **Sheet Metal** tab and toolbar both contain the same set of\
    \ tools. Either can be used throughout the book and this is a matter of user preference.\n\
    > The **Sheet Metal** tab contains larger, clearer icons, but the toolbar can\
    \ be moved into the **Graphics Area** for easier access to tools.\n\n## Making\
    \ a Base Flange\n\nA **Base Flange** is the first feature of a Sheet Metal part\
    \ and is the simplest way to create new Sheet Metal parts, while also offering\
    \ the most flexibility. This is because once a **Base Flange** has been created,\
    \ additional features such as bends and flanges can be added to build up a 3D\
    \ part in a similar way to standard solid modeling. By contrast, converting existing\
    \ parts to Sheet Metal (as covered later in the book) can limit the type of part\
    \ that can be created and reduce editing options at later stages.\n\nTo actually\
    \ create a **Base Flange**, a profile first needs to be sketched. Various profile\
    \ types can be used, but this section will cover the simplest: a **Single Closed**\
    \ profile.\n\nTo create a **Base Flange**:\n\n- 1. Start a new SolidWorks part.\n\
    - 2. Start a sketch on the appropriate Plane, such as the **Top Plane** (labeled\
    \ i in Figure 1.5).\n- 3. Sketch the **Base Flange** profile. Different profile\
    \ types will be covered later in the chapter, but for now, simply create a closed\
    \ profile, such as a **Center Rectangle** (labeled ii in Figure 1.5).\n- 4. Fully\
    \ Define the profile by using the **Smart Dimension** tool and linking it to the\
    \ **Origin** (labeled iii in Figure 1.5). Make the rectangle 200mm high and 300mm\
    \ wide.\n\n## Fully Defining Sketches\n\nDuring SolidWorks modeling, it is important\
    \ to Fully Define sketches to ensure that the Sketch Entities are fixed and will\
    \ not behave in unexpected ways, such as moving position. Fully Defined Sketch\
    \ Entities will turn black, and when a sketch is Fully Defined, this will be indicated\
    \ in the lower right of the screen (labeled iv in Figure 1.5).\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_27_0.png)\n\
    \nFigure 1.5: Sketching the Base Flange profile\n\n- 5. Exit the sketch (labeled\
    \ v in Figure 1.5).\n- 6. Select the Sheet Metal tab or toolbar and select the\
    \ Base Flange/Tab option—this should be the first icon (labeled i in Figure 1.6).\n\
    - 7. You will be prompted to select a sketch. Select the previous sketch that\
    \ was just drawn and a yellow preview of the Base Flange should appear (see Figure\
    \ 1.6).\n\n# Note\n\nIt is also possible to skip Step 5 and select the Base Flange/Tab\
    \ option directly from within the sketch. In this case, the sketch that is being\
    \ edited will automatically be used.\n\n8. Enter the following settings (these\
    \ will be covered in more detail later in the chapter):\n\n- Thickness: 1mm\n\
    - Bend Allowance: K-Factor, 0.5\n- Auto Relief: Rectangular\n- Ratio:0.5 (labeled\
    \ iii in Figure 1.6)\n\nPress OK (labeled iv in Figure 1.6) and the Base Flange\
    \ feature is created.\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_28_0.png)\n\n\
    Figure 1.6: Creating a Base Flange feature\n\nThe Base Flange feature is now created,\
    \ and Base-Flange1 (note: your number may differ) appears in the FeatureManager\
    \ Design Tree at the left of the screen (labeled i in Figure 1.7). This feature\
    \ can be edited and adjusted in the usual way by left-clicking on the feature\
    \ and selecting Edit Feature.\n\nCreating a Base Flange feature turns the entire\
    \ part into a Sheet Metal part and so automatically adds some extra items to the\
    \ FeatureManager Design Tree. These items indicate that a part is a Sheet Metal\
    \ model, and they are made up of the following:\n\n- Sheet-Metal folder: This\
    \ contains all of the global properties of your Sheet Metal part, such as the\
    \ Thickness and the Bend Radius properties (labeled i in Figure 1.7).\n\n- Flat-Pattern\
    \ folder: This folder contains a flattened version of the part (labeled iii in\
    \ Figure 1.7). By default, this folder will be suppressed, so it will appear grayed\
    \ out at this stage, but this will be covered in more detail later in the chapter.\n\
    - Cut list folder: This folder contains all of the separate sheets that make up\
    \ the part. It can be thought of in a similar way to the Solid Bodies folder that\
    \ is used in normal solid modeling\n\nThe number in brackets after the folder\
    \ name indicates how many sheets make up the part. For example, a part with two\
    \ separate body and lid sheets would show (2) after the Cut list folder (labeled\
    \ iv in Figure 1.7).\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_29_0.png)\n\n\
    Figure 1.7: Sheet Metal part details\n\nBase Flanges are usually the best way\
    \ of starting your Sheet Metal parts and are often the first feature created in\
    \ a Sheet Metal part. They can be made by sketching a closed profile, then selecting\
    \ the Base Flange/Tab option from the Sheet Metal tools.\n\nAdding a Base Flange\
    \ feature will turn the part into a Sheet Metal part and will automatically add\
    \ the Flat-Pattern, Cut list, and Sheet-Metal folders, which we will explore more\
    \ in the following section.\n\n> **Saving Parts**\n> At this stage, your current\
    \ *part* can be saved as we will continue using this document throughout the book.\n\
    > \n> When working in SolidWorks, try to get into the habit of regularly saving\
    \ your work, as a safeguard against crashes and other problems.\n\n## Sheet Metal\
    \ properties\n\n**Sheet Metal** properties are global settings that apply to the\
    \ entire *part*. This section shows how to adjust these properties and what they\
    \ actually mean. The section contains some background theory that is fairly dry\
    \ but is an important foundation for understanding Sheet Metal. Some of this underlying\
    \ theory will become much clearer once we actually start to use and demonstrate\
    \ the tools later in the book, so don’t worry too much if certain parts of it\
    \ still appear a little confusing at this stage.\n\nThere are four Sheet Metal\
    \ properties:\n\n- 1. **Sheet Thickness**\n- 2. **Bend Radius**\n- 3. **Bend Allowance**\n\
    - 4. **Auto Relief**\n\n## Editing the Sheet Metal properties and adjusting the\
    \ Sheet Thickness\n\nAs previously mentioned, Sheet Metal *parts* are usually\
    \ made from sheets with a constant thickness. Therefore, the **thickness** of\
    \ a *part* is an important aspect of Sheet Metal.\n\nTo edit the **Sheet Metal**\
    \ properties of a *part*, simply left- or right-click on the Sheet-Metal folder\
    \ in the FeatureManager Design Tree (labeled **ii** in *Figure 1.7*) and select\
    \ **Edit Feature**.\n\nTo set the thickness, adjust the value under the **Thickness**\
    \ field (labeled **i** in *Figure 1.8*) and press the green **OK** check mark.\
    \ For example, try setting 2mm thickness and pressing **OK**. You should now see\
    \ that the thickness of the **Base Flange** has changed from 1mm to 2mm.\n"
