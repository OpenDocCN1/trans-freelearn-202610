    \ (zero point) where all other dimensions on the line will be measured from.\n\
    \n+   3. Select further points in the model to add more dimensions to the line\
    \ (see Figure 4.5). When you have finished placing dimensions, press the Esc key\
    \ to stop placing new dimensions:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_116_0.png)\n\
    \n+   4. If you find that your Ordinate Dimensions become too bunched up, you\
