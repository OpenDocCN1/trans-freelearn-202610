    我们还将介绍 **Flattening** *parts* 并简要了解最常用于钣金的材料。


    到本章结束时，您将了解如何开始 Sheet Metal *parts* 以及如何调整其基本参数，同时对钣金制造和使用也有更广泛的了解。


