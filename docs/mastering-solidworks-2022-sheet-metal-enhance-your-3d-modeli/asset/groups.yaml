    ## Preface


    SolidWorks is the premier software choice for 3D engineering and product design
    applications across a wide range of industries, and the Sheet Metal module makes
    up an important part of this powerful program.


    This book will help you to understand exactly what sheet metal is, why it is used,
    and how you can make the most of this fundamental design technique. You''ll start
    by understanding the foundations of the basic tools, including Base Flanges and
    Sketched Bends, before moving on to more complex features, such as Custom Forming
    Tools and Lofted Bends. The book covers all the necessary tools in a step-by-step
    manner and shares practical manufacturing tips and tricks that will allow you
    to apply the skills that you learn to real-world situations.


    By the end of this book, you''ll understand how to make the best use of the SolidWorks
    Sheet Metal tools and be able to create a whole range of 3D models and designs
    confidently.


    ## Who this book is for


    This book is for existing SolidWorks users who want to expand their skills and
    learn the specialist area of Sheet Metal design. This may be engineers looking
    to upskill, hobbyists wanting to expand their abilities, or simply modeling enthusiasts
    looking to enhance their skills and knowledge.


    ## What this book covers


    Chapter 1, Sheet Metal Basics – Exploring Sheet Metal Properties and Material
    Selection, outlines the various uses of sheet metal and how it can be used in
    SolidWorks. You will learn how to start a Sheet Metal part using the different
    Base Flange types, and how the Sheet Metal properties can be set and modified.
    A basic overview of material selection is also provided.


    *Chapter 2, Adding Bends Using Edge Flanges,* explains how to turn a flat Base
    Flange into a 3D part by adding Edge Flanges – one of the most common building
    blocks of Sheet Metal parts. This chapter also explores the Edge Flange properties
    in more detail, including Flange Profiles, the use of multiple edges, and other
    details.


    *Chapter 3, Getting Familiar with Basic Tools in Sheet Metal,* explains how to
    add and remove material using basic Sheet Metal tools, including Tabs, Cuts and
    Holes. New flange types such as the Miter Flange and Hem are also explained, as
    well Sketched Bends, which can be used to add more unusual bend styles. Finally,
    the Jog feature is explained, both from a theoretical and a practical perspective.


    *Chapter 4, Creating Sheet Metal Drawings and Exporting Files,* explains how to
    create 2D drawings, which are essential if parts are to be manufactured and used
    in the real world, and shows how to create these and how to insert Flat Patterns,
    based on Sheet Metal parts. It also explains the various ways in which Sheet Metal
    parts can be exported for use, such as DXF and DWG file types.


    *Chapter 5, Creating Complex Parts Using Swept Flanges and the Fold/Unfold Tools,*
    explains how and why Swept Flanges can be used. These flanges are similar to Miter
    Flanges but each has a specific use case. It also covers the folding and unfolding
    operations. These are distinct from flattening and unflattening and can be used
    to make specific features, such as cuts across bends.


    *Chapter 6, Utilizing Gussets, Crossbreaks, and Vents to Add Part Details,* explains
    each feature in turn – how to use them and why and where they might be used. Vents
    are another common feature in Sheet Metal parts and are used for a wide variety
    of reasons, including to add cooling and access ports.


    *Chapter 7, Producing Advanced Shapes Using Lofted Bends,* covers Lofted Bends,
    which are an advanced form of bend that can be used to create more complex shapes
    than standard flange types. There are two types of Lofted Bend Formed and Bent
    – and this chapter covers both, including the major differences between the two.


    *Chapter 8, Joining Multi-Sheet Parts Using Tab and Slot Features,* covers The
    Tab and Slot tool, which can be used to simplify the joining of two Sheet Metal
    sheets by creating Tab and Slot features on each. This chapter explains how to
    use the basic tool, and covers the many sub-options in more detail.


    *Chapter 9, Finishing Off Models Using Corner Details,* explains how SolidWorks
    Sheet Metal contains a number of specific corner tools that can be used to create
    many types of corner join, including closing corner gaps between flanges, adding
    welded corners, trimming away sharp edges, and adding corner relief around bend
    areas.


    Chapter 10, Adding 3D Details to Models with Forming Tools, explains how to use
    existing Forming Tools from the SolidWorks Design Library, as well as how to modify
    Forming Tools and how to create and use entirely Custom Forming Tools.


    Chapter 11, Converting to Sheet Metal Using the Insert Bends Tool, covers how
    3D models with a constant wall thickness, such as Shelled or Thin Feature parts
    can be converted into Sheet Metal parts by using the Insert Bends feature. This
    chapter shows how to use this option to create Sheet Metal parts.


    Chapter 12, Building Sheet Metal Parts Using the Convert to Sheet Metal Tool,
    explains how the Convert to Sheet Metal tool can be used with 3D models that don''t
    have a constant wall thickness. The tool is quite versatile and has a number of
    options that are explained in detail here.


    Chapter 13, Practical Example: The Sheet Metal Enclosure, shows how to use various
    Sheet Metal techniques to create an example enclosure, while also providing handy
    tips and tricks for practical modeling.


    ## To get the most out of this book


    You should already have a basic level of SolidWorks knowledge and be able to use
    a Windows PC. It will be assumed that you already know the building blocks of
    3D modeling, such as sketching, as well as creating and editing features.


    For those of you who are completely new to SolidWorks, it is advisable to gain
    a firm foundation in solid modeling first before trying to use the Sheet Metal
    module covered in this book.


    You should also have a SolidWorks license if you wish to practice the exercises
    and skills covered in the book.


    | Software/hardware covered in the book | Operating system requirements |

    |---|---|

    | SolidWorks | Windows |


    The examples given in this book were created using SolidWorks 2021. Different
    versions of SolidWorks can be used with the vast majority of the tools covered,
    but there may be minor differences in the interface and sub-options.


    During the course of the book, if a certain tutorial or tool is causing problems,
    try double-checking all of the previous steps, or even try closing the part and
    starting again from the beginning.


    Error messages in SolidWorks can be quite descriptive and often tell the user
    exactly what the issue is. So, if you''re presented with an error, try to avoid
    the temptation to click **OK** without reading it properly, and instead, attempt
    to carry out the action suggested in the message.


    If the problems persist, please feel free to contact me online via Twitter at
    www.twitter.com/johnoellison.


    Throughout this book, millimeters are used as the unit of measurement, but this
    can be adjusted according to your preference by setting the model''s units to
    inches (for example) and then typing the millimeter numerical value followed by
    mm in the Smart Dimension tool when adding dimensions. This will automatically
    convert the millimeter values into inches (or your selected unit type).


    ## Download the color images


    We also provide a PDF file that has color images of the screenshots and diagrams
    used in this book. You can download it here: https://static.packt-cdn.com/downloads/9781803245249_ColorImages.pdf.


