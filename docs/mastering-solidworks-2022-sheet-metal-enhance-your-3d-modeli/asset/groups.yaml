    \ and selecting Display Options | Re-Jog Ordinate.\n\n+   5. To add more dimensions\
    \ to the ordinate at a later stage, right-click on one of the Ordinate Dimensions\
    \ and select Add to Ordinate.\n\nFlat Patterns are an essential part of most Sheet\
