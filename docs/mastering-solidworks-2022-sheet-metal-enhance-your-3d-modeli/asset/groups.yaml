    \ (see Figure 1.20).\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_44_0.png)\n\n\
    Figure 1.20: Creating a Base Flange\n\n6. Press **OK** to create a **Base Flange**.\
    \ It can be seen that this creates a simple, rectangular **Base Flange** similar\
    \ to the **Single Closed Profile** example from the first section.\n\nIn this\
    \ way, the **Single Open Contour Base Flange** can be thought of as similar to\
    \ the **Thin Feature Extrude** option from normal solid modeling.\n\n## Creating\
    \ more Base Flange complex shapes\n\nThe real beauty of using the Single Open\
