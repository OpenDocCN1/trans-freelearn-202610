    \ modeling skills to the next level.\n"
  mdcn: "\n\n2. 为了完成盖子，我们现在还将在盖子内侧添加一个 Hem。这将防止用户接触到盖子法兰的锋利下边缘。\n\n选择 Hem 工具，然后为三个\
    \ Edge Flanges 的内侧边缘添加一个封闭 Hem，长度为 5mm（图 13.20）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_280_0.png)\n\
    \n图 13.20 – 为盖子上的三个 Edge Flanges 添加 Hems\n\n3. Hem 增加的额外厚度现在会导致盖子与底座发生碰撞（这可以使用\
    \ Interference Detection 工具进行检查 – 请参阅以下注释）。为了解决这个问题，重新编辑 Edge Flanges 并将 Offset\
    \ 值增加到 2.6mm，以考虑 Hem 翻折材料的额外厚度。\n\n## Interference Detection Tool\n\nInterference\
    \ Detection 工具位于 Evaluate 选项卡上，是 SolidWorks 的一个非常有用的功能。它可以在零件和装配体中用于检查模型是否有任何相互碰撞的区域。\n\
    \n要使用它，请选择该工具，然后选择所需的主体、板或零件，并按 Calculate。不同区域之间的任何干涉都将以红色显示。\n\n4. 对盖子进行最后检查可能会发现\
    \ Hem 角发生碰撞（这取决于你的 Edge Flange Gap 设置）。\n\n如果你发现这些区域确实相互碰撞（图 13.21），则编辑 Edge Flange\
    \ 特性并增加 Gap 距离。\n\n在我这里，**3mm** 的间隙就足够了。注意，这些碰撞可能不会被 **Interference Detection**\
    \ 工具检测到，因为它们是在单个板内，而不是在不同的板、主体或 *零件* 之间：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_281_0.png)\n\
    \n图 13.21 – 增加 Edge Flange Gap 距离以避免 Hem 角碰撞\n\n盖子板现在已完成，如果需要，我们可以使用 **Flatten**\
    \ 工具将其展平以检查一切是否正确。\n\n**Flattening Sheets in Multi-Sheet Models**\n使用 **Flatten**\
    \ 工具检查模型时，每次只能展平一张板。\n\n要选择应展平的板，首先展开 FeatureManager 设计树末端的 **Flat-pattern** 文件夹。每个板在模型中都有一个\
    \ **Flat-Pattern** 特性。选择所需的板，然后单击 **Flatten**。所选板将被展平，所有其他板将从视图中消失。\n\n再次按下 **Flatten**\
    \ 按钮以取消展平板，模型的其余部分将重新出现。\n\n我们现在已经创建了一个简单的外壳底座和相应的盖子。在下一节中，我们将对外壳进行一些最后的润饰。\n\n\
    ## Adding final details to the enclosure\n\n现在我们有了基本的外壳设计，我们可以通过在后部添加一些通风口，并使用\
    \ Forming Tools 在正面添加一些手柄来完成它。这个外壳是一个相当简单的示例，但它展示了可以通过使用简单步骤来构建更复杂设计的流程。\n\n首先，我们将使用\
    \ Vent 工具在外壳的后部添加一些通风口。我们也可以手动切割这些通风口，但 Vent 工具加快了这一过程：\n\n- 1. 所有 Vent 都需要一个\
    \ Vent 布局的草图，因此在外壳的后部开始一个草图并绘制图 13.22 所示的轮廓。\n- 2. 使用了一条中心线来找到后部的垂直中点，然后使用 Circle\
    \ 工具和 Offset Entities 添加了三个圆。Line 工具和 Circular Sketch Pattern 工具用于添加五个 Ribs。\n\
    \n外圆直径为 40mm，两个较小的圆各自向内偏移 8mm。圆心距 Origin 为 140mm，Origin 位于后部的中心：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_282_0.png)\n\
    \n图 13.22 – 在后部绘制 Vent 细节草图\n\n## Creating Features Close to Sheet Edges and Bends\n\
    \n请注意，一些制造商可能对切口和其他特征可以靠近板边缘和弯曲处的距离有限制。如果你的特征距离边缘或弯曲处在 10mm（约 0.40\"）以内，最好与制造商核实生产限制。\n\
    \n3. 我们现在可以开始创建 Vent 特性。选择 Vent 工具并使用草图填充 Property Manager 中的字段。我使用了以下参数（图 13.23）：\n\
    \n- **Boundary**：选择外侧（40mm）圆。\n- **Ribs**：选择五条直线。肋条厚度为 2mm。\n- **Spars**：选择中间（32mm）圆。桁条厚度为\
    \ 2mm。\n- **Fill In Area**：选择最小（24mm）圆。\n- **Set a 2mm radius**：这将使通风口的所有尖锐内部角倒圆：\n\
    \n![](img/4e9c736de6bac4449096a7b92c28af4c_283_0.png)\n\n图 13.23 – 创建 Vent\n\n\
    - 4. 按 **OK** 创建 **Vent**。即使我们只制作了一个通风口，我们现在也可以通过对其进行图案化来添加更多通风口。\n\n- 5. 选择 **Linear\
    \ Pattern**（来自 **Features** 选项卡）。\n\n使用我们刚刚创建的 **Vent** 特性并设置间距值为 70mm，实例数为五，并选择后部顶部或底部边缘之一作为图案方向（*图\
    \ 13.24*）。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_284_0.png)\n\n图 13.24 –\
    \ 使用 Linear Pattern 对 Vent 进行图案化\n\n- 6. 最后，我们可以添加一些成形手柄来完成设计。\n\n打开屏幕右侧的 **Design\
    \ Library** 面板并导航到 `forming tools` 文件夹。然后，找到 `louvers` 子文件夹。该文件夹应包含一个百叶窗 Forming\
    \ Tool（*图 13.25*）。\n\n> **Note**\n> \n> 如果你无法找到百叶窗工具，则可以创建自定义成形工具，如 *第 10 章《使用\
    \ Forming Tools 为模型添加 3D 细节》中所述*：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_285_0.png)\n\
    \n图 13.25 – 查找百叶窗 Forming Tool\n\n左键单击并将百叶窗 Forming Tool 拖动到底座的前表面，以将成形百叶窗形状添加到该表面。\n\
    \n- 7. 使用 Forming Tool Property Manager 中的 Positions 选项卡精确放置 Forming Tool（图 13.26）。你可能需要使用\
    \ Point 工具在工具应放置的位置放置一个点：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_285_1.png)\n\
    \n图 13.26 – 定位成形手柄\n\n8. 按 **OK** 添加成形手柄特性。\n\n9. 我们现在可以看到圆形孔和成形手柄靠得太近。编辑 **Hole\
    \ Wizard** 特性并将两个孔移离外壳边缘（图 13.27）。矩形切口的位置也应自动移动，因为其位置是相对于两个圆形孔定义的：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_286_0.png)\n\
    \n图 13.27 – 调整两个圆形孔（以及相关的矩形切口）的位置\n\n10. 剩下的就是在正面另一侧添加第二个成形手柄。选择 **Mirror** 工具（来自\
    \ **Features** 选项卡），然后将 Right Plane 设置为 **Mirror Face/Plane**，将百叶窗特性设置为 **Features\
    \ to mirror**（图 13.28）。按 **OK** 添加第二个手柄。\n\n这两个百叶窗现在可以用作从服务器机柜中拉出托盘的手柄：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_287_0.png)\n\
    \n图 13.28 – 镜像成形手柄\n\n这就是我们完成的钣金外壳的样子：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_287_1.png)\n\
    \n图 13.29 – 完成的钣金外壳\n\n恭喜 – 我们的钣金外壳设计现已完成（图 13.29）！虽然这是一个相当简单的设计，但它展示了我们如何使用多种不同的特性来构建模型。这些单独的元素并不复杂，但合在一起时，可以组合起来创建更高级的设计。\n\
    \n## Summary\n\n在本章中，我们结合了书中学习到的各种技术来创建一个钣金外壳。底座使用 **Base Flange**、**Miter Flange**\
    \ 和各种切口、**Vents** 和 **Formed Tools** 制作。\n\n盖子由另一个简单的 **Base Flange** 构建，带有 **Edge\
    \ Flange** 侧面和 **Hems** 使其更易于用户使用。\n\n该设计使用了许多钣金工具和特性，但你可以用整个 SolidWorks 钣金套件创建的设计范围仅受你的想象力和设计要求限制。\n\
    \n与 SolidWorks 的大多数元素一样，掌握钣金的关键是尽可能多地练习这些技术。尝试在日常生活中寻找钣金产品，然后思考你如何在 SolidWorks\
    \ 中建模它们。\n\n钣金是标准 SolidWorks 工具集的一个很好的补充，可以将你的建模技能提升到下一个水平。\n\n"
