- raw:
  - '[PAGE 99]


    Jog features are made in a very similar way to Sketched Bends:


    +   1. Open your Base Flange part from the previous section and delete any extra
    flanges, cuts, or tabs so that just the Base Flange remains. Alternatively, you
    can start a new part document and create a Base Flange 200x300mm in size and 1mm
    thick.

    +   2. Jogs require a sketch to define where the Jog should be located, so start
    a sketch on the top face of the Base Flange.

    +   3. Use the Line tool to sketch a line directly across the Base Flange, making
    it Vertical and 100mm from the edge (Figure 3.21).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_99_0.png)


    Figure 3.21: Creating a sketch for use with the Jog feature


    +   4. Select the Jog feature from the Sheet Metal tools. Note that the Jog feature
    can also be selected before creating a sketch. You will then be prompted to select
    or create a sketch to use with it.

    +   5. Select a Fixed Face. In the same way as the Sketched Bend feature, this
    is the face that won’t move.

    +   6. Select the large region to the left of the sketch line. A yellow preview
    will show the bent area. As usual, the Default Bend Radius property is used, but
    this can be overridden if needed.'
  - '[PAGE 100]


    7. Set the Jog Offset property (labeled i in Figure 3.22). The direction can be
    flipped if required by pressing the Reverse Direction button. Set the offset to
    10mm, Blind:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_100_0.png)


    Figure 3.22: The Jog Property Manager


    8. Offset Distance: The actual height of the offset (labeled ii in Figure 3.22)
    depends on which of the following three options (labeled iii in Figure 3.22) is
    chosen:


    +   - Outside Offset: This uses the distance between the upper face of the Fixed
    Flange and the upper face of the Jog area (Figure 3.23, left).

    +   - Inside Offset: This uses the distance between the two inner faces of the
    Jog—that is, the upper face of the Fixed Flange and the lower face of the Jog
    area (Figure 3.23, center).

    +   - Overall Dimension: This gives the total thickness of the Jog—that is, the
    distance between the lower face of the Fixed Flange and the upper face of the
    Jog area (Figure 3.23, right).'
  - '[PAGE 101]


    ![](img/4e9c736de6bac4449096a7b92c28af4c_101_0.png)


    Figure 3.23: Offset Distance types; left to right: Outside Offset, Inside Offset,
    Overall Dimension


    9. The Fix projected length option (labeled iv in Figure 3.22) allows extra material
    to be added to the flange to compensate for the material that is taken up by the
    Jog section.


    If Fix projected length is selected, then the Jog flange will be the same length
    as the original Fixed Flange, but if the option is deselected then the Jog flange
    will be shorter than the Fixed Flange was (Figure 3.24), because some of the material
    is used by the Jog itself:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_101_1.png)


    Figure 3.24: Fix projected length option


    10. Jog Position: The actual Jog can be specified in a similar way to the Sketched
    Bend options (labeled v in Figure 3.22):


    +   - Bend Centerline: This places the center of the first bend at the position
    of the sketched line.


    +   - Material Inside: This places the first Jog bend within the footprint of
    the sketched line on the Fixed Face.'
  - '[PAGE 102]


    +   - **Material Outside**: This places the first bent flange outside of the footprint
    of the sketched line on the Fixed Face (so that the inner face of the bent flange
    lines up with the sketched line). However, some of the actual bend region may
    still be within the sketched line on the Fixed Face.

    +   - **Bend Outside**: This places all of the first Jog bend outside of the sketched
    line. This means that the bent flange will be slightly offset from the sketched
    line, depending on the **Bend Radius** size.


    11. **Jog Angle**: Finally, the **Jog Angle** property (labeled vi in *Figure
    3.21*) can be set. Both bends in the **Jog** feature will use the same angle,
    meaning that the upper section of the **Jog** will always be parallel to the Fixed
    Face.


    # A practical example of using Jogs


    **Jog** features can be particularly useful for joining two thin sheets and yet
    still maintaining a flush outer surface. If two thin sheets butt up against each
    other and join directly, then it can be very hard to weld or otherwise join them
    together because we only have a tiny surface (that is, the thickness of the sheet)
    where they actually join (*Figure 3.25*).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_102_0.png)


    Figure 3.25: Thin sheets can be hard to join without Jogs


    To demonstrate how a **Jog** feature can help to solve this issue:


    +   1. Start a new *part* document and create a **Base Flange** 100×50mm in size,
    1mm thick, with a **Bend Radius** value of 1mm.

    +   2. Add **Edge Flanges** to each of the shorter edges. These should be 50mm
    long with a 90° angle, a **Flange Length** type of `Outer Virtual Sharp`, and
    a **Flange Position** of `Material Inside`. Both edges can be added to a single
    feature. This gives a U-shaped model.'
  - '[PAGE 103]


    3. Add two further Edge Flanges to the top edges of the previous Edge Flanges
    (Figure 3.26). These should both be at a 90° angle and have a length of 49mm (Outer
    Virtual Sharp and Material Inside) so that a rough box shape is created but the
    ends of the upper flanges don’t quite touch and have a small gap:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_103_0.png)


    Figure 3.26: Creating a part with a single Base Flange and two sets of Edge Flanges,
    creating a rough box shape


    4. If this part was created in real life, then the unsupported end of the upper
    Edge Flanges would probably be fairly weak. Ideally, we would join them together,
    but the very thin sheet thickness would make them difficult to weld. Therefore,
    we will use a Jog feature to make the flanges overlap.'
  - '[PAGE 104]


    5. Sketch a single line on the top face of one of the flanges, making it parallel
    to—and 20mm away from—the edge (Figure 3.27).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_104_0.png)


    Figure 3.27: Sketching a line for the Jog feature


    6. From within the sketch, select the Jog tool. This uses the current sketch in
    the Jog feature. We could also have selected the Jog tool first, then drawn the
    sketch.


    7. Within the Jog tool, select the Fixed Face. This will be the larger region
    of the flange, on the bend side of the flange (the lefthand section in Figure
    3.27).


    8. Input the following parameters:


    +   - Jog Offset: Blind, 1.5mm (toward the Fixed Flange)

    +   - Outside Offset

    +   - Fix projected length: On

    +   - Jog Angle: Bend Centerline

    +   - Jog Angle: 90°'
  - '[PAGE 105]


    9. Press **OK** to create a **Jog**. Note that you may be presented with a message
    (*Figure 3.28*) warning that the **Jog Offset** value is not correct. Press **OK**
    to create the **Jog** anyway and we will look at the issue:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_105_0.png)


    Figure 3.28: Sometimes, the desired offset distance will not be used and a warning
    will be displayed


    10. If we look at the model from the side (*Figure 3.29*) we can see that although
    we set an **Offset Distance** value of 1.5mm, the **Jog** has actually been created
    with an **Offset Distance** value of 3mm.


    This is because the **Jog** used a **Default Bend Radius** value of 1mm; therefore,
    the **Jog** is made up of two 90° bends, each of which cannot be smaller than
    1mm in size. Adding this to sheet thickness gives our actual 3mm offset.'
  - '[PAGE 106]


    Therefore, be aware that Jog offset distances may sometimes be different from
    what you think you have specified:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_106_0.png)


    Figure 3.29: Sometimes, the Jog offset distance will be greater than what was
    specified


    11. To reduce the offset distance, we must either reduce the Bend Radius value
    or adjust the Jog Angle value.


    Edit the Jog feature and reduce the Bend Angle from 90° using the down arrow next
    to the Offset Distance box. Notice that as the angle reduces, the Offset Distance
    value in the preview also reduces, because we are effectively reducing the height
    of the bends in the Jog.


    At some point (in this case, 60°), the gap in the preview will no longer reduce.
    This shows us the maximum angle that we can use to achieve the correct offset
    distance of 1.5mm.'
