    - **Configurations**: The Forming Tools are *part* files in their own right (more
    details on this in the next two sections in this chapter) and therefore can have
    multiple configurations. This section allows you to set the required configuration
    if needed.

    - **Link**: This section allows you to keep or break the link to the Forming Tool
    *part*. If the link is kept and the Forming Tool *part* is subsequently changed,
    then the feature in this model will also change.

    - **Flat Pattern Visibility**: By default, the **Forming Tool** features will
    not appear in Flat Patterns; however, this can be overridden by selecting this
    checkbox.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_203_0.png)


    Figure 10.6: The Forming Tool Type tab


    7. The **Position** tab can now be used to place the tool features. Select the
    **Position** tab and the cursor will change to the **Point** tool.


    Similar to the **Hole Wizard**, a Forming Feature will be placed anywhere that
    a *point* is placed.


    The **Smart Dimension** tool can also be used to set the exact position of the
    features.


    8. Once you are happy with the position and type of the features, press the green
    **OK** check mark to create them.


    The basic Forming Tools in the SolidWorks **Design Library** can be useful, but
    the selection is quite limited; therefore, it''s likely that you will need to
    modify these tools to suit your own needs. In the next section, we will look at
    how to do this.


    ## Modifying existing Forming Tools


    The SolidWorks **Toolbox** and **Hole Wizard** features both contain many size
    variations and so are extremely useful. By contrast, the Forming Tools available
    in the SolidWorks **Design Library** only come in a very limited range of sizes.
    However, although the *size range* of these tools is limited, there are quite
    a few different *types* of tools. Therefore, it''s likely that you can find a
    similar shape or type of Forming Tool to address your needs, then modify the size
    so that it exactly suits your requirements.


    To modify Forming Tools:


    1. Start a new *part* document and use the **Center Rectangle** tool to create
    a **Base Flange** that is fixed to the Origin and is 50x50mm in size and 1mm thick.
    The default Sheet Metal properties can be used.


    You can also use the model from the previous section and simply delete the Forming
    Tool features.


    2. The first step in modifying Forming Tools is to find a similar tool to your
    requirements. For example, if you want an extruded flange with a cutout, expand
    the **extruded flanges** section and find the **rectangular flange** tool, as
    shown in *Figure 10.7*. Remember that yellow faces in the tool will bend the sheet
    metal and red faces will cut away material:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_205_0.png)


    Figure 10.7: Finding an existing tool that is similar to your requirements


    3. Next, we need to open the tool in order to modify it. Right-click on the preview
    of the rectangular flange tool (in the Task Pane—see Figure 10.7) and select Open.
    We will now be taken to the part document for the tool. (Note: You may receive
    a Write Access warning. This can be ignored as we will not be saving over the
    original part file.) The part can be edited in the same way as a normal model—for
    example, the extrude features can be adjusted in size by editing their underlying
    sketches or by left-clicking on the appropriate feature in the Graphics Area,
    then double-clicking any dimension and changing it.


    4. Adjust the size of the main rectangular area (the Boss-Extrude1 feature) by
    changing the dimensions from 30x20mm to 50x30mm, as illustrated in Figure 10.8.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_206_0.png)


    Figure 10.8: Adjusting the Forming Tool size


    5. Note that the Fillet that was running around the base of the tool no longer
    travels all the way around the tool (Figure 10.9). This Fillet is important for
    ensuring that the tool works correctly (sharp edges on Forming Tools can potentially
    cause manufacturing issues):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_206_1.png)


    Figure 10.9: The Fillet around the bottom of the tool is no longer correct


    Therefore, to ensure that this Fillet is created properly, extend the size of
    the Base-Extrude feature by the same amount as we extended the tool shape in Step
    4.


    6. So, edit the Base-Extrude feature or sketch and add 20mm to the long edge and
    10mm to the short edge, as illustrated in Figure 10.10.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_207_0.png)


    Figure 10.10: Increasing the base size


    Notice that after increasing the base size, the Fillet now follows the lower outline
    correctly.


    7. We can now save the part for use, as follows:


    I. Select File | Save As...


    II. Select Save as copy and open from the lower left of the dialog box.


    > Save As Copy

    > By saving the file as a copy, we maintain the original Forming Tool part (the
    rectangular flange tool) and save the modified version as an entirely new part.
    This means that models that use the original Forming Tool will be unaffected by
    these latest changes.


    III. Note that the **Save as type** dialog is displaying `Form Tool (*.sldftp)`.
    This indicates that the document will be saved as a specific *Form Tool Part*
    document.


    IV. The save location should default to the `extruded flanges` subfolder in the
    `forming tools` folder (the same location as the original **rectangular flange**
    tool that we started with). By saving in this folder, the *Form Tool Part* will
    be recognized as a Forming Tool and will appear in the `forming tools` folders
    in the **Design Library**.


    Select **Save as copy and open**, then save the modified Forming Tool with a new
    filename, such as `Larger Rectangular Flange`.


    8. Return to the original document (the **Base Flange** sheet) by selecting it
    from the **Window** menu or by pressing the *Ctrl + Tab* keys to switch between
    open documents.


    9. Expand the **Task Pane** and note that the new Forming Tool—**Larger Rectangular
    Flange**—now appears with the other Forming Tools, as illustrated in *Figure 10.11*.
    This tool can then be dragged into the model and used in the same way as any other
    Forming Tool:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_208_0.png)


    Figure 10.11: The saved Forming Tool now appears with the other tools


    ## If the New Forming Tool Doesn''t Appear


    If the new *Form Tool Part* doesn''t appear with the other Forming Tools in the
    **Design Library**, then it was probably saved in a different location from the
    other Forming Tools.


    This can be fixed by opening the *Form Tool Part* (or press *Ctrl + Tab* to return
    to the document if you still have it open). Then, expand the **Task Pane** and
    select the **Add to Library** button at the top of the **Task Pane** (*Figure
    10.12*). The part can then be added to the appropriate folder in the **Design
    Library** and used in the same way as the other Forming Tools.


    **Note:** If you are using this method then the file needs to be saved before
    it is added to the **Design Library**.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_209_0.png)


    Figure 10.12: The Add to Library button


    Although the standard Forming Tools in the **Design Library** are quite limited
    in variety they can be easily modified, allowing you to adjust them to suit your
    own needs. In the next section, we will look at taking this one step further by
    creating entirely **Custom Forming Tools**.


    ## Creating Custom Forming Tools


    Modifying existing Forming Tools may be suitable in many situations, but sometimes
    you might require an entirely custom tool. This could be something such as an
    unusually shaped indent or vent, a product''s operating instructions or markings,
    or even your company logo. In these cases, we can create Custom Forming Tools.
    These tools are reasonably straightforward to make within SolidWorks, but be aware
    that creating and using Custom Forming Tools in real-life manufacturing is likely
    to add cost and lead time to your parts.

