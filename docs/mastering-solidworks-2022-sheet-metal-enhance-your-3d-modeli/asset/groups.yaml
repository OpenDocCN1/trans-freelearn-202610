    # 10

    Adding 3D Details

    to Models with

    Forming Tools


    So far, we have learned how to add three-dimensional (3D) details to flat sheets
    by using features such as Edge Flanges. However, it is also possible to add 3D
    features by using Forming Tools. These are specially made tools that are commonly
    used to press shapes into flat faces.


    This chapter explains how to use existing Forming Tools from the SolidWorks Design
    Library, as well as how to modify Forming Tools and create and use entirely Custom
    Forming Tools.


    In this chapter, we''re going to cover the following main topics:


    +   - Using Forming Tools

    +   - Modifying existing Forming Tools

    +   - Creating Custom Forming Tools


    ## Using Forming Tools


    Forming Tools are shaped tools, known as dies, that are pressed into flat sheets
    under high pressure, leaving an indentation behind. Some Forming Tools can even
    create cuts within the sheet, as well as shaped impressions. Examples of these
    shapes include things such as dimples, louvers (shaped vents), and even logos
    and text. You can see some examples of shapes created using forming tools in Figure
    10.1:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_198_0.png)


    Figure 10.1: Examples of shapes created using forming tools


    The SolidWorks Design Library includes many premade Forming Tools that can easily
    be used when working with Sheet Metal models. Because these tools are available
    in a fairly limited range of shapes and sizes, they may not be that useful for
    your needs, but they can be modified; the later sections in this chapter will
    show how to do this, as well as how to create entirely Custom Forming Tools.


    To demonstrate the use of Forming Tools first we will make a simple Sheet Metal
    part, as follows:


    +   1. Start a new part document and use the Center Rectangle tool to create a
    Base Flange that is fixed to the Origin and is 50x50mm in size and 1mm thick.
    The default Sheet Metal properties can be used.

    +   2. Open the Design Library by clicking on the icon (it looks like a set of
    books) in the Task Pane at the right-hand side of the screen, as indicated in
    Figure 10.2.

    +   If you do not see the Task Pane, then it can be switched on by right-clicking
    on the Command Manager and ensuring that there is a check mark next to Tools |
    Task Pane.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_199_0.png)


    Figure 10.2: Opening the Design Library tab


    3. Expand the Design Library folder within the Task Pane and expand the Forming
    Tools folder. You should now see a number of different Forming Tool types, such
    as embosses and ribs. Click on embosses and note that the various embossing tools
    available will be shown at the bottom of the Task Pane. Note: Depending on your
    settings and SolidWorks version, your Design Library may appear slightly different
    from how it looks in Figure 10.3.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_200_0.png)


    Figure 10.3: Expanding the Design Library and the Forming Tools folder


    ### If the Design Library Is Not Visible


    If you can''t see the Design Library within the Task Pane, then you need to relink
    SolidWorks to the correct folder.


    This can be done by going to Tools | Options | System Options | File Locations.


    Then, find Design Library in the drop-down list and ensure that the location of
    your Design Library folder appears within the Folders box. If the folder is not
    there, click Add and find the location of your Design Library on your computer''s
    hard drive.


    By default, this location is usually C:\ProgramData\SolidWorks\SolidWorks 20xx\Design
    Library.


    (Note that the Program Data folder is often a hidden folder, so you may need to
    adjust your Windows Explorer view settings to show hidden folders.)


    Then, press OK to add the Design Library folder, and it should now appear within
    the Task Pane.


    To use the Forming Tools, they can simply be dragged into the model by holding
    the left mouse button and dragging the desired tool onto the sheet face.


    +   4. As an example, select the embosses subfolder within the forming tools folder
    in the Task Pane, then left-click and drag the counter sink emboss tool onto the
    top face of your Base Flange.


    A yellow preview of the indentation that will be made should now appear on your
    model in the Graphics Area, as illustrated in Figure 10.4:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_201_0.png)


    Figure 10.4: Dragging the Forming Tool onto the model


    ### Are You Trying to Make a Derived Part?


    If you try to drag the tool onto the sheet and are presented with the message,
    Are you trying to make a Derived Part?, this simply means that SolidWorks does
    not recognize that you are working with Forming Tools. To fix this, close the
    error message box by selecting Cancel. Then, open the Task Pane again, right-click
    on the Forming tools folder, and place a check mark next to the Forming Tools
    Folder option. This will ensure that SolidWorks knows that all parts within the
    folder should be treated as Forming Tool parts.


    5. Press the green OK check mark to insert the counter sink emboss feature. We
    should now see that the sheet has been deformed in the shape of the tool that
    we selected, and there is a hole in the center of the embossed area, as illustrated
    in Figure 10.5. If we look at the various Forming Tools in the Design Library
    (Figure 10.4—lower right), we can see that they are colored yellow or red. A yellow
    face indicates that the face of the tool will deform (or bend) the sheet, whereas
    a red face indicates material that will be cut away (for more information on this,
    see the Creating Custom Forming Tools section, later in this chapter):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_202_0.png)


    Figure 10.5: The Forming Tool feature


    We can edit the Forming Tool feature in the usual way, or we can expand the feature
    and edit the position sketch underneath the feature if we simply want to change
    the position of the feature.


    6. Left-click on the counter sink emboss feature in the FeatureManager Design
    Tree and select Edit Feature.


    The Forming Tool feature is similar to the Hole Wizard in that it contains a Type
    tab that can be used to adjust the actual tool details, and it also contains a
    Position tab that allows one or more instances to be positioned.


    The Type tab (Figure 10.6) provides the following options:


    +   - Placement Face: This sets the face where the tool will be pressed into.

    +   - Rotation Angle: The tool can be rotated to any angle here. It can also be
    flipped, allowing the tool to be pressed in from the opposite side of the sheet.

