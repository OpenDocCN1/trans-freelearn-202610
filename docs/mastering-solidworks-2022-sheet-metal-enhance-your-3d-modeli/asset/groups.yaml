  mdcn: "\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_87_0.png)\n\nFigure 3.9: 倒角法兰草图需要在法兰将要位于的边的垂直面上\n\
    \n4. 使用草图实体工具绘制法兰截面。在本例中，我们将在面的右上角创建一个垂直线，高 50mm，如图 3.10 所示。\n\nNote: 从正交视图创建这些草图会更容易：\n\
    \n![](img/4e9c736de6bac4449096a7b92c28af4c_87_1.png)\n\nFigure 3.10: 绘制法兰截面轮廓\n\
    \n5. 从 Sheet Metal 选项卡或工具栏上 Edge Flange 工具旁选择 Miter Flange 工具。由于我们当前正在编辑草图，此草图将被自动用于法兰。如果我们没有在编辑草图，则选择\
    \ Miter Flange 工具后会提示我们选择或绘制草图。\n\n6. 垂直线的轮廓现在将被用来沿着 Base Flange 的长边创建 Miter Flange（图\
    \ 3.11）。如果看不到黄色预览，请确保在左侧属性管理器顶部的 Along Edges 选择框中已选择长边。\n\nMiter Flange 可以被认为大致类似于普通实体建模中的\
    \ Swept Boss/Base 工具，其中需要 Path 和 Profile 草图。在本例中，Profile 草图是我们绘制的垂直线草图，而 Path\
    \ 草图是所选的 Base Flange 的边。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_88_0.png)\n\
    \nFigure 3.11: 创建 Miter Flange\n\n7. 请注意，即使我们从 Base Flange 的尖角处绘制了一条完全垂直的线，新法兰预览也自动具有来自\
    \ Sheet-Metal 属性文件夹的默认弯曲半径。此 Bend Radius 也可通过取消选中 Use default radius 框并设置值来更改。\n\
    \n8. 法兰的确切位置可使用三个 **Flange Position** 按钮指定。**Trim Side Bends** 和 **Custom Bend\
    \ Allowance** 选项也可使用，并且 **Miter Flange** 的起点和终点可以偏移。\n\n9. 按 **OK** 创建 **Miter\
    \ Flange**。\n\n## Adding multiple edges\n\n使用 **Miter Flanges** 而非 **Edge Flanges**\
    \ 的一大好处是，多条边之间的拐角可以进行倒角。在此上下文中，这意味着它们在拐角处正确连接并具有特定间隙。\n\n要添加多条边并演示倒角拐角，请按如下操作：\n\
    \n- 1. 在 FeatureManager 设计树中编辑 **Miter Flange** 特性。\n- 2. 确保您处于 **Along Edges**\
    \ 选择框中（应为蓝色）。如果不是，请左键单击该框以选择它。\n- 3. 左键单击 **Base Flange** 的更多边以选择它们，您应该会看到黄色预览现在为所选边添加了新的法兰。\n\
    - 4. **Property Manager** 中的 **Gap distance** 选项允许调整相邻法兰之间的间隙。\n- 5. 选择 **Base\
    \ Flange** 的全部四条边并按 **OK** 创建 **Miter Flange** 特性。\n\n请注意，*所选边必须彼此相邻*，并且必须连接到最初绘制草图的原始边/面。\n\
    \n如前所述，使用 **Miter Flange** 而非 **Edge Flange** 的关键优势之一是它允许拐角得到正确倒角：\n\n- 1. 在 FeatureManager\
    \ 设计树中展开 **Miter Flange** 特性并编辑草图。我们现在可以更改法兰的轮廓。\n- 2. 通过左键单击选择垂直线，并删除垂直关系。这可以通过在\
    \ **Graphics Area** 中选择并删除线旁的小 **Vertical Relation** 符号来完成，也可以通过在左侧 **Property\
    \ Manager** 顶部的 **Existing Relations** 框中删除垂直关系来完成。\n\n当删除垂直关系时，线应变为蓝色，这表明它现在处于欠定义状态。\n\
    \n3. 使用 **Smart Dimension** 为线添加角度，使其与水平面呈 140°，如图 3.12 所示：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_90_0.png)\n\
    \nFigure 3.12: 编辑线使其不再垂直\n\n4. 通过单击 **Graphics Area** 右上角的图标或 **Sketch** 选项卡上的\
    \ **Exit Sketch** 按钮退出草图。现在您应该会看到全部四个法兰都向外倾斜，并且拐角延伸以在它们之间形成恒定间隙（即它们被正确倒角），如图 3.13\
    \ 所示：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_90_1.png)\n\nFigure 3.13: 具有倒角拐角的\
    \ Miter Flange\n\n## Creating more complex Flange Profiles\n\n保持法兰的倒角拐角是一个有用的功能，但使用\
    \ **Miter Flanges** 的主要优势是初始草图可以被编辑以创建复杂的法兰形状，而无需大量额外的特征或工作。以下是操作方法：\n\n- 1. 展开\
    \ **Miter Flange** 特性并再次编辑轮廓草图。\n- 2. 我们现在可以编辑线并添加多条新线。尝试创建与 *Figure 3.14* 所示类似的草图：\n\
    \n![](img/4e9c736de6bac4449096a7b92c28af4c_91_0.png)\n\nFigure 3.14: 尝试将 Miter\
    \ Flange 轮廓草图调整为类似此图\n\n- 3. 退出草图，现在可以看到更新的草图被用于 **Miter Flange**。请再次注意，弯曲半径已应用于任何尖角。\n\
    \n此功能展示了 **Miter Flange** 工具的价值：在本例中，我们用单个 **Miter Flange** 替代了四个潜在的 **Edge Flange**\
    \ 特性。虽然两种工具相似，但 **Miter Flange** 工具提供了更强大的控制水平，并允许您通过这种方式组合多个特征来节省时间。\n\n> **Make\
    \ Sure the Bends can Actually Be Made in Real Life!**\n> 尽管 Miter Flange 特性非常有用，但也很容易用它在多条边上创建紧密折叠的法兰，而这些法兰可能难以使用现实世界的制造技术制作。\n\
    > \n> 当为生产创建 SolidWorks 模型时，始终牢记零件在现实生活中实际如何制造，并在必要时调整模型。\n\n到目前为止，我们已经研究了两种主要的法兰类型：**Edge\
    \ Flanges** 和 **Miter Flanges**。在下一节中，我们将研究 **Hems**，这是一种法兰类型，其中边缘被紧密地折叠到自身上。\n\
    \n## Using the Hem feature\n\n术语 *hem* 最初来自织物制作，描述的是被加倍并折叠的材料。Hems 可以在许多衣物上看到，例如裤腿底部或\
    \ T 恤袖口。\n\n**Hems** 的主要功能是：\n\n- **Remove or hide edge imperfections**: 由于 **Hems**\
    \ 将边缘折叠到自身上，因此可用于有效去除锋利边缘或隐藏切割边缘或其他缺陷。\n- **Strengthening parts**: 将材料折叠过来会使厚度加倍，而不会增加太多重量或复杂性。这意味着它可以作为为零件或无支撑边缘增加额外强度的一种绝佳方式。\n\
    \n要添加 **Hems**，请按如下操作：\n\n- 1. 打开上一节的 **Base Flange** *part* 并删除任何额外的法兰、切割或凸片，以便仅保留\
    \ **Base Flange**。或者，您可以开始一个新的 *part* 文档并创建尺寸为 200x300mm、厚度为 1mm 的 **Base Flange**。\n\
    - 2. 从 **Sheet Metal** 工具中选择 **Hem** 工具。它位于 **Miter Flange** 工具旁边。\n- 3. 创建 **Hems**\
    \ 时有许多不同的选项，但首先要选择的是应添加 **Hem** 的边：\n  - I. 单击 **Property Manager** 顶部的 **Edges**\
    \ 选择框，然后左键单击边以添加它们。\n  - II. 左键单击以选择 **Base Flange** 的其中一条长边。\n\n"
