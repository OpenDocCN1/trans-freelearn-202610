    +   2. Left-click to select the face and position where you wish to cut the hole.

    +   3. Edit the hole parameters such as the depth and diameter using the **Property
    Manager**. The hole depth can also be linked to thickness in the same way as the
    **Extruded Cuts** in the previous section.

    +   4. Press **OK** to add a hole.

    +   5. To set the exact position of the hole, select the new **Hole** feature
    in the FeatureManager Design Tree and choose **Edit Sketch**. The position can
    now be set exactly using the **Smart Dimension** tool.


    > **Is the Simple Hole Feature Useful?**

    > Because the **Simple Hole** feature needs editing to specify the hole position,
    it is usually faster just to create a normal Extruded Cut, as shown in the previous
    section, and then to use the **Circle** tool to create a hole profile.


    # Using the Hole Wizard for holes


    If you are creating holes, then the **Hole Wizard** offers a much better solution
    than using the **Simple Hole** or **Extruded Cut** options. The **Hole Wizard**
    tool contains a large library of preset sizes and types of holes, and also makes
    it easier to add multiple holes or edit them at a later stage.


    In SolidWorks Sheet Metal, the **Hole Wizard** is used in the same way as for
    standard modeling. Here’s how to work with it:


    +   1. Select the **Hole Wizard** from the **Features** tab.

    +   2. Choose the hole type using the **Type** tab (within the **Hole Wizard Property
    Manager**).

    +   3. Set the size and end condition.

    +   4. Select the **Positions** tab, then select a face where the holes will be
    added.'
