    # How to use Swept Flanges


    In *Chapter 3, Getting Familiar with Basic Tools in Sheet Metal*, we learned how
    to easily add complex flange profiles to multiple edges using a **Miter Flange**.
    The **Swept Flange** tool can be used to create fairly similar parts, but with
    some important differences.


    **Swept Flanges** can be thought of as similar to **Swept Boss/Base** features
    from normal solid modeling. Those features require two elements, a *Profile sketch*,
    and a *Path sketch*, for it to be swept along. The **Swept Flange** also needs
    these two elements, although existing edges are used instead of a standalone Path
    sketch.


    To create a **Swept Flange**:


    +   1. Start a new *part* document and create a **Base Flange** 100×100mm in size
    and 1mm thick. The default Sheet Metal properties can be used.

    +   2. First, we need to sketch the profile of the flange that will be created.
    Start a sketch on one of four small faces of the **Base Flange**.

    +   3. Use the **Line** tool to draw a simple flange profile, like the one shown
    in *Figure 5.1* Remember to Fully Define your sketch by adding Relations and Dimensions.
    The sketch profile must be open for it to work correctly:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_124_0.png)


    Figure 5.1: Creating a Base Flange and sketching a flange profile on one of the
    small faces'
  - '[PAGE 125]


    4. Select the **Swept Flange** tool from the Sheet Metal tools. This can be selected
    from within the sketch, or the tool can be selected first, and then a sketch can
    be chosen.


    The message at the top of the tool''s **Property Manager** explains how to use
    it. First, ensure that you are in the **Profile** Selection box (the smaller,
    top one should be blue), then select the open sketch profile.


    5. Next, select the **Path** to be used with the **Swept Flange**—for example,
    the existing side of the **Base Flange**. A yellow preview of the flange should
    appear, as illustrated in *Figure 5.2*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_125_0.png)


    Figure 5.2: Swept Flange preview


    6. All of the usual flange options are available, such as setting the **Bend Radius**
    (or using the default), changing the **Flange Position**, offsetting the start
    and endpoints, and adjusting the **Custom Bend Allowance** or **Relief Type**.


    7. Select the three remaining edges of the **Base Flange** and notice how the
    yellow preview of the flange continues around the corners of the **Base Flange**,
    with a curved corner, rather than separate flanges for each edge. Similar to the
