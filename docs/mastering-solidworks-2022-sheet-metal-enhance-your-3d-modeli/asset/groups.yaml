    # Using Flat Pattern views


    The basic drawing that we have created so far is a good overview of the model,
    but it doesn''t really contain enough information to fully make these parts because
    it doesn''t have details of how the parts will actually be folded from a flat
    sheet. To give this information, we can insert a flattened view of the Sheet Metal
    model using a Flat Pattern.


    To insert a Flat Pattern, proceed as follows:


    +   1. First, we will add an extra sheet to the drawing to ensure we have plenty
    of space for the Flat Pattern. Click the Add Sheet button, which is just to the
    right of the Sheet1 tab at the lower left of the screen. You can switch between
    sheets by simply left-clicking on the appropriate sheet tab.

    +   2. To add a Flat Pattern to the new sheet, expand the View Palette on the
    right-hand edge of the screen. If no views of your model are visible, try clicking
    the Refresh button at the top of the View Palette.

    +   3. Find the view labeled Flat Pattern and drag this onto the second sheet
    (see Figure 4.4). A flattened view of the part—the Flat Pattern—should now be
    visible:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_114_0.png)'
  - '[PAGE 115]


    4. The dashed lines on the view indicate Bend Lines. If your Bend Lines are not
    visible, then try going to View | Hide/Show and check that Sketches are visible.


    5. The four notes that read UP 90° R 1 are Bend Notes. These indicate how these
    sections of the sheet will be bent. In this case, the flanges will be bent upward
    at an angle of 90° with a Bend Radius of 1mm.


    If your Bend Notes don''t appear, then left-click on the Flat Pattern view and
    ensure that the Bend Notes option in the Property Manager on the left is switched
    on. It is also possible to edit the Bend Notes details (and other Flat Pattern
    options such as Display Style) here.


    6. The individual Bend Notes can also be adjusted. Left-click and drag them around
    to reposition. The angle of the notes can be changed in the Property Manager,
    and leader arrows can also be added to clarify exactly which Bend Line corresponds
    with which Bend Note.


    Flat Patterns are an essential part of 2D Sheet Metal drawings and can be used
    to show exactly how your parts will be made.


    # Using Ordinate Dimensions


    When creating Sheet Metal drawings, especially when using Flat Patterns, sometimes
    drawings can become very cluttered because lots of dimensions need to fit within
    a small area. To help reduce this effect, Ordinate Dimensions can be used. These
    are dimensions that are all added on one single line, from an ordinate (or zero)
    point.


    To use Ordinate Dimensions:


    +   1. Within a drawing document, go to the Annotation tab, then click the drop-down
    arrow underneath Smart Dimension and choose Ordinate Dimension.


    > Note

    > The Ordinate Dimension tool can be used to add either horizontal or vertical
    ordinate dimensions. Alternatively, the specific Vertical Ordinate and Horizontal
    Ordinate tools can be selected to add dimensions in vertical or horizontal orientations
    only. These tools can be useful if you are having trouble getting the general
    Ordinate Dimension tool to pick up the correct orientation.'
