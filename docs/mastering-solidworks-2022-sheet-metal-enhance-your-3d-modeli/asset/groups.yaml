    7. 现在可以使用 **Position** 选项卡来放置工具特征。选择 **Position** 选项卡，光标将变为 **Point** 工具。


    与 **Hole Wizard** 类似，Forming Feature 将放置在放置 *point* 的任何位置。


    **Smart Dimension** 工具也可以用来设置特征的精确位置。


    8. 一旦对特征的位置和类型满意，请按绿色 **OK** 勾选标记以创建它们。


    SolidWorks **Design Library** 中的基本 Forming Tools 很有用，但选择范围相当有限；因此，您很可能需要修改这些工具以满足自己的需求。在下一节中，我们将介绍如何做到这一点。


    ## Modifying existing Forming Tools


    SolidWorks **Toolbox** 和 **Hole Wizard** 特征都包含许多尺寸变化，因此非常有用。相比之下，SolidWorks **Design
    Library** 中提供的 Forming Tools 仅有非常有限的尺寸范围。然而，尽管这些工具的 *size range* 有限，但工具 *types*
    却有相当多。因此，您很可能能找到一个形状或类型的 Forming Tool 与您的需求相似，然后修改其尺寸以完全满足您的要求。


    要修改 Forming Tools：


    1. 启动一个新的 *part* 文档并使用 **Center Rectangle** 工具创建一个固定在原点、尺寸为 50x50mm 且厚度为 1mm 的
    **Base Flange**。可以使用默认的 Sheet Metal 属性。


    您也可以使用上一节的模型并简单删除 Forming Tool 特征。


    2. 修改 Forming Tools 的第一步是找到一个与您的需求相似的工具。例如，如果您想要一个带切口的挤出法兰，请展开 **extruded flanges**
    部分并找到 **rectangular flange** 工具，如 *Figure 10.7* 所示。请记住，工具中黄色面会使钣金弯曲，而红色面会切除材料：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_205_0.png)


    Figure 10.7: Finding an existing tool that is similar to your requirements


    3. 接下来，我们需要打开工具以便修改它。在任务窗格中右键单击矩形法兰工具的预览图（见 Figure 10.7）并选择 Open。我们现在将被带到该工具的零件文档中。（注意：您可能会收到写入访问警告。可以忽略，因为我们不会覆盖原始零件文件。）零件可以像普通模型一样编辑——例如，可以通过编辑其底层草图或在图形区域中左键单击相应的特征然后双击任意尺寸并更改它来调整拉伸特征的尺寸。


    4. 通过将尺寸从 30x20mm 改为 50x30mm 来调整主矩形区域（Boss-Extrude1 特征）的尺寸，如 Figure 10.8 所示。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_206_0.png)


    Figure 10.8: Adjusting the Forming Tool size


    5. 请注意，围绕工具底部的 Fillet 不再完全绕着工具走（Figure 10.9）。此 Fillet 对于确保工具正确工作非常重要（Forming Tools
    上的尖锐边缘可能会导致制造问题）：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_206_1.png)


    Figure 10.9: The Fillet around the bottom of the tool is no longer correct


    因此，为确保此 Fillet 正确创建，请将 Base-Extrude 特征的尺寸按我们在步骤 4 中扩展工具形状的相同量进行扩展。


    6. 因此，编辑 Base-Extrude 特征或草图，并在长边上增加 20mm，在短边上增加 10mm，如 Figure 10.10 所示。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_207_0.png)


    Figure 10.10: Increasing the base size


    请注意，在增加底座尺寸后，Fillet 现在会正确地沿着下轮廓。


    7. 我们现在可以按如下方式保存零件以供使用：


    I. 选择 File | Save As...


    II. 在对话框的左下角选择 Save as copy and open。


    > Save As Copy

    > 通过将文件另存为副本，我们保留了原始 Forming Tool 零件（矩形法兰工具），并将修改后的版本保存为全新的零件。这意味着使用原始 Forming
    Tool 的模型不会受到这些最新更改的影响。


    III. 请注意，**Save as type** 对话框显示为 `Form Tool (*.sldftp)`。这表明文档将保存为特定的 *Form Tool
    Part* 文档。


    IV. 保存位置应默认为 `forming tools` 文件夹中的 `extruded flanges` 子文件夹（与我们开始时使用的原始 **rectangular
    flange** 工具相同的位置）。通过在此文件夹中保存，*Form Tool Part* 将被识别为 Forming Tool 并会出现在 **Design
    Library** 中的 `forming tools` 文件夹中。


    选择 **Save as copy and open**，然后使用新文件名保存修改后的 Forming Tool，例如 `Larger Rectangular
    Flange`。


    8. 通过从 **Window** 菜单中选择它或按 *Ctrl + Tab* 键在打开的文档之间切换，返回到原始文档（**Base Flange** 钣金）。


    9. 展开 **Task Pane** 并注意新的 Forming Tool——**Larger Rectangular Flange**——现在与其它 Forming
    Tools 一起出现，如 *Figure 10.11* 所示。此工具可以像任何其他 Forming Tool 一样拖入模型并使用：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_208_0.png)


    Figure 10.11: The saved Forming Tool now appears with the other tools


    ## If the New Forming Tool Doesn''t Appear


    如果新的 *Form Tool Part* 没有与 **Design Library** 中的其他 Forming Tools 一起出现，那么它可能保存在与其它
    Forming Tools 不同的位置。


    这可以通过打开 *Form Tool Part*（或按 *Ctrl + Tab* 返回到文档，如果您仍将其保持打开）来修复。然后，展开 **Task Pane**
    并选择 **Task Pane** 顶部 (*Figure 10.12*) 的 **Add to Library** 按钮。然后可以将零件添加到 **Design
    Library** 中的适当文件夹中，并像其他 Forming Tools 一样使用。


    **Note:** 如果您使用此方法，则文件需要在添加到 **Design Library** 之前保存。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_209_0.png)


    Figure 10.12: The Add to Library button


    尽管 **Design Library** 中的标准 Forming Tools 在种类上相当有限，但它们可以轻松修改，使您能够根据自己的需求进行调整。在下一节中，我们将进一步探讨通过创建完全
    **Custom Forming Tools** 来实现这一点。


    ## Creating Custom Forming Tools


    修改现有的 Forming Tools 在许多情况下可能是合适的，但有时您可能需要一个完全定制的工具。这可能是例如形状异常的压痕或通风口、产品的操作说明或标记，甚至是您公司的标志。在这些情况下，我们可以创建
    Custom Forming Tools。这些工具在 SolidWorks 中制作相对简单，但请注意，在现实制造中使用 Custom Forming Tools
    可能会增加零件的成本和交货时间。


    '
