    ## 铝的优缺点


    铝是钣金中第二常见的材料，被广泛用于自行车车架、飞机零件和饮料罐等各种物品。


    铝在航空航天行业如此受欢迎的原因之一是它比钢轻得多。它还具有极佳的天然耐腐蚀性，因此不需要额外的表面处理来防止生锈。铝的另一个优点是其延展性极佳，这意味着它很容易弯曲。想想铝箔有多柔韧，或者饮料罐有多容易被压扁。


    不幸的是，这些积极的特性也伴随着缺点，铝比钢贵得多。然而，由于其密度较低，零件可以做得更轻，这在某种程度上抵消了这种成本。另一个因素是，虽然铝比钢轻，但它也更弱，这意味着承受相同载荷的零件在铝中必须做得更厚。然而，由于铝的密度较低，这些零件实际上可能比等效的钢零件更轻。因此，总的来说，根据使用的金属等级，铝通常具有比钢更好的强度重量比（SWR）。


    ## 其他常见金属


    钢和铝构成了绝大多数钣金零件，但还有一些其他材料相当常见，例如以下几种：


    - **铜**：铜常用于电子元件或热交换部件等零件，因为它具有良好的导电性和导热性。


    它也很容易弯曲和成型，并且具有良好的耐腐蚀性，因此常用于管道制造管道和装置。铜比钢和铝更贵，而且由于金属价格更高，一些地区存在铜盗窃问题。

    - **黄铜**：这种金属是铜和锌的合金（混合物），外观与铜相似，但外观更明亮、更闪亮。因此，它常用于装饰品，如门环、装置和饰品。


    它极具延展性，因此常用于制造铜管乐器中的乐器，如小号。黄铜具有卓越的耐腐蚀性，因此常出现在极端环境中，如船上的门把手。与铜一样，它是一种相当昂贵的金属，因此通常只少量使用。

    - **不锈钢：** 钢可以与铬等其他金属合金化以创建不同等级的不锈钢。这种钢比普通钢具有更高的耐腐蚀性，同时仍保留了大部分强度和其他优点。因此，它常用于制造餐具或手术器械。


    不锈钢钣金零件包括大型厨房设备等物品，例如水槽和台面。然而，这种改进的耐腐蚀性使不锈钢比普通钢贵得多。


    本概述并非旨在成为金属的完整清单，其他专业材料可能包括锡、金和钛。每种材料都有特定的特性，适用于不同的应用和预算。如前所述，与您的钣金供应商和制造商讨论您的具体需求是明智的，以便为您的项目找到最佳匹配。


    钣金材料特性的总结可在下表中看到：


    | 材料类型 | 优点 | 缺点 |

    |---|---|---|

    | 钢 | 坚固、便宜、广泛供应；易于加工和焊接 | 重；耐腐蚀性差 |

    | 铝 | 轻质；良好的 SWR；良好的耐腐蚀性；延展性 | 比钢贵；强度低于钢 |

    | 铜 | 良好的导热和导电性；良好的耐腐蚀性；延展性 | 昂贵 |

    | 黄铜 | 非常延展；良好的耐腐蚀性 | 昂贵 |

    | 不锈钢 | 与钢相似的优点但具有极佳的耐腐蚀性 | 昂贵 |


    ## 钣金厚度和板材尺寸


    根据您居住的世界各地，钣金通常按号数或板材的实际厚度出售。如前所述，号数是根据材料重量来衡量钣金厚度的一种方法，通常号数越高，板材越薄。


    号数针对每种材料是特定的，因此 **16 号** 钢的厚度与 **16 号** 铝不同。因此，强烈建议同时以实际厚度指定板材厚度，以避免任何混淆。


    金属板材也有各种各样的板材尺寸，公制和英制均有。一些常见尺寸如图 1.26 所示，包括 48x120 " 或 2x1 米（m）：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_52_0.png)


    图 1.25：常见的金属板材尺寸


    在制作非常大的零件或大量小零件时，值得检查您可用的板材尺寸并据此设计。如果制作大量小零件，甚至可以使用第三方“排样”软件将零件以最有效的方式排列在板材上，避免浪费材料。


    ## 材料选择回顾


    即使在 SolidWorks 中虚拟设计零件，也必须考虑这些零件在现实世界中如何制造，而其中一个重要方面是材料选择。大多数钣金零件由钢或铝制成，但其他常见金属包括铜、黄铜和不锈钢，每种材料都有独特的特性，适用于不同的需求。


    板材厚度通常由实际厚度或号数定义。这基于材料的重量，这意味着相同的号数对不同材料给出不同的厚度。板材有各种常见的尺寸，可能会影响零件的设计。


    ## 总结


    在本章中，我们介绍了 SolidWorks Sheet Metal 并学习了如何设置 Sheet Metal 工作区并创建 **Base Flanges**。这些通常是
    Sheet Metal *part* 中的第一个特征，我们介绍了三种不同类型：**Single Closed Profile**、**Multiple Contained
    Closed** 和 **Single Open Contour**。


    接下来，我们探讨了四个 **Sheet Metal** 属性——**Thickness**、**Bend Radius**、**Bend Allowance**
    和 **Auto Relief**——以及如何编辑它们以调整整个 *part* 的属性。


    最后，我们学习了如何将 3D *parts* 展开，这对于它们在现实世界中由金属板材制成至关重要。类似地，我们查看了常见的钣金材料和板材尺寸，以及它们可能与最终设计相关的程度。


    在 *第 2 章，使用边缘翻边添加弯曲* 中，我们将开始通过学习如何使用 **Edge Flanges** 为 **Base Flange** 添加更多细节来构建
    3D 设计。


    ## 2

    使用边缘翻边添加弯曲


    被称为 **Edge Flanges** 的弯曲边缘是 **SolidWorks Sheet Metal** 的主力军，也是为平坦的 **Base Flanges**
    添加 3D 细节最常见的构建块之一。虽然边缘翻边看起来可能非常简单，但它们可用于构建高度复杂的零件。


    在本章中，我们将学习如何添加基本的边缘翻边，然后探索如何编辑和调整它们。我们还将查看一些更高级的选项和细节，可以释放边缘翻边的威力，使您能够在多个边缘上使用它们，以及编辑翻边轮廓等等。


    到本章结束时，您将完全了解边缘翻边以及如何使用它们来构建钣金模型。


    在本章中，我们将涵盖以下主要主题：


    - 使用边缘翻边

    - 边缘翻边：高级选项


    ## 使用边缘翻边


    SolidWorks Sheet Metal 中最基本和最常见的特征之一是边缘翻边。最简单地说，边缘翻边只是在边缘上金属板的弯曲部分。一个非常简单的钣金盒由一个单一的
    Base Flange 和四个附着在其上的 Edge Flanges 组成（如图 2.1 所示，每侧一个）。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_56_0.png)


    图 2.1：由一个 Base Flange 和四个 Edge Flanges 组成的一个简单盒子


    单个边缘翻边是非常简单的特征，但组合起来时，它们可用于创建更复杂的零件。


    ## 创建您的第一个边缘翻边


    边缘翻边相对简单易做：


    1. 打开第 1 章《钣金基础 – 探索钣金属性和材料选择》中的 **Base Flange** 零件，或创建一个新的 SolidWorks 零件并制作一个尺寸为
    200 x 300 mm 的 Base Flange（如第 1 章《钣金基础 – 探索钣金属性和材料选择》中所示）。


