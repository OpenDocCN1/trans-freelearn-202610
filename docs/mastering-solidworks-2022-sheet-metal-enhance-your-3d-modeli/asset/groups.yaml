  - "[PAGE 160]\n\n# Adding Bent Lofted Bends\n\nThe second type of Lofted Bend is\
    \ the **Bent** version. Follow these steps to add it:\n\n+   1. Edit the current\
    \ **Lofted Bend** feature; note that because we have already created a Formed\
    \ Lofted Bend, we no longer have the option to change it to a Bent Lofted Bend.\n\
    +   \n+   However, we can delete the Lofted Bend and then reuse the same profiles\
    \ to create a Bent version.\n+   2. Exit the **Lofted Bend Property Manager**\
    \ so that we are no longer editing the feature, then select the feature in the\
    \ FeatureManager Design Tree and press Delete. This will remove the Lofted Bend\
    \ feature but keep the two underlying sketches.\n+   3. Select the **Lofted Bend**\
    \ tool, and then select the two profiles again. Remember to try to select corresponding\
    \ points on each profile.\n+   4. Now, select the **Bent** option from the **Manufacturing\
    \ Method** section of the **Property Manager**.\n+   5. The **Bent** option contains\
    \ many more sub-options than the **Formed** option, but at this stage, use the\
    \ default options and press the green **OK** check mark to create a Bent Lofted\
    \ Bend.\n+   6. We can immediately see that the model appears very different from\
    \ the previous Formed version and contains many small bent edges.\n+   \n+   Press\
    \ **Flatten** to flatten the model, and note that we can now see multiple Bend\
    \ Lines that would be used to bend the *part* (see Figure 7.7):\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_160_0.png)\n\
    \nFigure 7.7: The flattened Bent Lofted Bend with Bend Lines\n\n+   7. Press **Flatten**\
    \ again to refold the *part*."
  - '[PAGE 161]


    8. We will now explore the different Faceting Options for creating the corners
    of Bent Lofted Bends.


    Edit the **Lofted Bend** feature, and in the **Property Manager**, we can see
    the four choices, as illustrated in *Figure 7.8*. Each of these choices will give
    a fairly similar output, but the slightly different options allow you to exactly
    control the bend shape.


    Note that some of the options can be a little temperamental with certain loft
    profiles, so if you are struggling to get the results that you want with one option,
    then try experimenting with another one:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_161_0.png)


    Figure 7.8: Bent Lofted Bends options'
  - '[PAGE 162]


    Starting with the first option:


    +   - **Chord Tolerance**: A chord is a straight line that joins two points on
    a circular arc. When we create Bent Lofted Bends, we are approximating an arc
    by using straight lines. *Figure 7.9* shows an ideal arc and an approximated version
    using chords (straight lines):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_162_0.png)


    Figure 7.9: Chord Tolerance option


    The **Chord Tolerance** option sets a maximum value between the straight chord
    line and the ideal arc, as shown in blue in *Figure 7.9*.


    Try adjusting the **Facet Value** setting and notice how the preview changes.
    A higher facet value will produce fewer straight sections and so will create a
    less accurate arc shape but will be easier to make because it has fewer bends.


    Note that we can also click on the purple dots on each of the four corners on
    the model in the Graphics Area (see the right-hand side of *Figure 7.6*), and
    this will also allow us to set faceting options specifically for that corner.


    If you find that when it is created, your **Lofted Bend** has relief cuts that
    you don''t want, then try selecting or deselecting the **Refer to endpoint** option.
    This can result in smoother bends and reduce problems with these automatic relief
    cuts.


    +   - **Number of Bends**: This is quite a simple option that allows you to set
    the number of bends within each corner. Obviously, more bends will result in a
    smoother curve, but be aware that this will also require more work during production.


    +   - **Segment Length**: This option allows you to set the maximum length of
    each segment. A lower value will result in a greater number of shorter sections,
    giving a smoother curve, whereas a higher value will produce sections that are
    longer in length but fewer of them. This will give a more approximate bend shape.'
  - '[PAGE 163]


    +   - **Segment Angle**: The final option determines the maximum angle between
    adjacent segments. A lower value here will produce more segments in the bend and
    so will result in a smoother curve.


    Each of the four options can produce very similar results, so try experimenting
    with the settings to get the shape of bend that you require.


