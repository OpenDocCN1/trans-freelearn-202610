  md: '

    The K-Factor is a ratio, so it will always be between 0 and 1. The inside of the
    bend is a K-Factor of 0 and the outside of the bend is a K-Factor of 1. Therefore,
    the middle of the bend is a K-Factor of 0.5, as illustrated in Figure 1.14.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_38_0.png)


    Figure 1.14: The K-Factor is a ratio indicating a line through a cross-section
    of the bend


    ### What Value of K-Factor Should I Use?

    The K-Factor depends on a number of factors, such as material and bending type.
    If you''re unsure about what to use, then a K-Factor of 0.5 is usually a good
    estimate for most parts and materials.

    You can also try asking your manufacturer what value they recommend you should
    use.


    The K-Factor is the easiest way to work out **Bend Allowances** and can easily
    be changed at a later stage if needed, by editing the **Sheet Metal** properties.


    ## Other Bend Allowance options


    As well as the K-Factor, there are also some other ways of calculating the **Bend
    Allowance**. If you are unfamiliar with these methods, then it is highly recommended
    that you use the **K-Factor** option, as detailed previously. The other **Bend
    Allowance** options are:


    - **Bend Allowance**: This allows you to specifically define the length of the
    **Bend Allowance**. This can be useful if a manufacturer gives you a certain value
    to use. However, this option should be used with care as any value can be inputted.
    Therefore, if an incorrect value is used, this can result in completely wrong
    sizes on **Flat Pattern** parts.

    - **Bend Deduction**: This option is somewhat similar to the **Bend Allowance**
    option but it measures the outside length of the folded *part*, then removes (or
    deducts) a certain value. Again, if you are unfamiliar with this method, use it
    cautiously, as using the wrong **Bend Deduction** value can give unusable results.

    - **Bend Table**: This option allows a Bend Table to be created in Microsoft Excel.
    This table can specify Bend Allowance or Deduction values based on exact bend
    details, such as the radius and angle.

    - **Bend Calculation**: Finally, the **Bend Calculation** option allows the use
    of equations to calculate the bending allowance based on factors such as the material''s
    thickness, K-Factor, and the bend radius.


    The **Bend Allowance** option is an important factor in ensuring that you are
    able to use the correct size of flat sheet to make your final, bent parts. A number
    of options are available, but if you''re unfamiliar with **Bend Allowance**, then
    it is recommended that you simply use the **K-Factor** option. A **K-Factor**
    value of 0.5 gives a good estimation for most parts, and your manufacturer should
    be able to advise you in more detail, based on the material type and your exact
    part details.


    ## Auto Relief options


    The final Sheet Metal property is **Auto Relief**. This is a way of automatically
    adding relief cuts to bends if they are required. *Figure 1.15* shows a simple
    **Base Flange** with an **Edge Flange** that only runs part of the way along the
    edge. In order to create this specific type of bend, **Auto Relief** cuts are
    needed; otherwise, the metal won''t be able to bend correctly:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_39_0.png)


    Figure 1.15: An example of an Auto Relief cut


    **Auto Relief** cuts aren''t needed on all bend types and will be automatically
    added when they are required. However, the exact type of relief cut is what is
    specified in the **Auto Relief** option.


    The three types are:


    - **Rectangular**: This gives a rectangular cut (see Figure 1.16). The size of
    the cut is determined by the ratio number and is related to the thickness of the
    sheet—for example, a ratio of 0.5 and a sheet thickness of 1mm will give a relief
    cut 0.5mm wide, which extends 0.5mm beyond the bend region. Note: the relief ratio
    has to be between 0.05 and 2.0.

    - **Obround**: This gives a more rounded cut (see Figure 1.16) and also uses a
    ratio based on the thickness of the sheet in the same way as the **Rectangular**
    option.

    - **Tear**: This option essentially tears the metal, without providing a visible
    cut area. This is the minimum that is needed to be able to flatten and bend the
    part.


    All three options are depicted here:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_40_0.png)


    Figure 1.16: Auto Relief examples; left to right: Rectangular, Obround, Tear


    **Auto Relief** cuts are an important requirement for some bend types but they
    will be added automatically, so this option can usually be set to **Rectangular**
    or **Obround** with a ratio of 0.5 unless you have specific requirements.


    ## A recap of Sheet Metal properties


    **Sheet Metal** properties are an important way of defining your Sheet Metal part.
    They can be adjusted by editing the Sheet-Metal folder within the FeatureManager
    Design Tree. They generally apply to the whole part, although they can often be
    overridden for specific features.


    The four options are:


    - **Thickness**: This determines the thickness of the sheet used to create the
    **Base Flange** and subsequent features.

    - **Bend Radius**: This sets the internal size of bends. A **Bend Radius** is
    always required for bent edges in SolidWorks Sheet Metal.

    - **Bend Allowance**: This allows us to accurately calculate the correct size
    of flat sheet that can be used to create bent *parts*. There are a number of ways
    to calculate the **Bend Allowance**, but if you are unsure, then the best option
    is usually a **K-Factor** value of 0.5.

    - **Auto Relief**: Some bends require relief cuts in order for them to be flattened
    or folded correctly. These will be added automatically if needed, but this option
    controls the size and type of cut.


    Now that we have learned the basics of Sheet Metal properties and creating **Base
    Flanges**, we can go on to explore how 3D *parts* can be flattened, as well as
    more advanced types of **Base Flanges**.


    ## Other Base Flange options and flattening parts


    In the previous section, we introduced **Base Flanges**, which are usually the
    first feature of your Sheet Metal *part*. As an example, we sketched a simple
    rectangle and then used this to make a rectangular **Base Flange**. This type
    of **Base Flange** is called a **Single Closed** profile because it only contains
    one single profile and that profile is closed (that is, it has no open areas or
    gaps in the outer perimeter). This can be seen in *Figure 1.17*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_41_0.png)


    Figure 1.17: A Single Closed profile contains one single profile, which is closed


    However, two other options can be useful for creating different kinds of **Base
    Flanges**. These are the **Multiple Contained Closed** and the **Single Open Contour**
    profiles. It''s not too important to remember the specific names, as long as you
    know how to use each type.


    ## Multiple Contained Closed


    For our previous **Base Flange**, we just used one single closed profile, but
    closed profiles can also contain *other closed profiles* within them. This type
    is known as **Multiple Contained Closed** and can be useful for adding holes and
    cutouts to your **Base Flange**. An example of this is shown in Figure 1.18.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_42_0.png)


    Figure 1.18: Multiple Contained Closed Base Flanges can contain smaller closed
    profiles within one larger closed profile


    Although using the **Multiple Contained Closed** option for creating **Base Flanges**
    can sometimes save time, I would personally recommend creating very simple **Base
    Flanges** and then adding extra cutouts and holes as separate features. This approach
    just makes it easier to adjust or remove extra details later on, if needed.


    ## Single Open Contour


    Instead of using closed profiles, it is also possible to create **Base Flanges**
    using open profiles known as **Single Open Contours**. These can range from a
    simple, single line, up to more complex collections of Sketch Entities.


    To create a basic **Single Closed Contour Base Flange**:


    - 1. Start a new *part* document and start a sketch on the appropriate Plane,
    such as the **Front Plane**.

    - 2. Sketch the **Base Flange**. It can be easiest to think of the **Single Open
    Contour** option as a side view or cross-section view of the flange. For the first
    example, try a single horizontal line, 100mm long, using the **Line** tool (see
    *Figure 1.19*).

    - 3. Remember to Fully Define your sketch by starting from the Origin and using
    the **Smart Dimension** tool to set the line’s length.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_43_0.png)


    Figure 1.19: Using a single-line sketch to create a Single Open Contour Base Flange


    - 4. Select the **Base Flange/Tab** option from the **Sheet Metal** tab or toolbar.

