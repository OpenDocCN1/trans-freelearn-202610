    In the next section, we will learn how to use the **Fold** and **Unfold** features
    to unbend parts in order to add unusual features such as cuts across bends.


    # Folding and unfolding


    **Fold** and **Unfold** are two related features that do the opposite of each
    other. As the names suggest, they allow you to unfold bends in your model and
    then refold them. This can be very useful for making certain types of cuts and
    other features and will be explained in more detail in the next section.


    To use the **Unfold** feature:


    +   1. First, create a new *part* document and make a **Base Flange** 100×100mm
    in size and 1mm thick. The default Sheet Metal properties can be used.

    +   2. Add **Edge Flanges** to all four of the edges. These should be 50mm high
    and at a 90° angle and can use any Flange Position.

    +   3. To unfold the bends, select the **Unfold** feature.'
