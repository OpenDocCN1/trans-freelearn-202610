    ![](img/4e9c736de6bac4449096a7b92c28af4c_90_0.png)


    Figure 3.12: Editing the line so that it is no longer vertical


    4. Exit the sketch by clicking the icon in the top right of the **Graphics Area**
    or the **Exit Sketch** button on the **Sketch** tab. You should now see that all
    four of the flanges are angled outward, and the corners extend to give a constant
    gap between them (that is, they are mitered correctly), as illustrated in Figure
    3.13:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_90_1.png)


    Figure 3.13: The Miter Flange with mitered corners'
  - '[PAGE 91]


    # Creating more complex Flange Profiles


    Maintaining the mitered corners of flanges is a useful feature, but the main advantage
    of using **Miter Flanges** is that the initial sketch can be edited to create
    complex flange shapes without lots of extra features or work. Here’s how we do
    this:


    +   1. Expand the **Miter Flange** feature and edit the profile sketch again.

    +   2. We can now edit the line and add multiple new lines. Try creating a sketch
    similar to the one shown in *Figure 3.14*:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_91_0.png)


    Figure 3.14: Try adjusting the Miter Flange profile sketch similar to this


    +   3. Exit the sketch, and it can now be seen that the updated sketch is used
    for the **Miter Flange**. Note again that the Bend Radius has been applied to
    any sharp corners.


    This feature demonstrates the value of the **Miter Flange** tool: in this case,
    we have replaced four potential **Edge Flange** features with just one single
    **Miter Flange**. Although the two tools are similar, the **Miter Flange** tool
    provides a much more powerful level of control and allows you to save time by
    combining multiple features in this way.'
  - "[PAGE 92]\n\n> **Make Sure the Bends can Actually Be Made in Real Life!**\n>\
    \ Although the Miter Flange feature is very useful, it can also be quite easy\
    \ to use it to create tightly folded flanges on multiple edges that could be difficult\
    \ to create using real-world manufacturing techniques.\n> \n> When creating SolidWorks\
    \ models for production, try to always keep in mind how the parts will actually\
    \ be made in real life, and adjust your models if necessary.\n\nSo far, we have\
    \ looked at two main types of flanges: **Edge Flanges** and **Miter Flanges**.\
    \ In the next section, we’ll look at **Hems**, which are another type of flange,\
    \ whereby an edge is tightly folded over on itself.\n\n# Using the Hem feature\n\
    \nThe term *hem* originally comes from fabric-making and describes material that\
    \ is doubled up and folded over. Hems can be seen on many items of clothing, such\
    \ as at the bottom of trouser legs or at the end of t-shirt arms.\n\nThe main\
    \ functions of **Hems** are:\n\n+   - **Remove or hide edge imperfections**: Since\
    \ **Hems** fold edges over on themselves, they can be used to effectively remove\
    \ sharp edges or to conceal cut edges or other defects.\n+   - **Strengthening\
    \ parts**: Folding the material over doubles the thickness without adding much\
    \ weight or complexity. This means it can be used as a great way of adding extra\
    \ strength to parts or unsupported edges.\n\nTo add **Hems**, proceed as follows:\n\
    \n+   1. Open your **Base Flange** *part* from the previous section and delete\
    \ any extra flanges, cuts, or tabs so that just the **Base Flange** remains. Alternatively,\
    \ you can start a new *part* document and create a **Base Flange** 200x300mm in\
    \ size and 1mm thick.\n+   2. Select the **Hem** tool from the **Sheet Metal**\
    \ tools. This can be found next to the **Miter Flange** tool.\n+   3. There are\
    \ many different options when creating **Hems**, but the first thing to select\
    \ is the edge where the **Hem** should be added:\n+      I. Click in the **Edges**\
    \ selection box at the top of the **Property Manager** and then left-click on\
    \ edges to add them.\n+      II. Left-click to select one of the long edges of\
    \ the **Base Flange**."
