    \ ends of the lines always have to touch the outside edges of the face, and if\
    \ your sketch doesn’t fulfill this requirement, then the message box won’t allow\
    \ the sketch to be used with the **Cross Break** feature.*\n\n- 8. When you are\
    \ happy with the profile, press the **Finish** button. Then, once you’re happy\
    \ with the **Cross Break** parameters, press the green **OK** check mark to create\
    \ the feature.\n\nCross Breaks are very simple features that are used to add rigidity\
    \ to flat sheets. They are added as purely visual items in SolidWorks Sheet Metal.\n\
    \nIn the next section, we will look at creating Vents.\n\n## Using Vents\n\nThe\
    \ **Vent** tool is used to create cut-outs of various shapes and can easily be\
    \ used to add detailed Vents. This feature isn’t strictly limited to Sheet Metal\
    \ and can also be used in normal solid modeling. However, Vents are very common\
    \ in sheet metal parts, so the feature appears grouped with the other Sheet Metal\
    \ tools:\n\n- 1. Start a new *part* document and create a **Base Flange** `100x100mm`\
    \ in size and 1mm thick. The default Sheet Metal properties can be used.\n- 2.\
    \ To create a **Vent**, we need to sketch to define the size and shape of the\
    \ **Vent** feature. Start a sketch on the large, top face of the **Base Flange**.\n\
    - 3. Sketch a circle at the Origin that is 80mm in diameter. Note that Vents don’t\
    \ have to be circular; they can use any closed profile.\n- 4. Next, we need to\
    \ add extra Sketch Entities to create **Spars**. Select the **Offset Entities**\
    \ tool from the **Sketch** tab, set an **Offset** of 10mm, and select the original\
    \ 80mm circle that we drew. This should create a new circle that’s 10mm smaller\
    \ than the 80mm circle (*Figure 6.9*).\n\nNote that you may need to select the\
    \ **Reverse** box to ensure that the **Offset** circle is within the original\
    \ circle. Also, ensure that the **Construction Geometry** options are deselected\
    \ so that both the original (**Base**) circle and the **Offset** circle are solid\
    \ lines, not construction lines:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_147_0.png)\n\
    \nFigure 6.9: Offseting the 80mm circle to create another, smaller, concentric\
    \ circle\n\n- 5. Use the Offset Entities tool twice more to add two more circles,\
    \ each 10mm smaller than the previous one (Figure 6.10):\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_147_1.png)\n\
    \nFigure 6.10: Offseting two more circles so that we have four concentric circles\
    \ in total\n\n6. Next, we need to sketch some Ribs. Note that not all Vents need\
    \ Ribs (or Spars) and that the tool can be used with just a simple outer profile\
    \ if required.\n\nSelect the Line tool and add a single, vertical line from the\
    \ center of the circle that goes out to the largest circle.\n\n7. Now, we can\
    \ use a Circular Sketch Pattern to add more Ribs. On the Sketch tab, click on\
    \ the dropdown arrow next to the Linear Sketch Pattern tool and select Circular\
    \ Sketch Pattern.\n\nSelect the vertical line as the Entities to Pattern, the\
    \ center point of the circle as the point to pattern around, and set four instances\
    \ with an equal spacing and an angle of 360° (Figure 6.11):\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_148_0.png)\n\
    \nFigure 6.11: The Circular Sketch Pattern settings\n\nPress the green OK check\
    \ mark to add three new Rib lines around the circle.\n\nIf you are having trouble\
    \ using **Circular Sketch Pattern**, then you can also use the **Line** tool to\
    \ sketch these lines manually (Figure 6.12):\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_149_0.png)\n\
    \nFigure 6.12: Completed Vent sketch\n\n- 8. Now, we can use this sketch to create\
    \ our Vent. The Vent tool can be used directly from within the sketch but in this\
    \ example, we will exit the sketch first to ensure that no items are preselected\
    \ automatically, which could cause confusion if you are unfamiliar with the tool.\n\
    \   \n- Exit the sketch and ensure that you don’t have it selected.\n\n- 9. Select\
    \ the Vent tool from the Sheet Metal tools.\n\n- 10. The Property Manager may\
    \ appear very complicated but it uses quite a logical workflow. Following the\
    \ directions provided in the message at the top, first, select the Boundary. This\
    \ is the outer limit of the Vent.\n   \nIn this case, select the largest circle\
    \ by left-clicking it.\n\nNote that a Vent is cut out of the Base Flange in the\
    \ shape of the circle that we selected (you might have to rotate your model to\
    \ see the Vent feature clearly). We could also select multiple lines, for example,\
    \ if we were making a rectangular shaped Vent.\n\nAlso, note that the Flow Area\
    \ message now displays 5025.91 square mm and Open area = 100%.\n\nThis tells you\
    \ what the area of the vent is, and that 100% of this area is open (that is, we\
    \ have no Ribs or Spars that are blocking the airflow).\n\nUnder the Geometry\
    \ Properties section, the face has been automatically selected as the face where\
    \ the Vent sketch was drawn:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_150_0.png)\n\
    \nFigure 6.13: Selecting the Vent's Boundary\n\n11. We can now add our Ribs by\
    \ selecting the Ribs box and then choosing the four lines in the sketch.\n\nThe\
    \ depth and direction of these Ribs will be grayed out as the depth of the Sheet\
    \ Metal Ribs will always be the same as the model's sheet thickness.\n\nSet the\
    \ width of the Ribs to 5mm and note that the Open area reduces to 84.60%. This\
    \ is because the Ribs are blocking some of the airflow through the Vent.\n\n12.\
    \ Now, select our Spars by left-clicking the Spars box and then selecting the\
    \ two largest remaining circles. Again, the depth and direction cannot be changed,\
    \ but the width of our Spars can be.\n\nSet the width to 2mm and note that the\
    \ Open area further reduces to 73.70% (Figure 6.14).\n\nSpars and Ribs aren't\
    \ required in every Vent, but Spars cannot be added without first adding Ribs\
    \ to connect them to the rest of the model:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_151_0.png)\n\
    \nFigure 6.14: Adding Ribs and Spars\n\n13. Fill-In Boundary is also optional\
    \ and is used to close off an area of the Vent feature. In our example, select\
    \ the smallest, inner circle, and note that it is now filled in.\n"
  mdcn: "\n\n## 使用交叉折弯\n\n交叉折弯在钣金中很常见，描述的是在平板上添加的轻微弯折，以使其更坚固并增加强度。这些交叉折弯通常可见于诸如钣金风管等物体的侧面，并且通常采用两个重叠的弯折形成交叉或\
    \ X 形，位于原本平坦的表面上。图 6.7 显示了金属风管侧面交叉折弯的示例：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_144_0.png)\n\
    \n图 6.7：带有 X 形交叉折弯的风管件示例\n\n在 SolidWorks 钣金中添加交叉折弯非常简单：\n\n- 1. 启动一个新的零件文档并创建一个尺寸为\
    \ 100x100mm、厚度为 1mm 的基体法兰。可使用默认的钣金属性。\n- 2. 选择交叉折弯工具。\n- 3. 现在，左键单击选择要添加交叉折弯特征的面。将出现黄色预览，显示交叉折弯特征的弯折将被添加的位置（图\
    \ 6.8）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_145_0.png)\n\n图 6.8：交叉折弯工具\n\
    \n4. 按下绿色的确定复选标记以添加交叉折弯特征。请注意，交叉折弯在 SolidWorks 钣金中纯粹是视觉特征。它们仅表示在现实生活中交叉折弯特征将被添加的位置。模型的实际几何形状保持不变，仍然是一个完全平坦的板。\n\
    \n5. 通过在 FeatureManager 设计树中单击它并按编辑特征来再次编辑交叉折弯特征。\n\n6. 如有需要，我们可以调整折断半径和折断角度属性并调整交叉折弯特征的方向。请注意，更改这些值不会改变黄色预览或交叉折弯特征在\
    \ 3D 模型中的外观。这些值只会出现在零件 2D 工程图的折弯注释中。\n\n7. 交叉折弯通常以交叉或 X 形制作，但也可以调整其轮廓。\n\n为此，从交叉折弯属性管理器中单击编辑交叉轮廓按钮。现在我们可以编辑交叉折弯草图，并会出现一条消息，说明当前草图可用于交叉折弯特征。草图中的构造线可以调整以改变轮廓。请注意，您可能需要删除将线端与面角连接的关联。\n\
    \n*线的端点始终必须接触面的外部边缘，如果您的草图不满足此要求，则消息框将不允许该草图与 **交叉折弯** 特征一起使用。*\n\n- 8. 当您对轮廓满意时，按下\
    \ **完成** 按钮。然后，在对 **交叉折弯** 参数满意后，按下绿色的 **确定** 复选标记以创建该特征。\n\n交叉折弯是非常简单的特征，用于为平坦板增加刚性。它们在\
    \ SolidWorks 钣金中作为纯粹的视觉项目添加。\n\n在下一节中，我们将研究创建通风口。\n\n## 使用通风口\n\n**通风口** 工具用于创建各种形状的切口，并且可以轻松用于添加详细的通风口。此功能不严格限定于钣金，也可用于普通实体建模。然而，通风口在钣金零件中非常常见，因此该功能与其它钣金工具分组在一起：\n\
    \n- 1. 启动一个新的 *零件* 文档并创建一个 **基体法兰**，尺寸为 `100x100mm`，厚度为 1mm。可使用默认的钣金属性。\n- 2.\
    \ 要创建 **通风口**，我们需要绘制草图来定义 **通风口** 特征的大小和形状。在 **基体法兰** 的大顶部面上开始一个草图。\n- 3. 在原点处绘制一个直径为\
    \ 80mm 的圆。请注意，通风口不一定是圆形的；它们可以使用任何封闭轮廓。\n- 4. 接下来，我们需要添加额外的草图实体来创建 **加强筋**。从 **草图**\
    \ 选项卡中选择 **偏移实体** 工具，设置 **偏移** 为 10mm，并选择我们绘制的原始 80mm 圆。这应该会创建一个比 80mm 圆小 10mm\
    \ 的新圆（*图 6.9*）。\n\n请注意，您可能需要选择 **反向** 框以确保 **偏移** 圆位于原始圆内。另外，确保取消选择 **构造几何** 选项，以便原始（**基体**）圆和\
    \ **偏移** 圆都是实线，而不是构造线：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_147_0.png)\n\
    \n图 6.9：偏移 80mm 圆以创建另一个更小、同心的圆\n\n- 5. 使用偏移实体工具再两次添加两个更多圆，每个圆比前一个小 10mm（图 6.10）：\n\
    \n![](img/4e9c736de6bac4449096a7b92c28af4c_147_1.png)\n\n图 6.10：偏移另外两个圆，使我们总共有四个同心圆\n\
    \n6. 接下来，我们需要绘制一些肋条。请注意，并非所有通风口都需要肋条（或加强筋），并且该工具如果需要也可以仅使用简单的外轮廓。\n\n选择直线工具并添加一条从圆心向外延伸到最大圆的单条垂直线。\n\
    \n7. 现在，我们可以使用圆形草图阵列添加更多肋条。在草图选项卡上，单击线性草图阵列工具旁的下拉箭头并选择圆形草图阵列。\n\n选择垂直线作为要阵列的实体，选择圆的中心点作为阵列中心，并设置四个实例，等距分布，角度为\
    \ 360°（图 6.11）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_148_0.png)\n\n图 6.11：圆形草图阵列设置\n\
    \n按下绿色的确定复选标记以在圆周围添加三条新的肋条线。\n\n如果您在使用 **圆形草图阵列** 时遇到困难，也可以直接使用 **直线** 工具手动绘制这些线（图\
    \ 6.12）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_149_0.png)\n\n图 6.12：完成的通风口草图\n\
    \n- 8. 现在，我们可以使用此草图创建我们的通风口。通风口工具可以直接在草图内使用，但在本示例中，我们将先退出草图，以确保没有项目被自动预选，这可能会在您不熟悉该工具时造成混淆。\n\
    \   \n- 退出草图并确保未选择它。\n\n- 9. 从钣金工具中选择通风口工具。\n\n- 10. 属性管理器可能看起来非常复杂，但它使用相当合乎逻辑的工作流程。按照顶部消息提供的说明，首先选择边界。这是通风口的外限。\n\
    \   \n在这种情况下，通过左键单击选择最大圆。\n\n请注意，通风口会以我们选择的圆的形状从基体法兰中切出（您可能需要旋转模型以更清晰地看到通风口特征）。我们也可以选择多条线，例如，如果我们要制作矩形通风口。\n\
    \n另请注意，流量面积消息现在显示为 5025.91 平方毫米，开放面积 = 100%。\n\n这告诉您通风口的面积，以及 100% 的面积是开放的（即，我们没有肋条或加强筋阻挡气流）。\n\
    \n在几何属性部分，面已被自动选为通风口草图绘制的面：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_150_0.png)\n\
    \n图 6.13：选择通风口的边界\n\n11. 我们现在可以通过选择肋条框然后选择草图中的四条线来添加我们的肋条。\n\n这些肋条的深度和方向将被变灰，因为钣金肋条的深度始终与模型的板厚相同。\n\
    \n将肋条宽度设置为 5mm，并注意开放面积减少到 84.60%。这是因为肋条阻挡了部分通过通风口的气流。\n\n12. 现在，通过左键单击加强筋框然后选择两个较大的剩余圆来选择我们的加强筋。同样，深度和方向无法更改，但我们的加强筋的宽度可以更改。\n\
    \n将宽度设置为 2mm，并注意开放面积进一步减少到 73.70%（图 6.14）。\n\n并非每个通风口都需要加强筋和肋条，但必须先添加肋条将其连接到模型的其余部分后，才能添加加强筋：\n\
    \n![](img/4e9c736de6bac4449096a7b92c28af4c_151_0.png)\n\n图 6.14：添加肋条和加强筋\n\n13.\
    \ 填充边界也是可选的，用于封闭通风口特征的区域。在我们的示例中，选择最小的内圆，并注意它现在已填充。\n\n"
