    > 在选择要倒角的角时，我建议使用 **Collect all corners** 按钮，而不是仅选择面。这是因为有时选择面也会错误地选择弯折内的角，而这些角不应该被倒角。


    - 6. 按下绿色的 **OK** 勾选标记以倒角所选角。注意 **Corner-Trim** 特性现在出现在 FeatureManager Design
    Tree 中 **Flat-Pattern** 文件夹之后。


