  mdcn: '


    K-Factor 是一个比率，因此它始终介于 0 和 1 之间。弯曲的内侧 K-Factor 为 0，弯曲的外侧 K-Factor 为 1。因此，弯曲的中间
    K-Factor 为 0.5，如图 1.14 所示。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_38_0.png)


    图 1.14：K-Factor 是一个比率，表示弯曲横截面上的线


    ### 我应该使用什么 K-Factor 值？

    K-Factor 取决于多种因素，例如材料和弯曲类型。如果您不确定使用什么值，那么对于大多数零件和材料来说，K-Factor 为 0.5 通常是一个不错的估计。

    您也可以尝试询问制造商他们建议您使用什么值。


    K-Factor 是计算 **弯曲余量** 的最简单方法，并且如果需要，可以通过编辑 **Sheet Metal** 属性在以后轻松更改。


    ## 其他弯曲余量选项


    除了 K-Factor 之外，还有其他几种计算 **弯曲余量** 的方法。如果您不熟悉这些方法，则强烈建议您使用 **K-Factor** 选项，如前所述。其他
    **弯曲余量** 选项是：


    - **弯曲余量**：这允许您具体定义 **弯曲余量** 的长度。如果制造商给您一个特定的值可以使用，这会很有用。然而，此选项应谨慎使用，因为可以输入任何值。因此，如果使用错误的值，可能会导致
    **展开图** 零件的尺寸完全错误。

    - **弯曲扣除**：此选项与 **弯曲余量** 选项 somewhat 相似，但它测量折叠 *零件* 的外部长度，然后减去某个值。同样，如果您不熟悉此方法，请谨慎使用，因为使用错误的
    **弯曲扣除** 值可能会导致无法使用结果。

    - **弯曲表**：此选项允许在 Microsoft Excel 中创建弯曲表。此表可以根据确切的弯曲细节，例如半径和角度，指定弯曲余量或扣除值。

    - **弯曲计算**：最后，**弯曲计算** 选项允许使用方程式根据材料厚度、K-Factor 和弯曲半径等因素计算弯曲余量。


    **弯曲余量** 选项对于确保您能够使用正确的平板尺寸来制作最终的弯曲零件非常重要。有多种选项可用，但如果您不熟悉 **弯曲余量**，则建议您只需使用 **K-Factor**
    选项。**K-Factor** 值 0.5 可为大多数零件提供良好的估计，而您的制造商应能够根据材料类型和您确切的零件细节为您提供更详细的建议。


    ## 自动补口选项


    最终的 Sheet Metal 属性是 **自动补口**。这是一种在需要时自动为弯曲添加补口的方法。*图 1.15* 显示了一个简单的 **底边法兰**，其
    **边法兰** 仅沿边缘延伸一部分。为了创建这种特定类型的弯曲，需要 **自动补口** 切口；否则，金属将无法正确弯曲：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_39_0.png)


    图 1.15：自动补口切口的示例


    并非所有弯曲类型都需要 **自动补口** 切口，并且在需要时会自动添加。但是，补口切口的确切类型是在 **自动补口** 选项中指定的。


    三种类型是：


    - **矩形**：这会产生矩形切口（见图 1.16）。切口的大小由比率数决定，并与板材厚度相关——例如，比率为 0.5 且板材厚度为 1mm 时，会产生宽
    0.5mm 的补口切口，并延伸 0.5mm 超出弯曲区域。注意：补口比率必须在 0.05 和 2.0 之间。

    - **椭圆形**：这会产生更圆润的切口（见图 1.16），并且也使用基于板材厚度的比率，与 **矩形** 选项相同。

    - **撕裂**：此选项基本上撕裂金属，而不提供可见的切口区域。这是能够展平和弯曲零件所需的最小值。


    这三种选项在此处全部显示：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_40_0.png)


    图 1.16：自动补口示例；从左到右：矩形、椭圆形、撕裂


    **自动补口** 切口对于某些弯曲类型是重要要求，但它们会自动添加，因此此选项通常可以设置为比率为 0.5 的 **矩形** 或 **椭圆形**，除非您有特定要求。


    ## Sheet Metal 属性回顾


    **Sheet Metal** 属性是定义您的 Sheet Metal 零件的重要方式。它们可以通过编辑 FeatureManager 设计树中的 Sheet-Metal
    文件夹来调整。它们通常适用于整个零件，尽管它们可以经常针对特定特征进行覆盖。


    四个选项是：


    - **厚度**：这决定了用于创建 **底边法兰** 和后续特征的板材厚度。

    - **弯曲半径**：这设置弯曲的内部尺寸。SolidWorks Sheet Metal 中弯曲边缘始终需要 **弯曲半径**。

    - **弯曲余量**：这使我们能够准确计算可用于创建弯曲 *零件* 的平板的正确尺寸。计算 **弯曲余量** 有多种方法，但如果您不确定，通常最好的选择是
    **K-Factor** 值 0.5。

    - **自动补口**：某些弯曲需要补口切口才能正确展平或折叠。如果需要，这些切口将自动添加，但此选项控制切口的大小和类型。


    现在我们已经学习了 Sheet Metal 属性和创建 **底边法兰** 的基础知识，我们可以继续探索如何展平 3D *零件*，以及更高级类型的 **底边法兰**。


    ## 其他底边法兰选项和展平零件


    在上一节中，我们介绍了 **底边法兰**，它们通常是您的 Sheet Metal *零件* 的第一个特征。作为示例，我们绘制了一个简单的矩形，然后用它制作了一个矩形
    **底边法兰**。这种类型的 **底边法兰** 称为 **单闭合** 轮廓，因为它只包含一个单一轮廓，并且该轮廓是闭合的（即，外周没有开口区域或间隙）。这可以在
    *图 1.17* 中看到。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_41_0.png)


    图 1.17：单闭合轮廓包含一个单一的闭合轮廓


    然而，还有另外两种选项可用于创建不同种类的 **底边法兰**。这些是 **多重包含闭合** 和 **单开口轮廓**。不必太在意记住具体的名称，只要知道如何使用每种类型即可。


    ## 多重包含闭合


    对于我们之前的 **底边法兰**，我们只使用了一个单一的闭合轮廓，但闭合轮廓也可以在其内部包含 *其他闭合轮廓*。这种类型称为 **多重包含闭合**，可用于在
    **底边法兰** 中添加孔和切口。示例显示在图 1.18 中。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_42_0.png)


    图 1.18：多重包含闭合底边法兰可以在一个较大的闭合轮廓内包含较小的闭合轮廓


    尽管使用 **多重包含闭合** 选项创建 **底边法兰** 有时可以节省时间，但我个人建议创建非常简单的 **底边法兰**，然后将额外的切口和孔作为单独的特征添加。这种方法只需使以后在需要时更容易调整或删除额外的细节。


    ## 单开口轮廓


    除了使用闭合轮廓之外，还可以使用称为 **单开口轮廓** 的开口轮廓创建 **底边法兰**。这些可以从简单的单线到更复杂的草图实体集合不等。


    要创建基本的 **单闭合轮廓底边法兰**：


    - 1. 启动一个新的 *零件* 文档并在适当的平面上开始草图，例如 **前视平面**。

    - 2. 绘制 **底边法兰**。将 **单开口轮廓** 选项视为法兰的侧视图或横截面视图可能最容易。对于第一个示例，尝试使用 **线** 工具绘制一条 100mm
    长的单水平线（见 *图 1.19*）。

    - 3. 通过从原点开始并使用 **智能尺寸** 工具设置线的长度来完全定义您的草图。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_43_0.png)


    图 1.19：使用单线草图创建单开口轮廓底边法兰


    - 4. 从 **Sheet Metal** 选项卡或工具栏中选择 **底边法兰/搭接** 选项。


    '
