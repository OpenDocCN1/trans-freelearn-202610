  - '[PAGE 152]


    14. Before completing the **Vent** feature, scroll back up to the **Geometry Properties**
    section. Here, we can set a **Draft Angle** for the **Vent** cuts. This option
    is not commonly used in Sheet Metal work as it complicates cutting out **Flat
    Patterns**.


    We can also add radii to the joins of the vent.


    Set the radius to 2mm. Note that this is applied throughout the **Vent** feature.


    15. Press **OK** to create the feature (*Figure 6.15*). Note that it now appears
    in the FeatureManager Design Tree:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_152_0.png)


    Figure 6.15: The completed Vent feature


    The **Vent** feature is not limited to just Sheet Metal *parts* and is very useful
    for adding these common features to Sheet Metal models.


    # Summary


    In this chapter, we learned how to use **Gussets** and **Cross Breaks**, both
    of which are used to add strength to sheet metal parts but in different ways.
    We learned how to edit **Gussets** to produce a variety of shapes and sizes, and
    how they can be shown in **Flat Pattern** views.


    We also explored the **Vent** tool, which can be used to quickly make Sheet Metal
    **Vents** of different layouts and sizes.


    In the next chapter, we will explore the **Lofted Bend** tool, which allows us
    to create much more complicated styles of bends.'
  - '[PAGE 153]


    # 7

    Producing

    Advanced Shapes

    Using Lofted Bends


    A Lofted Bend is an advanced form of bend that can be used to create more complex
    shapes than standard flange types.


    There are two types of Lofted Bend—Formed and Bent, and this chapter covers both,
    including the major differences between the two.


    By the end of this chapter, you''ll understand how to use the Lofted Bend tool,
    with both the Formed and Bent options.


    In this chapter, we''re going to cover the following main topics:


    +   - Creating Formed Lofted Bends

    +   - Adding Bent Lofted Bends'
  - '[PAGE 154]


    # Creating Formed Lofted Bends


    Lofted Bends are used to create a bent transition between two different profile
    shapes. This can be useful in many different ways, such as when you need to join
    a square profile to a more rounded profile like a tube.


    In SolidWorks Sheet Metal, Lofted Bends can be either Bent or Formed, and this
    describes the way the bends would actually be produced. In general, the Formed
    option produces a smoother bend and one that is harder to manufacture, whereas
    the Bent option approximates the bend shape and is easier to physically make.


    Both Bent and Formed types are created using the same tool—the Lofted Bend tool,
    and both start in the same way: with two open profiles. For this reason, Lofted
    Bends are one of the few Sheet Metal tools that don''t require a pre-existing
    Base Flange.


    To create a Formed Lofted Bend:


    +   1. Start a new part document and sketch the first bend profile (see Figure
    7.1) on the Front Plane. This can be drawn using a Center Rectangle, 100×50 mm
    in size, and fixed to Origin:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_154_0.png)


    Figure 7.1: Lofted Bend profile sketch


    # Lofted Bend Profile Requirements


    Lofted Bends need two profiles in order to be created. Both of these profiles
    must be open and must not contain any sharp corners.'
  - '[PAGE 155]


    Therefore, use the **Sketch Fillet** tool (on the **Sketch** tab) to add 5mm fillets
    to all four corners, and trim a small gap in the profile to ensure it is *open*
    (see Figure 7.2). This can be done by sketching a vertical Construction Line from
    the Origin to the top line of the rectangle.


    Then, use the **Offset Entities** tool (on the **Sketch** tab) to offset this
    Construction Line by 1mm (ensure that the offset line is also a Construction Line).


    The **Trim Entities** tool (also on the **Sketch** tab) can then be used to trim
    a small gap:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_155_0.png)


    Figure 7.2: The completed Loft profile sketch


    Note that the profile is open (it has a small gap at the top) and doesn''t have
    any sharp corners (Figure 7.2).


    Exit the sketch when it is complete.'
  - '[PAGE 156]


    2. Next, we need to create a second profile, and so, we need a new Plane. This
    can be created by selecting the Front Plane (ensure that you have already exited
    the previous sketch) and then selecting Reference Geometry | Plane from the Features
    tab. Set the offset distance as 100mm, as illustrated in Figure 7.3 and then press
    the green OK check mark to create the Plane:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_156_0.png)


    Figure 7.3: Adding a new Plane


    3. Start a new sketch on the new Plane and draw the second Loft profile. This
    will be similar to the first but have a slightly different shape.


    This time, use a Centerpoint Straight Slot (within the Slot tool) fixed at the
    Origin, and make it 100x50mm in size.


    As before, the profile must be open and with no sharp corners. Due to the slot
    shape, we don''t have any sharp corners, but the slot is still a closed profile.
    Therefore, we need to trim away another small section, by offsetting a vertical
    line then trimming a gap, as we did with the first profile. Note that you may
    be shown a warning message about destroying the slot entity when trimming. This
    is normal and can be ignored by pressing OK.'
  - '[PAGE 157]


    If your sketch loses its Relations and becomes Underdefined, then it can be Fully
    Defined by adding more Relations and Dimensions (you may need to re-anchor the
    slot to the Origin and add Tangent Relations between the curved and straight sections).
    The finished sketch is shown in Figure 7.4.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_157_0.png)


    Figure 7.4: The finished, second Loft profile sketch


    Exit the second sketch when it is complete.


    +   4. We now have the two profile sketches that are required, and so we can use
    these to create the feature. Select the Lofted Bend tool from the Sheet Metal
    tools. This will be one of the few tools that are available since our model doesn’t
    have a Base Flange. If the Lofted Bend tool is grayed out, then ensure that you
    have exited the sketches and are no longer editing them, and this should allow
    the tool to be used.


    +   5. To create the feature, we first need to select the two profiles. Click
    in the Profiles box (if it is not already selected and therefore blue in color)
    in the Property Manager on the left. Then, select each of the sketches in turn
    by left-clicking.'
  - '[PAGE 158]


    # Selecting Loft Profiles


    When selecting Loft Profiles, try to ensure that you select corresponding points
    in each sketch. For example, if you select the point at the top-right center of
    the straight line on the first (rectangle) sketch, then also select a point in
    the same position on the second (slot) sketch (see the arrows in Figure 7.5).


    If you are using dissimilar profiles, then it might not always be possible to
    select points that correspond exactly but try to avoid selecting completely opposite
    points as this may cause the Loft to twist and make the feature fail.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_158_0.png)


    Figure 7.5: Try to select corresponding points on each of the profile sketches


    6. We can now choose whether we want to make a Bent or a Formed Loft. Under the
    Manufacturing Method section in the Property Manager, choose the Bent and Formed
    options in turn. Note that the preview changes slightly with each option (Figure
    7.6). The Bent option has lots of smaller, straighter edges, and the Formed option
    is much smoother.'
  - "[PAGE 159]\n\nSelect the **Formed** option:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_159_0.png)\n\
    \nFigure 7.6: Previews of the Formed Lofted Bend (left) and the Bent Lofted Bend\
    \ (right)\n\n+   7. The **Formed Lofted Bend** only has a single option to set,\
    \ which is the thickness of the sheet.\n+   \n+   Set this to 1.5mm thickness.\n\
    +   \n+   8. Press the green **OK** check mark to create the feature. The **Lofted\
    \ Bend** feature appears in the FeatureManager Design Tree and can be edited as\
    \ normal. The profile sketches can also be edited by expanding the feature and\
    \ editing the sketches underneath.\n+   \n+   9. Flatten the model by selecting\
    \ **Flatten** from the **Sheet Metal** tools. Note that the flat part has an arch\
    \ shape, due to the shape of the **three-dimensional (3D)** formed bends.\n+ \
    \  \n+   There are also no bend lines. This is because the shape will be formed\
    \ using specialist tooling instead of bent using set points. Because of this,\
    \ this type of part may be difficult to actually manufacture.\n+   \n+   10. Press\
    \ the **Flatten** button to refold the model.\n\nFormed Lofted Bends are made\
    \ from two profile sketches that must be open and must contain no sharp corners.\
    \ Formed Lofted Bends produce a smooth shape but can be hard to produce in real\
    \ life. In the next section, we will look at creating a **Bent Lofted Bend**,\
    \ using the same profiles."
  md: "\n14. Before completing the **Vent** feature, scroll back up to the **Geometry\
    \ Properties** section. Here, we can set a **Draft Angle** for the **Vent** cuts.\
    \ This option is not commonly used in Sheet Metal work as it complicates cutting\
    \ out **Flat Patterns**.\n\nWe can also add radii to the joins of the vent.\n\n\
    Set the radius to 2mm. Note that this is applied throughout the **Vent** feature.\n\
    \n15. Press **OK** to create the feature (*Figure 6.15*). Note that it now appears\
    \ in the FeatureManager Design Tree:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_152_0.png)\n\
    \nFigure 6.15: The completed Vent feature\n\nThe **Vent** feature is not limited\
    \ to just Sheet Metal *parts* and is very useful for adding these common features\
    \ to Sheet Metal models.\n\n## Summary\n\nIn this chapter, we learned how to use\
    \ **Gussets** and **Cross Breaks**, both of which are used to add strength to\
    \ sheet metal parts but in different ways. We learned how to edit **Gussets**\
    \ to produce a variety of shapes and sizes, and how they can be shown in **Flat\
    \ Pattern** views.\n\nWe also explored the **Vent** tool, which can be used to\
    \ quickly make Sheet Metal **Vents** of different layouts and sizes.\n\nIn the\
    \ next chapter, we will explore the **Lofted Bend** tool, which allows us to create\
    \ much more complicated styles of bends.\n\n## 7\nProducing\nAdvanced Shapes\n\
    Using Lofted Bends\n\nA Lofted Bend is an advanced form of bend that can be used\
    \ to create more complex shapes than standard flange types.\n\nThere are two types\
    \ of Lofted Bend—Formed and Bent, and this chapter covers both, including the\
    \ major differences between the two.\n\nBy the end of this chapter, you'll understand\
    \ how to use the Lofted Bend tool, with both the Formed and Bent options.\n\n\
    In this chapter, we're going to cover the following main topics:\n\n- Creating\
    \ Formed Lofted Bends\n- Adding Bent Lofted Bends\n\n## Creating Formed Lofted\
    \ Bends\n\nLofted Bends are used to create a bent transition between two different\
    \ profile shapes. This can be useful in many different ways, such as when you\
    \ need to join a square profile to a more rounded profile like a tube.\n\nIn SolidWorks\
    \ Sheet Metal, Lofted Bends can be either Bent or Formed, and this describes the\
    \ way the bends would actually be produced. In general, the Formed option produces\
    \ a smoother bend and one that is harder to manufacture, whereas the Bent option\
    \ approximates the bend shape and is easier to physically make.\n\nBoth Bent and\
    \ Formed types are created using the same tool—the Lofted Bend tool, and both\
    \ start in the same way: with two open profiles. For this reason, Lofted Bends\
    \ are one of the few Sheet Metal tools that don't require a pre-existing Base\
    \ Flange.\n\nTo create a Formed Lofted Bend:\n\n- 1. Start a new part document\
    \ and sketch the first bend profile (see Figure 7.1) on the Front Plane. This\
    \ can be drawn using a Center Rectangle, 100×50 mm in size, and fixed to Origin:\n\
    \n![](img/4e9c736de6bac4449096a7b92c28af4c_154_0.png)\n\nFigure 7.1: Lofted Bend\
    \ profile sketch\n\n### Lofted Bend Profile Requirements\n\nLofted Bends need\
    \ two profiles in order to be created. Both of these profiles must be open and\
    \ must not contain any sharp corners.\n\nTherefore, use the **Sketch Fillet**\
    \ tool (on the **Sketch** tab) to add 5mm fillets to all four corners, and trim\
    \ a small gap in the profile to ensure it is *open* (see Figure 7.2). This can\
    \ be done by sketching a vertical Construction Line from the Origin to the top\
    \ line of the rectangle.\n\nThen, use the **Offset Entities** tool (on the **Sketch**\
    \ tab) to offset this Construction Line by 1mm (ensure that the offset line is\
    \ also a Construction Line).\n\nThe **Trim Entities** tool (also on the **Sketch**\
    \ tab) can then be used to trim a small gap:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_155_0.png)\n\
    \nFigure 7.2: The completed Loft profile sketch\n\nNote that the profile is open\
    \ (it has a small gap at the top) and doesn't have any sharp corners (Figure 7.2).\n\
    \nExit the sketch when it is complete.\n\n2. Next, we need to create a second\
    \ profile, and so, we need a new Plane. This can be created by selecting the Front\
    \ Plane (ensure that you have already exited the previous sketch) and then selecting\
    \ Reference Geometry | Plane from the Features tab. Set the offset distance as\
    \ 100mm, as illustrated in Figure 7.3 and then press the green OK check mark to\
    \ create the Plane:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_156_0.png)\n\n\
    Figure 7.3: Adding a new Plane\n\n3. Start a new sketch on the new Plane and draw\
    \ the second Loft profile. This will be similar to the first but have a slightly\
    \ different shape.\n\nThis time, use a Centerpoint Straight Slot (within the Slot\
    \ tool) fixed at the Origin, and make it 100x50mm in size.\n\nAs before, the profile\
    \ must be open and with no sharp corners. Due to the slot shape, we don't have\
    \ any sharp corners, but the slot is still a closed profile. Therefore, we need\
    \ to trim away another small section, by offsetting a vertical line then trimming\
    \ a gap, as we did with the first profile. Note that you may be shown a warning\
    \ message about destroying the slot entity when trimming. This is normal and can\
    \ be ignored by pressing OK.\n\nIf your sketch loses its Relations and becomes\
    \ Underdefined, then it can be Fully Defined by adding more Relations and Dimensions\
    \ (you may need to re-anchor the slot to the Origin and add Tangent Relations\
    \ between the curved and straight sections). The finished sketch is shown in Figure\
    \ 7.4.\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_157_0.png)\n\nFigure 7.4: The\
    \ finished, second Loft profile sketch\n\nExit the second sketch when it is complete.\n\
    \n- 4. We now have the two profile sketches that are required, and so we can use\
    \ these to create the feature. Select the Lofted Bend tool from the Sheet Metal\
    \ tools. This will be one of the few tools that are available since our model\
    \ doesn’t have a Base Flange. If the Lofted Bend tool is grayed out, then ensure\
    \ that you have exited the sketches and are no longer editing them, and this should\
    \ allow the tool to be used.\n\n- 5. To create the feature, we first need to select\
    \ the two profiles. Click in the Profiles box (if it is not already selected and\
    \ therefore blue in color) in the Property Manager on the left. Then, select each\
    \ of the sketches in turn by left-clicking.\n\n### Selecting Loft Profiles\n\n\
    When selecting Loft Profiles, try to ensure that you select corresponding points\
    \ in each sketch. For example, if you select the point at the top-right center\
    \ of the straight line on the first (rectangle) sketch, then also select a point\
    \ in the same position on the second (slot) sketch (see the arrows in Figure 7.5).\n\
    \nIf you are using dissimilar profiles, then it might not always be possible to\
    \ select points that correspond exactly but try to avoid selecting completely\
    \ opposite points as this may cause the Loft to twist and make the feature fail.\n\
    \n![](img/4e9c736de6bac4449096a7b92c28af4c_158_0.png)\n\nFigure 7.5: Try to select\
    \ corresponding points on each of the profile sketches\n\n6. We can now choose\
    \ whether we want to make a Bent or a Formed Loft. Under the Manufacturing Method\
    \ section in the Property Manager, choose the Bent and Formed options in turn.\
    \ Note that the preview changes slightly with each option (Figure 7.6). The Bent\
    \ option has lots of smaller, straighter edges, and the Formed option is much\
    \ smoother.\n\nSelect the **Formed** option:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_159_0.png)\n\
    \nFigure 7.6: Previews of the Formed Lofted Bend (left) and the Bent Lofted Bend\
    \ (right)\n\n- 7. The **Formed Lofted Bend** only has a single option to set,\
    \ which is the thickness of the sheet.\n  \n  Set this to 1.5mm thickness.\n \
    \ \n- 8. Press the green **OK** check mark to create the feature. The **Lofted\
    \ Bend** feature appears in the FeatureManager Design Tree and can be edited as\
    \ normal. The profile sketches can also be edited by expanding the feature and\
    \ editing the sketches underneath.\n  \n- 9. Flatten the model by selecting **Flatten**\
    \ from the **Sheet Metal** tools. Note that the flat part has an arch shape, due\
    \ to the shape of the **three-dimensional (3D)** formed bends.\n  \n  There are\
    \ also no bend lines. This is because the shape will be formed using specialist\
    \ tooling instead of bent using set points. Because of this, this type of part\
    \ may be difficult to actually manufacture.\n  \n- 10. Press the **Flatten** button\
    \ to refold the model.\n\nFormed Lofted Bends are made from two profile sketches\
    \ that must be open and must contain no sharp corners. Formed Lofted Bends produce\
    \ a smooth shape but can be hard to produce in real life. In the next section,\
    \ we will look at creating a **Bent Lofted Bend**, using the same profiles.\n"
  mdcn: "\n\n14. 在完成 **Vent** 功能之前，向上滚动回到 **Geometry Properties** 部分。在这里，我们可以为 **Vent**\
    \ 切割设置一个 **Draft Angle**。该选项在钣金工作中并不常用，因为它会使 **Flat Patterns** 的切割变得复杂。\n\n我们还可以为通风口的连接处添加圆角。\n\
    \n将半径设置为 2mm。请注意，这适用于整个 **Vent** 功能。\n\n15. 按 **OK** 创建该功能（*Figure 6.15*）。注意它现在出现在\
    \ FeatureManager Design Tree 中：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_152_0.png)\n\
    \nFigure 6.15: The completed Vent feature\n\n**Vent** 功能不仅限于钣金 *parts*，并且非常适用于在钣金模型中添加这些常见功能。\n\
    \n## Summary\n\n在本章中，我们学习了如何使用 **Gussets** 和 **Cross Breaks**，两者都用于以不同方式为钣金件增加强度。我们学习了如何编辑\
    \ **Gussets** 以产生各种形状和尺寸，以及它们如何在 **Flat Pattern** 视图中显示。\n\n我们还探索了 **Vent** 工具，该工具可用于快速制作不同布局和尺寸的钣金\
    \ **Vents**。\n\n在下一章中，我们将探索 **Lofted Bend** 工具，该工具使我们能够创建更复杂类型的弯曲。\n\n## 7\nProducing\n\
    Advanced Shapes\nUsing Lofted Bends\n\nLofted Bend 是一种先进的弯曲形式，可用于创建比标准法兰类型更复杂的形状。\n\
    \nLofted Bend 有两种类型——Formed 和 Bent，本章涵盖了这两种类型，包括两者之间的主要区别。\n\n到本章结束时，您将了解如何使用\
    \ Lofted Bend 工具，使用 Formed 和 Bent 两种选项。\n\n在本章中，我们将涵盖以下主要主题：\n\n- Creating Formed\
    \ Lofted Bends\n- Adding Bent Lofted Bends\n\n## Creating Formed Lofted Bends\n\
    \nLofted Bends 用于在两种不同轮廓形状之间创建弯曲过渡。这在许多不同的情况下都很有用，例如当您需要将方形轮廓连接到更圆润的轮廓（如管子）时。\n\
    \n在 SolidWorks Sheet Metal 中，Lofted Bends 可以是 Bent 或 Formed，这描述了弯曲实际的制作方式。一般来说，Formed\
    \ 选项会产生更平滑的弯曲，并且更难制造，而 Bent 选项会近似弯曲形状，并且更易于物理制作。\n\nBent 和 Formed 类型都使用相同的工具——Lofted\
    \ Bend 工具创建，并且两者都以相同的方式开始：使用两个开放轮廓。因此，Lofted Bends 是少数不需要预先存在的 Base Flange 的钣金工具之一。\n\
    \n要创建 Formed Lofted Bend：\n\n- 1. 启动一个新的零件文档并在 Front Plane 上绘制第一个弯曲轮廓（见 Figure\
    \ 7.1）。这可以使用 Center Rectangle 绘制，尺寸为 100×50 mm，并固定到 Origin：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_154_0.png)\n\
    \nFigure 7.1: Lofted Bend profile sketch\n\n### Lofted Bend Profile Requirements\n\
    \nLofted Bends 需要两个轮廓才能创建。这两个轮廓都必须是开放的，并且不能包含任何尖角。\n\n因此，使用 **Sketch Fillet**\
    \ 工具（在 **Sketch** 选项卡上）为所有四个角添加 5mm 倒角，并在轮廓中修剪一个小间隙以确保其为 *open*（见 Figure 7.2）。这可以通过从\
    \ Origin 绘制一条垂直的 Construction Line 到矩形的顶线来完成。\n\n然后，使用 **Offset Entities** 工具（在\
    \ **Sketch** 选项卡上）将此 Construction Line 偏移 1mm（确保偏移线也是 Construction Line）。\n\n\
    然后可以使用 **Trim Entities** 工具（也在 **Sketch** 选项卡上）来修剪一个小间隙：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_155_0.png)\n\
    \nFigure 7.2: The completed Loft profile sketch\n\n请注意轮廓是开放的（顶部有一个小间隙）并且没有尖角（Figure\
    \ 7.2）。\n\n在完成时退出草图。\n\n2. 接下来，我们需要创建第二个轮廓，因此我们需要一个新的 Plane。这可以通过选择 Front Plane（确保您已退出之前的草图）然后从\
    \ Features 选项卡中选择 Reference Geometry | Plane 来创建。设置偏移距离为 100mm，如 Figure 7.3 所示，然后按绿色\
    \ OK 勾号创建 Plane：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_156_0.png)\n\nFigure\
    \ 7.3: Adding a new Plane\n\n3. 在新 Plane 上开始一个新的草图并绘制第二个 Loft 轮廓。这将与第一个相似，但形状略有不同。\n\
    \n这次，使用固定在 Origin 的 Centerpoint Straight Slot（在 Slot 工具内），尺寸为 100x50mm。\n\n与之前一样，轮廓必须是开放的并且没有尖角。由于槽的形状，我们没有尖角，但槽仍然是一个封闭的轮廓。因此，我们需要修剪掉另一个小部分，通过偏移一条垂直线然后修剪一个间隙，就像我们对第一个轮廓所做的那样。请注意，修剪时可能会显示关于破坏槽实体的警告消息。这是正常的，可以通过按\
    \ OK 忽略。\n\n如果您的草图丢失了关系并变得 Underdefined，则可以通过添加更多关系和尺寸使其 Fully Defined（您可能需要重新将槽锚定到\
    \ Origin 并在曲线和直线部分之间添加 Tangent 关系）。完成的草图如图 7.4 所示。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_157_0.png)\n\
    \nFigure 7.4: The finished, second Loft profile sketch\n\n在完成时退出第二个草图。\n\n- 4.\
    \ 我们现在有了所需的两个轮廓草图，因此我们可以使用它们来创建该功能。从 Sheet Metal 工具中选择 Lofted Bend 工具。这将是少数可用的工具之一，因为我们的模型没有\
    \ Base Flange。如果 Lofted Bend 工具呈灰色，则确保您已退出草图并且不再编辑它们，这应该允许使用该工具。\n\n- 5. 要创建该功能，我们首先需要选择两个轮廓。单击\
    \ Property Manager 左侧的 Profiles 框（如果尚未选择并且因此呈蓝色）。然后，通过左键单击依次选择每个草图。\n\n### Selecting\
    \ Loft Profiles\n\n选择 Loft Profiles 时，尽量确保在每个草图中选择对应的点。例如，如果您在第一个（矩形）草图的直线上选择顶部右侧中心的点，那么也在第二个（槽）草图的相同位置选择一个点（见\
    \ Figure 7.5 中的箭头）。\n\n如果您使用的是不同的轮廓，则可能并不总是能够选择完全对应的点，但请尽量避免选择完全相反的点，因为这可能会导致\
    \ Loft 扭曲并使功能失败。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_158_0.png)\n\nFigure\
    \ 7.5: Try to select corresponding points on each of the profile sketches\n\n\
    6. 我们现在可以选择是制作 Bent 还是 Formed Loft。在 Property Manager 中的 Manufacturing Method\
    \ 部分下，依次选择 Bent 和 Formed 选项。请注意，预览会随着每个选项略有变化（Figure 7.6）。Bent 选项有很多较小的、较直的边缘，而\
    \ Formed 选项要平滑得多。\n\n选择 **Formed** 选项：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_159_0.png)\n\
    \nFigure 7.6: Previews of the Formed Lofted Bend (left) and the Bent Lofted Bend\
    \ (right)\n\n- 7. **Formed Lofted Bend** 只有一个选项需要设置，即板材的厚度。\n\n  将其设置为 1.5mm 厚度。\n\
    \n- 8. 按绿色 **OK** 勾号创建该功能。**Lofted Bend** 功能出现在 FeatureManager Design Tree 中，可以像平常一样编辑。轮廓草图也可以通过展开该功能并编辑下面的草图来编辑。\n\
    \n- 9. 通过从 **Sheet Metal** 工具中选择 **Flatten** 来展平模型。请注意，平坦零件具有拱形，这是由于 **three-dimensional\
    \ (3D)** 成型弯曲的形状所致。\n\n  也没有弯曲线。这是因为形状将使用专用工具成型，而不是使用设定点弯曲。因此，这种类型的零件可能难以实际制造。\n\
    \n- 10. 按 **Flatten** 按钮重新折叠模型。\n\nFormed Lofted Bends 由两个必须开放且不能包含尖角的轮廓草图制成。Formed\
    \ Lofted Bends 产生平滑的形状，但在现实生活中可能难以生产。在下一节中，我们将使用相同的轮廓查看如何创建 **Bent Lofted Bend**。\n\
    \n"
