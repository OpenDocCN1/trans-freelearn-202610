    ## Adjusting rip and corner details


    可以在 **Convert-Solid** 特征的 Property Manager 中进一步指定撕裂细节（图 12.25）。在这里，可以更改角部的样式（**Butt**、**Underlap**
    或 **Overlap**），调整 **Gap Distance**，并调整 **Overlap/Underlap Ratios**。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_256_1.png)


    Figure 12.25: Corner Defaults


    也可以通过在 Graphics Area 中选择它们并进行所需的更改来单独调整每个折弯和撕裂的细节。


    使用 **Convert to Sheet Metal** 工具创建钣金模型时，有时会不小心创建出有问题的特征。在下一节中，我们将看一个这样的例子以及如何克服它。


    ## Solving conversion issues


    当从 Base Flange 开始创建标准钣金模型时，通常很难创建具有展平问题的新的凸缘，因为 SolidWorks 通常会自动修剪掉有问题区域。然而，有时将模型转换为钣金时，这些展平问题会无意中发生。我们可以强制
    SolidWorks 创建其中一个问题，作为避免它的示例：


    - 1. 继续上一节的操作，再次编辑 Convert Solid 特征，以便我们回到该工具的 Property Manager 中。

    - 2. 将 Fixed Face 从小的底面更改为大的侧面（图 12.26）。然后移除任何现有的 Bend Edges（这将自动移除任何 Rip Edges，如果没有则手动删除这些），然后仅添加所示的三个
    Bend Edges。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_257_0.png)


    Figure 12.26: Adjust the Convert Solid feature


    - 3. 按 OK 更新特征。


    4. 如果我们现在旋转模型，可以看到在 3D 中一切看起来都正确，没有任何错误可见。然而，如果我们尝试通过按 Flatten 按钮来展平模型，我们现在可以看到其中两个凸缘占据相同的位置（图
    12.27）。


    > Note

    > 根据您的 SolidWorks 版本，您的模型可能无法展平，而是可能显示错误。


    ![](img/4e9c736de6bac4449096a7b92c28af4c_258_0.png)


    Figure 12.27: Two of the flattened flanges occupy the same space


    在现实生活中不可能制造出这种模型（按其当前状态），因为它的两个不同部分不能来自同一块平板。这并不一定意味着整体零件无法制造，只是我们可能需要以稍微不同的方式创建它，也许通过调整折弯的位置。


    ## If Your Model Does Not Flatten


    如果您发现模型无法正确 **Flatten**，请展开 **Flat-Pattern** 文件夹并查找任何错误或警告消息。这将指示哪些特征存在需要修复的问题。如果没有可见错误但模型仍然无法
    **Flatten**，则尝试逐一抑制之前的特征，然后，如果您的模型在缩小到单个问题区域之前无法 **Flatten**。


    SolidWorks 以及 3D CAD 的一个局限性是，有时可以使用计算机创建的模型在现实生活中无法实际制造。在建模时，始终尝试考虑零件的实际制造方式，这可以帮助减少此类问题。


    ## Summary


    在本章中，我们使用 **Convert to Sheet Metal** 工具将 3D 模型转换为钣金 *parts*。我们探索了许多子选项，并简要讨论了可能出现的错误以及如何修复它们。**Convert
    to Sheet Metal** 工具是将预先存在的模型快速更改为钣金格式以节省时间的绝佳选择。


    在下一章中，我们将把我们在前几章中学到的许多技术结合起来，并用它们创建一个钣金外壳。


    ## 13

    Practical Example:

    The Sheet Metal

    Enclosure


    钣金外壳在电子行业很常见。本章展示了如何使用我们学到的各种钣金技术来创建示例外壳，以及在实际建模中提供有用的技巧和窍门。本章将涵盖以下主要主题：


    - - Creating the enclosure base

    - - Adding more details to the enclosure

    - - Creating an enclosure lid

    - - Adding final details to the enclosure


    这些部分将展示如何使用各种钣金工具构建完整的项目。到本章结束时，您将了解 SolidWorks 钣金如何在真实设计情况下使用。


    ## Creating the enclosure base


    我们的示例外壳将由两个组件组成——*base* 和 *lid*——都在同一个 SolidWorks *part* 文件中制作。这些将作为 *part* 文件中的单独板件制作，从底板开始。


    在本章中，给出的说明更像是一个指南而不是硬性参数，因此请随意根据需要尝试不同的尺寸和特征。


    要创建底座，请按照以下步骤操作：


    - 1. 启动新的 SolidWorks *part* 文档。

    - 2. 首先，我们将绘制 **Base Flange** 轮廓。在 Top Plane 上开始一个草图并绘制一个 350x600mm 的矩形，如图 13.1
    所示：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_262_0.png)


    Figure 13.1 – Sketching a rectangle for the Base Flange profile


    **Sketching Tip!**

    请记住始终通过使用 Smart Dimensions 和 Relations 完全定义您的草图。


    在这种情况下，我建议使用 **Center Rectangle** 工具并从 Origin 开始。这将使 Front 和 Right Planes 位于 **Base
    Flange** 的中心。这对于在 *assemblies* 中添加 Mates 以及在 *part* 中使用 **Mirror** 特征非常有用。


    3. 在矩形草图内，选择 **Base Flange/Tab** 选项以创建第一个钣金特征。


    在我的示例中，我将 **Sheet Thickness** 属性设置为 2mm，并将 **Bend Allowance** 属性设置为 K-Factor 为
    0.5。


    **Note**

    **Sheet thickness selection**

    钣金零件的厚度取决于您的具体需求以及它们的制造和用途。较薄的板厚会产生更轻（更便宜！）的零件，但如果您创建大型零件，则薄板可能缺乏刚性。

    **Bend Allowance selections**

    在 *Chapter 1, Sheet Metal Basics – Exploring Sheet Metal Properties and Material
    Selection* 中，我们详细讨论了不同类型的 Bend Allowance，但如果您不确定使用哪种 Bend Allowance 类型，则通常最安全的做法是设置
    K-Factor 为 0.5。

    您也可以考虑直接向制造合作伙伴寻求建议。


    接下来，我们可以通过添加一些墙壁来构建外壳底座。我们可以使用简单的 **Edge Flange** 特征，但在我的示例中，我将使用 **Miter Flange**
    特征。


    **The Advantages of Using a Miter Flange Feature**

    **Miter Flange** 特征允许您仅使用一个特征创建更复杂的凸缘形状，而不是使用多个 **Edge Flange** 特征来构建相同的轮廓。**Miter
    Flange** 特征还将自动倒角任何角部（修剪以使其正确配合），而并非所有 **Edge Flange** 类型都会执行此操作。


