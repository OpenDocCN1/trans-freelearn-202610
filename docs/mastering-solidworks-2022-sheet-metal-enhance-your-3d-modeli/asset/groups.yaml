    ## 4

    Creating Sheet Metal Drawings and Exporting Files


    **Two-dimensional (2D)** drawings are essential if sheet metal parts are to be
    manufactured and used in the real world.


    In this chapter, we will discover some of the Sheet Metal-specific details that
    are needed for SolidWorks drawings, including how to insert **Flat Patterns**
    based on Sheet Metal *parts*. We will also learn the various ways that Sheet Metal
    parts can be exported for use, such as **Drawing Exchange Format (DXF)** and **Drawing
    (DWG)** file types.


    By the end of this chapter, you''ll understand how to add Sheet Metal details
    to SolidWorks drawings, and how to export 2D files.


    In this chapter, we''re going to cover the following main topics:


    -   Creating basic 2D drawings of Sheet Metal *parts*

    -   Using **Flat Pattern** views

    -   Exporting Sheet Metal *parts* for manufacturing


    ## SolidWorks Drawings overview


    Although SolidWorks primarily focusses on the creation of 3D models, 2D drawings
    are still an important aspect of engineering and product development. After a
    3D model has been completed a 2D drawing of it is often created to assist in manufacturing
    or for record keeping. These drawings can be made from single parts or entire
    assemblies and can range from simple overviews of the models all the way up to
    complex, multi-sheet drawings that contain section views, detail break-outs and
    other notes.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_110_0.png)


    Figure 4.1: An example SolidWorks drawing


    The detailed creation of drawings is beyond the scope of this book but as a quick
    refresher drawings can be created by going to File | New... and then selecting
    Drawing.


    Various views can then be added to the drawing sheet and dimensions and other
    notes can be added. When complete, SolidWorks drawings can be exported as PDF
    files so that they can be shared with non-SolidWorks users.


    ## Creating basic 2D drawings of Sheet Metal parts


    Now that we know the basics of making Sheet Metal models, we can explore how we
    can create 2D drawings that can be used to actually make these parts. Drawings
    are especially important for Sheet Metal models because sheet metal production
    processes can often be less automated than other manufacturing methods such as
    computer numerical control (CNC) machining or injection molding. An example of
    a SolidWorks Sheet Metal drawing can be seen in Figure 4.2.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_111_0.png)


    Figure 4.2: An example SolidWorks Sheet Metal drawing


    This section assumes that you already understand the basics of creating SolidWorks
    drawings. The chapter is not intended to be an overall guide to sheet metal and
    layouts (which vary between countries and organizations); it will simply demonstrate
    some additional Sheet Metal-specific features that are needed for SolidWorks drawings.


    First, we will create a very simple part that can be used to demonstrate drawing
    details, as follows:


    +   1. Start a new part document and create a Base Flange 200x300mm in size and
    1mm thick. The default Sheet Metal Properties can be used, as this part will just
    be used to show generic drawings.

    +   2. Add Edge Flanges to all four of the outer edges of the Base Flange. Make
    these 50mm high with a 90° angle. We should now have a simple open-box shape.

    +   3. Save your part.

    +   4. To create a 2D drawing of the part, go to File | Make Drawing from Part.

    +   5. Select a template, if the option pops up. For most users, this step will
    occur automatically and the default template will be used.

    +   6. We are now in a new, blank drawing and we can add drawing views in the
    same way as with standard SolidWorks drawings. Try either going to the Drawing
    tab and selecting a view (such as Standard 3 View) or opening the View Palette
    on the right of the screen (See Figure 4.3) and dragging the views that you require
    onto the page:


    It is also possible to create a drawing separately by going to File | New... and
    selecting Drawing. You will then be prompted to select the model you wish to make
    a drawing with.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_112_0.png)


    Figure 4.3: Views of the model can be dragged onto the drawing page from the View
    Palette


    7. **Dimensions** and **Notes** can be added as needed, and detail can be added
    in the same way as standard SolidWorks drawings.


    8. **Cut Lists** tables can also be added to the drawing. In Sheet Metal drawings,
    **Cut Lists** display all of the different sheets that are needed to create your
    model, and so they can be thought of as similar to **Bills of Material** tables
    in standard SolidWorks drawings.


    To add a **Cut List** table:


    +   I. After adding drawing views to the sheet, go to the **Annotation** tab and
    select **Tables | Weldment Cut List.**

    +   II. You will be prompted to select a model to use to create the table. Left-click
    on any of the views (since they are all from the same model) in the drawing.

    +   III. Set any specific properties that you require or press the green **OK**
    check mark to insert the table.

    +   IV. The **Cut List** table will now follow the mouse around and can be placed
    anywhere on the drawing by left-clicking.

    +   V. **Balloons** can also be added to the drawing (these are also on the **Annotations**
    tab) to specify which parts in the drawing views correspond to which entries in
    the table (they are not required in this case as there is only one single sheet
    in the model, but this can be more useful with complex models that have multiple
    sheets).


    9. Save the drawing, by going to **File | Save** or by clicking the **Save** button.


    10. By default, the file will be saved as a SolidWorks drawing file, but drawings
    can also be exported as **Portable Document Format (PDF)** files and other file
    types. These can be useful for sharing with people who don''t have SolidWorks.


    To save a drawing as a PDF, go to **File | Save As...** then select **PDF** from
    the **Save as type** drop-down list.


    There are also PDF-specific options that can be accessed by clicking the **Options**
    button.


    > **Specifying Sheet Thickness**

    > If creating sheet metal drawings, remember to specify the sheet thickness that
    is to be used. This can be easy to overlook. It can be added either as a dimension
    or as a separate note.


    In the next section, we will learn how to insert **Flat Pattern** views, which
    detail the Sheet Metal operations needed to actually make the parts from the drawings.

