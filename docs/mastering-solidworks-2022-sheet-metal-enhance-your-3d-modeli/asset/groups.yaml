    \ choice for your needs.\n\n## Steel and aluminum\n\nThe vast majority of sheet\
    \ metal parts around us are made from either steel or aluminum, and of those,\
    \ steel is probably the most common material.\n\n## Advantages and disadvantages\
    \ of steel\n\nSteel is an excellent all-round material, and if you're unsure which\
    \ material to use, then steel is usually a solid choice. Steel is so popular and\
    \ widely used for a number of reasons. It is very strong, easy to weld, and ductile,\
    \ which means it is easy to bend and form compared to more exotic metals. Steel\
    \ is also fairly inexpensive—it can be up to three times cheaper than aluminum\
    \ for the same weight—and is widely available.\n\nMaterial choice is always about\
    \ compromise, so every material will have disadvantages. One of the main downsides\
    \ of steel is that it is quite heavy—around two and a half times denser than aluminum,\
    \ depending on the exact grades used. This means that if you have two pieces that\
    \ are the exact same size and shape, then the steel part will be significantly\
    \ heavier than the aluminum part.\n\nSteel also has poor corrosion protection,\
    \ meaning that it often goes rusty. You will have seen rusty steel items such\
    \ as car bodywork. This rust is corrosion that is caused by a reaction between\
    \ the metal and elements in the environment such as water and oxygen. The rust\
    \ weakens and eventually destroys the metal. Steel can be treated to prevent or\
    \ slow corrosion, but this will add to the material cost, and some other metals\
    \ have much more natural resistance to corrosion.\n"
  mdcn: "\n\n5. **Base Flange** 的宽度可以使用屏幕左侧 **Property Manager** 中的 **Direction 1**（如果需要，还可以使用\
    \ **Direction 2**）选项进行设置。**Sheet Metal** 属性也可以在此阶段设置（见图 1.20）。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_44_0.png)\n\
    \n图 1.20：创建 Base Flange\n\n6. 按下 **OK** 来创建 **Base Flange**。可以看到，这会创建一个简单的矩形 **Base\
    \ Flange**，类似于第一部分中的 **Single Closed Profile** 示例。\n\n这样，**Single Open Contour\
    \ Base Flange** 可以被视为类似于普通实体建模中的 **Thin Feature Extrude** 选项。\n\n## 创建更复杂的 Base\
    \ Flange 形状\n\n使用 Single Open Contour 选项的真正优点在于，它允许你在一个特征中轻松创建更复杂、弯曲的形状。\n\n-\
    \ 1. 开始一个新的零件文档，并在适当的平面上开始草图，例如 Front Plane。\n- 2. 使用 Line 工具绘制更复杂的形状。图 1.21 中可以看到一个示例\
    \ Z 或折弯形状。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_45_0.png)\n\n图 1.21：更复杂的\
    \ Single Open Contour 草图\n\n- 3. 从 Sheet Metal 工具中选择 Base Flange/Tab 并设置所需选项。示例设置可以是：\n\
    \  - Width: 10mm, Direction 1\n  - Thickness: 2mm\n  - Bend Radius: 1mm\n\n4.\
    \ 按下 **OK** 来创建 **Base Flange**（*图 1.22*）。可以看到，尽管底层草图有尖角，实际的 **Base Flange** 特征已使用在\
    \ **Sheet Metal** 属性中指定的 **Bend Radius** 自动创建了弯曲角：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_46_0.png)\n\
    \n图 1.22：Single Open Contour Base Flange\n\n使用 **Single Open Contours** 来创建 **Base\
    \ Flanges** 可以成为简化生产诸如简单支架等零件的好方法。\n\n请注意，这类草图不仅限于使用直线——如果需要，也可以使用圆弧和样条曲线。\n\n\
    ## 展平零件\n\n现在我们已经创建了一个带有弯曲的 *part*，我们可以探索如何将 3D Sheet Metal *parts* 展平。展平是 SolidWorks\
    \ Sheet Metal 模块的一项功能，确实为设计流程增加了巨大价值，因为它允许 *parts* 从成品状态准确转换为可从平板材料轻松制作的状态。\n\n\
    要展平 Sheet Metal 零件：\n\n- 1. 在 Sheet Metal 零件内部，从 Sheet Metal 选项卡或工具栏中选择 Flatten\
    \ 选项（图 1.23 中标记为 i）。\n- 2. 零件将被展开为平板。请注意虚线轮廓，它表示展平零件的边界框，以及草图线，它们显示了弯曲线的所在位置（图\
    \ 1.23 中标记为 ii）。\n- 3. 如果你的弯曲线不可见，请尝试进入 View | Hide/Show | Sketches。\n- 4. 还请注意，FeatureManager\
    \ 设计树末尾的 Flat-Pattern 文件夹现在已取消抑制，因此不再变灰（图 1.23 中标记为 iii）。\n\n使用 Flatten 选项本质上是取消抑制（或打开）Flat-Pattern\
    \ 文件夹，从而展平零件。如果展开 Flat-Pattern 文件夹，则可以看到 Flat Pattern 特征，其中包含零件的弯曲细节。\n\n- 5.\
    \ 要取消展平——或折叠——零件，只需再次单击 Sheet Metal 选项卡或工具栏上的 Flatten 按钮，或单击图形区域右上角可见的 Flatten\
    \ 按钮（图 1.23 中标记为 iv）。请注意，零件折叠起来，并且 Flat-Pattern 文件夹现在再次被抑制（或关闭）。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_47_0.png)\n\
    \n图 1.23：Flatten 选项\n\nFlatten 选项是 SolidWorks Sheet Metal 的一个重要方面，允许零件展开。随着我们阅读本书并学习\
    \ Sheet Metal 工具，我们将在更实际的场景中看到此选项的使用。\n\n## Base Flange 选项和展平零件的回顾\n\n有三种类型的 Base\
    \ Flange（见图 1.24）：\n\n- 1. **Single Closed Profile**：这是最基本类型的 Base Flange之一，使用一个完全封闭的单一轮廓，例如简单的矩形或正方形。虽然它很简单，但这种类型的\
    \ Base Flange 非常有用，很可能构成 Sheet Metal 零件的大多数 Base Flanges。\n- 2. **Multiple Contained\
    \ Closed**：封闭轮廓也可以包含较小的封闭轮廓，例如切口和孔。虽然这种类型的 Base Flange 在某些情况下可能有用，但通常更好的做法是使用\
    \ Single Closed Profile 创建简单的 Base Flange，然后将任何额外的孔、切口或细节作为单独的特征添加。这样在后期修改这些特征会容易得多。\n\
    - 3. **Single Open Contour**：Base Flange 也可以使用由线、圆弧和样条等单个草图实体组成的集合创建。这种类型的 Base\
    \ Flange 在创建支架等物品时可能很有用。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_48_0.png)\n\
    \n图 1.24：Base Flange 类型；从左到右：Single Closed Profile、Multiple Contained Closed、Single\
    \ Open Contour\n\n展平是 SolidWorks Sheet Metal 的一个重要方面，带弯曲的零件可以通过从 Sheet Metal 工具中选择\
    \ Flatten 选项轻松展平。这将取消抑制 Flat-Pattern 文件夹并展开零件中的任何弯曲。\n\n到目前为止，本章中我们学习了如何开始 Sheet\
    \ Metal 零件以及如何创建这些零件的大多数第一个特征——Base Flange。我们还研究了如何编辑对这些零件很重要的各种 Sheet Metal 属性。因此，现在我们对如何开始虚拟\
    \ Sheet Metal 零件有了一个合理的概念，我们将简要进入钣金的一个现实世界方面，并查看可用的各种钣金材料。\n\n## 选择钣金材料时的注意事项\n\
    \n有数十种金属可用于制造钣金零件，这些金属在用途、物理性能、成本和可用性方面各不相同。以下页面将给你一个概念，哪些可能最适合你的项目。\n\n本节并非材料的详尽清单；它只是你可能遇到的一些最常见材料的概述。在这些材料中，还有许多特定的等级（子类型），每种都有略微不同的性能。如有疑问，请与你的钣金制造商和材料供应商讨论你的需求和预算，以找到最适合你需求的选择。\n\
    \n## 钢和铝\n\n我们周围绝大多数钣金零件都是由钢或铝制成的，其中钢可能是最常见的材料。\n\n## 钢的优点和缺点\n\n钢是一种出色的通用材料，如果你不确定使用哪种材料，钢通常是一个稳妥的选择。钢之所以如此受欢迎和广泛使用，有很多原因。它非常坚固，易于焊接，并且具有延展性，这意味着与更奇特的金属相比，它更容易弯曲和成形。钢也相当便宜——对于相同重量而言，它的价格可能比铝便宜三倍——并且供应广泛。\n\
    \n材料选择总是有取舍的，因此每种材料都会有缺点。钢的主要缺点之一是它相当重——密度约为铝的二点五倍，具体取决于使用的确切等级。这意味着如果有两个大小和形状完全相同的零件，那么钢零件会比铝零件重得多。\n\
    \n钢还具有较差的耐腐蚀性，这意味着它经常会生锈。你见过生锈的钢制品，例如汽车车身。这种锈是金属与环境中的水和氧气等元素发生反应引起的腐蚀。锈会削弱并最终破坏金属。钢可以经过处理以防止或减缓腐蚀，但这会增加材料成本，而其他一些金属具有更自然的耐腐蚀性。\n\
    \n"
