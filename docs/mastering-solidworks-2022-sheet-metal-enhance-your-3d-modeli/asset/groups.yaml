    \n![](img/4e9c736de6bac4449096a7b92c28af4c_45_0.png)\n\nFigure 1.21: A more complex\
    \ Single Open Contour sketch\n\n- 3. Select Base Flange/Tab from the Sheet Metal\
    \ tools and set your desired options. Example settings could be:\n  - Width: 10mm,\
