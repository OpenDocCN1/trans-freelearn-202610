    ![](img/4e9c736de6bac4449096a7b92c28af4c_273_0.png)


    图 13.10 – 在 Miter Flange 壁的小上表面上绘制 Corner Rectangle


    - 2. 现在，我们可以使用 Relations 将矩形的各边固定到底座的各边上。此方法比仅使用 **Center Rectangle** 并通过 Smart
    Dimension 设置尺寸要稍长一些，但这意味着如果以后底座尺寸发生变化，盖子的尺寸将自动更新以匹配。


    依次选择草图矩形的一条边，然后再选择下方底座的对应边（按住 Ctrl 键以选择多个项目。请注意，从俯视图中操作会更容易）。


    然后，使两个所选项目 Collinear。可以通过从小弹出菜单中选择 Make Collinear 来完成，也可以通过左侧 Property Manager
    的 Add Relations 部分选择 Collinear：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_274_0.png)


    图 13.11 – 使草图矩形的各边与现有底座 Collinear


    - 3. 对其余三条边继续此过程，以便整个矩形完全定义并与下方的底座部分相链接（图 13.12）：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_275_0.png)


    图 13.12 – 将矩形草图链接到底座


    4. 我们现在可以使用完全定义的矩形来创建盖板。


    选择 Base Flange/Tab 工具。然后，在按 OK 之前，取消选中 Merge Result 框。这意味着新的 Base Flange 将作为零件内的全新板单独创建，而不是与现有底板合并。


    你可能还需要翻转新 Base Flange 的方向，以确保它不会与现有底座特征冲突（图 13.13）。这可以通过单击 Reverse direction 框来完成：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_275_1.png)


    ![](img/4e9c736de6bac4449096a7b92c28af4c_275_2.png)


    图 13.13 – 如有需要，反转盖板法兰的方向


    5. 按 OK 创建盖板。我们现在可以看到 FeatureManager 设计树中的 Cut list 文件夹（图 13.14）显示了两个不同的板——一个用于底座，一个用于盖子。如果展开该文件夹，我们可以分别显示或隐藏每个板。


    请注意，如果你的 Cut list 文件夹显示为单个板，则尝试编辑最新的 Base Flange/Tab 特征并确保未选中 Merge result 选项：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_276_0.png)


    图 13.14 – Cut list 文件夹，显示两个板


    6. 我们现在可以看到基本盖板特征已制作完成，但目前它只是一个单一的平板。根据厚度，该板在受载时可能会弯曲且缺乏刚性。它也可能在底座上表面滑动。为了解决这两个问题，我们可以在盖子上添加一些小的悬垂侧边：


    - I. 选择 Edge Flange 工具并用其为短的前缘和两个较长的侧缘添加法兰（图 13.15）。这些法兰可以长 10mm，角度为 90°。

    - II. 选择 Material Outside 法兰位置，以确保新的 Edge Flanges 不会与底板重叠：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_277_0.png)


    图 13.15 – 在盖子上添加三个 Edge Flanges


    7. 按 OK 创建三个 Edge Flanges。请注意，我们没有为后缘添加法兰。这是因为在现实生活中，盖子可以用长钢琴铰链连接到底座（图 13.16）：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_277_1.png)


    图 13.16 – 用于连接盖子和底座的钢琴铰链示例


    8. 新 Edge Flanges 的后角仍然是方形的，可能会很锋利，因此使用 Break Corner/Corner Trim 选项将其倒角，使用 5mm
    圆角将其圆滑（图 13.17）：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_278_0.png)


    图 13.17 – 使用 5mm 圆角打断后角


    现在，我们有一个相当简单的底座和盖子，但如果仔细观察两块板如何配合，我们可能会发现一个问题。盖子目前正好落在底座上，没有间隙（图 13.18）。它们大小相同：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_278_1.png)


    图 13.18 – 盖子和底座之间没有间隙


    这可能会导致问题，因为在现实生活中，零件永远不会与 SolidWorks 中的模型完全相同大小。它们由于制造限制总是会略大或略小。设计零件尺寸与制造零件尺寸之间的这种差异称为
    **tolerance**。


    例如，一个 *10mm* 长的零件可能被指定为 *10.0±1mm*。这将使实际零件的尺寸在 *9.0mm* 到 *11.0mm* 之间。


    公差可以减小（尽管更紧的公差会导致制造成本增加），但永远无法完全消除。因此，我们始终应在应配合在一起的两个零件之间设计间隙（除非我们希望设计中采用极其紧密的过盈配合）。


    对于我们的示例，这意味着我们应在盖板和底板之间留出间隙。这意味着如果盖子制造低于公差（比 SolidWorks 模型略小）而底座制造略高于公差（比 SolidWorks
    模型稍大），则两块板仍能配合。


    要添加此间隙，我们只需编辑 **Edge Flanges** 并将其向外移动：


    - 1. 编辑 **Edge Flange** 特征并从 **Flange Position** 部分选择 **Offset** 选项。确切的间隙量取决于公差——由你的预算、制造工艺和设计要求决定——但在本例中，输入
    0.5mm 的值（*图 13.19*）：


    ![](img/4e9c736de6bac4449096a7b92c28af4c_279_0.png)


    图 13.19 – 在盖子上偏移 Edge Flanges


