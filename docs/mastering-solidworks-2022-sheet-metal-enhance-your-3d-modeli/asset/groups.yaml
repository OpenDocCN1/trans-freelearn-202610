  - '[PAGE 31]


    ![](img/4e9c736de6bac4449096a7b92c28af4c_31_0.png)


    Figure 1.8: Sheet Metal properties


    This **Thickness** setting is global throughout the entire *part*, so any new
    features that are added, such as **Edge Flanges**, will also be made using this
    same thickness. Editing one single value in the `Sheet-Metal` folder provides
    a very simple way to adjust the entire *part* and all of the features that make
    it up.


    # Editing the Bend Radius


    Along with the thickness, another very important property of Sheet Metal *parts*
    is the **Bend Radius**.


    Whenever a flat sheet of metal is bent or folded to create 3D parts, the corners
    that are created by the bending process will never be completely square. Even
    with a very thin and flexible material, such as aluminium foil, a small bend radius
    is needed.'
  - '[PAGE 32]


    This is also true in SolidWorks Sheet Metal: a bend radius is always required
    (Figure 1.9), even if it is tiny.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_32_0.png)


    Figure 1.9: A bend radius is always needed


    In SolidWorks Sheet Metal the Bend Radius refers to the size of the inside of
    bends, and it can be set in the Sheet Metal properties.


    Simply edit the Sheet Metal properties and adjust the value (labeled ii in Figure
    1.8).


    By default, the Bend Radius that is set in the Sheet Metal properties will apply
    to any features that are added to the part, although the Bend Radius can be overridden
    for specific bends, and this will be covered later in the book.


    # What size should we set the Bend Radius to?


    Although setting the Bend Radius value itself is straightforward, how do we actually
    know what value to use for it? Bend Radius depends on a number of factors, such
    as the material type, the manufacturing method, and the thickness of the material.
    In general, as the sheet thickness increases, the bend radius value also increases.
    To visualize this, think about bending a very thin sheet of metal foil, compared
    to bending a thick plate—the thinner sheet will allow a much tighter bend to be
    created.'
  - '[PAGE 33]


    General figures for steel bending might be something like this:


    | Sheet Thickness | Bend Radius |

    |---|---|

    | 1mm | R1.4mm |

    | 2mm | R1.88mm |

    | 3mm | R2.75mm |

    | 4mm | R3.0mm |

    | 5mm | R3.6mm |


    There are a number of ways to determine the **Bend Radius.**


    +   - **Speak to your manufacturer.** The most reliable method of determining
    the **Bend Radius** is usually to talk directly to the people making your *parts*.
    Tell them what you''re planning to create, and the material type and thickness,
    and they should be able to recommend certain settings to use.

    +   - **Search online or in reference books.** Try searching for a phrase such
    as `1mm thick steel bending radius`. The results should give you a good idea of
    suitable values to start your design, which can then be fine-tuned at a later
    stage by adjusting the Sheet Metal properties.

    +   - **Use the SolidWorks Gauge Tables.** Gauge numbers are a way of measuring
    the thickness of metal sheets based on weight. SolidWorks contains gauge tables
    that are a list of preset sizes that are built into SolidWorks Sheet Metal. They
    can be used to find common **Bend Radius** values.


    To activate the **Gauge Tables:**


    +   I. Put a check in the **Use gauge table** box at the top of the **Sheet Metal**
    properties (labeled iii in *Figure 1.8*). A table can then be selected from the
    drop-down list.


    > **Note**

    > SolidWorks Gauge Tables require Microsoft Excel to be installed on the computer
    and will not work without it.


    +   II. Try selecting a table such as the `SAMPLE TABLE - STEEL` (*Figure 1.10*).
    The thickness of the Sheet Metal *part* can now be set using the gauge numbers
    from the dropdown list, rather than the specific thickness value.'
  - '[PAGE 34]


    III. Experiment with different sizes to see how the gauge number relates to actual
    thickness:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_34_0.png)


    Figure 1.10: Using the Gauge Tables


    Note

    A higher gauge number corresponds to a thinner sheet. It can be seen in Figure
    1.10 that 4 Gauge steel is 5.69mm thick, whereas 16 Gauge steel is only 1.51mm
    thick.'
  - "[PAGE 35]\n\nAs the gauge number is changed, you'll notice that the **Bend Radius**\
    \ value also automatically changes to correspond to the new sheet sizes. As expected,\
    \ thicker sheets require a higher **Bend Radius** value.\n\n> **Exercise Caution\
    \ When Using Gauge Numbers!**\n> Gauge numbers are specific to the material used,\
    \ so confusion is easily caused. For example, a given gauge number of steel is\
    \ **not the same thickness** as one in aluminum. **16 Gauge** steel is 1.52mm\
    \ thick, but **16 Gauge** aluminum is only 1.29mm thick. For this reason, many\
    \ international standards organizations recommend against the use of gauge numbers\
    \ and instead suggest specifying the sheet thickness using dimensions.\n> \n>\
    \ The Gauge Tables can give a good indication of bend radii, but I recommend using\
    \ them as a guide only, and instead directly setting and specifying sheet thicknesses.\n\
    \nThe **Bend Radius** is a vital *aspect* of SolidWorks Sheet Metal and is needed\
    \ for every bent *part*. It can be set in the **Sheet Metal** properties as a\
    \ global value, but can also be overridden for certain bends if needed.\n\nGet\
    \ an idea of the **Bend Radius** needed by either speaking to your manufacturer,\
    \ searching online, or using **Gauge Tables**. However, if using gauge numbers\
    \ and tables, be careful to ensure your material choice is correct and clearly\
    \ marked on any drawings. It is wise to use gauge tables as a guide only, and\
    \ instead (or in addition to this) specify an exact sheet thickness.\n\n# Understanding\
    \ the Bend Allowance\n\nThe next Sheet Metal property that affects your models\
    \ is the **Bend Allowance** property (labeled *iv* in *Figure 1.8*). This allows\
    \ us to accurately calculate the size of bent *parts* once they have been unfolded\
    \ into a flat sheet."
  - '[PAGE 36]


    To understand what exactly the **Bend Allowance** property is and why it is important,
    let''s look at a simple *part* from the side. This consists of a **Base Flange**
    and one single **Edge Flange**, as illustrated in Figure 1.11.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_36_0.png)


    Figure 1.11: Understanding the Bend Allowance property


    We can see that the size of the Sheet Metal *part* will be the length of the **Base
    Flange** (A in Figure 1.11) plus the length of the **Edge Flange** (B in Figure
    1.11), plus the size of the area of the bend itself (**BA** or Bend Allowance
    in Figure 1.11). Therefore, when the *part* is flattened, the total size of the
    sheet that we require will be **A + B + BA**.


    However, depending on how and where the bend length (**BA**) is measured, we may
    end up with different values. For example, if the inside of the bend is measured,
    the length may be 5mm, but if the outside of the bend is measured then the length
    will be longer—15mm in this case, as illustrated in Figure 1.12.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_36_1.png)


    Figure 1.12: The size of the bend depends on where exactly is measured'
  - '[PAGE 37]


    The length of **BA** is determined by the **Bend Allowance** in the **Sheet Metal**
    properties, and there are a number of different options to set the **Bend Allowance**.


    These **Bend Allowance** options are:


    +   - **Bend Table**

    +   - **K-Factor**

    +   - **Bend Allowance**

    +   - **Bend Deduction**

    +   - **Bend Calculation**


    Each option will give slightly different end results, but if you''re unsure which
    option to use, then it''s usually best to use the **K-Factor** bend allowance.


    > **What Is the K-Factor Bend Allowance?**

    > K-Factor is a way of working out the size needed for bends in sheet metal. Whenever
    a metal sheet is bent, there will always be a region of the bend, inside the bend,
    where the material is compressed, and another region, outside of the bend, where
    the material is stretched. At a certain point within a cross-section of the sheet,
    there will be a boundary where the compression and stretching exactly cancel each
    other out. Along this boundary, there will be no change of length in the material.
    The K-Factor is the name given to a line along this boundary, where no change
    in length occurs between flat and folded parts (Figure 1.13).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_37_0.png)


    Figure 1.13: The K-Factor is an imaginary line through a cross-section of the
    material, where there is no change in size between the bent part and the flat
    part'
  md: "\n![](img/4e9c736de6bac4449096a7b92c28af4c_31_0.png)\n\nFigure 1.8: Sheet Metal\
    \ properties\n\nThis **Thickness** setting is global throughout the entire *part*,\
    \ so any new features that are added, such as **Edge Flanges**, will also be made\
    \ using this same thickness. Editing one single value in the `Sheet-Metal` folder\
    \ provides a very simple way to adjust the entire *part* and all of the features\
    \ that make it up.\n\n## Editing the Bend Radius\n\nAlong with the thickness,\
    \ another very important property of Sheet Metal *parts* is the **Bend Radius**.\n\
    \nWhenever a flat sheet of metal is bent or folded to create 3D parts, the corners\
    \ that are created by the bending process will never be completely square. Even\
    \ with a very thin and flexible material, such as aluminium foil, a small bend\
    \ radius is needed.\n\nThis is also true in SolidWorks Sheet Metal: a bend radius\
    \ is always required (Figure 1.9), even if it is tiny.\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_32_0.png)\n\
    \nFigure 1.9: A bend radius is always needed\n\nIn SolidWorks Sheet Metal the\
    \ Bend Radius refers to the size of the inside of bends, and it can be set in\
    \ the Sheet Metal properties.\n\nSimply edit the Sheet Metal properties and adjust\
    \ the value (labeled ii in Figure 1.8).\n\nBy default, the Bend Radius that is\
    \ set in the Sheet Metal properties will apply to any features that are added\
    \ to the part, although the Bend Radius can be overridden for specific bends,\
    \ and this will be covered later in the book.\n\n## What size should we set the\
    \ Bend Radius to?\n\nAlthough setting the Bend Radius value itself is straightforward,\
    \ how do we actually know what value to use for it? Bend Radius depends on a number\
    \ of factors, such as the material type, the manufacturing method, and the thickness\
    \ of the material. In general, as the sheet thickness increases, the bend radius\
    \ value also increases. To visualize this, think about bending a very thin sheet\
    \ of metal foil, compared to bending a thick plate—the thinner sheet will allow\
    \ a much tighter bend to be created.\n\nGeneral figures for steel bending might\
    \ be something like this:\n\n| Sheet Thickness | Bend Radius |\n|---|---|\n| 1mm\
    \ | R1.4mm |\n| 2mm | R1.88mm |\n| 3mm | R2.75mm |\n| 4mm | R3.0mm |\n| 5mm |\
    \ R3.6mm |\n\nThere are a number of ways to determine the **Bend Radius.**\n\n\
    - **Speak to your manufacturer.** The most reliable method of determining the\
    \ **Bend Radius** is usually to talk directly to the people making your *parts*.\
    \ Tell them what you're planning to create, and the material type and thickness,\
    \ and they should be able to recommend certain settings to use.\n- **Search online\
    \ or in reference books.** Try searching for a phrase such as `1mm thick steel\
    \ bending radius`. The results should give you a good idea of suitable values\
    \ to start your design, which can then be fine-tuned at a later stage by adjusting\
    \ the Sheet Metal properties.\n- **Use the SolidWorks Gauge Tables.** Gauge numbers\
    \ are a way of measuring the thickness of metal sheets based on weight. SolidWorks\
    \ contains gauge tables that are a list of preset sizes that are built into SolidWorks\
    \ Sheet Metal. They can be used to find common **Bend Radius** values.\n\nTo activate\
    \ the **Gauge Tables:**\n\n- I. Put a check in the **Use gauge table** box at\
    \ the top of the **Sheet Metal** properties (labeled iii in *Figure 1.8*). A table\
    \ can then be selected from the drop-down list.\n\n> **Note**\n> SolidWorks Gauge\
    \ Tables require Microsoft Excel to be installed on the computer and will not\
    \ work without it.\n\n- II. Try selecting a table such as the `SAMPLE TABLE -\
    \ STEEL` (*Figure 1.10*). The thickness of the Sheet Metal *part* can now be set\
    \ using the gauge numbers from the dropdown list, rather than the specific thickness\
    \ value.\n\nIII. Experiment with different sizes to see how the gauge number relates\
    \ to actual thickness:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_34_0.png)\n\
    \nFigure 1.10: Using the Gauge Tables\n\nNote\nA higher gauge number corresponds\
    \ to a thinner sheet. It can be seen in Figure 1.10 that 4 Gauge steel is 5.69mm\
    \ thick, whereas 16 Gauge steel is only 1.51mm thick.\n\nAs the gauge number is\
    \ changed, you'll notice that the **Bend Radius** value also automatically changes\
    \ to correspond to the new sheet sizes. As expected, thicker sheets require a\
    \ higher **Bend Radius** value.\n\n> **Exercise Caution When Using Gauge Numbers!**\n\
    > Gauge numbers are specific to the material used, so confusion is easily caused.\
    \ For example, a given gauge number of steel is **not the same thickness** as\
    \ one in aluminum. **16 Gauge** steel is 1.52mm thick, but **16 Gauge** aluminum\
    \ is only 1.29mm thick. For this reason, many international standards organizations\
    \ recommend against the use of gauge numbers and instead suggest specifying the\
    \ sheet thickness using dimensions.\n> \n> The Gauge Tables can give a good indication\
    \ of bend radii, but I recommend using them as a guide only, and instead directly\
    \ setting and specifying sheet thicknesses.\n\nThe **Bend Radius** is a vital\
    \ *aspect* of SolidWorks Sheet Metal and is needed for every bent *part*. It can\
    \ be set in the **Sheet Metal** properties as a global value, but can also be\
    \ overridden for certain bends if needed.\n\nGet an idea of the **Bend Radius**\
    \ needed by either speaking to your manufacturer, searching online, or using **Gauge\
    \ Tables**. However, if using gauge numbers and tables, be careful to ensure your\
    \ material choice is correct and clearly marked on any drawings. It is wise to\
    \ use gauge tables as a guide only, and instead (or in addition to this) specify\
    \ an exact sheet thickness.\n\n## Understanding the Bend Allowance\n\nThe next\
    \ Sheet Metal property that affects your models is the **Bend Allowance** property\
    \ (labeled *iv* in *Figure 1.8*). This allows us to accurately calculate the size\
    \ of bent *parts* once they have been unfolded into a flat sheet.\n\nTo understand\
    \ what exactly the **Bend Allowance** property is and why it is important, let's\
    \ look at a simple *part* from the side. This consists of a **Base Flange** and\
    \ one single **Edge Flange**, as illustrated in Figure 1.11.\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_36_0.png)\n\
    \nFigure 1.11: Understanding the Bend Allowance property\n\nWe can see that the\
    \ size of the Sheet Metal *part* will be the length of the **Base Flange** (A\
    \ in Figure 1.11) plus the length of the **Edge Flange** (B in Figure 1.11), plus\
    \ the size of the area of the bend itself (**BA** or Bend Allowance in Figure\
    \ 1.11). Therefore, when the *part* is flattened, the total size of the sheet\
    \ that we require will be **A + B + BA**.\n\nHowever, depending on how and where\
    \ the bend length (**BA**) is measured, we may end up with different values. For\
    \ example, if the inside of the bend is measured, the length may be 5mm, but if\
    \ the outside of the bend is measured then the length will be longer—15mm in this\
    \ case, as illustrated in Figure 1.12.\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_36_1.png)\n\
    \nFigure 1.12: The size of the bend depends on where exactly is measured\n\nThe\
    \ length of **BA** is determined by the **Bend Allowance** in the **Sheet Metal**\
    \ properties, and there are a number of different options to set the **Bend Allowance**.\n\
    \nThese **Bend Allowance** options are:\n\n- **Bend Table**\n- **K-Factor**\n\
    - **Bend Allowance**\n- **Bend Deduction**\n- **Bend Calculation**\n\nEach option\
    \ will give slightly different end results, but if you're unsure which option\
    \ to use, then it's usually best to use the **K-Factor** bend allowance.\n\n>\
    \ **What Is the K-Factor Bend Allowance?**\n> K-Factor is a way of working out\
    \ the size needed for bends in sheet metal. Whenever a metal sheet is bent, there\
    \ will always be a region of the bend, inside the bend, where the material is\
    \ compressed, and another region, outside of the bend, where the material is stretched.\
    \ At a certain point within a cross-section of the sheet, there will be a boundary\
    \ where the compression and stretching exactly cancel each other out. Along this\
    \ boundary, there will be no change of length in the material. The K-Factor is\
    \ the name given to a line along this boundary, where no change in length occurs\
    \ between flat and folded parts (Figure 1.13).\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_37_0.png)\n\
    \nFigure 1.13: The K-Factor is an imaginary line through a cross-section of the\
    \ material, where there is no change in size between the bent part and the flat\
    \ part\n"
  mdcn: "\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_31_0.png)\n\n图 1.8：钣金属性\n\n\
    此 **厚度** 设置在整个 *零件* 中都是全局的，因此添加的任何新特征，例如 **边缘法兰**，也将使用相同的厚度进行制作。编辑 `Sheet-Metal`\
    \ 文件夹中的单个值即可非常简单地调整整个 *零件* 以及构成它的所有特征。\n\n## 编辑弯曲半径\n\n除了厚度之外，钣金 *零件* 的另一个非常重要的属性是\
    \ **弯曲半径**。\n\n每当将一块平坦的金属板弯曲或折叠以创建 3D 零件时，弯曲过程中产生的拐角永远不会完全呈方形。即使使用非常薄且柔韧的材料，例如铝箔，也需要一个很小的弯曲半径。\n\
    \n在 SolidWorks 钣金中也是如此：弯曲半径始终是必需的（图 1.9），即使它很小。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_32_0.png)\n\
    \n图 1.9：始终需要弯曲半径\n\n在 SolidWorks 钣金中，弯曲半径指的是弯曲内部的大小，可在钣金属性中设置。\n\n只需编辑钣金属性并调整值（图\
    \ 1.8 中标记为 ii）。\n\n默认情况下，钣金属性中设置的弯曲半径将应用于添加到零件的任何特征，尽管可以为特定弯曲覆盖弯曲半径，这将在本书后面介绍。\n\
    \n## 我们应该将弯曲半径设置为多大？\n\n尽管设置弯曲半径值本身很简单，但我们如何知道要使用什么值？弯曲半径取决于多种因素，例如材料类型、制造方法和材料的厚度。一般来说，随着板厚增加，弯曲半径值也会增加。为了形象化这一点，请考虑弯曲一薄片金属箔与弯曲一块厚板的区别——较薄的板可以形成更紧密的弯曲。\n\
    \n钢材弯曲的一般数值可能如下：\n\n| 板厚 | 弯曲半径 |\n|---|---|\n| 1mm | R1.4mm |\n| 2mm | R1.88mm\
    \ |\n| 3mm | R2.75mm |\n| 4mm | R3.0mm |\n| 5mm | R3.6mm |\n\n确定 **弯曲半径** 有多种方法。\n\
    \n- **咨询您的制造商。** 确定 **弯曲半径** 的最可靠方法通常是直接与制作您 *零件* 的人员交谈。告诉他们您计划创建的内容、材料类型和厚度，他们应该能够推荐使用的设置。\n\
    - **在线或参考书籍中搜索。** 尝试搜索诸如 `1mm thick steel bending radius` 之类的短语。结果应能让您对设计开始时合适的数值有一个大致了解，然后可以通过调整钣金属性在后期进行微调。\n\
    - **使用 SolidWorks 规格表。** 规格号是根据重量测量金属板厚度的一种方法。SolidWorks 包含规格表，即内置于 SolidWorks\
    \ 钣金中的预设尺寸列表。它们可用于查找常见的 **弯曲半径** 值。\n\n激活 **规格表**：\n\n- I. 在 **钣金** 属性顶部勾选 **Use\
    \ gauge table** 复选框（*图 1.8* 中标记为 iii）。然后可以从下拉列表中选择一个表。\n\n> **注意**\n> SolidWorks\
    \ 规格表要求计算机上安装 Microsoft Excel，否则将无法使用。\n\n- II. 尝试选择诸如 `SAMPLE TABLE - STEEL`\
    \ 的表（*图 1.10*）。钣金 *零件* 的厚度现在可以使用下拉列表中的规格号设置，而不是具体的厚度值。\n\nIII. 尝试不同尺寸以了解规格号与实际厚度之间的关系：\n\
    \n![](img/4e9c736de6bac4449096a7b92c28af4c_34_0.png)\n\n图 1.10：使用规格表\n\n注意\n较高的规格号对应于更薄的板。可以看出图\
    \ 1.10 中 4 号钢为 5.69mm 厚，而 16 号钢仅为 1.51mm 厚。\n\n随着规格号的变化，您会注意到 **弯曲半径** 值也会自动更改以对应新的板尺寸。正如预期的那样，较厚的板需要更高的\
    \ **弯曲半径** 值。\n\n> **使用规格号时请谨慎！**\n> 规格号特定于所用材料，因此很容易引起混淆。例如，钢的给定规格号 **不是** 与铝的相同厚度。**16\
    \ 号** 钢为 1.52mm 厚，但 **16 号** 铝仅为 1.29mm 厚。因此，许多国际标准组织建议不要使用规格号，而应使用尺寸指定板厚。\n>\
    \ \n> 规格表可以很好地指示弯曲半径，但我建议仅将其作为参考，并直接设置和指定板厚。\n\n**弯曲半径** 是 SolidWorks 钣金的一个重要\
    \ *方面*，每个弯曲 *零件* 都需要它。它可以在 **钣金** 属性中作为全局值设置，但如果需要，也可以为某些弯曲覆盖。\n\n通过咨询制造商、在线搜索或使用\
    \ **规格表** 来了解所需的 **弯曲半径**。然而，如果使用规格号和表格，请务必确保材料选择正确，并在任何图纸上明确标注。明智的做法是仅将规格表作为参考，并另外指定确切的板厚。\n\
    \n## 理解弯曲补偿\n\n影响模型下一个钣金属性是 **弯曲补偿** 属性（图 1.8 中标记为 *iv*）。这使我们能够在将弯曲 *零件* 展开为平板后准确计算其尺寸。\n\
    \n为了了解 **弯曲补偿** 属性到底是什么以及为什么它很重要，让我们从侧面看一个简单的 *零件*。它由一个 **底板法兰** 和一个 **边缘法兰**\
    \ 组成，如图 1.11 所示。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_36_0.png)\n\n图 1.11：理解弯曲补偿属性\n\
    \n我们可以看到钣金 *零件* 的尺寸将是 **底板法兰** 的长度（图 1.11 中的 A）加上 **边缘法兰** 的长度（图 1.11 中的 B），再加上弯曲区域本身的大小（图\
    \ 1.11 中的 **BA** 或弯曲补偿）。因此，当 *零件* 展平时，我们所需的板材总尺寸将为 **A + B + BA**。\n\n然而，根据弯曲长度（**BA**）的测量位置和方式，我们可能会得到不同的值。例如，如果测量弯曲的内侧，长度可能为\
    \ 5mm，但如果测量弯曲的外侧，则长度会更长——本例中为 15mm，如图 1.12 所示。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_36_1.png)\n\
    \n图 1.12：弯曲的大小取决于具体测量位置\n\n**BA** 的长度由 **钣金** 属性中的 **弯曲补偿** 决定，并且有多种设置 **弯曲补偿**\
    \ 的选项。\n\n这些 **弯曲补偿** 选项为：\n\n- **Bend Table**\n- **K-Factor**\n- **Bend Allowance**\n\
    - **Bend Deduction**\n- **Bend Calculation**\n\n每个选项都会产生略有不同的最终结果，但如果您不确定使用哪个选项，通常最好使用\
    \ **K-Factor** 弯曲补偿。\n\n> **什么是 K-Factor 弯曲补偿？**\n> K-Factor 是计算钣金弯曲所需尺寸的一种方法。每当金属板被弯曲时，弯曲内部总会有一个区域材料被压缩，弯曲外部的另一个区域材料被拉伸。在板材横截面的某个点，压缩和拉伸会完全相互抵消。在此边界上，材料长度不会发生变化。K-Factor\
    \ 是指沿此边界的一条线，在该线上平坦零件和折叠零件之间长度没有变化（图 1.13）。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_37_0.png)\n\
    \n图 1.13：K-Factor 是材料横截面中一条假想线，在该线上弯曲零件与平坦零件之间尺寸没有变化\n\n"
