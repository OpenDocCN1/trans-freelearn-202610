    # Unfolding versus flattening


    After flattening the part in the previous section using the **Flatten** feature,
    you may be wondering how this differs from unfolding. If we can simply click one
    button to flatten the model, then why would we add the extra steps that the **Unfold**
    tool needs?


    The first, fairly minor reason is that the **Unfold** feature can be used on specific
    bends only, whereas the **Flatten** button applies to the entire model. However,
    the main reason for using the **Unfold** feature is that the **Flatten** feature
    is a special kind of feature, and it is usually the last feature in the FeatureManager
    Design Tree. When **Flatten** is selected, the feature simply unsuppresses (turns
    back on) the `Flat-Pattern` folder at the end of the model. This, in turn, flattens
    the model. When the model is unflattened, the `Flat-Pattern` folder is suppressed
    (turned off) again, and so any features based on the flattened part will also
    be suppressed. To demonstrate this, follow these next steps:


    +   1. Using the model from the previous section, flatten the model (if it is
    not already flattened) by pressing the **Flatten** button. Note that the `Flat-Pattern`
    folder is now unsuppressed.


