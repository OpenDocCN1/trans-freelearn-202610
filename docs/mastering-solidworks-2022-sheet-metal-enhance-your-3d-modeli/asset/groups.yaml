    Flange** feature.


    **The Advantages of Using a Miter Flange Feature**

    The **Miter Flange** feature allows you to create more complex flange shapes using
    only a single feature, instead of using multiple **Edge Flange** features to build
    the same profile. The **Miter Flange** feature will also automatically miter any
    corners (trim them to fit together properly), whereas not all **Edge Flange**
    types will do this.'
