    \ 的模型，我们可能希望在折弯侧添加一个突出部分。\n- 2. 首先，创建所需轮廓的草图。选择所需面并绘制完全定义的轮廓。在此示例中，一个 50x20mm\
    \ 的截面被添加到现有的 **Edge Flange** 侧面（*Figure 3.8*）。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_85_0.png)\n\
    \nFigure 3.8: New Tab profile sketch\n\n- 3. 最简单的选项似乎是使用 **Features** 选项卡创建 **Extruded\
    \ Boss/Base** 特征。选择此工具显示我们现在有 **Link to thickness** 选项，但我们仍需确保新部分沿正确方向拉伸。因此，最好使用钣金专用工具。\n\
    - 4. 不要使用 **Extruded Boss/Base** 工具，打开 **Sheet Metal** 选项卡或工具栏并选择 **Base Flange/Tab**\
    \ 工具（此工具可同时创建 **Base Flanges** 和 **Tabs**）。\n- 5. 如有需要，选择我们刚刚绘制的轮廓草图，然后按 **OK**。\n\
    \n现在创建了一个新的 Tab 部分，并且它会自动链接到其所制作的折弯的厚度。\n\n**Note**\n该特征现在在 FeatureManager 设计树中显示为\
    \ **Tab1**。这是因为我们是在现有折弯的基础上构建的，因此 SolidWorks 知道新轮廓应为 **Tab** 而不是新的 **Base Flange**。\n\
    \n**Tab** 特征非常简单，但通常是向现有折弯添加新材料的最有效方法。\n\n> **Using Mirrors, Patterns, and Other\
    \ Standard SolidWorks Features**\n> 通常，钣金模型是对称的或具有重复特征。如果是这种情况，则可以使用 **Mirrors**\
    \ 和 **Patterns** 等特征来加快工作流程。有时，可以创建模型的一半（甚至四分之一），然后 **Mirror** 其余特征以创建其他部分。\n\
    > \n> Tabs 以及许多其他钣金特征，如 **Edge Flanges**，可以与 **Mirror** 和 **Pattern** 特征一起使用，就像标准\
    \ SolidWorks 特征一样。\n\n添加和移除材料是钣金建模的基础部分，有多种方法可以实现。当创建孔时，通常最好使用 **Hole Wizard**，但其他形状可以用\
    \ **Extruded Cut** 选项切出。**Base Flange/Tab** 工具提供了一种快速简便的方式在需要时添加额外材料。\n\n## Using\
    \ the Miter Flange tool\n\n我们要探索的下一个工具是 **Miter Flange** 工具。可以用它向一个或多个边缘添加折弯，在许多方面与\
    \ **Edge Flange** 工具相似。然而，**Miter Flange** 工具要求您绘制折弯的横截面轮廓，从而可以相当容易地创建更复杂的折弯。\n\
    \n要创建 **Miter Flange**，请按如下操作：\n\n- 1. 打开上一节中的 **Base Flange** *零件* 并删除任何额外的折弯、切口或\
    \ Tabs，以便仅保留 **Base Flange**。或者，您可以开始一个新的 *零件* 文档并创建尺寸为 200×300mm、厚度为 1mm 的 **Base\
    \ Flange**。\n\n- 2. 创建 **Miter Flange** 的最重要步骤是绘制折弯的横截面轮廓。这可以在选择 **Miter Flange**\
    \ 工具之前完成，也可以在先选择工具后提示您选择或绘制草图。\n  \n- 两种方法产生相同的最终结果且非常相似。在此示例中，我们将先绘制草图。\n\n-\
    \ 3. 草图 *需要垂直于* **Miter Flange** 将要制作的边缘。因此，放大 **Base Flange**，选择一个小端面，如 *Figure\
    \ 3.9* 所示，并开始草图：\n\n"
