  - '[PAGE 117]


    In the next section, we learn how to export Sheet Metal parts in formats that
    can be used to create real-life parts.


    # Exporting Sheet Metal parts for manufacturing


    Paper drawings are a very useful way of displaying how exactly your Sheet Metal
    parts will be made, but the initial Flat Pattern will likely be cut out of a larger
    sheet using a machine such as a laser or plasma cutter. To do this, a 2D file
    of the flattened part is needed.


    There are many file formats for these 2D files, but the two most commonly used
    are DXF and DWG files. These two file types are both very similar; they are both
    2D vector files that create a drawing from entities such as lines and arcs.


    DXF and DWG files can often be used interchangeably, but DWG files are actually
    a proprietary format of Autodesk (the makers of AutoCAD), whereas DXF files are
    more open source. For this reason, DXF files tend to be more widely used, and
    in my experience, they work with a larger range of other software and manufacturing
    machines.


    DWG files can be useful if you are working with AutoCAD (because they contain
    specific AutoCAD information), but since we are using SolidWorks, I recommend
    using DXF files.


    To export your Sheet Metal parts as DXFs:


    +   1. First, flatten your part from the previous section by selecting **Flatten**
    from the **Sheet Metal** tools.

    +   2. Go to a **Top-down** view or select the top face of the sheet and go to
    a **Normal To** view.

    +   3. Select **File | Save As....**

    +   4. Set the file type as **DXF** by selecting it in the **Save as type** box
    underneath the filename. **DWG** can also be selected if preferred; this is next
    to **DXF** in the list.

    +   5. Set the specific *DXF/DWG options*, if needed, by pressing the **Options**
    button. Generally, the default options will work fine in most situations, and
    I recommend using these unless your manufacturer specifically requests that you
    change certain settings.

    +   6. Type in the filename and press **Save** to save the file.

    +   7. Further **DXF / DWG Output** options will now appear (see *Figure 4.6*).
    For sheet metal parts, the **Sheet metal** option is usually the best choice for
    the **Export** setting.'
  - '[PAGE 118]


    Different **Entities to Export** settings can also be chosen. In this case, select
    **Geometry** (the outer lines of your part) and **Bend lines:**


    ![](img/4e9c736de6bac4449096a7b92c28af4c_118_0.png)


    Figure 4.6: DXF / DWG Output options


    +   8. Press the green OK check mark.


    +   9. A preview of the file that will be exported will now appear. Solid lines
    indicate the model''s geometry (i.e., the outer perimeter), whereas dashed lines
    are the Bend Lines. The view can be adjusted using the controls at the top. If
    any additional lines aren''t needed, they can be selected by left-clicking and
    then deleted. Note that the usual Ctrl + Z shortcut for undoing actions doesn''t
    work in this preview, but there are Undo and Redo buttons in the bottom left of
    the preview window.'
  - '[PAGE 119]


    In this case, we may have decided that we don''t need the Bend Lines. Therefore,
    press **Cancel** to close the preview window. This doesn''t cancel the entire
    save operation; it just takes us back by a single step.


    > **Which Lines Should I Export?**

    > When exporting 2D files for sheet metal, try to consider the end purpose of
    the file. If the files will be used to cut the flat blanks, then they probably
    will just need the outer perimeter (Geometry) of the part and won''t require Bend
    Lines. Adding Bend Lines in this case could potentially confuse manufacturers.


    +   10. Deselect the **Bend lines** box, and then press the green **OK** check
    mark again.

    +   11. In the updated preview window, note that the Bend Lines no longer appear.
    Press **Save** to save the DXF file.

    +   12. The saved file can now be opened and checked if desired. By default, DXF
    and DWG files should open using the *eDrawings* program, which is usually installed
    as part of a default SolidWorks installation.

    +   13. DXF and DWG files can also be opened in SolidWorks by dragging the file
    into the program, or by going to **File | Open** and changing the file type filter
    in the lower right of the **Open File** dialog box. This can be useful for using
    these 2D files to create 3D models.

    +   14. Other programs can also open these file types. For example, a good 2D
    CAD editor is **LibreCAD**. This is available as a free download online.


    The files can also be imported into **Adobe Illustrator**, and this can be very
    useful if you need to create artwork such as screen-printed logos or packaging.
    It''s also possible to save models directly as Illustrator files, by changing
    the **Save as type** setting within the **Save as...** menu.


    In this section, we learned how to export SolidWorks Sheet Metal parts as DXF
    files for production. We also briefly covered different file types and how and
    why these might be used.'
