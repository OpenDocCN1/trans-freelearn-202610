    Flatten is only really used at the end of modeling when you''re flattening for
    production or checking that all of your features will work correctly with a flat
    sheet. Ideally, no features should be added after the Flat-Pattern folder, and
    the Unfold/Fold features should be used instead.


    However, there are rare cases where certain items—such as holes, perhaps—might
    be added at the end of the FeatureManager Design Tree, depending on exactly what
    you''re making and your design process.


    Unfold/Fold and Flatten are two distinct features that each have their own uses,
    as described previously.


    ## Summary


    In this chapter, we learned how to use **Swept Flanges** and how these differ
    from **Miter Flanges** because they make mitered cuts in the corners. We also
    looked at the **Fold** and **Unfold** tools, which can be used to unfold bends
    to add cuts and other features.


    In *Chapter 6, Utilizing Gussets, Cross Breaks, and Vents to Add Part Details*,
    we will continue exploring the more advanced tools of SolidWorks Sheet Metal.


    ## 6

    Utilizing Gussets,

    Cross Breaks,

    and Vents to Add

    Part Details


    **Gussets** and **Cross Breaks** are common sheet metal features that are used
    to improve various properties of sheet metal parts, such as strength or stiffness.
    This chapter will explain each feature in turn – how to use them and why and where
    they might be used. We will also cover Vents: another common feature in sheet
    metal parts that are used for many reasons, including to add cooling, access ports,
    and to create modular products.


    By the end of this chapter, you''ll understand how to use Gussets and Cross Breaks,
    as well as how to add and modify Vents.


    In this chapter, we''re going to cover the following main topics:


    - Working with Gussets

    - Using Cross Breaks

    - Using Vents

