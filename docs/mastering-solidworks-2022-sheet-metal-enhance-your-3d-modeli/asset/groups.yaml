    ## Using Ordinate Dimensions


    When creating Sheet Metal drawings, especially when using Flat Patterns, sometimes
    drawings can become very cluttered because lots of dimensions need to fit within
    a small area. To help reduce this effect, Ordinate Dimensions can be used. These
    are dimensions that are all added on one single line, from an ordinate (or zero)
    point.


    To use Ordinate Dimensions:


    - 1. Within a drawing document, go to the Annotation tab, then click the drop-down
    arrow underneath Smart Dimension and choose Ordinate Dimension.


    > Note

    > The Ordinate Dimension tool can be used to add either horizontal or vertical
    ordinate dimensions. Alternatively, the specific Vertical Ordinate and Horizontal
    Ordinate tools can be selected to add dimensions in vertical or horizontal orientations
    only. These tools can be useful if you are having trouble getting the general
    Ordinate Dimension tool to pick up the correct orientation.


    - 2. Left-click on a point or edge in the model (such as the lower horizontal
    edge) to anchor the zero point of the ordinate. Drag out the dimension and left-click
    again to place it. This line will now act as a datum (zero point) where all other
