    ## Pros and cons of aluminum


    Aluminum is the second-most common material used in sheet metal and is used in
    a wide range of items including bike frames, aircraft parts, and drinking cans.


    One of the reasons why aluminum is so popular in the aerospace industry is that
    it is much lighter than steel. It also has excellent natural resistance to corrosion
    and so doesn''t need extra surface treatments to stop it from going rusty. Another
    great property of aluminum is how malleable it is, meaning that it is very easy
    to bend. Consider how flexible aluminum foil is, or how easy it is to crush a
    drinks can.


    Unfortunately, these positive properties also come with downsides, and aluminum
    is a lot more expensive than steel. However, because it is less dense, parts can
    be made lighter, which somewhat offsets this cost. Another factor is that although
    aluminum is lighter than steel, it is also weaker, meaning that parts that bear
    the same load will have to be made thicker in aluminum. However, due to the lower
    density of aluminum, these can actually be lighter than the equivalent steel parts.
    So overall, depending on exactly which grades of metal are used, aluminum generally
    has a better strength-to-weight ratio (SWR) than steel.


    ## Other common metals


    Steel and aluminum make up the vast majority of sheet metal parts but some other
    materials are reasonably common, such as the following:


    - **Copper**: Copper is often used for parts such as electronics or heat-exchanging
    components because it has good electrical and thermal conductivity.


    It is also easy to bend and form and has good corrosion resistance, and so is
    often used in plumbing, to make pipes and fixtures. Copper is more expensive than
    steel and aluminum, and some areas have issues with copper theft due to the higher
    price of the metal.

    - **Brass**: This metal is an alloy (a mixture) of copper and zinc that looks
    similar to copper but has a brighter, shinier look. For this reason, it is often
    used for decorative items such as door knockers, fixtures, and trinkets.


    It is extremely malleable and so is commonly used to make musical instruments
    in the brass section, such as trumpets. Brass has exceptional corrosion resistance
    and so is often seen in extreme environments, like door handles on ships. As with
    copper, it is quite an expensive metal and so is usually used sparingly.

    - **Stainless steel:** Steel can be alloyed with other metals such as chromium
    to create different grades of stainless steel. This is steel that has a much greater
    resistance to corrosion than standard steel, while still retaining much of the
    strength and other benefits. For this reason, it is often used to make cutlery
    or surgical instruments.


    Stainless steel sheet metal parts include things like large items of kitchen equipment—for
    example, sinks and countertops. However, this improved corrosion resistance makes
    stainless steel much more expensive than standard steel.


    This overview is not intended to be a complete list of metals, and other niche
    materials might include tin, gold, and titanium. Each of these will have specific
    properties that suit different applications and budgets. As mentioned earlier,
    it is wise to discuss your specific needs with your sheet metal supplier and manufacturer
    to get the best fit for your project.


    A summary of sheet metal material properties can be seen in the following table:


    | Material Type | Advantages | Disadvantages |

    |---|---|---|

    | Steel | Strong, cheap, widely available; easy to work and weld | Heavy; poor
    corrosion resistance |

    | Aluminum | Lightweight; good SWR; good corrosion resistance; malleable | More
    expensive than steel; lower strength than steel |

    | Copper | Good thermal and electrical conductivity; good corrosion resistance;
    malleable | Expensive |

    | Brass | Very malleable; good corrosion resistance | Expensive |

    | Stainless steel | Similar benefits to steel but with excellent corrosion resistance
    | Expensive |


    ## Sheet metal thicknesses and sheet sizes


    Depending on where you live in the world, sheet metal is usually sold either by
    gauge number or the actual thickness of the sheet. As previously mentioned, gauge
    numbers are a way of measuring sheet metal thickness based on the weight of the
    material, and generally, a higher gauge number means a thinner sheet.


    Gauge numbers are specific for each material, so **16 gauge** steel will be a
    different thickness than **16 gauge** aluminum. Therefore, it is highly recommended
    that sheet thickness is also specified in actual thickness, to avoid any confusion.


    Metal sheets are also available in a wide range of sheet sizes, both metric and
    imperial. Some common sizes are shown in Figure 1.26 and include 48x120 " or 2x1
    meters (m):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_52_0.png)


    Figure 1.25: Common metal sheet sizes


    When creating very big parts, or even large numbers of small parts, it is worth
    checking which sheet sizes are available to you and designing with this in mind.
    If making lots of small parts, it is even possible to use third-party "nesting"
    software to arrange the parts on the sheet in the most efficient way and avoid
    wasted material.


    ## Material selection recap


    Even when designing parts virtually in SolidWorks, it is important to consider
    how those parts will be created in the real world, and a vital aspect of this
    is the material choice. Most sheet metal parts are made from steel or aluminum,
    but other common metals include copper, brass, and stainless steel, and each of
    these materials has unique properties that suit different needs.


    Sheet thicknesses are generally defined by actual thickness or using a gauge number.
    This is based on the material''s weight, meaning that the same gauge number gives
    different thicknesses for different materials. Sheets come in a variety of common
    sizes that may have an impact on the design of your parts.


    ## Summary


    In this chapter, we introduced SolidWorks Sheet Metal and learned how to set up
    a Sheet Metal workspace and create **Base Flanges**. These are usually the first
    feature in a Sheet Metal *part*, and we covered the three different types: **Single
    Closed Profile**, **Multiple Contained Closed**, and **Single Open Contour**.


    Next, we explored the four **Sheet Metal** properties—**Thickness**, **Bend Radius**,
    **Bend Allowance**, and **Auto Relief**—and how these can be edited to adjust
    the properties of the entire *part*.


    Finally, we learned how 3D *parts* can be flattened, which is essential if they
    are to be made from metal sheets in the real world. On a similar note, we looked
    at common sheet metal materials and sheet sizes, and how these might be relevant
    to your final design.


    In *Chapter 2, Adding Bends Using Edge Flanges*, we will start to build up a 3D
    design by learning how to use **Edge Flanges** to add extra detail to the **Base
    Flange**.


    ## 2

    Adding Bends Using

    Edge Flanges


    Bent edges known as **Edge Flanges** are the workhorses of **SolidWorks Sheet
    Metal**, and they are one of the most common building blocks for adding 3D detail
    to your flat **Base Flanges**. Although Edge Flanges can appear to be very simple,
    they can be used to build highly complex parts.


    In this chapter, we''ll learn how to add basic Edge Flanges, and then we''ll explore
    how these can be edited and adjusted. We''ll also look at some more advanced options
    and details that can unlock the power of Edge Flanges, allowing you to use them
    on multiple edges, as well as edit flange profiles, and more.


    By the end of this chapter, you''ll have a full understanding of Edge Flanges
    and how they can be used to build Sheet Metal models.


    In this chapter, we''re going to cover the following main topics:


    - Using Edge Flanges

    - Edge Flanges: advanced options


    ## Using Edge Flanges


    One of the most basic and common features in SolidWorks Sheet Metal is the Edge
    Flange. At its simplest, an Edge Flange is just a bent section of a metal sheet
    on an edge. A very simple sheet metal box consists of one single Base Flange with
    four Edge Flanges attached to it (one on each side as shown in Figure 2.1).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_56_0.png)


    Figure 2.1: A simple box made from one Base Flange and four Edge Flanges


    Individual Edge Flanges are extremely simple features but when combined, they
    can be used to create parts that are much more complex.


    ## Creating your first Edge Flange


    Edge Flanges are relatively simple to make:


    1. Open your **Base Flange** part from Chapter 1, Sheet Metal Basics – Exploring
    Sheet Metal Properties and Material Selection, or create a new SolidWorks part
    and make a Base Flange that is 200 x 300 mm in size (as shown in Chapter 1, Sheet
    Metal Basics – Exploring Sheet Metal Properties and Material Selection).

