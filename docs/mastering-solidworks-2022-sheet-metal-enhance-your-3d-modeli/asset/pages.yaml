- pgno: 137
  md: '# 6

    Utilizing Gussets,

    Cross Breaks,

    and Vents to Add

    Part Details


    **Gussets** and **Cross Breaks** are common sheet metal features that are used
    to improve various properties of sheet metal parts, such as strength or stiffness.
    This chapter will explain each feature in turn – how to use them and why and where
    they might be used. We will also cover Vents: another common feature in sheet
    metal parts that are used for many reasons, including to add cooling, access ports,
    and to create modular products.


    By the end of this chapter, you''ll understand how to use Gussets and Cross Breaks,
    as well as how to add and modify Vents.


    In this chapter, we''re going to cover the following main topics:


    +   - Working with Gussets

    +   - Using Cross Breaks

    +   - Using Vents'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Working with Gussets


    Now that we have learned about a few of the standard Sheet Metal tools, we can
    move on to the more specialist tools. The first of these is the Gusset. Similar
    to the Hem tool, this is a term that originally comes from clothing. Many items,
    such as shirts, contain gussets. These are small pieces of extra fabric, usually
    triangular, that are used to add extra strength. These might be found at the bottom
    of a shirt at its sides or in the armpit area, or even in the crotch of trousers.


    In sheet metal, gussets are also used to add strength. However, there are different
    things that the term gusset may refer to. Sometimes, "gusset" or "gusset plate"
    is used to mean an extra piece of metal that is added to an assembly to give strength,
    such as at the bottom of a post, as shown in Figure 6.1.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_138_0.png)


    Figure 6.1: A gusset at the bottom of a metal post


    However, in SolidWorks Sheet Metal, the term gusset has a different meaning and
    refers to a ridge that is indented across a bend to give it extra strength. This
    kind of gussets are shown in Figure 6.2.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_138_1.png)


    Figure 6.2: A gusset within the context of SolidWorks Sheet Metal


    Be aware that although you may be referring to a SolidWorks-style gusset, your
    manufacturer may have a different item in mind.


    We will now look at how Gussets can be used within SolidWorks Sheet Metal.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Adding Gussets


    The **Gusset** tool has a lot of options, so it may appear daunting. However,
    if we work through the options step by step, then it is much simpler than it first
    appears.


    To add a **Gusset**:


    +   1. Start a new *part* document and create a **Base Flange** `100x100mm` in
    size and 1mm thick. The default Sheet Metal properties can be used.

    +   2. Add an **Edge Flange** to one edge. This could be any angle and size but
    for this example, we will make it 40mm high and at a 90° angle.

    +   3. Now, we can place our **Gusset** by selecting the **Sheet Metal Gusset**
    tool.

    +   4. As we mentioned previously, the Property Manager looks very complex but
    follows quite a logical process. First, we need to select the bend where the **Gusset**
    will be placed.

    +   5. Hover over the **Supporting faces** box (color-coded in light blue) at
    the top of the Property Manager (*Figure 6.3*). You will be shown a message stating
    **Select a bend face or two flat faces**.

    +   6. Now, we can place our **Gusset** either by selecting the bend itself (inside
    or outside) or by selecting two of the flat faces connected to the bend. Note
    that we can *either* select either of the inside faces, or both outside faces,
    but not a combination of the two.

    +   7. Select the bend and a preview of our **Gusset** will appear. Note that
    we can select either a **Partial preview** or **Full preview** using the options
    at the bottom of the Property Manager:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_139_0.png)


    Figure 6.3: Sheet Metal Gusset properties – the Gusset’s position'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'The **Reference line** of our **Gusset** is the next box down (*Figure 6.3*)
    and is color-coded in pink (note the pink line on the model in the Graphics Area).
    This will automatically be filled by the edge of the selected bend. This means
    that, by default, our **Gusset** will be perpendicular to the bend. However, if
    required, it is possible to sketch a reference line (before creating the **Gusset**
    feature) that can be used in this box to make a **Gusset** that is at a different
    angle to the bend.


    **Reference point** is the next box down (*Figure 6.3*) and is color-coded in
    purple (note the purple *point* on the model in the Graphics Area). This *point*
    determines where our **Gusset** will be placed along the **Reference line**.


    This *point* can be placed anywhere, but it has to be an existing position such
    as the *start, end, or mid-point* of the line; it cannot be placed at a random
    position.


    It is possible to sketch a *point* (before creating the **Gusset** feature) that
    can be used in this box to set the exact position of the **Gusset**. However,
    it is usually easier to select the start or endpoint of the **Reference line**
    and then use the **Offset** option to exactly position the **Gusset**. If you
    can''t see the **Gusset** preview after selecting **Offset**, then try reversing
    the direction; an incorrect direction will mean that the **Gusset** will be floating
    in space, which means it can''t be made or previewed.


    +   8. Select the **Offset** option and set the distance to 50 mm so that our
    **Gusset** is halfway along the bend (*Figure 6.4*):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_140_0.png)


    Figure 6.4: Setting the Gusset''s position by offsetting it from the endpoint
    by 50mm'
  merge: -1
  img_proc: true
- pgno: 141
  md: '9. The size of the **Gusset** profile can now be set using the **Profile**
    section of the Property Manager (*Figure 6.5*). There are two main ways to set
    the size:


    +   - **Indent depth** is demonstrated by the diagonal dimension line on the large
    icon at the top of the **Profile** section of the Property Manager. This depth
    will determine the entire size of the **Gusset**.

    +   - Alternatively, **Profile dimensions** can be set. We can either set the
    **Section profile length** (d1 in the screenshot) and the **Section profile angle**
    (a1), or we can set the **Section profile length** (d1) and the **Section profile
    height** (d2).


    Only two out of these three options can be used at once since the first two values
    drive the third one.


    If we''re using the **Profile dimensions** option, we can also flip the dimensions
    around by checking the **Flip dimension sides** box:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_141_0.png)


    Figure 6.5: The Profile section of the Sheet Metal Gusset''s properties


    This **Profile** section also includes the option to create a **Rounded gusset**
    or **Flat gusset**. Generally, the tooling to make gussets is quite rounded, to
    avoid damaging the parts, but the exact shape will depend on your design requirements.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '> Note

    > Use the **Profile Dimensions** option with a d1 of **30mm** and an angle of
    **45°** and set a **Rounded gusset**.


    10. The next section, **Dimensions**, (*Figure 6.6*) allows us to set the rest
    of the sizes needed for our **Gusset**:


    +   - **Indent width**: This sets the total width of the **Gusset**.

    +   - **Indent thickness**: This sets the thickness of the sheet at the area of
    the **Gusset**. In general, this should be the same as the main sheet''s thickness,
    unless you have a specific reason to change it.

    +   - **Side face draft**: This allows the sides of the **Gusset** to be angled
    inwards. It can be turned off completely by clicking the icon.

    +   - **Inner corner fillet** and **Outer corner fillet**: These options set the
    size of the fillets inside and outside of the **Gusset**. They can also be turned
    off completely if not needed:


    > Note

    > Set an **Indent width** of **10mm**, an **Indent thickness** of **1mm**, and
    turn off the Draft and Fillet options.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_142_0.png)


    Figure 6.6: The Dimensions section of a Sheet Metal Gusset'
  merge: -1
  img_proc: true
- pgno: 143
  md: '11. Leave the **Flat Pattern Visibility** options at the bottom unchecked and
    press the green **OK** check mark to create this feature.


    Our **Gusset** now appears in the model, as well as in the FeatureManager Design
    Tree. It can be edited in the usual way, or the profile of the **Gusset** can
    be edited by expanding the feature in the Design Tree and editing the underlying
    sketch.


    # Flattening Gusset features


    By default, Gussets aren’t shown in flattened *parts*. This is because they are
    usually added as separate processes using specialist tooling. If we want to show
    Gussets in a **Flat Pattern**, then we need to override the default settings:


    +   1. Click on **Flatten** (on the **Sheet Metal** tab or toolbar). Note that
    the **Gusset** feature doesn’t appear anywhere in the **Flat Pattern** view.

    +   2. Click on **Flatten** again to re-fold the model.

    +   3. Edit the **Gusset** feature.

    +   4. Scroll to the bottom of the Property Manager and check the **Override document
    settings** box. Then, select both the **Show profile** and **Show center** options
    and press **OK**.

    +   5. **Flatten** the part again.


    Note that the **Gusset** feature''s position now appears. The slot profile represents
    the shape of the **Gusset** feature, and the *point* is the position of the center
    of the **Gusset** feature.


    This option will only show the general shape of the **Gusset** feature, so it
    is recommended to also write a note on the 2D *drawing* that specifies its exact
    size.


    In summary, Gussets give strength to bends. They can be added by selecting the
    **Sheet Metal Gusset** tool, then choosing the bend, setting the **Gusset** position,
    and then specifying the profile and size. In the next section, we will look at
    using Cross Breaks to add strength in a different way.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Using Cross Breaks


    Cross Breaks are common in sheet metal and describe a slight bend that''s added
    to a flat sheet to make it more rigid and give it strength. These Cross Breaks
    can often be seen on the sides of things such as sheet metal air ducts, and they
    commonly take the form of two overlapping bends that form a cross, or X shape,
    on the otherwise flat surface. Figure 6.7 shows an example of Cross Breaks on
    the side of a metal duct:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_144_0.png)


    Figure 6.7: An example of a piece of ducting with X-shaped Cross Breaks


    Cross Breaks are very simple to add in SolidWorks Sheet Metal:


    +   1. Start a new part document and create a Base Flange 100x100mm in size and
    1mm thick. The default Sheet Metal properties can be used.

    +   2. Select the Cross Break tool.

    +   3. Now, left-click to select the face where you want to add the Cross Break
    feature. A yellow preview will appear, showing where the Cross Break feature''s
    bends will be added (Figure 6.8):'
  merge: -1
  img_proc: true
- pgno: 145
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_145_0.png)


    Figure 6.8: The Cross Break tool


    4. Press the green OK check mark to add the Cross Break feature. Note that Cross
    Breaks are purely visual features in SolidWorks Sheet Metal. They just represent
    where the Cross Break feature would be added in real life. The actual geometry
    of the model is unchanged and it remains a completely flat sheet.


    5. Edit the Cross Break feature again by clicking on it in the FeatureManager
    Design Tree and pressing Edit Feature.


    6. If required, we can adjust the Break Radius and Break Angle properties and
    adjust the direction of the Cross Break feature. Note that changing these values
    doesn’t change the yellow preview or what the Cross Break feature looks like in
    the 3D model. These values will only appear in the Bend Notes of the 2D drawing
    of the part.


    7. Cross Breaks are often made in a cross or X-shape, but it’s also possible to
    adjust their profiles.


    To do this, click the Edit Cross Profile button from within the Cross Break Property
    Manager. We can now edit the Cross Break sketch and a message will appear saying
    that the current sketch is valid for use with the Cross Break feature. The construction
    lines in the sketch can be adjusted to change the profile. Note that you may need
    to delete Relations linking the ends of the lines to the corners of the face.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '*The ends of the lines always have to touch the outside edges of the face,
    and if your sketch doesn’t fulfill this requirement, then the message box won’t
    allow the sketch to be used with the **Cross Break** feature.*


    +   8. When you are happy with the profile, press the **Finish** button. Then,
    once you’re happy with the **Cross Break** parameters, press the green **OK**
    check mark to create the feature.


    Cross Breaks are very simple features that are used to add rigidity to flat sheets.
    They are added as purely visual items in SolidWorks Sheet Metal.


    In the next section, we will look at creating Vents.


    # Using Vents


    The **Vent** tool is used to create cut-outs of various shapes and can easily
    be used to add detailed Vents. This feature isn’t strictly limited to Sheet Metal
    and can also be used in normal solid modeling. However, Vents are very common
    in sheet metal parts, so the feature appears grouped with the other Sheet Metal
    tools:


    +   1. Start a new *part* document and create a **Base Flange** `100x100mm` in
    size and 1mm thick. The default Sheet Metal properties can be used.

    +   2. To create a **Vent**, we need to sketch to define the size and shape of
    the **Vent** feature. Start a sketch on the large, top face of the **Base Flange**.

    +   3. Sketch a circle at the Origin that is 80mm in diameter. Note that Vents
    don’t have to be circular; they can use any closed profile.

    +   4. Next, we need to add extra Sketch Entities to create **Spars**. Select
    the **Offset Entities** tool from the **Sketch** tab, set an **Offset** of 10mm,
    and select the original 80mm circle that we drew. This should create a new circle
    that’s 10mm smaller than the 80mm circle (*Figure 6.9*).


    Note that you may need to select the **Reverse** box to ensure that the **Offset**
    circle is within the original circle. Also, ensure that the **Construction Geometry**
    options are deselected so that both the original (**Base**) circle and the **Offset**
    circle are solid lines, not construction lines:'
  merge: -1
  img_proc: true
- pgno: 147
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_147_0.png)


    Figure 6.9: Offseting the 80mm circle to create another, smaller, concentric circle


    +   5. Use the Offset Entities tool twice more to add two more circles, each 10mm
    smaller than the previous one (Figure 6.10):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_147_1.png)


    Figure 6.10: Offseting two more circles so that we have four concentric circles
    in total'
  merge: -1
  img_proc: true
- pgno: 148
  md: '6. Next, we need to sketch some Ribs. Note that not all Vents need Ribs (or
    Spars) and that the tool can be used with just a simple outer profile if required.


    Select the Line tool and add a single, vertical line from the center of the circle
    that goes out to the largest circle.


    7. Now, we can use a Circular Sketch Pattern to add more Ribs. On the Sketch tab,
    click on the dropdown arrow next to the Linear Sketch Pattern tool and select
    Circular Sketch Pattern.


    Select the vertical line as the Entities to Pattern, the center point of the circle
    as the point to pattern around, and set four instances with an equal spacing and
    an angle of 360° (Figure 6.11):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_148_0.png)


    Figure 6.11: The Circular Sketch Pattern settings


    Press the green OK check mark to add three new Rib lines around the circle.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "If you are having trouble using **Circular Sketch Pattern**, then you can also\
    \ use the **Line** tool to sketch these lines manually (Figure 6.12):\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_149_0.png)\n\
    \nFigure 6.12: Completed Vent sketch\n\n+   8. Now, we can use this sketch to\
    \ create our Vent. The Vent tool can be used directly from within the sketch but\
    \ in this example, we will exit the sketch first to ensure that no items are preselected\
    \ automatically, which could cause confusion if you are unfamiliar with the tool.\n\
    +   \n+   Exit the sketch and ensure that you don’t have it selected.\n\n+   9.\
    \ Select the Vent tool from the Sheet Metal tools.\n\n+   10. The Property Manager\
    \ may appear very complicated but it uses quite a logical workflow. Following\
    \ the directions provided in the message at the top, first, select the Boundary.\
    \ This is the outer limit of the Vent.\n+   \n+   In this case, select the largest\
    \ circle by left-clicking it."
  merge: -1
  img_proc: true
- pgno: 150
  md: 'Note that a Vent is cut out of the Base Flange in the shape of the circle that
    we selected (you might have to rotate your model to see the Vent feature clearly).
    We could also select multiple lines, for example, if we were making a rectangular
    shaped Vent.


    Also, note that the Flow Area message now displays 5025.91 square mm and Open
    area = 100%.


    This tells you what the area of the vent is, and that 100% of this area is open
    (that is, we have no Ribs or Spars that are blocking the airflow).


    Under the Geometry Properties section, the face has been automatically selected
    as the face where the Vent sketch was drawn:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_150_0.png)


    Figure 6.13: Selecting the Vent''s Boundary


    11. We can now add our Ribs by selecting the Ribs box and then choosing the four
    lines in the sketch.


    The depth and direction of these Ribs will be grayed out as the depth of the Sheet
    Metal Ribs will always be the same as the model''s sheet thickness.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Set the width of the Ribs to 5mm and note that the Open area reduces to 84.60%.
    This is because the Ribs are blocking some of the airflow through the Vent.


    12. Now, select our Spars by left-clicking the Spars box and then selecting the
    two largest remaining circles. Again, the depth and direction cannot be changed,
    but the width of our Spars can be.


    Set the width to 2mm and note that the Open area further reduces to 73.70% (Figure
    6.14).


    Spars and Ribs aren''t required in every Vent, but Spars cannot be added without
    first adding Ribs to connect them to the rest of the model:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_151_0.png)


    Figure 6.14: Adding Ribs and Spars


    13. Fill-In Boundary is also optional and is used to close off an area of the
    Vent feature. In our example, select the smallest, inner circle, and note that
    it is now filled in.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '14. Before completing the **Vent** feature, scroll back up to the **Geometry
    Properties** section. Here, we can set a **Draft Angle** for the **Vent** cuts.
    This option is not commonly used in Sheet Metal work as it complicates cutting
    out **Flat Patterns**.


    We can also add radii to the joins of the vent.


    Set the radius to 2mm. Note that this is applied throughout the **Vent** feature.


    15. Press **OK** to create the feature (*Figure 6.15*). Note that it now appears
    in the FeatureManager Design Tree:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_152_0.png)


    Figure 6.15: The completed Vent feature


    The **Vent** feature is not limited to just Sheet Metal *parts* and is very useful
    for adding these common features to Sheet Metal models.


    # Summary


    In this chapter, we learned how to use **Gussets** and **Cross Breaks**, both
    of which are used to add strength to sheet metal parts but in different ways.
    We learned how to edit **Gussets** to produce a variety of shapes and sizes, and
    how they can be shown in **Flat Pattern** views.


    We also explored the **Vent** tool, which can be used to quickly make Sheet Metal
    **Vents** of different layouts and sizes.


    In the next chapter, we will explore the **Lofted Bend** tool, which allows us
    to create much more complicated styles of bends.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# 7

    Producing

    Advanced Shapes

    Using Lofted Bends


    A Lofted Bend is an advanced form of bend that can be used to create more complex
    shapes than standard flange types.


    There are two types of Lofted Bend—Formed and Bent, and this chapter covers both,
    including the major differences between the two.


    By the end of this chapter, you''ll understand how to use the Lofted Bend tool,
    with both the Formed and Bent options.


    In this chapter, we''re going to cover the following main topics:


    +   - Creating Formed Lofted Bends

    +   - Adding Bent Lofted Bends'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Creating Formed Lofted Bends


    Lofted Bends are used to create a bent transition between two different profile
    shapes. This can be useful in many different ways, such as when you need to join
    a square profile to a more rounded profile like a tube.


    In SolidWorks Sheet Metal, Lofted Bends can be either Bent or Formed, and this
    describes the way the bends would actually be produced. In general, the Formed
    option produces a smoother bend and one that is harder to manufacture, whereas
    the Bent option approximates the bend shape and is easier to physically make.


    Both Bent and Formed types are created using the same tool—the Lofted Bend tool,
    and both start in the same way: with two open profiles. For this reason, Lofted
    Bends are one of the few Sheet Metal tools that don''t require a pre-existing
    Base Flange.


    To create a Formed Lofted Bend:


    +   1. Start a new part document and sketch the first bend profile (see Figure
    7.1) on the Front Plane. This can be drawn using a Center Rectangle, 100×50 mm
    in size, and fixed to Origin:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_154_0.png)


    Figure 7.1: Lofted Bend profile sketch


    # Lofted Bend Profile Requirements


    Lofted Bends need two profiles in order to be created. Both of these profiles
    must be open and must not contain any sharp corners.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Therefore, use the **Sketch Fillet** tool (on the **Sketch** tab) to add 5mm
    fillets to all four corners, and trim a small gap in the profile to ensure it
    is *open* (see Figure 7.2). This can be done by sketching a vertical Construction
    Line from the Origin to the top line of the rectangle.


    Then, use the **Offset Entities** tool (on the **Sketch** tab) to offset this
    Construction Line by 1mm (ensure that the offset line is also a Construction Line).


    The **Trim Entities** tool (also on the **Sketch** tab) can then be used to trim
    a small gap:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_155_0.png)


    Figure 7.2: The completed Loft profile sketch


    Note that the profile is open (it has a small gap at the top) and doesn''t have
    any sharp corners (Figure 7.2).


    Exit the sketch when it is complete.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '2. Next, we need to create a second profile, and so, we need a new Plane. This
    can be created by selecting the Front Plane (ensure that you have already exited
    the previous sketch) and then selecting Reference Geometry | Plane from the Features
    tab. Set the offset distance as 100mm, as illustrated in Figure 7.3 and then press
    the green OK check mark to create the Plane:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_156_0.png)


    Figure 7.3: Adding a new Plane


    3. Start a new sketch on the new Plane and draw the second Loft profile. This
    will be similar to the first but have a slightly different shape.


    This time, use a Centerpoint Straight Slot (within the Slot tool) fixed at the
    Origin, and make it 100x50mm in size.


    As before, the profile must be open and with no sharp corners. Due to the slot
    shape, we don''t have any sharp corners, but the slot is still a closed profile.
    Therefore, we need to trim away another small section, by offsetting a vertical
    line then trimming a gap, as we did with the first profile. Note that you may
    be shown a warning message about destroying the slot entity when trimming. This
    is normal and can be ignored by pressing OK.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'If your sketch loses its Relations and becomes Underdefined, then it can be
    Fully Defined by adding more Relations and Dimensions (you may need to re-anchor
    the slot to the Origin and add Tangent Relations between the curved and straight
    sections). The finished sketch is shown in Figure 7.4.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_157_0.png)


    Figure 7.4: The finished, second Loft profile sketch


    Exit the second sketch when it is complete.


    +   4. We now have the two profile sketches that are required, and so we can use
    these to create the feature. Select the Lofted Bend tool from the Sheet Metal
    tools. This will be one of the few tools that are available since our model doesn’t
    have a Base Flange. If the Lofted Bend tool is grayed out, then ensure that you
    have exited the sketches and are no longer editing them, and this should allow
    the tool to be used.


    +   5. To create the feature, we first need to select the two profiles. Click
    in the Profiles box (if it is not already selected and therefore blue in color)
    in the Property Manager on the left. Then, select each of the sketches in turn
    by left-clicking.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Selecting Loft Profiles


    When selecting Loft Profiles, try to ensure that you select corresponding points
    in each sketch. For example, if you select the point at the top-right center of
    the straight line on the first (rectangle) sketch, then also select a point in
    the same position on the second (slot) sketch (see the arrows in Figure 7.5).


    If you are using dissimilar profiles, then it might not always be possible to
    select points that correspond exactly but try to avoid selecting completely opposite
    points as this may cause the Loft to twist and make the feature fail.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_158_0.png)


    Figure 7.5: Try to select corresponding points on each of the profile sketches


    6. We can now choose whether we want to make a Bent or a Formed Loft. Under the
    Manufacturing Method section in the Property Manager, choose the Bent and Formed
    options in turn. Note that the preview changes slightly with each option (Figure
    7.6). The Bent option has lots of smaller, straighter edges, and the Formed option
    is much smoother.'
  merge: -1
  img_proc: true
- pgno: 159
  md: "Select the **Formed** option:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_159_0.png)\n\
    \nFigure 7.6: Previews of the Formed Lofted Bend (left) and the Bent Lofted Bend\
    \ (right)\n\n+   7. The **Formed Lofted Bend** only has a single option to set,\
    \ which is the thickness of the sheet.\n+   \n+   Set this to 1.5mm thickness.\n\
    +   \n+   8. Press the green **OK** check mark to create the feature. The **Lofted\
    \ Bend** feature appears in the FeatureManager Design Tree and can be edited as\
    \ normal. The profile sketches can also be edited by expanding the feature and\
    \ editing the sketches underneath.\n+   \n+   9. Flatten the model by selecting\
    \ **Flatten** from the **Sheet Metal** tools. Note that the flat part has an arch\
    \ shape, due to the shape of the **three-dimensional (3D)** formed bends.\n+ \
    \  \n+   There are also no bend lines. This is because the shape will be formed\
    \ using specialist tooling instead of bent using set points. Because of this,\
    \ this type of part may be difficult to actually manufacture.\n+   \n+   10. Press\
    \ the **Flatten** button to refold the model.\n\nFormed Lofted Bends are made\
    \ from two profile sketches that must be open and must contain no sharp corners.\
    \ Formed Lofted Bends produce a smooth shape but can be hard to produce in real\
    \ life. In the next section, we will look at creating a **Bent Lofted Bend**,\
    \ using the same profiles."
  merge: -1
  img_proc: true
- pgno: 160
  md: "# Adding Bent Lofted Bends\n\nThe second type of Lofted Bend is the **Bent**\
    \ version. Follow these steps to add it:\n\n+   1. Edit the current **Lofted Bend**\
    \ feature; note that because we have already created a Formed Lofted Bend, we\
    \ no longer have the option to change it to a Bent Lofted Bend.\n+   \n+   However,\
    \ we can delete the Lofted Bend and then reuse the same profiles to create a Bent\
    \ version.\n+   2. Exit the **Lofted Bend Property Manager** so that we are no\
    \ longer editing the feature, then select the feature in the FeatureManager Design\
    \ Tree and press Delete. This will remove the Lofted Bend feature but keep the\
    \ two underlying sketches.\n+   3. Select the **Lofted Bend** tool, and then select\
    \ the two profiles again. Remember to try to select corresponding points on each\
    \ profile.\n+   4. Now, select the **Bent** option from the **Manufacturing Method**\
    \ section of the **Property Manager**.\n+   5. The **Bent** option contains many\
    \ more sub-options than the **Formed** option, but at this stage, use the default\
    \ options and press the green **OK** check mark to create a Bent Lofted Bend.\n\
    +   6. We can immediately see that the model appears very different from the previous\
    \ Formed version and contains many small bent edges.\n+   \n+   Press **Flatten**\
    \ to flatten the model, and note that we can now see multiple Bend Lines that\
    \ would be used to bend the *part* (see Figure 7.7):\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_160_0.png)\n\
    \nFigure 7.7: The flattened Bent Lofted Bend with Bend Lines\n\n+   7. Press **Flatten**\
    \ again to refold the *part*."
  merge: -1
  img_proc: true
- pgno: 161
  md: '8. We will now explore the different Faceting Options for creating the corners
    of Bent Lofted Bends.


    Edit the **Lofted Bend** feature, and in the **Property Manager**, we can see
    the four choices, as illustrated in *Figure 7.8*. Each of these choices will give
    a fairly similar output, but the slightly different options allow you to exactly
    control the bend shape.


    Note that some of the options can be a little temperamental with certain loft
    profiles, so if you are struggling to get the results that you want with one option,
    then try experimenting with another one:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_161_0.png)


    Figure 7.8: Bent Lofted Bends options'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Starting with the first option:


    +   - **Chord Tolerance**: A chord is a straight line that joins two points on
    a circular arc. When we create Bent Lofted Bends, we are approximating an arc
    by using straight lines. *Figure 7.9* shows an ideal arc and an approximated version
    using chords (straight lines):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_162_0.png)


    Figure 7.9: Chord Tolerance option


    The **Chord Tolerance** option sets a maximum value between the straight chord
    line and the ideal arc, as shown in blue in *Figure 7.9*.


    Try adjusting the **Facet Value** setting and notice how the preview changes.
    A higher facet value will produce fewer straight sections and so will create a
    less accurate arc shape but will be easier to make because it has fewer bends.


    Note that we can also click on the purple dots on each of the four corners on
    the model in the Graphics Area (see the right-hand side of *Figure 7.6*), and
    this will also allow us to set faceting options specifically for that corner.


    If you find that when it is created, your **Lofted Bend** has relief cuts that
    you don''t want, then try selecting or deselecting the **Refer to endpoint** option.
    This can result in smoother bends and reduce problems with these automatic relief
    cuts.


    +   - **Number of Bends**: This is quite a simple option that allows you to set
    the number of bends within each corner. Obviously, more bends will result in a
    smoother curve, but be aware that this will also require more work during production.


    +   - **Segment Length**: This option allows you to set the maximum length of
    each segment. A lower value will result in a greater number of shorter sections,
    giving a smoother curve, whereas a higher value will produce sections that are
    longer in length but fewer of them. This will give a more approximate bend shape.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '+   - **Segment Angle**: The final option determines the maximum angle between
    adjacent segments. A lower value here will produce more segments in the bend and
    so will result in a smoother curve.


    Each of the four options can produce very similar results, so try experimenting
    with the settings to get the shape of bend that you require.


    It is also possible to override the default **Sheet Metal** parameters here, if
    needed, such as **Bend Radius** and **Sheet Thickness**.


    +   9. Set **Faceting Options** to values of your own preference and then press
    the green **OK** check mark to create a feature.


    Bent Lofted Bends tend to be easier to manufacture than Formed Lofted Bends but
    they give a much less smooth curve. The bends can be controlled with a number
    of different corner types, but these generally all produce quite a similar output.


    # Summary


    In this chapter, we learned that **Lofted Bends** are a good way to create curves
    between two dissimilar profiles. **Lofted Bends** are made from two open profiles
    that cannot have sharp edges.


    There are two types of **Lofted Bend: Formed**, which produces a smoother feature
    that is harder to manufacture, and **Bent**, which is easier to physically make,
    but only gives an approximation of the curved shape.


    In the next chapter, we will learn about one of the last major tools, the **Tab
    and Slot** tool, which allows us to add details to facilitate the joining together
    of two **Sheet Metal** bodies.'
  merge: -1
  img_proc: true
- pgno: 164
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 8

    Joining Multi-Sheet Parts Using Tab and Slot Features


    The Tab and Slot tool can be used to simplify the joining of two sheet metal bodies
    by creating Tab and Slot features on each respectively.


    By the end of this chapter, you''ll understand how to use the basic tool, as well
    as its many sub-options.


    In this chapter, we''re going to cover the following main topics:


    +   - Adding Tab and Slot features

    +   - Adjusting Tab and Slot properties


    # Adding Tab and Slot features


    So far in this book, we have only created Sheet Metal parts that contain one single
    sheet. However, it is also possible to make parts that have multiple sheets.


    In SolidWorks Sheet Metal, sheets can be thought of in a similar way to bodies
    in normal solid modeling. They are separate solids within a model that aren''t
    connected to each other. They may be touching, but they are still separate solids.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'An example of a Sheet Metal model with multiple sheets might be an enclosure
    that is made from two sections—a **Body** (the first sheet) and a separate **Lid**
    (the second sheet). Although both the **Lid** and the **Body** are made within
    one single SolidWorks *part* document, they are both separate elements within
    that part.


    The **Tab and Slot** tool is a great way of connecting two of these sheets together.
    It cuts slots from one sheet and adds corresponding tabs to the other, allowing
    the two sheets to mesh together and making it easier to create a join like a weld.


    The **Tab and Slot** tool is not purely a Sheet Metal tool; as with the **Vent**
    tool, it can be used in normal, solid modeling parts, but it is very useful during
    sheet metal work, so it is grouped with the Sheet Metal tools.


    To create a **Tab and Slot** feature, we first need to make a model with two sheets:


    +   1. Start a new *part* document and use the **Center Rectangle** tool to create
    a **Base Flange** that is fixed to the Origin and is 100×100mm in size and 4mm
    thick. The default Sheet Metal properties can be used, as illustrated in *Figure
    8.1*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_166_0.png)


    Figure 8.1: Creating a 100x100x4mm Base Flange'
  merge: -1
  img_proc: true
- pgno: 167
  md: '2. In *Chapter 3, Getting Familiar with Basic Tools in Sheet Metal*, we learned
    how to use the **Jog** tool to join two *parallel* sheets or flanges together,
    but if we are trying to join two *perpendicular* sheets, then the **Tab and Slot**
    tool is much more suitable because it provides more surface area to help join
    the two sheets.


    Start a new sketch on one of the small end faces of the current **Base Flange**,
    then use a **Corner Rectangle** to draw a second **Base Flange** sketch that is
    linked to the corners of the first **Base Flange** and is also 100mm wide, as
    illustrated in *Figure 8.2*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_167_0.png)


    Figure 8.2: Sketching the second Base Flange, making it Coincident with the corners
    of the first one


    3. Use the second sketch to create a **Base Flange** by selecting the **Base Flange/Tab**
    option and accepting the default parameters (the sheet thickness should still
    be 4mm).'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'Note that the Cut list folder in the FeatureManager Design Tree now has the
    number 2 in brackets next to it (see Figure 8.3). This indicates that we have
    two sheets within our model. The folder can be expanded, and the sheets can be
    hidden or shown by left-clicking on them and selecting Hide or Show:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_168_0.png)


    Figure 8.3: Adding the second sheet, and the Cut list folder'
  merge: -1
  img_proc: true
- pgno: 169
  md: '4. Now that we have the second sheet, we can start to create a Tab and Slot
    feature. Select Tab and Slot from the Sheet Metal tools. As with many SolidWorks
    tools, the options in the Property Manager initially look very complicated but
    there is a logical flow to them, and the message in the yellow box at the top
    of the Property Manager explains the process.


    5. First, we need to select where the feature will be placed, using the boxes
    in the Selection section. The uppermost edge is the Tab Edge (labeled i in Figure
    8.4) selection box. This is a linear edge where the tab will be placed:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_169_0.png)


    Figure 8.4: The Selection options


    When working with sheets that join at a corner, as our example, it can be easier
    to select the internal corner instead of the external corner. This is because
    there is only one single edge here, whereas the outside corner has two edges (one
    from each sheet), so it can be difficult to select the correct edge.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Rotate the model and select the inside corner, as illustrated in Figure 8.5.
    Note that the start and end points of the selected edge are automatically added
    as green and purple points in the Graphics Area and added to corresponding selection
    boxes (labeled iv and v Figure 8.4).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_170_0.png)


    Figure 8.5: Selecting the Tab Edge and Start and End Reference Points'
  merge: -1
  img_proc: true
- pgno: 171
  md: '6. Next, we need to select the Slot Face.


    Spin the model around and select the outside face, as shown in Figure 8.6. A yellow
    preview of the tabs and slots should now appear on the model:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_171_0.png)


    Figure 8.6: Selecting the Slot Face


    7. Press the green OK check mark to create a Tab and Slot feature using the default
    sizes and options (see Figure 8.7). Note how one sheet has had the slots cut away
    and the other sheet has had the corresponding tabs added.


    Two features now appear in the FeatureManager Design Tree—the Tab and Slot-Tab
    feature and the Tab and Slot-Slot feature. These two features are always added
    as a pair; you can’t have one without the other. However, because they are on
    different sheets, they will appear as two different features.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Try expanding the Cut list folder and hiding each sheet in turn, to take a
    closer look at how they fit together. You can also hide sheets by hovering over
    them in the Graphics Area and pressing the Tab key (reshow them by pressing Ctrl
    + Z to undo, or by expanding the Cut list folder and pressing Show on the hidden
    sheet):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_172_0.png)


    Figure 8.7: The created Tab and Slot features


    We have now added a basic Tab and Slot feature and, hopefully, you can see how
    this would help with the joining of the two sheets. In the next section, we will
    look at editing the feature in order to set the properties that we want.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Adjusting Tab and Slot properties


    In the previous section, we added the Tab and Slot features using the default
    options. However, there are many properties that can set the exact size and spacing
    of tabs and slots.


    When editing the Tab or Slot feature, we have to edit the Tab and Slot-Tab feature
    in the FeatureManager Design Tree (see Figure 8.8). This will allow us to change
    both the tab and the slot details; it is not possible to edit the Tab and Slot-Slot
    feature directly:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_173_0.png)


    Figure 8.8: The Tab and Slot-Tab and Tab and Slot-Slot features


    +   1. Edit the Tab and Slot-Tab feature by clicking on it in the FeatureManager
    Design Tree and pressing Edit Feature.


    +   2. We can now specify the exact details of the tabs and slots. Firstly, we
    can specify where the tabs and slots will begin by setting an Offset if this is
    required.


    Select the Offset box and set both offsets to 1.0mm. These distances are measured
    from the Start Reference Point and End Reference Point (the green and purple points
    in the Graphics Area, as indicated in Figure 8.9).


    Try adjusting the offsets and see how this changes the preview in the Graphics
    Area. Notice how the spacing between the slots decreases automatically as we increase
    the offsets:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_173_1.png)


    Figure 8.9: The Start and End Reference Points'
  merge: -1
  img_proc: true
- pgno: 174
  md: '3. Next, we can set the **Spacing** values of the tabs and slots. It''s possible
    to *either* set an **Equal Spacing** value and specify how many tabs will be added
    *or* to set a **Spacing Length** value, meaning that the number of tabs will be
    automatically adjusted to fit within that length.


    Depending on the values used, both of these options can give very similar results,
    and the choice of which to use is largely down to personal preference.


    Set an **Equal Spacing** value with six instances.


    4. The **Tab** details can be changed next.


    The **Length** value is simply a numerical value. Set this to 5mm.


    The **Height** value can be set using three end conditions, as follows:


    +   - **Up To Surface**: The tabs will reach all the way through the sheet where
    the slots are cut.

    +   - **Blind**: A simple numerical value can be set.

    +   - **Offset From Surface**: This can be used if the tabs need to either be
    shorter or extend beyond the sheet, and it can be useful for extending tabs in
    order to give more weld material.


    The **Edges Type** selection allows the corners of the tabs to either be **Sharp
    Edge**, **Fillet Edge**, or **Chamfer Edge**.


    5. Finally, the **Slot** details can be set.


    The first option is **No Through Cut**. By default, the slots will go all the
    way through the face that they are made on. By selecting this option, we can create
    a partial slot cut that doesn''t go all the way through the face.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Slot Depth Is Linked to Tab Height


    If you deselect No Through Cut to make a partial slot cut, then be aware that
    the depths of the slots are linked to the height of the tabs. Therefore, if your
    tab height is still set to the Up To Surface option, then selecting No Through
    Cut for the slots won’t actually change the slot depth. To do this, you will also
    have to reduce the tab height.


    Also, be aware that creating partial slot cuts in sheet metal, in real life, is
    much more difficult than simply creating through cuts, and as such, this might
    increase the cost and lead time of your parts.


    6. Next, we can set the Offset amount of the slots, as illustrated in Figure 8.10.
    This is how much larger the slots will be compared to the tabs. Slots always have
    to be slightly larger so that tabs can fit into them, and so it’s not possible
    to set the Offset amount to zero, although a very small number can be set instead.


    Selecting Equal offset will make both the Length and the Width values of the offsets
    have the same value.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_175_0.png)


    Figure 8.10: Slot options'
  merge: -1
  img_proc: true
- pgno: 176
  md: '7. The very last option in the Slot section allows the Corner Type field to
    be set, with Sharp, Filleted, Chamfered, and Circular options available.


    **Corner-Type Limitations**

    If you encounter an error when trying to use Filleted or Chamfered corner types,
    then try reducing the size of the Filleted or Chamfered corner or increasing the
    Offset value, or both.


    Sometimes, the size of the fillet or chamfer in the corners can effectively reduce
    the actual distance and, in some cases, completely remove any gap, causing an
    error when trying to create the feature, as illustrated in Figure 8.11.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_176_0.png)


    Figure 8.11: Be aware that filleted or chamfered corners may need a bigger offset
    gap


    The Tab and Slot tool has many options that allow you exactly set the size, spacing,
    and type of feature that you want.


    # Summary


    In this chapter, we learned that the Tab and Slot tool is a great way of joining
    two sheets together, especially if they meet at a perpendicular angle. Slots will
    be cut from one of the sheets, and the adjoining sheets will have tabs added that
    fit into these slots.


    In the next chapter, we will take a close look at the various Corner tools that
    allow you to easily finish off the small details of your models.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 9

    Finishing Off Models Using Corner Details


    SolidWorks Sheet Metal contains a number of Corner tools that can be used for
    many different operations, including closing corner gaps between flanges, adding
    welded corners, trimming away sharp edges, and adding corner relief around bend
    areas.


    By the end of this chapter, you''ll understand how to use the four different Corner
    tools.


    In this chapter, we''re going to cover the following main topics:


    +   - Reducing gaps by using Closed Corners

    +   - Removing corners gaps by adding Welded Corners

    +   - Getting rid of sharp corners with the Break-Corner/Corner-Trim tool

    +   - Preparing your model for manufacturing using Corner Relief


    # Reducing gaps by using Closed Corners


    The Corner tools are a set of four similar tools that are grouped together because
    they all deal with corner details. Individually, the tools are fairly simple but
    they can be useful for saving time or creating a specific feature in your models.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'The first tool is the **Closed Corner**. This can be used to reduce the gaps
    that can occur between two adjacent flanges.


    To show an example of the **Closed Corner** tool, first we will create a simple
    part with some adjacent flanges:


    +   1. Start a new *part* document and use the **Center Rectangle** tool to create
    a **Base Flange** that is fixed to the **Origin** and is 50×50mm in size and 2mm
    thick. The default **Sheet Metal** properties can be used.

    +   2. Add two **Edge Flanges** to any of the adjacent edges (*Figure 9.1*). Make
    these 30mm high and at a 90° angle.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_178_0.png)


    Figure 9.1: Creating a Base Flange with two adjacent Edge Flanges'
  merge: -1
  img_proc: true
- pgno: 179
  md: '3. Spin the model around and note that we currently have a gap in the corner,
    between the two Edge Flanges. Select the Closed Corner tool from the drop-down
    menu underneath the Corners button in the Sheet Metal tools.


    4. First, we need to select where we want to close the gap. Ensure that you have
    the top selection box – Faces to Extend – active and then select the end face
    of either of the Edge Flanges (Figure 9.2):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_179_0.png)


    Figure 9.2: Selecting the Faces to Extend'
  merge: -1
  img_proc: true
- pgno: 180
  md: '5. A preview will now appear showing that the selected face has been extended
    and the corresponding face has been extended a smaller amount to reduce the corner
    gap (Figure 9.3). Note that the second face has automatically been selected as
    the Face to match. It is also possible to manually select the Faces to match if
    needed.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_180_0.png)


    Figure 9.3: The Face to Extend is extended and the Face to match is extended by
    a smaller amount'
  merge: -1
  img_proc: true
- pgno: 181
  md: '6. We can now select the Corner Type. Try selecting each type in turn, to see
    the differences, by clicking each of the three buttons:


    +   - **Butt**: This extends each face slightly, so that the gap is reduced but
    the flanges don''t overlap each other (Figure 9.4, left). The **Gap distance**
    can be set using a numerical value.

    +   - **Overlap**: This extends one of the flanges so that it overlaps the corresponding
    one (Figure 9.4, center). For this option, we can set the **Gap distance** and
    also the **Overlap/underlap ratio**. This controls how much the longer flange
    overlaps the shorter one. A value of 1 will mean the overlap covers the whole
    of the flange, whereas a value of 0.5 (for example) means that the overlap will
    cover half of the flange.

    +   - **Underlap**: This is very similar to the **Overlap** option but the flanges
    are reversed (Figure 9.4, right):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_181_0.png)


    Figure 9.4: Corner Type options; from left to right: Butt, Overlap, Underlap


    Set the **Corner Type** to **Overlap**.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '7. Ensure that the **Open bend region** option is checked. This will automatically
    trim away a corner relief area when filling the gap. It is possible to create
    Closed Corners without this option selected (*Figure 9.5*) but it can result in
    manufacturing complications and can sometimes cause model errors if the **Gap
    distance** is too small.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_182_0.png)


    Figure 9.5: Closed Corner with Open bend region selected (left) and deselected
    (right)


    8. Press the green OK check mark to create the **Closed Corner**. Note that although
    we do still have a small gap (due to the nature of sheet metal, with folded flanges)
    it is much reduced.


    9. There are also three other options that can be used with the **Closed Corner**
    tool. These can be seen by editing the **Closed Corner** feature:


    +   - **Coplanar faces**: Selecting this option will mean that **Closed Corner**
    will be applied to all faces that are *coplanar* (lined up) with the selected
    faces, even if those coplanar faces are not selected themselves. This can be useful
    if one of the flanges has a cut in it that breaks the surface up into smaller
    sections (*Figure 9.6*):'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_183_0.png)


    Figure 9.6: Selecting Coplanar faces will apply the Closed Corner to all coplanar
    faces, even if only one is selected


    +   - **Narrow Corner**: This can reduce the gap distance around the bend area,
    depending on your model''s exact geometry. However, it usually only makes a small
    difference.

    +   - **Auto propagation**: This option simply automatically selects the corresponding
    **Faces to match** when the **Faces to Extend** are selected.


    The **Closed Corner** can be especially useful when working with flanges that
    are not at 90° to the **Base Flange** (*Figure 9.7*). In these cases, the gap
    distance will vary along the length of the flange, and so using the **Closed Corner**
    tool allows these gaps to easily be closed.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_183_1.png)


    Figure 9.7: Using the Closed Corner tool to close gaps between non-perpendicular/parallel
    flanges'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The **Closed Corner** tool is a great way of reducing the gaps between adjacent
    flanges but sometimes you might want to remove the gaps entirely. In the next
    section, we will look at how you can use the **Welded Corners** tool to do this.


    # Removing corner gaps by adding Welded Corners


    The **Welded Corners** tool can completely close a corner gap by welding the corners
    together. This tool is the simplest of the four **Corner Tools** and can be used
    as follows:


    +   1. Delete the **Closed Corner** feature from the previous section so that
    we just have a single **Base Flange** (50x50x2mm) with two adjacent **Edge Flanges**
    that are 30mm high and at a 90° angle.

    +   2. Select the **Welded Corner** tool from the **Sheet Metal Corner** tools.

    +   3. Now we simply need to select the side face of one of the **Edge Flanges**.


    We will then see a yellow preview of the **Welded Corner** (Figure 9.8):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_184_0.png)


    Figure 9.8: Adding a Welded Corner'
  merge: -1
  img_proc: true
- pgno: 185
  md: "+   4. By default, the **Welded Corner** will run the full length of the selected\
    \ face, but if needed, a stopping point can be added by creating a sketch with\
    \ a *point* in it, on the side face of the flange, *before* creating the **Welded\
    \ Corner**.\n+   5. A welded area can be rounded off by selecting the **Add fillet**\
    \ option. There are also options to **Add texture** to the welded area and to\
    \ **Add weld symbol**.\n+   6. Press the green **OK** check mark to create the\
    \ feature. The welded material will count towards the model's *mass* and *volume*\
    \ that can be displayed using the **Mass Properties** tool on the **Evaluate**\
    \ tab. The **Mass Properties** tool also contains an option to specifically **Show\
    \ weld bead mass**.\n+   7. Note that when the model is **Flattened**, the **Welded\
    \ Corners** will automatically be suppressed to allow the sheet to unfold correctly.\n\
    \nThe **Welded Corner** tool is a very simple feature that can be used to join\
    \ adjacent edges. In the next section, we will look at how the **Break-Corner/Corner-Trim**\
    \ tool can be used to remove sharp edges.\n\n# Getting rid of sharp corners with\
    \ the Break-Corner/Corner-Trim tool\n\nThe **Break-Corner/Corner-Trim** tool is\
    \ very similar to **Fillet** and **Chamfer** tools in that it allows square corners\
    \ to be easily removed by filleting or chamfering them. This can be used to make\
    \ items easier to manufacture, can be for structural reasons, or can even just\
    \ make parts more user-friendly by taking off sharp corners.\n\nTo use the **Break-Corner/Corner-Trim**\
    \ tool, perform the following steps:\n\n+   1. Continuing from the previous example,\
    \ delete the **Welded Corner** feature so that you just have a single **Base Flange**\
    \ (50x50x2mm) with two adjacent **Edge Flanges** that are 30mm high and at a 90°\
    \ angle.\n+   2. Select the **Break-Corner/Corner-Trim** tool from the **Corner**\
    \ tools.\n+   3. First, we can set a **Break Type** – either **Filletted** or\
    \ **Chamfered** – and then set the **Size**.\n+   \n+   Chose **Fillet** and set\
    \ the size to 5mm."
  merge: -1
  img_proc: true
- pgno: 186
  md: '4. We can now select the corners that we wish to break. The corners can be
    left-clicked directly, or the entire face can be selected and all relevant corners
    will be broken. In this way, the Break-Corner/Corner-Trim tool is much more useful
    than the Fillet or Chamfer tools, because we don’t have to zoom in a lot to select
    the very short edges of the flanges; we can simply select the entire face.


    Select both of the Edge Flanges, and the Base Flange, as shown in Figure 9.9:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_186_0.png)


    Figure 9.9: Adding the Break Corner feature


    5. Press the green OK check mark to add the Break-Corner/Corner-Trim feature.


    So far, we have just created external broken corners, but the tool can also be
    used with internal corners, as shown in the next section.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Using the Break-Corner/Corner-Trim tool with internal corners


    Follow these steps to use this tool with internal corners:


    +   1. Add a Tab to the Base Flange, by sketching a rectangle on the upper face,
    then selecting the Base Flange/Tab tool (Figure 9.10):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_187_0.png)


    Figure 9.10: Adding a Tab to the Base Flange


    +   2. Select the Break-Corner/Corner-Trim tool again.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '3. Using the same settings as before (**Fillet**, 5mm size), select the **Base
    Flange** face again. Note how just the *external* corners are selected (Figure
    9.11):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_188_0.png)


    Figure 9.11: Selecting the Base Flange face


    4. Zoom in and manually select the two *internal* corners (Figure 9.12). Creating
    internal broken corners adds material, whereas creating external broken corners
    removes material.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_188_1.png)


    Figure 9.12: Manually selecting internal corners


    5. Press the green **OK** check mark to add the new broken corners.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'As well as using the **Break-Corner/Corner-Trim** tool on folded parts, it
    can also be used on flattened models to quickly select all corners together.


    # Using the Break-Corner/Corner-Trim tool on flattened models


    There may be many cases where you create an entire Sheet Metal model without adding
    any trimmed corners but wish to add them all at the end of your modeling, perhaps
    to aid with manufacturing.


    In these cases, the **Break-Corner/Corner-Trim** tool can be used after flattening
    the part:


    +   1. Continuing from the previous example, delete any current **Break-Corner/Corner-Trim**
    features so that you just have the **Base Flange**, **Tab**, and two **Edge Flange**
    features.

    +   2. Flatten the model by clicking the **Flatten** button.

    +   3. Now expand the drop-down menu for the **Corner** tools and you''ll see
    that only one option is available, **Corner-Trim**. This is very similar to the
    previous tool that we used in the last section but specialized for flattened models.
    Select the **Corner-Trim** tool (Figure 9.13):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_189_0.png)


    Figure 9.13: Using the Corner-Trim tool with a flattened part'
  merge: -1
  img_proc: true
- pgno: 190
  md: "+   4. We now have the ability to add **Relief Options** and to add **Break\
    \ Corner Options**. We will cover the **Relief Options** in the next section and\
    \ just look at the **Break Corner Options** for now.\n+   \n+   As before, we\
    \ can set the **Break type** and **Size**.\n+   \n+   Set **Filletted**, 5mm size.\n\
    \n+   5. Next, select the corners to be broken. When using this tool in the flattened\
    \ state, we have two new options. Clicking the **Collect all corners** button\
    \ will automatically select all relevant corners in the model. We can also check\
    \ the **Internal corners only** box to just select internal corners (external\
    \ corners have to be selected manually).\n+   \n+   Click **Collect all corners**\
    \ to select the bends in the model.\n\n> **Using the Collect all corners Button\
    \ versus Selecting the Face**\n> When selecting the corners to break, I recommend\
    \ using the **Collect all corners** button, instead of just selecting the face.\
    \ This is because sometimes selecting the face will also mistakenly select corners\
    \ within bends, which shouldn't be broken.\n\n+   6. Press the green **OK** check\
    \ mark to break the selected corners. Note that the **Corner-Trim** feature now\
    \ appears after the **Flat-Pattern** folder in the FeatureManager Design Tree.\n\
    \n+   7. Unflatten the part by selecting the **Flatten** button again. Note that\
    \ the trimmed corners no longer appear in the model and the **Corner-Trim** feature\
    \ is suppressed (turned off). This is because the **Corner-Trim** feature is a\
    \ *child feature* of the **Flat-Pattern** feature. Therefore, if the **Flat-Pattern**\
    \ feature is suppressed (such as when the model is unflattened) then the **Corner-Trim**\
    \ feature is also suppressed.\n\nUsing the **Corner-Trim** tool after flattening\
    \ in this way is an example of one of the few times where you might add features\
    \ to the model after the **Flat-Pattern** folder at the end of your modeling.\n\
    \nIf you require the corners to be trimmed in the unflattened state, then you\
    \ can use the **Corner/Corner-Trim** tool as described earlier in this chapter,\
    \ or you can use the **Unfold** feature to flatten your part, then manually trim\
    \ all of the corners, then use the **Fold** feature to fold the part back up.\n\
    \nIn the next section, we will take a look at the final corner tool, **Corner\
    \ Relief**."
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Preparing your model for manufacturing using Corner Relief


    The **Corner Relief** tool allows us to add relief cuts to the corners in our
    model. This can be useful for avoiding manufacturing issues in tight corners where
    two or more bends meet.


    The tool can be used in the unflattened or flattened state and we will look at
    the unflattened version first:


    +   1. Continuing from the previous example, delete any current **Break-Corner/Corner-Trim**
    features so that you just have the **Base Flange**, **Tab**, and two **Edge Flange**
    features. Ensure that the model is in the Unflattened (that is, folded-up) state.

    +   2. Select the **Corner Relief** tool from the drop-down menu underneath the
    **Corner** tools. We can now set some options in the Property Manager (*Figure
    9.14*):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_191_0.png)'
  merge: -1
  img_proc: true
- pgno: 192
  md: '+   3. The **Scope** section simply indicates which sheet we are working with.
    This is usually automatically prefilled but if working in a multi-sheet part,
    then you can select the appropriate sheet.


    +   4. Next, we need to select either a **2 Bend Corner** or a **3 Bend Corner**.
    In our current model, we only have a 2 Bend Corner. This means that the corner
    has two bends that are next to each other (*Figure 9.15*). In the next section,
    we will look at 3 Bend Corners.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_192_0.png)


    Figure 9.15: A 2 Bend Corner


    Select **2 Bend Corner** then click the **Collect all corners** button in the
    **Corners** section.


    Notice how the **Define Corner** box has now been filled with the two faces from
    the bend.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '5. We can now set the **Relief Options**. There are five main options, each
    of which produces a slightly different style of cut. Each version also has a number
    of sub-options:


    +   - **Rectangular**: This will cut out a rectangular area. The cut size can
    either be determined by a numerical value in the **Slot length** box or by checking
    the **Ratio to thickness** box, which calculates the size according to the sheet
    thickness.


    The **Centered on bend lines** option centers the cut relative to the bend lines,
    and the **Tangent to bend** option makes the cut tangent to the bend lines (Figure
    9.16).


    The **Add filleted corners** button simply rounds off the sharp corners of the
    relief cut.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_193_0.png)


    Figure 9.16: The Centered on bend and Tangent to bend options


    +   - **Circular**: Produces a circular cut out.


    +   - **Tear**: Creates a torn relief; there are no sub-options available.


    +   - **Obround**: This creates an obround (slot-shaped) cut.


    +   - **Constant Width**: This makes a linear and continuous cut with a constant
    width and it has no sub-options.


    Experiment with the different types of **Corner Relief** cut to see the differences
    between them on the preview in the Graphics Area.


    6. Press the green **OK** check mark to create the **Corner Relief** cuts.


    As well as 2 Bend Corners, the **Corner Relief** tool can also be used with more
    unusual 3 Bend Corners.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Using the Corner Relief option with 3 Bend Corners


    3 Bend Corners tend to be a little less common in Sheet Metal models but we will
    briefly take a look at one now:


    +   1. Continuing with the previous model, add two further Edge Flanges as shown
    in Figure 9.17. This will create a 3 Bend Corner (we have just added two more
    bends, and we previously had one bend from the first set of Edge Flanges).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_194_0.png)


    +   2. We can now use the same corner tool so select the Corner Relief tool from
    the Corners drop-down menu.


    +   3. Under the Corner Type section, select 3 Bend Corner.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '+   4. Press the **Collect all corners** button and note that the 3 Bend Corner
    is selected, and all three of the faces are added to the **Define Corner** section.

    +   5. We can now use the **Relief Options** section to add the corner relief
    cuts in the same way as for 2 Bend Corners.


    In this manner, we can use multiple **Corner Relief** features to add relief cuts
    for different corner types when the model is in the folded state, but we can also
    use the **Corner Relief** tool with flattened parts.


    # Adding Corner Relief cuts to flattened models


    Sometimes you may wish to complete the majority of your Sheet Metal model first,
    then add relief cuts to the entire design at the end of modeling. When using this
    method, it can be easier to apply the cuts to the flattened model:


    +   1. After the majority of your modeling is complete, flatten the model by pressing
    the **Flatten** button.

    +   2. Click the drop-down menu underneath the **Corner** tools. Select the **Corner-Trim**
    option – the only one that is available in the flattened state. This is the same
    tool that we used in the previous section to break the sharp corners, but it can
    also be used to add corner relief.

    +   3. Click the **Collect all corners** button under the **Relief Options** section.
    Note that in the flattened state, we don’t need to specify 2 or 3 Bend Corners
    – they are both treated the same.

    +   4. Set the **Relief Type** and **Size**. This can either be **Circular**,
    **Square**, or **Bend Waist** (Figure 9.18):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_195_0.png)


    +   5. Press the green **OK** check mark to add the relief cuts. Note that these
    reliefs will only appear in the flattened state. If the model is unflattened,
    then the **Corner Relief** feature will be suppressed.


    In this way, relief cuts can easily all be added together at the same time.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Summary


    In this chapter, we looked at the four **Corner** tools. The first one, **Closed
    Corner**, allows us to reduce corner gaps between adjacent flanges, whereas the
    **Welded Corner** tool lets us completely remove these gaps. The **Break-Corner/Corner-Trim**
    tool speeds up the removal of sharp edges, and the final tool, **Corner Relief**,
    adds relief cuts that may be required for manufacturing reasons.


    In the next chapter, we will explore how we can add 3D detail to our flat sheets
    by creating and using **Forming Tools**.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 10

    Adding 3D Details

    to Models with

    Forming Tools


    So far, we have learned how to add three-dimensional (3D) details to flat sheets
    by using features such as Edge Flanges. However, it is also possible to add 3D
    features by using Forming Tools. These are specially made tools that are commonly
    used to press shapes into flat faces.


    This chapter explains how to use existing Forming Tools from the SolidWorks Design
    Library, as well as how to modify Forming Tools and create and use entirely Custom
    Forming Tools.


    In this chapter, we''re going to cover the following main topics:


    +   - Using Forming Tools

    +   - Modifying existing Forming Tools

    +   - Creating Custom Forming Tools'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Using Forming Tools


    Forming Tools are shaped tools, known as dies, that are pressed into flat sheets
    under high pressure, leaving an indentation behind. Some Forming Tools can even
    create cuts within the sheet, as well as shaped impressions. Examples of these
    shapes include things such as dimples, louvers (shaped vents), and even logos
    and text. You can see some examples of shapes created using forming tools in Figure
    10.1:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_198_0.png)


    Figure 10.1: Examples of shapes created using forming tools


    The SolidWorks Design Library includes many premade Forming Tools that can easily
    be used when working with Sheet Metal models. Because these tools are available
    in a fairly limited range of shapes and sizes, they may not be that useful for
    your needs, but they can be modified; the later sections in this chapter will
    show how to do this, as well as how to create entirely Custom Forming Tools.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'To demonstrate the use of Forming Tools first we will make a simple Sheet Metal
    part, as follows:


    +   1. Start a new part document and use the Center Rectangle tool to create a
    Base Flange that is fixed to the Origin and is 50x50mm in size and 1mm thick.
    The default Sheet Metal properties can be used.

    +   2. Open the Design Library by clicking on the icon (it looks like a set of
    books) in the Task Pane at the right-hand side of the screen, as indicated in
    Figure 10.2.

    +   If you do not see the Task Pane, then it can be switched on by right-clicking
    on the Command Manager and ensuring that there is a check mark next to Tools |
    Task Pane.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_199_0.png)


    Figure 10.2: Opening the Design Library tab'
  merge: -1
  img_proc: true
- pgno: 200
  md: '3. Expand the Design Library folder within the Task Pane and expand the Forming
    Tools folder. You should now see a number of different Forming Tool types, such
    as embosses and ribs. Click on embosses and note that the various embossing tools
    available will be shown at the bottom of the Task Pane. Note: Depending on your
    settings and SolidWorks version, your Design Library may appear slightly different
    from how it looks in Figure 10.3.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_200_0.png)


    Figure 10.3: Expanding the Design Library and the Forming Tools folder'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# If the Design Library Is Not Visible


    If you can''t see the Design Library within the Task Pane, then you need to relink
    SolidWorks to the correct folder.


    This can be done by going to Tools | Options | System Options | File Locations.


    Then, find Design Library in the drop-down list and ensure that the location of
    your Design Library folder appears within the Folders box. If the folder is not
    there, click Add and find the location of your Design Library on your computer''s
    hard drive.


    By default, this location is usually C:\ProgramData\SolidWorks\SolidWorks 20xx\Design
    Library.


    (Note that the Program Data folder is often a hidden folder, so you may need to
    adjust your Windows Explorer view settings to show hidden folders.)


    Then, press OK to add the Design Library folder, and it should now appear within
    the Task Pane.


    To use the Forming Tools, they can simply be dragged into the model by holding
    the left mouse button and dragging the desired tool onto the sheet face.


    +   4. As an example, select the embosses subfolder within the forming tools folder
    in the Task Pane, then left-click and drag the counter sink emboss tool onto the
    top face of your Base Flange.


    A yellow preview of the indentation that will be made should now appear on your
    model in the Graphics Area, as illustrated in Figure 10.4:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_201_0.png)


    Figure 10.4: Dragging the Forming Tool onto the model'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Are You Trying to Make a Derived Part?


    If you try to drag the tool onto the sheet and are presented with the message,
    Are you trying to make a Derived Part?, this simply means that SolidWorks does
    not recognize that you are working with Forming Tools. To fix this, close the
    error message box by selecting Cancel. Then, open the Task Pane again, right-click
    on the Forming tools folder, and place a check mark next to the Forming Tools
    Folder option. This will ensure that SolidWorks knows that all parts within the
    folder should be treated as Forming Tool parts.


    5. Press the green OK check mark to insert the counter sink emboss feature. We
    should now see that the sheet has been deformed in the shape of the tool that
    we selected, and there is a hole in the center of the embossed area, as illustrated
    in Figure 10.5. If we look at the various Forming Tools in the Design Library
    (Figure 10.4—lower right), we can see that they are colored yellow or red. A yellow
    face indicates that the face of the tool will deform (or bend) the sheet, whereas
    a red face indicates material that will be cut away (for more information on this,
    see the Creating Custom Forming Tools section, later in this chapter):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_202_0.png)


    Figure 10.5: The Forming Tool feature


    We can edit the Forming Tool feature in the usual way, or we can expand the feature
    and edit the position sketch underneath the feature if we simply want to change
    the position of the feature.


    6. Left-click on the counter sink emboss feature in the FeatureManager Design
    Tree and select Edit Feature.


    The Forming Tool feature is similar to the Hole Wizard in that it contains a Type
    tab that can be used to adjust the actual tool details, and it also contains a
    Position tab that allows one or more instances to be positioned.


    The Type tab (Figure 10.6) provides the following options:


    +   - Placement Face: This sets the face where the tool will be pressed into.

    +   - Rotation Angle: The tool can be rotated to any angle here. It can also be
    flipped, allowing the tool to be pressed in from the opposite side of the sheet.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   - **Configurations**: The Forming Tools are *part* files in their own right
    (more details on this in the next two sections in this chapter) and therefore
    can have multiple configurations. This section allows you to set the required
    configuration if needed.

    +   - **Link**: This section allows you to keep or break the link to the Forming
    Tool *part*. If the link is kept and the Forming Tool *part* is subsequently changed,
    then the feature in this model will also change.

    +   - **Flat Pattern Visibility**: By default, the **Forming Tool** features will
    not appear in Flat Patterns; however, this can be overridden by selecting this
    checkbox.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_203_0.png)


    Figure 10.6: The Forming Tool Type tab'
  merge: -1
  img_proc: true
- pgno: 204
  md: "+   7. The **Position** tab can now be used to place the tool features. Select\
    \ the **Position** tab and the cursor will change to the **Point** tool.\n+  \
    \ \n+   Similar to the **Hole Wizard**, a Forming Feature will be placed anywhere\
    \ that a *point* is placed.\n+   \n+   The **Smart Dimension** tool can also be\
    \ used to set the exact position of the features.\n\n+   8. Once you are happy\
    \ with the position and type of the features, press the green **OK** check mark\
    \ to create them.\n\nThe basic Forming Tools in the SolidWorks **Design Library**\
    \ can be useful, but the selection is quite limited; therefore, it's likely that\
    \ you will need to modify these tools to suit your own needs. In the next section,\
    \ we will look at how to do this.\n\n# Modifying existing Forming Tools\n\nThe\
    \ SolidWorks **Toolbox** and **Hole Wizard** features both contain many size variations\
    \ and so are extremely useful. By contrast, the Forming Tools available in the\
    \ SolidWorks **Design Library** only come in a very limited range of sizes. However,\
    \ although the *size range* of these tools is limited, there are quite a few different\
    \ *types* of tools. Therefore, it's likely that you can find a similar shape or\
    \ type of Forming Tool to address your needs, then modify the size so that it\
    \ exactly suits your requirements.\n\nTo modify Forming Tools:\n\n+   1. Start\
    \ a new *part* document and use the **Center Rectangle** tool to create a **Base\
    \ Flange** that is fixed to the Origin and is 50x50mm in size and 1mm thick. The\
    \ default Sheet Metal properties can be used.\n+   \n+   You can also use the\
    \ model from the previous section and simply delete the Forming Tool features.\n\
    \n+   2. The first step in modifying Forming Tools is to find a similar tool to\
    \ your requirements. For example, if you want an extruded flange with a cutout,\
    \ expand the **extruded flanges** section and find the **rectangular flange**\
    \ tool, as shown in *Figure 10.7*. Remember that yellow faces in the tool will\
    \ bend the sheet metal and red faces will cut away material:"
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_205_0.png)


    Figure 10.7: Finding an existing tool that is similar to your requirements


    3. Next, we need to open the tool in order to modify it. Right-click on the preview
    of the rectangular flange tool (in the Task Pane—see Figure 10.7) and select Open.
    We will now be taken to the part document for the tool. (Note: You may receive
    a Write Access warning. This can be ignored as we will not be saving over the
    original part file.) The part can be edited in the same way as a normal model—for
    example, the extrude features can be adjusted in size by editing their underlying
    sketches or by left-clicking on the appropriate feature in the Graphics Area,
    then double-clicking any dimension and changing it.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '4. Adjust the size of the main rectangular area (the Boss-Extrude1 feature)
    by changing the dimensions from 30x20mm to 50x30mm, as illustrated in Figure 10.8.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_206_0.png)


    Figure 10.8: Adjusting the Forming Tool size


    5. Note that the Fillet that was running around the base of the tool no longer
    travels all the way around the tool (Figure 10.9). This Fillet is important for
    ensuring that the tool works correctly (sharp edges on Forming Tools can potentially
    cause manufacturing issues):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_206_1.png)


    Figure 10.9: The Fillet around the bottom of the tool is no longer correct'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Therefore, to ensure that this Fillet is created properly, extend the size
    of the Base-Extrude feature by the same amount as we extended the tool shape in
    Step 4.


    +   6. So, edit the Base-Extrude feature or sketch and add 20mm to the long edge
    and 10mm to the short edge, as illustrated in Figure 10.10.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_207_0.png)


    Figure 10.10: Increasing the base size


    Notice that after increasing the base size, the Fillet now follows the lower outline
    correctly.


    +   7. We can now save the part for use, as follows:


    +   I. Select File | Save As...


    +   II. Select Save as copy and open from the lower left of the dialog box.


    > Save As Copy

    > By saving the file as a copy, we maintain the original Forming Tool part (the
    rectangular flange tool) and save the modified version as an entirely new part.
    This means that models that use the original Forming Tool will be unaffected by
    these latest changes.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'III. Note that the **Save as type** dialog is displaying `Form Tool (*.sldftp)`.
    This indicates that the document will be saved as a specific *Form Tool Part*
    document.


    IV. The save location should default to the `extruded flanges` subfolder in the
    `forming tools` folder (the same location as the original **rectangular flange**
    tool that we started with). By saving in this folder, the *Form Tool Part* will
    be recognized as a Forming Tool and will appear in the `forming tools` folders
    in the **Design Library**.


    Select **Save as copy and open**, then save the modified Forming Tool with a new
    filename, such as `Larger Rectangular Flange`.


    8. Return to the original document (the **Base Flange** sheet) by selecting it
    from the **Window** menu or by pressing the *Ctrl + Tab* keys to switch between
    open documents.


    9. Expand the **Task Pane** and note that the new Forming Tool—**Larger Rectangular
    Flange**—now appears with the other Forming Tools, as illustrated in *Figure 10.11*.
    This tool can then be dragged into the model and used in the same way as any other
    Forming Tool:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_208_0.png)


    Figure 10.11: The saved Forming Tool now appears with the other tools'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# If the New Forming Tool Doesn''t Appear


    If the new *Form Tool Part* doesn''t appear with the other Forming Tools in the
    **Design Library**, then it was probably saved in a different location from the
    other Forming Tools.


    This can be fixed by opening the *Form Tool Part* (or press *Ctrl + Tab* to return
    to the document if you still have it open). Then, expand the **Task Pane** and
    select the **Add to Library** button at the top of the **Task Pane** (*Figure
    10.12*). The part can then be added to the appropriate folder in the **Design
    Library** and used in the same way as the other Forming Tools.


    **Note:** If you are using this method then the file needs to be saved before
    it is added to the **Design Library**.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_209_0.png)


    Figure 10.12: The Add to Library button


    Although the standard Forming Tools in the **Design Library** are quite limited
    in variety they can be easily modified, allowing you to adjust them to suit your
    own needs. In the next section, we will look at taking this one step further by
    creating entirely **Custom Forming Tools**.


    # Creating Custom Forming Tools


    Modifying existing Forming Tools may be suitable in many situations, but sometimes
    you might require an entirely custom tool. This could be something such as an
    unusually shaped indent or vent, a product''s operating instructions or markings,
    or even your company logo. In these cases, we can create Custom Forming Tools.
    These tools are reasonably straightforward to make within SolidWorks, but be aware
    that creating and using Custom Forming Tools in real-life manufacturing is likely
    to add cost and lead time to your parts.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'To make a Custom Forming Tool, we first create a shape as a normal *part* document,
    and then we convert it to a Forming Tool and save it as the appropriate file type,
    as follows:


    +   1. Start a new *part* document and sketch a base on the **Top Plane**. This
    base is only used to help with tool setup and will be cut away from the model
    before use, so the exact size isn’t critical, but it should always be larger than
    the main tool shape in both directions.


    In this case, sketch a **Center Rectangle** that is 50x50mm in size and fixed
    to the Origin. Then Extrude it 10mm, as illustrated in *Figure 10.13*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_210_0.png)


    Figure 10.13: Extruding a 50x50mm base, fixed to the Origin


    +   2. Next, we need to create a forming shape for the tool. That is the shape
    that will actually be pressed into the metal sheet when the tool is used.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '3. Start a sketch on the upper face of the base extrude and use the **Polygon**
    tool to sketch a hexagon (six-sided polygon) that is 30mm in size across the flat
    edges. This should be centered on the Origin.


    Extrude the hexagon 10mm upward, as illustrated in *Figure 10.14*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_211_0.png)


    Figure 10.14: Extruding a 30mm hexagon, 10mm high


    4. Generally, when making Forming Tools (and working with sheet metal), it is
    desirable to avoid sharp edges. With Forming Tools in particular, sharp edges
    can cause manufacturing issues.


    Therefore, use the **Fillet** tool to first add six 5mm Fillets to the six upright
    edges of the hexagon.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '5. Next, add a 2mm Fillet to both the top and bottom edges of the hexagon,
    as illustrated in Figure 10.15. Note that creating an initial base that was larger
    than the tool shape now allows us to easily add the lower Fillet. Without the
    base, it would be much more difficult to create the lower, filleted edge:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_212_0.png)


    Figure 10.15: Adding Fillets to remove sharp edges


    Now that we have a filleted lower edge, we no longer need the initial base feature,
    and so we can cut this away.


    6. Expand the first Boss-Extrude feature and select the sketch underneath. Then,
    use this sketch to create an Extruded Cut that is the same depth as the first
    Boss-Extrude feature (10mm), completely cutting away the first Boss-Extrude feature,
    as illustrated in Figure 10.16.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_212_1.png)


    Figure 10.16: Cutting away the initial base, using the first sketch and a Cut
    Extrude'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'The geometry of our tool is now complete, but before converting it into a Forming
    Tool, we can add an *Orientation Sketch*. This sketch can be used in **Flat Pattern**
    versions of models and can also be helpful when positioning a *part*.


    +   7. Start a sketch on the underside face of the tool. Then, left-click to select
    the entire face and press the **Convert Entities** tool (on the **Sketch** tab).
    This will convert the outline of the face into new sketch entities, giving an
    outline of the tool.

    +   8. Next, select the **Point** tool and add a *point* at the center of the
    tool (lined up with Origin). This can be used to help position the tool.


    Then, exit the sketch.


    You can see an outline of the tool in Figure 10.17):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_213_0.png)


    Figure 10.17: Adding an Orientation Sketch


    +   9. We are now ready to convert the *part* to a Forming Tool.

    +   Select **Insert | Sheet Metal | Forming Tool**, and the **Form Tool Property
    Manager** will open.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '10. Select the **Stopping Face** field.


    This is the face of the tool that will stop at the face of the sheet where the
    tool is inserted. In other words, it is the face of the tool that will be coplanar
    (lined up) with the metal sheet when the tool is at its deepest point. Figure
    10.18 shows an example of this on a different tool:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_214_0.png)


    Figure 10.18: The Stopping Face


    Select the underside face of the tool (the same face where the Orientation Sketch
    was drawn). Note that it turns cyan.


    11. Next, the **Faces to Remove** field can be set.


    This selection is optional; it''s not necessary to remove any faces, but any that
    are selected here will turn red and will be cut out of the sheet when the Forming
    Tool is used.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Select the upper face of the tool, as illustrated in Figure 10.19.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_215_0.png)


    Figure 10.19: Selecting the upper face as the Face to Remove


    Note that faces can also be split into smaller faces (by drawing sketch entities,
    such as lines and circles, on the areas to be split up and then using the Split
    Line tool) if you only want to cut away certain sections of a flat face, rather
    than the entire face.


    12. Finally, we can set the Insertion Point field by selecting that tab in the
    Property Manager, and then selecting the point from the Orientation Sketch (or
    the Origin; both should be in the same place).'
  merge: -1
  img_proc: true
- pgno: 216
  md: '13. Press the green OK check mark to create a Form Tool feature (Figure 10.20).
    Note that the feature appears in the FeatureManager Design Tree and the tool in
    the Graphics Area is now color-coded. As previously mentioned, yellow indicates
    bend faces, red indicates faces that will be removed, and cyan (underneath) shows
    the Stopping Face:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_216_0.png)


    Figure 10.20: The created Form Tool


    14. Before use, the Forming Tool has to be saved. There are two main ways to do
    this, as outlined here:


    +   - Save as a part document: The document can be saved as a standard part file
    (with a *.SLDPRT file extension). If the part is saved within the forming tools
    folder, then SolidWorks will recognize it as a Forming Tool, even if it is saved
    as a standard part file. If the file is saved in a different location, then SolidWorks
    will not recognize the part as a Forming Tool.


    +   - Save as a Forming Tool document: Alternatively, the model can be saved as
    a specific Forming Tool file (with a *.SLDFTP file extension). In this case, the
    file can be saved in any location and SolidWorks will still recognize it as a
    Forming Tool.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Forming Tool or Part Document?


    Forming Tools can be saved as either file type, as detailed previously. The difference
    between the two is mostly just a matter of file organization. If you prefer to
    keep all files from a specific project in the same location, then it may be best
    to save the tool as a Forming Tool document (*.SLDFTP), but if the Forming Tool
    is a generic tool that will be used on multiple projects, then you may prefer
    to save it directly into the Design Library as a normal part file.


    Save the tool file by going to File | Save As....


    The type of document can then be set by selecting from the Save as type drop-down
    menu, directly underneath the filename.


    In this case, save the tool as a standard SolidWorks part, within the forming
    tools folder. (The default location is C:\ProgramData\SolidWorks\SolidWorks 20xx\Design
    Library\Forming Tools.)


    15. After saving, open the Design Library within the Task Pane on the right-hand
    side of the screen and check that your new tool appears with the other Forming
    Tools. It can now be dragged into models and used in the same way as the standard
    Forming Tools.


    If the tool does not appear, you may need to add it to the Design Library using
    the Add to library button, as described in the information box at the end of the
    Modifying existing forming tools section.


    # Forming Tool Not Working Correctly?


    If you find that your new Forming Tool does not work correctly, then try checking
    that the corners are rounded. Sharp corners can sometimes cause errors with Forming
    Tools.


    This section showed how to create entirely Custom Forming Tools instead of just
    modifying existing models. This greatly expands the range of indentations and
    cuts that you can use.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Summary


    In this chapter, we looked at how to use the Forming Tools from the **Design Library**
    to add 3D detail to your Sheet Metal models. We also explored modifying existing
    tools to suit your own needs, as well as creating completely Custom Forming Tools.
    This allows a virtually unlimited variety of Forming Tool shapes and sizes to
    be used.


    In the next chapter, we will learn how existing 3D models can be converted into
    Sheet Metal models using the **Insert Bends** tool.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Section 3:

    Converting 3D Parts

    to Sheet Metal and

    Creating a Sheet

    Metal Enclosure


    As well as creating Sheet Metal models from scratch, we can also convert existing
    3D designs into Sheet Metal models. This section shows two different ways to do
    this, and also provides a practical example that brings together a number of the
    skills that we have learned throughout the book.


    This section contains the following chapters:


    +   - Chapter 11, Converting to Sheet Metal Using the Insert Bends Tool

    +   - Chapter 12, Building Sheet Metal Parts Using the Convert to Sheet Metal
    Tool

    +   - Chapter 13, Practical Example: The Sheet Metal Enclosure'
  merge: -1
  img_proc: true
- pgno: 220
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 11

    Converting to Sheet Metal Using the Insert Bends Tool


    3D models with a constant wall thickness (for example, *Shelled* or *Thin Feature*
    parts), can be converted into Sheet Metal *parts* by using the **Insert Bends**
    tool. This chapter shows how to use this tool to create Sheet Metal parts.


    By the end of this chapter, learners will be able to confidently use the Insert
    Bends tool.


    In this chapter, we''re going to cover the following main topics:


    +   - Using the Insert Bends tool with Shelled parts

    +   - Using the Insert Bends tool with Thin Feature parts'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Using the Insert Bends tool with Shelled parts


    So far in the book, we have covered most of the SolidWorks Sheet Metal tools,
    and in almost every case, we have started our models using the Base Flange feature.
    However, it''s also possible to convert existing solid models into Sheet Metal
    models. This can be done in two main ways: by using the Insert Bends tool or by
    using the Convert to Sheet Metal tool. While these two tools are similar, they
    do have some important differences, which will be explained in this chapter and
    Chapter 12, Building Sheet Metal Parts Using the Convert to Sheet Metal Tool,
    respectively.


    Should I Use a Base Flange or Convert a Solid Model to Sheet Metal?

    Generally, starting a Sheet Metal model using a Base Flange is the better option,
    because it gives you flexibility if changes are required at a later stage. At
    times, it may seem like creating a solid model and then converting it to Sheet
    Metal will be faster, but in the long run, once any future modifications are taken
    into account, it is often better to start with a Base Flange.


    The Insert Bends and Convert to Sheet Metal tools are generally more useful when
    working with pre-existing models that you may have received from a different source,
    or previously made yourself.


    The Insert Bends tool allows us to convert solid models – such as Shelled or Thin
    Feature parts – to Sheet Metal parts. It works best with parts that have a uniform
    (that is, constant) wall thickness. If your model is completely solid or has a
    variable wall thickness then it is usually better to use the Convert to Sheet
    Metal tool, which is covered in Chapter 12, Building Sheet Metal Parts Using the
    Convert to Sheet Metal Tool.


    To demonstrate the use of the Insert Bends tool, first, we are going to create
    a simple Shelled model:


    +   1. Start a new part document and create a solid cube that is 100 mm long on
    each side. This can be made by sketching a Center Rectangle on the Top Plane,
    then using the Extruded Boss/Base tool and the Mid Plane End Condition.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '2. Hollow out the cube and remove the upper face by selecting the Shell tool
    and selecting the upper face as one of the Faces to Remove (Figure 11.1). Set
    the wall thickness as 2mm.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_223_0.png)


    Figure 11.1: Shelling the cube to a wall thickness of 2 mm and removing the upper
    face'
  merge: -1
  img_proc: true
- pgno: 224
  md: '3. Now, if we go to a Section View we can see that the cube has a constant
    2 mm wall thickness all the way around (Figure 11.2). This makes it ideal for
    converting to Sheet Metal by using the Insert Bends feature.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_224_0.png)


    Figure 11.2: The cube has a constant wall thickness


    4. Close the Section View and select the Insert Bends tool from the Sheet Metal
    tab or toolbar.


    The Insert Bends Property Manager appears (Figure 11.3). We can use this to set
    the default parameters of the Sheet Metal part (such as the Bend Radius and Auto
    Relief). Note that the Thickness setting is unavailable because the thickness
    is determined by the actual thickness of the solid part.


    Set a Bend Radius of 2mm and keep the other settings as the default values.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_225_0.png)


    Figure 11.3: The Insert Bends Property Manager


    5. Once the parameters have been set, we need to select a Fixed Face or Edge.
    This will be the face or edge that does not move and it can be thought of as similar
    to a Base Flange.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Spin the cube over and select the underside face as the Fixed Face (Figure
    11.4).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_226_0.png)


    Figure 11.4: Selecting the underside face as the Fixed Face


    6. Before clicking the OK check mark, we must first select the Edges to Rip in
    the Rip Parameters section.


    To convert this 3D design to a flat sheet, we need to unfold the vertical sides
    of the cube. However, they are currently joined together. Therefore, certain edges
    must be ripped to allow the sides of the cube to be unfolded. If we think of the
    cube as if it was a real-life object (for example, if it was made out of cardboard),
    we would have to rip down the four vertical edges before we could unfold the side
    faces. Therefore, we need to select these edges in the Rip Parameters section.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Left-click the box under Rip Parameters to select the Edges to Rip box, then,
    select the four vertical edges of the cube. Notice that yellow arrows will appear
    on each of the selected edges (Figure 11.5). These arrows indicate the direction
    of the rip.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_227_0.png)


    Figure 11.5: Selecting the four vertical edges to rip


    +   7. We can also set the Rip Gap distance by adjusting the value at the bottom
    of the Rip Parameters section. Set this to 0.5mm.


    +   8. Click the green OK check mark to create the Insert Bends feature. You may
    receive a message telling you that Auto Relief cuts were made for one or more
    of the bends.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'The part is now converted to a Sheet Metal part and a number of features appear
    in the FeatureManager Design Tree (Figure 11.6). We can also see that the lower
    edges that were previously sharp have now been converted to bends and that Auto
    Relief cuts have been added to the lower corners.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_228_0.png)


    Figure 11.6: The Insert Bends features and model


    Looking at the FeatureManager Design Tree (on the left-hand side of Figure 11.6)
    shows us a step-by-step guide of the process that has just occurred.


    First, we created the cube shape (Boss-Extrude1) and Shelled it out (Shell1).
    Next, the Sheet-Metal folder was added as part of the Insert Bends process. As
    usual, this folder always contains all of the Sheet Metal parameters for this
    part. This is followed by the Rip feature (Rip1) that cut rips down the vertical
    edges of the cube. The Flatten-Bends operation (Flatten-Bends1) then folded down
    the sides of the cube, and the Process-Bends operation (Process-Bends1) added
    the bends into the model and folded the sides back up. Finally, the Flat-Pattern
    folder was added, and this will allow us to flatten the part at a future stage
    if needed. If we do flatten the model (Figure 11.7), the relief cuts in the corners
    will be seen much more easily.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_229_0.png)


    Figure 11.7: The flattened model, showing the relief cuts in the corners


    The Rollback Bar (the blue horizontal bar at the bottom of the FeatureManager
    Design Tree) can be dragged up through these features, allowing you to step back
    through the model and see these changes one by one.


    # Adjusting Rips


    When using the Insert Bends tool, we can also adjust the rips to specify their
    direction. This can be done either when you are initially creating the feature
    or at a later stage by editing the Rip feature:


    +   1. Ensure that your model is in an unflattened state.

    +   2. Left or right click on the Rip feature in the FeatureManager Design Tree
    and select Edit Feature.

    +   3. The rip direction can be changed by selecting an edge and then clicking
    the Change Direction button in the Property Manager on the left, or it can be
    changed by clicking on the yellow arrows in the Graphics Area (Figure 11.8).'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Rips can be in either of the single directions (left or right) or they can
    be in *both directions* at the same time. However, clicking on the yellow direction-arrows
    can only reverse the single-direction options. To set the rip edge to *both directions*,
    it must be selected in the Edges to Rip box and then changed by clicking the **Change
    Direction** button to cycle between the three different states.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_230_0.png)


    Figure 11.8: Adjusting the rip directions


    +   4. The Rip Gap distance can also be adjusted in the Property Manager.

    +   5. Press the green **OK** check mark to accept any changes.


    It is also possible to use the Rip tool independently of the Insert Bends tool
    by selecting the **Rip** tool. This might be helpful if your model needs further
    operations after the rips but before any bends are added. However, it usually
    makes sense to combine the operations directly by just using the Insert Bends
    tool.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'So far, we have looked at how to create Sheet Metal models from *Shelled* parts
    with a constant wall thickness, but the Insert Bends tool can also be used with
    *Thin Feature* models.


    # Using the Insert Bends tool with Thin Feature parts


    Shelled models are reasonably common when working with SolidWorks, however, you
    may also encounter models that are *open* but not *entirely flat*. These could
    be items such as simple mounting brackets. In these cases, the Insert Bends tool
    can still be used to convert these models into Sheet Metal *parts*:


    +   1. Start a new SolidWorks part document and start a sketch on the Right Plane.

    +   2. Use the **Line** tool to draw the sketch shown in *Figure 11.9*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_231_0.png)


    Figure 11.9: Sketching an open profile'
  merge: -1
  img_proc: true
- pgno: 232
  md: '3. Use the sketch to create an Extruded Boss/Base. This can be 50 mm long,
    with a Blind End Condition. Ensure that you also select the Thin Feature option
    if it is not already selected (this should be automatically selected when trying
    to extrude an open profile), and then set the thickness to Mid-Plane and 2mm thick
    (Figure 11.10). Next, click OK check mark to create the feature.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_232_0.png)


    Figure 11.10: Extrude the sketch using Thin Feature


    4. This part can now be converted into a Sheet Metal part by selecting the Insert
    Bends tool.


    5. As before, we now need to set the model''s parameters and select a Fixed Face
    or Edge. Set the Bend Radius as 2 mm and select the lower, horizontal face (the
    one that is fixed to the Origin) as the Fixed Face or Edge. In this case, we don''t
    need to rip any edges, so the Rip Parameters section can be ignored.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '6. Press the green OK check mark to create the feature. It can now be seen
    that the model is converted to a Sheet Metal part and the Flatten Bends and Process
    Bends features are added to the FeatureManager Design Tree. Note that even though
    we sketched a profile with sharp corners, these have automatically been converted
    to 2 mm bends (Figure 11.11), according to the Bend Radius value that we set in
    Step 5.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_233_0.png)


    Figure 11.11: The model is converted to a Sheet Metal part


    If you were to actually create the model that we have just used in this example,
    it would usually be much better to use a Base Flange and Edge Flanges. However,
    there may be cases that are similar but more complicated, or you may have been
    sent a model by a different person, or even in a different file format. In these
    instances, it may be best to use the Insert Bends tool to convert models directly
    to Sheet Metal parts.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Summary


    In this chapter, we looked at converting 3D models into Sheet Metal parts by using
    the Insert Bends tool. This tool is especially useful when working with solid
    models that have a constant wall thickness, such as Shelled parts. It can also
    be used to save time if you already have existing models that need to be turned
    into Sheet Metal versions, or have simple Thin Feature models.


    It is also possible to convert models by using the dedicated **Convert to Sheet
    Metal** tool, and we will explore this in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 12

    Building Sheet Metal

    Parts Using the

    Convert to Sheet

    Metal Tool


    The **Convert to Sheet Metal** tool can be used to turn existing Solid models
    into Sheet Metal *parts*. It is especially useful when those models don’t have
    a constant wall thickness. The tool is quite versatile and has a number of options
    which are explained in detail here.


    In this chapter we’re going to cover the following main topics:


    +   - Using the **Convert to Sheet Metal** tool

    +   - **Convert to Sheet Metal** – Advanced Options

    +   - Solving conversion issues'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Using the Convert to Sheet Metal tool


    The **Convert to Sheet Metal** tool is quite similar to the **Insert Bends** tool
    that we introduced in the previous chapter in that it can be useful for converting
    preexisting solid models into Sheet Metal models. It differs from the **Insert
    Bends** tool because it can be used with bodies that are completely solid, instead
    of those with a regular wall thickness. This can be a great time-saver if you
    have been sent models by external clients or partners who are working with different
    CAD systems.


    To demonstrate how to use the tool, first, we will create a simple, solid shape:


    +   1. Start a new SolidWorks *part* document and sketch the profile shown in
    *Figure 12.1* on the Front Plane.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_236_0.png)


    Figure 12.1: Sketch a closed profile'
  merge: -1
  img_proc: true
- pgno: 237
  md: '2. Extrude the shape 75mm, using the **Extruded Boss/Base** and the **Mid Plane**
    End Condition (Figure 12.2).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_237_0.png)


    Figure 12.2: Extrude the sketch


    3. Select the **Convert to Sheet Metal** tool. A large number of options now appear
    in the Property Manager.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '4. The workflow is quite similar to the Insert Bends tool from the previous
    chapter. First, we need to set the parameters that we will use for the Sheet Metal
    part, and then select a Fixed Face (Figure 12.3).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_238_0.png)


    Figure 12.3: Setting the Sheet Metal parameters


    5. Set the Thickness as 2mm (the Gauge Tables can also be used by ticking the
    Use gauge table box) and the Bend Radius as 2mm. Leave the Reverse thickness and
    Keep body boxes unchecked.


    6. Next, select the Fixed Entity. This will be the face or edge that doesn’t move
    when the model is unbent. It can be thought of as similar to the Base Flange in
    normal Sheet Metal parts.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '7. Rotate the model and select the lowest underside face as the Fixed Entity
    (Figure 12.4).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_239_0.png)


    Figure 12.4: Select the Fixed Entity


    8. Next, we must select the edges where we''d like to add bends. Click in the
    Bend Edges selection box and then select the two edges shown in Figure 12.5.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_239_1.png)


    Figure 12.5: Select the edges to bend'
  merge: -1
  img_proc: true
- pgno: 240
  md: '9. Now create the **Convert to Sheet Metal** feature by pressing the green
    **OK** check mark.


    10. We can see that the solid has been converted to a Sheet Metal *part* with
    a thickness of 2mm that we set in *Step 4*. 2mm bends have been added to the two
    selected edges. Also, note all of the faces connected to edges that were not selected
    have been removed from the model (*Figure 12.6*).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_240_0.png)


    Figure 12.6: The converted part


    11. The FeatureManager Design Tree on the left-hand side of the screen now includes
    the **Sheet-Metal** and **Flat-Pattern** folders, indicating that this *part*
    is a Sheet Metal model. It also contains the **Convert-Solid** feature itself.
    Edit the feature by clicking on **Convert-Solid** and selecting **Edit Feature**.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '12. We will now add further Bend Edges and look at how Rip Edges can be used.
    Keep the two existing Bend Edges and add a third edge, as shown in Figure 12.7.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_241_0.png)


    Figure 12.7: Select a third Bend Edge


    13. Notice that the Rip Edges selection box has now been automatically filled
    by the two edges highlighted in pink in Figure 12.7. This selection is automatic
    because if we create bends at the three locations that we have selected then the
    pink edges must be ripped, otherwise, the bend faces wouldn’t be able to fold
    flat.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '14. Press the green **OK** check mark to update the feature and note that the
    Sheet Metal model now contains the additional face related to the third bend that
    we selected (*Figure 12.8*). The pink edges from Step 10 have also been ripped,
    that is, they have a small gap.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_242_0.png)


    Figure 12.8: Update the feature with the third bend


    Depending on which **Bend Edges** we select, we may create 3D models that look
    similar but have quite different footprints. It is usually worth thinking about
    exactly what you want to achieve from your model before selecting the bends.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'To show an example:


    +   1. Edit the **Convert Solid** feature again so that we are back in the tool''s
    Property Manager.

    +   2. Clear all of the selections in the **Bend Edges** selection box and select
    the three edges shown in *Figure 12.9*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_243_0.png)


    Figure 12.9: Edit the feature and change the Bend Edges'
  merge: -1
  img_proc: true
- pgno: 244
  md: '3. Press OK to accept the changes. We can now see that although this new shape
    and the shape from Figure 12.8 appear very similar in 3D, they are completely
    different when Flattened (Figure 12.10).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_244_0.png)


    Figure 12.10: Different Bend Edge selections can give very variable results.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'One final important aspect of using the **Convert to Sheet Metal** tool is
    that bends have to be selected in order:


    +   1. Edit the **Convert Solid** feature again so that we are back in the tool''s
    Property Manager.

    +   2. Clear all of the selections in the **Bend Edges** selection box. Then select
    the five edges in the order shown in *Figure 12.11*. If you try to select an edge
    that is not connected to the Fixed Face (for example, if you try to select Edge
    4 before selecting Edge 3) then a warning will pop up; edges must be selected
    in the correct order so that they are connected to the Fixed Face.

    +   3. After selecting Edge 5 note that the **Rip Edges** automatically appears
    on the top-right edge.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_245_0.png)


    Figure 12.11: Select the five Bend Edges shown'
  merge: -1
  img_proc: true
- pgno: 246
  md: '4. Select the two further edges shown in Figure 12.12 and note that Rip Edges
    are automatically applied all the way around the large faces of the shape.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_246_0.png)


    Figure 12.12: Select the final two Bend Edges


    5. Press the green OK check mark to update the feature and we can now see that
    the entire shape has been converted to a Sheet Metal part. This is shown in Figure
    12.13 in both a Flattened and Unflattened state.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_247_0.png)


    Figure 12.13: The completed part


    This section showed how to use the basic functions of the Convert to Sheet Metal
    tool but there are a number of more advanced settings that can be used to fine-tune
    your Sheet Metal shapes.


    # Convert to Sheet Metal – Advanced Options


    Now that we understand how to use the Convert to Sheet Metal tool let''s look
    at the Reverse Thickness, Keep Body, Manual Rip Sketches, and Corner Defaults
    options in more detail.


    # Reverse Thickness option


    This setting allows the direction of the newly-created sheets to be reversed:


    +   1. Continuing from the previous section, edit the Convert Solid feature again,
    so that we are back in the tool''s Property Manager.


    +   2. We can now see two options under the Sheet Metal Parameters – Reverse thickness
    and Keep body (Figure 12.14).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_247_1.png)


    Figure 12.14: The Sheet Metal Parameters'
  merge: -1
  img_proc: true
- pgno: 248
  md: '+   3. Put a check mark in the **Reverse thickness** box and watch the preview
    in the Graphics Area closely. You should see that the size of the previewed part
    increases slightly so that the new, added sheets will be *outside* of the original
    shape, rather than completely enclosed within it. Try toggling the **Reverse thickness**
    option on and off to have a closer look at the changes.

    +   4. Select the **Reverse thickness** option (put a check mark in the box),
    then press **OK** to accept the changes. If we now measure the outside size of
    the *part* we can see that it is 79mm. This is the size of the original shape
    (75mm), plus the thickness of the two extra outer sheets (2mm each), on each side.

    +   5. The **Reverse thickness** option is a very simple setting but one that
    can be very useful if the internal size of your model is important.


    # The Keep body option


    Usually when a solid body is converted to Sheet Metal the original solid body
    is consumed (used up) by the **Convert to Sheet Metal** feature. However, there
    may be cases where we want to retain the original body. For example, we might
    want to reuse it to create another sheet:


    +   1. Continuing from the previous subsection, edit the **Convert Solid** feature
    again, so that we are back in the tool''s Property Manager.

    +   2. Select the **Keep body** option (*Figure 12.14*).

    +   3. Press **OK** to accept the changes. We can now see that the new Sheet Metal
    feature has been added, but the original body still remains in the model (*Figure
    12.15*). If you still have the **Reverse thickness** option selected then we will
    also see that the Sheet Metal feature is larger than the original body.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_248_0.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'We can also see that the Cut list folder in the FeatureManager Design Tree
    (Figure 12.16) is now followed by a (2). This indicates that we have two sheets
    or bodies in the current model. Expanding the folder allows us to see each of
    these in turn and they can be shown or hidden by selecting the item and clicking
    Show or Hide.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_249_0.png)


    Figure 12.16: The Cut list folder displays sheets and bodies in a model


    +   4. The Keep body option can be especially useful if you want to use a single
    body to create two or more sheets.


    +   5. Continuing from the previous subsection, edit the Convert Solid feature
    again, so that we are back in the tool''s Property Manager.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '6. Ensure that the Keep body and Reverse thickness options are still both selected
    but adjust the Bend Edges so only the five edges shown in Figure 12.17 are selected.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_250_0.png)


    Figure 12.17: Select the Bend Edges shown


    7. Press OK to accept the changes. Now we can see that we have a Sheet Metal sheet
    with no top and left-hand edge and we also have the original solid body (Figure
    12.18).'
  merge: -1
  img_proc: true
- pgno: 251
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_251_0.png)


    Figure 12.18: The sheet and original body


    8. We can now reuse the solid body to create a second sheet. Select the Convert
    to Sheet Metal tool again.


    9. This time select the upper face of the original body as the Fixed Face and
    the upper edge shown in Figure 12.19 as the Bend Line.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_251_1.png)


    Figure 12.19: Select the upper face and the edge'
  merge: -1
  img_proc: true
- pgno: 252
  md: '10. Deselect the **Keep body** option because we no longer need to keep the
    body. Also, deselect the **Reverse thickness** option. This will mean that this
    new sheet will fit within the first sheet and is a good example of why **Reverse
    thickness** can be useful for creating multi-sheet *parts* that fit together properly.


    11. Press **OK** to create the second sheet. *Figure 12.20* shows both sheets
    in an exploded view and shows how **Keep body** can be used with a single solid
    model to create *parts* with multiple sheets.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_252_0.png)


    Figure 12.20: The two finished sheets, in an exploded view


    As well as creating multi-sheet models, there may also be instances where it’s
    not desirable to create rips at existing edges. In these cases, manual **Rip Lines**
    can be used.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Manual Rip Lines


    So far we have just used the automatically allocated Rip Lines when converting
    to Sheet Metal. However, there may be times when we need to specify exactly where
    faces will be split apart using rips:


    +   1. Continue from the previous subsection, but delete the two existing **Convert
    Solid** features and the **Sheet-Metal folder** so that we only have the first
    **Boss-Extrude** in the model.

    +   2. Manual **Rip Lines** must be sketched *before* the **Convert to Sheet Metal**
    feature. In this case, we deleted the previous **Convert to Sheet Metal** features,
    but it is also possible to drag the **Rollback Bar** above the **Convert-Solid**
    feature in models and add sketches at that stage.

    +   3. Now sketch the **Rip Lines** using the **Line Tool**. For this example
    start a sketch on the large, upper face of the shape and draw a line directly
    between the midpoints of the long edges (*Figure 12.21*). Then exit the sketch.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_253_0.png)


    Figure 12.21: Sketch the Rip Line'
  merge: -1
  img_proc: true
- pgno: 254
  md: '4. We can now add the **Convert to Sheet Metal** feature as covered earlier
    in the chapter. Select the **Convert to Sheet Metal** tool, then select the underside
    face as the **Fixed Face**, then select the **Bend Edges** shown in Figure 12.22.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_254_0.png)


    Figure 12.22: Select the Fixed Face and Bend Edges


    5. Note that **Rip Edge** has still been automatically selected as the upper-right
    edge. However, we can manually change this to our Rip Sketch. To do this, click
    in the **Rip Sketches** selection box in the Property Manager, then select the
    Rip Sketch that we drew in Step 3 (Figure 12.23).'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'If you have difficulty selecting the actual line in the Graphics Area then
    it can be easier to expand the second Design Tree (in the upper left of the Graphics
    Area) and select the entire sketch there.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_255_0.png)


    Figure 12.23: Select the Rip Sketch


    6. We can now see that the upper face will be ripped along the Rip Sketch and
    that the top-right edge is no longer selected for a bend.


    Add the top-right edge to the Bend Edges.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '7. Press **OK** to create the feature and note that the **Rip Line** is halfway
    along the top edge (Figure 12.24).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_256_0.png)


    Figure 12.24: The finished model with a manual rip


    This method of adding manual Rip Lines can be extremely useful for specifying
    exactly how your solid parts will be created. There are also a number of smaller
    rip details that can be changed.


    # Adjusting rip and corner details


    Rip details can be further specified within the Property Manager of the **Convert-Solid**
    feature (Figure 12.25). Here, is it possible to change the style of the corner
    (**Butt**, **Underlap**, or **Overlap**), to adjust the **Gap Distance**, and
    to adjust the **Overlap/Underlap Ratios**.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_256_1.png)


    Figure 12.25: Corner Defaults


    It’s also possible to adjust the details of each bend and rip individually by
    selecting them in the Graphics Area and making any required changes.


    When creating Sheet Metal models using the **Convert to Sheet Metal** tool sometimes
    problematic features may accidentally be created. In the next section, we will
    look at an example of this and how it can be overcome.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Solving conversion issues


    When creating standard Sheet Metal models starting from a Base Flange it is generally
    quite difficult to create new flanges that have flattening issues, because SolidWorks
    will often automatically trim away problem areas. However, sometimes when converting
    models to Sheet Metal these flattening issues can occur inadvertently. We can
    force SolidWorks to create one of these issues, as an example of how to avoid
    it:


    +   1. Continuing from the previous section, edit the Convert Solid feature again,
    so that we are back in the tool''s Property Manager.

    +   2. Change the Fixed Face from the small underside face to the large side face
    (Figure 12.26). Then remove any existing Bend Edges (this will automatically remove
    any Rip Edges, if it does not then delete these manually) and just add the three
    Bend Edges shown.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_257_0.png)


    Figure 12.26: Adjust the Convert Solid feature


    +   3. Press OK to update the feature.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '4. If we now rotate the model we can see that everything appears correct in
    3D and no errors are visible. However, if we attempt to Flatten the model by pressing
    the Flatten button we can now see that two of the flanges occupy the same position
    (Figure 12.27).


    > Note

    > Depending on your SolidWorks version your model may not flatten but instead
    may display an error.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_258_0.png)


    Figure 12.27: Two of the flattened flanges occupy the same space


    It would be impossible to make this model (as it currently is) in real life because
    two different sections of it cannot come from the same area of flat sheet. This
    doesn’t necessarily mean that the overall part cannot be made, just that we might
    have to create it in a slightly different way, perhaps by adjusting where the
    bends are placed.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# If Your Model Does Not Flatten


    If you find that your models do not **Flatten** correctly then expand the **Flat-Pattern**
    Folder and look for any error or warning messages. This will indicate which features
    have problems that need to be fixed. If no errors are visible but the model still
    doesn’t **Flatten** then try suppressing earlier features, one by one, and then,
    if your model does not **Flatten** until you can narrow it down to a single problem
    area.


    One of the limitations of SolidWorks, and 3D CAD in general, is that sometimes
    models can be created using a computer that cannot be actually made in real life.
    When modeling, try to always consider how your parts will actually be made, and
    this can help reduce this kind of issue.


    # Summary


    In this chapter we looked at converting 3D models into Sheet Metal *parts* by
    using the **Convert to Sheet Metal** tool. We explored many of the sub-options
    and briefly discussed errors that might occur, and how they can be fixed. The
    **Convert to Sheet Metal** tool is a great option for saving time by taking pre-existing
    models and quickly changing them into a Sheet Metal format.


    In the next chapter, we will put together many of the techniques that we learned
    about in earlier chapters, and use them to create a sheet metal enclosure.'
  merge: -1
  img_proc: true
- pgno: 260
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 13

    Practical Example:

    The Sheet Metal

    Enclosure


    Sheet metal enclosures are common in the electronics industry. This chapter shows
    how to use various Sheet Metal techniques that we have learned to create an example
    enclosure, as well as giving handy tips and tricks for practical modeling. In
    this chapter, we''re going to cover the following main topics:


    +   - Creating the enclosure base

    +   - Adding more details to the enclosure

    +   - Creating an enclosure lid

    +   - Adding final details to the enclosure


    These sections will show how the various Sheet Metal tools can be used to build
    up a complete project. By the end of the chapter, you will know how SolidWorks
    Sheet Metal can be utilized in a real-world design situation.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Creating the enclosure base


    Our example enclosure will consist of two components – the *base* and the *lid*
    – both made within the same SolidWorks *part* file. These will each be made as
    separate sheets within the *part* file, starting off with the base sheet.


    Throughout this chapter, the instructions given are more of a guide than hard-and-fast
    parameters, so feel free to experiment with different sizes and features as you
    see fit.


    To create the base, follow these steps:


    +   1. Start a new SolidWorks *part* document.

    +   2. First, we will draw the **Base Flange** profile. Start a Sketch on the
    Top Plane and sketch a 350x600mm rectangle, as shown in Figure 13.1:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_262_0.png)


    Figure 13.1 – Sketching a rectangle for the Base Flange profile'
  merge: -1
  img_proc: true
- pgno: 263
  md: '**Sketching Tip!**

    Remember to always Fully Define your sketches by using Smart Dimensions and Relations.


    In this case, I recommend using a **Center Rectangle** tool and starting from
    the Origin. This will mean that the Front and Right Planes will be at the center
    of the **Base Flange**. This can be very useful for adding Mates in *assemblies*
    and also for using **Mirror** features within the *part*.


    3. From within the rectangle sketch, select the **Base Flange/Tab** option to
    create the first Sheet Metal feature.


    For my example, I set the **Sheet Thickness** property as 2mm and the **Bend Allowance**
    property as a K-Factor of 0.5.


    **Note**

    **Sheet thickness selection**

    The thickness of your sheet metal parts will depend on exactly what you need to
    do, and how they will be manufactured and used. Thinner sheet thicknesses will
    result in parts that are lighter (and cheaper!) but if you are creating large
    parts then thin sheets can lack rigidity.

    **Bend Allowance selections**

    In *Chapter 1, Sheet Metal Basics – Exploring Sheet Metal Properties and Material
    Selection*, we discussed the different types of Bend Allowance in detail, but
    if you are unsure which Bend Allowance type to use, then the safest option is
    usually to set a K-Factor of 0.5.

    You may also find it helpful to seek advice directly from your manufacturing partner.


    Next, we can build up the enclosure base by adding some walls. We could use a
    simple **Edge Flange** feature, but in my example, I am going to use a **Miter
    Flange** feature.


    **The Advantages of Using a Miter Flange Feature**

    The **Miter Flange** feature allows you to create more complex flange shapes using
    only a single feature, instead of using multiple **Edge Flange** features to build
    the same profile. The **Miter Flange** feature will also automatically miter any
    corners (trim them to fit together properly), whereas not all **Edge Flange**
    types will do this.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '4. Start a Sketch on the small end face of the Base Flange and use the Line
    tool to draw the profile shown in Figure 13.2. The vertical line is 75mm long
    and the small, horizontal line is 10mm long:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_264_0.png)


    Figure 13.2 – Sketching the Miter Flange profile


    5. The sketch profile can now be used to create the flange. Select the Miter Flange
    tool (from within the sketch). Then, select the four edges of the Base Flange
    (Figure 13.3):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_264_1.png)


    Figure 13.3 – Creating the Miter Flange'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'Note that the corners of the flanges are mitered so that they fit together
    properly. The square corners of the flange profile have also been rounded off
    with the model''s Bend Radius.


    # Setting or Changing the Bend Radius


    The default Bend Radius applies to all bends within the Sheet Metal model (unless
    it is overridden for specific features). The Bend Radius value was set automatically
    when creating the first Sheet Metal feature, but it can be adjusted by editing
    the Sheet-Folder in the FeatureManager Design Tree.


    In practical terms, the Bend Radius depends on a number of factors, primarily
    the thickness of the sheet being bent (as well as material type and the actual
    bending process used). Try speaking to your manufacturer or searching online for
    typical Bend Radius values.


    +   6. Set the Miter Flange parameters according to your preferences and then
    press OK to create the feature.


    We can now see that we created a simple enclosure base using only two features.
    If we had used Edge Flanges, then more features would have been required to build
    up the flange shape (especially if we had added more overhangs or other details).


    +   7. Save your part by pressing the Ctrl + S keys, clicking on the Save icon,
    or by going to File | Save As....


    # Saving in SolidWorks


    Try to get into the habit of regularly saving your models, as SolidWorks does
    occasionally crash during use.


    We have now created a simple enclosure base, and in the next section, we will
    build upon this by adding more features.


    # Adding more details to the enclosure


    Now that we have the bare bones of the enclosure base, we can begin to add some
    more features to expand the functionality. We will start by adding some circular
    cut-outs to the front face of the base. These holes might be for LED indicators,
    for cables, or perhaps even for ventilation.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'There are three main ways that we can make circular cut-outs in SolidWorks
    Sheet Metal:


    +   - **Simple Hole**: This tool allows basic circles to be cut into a sheet.
    The circle diameter is specified using the tool''s Property Manager but this tool
    is the least useful of the three options because the sketch of the feature then
    needs editing to specify the exact position of the hole. For this reason, it is
    often just as fast to use one of the other two options.

    +   - **Extruded Cut**: This option can be used, along with the **Circle** Tool,
    to make circular holes, but it is more useful when creating non-circular cut-outs.
    This is shown in more detail when we create a rectangular opening, later in this
    section.

    +   - **Hole Wizard**: The Hole Wizard is usually the best option for creating
    circular holes because it allows the exact hole size and type to be specified,
    either from a range of preset sizes or by using custom parameters. Multiple holes
    can then be quickly added, and it is very easy to position them and to edit any
    details at later stages.


    Of the three options above, the Hole Wizard tends to be best for creating circular
    holes, whereas Extruded Cut works best for non-circular cut-outs. The Simple Hole
    is the least useful option.


    Continuing on with the base enclosure model from the previous section, we can
    now use the Hole Wizard to cut some holes, and then later in the section, we will
    use Extruded Cut to make a rectangular cut-out:


    +   1. Select the **Hole Wizard** tool. This can be found on the **Features**
    tab.

    +   2. First, set the hole type and size. There are many options to choose from,
    but for simple, circular holes, a good option is the **Hole** type (upper-right
    button – see *Figure 13.4*) and the **Dowel Hole** sub-type (chosen from the drop-down
    menu). The hole diameter can then be selected from a range of preset sizes, or
    an exact size can be inputted by putting a check mark in the **Show custom sizing**
    box and then adding the value.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'In this case, I created a hole 20mm in diameter:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_267_0.png)


    Figure 13.4 – Setting the hole type and size


    At this stage, we can also set the End Condition as Blind with a depth of 10mm.
    This will prevent the holes from cutting all the way through both the front and
    back faces of the enclosure.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '3. Now that the hole details are specified, we can set their position. Select
    the **Position** tab at the top of the Hole Wizard Property Manager then select
    the face where the holes will be added. In our example, this will be the front
    face of the enclosure.


    The cursor will change to the **Point** tool and a hole will be placed anywhere
    a *point* is added. Add two holes to the front face, as shown in Figure 13.5:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_268_0.png)


    Figure 13.5 – Adding two 20mm diameter holes to the front face of the enclosure


    > **Using Centerlines to Line Up Holes**

    > When using the Hole Wizard (and other sketch-based features) centerlines can
    be extremely useful. In the example shown in Figure 13.5, a centerline was added
    between the two midpoints of the vertical edges of the front face. In this way,
    the holes can be lined up along the vertical center of the face.


    4. Use Smart Dimensions, Relations, and centerlines (if needed) to Fully Define
    the hole positions, and then press **OK** to add the holes.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Design Intent When Dimensioning, and Placing Holes Close to Edges and Bends


    When dimensioning items in SolidWorks, try to always consider your design intent.
    For example, in Figure 13.6, consider how we could dimension the two holes.


    If both holes are dimensioned from the left-hand edge of the enclosure (Figure
    13.6 – left) and then the position of the first hole changed, then the position
    of the second one would be unaffected.


    However, if the holes are dimensioned relative to each other (Figure 13.6 – right)
    and then the position of the first hole changed, then the second hole would also
    move.


    The exact way you dimension your features and sketches will depend on your design
    requirements, but try to keep this in mind when modeling.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_269_0.png)


    Figure 13.6 – Design intent when dimensioning


    5. With the first two holes added, now we can create a rectangular cut-out. This
    might be used to house something like a USB port. When making these non-circular
    shapes, it is usually best to use the Extruded Cut option.


    First, start a sketch on the front face, and then draw the cut-out profile, as
    shown in Figure 13.7.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'This was made using **Center Rectangle** and **Sketch Fillets** to round the
    corners. Again, centerlines can be useful for lining the sketch entities up with
    other elements such as the two holes.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_270_0.png)


    Figure 13.7 – Sketching the cut-out profile on the front face


    # Using External References


    If you are creating a design that uses pre-existing components, then it can be
    useful to create a SolidWorks *assembly* containing all of the *parts* and then
    to edit the new *parts* within the *assembly*.


    For example, if this enclosure design had a PCB model that was associated with
    it, then we could create an *assembly* containing both the enclosure and the PCB
    files. We could then edit the enclosure *part, within the assembly*, and use the
    PCB *part* to line up any cut-outs or other details. This would mean that if the
    PCB *part* later changed, then the enclosure *part* would automatically update
    to match these changes.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '6. We can now use the rounded rectangle profile to create the cut-out. From
    within the sketch, select the **Extruded Cut** tool.


    Select the **Link to thickness** option in the Property Manager. This will mean
    that the profile will only be cut through the selected face.


    7. Press **OK** to create the cut-out (Figure 13.8):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_271_0.png)


    Figure 13.8 – The rectangular cut-out next to the two holes


    Often with sheet metal designs, you will find that identical features are repeated
    throughout the model. Because of this, the **Mirroring** and **Patterning** features
    can be used to save time.


    In this case, we can mirror the cut-outs over on the other side of the enclosure.


    8. Select the **Mirror** tool from the **Features** tab, and then select both
    the **Hole Wizard** feature (the two circular holes) and the **Extruded Cut**
    (the rectangular cut-out). The **Mirror Plane** will be the large plane down the
    center of the model (this should be the Right Plane).'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Press OK to add the mirrored features (Figure 13.9):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_272_0.png)


    Figure 13.9 – Mirroring the cut-outs


    +   9. Note that we could have also used a Linear Pattern if we wanted to add
    more instances, spaced along the front face.


    We have now added a few more details to the base section of the enclosure in the
    form of both circular and rectangular openings. In the next section, we will create
    the lid, before returning to the base to add some final finishing touches.


    # Creating an enclosure lid


    Next, we are going to add a new Base Flange to the model to create the enclosure''s
    lid.

    This will turn the model into a multi-sheet part.'
  merge: -1
  img_proc: true
- pgno: 273
  md: 'To add the lid, follow these steps:


    +   1. First, we need to draw a profile for the new **Base Flange**. Start a sketch
    on the small upper face of the existing **Miter Flange** walls. Then use a **Corner
    Rectangle** to draw a rectangle that is slightly larger than the existing enclosure
    base all the way around (Figure 13.10):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_273_0.png)


    Figure 13.10 – Sketching a Corner Rectangle on the small upper face of the Miter
    Flange walls


    +   2. Now, we can fix the sides of the rectangle to the sides of the base using
    Relations. This method takes slightly longer than just using a **Center Rectangle**
    and setting a size using Smart Dimension, but it means that if the size of the
    base changes later, the size of the lid will automatically update to match this.


    In turn, select one of the sides of the sketched rectangle, and then also select
    the corresponding side of the base underneath (hold down the Ctrl key in order
    to select multiple items. Note that this is much easier from a Top view).'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'Then, make the two selected items Collinear. This can be done by selecting
    Make Collinear from the small popup menu (Figure 13.11), or by choosing Collinear
    from the Add Relations section of the Property Manager on the left:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_274_0.png)


    Figure 13.11 – Making the sides of the sketched rectangle Collinear with the existing
    base


    +   3. Continue the process with the remaining three edges so that the entire
    rectangle is Fully Defined and linked to the base section underneath (Figure 13.12):'
  merge: -1
  img_proc: true
- pgno: 275
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_275_0.png)


    Figure 13.12 – Linking to the rectangle sketch to the base


    4. We can now use the Fully Defined rectangle to create the lid sheet.


    Select the Base Flange/Tab tool. Then, before pressing OK, uncheck the Merge Result
    box. This will mean that the new Base Flange will be created as an entirely new
    sheet within the part, instead of being merged with the existing base sheet.


    It may also be necessary for you to flip the direction of the new Base Flange
    to ensure that it doesn''t clash with the existing base features (Figure 13.13).
    This can be done by clicking the Reverse direction box:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_275_1.png)


    ![](img/4e9c736de6bac4449096a7b92c28af4c_275_2.png)


    Figure 13.13 – Reverse the direction of the lid flange, if needed'
  merge: -1
  img_proc: true
- pgno: 276
  md: '5. Press OK to create the lid sheet. We can now see that the Cut list folder
    in the FeatureManager Design Tree (Figure 13.14) shows two different sheets –
    one for the base and one for the lid. If we expand the folder, we can show or
    hide each of the sheets in turn.


    Note that if your Cut list folder shows one single sheet, then try editing the
    latest Base Flange/Tab feature and ensuring that the Merge result option is deselected:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_276_0.png)


    Figure 13.14 – The Cut list folder, showing both sheets


    6. We can now see that the basic lid feature has been made, but at the moment,
    it just consists of a single, flat sheet. It is likely (depending on the thickness)
    that this sheet would flex under load and would lack rigidity. It would also slide
    around on the upper surface of the base section. To solve these two issues, we
    can add some small, overhanging sides to the lid:


    +   I. Select the Edge Flange tool and use it to add flanges to the short, front
    edge and the two longer side edges (Figure 13.15). These flanges can be 10mm long,
    with a 90° angle.


    +   II. Select the Material Outside flange position to ensure that the new Edge
    Flanges are clear of the base sheet:'
  merge: -1
  img_proc: true
- pgno: 277
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_277_0.png)


    Figure 13.15 – Add three Edge Flanges to the lid


    7. Press OK to create the three Edge Flanges. Note that we haven''t added a flange
    to the rear edge. This is because in real life, the lid could be attached to the
    base using a long piano hinge (Figure 13.16):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_277_1.png)


    Figure 13.16 – An example piano hinge for joining the lid to the base'
  merge: -1
  img_proc: true
- pgno: 278
  md: '8. The rear corners of the new Edge Flanges are still square and could be quite
    sharp, so use the Break Corner/Corner Trim options to round these off with a 5mm
    fillet (Figure 13.17):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_278_0.png)


    Figure 13.17 – Breaking the rear corners using a 5mm fillet


    Now, we have a fairly simple base and lid, but if we look closely at how the two
    sheets fit together, we may potentially see an issue. The lid currently fits exactly
    on the base, with no clearance (Figure 13.18). They are both the same size:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_278_1.png)


    Figure 13.18 – There is no clearance between the lid and the base'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'This could cause a problem because, in real life, parts are never made exactly
    the same size as they are modeled in SolidWorks. They will always be slightly
    larger or smaller, due to manufacturing limitations. This difference between the
    size of designed parts and the size of the manufactured parts is known as **tolerance.**


    For example, a *10mm* long part may be specified as *10.0±1mm*. This would give
    a real-life part between the size of *9.0mm* and *11.0mm*.


    Tolerances can be reduced (although tighter tolerances will result in increased
    manufacturing costs), but they will never be completely eliminated. Therefore,
    we should always design clearance between two parts that should fit together (unless
    we want an extremely tight interference fit as part of our design).


    For our example, this means that we should leave a gap between the lid and base
    sheets. This means that if the lid is made below tolerance (slightly smaller than
    the SolidWorks model) and the base is made slightly above tolerance (a little
    larger than the SolidWorks model), then the two sheets will still fit together.


    To add this clearance, we can simply edit the **Edge Flanges** and move them outward:


    +   1. Edit the **Edge Flange** feature and select the **Offset** option from
    the **Flange Position** section. The exact clearance amount depends on the tolerances
    – set by your budget, manufacturing processes, and your design requirements –
    but in this example, input a value of 0.5mm (*Figure 13.19*):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_279_0.png)


    Figure 13.19 – Offseting the Edge Flanges on the lid'
  merge: -1
  img_proc: true
- pgno: 280
  md: '2. To finish off the lid, we will now also add a Hem to the inside of the lid.
    This will prevent users from handling the sharp lower edges of the lid flanges.


    Select the Hem tool, and then add a Closed Hem, 5mm long, to the inside edges
    of the three Edge Flanges (Figure 13.20):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_280_0.png)


    Figure 13.20 – Adding Hems to the three Edge Flanges on the lid


    3. The extra thickness added by the Hems now means that the lid clashes with the
    base (this can be checked with the Interference Detection tool – see the following
    note). To fix this, edit the Edge Flanges again and increase the Offset value
    to 2.6mm to account for the extra folded over material of the Hems.


    # Interference Detection Tool


    The Interference Detection tool can be found on the Evaluate tab and is an extremely
    useful feature of SolidWorks. It can be used within both parts and assemblies
    to check whether the model has any areas that clash with each other.


    To use it, select the tool, and then choose the desired bodies, sheets, or parts,
    and press Calculate. Any interferences between the different areas will be shown
    in red.


    4. A final check of the lid may reveal that the Hems corners clash (this will
    depend on your Edge Flange Gap settings).


    If you find that these areas do clash with each other (Figure 13.21), then edit
    the Edge Flange feature and increase the Gap distance.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'In my case, **3mm** was a sufficient gap. Note that these clashes may not be
    picked up by the **Interference Detection** tool, as they are within one single
    sheet, not between different sheets, bodies, or *parts*:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_281_0.png)


    Figure 13.21 – Increasing the Edge Flange Gap distance to avoid the Hem corners
    clashing


    The lid sheet is now completed and, if necessary, we can use the **Flatten** tool
    to flatten it to check that everything looks correct.


    **Flattening Sheets in Multi-Sheet Models**

    When using the **Flatten** tool to check models, only one single sheet can be
    flattened at any one time.


    To select which sheet should be flattened, first expand the **Flat-pattern** folder
    at the end of the FeatureManager Design Tree. There will be one **Flat-Pattern**
    feature for each sheet in the model. Select the required sheet and then click
    **Flatten**. The selected sheets will be flattened and all other sheets will disappear
    from view.


    Press the **Flatten** button again to unflatten the sheet and the rest of the
    model will reappear.


    We have now created a simple enclosure base and a corresponding lid. In the next
    section, we will add some finishing touches to the enclosure.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Adding final details to the enclosure


    Now that we have a basic enclosure design, we can finish it off by adding some
    rear ventilation and by using Forming Tools to add some handles to the front face.
    This enclosure is a fairly simple example, but it shows the process that could
    be followed to build more complex designs by using simple steps.


    First, we will add some ventilation to the rear face of the enclosure using the
    Vent tool. We could also cut these vents manually, but the Vent tool speeds up
    this process:


    +   1. All Vents require a sketch of the Vent layout, so start a sketch on the
    rear face of the enclosure and draw the profile shown in Figure 13.22.

    +   2. A centerline was used to find the vertical midpoint of the rear face, and
    then the Circle tool and Offset Entities were used to add the three circles. The
    Line tool and Circular Sketch Pattern tool were used to add the five Ribs.


    The outer circle is 40mm in diameter, with two smaller circles, each one offset
    inwards by 8mm. The circles are 140mm from the Origin, which is at the center
    of the rear face:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_282_0.png)


    Figure 13.22 – Sketching the Vent details on the rear face


    # Creating Features Close to Sheet Edges and Bends


    Be aware that some manufacturers may have limits on how close cut-outs and other
    features can be made to sheet edges and bends. If your features are within 10mm
    (approximately 0.40") of an edge or bend, it is worth checking any production
    limitations with your manufacturer.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '3. We can now start creating the Vent feature. Select the Vent tool and use
    the sketch to populate the fields in the Property Manager. I used the following
    parameters (Figure 13.23):


    +   - **Boundary**: Select the outer (40mm) circle.

    +   - **Ribs**: Select the five straight lines. The ribs are 2mm thick.

    +   - **Spars**: Select the middle (32mm) circle. The spars are 2mm thick.

    +   - **Fill In Area**: Select the smallest (24mm) circle.

    +   - **Set a 2mm radius**: This will round off all of the sharp internal corners
    of the vent:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_283_0.png)


    Figure 13.23 – Creating the Vent'
  merge: -1
  img_proc: true
- pgno: 284
  md: "+   4. Press **OK** to create the **Vent**. Even though we have only made one\
    \ vent, we can now add more of these by patterning them.\n\n+   5. Select **Linear\
    \ Pattern** (from the **Features** tab).\n+   \n+   Use the **Vent** feature that\
    \ we just created and set a spacing value of 70mm, five instances, and select\
    \ one of the edges along the top or bottom of the rear face as the pattern direction\
    \ (*Figure 13.24*).\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_284_0.png)\n\n\
    Figure 13.24 – Patterning the Vent using a Linear Pattern\n\n+   6. Finally, we\
    \ can add some formed handles to finish off the design.\n\nOpen the **Design Library**\
    \ pane on the right-hand side of the screen and navigate to the `forming tools`\
    \ folder. Then, find the `louvers` subfolder. This folder should contain a louver\
    \ Forming Tool (*Figure 13.25*).\n\n> **Note**\n> \n> If you are unable to find\
    \ the louver tool, then you can create a custom forming tool, as detailed in *Chapter\
    \ 10, Adding 3D Details to Models with Forming Tools*:"
  merge: -1
  img_proc: true
- pgno: 285
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_285_0.png)


    Figure 13.25 – Finding the louver Forming Tool


    Left-click and drag the louver Forming Tool onto the front face of the base to
    add the formed louver shape to that face.


    +   7. Use the Positions tab within the Forming Tool Property Manager to precisely
    position the Forming Tool (Figure 13.26). You may have to use the Point tool to
    place a point at the position where the tool should be placed:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_285_1.png)


    Figure 13.26 – Positioning the formed handle'
  merge: -1
  img_proc: true
- pgno: 286
  md: '8. Press **OK** to add the formed handle feature.


    9. We can now see that the circular holes and the formed handles are too close
    together. Edit the **Hole Wizard** feature and move the two holes further away
    from the edge of the enclosure (Figure 13.27). The rectangular cut-out should
    also move position automatically since its position is defined relative to the
    two circular holes:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_286_0.png)


    Figure 13.27 – Adjusting the position of the two circular holes (and the associated
    rectangular cut-out)


    10. All that remains is to add a second formed handle to the other side of the
    front face. Select the **Mirror** tool (from the **Features** tab), and then set
    the Right Plane as the **Mirror Face/Plane** and the louver feature as **Features
    to mirror** (Figure 13.28). Press **OK** to add the second handle.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'These two louvers could now be used as handles to pull the tray out from a
    server cabinet:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_287_0.png)


    Figure 13.28 – Mirroring the formed handles


    This is how our completed sheet metal enclosure looks:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_287_1.png)


    Figure 13.29 – The completed sheet metal enclosure


    Congratulations – our sheet metal enclosure design is now complete (Figure 13.29)!
    Although this is a reasonably simple design, it has shown how we can use a multitude
    of different features to build up a model. These individual elements are not complex,
    but taken together, they can be combined to create more advanced designs.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Summary


    In this chapter, we combined various techniques that we have learned through the
    book to create a sheet metal enclosure. The base was made using a **Base Flange**,
    **Miter Flange**, and various cut-outs, **Vents**, and **Formed Tools**.


    The lid was built from another simple **Base Flange**, with **Edge Flange** sides
    and **Hems** to make it more user-friendly.


    This design drew upon a number of Sheet Metal tools and features, but the range
    of designs that you can create with the entire suite of SolidWorks Sheet Metal
    is only limited by your imagination and design requirements.


    As with most elements of SolidWorks, the key to mastering Sheet Metal is to practice
    the techniques wherever possible. Try looking out for sheet metal products in
    your day-to-day life and then think about how you might model these in SolidWorks.


    Sheet Metal is a great addition to the standard SolidWorks set of tools and one
    that can be used to take your modeling skills to the next level.'
  merge: -1
  img_proc: true
