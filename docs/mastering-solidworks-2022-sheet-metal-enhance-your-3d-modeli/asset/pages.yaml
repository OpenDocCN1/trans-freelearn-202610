    # About the author


    Johno Ellison is a UK design engineer who has worked with SolidWorks 3D CAD since
    2006. He has a wide range of product design and engineering experience, covering
    areas including mechanisms, 3D printing, materials selection, and rapid prototyping.


    His online SolidWorks courses have been taken by hundreds of thousands of students
    and he has worked with over 300 clients from all around the world. He holds a
    first-class honors degree in Sustainable Product Design from a top 25 UK university
    and has completed a range of SolidWorks-certified training courses in the UK.
    He also holds two Guinness World Records (Longest Distance covered, and Highest
    Altitude reached), for driving a London Taxi.


