- pgno: 19
  md: '# 1

    Sheet Metal Basics

    – Exploring Sheet Metal Properties and Material Selection


    SolidWorks is one of the world''s premier **three-dimensional (3D) computer-aided
    design (CAD)** modeling software, with millions of users. However, while many
    people use SolidWorks for 3D solid modeling, there are also a number of more specialist
    modules for creating other types of models. The SolidWorks Sheet Metal module
    is one of the most important of these because it unlocks the massive potential
    of sheet metal manufacturing and production.


    In this chapter, we''ll explore what sheet metal is and why it is important. We''ll
    learn how to create a Sheet Metal model using a **Base Flange** and how to edit
    the model''s **Sheet Metal properties.**'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'We''ll also cover **Flattening** *parts* and have a brief look at which materials
    are most commonly used for sheet metal.


    By the end of this chapter, you''ll understand how to start Sheet Metal *parts*
    and how to adjust their basic parameters, as well as having some wider knowledge
    of sheet metal manufacturing and use.


    In this chapter, we''re going to cover the following main topics:


    +   - Introducing Sheet Metal

    +   - Creating a **Base Flange**

    +   - **Sheet Metal** properties

    +   - Other **Base Flange** options and flattening parts

    +   - Considerations when selecting sheet metal materials


    # Technical requirements


    To complete this section and all following sections, you will require a copy of
    the SolidWorks software program, along with basic working knowledge. This includes
    how to carry out operations such as starting new *parts*, creating and editing
    sketches and features, and using common tools. For readers who are completely
    new to SolidWorks, it is advisable to gain a firm foundation of solid modeling
    first, before undertaking the Sheet Metal module covered in this book.


    During the course of the book, if a certain tutorial or tool is causing problems,
    then try double-checking all of the previous steps, or even try closing the *part*
    and starting again from the beginning.


    Error messages in SolidWorks can be quite descriptive and often tell the user
    exactly what the issue is. So, if presented with an error, then try to avoid the
    temptation to click **OK** without reading it properly, and attempt to carry out
    the action suggested in the message.


    If the problems persist, then feel free to contact me online via Twitter at www.twitter.com/johnoellison.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# SolidWorks versions


    The examples and demonstrations in this book were made using SolidWorks 2021.
    Other versions of SolidWorks may have very minor differences in things such as
    the interface and how certain options are labeled, but in general, the workflow
    should be very similar. If you do get stuck on any of these differences, then
    please contact me using the details previously provided.


    # Units of measurement


    Throughout this book, **millimeters** (**mm**) are used as the unit of measurement,
    but this can be adjusted according to the reader''s preference by setting the
    model''s units to **inches** (''), for example, and then typing the millimeter
    numerical value followed by mm into the **Smart Dimension** tool when adding dimensions.
    This will automatically convert the millimeter values into inches (or your selected
    unit type).


    # Terminology


    Throughout this book, "sheet metal" (lowercase) refers to the general industry
    and manufacturing methods used in the real world, whereas "Sheet Metal" (capitalized)
    refers specifically to the SolidWorks Sheet Metal module.


    The term "part" refers to a real-life component or item, whereas *part* (italicized)
    refers specifically to a SolidWorks *part* document.


    # Introducing Sheet Metal


    Sheet metal parts are those that are—as the name suggests—created from flat sheets
    of metal. Numerous different manufacturing techniques such as bending, cutting,
    and forming allow these simple flat sheets to be transformed into complex 3D parts.
    The popularity of sheet metal has exploded in modern times because it allows designers
    and engineers to take a widely available material type—the flat sheets—and use
    relatively low-cost tools and processes to create complex products, at an industrial
    scale.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'The chances are that a quick look around your home, garage, or workplace will
    reveal dozens of items that were created using sheet metal techniques. These can
    range from very simple items such as right-angle brackets to more complex products
    such as furniture, all the way up to detailed designs such as computer or electronics
    enclosures. Sheet metal is also used to create very complex items such as aircraft
    parts or car bodywork, although the most advanced formed parts are beyond the
    scope of SolidWorks Sheet Metal.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_22_0.png)


    Figure 1.1: Examples of sheet metal parts


    The beauty of the SolidWorks Sheet Metal module is that it allows users to create
    these 3D shapes, then flatten them down to sheets, and export them as **two-dimensional
    (2D)** designs that can be used for manufacturing.


    Another great aspect of SolidWorks Sheet Metal is that, despite the name, it doesn''t
    have to be used for purely metal parts. Sheet Metal can be used to create any
    kind of flattened 3D part, regardless of the real-life material. Try to think
    beyond the "metal" title, and a wide range of other uses can be unlocked. For
    example, Sheet Metal can be used to create cardboard packaging. This can be modeled
    in 3D before being virtually unfolded to be printed, cut out with a die-cutter,
    and then turned into 3D boxes. Sheet Metal can also even be used to create items
    as diverse as paper origami artwork.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_23_0.png)


    Figure 1.2: Sheet Metal isn''t just for metal but any material, such as this cardboard
    packaging


    Sheet Metal is a diverse set of manufacturing methods that will take your modeling
    and design to the next level. In summary:


    +   - Sheet metal uses flat sheets to create 2D or 3D parts.

    +   - Techniques include cutting, bending, and forming.

    +   - SolidWorks Sheet Metal parts don''t have to be metal!


    In the next section, we''ll look at how we can actually start making Sheet Metal
    parts in SolidWorks by creating a Base Flange that will be the foundation feature
    of these parts.


    # Creating a Base Flange


    SolidWorks Sheet Metal parts can be started in two main ways—either by creating
    a Base Flange or by converting existing 3D parts into Sheet Metal parts. This
    section will cover the use of Base Flanges, which are the simplest but also the
    most flexible way to start new Sheet Metal parts.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Setting up the workspace


    Before learning more about **Base Flanges**, let’s first ensure that the workspace
    is set up correctly for Sheet Metal modeling. The Sheet Metal tools can be found
    via the **Insert** menu on the top menu bar (Figure 1.3) but it is faster and
    more convenient to use the **Sheet Metal** tab or toolbar:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_24_0.png)


    Figure 1.3: The Sheet Metal tools in the Insert menu'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Setting up the Sheet Metal tab or toolbar


    To add the Sheet Metal tab, proceed as follows:


    +   1. From within a SolidWorks part document, right-click on any of the existing
    tabs, or in any empty space, on the Command Manager (labeled i in Figure 1.4).


    +   2. Select the Tabs sub-option (labeled ii in Figure 1.4) and ensure that there
    is a check mark next to the Sheet Metal option (labeled iii in Figure 1.4).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_25_0.png)


    Figure 1.4: Adding the Sheet Metal tab to the Command Manager


    This will then add the Sheet Metal tab to the existing tabs of the Command Manager.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'To add the **Sheet Metal** toolbar:


    +   1. The **Sheet Metal** toolbar can be added in a similar way to the tab. First,
    right-click on any of the existing tabs, or in an empty space, on the **Command
    Manager** (labeled i in Figure 1.4).

    +   2. Select the **Toolbars** sub-option and ensure that there is a check mark
    next to the **Sheet Metal** option.


    > **Should You Use the Sheet Metal Toolbar or the Sheet Metal Tab?**

    > By default, the **Sheet Metal** tab and toolbar both contain the same set of
    tools. Either can be used throughout the book and this is a matter of user preference.

    > The **Sheet Metal** tab contains larger, clearer icons, but the toolbar can
    be moved into the **Graphics Area** for easier access to tools.


    # Making a Base Flange


    A **Base Flange** is the first feature of a Sheet Metal part and is the simplest
    way to create new Sheet Metal parts, while also offering the most flexibility.
    This is because once a **Base Flange** has been created, additional features such
    as bends and flanges can be added to build up a 3D part in a similar way to standard
    solid modeling. By contrast, converting existing parts to Sheet Metal (as covered
    later in the book) can limit the type of part that can be created and reduce editing
    options at later stages.


    To actually create a **Base Flange**, a profile first needs to be sketched. Various
    profile types can be used, but this section will cover the simplest: a **Single
    Closed** profile.


    To create a **Base Flange**:


    +   1. Start a new SolidWorks part.

    +   2. Start a sketch on the appropriate Plane, such as the **Top Plane** (labeled
    i in Figure 1.5).

    +   3. Sketch the **Base Flange** profile. Different profile types will be covered
    later in the chapter, but for now, simply create a closed profile, such as a **Center
    Rectangle** (labeled ii in Figure 1.5).

    +   4. Fully Define the profile by using the **Smart Dimension** tool and linking
    it to the **Origin** (labeled iii in Figure 1.5). Make the rectangle 200mm high
    and 300mm wide.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Fully Defining Sketches


    During SolidWorks modeling, it is important to Fully Define sketches to ensure
    that the Sketch Entities are fixed and will not behave in unexpected ways, such
    as moving position. Fully Defined Sketch Entities will turn black, and when a
    sketch is Fully Defined, this will be indicated in the lower right of the screen
    (labeled iv in Figure 1.5).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_27_0.png)


    Figure 1.5: Sketching the Base Flange profile


    +   5. Exit the sketch (labeled v in Figure 1.5).

    +   6. Select the Sheet Metal tab or toolbar and select the Base Flange/Tab option—this
    should be the first icon (labeled i in Figure 1.6).

    +   7. You will be prompted to select a sketch. Select the previous sketch that
    was just drawn and a yellow preview of the Base Flange should appear (see Figure
    1.6).


    # Note


    It is also possible to skip Step 5 and select the Base Flange/Tab option directly
    from within the sketch. In this case, the sketch that is being edited will automatically
    be used.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '8. Enter the following settings (these will be covered in more detail later
    in the chapter):


    +   - Thickness: 1mm

    +   - Bend Allowance: K-Factor, 0.5

    +   - Auto Relief: Rectangular

    +   - Ratio:0.5 (labeled iii in Figure 1.6)


    Press OK (labeled iv in Figure 1.6) and the Base Flange feature is created.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_28_0.png)


    Figure 1.6: Creating a Base Flange feature


    The Base Flange feature is now created, and Base-Flange1 (note: your number may
    differ) appears in the FeatureManager Design Tree at the left of the screen (labeled
    i in Figure 1.7). This feature can be edited and adjusted in the usual way by
    left-clicking on the feature and selecting Edit Feature.


    Creating a Base Flange feature turns the entire part into a Sheet Metal part and
    so automatically adds some extra items to the FeatureManager Design Tree. These
    items indicate that a part is a Sheet Metal model, and they are made up of the
    following:


    +   - Sheet-Metal folder: This contains all of the global properties of your Sheet
    Metal part, such as the Thickness and the Bend Radius properties (labeled i in
    Figure 1.7).'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   - Flat-Pattern folder: This folder contains a flattened version of the
    part (labeled iii in Figure 1.7). By default, this folder will be suppressed,
    so it will appear grayed out at this stage, but this will be covered in more detail
    later in the chapter.

    +   - Cut list folder: This folder contains all of the separate sheets that make
    up the part. It can be thought of in a similar way to the Solid Bodies folder
    that is used in normal solid modeling


    The number in brackets after the folder name indicates how many sheets make up
    the part. For example, a part with two separate body and lid sheets would show
    (2) after the Cut list folder (labeled iv in Figure 1.7).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_29_0.png)


    Figure 1.7: Sheet Metal part details


    Base Flanges are usually the best way of starting your Sheet Metal parts and are
    often the first feature created in a Sheet Metal part. They can be made by sketching
    a closed profile, then selecting the Base Flange/Tab option from the Sheet Metal
    tools.


    Adding a Base Flange feature will turn the part into a Sheet Metal part and will
    automatically add the Flat-Pattern, Cut list, and Sheet-Metal folders, which we
    will explore more in the following section.'
  merge: -1
  img_proc: true
- pgno: 30
  md: "> **Saving Parts**\n> At this stage, your current *part* can be saved as we\
    \ will continue using this document throughout the book.\n> \n> When working in\
    \ SolidWorks, try to get into the habit of regularly saving your work, as a safeguard\
    \ against crashes and other problems.\n\n# Sheet Metal properties\n\n**Sheet Metal**\
    \ properties are global settings that apply to the entire *part*. This section\
    \ shows how to adjust these properties and what they actually mean. The section\
    \ contains some background theory that is fairly dry but is an important foundation\
    \ for understanding Sheet Metal. Some of this underlying theory will become much\
    \ clearer once we actually start to use and demonstrate the tools later in the\
    \ book, so don’t worry too much if certain parts of it still appear a little confusing\
    \ at this stage.\n\nThere are four Sheet Metal properties:\n\n+   1. **Sheet Thickness**\n\
    +   2. **Bend Radius**\n+   3. **Bend Allowance**\n+   4. **Auto Relief**\n\n\
    # Editing the Sheet Metal properties and adjusting the Sheet Thickness\n\nAs previously\
    \ mentioned, Sheet Metal *parts* are usually made from sheets with a constant\
    \ thickness. Therefore, the **thickness** of a *part* is an important aspect of\
    \ Sheet Metal.\n\nTo edit the **Sheet Metal** properties of a *part*, simply left-\
    \ or right-click on the Sheet-Metal folder in the FeatureManager Design Tree (labeled\
    \ **ii** in *Figure 1.7*) and select **Edit Feature**.\n\nTo set the thickness,\
    \ adjust the value under the **Thickness** field (labeled **i** in *Figure 1.8*)\
    \ and press the green **OK** check mark. For example, try setting 2mm thickness\
    \ and pressing **OK**. You should now see that the thickness of the **Base Flange**\
    \ has changed from 1mm to 2mm."
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_31_0.png)


    Figure 1.8: Sheet Metal properties


    This **Thickness** setting is global throughout the entire *part*, so any new
    features that are added, such as **Edge Flanges**, will also be made using this
    same thickness. Editing one single value in the `Sheet-Metal` folder provides
    a very simple way to adjust the entire *part* and all of the features that make
    it up.


    # Editing the Bend Radius


    Along with the thickness, another very important property of Sheet Metal *parts*
    is the **Bend Radius**.


    Whenever a flat sheet of metal is bent or folded to create 3D parts, the corners
    that are created by the bending process will never be completely square. Even
    with a very thin and flexible material, such as aluminium foil, a small bend radius
    is needed.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'This is also true in SolidWorks Sheet Metal: a bend radius is always required
    (Figure 1.9), even if it is tiny.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_32_0.png)


    Figure 1.9: A bend radius is always needed


    In SolidWorks Sheet Metal the Bend Radius refers to the size of the inside of
    bends, and it can be set in the Sheet Metal properties.


    Simply edit the Sheet Metal properties and adjust the value (labeled ii in Figure
    1.8).


    By default, the Bend Radius that is set in the Sheet Metal properties will apply
    to any features that are added to the part, although the Bend Radius can be overridden
    for specific bends, and this will be covered later in the book.


    # What size should we set the Bend Radius to?


    Although setting the Bend Radius value itself is straightforward, how do we actually
    know what value to use for it? Bend Radius depends on a number of factors, such
    as the material type, the manufacturing method, and the thickness of the material.
    In general, as the sheet thickness increases, the bend radius value also increases.
    To visualize this, think about bending a very thin sheet of metal foil, compared
    to bending a thick plate—the thinner sheet will allow a much tighter bend to be
    created.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'General figures for steel bending might be something like this:


    | Sheet Thickness | Bend Radius |

    |---|---|

    | 1mm | R1.4mm |

    | 2mm | R1.88mm |

    | 3mm | R2.75mm |

    | 4mm | R3.0mm |

    | 5mm | R3.6mm |


    There are a number of ways to determine the **Bend Radius.**


    +   - **Speak to your manufacturer.** The most reliable method of determining
    the **Bend Radius** is usually to talk directly to the people making your *parts*.
    Tell them what you''re planning to create, and the material type and thickness,
    and they should be able to recommend certain settings to use.

    +   - **Search online or in reference books.** Try searching for a phrase such
    as `1mm thick steel bending radius`. The results should give you a good idea of
    suitable values to start your design, which can then be fine-tuned at a later
    stage by adjusting the Sheet Metal properties.

    +   - **Use the SolidWorks Gauge Tables.** Gauge numbers are a way of measuring
    the thickness of metal sheets based on weight. SolidWorks contains gauge tables
    that are a list of preset sizes that are built into SolidWorks Sheet Metal. They
    can be used to find common **Bend Radius** values.


    To activate the **Gauge Tables:**


    +   I. Put a check in the **Use gauge table** box at the top of the **Sheet Metal**
    properties (labeled iii in *Figure 1.8*). A table can then be selected from the
    drop-down list.


    > **Note**

    > SolidWorks Gauge Tables require Microsoft Excel to be installed on the computer
    and will not work without it.


    +   II. Try selecting a table such as the `SAMPLE TABLE - STEEL` (*Figure 1.10*).
    The thickness of the Sheet Metal *part* can now be set using the gauge numbers
    from the dropdown list, rather than the specific thickness value.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'III. Experiment with different sizes to see how the gauge number relates to
    actual thickness:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_34_0.png)


    Figure 1.10: Using the Gauge Tables


    Note

    A higher gauge number corresponds to a thinner sheet. It can be seen in Figure
    1.10 that 4 Gauge steel is 5.69mm thick, whereas 16 Gauge steel is only 1.51mm
    thick.'
  merge: -1
  img_proc: true
- pgno: 35
  md: "As the gauge number is changed, you'll notice that the **Bend Radius** value\
    \ also automatically changes to correspond to the new sheet sizes. As expected,\
    \ thicker sheets require a higher **Bend Radius** value.\n\n> **Exercise Caution\
    \ When Using Gauge Numbers!**\n> Gauge numbers are specific to the material used,\
    \ so confusion is easily caused. For example, a given gauge number of steel is\
    \ **not the same thickness** as one in aluminum. **16 Gauge** steel is 1.52mm\
    \ thick, but **16 Gauge** aluminum is only 1.29mm thick. For this reason, many\
    \ international standards organizations recommend against the use of gauge numbers\
    \ and instead suggest specifying the sheet thickness using dimensions.\n> \n>\
    \ The Gauge Tables can give a good indication of bend radii, but I recommend using\
    \ them as a guide only, and instead directly setting and specifying sheet thicknesses.\n\
    \nThe **Bend Radius** is a vital *aspect* of SolidWorks Sheet Metal and is needed\
    \ for every bent *part*. It can be set in the **Sheet Metal** properties as a\
    \ global value, but can also be overridden for certain bends if needed.\n\nGet\
    \ an idea of the **Bend Radius** needed by either speaking to your manufacturer,\
    \ searching online, or using **Gauge Tables**. However, if using gauge numbers\
    \ and tables, be careful to ensure your material choice is correct and clearly\
    \ marked on any drawings. It is wise to use gauge tables as a guide only, and\
    \ instead (or in addition to this) specify an exact sheet thickness.\n\n# Understanding\
    \ the Bend Allowance\n\nThe next Sheet Metal property that affects your models\
    \ is the **Bend Allowance** property (labeled *iv* in *Figure 1.8*). This allows\
    \ us to accurately calculate the size of bent *parts* once they have been unfolded\
    \ into a flat sheet."
  merge: -1
  img_proc: true
- pgno: 36
  md: 'To understand what exactly the **Bend Allowance** property is and why it is
    important, let''s look at a simple *part* from the side. This consists of a **Base
    Flange** and one single **Edge Flange**, as illustrated in Figure 1.11.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_36_0.png)


    Figure 1.11: Understanding the Bend Allowance property


    We can see that the size of the Sheet Metal *part* will be the length of the **Base
    Flange** (A in Figure 1.11) plus the length of the **Edge Flange** (B in Figure
    1.11), plus the size of the area of the bend itself (**BA** or Bend Allowance
    in Figure 1.11). Therefore, when the *part* is flattened, the total size of the
    sheet that we require will be **A + B + BA**.


    However, depending on how and where the bend length (**BA**) is measured, we may
    end up with different values. For example, if the inside of the bend is measured,
    the length may be 5mm, but if the outside of the bend is measured then the length
    will be longer—15mm in this case, as illustrated in Figure 1.12.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_36_1.png)


    Figure 1.12: The size of the bend depends on where exactly is measured'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'The length of **BA** is determined by the **Bend Allowance** in the **Sheet
    Metal** properties, and there are a number of different options to set the **Bend
    Allowance**.


    These **Bend Allowance** options are:


    +   - **Bend Table**

    +   - **K-Factor**

    +   - **Bend Allowance**

    +   - **Bend Deduction**

    +   - **Bend Calculation**


    Each option will give slightly different end results, but if you''re unsure which
    option to use, then it''s usually best to use the **K-Factor** bend allowance.


    > **What Is the K-Factor Bend Allowance?**

    > K-Factor is a way of working out the size needed for bends in sheet metal. Whenever
    a metal sheet is bent, there will always be a region of the bend, inside the bend,
    where the material is compressed, and another region, outside of the bend, where
    the material is stretched. At a certain point within a cross-section of the sheet,
    there will be a boundary where the compression and stretching exactly cancel each
    other out. Along this boundary, there will be no change of length in the material.
    The K-Factor is the name given to a line along this boundary, where no change
    in length occurs between flat and folded parts (Figure 1.13).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_37_0.png)


    Figure 1.13: The K-Factor is an imaginary line through a cross-section of the
    material, where there is no change in size between the bent part and the flat
    part'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The K-Factor is a ratio, so it will always be between 0 and 1. The inside of
    the bend is a K-Factor of 0 and the outside of the bend is a K-Factor of 1. Therefore,
    the middle of the bend is a K-Factor of 0.5, as illustrated in Figure 1.14.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_38_0.png)


    Figure 1.14: The K-Factor is a ratio indicating a line through a cross-section
    of the bend


    **What Value of K-Factor Should I Use?**

    The K-Factor depends on a number of factors, such as material and bending type.
    If you''re unsure about what to use, then a K-Factor of 0.5 is usually a good
    estimate for most parts and materials.

    You can also try asking your manufacturer what value they recommend you should
    use.


    The K-Factor is the easiest way to work out **Bend Allowances** and can easily
    be changed at a later stage if needed, by editing the **Sheet Metal** properties.


    # Other Bend Allowance options


    As well as the K-Factor, there are also some other ways of calculating the **Bend
    Allowance**. If you are unfamiliar with these methods, then it is highly recommended
    that you use the **K-Factor** option, as detailed previously. The other **Bend
    Allowance** options are:


    +   - **Bend Allowance**: This allows you to specifically define the length of
    the **Bend Allowance**. This can be useful if a manufacturer gives you a certain
    value to use. However, this option should be used with care as any value can be
    inputted. Therefore, if an incorrect value is used, this can result in completely
    wrong sizes on **Flat Pattern** parts.

    +   - **Bend Deduction**: This option is somewhat similar to the **Bend Allowance**
    option but it measures the outside length of the folded *part*, then removes (or
    deducts) a certain value. Again, if you are unfamiliar with this method, use it
    cautiously, as using the wrong **Bend Deduction** value can give unusable results.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '+   - **Bend Table**: This option allows a Bend Table to be created in Microsoft
    Excel. This table can specify Bend Allowance or Deduction values based on exact
    bend details, such as the radius and angle.

    +   - **Bend Calculation**: Finally, the **Bend Calculation** option allows the
    use of equations to calculate the bending allowance based on factors such as the
    material''s thickness, K-Factor, and the bend radius.


    The **Bend Allowance** option is an important factor in ensuring that you are
    able to use the correct size of flat sheet to make your final, bent parts. A number
    of options are available, but if you''re unfamiliar with **Bend Allowance**, then
    it is recommended that you simply use the **K-Factor** option. A **K-Factor**
    value of 0.5 gives a good estimation for most parts, and your manufacturer should
    be able to advise you in more detail, based on the material type and your exact
    part details.


    # Auto Relief options


    The final Sheet Metal property is **Auto Relief**. This is a way of automatically
    adding relief cuts to bends if they are required. *Figure 1.15* shows a simple
    **Base Flange** with an **Edge Flange** that only runs part of the way along the
    edge. In order to create this specific type of bend, **Auto Relief** cuts are
    needed; otherwise, the metal won''t be able to bend correctly:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_39_0.png)


    Figure 1.15: An example of an Auto Relief cut


    **Auto Relief** cuts aren''t needed on all bend types and will be automatically
    added when they are required. However, the exact type of relief cut is what is
    specified in the **Auto Relief** option.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'The three types are:


    +   - **Rectangular**: This gives a rectangular cut (see Figure 1.16). The size
    of the cut is determined by the ratio number and is related to the thickness of
    the sheet—for example, a ratio of 0.5 and a sheet thickness of 1mm will give a
    relief cut 0.5mm wide, which extends 0.5mm beyond the bend region. Note: the relief
    ratio has to be between 0.05 and 2.0.

    +   - **Obround**: This gives a more rounded cut (see Figure 1.16) and also uses
    a ratio based on the thickness of the sheet in the same way as the **Rectangular**
    option.

    +   - **Tear**: This option essentially tears the metal, without providing a visible
    cut area. This is the minimum that is needed to be able to flatten and bend the
    part.


    All three options are depicted here:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_40_0.png)


    Figure 1.16: Auto Relief examples; left to right: Rectangular, Obround, Tear


    **Auto Relief** cuts are an important requirement for some bend types but they
    will be added automatically, so this option can usually be set to **Rectangular**
    or **Obround** with a ratio of 0.5 unless you have specific requirements.


    # A recap of Sheet Metal properties


    **Sheet Metal** properties are an important way of defining your Sheet Metal part.
    They can be adjusted by editing the Sheet-Metal folder within the FeatureManager
    Design Tree. They generally apply to the whole part, although they can often be
    overridden for specific features.


    The four options are:


    +   - **Thickness**: This determines the thickness of the sheet used to create
    the **Base Flange** and subsequent features.

    +   - **Bend Radius**: This sets the internal size of bends. A **Bend Radius**
    is always required for bent edges in SolidWorks Sheet Metal.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '+   - **Bend Allowance**: This allows us to accurately calculate the correct
    size of flat sheet that can be used to create bent *parts*. There are a number
    of ways to calculate the **Bend Allowance**, but if you are unsure, then the best
    option is usually a **K-Factor** value of 0.5.

    +   - **Auto Relief**: Some bends require relief cuts in order for them to be
    flattened or folded correctly. These will be added automatically if needed, but
    this option controls the size and type of cut.


    Now that we have learned the basics of Sheet Metal properties and creating **Base
    Flanges**, we can go on to explore how 3D *parts* can be flattened, as well as
    more advanced types of **Base Flanges**.


    # Other Base Flange options and flattening parts


    In the previous section, we introduced **Base Flanges**, which are usually the
    first feature of your Sheet Metal *part*. As an example, we sketched a simple
    rectangle and then used this to make a rectangular **Base Flange**. This type
    of **Base Flange** is called a **Single Closed** profile because it only contains
    one single profile and that profile is closed (that is, it has no open areas or
    gaps in the outer perimeter). This can be seen in *Figure 1.17*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_41_0.png)


    Figure 1.17: A Single Closed profile contains one single profile, which is closed'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'However, two other options can be useful for creating different kinds of **Base
    Flanges**. These are the **Multiple Contained Closed** and the **Single Open Contour**
    profiles. It''s not too important to remember the specific names, as long as you
    know how to use each type.


    # Multiple Contained Closed


    For our previous **Base Flange**, we just used one single closed profile, but
    closed profiles can also contain *other closed profiles* within them. This type
    is known as **Multiple Contained Closed** and can be useful for adding holes and
    cutouts to your **Base Flange**. An example of this is shown in Figure 1.18.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_42_0.png)


    Figure 1.18: Multiple Contained Closed Base Flanges can contain smaller closed
    profiles within one larger closed profile


    Although using the **Multiple Contained Closed** option for creating **Base Flanges**
    can sometimes save time, I would personally recommend creating very simple **Base
    Flanges** and then adding extra cutouts and holes as separate features. This approach
    just makes it easier to adjust or remove extra details later on, if needed.


    # Single Open Contour


    Instead of using closed profiles, it is also possible to create **Base Flanges**
    using open profiles known as **Single Open Contours**. These can range from a
    simple, single line, up to more complex collections of Sketch Entities.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'To create a basic **Single Closed Contour Base Flange**:


    +   1. Start a new *part* document and start a sketch on the appropriate Plane,
    such as the **Front Plane**.

    +   2. Sketch the **Base Flange**. It can be easiest to think of the **Single
    Open Contour** option as a side view or cross-section view of the flange. For
    the first example, try a single horizontal line, 100mm long, using the **Line**
    tool (see *Figure 1.19*).

    +   3. Remember to Fully Define your sketch by starting from the Origin and using
    the **Smart Dimension** tool to set the line’s length.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_43_0.png)


    Figure 1.19: Using a single-line sketch to create a Single Open Contour Base Flange


    +   4. Select the **Base Flange/Tab** option from the **Sheet Metal** tab or toolbar.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '5. The width of the **Base Flange** can be set using the **Direction 1** (and
    **Direction 2**, if required) options in the **Property Manager** on the left
    of the screen. The **Sheet Metal** properties can also be set at this stage (see
    Figure 1.20).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_44_0.png)


    Figure 1.20: Creating a Base Flange


    6. Press **OK** to create a **Base Flange**. It can be seen that this creates
    a simple, rectangular **Base Flange** similar to the **Single Closed Profile**
    example from the first section.


    In this way, the **Single Open Contour Base Flange** can be thought of as similar
    to the **Thin Feature Extrude** option from normal solid modeling.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Creating more Base Flange complex shapes


    The real beauty of using the Single Open Contour option is that it allows you
    to easily create more complex, bent shapes in one feature.


    +   1. Start a new part document and start a sketch on the appropriate Plane,
    such as the Front Plane.

    +   2. Sketch a more complex shape using the Line tool. An example Z or jog shape
    can be seen in Figure 1.21.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_45_0.png)


    Figure 1.21: A more complex Single Open Contour sketch


    +   3. Select Base Flange/Tab from the Sheet Metal tools and set your desired
    options. Example settings could be:


    +   - Width: 10mm, Direction 1

    +   - Thickness: 2mm

    +   - Bend Radius: 1mm'
  merge: -1
  img_proc: true
- pgno: 46
  md: '4. Press **OK** to create a **Base Flange** (*Figure 1.22*). It can be seen
    that although the underlying sketch had sharp corners, the actual **Base Flange**
    feature has automatically been created with the bent corners using the **Bend
    Radius** that was specified in the **Sheet Metal** properties:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_46_0.png)


    Figure 1.22: Single Open Contour Base Flange


    **Using Single Open Contours** to create **Base Flanges** can be a good way to
    simplify the production of parts such as simple brackets.


    Note that these types of sketches don’t just need to use straight lines—they can
    also use arcs and splines if required.


    # Flattening parts


    Now that we have created a *part* with bends in it, we can explore how 3D Sheet
    Metal *parts* can be flattened. Flattening is one of the features of the SolidWorks
    Sheet Metal module that really does add huge value to the design process because
    it allows *parts* to be accurately converted from finished *parts* into a state
    that can be easily created from sheets of flat stock material.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'To flatten Sheet Metal parts:


    +   1. From within a Sheet Metal part, select the Flatten option from the Sheet
    Metal tab or toolbar (labeled i in Figure 1.23).

    +   2. The part will be unfolded into a flat sheet. Note the dotted outline, which
    indicates the bounding box of the flattened part, and the sketch lines, which
    show the location of Bend Lines (labeled ii in Figure 1.23).

    +   3. If your Bend Lines aren''t visible, try going to View | Hide/Show | Sketches.

    +   4. Note also that the Flat-Pattern folder at the end of the FeatureManager
    Design Tree is now unsuppressed and so is no longer grayed out (labeled iii in
    Figure 1.23).


    Using the Flatten option essentially unsuppresses (or switches on) the Flat-Pattern
    folder, which flattens the part. If you expand the Flat-Pattern folder, then the
    Flat Pattern feature will be seen, and this contains the bend details of the part.


    +   5. To unflatten—or fold up—the part, simply click the Flatten button on the
    Sheet Metal tab or toolbar again or click the Flatten button that can be seen
    in the top right of the graphics area (labeled iv in Figure 1.23). Note that the
    part folds up and the Flat-Pattern folder is now suppressed (or switched off)
    again.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_47_0.png)


    Figure 1.23: Flatten option


    The Flatten option is a vital aspect of SolidWorks Sheet Metal that allows parts
    to be unfolded. As we progress through the book and learn about the Sheet Metal
    tools, we will see this option in use in a more practical setting.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# A recap of Base Flange options and flattening parts


    There are three types of Base Flange (See Fig. 1.24):


    +   1. **Single Closed Profile**: This is one of the most basic types of Base
    Flange and uses one single profile that is fully closed, such as a simple rectangle
    or square. Although it is simple, this type of Base Flange is extremely useful
    and is likely to make up the majority of Base Flanges for Sheet Metal parts.

    +   2. **Multiple Contained Closed**: Closed profiles can also contain smaller,
    closed profiles such as cutouts and holes. While these types of Base Flanges can
    be useful in certain situations, it is generally better practice to create simple
    Base Flanges using a Single Closed Profile and then add any extra holes, cuts,
    or details as separate features. This makes modification of these features at
    a later stage much easier.

    +   3. **Single Open Contour**: Base Flanges can also be created using a collection
    of single Sketch Entities such as lines, arcs, and splines. This type of Base
    Flange can be useful when creating items such as brackets.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_48_0.png)


    Figure 1.24: Types of Base Flange; left to right: Single Closed Profile, Multiple
    Contained Closed, Single Open Contour


    Flattening is a vital aspect of SolidWorks Sheet Metal and parts with bends can
    be flattened by simply selecting the Flatten option from the Sheet Metal tools.
    This will unsuppress the Flat-Pattern folder and unfold any bends in the part.


    So far in this chapter, we have learned how to start Sheet Metal parts and how
    to create the first feature of most of these parts—the Base Flange. We have also
    looked at how to edit the various Sheet Metal properties that are important to
    those parts. So, now that we have a reasonable idea of how to start virtual Sheet
    Metal parts, we will jump briefly into a real-world aspect of sheet metal and
    take a look at the various sheet metal materials available.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Considerations when selecting sheet metal materials


    There are dozens of types of metal that could be used to create sheet metal parts
    and these all vary in use, physical properties, cost, and availability. The following
    pages will give you an idea of which might be best for your project.


    This section is not an exhaustive list of materials; rather, it is just an overview
    of some of the most common ones that you are likely to encounter. Within these
    materials, there are also many specific grades (sub-types) of metal, each with
    slightly different properties. If in doubt, discuss your needs and budget with
    your sheet metal manufacturer and your material supplier to find the most suitable
    choice for your needs.


    # Steel and aluminum


    The vast majority of sheet metal parts around us are made from either steel or
    aluminum, and of those, steel is probably the most common material.


    # Advantages and disadvantages of steel


    Steel is an excellent all-round material, and if you''re unsure which material
    to use, then steel is usually a solid choice. Steel is so popular and widely used
    for a number of reasons. It is very strong, easy to weld, and ductile, which means
    it is easy to bend and form compared to more exotic metals. Steel is also fairly
    inexpensive—it can be up to three times cheaper than aluminum for the same weight—and
    is widely available.


    Material choice is always about compromise, so every material will have disadvantages.
    One of the main downsides of steel is that it is quite heavy—around two and a
    half times denser than aluminum, depending on the exact grades used. This means
    that if you have two pieces that are the exact same size and shape, then the steel
    part will be significantly heavier than the aluminum part.


    Steel also has poor corrosion protection, meaning that it often goes rusty. You
    will have seen rusty steel items such as car bodywork. This rust is corrosion
    that is caused by a reaction between the metal and elements in the environment
    such as water and oxygen. The rust weakens and eventually destroys the metal.
    Steel can be treated to prevent or slow corrosion, but this will add to the material
    cost, and some other metals have much more natural resistance to corrosion.'
  merge: -1
  img_proc: true
- pgno: 50
  md: "# Pros and cons of aluminum\n\nAluminum is the second-most common material\
    \ used in sheet metal and is used in a wide range of items including bike frames,\
    \ aircraft parts, and drinking cans.\n\nOne of the reasons why aluminum is so\
    \ popular in the aerospace industry is that it is much lighter than steel. It\
    \ also has excellent natural resistance to corrosion and so doesn't need extra\
    \ surface treatments to stop it from going rusty. Another great property of aluminum\
    \ is how malleable it is, meaning that it is very easy to bend. Consider how flexible\
    \ aluminum foil is, or how easy it is to crush a drinks can.\n\nUnfortunately,\
    \ these positive properties also come with downsides, and aluminum is a lot more\
    \ expensive than steel. However, because it is less dense, parts can be made lighter,\
    \ which somewhat offsets this cost. Another factor is that although aluminum is\
    \ lighter than steel, it is also weaker, meaning that parts that bear the same\
    \ load will have to be made thicker in aluminum. However, due to the lower density\
    \ of aluminum, these can actually be lighter than the equivalent steel parts.\
    \ So overall, depending on exactly which grades of metal are used, aluminum generally\
    \ has a better strength-to-weight ratio (SWR) than steel.\n\n# Other common metals\n\
    \nSteel and aluminum make up the vast majority of sheet metal parts but some other\
    \ materials are reasonably common, such as the following:\n\n+   - **Copper**:\
    \ Copper is often used for parts such as electronics or heat-exchanging components\
    \ because it has good electrical and thermal conductivity.\n+   \n+     It is\
    \ also easy to bend and form and has good corrosion resistance, and so is often\
    \ used in plumbing, to make pipes and fixtures. Copper is more expensive than\
    \ steel and aluminum, and some areas have issues with copper theft due to the\
    \ higher price of the metal.\n+   - **Brass**: This metal is an alloy (a mixture)\
    \ of copper and zinc that looks similar to copper but has a brighter, shinier\
    \ look. For this reason, it is often used for decorative items such as door knockers,\
    \ fixtures, and trinkets.\n+   \n+     It is extremely malleable and so is commonly\
    \ used to make musical instruments in the brass section, such as trumpets. Brass\
    \ has exceptional corrosion resistance and so is often seen in extreme environments,\
    \ like door handles on ships. As with copper, it is quite an expensive metal and\
    \ so is usually used sparingly."
  merge: -1
  img_proc: true
- pgno: 51
  md: "+   - **Stainless steel:** Steel can be alloyed with other metals such as chromium\
    \ to create different grades of stainless steel. This is steel that has a much\
    \ greater resistance to corrosion than standard steel, while still retaining much\
    \ of the strength and other benefits. For this reason, it is often used to make\
    \ cutlery or surgical instruments.\n+   \n+     Stainless steel sheet metal parts\
    \ include things like large items of kitchen equipment—for example, sinks and\
    \ countertops. However, this improved corrosion resistance makes stainless steel\
    \ much more expensive than standard steel.\n\nThis overview is not intended to\
    \ be a complete list of metals, and other niche materials might include tin, gold,\
    \ and titanium. Each of these will have specific properties that suit different\
    \ applications and budgets. As mentioned earlier, it is wise to discuss your specific\
    \ needs with your sheet metal supplier and manufacturer to get the best fit for\
    \ your project.\n\nA summary of sheet metal material properties can be seen in\
    \ the following table:\n\n| Material Type | Advantages | Disadvantages |\n|---|---|---|\n\
    | Steel | Strong, cheap, widely available; easy to work and weld | Heavy; poor\
    \ corrosion resistance |\n| Aluminum | Lightweight; good SWR; good corrosion resistance;\
    \ malleable | More expensive than steel; lower strength than steel |\n| Copper\
    \ | Good thermal and electrical conductivity; good corrosion resistance; malleable\
    \ | Expensive |\n| Brass | Very malleable; good corrosion resistance | Expensive\
    \ |\n| Stainless steel | Similar benefits to steel but with excellent corrosion\
    \ resistance | Expensive |\n\n# Sheet metal thicknesses and sheet sizes\n\nDepending\
    \ on where you live in the world, sheet metal is usually sold either by gauge\
    \ number or the actual thickness of the sheet. As previously mentioned, gauge\
    \ numbers are a way of measuring sheet metal thickness based on the weight of\
    \ the material, and generally, a higher gauge number means a thinner sheet.\n\n\
    Gauge numbers are specific for each material, so **16 gauge** steel will be a\
    \ different thickness than **16 gauge** aluminum. Therefore, it is highly recommended\
    \ that sheet thickness is also specified in actual thickness, to avoid any confusion."
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Metal sheets are also available in a wide range of sheet sizes, both metric
    and imperial. Some common sizes are shown in Figure 1.26 and include 48x120 "
    or 2x1 meters (m):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_52_0.png)


    Figure 1.25: Common metal sheet sizes


    When creating very big parts, or even large numbers of small parts, it is worth
    checking which sheet sizes are available to you and designing with this in mind.
    If making lots of small parts, it is even possible to use third-party "nesting"
    software to arrange the parts on the sheet in the most efficient way and avoid
    wasted material.


    # Material selection recap


    Even when designing parts virtually in SolidWorks, it is important to consider
    how those parts will be created in the real world, and a vital aspect of this
    is the material choice. Most sheet metal parts are made from steel or aluminum,
    but other common metals include copper, brass, and stainless steel, and each of
    these materials has unique properties that suit different needs.


    Sheet thicknesses are generally defined by actual thickness or using a gauge number.
    This is based on the material''s weight, meaning that the same gauge number gives
    different thicknesses for different materials. Sheets come in a variety of common
    sizes that may have an impact on the design of your parts.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Summary


    In this chapter, we introduced SolidWorks Sheet Metal and learned how to set up
    a Sheet Metal workspace and create **Base Flanges**. These are usually the first
    feature in a Sheet Metal *part*, and we covered the three different types: **Single
    Closed Profile**, **Multiple Contained Closed**, and **Single Open Contour**.


    Next, we explored the four **Sheet Metal** properties—**Thickness**, **Bend Radius**,
    **Bend Allowance**, and **Auto Relief**—and how these can be edited to adjust
    the properties of the entire *part*.


    Finally, we learned how 3D *parts* can be flattened, which is essential if they
    are to be made from metal sheets in the real world. On a similar note, we looked
    at common sheet metal materials and sheet sizes, and how these might be relevant
    to your final design.


    In *Chapter 2, Adding Bends Using Edge Flanges*, we will start to build up a 3D
    design by learning how to use **Edge Flanges** to add extra detail to the **Base
    Flange**.'
  merge: -1
  img_proc: true
- pgno: 54
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 2

    Adding Bends Using

    Edge Flanges


    Bent edges known as **Edge Flanges** are the workhorses of **SolidWorks Sheet
    Metal**, and they are one of the most common building blocks for adding 3D detail
    to your flat **Base Flanges**. Although Edge Flanges can appear to be very simple,
    they can be used to build highly complex parts.


    In this chapter, we''ll learn how to add basic Edge Flanges, and then we''ll explore
    how these can be edited and adjusted. We''ll also look at some more advanced options
    and details that can unlock the power of Edge Flanges, allowing you to use them
    on multiple edges, as well as edit flange profiles, and more.


    By the end of this chapter, you''ll have a full understanding of Edge Flanges
    and how they can be used to build Sheet Metal models.


    In this chapter, we''re going to cover the following main topics:


    +   - Using Edge Flanges

    +   - Edge Flanges: advanced options'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Using Edge Flanges


    One of the most basic and common features in SolidWorks Sheet Metal is the Edge
    Flange. At its simplest, an Edge Flange is just a bent section of a metal sheet
    on an edge. A very simple sheet metal box consists of one single Base Flange with
    four Edge Flanges attached to it (one on each side as shown in Figure 2.1).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_56_0.png)


    Figure 2.1: A simple box made from one Base Flange and four Edge Flanges


    Individual Edge Flanges are extremely simple features but when combined, they
    can be used to create parts that are much more complex.


    # Creating your first Edge Flange


    Edge Flanges are relatively simple to make:


    +   1. Open your **Base Flange** part from Chapter 1, Sheet Metal Basics – Exploring
    Sheet Metal Properties and Material Selection, or create a new SolidWorks part
    and make a Base Flange that is 200 x 300 mm in size (as shown in Chapter 1, Sheet
    Metal Basics – Exploring Sheet Metal Properties and Material Selection).'
  merge: -1
  img_proc: true
- pgno: 57
  md: '2. The material Thickness should be 1 mm, with a Bend Radius of 1 mm (Figure
    2.2).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_57_0.png)


    Figure 2.2: Creating a 200 x 300 mm Base Flange


    3. To start adding Edge Flanges, select the Edge Flange option from the Sheet
    Metal tools (Figure 2.3).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_57_1.png)


    Figure 2.3: The Edge Flange tool


    4. Selecting the Edge Flange tool will open the Edge Flange Property Manager (Figure
    2.4) and show a number of options. Although they look fairly complicated, not
    all of them are needed for every flange, and we will cover them step-by-step throughout
    this chapter.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The most important options are the Flange Parameters, Angle, and Flange Length


    ![](img/4e9c736de6bac4449096a7b92c28af4c_58_0.png)


    Figure 2.4: The Edge Flange Property Manager


    5. Edge selection: Before we actually add any flanges, we first need to decide
    where we actually want to position them. To select the edges for the Edge Flanges,
    complete the following steps:


    +   I. Ensure that you have selected the Edge selection box (Figure 2.4, (i)).
    This will be blue in color when selected.

    +   II. Left-click on the edges in the model to select them. You may need to zoom
    in to select the edges you want.

    +   III. Try selecting one of the short edges by left-clicking it. You should
    see a yellow preview of the Edge Flange, which follows the mouse (Figure 2.5).
    This can be dragged out to the desired position, then a single left-click will
    set the length (see Step 7 for more details on Flange Length).'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'IV. Edges can be removed from the current selection by left-clicking them again
    or by right-clicking in the Edge selection box and choosing Clear Selections or
    Delete.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_59_0.png)


    Figure 2.5: An Edge Flange preview


    6. Bend Radius: Note that the Bend Radius of the new Edge Flange appears near
    the top of the Property Manager (Figure 2.4, (ii)). This Bend Radius (1 mm in
    this example) is determined by the global Bend Radius that we set in the Sheet
    Metal Properties by editing the Sheet-Metal folder. As a result, all Edge Flanges
    will automatically use the default Bend Radius value.


    However, it is also possible to override the default Bend Radius for individual
    Edge Flanges. To do this, complete the following steps:


    +   I. Uncheck the Use default radius checkbox and set the required value.


    +   II. Try adjusting this Bend Radius value and pay attention to how the Bend
    Radius of the yellow preview in the Graphics Area also changes.


    +   III. To go back to the default Bend Radius value, just put a check back in
    the Use default radius checkbox.


    7. Bend angle: Next, we can set the angle that the Edge Flange is bent at (Figure
    2.4, (iii)). Try adjusting the angular value and see how the yellow preview also
    changes to match.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '8. It is also possible to set the angle as either *perpendicular* or *parallel*
    to a certain face. To use this option, first, click in the **Select face** box
    underneath the angle value, select the reference face, then choose **Perpendicular
    to face** or **Parallel to face**.


    9. **Flange Length**: Another important aspect of an Edge Flange is its length
    (*Figure 2.4, (iv)*). This can be set as a Blind value (extruded in one single
    direction) or using the different end conditions from the drop-down menu, if creating
    more complex parts.


    10. The direction of the flange can also be flipped by clicking on the **Reverse
    Direction** button just to the left of the **Length End Condition** drop-down
    menu.


    11. Although the Flange Length is set as a dimensional value, the actual length
    of the flange depends on where we measure that value from. There are three options
    for measuring Flange Length and these can be seen in Figure 2.6.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_60_0.png)


    Figure 2.6: The Flange Length options


    A representation of the different Flange Length options can be seen from the icons
    on the buttons in Figure 2.6. From left to right, the options are as follows:


    +   - **Outer Virtual Sharp**: This measures the length of the flange from the
    point where a sharp corner would be if an imaginary line was drawn down the outer
    face of the Edge Flange and along from the bottom of the fixed flange (the left
    example in Figure 2.7).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_60_1.png)


    Figure 2.7: Outer and Inner Virtual Sharp examples'
  merge: -1
  img_proc: true
- pgno: 61
  md: '+   - **Inner Virtual Sharp**: This is similar to the first option, but instead
    it measures the Flange Length from where a sharp corner would be to the inner
    face of the fixed flange (the right example in Figure 2.7).

    +   - **Tangent Bend**: This option measures the Flange Length from a point that
    is at a tangent to the outside of the bend (Figure 2.8). This option is only valid
    when the bend values are larger than 90°. Otherwise, by definition, the length
    will be the same as the Outer Virtual Sharp.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_61_0.png)


    Figure 2.8: Tangent Bend examples for a 90° bend and for a bend over 90°


    In practice, it doesn’t really matter too much which flange option you use, as
    long as you use it consistently and your flange lengths meet your design requirements.


    12. **Flange Position**: The final option in this section is the Flange Position,
    and here, we have five options (Figure 2.9). In general, the first three choices
    are more widely used, with the final two being less common, but all have their
    uses. As with the Flange Length options, the small icons on the buttons give a
    graphical representation of what each setting means.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_61_1.png)


    Figure 2.9: The Flange Position options'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'The **Flange Position** options are as follows:


    +   - **Material Inside**: This option means that all of the Edge Flange material
    will be inside the area of the fixed flange (*Figure 2.10*).

    +   - **Material Outside**: This option puts the Edge Flange material outside
    of the fixed flange area, however, it can be seen that some of the bend region
    itself is still within the fixed flange area (*Figure 2.10*).

    +   - **Bend Outside**: This choice means that the entire bend will be outside
    of the fixed flange, effectively offsetting the Edge Flange from the fixed flange
    slightly (*Figure 2.10*).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_62_0.png)


    Figure 2.10: The Flange Position options (left to right: Material Inside, Material
    Outside, and Bend Outside)


    +   - **Bend from Virtual Sharp**: The fourth and fifth options are more specialized
    and used less often in everyday modeling, but they can still be useful. The **Bend
    from Virtual Sharp** option bases the bend on the position where a sharp corner
    between the top face of the fixed flange and the inner face of the Edge Flange
    would be. In *Figure 2.11*, we can see two different bend angles to demonstrate
    this. Note that this option can only be used with bend sizes of over 90°.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_62_1.png)


    Figure 2.11: The Bend from Virtual Sharp option, with two different bend angles'
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   - **Tangent to Bend**: This option can also only be used with bend angles
    of over 90°, and it keeps the actual bend face at a tangent to the side face of
    the fixed flange (Figure 2.12). This is subtly different from the **Material Inside**
    option, which uses a virtual sharp with the outside of the Edge Flange and the
    top of the fixed flange.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_63_0.png)


    Figure 2.12: The Tangent to Bend option (shown alongside the Material Inside option)


    +   - **Offsetting bends**: All of the bend options except for the **Bend from
    Virtual Sharp** allow the bend to be offset from the fixed flange. To offset a
    bend, click to place a check mark in the **Offset** checkbox (Figure 2.9) and
    then set the **Offset Distance**. Clicking the **Reverse Direction** box allows
    the offset to be flipped and for different end conditions to be selected from
    the drop-down menu.


    13. Set the following parameters, then click **OK** to add the Edge Flange (Figure
    2.13):


    +   - **Bend Radius:** (1 mm)

    +   - **Angle:** 90°

    +   - **Flange Length:** 50 mm, Blind, Outer Virtual Sharp'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   - **Flange Position:** Material Inside, No Offset


    ![](img/4e9c736de6bac4449096a7b92c28af4c_64_0.png)


    Figure 2.13: An example of an Edge Flange


    The new Edge Flange feature can now be seen in the FeatureManager Design Tree
    on the left-hand side of the screen, and it can be edited in the usual way by
    clicking on it and selecting the **Edit Feature**.


    So far in this section, we have learned how to add a very basic Edge Flange and
    we have seen that the most important parameters for Edge Flanges are the *Edge
    Selection, Bend Angle, the Flange Length* and *Flange Position*.


    In the next section, we will look at some more advanced ways to use Edge Flanges
    and explore some of the detailed options.


    # Edge Flanges – advanced options


    The Edge Flange that we previously added was a very simple example on a single
    edge, but we can also add Edge Flanges to multiple edges, control the flange profile,
    and more.


    # Adding multiple edges within the same Edge Flange feature


    It''s not necessary to create a new Edge Flange for each edge – multiple flanges
    can be made within the same feature:


    +   1. Continuing with the part from the previous section (see Figure 2.13), edit
    the Edge Flange feature by left or right-clicking on the **Edge-Flange** feature
    in the FeatureManager Design Tree and selecting the **Edit Feature** option.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '2. To add multiple edges, first, ensure that you have the **Edge** selection
    box selected (*Figure 2.14, (i)*), and then, left-click on the edges where you
    wish to add flanges. Try selecting the two long sides of the Base Flange, in addition
    to the one short side that was already selected (*Figure 2.14*).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_65_0.png)


    Figure 2.14: Adding multiple Edge Flanges


    3. To deselect edges, simply left-click them again in the Graphics Area or right-click
    on them in the **Edge** selection box and click **Delete**.


    4. Click **OK** to confirm the changes. Now, the Base Flange has Edge Flanges
    on three of the four sides.


    # Edge Flanges that are over 90 degrees are automatically trimmed


    Now that we have an Edge Flange feature with multiple edges, we can look at some
    more details of Edge Flanges:


    +   1. Edit the Edge Flange feature.

    +   2. Adjust the **Angle** value from 90° up to 120°. This can be done with the
    adjustment arrows, or by typing the numerical value directly into the **Flange
    Angle** field.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '3. Note that as the bend angle is increased over 90°, the adjacent edges of
    the flanges will automatically be trimmed back to avoid them clashing (Figure
    2.15).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_66_0.png)


    Figure 2.15: When the Bend Angle is over 90°, the adjacent edges are trimmed away


    4. Click OK to change the Angle value of the three flanges to 120°.


    5. The part can now be flattened to display the trimmed edges more clearly. Select
    the Flatten option from the Sheet Metal Tab or Toolbar. You will see that the
    flattened sheet (Figure 2.16) has corners that aren''t perpendicular, which is
    due to the automatic trimming that occurred on the adjacent edges.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_66_1.png)


    Figure 2.16: The flattened part, showing the non-perpendicular, trimmed edges'
  merge: -1
  img_proc: true
- pgno: 67
  md: '+   6. Click **Flatten** again to refold the **part**.

    +   7. Edit the Edge Flange feature again and reduce the **Angle** value to 60°.
    Note that if the Bend Angle is less than 90°, the adjacent edges remain perpendicular
    to the selected edge. They do not expand to fill the gap between the flanges (*Figure
    2.17*).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_67_0.png)


    Figure 2.17: If the Bend Angle is less than 90°, the flange edges remain perpendicular


    So, when adding multiple Edge Flanges, if the bend angle is over 90°, then the
    flanges will be automatically trimmed to avoid them clashing, but if the bend
    angle is less than 90°, then the flanges will not be extended to close the gap.


    # Adjusting the Gap distance


    Whenever multiple flanges are added, we can see that they aren''t joined in the
    corners and there is always a small gap. This ensures that we can unfold these
    flanges down to a flat sheet correctly.


    When an Edge Flange feature has multiple edges, another option becomes available
    to us. The **Gap distance** allows us to easily set the gap between the adjacent
    flanges.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Follow these steps to adjust the Gap distance:


    +   1. Edit the Edge Flange feature from the previous example and set the bend
    angle to 90°.


    +   2. The Gap distance option is now available (Figure 2.18). Try adjusting the
    gap size and note how the gap between the adjacent flanges in the yellow preview
    changes.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_68_0.png)


    Figure 2.18: The Gap distance option


    +   3. Remove all of the extra Edge Flanges so that only a single one remains.
    Note how the Gap distance option is now grayed out; gaps can only be specified
    when more than one Edge Flange is created (otherwise, there is nothing to have
    a gap between).


    +   4. Select a second edge and adjust the bend angle to less than 90°. Note that
    the Gap distance is now grayed out again; Gap distances can''t be specified between
    Edge Flanges with bends of less than 90° because the flanges are moving apart,
    so the gap size can''t be constant.


    +   5. Adjusting the bend angle to 90° or above activates the Gap distance option
    again.


    The Gap distance is a fairly simple option that will automatically become available
    if it can be used. If the bend angle is less than 90°, then the Gap distance will
    automatically be grayed out and unavailable. This is because if the edges are
    moving apart, a constant gap can''t be specified.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Changing the Flange Profile


    So far, we have used the Edge Flange tool to create rectangular flanges that run
    the entire length of the edge that we selected. However, it is also possible to
    create different flange shapes and lengths by adjusting the Flange Profile:


    +   1. Edit the Edge Flange feature from the previous example. Select one edge
    only and set the bend angle to 90°, then click OK.

    +   2. To edit the flange profile, first, edit the Edge Flange feature then select
    Edit Flange Profile from the Property Manager on the left.

    +   3. We are now editing the sketch that makes up the flange. A message box will
    appear confirming that the current sketch is valid. This box can be dragged out
    of the way if needed.


    The sketch can be edited in the usual way to adjust the flange profile. For example,
    try dragging the vertical lines inward from the end of the edge (Figure 2.19)
    and adding Smart Dimensions to Fully Define the sketch. Note: this can be easier
    from a Normal To view.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_69_0.png)


    Figure 2.19: Adjusting the flange profile'
  merge: -1
  img_proc: true
- pgno: 70
  md: '4. Once you are happy with the flange profile, click **Finish** to accept the
    changes and you will see that the flange now only runs over a certain length of
    the edge.


    5. If the sketch cannot be used to create a flange, then the popup message in
    *Step 3* will display **Unable to create the flange from the sketch**. In this
    case, try ensuring that the sketch has a fully closed profile (with no gaps in
    the perimeter) and that it is not self-intersecting (it has no overlapping lines).


    6. A faster way of editing the Edge Flange profile is to expand the Edge Flange
    feature in the FeatureManager Design Tree and then edit the sketch above the **EdgeBend**
    item (*Figure 2.20* – note, your sketch number may vary). This sketch can then
    be edited as per *Step 3*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_70_0.png)


    Figure 2.20: Editing the Edge Flange sketch in the FeatureManager Design Tree


    7. Flange profile sketches can also be edited to change the shape of the Flange.
    For this example, the sides of the flange could be angled or curved (*Figure 2.21*).
    To create angled edges, it might be necessary to delete any existing Horizontal
    or Vertical Relations.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_70_1.png)


    Figure 2.21: Editing the flange profile'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Editing the flange profile in this way allows more flexible use of Edge Flanges
    and unlocks the ability to create many different shapes.


    # The Custom Bend Allowance and Custom Relief Type options


    Two more minor options in the **Edge Flange** settings can be found at the bottom
    of the Property Manager and they are the **Custom Bend Allowance** and **Custom
    Relief Type** options (*Figure 2.21*). These allow the global *part* settings
    from the `Sheet-Metal` properties folder to be overridden for specific features.
    They can be used in exactly the same way as the options within the **Sheet-Metal
    Properties** feature, as covered in *Chapter 1, Sheet Metal Basics – Exploring
    Sheet Metal Properties and Material Selection.*


    ![](img/4e9c736de6bac4449096a7b92c28af4c_71_0.png)


    Figure 2.22: The Custom Bend Allowance and Custom Relief Type options


    These options are rarely used in practice, but they give a little bit of extra
    control if needed.


    # The Trim side bends option


    The final setting in the **Edge Flange** options is the **Trim side bends** option.
    This automatically trims away material in corners where two Edge Flanges meet
    and can be useful for avoiding manufacturing issues that can occur in tight corners
    with adjacent bends.


    This is best explained using the following example:


    +   1. Delete the Edge Flange feature from your current *part* so that only the
    Base Flange remains.


    +   2. Add a new Edge Flange feature on one of the short edges. This Edge Flange
    should run the entire length of the edge (just use the default flange profile
    that is automatically selected).'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Set the parameters as follows:


    +   - **Angle:** 90°

    +   - **Flange Length:** 50mm, Outer Virtual Sharp

    +   - **Flange Position:** Material Inside


    3. Add a second Edge Flange feature on one of the long edges of the Base Flange,
    using the same settings as in Step 2. You should now have a Base Flange with two
    raised Edge Flanges (*Figure 2.23*).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_72_0.png)


    4. The **Trim side bends** option creates an automatic trim in the corner where
    the two flanges meet. Try editing the second Edge Flange, then, put a check in
    the **Trim side bends** checkbox and click OK to see the difference between the
    two options *Figure 2.24*).'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_73_0.png)


    Figure 2.24: A corner with and without the Trim side bends option selected


    +   5. The actual trimmed area is created automatically and has no sub-options;
    it can either be added or not added.


    The Trim side bends checkbox is a minor option, but it can be useful for reducing
    potential manufacturing issues in tight corners.


    # Summary


    In this chapter, we introduced the concept of Edge Flanges, which are some of
    the most commonly used features in SolidWorks Sheet Metal. After adding a basic
    Edge Flange, we saw how they can be adjusted by setting details like the bend
    angle, flange length, and position.


    After that, we took a deeper dive into Edge Flanges, and we saw how more advanced
    options can open up the power of Edge Flanges by doing things like selecting multiple
    edges and editing flange profiles.


    In Chapter 3, Getting Familiar with Basic Tools in Sheet Metal, we will continue
    building upon our knowledge and learn more of the everyday SolidWorks Sheet Metal
    tools.'
  merge: -1
  img_proc: true
- pgno: 74
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 3

    Getting Familiar with Basic Tools in Sheet Metal


    Now that we have learned how to create Base Flanges and how to add Edge Flanges,
    we can start to look at specialized tools.


    In this chapter, we’ll discover how to add and remove material using Tabs, Cuts,
    and Holes. We’ll also explore new flange types such as the Miter Flange and Hem,
    as well as Sketched Bends, which can be used to add more unusual bend styles.
    Finally, we’ll learn about the Jog feature, both from a theoretical and a practical
    perspective.


    By the end of this chapter, you’ll have a full understanding of the basic Sheet
    Metal tools.


    In this chapter, we’re going to cover the following main topics:


    +   - Adding and removing material using Tabs, Cuts, and Holes

    +   - Using the Miter Flange tool

    +   - Using the Hem feature

    +   - Adding Sketched Bends

    +   - Creating and using Jogs'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Adding and removing material using Tabs, Cuts, and Holes


    In Chapter 1, Sheet Metal Basics—Exploring Sheet Metal Properties and Material
    Selection, and Chapter 2, Adding Bends Using Edge Flanges, we learned how to make
    **Base Flanges** and **Edge Flanges** by adding material. However, removing material
    is also an important aspect of sheet metal, and we will explore multiple ways
    to do this in this section. We will also learn how to add new material to existing
    flanges by using **Tabs**.


    # Creating basic Extruded Cuts


    There are many reasons why you might want to remove material from your models.
    These could include to creating screw holes, adding openings for ports or ventilation,
    or even making aesthetic features such as logos.


    The simplest way to remove material is to create Extruded Cuts, as follows:


    +   1. Open your **Base Flange** *part* from the previous chapter, or start a
    new *part* document and create a **Base Flange** 200x300mm in size and 1mm thick.
    We will use this to demonstrate Extruded Cuts.

    +   2. Select the face where you wish to make the cut and start a new sketch (either
    by selecting **Sketch** from the **Sketch** tab or by selecting **Sketch** from
    the flyout menu that appears when the face is selected).

    +   3. Sketch the profile that you wish to cut. For this example, I have sketched
    a square 50x50mm, and 20mm from two edges. Remember to Fully Define your sketches
    by using the **Smart Dimension** tool.

    +   4. Select **Extruded Cut** either from the **Features** tab or from the **Sheet
    Metal** tab or toolbar, as illustrated in (Figure 3.1):'
  merge: -1
  img_proc: true
- pgno: 77
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_77_0.png)


    Figure 3.1: Creating an Extruded Cut


    +   5. We can now create a cut using the standard end conditions such as **Blind**
    or **Up to Next**, but because we are working in a Sheet Metal *part*, some additional
    options are also now available. These will be explored in the next section.

    +   6. Set the cut parameters as Blind, 10mm, and uncheck the three option boxes
    immediately below the cut depth (**Link to thickness**, **Flip side to cut**,
    and **Normal cut**).

    +   7. To create a cut, press the green **OK** check mark.


    # Linking a cut to the sheet thickness


    The first additional option for **Extruded Cuts** is **Link to thickness**. As
    the name suggests, this option links the cut feature to the thickness of the sheet.
    This means that the cut will always go all the way through the flange that it
    is made on. Proceed as follows:


    +   1. Continuing on from the earlier model, edit the **Cut-Extrude** feature.

    +   2. Select the **Link to thickness** option and note how the preview adjusts
    so that the cut only goes through the sheet thickness—in this example, 1mm. Also,
    note that the cut **Depth** now disappears, because this depth is set by the sheet
    thickness.

    +   3. Press **OK** to accept the changes.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Link to thickness is a very useful option for ensuring that cuts are made correctly
    even if the sheet size changes later. However, there are certain situations where
    it may not give the outcome that we want, such as cutting across bends, as shown
    in the following example:


    +   1. Add an Edge Flange to the short edge of the Base Flange nearest to the
    cut.

    +   2. This can be done by selecting Edge Flange from the Sheet Metal tools and
    then selecting the appropriate edge. Use the following settings:


    +   - Angle: 60°

    +   - Flange Length: Blind, 50mm, Outer Virtual Sharp

    +   - Flange Position: Material Outside


    The process is illustrated in Figure 3.2:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_78_0.png)


    Figure 3.2: Adding a new, angled Edge Flange'
  merge: -1
  img_proc: true
- pgno: 79
  md: '3. Now, start a new sketch on the underside of the Base Flange. This should
    be 50x50mm in size and straddle the new Edge Flange bend, as shown in Figure 3.3:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_79_0.png)


    Figure 3.3: Sketching a new cut profile on the underside of the Base Flange'
  merge: -1
  img_proc: true
- pgno: 80
  md: '4. Use the sketch to create an Extruded Cut and select the Link to thickness
    option. Notice in Figure 3.4 that the yellow preview only cuts through the thickness
    of the Base Flange sheet. That is, the cut only goes through the sheet that the
    initial profile was sketched on; it doesn’t cut through the angled Edge Flange:


    > Note

    > You may have to deselect and then reselect the Link to thickness option for
    this to work properly.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_80_0.png)


    Figure 3.4: A cut that is linked to thickness will only go through the sheet that
    it is made on


    5. Press OK to make the cut.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Creating deeper cuts and using Normal cuts


    As well as creating cuts that only go through the thickness of the sheet that
    they are made on, we can also create deeper cuts. The following example also demonstrates
    the Normal To cut option neatly.


    Normal cuts are simply cuts that are made perpendicular (at 90° to) the sheet
    face, and these are generally much easier (and therefore cheaper and faster) to
    manufacture than angled cuts. Proceed as follows:


    +   1. To create a cut that also goes through the Edge Flange, we could use a
    number of different End Conditions, such as a Blind cut.

    +   Edit the Extruded Cut feature, uncheck the Link to thickness box, and set
    a Blind extrude of 10mm deep.


    > Note

    > Ensure that the Normal cut box is unchecked.


    +   2. The cut now goes through the Base Flange and also into the bent Edge Flange.
    From a Top view, the cut looks correct and just appears as a rectangular opening
    with square edges. However, if we flatten the part, we then see a potential issue.

    +   Select the Flatten option from the Sheet Metal tools.


    +   3. Looking at the flattened sheet, we can that the edge of the cut area that
    we just made now has an angled edge. Figure 3.5 shows a cross-section view through
    this cut:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_81_0.png)


    Figure 3.5: Cross-section view through the flattened cut showing the angled cut
    edge'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'Note that the edge that was previously folded up now has an edge angle of 60°,
    which was the angle of the Edge Flange when the cut was made—that is, when the
    part was folded up (unflattened). Figure 3.6 shows a preview of the cut in an
    unflattened state to demonstrate why this cut angle occurs:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_82_0.png)


    Figure 3.6: Example showing why the non-Normal cut happens


    Creating non-normal cuts (cuts that aren’t at 90°) in flat sheets such as this
    can be difficult with certain manufacturing processes such as laser cutting, and
    so it can add time and cost to parts. To mitigate this, it is useful to be able
    to ensure that these cuts are normal (at 90°). This can easily be done by using
    the Normal cut option.


    +   4. Edit the latest Cut-Extrude feature and put a check in the Normal cut box.


    +   5. Press OK to create this feature. Note that the angle of the cut is now
    Normal to the face of the Edge Flange (Figure 3.7.):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_82_1.png)


    Figure 3.7: Differences between the Normal cut and non-Normal cut options'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'The **Normal cut** option is a simple way to optimize your models for manufacturing,
    potentially saving you time and cost.


    # Cutting Simple Holes


    As well as creating specific cut profiles it is also possible to easily add simple
    holes to flanges. Here’s how to do this;


    +   1. Select the **Simple Hole** tool from the **Sheet Metal** tab or toolbar.

    +   2. Left-click to select the face and position where you wish to cut the hole.

    +   3. Edit the hole parameters such as the depth and diameter using the **Property
    Manager**. The hole depth can also be linked to thickness in the same way as the
    **Extruded Cuts** in the previous section.

    +   4. Press **OK** to add a hole.

    +   5. To set the exact position of the hole, select the new **Hole** feature
    in the FeatureManager Design Tree and choose **Edit Sketch**. The position can
    now be set exactly using the **Smart Dimension** tool.


    > **Is the Simple Hole Feature Useful?**

    > Because the **Simple Hole** feature needs editing to specify the hole position,
    it is usually faster just to create a normal Extruded Cut, as shown in the previous
    section, and then to use the **Circle** tool to create a hole profile.


    # Using the Hole Wizard for holes


    If you are creating holes, then the **Hole Wizard** offers a much better solution
    than using the **Simple Hole** or **Extruded Cut** options. The **Hole Wizard**
    tool contains a large library of preset sizes and types of holes, and also makes
    it easier to add multiple holes or edit them at a later stage.


    In SolidWorks Sheet Metal, the **Hole Wizard** is used in the same way as for
    standard modeling. Here’s how to work with it:


    +   1. Select the **Hole Wizard** from the **Features** tab.

    +   2. Choose the hole type using the **Type** tab (within the **Hole Wizard Property
    Manager**).

    +   3. Set the size and end condition.

    +   4. Select the **Positions** tab, then select a face where the holes will be
    added.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '+   5. The cursor will change to the **Point** tool, and a left click will
    place *Points*. A hole will be added at the location of every Point.

    +   6. Press **OK** to add holes.

    +   7. To edit the holes, simply edit the **Hole** feature in the FeatureManager
    Design Tree.

    +   8. The hole positions can also easily be changed by editing the position sketch,
    which can be found by expanding the **Hole** feature.


    The **Hole Wizard** is generally the best choice when creating holes because it
    contains many preset sizes and makes it easy to add or adjust holes at a later
    stage.


    > **Check Cutouts and Holes with Your Manufacturer**

    > Many manufacturers have limits on how close cutouts or holes can be placed to
    edges or to other features such as bends. If you are creating parts with holes
    or cuts very close to the edge of the sheet or to other features, then it would
    be wise to check whether your manufacturer has any limitations that may affect
    your design.


    # Using Tabs


    So far in this section, we have looked at different ways to take material away,
    but there are also many situations where material needs to be added. Sometimes,
    this extra material can be created by adding to the flange profiles directly,
    but it often makes more sense to create entirely new areas. In SolidWorks Sheet
    Metal, these are known as Tabs, and they can be easily added. Here’s how:


    +   1. Looking at our current model with the single, 60° **Edge Flange**, we may
    wish to add a section sticking out of the side of the flange.

    +   2. First, create a sketch with the required profile. Select the desired face
    and sketch a Fully Defined profile. In this example, a 50x20mm section is added
    to the side of the existing **Edge Flange** (*Figure 3.8*).'
  merge: -1
  img_proc: true
- pgno: 85
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_85_0.png)


    Figure 3.8: New Tab profile sketch


    +   3. The simplest option may appear to be to create an **Extruded Boss/Base**
    feature using the **Features** tab. Selecting this tool shows that we now have
    the **Link to thickness** option, but we still need to ensure that the new section
    is extruded in the correct direction. Therefore, it is better to use a Sheet Metal-specific
    tool.

    +   4. Instead of the **Extruded Boss/Base** tool, open the **Sheet Metal** tab
    or toolbar and select the **Base Flange/Tab** tool (this tool doubles up to create
    both **Base Flanges** and **Tabs**).

    +   5. If needed, select the profile sketch that we just drew, then press **OK**.


    A new tab section is now created and it is automatically linked to the thickness
    of the flange that it was made on.


    **Note**

    The feature is now displayed in the FeatureManager Design Tree as **Tab1**. This
    is because we are building upon an existing flange so that SolidWorks knows that
    the new profile should be a **Tab** rather than a new **Base Flange**.'
  merge: -1
  img_proc: true
- pgno: 86
  md: "The **Tab** feature is quite simple but is usually the most efficient way to\
    \ add new material to existing flanges.\n\n> **Using Mirrors, Patterns, and Other\
    \ Standard SolidWorks Features**\n> Often, Sheet Metal models are symmetrical\
    \ or have repeating features. If this is the case, then you can use features such\
    \ as **Mirrors** and **Patterns** to speed up your workflow. Sometimes, it’s possible\
    \ to create half (or even a quarter) of a model and then **Mirror** the rest of\
    \ the features to create the other sections.\n> \n> Tabs, and many other Sheet\
    \ Metal features, such as **Edge Flanges**, can be used with **Mirror** and **Pattern**\
    \ features in the same way as standard SolidWorks features.\n\nAdding and removing\
    \ material is a fundamental part of Sheet Metal modeling, and there are multiple\
    \ ways to achieve this. When creating holes, it is often best to use the **Hole\
    \ Wizard**, but other shapes can be cut out using the **Extruded Cut** option.\
    \ The **Base Flange/Tab** tool provides a fast and easy way to add extra material\
    \ where needed.\n\n# Using the Miter Flange tool\n\nThe next tool we’re going\
    \ to explore is the **Miter Flange** tool. This can be used to add flanges to\
    \ one or more edges and, in many ways, is similar to the **Edge Flange** tool.\
    \ However, the **Miter Flange** tool requires you to sketch a cross-section profile\
    \ of the flange, allowing much more complex flanges to be created fairly easily.\n\
    \nTo create a **Miter Flange**, proceed as follows:\n\n+   1. Open your **Base\
    \ Flange** *part* from the previous section and delete any extra flanges, cuts,\
    \ or tabs so that just the **Base Flange** remains. Alternatively, you can start\
    \ a new *part* document and create a **Base Flange** 200×300mm in size and 1mm\
    \ thick.\n\n+   2. The most important step of creating a **Miter Flange** is sketching\
    \ the cross-section profile of the flange. This can be done either before selecting\
    \ the **Miter Flange** tool or the tool can be selected first, and this will prompt\
    \ you to select or draw a sketch.\n+   \n+   Both methods produce the same end\
    \ result and are very similar. In this example, we will draw the sketch first.\n\
    \n+   3. The sketch *needs to be perpendicular to the edge* where the **Miter\
    \ Flange** will be made. Therefore, zoom in on the **Base Flange**, select one\
    \ of the small end faces, as illustrated in *Figure 3.9*, and start a sketch:"
  merge: -1
  img_proc: true
- pgno: 87
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_87_0.png)


    Figure 3.9: The Miter Flange sketch needs to be on a face perpendicular to the
    edge where the flange will be located


    4. Sketch the flange cross-section using the Sketch Entity tools. In this case,
    we will create a vertical line, 50mm high, in the top-right corner of the face,
    as illustrated in Figure 3.10.


    Note: it can be easier to create these sketches from a Normal To view:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_87_1.png)


    Figure 3.10: Sketching the flange cross-section-profile'
  merge: -1
  img_proc: true
- pgno: 88
  md: '5. Select the Miter Flange tool from next to the Edge Flange tool on the Sheet
    Metal tab or toolbar. Because we are currently editing a sketch, this sketch will
    automatically be used for the flange. If we weren’t editing a sketch, then selecting
    the Miter Flange tool would then present us with an option to select or draw a
    sketch.


    6. The profile of the vertical line will now be used to create a Miter Flange
    along the long edge of the Base Flange (Figure 3.11). If you can’t see the yellow
    preview, then ensure that you have the long edge selected in the Along Edges selection
    box at the top of the Property Manager on the left.


    The Miter Flange can be thought of as roughly similar to the Swept Boss/Base tool
    in normal solid modeling where a Path and Profile sketch are both needed. In this
    case, the Profile sketch is the vertical line sketch that we drew, and the Path
    sketch is the edge of the Base Flange that is selected.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_88_0.png)


    Figure 3.11: Creating a Miter Flange


    7. Note that even though we sketched a completely vertical line from the sharp
    corner of the Base Flange, the new flange preview automatically has the default
    bend radius from the Sheet-Metal properties folder. This Bend Radius can also
    be changed by deselecting the Use default radius box and setting a value.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '8. The exact position of the flange can be specified using the three **Flange
    Position** buttons. The **Trim Side Bends** and **Custom Bend Allowance** options
    can also be used, and the start and end of the **Miter Flange** can be offset.


    9. Press **OK** to create a **Miter Flange**.


    # Adding multiple edges


    One of the great benefits of using **Miter Flanges** instead of **Edge Flanges**
    is that corners between multiple edges can be mitered. In this context, this means
    that they join correctly at the corners with a specific gap.


    To add multiple edges and demonstrate the mitered corners, proceed as follows:


    +   1. Edit the **Miter Flange** feature in the FeatureManager Design Tree.

    +   2. Ensure you are in the **Along Edges** selection box (this should be blue).
    If not, then left-click in the box to select it.

    +   3. Left-click on more edges of the **Base Flange** to select them, and you
    should see the yellow preview now adds new flanges to the edges selected.

    +   4. The **Gap distance** option in the **Property Manager** allows the gap
    between the adjacent flanges to be adjusted.

    +   5. Select all four of the **Base Flange** edges and press **OK** to create
    a **Miter Flange** feature.


    Note that the *edges selected have to be adjacent to each other* and have to connect
    back to the original edge/face where the initial sketch was drawn.


    As mentioned, one of the key benefits of using the **Miter Flange** instead of
    the **Edge Flange** is that it allows corners to be properly mitered:


    +   1. Expand the **Miter Flange** feature in the FeatureManager Design Tree and
    edit the sketch. We can now change the profile of the flange.

    +   2. Select the vertical line by left-clicking on it, and delete the Vertical
    Relation. This can be done either by selecting and deleting the small **Vertical
    Relation** symbol next to the line in the **Graphics Area** or by deleting the
    Vertical Relation in the **Existing Relations** box at the top of the **Property
    Manager** on the left.


    When the Vertical Relation is deleted, the line should turn blue, which indicates
    that it is now Under Defined.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '3. Use **Smart Dimension** to add an angle to the line and make it 140° from
    the horizontal, as illustrated in Figure 3.12:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_90_0.png)


    Figure 3.12: Editing the line so that it is no longer vertical


    4. Exit the sketch by clicking the icon in the top right of the **Graphics Area**
    or the **Exit Sketch** button on the **Sketch** tab. You should now see that all
    four of the flanges are angled outward, and the corners extend to give a constant
    gap between them (that is, they are mitered correctly), as illustrated in Figure
    3.13:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_90_1.png)


    Figure 3.13: The Miter Flange with mitered corners'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Creating more complex Flange Profiles


    Maintaining the mitered corners of flanges is a useful feature, but the main advantage
    of using **Miter Flanges** is that the initial sketch can be edited to create
    complex flange shapes without lots of extra features or work. Here’s how we do
    this:


    +   1. Expand the **Miter Flange** feature and edit the profile sketch again.

    +   2. We can now edit the line and add multiple new lines. Try creating a sketch
    similar to the one shown in *Figure 3.14*:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_91_0.png)


    Figure 3.14: Try adjusting the Miter Flange profile sketch similar to this


    +   3. Exit the sketch, and it can now be seen that the updated sketch is used
    for the **Miter Flange**. Note again that the Bend Radius has been applied to
    any sharp corners.


    This feature demonstrates the value of the **Miter Flange** tool: in this case,
    we have replaced four potential **Edge Flange** features with just one single
    **Miter Flange**. Although the two tools are similar, the **Miter Flange** tool
    provides a much more powerful level of control and allows you to save time by
    combining multiple features in this way.'
  merge: -1
  img_proc: true
- pgno: 92
  md: "> **Make Sure the Bends can Actually Be Made in Real Life!**\n> Although the\
    \ Miter Flange feature is very useful, it can also be quite easy to use it to\
    \ create tightly folded flanges on multiple edges that could be difficult to create\
    \ using real-world manufacturing techniques.\n> \n> When creating SolidWorks models\
    \ for production, try to always keep in mind how the parts will actually be made\
    \ in real life, and adjust your models if necessary.\n\nSo far, we have looked\
    \ at two main types of flanges: **Edge Flanges** and **Miter Flanges**. In the\
    \ next section, we’ll look at **Hems**, which are another type of flange, whereby\
    \ an edge is tightly folded over on itself.\n\n# Using the Hem feature\n\nThe\
    \ term *hem* originally comes from fabric-making and describes material that is\
    \ doubled up and folded over. Hems can be seen on many items of clothing, such\
    \ as at the bottom of trouser legs or at the end of t-shirt arms.\n\nThe main\
    \ functions of **Hems** are:\n\n+   - **Remove or hide edge imperfections**: Since\
    \ **Hems** fold edges over on themselves, they can be used to effectively remove\
    \ sharp edges or to conceal cut edges or other defects.\n+   - **Strengthening\
    \ parts**: Folding the material over doubles the thickness without adding much\
    \ weight or complexity. This means it can be used as a great way of adding extra\
    \ strength to parts or unsupported edges.\n\nTo add **Hems**, proceed as follows:\n\
    \n+   1. Open your **Base Flange** *part* from the previous section and delete\
    \ any extra flanges, cuts, or tabs so that just the **Base Flange** remains. Alternatively,\
    \ you can start a new *part* document and create a **Base Flange** 200x300mm in\
    \ size and 1mm thick.\n+   2. Select the **Hem** tool from the **Sheet Metal**\
    \ tools. This can be found next to the **Miter Flange** tool.\n+   3. There are\
    \ many different options when creating **Hems**, but the first thing to select\
    \ is the edge where the **Hem** should be added:\n+      I. Click in the **Edges**\
    \ selection box at the top of the **Property Manager** and then left-click on\
    \ edges to add them.\n+      II. Left-click to select one of the long edges of\
    \ the **Base Flange**."
  merge: -1
  img_proc: true
- pgno: 93
  md: 'III. Multiple edges can be added in a similar way to **Edge** and **Miter Flanges**,
    and the **Miter Gap** can be adjusted if required.


    IV. The hem width can also be adjusted by selecting the **Edit Hem Width** option
    and adjusting the sketch.


    V. The direction of the **Hem** fold can also be flipped by clicking the **Reverse
    Direction** box.


    4. We can now specify the exact position of the **Hem** using the first two buttons.
    As with the previous tool, the small icons on the buttons demonstrate each option,
    as follows:


    +   - **Material Inside** ensures that all of the **Hem** material is inside the
    footprint of the **Fixed Flange**.

    +   - **Material Outside** means that the **Hem** material is added onto the outside
    of the **Fixed Flange** and so is outside of the footprint.


    See Figure 3.15 for an example of both types:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_93_0.png)


    ![](img/4e9c736de6bac4449096a7b92c28af4c_93_1.png)


    Figure 3.15: Material Inside option (lower) and Material Outside option (upper)'
  merge: -1
  img_proc: true
- pgno: 94
  md: '5. Next, the type of Hem can be set. There are four options, as illustrated
    Figure 3.16 and as usual, the icon shows a simple graphical representation of
    what these options do:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_94_0.png)


    Figure 3.16: Hem Types; left to right: Closed, Open, Tear Drop, Rolled


    From left to right, the Hem types are:


    +   - Closed: This option completely folds the material over, almost flat on itself.
    There will always be a small gap between the folded section and the Fixed Flange,
    due to the need for a very small radius inside the bend.


    The only parameter that can be set is the length of the flange, and this includes
    both the straight (folded over) section and also the outside of the bend area.


    +   - Open: This type is quite similar to the Closed type but allows a gap distance
    to be set. Again, the length of Hem includes the bend area. Therefore, a larger
    gap will have a larger bend radius and so will have a shorter straight section
    for any given Hem length, as illustrated in Figure 3.17.


    Note that Hems (and many other features) can be double-clicked to quickly edit
    the parameters that make them up:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_94_1.png)


    Figure 3.17: The Hem length includes the bend area, so a larger gap will reduce
    the length of the straight section'
  merge: -1
  img_proc: true
- pgno: 95
  md: '+   - **Tear Drop**: As the name suggests, this option creates a rolled-over
    Hem, with an angled straight section that creates a teardrop shape. Two parameters
    drive the size of the **Tear Drop** Hem: the inner radius of bend, and the angle
    of the straight section. The angle is measured between the straight section of
    the Hem and the **Fixed Flange** and has to be between 180 and 270°. Try adjusting
    the angle and notice how the length of the straight section automatically adjusts
    to maintain the same gap between the edge of the Hem and the **Fixed Flange**.

    +   - **Rolled**: The final type of Hem is very similar to the **Tear Drop** option
    but simply removes the straight section of material. The **Rolled** option is
    also controlled by the inner radius of the bend and the angle, but in this case,
    any angle can be set. However, be aware that although large angles can be used,
    anything over about 300° will probably result in the material of the Hem clashing
    with itself, and this could cause manufacturing problems.


    6. Similar to many other **Sheet Metal** tools, we can also adjust the **Custom
    Bend Allowance** and **Custom Relief Type** values for the **Hem** feature if
    required.


    **Hems** are a very useful little features that are mostly used for improving
    edges and adding strength. There are four types, and these can all be added to
    multiple edges in a similar way to other flanges. Now, we will introduce the **Sketched
    Bends** feature, which allows us to add bends anywhere on a sheet, using sketched
    lines.


    # Adding Sketched Bends


    Instead of adding bends at existing edges, we can also use sketches to define
    exactly where bends will be made:


    +   1. Open your **Base Flange** *part* from the previous section and delete any
    extra flanges, cuts, or tabs so that just the **Base Flange** remains. Alternatively,
    you can start a new *part* document and create a **Base Flange** 200×300mm in
    size and 1mm thick.

    +   2. A Sketched Bend starts with a sketch, so select the top face of the **Base
    Flange** and start a sketch.


    As with many SolidWorks tools, it is also possible to select the **Sketched Bend**
    feature first. If so, you will then be prompted to create or select a sketch for
    use with the feature.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '3. Use the **Line** tool to sketch a diagonal line across one corner of the
    **Base Flange**. Make each end point of the line 100mm from the corner of the
    **Base Flange**, as illustrated Figure 3.18. This line will determine where the
    bend will be made:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_96_0.png)


    Figure 3.18: Adding a sketched line to define where the Sketched Bend will be
    made


    4. Select the **Sketched Bend** feature from the **Sheet Metal** tab or toolbar.


    5. In the **Property Manager**, ensure that the **Fixed Face** box at the top
    is selected (this should be blue). The Fixed Face is the section of the model
    that won’t move when the bend is created.


    6. Select the larger region of the **Base Flange** face by left-clicking. A yellow
    preview should appear, showing the triangular corner of the **Base Flange** bent
    up along the sketched line, as illustrated in Figure 3.19.


    Try deselecting the **Fixed Face**, then selecting the smaller, triangular area
    to see the difference between each selection:'
  merge: -1
  img_proc: true
- pgno: 97
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_97_0.png)


    Figure 3.19: Selecting the large region will then bend the smaller region along
    the sketched line


    +   7. Clear the Fixed Face selection, then reselect the original, larger region
    of the Base Flange face.


    +   8. The angle of the bend can be adjusted using the value in the Property Manager,
    and the direction can be flipped by clicking the Reverse Direction box. The Bend
    Radius value can also be adjusted if required.


    +   9. There are four Bend Position options and all are fairly self-explanatory:


    +   - Bend Centerline: This places the center of the first bend at the position
    of the sketched line.


    +   - Material Inside: This places the entire bent flange within the footprint
    of the sketched line on the Fixed Face.


    +   - Material Outside: This places the bent flange outside of the footprint of
    the sketched line on the Fixed Face (so that the inner face of the bent flange
    lines up with the sketched line). However, some of the actual bend region may
    still be within the sketched line on the Fixed Face.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '+   - **Bend Outside**: This places the entire bend outside of the sketched
    line. This means that the bent flange will be slightly offset from the sketched
    line, depending on the **Bend Radius** size.


    10. A **Custom Bend Allowance** value can be set if needed. One of the benefits
    of using **Sketched Bends** is that we can ensure that the size of the flat sheet
    is always exactly correct from a manufacturing point of view. If bends are added
    to a **Base Flange** using other tools (such as **Edge Flanges**), then the size
    of the flattened sheet may vary, depending on exactly how the bends are defined.
    However, by using **Sketched Bends**, we can always ensure that the size of the
    flattened sheet remains exactly the same.


    In practice, this isn’t usually an issue, but if high accuracy is critical to
    your model and you are using non-standard Bend Allowances, then consider using
    **Sketched Bends** instead of other flange types.


    11. Press **OK** to create a **Sketched Bend**.


    12. To edit **Sketched Bend** parameters, click on the **Sketched Bend** feature
    in the FeatureManager Design Tree and select **Edit Feature**. To edit the underlying
    sketch that drives the bend, expand the **Sketched Bend** feature and edit the
    sketch found there.


    **Sketched Bends** are a great way to add bends when existing edges are not available,
    and are a good way to exactly specify bend position. The following section introduces
    **Jogs**, which automatically use two **Sketched Bends** to offset a flange.


    # Creating and using Jogs


    **Jogs** are a specialized form of sketched bend that uses two opposite bends
    to offset a sheet, making a Z or S shape. **Jogs** can be used to offset edges
    so that they fit into other parts (such as fitting the edges of a lid inside a
    box), or to stiffen the edge of a part. They are also especially useful when joining
    two sheets with a flat outer face. *Figure 3.20* shows two sheets of metal joined
    using a **Jog** and rivets:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_98_0.png)


    Figure 3.20: An example of a Jog feature being used to join two sheets'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'Jog features are made in a very similar way to Sketched Bends:


    +   1. Open your Base Flange part from the previous section and delete any extra
    flanges, cuts, or tabs so that just the Base Flange remains. Alternatively, you
    can start a new part document and create a Base Flange 200x300mm in size and 1mm
    thick.

    +   2. Jogs require a sketch to define where the Jog should be located, so start
    a sketch on the top face of the Base Flange.

    +   3. Use the Line tool to sketch a line directly across the Base Flange, making
    it Vertical and 100mm from the edge (Figure 3.21).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_99_0.png)


    Figure 3.21: Creating a sketch for use with the Jog feature


    +   4. Select the Jog feature from the Sheet Metal tools. Note that the Jog feature
    can also be selected before creating a sketch. You will then be prompted to select
    or create a sketch to use with it.

    +   5. Select a Fixed Face. In the same way as the Sketched Bend feature, this
    is the face that won’t move.

    +   6. Select the large region to the left of the sketch line. A yellow preview
    will show the bent area. As usual, the Default Bend Radius property is used, but
    this can be overridden if needed.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '7. Set the Jog Offset property (labeled i in Figure 3.22). The direction can
    be flipped if required by pressing the Reverse Direction button. Set the offset
    to 10mm, Blind:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_100_0.png)


    Figure 3.22: The Jog Property Manager


    8. Offset Distance: The actual height of the offset (labeled ii in Figure 3.22)
    depends on which of the following three options (labeled iii in Figure 3.22) is
    chosen:


    +   - Outside Offset: This uses the distance between the upper face of the Fixed
    Flange and the upper face of the Jog area (Figure 3.23, left).

    +   - Inside Offset: This uses the distance between the two inner faces of the
    Jog—that is, the upper face of the Fixed Flange and the lower face of the Jog
    area (Figure 3.23, center).

    +   - Overall Dimension: This gives the total thickness of the Jog—that is, the
    distance between the lower face of the Fixed Flange and the upper face of the
    Jog area (Figure 3.23, right).'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_101_0.png)


    Figure 3.23: Offset Distance types; left to right: Outside Offset, Inside Offset,
    Overall Dimension


    9. The Fix projected length option (labeled iv in Figure 3.22) allows extra material
    to be added to the flange to compensate for the material that is taken up by the
    Jog section.


    If Fix projected length is selected, then the Jog flange will be the same length
    as the original Fixed Flange, but if the option is deselected then the Jog flange
    will be shorter than the Fixed Flange was (Figure 3.24), because some of the material
    is used by the Jog itself:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_101_1.png)


    Figure 3.24: Fix projected length option


    10. Jog Position: The actual Jog can be specified in a similar way to the Sketched
    Bend options (labeled v in Figure 3.22):


    +   - Bend Centerline: This places the center of the first bend at the position
    of the sketched line.


    +   - Material Inside: This places the first Jog bend within the footprint of
    the sketched line on the Fixed Face.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '+   - **Material Outside**: This places the first bent flange outside of the
    footprint of the sketched line on the Fixed Face (so that the inner face of the
    bent flange lines up with the sketched line). However, some of the actual bend
    region may still be within the sketched line on the Fixed Face.

    +   - **Bend Outside**: This places all of the first Jog bend outside of the sketched
    line. This means that the bent flange will be slightly offset from the sketched
    line, depending on the **Bend Radius** size.


    11. **Jog Angle**: Finally, the **Jog Angle** property (labeled vi in *Figure
    3.21*) can be set. Both bends in the **Jog** feature will use the same angle,
    meaning that the upper section of the **Jog** will always be parallel to the Fixed
    Face.


    # A practical example of using Jogs


    **Jog** features can be particularly useful for joining two thin sheets and yet
    still maintaining a flush outer surface. If two thin sheets butt up against each
    other and join directly, then it can be very hard to weld or otherwise join them
    together because we only have a tiny surface (that is, the thickness of the sheet)
    where they actually join (*Figure 3.25*).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_102_0.png)


    Figure 3.25: Thin sheets can be hard to join without Jogs


    To demonstrate how a **Jog** feature can help to solve this issue:


    +   1. Start a new *part* document and create a **Base Flange** 100×50mm in size,
    1mm thick, with a **Bend Radius** value of 1mm.

    +   2. Add **Edge Flanges** to each of the shorter edges. These should be 50mm
    long with a 90° angle, a **Flange Length** type of `Outer Virtual Sharp`, and
    a **Flange Position** of `Material Inside`. Both edges can be added to a single
    feature. This gives a U-shaped model.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '3. Add two further Edge Flanges to the top edges of the previous Edge Flanges
    (Figure 3.26). These should both be at a 90° angle and have a length of 49mm (Outer
    Virtual Sharp and Material Inside) so that a rough box shape is created but the
    ends of the upper flanges don’t quite touch and have a small gap:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_103_0.png)


    Figure 3.26: Creating a part with a single Base Flange and two sets of Edge Flanges,
    creating a rough box shape


    4. If this part was created in real life, then the unsupported end of the upper
    Edge Flanges would probably be fairly weak. Ideally, we would join them together,
    but the very thin sheet thickness would make them difficult to weld. Therefore,
    we will use a Jog feature to make the flanges overlap.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '5. Sketch a single line on the top face of one of the flanges, making it parallel
    to—and 20mm away from—the edge (Figure 3.27).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_104_0.png)


    Figure 3.27: Sketching a line for the Jog feature


    6. From within the sketch, select the Jog tool. This uses the current sketch in
    the Jog feature. We could also have selected the Jog tool first, then drawn the
    sketch.


    7. Within the Jog tool, select the Fixed Face. This will be the larger region
    of the flange, on the bend side of the flange (the lefthand section in Figure
    3.27).


    8. Input the following parameters:


    +   - Jog Offset: Blind, 1.5mm (toward the Fixed Flange)

    +   - Outside Offset

    +   - Fix projected length: On

    +   - Jog Angle: Bend Centerline

    +   - Jog Angle: 90°'
  merge: -1
  img_proc: true
- pgno: 105
  md: '9. Press **OK** to create a **Jog**. Note that you may be presented with a
    message (*Figure 3.28*) warning that the **Jog Offset** value is not correct.
    Press **OK** to create the **Jog** anyway and we will look at the issue:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_105_0.png)


    Figure 3.28: Sometimes, the desired offset distance will not be used and a warning
    will be displayed


    10. If we look at the model from the side (*Figure 3.29*) we can see that although
    we set an **Offset Distance** value of 1.5mm, the **Jog** has actually been created
    with an **Offset Distance** value of 3mm.


    This is because the **Jog** used a **Default Bend Radius** value of 1mm; therefore,
    the **Jog** is made up of two 90° bends, each of which cannot be smaller than
    1mm in size. Adding this to sheet thickness gives our actual 3mm offset.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Therefore, be aware that Jog offset distances may sometimes be different from
    what you think you have specified:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_106_0.png)


    Figure 3.29: Sometimes, the Jog offset distance will be greater than what was
    specified


    11. To reduce the offset distance, we must either reduce the Bend Radius value
    or adjust the Jog Angle value.


    Edit the Jog feature and reduce the Bend Angle from 90° using the down arrow next
    to the Offset Distance box. Notice that as the angle reduces, the Offset Distance
    value in the preview also reduces, because we are effectively reducing the height
    of the bends in the Jog.


    At some point (in this case, 60°), the gap in the preview will no longer reduce.
    This shows us the maximum angle that we can use to achieve the correct offset
    distance of 1.5mm.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Therefore, set a **Jog Angle** value of 60° and press **OK** (*Figure 3.30*).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_107_0.png)


    Figure 3.30: Setting a Jog Angle of 60° will give the correct offset of 1.5mm


    +   12. To finish off the **Jog** example, we can now create an overlapping area
    using a **Tab**. Start a sketch on the upper face of the flange without the **Jog**.


    +   13. Use the **Rectangle** tool to draw a closed profile that overlaps the
    **Jog** area (*Figure 3.31*).


    ![](img/4e9c736de6bac4449096a7b92c28af4c_107_1.png)


    Figure 3.31: Sketching a closed profile on the top face of the flange'
  merge: -1
  img_proc: true
- pgno: 108
  md: '14. Use the Base Flange/Tab option to create an overlapping Tab section (Figure
    3.32). This overlapping area could then be used with rivets or bolts to join the
    two flanges together, or it could be spot welded:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_108_0.png)


    Figure 3.32: Creating an overlapping section using the Tab tool


    Jogs are a useful feature that offsets a sheet or flange. They can be used in
    multiple ways, allowing edges to be stiffened or offset to help parts fit together.


    # Summary


    In this chapter, we learned how to add and remove material using Cuts, Holes and
    Tabs. We also explored some new features related to flanges: the Miter Flange,
    the Hem, Sketched Bends, and Jogs. These can all be used to add greater complexity
    and functionality to your parts.


    In Chapter 4, Creating Sheet Metal Drawings and Exporting Files, we will explore
    how your Sheet Metal models can be exported for real-world production, and how
    you can create two-dimensional (2D) drawings of your parts and assemblies.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 4

    Creating Sheet Metal Drawings and Exporting Files


    **Two-dimensional (2D)** drawings are essential if sheet metal parts are to be
    manufactured and used in the real world.


    In this chapter, we will discover some of the Sheet Metal-specific details that
    are needed for SolidWorks drawings, including how to insert **Flat Patterns**
    based on Sheet Metal *parts*. We will also learn the various ways that Sheet Metal
    parts can be exported for use, such as **Drawing Exchange Format (DXF)** and **Drawing
    (DWG)** file types.


    By the end of this chapter, you''ll understand how to add Sheet Metal details
    to SolidWorks drawings, and how to export 2D files.


    In this chapter, we''re going to cover the following main topics:


    +   - Creating basic 2D drawings of Sheet Metal *parts*

    +   - Using **Flat Pattern** views

    +   - Exporting Sheet Metal *parts* for manufacturing'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# SolidWorks Drawings overview


    Although SolidWorks primarily focusses on the creation of 3D models, 2D drawings
    are still an important aspect of engineering and product development. After a
    3D model has been completed a 2D drawing of it is often created to assist in manufacturing
    or for record keeping. These drawings can be made from single parts or entire
    assemblies and can range from simple overviews of the models all the way up to
    complex, multi-sheet drawings that contain section views, detail break-outs and
    other notes.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_110_0.png)


    Figure 4.1: An example SolidWorks drawing


    The detailed creation of drawings is beyond the scope of this book but as a quick
    refresher drawings can be created by going to File | New... and then selecting
    Drawing.


    Various views can then be added to the drawing sheet and dimensions and other
    notes can be added. When complete, SolidWorks drawings can be exported as PDF
    files so that they can be shared with non-SolidWorks users.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Creating basic 2D drawings of Sheet Metal parts


    Now that we know the basics of making Sheet Metal models, we can explore how we
    can create 2D drawings that can be used to actually make these parts. Drawings
    are especially important for Sheet Metal models because sheet metal production
    processes can often be less automated than other manufacturing methods such as
    computer numerical control (CNC) machining or injection molding. An example of
    a SolidWorks Sheet Metal drawing can be seen in Figure 4.2.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_111_0.png)


    Figure 4.2: An example SolidWorks Sheet Metal drawing


    This section assumes that you already understand the basics of creating SolidWorks
    drawings. The chapter is not intended to be an overall guide to sheet metal and
    layouts (which vary between countries and organizations); it will simply demonstrate
    some additional Sheet Metal-specific features that are needed for SolidWorks drawings.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'First, we will create a very simple part that can be used to demonstrate drawing
    details, as follows:


    +   1. Start a new part document and create a Base Flange 200x300mm in size and
    1mm thick. The default Sheet Metal Properties can be used, as this part will just
    be used to show generic drawings.

    +   2. Add Edge Flanges to all four of the outer edges of the Base Flange. Make
    these 50mm high with a 90° angle. We should now have a simple open-box shape.

    +   3. Save your part.

    +   4. To create a 2D drawing of the part, go to File | Make Drawing from Part.

    +   5. Select a template, if the option pops up. For most users, this step will
    occur automatically and the default template will be used.

    +   6. We are now in a new, blank drawing and we can add drawing views in the
    same way as with standard SolidWorks drawings. Try either going to the Drawing
    tab and selecting a view (such as Standard 3 View) or opening the View Palette
    on the right of the screen (See Figure 4.3) and dragging the views that you require
    onto the page:


    It is also possible to create a drawing separately by going to File | New... and
    selecting Drawing. You will then be prompted to select the model you wish to make
    a drawing with.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_112_0.png)


    Figure 4.3: Views of the model can be dragged onto the drawing page from the View
    Palette'
  merge: -1
  img_proc: true
- pgno: 113
  md: '7. **Dimensions** and **Notes** can be added as needed, and detail can be added
    in the same way as standard SolidWorks drawings.


    8. **Cut Lists** tables can also be added to the drawing. In Sheet Metal drawings,
    **Cut Lists** display all of the different sheets that are needed to create your
    model, and so they can be thought of as similar to **Bills of Material** tables
    in standard SolidWorks drawings.


    To add a **Cut List** table:


    +   I. After adding drawing views to the sheet, go to the **Annotation** tab and
    select **Tables | Weldment Cut List.**


    +   II. You will be prompted to select a model to use to create the table. Left-click
    on any of the views (since they are all from the same model) in the drawing.


    +   III. Set any specific properties that you require or press the green **OK**
    check mark to insert the table.


    +   IV. The **Cut List** table will now follow the mouse around and can be placed
    anywhere on the drawing by left-clicking.


    +   V. **Balloons** can also be added to the drawing (these are also on the **Annotations**
    tab) to specify which parts in the drawing views correspond to which entries in
    the table (they are not required in this case as there is only one single sheet
    in the model, but this can be more useful with complex models that have multiple
    sheets).


    9. Save the drawing, by going to **File | Save** or by clicking the **Save** button.


    10. By default, the file will be saved as a SolidWorks drawing file, but drawings
    can also be exported as **Portable Document Format (PDF)** files and other file
    types. These can be useful for sharing with people who don''t have SolidWorks.


    To save a drawing as a PDF, go to **File | Save As...** then select **PDF** from
    the **Save as type** drop-down list.


    There are also PDF-specific options that can be accessed by clicking the **Options**
    button.


    > **Specifying Sheet Thickness**

    > If creating sheet metal drawings, remember to specify the sheet thickness that
    is to be used. This can be easy to overlook. It can be added either as a dimension
    or as a separate note.


    In the next section, we will learn how to insert **Flat Pattern** views, which
    detail the Sheet Metal operations needed to actually make the parts from the drawings.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Using Flat Pattern views


    The basic drawing that we have created so far is a good overview of the model,
    but it doesn''t really contain enough information to fully make these parts because
    it doesn''t have details of how the parts will actually be folded from a flat
    sheet. To give this information, we can insert a flattened view of the Sheet Metal
    model using a Flat Pattern.


    To insert a Flat Pattern, proceed as follows:


    +   1. First, we will add an extra sheet to the drawing to ensure we have plenty
    of space for the Flat Pattern. Click the Add Sheet button, which is just to the
    right of the Sheet1 tab at the lower left of the screen. You can switch between
    sheets by simply left-clicking on the appropriate sheet tab.

    +   2. To add a Flat Pattern to the new sheet, expand the View Palette on the
    right-hand edge of the screen. If no views of your model are visible, try clicking
    the Refresh button at the top of the View Palette.

    +   3. Find the view labeled Flat Pattern and drag this onto the second sheet
    (see Figure 4.4). A flattened view of the part—the Flat Pattern—should now be
    visible:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_114_0.png)'
  merge: -1
  img_proc: true
- pgno: 115
  md: '4. The dashed lines on the view indicate Bend Lines. If your Bend Lines are
    not visible, then try going to View | Hide/Show and check that Sketches are visible.


    5. The four notes that read UP 90° R 1 are Bend Notes. These indicate how these
    sections of the sheet will be bent. In this case, the flanges will be bent upward
    at an angle of 90° with a Bend Radius of 1mm.


    If your Bend Notes don''t appear, then left-click on the Flat Pattern view and
    ensure that the Bend Notes option in the Property Manager on the left is switched
    on. It is also possible to edit the Bend Notes details (and other Flat Pattern
    options such as Display Style) here.


    6. The individual Bend Notes can also be adjusted. Left-click and drag them around
    to reposition. The angle of the notes can be changed in the Property Manager,
    and leader arrows can also be added to clarify exactly which Bend Line corresponds
    with which Bend Note.


    Flat Patterns are an essential part of 2D Sheet Metal drawings and can be used
    to show exactly how your parts will be made.


    # Using Ordinate Dimensions


    When creating Sheet Metal drawings, especially when using Flat Patterns, sometimes
    drawings can become very cluttered because lots of dimensions need to fit within
    a small area. To help reduce this effect, Ordinate Dimensions can be used. These
    are dimensions that are all added on one single line, from an ordinate (or zero)
    point.


    To use Ordinate Dimensions:


    +   1. Within a drawing document, go to the Annotation tab, then click the drop-down
    arrow underneath Smart Dimension and choose Ordinate Dimension.


    > Note

    > The Ordinate Dimension tool can be used to add either horizontal or vertical
    ordinate dimensions. Alternatively, the specific Vertical Ordinate and Horizontal
    Ordinate tools can be selected to add dimensions in vertical or horizontal orientations
    only. These tools can be useful if you are having trouble getting the general
    Ordinate Dimension tool to pick up the correct orientation.'
  merge: -1
  img_proc: true
- pgno: 116
  md: "+   2. Left-click on a point or edge in the model (such as the lower horizontal\
    \ edge) to anchor the zero point of the ordinate. Drag out the dimension and left-click\
    \ again to place it. This line will now act as a datum (zero point) where all\
    \ other dimensions on the line will be measured from.\n\n+   3. Select further\
    \ points in the model to add more dimensions to the line (see Figure 4.5). When\
    \ you have finished placing dimensions, press the Esc key to stop placing new\
    \ dimensions:\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_116_0.png)\n\n+   4.\
    \ If you find that your Ordinate Dimensions become too bunched up, you can manually\
    \ drag them around to re-space them. Rebuilding the drawing by pressing Ctrl+B\
    \ also sometimes automatically re-spaces them.\n+   \n+   If your dimensions are\
    \ still too close together, then try right-clicking on one of the dimensions and\
    \ selecting Display Options | Re-Jog Ordinate.\n\n+   5. To add more dimensions\
    \ to the ordinate at a later stage, right-click on one of the Ordinate Dimensions\
    \ and select Add to Ordinate.\n\nFlat Patterns are an essential part of most Sheet\
    \ Metal 2D drawings, and Ordinate Dimensions can be used to make them clearer\
    \ and avoid them becoming too cluttered with traditional dimensions."
  merge: -1
  img_proc: true
- pgno: 117
  md: 'In the next section, we learn how to export Sheet Metal parts in formats that
    can be used to create real-life parts.


    # Exporting Sheet Metal parts for manufacturing


    Paper drawings are a very useful way of displaying how exactly your Sheet Metal
    parts will be made, but the initial Flat Pattern will likely be cut out of a larger
    sheet using a machine such as a laser or plasma cutter. To do this, a 2D file
    of the flattened part is needed.


    There are many file formats for these 2D files, but the two most commonly used
    are DXF and DWG files. These two file types are both very similar; they are both
    2D vector files that create a drawing from entities such as lines and arcs.


    DXF and DWG files can often be used interchangeably, but DWG files are actually
    a proprietary format of Autodesk (the makers of AutoCAD), whereas DXF files are
    more open source. For this reason, DXF files tend to be more widely used, and
    in my experience, they work with a larger range of other software and manufacturing
    machines.


    DWG files can be useful if you are working with AutoCAD (because they contain
    specific AutoCAD information), but since we are using SolidWorks, I recommend
    using DXF files.


    To export your Sheet Metal parts as DXFs:


    +   1. First, flatten your part from the previous section by selecting **Flatten**
    from the **Sheet Metal** tools.

    +   2. Go to a **Top-down** view or select the top face of the sheet and go to
    a **Normal To** view.

    +   3. Select **File | Save As....**

    +   4. Set the file type as **DXF** by selecting it in the **Save as type** box
    underneath the filename. **DWG** can also be selected if preferred; this is next
    to **DXF** in the list.

    +   5. Set the specific *DXF/DWG options*, if needed, by pressing the **Options**
    button. Generally, the default options will work fine in most situations, and
    I recommend using these unless your manufacturer specifically requests that you
    change certain settings.

    +   6. Type in the filename and press **Save** to save the file.

    +   7. Further **DXF / DWG Output** options will now appear (see *Figure 4.6*).
    For sheet metal parts, the **Sheet metal** option is usually the best choice for
    the **Export** setting.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Different **Entities to Export** settings can also be chosen. In this case,
    select **Geometry** (the outer lines of your part) and **Bend lines:**


    ![](img/4e9c736de6bac4449096a7b92c28af4c_118_0.png)


    Figure 4.6: DXF / DWG Output options


    +   8. Press the green OK check mark.


    +   9. A preview of the file that will be exported will now appear. Solid lines
    indicate the model''s geometry (i.e., the outer perimeter), whereas dashed lines
    are the Bend Lines. The view can be adjusted using the controls at the top. If
    any additional lines aren''t needed, they can be selected by left-clicking and
    then deleted. Note that the usual Ctrl + Z shortcut for undoing actions doesn''t
    work in this preview, but there are Undo and Redo buttons in the bottom left of
    the preview window.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'In this case, we may have decided that we don''t need the Bend Lines. Therefore,
    press **Cancel** to close the preview window. This doesn''t cancel the entire
    save operation; it just takes us back by a single step.


    > **Which Lines Should I Export?**

    > When exporting 2D files for sheet metal, try to consider the end purpose of
    the file. If the files will be used to cut the flat blanks, then they probably
    will just need the outer perimeter (Geometry) of the part and won''t require Bend
    Lines. Adding Bend Lines in this case could potentially confuse manufacturers.


    +   10. Deselect the **Bend lines** box, and then press the green **OK** check
    mark again.

    +   11. In the updated preview window, note that the Bend Lines no longer appear.
    Press **Save** to save the DXF file.

    +   12. The saved file can now be opened and checked if desired. By default, DXF
    and DWG files should open using the *eDrawings* program, which is usually installed
    as part of a default SolidWorks installation.

    +   13. DXF and DWG files can also be opened in SolidWorks by dragging the file
    into the program, or by going to **File | Open** and changing the file type filter
    in the lower right of the **Open File** dialog box. This can be useful for using
    these 2D files to create 3D models.

    +   14. Other programs can also open these file types. For example, a good 2D
    CAD editor is **LibreCAD**. This is available as a free download online.


    The files can also be imported into **Adobe Illustrator**, and this can be very
    useful if you need to create artwork such as screen-printed logos or packaging.
    It''s also possible to save models directly as Illustrator files, by changing
    the **Save as type** setting within the **Save as...** menu.


    In this section, we learned how to export SolidWorks Sheet Metal parts as DXF
    files for production. We also briefly covered different file types and how and
    why these might be used.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Summary


    In this chapter, we learned how to create basic 2D sheet metal drawings, as well
    as how to use **Ordinate Dimensions** and how to add **Flat Patterns** to drawings.
    We also explored some of the different 2D file types that can be used to export
    your Sheet Metal models for production in the real world.


    In the next chapter, we will look at a more advanced flange type—the **Swept Flange**—and
    we''ll discover how to use the **Fold** and **Unfold** tools, and why these are
    important.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Section 2:

    Advanced Sheet Metal Tools


    Now that we understand how to make basic Sheet Metal models, we can start exploring
    the more advanced Sheet Metal tools. These can be used to create more complex
    models and can also be used to finalize model details.


    This section contains the following chapters:


    +   - Chapter 5, Creating Complex Parts Using Swept Flanges and the Fold/Unfold
    Tools

    +   - Chapter 6, Utilizing Gussets, Crossbreaks, and Vents to Add Part Details

    +   - Chapter 7, Producing Advanced Shapes Using Lofted Bends

    +   - Chapter 8, Joining Multi-Sheet Parts Using Tab and Slot Features

    +   - Chapter 9, Finishing Off Models Using Corner Details

    +   - Chapter 10, Adding 3D Details to Models with Forming Tools'
  merge: -1
  img_proc: true
- pgno: 122
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 5

    Creating Complex Parts Using Swept Flanges and the Fold/Unfold Tools


    Swept Flanges are similar to Miter Flanges and can cause confusion with some users,
    but each tool has a specific use case. In this chapter, we will learn how and
    why they are used.


    We will also explore folding and unfolding operations. These are distinct from
    flattening and unflattening and can be used to make specific features, such as
    cuts across bends.


    By the end of this chapter, you''ll understand how to use Swept Flanges and the
    Fold/Unfold tools and why they might be needed.


    In this chapter, we''re going to cover the following main topics:


    +   - How to use Swept Flanges

    +   - Swept Flange versus Miter Flange

    +   - Folding and unfolding'
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   - Why use **Fold/Unfold**?

    +   - Unfolding versus flattening


    # How to use Swept Flanges


    In *Chapter 3, Getting Familiar with Basic Tools in Sheet Metal*, we learned how
    to easily add complex flange profiles to multiple edges using a **Miter Flange**.
    The **Swept Flange** tool can be used to create fairly similar parts, but with
    some important differences.


    **Swept Flanges** can be thought of as similar to **Swept Boss/Base** features
    from normal solid modeling. Those features require two elements, a *Profile sketch*,
    and a *Path sketch*, for it to be swept along. The **Swept Flange** also needs
    these two elements, although existing edges are used instead of a standalone Path
    sketch.


    To create a **Swept Flange**:


    +   1. Start a new *part* document and create a **Base Flange** 100×100mm in size
    and 1mm thick. The default Sheet Metal properties can be used.

    +   2. First, we need to sketch the profile of the flange that will be created.
    Start a sketch on one of four small faces of the **Base Flange**.

    +   3. Use the **Line** tool to draw a simple flange profile, like the one shown
    in *Figure 5.1* Remember to Fully Define your sketch by adding Relations and Dimensions.
    The sketch profile must be open for it to work correctly:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_124_0.png)


    Figure 5.1: Creating a Base Flange and sketching a flange profile on one of the
    small faces'
  merge: -1
  img_proc: true
- pgno: 125
  md: '4. Select the **Swept Flange** tool from the Sheet Metal tools. This can be
    selected from within the sketch, or the tool can be selected first, and then a
    sketch can be chosen.


    The message at the top of the tool''s **Property Manager** explains how to use
    it. First, ensure that you are in the **Profile** Selection box (the smaller,
    top one should be blue), then select the open sketch profile.


    5. Next, select the **Path** to be used with the **Swept Flange**—for example,
    the existing side of the **Base Flange**. A yellow preview of the flange should
    appear, as illustrated in *Figure 5.2*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_125_0.png)


    Figure 5.2: Swept Flange preview


    6. All of the usual flange options are available, such as setting the **Bend Radius**
    (or using the default), changing the **Flange Position**, offsetting the start
    and endpoints, and adjusting the **Custom Bend Allowance** or **Relief Type**.


    7. Select the three remaining edges of the **Base Flange** and notice how the
    yellow preview of the flange continues around the corners of the **Base Flange**,
    with a curved corner, rather than separate flanges for each edge. Similar to the
    **Miter Flange** tool, the edges selected must be adjacent and connected to the
    original flange profile sketch.


    8. Press the green **OK** check mark to create the feature.'
  merge: -1
  img_proc: true
- pgno: 126
  md: "+   9. Flatten the *part* by clicking the **Flatten** button. Note that the\
    \ flattened shape is very different from how a flattened **Miter Flange** feature\
    \ would appear if it were made using the same profile.\n+   \n+   Because the\
    \ flat *part* has no bend relief cuts, it is likely that this part couldn't be\
    \ made with traditional bending methods and would have to use a process such as\
    \ stamping.\n\n+   10. Select the **Flatten** tool again to refold the *part*.\n\
    \n**Swept Flanges** are quite a specialist feature that might require specific\
    \ manufacturing methods and tooling. The following section will explain the difference\
    \ between **Swept Flanges** and **Miter Flanges** in more detail.\n\n# Swept Flange\
    \ versus Miter Flange\n\nAlthough **Swept Flanges** and **Miter Flanges** can\
    \ appear very similar, one very important difference is that the corners of **Swept\
    \ Flanges** are joined together continuously—that is, they are not mitered (trimmed\
    \ in order to fit together). This means that there are no bend relief cuts in\
    \ the corners (see *Figure 5.3*) and they are rounded.\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_126_0.png)\n\
    \nFigure 5.3: The same part made using a Swept Flange (left) and a Miter Flange\
    \ (right)"
  merge: -1
  img_proc: true
- pgno: 127
  md: 'The difference can be seen even more clearly in the flattened versions of both
    *parts*. The version made using the **Swept Flange** (shown on the left-hand side
    of *Figure.5.4*) has no cuts in the corners and so would have to be made using
    a process such as stamping and probably would require specialist tooling. By contrast,
    the **Miter Flange** version (shown on the right-hand side of Figure 5.4) has
    cut corners. These could be created using a generic tool such as a Press Brake
    and so would probably be easier and cheaper to produce:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_127_0.png)


    ![](img/4e9c736de6bac4449096a7b92c28af4c_127_1.png)


    Figure 5.4: Flat Patterns of the preceding models


    Both of these tools have their own benefits and drawbacks. They produce quite
    similar results but with important differences, and so the usage of them will
    depend on exactly what you want to make and *how* you are planning to make it.


    In the next section, we will learn how to use the **Fold** and **Unfold** features
    to unbend parts in order to add unusual features such as cuts across bends.


    # Folding and unfolding


    **Fold** and **Unfold** are two related features that do the opposite of each
    other. As the names suggest, they allow you to unfold bends in your model and
    then refold them. This can be very useful for making certain types of cuts and
    other features and will be explained in more detail in the next section.


    To use the **Unfold** feature:


    +   1. First, create a new *part* document and make a **Base Flange** 100×100mm
    in size and 1mm thick. The default Sheet Metal properties can be used.

    +   2. Add **Edge Flanges** to all four of the edges. These should be 50mm high
    and at a 90° angle and can use any Flange Position.

    +   3. To unfold the bends, select the **Unfold** feature.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '4. Now select the Fixed Face. This is the face that won''t move when the bends
    are unfolded—for example, in this case, it is the square Base Flange in the middle
    of the Edge Flanges, as illustrated in the following screenshot:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_128_0.png)


    Figure 5.5: Selecting the Fixed Face


    5. The bends to be unfolded can now be selected by left-clicking them. Note that
    you actually have to click the bend face to select it.


    It is also possible to automatically select all of the eligible bends in the model
    by pressing the Collect All Bends button.


    Select all of the bends using either method.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   6. Press the green **OK** check mark to apply the unfolding.


    The **Unfold** feature now appears in the FeatureManager Design Tree. In this
    unfolded state, we could now make changes to the part, such as cutting across
    bends.


    Note that the unfolded model looks exactly the same as a *flattened* model would;
    however, there are some important differences that are explained in more detail
    in the next two sections.


    The **Fold** feature works in the opposite way to the **Unfold** feature—so, all
    of the steps are reversed:


    +   1. Select the **Fold** feature.

    +   2. Select the **Fixed Face**. In this case, this is the same as the **Unfold**
    example earlier—that is, the square **Base Flange**.

    +   3. Select the bends to be folded. These can be selected manually, or the **Collect
    All Bends** button can be used to select all of the appropriate bends in the model.

    +   4. Press the green **OK** check mark. The model is re-folded and the **Fold**
    feature appears in the FeatureManager Design Tree.


    In the next section, we''ll explain why the **Unfold** and **Fold** features might
    actually be needed in Sheet Metal modeling.


    # Why use Fold/Unfold?


    The **Unfold** and **Fold** features can be very useful when making cuts across
    bends that could not be made in the folded state. Here''s an example of how this
    can be done:


    +   1. Continuing on from the previous model, delete the **Fold** feature, but
    leave the earlier **Unfold** feature. This should leave an unfolded model with
    a rough cross shape.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '2. Start a sketch on the top face of the part and use the Circle tool to draw
    a 50mm-diameter circle that straddles one of the bend areas, as illustrated in
    Figure 5.6. Note: you can use the Midpoint Relation along the bent edge to anchor
    the circle in place:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_130_0.png)


    Figure 5.6: Creating a circle sketch on the top face of the unfolded part


    3. Use the circle sketch with an Extruded Cut to create a circular cut all the
    way through the sheet.


    4. Now, re-fold the part by selecting the Fold tool, choosing the Fixed Face,
    pressing Collect All Bends, and then pressing OK.


    This should create a folded box with the circle cut wrapped around the bend, as
    illustrated in Figure 5.7 and shows how the Unfold/Fold tools could be combined
    with other tools to make unusual details:'
  merge: -1
  img_proc: true
- pgno: 131
  md: '![](img/4e9c736de6bac4449096a7b92c28af4c_131_0.png)


    Figure 5.7: The circle cut is now wrapped around the bend


    +   5. To compare this cut with a similar cut made in the folded state, spin the
    model around and start a sketch on the underside face.


    +   6. Sketch another 50mm circle on the opposite edge to the existing cut, as
    illustrated in Figure 5.8.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_131_1.png)


    Figure 5.8: Sketching a 50mm circle on the underside of the part'
  merge: -1
  img_proc: true
- pgno: 132
  md: '7. Use this circle sketch to create a **Extruded Cut** 25mm Deep, Blind. We
    can now see each side has a similar cut in the **Base Flange** section, but that
    the cuts in the **Edge Flange** sections are completely different. The latest
    cut has a square upper edge, whereas the first one is rounded, as we can see in
    Figure 5.9. This further demonstrates why folding and unfolding might be useful:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_132_0.png)


    Figure 5.9: The two different cut types produce different results


    8. Furthermore, if we now flatten the part, as illustrated in Figure 5.10 we can
    see that the first cut (on the unfolded model) is completely circular, whereas
    the second one has two square corners. The first circle would be fairly simple
    to cut using a drill, but the second one would be much harder without a computer-controlled
    machine like a laser cutter. Therefore, the first cut might be more desirable,
    depending exactly on your production processes:


    ![](img/4e9c736de6bac4449096a7b92c28af4c_132_1.png)


    Figure 5.10: The flattened part, with both cuts'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'It''s not necessary to use **Unfold** and **Fold** for all cuts across bends—there
    may be many cases where it''s not needed, but sometimes it can be very useful
    if specific types of cuts are needed.


    In the next section, we will explore how **unfolding** differs from simply **flattening**
    and why this is important.


    # Unfolding versus flattening


    After flattening the part in the previous section using the **Flatten** feature,
    you may be wondering how this differs from unfolding. If we can simply click one
    button to flatten the model, then why would we add the extra steps that the **Unfold**
    tool needs?


    The first, fairly minor reason is that the **Unfold** feature can be used on specific
    bends only, whereas the **Flatten** button applies to the entire model. However,
    the main reason for using the **Unfold** feature is that the **Flatten** feature
    is a special kind of feature, and it is usually the last feature in the FeatureManager
    Design Tree. When **Flatten** is selected, the feature simply unsuppresses (turns
    back on) the `Flat-Pattern` folder at the end of the model. This, in turn, flattens
    the model. When the model is unflattened, the `Flat-Pattern` folder is suppressed
    (turned off) again, and so any features based on the flattened part will also
    be suppressed. To demonstrate this, follow these next steps:


    +   1. Using the model from the previous section, flatten the model (if it is
    not already flattened) by pressing the **Flatten** button. Note that the `Flat-Pattern`
    folder is now unsuppressed.


    +   2. Sketch a 50mm circle on one of the clear edges and make an **Extruded Cut**.
    At this stage, the cut will look very similar to the first cut we made, as illustrated
    in *Figure 5.11*.


    ![](img/4e9c736de6bac4449096a7b92c28af4c_133_0.png)


    Figure 5.11: Adding another circular cut, this time to the flattened part'
  merge: -1
  img_proc: true
- pgno: 134
  md: '3. Now, unflatten the part, by pressing the Flatten button again. Notice that
    the latest cut is now suppressed because it was a Child feature (that is, it was
    based on the flattened part). Any features added to the model in the flattened
    state will automatically be suppressed when the part is unflattened (see Figure
    5.12):


    ![](img/4e9c736de6bac4449096a7b92c28af4c_134_0.png)


    Figure 5.12: Any features created in the flattened model will be suppressed when
    the part is unflattened


    Flatten is only really used at the end of modeling when you''re flattening for
    production or checking that all of your features will work correctly with a flat
    sheet. Ideally, no features should be added after the Flat-Pattern folder, and
    the Unfold/Fold features should be used instead.


    However, there are rare cases where certain items—such as holes, perhaps—might
    be added at the end of the FeatureManager Design Tree, depending on exactly what
    you''re making and your design process.


    Unfold/Fold and Flatten are two distinct features that each have their own uses,
    as described previously.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Summary


    In this chapter, we learned how to use **Swept Flanges** and how these differ
    from **Miter Flanges** because they make mitered cuts in the corners. We also
    looked at the **Fold** and **Unfold** tools, which can be used to unfold bends
    to add cuts and other features.


    In *Chapter 6, Utilizing Gussets, Cross Breaks, and Vents to Add Part Details*,
    we will continue exploring the more advanced tools of SolidWorks Sheet Metal.'
  merge: -1
