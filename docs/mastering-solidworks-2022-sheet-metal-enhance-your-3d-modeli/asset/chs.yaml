  \ Flange/Tab 选项。在这种情况下，正在编辑的草图将自动使用。\n\n8. 输入以下设置（这些将在本章后面详细介绍）：\n\n- Thickness:\
  \ 1mm\n- Bend Allowance: K-Factor, 0.5\n- Auto Relief: Rectangular\n- Ratio:0.5（图\
  \ 1.6 中标记为 iii）\n\n按 OK（图 1.6 中标记为 iv），Base Flange 特征即创建完成。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_28_0.png)\n\
  \n图 1.6：创建 Base Flange 特征\n\nBase Flange 特征现已创建，FeatureManager 设计树左侧会出现 Base-Flange1（注意：您的编号可能不同）（图\
  \ 1.7 中标记为 i）。可以通过左键单击该特征并选择 Edit Feature 以通常的方式编辑和调整该特征。\n\n创建 Base Flange 特征会将整个零件转变为钣金零件，因此会自动在\
  \ FeatureManager 设计树中添加一些额外项目。这些项目表示零件是钣金模型，由以下部分组成：\n\n- Sheet-Metal 文件夹：包含钣金零件的所有全局属性，例如\
  \ Thickness 和 Bend Radius 属性（图 1.7 中标记为 i）。\n\n- Flat-Pattern 文件夹：此文件夹包含零件的展开版本（图\
  \ 1.7 中标记为 iii）。默认情况下，此文件夹将被抑制，因此在此阶段会显示为灰色，但这将在本章后面详细介绍。\n- Cut list 文件夹：此文件夹包含构成零件的所有单独板材。可以将其视为与普通实体建模中使用的\
  \ Solid Bodies 文件夹类似\n\n文件夹名称后的数字表示零件由多少张板组成。例如，由两个单独的本体和盖板组成的零件将在 Cut list 文件夹后显示\
  \ (2)（图 1.7 中标记为 iv）。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_29_0.png)\n\n\
  图 1.7：钣金零件详情\n\nBase Flanges 通常是开始钣金零件的最佳方式，并且通常是钣金零件中创建的第一个特征。它们可以通过绘制封闭轮廓，然后从钣金工具中选择\
  \ Base Flange/Tab 选项来制作。\n\n添加 Base Flange 特征会将零件转变为钣金零件，并会自动添加 Flat-Pattern、Cut\
  \ list 和 Sheet-Metal 文件夹，我们将在下一节中进一步探索这些文件夹。\n\n> **保存零件**\n> 在此阶段，您的当前 *part* 可以保存，因为我们将在整本书中使用此文档。\n\
  > \n> 在 SolidWorks 中工作时，养成定期保存工作的习惯，以防止崩溃和其他问题。\n\n#### 钣金属性\n\n**Sheet Metal**\
  \ 属性是适用于整个 *part* 的全局设置。本节介绍如何调整这些属性以及它们的实际含义。该部分包含一些相当枯燥的背景理论，但它是理解钣金的重要基础。其中一些底层理论在我们稍后实际使用和演示工具时将会变得更加清晰，因此如果某些部分在此阶段仍然有点令人困惑，请不要担心太多。\n\
  \n共有四个钣金属性：\n\n- 1. **Sheet Thickness**\n- 2. **Bend Radius**\n- 3. **Bend Allowance**\n\
  - 4. **Auto Relief**\n\n#### 编辑钣金属性并调整板厚\n\n如前所述，钣金 *parts* 通常由厚度恒定的板材制成。因此，*part*\
  \ 的 **thickness** 是钣金的重要方面。\n\n要编辑 *part* 的 **Sheet Metal** 属性，只需在 FeatureManager\
  \ 设计树中左键或右键单击 Sheet-Metal 文件夹（图 1.7 中标记为 **ii**）并选择 **Edit Feature**。\n\n要设置厚度，调整\
  \ **Thickness** 字段下的值（图 1.8 中标记为 **i**）并按绿色 **OK** 勾号。例如，尝试设置 2mm 厚度并按 **OK**。您现在应该会看到\
  \ **Base Flange** 的厚度已从 1mm 变为 2mm。\n\n\n\n\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_31_0.png)\n\
  \n图 1.8：钣金属性\n\n此 **厚度** 设置在整个 *零件* 中都是全局的，因此添加的任何新特征，例如 **边缘法兰**，也将使用相同的厚度进行制作。编辑\
  \ `Sheet-Metal` 文件夹中的单个值即可非常简单地调整整个 *零件* 以及构成它的所有特征。\n\n#### 编辑弯曲半径\n\n除了厚度之外，钣金\
  \ *零件* 的另一个非常重要的属性是 **弯曲半径**。\n\n每当将一块平坦的金属板弯曲或折叠以创建 3D 零件时，弯曲过程中产生的拐角永远不会完全呈方形。即使使用非常薄且柔韧的材料，例如铝箔，也需要一个很小的弯曲半径。\n\
  \n在 SolidWorks 钣金中也是如此：弯曲半径始终是必需的（图 1.9），即使它很小。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_32_0.png)\n\
  \n图 1.9：始终需要弯曲半径\n\n在 SolidWorks 钣金中，弯曲半径指的是弯曲内部的大小，可在钣金属性中设置。\n\n只需编辑钣金属性并调整值（图\
  \ 1.8 中标记为 ii）。\n\n默认情况下，钣金属性中设置的弯曲半径将应用于添加到零件的任何特征，尽管可以为特定弯曲覆盖弯曲半径，这将在本书后面介绍。\n\
  \n#### 我们应该将弯曲半径设置为多大？\n\n尽管设置弯曲半径值本身很简单，但我们如何知道要使用什么值？弯曲半径取决于多种因素，例如材料类型、制造方法和材料的厚度。一般来说，随着板厚增加，弯曲半径值也会增加。为了形象化这一点，请考虑弯曲一薄片金属箔与弯曲一块厚板的区别——较薄的板可以形成更紧密的弯曲。\n\
  \n钢材弯曲的一般数值可能如下：\n\n| 板厚 | 弯曲半径 |\n|---|---|\n| 1mm | R1.4mm |\n| 2mm | R1.88mm\
  \ |\n| 3mm | R2.75mm |\n| 4mm | R3.0mm |\n| 5mm | R3.6mm |\n\n确定 **弯曲半径** 有多种方法。\n\
  \n- **咨询您的制造商。** 确定 **弯曲半径** 的最可靠方法通常是直接与制作您 *零件* 的人员交谈。告诉他们您计划创建的内容、材料类型和厚度，他们应该能够推荐使用的设置。\n\
  - **在线或参考书籍中搜索。** 尝试搜索诸如 `1mm thick steel bending radius` 之类的短语。结果应能让您对设计开始时合适的数值有一个大致了解，然后可以通过调整钣金属性在后期进行微调。\n\
  - **使用 SolidWorks 规格表。** 规格号是根据重量测量金属板厚度的一种方法。SolidWorks 包含规格表，即内置于 SolidWorks 钣金中的预设尺寸列表。它们可用于查找常见的\
  \ **弯曲半径** 值。\n\n激活 **规格表**：\n\n- I. 在 **钣金** 属性顶部勾选 **Use gauge table** 复选框（*图\
  \ 1.8* 中标记为 iii）。然后可以从下拉列表中选择一个表。\n\n> **注意**\n> SolidWorks 规格表要求计算机上安装 Microsoft\
  \ Excel，否则将无法使用。\n\n- II. 尝试选择诸如 `SAMPLE TABLE - STEEL` 的表（*图 1.10*）。钣金 *零件* 的厚度现在可以使用下拉列表中的规格号设置，而不是具体的厚度值。\n\
  \nIII. 尝试不同尺寸以了解规格号与实际厚度之间的关系：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_34_0.png)\n\
  \n图 1.10：使用规格表\n\n注意\n较高的规格号对应于更薄的板。可以看出图 1.10 中 4 号钢为 5.69mm 厚，而 16 号钢仅为 1.51mm\
  \ 厚。\n\n随着规格号的变化，您会注意到 **弯曲半径** 值也会自动更改以对应新的板尺寸。正如预期的那样，较厚的板需要更高的 **弯曲半径** 值。\n\n\
  > **使用规格号时请谨慎！**\n> 规格号特定于所用材料，因此很容易引起混淆。例如，钢的给定规格号 **不是** 与铝的相同厚度。**16 号** 钢为 1.52mm\
  \ 厚，但 **16 号** 铝仅为 1.29mm 厚。因此，许多国际标准组织建议不要使用规格号，而应使用尺寸指定板厚。\n> \n> 规格表可以很好地指示弯曲半径，但我建议仅将其作为参考，并直接设置和指定板厚。\n\
  \n**弯曲半径** 是 SolidWorks 钣金的一个重要 *方面*，每个弯曲 *零件* 都需要它。它可以在 **钣金** 属性中作为全局值设置，但如果需要，也可以为某些弯曲覆盖。\n\
  \n通过咨询制造商、在线搜索或使用 **规格表** 来了解所需的 **弯曲半径**。然而，如果使用规格号和表格，请务必确保材料选择正确，并在任何图纸上明确标注。明智的做法是仅将规格表作为参考，并另外指定确切的板厚。\n\
  \n#### 理解弯曲补偿\n\n影响模型下一个钣金属性是 **弯曲补偿** 属性（图 1.8 中标记为 *iv*）。这使我们能够在将弯曲 *零件* 展开为平板后准确计算其尺寸。\n\
  \n为了了解 **弯曲补偿** 属性到底是什么以及为什么它很重要，让我们从侧面看一个简单的 *零件*。它由一个 **底板法兰** 和一个 **边缘法兰** 组成，如图\
  \ 1.11 所示。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_36_0.png)\n\n图 1.11：理解弯曲补偿属性\n\
  \n我们可以看到钣金 *零件* 的尺寸将是 **底板法兰** 的长度（图 1.11 中的 A）加上 **边缘法兰** 的长度（图 1.11 中的 B），再加上弯曲区域本身的大小（图\
  \ 1.11 中的 **BA** 或弯曲补偿）。因此，当 *零件* 展平时，我们所需的板材总尺寸将为 **A + B + BA**。\n\n然而，根据弯曲长度（**BA**）的测量位置和方式，我们可能会得到不同的值。例如，如果测量弯曲的内侧，长度可能为\
  \ 5mm，但如果测量弯曲的外侧，则长度会更长——本例中为 15mm，如图 1.12 所示。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_36_1.png)\n\
  \n图 1.12：弯曲的大小取决于具体测量位置\n\n**BA** 的长度由 **钣金** 属性中的 **弯曲补偿** 决定，并且有多种设置 **弯曲补偿**\
  \ 的选项。\n\n这些 **弯曲补偿** 选项为：\n\n- **Bend Table**\n- **K-Factor**\n- **Bend Allowance**\n\
  - **Bend Deduction**\n- **Bend Calculation**\n\n每个选项都会产生略有不同的最终结果，但如果您不确定使用哪个选项，通常最好使用\
  \ **K-Factor** 弯曲补偿。\n\n> **什么是 K-Factor 弯曲补偿？**\n> K-Factor 是计算钣金弯曲所需尺寸的一种方法。每当金属板被弯曲时，弯曲内部总会有一个区域材料被压缩，弯曲外部的另一个区域材料被拉伸。在板材横截面的某个点，压缩和拉伸会完全相互抵消。在此边界上，材料长度不会发生变化。K-Factor\
  \ 是指沿此边界的一条线，在该线上平坦零件和折叠零件之间长度没有变化（图 1.13）。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_37_0.png)\n\
  \n图 1.13：K-Factor 是材料横截面中一条假想线，在该线上弯曲零件与平坦零件之间尺寸没有变化\n\n\n\nK-Factor 是一个比率，因此它始终介于\
  \ 0 和 1 之间。弯曲的内侧 K-Factor 为 0，弯曲的外侧 K-Factor 为 1。因此，弯曲的中间 K-Factor 为 0.5，如图 1.14\
  \ 所示。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_38_0.png)\n\n图 1.14：K-Factor 是一个比率，表示弯曲横截面上的线\n\
  \n##### 我应该使用什么 K-Factor 值？\nK-Factor 取决于多种因素，例如材料和弯曲类型。如果您不确定使用什么值，那么对于大多数零件和材料来说，K-Factor\
  \ 为 0.5 通常是一个不错的估计。\n您也可以尝试询问制造商他们建议您使用什么值。\n\nK-Factor 是计算 **弯曲余量** 的最简单方法，并且如果需要，可以通过编辑\
  \ **Sheet Metal** 属性在以后轻松更改。\n\n#### 其他弯曲余量选项\n\n除了 K-Factor 之外，还有其他几种计算 **弯曲余量**\
  \ 的方法。如果您不熟悉这些方法，则强烈建议您使用 **K-Factor** 选项，如前所述。其他 **弯曲余量** 选项是：\n\n- **弯曲余量**：这允许您具体定义\
  \ **弯曲余量** 的长度。如果制造商给您一个特定的值可以使用，这会很有用。然而，此选项应谨慎使用，因为可以输入任何值。因此，如果使用错误的值，可能会导致 **展开图**\
  \ 零件的尺寸完全错误。\n- **弯曲扣除**：此选项与 **弯曲余量** 选项 somewhat 相似，但它测量折叠 *零件* 的外部长度，然后减去某个值。同样，如果您不熟悉此方法，请谨慎使用，因为使用错误的\
  \ **弯曲扣除** 值可能会导致无法使用结果。\n- **弯曲表**：此选项允许在 Microsoft Excel 中创建弯曲表。此表可以根据确切的弯曲细节，例如半径和角度，指定弯曲余量或扣除值。\n\
  - **弯曲计算**：最后，**弯曲计算** 选项允许使用方程式根据材料厚度、K-Factor 和弯曲半径等因素计算弯曲余量。\n\n**弯曲余量** 选项对于确保您能够使用正确的平板尺寸来制作最终的弯曲零件非常重要。有多种选项可用，但如果您不熟悉\
  \ **弯曲余量**，则建议您只需使用 **K-Factor** 选项。**K-Factor** 值 0.5 可为大多数零件提供良好的估计，而您的制造商应能够根据材料类型和您确切的零件细节为您提供更详细的建议。\n\
  \n#### 自动补口选项\n\n最终的 Sheet Metal 属性是 **自动补口**。这是一种在需要时自动为弯曲添加补口的方法。*图 1.15* 显示了一个简单的\
  \ **底边法兰**，其 **边法兰** 仅沿边缘延伸一部分。为了创建这种特定类型的弯曲，需要 **自动补口** 切口；否则，金属将无法正确弯曲：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_39_0.png)\n\
  \n图 1.15：自动补口切口的示例\n\n并非所有弯曲类型都需要 **自动补口** 切口，并且在需要时会自动添加。但是，补口切口的确切类型是在 **自动补口**\
  \ 选项中指定的。\n\n三种类型是：\n\n- **矩形**：这会产生矩形切口（见图 1.16）。切口的大小由比率数决定，并与板材厚度相关——例如，比率为 0.5\
  \ 且板材厚度为 1mm 时，会产生宽 0.5mm 的补口切口，并延伸 0.5mm 超出弯曲区域。注意：补口比率必须在 0.05 和 2.0 之间。\n- **椭圆形**：这会产生更圆润的切口（见图\
  \ 1.16），并且也使用基于板材厚度的比率，与 **矩形** 选项相同。\n- **撕裂**：此选项基本上撕裂金属，而不提供可见的切口区域。这是能够展平和弯曲零件所需的最小值。\n\
  \n这三种选项在此处全部显示：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_40_0.png)\n\n图 1.16：自动补口示例；从左到右：矩形、椭圆形、撕裂\n\
  \n**自动补口** 切口对于某些弯曲类型是重要要求，但它们会自动添加，因此此选项通常可以设置为比率为 0.5 的 **矩形** 或 **椭圆形**，除非您有特定要求。\n\
  \n#### Sheet Metal 属性回顾\n\n**Sheet Metal** 属性是定义您的 Sheet Metal 零件的重要方式。它们可以通过编辑\
  \ FeatureManager 设计树中的 Sheet-Metal 文件夹来调整。它们通常适用于整个零件，尽管它们可以经常针对特定特征进行覆盖。\n\n四个选项是：\n\
  \n- **厚度**：这决定了用于创建 **底边法兰** 和后续特征的板材厚度。\n- **弯曲半径**：这设置弯曲的内部尺寸。SolidWorks Sheet\
  \ Metal 中弯曲边缘始终需要 **弯曲半径**。\n- **弯曲余量**：这使我们能够准确计算可用于创建弯曲 *零件* 的平板的正确尺寸。计算 **弯曲余量**\
  \ 有多种方法，但如果您不确定，通常最好的选择是 **K-Factor** 值 0.5。\n- **自动补口**：某些弯曲需要补口切口才能正确展平或折叠。如果需要，这些切口将自动添加，但此选项控制切口的大小和类型。\n\
  \n现在我们已经学习了 Sheet Metal 属性和创建 **底边法兰** 的基础知识，我们可以继续探索如何展平 3D *零件*，以及更高级类型的 **底边法兰**。\n\
  \n#### 其他底边法兰选项和展平零件\n\n在上一节中，我们介绍了 **底边法兰**，它们通常是您的 Sheet Metal *零件* 的第一个特征。作为示例，我们绘制了一个简单的矩形，然后用它制作了一个矩形\
  \ **底边法兰**。这种类型的 **底边法兰** 称为 **单闭合** 轮廓，因为它只包含一个单一轮廓，并且该轮廓是闭合的（即，外周没有开口区域或间隙）。这可以在\
  \ *图 1.17* 中看到。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_41_0.png)\n\n图 1.17：单闭合轮廓包含一个单一的闭合轮廓\n\
  \n然而，还有另外两种选项可用于创建不同种类的 **底边法兰**。这些是 **多重包含闭合** 和 **单开口轮廓**。不必太在意记住具体的名称，只要知道如何使用每种类型即可。\n\
  \n#### 多重包含闭合\n\n对于我们之前的 **底边法兰**，我们只使用了一个单一的闭合轮廓，但闭合轮廓也可以在其内部包含 *其他闭合轮廓*。这种类型称为\
  \ **多重包含闭合**，可用于在 **底边法兰** 中添加孔和切口。示例显示在图 1.18 中。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_42_0.png)\n\
  \n图 1.18：多重包含闭合底边法兰可以在一个较大的闭合轮廓内包含较小的闭合轮廓\n\n尽管使用 **多重包含闭合** 选项创建 **底边法兰** 有时可以节省时间，但我个人建议创建非常简单的\
  \ **底边法兰**，然后将额外的切口和孔作为单独的特征添加。这种方法只需使以后在需要时更容易调整或删除额外的细节。\n\n#### 单开口轮廓\n\n除了使用闭合轮廓之外，还可以使用称为\
  \ **单开口轮廓** 的开口轮廓创建 **底边法兰**。这些可以从简单的单线到更复杂的草图实体集合不等。\n\n要创建基本的 **单闭合轮廓底边法兰**：\n\
  \n- 1. 启动一个新的 *零件* 文档并在适当的平面上开始草图，例如 **前视平面**。\n- 2. 绘制 **底边法兰**。将 **单开口轮廓** 选项视为法兰的侧视图或横截面视图可能最容易。对于第一个示例，尝试使用\
  \ **线** 工具绘制一条 100mm 长的单水平线（见 *图 1.19*）。\n- 3. 通过从原点开始并使用 **智能尺寸** 工具设置线的长度来完全定义您的草图。\n\
  \n![](img/4e9c736de6bac4449096a7b92c28af4c_43_0.png)\n\n图 1.19：使用单线草图创建单开口轮廓底边法兰\n\
  \n- 4. 从 **Sheet Metal** 选项卡或工具栏中选择 **底边法兰/搭接** 选项。\n\n\n\n\n\n5. **Base Flange**\
  \ 的宽度可以使用屏幕左侧 **Property Manager** 中的 **Direction 1**（如果需要，还可以使用 **Direction 2**）选项进行设置。**Sheet\
  \ Metal** 属性也可以在此阶段设置（见图 1.20）。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_44_0.png)\n\
  \n图 1.20：创建 Base Flange\n\n6. 按下 **OK** 来创建 **Base Flange**。可以看到，这会创建一个简单的矩形 **Base\
  \ Flange**，类似于第一部分中的 **Single Closed Profile** 示例。\n\n这样，**Single Open Contour Base\
  \ Flange** 可以被视为类似于普通实体建模中的 **Thin Feature Extrude** 选项。\n\n#### 创建更复杂的 Base Flange\
  \ 形状\n\n使用 Single Open Contour 选项的真正优点在于，它允许你在一个特征中轻松创建更复杂、弯曲的形状。\n\n- 1. 开始一个新的零件文档，并在适当的平面上开始草图，例如\
  \ Front Plane。\n- 2. 使用 Line 工具绘制更复杂的形状。图 1.21 中可以看到一个示例 Z 或折弯形状。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_45_0.png)\n\
  \n图 1.21：更复杂的 Single Open Contour 草图\n\n- 3. 从 Sheet Metal 工具中选择 Base Flange/Tab\
  \ 并设置所需选项。示例设置可以是：\n  - Width: 10mm, Direction 1\n  - Thickness: 2mm\n  - Bend Radius:\
  \ 1mm\n\n4. 按下 **OK** 来创建 **Base Flange**（*图 1.22*）。可以看到，尽管底层草图有尖角，实际的 **Base Flange**\
  \ 特征已使用在 **Sheet Metal** 属性中指定的 **Bend Radius** 自动创建了弯曲角：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_46_0.png)\n\
  \n图 1.22：Single Open Contour Base Flange\n\n使用 **Single Open Contours** 来创建 **Base\
  \ Flanges** 可以成为简化生产诸如简单支架等零件的好方法。\n\n请注意，这类草图不仅限于使用直线——如果需要，也可以使用圆弧和样条曲线。\n\n####\
  \ 展平零件\n\n现在我们已经创建了一个带有弯曲的 *part*，我们可以探索如何将 3D Sheet Metal *parts* 展平。展平是 SolidWorks\
  \ Sheet Metal 模块的一项功能，确实为设计流程增加了巨大价值，因为它允许 *parts* 从成品状态准确转换为可从平板材料轻松制作的状态。\n\n\
  要展平 Sheet Metal 零件：\n\n- 1. 在 Sheet Metal 零件内部，从 Sheet Metal 选项卡或工具栏中选择 Flatten\
  \ 选项（图 1.23 中标记为 i）。\n- 2. 零件将被展开为平板。请注意虚线轮廓，它表示展平零件的边界框，以及草图线，它们显示了弯曲线的所在位置（图 1.23\
  \ 中标记为 ii）。\n- 3. 如果你的弯曲线不可见，请尝试进入 View | Hide/Show | Sketches。\n- 4. 还请注意，FeatureManager\
  \ 设计树末尾的 Flat-Pattern 文件夹现在已取消抑制，因此不再变灰（图 1.23 中标记为 iii）。\n\n使用 Flatten 选项本质上是取消抑制（或打开）Flat-Pattern\
  \ 文件夹，从而展平零件。如果展开 Flat-Pattern 文件夹，则可以看到 Flat Pattern 特征，其中包含零件的弯曲细节。\n\n- 5. 要取消展平——或折叠——零件，只需再次单击\
  \ Sheet Metal 选项卡或工具栏上的 Flatten 按钮，或单击图形区域右上角可见的 Flatten 按钮（图 1.23 中标记为 iv）。请注意，零件折叠起来，并且\
  \ Flat-Pattern 文件夹现在再次被抑制（或关闭）。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_47_0.png)\n\
  \n图 1.23：Flatten 选项\n\nFlatten 选项是 SolidWorks Sheet Metal 的一个重要方面，允许零件展开。随着我们阅读本书并学习\
  \ Sheet Metal 工具，我们将在更实际的场景中看到此选项的使用。\n\n#### Base Flange 选项和展平零件的回顾\n\n有三种类型的 Base\
  \ Flange（见图 1.24）：\n\n- 1. **Single Closed Profile**：这是最基本类型的 Base Flange之一，使用一个完全封闭的单一轮廓，例如简单的矩形或正方形。虽然它很简单，但这种类型的\
  \ Base Flange 非常有用，很可能构成 Sheet Metal 零件的大多数 Base Flanges。\n- 2. **Multiple Contained\
  \ Closed**：封闭轮廓也可以包含较小的封闭轮廓，例如切口和孔。虽然这种类型的 Base Flange 在某些情况下可能有用，但通常更好的做法是使用 Single\
  \ Closed Profile 创建简单的 Base Flange，然后将任何额外的孔、切口或细节作为单独的特征添加。这样在后期修改这些特征会容易得多。\n\
  - 3. **Single Open Contour**：Base Flange 也可以使用由线、圆弧和样条等单个草图实体组成的集合创建。这种类型的 Base\
  \ Flange 在创建支架等物品时可能很有用。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_48_0.png)\n\
  \n图 1.24：Base Flange 类型；从左到右：Single Closed Profile、Multiple Contained Closed、Single\
  \ Open Contour\n\n展平是 SolidWorks Sheet Metal 的一个重要方面，带弯曲的零件可以通过从 Sheet Metal 工具中选择\
  \ Flatten 选项轻松展平。这将取消抑制 Flat-Pattern 文件夹并展开零件中的任何弯曲。\n\n到目前为止，本章中我们学习了如何开始 Sheet\
  \ Metal 零件以及如何创建这些零件的大多数第一个特征——Base Flange。我们还研究了如何编辑对这些零件很重要的各种 Sheet Metal 属性。因此，现在我们对如何开始虚拟\
  \ Sheet Metal 零件有了一个合理的概念，我们将简要进入钣金的一个现实世界方面，并查看可用的各种钣金材料。\n\n#### 选择钣金材料时的注意事项\n\
  \n有数十种金属可用于制造钣金零件，这些金属在用途、物理性能、成本和可用性方面各不相同。以下页面将给你一个概念，哪些可能最适合你的项目。\n\n本节并非材料的详尽清单；它只是你可能遇到的一些最常见材料的概述。在这些材料中，还有许多特定的等级（子类型），每种都有略微不同的性能。如有疑问，请与你的钣金制造商和材料供应商讨论你的需求和预算，以找到最适合你需求的选择。\n\
  \n#### 钢和铝\n\n我们周围绝大多数钣金零件都是由钢或铝制成的，其中钢可能是最常见的材料。\n\n#### 钢的优点和缺点\n\n钢是一种出色的通用材料，如果你不确定使用哪种材料，钢通常是一个稳妥的选择。钢之所以如此受欢迎和广泛使用，有很多原因。它非常坚固，易于焊接，并且具有延展性，这意味着与更奇特的金属相比，它更容易弯曲和成形。钢也相当便宜——对于相同重量而言，它的价格可能比铝便宜三倍——并且供应广泛。\n\
  \n材料选择总是有取舍的，因此每种材料都会有缺点。钢的主要缺点之一是它相当重——密度约为铝的二点五倍，具体取决于使用的确切等级。这意味着如果有两个大小和形状完全相同的零件，那么钢零件会比铝零件重得多。\n\
  \n钢还具有较差的耐腐蚀性，这意味着它经常会生锈。你见过生锈的钢制品，例如汽车车身。这种锈是金属与环境中的水和氧气等元素发生反应引起的腐蚀。锈会削弱并最终破坏金属。钢可以经过处理以防止或减缓腐蚀，但这会增加材料成本，而其他一些金属具有更自然的耐腐蚀性。\n\
  \n\n\n\n\n#### 铝的优缺点\n\n铝是钣金中第二常见的材料，被广泛用于自行车车架、飞机零件和饮料罐等各种物品。\n\n铝在航空航天行业如此受欢迎的原因之一是它比钢轻得多。它还具有极佳的天然耐腐蚀性，因此不需要额外的表面处理来防止生锈。铝的另一个优点是其延展性极佳，这意味着它很容易弯曲。想想铝箔有多柔韧，或者饮料罐有多容易被压扁。\n\
  \n不幸的是，这些积极的特性也伴随着缺点，铝比钢贵得多。然而，由于其密度较低，零件可以做得更轻，这在某种程度上抵消了这种成本。另一个因素是，虽然铝比钢轻，但它也更弱，这意味着承受相同载荷的零件在铝中必须做得更厚。然而，由于铝的密度较低，这些零件实际上可能比等效的钢零件更轻。因此，总的来说，根据使用的金属等级，铝通常具有比钢更好的强度重量比（SWR）。\n\
  \n#### 其他常见金属\n\n钢和铝构成了绝大多数钣金零件，但还有一些其他材料相当常见，例如以下几种：\n\n- **铜**：铜常用于电子元件或热交换部件等零件，因为它具有良好的导电性和导热性。\n\
  \n它也很容易弯曲和成型，并且具有良好的耐腐蚀性，因此常用于管道制造管道和装置。铜比钢和铝更贵，而且由于金属价格更高，一些地区存在铜盗窃问题。\n- **黄铜**：这种金属是铜和锌的合金（混合物），外观与铜相似，但外观更明亮、更闪亮。因此，它常用于装饰品，如门环、装置和饰品。\n\
  \n它极具延展性，因此常用于制造铜管乐器中的乐器，如小号。黄铜具有卓越的耐腐蚀性，因此常出现在极端环境中，如船上的门把手。与铜一样，它是一种相当昂贵的金属，因此通常只少量使用。\n\
  - **不锈钢：** 钢可以与铬等其他金属合金化以创建不同等级的不锈钢。这种钢比普通钢具有更高的耐腐蚀性，同时仍保留了大部分强度和其他优点。因此，它常用于制造餐具或手术器械。\n\
  \n不锈钢钣金零件包括大型厨房设备等物品，例如水槽和台面。然而，这种改进的耐腐蚀性使不锈钢比普通钢贵得多。\n\n本概述并非旨在成为金属的完整清单，其他专业材料可能包括锡、金和钛。每种材料都有特定的特性，适用于不同的应用和预算。如前所述，与您的钣金供应商和制造商讨论您的具体需求是明智的，以便为您的项目找到最佳匹配。\n\
  \n钣金材料特性的总结可在下表中看到：\n\n| 材料类型 | 优点 | 缺点 |\n|---|---|---|\n| 钢 | 坚固、便宜、广泛供应；易于加工和焊接\
  \ | 重；耐腐蚀性差 |\n| 铝 | 轻质；良好的 SWR；良好的耐腐蚀性；延展性 | 比钢贵；强度低于钢 |\n| 铜 | 良好的导热和导电性；良好的耐腐蚀性；延展性\
  \ | 昂贵 |\n| 黄铜 | 非常延展；良好的耐腐蚀性 | 昂贵 |\n| 不锈钢 | 与钢相似的优点但具有极佳的耐腐蚀性 | 昂贵 |\n\n#### 钣金厚度和板材尺寸\n\
  \n根据您居住的世界各地，钣金通常按号数或板材的实际厚度出售。如前所述，号数是根据材料重量来衡量钣金厚度的一种方法，通常号数越高，板材越薄。\n\n号数针对每种材料是特定的，因此\
  \ **16 号** 钢的厚度与 **16 号** 铝不同。因此，强烈建议同时以实际厚度指定板材厚度，以避免任何混淆。\n\n金属板材也有各种各样的板材尺寸，公制和英制均有。一些常见尺寸如图\
  \ 1.26 所示，包括 48x120 \" 或 2x1 米（m）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_52_0.png)\n\
  \n图 1.25：常见的金属板材尺寸\n\n在制作非常大的零件或大量小零件时，值得检查您可用的板材尺寸并据此设计。如果制作大量小零件，甚至可以使用第三方“排样”软件将零件以最有效的方式排列在板材上，避免浪费材料。\n\
  \n#### 材料选择回顾\n\n即使在 SolidWorks 中虚拟设计零件，也必须考虑这些零件在现实世界中如何制造，而其中一个重要方面是材料选择。大多数钣金零件由钢或铝制成，但其他常见金属包括铜、黄铜和不锈钢，每种材料都有独特的特性，适用于不同的需求。\n\
  \n板材厚度通常由实际厚度或号数定义。这基于材料的重量，这意味着相同的号数对不同材料给出不同的厚度。板材有各种常见的尺寸，可能会影响零件的设计。\n\n####\
  \ 总结\n\n在本章中，我们介绍了 SolidWorks Sheet Metal 并学习了如何设置 Sheet Metal 工作区并创建 **Base Flanges**。这些通常是\
  \ Sheet Metal *part* 中的第一个特征，我们介绍了三种不同类型：**Single Closed Profile**、**Multiple Contained\
  \ Closed** 和 **Single Open Contour**。\n\n接下来，我们探讨了四个 **Sheet Metal** 属性——**Thickness**、**Bend\
  \ Radius**、**Bend Allowance** 和 **Auto Relief**——以及如何编辑它们以调整整个 *part* 的属性。\n\n最后，我们学习了如何将\
  \ 3D *parts* 展开，这对于它们在现实世界中由金属板材制成至关重要。类似地，我们查看了常见的钣金材料和板材尺寸，以及它们可能与最终设计相关的程度。\n\
  \n在 *第 2 章，使用边缘翻边添加弯曲* 中，我们将开始通过学习如何使用 **Edge Flanges** 为 **Base Flange** 添加更多细节来构建\
  \ 3D 设计。\n"
- '### 2

  使用边缘翻边添加弯曲


  被称为 **Edge Flanges** 的弯曲边缘是 **SolidWorks Sheet Metal** 的主力军，也是为平坦的 **Base Flanges**
  添加 3D 细节最常见的构建块之一。虽然边缘翻边看起来可能非常简单，但它们可用于构建高度复杂的零件。


  在本章中，我们将学习如何添加基本的边缘翻边，然后探索如何编辑和调整它们。我们还将查看一些更高级的选项和细节，可以释放边缘翻边的威力，使您能够在多个边缘上使用它们，以及编辑翻边轮廓等等。


  到本章结束时，您将完全了解边缘翻边以及如何使用它们来构建钣金模型。


  在本章中，我们将涵盖以下主要主题：


  - 使用边缘翻边

  - 边缘翻边：高级选项


  #### 使用边缘翻边


  SolidWorks Sheet Metal 中最基本和最常见的特征之一是边缘翻边。最简单地说，边缘翻边只是在边缘上金属板的弯曲部分。一个非常简单的钣金盒由一个单一的
  Base Flange 和四个附着在其上的 Edge Flanges 组成（如图 2.1 所示，每侧一个）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_56_0.png)


  图 2.1：由一个 Base Flange 和四个 Edge Flanges 组成的一个简单盒子


  单个边缘翻边是非常简单的特征，但组合起来时，它们可用于创建更复杂的零件。


  #### 创建您的第一个边缘翻边


  边缘翻边相对简单易做：


  1. 打开第 1 章《钣金基础 – 探索钣金属性和材料选择》中的 **Base Flange** 零件，或创建一个新的 SolidWorks 零件并制作一个尺寸为
  200 x 300 mm 的 Base Flange（如第 1 章《钣金基础 – 探索钣金属性和材料选择》中所示）。






  2. 材料厚度应为 1 mm，弯曲半径为 1 mm（图 2.2）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_57_0.png)


  图 2.2：创建 200 x 300 mm 底法兰


  3. 要开始添加边缘法兰，请从钣金工具中选择边缘法兰选项（图 2.3）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_57_1.png)


  图 2.3：边缘法兰工具


  4. 选择边缘法兰工具后，将打开边缘法兰属性管理器（图 2.4）并显示多个选项。虽然它们看起来相当复杂，但并非所有选项都对每个法兰都是必需的，我们将在本章中逐步介绍它们。


  最重要的选项是法兰参数、角度和法兰长度


  ![](img/4e9c736de6bac4449096a7b92c28af4c_58_0.png)


  图 2.4：边缘法兰属性管理器


  5. 边缘选择：在实际添加任何法兰之前，我们首先需要决定实际想要放置它们的位置。要选择边缘法兰的边缘，请完成以下步骤：


  - I. 确保已选择边缘选择框（图 2.4，(i)）。选中时该框为蓝色。

  - II. 在模型中左键单击边缘以选择它们。您可能需要放大以选择想要的边缘。

  - III. 尝试通过左键单击选择其中一条短边。您应该会看到边缘法兰的黄色预览，它会跟随鼠标（图 2.5）。可以将其拖动到所需位置，然后单击一次左键即可设置长度（有关法兰长度的更多详细信息，请参阅步骤
  7）。


  IV. 可以通过再次左键单击它们或在边缘选择框中右键单击并选择清除选择或删除来从当前选择中移除边缘。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_59_0.png)


  图 2.5：边缘法兰预览


  6. 弯曲半径：请注意，新的边缘法兰的弯曲半径显示在属性管理器的顶部附近（图 2.4，(ii)）。此弯曲半径（本例中为 1 mm）由我们在编辑钣金文件夹中钣金属性中设置的全局弯曲半径决定。因此，所有边缘法兰将自动使用默认弯曲半径值。


  然而，也可以覆盖单个边缘法兰的默认弯曲半径。要执行此操作，请完成以下步骤：


  - I. 取消选中使用默认半径复选框并设置所需值。

  - II. 尝试调整此弯曲半径值并注意图形区域中黄色预览的弯曲半径也随之变化。

  - III. 要返回到默认弯曲半径值，只需再次在“使用默认半径”复选框中打勾即可。


  7. 弯曲角度：接下来，我们可以设置边缘法兰的弯曲角度（图 2.4，(iii)）。尝试调整角度值，看看黄色预览是否也相应变化。


  8. 也可以将角度设置为相对于某一面为*垂直*或*平行*。要使用此选项，首先在角度值下方的**选择面**框中单击，选择参考面，然后选择**垂直于面**或**平行于面**。


  9. **法兰长度**：边缘法兰的另一个重要方面是其长度（*图 2.4，(iv)*）。这可以设置为盲值（单向拉伸）或使用下拉菜单中的不同端部条件，如果创建更复杂的零件。


  10. 法兰的方向也可以通过单击**长度端部条件**下拉菜单左侧的**反向方向**按钮来翻转。


  11. 尽管法兰长度被设置为尺寸值，但法兰的实际长度取决于我们从何处测量该值。法兰长度有三种测量选项，可在图 2.6 中看到。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_60_0.png)


  图 2.6：法兰长度选项


  不同法兰长度选项的表示可从图 2.6 中按钮上的图标看出。从左到右，选项如下：


  - **外虚拟尖角**：这会从假想线沿边缘法兰的外表面向下绘制并沿固定法兰底部延伸时尖角所在点测量法兰长度（图 2.7 中的左侧示例）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_60_1.png)


  图 2.7：外虚拟尖角和内虚拟尖角示例


  - **内虚拟尖角**：这与第一个选项类似，但它是从尖角所在点到固定法兰内表面测量法兰长度（图 2.7 中的右侧示例）。

  - **切线弯曲**：此选项从与弯曲外侧相切的点测量法兰长度（图 2.8）。此选项仅在弯曲值大于 90° 时有效。否则，根据定义，长度将与外虚拟尖角相同。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_61_0.png)


  图 2.8：90° 弯曲和大于 90° 弯曲的切线弯曲示例


  在实践中，使用哪种法兰选项并不重要，只要使用一致且法兰长度满足设计要求即可。


  12. **法兰位置**：本节的最后一个选项是法兰位置，这里有五个选项（图 2.9）。通常，前三个选择使用更广泛，后两个较少见，但都有其用途。与法兰长度选项一样，按钮上的小图标对每个设置的含义进行了图形化表示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_61_1.png)


  图 2.9：法兰位置选项


  **法兰位置**选项如下：


  - **材料在内**：此选项表示所有边缘法兰材料都将在固定法兰区域内（*图 2.10*）。

  - **材料在外**：此选项将边缘法兰材料置于固定法兰区域之外，然而，可以看到弯曲区域的一部分仍在固定法兰区域内（*图 2.10*）。

  - **弯曲在外**：此选择意味着整个弯曲将在固定法兰之外，有效地使边缘法兰相对于固定法兰略有偏移（*图 2.10*）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_62_0.png)


  图 2.10：法兰位置选项（从左到右：材料在内、材料在外和弯曲在外）


  - **从虚拟尖角弯曲**：第四和第五个选项更专业，在日常建模中使用较少，但仍可能有用。**从虚拟尖角弯曲**选项以固定法兰顶部面与边缘法兰内面之间尖角所在位置为基准进行弯曲。在*图
  2.11*中，我们可以看到两个不同的弯曲角度来演示这一点。请注意，此选项只能与大于 90° 的弯曲尺寸一起使用。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_62_1.png)


  图 2.11：从虚拟尖角弯曲选项，两个不同的弯曲角度


  - **切线于弯曲**：此选项也只能与大于 90° 的弯曲角度一起使用，并且使实际弯曲面与固定法兰侧面相切（图 2.12）。这与**材料在内**选项略有不同，后者使用边缘法兰外侧与固定法兰顶部的虚拟尖角。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_63_0.png)


  图 2.12：切线于弯曲选项（与材料在内选项并列显示）


  - **偏移弯曲**：除**从虚拟尖角弯曲**外的所有弯曲选项都允许弯曲相对于固定法兰偏移。要偏移弯曲，请在**偏移**复选框中放置勾选标记（图 2.9），然后设置**偏移距离**。单击**反向方向**框可翻转偏移方向并从下拉菜单中选择不同的端部条件。


  13. 设置以下参数，然后单击**确定**以添加边缘法兰（图 2.13）：


  - **弯曲半径：**（1 mm）

  - **角度：** 90°

  - **法兰长度：** 50 mm，盲，外虚拟尖角






  - **法兰位置：** 材料在内，无偏移


  ![](img/4e9c736de6bac4449096a7b92c28af4c_64_0.png)


  图 2.13：边缘法兰的示例


  新的边缘法兰功能现在可以在屏幕左侧的 FeatureManager 设计树中看到，并且可以通过单击它并选择 **编辑特征** 以通常的方式进行编辑。


  到目前为止，在本节中，我们学习了如何添加一个非常基本的边缘法兰，并且我们看到边缘法兰最重要的参数是 *边缘选择、弯曲角度、法兰长度* 和 *法兰位置*。


  在下一节中，我们将查看使用边缘法兰的更高级方法，并探索一些详细选项。


  #### 边缘法兰 – 高级选项


  我们之前添加的边缘法兰是在单个边缘上的非常简单的示例，但我们也可以将边缘法兰添加到多个边缘，控制法兰轮廓等等。


  ##### 在同一个边缘法兰特征中添加多个边缘


  不必为每个边缘创建新的边缘法兰——可以在同一个特征中制作多个法兰：


  - 1. 继续使用上一节中的零件（见图 2.13），通过在 FeatureManager 设计树中左键或右键单击 **Edge-Flange** 特征并选择 **Edit
  Feature** 选项来编辑边缘法兰特征。

  - 2. 要添加多个边缘，首先确保已选择 **Edge** 选择框（*图 2.14，(i)*），然后在图形区域中左键单击要添加法兰的边缘。尝试选择基座法兰的两个长边，以及已选择的那个短边（*图
  2.14*）。

  ![](img/4e9c736de6bac4449096a7b92c28af4c_65_0.png)


  图 2.14：添加多个边缘法兰


  - 3. 要取消选择边缘，只需在图形区域中再次左键单击它们，或在 **Edge** 选择框中右键单击它们并单击 **Delete**。

  - 4. 单击 **OK** 确认更改。现在，基座法兰在四面中有三面带有边缘法兰。


  ##### 超过 90 度的边缘法兰会自动修剪


  现在我们有一个具有多个边缘的边缘法兰特征，我们可以查看边缘法兰的一些更多细节：


  - 1. 编辑边缘法兰特征。

  - 2. 将 **Angle** 值从 90° 调整到 120°。这可以通过调整箭头完成，也可以通过直接在 **Flange Angle** 字段中输入数值完成。

  - 3. 请注意，随着弯曲角度增加超过 90°，法兰的相邻边缘会自动修剪回以避免它们碰撞（图 2.15）。

  ![](img/4e9c736de6bac4449096a7b92c28af4c_66_0.png)


  图 2.15：当弯曲角度超过 90° 时，相邻边缘会被修剪掉


  - 4. 单击 OK 将三个法兰的角度值更改为 120°。

  - 5. 现在可以展平零件以更清晰地显示修剪后的边缘。从钣金选项卡或工具栏中选择 Flatten 选项。你会看到展平后的板材（图 2.16）具有非垂直的角，这是由于相邻边缘发生的自动修剪所致。

  ![](img/4e9c736de6bac4449096a7b92c28af4c_66_1.png)


  图 2.16：展平后的零件，显示非垂直的修剪边缘


  - 6. 再次单击 **Flatten** 以重新折叠 **零件**。

  - 7. 再次编辑边缘法兰特征并将 **Angle** 值减小到 60°。请注意，如果弯曲角度小于 90°，相邻边缘仍保持与所选边缘垂直。它们不会扩展以填补法兰之间的间隙（*图
  2.17*）。

  ![](img/4e9c736de6bac4449096a7b92c28af4c_67_0.png)


  图 2.17：如果弯曲角度小于 90°，法兰边缘保持垂直


  因此，在添加多个边缘法兰时，如果弯曲角度超过 90°，则法兰会自动修剪以避免碰撞，但如果弯曲角度小于 90°，则法兰不会延伸以关闭间隙。


  ##### 调整间隙距离


  每当添加多个法兰时，我们可以看到它们在角落处并未连接，并且始终存在一个小间隙。这确保我们可以将这些法兰正确展开到平坦板材。


  当边缘法兰特征具有多个边缘时，另一个选项对我们可用。**Gap distance** 允许我们轻松设置相邻法兰之间的间隙。


  按照以下步骤调整间隙距离：


  - 1. 编辑上一个示例中的边缘法兰特征并将弯曲角度设置为 90°。

  - 2. 间隙距离选项现在可用（图 2.18）。尝试调整间隙大小并注意黄色预览中相邻法兰之间的间隙如何变化。

  ![](img/4e9c736de6bac4449096a7b92c28af4c_68_0.png)


  图 2.18：间隙距离选项


  - 3. 删除所有额外的边缘法兰，使其只剩下一个。请注意间隙距离选项现在变灰；间隙只能在创建多个边缘法兰时指定（否则没有间隙的对象）。

  - 4. 选择第二个边缘并将弯曲角度调整为小于 90°。请注意间隙距离现在再次变灰；对于弯曲角度小于 90° 的边缘法兰之间无法指定间隙距离，因为法兰正在分开，因此间隙大小不能恒定。

  - 5. 将弯曲角度调整到 90° 或以上会再次激活间隙距离选项。


  间隙距离是一个相当简单的选项，如果可以使用则会自动出现。如果弯曲角度小于 90°，则间隙距离会自动变灰且不可用。这是因为如果边缘正在分开，则无法指定恒定间隙。


  ##### 更改法兰轮廓


  到目前为止，我们使用边缘法兰工具创建了矩形法兰，其长度贯穿所选边缘的整个长度。然而，通过调整法兰轮廓，也有可能创建不同形状和长度的法兰：


  - 1. 编辑上一个示例中的边缘法兰特征。仅选择一个边缘并将弯曲角度设置为 90°，然后单击 OK。

  - 2. 要编辑法兰轮廓，首先编辑边缘法兰特征，然后从左侧的属性管理器中选择 Edit Flange Profile。

  - 3. 我们现在正在编辑构成法兰的草图。会弹出一个消息框确认当前草图有效。此框如有需要可以拖动移开。


  草图可以以通常的方式编辑以调整法兰轮廓。例如，尝试从边缘末端向内拖动垂直线（图 2.19）并添加智能尺寸以完全定义草图。注意：从法线方向视图中操作可能更容易。

  ![](img/4e9c736de6bac4449096a7b92c28af4c_69_0.png)


  图 2.19：调整法兰轮廓


  - 4. 对法兰轮廓满意后，单击 **Finish** 接受更改，你会看到法兰现在仅在边缘的特定长度上延伸。

  - 5. 如果无法使用草图创建法兰，则 *步骤 3* 中的弹出消息将显示 **Unable to create the flange from the sketch**。在这种情况下，请确保草图具有完全封闭的轮廓（周界无间隙）并且没有自相交（没有重叠线条）。

  - 6. 编辑边缘法兰轮廓的更快方法是展开 FeatureManager 设计树中的边缘法兰特征，然后编辑 **EdgeBend** 项目上方的草图（*图 2.20*
  – 注意，你的草图编号可能不同）。然后可以按照 *步骤 3* 的方式编辑此草图。

  ![](img/4e9c736de6bac4449096a7b92c28af4c_70_0.png)


  图 2.20：在 FeatureManager 设计树中编辑边缘法兰草图


  - 7. 法兰轮廓草图也可以编辑以更改法兰的形状。对于此示例，法兰的侧面可以是倾斜或弯曲的（*图 2.21*）。要创建倾斜边缘，可能需要删除任何现有的水平或垂直关系。

  ![](img/4e9c736de6bac4449096a7b92c28af4c_70_1.png)


  图 2.21：编辑法兰轮廓






  以这种方式编辑法兰轮廓可以更灵活地使用边法兰，并解锁创建多种不同形状的能力。


  #### 自定义弯曲余量和自定义开槽类型选项


  在 **Edge Flange** 设置中底部属性管理器中还可以找到另外两个次要选项，它们是 **Custom Bend Allowance** 和 **Custom
  Relief Type** 选项（*Figure 2.21*）。这些选项允许覆盖 `Sheet-Metal` 属性文件夹中全局 *part* 设置，以应用于特定特征。它们可以与
  *Chapter 1, Sheet Metal Basics – Exploring Sheet Metal Properties and Material Selection.*
  中所述的 **Sheet-Metal Properties** 特征中的选项完全相同的方式使用。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_71_0.png)


  Figure 2.22: The Custom Bend Allowance and Custom Relief Type options


  这些选项在实践中很少使用，但在需要时可提供一点额外的控制。


  #### Trim side bends 选项


  **Edge Flange** 选项中的最后一个设置是 **Trim side bends** 选项。它会自动修剪两个 Edge Flange 相交处角落的材料，可用于避免相邻弯曲处狭窄角落可能出现的制造问题。


  以下示例最能说明这一点：


  - 1. 删除当前 *part* 中的 Edge Flange 特征，使其仅保留 Base Flange。

  - 2. 在其中一条短边上添加一个新的 Edge Flange 特征。此 Edge Flange 应沿着边的整个长度延伸（只需使用自动选择的默认法兰轮廓）。


  按如下方式设置参数：


  - - **Angle:** 90°

  - - **Flange Length:** 50mm, Outer Virtual Sharp

  - - **Flange Position:** Material Inside


  3. 在 Base Flange 的其中一条长边上添加第二个 Edge Flange 特征，使用与步骤 2 相同的设置。现在你应该有一个带有两个凸起 Edge
  Flange 的 Base Flange（*Figure 2.23*）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_72_0.png)


  4. **Trim side bends** 选项会在两个法兰相交的角落创建自动修剪。尝试编辑第二个 Edge Flange，然后在 **Trim side bends**
  复选框中勾选并单击 OK，以查看两种选项之间的差异 *Figure 2.24*)。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_73_0.png)


  Figure 2.24: A corner with and without the Trim side bends option selected


  - 5. 实际的修剪区域会自动创建，没有子选项；它可以添加也可以不添加。


  Trim side bends 复选框是一个次要选项，但在减少狭窄角落潜在制造问题方面可能很有用。


  #### Summary


  在本章中，我们介绍了 Edge Flanges 的概念，它们是 SolidWorks Sheet Metal 中最常用的特征之一。添加基本 Edge Flange
  后，我们了解了如何通过设置弯曲角度、法兰长度和位置等细节来调整它们。


  之后，我们深入研究了 Edge Flange，并了解了更高级的选项如何通过例如选择多个边和编辑法兰轮廓等操作来释放 Edge Flange 的功能。


  在第 3 章《Getting Familiar with Basic Tools in Sheet Metal》中，我们将继续在此基础上构建知识，并学习更多日常的
  SolidWorks Sheet Metal 工具。

