- '### 9

  使用角部细节完成模型


  SolidWorks Sheet Metal 包含多个 Corner 工具，可用于多种不同的操作，包括封闭法兰之间的角部间隙、添加焊接角、修剪尖锐边缘以及在弯曲区域添加角部减料。


  在本章结束时，你将了解如何使用四种不同的 Corner 工具。


  在本章中，我们将涵盖以下主要主题：


  - 使用 Closed Corners 减小间隙

  - 通过添加 Welded Corners 消除角部间隙

  - 使用 Break-Corner/Corner-Trim 工具去除尖锐角部

  - 使用 Corner Relief 为制造准备模型


  #### 使用 Closed Corners 减小间隙


  Corner 工具是一组四个相似的工具，因为它们都处理角部细节。单独来看，这些工具都比较简单，但它们可以节省时间或在模型中创建特定特征。


  第一个工具是 **Closed Corner**。它可用于减少两个相邻法兰之间可能出现的间隙。


  为了展示 **Closed Corner** 工具的示例，首先我们将创建一个具有一些相邻法兰的简单零件：


  - 1. 开始一个新的 *part* 文档并使用 **Center Rectangle** 工具创建固定在 **Origin** 上的 **Base Flange**，尺寸为
  50×50mm，厚度为 2mm。可使用默认的 **Sheet Metal** 属性。

  - 2. 在任意相邻边缘添加两个 **Edge Flanges**（*Figure 9.1*）。将其高度设为 30mm，角度为 90°。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_178_0.png)


  Figure 9.1: Creating a Base Flange with two adjacent Edge Flanges


  3. 旋转模型并注意我们目前在角部、两个 Edge Flanges 之间存在间隙。从 Sheet Metal 工具中的 Corners 按钮下方的下拉菜单中选择
  Closed Corner 工具。


  4. 首先，我们需要选择要关闭间隙的位置。确保已激活顶部的选择框 – Faces to Extend – 然后选择其中一个 Edge Flange 的端面（Figure
  9.2）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_179_0.png)


  Figure 9.2: Selecting the Faces to Extend


  5. 现在会出现一个预览，显示所选面已被延伸，并且对应的面被延伸了较小的量以减小角部间隙（Figure 9.3）。请注意，第二個面已被自动选为 Face to
  match。必要时也可以手动选择 Faces to match。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_180_0.png)


  Figure 9.3: The Face to Extend is extended and the Face to match is extended by
  a smaller amount


  6. 我们现在可以選擇 Corner Type。尝试依次选择每种类型以查看差异，方法是点击三个按钮中的每一个：


  - **Butt**: 这会稍微延伸每个面，使间隙减小但法兰不会相互重叠（Figure 9.4，左）。**Gap distance** 可使用数值设置。

  - **Overlap**: 这会延伸其中一个法兰使其与对应的法兰重叠（Figure 9.4，中间）。对于此选项，我们可以设置 **Gap distance**
  以及 **Overlap/underlap ratio**。这控制较长法兰重叠较短法兰的程度。值为 1 表示重叠覆盖整个法兰，而值为 0.5（例如）表示重叠将覆盖法兰的一半。

  - **Underlap**: 这与 **Overlap** 选项非常相似，但法兰方向相反（Figure 9.4，右）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_181_0.png)


  Figure 9.4: Corner Type options; from left to right: Butt, Overlap, Underlap


  将 **Corner Type** 设置为 **Overlap**。


  7. 确保已勾选 **Open bend region** 选项。这将在填充间隙时自动修剪角部减料区域。也可以在未选择此选项的情况下创建 Closed Corners（*Figure
  9.5*），但这可能会导致制造复杂性，并且如果 **Gap distance** 太小，有时会导致模型错误。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_182_0.png)


  Figure 9.5: Closed Corner with Open bend region selected (left) and deselected (right)


  8. 按下绿色的 OK 勾选标记以创建 **Closed Corner**。请注意，虽然我们仍然存在一个很小的间隙（由于折弯法兰的钣金特性），但它已大大减小。


  9. 还有另外三个选项可与 **Closed Corner** 工具一起使用。这些选项可通过编辑 **Closed Corner** 特征查看：


  - **Coplanar faces**: 选择此选项意味着 **Closed Corner** 将应用于与所选面 *coplanar*（对齐）的所有面，即使这些共面面未被选中。这在其中一个法兰上有切口将表面分割成较小的部分时很有用（*Figure
  9.6*）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_183_0.png)


  Figure 9.6: Selecting Coplanar faces will apply the Closed Corner to all coplanar
  faces, even if only one is selected


  - **Narrow Corner**: 这可以根据模型的具体几何形状减小弯曲区域周围的间隙距离。然而，它通常只产生很小的影响。

  - **Auto propagation**: 此选项只需在选择 **Faces to Extend** 时自动选择对应的 **Faces to match**。


  当与 **Base Flange** 不成 90° 的法兰一起工作时，**Closed Corner** 尤其有用（*Figure 9.7*）。在这些情况下，间隙距离会沿法兰长度变化，因此使用
  **Closed Corner** 工具可以轻松关闭这些间隙。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_183_1.png)


  Figure 9.7: Using the Closed Corner tool to close gaps between non-perpendicular/parallel
  flanges


  **Closed Corner** 工具是减少相邻法兰之间间隙的好方法，但有时你可能希望完全消除间隙。在下一节中，我们将查看如何使用 **Welded Corners**
  工具来实现这一点。


  #### 通过添加 Welded Corners 消除角部间隙


  **Welded Corners** 工具可以通过焊接角部完全关闭角部间隙。此工具是四个 **Corner Tools** 中最简单的工具，可按如下方式使用：


  - 1. 删除上一节中的 **Closed Corner** 特征，以便我们只剩下一个 **Base Flange**（50x50x2mm）和两个相邻的 **Edge
  Flanges**，高度为 30mm，角度为 90°。

  - 2. 从 **Sheet Metal Corner** 工具中选择 **Welded Corner** 工具。

  - 3. 现在我们只需选择其中一个 **Edge Flange** 的侧面。


  我们将看到 **Welded Corner** 的黄色预览（Figure 9.8）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_184_0.png)


  Figure 9.8: Adding a Welded Corner


  - 4. 默认情况下，**Welded Corner** 将沿所选面全长运行，但如果需要，可以通过在创建 **Welded Corner** *之前* 在法兰侧面上创建一个带有
  *point* 的草图来添加停止点。

  - 5. 可以通过选择 **Add fillet** 选项将焊接区域倒圆。还有将 **Add texture** 添加到焊接区域以及 **Add weld symbol**
  的选项。

  - 6. 按下绿色的 **OK** 勾选标记以创建特征。焊接材料将计入模型的 *mass* 和 *volume*，可使用 **Evaluate** 选项卡上的
  **Mass Properties** 工具显示。**Mass Properties** 工具还包含专门 **Show weld bead mass** 的选项。

  - 7. 请注意，当模型被 **Flattened** 时，**Welded Corners** 将自动被抑制以允许板料正确展开。


  **Welded Corner** 工具是一个非常简单的特征，可用于连接相邻边缘。在下一节中，我们将查看如何使用 **Break-Corner/Corner-Trim**
  工具去除尖锐边缘。


  #### 使用 Break-Corner/Corner-Trim 工具去除尖锐角部


  **Break-Corner/Corner-Trim** 工具与 **Fillet** 和 **Chamfer** 工具非常相似，因为它允许通过倒圆或倒角轻松去除方形角部。这可用于使物品更易于制造，出于结构原因，甚至只是使零件更用户友好，通过去除尖锐角部。


  要使用 **Break-Corner/Corner-Trim** 工具，请执行以下步骤：


  - 1. 继续上一个示例，删除 **Welded Corner** 特征，以便你只剩下一个 **Base Flange**（50x50x2mm）和两个相邻的 **Edge
  Flanges**，高度为 30mm，角度为 90°。

  - 2. 从 **Corner** 工具中选择 **Break-Corner/Corner-Trim** 工具。

  - 3. 首先，我们可以设置一个 **Break Type** – **Filletted** 或 **Chamfered** – 然后设置 **Size**。


  选择 **Fillet** 并将尺寸设置为 5mm。






  4. 我们现在可以选取想要倒角的角。角可以直接左键点击，或者选择整个面，所有相关的角都会被倒角。这样，Break-Corner/Corner-Trim 工具比
  Fillet 或 Chamfer 工具更有用，因为我们不必大幅缩放来选择法兰上非常短的边；我们可以直接选择整个面。


  如 Figure 9.9 所示，选择两个 Edge Flanges 和 Base Flange：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_186_0.png)


  Figure 9.9: Adding the Break Corner feature


  5. 按下绿色的 OK 勾选标记以添加 Break-Corner/Corner-Trim 特性。


  到目前为止，我们只是创建了外部倒角，但该工具也可以用于内部角，如下一节所示。


  #### Using the Break-Corner/Corner-Trim tool with internal corners


  按照以下步骤使用此工具处理内部角：


  - 1. 通过在上表面绘制矩形，然后选择 Base Flange/Tab 工具，为 Base Flange 添加一个 Tab（Figure 9.10）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_187_0.png)


  Figure 9.10: Adding a Tab to the Base Flange


  - 2. 再次选择 Break-Corner/Corner-Trim 工具。


  3. 使用与之前相同的设置（**Fillet**，5mm size），再次选择 **Base Flange** 面。注意只有 *external* 角被选中（Figure
  9.11）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_188_0.png)


  Figure 9.11: Selecting the Base Flange face


  4. 放大并手动选择两个 *internal* 角（Figure 9.12）。创建内部倒角会增加材料，而创建外部倒角会移除材料。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_188_1.png)


  Figure 9.12: Manually selecting internal corners


  5. 按下绿色的 **OK** 勾选标记以添加新的倒角。


  除了在折弯零件上使用 **Break-Corner/Corner-Trim** 工具外，它也可以在展开模型上使用，以便快速一起选择所有角。


  #### Using the Break-Corner/Corner-Trim tool on flattened models


  在许多情况下，你可能会在不添加任何倒角的情况下创建整个 Sheet Metal 模型，但在建模结束时希望全部添加它们，也许是为了便于制造。


  在这些情况下，可以在展开零件后使用 **Break-Corner/Corner-Trim** 工具：


  - 1. 从前一个示例继续，删除任何当前的 **Break-Corner/Corner-Trim** 特性，以便你仅保留 **Base Flange**、**Tab**
  和两个 **Edge Flange** 特性。

  - 2. 通过点击 **Flatten** 按钮展开模型。

  - 3. 现在展开 **Corner** 工具的下拉菜单，你会看到只有一个选项可用，**Corner-Trim**。这与我们在上一节中使用的工具非常相似，但专门用于展开模型。选择
  **Corner-Trim** 工具（Figure 9.13）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_189_0.png)


  Figure 9.13: Using the Corner-Trim tool with a flattened part


  - 4. 我们现在可以添加 **Relief Options** 并添加 **Break Corner Options**。我们将在下一节介绍 **Relief
  Options**，现在仅查看 **Break Corner Options**。


  与之前一样，我们可以设置 **Break type** 和 **Size**。


  设置为 **Filletted**，5mm size。


  - 5. 接下来，选择要倒角的角。使用此工具在展开状态下，我们有两个新选项。点击 **Collect all corners** 按钮将自动选择模型中所有相关的角。我们还可以勾选
  **Internal corners only** 框以仅选择内部角（外部角需要手动选择）。


  点击 **Collect all corners** 以选择模型中的弯折。


  > **Using the Collect all corners Button versus Selecting the Face**

  > 在选择要倒角的角时，我建议使用 **Collect all corners** 按钮，而不是仅选择面。这是因为有时选择面也会错误地选择弯折内的角，而这些角不应该被倒角。


  - 6. 按下绿色的 **OK** 勾选标记以倒角所选角。注意 **Corner-Trim** 特性现在出现在 FeatureManager Design Tree
  中 **Flat-Pattern** 文件夹之后。


  - 7. 通过再次选择 **Flatten** 按钮展开零件。注意倒角在模型中不再出现，并且 **Corner-Trim** 特性被抑制（关闭）。这是因为 **Corner-Trim**
  特性是 **Flat-Pattern** 特性的 *child feature*。因此，如果 **Flat-Pattern** 特性被抑制（例如当模型展开时），则
  **Corner-Trim** 特性也会被抑制。


  以这种方式在展开后使用 **Corner-Trim** 工具是在建模结束时在 **Flat-Pattern** 文件夹之后向模型添加特性的少数情况之一。


  如果需要在未展开状态下对角进行倒角，则可以使用本章前面描述的 **Corner/Corner-Trim** 工具，也可以使用 **Unfold** 特性展开零件，然后手动倒角所有角，然后使用
  **Fold** 特性将零件折回。


  在下一节中，我们将查看最后一个角工具，**Corner Relief**。


  #### Preparing your model for manufacturing using Corner Relief


  **Corner Relief** 工具允许我们在模型中添加角的减力切口。这对于避免在两个或多个弯折相遇的狭窄角处的制造问题很有用。


  该工具可在未展开或展开状态下使用，我们将首先查看未展开版本：


  - 1. 从前一个示例继续，删除任何当前的 **Break-Corner/Corner-Trim** 特性，以便你仅保留 **Base Flange**、**Tab**
  和两个 **Edge Flange** 特性。确保模型处于 Unflattened（即折叠）状态。

  - 2. 从 **Corner** 工具下方的下拉菜单中选择 **Corner Relief** 工具。我们现在可以在 Property Manager 中设置一些选项（*Figure
  9.14*）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_191_0.png)


  - 3. **Scope** 部分仅指示我们正在处理的板件。这通常会自动预填，但如果在多板件零件中工作，则可以选择适当的板件。


  - 4. 接下来，我们需要选择 **2 Bend Corner** 或 **3 Bend Corner**。在我们当前的模型中，我们只有一个 2 Bend Corner。这意味着角有两个彼此相邻的弯折（*Figure
  9.15*）。在下一节中，我们将查看 3 Bend Corners。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_192_0.png)


  Figure 9.15: A 2 Bend Corner


  选择 **2 Bend Corner** 然后在 **Corners** 部分点击 **Collect all corners** 按钮。


  注意 **Define Corner** 框现在已填入来自弯折的两个面。


  5. 我们现在可以设置 **Relief Options**。主要有五个选项，每个选项都会产生略有不同的切口样式。每个版本还具有多个子选项：


  - **Rectangular**: 这将切出一个矩形区域。切口尺寸可以由 **Slot length** 框中的数值决定，也可以勾选 **Ratio to thickness**
  框，根据板厚计算尺寸。


  **Centered on bend lines** 选项使切口相对于弯折线居中，而 **Tangent to bend** 选项使切口与弯折线相切（Figure
  9.16）。


  **Add filleted corners** 按钮仅将减力切口的尖角圆化。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_193_0.png)


  Figure 9.16: The Centered on bend and Tangent to bend options


  - **Circular**: 产生圆形切口。


  - **Tear**: 创建撕裂减力；没有可用的子选项。


  - **Obround**: 这会创建腰形（槽形）切口。


  - **Constant Width**: 这会产生具有恒定宽度的线性和连续切口，且没有子选项。


  尝试不同的 **Corner Relief** 切口类型，以在图形区域的预览中查看它们之间的差异。


  6. 按下绿色的 **OK** 勾选标记以创建 **Corner Relief** 切口。


  除了 2 Bend Corners 外，**Corner Relief** 工具也可以与更不寻常的 3 Bend Corners 一起使用。






  #### 使用 3 个弯角的 Corner Relief 选项


  3 个弯角在钣金模型中相对较少见，但我们现在简要看一下：


  +   1. 在之前的模型基础上，添加两个进一步的边法兰，如图 9.17 所示。这将创建一个 3 个弯角（我们刚刚添加了两个更多的弯角，而第一组边法兰之前已经有一个弯角）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_194_0.png)


  +   2. 我们现在可以使用相同的角工具，因此从 Corners 下拉菜单中选择 Corner Relief 工具。


  +   3. 在 Corner Type 部分，选择 3 Bend Corner。


  +   4. 按下 **Collect all corners** 按钮并注意 3 Bend Corner 被选中，并且所有三个面都被添加到 **Define
  Corner** 部分。

  +   5. 我们现在可以使用 **Relief Options** 部分以与 2 Bend Corners 相同的方式添加角减料切口。


  以这种方式，我们可以使用多个 **Corner Relief** 特性为不同角类型添加减料切口，当模型处于折叠状态时，但我们也可以使用 **Corner Relief**
  工具处理展开的零件。


  #### 向展开模型添加 Corner Relief 切口


  有时你可能希望先完成大部分钣金模型，然后在建模结束时再向整个设计添加减料切口。使用此方法时，将切口应用于展开模型可能更容易：


  +   1. 在大部分建模完成后，通过按下 **Flatten** 按钮展开模型。

  +   2. 点击 **Corner** 工具下方的下拉菜单。选择 **Corner-Trim** 选项——这是展开状态下唯一可用的选项。这是我们在上一节中用于消除尖角的相同工具，但也可以用于添加角减料。

  +   3. 在 **Relief Options** 部分下点击 **Collect all corners** 按钮。注意在展开状态下，我们不需要指定 2
  或 3 个弯角——它们都被同等对待。

  +   4. 设置 **Relief Type** 和 **Size**。这可以是 **Circular**、**Square** 或 **Bend Waist**（图
  9.18）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_195_0.png)


  +   5. 按下绿色的 **OK** 勾选标记以添加减料切口。注意这些减料仅在展开状态下出现。如果模型被展开，则 **Corner Relief** 特性将被抑制。


  以这种方式，减料切口可以一次性全部轻松添加。


  #### 总结


  在本章中，我们查看了四个 **Corner** 工具。第一个 **Closed Corner** 允许我们减少相邻法兰之间的角间隙，而 **Welded Corner**
  工具则可以完全消除这些间隙。**Break-Corner/Corner-Trim** 工具加快了尖角的去除速度，最后一个工具 **Corner Relief**
  添加了可能因制造原因而需要的减料切口。


  在下一章中，我们将探讨如何通过创建和使用 **Forming Tools** 为我们的平板添加 3D 细节。

  '
- '### 10

  使用

  Forming Tools

  向模型添加 3D 细节


  到目前为止，我们已经学习了如何通过使用诸如边法兰等特征向平板添加三维（3D）细节。然而，也可以通过使用 Forming Tools 添加 3D 特征。这些是专门制作的工具，通常用于将形状压入平板。


  本章解释了如何使用 SolidWorks 设计库中现有的 Forming Tools，以及如何修改 Forming Tools 并创建和使用完全定制的 Custom
  Forming Tools。


  在本章中，我们将涵盖以下主要主题：


  +   - 使用 Forming Tools

  +   - 修改现有 Forming Tools

  +   - 创建 Custom Forming Tools


  #### 使用 Forming Tools


  Forming Tools 是形状工具，也称为模具，在高压下压入平板，留下压痕。一些 Forming Tools 甚至可以在板材内创建切口，以及形状压痕。这些形状的例子包括诸如凹坑、百叶窗（形状通风口）甚至徽标和文字等事物。你可以在图
  10.1 中看到一些使用成型工具创建的形状示例：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_198_0.png)


  图 10.1：使用成型工具创建的形状示例


  SolidWorks 设计库包含许多预先制作的 Forming Tools，可以在处理钣金模型时轻松使用。由于这些工具在形状和尺寸方面范围相当有限，它们可能对你的需求没有太大用处，但它们可以被修改；本章后面的部分将展示如何做到这一点，以及如何创建完全定制的
  Custom Forming Tools。


  为了演示 Forming Tools 的使用，我们首先将制作一个简单的钣金零件，如下所示：


  +   1. 启动一个新的零件文档并使用 Center Rectangle 工具创建一个固定在原点且尺寸为 50x50mm、厚度为 1mm 的 Base Flange。可以使用默认的钣金属性。

  +   2. 通过点击屏幕右侧任务窗格中的图标（看起来像一本书）打开设计库，如图 10.2 所示。

  +   如果你看不到任务窗格，则可以通过右键单击命令管理器并确保在 Tools | Task Pane 旁边有复选标记来打开它。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_199_0.png)


  图 10.2：打开设计库选项卡


  3. 在任务窗格中展开设计库文件夹并展开 Forming Tools 文件夹。你现在应该会看到许多不同的 Forming Tool 类型，例如 embosses
  和 ribs。点击 embosses 并注意任务窗格底部将显示各种可用的压花工具。注意：根据你的设置和 SolidWorks 版本，你的设计库可能与图 10.3
  中的外观略有不同。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_200_0.png)


  图 10.3：展开设计库和 Forming Tools 文件夹


  ##### 如果设计库不可见


  如果在任务窗格中看不到设计库，则需要重新链接 SolidWorks 到正确的文件夹。


  这可以通过转到 Tools | Options | System Options | File Locations 来完成。


  然后，在下拉列表中找到 Design Library 并确保你的设计库文件夹的位置出现在 Folders 框中。如果文件夹不在那里，点击 Add 并找到你计算机硬盘上设计库的位置。


  默认情况下，此位置通常为 C:\ProgramData\SolidWorks\SolidWorks 20xx\Design Library。


  （注意 Program Data 文件夹通常是隐藏文件夹，因此你可能需要调整 Windows 资源管理器视图设置以显示隐藏文件夹。）


  然后，按 OK 添加设计库文件夹，它现在应该出现在任务窗格中。


  要使用 Forming Tools，可以通过按住鼠标左键并将所需工具拖到板材面上将其拖入模型。


  +   4. 作为示例，在任务窗格的 forming tools 文件夹中选择 embosses 子文件夹，然后左键单击并将 counter sink emboss
  工具拖到 Base Flange 的顶部面上。


  现在图形区域中应该会出现一个黄色预览，显示将在模型上制作的压痕，如图 10.4 所示：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_201_0.png)


  图 10.4：将 Forming Tool 拖到模型上


  ##### 你是否尝试制作派生零件？


  如果你尝试将工具拖到板材上并收到消息 Are you trying to make a Derived Part?，这只是意味着 SolidWorks 不认识你正在使用
  Forming Tools。为此，请通过选择 Cancel 关闭错误消息框。然后再次打开任务窗格，右键单击 Forming tools 文件夹，并在 Forming
  Tools Folder 选项旁边放置一个复选标记。这将确保 SolidWorks 知道文件夹内的所有零件都应被视为 Forming Tool 零件。


  5. 按下绿色的 OK 勾选标记以插入 counter sink emboss 特性。我们现在应该会看到板材已被选定工具的形状变形，并且在压花区域中央有一个孔，如图
  10.5 所示。如果我们查看设计库中的各种 Forming Tools（图 10.4——右下角），我们可以看到它们是黄色或红色着色的。黄色面表示工具的面将变形（或弯曲）板材，而红色面表示将被切除的材料（有关更多信息，请参阅本章后面
  Creating Custom Forming Tools 部分）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_202_0.png)


  图 10.5：Forming Tool 特性


  我们可以以通常的方式编辑 Forming Tool 特性，或者我们可以展开该特性并编辑特性下方的定位草图，如果我们只是想更改该特性的位置。


  6. 在 FeatureManager 设计树中左键单击 counter sink emboss 特性并选择 Edit Feature。


  Forming Tool 特性类似于 Hole Wizard，因为它包含一个 Type 选项卡，可用于调整实际工具细节，并且还包含一个 Position 选项卡，允许定位一个或多个实例。


  Type 选项卡（图 10.6）提供以下选项：


  +   - Placement Face：这设置了工具将被压入的面。

  +   - Rotation Angle：工具可以在此处旋转到任意角度。它也可以被翻转，允许工具从板材的另一侧压入。






  - **Configurations**：成型工具本身就是独立的 *part* 文件（本章接下来两节会详细介绍），因此可以拥有多个配置。此处可根据需要设置所需的配置。

  - **Link**：此部分允许您保持或断开与 Forming Tool *part* 的链接。如果保持链接且后续更改了 Forming Tool *part*，则此模型中的特征也会随之更改。

  - **Flat Pattern Visibility**：默认情况下，**Forming Tool** 特征不会出现在展开图上；不过，通过选中此复选框可以覆盖该设置。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_203_0.png)


  Figure 10.6: The Forming Tool Type tab


  7. 现在可以使用 **Position** 选项卡来放置工具特征。选择 **Position** 选项卡，光标将变为 **Point** 工具。


  与 **Hole Wizard** 类似，Forming Feature 将放置在放置 *point* 的任何位置。


  **Smart Dimension** 工具也可以用来设置特征的精确位置。


  8. 一旦对特征的位置和类型满意，请按绿色 **OK** 勾选标记以创建它们。


  SolidWorks **Design Library** 中的基本 Forming Tools 很有用，但选择范围相当有限；因此，您很可能需要修改这些工具以满足自己的需求。在下一节中，我们将介绍如何做到这一点。


  #### Modifying existing Forming Tools


  SolidWorks **Toolbox** 和 **Hole Wizard** 特征都包含许多尺寸变化，因此非常有用。相比之下，SolidWorks **Design
  Library** 中提供的 Forming Tools 仅有非常有限的尺寸范围。然而，尽管这些工具的 *size range* 有限，但工具 *types*
  却有相当多。因此，您很可能能找到一个形状或类型的 Forming Tool 与您的需求相似，然后修改其尺寸以完全满足您的要求。


  要修改 Forming Tools：


  1. 启动一个新的 *part* 文档并使用 **Center Rectangle** 工具创建一个固定在原点、尺寸为 50x50mm 且厚度为 1mm 的 **Base
  Flange**。可以使用默认的 Sheet Metal 属性。


  您也可以使用上一节的模型并简单删除 Forming Tool 特征。


  2. 修改 Forming Tools 的第一步是找到一个与您的需求相似的工具。例如，如果您想要一个带切口的挤出法兰，请展开 **extruded flanges**
  部分并找到 **rectangular flange** 工具，如 *Figure 10.7* 所示。请记住，工具中黄色面会使钣金弯曲，而红色面会切除材料：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_205_0.png)


  Figure 10.7: Finding an existing tool that is similar to your requirements


  3. 接下来，我们需要打开工具以便修改它。在任务窗格中右键单击矩形法兰工具的预览图（见 Figure 10.7）并选择 Open。我们现在将被带到该工具的零件文档中。（注意：您可能会收到写入访问警告。可以忽略，因为我们不会覆盖原始零件文件。）零件可以像普通模型一样编辑——例如，可以通过编辑其底层草图或在图形区域中左键单击相应的特征然后双击任意尺寸并更改它来调整拉伸特征的尺寸。


  4. 通过将尺寸从 30x20mm 改为 50x30mm 来调整主矩形区域（Boss-Extrude1 特征）的尺寸，如 Figure 10.8 所示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_206_0.png)


  Figure 10.8: Adjusting the Forming Tool size


  5. 请注意，围绕工具底部的 Fillet 不再完全绕着工具走（Figure 10.9）。此 Fillet 对于确保工具正确工作非常重要（Forming Tools
  上的尖锐边缘可能会导致制造问题）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_206_1.png)


  Figure 10.9: The Fillet around the bottom of the tool is no longer correct


  因此，为确保此 Fillet 正确创建，请将 Base-Extrude 特征的尺寸按我们在步骤 4 中扩展工具形状的相同量进行扩展。


  6. 因此，编辑 Base-Extrude 特征或草图，并在长边上增加 20mm，在短边上增加 10mm，如 Figure 10.10 所示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_207_0.png)


  Figure 10.10: Increasing the base size


  请注意，在增加底座尺寸后，Fillet 现在会正确地沿着下轮廓。


  7. 我们现在可以按如下方式保存零件以供使用：


  I. 选择 File | Save As...


  II. 在对话框的左下角选择 Save as copy and open。


  > Save As Copy

  > 通过将文件另存为副本，我们保留了原始 Forming Tool 零件（矩形法兰工具），并将修改后的版本保存为全新的零件。这意味着使用原始 Forming Tool
  的模型不会受到这些最新更改的影响。


  III. 请注意，**Save as type** 对话框显示为 `Form Tool (*.sldftp)`。这表明文档将保存为特定的 *Form Tool
  Part* 文档。


  IV. 保存位置应默认为 `forming tools` 文件夹中的 `extruded flanges` 子文件夹（与我们开始时使用的原始 **rectangular
  flange** 工具相同的位置）。通过在此文件夹中保存，*Form Tool Part* 将被识别为 Forming Tool 并会出现在 **Design
  Library** 中的 `forming tools` 文件夹中。


  选择 **Save as copy and open**，然后使用新文件名保存修改后的 Forming Tool，例如 `Larger Rectangular
  Flange`。


  8. 通过从 **Window** 菜单中选择它或按 *Ctrl + Tab* 键在打开的文档之间切换，返回到原始文档（**Base Flange** 钣金）。


  9. 展开 **Task Pane** 并注意新的 Forming Tool——**Larger Rectangular Flange**——现在与其它 Forming
  Tools 一起出现，如 *Figure 10.11* 所示。此工具可以像任何其他 Forming Tool 一样拖入模型并使用：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_208_0.png)


  Figure 10.11: The saved Forming Tool now appears with the other tools


  #### If the New Forming Tool Doesn''t Appear


  如果新的 *Form Tool Part* 没有与 **Design Library** 中的其他 Forming Tools 一起出现，那么它可能保存在与其它
  Forming Tools 不同的位置。


  这可以通过打开 *Form Tool Part*（或按 *Ctrl + Tab* 返回到文档，如果您仍将其保持打开）来修复。然后，展开 **Task Pane**
  并选择 **Task Pane** 顶部 (*Figure 10.12*) 的 **Add to Library** 按钮。然后可以将零件添加到 **Design
  Library** 中的适当文件夹中，并像其他 Forming Tools 一样使用。


  **Note:** 如果您使用此方法，则文件需要在添加到 **Design Library** 之前保存。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_209_0.png)


  Figure 10.12: The Add to Library button


  尽管 **Design Library** 中的标准 Forming Tools 在种类上相当有限，但它们可以轻松修改，使您能够根据自己的需求进行调整。在下一节中，我们将进一步探讨通过创建完全
  **Custom Forming Tools** 来实现这一点。


  #### Creating Custom Forming Tools


  修改现有的 Forming Tools 在许多情况下可能是合适的，但有时您可能需要一个完全定制的工具。这可能是例如形状异常的压痕或通风口、产品的操作说明或标记，甚至是您公司的标志。在这些情况下，我们可以创建
  Custom Forming Tools。这些工具在 SolidWorks 中制作相对简单，但请注意，在现实制造中使用 Custom Forming Tools
  可能会增加零件的成本和交货时间。






  要制作一个自定义成型工具，我们首先像普通的 *part* 文档一样创建一个形状，然后将其转换为成型工具并保存为适当的文档类型，具体如下：


  1. 开始一个新的 *part* 文档，并在 **Top Plane** 上绘制一个底座草图。这个底座仅用于帮助工具设置，并在使用前会被从模型中切除，因此确切尺寸并不关键，但它在两个方向上都应始终大于主工具形状。


  在本例中，绘制一个固定在原点的 50x50mm **Center Rectangle**。然后将其拉伸 10mm，如 *Figure 10.13* 所示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_210_0.png)


  Figure 10.13: Extruding a 50x50mm base, fixed to the Origin


  2. 接下来，我们需要为工具创建一个成型形状。这就是工具使用时实际压入金属板材的形状。


  3. 在底座拉伸的上表面上开始一个草图，并使用 **Polygon** 工具绘制一个六边形（六边多边形），其在平边之间的尺寸为 30mm。该六边形应以原点为中心。


  将六边形向上拉伸 10mm，如 *Figure 10.14* 所示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_211_0.png)


  Figure 10.14: Extruding a 30mm hexagon, 10mm high


  4. 通常，在制作成型工具（以及进行钣金加工）时，避免尖锐边缘是可取的。特别是对于成型工具，尖锐边缘可能会导致制造问题。


  因此，使用 **Fillet** 工具首先为六边形的六个直立边缘各添加一个 5mm 的倒角。


  5. 接下来，如 Figure 10.15 所示，为六边形的顶部和底部边缘各添加一个 2mm 的倒角。请注意，创建初始底座使其大于工具形状，现在可以让我们轻松添加下部倒角。如果没有底座，创建下部倒角边缘将困难得多：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_212_0.png)


  Figure 10.15: Adding Fillets to remove sharp edges


  现在我们有了倒角的下边缘，就不再需要初始底座特征，因此我们可以将其切除。


  6. 展开第一个 Boss-Extrude 特征并选择其下的草图。然后，使用该草图创建一个与第一个 Boss-Extrude 特征深度相同的拉伸切除（10mm），完全切除第一个
  Boss-Extrude 特征，如 Figure 10.16 所示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_212_1.png)


  Figure 10.16: Cutting away the initial base, using the first sketch and a Cut Extrude


  我们的工具几何形状现在已完成，但在将其转换为成型工具之前，我们可以添加一个 *Orientation Sketch*。该草图可在 **Flat Pattern**
  版本的模型中使用，也有助于定位 *part*。


  7. 在工具的下表面上开始一个草图。然后，左键单击选择整个面并按下 **Convert Entities** 工具（位于 **Sketch** 选项卡上）。这将把面的轮廓转换为新的草图实体，从而得到工具的轮廓。

  8. 接下来，选择 **Point** 工具并在工具中心（与原点对齐）添加一个 *point*。这可用于帮助定位工具。


  然后，退出草图。


  你可以在 Figure 10.17 中看到工具的轮廓）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_213_0.png)


  Figure 10.17: Adding an Orientation Sketch


  9. 我们现在可以把 *part* 转换为成型工具。

  选择 **Insert | Sheet Metal | Forming Tool**，**Form Tool Property Manager** 将打开。


  10. 选择 **Stopping Face** 字段。


  这是工具在插入时会在板材表面停止的面。换句话说，这是当工具处于最深点时与金属板材共面（对齐）的工具面。Figure 10.18 在另一个工具上展示了此示例：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_214_0.png)


  Figure 10.18: The Stopping Face


  选择工具的下表面（即绘制 Orientation Sketch 的同一面）。请注意它会变为青色。


  11. 接下来，可以设置 **Faces to Remove** 字段。


  此选择是可选的；不必移除任何面，但在此处选择的面会变为红色，并在使用成型工具时被从板材上切除。


  选择工具的上表面，如 Figure 10.19 所示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_215_0.png)


  Figure 10.19: Selecting the upper face as the Face to Remove


  请注意，面也可以被分割成更小的面（通过在要分割的区域上绘制草图实体，例如线条和圆圈，然后使用 Split Line 工具），如果您只想切除平面的某些部分，而不是整个面。


  12. 最后，我们可以通过在 Property Manager 中选择该选项卡，然后从 Orientation Sketch 中选择该点（或原点；两者应在同一位置）来设置插入点字段。


  13. 按下绿色的 OK 勾选标记以创建 Form Tool 特征（Figure 10.20）。请注意，该特征会出现在 FeatureManager 设计树中，图形区域中的工具现在已进行颜色编码。如前所述，黄色表示弯曲面，红色表示将被移除的面，青色（下方）显示停止面：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_216_0.png)


  Figure 10.20: The created Form Tool


  14. 在使用之前，必须保存成型工具。有两种主要方法可以做到这一点，如下所述：


  - Save as a part document: 文档可以保存为标准零件文件（扩展名为 *.SLDPRT）。如果零件保存在成型工具文件夹中，则 SolidWorks
  将将其识别为成型工具，即使它保存为标准零件文件。如果文件保存在其他位置，则 SolidWorks 不会将该零件识别为成型工具。

  - Save as a Forming Tool document: 或者，模型可以保存为特定的成型工具文件（扩展名为 *.SLDFTP）。在这种情况下，文件可以保存在任何位置，SolidWorks
  仍会将其识别为成型工具。


  #### Forming Tool or Part Document?


  成型工具可以保存为两种文件类型中的任何一种，如前所述。两者之间的区别主要在于文件组织。如果您希望将特定项目的全部文件保存在同一位置，那么最好将工具保存为成型工具文档（*.SLDFTP），但如果成型工具是通用工具，将在多个项目中使用，那么您可能更喜欢将其直接保存为普通零件文件到设计库中。


  通过转到 File | Save As.... 来保存工具文件。


  文档类型可以通过在文件名正下方的 Save as type 下拉菜单中进行选择来设置。


  在本例中，将工具保存为标准 SolidWorks 零件，并保存在成型工具文件夹中。（默认位置为 C:\ProgramData\SolidWorks\SolidWorks
  20xx\Design Library\Forming Tools。）


  15. 保存后，在屏幕右侧的任务窗格中打开设计库，并检查您的新工具是否与其它成型工具一起出现。现在它可以像标准成型工具一样被拖入模型并使用。


  如果工具未出现，您可能需要使用 Add to library 按钮将其添加到设计库中，如 Modifying existing forming tools 部分末尾的信息框中所述。


  #### Forming Tool Not Working Correctly?


  如果发现新的成型工具无法正常工作，请尝试检查角落是否已倒圆。尖锐的角有时会导致成型工具出现错误。


  本节展示了如何创建完全自定义的成型工具，而不仅仅是修改现有模型。这极大地扩展了您可以使用压痕和切口的范围。


  #### Summary


  在本章中，我们研究了如何使用 **Design Library** 中的成型工具为钣金模型添加 3D 细节。我们还探讨了如何修改现有工具以满足自己的需求，以及如何创建完全自定义的成型工具。这使得可以使用几乎无限多种成型工具形状和尺寸。


  在下一章中，我们将学习如何使用 **Insert Bends** 工具将现有 3D 模型转换为钣金模型。






  ## Section 3:

  将 3D 零件

  转换为钣金并

  创建钣金外壳


  除了从头创建钣金模型外，我们还可以将现有的 3D 设计转换为钣金模型。本节展示了两种不同的做法，并提供了一个实践示例，将本书中迄今为止学到的许多技能结合起来。


  本节包含以下章节：


  - Chapter 11, Converting to Sheet Metal Using the Insert Bends Tool

  - Chapter 12, Building Sheet Metal Parts Using the Convert to Sheet Metal Tool

  - Chapter 13, Practical Example: The Sheet Metal Enclosure

  '
- '### 11

  使用插入折弯工具将零件转换为钣金


  具有恒定壁厚的 3D 模型（例如 *Shelled* 或 *Thin Feature* 零件），可通过使用 **Insert Bends** 工具转换为钣金 *parts*。本章介绍如何使用此工具创建钣金零件。


  到本章结束时，学习者将能够自信地使用 Insert Bends 工具。


  在本章中，我们将涵盖以下主要主题：


  - 使用 Insert Bends 工具处理 Shelled 零件

  - 使用 Insert Bends 工具处理 Thin Feature 零件


  #### 使用 Insert Bends 工具处理 Shelled 零件


  到目前为止，在本书中，我们已经涵盖了大多数 SolidWorks 钣金工具，并且在几乎所有情况下，我们都使用 Base Flange 功能开始我们的模型。然而，也可以将现有的实体模型转换为钣金模型。这可以通过两种主要方式完成：使用
  Insert Bends 工具或使用 Convert to Sheet Metal 工具。虽然这两种工具相似，但它们确实存在一些重要差异，这些差异将在本章和第
  12 章 Building Sheet Metal Parts Using the Convert to Sheet Metal Tool 中分别进行解释。


  我应该使用 Base Flange 还是将实体模型转换为钣金？

  通常，使用 Base Flange 开始钣金模型是更好的选择，因为如果以后需要更改，它会为您提供灵活性。有时，创建实体模型然后将其转换为钣金似乎会更快，但从长远来看，一旦考虑到任何未来的修改，通常最好从
  Base Flange 开始。


  Insert Bends 和 Convert to Sheet Metal 工具在处理来自不同来源收到的预先存在的模型或您自己之前制作的模型时通常更有用。


  Insert Bends 工具允许我们将实体模型（例如 Shelled 或 Thin Feature 零件）转换为钣金零件。它最适用于具有均匀（即恒定）壁厚的零件。如果您的模型完全是实心的或具有可变壁厚，那么通常最好使用
  Convert to Sheet Metal 工具，该工具在第 12 章 Building Sheet Metal Parts Using the Convert
  to Sheet Metal Tool 中介绍。


  为了演示 Insert Bends 工具的使用，首先，我们将创建一个简单的 Shelled 模型：


  - 1. 启动一个新的零件文档并创建一个每边长 100 mm 的实体立方体。这可以通过在 Top Plane 上绘制 Center Rectangle，然后使用
  Extruded Boss/Base 工具和 Mid Plane End Condition 来实现。


  2. 通过选择 Shell 工具并将上表面选为要删除的面之一来掏空立方体并移除上表面（Figure 11.1）。将壁厚设置为 2mm。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_223_0.png)


  Figure 11.1: Shelling the cube to a wall thickness of 2 mm and removing the upper
  face


  3. 现在，如果我们进入 Section View，我们可以看到立方体在四周都有恒定的 2 mm 壁厚（Figure 11.2）。这使其非常适合通过使用 Insert
  Bends 功能转换为钣金。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_224_0.png)


  Figure 11.2: The cube has a constant wall thickness


  4. 关闭 Section View 并从 Sheet Metal 选项卡或工具栏中选择 Insert Bends 工具。


  Insert Bends Property Manager 出现（Figure 11.3）。我们可以使用它来设置钣金零件的默认参数（例如 Bend Radius
  和 Auto Relief）。请注意，Thickness 设置不可用，因为厚度由实体零件的实际厚度决定。


  将 Bend Radius 设置为 2mm 并保持其他设置作为默认值。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_225_0.png)


  Figure 11.3: The Insert Bends Property Manager


  5. 设置参数后，我们需要选择一个 Fixed Face 或 Edge。这将是不移动的面或边，可以将其视为类似于 Base Flange。


  旋转立方体并选择底面作为 Fixed Face（Figure 11.4）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_226_0.png)


  Figure 11.4: Selecting the underside face as the Fixed Face


  6. 在单击 OK 勾选标记之前，我们必须首先在 Rip Parameters 部分中选择 Edges to Rip。


  要将此 3D 设计转换为平板，我们需要展开立方体的垂直侧面。然而，它们目前是连接在一起的。因此，必须撕开某些边，以便展开立方体的侧面。如果我们把立方体想象成真实的物体（例如，如果它是由纸板制成的），那么在展开侧面之前，我们必须沿着四个垂直边撕开。因此，我们需要在
  Rip Parameters 部分中选择这些边。


  左键单击 Rip Parameters 下方的框以选择 Edges to Rip 框，然后选择立方体的四个垂直边。请注意，每个选定边上都会出现黄色箭头（Figure
  11.5）。这些箭头指示撕裂的方向。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_227_0.png)


  Figure 11.5: Selecting the four vertical edges to rip


  - 7. 我们还可以通过调整 Rip Parameters 部分底部的数值来设置 Rip Gap 距离。将其设置为 0.5mm。


  - 8. 单击绿色 OK 勾选标记以创建 Insert Bends 功能。您可能会收到一条消息，告诉您已为一个或多个折弯制作了 Auto Relief 切割。


  零件现在已转换为钣金零件，并且在 FeatureManager Design Tree 中出现了许多功能（Figure 11.6）。我们还可以看到，之前尖锐的下边缘现在已转换为折弯，并且在下角添加了
  Auto Relief 切割。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_228_0.png)


  Figure 11.6: The Insert Bends features and model


  查看 FeatureManager Design Tree（Figure 11.6 的左侧）向我们展示了刚刚发生的步骤指南。


  首先，我们创建了立方体形状（Boss-Extrude1）并对其进行了 Shell 处理（Shell1）。接下来，Sheet-Metal 文件夹作为 Insert
  Bends 过程的一部分被添加。正如通常一样，此文件夹始终包含此零件的所有钣金参数。随后是 Rip 功能（Rip1），它在立方体的垂直边缘上切出撕裂。Flatten-Bends
  操作（Flatten-Bends1）随后将立方体的侧面折下，而 Process-Bends 操作（Process-Bends1）则将折弯添加到模型中并将侧面折回。最后，添加了
  Flat-Pattern 文件夹，这将允许我们在未来阶段如果需要时展平零件。如果我们展平模型（Figure 11.7），角落中的减力切口将更容易看到。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_229_0.png)


  Figure 11.7: The flattened model, showing the relief cuts in the corners


  Rollback Bar（FeatureManager Design Tree 底部的蓝色水平条）可以通过这些功能向上拖动，让您逐步回溯模型并一次看到这些更改。


  #### 调整撕裂


  使用 Insert Bends 工具时，我们还可以调整撕裂以指定其方向。这可以在最初创建功能时完成，也可以在以后通过编辑 Rip 功能来完成：


  - 1. 确保您的模型处于未展平状态。

  - 2. 在 FeatureManager Design Tree 中左键或右键单击 Rip 功能并选择 Edit Feature。

  - 3. 撕裂方向可以通过选择一条边然后在左侧 Property Manager 中单击 Change Direction 按钮来更改，也可以通过单击 Graphics
  Area 中的黄色箭头来更改（Figure 11.8）。






  Rips 可以在单一方向（左或右）中，也可以同时在 *两个方向*。然而，点击黄色的方向箭头只能反转单向选项。要将撕裂边缘设置为 *两个方向*，必须在 Edges
  to Rip 框中选择它，然后通过点击 **Change Direction** 按钮在三种不同状态之间循环。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_230_0.png)


  Figure 11.8: Adjusting the rip directions


  - 4. Rip Gap 距离也可以在 Property Manager 中调整。

  - 5. 按下绿色的 **OK** 勾选标记以接受任何更改。


  也可以通过选择 **Rip** 工具独立于 Insert Bends 工具使用 Rip 工具。如果你的模型在添加任何弯折之前需要在撕裂后进行进一步操作，这可能会有所帮助。然而，通常最好直接通过仅使用
  Insert Bends 工具将操作结合起来。


  到目前为止，我们已经研究了如何从具有恒定壁厚的 *Shelled* 零件创建钣金模型，但 Insert Bends 工具也可以与 *Thin Feature*
  模型一起使用。


  #### Using the Insert Bends tool with Thin Feature parts


  当使用 SolidWorks 时，Shelled 模型相当常见，然而，你也可能会遇到 *开放* 但并非 *完全平坦* 的模型。这些可能是诸如简单的安装支架之类的物品。在这些情况下，Insert
  Bends 工具仍可用于将这些模型转换为钣金 *零件*：


  - 1. 启动一个新的 SolidWorks 零件文档并在右平面上开始一个草图。

  - 2. 使用 **Line** 工具绘制 *Figure 11.9* 中所示的草图。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_231_0.png)


  Figure 11.9: Sketching an open profile


  3. 使用草图创建 Extruded Boss/Base。这可以是 50 mm 长，具有 Blind End Condition。确保你也选择 Thin Feature
  选项，如果尚未选择（当尝试挤出开放轮廓时应自动选择），然后将厚度设置为 Mid-Plane 且厚 2mm（Figure 11.10）。接下来，点击 OK 勾选标记以创建特征。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_232_0.png)


  Figure 11.10: Extrude the sketch using Thin Feature


  4. 此零件现在可以通过选择 Insert Bends 工具转换为钣金零件。


  5. 如前所述，我们现在需要设置模型的参数并选择一个 Fixed Face 或 Edge。将 Bend Radius 设置为 2 mm 并选择下方的水平面（固定在原点上的那个）作为
  Fixed Face 或 Edge。在这种情况下，我们不需要撕裂任何边缘，因此 Rip Parameters 部分可以忽略。


  6. 按下绿色的 OK 勾选标记以创建特征。现在可以看出模型已转换为钣金零件，并且 Flatten Bends 和 Process Bends 特征已添加到 FeatureManager
  Design Tree 中。请注意，即使我们绘制的轮廓有尖角，这些角也已自动转换为 2 mm 弯折（Figure 11.11），根据我们在步骤 5 中设置 Bend
  Radius 值。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_233_0.png)


  Figure 11.11: The model is converted to a Sheet Metal part


  如果你要实际创建我们在本示例中使用的模型，通常最好使用 Base Flange 和 Edge Flanges。然而，可能存在类似但更复杂的情况，或者你可能收到了来自不同人员甚至不同文件格式的模型。在这些情况下，最好使用
  Insert Bends 工具直接将模型转换为钣金零件。


  #### Summary


  在本章中，我们研究了通过使用 Insert Bends 工具将 3D 模型转换为钣金零件。此工具在处理具有恒定壁厚的实体模型时特别有用，例如 Shelled 零件。它也可以节省时间，如果你已有需要转换为钣金版本的现有模型，或具有简单的
  Thin Feature 模型。


  也可以通过使用专用的 **Convert to Sheet Metal** 工具转换模型，我们将在下一章探讨这一点。

  '
- '### 12

  Building Sheet Metal

  Parts Using the

  Convert to Sheet

  Metal Tool


  **Convert to Sheet Metal** 工具可用于将现有的 Solid 模型转换为钣金 *零件*。当这些模型没有恒定壁厚时尤其有用。该工具功能相当多样，具有许多选项，在此详细解释。


  在本章中我们将涵盖以下主要主题：


  - 使用 **Convert to Sheet Metal** 工具

  - **Convert to Sheet Metal** – Advanced Options

  - Solving conversion issues


  #### Using the Convert to Sheet Metal tool


  **Convert to Sheet Metal** 工具与我们在上一章介绍的 **Insert Bends** 工具相当相似，因为它可用于将预先存在的实体模型转换为钣金模型。它与
  **Insert Bends** 工具的不同之处在于它可用于完全实体的体，而不是具有规则壁厚的体。如果你收到了来自使用不同 CAD 系统的外部客户或合作伙伴的模型，这可以节省大量时间。


  为了演示如何使用该工具，首先，我们将创建一个简单的实体形状：


  - 1. 启动一个新的 SolidWorks *零件* 文档并在前平面上绘制 *Figure 12.1* 中所示的轮廓。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_236_0.png)


  Figure 12.1: Sketch a closed profile


  2. 使用 **Extruded Boss/Base** 和 **Mid Plane** End Condition 将形状挤出 75mm（Figure 12.2）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_237_0.png)


  Figure 12.2: Extrude the sketch


  3. 选择 **Convert to Sheet Metal** 工具。Property Manager 中现在会出现大量选项。


  4. 工作流程与上一章的 Insert Bends 工具相当相似。首先，我们需要设置将用于钣金零件的参数，然后选择一个 Fixed Face（Figure 12.3）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_238_0.png)


  Figure 12.3: Setting the Sheet Metal parameters


  5. 将 Thickness 设置为 2mm（Gauge Tables 也可通过勾选 Use gauge table 框使用）并将 Bend Radius 设置为
  2mm。保持 Reverse thickness 和 Keep body 框未选中。


  6. 接下来，选择 Fixed Entity。这将是模型在展开时不移动的面或边。可以将其视为与普通钣金零件中的 Base Flange 类似。


  7. 旋转模型并选择最低的底部面作为 Fixed Entity（Figure 12.4）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_239_0.png)


  Figure 12.4: Select the Fixed Entity


  8. 接下来，我们必须选择想要添加弯折的边。点击 Bend Edges 选择框，然后选择 Figure 12.5 中显示的两个边。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_239_1.png)


  Figure 12.5: Select the edges to bend


  9. 现在通过按下绿色的 **OK** 勾选标记创建 **Convert to Sheet Metal** 特征。


  10. 我们可以看到实体已转换为厚度为 2mm 的钣金 *零件*，我们在 *步骤 4* 中设置。2mm 弯折已添加到两个选定的边上。此外，请注意与未选中的边相连的所有面都已从模型中移除（*Figure
  12.6*）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_240_0.png)


  Figure 12.6: The converted part


  11. 屏幕左侧的 FeatureManager Design Tree 现在包括 **Sheet-Metal** 和 **Flat-Pattern** 文件夹，表明此
  *零件* 是钣金模型。它还包含 **Convert-Solid** 特征本身。点击 **Convert-Solid** 并选择 **Edit Feature**
  编辑特征。


  12. 我们现在将添加进一步的 Bend Edges 并查看 Rip Edges 如何使用。保留两个现有的 Bend Edges 并添加第三个边，如 Figure
  12.7 所示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_241_0.png)


  Figure 12.7: Select a third Bend Edge


  13. 请注意 Rip Edges 选择框现在已被 Figure 12.7 中以粉红色突出显示的两个边自动填充。此选择是自动的，因为如果我们在所选的三个位置创建弯折，则粉红色边必须被撕裂，否则弯折面将无法平展折叠。






  14. 按下绿色的 **OK** 勾选标记以更新特征，并注意 Sheet Metal 模型现在包含了我们所选的第三个弯折相关的额外面（*Figure 12.8*）。步骤
  10 中的粉红色边缘也已被撕裂，即它们之间有一个小间隙。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_242_0.png)


  Figure 12.8: Update the feature with the third bend


  根据我们选择的 **Bend Edges** 不同，我们可能会创建外观相似但底面图完全不同的 3D 模型。在选择弯折之前，通常值得先思考模型想要实现的目标。


  举例说明：


  - 1. 再次编辑 **Convert Solid** 特征，使我们回到该工具的 Property Manager 中。

  - 2. 清除 **Bend Edges** 选择框中的所有选择，并选择 *Figure 12.9* 中显示的三个边缘。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_243_0.png)


  Figure 12.9: Edit the feature and change the Bend Edges


  3. 按下 OK 以接受更改。我们现在可以看到，尽管这个新形状和图 12.8 中的形状在 3D 中看起来非常相似，但当展开时 Flattened 它们完全不同（图
  12.10）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_244_0.png)


  Figure 12.10: Different Bend Edge selections can give very variable results.


  使用 **Convert to Sheet Metal** 工具时一个最后的重要方面是弯折必须按顺序选择：


  - 1. 再次编辑 **Convert Solid** 特征，使我们回到该工具的 Property Manager 中。

  - 2. 清除 **Bend Edges** 选择框中的所有选择。然后按 *Figure 12.11* 所示的顺序选择五个边缘。如果尝试选择未连接到 Fixed
  Face 的边缘（例如，如果在选择边缘 3 之前尝试选择边缘 4），则会弹出警告；边缘必须按正确顺序选择，以便它们连接到 Fixed Face。

  - 3. 选择边缘 5 后，注意 **Rip Edges** 会自动出现在右上角边缘。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_245_0.png)


  Figure 12.11: Select the five Bend Edges shown


  4. 选择图 12.12 中显示的另外两个边缘，并注意 Rip Edges 会自动应用于形状的大面的四周。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_246_0.png)


  Figure 12.12: Select the final two Bend Edges


  5. 按下绿色的 OK 勾选标记以更新特征，我们现在可以看到整个形状已被转换为 Sheet Metal 零件。这在图 12.13 中以展开和未展开状态显示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_247_0.png)


  Figure 12.13: The completed part


  本节展示了如何使用 Convert to Sheet Metal 工具的基本功能，但还有许多更高级的设置可以用来微调 Sheet Metal 形状。


  #### Convert to Sheet Metal – Advanced Options


  现在我们了解了如何使用 Convert to Sheet Metal 工具，让我们更详细地查看 Reverse Thickness、Keep Body、Manual
  Rip Sketches 和 Corner Defaults 选项。


  #### Reverse Thickness option


  此设置允许反转新创建的板材的方向：


  - 1. 继续上节，重新编辑 Convert Solid 特征，以便我们回到该工具的 Property Manager 中。

  - 2. 我们现在可以在 Sheet Metal Parameters 下看到两个选项 – Reverse thickness 和 Keep body（图 12.14）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_247_1.png)


  Figure 12.14: The Sheet Metal Parameters


  - 3. 在 **Reverse thickness** 框中打勾并仔细观察图形区域中的预览。你应该会看到预览零件的尺寸略微增大，以便新添加的板材位于原始形状的
  *外部*，而不是完全包含在其中。尝试反复切换 **Reverse thickness** 选项以更仔细地观察变化。

  - 4. 选择 **Reverse thickness** 选项（在框中打勾），然后按 **OK** 接受更改。如果我们现在测量 *零件* 的外部尺寸，可以看到它为
  79mm。这是原始形状的尺寸（75mm），加上两侧每个额外的外板厚度（各 2mm）。

  - 5. **Reverse thickness** 选项是一个非常简单的设置，但在模型内部尺寸很重要时可能非常有用。


  #### The Keep body option


  通常当实体体转换为 Sheet Metal 时，原始实体体会被 **Convert to Sheet Metal** 特征消耗掉（用完）。然而，可能存在我们想要保留原始体的情况。例如，我们可能希望重用它来创建另一张板：


  - 1. 继续上小节，重新编辑 **Convert Solid** 特征，以便我们回到该工具的 Property Manager 中。

  - 2. 选择 **Keep body** 选项（*Figure 12.14*）。

  - 3. 按 **OK** 接受更改。我们现在可以看到新的 Sheet Metal 特征已被添加，但原始体仍然保留在模型中（*Figure 12.15*）。如果你仍然选择了
  **Reverse thickness** 选项，那么我们还会看到 Sheet Metal 特征比原始体更大。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_248_0.png)


  我们还可以看到 FeatureManager 设计树中的 Cut list 文件夹（图 12.16）后面现在跟着一个 (2)。这表明当前模型中有两个板或体。展开文件夹可以逐一查看它们，并可以通过选择项目并点击
  Show 或 Hide 来显示或隐藏。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_249_0.png)


  Figure 12.16: The Cut list folder displays sheets and bodies in a model


  - 4. Keep body 选项在你想用单个体创建两个或多个板时尤其有用。

  - 5. 继续上小节，重新编辑 Convert Solid 特征，以便我们回到该工具的 Property Manager 中。


  6. 确保 Keep body 和 Reverse thickness 选项仍然都已选择，但调整 Bend Edges 仅选择图 12.17 中显示的五个边缘。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_250_0.png)


  Figure 12.17: Select the Bend Edges shown


  7. 按 OK 接受更改。现在我们可以看到我们有一个没有顶部和左侧边缘的 Sheet Metal 板，我们还有原始实体体（图 12.18）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_251_0.png)


  Figure 12.18: The sheet and original body


  8. 我们现在可以重用实体体来创建第二张板。再次选择 Convert to Sheet Metal 工具。


  9. 这次选择原始体的上表面作为 Fixed Face，并选择图 12.19 中显示的上边缘作为 Bend Line。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_251_1.png)


  Figure 12.19: Select the upper face and the edge


  10. 取消选择 **Keep body** 选项，因为我们不再需要保留该体。还取消选择 **Reverse thickness** 选项。这意味着这张新板将位于第一张板内部，这是一个很好的例子，说明为什么
  **Reverse thickness** 对于创建正确配合的多板 *零件* 很有用。


  11. 按 **OK** 创建第二张板。*Figure 12.20* 显示了两张板在爆炸视图中的样子，并展示了 **Keep body** 如何与单个实体模型一起使用以创建具有多张板的
  *零件*。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_252_0.png)


  Figure 12.20: The two finished sheets, in an exploded view


  除了创建多板模型外，可能还有一些情况不希望在现有边缘处创建撕裂。在这些情况下，可以使用手动 **Rip Lines**。


  #### Manual Rip Lines


  到目前为止，我们只使用了转换到 Sheet Metal 时自动分配的 Rip Lines。然而，可能有时候我们需要指定面将通过撕裂分开的确切位置：


  - 1. 继续上小节，但删除两个现有的 **Convert Solid** 特征和 **Sheet-Metal folder**，以便我们模型中只剩下第一个 **Boss-Extrude**。

  - 2. 手动 **Rip Lines** 必须在 **Convert to Sheet Metal** 特征 *之前* 绘制。在本例中，我们删除了之前的 **Convert
  to Sheet Metal** 特征，但也可以在模型中将 **Rollback Bar** 拖到 **Convert-Solid** 特征上方并在此阶段添加草图。

  - 3. 现在使用 **Line Tool** 绘制 **Rip Lines**。对于本示例，在形状的大上表面上开始草图，并在长边缘的中点之间直接画一条线（*Figure
  12.21*）。然后退出草图。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_253_0.png)


  Figure 12.21: Sketch the Rip Line






  4. 我们现在可以添加本章前面介绍过的 **Convert to Sheet Metal** 功能。选择 **Convert to Sheet Metal**
  工具，然后选择底面作为 **Fixed Face**，然后选择图 12.22 所示的 **Bend Edges**。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_254_0.png)


  Figure 12.22: Select the Fixed Face and Bend Edges


  5. 请注意，**Rip Edge** 仍然被自动选为右上角边缘。然而，我们可以手动将其更改为我们的 Rip Sketch。要做到这一点，请在 Property
  Manager 中的 **Rip Sketches** 选择框中单击，然后选择我们在步骤 3 中绘制的 Rip Sketch（图 12.23）。


  如果您在 Graphics Area 中选择实际线条时遇到困难，则可以更容易地展开 Graphics Area 左上角的第二个 Design Tree，并在其中选择整个草图。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_255_0.png)


  Figure 12.23: Select the Rip Sketch


  6. 我们现在可以看到，上表面将沿着 Rip Sketch 被撕开，并且右上角边缘不再被选中用于折弯。


  将右上角边缘添加到 Bend Edges。


  7. 按 **OK** 创建该特征并注意 **Rip Line** 位于顶部边缘的中间位置（图 12.24）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_256_0.png)


  Figure 12.24: The finished model with a manual rip


  这种添加手动 Rip Lines 的方法对于精确指定实体零件将如何创建非常有用。还可以更改许多较小的撕裂细节。


  #### Adjusting rip and corner details


  可以在 **Convert-Solid** 特征的 Property Manager 中进一步指定撕裂细节（图 12.25）。在这里，可以更改角部的样式（**Butt**、**Underlap**
  或 **Overlap**），调整 **Gap Distance**，并调整 **Overlap/Underlap Ratios**。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_256_1.png)


  Figure 12.25: Corner Defaults


  也可以通过在 Graphics Area 中选择它们并进行所需的更改来单独调整每个折弯和撕裂的细节。


  使用 **Convert to Sheet Metal** 工具创建钣金模型时，有时会不小心创建出有问题的特征。在下一节中，我们将看一个这样的例子以及如何克服它。


  #### Solving conversion issues


  当从 Base Flange 开始创建标准钣金模型时，通常很难创建具有展平问题的新的凸缘，因为 SolidWorks 通常会自动修剪掉有问题区域。然而，有时将模型转换为钣金时，这些展平问题会无意中发生。我们可以强制
  SolidWorks 创建其中一个问题，作为避免它的示例：


  - 1. 继续上一节的操作，再次编辑 Convert Solid 特征，以便我们回到该工具的 Property Manager 中。

  - 2. 将 Fixed Face 从小的底面更改为大的侧面（图 12.26）。然后移除任何现有的 Bend Edges（这将自动移除任何 Rip Edges，如果没有则手动删除这些），然后仅添加所示的三个
  Bend Edges。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_257_0.png)


  Figure 12.26: Adjust the Convert Solid feature


  - 3. 按 OK 更新特征。


  4. 如果我们现在旋转模型，可以看到在 3D 中一切看起来都正确，没有任何错误可见。然而，如果我们尝试通过按 Flatten 按钮来展平模型，我们现在可以看到其中两个凸缘占据相同的位置（图
  12.27）。


  > Note

  > 根据您的 SolidWorks 版本，您的模型可能无法展平，而是可能显示错误。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_258_0.png)


  Figure 12.27: Two of the flattened flanges occupy the same space


  在现实生活中不可能制造出这种模型（按其当前状态），因为它的两个不同部分不能来自同一块平板。这并不一定意味着整体零件无法制造，只是我们可能需要以稍微不同的方式创建它，也许通过调整折弯的位置。


  #### If Your Model Does Not Flatten


  如果您发现模型无法正确 **Flatten**，请展开 **Flat-Pattern** 文件夹并查找任何错误或警告消息。这将指示哪些特征存在需要修复的问题。如果没有可见错误但模型仍然无法
  **Flatten**，则尝试逐一抑制之前的特征，然后，如果您的模型在缩小到单个问题区域之前无法 **Flatten**。


  SolidWorks 以及 3D CAD 的一个局限性是，有时可以使用计算机创建的模型在现实生活中无法实际制造。在建模时，始终尝试考虑零件的实际制造方式，这可以帮助减少此类问题。


  #### Summary


  在本章中，我们使用 **Convert to Sheet Metal** 工具将 3D 模型转换为钣金 *parts*。我们探索了许多子选项，并简要讨论了可能出现的错误以及如何修复它们。**Convert
  to Sheet Metal** 工具是将预先存在的模型快速更改为钣金格式以节省时间的绝佳选择。


  在下一章中，我们将把我们在前几章中学到的许多技术结合起来，并用它们创建一个钣金外壳。

  '
- "### 13\nPractical Example:\nThe Sheet Metal\nEnclosure\n\n钣金外壳在电子行业很常见。本章展示了如何使用我们学到的各种钣金技术来创建示例外壳，以及在实际建模中提供有用的技巧和窍门。本章将涵盖以下主要主题：\n\
  \n- - Creating the enclosure base\n- - Adding more details to the enclosure\n- -\
  \ Creating an enclosure lid\n- - Adding final details to the enclosure\n\n这些部分将展示如何使用各种钣金工具构建完整的项目。到本章结束时，您将了解\
  \ SolidWorks 钣金如何在真实设计情况下使用。\n\n#### Creating the enclosure base\n\n我们的示例外壳将由两个组件组成——*base*\
  \ 和 *lid*——都在同一个 SolidWorks *part* 文件中制作。这些将作为 *part* 文件中的单独板件制作，从底板开始。\n\n在本章中，给出的说明更像是一个指南而不是硬性参数，因此请随意根据需要尝试不同的尺寸和特征。\n\
  \n要创建底座，请按照以下步骤操作：\n\n- 1. 启动新的 SolidWorks *part* 文档。\n- 2. 首先，我们将绘制 **Base Flange**\
  \ 轮廓。在 Top Plane 上开始一个草图并绘制一个 350x600mm 的矩形，如图 13.1 所示：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_262_0.png)\n\
  \nFigure 13.1 – Sketching a rectangle for the Base Flange profile\n\n**Sketching\
  \ Tip!**\n请记住始终通过使用 Smart Dimensions 和 Relations 完全定义您的草图。\n\n在这种情况下，我建议使用 **Center\
  \ Rectangle** 工具并从 Origin 开始。这将使 Front 和 Right Planes 位于 **Base Flange** 的中心。这对于在\
  \ *assemblies* 中添加 Mates 以及在 *part* 中使用 **Mirror** 特征非常有用。\n\n3. 在矩形草图内，选择 **Base\
  \ Flange/Tab** 选项以创建第一个钣金特征。\n\n在我的示例中，我将 **Sheet Thickness** 属性设置为 2mm，并将 **Bend\
  \ Allowance** 属性设置为 K-Factor 为 0.5。\n\n**Note**\n**Sheet thickness selection**\n\
  钣金零件的厚度取决于您的具体需求以及它们的制造和用途。较薄的板厚会产生更轻（更便宜！）的零件，但如果您创建大型零件，则薄板可能缺乏刚性。\n**Bend Allowance\
  \ selections**\n在 *Chapter 1, Sheet Metal Basics – Exploring Sheet Metal Properties\
  \ and Material Selection* 中，我们详细讨论了不同类型的 Bend Allowance，但如果您不确定使用哪种 Bend Allowance\
  \ 类型，则通常最安全的做法是设置 K-Factor 为 0.5。\n您也可以考虑直接向制造合作伙伴寻求建议。\n\n接下来，我们可以通过添加一些墙壁来构建外壳底座。我们可以使用简单的\
  \ **Edge Flange** 特征，但在我的示例中，我将使用 **Miter Flange** 特征。\n\n**The Advantages of Using\
  \ a Miter Flange Feature**\n**Miter Flange** 特征允许您仅使用一个特征创建更复杂的凸缘形状，而不是使用多个 **Edge\
  \ Flange** 特征来构建相同的轮廓。**Miter Flange** 特征还将自动倒角任何角部（修剪以使其正确配合），而并非所有 **Edge Flange**\
  \ 类型都会执行此操作。\n\n\n\n\n\n4. 在底座法兰的小端面上开始一个草图，并使用直线工具绘制图 13.2 所示的轮廓。垂直线长 75mm，小水平线长\
  \ 10mm：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_264_0.png)\n\n图 13.2 – 绘制斜切法兰轮廓\n\
  \n5. 草图轮廓现在可用于创建法兰。选择斜切法兰工具（在草图内）。然后，选择底座法兰的四个边（图 13.3）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_264_1.png)\n\
  \n图 13.3 – 创建斜切法兰\n\n请注意，法兰的角部已进行斜切，以便正确配合。法兰轮廓的方形角也已使用模型的弯曲半径进行倒圆。\n\n#### 设置或更改弯曲半径\n\
  \n默认弯曲半径适用于板金模型中的所有弯曲（除非对特定特征进行覆盖）。弯曲半径值是在创建第一个板金特征时自动设置的，但可以通过编辑 FeatureManager\
  \ 设计树中的 Sheet 文件夹来调整。\n\n从实际角度来看，弯曲半径取决于多个因素，主要取决于被弯曲的板材厚度（以及材料类型和实际使用的弯曲工艺）。尝试咨询您的制造商或在线搜索典型的弯曲半径值。\n\
  \n- 6. 根据您的偏好设置斜切法兰参数，然后按 OK 创建该特征。\n\n我们现在可以看到，我们仅使用两个特征就创建了一个简单的外壳底座。如果我们使用边法兰，则需要更多特征来构建法兰形状（尤其是如果我们添加了更多悬挑或其他细节）。\n\
  \n- 7. 通过按 Ctrl + S 键、单击保存图标或转到 文件 | 另存为... 来保存您的零件。\n\n#### 在 SolidWorks 中保存\n\n\
  请养成定期保存模型的习惯，因为 SolidWorks 在使用过程中偶尔会崩溃。\n\n我们现在已经创建了一个简单的外壳底座，在下一节中，我们将在此基础上添加更多特征。\n\
  \n#### 为外壳添加更多细节\n\n现在我们有了外壳底座的基本结构，我们可以开始添加一些更多特征来扩展其功能。我们将首先在底座的前面上添加一些圆形切口。这些孔可能是用于\
  \ LED 指示灯、电缆，甚至可能是通风。\n\n在 SolidWorks 板金中，我们可以制作圆形切口主要有三种方法：\n\n- **简单孔**：此工具允许在板材上切割基本圆形。圆的直径使用工具的属性管理器指定，但此工具是三个选项中最不实用的，因为随后需要编辑该特征的草图来指定孔的确切位置。因此，使用另外两个选项之一通常同样快捷。\n\
  - **拉伸切除**：此选项可与 **圆** 工具一起使用来制作圆形孔，但在创建非圆形切口时更有用。这将在本节后面创建矩形开口时详细介绍。\n- **孔向导**：孔向导通常是创建圆形孔的最佳选择，因为它允许从一系列预设尺寸或使用自定义参数指定确切的孔尺寸和类型。然后可以快速添加多个孔，并且在后续阶段对其进行定位和编辑非常容易。\n\
  \n在上述三个选项中，孔向导通常最适合创建圆形孔，而拉伸切除最适合非圆形切口。简单孔是最不实用的选项。\n\n继续使用上一节中的底座外壳模型，我们现在可以使用孔向导切割一些孔，然后在本节后面使用拉伸切除制作矩形切口：\n\
  \n- 1. 选择 **孔向导** 工具。此工具可在 **特征** 选项卡上找到。\n- 2. 首先，设置孔类型和尺寸。有许多选项可供选择，但对于简单的圆形孔，一个不错的选择是\
  \ **孔** 类型（右上角按钮 – 见图 13.4）和 **销孔** 子类型（从下拉菜单中选择）。然后可以从一系列预设尺寸中选择孔直径，或通过在 **显示自定义尺寸**\
  \ 框中打勾然后添加值来输入确切尺寸。\n\n在本例中，我创建了一个直径为 20mm 的孔：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_267_0.png)\n\
  \n图 13.4 – 设置孔类型和尺寸\n\n在此阶段，我们还可以将端部条件设置为盲孔，深度为 10mm。这将防止孔完全穿透外壳的前后两个面。\n\n3. 现在孔的细节已指定，我们可以设置其位置。选择孔向导属性管理器顶部的\
  \ **位置** 选项卡，然后选择将添加孔的面。在我们的示例中，这将是外壳的前面。\n\n光标将变为 **点** 工具，孔将在添加点的任何位置放置。向前面添加两个孔，如图\
  \ 13.5 所示：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_268_0.png)\n\n图 13.5 – 在外壳前表面添加两个直径\
  \ 20mm 的孔\n\n> **使用中心线对齐孔**\n> 使用孔向导（和其他基于草图的特征）时，中心线非常有用。在图 13.5 所示的示例中，在前面垂直边的两个中点之间添加了一条中心线。这样，孔就可以沿着面的垂直中心对齐。\n\
  \n4. 使用智能尺寸、关系和中心线（如果需要）完全定义孔的位置，然后按 **OK** 添加孔。\n\n#### 设计意图：在尺寸标注时，以及将孔放置在边缘和弯曲处附近\n\
  \n在 SolidWorks 中标注尺寸时，始终考虑您的设计意图。例如，在图 13.6 中，考虑我们如何标注这两个孔的尺寸。\n\n如果两个孔都从外壳的左侧边缘标注尺寸（图\
  \ 13.6 – 左），然后更改第一个孔的位置，则第二个孔的位置不受影响。\n\n然而，如果孔相对于彼此标注尺寸（图 13.6 – 右），然后更改第一个孔的位置，则第二个孔也会移动。\n\
  \n您标注特征和草图的确切方式将取决于您的设计要求，但在建模时请记住这一点。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_269_0.png)\n\
  \n图 13.6 – 尺寸标注时的设计意图\n\n5. 在添加了前两个孔之后，我们现在可以创建一个矩形切口。这可能用于容纳诸如 USB 端口之类的东西。在制作这些非圆形形状时，通常最好使用拉伸切除选项。\n\
  \n首先，在前面开始一个草图，然后绘制切口轮廓，如图 13.7 所示。\n\n这是使用 **中心矩形** 和 **草图倒角** 来圆角化角部制作的。再次，中心线对于将草图实体与诸如两个孔之类的其他元素对齐非常有用。\n\
  \n![](img/4e9c736de6bac4449096a7b92c28af4c_270_0.png)\n\n图 13.7 – 在前面绘制切口轮廓\n\n\
  #### 使用外部引用\n\n如果您正在创建使用现有组件的设计，那么创建一个包含所有零件的 SolidWorks 装配体，然后在装配体内编辑新零件会很有用。\n\
  \n例如，如果此外壳设计有一个相关的 PCB 模型，那么我们可以创建一个包含外壳和 PCB 文件的装配体。然后，我们可以在装配体内编辑外壳零件，并使用 PCB\
  \ 零件来对齐任何切口或其他细节。这意味着如果 PCB 零件以后发生变化，则外壳零件将自动更新以匹配这些变化。\n\n\n\n\n\n6. 我们现在可以使用圆角矩形轮廓来创建切口。从草图内部选择\
  \ **Extruded Cut** 工具。\n\n在 Property Manager 中选择 **Link to thickness** 选项。这意味着轮廓将仅穿过所选面进行切割。\n\
  \n7. 按 **OK** 创建切口（图 13.8）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_271_0.png)\n\
  \n图 13.8 – 两个孔旁边的矩形切口\n\n通常在钣金设计中，你会发现相同的特征在整个模型中重复出现。因此，可以使用 **Mirroring** 和 **Patterning**\
  \ 特征来节省时间。\n\n在本例中，我们可以在外壳的另一侧镜像切口。\n\n8. 从 **Features** 选项卡中选择 **Mirror** 工具，然后同时选择\
  \ **Hole Wizard** 特征（两个圆形孔）和 **Extruded Cut**（矩形切口）。**Mirror Plane** 将是模型中央的大平面（应为\
  \ Right Plane）。\n\n按 OK 添加镜像特征（图 13.9）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_272_0.png)\n\
  \n图 13.9 – 镜像切口\n\n- 9. 请注意，如果我们想要沿前表面添加更多间隔开的实例，也可以使用线性阵列。\n\n我们现在已在外壳底座部分添加了一些更多细节，包括圆形和矩形开口。在下一节中，我们将创建盖子，然后返回底座添加一些最终的润饰。\n\
  \n#### Creating an enclosure lid\n\n接下来，我们将在模型上添加一个新的 Base Flange 以创建外壳的盖子。\n这将使模型变成多片零件。\n\
  \n要添加盖子，请按以下步骤操作：\n\n- 1. 首先，我们需要为新的 **Base Flange** 绘制一个轮廓。在现有 **Miter Flange**\
  \ 壁的小上表面上开始草图。然后使用 **Corner Rectangle** 绘制一个矩形，其尺寸略大于现有外壳底座，并在四周都更大一些（图 13.10）：\n\
  \n![](img/4e9c736de6bac4449096a7b92c28af4c_273_0.png)\n\n图 13.10 – 在 Miter Flange\
  \ 壁的小上表面上绘制 Corner Rectangle\n\n- 2. 现在，我们可以使用 Relations 将矩形的各边固定到底座的各边上。此方法比仅使用\
  \ **Center Rectangle** 并通过 Smart Dimension 设置尺寸要稍长一些，但这意味着如果以后底座尺寸发生变化，盖子的尺寸将自动更新以匹配。\n\
  \n依次选择草图矩形的一条边，然后再选择下方底座的对应边（按住 Ctrl 键以选择多个项目。请注意，从俯视图中操作会更容易）。\n\n然后，使两个所选项目 Collinear。可以通过从小弹出菜单中选择\
  \ Make Collinear 来完成，也可以通过左侧 Property Manager 的 Add Relations 部分选择 Collinear：\n\n\
  ![](img/4e9c736de6bac4449096a7b92c28af4c_274_0.png)\n\n图 13.11 – 使草图矩形的各边与现有底座 Collinear\n\
  \n- 3. 对其余三条边继续此过程，以便整个矩形完全定义并与下方的底座部分相链接（图 13.12）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_275_0.png)\n\
  \n图 13.12 – 将矩形草图链接到底座\n\n4. 我们现在可以使用完全定义的矩形来创建盖板。\n\n选择 Base Flange/Tab 工具。然后，在按\
  \ OK 之前，取消选中 Merge Result 框。这意味着新的 Base Flange 将作为零件内的全新板单独创建，而不是与现有底板合并。\n\n你可能还需要翻转新\
  \ Base Flange 的方向，以确保它不会与现有底座特征冲突（图 13.13）。这可以通过单击 Reverse direction 框来完成：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_275_1.png)\n\
  \n![](img/4e9c736de6bac4449096a7b92c28af4c_275_2.png)\n\n图 13.13 – 如有需要，反转盖板法兰的方向\n\
  \n5. 按 OK 创建盖板。我们现在可以看到 FeatureManager 设计树中的 Cut list 文件夹（图 13.14）显示了两个不同的板——一个用于底座，一个用于盖子。如果展开该文件夹，我们可以分别显示或隐藏每个板。\n\
  \n请注意，如果你的 Cut list 文件夹显示为单个板，则尝试编辑最新的 Base Flange/Tab 特征并确保未选中 Merge result 选项：\n\
  \n![](img/4e9c736de6bac4449096a7b92c28af4c_276_0.png)\n\n图 13.14 – Cut list 文件夹，显示两个板\n\
  \n6. 我们现在可以看到基本盖板特征已制作完成，但目前它只是一个单一的平板。根据厚度，该板在受载时可能会弯曲且缺乏刚性。它也可能在底座上表面滑动。为了解决这两个问题，我们可以在盖子上添加一些小的悬垂侧边：\n\
  \n- I. 选择 Edge Flange 工具并用其为短的前缘和两个较长的侧缘添加法兰（图 13.15）。这些法兰可以长 10mm，角度为 90°。\n- II.\
  \ 选择 Material Outside 法兰位置，以确保新的 Edge Flanges 不会与底板重叠：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_277_0.png)\n\
  \n图 13.15 – 在盖子上添加三个 Edge Flanges\n\n7. 按 OK 创建三个 Edge Flanges。请注意，我们没有为后缘添加法兰。这是因为在现实生活中，盖子可以用长钢琴铰链连接到底座（图\
  \ 13.16）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_277_1.png)\n\n图 13.16 – 用于连接盖子和底座的钢琴铰链示例\n\
  \n8. 新 Edge Flanges 的后角仍然是方形的，可能会很锋利，因此使用 Break Corner/Corner Trim 选项将其倒角，使用 5mm\
  \ 圆角将其圆滑（图 13.17）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_278_0.png)\n\n图 13.17\
  \ – 使用 5mm 圆角打断后角\n\n现在，我们有一个相当简单的底座和盖子，但如果仔细观察两块板如何配合，我们可能会发现一个问题。盖子目前正好落在底座上，没有间隙（图\
  \ 13.18）。它们大小相同：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_278_1.png)\n\n图 13.18\
  \ – 盖子和底座之间没有间隙\n\n这可能会导致问题，因为在现实生活中，零件永远不会与 SolidWorks 中的模型完全相同大小。它们由于制造限制总是会略大或略小。设计零件尺寸与制造零件尺寸之间的这种差异称为\
  \ **tolerance**。\n\n例如，一个 *10mm* 长的零件可能被指定为 *10.0±1mm*。这将使实际零件的尺寸在 *9.0mm* 到 *11.0mm*\
  \ 之间。\n\n公差可以减小（尽管更紧的公差会导致制造成本增加），但永远无法完全消除。因此，我们始终应在应配合在一起的两个零件之间设计间隙（除非我们希望设计中采用极其紧密的过盈配合）。\n\
  \n对于我们的示例，这意味着我们应在盖板和底板之间留出间隙。这意味着如果盖子制造低于公差（比 SolidWorks 模型略小）而底座制造略高于公差（比 SolidWorks\
  \ 模型稍大），则两块板仍能配合。\n\n要添加此间隙，我们只需编辑 **Edge Flanges** 并将其向外移动：\n\n- 1. 编辑 **Edge Flange**\
  \ 特征并从 **Flange Position** 部分选择 **Offset** 选项。确切的间隙量取决于公差——由你的预算、制造工艺和设计要求决定——但在本例中，输入\
  \ 0.5mm 的值（*图 13.19*）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_279_0.png)\n\n\
  图 13.19 – 在盖子上偏移 Edge Flanges\n\n\n\n\n\n2. 为了完成盖子，我们现在还将在盖子内侧添加一个 Hem。这将防止用户接触到盖子法兰的锋利下边缘。\n\
  \n选择 Hem 工具，然后为三个 Edge Flanges 的内侧边缘添加一个封闭 Hem，长度为 5mm（图 13.20）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_280_0.png)\n\
  \n图 13.20 – 为盖子上的三个 Edge Flanges 添加 Hems\n\n3. Hem 增加的额外厚度现在会导致盖子与底座发生碰撞（这可以使用 Interference\
  \ Detection 工具进行检查 – 请参阅以下注释）。为了解决这个问题，重新编辑 Edge Flanges 并将 Offset 值增加到 2.6mm，以考虑\
  \ Hem 翻折材料的额外厚度。\n\n#### Interference Detection Tool\n\nInterference Detection 工具位于\
  \ Evaluate 选项卡上，是 SolidWorks 的一个非常有用的功能。它可以在零件和装配体中用于检查模型是否有任何相互碰撞的区域。\n\n要使用它，请选择该工具，然后选择所需的主体、板或零件，并按\
  \ Calculate。不同区域之间的任何干涉都将以红色显示。\n\n4. 对盖子进行最后检查可能会发现 Hem 角发生碰撞（这取决于你的 Edge Flange\
  \ Gap 设置）。\n\n如果你发现这些区域确实相互碰撞（图 13.21），则编辑 Edge Flange 特性并增加 Gap 距离。\n\n在我这里，**3mm**\
  \ 的间隙就足够了。注意，这些碰撞可能不会被 **Interference Detection** 工具检测到，因为它们是在单个板内，而不是在不同的板、主体或\
  \ *零件* 之间：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_281_0.png)\n\n图 13.21 – 增加\
  \ Edge Flange Gap 距离以避免 Hem 角碰撞\n\n盖子板现在已完成，如果需要，我们可以使用 **Flatten** 工具将其展平以检查一切是否正确。\n\
  \n**Flattening Sheets in Multi-Sheet Models**\n使用 **Flatten** 工具检查模型时，每次只能展平一张板。\n\
  \n要选择应展平的板，首先展开 FeatureManager 设计树末端的 **Flat-pattern** 文件夹。每个板在模型中都有一个 **Flat-Pattern**\
  \ 特性。选择所需的板，然后单击 **Flatten**。所选板将被展平，所有其他板将从视图中消失。\n\n再次按下 **Flatten** 按钮以取消展平板，模型的其余部分将重新出现。\n\
  \n我们现在已经创建了一个简单的外壳底座和相应的盖子。在下一节中，我们将对外壳进行一些最后的润饰。\n\n#### Adding final details to\
  \ the enclosure\n\n现在我们有了基本的外壳设计，我们可以通过在后部添加一些通风口，并使用 Forming Tools 在正面添加一些手柄来完成它。这个外壳是一个相当简单的示例，但它展示了可以通过使用简单步骤来构建更复杂设计的流程。\n\
  \n首先，我们将使用 Vent 工具在外壳的后部添加一些通风口。我们也可以手动切割这些通风口，但 Vent 工具加快了这一过程：\n\n- 1. 所有 Vent\
  \ 都需要一个 Vent 布局的草图，因此在外壳的后部开始一个草图并绘制图 13.22 所示的轮廓。\n- 2. 使用了一条中心线来找到后部的垂直中点，然后使用\
  \ Circle 工具和 Offset Entities 添加了三个圆。Line 工具和 Circular Sketch Pattern 工具用于添加五个 Ribs。\n\
  \n外圆直径为 40mm，两个较小的圆各自向内偏移 8mm。圆心距 Origin 为 140mm，Origin 位于后部的中心：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_282_0.png)\n\
  \n图 13.22 – 在后部绘制 Vent 细节草图\n\n#### Creating Features Close to Sheet Edges and Bends\n\
  \n请注意，一些制造商可能对切口和其他特征可以靠近板边缘和弯曲处的距离有限制。如果你的特征距离边缘或弯曲处在 10mm（约 0.40\"）以内，最好与制造商核实生产限制。\n\
  \n3. 我们现在可以开始创建 Vent 特性。选择 Vent 工具并使用草图填充 Property Manager 中的字段。我使用了以下参数（图 13.23）：\n\
  \n- **Boundary**：选择外侧（40mm）圆。\n- **Ribs**：选择五条直线。肋条厚度为 2mm。\n- **Spars**：选择中间（32mm）圆。桁条厚度为\
  \ 2mm。\n- **Fill In Area**：选择最小（24mm）圆。\n- **Set a 2mm radius**：这将使通风口的所有尖锐内部角倒圆：\n\
  \n![](img/4e9c736de6bac4449096a7b92c28af4c_283_0.png)\n\n图 13.23 – 创建 Vent\n\n-\
  \ 4. 按 **OK** 创建 **Vent**。即使我们只制作了一个通风口，我们现在也可以通过对其进行图案化来添加更多通风口。\n\n- 5. 选择 **Linear\
  \ Pattern**（来自 **Features** 选项卡）。\n\n使用我们刚刚创建的 **Vent** 特性并设置间距值为 70mm，实例数为五，并选择后部顶部或底部边缘之一作为图案方向（*图\
  \ 13.24*）。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_284_0.png)\n\n图 13.24 – 使用\
  \ Linear Pattern 对 Vent 进行图案化\n\n- 6. 最后，我们可以添加一些成形手柄来完成设计。\n\n打开屏幕右侧的 **Design\
  \ Library** 面板并导航到 `forming tools` 文件夹。然后，找到 `louvers` 子文件夹。该文件夹应包含一个百叶窗 Forming\
  \ Tool（*图 13.25*）。\n\n> **Note**\n> \n> 如果你无法找到百叶窗工具，则可以创建自定义成形工具，如 *第 10 章《使用 Forming\
  \ Tools 为模型添加 3D 细节》中所述*：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_285_0.png)\n\
  \n图 13.25 – 查找百叶窗 Forming Tool\n\n左键单击并将百叶窗 Forming Tool 拖动到底座的前表面，以将成形百叶窗形状添加到该表面。\n\
  \n- 7. 使用 Forming Tool Property Manager 中的 Positions 选项卡精确放置 Forming Tool（图 13.26）。你可能需要使用\
  \ Point 工具在工具应放置的位置放置一个点：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_285_1.png)\n\
  \n图 13.26 – 定位成形手柄\n\n8. 按 **OK** 添加成形手柄特性。\n\n9. 我们现在可以看到圆形孔和成形手柄靠得太近。编辑 **Hole\
  \ Wizard** 特性并将两个孔移离外壳边缘（图 13.27）。矩形切口的位置也应自动移动，因为其位置是相对于两个圆形孔定义的：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_286_0.png)\n\
  \n图 13.27 – 调整两个圆形孔（以及相关的矩形切口）的位置\n\n10. 剩下的就是在正面另一侧添加第二个成形手柄。选择 **Mirror** 工具（来自\
  \ **Features** 选项卡），然后将 Right Plane 设置为 **Mirror Face/Plane**，将百叶窗特性设置为 **Features\
  \ to mirror**（图 13.28）。按 **OK** 添加第二个手柄。\n\n这两个百叶窗现在可以用作从服务器机柜中拉出托盘的手柄：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_287_0.png)\n\
  \n图 13.28 – 镜像成形手柄\n\n这就是我们完成的钣金外壳的样子：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_287_1.png)\n\
  \n图 13.29 – 完成的钣金外壳\n\n恭喜 – 我们的钣金外壳设计现已完成（图 13.29）！虽然这是一个相当简单的设计，但它展示了我们如何使用多种不同的特性来构建模型。这些单独的元素并不复杂，但合在一起时，可以组合起来创建更高级的设计。\n\
  \n#### Summary\n\n在本章中，我们结合了书中学习到的各种技术来创建一个钣金外壳。底座使用 **Base Flange**、**Miter Flange**\
  \ 和各种切口、**Vents** 和 **Formed Tools** 制作。\n\n盖子由另一个简单的 **Base Flange** 构建，带有 **Edge\
  \ Flange** 侧面和 **Hems** 使其更易于用户使用。\n\n该设计使用了许多钣金工具和特性，但你可以用整个 SolidWorks 钣金套件创建的设计范围仅受你的想象力和设计要求限制。\n\
  \n与 SolidWorks 的大多数元素一样，掌握钣金的关键是尽可能多地练习这些技术。尝试在日常生活中寻找钣金产品，然后思考你如何在 SolidWorks 中建模它们。\n\
  \n钣金是标准 SolidWorks 工具集的一个很好的补充，可以将你的建模技能提升到下一个水平。\n\n\n\n\n"
