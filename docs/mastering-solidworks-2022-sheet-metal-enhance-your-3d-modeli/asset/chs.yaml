  \n图 6.6：钣金加强筋的尺寸部分\n\n11. 将底部 **展开图可见性** 选项保持未选中状态，然后按绿色 **确定** 勾号创建此特征。\n\n我们的\
  \ **加强筋** 现在出现在模型中，也出现在特征管理器设计树中。它可以用通常的方式编辑，或者可以通过在设计树中展开特征并编辑其下方的草图来编辑 **加强筋**\
  \ 的轮廓。\n\n#### 展开加强筋特征\n\n默认情况下，加强筋不会显示在展开的 *零件* 中。这是因为它们通常作为使用专用工具的单独工序添加。如果我们想在\
  \ **展开图** 中显示加强筋，则需要覆盖默认设置：\n\n- 1. 单击 **展开**（在 **钣金** 选项卡或工具栏上）。请注意，**加强筋** 特征在\
  \ **展开图** 视图中无处可见。\n- 2. 再次单击 **展开** 以重新折叠模型。\n- 3. 编辑 **加强筋** 特征。\n- 4. 滚动到属性管理器底部并勾选\
  \ **覆盖文档设置** 框。然后，选择 **显示轮廓** 和 **显示中心** 两个选项并按 **确定**。\n- 5. 再次 **展开** 零件。\n\n\
  请注意，**加强筋** 特征的位置现在会出现。槽轮廓代表 **加强筋** 特征的形状，而 *点* 是 **加强筋** 特征中心的<|message|>\n\n\
  此选项仅显示 **加强筋** 特征的一般形状，因此建议在 2D *工程图* 上也写一个注释，指定其确切尺寸。\n\n总之，加强筋为弯折提供强度。可以通过选择 **钣金加强筋**\
  \ 工具，然后选择弯折，设置 **加强筋** 位置，然后指定轮廓和尺寸来添加它们。在下一节中，我们将研究如何使用横向压痕以不同方式增加强度。\n\n\n\n\n\
  \n#### 使用交叉折弯\n\n交叉折弯在钣金中很常见，描述的是在平板上添加的轻微弯折，以使其更坚固并增加强度。这些交叉折弯通常可见于诸如钣金风管等物体的侧面，并且通常采用两个重叠的弯折形成交叉或\
  \ X 形，位于原本平坦的表面上。图 6.7 显示了金属风管侧面交叉折弯的示例：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_144_0.png)\n\
  \n图 6.7：带有 X 形交叉折弯的风管件示例\n\n在 SolidWorks 钣金中添加交叉折弯非常简单：\n\n- 1. 启动一个新的零件文档并创建一个尺寸为\
  \ 100x100mm、厚度为 1mm 的基体法兰。可使用默认的钣金属性。\n- 2. 选择交叉折弯工具。\n- 3. 现在，左键单击选择要添加交叉折弯特征的面。将出现黄色预览，显示交叉折弯特征的弯折将被添加的位置（图\
  \ 6.8）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_145_0.png)\n\n图 6.8：交叉折弯工具\n\
  \n4. 按下绿色的确定复选标记以添加交叉折弯特征。请注意，交叉折弯在 SolidWorks 钣金中纯粹是视觉特征。它们仅表示在现实生活中交叉折弯特征将被添加的位置。模型的实际几何形状保持不变，仍然是一个完全平坦的板。\n\
  \n5. 通过在 FeatureManager 设计树中单击它并按编辑特征来再次编辑交叉折弯特征。\n\n6. 如有需要，我们可以调整折断半径和折断角度属性并调整交叉折弯特征的方向。请注意，更改这些值不会改变黄色预览或交叉折弯特征在\
  \ 3D 模型中的外观。这些值只会出现在零件 2D 工程图的折弯注释中。\n\n7. 交叉折弯通常以交叉或 X 形制作，但也可以调整其轮廓。\n\n为此，从交叉折弯属性管理器中单击编辑交叉轮廓按钮。现在我们可以编辑交叉折弯草图，并会出现一条消息，说明当前草图可用于交叉折弯特征。草图中的构造线可以调整以改变轮廓。请注意，您可能需要删除将线端与面角连接的关联。\n\
  \n*线的端点始终必须接触面的外部边缘，如果您的草图不满足此要求，则消息框将不允许该草图与 **交叉折弯** 特征一起使用。*\n\n- 8. 当您对轮廓满意时，按下\
  \ **完成** 按钮。然后，在对 **交叉折弯** 参数满意后，按下绿色的 **确定** 复选标记以创建该特征。\n\n交叉折弯是非常简单的特征，用于为平坦板增加刚性。它们在\
  \ SolidWorks 钣金中作为纯粹的视觉项目添加。\n\n在下一节中，我们将研究创建通风口。\n\n#### 使用通风口\n\n**通风口** 工具用于创建各种形状的切口，并且可以轻松用于添加详细的通风口。此功能不严格限定于钣金，也可用于普通实体建模。然而，通风口在钣金零件中非常常见，因此该功能与其它钣金工具分组在一起：\n\
  \n- 1. 启动一个新的 *零件* 文档并创建一个 **基体法兰**，尺寸为 `100x100mm`，厚度为 1mm。可使用默认的钣金属性。\n- 2. 要创建\
  \ **通风口**，我们需要绘制草图来定义 **通风口** 特征的大小和形状。在 **基体法兰** 的大顶部面上开始一个草图。\n- 3. 在原点处绘制一个直径为\
  \ 80mm 的圆。请注意，通风口不一定是圆形的；它们可以使用任何封闭轮廓。\n- 4. 接下来，我们需要添加额外的草图实体来创建 **加强筋**。从 **草图**\
  \ 选项卡中选择 **偏移实体** 工具，设置 **偏移** 为 10mm，并选择我们绘制的原始 80mm 圆。这应该会创建一个比 80mm 圆小 10mm 的新圆（*图\
  \ 6.9*）。\n\n请注意，您可能需要选择 **反向** 框以确保 **偏移** 圆位于原始圆内。另外，确保取消选择 **构造几何** 选项，以便原始（**基体**）圆和\
  \ **偏移** 圆都是实线，而不是构造线：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_147_0.png)\n\n\
  图 6.9：偏移 80mm 圆以创建另一个更小、同心的圆\n\n- 5. 使用偏移实体工具再两次添加两个更多圆，每个圆比前一个小 10mm（图 6.10）：\n\
  \n![](img/4e9c736de6bac4449096a7b92c28af4c_147_1.png)\n\n图 6.10：偏移另外两个圆，使我们总共有四个同心圆\n\
  \n6. 接下来，我们需要绘制一些肋条。请注意，并非所有通风口都需要肋条（或加强筋），并且该工具如果需要也可以仅使用简单的外轮廓。\n\n选择直线工具并添加一条从圆心向外延伸到最大圆的单条垂直线。\n\
  \n7. 现在，我们可以使用圆形草图阵列添加更多肋条。在草图选项卡上，单击线性草图阵列工具旁的下拉箭头并选择圆形草图阵列。\n\n选择垂直线作为要阵列的实体，选择圆的中心点作为阵列中心，并设置四个实例，等距分布，角度为\
  \ 360°（图 6.11）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_148_0.png)\n\n图 6.11：圆形草图阵列设置\n\
  \n按下绿色的确定复选标记以在圆周围添加三条新的肋条线。\n\n如果您在使用 **圆形草图阵列** 时遇到困难，也可以直接使用 **直线** 工具手动绘制这些线（图\
  \ 6.12）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_149_0.png)\n\n图 6.12：完成的通风口草图\n\
  \n- 8. 现在，我们可以使用此草图创建我们的通风口。通风口工具可以直接在草图内使用，但在本示例中，我们将先退出草图，以确保没有项目被自动预选，这可能会在您不熟悉该工具时造成混淆。\n\
  \   \n- 退出草图并确保未选择它。\n\n- 9. 从钣金工具中选择通风口工具。\n\n- 10. 属性管理器可能看起来非常复杂，但它使用相当合乎逻辑的工作流程。按照顶部消息提供的说明，首先选择边界。这是通风口的外限。\n\
  \   \n在这种情况下，通过左键单击选择最大圆。\n\n请注意，通风口会以我们选择的圆的形状从基体法兰中切出（您可能需要旋转模型以更清晰地看到通风口特征）。我们也可以选择多条线，例如，如果我们要制作矩形通风口。\n\
  \n另请注意，流量面积消息现在显示为 5025.91 平方毫米，开放面积 = 100%。\n\n这告诉您通风口的面积，以及 100% 的面积是开放的（即，我们没有肋条或加强筋阻挡气流）。\n\
  \n在几何属性部分，面已被自动选为通风口草图绘制的面：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_150_0.png)\n\
  \n图 6.13：选择通风口的边界\n\n11. 我们现在可以通过选择肋条框然后选择草图中的四条线来添加我们的肋条。\n\n这些肋条的深度和方向将被变灰，因为钣金肋条的深度始终与模型的板厚相同。\n\
  \n将肋条宽度设置为 5mm，并注意开放面积减少到 84.60%。这是因为肋条阻挡了部分通过通风口的气流。\n\n12. 现在，通过左键单击加强筋框然后选择两个较大的剩余圆来选择我们的加强筋。同样，深度和方向无法更改，但我们的加强筋的宽度可以更改。\n\
  \n将宽度设置为 2mm，并注意开放面积进一步减少到 73.70%（图 6.14）。\n\n并非每个通风口都需要加强筋和肋条，但必须先添加肋条将其连接到模型的其余部分后，才能添加加强筋：\n\
  \n![](img/4e9c736de6bac4449096a7b92c28af4c_151_0.png)\n\n图 6.14：添加肋条和加强筋\n\n13.\
  \ 填充边界也是可选的，用于封闭通风口特征的区域。在我们的示例中，选择最小的内圆，并注意它现在已填充。\n\n\n\n\n\n14. 在完成 **Vent**\
  \ 功能之前，向上滚动回到 **Geometry Properties** 部分。在这里，我们可以为 **Vent** 切割设置一个 **Draft Angle**。该选项在钣金工作中并不常用，因为它会使\
  \ **Flat Patterns** 的切割变得复杂。\n\n我们还可以为通风口的连接处添加圆角。\n\n将半径设置为 2mm。请注意，这适用于整个 **Vent**\
  \ 功能。\n\n15. 按 **OK** 创建该功能（*Figure 6.15*）。注意它现在出现在 FeatureManager Design Tree 中：\n\
  \n![](img/4e9c736de6bac4449096a7b92c28af4c_152_0.png)\n\nFigure 6.15: The completed\
  \ Vent feature\n\n**Vent** 功能不仅限于钣金 *parts*，并且非常适用于在钣金模型中添加这些常见功能。\n\n#### Summary\n\
  \n在本章中，我们学习了如何使用 **Gussets** 和 **Cross Breaks**，两者都用于以不同方式为钣金件增加强度。我们学习了如何编辑 **Gussets**\
  \ 以产生各种形状和尺寸，以及它们如何在 **Flat Pattern** 视图中显示。\n\n我们还探索了 **Vent** 工具，该工具可用于快速制作不同布局和尺寸的钣金\
  \ **Vents**。\n\n在下一章中，我们将探索 **Lofted Bend** 工具，该工具使我们能够创建更复杂类型的弯曲。\n"
- "### 7\nProducing\nAdvanced Shapes\nUsing Lofted Bends\n\nLofted Bend 是一种先进的弯曲形式，可用于创建比标准法兰类型更复杂的形状。\n\
  \nLofted Bend 有两种类型——Formed 和 Bent，本章涵盖了这两种类型，包括两者之间的主要区别。\n\n到本章结束时，您将了解如何使用 Lofted\
  \ Bend 工具，使用 Formed 和 Bent 两种选项。\n\n在本章中，我们将涵盖以下主要主题：\n\n- Creating Formed Lofted\
  \ Bends\n- Adding Bent Lofted Bends\n\n#### Creating Formed Lofted Bends\n\nLofted\
  \ Bends 用于在两种不同轮廓形状之间创建弯曲过渡。这在许多不同的情况下都很有用，例如当您需要将方形轮廓连接到更圆润的轮廓（如管子）时。\n\n在 SolidWorks\
  \ Sheet Metal 中，Lofted Bends 可以是 Bent 或 Formed，这描述了弯曲实际的制作方式。一般来说，Formed 选项会产生更平滑的弯曲，并且更难制造，而\
  \ Bent 选项会近似弯曲形状，并且更易于物理制作。\n\nBent 和 Formed 类型都使用相同的工具——Lofted Bend 工具创建，并且两者都以相同的方式开始：使用两个开放轮廓。因此，Lofted\
  \ Bends 是少数不需要预先存在的 Base Flange 的钣金工具之一。\n\n要创建 Formed Lofted Bend：\n\n- 1. 启动一个新的零件文档并在\
  \ Front Plane 上绘制第一个弯曲轮廓（见 Figure 7.1）。这可以使用 Center Rectangle 绘制，尺寸为 100×50 mm，并固定到\
  \ Origin：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_154_0.png)\n\nFigure 7.1:\
  \ Lofted Bend profile sketch\n\n##### Lofted Bend Profile Requirements\n\nLofted\
  \ Bends 需要两个轮廓才能创建。这两个轮廓都必须是开放的，并且不能包含任何尖角。\n\n因此，使用 **Sketch Fillet** 工具（在 **Sketch**\
  \ 选项卡上）为所有四个角添加 5mm 倒角，并在轮廓中修剪一个小间隙以确保其为 *open*（见 Figure 7.2）。这可以通过从 Origin 绘制一条垂直的\
  \ Construction Line 到矩形的顶线来完成。\n\n然后，使用 **Offset Entities** 工具（在 **Sketch** 选项卡上）将此\
  \ Construction Line 偏移 1mm（确保偏移线也是 Construction Line）。\n\n然后可以使用 **Trim Entities**\
  \ 工具（也在 **Sketch** 选项卡上）来修剪一个小间隙：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_155_0.png)\n\
  \nFigure 7.2: The completed Loft profile sketch\n\n请注意轮廓是开放的（顶部有一个小间隙）并且没有尖角（Figure\
  \ 7.2）。\n\n在完成时退出草图。\n\n2. 接下来，我们需要创建第二个轮廓，因此我们需要一个新的 Plane。这可以通过选择 Front Plane（确保您已退出之前的草图）然后从\
  \ Features 选项卡中选择 Reference Geometry | Plane 来创建。设置偏移距离为 100mm，如 Figure 7.3 所示，然后按绿色\
  \ OK 勾号创建 Plane：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_156_0.png)\n\nFigure\
  \ 7.3: Adding a new Plane\n\n3. 在新 Plane 上开始一个新的草图并绘制第二个 Loft 轮廓。这将与第一个相似，但形状略有不同。\n\
  \n这次，使用固定在 Origin 的 Centerpoint Straight Slot（在 Slot 工具内），尺寸为 100x50mm。\n\n与之前一样，轮廓必须是开放的并且没有尖角。由于槽的形状，我们没有尖角，但槽仍然是一个封闭的轮廓。因此，我们需要修剪掉另一个小部分，通过偏移一条垂直线然后修剪一个间隙，就像我们对第一个轮廓所做的那样。请注意，修剪时可能会显示关于破坏槽实体的警告消息。这是正常的，可以通过按\
  \ OK 忽略。\n\n如果您的草图丢失了关系并变得 Underdefined，则可以通过添加更多关系和尺寸使其 Fully Defined（您可能需要重新将槽锚定到\
  \ Origin 并在曲线和直线部分之间添加 Tangent 关系）。完成的草图如图 7.4 所示。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_157_0.png)\n\
  \nFigure 7.4: The finished, second Loft profile sketch\n\n在完成时退出第二个草图。\n\n- 4. 我们现在有了所需的两个轮廓草图，因此我们可以使用它们来创建该功能。从\
  \ Sheet Metal 工具中选择 Lofted Bend 工具。这将是少数可用的工具之一，因为我们的模型没有 Base Flange。如果 Lofted\
  \ Bend 工具呈灰色，则确保您已退出草图并且不再编辑它们，这应该允许使用该工具。\n\n- 5. 要创建该功能，我们首先需要选择两个轮廓。单击 Property\
  \ Manager 左侧的 Profiles 框（如果尚未选择并且因此呈蓝色）。然后，通过左键单击依次选择每个草图。\n\n##### Selecting Loft\
  \ Profiles\n\n选择 Loft Profiles 时，尽量确保在每个草图中选择对应的点。例如，如果您在第一个（矩形）草图的直线上选择顶部右侧中心的点，那么也在第二个（槽）草图的相同位置选择一个点（见\
  \ Figure 7.5 中的箭头）。\n\n如果您使用的是不同的轮廓，则可能并不总是能够选择完全对应的点，但请尽量避免选择完全相反的点，因为这可能会导致 Loft\
  \ 扭曲并使功能失败。\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_158_0.png)\n\nFigure 7.5:\
  \ Try to select corresponding points on each of the profile sketches\n\n6. 我们现在可以选择是制作\
  \ Bent 还是 Formed Loft。在 Property Manager 中的 Manufacturing Method 部分下，依次选择 Bent 和\
  \ Formed 选项。请注意，预览会随着每个选项略有变化（Figure 7.6）。Bent 选项有很多较小的、较直的边缘，而 Formed 选项要平滑得多。\n\
  \n选择 **Formed** 选项：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_159_0.png)\n\nFigure\
  \ 7.6: Previews of the Formed Lofted Bend (left) and the Bent Lofted Bend (right)\n\
  \n- 7. **Formed Lofted Bend** 只有一个选项需要设置，即板材的厚度。\n\n  将其设置为 1.5mm 厚度。\n\n- 8. 按绿色\
  \ **OK** 勾号创建该功能。**Lofted Bend** 功能出现在 FeatureManager Design Tree 中，可以像平常一样编辑。轮廓草图也可以通过展开该功能并编辑下面的草图来编辑。\n\
  \n- 9. 通过从 **Sheet Metal** 工具中选择 **Flatten** 来展平模型。请注意，平坦零件具有拱形，这是由于 **three-dimensional\
  \ (3D)** 成型弯曲的形状所致。\n\n  也没有弯曲线。这是因为形状将使用专用工具成型，而不是使用设定点弯曲。因此，这种类型的零件可能难以实际制造。\n\
  \n- 10. 按 **Flatten** 按钮重新折叠模型。\n\nFormed Lofted Bends 由两个必须开放且不能包含尖角的轮廓草图制成。Formed\
  \ Lofted Bends 产生平滑的形状，但在现实生活中可能难以生产。在下一节中，我们将使用相同的轮廓查看如何创建 **Bent Lofted Bend**。\n\
  \n\n\n\n\n#### 添加弯曲放样折弯\n\n第二种放样折弯类型是 **弯曲** 版本。按以下步骤添加它：\n\n- 1. 编辑当前的 **放样折弯**\
  \ 特性；请注意，由于我们已经创建了成形放样折弯，因此我们不再有将其更改为弯曲放样折弯的选项。\n- 然而，我们可以删除放样折弯，然后重用相同的轮廓来创建弯曲版本。\n\
  - 2. 退出 **放样折弯属性管理器**，以便不再编辑该特性，然后在 FeatureManager 设计树中选择该特性并按 Delete。这将删除放样折弯特性但保留两个底层的草图。\n\
  - 3. 选择 **放样折弯** 工具，然后再次选择两个轮廓。记住要尝试在每个轮廓上选择对应的点。\n- 4. 现在，从 **属性管理器** 的 **制造方法**\
  \ 部分中选择 **弯曲** 选项。\n- 5. **弯曲** 选项包含的 sub-选项比 **成形** 选项多得多，但在此时，使用默认选项并按绿色 **确定**\
  \ 勾号创建弯曲放样折弯。\n- 6. 我们可以立即看到，模型的外观与之前的成形版本非常不同，并且包含许多小的弯曲边缘。\n\n按 **展平** 展平模型，并注意我们现在可以看到多个将用于弯曲\
  \ *零件* 的折弯线（见图 7.7）：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_160_0.png)\n\n\
  图 7.7：展平的弯曲放样折弯及其折弯线\n\n- 7. 再次按 **展平** 以重新折叠 *零件*。\n\n8. 我们现在将探索用于创建弯曲放样折弯拐角的不同面片选项。\n\
  \n编辑 **放样折弯** 特性，并在 **属性管理器** 中，我们可以看到四个选择，如 *图 7.8* 所示。这些选择中的每一个都会产生相当相似的输出，但略有不同的选项允许您精确控制弯曲形状。\n\
  \n请注意，其中一些选项对于某些放样轮廓来说可能有点难以处理，因此如果您在使用一个选项时难以获得想要的结果，请尝试使用另一个选项进行实验：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_161_0.png)\n\
  \n图 7.8：弯曲放样折弯选项\n\n从第一个选项开始：\n\n- **弦长公差**：弦是连接圆弧上两点的直线。当我们创建弯曲放样折弯时，我们是通过使用直线来近似圆弧。*图\
  \ 7.9* 显示了理想的圆弧以及使用弦（直线）近似的版本：\n\n![](img/4e9c736de6bac4449096a7b92c28af4c_162_0.png)\n\
  \n图 7.9：弦长公差选项\n\n**弦长公差** 选项设置直线弦线与理想圆弧之间的最大数值，如 *图 7.9* 中蓝色所示。\n\n尝试调整 **面片值**\
  \ 设置并注意预览如何变化。较高的面片值会产生较少的直线段，因此会创建不太准确的圆弧形状，但由于弯折较少，因此更容易制造。\n\n请注意，我们也可以点击图形区域中模型上四个拐角的紫色点（见\
  \ *图 7.6* 右侧），这也允许我们为该拐角专门设置面片选项。\n\n如果您发现创建时 **放样折弯** 具有您不想要的补强切口，请尝试选择或取消选择 **参照端点**\
  \ 选项。这可以产生更平滑的弯折并减少这些自动补强切口的问题。\n\n- **弯折数量**：这是一个相当简单的选项，允许您设置每个拐角内的弯折数量。显然，更多的弯折会产生更平滑的曲线，但请注意，这也会在生产过程中需要更多的工作。\n\
  \n- **段长**：此选项允许您设置每个段的最大长度。较低的值会产生更多更短的段，从而产生更平滑的曲线，而较高的值会产生长度更长但数量更少的段。这会产生更近似的弯曲形状。\n\
  \n- **段角度**：最后一个选项决定相邻段之间的最大角度。此处较低的值会在弯折中产生更多段，因此会产生更平滑的曲线。\n\n四个选项中的每一个都可以产生非常相似的结果，因此请尝试调整设置以获得所需的弯曲形状。\n\
  \n如果需要，这里也可以覆盖默认的 **钣金** 参数，例如 **弯曲半径** 和 **板厚**。\n\n- 9. 将 **面片选项** 设置为您自己的偏好值，然后按绿色\
  \ **确定** 勾号创建特性。\n\n弯曲放样折弯通常比成形放样折弯更容易制造，但它们产生的曲线要粗糙得多。弯折可以用多种不同的拐角类型控制，但这些通常都会产生相当相似的输出。\n\
  \n#### 总结\n\n在本章中，我们了解到 **放样折弯** 是在两个不相似的轮廓之间创建曲线的良好方法。**放样折弯** 由两个开放轮廓制成，不能有尖锐边缘。\n\
  \n有两种类型的 **放样折弯：成形**，它会产生更平滑但更难制造的特性；以及 **弯曲**，它更容易物理制造，但只能近似弯曲形状。\n\n在下一章中，我们将学习最后一个主要工具之一，**搭扣和插槽**\
  \ 工具，它允许我们在两个 **钣金** 体之间添加细节以便于连接。\n"
- '### 8

  使用搭扣和插槽特性连接多片零件


  搭扣和插槽工具可以通过在每个上分别创建搭扣和插槽特性来简化两个钣金体的连接。


  到本章结束时，您将了解如何使用基本工具以及其众多子选项。


  在本章中，我们将涵盖以下主要主题：


  - 添加搭扣和插槽特性

  - 调整搭扣和插槽属性


  #### 添加搭扣和插槽特性


  到目前为止，在本书中，我们只创建了包含单个板的钣金零件。然而，也有可能制作具有多个板的零件。


  在 SolidWorks 钣金中，板可以像普通实体建模中的体一样思考。它们是模型内的独立实体，并未相互连接。它们可能相互接触，但仍然是独立的实体。


  钣金模型具有多个板的一个例子可能是由两个部分组成的外壳——**主体**（第一张板）和单独的 **盖子**（第二张板）。尽管 **盖子** 和 **主体** 都在单个
  SolidWorks *零件* 文档中制作，但它们在该零件中都是独立的元素。


  **搭扣和插槽** 工具是将这两个板连接起来的好方法。它从一个板上切割出插槽并在另一个板上添加相应的搭扣，使两个板能够相互啮合，更容易创建类似焊接的连接。


  **搭扣和插槽** 工具不仅仅是钣金工具；与 **通风口** 工具一样，它可以在普通实体建模零件中使用，但在钣金工作中非常有用，因此它被归类在钣金工具中。


  要创建 **搭扣和插槽** 特性，我们首先需要制作一个具有两个板的模型：


  - 1. 启动一个新的 *零件* 文档并使用 **中心矩形** 工具创建固定在原点且尺寸为 100×100mm、厚度为 4mm 的 **底边法兰**。可以使用默认的钣金属性，如
  *图 8.1* 所示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_166_0.png)


  图 8.1：创建 100x100x4mm 底边法兰


  - 2. 在 *第 3 章，熟悉钣金中的基本工具* 中，我们学习了如何使用 **折弯** 工具将两个 *平行* 板或法兰连接在一起，但如果我们要连接两个 *垂直*
  板，则 **搭扣和插槽** 工具更合适，因为它提供了更大的表面积来帮助连接两个板。


  在当前 **底边法兰** 的一个小端面上开始一个新的草图，然后使用 **角矩形** 绘制第二个 **底边法兰** 草图，使其与第一个 **底边法兰** 的角相连且宽度也为
  100mm，如 *图 8.2* 所示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_167_0.png)


  图 8.2：绘制第二个底边法兰，使其与第一个的角重合


  - 3. 使用第二个草图通过选择 **底边法兰/搭扣** 选项并接受默认参数来创建 **底边法兰**（板厚仍应为 4mm）。






  请注意，FeatureManager 设计树中的 Cut list 文件夹旁边现在带有数字 2 的括号（见图 8.3）。这表明我们的模型中有两张板。该文件夹可以展开，并可以通过左键单击它们并选择隐藏或显示来隐藏或显示板：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_168_0.png)


  图 8.3：添加第二张板，以及 Cut list 文件夹


  4. 现在我们有了第二张板，我们可以开始创建 Tab and Slot 特征。选择 Sheet Metal 工具中的 Tab and Slot。与许多 SolidWorks
  工具一样，属性管理器中的选项最初看起来非常复杂，但它们有一个逻辑流程，并且属性管理器顶部黄色框中的消息解释了该过程。


  5. 首先，我们需要使用选择部分中的框选择特征放置的位置。最上面的边缘是 Tab Edge（图 8.4 中标记为 i）选择框。这是一个线性边缘，标签将被放置在该边缘上：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_169_0.png)


  图 8.4：选择选项


  当处理在角落处连接的板时，如我们的示例，选择内部角落而不是外部角落会更容易。这是因为这里只有一个单一边缘，而外部角落有两个边缘（来自每张板各一个），因此很难选择正确的边缘。


  旋转模型并选择内部角落，如图 8.5 所示。请注意，所选边缘的起点和终点会自动作为绿色和紫色点添加到图形区域，并添加到相应的选择框中（图 8.4 中标记为 iv
  和 v）。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_170_0.png)


  图 8.5：选择 Tab Edge 和起点和终点参考点


  6. 接下来，我们需要选择 Slot Face。


  旋转模型并选择外部面，如图 8.6 所示。标签和插槽的黄色预览现在应出现在模型上：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_171_0.png)


  图 8.6：选择 Slot Face


  7. 按下绿色的确定复选标记，使用默认尺寸和选项创建 Tab and Slot 特征（见图 8.7）。请注意，一张板已被切掉插槽，而另一张板已添加了相应的标签。


  FeatureManager 设计树中现在出现了两个特征——Tab and Slot-Tab 特征和 Tab and Slot-Slot 特征。这两个特征始终成对添加；你不能有其中一个而没有另一个。然而，由于它们位于不同的板上，它们将作为两个不同的特征出现。


  尝试展开 Cut list 文件夹并依次隐藏每张板，以更仔细地查看它们如何配合。你也可以通过将鼠标悬停在图形区域中的板上并按 Tab 键来隐藏板（通过按 Ctrl
  + Z 撤消或通过展开 Cut list 文件夹并在隐藏的板上按显示来重新显示）：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_172_0.png)


  图 8.7：创建的 Tab and Slot 特征


  我们现在添加了一个基本的 Tab and Slot 特征，希望你能看到这将如何有助于两张板的连接。在下一节中，我们将研究编辑特征以设置我们想要的属性。


  #### 调整 Tab and Slot 属性


  在上一节中，我们使用默认选项添加了 Tab and Slot 特征。然而，有许多属性可以设置标签和插槽的确切尺寸和间距。


  编辑 Tab 或 Slot 特征时，我们必须在 FeatureManager 设计树中编辑 Tab and Slot-Tab 特征（见图 8.8）。这将允许我们更改标签和插槽的详细信息；无法直接编辑
  Tab and Slot-Slot 特征：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_173_0.png)


  图 8.8：Tab and Slot-Tab 和 Tab and Slot-Slot 特征


  - 1. 通过在 FeatureManager 设计树中单击它并按编辑特征来编辑 Tab and Slot-Tab 特征。

  - 2. 我们现在可以指定标签和插槽的确切细节。首先，我们可以通过设置偏移量来指定标签和插槽的开始位置，如果需要的话。


  选择偏移量框并将两个偏移量都设置为 1.0mm。这些距离是从起点参考点和终点参考点（图形区域中的绿色和紫色点，如图 8.9 所示）测量的。


  尝试调整偏移量，看看这如何改变图形区域中的预览。请注意，随着我们增加偏移量，插槽之间的间距会自动减小：


  ![](img/4e9c736de6bac4449096a7b92c28af4c_173_1.png)


  图 8.9：起点和终点参考点


  3. 接下来，我们可以设置标签和插槽的 **Spacing** 值。可以*要么*设置一个 **Equal Spacing** 值并指定将添加多少个标签，*要么*设置一个
  **Spacing Length** 值，这意味着标签的数量将自动调整以适应该长度。


  根据使用的值，这两个选项可以产生非常相似的结果，选择使用哪一个在很大程度上取决于个人喜好。


  设置一个 **Equal Spacing** 值，实例数为六个。


  4. 接下来可以更改 **Tab** 详细信息。


  **Length** 值只是一个数值。将其设置为 5mm。


  **Height** 值可以使用三种端条件设置，如下：

  - **Up To Surface**：标签将一直延伸到插槽被切出的板材的另一侧。

  - **Blind**：可以设置一个简单的数值。

  - **Offset From Surface**：如果标签需要更短或延伸超出板材，这可以被使用，并且对于延伸标签以提供更多焊接材料很有用。


  **Edges Type** 选择允许标签的角落为 **Sharp Edge**、**Fillet Edge** 或 **Chamfer Edge**。


  5. 最后，可以设置 **Slot** 详细信息。


  第一个选项是 **No Through Cut**。默认情况下，插槽将一直穿过它们所在的面。通过选择此选项，我们可以创建部分插槽切割，不会一直穿过面。


  ##### Slot Depth Is Linked to Tab Height


  如果你取消选择 No Through Cut 以制作部分插槽切割，请注意插槽的深度与标签的高度相关联。因此，如果你的标签高度仍设置为 Up To Surface
  选项，则为插槽选择 No Through Cut 实际上不会改变插槽深度。要做到这一点，你还必须降低标签高度。


  此外，请注意，在钣金中创建部分插槽切割在现实生活中比简单地创建贯穿切割要困难得多，因此这可能会增加零件的成本和交货时间。


  6. 接下来，我们可以设置插槽的偏移量，如图 8.10 所示。这是插槽与标签相比会大多少。插槽必须始终稍大，以便标签可以放入其中，因此不可能将偏移量设置为零，尽管可以设置一个非常小的数字。


  选择 Equal offset 将使偏移量的长度和宽度值具有相同的值。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_175_0.png)


  图 8.10：插槽选项


  7. Slot 部分中的最后一个选项允许设置 Corner Type 字段，可用的选项有 Sharp、Filleted、Chamfered 和 Circular。


  **Corner-Type Limitations**

  如果在尝试使用 Filleted 或 Chamfered 角类型时遇到错误，请尝试减小 Filleted 或 Chamfered 角的大小或增加偏移值，或两者兼而有之。


  有时，角落处的倒角或倒角的大小实际上会减小实际距离，在某些情况下完全消除任何间隙，导致在尝试创建特征时出现错误，如图 8.11 所示。


  ![](img/4e9c736de6bac4449096a7b92c28af4c_176_0.png)


  图 8.11：请注意，倒角或倒角角可能需要更大的偏移间隙


  Tab and Slot 工具具有许多选项，允许你精确设置所需特征的大小、间距和类型。


  #### 总结


  在本章中，我们了解到 Tab and Slot 工具是将两张板连接起来的好方法，特别是如果它们在垂直角度相遇。插槽将从其中一张板上切出，而相邻的板将添加适合这些插槽的标签。


  在下一章中，我们将仔细研究各种 Corner 工具，这些工具允许你轻松完成模型的细节。





