  ## 前言


  SolidWorks 是 3D 工程和产品设计应用的首选软件，适用于各行各业，而钣金模块是该强大程序的重要组成部分。


  本书将帮助你准确理解钣金是什么、为什么使用它，以及如何充分利用这种基础设计技术。你将首先了解基础工具的基础知识，包括基板法兰和草图折弯，然后再学习更复杂的特征，例如自定义成形工具和放样折弯。本书以循序渐进的方式涵盖了所有必要的工具，并分享实用的制造技巧，让你能够将所学技能应用于现实世界的情况。


  阅读完本书后，你将了解如何充分利用 SolidWorks 钣金工具，并能够自信地创建各种各样的 3D 模型和设计。


  ## 本书适合谁阅读


  本书适合希望扩展技能并学习钣金设计这一专业领域的现有 SolidWorks 用户。这可能是希望提升技能的工程师、希望扩展能力的业余爱好者，或是希望增强技能和知识的建模爱好者。


  ## 本书涵盖内容


  Chapter 1, Sheet Metal Basics – Exploring Sheet Metal Properties and Material Selection,
  outlines the various uses of sheet metal and how it can be used in SolidWorks. You
  will learn how to start a Sheet Metal part using the different Base Flange types,
  and how the Sheet Metal properties can be set and modified. A basic overview of
  material selection is also provided.


  *Chapter 2, Adding Bends Using Edge Flanges,* explains how to turn a flat Base Flange
  into a 3D part by adding Edge Flanges – one of the most common building blocks of
  Sheet Metal parts. This chapter also explores the Edge Flange properties in more
  detail, including Flange Profiles, the use of multiple edges, and other details.


  *Chapter 3, Getting Familiar with Basic Tools in Sheet Metal,* explains how to add
  and remove material using basic Sheet Metal tools, including Tabs, Cuts and Holes.
  New flange types such as the Miter Flange and Hem are also explained, as well Sketched
  Bends, which can be used to add more unusual bend styles. Finally, the Jog feature
  is explained, both from a theoretical and a practical perspective.


  *Chapter 4, Creating Sheet Metal Drawings and Exporting Files,* explains how to
  create 2D drawings, which are essential if parts are to be manufactured and used
  in the real world, and shows how to create these and how to insert Flat Patterns,
  based on Sheet Metal parts. It also explains the various ways in which Sheet Metal
  parts can be exported for use, such as DXF and DWG file types.


  *Chapter 5, Creating Complex Parts Using Swept Flanges and the Fold/Unfold Tools,*
  explains how and why Swept Flanges can be used. These flanges are similar to Miter
  Flanges but each has a specific use case. It also covers the folding and unfolding
  operations. These are distinct from flattening and unflattening and can be used
  to make specific features, such as cuts across bends.


  *Chapter 6, Utilizing Gussets, Crossbreaks, and Vents to Add Part Details,* explains
  each feature in turn – how to use them and why and where they might be used. Vents
  are another common feature in Sheet Metal parts and are used for a wide variety
  of reasons, including to add cooling and access ports.


  *Chapter 7, Producing Advanced Shapes Using Lofted Bends,* covers Lofted Bends,
  which are an advanced form of bend that can be used to create more complex shapes
  than standard flange types. There are two types of Lofted Bend Formed and Bent –
  and this chapter covers both, including the major differences between the two.


  *Chapter 8, Joining Multi-Sheet Parts Using Tab and Slot Features,* covers The Tab
  and Slot tool, which can be used to simplify the joining of two Sheet Metal sheets
  by creating Tab and Slot features on each. This chapter explains how to use the
  basic tool, and covers the many sub-options in more detail.


  *Chapter 9, Finishing Off Models Using Corner Details,* explains how SolidWorks
  Sheet Metal contains a number of specific corner tools that can be used to create
  many types of corner join, including closing corner gaps between flanges, adding
  welded corners, trimming away sharp edges, and adding corner relief around bend
  areas.


  Chapter 10, Adding 3D Details to Models with Forming Tools, explains how to use
  existing Forming Tools from the SolidWorks Design Library, as well as how to modify
  Forming Tools and how to create and use entirely Custom Forming Tools.


  Chapter 11, Converting to Sheet Metal Using the Insert Bends Tool, covers how 3D
  models with a constant wall thickness, such as Shelled or Thin Feature parts can
  be converted into Sheet Metal parts by using the Insert Bends feature. This chapter
  shows how to use this option to create Sheet Metal parts.


  Chapter 12, Building Sheet Metal Parts Using the Convert to Sheet Metal Tool, explains
  how the Convert to Sheet Metal tool can be used with 3D models that don''t have
  a constant wall thickness. The tool is quite versatile and has a number of options
  that are explained in detail here.


  Chapter 13, Practical Example: The Sheet Metal Enclosure, shows how to use various
  Sheet Metal techniques to create an example enclosure, while also providing handy
  tips and tricks for practical modeling.


  ## 如何充分利用本书


  你应已具备 SolidWorks 的基础知识，并能够使用 Windows PC。假定你已了解 3D 建模的基础知识，例如草图绘制，以及创建和编辑特征。


  对于完全初学 SolidWorks 的读者，建议先在实体建模方面打下坚实基础，再尝试使用本书涵盖的钣金模块。


  如果你希望练习本书中涵盖的练习和技能，还应拥有 SolidWorks 许可证。


  | 书中涵盖的软件/硬件 | 操作系统要求 |

  |---|---|

  | SolidWorks | Windows |


  本书中的示例使用 SolidWorks 2021 创建。绝大多数工具都可以使用不同版本的 SolidWorks，但界面和子选项可能存在细微差异。


  在阅读本书过程中，如果某个教程或工具出现问题，请尝试重新检查之前的所有步骤，或甚至关闭零件并从头开始。


  SolidWorks 中的错误消息通常描述性很强，往往能准确告诉用户问题所在。因此，如果出现错误，请避免在未仔细阅读的情况下点击 **OK**，而应尝试执行消息中建议的操作。


  如果问题仍然存在，请随时通过 Twitter 在线联系我，网址为 www.twitter.com/johnoellison。


  整本书使用毫米作为测量单位，但可根据你的喜好进行调整，通过将模型的单位设置为英寸（例如），然后在添加尺寸时在智能标注工具中输入毫米数值后跟 mm。这将自动把毫米值转换为英寸（或你选择的单位类型）。


