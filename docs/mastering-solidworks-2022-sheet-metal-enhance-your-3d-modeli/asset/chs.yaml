  - Using Cross Breaks\n- Using Vents\n\n\n\n\n\n#### 使用加强筋\n\n现在我们已经了解了一些标准的钣金工具，可以继续学习更专业的工具。首先是加强筋。与折边工具类似，这个术语最初来自服装。许多物品，例如衬衫，都包含加强筋。这些是小块额外的布料，通常是三角形的，用于增加额外的强度。它们可能出现在衬衫底部两侧或腋下区域，甚至在裤子的裆部。\n\
