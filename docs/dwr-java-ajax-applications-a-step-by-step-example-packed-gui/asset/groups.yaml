  - "[PAGE 218]\n\n```\nCollection<ScriptSession> sessions =\n        serverContext.getScriptSessionsByPage\n\
    \                (contextPath + \"/mainpage.jsp\");\nScriptProxy proxy = new ScriptProxy(sessions);\n\
    return proxy;\n}\nreturn null;\n}\n\npublic void postNewMessage(String newMessage)\
    \ {\n    ScriptProxy proxy = getScriptProxyForSessions();\n    if (proxy != null)\
    \ {\n        proxy.addFunctionCall(\"<newMessage>\",newMessage);\n    }\n}\n}\n\
    ```\n\nThe Chatroom code is surprisingly simple. The chat content is stored in\
    \ a `Vector` of `Strings`. The `getChatContent()` method just returns the chat\
    \ content `Vector` to the browser.\n\nThe `postMessage()` method is called when\
    \ the user sends a new chat message. The method verifies whether the user is logged\
    \ in, and adds the current time and username to the chat message and then appends\
    \ the message to the chat content.\n\nThe method also calls the `postNewMessage()`\
    \ method that is used to show new chat content to all logged-in users. Note that\
    \ the `postMessage()` method does not return any value. We let DWR and reverse\
    \ AJAX functionality show the chat message to all users, including the user who\
    \ sent the message.\n\nThe `getScriptProxyForSessions()` and `postNewMessage()`\
    \ methods use reverse AJAX to update the chat areas of all logged-in users with\
    \ the new message.\n\nAnd that is it! The chat room sample is very straightforward\
    \ and basic functionality is already in place, and the application is ready for\
    \ further development.\n\n# Testing the Chat\n\nWe test the chat room application\
    \ with three users: Smith, Brown, and Jones. We have given some screenshots of\
    \ a typical scenario in a chat room here."
