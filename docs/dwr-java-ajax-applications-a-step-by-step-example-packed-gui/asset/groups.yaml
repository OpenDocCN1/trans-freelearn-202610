  mdcn: "\n每次用户在输入框中输入字符时，都会调用 `showPopupMenu()` 函数。该函数获取输入字段的值，并调用 `LicenseDB.getLicensesStartingWith()`\
    \ 方法。回调函数在函数参数中指定。回调函数获取所有匹配该参数的许可证，并根据参数（它是一个数组）的长度，要么显示一个包含所有匹配许可证名称的弹出框，要么——如果数组长度为一——隐藏弹出框并将完整的许可证名称插入文本字段。在弹出框中，许可证名称被包裹在带有\
    \ `onclick` 事件监听器的 `div` 元素内，该监听器会调用 `completeEditBox()` 函数。\n\n`hidePopupMenu()`\
    \ 函数仅用于关闭弹出菜单，而 `completeEditBox()` 函数会将点击的许可证文本插入输入框，并将焦点移动到按钮上。当我们点击“Show license\
    \ text”按钮时，会调用 `showLicenseText()` 函数。该函数调用 `LicenseDB.getLicenseContentUrl()`\
    \ 方法，回调函数会创建一个 `iframe` 元素，以直接显示来自 http://www.opensource.org 的许可证内容，如下面的截图所示：\n\
    \n![](img/5b721cfaa97eb697efc92e3914f62fca_103_0.png)\n\n### 后记\n\n字段补全功能改善了网页的用户体验，本节的示例代码展示了使用\
    \ DWR 实现该功能的一种方式。\n\n需要说明的是，这里展示的字段补全示例仅用于演示目的。\n\n### 小结\n\n本章提供了几个网页开发中常见任务的示例：表格和列表、字段补全，甚至为我们的示例代码提供了一个通用框架——称为动态用户界面。表格和列表示例以及字段补全示例都使用了一个非常简单的基于\
    \ CSV 的“数据库”来保存数据，并且两者都有一个远程方法，DWR 通过该方法从服务器获取数据并在客户端显示。\n\n我们还看到了一些很好的 HTML、CSS\
    \ 和 JavaScript 示例。事实上，如果不了解 JavaScript，编写 Web 应用程序将会非常困难。\n\n多年前，正如你们一些人可能记得的，JavaScript\
    \ 在网页开发中是一个不受欢迎的词，没有自尊的开发者会碰 JavaScript。但变化是生活的一部分，在这种情况下，变化是朝着更好的方向。JavaScript\
    \ 和 Java 通过 DWR 很好地协同工作。\n\n下一章继续讨论用户界面部分，并展示更多示例，包括地图滚动功能，类似于流行的 Google Maps\
    \ 网站中的功能。\n\n## 5 用户界面：高级元素\n\n本章包含三个示例：表单、导航树和地图滚动。几乎所有 Web 应用程序中都有表单，示例展示了如何使用\
