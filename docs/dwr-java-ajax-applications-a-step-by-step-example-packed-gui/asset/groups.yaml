    The first function is the callback for the getRootElements() Java call. The functionality
    of the function is to get root elements and, for each element, it checks the existence
    of child elements and, based on that, it writes the HTML code for the menu element.
    Note that the menus are li elements, and our styles for wireframemenu specify
    how the li elements have to be handled within our menu. We see a menu instead
    of a bulleted list. Make note of one parameter in the NavigationTree.hasChildren()
    remote call: that is async:false. This is interesting because it forces the call
    to the server to be synchronous, just like normal method calls in any given programming
    language. Care must be taken while using synchronous calls in A(synchronous)JAX–it
    may slow down the application considerably.


    The next function is expandElement(). This also checks the child elements and
    writes new links to the menu or to the content.


    The third function is showContent(). This calls the remoted Java method and retrieves
    the content of the given element.


    And so this sample menu tree is ready. Although the menu is hard-coded, it will
    give a good starting point for developing a dynamic tree menu backed by a database
    or some other mechanism.


