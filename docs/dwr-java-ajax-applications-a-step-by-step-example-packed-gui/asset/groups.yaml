    \ 213\n\n## 前言\n\nAJAX 能够在浏览器中实现类似桌面级的丰富用户界面，并能够实现交互式界面，甚至可以取代传统用户界面。浏览器与服务器之间的通信在后台进行，并且由于只有数据在浏览器和服务器之间传输，AJAX\
    \ 应用程序对用户来说似乎很快，而且实际上也响应迅速。\n\nDWR，Direct Web Remoting，是一个开源 Java 框架，采用商业友好的 Apache\
    \ Software License v2 许可，用于构建 AJAX 应用程序。DWR 的主要思想是将 AJAX 实现细节，如 XMLHttpRequest\
    \ 等，从开发人员面前隐藏起来。开发人员可以专注于应用程序和业务对象的开发，而将 AJAX 细节留在幕后，那里才是它们应有的位置。\n\nDWR 允许服务器端的\
    \ Java 类在浏览器中使用（它就像 JavaScript 函数与服务器端 Java 之间的 RPC），并且还允许 JavaScript 函数在服务器中使用（反向\
    \ AJAX）。DWR 通过基于 XML 的配置从 Java 类动态生成 JavaScript 函数，这些函数可以通过 DWR JavaScript 库从浏览器调用。服务器端的\
    \ DWR servlet 接收请求并调用实际的 Java 实现。DWR 包含几个使 DWR 正常工作所需的 JavaScript 库，这些库对开发人员也很有帮助。\n\
    \n当服务器用于查询和/或控制客户端浏览器行为时，就使用了反向 AJAX 的术语。DWR 支持三种不同的方法在应用程序中进行反向 AJAX：Piggyback、Polling（由客户端进行）和\
    \ Comet（服务器推送）。\n\n您可能有一个正在进行的项目，您可能希望使用 JSF 或 Spring 等框架来构建整个解决方案。在这些情况下，AJAX\
    \ 和 DWR 只是整体图景的一部分，因此 DWR 需要很好地与其他框架集成，并且做得非常成功！\n\n"
