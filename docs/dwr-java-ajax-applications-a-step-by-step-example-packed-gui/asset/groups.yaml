  - "[PAGE 66]\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_66_0.png)\n\n# Configuring\
    \ the Web Application\n\nThe context root is worth noting (visible in the screenshot\
    \ above). We will need it when we test the application.\n\nThe other XML file,\
    \ web.xml, is very important as we all know. This XML will hold the DWR servlet\
    \ definition and other possible initialization parameters. The following code\
    \ shows the full contents of the web.xml file that we will use:\n\n```\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<web-app xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n    xmlns=\"http://java.sun.com/xml/ns/javaee\"\n    xmlns:web=\"http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\
    \n    xsi:schemaLocation=\"http://java.sun.com/xml/ns/javaee http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\
    \n    id=\"WebApp_ID\" version=\"2.5\">\n    <display-name>DWREasyAjax</display-name>\n\
    \    <servlet>\n        <display-name>DWR Servlet</display-name>\n        <servlet-name>dwr-invoker</servlet-name>\n\
    \        <servlet-class>\n            org.directwebremoting.servlet.DwrServlet\n\
    ```\n```"
  - "[PAGE 67]\n\n```\n```xml\n</servlet-class>\n<init-param>\n    <param-name>debug</param-name>\n\
    \    <param-value>true</param-value>\n</init-param>\n</servlet>\n\n<servlet-mapping>\n\
    \    <servlet-name>dwr-invoker</servlet-name>\n    <url-pattern>/dwr/*</url-pattern>\n\
    </servlet-mapping>\n\n<welcome-file-list>\n    <welcome-file>index.html</welcome-file>\n\
    \    <welcome-file>index.htm</welcome-file>\n    <welcome-file>index.jsp</welcome-file>\n\
    \    <welcome-file>default.html</welcome-file>\n    <welcome-file>default.htm</welcome-file>\n\
    \    <welcome-file>default.jsp</welcome-file>\n</welcome-file-list>\n</web-app>\n\
    ```\n```\n\nWe have already seen the servlet definition in Chapter 3, in the section\
    \ on configuration. We use the same `debug-init` parameter here. Servlet mapping\
    \ is the commonly used `/dwr/*`.\n\nWe remember that DWR cannot function without\
    \ the `dwr.xml` configuration file. So we need to create the configuration file.\
    \ We use Eclipse to create a new XML file in the **WEB-INF** directory. The following\
    \ is required for the user interface skeleton. It already includes the `allow`-element\
    \ for our DWR based menu.\n\n```\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<!DOCTYPE dwr PUBLIC\n    \"-//GetAhead Limited//DTD Direct Web Remoting 2.0//EN\"\
    \n    \"http://getahead.org/dwr/dwr20.dtd\">\n<dwr>\n    <allow>\n        <create\
    \ creator=\"new\" javascript=\"HorizontalMenu\">\n            <param name=\"class\"\
    \ value=\"samples.HorizontalMenu\" />\n        </create>\n    </allow>\n</dwr>\n\
    ```\n```\n\nIn the `allow` element, there is a creator for the horizontal menu\
    \ Java class that we are going to implement here. The creator that we use here\
    \ is the new creator, which means that DWR will use an empty constructor to create\
    \ Java objects for clients. The parameter named `class` holds the fully qualified\
    \ class name."
