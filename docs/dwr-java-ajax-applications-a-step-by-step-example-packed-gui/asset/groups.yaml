  mdcn: "\n在上述方法中，我们首先实例化 `CreditCardValidatorSoapProxy` 对象，然后调用其 `validCard()` 方法来执行信用卡验证。`validCard()`\
    \ 方法通过 Internet 调用远程 Web 服务。如果信用卡无效，则向 `System.out` 写入一条通知，并且 `submitOrder()`\
    \ 方法返回 `false`。如果信用卡有效，则 `submitOrder()` 方法返回 `true`。\n\n利用 Eclipse 中现有的工具，只需几行代码，我们就能将标准\
    \ Web 服务集成到示例中。\n\n## 测试 Web 服务集成\n\n我们使用表单示例来测试 Web 服务集成。由于我们刚刚更新了表单示例，使其使用 Web\
    \ 服务进行信用卡验证，因此我们可以使用例如 Wireshark 网络协议分析器（http://www.wireshark.org）或 Eclipse 工具自带的\
    \ TCP/IP 监视器来验证是否调用了 Web 服务。下面是从 Geronimo 发送到 Web 服务提供商的 Web 服务请求截图：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_161_0.png)\n\
    \nWireshark 还捕获了来自 Web 服务的响应。以下是响应截图：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_162_0.png)\n\
    \n## 结语\n\nWeb 服务集成就像上一节中展示的数据库集成一样简单。同样，DWR 和用户界面并不知道远程 Java 类的实现，因此 Web 服务集成对用户来说是完全透明的。\n\
    \n## 与消息系统集成\n\n消息示例背后的思路是：我们的应用程序将使用 JMS 将订单表单发送到后端系统。这里的后端系统是一个 Python 脚本，它访问\
    \ JMS 消息服务器 ActiveMQ。\n\n## 在 Geronimo 中设置队列\n\n在这个消息示例中，我们使用开源 JMS 消息服务器 ActiveMQ，它是\
    \ Geronimo 应用服务器的一部分。ActiveMQ 非常适合测试我们的应用程序，因为它支持一种名为 STOMP（流文本定向消息协议，一种基于文本的协议）的协议。STOMP\
    \ 使多种编程语言能够参与 JMS 消息传递（甚至 Telnet 也可以；这对于快速测试很有用），因此我们可以在示例中使用现有工具作为“订单系统”。当“订单系统”（一个\
    \ Python 程序）收到订单时，它会对其进行验证。然后，我们手动将订单确认消息发送回 ActiveMQ 消息系统和我们的应用程序。随后，我们的应用程序使用\
    \ Comet 机制更新网页。\n\n1. 首先要做的是在 ActiveMQ 中创建队列，用于发送订单和接收订单确认。我们使用 Geronimo 服务器控制台中的向导来创建队列。JMS\
    \ 资源可在控制台的“服务 | JMS 资源”中找到。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_163_0.png)\n\
    \n2. 为了创建新队列，我们通过点击“为 ActiveMQ 创建新的 JMS 资源组”链接来设置新资源。该链接会打开一个向导，用于创建新的资源组，如下面的截图所示：\n\
    \n![](img/5b721cfaa97eb697efc92e3914f62fca_164_0.png)\n\n3. 我们只需要为资源组设置名称。我们使用名称\
    \ DWROrderQueue 作为提交订单的队列名称。所有其他配置项可以保留默认值。单击“下一步”按钮将打开如下界面：\n\nJMS 资源\n\nJMS\
    \ 资源组 -- 当前进度\n\n到目前为止，您已经输入了 JMS 资源组所需的基本配置信息。现在您可以创建连接工厂和目的地。当您完成添加连接工厂和目的地后，可以查看此\
    \ JMS 资源组的 Geronimo 部署计划，或直接部署它。\n\n添加连接工厂\n\n添加目的地\n\n取消\n\n4. 我们想要设置一个新的目的地，因此单击“添加目的地”按钮会打开“选择目的地类型”界面。\n\
    \nJMS 资源\n\nJMS 资源组 -- 选择目的地类型\n\nJMS 目的地类型：\n\njavax.jms.Queue\n\n此资源适配器声明了几种可能的目的地接口。请为此目的地选择所需的接口类型。\n\
    \n下一步\n\nJMS 资源组 DWROrderQueue 的当前状态\n\n- 0 个连接工厂\n- 1 个目的地\n  - 进行中\n\n取消\n\n\
    5. 我们使用 Queue 作为目的地，在下一个界面中，我们为队列配置目的地名称和物理名称。两者都命名为 DWROrderQueue。\n\nJMS 资源\n\
    \nJMS 资源组 -- 配置目的地\n\n消息目的地名称：DWROrderQueue\n\n连接工厂的唯一名称；当从应用程序组件映射资源引用时，用于引用此连接工厂。\n\
    \n目的地配置设置\n\n物理名称：DWROrderQueue\n\n下一步\n\nJMS 资源组 DWROrderQueue 的当前状态\n\n0 个连接工厂\n\
    \n1 个目的地\n\n进行中\n\n取消\n\n6. 单击“下一步”按钮将打开一个摘要界面，显示我们到目前为止创建的内容。\n\nJMS 资源\n\nJMS\
    \ 资源组 -- 当前进度\n\n这些是您迄今为止添加到 JMS 资源组的连接工厂和目的地。当您完成添加连接工厂和目的地后，可以查看此资源组的 Geronimo\
    \ 部署计划，或直接部署它。\n\n资源组 DWROrderQueue\n\n| 类型 | 名称 | 接口 |\n|------|------|-----------|\n\
    | 目的地 | DWROrderQueue | javax.jms.Queue |\n\n添加连接工厂 添加目的地 显示计划 立即部署\n\n取消\n\n\
    7. 在这里，我们可以添加目的地或添加连接工厂。“立即部署”按钮会将队列部署到 Geronimo。\n\n```java\nimport org.directwebremoting.ServerContextFactory;\n\
    import org.directwebremoting.WebContext;\nimport org.directwebremoting.WebContextFactory;\n\
    \npublic class OrderSystem implements Runnable {\n    protected Thread worker;\n\
    \    private ServerContext serverContext;\n    private String scriptId = null;\n\
    \    private String name;\n    private String address;\n    private String creditCardNumber;\n\
    \    private String expiryDate;\n\n    public OrderSystem(String name, String\
    \ address,\n                       String creditCardNumber,\n                \
