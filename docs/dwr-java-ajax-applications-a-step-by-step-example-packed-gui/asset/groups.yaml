  - '[PAGE 39]


    # Supported Browsers and Environments


    As DWR applications are based on Java, the server that runs a DWR application
    must be a Java server. JDK 1.3 and servlet specification 2.2 are minimum requirements.
    Almost all Java application servers support DWR applications. Apache Tomcat, Apache
    Geronimo, WebSphere, Weblogic, and many other servers are supported. In this book,
    we have used Apache Geronimo.


    DWR supports most of the latest browsers:


    +   - Firefox 1.x and later versions are supported.

    +   - Internet Explorer 6.0 and the later versions of Windows are supported (IE
    Mac is not supported). IE 5.5 may also work, but IE 5.0.2 is not supported.

    +   - Mozilla-based browsers are supported from version 1.7.

    +   - Opera version 7.5.4 and later are supported (only one minor issue reported
    with strings containing nulls).

    +   - Safari browsers from version 1.2 on OSX are supported.

    +   - Konqueror browser and its latest versions may work, but they are not tested
    by the DWR team.


    In general, most current browsers are supported by DWR, and it is unlikely that
    browser support is an issue in any current or future development project. Especially,
    when the project is for SMB (Small and Medium Businesses) or an enterprise customer,
    they probably have a company policy for a preferred browser, and that browser
    is very likely one of the two major browsers.


    # Configuration


    DWR is configured using XML files, annotations, or Fluent Interface style. Using
    XML files is the most typical method for DWR configuration, and there are two
    files: web.xml and dwr.xml. The first one, web.xml, is a must for other configuration
    methods also. Annotations and fluent-style configurations may be used in place
    of dwr.xml. This section describes the configuration methods and how to use them.


    # web.xml


    Configuration starts by defining the DWR servlet in the web application''s web.xml
    configuration file. This is, of course, mandatory since DWR would not work without
    it. A minimum configuration does not have any init parameters, and is shown as
    follows:'
