    \ message. For example, an exception object may look like this:\n\n```\n{\n  javaClassName:'java.lang.Throwable',\n\
    \  message:'Error'\n}\n```\n\n\"Error\" says nothing about what might be wrong,\
    \ except that something is clearly wrong. More detailed exceptions are enabled\
    \ by adding the following line to dwr.xml.\n\n```\n<convert match=\"java.lang.Exception\"\
    \ converter=\"exception\"/>\n```\n\nThe Exception converter enables understandable\
    \ error messages:\n\n```\n{\n  javaClassName:'org.xml.sax.SAXParseException',\n\
    \  lineNumber:42,\n  publicId:'somePublicId',\n  message:'Missing >'\n}\n```\n\
    \nFurther, enabling stacktraces using the line <convert match=\"java.lang.StackTraceElement\"\
    \ converter=\"bean\"/> in dwr.xml allows easier development work where we can\
    \ see errors as they occur and go directly to the debugging mode.\n\nSession expiry\
    \ is handled by textHtmlHandler, and it is used like this:\n\n```\ndwr.engine.setTextHtmlHandler(function()\
    \ {\n  window.alert(\"Your session has expired, please login again.\");\n  document.location\
    \ = '/mycontext/login';\n});\n```\n\nPackaging is easy because of built-in Eclipse\
    \ tools.\n\n- We select the project name and right-click to get the context menu;\
    \ under the **Export** menu item, we find the **WAR** option.\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_54_0.png)\n\
    \n- After we click the **WAR** option, a **WAR Export** dialog opens where we\
    \ choose the **Destination** and a name for the WAR file: d:\\temp\\HelloWorldServlet.war.\n\
    \n![](img/5b721cfaa97eb697efc92e3914f62fca_55_0.png)\n\n- For the deployment,\
    \ we have installed a standalone Geronimo application server. Run Geronimo using\
    \ the **startup** script file (and remember to set the `JAVA_HOME` environment\
    \ variable). The following screenshot displays typical output when starting the\
    \ Geronimo server using the **startup** script.\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_55_1.png)\n\
    \n## Deployment Using the Administration Console\n\nDeployment can be done using\
    \ the Geronimo Administration Console.\n\n- 1. After starting the Geronimo server,\
    \ open Geronimo web console. The default location is http://127.0.0.1:8080/console.\
    \ The default administrator user name is system, and the password is manager.\
    \ After login to the system, we will see the Geronimo Administration Console.\
    \ On the left side, there is a menu for administrative tasks, and on the right\
    \ side there are links to common tasks, documentation, and other resources.\n\n\
    ![](img/5b721cfaa97eb697efc92e3914f62fca_56_0.png)\n\n## Getting Started\n\n2.\
    \ Installation is a straightforward task. We select Deploy Applications present\
    \ in the Common Console Actions box or Deploy New Application present on the left\
    \ in Console Navigation. The following screen opens where we specify the HelloWorldServlet.war\
    \ file.\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_57_0.png)\n\n3. After pressing\
    \ Install, Geronimo displays the status of the operation.\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_57_1.png)\n\
    \nNow that the application has been installed, we can test it. There are two things\
    \ we need to know: context path and servlet mapping. We specified the servlet\
    \ mapping during development, and we get it from the web.xml file; it is HelloWorld.\
    \ We get the context path from Geronimo.\n\n4. The Web App WAR's link in the Console\
    \ Navigation opens an Installed Web Applications screen, and there we see a list\
    \ of applications and in the URL column there is the context path.\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_58_0.png)\n\
    \n5. Now that we have context path and servlet mapping, we open our servlet in\
    \ a browser: http://127.0.0.1:8080/HelloWorldServlet/HelloWorld and we are able\
    \ to see the world famous message.\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_58_1.png)\n\
    \nUninstalling, stopping, and restarting of applications are done via the Installed\
    \ Web Applications screen.\n\nThe Administration console is very useful especially\
    \ when we start to perform development work or while occasionally testing some\
    \ applications in Geronimo. However, during development, it is better to use a\
    \ command-line-based deployer tool.\n"
  mdcn: "\n现在，开发环境已准备就绪，可以进行编码了。我们有一个 IDE 和一个测试服务器，这差不多就是我们真正需要的一切。\n\n## Apache Geronimo\n\
    \nApache Geronimo 的网站是 `http://geronimo.apache.org`，那里提供了独立应用服务器的下载。尽管我们刚刚安装了一个包含\
    \ Geronimo 服务器运行时的开发环境，但我们仍需要安装独立的 Geronimo。\n\nGeronimo 的安装再简单不过了！只需下载 Geronimo\
    \ 发行版的 ZIP 文件（我们使用带有 Tomcat 的那个）并将其解压到某个目录。使用 **bin** 目录中的 **startup** 脚本启动 Geronimo，使用\
    \ **shutdown** 脚本停止它。\n\n## 测试与调试\n\nDWR 应用程序是普通的 Web 应用程序，因此可以使用 Eclipse IDE\
    \ 中提供的常规调试工具对其进行测试和调试。网上有关于在 Eclipse 中进行调试的信息，例如 IBM developerWorks 网站上的文章（`http://www.ibm.com/developerworks/opensource/library/os-ecbug/`）。还有一些关于\
    \ Eclipse 及其功能的书籍。\n\n另一种调试方法是日志记录。这听起来可能有些“老套”，但这里引用 Brian W. Kernighan 和 Rob\
    \ Pike 所著的 *编程实践* 中的一段话（Apache 的 Log4J 网站上也有这段引用）：\n\n> > 就个人选择而言，我们倾向于只使用调试器来获取堆栈跟踪或一两个变量的值。原因之一是，人们很容易迷失在复杂数据结构和控制流的细节中；我们发现单步执行程序的效率较低。通常，这种情况发生在服务器会话过期时，服务器会显示一个登录页面或关于会话过期的信息页面。\n\
    \n处理程序是在客户端的 JavaScript 代码中使用 engine.js 包中的一个函数设置的：\n\n```\ndwr.engine.setErrorHandler(handlerFunction);\n\
    ```\n\n异常由 exceptionHandler 或 errorHandler 处理。默认情况下，当异常发生时，DWR 不会在错误消息中包含任何关于异常的信息。例如，一个异常对象可能如下所示：\n\
    \n```\n{\n  javaClassName:'java.lang.Throwable',\n  message:'Error'\n}\n```\n\n\
    “Error”只表明显然出了某些问题，但未说明具体可能是什么错误。通过向 dwr.xml 中添加以下行，可以启用更详细的异常信息。\n\n```\n<convert\
    \ match=\"java.lang.Exception\" converter=\"exception\"/>\n```\n\nException 转换器能够提供易于理解的错误消息：\n\
    \n```\n{\n  javaClassName:'org.xml.sax.SAXParseException',\n  lineNumber:42,\n\
    \  publicId:'somePublicId',\n  message:'Missing >'\n}\n```\n\n此外，使用 dwr.xml 中的\
    \ <convert match=\"java.lang.StackTraceElement\" converter=\"bean\"/> 行启用堆栈跟踪，可以简化开发工作，让我们在错误发生时直接看到错误并立即进入调试模式。\n\
    \n会话过期由 textHtmlHandler 处理，其用法如下：\n\n```\ndwr.engine.setTextHtmlHandler(function()\
    \ {\n  window.alert(\"Your session has expired, please login again.\");\n  document.location\
    \ = '/mycontext/login';\n});\n```\n\n由于 Eclipse 内置的工具，打包非常容易。\n\n- 我们选择项目名称并右键单击以打开上下文菜单；在\
    \ **导出** 菜单项下，我们找到 **WAR** 选项。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_54_0.png)\n\
    \n- 点击 **WAR** 选项后，会打开一个 **WAR 导出** 对话框，我们可以在其中选择 **目标** 以及 WAR 文件的名称：d:\\temp\\\
    HelloWorldServlet.war。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_55_0.png)\n\
    \n- 为了进行部署，我们已经安装了一个独立的 Geronimo 应用服务器。使用 **startup** 脚本文件运行 Geronimo（并记得设置 `JAVA_HOME`\
    \ 环境变量）。以下截图展示了使用 **startup** 脚本启动 Geronimo 服务器时的典型输出。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_55_1.png)\n\
    \n## 使用管理控制台进行部署\n\n可以使用 Geronimo 管理控制台进行部署。\n\n- 1. 启动 Geronimo 服务器后，打开 Geronimo\
    \ Web 控制台。默认位置是 http://127.0.0.1:8080/console。默认管理员用户名为 system，密码为 manager。登录系统后，我们将看到\
    \ Geronimo 管理控制台。左侧有用于管理任务的菜单，右侧有指向常见任务、文档和其他资源的链接。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_56_0.png)\n\
    \n## 入门指南\n\n2. 安装是一项简单直接的任务。我们选择“常用控制台操作”框中的“部署应用程序”，或选择“控制台导航”左侧的“部署新应用程序”。随后会打开如下屏幕，我们可在其中指定\
    \ HelloWorldServlet.war 文件。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_57_0.png)\n\
    \n3. 点击“安装”后，Geronimo 会显示操作状态。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_57_1.png)\n\
    \n既然应用程序已经安装完成，我们就可以对其进行测试了。我们需要知道两件事：上下文路径和 Servlet 映射。我们在开发期间指定了 Servlet 映射，并从\
    \ web.xml 文件中获取；它是 HelloWorld。我们从 Geronimo 获取上下文路径。\n\n4. 单击“控制台导航”中的“Web App\
    \ WAR”链接，会打开“已安装的 Web 应用程序”屏幕，在那里我们会看到应用程序列表，URL 列中显示的就是上下文路径。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_58_0.png)\n\
    \n5. 现在我们有了上下文路径和 Servlet 映射，可以在浏览器中打开我们的 Servlet：http://127.0.0.1:8080/HelloWorldServlet/HelloWorld，然后就能看到这个举世闻名的消息。\n\
    \n![](img/5b721cfaa97eb697efc92e3914f62fca_58_1.png)\n\n卸载、停止和重新启动应用程序都可以通过“已安装的\
    \ Web 应用程序”屏幕完成。\n\n管理控制台非常有用，尤其是当我们开始进行开发工作或偶尔在 Geronimo 中测试某些应用程序时。但在开发过程中，最好使用基于命令行的部署工具。\n"
