    \ 和 saveCountryNotes() 函数取消对新注释的编辑，或通过调用 CountryDB.saveCountryNotes() Java 方法保存它们。\n\
    \n以下屏幕截图显示了填充表格的示例的外观：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_93_0.png)\n\
    \n现在我们已将必要的函数添加到网页中，我们可以测试应用程序。\n\n## Testing Tables and Lists\n\n如果我们在开发期间一直运行测试环境，应用程序应该已准备好进行测试。Eclipse\
    \ 在任何内容更改时都会自动将我们的新代码部署到服务器。因此我们可以直接前往测试页面 `http://127.0.0.1:8080/DWREasyAjax`。点击\
    \ **Tables and lists** 我们可以看到我们开发的页面。通过选择某个字母，例如 \"I\"，我们会得到所有以字母 \"I\" 开头的国家/地区列表（如前一个屏幕截图所示）。\n\
