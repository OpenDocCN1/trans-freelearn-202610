    ![](img/5b721cfaa97eb697efc92e3914f62fca_63_1.png)\n\nThe following sequence diagram\
    \ shows the application flow from the logical perspective. Because of the built-in\
    \ DWR features we don't need to worry very much about how asynchronous AJAX \"\
    stuff\" works. This is, of course, a Good Thing.\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_64_0.png)\n\
    \nNow we will develop the application using the Eclipse IDE and the Geronimo test\
    \ environment that we set up in the previous chapter.\n\n#### Creating a New Web\
    \ Project\n\n1. First, we will create a new web project. Using the Eclipse IDE\
    \ we do the following: select the menu File | New | Dynamic Web Project.\n2. This\
    \ opens the New Dynamic Web Project dialog; enter the project name DWREasyAjax\
    \ and click Next, and accept the defaults on all the pages till the last page,\
    \ where Geronimo Deployment Plan is created as shown in the following screenshot:\n\
    \n![](img/5b721cfaa97eb697efc92e3914f62fca_64_1.png)\n\n#### Configuring the Web\
    \ Application\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_66_0.png)\n\nThe context\
    \ root is worth noting (visible in the screenshot above). We will need it when\
    \ we test the application.\n\nThe other XML file, web.xml, is very important as\
    \ we all know. This XML will hold the DWR servlet definition and other possible\
    \ initialization parameters. The following code shows the full contents of the\
    \ web.xml file that we will use:\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<web-app xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n\
    \    xmlns=\"http://java.sun.com/xml/ns/javaee\"\n    xmlns:web=\"http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\
    \n    xsi:schemaLocation=\"http://java.sun.com/xml/ns/javaee http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\
    \n    id=\"WebApp_ID\" version=\"2.5\">\n    <display-name>DWREasyAjax</display-name>\n\
    \    <servlet>\n        <display-name>DWR Servlet</display-name>\n        <servlet-name>dwr-invoker</servlet-name>\n\
    \        <servlet-class>\n            org.directwebremoting.servlet.DwrServlet\n\
    \        </servlet-class>\n        <init-param>\n            <param-name>debug</param-name>\n\
    \            <param-value>true</param-value>\n        </init-param>\n    </servlet>\n\
    \    <servlet-mapping>\n        <servlet-name>dwr-invoker</servlet-name>\n   \
    \     <url-pattern>/dwr/*</url-pattern>\n    </servlet-mapping>\n    <welcome-file-list>\n\
    \        <welcome-file>index.html</welcome-file>\n        <welcome-file>index.htm</welcome-file>\n\
    \        <welcome-file>index.jsp</welcome-file>\n        <welcome-file>default.html</welcome-file>\n\
    \        <welcome-file>default.htm</welcome-file>\n        <welcome-file>default.jsp</welcome-file>\n\
    \    </welcome-file-list>\n</web-app>\n```\n\nWe have already seen the servlet\
    \ definition in Chapter 3, in the section on configuration. We use the same `debug`\
    \ parameter here. Servlet mapping is the commonly used `/dwr/*`.\n\nWe remember\
    \ that DWR cannot function without the `dwr.xml` configuration file. So we need\
    \ to create the configuration file. We use Eclipse to create a new XML file in\
    \ the **WEB-INF** directory. The following is required for the user interface\
    \ skeleton. It already includes the `allow` element for our DWR based menu.\n\n\
    ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE dwr PUBLIC\n   \
    \ \"-//GetAhead Limited//DTD Direct Web Remoting 2.0//EN\"\n    \"http://getahead.org/dwr/dwr20.dtd\"\
    >\n<dwr>\n    <allow>\n        <create creator=\"new\" javascript=\"HorizontalMenu\"\
    >\n            <param name=\"class\" value=\"samples.HorizontalMenu\" />\n   \
    \     </create>\n    </allow>\n</dwr>\n```\n\nIn the `allow` element, there is\
    \ a creator for the horizontal menu Java class that we are going to implement\
    \ here. The creator that we use here is the new creator, which means that DWR\
    \ will use an empty constructor to create Java objects for clients. The parameter\
    \ named `class` holds the fully qualified class name.\n"
  mdcn: "\n\n## 使用 Deployer 工具部署\n\nDeployer 工具是一个命令行工具，主要用于在 Geronimo 中安装和卸载应用程序。该工具位于\
    \ **bin** 目录下，根据操作系统不同为 `deploy.bat` 或 `deploy.sh`。\n\n工具语法为：\n\n```\ndeploy.[bat|sh]\
    \ [general options] command [command options]\n```\n\n要安装新的 WAR 文件，我们使用 deploy\
    \ 命令：\n\n```\ndeploy -user system -password manager deploy d:\\temp\\HelloWorldServlet.war\n\
    ```\n\n我们会得到以下关于安装成功的确认屏幕：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_59_0.png)\n\
    \n请注意，使用命令行工具安装时获得的信息比使用管理控制台安装时更多。我们可以看到模块名称以及从提示中得到的上下文根。模块名称很重要，因为它用于卸载应用程序。卸载命令为：\n\
    \n```\ndeploy -user system -password manager undeploy sample/HelloWorldServlet/1.0/car\n\
    ```\n\n另一个重要命令是 `list modules`，它显示当前在应用程序服务器中运行的所有已安装模块。deploy 命令的其他所有命令都可以在 Geronimo\
    \ 文档中找到。\n\ndeployer 工具可能是部署的最有用方式。它允许自动化部署过程，并且我们可以最大限度地减少手动错误。更不用说，让脚本进行部署比手动使用管理控制台安装要快得多、快得多。\n\
    \n## 使用热部署部署\n\n热部署是最简单的安装方法。在这里，我们只需将示例 WAR 文件复制到 Geronimo 的 **deploy** 目录，Geronimo\
    \ 就会完成其余工作。我们可以使用 deployer 工具的 `list modules` 命令来验证安装。\n\n卸载也很简单。我们从 deploy 目录删除\
    \ WAR 文件，Geronimo 就会卸载应用程序。\n\n热部署对于快速且可能不太规范的应用程序安装很有用。在现实生活中，可能最好使用 deployer\
    \ 命令行工具，因为它具有脚本功能，以及由此产生的部署过程自动化。\n\n## 总结\n\n现在，我们已经设置了开发环境，并查看了支持的环境、测试、调试、打包和部署。我们还介绍了\
    \ DWR 的配置。因此，一切都已准备就绪，可以开始使用 DWR。\n\n本书的其余部分将集中于实际代码，我们将看到在本章和前几章中介绍的 DWR 功能。\n\
    \n## 用户界面：基本元素\n\n在本章中，我们将进入实际动手操作。我们将基于 DWR 开发示例，展示如何动态更改常见的用户界面元素，如表格和列表以及字段补全。我们还将为本书中的所有示例制作一个动态用户界面骨架。\n\
    \n动态用户界面部分展示了如何开始 DWR 应用程序，并介绍了一个用户界面骨架，该骨架将用于容纳表格和列表示例，以及字段补全（又名 autosuggest/autocomplete）示例。下一章中的示例将使用相同的用户界面骨架，除了第\
    \ 7 章中的示例应用程序。\n\n本章包含以下部分：\n\n- 创建动态用户界面——从创建 Web 项目和本章中提及的示例的基础开始\n- 实现表格和列表——向我们展示如何使用\
    \ DWR\n- 实现字段补全——提供典型的字段补全示例\n\n### 创建动态用户界面\n\n动态用户界面的想法是为所有示例提供一个通用的“框架”。我们将创建一个新的\
    \ Web 应用程序，然后在继续过程中向应用程序添加新功能。用户界面看起来类似于以下图示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_63_0.png)\n\
    \n用户界面有三个主要区域：静态的标题/标志、动态的标签页，以及显示实际内容的区域。\n\n此实现的想法是使用 DWR 功能生成标签页并获取标签页内容。标签式用户界面是使用\
    \ Dynamic Drive CSS Library 中的 CSS 模板创建的（http://dynamicdrive.com/style/csslibrary/item/css-tabs-menu）。标签是从属性文件读取的，因此可以动态地向网页添加新标签。以下屏幕截图显示了用户界面。\n\
    \n![](img/5b721cfaa97eb697efc92e3914f62fca_63_1.png)\n\n以下序列图显示了从逻辑角度看的应用程序流程。由于内置的\
    \ DWR 功能，我们不必太担心异步 AJAX“东西”是如何工作的。这当然是一件好事。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_64_0.png)\n\
    \n现在我们将使用 Eclipse IDE 和上一章中设置的 Geronimo 测试环境来开发应用程序。\n\n#### 创建新的 Web 项目\n\n1.\
    \ 首先，我们将创建一个新的 Web 项目。使用 Eclipse IDE，我们执行以下操作：选择菜单 File | New | Dynamic Web Project。\n\
    2. 这将打开 New Dynamic Web Project 对话框；输入项目名称 DWREasyAjax 并单击 Next，并在所有页面上接受默认值，直到最后一页，在那里创建\
    \ Geronimo Deployment Plan，如以下屏幕截图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_64_1.png)\n\
    \n#### 配置 Web 应用程序\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_66_0.png)\n\n上下文根值得注意（在上面的屏幕截图中可见）。我们在测试应用程序时需要它。\n\
    \n另一个 XML 文件 web.xml 非常重要，我们都知道。这个 XML 将保存 DWR servlet 定义和其他可能的初始化参数。以下代码显示了我们将使用的\
    \ web.xml 文件的完整内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<web-app\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n    xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    \n    xmlns:web=\"http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\n    xsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/javaee http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\
    \n    id=\"WebApp_ID\" version=\"2.5\">\n    <display-name>DWREasyAjax</display-name>\n\
    \    <servlet>\n        <display-name>DWR Servlet</display-name>\n        <servlet-name>dwr-invoker</servlet-name>\n\
    \        <servlet-class>\n            org.directwebremoting.servlet.DwrServlet\n\
    \        </servlet-class>\n        <init-param>\n            <param-name>debug</param-name>\n\
    \            <param-value>true</param-value>\n        </init-param>\n    </servlet>\n\
    \    <servlet-mapping>\n        <servlet-name>dwr-invoker</servlet-name>\n   \
    \     <url-pattern>/dwr/*</url-pattern>\n    </servlet-mapping>\n    <welcome-file-list>\n\
    \        <welcome-file>index.html</welcome-file>\n        <welcome-file>index.htm</welcome-file>\n\
    \        <welcome-file>index.jsp</welcome-file>\n        <welcome-file>default.html</welcome-file>\n\
    \        <welcome-file>default.htm</welcome-file>\n        <welcome-file>default.jsp</welcome-file>\n\
    \    </welcome-file-list>\n</web-app>\n```\n\n我们已经在第 3 章的配置部分看到了 servlet 定义。我们在这里使用相同的\
    \ `debug` 参数。Servlet 映射是常用的 `/dwr/*`。\n\n我们记得 DWR 不能在没有 `dwr.xml` 配置文件的情况下运行。因此我们需要创建配置文件。我们使用\
    \ Eclipse 在 **WEB-INF** 目录中创建一个新的 XML 文件。以下内容是用户界面骨架所需的。它已经包含了我们基于 DWR 的菜单的 `allow`\
    \ 元素。\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE dwr PUBLIC\n\
    \    \"-//GetAhead Limited//DTD Direct Web Remoting 2.0//EN\"\n    \"http://getahead.org/dwr/dwr20.dtd\"\
    >\n<dwr>\n    <allow>\n        <create creator=\"new\" javascript=\"HorizontalMenu\"\
    >\n            <param name=\"class\" value=\"samples.HorizontalMenu\" />\n   \
    \     </create>\n    </allow>\n</dwr>\n```\n\n在 `allow` 元素中，有一个用于我们在这里要实现的水平菜单\
    \ Java 类的 creator。我们在这里使用的 creator 是 new creator，这意味着 DWR 将使用空构造函数为客户端创建 Java\
    \ 对象。名为 `class` 的参数保存完全限定的类名。\n\n"
