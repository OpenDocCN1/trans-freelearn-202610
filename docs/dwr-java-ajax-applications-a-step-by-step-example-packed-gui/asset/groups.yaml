  - '[PAGE 161]


    In the above method, we first instantiate the CreditCardValidatorSoapProxy object
    and then call its validCard() method to do the credit card validation. The validCard()
    method calls the remote web service via Internet. If the credit card is not valid,
    a notification is written to the System.out, and the submitOrder() method returns
    false. If the credit card is valid, then the submitOrder() method returns true.


    Using the existing tools in Eclipse and just a couple of lines of code, we can
    integrate standard web services into our example.


    # Testing Web Services Integration


    We test the web services integration using the form example. Since we have just
    updated the form example to use a web service for credit card validation we can
    verify whether a web service is called using, for example, the Wireshark network
    protocol analyzer (http://www.wireshark.org), or the TCP/IP monitor that comes
    with Eclipse tooling. The following is a screenshot of a web service request from
    Geronimo to a web service provider:


    ![](img/5b721cfaa97eb697efc92e3914f62fca_161_0.png)'
