  mdcn: "\n\n## DWR 功能\n\n| 函数 | 语法 | 描述 |\n|---|---|---|\n| addOptions | `dwr.util.addOptions(id,\
    \ [ \"one\", \"two\", \"three\" ])` | 允许在不刷新页面的情况下向由 ID 指定的列表和选择元素 (`ol`, `ul`,\
    \ 和 `select`) 添加元素。 |\n| addRows | `dwr.util.addRows(id, array, cellfuncs, [options])`\
    \ | 向指定的表格元素添加行。`array` 参数用于填充数据，使得每个数组元素对应一行。创建表格的伪代码如下：<br><code>for each member\
    \ in array<br>&nbsp;&nbsp;&nbsp;&nbsp;for each function in cellfuncs<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;create\
    \ cell from cellfunc(array[i])</code> |\n| byId | `dwr.util.byId()` | 此函数查找当前\
    \ HTML 文档中具有给定 ID 的元素。这可以替代 `document.getElementById` JavaScript 函数使用。 |\n| getValue()\
    \ | `dwr.util.getValue(id)` | 从诸如 `div` 和 `input` 元素等 HTML 元素获取值。 |\n| getText()\
    \ | `dwr.util.getText(id)` | 专为选择列表设计，并返回当前选项的显示文本而不是值。 |\n| getValues() | `dwr.util.getValues({\
    \ div:null, textarea:null })` | 此函数获取指定元素的值。函数参数是一个映射，其中键是 HTML 元素 ID，值在执行此函数后保存元素值。\
    \ |\n| onReturn() | `dwr.util.onReturn(event, submitFunction)` | 当在文本元素上按下回车时捕获事件的有用函数。这适用于\
    \ `onkeypress` 或 `onkeydown` 事件绑定到 `onReturn` 函数的文本元素：<br><code>&lt;input type=\"\
    text\"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;onkeypress=\"dwr.util.onReturn(event,\
    \ submitFunction)\"/&gt;<br>&lt;input type=\"button\"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;onclick=\"\
    submitFunction()\"/&gt;</code> |\n| removeAllOptions() | `dwr.util.removeAllOptions(id);`\
    \ | 从由 ID 指定的 `ul`、`ol` 或 `select` 元素中移除所有选项。 |\n| removeAllRows() | `dwr.util.removeAllRows(id)`\
    \ | 从由 ID 指定的表格中移除所有行。 |\n| selectRange() | `dwr.util.selectRange(id,start,end)`\
    \ | 在输入框中选择从起始位置到结束位置之间的文本范围。 |\n| setValue() | `dwr.util.setValue(id,value)`\
    \ | 设置指定 HTML 元素的值。与大多数 HTML 元素兼容，最重要的是输入元素和 div。 |\n| setValues() | `dwr.util.setValues({name:value})`\
    \ | 与 `setValue()` 类似，但函数参数是一个包含名称/值对的对象。名称是 HTML 元素的 ID，值是元素的新值。 |\n| toDescriptiveString()\
    \ | `dwr.util.toDescriptiveString(id,detailLevel,options)` | 一个有用的漂亮打印函数，以人类可读形式打印\
    \ JavaScript 对象，并可选择详细程度。 |\n| useLoadingMessage() | `dwr.util.useLoadingMessage()`\
    \ | DWR 专用的加载消息，在网页右上角显示“loading”。 |\n\n表中的描述仅供参考。以下章节中的 DWR 示例展示了如何使用这些实用函数，而\
    \ DWR 主页更详细地解释了这些函数。当然，对于有兴趣深入了解细节的人来说，JavaScript 源代码也是可用的。\n\n值得一提的一个参数选项是 `escapeHTML:false`。默认情况下，escapeHTML\
    \ 为 true，意味着所有 HTML 元素都会被转义（尤其是 &lt;、&gt;、&amp;、双引号和单引号；这是为了防止跨站脚本攻击）。\n\n###\
    \ gi.js\n\n`gi.js` 库有助于将 DWR 与 TIBCO General Interface (GI) for AJAX Applications\
    \ 集成，这是一个开源库，包含数十个现成的 AJAX 组件以及帮助使用 TIBCO General Interface 开发 AJAX 应用的工具。\n\n\
    DWR 的 `gi.js` 提供了与 TIBCO GI 集成的有用函数，例如 `dwr.gi.toCdfDocument()`，它可从 JavaScript\
    \ 对象生成 CDF (**Common Data Format**) 文档。CDF 是 TIBCO GI 的通用格式，允许在 TIBCO GI 组件之间共享数据、执行数据映射以及在客户端控件之间传输数据。\n\
    \n有关 TIBCO GI 的更多信息可在 TIBCO Developer Network 上找到，`http://www.tibco.com/devnet/gi/default.jsp`。\n\
    \n### 转换器\n\n转换器是 DWR 在客户端和服务器之间编组数据的手段。有许多基本转换器默认启用，并且也可以创建新的转换器。\n\n签名在 dwr.xml\
    \ 中指定，它们用于指示 DWR 正确操作包含在集合中的类型，例如 `java.util.List`。例如，如果我们有一个远程方法签名为 `void setAddresses(List\
    \ addresses)`，DWR 没有办法知道列表中包含的类型是 String。这就是为什么我们需要在 dwr.xml 中提供以下签名来指示 DWR 正确行为的原因。\n\
    \n```\n<signatures>\n  <![CDATA[\n  import java.util.List;\n  import myclasses.AllAddresses;\n\
    \  AllAddresses.setAddresses(List<String> allAddresses);\n  ]]>\n</signatures>\n\
    ```\n\n### 与其他项目的集成\n\n通常，DWR 并不是单独使用。也许你有一个正在进行的项目，其中已决定使用 JSF 或 Spring 等框架来构建整个解决方案。在这些情况下，AJAX\
    \ 和 DWR 只是整体图景的一部分，因此 DWR 需要很好地与其他项目集成。而它确实做到了。\n\nDWR 集成以下项目：\n\n- JSF (http://java.sun.com/javaee/javaserverfaces/)，用于构建用户界面的\
    \ Java Server Faces\n- Spring (http://www.springframework.org/)，一个完整的 Java/JEE\
    \ 应用框架\n- WebWork (http://www.opensymphony.com/webwork/)，一个 Web 应用开发框架\n- Hibernate\
    \ (http://www.hibernate.org/)，一个对象/关系持久化和查询服务\n- 集成到诸如 Apache Jetspeed 的门户中使用\
    \ JSR 168 portlets 也是可行的；例如，参见 IBM developerWorks 上的文章 (http://www.ibm.com/developerworks/java/library/j-ajaxportlet/)\n\
    - 以及许多其他项目，其集成由 DWR 或其他项目本身提供\n\n在此解释所有集成超出了范围，但作为示例，JSF 集成相当直接。\n\nDWR 包含两个用于\
    \ JSF 集成的扩展点；一个是 JsfCreator，用于从 DWR 应用访问 JSF 的 ManagedBeans，另一个是 DWR/Faces servlet\
    \ 过滤器，允许我们从 FacesContext 访问 Java bean。\n\n过滤器需要在 web.xml 文件中配置才能使用 JsfCreator：\n\
    \n```xml\n<filter>\n    <filter-name>DwrFacesFilter</filter-name>\n    <filter-class>uk.ltd.getahead.dwr.servlet.FacesExtensionFilter</filter-class>\n\
    </filter>\n\n<filter-mapping>\n    <filter-name>DwrFacesFilter</filter-name>\n\
    \    <url-pattern>/dwr/*</url-pattern>\n</filter-mapping>\n```\n\n在 dwr.xml 文件中我们插入\
    \ JSF ManagedBeans 配置：\n\n```xml\n<allow>\n    ...\n    <create creator=\"jsf\"\
    \ javascript=\"ScriptName\">\n        <param name=\"managedBeanName\" value=\"\
    beanName\"/>\n        <param name=\"class\" value=\"your.class\"/>\n    </create>\n\
    \    ...\n</allow>\n```\n\n配置后，我们能够从 DWR 应用中使用 JSF ManagedBeans。\n\n### 安全\n\n\
    安全始终很重要，DWR 项目已非常周全地考虑了安全问题。DWR 框架已考虑到许多安全问题，DWR 网站上关于安全的讨论很多，足以填满几本书。\n\n在乎安全的人中包括像你我这样的开发者。软件只做我们指示它做的事情，因此我们在开发期间必须有安全意识，并尽力限制利用我们工作的可能性。\n\
    \n在使用 DWR 时，我们手动在 dwr.xml 配置中指定（除非我们创建了一些自动代码生成软件来为我们做这件事）我们想要远程到 JavaScript 的哪些\
    \ Java 类和方法。这样我们可以确保没有攻击者能够利用除我们明确远程的 Java 对象之外的任何其他对象（并且我们可以集中精力使这些对象尽可能安全）。\n\
    \n"
