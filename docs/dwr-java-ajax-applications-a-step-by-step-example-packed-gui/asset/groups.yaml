  md: "\nThe edit box is a simple text input field. We didn't use any forms. Saving\
    \ and canceling editing is done using JavaScript and DWR. If we press Cancel,\
    \ we get the original notes from the CountryDB Java class using DWR and saving\
    \ also uses DWR to save data. CountryDB.saveCountryNotes() takes the country code\
    \ and the notes that the user entered in the edit box and saves them to the CSV\
    \ file. When notes are available, the application will show them in the country\
    \ table together with other country information as shown in the following screenshot:\n\
    \n![](img/5b721cfaa97eb697efc92e3914f62fca_95_0.png)\n\n## Server Code for Field\
    \ Completion\n\nWe will re-use some of the classes we developed in the last section.\
