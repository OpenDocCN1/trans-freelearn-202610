    class\" value=\"my.JavaObjectOne\"/>\n    <include method=\"getOptionElementsForUser\"\
    />\n</create>\n\n<create creator=\"new\" javascript=\"accessorTwo\" scope=\"session\"\
    >\n    <param name=\"class\" value=\"my.JavaObjectTwo\"/>\n    <exclude method=\"\
    setInternalVariable\"/>\n</create>\n```\n```\n\n## Using the Converter Element\n\
    \nThe converter element is used to specify how method parameters are converted\
    \ from JavaScript to Java. Converters are not needed if parameters are based on\
    \ Java primitive types, strings, `java.util.Date` or arrays/collections of mentioned\
    \ objects.\n\nConverters are needed for custom JavaBean and other parameters.\
    \ For example, for a JavaBean such as the following, we would have to specify\
    \ a Bean converter.\n\n```\n```java\npackage my.package;\npublic class StockInfo\n\
    {\n    public void setClosingPrice(double price) { ... }\n    public void setVolume(long\
    \ volume) { ... }\n}\n```\n```\n\nThe Bean converter is provided by DWR, and it\
    \ converts JavaBean objects to JavaScript associative arrays and vice-versa. Entry\
    \ in `dwr.xml` would be:\n\n```\n```xml\n<convert converter=\"bean\" match=\"\
    my.package.StockInfo\"/>\n```\n```\n\nConverters need to be specified manually\
    \ because it is necessary for DWR to know that it is allowed to touch our code.\
    \ This feature is good for security since it leaves us the responsibility of giving\
    \ permissions to certain actions rather than DWR doing something by default that\
    \ we don't want.\n\nIn addition to the Bean converter, there are a few other converters.\
    \ There is an Object converter, which works directly on object members instead\
    \ of getters and setters like the Bean converter. Then there are converters for\
    \ arrays, Java Collections, DOM objects, and enums. Custom converters may also\
    \ be developed, but it is a rare situation when a custom converter is needed.\n\
    \n## Working with Annotations\n\nAnnotations were introduced in Java 5, and DWR\
    \ supports configuration by annotations instead of (or in conjunction with) XML\
    \ configuration. In order to use annotations, the DWR servlet entry in the web.xml\
    \ file must have all the annotated classes specified in the classes init parameter\
    \ as in the following example.\n\n```\n```xml\n<init-param>\n    <param-name>classes</param-name>\n\
    \    <param-value>\n        my.class.StockInfo,\n        my.class.OtherInfo\n\
    \    </param-value>\n</init-param>\n```\n```\n\nThe following is a sample of an\
    \ annotated class for DWR.\n\n```\n```java\n@RemoteProxy(name=\"market\")\npublic\
    \ class StockMarket\n{\n    @RemoteMethod\n    public double getLatestPrice(String\
    \ symbol) { ... }\n}\n```\n```\n\nThe annotation @RemoteProxy makes a class available\
    \ for remoting, and the name of its attribute specifies the JavaScript name for\
    \ the object. All methods that we need for remote access must have the @RemoteMethod\
    \ annotation. Conversions to make custom bean classes are available through @DataTransferObject\
    \ and @RemoteProperty annotations.\n\nIn comparison, the above StockInfo class\
    \ would have the following entry in the dwr.xml configuration.\n\n```\n<create\
    \ creator=\"new\" javascript=\"market\">\n  <param name=\"class\" value=\"my.class.StockMarket\"\
    />\n  <include method=\"getLatestPrice\"/>\n</create>\n```\n\n## Using Fluent\
    \ Configuration with DWR\n\nFluent configuration style was described by Martin\
    \ Fowler (http://www.martinfowler.com/bliki/FluentInterface.html) a few years\
    \ ago. The word \"Fluent\" comes from the ability to \"fluently\" describe the\
    \ configuration. Refer to the following example (from the DWR website):\n\n```\n\
    public void configure() {\n    withConverterType(\"dog\", \"com.yourcompany.beans.Dog\"\
    );\n    withCreatorType(\"ejb\", \"com.yourcompany.dwr.creator.EJBCreator\");\n\
    \    withCreator(\"new\", \"ApartmentDAO\")\n        .addParam(\"scope\", \"session\"\
    )\n        .addParam(\"class\", \"com.yourcompany.dao.ApartmentDAO\")\n      \
    \  .exclude(\"saveApartment\")\n        .withAuth(\"method\", \"role\");\n   \
    \ withCreator(\"struts\", \"DogDAO\")\n        .addParam(\"class\", \"com.yourcompany.dao.DogDAO\"\
    )\n        .include(\"getDog\")\n        .include(\"getColor\");\n    withConverter(\"\
    dog\", \"*.Dog\")\n        .addParam(\"name\", \"value\");\n    withSignature()\n\
    \        .addLine(\"import java.util.List;\")\n        .addLine(\"import com.example.Check;\"\
    )\n        .addLine(\"Check.setLotteryResults(List nos);\");\n```\n\nFluent configuration\
    \ is enabled by programmatic configuration, and in order to use it with DWR, a\
    \ customConfigurator init parameter in the web.xml file must point to a class\
    \ that subclasses the abstract org.directwebremoting.fluent.FluentConfigurator\
    \ class and its configure method.\n\n## Getting Started\n\n- After starting Eclipse,\
    \ we specify a new server runtime for Geronimo. Go to **New | Other** and the\
    \ **Select a wizard** dialog opens.\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_47_0.png)\n\
    \n- On clicking **Next**, the **Define a New Server** screen opens.\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_48_0.png)\n\
    \n## Getting Started\n\n- We set up Geronimo server for Eclipse by clicking on\
    \ **Download additional server adapters**. Then, the **Install New Adapter** dialog\
    \ box opens. We select **Geronimo Core Feature** and click on **Next** to continue\
    \ to accept the license screen. After we accept the license, Eclipse downloads\
    \ and installs the plugin.\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_49_0.png)\n\
    \n- We repeat the previous step for **Geronimo v2.x Server Adapter**.\n"
  mdcn: "\n\n## 使用 Creator 及其属性\n\n在 `allow` 元素中存在 creator 和 converter。Creator 用于创建在浏览器中使用的\
    \ JavaScript 对象。以下是 `create` 元素的结构：\n\n```\n```xml\n<create creator=\"...\" javascript=\"\
    ...\" scope=\"...\">\n    <param name=\"...\" value=\"...\"/>\n    <auth method=\"\
    ...\" role=\"...\"/>\n    <exclude method=\"...\"/>\n    <include method=\"...\"\
    />\n</create>\n```\n```\n\n只有 creator 和 javascript 属性是强制性的，其余均为可选。\n\ncreator\
    \ 属性指定 DWR 如何创建 Java 对象。它可以是：\n\n- `new`—这使用 Java 对象的 new 操作符。这是使用最广泛的。\n- `none`—它不创建任何对象。这假定对象已由其他人创建或要调用的方法是静态的。\n\
    - `scripted`—它使用脚本语言创建对象。例如当远程的 Java 对象是单例时很有用。这需要 BSF（Apache 的 Bean Scripting\
    \ Framework http://jakarta.apache.org/bsf/）以及 BeanShell 等脚本语言包在 Web 应用的类路径中。\n\
    - `spring`—它使用 Spring Framework 来提供对 Java 对象的访问。\n- `jsf`—它使 JSF 管理的 Bean 能够被远程访问。\n\
    - `struts`—它使 Struts FormBeans 作为远程对象。\n- `pageflow`—它提供对 Weblogic/ Beehive PageFlow\
    \ 对象的访问。\n\n`javascript` 属性为 Java 对象提供一个在浏览器端使用的名称。\n\n`scope` 元素用于指定 Bean 可用的位置。例如，scope\
    \ 可以有值：`application`、`request`、`session`、`page` 和 `script`。前四个与 Servlet 开发中的相同，而\
    \ `script` 允许 Bean 与页面中的 ID 绑定而不是 HTTP 会话 Cookie。默认作用域为 page。\n\n`param` 元素用于配置所选的\
    \ creator。例如，new creator 有一个名为 `class` 的参数，其值是我们想要远程的 Java 类的全限定类名。使用 new creator\
    \ 时会使用默认构造函数创建 Java 对象。\n\n## 入门\n\nauth 元素用于指定用于访问控制检查的 J2EE 角色级别。\n\n`include`\
    \ 和 `exclude` 两个元素用于限制对类方法的访问。其中一个元素可用于限制访问。当使用 `include` 元素时，DWR 假定除 include\
    \ 元素中指定的方法之外的所有其他方法都被限制。另一方面，`exclude` 元素则具有相反的效果，它允许访问除 exclude 元素中指定的方法之外的所有方法。默认情况下，远程对象中的所有方法都是可访问的。例如，以下代码片段有两个远程对象，JavaObjectOne\
    \ 和 JavaObjectTwo，其中第一个对象仅允许访问一个方法，而第二个对象允许访问除 exclude 元素中指定的方法之外的所有方法。\n\n```\n\
    ```xml\n<create creator=\"new\" javascript=\"accessorOne\">\n    <param name=\"\
    class\" value=\"my.JavaObjectOne\"/>\n    <include method=\"getOptionElementsForUser\"\
    />\n</create>\n\n<create creator=\"new\" javascript=\"accessorTwo\" scope=\"session\"\
    >\n    <param name=\"class\" value=\"my.JavaObjectTwo\"/>\n    <exclude method=\"\
    setInternalVariable\"/>\n</create>\n```\n```\n\n## 使用 Converter 元素\n\nconverter\
    \ 元素用于指定如何将方法参数从 JavaScript 转换为 Java。如果参数基于 Java 原始类型、字符串、`java.util.Date` 或上述对象的数组/集合，则不需要转换器。\n\
    \n对于自定义 JavaBean 和其他参数需要转换器。例如，对于如下 JavaBean，我们必须指定 Bean 转换器。\n\n```\n```java\n\
    package my.package;\npublic class StockInfo\n{\n    public void setClosingPrice(double\
    \ price) { ... }\n    public void setVolume(long volume) { ... }\n}\n```\n```\n\
    \nBean 转换器由 DWR 提供，它将 JavaBean 对象转换为 JavaScript 关联数组，反之亦然。`dwr.xml` 中的条目为：\n\n\
    ```\n```xml\n<convert converter=\"bean\" match=\"my.package.StockInfo\"/>\n```\n\
    ```\n\n需要手动指定转换器，因为 DWR 需要知道允许它触及我们的代码。此功能对安全性有益，因为它让我们负责给予某些操作的权限，而不是 DWR 默认执行我们不想要的操作。\n\
    \n除了 Bean 转换器之外，还有一些其他转换器。有一个 Object 转换器，它直接作用于对象成员而不是像 Bean 转换器那样的 getter 和 setter。然后还有用于数组、Java\
    \ 集合、DOM 对象和枚举的转换器。也可以开发自定义转换器，但在需要自定义转换器的情况下很少见。\n\n## 使用注解\n\n注解在 Java 5 中引入，DWR\
    \ 支持通过注解进行配置，而不是（或与）XML 配置一起使用。为了使用注解，web.xml 文件中的 DWR servlet 条目必须在 classes 初始化参数中指定所有带注解的类，如以下示例所示。\n\
    \n```\n```xml\n<init-param>\n    <param-name>classes</param-name>\n    <param-value>\n\
    \        my.class.StockInfo,\n        my.class.OtherInfo\n    </param-value>\n\
    </init-param>\n```\n```\n\n以下是 DWR 的带注解类的示例。\n\n```\n```java\n@RemoteProxy(name=\"\
    market\")\npublic class StockMarket\n{\n    @RemoteMethod\n    public double getLatestPrice(String\
    \ symbol) { ... }\n}\n```\n```\n\n注解 @RemoteProxy 使类可用于远程访问，其 name 属性指定对象的 JavaScript\
    \ 名称。我们需要远程访问的所有方法都必须具有 @RemoteMethod 注解。通过 @DataTransferObject 和 @RemoteProperty\
    \ 注解可实现对自定义 bean 类的转换。\n\n相比之下，上述 StockInfo 类将在 dwr.xml 配置中具有以下条目。\n\n```\n<create\
    \ creator=\"new\" javascript=\"market\">\n  <param name=\"class\" value=\"my.class.StockMarket\"\
    />\n  <include method=\"getLatestPrice\"/>\n</create>\n```\n\n## 使用 DWR 的 Fluent\
    \ 配置\n\nFluent 配置风格由 Martin Fowler（http://www.martinfowler.com/bliki/FluentInterface.html）在几年前描述。单词“Fluent”来自于能够“流畅地”描述配置的能力。参考以下示例（来自\
    \ DWR 网站）：\n\n```\npublic void configure() {\n    withConverterType(\"dog\", \"\
    com.yourcompany.beans.Dog\");\n    withCreatorType(\"ejb\", \"com.yourcompany.dwr.creator.EJBCreator\"\
    );\n    withCreator(\"new\", \"ApartmentDAO\")\n        .addParam(\"scope\", \"\
    session\")\n        .addParam(\"class\", \"com.yourcompany.dao.ApartmentDAO\"\
    )\n        .exclude(\"saveApartment\")\n        .withAuth(\"method\", \"role\"\
    );\n    withCreator(\"struts\", \"DogDAO\")\n        .addParam(\"class\", \"com.yourcompany.dao.DogDAO\"\
    )\n        .include(\"getDog\")\n        .include(\"getColor\");\n    withConverter(\"\
    dog\", \"*.Dog\")\n        .addParam(\"name\", \"value\");\n    withSignature()\n\
    \        .addLine(\"import java.util.List;\")\n        .addLine(\"import com.example.Check;\"\
    )\n        .addLine(\"Check.setLotteryResults(List nos);\");\n```\n\nFluent 配置通过程序化配置启用，为了在\
    \ DWR 中使用它，web.xml 文件中的 customConfigurator 初始化参数必须指向一个继承自抽象 org.directwebremoting.fluent.FluentConfigurator\
    \ 类的类，并且其 configure 方法。\n\n## 入门\n\n- 启动 Eclipse 后，我们为 Geronimo 指定一个新的服务器运行时。转到\
    \ **New | Other**，**Select a wizard** 对话框打开。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_47_0.png)\n\
    \n- 单击 **Next** 后，**Define a New Server** 屏幕打开。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_48_0.png)\n\
    \n## 入门\n\n- 我们通过单击 **Download additional server adapters** 为 Eclipse 设置 Geronimo\
    \ 服务器。然后，**Install New Adapter** 对话框打开。我们选择 **Geronimo Core Feature** 并单击 **Next**\
    \ 继续接受许可屏幕。接受许可后，Eclipse 下载并安装插件。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_49_0.png)\n\
    \n- 我们对 **Geronimo v2.x Server Adapter** 重复上一步。\n\n"
