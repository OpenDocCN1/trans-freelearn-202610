    \ the page, before declaring the DWR functions, there is a piece of Java code\
    \ whose purpose is to check whether the page request is valid or not. It is done\
    \ by checking the user session, and if the username is found from the session,\
    \ the request is valid and if the username is not found from the session, then\
    \ an empty screen is shown to the user. This is because we don't want users to\
    \ go directly to the main page (when doing further development, the login page\
    \ could be shown here, instead of an empty page).\n\nAfter checking the user session\
    \ we load the DWR scripts. We have only two Java classes in this sample application,\
    \ Login and BookDatabase.\n\nAt the start of the script element, we enable reverse\
    \ AJAX (Comet) for our use. The first two functions do the logout, and redirect\
    \ the user to the login screen while the third function, showUsersOnline(), displays\
    \ logged-in users on the left side of the screen. As we will see later, reverse\
    \ AJAX is used to call this on each user's page when a new user logs into the\
    \ system. The function also uses the DWR utility functions to populate tables\
    \ with usernames.\n\nThe getBookLists() function calls the BookDatabase Java class\
    \ and retrieves a list of books that are in progress and books that are published.\
    \ It shows the lists in the HTML page's left navigation. For a book that is in\
    \ progress, a link to open a chapter page is created, and for published books,\
    \ a link to open the book page is created.\n\nThe getChapters() function calls\
    \ the getChaptersForTitle() function, which calls the BookDatabase class and gets\
    \ the chapter titles for the clicked book. The function also inserts the voting\
    \ button for authors, and shows the current situation of votes, and shows the\
    \ number of authors who have voted among the total.\n\nThe showBook() function\
    \ retrieves a rendered book from the BookDatabase and shows it in the HTML page.\n\
    \nThe function voteForPublish() takes the user's vote and updates the voting status\
    \ of the specified book. The refreshChapterIfVisible() function updates the user's\
    \ screen if changes happen in the book content, and the clearChapterViewIfVisible()\
    \ function clears the contents of the book if a user is viewing it and the book\
    \ is voted to be published.\n\nThe notifyBookPublished() function notifies the\
    \ user that a book has been published and clears the book content if it is visible.\n\
    \nThe getChapterContent() function shows the chapter content in the editable text\
    \ area where the user can edit a chapter. If someone else is currently editing\
    \ the chapter, the read-only text area is shown to the user, and the content of\
    \ the area is the latest content that has been saved by the author.\n\nThe cancelChapterContentEdit(),\
    \ closeChapterContentEdit(), and the saveChapterContent() functions correspond\
