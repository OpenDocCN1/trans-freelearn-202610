  - '[PAGE 54]


    Packaging is easy because of built-in Eclipse tools.


    +   - We select the project name and right-click to get the context menu; under
    the **Export** menu item, we find the **WAR** option.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_54_0.png)'
  - '[PAGE 55]


    +   - After we click the **WAR** option, a **WAR Export** dialog opens where we
    choose the **Destination** and a name for the WAR file: d:\temp\HelloWorldServlet.war.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_55_0.png)


    +   - For the deployment, we have installed a standalone Geronimo application
    server. Run Geronimo using the **startup** script file (and remember to set the
    `JAVA_HOME` environment variable). The following screenshot displays typical output
    when starting the Geronimo server using the **startup** script.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_55_1.png)'
  - '[PAGE 56]


    # Deployment Using the Administration Console


    Deployment can be done using the Geronimo Administration Console.


    +   1. After starting the Geronimo server, open Geronimo web console. The default
    location is http://127.0.0.1:8080/console. The default administrator user name
    is system, and the password is manager. After login to the system, we will see
    the Geronimo Administration Console. On the left side, there is a menu for administrative
    tasks, and on the right side there are links to common tasks, documentation, and
    other resources.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_56_0.png)'
  - '[PAGE 57]


    # Getting Started


    2. Installation is a straightforward task. We select Deploy Applications present
    in the Common Console Actions box or Deploy New Application present on the left
    in Console Navigation. The following screen opens where we specify the HelloWorldServlet.war
    file.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_57_0.png)


    3. After pressing Install, Geronimo displays the status of the operation.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_57_1.png)


    Now that the application has been installed, we can test it. There are two things
    we need to know: context path and servlet mapping. We specified the servlet mapping
    during development, and we get it from the web.xml file; it is HelloWorld. We
    get the context path from Geronimo.'
  - '[PAGE 58]


    4. The Web App WAR''s link in the Console Navigation opens an Installed Web Applications
    screen, and there we see a list of applications and in the URL column there is
    the context path.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_58_0.png)


    5. Now that we have context path and servlet mapping, we open our servlet in a
    browser: http://127.0.0.1:8080/HelloWorldServlet/HelloWorld and we are able to
    see the world famous message.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_58_1.png)


    Uninstalling, stopping, and restarting of applications are done via the Installed
    Web Applications screen.


    The Administration console is very useful especially when we start to perform
    development work or while occasionally testing some applications in Geronimo.
    However, during development, it is better to use a command-line-based deployer
    tool.'
