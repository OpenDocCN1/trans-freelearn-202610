    insert into country_data (short_name,long_name,code,capital) values ('Finland','Republic\
    \ of Finland','FI','Helsinki');\n...\n```\n\nAfter executing these commands in\
    \ the DB manager, we see the contents of the table in the Geronimo DB Viewer.\n\
    \n| ID | SHORT_NAME | LONG_NAME | CODE | CAPITAL | NOTES |\n|---|---|---|---|---|---|\n\
    | 1 | Afghanistan | Islamic Republic of Afghanistan | AF | Kabul |  |\n| 2 | Albania\
