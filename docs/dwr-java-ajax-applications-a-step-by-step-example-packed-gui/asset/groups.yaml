  - "[PAGE 42]\n\n# Using Creator and Its Attributes\n\nWithin the `allow` element\
    \ there are creators and converters. Creators are used to create JavaScript objects\
    \ that are used in the browser. The following is the structure of the `create`\
    \ element:\n\n```\n```xml\n<create creator=\"...\" javascript=\"...\" scope=\"\
    ...\">\n    <param name=\"...\" value=\"...\"/>\n    <auth method=\"...\" role=\"\
    ...\"/>\n    <exclude method=\"...\"/>\n    <include method=\"...\"/>\n</create>\n\
    ```\n```\n\nOnly creator and javascript attributes are mandatory, while others\
    \ are optional.\n\nThe creator attribute specifies how DWR creates a Java object.\
    \ It can be:\n\n+   - `new`—This uses the Java objects new operator. This is very\
    \ commonly used.\n+   - `none`—It does not create any object. This assumes that\
    \ the object has already been created by someone else or the method to be called\
    \ is static.\n+   - `scripted`—It uses a scripting language to create objects.\
    \ It is useful for example when a remoted Java object is singleton. This requires\
    \ BSF (Bean Scripting Framework from Apache http://jakarta.apache.org/bsf/) and\
    \ any scripting language package, such as BeanShell, in the web application classpath.\n\
    +   - `spring`—It uses Spring Framework to give access to a Java object.\n+  \
    \ - `jsf`—It enables JSF managed beans to be remoted.\n+   - `struts`—It enables\
    \ Struts FormBeans as remoted objects.\n+   - `pageflow`—It gives access to Weblogic/\
    \ Beehive PageFlow objects.\n\nThe `javascript` attribute gives the Java object\
    \ a name that is used in the browser side.\n\nThe `scope` element is used to specify\
    \ where a bean is available. For example, scope can have values: `application`,\
    \ `request`, `session`, `page`, and `script`. The first four are the same as in\
    \ servlet development and `script` allows a bean to be tied to an ID in a page\
    \ rather than an HTTP session cookie. The default scope is page.\n\nThe `param`\
    \ element is used to configure the chosen creator. For example, new creator has\
    \ a parameter called `class`, and its value is a fully qualified class name of\
    \ the Java class we want to remote. The default constructor is used to create\
    \ Java objects with the new creator."
  - "[PAGE 43]\n\n# Getting Started\n\nThe auth element is used to specify the J2EE\
    \ role level that is used for access control checking.\n\nTwo elements `include`\
    \ and `exclude` are used to limit access to class methods. One of the elements\
    \ may be used to limit access. When the `include` element is used DWR assumes\
    \ that all other methods are restricted except those specified in the include\
    \ element. The `exclude` element on the other hand has the opposite effect and\
    \ gives access to all methods except to those specified in the exclude element.\
    \ By default, all methods are accessible in the remoted object. For example, the\
    \ following code snippet has two remoted objects, JavaObjectOne and JavaObjectTwo,\
    \ where the first object allows access to only one method, and the second allows\
    \ access to all methods except the one specified in the exclude element.\n\n```\n\
    ```xml\n<create creator=\"new\" javascript=\"accessorOne\">\n    <param name=\"\
    class\" value=\"my.JavaObjectOne\"/>\n    <include method=\"getOptionElementsForUser\"\
    />\n</create>\n\n<create creator=\"new\" javascript=\"accessorTwo\" scope=\"session\"\
    >\n    <param name=\"class\" value=\"my.JavaObjectTwo\"/>\n    <exclude method=\"\
    setInternalVariable\"/>\n</create>\n```\n```\n\n# Using the Converter Element\n\
    \nThe converter element is used to specify how method parameters are converted\
    \ from JavaScript to Java. Converters are not needed if parameters are based on\
    \ Java primitive types, strings, `java.util.Date` or arrays/collections of mentioned\
    \ objects.\n\nConverters are needed for custom JavaBean and other parameters.\
    \ For example, for a JavaBean such as the following, we would have to specify\
    \ a Bean converter.\n\n```\n```java\npackage my.package;\npublic class StockInfo\n\
    {\n    public void setClosingPrice(double price) { ... }\n    public void setVolume(long\
    \ volume) { ... }\n}\n```\n```\n\nThe Bean converter is provided by DWR, and it\
    \ converts JavaBean objects to JavaScript associative arrays and vice-versa. Entry\
    \ in `dwr.xml` would be:\n\n```\n```xml\n<convert converter=\"bean\" match=\"\
    my.package.StockInfo\"/>\n```\n```"
  - "[PAGE 44]\n\nConverters need to be specified manually because it is necessary\
    \ for DWR to know that it is allowed to touch our code. This feature is good for\
    \ security since it leaves us the responsibility of giving permissions to certain\
    \ actions rather than DWR doing something by default that we don't want.\n\nIn\
    \ addition to the Bean converter, there are a few other converters. There is an\
    \ Object converter, which works directly on object members instead of getters\
    \ and setters like the Bean converter. Then there are converters for arrays, Java\
    \ Collections, DOM objects, and enums. Custom converters may also be developed,\
    \ but it is a rare situation when a custom converter is needed.\n\n# Working with\
    \ Annotations\n\nAnnotations were introduced in Java 5, and DWR supports configuration\
    \ by annotations instead of (or in conjunction with) XML configuration. In order\
    \ to use annotations, the DWR servlet entry in the web.xml file must have all\
    \ the annotated classes specified in the classes init parameter as in the following\
    \ example.\n\n```\n```xml\n<init-param>\n    <param-name>classes</param-name>\n\
    \    <param-value>\n        my.class.StockInfo,\n        my.class.OtherInfo\n\
    \    </param-value>\n</init-param>\n```\n```\n\nThe following is a sample of an\
    \ annotated class for DWR.\n\n```\n```java\n@RemoteProxy(name=\"market\")\npublic\
    \ class StockMarket\n{\n    @RemoteMethod\n    public double getLatestPrice(String\
    \ symbol) { ... }\n}\n```\n```\n\nThe annotation @RemoteProxy makes a class available\
    \ for remoting, and the name of its attribute specifies the JavaScript name for\
    \ the object. All methods that we need for remote access must have the @RemoteMethod\
    \ annotation. Conversions to make custom bean classes are available through @DataTransferObject\
    \ and @RemoteProperty annotations."
  - "[PAGE 45]\n\nIn comparison, the above StockInfo class would have the following\
    \ entry in the dwr.xml configuration.\n\n```\n<create creator=\"new\" javascript=\"\
    market\">\n  <param name=\"class\" value=\"my.class.StockMarket\"/>\n  <include\
    \ method=\"getLatestPrice\"/>\n</create>\n```\n\n# Using Fluent Configuration\
    \ with DWR\n\nFluent configuration style was described by Martin Fowler (http://www.martinfowler.com/bliki/FluentInterface.html)\
    \ a few years ago. The word \"Fluent\" comes from the ability to \"fluently\"\
    \ describe the configuration. Refer to the following example (from the DWR website):\n\
    \n```\npublic void configure() {\n    withConverterType(\"dog\", \"com.yourcompany.beans.Dog\"\
    );\n    withCreatorType(\"ejb\", \"com.yourcompany.dwr.creator.EJBCreator\");\n\
    \    withCreator(\"new\", \"ApartmentDAO\")\n        .addParam(\"scope\", \"session\"\
    )\n        .addParam(\"class\", \"com.yourcompany.dao.ApartmentDAO\")\n      \
    \  .exclude(\"saveApartment\")\n        .withAuth(\"method\", \"role\");\n   \
    \ withCreator(\"struts\", \"DogDAO\")\n        .addParam(\"class\", \"com.yourcompany.dao.DogDAO\"\
    )\n        .include(\"getDog\")\n        .include(\"getColor\");\n    withConverter(\"\
    dog\", \"*.Dog\")\n        .addParam(\"name\", \"value\");\n    withSignature()\n\
    \        .addLine(\"import java.util.List;\")\n        .addLine(\"import com.example.Check;\"\
    )\n        .addLine(\"Check.setLotteryResults(List nos);\");\n```\n\nFluent configuration\
    \ is enabled by programmatic configuration, and in order to use it with DWR, a\
    \ customConfigurator init parameter in the web.xml file must point to a class\
    \ that subclasses the abstract org.directwebremoting.fluent.FluentConfigurator\
    \ class and its configure method."
