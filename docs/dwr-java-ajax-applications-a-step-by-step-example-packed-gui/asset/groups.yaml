    \ following screenshot:\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_94_0.png)\n"
  mdcn: "\n\n我们知道为什么会发生 **AppContent is not defined** 错误，因此通过在 `dwr.xml` 文件的 `allow`\
