    # Sample Applications


    The BookDatabase class has three static Map variables: `booksInProgress`, `publishedBooks`,
    and `editedChapters`. These hold the current state of the Book Authoring system
    about which books are in progress, and which have been published. Note that the
    books are not persistent.


    The `getBooksInProgressTitles()` and `getPublishedBookTitles()` methods use the
    `getTitles()` method that takes a Collection of books and extracts title names
    from the Book objects and returns a List of titles to the browser.


    The `getChapters()` method returns the Collection of chapter titles in a specified
    Book object.


    The `isChapterEdited()` method checks whether a specified chapter in a specified
    book is currently being edited by a user or not. If the chapter is not being edited,
    the method returns null.


    The `cancelChapterEdit()` method removes a chapter from the edited chapters list.


    The `getAuthors()` method returns a List of authors of a specified book.


    The `getBook()` method returns a Book object either from `booksInProgress` List
    or `publishedBooks` List.


    The `addNewBook()` and `insertChapter()` methods start a new book or insert a
    new chapter to an existing book, and also update the necessary variables and use
    reverse AJAX to notify all the browsers about the changes.


    The `getChapterContent()` method returns the chapter contents and marks the chapter
    as being edited if no one is editing it currently. The `saveChapterContent()`
    method saves the chapter and updates the author list if necessary.


    The `amIAuthor()` method checks whether or not the current user is one of the
    book authors.


    The `haveIVoted()`, `getNumberOfAuthors()`, and `voteForPublish()` methods are
    used to check if the user has already voted and to vote for publishing, in which
    case the user interface is updated using reverse AJAX about the new voting status.


    The `getRenderedBook()` method returns the rendered book content. Rendering of
    the book happens in the Book object''s `toString()` method.


    The `getScriptProxyForSessions()` method is used in reverse AJAX, and it returns
    the DWR object ScriptProxy for all the users in the main page of the application.
    The ScriptProxy object is used to call a named JavaScript function in the main
    page.'
