    insert into country_data (short_name,long_name,code,capital) values ('Finland','Republic\
    \ of Finland','FI','Helsinki');\n...\n```\n\n在数据库管理器中执行这些命令后，我们会在 Geronimo 数据库查看器中看到表的内容。\n\
    \n| ID | 短名 | 长名 | 代码 | 首都 | 备注 |\n|---|---|---|---|---|---|\n| 1 | 阿富汗 | 阿富汗伊斯兰共和国\
    \ | AF | 喀布尔 |  |\n| 2 | 阿尔巴尼亚 | 阿尔巴尼亚共和国 | AL | 地拉那 |  |\n| 3 | 阿尔及利亚 | 阿尔及利亚人民民主共和国\
    \ | AG | 阿尔及尔 |  |\n| 4 | 安道尔 | 安道尔公国 | AN | 安道尔城 |  |\n| 5 | 安哥拉 | 安哥拉共和国 | AO\
    \ | 罗安达 |  |\n| 6 | 安提瓜和巴布达 | （无长名） | AC | 圣约翰 |  |\n| 7 | 阿根廷 | 阿根廷共和国 | AR |\
    \ 布宜诺斯艾利斯 |  |\n| 8 | 亚美尼亚 | 亚美尼亚共和国 | AM | 埃里温 |  |\n| 9 | 澳大利亚 | 澳大利亚联邦 | AS\
