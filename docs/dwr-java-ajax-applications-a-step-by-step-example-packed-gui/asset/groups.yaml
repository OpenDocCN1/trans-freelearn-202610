    ```


    This is quite a large page since all the client-side logic is included in the
    JavaScript functions within this HTML page. Let''s go through the page source.


    At the start of the page, before declaring the DWR functions, there is a piece
    of Java code whose purpose is to check whether the page request is valid or not.
    It is done by checking the user session, and if the username is found from the
    session, the request is valid and if the username is not found from the session,
    then an empty screen is shown to the user. This is because we don''t want users
    to go directly to the main page (when doing further development, the login page
    could be shown here, instead of an empty page).


    After checking the user session we load the DWR scripts. We have only two Java
    classes in this sample application, Login and BookDatabase.


    At the start of the script element, we enable reverse AJAX (Comet) for our use.
    The first two functions do the logout, and redirect the user to the login screen
    while the third function, showUsersonline(), displays logged-in users on the left
    side of the screen. As we will see later, reverse AJAX is used to call this on
    each user''s page when a new user logs into the system. The function also uses
    the DWR utility functions to populate tables with usernames.


    The getBookLists() function calls the BookDatabase Java class and retrieves a
    list of books that are in progress and books that are published. It shows the
    lists in the HTML page''s left navigation. For a book that is in progress, a link
    to open a chapter page is created, and for published books, a link to open the
    book page is created.'
  - '[PAGE 191]


    The getChapters() function calls the getChaptersForTitle() function, which calls
    the BookDatabase class and gets the chapter titles for the clicked book. The function
    also inserts the voting button for authors, and shows the current situation of
    votes, and shows the number of authors who have voted among the total.


    The showBook() function retrieves a rendered book from the BookDatabase and shows
    it in the HTML page.


    The function voteforPublish() takes the user''s vote and updates the voting status
    of the specified book. The refreshChapterIfVisible() function updates the user''s
    screen if changes happen in the book content, and the clearChapterViewIfVisible()
    function clears the contents of the book if a user is viewing it and the book
    is voted to be published.


    The notifyBookPublished() function notifies the user that a book has been published
    and clears the book content if it is visible.


    The getChapterContent() function shows the chapter content in the editable text
    area where the user can edit a chapter. If someone else is currently editing the
    chapter, the read-only text area is shown to the user, and the content of the
    area is the latest content that has been saved by the author.


    The cancelChapterContentEdit(), closeChapterContentEdit(), and the saveChapterContent()
    functions correspond to the buttons with the same name in the chapter edit page.
    The save function also calls the setFeedback() function to show the user the time
    of the save event.


    The startNewBook() and addChapter() functions are used to add a book or a chapter
    in a book. The refreshBookLists() function just calls the getBookLists() function
    to get the current books in the user interface. The last function, clearContentAreas(),
    clears the book content.


    The rest of the page is HTML code, and the content includes the headlines and
    the place holders, and div elements, that are used by JavaScript functions.


