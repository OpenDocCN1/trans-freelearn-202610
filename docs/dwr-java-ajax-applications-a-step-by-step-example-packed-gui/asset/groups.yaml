    book** link and a dialog box pops up asking for the name of the book.


    After **Brown** enters the name, the **Books in progress** list is updated in
    both the browsers. Smith can now see the new book in progress in the following
    screenshot:


    ![](img/5b721cfaa97eb697efc92e3914f62fca_207_0.png)


    Smith clicks the **Our First Book** link, and a screen with the list of chapters
