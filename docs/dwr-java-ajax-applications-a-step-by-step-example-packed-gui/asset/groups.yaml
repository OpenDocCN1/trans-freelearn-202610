    \                (contextPath + \"/mainpage.jsp\");\nScriptProxy proxy = new ScriptProxy(sessions);\n\
    return proxy;\n}\nreturn null;\n}\n\npublic void postNewMessage(String newMessage)\
    \ {\n    ScriptProxy proxy = getScriptProxyForSessions();\n    if (proxy != null)\
    \ {\n        proxy.addFunctionCall(\"<newMessage>\",newMessage);\n    }\n}\n}\n\
    ```\n\n聊天室代码出人意料地简单。聊天内容存储在一个 `Vector` 的 `Strings` 中。`getChatContent()` 方法只是将聊天内容\
    \ `Vector` 返回给浏览器。\n\n当用户发送新的聊天消息时，会调用 `postMessage()` 方法。该方法验证用户是否已登录，并将当前时间和用户名添加到聊天消息中，然后将消息附加到聊天内容中。\n\
    \n该方法还调用 `postNewMessage()` 方法，该方法用于向所有已登录用户显示新的聊天内容。注意 `postMessage()` 方法不返回任何值。我们让\
    \ DWR 和反向 AJAX 功能将聊天消息显示给所有用户，包括发送消息的用户。\n\n`getScriptProxyForSessions()` 和 `postNewMessage()`\
    \ 方法使用反向 AJAX 用新消息更新所有已登录用户的聊天区域。\n\n就这样！聊天室示例非常直接，基本功能已经就位，应用程序已准备好进行进一步开发。\n\
    \n## 测试聊天\n\nSmith 和 Brown 登录系统并交换了一些消息。两者在登录并开始聊天时看到空的聊天室。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_219_0.png)\n\
    \n发送消息输入字段上方保留的空区域用于聊天内容。Smith 和 Brown 交换了一些消息，如以下屏幕截图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_219_1.png)\n\
    \n第三个用户 Jones 加入聊天并在聊天室中看到所有之前的消息。Jones 然后与 Smith 和 Brown 交换了一些消息。Smith 和 Brown\
    \ 从系统中注销，留下 Jones 单独在聊天室中，直到她也注销为止。这在以下屏幕截图中可见：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_220_0.png)\n\
    \n## 后记\n\n本示例应用程序展示了如何在聊天室应用程序中使用 DWR。其功能与之前的图书作者应用程序类似。\n\n## 摘要\n\n本章中介绍的两个示例应用程序，协作式图书创作和聊天室，很明显\
    \ DWR 使开发此类协作应用程序变得非常容易。\n\nDWR 本身甚至在应用程序中没有发挥很大的作用。DWR 只是应用程序的一个透明功能。因此，开发人员专注于实际项目和诸如数据持久性和整洁用户界面之类的方面，而不是\
    \ AJAX 的低级细节。\n\n## 索引\n\n### A\n\n- **AJAX**\n  - about 7\n  - components 9\n\
