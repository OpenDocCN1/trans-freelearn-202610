    _NotesCell\");\n        td.innerHTML=notesHtml;\n    }\n    });\n}\n```\n\n有很多用于表格示例的函数，我们逐一介绍它们。\n\
    \n第一个是 selectLetter() 函数。此函数从 select 元素获取选定的字母并调用 CountryDB.getCountries() 远程\
    \ Java 方法。回调函数的 setCountryRows。此函数接收来自 Java getCountries() 方法的返回值，即 List<List<String>>，一个字符串列表的列表。\n\
