    ## Introduction


    DWR 允许在浏览器中使用服务器端的 Java 类（它就像 JavaScript 函数与服务器端 Java 之间的 RPC）并且还允许在服务器中使用 JavaScript
    函数（Reverse AJAX）。通过基于 XML 的配置，DWR 动态生成 Java 类的 JavaScript 函数，可通过 DWR JavaScript
    库从浏览器调用。服务器端的 DWR servlet 接收请求并调用实际的 Java 实现。


    下图显示了 DWR 在用户应用程序中的定位，并取自 DWR 网站（http://directwebremoting.org/dwr/overview/dwr）。


    ![](img/5b721cfaa97eb697efc92e3914f62fca_19_0.png)


    在上图中，JavaScript 函数 **eventHandler()** 响应某些浏览器事件，如点击按钮。事件处理程序使用 **AjaxService**
    对象并调用 **getOptions()** 方法，就好像 **AjaxService** 是一个普通的 JavaScript 对象一样。开发人员可以实现客户端和服务器端代码，并将客户端与服务器之间的通信交给
    DWR 处理。


    从 JavaScript 调用服务器端 Java 会导致很多事情发生，并且在幕后也需要很多事情发生：


    - 当请求一个启用了 DWR 的网页时，DWR 根据配置从 Java 类动态生成 JavaScript 函数。

    - 当函数 **eventHandler()** 被调用时，例如点击按钮时，开发人员调用一个动态生成的函数（上图中显示的 **AjaxService.getOptions(populateList)**），DWR
    JavaScript 库获取参数，对其进行序列化，并调用服务器上的 DWR servlet。

    - DWR servlet 接收请求，并根据配置，servlet 实例化一个 Java 对象，例如 **AjaxService**，并调用所需的方法，例如
    **AjaxService.getOptions(populateList)**。

    - 当 Java 方法执行完毕后，返回值（一个 String 数组）返回给 DWR servlet，servlet 对返回值进行序列化并将响应发送到浏览器上的
