  mdcn: "\n\n## 用户界面：高级元素\n\n### 地图滚动\n\n在这个示例中，按下鼠标按钮，然后将光标向右移动。当光标越过黑色边框时，我们通过已编写的\
    \ JavaScript 代码感知到这一动作，它便会触发地图滚动并更新图像。在截图中将鼠标向右移动并越过边框后，地图向右滚动，如下图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_136_0.png)\n\
    \n上面的截图还包含一个手绘的黑色箭头。当我们（按住按钮）将光标向下移动时，再次越过边框，地图向下滚动，如下图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_137_0.png)\n\
    \n使用火星坦佩-马雷奥蒂斯区域地质图的简单地图滚动器。\n完整描述见[此处]。\n\n缩放级别：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_137_1.png)\n\
    \n### 后记\n\n这个地图滚动器示例展示了一种非常用户友好的滚动地图或图像的方法。我们还看到该实现非常以客户端为中心，因为我们服务器端的 Java 代码（通过远程调用）只有一个类和一个方法。\n\
    \n### 小结\n\n本章介绍了许多应用程序中可用的用户界面组件。所有接受用户输入的应用程序中都有表单。导航树对用户友好，而在特定应用程序中，地图滚动被视为必需功能。\n\
    \n使用 DWR 可以轻松地使用这些用户界面组件。DWR 使为应用程序添加非常动态的行为变得容易。尽管示例或多或少是硬编码的，但主要思想已经呈现，示例代码是开发非硬编码应用程序的良好起点。\n\
    \n## 6 后端集成\n\n本章介绍如何将 Web 应用程序与各种后端服务集成。几乎所有应用程序都涉及数据库，因此本章的第一个示例展示了一种从 DWR 应用程序访问数据库的方法。第二个示例与标准\
    \ Web 服务集成，而第三个示例使用 JMS 消息传递来访问后端服务。JMS 示例还演示了如何使用 DWR 实现反向 AJAX（Comet）。\n\n本章包含以下部分：\n\
    \n- 将数据库与 DWR 集成——展示如何使用 DWR 访问数据库\n- 与 Web 服务集成——使用 Eclipse 工具为我们的 DWR 应用程序生成\
    \ Web 服务客户端\n- 与消息系统集成——使用 ActiveMQ 和 JMS 将我们的 DWR 应用程序与基于 Python 的“订单系统”集成\n\n\
    ### 使用 DWR 集成数据库\n\n这里，我们通过一个远程 Java 类公开数据库表，从而将数据库与 DWR 集成。我们的 Java 类使用 JDBC\
    \ 直接连接数据库，相关的 SQL 语句也包含在该类中。其他访问数据库的方式包括 EJB、Hibernate 及许多其他方式。\n\n这里的示例替换了第 4\
    \ 章“表格和列表”中的第一个示例，使国家数据来自数据库而不是 CSV 文件。从应用程序的角度来看，只需要修改 `dwr.xml` 文件，即将条目改为指向处理数据库访问的\
    \ Java 类。在我们实现 Java 类之前，必须先设置并填充数据库。这里我们使用 Apache Derby 数据库，它随 Geronimo 应用服务器一起发布。\n\
    \n3. 以下 SQL 命令创建一个国家数据表。\n\n```\nCREATE TABLE country_data (\n    id INTEGER generated\
    \ always as identity,\n    short_name VARCHAR(64) NOT NULL,\n    long_name VARCHAR(256)\
    \ NOT NULL,\n    code CHAR(2) NOT NULL,\n    capital VARCHAR(64) NOT NULL,\n \
    \   notes VARCHAR(256) DEFAULT ''\n);\nALTER TABLE country_data ADD CONSTRAINT\
    \ pkey PRIMARY KEY (id);\n```\n\n4. 将 SQL 插入命令区域，然后点击“运行 SQL”按钮。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_142_0.png)\n\
    \n我们可以使用 **Geronimo 控制台**查看数据库中的表。下面的截图中有一个**数据库列表**，其中包含用于查看应用程序表及其内容的链接：\n\n\
    ![](img/5b721cfaa97eb697efc92e3914f62fca_143_0.png)\n\n下面的截图显示了**数据库列表**中带有查看表内容链接的应用程序表：\n\
    \n![](img/5b721cfaa97eb697efc92e3914f62fca_143_1.png)\n\n表的内容如下：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_143_2.png)\n\
