    and for zoom level 1 the image size is 2000x1632. Both original images are divided
    into squares of 100x100 pixels each, except the bottom part of the map since its
    height is not divisible by 100.


    The following are a few random examples of map squares:


    ![](img/5b721cfaa97eb697efc92e3914f62fca_125_0.png)


