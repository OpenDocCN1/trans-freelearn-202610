  - "[PAGE 36]\n\nThe configuration in `dwr.xml` also includes a create entry for\
    \ each remoted Java class. We can use singleton, new, or some other mechanism.\
    \ We can also limit which methods are allowed using the include and exclude elements\
    \ in `dwr.xml`. There are also security parameters in the `web.xml` configuration\
    \ file such as `allowScriptTagRemoting` and `crossDomainSessionSecurity`, which\
    \ when enabled, may be a huge security risk. So make sure you understand what\
    \ you are doing if you are enabling the parameters.\n\nThere is one configuration\
    \ parameter that is very useful while developing a DWR application, but that is\
    \ a security risk in the production (especially public) site. The following init-param,\
    \ debug, and test mode can be added in the web.xml.\n\n```\n```xml\n<init-param>\n\
    \    <param-name>debug</param-name>\n    <param-value>true</param-value>\n</init-param>\n\
    ```\n```\n\nWhen debug/test mode is enabled, DWR generates test pages (there is\
    \ a sample screen in Chapter 4) that are useful tools to get to know the DWR functionality.\n\
    \nIt is also possible to use JEE access control mechanisms and limit access to\
    \ DWR itself for specific JEE roles. These are specified in the web.xml file.\
    \ Within DWR, there is also a role-based access control to the methods of remoted\
    \ Java objects. DWR can also be integrated with Spring Security (also known as\
    \ Acegi Security), `http://www.acegisecurity.org/`, the official security projects\
    \ of the Spring Portfolio. The description of Acegi and DWR integration is found\
    \ on `http://java-x.blogspot.com/2007/08/handling-security-with-ajax-dwr-and.html`.\n\
    \nDWR is also designed so that there is no possibility of an attacker accessing\
    \ and manipulating DWR core files and changing the security parameters for example.\n\
    \n# Minimize Risks\n\nSecurity is not a trivial issue, and we could spend years\
    \ in the security field and still leave a lot unfinished. As developers, our job\
    \ is to make sure that security risks are minimized, and at least realize what\
    \ might happen if we remote a certain Java method.\n\nA very good example from\
    \ the DWR website is that if we make a remote call to a method called `appendStringToFile()`,\
    \ which appends a given string to a predefined file, then a possible attacker\
    \ can send a large number of requests and fill the file system with nonsense and\
    \ thus cause an unexpected server downtime. The cost of downtime may be anything\
    \ from little inconvenience to millions of dollars."
  - '[PAGE 37]


    In order to prevent giving accidental access that may cause harm, we have to think
    of what we want to do and also check the input parameters. Checking input parameters
    is the most important thing that we as developers can do to make sure accidents
    do not happen.


    In the previous example, if we have remoted the `appendStringToFile()` method,
    we can do lots of checks on whether the file system is filling, whether it is
    a string valid for the purpose for which it was meant (such as log entry to a
    log file), who the requester is, and so on.


    Also make sure that `escapeHTML` is used in order to prevent cross-site scripting
    (XSS) attacks. XSS is something worth knowing about. So please refer to Wikipedia
    (http://en.wikipedia.org/wiki/Cross-site_scripting) for a detailed description.


    # Summary


    This chapter presented an overview of DWR features including JavaScript libraries
    (`util.js`, `engine.js`, and `gi.js`), security, and Reverse AJAX and on basic
    operational elements of how DWR works.


    In addition to the topics discussed in this chapter, DWR has lots of other useful
    features that may or may not be relevant to developers. It depends on the application.
    Topics in this chapter are intended to be high-level overviews, but they will
    give you a good starting point to learn more from the DWR website (http://directwebremoting.org/dwr/documentation)
    and even from the DWR source code.


    Very often, most developers do not need all the features of a technology when
    they start working on a project. After the project has been going on for some
    time, we may find out that the solution has matured to include most if not all
    features of the technology. But that is typically not the initial case and, besides,
    we have to start somewhere and it is practical to start taking small steps at
    a time, like toddlers learning to walk.'
