  md: "\n## User Interface: Advanced Elements\n\n### Map Scrolling\n\nIn this case,\
    \ the mouse button is pressed down, and we move the cursor to the right. When\
    \ the cursor crosses the black border, we know it because of the JavaScript code\
    \ we have written, and it signals the map to scroll and update the images. After\
    \ moving the mouse to the right in the screenshot and crossing the border, the\
    \ map is scrolled to the right as is shown in the following screenshot:\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_136_0.png)\n\
    \nThe previous screenshot also has a hand-drawn black arrow, and when we move\
    \ the cursor down (with the button pressed down), when we cross the border again,\
    \ the map scrolls down as shown in the following screenshot:\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_137_0.png)\n\
    \nSimple map scroller using geologic map of the Tempe-Mareotis Region of Mars.\n\
    Full description from [here].\n\nZoom level:\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_137_1.png)\n\
    \n### Afterword\n\nThis map scroller sample features a very user friendly method\
    \ for scrolling maps or images. We also saw that the implementation is very client-centric\
    \ because our server-side Java code (which was remoted) has only one class and\
    \ one method.\n\n### Summary\n\nThis chapter presented user interface components\
    \ that are available in many applications. Forms are present in all the applications\
    \ that accept input from users. The navigation tree is user-friendly, and map\
    \ scrolling is seen as a must in specific applications.\n\nUsing these user interface\
    \ components is easy with DWR. DWR makes it possible to add very dynamic behavior\
    \ to applications easily. Although the samples are more or less hard-coded, the\
    \ principal ideas are presented, and sample code is a good starting point for\
    \ not-so-hard-coded applications.\n\n## 6 Backend Integration\n\nThis chapter\
    \ is on integrating web applications with various backend services. Almost all\
    \ applications involve a database, so the first example in this chapter shows\
    \ one way of accessing a database from the DWR application. The second example\
    \ integrates with a standard web service while the third example uses JMS messaging\
    \ to access a backend service. The JMS example also shows how to do Reverse AJAX\
    \ (Comet) using DWR.\n\nThis chapter includes the following sections:\n\n- Integrating\
    \ a Database with DWR — shows how DWR is used to access a database\n- Integrating\
    \ with web services — uses Eclipse tooling to generate a web service client for\
    \ our DWR application\n- Integrating with a Messaging System — integrates our\
    \ DWR application with the Python-based \"order system\" using ActiveMQ and JMS\n\
    \n### Integrating a Database with DWR\n\nHere, we integrate a database with DWR\
    \ by exposing a database table via a remoted Java class. Our Java class connects\
    \ directly to the database using JDBC, and related SQL statements are included\
    \ in the class. Other ways to access databases include EJBs, Hibernate, and numerous\
    \ others.\n\nThe example here replaces the first example in Chapter 4, Tables\
    \ and Lists, so that country data comes from a database instead of a CSV file.\
    \ From the application point of view there is only one change required in the\
    \ `dwr.xml` file and that is changing the entry to point to the Java class that\
    \ handles database access. Before we implement the Java class we have to set up\
    \ and populate the database. Here we use Apache Derby database, which comes bundled\
    \ with the Geronimo application server.\n\n3. The following SQL command creates\
    \ a country data table.\n\n```\nCREATE TABLE country_data (\n    id INTEGER generated\
    \ always as identity,\n    short_name VARCHAR(64) NOT NULL,\n    long_name VARCHAR(256)\
    \ NOT NULL,\n    code CHAR(2) NOT NULL,\n    capital VARCHAR(64) NOT NULL,\n \
    \   notes VARCHAR(256) DEFAULT ''\n);\nALTER TABLE country_data ADD CONSTRAINT\
    \ pkey PRIMARY KEY (id);\n```\n\n4. Insert the SQL in the command area and hit\
    \ the Run SQL button.\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_142_0.png)\n\
    \nWe can view tables in the database using the **Geronimo Console**. There is\
