  md: "\nWe know why the **AppContent is not defined** error occurs, so let's fix\
    \ it by adding `AppContent` to the `allow` element in the `dwr.xml` file. We also\
    \ add `CountryDB` to the `allow` element. The first thing we do is to add required\
    \ elements to the `dwr.xml` file. We add the following creators within the `allow`\
    \ element in the `dwr.xml` file.\n\n```\n<create creator=\"new\" javascript=\"\
    AppContent\">\n    <param name=\"class\" value=\"samples.AppContent\" />\n   \
    \ <include method=\"getContent\" />\n    <include method=\"getLetters\" />\n</create>\n\
    <create creator=\"new\" javascript=\"CountryDB\">\n    <param name=\"class\" value=\"\
    samples.CountryDB\" />\n    <include method=\"getCountries\" />\n    <include\
    \ method=\"saveCountryNotes\" />\n    <include method=\"getCountryData\" />\n\
    </create>\n```\n\nWe explicitly define the methods we are remoting using the `include`\
    \ elements. This is a good practice, as we don't accidentally allow access to\
    \ any methods that are not meant to be remoted.\n\n## Client Code for Tables and\
    \ Lists\n\nWe also need to add a JavaScript interface to the `index.jsp` page.\
    \ Add the following with the rest of the scripts in the `index.jsp` file.\n\n\
    ```\n<script type='text/javascript' src='/DWAREasyAjax/dwr/interface/AppContent.js'></script>\n\
    ```\n\nBefore testing, we need the sample HTML for the content area. The following\
    \ HTML is in the `TablesAndLists.html` file under the **samples** directory:\n\
    \n```\n<h3>Countries</h3>\n<p>Show countries starting with\n<select id=\"letters\"\
    \ onchange=\"selectLetter(this);return false;\"> </select><br/>\nDoubleclick \"\
    Notes\"-cell to add notes to country.\n</p>\n<table border=\"1\">\n    <thead>\n\
    \        <tr>\n            <th>Name</th>\n            <th>Long name</th>\n   \
    \         <th>Code</th>\n            <th>Capital</th>\n            <th>Notes</th>\n\
    \        </tr>\n    </thead>\n    <tbody id=\"countryData\">\n    </tbody>\n</table>\n\
    \n<script type='text/javascript'>\n//TO BE EVALED\nAppContent.getLetters(addLetters);\n\
    </script>\n```\n\nThe script element at the end is extracted by our Java class,\
    \ and it is then evaluated by the browser when the client-side JavaScript receives\
    \ the HTML. There is the select element, and its onchange event calls the selectLetter()\
    \ JavaScript function. We will implement the selectLetter() function shortly.\n\
    \nJavaScript functions are added in the index.jsp file, and within the head element.\
    \ Functions could be in separate JavaScript files, but the embedded script is\
    \ just fine here.\n\n```\nfunction selectLetter(selectElement)\n{\n    var selectedIndex\
    \ = selectElement.selectedIndex;\n    var selectedLetter= selectElement.options[selectedIndex\
    \ ].value;\n    CountryDB.getCountries(selectedLetter,setCountryRows);\n}\nfunction\
    \ addLetters(letters)\n{\n    dwr.util.addOptions('letters',['letter...']);\n\
    \    dwr.util.addOptions('letters',letters);\n}\n\nfunction setCountryRows(countryData)\n\
    {\n    var cellFuncs = [\n        function(data) { return data[0]; },\n      \
    \  function(data) { return data[1]; },\n        function(data) { return data[2];\
    \ },\n        function(data) { return data[3]; },\n        function(data) { return\
    \ data[4]; }\n    ];\n    dwr.util.removeAllRows('countryData');\n    dwr.util.addRows(\
    \ 'countryData',countryData,cellFuncs, {\n        cellCreator:function(options)\
    \ {\n            var td = document.createElement(\"td\");\n            if(options.cellNum==4)\n\
    \            {\n                var notes=options.rowData[4];\n              \
    \  if(notes==undefined)\n                {\n                    notes='&nbsp;';//\
    \ + options.rowData[2]+' notes';\n                }\n                var ccode=options.rowData[2];\n\
    \                var divId=ccode+'_Notes';\n                var tdId=divId+'Cell';\n\
    \                td.setAttribute('id',tdId);\n                var html=getNotesHtml(ccode,notes);\n\
    \                td.innerHTML=html;\n                options.data=html;\n    \
    \        }\n            return td;\n        },\n        escapeHtml:false\n   \
    \ });\n}\n\nfunction getNotesHtml(ccode,notes)\n{\n    var divId=ccode+'_Notes';\n\
    \    return \"<div onDblClick=\\\"editCountryNotes('\"+divId+\"','\"+ccode+\"\
    ');\\\" id=\\\"\"+divId+\"\\\">\"+notes+\"</div>\";\n}\n\nfunction editCountryNotes(id,ccode)\n\
    {\n    var notesElement=dwr.util.byId(id);\n    var tdId=id+'Cell';\n    var notes=notesElement.innerHTML;\n\
    \    if(notes=='&nbsp;')\n    {\n        notes='';\n    }\n    var editBox='<input\
    \ id=\"'+ccode+'NotesEditBox\" type=\"text\" value=\"'+notes+'\"/><br/>';\n  \
    \  editBox+=\"<input type='button' id='\"+ccode+\"SaveNotesButton' value='Save'\
    \ onclick='saveCountryNotes(\\\"\"+ccode+\"\\\");'/>&nbsp;\";\n    editBox+=\"\
    <input type='button' id='\"+ccode+\"CancelNotesButton' value='Cancel' onclick='cancelEditNotes(\\\
    \"\"+ccode+\"\\\");'/>\";\n    tdElement=dwr.util.byId(tdId);\n    tdElement.innerHTML=editBox;\n\
    \    dwr.util.byId(ccode+'NotesEditBox').focus();\n}\n```\n\n```\nfunction cancelEditNotes(ccode)\n\
    {\n    var countryData=CountryDB.getCountryData(ccode, {\n    callback:function(data)\n\
    \    {\n        var notes=data[4];\n        if(notes==undefined)\n        {\n\
    \            notes='&nbsp;';\n        }\n        var html=getNotesHtml(ccode,notes);\n\
    \        var tdId=ccode+'_NotesCell';\n        var td=dwr.util.byId(tdId);\n \
    \       td.innerHTML=html;\n    }\n    });\n}\nfunction saveCountryNotes(ccode)\n\
    {\n    var editBox=dwr.util.byId(ccode+'NotesEditBox');\n    var newNotes=editBox.value;\n\
    \    CountryDB.saveCountryNotes(ccode,newNotes, {\n    callback:function(newNotes)\n\
    \    {\n        var ccode=newNotes[0];\n        var notes=newNotes[1];\n     \
    \   var notesHtml=getNotesHtml(ccode,notes);\n        var td=dwr.util.byId(ccode+\"\
    _NotesCell\");\n        td.innerHTML=notesHtml;\n    }\n    });\n}\n```\n\nThere\
    \ are lots of functions for table samples, and we go through each one of them.\n\
    \nThe first is the selectLetter() function. This function gets the selected letter\
    \ from the select element and calls the CountryDB.getCountries() remoted Java\
    \ method. The callback function is setCountryRows. This function receives the\
    \ return value from the Java getCountries() method, that is List<List<String>>,\
    \ a List of Lists of Strings.\n\nThe second function is addLetters(letters), and\
    \ it is a callback function for the AppContent.getLetters() method, which simply\
    \ returns letters from A to Z. The addLetters() function uses the DWR utility\
    \ functions to populate the letter list.\n\nThen there is a callback function\
    \ for the CountryDB.getCountries() method. The parameter for the function is an\
    \ array of countries that begin with a specified letter. Each array element has\
    \ a format: Name, Long name, (country code) Code, Capital, Notes. The purpose\
    \ of this function is to populate the table with country data; and let's see how\
    \ it is done. The variable, cellFuncs, holds functions for retrieving data for\
    \ each cell in a column. The parameter named data is an array of country data\
    \ that was returned from the Java class.\n\nThe table is populated using the DWR\
    \ utility function, addRows(). The cellFuncs variable is used to get the correct\
    \ data for the table cell. The cellCreator function is used to create custom HTML\
    \ for the table cell. Default implementation generates just a td element, but\
    \ our custom implementation generates the td-element with the div placeholder\
    \ for user notes.\n\nThe getNotesHtml() function is used to generate the div element\
    \ with the event listener for double-click.\n\nThe editCountryNotes() function\
    \ is called when the table cell is double-clicked. The function creates input\
    \ fields for editing notes with the Save and Cancel buttons.\n\nThe cancelEditNotes()\
    \ and saveCountryNotes() functions cancel the editing of new notes, or saves them\
    \ by calling the CountryDB.saveCountryNotes() Java method.\n\nThe following screenshot\
    \ shows what the sample looks like with the populated table:\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_93_0.png)\n\
    \nNow that we have added necessary functions to the web page we can test the application.\n\
    \n## Testing Tables and Lists\n\nThe application should be ready for testing if\
    \ we have had the test environment running during development. Eclipse automatically\
    \ deploys our new code to the server whenever something changes. So we can go\
    \ right away to the test page `http://127.0.0.1:8080/DWREasyAjax`. On clicking\
    \ **Tables and lists** we can see the page we have developed. By selecting some\
    \ letter, for example \"I\" we get a list of all the countries that start with\
    \ letter \"I\" (as shown in the previous screenshot).\n\nNow we can add notes\
    \ to countries. We can double-click any table cell under **Notes**. For example,\
