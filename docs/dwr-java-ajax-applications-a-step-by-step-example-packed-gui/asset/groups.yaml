    In this chapter, we are going to set up the development environment for the coding
    work we will do in the following chapters. We will also have a look at supported
    environments, configuration, testing, and debugging.


    As the development environment for the sample code in this book, we have the following
    components: Eclipse as IDE, Apache Geronimo 2.x.x as the application server, Java
    1.5.x as Java runtime, Firefox 2.0.0.x as the client, and Windows as the operating
    system (Linux would work just as well).


