    \ or a chapter in a book. The refreshBookLists() function just calls the getBookLists()\
    \ function to get the current books in the user interface. The last function,\
    \ clearContentAreas(), clears the book content.\n\nThe rest of the page is HTML\
    \ code, and the content includes the headlines and the place holders, and div\
