  - "[PAGE 110]\n\nThe first function, useTestCreditCardNumber, inserts a test number\
    \ into the credit card field, so we don't have to use our own card number.\n\n\
    The isValidCreditCard() function is called when something is entered in the credit\
    \ card input field. The function calls a server-side Java method (to be implemented\
    \ shortly) and receives either true or false. If the credit card number fails\
    \ the validation, the user is informed by changing the content of the div element\
    \ with the formFeedback ID.\n\nThe checkExpiryDate() function is similar to the\
    \ previous function except that it checks the expiry date syntax.\n\nThe last\
    \ function is the submitOrder() function that reads form field values and calls\
    \ the submitOrder() method in a remot ed Java class. The Java method returns true\
    \ or false, and the status of order submission is shown to the user.\n\n# Creating\
    \ the FormHandler Class\n\nThe next thing to do is the FormHandler Java class.\
    \ The implementation of the class is as follows:\n\n```\npackage samples;\n\n\
    public class FormHandler {\n    public boolean submitOrder(String name,String\
    \ address,String creditCardNumber,String expiryDate)\n    {\n        boolean validExpiryDate=checkExpiryFormat(expiryDate);\n\
    \        boolean validCreditCardNumber=\n            isValidCreditCard(creditCardNumber);\n\
    \        //submit order to orderprocessing system\n        boolean orderSubmitted=true;\n\
    \n        return validCreditCardNumber && validExpiryDate &&\n            orderSubmitted;\n\
