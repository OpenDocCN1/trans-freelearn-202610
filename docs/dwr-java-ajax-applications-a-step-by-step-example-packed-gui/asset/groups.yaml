    # # Sample Applications


    This chapter includes two sample applications that use some of the functionalities
    that were presented in the samples in the previous chapters. The first sample
    application is Collaborative Book Authoring, which enables multiple users to author
    the same book. The second sample application is a straightforward chat room application.


    These samples concentrate on the DWR functionality, which means that much of the
    features of real production-grade applications are missing from the sample applications.
    However, the samples show how DWR is used, and it should be easy to enhance applications
    to production grade using the samples as a starting point for development and
    as a source of ideas.


    Two sample applications in this chapter are as follows:


    +   - Collaborative Book Authoring – shows how DWR is used to create a web-based,
    multi-user authoring environment

    +   - Chatroom – a typical multi-user chat room application using DWR


    # ## Collaborative Book Authoring


    The Collaborative Book Authoring sample application enables multiple users to
    work on the same or different books simultaneously. The idea is that an author
    logs into a system and he/she sees all the books that are in process, and have
    been published. Anyone can start a new book and anyone can contribute to a book
    (so this is quite an open process). Also within a book, anyone can start a new
    chapter and again anyone can edit the chapter content. The system is built so
    that only one author can edit a chapter. If someone is editing a chapter content,
    and another user tries to edit it, he/she will see the most recent save of the
    chapter content.'
