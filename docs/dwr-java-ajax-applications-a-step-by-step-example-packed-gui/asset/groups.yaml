  mdcn: "\n## 前言\n\nDWR 项目对安全性进行了非常彻底的思考。DWR 框架考虑了许多安全问题，DWR 网站上有大量关于安全性的讨论。\n\n本书是为有兴趣学习\
    \ DWR 和 AJAX 框架的专业 Java 开发人员而写。本书从 DWR 主要特性和功能的教程开始，然后介绍开发环境的搭建，最后以一些示例应用程序结束。\n\
    \n后续章节充满了示例应用程序的示例代码，以帮助理解。\n\n## 本书涵盖内容\n\n- *第 1 章*简要介绍 AJAX 技术和 DWR。它还讨论了 DWR\
    \ 社区，并简要描述了互联网上可以找到的关于 DWR 的信息。\n\n- *第 2 章*描述了我们在本书示例中使用的 DWR 特性——从高层次视角介绍 DWR\
    \ 如何让开发人员的工作更轻松。它讨论了反向 AJAX、DWR JavaScript 库、转换器、创建器、过滤器和签名。它还包括一个关于将 DWR 与其他项目集成的部分，以及另一个关于安全性的部分。\n\
    \n- *第 3 章*通过描述如何设置开发环境以及如何测试和调试我们的示例应用程序，为开发做好准备。它涵盖了 DWR 支持的浏览器和环境、配置、错误处理、打包和部署。\n\
    \n- *第 4 章*是第一个专门介绍示例代码的章节。本章中的示例包括典型的用户界面元素，如表格和列表，以及如何使用 DWR 来实现它们。它还有一个字段补全的示例。\n\
    \n- *第 5 章*讨论如何在更高级的用户界面元素中使用 DWR，例如表单、导航树和滚动地图。\n\n- *第 6 章*展示了如何将 DWR 应用程序集成到数据库、Web\
    \ 服务或消息系统中。\n\n- *第 7 章*包含两个示例应用程序：协同图书创作，展示了如何使用 DWR 创建基于 Web 的多用户创作环境；以及聊天室——一个使用\
    \ DWR 的典型多用户聊天室应用程序。\n\n## 阅读本书所需准备\n\n本书面向希望通过示例学习 DWR 的专业 Java 开发人员和架构师。要充分利用本书，需要具备或最好具备几项技能。\n\
    \n首先，需要具备 Java 开发技能，尤其是使用 Java 企业版（JEE）、Servlet 和 JSP 等 Java 技术进行 Web 开发的经验。了解其他\
    \ Web 技术（如 JavaScript、HTML 和 CSS）也很有用。\n\n你应该熟悉 Eclipse 工具，其他有用的技能包括了解 JEE 应用服务器，以及具备\
    \ XML 等常见技术的经验。\n\n了解 AJAX 技术的基础知识会有所帮助。不过，本书也会介绍 AJAX 的基础知识。\n\n## 本书读者对象\n\n\
    本书是为有能力的 Java 开发人员编写的，并假设您是专业人士而非业余爱好者。您应该熟悉编程、Web 2.0 和 AJAX 的概念。\n\n## 排版约定\n\
    \n在本书中，您会看到多种文本样式，用于区分不同种类的信息。以下是这些样式的一些示例及其含义的解释。\n\n正文中的代码字如下所示：“我们可以通过使用 include\
    \ 指令来包含其他上下文。”\n\n代码块将如下所示：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
    <!DOCTYPE dwr PUBLIC\n  \"-//GetAhead Limited//DTD Direct Web Remoting 2.0//EN\"\
    \n  \"http://getahead.org/dwr/dwr20.dtd\">\n<dwr>\n  <allow>\n    <create creator=\"\
    new\" javascript=\"HorizontalMenu\">\n      <param name=\"class\" value=\"samples.HorizontalMenu\"\
    \ />\n    </create>\n  </allow>\n</dwr>\n```\n\n当我们希望引起您对代码块中某一部分的注意时，相关的行或项目将以粗体显示：\n\
    \n```\npublic boolean submitOrder(String name, String address,\n             \
    \              String creditCardNumber, String expiryDate)\n{\n    CreditCardValidatorSoapProxy\
    \ ccValidatorProxy =\n                                      new CreditCardValidatorSoapProxy();\n\
    \    int rv = -1;\n    try {\n        rv = ccValidatorProxy.validateCard(creditCardNumber,\n\
    \                                           expiryDate.replace(\"/\", \"\"));\n\
    \        if (rv != 0) {\n            System.out.println(\"Credit card check failed:\
    \ \" + rv);\n        }\n    }\n    catch (RemoteException e) {\n        e.printStackTrace();\n\
    \    }\n    if(rv==0)\n    {\n        //credit card valid, submit to order system\n\
    \        new OrderSystem(name,address,creditCardNumber,expiryDate);\n    }\n \
    \   return rv == 0;\n}\n```\n\n任何命令行输入和输出都将按照以下格式书写：\n\n```\ndeploy -user system\
