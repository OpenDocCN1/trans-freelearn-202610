    Note the Firebug window at the bottom of the browser screen. The Firebug console
    in the screenshot shows one POST request to our HorizontalMenu.getMenuItems()
    method. Other Firebug features are extremely useful during development work, and
    we find it useful that Firebug has been enabled throughout the development work.


    # Callback Functions


    We saw our first callback function as a parameter in the HorizontalMenu.getMenuItems(setMenuItems)
    function, and since callbacks are an important concept in DWR, it would be good
    to discuss a little more about them now that we have seen their first usage.


    Callbacks are used to operate on the data that was returned from a remoted method.
    As DWR and AJAX are asynchronous, typical return values in RPCs (Remote Procedure
    Calls), as in Java calls, do not work. DWR hides the details of calling the callback
    functions and handles everything internally from the moment we return a value
    from the remoted Java method to receiving the returned value to the callback function.


    Two methods are recommended while using callback functions.'
  - "[PAGE 79]\n\nWe have already seen the first method in the `HorizontalMenu.getMenuItems(setMenuItems)`\
    \ function call. Remember that there are no parameters in the `getMenuItems()`\
    \ Java method, but in the JavaScript call, we added the callback function name\
    \ at the end of the parameter list. If the Java method has parameters, then the\
    \ JavaScript call is similar to `CountryDB.getCountries(selectedLetters,setCountryRows)`,\
    \ where selectedLetters is the input parameter for the Java method and setCountryRows\
    \ is the name of the callback function (we see the implementation later on).\n\
    \nThe second method to use callbacks is a meta-data object in the remote JavaScript\
    \ call. An example (a full implementation is shown later in this chapter) is shown\
    \ here:\n\n```\nCountryDB.saveCountryNotes(ccode,newNotes, {\n    callback:function(newNotes)\n\
    \    {\n        //function body here\n    }\n});\n```\n\nHere, the function is\
    \ anonymous and its implementation is included in the JavaScript call to the remoted\
    \ Java method. One advantage here is that it is easy to read the code, and the\
    \ the code is executed immediately after we get the return value from the Java\
    \ method. The other advantage is that we can add extra options to the call.\n\n\
    Extra options include timeout and error handler as shown in the following example:\n\
    \n```\nCountryDB.saveCountryNotes(ccode,newNotes, {\n    callback:function(newNotes)\n\
    \    {\n        //function body here\n    },\n    timeout:10000,\n    errorHandler:function(errorMsg)\
    \ { alert(errorMsg); }\n});\n```\n\nIt is also possible to add a callback function\
    \ to those Java methods that do not return a value. Adding a callback to methods\
    \ with no return values would be useful in getting a notification when a remote\
    \ call has been completed.\n\n# Afterword\n\nOur first sample is ready, and it\
    \ is also the basis for the following samples. We also looked at how applications\
    \ are tested in the Eclipse environment."
  - '[PAGE 80]


    Using DWR, we can look at JavaScript code on the browser and Java code on the
    server as one. It may take a while to get used to it, but it will change the way
    we develop web applications. Logically, there is no longer a client and a server
    but just a single run time platform that happens to be physically separate. But
    in practice, of course, applications using DWR, JavaScript on the client and Java
    in the server, are using the typical client-server interaction. This should be
    remembered when writing applications in the logically single run-time platform.


    # Implementing Tables and Lists


    The first actual sample is very common in applications: tables and lists. In this
    sample, the table is populated using the DWR utility functions, and a remoted
    Java class. The sample code also shows how DWR is used to do inline table editing.
    When a table cell is double-clicked, an edit box opens, and it is used to save
    new cell data.


    The sample will have country data in a CSV file: country Name, Long Name, two-letter
    Code, Capital, and user-defined Notes. The user interface for the table sample
    appears as shown in the following screenshot:


    ![](img/5b721cfaa97eb697efc92e3914f62fca_80_0.png)'
