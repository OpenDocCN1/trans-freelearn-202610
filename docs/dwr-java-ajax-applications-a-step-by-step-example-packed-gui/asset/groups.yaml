  - '[PAGE 77]


    This JSP is our user interface. The HTML is just normal HTML with a head element
    and a body element. The head includes reference to a style sheet and to DWR JavaScript
    files, engine.js, util.js, and our own HorizontalMenu.js. The util.js file is
    optional, but as it contains very useful functions, it could be included in all
    the web pages where we use the functions in util.js.


    The body element has a contentArea place holder for the content pages just below
    the menu. It also contains the content area for JavaScript functions for a particular
    content. The body element onload-event executes the loadMenuItems() function when
    the page is loaded. The loadMenuItems() function calls the remoted method of the
    HorizontalMenu Java class. The parameter of the HorizontalMenu.getMenuItems()
    JavaScript function is the callback function that is called by DWR when the Java
    method has been executed and it returns menu items.


    The setMenuItems() function is a callback function for the loadMenuItems() function
    mentioned in the previous paragraph. While loading menu items, the Horizontal.getMenuItems()
    remoted method returns menu items as a List of Strings as a parameter to the setMenuItems()
    function. The menu items are formatted using the menuItemFormatter() helper function.


    The menuItemFormatter() function creates li elements of menu texts. Menus are
    formatted as links, (a href) and they have an onclick event that has a function
    call to the getContent-function, which in turn calls the AppContent.getContent()
    function.


    The AppContent is a remoted Java class, which we haven''t implemented yet, and
    its purpose is to read the HTML from a file based on the menu item that the user
    clicked. Implementation of AppContent and the content pages are described in the
    next section.


    The setContent() function sets the HTML content to the content area and also evaluates
    JavaScript options that are within the content to be inserted in the content area
    (this is not used very much, but it is there for those who need it).'
