    \ describes the configuration methods and how to use them.\n\n### web.xml\n\n\
    Configuration starts by defining the DWR servlet in the web application's web.xml\
    \ configuration file. This is, of course, mandatory since DWR would not work without\
    \ it. A minimum configuration does not have any init parameters, and is shown\
    \ as follows:\n\nInitialization parameters for a DWR servlet also include several\
    \ parameters for server load protection. The init parameters for load protection\
    \ are listed in the following table:\n\n| Parameter | Description |\n|---|---|\n\
    | activeReverseAjaxEnabled | When set to true, this enables reverse AJAX support,\
    \ polling, and Comet. The default value is false. |\n| maxWaitingThreads | The\
    \ maximum number of threads that wait for requests. The default value is 100.\
    \ |\n| maxHitsPerSecond | The number of poll requests that we should get per second.\
    \ The default value is 40. |\n\nOther init parameters also exist such as sessionCookieName\
    \ and overridePath. The DWR web page lists all parameters, including a few undocumented\
    \ parameters.\n\n### dwr.xml\n\nThe other XML configuration file for DWR is dwr.xml.\
    \ This file is used to configure remoted Java classes to JavaScript functions,\
    \ and is the basis of DWR functionality.\n\nThe dwr.xml file has the following\
    \ structure:\n\n```\n<!DOCTYPE dwr PUBLIC \"-//GetAhead Limited//DTD Direct Web\
    \ Remoting 2.0//EN\" \"http://getahead.org/dwr/dwr20.dtd\">\n<dwr>\n  <init>\n\
    \    <creator id=\"cr1\" class=\"org.mysource.CreatorClass1\"/>\n    <converter\
    \ id=\"co1\" class=\"org.mysource.ConverterClass1\"/>\n  </init>\n  <allow>\n\
    \    <create creator=\"new\" javascript=\"ServerClass\"/>\n    <convert converter=\"\
    co1\" match=\"org.mysource.MyDataClass\"/>\n  </allow>\n</dwr>\n```\n\nThe most\
    \ important entries are within the allow element. Without the allow element, DWR\
    \ is of no use since nothing is allowed. Entries within the init element are rarely\
    \ used except when extending DWR. In addition to init and allow elements there\
    \ can be a signatures element that holds method signatures and is used when our\
    \ remoted objects have Collection parameters (such as List). When a method has\
    \ a List parameter, DWR has no way of knowing what types List holds. That is why\
    \ signatures are used to tell DWR that the List holds, for example, String objects.\n"
  mdcn: "\n\n`dwr.xml` 中的配置还包括每个远程 Java 类的 create 条目。我们可以使用 singleton、new 或其他机制。我们还可以使用\
    \ `dwr.xml` 中的 include 和 exclude 元素来限制允许的方法。`web.xml` 配置文件中的安全参数也有 `allowScriptTagRemoting`\
    \ 和 `crossDomainSessionSecurity`，当启用时，可能会带来巨大的安全风险。因此，如果你要启用这些参数，请确保你了解自己在做什么。\n\
    \n有一个配置参数在开发 DWR 应用程序时非常有用，但在生产（尤其是公开）站点中却是安全风险。以下 init-param、debug 和 test 模式可以添加到\
    \ web.xml 中。\n\n```\n```xml\n<init-param>\n    <param-name>debug</param-name>\n\
    \    <param-value>true</param-value>\n</init-param>\n```\n```\n\n当启用 debug/test\
    \ 模式时，DWR 会生成测试页面（第 4 章中有示例屏幕），这些页面是了解 DWR 功能的有用工具。\n\n也可以使用 JEE 访问控制机制并限制对特定\
    \ JEE 角色的 DWR 本身的访问。这些在 web.xml 文件中指定。在 DWR 内部，还有对远程 Java 对象方法的基于角色的访问控制。DWR 还可以与\
    \ Spring Security（也称为 Acegi Security）集成，`http://www.acegisecurity.org/`，它是 Spring\
    \ Portfolio 的官方安全项目。Acegi 与 DWR 集成的描述可在 `http://java-x.blogspot.com/2007/08/handling-security-with-ajax-dwr-and.html`\
    \ 找到。\n\nDWR 还设计为攻击者无法访问和操作 DWR 核心文件并更改安全参数等情况。\n\n## 最小化风险\n\n安全不是一个微不足道的问题，我们可以在安全领域花费数年时间仍然会留下很多未完成的工作。作为开发者，我们的工作是确保安全风险降到最低，至少要意识到如果我们远程某个\
    \ Java 方法可能会发生什么。\n\nDWR 网站上的一个非常好的例子是，如果我们对名为 `appendStringToFile()` 的方法进行远程调用，该方法将给定的字符串附加到预定义的文件中，那么可能的攻击者可以发送大量请求并用无意义的内容填满文件系统，从而导致意外的服务器停机。停机的成本可能从轻微不便到数百万美元不等。\n\
    \n为了防止无意中提供可能造成危害的访问，我们必须思考我们想要做什么并检查输入参数。检查输入参数是我们作为开发者可以做到的最重要的事情，以确保事故不会发生。\n\
    \n在前面的例子中，如果我们远程了 `appendStringToFile()` 方法，我们可以做很多检查，例如文件系统是否正在填满，是否是一个适用于其目的的字符串（例如日志文件中的日志条目），请求者是谁等等。\n\
    \n另外请确保使用 `escapeHTML` 以防止跨站脚本（XSS）攻击。XSS 是值得了解的东西。因此请参阅维基百科（http://en.wikipedia.org/wiki/Cross-site_scripting）以获取详细描述。\n\
    \n## 总结\n\n本章介绍了 DWR 功能的概述，包括 JavaScript 库（`util.js`、`engine.js` 和 `gi.js`）、安全性和\
    \ Reverse AJAX，以及 DWR 工作方式的基本操作元素。\n\n除了本章讨论的主题外，DWR 还有许多其他可能与开发者相关或不相关的有用功能。这取决于应用程序。本章中的主题旨在提供高层次的概述，但它们将为你从\
    \ DWR 网站（http://directwebremoting.org/dwr/documentation）甚至从 DWR 源代码中了解更多信息提供良好的起点。\n\
    \n非常经常，大多数开发者在开始一个项目时不需要该技术的全部功能。在项目进行一段时间后，我们可能会发现解决方案已经成熟，包含了该技术的大部分甚至全部功能。但这通常不是初始情况，而且，我们必须从某个地方开始，逐步迈出小步是实际的做法，就像学步的幼儿学习走路一样。\n\
    \n## 3\n入门\n\n在本章中，我们将为在后续章节中进行的编码工作设置开发环境。我们还将查看支持的环境、配置、测试和调试。\n\n作为本书示例代码的开发环境，我们有以下组件：Eclipse\
    \ 作为 IDE，Apache Geronimo 2.x.x 作为应用服务器，Java 1.5.x 作为 Java 运行时，Firefox 2.0.0.x\
    \ 作为客户端，以及 Windows 作为操作系统（Linux 同样适用）。\n\n本章包括以下部分：\n\n- 支持的浏览器和环境 – 描述 DWR 支持的软件组件\n\
    - 配置 – 介绍 DWR 配置，包括 `dwr.xml` 和 `web.xml` 文件\n- 设置开发环境 – 有设置开发组件的步骤\n- 测试和调试 –\
    \ 描述如何在使用 DWR 开发应用程序时进行测试和调试\n- 错误处理 – 描述 DWR 如何处理错误处理，以及如何配置它\n- 打包和部署 – 展示如何使用\
    \ Eclipse 和 Geronimo 打包和部署 DWR 应用程序\n\n## 支持的浏览器和环境\n\n由于 DWR 应用程序基于 Java，运行 DWR\
    \ 应用程序的服务器必须是 Java 服务器。JDK 1.3 和 servlet 规范 2.2 是最低要求。几乎所有 Java 应用服务器都支持 DWR 应用程序。Apache\
    \ Tomcat、Apache Geronimo、WebSphere、Weblogic 以及许多其他服务器都受支持。在本书中，我们使用了 Apache Geronimo。\n\
    \nDWR 支持大多数最新浏览器：\n\n- Firefox 1.x 及更高版本受支持。\n- Internet Explorer 6.0 及 Windows\
    \ 的更高版本受支持（IE Mac 不受支持）。IE 5.5 也可能工作，但 IE 5.0.2 不受支持。\n- 基于 Mozilla 的浏览器从 1.7\
    \ 版本开始受支持。\n- Opera 7.5.4 及更高版本受支持（包含空值的字符串存在一个小问题报告）。\n- OSX 上的 Safari 浏览器从 1.2\
    \ 版本开始受支持。\n- Konqueror 浏览器及其最新版本可能可以工作，但未经过 DWR 团队测试。\n\n总体而言，大多数当前浏览器都受 DWR\
    \ 支持，在任何当前或未来的开发项目中，浏览器支持不太可能成为问题。尤其是当项目面向 SMB（中小企业）或企业客户时，他们很可能有公司首选浏览器的政策，而该浏览器很可能就是两大主流浏览器之一。\n\
    \n## 配置\n\nDWR 使用 XML 文件、注解或 Fluent Interface 风格进行配置。使用 XML 文件是 DWR 配置最典型的方法，有两个文件：web.xml\
    \ 和 dwr.xml。第一个 web.xml 对于其他配置方法也是必需的。注解和流式配置可以用在 dwr.xml 的位置。本节描述配置方法以及如何使用它们。\n\
    \n### web.xml\n\n配置从在 Web 应用程序的 web.xml 配置文件中定义 DWR servlet 开始。这当然是强制性的，因为没有它\
    \ DWR 就无法工作。最小配置不包含任何 init 参数，示例如下：\n\nDWR servlet 的初始化参数还包括几个用于服务器负载保护的参数。负载保护的\
    \ init 参数在下表中列出：\n\n| 参数 | 描述 |\n|---|---|\n| activeReverseAjaxEnabled | 当设置为\
    \ true 时，启用 reverse AJAX 支持、轮询和 Comet。默认值是 false。 |\n| maxWaitingThreads | 等待请求的线程最大数量。默认值是\
    \ 100。 |\n| maxHitsPerSecond | 每秒应获得的轮询请求数量。默认值是 40。 |\n\n其他 init 参数也存在，例如 sessionCookieName\
    \ 和 overridePath。DWR 网页列出了所有参数，包括一些未记录的参数。\n\n### dwr.xml\n\nDWR 的另一个 XML 配置文件是\
    \ dwr.xml。该文件用于将远程 Java 类配置为 JavaScript 函数，是 DWR 功能的基础。\n\ndwr.xml 文件具有以下结构：\n\
    \n```\n<!DOCTYPE dwr PUBLIC \"-//GetAhead Limited//DTD Direct Web Remoting 2.0//EN\"\
    \ \"http://getahead.org/dwr/dwr20.dtd\">\n<dwr>\n  <init>\n    <creator id=\"\
    cr1\" class=\"org.mysource.CreatorClass1\"/>\n    <converter id=\"co1\" class=\"\
    org.mysource.ConverterClass1\"/>\n  </init>\n  <allow>\n    <create creator=\"\
    new\" javascript=\"ServerClass\"/>\n    <convert converter=\"co1\" match=\"org.mysource.MyDataClass\"\
    />\n  </allow>\n</dwr>\n```\n\n最重要的条目在 allow 元素内。没有 allow 元素，DWR 就毫无用处，因为没有任何东西被允许。init\
    \ 元素内的条目很少使用，除非扩展 DWR。除了 init 和 allow 元素外，还可以有一个 signatures 元素来保存方法签名，并在我们的远程对象具有\
    \ Collection 参数（如 List）时使用。当方法具有 List 参数时，DWR 没有办法知道 List 包含什么类型。这就是为什么使用 signatures\
    \ 来告诉 DWR List 包含例如 String 对象。\n\n"
