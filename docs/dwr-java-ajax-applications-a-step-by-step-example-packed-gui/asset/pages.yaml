- pgno: 92
  md: 'The first is the selectLetter() function. This function gets the selected letter
    from the select element and calls the CountryDB.getCountries() remoted Java method.
    The callback function is setCountryRows. This function receives the return value
    from the Java getCountries() method, that is List<List<String>>, a List of Lists
    of Strings.


    The second function is addLetters(letters), and it is a callback function for
    the AppContent.getLetters() method, which simply returns letters from A to Z.
    The addLetters() function uses the DWR utility functions to populate the letter
    list.


    Then there is a callback function for the CountryDB.getCountries() method. The
    parameter for the function is an array of countries that begin with a specified
    letter. Each array element has a format: Name, Long name, (country code) Code,
    Capital, Notes. The purpose of this function is to populate the table with country
    data; and let''s see how it is done. The variable, cellFuncs, holds functions
    for retrieving data for each cell in a column. The parameter named data is an
    array of country data that was returned from the Java class.


    The table is populated using the DWR utility function, addRows(). The cellFuncs
    variable is used to get the correct data for the table cell. The cellCreator function
    is used to create custom HTML for the table cell. Default implementation generates
    just a td element, but our custom implementation generates the td-element with
    the div placeholder for user notes.


    The getNotesHtml() function is used to generate the div element with the event
    listener for double-click.


    The editCountryNotes() function is called when the table cell is double-clicked.
    The function creates input fields for editing notes with the Save and Cancel buttons.


    The cancelEditNotes() and saveCountryNotes() functions cancel the editing of new
    notes, or saves them by calling the CountryDB.saveCountryNotes() Java method.'
