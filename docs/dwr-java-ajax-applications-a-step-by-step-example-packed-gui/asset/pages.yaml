    This HTML file holds everything related to map scrolling. In the body element
    there is a single div element that holds map squares. We remember that the iframe
    width and height are 430x430, and as map squares are 100x100, the map view port
    will have a total of 16 map images.


    In the JavaScript code, the mapPositionIndex variable is an array index of the
    upper left corner of the view port. For example, when a map shows the upper left
    corner mapPositionIndex as 0, and it is scrolled row by row to the bottom, the
    mapPositionIndex changes to 10 (for zoom level 0) or 20 (for zoom level 1).


    First, the getRowIndex() JavaScript function calculates which row is at the top
    of a visible view port.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_132_0.png)


    The second function, setZoomLevel(), is important. It calculates the mapPositionIndex
    for the new zoom level. When zooming in, four squares in the center will be zoomed
    visible, and when zooming out, the visible squares are in the center. The screenshot
    above is an example of how zooming is visible to the user. The left image is zoom
    level 0, and the image on the right is zoom level 1.'
