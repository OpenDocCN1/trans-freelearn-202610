  md: "# Server Code for Field Completion\n\nWe will re-use some of the classes we\
    \ developed in the last section. AppContent is used to load the sample page, and\
    \ the DBUtils class is used in the LicenseDB class. The LicenseDB class is shown\
    \ here:\n\n```\npackage samples;\n\nimport java.util.List;\nimport java.util.Vector;\n\
    \npublic class LicenseDB{\n\n    private DBUtils dbUtils=new DBUtils();\n\n  \
    \  public LicenseDB()\n    {\n        dbUtils.initFileDB(\"licenses.csv\");\n\
    \    }\n\n    public List<String> getLicensesStartingWith(String startLetters)\n\
    \    {\n        List<String> list=new Vector<String>();\n        List<String>\
    \ licenses=dbUtils.getCSVStrings(startLetters);\n        for(String license :\
    \ licenses)\n        {\n            list.add(license.split(\",\")[0]);\n     \
    \   }\n        return list;\n    }\n\n    public String getLicenseContentUrl(String\
    \ licenseName)\n    {\n        List<String> licenses=dbUtils.getCSVStrings(licenseName);\n\
    \        if(licenses.size()>0)\n        {\n            return licenses.get(0).split(\"\
    ,\")[1];\n        }\n        return \"\";\n    }\n}\n```"
