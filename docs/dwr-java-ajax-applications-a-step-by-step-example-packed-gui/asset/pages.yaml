    \  } catch (RemoteException e) {\n        e.printStackTrace();\n    }\n    if(rv==0)\n\
    \    {\n        //credit card valid, submit to order system\n        new OrderSystem(name,address,creditCardNumber,expiryDate);\n\
    \    }\n    return rv == 0;\n}\n```\n```\n\nThe new addition here is after the\
    \ web service call to the `CreditCardValidator` (shown in bold in the previous\
    \ code). If the credit card is valid, then the `OrderSystem` class is instantiated.\
    \ Because it has a constructor that starts a new thread for processing, there\
    \ is no need for any variables. When the thread completes, there will be no references\
    \ to the `OrderSystem` class, and Java's garbage collector will clean up leftover\
    \ objects."
