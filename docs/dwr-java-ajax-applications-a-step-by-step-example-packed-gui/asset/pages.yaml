- pgno: 104
  md: '# Afterword


    Field completion improves user experience in web pages and the sample code in
    this section showed one way of doing it using DWR.


    It should be noted that the sample for field completion presented here is only
    for demonstration purposes.


    # Summary


    This chapter provided samples for a couple of common tasks that are used in web
    development: tables and lists, field completion, and even a generic frame, called
    a dynamic user interface, for our sample code. Both the tables and lists sample
    and the field completion sample had a very simple CSV-based "database" that holds
    the data for our purposes, and both had a remoted method that DWR uses to get
    the data from the server and show it in the client.


    We also saw some good examples of HTML, CSS, and JavaScript. In fact, without
    knowledge of JavaScript it would be difficult to write web applications.


    Many years ago, as some of you may remember, JavaScript was a dirty word in web
    development and no self-respecting developer would touch JavaScript. But change
    is a part of life, and in this case, change has been for the better. JavaScript
    and Java work very well together with the DWR in between.


    The next chapter continues with the user interface part, and shows a couple more
    samples, including a map scrolling functionality, similar to what is found in
    the popular Google Maps website.'
