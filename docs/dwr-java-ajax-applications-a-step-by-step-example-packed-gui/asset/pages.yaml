  md: "The CountryDB class is a remote class. The getCountryData() method returns\
    \ country data as an array of strings based on the country code. The getCountries()\
    \ method returns all the countries that start with the specified parameter, and\
    \ saveCountryNotes() saves user added notes to the country specified by the country\
    \ code.\n\nIn order to use CountryDB, the following script element must be added\
    \ to the index.jsp file together with other JavaScript elements.\n\n```\n```html\n\
    <script type='text/javascript' src='/DWREasyAjax/dwr/interface/CountryDB.js'></script>\n\
    ```\n```\n\nThere is one other Java class that we need to create and remote. That\
    \ is the AppContent class that was already present in the JavaScript functions\
