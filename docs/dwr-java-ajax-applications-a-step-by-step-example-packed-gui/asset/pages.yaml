- pgno: 31
  md: "# DWR Features\n\n| Function | Syntax | Description |\n|---|---|---|\n| `onReturn()`\
    \ | `dwr.util.onReturn(event, submitFunction)` | Useful function to catch an event\
    \ when return is pressed on a text element. This works on text elements where\
    \ the `onkeypress` or `onkeydown` event is tied to the `onReturn` function:<br><br>```html\n\
    <input type=\"text\"\n       onkeypress=\"dwr.util.onReturn(event, submitFunction)\"\
    />\n<input type=\"button\"\n       onclick=\"submitFunction()\"/>\n``` |\n| `removeAllOptions()`\
    \ | `dwr.util.removeAllOptions(id);` | Removes all options from ul, ol, or select\
    \ elements specified by an ID. |\n| `removeAllRows()` | `dwr.util.removeAllRows(id)`\
    \ | Removes all rows from a table specified by an ID. |\n| `selectRange()` | `dwr.util.selectRange(id,start,end)`\
    \ | Selects a range of text in an input box between the start and end positions.\
    \ |\n| `setValue()` | `dwr.util.setValue(id,value)` | Sets the value of specified\
    \ HTML element. Works with most of the HTML elements, most importantly input elements\
    \ and divs. |\n| `setValues()` | `dwr.util.setValues({name:value})` | Is similar\
    \ to `setValue()`, but the function parameter is an object with name/value pairs.\
    \ The name is the ID of the HTML element and the value is the new value of the\
    \ element. |"
  merge: -1
