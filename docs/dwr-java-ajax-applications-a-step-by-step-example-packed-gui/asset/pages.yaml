- pgno: 134
  md: "```\npublic List<String> getMapImages(int zoomLevel,\n    int mapPositionIndex)\
    \ {\n    List<String> images = new Vector<String>();\n    String imageName = this.imageName\
    \ + zoomLevel + \"-\";\n    for (int rowIndex = 0; rowIndex < 4; rowIndex++) {\n\
    \        for (int i = 0; i < 4; i++) {\n            int index = mapPositionIndex\
    \ + i;\n            images.add(imageName + index + \".jpg\");\n        }\n   \
    \     mapPositionIndex = mapPositionIndex\n            + imagesInRowInZLevel[zoomLevel];\n\
    \    }\n    return images;\n}\n```\n\nThere is only one method in the MapScroller\
    \ class, getMapImages(). The method returns 16 image names for the current view\
    \ in the HTML page. The parameter, mapPositionIndex, is the upper left corner\
    \ of the image, and it is used to calculate the indexes of the other images.\n\
    \nLet's not forget to add the remoted class to the dwr.xml file:\n\n```\n<create\
    \ creator=\"new\" javascript=\"NavigationTree\">\n    <param name=\"class\" value=\"\
    samples.NavigationTree\" />\n</create>\n```\n\nThis completes the map scrolling\
    \ sample. Most of the functionality is in the browser-side JavaScript functions.\
    \ But this kind of functionality would not be possible without AJAX. This appears\
    \ to be a very simple implementation, and this is because DWR hides low-level\
    \ details of asynchronous communication between the browser and the server, and\
    \ allows us to develop the map scrolling functionality with just a few lines of\
    \ server-side code in one Java class, and a bunch of map square images."
