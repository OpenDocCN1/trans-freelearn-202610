- pgno: 50
  md: 'Now, the development environment is ready for coding. We have an IDE and a
    test server, and that''s about all we really need.


    # Apache Geronimo


    The Apache Geronimo website is `http://geronimo.apache.org`, and there are downloads
    for standalone application servers. Even though we have just installed a development
    environment that includes the Geronimo server runtime, we also need to install
    standalone Geronimo.


    The installation of Geronimo couldn''t be simpler! Just download the Geronimo
    distribution ZIP file (we use the one with Tomcat) and unzip it to some directory.
    Geronimo is started using the **startup** script in the **bin** directory and
    stopped using the **shutdown** script.


    # Testing and Debugging


    DWR applications are normal web applications, and so they can be tested and debugged
    using normal debug tools available in the Eclipse IDE. The Web has information
    about debugging in Eclipse, for example, the article on the IBM developerWorks
    site (`http://www.ibm.com/developerworks/opensource/library/os-ecbug/`). Several
    books about Eclipse and its features are also available.


    Another method for debugging is logging. It may sound "old-fashioned", but here
    is a quote from the book *The Practice of Programming* by Brian W. Kernighan and
    Rob Pike (this quote is found also from Apache''s Log4J website):


    > > As personal choice, we tend not to use debuggers beyond getting a stack trace
    or the value of a variable or two. One reason is that it is easy to get lost in
    details of complicated data structures and control flow; we find stepping through
    a program less productive than thinking harder and adding output statements and
    self-checking code at critical places. Clicking over statements takes longer than
    scanning the output of judiciously-placed displays. It takes less time to decide
    where to put print statements than to single-step to the critical section of code,
    even assuming we know where that is. More important, debugging statements stay
    with the program; debugging sessions are transient.


    And that basically explains it all.


    Testing is done using the Geronimo Server Adapter that we installed in the previous
    section. We will deploy and test our first DWR sample using the server adapter
    in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'We can also debug in Firefox. Especially if and when we develop our JavaScript
    functions, it would be good to know that we can also debug JavaScript on the browser.
    There is a free and open-source tool called Firebug (http://www.getfirebug.com/)
    that provides several extremely useful features such as inspection of HTML (refer
    to the following screenshot where the page logo is highlighted), editing JavaScript
    on a live page, editing CSS, and so on.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_51_0.png)


    It is also possible to debug without Firebug by using JavaScript alert boxes and
    modification of the browser status line. But Firebug and Firefox make our web
    development so much easier that it would be cumbersome to work otherwise.


    # Error Handling


    DWR has a concept called handlers for error handling and exception handling on
    the browser side. Four different handlers have been specified by DWR:


    +   - **errorHandler** is used when DWR knows for certain that something is broken,
    for example, when the application server has been stopped.

    +   - **warningHandler** is used by DWR when something is wrong, but DWR cannot
    automatically define the severity of that "something". This is useful during development
    while debugging an application.'
  merge: -1
  img_proc: true
- pgno: 52
  md: "+   - **exceptionHandler** is used to catch exceptions that are thrown by the\
    \ server side code. Since we are likely to want to know about exceptions, errorHandler\
    \ is used if no exceptionHandler is defined.\n+   - **textHtmlHandler** handles\
    \ non-JavaScript responses. Usually, this happens when the server session has\
    \ expired, and the server presents a login screen or info screen about the expired\
    \ session.\n\nHandlers are set in JavaScript code on the client using a function\
    \ in the engine.js package:\n\n```\ndwr.engine.setErrorHandler(handlerFunction);\n\
    ```\n\nExceptions are handled by exceptionHandler or errorHandler. By default,\
    \ when an exception happens, DWR does not include any information about the exception\
    \ in the error message. For example, an exception object may look like this:\n\
    \n```\n{\n  javaClassName:'java.lang.Throwable',\n  message:'Error'\n}\n```\n\n\
    \"Error\" says nothing about what might be wrong, except that something is clearly\
    \ wrong. More detailed exceptions are enabled by adding the following line to\
    \ dwr.xml.\n\n```\n<convert match=\"java.lang.Exception\" converter=\"exception\"\
    />\n```\n\nThe Exception converter enables understandable error messages:\n\n\
    ```\n{\n  javaClassName:'org.xml.sax.SAXParseException',\n  lineNumber:42,\n \
    \ publicId:'somePublicId',\n  message:'Missing >'\n}\n```\n\nFurther, enabling\
    \ stacktraces using the line <convert match=\"java.lang.StackTraceElement\" converter=\"\
    bean\"/> in dwr.xml allows easier development work where we can see errors as\
    \ they occur and go directly to the debugging mode.\n\nSession expiry is handled\
    \ by textHtmlHandler, and it is used like this:\n\n```\ndwr.engine.setTextHtmlHandler(function()\
    \ {\n  window.alert(\"Your session has expired, please login again.\");\n  document.location\
    \ = '/mycontext/login';\n});\n```"
  merge: -1
  img_proc: true
