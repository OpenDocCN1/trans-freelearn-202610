  md: '5. We get the order confirmation back to the web application as is shown in
    the following screenshot:


    ![](img/5b721cfaa97eb697efc92e3914f62fca_174_0.png)


    # Afterword


    Using messaging in a DWR application is easy, just like using a database or web
    services. In this case, messaging gives a good channel for a platform to communicate
    directly with the user when using reverse AJAX.


    # Summary


    We had three examples for backend integration in this chapter: database, web services,
    and messaging. One or more of these are found in almost all applications, and
    as the examples presented, DWR is agnostic to backend integration. It is possible
    to use the most familiar technology to access databases and other backend services
    and let DWR handle only the frontend user interface.


    We also saw how Comet technology is used in the DWR messaging example, where Comet
    is a natural fit, by providing event-style messaging between the browser and the
    server.'
