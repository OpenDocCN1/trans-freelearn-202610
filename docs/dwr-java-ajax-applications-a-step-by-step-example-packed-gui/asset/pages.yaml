    This is quite a large page since all the client-side logic is included in the
    JavaScript functions within this HTML page. Let''s go through the page source.


    At the start of the page, before declaring the DWR functions, there is a piece
    of Java code whose purpose is to check whether the page request is valid or not.
    It is done by checking the user session, and if the username is found from the
    session, the request is valid and if the username is not found from the session,
    then an empty screen is shown to the user. This is because we don''t want users
    to go directly to the main page (when doing further development, the login page
    could be shown here, instead of an empty page).


    After checking the user session we load the DWR scripts. We have only two Java
    classes in this sample application, Login and BookDatabase.


    At the start of the script element, we enable reverse AJAX (Comet) for our use.
    The first two functions do the logout, and redirect the user to the login screen
    while the third function, showUsersonline(), displays logged-in users on the left
    side of the screen. As we will see later, reverse AJAX is used to call this on
    each user''s page when a new user logs into the system. The function also uses
    the DWR utility functions to populate tables with usernames.


    The getBookLists() function calls the BookDatabase Java class and retrieves a
    list of books that are in progress and books that are published. It shows the
    lists in the HTML page''s left navigation. For a book that is in progress, a link
    to open a chapter page is created, and for published books, a link to open the
    book page is created.'
