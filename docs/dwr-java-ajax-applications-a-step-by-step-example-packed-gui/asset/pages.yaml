- pgno: 98
  md: "The `getLicenseStartingWith()` method goes through the license names and returns\
    \ valid license names and their URLs. Similar to the data in the previous section,\
    \ license data is in a CSV file named `licenses.csv` in the package directory.\
    \ The following is an excerpt of the file content:\n\n```\nAcademic Free License,\
    \ http://opensource.org/licenses/afl-3.0.php\nAdaptive Public License, http://opensource.org/licenses/apl1.0.php\n\
    Apache Software License, http://opensource.org/licenses/apache1-1.1.php\nApache\
    \ License, http://opensource.org/licenses/apache2.0.php\nApple Public Source License,\
    \ http://opensource.org/licenses/apsl-2.0.php\nArtistic license, http://opensource.org/licenses/artistic-license-1.0.php\n\
    ...\n```\n\nThere are quite a few open-source licenses. Some are more popular\
    \ than others (like the Apache Software License) and some cannot be re-used (like\
    \ the IBM Public License).\n\nWe want to remote the `LicenseDB` class, so we add\
    \ the following to the `dwr.xml` file.\n\n```\n<create creator=\"new\" javascript=\"\
    LicenseDB\">\n    <param name=\"class\" value=\"samples.LicenseDB\"/>\n    <include\
    \ method=\"getLicensesStartingWith\"/>\n    <include method=\"getLicensesContentUrl\"\
    />\n</create>\n```\n\n# Client Code for Field Completion\n\nThe following `script`\
    \ element will go in the `index.jsp` page.\n\n```\n<script type='text/javascript'\
    \ src='/DWREasyAjax/dwr/interface/LicenseDB.js'></script>\n```\n\nThe HTML for\
    \ the field completion is as follows:\n\n```\n<h3>Field completion</h3>\n<p>Enter\
    \ Open Source license name to see it's contents.\n</p>\n<input type=\"text\" id=\"\
    licenseNameEditBox\" value=\"\" onkeyup=\"showPopupMenu()\" size=\"40\"/>\n<input\
    \ type=\"button\" id=\"showLicenseTextButton\" value=\"Show license text\" onclick=\"\
    showLicenseText()\"/>\n<div id=\"completionMenuPopup\"></div>\n<div id=\"licenseContent\"\
    ></div>\n```"
