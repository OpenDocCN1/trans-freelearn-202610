- pgno: 10
  md: '# Preface


    AJAX enables a rich desktop-like user interface in the browser and enables interactive
    interfaces that can even replace traditional user interfaces. Communication between
    browser and server is done in the background and because only the data is transferred
    between the browser and the server, AJAX applications seem to be, and are actually,
    fast and responsive to the users.


    DWR, Direct Web Remoting, is an Open Source Java framework, licensed under the
    commercial-friendly Apache Software License v2 for building AJAX applications.
    DWR''s main idea is to hide AJAX implementation details, like XMLHttpRequest and
    such, from developers. Developers can concentrate on developing the application
    and business objects and leave the AJAX details behind the scenes where they belong.


    DWR allows server-side Java classes to be used in the browser (it''s like an RPC
    between JavaScript functions and the server-side Java) and also allows JavaScript
    functions to be used in the server (Reverse AJAX). DWR dynamically generates JavaScript
    functions from Java classes via XML-based configuration, which can be called from
    browser via the DWR JavaScript library. A DWR servlet on the server side receives
    requests and calls the actual Java implementation. DWR includes a couple of JavaScript
    libraries that are required for DWR to work, and are also helpful for developers.


    The term Reverse AJAX is used when a server is used to query and/or control the
    client browser behavior. DWR supports three different methods to do reverse AJAX
    in applications: Piggyback, Polling (by the client), and Comet (server push).


    You may have an on-going project where you may want to use a framework such as
    JSF or Spring for building the whole solution. In these cases, AJAX and DWR are
    just a part of the overall picture, and so DWR needs to integrate with other frameworks
    nicely, and does that successfully!'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Preface


    The DWR project has thought about security very thoroughly. The DWR framework
    has taken into account many security issues and there is a lot of discussion about
    security at the DWR website.


    This book is written for professional Java developers who are interested in learning
    DWR and AJAX framework. It starts with a tutorial on DWR''s main features and
    functions. Then it covers setting up the development environment. It concludes
    with some sample applications.


    The later chapters are full of example code for sample applications, to aid comprehension.


    # What This Book Covers


    *Chapter 1* is a brief introduction to AJAX technology and DWR. It also discusses
    the DWR community and describes briefly what information can be found about DWR
    on the Internet.


    *Chapter 2* describes DWR features that we use in the samples of this book—a high-level
    view of how DWR makes a developer''s life easier. It discusses reverse AJAX, DWR
    JavaScript libraries, converters, creators, filters, and signatures. It also contains
    a section on integrating DWR with other projects and another on security.


    *Chapter 3* sets the stage for development by describing how to set up the development
    environment and how to test and debug our sample applications. It covers DWR-supported
    browsers and environments, configuration, error handling, packaging, and deployment.


    *Chapter 4* is the first chapter dedicated to sample code. The examples in this
    chapter include typical user interface elements such as tables and lists, and
    how they can be implemented using DWR. It also has an example for field completion.


    *Chapter 5* discusses how to use DWR in more advanced user interface elements
    such as forms, navigation tree, and scrolling a map.


    *Chapter 6* shows how DWR applications are integrated to a database, a web service,
    or a messaging system.


    *Chapter 7* includes two sample applications: Collaborative Book Authoring, which
    shows how DWR is used to create a web based multi-user authoring environment,
    and Chatroom—a typical multi-user chat room application using DWR.'
  merge: -1
  img_proc: true
