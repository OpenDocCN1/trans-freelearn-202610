- pgno: 29
  md: "```\ndwr.engine.setPreHook(requestStart);\ndwr.engine.setPostHook(requestEnd);\n\
    \nfunction requestStart()\n{\n  alert('Request start');\n}\n\nfunction requestEnd()\n\
    {\n  alert('Request end');\n}\n```\n\nOther features of engine.js include the\
    \ possibility to call the server in a batch with one or more remote functions\
    \ that are called together. The following code calls three remoted methods in\
    \ a batch with a timeout of 5 seconds.\n\n```\ndwr.engine.beginBatch();\nWorldMap.getEvents(callback:function(results){...});\n\
    WorldMap.getArea(coordinates, showPreview);\nWorldMap.sendEvents(events, result);\n\
    dwr.engine.endBatch({\n  timeout:5000\n});\n```\n\nDWR also has a feature called\
    \ 'call ordering'. When it is enabled, responses to remote calls are received\
    \ in the order they were sent. By default, call ordering is not enabled and if\
    \ it is enabled, it may slow down the application. If call ordering is needed,\
    \ it is enabled by adding dwr.engine.setOrdered(true) to the web page and it affects\
    \ to all DWR calls within that web page.\n\n# util.js\n\nThe util.js library contains\
    \ many useful JavaScript functions that can be used in our applications. This\
    \ library is designed to be used even without the rest of DWR since it does not\
    \ need full DWR functionality (with one exception: the useLoadingMessage() function).\n\
    \nThe library has functions to manipulate HTML elements including tables, lists,\
    \ and images. The following is a table of functions found in util.js with short\
    \ descriptions of each."
  merge: -1
  img_proc: true
- pgno: 30
  md: "| Function | Syntax | Description |\n|---|---|---|\n| addOptions | dwr.util.addOptions(id,\
    \ [ \"one\", \"two\", \"three\" ]) | Allows addition of elements without page\
    \ refresh to lists and select elements (ol, ul, and select) specified by ID. |\n\
    | addRows | dwr.util.addRows(id, array, cellfuncs, [options]) | Adds rows to a\
    \ specified table element. array parameter is used to populate data so that there\
    \ is one row per array element. Pseudo-code for creating a table looks like this:\n\
    for each member in array\n    for each function in cellfuncs\n        create cell\
    \ from cellfunc(array[i]) |\n| byId | dwr.util.byId() | This function finds the\
    \ element in the current HTML document with the given ID. This may be used instead\
    \ of the document.getElementById JavaScript function. |\n| getValue() | dwr.util.getValue(id)\
    \ | Gets value from HTML elements such as div and input elements. |\n| getText()\
    \ | dwr.util.getText(id) | Designed for select lists and returns the displayed\
    \ text instead of the value of the current option. |\n| getValues() | dwr.util.getValues({\
    \ div:null, textarea:null }) | This function gets the values of specified elements.\
    \ The function parameter is a map where the key is an HTML element ID and the\
