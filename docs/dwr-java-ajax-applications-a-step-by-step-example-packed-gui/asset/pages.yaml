- pgno: 68
  md: "# # Developing the Web Application\n\nSince we have already defined the name\
    \ of the Java class that will be used for creating the menu, the next thing we\
    \ do is implement it. The idea behind the `HorizontalMenu` class is that it is\
    \ used to read a properties file that holds the menus that are going to be on\
    \ the web page.\n\nWe add properties to a file named `dwrappplication.properties`,\
    \ and we create it in the same `samples`-package as the `HorizontalMenu`-class.\
    \ The properties file for the menu items is as follows:\n\n```\nmenu.1=Tables\
    \ and lists,TablesAndLists\nmenu.2=Field completion,FieldCompletion\n```\n\nThe\
    \ syntax for the menu property is that it contains two elements separated by a\
    \ comma. The first element is the name of the menu item. This is visible to user.\
    \ The second is the name of HTML template file that will hold the page content\
    \ of the menu item.\n\nThe class contains just one method, which is used from\
    \ JavaScript and via DWR to retrieve the menu items. The full class implementation\
    \ is shown here:\n\n```\npackage samples;\n\nimport java.io.IOException;\nimport\
    \ java.io.InputStream;\nimport java.util.List;\nimport java.util.Properties;\n\
    import java.util.Vector;\n\npublic class HorizontalMenu {\n    public HorizontalMenu()\
    \ {\n    }\n\n    public List<String> getMenuItems() throws IOException {\n  \
    \      List<String> menuItems = new Vector<String>();\n        InputStream is\
    \ = this.getClass().getClassLoader().\n            getResourceAsStream(\n    \
    \            \"samples/dwrappplication.properties\");\n        Properties appProps\
    \ = new Properties();\n        appProps.load(is);\n        is.close();\n     \
    \   for (int menuCount = 1; true; menuCount++) {\n            String menuItem\
    \ = appProps.getProperty(\"menu.\" + menuCount);\n            if (menuItem ==\
    \ null) {\n                break;\n            }\n            menuItems.add(menuItem);\n\
    \        }\n        return menuItems;\n    }\n}\n```"
