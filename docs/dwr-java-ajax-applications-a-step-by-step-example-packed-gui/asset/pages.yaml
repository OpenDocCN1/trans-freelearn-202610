- pgno: 66
  md: "![](img/5b721cfaa97eb697efc92e3914f62fca_66_0.png)\n\n# Configuring the Web\
    \ Application\n\nThe context root is worth noting (visible in the screenshot above).\
    \ We will need it when we test the application.\n\nThe other XML file, web.xml,\
    \ is very important as we all know. This XML will hold the DWR servlet definition\
    \ and other possible initialization parameters. The following code shows the full\
    \ contents of the web.xml file that we will use:\n\n```\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<web-app xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n    xmlns=\"http://java.sun.com/xml/ns/javaee\"\n    xmlns:web=\"http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\
    \n    xsi:schemaLocation=\"http://java.sun.com/xml/ns/javaee http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\
    \n    id=\"WebApp_ID\" version=\"2.5\">\n    <display-name>DWREasyAjax</display-name>\n\
    \    <servlet>\n        <display-name>DWR Servlet</display-name>\n        <servlet-name>dwr-invoker</servlet-name>\n\
    \        <servlet-class>\n            org.directwebremoting.servlet.DwrServlet\n\
    ```\n```"
