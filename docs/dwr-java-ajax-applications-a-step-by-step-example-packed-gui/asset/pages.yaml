- pgno: 163
  md: '# Setting up Queues in Geronimo


    In this messaging example, we use an open-source JMS messaging server, ActiveMQ,
    that is a part of the Geronimo application server. ActiveMQ is very good for testing
    our application since it supports a protocol called STOMP (Streaming Text Oriented
    Messaging Protocol, a text based protocol). STOMP enables many kinds of programming
    languages to participate in JMS messaging (even Telnet is possible; useful for
    quick testing) so we can use the existing tool as our "order system" in our example.
    When the "order system" (a Python program) receives the order it verifies it.
    Then, we manually send an order confirmation message back to the ActiveMQ messaging
    system and to our application. Then our application updates the web page using
    the Comet mechanism.


    +   1. The first thing to do is to create queues in the ActiveMQ for sending orders
    and receiving order confirmations. We use wizards in the Geronimo Server Console
    to create queues. JMS resources are found in the console Services | JMS Resources.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_163_0.png)'
  merge: -1
  img_proc: true
