    The Authors online table shows only Smith at first, and when Brown logs in, then
    Smith''s screen is updated with a new username in the Authors online table as
    is shown in the following screenshot:


    ![](img/5b721cfaa97eb697efc92e3914f62fca_206_1.png)'
