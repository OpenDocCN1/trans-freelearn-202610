- pgno: 138
  md: '# Afterword


    This map scroller sample features a very user friendly method for scrolling maps
    or images. We also saw that the implementation is very client-centric because
    our server-side Java code (which was remoted) has only one class and one method.


    # Summary


    This chapter presented user interface components that are available in many applications.
    Forms are present in all the applications that accept input from users. The navigation
    tree is user-friendly, and map scrolling is seen as a must in specific applications.


    Using these user interface components is easy with DWR. DWR makes it possible
    to add very dynamic behavior to applications easily. Although the samples are
    more or less hard-coded, the principal ideas are presented, and sample code is
    a good starting point for not-so-hard-coded applications.'
