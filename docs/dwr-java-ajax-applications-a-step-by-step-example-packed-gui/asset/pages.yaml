  md: '# # Afterword


    This sample presented a navigation tree and how DWR is used to provide menu elements
    dynamically.


    # # Map Scrolling Using DWR


    The last sample in this chapter is a map scrolling sample using DWR. Browser-based,
    mouse-controlled scrolling maps have become popular since Google Maps was launched.


    The principle idea, in the implementation of this sample, is to take a sufficiently
    large map and divide it to small squares of equal size. Then, based on the location,
    a certain number of the small squares are inserted into the visible map window,
    and when the user scrolls the map, by pressing the left mouse button, and dragging
    the mouse in the map window, new map squares are retrieved from the server (other
    implementations may also download map squares around the visible map window).


    In this sample, we use a geological map of the Tempe-Mareotis region of Mars,
    provided by the U.S. Geological Survey Astrogeology Research Program (http://astrogeology.usgs.gov/).
    For a direct link to the map and additional information, refer to http://astrogeology.usgs.gov/Projects/MapBook/fulllisting.jsp?mapNumber=1170.


    The following screenshot shows the full map of the Tempe-Mareotis region we are
    using in this sample.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_124_0.png)'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'We use two zoom levels. The original image size for zoom level 0 is 1000x825
    pixels and for zoom level 1 the image size is 2000x1632. Both original images
    are divided into squares of 100x100 pixels each, except the bottom part of the
    map since its height is not divisible by 100.


    The following are a few random examples of map squares:


    ![](img/5b721cfaa97eb697efc92e3914f62fca_125_0.png)


    As the original pictures are quite large, there are a total of 90 map squares
    for zoom level 0 and 340 squares for zoom level 1.


