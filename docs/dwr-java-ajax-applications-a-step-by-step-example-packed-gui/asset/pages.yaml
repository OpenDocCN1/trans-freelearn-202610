- pgno: 34
  md: "Signatures are specified in dwr.xml, and they are used to instruct DWR to correctly\
    \ operate on types that are included in collections such as java.util.List. For\
    \ example, if we have a remote method with the signature void setAdressses(List\
    \ addresses), DWR has no way of finding out that the type contained in a list\
    \ is String. That is why we need the following signature in dwr.xml to instruct\
    \ DWR to behave correctly.\n\n```\n<signatures>\n  <![CDATA[\n  import java.util.List;\n\
    \  import myclasses.AllAddresses;\n  AllAddresses.setAddresses(List<String> allAddresses);\n\
    \  ]]>\n</signatures>\n```\n\n# Integration with Other Projects\n\nOften, DWR\
    \ is not used just by itself. Perhaps, you have an on-going project where decision\
    \ has been made to use a framework such as JSF or Spring for building the whole\
    \ solution. In these cases, AJAX and DWR are just a part of the overall picture,\
    \ and so DWR needs to integrate with other projects nicely. And that it does.\n\
    \nDWR integrates with the following:\n\n+   - JSF (http://java.sun.com/javaee/javaserverfaces/),\
    \ Java Server Faces for building user interfaces\n+   - Spring (http://www.springframework.org/),\
    \ a complete Java/JEE application framework\n+   - WebWork (http://www.opensymphony.com/webwork/),\
    \ a web application development framework\n+   - Hibernate (http://www.hibernate.org/),\
    \ an object/relational persistence and query service\n+   - Integration to a portal\
    \ such as Apache Jetspeed using JSR 168 portlets is also doable; for example,\
    \ see the article on IBM developerWorks (http://www.ibm.com/developerworks/java/library/j-ajaxportlet/)\n\
    +   - And many others, whose integrations are provided by DWR or the other projects\
    \ itself\n\nExplaining all the integrations here is out of scope but, as an example,\
    \ JSF integration is pretty straightforward.\n\nDWR includes two extension points\
    \ for JSF integration; one is JsfCreator, which is used to access ManagedBeans\
    \ of the JSF from the DWR application and the other is DWR/Faces servlet filter,\
    \ which allows us to access Java beans from FacesContext."
  merge: -1
  img_proc: true
- pgno: 35
  md: "# DWR Features\n\nThe filter needs to be configured in the web.xml file in\
    \ order to use JsfCreator:\n\n```\n```xml\n<filter>\n    <filter-name>DwrFacesFilter</filter-name>\n\
    \    <filter-class>uk.ltd.getahead.dwr.servlet.FacesExtensionFilter</filter-class>\n\
    </filter>\n\n<filter-mapping>\n    <filter-name>DwrFacesFilter</filter-name>\n\
    \    <url-pattern>/dwr/*</url-pattern>\n</filter-mapping>\n```\n```\n\nIn the\
    \ dwr.xml file we insert the JSF ManagedBeans configuration:\n\n```\n```xml\n\
    <allow>\n    ...\n    <create creator=\"jsf\" javascript=\"ScriptName\">\n   \
    \     <param name=\"managedBeanName\" value=\"beanName\"/>\n        <param name=\"\
    class\" value=\"your.class\"/>\n    </create>\n    ...\n</allow>\n```\n```\n\n\
    After the configuration, we are able to use JSF ManagedBeans from the DWR application.\n\
    \n# Security\n\nSecurity is always important, and the DWR project has thought\
    \ about security very thoroughly. The DWR framework has taken into account many\
    \ security issues, and there is lots of discussion about security on the DWR website,\
    \ enough to fill several books about the subject.\n\nAmong the people for whom\
    \ security is important are developers like you and me. Software does only what\
    \ we instruct it to do, so we must be conscious about security during development\
    \ and do our best to limit the possibilities to exploit our work.\n\nWhile using\
    \ DWR, we manually specify in the dwr.xml configuration (unless we have created\
    \ some automatic code-generation software that does it for us) which Java classes\
    \ and methods we want to remote to JavaScript. This way we can be sure that no\
    \ attacker can exploit any other objects than our explicitly remoted Java objects\
    \ (and we can concentrate to make those objects as secure as possible)."
  merge: -1
  img_proc: true
- pgno: 36
  md: "The configuration in `dwr.xml` also includes a create entry for each remoted\
    \ Java class. We can use singleton, new, or some other mechanism. We can also\
    \ limit which methods are allowed using the include and exclude elements in `dwr.xml`.\
    \ There are also security parameters in the `web.xml` configuration file such\
    \ as `allowScriptTagRemoting` and `crossDomainSessionSecurity`, which when enabled,\
    \ may be a huge security risk. So make sure you understand what you are doing\
    \ if you are enabling the parameters.\n\nThere is one configuration parameter\
    \ that is very useful while developing a DWR application, but that is a security\
    \ risk in the production (especially public) site. The following init-param, debug,\
    \ and test mode can be added in the web.xml.\n\n```\n```xml\n<init-param>\n  \
    \  <param-name>debug</param-name>\n    <param-value>true</param-value>\n</init-param>\n\
    ```\n```\n\nWhen debug/test mode is enabled, DWR generates test pages (there is\
    \ a sample screen in Chapter 4) that are useful tools to get to know the DWR functionality.\n\
    \nIt is also possible to use JEE access control mechanisms and limit access to\
    \ DWR itself for specific JEE roles. These are specified in the web.xml file.\
    \ Within DWR, there is also a role-based access control to the methods of remoted\
    \ Java objects. DWR can also be integrated with Spring Security (also known as\
    \ Acegi Security), `http://www.acegisecurity.org/`, the official security projects\
    \ of the Spring Portfolio. The description of Acegi and DWR integration is found\
    \ on `http://java-x.blogspot.com/2007/08/handling-security-with-ajax-dwr-and.html`.\n\
    \nDWR is also designed so that there is no possibility of an attacker accessing\
    \ and manipulating DWR core files and changing the security parameters for example.\n\
    \n# Minimize Risks\n\nSecurity is not a trivial issue, and we could spend years\
    \ in the security field and still leave a lot unfinished. As developers, our job\
    \ is to make sure that security risks are minimized, and at least realize what\
    \ might happen if we remote a certain Java method.\n\nA very good example from\
    \ the DWR website is that if we make a remote call to a method called `appendStringToFile()`,\
    \ which appends a given string to a predefined file, then a possible attacker\
    \ can send a large number of requests and fill the file system with nonsense and\
    \ thus cause an unexpected server downtime. The cost of downtime may be anything\
    \ from little inconvenience to millions of dollars."
  merge: -1
  img_proc: true
- pgno: 37
  md: 'In order to prevent giving accidental access that may cause harm, we have to
    think of what we want to do and also check the input parameters. Checking input
    parameters is the most important thing that we as developers can do to make sure
    accidents do not happen.


    In the previous example, if we have remoted the `appendStringToFile()` method,
    we can do lots of checks on whether the file system is filling, whether it is
    a string valid for the purpose for which it was meant (such as log entry to a
    log file), who the requester is, and so on.


    Also make sure that `escapeHTML` is used in order to prevent cross-site scripting
    (XSS) attacks. XSS is something worth knowing about. So please refer to Wikipedia
    (http://en.wikipedia.org/wiki/Cross-site_scripting) for a detailed description.


    # Summary


    This chapter presented an overview of DWR features including JavaScript libraries
    (`util.js`, `engine.js`, and `gi.js`), security, and Reverse AJAX and on basic
    operational elements of how DWR works.


    In addition to the topics discussed in this chapter, DWR has lots of other useful
    features that may or may not be relevant to developers. It depends on the application.
    Topics in this chapter are intended to be high-level overviews, but they will
    give you a good starting point to learn more from the DWR website (http://directwebremoting.org/dwr/documentation)
    and even from the DWR source code.


    Very often, most developers do not need all the features of a technology when
    they start working on a project. After the project has been going on for some
    time, we may find out that the solution has matured to include most if not all
    features of the technology. But that is typically not the initial case and, besides,
    we have to start somewhere and it is practical to start taking small steps at
    a time, like toddlers learning to walk.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 3

    Getting Started


    In this chapter, we are going to set up the development environment for the coding
    work we will do in the following chapters. We will also have a look at supported
    environments, configuration, testing, and debugging.


    As the development environment for the sample code in this book, we have the following
    components: Eclipse as IDE, Apache Geronimo 2.x.x as the application server, Java
    1.5.x as Java runtime, Firefox 2.0.0.x as the client, and Windows as the operating
    system (Linux would work just as well).


    This chapter includes the following sections:


    +   - Supported Browsers and Environments – describes which software components
    are supported by DWR

    +   - Configuration – presents DWR configuration, including `dwr.xml` and `web.xml`
    files

    +   - Setting up a development environment – has steps to set up components for
    development

    +   - Testing and Debugging – describes how to test and debug while developing
    applications using DWR

    +   - Error Handling – describes how DWR handles error handling, and how it is
    configured to do it

    +   - Packaging and deployment – shows how to package and deploy DWR applications
    using Eclipse and Geronimo'
  merge: -1
