- pgno: 62
  md: '# # User Interface: Basic Elements


    In this chapter, we will get to the actual hands-on work. We will develop samples
    based on DWR, which show how to dynamically change the common user interface elements
    such as tables and lists as well as field completion. We also make a dynamic user
    interface skeleton for our samples that will hold all the samples in this book.


    The section on dynamic user interfaces shows how to get started with a DWR application,
    and it presents a user interface skeleton that will be used to hold the tables
    and lists sample, and the field completion (aka. autosuggest/autocomplete) sample.
    Samples in the following chapter will use the same user interface skeleton, with
    the exception of the sample applications in Chapter 7.


    The following are the sections in this chapter:


    +   - Creating a Dynamic User Interface—starts with creating a web project and
    a basis for samples mentioned in this chapter

    +   - Implementing Tables and Lists—shows us how to use DWR with them

    +   - Implementing Field Completion—has a sample for typical field completion


    # ## Creating a Dynamic User Interface


    The idea behind a dynamic user interface is to have a common "framework" for all
    samples. We will create a new web application and then add new features to the
    application as we go on. The user interface will look something like the following
    figure:'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# User Interface: Basic Elements


    ![](img/5b721cfaa97eb697efc92e3914f62fca_63_0.png)


    The user interface has three main areas: the title/logo that is static, the tabs
    that are dynamic, and the content area that shows the actual content.


    The idea behind this implementation is to use DWR functionality to generate tabs
    and to get content for the tab pages. The tabbed user interface is created using
    a CSS template from the Dynamic Drive CSS Library (http://dynamicdrive.com/style/csslibrary/item/css-tabs-menu).
    Tabs are read from a properties file, so it is possible to dynamically add new
    tabs to the web page. The following screenshot shows the user interface.


    ![](img/5b721cfaa97eb697efc92e3914f62fca_63_1.png)


    The following sequence diagram shows the application flow from the logical perspective.
    Because of the built-in DWR features we don''t need to worry very much about how
    asynchronous AJAX "stuff" works. This is, of course, a Good Thing.'
  merge: -1
  img_proc: true
