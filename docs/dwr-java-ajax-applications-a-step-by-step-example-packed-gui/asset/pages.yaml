- pgno: 27
  md: 'As we can see from the figure, Comet enables the server to send updates in
    response to the events, almost in real-time, and there is no need to wait for
    the user to open a connection or to use Polling.


    As mentioned in the previous section, Comet requires only the enabling of Active
    Reverse AJAX in the init parameter and the enabling of Reverse AJAX in the web
    page. Active Reverse AJAX using Comet has two modes: Full Streaming Mode (default
    in DWR 2.0.3 and earlier versions) and Early Closing Mode (default in DWR 2.0.4
    and later versions).


    The Full Streaming Mode has the fastest response time and it enables near real-time
    responses to the client when an event occurs on the server. In this mode, every
    60 seconds, DWR checks whether the browser is active or not by closing the connection
    and reopening it. Early Closing Mode on the other hand causes DWR to close the
    connection when browser receives the output and then to reopen it. For Early Closing
    Mode, there is the init parameter called maxWaitAfterWrite and its value is the
    time in milliseconds to wait before closing the connection (and reopening it)
    after receiving input from the server.


    There are a couple of issues that should be remembered while using Comet in DWR
    applications, especially for applications that have a large number of users. As
    clients keep the connections open to the server, it is possible that the server
    resources are consumed for connections and their threads. This increases the infrastructure
    requirements for the DWR application unnecessarily. The solution is to use the
    maxWaitAfterWrite init parameter and tweak it to an appropriate value. Other solutions
    are to use Polling or Passive Reverse AJAX.


    In all the three methods, Piggyback, Polling, and Comet, DWR shows its strengths
    because we don''t really have to know the implementation details of Reverse AJAX.
    DWR handles them behind the scenes and hides the details of Comet and the Polling
    methods, and we can use any of the three methods by just configuring DWR in the
    correct manner.


    # DWR JavaScript Libraries


    DWR includes a few JavaScript libraries that are required for DWR to work and
    that are also helpful for developers: engine.js, util.js, and gi.js.


    The first JavaScript library, engine.js, is the core of DWR''s browser-side functionality,
    and is required for all the pages that use AJAX and DWR. The second library, util.js,
    contains useful utility functions but is not required for DWR. And the third library,
    gi.js, is used to integrate DWR with TIBCO General Interface (GI) for AJAX Applications.'
  merge: -1
  img_proc: true
