- pgno: 18
  md: 'The main component of AJAX technology is XmlHttpRequest, which is a JavaScript
    object, first supported by Mozilla in 2002. The concept was originally developed
    by Microsoft in 1999 for Internet Explorer 5.0 and it was then called XMLHTTP.
    The following link provides the details and history of XmlHttpRequest:

    http://en.wikipedia.org/wiki/XMLHttpRequest.


    XmlHttpRequest is used to transfer data between client and server asynchronously.
    The following figure shows the AJAX sequence diagram and how XmlHttpRequest is
    used:


    ![](img/5b721cfaa97eb697efc92e3914f62fca_18_0.png)


    AJAX is dealt with in detail in many books such as Head Rush Ajax, a "brain friendly
    guide" to AJAX and also on Internet sites. Further, the assumption is that most
    of you already know AJAX and you are reading this book for reasons other than
    just learning AJAX basics.


    # DWR: AJAX for Java Developers


    Direct Web Remoting (http://www.directwebremoting.org), is an Open Source Java
    framework, licensed under commercial-friendly Apache Software License v2 (http://www.apache.org/licenses/LICENSE-2.0.html)
    for building AJAX applications. DWR''s main idea is to hide AJAX implementation
    details such as XMLHttpRequest from developers. Developers can concentrate on
    developing the application and business objects and leave AJAX details behind
    the scenes where they belong.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Introduction


    DWR allows server-side Java classes to be used in a browser (it''s like RPC between
    JavaScript functions and server-side Java) and also allows JavaScript functions
    to be used in a server (Reverse AJAX). Through an XML-based configuration, DWR
    dynamically generates JavaScript functions of Java classes, which can be called
    from the browser via a DWR JavaScript library. A DWR servlet on the server side
    receives requests and calls the actual Java implementation.


    The following figure displays the positioning of DWR in user applications and
    is taken from the DWR website (http://directwebremoting.org/dwr/overview/dwr).


    ![](img/5b721cfaa97eb697efc92e3914f62fca_19_0.png)


    In the previous figure, the JavaScript function **eventHandler()** responds to
    some browser event like clicking a button. Event handlers use the **AjaxService**
    object and call the **getOptions()** method just as if **AjaxService** were a
    normal JavaScript object. A developer can implement client-side and server-side
    code and leave the communication between the client and the server to DWR.


    Calling server-side Java from JavaScript causes a lot of things to happen and
    also requires a lot to happen behind the scenes:


    +   - When a DWR-enabled web page is requested, DWR dynamically generates JavaScript
    functions from Java classes based on configuration.

    +   - When the function **eventHandler()** gets called, say when clicking a button,
    the developer calls a dynamically generated function (**AjaxService.getOptions(populateList)**
    as shown in the previous figure) and the DWR JavaScript library takes the parameters,
    serializes them, and calls the DWR servlet on the server.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - The DWR servlet receives a request and, based on configuration, the servlet
    instantiates a Java object such as **AjaxService**, and calls the required method,
    for example, **AjaxService.getOptions(populateList)**.

    +   - When the Java method is finished, the return value (a String array) is returned
    to the DWR servlet, and servlet serializes the return value and sends the response
    to the DWR JavaScript function on the browser.

    +   - The DWR JavaScript function receives the response on the browser and based
    on the parameter, **populateList** (this is the name of the callback function
    in the **AjaxService.getOptions()** function), DWR calls the **populateList**
    function with the return value from the Java method as the parameter. The **AjaxService.getOptions()**
    JavaScript function is generated dynamically by DWR, and it communicates with
    the DWR servlet behind the scenes.

    +   - The callback function (written by the developer) does the desired thing
    with the return value such as updating the browser page and adding new options
    to the drop-down field.


    DWR is well-suited for Java developers, because this kind of approach is very
    easy to get into.


    # The DWR Community


    DWR has very active mailing lists available for DWR users:


    +   - Java.net (https://dwr.dev.java.net/servlets/SummarizeList?listName=users)

    +   - Nabble (http://www.nabble.com/DWR---Users-f13934.html)

    +   - Gmane (http://dir.gmane.org/gmane.comp.java.dwr.user)


    These mailing lists have lots of information, which would be helpful to any DWR
    user, and any one can participate in them.


    There is a mailing list available for DWR security, where DWR security issues
    are discussed. In order to participate, application to list must be made separately
    and it must include corporate email addresses and titles or other means of identification.
    Separate applications are made so that DWR security issues can be discussed without
    public dessemination (it is not intended to keep security issues a secret). Application
    to join security mailing list can be done from http://groups.google.com/group/dwr-security'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Introduction


    DWR development mailing list are as follows:


    +   - Java.net (`https://dwr.dev.java.net/servlets/SummarizeList?listName=dev`)

    +   - Nabble (`http://www.nabble.com/DWR---Dev-f13937.html`)


    The blog of DWR creator Joe Walker (`http://directwebremoting.org/blog/joe`) includes
    news about DWR and thoughts about web development.


    Commercial support is also available from SitePen (`http://sitepen.com/services/support.php`).
    There are several support packages available, and there are also possibilities
    to customize support packages to specific needs.


    DWR is used by thousands of developers, and it has been used by companies such
    as American Airlines, Walmart, Citigroup, Mastercard, and many others. DWR is
    used both in public sites and Intranet sites.


    DWR is also part of the Dojo Foundation, which is an independent legal entity
    that provides infrastructure for development. The members include IBM and SitePen.
    In addition to DWR, Dojo Foundation also sponsors Dojo Toolkit, OpenRecord, and
    Cometd projects. The following website has more information about the Dojo Foundation:


    ```

    http://dojotoolkit.org/foundation

    ```


    # Summary


    This chapter briefly introduced AJAX and DWR. AJAX is a fundamental technology
    that uses browser-based JavaScript to build Internet applications with better
    user experience than typical request-response web applications.


    DWR is a Java framework for building AJAX applications, and it is targeted mainly
    at Java developers who don''t want to implement the low-level "stuff" that makes
    AJAX work.


    The rest of the book is about DWR features and sample code that can be used in
    your own projects. The examples provided in the later chapters show some of the
    common situations in which to use DWR and how to use it.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 2

    DWR Features


    This chapter describes some main features of DWR: Reverse AJAX, security, DWR
    JavaScript libraries, and DWR''s integration with other projects.


    Reverse AJAX is basically a method to call client-side JavaScript from server-side
    Java classes. The security section discusses what has been done in DWR in order
    to prevent unwanted access to the server by exploiting DWR features.


    DWR includes a couple of useful JavaScript libraries that are explained here together
    with how to use DWR with other projects, such as Struts or JSF.


    This chapter covers the following sections:


    +   - Ease of Use — A high-level view of how DWR makes a developer''s life easier

    +   - Reverse AJAX — Describes what Reverse AJAX means

    +   - DWR JavaScript Libraries — Describes the JavaScript libraries that come
    with DWR: `engine.js`, `util.js`, and `gi.js`

    +   - Converters — Presents how DWR marshals/unmarshals objects

    +   - Creators, Filters, and Signatures — Introduces important DWR configuration
    elements

    +   - Integration with Other Projects — Briefly describes how DWR integrates with
    other projects

    +   - Security — Gives an overview of DWR security


    In addition to the features described in this chapter, DWR features such as error
    handling and configuration are presented in Chapter 3, *Getting Started.*'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# # Ease of Use


    The main feature of DWR is its ease of use. DWR hides a lot of details from developers.
    This means that we can use AJAX functionality and we don''t need to know about
    `XmlHttpRequest` for example, or how to send a Java object to a browser and so
    on. DWR has its own framework for performing the required marshaling/unmarshaling
    of Java objects to JavaScript and vice versa.


    The setup for DWR consists of copying the `dwr.jar` file to the **WEB-INF | lib**
    directory in the application WAR file, and installing the application in the server
    before starting to use it. There are no special interfaces to implement in our
    own Java classes and it is even possible to develop a Java object completely transparently,
    so that the object doesn''t know any DWR-specific classes. DWR provides well-documented
    APIs for us to use, and we can take advantage of it when developing, for example,
    Reverse AJAX applications.


    And finally we can leverage the existing Java skills because DWR does not force
    us to replace the existing code, but instead lives side by side with non-AJAX
    applications and allows us to gradually change the required parts of an application
    to AJAX functionality.


    # # Reverse AJAX


    The term Reverse AJAX is used when a server is used to query and/or control a
    client-browser behavior. This may cause some questions because it sounds like
    our browsers are now vulnerable to attack while we visit the web pages of the
    world.


    Luckily that is not the case, because it is not possible for a server to open
    a connection to a browser. A browser must always be the initiator of the connection.
    So, the question about security is actually valid, but a problem would mean that
    the website in question is designed and implemented for causing harm.


    DWR supports three different methods to do Reverse AJAX in applications: Piggyback,
    Polling (by the client), and Comet (server push).


    # # Piggyback


    The piggyback method works so that whenever a server has an update to be sent
    to the client, it waits until the client opens a connection and requests some
    content from the server. When that happens, the server includes a new update with
    the response, and it is delivered to the client where DWR recognizes the update
    and acts accordingly and makes the update on the user''s web page.'
  merge: -1
  img_proc: true
- pgno: 24
  md: "The Piggyback method is the default method for Reverse AJAX in DWR and it is\
    \ called Passive Reverse AJAX (the other methods are called Active Reverse AJAX)\
    \ and requires no configuration. For busy developers like us it is often a good\
    \ enough solution (by the way, learning when to stop and when to develop \"good-enough\
    \ software\" is one step from journeyman to master; see *The Pragmatic Programmer:\
    \ From Journeyman to Master*, by Andrew Hunt and David Thomas)\n\nA downside to\
    \ Piggyback is that any update that happens on the server side may take a long\
    \ time before it is visible to users. Depending on the application, this may not\
    \ be a problem, but if it is, then the other two methods may be used, Polling\
    \ and Comet, which are Active Reverse AJAX methods.\n\nUsing Reverse AJAX requires\
    \ the use of DWR classes in the application code on the server side. DWR has a\
    \ class called ScriptProxy that is used to execute JavaScript functions on the\
    \ client. As an example, the following code snippet, which could be in a remote\
    \ Java method, gets all the script sessions (in essence, HTTP sessions but for\
    \ scripts) for a given page, mainpage.jsp, and then adds a function call that\
    \ gets called in all the clients that are known to the server and have the mainpage.jsp\
    \ open.\n\n```\nCollection<ScriptSession> sessions = serverContext.getScriptSessionsByPage(contextPath\
    \ + \"/mainpage.jsp\");\nScriptProxy proxy = new ScriptProxy(sessions);\nproxy.addFunctionCall(\"\
    newMessage\",newMessage);\n```\n\nOn the mainpage.jsp, we would have the following\
    \ function, newMessage, that updates some field in the web page.\n\n```\nfunction\
    \ newMessage(newMessageParam)\n{\n    elementToBeUpdated=document.getElementById(\"\
    messageArea\");\n    elementToBeUpdated.innerHTML=newMessageParam;\n}\n```\n\n\
    No configuration is needed when using Reverse AJAX using the Piggyback method.\
    \ It is enabled by default in DWR. When using Piggyback, clients receive updates\
    \ after they make an AJAX (DWR) request to the server application. DWR then sends\
    \ all updates (from Reverse AJAX methods) together with the actual response to\
    \ the client where DWR updates the web page (as in the previous example).\n\n\
    # Polling\n\nPolling is a \"no-brainer\" way to do Reverse AJAX, although it really\
    \ isn't reverse since DWR periodically polls the server if there are any events\
    \ on the server side of the application that require updates to the web page."
  merge: -1
  img_proc: true
- pgno: 25
  md: "This method may be good in some cases, especially when there is no issue about\
    \ extra load on the network and the server that polling causes or when updates\
    \ to a client do not need to be (near) real-time as in Comet.\n\nWhen we use the\
    \ Polling method for Reverse AJAX the code is the same as in the sample code in\
    \ the Piggyback section. Only the configuration needs to be changed. In order\
    \ to use Polling we need to configure DWR to Active Reverse AJAX. This is done\
    \ by adding the following init parameter to the DWR servlet in the web.xml file.\n\
    \n```\n<init-param>\n    <param-name>activeReverseAjaxEnabled</param-name>\n \
    \   <param-value>true</param-value>\n</init-param>\n```\n\nWe also need to enable\
    \ web pages for Reverse AJAX. This is done by adding the following line to a web\
    \ page that we are using to receive Reverse AJAX requests from the server.\n\n\
    ```\ndwr.engine.setActiveReverseAjax(true);\n```\n\nThe above configuration is\
    \ actually all that we need for using the Comet method, which can be seen in the\
    \ following section. For the Polling method, we need an additional init parameter\
    \ in the web.xml file:\n\n```\n<init-param>\n    <param-name>org.directwebremoting.extend.ServerLoadMonitor</param-name>\n\
    \    <param-value>org.directwebremoting.impl.PollingServerLoadMonitor</param-value>\n\
    </init-param>\n```\n\nThere is also the optional init parameter for specifying\
    \ the poll interval. The default interval is 5 seconds, and it can be changed\
    \ with the following init parameter.\n\n```\n<init-param>\n    <param-name>disconnectedTime</param-name>\n\
    \    <param-value>60000</param-value>\n</init-param>\n```\n\n# Comet\n\nComet,\
    \ known to some as long-lived HTTP, is a very recent term (used first by Alex\
    \ Russell in March 2006 http://alex.dojotoolkit.org/?p=545) for a server push\
    \ method, where the browser opens the connection and it is kept open so that the\
    \ server can push updates to the browser when needed, and the latency for updates\
    \ is very low. The following figure shows how Comet compares to the normal AJAX\
    \ model:"
  merge: -1
  img_proc: true
