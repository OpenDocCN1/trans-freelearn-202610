    This class has the same methods as the class that used a CSV file as the data
    source. Note that it would be good to define an interface for similar classes
    and then use, for example, a factory class to select the correct implementation
    during run time.


    The getConnection() method retrieves a connection from the Geronimo runtime using
    the specified data source name, and the closeConnection() method closes the connection
    (or returns it to the Geronimo pool).


    The other methods in the class that retrieve or update countries in the database
    are the ones using plain and simple JDBC calls and SQL scripts.


    In order to use this class in our application, we need to configure it to access
    the Geronimo Database Pools. For this, we add data source entries to web.xml and
    geronimo-web.xml. In the geronimo-web.xml file, we map the database pool that
    we created earlier to a data source we have specified in the web.xml file.


    The following entry in the geronimo-web.xml file configures our database pool
    as a dependency for our application:


    ```

    <sys:dependencies>

    .

    .

    <sys:dependency>

    <sys:groupId>console.dbpool</sys:groupId>

    <sys:artifactId>EasyAjaxDBPool</sys:artifactId>

    <sys:version>1.0</sys:version>

    <sys:type>rar</sys:type>

    </sys:dependency>

    .

    .

    </sys:dependencies>

    ```


    Moreover, in geronimo-web.xml, there is an entry for mapping a data source name
    to the database pool. The following entry is just after the context-root element
    in the XML file.


    ```

    <resource-ref>

    <ref-name>jdbc/CountryDataSource</ref-name>

    <resource-link>EasyAjaxDBPool</resource-link>

    </resource-ref>

    ```'
