- pgno: 94
  md: '# # Testing Tables and Lists


    The application should be ready for testing if we have had the test environment
    running during development. Eclipse automatically deploys our new code to the
    server whenever something changes. So we can go right away to the test page `http://127.0.0.1:8080/DWREasyAjax`.
    On clicking **Tables and lists** we can see the page we have developed. By selecting
    some letter, for example "I" we get a list of all the countries that start with
    letter "I" (as shown in the previous screenshot).


    Now we can add notes to countries. We can double-click any table cell under **Notes**.
    For example, if we want to enter notes to **Iceland**, we double-click the **Notes**
    cell in Iceland''s table row, and we get the edit box for the notes as shown in
    the following screenshot:


