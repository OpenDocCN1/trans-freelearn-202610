  img_proc: true
- pgno: 79
  md: "We have already seen the first method in the `HorizontalMenu.getMenuItems(setMenuItems)`\
    \ function call. Remember that there are no parameters in the `getMenuItems()`\
    \ Java method, but in the JavaScript call, we added the callback function name\
    \ at the end of the parameter list. If the Java method has parameters, then the\
    \ JavaScript call is similar to `CountryDB.getCountries(selectedLetters,setCountryRows)`,\
    \ where selectedLetters is the input parameter for the Java method and setCountryRows\
    \ is the name of the callback function (we see the implementation later on).\n\
    \nThe second method to use callbacks is a meta-data object in the remote JavaScript\
    \ call. An example (a full implementation is shown later in this chapter) is shown\
    \ here:\n\n```\nCountryDB.saveCountryNotes(ccode,newNotes, {\n    callback:function(newNotes)\n\
    \    {\n        //function body here\n    }\n});\n```\n\nHere, the function is\
    \ anonymous and its implementation is included in the JavaScript call to the remoted\
    \ Java method. One advantage here is that it is easy to read the code, and the\
    \ the code is executed immediately after we get the return value from the Java\
    \ method. The other advantage is that we can add extra options to the call.\n\n\
    Extra options include timeout and error handler as shown in the following example:\n\
    \n```\nCountryDB.saveCountryNotes(ccode,newNotes, {\n    callback:function(newNotes)\n\
    \    {\n        //function body here\n    },\n    timeout:10000,\n    errorHandler:function(errorMsg)\
    \ { alert(errorMsg); }\n});\n```\n\nIt is also possible to add a callback function\
    \ to those Java methods that do not return a value. Adding a callback to methods\
    \ with no return values would be useful in getting a notification when a remote\
    \ call has been completed.\n\n# Afterword\n\nOur first sample is ready, and it\
    \ is also the basis for the following samples. We also looked at how applications\
    \ are tested in the Eclipse environment."
