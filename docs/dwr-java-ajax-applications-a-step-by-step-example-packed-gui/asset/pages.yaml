    # Callback Functions


    We saw our first callback function as a parameter in the HorizontalMenu.getMenuItems(setMenuItems)
    function, and since callbacks are an important concept in DWR, it would be good
    to discuss a little more about them now that we have seen their first usage.


    Callbacks are used to operate on the data that was returned from a remoted method.
    As DWR and AJAX are asynchronous, typical return values in RPCs (Remote Procedure
    Calls), as in Java calls, do not work. DWR hides the details of calling the callback
    functions and handles everything internally from the moment we return a value
    from the remoted Java method to receiving the returned value to the callback function.


    Two methods are recommended while using callback functions.'
