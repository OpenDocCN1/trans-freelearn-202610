- pgno: 80
  md: 'Using DWR, we can look at JavaScript code on the browser and Java code on the
    server as one. It may take a while to get used to it, but it will change the way
    we develop web applications. Logically, there is no longer a client and a server
    but just a single run time platform that happens to be physically separate. But
    in practice, of course, applications using DWR, JavaScript on the client and Java
    in the server, are using the typical client-server interaction. This should be
    remembered when writing applications in the logically single run-time platform.


    # Implementing Tables and Lists


    The first actual sample is very common in applications: tables and lists. In this
    sample, the table is populated using the DWR utility functions, and a remoted
    Java class. The sample code also shows how DWR is used to do inline table editing.
    When a table cell is double-clicked, an edit box opens, and it is used to save
    new cell data.


    The sample will have country data in a CSV file: country Name, Long Name, two-letter
    Code, Capital, and user-defined Notes. The user interface for the table sample
    appears as shown in the following screenshot:


    ![](img/5b721cfaa97eb697efc92e3914f62fca_80_0.png)'
