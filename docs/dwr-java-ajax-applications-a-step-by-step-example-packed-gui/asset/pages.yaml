- pgno: 59
  md: '# Deployment Using the Deployer Tool


    The Deployer tool is a command-line tool that is used primarily to install and
    uninstall applications in Geronimo. Tool is located in the **bin** directory and
    it is either `deploy.bat` or `deploy.sh` depending on the operating system.


    The tool syntax is:


    ```

    deploy.[bat|sh] [general options] command [command options]

    ```


    To install a new WAR file, we use the deploy command:


    ```

    deploy -user system -password manager deploy d:\temp\

    HelloWorldServlet.war

    ```


    We get the following confirmation screen about successful installation:


    ![](img/5b721cfaa97eb697efc92e3914f62fca_59_0.png)


    Note that we get more information when we install using the command-line tool
    than when installing it by using the administration console. We see the module
    name and also the context root from the prompt. The module name is important because
    that is used to uninstall the application. The uninstall command is:


    ```

    deploy -user system -password manager undeploy sample/

    HelloWorldServlet/1.0/car

    ```


    Another important command is `list modules`, which shows all the installed modules
    currently running in the application server. All other commands for the deploy
    command are found in the Geronimo documentation.


    The deployer tool is probably the most useful way to do deployment. It allows
    automation of the deployment process, and we can minimize manual errors. Not to
    mention, it is much, much faster to let the script do the deployment rather than
    manually installing using the administration console.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# # Deployment Using Hot Deployment


    Hot deployment is the easiest method of installation. Here, we just copy our sample
    WAR file to Geronimo''s **deploy** directory, and Geronimo does the rest. We can
    verify the installation using the `list modules` command of the deployer tool.


    Uninstallation is also straightforward. We delete the WAR file from the deploy
    directory and Geronimo will uninstall the application.


    Hot deployment is useful for quick and possibly dirty installations of applications.
    In real life, it may probably be better to use the deployer command-line tool
    because of scripting, and the automation that results from scripting the deployment
    process.


    # # Summary


    Now, we have set up our development environment and also taken a look at supported
    environments, testing, debugging, packaging, and deployment. We have also covered
    configuration of DWR. So everything is in good shape to start working with DWR.


    The rest of the book will concentrate on the real code, and we will see DWR features
    that were introduced in this and the earlier chapters.'
  merge: -1
  img_proc: true
