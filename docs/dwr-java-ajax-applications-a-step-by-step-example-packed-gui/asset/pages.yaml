    We test the web services integration using the form example. Since we have just
    updated the form example to use a web service for credit card validation we can
    verify whether a web service is called using, for example, the Wireshark network
    protocol analyzer (http://www.wireshark.org), or the TCP/IP monitor that comes
    with Eclipse tooling. The following is a screenshot of a web service request from
