    # Integrating with Web Services


    In this chapter, we use a third-party web service to do the credit card validation.
    This credit card validation service was found (after a quick search) on the Internet,
    and it is suitable for our example. The web service is hosted by a company called
    Hypercom (http://www.hypercom.com).'
