  md: 'When the book is finished, authors will vote for publishing. Authors can vote
    only once, and a vote cannot be taken back. When all the authors have voted for
    publishing, the book is moved to a published status, and it is formatted for reading.


    # Starting the Project


    We start the project by creating a new web project in Eclipse using the name **DWRBookAuthoring**.
    In this case, development starts with the HTML pages. We need a login page, login
    failed page, and main page that will hold all the JavaScript functions. We will
    also use the CSS from the Dynamic Drive as we did in the previous chapters.


