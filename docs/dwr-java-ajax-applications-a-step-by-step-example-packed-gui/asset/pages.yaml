- pgno: 32
  md: '| Function | Syntax | Description |

    |---|---|---|

    | `toDescriptiveString()` | `dwr.util.toDescriptiveString(id,detailLevel,options)`
    | A useful pretty-print function that prints a JavaScript object in human-readable
    form, with the possibility to choose the level detail. |

    | `useLoadingMessage()` | `dwr.util.useLoadingMessage()` | DWR-specific loading
    message that shows "loading" on the top right corner of the web page. |


    The descriptions in the table are just for reference. The DWR samples in the following
    chapters show how to use these utility functions and the DWR homepage explains
    these functions in more detail. And, of course, JavaScript source code is available
    for those who are interested in looking into details.


    One parameter option that is worth mentioning for functions is `escapeHTML:false`.
    By default, escapeHTML is true and means that all HTML elements are escaped (especially
    <, >, &, double quote, and single quote; this is to prevent cross-site scripting
    attacks).


    # gi.js


    The `gi.js` library helps to integrate DWR with TIBCO General Interface (GI) for
    AJAX Applications, an Open Source library that includes dozens of ready-made AJAX
    components as well as tools to help the development of AJAX applications using
    TIBCO General Interface.


    DWR''s `gi.js` provides useful functions to integrate with TIBCO GI such as `dwr.gi.toCdfDocument()`,
    which generates CDF (**Common Data Format**) documents from JavaScript objects.
    CDF is TIBCO GI''s common format that allows sharing data among TIBCO GI components,
    performing data mapping and transferring data between client controls.


    More information about TIBCO GI is found on the TIBCO Developer Network, `http://www.tibco.com/devnet/gi/default.jsp`.


    # Converters


    Converters are DWR''s means of marshaling data back and forth from the client
    to the server. There are many basic converters that are enabled by default, and
    it is also possible to create new converters.'
