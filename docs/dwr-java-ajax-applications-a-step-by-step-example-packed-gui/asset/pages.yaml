- pgno: 133
  md: "Using the zoomLevel and the mapPositionIndex, images are retrieved using the\
    \ getImages() function. It just calls the remoted Java method, where the callback\
    \ function for the Java method is setImages().\n\nThe setImages() function receives\
    \ an array of image names from the Java method, and it uses a for loop to create\
    \ img elements, which are appended to the map area div element.\n\nThe setRefGrid(),\
    \ startScroll(), stopScroll(), stopScrollOnOut(), and mouseMove() functions are\
    \ used to handle map scrolling. The way scrolling works is that the startScroll()\
    \ function is called when the user presses the mouse button down. The function\
    \ then adds the event listeners for the mousemove, mouseup, mouseout, and mouseover\
    \ events. While the mouse button is pressed down and the mouse is moved, then\
    \ the mouseMove() function is called.\n\nThe mouseMove() function calculates the\
    \ grid position the mouse is in (remember that the map view port was 4 by 4 squares).\
    \ The reference position is set using the setRefGrid() function (this is also\
    \ called when the button is pressed). If the mouse cursor has moved to a new grid\
    \ position, then the getImages() function is called with the new mapPositionIndex,\
    \ and the map squares are updated in the page.\n\nWhen the mouse button is released,\
    \ the stopScroll() function is called, and all event listeners are removed. This\
    \ also happens when the user moves the mouse cursor outside the map area div element.\n\
    \nThe actual map images are in the WebContent | mapimages directory. Map square\
    \ images from zoom level 0 are tempe-mareotis-zlevel-0-0.jpg to tempe-mareotis-zlevel-0-89.jpg,\
    \ and for zoom level 1, tempe-mareotis-zlevel-1-0.jpg to tempe-mareotis-zlevel-1-339.jpg,\
    \ thereby taking it to well over 400 images for just two zoom levels.\n\n# Creating\
    \ the MapScroller Java Class\n\nFinally, we need the Java class that returns the\
    \ image names. The Java code is as follows:\n\n```\npackage samples;\n\nimport\
    \ java.util.List;\nimport java.util.Vector;\n\npublic class MapScroller {\n\n\
    \    private int[] imagesInRowInZLevel = { 10, 20 };\n    private String imageName\
    \ = \"tempe-mareotis-zlevel-\";\n```"
