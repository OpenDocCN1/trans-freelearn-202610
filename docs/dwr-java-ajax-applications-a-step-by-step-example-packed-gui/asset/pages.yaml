  img_proc: true
- pgno: 69
  md: 'The implementation is straightforward. The getMenuItems() method loads properties
    using the ClassLoader.getResourceAsStream() method, which searches the class path
    for the specified resource. Then, after loading properties, a for loop is used
    to loop through menu items and then a List of String-objects is returned to the
    client. The client is the JavaScript callback function that we will see later.
    DWR automatically converts the List of String objects to JavaScript arrays, so
    we don’t have to worry about that.


