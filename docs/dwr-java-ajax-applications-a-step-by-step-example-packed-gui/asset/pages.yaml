    # Testing Collaborative Book Authoring


    Now our Book Authoring sample application is ready for testing. The test scenario
    we use here is a use case where two authors log into the system and work on the
    same book. The following screenshots show how Collaborative Book Authoring works
    in practice.


    Two users, Smith and Brown, are authoring the same book. The login screen is where
    the user enters his or her name and enters the main page of the sample application.


    Smith logs in first and sees the following page:


