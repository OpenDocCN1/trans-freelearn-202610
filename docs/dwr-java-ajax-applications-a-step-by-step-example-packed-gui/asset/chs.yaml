  \ Map 变量：`booksInProgress`、`publishedBooks` 和 `editedChapters`。这些变量保存着图书创作系统的当前状态，包括哪些书正在进行中，哪些已经发布。请注意，这些图书数据不是持久化的。\n\
  \n`getBooksInProgressTitles()` 和 `getPublishedBookTitles()` 方法使用 `getTitles()` 方法，该方法接收一个图书集合，从\
  \ `Book` 对象中提取书名，并将标题列表返回给浏览器。\n\n`getChapters()` 方法返回指定 `Book` 对象中的章节标题集合。\n\n\
  `isChapterEdited()` 方法检查指定图书中的指定章节当前是否正在被某个用户编辑。如果该章节没有被编辑，则返回 `null`。\n\n`cancelChapterEdit()`\
  \ 方法从正在编辑的章节列表中移除一个章节。\n\n`getAuthors()` 方法返回指定图书的作者列表。\n\n`getBook()` 方法从 `booksInProgress`\
  \ 列表或 `publishedBooks` 列表中返回一个 `Book` 对象。\n\n`addNewBook()` 和 `insertChapter()`\
  \ 方法用于开始一本新书或向现有图书插入新章节，同时更新必要的变量，并使用反向 AJAX 将所有更改通知到所有浏览器。\n\n`getChapterContent()`\
  \ 方法返回章节内容，如果当前没有人在编辑该章节，则将其标记为正在编辑。`saveChapterContent()` 方法保存章节，并在必要时更新作者列表。\n\
  \n`amIAuthor()` 方法检查当前用户是否为图书作者之一。\n\n`haveIVoted()`、`getNumberOfAuthors()` 和 `voteForPublish()`\
  \ 方法用于检查用户是否已经投票以及为发布进行投票，在这种情况下，会通过反向 AJAX 更新用户界面，使其反映新的投票状态。\n\n`getRenderedBook()`\
  \ 方法返回渲染后的图书内容。图书的渲染发生在 `Book` 对象的 `toString()` 方法中。\n\n`getScriptProxyForSessions()`\
  \ 方法用于反向 AJAX，它返回应用于应用程序主页中所有用户的 DWR 对象 `ScriptProxy`。`ScriptProxy` 对象用于调用主页中的一个命名\
  \ JavaScript 函数。\n\n`refreshBookList()`、`refreshChapterIfVisible()` 和 `informBookPublished()`\
  \ 方法调用主页中的 JavaScript 函数，并向已登录到应用程序的用户通知相关更改。\n\n### 测试协作式图书创作\n\n现在，我们的图书创作示例应用已准备好进行测试。我们这里使用的测试场景是一个用例，其中两位作者登录系统并共同编写同一本书。以下截图展示了协作式图书创作的实际工作方式。\n\
  \n两位用户 Smith 和 Brown 正在共同编写同一本书。登录界面是用户输入姓名并进入示例应用主页的地方。\n\nSmith 首先登录，看到如下页面：\n\
  \n![](img/5b721cfaa97eb697efc92e3914f62fca_206_0.png)\n\n“在线作者”表格最初只显示 Smith。当 Brown\
  \ 登录后，Smith 的屏幕会更新，在“在线作者”表格中出现新的用户名，如下截图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_206_1.png)\n\
  \n现在 Brown 已经登录，他通过单击**开始新书**链接创建了一本新书，随后弹出一个对话框，要求输入书名。\n\n在 **Brown** 输入书名后，两个浏览器中的“进行中的书籍”列表都会更新。在下面的截图中，Smith\
  \ 现在可以看到这本正在进行中的新书：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_207_0.png)\n\nSmith\
  \ 单击**我们的第一本书**链接，会打开一个显示章节列表的屏幕，他可以看到 Brown 目前是这本书的唯一作者。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_207_1.png)\n\
  \nSmith 决定开始一个新章节。他单击**添加新章节**链接并输入章节名称。\n\n\n\n\n\n现在两个用户都能看到书中只有一个章节，并且由于 Smith\
  \ 添加了一个章节，他被列为作者。两个用户现在都有投票按钮。下面的截图说明了当前情况：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_208_0.png)\n\
  \nBrown 决定编辑 **Chapter One**，他点击链接打开章节并编辑章节，如下面的截图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_208_1.png)\n\
  \nBrown 编辑时，Smith 也想编辑同一章节。他也点击了章节链接，但他无法编辑，因为他看到 Brown 同时正在编辑该章节。章节内容仍然为空，因为 Brown\
  \ 还没有保存章节。\n\nSmith 取消了编辑，同时 Brown 保存了章节。稍后，Smith 决定编辑同一章节。现在他可以编辑章节并看到 Brown 写的內容，并添加了一些新內容。\n\
  \n这样，两个用户可以共同撰写同一本书，准备好后作者可以投票发布。\n\n添加了两个章节，Brown 已经投票发布。Smith 点击 Vote for publish\
  \ 按钮，并被告知他无法收回投票。因为 Brown 已经投票，而这本书只有两位作者，所以该书将被发布并移至左侧导航的 Published books 表格中。\n\
  \n所有已登录用户都会收到一本书已发布的通知，如下面的截图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_210_0.png)\n\
  \n当用户在对话框中点击 OK 时，用户界面会更新以反映已发布的书籍。查看已发布的书籍时，它会被渲染为 HTML 以便更好地查看，类似于下面的截图：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_210_1.png)\n\
