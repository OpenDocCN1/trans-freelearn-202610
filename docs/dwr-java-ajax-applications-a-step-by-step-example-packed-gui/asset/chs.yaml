  ### 地图滚动


  在这个示例中，按下鼠标按钮，然后将光标向右移动。当光标越过黑色边框时，我们通过已编写的 JavaScript 代码感知到这一动作，它便会触发地图滚动并更新图像。在截图中将鼠标向右移动并越过边框后，地图向右滚动，如下图所示：


