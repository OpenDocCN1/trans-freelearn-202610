  \n## 后记\n\n本示例演示了导航树，以及 DWR 如何用于动态提供菜单元素。\n\n## 使用 DWR 实现地图滚动\n\n本章的最后一个示例是使用 DWR\
  \ 实现的地图滚动示例。自谷歌地图发布以来，基于浏览器的、由鼠标控制的滚动地图已变得非常流行。\n\n实现本示例的主要思想是：取一张足够大的地图，把它分割成大小相等的小方块。然后，根据位置，将一定数量的小方块插入到可见的地图窗口中；当用户按下鼠标左键并在地图窗口中拖动鼠标来滚动地图时，从服务器检索新的地图方块（其他实现也可能下载可见地图窗口周围的地图方块）。\n\
  \n在本示例中，我们使用了由美国地质调查局天体地质学研究计划（http://astrogeology.usgs.gov/）提供的火星坦佩-马雷奥蒂斯区域地质图。关于地图的直接链接和其他信息，请参阅\
  \ http://astrogeology.usgs.gov/Projects/MapBook/fulllisting.jsp?mapNumber=1170。\n\
  \n下面的截图展示了本示例所使用的坦佩-马雷奥蒂斯区域的完整地图。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_124_0.png)\n\
  \n我们使用两个缩放级别。缩放级别 0 的原始图像尺寸为 1000x825 像素，缩放级别 1 的图像尺寸为 2000x1632。两幅原始图像都被分割成每个 100x100\
  \ 像素的小方块，但地图底部除外，因为其高度不能被 100 整除。\n\n以下是地图方块的几个随机示例：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_125_0.png)\n\
  \n由于原始图片相当大，缩放级别 0 共有 90 个地图方块，缩放级别 1 共有 340 个方块。\n\n示例代码演示了如何使用 DWR 和 JavaScript\
  \ 实现滚动地图应用程序。我们开发的应用程序如下图所示。图像方块带有边框，以便可视化地图的构建方式。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_125_1.png)\n\
  \n## 开发用户界面\n\n我们从 HTML 文件开始开发。地图滚动器的 HTML 代码如下：\n\n```\n<h3>Map Scrolling</h3>\n\
