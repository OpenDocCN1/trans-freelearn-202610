  \ from country_data where short_name like ?\");\n        pstmt.setString(1, startLetter\
  \ + \"%\");\n        ResultSet rs = pstmt.executeQuery();\n        while (rs.next())\
  \ {\n            List<String> countryData = new Vector<String>();\n            for\
  \ (int i = 1; i <= 5; i++) {\n                if (i == 5) {\n                  \
  \  String notes = rs.getString(i);\n                    if (notes.length() == 0)\
  \ {\n                        notes = \"&nbsp;\";\n                    }\n      \
  \              countryData.add(notes);\n                } else {\n             \
  \       countryData.add(rs.getString(i));\n                }\n            }\n  \
  \          allCountryData.add(countryData);\n        }\n        rs.close();\n  \
  \      pstmt.close();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n    finally {\n        closeConnection(con);\n    }\n    return allCountryData;\n\
  }\n```\n\n\n\n\n\n```java\npublic String[] getCountryData(String ccode) {\n    List<String>\
  \ countryData = new Vector<String>();\n    Connection con = getConnection();\n \
  \   try {\n        PreparedStatement pstmt = con\n            .prepareStatement(\"\
  select short_name,long_name,code,capital,notes from country_data where code=?\"\
  );\n        pstmt.setString(1, ccode);\n        ResultSet rs = pstmt.executeQuery();\n\
  \        if (rs.next()) {\n            for (int i = 1; i <= 5; i++) {\n        \
  \        if (i == 5) {\n                    String notes = rs.getString(i);\n  \
  \                  if (notes.length() == 0) {\n                        notes = \"\
  &nbsp;\";\n                    }\n                    countryData.add(notes);\n\
  \                } else {\n                    countryData.add(rs.getString(i));\n\
  \                }\n            }\n        }\n    } catch (SQLException e) {\n \
  \       e.printStackTrace();\n    }\n    closeConnection(con);\n    String[] cdata\
  \ = new String[5];\n    return countryData.toArray(cdata);\n}\n\npublic String[]\
  \ saveCountryNotes(String ccode, String notes) {\n    Connection con = getConnection();\n\
  \    try {\n        PreparedStatement pstmt = con\n            .prepareStatement(\"\
  update country_data set notes=? where code=?\");\n        pstmt.setString(1, notes);\n\
  \        pstmt.setString(2, ccode);\n        pstmt.executeUpdate();\n    } catch\
  \ (SQLException e) {\n        e.printStackTrace();\n    }\n    closeConnection(con);\n\
  \    String[] rv = new String[2];\n    rv[0] = ccode;\n    rv[1] = notes;\n    return\
  \ rv;\n}\n}\n```\n\n该类具有与使用 CSV 文件作为数据源的类相同的 方法。请注意，最好为类似的类定义一个接口，然后使用例如工厂类在运行时选择正确的实现。\n\
  \n`getConnection()` 方法使用指定的数据源名称从 Geronimo 运行时获取连接，而 `closeConnection()` 方法关闭连接（或将其返回到\
  \ Geronimo 池）。\n\n该类中检索或更新数据库中国家的其他方法都是使用简单直接的 JDBC 调用和 SQL 脚本的。\n\n为了在我们的应用程序中使用此类，我们需要将其配置为访问\
  \ Geronimo 数据库池。为此，我们在 web.xml 和 geronimo-web.xml 中添加数据源条目。在 geronimo-web.xml 文件中，我们将之前创建的数据库池映射到我们在\
  \ web.xml 文件中指定的数据源。\n\n以下条目在 geronimo-web.xml 文件中将我们的数据库池配置为应用程序的依赖项：\n\n```xml\n\
  <sys:dependencies>\n  ...\n  <sys:dependency>\n    <sys:groupId>console.dbpool</sys:groupId>\n\
  \    <sys:artifactId>EasyAjaxDBPool</sys:artifactId>\n    <sys:version>1.0</sys:version>\n\
  \    <sys:type>rar</sys:type>\n  </sys:dependency>\n  ...\n</sys:dependencies>\n\
  ```\n\n此外，在 geronimo-web.xml 中，有一个将数据源名称映射到数据库池的条目。以下条目位于 XML 文件中 context-root 元素之后。\n\
  \n```xml\n<resource-ref>\n  <ref-name>jdbc/CountryDataSource</ref-name>\n  <resource-link>EasyAjaxDBPool</resource-link>\n\
  </resource-ref>\n```\n\n下一个配置是 web.xml 文件中的配置，我们在其中设置资源引用，以便我们的类可以使用它。以下条目位于 web.xml\
  \ 文件的末尾。\n\n```xml\n<resource-ref>\n  <res-ref-name>jdbc/CountryDataSource</res-ref-name>\n\
  \  <res-type>javax.sql.DataSource</res-type>\n  <res-auth>Container</res-auth>\n\
  \  <res-sharing-scope>Shareable</res-sharing-scope>\n</resource-ref>\n```\n\n最后，我们在这里做的最后一个配置是更改\
  \ dwr.xml 文件中的远程类为新的 CountryDerbyDB 类。在 DWR 配置中，我们更改 CountryDB 的 class 参数。\n\n```xml\n\
  <create creator=\"new\" javascript=\"CountryDB\">\n  <param name=\"class\" value=\"\
  samples.CountryDerbyDB\" />\n  <include method=\"getCountries\" />\n  <include method=\"\
  saveCountryNotes\" />\n  <include method=\"getCountryData\" />\n</create>\n```\n\
  \n## 测试数据库集成\n\n我们通过更改某个国家的注释然后检查这些注释是否已保存到数据库来验证它是否有效。在此示例中，我们更改了巴哈马的注释，然后使用 Geronimo\
