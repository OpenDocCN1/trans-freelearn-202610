  \                       return false;\">'+element+'</a></li>';\n            }\n\
  \        }\n    });\n}\n\nhtml+=\"</ul>\";\ntreeMenu.innerHTML=html;\n\n}\n\nfunction\
  \ expandElement(element)\n{\n    var value=element.text.replace(' + ','');\n   \
  \ var html=\"\";\n    NavigationTree.getChildren(value,{\n        async:false,\n\
  \        callback:function(childElements)\n        {\n            for (index in\
  \ childElements)\n            {\n                var element=childElements[index];\n\
  \                NavigationTree.hasChildren(element,{\n                    async:false,\n\
  \                    callback:function(hasChildren)\n                    {\n   \
  \                     if(hasChildren)\n```\n\n\n\n\n```\n{\n    html+='<li><a href=\"\
  #\" onclick=\"expandElement(this);return false;\">'+element+'</a></li>';\n}\nelse\n\
  {\n    html+='<li style=\"background-color:#dddddd\"><a href=\"#\" onclick=\"showContent(this);return\
  \ false;\">'+element+'</a></li>';\n}\n});\n});\nvar parentNode=element.parentNode;\n\
  var childNodes=parentNode.childNodes;\nif(childNodes.length>1)\n{\n    for(var i=1;i<childNodes.length;i++)\n\
  \    {\n        parentNode.removeChild(childNodes[i]);\n    }\n    var treeMenuContent=dwr.util.byId('treeMenuContent');\n\
  \    treeMenuContent.innerHTML=\"\";\n}\nelse\n{\n    var ul = document.createElement(\"\
  ul\");\n    ul.innerHTML=html;\n    ul.style.backgroundColor=\"#eeeeee\";\n    parentNode.appendChild(ul);\n\
  }\n\nfunction showContent(element)\n{\n    var value=element.text.replace(' ','');\n\
  \    NavigationTree.getContent(value,{\n        callback:function(content)\n   \
  \     {\n            var treeMenuContent=dwr.util.byId('treeMenuContent');\n   \
  \         treeMenuContent.innerHTML=content;\n        }\n    });\n}\n```\n\n第一个函数是\
  \ getRootElements() Java 调用的回调函数。该函数的功能是获取根元素，并针对每个元素检查是否存在子元素，然后据此编写菜单元素的 HTML\
  \ 代码。请注意，菜单是 li 元素，我们的 wireframemenu 样式规定了如何在菜单中处理这些 li 元素。我们看到的不是项目符号列表，而是一个菜单。请注意\
  \ NavigationTree.hasChildren() 远程调用中的一个参数：async:false。这很有趣，因为它强制对服务器的调用变为同步调用，就像任何给定编程语言中的普通方法调用一样。在\
  \ A(同步)JAX 中使用同步调用时必须格外小心——它可能会显著降低应用程序的速度。\n\n下一个函数是 expandElement()。它也会检查子元素，并写入指向菜单或内容的新链接。\n\
