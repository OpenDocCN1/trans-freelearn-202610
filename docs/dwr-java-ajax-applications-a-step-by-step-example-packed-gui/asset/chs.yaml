  \n## 后记\n\n本示例应用程序展示了如何在聊天室应用程序中使用 DWR。其功能与之前的图书作者应用程序类似。\n\n## 摘要\n\n本章中介绍的两个示例应用程序，协作式图书创作和聊天室，很明显\
  \ DWR 使开发此类协作应用程序变得非常容易。\n\nDWR 本身甚至在应用程序中没有发挥很大的作用。DWR 只是应用程序的一个透明功能。因此，开发人员专注于实际项目和诸如数据持久性和整洁用户界面之类的方面，而不是\
  \ AJAX 的低级细节。\n"
