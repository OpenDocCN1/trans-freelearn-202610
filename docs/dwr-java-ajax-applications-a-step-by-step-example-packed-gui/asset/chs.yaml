  \ Thorat |\n\n## 关于作者\n\n**Sami Salkosuo** 是 IBM Software Group 芬兰的软件 IT 架构师。他在\
  \ Java、Web 和集成技术方面拥有超过十年的经验。\n\nSami 为 IBM developerWorks 撰写了多篇文章，也是 IBM Redbook\
