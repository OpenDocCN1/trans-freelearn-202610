  \    }\n}\n}\n\n本类使用了 DWR 反向 AJAX 功能。这里关于反向 AJAX 的有趣之处在于，它是从非 Web 线程中使用的。在这种情况下，提交订单时，会启动一个新线程，该线程通过\
  \ JMS 向 OrderSystem 发送消息并等待响应。当响应到达或发生超时时，会使用 DWR 方法向网页发送消息。\n\nOrderSystem 类的构造函数使用\
  \ DWR 功能来获取调用网页的 Web 上下文。该代码由 DWR 提供，并且正如源代码中的注释所示，它有点“hacky”。在构造函数的末尾，我们获取调用页面的脚本会话\
  \ ID，以便将响应发送回正确的网页，并且 orderProcessed() 函数可以处理 index.jsp 文件中的响应。最后，构造函数启动工作线程并将控制权返回给调用方法。\n\
  \nrun() 方法首先初始化 JNDI 初始上下文，然后启动到本地 ActiveMQ 的 JMS 连接。使用标准 JMS 方法发送订单消息，然后在 DWROrderConfirmationQueue\
  \ 中等待响应到达。\n\n## 为消息传递设置应用程序\n\n在本节中，我们通过开发 JavaScript 函数和用于提交订单的 Java 类来设置示例应用程序以进行消息传递。我们还在本节中设置了反向\
  \ AJAX。\n\n## 后端集成\n\n在网页中接收订单确认的 JavaScript 函数如下，我们将其与大多数其他 JavaScript 函数一起添加到\
  \ index.jsp 中。\n\n```javascript\nfunction orderProcessed(orderConfirmationMessage)\n\
  {\n    var feedback=dwr.util.byId('formFeedback');\n    var html=\"\";\n    html=orderConfirmationMessage;\n\
  \    feedback.innerHTML=html;\n}\n```\n\n为了将订单系统与提交过程集成，我们修改了 FormHandler 类中 `submitOrder()`\
  \ 方法的代码。该方法的代码如下：\n\n```java\npublic boolean submitOrder(String name, String address,\n\
  \        String creditCardNumber, String expiryDate) {\n    CreditCardValidatorSoapProxy\
  \ ccValidatorProxy = new\n    CreditCardValidatorSoapProxy();\n    int rv = -1;\n\
  \    try {\n        rv = ccValidatorProxy.validCard(creditCardNumber,\n        \
  \        expiryDate.replace(\"/\", \"\"));\n        if (rv != 0) {\n           \
  \ System.out.println(\"Credit card check failed: \" + rv);\n        }\n    } catch\
  \ (RemoteException e) {\n        e.printStackTrace();\n    }\n    if(rv==0)\n  \
  \  {\n        //credit card valid, submit to order system\n        new OrderSystem(name,address,creditCardNumber,expiryDate);\n\
  \    }\n    return rv == 0;\n}\n```\n\n这里的新增内容是在对 `CreditCardValidator` 的 Web 服务调用之后（如前面代码中的粗体所示）。如果信用卡有效，则实例化\
  \ `OrderSystem` 类。由于它的构造函数会启动一个新线程进行处理，因此不需要任何变量。当线程完成时，将不再有对 `OrderSystem` 类的引用，Java\
  \ 的垃圾收集器将清理剩余对象。\n\n5. 我们按照以下截图所示的方式将订单确认返回给 Web 应用程序：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_174_0.png)\n\
  \n## 后记\n\n在 DWR 应用程序中使用消息传递很容易，就像使用数据库或 Web 服务一样。在这种情况下，消息传递为平台在使用反向 AJAX 时直接与用户通信提供了很好的渠道。\n\
  \n## 总结\n\n在本章中，我们有三个后端集成示例：数据库、Web 服务和消息传递。几乎所有这些示例都会出现在应用程序中，并且如示例所示，DWR 与后端集成无关。可以使用最熟悉的技术来访问数据库和其他后端服务，并让\
  \ DWR 仅处理前端用户界面。\n\n我们还看到了 Comet 技术如何用于 DWR 消息传递示例，其中 Comet 是一种自然的选择，通过在浏览器和服务器之间提供事件式消息传递。\n"
- "## 示例应用程序\n\n本章包含两个示例应用程序，它们使用了前面章节示例中介绍的某些功能。第一个示例应用程序是协作书籍创作，它允许多个用户共同创作同一本书。第二个示例应用程序是一个简单的聊天室应用程序。\n\
  \n这些示例侧重于 DWR 功能，这意味着真实生产级应用程序的许多功能在示例应用程序中缺失。然而，这些示例展示了 DWR 的使用方式，并且以示例作为开发起点和创意来源，应该很容易将应用程序增强到生产级。\n\
  \n本章中的两个示例应用程序如下：\n\n- 协作书籍创作 – 展示 DWR 如何用于创建基于 Web 的多用户创作环境\n- 聊天室 – 一个使用 DWR 的典型多用户聊天室应用程序\n\
  \n### 协作书籍创作\n\n协作书籍创作示例应用程序允许多个用户同时处理相同或不同的书籍。其理念是，作者登录系统后，可以看到所有正在进行中或已出版的书籍。任何人都可以开始一本新书，任何人都可以为书籍做出贡献（所以这是一个相当开放的过程）。同样，在书籍内部，任何人都可以开始新章节，并且任何人都可以编辑章节内容。该系统的构建方式使得只有一个作者可以编辑章节。如果有人正在编辑章节内容，而另一个用户试图编辑它，他/她将看到章节内容的最新保存版本。\n\
  \n当书籍完成时，作者将投票决定是否出版。每位作者只能投票一次，投票不能撤回。当所有作者都投票支持出版时，书籍将移至已出版状态，并排版为适合阅读的格式。\n\n\
  ## 启动项目\n\n我们通过使用名称 **DWRBookAuthoring** 在 Eclipse 中创建一个新的 Web 项目来启动该项目。在这种情况下，开发从\
  \ HTML 页面开始。我们需要一个登录页面、登录失败页面和将包含所有 JavaScript 函数的主页面。我们还将像前面章节一样使用 Dynamic Drive\
  \ 的 CSS。\n\n以下截图显示了我们要开发的用户界面类型：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_177_0.png)\n\
  \n## 开发用户界面\n\n我们从用户界面开始应用程序开发。首先，我们获取样式表。样式表的源代码如下。和前面章节中的样式表一样，这个 CSS 也来自 Dynamic\
  \ Drive CSS 库，http://www.dynamicdrive.com/style/。\n\n```\nbody{\nmargin:0;\npadding:0;\n\
  line-height: 1.5em;\n}\n```\n\n```\nb{font-size: 110%;}\nem{color: red;}\n\n#topsection{\n\
  background: #EAEAEA;\nheight: 90px; /*Height of top section*/\n}\n\n#topsection\
  \ h1{\nmargin: 0;\npadding-top: 15px;\n}\n\n#contentwrapper{\nfloat: left;\nwidth:\
  \ 100%;\n}\n\n#contentcolumn{\nmargin-left: 200px; /*Set left margin to LeftColumnWidth*/\n\
  }\n\n#leftcolumn{\nfloat: left;\nwidth: 200px; /*Width of left column*/\nmargin-left:\
  \ -100%;\nbackground: #C8FC98;\n}\n\n#footer{\nclear: left;\nwidth: 100%;\nbackground:\
  \ black;\ncolor: #FFF;\ntext-align: center;\npadding: 4px 0;\n}\n\n#footer a{\n\
  color: #FFFF80;\n}\n\n.innertube{\nmargin: 10px; /*Margins for inner DIV inside\
  \ each column (to provide padding)*/\nmargin-top: 0;\n}\n```\n\n\n\n\n## index.jsp\n\
  \n我们的第一个页面是登录页面。它位于 WebContent 目录下，名为 index.jsp。下面给出该页面的源代码（顺便提一下，登录页面不使用样式表）。\n\
