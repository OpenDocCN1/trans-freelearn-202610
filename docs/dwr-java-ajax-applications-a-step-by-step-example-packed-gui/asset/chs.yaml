  \n聊天室代码出人意料地简单。聊天内容存储在一个 `Vector` 的 `Strings` 中。`getChatContent()` 方法只是将聊天内容 `Vector`\
  \ 返回给浏览器。\n\n当用户发送新的聊天消息时，会调用 `postMessage()` 方法。该方法验证用户是否已登录，并将当前时间和用户名添加到聊天消息中，然后将消息附加到聊天内容中。\n\
  \n该方法还调用 `postNewMessage()` 方法，该方法用于向所有已登录用户显示新的聊天内容。注意 `postMessage()` 方法不返回任何值。我们让\
  \ DWR 和反向 AJAX 功能将聊天消息显示给所有用户，包括发送消息的用户。\n\n`getScriptProxyForSessions()` 和 `postNewMessage()`\
  \ 方法使用反向 AJAX 用新消息更新所有已登录用户的聊天区域。\n\n就这样！聊天室示例非常直接，基本功能已经就位，应用程序已准备好进行进一步开发。\n\n\
