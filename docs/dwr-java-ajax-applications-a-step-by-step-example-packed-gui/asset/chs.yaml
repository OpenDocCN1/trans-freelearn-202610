  {\n    var tempYIndex=50;\n    if(zoomLevel==1)\n    {\n        tempYIndex=260;\n\
  \    }\n    if(mapPositionIndex<tempYIndex)\n    {\n        mapPositionIndex+=tilesInRow;\n\
