  \n6. 新的数据库池通过一个向导创建，该向导位于**使用 Geronimo 数据库池向导**链接后面。\n\n7. 我们使用 **EasyAjaxDBPool**\
  \ 作为数据库池名称，数据库类型为 **Derby 网络**。\n\n```\nprivate void closeConnection(Connection\
