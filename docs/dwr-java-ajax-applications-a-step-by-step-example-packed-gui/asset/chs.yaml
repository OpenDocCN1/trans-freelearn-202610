  \    newGridX=Math.floor(x/100.0);\n    newGridY=Math.floor(y/100.0);\n    deltaX=newGridX-refGridX;\n\
  \    deltaY=newGridY-refGridY;\n    if(deltaX==0 && deltaY==0)\n    {\n        return;\n\
  \    }\n    var update=false;\n    var tilesInRow=10;\n    if(zoomLevel==1)\n  \
  \  {\n        tilesInRow=20;\n    }\n    tempIndex=getRowIndex();\n\n    if(deltaX>0)\n\
