  \ 是佛罗里达州德尔雷海滩 Office Depot, Inc. 的首席 Java 开发人员。他擅长将自己在 Java、DWR、HTML、CSS 和 jQuery\
  \ 方面的专业知识融合起来，以增强可用性并为 officedepot.com 带来动态功能。他通过自己的博客 http://greatwebguy.com 积极为社区做出贡献。\n\
  \n**Matthew Henry** 是 LeTourneau University 的编程服务经理。Matthew 在 IT 和计算机相关领域担任程序员已有\
  \ 30 年。他合著了 *Upgrading to Lotus Notes 7*，并为特定计算机行业杂志撰写了多篇文章。\n\n**Sujit Pal** 二十年前开始编程，此后从未回头。他目前在\
  \ Healthline Networks, Inc. 工作，该公司专注于健康领域的搜索垂直行业，担任其研究与开发团队的一员。除了工作之外，他最喜欢的消遣是探索新的软件技术、技巧和语言，并在\
  \ sujitpal.blogspot.com 上撰写自己的实验。\n\n## 前言\n\nAJAX 能够在浏览器中实现类似桌面级的丰富用户界面，并能够实现交互式界面，甚至可以取代传统用户界面。浏览器与服务器之间的通信在后台进行，并且由于只有数据在浏览器和服务器之间传输，AJAX\
  \ 应用程序对用户来说似乎很快，而且实际上也响应迅速。\n\nDWR，Direct Web Remoting，是一个开源 Java 框架，采用商业友好的 Apache\
  \ Software License v2 许可，用于构建 AJAX 应用程序。DWR 的主要思想是将 AJAX 实现细节，如 XMLHttpRequest 等，从开发人员面前隐藏起来。开发人员可以专注于应用程序和业务对象的开发，而将\
  \ AJAX 细节留在幕后，那里才是它们应有的位置。\n\nDWR 允许服务器端的 Java 类在浏览器中使用（它就像 JavaScript 函数与服务器端 Java\
  \ 之间的 RPC），并且还允许 JavaScript 函数在服务器中使用（反向 AJAX）。DWR 通过基于 XML 的配置从 Java 类动态生成 JavaScript\
  \ 函数，这些函数可以通过 DWR JavaScript 库从浏览器调用。服务器端的 DWR servlet 接收请求并调用实际的 Java 实现。DWR 包含几个使\
  \ DWR 正常工作所需的 JavaScript 库，这些库对开发人员也很有帮助。\n\n当服务器用于查询和/或控制客户端浏览器行为时，就使用了反向 AJAX\
  \ 的术语。DWR 支持三种不同的方法在应用程序中进行反向 AJAX：Piggyback、Polling（由客户端进行）和 Comet（服务器推送）。\n\n\
  您可能有一个正在进行的项目，您可能希望使用 JSF 或 Spring 等框架来构建整个解决方案。在这些情况下，AJAX 和 DWR 只是整体图景的一部分，因此\
  \ DWR 需要很好地与其他框架集成，并且做得非常成功！\n\n\n\n\n## 序言\n\nDWR 项目对安全性进行了非常彻底的思考。DWR 框架考虑了许多安全问题，DWR\
  \ 网站上有大量关于安全性的讨论。\n\n本书是为有兴趣学习 DWR 和 AJAX 框架的专业 Java 开发人员而写。本书从 DWR 主要特性和功能的教程开始，然后介绍开发环境的搭建，最后以一些示例应用程序结束。\n\
  \n后续章节充满了示例应用程序的示例代码，以帮助理解。\n\n## 本书涵盖内容\n\n- *第 1 章*简要介绍 AJAX 技术和 DWR。它还讨论了 DWR\
  \ 社区，并简要描述了互联网上可以找到的关于 DWR 的信息。\n\n- *第 2 章*描述了我们在本书示例中使用的 DWR 特性——从高层次视角介绍 DWR\
  \ 如何让开发人员的工作更轻松。它讨论了反向 AJAX、DWR JavaScript 库、转换器、创建器、过滤器和签名。它还包括一个关于将 DWR 与其他项目集成的部分，以及另一个关于安全性的部分。\n\
  \n- *第 3 章*通过描述如何设置开发环境以及如何测试和调试我们的示例应用程序，为开发做好准备。它涵盖了 DWR 支持的浏览器和环境、配置、错误处理、打包和部署。\n\
  \n- *第 4 章*是第一个专门介绍示例代码的章节。本章中的示例包括典型的用户界面元素，如表格和列表，以及如何使用 DWR 来实现它们。它还有一个字段补全的示例。\n\
  \n- *第 5 章*讨论如何在更高级的用户界面元素中使用 DWR，例如表单、导航树和滚动地图。\n\n- *第 6 章*展示了如何将 DWR 应用程序集成到数据库、Web\
  \ 服务或消息系统中。\n\n- *第 7 章*包含两个示例应用程序：协同图书创作，展示了如何使用 DWR 创建基于 Web 的多用户创作环境；以及聊天室——一个使用\
  \ DWR 的典型多用户聊天室应用程序。\n\n## 阅读本书所需准备\n\n本书面向希望通过示例学习 DWR 的专业 Java 开发人员和架构师。要充分利用本书，需要具备或最好具备几项技能。\n\
  \n首先，需要具备 Java 开发技能，尤其是使用 Java 企业版（JEE）、Servlet 和 JSP 等 Java 技术进行 Web 开发的经验。了解其他\
  \ Web 技术（如 JavaScript、HTML 和 CSS）也很有用。\n\n你应该熟悉 Eclipse 工具，其他有用的技能包括了解 JEE 应用服务器，以及具备\
  \ XML 等常见技术的经验。\n\n了解 AJAX 技术的基础知识会有所帮助。不过，本书也会介绍 AJAX 的基础知识。\n\n## 本书读者对象\n\n本书是为有能力的\
