- '# DWR：面向 Java 开发者的 AJAX


  Direct Web Remoting（http://www.directwebremoting.org）是一个开源 Java 框架，采用对商业友好的 Apache
  软件许可证 v2（http://www.apache.org/licenses/LICENSE-2.0.html）授权，用于构建 AJAX 应用。DWR 的主要思想是将
  XMLHttpRequest 等 AJAX 实现细节对开发者隐藏。开发者可以专注于应用程序和业务对象的开发，将 AJAX 细节留在它们应当所处的幕后。





  ## Introduction


  DWR 允许在浏览器中使用服务器端的 Java 类（它就像 JavaScript 函数与服务器端 Java 之间的 RPC）并且还允许在服务器中使用 JavaScript
  函数（Reverse AJAX）。通过基于 XML 的配置，DWR 动态生成 Java 类的 JavaScript 函数，可通过 DWR JavaScript
  库从浏览器调用。服务器端的 DWR servlet 接收请求并调用实际的 Java 实现。


  下图显示了 DWR 在用户应用程序中的定位，并取自 DWR 网站（http://directwebremoting.org/dwr/overview/dwr）。


  ![](img/5b721cfaa97eb697efc92e3914f62fca_19_0.png)


  在上图中，JavaScript 函数 **eventHandler()** 响应某些浏览器事件，如点击按钮。事件处理程序使用 **AjaxService** 对象并调用
  **getOptions()** 方法，就好像 **AjaxService** 是一个普通的 JavaScript 对象一样。开发人员可以实现客户端和服务器端代码，并将客户端与服务器之间的通信交给
  DWR 处理。


  从 JavaScript 调用服务器端 Java 会导致很多事情发生，并且在幕后也需要很多事情发生：


  - 当请求一个启用了 DWR 的网页时，DWR 根据配置从 Java 类动态生成 JavaScript 函数。

  - 当函数 **eventHandler()** 被调用时，例如点击按钮时，开发人员调用一个动态生成的函数（上图中显示的 **AjaxService.getOptions(populateList)**），DWR
  JavaScript 库获取参数，对其进行序列化，并调用服务器上的 DWR servlet。

  - DWR servlet 接收请求，并根据配置，servlet 实例化一个 Java 对象，例如 **AjaxService**，并调用所需的方法，例如 **AjaxService.getOptions(populateList)**。

  - 当 Java 方法执行完毕后，返回值（一个 String 数组）返回给 DWR servlet，servlet 对返回值进行序列化并将响应发送到浏览器上的
  DWR JavaScript 函数。

  - DWR JavaScript 函数在浏览器上接收响应，并根据参数 **populateList**（这是 **AjaxService.getOptions()**
  函数中的回调函数名），DWR 使用来自 Java 方法的返回值作为参数调用 **populateList** 函数。**AjaxService.getOptions()**
  JavaScript 函数由 DWR 动态生成，并在幕后与 DWR servlet 通信。

  - 回调函数（由开发人员编写）对返回值执行所需的操作，例如更新浏览器页面并向下拉字段添加新选项。


  DWR 非常适合 Java 开发人员，因为这种方法很容易上手。


  ## The DWR Community


  DWR 为 DWR 用户提供了非常活跃的邮件列表：


  - Java.net (https://dwr.dev.java.net/servlets/SummarizeList?listName=users)

  - Nabble (http://www.nabble.com/DWR---Users-f13934.html)

  - Gmane (http://dir.gmane.org/gmane.comp.java.dwr.user)


  这些邮件列表包含大量信息，对任何 DWR 用户都有帮助，任何人都可以参与其中。


  还有一个用于 DWR 安全的邮件列表，在此讨论 DWR 安全问题。为了参与其中，必须单独申请加入该列表，并且必须包含公司电子邮件地址和职称或其他身份识别方式。单独申请是为了可以在不公开传播的情况下讨论
  DWR 安全问题（并非旨在保密安全问题）。申请加入安全邮件列表可通过 http://groups.google.com/group/dwr-security 进行


  ## Introduction


  DWR 开发邮件列表如下：


  - Java.net (`https://dwr.dev.java.net/servlets/SummarizeList?listName=dev`)

  - Nabble (`http://www.nabble.com/DWR---Dev-f13937.html`)


  DWR 创建者 Joe Walker 的博客（`http://directwebremoting.org/blog/joe`）包含有关 DWR 的新闻和关于 Web
  开发的思考。


  SitePen（`http://sitepen.com/services/support.php`）还提供商业支持。有多个支持包可供选择，并且还可以根据特定需求定制支持包。


  DWR 被数千名开发人员使用，并且已被 American Airlines、Walmart、Citigroup、Mastercard 等公司使用。DWR 同时用于公共网站和
  Intranet 网站。


  DWR 也是 Dojo Foundation 的一部分，Dojo Foundation 是一个独立的法律实体，为开发提供基础设施。成员包括 IBM 和 SitePen。除了
  DWR，Dojo Foundation 还赞助 Dojo Toolkit、OpenRecord 和 Cometd 项目。以下网站提供有关 Dojo Foundation
  的更多信息：


  ```

  http://dojotoolkit.org/foundation

  ```


  ## Summary


  本章简要介绍了 AJAX 和 DWR。AJAX 是一种基础技术，使用基于浏览器的 JavaScript 构建 Internet 应用程序，其用户体验优于典型的请求-响应
  Web 应用程序。


  DWR 是一个用于构建 AJAX 应用程序的 Java 框架，主要面向不希望实现使 AJAX 工作所需的底层“东西”的 Java 开发人员。


  本书的其余部分介绍 DWR 功能和可在您自己的项目中使用的示例代码。后面的章节中的示例展示了一些使用 DWR 的常见情况以及如何使用它。

  '
- "# 2 DWR Features\n\n本章描述了一些 DWR 的主要功能：Reverse AJAX、安全、DWR JavaScript 库以及 DWR 与其他项目的集成。\n\
  \nReverse AJAX 基本上是一种从服务器端 Java 类调用客户端 JavaScript 的方法。安全部分讨论了 DWR 为防止利用 DWR 功能对服务器进行非授权访问所做的工作。\n\
  \nDWR 包含一些有用的 JavaScript 库，在这里一起解释了如何将 DWR 与其他项目（如 Struts 或 JSF）一起使用。\n\n本章涵盖以下部分：\n\
  \n- Ease of Use — 从高层次来看 DWR 如何让开发人员的生活更轻松\n- Reverse AJAX — 描述 Reverse AJAX 的含义\n\
  - DWR JavaScript Libraries — 描述随 DWR 提供的 JavaScript 库：`engine.js`、`util.js` 和 `gi.js`\n\
  - Converters — 介绍 DWR 如何编组/解组对象\n- Creators, Filters, and Signatures — 介绍重要的 DWR\
  \ 配置元素\n- Integration with Other Projects — 简要描述 DWR 如何与其他项目集成\n- Security — 给出\
  \ DWR 安全性的概述\n\n除了本章描述的功能外，DWR 的错误处理和配置等功能将在第 3 章 *Getting Started* 中介绍。\n\n## Ease\
  \ of Use\n\nDWR 的主要功能是其易用性。DWR 隐藏了许多开发人员不需要的细节。这意味着我们可以利用 AJAX 功能，而无需了解例如 `XmlHttpRequest`，或如何将\
  \ Java 对象发送到浏览器等等。DWR 拥有自己的框架，用于执行 Java 对象到 JavaScript 及其反向所需的编组/解组。\n\nDWR 的设置包括将\
  \ `dwr.jar` 文件复制到应用程序 WAR 文件中的 **WEB-INF/lib** 目录，并在开始使用之前将应用程序安装到服务器。我们的 Java 类无需实现特殊接口，甚至可以完全透明地开发一个\
  \ Java 对象，使其不知道任何 DWR 特定类。DWR 为我们提供了文档完善的 API，我们可以在开发例如 Reverse AJAX 应用程序时利用它。\n\
  \n最后，我们可以利用现有的 Java 技能，因为 DWR 不强迫我们替换现有代码，而是与非 AJAX 应用程序并行存在，并允许我们逐步将应用程序的所需部分更改为\
  \ AJAX 功能。\n\n## Reverse AJAX\n\n当服务器用于查询和/或控制客户端浏览器行为时，使用 Reverse AJAX 术语。这可能会引起一些疑问，因为听起来我们的浏览器在访问世界各地的网页时现在容易受到攻击。\n\
  \n幸运的是情况并非如此，因为服务器无法打开到浏览器的连接。浏览器必须始终是连接的发起者。因此，关于安全性的问题确实有效，但问题意味着相关网站的设计和实现是为了造成伤害。\n\
  \nDWR 支持三种不同的方法在应用程序中进行 Reverse AJAX：Piggyback、Polling（由客户端）和 Comet（服务器推送）。\n\n\
  ## Piggyback\n\nPiggyback 方法的工作方式是，每当服务器有更新要发送给客户端时，它会等待客户端打开连接并请求服务器上的某些内容。当这种情况发生时，服务器会在响应中包含新的更新，并将其传递给客户端，DWR\
  \ 识别该更新并相应地采取行动，并在用户的网页上进行更新。\n\n\n\n\nPiggyback 方法是 DWR 中 Reverse AJAX 的默认方法，被称为\
  \ Passive Reverse AJAX（其他方法被称为 Active Reverse AJAX），并且无需任何配置。对于我们这些忙碌的开发者来说，它通常是一个足够好的解决方案（顺便提一句，学会何时停止、何时开发“足够好的软件”是从熟练工迈向大师的一步；参见安德鲁·亨特和大卫·托马斯所著的*《程序员修炼之道：从小工到专家》*）。\n\
  \nPiggyback 的一个缺点是，服务器端发生的任何更新可能需要很长时间才能对用户可见。根据应用的不同，这可能不是问题，但如果确实是个问题，那么可以使用另外两种方法：Polling\
  \ 和 Comet，它们都是 Active Reverse AJAX 方法。\n\n使用 Reverse AJAX 需要在服务器端的应用程序代码中使用 DWR\
  \ 类。DWR 有一个名为 ScriptProxy 的类，用于在客户端执行 JavaScript 函数。例如，下面的代码片段（可能位于远程 Java 方法中）获取给定页面\
  \ mainpage.jsp 的所有脚本会话（本质上是 HTTP 会话，但针对脚本），然后添加一个函数调用，该调用会在所有已知且打开了 mainpage.jsp\
  \ 的客户端中被调用。\n\n```\nCollection<ScriptSession> sessions = serverContext.getScriptSessionsByPage(contextPath\
  \ + \"/mainpage.jsp\");\nScriptProxy proxy = new ScriptProxy(sessions);\nproxy.addFunctionCall(\"\
  newMessage\",newMessage);\n```\n\n在 mainpage.jsp 中，我们会有以下函数 newMessage，它用于更新网页中的某个字段。\n\
  \n```\nfunction newMessage(newMessageParam)\n{\n    elementToBeUpdated=document.getElementById(\"\
  messageArea\");\n    elementToBeUpdated.innerHTML=newMessageParam;\n}\n```\n\n使用\
  \ Piggyback 方法的 Reverse AJAX 不需要任何配置，它在 DWR 中默认启用。使用 Piggyback 时，客户端在向服务器应用发出 AJAX（DWR）请求后会收到更新。DWR\
  \ 随后会将所有更新（来自 Reverse AJAX 方法）与实际响应一起发送给客户端，DWR 在客户端更新网页（如上一个例子所示）。\n\n## Polling\n\
  \nPolling 是一种“无需动脑”的实现 Reverse AJAX 的方法，尽管它实际上并不是反向的，因为 DWR 会定期轮询服务器，检查应用程序服务器端是否有需要更新网页的事件。\n\
  \n在某些情况下，这种方法可能很好，特别是在不担心轮询对网络和服务器造成额外负载，或者对客户端的更新不需要像 Comet 那样（近乎）实时的情况下。\n\n当我们为\
  \ Reverse AJAX 使用 Polling 方法时，代码与 Piggyback 部分中的示例代码相同，只需要更改配置。为了使用 Polling，我们需要将\
  \ DWR 配置为使用 Active Reverse AJAX。这可以通过在 web.xml 文件中向 DWR servlet 添加以下初始化参数来完成。\n\n\
  ```\n<init-param>\n    <param-name>activeReverseAjaxEnabled</param-name>\n    <param-value>true</param-value>\n\
  </init-param>\n```\n\n我们还需要为 Reverse AJAX 启用网页。可以通过将以下行添加到用于接收来自服务器的 Reverse AJAX\
  \ 请求的网页中来完成。\n\n```\ndwr.engine.setActiveReverseAjax(true);\n```\n\n上述配置实际上就是使用\
  \ Comet 方法所需的全部配置，这一点可以在下一节中看到。对于 Polling 方法，我们还需要在 web.xml 文件中添加一个额外的初始化参数：\n\n\
  ```\n<init-param>\n    <param-name>org.directwebremoting.extend.ServerLoadMonitor</param-name>\n\
  \    <param-value>org.directwebremoting.impl.PollingServerLoadMonitor</param-value>\n\
  </init-param>\n```\n\n还有一个可选的初始化参数用于指定轮询间隔。默认间隔为 5 秒，可以通过以下初始化参数进行更改。\n\n```\n<init-param>\n\
  \    <param-name>disconnectedTime</param-name>\n    <param-value>60000</param-value>\n\
  </init-param>\n```\n\n## Comet\n\nComet，有些人称之为长连接 HTTP，是一个非常新的术语（2006 年 3 月由 Alex\
  \ Russell 首次使用 http://alex.dojotoolkit.org/?p=545），指的是一种服务器推送方法：浏览器打开连接并保持连接打开，这样服务器可以在需要时将更新推送到浏览器，更新延迟非常低。下图展示了\
  \ Comet 与普通 AJAX 模型的对比：\n\n### Ajax Web 应用模型（异步）\n\n### Comet Web 应用模型\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_26_0.png)\n\
  \n从图中可以看出，Comet 使服务器能够响应事件发送更新，几乎是实时的，并且无需等待用户打开连接或使用 Polling。\n\n如上一节所述，Comet 只需要在初始化参数中启用\
  \ Active Reverse AJAX，并在网页中启用 Reverse AJAX。使用 Comet 的 Active Reverse AJAX 有两种模式：完整流模式（Full\
  \ Streaming Mode）（DWR 2.0.3 及更早版本中的默认模式）和提前关闭模式（Early Closing Mode）（DWR 2.0.4 及更高版本中的默认模式）。\n\
  \n完整流模式的响应时间最快，当服务器上发生事件时，它能向客户端提供近乎实时的响应。在这种模式下，DWR 每 60 秒通过关闭连接并重新打开来检查浏览器是否处于活动状态。另一方面，提前关闭模式会让\
  \ DWR 在浏览器收到输出后关闭连接，然后重新打开。对于提前关闭模式，有一个名为 maxWaitAfterWrite 的初始化参数，其值表示在收到服务器的输入后，等待关闭连接（并重新打开）的时间（以毫秒为单位）。\n\
  \n在 DWR 应用中使用 Comet 时，有几点需要注意，特别是对于拥有大量用户的应用。由于客户端保持到服务器的连接打开，服务器资源可能会被这些连接及其线程消耗。这会使\
  \ DWR 应用的基础设施需求不必要地增加。解决办法是使用 maxWaitAfterWrite 初始化参数，并将其调整到合适的值。其他解决方案是使用 Polling\
  \ 或 Passive Reverse AJAX。\n\n在 Piggyback、Polling 和 Comet 这三种方法中，DWR 都展现了其优势，因为我们不需要真正了解\
  \ Reverse AJAX 的实现细节。DWR 在后台处理这些细节，并隐藏了 Comet 和 Polling 方法的细节，我们只需以正确的方式配置 DWR，就可以使用这三种方法中的任何一种。\n\
  \n## DWR JavaScript 库\n\nDWR 包含几个 JavaScript 库，这些库既是 DWR 运行所必需的，也对开发者很有帮助：engine.js、util.js\
  \ 和 gi.js。\n\n第一个 JavaScript 库 engine.js 是 DWR 浏览器端功能的核心，所有使用 AJAX 和 DWR 的页面都需要它。第二个库\
  \ util.js 包含有用的实用函数，但 DWR 并不需要它。第三个库 gi.js 用于将 DWR 与 TIBCO General Interface（GI）集成，用于\
  \ AJAX 应用。\n\n### engine.js\n\n```\ndwr.engine.setPreHook(requestStart);\ndwr.engine.setPostHook(requestEnd);\n\
  \nfunction requestStart()\n{\n  alert('Request start');\n}\n\nfunction requestEnd()\n\
  {\n  alert('Request end');\n}\n```\n\nengine.js 的其他功能包括可以批量调用服务器，其中一个或多个远程函数被一起调用。以下代码在一次批量调用中调用三个远程方法，超时时间为\
  \ 5 秒。\n\n```\ndwr.engine.beginBatch();\nWorldMap.getEvents(callback:function(results){...});\n\
  WorldMap.getArea(coordinates, showPreview);\nWorldMap.sendEvents(events, result);\n\
  dwr.engine.endBatch({\n  timeout:5000\n});\n```\n\nDWR 还有一个称为“调用排序”（call ordering）的功能。启用后，远程调用的响应会按照发送顺序依次接收。默认情况下，调用排序未启用，如果启用，可能会降低应用的速度。如果需要调用排序，可以通过在网页中添加\
  \ dwr.engine.setOrdered(true) 来启用，并且它会影响该网页中的所有 DWR 调用。\n\n### util.js\n\nutil.js\
  \ 库包含许多可在我们的应用中使用的有用 JavaScript 函数。这个库被设计为即使没有 DWR 的其他部分也可以使用，因为它不需要完整的 DWR 功能（只有一个例外：useLoadingMessage()\
  \ 函数）。\n\n该库包含用于操作 HTML 元素的函数，包括表格、列表和图像。以下是 util.js 中的函数表，并附有每个函数的简短说明。\n\n\n\n\
  \n## DWR 功能\n\n| 函数 | 语法 | 描述 |\n|---|---|---|\n| addOptions | `dwr.util.addOptions(id,\
  \ [ \"one\", \"two\", \"three\" ])` | 允许在不刷新页面的情况下向由 ID 指定的列表和选择元素 (`ol`, `ul`,\
  \ 和 `select`) 添加元素。 |\n| addRows | `dwr.util.addRows(id, array, cellfuncs, [options])`\
  \ | 向指定的表格元素添加行。`array` 参数用于填充数据，使得每个数组元素对应一行。创建表格的伪代码如下：<br><code>for each member\
  \ in array<br>&nbsp;&nbsp;&nbsp;&nbsp;for each function in cellfuncs<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;create\
  \ cell from cellfunc(array[i])</code> |\n| byId | `dwr.util.byId()` | 此函数查找当前 HTML\
  \ 文档中具有给定 ID 的元素。这可以替代 `document.getElementById` JavaScript 函数使用。 |\n| getValue()\
  \ | `dwr.util.getValue(id)` | 从诸如 `div` 和 `input` 元素等 HTML 元素获取值。 |\n| getText()\
  \ | `dwr.util.getText(id)` | 专为选择列表设计，并返回当前选项的显示文本而不是值。 |\n| getValues() | `dwr.util.getValues({\
  \ div:null, textarea:null })` | 此函数获取指定元素的值。函数参数是一个映射，其中键是 HTML 元素 ID，值在执行此函数后保存元素值。\
  \ |\n| onReturn() | `dwr.util.onReturn(event, submitFunction)` | 当在文本元素上按下回车时捕获事件的有用函数。这适用于\
  \ `onkeypress` 或 `onkeydown` 事件绑定到 `onReturn` 函数的文本元素：<br><code>&lt;input type=\"\
  text\"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;onkeypress=\"dwr.util.onReturn(event,\
  \ submitFunction)\"/&gt;<br>&lt;input type=\"button\"<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;onclick=\"\
  submitFunction()\"/&gt;</code> |\n| removeAllOptions() | `dwr.util.removeAllOptions(id);`\
  \ | 从由 ID 指定的 `ul`、`ol` 或 `select` 元素中移除所有选项。 |\n| removeAllRows() | `dwr.util.removeAllRows(id)`\
  \ | 从由 ID 指定的表格中移除所有行。 |\n| selectRange() | `dwr.util.selectRange(id,start,end)`\
  \ | 在输入框中选择从起始位置到结束位置之间的文本范围。 |\n| setValue() | `dwr.util.setValue(id,value)` |\
  \ 设置指定 HTML 元素的值。与大多数 HTML 元素兼容，最重要的是输入元素和 div。 |\n| setValues() | `dwr.util.setValues({name:value})`\
  \ | 与 `setValue()` 类似，但函数参数是一个包含名称/值对的对象。名称是 HTML 元素的 ID，值是元素的新值。 |\n| toDescriptiveString()\
  \ | `dwr.util.toDescriptiveString(id,detailLevel,options)` | 一个有用的漂亮打印函数，以人类可读形式打印\
  \ JavaScript 对象，并可选择详细程度。 |\n| useLoadingMessage() | `dwr.util.useLoadingMessage()`\
  \ | DWR 专用的加载消息，在网页右上角显示“loading”。 |\n\n表中的描述仅供参考。以下章节中的 DWR 示例展示了如何使用这些实用函数，而 DWR\
  \ 主页更详细地解释了这些函数。当然，对于有兴趣深入了解细节的人来说，JavaScript 源代码也是可用的。\n\n值得一提的一个参数选项是 `escapeHTML:false`。默认情况下，escapeHTML\
  \ 为 true，意味着所有 HTML 元素都会被转义（尤其是 &lt;、&gt;、&amp;、双引号和单引号；这是为了防止跨站脚本攻击）。\n\n### gi.js\n\
  \n`gi.js` 库有助于将 DWR 与 TIBCO General Interface (GI) for AJAX Applications 集成，这是一个开源库，包含数十个现成的\
  \ AJAX 组件以及帮助使用 TIBCO General Interface 开发 AJAX 应用的工具。\n\nDWR 的 `gi.js` 提供了与 TIBCO\
  \ GI 集成的有用函数，例如 `dwr.gi.toCdfDocument()`，它可从 JavaScript 对象生成 CDF (**Common Data\
  \ Format**) 文档。CDF 是 TIBCO GI 的通用格式，允许在 TIBCO GI 组件之间共享数据、执行数据映射以及在客户端控件之间传输数据。\n\
  \n有关 TIBCO GI 的更多信息可在 TIBCO Developer Network 上找到，`http://www.tibco.com/devnet/gi/default.jsp`。\n\
  \n### 转换器\n\n转换器是 DWR 在客户端和服务器之间编组数据的手段。有许多基本转换器默认启用，并且也可以创建新的转换器。\n\n签名在 dwr.xml\
  \ 中指定，它们用于指示 DWR 正确操作包含在集合中的类型，例如 `java.util.List`。例如，如果我们有一个远程方法签名为 `void setAddresses(List\
  \ addresses)`，DWR 没有办法知道列表中包含的类型是 String。这就是为什么我们需要在 dwr.xml 中提供以下签名来指示 DWR 正确行为的原因。\n\
  \n```\n<signatures>\n  <![CDATA[\n  import java.util.List;\n  import myclasses.AllAddresses;\n\
  \  AllAddresses.setAddresses(List<String> allAddresses);\n  ]]>\n</signatures>\n\
  ```\n\n### 与其他项目的集成\n\n通常，DWR 并不是单独使用。也许你有一个正在进行的项目，其中已决定使用 JSF 或 Spring 等框架来构建整个解决方案。在这些情况下，AJAX\
  \ 和 DWR 只是整体图景的一部分，因此 DWR 需要很好地与其他项目集成。而它确实做到了。\n\nDWR 集成以下项目：\n\n- JSF (http://java.sun.com/javaee/javaserverfaces/)，用于构建用户界面的\
  \ Java Server Faces\n- Spring (http://www.springframework.org/)，一个完整的 Java/JEE 应用框架\n\
  - WebWork (http://www.opensymphony.com/webwork/)，一个 Web 应用开发框架\n- Hibernate (http://www.hibernate.org/)，一个对象/关系持久化和查询服务\n\
  - 集成到诸如 Apache Jetspeed 的门户中使用 JSR 168 portlets 也是可行的；例如，参见 IBM developerWorks 上的文章\
  \ (http://www.ibm.com/developerworks/java/library/j-ajaxportlet/)\n- 以及许多其他项目，其集成由\
  \ DWR 或其他项目本身提供\n\n在此解释所有集成超出了范围，但作为示例，JSF 集成相当直接。\n\nDWR 包含两个用于 JSF 集成的扩展点；一个是\
  \ JsfCreator，用于从 DWR 应用访问 JSF 的 ManagedBeans，另一个是 DWR/Faces servlet 过滤器，允许我们从 FacesContext\
  \ 访问 Java bean。\n\n过滤器需要在 web.xml 文件中配置才能使用 JsfCreator：\n\n```xml\n<filter>\n  \
  \  <filter-name>DwrFacesFilter</filter-name>\n    <filter-class>uk.ltd.getahead.dwr.servlet.FacesExtensionFilter</filter-class>\n\
  </filter>\n\n<filter-mapping>\n    <filter-name>DwrFacesFilter</filter-name>\n \
  \   <url-pattern>/dwr/*</url-pattern>\n</filter-mapping>\n```\n\n在 dwr.xml 文件中我们插入\
  \ JSF ManagedBeans 配置：\n\n```xml\n<allow>\n    ...\n    <create creator=\"jsf\"\
  \ javascript=\"ScriptName\">\n        <param name=\"managedBeanName\" value=\"beanName\"\
  />\n        <param name=\"class\" value=\"your.class\"/>\n    </create>\n    ...\n\
  </allow>\n```\n\n配置后，我们能够从 DWR 应用中使用 JSF ManagedBeans。\n\n### 安全\n\n安全始终很重要，DWR\
  \ 项目已非常周全地考虑了安全问题。DWR 框架已考虑到许多安全问题，DWR 网站上关于安全的讨论很多，足以填满几本书。\n\n在乎安全的人中包括像你我这样的开发者。软件只做我们指示它做的事情，因此我们在开发期间必须有安全意识，并尽力限制利用我们工作的可能性。\n\
  \n在使用 DWR 时，我们手动在 dwr.xml 配置中指定（除非我们创建了一些自动代码生成软件来为我们做这件事）我们想要远程到 JavaScript 的哪些\
  \ Java 类和方法。这样我们可以确保没有攻击者能够利用除我们明确远程的 Java 对象之外的任何其他对象（并且我们可以集中精力使这些对象尽可能安全）。\n\n\
  \n\n\n\n`dwr.xml` 中的配置还包括每个远程 Java 类的 create 条目。我们可以使用 singleton、new 或其他机制。我们还可以使用\
  \ `dwr.xml` 中的 include 和 exclude 元素来限制允许的方法。`web.xml` 配置文件中的安全参数也有 `allowScriptTagRemoting`\
  \ 和 `crossDomainSessionSecurity`，当启用时，可能会带来巨大的安全风险。因此，如果你要启用这些参数，请确保你了解自己在做什么。\n\
  \n有一个配置参数在开发 DWR 应用程序时非常有用，但在生产（尤其是公开）站点中却是安全风险。以下 init-param、debug 和 test 模式可以添加到\
  \ web.xml 中。\n\n```\n```xml\n<init-param>\n    <param-name>debug</param-name>\n\
  \    <param-value>true</param-value>\n</init-param>\n```\n```\n\n当启用 debug/test\
  \ 模式时，DWR 会生成测试页面（第 4 章中有示例屏幕），这些页面是了解 DWR 功能的有用工具。\n\n也可以使用 JEE 访问控制机制并限制对特定 JEE\
  \ 角色的 DWR 本身的访问。这些在 web.xml 文件中指定。在 DWR 内部，还有对远程 Java 对象方法的基于角色的访问控制。DWR 还可以与 Spring\
  \ Security（也称为 Acegi Security）集成，`http://www.acegisecurity.org/`，它是 Spring Portfolio\
  \ 的官方安全项目。Acegi 与 DWR 集成的描述可在 `http://java-x.blogspot.com/2007/08/handling-security-with-ajax-dwr-and.html`\
  \ 找到。\n\nDWR 还设计为攻击者无法访问和操作 DWR 核心文件并更改安全参数等情况。\n\n## 最小化风险\n\n安全不是一个微不足道的问题，我们可以在安全领域花费数年时间仍然会留下很多未完成的工作。作为开发者，我们的工作是确保安全风险降到最低，至少要意识到如果我们远程某个\
  \ Java 方法可能会发生什么。\n\nDWR 网站上的一个非常好的例子是，如果我们对名为 `appendStringToFile()` 的方法进行远程调用，该方法将给定的字符串附加到预定义的文件中，那么可能的攻击者可以发送大量请求并用无意义的内容填满文件系统，从而导致意外的服务器停机。停机的成本可能从轻微不便到数百万美元不等。\n\
  \n为了防止无意中提供可能造成危害的访问，我们必须思考我们想要做什么并检查输入参数。检查输入参数是我们作为开发者可以做到的最重要的事情，以确保事故不会发生。\n\
  \n在前面的例子中，如果我们远程了 `appendStringToFile()` 方法，我们可以做很多检查，例如文件系统是否正在填满，是否是一个适用于其目的的字符串（例如日志文件中的日志条目），请求者是谁等等。\n\
  \n另外请确保使用 `escapeHTML` 以防止跨站脚本（XSS）攻击。XSS 是值得了解的东西。因此请参阅维基百科（http://en.wikipedia.org/wiki/Cross-site_scripting）以获取详细描述。\n\
  \n## 总结\n\n本章介绍了 DWR 功能的概述，包括 JavaScript 库（`util.js`、`engine.js` 和 `gi.js`）、安全性和\
  \ Reverse AJAX，以及 DWR 工作方式的基本操作元素。\n\n除了本章讨论的主题外，DWR 还有许多其他可能与开发者相关或不相关的有用功能。这取决于应用程序。本章中的主题旨在提供高层次的概述，但它们将为你从\
  \ DWR 网站（http://directwebremoting.org/dwr/documentation）甚至从 DWR 源代码中了解更多信息提供良好的起点。\n\
  \n非常经常，大多数开发者在开始一个项目时不需要该技术的全部功能。在项目进行一段时间后，我们可能会发现解决方案已经成熟，包含了该技术的大部分甚至全部功能。但这通常不是初始情况，而且，我们必须从某个地方开始，逐步迈出小步是实际的做法，就像学步的幼儿学习走路一样。\n"
- "# 3 安装与配置\n入门\n\n在本章中，我们将为在后续章节中进行的编码工作设置开发环境。我们还将查看支持的环境、配置、测试和调试。\n\n作为本书示例代码的开发环境，我们有以下组件：Eclipse\
  \ 作为 IDE，Apache Geronimo 2.x.x 作为应用服务器，Java 1.5.x 作为 Java 运行时，Firefox 2.0.0.x 作为客户端，以及\
  \ Windows 作为操作系统（Linux 同样适用）。\n\n本章包括以下部分：\n\n- 支持的浏览器和环境 – 描述 DWR 支持的软件组件\n- 配置\
  \ – 介绍 DWR 配置，包括 `dwr.xml` 和 `web.xml` 文件\n- 设置开发环境 – 有设置开发组件的步骤\n- 测试和调试 – 描述如何在使用\
  \ DWR 开发应用程序时进行测试和调试\n- 错误处理 – 描述 DWR 如何处理错误处理，以及如何配置它\n- 打包和部署 – 展示如何使用 Eclipse\
  \ 和 Geronimo 打包和部署 DWR 应用程序\n\n## 支持的浏览器和环境\n\n由于 DWR 应用程序基于 Java，运行 DWR 应用程序的服务器必须是\
  \ Java 服务器。JDK 1.3 和 servlet 规范 2.2 是最低要求。几乎所有 Java 应用服务器都支持 DWR 应用程序。Apache Tomcat、Apache\
  \ Geronimo、WebSphere、Weblogic 以及许多其他服务器都受支持。在本书中，我们使用了 Apache Geronimo。\n\nDWR 支持大多数最新浏览器：\n\
  \n- Firefox 1.x 及更高版本受支持。\n- Internet Explorer 6.0 及 Windows 的更高版本受支持（IE Mac 不受支持）。IE\
  \ 5.5 也可能工作，但 IE 5.0.2 不受支持。\n- 基于 Mozilla 的浏览器从 1.7 版本开始受支持。\n- Opera 7.5.4 及更高版本受支持（包含空值的字符串存在一个小问题报告）。\n\
  - OSX 上的 Safari 浏览器从 1.2 版本开始受支持。\n- Konqueror 浏览器及其最新版本可能可以工作，但未经过 DWR 团队测试。\n\n\
  总体而言，大多数当前浏览器都受 DWR 支持，在任何当前或未来的开发项目中，浏览器支持不太可能成为问题。尤其是当项目面向 SMB（中小企业）或企业客户时，他们很可能有公司首选浏览器的政策，而该浏览器很可能就是两大主流浏览器之一。\n\
  \n## 配置\n\nDWR 使用 XML 文件、注解或 Fluent Interface 风格进行配置。使用 XML 文件是 DWR 配置最典型的方法，有两个文件：web.xml\
  \ 和 dwr.xml。第一个 web.xml 对于其他配置方法也是必需的。注解和流式配置可以用在 dwr.xml 的位置。本节描述配置方法以及如何使用它们。\n\
  \n### web.xml\n\n配置从在 Web 应用程序的 web.xml 配置文件中定义 DWR servlet 开始。这当然是强制性的，因为没有它 DWR\
  \ 就无法工作。最小配置不包含任何 init 参数，示例如下：\n\nDWR servlet 的初始化参数还包括几个用于服务器负载保护的参数。负载保护的 init\
  \ 参数在下表中列出：\n\n| 参数 | 描述 |\n|---|---|\n| activeReverseAjaxEnabled | 当设置为 true 时，启用\
  \ reverse AJAX 支持、轮询和 Comet。默认值是 false。 |\n| maxWaitingThreads | 等待请求的线程最大数量。默认值是\
  \ 100。 |\n| maxHitsPerSecond | 每秒应获得的轮询请求数量。默认值是 40。 |\n\n其他 init 参数也存在，例如 sessionCookieName\
  \ 和 overridePath。DWR 网页列出了所有参数，包括一些未记录的参数。\n\n### dwr.xml\n\nDWR 的另一个 XML 配置文件是\
  \ dwr.xml。该文件用于将远程 Java 类配置为 JavaScript 函数，是 DWR 功能的基础。\n\ndwr.xml 文件具有以下结构：\n\n\
  ```\n<!DOCTYPE dwr PUBLIC \"-//GetAhead Limited//DTD Direct Web Remoting 2.0//EN\"\
  \ \"http://getahead.org/dwr/dwr20.dtd\">\n<dwr>\n  <init>\n    <creator id=\"cr1\"\
  \ class=\"org.mysource.CreatorClass1\"/>\n    <converter id=\"co1\" class=\"org.mysource.ConverterClass1\"\
  />\n  </init>\n  <allow>\n    <create creator=\"new\" javascript=\"ServerClass\"\
  />\n    <convert converter=\"co1\" match=\"org.mysource.MyDataClass\"/>\n  </allow>\n\
  </dwr>\n```\n\n最重要的条目在 allow 元素内。没有 allow 元素，DWR 就毫无用处，因为没有任何东西被允许。init 元素内的条目很少使用，除非扩展\
  \ DWR。除了 init 和 allow 元素外，还可以有一个 signatures 元素来保存方法签名，并在我们的远程对象具有 Collection 参数（如\
  \ List）时使用。当方法具有 List 参数时，DWR 没有办法知道 List 包含什么类型。这就是为什么使用 signatures 来告诉 DWR List\
  \ 包含例如 String 对象。\n\n\n\n\n\n## 使用 Creator 及其属性\n\n在 `allow` 元素中存在 creator 和 converter。Creator\
  \ 用于创建在浏览器中使用的 JavaScript 对象。以下是 `create` 元素的结构：\n\n```\n```xml\n<create creator=\"\
  ...\" javascript=\"...\" scope=\"...\">\n    <param name=\"...\" value=\"...\"/>\n\
  \    <auth method=\"...\" role=\"...\"/>\n    <exclude method=\"...\"/>\n    <include\
  \ method=\"...\"/>\n</create>\n```\n```\n\n只有 creator 和 javascript 属性是强制性的，其余均为可选。\n\
  \ncreator 属性指定 DWR 如何创建 Java 对象。它可以是：\n\n- `new`—这使用 Java 对象的 new 操作符。这是使用最广泛的。\n\
  - `none`—它不创建任何对象。这假定对象已由其他人创建或要调用的方法是静态的。\n- `scripted`—它使用脚本语言创建对象。例如当远程的 Java\
  \ 对象是单例时很有用。这需要 BSF（Apache 的 Bean Scripting Framework http://jakarta.apache.org/bsf/）以及\
  \ BeanShell 等脚本语言包在 Web 应用的类路径中。\n- `spring`—它使用 Spring Framework 来提供对 Java 对象的访问。\n\
  - `jsf`—它使 JSF 管理的 Bean 能够被远程访问。\n- `struts`—它使 Struts FormBeans 作为远程对象。\n- `pageflow`—它提供对\
  \ Weblogic/ Beehive PageFlow 对象的访问。\n\n`javascript` 属性为 Java 对象提供一个在浏览器端使用的名称。\n\
  \n`scope` 元素用于指定 Bean 可用的位置。例如，scope 可以有值：`application`、`request`、`session`、`page`\
  \ 和 `script`。前四个与 Servlet 开发中的相同，而 `script` 允许 Bean 与页面中的 ID 绑定而不是 HTTP 会话 Cookie。默认作用域为\
  \ page。\n\n`param` 元素用于配置所选的 creator。例如，new creator 有一个名为 `class` 的参数，其值是我们想要远程的\
  \ Java 类的全限定类名。使用 new creator 时会使用默认构造函数创建 Java 对象。\n\n## 入门\n\nauth 元素用于指定用于访问控制检查的\
  \ J2EE 角色级别。\n\n`include` 和 `exclude` 两个元素用于限制对类方法的访问。其中一个元素可用于限制访问。当使用 `include`\
  \ 元素时，DWR 假定除 include 元素中指定的方法之外的所有其他方法都被限制。另一方面，`exclude` 元素则具有相反的效果，它允许访问除 exclude\
  \ 元素中指定的方法之外的所有方法。默认情况下，远程对象中的所有方法都是可访问的。例如，以下代码片段有两个远程对象，JavaObjectOne 和 JavaObjectTwo，其中第一个对象仅允许访问一个方法，而第二个对象允许访问除\
  \ exclude 元素中指定的方法之外的所有方法。\n\n```\n```xml\n<create creator=\"new\" javascript=\"\
  accessorOne\">\n    <param name=\"class\" value=\"my.JavaObjectOne\"/>\n    <include\
  \ method=\"getOptionElementsForUser\"/>\n</create>\n\n<create creator=\"new\" javascript=\"\
  accessorTwo\" scope=\"session\">\n    <param name=\"class\" value=\"my.JavaObjectTwo\"\
  />\n    <exclude method=\"setInternalVariable\"/>\n</create>\n```\n```\n\n## 使用\
  \ Converter 元素\n\nconverter 元素用于指定如何将方法参数从 JavaScript 转换为 Java。如果参数基于 Java 原始类型、字符串、`java.util.Date`\
  \ 或上述对象的数组/集合，则不需要转换器。\n\n对于自定义 JavaBean 和其他参数需要转换器。例如，对于如下 JavaBean，我们必须指定 Bean\
  \ 转换器。\n\n```\n```java\npackage my.package;\npublic class StockInfo\n{\n    public\
  \ void setClosingPrice(double price) { ... }\n    public void setVolume(long volume)\
  \ { ... }\n}\n```\n```\n\nBean 转换器由 DWR 提供，它将 JavaBean 对象转换为 JavaScript 关联数组，反之亦然。`dwr.xml`\
  \ 中的条目为：\n\n```\n```xml\n<convert converter=\"bean\" match=\"my.package.StockInfo\"\
  />\n```\n```\n\n需要手动指定转换器，因为 DWR 需要知道允许它触及我们的代码。此功能对安全性有益，因为它让我们负责给予某些操作的权限，而不是\
  \ DWR 默认执行我们不想要的操作。\n\n除了 Bean 转换器之外，还有一些其他转换器。有一个 Object 转换器，它直接作用于对象成员而不是像 Bean\
  \ 转换器那样的 getter 和 setter。然后还有用于数组、Java 集合、DOM 对象和枚举的转换器。也可以开发自定义转换器，但在需要自定义转换器的情况下很少见。\n\
  \n## 使用注解\n\n注解在 Java 5 中引入，DWR 支持通过注解进行配置，而不是（或与）XML 配置一起使用。为了使用注解，web.xml 文件中的\
  \ DWR servlet 条目必须在 classes 初始化参数中指定所有带注解的类，如以下示例所示。\n\n```\n```xml\n<init-param>\n\
  \    <param-name>classes</param-name>\n    <param-value>\n        my.class.StockInfo,\n\
  \        my.class.OtherInfo\n    </param-value>\n</init-param>\n```\n```\n\n以下是\
  \ DWR 的带注解类的示例。\n\n```\n```java\n@RemoteProxy(name=\"market\")\npublic class StockMarket\n\
  {\n    @RemoteMethod\n    public double getLatestPrice(String symbol) { ... }\n\
  }\n```\n```\n\n注解 @RemoteProxy 使类可用于远程访问，其 name 属性指定对象的 JavaScript 名称。我们需要远程访问的所有方法都必须具有\
  \ @RemoteMethod 注解。通过 @DataTransferObject 和 @RemoteProperty 注解可实现对自定义 bean 类的转换。\n\
  \n相比之下，上述 StockInfo 类将在 dwr.xml 配置中具有以下条目。\n\n```\n<create creator=\"new\" javascript=\"\
  market\">\n  <param name=\"class\" value=\"my.class.StockMarket\"/>\n  <include\
  \ method=\"getLatestPrice\"/>\n</create>\n```\n\n## 使用 DWR 的 Fluent 配置\n\nFluent\
  \ 配置风格由 Martin Fowler（http://www.martinfowler.com/bliki/FluentInterface.html）在几年前描述。单词“Fluent”来自于能够“流畅地”描述配置的能力。参考以下示例（来自\
  \ DWR 网站）：\n\n```\npublic void configure() {\n    withConverterType(\"dog\", \"\
  com.yourcompany.beans.Dog\");\n    withCreatorType(\"ejb\", \"com.yourcompany.dwr.creator.EJBCreator\"\
  );\n    withCreator(\"new\", \"ApartmentDAO\")\n        .addParam(\"scope\", \"\
  session\")\n        .addParam(\"class\", \"com.yourcompany.dao.ApartmentDAO\")\n\
  \        .exclude(\"saveApartment\")\n        .withAuth(\"method\", \"role\");\n\
  \    withCreator(\"struts\", \"DogDAO\")\n        .addParam(\"class\", \"com.yourcompany.dao.DogDAO\"\
  )\n        .include(\"getDog\")\n        .include(\"getColor\");\n    withConverter(\"\
  dog\", \"*.Dog\")\n        .addParam(\"name\", \"value\");\n    withSignature()\n\
  \        .addLine(\"import java.util.List;\")\n        .addLine(\"import com.example.Check;\"\
  )\n        .addLine(\"Check.setLotteryResults(List nos);\");\n```\n\nFluent 配置通过程序化配置启用，为了在\
  \ DWR 中使用它，web.xml 文件中的 customConfigurator 初始化参数必须指向一个继承自抽象 org.directwebremoting.fluent.FluentConfigurator\
  \ 类的类，并且其 configure 方法。\n\n## 入门\n\n- 启动 Eclipse 后，我们为 Geronimo 指定一个新的服务器运行时。转到\
  \ **New | Other**，**Select a wizard** 对话框打开。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_47_0.png)\n\
  \n- 单击 **Next** 后，**Define a New Server** 屏幕打开。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_48_0.png)\n\
  \n## 入门\n\n- 我们通过单击 **Download additional server adapters** 为 Eclipse 设置 Geronimo\
  \ 服务器。然后，**Install New Adapter** 对话框打开。我们选择 **Geronimo Core Feature** 并单击 **Next**\
  \ 继续接受许可屏幕。接受许可后，Eclipse 下载并安装插件。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_49_0.png)\n\
  \n- 我们对 **Geronimo v2.x Server Adapter** 重复上一步。\n\n\n\n\n现在，开发环境已准备就绪，可以进行编码了。我们有一个\
  \ IDE 和一个测试服务器，这差不多就是我们真正需要的一切。\n\n## Apache Geronimo\n\nApache Geronimo 的网站是 `http://geronimo.apache.org`，那里提供了独立应用服务器的下载。尽管我们刚刚安装了一个包含\
  \ Geronimo 服务器运行时的开发环境，但我们仍需要安装独立的 Geronimo。\n\nGeronimo 的安装再简单不过了！只需下载 Geronimo\
  \ 发行版的 ZIP 文件（我们使用带有 Tomcat 的那个）并将其解压到某个目录。使用 **bin** 目录中的 **startup** 脚本启动 Geronimo，使用\
  \ **shutdown** 脚本停止它。\n\n## 测试与调试\n\nDWR 应用程序是普通的 Web 应用程序，因此可以使用 Eclipse IDE 中提供的常规调试工具对其进行测试和调试。网上有关于在\
  \ Eclipse 中进行调试的信息，例如 IBM developerWorks 网站上的文章（`http://www.ibm.com/developerworks/opensource/library/os-ecbug/`）。还有一些关于\
  \ Eclipse 及其功能的书籍。\n\n另一种调试方法是日志记录。这听起来可能有些“老套”，但这里引用 Brian W. Kernighan 和 Rob Pike\
  \ 所著的 *编程实践* 中的一段话（Apache 的 Log4J 网站上也有这段引用）：\n\n> > 就个人选择而言，我们倾向于只使用调试器来获取堆栈跟踪或一两个变量的值。原因之一是，人们很容易迷失在复杂数据结构和控制流的细节中；我们发现单步执行程序的效率较低。通常，这种情况发生在服务器会话过期时，服务器会显示一个登录页面或关于会话过期的信息页面。\n\
  \n处理程序是在客户端的 JavaScript 代码中使用 engine.js 包中的一个函数设置的：\n\n```\ndwr.engine.setErrorHandler(handlerFunction);\n\
  ```\n\n异常由 exceptionHandler 或 errorHandler 处理。默认情况下，当异常发生时，DWR 不会在错误消息中包含任何关于异常的信息。例如，一个异常对象可能如下所示：\n\
  \n```\n{\n  javaClassName:'java.lang.Throwable',\n  message:'Error'\n}\n```\n\n\
  “Error”只表明显然出了某些问题，但未说明具体可能是什么错误。通过向 dwr.xml 中添加以下行，可以启用更详细的异常信息。\n\n```\n<convert\
  \ match=\"java.lang.Exception\" converter=\"exception\"/>\n```\n\nException 转换器能够提供易于理解的错误消息：\n\
  \n```\n{\n  javaClassName:'org.xml.sax.SAXParseException',\n  lineNumber:42,\n \
  \ publicId:'somePublicId',\n  message:'Missing >'\n}\n```\n\n此外，使用 dwr.xml 中的 <convert\
  \ match=\"java.lang.StackTraceElement\" converter=\"bean\"/> 行启用堆栈跟踪，可以简化开发工作，让我们在错误发生时直接看到错误并立即进入调试模式。\n\
  \n会话过期由 textHtmlHandler 处理，其用法如下：\n\n```\ndwr.engine.setTextHtmlHandler(function()\
  \ {\n  window.alert(\"Your session has expired, please login again.\");\n  document.location\
  \ = '/mycontext/login';\n});\n```\n\n由于 Eclipse 内置的工具，打包非常容易。\n\n- 我们选择项目名称并右键单击以打开上下文菜单；在\
  \ **导出** 菜单项下，我们找到 **WAR** 选项。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_54_0.png)\n\
  \n- 点击 **WAR** 选项后，会打开一个 **WAR 导出** 对话框，我们可以在其中选择 **目标** 以及 WAR 文件的名称：d:\\temp\\\
  HelloWorldServlet.war。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_55_0.png)\n\n\
  - 为了进行部署，我们已经安装了一个独立的 Geronimo 应用服务器。使用 **startup** 脚本文件运行 Geronimo（并记得设置 `JAVA_HOME`\
  \ 环境变量）。以下截图展示了使用 **startup** 脚本启动 Geronimo 服务器时的典型输出。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_55_1.png)\n\
  \n## 使用管理控制台进行部署\n\n可以使用 Geronimo 管理控制台进行部署。\n\n- 1. 启动 Geronimo 服务器后，打开 Geronimo\
  \ Web 控制台。默认位置是 http://127.0.0.1:8080/console。默认管理员用户名为 system，密码为 manager。登录系统后，我们将看到\
  \ Geronimo 管理控制台。左侧有用于管理任务的菜单，右侧有指向常见任务、文档和其他资源的链接。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_56_0.png)\n\
  \n## 入门指南\n\n2. 安装是一项简单直接的任务。我们选择“常用控制台操作”框中的“部署应用程序”，或选择“控制台导航”左侧的“部署新应用程序”。随后会打开如下屏幕，我们可在其中指定\
  \ HelloWorldServlet.war 文件。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_57_0.png)\n\
  \n3. 点击“安装”后，Geronimo 会显示操作状态。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_57_1.png)\n\
  \n既然应用程序已经安装完成，我们就可以对其进行测试了。我们需要知道两件事：上下文路径和 Servlet 映射。我们在开发期间指定了 Servlet 映射，并从\
  \ web.xml 文件中获取；它是 HelloWorld。我们从 Geronimo 获取上下文路径。\n\n4. 单击“控制台导航”中的“Web App WAR”链接，会打开“已安装的\
  \ Web 应用程序”屏幕，在那里我们会看到应用程序列表，URL 列中显示的就是上下文路径。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_58_0.png)\n\
  \n5. 现在我们有了上下文路径和 Servlet 映射，可以在浏览器中打开我们的 Servlet：http://127.0.0.1:8080/HelloWorldServlet/HelloWorld，然后就能看到这个举世闻名的消息。\n\
  \n![](img/5b721cfaa97eb697efc92e3914f62fca_58_1.png)\n\n卸载、停止和重新启动应用程序都可以通过“已安装的\
  \ Web 应用程序”屏幕完成。\n\n管理控制台非常有用，尤其是当我们开始进行开发工作或偶尔在 Geronimo 中测试某些应用程序时。但在开发过程中，最好使用基于命令行的部署工具。\n\
  \n\n\n\n## 使用 Deployer 工具部署\n\nDeployer 工具是一个命令行工具，主要用于在 Geronimo 中安装和卸载应用程序。该工具位于\
  \ **bin** 目录下，根据操作系统不同为 `deploy.bat` 或 `deploy.sh`。\n\n工具语法为：\n\n```\ndeploy.[bat|sh]\
  \ [general options] command [command options]\n```\n\n要安装新的 WAR 文件，我们使用 deploy 命令：\n\
  \n```\ndeploy -user system -password manager deploy d:\\temp\\HelloWorldServlet.war\n\
  ```\n\n我们会得到以下关于安装成功的确认屏幕：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_59_0.png)\n\
  \n请注意，使用命令行工具安装时获得的信息比使用管理控制台安装时更多。我们可以看到模块名称以及从提示中得到的上下文根。模块名称很重要，因为它用于卸载应用程序。卸载命令为：\n\
  \n```\ndeploy -user system -password manager undeploy sample/HelloWorldServlet/1.0/car\n\
  ```\n\n另一个重要命令是 `list modules`，它显示当前在应用程序服务器中运行的所有已安装模块。deploy 命令的其他所有命令都可以在 Geronimo\
  \ 文档中找到。\n\ndeployer 工具可能是部署的最有用方式。它允许自动化部署过程，并且我们可以最大限度地减少手动错误。更不用说，让脚本进行部署比手动使用管理控制台安装要快得多、快得多。\n\
  \n## 使用热部署部署\n\n热部署是最简单的安装方法。在这里，我们只需将示例 WAR 文件复制到 Geronimo 的 **deploy** 目录，Geronimo\
  \ 就会完成其余工作。我们可以使用 deployer 工具的 `list modules` 命令来验证安装。\n\n卸载也很简单。我们从 deploy 目录删除\
  \ WAR 文件，Geronimo 就会卸载应用程序。\n\n热部署对于快速且可能不太规范的应用程序安装很有用。在现实生活中，可能最好使用 deployer 命令行工具，因为它具有脚本功能，以及由此产生的部署过程自动化。\n\
  \n## 总结\n\n现在，我们已经设置了开发环境，并查看了支持的环境、测试、调试、打包和部署。我们还介绍了 DWR 的配置。因此，一切都已准备就绪，可以开始使用\
  \ DWR。\n\n本书的其余部分将集中于实际代码，我们将看到在本章和前几章中介绍的 DWR 功能。\n"
- "## 用户界面：基本元素\n\n在本章中，我们将进入实际动手操作。我们将基于 DWR 开发示例，展示如何动态更改常见的用户界面元素，如表格和列表以及字段补全。我们还将为本书中的所有示例制作一个动态用户界面骨架。\n\
  \n动态用户界面部分展示了如何开始 DWR 应用程序，并介绍了一个用户界面骨架，该骨架将用于容纳表格和列表示例，以及字段补全（又名 autosuggest/autocomplete）示例。下一章中的示例将使用相同的用户界面骨架，除了第\
  \ 7 章中的示例应用程序。\n\n本章包含以下部分：\n\n- 创建动态用户界面——从创建 Web 项目和本章中提及的示例的基础开始\n- 实现表格和列表——向我们展示如何使用\
  \ DWR\n- 实现字段补全——提供典型的字段补全示例\n\n### 创建动态用户界面\n\n动态用户界面的想法是为所有示例提供一个通用的“框架”。我们将创建一个新的\
  \ Web 应用程序，然后在继续过程中向应用程序添加新功能。用户界面看起来类似于以下图示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_63_0.png)\n\
  \n用户界面有三个主要区域：静态的标题/标志、动态的标签页，以及显示实际内容的区域。\n\n此实现的想法是使用 DWR 功能生成标签页并获取标签页内容。标签式用户界面是使用\
  \ Dynamic Drive CSS Library 中的 CSS 模板创建的（http://dynamicdrive.com/style/csslibrary/item/css-tabs-menu）。标签是从属性文件读取的，因此可以动态地向网页添加新标签。以下屏幕截图显示了用户界面。\n\
  \n![](img/5b721cfaa97eb697efc92e3914f62fca_63_1.png)\n\n以下序列图显示了从逻辑角度看的应用程序流程。由于内置的\
  \ DWR 功能，我们不必太担心异步 AJAX“东西”是如何工作的。这当然是一件好事。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_64_0.png)\n\
  \n现在我们将使用 Eclipse IDE 和上一章中设置的 Geronimo 测试环境来开发应用程序。\n\n#### 创建新的 Web 项目\n\n1. 首先，我们将创建一个新的\
  \ Web 项目。使用 Eclipse IDE，我们执行以下操作：选择菜单 File | New | Dynamic Web Project。\n2. 这将打开\
  \ New Dynamic Web Project 对话框；输入项目名称 DWREasyAjax 并单击 Next，并在所有页面上接受默认值，直到最后一页，在那里创建\
  \ Geronimo Deployment Plan，如以下屏幕截图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_64_1.png)\n\
  \n#### 配置 Web 应用程序\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_66_0.png)\n\n上下文根值得注意（在上面的屏幕截图中可见）。我们在测试应用程序时需要它。\n\
  \n另一个 XML 文件 web.xml 非常重要，我们都知道。这个 XML 将保存 DWR servlet 定义和其他可能的初始化参数。以下代码显示了我们将使用的\
  \ web.xml 文件的完整内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<web-app\
  \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n    xmlns=\"http://java.sun.com/xml/ns/javaee\"\
  \n    xmlns:web=\"http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\n    xsi:schemaLocation=\"\
  http://java.sun.com/xml/ns/javaee http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\
  \n    id=\"WebApp_ID\" version=\"2.5\">\n    <display-name>DWREasyAjax</display-name>\n\
  \    <servlet>\n        <display-name>DWR Servlet</display-name>\n        <servlet-name>dwr-invoker</servlet-name>\n\
  \        <servlet-class>\n            org.directwebremoting.servlet.DwrServlet\n\
  \        </servlet-class>\n        <init-param>\n            <param-name>debug</param-name>\n\
  \            <param-value>true</param-value>\n        </init-param>\n    </servlet>\n\
  \    <servlet-mapping>\n        <servlet-name>dwr-invoker</servlet-name>\n     \
  \   <url-pattern>/dwr/*</url-pattern>\n    </servlet-mapping>\n    <welcome-file-list>\n\
  \        <welcome-file>index.html</welcome-file>\n        <welcome-file>index.htm</welcome-file>\n\
  \        <welcome-file>index.jsp</welcome-file>\n        <welcome-file>default.html</welcome-file>\n\
  \        <welcome-file>default.htm</welcome-file>\n        <welcome-file>default.jsp</welcome-file>\n\
  \    </welcome-file-list>\n</web-app>\n```\n\n我们已经在第 3 章的配置部分看到了 servlet 定义。我们在这里使用相同的\
  \ `debug` 参数。Servlet 映射是常用的 `/dwr/*`。\n\n我们记得 DWR 不能在没有 `dwr.xml` 配置文件的情况下运行。因此我们需要创建配置文件。我们使用\
  \ Eclipse 在 **WEB-INF** 目录中创建一个新的 XML 文件。以下内容是用户界面骨架所需的。它已经包含了我们基于 DWR 的菜单的 `allow`\
  \ 元素。\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE dwr PUBLIC\n\
  \    \"-//GetAhead Limited//DTD Direct Web Remoting 2.0//EN\"\n    \"http://getahead.org/dwr/dwr20.dtd\"\
  >\n<dwr>\n    <allow>\n        <create creator=\"new\" javascript=\"HorizontalMenu\"\
  >\n            <param name=\"class\" value=\"samples.HorizontalMenu\" />\n     \
  \   </create>\n    </allow>\n</dwr>\n```\n\n在 `allow` 元素中，有一个用于我们在这里要实现的水平菜单 Java\
  \ 类的 creator。我们在这里使用的 creator 是 new creator，这意味着 DWR 将使用空构造函数为客户端创建 Java 对象。名为 `class`\
  \ 的参数保存完全限定的类名。\n\n\n\n\n\n## 开发 Web 应用程序\n\n既然我们已经定义了将用于创建菜单的 Java 类的名称，下一步就是实现它。`HorizontalMenu`\
  \ 类的思路是它用于读取一个属性文件，该文件保存将出现在网页上的菜单。\n\n我们向名为 `dwrappplication.properties` 的文件添加属性，并将其创建在与\
  \ `HorizontalMenu` 类相同的 `samples` 包中。菜单项的属性文件如下：\n\n```\nmenu.1=Tables and lists,TablesAndLists\n\
  menu.2=Field completion,FieldCompletion\n```\n\n菜单属性的语法是它包含由逗号分隔的两个元素。第一个元素是菜单项的名称。这对用户可见。第二个是\
  \ HTML 模板文件的名称，该文件将保存菜单项的页面内容。\n\n该类只包含一个方法，该方法由 JavaScript 使用并通过 DWR 来检索菜单项。完整的类实现如下所示：\n\
  \n```\npackage samples;\n\nimport java.io.IOException;\nimport java.io.InputStream;\n\
  import java.util.List;\nimport java.util.Properties;\nimport java.util.Vector;\n\
  \npublic class HorizontalMenu {\n    public HorizontalMenu() {\n    }\n\n    public\
  \ List<String> getMenuItems() throws IOException {\n        List<String> menuItems\
  \ = new Vector<String>();\n        InputStream is = this.getClass().getClassLoader().\n\
  \            getResourceAsStream(\n                \"samples/dwrappplication.properties\"\
  );\n        Properties appProps = new Properties();\n        appProps.load(is);\n\
  \        is.close();\n        for (int menuCount = 1; true; menuCount++) {\n   \
  \         String menuItem = appProps.getProperty(\"menu.\" + menuCount);\n     \
  \       if (menuItem == null) {\n                break;\n            }\n       \
  \     menuItems.add(menuItem);\n        }\n        return menuItems;\n    }\n}\n\
  ```\n\n实现很简单。`getMenuItems()` 方法使用 `ClassLoader.getResourceAsStream()` 方法加载属性，该方法在类路径中搜索指定的资源。然后，在加载属性后，使用\
  \ for 循环遍历菜单项，然后将 String 对象的 List 返回给客户端。客户端是我们稍后会看到的 JavaScript 回调函数。DWR 会自动将 String\
  \ 对象的 List 转换为 JavaScript 数组，因此我们不必担心这个问题。\n\n## 测试 Web 应用程序\n\n我们现在还没有完成任何客户端代码，但让我们还是测试一下代码。测试使用\
  \ Geronimo 测试环境。\n\n- 1. 项目上下文菜单具有我们用于测试应用程序的 Run As 菜单，如以下屏幕截图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_69_0.png)\n\
  \n2. **Run on Server** 打开一个向导来定义新的服务器运行时。以下屏幕截图显示 Geronimo 测试环境已经设置好，我们只需单击 **Finish**\
  \ 即可运行应用程序。如果测试环境未设置，我们可以在此对话框中手动定义一个新环境：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_70_0.png)\n\
  \n3. 单击 **Finish** 后，Eclipse 启动 Geronimo 测试环境以及我们的应用程序。当服务器启动时，Eclipse 中的 **Console**\
  \ 选项卡会通知我们它已启动。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_70_1.png)\n\n## 用户界面：基本元素\n\
  \nServers 选项卡显示服务器已启动并且所有代码已同步，即代码是最新的（同步在我们保存某些已部署文件上的更改时发生）。Servers 选项卡还列出了服务器下部署的应用程序。在\
  \ Servers 选项卡中可以看到我们正在测试的唯一一个应用程序。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_71_0.png)\n\
  \n现在到了有趣的部分——如果我们还没有真正实现任何东西，我们要测试什么？如果我们查看 web.xml 文件，我们会发现我们定义了一个初始化参数。Debug 参数为\
  \ true，这意味着 DWR 为我们的远程 Java 类生成测试页面。我们只需将浏览器（我们使用 Firefox）指向 URL http://127.0.0.1:8080/DWREasyAjax/dwr，然后以下页面就会打开：\n\
  \n![](img/5b721cfaa97eb697efc92e3914f62fca_71_1.png)\n\n此页面将显示我们允许远程的所有类的列表。当我们单击类名时，会打开一个测试页面，如以下屏幕截图所示：\n\
  \n然后可以测试远程方法。当我们测试我们自己的方法 `getMenuItems()` 时，我们会在一个 alert 框中看到响应：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_73_0.png)\n\
  \n屏幕截图中 alert 框中的数组是我们的方法返回的 JavaScript 数组。\n\n## 开发 Web 页面\n\n下一步是添加网页。请注意，我们可以让测试环境继续运行。每当我们更改应用程序代码时，它都会自动发布到测试环境，因此我们不必每次更改并想要测试应用程序时都停止和启动服务器。\n\
  \nCSS 样式表来自 Dynamic Drive CSS Library。该文件名为 styles.css，位于 Eclipse IDE 中的 WebContent\
  \ 目录。CSS 代码如下所示：\n\n```\n/*URL: http://www.dynamicdrive.com/style/ */\n.basictab{\n\
  padding: 3px 0;\nmargin-left: 0;\nfont: bold 12px Verdana;\nborder-bottom: 1px solid\
  \ gray;\nlist-style-type: none;\ntext-align: left; /*set to left, center, or right\
  \ to align the menu as desired*/\n}\n.basictab li{\ndisplay: inline;\nmargin: 0;\n\
  }\n```\n\n```\n.basictab li a{\ntext-decoration: none;\npadding: 3px 7px;\nmargin-right:\
  \ 3px;\nborder: 1px solid gray;\nborder-bottom: none;\nbackground-color: #f6ffd5;\n\
  color: #2d2b2b;\n}\n\n.basictab li a:visited{\ncolor: #2d2b2b;\n}\n\n.basictab li\
  \ a:hover{\nbackground-color: #DBFF6C;\ncolor: black;\n}\n\n.basictab li a:active{\n\
  color: black;\n}\n\n.basictab li.selected a{ /*selected tab effect*/\nposition:\
  \ relative;\ntop: 1px;\npadding-top: 4px;\nbackground-color: #DBFF6C;\ncolor: black;\n\
  }\n```\n\n出于完整性的考虑，这里展示了此 CSS，我们不会详细介绍 CSS 样式表。足以说 CSS 提供了一种创建具有良好展示效果的网站的绝佳方法。\n\
  \n下一步是实际的网页。我们在 WebContent 目录中创建一个 index.jsp 页面，它将具有菜单以及我们示例的 JavaScript 函数。需要注意的是，虽然在此示例中所有\
  \ JavaScript 代码都添加到单个 JSP 页面中，但在“真实”项目中，可能更有用的是为 JavaScript 函数创建单独的文件，并使用如下代码片段将\
  \ JavaScript 文件包含在 HTML/JSP 页面中：\n<script type=\"text/javascript\" src=\"myjavascriptcode/HorizontalMenu.js\"\
  />.\n\n我们稍后将为每个示例添加 JavaScript 函数。以下是使用远程 `HorizontalMenu` 类显示菜单的 JSP 代码。\n\n```\n\
  ```jsp\n<%@ page language=\"java\" contentType=\"text/html; charset=ISO-8859-1\"\
  \n         pageEncoding=\"ISO-8859-1\"%>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML\
  \ 4.01 Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\">\n<html>\n<head>\n\
  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=ISO-8859-1\">\n<link\
  \ href=\"styles.css\" rel=\"stylesheet\" type=\"text/css\"/>\n<script type='text/javascript'\
  \ src='/DWREasyAjax/dwr/engine.js'></script>\n<script type='text/javascript' src='/DWREasyAjax/dwr/util.js'></script>\n\
  <script type='text/javascript' src='/DWREasyAjax/dwr/interface/HorizontalMenu.js'></script>\n\
  <title>DWR samples</title>\n<script type=\"text/javascript\">\n\nfunction loadMenuItems()\n\
  {\n    HorizontalMenu.getMenuItems(setMenuItems);\n}\n\nfunction getContent(contentId)\n\
  {\n    AppContent.getContent(contentId,setContent);\n}\n\nfunction menuItemFormatter(item)\n\
  {\n    elements=item.split(',');\n    return '<li><a href=\"#\" onclick=\"getContent(\\\
  ''+elements[1]+'\\');return false;\">'+elements[0]+'</a></li>';\n}\n\nfunction setMenuItems(menuItems)\n\
  {\n    menu=dwr.util.byId(\"dwrMenu\");\n    menuItemsHtml='';\n    for(var i=0;i<menuItems.length;i++)\n\
  \    {\n        menuItemsHtml=menuItemsHtml+menuItemFormatter(menuItems[i]);\n \
  \   }\n    menu.innerHTML=menuItemsHtml;\n}\n\nfunction setContent(htmlArray)\n\
  {\n{\n```\n\n\n\n```javascript\nvar contentFunctions='';\nvar scriptToBeEvaled='';\n\
  var contentHtml='';\nfor(var i=0;i<htmlArray.length;i++)\n{\n    var html=htmlArray[i];\n\
  \    if(html.toLowerCase().indexOf('<script>')>-1)\n    {\n        if(html.indexOf('TO\
  \ BE EVALED')>-1)\n        {\n            scriptToBeEvaled=html.substring(html.indexOf('>')+1,\n\
  \                                            html.indexOf('</'));\n        }\n \
  \       else\n        {\n            eval(html.substring(html.indexOf('>')+1,html.indexOf('</')));\n\
  \            contentFunctions+=html;\n        }\n    }\n    else\n    {\n      \
  \  contentHtml+=html;\n    }\n}\n\ncontentScriptArea=dwr.util.byId(\"contentAreaFunctions\"\
  );\ncontentScriptArea.innerHTML=contentFunctions;\ncontentArea=dwr.util.byId(\"\
  contentArea\");\ncontentArea.innerHTML=contentHtml;\nif(scriptToBeEvaled!='')\n\
  {\n    eval(scriptToBeEvaled);\n}\n}\n</script>\n</head>\n<body onload=\"loadMenuItems()\"\
  >\n<h1>DWR Easy Java Ajax Applications</h1>\n<ul class=\"basictab\" id=\"dwrMenu\"\
  >\n</ul>\n<div id=\"contentAreaFunctions\">\n</div>\n<div id=\"contentArea\">\n\
  </div>\n</body>\n</html>\n```\n\n这段 JSP 是我们的用户界面。HTML 只是普通的 HTML，包含 head 元素和 body\
  \ 元素。head 中引用了样式表以及 DWR JavaScript 文件，engine.js、util.js 和我们自己的 HorizontalMenu.js。util.js\
  \ 文件是可选的，但由于它包含非常有用的函数，可以将其包含在所有使用 util.js 中函数的网页中。\n\nbody 元素在菜单下方有一个 contentArea\
  \ 占位符，用于内容页面。它还包含特定内容的 JavaScript 函数的内容区域。body 元素的 onload 事件在页面加载时执行 loadMenuItems()\
  \ 函数。loadMenuItems() 函数调用 HorizontalMenu Java 类的远程方法。HorizontalMenu.getMenuItems()\
  \ JavaScript 函数的参数是回调函数，当 Java 方法执行完毕并返回菜单项时，DWR 会调用该回调。\n\nsetMenuItems() 函数是 loadMenuItems()\
  \ 函数的回调，如上一段所述。在加载菜单项时，HorizontalMenu.getMenuItems() 远程方法以字符串列表的形式将菜单项作为参数返回给 setMenuItems()\
  \ 函数。菜单项使用 menuItemFormatter() 辅助函数进行格式化。\n\nmenuItemFormatter() 函数创建菜单文本的 li 元素。菜单被格式化为链接，(a\
  \ href)，并且它们具有 onclick 事件，该事件调用 getContent 函数，而 getContent 又调用 AppContent.getContent()\
  \ 函数。\n\nAppContent 是一个远程 Java 类，我们尚未实现它，其目的是根据用户点击的菜单项从文件中读取 HTML。AppContent 和内容页面的实现在下一节中描述。\n\
  \n我们的动态用户界面如下所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_78_0.png)\n\n注意浏览器屏幕底部的\
  \ Firebug 窗口。截图中的 Firebug 控制台显示了一次对我们的 HorizontalMenu.getMenuItems() 方法的 POST 请求。Firebug\
  \ 的其他功能在开发工作中非常有用，我们发现 Firebug 在整个开发工作中都已启用，这很有用。\n\n## 回调函数\n\n我们第一次看到回调函数的参数是在\
  \ HorizontalMenu.getMenuItems(setMenuItems) 函数中，由于回调是 DWR 中的重要概念，在我们看到其首次使用后，现在进一步讨论它们会很有好处。\n\
  \n回调用于对从远程方法返回的数据进行操作。由于 DWR 和 AJAX 是异步的，RPC（远程过程调用）中典型的返回值，如 Java 调用中的返回值，并不适用。DWR\
  \ 隐藏了调用回调函数的细节，并在我们从远程 Java 方法返回一个值到接收返回值的回调函数的整个过程中内部处理一切。\n\n使用回调函数时推荐两种方法。\n\n\
  我们已经在 `HorizontalMenu.getMenuItems(setMenuItems)` 函数调用中看到了第一种方法。请记住，`getMenuItems()`\
  \ Java 方法没有参数，但在 JavaScript 调用中，我们在参数列表末尾添加了回调函数的名称。如果 Java 方法有参数，则 JavaScript 调用类似于\
  \ `CountryDB.getCountries(selectedLetters,setCountryRows)`，其中 selectedLetters 是\
  \ Java 方法的输入参数，setCountryRows 是回调函数的名称（我们稍后会看到其实现）。\n\n使用回调的第二种方法是远程 JavaScript\
  \ 调用中的元数据对象。示例（完整实现将在本章后面显示）如下所示：\n\n```\nCountryDB.saveCountryNotes(ccode,newNotes,\
  \ {\n    callback:function(newNotes)\n    {\n        //function body here\n    }\n\
  });\n```\n\n这里，函数是匿名的，其实现包含在对远程 Java 方法的 JavaScript 调用中。一个优点是代码易于阅读，并且在我们从 Java\
  \ 方法获得返回值后立即执行代码。另一个优点是我们可以在调用中添加额外的选项。\n\n额外的选项包括超时和错误处理程序，如以下示例所示：\n\n```\nCountryDB.saveCountryNotes(ccode,newNotes,\
  \ {\n    callback:function(newNotes)\n    {\n        //function body here\n    },\n\
  \    timeout:10000,\n    errorHandler:function(errorMsg) { alert(errorMsg); }\n\
  });\n```\n\n也可以为那些不返回值的方法添加回调函数。将回调添加到没有返回值的 methods 在远程调用完成后获取通知时很有用。\n\n## 后记\n\
  \n我们的第一个示例已准备就绪，它也是后续示例的基础。我们还查看了如何在 Eclipse 环境中测试应用程序。\n\n使用 DWR，我们可以将浏览器上的 JavaScript\
  \ 代码和服务器上的 Java 代码视为一体。可能需要一段时间才能习惯，但它将改变我们开发 Web 应用程序的方式。逻辑上，不再有客户端和服务器，而只是一个物理上分离的单一运行时平台。但在实践中，当然，使用\
  \ DWR、客户端 JavaScript 和服务器端 Java 的应用程序仍在使用典型的客户端-服务器交互。在逻辑上单一的运行时平台中编写应用程序时应记住这一点。\n\
  \n## 实现表格和列表\n\n第一个实际示例在应用程序中非常常见：表格和列表。在此示例中，表格使用 DWR 实用函数和远程 Java 类进行填充。示例代码还展示了如何使用\
  \ DWR 进行内联表格编辑。当双击表格单元格时，会打开一个编辑框，用于保存新的单元格数据。\n\n示例将具有国家数据的 CSV 文件：国家名称、正式名称、两位字母代码、首都和用户定义的备注。表格示例的用户界面如下所示：\n\
  \n![](img/5b721cfaa97eb697efc92e3914f62fca_80_0.png)\n\n### 表格和列表的服务器代码\n\n首先要做的是获取国家数据。国家数据位于\
  \ CSV 文件中（名为 `countries.csv`，位于 samples Java 包中）。以下是 CSV 文件内容的摘录（数据来自 `http://www.state.gov`）。\n\
  \n```\nShort-form name,Long-form name,FIPS Code,Capital\n\nAfghanistan,Islamic Republic\
  \ of Afghanistan,AF,Kabul\n\nAlbania,Republic of Albania,AL,Tirana\n\nAlgeria,People's\
  \ Democratic Republic of Algeria,AG,Algiers\n\nAndorra,Principality of Andorra,AN,Andorra\
  \ la Vella\n\nAngola,Republic of Angola,AO,Luanda\n\nAntigua and Barbuda,(no long-form\
  \ name),AC,Saint John's\n\nArgentina,Argentine Republic,AR,Buenos Aires\n\nArmenia,Republic\
  \ of Armenia,AM,Yerevan\n\n...\n```\n\n每次客户端请求国家数据时都会读取 CSV 文件。虽然这不是非常高效，但在本文中已经足够好。其他替代方案包括内存缓存或真实数据库，如\
  \ Apache Derby 或 IBM DB2。作为示例，我们创建了一个 CountryDB 类，用于读取和写入国家 CSV。我们还有另一个类 DBUtils，它包含一些辅助方法。DBUtils\
  \ 代码如下：\n\n```\npackage samples;\n\nimport java.io.BufferedReader;\nimport java.io.File;\n\
  import java.io.FileReader;\nimport java.io.FileWriter;\nimport java.io.IOException;\n\
  import java.io.InputStream;\n```\n\n\n\n\n```java\nimport java.io.InputStreamReader;\n\
  import java.io.PrintWriter;\nimport java.util.List;\nimport java.util.Vector;\n\n\
  public class DBUtils {\n    private String fileName=null;\n    public void initFileDB(String\
  \ fileName)\n    {\n        this.fileName=fileName;\n        // copy csv file to\
  \ bin-directory, for easy\n        // file access\n        File countriesFile =\
  \ new File(fileName);\n        if (!countriesFile.exists()) {\n            try {\n\
  \                List<String> countries = getCSVStrings(null);\n               \
  \ PrintWriter pw;\n                pw = new PrintWriter(new FileWriter(countriesFile));\n\
  \                for (String country : countries) {\n                    pw.println(country);\n\
  \                }\n                pw.close();\n            } catch (IOException\
  \ e) {\n                e.printStackTrace();\n            }\n        }\n    }\n\n\
  \    protected List<String> getCSVStrings(String letter) {\n        List<String>\
  \ csvData = new Vector<String>();\n        try {\n            File csvFile = new\
  \ File(fileName);\n            BufferedReader br = null;\n            if(csvFile.exists())\n\
  \            {\n                br=new BufferedReader(new FileReader(csvFile));\n\
  \            }\n            else\n            {\n                InputStream is\
  \ = this.getClass().getClassLoader()\n                    .getResourceAsStream(\"\
  samples/\"+fileName);\n                br=new BufferedReader(new InputStreamReader(is));\n\
  \                br.readLine();\n            }\n\n            for (String line =\
  \ br.readLine(); line != null; line = br.readLine()) {\n                if (letter\
  \ == null\n|| (letter != null && line.startsWith(letter)) {\n    csvData.add(line);\n\
  }\n}\n    br.close();\n} catch (IOException ioe) {\n    ioe.printStackTrace();\n\
  }\n    return csvData;\n}\n}\n```\n\nDBUtils 类是一个简单的工具类，它将 CSV 内容作为字符串列表返回。它还会将原始\
  \ CSV 文件复制到我们可能运行的任何应用服务器的运行时目录。这可能不是最佳实践，但它使操作 CSV 文件变得更容易，并且我们始终拥有原始的 CSV 文件，如果需要回退到原始版本时不会被修改。\n\
  \n以下是 CountryDB 的代码：\n\n```java\npackage samples;\n\nimport java.io.FileWriter;\n\
  import java.io.IOException;\nimport java.io.PrintWriter;\nimport java.util.Arrays;\n\
  import java.util.List;\nimport java.util.Vector;\n\npublic class CountryDB {\n\n\
  \    private DBUtils dbUtils = new DBUtils();\n    private String fileName = \"\
  countries.csv\";\n\n    public CountryDB() {\n        dbUtils.initFileDB(fileName);\n\
  \    }\n\n    public String[] getCountryData(String ccode) {\n        List<String>\
  \ countries = dbUtils.getCSVStrings(null);\n        for (String country : countries)\
  \ {\n            if (country.indexOf(\",\" + ccode + \",\") > -1) {\n          \
  \      return country.split(\",\");\n            }\n        }\n        return new\
  \ String[0];\n    }\n}\n```\n\n```java\npublic List<List<String>> getCountries(String\
  \ startLetter) {\n    List<List<String>> allCountryData = new Vector<List<String>>();\n\
  \    List<String> countryData = dbUtils.getCSVStrings(startLetter);\n    for (String\
  \ country : countryData) {\n        String[] data = country.split(\",\");\n    \
  \    allCountryData.add(Arrays.asList(data));\n    }\n    return allCountryData;\n\
  }\n\npublic String[] saveCountryNotes(String ccode, String notes) {\n    List<String>\
  \ countries = dbUtils.getCSVStrings(null);\n    try {\n        PrintWriter pw =\
  \ new PrintWriter(new FileWriter(fileName));\n        for (String country : countries)\
  \ {\n            if (country.indexOf(\",\" + ccode + \",\") > -1) {\n          \
  \      if (country.split(\",\").length == 4) {\n                    // no existing\
  \ notes\n                    country = country + \",\" + notes;\n              \
  \  } else {\n                    if (notes.length() == 0) {\n                  \
  \      country = country.substring(0, country\n                            .lastIndexOf(\"\
  ,\"));\n                    } else {\n                        country = country.substring(0,\
  \ country\n                            .lastIndexOf(\",\"))\n                  \
  \          + \",\" + notes;\n                    }\n                }\n        \
  \    }\n            pw.println(country);\n        }\n        pw.close();\n    }\
  \ catch (IOException ioe) {\n        ioe.printStackTrace();\n    }\n    String[]\
  \ rv = new String[2];\n    rv[0] = ccode;\n    rv[1] = notes;\n    return rv;\n\
  }\n```\n\nCountryDB 类是一个远程类。getCountryData() 方法根据国家代码以字符串数组形式返回国家数据。getCountries()\
  \ 方法返回以指定参数开头的全部国家，而 saveCountryNotes() 将用户添加的注释保存到由国家代码指定的国家。\n\n为了使用 CountryDB，必须将以下脚本元素添加到\
  \ index.jsp 文件中，与其他 JavaScript 元素一起。\n\n```html\n<script type='text/javascript'\
  \ src='/DWREasyAjax/dwr/interface/CountryDB.js'></script>\n```\n\n我们还需要创建并远程化的另一个\
  \ Java 类。那就是 AppContent 类，它已存在于主页的 JavaScript 函数中。AppContent 类负责读取 HTML 文件的内容并解析其中的可能\
  \ JavaScript 函数，使其可被 index.jsp 文件中现有的 JavaScript 函数使用。\n\n```java\npackage samples;\n\
  \nimport java.io.ByteArrayOutputStream;\nimport java.io.IOException;\nimport java.io.InputStream;\n\
  import java.util.List;\nimport java.util.Vector;\npublic class AppContent {\n\n\
  \    public AppContent()\n    {\n\n    }\n\n    public List<String> getContent(String\
  \ contentId)\n    {\n        InputStream is = this.getClass().getClassLoader().getResourceAsStream(\n\
  \            \"samples/\"+contentId+\".html\");\n        String content=streamToString(is);\n\
  \        List<String> contentList=new Vector<String>();\n        //Javascript within\
  \ script tag will be extracted and sent separately to client\n        for(String\
  \ script=getScript(content);!script.equals(\"\");script=getScript(content))\n  \
  \      {\n            contentList.add(script);\n            content=removeScript(content);\n\
  ```\n```\n//content list will have all the javascript\n//functions, last element\
  \ is executed last\n//and all other before html content\nif(contentList.size()>1)\n\
  {\n    contentList.add(contentList.size()-1, content);\n}\nelse\n{\n    contentList.add(content);\n\
  }\nreturn contentList;\n}\n\npublic List<String> getLetters()\n{\n    List<String>\
  \ letters=new Vector<String>();\n    char[] l=new char[1];\n    for(int i=65;i<91;i++)\n\
  \    {\n        l[0]=(char)i;\n        letters.add(new String(l));\n    }\n    return\
  \ letters;\n}\n\npublic String removeScript(String html)\n{\n    //removes first\
  \ script element\n    int sIndex=html.toLowerCase().indexOf(\"<script \");\n   \
  \ if(sIndex==-1)\n    {\n        return html;\n    }\n    int eIndex=html.toLowerCase().indexOf(\"\
  </script>\")+9;\n    return html.substring(0, sIndex)+html.substring(eIndex);\n\
  }\n\npublic String getScript(String html)\n{\n    //returns first script element\n\
  \    int sIndex=html.toLowerCase().indexOf(\"<script \");\n    if(sIndex==-1)\n\
  \    {\n        return \"\";\n    }\n}\n```\n\n## 用户界面：基本元素\n\n```java\nint eIndex=html.toLowerCase().indexOf(\"\
  </script>\")+9;\nreturn html.substring(sIndex, eIndex);\n}\n\npublic String streamToString(InputStream\
  \ is)\n{\n    String content=\"\";\n    try\n    {\n        ByteArrayOutputStream\
  \ baos=new ByteArrayOutputStream();\n        for(int b=is.read();b!=-1;b=is.read())\n\
  \        {\n            baos.write(b);\n        }\n        content=baos.toString();\n\
  \    }\n    catch(IOException ioe)\n    {\n        content=ioe.toString();\n   \
  \ }\n    return content;\n}\n}\n```\n\n`getContent()` 方法根据 `contentId` 从文件中读取 HTML\
  \ 代码。`ContentId` 在 `drawapplication.properties` 文件中指定，并且 HTML 就是包目录中 `contentId`\
  \ 加上扩展名 `.html`。还有一个 `getLetters()` 方法，它只是列出从 A 到 Z 的字母并返回一个字母列表到浏览器。\n\n如果我们现在测试应用程序，我们将得到如下截图中所示的错误：\n\
  \n![](img/5b721cfaa97eb697efc92e3914f62fca_87_0.png)\n\n\n\n\n\n我们知道为什么会发生 **AppContent\
  \ is not defined** 错误，因此通过在 `dwr.xml` 文件的 `allow` 元素中添加 `AppContent` 来修复它。我们也在 `allow`\
  \ 元素中添加了 `CountryDB`。我们要做的第一件事是在 `dwr.xml` 文件中添加所需的元素。我们在 `dwr.xml` 文件的 `allow`\
  \ 元素中添加以下 creators。\n\n```\n<create creator=\"new\" javascript=\"AppContent\">\n\
  \    <param name=\"class\" value=\"samples.AppContent\" />\n    <include method=\"\
  getContent\" />\n    <include method=\"getLetters\" />\n</create>\n<create creator=\"\
  new\" javascript=\"CountryDB\">\n    <param name=\"class\" value=\"samples.CountryDB\"\
  \ />\n    <include method=\"getCountries\" />\n    <include method=\"saveCountryNotes\"\
  \ />\n    <include method=\"getCountryData\" />\n</create>\n```\n\n我们使用 `include`\
  \ 元素显式定义要远程调用的方法。这是一种良好的实践，因为我们不会意外允许访问不打算远程调用的任何方法。\n\n## Client Code for Tables\
  \ and Lists\n\n我们还需要在 `index.jsp` 页面中添加一个 JavaScript 接口。将以下内容与 `index.jsp` 文件中的其他脚本一起添加。\n\
  \n```\n<script type='text/javascript' src='/DWAREasyAjax/dwr/interface/AppContent.js'></script>\n\
  ```\n\n在测试之前，我们需要内容区域的示例 HTML。以下 HTML 位于 **samples** 目录下的 `TablesAndLists.html`\
  \ 文件中：\n\n```\n<h3>Countries</h3>\n<p>Show countries starting with\n<select id=\"\
  letters\" onchange=\"selectLetter(this);return false;\"> </select><br/>\nDoubleclick\
  \ \"Notes\"-cell to add notes to country.\n</p>\n<table border=\"1\">\n    <thead>\n\
  \        <tr>\n            <th>Name</th>\n            <th>Long name</th>\n     \
  \       <th>Code</th>\n            <th>Capital</th>\n            <th>Notes</th>\n\
  \        </tr>\n    </thead>\n    <tbody id=\"countryData\">\n    </tbody>\n</table>\n\
  \n<script type='text/javascript'>\n//TO BE EVALED\nAppContent.getLetters(addLetters);\n\
  </script>\n```\n\n末尾的 script 元素由我们的 Java 类提取，并在客户端 JavaScript 接收到 HTML 时由浏览器进行求值。这里有\
  \ select 元素，其 onchange 事件调用 selectLetter() JavaScript 函数。我们稍后将实现 selectLetter()\
  \ 函数。\n\nJavaScript 函数在 index.jsp 文件中添加，并在 head 元素内。函数也可以放在单独的 JavaScript 文件中，但这里嵌入的脚本就足够了。\n\
  \n```\nfunction selectLetter(selectElement)\n{\n    var selectedIndex = selectElement.selectedIndex;\n\
  \    var selectedLetter= selectElement.options[selectedIndex ].value;\n    CountryDB.getCountries(selectedLetter,setCountryRows);\n\
  }\nfunction addLetters(letters)\n{\n    dwr.util.addOptions('letters',['letter...']);\n\
  \    dwr.util.addOptions('letters',letters);\n}\n\nfunction setCountryRows(countryData)\n\
  {\n    var cellFuncs = [\n        function(data) { return data[0]; },\n        function(data)\
  \ { return data[1]; },\n        function(data) { return data[2]; },\n        function(data)\
  \ { return data[3]; },\n        function(data) { return data[4]; }\n    ];\n   \
  \ dwr.util.removeAllRows('countryData');\n    dwr.util.addRows( 'countryData',countryData,cellFuncs,\
  \ {\n        cellCreator:function(options) {\n            var td = document.createElement(\"\
  td\");\n            if(options.cellNum==4)\n            {\n                var notes=options.rowData[4];\n\
  \                if(notes==undefined)\n                {\n                    notes='&nbsp;';//\
  \ + options.rowData[2]+' notes';\n                }\n                var ccode=options.rowData[2];\n\
  \                var divId=ccode+'_Notes';\n                var tdId=divId+'Cell';\n\
  \                td.setAttribute('id',tdId);\n                var html=getNotesHtml(ccode,notes);\n\
  \                td.innerHTML=html;\n                options.data=html;\n      \
  \      }\n            return td;\n        },\n        escapeHtml:false\n    });\n\
  }\n\nfunction getNotesHtml(ccode,notes)\n{\n    var divId=ccode+'_Notes';\n    return\
  \ \"<div onDblClick=\\\"editCountryNotes('\"+divId+\"','\"+ccode+\"');\\\" id=\\\
  \"\"+divId+\"\\\">\"+notes+\"</div>\";\n}\n\nfunction editCountryNotes(id,ccode)\n\
  {\n    var notesElement=dwr.util.byId(id);\n    var tdId=id+'Cell';\n    var notes=notesElement.innerHTML;\n\
  \    if(notes=='&nbsp;')\n    {\n        notes='';\n    }\n    var editBox='<input\
  \ id=\"'+ccode+'NotesEditBox\" type=\"text\" value=\"'+notes+'\"/><br/>';\n    editBox+=\"\
  <input type='button' id='\"+ccode+\"SaveNotesButton' value='Save' onclick='saveCountryNotes(\\\
  \"\"+ccode+\"\\\");'/>&nbsp;\";\n    editBox+=\"<input type='button' id='\"+ccode+\"\
  CancelNotesButton' value='Cancel' onclick='cancelEditNotes(\\\"\"+ccode+\"\\\");'/>\"\
  ;\n    tdElement=dwr.util.byId(tdId);\n    tdElement.innerHTML=editBox;\n    dwr.util.byId(ccode+'NotesEditBox').focus();\n\
  }\n```\n\n```\nfunction cancelEditNotes(ccode)\n{\n    var countryData=CountryDB.getCountryData(ccode,\
  \ {\n    callback:function(data)\n    {\n        var notes=data[4];\n        if(notes==undefined)\n\
  \        {\n            notes='&nbsp;';\n        }\n        var html=getNotesHtml(ccode,notes);\n\
  \        var tdId=ccode+'_NotesCell';\n        var td=dwr.util.byId(tdId);\n   \
  \     td.innerHTML=html;\n    }\n    });\n}\nfunction saveCountryNotes(ccode)\n\
  {\n    var editBox=dwr.util.byId(ccode+'NotesEditBox');\n    var newNotes=editBox.value;\n\
  \    CountryDB.saveCountryNotes(ccode,newNotes, {\n    callback:function(newNotes)\n\
  \    {\n        var ccode=newNotes[0];\n        var notes=newNotes[1];\n       \
  \ var notesHtml=getNotesHtml(ccode,notes);\n        var td=dwr.util.byId(ccode+\"\
  _NotesCell\");\n        td.innerHTML=notesHtml;\n    }\n    });\n}\n```\n\n有很多用于表格示例的函数，我们逐一介绍它们。\n\
  \n第一个是 selectLetter() 函数。此函数从 select 元素获取选定的字母并调用 CountryDB.getCountries() 远程 Java\
  \ 方法。回调函数的 setCountryRows。此函数接收来自 Java getCountries() 方法的返回值，即 List<List<String>>，一个字符串列表的列表。\n\
  \n第二个函数是 addLetters(letters)，它是 AppContent.getLetters() 方法的回调方法，该方法仅返回从 A 到 Z 的字母。addLetters()\
  \ 函数使用 DWR 实用程序函数填充字母列表。\n\n然后是 CountryDB.getCountries() 方法的回调方法。函数的参数是按指定字母开头的国家/地区数组。每个数组元素的格式为：Name、Long\
  \ name、(country code) Code、Capital、Notes。此函数的目的是使用国家/地区数据填充表格；让我们看看它是如何完成的。变量 cellFuncs\
  \ 保存用于检索列中每个单元格数据的函数。参数 data 是从 Java 类返回的国家/地区数据数组。\n\n表格使用 DWR 实用程序函数 addRows()\
  \ 进行填充。cellFuncs 变量用于获取表格单元格的正确数据。cellCreator 函数用于为表格单元格创建自定义 HTML。默认实现仅生成 td 元素，但我们的自定义实现生成带有用户注释占位符\
  \ div 的 td 元素。\n\ngetNotesHtml() 函数用于生成带有双击事件监听器的 div 元素。\n\neditCountryNotes()\
  \ 函数在双击表格单元格时被调用。该函数创建用于编辑注释的输入字段以及保存和取消按钮。\n\ncancelEditNotes() 和 saveCountryNotes()\
  \ 函数取消对新注释的编辑，或通过调用 CountryDB.saveCountryNotes() Java 方法保存它们。\n\n以下屏幕截图显示了填充表格的示例的外观：\n\
  \n![](img/5b721cfaa97eb697efc92e3914f62fca_93_0.png)\n\n现在我们已将必要的函数添加到网页中，我们可以测试应用程序。\n\
  \n## Testing Tables and Lists\n\n如果我们在开发期间一直运行测试环境，应用程序应该已准备好进行测试。Eclipse 在任何内容更改时都会自动将我们的新代码部署到服务器。因此我们可以直接前往测试页面\
  \ `http://127.0.0.1:8080/DWREasyAjax`。点击 **Tables and lists** 我们可以看到我们开发的页面。通过选择某个字母，例如\
  \ \"I\"，我们会得到所有以字母 \"I\" 开头的国家/地区列表（如前一个屏幕截图所示）。\n\n现在我们可以为国家/地区添加注释。我们可以双击 **Notes**\
  \ 下的任何表格单元格。例如，如果我们想为 **Iceland** 输入注释，我们双击 Iceland 表格行中的 **Notes** 单元格，我们会得到如下所示的注释编辑框：\n\
  \n![](img/5b721cfaa97eb697efc92e3914f62fca_94_0.png)\n\n\n\n\n编辑框是一个简单的文本输入字段。我们没有使用任何表单。保存和取消编辑是通过JavaScript和DWR完成的。如果我们按下取消按钮，则会通过DWR从CountryDB\
  \ Java类中获取原始笔记，保存操作也使用DWR来保存数据。CountryDB.saveCountryNotes()接受国家代码和用户在编辑框中输入的笔记，并将它们保存到CSV文件中。当有笔记时，应用程序会将其与其他国家信息一起显示在国家表格中，如下面的截图所示：\n\
  \n![](img/5b721cfaa97eb697efc92e3914f62fca_95_0.png)\n\n## 字段补全的服务器端代码\n\n我们将重用上一节中开发的一些类。AppContent用于加载示例页面，DBUtils类在LicenseDB类中使用。LicenseDB类如下所示：\n\
  \n```\npackage samples;\n\nimport java.util.List;\nimport java.util.Vector;\n\n\
  public class LicenseDB{\n\n    private DBUtils dbUtils=new DBUtils();\n\n    public\
  \ LicenseDB()\n    {\n        dbUtils.initFileDB(\"licenses.csv\");\n    }\n\n \
  \   public List<String> getLicensesStartingWith(String startLetters)\n    {\n  \
  \      List<String> list=new Vector<String>();\n        List<String> licenses=dbUtils.getCSVStrings(startLetters);\n\
  \        for(String license : licenses)\n        {\n            list.add(license.split(\"\
  ,\")[0]);\n        }\n        return list;\n    }\n\n    public String getLicenseContentUrl(String\
  \ licenseName)\n    {\n        List<String> licenses=dbUtils.getCSVStrings(licenseName);\n\
  \        if(licenses.size()>0)\n        {\n            return licenses.get(0).split(\"\
  ,\")[1];\n        }\n        return \"\";\n    }\n}\n```\n\n`getLicensesStartingWith()`方法遍历许可证名称，并返回有效的许可证名称及其URL。与上一节中的数据类似，许可证数据位于包目录下名为`licenses.csv`的CSV文件中。以下是文件内容的摘录：\n\
  \n```\nAcademic Free License, http://opensource.org/licenses/afl-3.0.php\nAdaptive\
  \ Public License, http://opensource.org/licenses/apl1.0.php\nApache Software License,\
  \ http://opensource.org/licenses/apache1-1.1.php\nApache License, http://opensource.org/licenses/apache2.0.php\n\
  Apple Public Source License, http://opensource.org/licenses/apsl-2.0.php\nArtistic\
  \ license, http://opensource.org/licenses/artistic-license-1.0.php\n...\n```\n\n\
  有相当多的开源许可证。有些许可证比其他许可证更受欢迎（如Apache软件许可证），有些则不能重用（如IBM公共许可证）。\n\n我们想要暴露`LicenseDB`类，因此我们向`dwr.xml`文件添加以下内容。\n\
  \n```\n<create creator=\"new\" javascript=\"LicenseDB\">\n    <param name=\"class\"\
  \ value=\"samples.LicenseDB\"/>\n    <include method=\"getLicensesStartingWith\"\
  />\n    <include method=\"getLicenseContentUrl\"/>\n</create>\n```\n\n## 字段补全的客户端代码\n\
  \n以下`script`元素将放在`index.jsp`页面中。\n\n```\n<script type='text/javascript' src='/DWREasyAjax/dwr/interface/LicenseDB.js'></script>\n\
  ```\n\n字段补全的HTML如下：\n\n```\n<h3>Field completion</h3>\n<p>Enter Open Source license\
  \ name to see its contents.\n</p>\n<input type=\"text\" id=\"licenseNameEditBox\"\
  \ value=\"\" onkeyup=\"showPopupMenu()\" size=\"40\"/>\n<input type=\"button\" id=\"\
  showLicenseTextButton\" value=\"Show license text\" onclick=\"showLicenseText()\"\
  />\n<div id=\"completionMenuPopup\"></div>\n<div id=\"licenseContent\"></div>\n\
  ```\n\n我们输入许可证名称的input元素监听onkeyup事件，该事件调用showPopupMenu() JavaScript函数。点击按钮会调用showLicenseText()函数（JavaScript函数稍后解释）。最后，两个div元素分别是弹出菜单和显示许可证内容的iframe元素的占位符。\n\
  \n对于弹出框功能，我们使用现有代码并针对我们的目的进行了修改（非常感谢http://www.jtricks.com）。以下是popup.js文件，位于WebContent\
  \ | js目录下。\n\n```\n//<script type=\"text/javascript\"><!--\n/* Original script by:\
  \ www.jtricks.com\n * Version: 20070301\n * Latest version:\n * www.jtricks.com/javascript/window/box.html\n\
  \ *\n * Modified by Sami Salkosuo.\n */\n// Moves the box object to be directly\
  \ beneath an object.\nfunction move_box(an, box)\n{\n    var cleft = 0;\n    var\
  \ ctop = 0;\n    var obj = an;\n\n    while (obj.offsetParent)\n    {\n        cleft\
  \ += obj.offsetLeft;\n        ctop += obj.offsetTop;\n        obj = obj.offsetParent;\n\
  \    }\n\n    box.style.left = cleft + 'px';\n\n    ctop += an.offsetHeight + 8;\n\
  \n    // Handle Internet Explorer body margins,\n    // which affect normal document,\
  \ but not\n    // absolute-positioned stuff.\n    if (document.body.currentStyle\
  \ &&\n        document.body.currentStyle['marginTop'])\n    {\n        ctop += parseInt(\n\
  \            document.body.currentStyle['marginTop']);\n    }\n}\n```\n\n```\nbox.style.top\
  \ = ctop + 'px';\n}\n\nvar popupMenuInitialised=false;\n// Shows a box if it wasn't\
  \ shown yet or is hidden\n// or hides it if it is currently shown\nfunction show_box(html,\
  \ width, height, borderStyle,id)\n{\n    // Create box object through DOM\n    var\
  \ boxdiv = document.getElementById(id);\n    boxdiv.style.display='block';\n   \
  \ if(popupMenuInitialised==false)\n    {\n        //boxdiv = document.createElement('div');\n\
  \        boxdiv.setAttribute('id', id);\n        boxdiv.style.display = 'block';\n\
  \        boxdiv.style.position = 'absolute';\n        boxdiv.style.width = width\
  \ + 'px';\n        boxdiv.style.height = height + 'px';\n        boxdiv.style.border\
  \ = borderStyle;\n        boxdiv.style.textAlign = 'right';\n        boxdiv.style.padding\
  \ = '4px';\n        boxdiv.style.background = '#FFFFFF';\n        boxdiv.style.zIndex='99';\n\
  \        popupMenuInitialised=true;\n        //document.body.appendChild(boxdiv);\n\
  \    }\n\n    var contentId=id+'Content';\n    var contents = document.getElementById(contentId);\n\
  \    if(contents==null)\n    {\n        contents = document.createElement('div');\n\
  \        contents.setAttribute('id', id+'Content');\n        contents.style.textAlign=\
  \ 'left';\n        boxdiv.contents = contents;\n        boxdiv.appendChild(contents);\n\
  \n    }\n    move_box(html, boxdiv);\n\n    contents.innerHTML= html;\n\n    return\
  \ false;\n}\n```\n\n```\nfunction hide_box(id)\n{\n    document.getElementById(id).style.display='none';\n\
  \    var boxdiv = document.getElementById(id+'Content');\n    if(boxdiv!=null)\n\
  \    {\n        boxdiv.parentNode.removeChild(boxdiv);\n    }\n    return false;\n\
  }\n//--></script>\n```\n\npopup.js文件中的函数用作编辑框正下方的菜单选项。\n\nshow_box()函数接受以下参数：弹出窗口的HTML代码、弹出窗口的位置以及“父”元素（与弹出框相关联的元素）。然后该函数使用DOM创建弹出窗口。move_box()函数用于将弹出窗口移动到编辑框下方的正确位置，hide_box()函数通过将弹出窗口从DOM树中移除来隐藏它。\n\
  \n为了使用popup.js中的函数，我们需要向index.jsp文件添加以下script元素：\n\n```\n<script type='text/javascript'\
  \ src='js/popup.js'></script>\n```\n\n我们自己的字段补全JavaScript代码位于index.jsp文件中。以下是JavaScript函数，代码后附有解释：\n\
  \n```\nfunction showPopupMenu()\n{\n    var licenseNameEditBox=dwr.util.byId('licenseNameEditBox');\n\
  \    var startLetters=licenseNameEditBox.value;\n    LicenseDB.getLicensesStartingWith(startLetters,\
  \ {\n    callback:function(licenses)\n    {\n        var html=\"\";\n        if(licenses.length==0)\n\
  \        {\n            return;\n        }\n        if(licenses.length==1)\n   \
  \     {\n            hidePopupMenu();\n```\n\n```javascript\nlicenseNameEditBox.value=licenses[0];\n\
  }\nelse\n{\n    for (index in licenses)\n    {\n        var licenseName=licenses[index];//.split(\"\
  ,\")[0];\n        licenseName=licenseName.replace(/\\//g, \"&quot;\");\n       \
  \ html+=\"<div style=\\\"border:1px solid #777777;\n                    margin-bottom:5;\\\
  \" onclick=\n                    \\\"completeEditBox('\"+licenseName+\"');\n   \
  \                 \\\"\\\">\"+licenseName+\"</div>\";\n    }\n    show_box(html,\
  \ 200, 270, '1px solid','completionMenuPopup');\n}\n}\n});\n}\n\nfunction hidePopupMenu()\n\
  {\n    hide_box('completionMenuPopup');\n}\n\nfunction completeEditBox(licenseName)\n\
  {\n    var licenseNameEditBox=dwr.util.byId('licenseNameEditBox');\n    licenseNameEditBox.value=licenseName;\n\
  \    hidePopupMenu();\n    dwr.util.byId('showLicenseTextButton').focus();\n}\n\n\
  function showLicenseText()\n{\n    var licenseNameEditBox=dwr.util.byId('licenseNameEditBox');\n\
  \    licenseName=licenseNameEditBox.value;\n    LicenseDB.getLicenseContentUrl(licenseName,{\n\
  \    callback:function(licenseUrl)\n    {\n        var html='<iframe src=\"'+licenseUrl+'\"\
  \ width=\"100%\"\n                              height=\"600\"></iframe>';\n   \
  \     var content=dwr.util.byId('licenseContent');\n        content.style.zIndex=\"\
  1\";\n        content.innerHTML=html;\n    }\n    });\n}\n```\n\n\n\n每次用户在输入框中输入字符时，都会调用\
  \ `showPopupMenu()` 函数。该函数获取输入字段的值，并调用 `LicenseDB.getLicensesStartingWith()` 方法。回调函数在函数参数中指定。回调函数获取所有匹配该参数的许可证，并根据参数（它是一个数组）的长度，要么显示一个包含所有匹配许可证名称的弹出框，要么——如果数组长度为一——隐藏弹出框并将完整的许可证名称插入文本字段。在弹出框中，许可证名称被包裹在带有\
  \ `onclick` 事件监听器的 `div` 元素内，该监听器会调用 `completeEditBox()` 函数。\n\n`hidePopupMenu()`\
  \ 函数仅用于关闭弹出菜单，而 `completeEditBox()` 函数会将点击的许可证文本插入输入框，并将焦点移动到按钮上。当我们点击“Show license\
  \ text”按钮时，会调用 `showLicenseText()` 函数。该函数调用 `LicenseDB.getLicenseContentUrl()` 方法，回调函数会创建一个\
  \ `iframe` 元素，以直接显示来自 http://www.opensource.org 的许可证内容，如下面的截图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_103_0.png)\n\
  \n### 后记\n\n字段补全功能改善了网页的用户体验，本节的示例代码展示了使用 DWR 实现该功能的一种方式。\n\n需要说明的是，这里展示的字段补全示例仅用于演示目的。\n\
  \n### 小结\n\n本章提供了几个网页开发中常见任务的示例：表格和列表、字段补全，甚至为我们的示例代码提供了一个通用框架——称为动态用户界面。表格和列表示例以及字段补全示例都使用了一个非常简单的基于\
  \ CSV 的“数据库”来保存数据，并且两者都有一个远程方法，DWR 通过该方法从服务器获取数据并在客户端显示。\n\n我们还看到了一些很好的 HTML、CSS\
  \ 和 JavaScript 示例。事实上，如果不了解 JavaScript，编写 Web 应用程序将会非常困难。\n\n多年前，正如你们一些人可能记得的，JavaScript\
  \ 在网页开发中是一个不受欢迎的词，没有自尊的开发者会碰 JavaScript。但变化是生活的一部分，在这种情况下，变化是朝着更好的方向。JavaScript\
  \ 和 Java 通过 DWR 很好地协同工作。\n\n下一章继续讨论用户界面部分，并展示更多示例，包括地图滚动功能，类似于流行的 Google Maps 网站中的功能。\n"
- "# 5 用户界面：高级元素\n\n本章包含三个示例：表单、导航树和地图滚动。几乎所有 Web 应用程序中都有表单，示例展示了如何使用 DWR 进行表单验证和处理。导航树包括一个简单的导航树，其中包含一个用于保存菜单元素的\
  \ Java Bean，这些菜单元素通过 DWR 访问。本章的最后一个示例是地图滚动示例，展示了如何使用 Java、JavaScript 和 DWR 实现地图的缩放和滚动。\n\
  \n以下是本章讨论的各个部分：\n\n- 创建表单 — 包括表单处理的示例\n- 构建导航树 — 展示了在导航树实现中使用 DWR 的一种方式\n- 使用 DWR\
  \ 实现地图滚动 — 在网页地图（本示例中使用的是火星地图）中展示了 DWR 的功能\n\n### 创建表单\n\n本示例涉及表单、表单验证以及表单提交流程。在本示例中，我们要处理的表单非常简单，只有几个字段，其重点是展示使用\
  \ DWR 进行表单验证和使用 DWR 提交表单。表单外观如下面的截图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_107_0.png)\n\
  \n#### 开发用户界面\n\n**Name**（姓名）和 **Address**（地址）字段并没有什么特别之处，也许除了现实中的地址字段几乎从来不会是一个简单的文本字段之外。**Credit\
  \ card**（信用卡）号码在输入字段中输入时会进行验证。**Credit card expiry**（信用卡有效期）字段在输入时也会进行验证。\n\n首先要做的是为我们在上一章设计的动态用户界面添加新的菜单项。这是通过向\
  \ `dwapplication.properties` 文件中添加菜单项属性来完成的。我们已经为本章稍后将开发的导航树和地图滚动示例添加了菜单项：\n\n```\n\
  menu.3=Form handling,FormHandling\nmenu.4=Navigation tree,NavigationTree\nmenu.5=Map\
  \ scrolling,MapScrolling\n```\n\n我们的 FormHandling.html 文件的 HTML 代码如下：\n\n```\n<h3>Form\
  \ handling</h3>\n<p>Simple order form.</p>\n<div id=\"formFeedback\"></div>\n<table\
  \ border=\"1\" cellspacing=\"5\" cellpadding=\"5\">\n  <tr>\n    <td>Name</td>\n\
  \    <td><input type=\"text\" id=\"nameEditBox\" value=\"\"\n        size=\"40\"\
  \ /></td>\n  </tr>\n  <tr>\n    <td>Address</td>\n    <td><input type=\"text\" id=\"\
  addressEditBox\" value=\"\" size=\"40\" /></td>\n  </tr>\n  <tr>\n    <td>Credit\
  \ card #<br><a href=\"#\" onclick=\"useTestCreditCardNumber();return false;\">use\
  \ test number</a></td>\n    <td><input type=\"text\" id=\"creditCardEditBox\" value=\"\
  \" onkeyup=\"isValidCreditCard()\" size=\"40\" /></td>\n  </tr>\n  <tr>\n    <td>Credit\
  \ card expiry (mm/yy)</td>\n    <td><input type=\"text\" id=\"expiryEditBox\" value=\"\
  \" onkeyup=\"checkExpiryDate()\" size=\"40\" /></td>\n  </tr>\n  <tr>\n    <td>&nbsp;</td>\n\
  \    <td><input type=\"button\" id=\"submitOrderButton\" value=\"Submit order\"\
  \ onclick=\"submitOrder()\" /></td>\n  </tr>\n</table>\n```\n\n信用卡号码和有效期输入字段的 `onkeyup`\
  \ 事件，以及“使用测试号码”链接和提交按钮的 `onclick` 事件中，指定了相应的 JavaScript 函数。以下 JavaScript 函数位于 index.jsp\
  \ 文件中：\n\n```\nfunction useTestCreditCardNumber()\n{\n    var creditCardEditBox=dwr.util.byId('creditCardEditBox');\n\
  \    creditCardEditBox.value='555555555554444';\n}\n\nfunction isValidCreditCard()\n\
  {\n    var creditCardEditBox=dwr.util.byId('creditCardEditBox');\n    creditCardNumber=creditCardEditBox.value;\n\
  \    FormHandler.isValidCreditCard(creditCardNumber,{\n        callback:function(valid)\n\
  \        {\n            var feedback=dwr.util.byId('formFeedback');\n          \
  \  var html=\"\";\n            if(!valid)\n            {\n                html='<p><font\
  \ color=\"red\">Credit card number is not valid.</font></p>';\n            }\n \
  \           feedback.innerHTML=html;\n        }\n    });\n}\n```\n\n第一个函数 `useTestCreditCardNumber`\
  \ 会向信用卡字段插入一个测试号码，这样我们就不必使用自己的卡号了。\n\n`isValidCreditCard()` 函数在信用卡输入字段中输入内容时被调用。该函数调用一个服务器端\
  \ Java 方法（稍后将实现该方法），并接收到 `true` 或 `false`。如果信用卡号码未通过验证，用户会通过更改带有 `formFeedback`\
  \ ID 的 `div` 元素的内容而得到提示。\n\n`checkExpiryDate()` 函数与上一个函数类似，只是它检查的是有效期日期的语法。\n\n\
  最后一个函数是 `submitOrder()` 函数，它会读取表单字段值，并调用远程 Java 类中的 `submitOrder()` 方法。该 Java 方法返回\
  \ `true` 或 `false`，订单提交的状态会显示给用户。\n\n#### 创建 FormHandler 类\n\n接下来要做的是 FormHandler\
  \ Java 类。该类的实现如下：\n\n```\npackage samples;\n\npublic class FormHandler {\n    public\
  \ boolean submitOrder(String name,String address,String creditCardNumber,String\
  \ expiryDate)\n    {\n        boolean validExpiryDate=checkExpiryFormat(expiryDate);\n\
  \        boolean validCreditCardNumber=\n            isValidCreditCard(creditCardNumber);\n\
  \        //submit order to orderprocessing system\n        boolean orderSubmitted=true;\n\
  \n        return validCreditCardNumber && validExpiryDate &&\n            orderSubmitted;\n\
  \    }\n\n    public boolean checkExpiryFormat(String expiryDate) {\n        if\
  \ (expiryDate.length() != 5) {\n            return false;\n        }\n        if\
  \ (expiryDate.indexOf(\"/\") == -1) {\n            return false;\n        }\n  \
  \  }\n}\n```\n\n\n\n\n## 用户界面：高级元素\n\n```java\nString[] expDate = expiryDate.split(\"\
  /\");\ntry {\n    int month = Integer.parseInt(expDate[0]);\n    int year = Integer.parseInt(expDate[1]);\n\
  \    if ((month >= 1 && month <= 12) && (year >= 8 && year\n        <= 99)) {\n\
  \        return true;\n    }\n    return false;\n} catch (Exception e) {\n    e.printStackTrace();\n\
  \    return false;\n}\n}\n/*\n * The next two methods perform credit card validation.\n\
  \ * Only the format is checked, it is not checked\n * against a card holder.\n *\n\
  \ * Methods provided by Michael Gilleland in his essay\n * \"Anatomy of Credit Card\
  \ Numbers\"\n * http://www.merriampark.com/anatomycc.htm\n */\nprivate String getDigitsOnly(String\
  \ s) {\n    StringBuffer digitsOnly = new StringBuffer();\n    char c;\n    for\
  \ (int i = 0; i < s.length(); i++) {\n        c = s.charAt(i);\n        if (Character.isDigit(c))\
  \ {\n            digitsOnly.append(c);\n        }\n    }\n    return digitsOnly.toString();\n\
  }\n\npublic boolean isValidCreditCard(String cardNumber) {\n    String digitsOnly\
  \ = getDigitsOnly(cardNumber);\n    int sum = 0;\n    int digit = 0;\n    int addend\
  \ = 0;\n    boolean timesTwo = false;\n```\n\n```\nfor (int i = digitsOnly.length()\
  \ - 1; i >= 0; i--) {\n    digit = Integer.parseInt(digitsOnly.substring(i, i +\
  \ 1));\n    if (timesTwo) {\n        addend = digit * 2;\n        if (addend > 9)\
  \ {\n            addend -= 9;\n        }\n    } else {\n        addend = digit;\n\
  \    }\n    sum += addend;\n    timesTwo = !timesTwo;\n}\nint modulus = sum % 10;\n\
  return modulus == 0;\n```\n\n第一个方法 `submitOrder()` 将姓名、地址和信用卡信息作为参数，并在将订单发送到订单处理系统（本示例中未实现）之前验证输入，然后根据订单是否成功返回\
  \ true 或 false 值。\n\n第二个方法 `checkExpiryFormat()` 将信用卡有效期作为参数，并验证其格式是否正确，即 MM/YY，其中\
  \ MM 和 YY 分别是 1-12 和 8-99（2008-2099 年）范围内的整数。\n\n最后两个方法验证信用卡号的格式是否正确。该代码由 Michael\
  \ Gilleland 编写，并发表在他的文章《信用卡号剖析》（http://www.merriampark.com/anatomycc.htm）中。文章解释了信用卡中所有数字的含义，以及如何使用卢恩算法验证给定号码是否真的是信用卡号（更多信息请参阅该文章）。\n\
  \n## 测试表单\n\n接下来要做的是将 FormHandler 添加到 HTML 页面，并将远程类添加到 dwr.xml。我们在 index.jsp 文件中添加以下内容：\n\
  \n```\n<script type='text/javascript' src='/DWREasyAjax/dwr/interface/FormHandler.js'></script>\n\
  ```\n\n## 用户界面：高级元素\n\n我们还要在 dwr.xml 文件中添加以下内容：\n\n```xml\n<create creator=\"new\"\
  \ javascript=\"FormHandler\">\n    <param name=\"class\" value=\"samples.FormHandler\"\
  />\n    <include method=\"checkExpiryFormat\"/>\n    <include method=\"isValidCreditCard\"\
  />\n    <include method=\"submitOrder\"/>\n</create>\n```\n\n现在订单表单已准备就绪。这是一个非常简单的订单表单，但思路很清晰。可以在用户输入文本时验证表单字段。因此，当用户提交表单时，所有字段很可能都是正确的。下面的截图显示了正在进行的表单填写过程：\n\
  \n![](img/5b721cfaa97eb697efc92e3914f62fca_113_0.png)\n\n注意信用卡有效期字段仍然不完整。Firebug\
  \ 窗口显示了 DWR 请求，每次在该字段中输入一个字符时，都会调用 `checkExpiryFormat()` 方法。注意，在这种情况下，每次输入一个字符都调用服务器会引入大量网络流量，并给服务器代码带来额外开销。然而，在本示例中，一个说明性的示例值得服务器承担额外开销。或许在其他情况下，相对于良好的用户体验和即时反馈，额外开销也可以被视为次要因素。\n\
  \n当字段正确并提交订单后，订单会被发送到订单处理系统。订单完成后，用户会收到订单成功的确认信息，如下面的截图所示：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_114_0.png)\n\
  \n当然，在现实生活中，用户会收到订单收据，而不是绿色的**订单已提交**文本。\n\n## 后记\n\n本节中的示例表单演示了 DWR 如何在表单处理中使用。DWR\
  \ 在表单上的应用包括表单字段的实时验证。我们还看到了检查信用卡号有效性的算法。\n\n## 构建导航树\n\n这是一个构建导航菜单的示例，菜单内容通过 DWR\
