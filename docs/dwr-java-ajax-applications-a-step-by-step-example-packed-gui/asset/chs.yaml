  \ | AJ | Baku |  |\n| 12 | Bahamas | The Commonwealth of The Bahamas | BF | Nassau\
  \ | In the Caribbean |\n| 13 | Bahrain | Kingdom of Bahrain | BA | Manama |  |\n\
  | 14 | Bangladesh | People's Republic of Bangladesh | BG | Dhaka |  |\n| 15 | Barbados\
  \ | (no long-form name) | BB | Bridgetown |  |\n| 16 | Belarus | Republic of Belarus\
  \ | BO | Minsk |  |\n| 17 | Belgium | Kingdom of Belgium | BE | Brussels |  |\n\n\
  ## 后记\n\n数据库集成非常容易实现，实际上不会以任何方式影响 DWR 功能。访问数据库只需使用另一个 Java 类，如果我们将其远程化，就可以使用 DWR\
  \ 从浏览器访问它。\n\n## 集成 Web 服务\n\n在本章中，我们使用第三方 Web 服务进行信用卡验证。此信用卡验证服务是在互联网上（经过快速搜索）找到的，并且适合我们的示例。Web\
  \ 服务由 Hypercom 公司托管（http://www.hypercom.com）。\n\n### 开发 Web 服务客户端\n\n该服务是一个标准的 Web\
  \ 服务，具有 WSDL 描述，这使得我们很容易将其集成到我们的应用程序中。WSDL 位于 http://www.tpisoft.com/smartpayments/validate.asmx?WSDL。正如\
  \ URL 所显示的那样，该服务不是基于 Java 的。在 Web 服务世界中，只要接口是标准的，实现方式并不重要。\n\n我们使用 Eclipse 的内置工具为信用卡验证\
  \ Web 服务生成客户端代码。\n\n- 1. Web 服务是使用 Eclipse IDE 中的向导创建的。选择项目 DWREasyAjax，在 File |\
  \ New | Other 菜单中，有一个创建 Web Service Client 的向导。\n\n  ![](img/5b721cfaa97eb697efc92e3914f62fca_153_0.png)\n\
  \n- 3. 服务定义具有 WSDL URL。我们可以保持其他设置不变；按下 **Finish** 将为 **Web Service Client** 生成类。\n\
  \n片刻之后，Eclipse 为 **CreditCardValidator** Web 服务创建了客户端类。默认位置是项目的 **source** 目录。以下屏幕截图显示了生成的类：\n\
  \n![](img/5b721cfaa97eb697efc92e3914f62fca_155_0.png)\n\n我们只需要几个类：CreditCardValidatorSoap，它实际上是一个接口并被间接使用，以及\
  \ CreditCardValidatorSoapProxy，它负责实例化 CreditCardValidatorSoap 接口的实现类并充当实现类的代理。以下是\
  \ CreditCardValidatorSoap 接口的源代码。此接口是从 WSDL 自动生成的，并且由于 WSDL 文件包含 Web 服务操作的文档，Eclipse\
  \ 工具也提供了生成的方法的文档，如下所示：\n\n```java\n/**\n * CreditCardValidatorSoap.java\n *\n *\
  \ This file was auto-generated from WSDL\n * by the Apache Axis 1.4 Apr 22, 2006\
