  \ 类中（其源代码稍后会给出），并且用户名将被添加到 HTTP 会话中。`doLogin()` 方法返回显示给用户的页面的名称，无论是主页面还是登录失败页面。\n\
  \n`doLogout()` 方法执行相反的操作，从 UserDatabase 和 HTTP 会话中移除用户名。\n\n`updateUsersOnline()`\
  \ 方法使用反向 AJAX 更新已登录用户在已登录用户的网页中的在线用户列表。`getUsersOnline()` 方法从 UserDatabase 类返回已登录用户列表。\n\
  \n### UserDatabase.java\n\n```java\npackage bookauthoring;\n\nimport java.util.List;\n\
  import java.util.Vector;\n\n//this class holds currently logged in users\n//there\
