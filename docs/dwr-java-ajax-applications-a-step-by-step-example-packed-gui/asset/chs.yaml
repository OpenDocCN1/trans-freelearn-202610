- "# 6 后端集成\n\n本章介绍如何将 Web 应用程序与各种后端服务集成。几乎所有应用程序都涉及数据库，因此本章的第一个示例展示了一种从 DWR 应用程序访问数据库的方法。第二个示例与标准\
  \ Web 服务集成，而第三个示例使用 JMS 消息传递来访问后端服务。JMS 示例还演示了如何使用 DWR 实现反向 AJAX（Comet）。\n\n本章包含以下部分：\n\
  \n- 将数据库与 DWR 集成——展示如何使用 DWR 访问数据库\n- 与 Web 服务集成——使用 Eclipse 工具为我们的 DWR 应用程序生成 Web\
  \ 服务客户端\n- 与消息系统集成——使用 ActiveMQ 和 JMS 将我们的 DWR 应用程序与基于 Python 的“订单系统”集成\n\n### 使用\
  \ DWR 集成数据库\n\n这里，我们通过一个远程 Java 类公开数据库表，从而将数据库与 DWR 集成。我们的 Java 类使用 JDBC 直接连接数据库，相关的\
  \ SQL 语句也包含在该类中。其他访问数据库的方式包括 EJB、Hibernate 及许多其他方式。\n\n这里的示例替换了第 4 章“表格和列表”中的第一个示例，使国家数据来自数据库而不是\
  \ CSV 文件。从应用程序的角度来看，只需要修改 `dwr.xml` 文件，即将条目改为指向处理数据库访问的 Java 类。在我们实现 Java 类之前，必须先设置并填充数据库。这里我们使用\
  \ Apache Derby 数据库，它随 Geronimo 应用服务器一起发布。\n\n3. 以下 SQL 命令创建一个国家数据表。\n\n```\nCREATE\
  \ TABLE country_data (\n    id INTEGER generated always as identity,\n    short_name\
  \ VARCHAR(64) NOT NULL,\n    long_name VARCHAR(256) NOT NULL,\n    code CHAR(2)\
  \ NOT NULL,\n    capital VARCHAR(64) NOT NULL,\n    notes VARCHAR(256) DEFAULT ''\n\
  );\nALTER TABLE country_data ADD CONSTRAINT pkey PRIMARY KEY (id);\n```\n\n4. 将\
  \ SQL 插入命令区域，然后点击“运行 SQL”按钮。\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_142_0.png)\n\
  \n我们可以使用 **Geronimo 控制台**查看数据库中的表。下面的截图中有一个**数据库列表**，其中包含用于查看应用程序表及其内容的链接：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_143_0.png)\n\
  \n下面的截图显示了**数据库列表**中带有查看表内容链接的应用程序表：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_143_1.png)\n\
  \n表的内容如下：\n\n![](img/5b721cfaa97eb697efc92e3914f62fca_143_2.png)\n\n该表是空的，以下是用国家数据填充该表的\
  \ SQL 语句摘录：\n\n```\ninsert into country_data (short_name,long_name,code,capital)\
