  \ 我们使用 Queue 作为目的地，在下一个界面中，我们为队列配置目的地名称和物理名称。两者都命名为 DWROrderQueue。\n\nJMS 资源\n\n\
  JMS 资源组 -- 配置目的地\n\n消息目的地名称：DWROrderQueue\n\n连接工厂的唯一名称；当从应用程序组件映射资源引用时，用于引用此连接工厂。\n\
  \n目的地配置设置\n\n物理名称：DWROrderQueue\n\n下一步\n\nJMS 资源组 DWROrderQueue 的当前状态\n\n0 个连接工厂\n\
