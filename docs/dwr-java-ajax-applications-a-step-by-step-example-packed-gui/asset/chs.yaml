  \ 白俄罗斯共和国 | BO | 明斯克 |  |\n\n5. 既然我们已经有了表和内容，就需要数据源来访问内容。我们在 Geronimo 中指定数据源，我们的\
  \ Java 类将使用服务器提供的数据源来访问数据库。这样，Geronimo 处理连接的细节，并提供一个连接池，这在我们有大量并发用户时非常有用。数据源在 **Geronimo\
