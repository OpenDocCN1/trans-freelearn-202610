  \ Full description from <a href=\"http://astrogeology.usgs.gov/Projects/MapBook/fullisting.jsp?mapNumber=1170\"\
  >here</a>.</p>\n<div id=\"mapArea\">\nZoom level: <form id=\"zoomLevelForm\"><select\
  \ id=\"zoomLevel\" onchange=\"setZoomLevel(this);return false;\"><option>0</option><option>1</option></select></form><br/>\n\
  <iframe width=\"430\" height=\"440\" scrolling=\"no\" frameborder=\"0\" src=\"MapArea.html\"\
  >\n</iframe>\n</div>\n```\n\n用于缩放的控制元素是一个选择框，它使用 JavaScript 函数为地图设置新的缩放级别。setZoomLevel()\
  \ 函数位于 index.jsp 文件中。函数代码如下：\n\n```\nfunction setZoomLevel(element)\n{\n    var\
  \ selectedIndex = element.selectedIndex;\n    var value= element.options[selectedIndex].value;\n\
  \    var frames=window.frames;\n    frames[0].setZoomLevel(value);\n}\n```\n\n该函数接收\
  \ select 元素，从中提取一个值，然后调用位于 MapArea.html 文件中的另一个 setZoomLevel() 函数。\n\n地图区域是一个 iframe\
  \ 元素，其源代码位于 MapArea.html 文件中，如下所示。该文件位于 WebContent 目录下。\n\n```\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD HTML 4.01 Transitional//EN\" \"http://www.w3.org/TR/html4/loose.dtd\"\
  >\n<html>\n<head>\n<script type='text/javascript' src='/DWREasyAjax/dwr/interface/MapScroller.js'></script>\n\
  <script type='text/javascript' src='/DWREasyAjax/dwr/engine.js'></script>\n<script\
  \ type='text/javascript' src='/DWREasyAjax/dwr/util.js'></script>\n<script type=\"\
  text/javascript\">\n```\n\n```\nvar zoomLevel = 0;\nvar mapPositionIndex= 0;\n\n\
  var refGridX=0;\nvar refGridY=0;\n\nfunction getRowIndex()\n{\n    var tempIndex=0;\n\
  \    if(zoomLevel==0)\n    {\n        if(mapPositionIndex>=10)\n        {\n    \
  \        tempIndex=parseInt(mapPositionIndex.toString().substring(1));\n       \
  \ }\n        else\n        {\n            tempIndex=mapPositionIndex;\n        }\n\
  \    }\n    else\n    {\n        if(mapPositionIndex>=100)\n        {\n        \
