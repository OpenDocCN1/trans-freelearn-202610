  ## 总结


  整个这一章直到最后都围绕 props.conf 和 transforms.conf 设置展开，内容纯粹是技术性的。我们首先了解了紧随输入阶段之后的解析阶段及其重要性。在三个组件中，完整的解析管道存在于
  HF 和索引器上，而不在 UF 上；然而，UF 能够通过 INDEXED_EXTRACTIONS 设置解析结构化文件。我们了解到，如果索引器前面有 HF，则必须在
  HF 上部署解析设置。


  之后，我们查看了与 sourcetype、source 和 host 相关的 props.conf 配置块，并详细了解了用于换行符分割、行合并和时间戳标识的源类型定义规范。接下来，我们了解了与
  props.conf 配合使用的 transforms.conf 配置块。我们进一步深入研究了通过 props.conf 应用 SEDCMD 设置进行数据脱敏，以及使用
  transforms.conf 设置覆盖源类型、索引路由和使用 nullQueue 过滤不需要的事件。


  最后，我们使用 Splunk 数据预览功能测试了新的源类型定义设置和数据脱敏设置 SEDCMD。


  在下一章中，我们将深入探讨字段的主题，并探索如何创建搜索时和索引时字段。此外，我们还将重点关注查找表以及如何使用 Splunk Web 和用于查找文件编辑的 Splunk
  应用来创建它们。


  6. 在 Splunk Web 中，“设置源类型”/数据预览功能的文件上传大小限制是多少？

  A. 5 GB 限制

  B. 1 GB 限制

  C. 500 MB 限制

  D. 1,500 MB 限制


  7. 源类型创建是否保存到 props.conf 文件中？

  A. 是

  B. 否


  8. 在 props.conf 文件中，使用什么设置来引用 transforms 配置块？

  A. TRANSFORMS-<class_name>

  B. TRANSPOSE-<class_name>

  C. TRANSFORMATION-<class_name>

  D. PROPS-<class+name>


  9. 今天部署的脱敏设置是否适用于先前已索引的数据？

  A. 是

  B. 否


  10. 在解析阶段，哪个设置会将数据流按换行符作为行终止符拆分为单个事件？

  A. LINE_BREAKER

  B. TRUNCATE

  C. BREAK_EVENTS

  D. BREAK_ONLY_NEW_LINE


  ## 答案回顾


  希望你通过这些题目回忆起了本章学到的概念。让我们回顾一下答案：


  - 1. *选项 B* 是正确答案。数据索引过程中的三个主要阶段是输入、解析和索引。

  - 2. *选项 B、C 和 E* 是正确答案。你可以通过 `[sourcetype_name]`、`[source::<source_name_or_pattern>]`
  或 `[host::<hostname_or_pattern>]` 配置块语法应用 `props.conf` 设置。

  - 3. *所有选项* 都是正确的。在解析阶段，可以覆盖 `sourcetype`、`host` 和 `source` 等元数据字段，并且可以更改索引以重新路由符合特定条件的事件以及进行数据脱敏。此外，你可以过滤满足特定条件的事件，然后将这些事件从索引中丢弃。

  - 4. *选项 C* 是正确的。其余选项均不正确；Splunk 中不存在这样的队列。

  - 5. 答案是错误的。`SEDCMD-<class> = "<sed style regular expression>"` 设置属于 `props.conf`
  文件。

  - 6. *选项 C* 是正确的。通过 Splunk Web 中的 **设置源类型**/数据预览功能上传文件的文件大小限制为 500 MB。

  - 7. *是的，没错。* 源类型定义将保存到 `props.conf` 文件中。

  - 8. *选项 A* 是正确的。在 `props.file` 设置中，`TRANSFORMS-<class_name> = <transform_stanza_1>,<
  transform_stanza_2>,...<transform_stanza_n>` 是正确语法。`<class_name>` 是唯一的字面字符串。可以分配多个
  transforms 配置块；如果使用逗号 (,) 分隔，它们将按指定顺序执行。

  - 9. *否。* 数据脱敏是解析阶段的操作，并且只适用于 Splunk 中新增的数据。过去已经摄入的数据不会受到影响。要将相同的解析阶段设置应用于历史数据，必须删除并重新摄入。

  - 10. *选项 A* 是正确的。`LINE_BREAKER` 允许你指定如何将原始数据流拆分为单个事件。默认情况下，Splunk 会根据换行符（`\n`）将原始数据流拆分为事件。





