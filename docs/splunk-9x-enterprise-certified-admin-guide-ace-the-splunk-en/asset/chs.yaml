- "## 理解 Splunk 索引\n\n索引是 Splunk Enterprise 内部一种特定类型的数据存储；换句话说，简单来说，索引就是数据的存储库。例如，你在网上表单中搜索自己的地址并输入地址详情：你提供门牌号、街道和邮政编码，这些信息对你来说是唯一的。类似地，如果你想在\
  \ Splunk 中搜索特定数据，可以通过使用其索引来找到它。\n\nSplunk 索引有两种类型，分别称为**事件**索引和**指标**索引。事件索引存储任何类型的文本数据，这是默认的索引类型。指标索引只存储必须符合特定结构的指标数据。Splunk\
  \ 中有一些专门用于处理指标数据的特殊命令，通常以 `m` 开头，例如 `mstats`、`mpreview` 和 `mcatalog`。指标索引是一个完全不同的主题，超出了本书的范围。如果你想了解更多相关信息，请访问\
  \ https://tinyurl.com/5n8jb6c。在本章中，我们将重点关注事件索引。从现在开始，如果没有明确说明索引类型，请假定它是事件索引。\n\n\
  Splunk 允许你创建自己的索引，同时它也会附带一些事件索引，每个都有特定的用途。让我们来看看这些索引：\n\n- `main`：如果没有在外部输入源中指定索引，则这是\
  \ Splunk 的默认索引。\n- `summary`：用于存储摘要数据的默认摘要索引。\n- `_internal`：存储来自各种内部源的 Splunk 内部日志，例如\
  \ splunkd 守护进程日志、Web 访问日志、调度器日志、Python 日志等。\n- `_audit`：存储 Splunk 内部审计日志，例如登录、搜索、数据访问和管理活动。\n\
  - `_introspection`：存储 Splunk 资源消耗和性能数据。监控控制台应用仪表板高度依赖此索引。\n- `_fishbucket`：存储文件监控输入源的检查点信息。\n\
  - `_telemetry`：如果通过 `telemetry.conf` 启用了检测信息，则存储这些信息。\n\n创建 Splunk 索引的方法不止一种，具体取决于\
  \ Splunk 部署架构的类型。无论采用哪种方法，都需要在索引器中配置 `indexes.conf` 文件。\n\n索引器是 Splunk Enterprise\
  \ 的一个实例，负责在将传入数据存储到索引中之前进行处理，并响应由搜索头发出的搜索查询。在前面的章节中，我们已经简要概述了 Splunk 组件，例如索引器和搜索头。\n\
  \n让我们来看一下索引的重要特性：\n\n- Splunk 允许管理员根据需要和需求创建自定义索引，以存储和组织特定类型的数据。\n- 每个索引都有数据大小和保留时间的限制。要查看配置设置，请参阅\
  \ `$SPLUNK_HOME/etc/system/default` 目录中 `_internal` 索引的 indexes.conf 定义。\n- 索引以压缩格式包含最初接收的数据，这称为原始数据。它们还包含称为\
  \ tsidx 文件的索引文件和元数据文件。\n- 索引以桶的形式在文件系统上组织数据。\n- 索引默认存储在 `$SPLUNK_HOME/var/lib/splunk`。该路径通过\
  \ `$SPLUNK_DB` 环境变量引用。\n- 一旦数据写入索引，它就是最终的，不能被修改。\n- 具有 can_delete 角色的授权用户可以发出 delete\
  \ 命令，以防止数据参与搜索。此命令会对数据应用删除标记。这意味着它不会永久从存储中删除数据。要永久删除事件数据，请谨慎执行 splunk clean 命令。\n\
  - 索引的隔离取决于数据大小、数据保留策略、访问策略以及其中存储的数据类型。\n\n我希望你现在对索引有了足够的了解。在下一节中，我们将介绍 Splunk 如何以桶的形式组织数据。\n\
  \n## 理解桶\n\n桶是索引不可分割的一部分；它们包含原始数据和索引文件。它们以文件夹的形式组织在文件系统上，并具有特定的命名模式。这些文件夹由 Splunk\
  \ 索引器专门用于数据存储和搜索处理。\n\n为了进一步了解它们，让我们看看默认的 _introspection 索引文件夹结构：\n\n```\nC:\\Program\
  \ Files\\Splunk\\var\\lib\\splunk\\_introspection>tree\nFolder PATH listing for\
  \ volume Windows\nVolume serial number is 6676-C13F\nC:.\n├── colddb\n├── datamodel_summary\n\
  ├── db\n│   ├── db_1663851317_1661686760_13\n│   │   └── rawdata\n│   ├── GlobalMetaData\n\
  │   └── hot_v1_14\n│       └── rawdata\n└── thaweddb\n```\n\n图 5.1：Splunk 非集群索引文件夹结构\n\
  \n我们现在已经了解了事件索引桶。数据会根据情况从热桶滚动到暖桶、冷桶、冻结桶和解冻桶。既然你已经熟悉了索引及其内部结构，让我们继续学习索引的创建。\n\n##\
  \ 创建 Splunk 索引\n\n创建自定义索引是 Splunk 管理员的责任。如你所见，数据会一直保留在索引中，直到数据达到一定年龄或索引达到一定大小，因此在创建索引之前估算索引大小是关键的一步。准确的估算可以确保数据保留所需的时间，同时也有助于提前确定所需的存储容量。\n\
  \n为了估算索引的大小，我们必须知道以下问题的答案：\n\n- *问题：* 数据需要保留多少天？\n  *答案：* 例如，100 天\n- *问题：* 每天预计有多少\
  \ GB 的数据量？\n  *答案：* 例如，1 GB\n\n索引大小估算公式如下：\n\n*保留天数 X 每日数据量 X 1/2（原始数据压缩 + 索引文件）*\n\
  \n如果我们将示例值代入，索引大小变为 100 X 1 X ½ = 50 GB。\n\n既然你已经知道如何估算索引大小并决定为其命名，让我们来看看索引创建过程。\n\
  \n在“*理解桶*”一节中，我们看到 `$SPLUNK_HOME/etc/system/default` 目录中的 `indexes.conf` 文件有一个 `_introspection`\
  \ 索引的条目。类似地，Splunk 自带许多内部索引，你可以在同一文件中找到。Splunk 允许我们创建自定义索引，而且创建索引的方法不止一种，这完全取决于部署架构的类型。通常，管理员会选择最合适的方法。在本节中，我们选择了一个单独的\
  \ Splunk 实例，它同时充当搜索头和索引器。让我们来看看创建事件索引的不同方法。\n\n## Splunk Web\n\n以管理员身份登录 Splunk\
  \ Web。转到右上角的**设置**菜单，单击**索引**。打开页面后，右上角会出现一个**新建索引**按钮。在同一页面上，你可以看到默认索引以 `_` 开头，例如\
  \ `_internal` 和 `_audit`。\n\n如果你希望查看某个默认索引的配置，请单击该索引名称。否则，请单击**新建索引**按钮并填写**索引名称**和**整个索引的最大大小**字段，继续创建新索引。默认的**索引数据类型**设置为**事件**。指标应该\n\
  \n- **参数：** homePath、coldPath、thawedPath、app 等\n- **示例：** $SPLUNK_HOME\\bin\\splunk\
  \ add index windows-event-logs -app search\n\nCLI 和 Splunk Web 两种方式都会写入文件系统上的 indexes.conf\
  \ 文件。如果你熟悉 indexes.conf 规范，那么直接创建 indexes.conf 文件也能达到同样的目的。\n\n## indexes.conf 详解\n\
  \n让我们深入了解一下我们通过 Splunk Web 创建的 windows-event-logs 索引对应的 indexes.conf 文件。正如我们在 Splunk\
  \ Web 一节中所了解的，该索引默认保存到名为 search 的 Search & Reporting 应用文件夹中，因此我可以在 $SPLUNK_HOME/etc/apps/search/local\
  \ 找到它：\n\n```\n[windows-event-logs]\ncoldPath = $SPLUNK_DB\\windows-event-logs\\\
  colddb\nenableDataIntegrityControl = 0\nenableTsidxReduction = 0\nhomePath = $SPLUNK_DB\\\
  windows-event-logs\\db\nmaxTotalDataSizeMB = 500\nthawedPath = $SPLUNK_DB\\windows-event-logs\\\
  thaweddb\n```\n\n这种方法的一个优点是，可以为高级索引配置设置一系列选项。但是，通过这种基于文件的方式创建新索引需要重启 Splunk 实例。\n\
  \n有多种方法可以控制数据大小，从桶目录级别到整个索引大小。让我们看看以下高级选项以及需要备份的内容：\n\n- homePath.maxDataSizeMB\
  \ 限制 homePath 目录中热桶和暖桶的大小。\n- coldPath.maxDataSizeMB 限制 coldPath 目录中冷桶的大小。\n- 要限制可创建的热桶和暖桶数量，请分别设置\
  \ maxHotBuckets 和 maxWarmDBCount。对于高容量索引（索引数据量超过 10 GB/天），Splunk 建议将 maxHotBuckets\
  \ 从默认值 3 增加到 10。\n- 默认情况下，Splunk 通过 maxDataSize = auto 将热桶大小限制为 750 MB；如果每天索引大小估算为\
  \ 10 GB，请将此选项设置为 maxDataSize = auto_high_volume，以便 Splunk 在 64 位系统上创建 10 GB 的热桶。使用此选项是为了避免为大型索引创建过多的小桶。过多的小桶会影响\
  \ Splunk 的性能。热桶一旦达到最大大小，就会滚动为暖桶，然后会创建新的热桶。\n\n\n\n\n\n- `maxTotalDataSizeMB` 是总索引大小限制。如果查看示例索引\
  \ `windows-event-logs`，我们已将此值设置为 500 MB。\n- 全局设置适用于 `indexes.conf` 中指定的每个索引。完整列表请参考\
  \ Splunk 文档中的 `indexes.conf.spec` 文件。在全局级别，可以配置 `lastChanceIndex` 选项。它作为任何未指明有效索引的外部输入的最终选项。如果此值留空，Splunk\
  \ 将简单地丢弃这些事件。\n\n如果移动到冷存储桶的数据搜索频率不高，因此分配与热/温存储桶类似的昂贵硬件存储就不具成本效益怎么办？Splunk 建议对热/温存储桶使用低延迟高吞吐量的存储，因为它们保存的是经常被搜索的最新数据。冷存储桶可以驻留在标准延迟存储上，该存储速度慢且便宜。为实现此目的，可以使用卷来配置索引。让我们在下一节中查看卷。\n\
  \n## 索引卷\n\n卷是文件系统上的特定目录，分配给索引以有效管理存储空间。让我们看一下在 UNIX 基于的操作系统上为我们在上一节中通过 Splunk Web\
  \ 创建的 `windows-event-logs` 索引的卷配置：\n\n```\n[volume:hot_storage]\npath = /mnt/fast_disk\n\
  # Optional limits the volume size to 60 GB\nmaxVolumeDataSizeMB = 61440\n\n[volume:cold_storage]\n\
  path = /mnt/slow_disk\n#Optional limits the volume size to 50 GB\nmaxVolumeDataSizeMB\
  \ = 51200\n\n#index definition\n[windows-event-logs]\nhomePath = volume:hot_storage/windows-event-logs\n\
  coldPath = volume:cold_storage/windows-event-logs\nmaxTotalDataSizeMB = 51200\n\
  thawedPath = $SPLUNK_DB/windows-event-logs/thawedDb\n```\n\n此配置在 `homePath` 和 `coldPath`\
  \ 中包含 `volume` 关键字。`thawedPath` 设置为标准位置，因为它不能位于卷上。如果您想了解一些更高级的选项，请查看 `$SPLUNK_HOME/etc/system/README`\
  \ 目录中的 `indexes.conf.spec` 文件。\n\n在下一节中，我们将介绍备份索引。\n\n## 备份索引\n\n到目前为止，我们已创建索引并将信息存储在存储桶中，并在\
  \ .conf 文件中修改了其配置。如果底层硬件出现故障，并且您有无法丢失的关键数据和文件怎么办？要将 Splunk 实例恢复到原始状态，必须设置备份程序。对于认证考试，了解需要备份\
  \ Splunk 安装的哪些文件夹非常重要。以下两个基本文件夹需要备份：\n\n- $SPLUNK_DB 目录：$SPLUNK_HOME/var/lib/splunk/\n\
  \  热存储桶在 Splunk 运行期间无法备份；相反，可以增量地拍摄快照，并可以备份快照\n- $SPLUNK_HOME/etc 目录：此目录包含 apps、用户配置、系统配置文件和许可证\n\
  \n在 Splunk 中，$SPLUNK_HOME/etc 目录是一个关键目录，其中包含控制整个 Splunk 部署行为的配置文件和设置。备份此目录对于确保所有配置和自定义得到保护，并在出现任何意外问题或系统故障时能够恢复至关重要。\n\
  \n这就是我们将要介绍的关于索引创建的全部内容；我们以需要备份的内容结束。在此阶段，您应该熟悉核心索引概念和高级配置选项。让我们在下一节中查看监控索引。\n\n\
  ## 监控 Splunk 索引\n\n作为管理员，监控随着数量增长的多个索引可能会让人不知所措。为了解决这个问题，Splunk 通过默认的监控控制台应用来监控索引。它具有许多监控功能，监控索引是其中之一。让我们看一下其菜单选项。\n\
  \n以管理员身份登录并导航到右上角的设置。单击监控控制台。控制台在以下网络视图中打开。单击索引并选择索引详细信息：实例。\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_102_0.png)\n\
  \n图 5.4：监控控制台中的索引仪表板\n\n我们还探讨了 Splunk 索引器作为 Splunk 架构的关键组件的作用。索引器负责处理和索引数据、高效存储数据，并响应来自用户和外部应用程序的搜索请求。数据在索引中组织成存储桶，称为热、温、冷、冻结和解冻。这些存储桶默认存储在\
  \ $SPLUNK_DB 位置。我们讨论了当满足条件时从热到温到冷到冻结（可选）的转换。冻结存储桶不可搜索；解冻存储桶用于从冻结存储桶恢复数据以进行搜索。我们还介绍了通过\
  \ Web、CLI 和 indexes.conf 文件创建索引。我们查看了数据老化、性能、用于存储管理的卷等高级设置。全局设置之一是 lastChanceIndex，用于存储提供无效索引的外部输入。\n\
  \n我们讨论了备份索引数据和其他用于恢复的有用配置。我们以讨论监控控制台应用结束，该应用包含用于监控索引和卷的仪表板。在下一章中，我们将深入探讨 Splunk\
  \ 配置文件。\n\n## 自我评估\n\n您将获得 10 道多项选择题。问题模式与第 1 章《开始使用 Splunk Enterprise 认证管理员考试》中介绍的考试测试模式部分所讨论的相同。完成后，请参考您有困难的部分。或者，您也可以参考\
  \ Splunk 文档。祝你好运！让我们开始吧。\n\n- 1. 索引是数据的存储库，并且有一个名称。此说法是否正确？\n  A. 正确\n  B. 错误\n\n\
  - 2. 索引器是一个 Splunk 实例。它在 Splunk 部署中的作用是什么？（多选）\n  A. 索引器存储数据。\n  B. 索引器将数据存储在 $SPLUNK_HOME\
  \ 位置。\n  C. 索引器响应搜索头发出的搜索请求。\n  D. 存储在索引器中的数据无法删除。\n  E. 索引器默认带有内部索引。您也可以创建自定义索引。\n\
  \n- 3. 度量索引是否存储任何类型的文本数据？\n  A. 是\n  B. 否\n\n9. 关于 indexes.conf 中的卷，哪个说法是正确的？（多选）\n\
  \n- A. 卷是文件系统上的目录。\n- B. 卷复杂难以管理，因此需要 Splunk 支持协助。\n- C. 卷有助于有效管理存储。\n- D. 卷使用以\
  \ volume : 为前缀的节进行配置。\n\n10. 您能否找到需要定期备份的目录？\n\n- A. $SPLUNK_HOME/var/etc\n- B.\
  \ $SPLUNK_DB/etc\n- C. $SPLUNK_HOME/etc\n- D. $SPLUNK_DB/var/lib/splunk/fishbucket\n\
  \n我希望您能够回忆起这些主题！让我们在下一节中查看答案。\n\n## 复查答案\n\n- 1. 正确，索引是数据的存储库，并且它们确实有名称。\n- 2. 选项\
  \ A、C 和 E 是正确答案。索引器数据默认存储在 $SPLUNK_DB 位置。索引数据可以通过 delete 和 clean 命令删除。\n- 3. 否，度量索引仅以文本形式存储度量数据。\n\
  - 4. 选项 B、C、D 和 E 是正确答案。\n- 5. 选项 B 正确。maxDataSize = auto 将热存储桶大小设置为 750 MB。您还可以设置的另一个选项是\
  \ maxDataSize = <integer> | auto | auto_high_volume。只需指定整数（maxDataSize = 1000）或\
  \ auto_high_volume 将存储桶大小设置为 10 GB，这对于日数据量超过 10 GB 的高容量索引是首选。\n- 6. 选项 D 是正确答案。数据从热到温到冷到冻结（可选）滚动。解冻存储桶用于恢复冻结数据。\n\
  - 7. 所有选项均正确。\n- 8. 选项 C 正确。例如，index=web-logs | delete 将删除标记应用于匹配搜索条件的数据，并且不会永久从磁盘中删除索引数据。\n\
  - 9. 选项 A、C 和 D 是正确答案。\n- 10. 选项 C 是正确答案。$SPLUNK_HOME/etc 目录包含有关用户、应用和其他系统配置详细信息的关键信息。\n\
  \n\n\n\n"
- "## Splunk 配置文件\n\n配置文件是 Splunk Enterprise 不可或缺的一部分。你通过 Splunk Web、CLI 或 RESTful\
  \ 接口所做的任何配置更改，都会在后台直接更新到 conf 文件中。因此，凡是遇到 “.conf”、“conf”、“config” 或 “configuration\
  \ file” 等术语，都应理解为同一概念。存在许多这样的 conf 文件，各自用于满足特定目的。在本章中，你将看到跨 Splunk 组件（如搜索头、索引器和转发器）常用文件的使用示例。这些文件可以存储在多个位置，例如用户目录、系统目录和应用目录。你将了解这些文件如何在内存中合并以进行处理。当你熟悉了可以存储\
  \ .conf 文件的目录结构后，你将理解它们的优先级、处理顺序，并使用 btool 命令查找它们。\n\n你将了解到 .conf 文件对 Splunk 系统管理员和数据管理员都至关重要。系统管理员通常需要调整或重新配置系统级设置，而数据管理员则负责数据摄取、搜索时和索引时的知识对象创建，以及数据索引的故障排除。了解\
  \ conf 文件如何协同工作，并通过 btool 和 RESTful 接口查看合并后的 conf 文件，对于每个人更深入地了解 Splunk 都是必要的。\n\
  \n在本章中，我们将涵盖以下主题：\n- 理解 conf 文件\n- 理解 conf 文件的优先级\n- 排查 conf 文件问题\n\n## 理解 conf\
  \ 文件\n\nSplunk Enterprise 中的 .conf 文件是在数据转发、解析、索引和搜索运行时发挥特定功能的配置文件。这些文件包含重要设置，可以通过文件系统直接或间接（通过\
  \ Splunk Web、CLI 或 REST API）进行修改。\n\n让我们探索有关 .conf 文件的关键信息。\n\n## 文件格式和访问\n\n要修改或创建新的\
  \ .conf 文件，你需要访问 Splunk 组件的文件系统。这通常需要在安装 Splunk 的机器上具有适当的权限或管理员权限。通过访问文件系统，你可以使用文本编辑器或其他工具编辑\
  \ .conf 文件。\n\n## 结构和语法\n\n.conf 文件使用 <key/attribute> = <value> 格式来定义设置。每个键都有其自身的含义，并且键区分大小写。设置被组织成唯一的\
  \ [<stanza>] 节。遵循每个 .conf 文件的定义规范非常重要，这些规范可以在 Splunk 的在线文档或安装目录下的 $SPLUNK_HOME/etc/system/README\
  \ 中以 .spec 扩展名找到。\n\n例如，在 props.conf 文件中，KV_MODE 是正确的属性，而 kv_mode 被视为不同且不正确的属性。在\
  \ .conf 文件中定义属性时，请确保按照相应 conf 文件的规范使用正确的大小写。以下是一个 props.conf 文件的示例结构，包含 [default]\
  \ 节和其他自定义节：\n\n```\n# This is a comment in .conf files\n# Global settings applied\
  \ to all stanzas in props.conf\n[default]\nTIME_FORMAT = %Y-%m-%d %H:%M:%S\nTRUNCATE\
  \ = 20000\nCHARSET = UTF-8\n\n# Specific settings for a sourcetype\n[access_logs]\n\
  EXTRACT-field_name = \"^\\[(\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2})\\]\"\n\n\
  # Settings for a host\n[host::server1]\nTRANSFORMS-sethost = sethost_server1\nLINE_BREAKER\
  \ = ([\\r\\n]+)(\\d{4}-\\d{2}-\\d{2})\nEXTRACT-myfield1 = myregex1\nEXTRACT-myfield2\
  \ = myregex2\n```\n\n以下是关于此示例的一些说明：\n- 可以使用行首的 # 符号添加注释\n- [default] 节设置应用于所有源类型的全局设置，除非被覆盖\n\
  - [access_logs] 节为 access_logs 源类型定义特定设置\n- [host::server1] 节为名为 server1 的特定主机指定设置\n\
  \n![](img/5319cbd6f078c6cda7fac6347f77a07d_111_0.png)\n\n图 6.1：conf 文件的目录结构和位置\n\
  \n图 6.1 显示了位于 SPLUNK_HOME 下的 etc\\users\\<user_name>\\<app_name>、etc\\apps\\<app_name>\\\
  \ 和 etc\\system 目录中的 conf 文件。其中的子目录 \\default 和 \\local 是 .conf 文件的典型位置：\n- 图中的\
  \ <user_name> 显示了内置的 admin 和 splunk-system-user 用户\n- 图中的 <app_name> 显示了开箱即用的 search\
  \ 应用及其子目录结构\n\nSplunk 建议不要更改 etc\\system\\default 目录中的 conf 文件。相反，应创建一个 etc\\system\\\
  local\\ 目录，并将自定义配置放在其中。\n\n## 需要记住的要点\n\nSplunk 定义了多个配置文件，这些文件附带相应的 .spec 扩展名规范。这些资源可以在\
  \ $SPLUNK_HOME/etc/system/README 目录中找到，同时还有说明性示例。\n\n每个 conf 文件都有一个基本结构，即 [<stanza>]\
  \ 节以及下层的 <key> = <value> 键值对设置。键区分大小写。\n\nSplunk 在 $SPLUNK_HOME/etc/system/default\
  \ 目录下提供默认的 conf 文件，不建议编辑此目录中的文件。因此，优先使用 /local 目录来覆盖设置。\n\n不同目录中 .conf 文件的优先级决定了哪些设置优先。让我们探讨这些配置文件的考虑顺序。\n\
  \n## 理解 conf 文件的优先级\n\n$SPLUNK_HOME/etc 是典型 Splunk Enterprise 安装中所有 conf 文件所在的父目录。在此父目录下，配置文件可以在多个位置创建。你可能想知道为什么需要在多个位置存放相同类型的文件。\n\
  \n在 Splunk 内在各个级别配置设置的能力，为管理员、开发者和用户提供了灵活性，使其能够根据特定需求定制平台。这种灵活性允许对单个应用和用户体验进行精确控制。在多个目录中具有相同节名称的文件的优先级由\
  \ Splunk 决定。本节后面将介绍优先级。\n\n默认情况下，Splunk Enterprise 在 $SPLUNK_HOME/etc/system/default\
  \ 目录下提供所有系统级配置，该目录不应被更改。因此，如果需要对 /default 目录下的 conf 文件进行更改，建议在 $SPLUNK_HOME/etc/system/local\
  \ 目录下创建，该目录优先于 /default 目录。同样，conf 文件也可能存在于以下目录下：\n- $SPLUNK_HOME/etc/users：此目录包含由每个单独用户拥有的私有、特定于用户的更改。这种所有权确保了用户特定更改的隔离，并且默认不与其他用户共享。\n\
  - $SPLUNK_HOME/etc/apps/<app_name>/[default|local]：在应用（app）的 <app_name> 目录内创建的配置存储在此处。这些配置对任何有权访问该应用的用户可用。通过为用户分配特定角色，你可以控制他们对应用的访问，包括查看和修改\
  \ <app_name> 目录中配置的能力。\n- $SPLUNK_HOME/etc/system/local：存储在此 Splunk 目录中的配置被视为全局配置。这些配置对于\
  \ Splunk 实例中的每个用户都是可访问的。\n\n至此，你已了解配置文件目录的列表。让我们理解 Splunk 如何决定不同目录中相同 conf 文件的优先级（参见图\
  \ 6.1）。优先级根据 conf 类型输入（如 props、indexes 等）及其上下文来决定。\n\n配置设置使用的上下文也会影响优先级顺序。例如，某些配置设置可能仅适用于特定的应用或数据源，而其他设置可能全局应用于整个\
  \ Splunk 环境。两种上下文类型如下：\n- **全局**：独立于用户和应用上下文的配置文件包括与索引、监控、部署、服务器配置等相关的设置。这些配置独立于用户和应用上下文，并全局应用于\
  \ Splunk 实例中的所有用户。\n\n\n\n\n\n## 场景 2\n\n在本场景中，我们将考察在两个不同应用中创建的相同设置。\n\n应用名称可以包含小写字母、大写字母、数字、空格和特殊字符。如果两个不同的应用中存在相同的设置，那么\
  \ Splunk 决定在运行时执行它们的顺序，是通过对应用名称进行反向字典序排序来确定的。\n\n例如，对于我们在场景 1 中看到的相同宏，[high_response_time]\
  \ 被定义并与可访问 WebApp 和 ITOpsApp 这两个应用的用户共享。\n\n在这种情况下，如果 WebApp 和 ITOpsApp 都有一个同名为\
  \ [high_response_time] 的宏，那么 WebApp 应用中的宏定义将优先于 ITOpsApp 应用中的定义。这种优先级由应用名称的反向字典序决定。\n\
  \n这意味着当 Splunk 解析 [high_response_time] 宏时，它会首先在 WebApp 应用中查找，如果在那里找到定义，就会使用该定义。如果在\
  \ WebApp 应用中未找到定义，那么 Splunk 将查找 ITOpsApp 应用：\n\n```\n## ITOpsApp 宏用于检查超过 2000 毫秒的请求响应时间\n\
  [high_response_time]\ndefinition = index=web_logs sourcetype=access_log response_time_ms>=2000\n\
  ```\n\n如果你对字典序和逆序感到好奇，Splunk Lantern 上有一篇非常好的文章进行了更详细的说明：https://tinyurl.com/22hjs8am。\n\
  \n为了避免手动检查每个配置文件中的每项设置以了解 Splunk 在运行时如何确定优先级，Splunk 提供了诸如 btool 命令和 REST API 接口等有用的工具。这些工具允许你轻松查看配置设置及其优先级。\n\
  \n然而，在深入了解这些工具之前，让我们先重点关注索引期间的优先级。\n\n## 索引时优先级\n\n索引时优先级指的是适用于整个系统整体的配置设置，而不是针对单个用户。这些设置在全局系统级别运行，并参与诸如在输入阶段索引数据和监控文件等活动。\n\
  \n在索引期间，各种配置文件都会发挥作用，包括 indexes.conf、server.conf、serverclass.conf 和 inputs.conf。这些文件包含影响索引活动执行方式、服务器配置方式以及数据输入监控方式的基本配置。\n\
  \n让我们了解这些组件：\n\n- `--debug`：此选项显示 conf 文件在系统、应用或用户目录中位置的绝对路径。与 `--debug` 选项类似，还有许多有用的选项。要查看完整列表，请执行以下命令\
  \ – `$SPLUNK_HOME/bin/splunk help btool`。\n- `--user`：此选项显示给定用户可见的配置数据。\n- `--app`：此选项显示给定应用可见的配置数据。\n\
  - `<conf_file_prefix>`：这指的是各种配置文件名中使用的前缀——例如，props、inputs、indexes 和 transforms。\n\
  \n让我们看一个针对 indexes.conf 文件使用 --debug 选项的 btool 命令示例：\n\n```\n./splunk btool indexes\
  \ list --debug\n```\n\n在给定的示例中，使用 btool 命令以调试模式列出索引。我们将获得以下输出——正如你在下图中看到的，indexes\
  \ list --debug 选项显示了 conf 文件的绝对路径以及与索引名称 _internal 关联的每项设置。\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_118_0.png)\n\
  \n图 6.3：indexes.conf 的 btool 命令结果\n\n另一个有用的 btool 命令是检查 conf 文件中是否有任何拼写错误。它通常在每次\
  \ Splunk 实例启动时运行。语法如下：\n\n```\n./splunk btool check\n```\n\n请记住关于 btool 的以下事实：\n\
  \n- btool 生成的输出可能无法反映已加载内存的当前状态。如果对配置文件进行了需要重启服务的更改，即使该更改尚未在活动系统状态中生效，btool 报告也可能反映此更改。\n\
  - btool 不受 Splunk 官方支持；但它非常强大且有用。在处理 Splunk 支持案例时，他们可能会要求提供 Splunk diag 报告，该报告包含\
  \ btool 报告输出。\n- 使用 btool 查看 inputs.conf 文件时，输出中不会显示 [default] 节中的设置。\n- 你可以在无需\
  \ Splunk 进程处于运行状态的情况下执行 btool 命令。\n\n## 自我评估\n\n你将获得 10 个问题和可供选择的答案。问题模式与我们在第 1\
  \ 章中讨论的相同。评估结束后，请参阅与你难以回答的问题相关的章节。或者，你也可以参阅 Splunk 文档。祝一切顺利！让我们开始吧。\n\n- 1. 哪个 conf\
  \ 文件是定义换行解析设置所必需的？\n  A. outputs.conf\n  B. line_breaker.conf\n  C. props.conf\n\
  \  D. server.conf\n\n- 2. 直接在文件系统上创建 conf 文件会自动重新加载 Splunk 配置吗？\n  A. 会\n  B. 不会\n\
  \n- 3. 如何在独立 Splunk 实例上重新加载 conf 文件更改？（选择所有适用项）：\n  A. 在 conf 文件末尾添加 restart = true\
  \ 设置。\n  B. 使用 debug/refresh 端点。\n  C. 重启 Splunk 实例。\n  D. 什么都不做——Splunk 会自动重新加载。\n\
  \n- 4. 作为数据管理员，你需要在通用转发器（UF）上的 /opt/splunkforwarder/etc/apps/MyApp 目录中调整名为 MyApp\
  \ 的应用的 INDEXED_EXTRACTIONS 设置。MyApp 默认在 default/ 目录下包含了 props.conf。你将采取什么行动？\n \
  \ A. 登录 UF 并更新 props.conf，因为该更改仅在单个主机上需要。\n  B. 登录 UF，在 MyApp 下创建 /local 目录，并使用所需设置创建\
  \ props.conf 文件。\n  C. 什么都不做——props.conf 解析在 UF 上不起作用。\n  D. 什么都不做——这是系统管理员的工作，所以通知系统管理员。\n\
  \n- 5. 你能确定 conf 文件可以在 Splunk 上创建或预存在的位置吗？其中 $SPLUNK_HOME = /opt/splunk？（选择所有适用项）：\n\
  \  A. 位置 – etc/apps/users/<user-name>/<app-name>/local/\n  B. 位置 – etc/apps/<app-name>/default/\n\
  \  C. 位置 - etc/apps/<app-name>/system/\n  D. 位置 - etc/system/default/\n  E. 位置 -\
  \ etc/system/local/\n\n6. 在搜索时和索引时，Splunk 会考虑哪些配置文件来确定优先级？（选择所有适用项）：\n\n- A. 搜索时\
  \ - savedsearches.conf、macros.conf 和 server.conf\n- B. 搜索时 - savedsearches.conf、macro.conf\
  \ 和 tags.conf\n- C. 索引时 - inputs.conf、server.conf、indexes.conf 和 savedsearches.conf\n\
  - D. 索引时 - inputs.conf、serverclass.conf、indexes.conf 和 server.conf\n\n7. 使用哪个 CLI\
  \ 命令来排查 conf 文件错误？（选择所有适用项）：\n\n- A. ./splunk check errors\n- B. ./splunk btool\
  \ check\n- C. ./splunk btool <conf-file-name> list --debug\n- D. ./splunk btool\
  \ check-typos\n\n8. 用户 A 具有 power user 角色，并在搜索应用下创建了一个具有私有权限的警报。它将被存储在 Splunk 上的什么位置？\n\
  \n- A. $SPLNUK_HOME/etc/users/local/\n- B. $SPLNUK_HOME/etc/apps/search/users\n\
  - C. $SPLNUK_HOME/etc/users/User-A/search/local\n- D. $SPLUNK_HOME/etc/users/search/local\n\
  \n9. 用户 A 具有 power user 角色，创建了一个警报，并与一个名为 search 的应用共享。它将被存储在 Splunk 上的什么位置？\n\n\
  - A. $SPLNUK_HOME/etc/users/search/local\n- B. $SPLNUK_HOME/etc/apps/search/local\n\
  - C. $SPLNUK_HOME/etc/apps/users/User-A/search/local/\n- D. $SPLUNK_HOME/etc/apps/search/default/\n\
  \n\n\n\n\n索引器并汇总从它们接收到的结果。然后将汇总后的结果呈现给用户。\n\n另一方面，索引器负责数据索引。它从搜索头接收搜索请求，并通过搜索索引数据来处理这些请求。索引器将相关结果（基于用户的搜索查询）返回给搜索头，搜索头随后进行汇总并将其呈现给用户。\n\
  \nSplunk 中的 **分布式搜索** 功能通过将搜索工作负载分发到多个索引器来实现可扩展性和性能优化。这使得搜索查询能够并行处理，从而加快搜索结果并提高资源利用率。\n\
  \n让我们探索 Splunk 在独立、非集群和集群部署中的分布式搜索的一些关键事实：\n\n- 独立的 Splunk 部署不使用分布式搜索。在独立部署中，整个搜索和索引功能由单个\
  \ Splunk 实例执行。\n- 要使用分布式搜索功能，Splunk 实例（搜索头和索引器）不需要在集群中。换句话说，集群是可选的。具有单个索引器和搜索头的简单部署也可以连接以使用此功能。参考图\
  \ 7.1。\n- 当您拥有中小型到大规模的 Splunk 部署且具有高数据量和搜索需求时，分布式搜索就会发挥作用。它允许您将搜索工作负载分发到多个 Splunk\
  \ 实例，这些实例可能在集群中，也可能不在集群中。\n- 在集群环境中，分布式搜索可以与集群结合使用以增强搜索功能。集群中的每个索引器都可以参与分布式搜索，从而使搜索查询能够在集群内的索引器之间分发。\n\
  \n例如，以下是一些使用分布式搜索功能的分布式部署类型：\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_124_0.png)\n\
  \n图 7.1：使用分布式搜索功能的分布式部署类型\n\n如需了解更多信息，请查看以下搜索头集群架构：\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_126_0.png)\n\
  \n图 7.2：搜索头集群架构\n\n在图 7.2 中，有一个由三个搜索头实例组成的集群。这些实例前面有一个负载均衡器，它在集群中的搜索头成员之间均匀分配负载。在搜索头实例中，其中一个被选为执行搜索头队长角色，负责协调集群内的各种任务。\n\
  \n搜索头队长实例处理诸如作业调度、配置复制、工件复制、警报跟踪以及在搜索头成员之间复制知识包等任务。然而，队长角色并非固定在特定实例上。相反，搜索头成员之间会进行持续的选举过程，以确定将接管队长角色的获胜成员。这确保了职责能够动态分配并根据需要重新分配。\n\
  \n如果有必要手动将队长身份从一个实例转移到另一个实例，可以通过 CLI 命令启动转移。这提供了对集群内队长分配的灵活性和控制。\n\n除了搜索头实例集群和队长功能外，所提供的设置还包括一个名为\
  \ **搜索头部署器** 的单独实例。搜索头部署器充当推送到搜索头集群的部署应用的集中枢纽，由管理员在需要时进行推送。\n\n搜索头部署器实例包含部署应用，这些应用是需要在搜索头集群中分发的配置、设置和自定义。这些应用可能包括保存的搜索、仪表板、报告、字段提取以及增强搜索头实例功能和自定义的其他对象。\n\
  \n管理员可以在搜索头部署器上对部署应用进行更改，然后将这些更改推送到搜索头集群。这种集中化方法简化了跨多个搜索头实例的配置管理和分发，确保在部署和维护应用时的一致性。\n\
  \n## 索引器集群\n\n索引器集群包含一组配置为作为索引器（搜索对等体）工作的 Splunk Enterprise 实例，它们共享相同的索引配置和应用。需要一个单独的实例来管理索引器集群活动；它被称为\
  \ **集群管理器**。\n\n当处理大量数据量和并发搜索查询时，索引器集群是满足高可用性、容错性和可扩展性需求所必需的。通过利用索引器集群，组织可以保证不间断的数据访问，减轻索引器故障的影响，并实现优化的数据索引和搜索性能。\n\
  \n索引器集群提供以下几个关键优势：\n\n- **数据可用性**：通过在多个索引器之间分发和复制数据，索引器集群可确保即使某个索引器宕机或不可用，数据仍然可访问。\n\
  - **数据恢复**：在索引器发生故障的情况下，集群在其他索引器上保留索引数据的副本。这种冗余使得在发出搜索请求时能够从剩余的索引器中自动检索相关数据。\n-\
  \ **数据保真度**：索引器集群通过在多个索引器之间复制和分发数据来维护数据保真度。这种复制策略可保护数据完整性和一致性，降低数据丢失风险，并确保索引数据保持准确可靠。\n\
  \n让我们了解索引器的搜索工作原理。当用户发出搜索查询时，搜索头会将查询分发到集群中的索引器。每个索引器在其本地存储中对其本地可搜索的数据副本执行本地搜索。然后搜索头汇总和合并来自所有索引器的结果以生成最终的搜索结果集。\n\
  \n### Tip\n\n如果不需要使用 Splunk Web 用户界面，Splunk 建议在索引器上禁用 Web 服务器。要禁用 Web 服务器，请在索引器上执行\
  \ ./splunk disable webserver CLI 命令。\n\n## 配置分布式搜索\n\n分布式搜索功能需要配置以建立从搜索头到索引器或搜索对等体的连接。从独立的搜索头和索引器架构到大规模的多站点集群设置，所有实现都使用分布式搜索功能。参考图\
  \ 7.2 中的部署类型，其中有三个搜索头组成集群，使分布式搜索能够与三个独立的索引器交互。索引器从各种来源接收数据，例如通用转发器、syslog 输入和用于索引的技术插件。以下是关于分布式搜索需要了解的几个基本要点：\n\
  \n- 搜索头预先配置为在用户请求时向搜索对等体发送查询。\n- 搜索头汇总参与搜索的对等体返回的结果。\n- 搜索头将结果呈现给用户。\n- 一个名为知识包复制的持续后台进程在搜索头队长上运行（您将在本章后面学习），它会不断与搜索对等体共享信息。在非集群搜索头环境中，独立的搜索头会将包与所有连接的搜索对等体共享。\n\
  - Splunk 建议为每个角色专门分配一个 Splunk Enterprise 实例，例如用于转发器管理的部署服务器、用于搜索头集群的搜索头部署器、用于许可的许可管理器以及用于整体部署监控的监控控制台。然而，在资源利用率较低的部署中，管理组件可以根据\
  \ https://tinyurl.com/26f9n5zf 提供的矩阵进行共置。\n\n### Tip\n\n在分布式部署中，最佳做法是避免在搜索头上本地索引内部日志并在搜索头上启用转发。因此，内部日志和汇总索引数据将集中存储在索引器上。\n\
  \n分布式搜索可以通过 Splunk Web、CLI 或直接修改 server.conf 和 distsearch.conf 文件进行配置。在下一节中，我们将学习通过\
  \ CLI 和 Splunk Web 方法将索引器添加到搜索头。\n\n\n\n\n要在搜索头上添加单站点集群索引器，请在搜索头的 $SPLUNK_HOME/bin\
  \ 目录下执行以下命令。幕后配置设置将被添加到 $SPLUNK_HOME/etc/system/local 目录下的 server.conf 文件中：\n\n\
  ```\n./splunk add cluster-manager <scheme>://<host>:<port> -secret <indexers-pass4symmkey>\
  \ -multisite false\n```\n\n对于每个集群管理器，都必须重复执行此命令。\n\n让我们看看此命令的各个要素：\n\n- `<scheme>://<cluster-manager-servername>:<management-port>`\
  \ 是集群管理器的详细信息\n- `<indexer-pass4symmkey>` 是索引器集群的 pass4SymmKey/机密/安全密钥\n\n举例来说，假设您之前已执行过添加集群管理器地址\
  \ SplunkManager01.example.com 的命令，则 server.conf 文件现在显示以下内容：\n\n```\n[clustering]\n\
  mode = searchhead\nmanager_uri = https://SplunkManager01.example.com:8089\npass4SymmKey=\
  \ encrypted-secreteast\n```\n\n如需更多选项（例如列出、编辑或删除集群管理器），您可以使用帮助命令。例如，在 $SPLUNK_HOME\
  \ 的 /bin 目录下执行 ./splunk help cluster-manager。\n\n同样，如果您想了解如何编辑和/或删除搜索服务器，可以按如下方式使用帮助命令：./splunk\
  \ help search-server。此操作应在 $SPLUNK_HOME 的 /bin 目录下完成。\n\n我们现在已经了解了如何在搜索头中同时包含集群和非集群索引器，以配置分布式搜索。接下来，下一节将指导我们使用\
  \ Splunk Web 界面配置分布式搜索的过程。\n\n## Splunk Web\n\n使用 Splunk Web，我们可以创建与上一节中使用 CLI 所做的相同配置。让我们看看图\
  \ 7.3 中的菜单选项。\n\n以管理员用户身份登录 Splunk Web，导航到右上角的“设置”并单击它。然后，您将在“分布式环境”下找到以下菜单项：\n\n\
  图 7.4 包含以下文本字段：对等 URI（peer-URI:mgmt_port 格式）、远程用户名和远程密码，您可以在其中手动输入需要添加到搜索头的索引器的详细信息。填写这些字段并单击“保存”。对于每个搜索对等体，重复图\
  \ 7.3 和图 7.4 中所示的相同步骤，将它们添加到搜索头。\n\n在下一节中，我们将向搜索头添加集群索引器。\n\n## 添加集群索引器\n\n在 Splunk\
  \ Web 中，单击“设置”菜单，然后单击“索引器集群”，如图 7.3 所示，这将打开一个新页面，其中包含“启用索引器集群”按钮。单击该按钮并选择“搜索头节点”单选按钮，如图\
  \ 7.5 所示。\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_133_0.png)\n\n图 7.5：分布式搜索\
  \ – 在搜索头上启用集群\n\n图 7.5 显示了在搜索头上启用索引器集群的选项。最后，单击“下一步”按钮。将打开一个表单，如图 7.6 所示。\n\n- 要查看知识包中包含的允许配置的完整列表，请参阅搜索头的\
  \ distsearch.conf 文件中的 [replicationAllowlist] 和 [replicationSettings:refineConf]。要检查包复制状态，可以在搜索头上执行\
  \ splunk show bundle-replication-status 命令，或者使用监控控制台，其搜索菜单下有一个仪表板。\n\n如果公共知识包版本无法在所有搜索对等体之间复制，可能会导致搜索暂时中断。当搜索进程尝试跨对等体同步知识包时，可能会暂停几秒钟。如果建立公共包失败，搜索进程最终将放弃并继续，而不会实现同步。在这种情况下，Splunk\
  \ 管理员将采取必要措施，识别缓慢的搜索对等体并将其隔离在搜索头上，以防止该对等体参与未来的搜索。隔离后，搜索对等体确保已正在运行的搜索完成。隔离操作仅暂停向该对等体复制知识包。\n\
  \n可以通过 Splunk Web 单击“设置 | 分布式搜索 | 搜索对等体”来实现隔离。也可以通过 CLI 完成。成功恢复后，请解除对该对等体的隔离，以便其参与未来的搜索。\n\
  \n以下是 CLI 隔离和解除隔离命令：\n\n```\n./splunk edit search-server -auth <user>:<password>\
  \ <host>:<port> -action [quarantine|unquarantine]\n```\n\n让我们更详细地了解一下：\n\n- <user>:<password>\
  \ 是搜索头的管理员级凭据\n- <host>:<port> 是搜索对等体的主机和管理端口\n- -action 的值为 quarantine 或 unquarantine\n\
  \n最后总结一下；知识包是一个存档文件，由搜索头通过后台复制过程与搜索对等体共享。知识包包含知识对象，搜索对等体在将搜索结果返回给搜索头之前会将这些知识对象应用于搜索结果。默认情况下，包大小限制适用，为了减小其大小，可以将某些知识对象添加到搜索头的\
  \ replicationDenyList 设置中。要暂停向特定对等体复制包，可以隔离该搜索对等体。\n\n让我们在下一节中总结我们所学到的内容。\n\n3.\
  \ 在搜索头集群中，搜索头首领组件是否是必需的？\nA. 是\nB. 否\n\n4. 您被分配到一个关键项目，其中配置了搜索头集群来搜索多个非集群索引器。这是否利用了分布式搜索概念？\n\
  A. 是\nB. 否\n\n5. 找出搜索头上包含索引器详细信息的配置文件。\nA. serverclass.conf\nB. server.conf\nC.\
  \ distsearch.conf\nD. distributedpeers.conf\n\n6. 知识包包含什么？（选择所有适用项。）\nA. 用户、知识对象和应用\n\
  B. 知识对象，如事件类型、标签和已保存搜索\nC. Splunk 二进制文件\nD. 有关搜索过程的 Splunk 内部日志\n\n7. 知识包的默认复制策略是什么？\n\
  A. 级联\nB. RFS\nC. 经典\nD. 挂载\n\n8. 知识包已经变得太大，超过了 maxBundleSize。您是一名系统管理员；您会怎么做？\n\
  A. 增加 maxBundleSize\nB. 从搜索头删除较大的应用\nC. 将不需要的文件/应用添加到 replicationDenyList\nD. 什么都不做；搜索头仅共享\
  \ .delta 文件\n"
- "# 第 2 部分：\nSplunk 数据管理\n\n本 Splunk 9.x Enterprise 认证管理员指南的第 2 部分深入探讨 Splunk 数据管理的世界。它将使您具备高效地将数据导入\
  \ Splunk、配置数据输入、执行解析和转换、提取有意义的字段以及使用查找来增强数据所需的技能。自评估模拟考试确保您可以有效地应用所学知识。\n\n此部分包含以下章节：\n\
  \n- 第 8 章，数据导入\n- 第 9 章，配置 Splunk 数据输入\n- 第 10 章，数据解析与转换\n- 第 11 章，字段提取与查找\n- 第\
  \ 12 章，自评估模拟考试\n\n如果您想深入了解这些阶段的详细概述，以及队列和管道，请查看 https://tinyurl.com/bdzb cetp。请注意，这对于认证考试来说完全是可选的。\n\
  \n我们现在已经研究了主要的数据摄取阶段和元数据字段。接下来，我们将探索 Splunk Web 中可用的 Splunk Enterprise 的“添加数据”功能。\n\
  \n## Splunk Web – 添加数据功能\n\n“添加数据”功能位于 Splunk Web 的“设置”菜单下。只需打开此菜单并单击“添加数据”，如图 8.3\
  \ 所示。\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_149_0.png)\n\n图 8.3：Splunk Web\
  \ – 添加数据\n\n单击“添加数据”将打开一个新的网页，提供三种将数据导入 Splunk 的方法，如图 8.4 所示。\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_149_1.png)\n\
  \n图 8.4：将数据导入 Splunk 的方法\n\n\n\n\n\n如你所见，第一种方法是一次性的**上传**方法，用于将数据一次性添加到 Splunk。上传的最大文件大小为\
  \ 500 MB。\n\n第二个**监视**选项通过监视安装 Splunk 的机器上的文件和端口来获取数据。此方法允许使用多种数据输入选项，例如将实例转换为 HEC\
  \ 接收器、启用网络端口监听 TCP/UDP 流量，以及配置脚本按定义的时间间隔从 API 拉取数据负载。\n\n上图中的第三个选项是**转发**，它专为 Splunk\
  \ Enterprise 的单实例部署而设计，此时 Splunk 实例同时充当索引器和部署服务器。选择**转发**选项时，你可以从已连接的转发器客户端列表中进行选择。后续步骤允许你配置可在转发器上设置的具体数据输入。\n\
  \n让我们快速了解一下**上传**选项。**上传**选项是一个有用的功能，可用于快速测试数据样本并识别事件换行。它允许你将数据文件上传到 Splunk 进行分析，从而识别数据中事件是如何被分解的。这在排查问题以及在进行输入或解析设置之前理解数据结构时尤其有帮助。在此过程中，你还可以从合适的预训练源类型中进行选择，并可通过修改\
  \ `<Key> = <value>` 设置并观察结果来实时自定义源类型。\n\n出于演示目的，我使用以下访问日志信息，将其保存到本地系统并命名为 web-access.log。文件内容如下：\n\
  \n```\n127.0.0.1 - - [23/Apr/2023:10:28:12 -0400] \"GET /index.html HTTP/1.1\" 200\
  \ 1240\n127.0.0.1 - - [23/Apr/2023:10:28:13 -0400] \"GET /styles.css HTTP/1.1\"\
  \ 200 876\n127.0.0.1 - - [23/Apr/2023:10:28:15 -0400] \"GET /scripts.js HTTP/1.1\"\
  \ 200 432\n192.168.0.1 - - [23/Apr/2023:10:28:17 -0400] \"GET /images/logo.png HTTP/1.1\"\
  \ 200 34012\n192.168.0.1 - - [23/Apr/2023:10:28:19 -0400] \"GET /about.html HTTP/1.1\"\
  \ 404 345\n127.0.0.1 - - [23/Apr/2023:10:28:21 -0400] \"GET /contact.html HTTP/1.1\"\
  \ 200 2089\n```\n\n现在，让我们点击*图 8.4* 中显示的**上传**按钮。这将打开一个带有**选择文件**按钮的**选择源**网页。点击该按钮并从本地系统上传\
  \ web-access.log 文件。然后你将进入*图 8.5* 所示的**设置源类型**页面。\n\n*图 8.5：添加数据 – 设置源类型*\n\n图 8.5\
  \ 有三个主要部分需要查看。\n\n在左侧，你可以看到我选择了源类型：access_combined。这是一种预训练的源类型，非常适合访问日志的结构。在右侧，显示了一个事件列表及其检测到的时间戳。要查看源类型配置设置，请展开高级部分，其中显示\
  \ CHARSET、TIME_PREFIX、LINE_BREAKER 等及其对应的值。\n\n点击下一步按钮将进入输入设置。此页面用于设置主机和索引元数据字段，或将其保留为默认值。继续并点击审查按钮以查看元数据字段信息的摘要（见图\
  \ 8.6）。如果你对详细信息满意，则点击提交；否则，点击返回并编辑必要的部分。\n\n*图 8.6：添加数据 – 审查阶段*\n\n如果一切顺利，点击**提交**按钮将把上传的\
  \ `web-access.log` 文件索引到你的 Splunk 实例上，并在下一页显示**文件已成功上传**的消息。此页面还提供许多其他选项，包括**开始搜索**、**提取字段**和**添加更多数据**。点击**开始搜索**按钮将打开搜索应用并显示上传的\
  \ `web-access.log` 文件事件。\n\n让我们结束本章并回顾一下目前学到的内容摘要。\n\n## 摘要\n\n本书*第 2 部分*的第一章旨在帮助你开始使用\
  \ Splunk 数据管理。我们首先介绍了数据输入类型，包括基于文件的、网络、无代理（HEC）和基于脚本的选项。还有一种特殊类型的输入，可以通过从 https://splunkbase.com\
  \ 获取的 TA 进行安装。我们还了解到，这些输入要么通过创建 `inputs.conf` 文件，要么通过 Splunk CLI 进行配置。\n\n之后，我们了解了\
  \ Splunk 分配的默认元数据字段及其在搜索数据时的重要性。`sourcetype` 字段在 Splunk 中起着至关重要的作用，因为它有助于按源类型对数据进行分类和归类。Splunk\
  \ 使用预训练的源类型列表，如果在输入阶段未指定 sourcetype，则会自动检测并分配适当的 sourcetype。`sourcetype` 定义在 `props.conf`\
  \ 文件中配置，数据管理员根据所处理的数据类型创建自定义定义。`sourcetype` 配置包含重要设置，如换行边界、时间戳提取和字符集编码。这些设置在输入、解析和索引阶段应用，我们已对这些阶段进行了简要了解。\n\
  \nSplunk Web 的**添加数据**功能是通过上传少量数据并应用 sourcetype 设置来测试数据输入的绝佳方式。我们了解了将访问日志数据文件上传到\
  \ Splunk 实例所涉及的步骤。我们还了解了添加数据功能如何通过转发器以及监视 Splunk 实例上的本地文件来提供其他索引数据的方式。\n\n在下一章中，我们将深入探讨本章开头简要介绍的\
  \ Splunk 数据输入。\n\n## 自我评估\n\n本节提供的问题和选项与认证考试中的问题模式相似。如果你在回答任何问题时遇到困难，请随时重新阅读本章中的相应部分。祝你好运！\n\
  \n- 1. 选择数据索引阶段（选择所有适用项）。\n  - A. 索引\n  - B. 解析\n  - C. 输入\n  - D. 摄取\n\n- 2. 哪个阶段涉及数据收集并包含各种用于索引的数据输入选项？\n\
  \  - A. 解析\n  - B. 输入\n  - C. 摄取\n  - D. 索引\n\n- 3. 在哪个阶段计算许可证？\n  - A. 输入\n  -\
  \ B. 解析\n  - C. 索引\n  - D. 摄取\n\n- 4. 你是一名数据管理员，正在处理存储在运行最新版本 Linux 操作系统的源系统文件中的数据。你会选择以下哪种\
  \ Splunk 数据输入方法？\n  - A. 编写脚本监视文件并将其直接转发到索引器\n  - B. 安装 UF 并配置基于文件的监视\n  - C. 将文件传输到\
  \ FTP，索引器轮询要摄取的文件\n  - D. 编写脚本读取每一行并将其发送到 HEC\n\n- 5. Splunk 中哪种数据输入类型公开 RESTful\
  \ API 以接受数据进行索引？\n  - A. 网络数据输入通过 API 发送事件\n  - B. HEC 公开 RESTful API 以进行数据索引\n\
  \  - C. 脚本化输入集成 Splunk RESTful 数据输入 API\n  - D. 文件监视可以读取 RESTful API 并与之集成以进行索引\n\
  \n- 6. 识别元数据字段。（选择所有适用项）\n  - A. time\n  - B. host\n  - C. sourcetype\n  - D. source\n\
  \  - E. index\n\n- 7. 在索引数据时，是否可以在后续阶段覆盖输入阶段设置的元数据字段？\n  - A. 可以\n  - B. 不可以\n\n\
  - 8. 一旦在输入阶段设置了索引，就无法覆盖。正确还是错误？\n  - A. 错误\n  - B. 正确\n\n- 9. Splunk 的哪个功能允许你通过上传数据样本测试\
  \ sourcetype 设置？\n  - A. 添加数据\n  - B. 上传数据\n  - C. 批量上传\n  - D. 输入数据\n\n- 10. 哪个官方网站包含由\
  \ Splunk 构建的加载项和应用？\n  - A. splunkapps.com\n  - B. splunkbase.com\n  - C. splunkappstore.com\n\
  \  - D. splunkappaddon.com\n\n\n\n\n\n安装完成后，以管理员身份登录到 *第 1 章* 的 *独立* 部分中安装的 Splunk\
  \ Enterprise 实例。登录后，导航到 **设置 | 转发和接收 | 配置接收 | 新接收端口**，然后在监听端口字段中输入 9997，并单击 **保存**。\n\
  \n然后，配置 UF 以连接到接收索引器（在本例中为 Splunk Enterprise），可以通过直接编辑 `outputs.conf` 文件或通过命令行进行配置，就像我们在\
  \ *第 4 章 Splunk Forwarder 管理* 的 *配置转发* 部分中所看到的那样。有关更多详细信息，您可以参考 Splunk 文档：https://tinyurl.com/2p8h9nuc。\n\
  \n下图详细说明了我们试图创建的 UF 和索引器（Splunk Enterprise 实例）设置。\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_158_0.png)\n\
  \n图 9.1：UF 将日志发送到接收索引器\n\n太好了！您现在有一个 UF 代理，可以为您配置输入。让我们从文件和目录监控数据输入开始。\n\n## 文件和目录监控\n\
  \n顾名思义，此输入类型监控数据文件及其存储的目录。这是引入数据最有效的方式，也是 Splunk 推荐的处理文件最佳方法之一。监控设置在 `inputs.conf`\
  \ 文件中配置。要启用此输入，需要在源机器上安装 UF 代理，相同的设置也适用于 **重型转发器 (HFs)** 和 Splunk Enterprise。让我们来看一下此输入类型的显著特点：\n\
  \n- 适用于所有基于文本的文件，包括结构化格式（XML、CSV、JSON 等）和 .gzip 压缩文件。\n- 通过在 `$SPLUNK_HOME/var/lib/splunk/`\
  \ 下的 `fishbucket` 目录中维护的检查点来跟踪正在监控的文件。\n- 在转发器重启的情况下，从上次位置恢复文件和目录监控。\n- 递归发现目录中的所有文件，包括新创建的文件。\n\
  \n在网络问题或索引器不可用的情况下，我们可以通过设置 `queueSize` 和 `persistentQueueSize` 来防止数据丢失。`queueSize`\
  \ 设置指的是在转发器上的输出队列空闲之前保存数据的内存队列。`persistentQueueSize` 设置可在内存队列已满时启用将数据存储到磁盘。`persistentQueueSize`\
  \ 必须大于 `queueSize`。数据将写入转发器上的 `$SPLUNK_HOME/var/run/splunk/` 目录。\n\nUDP 输入规范与 TCP\
  \ 相同，只是它监听 UDP 端口——其余设置和语法保持不变。UDP 的 `inputs.conf` 配置示例如下：\n\n```\n# inputs.conf\
  \ listening on UDP port 514\n[udp://514]\nconnection_host = ip\nacceptFrom = 192.0.2.10,\
  \ !external.example.host.com\nindex = main\nsourcetype = access_common\nqueueSize\
  \ = 1MB\npersistentQueueSize = 100MB\n```\n\n网络输入在 *nix 和 Windows 主机上可能存在限制，因为它们需要访问某些端口以监听\
  \ TCP/UDP。您可以自行尝试在 UF/Splunk Enterprise 实例上配置这些输入并检查端口的监听状态（在 Linux 和 Windows 主机上使用\
  \ `netstat` 命令）。\n\n我们已到达网络输入部分的末尾。在下一节中，我们将介绍脚本化输入的配置。\n\n## 讨论脚本化输入\n\n脚本化输入对于索引无法通过文件/目录监控或使用网络输入监控的瞬态/临时数据非常有用。脚本化输入从瞬态源收集数据，然后将收集到的数据写入文件或直接转发到索引器。让我们了解一下有关此输入类型的一些事实：\n\
  \n- 脚本化输入需要 UF 代理或 Splunk Enterprise 实例（HF）来执行脚本。\n- 可以从瞬态源收集数据，例如操作系统命令。`top`、`vmstat`、`netstat`\
  \ 和 `iostat` 命令都利用这种类型的输入，该输入在可从 http://splunkbase.splunk.com 下载的 Splunk Unix 和\
  \ Linux 插件中配置。Windows **技术插件 (TA)** 依赖于此输入类型来收集 Windows **活动目录 (AD)** 日志、注册表日志、WinEventLogs\
  \ 等。也可以使用脚本从远程 API 拉取日志。\n- 支持流行的脚本类型，包括 `.py`（Python）、`.sh`（shell）、`.ps1`（PowerShell）和\
  \ `.bat`（Windows 批处理）。\n- 脚本化输入必须安排在特定间隔运行。脚本运行的频率通过指定以秒为单位的间隔数或设置 cron 表达式来设置。\n\
  - Splunk Enterprise 和 UF 将脚本执行消息记录在本地 splunkd.log 文件中。您可以在 _internal 索引中访问这些日志。\n\
  - 脚本化输入可通过 Splunk Web 中的 设置 | 数据输入 | 脚本 菜单进行配置。另一种选择是在 inputs.conf 文件中创建它们，可选择将其打包到应用程序中，并使用部署服务器将其部署到转发器。参考第\
  \ 4 章，Splunk Forwarder 管理。\n\n考虑以下脚本化输入规范：\n\n```\n# inputs.conf scripted input\
  \ settings\n[script://<script path or cmd>]\nsource = <source to set>\nsourcetype\
  \ = <sourcetype to set>\nindex = <index name to forward logs>\ninterval = <in seconds.\
  \ default 60 sec or cron expression. Set -1 to run once, 0 to continuously>\npassAuth\
  \ = <username to run the script as the OS user>\nqueueSize = <in-memory queue size>\n\
  persistentQueueSize = <queue to store on disk when in-memory is full>\n```\n\n前述规范的节名称以\
  \ script:// 为前缀，后跟通常的通用元数据字段 source、sourcetype 和 index，以及队列设置。特定于脚本化输入的设置是 interval\
  \ 和身份验证信息。\n\ninterval 设置安排脚本每 x 秒运行一次。如果此处未指定任何内容，脚本将默认安排每分钟运行一次。或者，我们可以指定 cron\
  \ 表达式。\n\nqueueSize 和 persistentQueueSize 的工作原理与 处理网络数据输入 部分中解释的类似——在索引器不可用的情况下，这两个设置都会将脚本生成的数据保存在内存和磁盘中。\n\
  \npassAuth 设置可确保脚本由分配的用户名运行，通过为该用户创建身份验证令牌。在 Splunk 中设置脚本化输入之前，您需要创建脚本并确保它位于 Splunk\
  \ 可以访问的文件系统路径中。然后 [script://<script path>] 节将能够从该指定位置执行脚本。出于安全原因，脚本必须放在以下位置之一：\n\
  \n- $SPLUNK_HOME/etc/apps/<app name>/bin\n- $SPLUNK_HOME/etc/system/bin\n- $SPLUNK_HOME/bin/scripts\n\
  \n但是，对于具有 .path 扩展名的脚本存在一个例外，它可以引用主机上任何位置的脚本（.py、.sh、.ps1 和 .bat）。.path 脚本文件本身必须位于上述位置之一，但它引用的脚本可以位于这些目录之外。\n\
  \n让我们看一下以下调用 *nix top 命令以获取进程信息的脚本化输入。在这里，脚本路径相对于 inputs.conf 文件。脚本具有 .sh 扩展名，并安排每\
  \ 60 秒运行一次。sourcetype 和 source 都设置为 top。此脚本生成的日志将被转发到名为 os（代表操作系统）的自定义索引：\n\n```\n\
  [script://./bin/top.sh]\ninterval = 60\nsourcetype = top\nsource = top\nindex =\
  \ os\ndisabled = 0\n```\n\n如果您想参考更多此类示例，请从 https://splunkbase.splunk.com/app/833\
  \ 下载 Splunk_TA_nix 插件并检查 /default/inputs.conf 和 /bin 目录。\n\n> **提示**\n> 最佳做法是将脚本放在靠近\
  \ inputs.conf 文件的位置。例如，如果文件位于 $SPLUNK_HOME/etc/system/local/ 目录中，则将脚本放在 $SPLUNK_HOME/etc/system/bin/\
  \ 目录中。同样，如果 inputs.conf 位于 $SPLUNK_HOME/etc/apps/<app name>/local 目录中，则将脚本放在 $SPLUNK_HOME/etc/apps/<app\
  \ name>/bin 目录中。\n\n就目前而言，关于脚本化输入的内容就这些——尝试从 Splunkbase 安装一个使用脚本化输入的插件来测试此功能。在下一节中，我们将介绍\
  \ HEC 输入。\n\n## 了解 HEC 输入\n\nHEC 是一种无代理输入类型，不需要在源机器上安装转发器。此输入类型适用于能够通过 HTTP(S) 发送事件的源，例如通过\
  \ JavaScript 库的 Web 应用、移动应用和自动化脚本。HEC 在 Splunk Enterprise 实例上公开 RESTful API 端点以接受用于索引的数据。该实例可以在分布式部署中为\
  \ HF/索引器。让我们来看一下 HEC 输入的关键事实：\n\n- HEC 默认在 Splunk 实例上处于禁用状态，用户必须手动启用它才能开始使用。它可以通过在多个\
  \ Splunk 实例上配置它并选择性地在前面使用负载均衡器来进行扩展。\n\n\n\n\n- 对 HEC API 的身份验证是通过源发送的 HTTP 请求中提供的令牌来完成的。令牌配置由管理员设置，并与应用程序/源团队共享，以便他们发送事件。\n\
  - HEC 提供了两个重要的 RESTful 端点用于数据索引——一个用于访问仅限 JSON 格式的事件，另一个用于接受任何原始类型的数据。JSON RESTful\
  \ 端点专为接受仅以 JSON 格式化的数据而设计。在向此端点发送数据时，应确保载荷（数据）以 JSON 结构正确格式化，并根据需要包含额外的元数据字段。封装在\
  \ JSON 载荷中的原始数据事件可以是原始事件。\n- 为每个应用程序/源创建的每个令牌都必须是唯一标识符。最佳实践是使用 32 个字符的**全局唯一标识符（GUID）**作为令牌，例如\
  \ `CD1E753F-5BB2-4F5C-AE22-FE0381A0D916`。源应用程序在将事件作为载荷发送到收集器端点时，会在 HTTP 请求中提供此令牌。\n\
  - HEC 会自动解析接收到的 JSON 事件，因为其事件时间戳和其他元数据遵循预定义的结构。对于原始数据，如果包含时间戳，则应用断行策略；或者，可以在 `props.conf`\
  \ 中配置 `sourcetype` 设置，以相应覆盖此行为。\n- HEC 通过 `useAck` 索引器确认设置提供事件索引确认功能。索引器确认在节级别为单个令牌启用；一个单独的端点提供事件索引的状态。\n\
  - 要允许/限制某些地址通过 HEC 发送数据，可以在 `inputs.conf` 文件的 `[http]` 节级别配置 `acceptFrom` 设置。\n\n\
  ## 配置 HEC\n\n现在，我们将逐步完成配置 HEC 的过程。\n\n**步骤 1：** 让我们为通过 HEC 发送数据做好准备。第一步是在 Splunk\
  \ Web 中启用 HEC。导航至 **设置 | 数据输入 | HTTP 事件收集器**，然后点击右上角的**全局设置**按钮。这将打开一个包含**所有令牌**选项的表单。将此选项设置为**已启用**，然后点击**保存**。\n\
  \n在**全局设置**中启用 HEC 时，您应该已经注意到几件事，其中之一是**启用 SSL** 默认处于选中状态，另一件事是收集器端点监听接收事件的 HTTP\
  \ 端口号是 8088。\n\nHEC 全局设置也可以通过 `[http]` 节进行配置，该节默认位于 `$SPLUNK_HOME/etc/apps/splunk_httpinput/default/inputs.conf`。要使用此方法启用\
  \ HEC，请将以下设置添加到 `$SPLUNK_HOME/etc/apps/splunk_httpinput/`\n\n- https://<splunk-hostname>:8088/services/collector/ack：用于查询事件索引状态。它适用于已启用索引器确认的令牌。\n\
  - 完整列表可在 https://tinyurl.com/j53xmynj 获取。\n\n为了展示如何向这些 HEC 端点发送数据，我们将在 Linux 环境中使用\
  \ curl 命令。我们可以看到有两个标头值——一个带有承载令牌值的 Authorization，另一个带有特定于客户端的唯一 GUID 的 X-Splunk-Request-Channel。\n\
  \n这里我们以 JSON 格式的载荷发送数据——一个收集器/事件请求：\n\n```\ncurl -k -H \"Authorization: Splunk 09776ade-cf23-42c0-9138-89ad8388516a\"\
  \ -H \"X-Splunk-Request-Channel: FE0ECFAD-13D5-401B-847D-77833BD77131\" https://mysplunk.example.com:8088/services/collector/event\
  \ -d '{\"sourcetype\": \"signaling_data\", \"event\": \"stable signal!\"}'\n```\n\
  \n以下是收集器/事件响应：\n\n```\n{\"text\":\"Success\",\"code\":0,\"ackId\":0}\n```\n\n这里我们以原始事件发送数据——一个收集器/原始请求：\n\
  \n```\ncurl -k -H \"Authorization: Splunk 09776ade-cf23-42c0-9138-89ad8388516a\"\
  \ -H \"X-Splunk-Request-Channel: FE0ECFAD-13D5-401B-847D-77833BD77131\" https://mysplunk.example.com:8088/services/collector/raw\
  \ -d 'stable signal!'\n```\n\n我们得到如下收集器/原始响应：\n\n```\n{\"text\":\"Success\",\"code\"\
  :0,\"ackId\":1}\n```\n\n由于我们在令牌级别设置了 useACK = 1（true），客户端必须在发送给 HEC 的请求中携带唯一的通道标识符。作为回报，客户端会收到\
  \ HEC 以 JSON 格式返回的 ackID（请参阅前面收集器/原始事件示例中的响应载荷）。客户端进一步使用这些 ack 查询 HEC 的 /ack 端点，以了解事件索引状态，如下所示。\n\
  \n查找事件索引状态——/ack 端点请求——需要前面两个 JSON 和原始事件请求中返回给客户端的通道标识符和 ack：\n\n```\ncurl -H \"\
  Authorization: Splunk 09776ade-cf23-42c0-9138-89ad8388516a\" -H \"X-Splunk-Request-Channel:\
  \ FE0ECFAD-13D5-401B-847D-77833BD77131\" https://mysplunk.example.com:8088/services/collector/ack\
  \ -d '{\"acks\":[0,1]}'\n```\n\n上述 ack 端点请求的 JSON 响应载荷如下所示：\n`{\"acks\": {\"0\"\
  : true, \"1\": false}}` — 其中，`true` 表示索引成功，`false` 表示该事件索引失败。一旦特定事件的 `acks` 返回 `true`，其索引状态将从内存中消失，如果客户端之后再次发送请求，它将返回\
  \ `false`。\n\n我们已经讲完了 HEC 输入——它很有技术含量，不是吗？不要被这些技术术语所困扰。您需要记住，将 HEC 视为一个普通的 API，每个请求都需要提供令牌进行身份验证。索引器确认本质上与包裹投递跟踪功能相同——例如，您下单后（比如通过\
  \ `/raw` 或 `/events` 端点），您会得到一个跟踪号（`ackID`），然后在门户（`/ack` 端点）中输入跟踪号（`acks`），即可跟踪包裹的位置。最后，在送达后，您会从跟踪门户收到一个*成功送达*状态。\n\
  \n在下一节中，我们将介绍 Windows 输入。\n\n## 探索 Windows 输入\n\n到目前为止，我们介绍过的输入类型既不针对特定技术，也不针对特定操作系统。但正如其名称所示，Windows\
  \ 输入仅适用于 Windows 主机。主机至少需要 UF 或 Splunk Enterprise 实例才能收集 Windows 特定的日志。Windows 原生日志以二进制格式存储，Windows\
  \ 输入通过与操作系统 API 交互来获取这些日志。\n\n在 Windows 主机上安装 UF 时，您可以选择启用 Windows 输入。对于 Splunk\
  \ Enterprise 实例，可以通过 Splunk Web 中的**设置 | 数据输入**，然后选择**本地事件日志收集**和**远程事件日志收集**来配置\
  \ Windows 输入。远程事件日志收集需要 Windows 域帐户才能从远程主机收集日志。\n\n在已配置 UF 的大规模 Windows 主机环境中，使用部署服务器集中管理输入。在应用程序中创建并配置\
  \ `inputs.conf`。将应用程序部署到转发器，以实现高效且集中的输入配置。让我们了解一些关于 Windows 输入的关键事实：\n\n- Windows\
  \ 输入能够收集 Windows 事件、AD、性能监控、注册表、打印机、主机和网络日志。\n- **Windows 管理规范（WMI）** 用于从网络中的远程主机收集事件日志，通常在具有域帐户的\
  \ Windows 服务器上。\n- 远程事件日志收集在 `wmi.conf` 文件中配置。完整规范可在 `https://tinyurl.com/37mdekpe`\
  \ 获取。\n- 启用 Windows 日志可能会导致数据量显著增加，可能消耗我们 Enterprise 许可证的很大一部分。Splunk 提供了两个设置，`whitelist`\
  \ 和 `blacklist`，用于在不需要的事件日志被索引之前过滤掉它们。这有助于减少许可证使用量，并仅索引所需事件。\n\n\n\n\n最后，我们考察了 HEC\
  \ 和 Windows 输入类型。HEC 为 JSON 格式和原始事件以及索引状态查询提供了 RESTful API。我们了解到 HEC 默认是禁用的，并通过逐步操作（从启用\
  \ HEC 到通过 API 发送数据）进行了实践。最后我们介绍了 Windows 输入，它专为仅限 Windows 的主机设计，用于在本地和远程收集各种日志事件。\n\
  \n请注意，在所有输入类型中，HEC 不需要在源机器上安装转发器，因此它也被称为无代理输入。HEC 可以在 Splunk Enterprise 实例（如 HF）上启用，也可以在分布式部署中的索引器上启用，以接收来自应用程序客户端的日志事件。文件和目录监控、脚本化输入以及\
  \ Windows 输入至少需要在源主机上安装 UF。网络输入可以在 UF 和 Splunk 实例（通常是 HF）上启用。\n\n本章讨论了输入收集阶段，这是第\
  \ 8 章“数据接入”中概述的第一阶段。在接下来的章节中，我们将深入探讨解析阶段，该阶段涉及处理通过这些数据输入收集到的数据。\n\n现在是时候通过回答以下关于本章所涵盖数据输入主题的问题来测试你的知识了。\n\
  \n### 自我评估\n\n1. 选择 Splunk 默认提供的常用数据输入类型。（选择所有适用项）：\n   - A. 二进制文件监控\n   - B. 文件和目录监控\n\
  \   - C. 网络数据输入\n   - D. 脚本化输入\n   - E. 网络端口监控\n\n2. 你即将配置一个文件监控输入，并注意到该目录包含五年以上的数据，这些数据无需建立索引。哪个设置用于强制转发器忽略旧文件？\n\
  \   - A. skipHistoricalFiles\n   - B. ignoreOldData\n   - C. ignoreOlderThan\n \
  \  - D. deletePastData\n"
- '# 10 数据解析与转换


  数据旅程的第一阶段是输入阶段，我们在第 9 章“配置 Splunk 数据输入”中已详细讨论。数据解析是第二阶段，之后数据被索引到磁盘上。本章讨论解析阶段，该阶段紧随输入阶段之后，并以将数据交给索引阶段进行存储和搜索准备而结束。


  可能产生的问题是，既然所有数据都已经收集完毕，元数据字段已在输入阶段设置，最终数据被转发到索引器进行索引，那么解析阶段有什么必要呢？解析阶段的主要特性包括：将整个数据流拆分为单个事件，提取并应用时间戳，为单个事件设置元数据字段，在索引前操作元数据，以及根据需要转换数据。在输入阶段，诸如索引、主机、源类型、来源和字符集等元数据字段应用于整个数据，而非单个事件。数据流作为一个整体被处理，在输入阶段不进行换行拆分或时间戳提取。


  事件在解析阶段被转换。示例用例可能包括覆盖源类型、主机元数据、将数据路由到不同的索引、提取索引时字段，以及屏蔽或匿名化敏感信息，如个人身份信息（PII）、银行账户、社会安全号码（SSN）和电话号码。


  在本章中，我们将通过应用 props.conf 和 transforms.conf 文件来学习解析和转换设置。作为 Splunk 数据管理员，了解此阶段对于在数据接入时或之后的某个时间点可能出现的用例应用正确解决方案至关重要。例如，你可能会被要求屏蔽信用卡信息、覆盖源类型、更改事件拆分边界，或将特定事件完全重新路由到不同的索引。我们将在本章中学习以下主题：


  - 理解解析阶段

  - 解析阶段设置 – props.conf


  再举一个例子，当你针对特定来源（如 /var/log/web-server/access.log）将 TRUNCATE 设置为 1000 时，这意味着与该来源模式匹配的数据中的任何行都将被截断为最大长度
  1,000 字节。将 TRUNCATE 设置为 1000 会限制匹配指定模式的来源的最大行长度（以字节为单位）：


  ```

  [source::/var/log/web-server/access.log]

  TRUNCATE = 1000

  ```


  - **主机字段：** [host::<主机或主机模式>] 节适用于为来自给定主机或主机模式的数据定义自定义配置设置。这些设置可能涉及数据格式化、提取规则以及根据
  props.conf 规范在解析阶段的其他许多内容：


  ```

  [host::< host or host pattern >]

  <key> = <value>

  ```


  例如，当你针对特定主机名（如 myhost.com）将 TRUNCATE 设置为 1000 时，这意味着源自 myhost.com 主机的数据中的任何行都将被截断为最大长度
  1,000 字节：


  ```

  [host::myhost.com]

  TRUNCATE = 1000

  ```


  - **节优先级：** 当多个节匹配给定事件时，定义在更具体节中的设置优先于定义在较不具体节中的设置。具体来说，定义在 [host::<主机或主机模式>] 节中的设置覆盖
  [<源类型名称>] 节中的设置，而定义在 [source::<来源或来源模式>] 节中的设置优先于 [host::<主机或主机模式>] 和 [<源类型名称>]
  节。这种设置层次结构允许对 Splunk 中的数据处理进行细粒度控制，确保将最相关的设置应用于每个事件。


  至此，我们已经了解了在各种场景中有用的节。接下来让我们看看关于换行拆分、时间戳识别、行合并等的解析设置规范。我将使用源类型节来描述这些设置。例如，我们的源类型名称是
  web_access。请注意，设置键名区分大小写：


  ```

  ## web_access 源类型的解析设置

  [web_access]

  LINE_BREAKER = < 正则表达式：默认设置为换行符或回车符的数量（[\r\n]+）>

  SHOULD_LINEMERGE = <true | false - 是否将多个多行事件合并为一个事件。如果设置为 true，则取决于其他设置的数量。阅读完整规范>

  BREAK_ONLY_BEFORE = <仅当 SHOULD_LINEMERGE 设置为 true 时适用>

  BREAK_ONLY_BEFORE_DATE = <仅当 SHOULD_LINEMERGE 设置为 true 时适用>

  TIME_PREFIX = < 正则表达式：如果设置，Splunk 软件会在尝试提取时间戳之前扫描事件文本以查找此正则表达式的第一个匹配项。>

  TIME_FORMAT = <strptime 风格格式>

  MAX_TIMESTAMP_LOOKAHEAD = < 整数：Splunk 软件在事件中查找时间戳时应查看的字符数。默认情况下，查找前 128 个字符>

  TZ = <事件的时区，如 UTC、AEDT、AST 等。如果未设置，则默认考虑 splunkd 进程的时区。>

  TRANSFORMS-<类名> = <transforms.conf 节1>, <transforms.conf 节2>

  ```


  虽然上述设置对于优化 Splunk 的数据处理很有用，但值得注意的是，Splunk 会尽可能尝试使用默认值。这些默认值旨在为大多数用例提供合理的性能和功能水平。TRANSFORMS-<类名>
  设置与 transforms.conf 相关，我们将在下一节中讨论。让我们按功能对这些设置进行分类：


  - **换行拆分：** LINE_BREAKER 设置将数据流拆分为单独的事件行。默认情况下，它通过查找换行符或回车符的数量来确定事件边界。如果设置了 LINE_BREAKER，则必须将
  SHOULD_LINEMERGE 设置为 false，出于性能原因，这也是可取的。

  - **行合并：** SHOULD_LINEMERGE 将多个事件合并为单个事件。你可以将其设置为 true 或 false；默认情况下为 true。当我们将其设置为
  true 时，必须设置其他设置（如 BREAK_ONLY_BEFORE_DATE 和 BREAK_ONLY_BEFORE）以识别事件边界。

  - **时间戳识别：** 在解析阶段正确配置应用于每个事件的时间戳非常重要。Splunk 有一组预定义的日期时间格式（$SPLUNK_HOME/etc/datetime.xml），这些格式是常用且标准的。默认情况下，如果未显式设置
  TIME_FORMAT，Splunk 会扫描事件的前 128 个字符以查找时间戳。如果事件包含超出 128 个字符的时间戳，或者希望限制从事件中 TIME_PREFIX
  位置开始的时间戳扫描，可以使用 MAX_TIMESTAMP_LOOKAHEAD 或 TIME_PREFIX 设置。TIME_FORMAT 是一种 strptime
  标准风格格式，可以在时间戳采用非标准格式时设置。请参阅此处的日期时间格式变量 - https://tinyurl.com/3kaddz23。TZ 标识数据来源的时区。要查看所有时区（TZ）ID
  的列表，请参阅 https://en.wikipedia.org/wiki/List_of_tz_database_time_zones。


  在某些场景下，事件可能没有日期、时间或年份值，或者这些值都没有。Splunk 会尝试根据自身的规则来确定这些值，以便在异常情况下识别时间戳。关于时间戳分配如何工作的
  Splunk 文档可在此处获取 - https://tinyurl.com/4tjaaerb。






  让我们来看一下 web_access 日志的以下示例来定义 props.conf 解析设置。日志中包含时间戳信息；每条日志行中的 -0500 代表美国东部标准时间（EST）时区，并且日志中的每一行都代表事件边界。让我们为此
  web_access 日志样本编写 props.conf 信息：


  ```

  127.0.0.1 - - [10/Feb/2023:10:34:56 -0500] "GET /example-page.html HTTP/1.1" 200
  2345 "https://www.example.com/" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  (KHTML, like Gecko) Chrome/96.0.4664.110 Safari/537.36"

  127.0.0.1 - - [10/Feb/2023:10:37:56 -0500] "GET /example-page.html HTTP/1.1" 400
  2345 "https://www.example.com/" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  (KHTML, like Gecko) Chrome/96.0.4664.110 Safari/537.36"

  127.0.0.1 - - [10/Feb/2023:10:39:56 -0500] "GET /example-page.html HTTP/1.1" 500
  2345 "https://www.example.com/" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
  (KHTML, like Gecko) Chrome/96.0.4664.110 Safari/537.36"

  ```


  以下 props.conf 配置通过每一行新行将访问日志拆分为单独的事件（默认行为），并应用正确的时间戳和时区。主要目标是正确解析访问日志：


  ```

  #props.conf for preceding web_access logs

  [web_access]

  LINE_BREAKER = ([\r\n]+)

  SHOULD_LINEMERGE = false

  TIME_PREFIX = \[

  TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z

  TZ = EST

  MAX_TIMESTAMP_LOOKAHEAD = 26

  ```


  提供的 [web_access] 段是 Splunk 中 props.conf 文件配置的一个示例。以下是每个设置的作用：


  - LINE_BREAKER = ([\r\n]+): 此设置指定用于识别数据中换行符的正则表达式模式。在此情况下，它设置为 ([\r\n]+)，匹配一个或多个回车或换行字符的出现。

  - SHOULD_LINEMERGE = false: 此设置控制 Splunk 是否应尝试将连续的数据行合并为单个事件。将此设置为 false，即表示告诉 Splunk
  将每行数据视为单独的事件。

  - TIME_PREFIX = \[: 此设置指定用于识别数据中时间戳开头的正则表达式模式。在此情况下，它设置为 \[，匹配字面上的左方括号字符。


  - 创建新的索引时间字段提取。

  - 创建高级搜索时间字段提取。

  - 设置查找表，从外部源查找字段。


  在下一节中，我们将学习数据操作用例，例如数据匿名化、将数据重新路由到不同的索引、过滤事件以及覆盖源类型。我们将在第 11 章《字段提取和查找》中学习剩余的字段提取和查找。让我们从数据匿名化开始。


  ## 数据匿名化


  数据匿名化是将 PII 转换为无法用于识别信息最初链接到的个人的格式的过程。数据匿名化的目的是保护敏感数据的隐私和保密性。


  数据匿名化有多种方法，其中之一是掩码，我们将在本节中学习。


  **掩码**涉及用非敏感的占位符值替换敏感数据——例如，用 XXXX 替换个人的电话号码，或用随机值替换其出生日期。请注意，一旦数据在解析和索引阶段被掩码，就无法撤销。


  Splunk 具有以下两种方法来掩码数据。正如我之前提到的，强烈建议事先了解正则表达式以理解本节内容：


  - 仅 props.conf 中的 SEDCMD 设置

  - 同时使用 props.conf 和 transforms.conf


  ### 在 props.conf 中使用 SEDCMD


  通过 props.conf 直接应用 SEDCMD 设置在原始单个事件上工作。您可以使用此设置用于 sourcetype、source 和 host 段，如下所示。如果您熟悉
  Linux 中的 sed，它的工作方式与 Linux 中的 sed 命令类似。其规范如下：


  ```

  # props.conf SEDCMD setting specification

  [<sourcetype-name> | source::<source name> | host::<hostname>]

  SEDCMD-<class> = <sed like command>

  ```


  <sed like command> 语法解释如下：


  - sed like command - s/regex/replacement/flags.

  - <class> 是一个唯一的字面字符串。

  - s – 用于替换。

  - sed 中的正则表达式是 PERL 兼容的正则表达式样式（可选包含捕获组）。

  - replacement 是用于替换正则表达式匹配的字符串。使用 \n 进行反向引用，其中 n 为单个数字。

  - Flags 可以是 g 以替换所有匹配项，或一个数字以替换特定匹配项。


  为了更清楚，让我们通过以下包含电话号码的呼叫日志数据示例来说明：


  - **示例：** 公司 A 是一家电信公司，将呼叫记录数据编入 Splunk Enterprise 索引，索引集设置为 carrier_records，sourcetype
  设置为 call_records。call_records 数据包含电话号码等 PII，出于隐私原因必须进行掩码。作为数据管理员，我们的任务是使用我们刚刚学习过的
  SEDCMD 设置在 sourcetype 级别用 XXXXXXXX 符号掩码电话号码。我们可以为此示例使用我们在第 1 章 Splunk 安装 – 独立版部分中安装的独立
  Splunk 实例。

  - **日志样本：** 在以下呼叫记录样本中，您可以找到格式为 (555) 555-1234 的电话号码，我们将使用 SEDCMD 对其进行掩码，如下所示。


  以下是 call_records 日志样本：


  ```

  2022-03-13 15:22:08 Srikanth (555) 555-1234 made a call to Jane (555) 555-5678

  2022-03-12 10:11:24 Mary (555) 555-4321 sent a message to Scott (555) 555-8765

  2022-03-11 18:05:03 David (555) 555-2345 received a call from Abdul (555) 555-9876

  ```


  props.conf 文件的 SEDCMD 设置用于掩码呼叫记录中的电话号码，如下所示：


  ```

  ## props.conf masking phone numbers in call records

  [call_records]

  SEDCMD-maskphonenumber = s/\(\d{3}\)\s\d{3}-\d{4} /XXXXXXXX /g

  ```


  在提供的 props.conf 文件中，SEDCMD 指定了电话号码的正则表达式模式以及用于替换它们的字符串。g 标志表示日志中电话号码的所有出现都应被指定的替换字符串（XXXXXXXX）替换。


  一旦此配置部署到独立 Splunk 实例，任何被摄取并匹配指定正则表达式的日志都将被相应地转换，并在转换后的状态下编入索引。然而，值得注意的是，在此配置更改之前已编入索引的日志将不会受到此转换的影响。


  如果您需要掩码先前已编入索引日志中的电话号码，您需要在配置更改部署后重新摄取这些日志。


  以下是掩码后的 call_records 日志：


  ```

  2022-03-13 16:22:18 Chuppa XXXXXXXX made a call to Chand XXXXXXXX

  2022-03-13 11:19:54 Garry XXXXXXXX sent a message to Bill XXXXXXXX

  2022-03-13 22:55:23 Dan XXXXXXXX received a call from Ahmad XXXXXXXX

  ```


  您可以看到电话号码已通过在 Splunk 中发出搜索请求 - index=carrier-records sourcetype=call_records 被掩码为
  XXXXXXXX。


  在下一节中，我们将学习使用 transforms.conf 和 props.conf 设置进行数据掩码。


  ### 使用 transforms 和 props


  我们将在此处使用相同的 call_records 日志样本，并使用 transforms.conf 和 props.conf 文件应用掩码设置。让我们看一下规范：


  ```

  # transforms.conf specification

  [<transforms-stanza-name>]

  SOURCE_KEY = <_raw by default, _MetaData:Index, MetaData:Sourcetype, MetaData:Host,
  MetaData:Source and so on>

  REGEX = <regular expression to operate on field contents specified in SOURCE_KEY>

  FORMAT = <specifies the format of the event works in accordance with REGEX, for
  fields format is fieldname::fieldvalue>

  DEST_KEY = <_raw for masking in data event, can set other keys as described in Spec>


  ## props.conf specification

  [<sourcetype-name> | source::<source name> | host::<hostname>]

  TRANSFORMS-<class> = <transforms stanza name 1>, <transforms stanza name 2>.. <transforms
  stanza name N>

  ```


  transforms.conf 规范看起来很简单；然而，它支持超出本书范围的多种用例。可以使用来操作诸如 host、sourcetype、source 和 queue
  等元数据字段的键组合都描述在此处 - https://tinyurl.com/27sxf94z 的规范文件中。


  props.conf 规范具有 TRANSFORMS-<class> 设置。这里，<class> 是一个唯一的字面字符串。我们可以指定多个 transforms
  段并用逗号分隔它们，以便按相同顺序应用它们。


  我们将对以下各节中描述的其余用例使用前述 transforms.conf 和 props.conf 规范，这些用例涉及覆盖源类型、将数据重新路由到不同的索引、过滤不需要的事件并将它们发送到
  nullQueue。






  如果你想尝试一下，可以用所需的主机名值覆盖 host 字段。在这种情况下，DEST_KEY 将为 MetaData:Host。在下一节中，我们将学习索引路由。


  ## 索引重新路由


  索引是在输入阶段设置的数据存储库。在某些情况下，数据流中的一些事件应被过滤并通过不同的索引重新路由。这可以在解析阶段实现，并且仅适用于 HF/索引器。


  以下是一些适用的场景：


  - 数据流包含需要被过滤并存储在单独索引中的安全数据。将其存储在单独索引中，在访问控制和保留方面提供了更大的灵活性。

  - 如果数据量足够大，单个索引可能无法高效地进行搜索处理。在这种情况下，将经常访问的部分数据路由到高性能索引，并将不常使用的数据保留在低性能索引中，将提高搜索性能。

  - 出于合规性要求，某些事件应存储在单独的索引中。


  为了实现索引路由，我们将依赖 transforms.conf。其规范与我们在前面章节中看到的一致。


  我在这里考虑的示例场景是我们在“数据匿名化”一节中使用的 call_records 日志样本。如果你仔细观察日志样本，它包含客户之间的通话以及短信（SMS）记录。


  要求是将短信记录分开并路由到索引：sms-conversations。日志中的 message 和 sent 关键字将是用于识别短信记录的 REGEX 匹配：


  ```

  ## Log sample

  2022-03-13 15:22:08 Srikanth (555) 555-1234 made a call to Jane (555) 555-5678

  2022-03-12 10:11:24 Mary (555) 555-4321 sent a message to Scott (555) 555-8765

  2022-03-11 18:05:03 David (555) 555-2345 received a call from Abdul (555) 555-9876

  ```


  让我们来看看 transforms.conf 的设置，如下所示：


  ```

  ## transforms.conf stanza for index routing

  [sms-index-routing]

  SOURCE_KEY = _raw

  REGEX = (message|sent)

  FORMAT = sms-conversations

  ```


