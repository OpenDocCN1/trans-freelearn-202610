  \ *Chapter 9, Configuring Splunk Data Inputs.* 中找到有关额外支持的数据输入的更多信息以及关于 fishbucket\
  \ 概念的详细解释。\n\n下图说明了 UF 安装在 Web 服务器上，配置为监控 Web 服务器日志并在日志更新时持续将其转发到 indexer：\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_28_0.png)\n\
  \nFigure 1.1: UF forwarding web server logs to indexer\n\n让我们现在来看 SH，它是分布式部署中一个关键的用户面向的处理组件。\n\
  \nHF 是一个 Splunk Enterprise 实例，不需要单独的二进制文件进行安装。与 UF 相比，它提供了扩展的功能集。它不仅收集和转发数据，还包括用于配置和管理的\
  \ Splunk 用户界面。要运行 HF，需要 forwarder 许可证。通常，HF 配置为转发模式，通过禁用本地数据存储来实现。可在 Splunkbase\
  \ 上获得的 Splunk Add-ons 可以安装在 HF 上以便于从各种来源收集数据。这种功能组合使 HF 成为在受益于用户友好界面的同时进行数据预处理和转发数据的多功能选择。\n\
  \n### SH\n\nSH 组件是一个专用于搜索管理的 Splunk Enterprise 实例，并为用户交互提供多种接口。它向用户提供的流行接口是 web、CLI\
  \ 和 RESTful API。\n\n多个 SH 可以组合在一起形成一个集群，称为 SH 集群（SHC）。SHC 的成员共享相同的基线配置，作业由 SH captain\
  \ 分配给可用成员。\n\n在独立部署中，单个 Splunk Enterprise 实例（即同一实例）同时充当 SH 和 indexer。在分布式部署模型中，SH\
  \ 或 SHC 可以向多个 indexers 提交搜索并汇总返回的结果。结果存储在本地的 dispatch 目录中，位于 $SPLUNK_HOME/var/run/splunk/dispatch\
  \ 以便稍后检索，作业过期后结果将被删除。$SPLUNK_HOME 指的是 Splunk 软件安装的安装目录。例如，临时搜索结果（即搜索作业结果）在 dispatch\
  \ 目录中保留 10 分钟，作业过期后将被一个名为 dispatch reaper 的进程删除，该进程每 30 秒运行一次。\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_30_0.png)\n\
  \nFigure 1.3: Indexers receiving data from forwarders and storing it in indexes\n\
  \n到目前为止，我们已经了解了处理组件及其在 Splunk Enterprise 部署中的作用。让我们在下一节中了解管理组件。\n\n## 管理组件\n\n这些是支持处理组件的管理组件：\n\
  \n- Deployment Server (DS)\n- SHC Deployer (SHC-D)\n- Indexer CM\n- License Manager\
  \ (LM)\n- MC\n\n我们将在以下小节中讨论它们。\n\n### DS\n\n使用独立的 Splunk Enterprise 实例来管理 forwarders。位于数据源（通常是\
  \ UF）的 forwarders 通常需要新的配置来监控新文件或对现有配置进行更改，然后可选地重启。手动更改它们在大规模基础设施中是一项非常耗时的任务。这就是\
  \ DS 发挥作用的地方，它以 apps 的形式维护配置的中央存储库。除了 UF 之外，HFs 也可以使用 DS 进行集中管理。\n\n## 分布式非集群部署\n\
  \n分布式非集群部署比单服务器部署更适合额外的负载和索引容量。SH 和索引职责的分离增加了总拥有成本（TCO）。\n\n下图显示了具有独立 SH 和索引层的非集群部署架构：\n\
  \n![](img/5319cbd6f078c6cda7fac6347f77a07d_34_0.png)\n\nFigure 1.5: Distributed\
  \ non-clustered architecture\n\n在所示架构中，独立的搜索层包含一个 SHC，索引层包含多个独立的 indexers。SHC-D\
  \ 是一个强制性的管理组件，负责使用 apps 将配置部署到 SHC。它通过从 SHC-D 向 SHC 推送配置更新的 apps 来促进部署过程。DS 用于管理\
  \ forwarders，而 LM 存储许可证信息。DS 确保有效的 forwarder 管理，而 LM 作为许可证详细信息的中央存储库，所有其他实例都连接到它以获取许可证信息。让我们看看这种部署相对于单服务器部署的优势：\n\
  \n- 用户数量将高于单服务器部署，并有额外的 indexer 支持\n- 独立的 indexers 将每日索引容量提高到超过 300 GB\n\n现在，让我们看看这种部署的局限性：\n\
  \n- 无 HA 和 DR\n- 每次添加新的搜索 peer/indexer 时都需要重新配置 SH\n- 当其中一个 indexer 停机时，搜索结果可能不完整，数据摄取也可能受到影响\n\
  - 在独立的单 SH 部署场景中，存在 **single point of failure (SPOF)**\n\n让我们看看分布式集群部署，这是一种比分布式非集群部署更先进的设置。\n\
  \n## 分布式集群部署和 SHC – 单站点\n\n单站点分布式集群 SH 和 indexer 部署是一种高可用、 resilient 架构。站点是一个特定区域/地理位置的经典数据中心。\n\
  \n下图显示了具有独立 SHC 和在单站点上运行的集群索引层的集群部署架构：\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_35_0.png)\n\
  \nFigure 1.6: Distributed clustered deployment and SHC – single-site\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_37_0.png)\n\
  \nFigure 1.7: Distributed clustered deployment and SHC – multi-site\n\n如 Figure\
  \ 1.6 所示，每个站点的组件保持相同。然而，收集层在两个站点之间是通用的。每个站点都有一个专用的 SHC。\n\n让我们了解局限性：\n\n- Indexer\
  \ 集群在站点之间复制数据，这称为跨站点复制，需要较低的网络延迟。100 毫秒或更少是首选。\n- SHC 独立工作，不共享工件和通用配置。\n- SHC 每个站点有\
  \ 100 个节点的限制。\n- 每个站点都需要一个专用的 SHC-D。\n- 一个 CM 节点足以用于跨站点的整个 indexer 集群。\n\n我们已经了解了非常基本的单服务器架构（最好用于测试或开发）和先进的多站点集群部署架构。每种都有其优势、局限性和成本影响。在此阶段，你已经相当熟悉\
  \ Splunk 组件和架构。在下一节中，我们将安装一个独立/单服务器部署，我们在这一节的开头就谈到了它。\n\n\n\n\n\n# Splunk 安装 – 独立部署\n\
  \n如前文所述，单服务器部署由单个 Splunk 实例组成，同时兼具搜索头（SH）和索引器功能。实际上，安装并不属于管理员考试大纲的一部分；但亲自动手通过 Splunk\
  \ Web、配置文件（.conf）以及我们将在后续章节中讨论的 CLI 选项来体验 Splunk，会非常有帮助。本节提供在 Windows 操作系统上安装 Splunk\
  \ Enterprise 9.0.3 的说明。让我们开始吧。\n\n## 安装系统要求\n\n让我们看一下计算环境的系统要求。Splunk Enterprise\
  \ 支持多种操作系统环境。支持的选项完整列表可在此处查看：https://tinyurl.com/2tuudjwr。Splunk 有以下硬件要求：\n\n- 64\
  \ 位 Linux 或 Windows 发行版\n- 12 个物理 CPU 核心或 24 个 vCPU，每个核心主频 2 GHz 或更高\n- 12 GB **随机存取存储器（RAM）**\n\
  - x86 64 位芯片架构\n- 1 GB 以太网**网络接口卡（NIC）**\n- 至少 3 GB 可用磁盘空间用于安装，并根据索引需求预留更多空间\n\n\
  我将安装 Splunk 9.0.3 版本的系统规格如下：\n\n- 64 位 Windows 11 专业版操作系统\n- 6 个物理 CPU 核心（或 12 个\
  \ vCPU），主频 2.1 GHz，16 GB RAM\n- x86 64 位 AMD 芯片\n- 充足的磁盘空间\n\n你可能已经注意到，我电脑的物理 CPU\
  \ 核心数少于建议值，这完全没问题，因为我们不会在 Splunk 实例上运行生产工作负载。接下来，让我们进入安装步骤。\n\n## 安装步骤\n\n作为前提条件，你需要一条高速互联网连接，从以下位置下载\
  \ Splunk Enterprise 免费软件包：https://www.splunk.com/en_us/download.html。如果你没有 Splunk\
  \ 账户，请注册并登录以继续。根据操作系统选择安装包，并下载最新版本，在撰写本书时最新版本为 9.0.3。\n\n让我们开始安装：\n\n1. 下载名为 splunk-9.0.3-dd0128b1f8cd-x64-release.msi\
  \ 的 .msi 文件。双击它开始安装。系统会提示你接受许可协议并使用默认安装选项。参考图 1.8，点击“下一步”按钮：\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_39_0.png)\n\
  \n图 1.8：安装 – 许可协议\n\n2. 系统会提示你输入管理员账户凭据。输入详细信息。确保你记住这些信息，因为首次登录 Splunk 实例时会用到。点击“下一步”按钮（参考图\
  \ 1.9）：\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_42_0.png)\n\n图 1.12：Splunk Enterprise\
  \ – 首次登录页面\n\n安装已成功完成。现在，让我们在下一节总结本章所学内容。\n\n## 总结\n\n第一章到此结束。确实有很多内容需要消化。让我们简要总结一下目前所学的内容。\n\
  \n在本章中，我们首先了解了 Splunk 认证管理员（Splunk Certified Admin）认证的先决条件、考试主题及其权重。与考试主题一致，本书分为两个部分：Splunk\
  \ Enterprise 系统管理和数据管理。我们还讨论了考试模式，包括单选、多选以及判断题。\n\n我们了解了 Splunk Enterprise 的基本功能以及它作为数据分析产品的主要亮点。接着我们探讨了\
  \ Splunk Enterprise 9.x 产品系列的功能，然后是组件及其在部署中的作用。\n\n我们还了解了重要的 SVA。我们涵盖了单服务器、分布式非集群、分布式集群单站点和分布式集群多站点的架构。我们讨论了它们的优势和局限性，并展示了处理和管理组件。最后，我们在\
  \ Windows 系统上成功安装了一个 Splunk Enterprise 单实例。\n\n本章是本书其余部分的基础。我们提到的 Splunk 组件将在后续章节中详细介绍。你需要了解它们会在什么场景下使用，以及它们如何在整体\
  \ Splunk 部署架构中发挥作用。虽然 SVA 不属于考试指南的一部分，但书中包含它们是为了让你更好地理解后续章节。\n\n在下一章中，我们将深入探讨许可证管理。许可证管理包括许可证类型、它们的工作原理以及许可证配置。\n\
  \n在下一节中，你将练习涵盖目前所学主题的考试风格问题。\n\n## 自我评估\n\n本自我评估部分旨在帮助你更好地了解在章节涵盖的主题中，你擅长哪些部分，哪些部分需要改进。我建议你仔细阅读问题和答案，并花时间重新阅读你认为需要更多理解的部分。或者，你也可以参考\
  \ Splunk 文档。祝你好运！\n\n你将会看到 10 道问题，每道都有可选择的答案。问题模式与“*介绍考试测试模式*”部分中讨论的相同。本节末尾提供了问题的答案。让我们开始吧：\n\
  \n1. 以下哪些是 Splunk Enterprise 的功能？（选择所有适用的选项）\n   - A. 告警\n   - B. 搜索和报告\n   - C.\
  \ 文件监控\n   - D. 在文件末尾将已监控的文件更新为已完成\n\n2. Splunk 是否支持监控二进制文件？\n   - A. 是\n   - B.\
  \ 否\n\n3. UF 和 Splunk Enterprise 利用哪个概念来防止冗余数据索引？\n   - A. Bucket ID\n   - B. Fishbucket\n\
  \   - C. Finbucket\n   - D. HashBucket\n\n10. 哪个配置文件（.conf）包含转发器上的文件监控详细信息？\n  \
  \ - A. outputs.conf\n   - B. inputs.conf\n   - C. server.conf\n   - D. source.conf\n\
  \n我希望你能够通过这些问题回忆起我们学过的主题。让我们回顾一下答案。\n\n## 回顾答案\n\n1. 选项 A、B 和 C 是正确答案。选项 D 不是 Splunk\
  \ 功能。\n2. 选项 B，否。Splunk 无法监控二进制文件。它只能监控文本数据。\n3. 选项 B，Fishbucket，是正确答案。Splunk Enterprise\
  \ 和 UF 使用查找指针和 CRC 来跟踪文件监控进度，并避免重复数据索引。\n4. 选项 A、B、C 和 D 都是 SH 的功能。\n5. 选项 A 正确（True）。索引器存储原始事件、索引文件和其他元数据文件，用于搜索处理。\n\
  6. 选项 A 正确（True）。数据一旦写入索引，就不可更改。\n7. 选项 B、C 和 D 是正确答案。UF 是数据收集组件。\n8. 选项 C 是正确答案。SHC-D\
  \ 通过 captain 将应用部署到所有集群成员。\n9. 选项 A、B 和 D 是正确答案。LM 在添加许可证时存储许可证文件。可选地，许可证可以堆叠，并且可以在\
  \ LM 上创建池。许可证报告可在 LM 实例中的 MC 应用中查看。\n10. 选项 B 是正确答案。outputs.conf 和 server.conf 是用于不同目的的\
  \ Splunk 配置文件。Splunk 中没有 source.conf 文件。\n"
- "# Splunk 许可证管理\n\nSplunk 系统管理员的关键职责之一是许可证管理。当你首次安装 Splunk Enterprise 时，无论是个人使用还是商业使用，都需要配置许可证以启用其功能；否则，其默认许可证的有效期将在\
  \ 60 天后到期。到本章结束时，你应该了解许可证类型、安装、Splunk 许可的工作方式、许可证分配和许可证违规，最后我们将介绍监控控制台中的许可证使用报告。\n\
  \n本章的总体目标是让你熟悉 Splunk 许可，以便你能够选择正确的许可证类型，如果你拥有多种类型，可以堆叠许可证文件，并配置和分配正确的容量给对等节点。在本章中，我们将涵盖以下主题：\n\
  \n- 介绍许可证类型\n- 理解许可证警告和违规\n- 许可如何运作\n- 安装、管理和监控许可证\n\n## 介绍许可证类型\n\n在直接进入类型主题之前，让我们讨论一下许可证的需求。Splunk\
  \ Enterprise 是付费专有软件，为需要符合其业务目标的数据平台的组织提供服务。Splunk 以许可证的形式向组织销售这些服务，以激活 Splunk Enterprise\
  \ 产品。如果你在选择适合你的用例的正确许可证时需要帮助，可以联系 Splunk 销售团队（sales@splunk.com）。\n\n我们将在以下部分讨论 Splunk\
  \ 许可证的类型。\n\n\n\n\n\n## Splunk Enterprise 试用许可证\n\n首次安装 Splunk Enterprise 时，默认启用试用许可证。试用许可证具有以下特性：\n\
  \n- 它仅在 60 天内有效。超过此期限后，必须选择其他许可证类型才能继续使用该产品。\n- 它允许您使用 Splunk Enterprise 的全部功能。\n\
  - 它仅适用于单个/独立的 Splunk Enterprise 实例。\n- 该许可证将每日数据摄入量限制为 500 MB。超过此限制，Splunk 将发出许可证警告。*理解许可证警告和违规*一节详细解释了许可证违规。\n\
  \n## Splunk 免费许可证\n\n免费许可证永久有效，并且仅支持 Splunk Enterprise 功能的子集：\n\n- 它禁用告警、身份验证、集群、分布式搜索、摘要以及向非\
  \ Splunk 服务器的转发。\n- 每日数据摄入限制为 500 MB。许可证违规会阻止搜索功能。下一节*理解许可证警告和违规*将提供更多详细信息。\n- 它仅适用于单个/独立的\
  \ Splunk 实例。\n\n## 转发器许可证\n\nSplunk 提供多种转发器。最常用的是**通用转发器（UF）**和**重型转发器（HF）**。让我们看看该许可证如何应用于这两种主要的转发器类型：\n\
  \n- UF 默认已嵌入许可证，因此无需显式安装/配置许可证。\n- UF 是独立的二进制软件，消耗的资源比 HF 少。UF 可以将数据通过身份验证转发到索引器。\n\
  - HF 是一个完整的 Splunk Enterprise 实例二进制文件，需要转发器许可证或 Enterprise 许可证。\n- 转发器许可证默认嵌入在 Splunk\
  \ Enterprise 软件包中。\n- 带有转发器许可证的 HF 不允许进行索引。但是，允许进行身份验证。\n- 需要索引、高级身份验证和 KV Store\
  \ 的 HF 需要 Enterprise 许可证。\n\n开发者许可证纯粹面向应用程序开发者，并启用 Splunk Enterprise 的所有功能。每个许可证都会强制执行限制——例如，许可证受限于天数、数据量、vCPU\
  \ 数量等。下一节将详细说明许可证警告的产生、如何转变为违规，以及随后详细介绍 Splunk Enterprise 针对每种许可证类型限制的具体功能。\n\n\
  ## 理解许可证警告和违规\n\n如果系统管理员希望维护平台的连续性，那么理解许可证限制及其对 Splunk Enterprise 平台的影响非常重要。许可证类型（无论是从\
  \ Splunk 购买的还是免费的）都会强制执行限制，但基础设施许可证除外，它计算 vCPU 的数量，并且不强制执行许可证违规限制。其余许可证类型对每日数据量或索引数据量强制执行限制。\n\
  \n如果许可证超出了每日允许的数据量，Splunk Enterprise 将发出许可证警告。当警告数量超过某个阈值时，即称为许可证违规。每种许可证类型的阈值都不同。许可证违规会禁用\
  \ Splunk Enterprise 的重要功能。\n\n许可证警告会出现在 Splunk Web 的管理消息中。它们会保留数天，以便系统管理员解决。可以在监控控制台中启用许可证使用情况告警。\n\
  \n![](img/5319cbd6f078c6cda7fac6347f77a07d_50_0.png)\n\n图 2.1：监控控制台告警——许可证使用情况和到期时间\n\
  \n图 2.1 显示了您在监控控制台中可能收到的告警。这些告警默认处于禁用状态；您可以启用它们，并了解当使用量接近每日配额和/或许可证即将到期时它们的工作方式。\n\
  \n许可证违规会禁用重要的 Splunk 功能，这意味着在违规期间只有部分功能可用。让我们看看在违规期间搜索和索引会发生什么：\n\n- 搜索功能（包括报表和告警）将被阻止，但内部索引除外，例如\
  \ _internal、_audit 和 _introspection\n- 索引器将继续对数据进行索引\n\n下面讨论每种许可证类型的警告和违规阈值：\n\n\
  - **Splunk Enterprise 试用许可证：** 在滚动 30 天周期内出现 5 次或以上警告即构成违规。许可证警告会保留 14 天。在违规期间，搜索会被阻止，索引会继续。如果您希望修复许可证违规以恢复搜索功能，没有重置选项。建议的方法是重新安装整个\
  \ Splunk Enterprise 实例。\n- **Splunk 免费许可证：** 在滚动 30 天周期内出现 3 次或以上警告即构成违规。许可证警告会保留\
  \ 14 天。在违规期间，搜索会被阻止，索引会继续。与试用许可证类似，免费许可证无法重置，重新安装是唯一的选择。\n- **Splunk Enterprise\
  \ 许可证：** 每日数据量为 100 GB 或以上的许可证堆栈不会强制执行许可证警告和违规。每日数据量低于 100 GB 的许可证堆栈会发出许可证警告。在滚动\
  \ 60 天周期内出现 45 次或以上警告即构成违规，此时搜索会被阻止，而索引会继续。要重置 Enterprise 许可证，请联系 Splunk 销售团队；他们将能够解锁所需的搜索功能。\n\
  - **Splunk Enterprise 基础设施许可证：** 此许可证类型不会产生违规。\n- **Splunk 开发者许可证：** 在滚动 30 天周期内出现\
  \ 5 次或以上警告即构成违规。许可证警告会保留 14 天。在违规期间，搜索会被阻止，索引会继续。开发者许可证可以通过联系 Splunk 开发者计划团队（devinfo@splunk.com）进行重置以解锁搜索功能。\n\
  - **Splunk 转发器许可证：** 转发器许可证不适用任何违规规则。它是 Splunk Enterprise 软件包中的嵌入式许可证。在转发器许可证上进行索引需要\
  \ Enterprise 许可证或基础设施许可证。\n\n总之，Splunk 许可证警告会提前告知管理员整体许可证使用情况，以便他们在违规发生之前采取必要的行动。在一段时间内，警告序列超过规定阈值将导致违规。在违规期间，除内部索引外，搜索会被阻止，索引会继续。超过\
  \ 100 GB 的 Enterprise 堆栈许可证和 Enterprise 基础设施许可证都不会强制执行违规，但其余许可证类型会强制执行违规规则。除免费许可证和试用许可证外，违规的许可证可以重置。\n\
  \n我们已经介绍了很多关于许可证警告和违规的信息；不过，您可能想知道 Splunk Enterprise 在哪个阶段跟踪许可证使用情况，以及在分布式部署架构中哪个组件跟踪使用情况。接下来的两节将重点介绍许可证管理器组件中的许可证安装，我们将详细讨论许可证在许可证使用量计算方面究竟是如何工作的。\n\
  \n## 许可证的工作原理\n\nSplunk Enterprise 许可证按许可证堆栈或单个池跟踪每天的索引数据量。要深入了解许可证组、堆栈和池，请参阅 Splunk\
  \ 文档：\n\n`https://docs.splunk.com/Documentation/Splunk/9.0.3/Admin/`\n\n组、堆栈、池和其他术语。本文档的内容将在下一节“安装、管理和监控许可证”中介绍。\n\
  \n在分布式基础架构中，一个专用的 Splunk Enterprise 实例将被分配许可证管理器角色，负责跟踪整个部署的许可证使用情况。其余实例充当许可证对等节点，向管理器报告。\n\
  \n许可证配额每天从午夜到午夜进行计量，这意味着它会重置为次日的完整配额，这是一个与管理器系统时钟协同工作的持续过程。Splunk 支持两种类型的索引，称为事件索引和指标索引。它们将在第\
  \ 5 章“Splunk 索引管理”中介绍。对于指标索引，许可证使用量计算上限为每个指标事件固定 150 字节；对于事件索引，则按事件的完整数据大小计算。\n\n\
  来自源头的原始数据在被索引到索引器之前会经历多个阶段。数据大小在索引阶段进行计量。各阶段将在第 8 章“数据接入”中解释。到目前为止，我们讨论了从外部源索引数据。每个正在运行的\
  \ Splunk Enterprise 实例本地都会生成大量数据。这些数据存储在以 _（下划线）开头的内部索引中，即 _internal、_audit、_introspection、_metrics\
  \ 和 _telemetry。\n\n让我们看看哪些数据不计入许可证配额：\n\n- Splunk 内部日志不计入\n- 为高可用性而存储在索引器集群中的复制副本\n\
  - 具有 stash 源类型的摘要索引\n- 已索引的数据，因为它包含 tsidx 文件、元数据等，以实现更快的检索\n\n总之，许可证配额每天从午夜到午夜进行计量。数据大小在索引阶段计算。指标索引数据上限为每个事件\
  \ 150 字节，事件索引数据则根据事件的完整大小计算。内部日志、摘要索引和复制数据不计入许可证。在分布式部署中，专用实例充当许可证管理器，在其中安装和配置许可证文件；其余实例充当许可证对等节点，并向许可证管理器报告。\n\
  \n## 安装、管理和监控许可证\n\n既然您已经全面了解了许可证类型以及许可证使用量如何根据许可证配额进行计算，我们将讨论添加、配置和管理许可证。作为系统管理员，这些任务非常重要。我们将以\
  \ Splunk Enterprise 许可证类型为例，讨论以下主题：\n\n- 添加许可证\n- 许可证堆叠和池\n\n\n\n\n\n- License manager\
  \ and license peer\n- License usage and alerting\n\n让我们在以下各节中详细讨论这些内容。\n\n## 添加许可证\n\
  \nSplunk Enterprise 许可证是一个文件，其扩展名为 .license，通常从 Splunk 购买。以下步骤也适用于其他类型的许可证，例如开发者许可证。\n\
  \n许可证文件可以通过以下两种方法之一添加到 Splunk：\n\n- 在 Splunk Web 主页（https://<hostname>:8000）上，转到窗口右上角的菜单并导航到\
  \ Settings | Licensing。点击 Add license 按钮，在下一个屏幕上，选择 Choose File 上传从 Splunk 销售处获得的\
  \ .license 文件。然后，点击 Install 按钮。此时，您需要重启 Splunk 实例。以下截图显示了许可 Web 页面，您可以看到用于上传许可证文件的\
  \ Add license 按钮。\n\n  ![](img/5319cbd6f078c6cda7fac6347f77a07d_53_0.png)\n\n  Figure\
  \ 2.2: The Licensing web page\n\n- 第二种方法是 在 Splunk 实例运行的主机上执行 CLI 命令。您应具有 Splunk\
  \ 许可证管理器已安装的主机的访问和执行权限。成功执行命令后需要重启：\n\n  ```\n  splunk add licenses <path_to_license_file_required>\n\
  \  ```\n\nFigure 2.4: The license group, stack, and pool layering\n\n## 许可证堆栈\n\n\
  许可证堆栈包含一个或多个相关许可证，其许可证配额可以相加，共同计入每天允许的数据量。\n\n例如，初始购买的 50 GB 企业许可证可以与后来购买的 40 GB\
  \ 许可证堆叠在一起，共同允许每天 90 GB 的索引量。让我们来看一下堆叠许可证时需要记住的关键点：\n\n- Enterprise licenses and\
  \ sales licenses can be stacked together\n- A license that is already part of one\
  \ stack cannot be part of another stack\n- License warnings and violations will\
  \ be raised against stacks and pools\n\n## 许可证池\n\n许可证池是堆栈许可证量的一个部分，可以分配给不同的索引器。它允许对许可证分配进行精细控制。\n\
  \n例如，总共需要为开发和生产索引器分配 100 GB 的许可证量。然而，开发环境可能会因为\n\n在 Adding a license 部分，我们学习了如何在充当许可证存储库的\
  \ Splunk 实例上安装许可证，该实例称为许可证管理器。登录已安装许可证的许可证管理器，转到窗口右上角，然后转到 Settings | Licensing。参考\
  \ Figure 2.5 查看许可 Web 页面，其中包含有关许可证、容量、到期时间和许可证池的信息。在分布式部署中，其他 Splunk 实例称为许可证对等体。所有对等体都需要指向许可证管理器实例以获取许可证信息。\n\
  \n要配置许可证对等体，请登录分布式部署中的剩余实例，例如搜索头、索引器和转发器，并将它们指向许可证管理器。登录到各个实例的 Web 界面并通过 Settings\
  \ | Licensing 导航，如 Figure 2.2 所示，然后点击 Change to Peer 按钮，该按钮显示两个单选按钮选项，Designate\
  \ this Splunk instance <instance_name> as the manager license server 和 Designate\
  \ a different Splunk instance as the manager license server。如 Figure 2.6 所示，选择第二个选项，这将显示一个文本框供您输入管理器许可证服务器\
  \ URI 及其管理端口（8089）。输入管理器许可证服务器 URI 并点击 Save 按钮以将许可证对等体连接到许可证管理器。\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_57_0.png)\n\
  \nFigure 2.6: Configuring a license peer with the license manager URI\n\n下图显示了 Messages\
  \ 部分，其中 Splunk Web 中会出现许可证警告和违规消息。许可证警告和违规消息会出现在许可证管理器的 Splunk Web 主页的 Messages\
  \ 菜单栏中。\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_58_0.png)\n\nFigure 2.7: License\
  \ warnings in Splunk Web\n\n如果许可证对等体无法访问许可证管理器，则在对等体被判定为许可证违规之前会有 72 小时的宽限期。在此情况下，搜索功能将被阻止，但索引会继续进行，直到对等体恢复与管理器实例的连接。\n\
  \n## 许可证使用和警报\n\n监控控制台默认包含在 Splunk Enterprise 软件中。但是，它必须在独立或分布式模式下进行配置以使用。配置监控控制台不在本书的讨论范围之内，但是，如果您想探索该主题，我建议您遵循\
  \ Splunk 文档（https://tinyurl.com/msxtcmkj）。要访问监控控制台应用程序，请登录独立 Splunk 实例的 Web 界面并通过\
  \ Settings 菜单导航，然后点击菜单项左侧的 Monitoring Console 选项。它提供了两个可视化仪表板，可以在监控控制台的 Indexing\
  \ | License Usage 菜单中找到。\n\nFigure 2.8 显示了 Indexing 菜单下的两个仪表板。License Usage - Today\
  \ 仪表板显示了今日许可证使用的全面详细信息。要检查过去的使用情况，请打开 Historic License Usage 仪表板。\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_58_1.png)\n\
  \nFigure 2.8: License usage dashboards in the monitoring console\n\n同样，监控控制台包含两个用于许可证使用跟踪的警报。参考\
  \ Figure 2.1 了解警报详情。警报默认处于禁用状态。要监控许可证使用信息，必须手动启用警报，以便在许可证到期 2 周时发送通知，以及当每日许可证配额超过\
  \ 90% 时。通知消息会出现在 Splunk Web 主页的 **Messages** 菜单栏中。\n\n在 Splunk Web 主页上记录警告和违规警报的还有一个地方——在\
  \ **Settings | Licensing** 菜单下（参考 Figure 2.2）。在此处触发的警报将对当前或永久许可证违规的池和堆栈提供更精细的可视性。\n\
  \n总之，许可证可以通过 Splunk Web、Splunk CLI 或配置文件安装。许可证管理器是所有许可证的存储库，其余 Splunk 实例向管理器报告并称为许可证对等体。如果许可证对等体无法报告\
  \ 72 小时，它将被判定为许可证违规，其搜索功能将被阻止（尽管索引继续进行），直到它重新连接到许可证管理器实例。\n\n许可证组、堆栈和池有助于在安装多个许可证时有效管理许可证，并将一部分容量分配给特定索引器。任何时候只有一个许可证组处于活动状态。只有某些类型的许可证可以堆叠——例如，企业许可证和销售许可证可以堆叠，但基础设施许可证不能与企业许可证堆叠。监控控制台提供许可证使用报告和警报以跟踪使用情况。警报默认处于禁用状态。许可证警告和违规消息会出现在\
  \ Splunk Web 的两个位置——一个是在 Splunk Web 主页的 **Messages** 栏中，另一个是在 **Settings | Licensing**\
  \ 下。\n\n在 Summary 部分之后，有一些练习考试题目涵盖了我们迄今为止学到的主题。\n\n## 总结\n\n我们已经结束了许可证管理章节的学习，该章节非常全面。许可原生于\
  \ Splunk Enterprise，其命名约定需要一些时间来消化。\n\n我们首先介绍了 Splunk 提供的许可类型，然后探讨了它们之间的差异，以检查不同许可证对不同部署选项的适用性。Splunk\
  \ 提供 Enterprise Free 和 Trial 许可证以及具有某些限制的开发者许可证。要启用 Splunk Enterprise 的所有功能，您需要一个有效的许可证文件。如果许可证超出其限制使用，将会发出许可证警告，并在发出一定数量的警告后，许可证将被视为违规。基础设施许可证没有违规，企业许可证的配额为\
  \ 100 GB 或更多。许可证违规会阻止重要功能，例如搜索，但索引会继续进行。Free 和 Trial 许可证无法从违规状态重置，但其他许可证可以通过联系 Splunk\
  \ Sales 重置。\n\n\n\n\n"
- '# 3. Splunk 中的用户、角色和身份验证


  Splunk Enterprise 遵循**基于角色的访问控制（RBAC）**方法，该方法允许用户访问 Splunk 实例，但限制了用户能看到的内容以及他们可以执行的操作。作为
  Splunk 系统管理员，熟悉 Splunk 的默认用户角色，并学习如何创建自定义角色以满足组织的特定需求，这一点非常重要。你还可能会被考察对角色继承（允许为单个用户分配多个角色）的理解，以及如何管理用户的索引访问权限。展示你能够使用
  LDAP、SAML 等方法在 Splunk 中设置身份验证，这一点也很重要。这些技能在 Splunk Enterprise Admin 认证考试中会被测试，因为它们对于在
  Splunk 环境中有效管理用户权限和访问至关重要。


  以下是在采用 RBAC 方法时涉及的关键组成部分，我们将在本章中讨论这些内容，以及如何通过 Splunk Web 和 Splunk CLI 对它们进行配置：


  -   用户

  -   角色

  -   身份验证方法


  ### 用户


  如前几章所述，Splunk Enterprise 实例提供了多种界面——即 Splunk Web、Splunk CLI 和 RESTful API。所有界面都必须通过允许用户通过身份验证和授权安全登录来加以保护。身份验证方法将在本章末尾进行说明。组织可以通过配置角色、能力、对象级权限和**基于角色的访问控制（RBAC）**，使其与各个用户的岗位职责保持一致，从而有效管理用户授权。然后，用户可以根据分配到的
  Splunk 角色来执行管理任务（特权用户）或普通用户任务（创建报告、警报、仪表板等）。在 Splunk 中，必须为用户分配至少一个角色。


  以下截图显示了 Splunk Web 主页上“设置”下的用户管理菜单项：


  **用户与身份验证**


  -   角色

  -   用户

  -   令牌

  -   密码管理

  -   身份验证方法


  图 3.1：Splunk 用户与身份验证管理


  点击图 3.1 中的“用户”菜单项后，将显示以下页面。“用户”页面包含现有用户的完整详细信息列表，并提供“编辑”操作和用于创建用户的“新建用户”按钮：


  ![](img/5319cbd6f078c6cda7fac6347f77a07d_64_0.png)


  图 3.2：Splunk 用户管理页面


  例如，管理员将创建新用户，并通过分配角色允许他们搜索特定索引。管理员创建的用户将能够登录并针对允许的索引运行搜索。


  用户是以安全方式在 Splunk 平台上执行所需操作的实体。如果没有用户，Splunk 实例就只是孤立的，无法发挥其作用。出于同样的原因，在安装后首次启动 Splunk
  实例时，系统会提示你创建一个管理员用户帐户。


  让我们通过 Splunk Web 添加一个新用户，并在下面的章节中了解需要填写哪些详细信息。


  ### 创建新用户


  可以通过 Splunk Web 或 Splunk CLI 创建新用户。这两种方式都需要管理员帐户详细信息来验证 Splunk 实例。系统管理员至少应了解以下详细信息才能完成用户创建过程：用户的全名，以及可以为用户分配的角色或用户在
  Splunk 平台上需要具备的能力。


  让我们看一下 CLI 命令，该命令用于添加名为 supportuser 的用户，密码为 changeme2，并分配 custom 角色 supportgroup。这里，admin:changeme
  是管理员帐户用户名和密码，用 :（冒号）分隔：


  ```

  ./splunk add user supportuser -password changeme2 -role supportgroup -auth admin:changeme

  ```


  类似地，还有更多 CLI 命令可用于编辑现有用户、解锁用户、重置用户密码等。你可以参阅 https://docs.splunk.com/Documentation/Splunk/9.0.0/Security/ConfigureuserswiththeCLI
  上的 Splunk 文档了解更多详细信息。


  下面让我们看看角色及其与用户的关联。


  ### 角色


  角色被分配给用户，且用户至少必须被分配一个角色。角色包含一组能力，这些能力定义了用户可以在 Splunk 平台上执行哪些操作。换句话说，能力只不过是指定给某个角色的权限列表——例如，运行搜索、运行计划搜索、运行实时搜索等。


  除了能力之外，角色还提供可配置选项，用于指定允许用户查询哪些索引、通过搜索过滤器方法进一步限制用户，以及设置配额，如磁盘空间限制和用户级搜索限制。以下截图显示了角色包含的可配置选项列表：


  ![](img/5319cbd6f078c6cda7fac6347f77a07d_66_0.png)


  图 3.4：编辑角色的可配置选项


  ### 创建新角色


  我希望你现在对角色及其重要性有了全面的了解，并且知道 Splunk 的默认角色。在本节中，让我们了解创建自定义角色的必要性，并逐步完成角色创建过程。


  例如，为了理解新自定义角色的需求，我们考虑两个不同的索引：`web-access-data` 索引包含网站访问日志数据，`building-access-data`
  索引包含建筑门禁日志数据。网站访问日志数据仅允许应用程序支持团队访问，建筑门禁日志数据仅允许建筑安全团队访问。在这种情况下，将为这两个团队创建两个不同的角色。


  可以将 Splunk 默认角色分配给用户；然而，这取决于用户需要访问哪些索引、应允许哪些能力，以及磁盘配额、搜索配额等资源的分配。如果现有角色不满足用户需求，系统管理员可以通过可选地继承现有
  Splunk 角色来创建新角色。继承现有 Splunk 角色的新角色会继承父角色的能力、索引访问权限和资源限制。


  Splunk 不建议更改默认角色。如果你想编辑默认角色，建议的方法是克隆现有角色并更改所需的可配置选项。以下截图显示了**新建角色**创建表单：


  ![](img/5319cbd6f078c6cda7fac6347f77a07d_68_0.png)


  上述截图显示了要分配给角色的名称，以及五个选项卡：**继承**选项卡用于选择现有角色，**能力**选项卡用于选择角色的能力，**索引**选项卡用于选择角色可访问的索引，**限制**选项卡用于对索引字段设置搜索过滤器，最后，**资源**选项卡用于限制角色级别和用户级别允许的磁盘空间和搜索配额。点击**创建**按钮将创建一个新角色，该角色将出现在**角色**网页上，如*图
  3.5* 所示。


  能力是应用于用户的细粒度权限，其列表相当长。你可以参阅 https://tinyurl.com/bdffj2s6 上的文档获取完整列表。另一个查看它们的地方是
  https://tinyurl.com/2p8nvat9 上的 authorize.conf **规范（spec）**，其中包含最新的能力列表，因为这些列表可能会发生变化。


  到目前为止，你已经了解了通过 Splunk Web 创建/编辑现有角色的过程。一般来说，Splunk Enterprise 在文件系统上包含与 Splunk Web
  中显示的每个设置相对应的配置文件（.conf）。Splunk 会将你在 Splunk Web 中所做的每一项更改写入配置文件。让我们看一下 authorize.conf
  文件，其中包含*图 3.6* 中每个选项卡的角色配置详细信息。


  让我们看一下 admin 角色的示例 authorize.conf 片段。role_admin 在 Splunk 术语中被称为节（stanza），节的格式为 `role_<角色名称>`：


  ```

  [role_admin]

  # === 继承的角色 ===

  importRoles = power;user

  # === 能力 ===

  accelerate_datamodel   = enabled

  admin_all_objects      = enabled

  ### 许多此类能力已启用

  # === 其他设置 ===

  srchIndexesAllowed = *;_*

  srchIndexesDefault = main;os

  srchFilter          = *

  srchDiskQuota       = 10000

  srchJobsQuota       = 50

  ```


  默认情况下，authorize.conf 文件位于 $SPLUNK_HOME/etc/system/default 目录中。如果你想通过配置方式创建新角色，Splunk
  建议在 $SPLUNK_HOME/etc/system/local 系统目录或 `$SPLUNK_HOME/etc/apps/<app-name>/local`
  应用本地目录中创建本地目录。为了使对配置文件所做的更改生效，建议重启 Splunk 实例。


  有关所有 Splunk 配置文件的完整规范，请访问 $SPLUNK_HOME/etc/system/README 目录。你会找到扩展名为 .spec 和 .example
  的文件。关于角色就介绍到这里。我建议你通过 Splunk Web 和 authorize.conf 规范文件来实践创建角色，以熟悉相关术语。请逐一浏览*图 3.6*
  中显示的每个选项卡。


  下面让我们看看 Splunk 支持的身份验证方法。






  ## SAML


  SAML 可用于在 Splunk 平台上启用 SSO 身份验证方案，以便用户能够通过 SSO 身份识别登录。Splunk 平台支持 SAML 2.0 协议版本，并联系
  IdP 以检索用户的 SAML 组信息。与 LDAP 类似，SAML 组由 Splunk 管理员预先映射到 Splunk 角色。


  Splunk 提供了非常好的文档来配置基于 SAML 身份验证的 SSO。您可以参考此处的文档：https://tinyurl.com/294zrc8u。


  ## MFA


  MFA 由 Splunk 平台通过 Duo 和 RSA 安全机制支持，如图 3.7 所示。此方法将允许用户使用多个服务对 Splunk 平台进行身份验证以增强安全性。


  配置通过 Splunk Web 设置 | 身份验证方法 | 多因素身份验证菜单完成，选择其中一个单选按钮（Duo 或 RSA），然后单击“配置 Duo 安全”超链接，填写表单，然后单击“保存”按钮。


  如果您想深入了解详细步骤，请按照 Splunk 文档链接：https://tinyurl.com/sv8rnwhb。


  ## 脚本化身份验证


  Splunk 平台为诸如远程身份验证拨入用户服务（RADIUS）或可插拔身份验证模块（PAM）之类的外部系统提供基于脚本的身份验证方法。Splunk Web 中没有直接选项来配置它；但是，示例脚本可在
  SPLUNK_HOME/shared/authScriptSamples 下获得，您可以在其中按照 README 文件中的说明进行操作。


  ## 总结


  总之，角色、用户和身份验证方法共同保护 Splunk Enterprise 实例。我们首先了解了用户。他们是执行 Splunk 平台上所需操作和执行的首要实体。用户可以是管理员（admins）或由管理员创建的普通用户。我们通过
  Splunk Web 界面和 Splunk CLI 了解了创建新用户。之后，我们研究了角色为用户提供了什么。


  Splunk 遵循 RBAC 方法。角色由系统管理员创建和管理。Splunk 提供默认角色，并且可以通过继承它们通过新角色创建过程进行扩展。


  将用户分配给特定角色是 Splunk 中常用的解决方案，用于限制他们对某些操作的访问、限制他们对资源的消耗以及控制他们对索引的访问。角色中


  - 8. *选项 B* 是正确答案。Splunk 中没有 `roles.conf` 或 `capabilities.conf` 这样的文件。`authentication.conf`
  包含与身份验证相关的设置。

  - 9. *选项 C* 是正确答案。当在 Splunk 上本地添加用户时，他们不会针对 LDAP 进行身份验证，并且他们的凭据不会与 LDAP 同步。要启用 LDAP
  身份验证和同步，用户需要分配给映射到 Splunk 角色的适当 LDAP 组。这确保了他们的身份验证是在 LDAP 目录中执行的，并且对他们的帐户的任何更改或更新都与
  LDAP 服务器同步。

  - 10. *选项 C* 是正确答案。例如 – `https://splunkhostname:8000/en-US/account/login?loginType=splunk.`

