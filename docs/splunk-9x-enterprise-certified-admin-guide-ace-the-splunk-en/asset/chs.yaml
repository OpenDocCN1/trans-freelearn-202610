  \ = search）以及数据类型符号（a 表示字母数字，# 表示数字）。\n\n#### 查找\n\n查找是从外部源加载到 Splunk 中以丰富数据额外信息的。最常用的查找是\
  \ CSV 文件格式的内容和 KV Store（由 MongoDB 处理）。读取查找文件的流行 Splunk 搜索处理语言（SPL）命令是 input lookup\
  \ 和 lookup。Splunk 支持以下类型的查找。我们将在本章中学习有关 CSV 和 KV Store 支持的查找的内容：\n\n- 地理空间查找\n-\
  \ 外部查找\n- CSV 查找\n- KV Store 查找\n\n地理空间查找包含与世界各地相关地点的经度和纬度等地理空间信息。默认情况下，Splunk 随附美国信息和世界各国信息。你可以在搜索和报告应用程序中发出搜索请求\
  \ - | input lookup geo_countries - 并单击可视化选项卡，然后选择 Choropleth Map。\n\n**外部查找**，也称为**脚本化查找**，通过连接到外部源（例如\
  \ API）为 Splunk 中的事件获取额外信息。\n\n**CSV 查找**是最流行的查找，通常为 .csv 格式。数据管理员/用户定义包含在 Splunk\
  \ 中搜索数据时所需额外信息的 CSV 文件以进行丰富。CSV 查找本质上是静态的；因此，最佳做法是保持它们简单且尺寸较小。我们将在最后一节学习 CSV 查找的创建。\n\
  \n例如，通话记录日志包含以数字为前缀的国家代码，例如 +61、+1 等；但是，它没有国家名称。可以按如下方式定义并加载到 Splunk 中的 CSV 查找名称\
