- '# Splunk 9.x 企业版认证管理员指南：借助这本全面备考指南，顺利通过 Splunk 企业版认证管理员考试






  ## Contributors


  ## 关于作者


  **Srikanth Yarlagadda** 是一位经验丰富的 Splunk 安全顾问，专注于最大化 Splunk 平台的潜力以强化组织的网络安全态势。他的主要职责包括利用
  Splunk Enterprise 及其 **安全信息和事件管理 (SIEM)** 和 **安全编排、自动化与响应 (SOAR)** 功能。Srikanth 在为
  **安全运营中心 (SOC)** 团队监控、检测、调优和自动化安全威胁场景方面表现出色。


  凭借扎实的背景，Srikanth 在管理 Splunk Enterprise 方面拥有丰富的经验。他熟练地处理系统管理任务，并 expertly 协调来自各种来源的数据接入。他的专长还延伸到在电信领域开发各种业务用例，体现了
  Splunk 的强大功能。Srikanth 已获得以下官方 Splunk 认证：Splunk Enterprise Architect、Splunk Admin、Enterprise
  Security Admin 和 Splunk SOAR Developer。


  在他早期的职业生涯中，Srikanth 的 IT 之旅涉足了多个技术领域。他曾担任熟练的 Java 开发人员和熟练的 SOA 开发人员，甚至涉足使用 **Oracle
  Communications Services Gatekeeper (OCSG)** 和 Oracle SOA Suite 的电信协议实现领域。


  Srikanth 的专业知识还体现在他作为 SplunkTrust 成员的积极参与上，这是他贡献和奉献的证明。他在 Splunk 充满活力的社区论坛中频繁参与，在那里分享见解并与同好合作。


  *我非常感激那些给予我信任并提供机会的组织。他们对我的能力的信任推动我走到今天的阶段。*


  ## 关于审阅者


  **Trayton White**，自称“世界上最普通的 Splunk 巫师”，在其职业生涯中一直在多个行业 tinkering with systems。最近，他通过测试新
  Splunk 产品并开发技术所帮助解决的新颖用例来从事新 Splunk 产品的开发。通过采用“让我们试试看”的方法，他深入了解了 Splunk 的内部工作原理，并乐于与他人分享这些信息。


  *第 5 章，Splunk 索引管理，*介绍了 Splunk 中索引的概念，索引用于存储和管理数据。本章涵盖创建和管理索引、配置数据保留策略以及优化索引设置以实现高效的数据存储和检索。


  *第 6 章，Splunk 配置文件，*提供了有关 Splunk 配置文件的宝贵见解，配置文件在自定义和微调 Splunk 环境中发挥着关键作用。本章深入探讨各种配置文件，探索搜索时和索引时优先级，并提供使用
  btool 命令进行故障排除的指导。


  *第 7 章，探索分布式搜索，*是 *第 1 部分* 的最后一章。它深入探讨 Splunk 的分布式搜索能力，这涉及在各种 Splunk 实例中搜索和分析数据，包括对集群的介绍。本章涉及配置分布式搜索、检查知识包以及进行调整以最小化其大小。


  *第 8 章，获取数据，*是向 Splunk 导入数据的介绍。它探索用于数据输入的各种方法和来源，帮助您了解如何收集和准备数据以进行有效分析。


  *第 9 章，配置 Splunk 数据输入，*指导您完成在 Splunk 中设置数据输入的过程。您将学习如何配置诸如监控文件和目录、网络输入、脚本输入、**HTTP
  事件收集器 (HEC)** 和 Windows 输入等方法。这些步骤可确保从各种来源到 Splunk 实例的无缝数据流。


  *第 10 章，数据解析和转换，*将重点转移到数据操作。您将发现用于解析原始数据并将其转换为结构化格式的技术，从而实现有意义的分析和洞察。


  *第 11 章，字段提取和查找，*探索高级数据处理，重点关注搜索时和索引时字段提取，以从原始数据中发现有价值的信息。它还深入探讨使用查找来丰富数据以提供额外上下文。


  *第 12 章，自测模拟考试，*通过自测模拟考试强化您的学习。它提供练习问题和场景，以衡量您对本书 *第 1 部分* 和 *第 2 部分* 中所涵盖概念的理解。


  ## 如何充分利用本书


  要理解本书中的概念，您需要具备基础的 Splunk 用户技能，包括基本的搜索熟练度和对知识对象和字段的理解。此外，熟悉 Windows 和 Linux 操作系统是必不可少的。如果您打算参加
  Splunk Enterprise 管理员认证考试，获得 Splunk Core Power User 认证是先决条件。


  | 书中涵盖的软件/硬件 | 操作系统要求 |

  |---|---|

  | Splunk Enterprise 9.x | Windows 10/11 或 Linux |





