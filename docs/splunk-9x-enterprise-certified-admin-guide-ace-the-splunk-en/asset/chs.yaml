- '# 第 1 部分：Splunk 系统管理


  本《Splunk 9.x Enterprise 认证管理员指南》的初始部分全面介绍了运行 Splunk 的核心方面。这些章节为有效管理和配置 Splunk Enterprise
  提供了坚实的起点。*第 1 部分* 为有志成为熟练 Splunk 管理员的人奠定了坚实基础，涵盖了考试先决条件、重要的 Splunk 功能、经过验证的设置方法、许可证管理、用户访问控制、转发器管理、索引管理、探索配置文件以及实现分布式搜索（包括集群基础知识）等关键要素。这些章节将为您提供高效管理
  Splunk Enterprise 所必需的知识和技能。


  本部分包含以下章节：


  - *第 1 章，Splunk Enterprise 认证管理员考试入门*

  - *第 2 章，Splunk 许可证管理*

  - *第 3 章，Splunk 中的用户、角色和身份验证*

  - *第 4 章，Splunk 转发器管理*

  - *第 5 章，Splunk 索引管理*

  - *第 6 章，Splunk 配置文件*

  - *第 7 章，探索分布式搜索*

