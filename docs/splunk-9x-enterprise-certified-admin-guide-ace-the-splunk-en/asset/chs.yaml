- "### Splunk Enterprise 认证管理员考试入门\n\n让我们开始了解 Splunk Enterprise。学完本章后，您应该了解 Splunk\
  \ Enterprise 是什么及其丰富的功能集，并能够列出协同工作以从数据中获取业务洞察的 Splunk 组件。您还将学习如何在 Windows 环境中安装独立的\
  \ Splunk Enterprise，以及涵盖所有 Splunk 组件的高级 Splunk 验证架构（SVA）。在本书中，您会经常发现我们交替使用 Splunk\
  \ Enterprise 和 Splunk 这两个术语。它们都指产品本身。您很少会看到对 Splunk Inc. 的引用，该公司是开发和提供 Splunk Enterprise\
  \ 产品的公司。\n\n本章涵盖以下主题，帮助您入门：\n\n- 介绍认证考试\n- 考试中各主题的权重\n- 介绍考试的测试模式\n- 什么是 Splunk\
  \ Enterprise？\n- 介绍 Splunk 9.x Enterprise 功能\n- 理解 Splunk 组件\n- SVA\n- Splunk 安装——独立安装\n\
  - 自我评估\n\n不要被主题列表的长度吓到；这些主题将在本书其余部分详细深入介绍，让您充满信心地做好准备。\n\n现在您已经了解了主题及其权重，让我们来了解考试的测试模式。\n\
  \n### 介绍考试的测试模式\n\n考试包含 56 道题目，需在 57 分钟内完成。每道题最多有五个选项。有些题目有多个答案，属于*选择所有适用项*类别。其他题目则为*对或错*或*单项选择*。\n\
  \n以下是不同类别的示例问题及答案。\n\n### 对或错类别\n\n问：Splunk Enterprise 只能存储和检索基于文本的数据。\n\n- A. 对\n\
  - B. 错\n\n此处答案为选项 A。\n\n### 单项选择类别\n\n问：一个 UF 正在向 `index=linux_os` 发送数据，但该索引在索引器层不存在。在这种情况下，数据会发生什么？\n\
  \n- A. 由于尚未配置此类索引，数据将被索引器忽略\n- B. 索引器向 UF 抛出错误消息\n- C. 由于之前不存在，会自动创建一个 linux_os\
  \ 索引\n- D. 数据存储在 lostandfound 索引中\n\n此处答案为选项 A。\n\n### 多项选择类别\n\n问：Splunk 管理员用户默认拥有哪些功能？（选择所有适用项）\n\
  \n- A. 管理员可以远程安装 UF\n- B. 管理员可以创建另一个管理员用户\n- C. 管理员可以为非管理员用户组创建自定义角色\n- D. 管理员可以通过\
  \ GUI 重启 Splunk SH 实例\n\n此处答案为选项 B、C 和 D。\n\n让我们在下一节中开始学习 Splunk Enterprise。\n\n\
  ### 什么是 Splunk Enterprise？\n\nSplunk Enterprise 是一款软件，可从异构来源收集数据，并提供分析机器数据的接口。了解\
  \ Splunk Enterprise 有助于您在实际项目工作中根据出现的需求选择合适的功能。作为管理员，您需要充分了解 Splunk 的这些功能。该产品的主要功能如下：\n\
  \n- **收集文本数据**：Splunk Enterprise 只能收集和搜索文本数据。非文本数据不应存储在 Splunk Enterprise 中。\n-\
  \ **无模式**：Splunk 接受结构化、半结构化和非结构化数据，无需严格检查模式合规性。\n- **Web、命令行界面（CLI）和 REST 应用程序编程接口（API）**：Splunk\
  \ 提供三种标准接口——用于搜索、报告、告警和配置管理的 Web 界面；通过编程方式实现所有 Web 功能的 REST API；以及用于执行系统命令、配置 Splunk\
  \ 和运行搜索的 Splunk CLI。一般来说，Splunk 管理员使用此界面。\n- **搜索、报告和告警**：为了查询 Splunk Enterprise，它引入了专有的\
  \ SPL，该语言在其提供的每个界面中均用于检索数据。搜索支持数据检索，可以是临时搜索，也可以安排在一天中的特定时间运行。报告涉及存储可重复使用的搜索查询，可以安排或按需运行。最后，告警是一种计划搜索，当满足给定条件时会触发一组定义的操作——告警操作可能包括发送电子邮件或执行脚本等任务。\n\
  - **数据匿名化**：数据可能包含敏感信息，例如**个人身份信息（PII）**和**支付卡行业（PCI）**数据。例如，信用卡号和用户电话号码属于高度机密信息，仅限于特定员工群体可见或访问，这通常称为数据主权。为了符合组织的数据标准，Splunk\
  \ 提供在索引期间屏蔽或隐藏这些数据的功能。这可以防止查询 Splunk Enterprise 的用户发现这些敏感信息。我们将在*第 10 章，数据解析和转换*中进一步研究这一点，特别是在*数据匿名化*部分。\n\
  - **从单一部署扩展到分布式部署**：Splunk Enterprise 旨在适应各种部署规模，从单个服务器配置到大规模分布式设置。即使处理 PB 级数据量，它也能高效处理大量数据处理任务和用户支持。\n\
  - **高可用性（HA）和灾难恢复（DR）**：集群是指一组协同工作的 Splunk 实例，以实现 HA。多站点集群是指地理上冗余的集群协同工作以实现 DR。所有集群实例通过复制共享通用配置。\n\
  - **数据收集机制**：将数据导入 Splunk 是至关重要的一步，在包含各种数据源的大型企业中，这是一个持续的过程。Splunk 提供用于文件监控、网络输入、脚本输入和**HTTP\
  \ 事件收集器（HEC）**的 UF 代理，以支持无代理场景。同样，它还提供用于从 Linux、Windows、云、CRM 和网络设备等收集数据的 TA。附加组件可在\
  \ Splunk 网站（`https://splunkbase.splunk.com`）上获取。\n- **监控**：MC 应用程序是有效监督 Splunk 平台的工具。它提供对独立和分布式\
  \ Splunk 部署性能的洞察。该应用程序包括预配置的告警和仪表板，可启用这些功能以确保对平台整体健康状况和性能进行主动监控。\n\n让我们在下一节中看看 Splunk\
  \ 9.x 版本中新增的功能。\n\n### 介绍 Splunk Enterprise 9.x 功能\n\nSplunk Enterprise 多年来不断发展，在撰写本书时目前版本为\
  \ 9.0.3。随着它变得越来越先进，一些功能被弃用，并添加或增强了新功能。旧版本通常达到**生命周期终止（EOL）**，这意味着 Splunk 不再提供支持或修复错误，而是建议升级到最新版本。\n\
  \n本节涵盖 Splunk 8.x 版本中沿用至最新 9.0 产品版本的重要功能，以及 9.x 版本中引入的新功能。了解这些功能是有益的，但考试不涉及这些内容。如果您愿意，可以跳过本节：\n\
  \n- **Dashboard Studio**：这提供了创建可视化所需的工具，例如图形、图表和统计表，并支持颜色和图像。它补充了 Splunk 之前版本中存在的经典简单\
  \ XML 仪表板，但截至 8.2.6 版本并未取代它。\n- **联合搜索**：用于搜索本地 Splunk 部署之外的外部 Splunk 部署。本地 SH 向远程\
  \ SH 发起搜索请求，远程 SH 充当联合提供方。远程部署可以包含单个 SH 或集群。\n- **健康报告**：Splunk Web 有一个便捷的 *Splunk\
  \ 运行状况状态* 报告，以绿色、红色和黄色状态显示 Splunk 进程的运行状况。选择每个进程可进一步深入了解详细信息。健康报告帮助管理员快速了解平台状态，例如\
  \ I/O 等待、摄取延迟、数据持久性、搜索延迟、磁盘空间和跳过的搜索。\n\n\n\n\n\n在下一节中，我们将学习 Splunk Enterprise 组件。\n\
  \n## 了解 Splunk 组件\n\nSplunk Enterprise 拥有多个相互协作的核心组件，主要按其功能划分。列表非常全面。独立的 Splunk\
  \ 部署不需要所有组件；然而，分布式和高可用部署几乎需要所有组件。\n\n关于独立部署与分布式部署的详细理解将在本章的下一节 *Splunk Validated\
  \ Architectures (SVAs)* 中介绍。到本节结束时，你将熟悉两种类型的 Splunk 组件——即处理组件和管理组件。\n\n## 处理组件\n\
  \n以下是处理组件：\n\n- Forwarder\n- SH\n- Indexer\n\n让我们详细了解这些组件的作用以及它们与管理组件的关联。\n\n###\
  \ Forwarder\n\n顾名思义，它主要将数据从源转发到目标 indexer。有两种类型的 forwarder：\n\n- **Universal Forwarder\
  \ (UF)**\n- **Heavy Forwarder (HF)**\n\nUF 通常是安装在数据产生源系统上的软件代理。它包含一个输入配置（即 `inputs.conf`\
  \ 文件），其中列出了绝对文件路径以及诸如 index 和 sourcetype 之类的元数据字段。UF 是监控和将文件内容转发到指定 indexers 的首选方法。默认情况下，UF\
  \ 使用 fishbucket 进程来确保数据仅被索引一次，并通过 **cyclic redundancy checks (CRCs)** 和 seek 指针避免数据重复。你将在\
  \ *Chapter 9, Configuring Splunk Data Inputs.* 中找到有关额外支持的数据输入的更多信息以及关于 fishbucket\
