  +1, USA\n```\n\n报告可以通过将此查找与国家代码匹配来使用它，并为相关利益相关者检索国家名称以增强可读性。\n\n**KV Store 查找**由\
  \ MongoDB 处理，MongoDB 是一种 NoSQL 文档型数据库。KV Store 查找由称为 **集合** 的配置支持。信息以 KV 对的形式存储在集合中，并且集合中的每一行都由字段\
  \ `__key` 唯一标识。KV Store 查找适用于大型查找并且需要频繁更新。\n\n例如，与 IP 地址、DNS 和域相关的威胁情报源需要对名为 threat_intel\
  \ 的查找进行持续更新。threat_intel 查找由安全团队在排查组织网络日志中存储在 Splunk 中的潜在漏洞时使用。\n\n在本节中，我们了解了 Splunk\
  \ 字段对于搜索和检索数据的重要性。我们介绍了默认和内部字段，并使用通话记录日志的示例演示了自定义字段。我们还讨论了大小写敏感性、KV 对的自动提取以及 Splunk\
  \ Web 的正则表达式和分隔符提取方法。此外，我们还探讨了不同类型的查找文件类型，即将到来的部分将重点介绍 CSV 和 KV Store 查找。\n\n在下一节中，我们将学习搜索时字段提取。\n\
  \n### 创建搜索时字段提取\n\nSH 在执行搜索时提取中发挥着至关重要的作用。当用户发出搜索请求时，SH 执行搜索并作为流程的一部分执行搜索时字段提取。\n\
  \nSH 在搜索执行期间将定义的提取规则或模式应用于原始数据。它根据这些规则动态地从事件中提取相关字段及其关联值。然后提取的字段用于进一步分析、过滤、可视化或其他操作。\n\
