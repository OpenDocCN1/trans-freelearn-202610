  md: '# Getting Started with the Splunk Enterprise Certified Admin Exam


    Let’s get started with Splunk Enterprise. By the end of this chapter, you should
    understand what Splunk Enterprise is and its rich set of features and be able
    to list the Splunk components that work together to get business insights out
    of data. You will also learn about the installation of standalone Splunk Enterprise
    in a Windows environment, along with advanced Splunk Validated Architectures (SVAs)
    covering all the Splunk components. Throughout the book, you’ll often find us
    using the terms Splunk Enterprise and Splunk interchangeably. They both refer
    to the product itself. You will rarely find references to Splunk Inc., which refers
    to the company that developed and offers the Splunk Enterprise product.


    This chapter covers the following topics to get you started:


    +   - Introducing the certification exam

    +   - The weightage of topics in the exam

    +   - Introducing the exam’s test pattern

    +   - What is Splunk Enterprise?

    +   - Introducing Splunk 9.x Enterprise features

    +   - Understanding Splunk components

    +   - SVAs

    +   - Splunk installation—standalone

    +   - Self-assessment'
