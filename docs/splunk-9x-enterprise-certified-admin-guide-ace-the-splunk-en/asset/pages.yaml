- pgno: 100
  md: '+   - **Parameters:** homePath, coldPath, thawedPath, app, and so on

    +   - **Example:** $SPLUNK_HOME\bin\splunk add index windows-event-logs -app search


    Both the CLI and Splunk Web approaches write to the indexes.conf file on the filesystem.
    If you are familiar with the indexes.conf specification, then creating an indexes.conf
    file directly achieves the same purpose.


    # indexes.conf explained


    Let’s deep dive into the indexes.conf file for the windows-event-logs index that
    we have created through Splunk Web. As we learned in the Splunk Web section, the
    index has by default been saved to the Search & Reporting app folder called search,
    hence I can find it at $SPLUNK_HOME/etc/apps/search/local:


    ```

    [windows-event-logs]

    coldPath = $SPLUNK_DB\windows-event-logs\colddb

    enableDataIntegrityControl = 0

    enableTsidxReduction = 0

    homePath = $SPLUNK_DB\windows-event-logs\db

    maxTotalDataSizeMB = 500

    thawedPath = $SPLUNK_DB\windows-event-logs\thawedd b

    ```


    One of the advantages of this approach is there is a range of options that can
    be set for advanced index configurations. However, the creation of a new index
    through this file-based approach requires the Splunk instance to be restarted.


    There are ways to control the size of data from the bucket directory level to
    the total index size. Let’s take a look at the following advanced options and
    what to back up:


    +   - homePath.maxDataSizeMB limits the homePath directory size for hot and warm
    buckets.

    +   - coldPath.maxDataSizeMB limits the coldPath directory size for cold buckets.

    +   - To limit the number of hot and warm buckets that can be created, set maxHotBuckets
    and maxWarmDBCount, respectively. For high-volume indexes, where the indexing
    size is more than 10 GB/day, Splunk suggests increasing maxHotBuckets from the
    default of 3 to 10.

    +   - By default, Splunk limits the hot bucket size to 750 MB through maxDataSize
    = auto, and if the index size per day estimation is 10 GB, set this option to
    maxDataSize = auto_high_volume for Splunk to create 10 GB hot buckets on 64-bit
    systems. The reason for having this option is to avoid creating too many small
    buckets for large indexes. Having too many small buckets affects Splunk’s performance.
    Hot buckets will roll to warm buckets once they reach their maximum size and then
    a new hot bucket will be created.'
  merge: -1
