- pgno: 199
  md: '# Reviewing answers


    I hope you recall the concepts that we learned about in this chapter through these
    questions. Let’s review the answers:


    +   1. *Option B* is the correct answer. The three main phases in the data indexing
    process are input, parsing, and indexing.

    +   2. *Options B, C, and E* are the right answers. You could apply the `props.conf`
    settings through `[sourcetype_name]`, `[source::<source_name_or_pattern>]`, or
    `[host::<hostname_or_pattern>]` stanza syntax.

    +   3. *All options* are correct. During the parsing phase, metadata fields such
    as `sourcetype`, `host`, and `source` can be overridden, and the index can be
    altered for re-routing specific events matching certain criteria and data masking.
    In addition, you can filter events that meet certain criteria and then drop those
    events from indexing.

    +   4. *Option C* is correct. The remaining options are incorrect; no such queues
    exist in Splunk.

    +   5. The answer is false. The `SEDCMD-<class> = "<sed style regular expression>"`
    setting belongs to the `props.conf` file.

    +   6. *Option C* is correct. 500 MB is the file size limit for uploads via the
    **Set Source Type**/data preview feature in Splunk Web.

    +   7. *Yes, that’s right.* The source type definition will be saved to the `props.conf`
    file.

    +   8. *Option A* is correct. In the `props.file` setting, `TRANSFORMS-<class_name>
    = <transform_stanza_1>,< transform_stanza_2>,...<transform_stanza_n>` is the right
    syntax. `<class_name>` is a unique literal string. More than one transforms stanza
    can be assigned; if you separate them with a comma (,), they will be executed
    in the specified order.

    +   9. *No.* Data masking is a parsing phase action, and it only applies to newly
    ingested data in Splunk. Already ingested data from the past will not be affected.
    To apply the same parsing phase settings to historical data, it must be deleted
    and re-ingested.

    +   10. *Option A* is correct. `LINE_BREAKER` allows you to specify how the raw
    data stream should be broken into individual events. By default, Splunk breaks
    the raw data stream into events based on the new line terminator (`\n`).'
