  md: 'Figure 11.18: Lookup verification


    In the next section, we will learn about KV Store lookups.


    # KV Store lookups


    KV Store lookups require a collection to be created upfront before the creation
    of a lookup definition. Splunk Web doesn’t offer the creation of collections through
    the UI. Instead, a Splunk-supported app – Splunk App for Lookup file editing (aka
    Lookup Editor) – at splunkbase.com helps to create it.


    Follow the installation steps for the app at https://splunkbase.splunk.com/app/1724
    and install it in your Splunk instance. The app does the following high-level
    steps for the creation of KV Store lookups:


    +   - Creates a collection (`collections.conf`)

    +   - Creates a lookup definition


    We are using the same `country_code`, `country_name` lookup that we created in
    the previous section for KV Store as well:


    +   1. After installation, launch Splunk App for Lookup File Editing from the
    Apps menu. In the top-right corner, click on Create a New Lookup | KV Store Lookup.
    Figure 11.19 shows the options. It will open a page to create a new lookup:


    ```

    inputlookup phone_no_country_code_to_name

    ```


    | country_code | country_name |

    |---|---|

    | +61 | Australia |

    | +91 | India |

    | +1 | USA |

    | +47 | Norway |

    | +358 | Finland |

    | +33 | France |

    | +44 | UK |'
