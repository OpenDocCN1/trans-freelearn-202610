- pgno: 150
  md: 'As you can see, the first method is a one-time **Upload** method used to add
    data to Splunk in one go. The maximum file size for upload is 500 MB.


    The second **Monitor** option gets data by monitoring the files and ports on the
    machine Splunk is installed on. This method allows the use of a number of data
    input options, such as turning the instance into an HEC receiver, enabling network
    ports to listen for TCP/UDP traffic, and configuring a script to pull data payloads
    from an API at defined intervals.


    The third option in the preceding figure is **Forward**, which is specifically
    designed for a single-instance deployment of Splunk Enterprise where the Splunk
    instance serves as both the indexer and the deployment server. When selecting
    the **Forward** option, you can choose from the list of already connected Forwarder
    clients. The subsequent steps enable you to configure the specific data inputs
    that can be set up on the Forwarder.


    Let’s quickly look at the **Upload** option. The **Upload** option is a useful
    feature for quickly testing a data sample and identifying event line breaks. It
    allows you to upload a data file to Splunk for analysis, enabling you to identify
    how events are being broken down within the data. This can be particularly helpful
    in troubleshooting and understanding the structure of your data before configuring
    inputs or parsing settings in Splunk. You can also choose from suitable pre-trained
    source types during this process and can customize the source type live by altering
    the <Key> = <value> settings and observing the outcome.


    For demonstration purposes, I am using the following access log information saved
    to my local system with the name web-access.log. The file’s contents are as follows:


    ```

    127.0.0.1 - - [23/Apr/2023:10:28:12 -0400] "GET /index.html HTTP/1.1" 200 1240

    127.0.0.1 - - [23/Apr/2023:10:28:13 -0400] "GET /styles.css HTTP/1.1" 200 876

    127.0.0.1 - - [23/Apr/2023:10:28:15 -0400] "GET /scripts.js HTTP/1.1" 200 432

    192.168.0.1 - - [23/Apr/2023:10:28:17 -0400] "GET /images/logo.png HTTP/1.1" 200
    34012

    192.168.0.1 - - [23/Apr/2023:10:28:19 -0400] "GET /about.html HTTP/1.1" 404 345

    127.0.0.1 - - [23/Apr/2023:10:28:21 -0400] "GET /contact.html HTTP/1.1" 200 2089

