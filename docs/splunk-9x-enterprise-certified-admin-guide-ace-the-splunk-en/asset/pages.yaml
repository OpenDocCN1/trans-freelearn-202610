    +   2. An indexer is a Splunk instance. What is its role in a Splunk deployment?
    (Choose all that apply)\n   A. The indexer stores data.\n   B. The indexer stores
    data in $SPLUNK_HOME location.\n   C. The indexer responds to search requests
    issued by the search head.\n   D. Data stored in the indexer cannot be deleted.\n   E.
    The indexer by default comes with internal indexes. You can create custom indexes
    too.


    +   3. Do metrics indexes store any type of text data?\n   A. Yes\n   B. No'
