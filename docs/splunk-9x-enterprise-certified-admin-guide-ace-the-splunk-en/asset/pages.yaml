- pgno: 102
  md: '# Backing up indexes


    So far, we have created indexes and stored information in buckets, and modified
    their configurations in the .conf file. What if the underlying hardware fails
    and you have critical data and files that cannot be lost? To restore your Splunk
    instance to its original state, a backup procedure must be set up. For the certification
    exam, it is important to know which folders of the Splunk installation to back
    up. The following two essential folders need to be backed up:


    +   - The $SPLUNK_DB directory: $SPLUNK_HOME/var/lib/splunk/

    +     Hot buckets cannot be backed up while Splunk is running; instead, a snapshot
    can be taken incrementally, and you can take a backup of the snapshot

    +   - The $SPLUNK_HOME/etc directory: This contains apps, user configurations,
    system configuration files, and licenses


    In Splunk, the $SPLUNK_HOME/etc directory is a critical directory that contains
    configuration files and settings that control the behavior of the entire Splunk
    deployment. Backing up this directory is essential to ensure that all configurations
    and customizations are safeguarded and can be restored in case of any unexpected
    issues or system failures.


    That is everything we’re going to cover about the creation of indexes; we ended
    with what to back up. At this stage, you should be familiar with core index concepts
    and advanced configuration options. Let’s take a look at monitoring indexes in
    the following section.


    # Monitoring Splunk indexes


    As an administrator, it can be overwhelming to monitor several indexes as they
    grow in number. To address this, Splunk monitors indexes through a default monitoring
    console app. It has many monitoring features, and monitoring indexes is one of
    them. Let’s take a look at its menu options.


    Log in as an administrator and navigate to Settings in the top right. Click on
    Monitoring Console. The console opens in the following web view. Click on Indexing
    and select Index Detail: Instance.


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_102_0.png)


    Figure 5.4: Indexes dashboard in the monitoring console'
  merge: -1
  img_proc: true
