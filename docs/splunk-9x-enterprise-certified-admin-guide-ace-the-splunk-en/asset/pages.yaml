- pgno: 23
  md: 'Don’t be alarmed by the length of the topic list; the topics are covered in
    thorough detail in the rest of this book, to get you prepared with confidence.


    Now that you have an idea of the topics and their weightage, let’s understand
    the exam’s test pattern.


    # Introducing the exam’s test pattern


    The exam contains 56 questions to be answered in 57 minutes. Each question has
    at most five options. Some of the questions will have more than one answer, under
    the *Select all that apply* category. Others are either *true or false* or *single-answer*.


    The following are sample questions of the different categories with answers.


    # True or false category


    Q. Splunk Enterprise is only able to store and retrieve text-based data.


    +   A. True

    +   B. False


    Here, the answer is option A.


    # Single-answer category


    Q. A UF is sending data to `index=linux_os`, which does not exist on the indexer
    layer. What happens to the data in this scenario?


    +   A. Since no such index has been configured, the data will be ignored by the
    indexer

    +   B. The indexer throws an error message to the UF

    +   C. A linux_os index is automatically created since it did not exist before

    +   D. The data gets stored in the lostandfound index


    Here, the answer is option A.


    # Multiple-choice category


    Q. A Splunk admin user has, by default, which capabilities? (Select all that apply)


    +   A. Admin can install the UF remotely

    +   B. Admin can create another admin user

    +   C. Admin can create a custom role for a group of non-admin users

    +   D. Admin can restart a Splunk SH instance through the GUI


    Here, the answers are options B, C, and D.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Let’s get started with learning about Splunk Enterprise in the following section.


    # What is Splunk Enterprise?


    Splunk Enterprise is software that collects data from heterogeneous sources and
    provides interfaces to analyze machine data. Getting to know Splunk Enterprise
    helps you to choose the right feature for the needs or requirements that will
    come through while you are working on real-time projects. As an administrator,
    it is highly expected that you are well aware of these capabilities of Splunk.
    Key features of this product are explained as follows:


    +   - **Collecting text data**: Splunk Enterprise can only collect and search
    text data. Non-textual data should not be stored in Splunk Enterprise.

    +   - **Schemaless**: Splunk accepts structured, semi-structured, and unstructured
    data, and no strict checking of schema compliance is needed.

    +   - **Web, command-line interface (CLI), and REST application programming interface
    (API) interfaces**: Three standard interfaces are offered by Splunk—web for searching,
    reporting, alerting, and configuration management; REST API to enable all the
    web functions through programmatic access; and Splunk CLI for executing system
    commands, configuring Splunk, and running searches. In general, Splunk Administrators
    use this interface.

    +   - **Searching, reporting, and alerting**: To query Splunk Enterprise, it has
    introduced a proprietary SPL, which is used in every interface it offers to retrieve
    the data from it. Searching enables data retrieval, which could be ad hoc or scheduled
    to run at a particular time of the day. Reporting involves a reusable search query
    that is stored and can be scheduled or run on demand. Finally, alerting is a scheduled
    search and triggers a defined set of actions when a given condition is met—an
    alert action could involve tasks such as sending an email or executing a script.

    +   - **Anonymizing data**: Data can contain sensitive information, such as **Personally
    Identifiable Information (PII)** and **Payment Card Industry (PCI)** data. For
    example, credit card numbers and user phone numbers are highly classified and
    restricted to only being visible or accessible to a particular group of employees,
    which is broadly called data sovereignty. To comply with the data standards of
    an organization, Splunk offers the capability to mask or hide this data during
    indexing. This prevents users that are querying Splunk Enterprise from discovering
    this sensitive information. We will study this further in *Chapter 10, Data Parsing
    and Transformation*, specifically in the *Data Anonymization* section.

    +   - **Scaling from single to distributed deployment**: Splunk Enterprise is
    designed to accommodate various deployment sizes spanning from individual server
    configurations to extensive distributed setups. It excels in handling substantial
    data processing tasks and user support efficiently, even when dealing with data
    volumes in the realm of petabytes.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '+   - **High availability (HA) and disaster recovery (DR)**: Clustering refers
    to a group of Splunk instances that work together to enable HA. Multi-site clustering
    refers to geographically redundant clusters working together for DR. All clustering
    instances share common configurations through replication.

    +   - **Data collection mechanisms**: Getting data into Splunk is a crucial stage
    that is a continuous process in large enterprises that comprise various data sources.
    Splunk provides a UF agent for file monitoring, network inputs, scripted inputs,
    and **HTTP Event Collector (HEC)** for agentless scenarios. Similarly, it provides
    TAs for collecting data from Linux, Windows, the cloud, CRM, and network devices,
    and so on. Add-ons are available on the Splunk website (`https://splunkbase.splunk.com`).

    +   - **Monitoring**: The MC application functions as a tool for effectively supervising
    the Splunk platform. It offers insights into the performance of both standalone
    and distributed Splunk deployments. The application includes preconfigured alerts
    and dashboards that can be enabled to ensure proactive monitoring of the platform''s
    overall health and performance.


    Let''s look at the newly introduced features in version 9.x of Splunk in the following
    section.


    # Introducing Splunk Enterprise 9.x features


    Splunk Enterprise has evolved over the years and currently stands at version 9.0.3
    at the time of writing this book. As it gets more advanced, some of its features
    become deprecated and new features are added or enhanced. Older versions often
    reach **end of life (EOL)**, which means Splunk won''t offer support or fix bugs;
    instead, it advises upgrading to the latest version.


    This section covers the important features of Splunk version 8.x that have been
    carried forward to the latest 9.0 product version, along with new features introduced
    in the 9.x version. These features are good to be aware of but are not tested
    in the exam. Feel free to skip this section if you want to:


    +   - **Dashboard Studio**: This provides the necessary tools to create visualizations,
    such as graphs, charts, and statistical tables, with colors and images. It complements
    the classic simple XML dashboard that existed in previous versions of Splunk but
    does not replace it as of version 8.2.6.

    +   - **Federated search**: This is used to search remote Splunk deployments that
    are outside of the local Splunk deployment. Local SH initiates search requests
    to remote SH, which acts as a federation provider. Remote deployment could consist
    of a single SH or cluster.

    +   - **Health report**: Splunk Web has a handy *Health status of Splunk* report
    that displays the health of Splunk processes in green, red, and yellow states.
    Selecting each process further drills down into the detailed information. The
    health report helps admins to get a quick understanding of the platform status,
    such as I/O wait, ingestion latency, data durability, search lag, disk space,
    and skipped searches.'
  merge: -1
  img_proc: true
