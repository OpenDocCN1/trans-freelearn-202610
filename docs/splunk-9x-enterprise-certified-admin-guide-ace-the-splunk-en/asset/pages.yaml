- pgno: 30
  md: '![](img/5319cbd6f078c6cda7fac6347f77a07d_30_0.png)


    Figure 1.3: Indexers receiving data from forwarders and storing it in indexes


    So far, we have gone through the processing components and their roles in a Splunk
    Enterprise deployment. Let us go through the management components in the following
    section.


    # Management components


    These are management components that support the processing components:


    +   - Deployment Server (DS)

    +   - SHC Deployer (SHC-D)

    +   - Indexer CM

    +   - License Manager (LM)

    +   - MC


    We’ll discuss them in the following subsections.


    # DS


    A standalone Splunk Enterprise instance is used to manage the forwarders. The
    forwarders, which are located at the data source (typically a UF), often need
    new configurations to monitor new files or changes to an existing configuration
    followed by an optional restart. Changing them manually is a very time-consuming
    task in larger infrastructures. That’s where the DS comes to the rescue, by maintaining
    a central repository of configurations in the form of apps. In addition to UFs,
    HFs can also be centrally managed using a DS.'
  merge: -1
  img_proc: true
