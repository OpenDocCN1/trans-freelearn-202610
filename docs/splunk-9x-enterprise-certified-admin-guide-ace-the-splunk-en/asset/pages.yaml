- pgno: 14
  md: '*Chapter 5, Splunk Index Management,* introduces the concept of indexes in
    Splunk, which are used to store and manage data. This chapter covers creating
    and managing indexes, configuring data retention policies, and optimizing index
    settings for efficient data storage and retrieval.


    *Chapter 6, Splunk Configuration Files,* provides valuable insights into Splunk''s
    configuration files, which play a pivotal role in customizing and fine-tuning
    the Splunk environment. This chapter delves into various configuration files,
    explores search-time and index-time precedence, and provides guidance on troubleshooting
    using the btool command.


    *Chapter 7, Exploring Distributed Search,* is the final chapter of *Part 1*. It
    delves into Splunk''s distributed search abilities, which entails searching and
    analyzing data across various Splunk instances, including an introduction to clustering.
    This chapter addresses configuring distributed search, examining the knowledge
    bundle, and making adjustments to minimize its size.


    *Chapter 8, Getting Data In,* serves as an introduction to ingesting data into
    Splunk. It explores various methods and sources for data input, helping you understand
    how to collect and prepare data for effective analysis.


    *Chapter 9, Configuring Splunk Data Inputs,* guides you through the process of
    setting up data inputs in Splunk. You''ll learn how to configure methods such
    as monitoring files and directories, network inputs, scripted inputs, **HTTP Event
    Collector (HEC)**, and Windows inputs. These steps ensure a seamless data flow
    from various sources into your Splunk instance.


    *Chapter 10, Data Parsing and Transformation,* shifts the focus to data manipulation.
    You''ll discover techniques for parsing raw data and transforming it into a structured
    format, enabling meaningful analysis and insights.


    *Chapter 11, Field Extractions and Lookups,* explores advanced data processing,
    focusing on search-time and index-time field extractions to uncover valuable information
    from raw data. It also delves into the use of lookups to enrich your data with
    additional context.


    *Chapter 12, Self-Assessment Mock Exam,* reinforces your learning with a self-assessment
    mock exam. It provides practice questions and scenarios to gauge your comprehension
    of the concepts covered in *Part 1* and *Part 2* of the book.


    # To get the most out of this book


    To understand the concepts in this book, you will need fundamental Splunk user
    skills, including basic search proficiency and an understanding of knowledge objects
    and fields. Additionally, familiarity with Windows and Linux operating systems
    is essential. If you aim to take the Splunk Enterprise Admin certification exam,
    acquiring the Splunk Core Power User certification is a prerequisite.


    | Software/hardware covered in the book | Operating system requirements |

    |---|---|

    | Splunk Enterprise 9.x | Windows 10/11 or Linux |'
