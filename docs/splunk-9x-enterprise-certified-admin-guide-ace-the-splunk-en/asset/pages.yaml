- pgno: 118
  md: 'Let’s understand the components:


    +   - `--debug`: This option shows the absolute path of the conf file’s location
    in the system, app, or users directory. Similar to the `--debug` option, there
    are many useful options available. To view the full list, issue the following
    command – `$SPLUNK_HOME/bin/splunk help btool`.

    +   - `--user`: This option displays the configuration data visible to the given
    user.

    +   - `--app`: This option displays the configuration data visible from the given
    app.

    +   - `<conf_file_prefix>`: This refers to the prefix used in the names of various
    configuration files – for example, props, inputs, indexes, and transforms.


    Let’s see a btool command example for the indexes.conf file with the --debug option:


    ```

    ./splunk btool indexes list --debug

    ```


    In the given example, the btool command was used to list the indexes in debug
    mode. We will get the following output – as you can see in the following figure,
    the indexes list --debug option shows the absolute path of the conf file and each
    setting associated with the index name _internal.


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_118_0.png)


    Figure 6.3: The btool command result for indexes.conf


    Another useful btool command is to find out whether there are any typos in a conf
    file. It usually runs every time a Splunk instance is started. The syntax is as
    follows:


    ```

    ./splunk btool check

    ```


    Remember these facts about btool:


    +   - The output generated by btool may not reflect the current state of the loaded
    memory. In the event that a change is made to a configuration file that requires
    a service restart, the btool report may reflect this change, even though it has
    not yet been applied in the active system state.

    +   - btool is unsupported by Splunk; however, it is very powerful and useful.
    When dealing with Splunk support cases, they might ask for a Splunk diag report,
    which includes the btool report output.

    +   - When viewing an inputs.conf file with btool, the [default] stanza settings
    are not shown in the output.

    +   - You can execute a btool command without requiring the Splunk process to
    be in a running state.'
