- pgno: 47
  md: '# Splunk License Management


    One of the key responsibilities of a Splunk system administrator is license management,
    When you install Splunk Enterprise for the first time, either for personal or
    commercial use, you need to configure the license to enable its functionality;
    otherwise, its default license validity will expire in 60 days. By the end of
    this chapter, you should understand license types, installation, how Splunk licensing
    works, license allocation, and license violations, and we will conclude with the
    license usage report in the Monitoring Console.


    The overall goal of this chapter is to familiarize you with Splunk licensing so
    that you will be able to choose the right license type, stack your license file
    if you have more than one type, and configure and allocate the right volumes to
    peers. In this chapter, we will cover the following topics:


    +   - Introducing license types

    +   - Understanding license warnings and violations

    +   - How licensing works

    +   - Installing, managing, and monitoring licenses


    # Introducing license types


    Before directly jumping into the subject of types, let''s discuss the need for
    licenses. Splunk Enterprise is paid proprietary software that provides services
    to organizations that need a data platform that aligns with their business objectives.
    Splunk sells these services in the form of licenses to organizations to activate
    the Splunk Enterprise product. If you need help choosing the correct license for
    your use case, you can contact the Splunk sales team (sales@splunk.com).


    We will discuss the types of Splunk licenses in the following sections.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# The Splunk Enterprise Trial license


    The Trial license is enabled by default when you first install Splunk Enterprise.
    The Trial license has the following features:


    +   - It is valid only for 60 days. After this period, other license types must
    be selected to continue using the product.

    +   - It allows you to use the full features of Splunk Enterprise.

    +   - It works only for single/standalone Splunk Enterprise instances.

    +   - The license limits data ingestion to 500 MB per day. Beyond this, Splunk
    will raise a license warning. License violation is explained in detail in the
    *Understanding license warnings and violations* section.


    # The Splunk Free license


    The Free license is valid forever and supports only a subset of Splunk Enterprise
    features:


    +   - It disables alerting, authentication, clustering, distributed search, summaries,
    and forwarding to non-Splunk servers.

    +   - The daily data ingestion limit is 500 MB. License violations block the search
    functionality. More details are provided in the next section, *Understanding license
    warnings and violations*.

    +   - It works only for single/standalone Splunk instances.


    # The Forwarder license


    Splunk offers a variety of forwarders. The most popular ones are the **universal
    forwarder (UF)** and **heavy forwarder (HF)**. Let''s see how this license applies
    to the two main types of forwarders:


    +   - The UF is by default embedded with the license, so there is no need for
    explicit license installation/configuration.

    +   - The UF is separate binary software, and it consumes fewer resources than
    the HF. The UF is able to forward data to indexers with authentication.

    +   - The HF is a full Splunk Enterprise instance binary that requires either
    a Forwarder license or an Enterprise license.

    +   - The Forwarder license is by default embedded into the Splunk Enterprise
    package.

    +   - No indexing is allowed on HFs with the Forwarder license. However, authentication
    is allowed.

    +   - HFs that require indexing, advanced authentication, and the KV Store need
    the Enterprise license.'
  merge: -1
  img_proc: true
- pgno: 49
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The Developer license is purely for app developers and enables all the Splunk
    Enterprise features. Every license enforces limits – for example, licenses are
    limited to a number of days, data volume, vCPU count, and so on. The following
    section elaborates on the generation of license warnings, how they transition
    to violations, and subsequently details the specific features that Splunk Enterprise
    restricts for each license type.


    # Understanding license warnings and violations


    Understanding license limitations and their impact on the Splunk Enterprise platform
    is very important if system administrators want to maintain the continuity of
    their platform. The license types, whether purchased from Splunk or free, enforce
    limits, except the infrastructure license, which counts the number of vCPUs and
    doesn’t enforce license violation limitations. The rest of the license types enforce
    limits on data volume or indexed data volume per day.


    If a license exceeds the allowed data volume per day, Splunk Enterprise will raise
    a license warning. When the number of warnings exceeds a certain threshold, it
    is called a license violation. The thresholds differ for every license type. A
    license violation disables the important features of Splunk Enterprise.


    License warnings appear in Splunk web administrative messages. They persist for
    a number of days in order for system administrators to resolve them. License usage
    alerts can be enabled in the monitoring console.


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_50_0.png)


    Figure 2.1: Monitoring console alerts – license usage and expiry


    Figure 2.1 shows the alerts you can receive in the monitoring console. They are
    disabled by default; you can enable them and discover how they work in the event
    that usage is close to the daily quota and/or your license is near expiry.


    License violation disables important Splunk features, which means that only a
    subset of features will be available during the violation period. Let’s see what
    happens to search and indexing in a violation period:


    +   - Search functionality, which includes reports and alerts, will be blocked,
    except for internal indexes such as _internal, _audit, and _introspection

    +   - Indexing of data will continue for indexers'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Let’s discuss the threshold for warnings and violations for each license type:


    +   - **Splunk Enterprise Trial license:** Five or more warnings in a rolling
    30-day period is a violation. License warnings persist for 14 days. During the
    violation period, searching is blocked and indexing continues. If you wish to
    fix the license violation to restore the search functionality, there is no reset
    option. The suggested approach is to reinstall the whole Splunk Enterprise instance.

    +   - **Splunk Free license:** Three or more warnings in a rolling 30-day period
    is a violation. License warnings persist for 14 days. During the violation period,
    searching is blocked and indexing continues. Similarly to the Trial license, the
    Free license cannot be reset, and reinstallation is the only option.

    +   - **Splunk Enterprise license:** A license stack with 100 GB or greater data
    volume per day does not enforce license warnings and violations. A license stack
    with less than 100-GB data volume per day does raise license warnings. 45 or more
    warnings in a rolling 60-day period is a violation, and searching is blocked while
    indexing continues. To reset the Enterprise license, contact the Splunk sales
    team; it will be able to unlock the required search features.

    +   - **Splunk Enterprise infrastructure license:** No violations are raised for
    this license type.

    +   - **Splunk Developer license:** Five or more warnings in a rolling 30-day
    period is a violation. License warnings persist for 14 days. During the violation
    period, searching is blocked and indexing continues. The Developer license can
    be reset to unlock the search features by contacting the Splunk developer program
    team at devinfo@splunk.com.

    +   - **Splunk Forwarder license:** No violation rules are applicable to the Forwarder
    license. It is an embedded license in the Splunk Enterprise package. Indexing
    on the Forwarder license requires either an Enterprise or infrastructure license.


    In conclusion, Splunk license warnings tell administrators upfront how the overall
    license usage is so that they can take the required action before a violation
    occurs. A sequence of warnings exceeding the defined threshold over a period of
    time will lead to a violation. During the violation period, searching gets blocked
    except for internal indexes, and indexing continues. Neither the Enterprise stack
    license over 100 GB nor the Enterprise infrastructure license will enforce violations,
    but the rest of the license types enforce violation rules. A violated license
    can be reset, except for the Free and Trial ones.


    We have covered a lot of information about license warnings and violations; however,
    you might have wondered at what stage Splunk Enterprise tracks license usage,
    and which component tracks the usage in distributed deployment architectures.
    The following two sections will focus on license installation in a license manager
    component, and we will discuss in detail how exactly licensing works with regard
    to license usage calculations.


    # How licensing works


    Splunk Enterprise licensing tracks the indexed data volume per day against a license
    stack or individual pools. To deep-dive into license groups, stacks, and pools,
    refer to the Splunk documentation:


    ```

    https://docs.splunk.com/Documentation/Splunk/9.0.3/Admin/

    ```'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'Groups, stacks, pools, and other terminology. The contents of this documentation
    are covered in the next section, Installing, managing, and monitoring licenses.


    In a distributed infrastructure, a dedicated Splunk Enterprise instance will be
    assigned a license manager role, which keeps track of the license usage of the
    whole deployment. The rest of the instances act as license peers reporting to
    the manager.


    The license quota is measured every day, from midnight to midnight, which means
    it will get reset to the full quota for the next day’s processing, and it’s a
    continuous process that works in conjunction with the system clock of the manager.
    Splunk supports two types of indexes, called events indexes and metrics indexes.
    They are covered in Chapter 5, Splunk Index Management. License usage calculations
    are capped to a fixed 150 bytes per metric event for metrics indexes and, for
    event indexes, the full data size of the events.


    The original data from the source will go through various phases before getting
    indexed to indexers. The data size is measured at the indexing phase. Phases are
    explained in Chapter 8, Getting Data In. So far, we have talked about data being
    indexed from external sources. There is a heap of data that is generated locally
    on every running Splunk Enterprise instance. It is stored in internal indexes
    that start with _ (underscore), namely _internal, _audit, _introspection, _metrics,
    and _telemetry.


    Let’s see which data doesn’t count in the license quota:


    +   - Splunk internal logs don’t count

    +   - Replicated copies are stored in the indexer cluster for high availability

    +   - Summary indexes with the stash source type

    +   - Indexed data, as it contains tsidx files, metadata, and so on to enable
    faster retrieval


    In conclusion, license quotas are measured every day, from midnight to midnight.
    The data size is calculated during the indexing phase. Metrics index data is capped
    at 150 bytes per event, and event index data is calculated based on the full size
    of the events. Internal logs, summary indexes, and replicated data don’t get measured
    against the license. A dedicated instance works as the license manager, in which
    the license file is installed and configured; the remaining instances function
    as license peers and report to the license manager in a distributed deployment.


    # Installing, managing, and monitoring licenses


    Now that you have a comprehensive understanding of license types and how license
    usage is calculated against the license quota, we will discuss adding, configuring,
    and managing a license. As a system administrator, these tasks are quite important.
    We will take the example of the Splunk Enterprise license type to discuss the
    following topics:


    +   - Adding a license

    +   - License stacking and pools'
  merge: -1
  img_proc: true
- pgno: 53
  md: '+   - License manager and license peer

    +   - License usage and alerting


    Let’s discuss each of these in detail in the following sections.


    # Adding a license


    A Splunk Enterprise license is a file with the .license extension, which is generally
    purchased from Splunk. The following steps are applicable to other types of license,
    such as the Developer license.


    A license file can be added to Splunk in either of the following two approaches:


    +   - On the Splunk web home page (https://<hostname>:8000), go to the menu in
    the top-right corner of the window and navigate to Settings | Licensing. Click
    on the Add license button, and on the next screen, select Choose File to upload
    a .license file obtained from Splunk sales. Then, click the Install button. At
    this stage, you are required to restart the Splunk instance. The following screenshot
    shows the licensing web page, and you can see the Add license button, which is
    used to upload a license file.


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_53_0.png)


    Figure 2.2: The Licensing web page


    +   - The second approach is to execute a CLI command on the host the Splunk instance
    runs on. You should have access and execution permissions to the host where Splunk
    license manager is installed. A restart is required after the successful command
    execution:


    ```

    splunk add licenses <path_to_license_file_required>

    ```'
  merge: -1
