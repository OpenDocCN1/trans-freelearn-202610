- pgno: 240
  md: '55. As part of data ingestion, which phase is skipped from execution by setting
    INDEXED_EXTRACTIONS on a forwarder?


    +   A. Input

    +   B. Parsing

    +   C. Indexing

    +   D. Ingestion


    56. Why is a persistent queue useful in Splunk?


    +   A. It helps reduce the overall storage requirements in Splunk

    +   B. It enables real-time alerting and notification for critical events

    +   C. It prevents data loss during high-volume data ingestion

    +   D. It improves query performance for historical data analysis


    You have come to the end of this Mock exam questions section. Let’s review the
    answers.


    # Reviewing answers


    +   1. Option A is the correct answer. The inputs.conf file typically contains
    the data inputs for ingestion. props.conf and transforms.conf contains parsing
    phase configurations and field extractions, and indexes.conf configures Splunk
    indexes. We briefly went through these files in Chapter 6, Splunk Configuration
    Files.

    +   2. Option D is the correct answer. Option C is about authentication methods
    that are required for user authentication to Splunk. Refer to the Roles and Authentication
    methods sections of Chapter 3, Users, Roles, and Authentication in Splunk.

    +   3. Option A is the correct answer. The DS stores applications for forwarders
    that are connected to it. By using the serverclass.conf configuration file, the
    DS configures the necessary applications to be deployed to the forwarders. Refer
    to the Understanding Splunk components section of Chapter 1, Getting Started with
    the Splunk Enterprise Certified Admin Exam, for greater detail about various Splunk
    components.

    +   4. Option A is the correct answer. The important function of indexers is to
    store data and respond to search requests issued by users via the SH. In a typical
    production deployment, the web UI is disabled on indexers. Options B, C, and D
    are features of the SH.

    +   5. Option C is the correct answer. As the name implies, the LDAP authentication
    method is typically configured to connect to the organization’s existing directory
    server and let users authenticate using existing credentials. Other authentication
    methods, such as SAML, native, and external, are supported by Splunk.'
  merge: -1
  img_proc: true
