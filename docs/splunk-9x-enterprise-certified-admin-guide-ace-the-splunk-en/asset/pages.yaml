- pgno: 164
  md: 'In the event of network issues or the indexer being unavailable, we can prevent
    data loss by setting `queueSize` and `persistentQueueSize`. The `queueSize` setting
    refers to the in-memory queue that holds the data until the output queue on the
    forwarder is free. The `persistentQueueSize` setting enables the storage of data
    on disk when the in-memory queue is full. `persistentQueueSize` must be greater
    than `queueSize`. Data is written to the `$SPLUNK_HOME/var/run/splunk/` directory
    on the forwarder.


    The UDP input specification is the same as for TCP, except that it listens on
    the UDP port – the rest of the settings and syntax remain the same. An example
    `inputs.conf` configuration for UDP is as follows:


    ```

    # inputs.conf listening on UDP port 514

    [udp://514]

    connection_host = ip

    acceptFrom = 192.0.2.10, !external.example.host.com

    index = main

    sourcetype = access_common

    queueSize = 1MB

    persistentQueueSize = 100MB

    ```


    Network inputs might have restrictions on *nix and Windows-based hosts, as they
    require access to certain ports to listen on TCP/UDP. Try it yourself by configuring
    these inputs on your UF/Splunk Enterprise instance and checking the ports'' listening
    status (use the `netstat` command on Linux and Windows-based hosts).


    We have reached the end of the network inputs section. In the next section, we
    will go through the configuration of scripted inputs.


    # Discussing scripted inputs


    Scripted inputs are useful for indexing transient/temporary data that cannot be
    monitored through file/directory monitoring or use network inputs. Scripted inputs
    collect data from transient sources and then either write the collected data to
    a file or forward it directly to an indexer. Let''s go through some facts about
    this input type:


    +   - Scripted inputs require a UF agent or Splunk Enterprise instance (HF) to
    execute the scripts.

    +   - Data can be gathered from transient sources, such as operating system commands.
    The `top`, `vmstat`, `netstat`, and `iostat` commands all leverage this type of
    input, which is configured within the Splunk add-on for Unix and Linux available
    to download from http://splunkbase.splunk.com. The Windows **technology add-on
    (TA)** relies on this input type to gather Windows **Active Directory (AD)** logs,
    registry logs, WinEventLogs, and so on. Logs from remote APIs can also be pulled
    using scripts.

    +   - Popular script types are supported, including `.py` (Python), `.sh` (shell),
    `.ps1` (PowerShell), and `.bat` (Windows batch).'
  merge: -1
  img_proc: true
- pgno: 165
  md: '+   - Scripted inputs must be scheduled to run at certain intervals. How often
    a script should run is set by specifying the interval as a number of seconds or
    by setting a cron expression.

    +   - Splunk Enterprise and the UF log script execute messages in a local splunkd.log
    file. You can get access to these logs in the _internal index.

    +   - Scripted inputs are configurable through Splunk Web under the Settings |
    Data Inputs | Scripts menu. Another option is to create them in the inputs.conf
    file, optionally package them into an app, and use a deployment server to deploy
    them to forwarders. Refer to Chapter 4, Splunk Forwarder Management.


    Consider the following scripted input specification:


    ```

    # inputs.conf scripted input settings

    [script://<script path or cmd>]

    source = <source to set>

    sourcetype = <sourcetype to set>

    index = <index name to forward logs>

    interval = <in seconds. default 60 sec or cron expression. Set -1 to run once,
    0 to continuously>

    passAuth = <username to run the script as the OS user>

    queueSize = <in-memory queue size>

    persistentQueueSize = <queue to store on disk when in-memory is full>

    ```


    The preceding specification has the stanza name prefixed with script://, followed
    by the usual common metadata fields of source, sourcetype, and index, and the
    queue settings. The settings specific to scripted input are interval and the authentication
    information.


    The interval setting schedules the script to run every x number of seconds. If
    nothing is specified here, the script will be scheduled to run every minute by
    default. Alternatively, we could specify a cron expression.


    queueSize and persistentQueueSize work similarly, as explained in the Handling
    network data input section – in the event of indexer unavailability, both settings
    hold the data generated by the script in memory and on disk.


    The passAuth setting ensures the script will be run by the assigned username by
    creating an authentication token for that user. Before setting up a scripted input
    in Splunk, you need to create the script and ensure it is located in a filesystem
    path accessible to Splunk. The [script://<script path>] stanza will then be able
    to execute the script from that designated location. For security reasons, scripts
    must be placed in one of the following locations:


    +   - $SPLNUK_HOME/etc/apps/<app name>/bin

    +   - $SPLNUK_HOME/etc/system/bin

    +   - $SPLNUK_HOME/bin/scripts'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'However, there is an exception for scripts with the .path extension, which
    in turn can refer to scripts (.py, .sh, .ps1, and .bat) anywhere on the host.
    The .path script file itself must be in one of the preceding locations, but the
    scripts it refers to can be located outside of these directories.


    Let’s look at the following scripted input that invokes the *nix top command to
    get the process information. Here the script path is relative to the inputs.conf
    file. The script has the .sh extension and is scheduled to run every 60 seconds.
    sourcetype and source are both set to top. The logs generated by this script will
    be forwarded to a custom index named os (standing for operating system):


    ```

    [script://./bin/top.sh]

    interval = 60

    sourcetype = top

    source = top

    index = os

    disabled = 0

    ```


    If you want to refer to more such examples, download the Splunk_TA_nix add-on
    from https://splunkbase.splunk.com/app/833 and examine the /default/inputs.conf
    and /bin directories.


    > Tip

    > The best practice is to place scripts close to the inputs.conf file. For example,
    if the file is in the $SPLNUK_HOME/etc/system/local/ directory, then place the
    script in the $SPLNUK_HOME/etc/system/bin/ directory. Likewise, if inputs.conf
    is in the $SPLNUK_HOME/etc/apps/<app name>/local directory, then place the script
    in the $SPLNUK_HOME/etc/apps/<app name>/bin directory.


    That is all on scripted inputs for now – try installing an add-on from Splunkbase
    that uses scripted inputs to test this functionality. In the next section, we
    will look at HEC input.


    # Understanding HEC input


    HEC is an agentless input type that doesn’t require a forwarder on the source
    machine. This input type is suitable for sources that are capable of sending events
    over HTTP(S), such as web apps (through JavaScript libraries), mobile apps, and
    automation scripts. HEC exposes RESTful API endpoints on the Splunk Enterprise
    instance to accept data for indexing. The instance could be an HF/indexer in a
    distributed deployment. Let’s look at the key facts about HEC input:


    +   - HEC is disabled by default on Splunk instances, and the user must enable
    it manually to start using it. HEC can be scaled by configuring it across multiple
    Splunk instances and optionally fronting it with a load balancer.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '+   - Authentication to HEC APIs is done via a token supplied in the HTTP request
    sent by the source. The token configuration is set up by the administrator and
    shared with the application/source team for them to send over the events.

    +   - HEC exposes two important RESTful endpoints for data indexing – one to access
    JSON-only formatted events and the other to accept any raw type of data. The JSON
    RESTful endpoint is designed to accept data that is formatted only in JSON. When
    sending data to this endpoint, you should ensure that the payload (data) is properly
    formatted in the JSON structure with additional metadata fields as required. The
    original data event that is wrapped inside the JSON payload can be a raw event

    +   - Each token created for every application/source must be a unique identifier.
    The best practice is to use 32-character **Globally Unique Identifiers (GUIDs)**
    as tokens, such as `CD1E753F-5BB2-4F5C-AE22-FE0381A0D916`. The source application
    presents this token in HTTP requests while sending events as a payload to the
    collector endpoint.

    +   - HEC auto-parses the JSON events received, as their event timestamps and
    other metadata follow a predefined structure. For raw data, the line-breaking
    strategy is applied if it contains a timestamp; alternatively, the `sourcetype`
    settings can be configured to override this behavior accordingly in `props.conf`.

    +   - HEC offers an event-indexing confirmation feature through the `useAck` indexer
    acknowledgment setting. Indexer acknowledgment is enabled for individual tokens
    at the stanza level; a separate endpoint provides the status of the event indexing.

    +   - To allow/restrict certain addresses from sending data over HEC, the `acceptFrom`
    setting can be configured at the `[http]` stanza level in the `inputs.conf` file.


    # Configuring HEC


    We will now go through the step-by-step process to configure HEC.


    **Step 1:** Let''s prepare the ground to start sending data over HEC. The first
    step is to enable the HEC in Splunk Web. Navigate to **Settings | Data Inputs
    | HTTP Event Collector** and click on the **Global Settings** button in the top-right
    corner. This will open a form with the **All tokens** option. Set this option
    to **Enabled** and click **Save**.


    You should have noticed a couple of things while enabling HEC in **Global Settings**,
    one of which is that **Enable SSL** is checked by default, and the other being
    that the HTTP port number where collector endpoints listen to receive the events
    is 8088.


    HEC global settings are also configurable via the `[http]` stanza, located by
    default at `$SPLUNK_HOME/etc/apps/splunk_httpinput/default/inputs.conf`. To enable
    HEC via this method, add the following setting to the `$SPLUNK_HOME/etc/apps/splunk_httpinput/`'
  merge: -1
  img_proc: true
- pgno: 168
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 169
  md: '+   - https://<splunk-hostname>:8088/services/collector/ack: This is used to
    query the event indexing status. It works for tokens that have indexer acknowledgment
    enabled.

    +   - The full list is available at https://tinyurl.com/j53xmynj.


    To showcase how to send data to these HEC endpoints, we will use the curl command
    in a Linux environment. We can see there are two header values – one with Authorization
    carrying the token value, and the other with X-Splunk-Request-Channel having a
    unique GUID specific to the client.


    Here we are sending data as a JSON-formatted payload – a collector/event request:


    ```

    curl -k -H "Authorization: Splunk 09776ade-cf23-42c0-9138-89ad8388516a" -H "X-Splunk-Request-Channel:
    FE0ECFAD-13D5-401B-847D-77833BD77131" https://mysplunk.example.com:8088/services/collector/event
    -d ''{"sourcetype": "signaling_data", "event": "stable signal!"}''

    ```


    The following is the collector/event response:


    ```

    {"text":"Success","code":0,"ackId":0}

    ```


    Here we are sending data as a raw event – a collector/raw request:


    ```

    curl -k -H "Authorization: Splunk 09776ade-cf23-42c0-9138-89ad8388516a" -H "X-Splunk-Request-Channel:
    FE0ECFAD-13D5-401B-847D-77833BD77131" https://mysplunk.example.com:8088/services/collector/raw
    -d ''stable signal!''

    ```


    We get the collector/raw response as follows:


    ```

    {"text":"Success","code":0,"ackId":1}

    ```


    Since we have set useACK = 1 (true) at the token level, the client must send a
    unique channel identifier in the request to HEC. In return, the client receives
    ackID in the JSON format from HEC (refer to the preceding response payloads in
    the collector/raw event example). The client further uses these acks to query
    HEC''s /ack endpoint to find the event indexing status as follows.


    Finding the event indexing status – /ack endpoint request – requires the channel
    identifier and acks returned in response to the client in the preceding two JSON
    and raw event requests:


    ```

    curl -H "Authorization: Splunk 09776ade-cf23-42c0-9138-89ad8388516a" -H "X-Splunk-Request-Channel:
    FE0ECFAD-13D5-401B-847D-77833BD77131" https://mysplunk.example.com:8088/services/collector/ack
    -d ''{"acks":[0,1]}''

    ```'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'The JSON response payload for the preceding ack endpoint request looks as follows:

    `{"acks": {"0": true, "1": false}}` — here, `true` represents successful indexing
    and `false` is used for a failed indexing status of that event. Once `acks` has
    returned `true` for a particular event, its indexing status will vanish from memory,
    and if a client sends another request afterward, it will return `false`.


    We have come to the end of HEC input – it’s so technical, isn’t it? Don’t be overwhelmed
    by the technological jargon. You need to remember to treat HEC like a normal API
    that requires authentication by presenting a token with every request. Indexer
    acknowledgment is essentially the same as a parcel delivery tracking feature –
    for example, after you place an online order (say, through the `/raw` or `/events`
    endpoints), you get a tracking number in return (`ackID`), and by entering the
    tracking number (`acks`) into a portal (the `/ack` endpoint), you can track where
    your parcel is. Finally, after delivery, you get a *successful delivery* status
    from the tracking portal.


    In the next section, we will go through the Windows inputs.


    # Exploring Windows inputs


    The input types that we have gone through so far are neither technology- nor OS-specific.
    However, here, as the name suggests, Windows inputs work on Windows-only hosts.
    The host requires at least a UF or Splunk Enterprise instance to collect Windows-specific
    logs. Windows natively stores its logs in binary format, and the Windows inputs
    interact with OS APIs to get these logs.


    When installing a UF on Windows hosts, you are given the option to enable Windows
    inputs. With a Splunk Enterprise instance, Windows inputs can be configured through
    Splunk Web via **Settings | Data Inputs** and then choosing **Local event log
    collection** and **Remote event log collection**. Remote event log collection
    requires a Windows domain account for log collection from remote hosts.


    In a large-scale Windows host environment with UF already configured, use a deployment
    server to centrally manage inputs. Create and configure `inputs.conf` within the
    app. Deploy the app to the forwarders for efficient and centralized input configuration.
    Let’s look at some key facts about Windows inputs:


    +   - Windows inputs are able to collect Windows events, AD, performance monitoring,
    registry, printer, host, and network logs.

    +   - **Windows Management Instrumentation (WMI)** is used to collect event logs
    from remote hosts in the network, typically on Windows servers with domain accounts.

    +   - Remote event log collection is configured in the `wmi.conf` file. The full
    specification is available at `https://tinyurl.com/37mdekpe`.

    +   - Enabling Windows logs can lead to significant data size increases, potentially
    consuming a substantial portion of our Enterprise license. Splunk provides two
    settings, `whitelist` and `blacklist`, to filter unwanted event logs before they
    even get indexed. This helps to reduce the license usage and index only required
    events.'
  merge: -1
  img_proc: true
