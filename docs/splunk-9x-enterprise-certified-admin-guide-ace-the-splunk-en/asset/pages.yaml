- pgno: 181
  md: '```

    true>

    TIME_PREFIX = < Regex: If set, Splunk software scans the event text for a first
    match of this regex before attempting to extract a timestamp.>

    TIME_FORMAT = <strptime-style format>

    MAX_TIMESTAMP_LOOKAHEAD = < Integer: The number of characters into an event Splunk
    software should look for a timestamp. By default, looks for first 128 characters
    >

    TZ = <Timezone of the event, UTC, AEDT, AST and so on. If not set splunkd process
    timezone is considered by default.>

    TRANSFORMS-<class name> = <transforms.conf stanza1>, <transforms.conf stanza2>

    ```


    While the preceding settings can be useful for optimizing Splunk''s data processing,
    it''s worth noting that Splunk will attempt to use default values whenever possible.
    These defaults are designed to provide a reasonable level of performance and functionality
    for most use cases. The TRANSFORMS-<class name> setting is relevant to transforms.conf,
    which we will discuss in the next section. Let''s categorize these settings by
    their function:


    +   - **Line breaking:** The LINE_BREAKER setting breaks the data stream into
    individual lines of events. By default, it looks for the number of new lines or
    carriage returns to find the event boundary. SHOULD_LINEMERGE must be set to false
    if LINE_BREAKER is set, and this is advisable for performance reasons.

    +   - **Line merging:** SHOULD_LINEMERGE combines multiple events into a single
    event. You can set this to true or false; by default, it is set to true. When
    we set this to true, other settings such as BREAK_ONLY_BEFORE_DATE and BREAK_ONLY_BEFORE
    must be set to identify the event boundary.

    +   - **Timestamp identification:** It is highly important to configure the timestamps
    that are applied to every event in the parsing phase correctly. Splunk has a set
    of predefined date-time formats ($SPLUNK_HOME/etc/datetime.xml), which are popular
    and standard. By default, if an explicit TIME_FORMAT is set, Splunk scans the
    first 128 characters to find the timestamp in an event. If the event contains
    a timestamp beyond 128 characters, or to restrict timestamp scanning from the
    TIME_PREFIX position in an event, you could use the MAX_TIMESTAMP_LOOKAHEAD or
    TIME_PREFIX setting. TIME_FORMAT is a strptime standard style format that can
    be set if the timestamp is in a non-standard format. Refer to the date-time format
    variables here - https://tinyurl.com/3kaddz23. TZ identifies the time zone the
    data originated from. To view a list of all the time zone (TZ) IDs, see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones.


    There are scenarios in which the event might not have a date, time, or year value,
    or may have none of these. Splunk tries to determine these by following its own
    rules to identify timestamps in exceptional cases. The Splunk documentation for
    How timestamp assignment works is available here - https://tinyurl.com/4tjaaerb.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Let’s look at the following example of web_access logs to define the props.conf
    parsing settings. The logs have timestamp information; -0500 in every log line
    represents the Eastern Standard Time (EST) time zone and every new line in the
    logs represents the event boundary. Let’s write the props.conf information for
    this web_access log sample:


    ```

    127.0.0.1 - - [10/Feb/2023:10:34:56 -0500] "GET /example-page.html HTTP/1.1" 200
    2345 "https://www.example.com/" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/96.0.4664.110 Safari/537.36"

    127.0.0.1 - - [10/Feb/2023:10:37:56 -0500] "GET /example-page.html HTTP/1.1" 400
    2345 "https://www.example.com/" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/96.0.4664.110 Safari/537.36"

    127.0.0.1 - - [10/Feb/2023:10:39:56 -0500] "GET /example-page.html HTTP/1.1" 500
    2345 "https://www.example.com/" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/96.0.4664.110 Safari/537.36"

    ```


    The following props.conf configuration breaks the access logs into individual
    events by every new line (the default behavior) and applies the correct timestamp
    with a time zone. The main goal is to parse the access logs correctly:


    ```

    #props.conf for preceding web_access logs

    [web_access]

    LINE_BREAKER = ([\r\n]+)

    SHOULD_LINEMERGE = false

    TIME_PREFIX = \[

    TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z

    TZ = EST

    MAX_TIMESTAMP_LOOKAHEAD = 26

    ```


    The [web_access] stanza provided is an example of the configuration in the props.conf
    file in Splunk. Here’s what each setting does:


    +   - LINE_BREAKER = ([\r\n]+): This setting specifies the regex pattern used
    to identify line breaks in the data. In this case, it is set to ([\r\n]+), which
    matches one or more occurrences of either a carriage return or a line feed character.

    +   - SHOULD_LINEMERGE = false: This setting controls whether or not Splunk should
    attempt to merge consecutive lines of data into a single event. By setting this
    to false, you are telling Splunk to treat each line of data as a separate event.

    +   - TIME_PREFIX = \[: This setting specifies the regex pattern used to identify
    the beginning of a timestamp in the data. In this case, it is set to \[, which
    matches a literal opening square bracket character.'
