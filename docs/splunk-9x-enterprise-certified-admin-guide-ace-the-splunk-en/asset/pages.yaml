    Changes to serverclass are often necessary, based on the apps that need to be
    added or excluded for specific categories of forwarder clients. When any new forwarder
    clients are deployed across the organization, central management might be needed,
    requiring adjustments to the forwarder''s hostname, DNS, or IP address, along
    with the installation of new apps or add-ons for forwarders. These are some well-known
    scenarios and there are many such cases that could arise.


    At this stage, the DS is ready to accept incoming connections from forwarders
    or deployment clients. In the following section, we''ll install the UF and configure
    the deploymentclient.conf file.


    # Installing the universal forwarder


    The installation steps for the UF are different for various OSs, and the UF software
    package differs too, depending on the OS and computing architecture. In this section,
    you will find only Windows and Linux-compatible UF installation instructions.


    To find the list of UF software packages available by OS, go to https://www.splunk.com/en_us/download/universal-forwarder.html.


    Before we dive into the direct installation, Splunk suggests checking the hardware
    prerequisites. The following CPU, memory, and disk requirements apply to UF 8.2.x
    through 9.x on all OSs:


    +   - **CPU**: 1.5 GHz clock speed

    +   - **Primary memory**: 512 MB

    +   - **Disk**: 5 GB space


    Let’s take a look at the Windows installation instructions.


    # Installation in Windows OS


    To demonstrate, I have downloaded the Windows 11 64-bit architecture-compatible
    .msi forwarder package from the preceding download link. The package can be installed
    through the command line/PowerShell, through an interactive graphical user interface
    (GUI) approach, or by silently installing the Windows machine if this is enabled
    with user account control.'
