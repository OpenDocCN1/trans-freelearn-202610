- pgno: 202
  md: '# Understanding fields and lookups


    In this section, we will look at fields and lookups in detail. Let’s start with
    fields.


    # Fields


    **Fields** in Splunk tell a story about data that can be used to search and derive
    the required outcomes, such as reports, alerts, and dashboards. Raw data in Splunk
    is indexed as individual events by its source type definition. Fields are names
    given to specific portions of data by data administrators by extracting them out
    of the raw data during the search-time and index-time processes. Splunk, by default,
    assigns predefined fields to a data source, such as `host`, `source`, `sourcetype`,
    `splunkserver`, `_time`, and so on.


    For example, take call record logs, which contain phone numbers from exchanged
    calls at a particular point in time. Let’s name the fields in the log data `time_of_call`,
    `caller`, `callee`, and `duration`.


    You could build a report such as the number of calls per day and longest duration,
    and alert on numbers that are calling out to international numbers without the
    necessary activation of an international service. All you must do is write a search
    query and use the respective Splunk feature, such as reports, alerts, dashboards,
    and so on.


    Let’s look at the sample call record logs:


    ```

    2023-04-08T09:30:15, +615551234567, +615552345678, 120

    2023-04-08T10:15:42, +615551234567, +615553456789, 60

    2023-04-08T11:20:30, +615552345678, +15551234567, 180

    2023-04-08T12:45:10, +615553456789, +615552345678, 240

    ```


    For the first event, if we had configured search-time field extraction, the following
    fields/values would have appeared in the search results:


    +   - `time_of_call = 2023-04-08T09:30:15`

    +   - `caller = +615551234567`

    +   - `callee = +615552345678`

    +   - `duration = 120`'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'Let’s go through some must-know facts about fields:


    +   - Field names are case-sensitive, For example, `time_of_call` and `TIME_OF_CALL`
    are different from each other.

    +   - The mode of search chosen by the user affects the behavior of field extraction
    and fields returned in search results.

    +     - **Fast Mode:** In this mode, field discovery is disabled, and only default
    and specific fields which you search for are returned.

    +     - **Verbose Mode:** This mode discovers and returns all available fields.

    +     - **Smart Mode:** This default mode discovers and returns all fields. It
    behaves like fast mode for transforming commands (such as `stats`, `chart`, and
    so on) and verbose mode otherwise.

    +   - Field values being used while searching are case-insensitive – for example,
    the `index=web_logs http_method="get"` and `index=web_logs http_method="GET"`
    searches produce the same results.

    +   - Fields can have different data types of values, such as alphanumeric (a)
    and numbers (#). Refer to *Figure 11.1* for notation

    +   - Fields can be extracted and stored during the indexing process. That means
    they get stored in index files permanently on disk, which consumes additional
    storage space.

    +   - The `_raw` (raw data event), `_time` (time the event occurred), and `_indextime`
    (time the event was indexed) Splunk internal field names are used for internal
    processing by Splunk, and they are accessible to users while searching data.

    +   - The predefined/default `host`, `index`, `linecount`, `punct`, `source`,
    `sourcetype`, `splunk_server`, and `timestamp` fields provide basic information
    about data. Each of these fields is, by default, assigned to every event.

    +   - Splunk, by default, auto extracts **key-value (KV)** pairs and JSON data
    formats at search time on the fly. The `KV_MODE` and `AUTO_KV_JSON` settings in
    `props.conf` enable it to work.

    +   - Splunk allows you to create custom field extraction during the search-time
    and index-time processes. The search-time field extraction process provides a
    UI to create regular expressions for unstructured data and structured data through
    delimiters. We will discuss these two types of extractions in upcoming sections.'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'Let’s look at how fields look in the Splunk search results in the following
    figure:


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_204_0.png)


    Figure 11.1: Fields in Splunk search results


    The preceding figure shows how the fields appear in Splunk, which is showing default
    fields, a custom extraction field (method = GET), an auto-extracted field (namespace
    = search), and a data type symbol (a for alphanumeric and # for numeric).


    # Lookups


    Lookups are loaded into Splunk from external sources to enrich the data with additional
    information. The most used lookups are structured contents in the format of CSV
    files and the KV Store (processed by MongoDB). Popular Splunk Search Processing
    Language (SPL) commands to read the lookup files are input lookup and lookup.
    Splunk supports the following types of lookups. We are going to learn about CSV
    and KV Store-backed lookups in this chapter:


    +   - Geospatial lookups

    +   - External lookups

    +   - CSV lookups

    +   - KV Store lookups


    Geospatial lookups contain geospatial information such as the longitude and latitude
    related to a place in the world. By default, Splunk ships with US information
    and worldwide countries’ information. You can issue a search request in the Search
    and Reporting app - | input lookup geo_countries - and click on the Visualization
    tab, and then choose Choropleth Map.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '**External lookups**, also called **scripted lookups**, fetch additional information
    for events in Splunk by connecting to external sources such as APIs.


    **CSV lookups** are the most popular lookups and are typically in a .csv format.
    Data admins/users define CSV files containing additional information that is required
    while searching data in Splunk for enrichment. CSV lookups are static in nature;
    hence, the best practice is to keep them simple and smaller in size. We will learn
    about the creation of CSV lookups in the last section.


    For example, a call record log contains a country code prefixed with a number,
    such as +61, +1, and so on; however, it doesn’t have a country name. A CSV lookup
    name – country_code_to_name_mapping.csv – can be defined as follows and loaded
    into Splunk:


    ```

    country_code, country_name

    +61, Australia

    +1, USA

    ```


    A report could make use of this lookup by matching it against the country code
    and retrieving the country name for enhanced readability to respective stakeholders.


    **KV Store lookups** are processed by MongoDB, which is a NoSQL document-oriented
    database. KV Store lookups are backed by a configuration called a **collection**.
    The information is stored in KV pairs in a collection and each row in a collection
    is uniquely identified by a field __key. KV Store lookups are preferred for large
    lookups and require frequent updates.


    For example, a threat intelligence feed related to an IP address, DNS, and domain
    requires continuous updates to the lookup named threat_intel. The threat_intel
    lookup is used by security teams while triaging the potential vulnerabilities
    in an organization’s network logs stored in Splunk.


    In this section, we learned about the importance of Splunk fields for searching
    and retrieving data. We covered default and internal fields, as well as demonstrated
    the custom fields using an example of call records logs. We also discussed case
    sensitivity, automatic extraction of KV pairs, and Splunk Web’s regular expression
    and delimiter extraction methods. Additionally, we explored different lookup file
    types, with upcoming sections focusing on CSV and KV Store lookups.


    In the next section, we will learn about search-time field extractions.


    # Creating search-time field extractions


    The SH plays a crucial role in performing search-time extractions. When a user
    issues a search request, the SH executes the search and carries out search-time
    field extractions as part of the process.


    The SH applies the defined extraction rules or patterns to the raw data during
    the search execution. It dynamically extracts the relevant fields and associated
    values from the events based on these rules. The extracted fields are then used
    for further analysis, filtering, visualization, or other operations.'
  merge: -1
  img_proc: true
