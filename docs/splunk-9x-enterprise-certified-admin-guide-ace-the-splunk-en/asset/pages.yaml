- pgno: 177
  md: '# 10

    Data Parsing and Transformation


    The first phases of the data journey is the input phase, which we discussed in
    detail in Chapter 9, Configuring Splunk Data Inputs. Data parsing is the second
    phase, followed by data being indexed on the disk. This chapter deals with the
    parsing phase, which comes right after the input phase and ends by handing over
    the data to the index phase for storage and preparation for data searching.


    The question that might arise is what the need for the parsing phase is, as all
    the data has been collected, the metadata fields are set during the input phase,
    and finally, data is forwarded to indexers for indexing. The prominent features
    of the parsing phase are breaking the whole data stream into individual events,
    extracting and applying timestamps, setting the metadata fields to individual
    events, manipulating metadata before indexing, and transforming the data if needed.
    During the input phase, metadata fields such as the index, host, sourcetype, source,
    and charset are applied to the entire data and not to individual events. The data
    stream is processed as a whole, and no line-breaking or timestamp extraction is
    done during the input phase.


    Events are transformed in the parsing phase. Example use cases could be overriding
    the sourcetype, host metadata, and data routing to a different index, extracting
    index-time fields, and masking or anonymizing sensitive information such as Personally
    Identifiable Information (PII), bank accounts, Social Security Numbers (SSNs),
    and phone numbers.


    In this chapter, we are going to learn about parsing and transformation settings
    by applying them through the props.conf and transforms.conf files. As a Splunk
    data administrator, knowing about this phase is crucial to applying the right
    solution to the use cases that might arise when onboarding data, or at a later
    point in time. For example, you might be asked to mask credit card information,
    override the source type, change the event-breaking boundaries, or re-route specific
    events to a different index altogether. We are going to learn about the following
    topics in this chapter:


    +   - Understanding the parsing phase

    +   - Parsing phase settings – props.conf'
