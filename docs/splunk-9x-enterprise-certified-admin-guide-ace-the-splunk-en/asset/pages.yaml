  md: 'If you would like to dive into a detailed overview of these phases, along with
    queues and pipelines, then check out https://tinyurl.com/bdzb cetp. Note that
    this is completely optional for the certification exam.


    We have now examined the main data ingestion phases and metadata fields. Next,
    we will explore the Add Data feature of Splunk Enterprise available in Splunk
    Web.


    # Splunk Web – Add Data feature


    The Add Data feature is available in Splunk Web under the Settings menu. Simply
    open this menu and click on Add Data, as shown in Figure 8.3.


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_149_0.png)


    Figure 8.3: Splunk Web – Add Data


    Clicking Add Data opens a new web page offering three ways to get the data into
    Splunk, as shown in Figure 8.4.


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_149_1.png)


