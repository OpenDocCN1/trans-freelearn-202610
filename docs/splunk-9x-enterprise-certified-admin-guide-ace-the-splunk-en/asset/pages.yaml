- pgno: 55
  md: 'Figure 2.4: The license group, stack, and pool layering


    # License stacks


    License stacks contain one or more related licenses whose license quotas can be
    added together to contribute toward the permitted data volume per day.


    For example, an initial purchase of a 50-GB Enterprise license can be stacked
    with the later purchase of a 40-GB license, which together allows an indexing
    volume of 90 GB per day. Let’s look at the key points to remember when stacking
    licenses:


    +   - Enterprise licenses and sales licenses can be stacked together

    +   - A license that is already part of one stack cannot be part of another stack

    +   - License warnings and violations will be raised against stacks and pools


    # License pool


    A license pool is a portion of the license volume of a stack that can be assigned
    to different indexers. It allows a granular level of control over the allocation
    of licenses.


    For example, a total of 100 GB of license needs to be allocated for both development
    and production indexers. However, the development environment could use the whole
    volume just because it is'
  merge: -1
