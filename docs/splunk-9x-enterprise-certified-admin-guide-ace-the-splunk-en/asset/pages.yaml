- pgno: 189
  md: 'If you want to give it a try, you could override the host field with the required
    hostname value. In that case, DEST_KEY would be MetaData:Host. In the next section,
    we are going to learn about index routing.


    # Index re-routing


    An index is a repository of data being set during the input phase. There might
    be situations in which some of the events in the data stream should be filtered
    and re-routed through a different index. This is achievable in the parsing phase
    and works only on an HF/indexer.


    Some applicable situations could be as follows:


    +   - The data stream contains security data that is required to be filtered and
    stored in a separate index. Storing it in a separate index gives more flexibility
    in terms of access control and retention.


    +   - If the data size is large enough, a single index might not work efficiently
    for search processing. In that case, routing a portion of data that’s being accessed
    frequently to a high-performance index and retaining less frequently used data
    in a low-performance index would improve the search performance.


    +   - Due to compliance requirements, some events should be stored in a separate
    index.


    To achieve index routing, we are going to rely on transforms.conf. Its specification
    remains the same as we have seen so far in previous sections.


    The example scenario I am considering here is the call_records log sample that
    we used in the Data anonymization section. If you look carefully at the log sample,
    it contains calls made between customers, as well as Short Messaging Service (SMS)
    records.


    The requirement is to separate the SMS records and route them to index: sms-conversations.
    The message and sent keywords in the logs are going to be the REGEX match used
    to identify SMS records:


    ```

    ## Log sample

    2022-03-13 15:22:08 Srikanth (555) 555-1234 made a call to Jane (555) 555-5678

    2022-03-12 10:11:24 Mary (555) 555-4321 sent a message to Scott (555) 555-8765

    2022-03-11 18:05:03 David (555) 555-2345 received a call from Abdul (555) 555-9876

    ```


    Let’s look at the transforms.conf settings, as follows:


    ```

    ## transforms.conf stanza for index routing

    [sms-index-routing]

    SOURCE_KEY = _raw

    REGEX = (message|sent)

    FORMAT = sms-conversations

    ```'
  merge: -1
