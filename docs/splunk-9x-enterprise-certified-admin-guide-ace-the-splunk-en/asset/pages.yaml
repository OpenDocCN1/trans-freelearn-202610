- pgno: 94
  md: '# Understanding Splunk indexes


    An index is a specific type of data storage inside Splunk Enterprise; in other
    words, to keep it simple, an index is a repository of data. For example, you are
    searching for your address on a form online and you input your address details:
    you provide your house number, your street, and your postcode, which is unique
    to you. Similarly, if you want to search for specific data in Splunk, you can
    find it by using its index.


    There are two types of Splunk indexes. They are called **event** indexes and **metrics**
    indexes. Event indexes store any type of text data, and this is the default index
    type. Metrics indexes only store metrics data, which must comply with a defined
    structure. There are special commands in Splunk, usually prefixed with m such
    as `mstats`, `mpreview`, and `mcatalog`, for working with metrics data. Metrics
    indexes are a completely different topic and beyond the scope of this book. If
    you would like to read more about them, please visit https://tinyurl.com/5n8jb6c.
    In this chapter, we will focus on event indexes. From now on, if there is no explicit
    description of the index type, assume it is an event index.


    Splunk allows you to create your own indexes, and it also includes some event
    indexes, each serving a specific purpose. Let’s look at these indexes:


    +   - `main`: The default Splunk index if one isn’t specified in external input
    sources.

    +   - `summary`: A default summary index for storing summary data.

    +   - `_internal`: Stores Splunk internal logs from a range of internal sources,
    such as splunkd daemon logs, web access logs, scheduler logs, python logs and
    more.

    +   - `_audit`: Stores Splunk internal audit logs such as logins, searches, data
    accesses, and administrative activities.

    +   - `_introspection`: Stores Splunk resource consumption and performance data.
    Monitoring console app dashboards highly depend on this index.

    +   - `_fishbucket`: Stores checkpoint information of file-monitoring inputs.

    +   - `_telemetry`: Stores instrumentation information if enabled through `telemetry.conf`.


    There is more than one way to create a Splunk index. It all depends on the type
    of Splunk deployment architecture. Regardless of the approach, you do the configuration
    of the `indexes.conf` file in the indexer.


    The indexer is a Splunk Enterprise instance that processes incoming data before
    storing it in indexes and responds to search queries issued by a search head.
    We had a brief overview of Splunk components such as the indexer and search heads
    in previous chapters.


    Let’s go through the important characteristics of indexes:


    +   - Splunk allows administrators to create custom indexes to store and organize
    specific types of data based on their needs and requirements.'
  merge: -1
