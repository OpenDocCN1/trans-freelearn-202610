- pgno: 104
  md: 'We also explored the role of Splunk indexers as crucial components of the Splunk
    architecture. Indexers are responsible for processing and indexing data, storing
    it efficiently, and responding to search requests from users and external applications.
    Data is organized into buckets in indexes, which are called hot, warm, cold, frozen,
    and thawed. These buckets are stored by default in the $SPLUNK_DB location. We
    discussed the transition from hot to warm to cold and, optionally, to frozen buckets
    when criteria are met. Frozen buckets are not searchable; thawed buckets are used
    to restore data from frozen buckets for searching. We also went through the creation
    of indexes through the web, the CLI, and the indexes.conf file. We looked at the
    advanced settings for data aging, performance, volumes for storage management,
    and so on. One of the global settings is lastChanceIndex, which is used to store
    external inputs that have been supplied with an invalid index.


    We discussed backing up index data and other useful configurations for restoration.
    We ended by discussing the monitoring console app, which contains dashboards for
    monitoring indexes and volumes. In the next chapter, we will dive into the Splunk
    configuration files.


    # Self-assessment


    You will be given 10 multiple-choice questions. The question patterns are the
    same as discussed in the Introducing the exam''s test pattern section of Chapter
    1, Getting Started with the Splunk Enterprise Certified Admin Exam. When you have
    finished, refer to the sections with which you are having difficulty. Alternatively,
    you can refer to the Splunk documentation. All the best! Let''s get started.


