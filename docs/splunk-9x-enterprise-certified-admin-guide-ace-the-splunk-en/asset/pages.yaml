- pgno: 184
  md: '+   - Create new index-time field extractions.

    +   - Create advanced search-time field extractions.

    +   - Set up lookup tables that look up fields from external sources.


    In the next section, we are going to learn about data manipulation use cases,
    such as data anonymization, re-routing data to a different index, filtering events,
    and overriding a source type. We will learn about the remaining field extractions
    and lookups in Chapter 11, Field Extractions and Lookups. Let’s begin with data
    anonymization.


    # Data anonymization


    Data anonymization is the process of transforming PII into a format that cannot
    be used to identify the individuals to whom the information is originally linked.
    The purpose of data anonymization is to protect the privacy and confidentiality
    of sensitive data.


    There are several methods for data anonymization, and one of them is masking,
    which we are going to learn about in this section.


    **Masking** involves replacing sensitive data with non-sensitive placeholder values
    – for example, replacing a person’s phone number with XXXX or their date of birth
    with a randomized value. Do note that once the data is masked during the parsing
    and index phases, that cannot be undone.


    Splunk has the ability to mask data using the following two approaches. As I mentioned
    before, it is highly recommended to have prior knowledge of regex to understand
    this section:


    +   - The SEDCMD setting in props.conf alone

    +   - Using both props.conf and transforms.conf


    # Using SEDCMD in props.conf


    Applying the SEDCMD setting through props.conf directly works on raw individual
    events. You could use this setting for the sourcetype, source, and host stanzas
    as follows. If you are aware of sed in Linux, it works in a similar way to the
    sed command in Linux. The specification of it is as follows:


    ```

    # props.conf SEDCMD setting specification

    [<sourcetype-name> | source::<source name> | host::<hostname>]

    SEDCMD-<class> = <sed like command>

    ```


    The <sed like command> syntax is explained as follows:


    +   - sed like command - s/regex/replacement/flags.

    +   - <class> is a unique literal string.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '+   - s – for substitution.

    +   - The regex in sed is a PERL-compatible regex style (optionally containing
    capturing groups).

    +   - The replacement is a string to replace the regex match. Use \n for back
    references, where n is a single digit.

    +   - Flags can be either g to replace all matches or a number to replace a specific
    match.


    To be clearer, let''s go through the following example of call log data that includes
    phone numbers:


    +   - **Example:** Company A is a telecom company indexing the call record data
    to Splunk Enterprise with index set to carrier_records and sourcetype set to call_records.
    The call_records data contains PII such as phone numbers, which must be masked
    for privacy reasons. As data administrators, our task is to use the SEDCMD setting
    we just learned about to mask the phone numbers with XXXXXXXX symbols at the sourcetype
    level. We could make use of the standalone Splunk instance that we installed in
    the Splunk installation – standalone section of Chapter 1 for this example.

    +   - **Log sample:** In the following call records sample, you shall be able
    to find phone numbers in the format (555) 555-1234, which we are going to mask
    using SEDCMD as follows.


    Here''s the call_records log sample:


    ```

    2022-03-13 15:22:08 Srikanth (555) 555-1234 made a call to Jane (555) 555-5678

    2022-03-12 10:11:24 Mary (555) 555-4321 sent a message to Scott (555) 555-8765

    2022-03-11 18:05:03 David (555) 555-2345 received a call from Abdul (555) 555-9876

    ```


    The props.conf file''s SEDCMD setting for masking is as follows:


    ```

    ## props.conf masking phone numbers in call records

    [call_records]

    SEDCMD-maskphonenumber = s/\(\d{3}\)\s\d{3}-\d{4} /XXXXXXXX /g

    ```


    In the props.conf file provided, SEDCMD specifies a regex pattern for phone numbers
    and the replacement string to be used in their place. The g flag indicates that
    all occurrences of phone numbers in the logs should be replaced with the specified
    replacement string (XXXXXXXX).


    Once this configuration is deployed to the standalone Splunk instance, any logs
    that are ingested and match the specified regex will be transformed accordingly
    and indexed in their transformed state. However, it''s worth noting that logs
    that were previously indexed prior to this configuration change will not be affected
    by this transformation.


    If you need to mask phone numbers in previously indexed logs, you''ll need to
    re-ingest those logs after the configuration change has been deployed.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Here are the call_records logs after masking:


    ```

    2022-03-13 16:22:18 Chuppa XXXXXXXX made a call to Chand XXXXXXXX

    2022-03-13 11:19:54 Garry XXXXXXXX sent a message to Bill XXXXXXXX

    2022-03-13 22:55:23 Dan XXXXXXXX received a call from Ahmad XXXXXXXX

    ```


    You can see that the phone numbers have been masked with XXXXXXXX by issuing a
    search request in Splunk - index=carrier-records sourcetype=call_records.


    In the next section, we are going to learn about data masking using transforms.conf
    and props.conf settings.


    # Using transforms and props


    We are going to use the same call_records log sample here and apply masking settings
    using the transforms.conf and props.conf files. Let''s look at the specification:


    ```

    # transforms.conf specification

    [<transforms-stanza-name>]

    SOURCE_KEY = <_raw by default, _MetaData:Index, MetaData:Sourcetype, MetaData:Host,
    MetaData:Source and so on>

    REGEX = <regular expression to operate on field contents specified in SOURCE_KEY>

    FORMAT = <specifies the format of the event works in accordance with REGEX, for
    fields format is fieldname::fieldvalue>

    DEST_KEY = <_raw for masking in data event, can set other keys as described in
    Spec>


    ## props.conf specification

    [<sourcetype-name> | source::<source name> | host::<hostname>]

    TRANSFORMS-<class> = <transforms stanza name 1>, <transforms stanza name 2>..
    <transforms stanza name N>

    ```


    The transforms.conf spec looks pretty simple; however, it supports several use
    cases that are out of scope for this book. The number of key combinations that
    can be used to manipulate metadata fields such as host, sourcetype, source, and
    queue are all described in the spec file here - https://tinyurl.com/27sxf94z.


    The props.conf spec has the TRANSFORMS-<class> setting. Here, <class> is a unique
    literal string. We can specify more than one transforms stanza and comma-separate
    them to apply them in the same order.


    We are going to use the preceding transforms.conf and props.conf specifications
    for the rest of the use cases described in the following sections, which deal
    with overriding the source type, re-routing data to a different index, filtering
    unwanted events, and sending them to nullQueue.'
