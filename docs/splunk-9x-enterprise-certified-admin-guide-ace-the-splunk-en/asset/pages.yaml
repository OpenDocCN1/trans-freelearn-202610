    next section.


    # Reviewing answers


    +   1. True, indexes are repositories of data and they do have names.

    +   2. Option A, C, and E are the correct answers. Indexer data is by default
    stored in the $SPLUNK_DB location. Indexed data can be deleted through the delete
    and clean commands.

