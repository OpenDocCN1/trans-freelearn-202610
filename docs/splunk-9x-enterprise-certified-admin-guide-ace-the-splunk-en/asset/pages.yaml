- pgno: 131
  md: 'To add a single-site clustered indexer to a search head, issue the following
    command in the $SPLUNK_HOME/bin directory on the search head. Behind-the-scenes
    configuration settings will be added to the server.conf file in the $SPLUNK_HOME/etc/system/local
    directory:


    ```

    ./splunk add cluster-manager <scheme>://<host>:<port> -secret <indexers-pass4symmkey>
    -multisite false

    ```


    This command must be repeated for every cluster manager.


    Let’s look at the elements of this command:


    +   - `<scheme>://<cluster-manager-servername>:<management-port>` is the cluster
    manager details

    +   - `<indexer-pass4symmkey>` is the pass4SymmKey/secret/security key of the
    indexer cluster


    As an illustration, assuming you’ve previously executed a command to add the cluster
    manager address SplunkManager01.example.com, the server.conf file now displays
    the following content:


    ```

    [clustering]

    mode = searchhead

    manager_uri = https://SplunkManager01.example.com:8089

    pass4SymmKey= encrypted-secreteast

    ```


    For further options, such as listing, editing, or removing a cluster manager,
    you can use the help command. For instance, execute ./splunk help cluster-manager
    in the /bin directory of $SPLUNK_HOME.


    Similarly, if you wish to learn how to edit and/or remove search-server, you can
    employ the help command as follows: ./splunk help search-server. This should be
    done within the /bin directory of $SPLUNK_HOME.


    We have now learned how to include both clustered and non-clustered indexers in
    a search head for the purpose of configuring distributed search. Moving forward,
    the subsequent section will guide us through the process of configuring distributed
    search using the Splunk Web interface.


    # Splunk Web


    Using Splunk Web, we can create the same configuration that we did in the previous
    section with the CLI. Let’s look at the menu options in Figure 7.3.


    Log in to Splunk Web as an admin user, navigate to Settings in the top-right corner,
    and click on it. Then, you will find the following menu items under DISTRIBUTED
    ENVIRONMENT:'
