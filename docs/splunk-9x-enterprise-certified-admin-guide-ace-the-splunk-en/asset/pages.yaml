- pgno: 173
  md: 'Finally, we examined the HEC and Windows input types. HEC exposes RESTful APIs
    for JSON formatted and raw events, and to get the status of indexing. We understood
    that HEC is disabled by default and worked through a step-by-step approach, starting
    from enabling HEC to sending data over the API. We concluded with Windows inputs,
    designed for Windows-only hosts to collect various log events, both locally and
    remotely.


    Do note that out of all the inputs, HEC doesn’t require a forwarder on the source
    machine, for which reason it is also called agentless input. HEC can be enabled
    on Splunk Enterprise instances such as an HF or as an indexer in a distributed
    deployment to receive log events from application clients. File and directory
    monitoring, scripted inputs, and Windows inputs need at least a UF on the source
    host. Network inputs can be enabled on UFs and Splunk instances (typically, an
    HF).


    This chapter dealt with the input collection phase, which is the first phase as
    outlined in Chapter 8, Getting Data In. In the upcoming chapter, we will delve
    into the parsing phase, which involves processing the data collected through these
    data inputs.


    It is now time to test your knowledge by answering the following questions on
    the data input topics that we covered in this chapter.


    # Self-assessment


    +   1. Select the popular data input types offered by Splunk by default. (Choose
    all that apply):

    +      A. Binary file monitoring

    +      B. File and directory monitoring

    +      C. Network data input

    +      D. Scripted input

    +      E. Network port monitoring

    +   2. You are about to configure a file monitoring input and observe that the
    directory contains five-year-old data that does not need to be indexed. Which
    setting is used to force the forwarder to ignore the old files?

    +      A. skipHistoricalFiles

    +      B. ignoreOldData

    +      C. ignoreOlderThan

    +      D. deletePastData'
