- pgno: 95
  md: '+   - Every index has data size and retention time limitations. To view the
    configuration settings, see the indexes.conf definition of _internal index in
    the $SPLUNK_HOME/etc/system/default directory.

    +   - Indexes contain originally received data in a compressed format, which is
    called raw data. They also contain index files called tsidx files and metadata
    files.

    +   - Indexes organize data in the form of buckets on the filesystem.

    +   - Indexes are by default stored at $SPLUNK_HOME/var/lib/splunk. The path is
    referred to with the $SPLUNK_DB environment variable.

    +   - Once the data is written to an index, it is final and cannot be modified.

    +   - An authorized user that has the can_delete role can issue a delete command
    to prevent data from participating in a search. This command applies delete markers
    to data. This means it doesn’t permanently remove the data from storage. To permanently
    delete event data, execute the splunk clean command with caution.

    +   - The segregation of indexes depends on data size, data retention, access
    policies, and the type of data being stored in them.


    I hope you now have enough of an understanding of indexes. Let’s go through how
    Splunk organizes data in the form of buckets in the next section.


    # Understanding buckets


    Buckets are an integral part of indexes; they contain raw data and index files.
    They are organized in the form of folders on a filesystem with a specific naming
