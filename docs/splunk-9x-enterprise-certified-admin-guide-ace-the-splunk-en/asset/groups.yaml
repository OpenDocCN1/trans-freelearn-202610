    The Developer license is purely for app developers and enables all the Splunk
    Enterprise features. Every license enforces limits – for example, licenses are
    limited to a number of days, data volume, vCPU count, and so on. The following
    section elaborates on the generation of license warnings, how they transition
    to violations, and subsequently details the specific features that Splunk Enterprise
    restricts for each license type.


    # Understanding license warnings and violations


    Understanding license limitations and their impact on the Splunk Enterprise platform
    is very important if system administrators want to maintain the continuity of
    their platform. The license types, whether purchased from Splunk or free, enforce
    limits, except the infrastructure license, which counts the number of vCPUs and
    doesn’t enforce license violation limitations. The rest of the license types enforce
    limits on data volume or indexed data volume per day.


    If a license exceeds the allowed data volume per day, Splunk Enterprise will raise
    a license warning. When the number of warnings exceeds a certain threshold, it
    is called a license violation. The thresholds differ for every license type. A
    license violation disables the important features of Splunk Enterprise.


    License warnings appear in Splunk web administrative messages. They persist for
    a number of days in order for system administrators to resolve them. License usage
    alerts can be enabled in the monitoring console.


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_50_0.png)


    Figure 2.1: Monitoring console alerts – license usage and expiry


    Figure 2.1 shows the alerts you can receive in the monitoring console. They are
    disabled by default; you can enable them and discover how they work in the event
    that usage is close to the daily quota and/or your license is near expiry.


    License violation disables important Splunk features, which means that only a
    subset of features will be available during the violation period. Let’s see what
    happens to search and indexing in a violation period:


    +   - Search functionality, which includes reports and alerts, will be blocked,
    except for internal indexes such as _internal, _audit, and _introspection

    +   - Indexing of data will continue for indexers'
  - '[PAGE 51]


    Let’s discuss the threshold for warnings and violations for each license type:


    +   - **Splunk Enterprise Trial license:** Five or more warnings in a rolling
    30-day period is a violation. License warnings persist for 14 days. During the
    violation period, searching is blocked and indexing continues. If you wish to
    fix the license violation to restore the search functionality, there is no reset
    option. The suggested approach is to reinstall the whole Splunk Enterprise instance.

    +   - **Splunk Free license:** Three or more warnings in a rolling 30-day period
    is a violation. License warnings persist for 14 days. During the violation period,
    searching is blocked and indexing continues. Similarly to the Trial license, the
    Free license cannot be reset, and reinstallation is the only option.

    +   - **Splunk Enterprise license:** A license stack with 100 GB or greater data
    volume per day does not enforce license warnings and violations. A license stack
    with less than 100-GB data volume per day does raise license warnings. 45 or more
    warnings in a rolling 60-day period is a violation, and searching is blocked while
    indexing continues. To reset the Enterprise license, contact the Splunk sales
    team; it will be able to unlock the required search features.

    +   - **Splunk Enterprise infrastructure license:** No violations are raised for
    this license type.

    +   - **Splunk Developer license:** Five or more warnings in a rolling 30-day
    period is a violation. License warnings persist for 14 days. During the violation
    period, searching is blocked and indexing continues. The Developer license can
    be reset to unlock the search features by contacting the Splunk developer program
    team at devinfo@splunk.com.

    +   - **Splunk Forwarder license:** No violation rules are applicable to the Forwarder
    license. It is an embedded license in the Splunk Enterprise package. Indexing
    on the Forwarder license requires either an Enterprise or infrastructure license.


    In conclusion, Splunk license warnings tell administrators upfront how the overall
    license usage is so that they can take the required action before a violation
    occurs. A sequence of warnings exceeding the defined threshold over a period of
    time will lead to a violation. During the violation period, searching gets blocked
    except for internal indexes, and indexing continues. Neither the Enterprise stack
    license over 100 GB nor the Enterprise infrastructure license will enforce violations,
    but the rest of the license types enforce violation rules. A violated license
    can be reset, except for the Free and Trial ones.


    We have covered a lot of information about license warnings and violations; however,
    you might have wondered at what stage Splunk Enterprise tracks license usage,
    and which component tracks the usage in distributed deployment architectures.
    The following two sections will focus on license installation in a license manager
    component, and we will discuss in detail how exactly licensing works with regard
    to license usage calculations.


    # How licensing works


    Splunk Enterprise licensing tracks the indexed data volume per day against a license
    stack or individual pools. To deep-dive into license groups, stacks, and pools,
    refer to the Splunk documentation:


    ```

    https://docs.splunk.com/Documentation/Splunk/9.0.3/Admin/

    ```'
