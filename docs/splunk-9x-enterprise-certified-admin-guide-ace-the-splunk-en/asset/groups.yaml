    \ data to the index phase for storage and preparation for data searching.\n\n\
    The question that might arise is what the need for the parsing phase is, as all\
    \ the data has been collected, the metadata fields are set during the input phase,\
    \ and finally, data is forwarded to indexers for indexing. The prominent features\
    \ of the parsing phase are breaking the whole data stream into individual events,\
    \ extracting and applying timestamps, setting the metadata fields to individual\
    \ events, manipulating metadata before indexing, and transforming the data if\
    \ needed. During the input phase, metadata fields such as the index, host, sourcetype,\
    \ source, and charset are applied to the entire data and not to individual events.\
    \ The data stream is processed as a whole, and no line-breaking or timestamp extraction\
    \ is done during the input phase.\n\nEvents are transformed in the parsing phase.\
    \ Example use cases could be overriding the sourcetype, host metadata, and data\
    \ routing to a different index, extracting index-time fields, and masking or anonymizing\
    \ sensitive information such as Personally Identifiable Information (PII), bank\
    \ accounts, Social Security Numbers (SSNs), and phone numbers.\n\nIn this chapter,\
    \ we are going to learn about parsing and transformation settings by applying\
    \ them through the props.conf and transforms.conf files. As a Splunk data administrator,\
    \ knowing about this phase is crucial to applying the right solution to the use\
    \ cases that might arise when onboarding data, or at a later point in time. For\
    \ example, you might be asked to mask credit card information, override the source\
    \ type, change the event-breaking boundaries, or re-route specific events to a\
    \ different index altogether. We are going to learn about the following topics\
    \ in this chapter:\n\n- Understanding the parsing phase\n- Parsing phase settings\
    \ – props.conf\n\nAs another example, when you set TRUNCATE to 1000 for a specific\
    \ source, such as /var/log/web-server/access.log, this means that any lines in\
    \ the data that match that source pattern will be truncated to a maximum length\
    \ of 1,000 bytes. Setting TRUNCATE to 1000 for source restricts the maximum line\
    \ length in bytes for sources that match the specified pattern:\n\n```\n[source::/var/log/web-server/access.log]\n\
    TRUNCATE = 1000\n```\n\n- **The host field:** The [host::<host or host pattern>]\
    \ stanza is useful for defining the custom configuration settings for data originating\
    \ from the given host or host pattern. These settings could be related to data\
    \ formatting, extraction rules, and many other things according to the props.conf\
    \ specification during the parsing phase:\n\n```\n[host::< host or host pattern\
