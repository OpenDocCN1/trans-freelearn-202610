    # Distributed non-clustered deployment


    Distributed non-clustered deployment works better for additional workload and
    indexing capacity than a single-server deployment. The separation of SH and indexing
    duties increases the total cost of ownership (TCO).


    The following diagram shows the non-clustered deployment architecture with separate
    SH and indexing tiers:


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_34_0.png)


    Figure 1.5: Distributed non-clustered architecture


    In the depicted architecture, a separate search tier comprises a SHC and an indexing
    tier with multiple standalone indexers. The SHC-D is a mandatory management component
    responsible for deploying configurations to the SHC using apps. It facilitates
    the deployment process by pushing configuration updates via apps from the SHC-D
    to the SHC. A DS is utilized for managing forwarders, while an LM stores license
    information. The DS ensures effective forwarder management, while the LM serves
    as a central repository for license details, with all other instances connecting
    to it for license information. Let’s look at the advantages of this deployment
    over single-server deployment:


    +   - The number of users would be higher than in a single-server deployment with
    additional indexer support

    +   - Independent indexers increase the daily indexing capacity to over 300 GB'
