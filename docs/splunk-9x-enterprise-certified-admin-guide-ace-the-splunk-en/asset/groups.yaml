    # Contributors


    # About the author


    **Srikanth Yarlagadda** is a seasoned Splunk Security Consultant, specializing
    in maximizing the potential of the Splunk platform to fortify an organization’s
    cybersecurity stance. His primary responsibilities encompass harnessing the capabilities
    of Splunk Enterprise and its **Security Information and Event Management (SIEM)**
    and **Security Orchestration, Automation, and Response (SOAR)** functionalities.
    Srikanth excels in monitoring, detecting, tuning, and automating security threat
    scenarios for **Security Operations Center (SOC)** teams.


    With a robust background, Srikanth boasts extensive experience in administering
    Splunk Enterprise. He has adeptly managed system administration tasks and expertly
    orchestrated data onboarding from diverse sources. His proficiency extends to
    developing a wide array of business use cases within the telecom domain, encapsulating
    the power of Splunk. Srikanth has obtained the following official Splunk certifications:
    Splunk Enterprise Architect, Splunk Admin, Enterprise Security Admin, and Splunk
    SOAR Developer.


    In his earlier ventures, Srikanth’s IT journey took him through various technology
    domains. He took on roles as a skilled Java developer and an adept SOA developer
    and even ventured into the realm of telecoms protocol implementations using **Oracle
    Communications Services Gatekeeper (OCSG)** and Oracle SOA Suite.


    Srikanth’s expertise is further evidenced by his active engagement as a SplunkTrust
    member, a testament to his contributions and dedication. His participation is
    frequent across Splunk’s vibrant community forums, where he shares insights and
    collaborates with fellow enthusiasts.


    *I am immensely grateful to the organizations that have extended their trust and
    provided me with opportunities. Their belief in my abilities has propelled me
    to the stage I stand on today.*'
