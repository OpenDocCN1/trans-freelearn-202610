    In the next section, we will learn about Splunk Enterprise components.


    # Understanding Splunk components


    Splunk Enterprise has multiple integral components that work together and are
    primarily divided based on their functions. The list is very comprehensive. A
    standalone Splunk deployment doesn’t require all the components; however, a distributed
    and highly available deployment requires almost all of them.


    A detailed understanding of standalone versus distributed deployment is covered
    in the following section of this chapter, *Splunk Validated Architectures (SVAs)*.
    By the end of this section, you will be familiar with two types of Splunk components—namely,
    processing components and management components.


    # Processing components


    The following are processing components:


    +   - Forwarder

    +   - SH

    +   - Indexer


    Let’s understand the roles of these components in detail and their association
    with management components.


    # *Forwarder*


    As the name suggests, this primarily forwards data from the source to the target
    indexer. There are two types of forwarders:


    +   - **Universal Forwarder (UF)**

    +   - **Heavy Forwarder (HF)**


    UF is a software agent typically installed on the source system where data is
    being generated. It consists of an input configuration (that is, an `inputs.conf`
    file) with a list of absolute file paths along with metadata fields such as index
    and sourcetype. UF is the preferred approach to monitoring and forwarding file
    contents to designated indexers. By default, UF makes use of the fishbucket process
    to forward data for indexing exactly once and avoids data duplication through
    **cyclic redundancy checks (CRCs)** and seek pointers. You will find further information
    about the additional supported data inputs and detailed explanations about the
    fishbucket concept in *Chapter 9, Configuring Splunk Data Inputs.*


    The following diagram illustrates UF installed on a web server configured to monitor
    the web server logs and forward them continuously to the indexer as and when the
    logs get updated:'
  - '[PAGE 28]


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_28_0.png)


    Figure 1.1: UF forwarding web server logs to indexer


    Let us now look at SH, which is a critical user-facing processing component in
    a distributed deployment.


    HF is a Splunk Enterprise instance and doesn''t require separate binary for installation.
    It provides an extended feature set compared to a UF. It not only collects and
    forwards data, but also includes a Splunk user interface for configuration and
    management. To operate an HF, a forwarder license is required. Typically, an HF
    is configured in forwarding mode by disabling local data storage. Splunk Add-ons
    available on Splunkbase can be installed on an HF to facilitate data collection
    from various sources. This combination of features makes HFs a versatile choice
    for preprocessing and forwarding data while benefiting from a user-friendly interface.


    # SH


    The SH component is a Splunk Enterprise instance that is dedicated to search management
    and provides a number of interfaces for users to interact with. The popular interfaces
    it offers to users are web, CLI, and RESTful API.


    Multiple SHs can be grouped together and form a cluster called a SH cluster (SHC).
    Members of an SHC share the same baseline configuration, and jobs are allocated
    to available members by the SH captain.


    In a standalone deployment, a single Splunk Enterprise instance (that is, the
    same instance) works as both the SH and indexer. In a distributed deployment model,
    the SH or SHC can submit searches to multiple indexers and consolidate the results
    returned. The results are stored locally in a dispatch directory located in $SPLUNK_HOME/var/run/splunk/dispatch
    for later retrieval, and the results will be deleted after the job expires. $SPLUNK_HOME
    refers to the installation directory where the Splunk software is installed. For
    example, ad hoc search results (that is, the search job outcome) are retained
    for 10 minutes in the dispatch directory, which will be removed after the job
    expires by a process called the dispatch reaper, which runs every 30 seconds.'
