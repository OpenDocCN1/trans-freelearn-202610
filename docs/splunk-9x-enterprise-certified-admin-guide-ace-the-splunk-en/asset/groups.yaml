    \ identification:** It is highly important to configure the timestamps that are\
    \ applied to every event in the parsing phase correctly. Splunk has a set of predefined\
    \ date-time formats ($SPLUNK_HOME/etc/datetime.xml), which are popular and standard.\
    \ By default, if an explicit TIME_FORMAT is set, Splunk scans the first 128 characters\
    \ to find the timestamp in an event. If the event contains a timestamp beyond\
    \ 128 characters, or to restrict timestamp scanning from the TIME_PREFIX position\
    \ in an event, you could use the MAX_TIMESTAMP_LOOKAHEAD or TIME_PREFIX setting.\
    \ TIME_FORMAT is a strptime standard style format that can be set if the timestamp\
    \ is in a non-standard format. Refer to the date-time format variables here -\
    \ https://tinyurl.com/3kaddz23. TZ identifies the time zone the data originated\
    \ from. To view a list of all the time zone (TZ) IDs, see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones.\n\
    \nThere are scenarios in which the event might not have a date, time, or year\
    \ value, or may have none of these. Splunk tries to determine these by following\
    \ its own rules to identify timestamps in exceptional cases. The Splunk documentation\
    \ for How timestamp assignment works is available here - https://tinyurl.com/4tjaaerb.\n"
  mdcn: "\n最后，我们考察了 HEC 和 Windows 输入类型。HEC 为 JSON 格式和原始事件以及索引状态查询提供了 RESTful API。我们了解到\
    \ HEC 默认是禁用的，并通过逐步操作（从启用 HEC 到通过 API 发送数据）进行了实践。最后我们介绍了 Windows 输入，它专为仅限 Windows\
    \ 的主机设计，用于在本地和远程收集各种日志事件。\n\n请注意，在所有输入类型中，HEC 不需要在源机器上安装转发器，因此它也被称为无代理输入。HEC 可以在\
    \ Splunk Enterprise 实例（如 HF）上启用，也可以在分布式部署中的索引器上启用，以接收来自应用程序客户端的日志事件。文件和目录监控、脚本化输入以及\
    \ Windows 输入至少需要在源主机上安装 UF。网络输入可以在 UF 和 Splunk 实例（通常是 HF）上启用。\n\n本章讨论了输入收集阶段，这是第\
    \ 8 章“数据接入”中概述的第一阶段。在接下来的章节中，我们将深入探讨解析阶段，该阶段涉及处理通过这些数据输入收集到的数据。\n\n现在是时候通过回答以下关于本章所涵盖数据输入主题的问题来测试你的知识了。\n\
    \n### 自我评估\n\n1. 选择 Splunk 默认提供的常用数据输入类型。（选择所有适用项）：\n   - A. 二进制文件监控\n   - B.\
    \ 文件和目录监控\n   - C. 网络数据输入\n   - D. 脚本化输入\n   - E. 网络端口监控\n\n2. 你即将配置一个文件监控输入，并注意到该目录包含五年以上的数据，这些数据无需建立索引。哪个设置用于强制转发器忽略旧文件？\n\
    \   - A. skipHistoricalFiles\n   - B. ignoreOldData\n   - C. ignoreOlderThan\n\
    \   - D. deletePastData\n\n## 10 数据解析与转换\n\n数据旅程的第一阶段是输入阶段，我们在第 9 章“配置 Splunk\
    \ 数据输入”中已详细讨论。数据解析是第二阶段，之后数据被索引到磁盘上。本章讨论解析阶段，该阶段紧随输入阶段之后，并以将数据交给索引阶段进行存储和搜索准备而结束。\n\
    \n可能产生的问题是，既然所有数据都已经收集完毕，元数据字段已在输入阶段设置，最终数据被转发到索引器进行索引，那么解析阶段有什么必要呢？解析阶段的主要特性包括：将整个数据流拆分为单个事件，提取并应用时间戳，为单个事件设置元数据字段，在索引前操作元数据，以及根据需要转换数据。在输入阶段，诸如索引、主机、源类型、来源和字符集等元数据字段应用于整个数据，而非单个事件。数据流作为一个整体被处理，在输入阶段不进行换行拆分或时间戳提取。\n\
    \n事件在解析阶段被转换。示例用例可能包括覆盖源类型、主机元数据、将数据路由到不同的索引、提取索引时字段，以及屏蔽或匿名化敏感信息，如个人身份信息（PII）、银行账户、社会安全号码（SSN）和电话号码。\n\
    \n在本章中，我们将通过应用 props.conf 和 transforms.conf 文件来学习解析和转换设置。作为 Splunk 数据管理员，了解此阶段对于在数据接入时或之后的某个时间点可能出现的用例应用正确解决方案至关重要。例如，你可能会被要求屏蔽信用卡信息、覆盖源类型、更改事件拆分边界，或将特定事件完全重新路由到不同的索引。我们将在本章中学习以下主题：\n\
    \n- 理解解析阶段\n- 解析阶段设置 – props.conf\n\n再举一个例子，当你针对特定来源（如 /var/log/web-server/access.log）将\
    \ TRUNCATE 设置为 1000 时，这意味着与该来源模式匹配的数据中的任何行都将被截断为最大长度 1,000 字节。将 TRUNCATE 设置为 1000\
    \ 会限制匹配指定模式的来源的最大行长度（以字节为单位）：\n\n```\n[source::/var/log/web-server/access.log]\n\
    TRUNCATE = 1000\n```\n\n- **主机字段：** [host::<主机或主机模式>] 节适用于为来自给定主机或主机模式的数据定义自定义配置设置。这些设置可能涉及数据格式化、提取规则以及根据\
    \ props.conf 规范在解析阶段的其他许多内容：\n\n```\n[host::< host or host pattern >]\n<key> =\
    \ <value>\n```\n\n例如，当你针对特定主机名（如 myhost.com）将 TRUNCATE 设置为 1000 时，这意味着源自 myhost.com\
    \ 主机的数据中的任何行都将被截断为最大长度 1,000 字节：\n\n```\n[host::myhost.com]\nTRUNCATE = 1000\n\
    ```\n\n- **节优先级：** 当多个节匹配给定事件时，定义在更具体节中的设置优先于定义在较不具体节中的设置。具体来说，定义在 [host::<主机或主机模式>]\
    \ 节中的设置覆盖 [<源类型名称>] 节中的设置，而定义在 [source::<来源或来源模式>] 节中的设置优先于 [host::<主机或主机模式>]\
    \ 和 [<源类型名称>] 节。这种设置层次结构允许对 Splunk 中的数据处理进行细粒度控制，确保将最相关的设置应用于每个事件。\n\n至此，我们已经了解了在各种场景中有用的节。接下来让我们看看关于换行拆分、时间戳识别、行合并等的解析设置规范。我将使用源类型节来描述这些设置。例如，我们的源类型名称是\
    \ web_access。请注意，设置键名区分大小写：\n\n```\n## web_access 源类型的解析设置\n[web_access]\nLINE_BREAKER\
    \ = < 正则表达式：默认设置为换行符或回车符的数量（[\\r\\n]+）>\nSHOULD_LINEMERGE = <true | false - 是否将多个多行事件合并为一个事件。如果设置为\
    \ true，则取决于其他设置的数量。阅读完整规范>\nBREAK_ONLY_BEFORE = <仅当 SHOULD_LINEMERGE 设置为 true\
    \ 时适用>\nBREAK_ONLY_BEFORE_DATE = <仅当 SHOULD_LINEMERGE 设置为 true 时适用>\nTIME_PREFIX\
    \ = < 正则表达式：如果设置，Splunk 软件会在尝试提取时间戳之前扫描事件文本以查找此正则表达式的第一个匹配项。>\nTIME_FORMAT = <strptime\
    \ 风格格式>\nMAX_TIMESTAMP_LOOKAHEAD = < 整数：Splunk 软件在事件中查找时间戳时应查看的字符数。默认情况下，查找前 128\
    \ 个字符>\nTZ = <事件的时区，如 UTC、AEDT、AST 等。如果未设置，则默认考虑 splunkd 进程的时区。>\nTRANSFORMS-<类名>\
    \ = <transforms.conf 节1>, <transforms.conf 节2>\n```\n\n虽然上述设置对于优化 Splunk 的数据处理很有用，但值得注意的是，Splunk\
    \ 会尽可能尝试使用默认值。这些默认值旨在为大多数用例提供合理的性能和功能水平。TRANSFORMS-<类名> 设置与 transforms.conf 相关，我们将在下一节中讨论。让我们按功能对这些设置进行分类：\n\
    \n- **换行拆分：** LINE_BREAKER 设置将数据流拆分为单独的事件行。默认情况下，它通过查找换行符或回车符的数量来确定事件边界。如果设置了\
    \ LINE_BREAKER，则必须将 SHOULD_LINEMERGE 设置为 false，出于性能原因，这也是可取的。\n- **行合并：** SHOULD_LINEMERGE\
    \ 将多个事件合并为单个事件。你可以将其设置为 true 或 false；默认情况下为 true。当我们将其设置为 true 时，必须设置其他设置（如 BREAK_ONLY_BEFORE_DATE\
    \ 和 BREAK_ONLY_BEFORE）以识别事件边界。\n- **时间戳识别：** 在解析阶段正确配置应用于每个事件的时间戳非常重要。Splunk 有一组预定义的日期时间格式（$SPLUNK_HOME/etc/datetime.xml），这些格式是常用且标准的。默认情况下，如果未显式设置\
    \ TIME_FORMAT，Splunk 会扫描事件的前 128 个字符以查找时间戳。如果事件包含超出 128 个字符的时间戳，或者希望限制从事件中 TIME_PREFIX\
    \ 位置开始的时间戳扫描，可以使用 MAX_TIMESTAMP_LOOKAHEAD 或 TIME_PREFIX 设置。TIME_FORMAT 是一种 strptime\
    \ 标准风格格式，可以在时间戳采用非标准格式时设置。请参阅此处的日期时间格式变量 - https://tinyurl.com/3kaddz23。TZ 标识数据来源的时区。要查看所有时区（TZ）ID\
    \ 的列表，请参阅 https://en.wikipedia.org/wiki/List_of_tz_database_time_zones。\n\n在某些场景下，事件可能没有日期、时间或年份值，或者这些值都没有。Splunk\
    \ 会尝试根据自身的规则来确定这些值，以便在异常情况下识别时间戳。关于时间戳分配如何工作的 Splunk 文档可在此处获取 - https://tinyurl.com/4tjaaerb。\n\
    \n"
