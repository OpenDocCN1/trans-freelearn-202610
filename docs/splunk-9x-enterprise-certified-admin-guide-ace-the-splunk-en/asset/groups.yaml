    ## 数据匿名化


    数据匿名化是将 PII 转换为无法用于识别信息最初链接到的个人的格式的过程。数据匿名化的目的是保护敏感数据的隐私和保密性。


    数据匿名化有多种方法，其中之一是掩码，我们将在本节中学习。


    **掩码**涉及用非敏感的占位符值替换敏感数据——例如，用 XXXX 替换个人的电话号码，或用随机值替换其出生日期。请注意，一旦数据在解析和索引阶段被掩码，就无法撤销。


