    Groups, stacks, pools, and other terminology. The contents of this documentation
    are covered in the next section, Installing, managing, and monitoring licenses.


    In a distributed infrastructure, a dedicated Splunk Enterprise instance will be
    assigned a license manager role, which keeps track of the license usage of the
    whole deployment. The rest of the instances act as license peers reporting to
    the manager.


    The license quota is measured every day, from midnight to midnight, which means
    it will get reset to the full quota for the next day’s processing, and it’s a
    continuous process that works in conjunction with the system clock of the manager.
    Splunk supports two types of indexes, called events indexes and metrics indexes.
    They are covered in Chapter 5, Splunk Index Management. License usage calculations
    are capped to a fixed 150 bytes per metric event for metrics indexes and, for
    event indexes, the full data size of the events.


    The original data from the source will go through various phases before getting
    indexed to indexers. The data size is measured at the indexing phase. Phases are
    explained in Chapter 8, Getting Data In. So far, we have talked about data being
    indexed from external sources. There is a heap of data that is generated locally
    on every running Splunk Enterprise instance. It is stored in internal indexes
    that start with _ (underscore), namely _internal, _audit, _introspection, _metrics,
    and _telemetry.


    Let’s see which data doesn’t count in the license quota:


    +   - Splunk internal logs don’t count

    +   - Replicated copies are stored in the indexer cluster for high availability

    +   - Summary indexes with the stash source type

    +   - Indexed data, as it contains tsidx files, metadata, and so on to enable
    faster retrieval


    In conclusion, license quotas are measured every day, from midnight to midnight.
    The data size is calculated during the indexing phase. Metrics index data is capped
    at 150 bytes per event, and event index data is calculated based on the full size
    of the events. Internal logs, summary indexes, and replicated data don’t get measured
    against the license. A dedicated instance works as the license manager, in which
    the license file is installed and configured; the remaining instances function
    as license peers and report to the license manager in a distributed deployment.


