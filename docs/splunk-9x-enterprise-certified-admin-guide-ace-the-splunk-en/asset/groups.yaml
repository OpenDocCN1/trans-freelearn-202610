  - '[PAGE 45]


    10. Which configuration (.conf) file contains file monitoring details on a forwarder?


    +   A. outputs.conf

    +   B. inputs.conf

    +   C. server.conf

    +   D. source.conf


    I hope you were able to recollect the topics that we went through with these questions.
    Let’s review the answers.


    # Reviewing answers


    +   1. Options A, B, and C are correct answers. Option D is not a Splunk feature.

    +   2. Option B, No. Splunk cannot monitor binary files. It is only able to monitor
    text data.

    +   3. Option B, Fishbucket, is the right answer. The Splunk Enterprise and the
    UF use seek pointers and CRCs to track the progress of file monitoring and avoid
    duplicate data indexing.

    +   4. Options A, B, C, and D all are functions of an SH.

    +   5. Option A is correct (True). Indexers store raw events, index files, and
    other metadata files for search processing.

    +   6. Option A is correct (True). Once the data is written to an index, it is
    immutable.

    +   7. Options B, C, and D are the correct answers. The UF is a data collection
    component.

    +   8. Option C is the right answer. The SHC-D deploys apps to all cluster members
    through the captain.

    +   9. Options A, B, and D are the correct answers. The LM stores the license
    file upon adding a license. Optionally, licenses are stackable, and pools can
    be created on the LM. License reports are available in the MC app, available in
    the LM instance.

    +   10. Option B is the correct answer. outputs.conf and server.conf are Splunk
    configuration files used for different purposes. There is no source.conf file
    available in Splunk.'
