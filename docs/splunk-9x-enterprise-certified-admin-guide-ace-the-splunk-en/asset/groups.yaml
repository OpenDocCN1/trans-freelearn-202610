    We’ve now looked at event index buckets. Data gets rolled from hot to warm to
    cold to frozen to thawed buckets depending on the situation. Now that you are
    familiar with indexes and their internal structure, let’s move on to the creation
    of indexes.


    # Creating Splunk indexes


    Creating a custom index is a Splunk administrator’s responsibility. As you have
    seen, data is retained in indexes until it reaches a certain age or the index
    reaches a certain size, so an estimation of an index’s size before it is created
    is a crucial step. Having an accurate estimation retains the data for the necessary
    amount of time, and it also helps to determine the required storage capacity upfront.


    In order to estimate the size of the index, we must have the answers to the following
    questions:


    +   - *Question:* How long does the data need to be retained in days?

    +     *Answer:* For example, 100 days

    +   - *Question:* How much data volume per day is expected in GB?

    +     *Answer:* For example, 1 GB


    The formula for index size estimation is as follows:


    *Retain days X volume per day X 1/2 (raw data compression + index files)*


    If we substitute in the example values, the index size becomes 100 X 1 X ½ = 50
    GB.


    Now that you know how to estimate the size of an index and have decided on a name
    for it, let’s go through the index creation process.


    In the *Understanding buckets* section, we saw that the `indexes.conf` file in
    the `$SPLUNK_HOME/etc/system/default` directory has an entry for the `_introspection`
    index. Similarly, Splunk ships with many internal indexes that you can find in
    the same file. Splunk allows us to create custom indexes, and there is more than
    one way to create an index. It all depends on the type of deployment architecture.
    In general, the administrator chooses the most suitable approach. In this section,
    we have chosen a single instance of Splunk, which serves as both the search head
    and the indexer. Let’s take a look at the different ways to create event indexes.


    # Splunk Web


    Log in to Splunk Web as an administrator. Go to the **Settings** menu in the top
    right and click on **Indexes**. A page opens with a **New Index** button in the
    top right. On the same page, you can see the default indexes are prefixed with
    _, such as `_internal` and `_audit`.


    If you wish to see the configuration for one of the default indexes, click on
    the index name. Otherwise, proceed with creating a new index by clicking the **New
    Index** button and filling in the **Index Name** and **Max Size of Entire Index**
    fields. The default **Index Data Type** setting is **Events**. Metrics should'
  - '[PAGE 99]


