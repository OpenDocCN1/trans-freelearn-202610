    # Summary


    In conclusion, the Splunk UF is a software binary that does not require any license
    and is typically installed on the source system. The UF is lightweight and consumes
    fewer resources. The UF monitors and forwards the data to indexers for indexing
    and reads the data in a file exactly once using the fishbucket concept. Structured
    data such as CSV, XML, JSON, and so on can be parsed using INDEXED_EXTRACTIONS.
    Forwarding on the UF is configured in the outputs.conf file, which contains the
    indexer host and management port details.


    The UF can be installed on various supported OSs and hardware specifications;
    we have seen its installation for both Windows (through the interactive GUI) and
    Linux (through the CLI/silent mode). By default, the UF is installed in /opt/splunkforwarder/
    in linux environment, which is referred to via the $SPLUNK_HOME environment variable.


    After that, we explored the DS, which is a Splunk Enterprise instance for managing
    the many forwarders in large Splunk environments. The apps are stored in $SPLUNK_HOME/etc/deployment-apps
    and the location of the DS and the serverclass.conf file contains the mapping
    of apps to deployment clients (that is, forwarders). The apps that are deployed
    to clients are generally stored in the $SPLUNK_HOME/etc/apps directory. To get
    the apps from the DS, the forwarders require a deploymentclient.conf file, which
    contains the DS host and port details. After successfully connecting to the DS,
    by default, clients phone home every 60 seconds.


    Finally, we went through forwarder management in the MC app, which provides dashboards
    based on the internal logs of the UF and DS. By default, forwarder management
    is disabled and can be enabled on the Splunk instance that is dedicated to the
    MC app in a distributed Splunk architecture. In the next chapter, we will learn
    about the Splunk configuration files in detail.


    In the next section, you will be provided with some questions and answers to test
    your knowledge of this chapter.'
