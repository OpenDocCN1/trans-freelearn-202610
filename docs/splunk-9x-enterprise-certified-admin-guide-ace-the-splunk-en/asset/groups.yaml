    # Creating a new role


    I hope you now have a comprehensive understanding of roles and their significance
    and are aware of the default Splunk roles. In this section, let’s find out about
    the need to create a custom role and go through the role creation steps.


    For example, to understand the requirement for new custom roles, take two different
    indexes: the `web-access-data` index contains website access log data, and the
    `building-access-data` index contains building access log data. The website access
    log data will only be accessible to application support teams, and the building
    access log data will only be accessible to the building security team. In this
    scenario, there will be two different roles created for the two teams.


    Default Splunk roles can be assigned to users; however, it depends on which indexes
    they need access to, which capabilities should be allowed, and the allocation
    of resources such as disk quota, search quota, and so on. If an existing role
    doesn’t suit the needs of the user, the systems administrator can create a new
    role by optionally inheriting an existing Splunk role. A new role inheriting an
    existing Splunk role inherits the parent role capabilities, index access, and
    resource limits.


    Splunk doesn’t recommend changing default roles. If you want to edit the default
    roles, the suggested approach is to clone the existing role and change the required
    configurable options. The following screenshot shows the **New Role** creation
    form:


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_68_0.png)


    The preceding screenshot shows the name to be given to the role, and five tabs:
    the **Inheritance** tab to choose an existing role, the **Capabilities** tab to
    choose the capabilities of the role, the **Indexes** tab to'
  - '[PAGE 69]


    choose the indexes accessible by the role, the **Restrictions** tab to set a search
    filter on indexed fields, and finally, the **Resources** tab to limit the disk
    space and the search quota allowed at the role level and user level. Clicking
    the **Create** button will create a new role, which will appear on the **Roles**
    web page, as shown in *Figure 3.5.*


    Capabilities are granular-level permissions applied to users, and the list is
    quite big. You can refer to the documentation at https://tinyurl.com/bdffj2s6
    for a full list. Another place to look at them is the authorize.conf **specification
    (spec)** at https://tinyurl.com/2p8nvat9, which contains an up-to-date list of
    capabilities as they are subject to change.


    So far, you have seen the process of creating/editing an existing role via Splunk
    Web. Splunk Enterprise, in general, contains configuration files (.conf) on the
    filesystem for every setting that appears in Splunk Web. Splunk writes every change
    that’s made in Splunk Web to a configuration file. Let’s take a look at the authorize.conf
    file, which contains role configuration details for every tab that appears in
    *Figure 3.6.*


    Let’s take a look at a sample authorize.conf snippet for the admin role. role_admin
    is called a stanza in Splunk terminology, and the format of the stanza is role_<name_of_role>:


    ```

    [role_admin]

    # === Subsumed roles ===

    importRoles = power;user

    # === Capabilities ===

    accelerate_datamodel   = enabled

    admin_all_objects      = enabled

    ### Many such capabilities enabled

    # === Other settings ===

    srchIndexesAllowed = *;_*

    srchIndexesDefault = main;os

    srchFilter          = *

    srchDiskQuota       = 10000

    srchJobsQuota       = 50

    ```


    The authorize.conf file, by default, exists in the $SPLUNK_HOME/etc/system/default
    directory. If you want to create a new role through the configuration approach,
    Splunk recommends creating a local directory either in the $SPLUNK_HOME/etc/system/local
    system directory or in the $SPLUNK_HOME/etc/apps/<app-name>/local app local directory.
    To effect the changes being made to configuration files, a restart of Splunk instances
    is recommended.


    For full specs of all the Splunk configuration files, go to the $SPLUNK_HOME/etc/system/README
    directory. You will find files with .spec and .example extensions. That is all
    about roles. I advise you to practice with them by creating them through Splunk
    Web and the authorize.conf spec file to familiarize yourself with the terminology.
    Navigate through each of the tabs shown in *Figure 3.6.*


    Let’s look at the authentication methods supported by Splunk in the following
    section.'
