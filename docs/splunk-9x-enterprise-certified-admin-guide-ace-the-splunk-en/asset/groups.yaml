    +   - In the case of a standalone single-SH deployment scenario, there is a **single
    point of failure (SPOF)**


    Let’s take a look at distributed cluster deployment, which is a more advanced
    setup than a distributed non-cluster deployment.


    # Distributed cluster deployment and SHC – single-site


    A distributed clustered SH and indexer deployment at a single site is a highly
    available, resilient architecture. A site is a classic data center in a particular
    region/geography.


    The following diagram shows the clustered deployment architecture with a separate
    SHC and clustered indexing tier running on a single site:


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_35_0.png)


    Figure 1.6: Distributed clustered deployment and SHC – single-site'
