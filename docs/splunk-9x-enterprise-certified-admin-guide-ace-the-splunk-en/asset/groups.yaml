    +   - `maxTotalDataSizeMB` is the total index size limit. If you look at the example
    index, `windows-event-logs`, we have set this value to 500 MB.

    +   - Global settings are applied to every index specified in `indexes.conf`.
    For a complete list, refer to the `indexes.conf.spec` file in the Splunk docs.
    At the global level, the `lastChanceIndex` option can be configured. This acts
    as a final option for any external inputs that don''t indicate a valid index.
    If this value is left empty, Splunk will simply discard these events.


    What if the data moved to cold buckets is not being searched very frequently,
    so the allocation of expensive hardware storage similar to hot/warm buckets isn''t
    cost-effective? Splunk suggests using low-latency high-throughput storage for
    hot/warm buckets as they hold recent data that is searched quite often. Cold buckets
    can reside on standard latency storage, which is slow and cheap. To achieve this,
    an index can be configured using volumes. Let''s look at volumes in the next section.


    # Index volumes


    Volumes are specific directories on a filesystem that are allocated for indexes
    in order to manage storage space effectively. Let''s take a look at the volume
    configuration in a UNIX-based OS for the `windows-event-logs` index that we created
    on Splunk Web in the previous section:


    ```

    [volume:hot_storage]

    path = /mnt/fast_disk

    # Optional limits the volume size to 60 GB

    maxVolumeDataSizeMB = 61440


    [volume:cold_storage]

    path = /mnt/slow_disk

    #Optional limits the volume size to 50 GB

    maxVolumeDataSizeMB = 500


    #index definition

    [windows-event-logs]

    homePath = volume:hot_storage/windows-event-logs

    coldPath = volume:cold_storage/windows-event-logs

    maxTotalDataSizeMB = 51200

    thawedPath = $SPLUNK_DB\windows-event-logs\thawedd b

    ```


    This configuration contains the `volume` keyword in `homePath` and `coldPath`.
    `thawedPath` is set to the standard location as it cannot be on a volume. If you
    would like to know some more advanced options, then look at the `indexes.conf.spec`
    file in the `$SPLUNK_HOME/etc/system/README` directory.


    In the next section, we will go through backing up indexes.'
  - '[PAGE 102]


    # Backing up indexes


    So far, we have created indexes and stored information in buckets, and modified
    their configurations in the .conf file. What if the underlying hardware fails
    and you have critical data and files that cannot be lost? To restore your Splunk
    instance to its original state, a backup procedure must be set up. For the certification
    exam, it is important to know which folders of the Splunk installation to back
    up. The following two essential folders need to be backed up:


    +   - The $SPLUNK_DB directory: $SPLUNK_HOME/var/lib/splunk/

    +     Hot buckets cannot be backed up while Splunk is running; instead, a snapshot
    can be taken incrementally, and you can take a backup of the snapshot

    +   - The $SPLUNK_HOME/etc directory: This contains apps, user configurations,
    system configuration files, and licenses


    In Splunk, the $SPLUNK_HOME/etc directory is a critical directory that contains
    configuration files and settings that control the behavior of the entire Splunk
    deployment. Backing up this directory is essential to ensure that all configurations
    and customizations are safeguarded and can be restored in case of any unexpected
    issues or system failures.


    That is everything we’re going to cover about the creation of indexes; we ended
    with what to back up. At this stage, you should be familiar with core index concepts
    and advanced configuration options. Let’s take a look at monitoring indexes in
    the following section.


    # Monitoring Splunk indexes


    As an administrator, it can be overwhelming to monitor several indexes as they
    grow in number. To address this, Splunk monitors indexes through a default monitoring
    console app. It has many monitoring features, and monitoring indexes is one of
    them. Let’s take a look at its menu options.


    Log in as an administrator and navigate to Settings in the top right. Click on
    Monitoring Console. The console opens in the following web view. Click on Indexing
    and select Index Detail: Instance.


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_102_0.png)


    Figure 5.4: Indexes dashboard in the monitoring console'
