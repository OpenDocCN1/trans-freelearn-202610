    \ to search queries issued by a search head. We had a brief overview of Splunk\
    \ components such as the indexer and search heads in previous chapters.\n\nLet’s\
    \ go through the important characteristics of indexes:\n\n- Splunk allows administrators\
    \ to create custom indexes to store and organize specific types of data based\
    \ on their needs and requirements.\n- Every index has data size and retention\
    \ time limitations. To view the configuration settings, see the indexes.conf definition\
    \ of _internal index in the $SPLUNK_HOME/etc/system/default directory.\n- Indexes\
    \ contain originally received data in a compressed format, which is called raw\
    \ data. They also contain index files called tsidx files and metadata files.\n\
    - Indexes organize data in the form of buckets on the filesystem.\n- Indexes are\
    \ by default stored at $SPLUNK_HOME/var/lib/splunk. The path is referred to with\
    \ the $SPLUNK_DB environment variable.\n- Once the data is written to an index,\
    \ it is final and cannot be modified.\n- An authorized user that has the can_delete\
    \ role can issue a delete command to prevent data from participating in a search.\
    \ This command applies delete markers to data. This means it doesn’t permanently\
    \ remove the data from storage. To permanently delete event data, execute the\
    \ splunk clean command with caution.\n- The segregation of indexes depends on\
    \ data size, data retention, access policies, and the type of data being stored\
    \ in them.\n\nI hope you now have enough of an understanding of indexes. Let’s\
    \ go through how Splunk organizes data in the form of buckets in the next section.\n\
    \n## Understanding buckets\n\nBuckets are an integral part of indexes; they contain\
    \ raw data and index files. They are organized in the form of folders on a filesystem\
    \ with a specific naming pattern. These folders are explicitly used by the Splunk\
    \ indexer for data storage and search processing.\n\nIn order to learn a bit more\
    \ about them, let’s look at the default _introspection index folder structure:\n\
    \n```\nC:\\Program Files\\Splunk\\var\\lib\\splunk\\_introspection>tree\nFolder\
    \ PATH listing for volume Windows\nVolume serial number is 6676-C13F\nC:.\n├──\
    \ colddb\n├── datamodel_summary\n├── db\n│   ├── db_1663851317_1661686760_13\n\
    │   │   └── rawdata\n│   ├── GlobalMetaData\n│   └── hot_v1_14\n│       └── rawdata\n\
    └── thaweddb\n```\n\nFigure 5.1: Splunk non-clustered index folder structure\n\
    \nWe’ve now looked at event index buckets. Data gets rolled from hot to warm to\
    \ cold to frozen to thawed buckets depending on the situation. Now that you are\
    \ familiar with indexes and their internal structure, let’s move on to the creation\
    \ of indexes.\n\n## Creating Splunk indexes\n\nCreating a custom index is a Splunk\
    \ administrator’s responsibility. As you have seen, data is retained in indexes\
    \ until it reaches a certain age or the index reaches a certain size, so an estimation\
    \ of an index’s size before it is created is a crucial step. Having an accurate\
    \ estimation retains the data for the necessary amount of time, and it also helps\
    \ to determine the required storage capacity upfront.\n\nIn order to estimate\
    \ the size of the index, we must have the answers to the following questions:\n\
    \n- *Question:* How long does the data need to be retained in days?\n  *Answer:*\
    \ For example, 100 days\n- *Question:* How much data volume per day is expected\
    \ in GB?\n  *Answer:* For example, 1 GB\n\nThe formula for index size estimation\
    \ is as follows:\n\n*Retain days X volume per day X 1/2 (raw data compression\
    \ + index files)*\n\nIf we substitute in the example values, the index size becomes\
    \ 100 X 1 X ½ = 50 GB.\n\nNow that you know how to estimate the size of an index\
    \ and have decided on a name for it, let’s go through the index creation process.\n\
    \nIn the *Understanding buckets* section, we saw that the `indexes.conf` file\
    \ in the `$SPLUNK_HOME/etc/system/default` directory has an entry for the `_introspection`\
    \ index. Similarly, Splunk ships with many internal indexes that you can find\
    \ in the same file. Splunk allows us to create custom indexes, and there is more\
    \ than one way to create an index. It all depends on the type of deployment architecture.\
    \ In general, the administrator chooses the most suitable approach. In this section,\
    \ we have chosen a single instance of Splunk, which serves as both the search\
    \ head and the indexer. Let’s take a look at the different ways to create event\
    \ indexes.\n\n## Splunk Web\n\nLog in to Splunk Web as an administrator. Go to\
    \ the **Settings** menu in the top right and click on **Indexes**. A page opens\
    \ with a **New Index** button in the top right. On the same page, you can see\
    \ the default indexes are prefixed with _, such as `_internal` and `_audit`.\n\
    \nIf you wish to see the configuration for one of the default indexes, click on\
    \ the index name. Otherwise, proceed with creating a new index by clicking the\
    \ **New Index** button and filling in the **Index Name** and **Max Size of Entire\
    \ Index** fields. The default **Index Data Type** setting is **Events**. Metrics\
    \ should\n\n- **Parameters:** homePath, coldPath, thawedPath, app, and so on\n\
    - **Example:** $SPLUNK_HOME\\bin\\splunk add index windows-event-logs -app search\n\
    \nBoth the CLI and Splunk Web approaches write to the indexes.conf file on the\
    \ filesystem. If you are familiar with the indexes.conf specification, then creating\
    \ an indexes.conf file directly achieves the same purpose.\n\n## indexes.conf\
    \ explained\n\nLet’s deep dive into the indexes.conf file for the windows-event-logs\
    \ index that we have created through Splunk Web. As we learned in the Splunk Web\
    \ section, the index has by default been saved to the Search & Reporting app folder\
    \ called search, hence I can find it at $SPLUNK_HOME/etc/apps/search/local:\n\n\
    ```\n[windows-event-logs]\ncoldPath = $SPLUNK_DB\\windows-event-logs\\colddb\n\
    enableDataIntegrityControl = 0\nenableTsidxReduction = 0\nhomePath = $SPLUNK_DB\\\
    windows-event-logs\\db\nmaxTotalDataSizeMB = 500\nthawedPath = $SPLUNK_DB\\windows-event-logs\\\
    thaweddb\n```\n\nOne of the advantages of this approach is there is a range of\
    \ options that can be set for advanced index configurations. However, the creation\
    \ of a new index through this file-based approach requires the Splunk instance\
    \ to be restarted.\n\nThere are ways to control the size of data from the bucket\
    \ directory level to the total index size. Let’s take a look at the following\
    \ advanced options and what to back up:\n\n- homePath.maxDataSizeMB limits the\
    \ homePath directory size for hot and warm buckets.\n- coldPath.maxDataSizeMB\
    \ limits the coldPath directory size for cold buckets.\n- To limit the number\
    \ of hot and warm buckets that can be created, set maxHotBuckets and maxWarmDBCount,\
    \ respectively. For high-volume indexes, where the indexing size is more than\
    \ 10 GB/day, Splunk suggests increasing maxHotBuckets from the default of 3 to\
    \ 10.\n- By default, Splunk limits the hot bucket size to 750 MB through maxDataSize\
    \ = auto, and if the index size per day estimation is 10 GB, set this option to\
    \ maxDataSize = auto_high_volume for Splunk to create 10 GB hot buckets on 64-bit\
    \ systems. The reason for having this option is to avoid creating too many small\
    \ buckets for large indexes. Having too many small buckets affects Splunk’s performance.\
    \ Hot buckets will roll to warm buckets once they reach their maximum size and\
    \ then a new hot bucket will be created.\n"
  mdcn: "\n\n## 理解 Splunk 索引\n\n索引是 Splunk Enterprise 内部一种特定类型的数据存储；换句话说，简单来说，索引就是数据的存储库。例如，你在网上表单中搜索自己的地址并输入地址详情：你提供门牌号、街道和邮政编码，这些信息对你来说是唯一的。类似地，如果你想在\
    \ Splunk 中搜索特定数据，可以通过使用其索引来找到它。\n\nSplunk 索引有两种类型，分别称为**事件**索引和**指标**索引。事件索引存储任何类型的文本数据，这是默认的索引类型。指标索引只存储必须符合特定结构的指标数据。Splunk\
    \ 中有一些专门用于处理指标数据的特殊命令，通常以 `m` 开头，例如 `mstats`、`mpreview` 和 `mcatalog`。指标索引是一个完全不同的主题，超出了本书的范围。如果你想了解更多相关信息，请访问\
    \ https://tinyurl.com/5n8jb6c。在本章中，我们将重点关注事件索引。从现在开始，如果没有明确说明索引类型，请假定它是事件索引。\n\
    \nSplunk 允许你创建自己的索引，同时它也会附带一些事件索引，每个都有特定的用途。让我们来看看这些索引：\n\n- `main`：如果没有在外部输入源中指定索引，则这是\
    \ Splunk 的默认索引。\n- `summary`：用于存储摘要数据的默认摘要索引。\n- `_internal`：存储来自各种内部源的 Splunk\
    \ 内部日志，例如 splunkd 守护进程日志、Web 访问日志、调度器日志、Python 日志等。\n- `_audit`：存储 Splunk 内部审计日志，例如登录、搜索、数据访问和管理活动。\n\
    - `_introspection`：存储 Splunk 资源消耗和性能数据。监控控制台应用仪表板高度依赖此索引。\n- `_fishbucket`：存储文件监控输入源的检查点信息。\n\
    - `_telemetry`：如果通过 `telemetry.conf` 启用了检测信息，则存储这些信息。\n\n创建 Splunk 索引的方法不止一种，具体取决于\
    \ Splunk 部署架构的类型。无论采用哪种方法，都需要在索引器中配置 `indexes.conf` 文件。\n\n索引器是 Splunk Enterprise\
    \ 的一个实例，负责在将传入数据存储到索引中之前进行处理，并响应由搜索头发出的搜索查询。在前面的章节中，我们已经简要概述了 Splunk 组件，例如索引器和搜索头。\n\
    \n让我们来看一下索引的重要特性：\n\n- Splunk 允许管理员根据需要和需求创建自定义索引，以存储和组织特定类型的数据。\n- 每个索引都有数据大小和保留时间的限制。要查看配置设置，请参阅\
    \ `$SPLUNK_HOME/etc/system/default` 目录中 `_internal` 索引的 indexes.conf 定义。\n- 索引以压缩格式包含最初接收的数据，这称为原始数据。它们还包含称为\
    \ tsidx 文件的索引文件和元数据文件。\n- 索引以桶的形式在文件系统上组织数据。\n- 索引默认存储在 `$SPLUNK_HOME/var/lib/splunk`。该路径通过\
    \ `$SPLUNK_DB` 环境变量引用。\n- 一旦数据写入索引，它就是最终的，不能被修改。\n- 具有 can_delete 角色的授权用户可以发出\
    \ delete 命令，以防止数据参与搜索。此命令会对数据应用删除标记。这意味着它不会永久从存储中删除数据。要永久删除事件数据，请谨慎执行 splunk clean\
    \ 命令。\n- 索引的隔离取决于数据大小、数据保留策略、访问策略以及其中存储的数据类型。\n\n我希望你现在对索引有了足够的了解。在下一节中，我们将介绍\
    \ Splunk 如何以桶的形式组织数据。\n\n## 理解桶\n\n桶是索引不可分割的一部分；它们包含原始数据和索引文件。它们以文件夹的形式组织在文件系统上，并具有特定的命名模式。这些文件夹由\
    \ Splunk 索引器专门用于数据存储和搜索处理。\n\n为了进一步了解它们，让我们看看默认的 _introspection 索引文件夹结构：\n\n```\n\
    C:\\Program Files\\Splunk\\var\\lib\\splunk\\_introspection>tree\nFolder PATH\
    \ listing for volume Windows\nVolume serial number is 6676-C13F\nC:.\n├── colddb\n\
    ├── datamodel_summary\n├── db\n│   ├── db_1663851317_1661686760_13\n│   │   └──\
    \ rawdata\n│   ├── GlobalMetaData\n│   └── hot_v1_14\n│       └── rawdata\n└──\
    \ thaweddb\n```\n\n图 5.1：Splunk 非集群索引文件夹结构\n\n我们现在已经了解了事件索引桶。数据会根据情况从热桶滚动到暖桶、冷桶、冻结桶和解冻桶。既然你已经熟悉了索引及其内部结构，让我们继续学习索引的创建。\n\
    \n## 创建 Splunk 索引\n\n创建自定义索引是 Splunk 管理员的责任。如你所见，数据会一直保留在索引中，直到数据达到一定年龄或索引达到一定大小，因此在创建索引之前估算索引大小是关键的一步。准确的估算可以确保数据保留所需的时间，同时也有助于提前确定所需的存储容量。\n\
    \n为了估算索引的大小，我们必须知道以下问题的答案：\n\n- *问题：* 数据需要保留多少天？\n  *答案：* 例如，100 天\n- *问题：* 每天预计有多少\
    \ GB 的数据量？\n  *答案：* 例如，1 GB\n\n索引大小估算公式如下：\n\n*保留天数 X 每日数据量 X 1/2（原始数据压缩 + 索引文件）*\n\
    \n如果我们将示例值代入，索引大小变为 100 X 1 X ½ = 50 GB。\n\n既然你已经知道如何估算索引大小并决定为其命名，让我们来看看索引创建过程。\n\
    \n在“*理解桶*”一节中，我们看到 `$SPLUNK_HOME/etc/system/default` 目录中的 `indexes.conf` 文件有一个\
    \ `_introspection` 索引的条目。类似地，Splunk 自带许多内部索引，你可以在同一文件中找到。Splunk 允许我们创建自定义索引，而且创建索引的方法不止一种，这完全取决于部署架构的类型。通常，管理员会选择最合适的方法。在本节中，我们选择了一个单独的\
    \ Splunk 实例，它同时充当搜索头和索引器。让我们来看看创建事件索引的不同方法。\n\n## Splunk Web\n\n以管理员身份登录 Splunk\
    \ Web。转到右上角的**设置**菜单，单击**索引**。打开页面后，右上角会出现一个**新建索引**按钮。在同一页面上，你可以看到默认索引以 `_` 开头，例如\
    \ `_internal` 和 `_audit`。\n\n如果你希望查看某个默认索引的配置，请单击该索引名称。否则，请单击**新建索引**按钮并填写**索引名称**和**整个索引的最大大小**字段，继续创建新索引。默认的**索引数据类型**设置为**事件**。指标应该\n\
    \n- **参数：** homePath、coldPath、thawedPath、app 等\n- **示例：** $SPLUNK_HOME\\bin\\\
    splunk add index windows-event-logs -app search\n\nCLI 和 Splunk Web 两种方式都会写入文件系统上的\
    \ indexes.conf 文件。如果你熟悉 indexes.conf 规范，那么直接创建 indexes.conf 文件也能达到同样的目的。\n\n##\
    \ indexes.conf 详解\n\n让我们深入了解一下我们通过 Splunk Web 创建的 windows-event-logs 索引对应的 indexes.conf\
    \ 文件。正如我们在 Splunk Web 一节中所了解的，该索引默认保存到名为 search 的 Search & Reporting 应用文件夹中，因此我可以在\
    \ $SPLUNK_HOME/etc/apps/search/local 找到它：\n\n```\n[windows-event-logs]\ncoldPath\
    \ = $SPLUNK_DB\\windows-event-logs\\colddb\nenableDataIntegrityControl = 0\nenableTsidxReduction\
    \ = 0\nhomePath = $SPLUNK_DB\\windows-event-logs\\db\nmaxTotalDataSizeMB = 500\n\
    thawedPath = $SPLUNK_DB\\windows-event-logs\\thaweddb\n```\n\n这种方法的一个优点是，可以为高级索引配置设置一系列选项。但是，通过这种基于文件的方式创建新索引需要重启\
    \ Splunk 实例。\n\n有多种方法可以控制数据大小，从桶目录级别到整个索引大小。让我们看看以下高级选项以及需要备份的内容：\n\n- homePath.maxDataSizeMB\
    \ 限制 homePath 目录中热桶和暖桶的大小。\n- coldPath.maxDataSizeMB 限制 coldPath 目录中冷桶的大小。\n-\
    \ 要限制可创建的热桶和暖桶数量，请分别设置 maxHotBuckets 和 maxWarmDBCount。对于高容量索引（索引数据量超过 10 GB/天），Splunk\
    \ 建议将 maxHotBuckets 从默认值 3 增加到 10。\n- 默认情况下，Splunk 通过 maxDataSize = auto 将热桶大小限制为\
    \ 750 MB；如果每天索引大小估算为 10 GB，请将此选项设置为 maxDataSize = auto_high_volume，以便 Splunk 在\
    \ 64 位系统上创建 10 GB 的热桶。使用此选项是为了避免为大型索引创建过多的小桶。过多的小桶会影响 Splunk 的性能。热桶一旦达到最大大小，就会滚动为暖桶，然后会创建新的热桶。\n\
    \n"
