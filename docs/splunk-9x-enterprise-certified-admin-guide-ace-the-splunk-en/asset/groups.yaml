    \n46. 在 Splunk 中，如何有选择地摄取 Windows 输入的特定事件代码？\n\n- A. 在 inputs.conf 中使用 Event_codes\
    \ = <逗号分隔的代码列表>\n- B. 在 inputs.conf 中使用白名单/黑名单设置\n- C. 没有可能的解决方案进行选择性摄取，因此请在搜索时过滤代码\n\
    - D. 以上都不是\n\n47. 你能识别数据通过哪些数据输入方式被摄取到 Splunk 中吗？（选择所有适用项）\n\n- A. HEC——无代理输入\n\
