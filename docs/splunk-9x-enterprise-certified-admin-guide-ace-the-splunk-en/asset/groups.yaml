  - '[PAGE 57]


    In the Adding a license section, we learned about installing a license on a Splunk
    instance that acts as a repository of licenses, which is called a license manager.
    Log in to the license manager in which licenses have been installed, go to the
    top-right corner of the window, and then go to Settings | Licensing. Refer to
    Figure 2.5 to see the licensing web page, which contains information on the licenses,
    volumes, expiration, and license pools. In a distributed deployment, other Splunk
    instances are called license peers. All the peers need to point to the license
    manager instance to obtain license information.


    To configure a license peer, log in to the remaining instances in the distributed
    deployment, such as search heads, indexers, and forwarders, and point them to
    the license manager. Log into the individual instance web interface and navigate
    through Settings | Licensing, as shown in Figure 2.2, and click on the Change
    to Peer button, which shows two radio button options, Designate this Splunk instance
    <instance_name> as the manager license server and Designate a different Splunk
    instance as the manager license server. As shown in Figure 2.6, choose the second
    option, which will display a text box for you to enter the manager license server
    URI and its management port (8089). Enter manager license server URI and click
    the Save button to connect the license peer to the license manager.


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_57_0.png)


    Figure 2.6: Configuring a license peer with the license manager URI


    The following figure shows the Messages section, where license warnings and violation
    messages appear in Splunk Web. License warnings and violation messages appear
    on the license manager’s Splunk Web home page in the Messages menu bar.'
  - '[PAGE 58]


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_58_0.png)


    Figure 2.7: License warnings in Splunk Web


    In the event that a license peer is unable to reach the license manager, there
    will be a grace time of 72 hours before the peer is declared to be in license
    violation. In this scenario, the search functionality will be blocked, but indexing
    continues until the peer restores connectivity with the manager instance.


    # License usage and alerting


    The monitoring console is included by default in Splunk Enterprise software. However,
    it must be configured to use in either standalone or distributed mode. Configuring
    the monitoring console is out of scope of this book, however, if you would like
    to explore the topic, I suggest that you follow the Splunk documentation (https://tinyurl.com/msxtcmkj).
    To access the monitoring console application, log into the Standalone Splunk instance
    web interface and navigate through the Settings menu and click on the Monitoring
    Console option to the left side of the menu items. It provides two visual dashboards,
    which can be found in the Indexing | License Usage menu of the monitoring console.


    Figure 2.8 shows two dashboards under the Indexing menu. The License Usage - Today
    dashboard shows comprehensive details about today''s license usage. To check past
    usage, open the Historic License Usage dashboard.


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_58_1.png)


    Figure 2.8: License usage dashboards in the monitoring console'
  - '[PAGE 59]


    Similarly, the monitoring console contains two alerts for license usage tracking.
    Refer to Figure 2.1 for alert details. Alerts are disabled by default. To monitor
    license usage information, alerts must be enabled manually so that they will send
    notifications when the license expires in 2 weeks’ time, and if the daily license
    quota has exceeded 90%. The notification message appears on the Splunk Web home
    page in the **Messages** menu bar.


    There is one more place where warning and violation alerts are recorded on the
    Splunk Web home page – under the **Settings | Licensing** menu (refer to Figure
    2.2). The alerts raised here will have a more granular level of visibility about
    the pools and stacks that are in a current or permanent licensing violation.


    In conclusion, a license can be installed either through Splunk Web, the Splunk
    CLI, or config files. A license manager is a repository of all licenses, and the
    rest of the Splunk instances report to the manager and are called license peers.
    If a license peer is unable to report for 72 hours, it will be declared in license
    violation, and its search feature will be blocked (although indexing continues)
    until it reconnects to the license manager instance.


    License groups, stacks, and pools help to manage licenses effectively if more
    than one license is installed, and they allocate a portion of the volume to specific
    indexers. Only one license group will be active at any point in time. Only certain
    types of licenses are allowed to stack – for example, an Enterprise license and
    a Sales license can be stacked, but an infrastructure license cannot be stacked
    with the Enterprise license. The monitoring console provides license usage reports
    and alerts to track the usage. Alerts are disabled by default. License warnings
    and violation messages appear in Splunk Web in two places – one is on the Splunk
    Web home page in the **Messages** bar, and the other is under **Settings | Licensing.**


    After the Summary section, there are some practice exam questions covering the
    topics that we have learned so far.


    # Summary


    We have come to the end of the license management chapter, which has been very
    comprehensive. Licensing is native to Splunk Enterprise, and the naming conventions
    take a bit of time to digest.


    We began with the licensing types that Splunk provides and then went through the
    differences between them to examine the suitability of different licenses for
    different deployment options. Splunk provides Enterprise Free and Trial licenses
    and Developer licenses with some limitations. To enable all the features of Splunk
    Enterprise, you need a valid license file. If a license is used beyond its limitations,
    a license warning will be raised, and the license will be treated as being in
    violation after a certain number of warnings. There are no violations for the
    infrastructure license, and the Enterprise license has a quota of 100 GB or more.
    License violations block important features, such as searching, but indexing continues.
    The Free and Trial licenses cannot be reset from violation, but the others can
    be reset by reaching out to Splunk Sales.'
