    # Splunk installation – standalone


    As discussed in the preceding section, a single-server deployment consists of
    a single Splunk instance combining both SH and indexer functionality. The installation
    actually isn’t part of the admin exam blueprint; however, it is very helpful to
    get your hands dirty by experiencing Splunk yourself through the Splunk Web, configuration
    file (.conf), and CLI options that we are going to discuss in upcoming chapters.
    This section provides instructions for installing Splunk Enterprise 9.0.3 on the
    Windows operating system. Let’s get into it.


    # Installation system requirements


    Let’s look at the system requirements of the computing environment. Splunk Enterprise
    supports multiple operating system environments. A full list of the supported
    options is available here: https://tinyurl.com/2tuudjwr. Splunk has the following
    hardware requirements:


    +   - A 64-bit Linux or Windows distribution

    +   - 12 physical CPU cores or 24 vCPU @ 2 GHz or more clock speed per core

    +   - 12 GB **random-access memory (RAM)**

    +   - An x86 64-bit chip architecture

    +   - 1 GB Ethernet **network interface card (NIC)**

    +   - Free disk space of at least 3 GB for installation and more as per indexing
    needs


    My system specifications for where Splunk version 9.0.3 is going to be installed
    are as follows:


    +   - 64-bit Windows 11 Pro operating system

    +   - 6 physical CPU cores (or 12 vCPUs) @ 2.1 GHz clock speed and 16 GB RAM

    +   - An x86 64-bit AMD chip

    +   - Plenty of disk space


    You might have noticed the physical CPU cores in my PC are fewer than recommended,
    which is absolutely fine as we are not going to run production workloads on the
    Splunk instance. Let’s get into the installation steps, as follows.'
