    \ license quota has exceeded 90%. The notification message appears on the Splunk\
    \ Web home page in the **Messages** menu bar.\n\nThere is one more place where\
    \ warning and violation alerts are recorded on the Splunk Web home page – under\
    \ the **Settings | Licensing** menu (refer to Figure 2.2). The alerts raised here\
    \ will have a more granular level of visibility about the pools and stacks that\
    \ are in a current or permanent licensing violation.\n\nIn conclusion, a license\
    \ can be installed either through Splunk Web, the Splunk CLI, or config files.\
    \ A license manager is a repository of all licenses, and the rest of the Splunk\
    \ instances report to the manager and are called license peers. If a license peer\
    \ is unable to report for 72 hours, it will be declared in license violation,\
    \ and its search feature will be blocked (although indexing continues) until it\
    \ reconnects to the license manager instance.\n\nLicense groups, stacks, and pools\
    \ help to manage licenses effectively if more than one license is installed, and\
    \ they allocate a portion of the volume to specific indexers. Only one license\
    \ group will be active at any point in time. Only certain types of licenses are\
    \ allowed to stack – for example, an Enterprise license and a Sales license can\
    \ be stacked, but an infrastructure license cannot be stacked with the Enterprise\
    \ license. The monitoring console provides license usage reports and alerts to\
    \ track the usage. Alerts are disabled by default. License warnings and violation\
    \ messages appear in Splunk Web in two places – one is on the Splunk Web home\
    \ page in the **Messages** bar, and the other is under **Settings | Licensing.**\n\
    \nAfter the Summary section, there are some practice exam questions covering the\
    \ topics that we have learned so far.\n\n## Summary\n\nWe have come to the end\
    \ of the license management chapter, which has been very comprehensive. Licensing\
    \ is native to Splunk Enterprise, and the naming conventions take a bit of time\
    \ to digest.\n\nWe began with the licensing types that Splunk provides and then\
    \ went through the differences between them to examine the suitability of different\
    \ licenses for different deployment options. Splunk provides Enterprise Free and\
    \ Trial licenses and Developer licenses with some limitations. To enable all the\
    \ features of Splunk Enterprise, you need a valid license file. If a license is\
    \ used beyond its limitations, a license warning will be raised, and the license\
    \ will be treated as being in violation after a certain number of warnings. There\
    \ are no violations for the infrastructure license, and the Enterprise license\
    \ has a quota of 100 GB or more. License violations block important features,\
    \ such as searching, but indexing continues. The Free and Trial licenses cannot\
    \ be reset from violation, but the others can be reset by reaching out to Splunk\
    \ Sales.\n"
