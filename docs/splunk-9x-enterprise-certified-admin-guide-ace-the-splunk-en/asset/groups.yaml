  md: "\n## Scenario 2\n\nIn this scenario, we will look at the same setting created\
    \ in two different apps.\n\nApp names can contain lowercase letters, uppercase\
    \ letters, numbers, spaces, and special characters. If the same setting exists\
    \ in two different apps, then the order in which Splunk decides to execute them\
    \ at runtime is decided by sorting the apps in reverse lexicographical order.\n\
    \nFor example, in the case of the same macro that we looked at in scenario 1,\
    \ [high_response_time] is defined and shared with users that have access to the\
    \ two apps, WebApp and ITOpsApp.\n\nIn this case, if both WebApp and ITOpsApp\
    \ have a macro with the same name [high_response_time], the macro definition in\
    \ the WebApp app would take precedence over the one in the ITOpsApp app. This\
    \ precedence is determined by the reverse lexicographical order of the app names.\n\
    \nThis means that when Splunk resolves the [high_response_time] macro, it will\
    \ first look in the WebApp app, and if it finds a definition there, it will use\
    \ that definition. If no definition is found in the WebApp app, then Splunk will\
    \ look in the ITOpsApp app:\n\n```\n## ITOpsApp macro is to check response time\
    \ of requests over 2000 milli seconds\n[high_response_time]\ndefinition = index=web_logs\
    \ sourcetype=access_log response_time_ms>=2000\n```\n\nIf you are curious about\
    \ lexicographical and reverse order, Splunk Lantern has a very good article that\
    \ goes into more detail: https://tinyurl.com/22hjs8am.\n\nTo avoid the hassle\
    \ of manually checking each setting in every configuration file to understand\
    \ how Splunk determines precedence during runtime, Splunk provides helpful tools\
    \ such as the btool command and REST API interfaces. These tools allow you to\
    \ easily examine the configuration settings and their priorities.\n\nHowever,\
    \ before diving into those tools, let's first focus on understanding precedence\
    \ during index time.\n\n## Index-time precedence\n\nIndex-time precedence refers\
    \ to the configuration settings that apply to the system as a whole, rather than\
    \ being specific to individual users. These settings operate at a global system\
    \ level and are involved in activities such as indexing data and monitoring files\
    \ during the input phase.\n\nDuring index time, various configuration files come\
    \ into play, including indexes.conf, server.conf, serverclass.conf, and inputs.conf.\
    \ These files contain essential configurations that affect how indexing activities\
    \ are performed, how servers are configured, and how data inputs are monitored.\n\
    \nLet’s understand the components:\n\n- `--debug`: This option shows the absolute\
    \ path of the conf file’s location in the system, app, or users directory. Similar\
    \ to the `--debug` option, there are many useful options available. To view the\
    \ full list, issue the following command – `$SPLUNK_HOME/bin/splunk help btool`.\n\
    - `--user`: This option displays the configuration data visible to the given user.\n\
    - `--app`: This option displays the configuration data visible from the given\
    \ app.\n- `<conf_file_prefix>`: This refers to the prefix used in the names of\
    \ various configuration files – for example, props, inputs, indexes, and transforms.\n\
    \nLet’s see a btool command example for the indexes.conf file with the --debug\
    \ option:\n\n```\n./splunk btool indexes list --debug\n```\n\nIn the given example,\
    \ the btool command was used to list the indexes in debug mode. We will get the\
    \ following output – as you can see in the following figure, the indexes list\
    \ --debug option shows the absolute path of the conf file and each setting associated\
    \ with the index name _internal.\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_118_0.png)\n\
    \nFigure 6.3: The btool command result for indexes.conf\n\nAnother useful btool\
    \ command is to find out whether there are any typos in a conf file. It usually\
    \ runs every time a Splunk instance is started. The syntax is as follows:\n\n\
    ```\n./splunk btool check\n```\n\nRemember these facts about btool:\n\n- The output\
    \ generated by btool may not reflect the current state of the loaded memory. In\
    \ the event that a change is made to a configuration file that requires a service\
    \ restart, the btool report may reflect this change, even though it has not yet\
    \ been applied in the active system state.\n- btool is unsupported by Splunk;\
    \ however, it is very powerful and useful. When dealing with Splunk support cases,\
    \ they might ask for a Splunk diag report, which includes the btool report output.\n\
    - When viewing an inputs.conf file with btool, the [default] stanza settings are\
    \ not shown in the output.\n- You can execute a btool command without requiring\
    \ the Splunk process to be in a running state.\n\n## Self-assessment\n\nYou will\
    \ be given 10 questions and answer to choose from. The pattern of the questions\
    \ is the same as we discussed in Chapter 1. Post-assessment, refer to the sections\
    \ related to anything you had difficulty answering questions about. Alternatively,\
    \ you can refer to the Splunk documentation. All the best! Let's get started.\n\
    \n- 1. Which conf file is required to define parsing settings for line breaking?\n\
    \  A. outputs.conf\n  B. line_breaker.conf\n  C. props.conf\n  D. server.conf\n\
    \n- 2. Does creating a conf file directly on the filesystem reload a Splunk configuration\
    \ automatically?\n  A. Yes\n  B. No\n\n- 3. How do you reload conf file changes\
    \ on a standalone Splunk instance? (Select all that apply):\n  A. Add the restart\
    \ = true setting at the end of the conf file.\n  B. Use a debug/refresh endpoint.\n\
    \  C. Restart the Splunk instance.\n  D. Do nothing – Splunk reloads them automatically.\n\
    \n- 4. As a data admin, you are tasked with adjusting the INDEXED_EXTRACTIONS\
    \ settings for an app named MyApp, located in the /opt/splunkforwarder/etc/apps/MyApp\
    \ directory on a Universal Forwarder (UF). MyApp has, by default, included props.conf\
    \ under the default/ directory. What action will you take?\n  A. Log in to UF\
    \ and update props.conf, as the change is required on a single host only.\n  B.\
    \ Log in to UF, create a /local directory under MyApp, and create a props.conf\
    \ file with the required settings.\n  C. Do nothing – props.conf parsing does\
    \ not work on UF.\n  D. Do nothing – this is a system admin job, so inform the\
    \ system admin.\n\n- 5. Can you identify the location where conf files can be\
    \ created or pre-exist on Splunk, where $SPLUNK_HOME = /opt/splunk? (Select all\
    \ that apply):\n  A. Location – etc/apps/users/<user-name>/<app-name>/local/\n\
    \  B. Location – etc/apps/<app-name>/default/\n  C. Location - etc/apps/<app-name>/system/\n\
    \  D. Location - etc/system/default/\n  E. Location - etc/system/local/\n\n6.\
    \ Which configuration files are considered by Splunk for precedence during search\
    \ time and index time? (Select all that apply):\n\n- A. Search-time - savedsearches.conf,\
    \ macros.conf, and server.conf\n- B. Search-time - savedsearches.conf, macro.conf,\
    \ and tags.conf\n- C. Index-time - inputs.conf, server.conf, indexes.conf, and\
    \ savedsearches.conf\n- D. Index-time - inputs.conf, serverclass.conf, indexes.conf,\
    \ and server.conf\n\n7. Using which CLI command do you troubleshoot conf file\
    \ errors? (Select all that apply):\n\n- A. ./splunk check errors\n- B. ./splunk\
    \ btool check\n- C. ./splunk btool <conf-file-name> list --debug\n- D. ./splunk\
    \ btool check-typos\n\n8. User A has the power user role and has created an alert\
    \ with private permissions under the search app. What location will it have been\
    \ stored in on Splunk?\n\n- A. $SPLNUK_HOME/etc/users/local/\n- B. $SPLNUK_HOME/etc/apps/search/users\n\
    - C. $SPLNUK_HOME/etc/users/User-A/search/local\n- D. $SPLUNK_HOME/etc/users/search/local\n\
    \n9. User A has the power user role, has created an alert, and shared it with\
    \ an app called search. What location will it have been stored in on Splunk?\n\
    \n- A. $SPLNUK_HOME/etc/users/search/local\n- B. $SPLNUK_HOME/etc/apps/search/local\n\
    - C. $SPLNUK_HOME/etc/apps/users/User-A/search/local/\n- D. $SPLUNK_HOME/etc/apps/search/default/\n"
  mdcn: "\n\n## 场景 2\n\n在本场景中，我们将考察在两个不同应用中创建的相同设置。\n\n应用名称可以包含小写字母、大写字母、数字、空格和特殊字符。如果两个不同的应用中存在相同的设置，那么\
    \ Splunk 决定在运行时执行它们的顺序，是通过对应用名称进行反向字典序排序来确定的。\n\n例如，对于我们在场景 1 中看到的相同宏，[high_response_time]\
    \ 被定义并与可访问 WebApp 和 ITOpsApp 这两个应用的用户共享。\n\n在这种情况下，如果 WebApp 和 ITOpsApp 都有一个同名为\
    \ [high_response_time] 的宏，那么 WebApp 应用中的宏定义将优先于 ITOpsApp 应用中的定义。这种优先级由应用名称的反向字典序决定。\n\
    \n这意味着当 Splunk 解析 [high_response_time] 宏时，它会首先在 WebApp 应用中查找，如果在那里找到定义，就会使用该定义。如果在\
    \ WebApp 应用中未找到定义，那么 Splunk 将查找 ITOpsApp 应用：\n\n```\n## ITOpsApp 宏用于检查超过 2000\
    \ 毫秒的请求响应时间\n[high_response_time]\ndefinition = index=web_logs sourcetype=access_log\
    \ response_time_ms>=2000\n```\n\n如果你对字典序和逆序感到好奇，Splunk Lantern 上有一篇非常好的文章进行了更详细的说明：https://tinyurl.com/22hjs8am。\n\
    \n为了避免手动检查每个配置文件中的每项设置以了解 Splunk 在运行时如何确定优先级，Splunk 提供了诸如 btool 命令和 REST API 接口等有用的工具。这些工具允许你轻松查看配置设置及其优先级。\n\
    \n然而，在深入了解这些工具之前，让我们先重点关注索引期间的优先级。\n\n## 索引时优先级\n\n索引时优先级指的是适用于整个系统整体的配置设置，而不是针对单个用户。这些设置在全局系统级别运行，并参与诸如在输入阶段索引数据和监控文件等活动。\n\
    \n在索引期间，各种配置文件都会发挥作用，包括 indexes.conf、server.conf、serverclass.conf 和 inputs.conf。这些文件包含影响索引活动执行方式、服务器配置方式以及数据输入监控方式的基本配置。\n\
    \n让我们了解这些组件：\n\n- `--debug`：此选项显示 conf 文件在系统、应用或用户目录中位置的绝对路径。与 `--debug` 选项类似，还有许多有用的选项。要查看完整列表，请执行以下命令\
    \ – `$SPLUNK_HOME/bin/splunk help btool`。\n- `--user`：此选项显示给定用户可见的配置数据。\n- `--app`：此选项显示给定应用可见的配置数据。\n\
    - `<conf_file_prefix>`：这指的是各种配置文件名中使用的前缀——例如，props、inputs、indexes 和 transforms。\n\
    \n让我们看一个针对 indexes.conf 文件使用 --debug 选项的 btool 命令示例：\n\n```\n./splunk btool indexes\
    \ list --debug\n```\n\n在给定的示例中，使用 btool 命令以调试模式列出索引。我们将获得以下输出——正如你在下图中看到的，indexes\
    \ list --debug 选项显示了 conf 文件的绝对路径以及与索引名称 _internal 关联的每项设置。\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_118_0.png)\n\
    \n图 6.3：indexes.conf 的 btool 命令结果\n\n另一个有用的 btool 命令是检查 conf 文件中是否有任何拼写错误。它通常在每次\
    \ Splunk 实例启动时运行。语法如下：\n\n```\n./splunk btool check\n```\n\n请记住关于 btool 的以下事实：\n\
    \n- btool 生成的输出可能无法反映已加载内存的当前状态。如果对配置文件进行了需要重启服务的更改，即使该更改尚未在活动系统状态中生效，btool 报告也可能反映此更改。\n\
    - btool 不受 Splunk 官方支持；但它非常强大且有用。在处理 Splunk 支持案例时，他们可能会要求提供 Splunk diag 报告，该报告包含\
    \ btool 报告输出。\n- 使用 btool 查看 inputs.conf 文件时，输出中不会显示 [default] 节中的设置。\n- 你可以在无需\
    \ Splunk 进程处于运行状态的情况下执行 btool 命令。\n\n## 自我评估\n\n你将获得 10 个问题和可供选择的答案。问题模式与我们在第\
    \ 1 章中讨论的相同。评估结束后，请参阅与你难以回答的问题相关的章节。或者，你也可以参阅 Splunk 文档。祝一切顺利！让我们开始吧。\n\n- 1.\
    \ 哪个 conf 文件是定义换行解析设置所必需的？\n  A. outputs.conf\n  B. line_breaker.conf\n  C. props.conf\n\
    \  D. server.conf\n\n- 2. 直接在文件系统上创建 conf 文件会自动重新加载 Splunk 配置吗？\n  A. 会\n  B.\
    \ 不会\n\n- 3. 如何在独立 Splunk 实例上重新加载 conf 文件更改？（选择所有适用项）：\n  A. 在 conf 文件末尾添加 restart\
    \ = true 设置。\n  B. 使用 debug/refresh 端点。\n  C. 重启 Splunk 实例。\n  D. 什么都不做——Splunk\
    \ 会自动重新加载。\n\n- 4. 作为数据管理员，你需要在通用转发器（UF）上的 /opt/splunkforwarder/etc/apps/MyApp\
    \ 目录中调整名为 MyApp 的应用的 INDEXED_EXTRACTIONS 设置。MyApp 默认在 default/ 目录下包含了 props.conf。你将采取什么行动？\n\
    \  A. 登录 UF 并更新 props.conf，因为该更改仅在单个主机上需要。\n  B. 登录 UF，在 MyApp 下创建 /local 目录，并使用所需设置创建\
    \ props.conf 文件。\n  C. 什么都不做——props.conf 解析在 UF 上不起作用。\n  D. 什么都不做——这是系统管理员的工作，所以通知系统管理员。\n\
    \n- 5. 你能确定 conf 文件可以在 Splunk 上创建或预存在的位置吗？其中 $SPLUNK_HOME = /opt/splunk？（选择所有适用项）：\n\
    \  A. 位置 – etc/apps/users/<user-name>/<app-name>/local/\n  B. 位置 – etc/apps/<app-name>/default/\n\
    \  C. 位置 - etc/apps/<app-name>/system/\n  D. 位置 - etc/system/default/\n  E. 位置\
    \ - etc/system/local/\n\n6. 在搜索时和索引时，Splunk 会考虑哪些配置文件来确定优先级？（选择所有适用项）：\n\n- A.\
    \ 搜索时 - savedsearches.conf、macros.conf 和 server.conf\n- B. 搜索时 - savedsearches.conf、macro.conf\
    \ 和 tags.conf\n- C. 索引时 - inputs.conf、server.conf、indexes.conf 和 savedsearches.conf\n\
    - D. 索引时 - inputs.conf、serverclass.conf、indexes.conf 和 server.conf\n\n7. 使用哪个\
    \ CLI 命令来排查 conf 文件错误？（选择所有适用项）：\n\n- A. ./splunk check errors\n- B. ./splunk\
    \ btool check\n- C. ./splunk btool <conf-file-name> list --debug\n- D. ./splunk\
    \ btool check-typos\n\n8. 用户 A 具有 power user 角色，并在搜索应用下创建了一个具有私有权限的警报。它将被存储在 Splunk\
    \ 上的什么位置？\n\n- A. $SPLNUK_HOME/etc/users/local/\n- B. $SPLNUK_HOME/etc/apps/search/users\n\
    - C. $SPLNUK_HOME/etc/users/User-A/search/local\n- D. $SPLUNK_HOME/etc/users/search/local\n\
    \n9. 用户 A 具有 power user 角色，创建了一个警报，并与一个名为 search 的应用共享。它将被存储在 Splunk 上的什么位置？\n\
    \n- A. $SPLNUK_HOME/etc/users/search/local\n- B. $SPLNUK_HOME/etc/apps/search/local\n\
    - C. $SPLNUK_HOME/etc/apps/users/User-A/search/local/\n- D. $SPLUNK_HOME/etc/apps/search/default/\n\
    \n"
