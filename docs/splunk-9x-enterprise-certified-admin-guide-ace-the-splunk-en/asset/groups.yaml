    \ specific hostname, such as myhost.com, this means that any lines in the data\
    \ that originate from the myhost.com host, will be truncated to a maximum length\
    \ of 1,000 bytes:\n\n```\n[host::myhost.com]\nTRUNCATE = 1000\n```\n\n- **Stanza\
    \ precedence:** When multiple stanzas match a given event, the settings defined\
    \ in the most specific stanza take precedence over those defined in less specific\
    \ stanzas. Specifically, settings defined in [host::<host or host pattern>] stanzas\
    \ override those in [<sourcetype name>] stanzas, and settings defined in [source::<source\
    \ or source pattern>] stanzas take priority over both [host::<host or host pattern>]\
    \ and [<sourcetype name>] stanzas. This hierarchy of settings allows fine-grained\
    \ control over how data is processed in Splunk, ensuring that the most relevant\
    \ settings are applied to each event.\n\nAt this stage, we know about stanzas\
    \ that are useful in various scenarios. Let’s have a look at the parsing settings\
    \ specification for line breaking, timestamp identification, line merging, and\
    \ so on. I am going to use the sourcetype stanza to describe these settings. For\
    \ example, our sourcetype name is web_access. Do note that settings key names\
    \ are case-sensitive:\n\n```\n## Parsing settings for web_access sourcetype\n\
    [web_access]\nLINE_BREAKER = < regex: By default, set to number of new line or\
    \ carriage returns ([\\r\\n]+) >\nSHOULD_LINEMERGE = <true | false - To merge\
    \ several multi-line events into one event. If set to true it depends on the number\
    \ of other settings. Read full spec>\nBREAK_ONLY_BEFORE = <Applicable only if\
    \ SHOULD_LINEMERGE set to true>\nBREAK_ONLY_BEFORE_DATE = <Applicable only if\
    \ SHOULD_LINEMERGE set to true>\nTIME_PREFIX = < Regex: If set, Splunk software\
    \ scans the event text for a first match of this regex before attempting to extract\
    \ a timestamp.>\nTIME_FORMAT = <strptime-style format>\nMAX_TIMESTAMP_LOOKAHEAD\
    \ = < Integer: The number of characters into an event Splunk software should look\
    \ for a timestamp. By default, looks for first 128 characters >\nTZ = <Timezone\
    \ of the event, UTC, AEDT, AST and so on. If not set splunkd process timezone\
    \ is considered by default.>\nTRANSFORMS-<class name> = <transforms.conf stanza1>,\
    \ <transforms.conf stanza2>\n```\n\nWhile the preceding settings can be useful\
    \ for optimizing Splunk's data processing, it's worth noting that Splunk will\
    \ attempt to use default values whenever possible. These defaults are designed\
    \ to provide a reasonable level of performance and functionality for most use\
    \ cases. The TRANSFORMS-<class name> setting is relevant to transforms.conf, which\
    \ we will discuss in the next section. Let's categorize these settings by their\
    \ function:\n\n- **Line breaking:** The LINE_BREAKER setting breaks the data stream\
    \ into individual lines of events. By default, it looks for the number of new\
    \ lines or carriage returns to find the event boundary. SHOULD_LINEMERGE must\
    \ be set to false if LINE_BREAKER is set, and this is advisable for performance\
    \ reasons.\n- **Line merging:** SHOULD_LINEMERGE combines multiple events into\
    \ a single event. You can set this to true or false; by default, it is set to\
    \ true. When we set this to true, other settings such as BREAK_ONLY_BEFORE_DATE\
