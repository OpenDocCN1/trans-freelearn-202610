    ## Contributors


    ## 关于作者


    **Srikanth Yarlagadda** 是一位经验丰富的 Splunk 安全顾问，专注于最大化 Splunk 平台的潜力以强化组织的网络安全态势。他的主要职责包括利用
    Splunk Enterprise 及其 **安全信息和事件管理 (SIEM)** 和 **安全编排、自动化与响应 (SOAR)** 功能。Srikanth
    在为 **安全运营中心 (SOC)** 团队监控、检测、调优和自动化安全威胁场景方面表现出色。


    凭借扎实的背景，Srikanth 在管理 Splunk Enterprise 方面拥有丰富的经验。他熟练地处理系统管理任务，并 expertly 协调来自各种来源的数据接入。他的专长还延伸到在电信领域开发各种业务用例，体现了
    Splunk 的强大功能。Srikanth 已获得以下官方 Splunk 认证：Splunk Enterprise Architect、Splunk Admin、Enterprise
    Security Admin 和 Splunk SOAR Developer。


    在他早期的职业生涯中，Srikanth 的 IT 之旅涉足了多个技术领域。他曾担任熟练的 Java 开发人员和熟练的 SOA 开发人员，甚至涉足使用 **Oracle
    Communications Services Gatekeeper (OCSG)** 和 Oracle SOA Suite 的电信协议实现领域。


    Srikanth 的专业知识还体现在他作为 SplunkTrust 成员的积极参与上，这是他贡献和奉献的证明。他在 Splunk 充满活力的社区论坛中频繁参与，在那里分享见解并与同好合作。


    *我非常感激那些给予我信任并提供机会的组织。他们对我的能力的信任推动我走到今天的阶段。*


    ## 关于审阅者


    **Trayton White**，自称“世界上最普通的 Splunk 巫师”，在其职业生涯中一直在多个行业 tinkering with systems。最近，他通过测试新
    Splunk 产品并开发技术所帮助解决的新颖用例来从事新 Splunk 产品的开发。通过采用“让我们试试看”的方法，他深入了解了 Splunk 的内部工作原理，并乐于与他人分享这些信息。


