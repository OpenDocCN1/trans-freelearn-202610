    To add a single-site clustered indexer to a search head, issue the following command
    in the $SPLUNK_HOME/bin directory on the search head. Behind-the-scenes configuration
    settings will be added to the server.conf file in the $SPLUNK_HOME/etc/system/local
    directory:


    ```

    ./splunk add cluster-manager <scheme>://<host>:<port> -secret <indexers-pass4symmkey>
    -multisite false

    ```


    This command must be repeated for every cluster manager.


    Let’s look at the elements of this command:


    +   - `<scheme>://<cluster-manager-servername>:<management-port>` is the cluster
    manager details

    +   - `<indexer-pass4symmkey>` is the pass4SymmKey/secret/security key of the
    indexer cluster


    As an illustration, assuming you’ve previously executed a command to add the cluster
    manager address SplunkManager01.example.com, the server.conf file now displays
    the following content:


    ```

    [clustering]

    mode = searchhead

    manager_uri = https://SplunkManager01.example.com:8089

    pass4SymmKey= encrypted-secreteast

    ```


    For further options, such as listing, editing, or removing a cluster manager,
