    ## Splunk Forwarder Management


    The *forwarder* name should sound familiar at this stage as you will have already
    read about two types of forwarder: the **universal forwarder (UF)** and the **heavy
    forwarder (HF)**. These are two different software binaries built for specific
    use cases. In this chapter, you will learn more about UFs, which are managed centrally
    through the **deployment server (DS)** in large and complex Splunk Enterprise
    environments.


    We will begin by learning more about the purpose of UFs in the overall Splunk
    deployment architecture, followed by configuring the DS, and the installation
    and configuration of UF. Configuration includes connecting the UF to external
    indexers for data forwarding and using the `deploymentclient.conf` configuration
    to download apps from the DS. Finally, you will be introduced to monitoring forwarders
    through the monitoring console application.


    This chapter holds significant importance not only for system administrators but
    also for data administrators. It involves shared responsibilities between both
    types of administrators, including installing the UF, DS, and indexer connection
    configuration that are prerequisites for data administrators to create the necessary
    data inputs on the forwarder to ingest data into indexers.


    In this chapter, we will cover the following topics:


    - Introducing the universal forwarder

    - Configuring the deployment server

    - Installing the universal forwarder

    - Configuring forwarding on the universal forwarder

    - Configuring `deploymentclient`

    - Forwarder monitoring


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_79_0.png)


    Figure 4.1: UF existence in a source host


    In the preceding figure, the UF is installed on a host where the web server is
    running. The UF intends to read the web server logs and forward them to indexers.


    Let’s go through the configuration of the DS, followed by installing and configuring
    the UF.


    ## Configuring the Deployment Server


    The DS, as its name suggests, centrally manages the deployment to forwarders.
    It can deploy to both UFs and HFs and is optionally able to restart them after
    apps have been deployed. In this section, you will find out about the capabilities
    of DS and the configuration required to manage the forwarders.


    Let’s go through the DS setup requirements:


    - The DS is an instance of Splunk Enterprise software that requires a Splunk Enterprise
    license.

    - Forwarders, whether they’re UFs or HFs, require a deploymentclient.conf file
    to be configured to establish a connection with the Splunk DS. This configuration
    file enables the forwarder to “phone home” and communicate with the DS. By either
    manually editing the deploymentclient.conf file or using the Splunk CLI, the forwarders
    can establish the required connection with the DS.

    - The serverclass.conf configuration file for managing server classes can be set
    up through the Splunk Web interface by navigating to the Settings | Forwarder
    Management menu. The typical location of the serverclass.conf file on the Splunk
    DS is $SPLUNK_HOME/etc/system/local. Refer to Figures 4.2 and 4.3 for more details
    about the Splunk Web interface.

    - Splunk apps/add-ons can either be custom-built by following the Splunk app structure
    or downloaded from splunkbase.com, where hundreds of pre-built apps/add-ons are
    available.

    - Apps/add-ons that need to be deployed to forwarders are placed in the `$SPLUNK_HOME/etc/deployment-apps`
    directory.

    - Apps that are deployed through the DS are stored in the forwarder client''s
    `$SPLUNK_HOME/etc/apps` directory.


    Let’s look at the configuration of `serverclass` in the next section.


    ## Configuring serverclass


    To configure the DS via the Splunk web forwarder management approach, at least
