    # SAML


    SAML is useful for enabling an SSO authentication scheme on the Splunk platform
    so that users will be able to log in through SSO identification. The Splunk platform
    supports the SAML 2.0 protocol version and contacts the IdP to retrieve the user’s
    SAML group information. Similar to LDAP, the SAML groups are mapped upfront to
    Splunk roles by Splunk administrators.


    There is very good documentation available from Splunk to configure SSO using
    SAML-based authentication. You can refer to the docs here: https://tinyurl.com/294zrc8u.


    # MFA


    MFA is supported by the Splunk platform through Duo and RSA security mechanisms,
    as shown in Figure 3.7. This method will let users authenticate to the Splunk
    platform using more than one service for enhanced security.


    Configuration is done through the Splunk Web Settings | Authentication methods
    | Multifactor Authentication menu, selecting one of the radio buttons (Duo or
    RSA), then clicking on the Configure Duo Security hyperlink, filling in the form,
    and clicking the Save button.


    If you want to deep-dive into the detailed steps, follow the Splunk documentation
    link: https://tinyurl.com/sv8rnwhb.


    # Scripted authentication


    The Splunk platform provides a script-based authentication method for an external
    system such as Remote Authentication Dial-In User Service (RADIUS) or a pluggable
    authentication module (PAM). There is no direct option in Splunk Web to configure
    it; however, the sample scripts are available under SPLUNK_HOME/shared/authScriptSamples,
    where you can follow the instructions in the README file.


