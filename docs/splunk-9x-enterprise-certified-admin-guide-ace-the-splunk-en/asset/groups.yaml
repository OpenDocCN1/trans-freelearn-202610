    ## Splunk Enterprise 试用许可证


    首次安装 Splunk Enterprise 时，默认启用试用许可证。试用许可证具有以下特性：


    - 它仅在 60 天内有效。超过此期限后，必须选择其他许可证类型才能继续使用该产品。

    - 它允许您使用 Splunk Enterprise 的全部功能。

    - 它仅适用于单个/独立的 Splunk Enterprise 实例。

    - 该许可证将每日数据摄入量限制为 500 MB。超过此限制，Splunk 将发出许可证警告。*理解许可证警告和违规*一节详细解释了许可证违规。


    ## Splunk 免费许可证


    免费许可证永久有效，并且仅支持 Splunk Enterprise 功能的子集：


    - 它禁用告警、身份验证、集群、分布式搜索、摘要以及向非 Splunk 服务器的转发。

    - 每日数据摄入限制为 500 MB。许可证违规会阻止搜索功能。下一节*理解许可证警告和违规*将提供更多详细信息。

    - 它仅适用于单个/独立的 Splunk 实例。


    ## 转发器许可证


    Splunk 提供多种转发器。最常用的是**通用转发器（UF）**和**重型转发器（HF）**。让我们看看该许可证如何应用于这两种主要的转发器类型：


    - UF 默认已嵌入许可证，因此无需显式安装/配置许可证。

    - UF 是独立的二进制软件，消耗的资源比 HF 少。UF 可以将数据通过身份验证转发到索引器。

    - HF 是一个完整的 Splunk Enterprise 实例二进制文件，需要转发器许可证或 Enterprise 许可证。

    - 转发器许可证默认嵌入在 Splunk Enterprise 软件包中。

    - 带有转发器许可证的 HF 不允许进行索引。但是，允许进行身份验证。

    - 需要索引、高级身份验证和 KV Store 的 HF 需要 Enterprise 许可证。


    开发者许可证纯粹面向应用程序开发者，并启用 Splunk Enterprise 的所有功能。每个许可证都会强制执行限制——例如，许可证受限于天数、数据量、vCPU
    数量等。下一节将详细说明许可证警告的产生、如何转变为违规，以及随后详细介绍 Splunk Enterprise 针对每种许可证类型限制的具体功能。


    ## 理解许可证警告和违规


    如果系统管理员希望维护平台的连续性，那么理解许可证限制及其对 Splunk Enterprise 平台的影响非常重要。许可证类型（无论是从 Splunk 购买的还是免费的）都会强制执行限制，但基础设施许可证除外，它计算
    vCPU 的数量，并且不强制执行许可证违规限制。其余许可证类型对每日数据量或索引数据量强制执行限制。


    如果许可证超出了每日允许的数据量，Splunk Enterprise 将发出许可证警告。当警告数量超过某个阈值时，即称为许可证违规。每种许可证类型的阈值都不同。许可证违规会禁用
    Splunk Enterprise 的重要功能。


    许可证警告会出现在 Splunk Web 的管理消息中。它们会保留数天，以便系统管理员解决。可以在监控控制台中启用许可证使用情况告警。


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_50_0.png)


    图 2.1：监控控制台告警——许可证使用情况和到期时间


    图 2.1 显示了您在监控控制台中可能收到的告警。这些告警默认处于禁用状态；您可以启用它们，并了解当使用量接近每日配额和/或许可证即将到期时它们的工作方式。


    许可证违规会禁用重要的 Splunk 功能，这意味着在违规期间只有部分功能可用。让我们看看在违规期间搜索和索引会发生什么：


    - 搜索功能（包括报表和告警）将被阻止，但内部索引除外，例如 _internal、_audit 和 _introspection

    - 索引器将继续对数据进行索引


    下面讨论每种许可证类型的警告和违规阈值：


    - **Splunk Enterprise 试用许可证：** 在滚动 30 天周期内出现 5 次或以上警告即构成违规。许可证警告会保留 14 天。在违规期间，搜索会被阻止，索引会继续。如果您希望修复许可证违规以恢复搜索功能，没有重置选项。建议的方法是重新安装整个
    Splunk Enterprise 实例。

    - **Splunk 免费许可证：** 在滚动 30 天周期内出现 3 次或以上警告即构成违规。许可证警告会保留 14 天。在违规期间，搜索会被阻止，索引会继续。与试用许可证类似，免费许可证无法重置，重新安装是唯一的选择。

    - **Splunk Enterprise 许可证：** 每日数据量为 100 GB 或以上的许可证堆栈不会强制执行许可证警告和违规。每日数据量低于 100
    GB 的许可证堆栈会发出许可证警告。在滚动 60 天周期内出现 45 次或以上警告即构成违规，此时搜索会被阻止，而索引会继续。要重置 Enterprise
    许可证，请联系 Splunk 销售团队；他们将能够解锁所需的搜索功能。

    - **Splunk Enterprise 基础设施许可证：** 此许可证类型不会产生违规。

    - **Splunk 开发者许可证：** 在滚动 30 天周期内出现 5 次或以上警告即构成违规。许可证警告会保留 14 天。在违规期间，搜索会被阻止，索引会继续。开发者许可证可以通过联系
    Splunk 开发者计划团队（devinfo@splunk.com）进行重置以解锁搜索功能。

    - **Splunk 转发器许可证：** 转发器许可证不适用任何违规规则。它是 Splunk Enterprise 软件包中的嵌入式许可证。在转发器许可证上进行索引需要
    Enterprise 许可证或基础设施许可证。


    总之，Splunk 许可证警告会提前告知管理员整体许可证使用情况，以便他们在违规发生之前采取必要的行动。在一段时间内，警告序列超过规定阈值将导致违规。在违规期间，除内部索引外，搜索会被阻止，索引会继续。超过
    100 GB 的 Enterprise 堆栈许可证和 Enterprise 基础设施许可证都不会强制执行违规，但其余许可证类型会强制执行违规规则。除免费许可证和试用许可证外，违规的许可证可以重置。


    我们已经介绍了很多关于许可证警告和违规的信息；不过，您可能想知道 Splunk Enterprise 在哪个阶段跟踪许可证使用情况，以及在分布式部署架构中哪个组件跟踪使用情况。接下来的两节将重点介绍许可证管理器组件中的许可证安装，我们将详细讨论许可证在许可证使用量计算方面究竟是如何工作的。


    ## 许可证的工作原理


    Splunk Enterprise 许可证按许可证堆栈或单个池跟踪每天的索引数据量。要深入了解许可证组、堆栈和池，请参阅 Splunk 文档：


    `https://docs.splunk.com/Documentation/Splunk/9.0.3/Admin/`


    组、堆栈、池和其他术语。本文档的内容将在下一节“安装、管理和监控许可证”中介绍。


    在分布式基础架构中，一个专用的 Splunk Enterprise 实例将被分配许可证管理器角色，负责跟踪整个部署的许可证使用情况。其余实例充当许可证对等节点，向管理器报告。


    许可证配额每天从午夜到午夜进行计量，这意味着它会重置为次日的完整配额，这是一个与管理器系统时钟协同工作的持续过程。Splunk 支持两种类型的索引，称为事件索引和指标索引。它们将在第
    5 章“Splunk 索引管理”中介绍。对于指标索引，许可证使用量计算上限为每个指标事件固定 150 字节；对于事件索引，则按事件的完整数据大小计算。


    来自源头的原始数据在被索引到索引器之前会经历多个阶段。数据大小在索引阶段进行计量。各阶段将在第 8 章“数据接入”中解释。到目前为止，我们讨论了从外部源索引数据。每个正在运行的
    Splunk Enterprise 实例本地都会生成大量数据。这些数据存储在以 _（下划线）开头的内部索引中，即 _internal、_audit、_introspection、_metrics
    和 _telemetry。


    让我们看看哪些数据不计入许可证配额：


    - Splunk 内部日志不计入

    - 为高可用性而存储在索引器集群中的复制副本

    - 具有 stash 源类型的摘要索引

    - 已索引的数据，因为它包含 tsidx 文件、元数据等，以实现更快的检索


    总之，许可证配额每天从午夜到午夜进行计量。数据大小在索引阶段计算。指标索引数据上限为每个事件 150 字节，事件索引数据则根据事件的完整大小计算。内部日志、摘要索引和复制数据不计入许可证。在分布式部署中，专用实例充当许可证管理器，在其中安装和配置许可证文件；其余实例充当许可证对等节点，并向许可证管理器报告。


    ## 安装、管理和监控许可证


    既然您已经全面了解了许可证类型以及许可证使用量如何根据许可证配额进行计算，我们将讨论添加、配置和管理许可证。作为系统管理员，这些任务非常重要。我们将以 Splunk
    Enterprise 许可证类型为例，讨论以下主题：


    - 添加许可证

    - 许可证堆叠和池


    '
