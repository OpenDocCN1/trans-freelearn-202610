    # Scenario 2


    In this scenario, we will look at the same setting created in two different apps.


    App names can contain lowercase letters, uppercase letters, numbers, spaces, and
    special characters. If the same setting exists in two different apps, then the
    order in which Splunk decides to execute them at runtime is decided by sorting
    the apps in reverse lexicographical order.


    For example, in the case of the same macro that we looked at in scenario 1, [high_response_time]
    is defined and shared with users that have access to the two apps, WebApp and
    ITOpsApp.


    In this case, if both WebApp and ITOpsApp have a macro with the same name [high_response_time],
    the macro definition in the WebApp app would take precedence over the one in the
    ITOpsApp app. This precedence is determined by the reverse lexicographical order
    of the app names.


    This means that when Splunk resolves the [high_response_time] macro, it will first
    look in the WebApp app, and if it finds a definition there, it will use that definition.
    If no definition is found in the WebApp app, then Splunk will look in the ITOpsApp
    app:


    ```

    ## ITOpsApp macro is to check response time of requests over 2000 milli seconds

    [high_response_time]

    definition = index=web_logs sourcetype=access_log response_time_ms>=2000

    ```


    If you are curious about lexicographical and reverse order, Splunk Lantern has
    a very good article that goes into more detail: https://tinyurl.com/22hjs8am.


    To avoid the hassle of manually checking each setting in every configuration file
    to understand how Splunk determines precedence during runtime, Splunk provides
    helpful tools such as the btool command and REST API interfaces. These tools allow
    you to easily examine the configuration settings and their priorities.


    However, before diving into those tools, let''s first focus on understanding precedence
    during index time.


    # Index-time precedence


    Index-time precedence refers to the configuration settings that apply to the system
    as a whole, rather than being specific to individual users. These settings operate
    at a global system level and are involved in activities such as indexing data
    and monitoring files during the input phase.


    During index time, various configuration files come into play, including indexes.conf,
    server.conf, serverclass.conf, and inputs.conf. These files contain essential
    configurations that affect how indexing activities are performed, how servers
    are configured, and how data inputs are monitored.'
