    - To look at the complete list of allowed configurations that are included in
    the knowledge bundle, refer to [replicationAllowlist] and [replicationSettings:refineConf]
    inside the distsearch.conf file of the search head. To check the bundle replication
    status, you can issue the splunk show bundle-replication-status command on the
    search head, or you can use the monitoring console, which has a dashboard under
    its search menu.


    In cases where the common knowledge bundle version cannot be replicated across
    all search peers, it might lead to a temporary search interruption. The search
    process may pause for a few seconds as it attempts to synchronize the knowledge
    bundle across peers. If establishing a common bundle proves unsuccessful, the
    search process will eventually give up and resume without achieving synchronization.
    In that case, the Splunk administrator will take the necessary action by identifying
    the slow search peer and quarantining it on the search head to prevent the peer
    from participating in future searches. After quarantine, the search peer ensures
    that already running searches are completed. The quarantine action suspends knowledge
    bundle replication to only that peer.


    Quarantine can be achieved through Splunk Web by clicking on Settings | Distributed
    Search | Search peers. You can also do it through the CLI. After successful restoration,
    unquarantine the peer so it can participate in future searches.


    Here are the CLI quarantine and unquarantine commands:


    ```

    ./splunk edit search-server -auth <user>:<password> <host>:<port> -action [quarantine|unquarantine]

    ```


    Let’s examine this in more detail:


    - <user>:<password> is the search head’s admin-level credentials

    - <host>:<port> is the search peer’s host and management port

    - The -action values are quarantine or unquarantine


    Let’s conclude; a knowledge bundle is an archive file that is shared with search
    peers by the search head through a background replication process. A knowledge
    bundle contains knowledge objects that are applied by search peers to search results
    before being returned to the search head. The bundle size limit is applicable
    by default, and to reduce its size, certain knowledge objects can be added to
    the replicationDenyList setting on the search head. To suspend bundle replication
    to a particular peer, you can quarantine that search peer.


