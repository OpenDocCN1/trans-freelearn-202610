    \ Enterprise 认证管理员考试入门”中的“了解 Splunk 组件”部分。\n+   4. 选项 A 是正确答案。索引器的重要功能是存储数据并响应用户通过搜索头（SH）发出的搜索请求。在典型的生产部署中，索引器上会禁用\
