    ## Splunk 配置文件


    配置文件是 Splunk Enterprise 不可或缺的一部分。你通过 Splunk Web、CLI 或 RESTful 接口所做的任何配置更改，都会在后台直接更新到
    conf 文件中。因此，凡是遇到 “.conf”、“conf”、“config” 或 “configuration file” 等术语，都应理解为同一概念。存在许多这样的
    conf 文件，各自用于满足特定目的。在本章中，你将看到跨 Splunk 组件（如搜索头、索引器和转发器）常用文件的使用示例。这些文件可以存储在多个位置，例如用户目录、系统目录和应用目录。你将了解这些文件如何在内存中合并以进行处理。当你熟悉了可以存储
    .conf 文件的目录结构后，你将理解它们的优先级、处理顺序，并使用 btool 命令查找它们。


    你将了解到 .conf 文件对 Splunk 系统管理员和数据管理员都至关重要。系统管理员通常需要调整或重新配置系统级设置，而数据管理员则负责数据摄取、搜索时和索引时的知识对象创建，以及数据索引的故障排除。了解
    conf 文件如何协同工作，并通过 btool 和 RESTful 接口查看合并后的 conf 文件，对于每个人更深入地了解 Splunk 都是必要的。


    在本章中，我们将涵盖以下主题：

    - 理解 conf 文件

    - 理解 conf 文件的优先级

    - 排查 conf 文件问题


    ## 理解 conf 文件


    Splunk Enterprise 中的 .conf 文件是在数据转发、解析、索引和搜索运行时发挥特定功能的配置文件。这些文件包含重要设置，可以通过文件系统直接或间接（通过
    Splunk Web、CLI 或 REST API）进行修改。


    让我们探索有关 .conf 文件的关键信息。


    ## 文件格式和访问


    要修改或创建新的 .conf 文件，你需要访问 Splunk 组件的文件系统。这通常需要在安装 Splunk 的机器上具有适当的权限或管理员权限。通过访问文件系统，你可以使用文本编辑器或其他工具编辑
    .conf 文件。


    ## 结构和语法


    .conf 文件使用 <key/attribute> = <value> 格式来定义设置。每个键都有其自身的含义，并且键区分大小写。设置被组织成唯一的 [<stanza>]
    节。遵循每个 .conf 文件的定义规范非常重要，这些规范可以在 Splunk 的在线文档或安装目录下的 $SPLUNK_HOME/etc/system/README
    中以 .spec 扩展名找到。


    例如，在 props.conf 文件中，KV_MODE 是正确的属性，而 kv_mode 被视为不同且不正确的属性。在 .conf 文件中定义属性时，请确保按照相应
    conf 文件的规范使用正确的大小写。以下是一个 props.conf 文件的示例结构，包含 [default] 节和其他自定义节：


    ```

    # This is a comment in .conf files

    # Global settings applied to all stanzas in props.conf

    [default]

    TIME_FORMAT = %Y-%m-%d %H:%M:%S

    TRUNCATE = 20000

    CHARSET = UTF-8


    # Specific settings for a sourcetype

    [access_logs]

    EXTRACT-field_name = "^\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\]"


    # Settings for a host

    [host::server1]

    TRANSFORMS-sethost = sethost_server1

    LINE_BREAKER = ([\r\n]+)(\d{4}-\d{2}-\d{2})

    EXTRACT-myfield1 = myregex1

    EXTRACT-myfield2 = myregex2

    ```


    以下是关于此示例的一些说明：

    - 可以使用行首的 # 符号添加注释

    - [default] 节设置应用于所有源类型的全局设置，除非被覆盖

    - [access_logs] 节为 access_logs 源类型定义特定设置

    - [host::server1] 节为名为 server1 的特定主机指定设置


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_111_0.png)


    图 6.1：conf 文件的目录结构和位置


    图 6.1 显示了位于 SPLUNK_HOME 下的 etc\users\<user_name>\<app_name>、etc\apps\<app_name>\
    和 etc\system 目录中的 conf 文件。其中的子目录 \default 和 \local 是 .conf 文件的典型位置：

    - 图中的 <user_name> 显示了内置的 admin 和 splunk-system-user 用户

    - 图中的 <app_name> 显示了开箱即用的 search 应用及其子目录结构


    Splunk 建议不要更改 etc\system\default 目录中的 conf 文件。相反，应创建一个 etc\system\local\ 目录，并将自定义配置放在其中。


    ## 需要记住的要点


    Splunk 定义了多个配置文件，这些文件附带相应的 .spec 扩展名规范。这些资源可以在 $SPLUNK_HOME/etc/system/README
    目录中找到，同时还有说明性示例。


    每个 conf 文件都有一个基本结构，即 [<stanza>] 节以及下层的 <key> = <value> 键值对设置。键区分大小写。


    Splunk 在 $SPLUNK_HOME/etc/system/default 目录下提供默认的 conf 文件，不建议编辑此目录中的文件。因此，优先使用
    /local 目录来覆盖设置。


    不同目录中 .conf 文件的优先级决定了哪些设置优先。让我们探讨这些配置文件的考虑顺序。


    ## 理解 conf 文件的优先级


    $SPLUNK_HOME/etc 是典型 Splunk Enterprise 安装中所有 conf 文件所在的父目录。在此父目录下，配置文件可以在多个位置创建。你可能想知道为什么需要在多个位置存放相同类型的文件。


    在 Splunk 内在各个级别配置设置的能力，为管理员、开发者和用户提供了灵活性，使其能够根据特定需求定制平台。这种灵活性允许对单个应用和用户体验进行精确控制。在多个目录中具有相同节名称的文件的优先级由
    Splunk 决定。本节后面将介绍优先级。


    默认情况下，Splunk Enterprise 在 $SPLUNK_HOME/etc/system/default 目录下提供所有系统级配置，该目录不应被更改。因此，如果需要对
    /default 目录下的 conf 文件进行更改，建议在 $SPLUNK_HOME/etc/system/local 目录下创建，该目录优先于 /default
    目录。同样，conf 文件也可能存在于以下目录下：

    - $SPLUNK_HOME/etc/users：此目录包含由每个单独用户拥有的私有、特定于用户的更改。这种所有权确保了用户特定更改的隔离，并且默认不与其他用户共享。

    - $SPLUNK_HOME/etc/apps/<app_name>/[default|local]：在应用（app）的 <app_name> 目录内创建的配置存储在此处。这些配置对任何有权访问该应用的用户可用。通过为用户分配特定角色，你可以控制他们对应用的访问，包括查看和修改
    <app_name> 目录中配置的能力。

    - $SPLUNK_HOME/etc/system/local：存储在此 Splunk 目录中的配置被视为全局配置。这些配置对于 Splunk 实例中的每个用户都是可访问的。


    至此，你已了解配置文件目录的列表。让我们理解 Splunk 如何决定不同目录中相同 conf 文件的优先级（参见图 6.1）。优先级根据 conf 类型输入（如
    props、indexes 等）及其上下文来决定。


    配置设置使用的上下文也会影响优先级顺序。例如，某些配置设置可能仅适用于特定的应用或数据源，而其他设置可能全局应用于整个 Splunk 环境。两种上下文类型如下：

    - **全局**：独立于用户和应用上下文的配置文件包括与索引、监控、部署、服务器配置等相关的设置。这些配置独立于用户和应用上下文，并全局应用于 Splunk
    实例中的所有用户。


    '
