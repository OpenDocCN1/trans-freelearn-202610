    # Summary


    This first chapter of *Part 2* of the book aimed to get you started with Splunk
    data administration. We began with the introduction of data input types, including
    the file-based, network, agentless (HEC), and script-based options. There is also
    a special type of input that can be installed through TAs available from https://splunkbase.com.
    We also understood that these inputs are configured either by creating an `inputs.conf`
    file or through the Splunk CLI.


    Afterward, we looked at the default metadata fields assigned by Splunk, along
    with their significance when searching data. The `sourcetype` field plays a crucial
    role in Splunk as it helps classify and categorize data by its source type. Splunk
    uses a pre-trained list of source types to automatically detect and assign the
    appropriate sourcetype if none is specified during the input phase. `sourcetype`
    definitions are configured in the `props.conf` file, where data administrators
    create custom ones based on the type of data they’re working with. `sourcetype`
    configuration consists of important settings such as line breaking boundaries,
    timestamp extraction, and charset encoding. These settings are applied during
    the input, parsing, and indexing phases that we briefly examined.


    Splunk Web’s **Add Data** feature is a great way to test the data input by uploading
    a small amount of data and applying the sourcetype settings. We looked at the
    steps involved to upload an access log data file to our Splunk instance. We also
    saw how the Add Data feature offers other ways to index data through forwarders
    and by monitoring local files on the Splunk instance.


    In the next chapter, we will deep-dive into the Splunk data inputs that we were
    briefly introduced to at the beginning of this chapter.


