    # Exploring Windows inputs


    The input types that we have gone through so far are neither technology- nor OS-specific.
    However, here, as the name suggests, Windows inputs work on Windows-only hosts.
    The host requires at least a UF or Splunk Enterprise instance to collect Windows-specific
    logs. Windows natively stores its logs in binary format, and the Windows inputs
    interact with OS APIs to get these logs.


    When installing a UF on Windows hosts, you are given the option to enable Windows
    inputs. With a Splunk Enterprise instance, Windows inputs can be configured through
    Splunk Web via **Settings | Data Inputs** and then choosing **Local event log
    collection** and **Remote event log collection**. Remote event log collection
    requires a Windows domain account for log collection from remote hosts.


    In a large-scale Windows host environment with UF already configured, use a deployment
    server to centrally manage inputs. Create and configure `inputs.conf` within the
    app. Deploy the app to the forwarders for efficient and centralized input configuration.
    Let’s look at some key facts about Windows inputs:


    +   - Windows inputs are able to collect Windows events, AD, performance monitoring,
    registry, printer, host, and network logs.

    +   - **Windows Management Instrumentation (WMI)** is used to collect event logs
    from remote hosts in the network, typically on Windows servers with domain accounts.

    +   - Remote event log collection is configured in the `wmi.conf` file. The full
    specification is available at `https://tinyurl.com/37mdekpe`.

    +   - Enabling Windows logs can lead to significant data size increases, potentially
    consuming a substantial portion of our Enterprise license. Splunk provides two
    settings, `whitelist` and `blacklist`, to filter unwanted event logs before they
    even get indexed. This helps to reduce the license usage and index only required
    events.'
