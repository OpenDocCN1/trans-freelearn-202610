    +   - To look at the complete list of allowed configurations that are included
    in the knowledge bundle, refer to [replicationAllowlist] and [replicationSettings:refineConf]
    inside the distsearch.conf file of the search head. To check the bundle replication
    status, you can issue the splunk show bundle-replication-status command on the
