    As another example, when you set TRUNCATE to 1000 for a specific source, such
    as /var/log/web-server/access.log, this means that any lines in the data that
    match that source pattern will be truncated to a maximum length of 1,000 bytes.
    Setting TRUNCATE to 1000 for source restricts the maximum line length in bytes
    for sources that match the specified pattern:


    ```

    [source::/var/log/web-server/access.log]

    TRUNCATE = 1000

    ```


    +   **The host field:** The [host::<host or host pattern>] stanza is useful for
    defining the custom configuration settings for data originating from the given
    host or host pattern. These settings could be related to data formatting, extraction
    rules, and many other things according to the props.conf specification during
    the parsing phase:


    ```

    [host::< host or host pattern >]

    <key> = <value>

    ```


    For example, when you set TRUNCATE to 1000 for a specific hostname, such as myhost.com,
    this means that any lines in the data that originate from the myhost.com host,
    will be truncated to a maximum length of 1,000 bytes:


    ```

    [host::myhost.com]

    TRUNCATE = 1000

    ```


    +   **Stanza precedence:** When multiple stanzas match a given event, the settings
    defined in the most specific stanza take precedence over those defined in less
    specific stanzas. Specifically, settings defined in [host::<host or host pattern>]
    stanzas override those in [<sourcetype name>] stanzas, and settings defined in
    [source::<source or source pattern>] stanzas take priority over both [host::<host
    or host pattern>] and [<sourcetype name>] stanzas. This hierarchy of settings
    allows fine-grained control over how data is processed in Splunk, ensuring that
    the most relevant settings are applied to each event.


    At this stage, we know about stanzas that are useful in various scenarios. Let’s
    have a look at the parsing settings specification for line breaking, timestamp
    identification, line merging, and so on. I am going to use the sourcetype stanza
    to describe these settings. For example, our sourcetype name is web_access. Do
    note that settings key names are case-sensitive:


    ```

    ## Parsing settings for web_access sourcetype

    [web_access]

    LINE_BREAKER = < regex: By default, set to number of new line or carriage returns
    ([\r\n]+) >

    SHOULD_LINEMERGE = <true | false - To merge several multi-line events into one
    event. If set to true it depends on the number of other settings. Read full spec>

    BREAK_ONLY_BEFORE = <Applicable only if SHOULD_LINEMERGE set to true>

    BREAK_ONLY_BEFORE_DATE = <Applicable only if SHOULD_LINEMERGE set to

    ```'
