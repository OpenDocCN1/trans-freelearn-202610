    # Configuring the Deployment Server


    The DS, as its name suggests, centrally manages the deployment to forwarders.
    It can deploy to both UFs and HFs and is optionally able to restart them after
    apps have been deployed. In this section, you will find out about the capabilities
    of DS and the configuration required to manage the forwarders.


    Let’s go through the DS setup requirements:


    +   - The DS is an instance of Splunk Enterprise software that requires a Splunk
    Enterprise license.

    +   - Forwarders, whether they’re UFs or HFs, require a deploymentclient.conf
    file to be configured to establish a connection with the Splunk DS. This configuration
    file enables the forwarder to “phone home” and communicate with the DS. By either
    manually editing the deploymentclient.conf file or using the Splunk CLI, the forwarders
    can establish the required connection with the DS.

    +   - The serverclass.conf configuration file for managing server classes can
    be set up through the Splunk Web interface by navigating to the Settings | Forwarder
    Management menu. The typical location of the serverclass.conf file on the Splunk
    DS is $SPLUNK_HOME/etc/system/local. Refer to Figures 4.2 and 4.3 for more details
    about the Splunk Web interface.

    +   - Splunk apps/add-ons can either be custom-built by following the Splunk app
    structure or downloaded from splunkbase.com, where hundreds of pre-built apps/add-ons
    are available.'
