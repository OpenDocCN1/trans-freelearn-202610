    - C. replicationPolicy = mounted\n- D. replicationPolicy = rfs\n\n41. 在搜索头（SH）中，知识包复制的默认\
    \ maxBundleSize 限制是多少？\n\n- A. 2 GB\n- B. 4 GB\n- C. 1 GB\n- D. 3 GB\n\n42. 在\
    \ Splunk 的摄取过程中，数据要经历三个阶段。以下哪项是 Splunk 中数据处理的这三个阶段？\n\n- A. 输入\n- B. 解析\n- C.\
    \ 索引\n- D. 复制\n\n43. 在 Splunk 中，文件/目录监控的配置应放在哪里？\n\n- A. transforms.conf\n- B.\
    \ inputs.conf\n- C. props.conf\n- D. indexes.conf\n\n44. 在 Splunk 中用于添加输入（inputs）的\
    \ Splunk CLI 命令是什么？\n\n- A. splunk add monitor <path_to_data_source> -index <index_name>\
