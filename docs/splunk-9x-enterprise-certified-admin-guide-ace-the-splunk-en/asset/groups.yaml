    41. What is the default maxBundleSize limit for knowledge bundle replication in\
    \ the SH?\n\n- A. 2 GB\n- B. 4 GB\n- C. 1 GB\n- D. 3 GB\n\n42. During the ingestion\
    \ process in Splunk, data undergoes three phases. Which of the following are these\
    \ three phases of data processing in Splunk?\n\n- A. Input\n- B. Parsing\n- C.\
    \ Indexing\n- D. Replication\n\n43. Where should the configuration for file/directory\
    \ monitoring be included in Splunk?\n\n- A. transforms.conf\n- B. inputs.conf\n\
    - C. props.conf\n- D. indexes.conf\n\n44. What is the Splunk CLI command used\
    \ to add inputs in Splunk?\n\n- A. splunk add monitor <path_to_data_source> -index\
    \ <index_name> -sourcetype <sourcetype_name>\n- B. splunk add inputs <path_to_data_source>\
    \ -index <index_name> -sourcetype <sourcetype_name>\n- C. splunk add files <path_to_data_source>\
    \ -index <index_name> -sourcetype <sourcetype_name>\n- D. splunk add directory\
    \ <path_to_data_source> -index <index_name> -sourcetype <sourcetype_name>\n\n\
    45. What is the HTTP Event Collector (HEC) endpoint that allows ingestion of any\
    \ text payload in a request?\n\n- A. services/collector/event\n- B. services/collector/raw\n\
    - C. services/collector/text\n- D. services/collector/ack\n\n46. How can you selectively\
    \ ingest specific event codes for Windows inputs in Splunk?\n\n- A. By using Event_codes\
    \ = <comma separated codes list> in inputs.conf\n- B. By using whitelist/blacklist\
    \ settings in inputs.conf\n- C. There is no possible solution to selectively ingest,\
    \ so filter the codes while searching\n- D. None of these\n\n47. Can you identify\
    \ the data inputs through which data is ingested into Splunk? (Select all that\
    \ apply)\n\n- A. The HEC—agentless input\n- B. File and directory monitoring\n\
    - C. Network input\n- D. By using technology add-ons (TAs) for data collection\n\
