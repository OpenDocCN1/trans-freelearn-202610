  - '[PAGE 107]


    # Splunk Configuration Files


    Configuration files are an integral part of Splunk Enterprise. Any configuration
    change that you do via Splunk Web, the CLI, or a RESTful interface will get updated
    to a conf file directly behind the scenes. Henceforth, whenever encountering terms
    such as “.conf,” “conf,” “config,” or “configuration file,” they should all be
    understood to refer to the same concept. There are many such conf files that exist
    to fulfill a specific purpose. In this chapter, you will find examples of the
    usage of commonly used files across Splunk components, such as the search head,
    indexer, and forwarder. These files can be stored in multiple places, such as
    in user, system, and app directories. You will learn how these files get merged
    in memory for processing. As you get familiar with the directory structure where
    the .conf files can be stored, you’ll come to understand their precedence, the
    order in which they get processed, and find them using the btool command.


    You will learn that .conf files are highly important to both Splunk system administrators
    and data administrators. System admins often need to tune or re-configure system-level
    settings, and data admins do ingestion, search-time, index-time knowledge object
    creation, and troubleshooting of data indexing. Knowing how the conf files work
    together and seeing the merged conf files through btool and a RESTful interface
    is necessary for everyone to receive more insights into Splunk.


    In this chapter, we will cover the following topics:


    +   - Understanding conf files

    +   - Understanding conf file precedence

    +   - Troubleshooting conf files


    # Understanding conf files


    .conf files in Splunk Enterprise are configuration files that serve specific functions
    during the runtime of data forwarding, parsing, indexing, and searching. These
    files contain important settings and can be modified through the filesystem, either
    directly or indirectly via Splunk Web, the CLI, or a REST API.


    Let’s explore key information about .conf files.'
  - '[PAGE 108]


    # File format and access


    To modify or create new .conf files, you need access to the Splunk component filesystem.
    This typically requires appropriate permissions or administrative privileges on
    the machine where Splunk is installed. By accessing the filesystem, you can edit
    the .conf files using a text editor or other tools.


    # Structure and syntax


    The .conf files use the <key/attribute> = <value> format to define settings. Each
    key has its own significance, and keys are case-sensitive. Settings are organized
    into unique [<stanza>] sections. It''s important to follow the defined specification
    for each .conf file, which can be found in Splunk''s online documentation or the
    installation directory under $SPLUNK_HOME/etc/system/README with a .spec extension.


    For example, in the props.conf file, KV_MODE is the correct attribute, and kv_mode
    is treated as a different and incorrect attribute. Make sure to use the correct
    casing when defining attributes in .conf files by following the specification
    of the respective conf file. The following is an example structure of a props.conf
    file containing the [default] stanza and other customized stanzas:


    ```

    # This is a comment in .conf files

    # Global settings applied to all stanzas in props.conf

    [default]

    TIME_FORMAT = %Y-%m-%d %H:%M:%S

    TRUNCATE = 20000

    CHARSET = UTF-8


    # Specific settings for a sourcetype

    [access_logs]

    EXTRACT-field_name = "^\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\]"


    # Settings for a host

    [host::server1]

    TRANSFORMS-sethost = sethost_server1

    LINE_BREAKER = ([\r\n]+)(\d{4}-\d{2}-\d{2})

    EXTRACT-myfield1 = myregex1

    EXTRACT-myfield2 = myregex2

    ```


    Here are some notes on this example:


    +   - Comments can be added using the # symbol at the beginning of a line

    +   - The [default] stanza sets global settings that apply to all source types
    unless overridden

    +   - The [access_logs] stanza defines specific settings for the access_logs source
    type

    +   - The [host::server1] stanza specifies settings for a particular host named
    server1'
