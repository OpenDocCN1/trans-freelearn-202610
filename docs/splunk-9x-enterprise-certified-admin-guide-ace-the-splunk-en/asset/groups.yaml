    ### 使用 transforms 和 props


    我们将在此处使用相同的 call_records 日志样本，并使用 transforms.conf 和 props.conf 文件应用掩码设置。让我们看一下规范：


    ```

    # transforms.conf specification

    [<transforms-stanza-name>]

    SOURCE_KEY = <_raw by default, _MetaData:Index, MetaData:Sourcetype, MetaData:Host,
    MetaData:Source and so on>

    REGEX = <regular expression to operate on field contents specified in SOURCE_KEY>

    FORMAT = <specifies the format of the event works in accordance with REGEX, for
    fields format is fieldname::fieldvalue>

    DEST_KEY = <_raw for masking in data event, can set other keys as described in
    Spec>


    ## props.conf specification

    [<sourcetype-name> | source::<source name> | host::<hostname>]

    TRANSFORMS-<class> = <transforms stanza name 1>, <transforms stanza name 2>..
    <transforms stanza name N>

    ```


    transforms.conf 规范看起来很简单；然而，它支持超出本书范围的多种用例。可以使用来操作诸如 host、sourcetype、source 和
    queue 等元数据字段的键组合都描述在此处 - https://tinyurl.com/27sxf94z 的规范文件中。


    props.conf 规范具有 TRANSFORMS-<class> 设置。这里，<class> 是一个唯一的字面字符串。我们可以指定多个 transforms
    段并用逗号分隔它们，以便按相同顺序应用它们。


    我们将对以下各节中描述的其余用例使用前述 transforms.conf 和 props.conf 规范，这些用例涉及覆盖源类型、将数据重新路由到不同的索引、过滤不需要的事件并将它们发送到
    nullQueue。


