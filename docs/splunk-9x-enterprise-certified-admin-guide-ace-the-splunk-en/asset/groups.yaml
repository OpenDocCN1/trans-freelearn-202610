    \ type、Fields 和 Delimiter 区域显示各自的详细信息以便在点击 Finish 按钮前进行核实。最后，点击 Finish 按钮，这将保存提取并返回\
    \ Success! 屏幕。\n\n4. 让我们验证我们创建的字段是否已正确提取。执行 index=main sourcetype=callrecords\
    \ Splunk 搜索，你将被呈现事件。展开（>）其中一个并观察被提取的字段和值，如图 11.6 所示：\n\n# 图 11.16：查找定义 – 添加新\n\
    \n6. 图 11.16 显示 Destination app 为 search，为定义输入的名称为 phone_no_country_code_to_name，Type\
    \ 默认填充为 File-based，并且从 Lookup file 下拉菜单中，我选择了我们在步骤 3 中上传的查找表文件。最后，点击 Save 将带你到显示\
    \ Successfully saved 消息的页面：\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_221_0.png)\n\
    \n# 图 11.17：查找定义保存成功\n\n7. 图 11.17 显示在 search 应用中保存的定义（phone_no_country_code_to_name），并且\
    \ Sharing 设置为 Private，Permissions 选项可与其它用户共享。\n\n就这样，我们已成功在 Splunk 中创建了一个查找。要验证我们迄今为止完成的工作，请在\
    \ search 应用下打开一个搜索窗口并执行 | inputlookup phone_no_country_code_to_name 查询。如图 11.18\
    \ 所示，你将被呈现 country_code 和 country_name 的表格格式：\n\nFigure 11.18: Lookup verification\n\
    \n在下一节中，我们将学习关于 KV Store 查找的内容。\n\n# KV Store 查找\n\nKV Store 查找需要在创建查找定义之前预先创建集合。Splunk\
    \ Web 不提供通过 UI 创建集合的功能。相反，一个 Splunk 支持的应用 – Splunk App for Lookup file editing（又名\
    \ Lookup Editor）– 在 splunkbase.com 有助于创建它。\n\n按照 https://splunkbase.splunk.com/app/1724\
    \ 上的应用安装步骤并在你的 Splunk 实例中安装它。该应用为 KV Store 查找的创建执行以下高层步骤：\n\n- 创建一个集合（`collections.conf`）\n\
    - 创建一个查找定义\n\n我们使用与上一节中创建的相同的 `country_code`、`country_name` 查找也用于 KV Store：\n\n\
    - 1. 安装后，从 Apps 菜单启动 Splunk App for Lookup File Editing。在右上角，点击 Create a New Lookup\
    \ | KV Store Lookup。图 11.19 显示了选项。它将打开一个创建新查找的页面：\n\n```\ninputlookup phone_no_country_code_to_name\n\
    ```\n\n| country_code | country_name |\n|---|---|\n| +61 | Australia |\n| +91\
    \ | India |\n| +1 | USA |\n| +47 | Norway |\n| +358 | Finland |\n| +33 | France\
    \ |\n| +44 | UK |\n\n# 图 11.21：查找集合 – 已创建\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_224_0.png)\n\
    \n4. 要从搜索访问集合，需要创建 transforms 段。为此，点击图 11.22 左上角的 Lookups 菜单项：\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_224_1.png)\n\
    \n# 图 11.22：查找 – 创建转换\n\n5. 如图 11.22 所示，搜索我们在之前步骤中创建的 kv_country_code_to_name\
    \ 查找并点击 Open in Search 链接。这将打开一个 Create Lookup Transform 弹出窗口。在 Transform name\
    \ 文本框中输入 kv_country_code_to_name 并点击 Create Transform 按钮。\n\n6. 现在，在 Search App\
    \ 下打开一个搜索栏并执行 | inputlookup append=t kv_country_code_to_name 查询。\n\n如图所示 Figure\
    \ 11.23，你将被呈现我们在步骤 3 中创建的结果：\n\n![](img/5319cbd6f078c6cda7fac6347f77a07d_224_2.png)\n\
    \n# 图 11.23：KV Store 查找 – 最终验证\n\n```\n| inputlookup append=t kv_country_code_to_name\n\
    ```\n\n并创建了 transforms 以在搜索中访问查找。我们了解到该应用可以比标准的 Splunk Web 方法更轻松地创建 CSV 和 KV Store\
    \ 查找。\n\n我想借此机会向你表达我衷心的感谢，感谢你陪我走过本书的篇章。探索 Splunk 的复杂性和其各种功能是一件愉快的事，我希望你能从这些章节中获得价值和见解。\n\
    \n当你继续你的 Splunk 之旅时，我祝你在追求 Splunk Certified Admin 考试的道路上一切顺利。记住要保持专注，彻底复习材料，并练习动手练习以加强你的技能。\n\
    \n记住学习是一个持续的过程，总有更多东西可供发现。我鼓励你继续探索并扩展你对 Splunk 的理解，利用其功能来解锁新的见解和解决方案。再次感谢你陪我走过这段旅程。愿你在\
    \ Splunk 领域的努力充满成功和有意义的发现。\n\n在下一章中，你将获得一份模拟考试，用于在实际考试格式的 56 道题中进行自我评估。我们还将在最后讨论答案以检查你的尝试并刷新你的理解。在下一节中，你已获得示例问题及其答案，以测试你对\
    \ Splunk 字段和查找的理解。\n\n# 自我评估\n\n与其它章节一样，本节是关于自我测试你迄今为止学到的主题知识。你有 10 道题，答案在问题之后给出。如每次重申的那样，如果你难以回答问题，请随时再次复习相应章节。让我们开始：\n\
    \n- 1. 字段名称是否区分大小写？\n  A. 是\n  B. 否\n\n- 2. Splunk 在搜索时是否自动从键值格式中提取字段/值？\n  A.\
    \ 是\n  B. 否\n\n- 3. 选择 Splunk 中可用的查找文件类型（全部选择）：\n  A. JSON 查找\n  B. CSV 查找\n \
    \ C. KV Store 查找\n  D. 地理空间查找\n\n4. 关于 CSV 查找，哪些陈述是正确的？全部选择：\nA. CSV 查找将信息存储在\
    \ MongoDB 中\nB. CSV 查找文件具有 .csv 扩展名\nC. CSV 查找文件用于通过与 Splunk 中现有事件关联来丰富信息。\nD.\
    \ CSV 查找包含带标题的逗号分隔值信息\n\n5. Splunk Web 中用于搜索时字段提取创建的两种方法是什么？\nA. 正则表达式\nB. KV\
    \ 对提取\nC. 分隔符提取\nD. JSON 默认提取\n\n6. Splunk Web 中的正则表达式方法是否自行生成正则表达式？\nA. 是\nB.\
    \ 否\n\n7. 索引时字段在 Splunk 索引中的存储是否永久？\nA. 是\nB. 否\n\n8. 识别 Splunk 在索引阶段提取并存储的默认字段（全部选择）：\n\
    A. source\nB. sourcetype\nC. host\nD. splunk_server\n\n9. 我们能否为结构化内容如 CSV 和 PSV\
    \ 类型在 UF 上设置 INDEXED_EXTRACTIONS？\nA. 否\nB. 是\n\n10. 创建自定义索引时字段提取是否占用索引器上的额外存储空间？\n\
    A. 否\nB. 是\n\n"
