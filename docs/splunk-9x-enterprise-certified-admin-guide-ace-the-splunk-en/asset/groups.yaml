    # The Splunk Enterprise Trial license


    The Trial license is enabled by default when you first install Splunk Enterprise.
    The Trial license has the following features:


    +   - It is valid only for 60 days. After this period, other license types must
    be selected to continue using the product.

    +   - It allows you to use the full features of Splunk Enterprise.

    +   - It works only for single/standalone Splunk Enterprise instances.

    +   - The license limits data ingestion to 500 MB per day. Beyond this, Splunk
    will raise a license warning. License violation is explained in detail in the
    *Understanding license warnings and violations* section.


    # The Splunk Free license


    The Free license is valid forever and supports only a subset of Splunk Enterprise
    features:


    +   - It disables alerting, authentication, clustering, distributed search, summaries,
    and forwarding to non-Splunk servers.

    +   - The daily data ingestion limit is 500 MB. License violations block the search
    functionality. More details are provided in the next section, *Understanding license
    warnings and violations*.

    +   - It works only for single/standalone Splunk instances.


    # The Forwarder license


    Splunk offers a variety of forwarders. The most popular ones are the **universal
    forwarder (UF)** and **heavy forwarder (HF)**. Let''s see how this license applies
    to the two main types of forwarders:


    +   - The UF is by default embedded with the license, so there is no need for
    explicit license installation/configuration.

    +   - The UF is separate binary software, and it consumes fewer resources than
    the HF. The UF is able to forward data to indexers with authentication.

    +   - The HF is a full Splunk Enterprise instance binary that requires either
    a Forwarder license or an Enterprise license.

    +   - The Forwarder license is by default embedded into the Splunk Enterprise
    package.

    +   - No indexing is allowed on HFs with the Forwarder license. However, authentication
    is allowed.

    +   - HFs that require indexing, advanced authentication, and the KV Store need
    the Enterprise license.'
