    \ perfectly suited to accessing logs’ structure. On the right-hand side, a list\
    \ of events is presented with their timestamps detected. To observe the source\
    \ type configuration settings, expand the Advanced section, which shows CHARSET,\
    \ TIME_PREFIX, LINE_BREAKER, and so on, and their corresponding values.\n\nClicking\
    \ the Next button will take you to Input Settings. This page is where you can\
    \ set the host and index metadata fields or leave them at their defaults. Proceed\
    \ and click the Review button to view a summary of the metadata fields’ information\
    \ (see Figure 8.6). If you are happy with the details, then click Submit; otherwise,\
    \ click Back and edit the necessary sections.\n\n*Figure 8.6: Add Data – Review\
    \ stage*\n\nIf everything has gone well, clicking the **Submit** button will index\
    \ the uploaded `web-access.log` file on your Splunk instance and you will be presented\
    \ with the **File has been uploaded successfully** message on the following page.\
    \ This page also offers a lot of other options, including **Start searching**,\
    \ **Extract Fields**, and **Add more data**. Clicking the **Start searching**\
    \ button will open the Search app and show the uploaded `web-access.log` file\
    \ events.\n\nLet’s conclude this chapter and review a summary of what we’ve learned\
    \ so far.\n\n## Summary\n\nThis first chapter of *Part 2* of the book aimed to\
    \ get you started with Splunk data administration. We began with the introduction\
    \ of data input types, including the file-based, network, agentless (HEC), and\
    \ script-based options. There is also a special type of input that can be installed\
