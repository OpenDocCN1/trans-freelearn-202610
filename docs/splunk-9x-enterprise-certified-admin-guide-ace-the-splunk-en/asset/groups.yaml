  mdcn: "\n\n## 自我评估模拟考试\n\n欢迎来到《Splunk Enterprise 认证管理指南》的模拟考试章节！恭喜你在这条通往 Splunk\
    \ Enterprise 认证管理员的路途上走到了这一里程碑。在本章中，我们将深入探讨一系列自我评估问答，旨在测试你的知识，并巩固全书所涉及的概念。\n\n\
    在继续之前，我想赞扬你在备考过程中所付出的努力和心血。你已经对 Splunk 平台、其管理功能及其强大特性有了全面的理解。这最后一章将为你提供一个评估学习进度、发现可能需要进一步学习或澄清的领域的机会。请记住——自我评估问题旨在挑战你对\
    \ Splunk Enterprise 管理概念的理解，因此请以开放的心态对待它们，并运用你在整个学习过程中积累的知识。慢慢来，仔细阅读问题，选择最恰当的答案。\n\
    \n完成自我评估问题后，你可以参照本章提供的答案来评估你的表现。检查任何错误答案并理解其背后的概念，对于进一步提升知识至关重要。请记住，本次自我评估并非为了模拟真实的认证考试。相反，它作为一种工具，用于衡量你的准备程度，并指出任何可能需要改进的地方。把它当作一个调整理解、巩固知识的机会。\n\
    \n原考试时长为 60 分钟、共 56 道题，要求你有效管理时间。考虑到你需要阅读和理解每道题的时间，为每道题分配大约 1 分钟是很重要的。\n\n以下是考试建议时间管理的分配：\n\
    \n- **阅读、理解并回答每道题：** 每题 1-1.5 分钟\n- **检查答案：** 考试结束前留出 3 分钟\n\n遵循这种时间管理策略，你可以确保有足够的时间阅读和理解每道题、提供准确答案，并在提交考试前检查你的回答。\n\
    \n对于本自我评估章节，你将一共获得 56 道题，与原始考试格式一致。这些题目经过精心设计，涵盖 Splunk Enterprise 管理的各个方面，确保对你的知识和技能进行全面评估。请记住——自信源于充分准备。因此，请把最后一章当作巩固专业知识、以确定性迎接认证考试的机会。祝你顺利成为一名合格的\
    \ Splunk Enterprise 管理员，让我们开始自我评估问题吧！\n\n## 模拟考试问题\n\n- 1. 在 Splunk 中，哪个配置文件负责指定要收集和索引的数据输入？\n\
    \  A. inputs.conf\n  B. props.conf\n  C. transforms.conf\n  D. indexes.conf\n\n\
    - 2. 你是一名系统管理员：如何控制对 Splunk 中特定索引和资源的访问？\n  A. 在 Splunk 服务器上配置防火墙规则。\n  B. 在将数据索引到\
    \ Splunk 之前对数据进行加密。\n  C. 设置身份验证机制，例如轻量级目录访问协议（LDAP）或安全断言标记语言（SAML）。\n  D. 遵循\
    \ Splunk 基于角色的访问控制（RBAC），并创建一个可以配置为允许访问特定索引和资源的角色。角色又可以分配给用户。\n\n- 3. 哪个 Splunk\
