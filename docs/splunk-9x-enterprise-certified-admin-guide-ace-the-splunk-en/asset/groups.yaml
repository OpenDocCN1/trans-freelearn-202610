    ## Splunk Configuration Files


    Configuration files are an integral part of Splunk Enterprise. Any configuration
    change that you do via Splunk Web, the CLI, or a RESTful interface will get updated
    to a conf file directly behind the scenes. Henceforth, whenever encountering terms
    such as “.conf,” “conf,” “config,” or “configuration file,” they should all be
    understood to refer to the same concept. There are many such conf files that exist
    to fulfill a specific purpose. In this chapter, you will find examples of the
    usage of commonly used files across Splunk components, such as the search head,
    indexer, and forwarder. These files can be stored in multiple places, such as
    in user, system, and app directories. You will learn how these files get merged
    in memory for processing. As you get familiar with the directory structure where
    the .conf files can be stored, you’ll come to understand their precedence, the
    order in which they get processed, and find them using the btool command.


    You will learn that .conf files are highly important to both Splunk system administrators
    and data administrators. System admins often need to tune or re-configure system-level
    settings, and data admins do ingestion, search-time, index-time knowledge object
    creation, and troubleshooting of data indexing. Knowing how the conf files work
    together and seeing the merged conf files through btool and a RESTful interface
    is necessary for everyone to receive more insights into Splunk.


    In this chapter, we will cover the following topics:

    - Understanding conf files

    - Understanding conf file precedence

    - Troubleshooting conf files


    ## Understanding conf files


    .conf files in Splunk Enterprise are configuration files that serve specific functions
    during the runtime of data forwarding, parsing, indexing, and searching. These
    files contain important settings and can be modified through the filesystem, either
    directly or indirectly via Splunk Web, the CLI, or a REST API.


    Let’s explore key information about .conf files.


    ## File format and access


    To modify or create new .conf files, you need access to the Splunk component filesystem.
    This typically requires appropriate permissions or administrative privileges on
    the machine where Splunk is installed. By accessing the filesystem, you can edit
    the .conf files using a text editor or other tools.


    ## Structure and syntax


    The .conf files use the <key/attribute> = <value> format to define settings. Each
    key has its own significance, and keys are case-sensitive. Settings are organized
    into unique [<stanza>] sections. It''s important to follow the defined specification
    for each .conf file, which can be found in Splunk''s online documentation or the
    installation directory under $SPLUNK_HOME/etc/system/README with a .spec extension.


    For example, in the props.conf file, KV_MODE is the correct attribute, and kv_mode
    is treated as a different and incorrect attribute. Make sure to use the correct
    casing when defining attributes in .conf files by following the specification
    of the respective conf file. The following is an example structure of a props.conf
    file containing the [default] stanza and other customized stanzas:


    ```

    # This is a comment in .conf files

    # Global settings applied to all stanzas in props.conf

    [default]

    TIME_FORMAT = %Y-%m-%d %H:%M:%S

    TRUNCATE = 20000

    CHARSET = UTF-8


    # Specific settings for a sourcetype

    [access_logs]

    EXTRACT-field_name = "^\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\]"


    # Settings for a host

    [host::server1]

    TRANSFORMS-sethost = sethost_server1

    LINE_BREAKER = ([\r\n]+)(\d{4}-\d{2}-\d{2})

    EXTRACT-myfield1 = myregex1

    EXTRACT-myfield2 = myregex2

    ```


    Here are some notes on this example:

    - Comments can be added using the # symbol at the beginning of a line

    - The [default] stanza sets global settings that apply to all source types unless
    overridden

    - The [access_logs] stanza defines specific settings for the access_logs source
    type

    - The [host::server1] stanza specifies settings for a particular host named server1


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_111_0.png)


    Figure 6.1: The directory structure and location of conf files


    Figure 6.1 shows conf files in the SPLUNK_HOME etc\users\<user_name>\<app_name>,
    etc\apps\<app_name>\, and etc\system directories. The subdirectories inside of
    them, \default and \local, are the typical locations for .conf files:

    - <user_name> in the figure shows the built-in admin and splunk-system-user users

    - <app_name> in the figure shows the out-of-the-box search app and its subdirectory
    structure


    Splunk suggests not altering the conf files in the etc\system\default directory.
    Instead, create an etc\system\local\ directory and place customized configs in
    there.


    ## Points to remember


    Splunk defines multiple configuration files, which are accompanied by their corresponding
    specifications with the .spec extension. These resources can be found within the
    $SPLUNK_HOME/etc/system/README directory, along with illustrative examples.


    Each and every conf file has a basic structure, having [<stanza>] and settings
    underneath as <key> = <value> pairs. Keys are case-sensitive.


    Splunk ships with default conf files under the $SPLUNK_HOME/etc/system/default
    directory, and it is not recommended to edit the files inside of this directory.
    Hence, a /local directory is preferred to override the settings.


    The precedence of .conf files in different directories determines which settings
    take priority. Let’s explore the order in which these configuration files are
    considered.


    ## Understanding conf file precedence


    $SPLUNK_HOME/etc is the parent directory where all conf files exist in a typical
    Splunk Enterprise installation. A configuration file can be created in more than
    one place under this parent directory. You might be wondering why there is a need
    to have the same type of file in multiple places.


    The ability to configure settings at various levels within Splunk provides flexibility
    to administrators, developers, and users to customize the platform according to
    their specific needs. This flexibility allows for precise control over individual
    apps and user experiences. The precedence of files that have the same stanza names
    in multiple directories is determined by Splunk. Precedence is covered later in
    this section.


    By default, Splunk Enterprise ships all the system-wide configurations under the
    $SPLUNK_HOME/etc/system/default directory, which is not supposed to be altered.
    So, it is suggested that if a change to a conf file under the /default directory
    is required, create it under the $SPLUNK_HOME/etc/system/local directory, which
    takes precedence over the /default directory. Similarly, conf files could be present
    under the following directories:

    - $SPLUNK_HOME/etc/users: This directory contains private, user-specific changes
    that are owned by each individual user. This ownership ensures that user-specific
    changes are isolated and not shared with other users by default.

    - $SPLUNK_HOME/etc/apps/<app_name>/[default|local]: Configurations created within
    an app’s <app_name> directory are stored here. These configurations are available
    to any user who has access to the app. By assigning specific roles to users, you
    can control their access to apps, including the ability to view and modify the
    configurations within the <app_name> directory.

    - $SPLUNK_HOME/etc/system/local: The configurations stored in this Splunk directory
    are considered global configurations. These configurations are accessible to every
    user in the Splunk instance.


    At this stage, you are aware of the list of configuration file directories. Let’s
    understand how Splunk decides the precedence of the same conf files in different
    directories (refer to Figure 6.1). The precedence is decided based on the conf
    type input, props, indexes, and so on, and their context.


    The context in which a configuration setting is used can also affect the order
    of precedence. For example, some configuration settings may only apply to a specific
    app or data source, while others may apply globally to the entire Splunk environment.
    The two types of context are as follows:

    - **Global**: Configuration files that are independent of user and app contexts
    include settings related to indexing, monitoring, deployment, server configurations,
    and so on. These configurations are independent of user and app context and apply
    globally to all users in the Splunk instance.

    '
