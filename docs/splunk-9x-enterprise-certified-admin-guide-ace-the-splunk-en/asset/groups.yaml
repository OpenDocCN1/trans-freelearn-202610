  mdcn: "\n55. 作为数据摄入的一部分，通过在转发器上设置 INDEXED_EXTRACTIONS，哪个阶段会被跳过执行？\n\n+   A. 输入\n\
    +   B. 解析\n+   C. 索引\n+   D. 摄入\n\n56. 为什么持久队列在 Splunk 中很有用？\n\n+   A. 它有助于减少\
    \ Splunk 中的总体存储需求\n+   B. 它能够为关键事件启用实时告警和通知\n+   C. 它防止高容量数据摄入期间的数据丢失\n+   D.\
    \ 它提高了历史数据分析的查询性能\n\n你已经完成了模拟考试题部分的全部内容。让我们回顾一下答案。\n\n## 回顾答案\n\n+   1. 选项 A 是正确答案。inputs.conf\
    \ 文件通常包含用于摄入的数据输入。props.conf 和 transforms.conf 包含解析阶段配置和字段提取，而 indexes.conf 配置\
    \ Splunk 索引。我们在第 6 章“Splunk 配置文件”中简要介绍了这些文件。\n+   2. 选项 D 是正确答案。选项 C 涉及向 Splunk\
    \ 进行用户认证所需的认证方法。请参阅第 3 章“Splunk 中的用户、角色和认证”中的“角色和认证方法”部分。\n+   3. 选项 A 是正确答案。部署服务器（DS）为连接到它的转发器存储应用程序。通过使用\
