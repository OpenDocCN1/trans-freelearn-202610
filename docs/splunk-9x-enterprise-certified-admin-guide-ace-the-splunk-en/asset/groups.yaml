    9. Which statement is true about volumes in indexes.conf? (Choose all that apply)


    +   A. Volumes are directories on a filesystem.

    +   B. Volumes are complex to manage and hence require Splunk support assistance.

    +   C. Volumes are useful for managing storage effectively.

    +   D. Volumes are configured using stanzas with the prefix volume :.


    10. Can you locate the directory to be backed up regularly?


    +   A. $SPLUNK_HOME/var/etc

    +   B. $SPLUNK_DB/etc

    +   C. $SPLUNK_HOME/etc

    +   D. $SPLUNK_DB/var/lib/splunk/fishbucket


    I hope you were able to recollect the topics! Let''s look at the answers in the
    next section.


    # Reviewing answers


    +   1. True, indexes are repositories of data and they do have names.

    +   2. Option A, C, and E are the correct answers. Indexer data is by default
    stored in the $SPLUNK_DB location. Indexed data can be deleted through the delete
    and clean commands.

    +   3. No, metrics indexes store only metrics data in text form.

    +   4. Option B, C, D, and E are the correct answers.

    +   5. Option B is correct. maxDataSize = auto sets the hot bucket size to 750
    MB. The other option you can set is maxDataSize = <integer> | auto | auto_high_volume.
    Just specify the integer (maxDataSize = 1000) or auto_high_volume sets the bucket
    size to 10 GB, which is preferred for high-volume indexes with a daily data volume
    over 10 GB.

    +   6. Option D is the correct answer. The data rolls over from hot to warm to
    cold to frozen (optional). Thawed buckets are for restoring frozen data.

    +   7. All options are correct.

    +   8. Option C is correct. For example, index=web-logs | delete applies delete
    markers to the data that has matched search conditions and it doesn''t delete
    the index data permanently from the disk.

    +   9. Option A, C, and D are the correct answers.

    +   10. Option C is the correct answer. The $SPLUNK_HOME/etc directory contains
    critical information about users, apps, and other system configuration details.'
  md: "\n- `maxTotalDataSizeMB` is the total index size limit. If you look at the\
    \ example index, `windows-event-logs`, we have set this value to 500 MB.\n- Global\
    \ settings are applied to every index specified in `indexes.conf`. For a complete\
    \ list, refer to the `indexes.conf.spec` file in the Splunk docs. At the global\
    \ level, the `lastChanceIndex` option can be configured. This acts as a final\
    \ option for any external inputs that don't indicate a valid index. If this value\
    \ is left empty, Splunk will simply discard these events.\n\nWhat if the data\
    \ moved to cold buckets is not being searched very frequently, so the allocation\
    \ of expensive hardware storage similar to hot/warm buckets isn't cost-effective?\
    \ Splunk suggests using low-latency high-throughput storage for hot/warm buckets\
    \ as they hold recent data that is searched quite often. Cold buckets can reside\
    \ on standard latency storage, which is slow and cheap. To achieve this, an index\
    \ can be configured using volumes. Let's look at volumes in the next section.\n\
    \n## Index volumes\n\nVolumes are specific directories on a filesystem that are\
    \ allocated for indexes in order to manage storage space effectively. Let's take\
    \ a look at the volume configuration in a UNIX-based OS for the `windows-event-logs`\
    \ index that we created on Splunk Web in the previous section:\n\n```\n[volume:hot_storage]\n\
