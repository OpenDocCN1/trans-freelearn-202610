    \ 如果在索引器集群上设置了复制因子（RF）为 4，那么集群中至少需要多少个索引器实例？\nA. 三个\nB. 两个\nC. 四个\nD. 八个\n\n39.\
    \ 你能说出在搜索头（SH）上包含分布式搜索设置的两个配置文件的名称吗？\n\n- A. outputs.conf\n- B. server.conf\n\
    - C. serverclass.conf\n- D. distsearch.conf\n\n40. 在搜索头（SH）上，知识包复制的默认 replicationPolicy\
