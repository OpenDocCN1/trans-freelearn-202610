  - '[PAGE 164]


    In the event of network issues or the indexer being unavailable, we can prevent
    data loss by setting `queueSize` and `persistentQueueSize`. The `queueSize` setting
    refers to the in-memory queue that holds the data until the output queue on the
    forwarder is free. The `persistentQueueSize` setting enables the storage of data
    on disk when the in-memory queue is full. `persistentQueueSize` must be greater
    than `queueSize`. Data is written to the `$SPLUNK_HOME/var/run/splunk/` directory
    on the forwarder.


    The UDP input specification is the same as for TCP, except that it listens on
    the UDP port – the rest of the settings and syntax remain the same. An example
    `inputs.conf` configuration for UDP is as follows:


    ```

    # inputs.conf listening on UDP port 514

    [udp://514]

    connection_host = ip

    acceptFrom = 192.0.2.10, !external.example.host.com

    index = main

    sourcetype = access_common

    queueSize = 1MB

    persistentQueueSize = 100MB

    ```


    Network inputs might have restrictions on *nix and Windows-based hosts, as they
    require access to certain ports to listen on TCP/UDP. Try it yourself by configuring
    these inputs on your UF/Splunk Enterprise instance and checking the ports'' listening
    status (use the `netstat` command on Linux and Windows-based hosts).


    We have reached the end of the network inputs section. In the next section, we
    will go through the configuration of scripted inputs.


    # Discussing scripted inputs


    Scripted inputs are useful for indexing transient/temporary data that cannot be
    monitored through file/directory monitoring or use network inputs. Scripted inputs
    collect data from transient sources and then either write the collected data to
    a file or forward it directly to an indexer. Let''s go through some facts about
    this input type:


    +   - Scripted inputs require a UF agent or Splunk Enterprise instance (HF) to
    execute the scripts.

    +   - Data can be gathered from transient sources, such as operating system commands.
    The `top`, `vmstat`, `netstat`, and `iostat` commands all leverage this type of
    input, which is configured within the Splunk add-on for Unix and Linux available
    to download from http://splunkbase.splunk.com. The Windows **technology add-on
    (TA)** relies on this input type to gather Windows **Active Directory (AD)** logs,
    registry logs, WinEventLogs, and so on. Logs from remote APIs can also be pulled
    using scripts.

    +   - Popular script types are supported, including `.py` (Python), `.sh` (shell),
    `.ps1` (PowerShell), and `.bat` (Windows batch).'
  - '[PAGE 165]


    +   - Scripted inputs must be scheduled to run at certain intervals. How often
    a script should run is set by specifying the interval as a number of seconds or
    by setting a cron expression.

    +   - Splunk Enterprise and the UF log script execute messages in a local splunkd.log
    file. You can get access to these logs in the _internal index.

    +   - Scripted inputs are configurable through Splunk Web under the Settings |
    Data Inputs | Scripts menu. Another option is to create them in the inputs.conf
    file, optionally package them into an app, and use a deployment server to deploy
    them to forwarders. Refer to Chapter 4, Splunk Forwarder Management.


    Consider the following scripted input specification:


    ```

    # inputs.conf scripted input settings

    [script://<script path or cmd>]

    source = <source to set>

    sourcetype = <sourcetype to set>

    index = <index name to forward logs>

    interval = <in seconds. default 60 sec or cron expression. Set -1 to run once,
    0 to continuously>

    passAuth = <username to run the script as the OS user>

    queueSize = <in-memory queue size>

    persistentQueueSize = <queue to store on disk when in-memory is full>

    ```


    The preceding specification has the stanza name prefixed with script://, followed
    by the usual common metadata fields of source, sourcetype, and index, and the
    queue settings. The settings specific to scripted input are interval and the authentication
    information.


    The interval setting schedules the script to run every x number of seconds. If
    nothing is specified here, the script will be scheduled to run every minute by
    default. Alternatively, we could specify a cron expression.


