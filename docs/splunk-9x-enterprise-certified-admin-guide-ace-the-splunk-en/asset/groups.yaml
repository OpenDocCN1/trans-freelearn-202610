    In the next section, we will learn about Splunk Enterprise components.


    ## Understanding Splunk components


    Splunk Enterprise has multiple integral components that work together and are
    primarily divided based on their functions. The list is very comprehensive. A
    standalone Splunk deployment doesn’t require all the components; however, a distributed
    and highly available deployment requires almost all of them.


    A detailed understanding of standalone versus distributed deployment is covered
    in the following section of this chapter, *Splunk Validated Architectures (SVAs)*.
    By the end of this section, you will be familiar with two types of Splunk components—namely,
    processing components and management components.


    ## Processing components


    The following are processing components:


    - Forwarder

    - SH

    - Indexer


    Let’s understand the roles of these components in detail and their association
    with management components.


    ### Forwarder


    As the name suggests, this primarily forwards data from the source to the target
    indexer. There are two types of forwarders:


    - **Universal Forwarder (UF)**

    - **Heavy Forwarder (HF)**


    UF is a software agent typically installed on the source system where data is
    being generated. It consists of an input configuration (that is, an `inputs.conf`
    file) with a list of absolute file paths along with metadata fields such as index
    and sourcetype. UF is the preferred approach to monitoring and forwarding file
    contents to designated indexers. By default, UF makes use of the fishbucket process
    to forward data for indexing exactly once and avoids data duplication through
    **cyclic redundancy checks (CRCs)** and seek pointers. You will find further information
    about the additional supported data inputs and detailed explanations about the
    fishbucket concept in *Chapter 9, Configuring Splunk Data Inputs.*


    The following diagram illustrates UF installed on a web server configured to monitor
    the web server logs and forward them continuously to the indexer as and when the
    logs get updated:


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_28_0.png)


    Figure 1.1: UF forwarding web server logs to indexer


    Let us now look at SH, which is a critical user-facing processing component in
    a distributed deployment.


    HF is a Splunk Enterprise instance and doesn''t require separate binary for installation.
    It provides an extended feature set compared to a UF. It not only collects and
    forwards data, but also includes a Splunk user interface for configuration and
    management. To operate an HF, a forwarder license is required. Typically, an HF
    is configured in forwarding mode by disabling local data storage. Splunk Add-ons
    available on Splunkbase can be installed on an HF to facilitate data collection
    from various sources. This combination of features makes HFs a versatile choice
    for preprocessing and forwarding data while benefiting from a user-friendly interface.


    ### SH


    The SH component is a Splunk Enterprise instance that is dedicated to search management
    and provides a number of interfaces for users to interact with. The popular interfaces
    it offers to users are web, CLI, and RESTful API.


    Multiple SHs can be grouped together and form a cluster called a SH cluster (SHC).
    Members of an SHC share the same baseline configuration, and jobs are allocated
    to available members by the SH captain.


    In a standalone deployment, a single Splunk Enterprise instance (that is, the
    same instance) works as both the SH and indexer. In a distributed deployment model,
    the SH or SHC can submit searches to multiple indexers and consolidate the results
    returned. The results are stored locally in a dispatch directory located in $SPLUNK_HOME/var/run/splunk/dispatch
    for later retrieval, and the results will be deleted after the job expires. $SPLUNK_HOME
    refers to the installation directory where the Splunk software is installed. For
    example, ad hoc search results (that is, the search job outcome) are retained
    for 10 minutes in the dispatch directory, which will be removed after the job
    expires by a process called the dispatch reaper, which runs every 30 seconds.


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_30_0.png)


    Figure 1.3: Indexers receiving data from forwarders and storing it in indexes


    So far, we have gone through the processing components and their roles in a Splunk
    Enterprise deployment. Let us go through the management components in the following
    section.


    ## Management components


    These are management components that support the processing components:


    - Deployment Server (DS)

    - SHC Deployer (SHC-D)

    - Indexer CM

    - License Manager (LM)

    - MC


    We’ll discuss them in the following subsections.


    ### DS


    A standalone Splunk Enterprise instance is used to manage the forwarders. The
    forwarders, which are located at the data source (typically a UF), often need
    new configurations to monitor new files or changes to an existing configuration
    followed by an optional restart. Changing them manually is a very time-consuming
    task in larger infrastructures. That’s where the DS comes to the rescue, by maintaining
    a central repository of configurations in the form of apps. In addition to UFs,
    HFs can also be centrally managed using a DS.


    ## Distributed non-clustered deployment


    Distributed non-clustered deployment works better for additional workload and
    indexing capacity than a single-server deployment. The separation of SH and indexing
    duties increases the total cost of ownership (TCO).


    The following diagram shows the non-clustered deployment architecture with separate
    SH and indexing tiers:


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_34_0.png)


    Figure 1.5: Distributed non-clustered architecture


    In the depicted architecture, a separate search tier comprises a SHC and an indexing
    tier with multiple standalone indexers. The SHC-D is a mandatory management component
    responsible for deploying configurations to the SHC using apps. It facilitates
    the deployment process by pushing configuration updates via apps from the SHC-D
    to the SHC. A DS is utilized for managing forwarders, while an LM stores license
    information. The DS ensures effective forwarder management, while the LM serves
    as a central repository for license details, with all other instances connecting
    to it for license information. Let’s look at the advantages of this deployment
    over single-server deployment:


    - The number of users would be higher than in a single-server deployment with
    additional indexer support

    - Independent indexers increase the daily indexing capacity to over 300 GB


    Now, let’s look at the limitations of this deployment:


    - No HA and DR

    - The SH needs to be reconfigured every time a new search peer/indexer is added

    - Search results might be incomplete when one of the indexers is down, and data
    ingestion might be impacted as well

    - In the case of a standalone single-SH deployment scenario, there is a **single
    point of failure (SPOF)**


    Let’s take a look at distributed cluster deployment, which is a more advanced
    setup than a distributed non-cluster deployment.


    ## Distributed cluster deployment and SHC – single-site


    A distributed clustered SH and indexer deployment at a single site is a highly
    available, resilient architecture. A site is a classic data center in a particular
    region/geography.


    The following diagram shows the clustered deployment architecture with a separate
    SHC and clustered indexing tier running on a single site:


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_35_0.png)


    Figure 1.6: Distributed clustered deployment and SHC – single-site


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_37_0.png)


    Figure 1.7: Distributed clustered deployment and SHC – multi-site


    As in Figure 1.6, the components remain the same in each site. However, the collection
    tier is common across both sites. Each site has a dedicated SHC.


    Let’s understand the limitations:


    - Indexer clusters replicate data between sites, which is called cross-site replication,
    requiring lower network latency. 100 milliseconds or less is preferred.

    - SHCs work independently and do not share artifacts and common configurations.

    - SHCs have a 100-node limitation per site.

    - A dedicated SHC-D is required for each site.

    - A single CM node suffices for an entire cluster of indexers across sites.


    We’ve looked at a very basic single-server architecture (preferably used for testing
    or development) and an advanced multi-site cluster deployment architecture. Each
    has its advantages, limitations, and cost implications. At this stage, you are
    pretty much familiar with Splunk components and architectures. In the next section,
    we are going to install a standalone/single-server deployment, which we talked
    about at the very beginning of this section.

