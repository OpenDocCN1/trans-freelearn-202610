  mdcn: "\n\n- `maxTotalDataSizeMB` 是总索引大小限制。如果查看示例索引 `windows-event-logs`，我们已将此值设置为\
    \ 500 MB。\n- 全局设置适用于 `indexes.conf` 中指定的每个索引。完整列表请参考 Splunk 文档中的 `indexes.conf.spec`\
    \ 文件。在全局级别，可以配置 `lastChanceIndex` 选项。它作为任何未指明有效索引的外部输入的最终选项。如果此值留空，Splunk 将简单地丢弃这些事件。\n\
    \n如果移动到冷存储桶的数据搜索频率不高，因此分配与热/温存储桶类似的昂贵硬件存储就不具成本效益怎么办？Splunk 建议对热/温存储桶使用低延迟高吞吐量的存储，因为它们保存的是经常被搜索的最新数据。冷存储桶可以驻留在标准延迟存储上，该存储速度慢且便宜。为实现此目的，可以使用卷来配置索引。让我们在下一节中查看卷。\n\
    \n## 索引卷\n\n卷是文件系统上的特定目录，分配给索引以有效管理存储空间。让我们看一下在 UNIX 基于的操作系统上为我们在上一节中通过 Splunk\
