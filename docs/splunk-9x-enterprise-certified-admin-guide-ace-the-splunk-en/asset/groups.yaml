    # 3


    # Users, Roles, and

    Authentication in Splunk


    Splunk Enterprise follows the **role-based access control (RBAC)** approach, which
    allows users to access Splunk instances but restricts what users see and which
    actions they can perform. As a Splunk system administrator, it’s important to
    familiarize yourself with Splunk’s default user roles as well as to learn how
    to create custom roles to meet your organization’s specific requirements. You
    may also be tested on your understanding of role inheritance, which allows you
    to assign multiple roles to a user, and how to manage index access for users.
    It’s important to show that you can set up authentication in Splunk using methods
    like LDAP, SAML, and more. These skills are tested in the Splunk Enterprise Admin
    certification exam, as they are crucial for effectively managing user permissions
    and access in a Splunk environment.


    The following are the key components involved in taking the RBAC approach, which
    we will discuss throughout this chapter, along with how to configure them through
    Splunk Web and the Splunk CLI:


    +   - Users

    +   - Roles

    +   - Authentication methods


    # Users


    A Splunk Enterprise instance, as discussed in previous chapters, offers a variety
    of interfaces—namely, Splunk Web, the Splunk CLI, and RESTful APIs. All the interfaces
    must be secured by allowing users to log in securely through authentication and
    authorization. The authentication methods are explained at the very end of the
    chapter. Organizations can effectively manage user authorization by configuring
    roles, capabilities, object-level permissions, and **Role-Based Access Control
    (RBAC)** to align with individual users’ job responsibilities. Users are then
    able to perform administrative tasks (privileged users) or general user tasks
    (the creation of reports, alerts, dashboards, and so on) depending on'
  - '[PAGE 64]


    the Splunk role assigned to them. A user must be assigned at least one role in
    Splunk. The following screenshot shows user management menu items on the Splunk
    Web home page, under Settings:


    # USERS AND AUTHENTICATION


    +   - Roles

    +   - Users

    +   - Tokens

    +   - Password Management

    +   - Authentication Methods


    Figure 3.1: Splunk users and authentication management


    The following page is shown upon clicking the Users menu item from Figure 3.1.
    The Users page contains a list of existing users’ full details with an Edit action
    and a New User button to create users:


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_64_0.png)


    Figure 3.2: Splunk user management page


    For example, the administrator will create new users and allow them to search
    a particular index by assigning a role. The user created by the administrator
    will be able to log in and run a search against the allowed index.


    Users are entities who perform required actions on the Splunk platform in a secure
    way. Without any users, a Splunk instance is just orphaned and isn’t used for
    its purpose. For the same reason, you will be prompted to create an administrator
    user account after the installation the first time you boot a Splunk instance.


    Let’s add a new user through Splunk Web and find out which details are required
    in the following section.


    # Creating a new user


    A new user can be created either through Splunk Web or the Splunk CLI. They both
    require administrator account details to authenticate a Splunk instance. System
    administrators should be aware of at least these details to complete the user
    creation process: the user’s full name and the roles they can be assigned or the
    capabilities they need to have on the Splunk platform.'
