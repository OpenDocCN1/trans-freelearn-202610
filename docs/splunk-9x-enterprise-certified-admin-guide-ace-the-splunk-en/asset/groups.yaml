    the indexers and consolidates the results received from them. It then presents
    the aggregated results to the user.


    On the other hand, the indexer is responsible for data indexing. It receives search
    requests from the search head and processes them by searching through the indexed
    data. The indexer returns the relevant results (based on the user’s search query)
    back to the search head, which then consolidates and presents them to the user.


    The **distributed search** feature in Splunk enables scalability and performance
    optimization by distributing the search workload across multiple indexers. This
    enables parallel processing of search queries, leading to faster search results
    and better resource utilization.


    Let’s explore some key facts about distributed search in Splunk in standalone,
    non-clustered, and clustered Splunk deployments:


    - A standalone Splunk deployment does not use distributed search. In a standalone
    deployment, the entire search and indexing functionality is performed by a single
    instance of Splunk.

    - To use the distributed search feature, Splunk instances (search head and indexer)
    do not need to be in a cluster. In other words, clustering is optional. A simple
    deployment with a single indexer and search head could be connected to use this
    feature. Refer to Figure 7.1.

    - Distributed search comes into play when you have a small- to large-scale Splunk
    deployment with high data volumes and search requirements. It allows you to distribute
    the search workload across multiple Splunk instances, which may or may not be
    in a cluster.

    - In a clustered environment, distributed search can be used in conjunction with
    clustering to enhance search capabilities. Each indexer in the cluster can participate
    in a distributed search, allowing search queries to be distributed across the
    indexers within the cluster.


    For example, the following are some of the distributed deployment types that use
    the distributed search feature:


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_124_0.png)


    Figure 7.1: Distributed deployment types that use the distributed search feature


    For more information, look at the following search head cluster architecture:


    ![](img/5319cbd6f078c6cda7fac6347f77a07d_126_0.png)


    Figure 7.2: Search head cluster architecture


    In Figure 7.2, there is a cluster consisting of three search head instances. These
    instances are fronted by a load balancer, which evenly distributes the load between
    the search head members in the cluster. Among the search head instances, one of
    them is elected to perform the role of the search head captain, which is responsible
    for coordinating various tasks within the cluster.


    The search head captain instance handles tasks such as job scheduling, configuration
    replication, artifact replication, alert tracking, and knowledge bundle replication
    across the search head members. However, the captaincy role is not fixed to a
    specific instance. Instead, an ongoing election process occurs among the search
    head members to determine the winning member that will take over the captaincy
    role. This ensures that the responsibilities are dynamically assigned and can
    be redistributed as needed.


    If it is necessary to manually transfer the captaincy from one instance to another,
    it is possible to initiate the transfer through a CLI command. This allows flexibility
    and control over the captaincy assignment within the cluster.


    In addition to the cluster of search head instances and the captaincy functionality,
    the provided setup includes a separate instance called the **search head deployer**.
    The search head deployer serves as a centralized hub for deployment apps that
    are pushed out to the search head cluster when needed by administrators.


    The search head deployer instance contains the deployment apps, which are configurations,
    settings, and customizations that need to be distributed across the search head
    cluster. These apps may include saved searches, dashboards, reports, field extractions,
    and other objects that enhance the functionality and customization of the search
    head instances.


    Administrators can make changes to the deployment apps on the search head deployer
    and then push those changes to the search head cluster. This centralized approach
    simplifies the management and distribution of configurations across multiple search
    head instances, ensuring consistency in deploying and maintaining apps.


    ## Indexer clustering


    An indexer cluster contains a group of Splunk Enterprise instances that are configured
    to work as indexers (search peers) and they all share the same index configurations
    and apps. A separate instance is required to manage the indexer cluster activities;
    that is called a **cluster manager**.


    An indexer cluster is required to meet the demands of high availability, fault
    tolerance, and scalability when dealing with substantial data volumes and concurrent
    search queries. By utilizing an indexer cluster, organizations can guarantee uninterrupted
    data access, mitigate the effects of indexer failure, and achieve optimized data
    indexing and search performance.


    Indexer clusters provide several key benefits:


    - **Data availability**: By distributing and replicating data across multiple
    indexers, an indexer cluster ensures that data remains accessible even if one
    indexer goes down or becomes unavailable.

    - **Data recovery**: In the event of an indexer failure, the cluster retains copies
    of indexed data on other indexers. This redundancy enables automatic retrieval
    of the relevant data from the remaining indexers when a search request is issued.

    - **Data fidelity**: Indexer clusters maintain data fidelity by replicating and
    distributing data across multiple indexers. This replication strategy safeguards
    data integrity and consistency, reducing the risk of data loss and ensuring that
    indexed data remains accurate and reliable.


    Let’s understand how searching works in the context of indexers. When a search
    query is issued by a user, the search head distributes the query to the indexers
    in the cluster. Each indexer performs a local search on its searchable copy of
    the data that resides locally in its storage. The search head then aggregates
    and merges the results from all indexers to generate the final search result set.


    ### Tip


    Splunk recommends disabling web servers on indexers if there is no requirement
    to use the Splunk Web user interface. To disable web servers, issue the ./splunk
    disable webserver CLI command on indexers.


    ## Configuring distributed search


    The distributed search feature requires configuration to establish connectivity
    from the search head to indexers or search peers. From a standalone search head
    and indexer architecture to a large-scale multisite clustering setup, all implementations
    make use of the distributed search feature. Refer to the deployment type in Figure
    7.2, which has three search heads in a cluster, enabling distributed search to
    interact with three independent indexers. Indexers receive data from various sources,
    such as universal forwarders, syslog inputs, and technology add-ons for indexing.
    Here are a few essential points to understand about distributed search:


    - Search heads are preconfigured to send queries to search peers upon user request.

    - Search heads consolidate the results received from peers that participate in
    the search.

    - Search heads present the results to the user.

    - A continuous background process called knowledge bundle replication runs (you''ll
    learn about this later in this chapter) on the search head captain, which keeps
    sharing the information with search peers. In a non-cluster search head environment,
    a standalone search head shares the bundle with all the search peers it is connected
    to.

    - Splunk recommends dedicating a separate Splunk Enterprise instance to each role,
    such as a deployment server for forwarder management, a search head deployer for
    the search head cluster, a license manager for licensing, and a monitoring console
    for overall deployment monitoring. However, in underutilized deployments, management
    components can be colocated according to the matrix provided at https://tinyurl.com/26f9n5zf.


    ### Tip


    In a distributed deployment, the best practice is to avoid indexing search head
    internal logs locally and enable forwarding on the search head. So, the internal
    logs and summary index data will be stored centrally on indexers.


    Distributed search can be configured through Splunk Web, the CLI, or by directly
    modifying the server.conf and distsearch.conf files. In the next section, we will
    learn about adding indexers to a search head via the CLI and Splunk Web approaches.

