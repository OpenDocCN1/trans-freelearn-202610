    # Part 1:


    # Splunk System Administration


    The initial part of this *Splunk 9.x Enterprise Certified Admin Guide* provides
    a comprehensive introduction to the core aspects of running Splunk. These chapters
    provide a robust starting point for effectively managing and configuring Splunk
    Enterprise. *Part 1* establishes a strong foundation for aspiring adept Splunk
    administrators, covering key elements such as the exam prerequisites, important
    Splunk features, proven setup methods, license management, user access control,
    forwarder management, index management, exploring configuration files, and implementing
    distributed search, including clustering fundamentals. These chapters will equip
    you with essential knowledge and skills to efficiently oversee Splunk Enterprise.


