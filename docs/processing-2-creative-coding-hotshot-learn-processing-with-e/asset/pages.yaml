    In this task, we are going to write code that runs on Arduino, so we need the
    Arduino IDE installed. You can download it from www.arduino.cc and install it
    by unzipping the package that matches your operating system.


    # # Engage Thrusters


    Let''s hook up our Arduino:


    +   1. The first thing we need to do for this task is to build a little circuit,
