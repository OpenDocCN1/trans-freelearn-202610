  md: '2. We add a new tab and name it Visualizer. An interface is like a class definition
    without the method implementation. This interface defines the method that all
    our visualizer classes have to implement.


    ```

    interface Visualizer {

    public int[][] tiles = new int[8][8];

    public void init();

    public void tick();

    public void setActive( boolean active );

    }

    ```


    3. The first visualizer we are going to implement switches on and off after every
    second tile of our 8 x 8 tiles grid every time the tick() method gets called.
    Add a new tab, name it Alternate, and add the following code:


    ```

    public class Alternate implements Visualizer {

    int p = 1;

    int count = 0;


    public Alternate() {

    init();

    }


    public void tick() {

    count ++;

    if ( count < 4 ) return;


    count =0;

    if ( p == 1 ) { p = 0; } else { p = 1; }

    for ( int x = 0; x < 8; x++ ) {

    for ( int y = 0; y < 8; y++ ) {

    tiles[x][y] = 255 * ( (x+y+p) % 2 ) ;

    }

    }

    }


    public void init() {

    for ( int x = 0; x < 8; x++ ) {

    for ( int y = 0; y < 8; y++ ) {

    tiles[x][y] = 0;

    }

    }

    }


    public void setActive( boolean active ) {

    }

    }

    ```'
