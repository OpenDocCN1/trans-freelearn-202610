    \ for( int a = 0; a < 72; a++) {\n        vertx[a] = cos( radians( a * 5.0 ) )\
    \ * getR( a * 5.0 );\n        verty[a] = sin( radians( a * 5.0 ) ) * getR( a *\
    \ 5.0 );\n    }\n}\n```\n\n4. In our draw() method, we need to add a call to the\
