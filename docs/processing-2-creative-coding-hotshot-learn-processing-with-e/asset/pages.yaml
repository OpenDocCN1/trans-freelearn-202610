  md: "# # Objective Complete - Mini Debriefing\n\nIn our third task, we turned the\
    \ sphere that we smoothened and lit in the second task into a globe using a texture.\
    \ In step 2, we added a texture image and created a `PImage` object to store it.\
    \ We extended our `makeSphere()` method to take a texture image as a parameter\
    \ and then used the image as the texture for our sphere. To make sure the texture\
    \ was mapped to our mesh, we needed to use an extended version of the `vertex()`\
    \ method that also allowed us to specify which part of the texture we want to\
    \ use for each vertex.\n\nSince we already used two loops to iterate over the\
    \ angles of the polar coordinates, we used the same coordinates as a basis for\
    \ our texture coordinates. We simply needed to map them to the height and width\
    \ of our texture image.\n\nFinally, we added a callback function that handles\
    \ key press events and used it to switch between the texture images. We added\
    \ two satellite images from NASA's Visible Earth project. The blue marble image\
    \ is a satellite image that has been processed to show no clouds on the planet,\
    \ and the earth-by-night image shows the globe by night. We switched the textures\
    \ of our shape using the `setTexture()` method of the `PShape` class that replaces\
    \ the current texture.\n\n# ## From globe to neon globe\n\nFor our final task\
    \ of this mission, we will be converting the globe we just created into a glowing\
    \ neon globe. We will create a globe that would fit into an 80s movie like WarGames\
