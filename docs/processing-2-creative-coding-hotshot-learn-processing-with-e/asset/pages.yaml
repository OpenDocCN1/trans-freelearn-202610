  md: "7. Now we add a `for` loop that displays the previous two lines, the line that's\
    \ currently being read, and the next two lines of text in our sketch window. We\
    \ will now change the text alignment so that it matches the speaker of our robot\
    \ actors. The text will be aligned to the right if our robot uses `speakRight()`,\
    \ and it will be aligned to the left if our robot uses `speakLeft()`.\n\n```\n\
    ```java\nvoid draw() {\n  background(255);\n  textAlign(CENTER);\n  fill(0);\n\
    \n  if ( !drama.isRunning() ) {\n    text( \"Click here for Drama\", width/2,\
    \ height/2 );\n  }\n  else {\n    int current = drama.getCurrent();\n    for (\
    \ int i = -2; i < 3; i ++ ) {\n      Line l = drama.getline(i + current);\n  \
    \    if ( l != null) {\n        if ( \"J\".equals( l.speaker ) ) {\n         \
    \ textAlign( LEFT );\n          text( l.text, 10, height/2 + i * 30 );\n     \
    \   }\n        else {\n          textAlign( RIGHT );\n          text( l.text,\
    \ width - 10, height/2 + i * 30 );\n        }\n      }\n    }\n  }\n}\n```\n```\n\
    \n8. To show the current line more prominently, we will change the color of the\
    \ text. We set the color of the current line to black and all other lines to a\
    \ lighter gray by adding a `fill()` statement to the for loop.\n\n```\n```java\n\
    for ( int i = -2; i < 3; i ++ ) {\n  fill( abs(i) * 100 );\n  Line l = drama.getLine(i\
    \ + current);\n  if ( l != null) {\n    if ( \"J\".equals( l.speaker ) ) {\n \
    \     textAlign( LEFT );\n      text( l.text, 10, height/2 + i * 30 );\n    }\n\
    \  }\n}\n```\n```"
