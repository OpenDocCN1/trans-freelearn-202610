- pgno: 185
  md: '# # Objective Complete - Mini Debriefing


    In the second task of our current mission, we turned the wireframe mesh of our
    sphere into a solid smooth sphere and activated some lights. In steps 1 to 5,
    we turned off the line strokes and activated the filling of the faces. We also
    activated a point light source to prevent the sphere from being rendered completely
    flat.


    Our sphere was shaded and filled, but we had sharp bends at each of the quad strip
    rings that we created using our loops in the `makeHere()` method. To fix this,
    we added normal vectors to each vertex. These vectors stand at right angles to
    the surface and are needed to shade our sphere''s surface smooth.


    Finally, we learned how to light our sphere more evenly so that every part of
    it can be seen; this is because in the third task, we will turn our sphere into
    a globe, and we want every part of the world to be visible.


    # # From sphere to globe


    The third task of our current mission is to convert our sphere into a globe by
    using a texture image. We will need to define the mapping of each vertex to a
    part of the texture image to make it fit. We will use a black and white texture,
    where all the land mass is black and the sea is white. The image was created based
    on a vector map licensed under a Creative Commons license by STUDIO7DESIGNS, which
    can be found at `http://vector4free.com/vectors/id/75`. I added Antarctica and
    converted it to a PNG file.


    After this, we will add satellite images provided by NASA''s Visible Earth project
    (`http://visibleearth.nasa.gov/`). We will also add a callback handler for keyboard
    events and make the textures switchable.'
