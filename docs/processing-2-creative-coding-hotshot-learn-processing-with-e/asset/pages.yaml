    \ which takes the radius and step size (in degrees) as parameters. The return\
    \ value of our function is the new `PShape` object containing our sphere's vertices.\n\
    +   `PShape makeSphere( int r, int step ) {\n+    }`\n\n+   4. Polar coordinates\
    \ use two angles and a radius to define a point on a spherical surface; every\
    \ point has the same distance to the origin, so our radius stays fixed, but our\
    \ angles change. We will now define two nested loops that iterate over all the\
    \ possible angle positions.\n\n```\n```\nPShape makeSphere( int r, int step )\
    \ {\n PShape s = createShape();\n \n s.noFill();\n s.stroke(255);\n s.strokeWeight(2);\n\
    \ \n for( int i = 0; i < 180; i+=step ) {\n for( int j = 0; j <= 360; j+=step\
    \ ) {\n }\n }\n \n return s;\n }\n```\n```\n\n+   5. Now we will be using the\
    \ polar coordinates to generate rings on our sphere using quad strips. We need\
    \ to define point pairs (like in the following figure) and use the `vertex()`\
    \ method to feed the converted Cartesian coordinates to our `PShape` object:\n\
    \n![](img/5cb67baa7bc7778de360b14c00d1ab81_177_0.png)"
