    \ folder. You can find the path to the folder in the **Preferences** dialog.\n\
    +   \n+   3. Restart Processing if it is currently running, to make sure that\
    \ the library is found by your installation.\n+   \n+   4. Now, create a new sketch\
    \ and click on **Import library ...** under the **Sketch** menu to include the\
    \ SimpleOpenNI library.\n+   \n+   5. Add a `setup()` and `draw()` method to your\
    \ sketch.\n+      `import SimpleOpenNI.*;`\n+      `void setup() {`\n+      `}`\n\
    +      `void draw() {`\n+      `}`\n+   \n+   6. In the `setup()` method, resize\
    \ the sketch window to 640 x 480 pixels and define an OpenNI context object. We\
    \ use the `enableDepth()` method to start capturing the depth image and `setMirror()`\
    \ to activate the mirror function.\n+      `import SimpleOpenNI.*;`\n+      `SimpleOpenNI\
    \ context;`\n+      `void setup() {`\n+      `size( 640, 480 );`"
