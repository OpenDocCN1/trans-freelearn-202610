    # # Objective Complete - Mini Debriefing


    In this task, we completed our robot-actors by building bodies for them. We used
    some cardboard boxes, painted them, and added a cheap pair of speakers by gluing
    them into the boxes. Each robot got a head made of a painted Styrofoam sphere.


    As I already said in the introduction to this task, there is no right or wrong
    way to build your robots. Build them as small or as big as you like. Add some
    hair, make them a nose, sew a dress for Juliet, draw Romeo a mustache, and so
    on.


    # # Mission Accomplished


    In this mission, we added speaking capabilities to Processing by installing the
    ttslib library. We learned how to simulate multiple speakers by changing the pitch
    of voice or installing an additional TTS engine on Linux.


    We also defined a speak text format for the Shakespeare script to make parsing
    easier and created a `Drama` thread that manages our text lines and controls our
    robots.'
