  md: 'Apart from tracking the positions of the user''s body parts, Kinect also provides
    us with a depth map of the surrounding players and a bitmap that allows us to
    determine which pixels of the image belong to the player and which don''t.


    # Your Objectives


    This Hotshot project is split into the following four tasks:


    +   - Connecting the Kinect

    +   - Making Processing see

    +   - Making a dancer

    +   - Dance! Dance! Dance!


    # Mission Checklist


    To complete this mission, you need a Kinect to connect to your computer. Kinect
    is connected to a USB port, but it needs more power than what a standard USB port
    can provide. Therefore, Kinect comes with a non-standard USB connector and a separate
    power connector. If you got your Kinect in a bundle with the Xbox 360, you will
    probably need to buy a USB power adapter for it; newer versions of the Xbox 360
    provide a special port to connect the Kinect directly. You can get the adapters
    at an electronics store or online.


    Since this project is about dancing, you will also need some music to dance to.
    The stick figures we are going to create are very tolerant when it comes to genres
    of music, so feel free to choose whatever music you like—Donna Summer, Zillertaler
    Schürzenjäger, Bobby Brown, Skrillex. If you like it, your stick figures will
    like it too.


