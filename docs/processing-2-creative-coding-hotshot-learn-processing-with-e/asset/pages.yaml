    \ the desired color tone. Like RGB, the HSB color mode has three parameters, but\
    \ instead of mixing red, green, and blue, you choose the basic color (hue), the\
    \ brightness, and the saturation. We keep the brightness and saturation value\
    \ fixed for the sake of simplicity and let the user change the hue value.\n\n\
