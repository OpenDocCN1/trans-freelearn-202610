- pgno: 82
  md: '# # Objective Complete - Mini Debriefing


    In this task, we created three time-based visualizers and two sound reactive ones
    that control an 8 x 8 tile pattern for our dance floor. We created two timer threads,
    one thread that calls the `tick()` method of our visualizers every 125 milliseconds,
    and one that changes the active visualizer.


    The time-based visualizers we created are driven by the `tick()` method, which
    is where we update the tile pattern. These visualizers are added to an array of
    available visualizers from which our second thread chooses a new one by random.


    The `BeatVisualizer` and `FFTVisualizer` classes don''t use the `tick()` method
    at all. They change the visualized pattern in the `samples` method. We registered
    these two visualizers as listeners to our `AudioPlayer` object, which then calls
    the `samples()` method every time the player loads a new buffer.


    The tile pattern we create in the visualizers is used by our `draw()` method.
    We also implemented a little afterglow effect for the tiles by reducing the color
    intensity in every frame after a tile has been lit instead of simply turning it
    off.


    # # Making your disco dance floor


    In this task, we will use the sketch we generated in the previous task and turn
    it into a texture for a 3D object. We will create a rectangle using the Processing
    shapes and texture it with our visualizer.


    We will also implement the `playlist` functionality for our MP3 files and define
    a file format that allows us to control the sequence of the music and the visualizers.


    # # Prepare for Lift Off


    In this task, we are going to create a text file that controls our playlist and
    the sequence in which the visualizers are shown. Each playlist entry has two lines.
    The first line contains only the filename of the MP3 file and the second line
    contains the visualizer IDs and their length in seconds. The entries are separated
    using a ".". The following is an example of a playlist text file:


    ```

    song1.mp3

    0:4-1:2-3:2

    song2.mp3

    0:1-1:1:0:1-2-1

    ```


    In this case, the `song2.mp3` file is played and the visualizers with IDs 0, 1,
    0, and 2 are shown for one second.'
