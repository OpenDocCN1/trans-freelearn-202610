    \ ) {\n\t\tthis.scale = scale;\n\t}\n\n\tvoid add( PVector a, PVector b, PVector\
    \ c, PVector n ) {\n\t\ttriangles.add( new Triangle( a, b, c, n ) );\n\t}\n}\n\
    ```\n\n3. When all the triangle objects of our mesh have been added to our Triangle\
    \ Soup,\nwe need to save it to an STL file. Add the following method to our class:\n\
    \n```\nvoid save( String filename ) {\ntry {\n\tbyte[] header = new byte[80];\n\
    \tbyte[] count = new byte[4];\n\tbyte[] tri = new byte[50];\n\n\tFileOutputStream\
    \ out = new FileOutputStream( filename );\n\tByteBuffer buffer = ByteBuffer.allocate(\
    \ 80 );\n\tbuffer.order( ByteOrder.LITTLE_ENDIAN );\n\n\tArrays.fill(header,0,\
    \ 80, (byte)0);\n\tout.write( header, 0, 80 );\n\tbuffer.putInt( triangles.size()\
    \ );\n\tbuffer.rewind();\n\tbuffer.get( count, 0, 4 );\n\tout.write( count, 0,\
    \ 4 );\n```"
