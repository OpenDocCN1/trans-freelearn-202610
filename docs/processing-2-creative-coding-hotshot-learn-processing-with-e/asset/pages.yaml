    # # Objective Complete - Mini Debriefing


    The third task of our current mission was to connect our prototyped controller
    to the Smilie-O-Mat sketch and to extend the sketch to parse the messages from
    the serial port. In step 5, we added a serialEvent() callback method to get notified
    when messages arrive on the serial port, and we checked the first letter of the
    message to see which of the knobs have been turned. Then, we converted the rest
    of the string to a number and used it to control the facial parameters of our
    smiley.


    Starting with step 7, we added support for the click messages our Arduino sketch
    is sending when the button was pressed. Since our button sometime triggers more
    than one click message, we debounced the button by adding a little delay to the
    Arduino sketch so that our controller doesn’t fire the messages on accident.


    # # Putting it in a box


    Now we have prototyped the controller, changed the Smilie-O-Mat sketch to support
    it, and tested it, but it is still a little bit brittle and hard to use. The current
    task is to create a customized controller that is easier and faster to use than
