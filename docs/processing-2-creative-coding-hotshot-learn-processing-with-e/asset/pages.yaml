    \ we will use the user tracking capabilities of the SimpleOpenNI framework and\
    \ define some callback functions to get notified when a user is detected or when\
    \ the tracked user disappears. And finally, we will color all the pixels in the\
    \ depth image that belong to the user to enable the user to see what is being\
    \ tracked.\n\n# ## Engage Thrusters\n\nLet's teach Processing how to see:\n\n\
    +   1. At the time of writing, the SimpleOpenNI framework could not be installed\
