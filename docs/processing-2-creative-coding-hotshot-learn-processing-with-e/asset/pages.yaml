    \ or the afterglow of an old CRT monitor.\n\nThe filter effects look great on\
    \ the simple continent map, but we wanted the satellite images from the Visible\
    \ Earth project to remain unaltered. So, we added a Boolean variable from step\
    \ 13 onwards, which allowed us to activate the filters only for our first texture\
    \ image.\n\n# # Mission Accomplished\n\nOur mission was to build a spinning 3D\
    \ globe that resembles the visual aesthetics of the world maps seen on computer\
    \ displays at the headquarters of heroes and villains in movies from the 80s.\
    \ We started by creating a spherical mesh in the first task. The mesh consisted\
    \ of quad strips that warped around our sphere. Finally, we created the coordinates\
    \ by iterating over our sphere's surface using polar coordinates and converting\
