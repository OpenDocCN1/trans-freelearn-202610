    move each figure to a different position to make sure they aren''t drawn on top
    of each other.


    ```

    void drawDancer() {

    if ( player != -1 && context.isTrackingSkeleton( player ) ) {

    for ( int j=-2; j< 3; j++ ) {

    for ( int k = 0; k < 4; k++ ) {

    figures[j+2][k].update( context, player );

    pushMatrix();

    translate( 100*j, 0, -100*k );

    scale( .1 );

    figures [j+2] [k].draw();

    popMatrix();

    }

    }

    }

    }

