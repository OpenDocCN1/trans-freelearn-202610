    \  void export() {\n+       selectOutput( \"Export to STL\", \"exportCallback\"\
    \ );\n+   }\n\n+   6. The callback method for the dialog box gets the filename\
    \ that the user selects, as a string parameter. If the user cancels the dialog,\
    \ the filename string is set to null. If we get a valid filename, we convert it\
    \ to an absolute path and create a TriangleSoup object. To make our object printable,\
    \ we need to make sure that it is a closed volume and not a single wall. We add\
    \ the `exportOuter()` and `exportInner()` methods, which create the walls, and\
    \ the `exportBottom()` and `exportTop()` methods, which close our object.\n+ \
    \  \n+   void exportCallback(File exportFile) {\n+       if ( exportFile != null\
    \ ) {\n+       String filename = exportFile.getAbsolutePath();\n+       TriangleSoup\
    \ export = new TriangleSoup();\n+       export.scale( .5 );\n+   \n+       exportOuter(\
    \ export );\n+       exportInner( export );\n+       exportBottom( export );\n\
    +       exportTop( export );\n+       export.save(filename);\n+       }\n+   }\n\
    \n+   7. Now we need to add the export functions for each of the meshes. The `exportOuter()`\
    \ method creates triangles for the outer walls and then calculates the normal\
    \ vectors for the triangles.\n+   \n+   void exportOuter( TriangleSoup export\
    \ ) {\n+       for ( int h = 1; h < 20; h++ ) {\n+       for ( int a = 0; a<72;\
    \ a++ ) {\n+       int ab = (a+1) % 72;\n+       PVector p1 = new PVector( vertx[h][a],\
    \ 95-h*5.0, verty[h][a]\n+       );\n+   \n+       PVector p2 = new PVector( vertx[h-1][a],\
    \ 95-(h-1)*5.0,\n+       verty[h-1][a] );\n+       PVector p3 = new PVector( vertx[h][ab],\
    \ 95-h*5.0, verty[h]\n+       [ab] );\n+       PVector p4 = new PVector( vertx[h-1][ab],\
    \ 95-(h-1)*5.0,\n+       verty[h-1][ab] );"
