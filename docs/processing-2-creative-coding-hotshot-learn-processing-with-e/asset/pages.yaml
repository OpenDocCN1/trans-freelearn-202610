- pgno: 250
  md: '11. Run the sketch now and adjust the parameters until you have created a vase
    that pleases you. Export the mesh as an STL file. One of the meshes I created
    looks like this:


    ![](img/5cb67baa7bc7778de360b14c00d1ab81_250_0.png)


    # Objective Complete - Mini Debriefing


    Our third task for this mission was to export the mesh of our vase to an STL file.
    We added a Triangle class and a TriangleSoup class, which allowed us to store
    the triangles of our mesh in a list and then export the list. The TriangleSoup
    class takes care of creating the header and vertex data in the correct binary
    format.


    We added a button to our GUI, which opens a file selection box and a callback
    function that gets called when the user selects a filename. We added a TriangleSoup
    object to our sketch and created export methods that create our inner and outer
    walls, the bottom triangle fans, and the top ring that connects the inner and
    outer wall.


    After all the triangles are created and added to our List, the save() method is
    called and an STL file with the selected filename is created.


    # Making it real


    The final task of our current mission is to take the file we exported in the third
    task and turn it into a physical object. I will show you how to print these STL
    files on a desktop 3D printer, and how to order them from an online 3D printing
    service. The 3D printer I used for these examples is the Makerbot CupCake CNC
    (2009). Other printers use different control software, but the steps required
    to convert an STL file to a physical object are very similar on each of them.'
  merge: -1
  img_proc: true
- pgno: 251
  md: "If you don't have a 3D printer at home, you can try to find a hackerspace or\
    \ fab lab near you.\nThese are groups of makers and hackers who meet on a regular\
    \ basis to share their projects\nand provide the tools and information to get\
    \ them done. Many of them have 3D printers\nthese days.\n\nFrom step 9 onwards,\
    \ I also show you how to use an online 3D printing service to order your\nobject.\
    \ I used http://www.shapeways.com for this example because they offer a wide\n\
    range of materials to choose from and deliver to most countries.\n\n# Engage Thrusters\n\
    \nLet's print our object:\n\n+   1. The software that's needed to control the\
    \ Makerbot Cupcake is called ReplicatorG\n+   and can be downloaded from http://replicat.org.\
    \ For this example, I used\n+   Version 0037 because the newest version doesn't\
    \ support my printer. Download\n+   ReplicatorG for your platform.\n+   \n+  \
    \ 2. Open the file you downloaded in the previous step and start ReplicatorG.\n\
    +   \n+   3. To generate the correct control commands, you have to select the\
    \ type of printer\n+   you want to use by going to Machine | Machine Type (Driver).\n\
    +   \n+   4. Now we can open the STL file that we exported from our sketch in\
    \ the last task. The\n+   mesh gets rendered as a preview and should look like\
    \ the one in this screenshot:\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_251_0.png)"
  merge: -1
  img_proc: true
- pgno: 252
  md: '5. Make sure the object you want to print fits the build platform. Move and
    scale it (if necessary) using the menu on the right-hand side of the preview image.


    6. When the size and placement of the object are correct, we need to generate
    the GCode for your machine. This step slices the object into printable layers
    and generates the control commands that are interpreted by the printer to position
    the printing head and control the extrusion. Click on the **Generate GCode** button
    and select the printing profile you would like to use.


    7. When the GCode generation is finished, you can start your build by going to
    **GCode | Build**. The following image shows my vase while it''s being printed:


    ![](img/5cb67baa7bc7778de360b14c00d1ab81_252_0.png)


    8. When the print is finished, take a flower and place it in what was not too
    long ago just a few lines of code on your computer.


    ![](img/5cb67baa7bc7778de360b14c00d1ab81_252_1.png)'
