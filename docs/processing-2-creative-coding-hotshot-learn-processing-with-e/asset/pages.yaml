- pgno: 149
  md: '# # Project 6


    # # Fly to the Moon


    Ever since people got their hands on computers, they have used them for playing
    games. One of the first games was a simulation game named Lunar Lander, where
    the player had to land a lunar-landing capsule on the moon. The first version
    was written in 1969 and was text-based. The first graphical version of this game
    was written four years later for DEC Terminals. The moon-landing simulation games
    have been ported to nearly every computer system ever since, which makes it a
    perfect game for our current mission, since we are going to use the Processing
    modes to make a game run in the browser using Processing.js and on Android devices.


    # ## Mission Briefing


    Our current mission is to create a moon-lander game. The first version of the
    game will be a Processing sketch running on your computer like the ones we have
    created in the previous missions. Then, we will use the various Processing modes
    and make the game run in the browser using the JavaScript mode, and on Android
    devices using the Android mode.


    For each of these modes, we will adjust the game controls to fit the platform
    if necessary.


    # ## Why Is It Awesome?


    This project is awesome for two reasons: first, we are writing a game, and this
    has been on the official list of computer project awesomeness since the invention
    of computers, and second, we write a game that runs on your computer, your Android-powered
    mobile device, and in your browser. This allows us to cover nearly every Internet-capable
    platform that currently exists, from desktop computers and laptops to mobile phones,
    tablets, and smart TV''s. When Java arrived, it made the promise of write once,
    run everywhere. Processing is taking this promise to the next level.'
