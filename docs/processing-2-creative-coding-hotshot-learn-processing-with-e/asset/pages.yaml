    5. To create the HUD, we need to add the onNewUser() and onUserLost() callback
    methods, like we did in the previous section. As we also want to use the skeleton
    tracker, we start the skeleton calibration in the onNewUser() function.


    ```

    void onNewUser(int userId) {

    println("onNewUser - userId: " + userId);

    println(" start pose detection");

    if ( player == -1 ) {

    player = userId;

    calibrated = false;

    context.requestCalibrationSkeleton(userId, true);

    }

    }

    ```


    ```

    void onLostUser( int userID ) {

    if ( player == userID ) {

    println( "lost user" );

    player = -1;

    calibrated = false;

    }

    }

    ```


    6. We also add a onEndCalibration() callback function that gets called when the
    calibration is finished. If the calibration is not successful, we can try to find
    the user for the second time by starting pose detection.


    ```

    void onEndCalibration(int userId, boolean successful) {

    println("onEndCalibration - userId: " + userId + ",",

    successfull: " + successfull);

    if ( player == userId ) {

    if (successfull) {

    println(" User calibrated !!!");

    context.startTrackingSkeleton(userId);

    }

    }

    ```'
