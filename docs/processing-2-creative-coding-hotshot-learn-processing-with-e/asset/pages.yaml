- pgno: 178
  md: '6. To convert the polar coordinates into Cartesian ones, we need to calculate
    the sine and cosine values of the angles. Processing expects the angles (which
    we use as an input for trigonometric functions or rotate statements) to be in
    radians, which go from 0 to 2π instead of 0 to 360 for a full circle. We will
    use the radians() method to convert the angles before feeding them to those functions.


    ```

    PShape makeSphere( int R, int step ) {

    PShape s = createShape();

    s.beginShape( QUAD_STRIP );

    s.noFill();

    s.stroke(255);

    s.strokeWeight(2);

    for( int i = 0; i < 180; i+=step ) {

    float sini = sin( radians( i ) );

    float cosi = cos( radians( i ) );

    float sinip = sin( radians( i + step ) );

    float cosip = cos( radians( i + step ) );

    for( int j = 0; j <= 360; j+=step ) {

    float sinj = sin( radians( j ) );

    float cosj = cos( radians( j ) );

    s.vertex( r * cosj * sini, r * -cosi, r * sinj * sini );

    s.vertex( r * cosj * sinip, r * -cosip, r * sinj * sinip );

    }

    }

    s.endShape();

    return s;

    }

    ```


    7. In our setup() method, we add a call to our makeSphere() method.


    ```

    void setup() {

    size(400, 400,P3D);

    sphere = makeSphere( 150, 5 );

    }

    ```


    8. To make the sphere visible, we need to make use of our sphere object in the
    draw() method by using the shape() method.


    ```

    void draw() {

    background(0);

    translate( width/2, height/2 );

    shape(sphere);

    }

    ```'
