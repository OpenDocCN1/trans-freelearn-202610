- pgno: 143
  md: 'What we need to do is put the controller into a more stable housing and add
    some knobs to the variable resistors. We will use an aluminum box to house our
    controller, drill some holes for the resistors, and then switch and solder the
    connections to prevent them from losing contact. We will also add a sheet of paper
    to prevent our Arduino from touching the metal directly and causing a short circuit.


    Like the robots in Project 1, Romeo and Juliet, the version of the controller
    shown in this task is how I solved the problem, and this is by no means the only
    valid solution. You want to use a pink lunch box or a little plastic dinosaur
    instead of the aluminum box? No problem! This is your controller—feel free!


    # Engage Thrusters


    Let''s build a housing for our controller:


    +   1. Take off the lid of our box and mark the spots where you want your input
    elements to be.


    +   2. Drill four holes; three for our variable resistors and one for the push
    button, as shown in the following picture:


    ![](img/5cb67baa7bc7778de360b14c00d1ab81_143_0.png)


    +   3. Screw off the nut of your resistors, stick them through the holes you just
    made, and fix them with the nut again.

    +   4. Turn the lid around and solder the wires to the middle connectors.

    +   5. Now, prepare three pieces of wire and solder them to all the left legs
    of our resistors.

    +   6. Solder the wire from the second resistor to the left leg of the first one,
    and the wire from the third resistor to the left leg of the second one.

    +   7. Now, take three more pieces of wire and solder them to the right legs of
    the resistors.'
