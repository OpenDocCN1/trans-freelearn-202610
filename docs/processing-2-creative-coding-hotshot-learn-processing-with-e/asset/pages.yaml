    # Objective Complete - Mini Debriefing


    Task 3 of our current mission was to implement a tweeting sketch. In steps 1 to
    5, we registered our application on the Twitter developer site and generated the
    required consumer and consumer secret keys. To actually post on behalf of a Twitter
    user, we need two more keys: an access token and an access token secret. To get
    these, we opened a browser window in step 12.


    After the user grants the requested permission to our application, we need the
    pin that is shown in the browser window to finish our authorization process. We
    therefore open a swing input dialog and ask the user to enter the pin.


    The access token keys are reusable, so we only need to acquire them once and then
    store them to the same text file where our consumer keys are kept. If this file
    already contains the four keys, we can create our Twitter objects directly and
    start tweeting right away.


    We used Twitter4J to access the Twitter API, and to actually tweet something,
    we implemented a mouseClicked() method, which sends a random tweet to the world.
    We defined an array of strings for these tweets and chose a random one every time,
    because Twitter doesn''t allow the exact same text to be posted twice via the
    API (for spam prevention).


    # Tweet your mood


    The final task in this mission is to combine tweeting with the mood faces we created
    earlier to tell the world how we currently feel. We extend the GUI section of
    our Smilie-O-Mat with a button and implement a status update method that doesn''t
    just tweet a text message, but also uploads our current smiley.'
