- pgno: 94
  md: '# # Mission Accomplished


    In this project, we learned how to use the Minim framework to play MP3 files and
    how to access the sample data. We used the samples to generate a visualizer for
    the currently played sound. We used the fft class of the Minim framework to generate
    an equalizer visualizer.


    In our second task, we wrote five classes that change a pattern consisting of
    an 8 x 8 grid of tiles. We used a timer thread that triggers the changes in three
    of the classes. We also added a visualizer that uses the sample data and the fft
    class to generate the pattern.


    In the third task, we changed the draw() method and used the visuals we generated
    in the second task as a texture. We also added a playlist functionality. The playlist
    controls the sequence of played songs and also the sequence of our visualizers
    and how long they are shown.


    In the final task of our mission, we merged our visualizer texture and the playlist
    classes to the stick figure dance company from Project 2, The Stick Figure Dance
    Company. We also added a new function to our draw() method to display the song
    title and the artist that we retrieved from the MP3 metadata.


