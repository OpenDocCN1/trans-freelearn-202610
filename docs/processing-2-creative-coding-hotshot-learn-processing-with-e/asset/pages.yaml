- pgno: 130
  md: 'Starting from step 10, we removed the blinking code and replaced it with a
    call to the `println()` method of the `Serial` object, which uses the built-in
    serial port to send the resistor value to the computer. To read the values, we
    used a serial monitor that the Arduino IDE provides.


    In step 16, we started writing a Processing application that listens to the serial
    port instead of the serial monitor and displays the values it reads on the serial
    port using the Processing''s `serial` library.


    # Classified Intel


    Arduino sends values from the variable resistor in a range from 0 to 1,023. Usually,
    we expect the values to be zero on the left-hand side of the knob and the maximum
    on the right-hand side. If your controller sends the value the other way around,
    you have two possibilities to fix this. On the hardware side, you can switch the
    leads that go to **Gnd** and **5V** on the Arduino board. On the software side,
    you can calculate the value by subtracting it from the maximum value:


    ```

    val = 1023 - val;

    ```


    The software side is especially helpful if you have already soldered your circuit.


    # Building your controller


    In the first task of this mission, we learned how to connect a variable resistor
    to Arduino and send its value to the computer using the serial port. Our next
    task is to extend this basic circuit and add two more resistors, because we want
    to use them to control all the facial parameters of our Smilie-O-Mat sketch in
    the next task.


    We will also add a button to our circuit and learn how to detect the click events
    and send them to our sketch. We will extend our communication protocol a bit and
    write a new Processing sketch that parses the messages—our Arduino generates—and
    displays the values we send.'
  merge: -1
  img_proc: true
