    +   8. Our exportInner() method is similar to the exportOuter() method, but the
    normals point in the opposite directions compared to the ones used in the exportOuter()
    method and the radius is reduced by 0.8.


    ```

    void exportInner( TriangleSoup export ) {

    for ( int h = 1; h < 19; h++ ) {

    for ( int a = 0; a<72; a++ ) {

    int ab = (a+1) % 72;

    PVector p1 = new PVector( vertx[h] [a] * 0.8, 95-h*5.0,

    verty[h][a] * 0.8 );

    PVector p2 = new PVector( vertx[h-1] [a]* 0.8, 95- (h-1)*5.0,

    verty[h-1] [a] * 0.8 );

    PVector p3 = new PVector( vertx[h] [ab] * 0.8, 95-h*5.0,

    verty[h][ab] * 0.8 );

    PVector p4 = new PVector( vertx[h-1] [ab]* 0.8, 95- (h-1)*5.0,

    verty[h-1] [ab]* 0.8 );

    PVector n1 = new PVector( - (p1.x+p2.x+p3.x)/3, 0, - (p1.y+p2.y+

    y+p3.y)/3 );

    n1.normalize();

    PVector n2 = new PVector( - (p2.x+p3.x+p4.x)/3, 0, - (p2.y+p3.

    y+p4.y)/3 );

    n2.normalize();

    export.add( p1, p2, p3, n1 );

    export.add( p3, p2, p4, n2 );

    }

    }

    }

