- pgno: 229
  md: '# Project 9

    From Virtual to Real


    A few years ago, if you had an idea for a vase or a pen holder, and you wanted
    it to be turned into a physical object that you could put on your desk, you would
    have started drawing blueprints. Depending on the material, you would have started
    carving wood, created a mould, made articles of clay, or paid someone to do it
    for you. But at the wake of this century, another opportunity presented itself—designing
    the object you like on your computer and feeding it to a 3D printer.


    # Mission Briefing


    Our mission is to generate a small vase from a mathematical expression. We will
    start with a simple formula and create 2D shapes; we will make the shape changeable
    using a GUI. Then, we will extend our 2D shape to the third dimension and add
    some more changeable parameters. We will add a camera control to our sketch, which
    will allow us to inspect our object from every angle before we decide whether
    that is what we want on our desk, window board, or cupboard.


    Then, we will add an export function that will allow us to either create an STL
    file that can be used as an input for a 3D desktop printer or order the vase from
    an online 3D printing service.


    # Why Is It Awesome?


    When I was a kid, I loved playing with Lego sets. And whenever I made a big building,
    I was always missing ONE special block that was required to finish my masterpiece.
    One roof stone, one window, one door (a green one), and so on. Later when I started
    watching Star Trek and saw a replicator for the first time, I knew that this was
    the solution to all my Lego problems. You need a Lego piece? One more horse to
    rescue a princess from a huge dragon? One more spaceship to fend off the evil
    aliens? Just tell your replicator.'
  merge: -1
  img_proc: true
