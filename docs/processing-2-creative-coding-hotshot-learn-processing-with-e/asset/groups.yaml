    \n2. 在“库管理器”对话框中，在搜索字段中输入 ttslib 以过滤库列表。\n\n3. 单击 **ttslib** 条目，然后单击 **安装** 按钮，如以下屏幕截图所示，以下载并安装该库：\n\
    \n![](img/5cb67baa7bc7778de360b14c00d1ab81_22_0.png)\n\n4. 要使用新库，我们需要将其导入到草图中。我们可以通过单击“草图”菜单并选择“导入库...”，然后选择\
