    # # Objective Complete - Mini Debriefing


    For this task of our current mission, we made our moon-lander game run on Android
    devices. From step 1 to step 4, we downloaded and installed the Android SDK, which
    is needed by Processing to compile the Android apps. We then made the game run
    in an emulator.


    In step 6, we tweaked our code a little bit to make the game run in full-screen
    mode and to fix the device orientation to landscape mode. Since most Android devices
    come without a keyboard, we also added support for touchscreen input.


    Finally, we made our app run on a real device.


    # # Classified Intel


    The Android mode also allows you to export your sketch as an Android project that
    can be used to create a signed APK file that can then be used to upload the app
    to Google Play or if you want to distribute it on your own. You can find detailed
    instructions on how to do this in the Processing Wiki at `http://wiki.processing.org/w/Android#Distributing_Apps`.'
  - '[PAGE 173]


    # # Mission Accomplished


    For this mission, we created a moon-lander simulation game and made it run in
    the browser using the Processing''s JavaScript mode and on Android devices using
    the Android mode.


    In the first task, Drawing a sprite, we created the graphics for the game starting
    with a background grid to make the game look like it''s drawn on a mathematics
    notebook. We then added a moon landscape and a landing platform. The rocket has
    to be able to move and rotate, so we used the pushMatrix() and popMatrix() methods
    to separate the translating and rotation operations we want to perform on the
    image form the rest of the drawing code.


    In the second task, Initiating the landing sequence, we implemented the physics
    and the controls for our game. We started by adding a vector for the moon''s gravity
    and one for the rocket''s speed. For every frame, the gravity influences the speed
    of the ship, which in turn influences the rocket''s position.


    Then we implemented a keyPressed() method and enabled the player to rotate and
    accelerate the rocket. The acceleration is also added to the speed vector of the
    rocket.


    Finally, we implemented a game loop and stopped the game when the rocket hits
    the moon or lands on the platform.


    In the third task, Running your sketch in the browser, we used the Processing''s
    JavaScript mode to create a JavaScript version that runs in the browser. We activated
    the image preloading to ensure the image for our rocket is available as soon as
    the game starts, and we learned how to change the HTML template where our sketch
    is embedded.


    In the final task, Running the game on an Android phone, we created an Android
    app from our game by using the Processing''s Android mode. We installed the Android
    SDK and the necessary APIs. We adapted our code a little bit to make the app run
    in full-screen mode and we also fixed the rotation to landscape.


    To make the game playable on a device without a keyboard, we had to change the
    game controls to support touchscreens.'
