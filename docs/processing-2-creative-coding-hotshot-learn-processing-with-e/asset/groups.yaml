    \n## 任务完成 - 小型简报\n\n对于本次任务，我们添加了三个滑块来更改控制变量的值。我们没有使用任何现有的 GUI 库；我们从头开始创建了滑块，将落在\
    \ 0 到 1024 区间内的变量值映射到滑块的长度，并绘制两个矩形。\n\n我们还实现了三个回调函数来使滑块对鼠标事件做出反应。在 mousePressed()\
    \ 方法中，我们测试鼠标指针是否位于我们的某个滑块上，如果是，则将该滑块的布尔变量设置为 true。在 mouseDragged() 方法中，如果该参数的布尔变量为\
    \ true，则更改控制变量的值。当释放鼠标按钮时，我们在 mouseReleased() 方法中将所有布尔变量设置为 false。\n\n## Hello\
