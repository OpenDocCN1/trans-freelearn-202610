    \n现在让我们改变一下我们的脸：\n\n- 1. 打开 Smillie-O-Mat 草图，并在 `setup()` 方法中更改草图窗口的大小，为笑脸下方的滑块腾出更多空间。\n\
    \n```java\nvoid setup() {\n  size(300, 390);\n  smooth();\n  background(255);\n\
