    \         200, 100 + map( eye, 0, 1024, -10, 10 ) );\n   }\n   ```\n\n8. We will\
    \ add a third control variable to change the mouth from smiling to frowning.\n\
    \n   ```\n   int mouth = 1024;\n   int eye = 512;\n   int col = 150;\n\n   void\
