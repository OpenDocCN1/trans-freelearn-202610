    \n## 目标完成 - 小结\n\n在本次任务的最后一项工作中，我们从电路中移除了免焊面包板，并将元件一起焊接。我们没有使用电路板，但由于我们的电路非常简单，我们直接使用一种有时称为\
    \ **乱线布线** 的技术将零件连接在一起。我们还通过将输入元件安装到盒子上，为控制器制作了一个外壳。\n\n正如我在本任务介绍中所说，控制器外壳的外观以及输入元件的布局主要取决于个人喜好。请随意将此控制器设计得尽可能个性或古怪。\n\
    \n## 任务完成\n\n我们当前的任务是为 Smilie-O-Mat 构建一个定制输入控制器。我们从一个可变电阻开始，将其连接到 Arduino——一块\
    \ AVR 微控制器开发板。Arduino 使用 C++ 编程，但 API 与 Processing 语言非常相似，并且 Arduino IDE 使用与 Processing\
    \ IDE 相同的框架。我们在 Arduino IDE 中创建了一个程序，用于读取电阻值并通过串口将其发送到计算机。在 Processing 端，我们使用串行库读取消息并显示它们。\n\
    \n在第二个任务，*构建您的控制器*中，我们通过将三个可变电阻和一个按钮连接到免焊面包板来创建控制器原型。我们为发送到计算机的消息创建了一个简单的协议，这使我们能够发送输入值以及哪个控制器发生了变化。按钮在按压按钮的状态从按下变为释放时，每次都会向计算机发送一条\
    \ **click** 消息。\n"
