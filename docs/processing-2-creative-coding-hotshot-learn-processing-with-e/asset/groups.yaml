    # # Project 1


    # # Romeo and Juliet


    Robots and performing arts share a long history. In fact, the word "Robot" was
    first coined

    in 1920 for a play by the Czech author _Karel Čapek_ named "Rossum''s Universal
    Robots".

    The play featured six robots, but since nobody was able to build a talking Robot
    at that

    time, humans had to play them. Times have changed a lot and we don''t need humans
    to

    disguise themselves as robots anymore. For this project, we will do it the other
    way round

    and make some robots who play the humans. Unfortunately, "Rossum''s Universal
    Robots"

    would require nine humans and six robots, so I chose a scene that''s simpler to
    perform. We

    are going to build a pair of robots who play the humans in the famous balcony
    scene from

    _Romeo and Juliet_.


    # # Mission Briefing


    To create the Processing sketches for this project, we will need to install the
    Processing library

    ttslib. This library is a wrapper around the FreeTTS Java library that helps us
    to write a sketch

    that reads out text. We will learn how to change the voice parameters of the `kevin16`
    voice

    of the FreeTTS package to make our robot''s voices distinguishable. We will also
    create a parser

    that is able to read the Shakespeare script and which generates text-line objects
    that allow our

    script to know which line is read by which robot.'
  - '[PAGE 20]


