    \ impact on your current state of emotion. To prevent our Smillie-O-Mat from increasing\
    \ the user's level of frustration or annoyance, our second task for this mission\
    \ is to make the facial parameters adjustable using the mouse by adding three\
    \ sliders below the smiley.\n\n## Engage Thrusters\n\nLet's now change our face:\n\
    \n- 1. Open the Smillie-O-Mat sketch and change the size of our sketch window\
    \ in the `setup()` method to add more room for the sliders below the smiley face.\n\
    \n```java\nvoid setup() {\n  size(300, 390);\n  smooth();\n  background(255);\n\
    \  colorMode(HSB);\n}\n```\n\n- 2. Now add a new method named `drawSliders()`\
    \ and draw three black rectangles for the bases of our sliders.\n\n```java\nvoid\
    \ drawSliders() {\n  fill(0);\n  strokeWeight(1);\n  rect( 20,315,width-40,2 )\
    \ ;\n  rect( 20,345,width-40,2 ) ;\n  rect( 20,375,width-40,2 ) ;\n}\n```\n\n\
    - 3. The first slider will change the mouth position, so we add a smaller rectangle\
    \ and map the value of the mouth variable to the x-coordinate of our rectangle.\n\
    \n```\nvoid drawSliders() {\n    fill(0);\n    strokeWeight(1);\n    rect( 20,315,width-40,2\
    \ );\n    rect( 15 + map( mouth, 0, 1024, 0, width-40 ), 310, 10, 12 );\n    rect(\
    \ 20,345,width-40,2 );\n    rect( 20,375,width-40,2 );\n}\n```\n\n- 4. Add a slider\
    \ for the eyebrow angle and one for the color of our face, the same way you did\
    \ for the mouth variable.\n\n```\nvoid drawSliders() {\n    fill(0);\n    strokeWeight(1);\n\
    \    rect( 20,315,width-40,2 );\n    rect( 15 + map( mouth, 0, 1024, 0, width-40\
    \ ), 310, 10, 12 );\n    rect( 20,345,width-40,2 );\n    rect( 15 + map( eye,\
    \ 0, 1024, 0, width-40 ), 340, 10, 12 );\n    rect( 20,375,width-40,2 );\n   \
    \ rect( 15 + map( col, 0, 1024, 0, width-40 ), 370, 10, 12 );\n}\n```\n\n- 5.\
    \ Now we call our drawSliders() method from the draw() method.\n\n```\nvoid draw()\
    \ {\n    background(255);\n    drawSliders();\n    color c = color(map(col, 0,\
    \ 1024, 0, 255), 255, 255 );\n    fill(c);\n    ellipse(150,150,250,250);\n  \
    \  strokeWeight(3);\n}\n```\n\n- 6. Run your sketch, then make changes to the\
    \ control variables and check whether the position of the slider changes.\n\n\
    - 7. To make the slider react to the mouse, we add a new method named `mousePressed()`\
    \ and a Boolean variable named `mclick`. This method gets called every time the\
    \ mouse button is pressed; we will now test whether the mouse click occurred on\
    \ our mouth slider.\n\n```\nboolean mclick = false;\nvoid mousePressed() {\n if\
    \ ( mouseY > 310 && mouseY < 322 ) {\n mclick = true;\n mouth = constrain( int(\
    \ map( mouseX, 20, width - 20, 0, 1024\n ) ), 0, 1024 );\n }\n}\n```\n\n- 8. We\
    \ need to add another callback method that gets called when the user drags the\
    \ mouse. We change the position of the slider only if the `mclick` variable is\
    \ set to `true` by our `mousePressed()` method.\n\n```\nvoid mouseDragged() {\n\
    \ if ( mclick ) mouth = constrain( int( map( mouseX, 20, width - 20,\n 0, 1024\
    \ ) ), 0, 1024 );\n}\n```\n\n- 9. We set the `mclick` variable to `true` when\
    \ the slider is clicked on. When the mouse button is released, we need to set\
    \ the variable back to `false`. Add a `mouseReleased()` method to our sketch.\n\
    \n```\nvoid mouseReleased() {\n mclick = false;\n}\n```\n\n- 10. Run the sketch,\
    \ drag the first slider, and check whether the position of the mouth changes accordingly.\n\
    \n- 11. To make our eye and color sliders work, we need two more Boolean variables,\
    \ and we need to add the following code to our `mousePressed()` method:\n\n```\n\
    boolean mclick = false;\nboolean eclick = false;\nboolean cclick = false;\n\n\
    void mousePressed() {\n if ( mouseY > 310 && mouseY < 322 ) {\n mclick = true;\n\
    \ mouth = constrain( int( map( mouseX, 20, width - 20, 0, 1024\n ) ), 0, 1024\
    \ );\n }\n\n if ( mouseY > 340 && mouseY < 352 ) {\n eclick = true;\n eye = constrain(\
    \ int( map( mouseX, 20, width - 20, 0, 1024 ) ),\n 0, 1024 );\n }\n\n if ( mouseY\
    \ > 370 && mouseY < 382 ) {\n cclick = true;\n col = constrain( int( map( mouseX,\
    \ 20, width - 20, 0, 1024 ) ),\n 0, 1024 );\n }\n}\n```\n\n- 12. We also need\
    \ to handle the dragging and releasing of the mouse button by adding the following\
    \ code to the mouseDragged() and mouseReleased() methods:\n\n```\nvoid mouseDragged()\
    \ {\nif ( mclick ) mouth = constrain( int( map( mouseX, 20, width - 20,\n0, 1024\
    \ ) ), 0, 1024 );\nif ( eclick ) eye = constrain( int( map( mouseX, 20, width\
    \ - 20,\n0, 1024 ) ), 0, 1024 );\nif ( cclick ) col = constrain( int( map( mouseX,\
    \ 20, width - 20,\n0, 1024 ) ), 0, 1024 );\n}\n```\n\n```\nvoid mouseReleased()\
    \ {\nmclick = false;\neclick = false;\ncclick = false;\n}\n```\n\n- 13. Now run\
    \ our sketch and use the sliders to adjust the facial parameters to match your\
    \ current mood. In this screenshot, you can see one of the smileys that can be\
    \ generated:\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_105_0.png)\n\n## Objective\
    \ Complete - Mini Debriefing\n\nFor this task, we added three sliders that change\
    \ the values of our control variables. We didn’t use any existing GUI libraries;\
    \ we created the sliders from scratch by mapping the values of our variables that\
    \ fall within the interval 0 to 1024 to the length of the slider and drawing two\
    \ rectangles.\n\nWe also implemented three callback functions to make the sliders\
    \ react to mouse events. In the mousePressed() method, we test whether the mouse\
    \ pointer is on one of our sliders, and if it is, we set the Boolean variable\
    \ for this slider to true. In the mouseDragged() method, we change the value of\
    \ our control variables if the Boolean variable for this parameter is true. When\
    \ the mouse button is released, we set all Boolean variables to false in the mouseReleased()\
    \ method.\n\n## Hello Twitter\n\nTask 3 of our mission is to create a Processing\
    \ sketch that is able to change our current Twitter status. We will use the Java\
    \ library Twitter4J from twitter4j.org, which encapsulates all the Twitter API\
    \ calls into convenient Java objects to set the status. We will also use the Twitter\
    \ developer website to create the necessary application keys and learn how to\
    \ ask the user for permission to post a status update.\n\n## Prepare for Lift\
    \ Off\n\nTo complete this and the following task of our current mission, you will\
    \ need a Twitter account to post the tweets and access to the Twitter developer\
    \ site. If you are already using Twitter, you are fulfilling the prerequisites\
    \ for this task, as Twitter doesn’t distinguish between normal and developer accounts;\
    \ every Twitter user has the permission to create and register applications. If\
    \ you have no Twitter account yet, go to twitter.com and register for one.\n\n\
    ## Engage Thrusters\n\nLet's tweet a bit:\n\n- 1. Go to the Twitter developer\
    \ pages at https://dev.twitter.com/ and log in with your Twitter account.\n\n\
    - 2. Now click on your account and select My applications from the pop-up menu\
    \ in the upper-right corner, as can be seen in the following screenshot:\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_107_0.png)\n\
    \n- 3. Now register a new application by clicking on **Create a new Application**\
    \ and filling out the registration form.\n\n- 4. Switch to the **Settings** tab\
    \ and change the **Application Type** to **Read and Write** to allow our app to\
    \ post tweets.\n\n- 5. Now switch back to the **Details** tab and create the consumer\
    \ key in **Consumer key** and the **Consumer Secret** key by clicking on **Recreate\
    \ my access token**. The following screenshot shows the **Details** page for my\
    \ Smilie-O-Mat application:\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_107_1.png)\n"
  mdcn: "\n\n## 任务完成 - 小型简报\n\n对于当前任务的第一个任务，我们创建了一个 Processing 草图来绘制我们的基本面部。我们添加了三个变量来控制用户可以更改的面部特征。我们将颜色模式更改为\
    \ HSB，以便用户更容易选择所需的颜色色调。与 RGB 类似，HSB 颜色模式也有三个参数，但不是混合红、绿、蓝，而是选择基本颜色（色相）、亮度和饱和度。为了简单起见，我们固定了亮度和饱和度值，并让用户更改色相值。\n\
    \n所有控制变量都存储 0 到 1023 之间的值，然后使用 map() 命令将其映射到绘制所需的值范围。\n\n## 让我来改变它\n\n没有人总是想微笑，但目前更改我们笑脸的面部参数有些麻烦，这可能会影响您当前的情绪状态。为了防止\
