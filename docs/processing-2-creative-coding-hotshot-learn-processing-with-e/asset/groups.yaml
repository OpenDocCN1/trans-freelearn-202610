    # # Project 3


    # # The Disco Dance Floor


    In the previous project, we taught Processing how to see, and even more importantly
    how to dance. Our stick figure dance company is currently dancing on a very boring
    gray dance floor. This is going to change soon, because in this project we will
    create a proper disco dance floor for our dance company.


    Illuminated disco dance floors were made popular in the late 70s by the film "Saturday
    Night Fever" with John Travolta, and we will simulate a dance floor made of 64
    glass tiles that are illuminated by lights from below.


    # ## Mission Briefing


    In this project, we will use Processing to play and analyze music using the Minim
    framework (developed by Damien Di Fede). We will also use it to access the music
    data in real time and implement some audio visualizations. Minim already comes
    bundled with Processing, so we don''t need to install a library for this mission.


    We will create multiple music and timer-controlled visualization patterns and
    we will make our sketch switch between them as the music plays. Then we will turn
    them into a disco dance floor by turning the graphics we are creating into a texture
    for a 3D object. Finally, we will add the texture to the somewhat boring dance
    floor we created in the previous project for our stick figure dance company.


    # ## Why Is It Awesome?


    When it comes to music visualizations, Processing is a very smart choice. The
    Minim library simplifies the required access to things such as beat detection
    and fast Fourier transformation, and Processing offers access to the most awesome
    3D and 2D graphic effects.


    The default iTunes music visualizer started out as a Processing script called
    "Magnetosphere", and was written by the artist Robert Hodgin, also known as Flight404.'
