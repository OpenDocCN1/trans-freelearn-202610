    # Objective Complete - Mini Debriefing


    We have just learned how to use Kinect''s skeleton tracking function. To get the
    coordinates of the limbs and joints, we added two new callback functions; one
    to be notified for when Kinect starts the calibration, and a second one when a
    user pose is detected.


    To enable the user of our sketch to see the current status of the recognition
    and calibration, we added a little HUD display in step 5. Our HUD display is very
    similar to the sketch we created in the previous task, but because we don''t want
    to use the entire window for displaying the depth map and user pixels, we need
    to convert the coordinates of our pixels and the indices of the pixel array.


    We use the coordinates of the skeleton tracker in our drawDancer() method to draw
    a stick figure in step 8. The jointPositionSkeleton() method of the SimpleOpenNI
    context is used to load the joint positions into a PVector variable, which we
    use to draw the limbs with the line() method.


    And finally, we made a simple dance floor for our stick figure to dance on in
    step 9 by drawing a gray rectangle. We used beginShape() and endShape() to define
    the shape, and added the coordinates of the corners using the vertex() method.


    # Classified Intel


    The SimpleOpenNI context doesn''t just provide the location of the joints, it
    also provides a direction vector. As we''re only drawing a stick figure in this
    project to keep things simple, we haven''t made use of this direction vector.
    But if you plan to control a more complicated figure like a rigged 3D model that
    you exported from a 3D modeling program like Blender, this information can be
    used to calculate the rotation and twist of the model''s vertices.


    You might also need this information if you need to test where an object got hit
    and in which direction it would fly away.


    # Dance! Dance! Dance!


    In this final task of the stick figure dance company project, we finally come
    to the "company" part. So far, we''ve created one lonely stick figure dancer that
    is moving in its own little virtual world. And this is going out of fashion. We
    will now add some more dancers by cloning the one we''ve already created; to prevent
    our dancers from being indistinguishable, we will add a little variation here
    and there.


    To make our code more readable, we will create a new class that holds our stick
    figure data and is responsible for drawing the body of one figure. This class
    is also used to store the color and size of each dancer.'
