  - '[PAGE 121]


    We also learned how to add a media file to our Twitter status update. In this
    sketch, the

    media file was the image of the smiley that we created.


    # Mission Accomplished


    Our mission was to implement a sketch that makes it easier to communicate the
    current

    emotional status of a user. We have accomplished this by creating a smiley that
    has

    various controllable facial parameters. In task 1, we implemented the drawing
    routine

    that generates our smiley, but changing the parameters meant changing a variable
    and

    running the sketch again.


    To tackle this problem, we added some GUI elements to our sketch in task 2 to
    simplify the

    interaction with our sketch for the user. We didn’t use any existing GUI libraries,
    but instead

    created the sliders from scratch by implementing the mouse event callback functions
    and

    drawing some rectangles.


    In task 3, we created the necessary code to authenticate our app with twitter.com
    and

    created a method that allows our app to post status updates for a Twitter user.
    We created

    a consumer key and a consumer secret key on the Twitter developer site and asked
    the user

    for permission to tweet using a request URL and pin code.


    And finally, we combined the two sketches in task 4 by adding a button to our
    GUI that

    tweets a status message on Twitter and adds the face the user has adjusted. We
    created

    an image containing the smiley by sparing the GUI elements and copying only a
    section of

    the sketch window to a new PImage object; we then saved this file and added it
    as a media

    object to the status update.


    # You Ready to go Gung HO? A Hotshot

    Challenge


    The Smilie-O-Mat is finished, but this doesn’t mean you have to stop here. Why
    don’t you try

    to take it to the next level and implement one of the following suggestions:


    +   - Parse the Twitter stream for the #SmilieOMat messages of people you follow

    +   - Make additional facial features changeable

    +   - Create a mobile version

    +   - Publish your smiley on other social networks'
