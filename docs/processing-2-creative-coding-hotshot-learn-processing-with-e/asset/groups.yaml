  mdcn: "\n\n- 3. 给你的纸箱上色。我做了一个白色，另一个绿色。\n- 4. 在纸箱晾干期间，如下图所示在头部上涂一些头发。我给 Romeo-Robot\
    \ 的头发涂成了黑色，给 Juliet-Robot 的头发涂成了棕色。\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_37_0.png)\n\
    \n- 5. 油漆干了之后，像下图所示用热胶将扬声器固定在纸箱上。确保不要将任何胶水沾到扬声器的膜片上。\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_37_1.png)\n\
    \n- 6. 现在使用记号笔为机器人画一张脸。你可以在下图中看到我机器人的脸：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_38_0.png)\n\
    \n- 7. 使用针将头部固定到机器人的身体上。\n- 8. 现在将你的机器人演员连接到声卡，并把 Juliet 放在一个阳台上（例如一个空鞋盒），让它们表演。\n\
    \n## 任务完成 - 简要汇报\n\n在此任务中，我们通过为机器人演员构建身体来完成它们。我们使用了一些纸箱，给它们上色，并通过将一对廉价扬声器粘进箱子中来添加它们。每个机器人都得到了一个涂了漆的发泡聚苯球制成的头。\n\
    \n如我之前在本任务介绍中所说，构建机器人没有对错之分。你可以随意构建大小。加上一些头发，给它们做个鼻子，给 Juliet 缝一件连衣裙，给 Romeo 画个小胡子，等等。\n\
    \n## 任务完成\n\n在此任务中，我们通过安装 ttslib 库为 Processing 添加了语音功能。我们学习了如何通过改变音调或在 Linux 上安装额外的\
    \ TTS 引擎来模拟多个扬声器。\n\n我们还为莎士比亚剧本定义了一种说话文本格式，以便更容易地解析，并创建了一个 `Drama` 线程来管理我们的文本行并控制我们的机器人。\n\
    \n我们完成了机器人演员，它们正迫不及待地等待在观众面前表演。所以，召集你的朋友和家人，为你的机器人搭建一个舞台。他们会喜欢的，相信我。好吧，至少你的机器人会喜欢，如下图所示：\n\
    \n![](img/5cb67baa7bc7778de360b14c00d1ab81_39_0.png)\n\n## 准备好大干一场了吗？高手挑战\n\n\
    既然你已经完成了机器人演员的构建，为什么不尝试将它们提升到下一个水平呢？\n\n- 让它们表演不同的戏剧。外面有很多著名的对话可以由你的机器人演员表演。\n\
    - 目前你的机器人演员是固定不动的。尝试添加一些舵机，并使用 Arduino 让它们移动头部。\n- 将一些网络摄像头连接到你的电脑，并使用 Processing\
    \ 从不同角度录制表演视频。\n- 让你的机器人演员与一位真实演员一起表演一出戏。\n- 让你的机器人从网络读取实时输入，例如 Twitter 源或新闻。\n\
    - 你的机器人不必长得像人类；让它们看起来像僵尸、外星人、动物等等。\n\n## 项目 2\n\n火柴人舞蹈团\n\n在项目 1《罗密欧与朱丽叶》中，我们学习了如何让\
    \ Processing 说话。在此项目中，我们将学习如何让它看和跳舞。我们将使用 Microsoft 的 Kinect 来实现视觉部分，并用一个跳舞的人来教一群火柴人如何跳舞。除非你找到其他人愿意带领你的火柴人，否则你自己得起来跳舞。\n\
    \n计算机视觉和 3D 扫描长期以来一直是非常专业且昂贵的硬件和软件的领域。随着 CPU 和显卡计算能力的不断提升，以及像 Kinect 这样的新型硬件控制器，计算机视觉项目已通过各种游戏控制器进入客厅，并对你我这样的日常程序员变得可及。\n\
    \n### 任务简报\n\n在此项目中，我们将学习如何将 Microsoft 的 Kinect 连接到电脑，并使用 Processing 中的深度成像和用户跟踪。我们将在第一个任务中快速安装\
    \ OpenNI 框架，因为这个库被 Processing 库 SimpleOpenNI 使用。然后，我们将学习如何使用 Kinect 红外摄像头的深度图像功能以及\
    \ Processing 中的玩家跟踪功能。\n\n接着，我们将使用所谓的骨骼跟踪器，不仅用于定位摄像头前面的用户，还包括头部、颈部和肘部。这些 3D 坐标将允许我们控制一个火柴人。\n\
    \n在当前任务的最后一个任务中，我们将添加一群额外的舞者，他们也将由玩家肢体的 3D 坐标控制。\n\n你可以在这里看到最终草图的屏幕截图：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_42_0.png)\n\
    \n### 为什么很酷？\n\nKinect 为与计算机交互带来了许多全新的可能性。它使玩家只需在计算机前移动即可控制计算机。这有多酷？而且作为一个不错的副作用，它让计算机用户动起来——这是计算机用户通常不擅长的事情。\n\
    \n> **免责声明**\n> \n> 如果你强行将肢体放入已被其他时空聚集体占据的地方，作者不承担由此产生的伤害和事故责任。所以，请确保在跳舞时你周围有足够的空间。\n\
    \n除了跟踪用户身体部位的位置外，Kinect 还为我们提供了周围玩家的深度图，以及一个位图，允许我们确定图像中哪些像素属于玩家，哪些不属于。\n\n###\
    \ 你的目标\n\n这个 Hotshot 项目分为以下四个任务：\n\n- 连接 Kinect\n- 让 Processing 看见\n- 制作舞者\n-\
    \ 跳舞！跳舞！跳舞！\n\n### 任务清单\n\n要完成此任务，你需要一台 Kinect 来连接到你的电脑。Kinect 通过 USB 端口连接，但它需要的电量比标准\
    \ USB 端口能提供的更多。因此，Kinect 配备了一个非标准的 USB 连接器和一个单独的电源连接器。如果你是随 Xbox 360 一起购买的 Kinect，你可能需要为它购买一个\
    \ USB 电源适配器；较新版本的 Xbox 360 提供了一个专用端口来直接连接 Kinect。你可以在电子产品商店或网上购买适配器。\n\n由于这个项目是关于跳舞的，你还需要一些音乐来跳舞。我们要创建的火柴人对音乐类型非常包容，所以请随意选择你喜欢的任何音乐——Donna\
    \ Summer、Zillertaler Schürzenjäger、Bobby Brown、Skrillex。如果你喜欢，你的火柴人也会喜欢。\n\n###\
    \ 连接 Kinect\n\n在此第一个任务中，我将指导你安装 OpenNI 框架和一个来自 PrimeSense（开发适用于 Microsoft 的 Kinect\
    \ 的公司）的库。我们将使用 OpenNI 示例程序来测试我们的安装。\n\n### 启动推进器\n\n- 1. 在撰写本文时，OpenNI 框架的最新版本是\
    \ 2.1 Beta，但我们将用于下一个任务的 Processing 框架需要 OpenNI 框架的 1.5.4 版本。在浏览器中打开网站 `http://www.openni.org/openni-sdk/openni-sdk-history-2/`，如下图所示，并选择适用于你平台的下载包：\n\
    \n![](img/5cb67baa7bc7778de360b14c00d1ab81_44_0.png)\n\n- 2. 如果你运行的是 Linux 或 Mac\
    \ OS X，打开一个终端窗口，进入下载文件的目录，并使用 `tar` 命令解包；确保以 root 身份运行 `install.sh` 脚本进行解包：\n\n\
    ```\ntar xvjf openni-bin-dev-linux-x86-v1.5.4.0.tar.bz2\ncd OpenNI-Bin-Dev-Linux-x86-v1.5.4.0\n\
    sudo ./install.sh\n```\n\n- 3. 在 Windows 上，直接运行你下载的 MSI 文件。\n- 4. 对 NiTE v1.5.2.21\
    \ 文件重复上述步骤，下载包并使用以下命令安装：\n\n```\ntar xvfj nite-bin-Linux-x86-v1.5.2.21.tar.bz2\n\
    cd NITE-Bin-Dev-Linux-x86-v1.5.2.21/\nsudo ./install.sh\n```\n\n- 5. 现在访问 https://github.com/avin2/SensorKinect/tree/unstable/Bin\
    \ 并下载 Kinect 的传感器包。你不需要从 http://openni.org 获取的传感器包；那是用于另一个传感器条的，无法与 Kinect 配合使用。\n\
