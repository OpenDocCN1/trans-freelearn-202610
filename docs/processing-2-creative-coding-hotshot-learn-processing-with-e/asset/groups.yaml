    # Project 2

    The Stick Figure Dance Company


    In Project 1, Romeo and Juliet we learned how to make Processing talk. In this
    project, we will learn how to make it see and dance. We will use Microsoft''s
    Kinect to implement the seeing part and a dancing human to teach a group of stick
    figures how to dance. Unless you find someone else who is willing to lead your
    stick figures, you will have to get up and dance yourself.


    Computer vision and 3D scanning have long been the domain of very specialized
    and expensive hardware and software. With the ever increasing computing power
    of CPUs and graphics cards, and new hardware controllers like Kinect, computer
