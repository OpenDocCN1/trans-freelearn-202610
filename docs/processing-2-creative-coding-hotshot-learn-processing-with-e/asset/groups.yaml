    ![](img/5cb67baa7bc7778de360b14c00d1ab81_20_0.png)


    # Why Is It Awesome?


    Since the 18th century, inventors have tried to build talking machines (with varying
    success). Talking toys swamped the market in the 1980s and 90s. In every decent
    Sci-Fi novel, computers and robots are capable of speaking. So how could building
    talking robots not be awesome? And what could be more appropriate to put these
    speaking capabilities to test than performing a Shakespeare play? So as you see,
    building actor robots is officially awesome, just in case your non-geek family
    members should ask.


