    \ libfreenect 的第二个开源框架，可用于访问Kinect。它缺乏OpenNI的用户跟踪功能，但支持电机控制。因此，如果你需要调整Kinect的倾斜度，因为它臭名昭著地会切断玩家的头部或脚部，你可以安装\
