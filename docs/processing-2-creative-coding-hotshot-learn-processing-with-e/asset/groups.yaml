    \n## 目标完成 - 简要总结\n\n我们刚刚学习了如何使用Processing访问Kinect提供的深度图像。从步骤 9 开始，我们使用了SimpleOpenNI框架的跟踪功能。我们添加了一个名为\
    \ onNewUser() 的回调函数，每次检测到用户时库都会调用它，还添加了一个名为 onLostUser() 的第二个函数，以便在用户不再在跟踪范围内时收到通知。\n\
