    drawButton();\n}\n```\n\n- 6. 为了使按钮可点击，我们需要处理鼠标事件；所以将以下代码添加到我们的 mousePressed()\
    \ 方法中：\n\n```\nvoid mousePressed() {\n  if ( mouseY > 310 && mouseY < 380\n  \
    \  && mouseX > width - 90 && mouseX < width - 20 ) {\n    bclick = true;\n   \
    \ return;\n  }\n\n  if ( mouseY > 310 && mouseY < 322 ) {\n    mclick = true;\n\
    \    mouth = constrain( int(\n      map( mouseX, 20, width - 110, 0, 1024 )),\
    \ 0, 1024 );\n  }\n\n  if ( mouseY > 340 && mouseY < 352 ) {\n    eclick = true;\n\
    \    eye = constrain( int(\n      map( mouseX, 20, width - 110, 0, 1024 )), 0,\
    \ 1024 );\n  }\n\n  if ( mouseY > 370 && mouseY < 382 ) {\n    cclick = true;\n\
    \    col = constrain( int(\n      map( mouseX, 20, width - 110, 0, 1024 )), 0,\
    \ 1024 );\n  }\n}\n```\n\n- 7. 当鼠标按钮再次释放时会生成点击事件。所以，将以下代码添加到 mouseReleased() 方法中：\n\
    \n```\nvoid mouseReleased() {\n  if (bclick) {\n    println( \"button clicked\"\
    \ );\n  }\n\n  bclick = false;\n  mclick = false;\n  eclick = false;\n  cclick\
    \ = false;\n}\n```\n\n- 8. 现在将 twitter4j-core.jar 文件和我们在上一个任务中为 Smilie-O-Mat 生成的\
    \ keys.txt 文件拖入。\n\n- 9. 我们需要导入 Twitter4J 库；我们还需要一个要发送的推文数组。将导入语句和变量定义添加到草图的开头。\n\
    \n```\nimport twitter4j.*;\n\nTwitter twitter;\nString[] tweets = {\n    \"I feel\
    \ so #SmilieOMat\",\n    \"I currently feel like this #SmilieOMat\",\n    \"This\
    \ is how I feel #SmilieOMat\"\n};\n```\n\n- 10. 添加一个 initTwitter() 方法，并从我们的 Twitter\
    \ 测试应用程序中复制初始化代码。\n\n```\nvoid initTwitter() {\nString[] keys = loadStrings( \"\
    keys.txt\" );\n\nif (keys.length <= 2) {\ntry {\ntwitter = TwitterFactory.getSingleton();\n\
    twitter.setOAuthConsumer( keys[0], keys[1] );\nRequestToken requestToken = twitter.getOAuthRequestToken();\n\
    AccessToken at = null;\nif ( System.getProperty(\"os.name\").toLowerCase().\n\
    indexOf(\"win\")>=0) {\nlink(requestToken.getAuthorizationURL());\n}\nelse {\n\
    open(requestToken.getAuthorizationURL());\n}\n\nString preset=\"\";\nString pin=javax.swing.JOptionPane.\n\
    showInputDialog(frame,\"Enter your pin\",preset);\nat = twitter.getOAuthAccessToken(requestToken,\
    \ pin);\n\nString[] newKeys = new String[4];\nnewKeys[0] = keys[0];\nnewKeys[1]\
    \ = keys[1];\nnewKeys[2] = at.getToken();\nnewKeys[3] = at.getTokenSecret();\n\
    \nsaveStrings( \"data/keys.txt\", newKeys  );\n\n} catch ( Exception e ) {\n \
    \   e.printStackTrace();\n}\n\n} else {\nConfigurationBuilder cb = new ConfigurationBuilder();\n\
    cb.setOAuthConsumerKey( keys[0] );\ncb.setOAuthConsumerSecret( keys[1] );\ncb.setOAuthAccessToken(\
    \ keys[2] );\ncb.setOAuthAccessTokenSecret( keys[3] );\n\ntwitter = new TwitterFactory(\
    \ cb.build() ).getInstance();\n}\n}\n```\n\n- 11. 现在我们从 setup() 方法中调用 initTwitter()\
    \ 方法。\n\n```\nvoid setup() {\nsize(300,390);\nsmooth();\nbackground(255);\ncolorMode(HSB);\n\
    textFont( createFont( \"Georgia\", 20 ) );\n\ninitTwitter();\n}\n```\n\n- 12.\
    \ 要推特当前的表情，我们添加一个名为 tweet() 的新方法。由于我们只想推特表情的图像而不想推特 GUI 元素，因此我们需要将想要的窗口部分复制到 PImage\
    \ 对象中，然后将其保存到文件。我们将使用此文件作为上传到 Twitter 的状态更新的媒体对象。\n\n```\nvoid tweet() {\n\nPImage\
    \ image = get( 0, 0, 300,300 );\nimage.save( \"smilie.png\" );\n\njava.io.File\
    \ f = new java.io.File( sketchPath( \"smilie.png\" ) );\nStatusUpdate status =\
    \ new StatusUpdate( tweets[int(random(\ntweets.length ))]);\nstatus.setMedia(f);\n\
    \ntry {\ntwitter.updateStatus(status);\n}\ncatch ( Exception e ) {\n    e.printStackTrace();\n\
    }\n}\n```\n\n- 13. 现在更改 mouseReleased() 方法，使其调用新的 tweet() 方法，而不是打印消息。\n\n```\n\
    void mouseReleased() {\nif ( bclick ) {\n    tweet();\n}\nbclick = false;\nmclick\
    \ = false;\neclick = false;\ncclick = false;\n}\n```\n\n- 14. 运行你的草图，创建一个微笑的快乐表情，并使用我们的\
    \ tweet 按钮推特它。在以下截图中，你可以看到我们的 Smilie-O-Mat 和生成的推文：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_120_0.png)\n\
    \n## 任务完成 - 小型简报\n\n在任务 4 中，我们合并了为本次任务编写的所有草图，并向我们的 Smilie-O-Mat 添加了 Twitter 功能。我们添加了一个按钮来触发推特，并添加了在任务\
    \ 3 中实现的密钥设置机制。\n\n我们还学习了如何将媒体文件添加到 Twitter 状态更新中。在这个草图中，媒体文件是我们创建的表情图像。\n\n##\
    \ 任务完成\n\n我们的任务是实现一个草图，使用户能更轻松地传达当前的情绪状态。我们通过创建一个具有多种可控面部参数的表情来实现这一点。在任务 1 中，我们实现了生成表情的绘制例程，但更改参数意味着更改变量并重新运行草图。\n\
    \n为了解决这个问题，我们在任务 2 中向草图添加了一些 GUI 元素，以简化用户与草图的交互。我们没有使用任何现有的 GUI 库，而是通过实现鼠标事件回调函数并绘制一些矩形从头开始创建了滑块。\n\
    \n在任务 3 中，我们创建了用于向 twitter.com 验证我们应用的必要代码，并创建了一个允许我们的应用为 Twitter 用户发布状态更新的方法。我们在\
    \ Twitter 开发者网站上创建了消费者密钥和消费者密钥密文，并通过请求 URL 和 PIN 码请求用户授权推特。\n\n最后，我们在任务 4 中合并了两个草图，在\
    \ GUI 中添加了一个按钮，该按钮在 Twitter 上推特一条状态消息并添加用户调整的表情。我们通过省略 GUI 元素并仅将草图窗口的一部分复制到新的\
    \ PImage 对象来创建包含表情的图像；然后我们保存了该文件，并将其作为媒体对象添加到状态更新中。\n\n## 准备好大干一场了吗？一个火热的挑战\n\n\
    Smilie-O-Mat 已完成，但这并不意味着你必须在此停止。为什么不尝试将其提升到一个新水平，并实现以下建议之一呢：\n\n- - 解析 Twitter\
    \ 流中你关注的人的 #SmilieOMat 消息\n- 使更多面部特征可更改\n- 创建移动版本\n- 在其他社交网络上发布你的表情\n\n"
