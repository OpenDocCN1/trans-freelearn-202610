    \ have an impact on your current state of emotion. To prevent our Smillie-O-Mat\
    \ from increasing the user's level of frustration or annoyance, our second task\
    \ for this mission is to make the facial parameters adjustable using the mouse\
    \ by adding three sliders below the smiley.\n\n# # Engage Thrusters\n\nLet's now\
    \ change our face:\n\n+   1. Open the Smillie-O-Mat sketch and change the size\
