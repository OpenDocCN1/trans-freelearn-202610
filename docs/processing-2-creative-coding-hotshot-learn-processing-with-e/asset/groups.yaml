    \ 20, 20);\n   }\n   ```\n\n6. To make the eyes more expressive, we are going\
    \ to add eyebrows. Add a new variable to control the angle of the eyebrows.\n\n\
    \   ```\n   int eye = 512;\n   int col = 150;\n   void setup() {\n   ```\n\n7.\
    \ Now, for the eyebrows, add two lines to the code for your face by adding the\
