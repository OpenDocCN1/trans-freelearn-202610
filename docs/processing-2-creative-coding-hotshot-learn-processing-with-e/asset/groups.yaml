    \  port = new Serial( this, \"/dev/ttyUSB0\", 9600 );\n  textFont( createFont(\
    \ \"Sans\", 64 ) );\n}\n```\n\n19. In our draw() method, we simply write out the\
    \ content of the string variable:\n\n```\nvoid draw() {\n  background( 255 );\n\
    \  fill(0);\n  text( str, 20, 100 );\n}\n```\n\n20. Now, we add a callback method\
    \ named serialEvent() that gets called every time the serial port detects an activity.\
    \ We are reading a string from the current buffer until we find a newline character,\
    \ and then we store it in our string variable:\n\n```\nvoid serialEvent( Serial\
    \ p ) {\n  String in = p.readStringUntil( '\\n' );\n  if ( in != null ) {\n  \
    \  str = in;\n  }\n}\n```\n\n21. Now, connect your Arduino and start your Processing\
    \ sketch. Turn the knob and watch the values change. Your sketch window should\
    \ look like the following screenshot:\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_129_0.png)\n\
    \n## Objective Complete - Mini Debriefing\n\nFor this first task of our current\
    \ mission, we created an Arduino sketch that runs on a microcontroller and reads\
    \ the value of a variable resistor. We created a simple circuit to hook up the\
    \ resistor to Arduino. Then, from step 1 to step 9, we made our sketch read the\
    \ value of the resistor and use this value to change the blinking speed of the\
    \ built-in LED.\nOnce this code is installed on the microcontroller, it runs independently\
    \ from any computer and uses the USB cable only as a power source. If you would\
    \ disconnect the USB cable and power the Arduino board using an AC adapter or\
    \ a battery, your sketch still would run.\n"
  mdcn: "\n\n## 第5项目 笑脸制造器控制器\n\n在 Xerox PARC 发明鼠标和图形用户界面是计算机历史上的一件里程碑事件。鼠标是一种与计算机交互的非常多功能的机制，它使得数据输入和控制程序流程出现了一整套全新的方法。但是，如果一种工具适用于非常广泛的问题范围，通常意味着它没有针对任何一种问题进行优化。有些程序使用专用控制器会更容易、更快速或更符合人体工学。在本任务中，我们将为在\
    \ _第4项目 笑脸制造器_ 中创建的笑脸制造器草图创建一个自定义控制器。\n\n### 任务简报\n\n我们当前的任务是为在上一个项目中编写的笑脸制造器草图构建一个自定义控制器。我们将使用\
    \ Arduino 板（一种使用 AVR 微控制器的低成本开发板）、一个按钮和一些可变电阻。我们将通过 USB 将 Arduino 板连接到计算机，并创建一个简单的协议来控制笑脸的面部参数。\n\
    \n### 这有什么了不起的？\n\n如前所述，鼠标是一个出色且多功能的输入设备，但有时它并不是最佳选择。使用压感平板绘图要有趣得多，使用方向盘和踏板玩赛车游戏更有趣，使用键盘控制器制作音乐也更容易，仅举几例。有时我们需要一个专用控制器，以更快速或更自然的方式与我们的数据或流程进行交互。\n\
    \n了解如何将滑块、按钮和旋钮与计算机接口，使我们能够完全按照我们需要和想要的方式优化工作空间和工作流程。\n\n## 你的高手目标\n\n我们当前的任务包含四个任务。我们将从一个简单的“你好，世界”电路开始，并不断扩展它，直到为我们的笑脸制造器草图制作出一个可用的控制器板，然后为其制作一个外壳。我们当前任务的任务列表如下：\n\
    \n- 连接你的 Arduino\n- 构建你的控制器\n- 改变你的表情\n- 把它放进盒子里\n\n## 任务检查清单\n\n要构建控制器，我们需要一个\
    \ Arduino 板、一个免焊面包板和一些电子元件，如下所示：\n\n- Arduino\n- 面包板\n- 导线\n- 一个按钮\n- 一个电阻（10\
    \ kOhm）\n- 三个可变电阻（100 kOhm）\n\n在本任务的最后一个任务中，我们将使用一个盒子和一些花哨的旋钮为控制器创建一个永久外壳。我还将提供本节中使用过的材料清单，但就像\
    \ _第1项目 罗密欧与朱丽叶_ 中的机器人一样，外壳很大程度上是个人品味的问题。\n\n## 连接你的 Arduino\n\n向你的 Arduino 打个招呼。我们当前任务的第一个任务是编写一个在\
    \ Arduino 上运行并读取可变电阻值的草图。由于这是一本关于 Processing 的书，我们将编写一个 Processing 草图，用于从 Arduino\
    \ 板接收电阻值并打印该值。\n\n## 准备起飞\n\n在这个任务中，我们将编写在 Arduino 上运行的代码，因此需要安装 Arduino IDE。你可以从\
    \ www.arduino.cc 下载它，并通过解压与操作系统匹配的包来安装。\n\n## 启动推进器\n\n让我们连接 Arduino：\n\n1. 为本任务需要做的第一件事是搭建一个小电路，因此请拿一个可变电阻，像下图所示一样将其连接到免焊面包板上：\n\
    \n![](img/5cb67baa7bc7778de360b14c00d1ab81_125_0.png)\n\n2. 现在将一根红色导线从 Arduino\
    \ 板的 5V 引脚连接到电阻的一外侧引线上。\n\n3. 电阻的中间引脚连接到 Arduino 板上标记为 ANALOG IN 0 的引脚。\n\n4.\
    \ 将一根黑色导线从 Arduino 的 Gnd 引脚连接到电阻的剩余引脚。你的连接应如下图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_126_0.png)\n\
    \n5. 现在将 Arduino 板连接到计算机的 USB 端口并启动 Arduino IDE。\n\n6. 确保通过检查 工具 | 串行端口 菜单选择了正确的串行端口，并通过检查\
    \ 工具 | 开发板 菜单选择了正确的 Arduino 板类型。\n\n7. 我们的第一个 Arduino 草图将使用 Arduino 的内置 LED。我们将使用刚刚添加的可变电阻来控制\
    \ LED 的闪烁速度。现在，我们将以下代码添加到 Arduino 草图并保存它：\n\n```\nint del = 5;\nboolean state\
    \ = true;\n```\n\n8. 单击验证图标验证代码，如果一切编译正常，单击上传按钮将代码安装到你的 Arduino 上。\n\n9. 旋转可变电阻的旋钮并检查\
    \ LED 的闪烁速度。\n\n10. 现在我们希望 Arduino 通过串行端口将可变电阻的值发送到计算机。将以下代码行添加到 Arduino 草图的 setup()\
    \ 方法中，以初始化串行端口并设置其速度，如下所示：\n\n```\nvoid setup() {\n  pinMode( 13, OUTPUT );\n\
    \  Serial.begin( 9600 );\n}\n```\n\n11. 在我们的 loop() 方法中，我们使用 Serial 对象的 println()\
    \ 方法打印电阻值。我们还从草图中删除了 LED 闪烁代码和延迟：\n\n```\nvoid loop() {\n  del = analogRead( 0\
    \ );\n  Serial.println( del );\n}\n```\n\n12. 单击验证和上传图标，在 Arduino 上编译并安装草图。\n\n\
    13. 现在我们需要打开串行监视器来查看 Arduino 发送的值。使用 工具 | 串行监视器 菜单查看串行监视器，旋转电阻的旋钮，然后观察控制台上的值的变化。\n\
    \n14. 目前，每次 Arduino 运行主循环时都会发送电阻值，但大多数时候值没有改变。因此，让我们仅在值发生变化时发送值，方法是存储我们发送的上一个值并将其与当前值进行比较。\n\
    \n```\nint del = 5;\nint lastDel = 0;\n\nvoid loop() {\n  del = analogRead( 0\
    \ );\n  if (abs( del - lastDel ) > 10 ) {\n    Serial.println( del );\n    lastDel\
    \ = del;\n  }\n}\n```\n\n15. 将代码编译并上传到 Arduino 并打开串行监视器。如果你现在旋转旋钮，你会看到改变后的值，但如果保持原样，则不会发送任何值。\n\
    \n16. 现在我们完成了第一个任务的 Arduino 部分，让我们切换到它的 Processing 部分。打开 Processing，创建一个新草图，并添加\
    \ setup() 和 draw() 方法：\n\n```\nvoid setup() {\n}\n```\n\n```\nvoid draw() {\n\
    }\n```\n\n17. 为了与 Arduino 通信，我们需要导入串行库，这使我们能够在 Processing 草图中使用串行端口。因此，使用 草图 |\
    \ 导入库 ... | 串行 菜单导入库。\n\n我们创建串行端口对象的实例，并定义一个字符串，用于存储从串行端口读取的文本行：\n\n```\nimport\
    \ processing.serial.*;\n\nSerial port;\nString str = \"\";\n```\n\n18. 然后，我们将以下代码添加到\
    \ setup() 方法中以初始化串行端口并定义字体。请确保使用与第 6 步在 Arduino IDE 中使用的串行板相同的名称。在此情况下，它是 /dev/ttyUSB0。\n\
    \n```\nvoid setup() {\n  size( 300,300 );\n  port = new Serial( this, \"/dev/ttyUSB0\"\
    , 9600 );\n  textFont( createFont( \"Sans\", 64 ) );\n}\n```\n\n19. 在 draw() 方法中，我们只需输出字符串变量的内容：\n\
    \n```\nvoid draw() {\n  background( 255 );\n  fill(0);\n  text( str, 20, 100 );\n\
    }\n```\n\n20. 现在，我们添加一个名为 serialEvent() 的回调方法，每次串行端口检测到活动时都会调用它。我们从当前缓冲区读取字符串，直到找到换行符，然后将其存储在我们的字符串变量中：\n\
    \n```\nvoid serialEvent( Serial p ) {\n  String in = p.readStringUntil( '\\n'\
    \ );\n  if ( in != null ) {\n    str = in;\n  }\n}\n```\n\n21. 现在，连接你的 Arduino\
    \ 并启动你的 Processing 草图。旋转旋钮并观察值的变化。你的草图窗口应如下屏幕截图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_129_0.png)\n\
    \n## 目标完成 - 简要总结\n\n在本任务的第一个任务中，我们创建了一个在微控制器上运行并读取可变电阻值的 Arduino 草图。我们创建了一个简单电路来将电阻连接到\
    \ Arduino。然后，从第 1 步到第 9 步，我们让草图读取电阻值，并使用该值来改变内置 LED 的闪烁速度。\n一旦该代码安装到微控制器上，它将独立于任何计算机运行，并仅将\
    \ USB 电缆用作电源。如果你断开 USB 电缆并使用交流适配器或电池为 Arduino 板供电，你的草图仍将运行。\n\n"
