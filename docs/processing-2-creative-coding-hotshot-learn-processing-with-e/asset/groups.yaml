    \ 0, width-40 ), 370, 10, 12 );\n}\n```\n\n- 5. 现在我们从 draw() 方法中调用 drawSliders()\
    \ 方法。\n\n```\nvoid draw() {\n    background(255);\n    drawSliders();\n    color\
