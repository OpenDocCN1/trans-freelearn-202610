    # Prepare for Lift Off


    Our sketch needs to know which line of the script is read by which robot. So we
    need to convert the Shakespeare script into a more machine-readable format. For
    every line of text, we need to know which speaker should read the line. So we
    take the script and add the letter J and a separation character that is used nowhere
    else in the script, in front of every line our Juliet-Robot should speak, and
    we add R and the separation letter for every line our Romeo-Robot should speak.
    After all these steps, our text file looks something like the following:


    ```

    R# Lady, by yonder blessed moon I vow,

    R# That tips with silver all these fruit-tree tops --


    J# O, swear not by the moon, the inconstant moon,

    J# That monthly changes in her circled orb,

    J# Lest that thy love prove likewise variable.


    R# What shall I swear by?


    J# Do not swear at all.

    J# Or if thou wilt, swear by thy gracious self,

    J# Which is the god of my idolatry,

    J# And I''ll believe thee.

    ```


    I have already converted the script of the play into this format, and it can be
    downloaded from the book''s support page at http://www.packtpub.com/support.


