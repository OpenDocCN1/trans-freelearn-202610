  - '[PAGE 97]


    # Project 4

    Smilie-O-Mat


    When we communicate over a text-based medium like SMS, Twitter, or chat, it''s
    somewhat hard to convey how we are currently feeling. It would be much easier
    and accurate to use pictures instead of a 140-character description. Humans have
    a lifelong training in reading emotions on faces, so our next mission is to create
    a Smilie-O-Mat. This little program allows us to adjust certain facial parameters
    of a smiley and then post the image on Twitter.


    # Mission Briefing


    Our mission is to create the Smile-O-Mat; a program that allows the user to create
    a smiley face that reflects his or her emotional state and posts it on Twitter.
    We will make three parameters adjustable: the angle of the eyebrows, the color
    of the face, and the position of the mouth (which is changeable, from frowning
    to smiling and vice-versa).


    To post the image on Twitter, we are going to use a Java library named Twitter4J;
    we will also learn how to authorize a Processing sketch to change the status of
    a Twitter user using the OAuth authentication framework.


    # Why Is It Awesome?


    You''re feeling greenish-yellow today, with a little smile and neutral eyebrows.
    Don''t know how to express that in 140 characters? No problem; adjust the face
    of the Smilie-O-Mat and tweet it. Life can be so easy when you have the right
    tools.


    Besides that, accessing the Twitter data stream and then posting to it is a very
    rich data source for visualization projects or interactive Processing sketches.'
