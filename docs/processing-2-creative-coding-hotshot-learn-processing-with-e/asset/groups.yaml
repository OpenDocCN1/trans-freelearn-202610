    # # Project 5 The Smilie-O-Mat Controller


    The invention of mouse and graphical user interfaces at Xerox PARC was a groundbreaking
    event in computer history. The mouse is a very versatile mechanism of interacting
    with a computer, and it enabled a whole range of new methods for data entry and
    controlling the program flow. But if a tool is usable on a very broad range of
    problems, it generally means that it isn’t optimized for any of them. Some programs
    are easier, faster, or more ergonomically usable with a specialized controller.
    In this mission, we are going to create a customized controller for our Smilie-O-Mat
    sketch, which we created in _Project 4, Smilie-O-Mat_.


    # ## Mission Briefing


    Our current mission is to build a custom controller for the Smilie-O-Mat sketch
    we wrote in the previous project. We will make use of an Arduino board (an inexpensive
    board using an AVR microcontroller), a button, and some variable resistors. We
    will connect the Arduino board to our computer through USB and create a simple
    protocol for controlling the facial parameters of our smiley.


    # ### Why Is It Awesome?


    As already mentioned in the introduction, the mouse is a great and versatile input
    device, but sometimes it’s not the best one available. Drawing an image is far
    more fun with a pressure-sensitive tablet, playing racing games is more fun with
    a steering wheel and some pedals, and making music is far easier with a keyboard
    controller, just to name a few examples. Sometimes we need a specialized controller
    to interact in a faster or more natural way with our data or our processes.'
