    \ Triangle( PVector a, PVector b, PVector c, PVector n ) {\n    this.a = a;\n\
    \    this.b = b;\n    this.c = c;\n    this.n = n;\n  }\n}\n```\n\n- 2. 现在我们添加另一个选项卡并创建一个名为\
    \ TriangleSoup 的类。该类存储三角形，并以 STL 格式将它们写入文件。\n\n```\nimport java.io.FileOutputStream;\n\
    import java.nio.ByteBuffer;\nimport java.nio.ByteOrder;\nimport java.util.Arrays;\n\
    import java.io.FileOutputStream;\nimport java.io.IOException;\nimport java.util.List;\n\
    \npublic class TriangleSoup {\n\n\tList<Triangle> triangles = new ArrayList<Triangle>();\n\
    \tfloat scale = 1;\n\n\tvoid scale( float scale ) {\n\t\tthis.scale = scale;\n\
    \t}\n\n\tvoid add( PVector a, PVector b, PVector c, PVector n ) {\n\t\ttriangles.add(\
    \ new Triangle( a, b, c, n ) );\n\t}\n}\n```\n\n- 3. 当我们的网格的所有三角形对象都已添加到 Triangle\
    \ Soup 后，我们需要将其保存为 STL 文件。向我们的类添加以下方法：\n\n```\nvoid save( String filename ) {\n\
    try {\n\tbyte[] header = new byte[80];\n\tbyte[] count = new byte[4];\n\tbyte[]\
    \ tri = new byte[50];\n\n\tFileOutputStream out = new FileOutputStream( filename\
    \ );\n\tByteBuffer buffer = ByteBuffer.allocate( 80 );\n\tbuffer.order( ByteOrder.LITTLE_ENDIAN\
    \ );\n\n\tArrays.fill(header, 0, 80, (byte)0);\n\tout.write( header, 0, 80 );\n\
    \tbuffer.putInt( triangles.size() );\n\tbuffer.rewind();\n\tbuffer.get( count,\
    \ 0, 4 );\n\tout.write( count, 0, 4 );\n\n\tfor( int i=0; i<triangles.size();\
    \ i++) {\n\t\tbuffer.rewind();\n\t\tbuffer.putFloat( triangles.get(i).n.x * scale\
    \ );\n\t\tbuffer.putFloat( triangles.get(i).n.z * scale );\n\t\tbuffer.putFloat(\
    \ triangles.get(i).n.y * scale );\n\t\tbuffer.putFloat( triangles.get(i).a.x *\
    \ scale );\n\t\tbuffer.putFloat( triangles.get(i).a.z * scale );\n\t\tbuffer.putFloat(\
    \ triangles.get(i).a.y * scale );\n\t\tbuffer.putFloat( triangles.get(i).b.x *\
    \ scale );\n\t\tbuffer.putFloat( triangles.get(i).b.z * scale );\n\t\tbuffer.putFloat(\
    \ triangles.get(i).b.y * scale );\n\t\tbuffer.putFloat( triangles.get(i).c.x *\
    \ scale );\n\t\tbuffer.putFloat( triangles.get(i).c.z * scale );\n\t\tbuffer.putFloat(\
    \ triangles.get(i).c.y * scale );\n\t\tbuffer.putShort( (short)0 );\n\t\tbuffer.rewind();\n\
    \t\tbuffer.get( tri, 0, 50 );\n\t\tout.write( tri, 0, 50 );\n\t}\n\tout.flush();\n\
    \tout.close();\n} catch ( IOException ioe ) {\n\tioe.printStackTrace();\n}\n}\n\
    ```\n\n- 4. 回到主选项卡，我们需要在菜单中添加一个新按钮，该按钮打开文件选择框并允许用户输入导出文件的文件名。因此，我们现在将向 setupGUI()\
    \ 方法添加一个新按钮定义。\n\n```\nvoid setupGUI() {\n    Button exportButton = cp5.addButton(\
    \ \"export\", 1, 10, 165, 120, 15 );\n    exportButton.setLabel( \"export\" );\n\
    \    exportButton.moveTo( box );\n}\n```\n\n- 5. 现在为导出按钮添加回调函数，并使用 `selectOutput()`\
    \ 方法创建文件对话框。第一个参数是对话框标题，第二个参数是当用户选择文件名并单击确定时被激活的回调方法名称。\n\n```\nvoid export()\
    \ {\n    selectOutput( \"Export to STL\", \"exportCallback\" );\n}\n```\n\n- 6.\
    \ 对话框的回调方法将用户选择的文件名作为字符串参数获取。如果用户取消对话框，文件名字符串将设置为 null。如果获得有效文件名，我们将其转换为绝对路径并创建\
    \ TriangleSoup 对象。为了使我们的对象可打印，我们需要确保它是封闭体积，而不是单面墙。我们添加 `exportOuter()` 和 `exportInner()`\
    \ 方法来创建墙壁，以及 `exportBottom()` 和 `exportTop()` 方法来关闭我们的对象。\n\n```\nvoid exportCallback(File\
    \ exportFile) {\n    if ( exportFile != null ) {\n    String filename = exportFile.getAbsolutePath();\n\
    \    TriangleSoup export = new TriangleSoup();\n    export.scale( .5 );\n\n  \
    \  exportOuter( export );\n    exportInner( export );\n    exportBottom( export\
    \ );\n    exportTop( export );\n    export.save(filename);\n    }\n}\n```\n\n\
    - 7. 现在我们需要为每个网格添加导出函数。`exportOuter()` 方法为外墙创建三角形，然后计算三角形的法线向量。\n\n```\nvoid exportOuter(\
    \ TriangleSoup export ) {\n    for ( int h = 1; h < 20; h++ ) {\n    for ( int\
    \ a = 0; a<72; a++ ) {\n    int ab = (a+1) % 72;\n    PVector p1 = new PVector(\
    \ vertx[h][a], 95-h*5.0, verty[h][a] );\n\n    PVector p2 = new PVector( vertx[h-1][a],\
    \ 95-(h-1)*5.0, verty[h-1][a] );\n    PVector p3 = new PVector( vertx[h][ab],\
    \ 95-h*5.0, verty[h][ab] );\n    PVector p4 = new PVector( vertx[h-1][ab], 95-(h-1)*5.0,\
    \ verty[h-1][ab] );\n\n    PVector n1 = new PVector( - (p1.x+p2.x+p3.x)/3, 0,\
    \ - (p1.y+p2.y+y+p3.y)/3 );\n    n1.normalize();\n    PVector n2 = new PVector(\
    \ - (p2.x+p3.x+p4.x)/3, 0, - (p2.y+p3.y+y+p4.y)/3 );\n    n2.normalize();\n  \
    \  export.add( p1, p2, p3, n1 );\n    export.add( p3, p2, p4, n2 );\n    }\n \
    \   }\n}\n```\n\n- 8. 我们的 exportInner() 方法与 exportOuter() 方法类似，但法线指向与 exportOuter()\
    \ 方法中使用的相反方向，并且半径减小了 0.8。\n\n```\nvoid exportInner( TriangleSoup export ) {\n\
    for ( int h = 1; h < 19; h++ ) {\nfor ( int a = 0; a<72; a++ ) {\nint ab = (a+1)\
    \ % 72;\nPVector p1 = new PVector( vertx[h][a] * 0.8, 95-h*5.0, verty[h][a] *\
    \ 0.8 );\nPVector p2 = new PVector( vertx[h-1][a] * 0.8, 95 - (h-1)*5.0, verty[h-1][a]\
    \ * 0.8 );\nPVector p3 = new PVector( vertx[h][ab] * 0.8, 95-h*5.0, verty[h][ab]\
    \ * 0.8 );\nPVector p4 = new PVector( vertx[h-1][ab] * 0.8, 95 - (h-1)*5.0, verty[h-1][ab]\
    \ * 0.8 );\nPVector n1 = new PVector( - (p1.x+p2.x+p3.x)/3, 0, - (p1.y+p2.y+y+p3.y)/3\
    \ );\nn1.normalize();\nPVector n2 = new PVector( - (p2.x+p3.x+p4.x)/3, 0, - (p2.y+p3.y+y+p4.y)/3\
    \ );\nn2.normalize();\nexport.add( p1, p2, p3, n1 );\nexport.add( p3, p2, p4,\
    \ n2 );\n}\n}\n}\n```\n\n- 9. exportBottom() 方法创建两个三角形扇面以关闭网格底部。我们需要一个用于外墙的底部网格，以及一个略小且位于其上方的用于内墙的网格。\n\
    \n```\nvoid exportBottom(TriangleSoup export) {\nPVector n = new PVector( 0, -1,\
    \ 0 );\nPVector p1 = new PVector( 0, 5, 0 );\nfor ( int a = 0; a < 72; a++ ) {\n\
    int ab = (a+1) % 72;\nPVector p2 = new PVector( vertx[18][a]*0.8, 5, verty[18][a]*0.8\
    \ );\nPVector p3 = new PVector( vertx[18][ab]*0.8, 5, verty[18][ab]*0.8 );\nexport.add(\
    \ p1, p2, p3, n );\n}\nn = new PVector( 0, 1, 0 );\np1 = new PVector( 0, 0, 0\
    \ );\nfor ( int a = 0; a < 72; a++ ) {\nint ab = (a+1) % 72;\nPVector p2 = new\
    \ PVector( vertx[19][a], 0, verty[19][a] );\nPVector p3 = new PVector( vertx[19][ab],\
    \ 0, verty[19][ab] );\nexport.add( p1, p2, p3, n );\n}\n}\n```\n\n- 10. 最后，我们需要一个\
    \ exportTop() 方法，它创建连接内网格和外网格的顶部环。\n\n```\nvoid exportTop(TriangleSoup export)\
    \ {\nPVector n = new PVector( 0, 1, 0 );\nfor ( int a = 0; a < 72; a++ ) {\nint\
    \ ab = (a+1) % 72;\nPVector p1 = new PVector( vertx[0][a], 95, verty[0][a] );\n\
    PVector p2 = new PVector( vertx[0][a]*0.8, 95, verty[0][a]*0.8 );\nPVector p3\
    \ = new PVector( vertx[0][ab], 95, verty[0][ab] );\nPVector p4 = new PVector(\
    \ vertx[0][ab]*0.8, 95, verty[0][ab]*0.8 );\nexport.add( p1, p2, p3, n );\nexport.add(\
    \ p3, p2, p4, n );\n}\n}\n```\n\n"
