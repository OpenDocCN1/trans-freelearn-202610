    \ The curve definition starts with the beginShape() method and ends with the endShape()\
    \ method. Between these commands, we will define the control points of the curve\
    \ using the curveVertex() command.\n\n   ```\n   void draw() {\n     background(255);\n\
    \     strokeWeight(3);\n\n     color c = color(map(col, 0, 1024, 0, 255), 255,\
    \ 255);\n     fill(c);\n     ellipse(150,150,250,250);\n\n     fill(255);\n  \
