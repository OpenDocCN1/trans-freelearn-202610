  mdcn: "\n\n## 任务完成\n\n在本项目中，我们学习了如何使用 Minim 框架播放 MP3 文件以及如何访问采样数据。我们使用采样数据为当前播放的声音生成可视化效果。我们使用\
    \ Minim 框架的 fft 类生成均衡器可视化效果。\n\n在第二个任务中，我们编写了五个类来更改由 8 x 8 方块网格组成的图案。我们使用了一个定时器线程来触发其中三个类的变化。我们还添加了一个可视化器，它使用采样数据和\
    \ fft 类来生成该图案。\n\n在第三个任务中，我们更改了 draw() 方法，并使用第二个任务中生成的视觉效果作为纹理。我们还添加了播放列表功能。播放列表控制歌曲播放顺序，也控制我们的可视化器显示顺序及其显示时长。\n\
    \n在本次任务的最终任务中，我们将可视化器纹理和播放列表类合并到来自项目 2《火柴人舞蹈公司》(The Stick Figure Dance Company)\
    \ 的火柴人舞蹈公司中。我们还向 draw() 方法添加了一个新功能，以显示从 MP3 元数据中检索到的歌曲标题和艺术家。\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_94_0.png)\n\
    \n## 你准备好全力以赴了吗？热血挑战\n\n在这次任务中，我们创建了一些非常酷的声音可视化效果，并用一个极佳的闪烁迪斯科舞池取代了上次任务中乏味的灰色舞池。但即使是非常棒的迪斯科舞池也可以变得更好！你不妨尝试实现以下其中一个想法，将其提升到新的水平：\n\
    \n- 添加一些灯光效果、迪斯科球或频闪灯\n- 使用粒子添加一些烟花效果\n- 将红色方块更改为变色方块\n- 连接一些受 DMX 控制的灯光，并使虚拟舞池也能控制你的真实舞池\n\
    - 为播放列表添加交叉淡入淡出\n\n## 项目 4\n\n### 笑脸制造机（Smilie-O-Mat）\n\n当我们通过 SMS、Twitter 或聊天等基于文本的媒介进行交流时，很难准确传达当前的感受。使用图片代替\
    \ 140 个字符的描述会容易且准确得多。人类终生都在训练读取面部表情中的情感，因此我们的下一个任务是创建一个笑脸制造机。这个小程序允许我们调整笑脸的某些面部参数，然后将图片发布到\
    \ Twitter。\n\n## 任务简报\n\n我们的任务是创建 Smile-O-Mat；一个允许用户创建反映其情绪状态的笑脸并将其发布到 Twitter\
    \ 的程序。我们将使三个参数可调节：眉毛的角度、脸部的颜色以及嘴巴的位置（可变，从皱眉到微笑，反之亦然）。\n\n要在 Twitter 上发布图片，我们将使用名为\
    \ Twitter4J 的 Java 库；我们还将学习如何使用 OAuth 身份验证框架授权 Processing 草图来更改 Twitter 用户的状态。\n\
    \n## 这有什么酷的？\n\n你今天感觉有点偏绿偏黄，带着一丝微笑和中性的眉毛。不知道如何用 140 个字符表达这种感觉？没问题；调整笑脸制造机的脸然后发推。当你拥有合适的工具时，生活可以如此轻松。\n\
    \n除此之外，访问 Twitter 数据流并将其发布出去，是可视化项目或交互式 Processing 草图非常丰富的数据源。\n\n## 你的高手目标\n\n\
    要完成这次任务，我们需要完成四个任务。它们是：\n\n- 绘制你的脸\n- 让我来改变它\n- Hello Twitter\n- 发推表达你的心情\n\n\
    ### 任务清单\n\n对于这次任务，我们不需要任何额外的硬件；但是，在第 3 和第 4 任务中，我们将向 Twitter 发布状态更新，因此你需要一个可用的\
    \ Internet 连接和一个 Twitter 账号来完成这两项任务。\n\n### 绘制你的脸\n\n我们当前任务的第一个任务是使用 Processing\
    \ 绘制一张脸。我们将使用椭圆和曲线等绘图原语，并学习如何更改填充和描边样式。我们希望在下一个任务中使三个参数可更改，因此我们为这些参数定义变量，并使用它们的值来绘制我们的脸。\n\
    \n### 启动推进器\n\n让我们来画一张脸：\n\n1. 打开一个新草图，添加 `setup()` 和 `draw()` 方法：\n\n   ```\n\
    \   void setup() {\n   }\n   void draw() {\n   }\n   ```\n\n2. 在 `setup()` 方法中，我们将窗口大小设置为\
    \ 300 x 300 像素并打开线条平滑。我们还将颜色模式更改为 HSB（代表色调、饱和度和亮度），而不是 RGB，以便更轻松地更改脸部颜色。\n\n \
    \  ```\n   void setup() {\n     size(300, 300);\n     smooth();\n     colorMode(HSB);\n\
    \   }\n   ```\n\n3. 我们将绘制的第一个东西是一个彩色圆圈。为了使颜色可更改，我们将在草图中添加一个名为 col 的整数变量，位于 setup()\
    \ 方法上方。\n\n   ```\n   int col = 150;\n\n   void setup() {\n   ```\n\n4. 我们的控制变量\
    \ col 将存储 0 到 1023 之间的值，以控制笑脸的色相值。color() 命令期望一个 0 到 255 之间的值，因此我们需要使用 map 命令重新映射该值。\n\
    \n   ```\n   void draw() {\n     background(255);\n     strokeWeight(3);\n\n \
    \    color c = color(map(col, 0, 1024, 0, 255), 255, 255);\n     fill(c);\n  \
    \   ellipse(150,150,250,250);\n   }\n   ```\n\n5. 要创建眼睛，我们将添加两个白色圆圈和两个较小的黑色圆圈作为瞳孔。\n\
    \n   ```\n   void draw() {\n     background(255);\n     strokeWeight(3);\n\n \
    \    color c = color(map(col, 0, 1024, 0, 255), 255, 255);\n     fill(c);\n  \
    \   ellipse(150,150,250,250);\n\n     fill(255);\n     ellipse( 120, 140, 60,\
    \ 60);\n     ellipse( 180, 140, 60, 60);\n     fill(0);\n     ellipse( 125, 150,\
    \ 20, 20);\n     ellipse( 175, 150, 20, 20);\n   }\n   ```\n\n6. 为了使眼睛更有表现力，我们将添加眉毛。添加一个新变量来控制眉毛的角度。\n\
    \n   ```\n   int eye = 512;\n   int col = 150;\n   void setup() {\n   ```\n\n\
    7. 现在，对于眉毛，通过将以下代码添加到 draw() 方法中，为你的脸部代码添加两条线：\n\n   ```\n   void draw() {\n \
    \    background(255);\n     strokeWeight(3);\n\n     color c = color(map(col,\
    \ 0, 1024, 0, 255), 255, 255);\n     fill(c);\n     ellipse(150,150,250,250);\n\
    \n     fill(255);\n     ellipse( 120, 140, 60, 60);\n     ellipse( 180, 140, 60,\
    \ 60);\n     fill(0);\n     ellipse( 125, 150, 20, 20);\n     ellipse( 175, 150,\
    \ 20, 20);\n\n     line( 100, 100 + map( eye, 0, 1024, -10, 10 ),\n          \
    \ 140, 100 - map( eye, 0, 1024, -10, 10 ) );\n     line( 160, 100 - map( eye,\
    \ 0, 1024, -10, 10 ),\n           200, 100 + map( eye, 0, 1024, -10, 10 ) );\n\
    \   }\n   ```\n\n8. 我们将添加第三个控制变量，将嘴巴从微笑改为皱眉。\n\n   ```\n   int mouth = 1024;\n\
    \   int eye = 512;\n   int col = 150;\n\n   void setup() {\n   ```\n\n9. 要绘制嘴巴，我们将使用曲线形状。曲线定义以\
    \ beginShape() 方法开始，以 endShape() 方法结束。在这些命令之间，我们将使用 curveVertex() 命令定义曲线的控制点。\n\
    \n   ```\n   void draw() {\n     background(255);\n     strokeWeight(3);\n\n \
    \    color c = color(map(col, 0, 1024, 0, 255), 255, 255);\n     fill(c);\n  \
    \   ellipse(150,150,250,250);\n\n     fill(255);\n     ellipse( 120, 140, 60,\
    \ 60);\n     ellipse( 180, 140, 60, 60);\n     fill(0);\n     ellipse( 125, 150,\
    \ 20, 20);\n     ellipse( 175, 150, 20, 20);\n\n     line( 100, 100 + map( eye,\
    \ 0, 1024, -10, 10 ), 140,\n           100 - map( eye, 0, 1024, -10, 10 ) );\n\
    \     line( 160, 100 - map( eye, 0, 1024, -10, 10 ),\n           200, 100 + map(\
    \ eye, 0, 1024, -10, 10 ) );\n\n     noFill();\n     beginShape();\n     curveVertex(100,\
    \ 200);\n     curveVertex(100, 200);\n     curveVertex(150, 180 + map( mouth,\
    \ 0, 1024, 0, 50));\n     curveVertex(200, 200);\n     curveVertex(200, 200);\n\
    \     endShape();\n   }\n   ```\n\n10. 现在运行草图并更改我们的控制变量值，以查看它们如何影响生成的脸。我们迄今在示例中使用的参数会产生你在以下截图中看到的笑脸：\n\
    \n    ![](img/5cb67baa7bc7778de360b14c00d1ab81_101_0.png)\n\n"
