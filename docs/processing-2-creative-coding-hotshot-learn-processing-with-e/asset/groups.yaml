  - "[PAGE 244]\n\nTo make our object more interesting, we added four additional control\
    \ parameters to our GUI and extended the getR() function to take the height of\
    \ the cylinder into account for calculating the radius.\n\n# Exporting the object\n\
    \nWe have created a 3D object in our previous task that can be changed using some\
    \ sliders, but to print the object on a 3D printer, we have to save the object\
    \ in a format that a 3D printer understands. Our current task is to add an export\
    \ function that saves the object to an STL (STereo Lithography) file. This file\
    \ format was originally invented to serve as an input format for Stereo Lithograph\
    \ machines (hence the name), but nearly every currently available 3D software\
    \ can import these files. The file stores the coordinates of the triangles and\
    \ a normal vector for each of these triangles. This is why the format has the\
    \ nickname Triangle Soup.\n\nAn STL file has an 80-byte header that is ignored\
