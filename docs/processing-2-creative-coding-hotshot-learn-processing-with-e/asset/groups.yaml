    # # Objective Complete - Mini Debriefing


    The first task of our current mission was to read a web server''s logfile and
    extract the IP address and the timestamp of every log entry. We created a class
    that stores our log row information. We then read the logfile to an array of strings
    using the `loadStrings()` method. In step 6, we used a regular expression that
    matches and extracts the parts of our logfile we are interested in and returns
    them as strings.


    There are an incredible number of ways a date could be represented as a string,
    since every corner of the world seems to be in urgent need to use a very special
    one. To make it easier for our sketch to work with the timestamps, we convert
    them to the Unix timestamp format, which stores the seconds that have elapsed
    since 1970-01-01.


    In our `draw()` method, we take the timestamps we extracted from the logfile and
    visualize them on a timeline.


    # # Geocoding IP addresses


    So far we have concentrated on the timestamps of our logfile, so this part of
    our mission is to convert the IP addresses into a pair of coordinates that we
    can use for our geo-visualization. We will download and install the hostIP database—a
    free database that stores the geographic coordinates and the name of the city
    this IP address is coming from. The hostIP database is created by volunteers,
    so while you''re there, add your own IP address and city to improve the service.
    The accuracy we get from this database is on city level, so you shouldn''t design
    a pizza delivery service based on the geo-coordinates you get, but it''s more
    than sufficient for most visualization projects.


    We will keep the hostIP database in memory for geocoding our IP addresses and
    converting the IP addresses we extracted in the previous task.


