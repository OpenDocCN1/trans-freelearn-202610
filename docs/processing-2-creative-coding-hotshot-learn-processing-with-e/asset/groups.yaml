    \n- 4. 现在我们需要告诉 Processing 在哪里可以找到 Android SDK。打开我们的 Processing 游戏，并在右侧切换至 Android\
    \ 模式。初次执行此操作时，Processing 会询问 Android SDK 的位置，因此请将其指向步骤 2 中解压的文件夹。有关详细安装说明，可在 Processing\
    \ Wiki 上找到：http://wiki.processing.org/w/Android。\n\n- 5. 我们现在将在模拟器中运行草图。点击 **草图\
    \ | 在模拟器中运行** 菜单项。Processing 现在会将草图编译为 Android 应用，为 Android 模拟器创建虚拟设备并启动它。由于启动\
    \ Android 模拟器可能需要一段时间，尤其是首次运行时，您可能会遇到超时错误。这种情况下，只需重复此步骤。稍等片刻，您应该会看到我们的草图在模拟器窗口中运行，如下所示：\n\
    \n![](img/5cb67baa7bc7778de360b14c00d1ab81_170_0.png)\n\n- 6. 在移动设备上，应用程序通常以全屏模式运行，因为没有窗口系统。我们现在将告诉草图使用整个屏幕。我们还通过使用\
