    \            vertex( R * cosj * sini, R * -cosi, R * sinj * sini );\n        }\n\
    \        endShape();\n    }\n}\n```\n\n- 12. 运行草图，加载数据库并对所有 IP 地址进行编码后，地图如下面的截图所示：\n\
    \n![](img/5cb67baa7bc7778de360b14c00d1ab81_226_0.png)\n\n## 任务完成 - 小型简报\n\n对于当前任务的最后一项，我们结合了“红点狂热”和来自项目\
    \ 7《霓虹地球》的霓虹地球。我们将纹理和 GLSL 滤镜代码添加到草图中，并将地球的设置代码复制到名为 initGlobe() 的方法中。\n\n然后，我们将\
    \ makeSphere() 和 keyPressed() 方法添加到草图中。在 draw() 方法中，需要在绘制地球之前启用深度排序，并在绘制加载进度条和时间线之前将其禁用。我们将绘制和旋转地球的代码移动到名为\
    \ drawGlobe() 的单独方法中。\n\n最后，我们添加了一个名为 drawPins() 的方法，它将日志行的地理坐标转换为创建球体时使用的极坐标，然后为每条线绘制一条从球体原点开始、在略高于地球表面的地方结束的线。\n\
    \n## 任务完成\n\n我们当前的任务是使用上一个项目中创建的霓虹地球，将其转变为一个地理信息系统，以显示网站请求的来源地。我们首先使用正则表达式解析日志文件，并从每一行中提取\
    \ IP 地址和时间戳。为使时间戳更易于处理，我们使用 `SimpleDateFormatter` 将 `string` 表示形式转换为 `long`。在\
    \ `draw()` 方法中，我们创建了一个显示日志文件时间戳的时间线。\n\n在第二项任务中，我们添加了 hostIP 项目的数据库，它允许我们将 IP\
    \ 地址块映射到城市级别的地理坐标。为加快地理编码速度，我们创建了一个以 IP 地址块为键的 `HashMap`。由于加载 hostIP 数据库需要一些时间，我们将初始化代码移至单独的线程，并向\
    \ `draw()` 方法中添加了进度条。\n\n在第三项任务中，我们使用地理编码数据在地图上为每个请求绘制一个小红点。我们使用的地图是上一个项目中用于霓虹地球的纹理图像。为让地图看起来更精美，我们用图钉的矢量图形替换了红点。\n\
    \n本次任务的最后一项是使用上一个项目中创建的地球仪，并将我们的可视化添加到其中。我们将地球仪的初始化代码移至新草图。然后，我们调整了 `draw()` 方法，以确保进度条等二维元素绘制在地球仪之上。我们没有使用红点，而是使用从地球表面伸出的黄色线条。如果\
    \ GLSL 滤镜处于激活状态，这些线条也会绘制为霓虹线条。\n\n## 准备好大干一场了？一个高手挑战\n\n在本次任务中，我们在 2D 地图和 3D 地球仪上创建了地理可视化，但地理信息系统是一个非常广泛且有趣的领域，我们肯定只是初涉而已。你不妨尝试升级到下一级，试试以下其中一个想法：\n\
    \n- 允许用户使用鼠标旋转地球仪\n- 为请求的文件类型使用不同颜色的图钉\n- 使用服务器进程实时解析日志文件，并向地球仪发送实时更新\n- 可视化垃圾邮件的来源地\n\
    - 为可视化使用可缩放的矢量地图\n\n## 项目 9\n\n### 从虚拟到现实\n\n几年前，如果你有一个花瓶或笔筒的创意，并希望将其变成可以放在桌上的实物，你会开始绘制蓝图。根据材质，你可能会开始雕刻木材、制作模具、制作陶瓷制品，或付钱让别人为你制作。但在本世纪初，另一个机会出现了——在电脑上设计你喜欢的物体，并将其送入\
    \ 3D 打印机。\n\n### 任务简报\n\n我们的任务是从数学表达式生成一个小花瓶。我们将从简单的公式开始，创建 2D 形状；我们将使用 GUI 使形状可更改。然后，我们将\
    \ 2D 形状扩展到第三维，并添加更多可更改的参数。我们将向草图添加相机控件，以便在决定是否希望将其放在桌子、窗台或碗柜上之前，从各个角度检查我们的物体。\n\
    \n然后，我们将添加一个导出函数，允许我们创建可用作 3D 桌面打印机输入的 STL 文件，或从在线 3D 打印服务订购花瓶。\n\n### 这有什么酷？\n\
    \n小时候，我喜欢玩乐高套装。每当我搭建一座大楼时，总是缺少完成杰作所需的那个特殊方块。一块屋顶石、一扇窗户、一扇门（绿色的），等等。后来当我开始观看《星际迷航》并第一次看到复制机时，我知道这就是解决我所有乐高问题的方法。你需要一个乐高零件？需要一匹马去从巨龙手中救出公主？需要一艘飞船来抵御邪恶的外星人？只需告诉你的复制机。\n\
    \n"
