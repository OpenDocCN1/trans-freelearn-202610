  mdcn: "\n\n## 启动推进器\n\n让我们将游戏转换为 Android 应用：\n\n- 1. 访问 http://developer.android.com/sdk/index.html\
    \ 并为您的计算机下载 Android SDK。我们不需要随 Eclipse 捆绑的版本。由于我们已有 IDE（Processing），需要向下滚动到 SDK\
