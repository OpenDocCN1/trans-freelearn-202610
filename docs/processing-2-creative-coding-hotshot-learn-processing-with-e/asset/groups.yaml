  - '[PAGE 5]


    # About the Reviewers


    **Mag. Erwin Gradwohl** is a retired consultant and former bank auditor, interested
    in programming, music, and videos.


    **Kasper Kamperman** is a teacher and creative coder based in Enschede, Netherlands.
    He works on the Art and Technology program at the Saxon University of Applied
    Sciences, where he teaches subjects like Interaction Design and Programming and
    Physical Computing.


    Besides his work as a teacher, Kasper designs and develops interactive installations.
    He has a fascination for light and currently uses Processing and Arduino to prototype
    and develop dynamic light objects.


    You can check out his projects at http://www.kasperkamperman.com.


    > I would like to thank the Processing development team for creating this great
    open source programming language and environment. Also thanks to the writer of
    this book, Nikolaus Gradwohl, and the Packt Publishing team, it was a pleasure
    to review this book.'
  - '[PAGE 6]


    **Tim Pulver** is an interface design student from Potsdam, Germany. He studied
    software engineering while at University, giving him the knowledge to realize
    his creative ideas. He uses Processing as an artistic medium for building his
    own tools. One of his recent projects is a gigantic real-time data visualization
    software, which is used for visualizing global crop production. It has been specifically
    made to be viewed in a planetarium/full dome environment.


    In another project, Tim wrote a program that translated an image of an eye based
    on its structure into unique jewelry, which was printed out using a 3D printer.


    He likes the idea of sharing and free culture. In 2011, he founded the electronic
    music netlabel Yarn Audio, which supports sharing and remixing of the released
    music. All the cover artwork for this netlabel has been generated using Processing
    too.


    > I would like to thank my family for their support, Isi for motivating me to
    do what I do now, and Hanna and Paul for inspiring talks and chili con carne.


    **R.A. Robertson** discovered Processing late in the summer of 2008, and with
    it, the joy of generative art. Along with some occasional forays into Quartz Composer,
    Ross found Processing to be an entrance into the world of procedural literacy
    as well as a path for understanding nature, society, and himself.


    For most of his adult life, Ross has studied music and design (formally and otherwise),
    and spent many years as a professional Aikido instructor in Austin, Texas. In
    addition, he holds a Bachelor''s degree in Cultural Anthropology from the University
    of Texas in Austin. Although superficially disparate, these streams converge with
    programming as multivalent languages whose grammar, syntax, vocabulary, and structure
    serve to inform and enhance one another. Ross'' work is a continuing effort to
    unify these elements into a coherent way of design for the purpose of exploring
    beauty, the meanings of fitness, and the cultivation of a better human being capable
    of creating a better world for all.


    Ross is the founder and host for Processing''s Austin meet-up group, and owner
    of the nascent Still Moving Designs studio.


    A lover of travel, Ross is pleased to call Austin his home base, where he resides
    with his lovely consort, companion, and friend, Dr. Catherine Parsoneault. Ross
    has three grown children—Ehren, Calen (and his delightful bride Taylor), and Raanan—who
    are unequivocally to him the most interesting and wonderful people on this planet.
    For Ross, the time spent in discourse and shared activity with these amazing people
    is better than Heaven''s own manna.'
