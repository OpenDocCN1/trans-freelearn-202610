    # Objective Complete - Mini Debriefing


    For this task of our current mission, we have created a prototype version of the
    hardware we need for our Smile-O-Mat controller. We have added three variable
    resistors, and in step 8 we defined a protocol to send the values of these inputs
    to a computer via the serial port. The protocol also allows us to detect which
    input knob has been turned.


    Starting with step 11, we extended the circuit and added a button to it. We also
    extended the messages we send to the computer with a click message. This message
    gets transmitted when the value of the button changes from pressed to released,
    and we will use it to trigger our tweet () method in the next task.


    # Changing your face


    The current task of our mission is to integrate the prototyped hardware controller
    we have just created into the Smile-O-Mat controller. We will extend the program
    to parse the messages that our Arduino-based controller is sending via the serial
    port and adjust the sliders to match the values of the hardware knobs. When the
    user of our controller presses the button on the board, we are going to call the
    tweet () method.'
