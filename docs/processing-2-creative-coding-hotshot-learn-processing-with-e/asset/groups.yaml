  - '[PAGE 169]


    # Engage Thrusters


    Let''s convert the game to an Android app:


    +   1. Go to http://developer.android.com/sdk/index.html and download the Android
    SDK for your computer. We don''t need the bundled version that comes with Eclipse.
    Since we already have an IDE (Processing), we need to scroll down to the SDK Tools
    Only section and download the SDK package for our operating system.


    +   2. Unpack the downloaded file and run the Android command from the tools folder.


    +   3. Processing creates apps that run on Android starting with Version 2.3.3,
    since this was the first Android version with a hardware-accelerated OpenGL support.
    So let''s select the SDK package and the Google API for this platform. If you
    are using Windows, you also need the Google USB driver package from the Extras
    folder. Linux and Mac OS X need no special driver. Select the packages as shown
    in the following screenshot and click on Install:


    ![](img/5cb67baa7bc7778de360b14c00d1ab81_169_0.png)


    +   4. Now we need to tell Processing where it can find the Android SDK. Open
    our Processing game and switch to the Android mode on the right. When you do this
    for the first time, Processing asks you where it can find the Android SDK, so
    point it to the folder you have unpacked in step 2. A detailed install instruction
    can be found in the Processing wiki at http://wiki.processing.org/w/Android.'
  - '[PAGE 170]


    5. We are now going to run our sketch in an emulator. Click on the **Sketch |
    Run in Emulator** menu item. Processing now compiles the sketch to an Android
    app, creates a virtual device for the Android emulator, and then starts it. Since
    starting the Android emulator can take a while, especially when it''s run for
    the first time, it''s possible that you get a timeout error. In this case, simply
    repeat the step. After a while, you should see our sketch running in an emulator
    window like this:


    ![](img/5cb67baa7bc7778de360b14c00d1ab81_170_0.png)'
  - "[PAGE 171]\n\n6. On a mobile device, applications usually run in full-screen\
    \ mode since there are now windowing systems. We will now tell our sketch to make\
    \ use of the entire screen. We also tell our sketch to run in landscape mode by\
    \ using the `orientation()` method.\n\n```\nvoid setup() {\n  size(displayWidth,displayHeight);\n\
    \  orientation(LANDSCAPE);\n  ship = loadImage( \"ship.png\" );\n  reset();\n\
    }\n```\n\n7. Now the sketch runs in full-screen mode, but it is still unplayable\
    \ on most Android devices because very few of them come with a hardware keyboard.\
    \ To fix this, we need to implement controls that can be used with a touchscreen.\
    \ The **Android** mode maps touch events to the mouse handling callbacks, so all\
    \ we have to do is add some code to our `mousePressed()` method to control the\
    \ ship. If our player touches the bottom third of the screen, we fire the thruster.\
    \ If the upper part of the screen gets touched, we turn the ship left or right.\n\
    \n```\nvoid mousePressed() {\n  if ( state == WAITING ) {\n    state = RUNNING;\n\
    \  } else if ( state == RUNNING ) {\n    if ( mouseY > height * 2 / 3 ) {\n  \
    \    acc += 0.04;\n      acc = max( acc, 1/frameRate);\n    }\n    else if ( mouseX\
    \ < width / 2 ) {\n      a -= 0.1;\n    }\n    else {\n      a += 0.1;\n    }\n\
    \  } else if ( state == FINISHED ) {\n    reset();\n    state = RUNNING;\n  }\n\
    }\n```"
