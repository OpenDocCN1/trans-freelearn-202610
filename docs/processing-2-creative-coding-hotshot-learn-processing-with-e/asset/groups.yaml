    \ `PlaylistItem`。\n\n播放列表文本文件不仅包含我们想要播放的歌曲列表，还允许我们控制可视化器的顺序和时序。每个播放列表项包含两个名为 `id`\
    \ 和 `delay` 的整数数组。第一个数组存储可视化器的顺序，第二个数组存储在我们的时序线程（步骤 6）中切换到下一个可视化器前需要等待的时间。\n\n\
    ## 舞者登场\n\n本次任务的最终目标是将我们刚刚创建的迪斯科舞池添加到来自项目 2（火柴人舞蹈公司）的草图中。我们将用在本次任务中创建的精彩可视化器，替换舞者目前使用的那片沉闷的灰色舞池。\n\
    \n我们将使用从 Minim 播放器获取的 metaData 对象来显示当前播放 MP3 文件的标题。\n\n### 启动推进器\n\n让我们添加舞者：\n\
    \n- 1. 本任务需要做的第一件事是将之前草图中的所有可视化器类复制到我们之前项目中的火柴人舞蹈公司草图。因此，我们同时打开之前任务中的 \"visualizers\"\
    \ 草图和之前项目的最终草图。\n\n- 2. 我们通过“文件 | 另存为”将火柴人舞蹈公司草图保存为不同的名称。\n\n- 3. 现在我们切换到 \"visualizer\"\
    \ 草图，并通过“草图 | 显示草图文件夹”打开草图文件夹。\n\n- 4. 选择文件夹中的所有文件，但 visualizers.pde 文件除外，将它们拖放到火柴人舞蹈草图的草图窗口中。Processing\
    \ 会为每个拖入的文件添加一个新选项卡。\n\n- 5. 将 loadPlaylist() 函数复制到火柴人舞蹈草图。\n\n```\nPlaylistItem[]\
    \ loadPlaylist( String name ) {\n  String[] str = loadStrings( name );\n\n  PlaylistItem[]\
    \ playlist = new PlaylistItem\n  [ int( str.length / 2 ) ];\n\n  for( int i =\
    \ 0; i < str.length; i += 2 ) {\n    String songname = str[i];\n    String[] raw\
    \ = str[i+1].split(\"-\");\n\n    int[] v = new int[raw.length];\n    int[] d\
    \ = new int[raw.length];\n\n    for( int j = 0; j < raw.length; j++ ) {\n    \
    \  String[] visdel = raw[j].split(\":\");\n      v[j] = int(visdel[0]);\n    \
    \  d[j] = int(visdel[1]);\n    }\n    playlist[ i/2 ] = new PlaylistItem( songname,\
    \ v, d );\n  }\n  return playlist;\n}\n```\n\n- 6. 将以下更改复制到我们的 setup() 方法中，以初始化播放列表和用于切换可视化器的线程。我们还必须将\
    \ AudioPlayer 变量重命名为 aplayer，因为 player 在火柴人舞蹈公司草图中已经被使用了：\n\n```\nSimpleOpenNI\
    \ context;\nint player = -1;\nboolean calibrated = false;\n\nFigure figures[][]\
    \ = new Figure[5][4];\n\nVisualizer viz;\nVisualizer[] visualizers;\nPlaylistItem[]\
    \ playlist;\nint currentSong = 0;\nMinim minim;\nAudioPlayer aplayer;\n\nvoid\
    \ setup() {\n    size( 1024, 768, P3D);\n    context = new SimpleOpenNI( this\
    \ );\n    context.enableDepth();\n    context.setMirror( true );\n\n    context.enableUser(\
    \ SimpleOpenNI.SKEL_PROFILE_ALL );\n\n    smooth();\n    lights();\n\n    for\
    \ ( int i = 0; i<5; i++) {\n        for ( int j=0; j<4; j++) {\n            figures[i][j]\
    \ = new Figure();\n            figures[i][j].randomize();\n        }\n    }\n\
    \    minim = new Minim( this );\n\n    playlist = loadPlaylist( \"playlist.txt\"\
    \ );\n    aplayer = minim.loadFile( playlist\n    [currentSong].songname, 1024);\n\
    \n    BeatVisualizer bv = new BeatVisualizer();\n    aplayer.addListener( bv );\n\
    \n    FFTVisualizer fv = new FFTVisualizer( aplayer );\n    aplayer.addListener(\
    \ fv );\n\n    visualizers = new Visualizer[] {\n    new SpiralIn(),\n    new\
    \ BarHorizontal(),\n    new Alternate(),\n    bv,\n    fv\n    };\n\n    viz =\
    \ bv;\n    viz.setActive( true );\n    Thread t = new Thread() {\n    public void\
    \ run() {\n    for(;;) {\n    viz.tick();\n    viz.delay(125);\n    }\n    }\n\
    \    };\n    t.start();\n\n    Thread t2 = new Thread() {\n    public void run()\
    \ {\n    for(;;) {\n    viz.setActive( false );\n    viz = visualizers\n    [\
    \ playlist[currentSong].getVisualizer() ];\n    viz.init();\n    viz.setActive(\
    \ true );\n\n    int rest = aplayer.length() - aplayer.position();\n    if ( rest\
    \ > playlist[currentSong].getDelay() *\n    1000 ) {\n    delay( playlist[currentSong].getDelay()\
    \ * 1000 );\n    } else {\n    delay( rest );\n    }\n    playlist[currentSong].next();\n\
    \    }\n    }\n    };\n    t2.start();\n    aplayer.play();\n}\n```\n\n- 7. 我们现在将可视化器的绘图代码添加到\
    \ drawFloor() 方法中，以便可以将它们作为纹理用于地板正方形。\n\n```\nvoid drawFloor() {\nPGraphics g\
    \ = createGraphics( 320, 320 );\ng.beginDraw();\ng.background(0);\nfloat w = 320/8;\n\
    for( int x = 0; x < 8; x++ ) {\nfor( int y = 0; y < 8; y++ ) {\ng.stroke( 255\
    \ );\ng.fill( viz.tiles[x][y],0,0 );\nif ( viz.tiles[x][y] > 32 )\n{ viz.tiles[x][y]\
    \ -= ( viz.tiles[x][y] -32)/25; }\ng.rect( w * x, w*y, w, w );\n}\n}\ng.endDraw();\n\
    \nnoStroke();\nfill( 128 );\n\nbeginShape(QUADS);\ntexture( g );\nvertex( -400,\
    \ -100, -400, 0, 0 );\nvertex( -400, -100, 400, 0, 320 );\nvertex( 400, -100,\
    \ 400, 320, 320 );\nvertex( 400, -100, -400, 320, 0 );\nendShape();\n}\n```\n\n\
    - 8. 现在我们需要复制 `checkSongEnd()` 方法来检查当前歌曲是否播放完毕。\n\n```\nvoid checkSongEnd() {\n\
    \  if (aplayer.position() == aplayer.length()) {\n    currentSong += 1;\n    if\
    \ (currentSong >= playlist.length) { currentSong = 0; }\n\n    aplayer = minim.loadFile(\
    \ playlist[currentSong].songname,\n    1024);\n\n    aplayer.play();\n  }\n}\n\
    ```\n\n- 9. 为了确保我们的 `checkSongEnd()` 方法在每一帧后都被调用，我们将其添加到 `draw()` 方法中。\n\n```\n\
    void draw() {\n  background( 255 );\n  checkSongEnd();\n\n  context.update();\n\
    \  ...\n```\n\n- 10. 本任务列表中的最后一项是显示当前播放歌曲的标题和艺术家。幸运的是，Minim 提供了一个 `MetaData` 类，可以从\
    \ `AudioPlayer` 对象中提取这些数据。在主草图的 `setup()` 方法正上方定义一个名为 `meta` 的变量。\n\n`AudioMetaData\
    \ meta;`\n\n- 11. 将以下行添加到 `setup()` 方法中：\n\n```\n...\nplaylist = loadPlaylist(\
    \ \"playlist.txt\" );\naplayer = minim.loadFile\n( playlist[currentSong].songname,\
    \ 1024);\nmeta = aplayer.getMetaData();\ntextFont(createFont(\"Serif\", 12));\n\
    ...\n```\n\n- 12. 然后我们还需要在 `checkSongEnd()` 方法中更新元数据，因为当当前歌曲播放完毕时，我们需要更新 `metaData`\
    \ 对象，以便开始下一首歌曲。\n\n```\nvoid checkSongEnd() {\n  if (aplayer.position() == aplayer.length())\
    \ {\n    currentSong += 1;\n    if (currentSong >= playlist.length)\n    { currentSong\
    \ = 0; }\n\n    aplayer = minim.loadFile\n    ( playlist[currentSong].songname,\
    \ 1024 );\n    meta = aplayer.getMetaData();\n    aplayer.play();\n  }\n}\n```\n\
    \n- 13. 添加一个 drawMeta() 方法，它使用 Minim MetaData 对象获取歌曲的标题和艺术家，并使用 text() 函数显示它们。\n\
    \n```\nvoid drawMeta() {\ntextAlign( RIGHT );\nfill( 0 );\ntext( \"Title: \"+meta.title(),\
    \ 1000, 40 );\ntext( \"Author: \"+meta.author(), 1000, 65 );\n}\n```\n\n- 14.\
    \ 现在我们从 draw() 方法中调用 drawMeta() 方法。\n\n```\nvoid draw() {\nbackground( 255 );\n\
    checkSongEnd();\ncontext.update();\n\ndrawHUD();\ndrawMeta();\ntranslate( width/2,\
    \ height/2, 0 );\n...}\n```\n\n- 15. 将一些 MP3 文件添加到我们的草图中，并调整播放列表文本文件。运行你的草图，开始起舞吧。\n\
    \n## 目标完成 - 小型简报\n\n在本任务中，我们将上一任务中的可视化器添加到了火柴人舞蹈公司草图。我们在 drawFloor() 方法中使用了纹理，用我们的可视化器替换了灰色的正方形。我们还添加了播放列表功能和可视化器排序，以完成我们的迪斯科。\n\
