  - "[PAGE 102]\n\n# # Objective Complete - Mini Debriefing\n\nFor the first task\
    \ of our current mission, we created a Processing sketch that draws our basic\
    \ face. We added three variables that control the facial features we are enabling\
    \ the user to change. We changed the color mode to HSB to make it easier for the\
    \ user to select the desired color tone. Like RGB, the HSB color mode has three\
    \ parameters, but instead of mixing red, green, and blue, you choose the basic\
    \ color (hue), the brightness, and the saturation. We keep the brightness and\
    \ saturation value fixed for the sake of simplicity and let the user change the\
    \ hue value.\n\nAll the control variables store a value between 0 and 1023, which\
    \ are than mapped to the value range we need for drawing using the map() command.\n\
    \n# # Let me change it\n\nNobody feels like smiling all the time, but it is currently\
