    # # Processing 2: Creative Programming Cookbook


    ISBN: 978-1-84951-794-2 Paperback: 306 pages


    Over 90 highly-effective recipes to unleash your creativity with interactive art,
    graphics, computer vision, 3D, and more


    +   1. Explore the Processing language with a broad range of practical recipes
    for computational art and graphics

    +   2. Wide coverage of topics including interactive art, computer vision, visualization,
    drawing in 3D, and much more with Processing

    +   3. Create interactive art installations and learn to export your artwork for
    print, screen, Internet, and mobile devices


    ![](img/5cb67baa7bc7778de360b14c00d1ab81_264_1.png)


    # # jMonkeyEngine 3.0 Beginner''s Guide


    ISBN: 978-1-84951-646-4 Paperback: 314 pages


    Develop professional 3D games for desktop, web and mobile all in the familiar
    Java programming language


