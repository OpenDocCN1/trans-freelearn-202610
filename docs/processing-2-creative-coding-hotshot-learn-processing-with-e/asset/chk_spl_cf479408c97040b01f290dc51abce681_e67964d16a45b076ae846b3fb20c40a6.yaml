- 'no': 7795
  overturn_probability: 0.65
  alternative: 索引/附录章节内的字母分类小标题
  counter_evidence:
  - 该行位于文末，后面紧跟“# A”、“# B”等字母索引条目，说明“# Symbols”仅是索引部分内的第一个字母分类标题，而非整个索引章节的独立标题；索引应作为一个整体章节，不应为每个字母组单独分章，否则会导致过度碎片化。
  - 该行前文是“高手挑战”列表的结束，并非典型章节末尾（如本章总结、习题），与新章节开始的上下文特征不符。
  - 规则虽言“文末索引划分为一章”，但指的是整个索引部分；若每个索引字母组都单独成章，将违背章节应具有统领性、能覆盖后续内容的语义特征。
  keep_split: false
