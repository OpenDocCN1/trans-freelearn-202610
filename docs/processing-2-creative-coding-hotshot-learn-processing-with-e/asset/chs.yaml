  \  image( ship, -ship.width/2, -ship.height/2, ship.width, ship.height );\n  popMatrix();\n\
  }\n```\n\n- 12. 如果您现在运行草图，火箭将以 30 度的角度悬停在月球上方，但月球、着陆平台和我们的网格保持不变。\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_155_0.png)\n\
  \n## 任务完成 - 简要总结\n\n在当前任务的第一个任务中，我们创建了游戏所需的所有图形元素。在步骤 1 到 3 中，我们创建了一个看起来像数学笔记本的网格，使游戏看起来像是在课堂上画出来的（当然是课间休息时！）。\n\
  \n在步骤 4 中，我们添加了随机生成的月球地貌。我们在 `setup()` 方法中随机生成了月球地面高度的偏移量，并将其存储在一个数组中。这样，我们可以确保月球在一局游戏中保持不变，但在玩家完成关卡并重新启动时可以轻松重新生成。要绘制月球，我们使用\
  \ `beginShape()` 和 `endShape()` 方法创建了一个复杂的多边形，并使用 `vertex()` 命令定义了多边形的顶点。\n\n着陆平台由一个与网格对齐的矩形组成，使其看起来像是我们给其中一些方格上了色。我们还为平台添加了支架，并使用前一节中的数组使它们接触月球的地面高度。\n\
  \n最后，我们使用了飞船图像并创建了一个变换上下文，以便能够旋转它。我们需要这个新上下文，以确保我们对 `translate()` 和 `rotate()` 的调用仅影响用于飞船的绘制操作，而不影响屏幕上的所有其他部分。新上下文通过\
  \ `pushMatrix()` 开始，通过 `popMatrix()` 结束。我们在此上下文中使用的每个缩放、平移或旋转操作都只影响其自身的绘制操作。我们的网格、月球和着陆平台不受其影响。\n\
  \n## 启动着陆程序\n\n当前任务的第二个任务是实现我们月球登陆者游戏的物理模拟和游戏控制。在此任务中，游戏应能够在运行 Java 的台式计算机和笔记本电脑上运行。我们将添加键盘控制，使玩家能够将火箭向左和向右转动，并且当玩家按下向上光标键时，推进器将点火并将火箭在其转向的方向加速一点。\n\
  \n## 点火推进器\n\n让我们先通过添加月球重力来开始实现物理效果：\n\n- 1. 我们需要为月球物理模拟实现的第一件事是用于存储飞船位置、方向、当前速度和月球重力强度的变量。\n\
  \n```java\nint[] moon;\nint landingX = 0;\nPImage ship;\n\nPVector pos = new PVector(\
  \ 150, 20 );\nPVector speed = new PVector( 0, 0 );\nPVector g = new PVector( 0,\
  \ 1.622 );\n```\n\n- 2. 现在我们需要在每一帧更新飞船的位置，因此我们在草图中添加一个 update() 方法，并从 draw() 方法中调用它。\n\
  \n```java\nvoid draw() {\n    background(255);\n    stroke(200, 200, 255);\n   \
  \ for ( int i=0; i<height/10; i++ ) {\n        line( 0, i*10, width, i*10 );\n \
  \   }\n    for ( int i=0; i<width/10; i++ ) {\n        line( i*10, 0, i*10, height\
  \ );\n    }\n\n    drawMoon();\n    drawLandingZone();\n    drawShip();\n\n    update();\n\
  }\n\nvoid update() {\n}\n```\n\n- 3. 我们还需要更改 `drawShip()` 方法中对 `translate()` 命令的调用，以使用新的\
  \ `pos` 变量。\n\n```java\nvoid drawShip() {\n  pushMatrix();\n  translate(pos.x, pos.y);\n\
  \  rotate(PI/6);\n  image( ship, -ship.width/2, -ship.height/2, ship.width, ship.height\
  \ );\n\n  popMatrix();\n}\n```\n\n- 4. 在这个 `update()` 方法中，我们将实现所有物理计算。那么，让我们先实现重力对飞船的影响。\n\
  \n```java\nvoid update() {\n  PVector gDelta = new PVector( g.x / frameRate, g.y\
  \ / frameRate);\n  speed.add( gDelta );\n  pos.add( speed );\n}\n```\n\n- 5. 由于月球表面非常坚固，我们还添加了一个测试，一旦飞船到达表面就停止它。\n\
  \n```java\nvoid update() {\n  PVector gDelta = new PVector( g.x / frameRate, g.y\
  \ / frameRate);\n\n  speed.add( gDelta );\n  pos.add( speed );\n\n  if ( pos.x >\
  \ landingX - 40 && pos.x < landingX + 40 && pos.y >\n  height-50 - ship.height/2\
  \ ) {\n    pos.y = height - 50 - ship.height/2;\n  } else if (pos.y > height - 20\
  \ - ship.height/2 ) {\n    pos.y = height - 20 - ship.height/2;\n  }\n}\n```\n\n\
  - 6. 现在运行您的草图。火箭应该从窗口顶部开始，掉到底部并停在那里，如下面的屏幕截图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_158_0.png)\n\
  \n- 7. 由于游戏的目标不是将火箭撞向月球，而是将其着陆，因此我们需要实现一个减速火箭的方法。游戏将使用键盘控制，因此让我们添加加速度和旋转角度变量。\n\n\
  ```java\nint[] moon;\nint landingX = 0;\nPImage ship;\n\nPVector pos = new PVector(\
  \ 150, 20 );\nPVector speed = new PVector( 0, 0 );\nPVector g = new PVector( 0,\
  \ 1.622 );\n\nfloat a = 0;\nfloat acc = 0;\n```\n\n- 8. 此外，添加一个 keyPressed() 方法，使玩家能够更改火箭的旋转和加速度。\n\
  \n```java\nvoid keyPressed() {\n  if ( keyCode == LEFT ) {\n    a -= 0.1;\n  }\n\
  \n  if ( keyCode == RIGHT ) {\n    a += 0.1;\n  }\n\n  if ( keyCode == UP ) {\n\
  \    acc += 0.04;\n  }\n\n  acc = max( acc, 1/frameRate);\n}\n```\n\n- 9. 现在，我们需要调整\
  \ drawShip() 方法，并使用旋转变量来改变飞船的旋转。\n\n```java\nvoid drawShip() {\n  pushMatrix();\n\
  \  translate(pos.x, pos.y);\n  rotate(a);\n  image( ship, -20, -40, 40, 75 );\n\
  \  popMatrix();\n}\n```\n\n- 10. 我们还需要调整 update() 方法，以使加速度和旋转角度影响飞船的速度和位置。\n\n```java\n\
  void update() {\n  PVector f = new PVector( cos( a+PI/2 ) * -acc,\n  sin( a+PI/2\
  \ ) * -acc );\n  if ( acc > 0 ) {\n    acc *= 0.95;\n  }\n\n  PVector gDelta = new\
  \ PVector( g.x / frameRate, g.y / frameRate);\n\n  speed.add( gDelta );\n  speed.add(\
  \ f );\n  pos.add( speed );\n\n  if ( pos.x > landingX - 40 && pos.x < landingX\
  \ + 40\n  && pos.y > height-50 - ship.height/2 ) {\n    pos.y = height - 50 - ship.height/2;\n\
  \  } else if (pos.y > height - 20 - ship.height/2 ) {\n    pos.y = height - 20 -\
  \ ship.height/2;\n  }\n}\n```\n\n- 11. 我们的飞船现在可以转动，并对加速命令做出反应。现在，我们向 drawShip()\
  \ 方法添加一些代码，以便在用户加速飞船时从推进器喷出火焰。\n\n```java\nvoid drawShip() {\n  pushMatrix();\n\
  \  translate(pos.x, pos.y);\n  rotate(a);\n  noFill();\n  for ( int i=4; i >= 0;\
  \ i--) {\n    stroke(255, i*50, 0);\n    fill(255, i*50, 20);\n    ellipse( 0, 30,\
  \ min(1, acc*10) *i*4, min(1, acc*10)* i*10);\n  }\n\n  image( ship, -ship.width/2,\
  \ -ship.height/2, ship.width, ship.height );\n  popMatrix();\n}\n```\n\n- 12. 飞船在平台上着陆或撞到月球表面后，游戏只能通过重新启动草图才能再次进行。我们现在将通过向草图添加游戏状态来修复这一点。添加一个名为\
  \ state 的变量来存储当前状态，并定义三个名为 WAITING、RUNNING 和 FINISHED 的常量。我们将 state 变量初始化为 WAITING，并将\
  \ setup() 方法中的关卡生成代码提取到名为 reset() 的方法中。\n\n```java\nint[] moon;\nint landingX =\
  \ 0;\n```\n\n```java\nPVector pos = new PVector( 150, 20 );\nPVector speed = new\
  \ PVector( 0, 0 );\nPVector g = new PVector( 0, 1.622 );\n```\n\n```java\nfloat\
  \ a = 0;\nfloat acc = 0;\n```\n\n```java\nPImage ship;\n```\n\n```java\nint WAITING\
  \ = 1;\nint RUNNING = 2;\nint FINISHED = 3;\n```\n\n```java\nint state = WAITING;\n\
  ```\n\n```java\nvoid setup() {\n  size(300, 300);\n  ship = loadImage( \"ship.png\"\
  \ );\n  reset();\n}\n```\n\n```java\nvoid reset() {\n```\n\n\n```\nmoon = new int[width/10+1];\n\
  for ( int i=0; i < moon.length; i++ ) {\n  moon[i] = int(random(10));\n}\nlandingX\
  \ = int( random(3, moon.length-4) )*10;\n\npos = new PVector( 150, 20 );\na = 0;\n\
  acc = 0;\nspeed = new PVector(0,0);\n}\n```\n\n- 13. 在我们的 draw() 方法中，我们将检查状态变量，并且仅在状态为\
  \ RUNNING 时才调用 update() 方法。我们还将添加 drawWaiting() 和 drawFinished() 方法，它们将在相应的状态中被调用。\n\
  \n```\nvoid draw() {\n  background(255);\n  stroke(200, 200, 255);\n  for ( int\
  \ i=0; i<height/10; i++ ) {\n    line( 0, i*10, width, i*10 );\n  }\n  for ( int\
  \ i=0; i<width/10; i++ ) {\n    line( i*10, 0, i*10, height );\n  }\n  drawMoon();\n\
  \  drawLandingZone();\n  drawShip();\n\n  if ( state == WAITING ) {\n    drawWaiting();\n\
  \  }\n  else if ( state == RUNNING ) {\n    update();\n  }\n  else if ( state ==\
  \ FINISHED ) {\n    drawFinished();\n  }\n}\n```\n\n```\nvoid drawWaiting() {\n\
  \  textAlign( CENTER );\n  fill(0);\n  text( \"Click mouse to start\", width/2,\
  \ height/2 );\n}\nvoid drawFinished() {\n  textAlign( CENTER );\n  fill( 0 );\n\
  \  if ( pos.x > landingX - 40 && pos.x < landingX + 40 ) {\n    text( \"you landed\
  \ the ship!\", width/2, height/2);\n  } else {\n    text( \"you missed the platform!\"\
  , width/2, height/2);\n  }\n  text( \"click to restart\", width/2, height/2 + 20\
  \ );\n}\n```\n\n- 14. 现在我们添加一个 mouseClicked() 方法，如果状态为 WAITING 或 FINISHED，则将状态更改为\
  \ RUNNING。在后一种情况下，我们还会调用在第 12 步中创建的 reset() 方法以生成一个新关卡。\n\n```\nvoid mousePressed()\
  \ {\n  if ( state == WAITING ) {\n    state = RUNNING;\n  } else if ( state == FINISHED\
  \ ) {\n    reset();\n    state = RUNNING;\n  }\n}\n```\n\n- 15. 在我们的 update() 方法中，如果火箭在平台上着陆或撞上月球表面，我们将游戏状态更改为\
  \ FINISHED。\n\n```\nvoid update() {\n  PVector f = new PVector( cos( a+PI/2 ) *\
  \ -acc,\n    sin( a+PI/2 ) * -acc );\n  if ( acc > 0 ) {\n    acc *= 0.95;\n  }\n\
  \  PVector gDelta = new PVector( g.x / frameRate, g.y / frameRate );\n  speed.add(\
  \ gDelta );\n  speed.add( f );\n  pos.add( speed );\n  if ( pos.x > landingX - 40\
  \ && pos.x < landingX + 40 && pos.y >\n    height-50 - ship.height/2 ) {\n    pos.y\
  \ = height - 50 - ship.height/2;\n    state = FINISHED;\n    acc = 0;\n  } else\
  \ if (pos.y > height - 20 - ship.height/2 ) {\n    pos.y = height - 20 - ship.height/2;\n\
  \    state = FINISHED;\n    acc = 0;\n  }\n}\n```\n\n- 16. 现在运行你的草图，尝试使用方向键将火箭降落在平台上。当火箭加速时，你的游戏窗口应如下截图所示：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_163_0.png)\n\n## 目标完成 - 小结\n\n在本次任务的此项工作中，我们已完成适用于运行\
  \ Mac OS X、Linux 或 Windows 的台式机和笔记本电脑的游戏。从第 1 步到第 5 步，我们将月球重力实现到草图中，并让火箭落向地面。我们使用了一种非常简单的物理模拟，在每一帧将月球引力的一小部分添加到速度变量中，然后将更新后的速度添加到当前位置。\n\
  \n从第 6 步到第 10 步，我们通过实现一些键盘控制，实现了影响飞船的另一种力，允许玩家转动飞船并点火推进器。我们还在第 11 步让火焰从推进器喷出，以向玩家提供关于火箭加速强度的视觉线索。\n\
  \n从第 12 步开始，我们实现了一个游戏状态系统，以防止火箭在游戏一启动就掉到地板上。它还使玩家在火箭降落在平台上或坠毁到月球后，可以通过单击程序窗口来重新开始游戏。\n\
  \n## 在浏览器中运行你的草图\n\n本次任务的下一项工作是将我们在之前任务中创建的游戏移植到浏览器中运行，使用 JavaScript。我们将使用 Processing.js\
  \ 模式来运行脚本，并为我们的游戏创建一个自定义 HTML 模板。Processing.js 模式允许我们在现代浏览器中几乎无需修改即可运行不使用任何外部库的草图。\n\
  \n## 点燃推进器\n\n让我们将游戏转换为浏览器应用程序：\n\n- 1. 打开我们的草图，通过单击新建标签页图标上方的图标并选择 JavaScript，将处理模式切换为\
