  \n## 目标完成 - 简要汇报\n\n在当前任务的第一项中，我们创建了一个可作为花瓶横截面的二维闭合形状。我们使用极坐标，通过根据角度改变半径来创建形状的顶点。\n\
  \n为了让用户能够在不更改源代码的情况下更改曲线的参数，我们添加了一个GUI。从第6步开始，我们安装了controlP5库并添加了一个按钮和一个菜单框。该按钮通过在回调函数中调用`show()`和`hide()`方法来切换菜单框的可见性。\n\
  \n从第14步开始，我们向菜单框添加了两个滑块，允许我们控制曲线上振荡的数量和大小。\n\n## 生成对象\n\n当前任务的第二项是生成一个可用作小笔筒或花瓶的3D对象。我们将使用任务1中创建的二维形状作为对象的横截面，并沿z轴将其拉伸。我们将扩展getR()方法并添加一堆额外的控制变量，允许我们根据对象的高度改变圆形形状。\n\
  \n为了使用户更容易查看对象，我们将添加mousePressed()和mouseDragged()函数，这些函数可以将对象朝任何方向旋转。我们将使用名为quaternion的数学结构来实现这些旋转。\n\
  \n## 点燃推进器\n\n让我们将形状带入第三维：\n\n- 1. 要将我们的形状转换为3D对象，我们需要扩展vertx和verty数组。\n\n```\n\
  import controlP5.*;\nControlGroup box;\nControlP5 cp5;\nButton toggleButton;\nfloat[][]\
  \ vertx;\nfloat[][] verty;\n```\n\n- 2. 在我们的setup()方法中，我们将显示模式更改为P3D并定义数组初始化。我们的形状将由20个三角形条组成，每个包含72个顶点。\n\
  \n```\nvoid setup() {\n    size(400, 400, P3D);\n    setupGUI();\n    vertx = new\
  \ float[20][72];\n    verty = new float[20][72];\n}\n```\n\n- 3. 因为我们更改了顶点数组，所以也需要更改initPoints()方法。我们将添加一个第二个for循环来遍历高度。\n\
  \n```\nvoid initPoints() {\n    for ( int h = 0; h < 20; h++) {\n        for ( int\
  \ a = 0; a<72; a++) {\n            float r = getR( a*5.0 );\n            vertx[h][a]\
  \ = cos( radians( a*5.0 ) ) * r;\n```\n\nvertx[h][a] = sin( radians( a*5.0 ) ) *\
  \ r;\n}\n}\n}\n\n- 4. 现在我们可以在 `draw()` 方法中将形状替换为一组三角形条。在开始绘制形状之前，我们需要启用深度测试，并在绘制完成后禁用它，以确保\
  \ GUI 元素能够正确绘制。我们还将启用一些光源，以防止对象被完全平面着色。\n\n```\nvoid draw() {\n  hint( ENABLE_DEPTH_TEST\
  \ );\n  pushMatrix();\n  background(255);\n  fill(200);\n  noStroke();\n\n  translate(\
  \ width/2, height/2);\n  scale( 1.5 );\n  ambientLight( 50, 50, 50);\n  directionalLight(\
  \ 100, 95, 55, 0, 0, -10 );\n  pointLight( 150, 150, 200, 100, -100, 200 );\n\n\
  \  translate(0, -50, 0);\n  initPoints();\n\n  beginShape(TRIANGLE_STRIP );\n  for\
  \ ( int h = 1; h < 20; h++) {\n    for ( int a = 0; a<73; a++ ) {\n      int aa\
  \ = a % 72;\n      normal( vertx[h][aa], 0, verty[h][aa] );\n      vertex( vertx[h][aa],\
  \ h*5.0, verty[h][aa] );\n      normal( vertx[h-1][aa], 0, verty[h-1][aa] );\n \
  \     vertex( vertx[h-1][aa], (h-1)*5.0, verty[h-1][aa] );\n    }\n  }\n  endShape();\n\
  \n  popMatrix();\n  hint(DISABLE_DEPTH_TEST );\n}\n```\n\n- 5. 目前，我们的对象只能从侧面看到，且无法旋转。要修复此问题，我们需要计算一个旋转轴和一个旋转角度。为了简化这些计算，我们需要添加一个名为\
  \ Quaternion 的类。四元数是类似于复数的数学构造，只是它们是四维的。点击右侧的“新选项卡”菜单，输入名称为 Quaternion。然后，添加以下代码：\n\
  \n```\nclass Quaternion {\n  float w = 1.0;\n  float x = 0.0;\n  float y = 0.0;\n\
  \  float z = 0.0;\n\n  void mult( Quaternion b ) {\n    Quaternion res = new Quaternion();\n\
  \    res.w = this.w * b.w - this.x * b.x - this.y * b.y - this.z * b.z;\n    res.x\
  \ = this.w * b.x + this.x * b.w + this.y * b.z - this.z * b.y;\n    res.y = this.w\
  \ * b.y - this.x * b.z + this.y * b.w + this.z * b.x;\n    res.z = this.w * b.z\
  \ + this.x * b.y - this.y * b.x + this.z * b.w;\n    set( res );\n  }\n\n  void\
  \ set( PVector cross, float dot ) {\n    this.x = cross.x;\n    this.y = cross.y;\n\
  \    this.z = cross.z;\n    this.w = dot;\n  }\n\n  void set( Quaternion in ) {\n\
  \    this.w = in.w;\n    this.x = in.x;\n    this.y = in.y;\n    this.z = in.z;\n\
  \  }\n\n  float[] matrix() {\n    float[] res = new float[4];\n    float sa = (float)\
  \ Math.sqrt(1.0f - w * w);\n\n    if (sa < EPSILON) { sa = 1.0f; }\n\n    res[0]\
  \ = (float) Math.acos(w) * 2.0f;\n    res[1] = x / sa;\n    res[2] = y / sa;\n \
  \   res[3] = z / sa;\n\n    return res;\n  }\n}\n```\n\n- 6. 我们需要在主选项卡中定义三个 `Quaternion`\
  \ 对象，当用户拖动鼠标时，我们将使用它们来计算当前的旋转矩阵。我们还需要一个 `radius` 变量和两个 `PVector` 对象来跟踪当前的鼠标位置和状态。\n\
  \n```\nimport controlP5.*;\n\nControlGroup box;\nControlP5 cp5;\nButton toggleButton;\n\
  \nQuaternion qdown = new Quaternion();\nQuaternion qnow = new Quaternion();\nQuaternion\
  \ qdrag = new Quaternion();\n\nfloat radius = 200;\nPVector down = new PVector();\n\
  PVector drag = new PVector();\n\nfloat[][] vertx;\nfloat[][] verty;\n```\n\n- 7.\
  \ 现在我们需要添加 `mousePressed()` 和 `mouseDragged()` 方法，当鼠标移动时它们会更改我们的变量。我们还添加一个名为 `mouseToSphere()`\
  \ 的辅助函数，用于将鼠标指针的坐标转换为对象周围虚拟球体上的一个点，以便计算我们的四元数。\n\n```\nPVector mouseToSphere(float\
  \ x, float y) {\n  PVector v = new PVector();\n  v.x = (x - width/2) / radius;\n\
  \  v.y = (y - height/2) / radius;\n\n  float mag = v.x * v.x + v.y * v.y;\n  if\
  \ (mag > 1.0f) {\n    v.normalize();\n  } else {\n    v.z = sqrt( 1.0f - mag );\n\
  \  }\n  return v;\n}\n```\n\n```\nvoid mousePressed() {\n  if ( !box.isVisible()\
  \ || ( mouseX > box.getWidth()\n    || mouseY > box.getBackgroundHeight() ) ) {\n\
  \    down = mouseToSphere( mouseX, mouseY );\n    qdown.set( qnow );\n    qdrag\
  \ = new Quaternion();\n  }\n}\n```\n\n```\nvoid mouseDragged() {\n  if ( !box.isVisible()\
  \ || ( mouseX > box.getWidth()\n    || mouseY > box.getBackgroundHeight() ) ) {\n\
  \    drag = mouseToSphere( mouseX, mouseY );\n    qdrag.set( down.cross( drag ),\
  \ down.dot( drag ) );\n  }\n}\n```\n\n### 8. 要使用我们的旋转矩阵，我们需要将以下代码添加到 `draw()` 方法中：\n\
  \n```\nvoid draw() {\n  hint( ENABLE_DEPTH_TEST );\n  pushMatrix();\n  background(255);\n\
  \  fill(200);\n  noStroke();\n\n  translate( width/2, height/2);\n  scale( 1.5 );\n\
  \  ambientLight( 50, 50, 50 );\n  directionalLight( 100, 95, 55, 0, 0, -10 );\n\
  \  pointLight( 150, 150, 200, 100, -100, 200 );\n\n  qnow.set( qdrag );\n  qnow.mult(\
  \ qdown );\n\n  float[] matrix = qnow.matrix();\n  rotate( matrix[0], matrix[1],\
  \ matrix[2], matrix[3] );\n  translate(0, -50, 0);\n  initPoints();\n}\n```\n\n\
  - 9. 现在我们可以通过拖动鼠标旋转对象，但旋转几次后，很难区分对象的顶部和底部。因此，我们将通过在 `draw()` 方法中添加一个三角形扇形来封闭底部。\n\
  \n```\nvoid draw() {\n  beginShape(TRIANGLE_STRIP);\n  for ( int h = 1; h < 20;\
  \ h++) {\n    for ( int a = 0; a<73; a++ ) {\n      int aa = a % 72;\n      normal(\
  \ vertx[h][aa], 0, verty[h][aa]);\n      vertex( vertx[h][aa], h*5.0, verty[h][aa]\
  \ );\n      normal( vertx[h-1][aa], 0, verty[h-1][aa] );\n      vertex( vertx[h-1][aa],\
  \ (h-1)*5.0, verty[h-1][aa] );\n    }\n  }\n  endShape();\n  beginShape(TRIANGLE_FAN);\n\
  \  int h = 19;\n  vertex( 0, h*5, 0 );\n  for ( int a = 0; a<73; a++ ) {\n    int\
  \ aa = a % 72;\n    vertex( vertx[h][aa], h*5, verty[h][aa] );\n  }\n  endShape();\n\
  \  popMatrix();\n  hint(DISABLE_DEPTH_TEST);\n}\n```\n\n- 10. 迄今为止，我们的对象是第一个任务中形状的圆柱体拉伸。目前，我们只将角度作为\
  \ `getR()` 函数的输入参数。现在让我们添加高度作为额外输入，并创建一些新的控制变量。\n\n```\nfloat getR( float a, float\
  \ h ) {\n  float r = v2 * sin( radians(a) * v1 + ( h/15 )*v3 ) +\n    sin(radians(3.6*h)\
  \ * v4 + v5)*v6 + 40;\n  return r;\n}\n```\n\n```\nvoid initPoints() {\n    for\
  \ ( int h = 0; h < 20; h++) {\n        for ( int a = 0; a<72; a++) {\n         \
  \   float r = getR( a*5.0, h*5.0 );\n            vertx[h][a] = cos( radians( a*5.0\
  \ ) ) * r;\n            verty[h][a] = sin( radians( a*5.0 ) ) * r;\n        }\n\
  \    }\n}\n```\n\n- 11. 在我们的 `setupGUI()` 方法中，我们需要添加四个新的滑块来输入新的控制值。为了简化滑块的创建，我们将添加一个名为\
  \ `addSlider()` 的方法。\n\n```\nfloat v1;\nfloat v2;\nfloat v3;\nfloat v4;\nfloat v5;\n\
  float v6;\n```\n\n```\nvoid setupGUI() {\n    cp5 = new ControlP5(this);\n    toggleButton\
  \ = cp5.addButton(\"toggleBox\", 1, 0, 0, 100, 20);\n    toggleButton.setLabel(\"\
  Hide Menu\");\n\n    box = cp5.addGroup( \"box\", 0, 0, 150);\n    box.setBackgroundHeight(170);\n\
  \    box.setBackgroundColor(color(0, 100));\n\n    Slider slider = addSlider( \"\
  slider\", 40, 1, 8, 5, \"count\" );\n    slider.setNumberOfTickMarks(8);\n    Slider\
  \ slider2 = addSlider( \"slider2\", 60, -10, 10, 5, \"radius\" );\n    Slider slider3\
  \ = addSlider( \"slider3\", 80, -2, 2, 2, \"twist\" );\n    Slider slider4 = addSlider(\
  \ \"slider4\", 100, 0, 2, 1.5, \"hcount\" );\n    Slider slider5 = addSlider( \"\
  slider5\", 120, -2, 2, 2, \"phase\" );\n    Slider slider6 = addSlider( \"slider6\"\
  , 140, 0, 5, 5, \"hradius\" );\n}\n```\n\n```\nSlider addSlider( String callback,\
  \ int pos, float start, float end, float value, String label ) {\n  Slider slider\
  \ = cp5.addSlider(callback);\n  slider.setPosition(10, pos);\n  slider.setSize(80,\
  \ 10);\n  slider.setRange(start, end);\n  slider.setValue(value);\n  slider.setLabel(\
  \ label );\n  slider.moveTo( box );\n  return slider;\n}\n```\n\n- 12. 我们还需要为每个滑块添加一个新的回调变量。\n\
  \n```\nvoid slider( float val ) { v1 = val; }\nvoid slider2( float val ) { v2 =\
  \ val;}\nvoid slider3( float val ) { v3 = val; }\nvoid slider4( float val ) { v4\
  \ = val; }\nvoid slider5( float val ) { v5 = val; }\nvoid slider6( float val ) {\
  \ v6 = val;}\n```\n\n- 13. 现在运行你的草图并更改滑块，以创建如下截图所示的形状：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_243_0.png)\n\
  \n## 任务完成 - 小型简报\n\n在本次任务中，我们拉伸了第一个任务中的二维形状并从中创建了一个圆柱体形式。我们添加了一个 Quaternion 类和两个接收鼠标按下和鼠标拖动事件的回调函数，并计算出一个旋转矩阵，使用户能够从所有方向查看我们草图中的对象。\n\
  \n\n\n\n为了让我们的对象更有趣，我们向 GUI 添加了四个额外的控制参数，并扩展了 getR() 函数，以便在计算半径时考虑圆柱的高度。\n\n## 导出对象\n\
  \n我们在之前的任务中创建了一个可以通过一些滑块更改的 3D 对象，但要在 3D 打印机上打印该对象，我们必须将其保存为 3D 打印机能理解的格式。当前的任务是添加一个导出函数，将对象保存为\
  \ STL（STereo Lithography）文件。这种文件格式最初是为立体光刻机（因此得名）而作为输入格式发明的，但几乎所有当前可用的 3D 软件都可以导入这些文件。该文件存储三角形的坐标以及每个三角形的法线向量。这就是该格式绰号为\
  \ Triangle Soup 的原因。\n\nSTL 文件有一个 80 字节的头部，所有已知的 3D 程序都会忽略它，因此我们将其设置为 0。然后，我们需要将三角形数量写为一个四字节无符号长整型。随后是每个三角形的\
  \ 12 个浮点数值，包含法线向量和顶点坐标。每个三角形以两个字节的零结束。\n\n## 启动推进器\n\n让我们导出一些三角形：\n\n- 1. 首先，我们添加一个类，用于存储网格由其构成的三角形。\n\
  - 单击右侧的图标并选择“新建选项卡...”菜单来添加新选项卡。\n- 将其命名为 Triangle，并添加以下代码：\n\n```\npublic class\
  \ Triangle {\n  PVector a;\n  PVector b;\n  PVector c;\n  PVector n;\n\n  public\
  \ Triangle( PVector a, PVector b, PVector c, PVector n ) {\n    this.a = a;\n  \
  \  this.b = b;\n    this.c = c;\n    this.n = n;\n  }\n}\n```\n\n- 2. 现在我们添加另一个选项卡并创建一个名为\
  \ TriangleSoup 的类。该类存储三角形，并以 STL 格式将它们写入文件。\n\n```\nimport java.io.FileOutputStream;\n\
  import java.nio.ByteBuffer;\nimport java.nio.ByteOrder;\nimport java.util.Arrays;\n\
  import java.io.FileOutputStream;\nimport java.io.IOException;\nimport java.util.List;\n\
  \npublic class TriangleSoup {\n\n\tList<Triangle> triangles = new ArrayList<Triangle>();\n\
  \tfloat scale = 1;\n\n\tvoid scale( float scale ) {\n\t\tthis.scale = scale;\n\t\
  }\n\n\tvoid add( PVector a, PVector b, PVector c, PVector n ) {\n\t\ttriangles.add(\
  \ new Triangle( a, b, c, n ) );\n\t}\n}\n```\n\n- 3. 当我们的网格的所有三角形对象都已添加到 Triangle\
  \ Soup 后，我们需要将其保存为 STL 文件。向我们的类添加以下方法：\n\n```\nvoid save( String filename ) {\n\
  try {\n\tbyte[] header = new byte[80];\n\tbyte[] count = new byte[4];\n\tbyte[]\
  \ tri = new byte[50];\n\n\tFileOutputStream out = new FileOutputStream( filename\
  \ );\n\tByteBuffer buffer = ByteBuffer.allocate( 80 );\n\tbuffer.order( ByteOrder.LITTLE_ENDIAN\
  \ );\n\n\tArrays.fill(header, 0, 80, (byte)0);\n\tout.write( header, 0, 80 );\n\t\
  buffer.putInt( triangles.size() );\n\tbuffer.rewind();\n\tbuffer.get( count, 0,\
  \ 4 );\n\tout.write( count, 0, 4 );\n\n\tfor( int i=0; i<triangles.size(); i++)\
  \ {\n\t\tbuffer.rewind();\n\t\tbuffer.putFloat( triangles.get(i).n.x * scale );\n\
  \t\tbuffer.putFloat( triangles.get(i).n.z * scale );\n\t\tbuffer.putFloat( triangles.get(i).n.y\
  \ * scale );\n\t\tbuffer.putFloat( triangles.get(i).a.x * scale );\n\t\tbuffer.putFloat(\
  \ triangles.get(i).a.z * scale );\n\t\tbuffer.putFloat( triangles.get(i).a.y * scale\
  \ );\n\t\tbuffer.putFloat( triangles.get(i).b.x * scale );\n\t\tbuffer.putFloat(\
  \ triangles.get(i).b.z * scale );\n\t\tbuffer.putFloat( triangles.get(i).b.y * scale\
  \ );\n\t\tbuffer.putFloat( triangles.get(i).c.x * scale );\n\t\tbuffer.putFloat(\
  \ triangles.get(i).c.z * scale );\n\t\tbuffer.putFloat( triangles.get(i).c.y * scale\
  \ );\n\t\tbuffer.putShort( (short)0 );\n\t\tbuffer.rewind();\n\t\tbuffer.get( tri,\
  \ 0, 50 );\n\t\tout.write( tri, 0, 50 );\n\t}\n\tout.flush();\n\tout.close();\n\
  } catch ( IOException ioe ) {\n\tioe.printStackTrace();\n}\n}\n```\n\n- 4. 回到主选项卡，我们需要在菜单中添加一个新按钮，该按钮打开文件选择框并允许用户输入导出文件的文件名。因此，我们现在将向\
  \ setupGUI() 方法添加一个新按钮定义。\n\n```\nvoid setupGUI() {\n    Button exportButton = cp5.addButton(\
  \ \"export\", 1, 10, 165, 120, 15 );\n    exportButton.setLabel( \"export\" );\n\
  \    exportButton.moveTo( box );\n}\n```\n\n- 5. 现在为导出按钮添加回调函数，并使用 `selectOutput()`\
  \ 方法创建文件对话框。第一个参数是对话框标题，第二个参数是当用户选择文件名并单击确定时被激活的回调方法名称。\n\n```\nvoid export() {\n\
  \    selectOutput( \"Export to STL\", \"exportCallback\" );\n}\n```\n\n- 6. 对话框的回调方法将用户选择的文件名作为字符串参数获取。如果用户取消对话框，文件名字符串将设置为\
  \ null。如果获得有效文件名，我们将其转换为绝对路径并创建 TriangleSoup 对象。为了使我们的对象可打印，我们需要确保它是封闭体积，而不是单面墙。我们添加\
  \ `exportOuter()` 和 `exportInner()` 方法来创建墙壁，以及 `exportBottom()` 和 `exportTop()`\
  \ 方法来关闭我们的对象。\n\n```\nvoid exportCallback(File exportFile) {\n    if ( exportFile\
  \ != null ) {\n    String filename = exportFile.getAbsolutePath();\n    TriangleSoup\
  \ export = new TriangleSoup();\n    export.scale( .5 );\n\n    exportOuter( export\
  \ );\n    exportInner( export );\n    exportBottom( export );\n    exportTop( export\
  \ );\n    export.save(filename);\n    }\n}\n```\n\n- 7. 现在我们需要为每个网格添加导出函数。`exportOuter()`\
  \ 方法为外墙创建三角形，然后计算三角形的法线向量。\n\n```\nvoid exportOuter( TriangleSoup export ) {\n \
  \   for ( int h = 1; h < 20; h++ ) {\n    for ( int a = 0; a<72; a++ ) {\n    int\
  \ ab = (a+1) % 72;\n    PVector p1 = new PVector( vertx[h][a], 95-h*5.0, verty[h][a]\
  \ );\n\n    PVector p2 = new PVector( vertx[h-1][a], 95-(h-1)*5.0, verty[h-1][a]\
  \ );\n    PVector p3 = new PVector( vertx[h][ab], 95-h*5.0, verty[h][ab] );\n  \
  \  PVector p4 = new PVector( vertx[h-1][ab], 95-(h-1)*5.0, verty[h-1][ab] );\n\n\
  \    PVector n1 = new PVector( - (p1.x+p2.x+p3.x)/3, 0, - (p1.y+p2.y+y+p3.y)/3 );\n\
  \    n1.normalize();\n    PVector n2 = new PVector( - (p2.x+p3.x+p4.x)/3, 0, - (p2.y+p3.y+y+p4.y)/3\
  \ );\n    n2.normalize();\n    export.add( p1, p2, p3, n1 );\n    export.add( p3,\
  \ p2, p4, n2 );\n    }\n    }\n}\n```\n\n- 8. 我们的 exportInner() 方法与 exportOuter()\
  \ 方法类似，但法线指向与 exportOuter() 方法中使用的相反方向，并且半径减小了 0.8。\n\n```\nvoid exportInner( TriangleSoup\
  \ export ) {\nfor ( int h = 1; h < 19; h++ ) {\nfor ( int a = 0; a<72; a++ ) {\n\
  int ab = (a+1) % 72;\nPVector p1 = new PVector( vertx[h][a] * 0.8, 95-h*5.0, verty[h][a]\
  \ * 0.8 );\nPVector p2 = new PVector( vertx[h-1][a] * 0.8, 95 - (h-1)*5.0, verty[h-1][a]\
  \ * 0.8 );\nPVector p3 = new PVector( vertx[h][ab] * 0.8, 95-h*5.0, verty[h][ab]\
  \ * 0.8 );\nPVector p4 = new PVector( vertx[h-1][ab] * 0.8, 95 - (h-1)*5.0, verty[h-1][ab]\
  \ * 0.8 );\nPVector n1 = new PVector( - (p1.x+p2.x+p3.x)/3, 0, - (p1.y+p2.y+y+p3.y)/3\
  \ );\nn1.normalize();\nPVector n2 = new PVector( - (p2.x+p3.x+p4.x)/3, 0, - (p2.y+p3.y+y+p4.y)/3\
  \ );\nn2.normalize();\nexport.add( p1, p2, p3, n1 );\nexport.add( p3, p2, p4, n2\
  \ );\n}\n}\n}\n```\n\n- 9. exportBottom() 方法创建两个三角形扇面以关闭网格底部。我们需要一个用于外墙的底部网格，以及一个略小且位于其上方的用于内墙的网格。\n\
  \n```\nvoid exportBottom(TriangleSoup export) {\nPVector n = new PVector( 0, -1,\
  \ 0 );\nPVector p1 = new PVector( 0, 5, 0 );\nfor ( int a = 0; a < 72; a++ ) {\n\
  int ab = (a+1) % 72;\nPVector p2 = new PVector( vertx[18][a]*0.8, 5, verty[18][a]*0.8\
  \ );\nPVector p3 = new PVector( vertx[18][ab]*0.8, 5, verty[18][ab]*0.8 );\nexport.add(\
  \ p1, p2, p3, n );\n}\nn = new PVector( 0, 1, 0 );\np1 = new PVector( 0, 0, 0 );\n\
  for ( int a = 0; a < 72; a++ ) {\nint ab = (a+1) % 72;\nPVector p2 = new PVector(\
  \ vertx[19][a], 0, verty[19][a] );\nPVector p3 = new PVector( vertx[19][ab], 0,\
  \ verty[19][ab] );\nexport.add( p1, p2, p3, n );\n}\n}\n```\n\n- 10. 最后，我们需要一个 exportTop()\
  \ 方法，它创建连接内网格和外网格的顶部环。\n\n```\nvoid exportTop(TriangleSoup export) {\nPVector n\
  \ = new PVector( 0, 1, 0 );\nfor ( int a = 0; a < 72; a++ ) {\nint ab = (a+1) %\
  \ 72;\nPVector p1 = new PVector( vertx[0][a], 95, verty[0][a] );\nPVector p2 = new\
  \ PVector( vertx[0][a]*0.8, 95, verty[0][a]*0.8 );\nPVector p3 = new PVector( vertx[0][ab],\
  \ 95, verty[0][ab] );\nPVector p4 = new PVector( vertx[0][ab]*0.8, 95, verty[0][ab]*0.8\
  \ );\nexport.add( p1, p2, p3, n );\nexport.add( p3, p2, p4, n );\n}\n}\n```\n\n\n\
  \n\n\n- 11. 现在运行草图并调整参数，直至创建出令你满意的花瓶。将网格导出为 STL 文件。我创建的网格之一看起来如下：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_250_0.png)\n\
  \n## 目标完成 - 小结简报\n\n本次任务的第三项任务是将花瓶的网格导出为 STL 文件。我们添加了 Triangle 类和 TriangleSoup 类，使我们能够将网格的三角形存储在列表中，然后导出该列表。TriangleSoup\
  \ 类负责以正确的二进制格式创建头部和顶点数据。\n\n我们在 GUI 中添加了一个按钮，用于打开文件选择框，并在用户选择文件名时调用回调函数。我们向草图中添加了一个\
  \ TriangleSoup 对象，并创建了导出方法，用于生成内外壁、底部三角扇形以及连接内外壁的顶部环。\n\n所有三角形创建并添加到我们的列表后，会调用 save()\
  \ 方法，从而创建出带有所选文件名的 STL 文件。\n\n## 将其变为现实\n\n当前任务的最后一项工作是获取第三项任务中导出的文件，并将其变为实物。我将展示如何在桌面3D打印机上打印这些STL文件，以及如何通过在线3D打印服务订购它们。本示例中使用的3D打印机是\
  \ Makerbot CupCake CNC (2009)。其他打印机使用不同的控制软件，但将STL文件转换为实物所需的步骤在各种打印机上非常相似。\n\n如果你家里没有3D打印机，可以尝试寻找附近的黑客空间或创客实验室。这些是制造者和黑客定期聚会的团体，用于分享项目并提供完成项目所需的工具和信息。如今，其中许多地方都拥有3D打印机。\n\
  \n从第9步开始，我还将展示如何使用在线3D打印服务订购你的物体。本示例中我使用了 http://www.shapeways.com，因为他们提供多种材料可供选择，并可配送到大多数国家。\n\
  \n## 启动推进器\n\n让我们打印我们的物体：\n\n- 1. 控制 Makerbot Cupcake 所需的软件称为 ReplicatorG，可从 http://replicat.org\
  \ 下载。本示例中，我使用了 0037 版本，因为最新版本不支持我的打印机。为你的平台下载 ReplicatorG。\n\n- 2. 打开上一步下载的文件并启动\
  \ ReplicatorG。\n\n- 3. 为生成正确的控制命令，你需要通过 机器 | 机器类型 (驱动程序) 选择要使用的打印机类型。\n\n- 4. 现在我们可以打开在上一项任务中从草图导出的\
  \ STL 文件。网格将作为预览呈现，并应看起来像此截图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_251_0.png)\n\
  \n- 5. 确保要打印的物体适合构建平台。如果需要，使用预览图像右侧的菜单对其进行移动和缩放。\n\n- 6. 当物体的尺寸和位置正确后，我们需要为你的机器生成\
  \ GCode。此步骤将物体切片为可打印的图层，并生成打印机用于定位打印头和控制挤出的控制命令。单击 **生成 GCode** 按钮，然后选择要使用的打印配置文件。\n\
  \n- 7. GCode 生成完成后，可通过 **GCode | 构建** 开始构建。下图显示了我的花瓶正在打印的情形：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_252_0.png)\n\
  \n- 8. 打印完成后，取一朵花，将其放入不久前还只是你电脑上几行代码的东西中。\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_252_1.png)\n\
  \n- 9. 如果你无法使用桌面3D打印机，可以使用在线打印服务，例如 [http://www.shapeways.com](http://www.shapeways.com)。\n\
  \n- 10. 注册用户帐户，并通过单击 **创建** 然后单击 **新产品** 开始订购流程。\n\n- 11. 然后，单击 **选择3D文件** 并上传我们在第三项任务中从草图导出的\
  \ STL 文件。\n\n- 12. 现在为你的物体选择材料。Shapeways 提供一系列材料，从塑料到陶瓷，甚至不锈钢。\n\n- 13. 对材料满意后，将其添加到购物车并下单。\n\
  \n- 14. 当使用 **白色坚固且柔韧** 材料时，花瓶（由草图创建）的外观如下：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_253_0.png)\n\
  \n## 目标完成 - 小结简报\n\n对于当前任务的最后一项工作，我们将虚拟3D物体变成了实物。\n我们使用 ReplicatorG 对模型进行切片并将其转换为\
  \ GCode 指令。这些代码\n随后由打印机解释，用于定位打印头并控制塑料丝的挤出。\n\n从第9步开始，我们学习了如何使用在线打印服务订购我们创建的物体。\n\
  本示例中我选择了 Shapeways，因为他们使用一种不同的3D打印机，支持非常广泛的材料范围，从塑料到陶瓷，甚至金属。\n根据你需要物体用于什么目的，即使你可以使用桌面3D打印机，在线服务也是一个有趣的选择。\n\
  \n## 任务完成\n\n在本次任务中，我们使用在圆柱坐标系中生成顶点的数学函数创建了一个虚拟3D物体，然后使用桌面3D打印机或在线打印服务将其变为实物。\n\n\
  在第一项任务中，我们使用将角度作为输入并为该角度计算半径的函数，创建了一个封闭的圆形2D形状。我们将此点从极坐标系转换为笛卡尔坐标系，并将其用作形状的顶点。然后，我们使用\
  \ controlP5 框架添加了一个 GUI，以便让草图的用户能够更改我们函数的参数。\n\n在第二项任务中，我们沿 Z 轴拉伸了创建的形状，形成了一个三维圆柱体。我们切换到所谓的圆柱坐标系，它使用角度、半径和高度来定义其点。我们扩展了函数，使其将高度作为第二个参数，并向\
  \ GUI 中添加了四个滑块来影响创建的形状。我们还通过为鼠标事件添加两个回调函数，实现了使用鼠标旋转物体的支持。我们使用四元数计算了旋转轴和角度。这是一种类似于复数的数学构造。\n\
  \n在第三项任务中，我们添加了将网格导出为 STL 文件的支持。这种文件格式存储 3D 网格，并可用作大多数3D打印机或3D建模工具的输入。我们添加了 `Triangle`\
  \ 类和 `TriangleSoup` 类，用于处理文件创建。为了使我们的物体可打印，我们需要确保物体封闭了一个可打印的体积，因此我们添加了一个稍小的第二个内壁，并在底部添加了两个三角扇形以及一个连接外壁和内壁的顶部网格来封闭网格。\n\
  \n最后，我们将导出的 STL 文件作为桌面3D打印机的输入。控制软件使用此文件为3D打印机创建 GCode 指令，以定位打印头并控制塑料丝的挤出。我们还使用\
  \ STL 文件从在线3D打印服务订购了我们的物体。\n\n## 你准备好大干一场了吗？一个高手挑战\n\n我们学习了如何创建一个最初只是一个数学函数和几行代码的实物，但当然，这不仅限于为你喜欢的花朵创建小花瓶。为什么不尝试一下以下想法之一：\n\
  \n- 生成3D打印首饰。\n- 从各种部分创建物体，这些部分可以组合成更大的物体。\n- 为你的函数使用额外的输入源，例如汇率甚至音频文件！\n- 使用 Kinect\
  \ 扫描物体并从中创建可打印的形状。\n\n\n\n\n\n# Symbols\n- 3D 扫描 29\n\n# A\n- addButton() 方法 221\n\
