  \ 功能，并定义一种文件格式，允许我们控制音乐和可视化器的顺序。\n\n## 为起飞做准备\n\n在此任务中，我们将创建一个文本文件，用于控制我们的播放列表以及显示可视化器的顺序。每个播放列表条目有两行。第一行仅包含\
