  \ = createGraphics( 700, 349 );\n    world = g.get(0,0,700,349);\n\n    sphere =\
  \ makeSphere( 150, 5, world);\n\n    edge = loadShader(\"edge.glsl\");\n}\n```\n\
  \n- 5. 现在打开文本编辑器，创建一个名为 edge.glsl 的文件，并输入以下代码：\n\n```\n#ifdef GL_ES\nprecision mediump\
