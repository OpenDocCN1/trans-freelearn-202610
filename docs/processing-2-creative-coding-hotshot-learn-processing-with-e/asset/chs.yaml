  \ {\n        this.ip = ip;\n        this.timestamp = timestamp;\n    }\n}\n```\n\
  \n12. 现在我们将在时间轴上为每个时间戳绘制一个标记。由于日志文件按时间戳排序，我们可以取数组的第一个和最后一个元素来获取时间轴的开始和结束时间。切换回主草图，并将以下代码添加到\
  \ draw() 方法中：\n\n```java\nvoid draw() {\n    background(0);\n    fill(255);\n  \
