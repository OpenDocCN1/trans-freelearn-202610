- "# 项目 1\n\n## 罗密欧与朱丽叶\n\n机器人与表演艺术有着悠久的历史。事实上，“Robot”一词最早于 1920 年由捷克作家 _Karel Čapek_\
  \ 的戏剧《Rossum's Universal Robots》中创造。该剧中有六个机器人，但由于当时无人能制造会说话的机器人，因此只能由人类来扮演。时代已大大改变，我们不再需要人类伪装成机器人。对于这个项目，我们将采用相反的方式，制作一些扮演人类的机器人。不幸的是，《Rossum's\
  \ Universal Robots》需要九名人类和六个机器人，因此我选择了一个更简单的场景来表演。我们将构建一对机器人，在《罗密欧与朱丽叶》中著名的阳台场景中扮演人类。\n\
  \n## 任务简报\n\n要为此项目创建 Processing 草图，我们需要安装 Processing 库 ttslib。该库是围绕 FreeTTS Java\
  \ 库的封装库，可帮助我们编写能够朗读文本的草图。我们将学习如何更改 FreeTTS 包中 `kevin16` 声音的语音参数，以使我们机器人的声音彼此可区分。我们还将创建一个解析器，它能够读取莎士比亚剧本，并生成文本行对象，从而使我们的脚本知道哪个机器人读哪一行。\n\
  \n将使用 Drama 线程来控制文本转语音对象，而我们草图的 `draw()` 方法将在机器人表演时将剧本打印到屏幕上，以防其中一台机器人忘记台词。最后，我们将使用一些纸板箱和一对廉价扬声器来创建机器人及其舞台。下图展示了机器人的工作原理：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_20_0.png)\n\n## 为什么这很棒？\n\n自 18 世纪以来，发明家们就一直在尝试制造会说话的机器（成效不一）。会说话的玩具在\
  \ 20 世纪 80 年代和 90 年代充斥市场。在每一部像样的科幻小说中，计算机和机器人都能说话。那么，制造会说话的机器人怎么可能不酷呢？还有什么比上演莎士比亚戏剧更适合测试这些说话能力呢？所以，如你所见，制造演员机器人是官方认证的酷，以防你的非极客家人提出疑问。\n\
  \n## 你的炫酷目标\n\n我们将把这个项目分为四个任务，指导你从头到尾生成机器人。以下是我们将要做的事项的简要概述：\n\n- 让 Processing 会说话\n\
  - 阅读莎士比亚作品\n- 添加更多演员\n- 构建机器人\n\n## 让 Processing 会说话\n\n由于 Processing 本身不具备说话功能，我们的第一个任务是使用新的\
  \ Processing 库管理器添加外部库。我们将使用 ttslib 包，它是围绕 FreeTTS 库的封装库。\n\n我们还将创建一个简短的会说话的 Processing\
  \ 草图来检查安装情况。\n\n## 启动推进器\n\n1. Processing 可以通过贡献的库进行扩展。这些额外的库中的大多数可以通过导航到“草图 | 导入库...\
  \ | 添加库...”来安装，如以下屏幕截图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_21_0.png)\n\
  \n2. 在“库管理器”对话框中，在搜索字段中输入 ttslib 以过滤库列表。\n\n3. 单击 **ttslib** 条目，然后单击 **安装** 按钮，如以下屏幕截图所示，以下载并安装该库：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_22_0.png)\n\n4. 要使用新库，我们需要将其导入到草图中。我们可以通过单击“草图”菜单并选择“导入库...”，然后选择\
  \ ttslib 来完成此操作。\n\n5. 我们现在将向草图添加 `setup()` 和 `draw()` 方法。目前我们将保持 `draw()` 方法为空，并在\
  \ `setup()` 方法中实例化一个 TTS 对象。你的草图应类似于以下代码片段：\n\n```\nimport guru.ttslib.*;\n\nTTS\
  \ tts;\nvoid setup() {\n  tts = new TTS();\n}\n\nvoid draw() {\n}\n```\n\n\n\n\n\
  \n下载示例代码\n您可以从 http://www.packtpub.com 上的帐户下载购买的所有 Packt 图书的示例代码文件。如果您在其他地方购买了此书，可以访问\
  \ http://www.packtpub.com/support 并注册，以便将文件直接发送到您的电子邮件。\n\n- 6. 现在我们将向草图添加一个 `mousePressed()`\
  \ 方法，当有人单击我们的草图窗口时将调用该方法。在此方法中，我们正在调用在 `setup()` 方法中创建的 TTS 对象的 `speak()` 方法。\n\n\
  ```\nvoid mousePressed() {\n    tts.speak(\"Hello, I am a Computer\");\n}\n```\n\
  \n- 7. 单击“运行”按钮启动 Processing 草图。应该会出现一个小灰窗口。\n\n- 8. 打开扬声器或戴上耳机，然后单击灰色窗口。如果一切正常，现在名为\
  \ kevin16 的友好男性计算机语音应该会向您问好。\n\n## 目标完成 - 小结简报\n\n在步骤 1 到 3 中，我们向 Processing 安装了一个额外的库。ttslib\
  \ 是围绕 FreeTTS 文本转语音引擎的封装库。\n\n然后我们创建了一个简单的 Processing 草图，它导入已安装的库并创建 `TTS` 类的一个实例。`TTS`\
  \ 对象与我们在草图中需要的扬声器相匹配。在此例中，我们只创建了一个扬声器，并添加了一个 `mousePressed()` 方法，该方法调用我们的 `tts`\
  \ 对象的 `speak()` 方法。\n\n## 阅读莎士比亚\n\n在项目的这部分中，我们将创建一个 `Drama` 线程，并教会 Processing 如何阅读莎士比亚剧本。该线程在后台运行并控制表演。在这个任务中，我们专注于阅读和执行剧本，并在下一个任务中添加扬声器。\n\
  \n## 发射准备\n\n我们的草图需要知道哪台机器人读取剧本中的哪一行。因此，我们需要将莎士比亚剧本转换为更易于机器读取的格式。对于每一行文本，我们需要知道哪个扬声器应该读取该行。因此，我们取剧本，并在我们的朱丽叶机器人应该说的每一行前面添加字母\
  \ J 和一个在脚本中其他任何地方都不使用的分隔字符，并为我们的罗密欧机器人应该说的每一行添加字母 R 和分隔字母。经过所有这些步骤后，我们的文本文件如下所示：\n\
  \n```\nR# Lady, by yonder blessed moon I vow,\nR# That tips with silver all these\
  \ fruit-tree tops --\n\nJ# O, swear not by the moon, the inconstant moon,\nJ# That\
  \ monthly changes in her circled orb,\nJ# Lest that thy love prove likewise variable.\n\
  \nR# What shall I swear by?\n\nJ# Do not swear at all.\nJ# Or if thou wilt, swear\
  \ by thy gracious self,\nJ# Which is the god of my idolatry,\nJ# And I'll believe\
  \ thee.\n```\n\n我已经将该剧本的剧本转换为这种格式，可以从图书支持页面 http://www.packtpub.com/support 下载。\n\
  \n## 启动推进器\n\n让我们编写解析器：\n\n- 1. 通过导航到 **文件 | 新建** 启动一个新草图。\n- 2. 添加 `setup()` 和\
  \ `draw()` 方法。\n- 3. 现在通过导航到 **草图 | 添加文件** 并选择刚才下载的文件，将准备好的脚本添加到 Processing 草图中。\n\
  - 4. 将以下行添加到 `setup()` 方法中：\n\n```\nvoid setup() {\n  String[] rawLines = loadStrings\n\
  \  (\"romeo_and_juliet.txt\" );\n}\n```\n\n- 5. 如果您重命名了文本文件，请相应地更改文件名。\n- 6. 单击右侧的小箭头图标并选择\
  \ **新建选项卡** 来创建新选项卡。\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_25_0.png)\n\n-\
  \ 7. 将类命名为 Line。此类将保存我们的文本行和扬声器。\n\n- 8. 将以下代码添加到刚创建的选项卡中：\n\n```\npublic class\
  \ Line {\nString speaker;\nString text;\n\npublic Line( String speaker, String text\
  \ ) {\nthis.speaker = speaker;\nthis.text = text;\n}\n}\n```\n\n- 9. 切换回主选项卡，并将以下高亮代码行添加到\
  \ setup() 方法中：\n\n```\nvoid setup() {\nString[] rawLines = loadStrings\n( \"romeo_and_juliet.txt\"\
  \ );\n\nArrayList lines = new ArrayList();\nfor ( int i=0; i<rawLines.length; i++\
  \ ) {\nif ( !\"\".equals(rawLines[i]) ) {\nString[] tmp = rawLines[i].split(\"#\"\
  );\nlines.add( new Line( tmp[0], tmp[1].trim() ) );\n}\n}\n}\n```\n\n- 10. 我们已读取文本行并将其解析到\
  \ `lines` 列表中，但仍需要一个类来处理我们的文本行。因此，单击箭头图标并从菜单中选择 **新建选项卡** 来创建另一个选项卡；将其命名为 **Drama**。\n\
  \n- 11. 我们的 `Drama` 类将是一个在后台运行并告诉每个扬声器对象读取一行文本的线程。将以下代码行添加到 `Drama` 类中：\n\n```\n\
  public class Drama extends Thread {\nint current;\nArrayList lines;\nboolean running;\n\
  \npublic Drama( ArrayList lines ) {\nthis.lines = lines;\ncurrent = 0;\nrunning\
  \ = false;\n}\n\npublic int getCurrent() {\nreturn current;\n}\n\npublic Line getLine(\
  \ int num ) {\nif ( num >=0 && num < lines.size() ) {\nreturn (Line)lines.get( num\
  \ );\n} else {\nreturn null;\n}\n}\n\npublic boolean isRunning() {\nreturn running;\n\
  }\n}\n```\n\n- 12. 现在我们添加一个 run() 方法，如果启动线程，该方法将在后台执行。由于我们还没有扬声器对象，我们将把行打印到控制台，并在每行后面加入短暂的暂停。\n\
  \n```\npublic void run() {\n    running = true;\n\n    for ( int i =0; i < lines.size();\
  \ i++ ) {\n        current = i;\n        Line l = (Line)lines.get(i);\n        System.out.println(\
  \ l.text );\n        delay( 1 );\n    }\n    running = false;\n}\n```\n\n- 13. 切换回主草图选项卡，并将高亮代码添加到\
  \ setup() 方法中以创建 drama 线程对象，然后向其提供解析后的文本行。\n\n```\nDrama drama;\n```\n\n```\nvoid\
  \ setup() {\n    String[] rawLines = loadStrings\n        ( \"romeo_and_juliet.txt\"\
  \ );\n    ArrayList lines = new ArrayList();\n    for ( int i=0; i<rawLines.length;\
  \ i++ ) {\n        if ( !\"\".equals(rawLines[i]) ) {\n            String[] tmp\
  \ = rawLines[i].split(\"#\");\n            lines.add( new Line( tmp[0], tmp[1].trim()\
  \ ) );\n        }\n    }\n    drama = new Drama( lines );\n}\n```\n\n- 14. 到目前为止，我们的草图解析文本行并创建一个\
  \ Drama 线程对象。接下来我们需要一个方法来启动它。因此，添加一个 mousePressed() 方法来启动 drama 线程。\n\n```\nvoid\
  \ mousePressed() {\n    if ( !drama.isRunning() ) {\n        drama.start();\n  \
  \  }\n}\n```\n\n- 15. 现在向 `draw()` 方法添加一些文本来告诉用户该做什么。将以下代码添加到 `draw()` 方法中：\n\n\
  ```\nvoid draw() {\n  background(255);\n  textAlign(CENTER);\n  fill(0);\n\n  text(\
  \ \"Click here for Drama\", width/2, height/2 );\n}\n```\n\n- 16. 目前，我们的草图窗口太小，无法容纳文本，我们还想使用更大的字体。要更改窗口大小，只需将以下行添加到\
  \ `setup()` 方法中：\n\n```\nvoid setup() {\n  size( 800, 400 );\n\n  String[] rawLines\
  \ = loadStrings\n  ( \"romeo_and_juliet.txt\" );\n  ArrayList lines = new ArrayList();\n\
  \  for(int i=0; i<rawLines.length; i++) {\n    if (\"\".equals(rawLines[i])) {\n\
  \      String[] tmp = rawLines[i].split(\"#\");\n      lines.add( new Line( tmp[0],\
  \ tmp[1].trim() ) );\n    }\n  }\n\n  drama = new Drama( lines );\n}\n```\n\n- 17.\
  \ 要更改所用字体，我们需要告诉 Processing 使用哪种字体。找出计算机上当前安装的字体名称的最简单方法是创建一个新草图，输入以下行并运行草图：\n\n\
  ```\nprintln(PFont.list());\n```\n\n- 18. 复制您喜欢的字体名称之一，并将以下行添加到罗密欧与朱丽叶草图中：\n\n```\n\
  void setup() {\n  size( 800, 400 );\n  textFont( createFont( \"Georgia\", 24 ) );\n\
  \n  ...\n}\n```\n\n- 19. 将代码行中的字体名称替换为计算机上的字体之一。\n\n## 目标完成 - 小结简报\n\n在本节中，我们编写了解析文本文件并生成\
  \ `Line` 对象列表的代码。这些对象随后由 `Drama` 线程使用，该线程在任何人单击草图窗口时在后台运行。目前，`Drama` 线程在控制台上打印文本行。\n\
  \n在步骤 6 到 8 中，我们创建了 `Line` 类。这个类非常简单，所谓的 **普通旧 Java 对象（POJO）**，用于保存我们的文本行，但不添加任何功能。\n\
  \n控制我们戏剧表演的代码是在步骤 10 到 12 中创建的。我们创建了一个能够在后台运行的线程，因为在下一步中，我们希望能够同时使用 `draw()` 方法和一些\
  \ `TTS` 对象。\n\n步骤 12 中的代码块定义了一个名为 `running` 的布尔变量，我们在 `mousePressed()` 方法中使用它来检查草图是否已经运行或应该启动。\n\
  \n## 机密情报\n\n在步骤 17 中，我们使用了 `PFont` 类的 `list()` 方法来获取已安装字体的列表。这是 Processing 中非常常见的模式。您可以使用相同的方法来获取已安装的\
  \ midi 接口、网络摄像头、串行端口等列表。\n\n## 添加更多演员\n\n在这个任务中，我们将结合之前两个任务中所做的内容，并向 `Drama` 线程添加一些\
  \ `TTS` 对象。在这个场景中，我们需要两个机器人演员，它们使用不同的声音说话，并且由于我们想要构建每个都包含扬声器的机器人，我们需要一个 `TTS` 对象在左扬声器上说话，另一个在右扬声器上说话。\n\
  \n不幸的是，FreeTTS 只附带一个男声，因此我们必须提高朱丽叶机器人的声音音调。\n\n## 启动推进器\n\n- 1. 首先，我们打开上一个任务中的草图，并首先为每个机器人演员创建两个\
  \ `TTS` 对象。两者都使用名为 `kevin16` 的默认语音，但我们会更改朱丽叶机器人的音调。\n\n```\nvoid setup() {\n  size(\
  \ 800, 400 );\n  textFont( createFont( \"Georgia\", 24 ) );\n}\n```\n\n\nString[]\
  \ rawLines = loadStrings(\"romeo_and_juliet.txt\");\nArrayList lines = new ArrayList();\n\
  for (int i = 0; i < rawLines.length; i++) {\n  if (!\"\".equals(rawLines[i])) {\n\
  \    String[] tmp = rawLines[i].split(\"#\");\n    lines.add(new Line(tmp[0], tmp[1].trim()));\n\
  \  }\n}\n\nTTS romeo = new TTS();\nTTS juliet = new TTS();\njuliet.setPitchShift(2.4);\n\
  drama = new Drama(lines, romeo, juliet);\n\n- 2. 切换到 Drama 线程，并为我们的角色添加两个变量。\n\n\
  ```\npublic class Drama extends Thread {\nTTS romeo;\nTTS juliet;\n\nint current;\n\
  ArrayList lines;\nboolean running;\n...\n}\n```\n\n- 3. 我们还需要扩展 Drama 类的构造函数，以便添加角色。\n\
  \n```\npublic Drama(ArrayList lines, TTS romeo, TTS juliet) {\nthis.lines = lines;\n\
  this.romeo = romeo;\nthis.juliet = juliet;\ncurrent = 0;\nrunning = false;\n}\n\
  ```\n\n- 4. 在 run() 方法中，我们获取当前行，并根据添加到每行中的 actor 变量选择角色对象。我们也不再需要 delay() 和 println()\
  \ 方法。\n\n```\npublic void run() {\nrunning = true;\n\nfor (int i = 0; i < lines.size();\
  \ i++) {\n  current = i;\n  Line l = (Line) lines.get(i);\n\n  if (\"J\".equals(l.speaker))\
  \ {\n    juliet.speak(l.text);\n  }\n  if (\"R\".equals(l.speaker)) {\n    romeo.speak(l.text);\n\
  \  }\n}\nrunning = false;\n}\n```\n\n- 5. 由于我们的每个机器人都有自己的扬声器，我们不想在两个扬声器上都听到文本。我们希望一个机器人使用右声道，另一个机器人使用左声道。幸运的是，ttslib\
  \ 提供了 speakLeft() 和 speakRight() 方法，正好满足我们的需求。因此，将两个 speak() 方法更改为如下所示：\n\n```\n\
  ...\nif (\"J\".equals(l.speaker)) {\n  juliet.speakLeft(l.text);\n}\nif (\"R\".equals(l.speaker))\
  \ {\n  romeo.speakRight(l.text);\n}\n...\n```\n\n- 6. 目前，我们的 draw() 方法有些乏味，而且如果\
  \ drama 线程已经在运行，也有些误导。因此，我们将更改它以显示当前正在读取的脚本的五行。向 draw() 方法添加一个 if 语句，以检查我们之前添加到\
  \ Drama 线程的 running 变量的状态。\n\n```\nvoid draw() {\n  background(255);\n  textAlign(CENTER);\n\
  \  fill(0);\n\n  if (!drama.isRunning()) {\n    text(\"Click here for Drama\", width/2,\
  \ height/2);\n  } else {\n  }\n}\n```\n\n- 7. 现在我们添加一个 `for` 循环，在草图窗口中显示前两行、当前正在读取的行以及接下来的两行文本。我们现在将更改文本对齐方式，以便与机器人角色的扬声器匹配。如果我们的机器人使用\
  \ `speakRight()`，文本将右对齐；如果使用 `speakLeft()`，文本将左对齐。\n\n```\nvoid draw() {\n  background(255);\n\
  \  textAlign(CENTER);\n  fill(0);\n\n  if (!drama.isRunning()) {\n    text(\"Click\
  \ here for Drama\", width/2, height/2);\n  } else {\n    int current = drama.getCurrent();\n\
  \    for (int i = -2; i < 3; i++) {\n      Line l = drama.getLine(i + current);\n\
  \      if (l != null) {\n        if (\"J\".equals(l.speaker)) {\n          textAlign(LEFT);\n\
  \          text(l.text, 10, height/2 + i * 30);\n        } else {\n          textAlign(RIGHT);\n\
  \          text(l.text, width - 10, height/2 + i * 30);\n        }\n      }\n  \
  \  }\n  }\n}\n```\n\n- 8. 为了更突出地显示当前行，我们将更改文本颜色。我们将当前行的颜色设置为黑色，所有其他行设置为较浅的灰色，方法是在\
  \ for 循环中添加一个 `fill()` 语句。\n\n```\nfor (int i = -2; i < 3; i++) {\n  fill(abs(i)\
  \ * 100);\n  Line l = drama.getLine(i + current);\n  if (l != null) {\n    if (\"\
  J\".equals(l.speaker)) {\n      textAlign(LEFT);\n      text(l.text, 10, height/2\
  \ + i * 30);\n    } else {\n      textAlign(RIGHT);\n      text(l.text, width -\
  \ 10, height/2 + i * 30);\n    }\n  }\n}\n```\n\n- 9. 现在运行你的代码，单击草图窗口以启动 drama 线程。\n\
  \n## 任务完成 - 简要汇报\n\n在我们当前任务的这一步骤中，我们添加了两个 TTS 对象并更改了声音参数，使它们听起来不同（在步骤 1 中）。然后我们扩展了\
  \ Drama 线程，并为机器人角色的声音添加了 TTS 对象。在步骤 4 和 5 中，我们修改了 run 方法，以使用我们刚刚创建的声音，而不仅仅是打印文本行。\n\
  \n在步骤 6 到 9 中，我们对 draw() 方法进行了更改，使其显示五行文本。当前正在播放的行是黑色的，前后两行则淡化为浅灰色。\n\nfill() 方法不仅用于更改对象的填充颜色，还用于更改文本颜色。因为我们的\
  \ for 循环索引从 -2 到 2，我们可以简单地取其绝对值并乘以 100 来获取灰度级别。以下是运行中的草图的截图：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_33_0.png)\n\
  \n## 机密情报\n\nFreeTTS 和 ttslib 还允许你使用名为 MBROLA 的二进制 TTS 引擎。不幸的是，它只以二进制形式分发，并且在撰写本文时，它只适用于\
  \ Linux。所以，如果你正在使用 Linux 并想尝试一下，可以对我们的 Romeo and Juliet 草图做出以下更改：\n\n- 1. 在浏览器中打开\
  \ http://ctts.fpms.ac.be/synthesis/mbrola.html 并点击 Download。下载适用于你平台的 MBROLA 二进制文件。\n\
  - 2. 从 MBROLA 网站下载 female_us1 音色。\n- 3. 为 MBROLA 二进制文件创建一个文件夹，并解压你刚刚下载的两个包。确保 MBROLA\
  \ 二进制文件的路径中不含空格，因为 FreeTTS 无法处理空格。\n- 4. 将 MBROLA 二进制文件重命名为 mbrola。\n- 5. 现在回到你的\
  \ Romeo and Juliet 草图，并在 setup() 方法中添加以下突出显示的行：\n\n```\nvoid setup() {\n  System.setProperty(\"\
  mbrola.base\", \"/path/to/mbrola/\");\n\n  size(800, 400);\n  textFont(createFont(\"\
  Georgia\", 24));\n\n  String[] rawLines = loadStrings(\"romeo_and_juliet.txt\");\n\
  \  ArrayList lines = new ArrayList();\n  for (int i = 0; i < rawLines.length; i++)\
  \ {\n    if (!\"\".equals(rawLines[i])) {\n      String[] tmp = rawLines[i].split(\"\
  #\");\n      lines.add(new Line(tmp[0], tmp[1].trim()));\n    }\n  }\n\n  drama\
  \ = new Drama(lines);\n  TTS romeo = new TTS();\n  TTS juliet = new TTS();\n  juliet.setPitchShift(2.4);\n\
  \  drama = new Drama(lines, romeo, juliet);\n}\n```\n\n- 6. 将系统属性的路径指向包含你的 mbrola\
  \ 二进制文件和 us1 音色的文件夹。\n- 7. 现在你可以将 Juliet TTS 对象更改为以下内容：`TTS juliet = new TTS(\"\
  mbrola_us1\");`\n- 8. 你还需要更改声音的音调，因为 mbrola_us1 已经是女性声音，我们不再需要模拟它了。\n\nMBROLA 是在比利时蒙斯理工学院开发的文本转语音引擎。作者要求每篇提及其作品的出版物都必须提及他们的书籍，《文本转语音合成导论》，Thierry\
  \ Dutoit，Kluwer Academic Publishers，多德雷希特，精装，ISBN 1-4020-0369-2，1997 年 4 月，312 页。\n\
  \n## 构建机器人\n\n现在我们准备好进行 Romeo and Juliet 项目的最后一项任务了。我们将拿一些纸箱、泡沫塑料球和一对廉价扬声器或耳机，将它们变成我们的机器人演员。\n\
  \n本节中描述的机器人只是我的版本。如果你喜欢，可以按照自己的想法构建完全不同的机器人，可以复杂也可以简单。\n\n## 为起飞做准备\n\n要构建我们的机器人，我们需要一些材料和工具，这些材料和工具不应该太难找到。我为我的机器人演员使用了以下材料：\n\
  \n- 两个用于机身的纸箱\n- 两个用于头部的泡沫塑料球\n- 一对廉价扬声器或耳机\n- 活动眼珠\n- 丙烯酸颜料\n- 记号笔\n- 针\n- 热熔胶枪\n\
  \n以下图片显示了我用于机器人的主要材料：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_36_0.png)\n\n\
  ## 启动推进器\n\n让我们来构建一些机器人：\n\n- 1. 拆解你的扬声器，尝试去掉外壳。我们只需要扬声器，但请确保不要移除或破坏电缆。\n- 2. 在纸箱上剪一个扬声器应安装的位置的孔。让孔稍微比扬声器小一点，如下图所示，因为我们稍后需要将它们粘到盒子上：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_36_1.png)\n\n\n\n\n- 3. 给你的纸箱上色。我做了一个白色，另一个绿色。\n\
  - 4. 在纸箱晾干期间，如下图所示在头部上涂一些头发。我给 Romeo-Robot 的头发涂成了黑色，给 Juliet-Robot 的头发涂成了棕色。\n\n\
  ![](img/5cb67baa7bc7778de360b14c00d1ab81_37_0.png)\n\n- 5. 油漆干了之后，像下图所示用热胶将扬声器固定在纸箱上。确保不要将任何胶水沾到扬声器的膜片上。\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_37_1.png)\n\n- 6. 现在使用记号笔为机器人画一张脸。你可以在下图中看到我机器人的脸：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_38_0.png)\n\n- 7. 使用针将头部固定到机器人的身体上。\n\
  - 8. 现在将你的机器人演员连接到声卡，并把 Juliet 放在一个阳台上（例如一个空鞋盒），让它们表演。\n\n## 任务完成 - 简要汇报\n\n在此任务中，我们通过为机器人演员构建身体来完成它们。我们使用了一些纸箱，给它们上色，并通过将一对廉价扬声器粘进箱子中来添加它们。每个机器人都得到了一个涂了漆的发泡聚苯球制成的头。\n\
  \n如我之前在本任务介绍中所说，构建机器人没有对错之分。你可以随意构建大小。加上一些头发，给它们做个鼻子，给 Juliet 缝一件连衣裙，给 Romeo 画个小胡子，等等。\n\
  \n## 任务完成\n\n在此任务中，我们通过安装 ttslib 库为 Processing 添加了语音功能。我们学习了如何通过改变音调或在 Linux 上安装额外的\
  \ TTS 引擎来模拟多个扬声器。\n\n我们还为莎士比亚剧本定义了一种说话文本格式，以便更容易地解析，并创建了一个 `Drama` 线程来管理我们的文本行并控制我们的机器人。\n\
  \n我们完成了机器人演员，它们正迫不及待地等待在观众面前表演。所以，召集你的朋友和家人，为你的机器人搭建一个舞台。他们会喜欢的，相信我。好吧，至少你的机器人会喜欢，如下图所示：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_39_0.png)\n\n## 准备好大干一场了吗？高手挑战\n\n既然你已经完成了机器人演员的构建，为什么不尝试将它们提升到下一个水平呢？\n\
  \n- 让它们表演不同的戏剧。外面有很多著名的对话可以由你的机器人演员表演。\n- 目前你的机器人演员是固定不动的。尝试添加一些舵机，并使用 Arduino 让它们移动头部。\n\
  - 将一些网络摄像头连接到你的电脑，并使用 Processing 从不同角度录制表演视频。\n- 让你的机器人演员与一位真实演员一起表演一出戏。\n- 让你的机器人从网络读取实时输入，例如\
  \ Twitter 源或新闻。\n- 你的机器人不必长得像人类；让它们看起来像僵尸、外星人、动物等等。\n"
- "# 项目 2\n\n火柴人舞蹈团\n\n在项目 1《罗密欧与朱丽叶》中，我们学习了如何让 Processing 说话。在此项目中，我们将学习如何让它看和跳舞。我们将使用\
  \ Microsoft 的 Kinect 来实现视觉部分，并用一个跳舞的人来教一群火柴人如何跳舞。除非你找到其他人愿意带领你的火柴人，否则你自己得起来跳舞。\n\
  \n计算机视觉和 3D 扫描长期以来一直是非常专业且昂贵的硬件和软件的领域。随着 CPU 和显卡计算能力的不断提升，以及像 Kinect 这样的新型硬件控制器，计算机视觉项目已通过各种游戏控制器进入客厅，并对你我这样的日常程序员变得可及。\n\
  \n## 任务简报\n\n在此项目中，我们将学习如何将 Microsoft 的 Kinect 连接到电脑，并使用 Processing 中的深度成像和用户跟踪。我们将在第一个任务中快速安装\
  \ OpenNI 框架，因为这个库被 Processing 库 SimpleOpenNI 使用。然后，我们将学习如何使用 Kinect 红外摄像头的深度图像功能以及\
  \ Processing 中的玩家跟踪功能。\n\n接着，我们将使用所谓的骨骼跟踪器，不仅用于定位摄像头前面的用户，还包括头部、颈部和肘部。这些 3D 坐标将允许我们控制一个火柴人。\n\
  \n在当前任务的最后一个任务中，我们将添加一群额外的舞者，他们也将由玩家肢体的 3D 坐标控制。\n\n你可以在这里看到最终草图的屏幕截图：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_42_0.png)\n\
  \n## 为什么很酷？\n\nKinect 为与计算机交互带来了许多全新的可能性。它使玩家只需在计算机前移动即可控制计算机。这有多酷？而且作为一个不错的副作用，它让计算机用户动起来——这是计算机用户通常不擅长的事情。\n\
  \n> **免责声明**\n> \n> 如果你强行将肢体放入已被其他时空聚集体占据的地方，作者不承担由此产生的伤害和事故责任。所以，请确保在跳舞时你周围有足够的空间。\n\
  \n除了跟踪用户身体部位的位置外，Kinect 还为我们提供了周围玩家的深度图，以及一个位图，允许我们确定图像中哪些像素属于玩家，哪些不属于。\n\n## 你的目标\n\
  \n这个 Hotshot 项目分为以下四个任务：\n\n- 连接 Kinect\n- 让 Processing 看见\n- 制作舞者\n- 跳舞！跳舞！跳舞！\n\
  \n## 任务清单\n\n要完成此任务，你需要一台 Kinect 来连接到你的电脑。Kinect 通过 USB 端口连接，但它需要的电量比标准 USB 端口能提供的更多。因此，Kinect\
  \ 配备了一个非标准的 USB 连接器和一个单独的电源连接器。如果你是随 Xbox 360 一起购买的 Kinect，你可能需要为它购买一个 USB 电源适配器；较新版本的\
  \ Xbox 360 提供了一个专用端口来直接连接 Kinect。你可以在电子产品商店或网上购买适配器。\n\n由于这个项目是关于跳舞的，你还需要一些音乐来跳舞。我们要创建的火柴人对音乐类型非常包容，所以请随意选择你喜欢的任何音乐——Donna\
  \ Summer、Zillertaler Schürzenjäger、Bobby Brown、Skrillex。如果你喜欢，你的火柴人也会喜欢。\n\n## 连接\
  \ Kinect\n\n在此第一个任务中，我将指导你安装 OpenNI 框架和一个来自 PrimeSense（开发适用于 Microsoft 的 Kinect\
  \ 的公司）的库。我们将使用 OpenNI 示例程序来测试我们的安装。\n\n## 启动推进器\n\n- 1. 在撰写本文时，OpenNI 框架的最新版本是 2.1\
  \ Beta，但我们将用于下一个任务的 Processing 框架需要 OpenNI 框架的 1.5.4 版本。在浏览器中打开网站 `http://www.openni.org/openni-sdk/openni-sdk-history-2/`，如下图所示，并选择适用于你平台的下载包：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_44_0.png)\n\n- 2. 如果你运行的是 Linux 或 Mac\
  \ OS X，打开一个终端窗口，进入下载文件的目录，并使用 `tar` 命令解包；确保以 root 身份运行 `install.sh` 脚本进行解包：\n\n\
  ```\ntar xvjf openni-bin-dev-linux-x86-v1.5.4.0.tar.bz2\ncd OpenNI-Bin-Dev-Linux-x86-v1.5.4.0\n\
  sudo ./install.sh\n```\n\n- 3. 在 Windows 上，直接运行你下载的 MSI 文件。\n- 4. 对 NiTE v1.5.2.21\
  \ 文件重复上述步骤，下载包并使用以下命令安装：\n\n```\ntar xvfj nite-bin-Linux-x86-v1.5.2.21.tar.bz2\n\
  cd NITE-Bin-Dev-Linux-x86-v1.5.2.21/\nsudo ./install.sh\n```\n\n- 5. 现在访问 https://github.com/avin2/SensorKinect/tree/unstable/Bin\
  \ 并下载 Kinect 的传感器包。你不需要从 http://openni.org 获取的传感器包；那是用于另一个传感器条的，无法与 Kinect 配合使用。\n\
  - 6. 解包传感器包，并在 Linux 或 Mac OS X 上通过运行以下命令安装：\n\n```\ntar xvfj SensorKinect093-Bin-Linux-x86-v5.1.2.1.tar.bz2\n\
  cd Sensor-Bin-Linux-x86-v5.1.2.1/\nsudo ./install.sh\n```\n\n- 7. 在 Windows 上，通过双击\
  \ MSI 文件来安装传感器包文件。\n- 8. 现在将 Kinect 连接到电源适配器，然后连接到空闲的 USB 插槽，并将其放置在显示器前。确保你的房间里有足够的空间站在传感器条前面，如下图所示：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_45_0.png)\n\n- 9. 进入开发包，从 OpenNI-Bin-Dev-Linux-x86-v1.5.4.0/Samples/Bin/\
  \ 下的 x86-Release 文件夹运行 NiViewer 示例程序：\n\n```\ncd ../OpenNI-Bin-Dev-Linux-x86-v1.5.4.0\n\
  cd Samples/Bin/x86-Release/\n./NiViewer\n```\n\n\n\n\n- 10. 在Kinect传感器前放置一个人，并让他/她移动。在下面的截图中，你可以看到作者移动他的咖啡杯：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_46_0.png)\n\n## 目标完成 - 简要总结\n\n我们刚刚下载并安装了OpenNI开源驱动程序，以访问Kinect传感器板。这些驱动程序允许我们从Kinect控制器访问红外和RGB图像。Kinect还使用红外摄像头进行深度扫描，并能够跟踪用户。\n\
  \n安装开发工具包、中间件驱动程序和Kinect控制器的传感器板后，我们使用开发工具包中的一个示例程序来测试安装。\n\n## 机密情报\n\n除了Kinect之外，还有其他使用PrimeSense技术并受OpenNI包支持的传感器条。要使用这些设备，你需要从\
  \ http://www.openni.org 安装传感器包，我们在启动推进器部分跳过了此步骤。\n\n我使用Kinect运行并测试了本项目中的程序，但你也可以尝试使用其他传感器条，例如PrimeSense传感器或ASUS\
  \ Xtion。\n\n## 让Processing看见\n\n我们的下一个任务是安装SimpleOpenNI库。该库使我们能够在Processing中使用OpenNI\
  \ API。首先，我们将学习如何访问和显示Kinect控制器的深度图像。然后，我们将使用SimpleOpenNI框架的用户跟踪功能，并定义一些回调函数，以便在检测到用户或跟踪的用户消失时收到通知。最后，我们将为深度图像中属于用户的所有像素着色，以便用户能够看到正在跟踪的内容。\n\
  \n## 启动推进器\n\n让我们教会Processing如何看见：\n\n- 1. 在撰写本文时，SimpleOpenNI框架无法使用新的库管理器进行安装。要手动安装，请从\
  \ http://code.google.com/p/simple-openni/downloads/list 下载适用于您操作系统的SimpleOpenNI包。\n\
  \n- 2. 将其解压缩到`sketchbook`文件夹中名为`library`的文件夹。你可以在**首选项**对话框中找到该文件夹的路径。\n\n- 3. 如果Processing当前正在运行，请重启它，以确保你的安装能找到该库。\n\
  \n- 4. 现在，创建一个新的草图，并在**草图**菜单下点击**导入库 ...** 以包含SimpleOpenNI库。\n\n- 5. 向你的草图添加`setup()`和`draw()`方法。\n\
  \n```\nimport SimpleOpenNI.*;\n\nvoid setup() {\n}\n\nvoid draw() {\n}\n```\n\n\
  - 6. 在`setup()`方法中，将草图窗口大小调整为640 x 480像素，并定义一个OpenNI上下文对象。我们使用`enableDepth()`方法开始捕获深度图像，并使用`setMirror()`激活镜像功能。\n\
  \n```\nimport SimpleOpenNI.*;\nSimpleOpenNI context;\nvoid setup() {\nsize( 640,\
  \ 480 );\ncontext = new SimpleOpenNI( this );\ncontext.setMirror( true );\ncontext.enableDepth();\n\
  }\n```\n\n- 7. 现在将以下行添加到你的 draw() 方法中，以便SimpleOpenNI加载下一帧并计算深度图像。然后，使用 context.depthImage()\
  \ 以 PImage 对象的形式获取数据，并使用 image() 将其绘制到你的草图窗口中。\n\n```\nvoid draw() {\ncontext.update();\n\
  image( context.depthImage(), 0, 0 );\n}\n```\n\n- 8. 运行你的草图并对着摄像头挥手。你应该能看到你自己和周围环境的深度图像。\n\
  \n- 9. 在 setup 方法中通过添加以下行来启用用户检测：\n\n```\nvoid setup() {\nsize( 640,480 );\ncontext\
  \ = new SimpleOpenNI( this );\ncontext.setMirror( true );\ncontext.enableDepth();\n\
  context.enableUser( SimpleOpenNI.SKEL_PROFILE_ALL );\n}\n```\n\n- 10. 你还需要一个变量来存储SimpleOpenNI框架检测到的第一个用户的\
  \ userId，因此在草图开头添加一个 player 变量并将其初始化为 -1。\n\n```\nint player = -1;\n```\n\n- 11.\
  \ 为了在SimpleOpenNI检测到用户时收到通知，我们向草图添加以下两个回调方法：\n\n```\nvoid onNewUser( int userId\
  \ ) {\nprintln( \"new user \" + userId );\nplayer = userId;\n}\n```\n\n```\nvoid\
  \ onLostUser( int userId ) {\nprintln( \"lost user \" + userId );\nif ( userId ==\
  \ player ) {\nplayer = -1;\n}\n}\n```\n\n- 12. 要查看Kinect在哪里发现了用户，你需要让图像中属于用户的所有像素都显示为绿色。你可以通过将以下代码添加到我们的\
  \ draw() 方法中来实现这一点：\n\n```\nvoid draw() {\n context.update();\n image( context.depthImage(),\
  \ 0, 0 );\n\n loadPixels();\n if ( player != -1 ) {\n int[] userPixels = context.getUsersPixels(\
  \ player );\n\n for( int p = 0; p < width * height; p++) {\n if ( userPixels[p]\
  \ != 0 ) {\n pixels[p] = color( 0, green( pixels[p] ), 0 );\n }\n }\n }\n updatePixels();\n\
  }\n```\n\n- 13. 如果你现在运行代码，检测到的用户的像素应该变成绿色，如下面的截图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_49_0.png)\n\
  \n## 目标完成 - 简要总结\n\n我们刚刚学习了如何使用Processing访问Kinect提供的深度图像。从步骤 9 开始，我们使用了SimpleOpenNI框架的跟踪功能。我们添加了一个名为\
  \ onNewUser() 的回调函数，每次检测到用户时库都会调用它，还添加了一个名为 onLostUser() 的第二个函数，以便在用户不再在跟踪范围内时收到通知。\n\
  \n在我们的 draw() 方法中，我们使用了从 getUsersPixels() 方法获得的像素映射，如果深度图像中的像素属于用户则将其着色为绿色，否则保持不变。函数\
  \ getUsersPixels() 返回的数组中，每个非用户像素的值为 0，我们要着色的像素值为 1。对于属于用户像素的每个 1，我们获取深度图像的当前灰度值，并将其替换为相同强度的绿色值。\n\
  \n## 机密情报\n\n除了红外和RGB摄像头外，Kinect还配备了电机控制，以允许调整摄像头倾斜度。不幸的是，OpenNI框架不支持控制电机。有一个名为\
  \ libfreenect 的第二个开源框架，可用于访问Kinect。它缺乏OpenNI的用户跟踪功能，但支持电机控制。因此，如果你需要调整Kinect的倾斜度，因为它臭名昭著地会切断玩家的头部或脚部，你可以安装\
  \ libfreenect 库和演示应用程序，并使用它们来调整你的Kinect。\n\n## 制作舞者\n\n在上一节中，我们使用OpenNI框架的用户跟踪功能来定位Kinect红外摄像头提供的深度图像中的用户。现在我们将进一步定位玩家的身体部位。我们将在本任务中使用的功能称为骨骼跟踪。OpenNI骨骼追踪器定位人体的某些关键点，我们将使用这些关键点来构建我们的火柴人。对于每个玩家，Kinect可以看到并获取头部、颈部、躯干、肩膀、手肘、手部、臀部、膝盖和脚部的位置。\n\
  \n我们还将上一节中使用的红外摄像头图像和用户像素作为一个小型抬头显示（HUD）显示，以便玩家能够看到Kinect正在跟踪的内容。\n\n### 启动推进器\n\
  \n- 1. 我们需要创建一个新的Processing草图并导入SimpleOpenNI库。然后我们需要添加 setup() 和 draw() 方法。\n\n\
  ```\nimport SimpleOpenNI.*;\n\nvoid setup() {\n}\n\nvoid draw() {\n}\n```\n\n- 2.\
  \ 我们创建三个方法，由我们的 draw() 方法调用，用于绘制 HUD、舞者和舞池。\n\n```\nvoid drawHUD() {\n}\n\nvoid\
  \ drawDancer() {\n}\n\nvoid drawFloor() {\n}\n```\n\n- 3. 在我们的 draw() 方法中，我们需要添加对刚才创建的三个方法的调用。由于Kinect返回的坐标使用与Processing使用的不同的坐标系统（它默认会这样做），我们需要在调用\
  \ drawDancer() 和 drawFloor() 方法之前旋转并缩放我们的视角。\n\n```\nvoid draw() {\n    background(\
  \ 255 );\n    context.update();\n\n    drawHUD();\n\n    translate( width/2, height/2,\
  \ 0 );\n    rotateX( PI );\n\n    scale(0.5);\n    translate(0, -100, -400);\n \
  \   rotateY( radians( 30 ) );\n\n    drawDancer();\n    drawFloor();\n}\n```\n\n\
  \n\n\n\n- 4. 现在我们需要将 SimpleOpenNI 上下文添加到脚本中，并在 setup() 方法中对其进行初始化。我们还需要将绘图窗口大小设置为\
  \ 1024 × 768 像素。\n\n```\nSimpleOpenNI context;\nint player = -1;\nboolean calibrated\
  \ = false;\nvoid setup() {\nsize( 1024, 768, P3D);\ncontext = new SimpleOpenNI(\
  \ this );\ncontext.enableDepth();\n\ncontext.enableUser( SimpleOpenNI.SKEL_PROFILE_ALL);\n\
  }\n```\n\n- 5. 要创建 HUD，我们需要添加 onNewUser() 和 onUserLost() 回调方法，就像我们在上一节中所做的那样。由于我们也想使用骨骼追踪器，我们在\
  \ onNewUser() 函数中启动骨骼校准。\n\n```\nvoid onNewUser(int userId) {\nprintln(\"onNewUser\
  \ - userId: \" + userId);\nprintln(\" start pose detection\");\nif ( player == -1\
  \ ) {\nplayer = userId;\ncalibrated = false;\ncontext.requestCalibrationSkeleton(userId,\
  \ true);\n}\n}\n```\n\n```\nvoid onLostUser( int userID ) {\nif ( player == userID\
  \ ) {\nprintln( \"lost user\" );\nplayer = -1;\ncalibrated = false;\n}\n}\n```\n\
  \n- 6. 我们还添加了一个 onEndCalibration() 回调函数，当校准完成时会调用该函数。如果校准不成功，我们可以通过启动姿态检测来第二次尝试查找用户。\n\
  \n```\nvoid onEndCalibration(int userId, boolean successful) {\nprintln(\"onEndCalibration\
  \ - userId: \" + userId + \", successful: \" + successful);\nif ( player == userId\
  \ ) {\nif (successful) {\nprintln(\" User calibrated !!!\");\ncontext.startTrackingSkeleton(userId);\n\
  }\n}\ncalibrated = true;\n} else {\n    println(\" Failed to calibrate user !!!\"\
  );\n    println(\" Start pose detection\");\n    context.startPoseDetection(\"Psi\"\
  , userId);\n}\n}\n```\n\n- 7. 如果 SimpleOpenNI 检测到请求的姿态，将调用 onStartPose() 函数。因此，让我们将此函数添加到我们的绘图中，以便在姿态检测成功时重新启动校准。\n\
  \n```\nvoid onStartPose(String pose, int userId) {\n    println(\"onStartPose -\
  \ userId: \" + userId + \", pose: \" + pose);\n    println(\" stop pose detection\"\
  );\n    if ( player == userId ) {\n        context.stopPoseDetection(userID);\n\
  \        context.requestCalibrationSkeleton(userId, true);\n    }\n}\n```\n\n- 8.\
  \ 现在我们显示红外摄像头的图像，并对从 getUsersPixel() 方法获取的像素进行着色。这次，我们希望红外摄像头的图像仅显示在左上角，而不是整个绘图窗口。我们还需要调整之前绘图中使用的像素着色代码。我们仅获取每隔四行中的每个第四个像素来缩小图像。将以下代码添加到\
  \ drawHUD() 方法中：\n\n```\nvoid drawHUD() {\n    image( context.depthImage(), 0, 0,\
  \ 160, 120 );\n\n    loadPixels();\n    if ( player != -1 ) {\n        int[] up\
  \ = context.getUsersPixels( player );\n        for ( int y = 0; y < 480; y += 4\
  \ ) {\n            for ( int x = 0; x < 640; x += 4 ) {\n                if ( up[\
  \ y * 640 + x ] != 0 ) {\n                    float g = green( pixels[ y * 1024\
  \ / 4 + x / 4 ]);\n\n                    if ( calibrated ) {\n                 \
  \       pixels[ (y/4) * 1024 + x/4 ] = color( 0, g, 0 );\n                    }\
  \ else {\n                        pixels[ (y/4) * 1024 + x/4 ] = color( g, g, 0\
  \ );\n                    }\n                }\n            }\n        }\n    }\n\
  }\n   }\n    }\n   }\nupdatePixels ();\n}\n```\n\n- 9. 我们接下来要实现的方法是 drawDancer()\
  \ 方法。由于我们已激活用户骨骼追踪器，现在可以开始使用肢体和关节的坐标，并在它们之间绘制线条。对于头部，我们将使用一个沿 x 轴和 z 轴缩小的球体，将其变成椭球体，如下图所示：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_54_0.png)\n\n- 10. 我们需要将以下代码添加到绘图中，以绘制头部和躯干：\n\
  \n```\nvoid drawDancer() {\nif ( player != -1 && context.isTrackingSkeleton( player\
  \ ) ) {\npushMatrix();\nscale( .1 );\nstroke( 0 );\nstrokeWeight( 2 );\nfill( 0\
  \ );\nPVector v1 = new PVector();\nPVector v2 = new PVector();\ncontext.getJointPositionSkeleton(\
  \ player,\nSimpleOpenNI.SKEL_HEAD, v1 );\ncontext.getJointPositionSkeleton( player,\n\
  SimpleOpenNI.SKEL_NECK, v2 );\npushMatrix();\ntranslate( v1.x, v1.y, v1.z );\nscale(\
  \ .5, .5, 1 );\n\nsphere( v1.dist( v2 ) );\npopMatrix();\nline( v1.x, v1.y, v1.z,\
  \ v2.x, v2.y, v2.z );\n\ncontext.getJointPositionSkeleton( player,\n    SimpleOpenNI.SKEL_NECK,\
  \ v1 );\ncontext.getJointPositionSkeleton( player,\n    SimpleOpenNI.SKEL_LEFT_SHOULDER,\
  \ v2 );\nline( v1.x, v1.y, v1.z, v2.x, v2.y, v2.z );\n\ncontext.getJointPositionSkeleton(\
  \ player,\n    SimpleOpenNI.SKEL_NECK, v1 );\ncontext.getJointPositionSkeleton(\
  \ player,\n    SimpleOpenNI.SKEL_RIGHT_SHOULDER, v2 );\nline( v1.x, v1.y, v1.z,\
  \ v2.x, v2.y, v2.z );\n\ncontext.getJointPositionSkeleton( player,\n    SimpleOpenNI.SKEL_NECK,\
  \ v1 );\ncontext.getJointPositionSkeleton( player,\n    SimpleOpenNI.SKEL_TORSO,\
  \ v2 );\nline( v1.x, v1.y, v1.z, v2.x, v2.y, v2.z );\n```\n\n- 11. 然后我们添加以下代码来绘制手臂：\n\
  \n```\ncontext.getJointPositionSkeleton( player,\n    SimpleOpenNI.SKEL_LEFT_SHOULDER,\
  \ v1 );\ncontext.getJointPositionSkeleton( player,\n    SimpleOpenNI.SKEL_LEFT_ELBOW,\
  \ v2 );\nline( v1.x, v1.y, v1.z, v2.x, v2.y, v2.z );\n\ncontext.getJointPositionSkeleton(\
  \ player,\n    SimpleOpenNI.SKEL_LEFT_ELBOW, v1 );\ncontext.getJointPositionSkeleton(\
  \ player,\n    SimpleOpenNI.SKEL_LEFT_HAND, v2 );\nline( v1.x, v1.y, v1.z, v2.x,\
  \ v2.y, v2.z );\n\ncontext.getJointPositionSkeleton( player,\n    SimpleOpenNI.SKEL_RIGHT_SHOULDER,\
  \ v1 );\ncontext.getJointPositionSkeleton( player,\n    SimpleOpenNI.SKEL_RIGHT_ELBOW,\
  \ v2 );\nline( v1.x, v1.y, v1.z, v2.x, v2.y, v2.z );\n\ncontext.getJointPositionSkeleton(\
  \ player,\n    SimpleOpenNI.SKEL_RIGHT_ELBOW, v1 );\ncontext.getJointPositionSkeleton(\
  \ player,\n    SimpleOpenNI.SKEL_RIGHT_HAND, v2 );\nline( v1.x, v1.y, v1.z, v2.x,\
  \ v2.y, v2.z );\n```\n\n- 12. 最后，我们添加以下代码来绘制臀部和腿部：\n\n```\ncontext.getJointPositionSkeleton(\
  \ player,\nSimpleOpenNI.SKEL_TORSO, v1 );\ncontext.getJointPositionSkeleton( player,\n\
  SimpleOpenNI.SKEL_LEFT_HIP, v2 );\nline( v1.x, v1.y, v1.z, v2.x, v2.y, v2.z );\n\
  \ncontext.getJointPositionSkeleton( player,\nSimpleOpenNI.SKEL_TORSO, v1 );\ncontext.getJointPositionSkeleton(\
  \ player,\nSimpleOpenNI.SKEL_RIGHT_HIP, v2 );\nline( v1.x, v1.y, v1.z, v2.x, v2.y,\
  \ v2.z );\n\ncontext.getJointPositionSkeleton( player,\nSimpleOpenNI.SKEL_LEFT_HIP,\
  \ v1 );\ncontext.getJointPositionSkeleton( player,\nSimpleOpenNI.SKEL_RIGHT_HIP,\
  \ v2 );\nline( v1.x, v1.y, v1.z, v2.x, v2.y, v2.z );\n\ncontext.getJointPositionSkeleton(\
  \ player,\nSimpleOpenNI.SKEL_LEFT_HIP, v1 );\ncontext.getJointPositionSkeleton(\
  \ player,\nSimpleOpenNI.SKEL_LEFT_KNEE, v2 );\nline( v1.x, v1.y, v1.z, v2.x, v2.y,\
  \ v2.z );\n\ncontext.getJointPositionSkeleton( player,\nSimpleOpenNI.SKEL_LEFT_KNEE,\
  \ v1 );\ncontext.getJointPositionSkeleton( player,\nSimpleOpenNI.SKEL_LEFT_FOOT,\
  \ v2 );\nline( v1.x, v1.y, v1.z, v2.x, v2.y, v2.z );\n\ncontext.getJointPositionSkeleton(\
  \ player,\nSimpleOpenNI.SKEL_RIGHT_HIP, v1 );\ncontext.getJointPositionSkeleton(\
  \ player,\nSimpleOpenNI.SKEL_RIGHT_KNEE, v2 );\nline( v1.x, v1.y, v1.z, v2.x, v2.y,\
  \ v2.z );\n\ncontext.getJointPositionSkeleton( player,\nSimpleOpenNI.SKEL_RIGHT_KNEE,\
  \ v1 );\ncontext.getJointPositionSkeleton( player,\nSimpleOpenNI.SKEL_RIGHT_FOOT,\
