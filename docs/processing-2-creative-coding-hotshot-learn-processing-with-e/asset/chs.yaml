  - 13. 到目前为止，我们的舞者正在被追踪和绘制，但如果你现在运行代码，它会漂浮在虚空中。要改变这一点，请将以下代码添加到 drawDancefloor()\
  \ 方法中，为我们的舞者提供一个可以跳舞的地方：\n\n```\nvoid drawFloor() {\n  noStroke();\n  fill( 128\
  \ );\n\n  beginShape(QUADS);\n  vertex( -400, -100, -400 );\n  vertex( -400, -100,\
  \ 400 );\n  vertex( 400, -100, 400 );\n  vertex( 400, -100, -400 );\n  endShape();\n\
  }\n```\n\n- 14. 现在我们需要运行绘图。我们的火柴人将跟随我们的舞蹈动作，如下图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_57_0.png)\n\
  \n## 任务完成 - 小结\n\n我们刚刚学习了如何使用 Kinect 的骨骼追踪功能。为了获取肢体和关节的坐标，我们添加了两个新的回调函数；一个用于在 Kinect\
  \ 开始校准时收到通知，另一个用于在检测到用户姿态时收到通知。\n\n为了让绘图的用户能够看到识别和校准的当前状态，我们在第 5 步中添加了一个小型 HUD 显示。我们的\
  \ HUD 显示与我们在上一任务中创建的绘图非常相似，但由于我们不想使用整个窗口来显示深度图和用户像素，因此需要转换像素坐标和像素数组的索引。\n\n在第 8\
  \ 步中，我们在 drawDancer() 方法中使用骨骼追踪器的坐标来绘制火柴人。SimpleOpenNI 上下文的 jointPositionSkeleton()\
  \ 方法用于将关节位置加载到 PVector 变量中，然后我们使用 line() 方法来绘制肢体。\n\n最后，在第 9 步中，我们通过绘制一个灰色矩形为我们的火柴人制作了一个简单的舞池。我们使用\
  \ beginShape() 和 endShape() 来定义形状，并使用 vertex() 方法添加角点的坐标。\n\n## 机密情报\n\nSimpleOpenNI\
  \ 上下文不仅提供关节的位置，还提供一个方向向量。由于本项目中我们仅绘制火柴人以保持简单，因此没有使用此方向向量。但是，如果你计划控制一个更复杂的形象（例如从\
  \ Blender 等 3D 建模程序导出的装配好的 3D 模型），则可以使用此信息来计算模型顶点的旋转和扭曲。\n\n如果你需要测试物体在哪个位置被击中以及它会向哪个方向飞出，也可能需要此信息。\n\
  \n## 跳舞！跳舞！跳舞！\n\n在火柴人舞蹈团项目的最后一项任务中，我们终于要进入“舞团”部分了。到目前为止，我们创建了一个孤独的火柴人舞者，它在自己的小型虚拟世界中移动。而这已经过时了。我们现在将通过克隆已创建的舞者来添加更多舞者；为了防止我们的舞者难以区分，我们将在此处和那里添加一些变化。\n\
  \n为了使我们的代码更具可读性，我们将创建一个新类来存储火柴人数据，并负责绘制单个形象的身体。此类还用于存储每个舞者的颜色和大小。\n\n\n\n\n我们将舞者放在\
  \ draw() 方法中，并使用 translate() 方法在舞池的另一个位置绘制每个舞者。\n\n## 启动推进器\n\n让我们添加更多舞者：\n\n- 1.\
  \ 打开你在 *制作舞者* 任务中创建的草图，点击右侧的小箭头图标并从菜单中选择 **新建标签页** 来添加一个新类。新类名为 *人物*，因此请将标签页命名为\
  \ *人物* 并添加以下代码：\n```\npublic class Figure {\n\n}\n```\n\n- 2. 现在向你的类添加一个 `PVector`\
  \ 对象数组（它将存储从 Kinect 获取的坐标）以及一个相同大小的数组，其中包含标识每个关节的 OpenNI 常量名称。\n```\npublic class\
  \ Figure {\nPVector[] joints;\nint[] ni_names = new int[] {\nSimpleOpenNI.SKEL_HEAD,\n\
  SimpleOpenNI.SKEL_NECK,\nSimpleOpenNI.SKEL_TORSO,\nSimpleOpenNI.SKEL_LEFT_SHOULDER,\n\
  SimpleOpenNI.SKEL_LEFT_ELBOW,\nSimpleOpenNI.SKEL_LEFT_HAND,\nSimpleOpenNI.SKEL_RIGHT_SHOULDER,\n\
  SimpleOpenNI.SKEL_RIGHT_ELBOW,\nSimpleOpenNI.SKEL_RIGHT_HAND,\nSimpleOpenNI.SKEL_LEFT_HIP,\n\
  SimpleOpenNI.SKEL_LEFT_KNEE,\nSimpleOpenNI.SKEL_LEFT_FOOT,\nSimpleOpenNI.SKEL_RIGHT_HIP,\n\
  SimpleOpenNI.SKEL_RIGHT_KNEE,\nSimpleOpenNI.SKEL_RIGHT_FOOT\n};\n}\n```\n\n- 3.\
  \ 要初始化 `joints` 数组，你需要为你的 `Figure` 类添加一个构造函数，其形式如下：\n```\npublic Figure() {\njoints\
  \ = new PVector[15];\nfor( int i=0; i<joints.length; i++ ) {\njoints[i] = new PVector();\n\
  }\n}\n```\n\n- 4. 你还需要向类中添加一些常量，以便在不必知道数组中数值索引的情况下，能够识别坐标数组中的条目。\n\n```\npublic\
  \ class Figure {\n    static final int HEAD=0;\n    static final int NECK=1;\n \
  \   static final int TORSO=2;\n    static final int L_SHOULDER=3;\n    static final\
  \ int L_ELBOW=4;\n    static final int L_HAND=5;\n    static final int R_SHOULDER=6;\n\
  \    static final int R_ELBOW=7;\n    static final int R_HAND=8;\n    static final\
  \ int L_HIP=9;\n    static final int L_KNEE=10;\n    static final int L_FOOT=11;\n\
  \    static final int R_HIP=12;\n    static final int R_KNEE=13;\n    static final\
  \ int R_FOOT=14;\n}\n```\n\n- 5. 对于每一帧，Kinect 都会提供一组更新后的坐标；因此你需要添加一个 update() 方法，该方法获取\
  \ SimpleOpenNI 上下文和 userId 的引用。由于你已将坐标名称添加到数组中，可以简单地使用 for 循环将它们复制到你的 PVector 数组。\n\
  \n```\npublic void update( SimpleOpenNI context, int userId ) {\n    for ( int i=0;\
  \ i<joints.length; i++) {\n    context.getJointPositionSkeleton( userId, ni_names[i],\
  \ joints[i] );\n    }\n}\n```\n\n- 6. 你不希望每个人物都长得一模一样，因此需要对每个人物进行略微缩放。向类中添加以下变量：\n\
  \n```\nfloat sx = 1;\nfloat sy = 1;\nfloat sz = 1;\ncolor c = 0;\n```\n\n- 7. 现在添加一个名为\
  \ randomize() 的函数，它用于初始化缩放值并选择一种颜色。\n\n```java\npublic void randomize() {\n  sx\
  \ = random( 0.9, 1.1 );\n  sy = random( 0.9, 1.1 );\n  sz = random( 0.9, 1.1 );\n\
  \n  colorMode( HSB );\n  c = color( random( 255 ), 255, 255 );\n  colorMode( RGB\
  \ );\n}\n```\n\n- 8. 你已初始化随机化值并更新了坐标；现在需要绘制你的火柴人。为了简化绘图，你需要添加一个名为 drawLimb() 的新方法，它获取你希望绘制线条的第一个和第二个坐标的索引。\n\
  \n```java\npublic void drawLimb(int idx1, int idx2) {\n  line( joints[idx1].x, joints[idx1].y,\
  \ joints[idx1].z,\n        joints[idx2].x, joints[idx2].y, joints[idx2].z );\n}\n\
  ```\n\n- 9. 要实现火柴人的实际绘制，你需要在 Figure 类中创建一个 draw() 方法。首先，你需要将绘图颜色设置为在 randomize()\
  \ 方法中为人物生成的随机颜色，然后将缩放设置为你的 sx、sy 和 sz 值。\n\n```java\npublic void draw() {\n  strokeWeight(\
  \ 2 );\n  stroke( c );\n  fill( c );\n  pushMatrix();\n  scale( sx, sy, sz );\n\
  }\n```\n\n- 10. 现在你需要添加代码来绘制头部和身体的线条。\n\n```java\npushMatrix();\ntranslate( joints[HEAD].x,\
  \ joints[HEAD].y, joints[HEAD].z );\nscale( .5, .5, 1);\nsphere( joints[HEAD].dist(\
  \ joints[NECK] ) );\npopMatrix();\ndrawLimb( NECK, HEAD );\n\ndrawLimb( NECK, L_SHOULDER\
  \ );\ndrawLimb( L_SHOULDER, L_ELBOW );\ndrawLimb( L_ELBOW, L_HAND );\n\ndrawLimb(\
  \ NECK, R_SHOULDER );\ndrawLimb( R_SHOULDER, R_ELBOW );\ndrawLimb( R_ELBOW, R_HAND\
  \ );\n\ndrawLimb( NECK, TORSO );\ndrawLimb( TORSO, L_HIP );\ndrawLimb( TORSO, R_HIP\
  \ );\ndrawLimb( L_HIP, R_HIP );\n\ndrawLimb( L_HIP, L_KNEE );\ndrawLimb( L_KNEE,\
  \ L_FOOT );\n\ndrawLimb( R_HIP, R_KNEE );\ndrawLimb( R_KNEE, R_FOOT );\npopMatrix();\n\
  }\n```\n\n- 11. 切换回草图的主标签页，并将你在上一个任务中定义的 figure 变量更改为 Figure 对象的二维数组。\n\n```\nFigure\
  \ figures[][] = new Figure[5][4];\n```\n\n- 12. 现在在 setup() 方法中添加以下代码行来初始化数组。为了让每个小舞者看起来略有不同，请调用你添加到\
  \ Figure 类中的 randomize() 方法：\n\n```\nvoid setup() {\nsize( 1024, 768, P3D);\ncontext\
  \ = new SimpleOpenNI( this );\ncontext.enableDepth();\n\ncontext.enableUser( SimpleOpenNI.SKEL_PROFILE_ALL\
  \ );\n\nsmooth();\nlights();\n\nfor ( int i = 0; i<5; i++ ) {\nfor ( int j=0; j<4;\
  \ j++ ) {\nfigures[i][j] = new Figure();\nfigures[i][j].randomize();\n}\n}\n}\n\
  ```\n\n- 13. 在 drawDancer() 方法中，你需要调用你创建的每个 figure 对象的 update() 函数。我们需要使用 translate()\
  \ 函数将每个人物移动到不同的位置，以确保它们不会互相重叠绘制。\n\n```\nvoid drawDancer() {\nif ( player != -1\
  \ && context.isTrackingSkeleton( player ) ) {\nfor ( int j=-2; j< 3; j++ ) {\nfor\
  \ ( int k = 0; k < 4; k++ ) {\nfigures[j+2][k].update( context, player );\npushMatrix();\n\
  translate( 100*j, 0, -100*k );\nscale( .1 );\nfigures[j+2][k].draw();\npopMatrix();\n\
  }\n}\n}\n}\n```\n\n- 14. 现在开始播放音乐，站在 Kinect 前面，开始跳舞吧。你的小火柴人将毫不疲倦地模仿你所有的精彩舞步。你可以在这个截图中看到我的舞蹈团：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_63_0.png)\n\n## 任务完成 - 小型总结\n\n在这个任务中，我们为火柴人定义了一个类。我们将访问\
  \ 3D 坐标和绘制舞者的代码移动到我们的类中，以简化主草图中的 `drawDancer()` 方法。新类还使我们能够绘制多个舞者。\n\n为了防止我们的舞蹈团看起来像克隆人大军，我们添加了\
  \ `randomize()` 方法，它会稍微缩放火柴人，并为每个人物选择一种随机颜色。\n\n## 任务圆满完成\n\n在这个项目中，我们通过连接 Kinect\
  \ 并安装 OpenNI 框架，教会了 Processing 如何“看见”。\n\n我们使用 SimpleOpenNI 框架提供的深度图像，并利用 OpenNI\
  \ 的跟踪功能在图像中定位用户。对于每个被跟踪的用户，框架都会为我们提供一个位图，定义哪些像素属于被跟踪的用户，哪些不属于。在最后两个任务中，我们将第二个任务中创建的带有彩色像素的深度图像用作\
  \ HUD 显示，以便玩家可以看到当前正在跟踪的内容。\n\n从第三个任务开始，我们使用骨骼跟踪器来访问玩家四肢和关节的 3D 坐标，并利用这些信息绘制出跟随玩家动作的火柴人。\n\
  \n在我们的最终任务中，我们将火柴人的绘图代码重构为一个类，并使用这个类来绘制多个舞者，这样我们的火柴人在跳舞时就有伙伴陪伴了。\n\n## 准备好大干一场了吗？一项火热挑战\n\
  \n在这个项目中，我们只是初步探索了 Kinect 提供的可能性。在一个项目中不可能描述所有内容；你可以为此写一整本书。因此，尝试扩展你在本项目中获得的知识，尝试以下其中一项：\n\
  \n- 使用 RGB 摄像头的图像来显示玩家，而不是使用火柴人之一。\n- 为你的舞者使用比火柴人更复杂的 3D 模型。\n- 记录玩家的动作，并在短暂延迟后重放。\n\
  - 目前，我们的草图只支持一名玩家。OpenNI 框架也可以跟踪多个用户，因此尝试添加多人游戏支持。\n\n\n"
- "# 项目 3\n\n## 迪斯科舞池\n\n在上一个项目中，我们教会了Processing如何“看”，更重要的是如何“跳舞”。我们的火柴人舞蹈团目前正在一个非常无聊的灰色舞池上跳舞。这很快就会改变，因为在这个项目中，我们将为我们的舞蹈团创建一个真正的迪斯科舞池。\n\
  \n照明的迪斯科舞池在70年代末由约翰·特拉沃尔塔主演的电影《周六夜狂热》而流行起来，我们将模拟一个由64块从下方灯光照亮的玻璃地砖组成的舞池。\n\n## 任务简报\n\
  \n在这个项目中，我们将使用Processing配合Minim框架（由Damien Di Fede开发）来播放和分析音乐。我们还将使用它来实时访问音乐数据并实现一些音频可视化。Minim已随Processing捆绑提供，因此我们不需要为此任务安装库。\n\
  \n我们将创建多种音乐和定时器控制的可视化模式，并在音乐播放时让我们的草图在它们之间切换。然后我们将通过将正在创建的图形转换为3D对象的纹理，把它们变成迪斯科舞池。最后，我们将把纹理添加到我们在上一个项目中为火柴人舞蹈团创建的那个有些无聊的舞池上。\n\
  \n## 为什么它很棒？\n\n说到音乐可视化，Processing是一个非常明智的选择。Minim库简化了对诸如节拍检测和快速傅里叶变换等功能的访问，而Processing提供了对最出色的3D和2D图形效果的访问。\n\
  \n默认的iTunes音乐可视化程序最初是一个名为\"Magnetosphere\"的Processing脚本，由艺术家Robert Hodgin（又名Flight404）编写。\n\
  \n## 你的挑战目标\n\n我们的项目包含四个任务，即：\n\n- 你能听见我吗？\n- 随音乐闪烁\n- 制作你的迪斯科舞池\n- 舞者们来了\n\n##\
  \ 任务检查清单\n\n此任务关乎为音乐创建出色的视觉效果，因此我们显然需要一些音乐曲目和一张声卡。这些先决条件不应该太难找到。如果你想完成此任务的最终任务，你还需要我们上一个任务的最终草图和一个Kinect，但前三个任务可以独立于我们的上一个任务进行。\n\
  \n撰写本文时，Processing 2.0 Beta不开箱即用支持Linux音频框架PulseAudio。如果你使用的是使用PulseAudio的Linux发行版（例如Ubuntu），你需要将Java\
  \ PulseAudio库添加到Processing中。你可以在Processing问题跟踪系统中找到安装必要库的详细说明，网址为 http://code.google.com/p/processing/issues/detail?id=930。\n\
  \n## 你能听见我吗？\n\n在这个任务中，我们将编写一个Processing草图来播放MP3文件，并使用Minim库访问播放的音频样本。我们将使用这些数据来编写一个类似示波器的曲线。然后我们将使用Minim的`fft`类来计算当前播放声音的频谱，并生成一个柱状图来可视化它。\n\
  \n## 启动推进器\n\n让我们给Processing装上\"耳朵\"：\n\n- 1. 创建一个新的Processing草图，并添加`setup()`和`draw()`方法。\n\
  \n  ```java\n  void setup() {\n  }\n\n  void draw() {\n  }\n  ```\n\n- 2. 通过导航到\"\
  草图 | 导入库 ... | `minim`\"来添加Minim库的`import`语句。\n\n- 3. 现在我们需要通过导航到\"草图 | 添加文件 ...\"\
  或直接将其拖放到草图窗口来向我们的草图添加一个MP3文件。\n\n- 4. 向你的草图添加一个AudioPlayer对象，并在setup()方法中初始化它。\n\
  \n  ```java\n  import ddf.minim.spi.*;\n  import ddf.minim.signals.*;\n  import\
  \ ddf.minim.*;\n  import ddf.minim.analysis.*;\n  import ddf.minim.ugens.*;\n  import\
  \ ddf.minim.effects.*;\n\n  Minim minim;\n  AudioPlayer player;\n\n  void setup()\
  \ {\n    size(600, 300);\n    minim = new Minim(this);\n    player = minim.loadFile(\"\
  loop.mp3\", 1024);\n  }\n\n  void draw() {\n  }\n  ```\n\n  如果你不使用示例代码提供的MP3文件，请务必将\"\
  loop.mp3\"替换为你想要使用的MP3文件的文件名。\n\n- 5. 要启动我们的播放器，我们添加一个mousePressed()方法，如果播放器当前没有在运行则调用loop()方法，否则调用pause()。\n\
  \n  ```java\n  void mousePressed() {\n    if (player.isPlaying()) {\n      player.pause();\n\
  \    } else {\n      player.loop();\n    }\n  }\n  ```\n\n- 6. 现在我们通过将以下代码添加到我们的draw()方法中来创建一个示波器显示：\n\
  \n  ```java\n  void draw() {\n    background(0);\n    stroke(0, 255, 0);\n\n   \
  \ for (int i = 0; i < player.bufferSize() - 1; i++) {\n      float x1 = map(i, 0,\
  \ player.bufferSize(), 0, width);\n      float x2 = map(i + 1, 0, player.bufferSize(),\
  \ 0, width);\n      line(x1, 75 + player.mix.get(i) * 75, x2, 75 + player.mix.get(i\
  \ + 1) * 75);\n    }\n  }\n  ```\n\n- 7. 到目前为止，我们已经访问了音频数据的样本数据来生成可视化。另一个非常有用的分析和可视化音频数据的工具是所谓的快速傅里叶变换——简称fft——它在给定时间计算我们声音的频谱。我们使用logAverages()方法来减少我们获得的频段数量。我们向草图添加一个新变量并在setup()方法中初始化它。\n\
  \n  ```java\n  Minim minim;\n  AudioPlayer player;\n  FFT fft;\n\n  void setup()\
  \ {\n    size(600, 300);\n    minim = new Minim(this);\n\n    player = minim.loadFile(\"\
  loop.mp3\", 1024);\n\n    fft = new FFT(player.bufferSize(), player.sampleRate());\n\
  \    fft.logAverages(11, 1);\n  }\n  ```\n\n- 8. 在我们的draw()方法中，我们更新频谱并遍历fft对象为我们计算的频段，方法是添加以下代码：\n\
  \n  ```java\n  void draw() {\n    background(0);\n    stroke(0, 255, 0);\n\n   \
  \ for (int i = 0; i < player.bufferSize() - 1; i++) {\n      float x1 = map(i, 0,\
  \ player.bufferSize(), 0, width);\n      float x2 = map(i + 1, 0, player.bufferSize(),\
  \ 0, width);\n      line(x1, 75 + player.mix.get(i) * 75, x2, 75 + player.mix.get(i\
  \ + 1) * 75);\n    }\n\n    noStroke();\n    fill(255, 255, 0);\n    fft.forward(player.mix);\n\
  \    float step = width / 8;\n    for (int i = 0; i < 8; i++) {\n      float value\
  \ = fft.getAvg(i) * 3;\n      rect(step * i, height - value, step, value);\n   \
  \ }\n  }\n  ```\n\n- 9. 现在运行草图并在草图窗口内单击以启动音乐。可视化效果应该如下一个截图所示：\n\n  ![](img/5cb67baa7bc7778de360b14c00d1ab81_69_0.png)\n\
  \n## 任务完成 - 小结简报\n\n在这个任务中，我们将Minim库导入了我们的草图并添加了一个MP3循环。我们使用声音播放器对象来访问和管理音乐的启动和停止，并使用混音器来访问样本并将其可视化为类似示波器的线条。\n\
  \n在步骤7中，我们添加了一个fft对象来访问当前播放样本的频谱。在这个草图中，我们使用频率数据来生成频谱的柱状图。使用fft对象可以访问的频段数量取决于我们AudioPlayer的缓冲区大小。如果你增加缓冲区，你会在频域中获得更高的精度，但你也需要更多的样本来计算缓冲区，因此你的可视化效果将不那么灵敏。如果你增加频段数量，你也需要更多的CPU功率来计算频谱。我们为下一个任务创建的可视化效果只需要八个频段，因此我们告诉Minim在多个频段上计算平均值。\n\
  \n## 机密情报\n\nMinim是一个非常灵活和模块化的声音库。我们用来分析声音样本或频率的方法与声音播放器独立。如果你想可视化通过声卡线路输入麦克风录制的声音，你可以像这样用输入线替换AudioPlayer对象：\n\
  \n```java\nAudioInput in;\nin = minim.getLineIn();\n```\n\n## 随音乐闪烁\n\n我们当前任务的第二个任务是创建可视化器，根据定时器或从Minim获得的音频信息生成一个8\
  \ x 8的地砖数组。地砖数组将由我们的draw()方法用于生成舞池的俯视图。\n\n要在不同的可视化器之间切换，我们将编写一个在后台运行并每隔n秒选择一个新可视化器的线程。\n\
  \n### 启动推进器\n\n让我们随音乐闪烁：\n\n- 1. 让我们从一个新的草图开始并导入Minim库。在我们的`setup()`方法中，我们定义一个Minim上下文和一个`AudioPlayer`对象，就像在上一个任务中所做的那样。这次，我们直接在`setup()`方法中启动播放器的循环，因此草图一运行循环就会开始。\n\
  \n  ```java\n  import ddf.minim.spi.*;\n  import ddf.minim.signals.*;\n  import\
  \ ddf.minim.*;\n  import ddf.minim.analysis.*;\n  import ddf.minim.ugens.*;\n  import\
  \ ddf.minim.effects.*;\n\n  Minim minim;\n  AudioPlayer player;\n\n  void setup()\
  \ {\n    size(300, 300);\n\n    minim = new Minim(this);\n    player = minim.loadFile(\"\
  loop.mp3\", 1024);\n    player.loop();\n  }\n  ```\n\n\n\n\n- 2. 我们添加一个新选项卡并将其命名为\
  \ Visualizer。接口类似于没有方法实现的类定义。此接口定义了所有可视化器类都必须实现的方法。\n\n```java\ninterface Visualizer\
  \ {\npublic int[][] tiles = new int[8][8];\npublic void init();\npublic void tick();\n\
  public void setActive( boolean active );\n}\n```\n\n- 3. 我们将要实现的第一个可视化器在每次调用 `tick()`\
  \ 方法时，会每隔 8×8 瓦片网格中的第二个瓦片切换一次开关状态。添加一个新选项卡，将其命名为 Alternate，并添加以下代码：\n\n```java\n\
  public class Alternate implements Visualizer {\nint p = 1;\nint count = 0;\n\npublic\
  \ Alternate() {\ninit();\n}\n\npublic void tick() {\ncount++;\nif ( count < 4 )\
  \ return;\n\ncount = 0;\nif ( p == 1 ) { p = 0; } else { p = 1; }\nfor ( int x =\
  \ 0; x < 8; x++ ) {\nfor ( int y = 0; y < 8; y++ ) {\ntiles[x][y] = 255 * ( (x+y+p)\
  \ % 2 ) ;\n}\n}\n}\n\npublic void init() {\nfor ( int x = 0; x < 8; x++ ) {\nfor\
  \ ( int y = 0; y < 8; y++ ) {\ntiles[x][y] = 0;\n}\n}\n}\n\npublic void setActive(\
  \ boolean active ) {\n}\n}\n```\n\n- 4. 现在切换回主草图选项卡，为当前可视化器添加一个变量，然后在 `setup()`\
  \ 方法中初始化它。\n\n```java\nVisualizer viz;\nMinim minim;\nAudioPlayer player;\n\nvoid\
  \ setup() {\n  size(300,300);\n\n  minim = new Minim( this );\n  player = minim.loadFile(\
  \ \"loop.mp3\", 1024 );\n\n  viz = new Alternate();\n  viz.setActive( true );\n\n\
  \  player.loop();\n}\n```\n\n- 5. 为了让 `tick` 方法每 125 毫秒被调用一次，我们需要添加一个计时器。将以下线程添加到\
  \ `setup()` 方法中：\n\n```java\nVisualizer viz;\nMinim minim;\nAudioPlayer player;\n\
  \nvoid setup() {\n  size(300,300);\n\n  minim = new Minim( this );\n  player = minim.loadFile(\
  \ \"loop.mp3\", 1024 );\n\n  viz = new Alternate();\n  viz.setActive( true );\n\
  \  Thread t = new Thread() {\n    public void run() {\n      for(;;) {\n       \
  \ viz.tick();\n        delay(125);\n      }\n    }\n  };\n  t.start();\n\n  player.loop();\n\
  }\n```\n\n- 6. 我们的可视化器已初始化并每隔 n 毫秒更改一次瓦片图案，但瓦片尚未绘制。我们通过将以下代码添加到 `draw()` 方法中来更改这一点：\n\
  \n```java\nvoid draw() {\n  background(0);\n  float w = 300/8;\n  for ( int x =\
  \ 0; x < 8; x++ ) {\n    for ( int y = 0; y < 8; y++ ) {\n      stroke( 255 ) ;\n\
  \      fill( viz.tiles[ x ][ y ],0,0 ) ;\n      if ( viz.tiles[ x ][ y ] > 32 )\
  \ {\n        viz.tiles[ x ][ y ] -= (viz.tiles[ x ][ y ]-32)/25 ;\n      }\n   \
  \   rect( w * x, w*y, w, w ) ;\n    }\n  }\n}\n```\n\n以下屏幕截图显示了图案的样式：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_73_0.png)\n\
  \n- 7. 如果我们现在启动草图，瓦片会疯狂闪烁，但老实说，过一段时间后会变得有点无聊。所以让我们添加另一个选项卡并实现一个新的可视化器。我们将类命名为 BarHorizontal\
  \ 并添加以下代码：\n\n```java\npublic class BarHorizontal implements Visualizer {\n  int\
  \ px = 0;\n  int count = 0;\n\n  public BarHorizontal() {\n    init();\n  }\n\n\
  \  public void tick() {\n    count++;\n    if (count < 4) return;\n\n    count =\
  \ 0;\n    for ( int i = 0; i < 8; i++ ) {\n      tiles[min(7, px)][i] = 255;\n \
  \   }\n\n    if ( px >= 8 && tiles[7][7] != 0 ) {\n      init();\n    } else {\n\
  \      px += 1;\n    }\n  }\n\n  public void init() {\n    px = 0;\n    for ( int\
  \ x = 0; x < 8; x++ ) {\n      for ( int y = 0; y < 8; y++ ) {\n        tiles[x][y]\
  \ = 0;\n      }\n    }\n  }\n\n  public void setActive( boolean active ) {\n  }\n\
  }\n```\n\n- 8. 切换回主选项卡，为我们的可视化器类添加一个数组。我们还添加了一个类似于第一个的新计时器，但这次我们将延迟设得更长，并且不是调用 `tick()`\
  \ 方法，而是从我们的数组中选择一个新的可视化器。\n\n```java\nVisualizer viz;\nVisualizer[] visualizers;\n\
  \nMinim minim;\nAudioPlayer player;\n```\n\n```java\nvoid setup() {\n    size(300,300);\n\
  \n    minim = new Minim( this );\n    player = minim.loadFile( \"loop.mp3\", 1024\
  \ );\n\n    visualizers = new Visualizer[] {\n        new BarHorizontal(),\n   \
  \     new Alternate()\n    };\n\n    viz = visualizers[0];\n    viz.setActive( true\
  \ );\n    Thread t = new Thread() {\n        public void run() {\n            for(;;)\
  \ {\n                viz.tick();\n                delay(125);\n            }\n \
  \       }\n    };\n    t.start();\n\n    Thread t2 = new Thread() {\n        public\
  \ void run() {\n            for(;;) {\n                viz.setActive( false );\n\
  \                viz = visualizers[ int(random(visualizers.length)) ];\n       \
  \         viz.init();\n                viz.setActive( true );\n                delay(8000);\n\
  \            }\n        }\n    };\n    t2.start();\n    player.loop();\n}\n```\n\
  \n- 9. 现在我们将添加一个新的可视化器，以螺旋方式点亮面板。我们创建一个新选项卡，将其命名为 `SpiralIn`，并添加以下代码：\n\n```java\n\
  public class SpiralIn implements Visualizer {\n    PVector p = new PVector(0, 0);\n\
  \    PVector d = new PVector(1, 0);\n\n    public SpiralIn() {\n        init();\n\
  \    }\n\n    public void tick() {\n        tiles[int(p.x)][int(p.y)] = 255;\n \
  \       if ( d.x == 1 && ( p.x == 7 ||\n                tiles[int(p.x+1)][int(p.y)]\
  \ != 0 ) ) {\n            d = new PVector( 0, 1 );\n        } else if ( d.x == -1\
  \ && ( p.x == 0 ||\n                tiles[int(p.x-1)][int(p.y)] != 0 ) ) {\n   \
  \         d = new PVector( 0, -1 );\n        } else if ( d.y == 1 && ( p.y == 7\
  \ ||\n                tiles[int(p.x)][int(p.y+1)] != 0 ) ) {\n            d = new\
  \ PVector( -1, 0 );\n        } else if ( d.y == -1 && ( p.y == 0 ||\n          \
  \      tiles[int(p.x)][int(p.y-1)] != 0 ) ) {\n            d = new PVector( 1, 0\
  \ );\n        }\n\n        if ( p.x == 3 && p.y == 3 && tiles[3][4] != 0 ) {\n \
  \           init();\n        } else {\n            p.add( d );\n        }\n    }\n\
  \n    public void init() {\n        p = new PVector( 0, 0 );\n        d = new PVector(\
  \ 1, 0 );\n        for ( int x = 0; x < 8; x++ ) {\n            for ( int y = 0;\
  \ y < 8; y++ ) {\n                tiles[x][y] = 0;\n            }\n        }\n \
  \   }\n\n    public void setActive( boolean active ) {\n    }\n}\n```\n\n- 10. 为了在我们的草图中提供新的可视化器，我们切换到主草图并将\
  \ `SpiralIn` 类添加到 `visualizers` 数组中：\n\n```java\nvisualizers = new Visualizer[]\
  \ {\n    new SpiralIn(),\n    new BarHorizontal(),\n    new Alternate()\n}\n```\n\
