  \ false。不幸的是，当霓虹地图激活时，您无法重新激活描边线条，因此我们将使用 makeSphere() 命令重新创建原始形状。\n\n## 目标完成 -\
  \ 小型简报\n\n本次任务的最后一项工作是将我们的地球仪变成霓虹地球仪，模仿 80 年代 CRT 显示器的风格。首先，我们反转了纹理并将其着色为绿色，使大陆呈现绿色，大海呈现黑色。我们在加载纹理时即时完成此操作，在\
  \ `setup()` 方法中，通过创建 `PGraphics` 对象并在加载图像时对其进行滤镜处理。在第 2 步中，我们激活了球体上线条的绘制，并将其变为蓝色。\n\
  \n从第 4 步开始，我们使用 OpenGL 着色器语言创建了一个边缘检测滤镜。我们用于滤镜的是所谓的片段着色器，这意味着我们提供的函数会针对每个像素调用一次，或者正如\
  \ OpenGL 规范委员会所称的那样——片段。这些着色器在显卡上执行，并且针对每个像素调用一次。显卡上的处理器通常能够并行执行许多此类函数；因此，它们不仅释放了\
  \ CPU 资源，而且取决于您的显卡，这些滤镜运行速度非常快。具体有多快取决于您的 CPU 和显卡；例如，我的电脑在 CPU 上运行带有模糊滤镜的草图时为每秒\
  \ 10 帧，而在使用 GLSL 滤镜时则为每秒 60 帧。在第 6 步和第 7 步中，我们将着色器添加到我们的草图中，并在 `draw()` 方法中激活了它。\n\
  \n从第 9 步开始，我们创建了第二个着色器，它在边缘检测后执行并添加发光效果，看起来类似于霓虹灯牌或旧式 CRT 显示器的余晖。\n\n滤镜效果在简单的大陆地图上看起来很棒，但我们希望来自\
  \ Visible Earth 项目的卫星图像保持不变。因此，从第 13 步起，我们添加了一个布尔变量，使我们只能为第一张纹理图像激活滤镜。\n\n## 任务完成\n\
  \n我们的任务是构建一个旋转的 3D 地球仪，其视觉风格类似于 80 年代电影中英雄和反派总部电脑显示器上看到的世界地图。我们首先在第一个任务中创建了一个球形网格。该网格由围绕我们的球体变形的四边形带组成。最后，我们通过使用极坐标遍历球体表面并将其转换为笛卡尔坐标来创建坐标。\n\
  \n在第二个任务中，我们填充了球体的面，并向我们的世界添加了点光源。然后，我们为每个顶点添加了法线向量以平滑网格的阴影。为了使光照更均匀，我们从点光源切换到了\
  \ Processing 中的默认光源。\n\n在第三个任务中，我们使用世界地图作为纹理，将球体变成了地球仪。我们通过纹理坐标扩展了网格的顶点，以确保纹理适合我们的球体。我们还添加了来自\
  \ NASA Visible Earth 项目的卫星图像，并添加了一个处理按键事件的回调方法，以使纹理可切换。\n\n在第四个任务中，我们最终通过将两个基于 GLSL\
  \ 着色器的滤镜添加到 draw() 方法中，创建了我们想要的视觉效果。在 setup() 方法中，我们反转了纹理图像并通过添加色调将其变为绿色。我们通过在 makeSphere()\
  \ 方法中重新激活描边颜色来创建蓝色网格线。然后，我们添加了一个边缘检测 GLSL 着色器并在 draw() 方法中使用它。为了生成发光效果，我们创建了第二个着色器，并用它来滤镜第一个滤镜的结果。\n\
  \n我们还添加了一个布尔变量，使我们只在选择第一个纹理时激活滤镜，并在卫星图像可见时停用它们。\n\n## 你准备好大干一场了？一项热血挑战\n\n在本次任务中，我们学习了如何创建地球仪，以及如何在\
  \ Processing 中将 GLSL 着色器用作滤镜。使用现代显卡的着色器所能实现的功能，我们才刚刚触及表面；除了让地球仪旋转并看起来很棒之外，还有更多可以做的事情。为什么不尝试以下一个想法来扩展我们刚刚创建的草图呢：\n\
  \n- 创建一个\"太阳\"，根据一天中的时间正确照亮地球仪，并使用一个 GLSL 滤镜，该滤镜使用昼夜纹理图像并在昼夜交界处进行混合。\n- NASA 为我们太阳系中的各种行星和卫星提供可免费下载的卫星图像。为什么不制作一个完整的太阳系呢？\n\
  - 创建一组不同的 GLSL 滤镜，以重现 50 年代电影院每周新闻片中的手绘黑白地球仪。\n"
- "# 项目 8\n\n## 日志地理可视化器\n\n19 世纪中叶，伦敦发生了一次霍乱爆发。一位名叫约翰·斯诺的医生在地图上他听说的每个病例位置画了一个点。使用这张地图，他能够在街道水泵处定位爆发源。然后，他拆除了水泵的把手来终止霍乱爆发。这是最早已知的地理信息系统（GIS）之一。如今，这些系统是使用矢量地图或卫星图像以及地理编码数据创建的。\n\
  \n## 任务简报\n\n我们当前的任务是创建一个地理信息系统，它读取 Web 服务器日志文件并显示读者请求的来源。我们将解析日志文件，然后提取请求的 IP 地址和时间戳。然后，我们将使用\
  \ IP 范围数据库获取一对地理坐标，并在世界地图上显示一个小图钉。最后，我们将用上一个任务中创建的 3D 霓虹地球仪替换地图，并在其表面上可视化地理编码的日志条目。\n\
  \n## 为什么这很棒？\n\n长期以来，创建地图或在地图上可视化数据一直是非常昂贵的工具和高薪专家的领域。幸运的是，近年来情况已发生变化。越来越多的工具、数据、地图和卫星图像可以免费或以非常低的成本提供给普通人。因此，知道如何创建在地球仪或地图上显示数据的可视化效果，肯定是你工具箱中一个非常有用的工具。\n\
  \n## 你的高手目标\n\n对于我们当前的任务，我们首先从 Web 服务器日志文件中提取要可视化的数据。然后，我们为每个数据记录获取地理坐标，并将数据可视化到我们来自项目\
  \ 7《霓虹地球仪》的霓虹地球仪上。我们任务的任务如下：\n\n- 读取日志文件\n- 对 IP 地址进行地理编码\n- 红点热\n- 交互式红点热\n\n##\
  \ 任务检查清单\n\n对于本次任务，我们需要在上一个任务中创建的霓虹地球仪。如果您没有按照本教程操作，可以从 www.packtpub.com/support\
