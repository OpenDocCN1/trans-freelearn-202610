  6. 在 parseLogfile() 方法中，我们遍历字符串并使用 match() 方法提取 IP 地址和日期部分。该函数使用正则表达式过滤文本并返回字符串数组。该数组包含正则表达式中每一对括号对应的字符串。我们的正则表达式提取形如\
