  \ Wiki 上找到：http://wiki.processing.org/w/Android。\n\n- 5. 我们现在将在模拟器中运行草图。点击 **草图\
  \ | 在模拟器中运行** 菜单项。Processing 现在会将草图编译为 Android 应用，为 Android 模拟器创建虚拟设备并启动它。由于启动 Android\
  \ 模拟器可能需要一段时间，尤其是首次运行时，您可能会遇到超时错误。这种情况下，只需重复此步骤。稍等片刻，您应该会看到我们的草图在模拟器窗口中运行，如下所示：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_170_0.png)\n\n- 6. 在移动设备上，应用程序通常以全屏模式运行，因为没有窗口系统。我们现在将告诉草图使用整个屏幕。我们还通过使用\
  \ `orientation()` 方法告诉草图以横向模式运行。\n\n```\nvoid setup() {\n  size(displayWidth,displayHeight);\n\
  \  orientation(LANDSCAPE);\n  ship = loadImage( \"ship.png\" );\n  reset();\n}\n\
  ```\n\n- 7. 现在草图以全屏模式运行，但在大多数 Android 设备上仍然无法游玩，因为极少数设备配备硬件键盘。为修复此问题，我们需要实现可与触摸屏一起使用的控件。**Android**\
  \ 模式将触摸事件映射到鼠标处理回调，因此我们只需向 `mousePressed()` 方法添加一些代码来控制飞船。如果玩家触摸屏幕底部三分之一区域，我们将点火推进器。如果触摸屏幕上部，我们将向左或向右转动飞船。\n\
  \n```\nvoid mousePressed() {\n  if ( state == WAITING ) {\n    state = RUNNING;\n\
  \  } else if ( state == RUNNING ) {\n    if ( mouseY > height * 2 / 3 ) {\n    \
  \  acc += 0.04;\n      acc = max( acc, 1/frameRate);\n    }\n    else if ( mouseX\
  \ < width / 2 ) {\n      a -= 0.1;\n    }\n    else {\n      a += 0.1;\n    }\n\
  \  } else if ( state == FINISHED ) {\n    reset();\n    state = RUNNING;\n  }\n\
  }\n```\n\n- 8. 通过点击 **草图 | 在模拟器中运行** 菜单再次在模拟器中运行草图，然后通过点击窗口来玩游戏。\n\n- 9. 当 Processing\
  \ 处于 **Android** 模式时，我们也可以在硬件设备上运行草图。因此，如果您有一台运行 Android 的手机或平板电脑，可以使用 USB 线将其连接到计算机，并在手机设置的\
  \ **开发者** 选项部分中启用 USB 调试。现在，您可以通过点击 **草图 | 在设备上运行** 菜单在设备上运行草图。以下是我的手机运行月球着陆游戏的照片：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_172_0.png)\n\n## 目标完成 - 小型简报\n\n在本次任务的这个环节中，我们让月球着陆游戏在\
  \ Android 设备上运行。从步骤 1 到步骤 4，我们下载并安装了 Processing 编译 Android 应用所需的 Android SDK。随后，我们让游戏在模拟器中运行。\n\
  \n在步骤 6 中，我们稍微调整了代码，使游戏以全屏模式运行并将设备方向固定为横向模式。由于大多数 Android 设备不自带键盘，我们还添加了触摸屏输入支持。\n\
  \n最后，我们让应用在真实设备上运行。\n\n## 机密情报\n\nAndroid 模式还允许您将草图导出为 Android 项目，以便创建签名的 APK 文件，然后可用于将应用上传到\
  \ Google Play，或者如果您想自行分发。有关如何执行此操作的详细说明，可在 Processing Wiki 中找到：`http://wiki.processing.org/w/Android#Distributing_Apps`。\n\
  \n## 任务完成\n\n在本次任务中，我们创建了一个月球着陆模拟游戏，并使用 Processing 的 JavaScript 模式使其在浏览器中运行，使用 Android\
  \ 模式使其在 Android 设备上运行。\n\n在第一个任务“绘制精灵”中，我们从背景网格开始创建了游戏图形，使游戏看起来像是画在数学笔记本上。随后，我们添加了月球地貌和着陆平台。火箭需要能够移动和旋转，因此我们使用\
  \ pushMatrix() 和 popMatrix() 方法，将我们想要对图像执行的平移和旋转操作与其余绘图代码分开。\n\n在第二个任务“启动着陆序列”中，我们实现了游戏的物理效果和控制。我们首先为月球重力和火箭速度各添加了一个向量。每帧中，重力影响飞船的速度，进而影响火箭的位置。\n\
  \n然后我们实现了 keyPressed() 方法，使玩家能够旋转并加速火箭。加速度也会被添加到火箭的速度向量中。\n\n最后，我们实现了游戏循环，并在火箭撞击月球或降落在平台上时停止游戏。\n\
  \n在第三个任务“在浏览器中运行您的草图”中，我们使用 Processing 的 JavaScript 模式创建了一个可在浏览器中运行的 JavaScript\
  \ 版本。我们激活了图像预加载，以确保火箭图像在游戏启动时即可用，并学习了如何更改嵌入草图的 HTML 模板。\n\n在最终任务“在 Android 手机上运行游戏”中，我们使用\
  \ Processing 的 Android 模式从游戏创建了一个 Android 应用。我们安装了 Android SDK 和必要的 API。我们稍微调整了代码，使应用以全屏模式运行，并将旋转固定为横向模式。\n\
  \n为了使游戏在没有键盘的设备上可玩，我们不得不更改游戏控制以支持触摸屏。\n\n## 你准备好全力以赴了吗？一个高手挑战\n\n为本示例创建了一个不错的小型休闲游戏，可游玩，但可以通过多种方式进行扩展和完善，例如：\n\
  \n- 使用速度和着陆角度计算着陆得分\n- 创建最高得分列表\n- 使用 Android 设备的倾斜传感器控制火箭\n- 限制玩家可用于着陆的燃料\n- 尝试使月球表面呈圆形，并使用极坐标计算着陆平台的位置\n\
  - 使用 Android 设备作为游戏桌面版本的控制器\n"
- "# 项目 7\n\n## 霓虹地球仪\n\n80 年代电影中几乎每个英雄、电脑黑客或反派，在其总部的电脑屏幕上都会放一个旋转的霓虹地球仪——嗯，呃——大概是为了强调他们的全球影响力。但谁在乎呢！这些旋转的线框地球绘图绝对非常酷，因此我们的当前任务是重现这些视觉效果，并为我们的任务控制室创建一个旋转的霓虹地球仪。\n\
  \n## 任务简报\n\n在本次任务中，我们将从球体网格开始创建一个旋转的霓虹地球仪。然后我们将添加一些灯光来使球体平滑。随后，我们将向球体添加世界地图贴图，将其变成一个旋转的地球仪。最后，我们将使用\
  \ Processing 2 中添加的着色器框架的一些滤镜，添加类似早期街机机柜矢量显示器或旧詹姆斯·邦德电影中显示器的发光效果。\n\n而且由于我们不再生活在\
  \ 80 年代，我们还将添加将地球仪切换到现代卫星图像显示的功能。\n\n## 为什么这很酷？\n\n本次任务让我们有机会探索 Processing 强大的 3D\
  \ 功能。我们从一个简单的球体线框模型开始，然后学习如何为场景添加灯光并为网格添加贴图。对于最终任务，我们将学习如何创建在显卡上并行运行的代码，而不会进一步加重\
  \ CPU 负担或降低草图的帧率。\n\n\n\n\n\n## 你的高手目标\n\n我们当前的任务目标如下：\n\n- 旋转球体\n- 让光芒乍现\n- 从球体到地球仪\n\
  - 从地球仪到霓虹地球仪\n\n## 任务清单\n\n执行此任务，除了 Processing 之外，我们不需要任何库、SDK 或其他附加软件。我们将创建 3D\
  \ 图形，因此你的计算机必须配备一块能够加速 3D 渲染并支持 OpenGL 2.0 或更高版本的显卡。如果你的计算机或显卡是在 2005 年之后制造的，那你肯定没问题。\n\
  \n## 旋转球体\n\n我们当前任务的第一项任务是创建球体网格并使其在屏幕上旋转。我们将创建类似于地球仪上经纬圈的网格。为了简化创建这些环所需的数学计算，我们将使用极坐标，并在创建球体时将其转换为笛卡尔\
  \ XYZ 坐标。Processing 在存储模型数据时可以利用显卡内存，如果对象本身是静态的，这将大大提高在屏幕上绘制对象的速度。由于我们的球体在草图运行过程中不会改变，我们将使用\
  \ PShape 对象来存储模型数据。\n\n## 启动推进器\n\n让我们从创建球体网格开始：\n\n- 1. 打开一个新的草图并添加 `setup()` 和\
  \ `draw()` 方法。\n\n```\nvoid setup() {\n}\n\nvoid draw() {\n}\n```\n\n- 2. 在 `setup()`\
  \ 方法中，我们定义草图窗口大小并将渲染模式设置为 P3D。我们还创建一个名为 `sphere` 的 `PShape` 对象来存储网格数据。`PShape sphere;`\n\
  \n```\nvoid setup() {\n  size(400, 400, P3D);\n}\n```\n\n- 3. 接下来，我们创建一个名为 `makeSphere()`\
  \ 的新方法，它以半径和步长（以度为单位）作为参数。我们函数的返回值是包含球体顶点的新 `PShape` 对象。\n\n`PShape makeSphere(\
  \ int r, int step ) {`\n\n- 4. 极坐标使用两个角度和一个半径来定义球面上的一点；每个点到原点的距离相同，因此我们的半径保持固定，但角度会变化。我们将定义两个嵌套循环来遍历所有可能的角度位置。\n\
  \n```\nPShape makeSphere( int r, int step ) {\n  PShape s = createShape();\n\n \
  \ s.noFill();\n  s.stroke(255);\n  s.strokeWeight(2);\n\n  for (int i = 0; i < 180;\
  \ i += step) {\n    for (int j = 0; j <= 360; j += step) {\n    }\n  }\n\n  return\
  \ s;\n}\n```\n\n- 5. 现在我们将使用极坐标通过四边形条在球体上生成环。我们需要定义点对（如下图所示），并使用 `vertex()` 方法将转换后的笛卡尔坐标传递给我们的\
  \ `PShape` 对象：\n\n![img/5cb67baa7bc7778de360b14c00d1ab81_177_0.png]\n\n- 6. 要将极坐标转换为笛卡尔坐标，我们需要计算角度的正弦和余弦值。Processing\
  \ 期望角度（我们将其用作三角函数或 rotate 语句的输入）以弧度表示，即完整圆周为 0 到 2π 而不是 0 到 360。我们将在将角度传递给这些函数之前使用\
  \ radians() 方法将其转换。\n\n```\nPShape makeSphere( int R, int step ) {\n  PShape s =\
  \ createShape();\n  s.beginShape(QUAD_STRIP);\n  s.noFill();\n  s.stroke(255);\n\
  \  s.strokeWeight(2);\n  for (int i = 0; i < 180; i += step) {\n    float sini =\
  \ sin(radians(i));\n    float cosi = cos(radians(i));\n    float sinip = sin(radians(i\
  \ + step));\n    float cosip = cos(radians(i + step));\n    for (int j = 0; j <=\
  \ 360; j += step) {\n      float sinj = sin(radians(j));\n      float cosj = cos(radians(j));\n\
  \      s.vertex(R * cosj * sini, R * -cosi, R * sinj * sini);\n      s.vertex(R\
  \ * cosj * sinip, R * -cosip, R * sinj * sinip);\n    }\n  }\n  s.endShape();\n\
  \  return s;\n}\n```\n\n- 7. 在我们的 `setup()` 方法中，我们添加对 `makeSphere()` 方法的调用。\n\n\
  ```\nvoid setup() {\n  size(400, 400, P3D);\n  sphere = makeSphere(150, 5);\n}\n\
  ```\n\n- 8. 为了使球体可见，我们需要在 `draw()` 方法中使用 `shape()` 方法来使用我们的 sphere 对象。\n\n```\n\
  void draw() {\n  background(0);\n  translate(width/2, height/2);\n  shape(sphere);\n\
  }\n```\n\n- 9. 现在运行你的草图。球体应该看起来像这样：\n\n![img/5cb67baa7bc7778de360b14c00d1ab81_179_0.png]\n\
  \n- 10. 现在我们将使球体旋转。在我们的 `setup()` 方法中，我们使用 `frameRate()` 方法将帧率固定为每秒 25 帧。\n\n```\n\
  void setup() {\n  size(400, 400, P3D);\n  frameRate(25);\n  sphere = makeSphere(150,\
  \ 5);\n}\n```\n\n- 11. 接下来，我们定义一个旋转角度变量，并在 `draw()` 方法中每帧增加它。我们还添加对 `rotateX()`\
  \ 的调用以略微倾斜球体，以及对 `rotateY()` 的调用以使其绕 y 轴旋转。\n\n```\nfloat a = 0;\n\nvoid draw()\
  \ {\n  background(0);\n  translate(width/2, height/2);\n  pushMatrix();\n  rotateX(radians(-30));\n\
  \  rotateY(a);\n  a += 0.01;\n  shape(sphere);\n  popMatrix();\n}\n```\n\n- 12.\
  \ 运行你的草图。我们现在有一个旋转的球体线框模型了。\n\n## 任务完成 - 简要总结\n\n对于本次任务的第一项任务，我们创建了球体的 3D 网格。在步骤\
  \ 1 到 5 中，我们创建了一个名为 `makeSphere()` 的方法，它使用两个 `for` 循环在球面上以极坐标生成点。然后我们将这些点转换为笛卡尔坐标并生成四边形条以形成我们的网格。我们使用\
  \ `PShape` 对象来存储网格数据，因为网格数据在运行时不会改变，Processing 只需在创建网格时将顶点数据传输到显卡内存一次，而不是每帧都传输。\n\
  \n在我们的 `draw()` 方法中，我们使用了 `PShape` 对象；我们将其在 x 轴上倾斜 30 度，并通过将帧率限制为每秒 25 帧并在每帧向旋转角度添加少量值来使其绕\
  \ y 轴旋转。\n\n## 让光芒乍现\n\n我们当前任务的第二项任务是将我们在第一项任务中创建的网格转换为具有平滑表面的实心球体。我们将使用不同的光源来照亮球体，并为每个顶点定义所谓的法线矢量，以使球体表面看起来平滑，而无需非常密集的网格。\n\
  \n## 启动推进器\n\n让我们打开一些灯光：\n\n- 1. 打开我们为上一项任务创建的草图。\n- 2. 我们的网格目前是中空的，我们可以看到球体的正面线条以及背面。要改变这一点，我们可以为面定义填充颜色。\n\
  \n```\nPShape makeSphere(int r, int step) {\n  PShape s = createShape();\n\n  s.beginShape(QUAD_STRIP);\n\
  \  s.fill(200);\n  s.stroke(255);\n  s.strokeWeight(2);\n  for (int i = 0; i < 180;\
  \ i += step) {\n    float sini = sin(radians(i));\n    float cosi = cos(radians(i));\n\
  \    float sinip = sin(radians(i + step));\n    float cosip = cos(radians(i + step));\n\
  \n    for (int j = 0; j <= 360; j += step) {\n      float sinj = sin(radians(j));\n\
  \      float cosj = cos(radians(j));\n      s.vertex(r * cosj * sini, r * -cosi,\
  \ r * sinj * sini);\n      s.vertex(r * cosj * sinip, r * -cosip, r * sinj * sinip);\n\
  \    }\n  }\n  s.endShape();\n  return s;\n}\n```\n\n- 3. 运行你的草图。球体应该看起来像下面的屏幕截图中的那样：\n\
  \n![img/5cb67baa7bc7778de360b14c00d1ab81_181_0.png]\n\n- 4. 现在我们将通过调用 `noStroke()`\
  \ 函数来移除网格上的线条。\n\n```\nPShape makeSphere(int R, int step) {\n  PShape s = createShape();\n\
  \n  s.beginShape(QUAD_STRIP);\n  s.fill(255);\n  s.noStroke();\n  for (int i = 0;\
  \ i < 180; i += step) {\n    float sini = sin(radians(i));\n    float cosi = cos(radians(i));\n\
  ```\n\n- 5. 现在我们的球体不再有网格线了；它被完全平铺渲染，看起来像个白色圆圈（因为默认情况下，Processing 中只允许环境光保持活动）。要解决这个问题，我们需要添加一个光源。我们要添加的第一个光源是点光源。我们需要在前三个参数中定义光源的颜色，然后是其位置的\
  \ x、y 和 z 坐标。点光源像一个非常小但非常亮的灯泡。将以下行添加到 `draw()` 方法中：\n\n```\nvoid draw() {\n  background(0);\n\
  \  translate(width/2, height/2);\n  pointLight(255, 255, 255, -250, -250, 500);\n\
  \  pushMatrix();\n  rotateX(radians(-30));\n  rotateY(a);\n  a += 0.01;\n  shape(sphere);\n\
  \  popMatrix();\n}\n```\n\n- 6. 运行你的草图。球体现在有阴影了，但看起来不像我们希望的那样平滑。正如你在下面的屏幕截图中所见，我们定义的四边形条围绕球体呈环形运行；在它们相互接触的地方可见明显的尖锐弯曲：\n\
  \n![img/5cb67baa7bc7778de360b14c00d1ab81_182_0.png]\n\n\n\n\n\n- 7. 为修复此问题，我们需要为每个顶点定义法线向量，使其指向球体表面的外方，如图所示：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_183_0.png)\n\n- 8. 我们已经计算了法线向量所需的正弦和余弦值。我们将使用\
  \ normal() 方法将法线向量添加到我们的网格中。每个法线向量必须在 makeSphere() 方法中的 vertex() 方法之前定义。\n\n```\n\
  PShape makeSphere( int r, int step) {\nPShape s = createShape();\n\ns.beginShape(QUAD_STRIP);\n\
  s.fill(255);\ns.noStroke();\nfor( int i = 0; i < 180; i+=step ) {\nfloat sini =\
  \ sin( radians( i ));\nfloat cosi = cos( radians( i ));\nfloat sinip = sin( radians(\
  \ i + step ) );\nfloat cosip = cos( radians( i + step ) );\n\nfor( int j = 0; j\
  \ <= 360; j+=step ) {\nfloat sinj = sin( radians( j ));\nfloat cosj = cos( radians(\
  \ j ));\n\ns.normal( cosj * sini, -cosi, sinj * sini);\ns.vertex( r * cosj * sini,\
  \ r * -cosi, r * sinj * sini);\n\ns.normal( cosj * sinip, -cosip, sinj * sinip);\n\
  s.vertex( r * cosj * sinip, r * -cosip, r * sinj * sinip);\n}\n}\n\ns.endShape();\n\
  return s;\n}\n```\n\n- 9. 运行你的草图。球体应该看起来平滑，如下面的屏幕截图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_184_0.png)\n\
  \n- 10. 目前，我们球体的一半有黑暗的阴影，因此我们需要一种方法来使光照更均匀。幸运的是，Processing 具有一个名为 `lights()` 的快捷方法，它设置了一个从相机指向原点的光源。因此，我们现在将更改我们的\
  \ `draw()` 方法，并用对 `lights()` 方法的调用替换点光源。\n\n```\nvoid draw() {\n  background(0);\n\
  \  translate( width/2, height/2 );\n  lights();\n  pushMatrix();\n  rotateX( radians(\
  \ -30 ) );\n  rotateY( a );\n  a+= 0.01;\n  shape( sphere );\n\n  popMatrix();\n\
  }\n```\n\n- 11. 运行你的草图。球体应该看起来像这样：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_184_1.png)\n\
  \n## 任务完成 - 小型简报\n\n在当前任务的第二个任务中，我们将球体的线框网格变成了实心平滑球体，并激活了一些灯光。在步骤 1 到 5 中，我们关闭了线条描边并激活了面的填充。我们还激活了一个点光源，以防止球体被渲染得完全平面。\n\
  \n我们的球体有了阴影和填充，但在我们使用 makeSphere() 方法中的循环创建的四边形带环上，存在尖锐弯曲。要修复此问题，我们为每个顶点添加了法线向量。这些向量与表面垂直，用于使球体表面平滑着色。\n\
  \n最后，我们学习了如何更均匀地照亮球体，以便可以看到它的每个部分；这是因为在第三个任务中，我们将把球体变成地球仪，并且希望世界的每个部分都可见。\n\n##\
  \ 从球体到地球仪\n\n我们当前任务的第三个任务是通过使用纹理图像将球体转换为地球仪。我们需要定义每个顶点到纹理图像一部分的映射，以使其适配。我们将使用黑白纹理，其中所有陆地都是黑色，海洋是白色。该图像基于\
  \ STUDIO7DESIGNS 按 Creative Commons 许可授权的矢量地图创建，可以在 `http://vector4free.com/vectors/id/75`\
  \ 处找到。我添加了南极洲并将其转换为 PNG 文件。\n\n之后，我们将添加由 NASA 的 Visible Earth 项目 (`http://visibleearth.nasa.gov/`)\
  \ 提供的卫星图像。我们还将添加键盘事件的回调处理程序，并使纹理可切换。\n\n## 点火推进器\n\n让我们开始为地球仪添加纹理：\n\n- 1. 首先，我们需要将地球仪的图像添加到草图中。从\
  \ www.packtpub.com/support 的下载部分下载图像。地图如下所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_186_0.png)\n\
  \n- 2. 将图像拖动到草图窗口，或使用草图菜单下的“添加文件...”选项添加它。\n\n- 3. 现在我们需要定义一个 PImage 变量来保存纹理图像，并在\
  \ setup() 方法中加载它。\n\n```\nPShape sphere;\nPImage world;\nvoid setup() {\n size(400,\
  \ 400, P3D);\n frameRate(25);\n world = loadImage( \"world.png\" );\n sphere = makeSphere(\
  \ 150, 5, world);\n}\n```\n\n- 4. 我们扩展 makeSphere() 方法以将纹理作为参数，并调整 setup() 方法中对\
  \ makeSphere() 的调用。\n\n```\nvoid setup() {\n size(400, 400, P3D);\n frameRate(25);\n\
  \ world = loadImage( \"world.png\" );\n sphere = makeSphere( 150, 5, world);\n}\n\
  ```\n\n```\nPShape makeSphere( int r, int step, PImage tex ) {\n```\n\n- 5. 现在让我们在网格中激活纹理。\n\
  \n```\nPShape makeSphere( int r, int step, PImage tex ) {\nPShape s = createShape();\n\
  \ns.beginShape(QUAD_STRIP);\ns.texture( tex );\ns.noStroke();\n```\n\n- 6. 如果我们现在运行草图，将无法看到任何东西，因为只会使用纹理的一小部分（颜色为黑色）。要修复此问题，我们需要为每个顶点添加\
  \ u 和 v 坐标，以定义应该使用纹理的哪一部分。由于我们使用两个循环（用于遍历极坐标的角度）定义了球体网格，因此可以简单地将它们映射到 u 和 v 坐标。\n\
  \n```\nPShape makeSphere( int r, int step, PImage tex ) {\nPShape s = createShape();\n\
  \ns.beginShape(QUAD_STRIP);\n\ns.texture( tex );\ns.noStroke();\nfor( int i = 0;\
  \ i < 180; i+=step ) {\n    float sini = sin( radians( i ) );\n    float cosi =\
  \ cos( radians( i ) );\n    float sinip = sin( radians( i + step ) );\n    float\
  \ cosip = cos( radians( i + step ) );\n\nfor( int j = 0; j <= 360; j+=step ) {\n\
  \    float sinj = sin( radians( j ) );\n    float cosj = cos( radians( j ) );\n\
  \    float sinjp = sin( radians( j + step ) );\n    float cosjp = cos( radians(\
  \ j + step ) );\n\ns.normal( cosj * sini, -cosi, sinj * sini);\ns.vertex( r * cosj\
  \ * sini, r * -cosi, r * sinj * sini,\ntex.width-j * tex.width / 360, i * tex.height\
  \ / 180);\n\ns.normal( cosj * sinip, -cosip, sinj * sinip);\ns.vertex( r * cosj\
  \ * sinip, r * -cosip, r * sinj * sinip,\ntex.width-j * tex.width / 360, (i + step\
  \ ) * tex.height /\n180);\n            }\n        }\n        s.endShape( );\n  \
  \      return s;\n    }\n```\n\n- 7. 运行你的草图。球体应该看起来像这个屏幕截图中的那样：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_188_0.png)\n\
  \n- 8. 现在我们将添加两个更多纹理并使它们可切换。\n首先，从 www.packtpub.com/support 下载图像文件 bluemarble.jpg\
  \ 和 night.jpg。这些图像使用 NASA 的 Landsat 2、Terra 和 Aqua 卫星的图像创建，可在 http://visibleearth.nasa.gov/\
  \ 下载。我减小了尺寸，因为原始图像对于我们的小地球仪来说太详细了。蓝色大理石纹理如下所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_188_1.png)\n\
  \n这是地球之夜纹理：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_189_0.png)\n\n- 9. 我们通过将图像拖放到草图窗口，或通过“草图\
  \ | 添加文件...”将图像添加到我们的草图中。\n\n- 10. 现在我们将在草图中添加两个更多的 PImage 变量，并在 setup() 方法中加载图像。\n\
  \n```\nPShape sphere;\nPImage world;\nPImage bluemarble;\nPImage night;\n\nvoid\
