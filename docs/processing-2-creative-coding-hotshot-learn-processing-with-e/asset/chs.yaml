  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_190_0.png)\n\n- 13. 当地球之夜纹理处于活动状态时，地球仪看起来像这样：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_190_1.png)\n\n\n\n\n\n## 目标完成 - 小型简报\n\
  \n在第三个任务中，我们使用纹理将第二个任务中平滑处理并点亮的球体变成了地球仪。在第 2 步中，我们添加了一个纹理图像并创建了一个 `PImage` 对象来存储它。我们扩展了\
  \ `makeSphere()` 方法，使其接受纹理图像作为参数，然后将该图像用作球体的纹理。为了确保纹理被映射到我们的网格上，我们需要使用 `vertex()`\
  \ 方法的扩展版本，该版本还允许我们指定每个顶点要使用纹理的哪个部分。\n\n由于我们已经使用了两个循环来遍历极坐标的角度，因此我们使用相同的坐标作为纹理坐标的基础。我们只需将它们映射到纹理图像的高度和宽度上。\n\
  \n最后，我们添加了一个处理按键事件的回调函数，并用它来在纹理图像之间切换。我们添加了来自 NASA Visible Earth 项目的两张卫星图像。蓝色大理石图像是一张经过处理的卫星图像，显示行星上没有云层，而地球夜景图像展示了夜晚的地球仪。我们使用\
  \ `PShape` 类的 `setTexture()` 方法切换了形状的纹理，该方法会替换当前纹理。\n\n## 从地球仪到霓虹地球仪\n\n作为本次任务的最后一项任务，我们将把刚刚创建的地球仪转换成发光的霓虹地球仪。我们将创建一个适合出现在《战争游戏》或《电子世界争霸战》等\
  \ 80 年代电影中的地球仪。我们将通过对地球仪应用两个滤镜来创建这种发光效果。第一个是边缘检测滤镜，它会去除图像的所有填充区域，只保留大陆的轮廓。第二个滤镜将为我们的线条添加发光效果。我们将使用\
  \ OpenGL 着色语言 (GLSL) 实现这些滤镜。这些 GLSL 滤镜将由我们的显卡执行；它们不需要 CPU 资源。\n\n只有在显示大陆的简单纹理处于活动状态时，我们才会应用我们的滤镜，而当\
  \ NASA Visible Earth 项目的卫星图像处于活动状态时，我们将禁用它们。\n\n## 启动推进器\n\n让我们来创建我们的滤镜：\n\n- 1.\
  \ 首先，我们需要更改世界地图纹理的颜色，使海洋呈现黑色、大陆呈现绿色。打开我们在第三个任务中创建的草图，并将以下代码添加到我们的 `setup()` 方法中：\n\
  \n```\nvoid setup() {\n    size(400, 400, P3D);\n    frameRate(25);\nPGraphics g\
