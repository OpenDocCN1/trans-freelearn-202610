  \n## 目标完成 - 小结\n\n在本次任务的最后一项工作中，我们从电路中移除了免焊面包板，并将元件一起焊接。我们没有使用电路板，但由于我们的电路非常简单，我们直接使用一种有时称为\
  \ **乱线布线** 的技术将零件连接在一起。我们还通过将输入元件安装到盒子上，为控制器制作了一个外壳。\n\n正如我在本任务介绍中所说，控制器外壳的外观以及输入元件的布局主要取决于个人喜好。请随意将此控制器设计得尽可能个性或古怪。\n\
  \n## 任务完成\n\n我们当前的任务是为 Smilie-O-Mat 构建一个定制输入控制器。我们从一个可变电阻开始，将其连接到 Arduino——一块 AVR\
  \ 微控制器开发板。Arduino 使用 C++ 编程，但 API 与 Processing 语言非常相似，并且 Arduino IDE 使用与 Processing\
  \ IDE 相同的框架。我们在 Arduino IDE 中创建了一个程序，用于读取电阻值并通过串口将其发送到计算机。在 Processing 端，我们使用串行库读取消息并显示它们。\n\
  \n在第二个任务，*构建您的控制器*中，我们通过将三个可变电阻和一个按钮连接到免焊面包板来创建控制器原型。我们为发送到计算机的消息创建了一个简单的协议，这使我们能够发送输入值以及哪个控制器发生了变化。按钮在按压按钮的状态从按下变为释放时，每次都会向计算机发送一条\
  \ **click** 消息。\n\n\n\n\n在第三个任务“更换你的面孔”中，我们扩展了在项目 4 中创建的 Smile-O-Mat 草图，以解析来自控制器的消息。我们实现了一个\
  \ serialEvent() 回调方法，每当消息到达串行端口时都会调用该方法。在此方法中，我们检查消息的第一个字母，如果它以 A、B 或 C 开头，则将字符串的其余部分解析为整数。这些整数用于控制我们笑脸的面部参数。如果消息是\
  \ click，则我们触发 tweet() 方法，该方法将当前笑脸发送到 tweeter。\n\n当按钮被按下或释放时，存在一段短暂的时间，此时触点非常接近但尚未完全闭合。在这段时间内，按钮的短暂接触可能会意外触发多个点击事件。为了防止这种情况发生，我们创建了一个\
  \ 50 毫秒的时间槽，在此期间不发送第二个点击消息。这种技术称为 debouncing，在处理开关或按钮时非常常见。\n\n在最终任务“将其装入盒子”中，我们为控制器创建了外壳，并通过将元件焊接在一起使元件之间的连接永久化。我们没有使用电路板，而是直接将元件焊接在一起。我们使用铝制盒子作为外壳，并将旋钮排列成一条直线，但元件的布局和盒子的材质取决于个人喜好。这个控制器应该反映你的工作流程和个人偏好。按你喜欢的方式，让它尽可能传统或疯狂。\n\
  \n## 准备好大干一场了吗？一项热血挑战\n\nArduino 是一个极其酷炫的电子原型平台，适合初学者和专业人士。在这个项目中，我们当然只是触及了其可能性的表面。如果你喜欢钻研电子，尝试用以下任一方式扩展你的\
  \ Smile-O-Mat 草图：\n\n- 添加更多旋钮以控制更多面部参数\n- 添加电位器或旋转编码器以选择要推文的文本消息\n- 添加 LCD 显示屏以显示最后一条推文\n\
  - 将一些舵机和 RGB LED 连接到 Arduino，创建面部的机械动画版本\n"
- "# 项目 6\n\n## 飞向月球\n\n自从人们接触到计算机以来，他们就一直用它来玩游戏。最早的游戏之一是一款名为 Lunar Lander 的模拟游戏，玩家需要将月球登陆舱降落在月球上。第一个版本编写于\
  \ 1969 年，是基于文本的。这款游戏的第一个图形版本是在四年后为 DEC 终端编写的。此后，月球登陆模拟游戏已被移植到几乎每一种计算机系统上，这使得它成为我们当前任务的完美游戏，因为我们将使用\
  \ Processing 模式，通过 Processing.js 让游戏在浏览器中运行，并在 Android 设备上运行。\n\n## 任务简报\n\n我们当前的任务是创建一款月球着陆器游戏。游戏的第一个版本将是一个在您的计算机上运行的\
  \ Processing 草图，类似于我们在之前任务中创建的草图。然后，我们将使用各种 Processing 模式，通过 JavaScript 模式让游戏在浏览器中运行，并通过\
  \ Android 模式在 Android 设备上运行。\n\n对于这些模式中的每一个，如果有必要，我们将调整游戏控制以适应平台。\n\n## 为什么这很棒？\n\
  \n这个项目很棒有两个原因：首先，我们正在编写游戏，自计算机发明以来，这一直是官方令人惊叹的计算机项目列表上的项目；其次，我们编写的游戏可以在您的计算机、Android\
  \ 移动设备和浏览器中运行。这使我们能够涵盖当前几乎每个可上网的平台，从台式机和笔记本电脑到手机、平板电脑和智能电视。当 Java 问世时，它提出了“一次编写，到处运行”的承诺。Processing\
