- "# 项目 4\n\n## 笑脸制造机（Smilie-O-Mat）\n\n当我们通过 SMS、Twitter 或聊天等基于文本的媒介进行交流时，很难准确传达当前的感受。使用图片代替\
  \ 140 个字符的描述会容易且准确得多。人类终生都在训练读取面部表情中的情感，因此我们的下一个任务是创建一个笑脸制造机。这个小程序允许我们调整笑脸的某些面部参数，然后将图片发布到\
  \ Twitter。\n\n## 任务简报\n\n我们的任务是创建 Smile-O-Mat；一个允许用户创建反映其情绪状态的笑脸并将其发布到 Twitter 的程序。我们将使三个参数可调节：眉毛的角度、脸部的颜色以及嘴巴的位置（可变，从皱眉到微笑，反之亦然）。\n\
