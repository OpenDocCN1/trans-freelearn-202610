- "# 项目 5 笑脸制造器控制器\n\n在 Xerox PARC 发明鼠标和图形用户界面是计算机历史上的一件里程碑事件。鼠标是一种与计算机交互的非常多功能的机制，它使得数据输入和控制程序流程出现了一整套全新的方法。但是，如果一种工具适用于非常广泛的问题范围，通常意味着它没有针对任何一种问题进行优化。有些程序使用专用控制器会更容易、更快速或更符合人体工学。在本任务中，我们将为在\
  \ _第4项目 笑脸制造器_ 中创建的笑脸制造器草图创建一个自定义控制器。\n\n## 任务简报\n\n我们当前的任务是为在上一个项目中编写的笑脸制造器草图构建一个自定义控制器。我们将使用\
  \ Arduino 板（一种使用 AVR 微控制器的低成本开发板）、一个按钮和一些可变电阻。我们将通过 USB 将 Arduino 板连接到计算机，并创建一个简单的协议来控制笑脸的面部参数。\n\
  \n## 这有什么了不起的？\n\n如前所述，鼠标是一个出色且多功能的输入设备，但有时它并不是最佳选择。使用压感平板绘图要有趣得多，使用方向盘和踏板玩赛车游戏更有趣，使用键盘控制器制作音乐也更容易，仅举几例。有时我们需要一个专用控制器，以更快速或更自然的方式与我们的数据或流程进行交互。\n\
  \n了解如何将滑块、按钮和旋钮与计算机接口，使我们能够完全按照我们需要和想要的方式优化工作空间和工作流程。\n\n## 你的高手目标\n\n我们当前的任务包含四个任务。我们将从一个简单的“你好，世界”电路开始，并不断扩展它，直到为我们的笑脸制造器草图制作出一个可用的控制器板，然后为其制作一个外壳。我们当前任务的任务列表如下：\n\
  \n- 连接你的 Arduino\n- 构建你的控制器\n- 改变你的表情\n- 把它放进盒子里\n\n## 任务检查清单\n\n要构建控制器，我们需要一个 Arduino\
  \ 板、一个免焊面包板和一些电子元件，如下所示：\n\n- Arduino\n- 面包板\n- 导线\n- 一个按钮\n- 一个电阻（10 kOhm）\n- 三个可变电阻（100\
  \ kOhm）\n\n在本任务的最后一个任务中，我们将使用一个盒子和一些花哨的旋钮为控制器创建一个永久外壳。我还将提供本节中使用过的材料清单，但就像 _第1项目\
  \ 罗密欧与朱丽叶_ 中的机器人一样，外壳很大程度上是个人品味的问题。\n\n## 连接你的 Arduino\n\n向你的 Arduino 打个招呼。我们当前任务的第一个任务是编写一个在\
  \ Arduino 上运行并读取可变电阻值的草图。由于这是一本关于 Processing 的书，我们将编写一个 Processing 草图，用于从 Arduino\
  \ 板接收电阻值并打印该值。\n\n## 准备起飞\n\n在这个任务中，我们将编写在 Arduino 上运行的代码，因此需要安装 Arduino IDE。你可以从\
  \ www.arduino.cc 下载它，并通过解压与操作系统匹配的包来安装。\n\n## 启动推进器\n\n让我们连接 Arduino：\n\n1. 为本任务需要做的第一件事是搭建一个小电路，因此请拿一个可变电阻，像下图所示一样将其连接到免焊面包板上：\n\
  \n![](img/5cb67baa7bc7778de360b14c00d1ab81_125_0.png)\n\n2. 现在将一根红色导线从 Arduino 板的\
  \ 5V 引脚连接到电阻的一外侧引线上。\n\n3. 电阻的中间引脚连接到 Arduino 板上标记为 ANALOG IN 0 的引脚。\n\n4. 将一根黑色导线从\
  \ Arduino 的 Gnd 引脚连接到电阻的剩余引脚。你的连接应如下图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_126_0.png)\n\
  \n5. 现在将 Arduino 板连接到计算机的 USB 端口并启动 Arduino IDE。\n\n6. 确保通过检查 工具 | 串行端口 菜单选择了正确的串行端口，并通过检查\
  \ 工具 | 开发板 菜单选择了正确的 Arduino 板类型。\n\n7. 我们的第一个 Arduino 草图将使用 Arduino 的内置 LED。我们将使用刚刚添加的可变电阻来控制\
  \ LED 的闪烁速度。现在，我们将以下代码添加到 Arduino 草图并保存它：\n\n```\nint del = 5;\nboolean state =\
  \ true;\n```\n\n8. 单击验证图标验证代码，如果一切编译正常，单击上传按钮将代码安装到你的 Arduino 上。\n\n9. 旋转可变电阻的旋钮并检查\
  \ LED 的闪烁速度。\n\n10. 现在我们希望 Arduino 通过串行端口将可变电阻的值发送到计算机。将以下代码行添加到 Arduino 草图的 setup()\
  \ 方法中，以初始化串行端口并设置其速度，如下所示：\n\n```\nvoid setup() {\n  pinMode( 13, OUTPUT );\n  Serial.begin(\
  \ 9600 );\n}\n```\n\n11. 在我们的 loop() 方法中，我们使用 Serial 对象的 println() 方法打印电阻值。我们还从草图中删除了\
  \ LED 闪烁代码和延迟：\n\n```\nvoid loop() {\n  del = analogRead( 0 );\n  Serial.println(\
  \ del );\n}\n```\n\n12. 单击验证和上传图标，在 Arduino 上编译并安装草图。\n\n13. 现在我们需要打开串行监视器来查看 Arduino\
  \ 发送的值。使用 工具 | 串行监视器 菜单查看串行监视器，旋转电阻的旋钮，然后观察控制台上的值的变化。\n\n14. 目前，每次 Arduino 运行主循环时都会发送电阻值，但大多数时候值没有改变。因此，让我们仅在值发生变化时发送值，方法是存储我们发送的上一个值并将其与当前值进行比较。\n\
  \n```\nint del = 5;\nint lastDel = 0;\n\nvoid loop() {\n  del = analogRead( 0 );\n\
  \  if (abs( del - lastDel ) > 10 ) {\n    Serial.println( del );\n    lastDel =\
  \ del;\n  }\n}\n```\n\n15. 将代码编译并上传到 Arduino 并打开串行监视器。如果你现在旋转旋钮，你会看到改变后的值，但如果保持原样，则不会发送任何值。\n\
  \n16. 现在我们完成了第一个任务的 Arduino 部分，让我们切换到它的 Processing 部分。打开 Processing，创建一个新草图，并添加\
  \ setup() 和 draw() 方法：\n\n```\nvoid setup() {\n}\n```\n\n```\nvoid draw() {\n}\n\
  ```\n\n17. 为了与 Arduino 通信，我们需要导入串行库，这使我们能够在 Processing 草图中使用串行端口。因此，使用 草图 | 导入库\
  \ ... | 串行 菜单导入库。\n\n我们创建串行端口对象的实例，并定义一个字符串，用于存储从串行端口读取的文本行：\n\n```\nimport processing.serial.*;\n\
  \nSerial port;\nString str = \"\";\n```\n\n18. 然后，我们将以下代码添加到 setup() 方法中以初始化串行端口并定义字体。请确保使用与第\
  \ 6 步在 Arduino IDE 中使用的串行板相同的名称。在此情况下，它是 /dev/ttyUSB0。\n\n```\nvoid setup() {\n\
  \  size( 300,300 );\n  port = new Serial( this, \"/dev/ttyUSB0\", 9600 );\n  textFont(\
  \ createFont( \"Sans\", 64 ) );\n}\n```\n\n19. 在 draw() 方法中，我们只需输出字符串变量的内容：\n\n\
  ```\nvoid draw() {\n  background( 255 );\n  fill(0);\n  text( str, 20, 100 );\n\
  }\n```\n\n20. 现在，我们添加一个名为 serialEvent() 的回调方法，每次串行端口检测到活动时都会调用它。我们从当前缓冲区读取字符串，直到找到换行符，然后将其存储在我们的字符串变量中：\n\
  \n```\nvoid serialEvent( Serial p ) {\n  String in = p.readStringUntil( '\\n' );\n\
  \  if ( in != null ) {\n    str = in;\n  }\n}\n```\n\n21. 现在，连接你的 Arduino 并启动你的\
  \ Processing 草图。旋转旋钮并观察值的变化。你的草图窗口应如下屏幕截图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_129_0.png)\n\
  \n## 目标完成 - 简要总结\n\n在本任务的第一个任务中，我们创建了一个在微控制器上运行并读取可变电阻值的 Arduino 草图。我们创建了一个简单电路来将电阻连接到\
  \ Arduino。然后，从第 1 步到第 9 步，我们让草图读取电阻值，并使用该值来改变内置 LED 的闪烁速度。\n一旦该代码安装到微控制器上，它将独立于任何计算机运行，并仅将\
  \ USB 电缆用作电源。如果你断开 USB 电缆并使用交流适配器或电池为 Arduino 板供电，你的草图仍将运行。\n\n\n\n\n从第 10 步开始，我们删除了闪烁代码，并用调用\
  \ `Serial` 对象的 `println()` 方法来替代它，该方法使用内置串口将电阻值发送到计算机。要读取这些值，我们使用了 Arduino IDE 提供的串行监视器。\n\
  \n在第 16 步，我们开始编写一个 Processing 应用程序，它监听串行端口而不是串行监视器，并使用 Processing 的 `serial` 库显示其在串行端口上读取的值。\n\
  \n## 机密情报\n\nArduino 从可变电阻发送的值范围是 0 到 1,023。通常，我们期望旋钮左侧的值为零，右侧为最大值。如果您的控制器发送的值正好相反，您有两种方法来修复此问题。在硬件方面，您可以切换连接到\
  \ Arduino 开发板上 **Gnd** 和 **5V** 的导线。在软件方面，您可以通过用最大值减去该值来计算值：\n\n```\nval = 1023\
  \ - val;\n```\n\n如果您已经焊接了电路，软件方面尤其有帮助。\n\n## 构建您的控制器\n\n在本次任务的第一个任务中，我们学习了如何将可变电阻连接到\
  \ Arduino 并使用串行端口将其值发送到计算机。我们的下一个任务是扩展这个基本电路并再添加两个电阻，因为我们想在下一个任务中使用它们来控制 Smilie-O-Mat\
  \ 草图的所有面部参数。\n\n我们还将向电路中添加一个按钮，并学习如何检测点击事件并将其发送到我们的草图。我们将稍微扩展通信协议，并编写一个新的 Processing\
  \ 草图，该草图将解析我们的 Arduino 生成的消息并显示我们发送的值。\n\n## 启动推进器\n\n让我们构建我们的控制器：\n\n- 1. 对于此任务，我们需要扩展电路并再添加两个可变电阻。所以让我们先将\
  \ 5V 引脚连接到面包板的一个外部电源轨，将 Gnd 引脚连接到另一个外部电源轨。如下图所示，将三个电阻连接到面包板：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_131_0.png)\n\
  \n- 2. 将每个电阻的左外侧引线连接到 5V 电源轨，将另一侧连接到 Gnd，如下图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_132_0.png)\n\
  \n- 3. 现在将 Arduino 引脚（模拟输入 0、1 和 2）连接到电阻的中间引脚。您的布线应如下图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_133_0.png)\n\
  \n- 4. 在我们的 loop() 方法中，我们需要复制读取值并将其发送到串行端口的代码，以读取另外两个端口：\n\n```\nint a = 0;\nint\
  \ lastA = a;\n\nint b = 0;\nint lastB = b;\n\nint c = 0;\nint lastC = c;\n\nvoid\
  \ setup() {\n  Serial.begin( 9600 );\n}\n\nvoid loop() {\n    a = analogRead( 0\
  \ );\n    if ( abs( a - lastA ) > 10 ) {\n        Serial.println( a );\n       \
  \ lastA = a;\n    }\n    b = analogRead( 1 );\n    if ( abs( b - lastB ) > 10 )\
  \ {\n        Serial.println( b );\n        lastB = b;\n    }\n    c = analogRead(\
  \ 2 );\n    if ( abs( c - lastC ) > 10 ) {\n        Serial.println( c );\n     \
  \   lastC = c;\n    }\n}\n```\n\n- 5. 编译代码并将其上传到 Arduino。\n\n- 6. 现在运行我们为第一个任务“连接您的\
  \ Arduino”创建的 Processing 草图，并转动电阻的旋钮。我们看到值在变化，但我们的 Processing 草图无法识别是哪个电阻发送了该值。所以，切换回\
  \ Arduino IDE，让我们在值前面添加字母 A、B 或 C：\n\n```\nvoid loop() {\n    a = analogRead( 0\
  \ );\n    if ( abs( a - lastA ) > 10 ) {\n        Serial.print( \"A\" );\n     \
  \   Serial.println( a );\n        lastA = a;\n    }\n    b = analogRead( 1 );\n\
  \    if ( abs( b - lastB ) > 10 ) {\n        Serial.print( \"B\" );\n        Serial.println(\
  \ b );\n        lastB = b;\n    }\n    c = analogRead( 2 );\n    if ( abs( c - lastC\
  \ ) > 10 ) {\n        Serial.print( \"C\" );\n        Serial.println( c );\n   \
  \     lastC = c;\n    }\n}\n```\n\n- 7. 编译并上传代码到 Arduino。\n\n- 8. 现在运行 Processing\
  \ 草图并转动旋钮。每个旋钮控制我们 Processing 草图中的一个对应变量。这里可以看到输入 B 的值已更改：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_135_0.png)\n\
  \n- 9. 要完成控制器的电路，我们需要添加一个按钮。将按钮的两个引线连接到面包板，并添加 10 kOhm 电阻，如下图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_135_1.png)\n\
  \n- 10. 现在从 Gnd 线到您刚刚添加的电阻建立一个连接，并从 5V 线到按钮的第二个触点建立一个连接。\n\n- 11. 将 Arduino 开发板的数字\
  \ 2 引脚连接到电阻和按钮之间，如下图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_136_0.png)\n\
  \n- 12. 您 Arduino 的数字引脚可以配置为输入和输出，因此将以下高亮代码行添加到 Arduino 草图的 setup() 方法中，以将引脚 2 配置为用作输入：\n\
  \n```\nvoid setup() {\n  pinMode( 2, INPUT );\n  Serial.begin( 9600 );\n}\n```\n\
  \n- 13. 现在添加一个变量来存储按钮的上一个状态，并将其初始化为 LOW：\n\n```\nint button = LOW;\nint buttonLast\
  \ = LOW;\n```\n\n- 14. 在我们的 `loop()` 方法中，我们将读取按钮的当前状态并将其与我们保存的上一个值进行比较。如果按钮状态从 *pressed*\
  \ 变为 *released*，我们将向串行总线发送一条消息：\n\n```\nvoid loop() {\n  a = analogRead( 0 );\n\
  \  if ( abs( a - lastA ) > 10 ) {\n    Serial.print( \"A\" );\n    Serial.println(\
  \ a );\n    lastA = a;\n  }\n\n  b = analogRead( 1 );\n  if ( abs( b - lastB ) >\
  \ 10 ) {\n    Serial.print( \"B\" );\n    Serial.println( b );\n    lastB = b;\n\
  \  }\n\n  c = analogRead( 2 );\n  if ( abs( c - lastC ) > 10 ) {\n    Serial.print(\
  \ \"C\" );\n    Serial.println( c );\n    lastC = c;\n  }\n\n  button = digitalRead(\
  \ 2 );\n  if ( buttonLast == HIGH && button == LOW ) {\n    Serial.println( \"click\"\
  \ );\n  }\n\n  buttonLast = button;\n}\n```\n\n- 15. 编译并上传代码到 Arduino，然后切换到 Processing。\n\
  \n- 16. 运行我们的 Processing 草图，转动旋钮，并按下按钮。每个旋钮现在发送自己的消息，当按钮被按下时，我们在 Processing 端收到一条消息。按下按钮时，我们的\
  \ Processing 草图看起来如下：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_137_0.png)\n\n\
  - 17. 您当前的布线看起来应该如下图所示：\n\n![](img/5cb67baa7bc7778de360b14c00d1ab81_138_0.png)\n\
  \n## 任务完成 - 小型简报\n\n在我们当前任务的这个任务中，我们创建了 Smile-O-Mat 控制器所需硬件的原型版本。我们添加了三个可变电阻，并在第\
  \ 8 步中定义了一个协议，通过串行端口将这些输入的值发送到计算机。该协议还允许我们检测哪个输入旋钮已被转动。\n\n从第 11 步开始，我们扩展了电路并添加了一个按钮。我们还扩展了发送到计算机的消息，添加了点击消息。当按钮值从\
  \ pressed 变为 released 时，将传输此消息，我们将在下一个任务中使用它来触发我们的 tweet () 方法。\n\n## 改变您的面容\n\n\
  我们当前任务的任务是将我们刚刚创建的原型硬件控制器集成到 Smile-O-Mat 控制器中。我们将扩展程序以解析基于 Arduino 的控制器通过串行端口发送的消息，并调整滑块以匹配硬件旋钮的值。当我们的控制器的用户按下开发板上的按钮时，我们将调用\
  \ tweet () 方法。\n\n## 启动推进器\n\n让我们使用控制器更改我们的笑脸：\n\n- 1. 打开我们上一个任务中的 Smile-O-Mat 草图。\n\
  \n- 2. 要访问串行端口，我们需要导入串行库，因此请使用 草图 | 导入库 ... | 串行 菜单来导入它。\n\n- 3. 现在向您的草图添加一个 Serial\
  \ 对象：\n\n```\nimport twitter4j.*;\nimport processing.serial.*;\n\nSerial port;\n\
  \nTwitter twitter;\nString[] tweets = {\n\"I feel like so #SmilieOMat\",\n\"I currently\
  \ feel like this #SmilieOMat\",\n\"This is how I feel #SmilieOMat\"\n}\n...\n```\n\
  \n- 4. 在 setup() 方法中，我们需要初始化串行端口。请务必更改串行端口的端口名称，就像在本次任务的第一个任务中所做的那样：\n\n```\nvoid\
  \ setup() {\nsize( 300,390 );\nsmooth();\nbackground( 255 );\ncolorMode( HSB );\n\
  textFont( createFont( \"Georgia\", 20 ) );\ninitTwitter();\nport = new Serial( this,\
  \ \"/dev/ttyUSB1\", 9600 );\n}\n```\n\n- 5. 我们需要解析来自串行端口的消息；因此让我们添加 serialEvent()\
  \ 方法，以便在每次有消息可用时收到通知。我们正在检查获取的字符串的首字母，如果它以大写字母 A、B 或 C 开头，那么我们将解析字符串的其余部分并将其存储在面部参数的控制变量中：\n\
  \n```\nvoid serialEvent( Serial p ) {\nString in = p.readStringUntil( '\\n' );\n\
  if ( in != null ) {\nif ( in.charAt( 0 ) == 'A' ) {\neye = int(in.substring( 1,in.length()\
  \ - 2 ) );\n```\n\n\n\n```} else if ( in.charAt( 0 ) == 'B' ) {\n  mouth = int(in.substring(\
  \ 1,in.length()-2 ));\n} else if ( in.charAt( 0 ) == 'C' ) {\n  col = int(in.substring(\
  \ 1,in.length()-2 ));\n}\n}\n```\n\n- 6. 将 Arduino 开发板连接到 USB 端口并启动 Smilie-O-Mat\
  \ 示例。每个可变电阻控制一个面部参数。\n\n- 7. 现在我们将为按钮添加支持，因此请将以下代码添加到 serialEvent() 方法中，以便它能响应我们从\
  \ Arduino 发送的点击消息：\n\n```\nvoid serialEvent( Serial p ) {\n  String in = p.readStringUntil(\
  \ '\\n' );\n  if ( in != null ) {\n    if ( in.charAt(0) == 'A' ) {\n      eye =\
  \ int(in.substring(1,in.length()-2));\n    } else if ( in.charAt(0) == 'B' ) {\n\
  \      mouth = int(in.substring(1,in.length()-2));\n    } else if ( in.charAt(0)\
  \ == 'C' ) {\n      col = int(in.substring(1,in.length()-2));\n    } else if ( \"\
  click\".equals( in.trim() ) ) {\n      tweet();\n    }\n  }\n}\n```\n\n- 8. 如果我们现在运行代码，Arduino\
  \ 会不时快速连续发送两三条点击消息，因为当按钮闭合或断开时，会有一个短暂阶段，此时接触不良且在闭合和断开状态之间快速切换。这种行为称为 **bouncing**。为防止向\
  \ Twitter 发送多条消息，我们将在 Arduino 示例中实现一种名为 **debouncing** 的小应对措施。打开 Arduino 示例并添加以下两个变量：\n\
  \n```\nint a = 0;\nint lasta = a;\n\nint b = 0;\nint lastb = b;\n\nint c = 0;\n\
  int lastc = c;\n```\n\n```\nint button = LOW;\nint buttonLast = LOW;\n\nlong buttonTime\
  \ = 0;\nlong debounceDelay = 50;\n```\n\n- 9. 在我们的 loop() 方法中，我们将保存发送点击事件所用的时间，并且只有在经过一段时间后才检查按钮的状态。在我们的例子中，我们将\
  \ debounceDelay 变量设置为 50 毫秒：\n\n```\nvoid loop() {\n  a = analogRead(0);\n  if (abs(\
  \ a - lasta ) > 10 ) {\n    Serial.print(\"A\");\n    Serial.println( a );\n   \
  \ lasta = a;\n  }\n  b = analogRead(1);\n  if (abs( b - lastb ) > 10 ) {\n    Serial.print(\"\
  B\");\n    Serial.println( b );\n    lastb = b;\n  }\n  c = analogRead(2);\n  if\
  \ (abs( c - lastc ) > 10 ) {\n    Serial.print(\"C\");\n    Serial.println( c );\n\
  \    lastc = c;\n  }\n  if ( millis() > buttonTime + debounceDelay ) {\n    button\
  \ = digitalRead( 2 );\n    if ( buttonLast == HIGH && button == LOW ) {\n      Serial.println(\"\
  click\");\n    }\n    buttonLast = button;\n    buttonTime = millis();\n  }\n}\n\
  ```\n\n- 10. 编译并上传 Arduino 代码，然后切换回我们的 Processing 示例。\n\n- 11. 现在启动 Smilie-O-Mat\
