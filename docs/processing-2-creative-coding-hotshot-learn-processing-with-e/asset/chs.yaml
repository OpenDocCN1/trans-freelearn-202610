  uniform sampler2D texture;\nuniform vec2 texOffset;\n\nvarying vec4 vertColor;\n\
  varying vec4 vertTexCoord;\n\nvoid main(void) {\nvec2 tc0 = vertTexCoord.st + vec2(-texOffset.s,\
  \ -texOffset.t);\nvec2 tc1 = vertTexCoord.st + vec2( 0.0, -texOffset.t);\nvec2 tc2\
  \ = vertTexCoord.st + vec2(+texOffset.s, -texOffset.t);\nvec2 tc3 = vertTexCoord.st\
  \ + vec2(-texOffset.s, 0.0 );\nvec2 tc4 = vertTexCoord.st + vec2( 0.0, 0.0 );\n\
  vec2 tc5 = vertTexCoord.st + vec2(+texOffset.s, 0.0 );\nvec2 tc6 = vertTexCoord.st\
  \ + vec2(-texOffset.s, +texOffset.t);\nvec2 tc7 = vertTexCoord.st + vec2( 0.0, +texOffset.t);\n\
  vec2 tc8 = vertTexCoord.st + vec2(+texOffset.s, +texOffset.t);\n// get the color\
  \ values from the image for each coordinate\nvec4 col0 = texture2D(texture, tc0);\n\
  vec4 col1 = texture2D(texture, tc1);\nvec4 col2 = texture2D(texture, tc2);\nvec4\
  \ col3 = texture2D(texture, tc3);\nvec4 col4 = texture2D(texture, tc4);\nvec4 col5\
  \ = texture2D(texture, tc5);\nvec4 col6 = texture2D(texture, tc6);\nvec4 col7 =\
  \ texture2D(texture, tc7);\nvec4 col8 = texture2D(texture, tc8);\n\nvec4 sum = 8.0\
  \ * col4 - (col0 + col1 + col2 + col3 + col5 + col6\n+ col7 + col8);\nfloat f =\
  \ sum.r + sum.g + sum.b;\ngl_FragColor = vec4(f,f,f,1.0)*col4;\n}\n```\n\n- 6. 我们需要将刚刚创建的\
  \ edge.glsl 文件添加到我们的草图中，方法是将文件拖动到草图窗口，或者转到 草图 | 添加文件....\n\n- 7. 要将我们刚刚创建的着色器用作滤镜，我们需要在地球仪绘制完成后在\
