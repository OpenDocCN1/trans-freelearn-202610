  \n## 目标完成 - 小结简报\n\n我们当前任务的第一项是读取 Web 服务器的日志文件，并提取每条日志条目的 IP 地址和时间戳。我们创建了一个存储日志行信息的类。然后我们使用\
  \ `loadStrings()` 方法将日志文件读入字符串数组。在第 6 步中，我们使用了一个正则表达式，匹配并提取我们感兴趣的日志文件部分，并将其作为字符串返回。\n\
  \n日期作为字符串的表示方式数不胜数，因为世界各地似乎都急需使用一种非常特殊的格式。为了让我们的草图更容易处理时间戳，我们将它们转换为 Unix 时间戳格式，该格式存储自\
  \ 1970-01-01 以来经过的秒数。\n\n在我们的 `draw()` 方法中，我们提取日志文件中的时间戳并在时间轴上对其进行可视化。\n\n## IP\
  \ 地址地理编码\n\n到目前为止，我们一直专注于日志文件的时间戳，因此我们任务的这一部分是将 IP 地址转换为可用于地理可视化的一对坐标。我们将下载并安装 hostIP\
  \ 数据库——一个免费数据库，存储 IP 地址来源的地理坐标和城市名称。hostIP 数据库由志愿者创建，因此在那里时，请添加您自己的 IP 地址和城市以改进服务。我们从该数据库获得的准确性是城市级别，因此您不应根据获得的地理坐标设计披萨配送服务，但它对于大多数可视化项目来说已足够。\n\
  \n我们将在内存中保留 hostIP 数据库，用于地理编码我们的 IP 地址并转换在前面任务中提取的 IP 地址。\n\n## 启动推进器\n\n让我们开始转换地址：\n\
  \n- 1. 要转换 IP 地址，我们首先需要 hostIP 数据库。因此，打开浏览器并访问 `http://www.hostip.info/`。点击 **数据**\
  \ ，然后在 **数据库每日更新？** 部分中选择一个 HTTP 镜像。\n\n- 2. 从 csv 文件夹下载 hip_ip4_city_lat_lng.csv\
  \ 文件。\n\n- 3. 现在，打开我们为前面任务创建的草图，并通过将文件拖动到草图窗口或使用 草图 | 添加文件... 菜单来添加该文件。\n\n- 4.\
  \ 创建一个新标签页并将其命名为 IPdb。我们添加一个新类来存储 IP 地址块及其纬度/经度对。\n\n```java\npublic class IPdb\
  \ {\n    long ipblock;\n    String lat;\n    String lon;\n\n    public IPdb(long\
  \ ipblock, String lat, String lon) {\n        this.ipblock = ipblock;\n        this.lat\
  \ = lat;\n        this.lon = lon;\n    }\n}\n```\n\n- 5. 要加载数据库，我们创建一个新方法来解析 .csv\
  \ 文件并将记录存储在我们的 IPdb 类中。我们创建一个以 IP 块为索引的 HashMap 数据结构，以便在地理编码日志文件行时可以更快地访问它。HashMap\
  \ 是一个 Java 数据结构，它将唯一键映射到不同的对象，并允许我们使用键检索存储的对象。\n\n```java\nHashMap<Long, IPdb> parseIpDatabase(String\
  \ filename) {\n    String[] raw = loadStrings(filename);\n\n    HashMap<Long, IPdb>\
  \ map = new HashMap<Long, IPdb>(raw.length);\n    for (int i = 0; i < raw.length;\
  \ i++) {\n        String[] parts = raw[i].split(\",\");\n        int ipblock = int(parts[0]);\n\
  \        map.put(new Long(ipblock), new IPdb(ipblock, parts[2], parts[3]));\n  \
  \  }\n    return map;\n}\n```\n\n- 6. 在 setup() 方法中，我们添加对 parseIpDatabase() 方法和用于数据库的\
  \ HashMap 的调用。\n\n```java\nimport java.text.SimpleDateFormat;\n\nLogRow[] data;\n\
  HashMap<Long, IPdb> ipdatabase;\n\nvoid setup() {\n```\n\n\n\n\n\nsize(700,350);\n\
  \nipdatabase = parseIPDatabase( \"hip_ip4_city_lat_lng.csv\" );\nString[] log =\
  \ loadStrings( \"access.log\" );\ndata = parseLogfile( log );\n}\n\n- 7. 现在，我们可以通过搜索表来查找任何给定\
  \ IP 地址的地理坐标，但首先我们需要扩展 LogRow 类来存储坐标。切换到我们草图的 LogRow 选项卡并添加以下属性：\n\n```\nclass LogRow\
  \ {\nString ip;\nlong timestamp;\nString lat;\nString lon;\n\npublic LogRow( String\
  \ ip, long timestamp ) {\nthis.ip = ip;\nthis.timestamp = timestamp;\n}\n\nvoid\
  \ setLatLon( String lat, String lon ) {\nthis.lat = lat;\nthis.lon = lon;\n}\n}\n\
  ```\n\n- 8. 现在，回到主草图，我们添加另一个名为 geoCode() 的方法，它将记录数组作为参数。\n\n```\nvoid geoCode( LogRow[]\
  \ data ) {\n}\n```\n\n- 9. 在我们的方法中，我们遍历所有行并尝试查找 IP 地址的地理坐标。如果无法找到纬度和经度，我们将它们设置为\
  \ null。数据库不使用实际 IP 地址作为键，而是使用 IP 块的数字表示。要将 IP 地址转换为这个搜索键，我们需要通过在点号处拆分 IP 地址并将数字乘以\
  \ 256 的幂来将其转换为数值。\n\n```\nvoid geoCode( LogRow[] data ) {\nfor ( int i=0; i < data.length;\
  \ i++ ) {\nString[] block = data[i].ip.split( \"\\\\.\" );\nint ip = int( block[0]\
  \ ) * 256 * 256 * 256 + int( block[1] ) * 256 * 256 + int( block[2] ) * 256;\nIPdb\
  \ r = ipdatabase.get(ip);\nif ( r != null ) {\ndata[i].setLatLon( r.lat, r.lon );\n\
  }\n}\n}\n```\n\n- 10. 我们的草图在 setup() 方法中解析日志文件并对 IP 地址进行地理编码，根据日志文件的大小，这可能需要一段时间。为了告知用户启动为什么异常缓慢，我们现在将解析移到后台线程中运行。\n\
  \n```\nvoid setup() {\nsize(700,350);\n\nThread t = new Thread() {\npublic void\
  \ run() {\nipdatabase = parseIPDatabase( \"hip_ipv4_city_lat_lng.csv\" );\nString[]\
  \ log = loadStrings( \"access.log\" );\ndata = parseLogfile( log );\ngeoCode( data\
  \ );\n}\n};\n\nt.start();\n}\n```\n\n- 11. 现在，setup() 方法会立即返回，但在解析完成之前，draw() 方法中将没有可用的行。因此，我们需要修改\
  \ draw() 方法并为用户打印一条消息，以告知他们正在发生什么。\n\n```\nvoid draw() {\nbackground(0);\n\nif (\
  \ data == null ) {\ntext( \"Loading ...\", 35, 190 );\n}\nelse {\nnoStroke();\n\
  fill(255);\nrect(0, 150, 700, 50);\nstroke(0, 10);\nlong mints = data[0].timestamp;\n\
  long maxts = data[ data.length-1].timestamp;\n\nfor ( int i=0; i<data.length; i++)\
  \ {\nfloat pos = map( data[i].timestamp, mints, maxts, 0, 700 );\nline( pos, 150,\
  \ pos, 200 );\n}\n}\n}\n```\n\n- 12. 这好多了，但用户仍然不知道解析过程需要多长时间，因此让我们添加一个进度条，指示解析或地理编码已经完成了多少。我们需要添加两个变量来保存总行数和已处理记录数。我们还添加一个状态变量，存储当前所处的解析阶段。\n\
  \n```\nint LOADING = 0;\nint LOGFILE = 1;\nint GEOCODING = 2;\nint DONE = 3;\n\n\
  int state = LOADING;\n\nint count = 0;\nint total = 0;\n\nHashMap<Long, IPdb> ipdatabase;\n\
  LogRow data[];\n\nvoid setup() {\n    size(700, 350);\n\n    Thread t = new Thread()\
  \ {\n        public void run() {\n            state = LOADING;\n            ipdatabase\
  \ = parseIpDatabase( \"hip_ip4_city_lat_lng.csv\" );\n            state = LOGFILE;\n\
  \            String[] log = loadStrings( \"access.log\" );\n            data = parseLogfile(\
  \ log );\n            state = GEOCODING;\n            geoCode( data );\n       \
  \     state = DONE;\n        }\n    };\n    t.start();\n}\n```\n\n- 13. 在我们的 parseIpDatabase()\
  \ 方法中，我们将 total 变量设置为数据库中的行数，并在 for 循环中更新 count 变量。\n\n```\nHashMap<Long, IPdb>\
