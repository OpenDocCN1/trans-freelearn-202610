  \ 350);\n    String[] log = loadStrings(\"access.log\");\n    data = parseLogfile(log);\n\
  }\n```\n\n9. 目前，我们提取的时间戳是字符串，这使得它们在草图中难以使用。因此，让我们使用 SimpleDateFormat() 类来解析日期，以改变这一情况。这个\
  \ Java 类允许我们将其转换为 Unix 时间戳——即自 1970-01-01 午夜以来的秒数。我们需要在草图开头添加 import 语句才能使用 SimpleDateFormat\
