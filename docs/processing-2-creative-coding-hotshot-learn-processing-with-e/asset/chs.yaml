  \n```\nvoid setupGUI() {\n    cp5 = new ControlP5(this);\n    toggleButton = cp5.addButton(\"\
  toggleBox\", 1, 0, 0, 100, 20);\n    toggleButton.setLabel(\"Hide Menu\");\n\n \
