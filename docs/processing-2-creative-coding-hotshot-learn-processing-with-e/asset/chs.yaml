  \n## 目标完成 - 小结\n\n在此任务中，我们创建了三个基于时间的可视化器和两个对声音有反应的可视化器，用于控制我们舞池的 8 x 8 瓷砖图案。我们创建了两个定时器线程，一个每隔\
  \ 125 毫秒调用一次我们可视化器的 `tick()` 方法，另一个用于更改活动的可视化器。\n\n我们创建的基于时间的可视化器由 `tick()` 方法驱动，我们在其中更新瓷砖图案。这些可视化器被添加到可用可视化器的数组中，我们的第二个线程会从中随机选择一个新的可视化器。\n\
  \n`BeatVisualizer` 和 `FFTVisualizer` 类根本不使用 `tick()` 方法。它们在 `samples` 方法中更改可视化图案。我们将这两个可视化器注册为\
  \ `AudioPlayer` 对象的监听器，播放器每次加载新缓冲区时都会调用 `samples()` 方法。\n\n我们在可视化器中创建的瓷砖图案由我们的 `draw()`\
  \ 方法使用。我们还为瓷砖实现了一个小小的余晖效果，即在瓷砖点亮后，每一帧都降低颜色强度，而不是简单地将其关闭。\n\n## 制作你的迪斯科舞池\n\n在此任务中，我们将使用上一个任务中生成的草图，并将其转换为\
