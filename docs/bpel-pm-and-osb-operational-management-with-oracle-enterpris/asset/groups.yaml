  md: "\n## Summary\n\nConfiguration management is critical for administrators to\
    \ control change within the environment and troubleshoot problems associated with\
    \ changing configurations. With Grid Control's configuration management capabilities,\
    \ administrators can manage change and reduce time to troubleshoot problems.\n\
    \nIn this chapter, we discussed the challenges related to configurations in the\
    \ enterprise. We discussed how to view the latest configuration for WebLogic managed\
    \ server and OSB targets. Then we saved a snapshot of a known, trustworthy configuration\
    \ in the Grid Control repository, so we could use that as a baseline for comparison.\
    \ Then we compared the saved baseline with the latest configuration and viewed\
    \ the drift. We discussed how the Grid Control configuration features could be\
    \ leveraged for the WebLogic managed server and the OSB target.\n\nConfiguration\
    \ management has been extended with Enterprise Manager's acquisition of two new\
    \ products, namely **Configuration Change Console (CCC)** and **Application Change\
    \ Console (ACC)**. With these two products, administrators can view changes actively\
    \ as they happen, as well as roll back and roll forward to a desired configuration.\n\
