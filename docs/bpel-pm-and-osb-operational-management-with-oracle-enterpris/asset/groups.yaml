    +   1. From the Grid Control home page, click on the Targets | Web Applications
    tab.

    +   2. Click on the Add button to add a new web application, as seen in the next
    screenshot.


    > Web application is a special service in Grid Control. There are other service
    types such as generic service, aggregate service, and so on.


    ![](img/7529bbd615e859608c21b965162348b2_173_0.png)


    3. On the General step, as shown in the following screenshot:


    +   - Enter the web application name as SOA Order Booking Client.

    +   - Select Time Zone as Use System Time Zone.

    +   - Enter the Homepage URL as http://gcsoa.us.oracle.com:7777/soademo.'
  - '[PAGE 174]


    # Web Application Monitoring


    ![](img/7529bbd615e859608c21b965162348b2_174_0.png)


    +   - Click on **Select System**.

    +   - Select the radio button for **soa_infra_system** in the pop-up window.

    +   - Click on **Select**, as shown in the next screenshot:


    > A System is a collection of targets in Grid Control. A System has to be created
    from the Systems tab, before a web application (or other service) can be based
    on that System.


    ![](img/7529bbd615e859608c21b965162348b2_174_1.png)'
  - '[PAGE 175]


    +   - Review the key components for the System. You can uncheck certain components
    on which the SOA Order Booking Client does not depend.

    +   - Click on Next, as shown in the following screenshot:


    ![](img/7529bbd615e859608c21b965162348b2_175_0.png)


    4. On the Availability step:


    +   - Select to define availability based on Service Test.

    +   - Click on Next, as shown in the next screenshot:


    > Availability can be defined based on Service Test or System. Further, availability
    can be defined based on up/down status as well as usage metrics. Service Test-based
    availability can be defined as the status of one or more recorded web transactions
    as tested by one or more agents (Beacons). System-based availability is determined
    on the status of the underlying system components—either all or one component
    can be up based on the requirement.'
