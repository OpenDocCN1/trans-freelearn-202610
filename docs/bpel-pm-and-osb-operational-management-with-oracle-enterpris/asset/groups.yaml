    # 5


    # BPEL Service-Level Management


    Service providers are faced with increasingly demanding consumers who want services
    that are faster, more available, and perform better. An increasing number of key
    business services such as e-mail, storage, servers, and databases are used as
    services, so that consumers do not have to worry about owning and maintaining
    the software and hardware. Consumers expect high availability and performance
    regardless of intranet or Internet services. A service downtime could prove detrimental
    through loss in revenues for the service provider and consumer, and a loss in
    credibility for both. Further, several service providers have to comply with IT
    frameworks such as **Information Technology Infrastructure Library (ITIL)**, **Control
    Objectives for Information and Related Technology (COBIT)**, and **Statement on
    Auditing Standards 70 (SAS 70)**. These frameworks demand that IT measure service
    availability and performance for auditing, contractual obligations, and customer
    satisfaction.


    In an environment where services not only abound, but also interact with each
    other, it becomes a nightmare to govern service availability and quality. A BPEL
    environment involves several services that are being orchestrated. All the participating
    services need to be governed within the contractual terms of use. This is extremely
    important in business to business (or partner) contracts as well as business to
    consumer contracts. Most service providers have money-back guarantees in contracts
    that can be invoked by consumers if the quality of service falls beneath mutually
    agreed availability and performance expectations.'
  - '[PAGE 68]


    Monitoring BPEL processes and partner links with a common set of service-level
    expectations is important for IT to monitor service expectations, and resolve
    problems to ensure service-level agreements are met. This chapter talks about
    managing the BPEL process and partner link expectations by setting and monitoring
    service levels. Specifically, this chapter talks about:


    +   - Challenges

    +   - Solution

    +   - Step-by-step exercises:

    +     - Viewing the BPEL process availability service

    +     - Adding service performance metrics

    +     - Setting service-level expectation (availability)

    +     - Viewing the service availability definition

    +     - Viewing the BPEL infrastructure service

    +     - Adding infrastructure performance metrics

    +     - Adding infrastructure usage metrics

    +     - Setting service-level expectation (infrastructure)

    +     - Viewing the infrastructure availability definition

    +     - Viewing the BPEL process aggregate service

    +     - Viewing the aggregate service availability definition

    +     - Adding aggregate service performance and usage metrics

    +     - Setting service-level expectation (aggregate service)


    # Challenges


    In an increasingly service-oriented environment, service and system availability
    and response times have a direct and tangible impact on the provider''s and consumer''s
    bottom line. BPEL business processes, online banking, online store, and online
    stock trading are all examples of business applications that need to be monitored
    and available to partners and end-users. Typically, when any of these services
    are being used, some common problems faced by the administrators are:


    +   - Guaranteeing availability of a service

    +   - Performance of the service and whether it meets the expectations of the
    end users


    Poor application and infrastructure performance can result in costs to your business,
    which may include the loss of customer loyalty and sales opportunities.'
  - '[PAGE 69]


    # Solution


    Grid Control solves these issues by automatically defining one or more service
    models that represent the business processes that run in an enterprise. Automated
    service models overlying business processes are created when one or more service
    tests (SOAP tests) for partner links are created. Using these service tests (that
    simulate end-user functionality), administrators can measure the performance and
    availability of critical partner links or external Web services, receive alerts
    when there is a problem, identify common issues, and diagnose causes of failures.
    Monitoring a service helps you ensure that the operational goals and service-level
    agreements are met.


    # Step-by-step exercises


    This set of step-by-step exercises will walkthrough setting service levels for
    the BPEL process, and setting up availability and performance metrics to monitor
    the service levels for the BPEL process and associated availability, infrastructure,
    and aggregate services. Some key service definitions are listed:


    +   - **Generic Service**: This is a Grid Control representation of any service
    that is provided to a consumer. There are special services for web applications.
    For Web services and BPEL processes, the Generic Service is used as a wrapper
    in order to inherit the Grid Control service capabilities.

    +   - **Availability Service**: This is the representation of a BPEL process in
    Grid Control to measure the operational availability and response time of the
    process. Further service level goals can be set and measured at the service level.

    +   - **System**: This is a group of related infrastructure components such as
    database, application server, JVM, BPEL PM, and so on.

    +   - **Infrastructure Service**: This models the system into a service representation
    so that service level goals can be set and measured for the overall system.

    +   - **Aggregate Service**: This is a higher-level service that consists of one
    or more Generic Services.

    +   - **Service-Level Agreement (SLA)**: This is the contractual agreement between
    a provider and a consumer. Typically, it consists of an availability (for example,
    99.99% service uptime per quarter) and performance (for example, Login page should
    return under three seconds) metrics. Frequently, there are money-back guarantees
    in the SLA contracts, which can be invoked by the consumer when faced with poor
    service availability and performance.'
  - '[PAGE 70]


    +   - **Service Test:** A Grid Control service can be tested for availability
    and performance using synthetic checks that emulate end users. As the SLAs are
    typically measured from a end-user perspective, service tests are extremely useful
    and used extensively for SLAs.


    # Viewing the BPEL process availability service


    Grid Control creates an internal service representation of a BPEL process automatically.
    This is useful because normal Grid Control service functionality can be applied.
    The first step is to navigate to the BPEL process availability service:


    +   1. From the BPEL target page, click on the **BPEL Processes** tab.

    +   2. Click on the BPEL process name `<process_name>` under the default domain,
    that is, **SOAOrderBooking(v1.0)**.


    > The Aggregate Service, Availability Service, Generic Service, and the Infrastructure
    Service may already have been created. If not, please follow the steps in prior
    chapters to create these services.


    ![](img/7529bbd615e859608c21b965162348b2_70_0.png)'
  - '[PAGE 71]


    3. Click on the `<process_name_availability>` service name—**SOAOrderBooking(v1.0)_availability**.


    > This is the service home page. Notice the **Availability (%)** for the past
    24 hours, the **Actual Service Level (%)**, and the **Expected Service Level (%)**
    for this service. Notice the **Key Test Summary** details for this service. The
    SOAP tests that were instrumented in a prior chapter show up here.


    ![](img/7529bbd615e859608c21b965162348b2_71_0.png)


    # Adding service performance metrics


    A Grid Control service can not only be measured on availability but also on performance.
    Performance metrics such as response time are useful to measure and alert on (based
    on thresholds), so the operational staff gets alerted before consumers complain.


    +   1. On the service home page, click on **Monitoring Configuration** tab.

    +   2. Click on the **Performance Metrics** link.

    +   3. Add a performance metric **based on service test**, and click on **Go**.'
