    # Comparing the current OSB configuration with a saved baseline


    Once the OSB configuration snapshot has been saved in Grid Control, this can be
    used as a standard for comparing with other OSB targets. Often, it is useful to
    compare the static trustworthy snapshot with the latest configuration, in order
    to see the drift from the known, trustworthy state.


