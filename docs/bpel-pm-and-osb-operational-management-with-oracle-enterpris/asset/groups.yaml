  - '[PAGE 106]


    # Summary


    Deployment is a critical task for operational administrators. With the Grid Control
    Software Library and deployment procedure capabilities, administrators can manage
    BPEL suitcases, and schedule and automate deployment.


    In this chapter, we discussed how to utilize the out-of-the-box deployment functionality
    with Grid Control. The administrator can view the deployment procedures, pick
    the right one, schedule the deploy, and observe the deploy taking place. This
    is a powerful automation framework that can be utilized for deploying repeatedly
    and on multiple environments at the same time. There are other variations of these
    deployments that might be useful, such as running a custom script after the end
    of the deployment.


    With Grid Control release 10gR5, the deployment plan (introduced with BPEL 10.1.3.4)
    methodology is also supported. In other words, a deployment plan file with details
    of partner links for test, stage, and production environments can be uploaded
    to the Software Library. This file can be used while scheduling deployment and
    the partner link changes will automatically be done. It is also common for customers
    to create a copy of the out-of-box deployment procedure, and add a few custom
    steps with home-grown scripts that need to be executed before or after deployment.


    The next few chapters will walkthrough hands-on exercises to manage configurations
    for the BPEL environment.'
  - '[PAGE 107]


    # 8

    BPEL Configuration Management


    Managing the configurations of software and hardware assets in an enterprise is
    important for several reasons. "Knowing what you have" enables IT managers to
    make decisions about future investments and retiring old assets, standardize existing
    assets, manage change across the enterprise, and troubleshoot performance problems
    related to configurations.


    Most configuration management solutions today are compliant with the best practices
    laid out by the **IT Information Library (ITIL)** framework. All the assets are
    stored in a central repository called the **Configuration Management Database
    (CMDB)**. Configuration parameters such as `init.ora` parameters for a database,
    or `startup` parameters for a WebLogic application server, or port numbers for
    an HTTP server are stored in the CMDB. Any changes to these parameters are also
    tracked. It then becomes easy to audit the changes for a specific asset, compare
    assets to each other (for example database1 and database2), compare different
    versions of the same asset, save a reference configuration to the CMDB, and use
    that to standardize across the enterprise. This chapter talks about managing configurations
    for a BPEL environment. Specifically this chapter talks about:


    +   - Challenges

    +   - Solution

    +   - Step-by-step exercises:

    +     - Navigating to BPEL target configuration management:

    +       - Viewing the last collected configuration

    +       - Saving a configuration snapshot to the repository'
  - '[PAGE 108]


    +   - Navigating to Oracle Application Server configuration management:

    +     - Viewing the last collected configuration

    +     - Saving a configuration snapshot to the repository

    +   - Making changes to the BPEL environment

    +   - Making changes to the Oracle Application Server environment

    +   - Comparing the current BPEL configuration with a saved baseline

    +   - Comparing BPEL process versions for the same process

    +   - Comparing the current Oracle Application Server configuration with a saved
    baseline

    +   - Viewing application server target comparison results with a saved baseline


    # Challenges


    It is difficult to track the configurations of all IT systems. Frequently, IT
    departments resort to Excel spreadsheets to store critical IT system information.
    This makes an IT department slow in making changes, measuring impact, and identifying
    performance problems due to incorrect configuration, and increases the costs of
    managing a data center. With a BPEL environment, it is difficult to baseline a
    working configuration and compare it with non-working ones. There is no good way
    to compare successive BPEL Process versions before rolling them out into production.


    # Solution


    With Grid Control, key configuration metrics for BPEL PM server and processes
    are collected and stored in the Grid Control configuration management database.
    This is the same database repository that houses the monitoring information. Administrators
    can view the historic configuration changes across the BPEL environment. They
    can also baseline a working configuration by saving it in the repository. A BPEL
    PM server and domain''s configuration parameters can be compared with other server
    and domains. Finally, BPEL Process versions can also be compared to observe the
    changes across successive deployments.'
