    \ Control 框架可通过插件或连接器进行扩展。这得益于随 Grid Control 一起提供的软件开发工具包。一个插件的良好示例是，如果您想监控 Grid\
    \ Control 不支持的特定硬件组件，您可以扩展框架并添加逻辑来监控您的特定硬件组件。另一方面，连接器可用于将 Grid Control 与其他系统集成，例如事件管理系统（如\
    \ Remedy Helpdesk 或 Oracle 业务活动监控（Oracle BAM））。\n\n本书的大多数章节涵盖 Grid Control 的多个版本。例如服务级别管理、基础设施管理、服务级别仪表板、Web\
    \ 应用程序管理和配置管理等概念在多个 Grid Control 版本中保持一致。尽管如此，本书将重点关注 Grid Control 版本 10.2.0.5，也称为\
    \ 10gR5。该版本于 2009 年 2 月在 Linux 平台上发布，并在当年余下时间移植到其他平台。大多数章节同样适用于之前的 Grid Control\
    \ 10.2.0.4（或 10gR4）版本。显著的例外是处理 Oracle Service Bus 管理的第三部分。用于管理 BPEL Process Manager\
    \ 的 Enterprise Manager 功能是 Grid Control 10.2.0.3 及以上版本的一部分。Oracle Service Bus\
    \ 管理功能是在 Grid Control 10.2.0.5 中引入的。\n\n### 架构和部署\n\nGrid Control 采用三层架构。主要组件包括\
    \ Oracle 管理服务器（OMS）、管理代理（Agent）和 Oracle 管理存储库（OMR）。中央基于 Web 的控制台可通过流行浏览器访问。组件详细说明如下：\n\
    \n- **Oracle Management Server (OMS):** 这是中央引擎，汇总来自所有分布式管理代理的信息。它为基于 Web 的控制台提供数据，并将数据持久化到管理存储库中。此外，OMS\
    \ 还执行告警规则逻辑和通知逻辑，以及向代理发送用于部署等管理任务的指令。\n- **Management Agent:** 代理是在服务器或主机上运行的轻量级\
    \ C 程序。该程序通常收集主机以及该主机上的其他目标（如数据库、应用服务器、SOA 套件等）的所有监控和配置信息。代理还适用于通过脚本在主机级别运行操作。此功能对于采取纠正措施（当阈值被违反时）或执行复杂的修补或其他部署任务非常有用。还可以选择使用远程代理，唯一的缺点是不会收集主机指标。\n\
    - **Oracle Management Repository (OMR):** 存储库是随 Grid Control 打包的预配置 Oracle 数据库。OMR\
    \ 不需要单独的许可证。OMS 包含来自各个代理的当前和历史监控及配置信息。它带有预建的模式以及用于在不同时间段聚合数据的 PL/SQL 过程和函数。\n\
    - **Central web console:** Web 控制台为 OMR 中的所有丰富信息提供窗口。每个目标类型（例如，应用服务器）都有一个主页，其中包含监控、告警、配置和其他特定信息。主页在多个目标之间显示汇总信息。报表和仪表板可用于创建自定义视图。\n\
    \n本书避免深入讨论产品文档或白皮书已涵盖的部署问题。假设读者具备安装和配置 Grid Control 组件的基础知识。有关架构和部署最佳实践的更多信息可在\
    \ Oracle 技术网络（OTN）上的 Enterprise Manager 页面找到，网址为：http://www.oracle.com/technology/products/oem/ent_mgr/arch_dep.html\n\
    \n下面的简单架构图显示了 Grid Control 主要组件及其关系：\n\n![](img/7529bbd615e859608c21b965162348b2_24_0.png)\n"
