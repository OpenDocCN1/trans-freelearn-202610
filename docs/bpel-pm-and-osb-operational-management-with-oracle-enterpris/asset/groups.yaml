  - '[PAGE 141]


    # Add Oracle Application Server Cluster


    In order to add an Oracle Application Server Cluster to Grid Control for monitoring
    and central management, you must specify the name of an Oracle Application Server
    (version 10.1.3 or higher) instance that is a member of the Oracle Application
    Server Cluster to be added.


    Oracle Application Server Cluster Name Cluster 10.1.3.1

    Application Server Name soa.gcsoa.us.oracle.com

    OPMN Request Port 6003

    Application Server Control URL http://gcsoa.us.oracle.com:7777/em


    TIP The application server instance name and its OPMN request port are used to
    contact the application server, and query its Oracle Application Server Cluster
    membership. Based on the application server instance selected, Enterprise Manager
    specifies the default value for the OPMN request port. If the port value specified
    by Enterprise Manager is incorrect, then review the application server''s opmn.xml
    file (i.e. $ORACLE_HOME/opmn/conf/opmn.xml) to obtain the correct value.


    7. A confirmation message appears at the top of the screen to confirm that the
    cluster was successfully added to Enterprise Manager, and Cluster 10.1.3.1 appears
    as a new target in the table with the soa.gcsoa.us.oracle.com application server
    shown as a member of that cluster, as shown in the following screenshot:


    # Confirmation


    The Oracle Application Server Cluster Cluster 10.1.3.1 has been successfully added
