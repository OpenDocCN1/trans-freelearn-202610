    \ is to manage several disparate application, middleware, and database targets\
    \ from a single console. The traditional hardware and software components such\
    \ as servers, storage devices, operating systems, databases, middleware, and applications\
    \ have been managed by system management solutions. With the rise of integration\
    \ software such as BPEL and OSB, applications and infrastructure pose new problems.\
    \ First, they need to be managed along with existing hardware and software. Second,\
    \ as the WebLogic domains and OSB projects proliferate across the enterprise,\
    \ the infrastructure team is faced with increasing problems to manage these projects.\
    \ Thirdly, for the administrators who are new to OSB, supporting these environments\
    \ in production poses unknown challenges. Finally, the IT managers want to avoid\
    \ hiring new administrators with increasing OSB projects.\n\n### Solution\n\n\
    Grid Control provides a way to discover WebLogic and OSB components whether it\
    \ is in development, test, stage, or production. For the infrastructure team,\
    \ this is a convenient way to manage several installations from one console. The\
    \ prerequisite is to have the Grid Control agent installed on the server hosting\
    \ WebLogic admin server. Once the Grid Control agent is installed, the discovery\
    \ process can be initiated from the console.\n\n### Step-by-step exercises\n\n\
    This set of step-by-step exercises will walkthrough discovering a WebLogic and\
    \ OSB target.\n\n### Adding a WebLogic domain target\n\nThe first step in managing\
    \ a WebLogic and OSB environment is to discover the WebLogic target – admin, clusters,\
    \ and managed servers:\n\n- 1. From the Grid Control home page, click on **Targets**\
    \ | **Middleware**.\n- 2. Click on the **Provisioning** sub-tab.\n\n> This is\
    \ a view showing all of the monitored Middleware components in the enterprise.\
    \ Grid Control can discover and manage several types of Application Servers such\
    \ as Oracle Application Server, WebLogic, WebSphere, and JBoss. There are one\
    \ or more target types and one or more targets for each piece of middleware that\
    \ is discovered and managed. For each target, a summary of status with details,\
    \ alerts, policy violations, CPU usage, and memory usage on the host are tabulated.\n\
    \n3. From the dropdown on the right, add an Oracle WebLogic Server Domain target.\
    \ Click on Go, as shown in the following screenshot:\n\n![](img/7529bbd615e859608c21b965162348b2_197_0.png)\n\
    \n4. On the Host step, fill in the fields as shown in the next screenshot:\n\n\
    - Pick the Administration Server Host from the flashlight.\n- Version as 10.x\
    \ (WebLogic Server version 7.x and above are supported).\n- Port as 7021 (this\
    \ is the default admin port).\n- Administration Server Username as weblogic.\n\
    - Password as `<Your WebLogic admin password>`\n- Check the Save as Preferred\
    \ Credentials box.\n- Administration Server Home Directory as `/u01/homes/osb_wls/wlserver_10.3/server/lib`.\n\
    - Leave the other fields blank.\n- Click on Next.\n\n### Discovery of WebLogic\
    \ and OSB targets\n\n![](img/7529bbd615e859608c21b965162348b2_198_0.png)\n\n5.\
    \ On the Host Credentials step:\n\n- Host Username as oracle.\n- Password as <Your\
    \ WebLogic admin password>.\n- Check the Save as Preferred Credentials box.\n\
    - Click on Next.\n\n6. On the Select Managed Servers step:\n\n- Check the domain\
    \ that has been discovered with the Admin/Managed Server and Oracle Service Bus\
    \ target.\n- Click on Next, as shown in the next screenshot:\n\n![](img/7529bbd615e859608c21b965162348b2_198_1.png)\n\
    \n- On the Review step, click on Finish.\n- On the Middleware page, observe the\
    \ confirmation message. Look at the newly discovered WebLogic domain, Managed\
    \ Server, and OSB target.\n\n![](img/7529bbd615e859608c21b965162348b2_199_0.png)\n\
    \n### Navigating to the OSB target home page\n\nOnce the WebLogic and OSB components\
    \ are discovered, it is useful to visit the OSB target home page and observe useful\
    \ monitoring-related information.\n\n- Click on the **Oracle Service Bus target\
    \ name** hyperlink.\n\n> On the Oracle Service Bus target home page you will see\
    \ the availability status of the OSB server, Availability % (last 24 hours), Oracle\
    \ WebLogic Server Domain, Version, and Host.\n\n![](img/7529bbd615e859608c21b965162348b2_199_1.png)\n\
    \n### Summary\n\nDiscovery is the first step to managing a target in the enterprise.\
    \ Discovering and managing multiple targets from a single console is a powerful\
    \ way to ramp up on new projects, while maintaining a standardized management\
    \ platform. This avoids hiring new administrators for new projects that increase\
    \ the number of managed targets.\n\nIn this chapter, we looked at how to discover\
    \ WebLogic Server and OSB targets. In particular, we discussed the mandatory discovery\
    \ process to locate and identify the WebLogic and OSB components. There are several\
    \ challenges associated with managing multiple components in the data center.\
    \ Grid Control provides a single interface to discover and manage these disparate\
    \ components. In the exercises, we walked through simple steps to discover WebLogic\
    \ and OSB components. Finally, we viewed the key monitoring areas on the OSB target\
    \ home page.\n\nThe WebLogic server discovery is mandatory, and OSB is discovered\
    \ automatically as a result. These are mandatory steps to enable subsequent management\
    \ tasks on WebLogic or OSB. The next few chapters will walkthrough hands-on exercises\
    \ to set up and perform additional management tasks for the discovered targets.\n\
    \n## 12\n### OSB Deployment Automation\n\nIn most medium to large enterprises,\
    \ integration developers have to deal with managing multiple initiatives spread\
    \ over multiple departments. In the WebLogic and Oracle Service Bus (OSB) world,\
    \ this translates to multiple WebLogic/OSB projects in multiple WebLogic domains.\
    \ Typically, the integration developers are tasked with project development and\
    \ testing while the WebLogic administrators are responsible for the deployment\
    \ and operational support. This handoff is not entirely smooth due to different\
    \ tools and processes in the development and operational organizations.\n\nWebLogic\
    \ administrators have to deal with multiple OSB projects. Typically, the OSB project\
    \ deployment should follow the existing methodology in the enterprise. The operational\
    \ team should centrally maintain the deployment artifacts, and this should be\
    \ a different location than the one used by the development team. The deployment\
    \ itself should be a well-defined procedure with a series of repeatable steps.\
    \ Further, the set of best practices for the enterprise should be invoked at deployment\
    \ time. This chapter talks about deploying multiple OSB projects to an OSB environment\
    \ in a standardized manner. Specifically, this chapter talks about:\n\n- Challenges\n\
    - Solution\n- Step-by-step exercises:\n  - Viewing the Software Library\n  - Uploading\
    \ projects to the Software Library\n  - Viewing the project deployment procedure\n\
    \  - Scheduling project deployment\n"
  mdcn: "\n## 11\n### WebLogic 和 OSB 目标的发现\n\n在 10.2.0.5（或 10gR5）版本发布后，Grid Control\
    \ 引入了用于管理 **Oracle 服务总线（OSB）** 的新功能，**Oracle 服务总线（OSB）** 前身为 **AquaLogic 服务总线（ALSB）**。在\
    \ 10.2.0.5 之前，Grid Control 已支持异构应用服务器。具体来说，Grid Control 对 **WebLogic 服务器（WLS）**\
    \ 的监控功能可追溯至 7.x 版本。OSB 管理的引入补充了 WLS 管理功能，并在很大程度上增强了 Grid Control 的中间件管理能力。\n\n\
    在 10.2.0.5 版本中，Grid Control 提供了多个 OSB 管理功能，例如发现 OSB 组件、监控 OSB 代理和业务服务、监控扩展的 WebLogic\
    \ 和底层基础设施、部署自动化、配置管理和服务级别管理。\n\n本章讨论 WebLogic Server 和 OSB 实例的发现。发现 WebLogic 和\
    \ OSB 是执行其他管理任务之前的第一步。本章涵盖以下内容：\n\n- 挑战\n- 解决方案\n- 分步练习：\n  - 添加 WebLogic 域目标\n\
    \  - 导航到 OSB 目标主页\n\n### 挑战\n\n对于任何小型、中型或大型企业而言，挑战在于从单个控制台管理多个不同的应用、中间件和数据库目标。传统的硬件和软件组件，如服务器、存储设备、操作系统、数据库、中间件和应用程序，一直由系统管理解决方案进行管理。随着\
    \ BPEL 和 OSB 等集成软件的兴起，应用程序和基础设施带来了新的问题。首先，它们需要与现有硬件和软件一起管理。其次，随着 WebLogic 域和 OSB\
    \ 项目在企业中不断 proliferate，基础设施团队面临着管理这些项目日益增加的问题。第三，对于刚接触 OSB 的管理员来说，在生产环境中支持这些环境会带来未知挑战。最后，随着\
    \ OSB 项目的增加，IT 管理员希望避免聘用新的管理员。\n\n### 解决方案\n\nGrid Control 提供了一种在开发、测试、预生产或生产环境中发现\
    \ WebLogic 和 OSB 组件的方法。对于基础设施团队而言，这是一种从一个控制台管理多个安装的便捷方式。前提条件是在托管 WebLogic 管理服务器的服务器上安装\
    \ Grid Control 代理。一旦安装了 Grid Control 代理，即可从控制台启动发现过程。\n\n### 分步练习\n\n这组分步练习将指导如何发现\
    \ WebLogic 和 OSB 目标。\n\n### 添加 WebLogic 域目标\n\n管理 WebLogic 和 OSB 环境的第一步是发现 WebLogic\
    \ 目标——管理、集群和托管服务器：\n\n- 1. 从 Grid Control 主页，单击 **目标** | **中间件**。\n- 2. 单击 **配置**\
    \ 子选项卡。\n\n> 这是一个显示企业中所有受监控中间件组件的视图。Grid Control 可以发现和管理多种类型的应用服务器，例如 Oracle Application\
    \ Server、WebLogic、WebSphere 和 JBoss。每个被发现和管理的中间件都有一个或多个目标类型和一个或多个目标。对于每个目标，都会汇总状态摘要、详细信息、警报、策略违规、主机\
    \ CPU 使用率和内存使用率。\n\n3. 从右侧的下拉菜单中，添加一个 Oracle WebLogic Server 域目标。单击 Go，如以下屏幕截图所示：\n\
    \n![](img/7529bbd615e859608c21b965162348b2_197_0.png)\n\n4. 在主机步骤中，如下一屏幕截图所示填写字段：\n\
    \n- 从手电筒中选择管理服务器主机。\n- 版本为 10.x（支持 WebLogic Server 7.x 及以上版本）。\n- 端口为 7021（这是默认的管理端口）。\n\
    - 管理服务器用户名为 weblogic。\n- 密码为 `<Your WebLogic admin password>`\n- 选中“保存为首选凭据”复选框。\n\
    - 管理服务器主目录为 `/u01/homes/osb_wls/wlserver_10.3/server/lib`。\n- 将其他字段留空。\n- 单击下一步。\n\
    \n### WebLogic 和 OSB 目标的发现\n\n![](img/7529bbd615e859608c21b965162348b2_198_0.png)\n\
    \n5. 在主机凭据步骤中：\n\n- 主机用户名为 oracle。\n- 密码为 <Your WebLogic admin password>。\n- 选中“保存为首选凭据”复选框。\n\
    - 单击下一步。\n\n6. 在选择托管服务器步骤中：\n\n- 选中已发现的管理/托管服务器和 Oracle 服务总线目标的域。\n- 单击下一步，如下一屏幕截图所示：\n\
    \n![](img/7529bbd615e859608c21b965162348b2_198_1.png)\n\n- 在“审核”步骤中，单击“完成”。\n\
    - 在中间件页面上，观察确认消息。查看新发现的 WebLogic 域、托管服务器和 OSB 目标。\n\n![](img/7529bbd615e859608c21b965162348b2_199_0.png)\n\
    \n### 导航到 OSB 目标主页\n\n一旦发现 WebLogic 和 OSB 组件，有用的是访问 OSB 目标主页并观察有用的监控相关信息。\n\n\
    - 单击 **Oracle 服务总线目标名称** 超链接。\n\n> 在 Oracle 服务总线目标主页上，您将看到 OSB 服务器的可用性状态、可用性 %（过去\
    \ 24 小时）、Oracle WebLogic Server 域、版本和主机。\n\n![](img/7529bbd615e859608c21b965162348b2_199_1.png)\n\
    \n### 摘要\n\n发现是企业中管理目标的第一步。从单个控制台发现和管理多个目标是快速掌握新项目同时保持标准化管理平台的强大方式。这避免了为增加受管目标数量的新项目聘用新的管理员。\n\
    \n在本章中，我们研究了如何发现 WebLogic Server 和 OSB 目标。特别是，我们讨论了定位和识别 WebLogic 和 OSB 组件的强制性发现过程。数据中心中管理多个组件存在若干挑战。Grid\
    \ Control 提供单一界面来发现和管理这些不同的组件。在练习中，我们逐步介绍了发现 WebLogic 和 OSB 组件的简单步骤。最后，我们查看了 OSB\
    \ 目标主页上的关键监控区域。\n\nWebLogic 服务器发现是强制性的，其结果是 OSB 会自动被发现。这些是启用 WebLogic 或 OSB 上后续管理任务的强制性步骤。接下来的几章将指导动手练习，以设置并执行对已发现目标的额外管理任务。\n\
    \n## 12\n### OSB 部署自动化\n\n在大多数中大型企业中，集成开发人员必须处理跨多个部门的多个计划的管理。在 WebLogic 和 Oracle\
    \ 服务总线（OSB）领域，这转化为多个 WebLogic/OSB 项目分布在多个 WebLogic 域中。通常，集成开发人员负责项目开发和测试，而 WebLogic\
    \ 管理员负责部署和运营支持。由于开发和运营组织中不同的工具和流程，这种交接并不完全顺畅。\n\nWebLogic 管理员必须处理多个 OSB 项目。通常，OSB\
    \ 项目部署应遵循企业中现有的方法论。运营团队应集中维护部署工件，并且该位置应与开发团队使用的位置不同。部署本身应是一个定义良好的流程，具有一系列可重复的步骤。此外，企业最佳实践集应在部署时被调用。本章讨论以标准化方式将多个\
    \ OSB 项目部署到 OSB 环境。特别是，本章讨论：\n\n- 挑战\n- 解决方案\n- 分步练习：\n  - 查看软件库\n  - 将项目上传到软件库\n\
    \  - 查看项目部署流程\n  - 安排项目部署\n\n"
