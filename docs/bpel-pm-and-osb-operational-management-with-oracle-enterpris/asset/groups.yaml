    \n9. 在 Grid Control 中查看已部署的项目：\n- 导航到 OSB 目标主页。\n- 点击 **OSB 服务** 选项卡。\n- 点击右上角的\
    \ **刷新** 按钮。\n- 在列表中注意新部署的项目。\n\n![](img/7529bbd615e859608c21b965162348b2_213_0.png)\n\
    \n## 摘要\n\n部署是 WebLogic 管理员的一项关键任务。借助 Grid Control 软件库和部署流程功能，管理员可以管理 WebLogic\
    \ 和 OSB 项目，并安排和自动化部署。\n\n在本章中，我们介绍了处理应用程序代码部署（如 OSB 项目部署）的各种管理挑战。Grid Control\
    \ 为管理员自动化部署流程，从而节省时间并减少人为错误。首先我们查看了 Grid Control 软件库，然后将新的 OSB 项目上传到该库，然后启动了实际的部署流程。最后，我们查看了部署流程作业的执行情况，并通过\
    \ OSB 控制台验证了完成和成功部署。\n\n接下来的几章将介绍管理 OSB 中的其他领域，例如监控服务、管理配置和服务级别。\n\n## 13\n\n\
    ## OSB 代理和业务服务监控\n\nOracle Service Bus 是市场上领先的 **企业服务总线 (ESB)** 系统之一。它遵循典型的 ESB\
    \ 范式，即验证、丰富和转换（VET）。通常，OSB 作为一个或多个消费者业务关键服务的提供者。\n\n监控提供可见性以及衡量可用性和性能的手段，从而评估提供者和消费者之间的服务水平协议。本章介绍监控\
    \ OSB 代理和业务服务。具体来说，本章介绍：\n\n- 挑战\n- 解决方案\n- 分步练习：\n  - 创建 OSB 基础设施服务\n  - 导航到\
    \ OSB 代理服务主页\n  - 创建 OSB 代理聚合服务\n  - 创建 SOAP 测试以监控 OSB 代理服务端点\n  - 创建 SOAP 测试以监控\
    \ OSB 业务服务端点\n  - 测试 SOAP 测试\n\n### 挑战\n\n对于任何小型、中型或大型企业来说，从单个控制台监控多个不同的应用程序、中间件和数据库目标都是一个挑战。传统的硬件和软件组件，如服务器、存储设备、操作系统、数据库、中间件和应用程序，一直由系统管理解决方案进行监控。随着\
    \ BPEL 和 OSB 等集成软件的兴起，应用程序和基础设施带来了新的问题。首先，它们需要与现有硬件和软件一起进行监控。其次，随着 WebLogic 域和\
    \ OSB 项目在企业中不断扩展，基础设施团队面临着管理这些项目日益增加的问题。第三，对于刚接触 OSB 的管理员来说，在生产环境中支持这些环境带来了未知挑战。最后，IT\
    \ 管理员希望避免随着 OSB 项目的增加而聘用新的管理员。\n\n### 解决方案\n\nGrid Control 为 WebLogic 和 OSB 组件提供监控功能，无论是在开发、测试、预生产还是生产环境中。对于基础设施团队来说，这是一种从一个控制台监控多个安装的便捷方式。一旦在托管\
    \ WebLogic 管理服务器的服务器上安装了 Grid Control 代理，即可从控制台启动发现过程。发现后，基础设施组件和 OSB 服务可以从 Grid\
    \ Control 进行监控。\n\n### 分步练习\n\n这组分步练习将介绍监控代理和业务服务。\n\n### 创建 OSB 基础设施服务\n\nOSB\
    \ 基础设施服务提供了一个有用的分组，用于整体监控相关的 OSB 和 WebLogic 组件。Grid Control 会负责识别基础设施组件之间的关系并将它们放在一个组中。\n\
    \n1. 从 Grid Control 主页，点击 **目标** | **中间件**。\n2. 展开您选择的 WebLogic Server 域目标并点击\
    \ OSB 目标。\n3. 从 OSB 目标主页，点击 **创建基础设施服务** 按钮。\n\n4. 在创建服务页面，输入服务名称，例如 osb_infra，然后点击确定，如以下截图所示：\n\
    \n![](img/7529bbd615e859608c21b965162348b2_217_0.png)\n\n5. 您应该会收到确认消息。点击确定。\n\
    \n> 基础设施服务封装了 OSB 实例的关键底层逻辑组件。为了使 OSB 实例和服务顺利运行，底层基础设施也必须顺利运行。观察新创建的系统和服务、系统和服务状态、警报以及策略违规。\n\
    \n### 导航到 OSB 代理服务主页\n\n代理服务为 OSB 执行繁重的工作。它们用于验证、丰富和转换进入服务总线的消息。管理员对 OSB 代理服务具有可见性和理解非常重要。\n\
    \n1. 从 OSB 目标主页，点击 OSB 服务选项卡。\n\n> 服务器上部署的所有 OSB 服务都会在此自动发现并显示。表中还显示了汇总吞吐量进程实例信息。这些指标值以由“Collection\
    \ Interval”控制的频率直接从 OSB 服务器收集并存储在 Grid Control 指标存储库中。可以深入查看任何指标，以查看特定时间范围内不同功能的趋势，例如最小值、最大值或平均值。\n\
    \n![](img/7529bbd615e859608c21b965162348b2_218_0.png)\n\n2. 点击项目中任何已部署的代理服务，例如\
    \ MortgageBroker 项目下的 loanGateway3 代理服务。\n\n> 这是单个 OSB 代理服务页面。请注意代理特定的实例吞吐量图。在底部，请注意代理的所有引用都已发现，包括业务服务、端点、协议、负载平衡算法、权重等。\n\
    \n### 创建 OSB 代理聚合服务\n\n聚合服务是 Grid Control 中一个有用的结构实体，用于在 OSB 代理、业务和基础设施服务之间提供关系和层次结构。在排除问题时，了解代理服务的状态以及支持基础设施的状态都很有用。\n\
    \n1. 从 OSB 代理页面，在 EM 服务下点击创建服务按钮。\n2. 注意确认消息以及已添加的聚合服务。\n\n"
