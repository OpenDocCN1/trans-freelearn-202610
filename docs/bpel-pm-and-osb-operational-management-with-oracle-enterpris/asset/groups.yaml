    # Summary


    Service dashboards are essential to any organization that provides services to
    internal or external consumers. Grid Control lets service desk analysts, IT administrators,
    and IT executives visualize key service aspects via service dashboards.


    In this chapter, we discussed the value of reports as a visualization tool for
    configuring and monitoring data. We created a new dashboard with the key SOA services,
    and then viewed the dashboard to look at the status and health of the services.


    Note that these service dashboards can be made public for all employees to view
    a common source for the health and availability of services. This is common for
    large enterprises for viewing the state of e-mail services, ERP and CRM services,
    and critical BPEL processes. This is akin to a procedural justice method where
    the providers and consumers are aware of the common SLA goals, and the level of
    compliance with those goals.


    The next few chapters will walkthrough hands-on exercises to deploy BPEL processes
    and manage configurations for the BPEL environment.'
