    \n## 查看已安排部署的状态\n\nGrid Control 提供了从其作业页面观察整体部署状态和各个步骤状态的手段。\n\n- 1. 从上一步继续，从\
    \ **Procedure Completion Status** 选项卡中找到 **BPEL Process Provisioning** 作业。\n-\
    \ 2. 点击 **BPEL Process Provisioning** 作业查看详情，如以下截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_105_0.png)\n\
    \n作业状态页面显示已安排作业的详细信息，包括经过的时间和如有错误消息。\n\n- 3. 使用右上角的 **Refresh** 按钮查看进度。\n- 4.\
    \ 等待作业成功完成。\n- 5. 注意 **Status** 和 **Completed Date** 值。\n\n## 查看已部署的流程\n\n一旦部署成功完成，您可以在\
    \ BPEL 控制台上验证新流程：\n\n- 1. 导航到 BPEL 目标主页。\n- 2. 点击 **Processes** 选项卡。\n- 3. 点击右上角的\
    \ **Refresh** 按钮。\n- 4. 在列表中注意新部署的流程。\n\n## 摘要\n\n部署是运营管理员的关键任务。借助 Grid Control\
    \ 软件库和部署流程功能，管理员可以管理 BPEL suitcases，并安排和自动化部署。\n\n在本章中，我们讨论了如何利用 Grid Control\
    \ 的开箱即用部署功能。管理员可以查看部署流程，选择合适的流程，安排部署并观察部署过程。这是一个强大的自动化框架，可用于在多个环境中重复部署并同时进行。还有其他部署变体可能有用，例如在部署结束后再运行自定义脚本。\n\
    \n在 Grid Control 版本 10gR5 中，还支持部署计划（随 BPEL 10.1.3.4 引入）方法。换句话说，包含测试、暂存和生产环境 partner\
    \ links 详细信息的部署计划文件可以上传到软件库。在安排部署时可以使用此文件，partner link 更改将自动完成。客户通常会复制开箱即用的部署流程，并添加几个自定义步骤，使用自研脚本在部署之前或之后执行。\n\
    \n接下来的几章将通过动手练习介绍如何管理 BPEL 环境的配置。\n\n## 8 BPEL 配置管理\n\n在企业中管理软件和硬件资产的配置很重要，原因有几个。“了解你拥有什么”使\
    \ IT 管理员能够做出关于未来投资和淘汰旧资产的决策，标准化现有资产，在整个企业中管理变更，并排查与配置相关的性能问题。\n\n当今大多数配置管理解决方案都符合\
    \ **IT Infrastructure Library (ITIL)** 框架所规定的最佳实践。所有资产都存储在称为 **Configuration Management\
    \ Database (CMDB)** 的中央存储库中。配置参数例如数据库的 `init.ora` 参数，或 WebLogic 应用服务器的 `startup`\
    \ 参数，或 HTTP 服务器的端口号都存储在 CMDB 中。对这些参数的任何更改也会被跟踪。然后可以轻松地审计特定资产的更改，将资产相互比较（例如 database1\
    \ 和 database2），比较同一资产的不同版本，将参考配置保存到 CMDB，并用其在整个企业中标准化。本章讨论管理 BPEL 环境的配置。具体来说，本章讨论：\n\
    \n- 挑战\n- 解决方案\n- 分步练习：\n  - 导航到 BPEL 目标配置管理：\n    - 查看最后收集的配置\n    - 将配置快照保存到存储库\n\
    - 导航到 Oracle Application Server 配置管理：\n  - 查看最后收集的配置\n  - 将配置快照保存到存储库\n- 对 BPEL\
    \ 环境进行更改\n- 对 Oracle Application Server 环境进行更改\n- 将当前 BPEL 配置与已保存的基线进行比较\n- 比较同一流程的\
    \ BPEL 流程版本\n- 将当前 Oracle Application Server 配置与已保存的基线进行比较\n- 查看与已保存基线进行比较的应用服务器目标比较结果\n\
    \n## 挑战\n\n跟踪所有 IT 系统的配置很困难。IT 部门经常求助于 Excel 电子表格来存储关键的 IT 系统信息。这使得 IT 部门在进行更改、衡量影响以及识别因配置错误导致的性能问题方面变得缓慢，并增加了管理数据中心的成本。对于\
    \ BPEL 环境，很难对工作配置进行基线化并将其与不工作的配置进行比较。在将它们推出生产之前，没有好的方法来比较连续的 BPEL 流程版本。\n\n##\
    \ 解决方案\n\n借助 Grid Control，BPEL PM 服务器和流程的关键配置指标会被收集并存储在 Grid Control 配置管理数据库中。这是存放监控信息的同一数据库存储库。管理员可以查看\
    \ BPEL 环境中历史配置更改。他们还可以通过将其保存到存储库中来对工作配置进行基线化。BPEL PM 服务器和域的配置参数可以与其他服务器和域进行比较。最后，还可以比较\
    \ BPEL 流程版本以观察连续部署之间的更改。\n"
