    # Viewing the BPEL process provisioning deployment procedure


    Grid Control consists of several deployment procedures that are used to automate
    various administrative activities.


    +   1. From the Grid Control home page, click on the **Deployments** tab.

    +   2. Scroll down to locate the **Deployment Procedure Manager** section.

    +   3. Click on the **Deployment Procedures** link.


    > A deployment procedure is a series of logical steps that automate key administrative
    tasks related to Oracle products. Most of these complex administrative tasks are
    listed in the "Enterprise Deployment Guide". Note the various deployment procedures
    available out of the box—database provisioning, RAC extend, application server
    provisioning, and so on. These deployment procedures can be customized as well.


    4. Click on the **BPEL Process Provisioning** link.'
