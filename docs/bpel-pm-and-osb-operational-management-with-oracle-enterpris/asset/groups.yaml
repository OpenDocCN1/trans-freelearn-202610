    4. 对于第一个下拉列表中的每个 **服务测试**，从第二个下拉列表中选择 **响应时间（毫秒）** 作为指标，如以下屏幕截图所示：


    ![](img/7529bbd615e859608c21b965162348b2_72_0.png)


    5. 单击 **继续**。


    6. 将指标名称从 **Service_Test 响应时间（毫秒）** 编辑为 **信用验证响应时间（毫秒）**。


    7. 输入 **警告阈值** 和 **严重阈值** 时间（毫秒），即分别为 **3000** 和 **5000**。单击 **确定**，如以下屏幕截图所示：


    ![](img/7529bbd615e859608c21b965162348b2_73_0.png)


    8. 重复步骤 3-7，根据需要为其他服务测试的响应时间添加性能指标。


    ## 设置服务级别期望（可用性）


    对于服务提供商，Grid Control 提供了一种设置服务级别期望并据此进行衡量的方法。服务级别期望可以根据一段时间内可用性和性能基准来定义。


    - 1. 从底部的 **相关链接** 部分单击 **编辑服务级别规则**。

    - 2. 将 **预期服务级别** 从默认值更改为此服务所需的数值，即 **99.0**。

    - 3. 查看 **实际服务级别** 部分中的默认值。

    - 4. 在 **营业时间** 部分，将 **开始时间** 和 **结束时间** 更改为与消费者讨论过或消费者期望的所需业务窗口；例如，**开始时间 08:00**
    和 **结束时间 18:00**。

    - 5. 将默认的 **可用性标准** 更改为符合业务标准。考虑计划停机（停电）以及它们在计算中是否被视为正常运行时间。

    - 6. 在 **性能标准** 下，从 **可用性能指标** 中选择一个或多个指标。

    - 7. 单击 **确定**，如以下屏幕截图所示：


    ![](img/7529bbd615e859608c21b965162348b2_74_0.png)


    ## 查看服务可用性定义


    可用性定义可以基于一个或多个关键测试来定义，例如登录测试和响应时间测试。它取决于提供商和消费者之间的合同。Grid Control 具有灵活性，允许提供商根据合同要求编写任何公式。


    - 1. 单击 **监控配置** 选项卡。

    - 2. 单击 **可用性定义**。


    > 请注意基于服务测试确定可用性的依据。默认情况下，所有服务测试均设置为“关键”服务测试。“关键”测试用于确定可用性。非关键测试数据也会被历史收集，但不用于可用性判定。


    - 3. 单击 **取消**。


    ## 查看 BPEL 基础设施服务


    BPEL 基础设施服务封装了运行 BPEL 流程所需的基础设施组件。


    - 1. 单击 **目标服务** 选项卡。

    - 2. 找到上一章中创建的基础设施服务（通用服务）。

    - 3. 单击基础设施服务以进入服务主页。


    ![](img/7529bbd615e859608c21b965162348b2_75_0.png)


    ## 添加基础设施性能指标


    服务测试指标很重要，但基础设施指标也可以用来表示服务中断。


    - 1. 单击 **监控配置** 选项卡。

    - 2. 单击 **性能指标** 链接。


    3. 如下一屏幕截图所示，对于已列出的默认性能指标，输入以下部分指标的 **警告阈值** 和 **严重阈值**：


    - OC4J 实例 – 请求处理时间（秒）：3 和 5

    - 事务数（每秒）：20 和 50

    - 活动线程最高数量 [默认]：5 和 10

    - CPU 利用率（%）：80 和 95

    - 平均同步进程延迟（毫秒）[默认]：3000 和 5000

    - 平均异步进程延迟（毫秒）[默认]：3000 和 5000


    ![](img/7529bbd615e859608c21b965162348b2_76_0.png)


    4. 将主页上的图表下拉菜单更改为显示 CPU 利用率。


    5. 单击 **确定** 并在确认屏幕上单击 **是**。


    ## 添加基础设施使用指标


    使用指标不计入可用性，但对于评估服务的增长很有用。性能和使用通常是并排查看的指标。


    - 1. 单击 使用指标 链接。

    - 2. 对于已列出的默认使用指标，输入以下部分指标的警告阈值和严重阈值：

    - 自上次收集以来打开的实例 [默认]：20 和 50

    - OC4J 实例 – 活动会话：5 和 10

    - OC4J 实例 – 活动请求：20 和 50

    - 自上次收集以来关闭的实例 [默认]：20 和 50

    - 3. 将主页上的图表下拉菜单更改为显示 OC4J 实例 – 活动请求，如以下屏幕截图所示：


    ![](img/7529bbd615e859608c21b965162348b2_77_0.png)


    4. 单击 确定 并在确认屏幕上单击 是。


    ## 设置服务级别期望（基础设施）


    与为服务设置和衡量期望的方式类似，也可以对一组逻辑基础设施组件进行期望和衡量。


    - 1. 从底部的 **相关链接** 部分单击 **编辑服务级别规则**。

    - 2. 将 **预期服务级别** 从默认值更改为此服务所需的数值，即 **99.0**。

    - 3. 查看 **实际服务级别** 部分中的默认值。

    - 4. 在 **营业时间** 部分，将开始和结束时间更改为与消费者讨论过或消费者期望的所需业务窗口；例如，**开始时间** 为 **08:00**，**结束时间**
    为 **18:00**。

    - 5. 将默认的 **可用性标准** 更改为符合业务标准。考虑计划停机（停电）以及它们在计算中是否被视为正常运行时间。

    - 6. 在 **性能标准** 下，从 **可用性能指标** 中选择一个或多个指标。

    - 7. 参考以下屏幕截图完成上述步骤并单击 **确定**。


    ![](img/7529bbd615e859608c21b965162348b2_78_0.png)


    ## 查看基础设施可用性定义


    这与查看服务可用性定义类似，只是底层组件可用性用于衡量可用性，而不是服务测试。


    - 1. 单击 **监控配置** 选项卡。

    - 2. 单击 **可用性定义**。


    > 请注意基于系统组件确定可用性的依据。默认情况下，所有组件均设置为“关键”组件。“关键”组件用于确定可用性。非关键组件数据也会被历史收集，但不用于可用性判定。


    ![](img/7529bbd615e859608c21b965162348b2_79_0.png)


    3. 单击 **取消**。


    ## 查看 BPEL 流程聚合服务


    聚合服务是可用性服务和基础设施服务的集合。当企业中存在许多服务时，这种逻辑分组使得查看和监控这些服务变得容易。


    - 1. 单击 目标 | 服务 选项卡。

    - 2. 找到之前创建的聚合服务。

    - 3. 单击聚合服务以进入服务主页。


    ![](img/7529bbd615e859608c21b965162348b2_80_0.png)


    ## 查看聚合服务可用性定义


    聚合服务的可用性定义取决于底层组件服务。


    - 1. 在底部的相关链接下，单击 编辑服务。


    > 请注意此聚合服务对子服务的依赖关系。请注意基于两个子服务 AND 关系的可用性定义。


    ## 添加聚合服务性能和使用指标


    底层服务指标可以提升到聚合服务级别，以确保关键指标对网络运营控制管理员以及高管可见。


    - 1. 在 **编辑服务** 模式下单击 **性能** 选项卡。

    - 2. 单击 **添加** 按钮以提升子服务指标。

    - 3. 选择 **基于多个服务的统计聚合** 选项。

    - 4. 将 **函数** 下拉菜单设置为 **最大值**。

    - 5. 为 **子服务** 添加行，即 **SOAOrderBooking(v.1.0)_availability（通用服务）**。

    - 6. 如以下屏幕截图所示，为所选 **子服务** 指标选择 **指标名称**；例如，**客户端响应时间（毫秒）**、**选择服务响应时间（毫秒）** 和
    **信用验证响应时间（毫秒）**。


    ![](img/7529bbd615e859608c21b965162348b2_81_0.png)


    - 7. 单击 **继续**。

    - 8. 将 **指标名称** 编辑为合适的名称，即 **平均 BPEL 响应时间（毫秒）**。

