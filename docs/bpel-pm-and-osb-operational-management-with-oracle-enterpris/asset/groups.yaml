  mdcn: "\n## Summary\n\n配置管理对于管理员控制环境中的变更以及排查与配置更改相关的故障至关重要。借助 Grid Control 的配置管理功能，管理员可以管理变更并减少排查问题所需的时间。\n\
    \n本章中，我们讨论了企业中与配置相关的挑战。我们讨论了如何查看 WebLogic 托管服务器和 OSB 目标的最新配置。然后，我们在 Grid Control\
    \ 仓库中保存了一个已知且可信的配置的快照，以便将其用作比较的基线。然后我们将保存的基线与最新配置进行比较并查看了漂移情况。我们讨论了如何利用 Grid Control\
    \ 配置功能用于 WebLogic 托管服务器和 OSB 目标。\n\n配置管理已通过 Enterprise Manager 收购两款新产品而得到扩展，即\
    \ **配置变更控制台 (CCC)** 和 **应用变更控制台 (ACC)**。借助这两款产品，管理员可以实时查看变更的发生情况，并能够回滚和前进到期望的配置。\n\
