  mdcn: "\n3. 单击 SOA Services Dashboard 链接。\n\n![](img/7529bbd615e859608c21b965162348b2_90_0.png)\n\
    \n> 查看关键 SOA 服务的性能和使用指标。服务仪表板可以根据系统管理员的需求进行自定义。\n\n4. 单击 SOAOrderBooking(v.1.0)_availability\
    \ 的箭头。展开可用性服务以查看底层服务测试及其各自的可用性。\n\n![](img/7529bbd615e859608c21b965162348b2_90_1.png)\n\
    \n5. 单击 **返回**，返回到 SOA 服务仪表板。单击基础设施服务的箭头。注意所有组件以及组件的汇总统计信息。\n\n![](img/7529bbd615e859608c21b965162348b2_91_0.png)\n\
    \n## 摘要\n\n服务仪表板对于向内部或外部用户提供服务的任何组织都至关重要。Grid Control 允许服务台分析师、IT 管理员和 IT 高管通过服务仪表板可视化关键服务方面。\n\
    \n在本章中，我们讨论了报告作为配置和监控数据的可视化工具的价值。我们创建了一个包含关键 SOA 服务的新仪表板，然后查看该仪表板以了解服务的状态和健康状况。\n\
    \n请注意，这些服务仪表板可以公开，供所有员工查看服务健康状况和可用性的统一来源。这在大型企业中很常见，用于查看电子邮件服务、ERP 和 CRM 服务以及关键\
    \ BPEL 流程的状态。这类似于一种程序正义方法，其中提供者和消费者都了解共同的 SLA 目标以及对这些目标的遵守程度。\n\n接下来的几章将逐步介绍动手练习，以部署\
    \ BPEL 流程并管理 BPEL 环境的配置。\n\n## 7 BPEL 部署自动化\n\n在大多数中大型企业中，应用程序开发人员编写代码，然后将其“抛过墙”给运维团队。运维团队现在负责在预发布和生产环境中部署和维护此代码。开发和运维团队通常隶属于不同的管理链，两者之间缺乏协调。\n\
    \nBPEL 流程开发和部署遵循相同的 methodology。管理员必须处理多个可能相互依赖的 BPEL 流程“suitcases”。通常，BPEL 流程部署应遵循企业现有的\
    \ methodology。运维团队应集中维护部署工件，并且该位置应与开发团队使用的位置不同。部署本身应是一个定义明确的流程，具有一系列可重复的步骤。此外，企业最佳实践集应在部署时被调用。本章介绍以标准化方式将多个\
    \ BPEL 流程 suitcases 部署到多个 BPEL 环境。具体来说，本章讨论：\n\n- 挑战\n- 解决方案\n- 逐步练习：\n  - 查看软件库\n\
    \  - 上传 BPEL suitcases 到软件库\n  - 查看 BPEL 流程配置部署流程\n  - 安排 BPEL suitcase 部署\n \
    \ - 查看计划部署的状态\n  - 查看已部署的流程\n\n### 挑战\n\n在生产环境中部署应用程序是一项挑战。管理员必须在固定的时间窗口内将多个应用程序文件部署到多个目标。这耗时且需要对这些应用程序的专业知识。在\
    \ BPEL 环境中，当管理员必须手动处理 *ant 脚本* 以在生产环境中部署 BPEL suitcases 时，挑战更大。*Ant* 对于开发人员在开发机器上处理部署时来说是一个很棒的实用工具，但管理员并没有真正具备定制或构建生产级部署实用工具的专业知识。集中控制\
    \ suitcases 是第一个挑战，管理员必须跟踪 suitcases 以遵守变更和发布管理指南。接下来，部署本身就是一个挑战，因为管理员需要在指定的顺序中部署流程、调用可能需要的任何自定义脚本，并遵守计划的维护窗口。\n\
    \n### 解决方案\n\n使用 Grid Control，管理员可以使用软件库和部署流程框架将多个 BPEL 流程 suitcases 部署到多个 BPEL\
    \ PM 域。管理员收集部署信息的工作由 Grid Control 简化，后者已发现目标并知道目标的大多数关键属性，例如主机名、应用程序服务器名称、端口等。第一步是将\
    \ BPEL 流程 suitcases 上传到软件库以进行集中跟踪和部署。软件库还允许运维团队跟踪 suitcases 的成熟度和使用情况，以及其他软件组件，例如操作系统映像、数据库和应用程序服务器主目录。然后，五步访谈流程让用户选择源\
    \ suitcase 文件、选择目标 BPEL PM 和域、设置凭据，并使用作业系统安排未来的部署。\n\n### 逐步练习\n\n这组逐步练习将介绍上传和部署\
    \ BPEL 流程 suitcases 的过程。\n\n### 查看软件库\n\nGrid Control 软件库是一个运行时版本控制系统。开发人员完成业务流程开发后，工件可以传递给（或由）软件库进行运营跟踪和部署。\n\
    \n1. 从 Grid Control 主页单击 Deployments 选项卡。\n2. 单击 Provisioning 子选项卡。\n3. 展开 Components\
    \ 以显示不同的组件类型。\n\n![](img/7529bbd615e859608c21b965162348b2_95_0.png)\n\n> 软件库包含多个对象，例如操作系统映像、数据库和应用程序服务器的\
    \ Oracle 主目录、BPEL 的部署工件等。库用于跟踪这些组件在各种受监控目标上的使用成熟度。\n\n4. 展开 Oracle Component |\
    \ BPEL Process Suitcase。\n\n> BPEL suitcase 是 BPEL 流程部署单元。它是一个 jar 文件，封装了 BPEL\
    \ 流程的所有组件，例如 .bpel、一个或多个 .xsd 以及一个或多个 .wsdl 文件。\n\n5. 查看软件库的一部分的示例 BPEL suitcase。\n\
    \n### 上传 BPEL suitcases 到软件库\n\nBPEL 流程项目被打包成“BPEL suitcase”，这是一个自包含的部署工件。管理员可以使用此工件部署到各种环境。\n\
    \n1. 为 **BPEL Process Suitcase** 选择单选按钮。\n2. 单击 **Create Component** 按钮。\n3. 在\
    \ **Describe** 步骤中输入以下值：\n   - 将 **Type** 选择为 **Generic Component**。\n   - 名称为\
    \ **ParallelFlow**。\n   - 描述为 **Parallel Flow Sample**。\n   - 将其他字段留空。\n4. 单击\
    \ **Next**，如下图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_96_0.png)\n\n5.\
    \ 在 **Customize** 步骤中，保留默认值并单击 **Next**。\n\n6. 在 **Upload File** 步骤中：\n   - 选择\
    \ **Upload from Local Machine**。\n   - 单击 **Browse...** 按钮。\n   - 找到 BPEL suitcase\
    \ jar 文件夹。\n   - 对于当前示例，选择 `bpel_parallel_flow.jar`。\n\n![](img/7529bbd615e859608c21b965162348b2_97_0.png)\n\
    \n7. 单击 **Next**。\n8. 在 **Set Directives** 步骤中，选择 **Stage** 并单击 **Next**。\n9.\
    \ 在 **Review** 步骤中，注意详细信息，然后单击 **Finish**。\n10. 注意确认消息以及新添加的 BPEL suitcase。\n\n\
    11. 重复上述步骤以向软件库添加其他 BPEL suitcases。\n\n![](img/7529bbd615e859608c21b965162348b2_98_0.png)\n\
    \n### 查看 BPEL 流程配置部署流程\n\nGrid Control 包含多个部署流程，用于自动化各种管理活动。\n\n1. 从 Grid Control\
    \ 主页单击 **Deployments** 选项卡。\n2. 向下滚动以找到 **Deployment Procedure Manager** 部分。\n\
    3. 单击 **Deployment Procedures** 链接。\n\n> 部署流程是一系列逻辑步骤，用于自动化与 Oracle 产品相关的关键管理任务。这些复杂的管理任务大多列在“Enterprise\
    \ Deployment Guide”中。请注意开箱即用的各种部署流程——数据库配置、RAC 扩展、应用程序服务器配置等。这些部署流程也可以自定义。\n\n\
    4. 单击 **BPEL Process Provisioning** 链接。\n"
