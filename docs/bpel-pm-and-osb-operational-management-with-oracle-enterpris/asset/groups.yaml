    \ created infrastructure service has automatically been associated with the aggregate\
    \ service. In the Services section, starting from the left, you see the service\
    \ name, type of service, status, and other alerts. The top-level service is the\
    \ aggregate service. The next service is the infrastructure service—a subservice\
    \ of the aggregate.\n\n## Creating a SOAP test to monitor an OSB proxy service\
    \ endpoint\n\nMonitoring proxy services from a client or an end-user perspective\
    \ is important for the operations team. This helps the team to get alerted potentially\
    \ before clients or end users report the error.\n\n> A SOAP (Simple Object Access\
    \ Protocol) test is a way to check the availability and performance of a Web service\
    \ with a SOAP interface. This remote synthetic check invokes an operation within\
    \ the Web service as defined in the WSDL (Web Service Description Language) and\
    \ measure the HTTP response code and latency.\n\n- 1. Scroll down to the References\
    \ section, and select loanGateway3 from the radio button list.\n\n## OSB Proxy\
    \ and Business Service Monitoring\n\n- 2. Click on the Add SOAP Test button to\
    \ create a SOAP test for that service.\n\n![](img/7529bbd615e859608c21b965162348b2_220_0.png)\n\
    \n- 3. For the Collection Frequency field, enter 3 minutes.\n\n- 4. Under Input\
    \ Parameters, click on XML Source.\n\n- 5. Enter a proxy service payload. This\
    \ is the XML input that is needed for the proxy service to perform its business.\n\
    \n> A proxy service payload can be generated through a simple test of the proxy\
    \ through the OSB console. Once the inputs are entered into the test page, the\
    \ console generates an XML payload that can be used as input for the SOAP test.\n\
    \n- 6. Leave the Basic Authentication Credentials section empty.\n\n- 7. Click\
    \ on Continue, as shown in the following screenshot:\n\n![](img/7529bbd615e859608c21b965162348b2_221_0.png)\n\
    \n- 8. To add a Beacon, click on the Add button.\n\n- 9. From the pop-up window,\
    \ check one or more Beacons from the available Beacons and click on Select, as\
    \ shown in the following screenshot:\n\n![](img/7529bbd615e859608c21b965162348b2_221_1.png)\n\
    \n- 10. Click on OK to save the SOAP test and Beacon settings.\n\n- 11. On the\
    \ OSB proxy home page, note the availability generic service that was automatically\
    \ created.\n\n> The availability service for the OSB proxy is formed when the\
    \ first SOAP test is created. Note the status of each test, and how it is rolled\
    \ up (configurable) to determine process availability.\n\n- 12. Expand the loanGateway3_availability\
    \ and verify whether the SOAP test that was just created in the prior steps has\
    \ been added.\n\n> Note that the status of the SOAP test will take some time to\
    \ show up, based on the frequency set for the test.\n\n![](img/7529bbd615e859608c21b965162348b2_222_0.png)\n\
    \n## Creating a SOAP test to monitor an OSB business service endpoint\n\nBusiness\
    \ services provide the endpoint facade to the proxy services. It is important\
    \ to monitor them with SOAP tests similar to the proxy service monitoring.\n\n\
    - 1. Create a business service SOAP test to monitor business service endpoint.\n\
    - 2. Go to the loanGateway3 proxy page.\n- 3. Scroll down and select one of the\
    \ business service endpoints, for example the localhost:7021 radio button under\
    \ the normalLoanProcessor business service.\n- 4. Click on Add SOAP Test to create\
    \ a SOAP test for the business service.\n\n![](img/7529bbd615e859608c21b965162348b2_223_0.png)\n\
    \n- 5. Change the collection frequency to a desired number in minutes, for instance,\
    \ 3.\n- 6. Leave the default port that has been selected.\n- 7. Under Input Parameters,\
    \ click on XML Source.\n- 8. Enter the business service payload saved earlier.\n\
    - 9. Leave the Basic Authentication Credentials section empty.\n\n![](img/7529bbd615e859608c21b965162348b2_223_1.png)\n\
    \n- 10. Click on OK to complete the creation of the service test.\n- 11. Observe\
    \ the confirmation message.\n\n- 12. Expand the availability service to view the\
    \ SOAP test for the business service endpoint.\n\n![](img/7529bbd615e859608c21b965162348b2_224_0.png)\n\
    \n## Testing the SOAP tests\n\nOnce the SOAP tests have been created, Grid Control\
    \ provides the capability to run any of the SOAP tests on demand to test the availability\
    \ and performance of the underlying service.\n\n- 1. Click on one of the SOAP\
    \ tests that you've created.\n\n> The test page shows the test availability, Beacons\
    \ that run this test, and alerts associated with this test. The graph shows the\
    \ test response times from the beacon. Note that the test metrics will take some\
    \ time to show up on the test home page. One or more Beacons could be used to\
    \ test the service, potentially from multiple geographic locations that emulate\
    \ the user base.\n\n![](img/7529bbd615e859608c21b965162348b2_225_0.png)\n\n- 2.\
    \ Click on the **Verify Service Test** button.\n- 3. Click on the **Perform Test**\
    \ to run the test instantaneously and view the results, as shown in the following\
    \ screenshot:\n\n![](img/7529bbd615e859608c21b965162348b2_225_1.png)\n\n## Summary\n\
    \nMonitoring OSB proxy and business services is key to guaranteeing healthy key\
    \ business processes in the enterprise, and preserving the provider-to-consumer\
    \ relationship. In this chapter, we looked at how to monitor OSB proxy and business\
    \ services using agent-based monitoring and synthetic tests. In order to monitor\
    \ the OSB services, the appropriate Grid Control service mappings had to be created.\
    \ We created the OSB infrastructure service, visited the proxy service home page\
    \ to view the discovered services, and created the OSB proxy aggregate service.\
    \ Once the Grid Control services had been set up, we created SOAP tests to monitor\
    \ the proxy and business service endpoints. Finally, we tested the SOAP tests\
    \ that we created.\n\nThe next few chapters will walkthrough hands-on exercises\
    \ to perform additional management tasks on the Oracle Service Bus.\n\n## 14 WebLogic\
    \ and OSB Configuration Management\n\nManaging the configurations of middleware\
    \ environments is a difficult proposition for medium and large enterprises. \"\
    Knowing what you have\" enables IT managers to make decisions about future investments\
    \ and retiring old assets, standardize existing assets, manage change across the\
    \ enterprise, and troubleshoot performance problems related to configurations.\n\
    \nMost configuration management solutions today are compliant with the best practices\
    \ laid out by the **IT Information Library (ITIL)** framework. All the assets\
    \ are stored in a central repository called the **Configuration Management Database\
    \ (CMDB)**. Configuration parameters such as instance parameters for a database,\
    \ or start up parameters for a WebLogic application server, or port numbers for\
    \ an HTTP server are stored in the CMDB. Any changes to these parameters are also\
    \ tracked. It then becomes easy to audit the changes for a specific asset, compare\
    \ assets to each other (for example, Managed Server 1 and Managed Server 2), compare\
    \ different versions of the same asset, save a reference configuration to the\
    \ CMDB, and use that to standardize across the enterprise. This chapter talks\
    \ about managing configurations for a WebLogic and OSB environment. Specifically,\
    \ this chapter talks about:\n\n- Challenges\n- Solution\n- Step-by-step exercises:\n\
    \  - Viewing a WebLogic managed server configuration\n  - Saving a managed server\
    \ configuration snapshot\n  - Viewing and saving an OSB configuration\n  - Comparing\
    \ the current OSB configuration with a saved baseline\n  - Comparing the current\
    \ managed server configuration with a saved baseline\n\n## Challenges\n\nIt is\
    \ difficult to track the configurations of all IT systems. Often, IT departments\
    \ resort to Excel spreadsheets to store critical middleware configuration information.\
    \ This makes an IT department slow in making changes, measuring impact, identifying\
    \ performance problems due to incorrect configuration, and increases costs of\
    \ managing a data center. With a WebLogic and OSB environment, it is difficult\
    \ to maintain configurations for multiple domains, and underlying configurations.\
    \ For a medium-to-large WebLogic installation, it is important to baseline a working\
    \ configuration and compare it with non-working ones for department or enterprise-wide\
    \ customization. For OSB, there is the additional challenge of maintaining the\
    \ proxy and business service configurations over different project versions. In\
    \ the absence of control over configurations, it is difficult to assess the production\
    \ impact for new project versions, as well as troubleshoot production problems\
    \ that might be associated with configuration changes.\n\n## Solution\n\nWith\
    \ Grid Control, key configuration metrics for WebLogic and OSB server processes\
    \ are collected and stored in the Enterprise Manager repository. Administrators\
    \ can view the historic configuration changes across the WebLogic and OSB environment.\
    \ They can also baseline a working configuration by saving it in the repository.\
    \ A WebLogic Admin, Managed Server, and OSB server configuration parameters can\
    \ be compared with other servers. Finally, OSB project versions can also be compared\
    \ to observe the changes and assess impact across successive deployments.\n\n\
    ## Step-by-step exercises\n\nThis set of step-by-step exercises will walkthrough\
    \ managing configurations for the WebLogic and OSB server targets.\n\n## Viewing\
    \ a WebLogic managed server configuration\n\nDuring a reactive troubleshooting\
    \ exercise (typically associated with a monitoring alert), one of the first questions\
    \ that an administrator asks is \"what changed?\" Before even viewing the changes,\
    \ it is useful to look at the current configuration of the system to determine\
    \ if there are any obvious wrong settings:\n\n- 1. Navigate to the **Targets |\
    \ Middleware** tab.\n- 2. Click on the **Oracle WebLogic Managed Server** link.\n"
  mdcn: "\n![](img/7529bbd615e859608c21b965162348b2_219_0.png)\n\n> 请注意，已创建的聚合服务列在\
    \ Services 部分下。之前创建的基础设施服务已自动与聚合服务关联。在 Services 部分，从左侧开始，您可以看到服务名称、服务类型、状态和其他警报。顶级服务是聚合服务。下一个服务是基础设施服务——聚合服务的子服务。\n\
    \n## 创建 SOAP 测试以监控 OSB 代理服务端点\n\n从客户端或终端用户角度监控代理服务对于运维团队非常重要。这有助于团队在客户端或终端用户报告错误之前就收到警报。\n\
    \n> SOAP（Simple Object Access Protocol，简单对象访问协议）测试是一种检查具有 SOAP 接口的 Web 服务可用性和性能的方法。此远程合成检查会调用\
    \ Web 服务中 WSDL（Web Service Description Language，Web 服务描述语言）定义的某个操作，并测量 HTTP 响应代码和延迟。\n\
    \n- 1. 滚动到 References 部分，并从单选按钮列表中选择 loanGateway3。\n\n## OSB 代理和业务服务监控\n\n- 2.\
    \ 点击 Add SOAP Test 按钮为该服务创建 SOAP 测试。\n\n![](img/7529bbd615e859608c21b965162348b2_220_0.png)\n\
    \n- 3. 对于 Collection Frequency 字段，输入 3 分钟。\n\n- 4. 在 Input Parameters 下，点击 XML\
    \ Source。\n\n- 5. 输入代理服务负载。这是代理服务执行其业务所需的 XML 输入。\n\n> 代理服务负载可以通过通过 OSB 控制台对代理进行简单测试来生成。输入在测试页面中输入后，控制台会生成可作为\
    \ SOAP 测试输入使用的 XML 负载。\n\n- 6. 将 Basic Authentication Credentials 部分留空。\n\n- 7.\
    \ 点击 Continue，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_221_0.png)\n\
    \n- 8. 要添加 Beacon，请点击 Add 按钮。\n\n- 9. 从弹出窗口中，勾选一个或多个可用的 Beacons 并点击 Select，如以下屏幕截图所示：\n\
    \n![](img/7529bbd615e859608c21b965162348b2_221_1.png)\n\n- 10. 点击 OK 保存 SOAP 测试和\
    \ Beacon 设置。\n\n- 11. 在 OSB 代理主页上，注意自动创建的通用可用性服务。\n\n> OSB 代理的可用性服务是在创建第一个 SOAP\
    \ 测试时形成的。请注意每个测试的状态，以及如何汇总（可配置）以确定流程可用性。\n\n- 12. 展开 loanGateway3_availability\
    \ 并验证之前步骤中创建的 SOAP 测试是否已添加。\n\n> 请注意，SOAP 测试的状态显示需要一些时间，具体取决于为测试设置的频率。\n\n![](img/7529bbd615e859608c21b965162348b2_222_0.png)\n\
    \n## 创建 SOAP 测试以监控 OSB 业务服务端点\n\n业务服务为代理服务提供端点外观。使用与代理服务监控类似的 SOAP 测试监控它们非常重要。\n\
    \n- 1. 创建业务服务 SOAP 测试以监控业务服务端点。\n- 2. 转到 loanGateway3 代理页面。\n- 3. 滚动向下并选择其中一个业务服务端点，例如\
    \ normalLoanProcessor 业务服务下的 localhost:7021 单选按钮。\n- 4. 点击 Add SOAP Test 为业务服务创建\
    \ SOAP 测试。\n\n![](img/7529bbd615e859608c21b965162348b2_223_0.png)\n\n- 5. 将收集频率更改为所需分钟数，例如\
    \ 3。\n- 6. 保留已选择的默认端口。\n- 7. 在 Input Parameters 下，点击 XML Source。\n- 8. 输入之前保存的业务服务负载。\n\
    - 9. 将 Basic Authentication Credentials 部分留空。\n\n![](img/7529bbd615e859608c21b965162348b2_223_1.png)\n\
    \n- 10. 点击 OK 完成服务测试的创建。\n- 11. 观察确认消息。\n\n- 12. 展开可用性服务以查看业务服务端点的 SOAP 测试。\n\n\
    ![](img/7529bbd615e859608c21b965162348b2_224_0.png)\n\n## 测试 SOAP 测试\n\n一旦创建了\
    \ SOAP 测试，Grid Control 提供了按需运行任何 SOAP 测试的功能，以测试底层服务的可用性和性能。\n\n- 1. 点击您创建的其中一个\
    \ SOAP 测试。\n\n> 测试页面显示测试可用性、运行此测试的 Beacons 以及与此测试关联的警报。图表显示来自 beacon 的测试响应时间。请注意，测试指标在测试主页上显示需要一些时间。一个或多个\
    \ Beacons 可用于测试服务，可能来自模拟用户群体的多个地理位置。\n\n![](img/7529bbd615e859608c21b965162348b2_225_0.png)\n\
    \n- 2. 点击 **Verify Service Test** 按钮。\n- 3. 点击 **Perform Test** 立即运行测试并查看结果，如以下屏幕截图所示：\n\
    \n![](img/7529bbd615e859608c21b965162348b2_225_1.png)\n\n## 摘要\n\n监控 OSB 代理和业务服务对于保证企业关键业务流程健康以及维护提供者到消费者的关系至关重要。在本章中，我们研究了如何使用基于代理的监控和合成测试来监控\
    \ OSB 代理和业务服务。为了监控 OSB 服务，必须创建适当的 Grid Control 服务映射。我们创建了 OSB 基础设施服务，访问代理服务主页以查看发现的服务，并创建了\
    \ OSB 代理聚合服务。Grid Control 服务设置完成后，我们创建了 SOAP 测试以监控代理和业务服务端点。最后，我们测试了创建的 SOAP 测试。\n\
    \n接下来的几章将逐步介绍动手练习，以对 Oracle Service Bus 执行额外的管理任务。\n\n## 14 WebLogic 和 OSB 配置管理\n\
    \n管理中间件环境的配置对于中小型和大型企业来说是一个困难的命题。“了解你拥有什么”使 IT 管理员能够就未来投资和淘汰旧资产做出决策，标准化现有资产，在整个企业中管理变更，并排除与配置相关的性能问题。\n\
    \n大多数配置管理解决方案今天都符合 **IT 信息库 (ITIL)** 框架规定的最佳实践。所有资产都存储在称为 **配置管理数据库 (CMDB)** 的中央存储库中。配置参数（如数据库的实例参数、WebLogic\
    \ 应用服务器的启动参数或 HTTP 服务器的端口号）存储在 CMDB 中。对这些参数的任何更改也会被跟踪。然后很容易审计特定资产的更改，将资产相互比较（例如，托管服务器\
    \ 1 和托管服务器 2），比较同一资产的不同版本，将参考配置保存到 CMDB，并用它在整个企业中进行标准化。本章讨论 WebLogic 和 OSB 环境的配置管理。具体来说，本章讨论：\n\
    \n- 挑战\n- 解决方案\n- 逐步练习：\n  - 查看 WebLogic 托管服务器配置\n  - 保存托管服务器配置快照\n  - 查看和保存 OSB\
    \ 配置\n  - 将当前 OSB 配置与保存的基线进行比较\n  - 将当前托管服务器配置与保存的基线进行比较\n\n## 挑战\n\n很难跟踪所有 IT\
    \ 系统的配置。通常，IT 部门会求助于 Excel 电子表格来存储关键的中间件配置信息。这使得 IT 部门在进行更改、衡量影响、识别因配置不正确导致的性能问题方面变得缓慢，并增加了管理数据中心的成本。对于\
    \ WebLogic 和 OSB 环境，很难维护多个域以及底层配置的配置。对于中大型 WebLogic 安装，基线化一个工作配置并将其与非工作配置进行比较以进行部门或企业范围的定制非常重要。对于\
    \ OSB，跨不同项目版本维护代理和业务服务配置的额外挑战。在缺乏对配置的控制的情况下，很难评估新项目版本对生产的影响，以及可能与配置更改相关的生产问题的故障排除。\n\
    \n## 解决方案\n\n使用 Grid Control，WebLogic 和 OSB 服务器进程的关键配置指标被收集并存储在 Enterprise Manager\
    \ 存储库中。管理员可以查看 WebLogic 和 OSB 环境中历史配置更改。他们还可以通过将配置保存在存储库中来基线化工作配置。WebLogic Admin、托管服务器和\
    \ OSB 服务器配置参数可以与其他服务器进行比较。最后，还可以比较 OSB 项目版本以观察更改并评估连续部署中的影响。\n\n## 逐步练习\n\n这组逐步练习将逐步介绍\
    \ WebLogic 和 OSB 服务器目标的配置管理。\n\n## 查看 WebLogic 托管服务器配置\n\n在响应式故障排除练习中（通常与监控警报相关），管理员问的第一个问题之一是“发生了什么变化？”在查看更改之前，有用的是查看系统的当前配置，以确定是否有任何明显的错误设置：\n\
    \n- 1. 导航到 **Targets | Middleware** 选项卡。\n- 2. 点击 **Oracle WebLogic Managed Server**\
    \ 链接。\n\n"
