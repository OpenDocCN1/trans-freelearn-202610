    \ 撰稿\n\n我们欢迎所有有兴趣撰稿的人的咨询。图书提案请发送至 author@packtpub.com。如果您的图书想法仍处于早期阶段，并且您希望在撰写正式的图书提案之前先进行讨论，请联系我们；我们的其中一位约稿编辑将与您联系。\n\
