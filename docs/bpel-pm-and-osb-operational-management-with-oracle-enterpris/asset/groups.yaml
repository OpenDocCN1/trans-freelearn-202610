    ## 安装 Grid Control


    Grid Control 的最新版本可以从 OTN 下载，网址为：

    http://www.oracle.com/technology/software/products/oem/index.html


    Grid Control 文档包括安装、配置、部署模式等，可以在以下位置找到： http://download.oracle.com/docs/cd/B16240_01/doc/nav/portal_booklist.htm


    Grid Control 安装并配置后，可以添加与 SOA 相关的目标。先决条件是在托管 SOA Suite 的服务器上安装管理代理（Agent）。有关使用
    Grid Control 进行 SOA 管理入门的更多详细信息，请访问 Oracle 技术网络（OTN）网站： http://download.oracle.com/docs/cd/B16240_01/doc/em.102/e12650/toc.htm


    ## 主页


    下载并安装 Grid Control 后，首要任务是查看 Grid Control 的主页。要在本地浏览器中查看 Grid Control 主页：


    - 1. 导航到 http://<your_server_name>:<server_port>/em.

    - 2. 以 sysman.sysman 登录。使用安装期间设置的密码。


    以下是 Enterprise Manager 10g Grid Control 的入口点或主页。主页汇总了所有重要信息（从左上角开始）：


    ![](img/7529bbd615e859608c21b965162348b2_25_0.png)


    - **所有目标状态**：本节显示受监控的 Oracle 目标总数。饼图显示其整体 SLA 可用性和相应的未解决警报。此摘要页面可针对任何目标类型进行汇总。


    单击 **查看** 下拉菜单并观察此企业中的不同目标类型。这是 Grid Control 支持的目标类型的子集。


    - **所有目标警报**：对受监控目标的所有指标阈值的违规，按 **严重** 和 **警告** 类别划分。

    **错误** 是与代理相关的问题（代理无法访问、无法上传、指标收集错误等）。


    - **所有目标策略违规**：超过 300 条 Oracle 最佳实践（例如，Application Server 上的开放端口）已作为策略编码在 Grid
    Control 中。代理每天检查这些策略并标记违规行为。


    - **目标搜索**：只需输入目标名称的一部分即可快速访问任何目标。


    - **Oracle 主目录的关键补丁 advisory**：推送对系统至关重要的任何安全警报。设置到 MetaLink 的连接并自动下载受监控 Oracle
    主目录的补丁信息。


    - **部署摘要**：Enterprise Manager 收集有关您整个配置的信息，包括软件、补丁（操作系统和 Oracle 软件级别）、硬件等。这是您企业中所有主机、软件和操作系统（OS）的汇总。


    ## Oracle BPEL Process Manager 概述


    *业务流程执行语言（BPEL），简称为 Web 服务业务流程执行语言（WS-BPEL），是一种用于指定与 Web 服务交互的可执行语言。业务流程执行语言中的流程通过专门使用
    Web 服务接口来导出和导入信息。来源：http://en.wikipedia.org/wiki/Business_Process_Execution_Language*


    主要厂商如 Oracle、Microsoft 和 IBM 都支持 BPEL 标准，该标准已成为首选的编排标准。Oracle 于 2005 年收购了名为 Collaxa
    的小型公司，该公司拥有 BPEL 标准的实现，随后将产品更名为 BPEL Process Manager，并使其成为 SOA Suite 的基础。这也成为
    Fusion Middleware 伞下以及 Fusion Applications 伞下的战略技术产品。Oracle Applications Unlimited（E-Business
    Suite、PeopleSoft、Siebel、Retek 等）使用多种不同的工作流技术，如 Oracle Workflow，但所有这些工作流技术的路线图都是要收敛到基于
    Oracle BPEL Process Manager 产品的通用 BPEL 标准。简而言之，这项技术不仅对整体中间件市场，而且对打包应用市场都有巨大的影响。Oracle
    在这两个市场都拥有庞大的装机基础，尤其是在 2008 年收购 BEA 之后，专注于在其客户群中扩大 BPEL 的已有大规模采用。


    BPEL Process Manager 10.1.2 是 Collaxa 收购后的首个发布版本。目前，该产品作为 Oracle SOA Suite 10.1.3.x
    的一部分提供。这是产品相当成熟的版本，并在有兴趣实施 SOA 战略的客户中获得了广泛采用。这也是下一代 Oracle Fusion Applications
    的基础。


    ## Oracle SOA Suite 概述


    Oracle SOA Suite 10.1.3.x 由三个组件组成 – Oracle BPEL Process Manager、**Oracle 企业服务总线
    (OESB)** 和 **Oracle Web 服务管理器 (OWSM)**。此外，它还包括 **Oracle 服务总线 (OSB)**、**Oracle
    业务活动监控 (BAM)** 和规则引擎。


    Oracle 构建了企业服务总线（OESB）作为管道层来前端化基于 BPEL 的业务流程。服务总线用作中间层，将不同格式的消息转换为通用规范格式，并路由到后端
    BPEL 流程或其他服务。它是相对于点对点 **企业应用集成 (EAI)** 方法论的提升，该方法论涉及在集成两端频繁更改。


    Oracle SOA Suite 10.1.3.x 是一个单一的可安装包，并且使用 Oracle JDeveloper 极易安装和配置。作为开发基于 BPEL
    的业务流程和基于 OESB 的服务的通用 IDE，它为开发人员和架构师实施 SOA 项目提供了良好的平台。


    ## Oracle Service Bus 概述


    > *Oracle Service Bus 是一种经过验证的、轻量级且可扩展的 SOA 集成平台，可为高容量、任务关键型 SOA 环境提供低成本、基于标准的集成。它旨在连接、调解和管理异构服务、遗留应用、打包应用以及企业级服务网络中多个企业服务总线（ESB）实例之间的交互。Oracle
    Service Bus 是 Oracle SOA Suite 中的核心组件，是 SOA 消息传递的骨干。来源：http://www.oracle.com/technologies/soa/service-bus.html*


    在收购 BEA 后，AquaLogic Service Bus（ALSB）也加入了 Oracle 阵营。收购后，ALSB 被更名为 Oracle Service
    Bus（OSB）。2008 年 7 月 1 日，Fusion Middleware 高级副总裁 Thomas Kurian 宣布了 Oracle 中间件和
    BEA 产品的战略路线图。他宣布 OSB 将成为今后的战略服务总线，凭借其广泛的客户采用率和先进的产品功能。


    ## 摘要


    通过单一的管理解决方案来管理 SOA 服务、基础设施和产品，Grid Control 降低了 SOA 环境的复杂性。Grid Control 是一种企业级解决方案，因此必须谨慎将其打造为战略产品。安装和部署并非一项简单的任务。然而，设置满足企业需求的管理框架是至关重要的。


    Grid Control 传统上被视为数据库管理解决方案，但本书将强调在 SOA 环境中使用该解决方案的必要性。


    在本章中，我们研究了一些目标产品以及管理解决方案的基本概念。特别是，我们讨论了 Enterprise Manager Grid Control 作为重要的管理解决方案。简要地，我们讨论了
    Grid Control 的安装、文档和架构。然后我们讨论了 SOA 产品 BPEL PM 和 OSB。我们介绍了这两个产品的基本概念，以及各自的简要背景。


    这只是这些产品的概述。优秀的管理员应具备 Oracle BPEL PM、SOA Suite 和 Service Bus 的基本操作知识。本书将重点关注下一步，即从
    Grid Control 管理这些产品。


    接下来的几章将通过动手练习指导设置和执行管理任务。

    '
