  mdcn: "\n## 3\n## BPEL 流程监控\n了解 BPEL 流程的复杂性非常重要，这带来了对主动运营监控的额外需求。BPEL 流程是工作流的新一代。它们支持\
    \ SOA，这意味着它们使用通用的 **Web 服务调用框架 (WSIF)** 来编排不同系统之间的交互。WSIF 使 BPEL 能够构建外观以与任何支持\
    \ Web 服务的系统进行交互。在 BPEL 框架中，Web 服务交互被称为“partner links”。这对于编排涉及新系统和遗留系统的复杂业务流程非常强大。它为\
    \ IT 提供了企业范围业务流程的自动化框架。监控 BPEL 流程对于业务分析师和管理员维护业务可见性并快速解决问题非常重要。本章介绍查看已部署的 BPEL\
    \ 流程及其构成的 partner links。此外，还介绍了使用指标和合成测试的组合来监控 BPEL 流程和 partner links。\n\nGrid\
    \ Control 提供了通过服务测试来监控关键 BPEL 流程、partner links 和 Web 服务的手段，以确定可用性和响应时间。Grid Control\
    \ 还提供了衡量容器上部署的每个 Web 服务实际请求的关键指标的手段。通过结合最终用户和请求的视角，Grid Control 可以确定所有受监控服务的服务可用性。\n\
    \n- 挑战\n- 解决方案\n- 分步练习：\n  - 导航到 BPEL PM 目标主页\n  - 导航到 BPEL 流程主页\n  - 创建 BPEL\
    \ 流程聚合服务\n  - 创建 SOAP 测试以监控 partner link\n  - 创建 SOAP 测试以监控 BPEL 流程\n  - 测试 SOAP\
    \ 测试\n\n### 挑战\n一旦 BPEL 流程部署到暂存、预生产或生产环境中，管理员就会发现很难跟踪这些关键流程的健康状况。BPEL 领域缺乏工具和运营技能，因此在遇到问题时，很难理解该看哪里以及看什么。这些流程经常是关键业务功能的自动化表示，并且需要按预期工作。每个流程每天可能产生数百或数千个实例。如果任何流程在可用性或性能方面未按预期执行，管理员需要介入并解决问题。管理员需要尽快解决问题，通常花费大部分时间对问题进行分类，以了解潜在的根本原因。此外，在大多数情况下，最终用户会报告这些问题，无论是通过互联网的消费者还是关键业务合作伙伴。如果是这种情况，企业已经损失了收入或信誉，或两者兼有。\n\
    \n### 解决方案\nGrid Control 提供了通过服务测试来监控关键 BPEL 流程、partner links 和 Web 服务的手段，以确定可用性和响应时间。Grid\
    \ Control 还提供了衡量容器上部署的每个 Web 服务实际请求的关键指标的手段。Grid Control 可以利用其主动最终用户监控功能来确定所有受监控服务的服务可用性。\n\
    \n### 分步练习\n这组分步练习将介绍 BPEL 流程主页的发现过程，以及为流程和 partner links 设置监控。\n\n### 导航到 BPEL\
    \ PM 目标主页\nGrid Control 可以监控多种类型的目标。第一个任务是进入 BPEL PM 目标主页。所有 BPEL 特定的监控视图都可以在目标主页中查看。\n\
    \n1. 导航到 Grid Control 主页。\n2. 在右侧的 **Target Search** 区域中，单击 **Search** 下拉菜单。\n\
    3. 向下滚动以定位并单击 **BPEL Process Manager target** 类型。\n4. 单击 **Go** 按钮。\n5. 显示已发现的\
    \ BPEL Process Manager 目标列表。单击所选的目标名称。这会带您进入 BPEL PM 目标主页。\n\n> 如果只发现一个 BPEL Process\
    \ Manager 目标，Go 按钮将自动带您进入该目标的主页。\n\n### 导航到 BPEL 流程主页\nBPEL 目标主页主要是基础设施视图。目标主页中有一个部分可用于查看\
    \ BPEL 流程列表及其监控指标。\n\n1. 从 BPEL 目标主页单击 Processes 选项卡。\n\n> 在此处发现并显示服务器上部署的所有 BPEL\
    \ 流程。请注意，流程在它们部署的域内显示。表中还显示了汇总的流程实例吞吐量信息。这些指标默认情况下以预设的轮询频率（收集间隔）从 BPEL PM 服务器收集。可以轻松更改默认轮询频率，并为这些开箱即用的指标设置阈值，以便触发警报和通知（使用通知规则）。\n\
    \n![](img/7529bbd615e859608c21b965162348b2_41_0.png)\n\n3. 单击默认域下的 BPEL 流程名称，例如\
    \ **SOAOrderBooking(v1.0)**。\n\n> 这是单个 BPEL 流程页面。请注意流程特定的实例吞吐量图。在底部，请注意 BPEL 流程的所有\
    \ partner links（在底部）连同端口类型、操作和 WSDL 信息一起被发现。\n> \n> 创建 BPEL 流程聚合服务。请注意，在尝试创建 BPEL\
    \ 流程聚合服务之前，您需要创建 BPEL Infrastructure Service。有关如何执行此操作的说明在 *第 4 章* 中提供。\n\n4.\
    \ 从 BPEL 流程页面单击 **Create Service** 按钮，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_42_0.png)\n\
    \n5. 观察聚合服务创建的确认消息。\n\n> 创建的聚合服务列在 **Services** 部分下。之前创建的基础设施服务已自动与聚合服务关联。在 **Services**\
    \ 部分，从左侧开始，您可以看到服务名称、服务类型、状态和其他警报。顶级服务是聚合服务。下一个服务是基础设施服务——聚合服务的子服务。\n\n![](img/7529bbd615e859608c21b965162348b2_43_0.png)\n\
    \n### 创建 SOAP 测试以监控 partner link\n合成事务是一种主动方式，用于模拟最终用户（或客户端）行为并在最终用户（或客户端）之前发现问题。BPEL\
    \ 流程通常通过 partner link 框架调用一个或多个 Web 服务，通常通过 SOAP。用于测试 BPEL partner link 可用性和性能的合成检查是发现服务消费者之前问题的绝佳方式。\n\
    \n1. 向下滚动并从单选按钮列表中选择一个 partner link 名称，例如 **SelectService**。\n\n2. 单击 **Add SOAP\
    \ Test** 按钮为该 partner link 创建 SOAP 测试。\n\n![](img/7529bbd615e859608c21b965162348b2_44_0.png)\n\
    \n3. 将 SOAP 测试名称输入为 **SelectService_test**。\n4. 将 **Collection Frequency (minutes)**\
    \ 的测试间隔输入为 **15**。\n5. 从 **Port Types** 下拉列表中选择 Web 服务端口为 **SelectServiceCallbackPort**。\n\
    6. 在 HTML 输入字段中输入输入参数，例如 **SupplierPrice {String}** 为 **12345**，**SupplierName\
    \ [String]** 为 **2**。\n7. 将 **Basic Authentication Credentials** 部分留空。\n8. 在 **Create\
    \ SOAP Test** 页面上的字段按以下屏幕截图所示填写后单击 **OK** 继续：\n\n![](img/7529bbd615e859608c21b965162348b2_45_0.png)\n\
    \n9. 添加一个信标。单击 Add 按钮。\n10. 从弹出窗口中检查并选择可用的信标，如下一屏幕截图所示：\n"
