    \n9. View the deployed projects in Grid Control:\n- Navigate to the OSB target\
    \ home page.\n- Click on the **OSB Services** tab.\n- Click the **Refresh** button\
    \ on the top right.\n- Note the newly deployed projects in the list.\n\n![](img/7529bbd615e859608c21b965162348b2_213_0.png)\n\
    \n## Summary\n\nDeployment is a critical task for WebLogic administrators. With\
    \ Grid Control Software Library and deployment procedure capabilities, administrators\
    \ can manage WebLogic and OSB projects, and schedule and automate deployment.\n\
    \nIn this chapter, we covered the various administrative challenges dealing with\
    \ application code deployments such as OSB project deployments. Grid Control automates\
    \ the deployment process for the administrator, thereby saving time and reducing\
    \ human errors. First we took a look at the Grid Control Software Library, then\
    \ we uploaded the new OSB projects to this library, and then we kicked off the\
    \ actual deployment procedure. Finally, we looked at the execution of the deployment\
    \ procedure job, and validated the completion and successful deployment via the\
    \ OSB console.\n\nThe next few chapters will walkthrough managing other areas\
    \ in OSB such as monitoring services, managing configurations, and service levels.\n\
    \n## 13\n\n## OSB Proxy and Business Service Monitoring\n\nOracle Service Bus\
    \ is one of the premier **Enterprise Service Bus (ESB)** systems available in\
    \ the marketplace. It follows the typical ESB paradigm of validate, enrich, and\
    \ transform (VET). Often, OSB acts as the provider to one or more consumers for\
    \ business critical services.\n\nMonitoring provides visibility and the means\
    \ to measure availability and performance, and hence evaluate service-level agreements\
    \ between providers and consumers. This chapter talks about monitoring OSB proxy\
    \ and business services. Specifically, this chapter talks about:\n\n- Challenges\n\
    - Solution\n- Step-by-step exercises:\n  - Creating an OSB infrastructure service\n\
    \  - Navigating to the OSB proxy service home page\n  - Creating the OSB proxy\
    \ aggregate service\n  - Creating a SOAP test to monitor a OSB proxy service endpoint\n\
    \  - Creating a SOAP test to monitor a OSB business service endpoint\n  - Testing\
    \ the SOAP tests\n\n### Challenges\n\nFor any small, medium, or large enterprise,\
    \ it's a challenge to monitor several disparate application, middleware, and database\
    \ targets from a single console. The traditional hardware and software components\
    \ such as servers, storage devices, operating systems, databases, middleware,\
    \ and applications have been monitored by system management solutions. With the\
    \ rise of integration software such as BPEL and OSB, applications and infrastructure\
    \ pose new problems. First, they need to be monitored along with existing hardware\
    \ and software. Second, as the WebLogic domains and OSB projects proliferate across\
    \ the enterprise, the infrastructure team is faced with increasing problems to\
    \ manage these projects. Thirdly, for the administrators who are new to OSB, supporting\
    \ these environments in production poses unknown challenges. Finally, the IT managers\
    \ want to avoid hiring new administrators with increasing OSB projects.\n\n###\
    \ Solution\n\nGrid Control provides monitoring capabilities for WebLogic and OSB\
    \ components whether it is in development, test, stage, or production. For the\
    \ infrastructure team, this is a convenient way to monitor several installations\
    \ from one console. Once the Grid Control agent is installed on the server hosting\
    \ WebLogic Admin Server, the discovery process can be initiated from the console.\
    \ Post discovery, the infrastructure components and OSB services can be monitored\
    \ from Grid Control.\n\n### Step-by-step exercises\n\nThis set of step-by-step\
    \ exercises will walkthrough monitoring proxy and business services.\n\n### Creating\
    \ an OSB Infrastructure Service\n\nThe OSB infrastructure service provides a useful\
    \ grouping to monitor relevant OSB and WebLogic components as a whole. Grid Control\
    \ takes care of identifying the relationships among the infrastructure components\
    \ and putting them in one bucket.\n\n1. From the Grid Control home page, click\
    \ on **Targets** | **Middleware**.\n2. Expand the WebLogic Server Domain target\
    \ of your choice and click on the OSB target.\n3. From the OSB target home page,\
    \ click on the **Create Infrastructure Service** button.\n\n4. On the Create Service\
    \ page, enter a Service Name such as osb_infra and click on OK, as shown in the\
    \ following screenshot:\n\n![](img/7529bbd615e859608c21b965162348b2_217_0.png)\n\
    \n5. You should get a confirmation message. Click on OK.\n\n> The infrastructure\
    \ service encapsulates the key underlying logical components of the OSB instance.\
    \ For the OSB instance and services to work smoothly, the underlying infrastructure\
    \ must work smoothly as well. Observe the newly created system and service, status\
    \ of system and service, alerts, and policy violations.\n\n### Navigating to the\
    \ OSB proxy service home page\n\nProxy services perform the heavy lifting for\
    \ the OSB. They are created to validate, enrich, and transform messages coming\
    \ into the service bus. It is extremely important for the administrator to have\
    \ visibility and understanding of the OSB proxy services.\n\n1. From the OSB target\
    \ home page, click on the OSB Services tab.\n\n> All the OSB services deployed\
    \ on the server are automatically discovered and displayed here. Summary throughput\
    \ process instance information is also displayed in the table. These metric values\
    \ are collected at a frequency controlled by the \"Collection Interval\" directly\
    \ from the OSB server and stored in the Grid Control metric repository. It is\
    \ possible to drill down on any metric to view trends for different functions\
    \ such as minimum, maximum, or average values over a specific time range.\n\n\
    ![](img/7529bbd615e859608c21b965162348b2_218_0.png)\n\n2. Click on any of the\
    \ deployed proxy services within a project, for example, loanGateway3 proxy service\
    \ under the MortgageBroker project.\n\n> This is the individual OSB proxy service\
    \ page. Note the proxy specific instance throughput graph. At the bottom, note\
    \ that all the references for the proxy are discovered along with the business\
    \ services, endpoints, protocols, load-balancing algorithms, weight, and so on.\n\
    \n### Creating the OSB proxy aggregate service\n\nAn aggregate service is a useful\
    \ structural entity in Grid Control to provide a relationship and hierarchy among\
    \ OSB proxy, business, and infrastructure services. When troubleshooting a problem,\
    \ it is useful not only to know the state of a proxy service, but also the state\
    \ of the supporting infrastructure.\n\n1. From the OSB proxy page, under EM Services\
    \ click on the Create Service button.\n2. Notice the confirmation message, and\
    \ the aggregate service that has been added.\n"
