  mdcn: "\n> Beacon 是已配置为发出合成测试以测试网站、Web 服务、邮件服务器、FTP 站点等的主机。Beacon 通常安装在防火墙外部，用户从该位置访问网站或\
    \ Web 服务。因此 Beacon “模拟” 终端用户行为并主动通知管理员网站或 Web 服务的任何问题。您可以在 Oracle Technology Network\
    \ 上的 Grid Control 文档中阅读有关 Beacon 和服务管理的更多信息—http://otn.oracle.com。\n\n![](img/7529bbd615e859608c21b965162348b2_46_0.png)\n\
    \n- 11. 单击 **确定** 以保存 SOAP 测试和 Beacon 设置。\n- 12. 验证可用性流程创建并查看 SOAP 测试。在 BPEL 流程主页上，注意自动创建的可用性通用服务。\n\
    - 13. 展开流程可用性服务。例如，**SOAOrderBooking(v1.0)_availability**，并验证您刚刚创建的 SOAP 测试，例如\
    \ **SelectService_test**，是否已添加。\n\n> BPEL 流程的可用性服务是在创建第一个 SOAP 测试时形成的。请注意每个测试的状态，以及如何汇总（可配置）以确定流程可用性。SOAP\
    \ 测试的状态显示需要一些时间，具体取决于为测试设置频率。\n\n![](img/7529bbd615e859608c21b965162348b2_47_0.png)\n\
    \n## 创建 SOAP 测试以监控 BPEL 流程\n\n与通过合成检查监控合作伙伴链接类似，整体 BPEL 流程也可以以相同方式进行监控。BPEL 流程通常由\
    \ SOAP 客户端调用。可以按所需频率对其进行测试，以确保客户端始终可以实例化 BPEL 流程：\n\n- 1. 转到 BPEL 流程主页。\n- 2.\
    \ 向下滚动并在 Partner Links 部分中找到客户端的单选按钮。\n\n## BPEL 流程监控\n\n- 3. 单击 **添加 SOAP 测试**\
    \ 以为客户端创建 SOAP 测试，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_48_0.png)\n\
    \n- 4. 将所需端口类型选择为 **SOAOrderBookingPort**。\n- 5. 将输入参数的单选按钮选择为 **XML 源**。\n- 6.\
    \ 输入 SOAP 信封，包括任何头信息。您可以从现有的 BPEL 实例（来自 BPEL Control）复制此 SOAP 信封。复制并粘贴输入 XML 源中提供的\
    \ SOAP 有效负载。\n\n![](img/7529bbd615e859608c21b965162348b2_49_0.png)\n\n- 7. 单击\
    \ **确定** 完成客户端测试的创建。\n- 8. 查看确认消息。\n- 9. 展开可用性服务以查看 SOAP 测试。\n\n![](img/7529bbd615e859608c21b965162348b2_49_1.png)\n\
    \n## 测试 SOAP 测试\n\n应该有一种方法来跟踪 SOAP 测试的历史可用性和性能，并在通过阈值偏离正常行为时发出警报。当警报触发时，值班人员必须测试报告的问题是否仍然存在。即时按需测试是实现此目标的好方法。\n\
    \n- 1. 单击您创建的其中一个 SOAP 测试。测试页面显示测试可用性、运行此测试的 Beacon 以及与此测试关联的警报。以下图表显示了来自 Beacon\
    \ 的测试响应时间：\n- 2. 单击“验证服务测试”按钮。\n- 3. 单击“执行测试”以即时运行测试并查看结果。\n\n![](img/7529bbd615e859608c21b965162348b2_50_0.png)\n\
    \n> 可以使用一个或多个 Beacon 来测试服务，可能来自模拟用户群的多个地理位置。这对于衡量终端用户体验的可用性和响应时间很有用。它可用于主动以及被动地复制用户报告的问题。\n\
    \n![](img/7529bbd615e859608c21b965162348b2_51_0.png)\n\n这完成了从 Grid Control 设置和查看\
    \ BPEL 流程监控的分步练习。\n\n## 摘要\n\n监控是保证企业关键业务流程健康的关键。在本章中，我们研究了如何使用合成测试监控合作伙伴链接和 BPEL\
    \ 流程。特别是，我们研究了监控 BPEL 流程相关的挑战，以及 Grid Control 提供的解决方案。\n\n我们研究了开箱即用的基本 BPEL 流程监控。此外，我们能够设置特定的主动检查来测试\
    \ BPEL 流程的可用性和性能。这些合成检查能够根据预设阈值通知管理员。此外，管理员能够按需运行这些合成检查并查看结果。\n\n主动监控可以避免与这些业务流程交互的终端用户失去信任。有时防火墙内部一切正常，但终端用户仍无法访问这些流程。在这种情况下，必须在防火墙外部放置一个代理，以确保用户行为可以频繁复制，并且管理员可以收到通知。在大多数情况下，这些代理会在终端用户之前通知管理员。\n\
    \n下一章将逐步介绍动手练习，以设置并执行 BPEL 基础设施的额外管理任务，例如 BPEL 流程管理器服务器、应用服务器、数据库和主机。\n\n## 4\n\
    \n## BPEL 基础设施管理\n\nBPEL 安装涉及多个软件组件。对于基本单节点安装，有四个组件。第一个是脱水数据库，它持久保存 BPEL 元数据和\
    \ BPEL 实例信息，包括当前正在执行的实例（“in-flight” 实例）。第二个组件是为 BPEL 提供平台的应用服务器。BPEL 支持 Oracle\
    \ WebLogic Server、Oracle Application Server、IBM WebSphere 和 JBoss。应用服务器由各种组件组成，例如\
    \ **Java 虚拟机** (**JVM**) 和 Web 服务器。最新的应用服务器平台认证列表可在以下位置找到：\n\n```\nhttp://www.oracle.com/technology/software/products/ias/files/oracle_soa_certification_101310.html.\n\
    ```\n\n第三个组件是 BPEL PM 服务器本身，它从根本上是一个 Java 应用程序。该应用程序作为 SOA Suite 安装的一部分与 Oracle\
    \ Application Server 打包在一起。最后一个组件是托管应用服务器和数据库的硬件服务器和操作系统。\n\n作为集成产品，BPEL 协调驻留在其他基础设施（不同于其自身基础设施）上的服务。这为负责支持\
    \ BPEL 编排及其相关故障的管理员带来了噩梦。\n\n监控 BPEL 和扩展的基础设施对于 IT 保持可见性、收到通知并快速解决问题非常重要。本章讨论通过监控、查看配置更改和最佳实践策略违规来管理\
    \ BPEL 基础设施。具体来说，本章讨论：\n\n- 挑战\n- 解决方案\n- 分步练习：\n  - 创建 BPEL 基础设施服务\n  - 查看 BPEL\
    \ 基础设施服务\n  - 查看系统警报和策略\n  - 查看配置更改\n  - 查看关键系统指标\n  - 查看管理任务\n  - 查看系统组件\n  -\
    \ 查看系统仪表板\n\n## 挑战\n\n关键业务流程通常会因依赖的基础设施故障而中断。管理员很难同时管理 BPEL 基础设施和其他现有基础设施系统。由于\
    \ BPEL 流程通过在数据库中不断存储状态来脱水，因此数据库中的任何中断或性能问题都会影响 BPEL 的脱水和再水合。还有其他基础设施组件，例如 Web\
    \ 服务器、应用服务器和主机，这些组件需要正常运行才能使 BPEL 流程顺利运行。没有 BPEL 知识或培训的管理员可能不了解关键的基础设施组件是什么或如何管理它们。此外，与基础设施组件相关的最佳实践可能未知或难以实施。SOX\
    \ 和 COBIT 标准已成为 IT 管理员必须了解、实施和监控的重要标准。\n\n"
