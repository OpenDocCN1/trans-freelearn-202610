    ## About the Author


    **Narayan Bharadwaj** (aka Nadu) has dabbled in several different areas of the
    business software market. He has more than a decade of experience working in disparate
    technologies such as service-oriented architecture, systems management, and everything
    in between. Other technology areas include cloud computing, database, middleware,
    and IT management software. While dabbling in these technologies, Narayan wore
    several hats—from software consultant, database administrator, application developer,
    to product manager. Prior to these gigs, he went to school at the University of
    Maryland, and the Indian Institute of Technology, Kharagpur, to pursue various
    technical degrees. Thinking this was not good enough, he added an MBA from the
    Haas School of Business at the University of California, Berkeley.


    Narayan spent close to a decade at Oracle USA Inc at Redwood Shores, CA, where
    he was the group product manager for management of middleware and service-oriented
    architecture products. During his stint at the Application and Systems Management
    Products division, Narayan led the charge into new markets such as real-user monitoring,
    Java application diagnostics, middleware management, and service-oriented architecture
    management. This included key acquisitions such as Moniforce, ClearApp, and AmberPoint.
    More recently, Narayan has moved to the clouds in San Francisco, leading Salesforce.com''s
    platform strategy and execution with respect to cloud management and cloud data
    analytics. He lives in San Mateo, CA, with his wife and two-year-old son.


    When he is not commuting to work, pursuing degrees, or wearing different hats,
    Narayan loves to wield a racket on a badminton or tennis court, spike a volley
    ball, or run the half marathon once in a long while.


    > I am constantly inspired by the two women in my life—my mother and my wife.
    Thank you for being there for me.


