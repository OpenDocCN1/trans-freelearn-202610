    ![](img/7529bbd615e859608c21b965162348b2_122_1.png)


    - 11. 将 MaxPermSize 值从 126M 改为 256M。


    ![](img/7529bbd615e859608c21b965162348b2_123_0.png)


    - 12. 单击“应用”以保存更改。注意确认消息。

    - 13. 单击“集群拓扑”面包屑。

    - 14. 选中 oc4j_soa 旁边的复选框。

    - 15. 单击“重启”按钮以重启此 oc4j 容器，使更改永久生效。


    ![](img/7529bbd615e859608c21b965162348b2_123_1.png)


    - 16. 单击**是**以重启 oc4j_soa。注意确认消息。

    - 17. 重启完成后退出 EM Application Server 控制。您现在已成功对应用服务器属性进行了一些更改。


    ## 与已保存的基线比较当前的 BPEL 配置


    比较是检测两个或多个目标之间配置差异的有用方法。观察配置的相似性很有用，更重要的是，在出现性能问题或为标准化目的时观察差异。


    - 1. 导航到 BPEL 目标主页。

    - 2. 单击**管理**选项卡。

    - 3. 单击**上次收集的配置**。

    - 4. 单击**刷新**按钮以获取最新的配置更新并等待一段时间。

    - 5. 单击**比较**按钮，开始对 BPEL 目标的当前配置与已保存的（生产基线）配置进行比较。


    ![](img/7529bbd615e859608c21b965162348b2_124_0.png)


    - 6. 单击**已保存的配置**链接。


    - 7. 选择 GCSOA_<date>_BPEL_Baseline 进行比较。

    - 8. 单击比较以生成比较结果。


    ![](img/7529bbd615e859608c21b965162348b2_125_0.png)


    - 9. 查看与已保存基线的 BPEL 目标比较结果。

    - 10. BPEL 目标之间的比较结果分为四个类别显示。摘要选项卡列出了四个类别的状态。


    ![](img/7529bbd615e859608c21b965162348b2_125_1.png)


    ## BPEL 配置管理


    - 11. 单击“流程管理器”选项卡。流程管理器选项卡列出了目标的一般参数的差异或相似性，包括脱水存储和集群参数。


    ![](img/7529bbd615e859608c21b965162348b2_126_0.png)


    - 12. 单击“域”选项卡。域选项卡列出了两个目标中的各个域。


    ![](img/7529bbd615e859608c21b965162348b2_126_1.png)


    - 13. 单击“结果”列中的不等号以查看差异。


    ![](img/7529bbd615e859608c21b965162348b2_127_0.png)


    - 14. 单击“比较 BPEL 流程管理器”面包屑。


    - 15. 单击“流程”选项卡。流程选项卡比较所有已部署的流程。流程内的底层文件将被比较。


    - 16. 单击“配置文件”选项卡，其中列出了文件比较的结果。


    ![](img/7529bbd615e859608c21b965162348b2_127_1.png)


    ## BPEL 配置管理


    - 17. 单击“结果”列中的不等号以查看文件大小和修改时间的差异。


    ![](img/7529bbd615e859608c21b965162348b2_128_0.png)


    - 18. 单击浏览器的“后退”按钮。


    - 19. 单击“比较文件内容”。


    - 20. 在比较文件内容页面上查看文件之间的差异。


    ![](img/7529bbd615e859608c21b965162348b2_128_1.png)


    ## 比较同一流程的 BPEL 流程版本


    Grid Control 可以为不同类型的目标提供目标比较。BPEL 世界中更有趣的比较之一是比较 BPEL 流程的连续版本，或不同环境中的类似 BPEL
    流程。Grid Control 使管理员或开发人员能够做到这一点，从而协助变更管理和影响分析。


    - 1. 在当前场景中，我们将在同一服务器上比较同一 BPEL 流程的两个版本。

    - 2. 单击“比较 BPEL 流程管理器”面包屑。

    - 3. 单击“流程”选项卡。


    ![](img/7529bbd615e859608c21b965162348b2_129_0.png)


    > 注意两个目标之间流程的差异。您可以看到 FlowSample、AmericanLoan 和 UnitedLoan 的 BPEL 流程有更新的版本。


    - 4. 单击 FlowSample 流程的大于号。

    - 5. 这会带您进入比较流程页面，您可以在此比较流程的不同版本。


    ## BPEL 配置管理


    - 6. 从“版本”下拉列表中为同一流程选择两个不同的版本。

    - 7. 单击“比较文件内容”，如下图所示：

    - 8. 注意这些流程底层文件的差异。


    ![](img/7529bbd615e859608c21b965162348b2_130_0.png)


    ![](img/7529bbd615e859608c21b965162348b2_130_1.png)


    - 9. 通过向下滚动，您可以看到流程的 1.2 版本中添加了一个额外部分。


    ## 与已保存的基线比较当前的 Oracle 应用服务器配置


    同样的方法也可以用于 Oracle 应用服务器目标：


    - 1. 导航到 Oracle Application Server 目标的主页。

    - 2. 选择**目标**选项卡，然后选择**应用服务器**子选项卡。

    - 3. 单击应用服务器名称的链接，例如 **soademo.gcsoa.us.oracle.com**，以进入应用服务器主页。

    - 4. 单击**管理**选项卡。

    - 5. 单击**上次收集的配置**。

    - 6. 单击**刷新**按钮以获取最新的配置更新。

    - 7. 单击**比较**按钮，开始对应用服务器目标的当前配置与已保存的（生产基线）配置进行比较。


    ![](img/7529bbd615e859608c21b965162348b2_131_0.png)


    - 8. 单击**已保存的配置**链接。

    - 9. 选择 **GCSOA_<date>_AS_Baseline** 进行比较。


    - 10. 单击**比较**以生成比较结果。


    ![](img/7529bbd615e859608c21b965162348b2_132_0.png)


    ## 查看与已保存基线的应用服务器目标比较结果


    一旦启动比较，相似之处和差异就可以在 Grid Control 用户界面上观察到：


    - 1. 应用服务器目标之间的比较结果分为四个类别呈现。**摘要**选项卡列出了四个类别的状态。


    ![](img/7529bbd615e859608c21b965162348b2_133_0.png)


    - 2. 单击“常规”选项卡以查看关键参数值以及与基线的更改。


    ![](img/7529bbd615e859608c21b965162348b2_133_1.png)


    - 3. 单击“J2EE 应用程序”选项卡以查找任何更改。


    ![](img/7529bbd615e859608c21b965162348b2_134_0.png)


    - 4. 单击“配置文件”选项卡以查找配置文件的关键更改。


    - 5. 单击不等号旁边的单选按钮。


    ![](img/7529bbd615e859608c21b965162348b2_134_1.png)


    - 6. 单击**比较文件内容**以查看与基线版本的实际更改。


    ![](img/7529bbd615e859608c21b965162348b2_135_0.png)


    - 7. 观察 **MaxPermSize** 的更改。


    ![](img/7529bbd615e859608c21b965162348b2_135_1.png)


    ## 摘要


    配置管理对于管理员控制环境中的变更以及排除与配置更改相关的故障至关重要。借助 Grid Control 的配置管理功能，管理员可以管理变更并减少排除故障所需的时间。


    在本章中，我们讨论了配置管理以及它如何应用于 BPEL PM 和应用服务器目标。我们讨论了两种目标类型的配置概述，查看了最新的配置信息，并将参考“黄金”配置快照保存到
    Grid Control 仓库。然后，我们通过各个产品控制台进行了一些配置更改。在 Grid Control 中观察这些更改以及将其与“黄金”标准进行比较是相当简单的。此外，比较
    BPEL 流程版本并注意连续版本之间的更改也很有用。


    配置管理已通过 Enterprise Manager 收购了两个新产品而得到扩展，即 **配置更改控制台 (CCC)** 和 **应用程序更改控制台 (ACC)**。借助这两个产品，管理员可以主动查看发生的更改，以及回滚和向前回滚到所需的配置。


    接下来的几章将介绍 SOA Suite 的配置和克隆。

    '
