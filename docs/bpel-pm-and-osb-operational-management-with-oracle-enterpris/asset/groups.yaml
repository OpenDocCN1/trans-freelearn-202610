    the following screenshot:


    ![](img/7529bbd615e859608c21b965162348b2_48_0.png)


    4. Select the desired port type as **SOAOrderBookingPort**.


    5. Select the radio button for the input parameters as **XML Source**.


    6. Enter the SOAP envelope, including any headers. You can copy this SOAP envelope
    from existing BPEL instances (from the BPEL Control). Copy and paste the SOAP
    payload provided in the input XML source.'
