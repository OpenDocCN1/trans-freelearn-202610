  mdcn: '

    ## 解决方案


    Grid Control 监控 BPEL 基础设施组件的可用性。目标（如 BPEL PM 服务器）的当前和历史可用性都会被记录下来以便进行故障排除和根本原因分析。BPEL
    基础设施系统和服务的可用性也会被记录。管理员可以在任何组件宕机时收到通知，或事后通过拓扑图进行故障排除，以了解导致服务故障的组件。通过允许管理员“集中管理”，大量组件的管理得以显著简化。通过将
    BPEL 相关目标组合到系统中，管理员可以受益于丰富的系统管理功能，例如通过系统监控仪表板主动监控可用性的能力。管理员可以查看有助于 SOX 和 COBIT
    合规性的运营最佳实践策略违规情况。


    ## 分步练习


    本套分步练习将演示 BPEL 进程主页的发现过程，以及为进程和合作伙伴链接设置监控。


    ## 创建 BPEL 基础设施服务


    创建基础设施组件的逻辑表示是设置有效监控的第一步。Grid Control 帮助管理员了解基础设施组件之间的关系。


    - 1. 在 BPEL 目标页面上，单击“创建 BPEL 基础设施服务”按钮。

    - 2. 在“创建服务”页面上，输入服务名称并单击“确定”，如下图所示：


    ![](img/7529bbd615e859608c21b965162348b2_56_0.png)


    ![](img/7529bbd615e859608c21b965162348b2_56_1.png)


    - 3. 您应收到一条确认消息。单击“确定”。


    > 观察新创建的系统和服务、系统和服务状态、警报以及策略违规情况。


    ## 查看 BPEL 基础设施服务


    基础设施服务创建后，查看并了解服务的底层组件很有用。


    - 1. 导航到 BPEL 目标主页。

    - 2. 在“系统和服务”部分下，单击“系统”。


    > 这是系统主页。请注意显示系统组件状态的饼图。请注意右侧的警报、策略违规和安全策略违规。这些已汇总到所有系统组件。请观察依赖于此系统的服务、其状态、警报、违规等。在底部，请观察系统组件的最新配置更改。


    ## 查看系统警报和策略


    Grid Control 监控各个系统组件并跟踪组件的所有警报以及不同类型的策略违规。


    - 1. 在系统主页上，单击“警报历史记录”按钮。请注意每个系统组件的警告和严重警报历史记录。


    ![](img/7529bbd615e859608c21b965162348b2_57_0.png)


    ## BPEL 基础设施管理


    - 2. 单击“系统”面包屑返回系统主页。

    - 3. 单击当前的严重（红色叉号）或警告（黄色三角形）数字。


    ![](img/7529bbd615e859608c21b965162348b2_58_0.png)


    - 4. 请注意不同目标类型的警报。请注意下拉菜单，可用于查看当前警报以及历史警报。

    - 5. 查看系统的策略（最佳实践）。


    > Enterprise Manager 策略是一种运营最佳实践，可确保基于 Oracle 最佳实践对 Oracle 目标进行适当监控。数据库安全策略的一个例子是
    SYSTEM 密码必须每三个月更改一次。如果未执行此操作，代理将标记违反此策略的数据库目标。开箱即用的 Grid Control 监控了超过 300 条针对数据库、应用服务器和应用程序的策略。在
    Grid Control 10.2.0.5 中，还可以将自定义策略添加到库中并附加到目标。


    - 6. 使用面包屑导航到系统主页。

    - 7. 在“策略违规”部分下，单击违规计数。

    - 8. 请注意系统组件的不同 Oracle“最佳实践”违规情况。


    ![](img/7529bbd615e859608c21b965162348b2_59_0.png)


    - 9. 单击策略规则以获取有关“最佳实践”的更多信息。

    - 10. 使用浏览器后退按钮两次导航到系统主页。

    - 11. 在“策略违规”部分下，单击“策略趋势概览”。

    - 12. 请注意三个策略类别的趋势概览数据。


    ![](img/7529bbd615e859608c21b965162348b2_59_1.png)


    ## 查看配置更改


    Grid Control 为其所有受管目标收集配置信息。这对管理员理解和排查与基础设施更改相关的问题非常有帮助。


    - 1. 单击 *系统* 面包屑前往系统主页。

    - 2. 在 **配置更改** 部分下，单击 **所有目标类型**。

    - 3. 查看所有系统组件的 **配置历史记录** 部分。


    > 请注意所有系统组件的更改；深入到特定目标类型以查看更改。稍后有专门的配置管理章节。


    ![](img/7529bbd615e859608c21b965162348b2_60_0.png)


    ## 查看关键系统指标


    Grid Control 的默认系统视图捕获系统的关键指标并将其显示给管理员。


    - 1. 单击 Web 浏览器上的后退按钮返回系统主页。

    - 2. 单击“图表”子选项卡。


    > 请注意本页上绘制的系统组件的关键指标。提供了一个下拉菜单来更改图表的时间范围。本页上显示的指标集是可配置的。


    ![](img/7529bbd615e859608c21b965162348b2_61_0.png)


    ## 查看管理任务


    管理员可以从 Grid Control 启动其他多个管理任务。


    - 1. 单击“管理”选项卡。


    > 请注意系统组件的 **作业活动**，以及可直接从本页启动的其他管理任务。


    ![](img/7529bbd615e859608c21b965162348b2_62_0.png)


    ## 查看系统组件


    查看系统组件可让管理员确定系统的一部分是什么，以及什么会影响系统的整体可用性。


    - 1. 单击 **组件** 选项卡。


    > 本页显示此系统的所有组件。系统组件可用性之间的“与”或“或”关系决定了系统本身的可用性。


    ![](img/7529bbd615e859608c21b965162348b2_63_0.png)


    ## 查看系统仪表板


    系统仪表板是网络操作中心分析师查看系统组件当前状态及其关键指标的有用工具。


    - 1. 单击右上角的 **启动仪表板**。


    > 系统仪表板一目了然地显示系统组件的状态和关键指标。如果有任何警报，也会显示在底部。这对于有兴趣查看关键系统组件、其状态和停机信息的 IT 经理来说是一个有用的视图。


    ![](img/7529bbd615e859608c21b965162348b2_64_0.png)


    ## 总结


    有效监控 BPEL 基础设施对于 SOA 项目的成功至关重要。Enterprise Manager 提供了使用现有基础设施组件有效监控 BPEL 基础设施组件的方法。我们研究了基本挑战、解决方案以及解决不同领域的分步练习。特别是，我们创建了
    BPEL 基础设施服务并查看了该服务、其底层系统和组件，以及警报、指标和配置更改。最后，我们在系统仪表板中查看了系统组件。


    了解关键组件并创建系统来表示它们是实现系统管理的第一关键步骤。这使 IT 部门能够监控、管理更改并实施最佳实践策略以符合 SOX 和 COBIT 标准。


    接下来的几章将逐步介绍动手练习，以设置并执行 BPEL 进程和 BPEL 基础设施的额外服务级管理任务。

    '
