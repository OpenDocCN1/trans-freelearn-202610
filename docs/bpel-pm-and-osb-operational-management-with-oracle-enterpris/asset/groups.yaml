    # 14


    # WebLogic and OSB

    Configuration Management


    Managing the configurations of middleware environments is a difficult proposition
    for medium and large enterprises. "Knowing what you have" enables IT managers
    to make decisions about future investments and retiring old assets, standardize
    existing assets, manage change across the enterprise, and troubleshoot performance
    problems related to configurations.


    Most configuration management solutions today are compliant with the best practices
    laid out by the **IT Information Library (ITIL)** framework. All the assets are
    stored in a central repository called the **Configuration Management Database
    (CMDB)**. Configuration parameters such as instance parameters for a database,
    or start up parameters for a WebLogic application server, or port numbers for
    an HTTP server are stored in the CMDB. Any changes to these parameters are also
    tracked. It then becomes easy to audit the changes for a specific asset, compare
    assets to each other (for example, Managed Server 1 and Managed Server 2), compare
    different versions of the same asset, save a reference configuration to the CMDB,
    and use that to standardize across the enterprise. This chapter talks about managing
    configurations for a WebLogic and OSB environment. Specifically, this chapter
    talks about:


    +   - Challenges

    +   - Solution

    +   - Step-by-step exercises:

    +     - Viewing a WebLogic managed server configuration

    +     - Saving a managed server configuration snapshot

    +     - Viewing and saving an OSB configuration

    +     - Comparing the current OSB configuration with a saved baseline

    +     - Comparing the current managed server configuration with a saved baseline'
  - '[PAGE 228]


    # Challenges


    It is difficult to track the configurations of all IT systems. Often, IT departments
    resort to Excel spreadsheets to store critical middleware configuration information.
    This makes an IT department slow in making changes, measuring impact, identifying
    performance problems due to incorrect configuration, and increases costs of managing
    a data center. With a WebLogic and OSB environment, it is difficult to maintain
    configurations for multiple domains, and underlying configurations. For a medium-to-large
    WebLogic installation, it is important to baseline a working configuration and
    compare it with non-working ones for department or enterprise-wide customization.
    For OSB, there is the additional challenge of maintaining the proxy and business
    service configurations over different project versions. In the absence of control
    over configurations, it is difficult to assess the production impact for new project
    versions, as well as troubleshoot production problems that might be associated
    with configuration changes.


    # Solution


    With Grid Control, key configuration metrics for WebLogic and OSB server processes
    are collected and stored in the Enterprise Manager repository. Administrators
    can view the historic configuration changes across the WebLogic and OSB environment.
    They can also baseline a working configuration by saving it in the repository.
    A WebLogic Admin, Managed Server, and OSB server configuration parameters can
    be compared with other servers. Finally, OSB project versions can also be compared
    to observe the changes and assess impact across successive deployments.


    # Step-by-step exercises


    This set of step-by-step exercises will walkthrough managing configurations for
    the WebLogic and OSB server targets.


    # Viewing a WebLogic managed server configuration


    During a reactive troubleshooting exercise (typically associated with a monitoring
    alert), one of the first questions that an administrator asks is "what changed?"
    Before even viewing the changes, it is useful to look at the current configuration
    of the system to determine if there are any obvious wrong settings:


    +   1. Navigate to the **Targets | Middleware** tab.

    +   2. Click on the **Oracle WebLogic Managed Server** link.'
