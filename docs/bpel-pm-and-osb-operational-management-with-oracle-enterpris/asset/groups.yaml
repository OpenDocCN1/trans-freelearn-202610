    # Summary


    Deployment is a critical task for WebLogic administrators. With Grid Control Software
    Library and deployment procedure capabilities, administrators can manage WebLogic
    and OSB projects, and schedule and automate deployment.


    In this chapter, we covered the various administrative challenges dealing with
    application code deployments such as OSB project deployments. Grid Control automates
    the deployment process for the administrator, thereby saving time and reducing
    human errors. First we took a look at the Grid Control Software Library, then
    we uploaded the new OSB projects to this library, and then we kicked off the actual
    deployment procedure. Finally, we looked at the execution of the deployment procedure
    job, and validated the completion and successful deployment via the OSB console.


    The next few chapters will walkthrough managing other areas in OSB such as monitoring
    services, managing configurations, and service levels.'
