    ![](img/7529bbd615e859608c21b965162348b2_180_1.png)


    - 9. Click on the Place Order button. Click on the Orders tab to view orders submitted.
    Click on the logout link and after going back to the login page, close the browser
    window.


    - 10. On the Record Web Transaction page, click on Continue, as you have completed
    the recording of the transaction, as seen in the following screenshot:


    ![](img/7529bbd615e859608c21b965162348b2_181_0.png)


    - 11. You will be taken to the Success Strings Suggestion page.


    ![](img/7529bbd615e859608c21b965162348b2_181_1.png)


    ## Adding Beacons to run the Service Test


    Once the web transactions have been created, we need to set up the agents or Beacons
    to fire these transactions so that Grid Control can record and report on the transaction
    metrics:


    - 1. Click on **Continue** to review the Service Test.


    ![](img/7529bbd615e859608c21b965162348b2_182_0.png)


    - 2. Click on **Continue** once again.


    ![](img/7529bbd615e859608c21b965162348b2_182_1.png)


    - 3. Click on Next to now select the Beacon.


    > Beacons are Grid Control agents configured to emulate end-user behavior by running
    recorded Service Tests. Frequently, these are deployed outside the firewall to
    test applications from an end-user perspective. Beacons are deployed where users
    are located, typically one per geographical segment. Beacons help to break down
    the end-user time into network time and server time, which helps to isolate user-related
    problems.


    ![](img/7529bbd615e859608c21b965162348b2_183_0.png)


    - 4. Click on Add and then select the Beacon, as shown in the following screenshot:


    ![](img/7529bbd615e859608c21b965162348b2_183_1.png)


    - 5. Click on Select.


    ![](img/7529bbd615e859608c21b965162348b2_184_0.png)


    ## Adding performance and usage metrics


    As Grid Control collects several metrics for a web transaction, you can specify
    specific metrics to be included in the performance and usage buckets:


    - 1. Continuing from the previous step, click on Next to now define Performance
    Metrics.


    ![](img/7529bbd615e859608c21b965162348b2_184_1.png)


    - 2. Select Add as Based on Service Test and click on Go.


    - 3. Select Metric as Transfer Rate (KB per second) and click on Continue, as
    shown in the following screenshot:


    ![](img/7529bbd615e859608c21b965162348b2_185_0.png)


    - 4. Enter a Warning Threshold of 6000 and a Critical Threshold of 12000. You
    can add additional metrics similarly. Then click on Next, as shown in the following
    screenshot:


    ![](img/7529bbd615e859608c21b965162348b2_185_1.png)


    - 5. You will now be taken to the Usage Metrics screen, as seen in the next screenshot.
    Usage metrics measure user demand for your service. You can define usage metrics
    based on the metrics of one or more system components. Once you''ve added metrics,
    you can define thresholds, which, when exceeded, will generate alerts. You can
    also select the metric whose graph you want to show in the home page for this
    service.


    ![](img/7529bbd615e859608c21b965162348b2_186_0.png)


    - 6. You can select from a number of target types. For each target type, you can
    select from a large number of available metrics.


    - 7. For example let''s select Target Type as Oracle HTTP Server and select the
    metric Percentage of Requests that Were Failures


    ![](img/7529bbd615e859608c21b965162348b2_187_0.png)


    - 8. Click on the flashlight for the object and then select Mount Point as /soademo.


    ![](img/7529bbd615e859608c21b965162348b2_187_1.png)


    ## Web Application Monitoring


    - 9. On clicking Select, you will see the page shown in the following screenshot:


    ![](img/7529bbd615e859608c21b965162348b2_188_0.png)


    - 10. Click on Continue and then provide a Warning Threshold of 10 and a Critical
    Threshold of 20.


    ![](img/7529bbd615e859608c21b965162348b2_188_1.png)


    - 11. Click on Next to review all the selections made so far and then click on
    Finish.


    ![](img/7529bbd615e859608c21b965162348b2_189_0.png)


    - 12. You have now successfully added the web application with the appropriate
    recorded service tests, as well as performance and usage metrics.


    ![](img/7529bbd615e859608c21b965162348b2_189_1.png)


    ## Viewing web transaction playback


    After recording the transaction, it is useful to view what has been recorded for
    verification.


    - 1. To view the recorded Service Test transaction, click on **Targets**, then
    on the **Web Applications** tab.

    - 2. Click on the **SOA OrderBooking Client** application.


    ![](img/7529bbd615e859608c21b965162348b2_190_0.png)


    - 3. In the **Key Test Summary** section, click on **Order Submission Test**.
    Observe the historic performance of submitting orders on the **SOA OrderBooking**
    web application as experienced by end users. Now click on **Play** to run the
    recorded transaction.


    ![](img/7529bbd615e859608c21b965162348b2_191_0.png)


    - 4. Observe the recorded transaction in the pop-up window.


    ![](img/7529bbd615e859608c21b965162348b2_191_1.png)


    ## Web Application Monitoring


    - 5. Observe the results of the test and the time breakdown for each component.


    ![](img/7529bbd615e859608c21b965162348b2_192_0.png)


    ![](img/7529bbd615e859608c21b965162348b2_192_1.png)


    ## Summary


    Recording and monitoring critical end-user paths is a proactive approach to increasing
    end-user satisfaction. In a global economy, enterprises need to ensure users can
    get the information they want, when they want it, from anywhere in the world.
    A management solution is incomplete without a synthetic monitoring strategy.


    In this chapter, we discussed how to create web applications, record web transactions,
    and use specific metrics for performance and usage purposes. Further, we also
    discussed how to configure running these synthetic transactions from various agents
    or Beacons. Finally, we discussed how to view a web transaction to review and
    verify all the steps.


    Synthetic service-test monitoring within Grid Control is complemented by passive
    real-user monitoring. Enterprise Manager''s Real User Experience Insight (from
    the Moniforce acquisition) is a great tool in this area. More information on Real
    User Experience Insight can be found on the Oracle Technology Network.

