    \ view the operational store or the Software Library in Grid Control. This is\
    \ the starting point for administrators to look at the inventory, add items, or\
    \ change existing items.\n\n1. From the Grid Control home page, click on the **Deployments**\
    \ tab.\n2. Click the **Provisioning** sub-tab.\n3. Expand **Components** to reveal\
    \ the component types.\n\n> The Software Library contains several objects such\
    \ as operating system images, Oracle homes for database and application server,\
    \ and deployment artifacts for BPEL, OSB, and so on. The Library is used to track\
    \ the maturity of these components as they are used on various monitored targets.\n\
    \n![](img/7529bbd615e859608c21b965162348b2_203_0.png)\n\n## Uploading projects\
    \ to the Software Library\n\nIn this particular scenario, the administrator has\
    \ been handed a copy of the OSB project, and needs to deploy it. Before deployment,\
    \ the administrator needs to upload the projects to the Grid Control Software\
    \ Library for tracking, operational version control, and to enable deployment:\n\
    \n1. Upload OSB Projects to Software Library\n2. Select the radio button for **Oracle\
    \ Components**.\n\n3. Click on the Create Component button.\n\n![](img/7529bbd615e859608c21b965162348b2_204_0.png)\n\
    \n4. Enter the following values in the Describe step, as shown in the next screenshot:\n\
    \n- Select Type as Generic Component.\n- Name as OSB projects.\n- Leave the other\
    \ fields blank.\n- Click on Next.\n\n![](img/7529bbd615e859608c21b965162348b2_204_1.png)\n\
    \n5. In the Customize step, leave the defaults and click on Next.\n\n6. In the\
    \ **Upload File** step:\n\n- Select **Upload from Agent Machine**.\n- Click on\
    \ the **Select Target** button.\n- Select the **Host Name** as gcsoa.us.oracle.com.\n\
    - Click on the **Select File** button.\n- Select the location of the `sbconfig.jar`\
    \ from a pre-existing project from an OSB server, which was zipped up and stored\
    \ on the local machine; for instance: `/u01/homes/osb_wls/projects/sbconfig.jar`.\n\
    \n> Note that you can directly export projects from a live OSB server during the\
    \ deployment process. This will be the most common usage of the deployment procedure.\
    \ Here, for this workshop though, the export jar has already been created in advance.\
    \ This export jar contains several projects extracted from another OSB server.\n\
    \nClick on **Next**.\n\n7. On the **Set Directives** step, click on **Next**.\n\
    \n8. On the **Review** step, note the details, and click on **Finish**.\n\n9.\
    \ Note the confirmation message, and the new **OSB Project** generic component\
    \ that has been added.\n\n![](img/7529bbd615e859608c21b965162348b2_205_0.png)\n\
    \n10. Activate the OSB projects for use:\n\n- Select the radio button for **OSB\
    \ Projects**.\n- Click on **Activate**, as shown in the following screenshot:\n\
    \n![](img/7529bbd615e859608c21b965162348b2_206_0.png)\n\n## Viewing the project\
    \ deployment procedure\n\nGrid Control comes with out-of-the-box procedures to\
    \ deploy Oracle components including OSB projects. These procedures simplify the\
    \ administrator's life by automating manual steps, thereby saving time, and reducing\
    \ human error.\n\n1. View the **Oracle Service Bus Resource Provisioning** deployment\
    \ procedure:\n\n- From the Grid Control home page, click on the **Deployments**\
    \ tab.\n- Scroll down to locate the **Deployment Procedure Manager** section and\
    \ click on the **Deployment Procedures** link.\n\nA deployment procedure is a\
    \ series of logical steps that automate key administrative tasks related to Oracle\
    \ products. Most of these complex administrative tasks are listed in the \"Enterprise\
    \ Deployment Guide\". Note the various deployment procedures available out of\
    \ the box – database provisioning, RAC extend, application server provisioning,\
    \ and many more. These deployment procedures can be customized as well.\n\n- Search\
    \ for \"service\" to locate the OSB deployment procedure.\n- Click on the Oracle\
    \ Service Bus Resource Provisioning link.\n\n![](img/7529bbd615e859608c21b965162348b2_207_0.png)\n\
    \n- Note the steps underlying the procedure and the orchestration of the steps.\n\
    \nNote that you can customize this procedure by adding steps at any point. You\
    \ can do this by using the Create Like button.\n\n![](img/7529bbd615e859608c21b965162348b2_207_1.png)\n\
    \n## Scheduling project deployment\n\nNow that we are familiar with the OSB project\
    \ deployment procedure, the next step is to kick off the deployment. This can\
    \ be done through a simple interview process:\n\n1. Schedule the OSB project deployment.\n\
    2. Continuing from the previous step, click the **Schedule Deployment** button.\n\
    3. On the **Select Source** step, follow these steps:\n   - Select the **Oracle\
    \ Software Library** radio button.\n   - Click the *Component* flashlight to locate\
    \ the jar file from library.\n   - Locate the OSB projects that were uploaded\
    \ previously.\n   - Click on **Select** to select source suitcase bundles.\n \
    \  - Leave the pass phrase field blank.\n   - Click on **Next** to continue.\n\
    4. On the **Select Target** step:\n   - Select the relevant WebLogic domain from\
    \ the flashlight.\n   - Specify the BEA home directory, for example: `/u01/homes/osb_wls`.\n\
    \n> These bundles are stored in the Grid Control Software Library before actual\
    \ deployment.\n\n![](img/7529bbd615e859608c21b965162348b2_208_0.png)\n\n- Leave\
    \ the **Advanced Options** section as it is.\n- Leave the **Customization File**\
    \ option as it is.\n\n> You can specify advanced options, as well as upload customization\
    \ files, during deployment. The customization files could be uploaded to the Software\
    \ Library and reused for deployments to development, stage, test, and production.\n\
    \nClick on **Next** to proceed, as shown in the following screenshot:\n\n![](img/7529bbd615e859608c21b965162348b2_209_0.png)\n\
    \n5. In the **Set Credentials** step:\n\n- Provide the credentials for OSB Domain.\
    \ If you checked the **Store Preferred Credentials** box during target discovery,\
    \ then the **Username** and **Password** fields are auto-populated for you.\n\
    - Provide the credentials for the host. If you checked the **Store Preferred Credentials**\
    \ box during target discovery, then the **Username** and **Password** fields are\
    \ again auto-populated for you.\n"
  mdcn: "\n## 挑战\n\n在生产环境中部署应用程序是一项挑战。SOA 应用程序开发人员构建新项目或现有项目的新版本，并将它们“跨墙”交给运维团队。管理员必须在固定的时间窗口内将多个应用程序文件部署到多个目标。从测试到预发布再到生产的过程中，这一过程会重复进行。这会消耗时间，并需要对这些应用程序具备专业知识。集中控制\
    \ WebLogic 项目是第一个挑战，管理员必须跟踪项目版本以符合变更和发布管理规范。接下来部署本身也是一个挑战，因为管理员需要使用特定的自定义配置部署项目并遵守计划的维护窗口。总体而言，鉴于运营环境的限制，管理员需要处理太多手动任务。\n\
    \n## 解决方案\n\n使用 Grid Control，管理员可以将多个 OSB 项目部署到域部署流程框架中。五步访谈流程让用户可以选择源项目、选择目标\
    \ OSB 服务器和域、设置凭据、指定配置和自定义文件，并使用作业系统安排未来的部署。\n\n- 在企业软件库中存储 OSB 部署工件\n- 从实时 OSB\
    \ 服务器导出 OSB 部署工件\n- 跟踪 OSB 部署工件的成熟度和使用情况\n- 将 OSB 项目从测试部署到预发布再到生产\n- 在未来的维护窗口中部署\n\
    \n## 分步练习\n\n这套分步练习将指导管理 OSB 项目的部署。\n\n## 查看软件库\n\n第一步是查看 Grid Control 中的操作存储或软件库。这是管理员查看库存、添加项目或更改现有项目的起点。\n\
    \n1. 在 Grid Control 主页上，单击 **部署** 选项卡。\n2. 单击 **配置** 子选项卡。\n3. 展开 **组件** 以显示组件类型。\n\
    \n> 软件库包含多个对象，例如操作系统映像、数据库和应用服务器的 Oracle 主目录，以及 BPEL、OSB 等的部署工件。库用于跟踪这些组件在各种受监控目标上的使用成熟度。\n\
    \n![](img/7529bbd615e859608c21b965162348b2_203_0.png)\n\n## 将项目上传到软件库\n\n在此特定场景中，管理员已获得\
    \ OSB 项目的副本，并需要部署它。在部署之前，管理员需要将项目上传到 Grid Control 软件库以进行跟踪、操作版本控制并启用部署：\n\n1.\
    \ 将 OSB 项目上传到软件库\n2. 选择 **Oracle 组件** 的单选按钮。\n\n3. 单击创建组件按钮。\n\n![](img/7529bbd615e859608c21b965162348b2_204_0.png)\n\
    \n4. 在描述步骤中输入以下值，如下一屏幕截图所示：\n\n- 将类型选择为通用组件。\n- 名称为 OSB 项目。\n- 将其他字段留空。\n- 单击下一步。\n\
    \n![](img/7529bbd615e859608c21b965162348b2_204_1.png)\n\n5. 在自定义步骤中，保留默认值并单击下一步。\n\
    \n6. 在 **上传文件** 步骤中：\n\n- 选择 **从代理机器上传**。\n- 单击 **选择目标** 按钮。\n- 将 **主机名** 选择为\
    \ gcsoa.us.oracle.com。\n- 单击 **选择文件** 按钮。\n- 选择 `sbconfig.jar` 的位置，该文件来自 OSB 服务器上的现有项目，已压缩并存储在本地机器上；例如：`/u01/homes/osb_wls/projects/sbconfig.jar`。\n\
    \n> 请注意，您可以在部署过程中直接从实时 OSB 服务器导出项目。这将是部署流程最常见的用法。不过在此研讨会中，导出 jar 已提前创建。此导出 jar\
    \ 包含从另一台 OSB 服务器提取的多个项目。\n\n单击 **下一步**。\n\n7. 在 **设置指令** 步骤中，单击 **下一步**。\n\n8.\
    \ 在 **审核** 步骤中，注意详细信息，然后单击 **完成**。\n\n9. 注意确认消息，以及已添加的新 **OSB 项目** 通用组件。\n\n![](img/7529bbd615e859608c21b965162348b2_205_0.png)\n\
    \n10. 激活 OSB 项目以供使用：\n\n- 选择 **OSB 项目** 的单选按钮。\n- 单击 **激活**，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_206_0.png)\n\
    \n## 查看项目部署流程\n\nGrid Control 附带开箱即用的流程，可部署包括 OSB 项目在内的 Oracle 组件。这些流程通过自动化手动步骤简化管理员的工作，从而节省时间并减少人为错误。\n\
    \n1. 查看 **Oracle Service Bus 资源配置** 部署流程：\n\n- 在 Grid Control 主页上，单击 **部署** 选项卡。\n\
    - 向下滚动以找到 **部署流程管理器** 部分并单击 **部署流程** 链接。\n\n部署流程是一系列逻辑步骤，用于自动化与 Oracle 产品相关的关键管理任务。这些复杂的管理任务大多列在“Enterprise\
    \ Deployment Guide”中。请注意开箱即用的各种部署流程——数据库配置、RAC 扩展、应用服务器配置等等。这些部署流程也可以自定义。\n\n\
    - 搜索 \"service\" 以找到 OSB 部署流程。\n- 单击 Oracle Service Bus 资源配置 链接。\n\n![](img/7529bbd615e859608c21b965162348b2_207_0.png)\n\
    \n- 注意流程下的步骤以及步骤的编排。\n\n请注意，您可以通过在任何位置添加步骤来自定义此流程。您可以使用 Create Like 按钮来实现此操作。\n\
    \n![](img/7529bbd615e859608c21b965162348b2_207_1.png)\n\n## 安排项目部署\n\n现在我们熟悉了\
    \ OSB 项目部署流程，下一步是启动部署。这可以通过简单的访谈流程完成：\n\n1. 安排 OSB 项目部署。\n2. 从上一步继续，单击 **安排部署**\
    \ 按钮。\n3. 在 **选择源** 步骤中，按以下步骤操作：\n   - 选择 **Oracle 软件库** 单选按钮。\n   - 单击 *组件* 搜索灯以从库中定位\
    \ jar 文件。\n   - 找到之前上传的 OSB 项目。\n   - 单击 **选择** 以选择源 suitcase 捆绑包。\n   - 将密码短语字段留空。\n\
    \   - 单击 **下一步** 继续。\n4. 在 **选择目标** 步骤中：\n   - 从搜索灯中选择相关的 WebLogic 域。\n   - 指定\
    \ BEA 主目录，例如：`/u01/homes/osb_wls`。\n\n> 这些捆绑包在实际部署前存储在 Grid Control 软件库中。\n\n\
    ![](img/7529bbd615e859608c21b965162348b2_208_0.png)\n\n- 将 **高级选项** 部分保持原样。\n\
    - 将 **自定义文件** 选项保持原样。\n\n> 您可以在部署期间指定高级选项以及上传自定义文件。自定义文件可以上传到软件库，并在开发、预发布、测试和生产部署中重复使用。\n\
    \n单击 **下一步** 继续，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_209_0.png)\n\
    \n5. 在 **设置凭据** 步骤中：\n\n- 提供 OSB 域的凭据。如果在目标发现期间选中了 **存储首选凭据** 复选框，则 **用户名** 和\
    \ **密码** 字段将自动为您填充。\n- 提供主机的凭据。如果在目标发现期间选中了 **存储首选凭据** 复选框，则 **用户名** 和 **密码**\
    \ 字段再次自动为您填充。\n"
