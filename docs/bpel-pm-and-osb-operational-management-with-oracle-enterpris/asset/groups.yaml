  - '[PAGE 50]


    # Testing the SOAP tests


    There should be a way to track the historical availability and performance of
    SOAP tests and alert on any deviation from normal behavior via thresholds. When
    an alert is fired, the on-call person must test whether the reported problem is
    still in effect. Instantaneous on-demand testing is a great way to achieve this
    goal.


    +   1. Click on one of the SOAP tests that you created. The test page shows the
    test availability, beacons that run this test, and alerts associated with this
    test. The following graph shows the test response times from the beacon:

    +   2. Click on the Verify Service Test button.

    +   3. Click on the Perform Test to run the test instantaneously and view the
    results.


    ![](img/7529bbd615e859608c21b965162348b2_50_0.png)


    > One or more beacons could be used to test the service, potentially from multiple
    geographic locations that emulate the user base. This is useful for measuring
    availability and response time as experienced by the end user. It can be used
    proactively as well as reactively to replicate problems reported by users.'
  - '[PAGE 51]


    ![](img/7529bbd615e859608c21b965162348b2_51_0.png)


    This concludes the step-by-step exercises to set up and view monitoring of BPEL
    processes from Grid Control.


    # Summary


    Monitoring is key to guaranteeing the health of key business processes in the
    enterprise. In this chapter, we looked at how to monitor partner links and BPEL
    processes using synthetic tests. In particular, we looked at challenges related
    to monitoring BPEL processes, and the solutions provided by Grid Control.


    We looked at the basic BPEL process monitoring provided out of the box. Further,
    we were able to set up specific proactive checks to test the availability and
    performance of BPEL processes. These synthetic checks had the ability to notify
    the administrator based on preset thresholds. Further the administrator had the
    capability to run these synthetic checks on-demand and view the results.'
  - '[PAGE 52]


    Proactive monitoring can avoid loss of credibility with end users who interact
    with these business processes. Sometimes everything might be working fine within
    the firewall, but end users are still unable to access these processes. In this
    scenario, it is imperative to have an agent sitting outside the firewall to ensure
    that user behavior can be replicated frequently, and administrators can be notified.
    In most cases, these agents notify the administrators before end users.


    The next chapter will walkthrough hands-on exercises to set up and perform additional
    management tasks for the BPEL infrastructure, such as the BPEL Process Manager
    Server, application server, database, and host.'
  - '[PAGE 53]


    # 4


    # BPEL Infrastructure Management


    BPEL installations involve several pieces of software. For a basic single node
    installation, there are four components. The first one is the dehydration database
    that persists the BPEL metadata and the BPEL instance information, including instances
    that are currently being executed ("in-flight" instances). The second component
    is the application server that provides the platform for BPEL. BPEL is supported
    on Oracle WebLogic Server, Oracle Application Server, IBM WebSphere, and JBoss.
    The application server consists of various components such as a **Java Virtual
    Machine** (**JVM**) and a web server. The latest certification of application
    server platform listing can be found here:


    ```

    http://www.oracle.com/technology/software/products/ias/files/oracle_soa_certification_101310.html.

    ```


    The third component is the BPEL PM server itself, which is fundamentally a Java
    application. This application is packaged with the Oracle Application Server as
    part of the SOA Suite installation. The last component is the hardware server
    and the operating system that hosts the application server and database.


    Being an integration product, BPEL orchestrates services that reside on other
    infrastructure (different from its own infrastructure). This creates a nightmare
    for the administrators who are tasked with supporting BPEL orchestrations and
    failures associated with them.'
  - '[PAGE 54]


    Monitoring the BPEL and the extended infrastructure is important for IT to maintain
    visibility, get notified, and resolve problems quickly. This chapter talks about
    managing the BPEL infrastructure by monitoring, viewing configuration changes,
    and best practice policy violations. Specifically, this chapter talks about:


    +   - Challenges

    +   - Solution

    +   - Step-by-step exercises:

    +     - Creating the BPEL infrastructure service

    +     - Viewing the BPEL infrastructure service

    +     - Viewing system alerts and policies

    +     - Viewing configuration changes

    +     - Viewing key system metrics

    +     - Viewing administration tasks

    +     - Viewing system components

    +     - Viewing the system dashboard


    # Challenges


    Critical business processes can often go down due to a failure in a dependent
    infrastructure. Administrators find it hard to manage BPEL infrastructure along
    with other existing infrastructure systems. As a BPEL process dehydrates by storing
    state constantly in its database, any outages or performance problems in the database
    affect BPEL dehydration and rehydration. There are other infrastructure components
    such as web server, application server, and host that need to be functioning well
    for BPEL processes to run smoothly. An administrator who does not have BPEL knowledge
    or training may not understand what the critical infrastructure pieces are or
    how to manage them. Further best practices associated with the infrastructure
    components may not be known or difficult to implement. SOX and COBIT standards
    have become vital for IT administrators to not only be aware of, but also implement
    and monitor.'
