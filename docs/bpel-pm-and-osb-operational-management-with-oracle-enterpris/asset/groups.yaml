    \ Manager 已存在十多年，世界各地的许多数据库管理员都使用一个或多个 Enterprise Manager 产品来更高效地运行其数据库。过去几年中，Enterprise\
    \ Manager 也大力推动管理中间件和应用程序。这有助于改变最初的市场认知，即 Enterprise Manager 只是 DBA 的最佳朋友。\n\n\
    凭借其旗舰产品 Grid Control 版本 10.2.0.5（于 2009 年 2 月在 Linux 平台发布），Enterprise Manager\
    \ 加强了其在中间件领域的先前产品。Enterprise Manager 的战略方向与 Oracle 在 2008 年 4 月 29 日完成 BEA 收购后制定的方向一致。最大的改进是在管理\
    \ WebLogic Server 以及包含 Oracle BPEL Process Manager 和 Oracle Service Bus（前身为 AquaLogic\
    \ Service Bus）的 Oracle SOA 平台方面取得的。\n\n过去两年中，Enterprise Manager 进行了几次收购，以补充现有功能并为用户提供完整的解决方案。Auptyma\
    \ 是这些收购中的第一个，它提供了在生产环境中无需 instrumentation 或开销的深度 Java 诊断功能。该产品更名为 Application\
    \ Diagnostics for Java（AD4J）。另外，Moniforce 被收购用于管理最终用户在使用应用程序和服务提供商时的体验，该产品更名为\
    \ Real User Experience Insight（RUEI）。另一项关键收购是 ClearApp——一家提供建模和监控复合应用程序技术的公司。该产品更名为\
    \ Composite Application Modeler and Monitor（CAMM）。\n\n前方仍有若干集成挑战，许多人仍将 Enterprise\
    \ Manager 视为数据库管理解决方案。该产品在过去两年中增长迅速，尤其是在中间件、SOA 和应用程序领域。Enterprise Manager 是 Oracle\
    \ 的顶级产品线之一，但仍是 Oracle 产品组合中最好的秘密。随着产品线的广泛存在，Oracle 客户的 IT 部门以低成本拥有方式集中管理这些产品线非常重要。四大管理厂商（CA、IBM、HP、BMC）拥有广泛的产品，但未针对\
    \ Oracle 产品进行优化。此外，纯粹的厂商专注于细分领域，并未提供企业管理解决方案。Oracle Enterprise Manager 对于在数据中心拥有一个或多个\
    \ Oracle 产品以及非 Oracle 产品的企业发挥着重要作用。\n\n### 本书适合的对象\n\n如果您从事 Oracle BPEL Process\
    \ Manager、Oracle SOA Suite 或 Oracle Service Bus 工作，那么您就是本书的合适读者。如果您支持这些产品的运营基础设施，您将是更合适的读者。长期以来，应用程序和\
    \ SOA 管理员渴望了解分布式服务环境的可视性。如果您或您的团队在生产环境中支持这些产品中的任何一种，您将了解处理日常运营问题的痛苦。本书将利用 Enterprise\
    \ Manager 功能在很大程度上缓解这些问题。\n\n如果您是 SOA 架构师或以任何方式与 SOA 治理相关（例如，SOA 卓越中心），本书将让您了解在复杂的\
    \ SOA 环境中获得生产保障的众多功能。这将帮助您结合其他工具（如 Oracle Enterprise Repository（OER）、Oracle Service\
    \ Registry（OSR）和 Oracle Web Services Manager（OWSM））来治理 SOA 环境。然而，本书将重点关注使用 Enterprise\
    \ Manager Grid Control 的运行时 SOA 管理。\n\n如果您喜欢以功能性方法解决运营问题，那么这就是适合您的书。您会发现本书避免对概念进行讲授，而是直接解决实际运营问题。\n\
    \n预计读者对面向服务的架构有一般性的了解，以及对 Oracle SOA 产品（如 BPEL Process Manager 和 Oracle Service\
    \ Bus）的了解。不需要特定的管理或运营专业知识。本书将帮助您使用基于步骤的功能方法建立管理 Oracle SOA 产品的框架。\n"
