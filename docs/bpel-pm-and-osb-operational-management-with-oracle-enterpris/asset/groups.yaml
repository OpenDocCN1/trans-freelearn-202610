  - '[PAGE 200]


    # Summary


    Discovery is the first step to managing a target in the enterprise. Discovering
    and managing multiple targets from a single console is a powerful way to ramp
    up on new projects, while maintaining a standardized management platform. This
    avoids hiring new administrators for new projects that increase the number of
    managed targets.


    In this chapter, we looked at how to discover WebLogic Server and OSB targets.
    In particular, we discussed the mandatory discovery process to locate and identify
    the WebLogic and OSB components. There are several challenges associated with
    managing multiple components in the data center. Grid Control provides a single
    interface to discover and manage these disparate components. In the exercises,
    we walked through simple steps to discover WebLogic and OSB components. Finally,
    we viewed the key monitoring areas on the OSB target home page.


    The WebLogic server discovery is mandatory, and OSB is discovered automatically
    as a result. These are mandatory steps to enable subsequent management tasks on
    WebLogic or OSB. The next few chapters will walkthrough hands-on exercises to
    set up and perform additional management tasks for the discovered targets.'
  - '[PAGE 201]


    # 12


    # OSB Deployment Automation


    In most medium to large enterprises, integration developers have to deal with
    managing multiple initiatives spread over multiple departments. In the WebLogic
    and Oracle Service Bus (OSB) world, this translates to multiple WebLogic/OSB projects
    in multiple WebLogic domains. Typically, the integration developers are tasked
    with project development and testing while the WebLogic administrators are responsible
    for the deployment and operational support. This handoff is not entirely smooth
    due to different tools and processes in the development and operational organizations.


    WebLogic administrators have to deal with multiple OSB projects. Typically, the
    OSB project deployment should follow the existing methodology in the enterprise.
    The operational team should centrally maintain the deployment artifacts, and this
    should be a different location than the one used by the development team. The
    deployment itself should be a well-defined procedure with a series of repeatable
    steps. Further, the set of best practices for the enterprise should be invoked
    at deployment time. This chapter talks about deploying multiple OSB projects to
    an OSB environment in a standardized manner. Specifically, this chapter talks
    about:


    +   - Challenges

    +   - Solution

    +   - Step-by-step exercises:

    +     - Viewing the Software Library

    +     - Uploading projects to the Software Library

    +     - Viewing the project deployment procedure

    +     - Scheduling project deployment'
