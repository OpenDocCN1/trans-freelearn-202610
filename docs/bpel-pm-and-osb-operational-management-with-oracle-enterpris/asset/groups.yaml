    ## 摘要


    记录和监控关键的端用户路径是提高端用户满意度的积极方法。在全球经济中，企业需要确保用户能够随时随地获得所需的信息。没有合成监控策略的管理解决方案是不完整的。


    在本章中，我们讨论了如何创建 Web 应用程序、记录 Web 事务以及为性能和使用目的使用特定指标。此外，我们还讨论了如何配置从各种代理或 Beacon 运行这些合成事务。最后，我们讨论了如何查看
    Web 事务以查看和验证所有步骤。


    Grid Control 中的合成服务测试监控由被动的真实用户监控补充。Enterprise Manager 的 Real User Experience
    Insight（来自 Moniforce 收购）是该领域的优秀工具。有关 Real User Experience Insight 的更多信息可在 Oracle
    Technology Network 上找到。

