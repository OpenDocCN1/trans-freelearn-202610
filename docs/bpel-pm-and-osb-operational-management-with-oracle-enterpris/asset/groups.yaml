  - '[PAGE 137]


    # 9


    # SOA Suite Cloning


    Software maintenance often accounts for 70 percent of overall cost and that includes
    licensing. Enterprises have to worry about maintaining their software, which includes
    product updates, security updates, hardware updates, and environment refreshes.
    These are time-consuming tasks that require human expertise in several areas.
    As the software ages, an enterprise still needs to maintain this human expertise
    for legacy software that, while critical to the business, can be expensive and
    sometimes negate the overall business value by increasing the cost of ownership.


    More and more enterprises are turning to automated lifecycle management tools
    to help with this heavy lifting related to software lifecycle maintenance. It
    is important to have the right strategy in place to plan for maintenance. Maintenance
    should be part of the overall strategy, not an afterthought.


    This chapter covers:


    +   - Challenges

    +   - Solution

    +   - Step-by-step exercises:

    +     - Adding an Oracle Application Server Cluster to Grid Control

    +     - Stopping application server processes

    +     - Creating a component in the Grid Control Software Library

    +     - Cloning an Oracle Application Server and SOA applications

    +     - Validating a newly created cluster'
  - '[PAGE 138]


    # Challenges


    In today''s data centers, services often need to be provisioned in short order.
    These services could consist of complex multitier configurations, such as Oracle
    Application Server and SOA application software. An administrator has to go through
    multiple steps to clone an SOA Suite from one installation to another. The steps
    include cloning copied files, configuring them, and making changes to reflect
    the new installation. Several Oracle administrators have database cloning skills,
    but most do not possess the expertise to clone Application Server, let alone the
    SOA Suite. Manual installations of such services are often time consuming and
    error prone.


    # Solution


    Grid Control provides a flexible and scalable way to clone tested images to multiple
    hosts. Specifically, Grid Control offers a predefined, fully customizable procedure
    for cloning Oracle Application Server and SOA applications. The procedure enables
    administrators to either create a new Oracle Application Server instance or Oracle
    Application Sever Cluster based on an existing, reference application server or
    cluster; thereby automating common IT tasks such as creating a production SOA
    Suite environment based on a test or stage, or such as extending an existing Oracle
    Application Server Cluster to accommodate an increase in load.


    # Step-by-step exercises


    This set of step-by-step exercises will walkthrough cloning an Oracle SOA Suite
    10.1.3.x deployed on Oracle Application Server 10.1.3.x.


    # Adding an Oracle Application Server Cluster to Grid Control


    The first step is to create the application server cluster target in order to
    clone it later.


    ![](img/7529bbd615e859608c21b965162348b2_138_0.png)


    > In order to create a new cluster via cloning, Grid Control must be aware of
    an existing, installed cluster from which to clone.'
