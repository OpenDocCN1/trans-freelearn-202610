    ## SOA Suite 克隆


    10. 页面顶部将出现一条确认消息，表明已提交作业以在 Grid Control 软件库中创建 Oracle Application Server 10.1.3.1
    SOA Suite 组件。要跟踪作业进度，请点击确认消息中标识作业执行 ID 的链接。


    ![](img/7529bbd615e859608c21b965162348b2_150_0.png)


    11. Job Run 页面的 Summary 向导出现。确保作业成功完成。根据 Oracle Application Server 配置的性质，这可能需要几分钟时间。


    ![](img/7529bbd615e859608c21b965162348b2_151_0.png)


    12. 使用 Web 浏览器的刷新按钮刷新作业状态，直到看到作业状态从 Running 变为 Succeeded。


    ![](img/7529bbd615e859608c21b965162348b2_151_1.png)


    ## SOA Suite 克隆


    13. 返回 Deployments 选项卡下的 Provisioning 子选项卡，以在软件库表中查看新创建的组件。为了在克隆操作期间使用该组件，您必须激活该组件。在表中选择新创建的
    Oracle Application Server 10.1.3.1 SOA Suite 组件，然后点击表格顶部的 Activate 按钮。


    ![](img/7529bbd615e859608c21b965162348b2_152_0.png)


    > 现有的集群的活动黄金映像组件现在已在软件库中，因此可作为创建新应用服务器实例和集群的源映像。


    ## 克隆 Oracle Application Server 和 SOA 应用


    现在我们准备使用开箱即用的部署流程克隆具有底层 SOA 应用的 Oracle Application Server：


    - 1. 从 Deployments 选项卡下导航到 General 子选项卡。点击页面底部 Deployment Procedure Manager 部分中的
    Application Server Provisioning Procedures 链接。

    - 2. 出现一份开箱即用的与应用服务器相关的部署流程列表。选择名为 Application Server Deployment 10.1.3.1 SOA
    的流程并点击 Schedule Deployment。


    ![](img/7529bbd615e859608c21b965162348b2_153_0.png)


    3. 出现一个多步骤向导，指导您安排克隆操作。如前所述，克隆 Oracle Application Server 时，您可以选择从已安装并在 Enterprise
    Manager 环境中发现的源克隆，或从存储在软件库中的源克隆。由于我们在练习中早些时候在软件库中创建了黄金映像组件，请选择 **Select from Software
    Library** 选项。由于我们在软件库中创建的唯一组件是应用层，因此在本动手实验中我们将仅从软件库克隆应用层。点击与 **Source for App
    Tier** 部分关联的 *手电筒* 图标。


    ![](img/7529bbd615e859608c21b965162348b2_154_0.png)


    4. 在 **Select Component for Application Tier** 页面上，将 **Component Name** 选择为我们之前创建的那个（推荐名称为
    **SOA 10.1.3.1 Gold Image**），然后点击 **Select** 按钮，如以下屏幕截图所示：


    5. 然后您将被返回到向导的 Source Selection 页面，其中 Source for App Tier 的详细信息已自动为您填充。点击 Next，如以下屏幕截图所示：


    ![](img/7529bbd615e859608c21b965162348b2_155_0.png)


    ![](img/7529bbd615e859608c21b965162348b2_155_1.png)

