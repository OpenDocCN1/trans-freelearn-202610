  mdcn: "\n## 逐步练习\n\n这套逐步练习将演示如何管理 BPEL 和应用服务器目标的配置。\n\n### 导航至 BPEL 目标配置管理\n\nGrid\
    \ Control 为其所有受管目标（如数据库、应用服务器、BPEL PM 等）提供了丰富的配置管理功能。\n\n- 1. 导航到 BPEL 目标主页。\n\
    - 2. 单击 Administration 选项卡。\n- 3. 注意与目标配置管理相关的链接。\n\n> Grid Control 配置管理框架每天收集\
    \ BPEL 的关键配置参数。这些参数存储在 Grid Control 仓库中。关键配置任务可从此处访问。\n\n![](img/7529bbd615e859608c21b965162348b2_109_0.png)\n\
    \n### 查看最后收集的配置\n\nGrid Control 代理按固定间隔（默认 24 小时一次）收集配置指标并上传到配置管理仓库。这使 Grid Control\
    \ 能够跟踪受管目标的配置历史。有多种方式查看配置历史，其中之一是最后收集的配置。\n\n- 1. 单击 **Last Collected Configuration**\
    \ 查看配置参数。\n- 2. 在 **Last Collected Configuration** 页面查看配置设置。\n- 3. **Process Manager**\
    \ 选项卡显示有关服务器的通用信息，包括 URLs、dehydration store 和 cluster 参数。\n\n![](img/7529bbd615e859608c21b965162348b2_110_0.png)\n\
    \n- 4. 单击 **Domains** 子选项卡。**Domains** 选项卡列出 BPEL 域以及每个域的重要配置参数。\n\n![](img/7529bbd615e859608c21b965162348b2_111_0.png)\n\
    \n- 5. 单击 **Processes** 子选项卡。**Processes** 选项卡显示已部署流程的列表，其中包含版本信息、底层文件和最后修改时间。\n\
    \n![](img/7529bbd615e859608c21b965162348b2_111_1.png)\n\n### BPEL 配置管理\n\n- 6.\
    \ 单击 **Configuration Files**。BPEL 服务器的关键配置文件现已存储在 Grid Control 仓库中并在此选项卡上显示。您可以单击文件以只读模式查看其内容。\n\
    \n![](img/7529bbd615e859608c21b965162348b2_112_0.png)\n\n### 将配置快照保存到仓库\n\n在大型企业中，跨目标类型标准化配置非常重要。这有助于维护简便，也对合规性很重要。为了标准化配置，Grid\
    \ Control 提供了基于现有目标配置创建“gold”配置的方法，然后可将其用于与其他目标进行标准化：\n\n- 1. 单击右上角的 **Save**\
    \ 按钮。\n- 2. 选择 **Save to EM Repository** 选项。\n\n- 3. 输入描述，例如 GCSOA_<date>_BPEL_Baseline，如以下屏幕截图所示：\n\
    \n![](img/7529bbd615e859608c21b965162348b2_113_0.png)\n\n- 4. 单击 OK 将当前配置保存到 Grid\
    \ Control 仓库。\n\n- 5. 注意确认消息以及带有时间戳、名称、描述、保存日期和所有者的已保存配置。\n\n### 导航至 Oracle 应用服务器配置管理\n\
    \n由于 BPEL 由应用服务器托管，因此查看 Oracle 应用服务器配置也很有用：\n\n- 1. 从 Grid Control 主页单击 Targets\
    \ 选项卡。\n- 2. 选择 Application Servers 子选项卡。\n- 3. 单击应用服务器的名称，例如 soa.gcsoa.us.oracle.com。\n\
    \n- 4. 这会带您进入应用服务器的主页。\n\n![](img/7529bbd615e859608c21b965162348b2_114_0.png)\n\
    \n- 5. 单击 Administration 选项卡。\n\n> Grid Control 配置管理框架每天收集所有 Oracle 应用服务器目标以及各个组件（web\
    \ server、OC4J、BPEL PM 等）的关键配置参数。这些参数存储在 Grid Control 仓库中。\n\n### 查看最后收集的配置\n\n\
    通常，管理员最想看到的就是目标的当前配置。这通常对应于 Grid Control 中的“last collected configuration”，并且可以刷新以启动按需收集以获取最新信息。\n\
    \n- 1. 选择 Last Collected Configuration 链接，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_115_0.png)\n\
    \n- 2. 显示应用服务器的当前配置。General 选项卡显示应用服务器的关键组件以及一些关键配置参数，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_115_1.png)\n\
    \n- 3. 单击 J2EE Applications 选项卡以查看部署在此应用服务器上的所有 J2EE 应用程序。\n\n![](img/7529bbd615e859608c21b965162348b2_116_0.png)\n\
    \n- 4. 单击 Configuration Files 选项卡以查看关键配置文件。您可以单击文件以查看文件的只读版本。\n\n![](img/7529bbd615e859608c21b965162348b2_116_1.png)\n\
    \n### 将配置快照保存到仓库\n\n与 BPEL 配置快照类似，应用服务器配置也可以保存到 Grid Control 仓库，以便在整个企业中进行标准化：\n\
    \n- 1. 单击 Save 按钮保存当前配置。\n- 2. 选择 Save to the EM Repository 选项。\n- 3. 提供描述，例如\
    \ GCSOA_<date>_AS_Baseline。\n- 4. 选择保存所有应用服务器组件配置的复选框，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_117_0.png)\n\
    \n- 5. 单击 OK 将当前配置保存到 Grid Control 仓库。\n\n- 6. 注意确认消息，以及带有目标名称、类型和时间戳的已保存配置。\n\
    \n![](img/7529bbd615e859608c21b965162348b2_118_0.png)\n\n### 修改 BPEL 环境\n\nGrid\
    \ Control 控制台是一个或多个 BPEL PM 以及其他目标类型的管理界面。对于启动/停止、更改配置属性等管理功能，管理员需要使用产品控制台，在本例中为\
    \ BPEL 控制台。\n\n- 1. 导航到 BPEL 目标主页。\n- 2. 在 **Related Links** 下，单击 **Administer\
    \ (BPEL Console)**。\n- 3. 使用 **Username** 为 **oc4jadmin** 和 **Password** 为 *welcome1*\
    \ 登录。\n- 4. 单击 **Manage BPEL Domain** 链接。\n- 5. 这会带您进入 BPEL 的管理页面，您可以在此设置域级参数。选择\
    \ **Configuration** 选项卡。\n\n![](img/7529bbd615e859608c21b965162348b2_119_0.png)\n\
    \n- 6. 更改以下属性：\n  - AuditDetailThreshold to 60k\n  - dspMaxThreads to 6\n  - dspMinThreads\
    \ to 2\n  - LargeDocumentThreshold to 60k\n\n- 7. 单击 Apply 按钮保存更改。\n\n- 8. 选择\
    \ **Logging** 选项卡并选择下拉菜单将所有日志级别更改为 **Warn**。warn 的调试级别表示会记录到某些日志的警告消息，但应用程序能够在没有问题的情况下继续运行。\n\
    \n![](img/7529bbd615e859608c21b965162348b2_120_0.png)\n\n- 9. 单击 **Apply** 保存更改。\n\
    \n- 10. 选择 **Logout** 退出 BPEL Control。\n\n### 修改 Oracle 应用服务器环境\n\n与 BPEL 控制台类似，应用服务器也自带自己的管理控制台以进行配置更改。\n\
    \n- 1. 从 Grid Control 主页单击 **Targets** 选项卡。\n- 2. 选择 **Application Servers** 子选项卡。\n\
    \n- 3. 单击应用服务器的名称—soademo.gcsoa.us.oracle.com。\n- 4. 这会带您进入应用服务器的主页。\n- 5. 在 Related\
    \ Links 部分底部单击 Administer 链接。\n- 6. 使用用户名为 oc4jadmin 和密码为 welcome1 登录 AS Control\
    \ 控制台。\n- 7. 单击 oc4j_soa 链接以进入此 oc4j 实例的主页，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_121_0.png)\n"
