  - '[PAGE 85]


    # 6


    # BPEL Services Dashboard


    Most IT departments have a service desk or help desk that acts as the single point
    of contact for customers. The service desk team is responsible for being the first
    line of communication to log customer-reported incidents. The service desk analyst
    is responsible for logging customer incidents, verifying service health and availability,
    and notifying respective IT departments about new issues.


    BPEL processes frequently are responsible for key business functions such as billing,
    expense reports, and order fulfillment. For company-wide services, the service
    desk needs to keep track of these critical processes. When users call the service
    desk to complain about these processes, the analyst needs to look at a common
    dashboard to verify the status of each process. The analyst needs to understand
    how long the process has been unavailable or non-performant, and whether the preset
    **Service Level Agreements (SLAs)** have been violated. They need to take swift
    action to ensure new incidents are logged and rectified quickly by the IT administrator.
    This chapter talks about creating a dashboard to monitor critical BPEL processes
    and monitoring key metrics and SLAs for each process. Specifically, this chapter
    talks about:


    +   - Challenges

    +   - Solution

    +   - Step-by-step exercises:

    +     - Navigating to the **Reports** tab

    +     - Creating an SOA services dashboard

    +     - Viewing the SOA services dashboard'
  - '[PAGE 86]


    # Challenges


    A service desk needs a common dashboard to monitor key BPEL processes. Lack of
    an effective dashboard in most enterprises translates to poor communication between
    service providers and consumers. Further, without a common dashboard, SLAs cannot
    be monitored effectively. The lack of transparency leads to lack of trust and
    the provider''s credibility is affected, even though the process availability
    and performance fall in line with SLAs.


    # Solution


    Grid Control displays the availability and key metrics for the key services via
    service dashboards. Service desk analysts, IT administrators, as well as IT executives
    can keep track of current and historic service levels, by using these dashboards.
    The top-down service dashboards enable IT organizations to manage from an end-user
    service perspective. Managing by exception enables support staff to drill down
    into problem services to determine the root cause of failure before customer complaints
    or before SLA violations.


    # Step-by-step exercises


    This set of step-by-step exercises will walkthrough creating a service dashboard
    to monitor critical BPEL processes.


    # Navigating to the Reports tab


    Grid Control has the ability to create, publish, and view standard and custom
    reports. These reports serve as a window to the monitoring and configuration data
    stored in the Grid Control repository.


    +   1. From the Grid Control home page, click on the **Reports** tab.

    +   2. Search for **Services Monitoring Dashboard**.


    ![](img/7529bbd615e859608c21b965162348b2_86_0.png)


    > Grid Control provides several out-of-the-box reports for monitoring, security,
    and compliance. These reports are complements by service dashboards that can be
    used by the service desk to monitor key services.'
