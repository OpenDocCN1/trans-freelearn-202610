  - '[PAGE 171]


    # 10


    # Web Application Monitoring


    Measuring and managing end users'' performance has become increasingly important
    to ensure customer satisfaction. While services and infrastructure might be healthy
    and available within the data centre''s firewalls, consumers may still have problems
    accessing services externally via the Internet. This then becomes a guessing game
    to isolate the problem to the customer''s Internet Service Provider, or to the
    provider''s faulty service. Further, in the age of Twitter and Facebook, providers
    are increasingly at risk with distributed denial-of-service-type attacks. A lot
    of providers today, such as Amazon, Google, and Salesforce.com, provide publicly
    available information about the current and historical status of their services.


    Increasingly, service-level agreements are tied to the end user''s experience
    of interacting with a service. If the end users cannot access a service, then
    a simple "tweet" on Twitter can lead to a rapid chain reaction of user complaints
    that may quickly become a source of negative publicity for the provider. In today''s
    world, provider''s have no place to hide when consumers are faced with unavailable
    or poorly performing services. In some cases, this may lead to money-back requests
    based on contractual obligations.


    This chapter talks about:


    +   - Challenges

    +   - Solution

    +   - Step-by-step exercises:

    +     - Creating a web application

    +     - Recording a web transaction as a Service Test

    +     - Adding Beacons to run the Service Test

    +     - Adding performance and usage metrics

    +     - Viewing web transaction playback'
  - '[PAGE 172]


    # Challenges


    A web application administrator wants to have better visibility into the availability
    or performance as seen by end users. The administrator wants to closely watch
    a list of critical URLs that are "always expected to be alive and responsive"
    or monitor the performance of web applications from various regions, domains,
    or of a specific set of visitors, to ensure that the consumers are receiving optimal
    performance. The ability to understand the impact of the performance problems
    is critical. It is also useful to learn about the pages, visitors, domains, and
    regions impacted by performance problems.


    # Solution


    Grid Control comes with a transaction-recording capability that lets you record
    web transactions that emulates end users. Grid Control tracks all response times
    of all URLs for all visitors that have accessed your application. Grid Control
    can not only emulate web traffic, but also emulates tnsping, IMAP, SQL, and several
    other protocols. By monitoring the number of hits combined with performance metrics,
    and analyzing the response times by URL, domain, region, visitor, and web server,
    you can clearly assess the impact of performance degradation problems on your
    user base. Further drilldowns provide you with Web server response time and load
    distribution information to help you efficiently balance server resources.


    # Step-by-step exercises


    This set of step-by-step exercises will walkthrough managing web applications.


    # Creating a web application


    A web application is a specific target type in Grid Control used to monitor one
    or more URLs for availability, performance, and SLA reporting.


    ![](img/7529bbd615e859608c21b965162348b2_172_0.png)


    Please perform this exercise only on Internet Explorer. You need to be connected
    to the Internet for this exercise to download Microsoft libraries for the web
    transaction recorder.'
