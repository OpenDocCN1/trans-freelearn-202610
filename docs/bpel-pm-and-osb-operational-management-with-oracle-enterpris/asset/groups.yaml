  - '[PAGE 46]


    > Beacons are agents that have been configured to issue synthetic tests to test
    websites, Web services, mail servers, FTP sites, and so on. A beacon is typically
    installed outside the firewall from a location where users access the website
    or Web service. A beacon thus "emulates" end user behavior and informs the administrator
    proactively about any problem with the website or Web service. You can read more
    about beacons and service management in the Grid Control documentation on the
    Oracle Technology Network—http://otn.oracle.com.


    ![](img/7529bbd615e859608c21b965162348b2_46_0.png)


    +   11. Click on **OK** to save the SOAP test and beacon settings.

    +   12. Verify availability process creation and view SOAP test. On the BPEL process
    home page, note the availability Generic Service that was automatically created.

    +   13. Expand the process availability service. For example, **SOAOrderBooking(v1.0)_availability**
    and verify that the SOAP test that you just created, for example **SelectService_test**,
    has been added.


    > The availability service for the BPEL process is formed when the first SOAP
    test is created. Note the status of each test, and how it is rolled up (configurable)
    to determine process availability. The status of the SOAP test will take some
    time to show up, based on the frequency set for the test.'
  - '[PAGE 47]


    ![](img/7529bbd615e859608c21b965162348b2_47_0.png)


    # Creating a SOAP test to monitor a BPEL process


    Similar to monitoring partner links through synthetic checks, the overall BPEL
    process can also be monitored in the same manner. A BPEL process is typically
    invoked by a SOAP client. This can be tested at a desired frequency to ensure
    that the BPEL process can be instantiated at all times by clients:


    +   1. Go to the BPEL process home page.

    +   2. Scroll down and locate the radio button for client in the Partner Links
    section.'
