    \ **开始时间** 为 **08:00** 且 **结束时间** 为 **18:00**。\n- 5. 将默认的 **可用性标准** 更改为符合业务标准。考虑计划停机（黑屏）以及它们是否被视为计算中的正常运行时间。\n\
    - 6. 在 **性能标准** 下，从 **可用性能指标** 中选择一个或多个指标。\n- 7. 点击 **确定**，如下图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_83_0.png)\n\
    \n- 8. 从聚合服务主页，点击 **图表** 选项卡。\n\n> 注意本页图表中跟踪的已提升性能指标，并在图表上显示阈值。\n\n## 摘要\n\n有效监控\
    \ BPEL 服务对于监控消费者期望和保持信誉至关重要。Grid Control 提供了通过基础设施服务及其关联有效监控 BPEL 服务的方法。\n\n在本章中，我们讨论了\
    \ Grid Control 如何围绕 BPEL 流程和 BPEL 基础设施设置服务模型。内置的服务等级期望和利用可用性和性能指标进行的测量使得监控这些服务变得容易。此外，指标可以基于服务测试或基础设施指标。\n\
    \n将关键服务组件与基础设施组件关联起来，并从一个集成视图监控它们，对于管理员设置和控制消费者期望至关重要。\n\n接下来的几章将逐步介绍动手练习，以设置服务仪表板来监控为企业配置的服务。\n\
    \n## 6\n\n## BPEL 服务仪表板\n\n大多数 IT 部门都有服务台或帮助台，作为客户的单一联系点。服务台团队负责作为记录客户报告事件的第一线沟通。服务台分析师负责记录客户事件、验证服务健康状况和可用性，并通知相关\
    \ IT 部门有关新问题。\n\nBPEL 流程经常负责关键业务功能，例如计费、费用报告和订单履行。对于公司范围的服务，服务台需要跟踪这些关键流程。当用户因这些流程而向服务台投诉时，分析师需要查看一个通用仪表板以验证每个流程的状态。分析师需要了解流程不可用或性能不佳的时间有多长，以及预设的\
    \ **服务等级协议 (SLAs)** 是否已被违反。他们需要迅速采取行动，确保新事件由 IT 管理员及时记录并纠正。本章讲述创建仪表板以监控关键 BPEL\
    \ 流程并监控每个流程的关键指标和 SLA。特别地，本章讲述：\n\n- 挑战\n- 解决方案\n- 分步练习：\n  - 导航到 **报表** 选项卡\n\
    \  - 创建 SOA 服务仪表板\n  - 查看 SOA 服务仪表板\n\n### 挑战\n\n服务台需要一个通用仪表板来监控关键 BPEL 流程。大多数企业缺乏有效的仪表板会导致服务提供商和消费者之间沟通不畅。此外，没有通用仪表板，SLA\
    \ 无法有效监控。缺乏透明度导致信任缺失，服务提供商的信誉受损，即使流程可用性和性能符合 SLA。\n\n### 解决方案\n\nGrid Control\
    \ 通过服务仪表板显示关键服务的可用性和关键指标。服务台分析师、IT 管理员以及 IT 高管可以通过使用这些仪表板跟踪当前和历史服务等级。自上而下的服务仪表板使\
    \ IT 组织能够从最终用户服务角度进行管理。通过例外管理，支持人员可以在客户投诉或 SLA 违规之前深入研究问题服务，以确定故障的根本原因。\n\n###\
    \ 分步练习\n\n这组分步练习将逐步介绍创建服务仪表板以监控关键 BPEL 流程的过程。\n\n### 导航到报表选项卡\n\nGrid Control\
    \ 具有创建、发布和查看标准和自定义报表的能力。这些报表作为存储在 Grid Control 仓库中的监控和配置数据的窗口。\n\n- 1. 从 Grid\
    \ Control 主页，点击 **报表** 选项卡。\n- 2. 搜索 **服务监控仪表板**。\n\n![](img/7529bbd615e859608c21b965162348b2_86_0.png)\n\
    \n> Grid Control 为监控、安全和合规提供多个开箱即用的报表。这些报表由服务仪表板补充，服务台可以使用这些仪表板监控关键服务。\n\n###\
    \ 创建 SOA 服务仪表板\n\n仪表板是众多报表类型之一。与其他 Grid Control 报表一样，有许多可配置方面，例如源或目标、要显示的内容以及显示的时间段。仪表板可以在不同的时区显示，具有自动刷新功能，并能够显示一个或多个有趣的时间窗口，例如最近一天、最近一周和最近一个月。\n\
    \n- 1. 选择 **服务监控仪表板** 旁边的单选按钮。\n- 2. 点击 **创建类似**，如下图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_87_0.png)\n\
    \n- 3. 输入 **标题** 为 **SOA 服务仪表板**。\n- 4. 将其他字段保持为默认值。\n\n### BPEL 服务仪表板\n\n- 5.\
    \ 如以下截图所示，在 **目标** 部分下，选择 **使用指定的目标** 单选按钮。\n- 6. 点击 **元素** 选项卡。\n\n![](img/7529bbd615e859608c21b965162348b2_88_0.png)\n\
    \n- 7. 点击 **设置参数**。\n- 8. 编辑标题为 **SOA 服务仪表板**。\n- 9. 更改与您地理位置相关的时区。例如，**(UTC-08:00)\
    \ 美国太平洋时间 (PST)**。\n- 10. 在 **服务** 部分，选择所有 SOA 相关服务（除 EM 服务外）。\n- 11. 将 default_SOAOrderBooking(v.1.0)\
    \ 聚合服务移动到所选列表的顶部，如下图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_89_0.png)\n\
    \n- 12. 点击 继续。\n- 13. 点击 确定 以保存仪表板设置。\n\n### 查看 SOA 服务仪表板\n\n一旦仪表板创建完成，您可以查看它并查看关键服务的状态和健康状况。每个服务都有红色、黄色和绿色指示器，这可以很好地鸟瞰所有服务。\n\
    \n- 1. 导航到报表选项卡。\n- 2. 搜索标题 SOA 并点击 转到。\n\n"
