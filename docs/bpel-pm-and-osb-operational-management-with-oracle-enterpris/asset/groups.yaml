  mdcn: "\n## 2\n## 发现 BPEL PM\n\n管理解决方案需要定位并识别其需要管理的对象。此过程称为发现，即管理解决方案定位并识别所有目标。这通常使用部署在包含需要管理目标的服务器上的管理代理来完成。目标的发现使管理员能够了解环境概览以及需要管理的各个组件。\n\
    \n对于小型、中型或大型企业而言，挑战在于从单个控制台管理多个不同的目标。传统的硬件和软件组件，如服务器、存储设备、操作系统、数据库、中间件和应用程序，一直由系统管理解决方案进行管理。然而，一种新型的基于\
    \ BPEL 的应用程序和基础设施带来了新的问题。首先，它们需要与现有硬件和软件一起进行管理。其次，随着 BPEL 项目在企业中 proliferate，基础设施团队面临着管理这些项目日益增加的问题。第三，对于刚接触\
    \ BPEL 的管理员来说，在生产环境中支持这些环境会带来未知挑战。最后，IT 管理员希望避免随着 BPEL 项目的增加而聘用新的管理员。\n\nGrid\
    \ Control 提供了一种发现 BPEL 组件的方法，无论是在生产环境中还是其他环境中。对于基础设施团队来说，这是一种从一个控制台管理多个安装的便捷方式。一旦在托管\
    \ BPEL PM 的每台服务器上安装了代理，即可从控制台启动发现过程。\n\n在本章中，我们将讨论如何发现和配置 BPEL Process Manager\
    \ 目标。发现 BPEL PM 目标是在执行其他管理任务之前的第一步。此外，创建基础设施服务是管理 BPEL 流程和相关基础设施的强制性步骤。本章涵盖以下内容：\n\
    \n- 支持管理 BPEL PM\n- BPEL PM 目标发现\n  - 导航到应用服务器\n  - 发现 BPEL PM 目标\n  - 导航到 BPEL\
    \ PM 目标主页\n  - 配置 BPEL PM 目标\n\n### 支持管理 BPEL PM\n\nBPEL PM 产品附带一个控制台，可用于管理活动，例如打开或关闭流程、删除实例、检查实例的流程等等。但是，它无法提供诸如监控服务器、流程的可用性和健康状况、配置管理以及批量部署等管理功能。\n\
    \nGrid Control 在 2007 年 1 月发布的 10.2.0.3（或 10gR3）版本中引入了 BPEL 管理功能。第一个版本提供了用于监控\
    \ BPEL 基础设施（包括 BPEL PM 服务器）的大部分功能。此外，它还具有流程级监控、错误实例管理和服务级管理。\n\n2007 年 11 月在 Linux\
    \ 平台上发布的 10.2.0.4（10gR4）版本带来了管理 BPEL PM 的额外新功能。配置管理、部署自动化和适配器监控是该版本的主要功能。2009\
    \ 年 2 月在 Linux 平台上发布的 10.2.0.5（10gR5）版本增加了用于跟踪麻烦的 BPEL 实例的报告功能。\n\n### BPEL PM\
    \ 目标发现\n\n这组逐步练习将演示 BPEL PM 目标的发现以及为目标设置监控配置。\n\n### 导航到应用服务器\n\n由于 SOA Suite\
    \ 和 BPEL Process Manager 服务器托管在应用服务器上（例如 Oracle Application Server、Oracle WebLogic\
    \ Server），第一步是访问应用服务器主页：\n\n- 1. 导航到 http://<Grid_Control_server_name>:<server_port>/em。\n\
    - 2. 以 sysman 身份登录。使用安装期间设置的密码。\n- 3. 点击“目标”选项卡。\n- 4. 点击“中间件”子选项卡。\n\n![](img/7529bbd615e859608c21b965162348b2_31_0.png)\n\
    \n> 这是企业内所有受监控应用服务器（Oracle AS、BEA WebLogic 等）的视图。对于每个目标，都会汇总状态摘要、详细信息、警报、策略违规以及主机上的\
    \ CPU 使用率和内存使用率。\n\n### 发现 BPEL PM 目标\n\n管理员需要通知 Grid Control 明确发现应用服务器以及相关目标，如\
    \ BPEL PM。在尝试发现之前，必须在安装了应用服务器软件的主机上安装 Grid Control Agent（10.2.0.3 或更高版本）。请注意，也可以使用远程代理来发现应用服务器。使用远程代理的唯一缺点是不会采集应用服务器机器的主机和操作系统指标。\n\
    \n- 1. 如以下屏幕截图所示，从右侧的下拉列表中添加一个 Oracle Application Server 目标。点击“Go”。\n\n![](img/7529bbd615e859608c21b965162348b2_32_0.png)\n\
    \n- 2. 在“添加应用服务器”页面上：\n  - 点击放大镜图标选择主机。\n  - 在弹出窗口中，选择主机的单选按钮并点击“Select”，如以下屏幕截图所示：\n\
    \n![](img/7529bbd615e859608c21b965162348b2_33_0.png)\n\n- 3. 在 **添加应用服务器** 页面上，右侧点击\
    \ **继续**。\n- 4. 在 **发现应用服务器：结果** 页面上，点击 **确定**。\n- 5. 在很短的时间内，您应该会得到一个确认页面。点击\
    \ **确定**。\n- 6. 在 **应用服务器** 页面上，点击 **展开全部** 并查看您的应用服务器。\n\n> 请注意此应用服务器的组件。请注意两个\
    \ OC4J 目标以及 Oracle BPEL Process Manager 目标。\n\n![](img/7529bbd615e859608c21b965162348b2_34_0.png)\n\
    \n### 导航到 BPEL PM 目标主页\n\nBPEL PM 目标是应用服务器目标的子目标。有多种方法可以导航到 BPEL PM 目标的主页；最常见的方法是点击\
    \ Oracle BPEL Process Manager 目标名称超链接。\n\n> 在 Oracle BPEL Process Manager 主页上，您将看到“状态”标签，其中显示\
    \ BPEL PM 服务器的可用性状态、可用性（%）（最近 24 小时）、Oracle 主目录和主机。\n\n![](img/7529bbd615e859608c21b965162348b2_35_0.png)\n\
    \n### 配置 BPEL PM 目标\n\n一旦发现 BPEL PM 目标，管理员需要为目标提供基本配置信息。这使得 Grid Control 中的 BPEL\
    \ 目标能够与 BPEL PM 服务器通信。这种通信是必要的，因为 BPEL 目标通过 API 轮询 BPEL PM 服务器来收集开箱即用的监控指标数据。\n\
    \n- 1. 在底部 **相关链接** 部分下，点击 **监控配置**。\n- 2. 将 BPEL Process Manager 的管理员用户名输入为 **oc4jadmin**。\n\
    - 3. 将管理员密码输入为 *welcome1*。\n- 4. 将 **初始上下文工厂** 输入为 **com.evermind.server.rmi.RMIInitialContextFactory**。\n\
    - 5. 将 **上下文提供程序 URL** 输入为 **opmn:ormi://<Application_Server_Host_Name>:6003:oc4j_soa/orabpel**。\n\
    - 6. 将其他字段留空并点击“确定”，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_36_0.png)\n\
    \n这完成了在 Oracle Application Server 上部署的 BPEL PM 目标的发现和配置。\n\n### 摘要\n\n发现是企业中管理目标的第一步。从单个控制台发现和管理多个目标是一种强大的方法，可以在保持标准化管理平台的同时快速掌握新项目。这避免了为增加受管目标数量的新项目聘用新的管理员。\n\
    \n在本章中，我们研究了如何发现和配置 BPEL PM 目标。\n\n这些是启用后续管理任务的强制性步骤。我们通过发现应用服务器（在本例中为 Oracle\
    \ Application Server）间接发现了 BPEL PM 目标。请注意，发现过程对于发现安装在 WebLogic 和 WebSphere 应用服务器上的\
    \ BPEL PM 目标是相似的。有关基于 WebLogic 和 WebSphere 应用服务器的 BPEL PM 的详细发现信息（包括 10.2.0.4\
    \ 补丁）列在 Oracle Technology Network 上的以下文档中：\n\n```\nhttp://download.oracle.com/docs/cd/B16240_01/doc/em.102/e12650/toc.htm.\n\
    ```\n\n接下来的几章将演示动手练习，以设置并执行对已发现的 BPEL PM 目标的额外管理任务。\n"
