  - '[PAGE 142]


    > Now that an Oracle Application Server Cluster has been added to Grid Control,
    you can use the cluster as a reference or source for performing a wide range of
    operations. For the purpose of this exercise, we will use the discovered cluster
    to create a "gold image" component in the Grid Control Software Library, and then
    use the gold image component in the library to create a new Oracle Application
    Server Cluster target.


    # Stopping application server processes


    Stopping the application server processes is recommended in order to take a copy
    of the data and the configuration.


    > Prior to creating a gold image component or creating a new cluster via cloning,
    you should first stop the existing, installed application server processes already
    running on the machine.


    To stop the Oracle Application Server processes, follow these steps:


    +   1. Log in as the application server owner on the Linux or Windows machine
    (for example, oracle).

    +   2. Navigate to the bin directory, that is, `cd/u01/app/oracle/product/OracleHomes/soa/opmn/bin.`

    +   3. Stop the application server processes by using: `./opmnctl stopall.`

    +   4. From the application server home page, you can validate that all components
    of the instance have been stopped.


    > If the application server instance status continues to read Up, click on the
    Refresh icon on the page.'
