  - '[PAGE 193]


    # Summary


    Recording and monitoring critical end-user paths is a proactive approach to increasing
    end-user satisfaction. In a global economy, enterprises need to ensure users can
    get the information they want, when they want it, from anywhere in the world.
    A management solution is incomplete without a synthetic monitoring strategy.


    In this chapter, we discussed how to create web applications, record web transactions,
    and use specific metrics for performance and usage purposes. Further, we also
    discussed how to configure running these synthetic transactions from various agents
    or Beacons. Finally, we discussed how to view a web transaction to review and
    verify all the steps.


    Synthetic service-test monitoring within Grid Control is complemented by passive
    real-user monitoring. Enterprise Manager''s Real User Experience Insight (from
    the Moniforce acquisition) is a great tool in this area. More information on Real
    User Experience Insight can be found on the Oracle Technology Network.'
