    \ 资源** 指定队列、配置时最大/最小字节大小、JNDI 名称等。\n- **虚拟主机** 显示配置时主机列表。\n- **杂项** 显示启动/关闭类、Jolt\
    \ 连接池和工作管理器信息。\n- **配置文件** 显示托管服务器的关键配置文件的列表。\n- 深入配置一个配置文件以查看其内容。\n\n![](img/7529bbd615e859608c21b965162348b2_230_0.png)\n\
    \n## 保存托管服务器配置快照\n\n标准化托管服务器配置对于确保多个安装之间具有可预测的行为非常重要。标准化的第一步是在 Grid Control 仓库中保存一个现有且可信的配置，以便将其用作与其他配置进行比较的基线：\n\
    \n- 1. 深入配置一个配置文件以查看其内容\n- 2. 单击右上角的 **保存** 按钮。\n- 3. 选择 **保存到企业管理器存储库** 选项。\n\
    - 4. 输入类似 **ManagedServerGoldConfig** 的描述，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_231_0.png)\n\
    \n- 5. 单击确定以将当前配置保存到 EM 仓库。\n- 6. 注意确认消息以及带有时间戳、名称、描述、保存日期和所有者的已保存配置。\n\n## 查看和保存\
    \ OSB 配置\n\n与 WebLogic 托管服务器目标类似，我们也可以查看 OSB 目标的最新配置，并将已知且可信的配置保存到 Grid Control\
    \ 仓库中：\n\n- 1. 导航到 OSB 目标的配置管理部分：\n  - 导航到 OSB 目标主页。\n  - 在底部，在配置下，单击查看配置选项卡。\n\
    - 2. 查看 OSB 目标的最后收集配置：\n  - 显示 OSB 服务器的当前配置。\n  - 注意 JMS 队列信息（特定于 OSB 的队列）。\n\
    \  - OSB 前端配置和全局操作设置捕获在 OSB 控制台上设置的关键参数。\n\n每个已部署服务的代理和业务服务配置都会显示。\n\n![](img/7529bbd615e859608c21b965162348b2_232_0.png)\n\
    \n- 3. 将配置快照保存到仓库：\n  - 单击保存按钮以保存当前配置。\n  - 选择保存到 EM 仓库选项。\n  - 提供类似 OSBGoldConfig\
    \ 的描述。\n  - 单击确定以将当前配置保存到 EM 仓库。\n  - 注意确认消息以及带有目标名称、目标类型和时间戳的已保存配置。\n\n## 将当前\
    \ OSB 配置与已保存的基线进行比较\n\n一旦 OSB 配置快照已保存在 Grid Control 中，它就可以用作与其他 OSB 目标进行比较的标准。通常，有用的是将静态可信快照与最新配置进行比较，以便查看与已知可信状态的偏差。\n\
    \n> 要查看配置更改，您必须在尝试本节之前在 OSB 控制台上进行一些更改。例如，登录到 OSB 控制台，并更改“全局设置”以及一些业务和代理服务配置。然后您可以尝试本节以查看\
    \ Grid Control 中捕获的更改。\n\n- 1. 更新最新配置：\n  - 导航到 OSB 目标主页。\n  - 单击底部的查看配置链接。\n\
    \  - 单击刷新按钮以获取最新配置更新。\n  - 等待一分钟。Grid Control 代理与 OSB 服务器交互以获取最新信息并在页面上显示。\n-\
    \ 2. 启动配置比较：\n  - 单击比较按钮开始在 OSB 目标的当前配置与已保存的（“OSBGold Config”）配置之间进行比较。\n  - 单击已保存配置链接。\n\
    \  - 选择 OSBGoldConfig 进行比较。\n\n![](img/7529bbd615e859608c21b965162348b2_233_0.png)\n\
    \n- 3. 单击比较以生成比较结果。\n\n![](img/7529bbd615e859608c21b965162348b2_233_1.png)\n\n\
    - 4. 使用已保存基线查看 OSB 目标比较结果：\n  - OSB 目标之间的比较结果在所有类别中呈现。**摘要** 选项卡列出类别的状态。\n  -\
    \ 注意各种参数用红色 *不等号* 标记的差异。\n\n## 将当前托管服务器配置与已保存的基线进行比较\n\n正如我们将 OSB 服务器配置与已保存快照进行比较一样，我们也可以将\
    \ WebLogic 托管服务器目标与已保存快照进行比较。这将使我们能够在 WebLogic 级别识别配置差异。\n\n> 要查看配置更改，您必须在尝试本节之前在\
    \ WebLogic 管理控制台上进行一些更改。例如，登录到管理控制台，并更改相关托管服务器的一些设置。然后您可以尝试本节以查看 Grid Control\
    \ 中捕获的更改。\n\n- 1. 更新最新配置：\n  - 导航到托管服务器目标主页。\n  - 单击 **管理** 选项卡。\n  - 单击 **最后收集的配置**\
    \ 按钮以获取最新配置更新。\n  - 单击 **刷新** 以更新最新配置。\n  - 等待一分钟。\n- 2. 启动配置比较：\n  - 单击 **比较**\
    \ 按钮开始在托管服务器目标的当前配置与已保存的（**ManagedServerGoldConfig**）配置之间进行比较。\n  - 单击 **已保存配置**\
    \ 链接。\n  - 选择 **ManagedServerGoldConfig** 进行比较。\n\n- 3. 查看当前与已保存配置之间的差异：\n  -\
    \ 单击 **配置文件**。\n  - 选择 **config.xml**。\n  - 单击 **比较文件内容**。\n  - 观察标红的差异。\n\n![](img/7529bbd615e859608c21b965162348b2_235_0.png)\n\
