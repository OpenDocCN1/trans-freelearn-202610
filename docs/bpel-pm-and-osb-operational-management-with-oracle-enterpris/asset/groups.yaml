  - '[PAGE 169]


    # Summary


    Managing the lifecycle of software and services is a time-consuming and error-prone
    task. Administrators can spend several days and weeks planning and implementing
    provisioning and patching tasks. Grid Control greatly simplifies these complex
    tasks so that administrators can focus on more strategic areas, and the enterprise
    can be more agile in managing the lifecycle of software and services.


    In this chapter, we discussed the steps to clone Oracle Application Server and
    SOA Suite. Specifically, we discussed adding an Oracle Application Server cluster
    to Grid Control, stopping application server processes, making a copy of the application
    server and storing it in the Grid Control Software Library, cloning the application
    server and SOA Suite, and finally validating the newly created cluster. It’s important
    to note that Grid Control copies the data and the configurations from the source
    to the target cluster. The provisioning and cloning solutions are complemented
    by patching solutions. New features include similar coverage for the SOA Suite
    on Oracle WebLogic server, post the BEA acquisition, which provides administrators
    relief in managing SOA deployments on WebLogic server.'
