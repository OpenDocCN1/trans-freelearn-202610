    # 13


    # OSB Proxy and Business Service Monitoring


    Oracle Service Bus is one of the premier **Enterprise Service Bus (ESB)** systems
    available in the marketplace. It follows the typical ESB paradigm of validate,
    enrich, and transform (VET). Often, OSB acts as the provider to one or more consumers
    for business critical services.


    Monitoring provides visibility and the means to measure availability and performance,
    and hence evaluate service-level agreements between providers and consumers. This
    chapter talks about monitoring OSB proxy and business services. Specifically,
    this chapter talks about:


    +   - Challenges

    +   - Solution

    +   - Step-by-step exercises:

    +     - Creating an OSB infrastructure service

    +     - Navigating to the OSB proxy service home page

    +     - Creating the OSB proxy aggregate service

    +     - Creating a SOAP test to monitor a OSB proxy service endpoint

    +     - Creating a SOAP test to monitor a OSB business service endpoint

    +     - Testing the SOAP tests'
  - '[PAGE 216]


    # Challenges


    For any small, medium, or large enterprise, it''s a challenge to monitor several
    disparate application, middleware, and database targets from a single console.
    The traditional hardware and software components such as servers, storage devices,
    operating systems, databases, middleware, and applications have been monitored
    by system management solutions. With the rise of integration software such as
    BPEL and OSB, applications and infrastructure pose new problems. First, they need
    to be monitored along with existing hardware and software. Second, as the WebLogic
    domains and OSB projects proliferate across the enterprise, the infrastructure
    team is faced with increasing problems to manage these projects. Thirdly, for
    the administrators who are new to OSB, supporting these environments in production
    poses unknown challenges. Finally, the IT managers want to avoid hiring new administrators
    with increasing OSB projects.


    # Solution


    Grid Control provides monitoring capabilities for WebLogic and OSB components
    whether it is in development, test, stage, or production. For the infrastructure
    team, this is a convenient way to monitor several installations from one console.
    Once the Grid Control agent is installed on the server hosting WebLogic Admin
    Server, the discovery process can be initiated from the console. Post discovery,
    the infrastructure components and OSB services can be monitored from Grid Control.


    # Step-by-step exercises


    This set of step-by-step exercises will walkthrough monitoring proxy and business
    services.


    # Creating an OSB Infrastructure Service


    The OSB infrastructure service provides a useful grouping to monitor relevant
    OSB and WebLogic components as a whole. Grid Control takes care of identifying
    the relationships among the infrastructure components and putting them in one
    bucket.


    +   1. From the Grid Control home page, click on **Targets** | **Middleware**.

    +   2. Expand the WebLogic Server Domain target of your choice and click on the
    OSB target.

    +   3. From the OSB target home page, click on the **Create Infrastructure Service**
    button.'
  - '[PAGE 217]


    4. On the Create Service page, enter a Service Name such as osb_infra and click
    on OK, as shown in the following screenshot:


    ![](img/7529bbd615e859608c21b965162348b2_217_0.png)


    5. You should get a confirmation message. Click on OK.


    > The infrastructure service encapsulates the key underlying logical components
    of the OSB instance. For the OSB instance and services to work smoothly, the underlying
    infrastructure must work smoothly as well. Observe the newly created system and
    service, status of system and service, alerts, and policy violations.


    # Navigating to the OSB proxy service home page


    Proxy services perform the heavy lifting for the OSB. They are created to validate,
    enrich, and transform messages coming into the service bus. It is extremely important
    for the administrator to have visibility and understanding of the OSB proxy services.


    1. From the OSB target home page, click on the OSB Services tab.


    > All the OSB services deployed on the server are automatically discovered and
    displayed here. Summary throughput process instance information is also displayed
    in the table. These metric values are collected at a frequency controlled by the
    "Collection Interval" directly from the OSB server and stored in the Grid Control
    metric repository. It is possible to drill down on any metric to view trends for
    different functions such as minimum, maximum, or average values over a specific
    time range.'
  - '[PAGE 218]


    ![](img/7529bbd615e859608c21b965162348b2_218_0.png)


    2. Click on any of the deployed proxy services within a project, for example,
    loanGateway3 proxy service under the MortgageBroker project.


    > This is the individual OSB proxy service page. Note the proxy specific instance
    throughput graph. At the bottom, note that all the references for the proxy are
    discovered along with the business services, endpoints, protocols, load-balancing
    algorithms, weight, and so on.


    # Creating the OSB proxy aggregate service


    An aggregate service is a useful structural entity in Grid Control to provide
    a relationship and hierarchy among OSB proxy, business, and infrastructure services.
    When troubleshooting a problem, it is useful not only to know the state of a proxy
    service, but also the state of the supporting infrastructure.


    +   1. From the OSB proxy page, under EM Services click on the Create Service
    button.

    +   2. Notice the confirmation message, and the aggregate service that has been
    added.'
