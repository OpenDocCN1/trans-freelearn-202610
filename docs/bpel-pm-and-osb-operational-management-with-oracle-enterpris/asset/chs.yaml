  - 注意 **状态** 和 **完成日期** 值。\n\n![](img/7529bbd615e859608c21b965162348b2_212_0.png)\n\
  \n9. 在 Grid Control 中查看已部署的项目：\n- 导航到 OSB 目标主页。\n- 点击 **OSB 服务** 选项卡。\n- 点击右上角的\
  \ **刷新** 按钮。\n- 在列表中注意新部署的项目。\n\n![](img/7529bbd615e859608c21b965162348b2_213_0.png)\n\
  \n## 摘要\n\n部署是 WebLogic 管理员的一项关键任务。借助 Grid Control 软件库和部署流程功能，管理员可以管理 WebLogic 和\
  \ OSB 项目，并安排和自动化部署。\n\n在本章中，我们介绍了处理应用程序代码部署（如 OSB 项目部署）的各种管理挑战。Grid Control 为管理员自动化部署流程，从而节省时间并减少人为错误。首先我们查看了\
  \ Grid Control 软件库，然后将新的 OSB 项目上传到该库，然后启动了实际的部署流程。最后，我们查看了部署流程作业的执行情况，并通过 OSB 控制台验证了完成和成功部署。\n\
  \n接下来的几章将介绍管理 OSB 中的其他领域，例如监控服务、管理配置和服务级别。\n\n## 13\n\n## OSB 代理和业务服务监控\n\nOracle\
  \ Service Bus 是市场上领先的 **企业服务总线 (ESB)** 系统之一。它遵循典型的 ESB 范式，即验证、丰富和转换（VET）。通常，OSB\
  \ 作为一个或多个消费者业务关键服务的提供者。\n\n监控提供可见性以及衡量可用性和性能的手段，从而评估提供者和消费者之间的服务水平协议。本章介绍监控 OSB\
  \ 代理和业务服务。具体来说，本章介绍：\n\n- 挑战\n- 解决方案\n- 分步练习：\n  - 创建 OSB 基础设施服务\n  - 导航到 OSB 代理服务主页\n\
  \  - 创建 OSB 代理聚合服务\n  - 创建 SOAP 测试以监控 OSB 代理服务端点\n  - 创建 SOAP 测试以监控 OSB 业务服务端点\n\
  \  - 测试 SOAP 测试\n\n### 挑战\n\n对于任何小型、中型或大型企业来说，从单个控制台监控多个不同的应用程序、中间件和数据库目标都是一个挑战。传统的硬件和软件组件，如服务器、存储设备、操作系统、数据库、中间件和应用程序，一直由系统管理解决方案进行监控。随着\
  \ BPEL 和 OSB 等集成软件的兴起，应用程序和基础设施带来了新的问题。首先，它们需要与现有硬件和软件一起进行监控。其次，随着 WebLogic 域和 OSB\
  \ 项目在企业中不断扩展，基础设施团队面临着管理这些项目日益增加的问题。第三，对于刚接触 OSB 的管理员来说，在生产环境中支持这些环境带来了未知挑战。最后，IT\
  \ 管理员希望避免随着 OSB 项目的增加而聘用新的管理员。\n\n### 解决方案\n\nGrid Control 为 WebLogic 和 OSB 组件提供监控功能，无论是在开发、测试、预生产还是生产环境中。对于基础设施团队来说，这是一种从一个控制台监控多个安装的便捷方式。一旦在托管\
  \ WebLogic 管理服务器的服务器上安装了 Grid Control 代理，即可从控制台启动发现过程。发现后，基础设施组件和 OSB 服务可以从 Grid\
  \ Control 进行监控。\n\n### 分步练习\n\n这组分步练习将介绍监控代理和业务服务。\n\n### 创建 OSB 基础设施服务\n\nOSB 基础设施服务提供了一个有用的分组，用于整体监控相关的\
  \ OSB 和 WebLogic 组件。Grid Control 会负责识别基础设施组件之间的关系并将它们放在一个组中。\n\n1. 从 Grid Control\
  \ 主页，点击 **目标** | **中间件**。\n2. 展开您选择的 WebLogic Server 域目标并点击 OSB 目标。\n3. 从 OSB 目标主页，点击\
  \ **创建基础设施服务** 按钮。\n\n4. 在创建服务页面，输入服务名称，例如 osb_infra，然后点击确定，如以下截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_217_0.png)\n\
  \n5. 您应该会收到确认消息。点击确定。\n\n> 基础设施服务封装了 OSB 实例的关键底层逻辑组件。为了使 OSB 实例和服务顺利运行，底层基础设施也必须顺利运行。观察新创建的系统和服务、系统和服务状态、警报以及策略违规。\n\
  \n### 导航到 OSB 代理服务主页\n\n代理服务为 OSB 执行繁重的工作。它们用于验证、丰富和转换进入服务总线的消息。管理员对 OSB 代理服务具有可见性和理解非常重要。\n\
  \n1. 从 OSB 目标主页，点击 OSB 服务选项卡。\n\n> 服务器上部署的所有 OSB 服务都会在此自动发现并显示。表中还显示了汇总吞吐量进程实例信息。这些指标值以由“Collection\
  \ Interval”控制的频率直接从 OSB 服务器收集并存储在 Grid Control 指标存储库中。可以深入查看任何指标，以查看特定时间范围内不同功能的趋势，例如最小值、最大值或平均值。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_218_0.png)\n\n2. 点击项目中任何已部署的代理服务，例如 MortgageBroker\
  \ 项目下的 loanGateway3 代理服务。\n\n> 这是单个 OSB 代理服务页面。请注意代理特定的实例吞吐量图。在底部，请注意代理的所有引用都已发现，包括业务服务、端点、协议、负载平衡算法、权重等。\n\
  \n### 创建 OSB 代理聚合服务\n\n聚合服务是 Grid Control 中一个有用的结构实体，用于在 OSB 代理、业务和基础设施服务之间提供关系和层次结构。在排除问题时，了解代理服务的状态以及支持基础设施的状态都很有用。\n\
  \n1. 从 OSB 代理页面，在 EM 服务下点击创建服务按钮。\n2. 注意确认消息以及已添加的聚合服务。\n\n\n\n\n![](img/7529bbd615e859608c21b965162348b2_219_0.png)\n\
  \n> 请注意，已创建的聚合服务列在 Services 部分下。之前创建的基础设施服务已自动与聚合服务关联。在 Services 部分，从左侧开始，您可以看到服务名称、服务类型、状态和其他警报。顶级服务是聚合服务。下一个服务是基础设施服务——聚合服务的子服务。\n\
  \n## 创建 SOAP 测试以监控 OSB 代理服务端点\n\n从客户端或终端用户角度监控代理服务对于运维团队非常重要。这有助于团队在客户端或终端用户报告错误之前就收到警报。\n\
  \n> SOAP（Simple Object Access Protocol，简单对象访问协议）测试是一种检查具有 SOAP 接口的 Web 服务可用性和性能的方法。此远程合成检查会调用\
  \ Web 服务中 WSDL（Web Service Description Language，Web 服务描述语言）定义的某个操作，并测量 HTTP 响应代码和延迟。\n\
  \n- 1. 滚动到 References 部分，并从单选按钮列表中选择 loanGateway3。\n\n## OSB 代理和业务服务监控\n\n- 2. 点击\
  \ Add SOAP Test 按钮为该服务创建 SOAP 测试。\n\n![](img/7529bbd615e859608c21b965162348b2_220_0.png)\n\
  \n- 3. 对于 Collection Frequency 字段，输入 3 分钟。\n\n- 4. 在 Input Parameters 下，点击 XML Source。\n\
  \n- 5. 输入代理服务负载。这是代理服务执行其业务所需的 XML 输入。\n\n> 代理服务负载可以通过通过 OSB 控制台对代理进行简单测试来生成。输入在测试页面中输入后，控制台会生成可作为\
  \ SOAP 测试输入使用的 XML 负载。\n\n- 6. 将 Basic Authentication Credentials 部分留空。\n\n- 7.\
  \ 点击 Continue，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_221_0.png)\n\
  \n- 8. 要添加 Beacon，请点击 Add 按钮。\n\n- 9. 从弹出窗口中，勾选一个或多个可用的 Beacons 并点击 Select，如以下屏幕截图所示：\n\
  \n![](img/7529bbd615e859608c21b965162348b2_221_1.png)\n\n- 10. 点击 OK 保存 SOAP 测试和\
  \ Beacon 设置。\n\n- 11. 在 OSB 代理主页上，注意自动创建的通用可用性服务。\n\n> OSB 代理的可用性服务是在创建第一个 SOAP\
  \ 测试时形成的。请注意每个测试的状态，以及如何汇总（可配置）以确定流程可用性。\n\n- 12. 展开 loanGateway3_availability 并验证之前步骤中创建的\
  \ SOAP 测试是否已添加。\n\n> 请注意，SOAP 测试的状态显示需要一些时间，具体取决于为测试设置的频率。\n\n![](img/7529bbd615e859608c21b965162348b2_222_0.png)\n\
  \n## 创建 SOAP 测试以监控 OSB 业务服务端点\n\n业务服务为代理服务提供端点外观。使用与代理服务监控类似的 SOAP 测试监控它们非常重要。\n\
  \n- 1. 创建业务服务 SOAP 测试以监控业务服务端点。\n- 2. 转到 loanGateway3 代理页面。\n- 3. 滚动向下并选择其中一个业务服务端点，例如\
  \ normalLoanProcessor 业务服务下的 localhost:7021 单选按钮。\n- 4. 点击 Add SOAP Test 为业务服务创建\
  \ SOAP 测试。\n\n![](img/7529bbd615e859608c21b965162348b2_223_0.png)\n\n- 5. 将收集频率更改为所需分钟数，例如\
  \ 3。\n- 6. 保留已选择的默认端口。\n- 7. 在 Input Parameters 下，点击 XML Source。\n- 8. 输入之前保存的业务服务负载。\n\
  - 9. 将 Basic Authentication Credentials 部分留空。\n\n![](img/7529bbd615e859608c21b965162348b2_223_1.png)\n\
  \n- 10. 点击 OK 完成服务测试的创建。\n- 11. 观察确认消息。\n\n- 12. 展开可用性服务以查看业务服务端点的 SOAP 测试。\n\n\
  ![](img/7529bbd615e859608c21b965162348b2_224_0.png)\n\n## 测试 SOAP 测试\n\n一旦创建了 SOAP\
  \ 测试，Grid Control 提供了按需运行任何 SOAP 测试的功能，以测试底层服务的可用性和性能。\n\n- 1. 点击您创建的其中一个 SOAP 测试。\n\
  \n> 测试页面显示测试可用性、运行此测试的 Beacons 以及与此测试关联的警报。图表显示来自 beacon 的测试响应时间。请注意，测试指标在测试主页上显示需要一些时间。一个或多个\
  \ Beacons 可用于测试服务，可能来自模拟用户群体的多个地理位置。\n\n![](img/7529bbd615e859608c21b965162348b2_225_0.png)\n\
  \n- 2. 点击 **Verify Service Test** 按钮。\n- 3. 点击 **Perform Test** 立即运行测试并查看结果，如以下屏幕截图所示：\n\
  \n![](img/7529bbd615e859608c21b965162348b2_225_1.png)\n\n## 摘要\n\n监控 OSB 代理和业务服务对于保证企业关键业务流程健康以及维护提供者到消费者的关系至关重要。在本章中，我们研究了如何使用基于代理的监控和合成测试来监控\
  \ OSB 代理和业务服务。为了监控 OSB 服务，必须创建适当的 Grid Control 服务映射。我们创建了 OSB 基础设施服务，访问代理服务主页以查看发现的服务，并创建了\
  \ OSB 代理聚合服务。Grid Control 服务设置完成后，我们创建了 SOAP 测试以监控代理和业务服务端点。最后，我们测试了创建的 SOAP 测试。\n\
  \n接下来的几章将逐步介绍动手练习，以对 Oracle Service Bus 执行额外的管理任务。\n"
- "## 14 WebLogic 和 OSB 配置管理\n\n管理中间件环境的配置对于中小型和大型企业来说是一个困难的命题。“了解你拥有什么”使 IT 管理员能够就未来投资和淘汰旧资产做出决策，标准化现有资产，在整个企业中管理变更，并排除与配置相关的性能问题。\n\
  \n大多数配置管理解决方案今天都符合 **IT 信息库 (ITIL)** 框架规定的最佳实践。所有资产都存储在称为 **配置管理数据库 (CMDB)** 的中央存储库中。配置参数（如数据库的实例参数、WebLogic\
  \ 应用服务器的启动参数或 HTTP 服务器的端口号）存储在 CMDB 中。对这些参数的任何更改也会被跟踪。然后很容易审计特定资产的更改，将资产相互比较（例如，托管服务器\
  \ 1 和托管服务器 2），比较同一资产的不同版本，将参考配置保存到 CMDB，并用它在整个企业中进行标准化。本章讨论 WebLogic 和 OSB 环境的配置管理。具体来说，本章讨论：\n\
  \n- 挑战\n- 解决方案\n- 逐步练习：\n  - 查看 WebLogic 托管服务器配置\n  - 保存托管服务器配置快照\n  - 查看和保存 OSB\
  \ 配置\n  - 将当前 OSB 配置与保存的基线进行比较\n  - 将当前托管服务器配置与保存的基线进行比较\n\n## 挑战\n\n很难跟踪所有 IT 系统的配置。通常，IT\
  \ 部门会求助于 Excel 电子表格来存储关键的中间件配置信息。这使得 IT 部门在进行更改、衡量影响、识别因配置不正确导致的性能问题方面变得缓慢，并增加了管理数据中心的成本。对于\
  \ WebLogic 和 OSB 环境，很难维护多个域以及底层配置的配置。对于中大型 WebLogic 安装，基线化一个工作配置并将其与非工作配置进行比较以进行部门或企业范围的定制非常重要。对于\
  \ OSB，跨不同项目版本维护代理和业务服务配置的额外挑战。在缺乏对配置的控制的情况下，很难评估新项目版本对生产的影响，以及可能与配置更改相关的生产问题的故障排除。\n\
  \n## 解决方案\n\n使用 Grid Control，WebLogic 和 OSB 服务器进程的关键配置指标被收集并存储在 Enterprise Manager\
  \ 存储库中。管理员可以查看 WebLogic 和 OSB 环境中历史配置更改。他们还可以通过将配置保存在存储库中来基线化工作配置。WebLogic Admin、托管服务器和\
  \ OSB 服务器配置参数可以与其他服务器进行比较。最后，还可以比较 OSB 项目版本以观察更改并评估连续部署中的影响。\n\n## 分步练习\n\n这组逐步练习将逐步介绍\
  \ WebLogic 和 OSB 服务器目标的配置管理。\n\n## 查看 WebLogic 托管服务器配置\n\n在响应式故障排除练习中（通常与监控警报相关），管理员问的第一个问题之一是“发生了什么变化？”在查看更改之前，有用的是查看系统的当前配置，以确定是否有任何明显的错误设置：\n\
  \n- 1. 导航到 **Targets | Middleware** 选项卡。\n- 2. 点击 **Oracle WebLogic Managed Server**\
  \ 链接。\n\n\n\n\n- 3. 这会带您进入托管服务器主页。\n- 4. 单击管理标签页。\n- 5. 注意目标相关的配置管理链接。\n\n> Grid\
  \ Control 配置管理框架每天都会收集 WebLogic 组件（包括托管服务器和管理员服务器）的关键配置参数。这些参数存储在 Grid Control 仓库中。关键配置任务可从此处访问。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_229_0.png)\n\n- 6. 请注意，您可以从此处启动配置搜索，用于数据源、应用程序、J2EE\
  \ 模块、端口等。\n\n- 7. 查看托管服务器的最后收集配置：\n- 单击 **最后收集的配置** 以查看配置参数。\n- 在 **最后收集的配置** 页面上查看配置设置。\n\
  - **通用** 选项卡显示有关服务器的通用信息，包括端口、资源使用情况、调优参数、JVM 信息和集群参数。\n- **应用程序** 选项卡列出已部署的应用程序以及路径。它还显示模块、类型、URL\
  \ 映射和会话超时信息。\n- **JDBC 资源** 显示连接池和数据源的列表。\n- **JMS 资源** 指定队列、配置时最大/最小字节大小、JNDI 名称等。\n\
  - **虚拟主机** 显示配置时主机列表。\n- **杂项** 显示启动/关闭类、Jolt 连接池和工作管理器信息。\n- **配置文件** 显示托管服务器的关键配置文件的列表。\n\
  - 深入配置一个配置文件以查看其内容。\n\n![](img/7529bbd615e859608c21b965162348b2_230_0.png)\n\n##\
  \ 保存托管服务器配置快照\n\n标准化托管服务器配置对于确保多个安装之间具有可预测的行为非常重要。标准化的第一步是在 Grid Control 仓库中保存一个现有且可信的配置，以便将其用作与其他配置进行比较的基线：\n\
  \n- 1. 深入配置一个配置文件以查看其内容\n- 2. 单击右上角的 **保存** 按钮。\n- 3. 选择 **保存到企业管理器存储库** 选项。\n-\
  \ 4. 输入类似 **ManagedServerGoldConfig** 的描述，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_231_0.png)\n\
  \n- 5. 单击确定以将当前配置保存到 EM 仓库。\n- 6. 注意确认消息以及带有时间戳、名称、描述、保存日期和所有者的已保存配置。\n\n## 查看和保存\
  \ OSB 配置\n\n与 WebLogic 托管服务器目标类似，我们也可以查看 OSB 目标的最新配置，并将已知且可信的配置保存到 Grid Control\
  \ 仓库中：\n\n- 1. 导航到 OSB 目标的配置管理部分：\n  - 导航到 OSB 目标主页。\n  - 在底部，在配置下，单击查看配置选项卡。\n\
  - 2. 查看 OSB 目标的最后收集配置：\n  - 显示 OSB 服务器的当前配置。\n  - 注意 JMS 队列信息（特定于 OSB 的队列）。\n  -\
  \ OSB 前端配置和全局操作设置捕获在 OSB 控制台上设置的关键参数。\n\n每个已部署服务的代理和业务服务配置都会显示。\n\n![](img/7529bbd615e859608c21b965162348b2_232_0.png)\n\
  \n- 3. 将配置快照保存到仓库：\n  - 单击保存按钮以保存当前配置。\n  - 选择保存到 EM 仓库选项。\n  - 提供类似 OSBGoldConfig\
  \ 的描述。\n  - 单击确定以将当前配置保存到 EM 仓库。\n  - 注意确认消息以及带有目标名称、目标类型和时间戳的已保存配置。\n\n## 将当前 OSB\
  \ 配置与已保存的基线进行比较\n\n一旦 OSB 配置快照已保存在 Grid Control 中，它就可以用作与其他 OSB 目标进行比较的标准。通常，有用的是将静态可信快照与最新配置进行比较，以便查看与已知可信状态的偏差。\n\
  \n> 要查看配置更改，您必须在尝试本节之前在 OSB 控制台上进行一些更改。例如，登录到 OSB 控制台，并更改“全局设置”以及一些业务和代理服务配置。然后您可以尝试本节以查看\
  \ Grid Control 中捕获的更改。\n\n- 1. 更新最新配置：\n  - 导航到 OSB 目标主页。\n  - 单击底部的查看配置链接。\n  -\
  \ 单击刷新按钮以获取最新配置更新。\n  - 等待一分钟。Grid Control 代理与 OSB 服务器交互以获取最新信息并在页面上显示。\n- 2. 启动配置比较：\n\
  \  - 单击比较按钮开始在 OSB 目标的当前配置与已保存的（“OSBGold Config”）配置之间进行比较。\n  - 单击已保存配置链接。\n  -\
  \ 选择 OSBGoldConfig 进行比较。\n\n![](img/7529bbd615e859608c21b965162348b2_233_0.png)\n\
  \n- 3. 单击比较以生成比较结果。\n\n![](img/7529bbd615e859608c21b965162348b2_233_1.png)\n\n-\
  \ 4. 使用已保存基线查看 OSB 目标比较结果：\n  - OSB 目标之间的比较结果在所有类别中呈现。**摘要** 选项卡列出类别的状态。\n  - 注意各种参数用红色\
  \ *不等号* 标记的差异。\n\n## 将当前托管服务器配置与已保存的基线进行比较\n\n正如我们将 OSB 服务器配置与已保存快照进行比较一样，我们也可以将\
  \ WebLogic 托管服务器目标与已保存快照进行比较。这将使我们能够在 WebLogic 级别识别配置差异。\n\n> 要查看配置更改，您必须在尝试本节之前在\
  \ WebLogic 管理控制台上进行一些更改。例如，登录到管理控制台，并更改相关托管服务器的一些设置。然后您可以尝试本节以查看 Grid Control 中捕获的更改。\n\
  \n- 1. 更新最新配置：\n  - 导航到托管服务器目标主页。\n  - 单击 **管理** 选项卡。\n  - 单击 **最后收集的配置** 按钮以获取最新配置更新。\n\
  \  - 单击 **刷新** 以更新最新配置。\n  - 等待一分钟。\n- 2. 启动配置比较：\n  - 单击 **比较** 按钮开始在托管服务器目标的当前配置与已保存的（**ManagedServerGoldConfig**）配置之间进行比较。\n\
  \  - 单击 **已保存配置** 链接。\n  - 选择 **ManagedServerGoldConfig** 进行比较。\n\n- 3. 查看当前与已保存配置之间的差异：\n\
  \  - 单击 **配置文件**。\n  - 选择 **config.xml**。\n  - 单击 **比较文件内容**。\n  - 观察标红的差异。\n\n\
