  \n## 添加 Beacon 以运行服务测试\n\n一旦 Web 事务已创建，我们需要设置代理或 Beacon 来触发这些事务，以便 Grid Control\
  \ 可以记录并报告事务指标：\n\n- 1. 单击 **Continue** 以查看服务测试。\n\n![](img/7529bbd615e859608c21b965162348b2_182_0.png)\n\
  \n- 2. 再次单击 **Continue**。\n\n![](img/7529bbd615e859608c21b965162348b2_182_1.png)\n\
  \n- 3. 单击 Next 以现在选择 Beacon。\n\n> Beacon 是配置为通过运行已记录的服务测试来模拟端用户行为的 Grid Control\
