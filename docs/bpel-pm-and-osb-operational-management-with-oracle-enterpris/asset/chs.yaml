- "## 1 Grid Control、BPEL 和 OSB 概述\n\n硬件、软件和应用程序组件的管理很重要。在经济不景气时期，最大化软件和硬件投资回报至关重要，为此企业需要健全的管理策略。管理解决方案不仅有助于提高现有投资的回报，还能控制拥有这些投资的成本。当今企业若没有这样的解决方案就无法成功。\n\
  \n在 SOA 世界中，管理更为关键，因为它管理着分布式服务和服务基础设施。如果没有健全的管理策略，就无法实现 SOA 投资的价值。在大多数企业中，运营管理正成为\
  \ SOA 治理框架的核心。如果生产环境缺乏可见性和控制，SOA 项目成本将超过累积收益。管理不能在实施后才作为附加项；它必须是整体解决方案的战略组成部分。在前期就开始思考管理策略并与\
  \ SOA 集成一起实施是有益的。此外，需要分析管理的各个方面，并为企业中的 SOA 集成实施合适的方面。一些关键管理领域包括基础设施监控、合成监控、配置管理、部署自动化和业务流程执行监控。所有这些都需要考虑以确保\
  \ SOA 项目的成功。\n\n在本章中，我们将简要介绍本书中将涵盖的以下产品：\n\n- Grid Control\n  - Overview\n  - Architecture\
  \ and deployment\n  - Download and install\n  - Home page\n- Oracle BPEL Process\
  \ Manager overview\n- Oracle SOA Suite overview\n- Oracle Service Bus overview\n\
  \n### Grid Control\n\nEnterprise Manager Grid Control 提供单一界面，用于管理数千个不同的目标，例如操作系统、数据库、应用服务器和打包应用程序。它确定整体目标健康状况，跟踪目标清单，自动化目标部署并管理服务级别。所有历史监控信息都存储在数据库中，并随时间聚合。这辅以报表和仪表板框架，为管理员和\
  \ IT 经理提供摘要。Grid Control 支持各种硬件、软件和应用程序的监控和管理，确实是 Oracle 产品的首选工具。它还具有监控第三方产品的能力，无论是原生方式还是通过插件和连接器。Grid\
  \ Control 框架可通过插件或连接器进行扩展。这得益于随 Grid Control 一起提供的软件开发工具包。一个插件的良好示例是，如果您想监控 Grid\
  \ Control 不支持的特定硬件组件，您可以扩展框架并添加逻辑来监控您的特定硬件组件。另一方面，连接器可用于将 Grid Control 与其他系统集成，例如事件管理系统（如\
  \ Remedy Helpdesk 或 Oracle 业务活动监控（Oracle BAM））。\n\n本书的大多数章节涵盖 Grid Control 的多个版本。例如服务级别管理、基础设施管理、服务级别仪表板、Web\
  \ 应用程序管理和配置管理等概念在多个 Grid Control 版本中保持一致。尽管如此，本书将重点关注 Grid Control 版本 10.2.0.5，也称为\
  \ 10gR5。该版本于 2009 年 2 月在 Linux 平台上发布，并在当年余下时间移植到其他平台。大多数章节同样适用于之前的 Grid Control\
  \ 10.2.0.4（或 10gR4）版本。显著的例外是处理 Oracle Service Bus 管理的第三部分。用于管理 BPEL Process Manager\
  \ 的 Enterprise Manager 功能是 Grid Control 10.2.0.3 及以上版本的一部分。Oracle Service Bus 管理功能是在\
  \ Grid Control 10.2.0.5 中引入的。\n\n### 架构和部署\n\nGrid Control 采用三层架构。主要组件包括 Oracle\
  \ 管理服务器（OMS）、管理代理（Agent）和 Oracle 管理存储库（OMR）。中央基于 Web 的控制台可通过流行浏览器访问。组件详细说明如下：\n\n\
  - **Oracle Management Server (OMS):** 这是中央引擎，汇总来自所有分布式管理代理的信息。它为基于 Web 的控制台提供数据，并将数据持久化到管理存储库中。此外，OMS\
  \ 还执行告警规则逻辑和通知逻辑，以及向代理发送用于部署等管理任务的指令。\n- **Management Agent:** 代理是在服务器或主机上运行的轻量级\
  \ C 程序。该程序通常收集主机以及该主机上的其他目标（如数据库、应用服务器、SOA 套件等）的所有监控和配置信息。代理还适用于通过脚本在主机级别运行操作。此功能对于采取纠正措施（当阈值被违反时）或执行复杂的修补或其他部署任务非常有用。还可以选择使用远程代理，唯一的缺点是不会收集主机指标。\n\
  - **Oracle Management Repository (OMR):** 存储库是随 Grid Control 打包的预配置 Oracle 数据库。OMR\
  \ 不需要单独的许可证。OMS 包含来自各个代理的当前和历史监控及配置信息。它带有预建的模式以及用于在不同时间段聚合数据的 PL/SQL 过程和函数。\n- **Central\
  \ web console:** Web 控制台为 OMR 中的所有丰富信息提供窗口。每个目标类型（例如，应用服务器）都有一个主页，其中包含监控、告警、配置和其他特定信息。主页在多个目标之间显示汇总信息。报表和仪表板可用于创建自定义视图。\n\
  \n本书避免深入讨论产品文档或白皮书已涵盖的部署问题。假设读者具备安装和配置 Grid Control 组件的基础知识。有关架构和部署最佳实践的更多信息可在 Oracle\
  \ 技术网络（OTN）上的 Enterprise Manager 页面找到，网址为：http://www.oracle.com/technology/products/oem/ent_mgr/arch_dep.html\n\
  \n下面的简单架构图显示了 Grid Control 主要组件及其关系：\n\n![](img/7529bbd615e859608c21b965162348b2_24_0.png)\n\
  \n\n\n## 安装 Grid Control\n\nGrid Control 的最新版本可以从 OTN 下载，网址为：\nhttp://www.oracle.com/technology/software/products/oem/index.html\n\
  \nGrid Control 文档包括安装、配置、部署模式等，可以在以下位置找到： http://download.oracle.com/docs/cd/B16240_01/doc/nav/portal_booklist.htm\n\
  \nGrid Control 安装并配置后，可以添加与 SOA 相关的目标。先决条件是在托管 SOA Suite 的服务器上安装管理代理（Agent）。有关使用\
  \ Grid Control 进行 SOA 管理入门的更多详细信息，请访问 Oracle 技术网络（OTN）网站： http://download.oracle.com/docs/cd/B16240_01/doc/em.102/e12650/toc.htm\n\
  \n## 主页\n\n下载并安装 Grid Control 后，首要任务是查看 Grid Control 的主页。要在本地浏览器中查看 Grid Control\
  \ 主页：\n\n- 1. 导航到 http://<your_server_name>:<server_port>/em.\n- 2. 以 sysman.sysman\
  \ 登录。使用安装期间设置的密码。\n\n以下是 Enterprise Manager 10g Grid Control 的入口点或主页。主页汇总了所有重要信息（从左上角开始）：\n\
  \n![](img/7529bbd615e859608c21b965162348b2_25_0.png)\n\n- **所有目标状态**：本节显示受监控的 Oracle\
  \ 目标总数。饼图显示其整体 SLA 可用性和相应的未解决警报。此摘要页面可针对任何目标类型进行汇总。\n\n单击 **查看** 下拉菜单并观察此企业中的不同目标类型。这是\
  \ Grid Control 支持的目标类型的子集。\n\n- **所有目标警报**：对受监控目标的所有指标阈值的违规，按 **严重** 和 **警告** 类别划分。\n\
  **错误** 是与代理相关的问题（代理无法访问、无法上传、指标收集错误等）。\n\n- **所有目标策略违规**：超过 300 条 Oracle 最佳实践（例如，Application\
  \ Server 上的开放端口）已作为策略编码在 Grid Control 中。代理每天检查这些策略并标记违规行为。\n\n- **目标搜索**：只需输入目标名称的一部分即可快速访问任何目标。\n\
  \n- **Oracle 主目录的关键补丁 advisory**：推送对系统至关重要的任何安全警报。设置到 MetaLink 的连接并自动下载受监控 Oracle\
  \ 主目录的补丁信息。\n\n- **部署摘要**：Enterprise Manager 收集有关您整个配置的信息，包括软件、补丁（操作系统和 Oracle 软件级别）、硬件等。这是您企业中所有主机、软件和操作系统（OS）的汇总。\n\
  \n## Oracle BPEL Process Manager 概述\n\n*业务流程执行语言（BPEL），简称为 Web 服务业务流程执行语言（WS-BPEL），是一种用于指定与\
  \ Web 服务交互的可执行语言。业务流程执行语言中的流程通过专门使用 Web 服务接口来导出和导入信息。来源：http://en.wikipedia.org/wiki/Business_Process_Execution_Language*\n\
  \n主要厂商如 Oracle、Microsoft 和 IBM 都支持 BPEL 标准，该标准已成为首选的编排标准。Oracle 于 2005 年收购了名为 Collaxa\
  \ 的小型公司，该公司拥有 BPEL 标准的实现，随后将产品更名为 BPEL Process Manager，并使其成为 SOA Suite 的基础。这也成为\
  \ Fusion Middleware 伞下以及 Fusion Applications 伞下的战略技术产品。Oracle Applications Unlimited（E-Business\
  \ Suite、PeopleSoft、Siebel、Retek 等）使用多种不同的工作流技术，如 Oracle Workflow，但所有这些工作流技术的路线图都是要收敛到基于\
  \ Oracle BPEL Process Manager 产品的通用 BPEL 标准。简而言之，这项技术不仅对整体中间件市场，而且对打包应用市场都有巨大的影响。Oracle\
  \ 在这两个市场都拥有庞大的装机基础，尤其是在 2008 年收购 BEA 之后，专注于在其客户群中扩大 BPEL 的已有大规模采用。\n\nBPEL Process\
  \ Manager 10.1.2 是 Collaxa 收购后的首个发布版本。目前，该产品作为 Oracle SOA Suite 10.1.3.x 的一部分提供。这是产品相当成熟的版本，并在有兴趣实施\
  \ SOA 战略的客户中获得了广泛采用。这也是下一代 Oracle Fusion Applications 的基础。\n\n## Oracle SOA Suite\
  \ 概述\n\nOracle SOA Suite 10.1.3.x 由三个组件组成 – Oracle BPEL Process Manager、**Oracle\
  \ 企业服务总线 (OESB)** 和 **Oracle Web 服务管理器 (OWSM)**。此外，它还包括 **Oracle 服务总线 (OSB)**、**Oracle\
  \ 业务活动监控 (BAM)** 和规则引擎。\n\nOracle 构建了企业服务总线（OESB）作为管道层来前端化基于 BPEL 的业务流程。服务总线用作中间层，将不同格式的消息转换为通用规范格式，并路由到后端\
  \ BPEL 流程或其他服务。它是相对于点对点 **企业应用集成 (EAI)** 方法论的提升，该方法论涉及在集成两端频繁更改。\n\nOracle SOA Suite\
  \ 10.1.3.x 是一个单一的可安装包，并且使用 Oracle JDeveloper 极易安装和配置。作为开发基于 BPEL 的业务流程和基于 OESB 的服务的通用\
  \ IDE，它为开发人员和架构师实施 SOA 项目提供了良好的平台。\n\n## Oracle Service Bus 概述\n\n> *Oracle Service\
  \ Bus 是一种经过验证的、轻量级且可扩展的 SOA 集成平台，可为高容量、任务关键型 SOA 环境提供低成本、基于标准的集成。它旨在连接、调解和管理异构服务、遗留应用、打包应用以及企业级服务网络中多个企业服务总线（ESB）实例之间的交互。Oracle\
  \ Service Bus 是 Oracle SOA Suite 中的核心组件，是 SOA 消息传递的骨干。来源：http://www.oracle.com/technologies/soa/service-bus.html*\n\
  \n在收购 BEA 后，AquaLogic Service Bus（ALSB）也加入了 Oracle 阵营。收购后，ALSB 被更名为 Oracle Service\
  \ Bus（OSB）。2008 年 7 月 1 日，Fusion Middleware 高级副总裁 Thomas Kurian 宣布了 Oracle 中间件和\
  \ BEA 产品的战略路线图。他宣布 OSB 将成为今后的战略服务总线，凭借其广泛的客户采用率和先进的产品功能。\n\n## 摘要\n\n通过单一的管理解决方案来管理\
  \ SOA 服务、基础设施和产品，Grid Control 降低了 SOA 环境的复杂性。Grid Control 是一种企业级解决方案，因此必须谨慎将其打造为战略产品。安装和部署并非一项简单的任务。然而，设置满足企业需求的管理框架是至关重要的。\n\
  \nGrid Control 传统上被视为数据库管理解决方案，但本书将强调在 SOA 环境中使用该解决方案的必要性。\n\n在本章中，我们研究了一些目标产品以及管理解决方案的基本概念。特别是，我们讨论了\
  \ Enterprise Manager Grid Control 作为重要的管理解决方案。简要地，我们讨论了 Grid Control 的安装、文档和架构。然后我们讨论了\
  \ SOA 产品 BPEL PM 和 OSB。我们介绍了这两个产品的基本概念，以及各自的简要背景。\n\n这只是这些产品的概述。优秀的管理员应具备 Oracle\
  \ BPEL PM、SOA Suite 和 Service Bus 的基本操作知识。本书将重点关注下一步，即从 Grid Control 管理这些产品。\n\n\
  接下来的几章将通过动手练习指导设置和执行管理任务。\n\n\n\n## 2\n## 发现 BPEL PM\n\n管理解决方案需要定位并识别其需要管理的对象。此过程称为发现，即管理解决方案定位并识别所有目标。这通常使用部署在包含需要管理目标的服务器上的管理代理来完成。目标的发现使管理员能够了解环境概览以及需要管理的各个组件。\n\
  \n对于小型、中型或大型企业而言，挑战在于从单个控制台管理多个不同的目标。传统的硬件和软件组件，如服务器、存储设备、操作系统、数据库、中间件和应用程序，一直由系统管理解决方案进行管理。然而，一种新型的基于\
  \ BPEL 的应用程序和基础设施带来了新的问题。首先，它们需要与现有硬件和软件一起进行管理。其次，随着 BPEL 项目在企业中 proliferate，基础设施团队面临着管理这些项目日益增加的问题。第三，对于刚接触\
  \ BPEL 的管理员来说，在生产环境中支持这些环境会带来未知挑战。最后，IT 管理员希望避免随着 BPEL 项目的增加而聘用新的管理员。\n\nGrid Control\
  \ 提供了一种发现 BPEL 组件的方法，无论是在生产环境中还是其他环境中。对于基础设施团队来说，这是一种从一个控制台管理多个安装的便捷方式。一旦在托管 BPEL\
  \ PM 的每台服务器上安装了代理，即可从控制台启动发现过程。\n\n在本章中，我们将讨论如何发现和配置 BPEL Process Manager 目标。发现\
  \ BPEL PM 目标是在执行其他管理任务之前的第一步。此外，创建基础设施服务是管理 BPEL 流程和相关基础设施的强制性步骤。本章涵盖以下内容：\n\n-\
  \ 支持管理 BPEL PM\n- BPEL PM 目标发现\n  - 导航到应用服务器\n  - 发现 BPEL PM 目标\n  - 导航到 BPEL PM\
  \ 目标主页\n  - 配置 BPEL PM 目标\n\n### 支持管理 BPEL PM\n\nBPEL PM 产品附带一个控制台，可用于管理活动，例如打开或关闭流程、删除实例、检查实例的流程等等。但是，它无法提供诸如监控服务器、流程的可用性和健康状况、配置管理以及批量部署等管理功能。\n\
  \nGrid Control 在 2007 年 1 月发布的 10.2.0.3（或 10gR3）版本中引入了 BPEL 管理功能。第一个版本提供了用于监控 BPEL\
  \ 基础设施（包括 BPEL PM 服务器）的大部分功能。此外，它还具有流程级监控、错误实例管理和服务级管理。\n\n2007 年 11 月在 Linux 平台上发布的\
  \ 10.2.0.4（10gR4）版本带来了管理 BPEL PM 的额外新功能。配置管理、部署自动化和适配器监控是该版本的主要功能。2009 年 2 月在 Linux\
  \ 平台上发布的 10.2.0.5（10gR5）版本增加了用于跟踪麻烦的 BPEL 实例的报告功能。\n\n### BPEL PM 目标发现\n\n这组逐步练习将演示\
  \ BPEL PM 目标的发现以及为目标设置监控配置。\n\n### 导航到应用服务器\n\n由于 SOA Suite 和 BPEL Process Manager\
  \ 服务器托管在应用服务器上（例如 Oracle Application Server、Oracle WebLogic Server），第一步是访问应用服务器主页：\n\
  \n- 1. 导航到 http://<Grid_Control_server_name>:<server_port>/em。\n- 2. 以 sysman 身份登录。使用安装期间设置的密码。\n\
  - 3. 点击“目标”选项卡。\n- 4. 点击“中间件”子选项卡。\n\n![](img/7529bbd615e859608c21b965162348b2_31_0.png)\n\
  \n> 这是企业内所有受监控应用服务器（Oracle AS、BEA WebLogic 等）的视图。对于每个目标，都会汇总状态摘要、详细信息、警报、策略违规以及主机上的\
  \ CPU 使用率和内存使用率。\n\n### 发现 BPEL PM 目标\n\n管理员需要通知 Grid Control 明确发现应用服务器以及相关目标，如\
  \ BPEL PM。在尝试发现之前，必须在安装了应用服务器软件的主机上安装 Grid Control Agent（10.2.0.3 或更高版本）。请注意，也可以使用远程代理来发现应用服务器。使用远程代理的唯一缺点是不会采集应用服务器机器的主机和操作系统指标。\n\
  \n- 1. 如以下屏幕截图所示，从右侧的下拉列表中添加一个 Oracle Application Server 目标。点击“Go”。\n\n![](img/7529bbd615e859608c21b965162348b2_32_0.png)\n\
  \n- 2. 在“添加应用服务器”页面上：\n  - 点击放大镜图标选择主机。\n  - 在弹出窗口中，选择主机的单选按钮并点击“Select”，如以下屏幕截图所示：\n\
  \n![](img/7529bbd615e859608c21b965162348b2_33_0.png)\n\n- 3. 在 **添加应用服务器** 页面上，右侧点击\
  \ **继续**。\n- 4. 在 **发现应用服务器：结果** 页面上，点击 **确定**。\n- 5. 在很短的时间内，您应该会得到一个确认页面。点击 **确定**。\n\
  - 6. 在 **应用服务器** 页面上，点击 **展开全部** 并查看您的应用服务器。\n\n> 请注意此应用服务器的组件。请注意两个 OC4J 目标以及 Oracle\
  \ BPEL Process Manager 目标。\n\n![](img/7529bbd615e859608c21b965162348b2_34_0.png)\n\
  \n### 导航到 BPEL PM 目标主页\n\nBPEL PM 目标是应用服务器目标的子目标。有多种方法可以导航到 BPEL PM 目标的主页；最常见的方法是点击\
  \ Oracle BPEL Process Manager 目标名称超链接。\n\n> 在 Oracle BPEL Process Manager 主页上，您将看到“状态”标签，其中显示\
  \ BPEL PM 服务器的可用性状态、可用性（%）（最近 24 小时）、Oracle 主目录和主机。\n\n![](img/7529bbd615e859608c21b965162348b2_35_0.png)\n\
  \n### 配置 BPEL PM 目标\n\n一旦发现 BPEL PM 目标，管理员需要为目标提供基本配置信息。这使得 Grid Control 中的 BPEL\
  \ 目标能够与 BPEL PM 服务器通信。这种通信是必要的，因为 BPEL 目标通过 API 轮询 BPEL PM 服务器来收集开箱即用的监控指标数据。\n\n\
  - 1. 在底部 **相关链接** 部分下，点击 **监控配置**。\n- 2. 将 BPEL Process Manager 的管理员用户名输入为 **oc4jadmin**。\n\
  - 3. 将管理员密码输入为 *welcome1*。\n- 4. 将 **初始上下文工厂** 输入为 **com.evermind.server.rmi.RMIInitialContextFactory**。\n\
  - 5. 将 **上下文提供程序 URL** 输入为 **opmn:ormi://<Application_Server_Host_Name>:6003:oc4j_soa/orabpel**。\n\
  - 6. 将其他字段留空并点击“确定”，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_36_0.png)\n\
  \n这完成了在 Oracle Application Server 上部署的 BPEL PM 目标的发现和配置。\n\n### 摘要\n\n发现是企业中管理目标的第一步。从单个控制台发现和管理多个目标是一种强大的方法，可以在保持标准化管理平台的同时快速掌握新项目。这避免了为增加受管目标数量的新项目聘用新的管理员。\n\
  \n在本章中，我们研究了如何发现和配置 BPEL PM 目标。\n\n这些是启用后续管理任务的强制性步骤。我们通过发现应用服务器（在本例中为 Oracle Application\
  \ Server）间接发现了 BPEL PM 目标。请注意，发现过程对于发现安装在 WebLogic 和 WebSphere 应用服务器上的 BPEL PM 目标是相似的。有关基于\
  \ WebLogic 和 WebSphere 应用服务器的 BPEL PM 的详细发现信息（包括 10.2.0.4 补丁）列在 Oracle Technology\
  \ Network 上的以下文档中：\n\n```\nhttp://download.oracle.com/docs/cd/B16240_01/doc/em.102/e12650/toc.htm.\n\
  ```\n\n接下来的几章将演示动手练习，以设置并执行对已发现的 BPEL PM 目标的额外管理任务。\n\n\n\n## 3\n## BPEL 流程监控\n\
  了解 BPEL 流程的复杂性非常重要，这带来了对主动运营监控的额外需求。BPEL 流程是工作流的新一代。它们支持 SOA，这意味着它们使用通用的 **Web 服务调用框架\
  \ (WSIF)** 来编排不同系统之间的交互。WSIF 使 BPEL 能够构建外观以与任何支持 Web 服务的系统进行交互。在 BPEL 框架中，Web 服务交互被称为“partner\
  \ links”。这对于编排涉及新系统和遗留系统的复杂业务流程非常强大。它为 IT 提供了企业范围业务流程的自动化框架。监控 BPEL 流程对于业务分析师和管理员维护业务可见性并快速解决问题非常重要。本章介绍查看已部署的\
  \ BPEL 流程及其构成的 partner links。此外，还介绍了使用指标和合成测试的组合来监控 BPEL 流程和 partner links。\n\n\
  Grid Control 提供了通过服务测试来监控关键 BPEL 流程、partner links 和 Web 服务的手段，以确定可用性和响应时间。Grid Control\
  \ 还提供了衡量容器上部署的每个 Web 服务实际请求的关键指标的手段。通过结合最终用户和请求的视角，Grid Control 可以确定所有受监控服务的服务可用性。\n\
  \n- 挑战\n- 解决方案\n- 分步练习：\n  - 导航到 BPEL PM 目标主页\n  - 导航到 BPEL 流程主页\n  - 创建 BPEL 流程聚合服务\n\
  \  - 创建 SOAP 测试以监控 partner link\n  - 创建 SOAP 测试以监控 BPEL 流程\n  - 测试 SOAP 测试\n\n###\
  \ 挑战\n一旦 BPEL 流程部署到暂存、预生产或生产环境中，管理员就会发现很难跟踪这些关键流程的健康状况。BPEL 领域缺乏工具和运营技能，因此在遇到问题时，很难理解该看哪里以及看什么。这些流程经常是关键业务功能的自动化表示，并且需要按预期工作。每个流程每天可能产生数百或数千个实例。如果任何流程在可用性或性能方面未按预期执行，管理员需要介入并解决问题。管理员需要尽快解决问题，通常花费大部分时间对问题进行分类，以了解潜在的根本原因。此外，在大多数情况下，最终用户会报告这些问题，无论是通过互联网的消费者还是关键业务合作伙伴。如果是这种情况，企业已经损失了收入或信誉，或两者兼有。\n\
  \n### 解决方案\nGrid Control 提供了通过服务测试来监控关键 BPEL 流程、partner links 和 Web 服务的手段，以确定可用性和响应时间。Grid\
  \ Control 还提供了衡量容器上部署的每个 Web 服务实际请求的关键指标的手段。Grid Control 可以利用其主动最终用户监控功能来确定所有受监控服务的服务可用性。\n\
  \n### 分步练习\n这组分步练习将介绍 BPEL 流程主页的发现过程，以及为流程和 partner links 设置监控。\n\n### 导航到 BPEL\
  \ PM 目标主页\nGrid Control 可以监控多种类型的目标。第一个任务是进入 BPEL PM 目标主页。所有 BPEL 特定的监控视图都可以在目标主页中查看。\n\
  \n1. 导航到 Grid Control 主页。\n2. 在右侧的 **Target Search** 区域中，单击 **Search** 下拉菜单。\n3.\
  \ 向下滚动以定位并单击 **BPEL Process Manager target** 类型。\n4. 单击 **Go** 按钮。\n5. 显示已发现的 BPEL\
  \ Process Manager 目标列表。单击所选的目标名称。这会带您进入 BPEL PM 目标主页。\n\n> 如果只发现一个 BPEL Process\
  \ Manager 目标，Go 按钮将自动带您进入该目标的主页。\n\n### 导航到 BPEL 流程主页\nBPEL 目标主页主要是基础设施视图。目标主页中有一个部分可用于查看\
  \ BPEL 流程列表及其监控指标。\n\n1. 从 BPEL 目标主页单击 Processes 选项卡。\n\n> 在此处发现并显示服务器上部署的所有 BPEL\
  \ 流程。请注意，流程在它们部署的域内显示。表中还显示了汇总的流程实例吞吐量信息。这些指标默认情况下以预设的轮询频率（收集间隔）从 BPEL PM 服务器收集。可以轻松更改默认轮询频率，并为这些开箱即用的指标设置阈值，以便触发警报和通知（使用通知规则）。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_41_0.png)\n\n3. 单击默认域下的 BPEL 流程名称，例如\
  \ **SOAOrderBooking(v1.0)**。\n\n> 这是单个 BPEL 流程页面。请注意流程特定的实例吞吐量图。在底部，请注意 BPEL 流程的所有\
  \ partner links（在底部）连同端口类型、操作和 WSDL 信息一起被发现。\n> \n> 创建 BPEL 流程聚合服务。请注意，在尝试创建 BPEL\
  \ 流程聚合服务之前，您需要创建 BPEL Infrastructure Service。有关如何执行此操作的说明在 *第 4 章* 中提供。\n\n4. 从\
  \ BPEL 流程页面单击 **Create Service** 按钮，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_42_0.png)\n\
  \n5. 观察聚合服务创建的确认消息。\n\n> 创建的聚合服务列在 **Services** 部分下。之前创建的基础设施服务已自动与聚合服务关联。在 **Services**\
  \ 部分，从左侧开始，您可以看到服务名称、服务类型、状态和其他警报。顶级服务是聚合服务。下一个服务是基础设施服务——聚合服务的子服务。\n\n![](img/7529bbd615e859608c21b965162348b2_43_0.png)\n\
  \n### 创建 SOAP 测试以监控 partner link\n合成事务是一种主动方式，用于模拟最终用户（或客户端）行为并在最终用户（或客户端）之前发现问题。BPEL\
  \ 流程通常通过 partner link 框架调用一个或多个 Web 服务，通常通过 SOAP。用于测试 BPEL partner link 可用性和性能的合成检查是发现服务消费者之前问题的绝佳方式。\n\
  \n1. 向下滚动并从单选按钮列表中选择一个 partner link 名称，例如 **SelectService**。\n\n2. 单击 **Add SOAP\
  \ Test** 按钮为该 partner link 创建 SOAP 测试。\n\n![](img/7529bbd615e859608c21b965162348b2_44_0.png)\n\
  \n3. 将 SOAP 测试名称输入为 **SelectService_test**。\n4. 将 **Collection Frequency (minutes)**\
  \ 的测试间隔输入为 **15**。\n5. 从 **Port Types** 下拉列表中选择 Web 服务端口为 **SelectServiceCallbackPort**。\n\
  6. 在 HTML 输入字段中输入输入参数，例如 **SupplierPrice {String}** 为 **12345**，**SupplierName [String]**\
  \ 为 **2**。\n7. 将 **Basic Authentication Credentials** 部分留空。\n8. 在 **Create SOAP\
  \ Test** 页面上的字段按以下屏幕截图所示填写后单击 **OK** 继续：\n\n![](img/7529bbd615e859608c21b965162348b2_45_0.png)\n\
  \n9. 添加一个信标。单击 Add 按钮。\n10. 从弹出窗口中检查并选择可用的信标，如下一屏幕截图所示：\n\n\n\n> Beacon 是已配置为发出合成测试以测试网站、Web\
  \ 服务、邮件服务器、FTP 站点等的主机。Beacon 通常安装在防火墙外部，用户从该位置访问网站或 Web 服务。因此 Beacon “模拟” 终端用户行为并主动通知管理员网站或\
  \ Web 服务的任何问题。您可以在 Oracle Technology Network 上的 Grid Control 文档中阅读有关 Beacon 和服务管理的更多信息—http://otn.oracle.com。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_46_0.png)\n\n- 11. 单击 **确定** 以保存 SOAP\
  \ 测试和 Beacon 设置。\n- 12. 验证可用性流程创建并查看 SOAP 测试。在 BPEL 流程主页上，注意自动创建的可用性通用服务。\n- 13.\
  \ 展开流程可用性服务。例如，**SOAOrderBooking(v1.0)_availability**，并验证您刚刚创建的 SOAP 测试，例如 **SelectService_test**，是否已添加。\n\
  \n> BPEL 流程的可用性服务是在创建第一个 SOAP 测试时形成的。请注意每个测试的状态，以及如何汇总（可配置）以确定流程可用性。SOAP 测试的状态显示需要一些时间，具体取决于为测试设置频率。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_47_0.png)\n\n## 创建 SOAP 测试以监控 BPEL 流程\n\
  \n与通过合成检查监控合作伙伴链接类似，整体 BPEL 流程也可以以相同方式进行监控。BPEL 流程通常由 SOAP 客户端调用。可以按所需频率对其进行测试，以确保客户端始终可以实例化\
  \ BPEL 流程：\n\n- 1. 转到 BPEL 流程主页。\n- 2. 向下滚动并在 Partner Links 部分中找到客户端的单选按钮。\n\n##\
  \ BPEL 流程监控\n\n- 3. 单击 **添加 SOAP 测试** 以为客户端创建 SOAP 测试，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_48_0.png)\n\
  \n- 4. 将所需端口类型选择为 **SOAOrderBookingPort**。\n- 5. 将输入参数的单选按钮选择为 **XML 源**。\n- 6.\
  \ 输入 SOAP 信封，包括任何头信息。您可以从现有的 BPEL 实例（来自 BPEL Control）复制此 SOAP 信封。复制并粘贴输入 XML 源中提供的\
  \ SOAP 有效负载。\n\n![](img/7529bbd615e859608c21b965162348b2_49_0.png)\n\n- 7. 单击 **确定**\
  \ 完成客户端测试的创建。\n- 8. 查看确认消息。\n- 9. 展开可用性服务以查看 SOAP 测试。\n\n![](img/7529bbd615e859608c21b965162348b2_49_1.png)\n\
  \n## 测试 SOAP 测试\n\n应该有一种方法来跟踪 SOAP 测试的历史可用性和性能，并在通过阈值偏离正常行为时发出警报。当警报触发时，值班人员必须测试报告的问题是否仍然存在。即时按需测试是实现此目标的好方法。\n\
  \n- 1. 单击您创建的其中一个 SOAP 测试。测试页面显示测试可用性、运行此测试的 Beacon 以及与此测试关联的警报。以下图表显示了来自 Beacon\
  \ 的测试响应时间：\n- 2. 单击“验证服务测试”按钮。\n- 3. 单击“执行测试”以即时运行测试并查看结果。\n\n![](img/7529bbd615e859608c21b965162348b2_50_0.png)\n\
  \n> 可以使用一个或多个 Beacon 来测试服务，可能来自模拟用户群的多个地理位置。这对于衡量终端用户体验的可用性和响应时间很有用。它可用于主动以及被动地复制用户报告的问题。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_51_0.png)\n\n这完成了从 Grid Control 设置和查看\
  \ BPEL 流程监控的分步练习。\n\n## 摘要\n\n监控是保证企业关键业务流程健康的关键。在本章中，我们研究了如何使用合成测试监控合作伙伴链接和 BPEL\
  \ 流程。特别是，我们研究了监控 BPEL 流程相关的挑战，以及 Grid Control 提供的解决方案。\n\n我们研究了开箱即用的基本 BPEL 流程监控。此外，我们能够设置特定的主动检查来测试\
  \ BPEL 流程的可用性和性能。这些合成检查能够根据预设阈值通知管理员。此外，管理员能够按需运行这些合成检查并查看结果。\n\n主动监控可以避免与这些业务流程交互的终端用户失去信任。有时防火墙内部一切正常，但终端用户仍无法访问这些流程。在这种情况下，必须在防火墙外部放置一个代理，以确保用户行为可以频繁复制，并且管理员可以收到通知。在大多数情况下，这些代理会在终端用户之前通知管理员。\n\
  \n下一章将逐步介绍动手练习，以设置并执行 BPEL 基础设施的额外管理任务，例如 BPEL 流程管理器服务器、应用服务器、数据库和主机。\n\n## 4\n\n\
  ## BPEL 基础设施管理\n\nBPEL 安装涉及多个软件组件。对于基本单节点安装，有四个组件。第一个是脱水数据库，它持久保存 BPEL 元数据和 BPEL\
  \ 实例信息，包括当前正在执行的实例（“in-flight” 实例）。第二个组件是为 BPEL 提供平台的应用服务器。BPEL 支持 Oracle WebLogic\
  \ Server、Oracle Application Server、IBM WebSphere 和 JBoss。应用服务器由各种组件组成，例如 **Java\
  \ 虚拟机** (**JVM**) 和 Web 服务器。最新的应用服务器平台认证列表可在以下位置找到：\n\n```\nhttp://www.oracle.com/technology/software/products/ias/files/oracle_soa_certification_101310.html.\n\
  ```\n\n第三个组件是 BPEL PM 服务器本身，它从根本上是一个 Java 应用程序。该应用程序作为 SOA Suite 安装的一部分与 Oracle\
  \ Application Server 打包在一起。最后一个组件是托管应用服务器和数据库的硬件服务器和操作系统。\n\n作为集成产品，BPEL 协调驻留在其他基础设施（不同于其自身基础设施）上的服务。这为负责支持\
  \ BPEL 编排及其相关故障的管理员带来了噩梦。\n\n监控 BPEL 和扩展的基础设施对于 IT 保持可见性、收到通知并快速解决问题非常重要。本章讨论通过监控、查看配置更改和最佳实践策略违规来管理\
  \ BPEL 基础设施。具体来说，本章讨论：\n\n- 挑战\n- 解决方案\n- 分步练习：\n  - 创建 BPEL 基础设施服务\n  - 查看 BPEL\
  \ 基础设施服务\n  - 查看系统警报和策略\n  - 查看配置更改\n  - 查看关键系统指标\n  - 查看管理任务\n  - 查看系统组件\n  - 查看系统仪表板\n\
  \n## 挑战\n\n关键业务流程通常会因依赖的基础设施故障而中断。管理员很难同时管理 BPEL 基础设施和其他现有基础设施系统。由于 BPEL 流程通过在数据库中不断存储状态来脱水，因此数据库中的任何中断或性能问题都会影响\
  \ BPEL 的脱水和再水合。还有其他基础设施组件，例如 Web 服务器、应用服务器和主机，这些组件需要正常运行才能使 BPEL 流程顺利运行。没有 BPEL\
  \ 知识或培训的管理员可能不了解关键的基础设施组件是什么或如何管理它们。此外，与基础设施组件相关的最佳实践可能未知或难以实施。SOX 和 COBIT 标准已成为\
  \ IT 管理员必须了解、实施和监控的重要标准。\n\n\n\n\n## 解决方案\n\nGrid Control 监控 BPEL 基础设施组件的可用性。目标（如\
  \ BPEL PM 服务器）的当前和历史可用性都会被记录下来以便进行故障排除和根本原因分析。BPEL 基础设施系统和服务的可用性也会被记录。管理员可以在任何组件宕机时收到通知，或事后通过拓扑图进行故障排除，以了解导致服务故障的组件。通过允许管理员“集中管理”，大量组件的管理得以显著简化。通过将\
  \ BPEL 相关目标组合到系统中，管理员可以受益于丰富的系统管理功能，例如通过系统监控仪表板主动监控可用性的能力。管理员可以查看有助于 SOX 和 COBIT\
  \ 合规性的运营最佳实践策略违规情况。\n\n## 分步练习\n\n本套分步练习将演示 BPEL 进程主页的发现过程，以及为进程和合作伙伴链接设置监控。\n\n\
  ## 创建 BPEL 基础设施服务\n\n创建基础设施组件的逻辑表示是设置有效监控的第一步。Grid Control 帮助管理员了解基础设施组件之间的关系。\n\
  \n- 1. 在 BPEL 目标页面上，单击“创建 BPEL 基础设施服务”按钮。\n- 2. 在“创建服务”页面上，输入服务名称并单击“确定”，如下图所示：\n\
  \n![](img/7529bbd615e859608c21b965162348b2_56_0.png)\n\n![](img/7529bbd615e859608c21b965162348b2_56_1.png)\n\
  \n- 3. 您应收到一条确认消息。单击“确定”。\n\n> 观察新创建的系统和服务、系统和服务状态、警报以及策略违规情况。\n\n## 查看 BPEL 基础设施服务\n\
  \n基础设施服务创建后，查看并了解服务的底层组件很有用。\n\n- 1. 导航到 BPEL 目标主页。\n- 2. 在“系统和服务”部分下，单击“系统”。\n\n\
  > 这是系统主页。请注意显示系统组件状态的饼图。请注意右侧的警报、策略违规和安全策略违规。这些已汇总到所有系统组件。请观察依赖于此系统的服务、其状态、警报、违规等。在底部，请观察系统组件的最新配置更改。\n\
  \n## 查看系统警报和策略\n\nGrid Control 监控各个系统组件并跟踪组件的所有警报以及不同类型的策略违规。\n\n- 1. 在系统主页上，单击“警报历史记录”按钮。请注意每个系统组件的警告和严重警报历史记录。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_57_0.png)\n\n## BPEL 基础设施管理\n\n- 2. 单击“系统”面包屑返回系统主页。\n\
  - 3. 单击当前的严重（红色叉号）或警告（黄色三角形）数字。\n\n![](img/7529bbd615e859608c21b965162348b2_58_0.png)\n\
  \n- 4. 请注意不同目标类型的警报。请注意下拉菜单，可用于查看当前警报以及历史警报。\n- 5. 查看系统的策略（最佳实践）。\n\n> Enterprise\
  \ Manager 策略是一种运营最佳实践，可确保基于 Oracle 最佳实践对 Oracle 目标进行适当监控。数据库安全策略的一个例子是 SYSTEM 密码必须每三个月更改一次。如果未执行此操作，代理将标记违反此策略的数据库目标。开箱即用的\
  \ Grid Control 监控了超过 300 条针对数据库、应用服务器和应用程序的策略。在 Grid Control 10.2.0.5 中，还可以将自定义策略添加到库中并附加到目标。\n\
  \n- 6. 使用面包屑导航到系统主页。\n- 7. 在“策略违规”部分下，单击违规计数。\n- 8. 请注意系统组件的不同 Oracle“最佳实践”违规情况。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_59_0.png)\n\n- 9. 单击策略规则以获取有关“最佳实践”的更多信息。\n\
  - 10. 使用浏览器后退按钮两次导航到系统主页。\n- 11. 在“策略违规”部分下，单击“策略趋势概览”。\n- 12. 请注意三个策略类别的趋势概览数据。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_59_1.png)\n\n## 查看配置更改\n\nGrid Control\
  \ 为其所有受管目标收集配置信息。这对管理员理解和排查与基础设施更改相关的问题非常有帮助。\n\n- 1. 单击 *系统* 面包屑前往系统主页。\n- 2. 在\
  \ **配置更改** 部分下，单击 **所有目标类型**。\n- 3. 查看所有系统组件的 **配置历史记录** 部分。\n\n> 请注意所有系统组件的更改；深入到特定目标类型以查看更改。稍后有专门的配置管理章节。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_60_0.png)\n\n## 查看关键系统指标\n\nGrid Control\
  \ 的默认系统视图捕获系统的关键指标并将其显示给管理员。\n\n- 1. 单击 Web 浏览器上的后退按钮返回系统主页。\n- 2. 单击“图表”子选项卡。\n\
  \n> 请注意本页上绘制的系统组件的关键指标。提供了一个下拉菜单来更改图表的时间范围。本页上显示的指标集是可配置的。\n\n![](img/7529bbd615e859608c21b965162348b2_61_0.png)\n\
  \n## 查看管理任务\n\n管理员可以从 Grid Control 启动其他多个管理任务。\n\n- 1. 单击“管理”选项卡。\n\n> 请注意系统组件的\
  \ **作业活动**，以及可直接从本页启动的其他管理任务。\n\n![](img/7529bbd615e859608c21b965162348b2_62_0.png)\n\
  \n## 查看系统组件\n\n查看系统组件可让管理员确定系统的一部分是什么，以及什么会影响系统的整体可用性。\n\n- 1. 单击 **组件** 选项卡。\n\n\
  > 本页显示此系统的所有组件。系统组件可用性之间的“与”或“或”关系决定了系统本身的可用性。\n\n![](img/7529bbd615e859608c21b965162348b2_63_0.png)\n\
  \n## 查看系统仪表板\n\n系统仪表板是网络操作中心分析师查看系统组件当前状态及其关键指标的有用工具。\n\n- 1. 单击右上角的 **启动仪表板**。\n\
  \n> 系统仪表板一目了然地显示系统组件的状态和关键指标。如果有任何警报，也会显示在底部。这对于有兴趣查看关键系统组件、其状态和停机信息的 IT 经理来说是一个有用的视图。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_64_0.png)\n\n## 总结\n\n有效监控 BPEL 基础设施对于\
  \ SOA 项目的成功至关重要。Enterprise Manager 提供了使用现有基础设施组件有效监控 BPEL 基础设施组件的方法。我们研究了基本挑战、解决方案以及解决不同领域的分步练习。特别是，我们创建了\
  \ BPEL 基础设施服务并查看了该服务、其底层系统和组件，以及警报、指标和配置更改。最后，我们在系统仪表板中查看了系统组件。\n\n了解关键组件并创建系统来表示它们是实现系统管理的第一关键步骤。这使\
  \ IT 部门能够监控、管理更改并实施最佳实践策略以符合 SOX 和 COBIT 标准。\n\n接下来的几章将逐步介绍动手练习，以设置并执行 BPEL 进程和\
  \ BPEL 基础设施的额外服务级管理任务。\n\n\n\n## 5\n\n## BPEL 服务级别管理\n\n服务提供商面临着要求日益提高的消费者，他们希望服务更快、可用性更高、性能更好。越来越多的关键业务服务（如电子邮件、存储、服务器和数据库）以服务形式使用，因此消费者无需担心拥有和维护软件和硬件。消费者期望无论是内联网还是互联网服务都获得高可用性和高性能。服务停机可能导致服务提供商和消费者收入损失，并对双方的信誉造成损害。此外，若干服务提供商必须遵守诸如\
  \ **信息技术基础设施库（ITIL）**、**信息及相关技术控制目标（COBIT）** 和 **审计准则公告第70号（SAS 70）** 等 IT 框架。这些框架要求\
  \ IT 衡量服务可用性和性能，以满足审计、合同义务和客户满意度的需求。\n\n在服务不仅大量存在而且相互交互的环境中，治理服务可用性和质量变得异常困难。BPEL\
  \ 环境涉及多个正在被编排的服务。所有参与的服务都需要在合同使用条款范围内进行管理。这对于企业对企业（或合作伙伴）合同以及企业对消费者合同都极其重要。大多数服务提供商在合同中提供退款保证，如果服务质量低于双方约定的可用性和性能预期，消费者可以行使该保证。\n\
  \n使用统一的服务级别期望监控 BPEL 流程和合作伙伴链接，对于 IT 监控服务期望并解决问题以确保服务级别协议得到满足非常重要。本章讨论通过设置和监控服务级别来管理\
  \ BPEL 流程和合作伙伴链接的期望。具体而言，本章讨论：\n\n- 挑战\n- 解决方案\n- 分步练习：\n  - 查看 BPEL 流程可用性服务\n \
  \ - 添加服务性能指标\n  - 设置服务级别期望（可用性）\n  - 查看服务可用性定义\n  - 查看 BPEL 基础设施服务\n  - 添加基础设施性能指标\n\
  \  - 添加基础设施使用指标\n  - 设置服务级别期望（基础设施）\n  - 查看基础设施可用性定义\n  - 查看 BPEL 流程聚合服务\n  - 查看聚合服务可用性定义\n\
  \  - 添加聚合服务性能和使用指标\n  - 设置服务级别期望（聚合服务）\n\n## 挑战\n\n在日益服务导向的环境中，服务和系统可用性以及响应时间对提供商和消费者的最终收益有直接且切实的影响。BPEL\
  \ 业务流程、网上银行、在线商店和在线股票交易都是需要被监控并对合作伙伴和终端用户保持可用的业务应用示例。通常，在使用这些服务时，管理员面临的一些常见问题是：\n\
  \n- 保证服务的可用性\n- 服务的性能以及是否符合终端用户的期望\n\n应用程序和基础设施性能不佳可能导致业务成本，包括客户忠诚度和销售机会的丧失。\n\n\
  ## 解决方案\n\nGrid Control 通过自动定义一个或多个代表企业中运行的业务流程的服务模型来解决这些问题。当为合作伙伴链接创建了一个或多个服务测试（SOAP\
  \ 测试）时，会创建覆盖业务流程的自动化服务模型。使用这些服务测试（模拟终端用户功能），管理员可以衡量关键合作伙伴链接或外部 Web 服务的性能和可用性，在出现问题时接收警报，识别常见问题并诊断故障原因。监控服务有助于确保运营目标和服务级别协议得到满足。\n\
  \n## 分步练习\n\n这组分步练习将指导如何为 BPEL 流程设置服务级别，并设置可用性和性能指标以监控 BPEL 流程及其相关可用性、基础设施和聚合服务的服务级别。列出了一些关键服务定义：\n\
  \n- **通用服务**：这是 Grid Control 对提供给消费者的任何服务的表示。Web 应用有专门的服务。对于 Web 服务和 BPEL 流程，通用服务用作包装器以继承\
  \ Grid Control 服务功能。\n- **可用性服务**：这是 Grid Control 中 BPEL 流程的表示，用于衡量流程的运营可用性和响应时间。可以在服务级别进一步设置和衡量服务级别目标。\n\
  - **系统**：这是一组相关的基础设施组件，如数据库、应用服务器、JVM、BPEL PM 等。\n- **基础设施服务**：将系统建模为服务表示，以便为整个系统设置和衡量服务级别目标。\n\
  - **聚合服务**：这是一个更高级别的服务，由一个或多个通用服务组成。\n- **服务级别协议（SLA）**：这是提供商和消费者之间的合同协议。通常，它包括可用性（例如，每季度\
  \ 99.99% 服务正常运行时间）和性能（例如，登录页面应在三秒内返回）指标。SLA 合同中经常有退款保证，当面临服务可用性和性能不佳时，消费者可以行使该保证。\n\
  - **服务测试：** Grid Control 服务可以使用模拟终端用户的合成检查来测试可用性和性能。由于 SLA 通常从终端用户角度衡量，服务测试非常有用，并在\
  \ SLA 中广泛使用。\n\n### Viewing the BPEL process availability service\n\nGrid Control\
  \ 会自动创建 BPEL 流程的内部服务表示。这很有用，因为可以应用正常的 Grid Control 服务功能。第一步是导航到 BPEL 流程可用性服务：\n\n\
  1. 在 BPEL 目标页面上，单击 **BPEL 流程** 选项卡。\n2. 在默认域下单击 BPEL 流程名称 `<process_name>`，即 **SOAOrderBooking(v1.0)**。\n\
  \n> 聚合服务、可用性服务、通用服务和基础设施服务可能已经创建。如果没有，请按照前几章中的步骤创建这些服务。\n\n![](img/7529bbd615e859608c21b965162348b2_70_0.png)\n\
  \n3. 单击 `<process_name_availability>` 服务名称——**SOAOrderBooking(v1.0)_availability**。\n\
  \n> 这是服务主页。请注意该服务过去 24 小时的 **可用性（%）**、**实际服务级别（%）** 和 **预期服务级别（%）**。请注意该服务的 **关键测试摘要**\
  \ 详情。先前章节中 instrumented 的 SOAP 测试会显示在此处。\n\n![](img/7529bbd615e859608c21b965162348b2_71_0.png)\n\
  \n### Adding service performance metrics\n\nGrid Control 服务不仅可以按可用性衡量，还可以按性能衡量。响应时间等性能指标对于衡量和告警（基于阈值）很有用，以便在消费者投诉之前运营人员就能收到警报。\n\
  \n1. 在服务主页上，单击 **监控配置** 选项卡。\n2. 单击 **性能指标** 链接。\n3. 添加基于服务测试的性能指标 **基于服务测试**，然后单击\
  \ **Go**。\n\n\n\n\n4. 对于第一个下拉列表中的每个 **服务测试**，从第二个下拉列表中选择 **响应时间（毫秒）** 作为指标，如以下屏幕截图所示：\n\
  \n![](img/7529bbd615e859608c21b965162348b2_72_0.png)\n\n5. 单击 **继续**。\n\n6. 将指标名称从\
  \ **Service_Test 响应时间（毫秒）** 编辑为 **信用验证响应时间（毫秒）**。\n\n7. 输入 **警告阈值** 和 **严重阈值** 时间（毫秒），即分别为\
  \ **3000** 和 **5000**。单击 **确定**，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_73_0.png)\n\
  \n8. 重复步骤 3-7，根据需要为其他服务测试的响应时间添加性能指标。\n\n## 设置服务级别期望（可用性）\n\n对于服务提供商，Grid Control\
  \ 提供了一种设置服务级别期望并据此进行衡量的方法。服务级别期望可以根据一段时间内可用性和性能基准来定义。\n\n- 1. 从底部的 **相关链接** 部分单击\
  \ **编辑服务级别规则**。\n- 2. 将 **预期服务级别** 从默认值更改为此服务所需的数值，即 **99.0**。\n- 3. 查看 **实际服务级别**\
  \ 部分中的默认值。\n- 4. 在 **营业时间** 部分，将 **开始时间** 和 **结束时间** 更改为与消费者讨论过或消费者期望的所需业务窗口；例如，**开始时间\
  \ 08:00** 和 **结束时间 18:00**。\n- 5. 将默认的 **可用性标准** 更改为符合业务标准。考虑计划停机（停电）以及它们在计算中是否被视为正常运行时间。\n\
  - 6. 在 **性能标准** 下，从 **可用性能指标** 中选择一个或多个指标。\n- 7. 单击 **确定**，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_74_0.png)\n\
  \n## 查看服务可用性定义\n\n可用性定义可以基于一个或多个关键测试来定义，例如登录测试和响应时间测试。它取决于提供商和消费者之间的合同。Grid Control\
  \ 具有灵活性，允许提供商根据合同要求编写任何公式。\n\n- 1. 单击 **监控配置** 选项卡。\n- 2. 单击 **可用性定义**。\n\n> 请注意基于服务测试确定可用性的依据。默认情况下，所有服务测试均设置为“关键”服务测试。“关键”测试用于确定可用性。非关键测试数据也会被历史收集，但不用于可用性判定。\n\
  \n- 3. 单击 **取消**。\n\n## 查看 BPEL 基础设施服务\n\nBPEL 基础设施服务封装了运行 BPEL 流程所需的基础设施组件。\n\n\
  - 1. 单击 **目标服务** 选项卡。\n- 2. 找到上一章中创建的基础设施服务（通用服务）。\n- 3. 单击基础设施服务以进入服务主页。\n\n![](img/7529bbd615e859608c21b965162348b2_75_0.png)\n\
  \n## 添加基础设施性能指标\n\n服务测试指标很重要，但基础设施指标也可以用来表示服务中断。\n\n- 1. 单击 **监控配置** 选项卡。\n- 2.\
  \ 单击 **性能指标** 链接。\n\n3. 如下一屏幕截图所示，对于已列出的默认性能指标，输入以下部分指标的 **警告阈值** 和 **严重阈值**：\n\n\
  - OC4J 实例 – 请求处理时间（秒）：3 和 5\n- 事务数（每秒）：20 和 50\n- 活动线程最高数量 [默认]：5 和 10\n- CPU 利用率（%）：80\
  \ 和 95\n- 平均同步进程延迟（毫秒）[默认]：3000 和 5000\n- 平均异步进程延迟（毫秒）[默认]：3000 和 5000\n\n![](img/7529bbd615e859608c21b965162348b2_76_0.png)\n\
  \n4. 将主页上的图表下拉菜单更改为显示 CPU 利用率。\n\n5. 单击 **确定** 并在确认屏幕上单击 **是**。\n\n## 添加基础设施使用指标\n\
  \n使用指标不计入可用性，但对于评估服务的增长很有用。性能和使用通常是并排查看的指标。\n\n- 1. 单击 使用指标 链接。\n- 2. 对于已列出的默认使用指标，输入以下部分指标的警告阈值和严重阈值：\n\
  - 自上次收集以来打开的实例 [默认]：20 和 50\n- OC4J 实例 – 活动会话：5 和 10\n- OC4J 实例 – 活动请求：20 和 50\n\
  - 自上次收集以来关闭的实例 [默认]：20 和 50\n- 3. 将主页上的图表下拉菜单更改为显示 OC4J 实例 – 活动请求，如以下屏幕截图所示：\n\n\
  ![](img/7529bbd615e859608c21b965162348b2_77_0.png)\n\n4. 单击 确定 并在确认屏幕上单击 是。\n\n\
  ## 设置服务级别期望（基础设施）\n\n与为服务设置和衡量期望的方式类似，也可以对一组逻辑基础设施组件进行期望和衡量。\n\n- 1. 从底部的 **相关链接**\
  \ 部分单击 **编辑服务级别规则**。\n- 2. 将 **预期服务级别** 从默认值更改为此服务所需的数值，即 **99.0**。\n- 3. 查看 **实际服务级别**\
  \ 部分中的默认值。\n- 4. 在 **营业时间** 部分，将开始和结束时间更改为与消费者讨论过或消费者期望的所需业务窗口；例如，**开始时间** 为 **08:00**，**结束时间**\
  \ 为 **18:00**。\n- 5. 将默认的 **可用性标准** 更改为符合业务标准。考虑计划停机（停电）以及它们在计算中是否被视为正常运行时间。\n-\
  \ 6. 在 **性能标准** 下，从 **可用性能指标** 中选择一个或多个指标。\n- 7. 参考以下屏幕截图完成上述步骤并单击 **确定**。\n\n![](img/7529bbd615e859608c21b965162348b2_78_0.png)\n\
  \n## 查看基础设施可用性定义\n\n这与查看服务可用性定义类似，只是底层组件可用性用于衡量可用性，而不是服务测试。\n\n- 1. 单击 **监控配置**\
  \ 选项卡。\n- 2. 单击 **可用性定义**。\n\n> 请注意基于系统组件确定可用性的依据。默认情况下，所有组件均设置为“关键”组件。“关键”组件用于确定可用性。非关键组件数据也会被历史收集，但不用于可用性判定。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_79_0.png)\n\n3. 单击 **取消**。\n\n## 查看 BPEL\
  \ 流程聚合服务\n\n聚合服务是可用性服务和基础设施服务的集合。当企业中存在许多服务时，这种逻辑分组使得查看和监控这些服务变得容易。\n\n- 1. 单击 目标\
  \ | 服务 选项卡。\n- 2. 找到之前创建的聚合服务。\n- 3. 单击聚合服务以进入服务主页。\n\n![](img/7529bbd615e859608c21b965162348b2_80_0.png)\n\
  \n## 查看聚合服务可用性定义\n\n聚合服务的可用性定义取决于底层组件服务。\n\n- 1. 在底部的相关链接下，单击 编辑服务。\n\n> 请注意此聚合服务对子服务的依赖关系。请注意基于两个子服务\
  \ AND 关系的可用性定义。\n\n## 添加聚合服务性能和使用指标\n\n底层服务指标可以提升到聚合服务级别，以确保关键指标对网络运营控制管理员以及高管可见。\n\
  \n- 1. 在 **编辑服务** 模式下单击 **性能** 选项卡。\n- 2. 单击 **添加** 按钮以提升子服务指标。\n- 3. 选择 **基于多个服务的统计聚合**\
  \ 选项。\n- 4. 将 **函数** 下拉菜单设置为 **最大值**。\n- 5. 为 **子服务** 添加行，即 **SOAOrderBooking(v.1.0)_availability（通用服务）**。\n\
  - 6. 如以下屏幕截图所示，为所选 **子服务** 指标选择 **指标名称**；例如，**客户端响应时间（毫秒）**、**选择服务响应时间（毫秒）** 和 **信用验证响应时间（毫秒）**。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_81_0.png)\n\n- 7. 单击 **继续**。\n- 8. 将\
  \ **指标名称** 编辑为合适的名称，即 **平均 BPEL 响应时间（毫秒）**。\n\n\n\n- 9. 输入适当的警告和严重阈值；例如，**3000**\
  \ 和 **5000**。\n- 10. 添加另一个性能指标。点击 **添加** 按钮。\n- 11. 从 **子服务** 下拉菜单中选择基础设施服务。\n-\
  \ 12. 选择相关的基础设施指标，即 **CPU 利用率 (%)**。\n- 13. 点击 **继续**，如下图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_82_0.png)\n\
  \n- 14. 注意警告和严重阈值已从子服务继承。保持在同一级别或根据需要修改。\n- 15. 点击 **确定**。\n\n## 设置服务等级期望（聚合服务）\n\
  \n这与为其他服务设置的期望类似。\n\n- 1. 从底部 **相关链接** 部分，点击 **编辑服务等级规则**。\n- 2. 将 **预期服务等级** 从默认值更改为此服务所需的数值，例如\
  \ **99.0**。\n- 3. 查看 **实际服务等级** 部分中的默认值。\n- 4. 在 **营业时间** 部分，将开始和结束时间更改为与消费者讨论过或消费者期望的所需业务窗口，即\
  \ **开始时间** 为 **08:00** 且 **结束时间** 为 **18:00**。\n- 5. 将默认的 **可用性标准** 更改为符合业务标准。考虑计划停机（黑屏）以及它们是否被视为计算中的正常运行时间。\n\
  - 6. 在 **性能标准** 下，从 **可用性能指标** 中选择一个或多个指标。\n- 7. 点击 **确定**，如下图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_83_0.png)\n\
  \n- 8. 从聚合服务主页，点击 **图表** 选项卡。\n\n> 注意本页图表中跟踪的已提升性能指标，并在图表上显示阈值。\n\n## 摘要\n\n有效监控\
  \ BPEL 服务对于监控消费者期望和保持信誉至关重要。Grid Control 提供了通过基础设施服务及其关联有效监控 BPEL 服务的方法。\n\n在本章中，我们讨论了\
  \ Grid Control 如何围绕 BPEL 流程和 BPEL 基础设施设置服务模型。内置的服务等级期望和利用可用性和性能指标进行的测量使得监控这些服务变得容易。此外，指标可以基于服务测试或基础设施指标。\n\
  \n将关键服务组件与基础设施组件关联起来，并从一个集成视图监控它们，对于管理员设置和控制消费者期望至关重要。\n\n接下来的几章将逐步介绍动手练习，以设置服务仪表板来监控为企业配置的服务。\n\
  \n## 6\n\n## BPEL 服务仪表板\n\n大多数 IT 部门都有服务台或帮助台，作为客户的单一联系点。服务台团队负责作为记录客户报告事件的第一线沟通。服务台分析师负责记录客户事件、验证服务健康状况和可用性，并通知相关\
  \ IT 部门有关新问题。\n\nBPEL 流程经常负责关键业务功能，例如计费、费用报告和订单履行。对于公司范围的服务，服务台需要跟踪这些关键流程。当用户因这些流程而向服务台投诉时，分析师需要查看一个通用仪表板以验证每个流程的状态。分析师需要了解流程不可用或性能不佳的时间有多长，以及预设的\
  \ **服务等级协议 (SLAs)** 是否已被违反。他们需要迅速采取行动，确保新事件由 IT 管理员及时记录并纠正。本章讲述创建仪表板以监控关键 BPEL 流程并监控每个流程的关键指标和\
  \ SLA。特别地，本章讲述：\n\n- 挑战\n- 解决方案\n- 分步练习：\n  - 导航到 **报表** 选项卡\n  - 创建 SOA 服务仪表板\n\
  \  - 查看 SOA 服务仪表板\n\n### 挑战\n\n服务台需要一个通用仪表板来监控关键 BPEL 流程。大多数企业缺乏有效的仪表板会导致服务提供商和消费者之间沟通不畅。此外，没有通用仪表板，SLA\
  \ 无法有效监控。缺乏透明度导致信任缺失，服务提供商的信誉受损，即使流程可用性和性能符合 SLA。\n\n### 解决方案\n\nGrid Control 通过服务仪表板显示关键服务的可用性和关键指标。服务台分析师、IT\
  \ 管理员以及 IT 高管可以通过使用这些仪表板跟踪当前和历史服务等级。自上而下的服务仪表板使 IT 组织能够从最终用户服务角度进行管理。通过例外管理，支持人员可以在客户投诉或\
  \ SLA 违规之前深入研究问题服务，以确定故障的根本原因。\n\n### 分步练习\n\n这组分步练习将逐步介绍创建服务仪表板以监控关键 BPEL 流程的过程。\n\
  \n### 导航到报表选项卡\n\nGrid Control 具有创建、发布和查看标准和自定义报表的能力。这些报表作为存储在 Grid Control 仓库中的监控和配置数据的窗口。\n\
  \n- 1. 从 Grid Control 主页，点击 **报表** 选项卡。\n- 2. 搜索 **服务监控仪表板**。\n\n![](img/7529bbd615e859608c21b965162348b2_86_0.png)\n\
  \n> Grid Control 为监控、安全和合规提供多个开箱即用的报表。这些报表由服务仪表板补充，服务台可以使用这些仪表板监控关键服务。\n\n### 创建\
  \ SOA 服务仪表板\n\n仪表板是众多报表类型之一。与其他 Grid Control 报表一样，有许多可配置方面，例如源或目标、要显示的内容以及显示的时间段。仪表板可以在不同的时区显示，具有自动刷新功能，并能够显示一个或多个有趣的时间窗口，例如最近一天、最近一周和最近一个月。\n\
  \n- 1. 选择 **服务监控仪表板** 旁边的单选按钮。\n- 2. 点击 **创建类似**，如下图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_87_0.png)\n\
  \n- 3. 输入 **标题** 为 **SOA 服务仪表板**。\n- 4. 将其他字段保持为默认值。\n\n### BPEL 服务仪表板\n\n- 5. 如以下截图所示，在\
  \ **目标** 部分下，选择 **使用指定的目标** 单选按钮。\n- 6. 点击 **元素** 选项卡。\n\n![](img/7529bbd615e859608c21b965162348b2_88_0.png)\n\
  \n- 7. 点击 **设置参数**。\n- 8. 编辑标题为 **SOA 服务仪表板**。\n- 9. 更改与您地理位置相关的时区。例如，**(UTC-08:00)\
  \ 美国太平洋时间 (PST)**。\n- 10. 在 **服务** 部分，选择所有 SOA 相关服务（除 EM 服务外）。\n- 11. 将 default_SOAOrderBooking(v.1.0)\
  \ 聚合服务移动到所选列表的顶部，如下图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_89_0.png)\n\n\
  - 12. 点击 继续。\n- 13. 点击 确定 以保存仪表板设置。\n\n### 查看 SOA 服务仪表板\n\n一旦仪表板创建完成，您可以查看它并查看关键服务的状态和健康状况。每个服务都有红色、黄色和绿色指示器，这可以很好地鸟瞰所有服务。\n\
  \n- 1. 导航到报表选项卡。\n- 2. 搜索标题 SOA 并点击 转到。\n\n\n\n\n3. 单击 SOA Services Dashboard 链接。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_90_0.png)\n\n> 查看关键 SOA 服务的性能和使用指标。服务仪表板可以根据系统管理员的需求进行自定义。\n\
  \n4. 单击 SOAOrderBooking(v.1.0)_availability 的箭头。展开可用性服务以查看底层服务测试及其各自的可用性。\n\n![](img/7529bbd615e859608c21b965162348b2_90_1.png)\n\
  \n5. 单击 **返回**，返回到 SOA 服务仪表板。单击基础设施服务的箭头。注意所有组件以及组件的汇总统计信息。\n\n![](img/7529bbd615e859608c21b965162348b2_91_0.png)\n\
  \n## 摘要\n\n服务仪表板对于向内部或外部用户提供服务的任何组织都至关重要。Grid Control 允许服务台分析师、IT 管理员和 IT 高管通过服务仪表板可视化关键服务方面。\n\
  \n在本章中，我们讨论了报告作为配置和监控数据的可视化工具的价值。我们创建了一个包含关键 SOA 服务的新仪表板，然后查看该仪表板以了解服务的状态和健康状况。\n\
  \n请注意，这些服务仪表板可以公开，供所有员工查看服务健康状况和可用性的统一来源。这在大型企业中很常见，用于查看电子邮件服务、ERP 和 CRM 服务以及关键\
  \ BPEL 流程的状态。这类似于一种程序正义方法，其中提供者和消费者都了解共同的 SLA 目标以及对这些目标的遵守程度。\n\n接下来的几章将逐步介绍动手练习，以部署\
  \ BPEL 流程并管理 BPEL 环境的配置。\n"
- "## 7 BPEL 部署自动化\n\n在大多数中大型企业中，应用程序开发人员编写代码，然后将其“抛过墙”给运维团队。运维团队现在负责在预发布和生产环境中部署和维护此代码。开发和运维团队通常隶属于不同的管理链，两者之间缺乏协调。\n\
  \nBPEL 流程开发和部署遵循相同的 methodology。管理员必须处理多个可能相互依赖的 BPEL 流程“suitcases”。通常，BPEL 流程部署应遵循企业现有的\
  \ methodology。运维团队应集中维护部署工件，并且该位置应与开发团队使用的位置不同。部署本身应是一个定义明确的流程，具有一系列可重复的步骤。此外，企业最佳实践集应在部署时被调用。本章介绍以标准化方式将多个\
  \ BPEL 流程 suitcases 部署到多个 BPEL 环境。具体来说，本章讨论：\n\n- 挑战\n- 解决方案\n- 逐步练习：\n  - 查看软件库\n\
  \  - 上传 BPEL suitcases 到软件库\n  - 查看 BPEL 流程配置部署流程\n  - 安排 BPEL suitcase 部署\n  -\
  \ 查看计划部署的状态\n  - 查看已部署的流程\n\n### 挑战\n\n在生产环境中部署应用程序是一项挑战。管理员必须在固定的时间窗口内将多个应用程序文件部署到多个目标。这耗时且需要对这些应用程序的专业知识。在\
  \ BPEL 环境中，当管理员必须手动处理 *ant 脚本* 以在生产环境中部署 BPEL suitcases 时，挑战更大。*Ant* 对于开发人员在开发机器上处理部署时来说是一个很棒的实用工具，但管理员并没有真正具备定制或构建生产级部署实用工具的专业知识。集中控制\
  \ suitcases 是第一个挑战，管理员必须跟踪 suitcases 以遵守变更和发布管理指南。接下来，部署本身就是一个挑战，因为管理员需要在指定的顺序中部署流程、调用可能需要的任何自定义脚本，并遵守计划的维护窗口。\n\
  \n### 解决方案\n\n使用 Grid Control，管理员可以使用软件库和部署流程框架将多个 BPEL 流程 suitcases 部署到多个 BPEL\
  \ PM 域。管理员收集部署信息的工作由 Grid Control 简化，后者已发现目标并知道目标的大多数关键属性，例如主机名、应用程序服务器名称、端口等。第一步是将\
  \ BPEL 流程 suitcases 上传到软件库以进行集中跟踪和部署。软件库还允许运维团队跟踪 suitcases 的成熟度和使用情况，以及其他软件组件，例如操作系统映像、数据库和应用程序服务器主目录。然后，五步访谈流程让用户选择源\
  \ suitcase 文件、选择目标 BPEL PM 和域、设置凭据，并使用作业系统安排未来的部署。\n\n### 分步练习\n\n这组逐步练习将介绍上传和部署\
  \ BPEL 流程 suitcases 的过程。\n\n### 查看软件库\n\nGrid Control 软件库是一个运行时版本控制系统。开发人员完成业务流程开发后，工件可以传递给（或由）软件库进行运营跟踪和部署。\n\
  \n1. 从 Grid Control 主页单击 Deployments 选项卡。\n2. 单击 Provisioning 子选项卡。\n3. 展开 Components\
  \ 以显示不同的组件类型。\n\n![](img/7529bbd615e859608c21b965162348b2_95_0.png)\n\n> 软件库包含多个对象，例如操作系统映像、数据库和应用程序服务器的\
  \ Oracle 主目录、BPEL 的部署工件等。库用于跟踪这些组件在各种受监控目标上的使用成熟度。\n\n4. 展开 Oracle Component | BPEL\
  \ Process Suitcase。\n\n> BPEL suitcase 是 BPEL 流程部署单元。它是一个 jar 文件，封装了 BPEL 流程的所有组件，例如\
  \ .bpel、一个或多个 .xsd 以及一个或多个 .wsdl 文件。\n\n5. 查看软件库的一部分的示例 BPEL suitcase。\n\n### 上传\
  \ BPEL suitcases 到软件库\n\nBPEL 流程项目被打包成“BPEL suitcase”，这是一个自包含的部署工件。管理员可以使用此工件部署到各种环境。\n\
  \n1. 为 **BPEL Process Suitcase** 选择单选按钮。\n2. 单击 **Create Component** 按钮。\n3. 在 **Describe**\
  \ 步骤中输入以下值：\n   - 将 **Type** 选择为 **Generic Component**。\n   - 名称为 **ParallelFlow**。\n\
  \   - 描述为 **Parallel Flow Sample**。\n   - 将其他字段留空。\n4. 单击 **Next**，如下图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_96_0.png)\n\
  \n5. 在 **Customize** 步骤中，保留默认值并单击 **Next**。\n\n6. 在 **Upload File** 步骤中：\n   - 选择\
  \ **Upload from Local Machine**。\n   - 单击 **Browse...** 按钮。\n   - 找到 BPEL suitcase\
  \ jar 文件夹。\n   - 对于当前示例，选择 `bpel_parallel_flow.jar`。\n\n![](img/7529bbd615e859608c21b965162348b2_97_0.png)\n\
  \n7. 单击 **Next**。\n8. 在 **Set Directives** 步骤中，选择 **Stage** 并单击 **Next**。\n9. 在\
  \ **Review** 步骤中，注意详细信息，然后单击 **Finish**。\n10. 注意确认消息以及新添加的 BPEL suitcase。\n\n11.\
  \ 重复上述步骤以向软件库添加其他 BPEL suitcases。\n\n![](img/7529bbd615e859608c21b965162348b2_98_0.png)\n\
  \n### 查看 BPEL 流程配置部署流程\n\nGrid Control 包含多个部署流程，用于自动化各种管理活动。\n\n1. 从 Grid Control\
  \ 主页单击 **Deployments** 选项卡。\n2. 向下滚动以找到 **Deployment Procedure Manager** 部分。\n3.\
  \ 单击 **Deployment Procedures** 链接。\n\n> 部署流程是一系列逻辑步骤，用于自动化与 Oracle 产品相关的关键管理任务。这些复杂的管理任务大多列在“Enterprise\
  \ Deployment Guide”中。请注意开箱即用的各种部署流程——数据库配置、RAC 扩展、应用程序服务器配置等。这些部署流程也可以自定义。\n\n4.\
  \ 单击 **BPEL Process Provisioning** 链接。\n\n\n\n5. 注意该流程下的步骤：\n\n![](img/7529bbd615e859608c21b965162348b2_99_0.png)\n\
  \n## 安排 BPEL suitcase 部署\n\n管理员的主要任务是安排开箱即用的部署流程一次性运行，或按计划运行。\n\n- 1. 从上一步继续，点击\
  \ **Schedule Deployment** 按钮。\n- 2. 在 **Source Selection** 步骤中：\n  - 点击 **Add**\
  \ 选择源 suitcase 捆绑包。\n\n> 这些捆绑包在实际部署前存储在 Grid Control 软件库中。\n\n## BPEL 部署自动化\n\n\
  - 从现有的 suitcases 中，您可以选择一个或多个进行部署。例如，选择 **ParallelFlow**、**UnitedLoan** 和 **AmericanLoan**。\n\
  - 点击 **Select** 继续。\n\n![](img/7529bbd615e859608c21b965162348b2_100_0.png)\n\n-\
  \ 使用 **Move Up** 和 **Move Down** 按钮来排序部署。\n\n> 在 BPEL 环境中，部署顺序至关重要，其中 partner links\
  \ 通常在调用它们的 BPEL 流程之前部署。\n\n- 点击 **Next** 继续。\n\n3. 在 **Target Selection** 步骤中，按下一截图所示执行以下步骤：\n\
  \n- 点击 **Add** 从受管 BPEL 目标列表中选择一个或多个目标；例如，选择 **gcsoa.us.oracle.com_bpel**。\n- 点击\
  \ **Select** 继续。\n\n- 对于每个 BPEL 目标，从 **BPEL Domain** 下拉菜单中选择 **default**。\n- 点击\
  \ **Next** 继续，如以下截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_101_0.png)\n\n\
  4. 在 **Credentials** 步骤中，按下一截图所示执行以下步骤：\n\n- 在 **Application Server Credentials**\
  \ 下提供主机凭据；即 **Username** 为 **oracle** 且 **Password** 为 *welcome1*。\n- 点击 **Next**\
  \ 继续。\n- 在 **BPEL Process Manager Credentials** 下，提供域级访问；即 **Username** 为 **oc4jadmin**\
  \ 且 **Password** 为 *welcome1*。\n\n这些主机和 BPEL Process Manager 的凭据可以存储在 Grid Control\
  \ “Preferred Credentials” 页面中并重复使用。\n\n![](img/7529bbd615e859608c21b965162348b2_102_0.png)\n\
  \n点击 Next。\n\n5. 在 Schedule 步骤中，按下一截图所示执行以下步骤：\n\n- 点击 One Time (Later) 并选择开始日期（例如，2008\
  \ 年 6 月 23 日），开始时间可以是几分钟后。\n- 在 Instance Name 字段中输入 BPEL Process Provisioning。\n\
  - 点击 Next 继续，如下一截图所示：\n\n部署可以立即安排或安排在未来时间，通常在客户维护窗口期间。Grid Control 作业系统负责作业调度和管理。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_103_0.png)\n\n- 6. 在 Review 步骤中：\n  -\
  \ 在提交部署作业之前查看所有信息。\n\n在准备就绪时点击 **Finish**，如以下截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_104_0.png)\n\
  \n## 查看已安排部署的状态\n\nGrid Control 提供了从其作业页面观察整体部署状态和各个步骤状态的手段。\n\n- 1. 从上一步继续，从 **Procedure\
  \ Completion Status** 选项卡中找到 **BPEL Process Provisioning** 作业。\n- 2. 点击 **BPEL Process\
  \ Provisioning** 作业查看详情，如以下截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_105_0.png)\n\
  \n作业状态页面显示已安排作业的详细信息，包括经过的时间和如有错误消息。\n\n- 3. 使用右上角的 **Refresh** 按钮查看进度。\n- 4. 等待作业成功完成。\n\
  - 5. 注意 **Status** 和 **Completed Date** 值。\n\n## 查看已部署的流程\n\n一旦部署成功完成，您可以在 BPEL\
  \ 控制台上验证新流程：\n\n- 1. 导航到 BPEL 目标主页。\n- 2. 点击 **Processes** 选项卡。\n- 3. 点击右上角的 **Refresh**\
  \ 按钮。\n- 4. 在列表中注意新部署的流程。\n\n## 摘要\n\n部署是运营管理员的关键任务。借助 Grid Control 软件库和部署流程功能，管理员可以管理\
  \ BPEL suitcases，并安排和自动化部署。\n\n在本章中，我们讨论了如何利用 Grid Control 的开箱即用部署功能。管理员可以查看部署流程，选择合适的流程，安排部署并观察部署过程。这是一个强大的自动化框架，可用于在多个环境中重复部署并同时进行。还有其他部署变体可能有用，例如在部署结束后再运行自定义脚本。\n\
  \n在 Grid Control 版本 10gR5 中，还支持部署计划（随 BPEL 10.1.3.4 引入）方法。换句话说，包含测试、暂存和生产环境 partner\
  \ links 详细信息的部署计划文件可以上传到软件库。在安排部署时可以使用此文件，partner link 更改将自动完成。客户通常会复制开箱即用的部署流程，并添加几个自定义步骤，使用自研脚本在部署之前或之后执行。\n\
  \n接下来的几章将通过动手练习介绍如何管理 BPEL 环境的配置。\n"
- "## 8 BPEL 配置管理\n\n在企业中管理软件和硬件资产的配置很重要，原因有几个。“了解你拥有什么”使 IT 管理员能够做出关于未来投资和淘汰旧资产的决策，标准化现有资产，在整个企业中管理变更，并排查与配置相关的性能问题。\n\
  \n当今大多数配置管理解决方案都符合 **IT Infrastructure Library (ITIL)** 框架所规定的最佳实践。所有资产都存储在称为 **Configuration\
  \ Management Database (CMDB)** 的中央存储库中。配置参数例如数据库的 `init.ora` 参数，或 WebLogic 应用服务器的\
  \ `startup` 参数，或 HTTP 服务器的端口号都存储在 CMDB 中。对这些参数的任何更改也会被跟踪。然后可以轻松地审计特定资产的更改，将资产相互比较（例如\
  \ database1 和 database2），比较同一资产的不同版本，将参考配置保存到 CMDB，并用其在整个企业中标准化。本章讨论管理 BPEL 环境的配置。具体来说，本章讨论：\n\
  \n- 挑战\n- 解决方案\n- 分步练习：\n  - 导航到 BPEL 目标配置管理：\n    - 查看最后收集的配置\n    - 将配置快照保存到存储库\n\
  - 导航到 Oracle Application Server 配置管理：\n  - 查看最后收集的配置\n  - 将配置快照保存到存储库\n- 对 BPEL\
  \ 环境进行更改\n- 对 Oracle Application Server 环境进行更改\n- 将当前 BPEL 配置与已保存的基线进行比较\n- 比较同一流程的\
  \ BPEL 流程版本\n- 将当前 Oracle Application Server 配置与已保存的基线进行比较\n- 查看与已保存基线进行比较的应用服务器目标比较结果\n\
  \n## 挑战\n\n跟踪所有 IT 系统的配置很困难。IT 部门经常求助于 Excel 电子表格来存储关键的 IT 系统信息。这使得 IT 部门在进行更改、衡量影响以及识别因配置错误导致的性能问题方面变得缓慢，并增加了管理数据中心的成本。对于\
  \ BPEL 环境，很难对工作配置进行基线化并将其与不工作的配置进行比较。在将它们推出生产之前，没有好的方法来比较连续的 BPEL 流程版本。\n\n## 解决方案\n\
  \n借助 Grid Control，BPEL PM 服务器和流程的关键配置指标会被收集并存储在 Grid Control 配置管理数据库中。这是存放监控信息的同一数据库存储库。管理员可以查看\
  \ BPEL 环境中历史配置更改。他们还可以通过将其保存到存储库中来对工作配置进行基线化。BPEL PM 服务器和域的配置参数可以与其他服务器和域进行比较。最后，还可以比较\
  \ BPEL 流程版本以观察连续部署之间的更改。\n\n\n\n## 分步练习\n\n这套逐步练习将演示如何管理 BPEL 和应用服务器目标的配置。\n\n###\
  \ 导航至 BPEL 目标配置管理\n\nGrid Control 为其所有受管目标（如数据库、应用服务器、BPEL PM 等）提供了丰富的配置管理功能。\n\n\
  - 1. 导航到 BPEL 目标主页。\n- 2. 单击 Administration 选项卡。\n- 3. 注意与目标配置管理相关的链接。\n\n> Grid\
  \ Control 配置管理框架每天收集 BPEL 的关键配置参数。这些参数存储在 Grid Control 仓库中。关键配置任务可从此处访问。\n\n![](img/7529bbd615e859608c21b965162348b2_109_0.png)\n\
  \n### 查看最后收集的配置\n\nGrid Control 代理按固定间隔（默认 24 小时一次）收集配置指标并上传到配置管理仓库。这使 Grid Control\
  \ 能够跟踪受管目标的配置历史。有多种方式查看配置历史，其中之一是最后收集的配置。\n\n- 1. 单击 **Last Collected Configuration**\
  \ 查看配置参数。\n- 2. 在 **Last Collected Configuration** 页面查看配置设置。\n- 3. **Process Manager**\
  \ 选项卡显示有关服务器的通用信息，包括 URLs、dehydration store 和 cluster 参数。\n\n![](img/7529bbd615e859608c21b965162348b2_110_0.png)\n\
  \n- 4. 单击 **Domains** 子选项卡。**Domains** 选项卡列出 BPEL 域以及每个域的重要配置参数。\n\n![](img/7529bbd615e859608c21b965162348b2_111_0.png)\n\
  \n- 5. 单击 **Processes** 子选项卡。**Processes** 选项卡显示已部署流程的列表，其中包含版本信息、底层文件和最后修改时间。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_111_1.png)\n\n### BPEL 配置管理\n\n- 6. 单击\
  \ **Configuration Files**。BPEL 服务器的关键配置文件现已存储在 Grid Control 仓库中并在此选项卡上显示。您可以单击文件以只读模式查看其内容。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_112_0.png)\n\n### 将配置快照保存到仓库\n\n在大型企业中，跨目标类型标准化配置非常重要。这有助于维护简便，也对合规性很重要。为了标准化配置，Grid\
  \ Control 提供了基于现有目标配置创建“gold”配置的方法，然后可将其用于与其他目标进行标准化：\n\n- 1. 单击右上角的 **Save** 按钮。\n\
  - 2. 选择 **Save to EM Repository** 选项。\n\n- 3. 输入描述，例如 GCSOA_<date>_BPEL_Baseline，如以下屏幕截图所示：\n\
  \n![](img/7529bbd615e859608c21b965162348b2_113_0.png)\n\n- 4. 单击 OK 将当前配置保存到 Grid\
  \ Control 仓库。\n\n- 5. 注意确认消息以及带有时间戳、名称、描述、保存日期和所有者的已保存配置。\n\n### 导航至 Oracle 应用服务器配置管理\n\
  \n由于 BPEL 由应用服务器托管，因此查看 Oracle 应用服务器配置也很有用：\n\n- 1. 从 Grid Control 主页单击 Targets\
  \ 选项卡。\n- 2. 选择 Application Servers 子选项卡。\n- 3. 单击应用服务器的名称，例如 soa.gcsoa.us.oracle.com。\n\
  \n- 4. 这会带您进入应用服务器的主页。\n\n![](img/7529bbd615e859608c21b965162348b2_114_0.png)\n\n\
  - 5. 单击 Administration 选项卡。\n\n> Grid Control 配置管理框架每天收集所有 Oracle 应用服务器目标以及各个组件（web\
  \ server、OC4J、BPEL PM 等）的关键配置参数。这些参数存储在 Grid Control 仓库中。\n\n### 查看最后收集的配置\n\n通常，管理员最想看到的就是目标的当前配置。这通常对应于\
  \ Grid Control 中的“last collected configuration”，并且可以刷新以启动按需收集以获取最新信息。\n\n- 1. 选择\
  \ Last Collected Configuration 链接，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_115_0.png)\n\
  \n- 2. 显示应用服务器的当前配置。General 选项卡显示应用服务器的关键组件以及一些关键配置参数，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_115_1.png)\n\
  \n- 3. 单击 J2EE Applications 选项卡以查看部署在此应用服务器上的所有 J2EE 应用程序。\n\n![](img/7529bbd615e859608c21b965162348b2_116_0.png)\n\
  \n- 4. 单击 Configuration Files 选项卡以查看关键配置文件。您可以单击文件以查看文件的只读版本。\n\n![](img/7529bbd615e859608c21b965162348b2_116_1.png)\n\
  \n### 将配置快照保存到仓库\n\n与 BPEL 配置快照类似，应用服务器配置也可以保存到 Grid Control 仓库，以便在整个企业中进行标准化：\n\
  \n- 1. 单击 Save 按钮保存当前配置。\n- 2. 选择 Save to the EM Repository 选项。\n- 3. 提供描述，例如 GCSOA_<date>_AS_Baseline。\n\
  - 4. 选择保存所有应用服务器组件配置的复选框，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_117_0.png)\n\
  \n- 5. 单击 OK 将当前配置保存到 Grid Control 仓库。\n\n- 6. 注意确认消息，以及带有目标名称、类型和时间戳的已保存配置。\n\n\
  ![](img/7529bbd615e859608c21b965162348b2_118_0.png)\n\n### 修改 BPEL 环境\n\nGrid Control\
  \ 控制台是一个或多个 BPEL PM 以及其他目标类型的管理界面。对于启动/停止、更改配置属性等管理功能，管理员需要使用产品控制台，在本例中为 BPEL 控制台。\n\
  \n- 1. 导航到 BPEL 目标主页。\n- 2. 在 **Related Links** 下，单击 **Administer (BPEL Console)**。\n\
  - 3. 使用 **Username** 为 **oc4jadmin** 和 **Password** 为 *welcome1* 登录。\n- 4. 单击 **Manage\
  \ BPEL Domain** 链接。\n- 5. 这会带您进入 BPEL 的管理页面，您可以在此设置域级参数。选择 **Configuration** 选项卡。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_119_0.png)\n\n- 6. 更改以下属性：\n  - AuditDetailThreshold\
  \ to 60k\n  - dspMaxThreads to 6\n  - dspMinThreads to 2\n  - LargeDocumentThreshold\
  \ to 60k\n\n- 7. 单击 Apply 按钮保存更改。\n\n- 8. 选择 **Logging** 选项卡并选择下拉菜单将所有日志级别更改为 **Warn**。warn\
  \ 的调试级别表示会记录到某些日志的警告消息，但应用程序能够在没有问题的情况下继续运行。\n\n![](img/7529bbd615e859608c21b965162348b2_120_0.png)\n\
  \n- 9. 单击 **Apply** 保存更改。\n\n- 10. 选择 **Logout** 退出 BPEL Control。\n\n### 修改 Oracle\
  \ 应用服务器环境\n\n与 BPEL 控制台类似，应用服务器也自带自己的管理控制台以进行配置更改。\n\n- 1. 从 Grid Control 主页单击 **Targets**\
  \ 选项卡。\n- 2. 选择 **Application Servers** 子选项卡。\n\n- 3. 单击应用服务器的名称—soademo.gcsoa.us.oracle.com。\n\
  - 4. 这会带您进入应用服务器的主页。\n- 5. 在 Related Links 部分底部单击 Administer 链接。\n- 6. 使用用户名为 oc4jadmin\
  \ 和密码为 welcome1 登录 AS Control 控制台。\n- 7. 单击 oc4j_soa 链接以进入此 oc4j 实例的主页，如以下屏幕截图所示：\n\
  \n![](img/7529bbd615e859608c21b965162348b2_121_0.png)\n\n\n\n- 8. oc4j_soa 主页显示此\
  \ oc4j 实例的关键可用性和性能指标。\n\n![](img/7529bbd615e859608c21b965162348b2_122_0.png)\n\n\
  - 9. 单击“管理”选项卡。\n\n- 10. 单击“服务器属性”任务名称旁边的“转到任务”按钮，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_122_1.png)\n\
  \n- 11. 将 MaxPermSize 值从 126M 改为 256M。\n\n![](img/7529bbd615e859608c21b965162348b2_123_0.png)\n\
  \n- 12. 单击“应用”以保存更改。注意确认消息。\n- 13. 单击“集群拓扑”面包屑。\n- 14. 选中 oc4j_soa 旁边的复选框。\n- 15.\
  \ 单击“重启”按钮以重启此 oc4j 容器，使更改永久生效。\n\n![](img/7529bbd615e859608c21b965162348b2_123_1.png)\n\
  \n- 16. 单击**是**以重启 oc4j_soa。注意确认消息。\n- 17. 重启完成后退出 EM Application Server 控制。您现在已成功对应用服务器属性进行了一些更改。\n\
  \n## 与已保存的基线比较当前的 BPEL 配置\n\n比较是检测两个或多个目标之间配置差异的有用方法。观察配置的相似性很有用，更重要的是，在出现性能问题或为标准化目的时观察差异。\n\
  \n- 1. 导航到 BPEL 目标主页。\n- 2. 单击**管理**选项卡。\n- 3. 单击**上次收集的配置**。\n- 4. 单击**刷新**按钮以获取最新的配置更新并等待一段时间。\n\
  - 5. 单击**比较**按钮，开始对 BPEL 目标的当前配置与已保存的（生产基线）配置进行比较。\n\n![](img/7529bbd615e859608c21b965162348b2_124_0.png)\n\
  \n- 6. 单击**已保存的配置**链接。\n\n- 7. 选择 GCSOA_<date>_BPEL_Baseline 进行比较。\n- 8. 单击比较以生成比较结果。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_125_0.png)\n\n- 9. 查看与已保存基线的 BPEL 目标比较结果。\n\
  - 10. BPEL 目标之间的比较结果分为四个类别显示。摘要选项卡列出了四个类别的状态。\n\n![](img/7529bbd615e859608c21b965162348b2_125_1.png)\n\
  \n## BPEL 配置管理\n\n- 11. 单击“流程管理器”选项卡。流程管理器选项卡列出了目标的一般参数的差异或相似性，包括脱水存储和集群参数。\n\n\
  ![](img/7529bbd615e859608c21b965162348b2_126_0.png)\n\n- 12. 单击“域”选项卡。域选项卡列出了两个目标中的各个域。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_126_1.png)\n\n- 13. 单击“结果”列中的不等号以查看差异。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_127_0.png)\n\n- 14. 单击“比较 BPEL 流程管理器”面包屑。\n\
  \n- 15. 单击“流程”选项卡。流程选项卡比较所有已部署的流程。流程内的底层文件将被比较。\n\n- 16. 单击“配置文件”选项卡，其中列出了文件比较的结果。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_127_1.png)\n\n## BPEL 配置管理\n\n- 17. 单击“结果”列中的不等号以查看文件大小和修改时间的差异。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_128_0.png)\n\n- 18. 单击浏览器的“后退”按钮。\n\n\
  - 19. 单击“比较文件内容”。\n\n- 20. 在比较文件内容页面上查看文件之间的差异。\n\n![](img/7529bbd615e859608c21b965162348b2_128_1.png)\n\
  \n## 比较同一流程的 BPEL 流程版本\n\nGrid Control 可以为不同类型的目标提供目标比较。BPEL 世界中更有趣的比较之一是比较 BPEL\
  \ 流程的连续版本，或不同环境中的类似 BPEL 流程。Grid Control 使管理员或开发人员能够做到这一点，从而协助变更管理和影响分析。\n\n- 1.\
  \ 在当前场景中，我们将在同一服务器上比较同一 BPEL 流程的两个版本。\n- 2. 单击“比较 BPEL 流程管理器”面包屑。\n- 3. 单击“流程”选项卡。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_129_0.png)\n\n> 注意两个目标之间流程的差异。您可以看到 FlowSample、AmericanLoan\
  \ 和 UnitedLoan 的 BPEL 流程有更新的版本。\n\n- 4. 单击 FlowSample 流程的大于号。\n- 5. 这会带您进入比较流程页面，您可以在此比较流程的不同版本。\n\
  \n## BPEL 配置管理\n\n- 6. 从“版本”下拉列表中为同一流程选择两个不同的版本。\n- 7. 单击“比较文件内容”，如下图所示：\n- 8. 注意这些流程底层文件的差异。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_130_0.png)\n\n![](img/7529bbd615e859608c21b965162348b2_130_1.png)\n\
  \n- 9. 通过向下滚动，您可以看到流程的 1.2 版本中添加了一个额外部分。\n\n## 与已保存的基线比较当前的 Oracle 应用服务器配置\n\n同样的方法也可以用于\
  \ Oracle 应用服务器目标：\n\n- 1. 导航到 Oracle Application Server 目标的主页。\n- 2. 选择**目标**选项卡，然后选择**应用服务器**子选项卡。\n\
  - 3. 单击应用服务器名称的链接，例如 **soademo.gcsoa.us.oracle.com**，以进入应用服务器主页。\n- 4. 单击**管理**选项卡。\n\
  - 5. 单击**上次收集的配置**。\n- 6. 单击**刷新**按钮以获取最新的配置更新。\n- 7. 单击**比较**按钮，开始对应用服务器目标的当前配置与已保存的（生产基线）配置进行比较。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_131_0.png)\n\n- 8. 单击**已保存的配置**链接。\n\
  - 9. 选择 **GCSOA_<date>_AS_Baseline** 进行比较。\n\n- 10. 单击**比较**以生成比较结果。\n\n![](img/7529bbd615e859608c21b965162348b2_132_0.png)\n\
  \n## 查看与已保存基线的应用服务器目标比较结果\n\n一旦启动比较，相似之处和差异就可以在 Grid Control 用户界面上观察到：\n\n- 1. 应用服务器目标之间的比较结果分为四个类别呈现。**摘要**选项卡列出了四个类别的状态。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_133_0.png)\n\n- 2. 单击“常规”选项卡以查看关键参数值以及与基线的更改。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_133_1.png)\n\n- 3. 单击“J2EE 应用程序”选项卡以查找任何更改。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_134_0.png)\n\n- 4. 单击“配置文件”选项卡以查找配置文件的关键更改。\n\
  \n- 5. 单击不等号旁边的单选按钮。\n\n![](img/7529bbd615e859608c21b965162348b2_134_1.png)\n\n\
  - 6. 单击**比较文件内容**以查看与基线版本的实际更改。\n\n![](img/7529bbd615e859608c21b965162348b2_135_0.png)\n\
  \n- 7. 观察 **MaxPermSize** 的更改。\n\n![](img/7529bbd615e859608c21b965162348b2_135_1.png)\n\
  \n## 摘要\n\n配置管理对于管理员控制环境中的变更以及排除与配置更改相关的故障至关重要。借助 Grid Control 的配置管理功能，管理员可以管理变更并减少排除故障所需的时间。\n\
  \n在本章中，我们讨论了配置管理以及它如何应用于 BPEL PM 和应用服务器目标。我们讨论了两种目标类型的配置概述，查看了最新的配置信息，并将参考“黄金”配置快照保存到\
  \ Grid Control 仓库。然后，我们通过各个产品控制台进行了一些配置更改。在 Grid Control 中观察这些更改以及将其与“黄金”标准进行比较是相当简单的。此外，比较\
  \ BPEL 流程版本并注意连续版本之间的更改也很有用。\n\n配置管理已通过 Enterprise Manager 收购了两个新产品而得到扩展，即 **配置更改控制台\
  \ (CCC)** 和 **应用程序更改控制台 (ACC)**。借助这两个产品，管理员可以主动查看发生的更改，以及回滚和向前回滚到所需的配置。\n\n接下来的几章将介绍\
  \ SOA Suite 的配置和克隆。\n\n\n\n## 9\n\n## SOA Suite 克隆\n\n软件维护通常占总体成本的 70%，其中包括许可费用。企业必须担心软件维护工作，其中包括产品更新、安全更新、硬件更新和环境刷新。这些都是耗时的工作，需要在多个领域具备人力专业知识。随着软件老化，企业仍需为遗留软件维持这种人力专业知识，而遗留软件虽然对业务至关重要，但可能代价高昂，有时还会通过增加拥有成本来抵消整体业务价值。\n\
  \n越来越多的企业转向自动化生命周期管理工具，以帮助完成与软件生命周期维护相关的繁重工作。制定维护计划时拥有正确的策略非常重要。维护应是整体策略的一部分，而非事后考虑。\n\
  \n本章涵盖：\n- 挑战\n- 解决方案\n- 分步练习：\n  - 将 Oracle Application Server 集群添加到 Grid Control\n\
  \  - 停止应用服务器进程\n  - 在 Grid Control 软件库中创建组件\n  - 克隆 Oracle Application Server 和\
  \ SOA 应用\n  - 验证新创建的集群\n\n### 挑战\n\n在当今的数据中心，服务通常需要在短时间内进行配置。这些服务可能由复杂的分层配置组成，例如\
  \ Oracle Application Server 和 SOA 应用软件。管理员必须经过多个步骤才能将 SOA Suite 从一个安装克隆到另一个安装。这些步骤包括克隆复制的文件、配置它们，并进行更改以反映新的安装。一些\
  \ Oracle 管理员具备数据库克隆技能，但大多数人并不具备克隆应用服务器的专业知识，更不用说 SOA Suite 了。这种服务的手动安装通常耗时且容易出错。\n\
  \n### 解决方案\n\nGrid Control 提供了将测试过的镜像克隆到多个主机的灵活且可扩展的方式。具体来说，Grid Control 提供了一个预定义的、完全可定制的用于克隆\
  \ Oracle Application Server 和 SOA 应用的流程。该流程使管理员能够基于现有的参考应用服务器或集群创建新的 Oracle Application\
  \ Server 实例或 Oracle Application Server 集群；从而自动化常见的 IT 任务，例如基于测试或暂存环境创建生产 SOA Suite\
  \ 环境，或扩展现有的 Oracle Application Server 集群以适应负载增加。\n\n### 分步练习\n\n本套分步练习将演示如何克隆部署在\
  \ Oracle Application Server 10.1.3.x 上的 Oracle SOA Suite 10.1.3.x。\n\n### 将 Oracle\
  \ Application Server 集群添加到 Grid Control\n\n第一步是创建应用服务器集群目标，以便以后进行克隆。\n\n![](img/7529bbd615e859608c21b965162348b2_138_0.png)\n\
  \n> 为了通过克隆创建新集群，Grid Control 必须知道一个已安装的现有集群以供克隆。\n\n1. 在 Grid Control 主页上，单击 Targets\
  \ | Middleware 选项卡。\n\n![](img/7529bbd615e859608c21b965162348b2_139_0.png)\n\n在表中，您应该至少看到两个\
  \ Oracle Application Server 目标：一个托管 Grid Control 应用，另一个托管 SOA Suite，如前几章所述。虽然托管\
  \ SOA Suite 的 Oracle Application Server 实例已在 Enterprise Manager 中被发现，但它所属的集群尚未被发现。\n\
  \n2. 从 Add 下拉菜单中选择 Oracle Application Server Cluster 并单击 Go，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_139_1.png)\n\
  \n3. 出现一个提示输入现有集群信息的页面。为集群提供一个名称，例如 Cluster 10131。\n\n4. 要指定集群成员的应用服务器实例，请单击手电筒图标。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_140_0.png)\n\n5. 在 Search and Select:\
  \ Targets 页面上，选择集群成员的应用服务器实例的名称并单击 Select 按钮，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_140_1.png)\n\
  \n6. Add Oracle Application Server Cluster 页面上的剩余字段将根据您的选择自动填充，如下一屏幕截图所示。单击 OK。\n\
  \n### 添加 Oracle Application Server 集群\n\n为了将 Oracle Application Server 集群添加到 Grid\
  \ Control 以进行监控和集中管理，您必须指定要添加的 Oracle Application Server 集群成员的 Oracle Application\
