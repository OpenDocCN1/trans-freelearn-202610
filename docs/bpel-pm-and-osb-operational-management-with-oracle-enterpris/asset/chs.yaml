  \n![](img/7529bbd615e859608c21b965162348b2_192_1.png)\n\n## 摘要\n\n记录和监控关键的端用户路径是提高端用户满意度的积极方法。在全球经济中，企业需要确保用户能够随时随地获得所需的信息。没有合成监控策略的管理解决方案是不完整的。\n\
  \n在本章中，我们讨论了如何创建 Web 应用程序、记录 Web 事务以及为性能和使用目的使用特定指标。此外，我们还讨论了如何配置从各种代理或 Beacon 运行这些合成事务。最后，我们讨论了如何查看\
  \ Web 事务以查看和验证所有步骤。\n\nGrid Control 中的合成服务测试监控由被动的真实用户监控补充。Enterprise Manager 的\
  \ Real User Experience Insight（来自 Moniforce 收购）是该领域的优秀工具。有关 Real User Experience\
  \ Insight 的更多信息可在 Oracle Technology Network 上找到。\n\n\n\n## 11\n## WebLogic 和 OSB\
  \ 目标的发现\n\n在 10.2.0.5（或 10gR5）版本发布后，Grid Control 引入了用于管理 **Oracle 服务总线（OSB）** 的新功能，**Oracle\
  \ 服务总线（OSB）** 前身为 **AquaLogic 服务总线（ALSB）**。在 10.2.0.5 之前，Grid Control 已支持异构应用服务器。具体来说，Grid\
  \ Control 对 **WebLogic 服务器（WLS）** 的监控功能可追溯至 7.x 版本。OSB 管理的引入补充了 WLS 管理功能，并在很大程度上增强了\
  \ Grid Control 的中间件管理能力。\n\n在 10.2.0.5 版本中，Grid Control 提供了多个 OSB 管理功能，例如发现 OSB\
  \ 组件、监控 OSB 代理和业务服务、监控扩展的 WebLogic 和底层基础设施、部署自动化、配置管理和服务级别管理。\n\n本章讨论 WebLogic Server\
  \ 和 OSB 实例的发现。发现 WebLogic 和 OSB 是执行其他管理任务之前的第一步。本章涵盖以下内容：\n\n- 挑战\n- 解决方案\n- 分步练习：\n\
  \  - 添加 WebLogic 域目标\n  - 导航到 OSB 目标主页\n\n### 挑战\n\n对于任何小型、中型或大型企业而言，挑战在于从单个控制台管理多个不同的应用、中间件和数据库目标。传统的硬件和软件组件，如服务器、存储设备、操作系统、数据库、中间件和应用程序，一直由系统管理解决方案进行管理。随着\
  \ BPEL 和 OSB 等集成软件的兴起，应用程序和基础设施带来了新的问题。首先，它们需要与现有硬件和软件一起管理。其次，随着 WebLogic 域和 OSB\
  \ 项目在企业中不断 proliferate，基础设施团队面临着管理这些项目日益增加的问题。第三，对于刚接触 OSB 的管理员来说，在生产环境中支持这些环境会带来未知挑战。最后，随着\
  \ OSB 项目的增加，IT 管理员希望避免聘用新的管理员。\n\n### 解决方案\n\nGrid Control 提供了一种在开发、测试、预生产或生产环境中发现\
  \ WebLogic 和 OSB 组件的方法。对于基础设施团队而言，这是一种从一个控制台管理多个安装的便捷方式。前提条件是在托管 WebLogic 管理服务器的服务器上安装\
  \ Grid Control 代理。一旦安装了 Grid Control 代理，即可从控制台启动发现过程。\n\n### 分步练习\n\n这组分步练习将指导如何发现\
  \ WebLogic 和 OSB 目标。\n\n### 添加 WebLogic 域目标\n\n管理 WebLogic 和 OSB 环境的第一步是发现 WebLogic\
  \ 目标——管理、集群和托管服务器：\n\n- 1. 从 Grid Control 主页，单击 **目标** | **中间件**。\n- 2. 单击 **配置**\
  \ 子选项卡。\n\n> 这是一个显示企业中所有受监控中间件组件的视图。Grid Control 可以发现和管理多种类型的应用服务器，例如 Oracle Application\
  \ Server、WebLogic、WebSphere 和 JBoss。每个被发现和管理的中间件都有一个或多个目标类型和一个或多个目标。对于每个目标，都会汇总状态摘要、详细信息、警报、策略违规、主机\
  \ CPU 使用率和内存使用率。\n\n3. 从右侧的下拉菜单中，添加一个 Oracle WebLogic Server 域目标。单击 Go，如以下屏幕截图所示：\n\
  \n![](img/7529bbd615e859608c21b965162348b2_197_0.png)\n\n4. 在主机步骤中，如下一屏幕截图所示填写字段：\n\
  \n- 从手电筒中选择管理服务器主机。\n- 版本为 10.x（支持 WebLogic Server 7.x 及以上版本）。\n- 端口为 7021（这是默认的管理端口）。\n\
  - 管理服务器用户名为 weblogic。\n- 密码为 `<Your WebLogic admin password>`\n- 选中“保存为首选凭据”复选框。\n\
  - 管理服务器主目录为 `/u01/homes/osb_wls/wlserver_10.3/server/lib`。\n- 将其他字段留空。\n- 单击下一步。\n\
  \n### WebLogic 和 OSB 目标的发现\n\n![](img/7529bbd615e859608c21b965162348b2_198_0.png)\n\
  \n5. 在主机凭据步骤中：\n\n- 主机用户名为 oracle。\n- 密码为 <Your WebLogic admin password>。\n- 选中“保存为首选凭据”复选框。\n\
  - 单击下一步。\n\n6. 在选择托管服务器步骤中：\n\n- 选中已发现的管理/托管服务器和 Oracle 服务总线目标的域。\n- 单击下一步，如下一屏幕截图所示：\n\
  \n![](img/7529bbd615e859608c21b965162348b2_198_1.png)\n\n- 在“审核”步骤中，单击“完成”。\n- 在中间件页面上，观察确认消息。查看新发现的\
  \ WebLogic 域、托管服务器和 OSB 目标。\n\n![](img/7529bbd615e859608c21b965162348b2_199_0.png)\n\
  \n### 导航到 OSB 目标主页\n\n一旦发现 WebLogic 和 OSB 组件，有用的是访问 OSB 目标主页并观察有用的监控相关信息。\n\n- 单击\
  \ **Oracle 服务总线目标名称** 超链接。\n\n> 在 Oracle 服务总线目标主页上，您将看到 OSB 服务器的可用性状态、可用性 %（过去 24\
  \ 小时）、Oracle WebLogic Server 域、版本和主机。\n\n![](img/7529bbd615e859608c21b965162348b2_199_1.png)\n\
  \n### 摘要\n\n发现是企业中管理目标的第一步。从单个控制台发现和管理多个目标是快速掌握新项目同时保持标准化管理平台的强大方式。这避免了为增加受管目标数量的新项目聘用新的管理员。\n\
  \n在本章中，我们研究了如何发现 WebLogic Server 和 OSB 目标。特别是，我们讨论了定位和识别 WebLogic 和 OSB 组件的强制性发现过程。数据中心中管理多个组件存在若干挑战。Grid\
  \ Control 提供单一界面来发现和管理这些不同的组件。在练习中，我们逐步介绍了发现 WebLogic 和 OSB 组件的简单步骤。最后，我们查看了 OSB\
  \ 目标主页上的关键监控区域。\n\nWebLogic 服务器发现是强制性的，其结果是 OSB 会自动被发现。这些是启用 WebLogic 或 OSB 上后续管理任务的强制性步骤。接下来的几章将指导动手练习，以设置并执行对已发现目标的额外管理任务。\n\
  \n## 12\n## OSB 部署自动化\n\n在大多数中大型企业中，集成开发人员必须处理跨多个部门的多个计划的管理。在 WebLogic 和 Oracle\
  \ 服务总线（OSB）领域，这转化为多个 WebLogic/OSB 项目分布在多个 WebLogic 域中。通常，集成开发人员负责项目开发和测试，而 WebLogic\
  \ 管理员负责部署和运营支持。由于开发和运营组织中不同的工具和流程，这种交接并不完全顺畅。\n\nWebLogic 管理员必须处理多个 OSB 项目。通常，OSB\
  \ 项目部署应遵循企业中现有的方法论。运营团队应集中维护部署工件，并且该位置应与开发团队使用的位置不同。部署本身应是一个定义良好的流程，具有一系列可重复的步骤。此外，企业最佳实践集应在部署时被调用。本章讨论以标准化方式将多个\
  \ OSB 项目部署到 OSB 环境。特别是，本章讨论：\n\n- 挑战\n- 解决方案\n- 分步练习：\n  - 查看软件库\n  - 将项目上传到软件库\n\
  \  - 查看项目部署流程\n  - 安排项目部署\n\n\n\n\n## 挑战\n\n在生产环境中部署应用程序是一项挑战。SOA 应用程序开发人员构建新项目或现有项目的新版本，并将它们“跨墙”交给运维团队。管理员必须在固定的时间窗口内将多个应用程序文件部署到多个目标。从测试到预发布再到生产的过程中，这一过程会重复进行。这会消耗时间，并需要对这些应用程序具备专业知识。集中控制\
  \ WebLogic 项目是第一个挑战，管理员必须跟踪项目版本以符合变更和发布管理规范。接下来部署本身也是一个挑战，因为管理员需要使用特定的自定义配置部署项目并遵守计划的维护窗口。总体而言，鉴于运营环境的限制，管理员需要处理太多手动任务。\n\
  \n## 解决方案\n\n使用 Grid Control，管理员可以将多个 OSB 项目部署到域部署流程框架中。五步访谈流程让用户可以选择源项目、选择目标 OSB\
  \ 服务器和域、设置凭据、指定配置和自定义文件，并使用作业系统安排未来的部署。\n\n- 在企业软件库中存储 OSB 部署工件\n- 从实时 OSB 服务器导出\
  \ OSB 部署工件\n- 跟踪 OSB 部署工件的成熟度和使用情况\n- 将 OSB 项目从测试部署到预发布再到生产\n- 在未来的维护窗口中部署\n\n##\
  \ 分步练习\n\n这套分步练习将指导管理 OSB 项目的部署。\n\n## 查看软件库\n\n第一步是查看 Grid Control 中的操作存储或软件库。这是管理员查看库存、添加项目或更改现有项目的起点。\n\
  \n1. 在 Grid Control 主页上，单击 **部署** 选项卡。\n2. 单击 **配置** 子选项卡。\n3. 展开 **组件** 以显示组件类型。\n\
  \n> 软件库包含多个对象，例如操作系统映像、数据库和应用服务器的 Oracle 主目录，以及 BPEL、OSB 等的部署工件。库用于跟踪这些组件在各种受监控目标上的使用成熟度。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_203_0.png)\n\n## 将项目上传到软件库\n\n在此特定场景中，管理员已获得\
  \ OSB 项目的副本，并需要部署它。在部署之前，管理员需要将项目上传到 Grid Control 软件库以进行跟踪、操作版本控制并启用部署：\n\n1. 将\
  \ OSB 项目上传到软件库\n2. 选择 **Oracle 组件** 的单选按钮。\n\n3. 单击创建组件按钮。\n\n![](img/7529bbd615e859608c21b965162348b2_204_0.png)\n\
  \n4. 在描述步骤中输入以下值，如下一屏幕截图所示：\n\n- 将类型选择为通用组件。\n- 名称为 OSB 项目。\n- 将其他字段留空。\n- 单击下一步。\n\
  \n![](img/7529bbd615e859608c21b965162348b2_204_1.png)\n\n5. 在自定义步骤中，保留默认值并单击下一步。\n\
  \n6. 在 **上传文件** 步骤中：\n\n- 选择 **从代理机器上传**。\n- 单击 **选择目标** 按钮。\n- 将 **主机名** 选择为 gcsoa.us.oracle.com。\n\
  - 单击 **选择文件** 按钮。\n- 选择 `sbconfig.jar` 的位置，该文件来自 OSB 服务器上的现有项目，已压缩并存储在本地机器上；例如：`/u01/homes/osb_wls/projects/sbconfig.jar`。\n\
  \n> 请注意，您可以在部署过程中直接从实时 OSB 服务器导出项目。这将是部署流程最常见的用法。不过在此研讨会中，导出 jar 已提前创建。此导出 jar 包含从另一台\
  \ OSB 服务器提取的多个项目。\n\n单击 **下一步**。\n\n7. 在 **设置指令** 步骤中，单击 **下一步**。\n\n8. 在 **审核**\
  \ 步骤中，注意详细信息，然后单击 **完成**。\n\n9. 注意确认消息，以及已添加的新 **OSB 项目** 通用组件。\n\n![](img/7529bbd615e859608c21b965162348b2_205_0.png)\n\
  \n10. 激活 OSB 项目以供使用：\n\n- 选择 **OSB 项目** 的单选按钮。\n- 单击 **激活**，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_206_0.png)\n\
  \n## 查看项目部署流程\n\nGrid Control 附带开箱即用的流程，可部署包括 OSB 项目在内的 Oracle 组件。这些流程通过自动化手动步骤简化管理员的工作，从而节省时间并减少人为错误。\n\
  \n1. 查看 **Oracle Service Bus 资源配置** 部署流程：\n\n- 在 Grid Control 主页上，单击 **部署** 选项卡。\n\
  - 向下滚动以找到 **部署流程管理器** 部分并单击 **部署流程** 链接。\n\n部署流程是一系列逻辑步骤，用于自动化与 Oracle 产品相关的关键管理任务。这些复杂的管理任务大多列在“Enterprise\
  \ Deployment Guide”中。请注意开箱即用的各种部署流程——数据库配置、RAC 扩展、应用服务器配置等等。这些部署流程也可以自定义。\n\n- 搜索\
  \ \"service\" 以找到 OSB 部署流程。\n- 单击 Oracle Service Bus 资源配置 链接。\n\n![](img/7529bbd615e859608c21b965162348b2_207_0.png)\n\
  \n- 注意流程下的步骤以及步骤的编排。\n\n请注意，您可以通过在任何位置添加步骤来自定义此流程。您可以使用 Create Like 按钮来实现此操作。\n\n\
  ![](img/7529bbd615e859608c21b965162348b2_207_1.png)\n\n## 安排项目部署\n\n现在我们熟悉了 OSB\
  \ 项目部署流程，下一步是启动部署。这可以通过简单的访谈流程完成：\n\n1. 安排 OSB 项目部署。\n2. 从上一步继续，单击 **安排部署** 按钮。\n\
  3. 在 **选择源** 步骤中，按以下步骤操作：\n   - 选择 **Oracle 软件库** 单选按钮。\n   - 单击 *组件* 搜索灯以从库中定位\
  \ jar 文件。\n   - 找到之前上传的 OSB 项目。\n   - 单击 **选择** 以选择源 suitcase 捆绑包。\n   - 将密码短语字段留空。\n\
  \   - 单击 **下一步** 继续。\n4. 在 **选择目标** 步骤中：\n   - 从搜索灯中选择相关的 WebLogic 域。\n   - 指定 BEA\
  \ 主目录，例如：`/u01/homes/osb_wls`。\n\n> 这些捆绑包在实际部署前存储在 Grid Control 软件库中。\n\n![](img/7529bbd615e859608c21b965162348b2_208_0.png)\n\
  \n- 将 **高级选项** 部分保持原样。\n- 将 **自定义文件** 选项保持原样。\n\n> 您可以在部署期间指定高级选项以及上传自定义文件。自定义文件可以上传到软件库，并在开发、预发布、测试和生产部署中重复使用。\n\
  \n单击 **下一步** 继续，如以下屏幕截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_209_0.png)\n\
