  \ Databases\"、\"Oracle 10g/11g Data and Database Management Utilities\" 和 \"Oracle\
  \ VM Manager 2.1.2\"。\n\n> 我要感谢我的妻子 Susanne，以及埃德蒙顿歌剧院，在我进行这些审阅以及我自己的书籍工作时给予的耐心。\n\
