  第 12 章《OSB 部署自动化》讨论将 OSB 项目和资源部署到多个域可能繁琐且耗时。本章逐步讲解典型的部署场景以及如何使用部署流程框架对其进行自动化。这使基础设施团队能够标准化部署，并集中跟踪和管理工件。\n\
  \n第 13 章《OSB 代理和业务服务监控》引导读者了解 Oracle Service Bus 服务，这些服务提供多功能的[content]\n## 书中应包含的内容\n\
  \n本书详细介绍了如何在生产环境中设置和自动化各种对 Oracle SOA 产品平稳运行至关重要的操作任务。它将通过逐步练习引导您，帮助管理员从单一基于 Web\
  \ 的控制台管理这些产品。它将使管理员免于执行单调、耗时且重复的任务。\n\n## 书中不会包含的内容\n\n本书避免对 SOA、BPEL 或 Service\
