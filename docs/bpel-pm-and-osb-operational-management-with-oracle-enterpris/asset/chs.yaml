  \ 字段将自动为您填充。\n- 提供主机的凭据。如果在目标发现期间选中了 **存储首选凭据** 复选框，则 **用户名** 和 **密码** 字段再次自动为您填充。\n\
  \n\n\n点击 **下一步** 继续操作，如以下截图所示：\n\n![](img/7529bbd615e859608c21b965162348b2_210_0.png)\n\
  \n6. 在 **计划** 步骤中，按以下步骤操作：\n\n- 选择 **一次性（立即）**。\n- 将 **宽限期** 保留为 **无限**。\n- 为 **实例名称**\
  \ 字段保留默认名称 **OSB Resource Provisioning_1235085922548**，或指定新名称\n- 点击 **下一步** 继续操作，如以下截图所示：\n\
  \n> 部署可以立即安排或安排在未来某个时间，通常是在客户维护窗口期间。Grid Control 作业系统负责作业调度和管理。\n\n![](img/7529bbd615e859608c21b965162348b2_210_1.png)\n\
