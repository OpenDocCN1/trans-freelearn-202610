  \ GDB 相比查询速度较慢。\n\n在此之后，在下一节中，我们将介绍图分析和建模的主要两个驱动包。我们将向您展示这些包的基本用法。在随后的章节中，我们将继续构建这些包为何强大的原因。\n\
  \n### NetworkX 和 igraph 简介\n\n在本章中，我们将介绍两个用于创建内存中图的 Python 包：NetworkX 和 igraph。\n\
  \nNetworkX 让你创建图、执行图操作、研究和可视化其结构，并在处理图时执行多种图操作函数。他们的网站（https://networkx.org/）包含对包的主要更改的详细信息以及工具的预期用途。\n\
  \nigraph 包含一套有用的实用分析工具，其目标是使这些工具高效且易于使用，并且可重复。igraph 的优点在于它是开源和免费的，而且它支持在 R、Python、Mathematica\
  \ 和 C/C++ 中构建网络。这是我们推荐用于创建可比 NetworkX 加载更快的大型网络的包。要了解有关 igraph 的更多信息，请访问 https://igraph.org/。\n\
  \n在以下小节中，我们将查看 NetworkX 和 igraph 的基础知识，并附带易于遵循的编码步骤。这是您第一次亲自动手进行图数据建模。\n\n#### NetworkX\
  \ 基础\n\nNetworkX 是 Python 原本可用的图库之一，特别注重用户友好和 Pythonic 的风格。它还原生包含计算一些经典网络分析度量的方法：\n\
  \n1. 要将 NetworkX 导入 Python，请使用以下命令：\n\n   ```\n   import networkx as nx\n   ```\n\
  \n2. 要创建一个空图 g，请使用以下命令：\n\n   ```\n   g = nx.Graph()\n   ```\n\n3. 现在，我们需要向图中添加节点，这可以通过\
  \ g 所属的 Graph 对象的 方法完成。有多种方法可以做到这一点，最简单的方法是一次添加一个节点：\n\n   ```\n   g.add_node(\"\
  Jeremy\")\n   ```\n\n4. 或者，可以一次将多个节点添加到图中，如下所示：\n\n   ```\n   g.add_nodes_from([\"\
  Mark\", \"Jeremy\"])\n   ```\n\n5. 可以通过将节点和字典元组传递给 Graph.add_nodes_from 在创建期间向节点添加属性：\n\
  \n   ```\n   g.add_nodes_from([(\"Mark\", {\"followers\": 2100}), (\"Jeremy\", {\"\
  followers\": 130})])\n   ```\n\n6. 要向图中添加边，我们可以使用 Graph.add_edge 方法，并引用图中已有的节点：\n\
  \n   ```\n   g.add_edge(\"Jeremy\", \"Mark\")\n   ```\n\n值得注意的是，在 NetworkX 中，添加边时，作为该边一部分指定的任何尚未在图中的节点将被隐式添加。\n\
  \n7. 为了确认我们的图现在包含节点和边，我们可能想使用 matplotlib 和 networkx.draw() 将其绘制出来。with_labels 参数将节点名称添加到绘图中：\n\
  \n   ```\n   import matplotlib.pyplot as plt\n   nx.draw(g, with_labels=True)\n\
  \   plt.show()\n   ```\n\n本节向您展示了如何使用几行 Python 代码快速上手 NetworkX。在下一节中，我们将把重点转向流行的\
  \ igraph 包，它允许我们在比使用流行的 NetworkX 更快的时间内对更大的数据集执行计算。\n\n#### igraph 基础\n\nNetworkX\
  \ 虽然用户友好，但在处理较大图时速度较慢。这是因为其幕后实现以及它是用 Python 编写的，其中包含一些 C、C++ 和 FORTRAN。\n\n相比之下，igraph\
  \ 用纯 C 实现，给库在处理大型图和复杂网络算法时带来优势。虽然对于初学者来说不如 NetworkX 立即可访问，但 igraph 是一款在代码效率至关重要时值得掌握的工具。\n\
  \n最初，使用 igraph 与使用 NetworkX 非常相似。让我们看一下：\n\n1. 要将 igraph 导入 Python，请使用以下命令：\n\n\
  \   ```\n   import igraph as ig\n   ```\n\n2. 要创建一个空图 g，请使用以下命令：\n\n   ```\n   g\
  \ = ig.Graph()\n   ```\n\n与 NetworkX 不同，在 igraph 中，所有节点都有规定的内部整数 ID。第一个添加的节点 ID\
  \ 为 0，后续节点分配递增的整数 ID。\n\n3. 与 NetworkX 类似，可以通过使用 Graph 对象的 方法来更改图。可以使用 Graph.add_vertices\
  \ 方法向图中添加节点（请注意，顶点是节点的另一种说法）。以下代码可将两个节点添加到图中：\n\n   ```\n   g.add_vertices(2)\n\
  \   ```\n\n4. 这将向图中添加节点 0 和 1。要命名它们，我们必须为节点分配属性。我们可以通过访问 Graph 对象的顶点来做到这一点。类似于访问列表中的元素，每个节点的属性都可以通过以下符号访问。在这里，我们设置节点\
  \ 0 和 1 的 name 和 followers 属性：\n\n   ```\n   g.vs[0][\"name\"] = \"Jeremy\"\n  \
  \ g.vs[1][\"name\"] = \"Mark\"\n   g.vs[0][\"followers\"] = 130\n   g.vs[1][\"followers\"\
  ] = 2100\n   ```\n\n5. 节点属性也可以按列表方式添加，其中第一个列表元素对应节点 ID 0，第二个对应节点 ID 1，以此类推。以下两行与第\
  \ 4 步中显示的四行等效：\n\n   ```\n   g.vs[\"name\"] = [\"Jeremy\", \"Mark\"]\n   g.vs[\"\
  followers\"] = [130, 2100]\n   ```\n\n6. 要添加边，我们可以使用 Graph.add_edges() 方法：\n\n \
  \  ```\n   g.add_edges([(0, 1)])\n   ```\n\n在这里，我们只添加一条边，但可以向 add_edges 所需的列表参数添加更多边。与\
  \ NetworkX 一样，如果为当前不在图中的节点添加边，节点将被隐式创建。然而，由于 igraph 要求节点具有顺序 ID，尝试向只有两个顶点的图中添加边对\
  \ (1, 3) 将失败。\n\n\n\n\n\n### 摘要\n\n在本章中，我们探讨了为什么你应该开始用图的思维方式思考，从这些方法为何正成为各行各业中应用最广泛、讨论最多的方法这一益处出发。我们了解了什么是图，并解释了各种类型的图，例如关注事物如何在网络中流动的图、影响力图（社交媒体上谁在影响谁）、用于识别群体和交互的图方法，以及如何利用图来检测网络中的模式。\n\
  \n接着，我们研究了构成图的基本要素。在此，我们考察了节点、边和属性的基本元素，并深入探讨了无向图和有向图之间的区别。此外，我们还考察了节点的属性，研究了异构图，并检查了图中包含的各类模式。\n\
  \n由此引出了图数据库（GDB）与传统关系型数据库（RDB）的对比，以及为什么在许多情况下，图的遍历和查询更加简单快捷。我们还举例说明了如何利用图来优化火车旅程中的站点停靠，以及如何轻松地将其扩展，将公交站点作为新的数据源加入其中。\n\
  \n随后，我们考察了图在各行各业中的部署情况，以及图在这些行业中至关重要的部分用例，例如金融领域的欺诈检测、政府领域的情报画像、医院中的患者旅程、网络中的客户流失分析，以及营销中的客户细分。图确实正变得无处不在。\n\
  \n在本章的最后，我们介绍了图分析和网络分析的强大工具——igraph 和 NetworkX。我们向你展示了如何仅用几行 Python 代码，就能轻松开始填充一个图。\n\
  \n在下一章中，我们将探讨如何处理和创建图数据模型。下一章将包含更多动手实践示例，教你如何在 Python 中使用图数据模型来组织数据。\n"
- "## 2 使用图数据模型\n\n本章将引导你运用迄今所学的内容，从业务问题出发，逐步过渡到如何获取数据，然后让这些数据为图做好准备。本章的目标是教授你快速开始使用图数据模型所需的基础技能。\n\
  \n本章将重点介绍许多关键技能，帮助你迅速掌握图数据模型的使用，以及图结构的许多属性。在接下来的各节中，我们的目标是让你熟悉 igraph，并学会如何使用它将数据导入到图中。\n\
  \n在此基础上，我们将逐步建立你对如何在图中建模节点和边的理解。最终将通过一个用例来巩固和强化你在本章所学的知识。\n\n该用例将涉及建模图结构所需的关键技术，以及度中心性的含义。\n\
  \n在本章中，我们将涵盖以下主要内容：\n\n- 从表格数据过渡到图数据\n- 在 Python 中实现模型\n- 最受欢迎的电视节目——一个真实世界的用例\n\
  \n### 技术要求\n\n我们将使用 Jupyter notebook 来运行编码练习；这需要 python>=3.8.0，以及以下包，这些包需要通过你环境中的\
  \ pip install 命令安装：\n\n- networkx==2.8.8\n- igraph==0.9.8\n- matplotlib\n\n所有包含编码练习的\
  \ notebook 都可以在以下 GitHub 链接中找到：https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH02。\n\
  \n### 从表格数据过渡到图数据\n\n为了引入图数据模型的强大功能，我们首先要使用一个真实的社交媒体数据集，该数据集来自 Facebook。这个开源数据包含有关\
  \ Facebook 页面的信息，包括页面名称和页面类型。数据中包含了四种类型的页面，即电视节目、公司、政治家和政府组织。此外，我们还有页面之间相互点赞的数据。如果两个页面在\
  \ Facebook 上互相点赞，这就会在我们的数据中表现出来。\n\n在这个阶段，我们可以开始思考如何最好地为这个数据集建模。为了构建一个图，我们从第 1 章“真实世界中的图简介”中了解到，我们需要将事物表示为节点，并将这些节点之间的关系表示为边。\n\
  \n在接下来的小节中，我们将研究在设计高效且有效的模式时需要检查的数据、思考和注意事项，然后我们将着手在 Python 中实现该模型。让我们直接开始吧。\n\n\
  ### 检查数据\n\n我们需要仔细查看我们的数据，以确定如何将数据转换为图格式。我们的数据以 .csv 格式提供，因此本质上是表格形式的。\n\n我们可以先查看斯坦福大型页面间网络数据集（https://snap.stanford.edu/data/facebook-large-page-page-network.html）的前几行，以及该数据集中的一个文件——即\
  \ musae_facebook_target.csv——在编辑器中打开：\n\n```\nid,facebook_id,page_name,page_type\n\
  0,145647315578475,The Voice of China 中国好声音,tvshow\n1,191483281412,U.S. Consulate\
  \ General Mumbai,government\n2,144761358898518,ESET,company\n```\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_36_0.png)\n\
