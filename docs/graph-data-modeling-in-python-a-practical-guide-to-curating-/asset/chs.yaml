  \ 22,471，即行数）来确认 CSV 文件已正确加载。\n\n接下来，我们将扩展已加载的数据，向图中添加节点和属性。\n\n### 添加节点和属性\n\n\
  在 igraph 中，我们可以像在第 1 章“真实世界中的图简介”中那样，一次添加一个节点来开始创建图。然而，与 Python 中的许多操作一样，通过一次操作按列表方式添加节点会更快。以下步骤将带你完成添加节点及其属性的过程：\n\
  \n1. 为此准备数据，我们需要节点名称的列表，以及每个节点属性。我们可以使用更多的列表推导式来准备这些列表：\n\n```\nnode_ids = [int(row[0])\
  \ for row in data[1:]]\npage_names = [row[2] for row in data[1:]]\npage_types =\
  \ [row[3] for row in data[1:]]\n```\n\n请注意，对 data 进行的 [1:] 列表切片是从每个列表中移除 csv 表头，我们不希望将表头作为节点包含在内。\n\
  \n2. 我们需要确认数据的 id 行是否按顺序递增。如第 1 章“真实世界中的图简介”所述，igraph 为添加到图中的每个节点使用一个顺序递增的整数索引。如果我们的\
  \ id 列也使用这种方式，那么添加节点将是一个简单的过程。为了确认这一点，我们可以将 id 列与 Python 的 range() 进行比较：\n\n```\n\
  assert node_ids == list(range(len(node_ids)))\n```\n\n这个 assert 语句确保 range() 从 0\
  \ 到 node_ids 列表的 len() 与数据中的节点 ID 列表相等。这个 assert 语句不应该引发 AssertionError 错误，因为它们是完全相同的。\n\
  \n3. 这意味着将我们的节点导入 igraph，在这种情况下，只需创建一个新的、无向的、空图，并告诉 igraph 我们想要的节点数量即可：\n\n```\n\
  import igraph as ig\ng = ig.Graph(directed=False)\ng.add_vertices(len(node_ids))\n\
  ```\n\n\n\n\n与之前处理节点类似，我们使用Python内置的csv库导入csv边列表（见“在Python中实现模型”部分的步骤1）。该文件不包含特殊字符，因此我们无需指定编码。\n\
  \n同样，我们通过打印导入的列表的列表的前几行以及行数，来大致了解我们将向图中添加多少条边。\n\n2. 请注意，该文件也包含一个表头，我们不想不小心将其作为图中的一条边。此外，在igraph中，节点通过其整数ID引用，因此我们需要将列表元素转换为整数，为添加边做准备。我们可以使用列表推导式来完成此操作并删除表头：\n\
  \n```\nedges = [[int(row[0]), int(row[1])] for row in edge_data[1:]]\nprint(edges[:10])\n\
  ```\n\n然后我们再次打印前10个元素，确认边列表已正确转换为整数。\n\n3. 数据准备好后，就可以使用 g.add_edges() 方法一次性将所有边添加到图中：\n\
  \n```\ng.add_edges(edges)\n```\n\n4. 我们可以通过访问图的 es 属性并计数来确认边是否已添加：\n\n```\nprint(len(g.es))\n\
  ```\n\n该数值应等于 .csv 文件中的行数减一（即171,002条边）。\n\n5. 我们还要确认一条已知应存在于图中的边已被正确添加。查看 musae_facebook_edges.csv\
  \ 的第一个非表头行，可以看到节点0和节点18427之间应该有一条边。我们可以使用 es 属性和索引访问添加到图中的第一条边：\n\n```\nfirst_edge\
  \ = g.es[0]\n```\n\n6. 这条边应连接ID为0和18427的节点。我们可以通过打印新建的 first_edge 变量的 source 和 target\
  \ 属性来验证这一点：\n\n```\nprint(first_edge.source)\nprint(first_edge.target)\n```\n\n\
  7. 最后，为了将其与真实数据集联系起来，我们可以通过访问节点的 page_name 属性来检查这条边代表哪些Facebook主页：\n\n```\nprint(g.vs[0]['page_name'])\n\
  print(g.vs[18427]['page_name'])\n```\n\n这表明这些节点对应的Facebook主页是“The Voice of China\
  \ 中国好声音”和“The Voice Global”，并且这两个Facebook主页有相互点赞关系。\n\n### 编写通用的图导入方法\n\n在上一节中，我们分许多小步骤从数据集创建了图。下次导入类似图时，我们可能希望加快此过程，为此可以编写一些更通用的Python方法。\n\
  \n让我们首先考虑从Facebook相互点赞的 .csv 文件创建图所需的步骤。回顾上一节，我们做了以下工作：\n\n- 创建一个空的 igraph Graph()\
  \ 对象\n- 导入包含节点、节点属性和边的 .csv 文件\n- 向图中添加节点，并进行一些测试\n- 向图中添加边，并进行更多测试\n\n接下来的系列步骤将引导你了解如何创建函数以在将来加快该过程，并让你轻松地将此代码用于自己的项目：\n\
  \n1. 首先，让我们考虑 .csv 导入。你可能已经注意到，我们以非常相似的过程导入了之前的两个 .csv 文件，将 .csv 文件中的行转换为列表的列表。让我们改为定义一个函数来完成这项工作：\n\
  \n```\ndef read_csv(csv_path):\n    \"\"\"\n    Import a csv file.\n\n    :param\
  \ csv_path: Path to the csv to import.\n    :return: A list of lists read from the\
  \ csv.\n    \"\"\"\n\n    import csv\n    import os\n\n    assert os.path.exists(csv_path),\
  \ \\\n        f'File could not be found at {csv_path}.'\n\n    with open(csv_path,\
  \ 'r', encoding='utf-8') as csv_file:\n        reader = csv.reader(csv_file)\n \
  \       data = [row for row in reader]\n\n    return data\n```\n\nread_csv() 方法中包含一条\
  \ assert 语句，使用 Python 标准库 os 来确保指定的文件路径存在。assert 语句后跟一个逗号和一个 f 字符串，指示 Python 在 assert\
  \ 语句失败时将字符串打印到控制台，从而帮助调试。以这种方式使用 assert 语句是进行基本 Python 代码测试的有用工具。\n\n2. 接下来，我们将使用导入的列表的列表，向图中添加节点和边，首先从节点开始。我们将把该函数拆分为多个步骤；首先，我们将添加文档设置来记录函数的输入：\n\
  \n```\ndef add_nodes(g, nodes, attributes):\n    '''\n    Add nodes to the graph.\n\
  \n    :param g: An igraph Graph() object.\n    :param nodes: A list of lists containing\
  \ nodes and node attributes, with a header. The first\n                  element\
  \ of each list in nodes should be the\n    node ID.\n    :param attributes: A list\
  \ of attributes corresponding to the header (index 0) of the nodes list.\n     \
  \                   The names of attributes in this list will\n    be added to the\
  \ graph.\n    '''\n\n    return g\n```\n\n3. 然后，我们使用 assert 语句在条件不满足时抛出错误。第一个条件检查导入的列分隔值中是否存在\
  \ id 列。下一条 assert 语句检查节点ID是否以连续递增的方式增加。最后一条 assert 语句检查输入到图中的数据是否为 list 类型：\n\n\
  ```\nassert nodes[0][0] == 'id', \\\n    f'The first column in the imported csv\
  \ should be the ID header, \"id\". Instead, it \\\n    f'is {nodes[0][0]}.'\n\n\
  \    node_ids = [int(row[0]) for row in nodes[1:]]\n    assert node_ids == list(range(len(node_ids))),\
  \ \\\n        f'Node IDs should increase sequentially in the imported csv, from\
  \ 0 to the number of\\' \n        f' nodes-1, {len(node_ids)}.'\n\n    assert isinstance(attributes,\
  \ list), \\\n        f'Attributes to add to the graph should be a list. Instead\
  \ attributes is of type\\' \n        f' {type(attributes)}.'\n```\n\n4. 函数的最后部分是在图中添加顶点，遍历导入文件中的属性，并在图中创建这些属性：\n\
  \n```\ng.add_vertices(len(node_ids))\n\n    headers = nodes[0]\n    for attribute\
  \ in attributes:\n        attr_index = headers.index(attribute)\n        g.vs[attribute]\
  \ = [row[attr_index] for row in nodes[1:]]\n```\n\n这个 add_nodes() 方法建立在本章前面的代码基础上，我们首先将数量等于导入的\
  \ .csv 文件长度（不含表头）的节点添加到图中，然后为这些节点添加属性。这里，使用用户指定的要包含的属性列表，在 csv 表头中找到这些属性的索引元素，然后从节点列表的列表中的每个列表中取出该索引的每个元素。现在包含节点和属性的\
  \ g 图随后被返回。\n\n同样，这里也有 assert 语句来确认导入的数据符合预期格式。我们测试加载的节点属性 csv 表头是否包含 id 字段，并且该字段位于表头的索引\
  \ [0] 处。正如本章前面提到的，我们还断言每行第[0]个元素中的节点ID是连续递增的整数，这是 igraph 按预期运行的必要条件。最后，我们断言用户指定的\
  \ attributes 参数是 list 类型。这是为了确保导入属性的通用 for 循环按预期运行，即针对 attributes 中的每个属性。\n\n5.\
  \ 在此步骤中，既然节点和属性已添加，我们可以使用另一个辅助方法将边添加到图中：\n\n```\ndef add_edges(g, edges):\n    '''\n\
  \    Add edges to the graph, where nodes are already present.\n    :param g: An\
  \ igraph Graph() object.\n    :param edges: A list of lists containing edges, with\
  \ a header.\n    '''\n\n    assert len(edges[0]) == 2, \\\n        f'Each element\
  \ in the imported edges csv should be of length 2, representing an edge'\\\n   \
  \     f' between two linked nodes. Instead, the first element is of length {len(edges)[0]}.'\n\
  \n    edges_to_add = [[int(row[0]), int(row[1])] for row in edges[1:]]\n    g.add_edges(edges_to_add)\n\
  \n    return g\n```\n\n\nfirst_edge = g.es[0]\nprint(first_edge.source)\nprint(first_edge.target)\n\
  print(len(g.es))\nprint(g.vs[0]['page_name'])\nprint(g.vs[18427]['page_name'])\n\
  \n现在我们已经确认图数据模型按预期设置好了，可以开始用它来回答基于网络的问题。有了详细检查图的工具，我们就能以批判性的眼光审视数据集以及我们在图模式中表示它的方式。\n\
  \n在下一节中，我们将运用这里学到的知识并将其应用到一个用例中，假设我们是被 Facebook 聘用的数据科学家，将图数据科学技术付诸实践并解决一个实际用例。\n\
  \n### 最受欢迎的电视节目——一个真实世界的用例\n\n在本节中，我们将有幸扮演 Facebook 数据科学家的角色，以确定数据集中最受欢迎的电视节目等内容。这将考验我们目前所学的知识，并带你经历一个典型的图数据科学家常被要求解决的用例。\n\
  \n为此，我们首先要研究相互点赞图的一般性质。我们将从检查图的结构开始，然后转向你可能需要考虑的其他一些事项，例如称为度中心性的概念。\n\n在这里，你将运用新学到的技能。我们首先检查图的结构，然后分析图中实体的连通性，接着查看图中的高度数节点。\n\
  \n我们将通过以下步骤，利用目前获得的新知识，实现找到最受欢迎电视节目的最终目标：\n\n- 1. 我们首先对图中数据的结构做一些分析；重点将放在常用的数据科学技术上，例如绘制图直方图来可视化分布。\n\
  - 2. 接下来是图的连通性。这是一个重要步骤，因为它能让你看到图中的各组成部分彼此之间的连通程度。为此，我们将专注于 Facebook 上的相互点赞数据集，并考察高度数节点的连通性。\n\
  - 3. 最后，我们将构建初始推荐引擎，在这种情况下推荐电视节目。\n\n这听起来很有趣，那就让我们开始吧，像耍蛇人一样驯服这个图问题。\n\n### 检查图结构\n\
  \n现在我们已经把数据放入图模型，可以考虑一些基于网络的分析。一个好的起点是检查图的一些一般属性，以了解其结构。\n\n在网络分析中，查看图的度分布是一种常见做法。每个节点都有一个度中心性，其最简单形式就是与该节点共享边的节点数量。因此，度分布本质上就是整个图中节点度中心性的直方图。\n\
  \n下面的步骤将对此进行详细说明，并且与我们在上一节中创建的图有关。在随附的 Jupyter 笔记本中，这些函数已保存在 graphtastic.utils 中，可以使用\
  \ graphtastic.utils import graph_from_attributes_and_edgelist 轻松导入。\n\n方便的是，igraph\
  \ 内置了一种快速构造并打印给定图度分布的方法，即对 Graph() 对象使用 degree_distribution 方法：\n\n```\nhistogram\
  \ = g.degree_distribution(bin_width=5)\nprint(histogram)\n```\n\nbin_width 参数可以更改为任何整数，用于指定直方图绘图的精细程度。\n\
  \n我们的直方图显示，在 Facebook 相互点赞图中，有 8,324 个节点最多与 4 个其他节点相连（请注意，打印出的直方图左侧显示的 (0, 5] 区间表示法不包含度中心性为\
  \ 5 的节点）。在另一端，连接最多的节点的度中心性在 705 到 709 之间，而连接第二多的节点的度中心性在 675 到 679 之间。\n\n让我们使用\
  \ matplotlib 库，以更美观的格式绘制这些度频率：\n\n```\nimport matplotlib.pyplot as plt\nbins = 30\n\
  plt.hist(g.degree(), bins)\nplt.xlabel('Node degree centrality')\nplt.ylabel('Frequency')\n\
  plt.show()\n```\n\n这将得到下图：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_46_0.png)\n\
  \n图 2.2 – 节点度中心性直方图\n\n我们稍后还会回到这些度分布图，因为它们对于可视化图结构特别有用。\n\n我们在这里看到的图结构类型——许多节点连接很少，而少数节点连接很多——非常常见。作为参考，在任意图中连接度很高的节点被称为枢纽或枢纽节点。这些枢纽节点往往不成比例地承担了节点之间的连通性，从而产生了社交网络中的六度分隔等现象，即只要通过六层朋友的朋友就可以连接任意两个人。我们将在后面的章节中详细探讨这些概念，但现在，我们将专注于识别\
  \ Facebook 图中的重要节点。\n\n### 衡量连通性\n\n并非所有图都是完全连通的，了解 Facebook 相互点赞数据集的这一特性可能会很有意义。如果图中某个节点无法通过遍历边从另一个节点到达，那么该图就是碎片化的。在这种情况下，图的每个不同部分被称为连通分量。\n\
  \n让我们使用 igraph 检查 Facebook 相互点赞图中有多少个连通分量。我们可以使用 igraph 内置的 clusters() 方法轻松完成：\n\
  \n```\nconnected_components = g.clusters()\nprint(connected_components)\n```\n\n\
  我们的打印语句将显示图中有多少个连通分量，以及每个分量包含哪些节点。在此图中，我们只有一个连通分量，表明该图是完全连通的。\n\n请注意，对于无向图，连通分量比有向图更容易理解。在有向图中，有时图的某一部分只能通过沿着一条边的相反方向遍历才能到达。如果是这种情况，那么图的这一部分被称为弱连通分量。相比之下，强连通分量可以由图中其他节点沿着边的自然方向访问。igraph\
  \ 库允许你将 clusters() 方法的 mode 参数指定为 weak 或 strong。在我们的无向图情况下，我们可以让 igraph 默认模式为强连通分量。\n\
  \n既然我们已经了解了图的结构（这在图应用中始终是一个好习惯），我们就可以开始更深入地研究图数据集中的某些特定元素和区域。\n\n### 查看高度数节点\n\n\
  以下步骤将介绍如何处理网络中的高度数节点，以及如何在 Python 中实现这些步骤：\n\n- 1. 要查看度中心性最高的节点，我们首先使用 zip 将两个元组组合成一个列表包装器；这两个元组分别是\
  \ page_name 和节点之间的关联度。接下来，我们使用一个匿名函数（也称为 Lambda）按降序（反转）对 degree 排序：\n  ```\n  degree\
  \ = list(zip(g.vs['page_name'], g.degree()))\n  sorted_degree = sorted(degree, key=lambda\
  \ x: x[1], reverse=True)\n  print(sorted_degree[:10])\n  ```\n  从控制台输出中，我们可以看到 US\
  \ Army 节点的度中心性最高，有 709 个相互点赞。为了将其与真实世界数据联系起来，请思考这对 US Army 的 Facebook 页面意味着什么。它不仅在其他政府机构、政治家、电视节目和公司中是一个广受欢迎的点赞页面，而且还表明\
  \ US Army 页面也在积极回赞这些页面。\n\n- 2. 如果我们想查看某种类型的高度数节点，则需要调整我们的 igraph 代码。要找到度中心性最高的电视节目，我们可以使用\
  \ vs.select() 方法，并传入一个指定我们正在查找的页面类型的参数 page_type_eq。然后，像前面的代码片段一样，我们将度数和页面名称压缩在一起——这次仅针对电视节目节点——对其进行排序并打印结果：\n\
  \  ```\n  tv_nodes = g.vs.select(page_type_eq='tvshow')\n  tv_indices = [node.index\
  \ for node in tv_nodes]\n  ```\n\n\n\n\n\n```\ntv_degree = list(zip(g.vs[tv_indices]['page_name'],\
  \ g.degree(tv_indices)))\nsorted_tv_degree = sorted(tv_degree, key=lambda x: x[1],\
  \ reverse=True)\nprint(sorted_tv_degree[:10])\n```\n\n这告诉我们，在我们的图中，度最高的是 Today Show，拥有\
  \ 141 个相互点赞。\n\n### 使用 select() 来查询图\n\n在上一节中，我们使用了 vs.select()，值得更详细地讨论，因为它是一个特别强大的方法。其强大之处在于其灵活的参数，这些参数由节点类型或属性以及比较运算符组成。\n\
  \n在之前的示例中，我们使用了 page_type_eq 参数，设置为 tvshow。这告诉 vs.select() 搜索具有 page_type 属性等于（由\
  \ _eq 指定）tvshow 的节点。这里，_eq 可以替换为许多其他运算符，如下所示：\n\n| Select 参数元素 | 比较运算符 |\n|---|---|\n\
  | _eq | 等于 |\n| _ne | 不等于 |\n| _lt | 小于 |\n| _gt | 大于 |\n| _le | 小于或等于 |\n| _ge\
  \ | 大于或等于 |\n| _in | 在给定列表中 |\n| _not in | 不在给定列表中 |\n\n表 2.1 – select() 的 Dunder\
  \ 表达式\n\n因此，使用上表，如果我们想找到类型为 government 或 politician 的节点，我们可以使用以下代码：\n\n```\ngov_pol_nodes\
  \ = g.vs.select(page_type_in=['government', 'politician'])\n```\n\n在此基础上，在 select()\
  \ 方法内，在 Graph() 方法前加上下划线，可以在运行时计算节点属性。例如，我们可以使用以下代码查找度在 100 到 140 之间的所有 TV 节点：\n\
  \n```\none_to_three_100_nodes = g.vs.select(_degree_ge=100,\n                  \
  \          _degree_le=140,\n                            page_type_eq='tvshow')\n\
  print(one_to_three_100_nodes['page_name'])\n```\n\n这里，select() 参数被分层以返回更具体的仅满足我们条件的四个节点集合。我们还通过在\
  \ degree 关键字前加上下划线在 select() 方法中使用了 degree。例如，要获取度大于 100，我们使用了 magic 方法 _degree_ge=100；这充当了下限，上限指定为\
  \ _degree_le=140。\n\n值得注意的是，使用 select() 在运行时计算节点和图特征最适合于度等简单计算。对于一些计算要求更高的网络科学计算，最好将计算的节点属性作为节点属性添加，而不是像前一个\
  \ degree 示例中那样计算两次。\n\n与度相比，度计算每个节点的边，一些算法涉及更复杂的例程——例如，在图中沿路径行走的算法。涉及沿路径行走的算法通常涉及更多操作，因此计算时间比简单的节点度计算更长。还有更复杂的算法可供使用，我们将在本书中探讨其中的一些。\n\
  \n为了说明，之前的示例可以重写如下，以便节点度仅计算一次，写入图节点作为 node_degree_property，然后由 select() 查询，而不是为每次比较计算度：\n\
  \n```\ng.vs['node_degree'] = g.degree()\none_to_three_100_nodes = g.vs.select(node_degree_ge=100,\n\
  \                            node_degree_le=140,\n                            page_type_eq='tvshow')\n\
  print(one_to_three_100_nodes['page_name'])\n```\n\n执行这些类型的 select() 操作的最有效方式将因用例而异，但上述考虑可以帮助设计最佳流程。\n\
  \n接下来，我们将看看如何以类似的方式对我们流行的节点使用这些操作。\n\n### 我们流行节点的属性\n\n了解了更多关于 select() 方法的知识后，我们现在可以深入探索我们最受欢迎的\
  \ TV 节点属性，并了解其在相互点赞 Facebook 图中的重要性。\n\n我们之前发现，按相互点赞计算，最受欢迎的 TV 节点是 Today Show，其度中心性为\
  \ 141。我们可以通过检查其邻居来了解更多关于我们最高度中心性节点的信息。在无向网络中，例如我们的 Facebook 相互点赞图，通过边连接的节点称为关联节点。找到\
  \ Today Show 的所有关联节点将揭示在我们的数据集中哪些 Facebook 页面彼此共享相互兴趣。\n\n- 1. 为此，我们将再次使用 select()\
  \ 方法，这次用于边。es.select() 方法可以根据其属性（如果有）查找边，使用与表 2.1 相同的语法。然而，我们的边不包含任何属性，我们更感兴趣的是它们链接的节点。\n\
  \n与 vs.select() 方法一样，es.select() 有一些特殊参数可用于查找链接具有特定条件的节点的边——同样，每个参数都以下划线开头。\n\n\
  下表显示了与 vs.select() 命令一起使用的各种 dunder 方法，也称为 magic 方法。可以通过这些方法访问执行函数列中列出的功能：\n\n|\
  \ 边 select 参数前缀 | 功能 |\n|---|---|\n| _incident | 查找与特定节点或节点列表关联的边，忽略边方向。 |\n| _source\
  \ (或 _from) | 在有向图中，查找节点或节点列表为边源的边。 |\n| _target (或 _to) | 在有向图中，查找节点或节点列表为边源的边。\
  \ |\n| _within | 查找边中构成边的两个节点都包含在给定列表中的边。 |\n| _between | 查找边中构成边的两个节点包含在单独的列表中的边（这两个列表作为元组提供）。\
  \ |\n\n表 2.2 – es.select() 特殊参数\n\n- 2. 现在，由于我们的相互点赞图是无向的，让我们使用 _incident 参数在 es.select()\
  \ 中选择与 Today Show 关联的边。es.select() 使用节点 ID，因此我们需要先找到我们感兴趣的 TV 节点的节点 ID：\n\n```\n\
  today_show_id = g.vs.select(page_name_eq='Today Show')[0].index\nprint(today_show_id)\n\
  ```\n\n这里，类似于本章早些时候，我们使用 vs.select() 查找 page name 等于 Today Show 的节点。因为 vs.select()\
  \ 返回一个可迭代对象，我们需要使用 [0] 取第一个元素，以便访问第一个元素的 .index 属性。我们的 print 语句将显示我们的节点 ID 为 909。\n\
  \n3. 现在，我们可以使用 es.select() 找到包含节点 909 的边。我们指定 _incident 参数等于我们的 today_show_id 变量，并将其放在列表中（注意\
  \ es.select() 要求表 2.2 中的所有特殊参数的节点列表）：\n\n```\ntoday_show_edges = g.es.select(_incident=[today_show_id])\n\
  ```\n\n4. 就像 vs.select() 一样，这一行返回一个包含边的可迭代对象。我们可以使用可迭代对象中每个边的 .source 和 .target\
  \ 属性提取 today_show_edges 中每条边的两个节点：\n\n```\nsources = [edge.source for edge in today_show_edges]\n\
  targets = [edge.target for edge in today_show_edges]\nprint(sources)\nprint(targets)\n\
  ```\n\n这将向我们展示两个节点 ID 列表，都存在于与 Today Show 关联的边中。\n\n注意\n注意，在我们的相互点赞图中，source 和 target\
  \ 在现实中是等价的，因为图是无向的。这里，source 和 target 仅由 igraph 为每条边表示，基于之前使用 add_edges() 添加的每个两元素节点对的索引。\n\
  \n5. 注意，节点 909，即 Today Show，在我们的列表中出现了多次。这是可以预期的，因为我们要求 igraph 返回包含它的所有边。然而，对于我们检查\
  \ Today Show 的邻居节点的目的，我们需要从结果中删除它。我们可以使用 set() 从 sources 和 targets 列表的连接中返回唯一元素集合，然后删除节点\
  \ 909，对应 Today Show：\n\n```\nneighbor_nodes = list(set(sources + targets))\nneighbor_nodes.remove(909)\n\
  print(neighbor_nodes)\nprint(len(neighbor_nodes))\n```\n\n我们的第一个 print() 语句现在应该显示一个唯一的节点\
  \ ID 列表。我们还可以打印 neighbor_nodes 列表元素的唯一数量，应为 141。请注意，这等于之前计算的 Today Show 的度中心性。\n\
  \n\n\n\n\n6. 现在我们已经有了唯一邻居节点的列表，我们可以探索它们的属性，看看 Today Show 共享了哪些类型的相互连接。让我们来看看这些邻居节点的\
  \ `page_type` 属性：\n\n```\nneighbor_page_types = g.vs[neighbor_nodes]['page_type']\n\
  print(neighbor_page_types)\n```\n\n7. 快速浏览一下我们打印出来的列表，可以看到有多种页面类型与我们感兴趣的电视节目存在共同点。为了统计这些页面类型，我们可以使用原生\
  \ Python 库 `collections` 中的 `Counter()` 方法：\n\n```\nfrom collections import Counter\n\
  page_type_dict = Counter(neighbor_page_types)\nprint(page_type_dict)\n```\n\n`Counter()`\
  \ 方法会查找列表中唯一元素的频率，并以字典的形式返回。打印出这个字典，我们可以看到公司占据了 Today Show 共同点赞页面的一半以上，其次是其他电视节目、政府组织，最后是一个政治人物。\n\
  \n8. 让我们看看这位唯一的政治人物是谁。我们可以使用 `zip()` 方法将节点 ID 列表和页面类型列表按元素一一合并，并使用合并后的可迭代对象（一种可以在\
  \ Python 中循环或迭代的对象）来定位代表该政治人物的 ID：\n\n```\nids_and_page_types = zip(neighbor_nodes,\
  \ neighbor_page_types)\npolitician_id = [id_tuple for id_tuple in list(ids_and_page_types)\
  \ if id_tuple[1] == 'politician']\nprint(politician_id)\n```\n\n9. 我们发现该政治人物的 ID\
  \ 为 22243，因此要查找该节点的页面名称，我们可以使用 `g.vs` 来查询节点属性：\n\n```\npolitician_name = g.vs[22243]['page_name']\n\
  print(politician_name)\n```\n\n完成上述步骤后，这揭示了唯一与 Today Show 存在共同点赞的政治人物是 Aníbal José\
  \ Torres。\n\n本章到此结束，你应该感到自豪，因为你已在构建图结构模型方面取得了长足进步。\n\n### Summary\n\n在本章中，我们探讨了在处理图数据模型时需要学习的大量概念。我们首先从将表格数据文件过渡到构建节点、属性、边和边列表开始。随后，我们深入探讨了设计模式的考虑，重点关注社交网络中常见的一种图类型——无向异构图。\n\
  \n这为我们随后在 Python 中实现模型奠定了良好基础，该模型重点介绍了使用 igraph 构建图的以下关键方法。首先，我们查看了如何向图中添加节点和属性——在这里，我们从创建节点开始，然后为这些节点添加属性。图中的节点可以被视为其他面向对象语言中的属性。接下来，我们查看了创建边以连接节点或将关系连接到节点的方法，并讨论了边列表的含义——即描述节点之间连接性的关系（边）列表。最后，我们将这些内容整合为几个辅助函数，以便在项目中快速构建这些连接。\n\
  \n从这些基本构建块过渡后，我们将你置于为 Facebook 工作的数据科学家的新角色中。你需要解决的关键业务问题是确定当前最热门的电视节目，作为一个用例。\n\
  \n在这个用例中，我们查看了如何使用直方图查看图的分布，并扩展了对度中心性的解释——即节点的度中心性就是它拥有的边的数量。一般来说，度越高，节点越重要。就是这么简单。这随后导致我们检查业务问题陈述中最高度节点的。\n\
  \n此外，从中我们特别关注了 `select()` 方法及其对查询图的强大作用。这最终导致我们检查节点的属性，以更深入地探究图结构的一部分。\n\n在下一章中，我们将带你走出将数据以关系方式存储的思维定式。我们将学习为什么你应该在图数据库中存储数据，而不是传统的结构化关系数据库结构。这是在该领域所需的技能，因为我们有许多传统数据工程师被招募到市场，但他们在处理图结构方面的技能却存在空白。我希望你和我们一样对下一章感到兴奋！\n"
- '# Part 2: Making the Graph Transition


  在掌握了上一部分关于基础知识的内容后，我们现在可以继续解释图数据库与传统关系数据库结构的不同之处，以及为什么以及如何使用它们。我们将在数据模型转换章节中使用 MySQL
  和 Python，最终构建一个推荐引擎来为用户推荐游戏。


  一旦我们掌握了这一章节，我们将继续深入探讨如何构建知识图谱。这将涉及一些数据摄取和清洗的实践，然后我们创建知识图谱并在其上执行社区检测，以查找与特定主题相关的医学摘要，因为社区检测的作用是找到实体中的相似社区，或在此意义上，基于特定摘要文本及其提及的术语找到相似的研究。


  本部分包含以下章节：


  - *Chapter 3, Data Model Transformation – Relational to Graph Databases*

  - *Chapter 4, Building a Knowledge Graph*

  '
- "## Data Model Transformation – Relational to Graph Databases\n\n到目前为止，我们一直在为你在真实环境中处理图数据结构做准备。这将进一步扩展你的知识，从设置自己的\
  \ MySQL 数据库实例到构建推荐系统。这是向前迈出的一大步，因为野外的许多解决方案都是基于从关系数据库环境中提取的数据，例如 MySQL。\n\n在本章中，我们将首先设置你的\
  \ MySQL 图数据库，然后继续学习如何处理图数据和查询数据库引擎。继续下去，我们将查看基于路径的方法来执行分析。随后是图解决方案的模式设计考虑，以及构建推荐解决方案，以便你可以使用用户在流行平台\
  \ Steam 上的游戏历史记录，以及一个图来预测或突出显示特定用户可能感兴趣的游戏。这将非常类似于流行的流媒体服务提供的提示：“因为你观看了这个，你可能也会喜欢这个。”\
  \ 在这里，我们将观看替换为游玩或下载。\n\n在本章中，我们将涵盖以下主要主题：\n\n- Recommending a game to a user\n-\
  \ Using Jaccard similarity and path traversals in graphs\n- From relational to graph\
  \ databases\n- Ingestion considerations\n- Our recommendation system\n\n### Technical\
  \ requirements\n\n我们将使用 Jupyter Notebooks 运行需要 `python>=3.8.0` 的编码练习，以及以下需要通过 `pip\
  \ install` 命令在你的环境中安装的包：\n\n- `igraph==0.9.8`\n- `mysql==0.0.3`\n- `mysql-connector-python==8.0.31`\n\
  \n所有 Notebooks 以及编码练习都可在以下 GitHub 链接获得：https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH03。\n\
  \n### Recommending a game to a user\n\n在 *Chapter 2, Working with Graph Data Models*\
  \ 中，我们展示了如何使用 Python 将表格节点和边数据建模并构建图。我们可以使用此图提出使用原始表格数据难以且低效的问题，从而展示图模型的强大功能。\n\n\
  在本章中，我们将更详细地研究使用关系数据库回答类图问题时出现的问题。在 *Chapter 1, Introducing Graphs in the Real World*\
  \ 中，我们提到由于需要重复的表连接，使用表格数据进行基于路径的操作效率低下。\n\n然而，在实际情况中，数据通常不是以节点属性和边列表的形式存在。大量数据，遍及各个行业，都是以关系数据表的形式存储。关系数据通常使用\
  \ SQL 或类似 SQL 的存储系统和查询语言进行存储和访问（例如 MySQL）。\n\n在本章中，我们将使用来自 Steam 在线视频游戏分发服务的数据。我们将使用两个单独的表中的数据，每个表包含单独的客户交互。在一个表中，我们有用户在\
  \ Steam 平台上购买游戏的信息，而在另一个表中，我们有用户花费在玩游戏上的总时长信息。\n\n首先，我们将通过从我们的数据集中创建 MySQL 数据库并尝试使用\
  \ SQL 执行一些基本的图查询来演示使用关系数据库回答基于路径问题的问题。\n\n### Installing MySQL\n\n为了演示如何与关系数据库协作，我们需要安装一个并将数据迁移到其中。我们将使用\
  \ MySQL，这是一个免费的开源、SQL 兼容数据库。\n\n\n\n\n\n对于本节，我们将使用 MySQL 版本 5.7.39。较新版本的 MySQL 可用，但将数据加载到较新版本\
  \ MySQL 表中需要额外的配置。如果你已经安装了 MySQL，可以跳过安装步骤并直接进入 设置 MySQL 数据库 部分。\n\n导航至 https://downloads.mysql.com/archives/installer/\
  \ 并选择适用于你操作系统的 MySQL 5.7.39 (https://downloads.mysql.com/archives/get/p/25/file/mysql-installer-community-5.7.39.0.msi)\
  \ 发行版。使用所有默认选项安装 MySQL（如果你愿意，可以取消选中为网络访问打开 Windows 防火墙端口——我们将只在本地连接数据库）。在提示输入服务器密码时，为本章选择一个虚拟密码，因为我们将使用\
  \ Python 连接到数据库，而密码会可见。\n\n如果安装过程中出现任何问题，请参阅 https://dev.mysql.com/doc/mysql-getting-started/en/\
  \ 中的设置指南获取特定于操作系统的提示。\n\n### 设置 MySQL 数据库\n\n以下步骤将帮助你设置 MySQL 数据库：\n\n- 1. 要开始设置\
  \ MySQL 数据库，首先，导航到安装文件夹二进制文件。对于 Windows 机器，它们可能位于 `C:/Program Files/MySQL/MySQL\
  \ Server 5.7/bin`。在此处打开一个命令提示符终端。或者，从开始菜单打开命令提示符，并使用 cd 命令导航到此文件夹：\n\n```\ncd \"\
  Program Files/MySQL/MySQL Server 5.7/bin\"\n```\n\n- 2. 进入 bin 文件夹中的命令提示符后，通过运行以下命令访问\
  \ MySQL shell：\n\n```\nmysql -u root -p\n```\n\n在提示输入密码时，输入你在之前 MySQL 安装期间设置的密码。\n\
  \n- 3. 现在我们进入了 MySQL shell，可以创建数据库，如下所示：\n\n```\nCREATE DATABASE steam_data;\n```\n\
  \n此数据库现在需要添加表和数据。首先，我们需要将 `steam_play.csv` 和 `steam_purchase.csv` 文件移动到 MySQL 可以访问的区域。将这些\
  \ CSV 文件复制并粘贴到 `C:\\ProgramData\\MySQL\\MySQL Server 5.7\\Uploads`。\n\n- 4. 现在 MySQL\
  \ 可以访问我们的数据，我们可以创建我们的两个表。在此 MySQL shell 中，我们可以使用以下命令准备我们的表，每个命令单独运行：\n\n```\nUSE\
  \ steam_data;\nCREATE TABLE steam_play (id VARCHAR(100), game_name VARCHAR(255),\
  \ type VARCHAR(10), hours FLOAT(10, 1), misc_column INT);\nCREATE TABLE steam_purchase\
  \ (id VARCHAR(100), game_name VARCHAR(255), type VARCHAR(10), game_purchased_flag\
  \ FLOAT(2, 1), misc_column INT);\n```\n\n- 5. 我们将在下一节中数据加载到 MySQL 后，再回到我们的数据结构及其字段。目前，为了填充我们创建的空白表，运行以下行：\n\
  \n```\nLOAD DATA INFILE 'C:/ProgramData/MySQL/MySQL Server 5.7/Uploads/steam_play.csv'\
  \ INTO TABLE steam_play FIELDS TERMINATED BY ',' OPTIONALLY ENCLOSED BY '\\\"' LINES\
  \ TERMINATED BY '\\r\\n';\nLOAD DATA INFILE 'C:/ProgramData/MySQL/MySQL Server 5.7/Uploads/steam_purchase.csv'\
  \ INTO TABLE steam_purchase FIELDS TERMINATED BY ',' OPTIONALLY ENCLOSED BY '\\\"\
  ' LINES TERMINATED BY '\\r\\n';\n```\n\n导入成功后，MySQL shell 窗口应打印出已添加的记录数。对于 `steam_play`\
  \ 表，应有 70,489 行，而对于 `steam_purchase` 表，应有 129,511 行。\n\n在我们的关系数据库设置好后，我们现在准备开始评估和分析数据。\n\
  \n### 在 Python 中查询 MySQL\n\n为了将我们的关系数据库转换为图，我们的第一步必须是检查数据并设计一个合理的图模式来表示它。正如我们在第\
  \ 2 章《使用图数据模型》中所做的，让我们检查数据集的前几行。\n\n从这一点开始，我们将通过使用 `mysql.connector` 驱动程序从 Python\
  \ 访问 MySQL 中的数据。我们可以使用 `mysql.connector.connect()` 方法以经过身份验证的方式打开与本地托管数据库的连接并查询其表中的数据。从\
  \ Python 到你的 MySQL 数据库实例的步骤如下所示：\n\n- 1. 首先，我们需要导入驱动程序并连接到我们的数据库。连接到 `localhost`\
  \ 意味着我们正在访问本地机器上的数据库，而 `root` 意味着我们将以管理员身份访问数据库。我们的数据库名称等于我们在 MySQL shell 中之前设置的那个。用你在上一节\
  \ MySQL 设置期间选择的密码替换 `password`：\n\n```\nimport mysql.connector\nPASSWORD = '<Your\
  \ MySQL password upon creating MySQL instance>'\nconnection = mysql.connector.connect(\n\
  \    host=\"localhost\",\n    user=\"root\",\n    passwd=PASSWORD,\n    database=\"\
  steam_data\"\n)\n```\n\n- 2. 现在，我们可以指定一些示例 SQL 来查询表：\n\n```\nsql = 'SELECT count(*)\
  \ FROM steam_purchase;'\n```\n\n- 3. 我们可以使用 `connection.cursor()` 和 `cursor.execute()`\
  \ 在变量中的 SQL 字符串运行。然后，我们可以使用 `cursor.fetchall()` 和 `print` 语句检索并打印结果，最后使用 `connection.close()`\
  \ 关闭连接：\n\n```\ncursor = connection.cursor()\ncursor.execute(sql)\nresult = cursor.fetchall()\n\
  print(result)\nconnection.close()\n```\n\n- 4. 现在，因为我们将多次访问这些表，让我们为此过程设置一个可重用方法。我们将只是更改到同一数据库的\
  \ SQL 查询，以便我们可以将查询抽象为新的方法参数：\n\n```\nimport mysql.connector\ndef query_mysql(query,\
  \ password, host='localhost', user='root', database='steam_data'):\n    connection\
  \ = mysql.connector.connect(\n        host=host,\n        user=user,\n        passwd=password,\n\
  \        database=database\n    )\n    cursor = connection.cursor()\n    cursor.execute(query)\n\
  \    result = cursor.fetchall()\n    connection.close()\n    return result\n```\n\
  \n- 5. 现在，我们可以调用新的 `query_mysql()` 方法再次获取 `steam_purchase` 表的长度，以检查它是否按预期运行：\n\n\
  ```\nresult = query_mysql('SELECT count(*) FROM steam_purchase;', password=PASSWORD)\n\
  print(result)\n```\n\n我们的方法返回 `result` 变量，打印它显示 `steam_purchase` 表包含 129,511 行。\n\
  \n### 在 Python 中检查数据\n\n现在我们可以通过 Python 查询 MySQL 数据库中的数据，让我们开始检查我们表中的数据。\n\n按照以下步骤在\
  \ MySQL 中检查你的数据：\n\n- 1. 首先，让我们查看 `steam_play` 表，其中包含 Steam 用户的游戏时间数据。我们可以使用在上一节中定义的方法，使用另一个简单的\
  \ SQL 查询查看前几行：\n\n```\nresult = query_mysql('SELECT * FROM steam_play LIMIT 4;',\
  \ password=PASSWORD)\nfor row in result:\n    print(row)\n```\n\n- 2. 查看打印的 `steam_play`\
  \ 前几行，我们可以看到有五列：\n\n```\n('151603712', 'The Elder Scrolls V: Skyrim', 'play', 273.0,\
  \ 0)\n('151603712', 'Fallout 4', 'play', 87.0, 0)\n('151603712', 'Spore', 'play',\
  \ 14.9, 0)\n('151603712', 'Fallout: New Vegas', 'play', 12.1, 0)\n```\n\n根据数据的来源，第一列包含唯一的\
  \ user ID。第二列包含用户玩过的游戏名称。第三列在每一行中都包含 'play' 字符串，这给我们很少的信息。第四列显示该行用户玩游戏的小时数。最后，一列似乎只包含\
  \ 0；我们今后可以安全地忽略此列。\n\n- 3. 另一个表 `steam_purchase` 包含有关用户购买的信息。同样，我们应该检查此数据集的前几行：\n\
  \n```\n('151603712', 'The Elder Scrolls V: Skyrim', 'purchase', 1.0, 0)\n('151603712',\
  \ 'Fallout 4', 'purchase', 1.0, 0)\n('151603712', 'Spore', 'purchase', 1.0, 0)\n\
  ('151603712', 'Fallout: New Vegas', 'purchase', 1.0, 0)\n```\n\n`steam_purchase`\
  \ 表似乎也包含五列。在 `steam_purchase` 表中，第一列再次包含唯一的 user ID。与 `steam_play` 一样，第二列包含游戏名称。第三列始终包含\
  \ 'purchase' 字符串。此表中的第四列始终包含浮点数 1.0，表示该行游戏被用户购买。最后一列与前一个文件一样，全部为 0。\n\n一眼就能看出，`steam_play`\
  \ 和 `steam_purchase` 表中都有用户 `151603712` 的数据。因此，我们的数据集中用户既有游戏购买数据也有游戏时间数据。从对数据的简要查看中，我们可以看到有很多列我们今后不需要，所以我们可以通过查询特定行开始将它们从分析中排除。\n\
  \n\n\n\n在下一节中，我们将探讨处理本节所查看的表格数据的基于路径的方法。这将使我们能够深入了解用户在Steam上喜欢玩哪些类型的游戏。\n\n### 表格数据中的基于路径的分析\n\
  \n既然我们了解了表格的内容，就可以针对数据提出一些问题。例如，我们可以问：“根据用户之前的购买习惯，他们还可能喜欢哪些游戏？”这类问题是推荐系统的基础，销售和营销行业常利用推荐系统来驱动额外购买。\n\
  \n为了简单回答这类问题，我们需要找出用户购买过的游戏，然后找到购买过相同游戏的其他用户。接着，我们会查看这些用户之间的共性，并向原用户推荐新游戏。\n\n由于所需的基于路径的操作，这类系统通常由图数据模型驱动。查找与某个用户关联的所有游戏，然后查找与这些游戏关联的用户，最后查找这些用户关联的游戏，这一过程代表了一种基于路径的查询，图数据库在这类查询上比关系数据库更合适。在关系数据库中，我们需要反复查询同一张表，并执行一系列自连接来找出用户和游戏之间的多级关系。我们在第1章“现实世界中的图简介”中简要探讨过这些概念，但这里我们也可以用一个更实际的示例来演示不同数据库类型之间的差异。\n\
  \n下图显示了用户偏好与他们所玩游戏之间的关系。我们可以使用图推荐引擎查看我们的用户玩的游戏，然后查看与这些游戏相关的其他用户还玩哪些游戏。因此，基于这棵树，我们可以根据相似用户及其（所有其他用户）所玩的游戏，了解我们的用户（网络中的顶层节点）可能喜欢哪些游戏：\n\
  \n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_63_0.png)\n\n图3.1 – 向用户推荐游戏所需的信息\n\n\
  在以下步骤中，我们将带您了解如何查询图以获得最佳信息，从而根据前面介绍的内容形成对用户想要玩什么游戏的推荐：\n\n- 1. 首先，我们需要查询MySQL，找出特定用户购买的所有游戏。以steam_purchase表格顶部的用户151603712为例。再次使用我们的查询方法，我们可以查询steam_purchase表格来获取此信息：\n\
  \n```\nresult = query_mysql('SELECT game_name from steam_purchase WHERE id = \"\
  151603712\";', password=PASSWORD)\nprint(result[:10])\nprint(len(result))\n```\n\
  \n- 2. 从print()语句可以看出，该用户购买了40个不同的游戏。注意，MySQL将数据返回为元组列表，其中每个元组都有一个空元素。我们需要访问每个元组的第一个元素，并将每个游戏括在引号中，以找到与这些游戏关联的用户。我们还需要将这次初始查询的结果以字符串形式添加到新的SQL查询中，因此让我们准备好这个字符串：\n\
  \n```\ngames = ['\"' + game[0] + '\"' for game in result]\ngames_string = ','.join(games)\n\
  print(games_string)\n```\n\n- 3. 现在，我们可以使用这些结果再次查询表格，找出同样购买了这些游戏的用户（不包括我们的原始用户）：\n\
  \n```\nquery_2 = f'SELECT id from steam_purchase WHERE game_name ' \\\n    f'IN\
  \ ({games_string}) AND id != \"151603712\";'\nresult_2 = query_mysql(query_2, password=PASSWORD)\n\
  users = [user[0] for user in result_2]\nprint(users[:10])\nprint(len(users))\n```\n\
  \n- 4. 结果中有一个包含16223个用户的列表，但其中包含重复项，因此我们使用set()操作去除重复项：\n\n```\nusers = list(set(users))\n\
  print(users[:10])\nprint(len(users))\n```\n\n  我们的print语句现在显示，我们有7728个唯一用户，他们至少玩过与我们最初选择的用户相同的一款游戏。\n\
  \n- 5. 现在，我们需要根据已识别用户的购买行为，找到新游戏推荐给所选用户。我们以与上一个查询类似的方式，为这些需求设置一个新SQL查询的参数：\n\n```\n\
  users = ['\"' + user + '\"' for user in users]\nusers_string = ','.join(users)\n\
  \nquery_3 = f'SELECT game_name from steam_purchase WHERE id IN ({users_string})\
  \ ' \\\n    f'AND game_name NOT IN ({games_string});'\n\nresult_3 = query_mysql(query_3,\
  \ password=PASSWORD)\nrecommended_games = [game[0] for game in result_3]\nprint(recommended_games[:10])\n\
  ```\n\n- 6. 现在，我们只需在返回的游戏里找出最受欢迎的游戏，向我们的原始用户进行推荐。我们可以使用Python collections库中的内置Counter()方法实现这一点：\n\
  \n```\nfrom collections import Counter\ngame_frequency = Counter(recommended_games)\n\
  print(game_frequency)\n```\n\n这个游戏频率字典告诉我们，我们可以向指定用户推荐游戏Unturned。\n\n考虑到数据模型，请思考找到这个游戏推荐所涉及的操作。使用关系数据库时，我们不得不反复查询同一张表，结果集越来越大。这也可以通过steam_purchase表格的多次自连接来实现。这两种方法都相当低效，因为要反复读取相同数据来构建答案。\n\
  \n这类问题正是图数据模型和数据库的闪光点；相关对象和实体之间天然路径的存在，使图成为基于路径的关系遍历的理想选择。接下来，让我们考虑如何将数据改而用图数据模型表示。\n\
  \n### 从关系数据库到图数据库\n\n由于关系数据库在回答类似图的问题时表现不佳，我们可能需要将表格数据转换为图格式。\n\n首先，在编写将数据从MySQL迁移到Python\
  \ igraph网络的管道之前，我们将基于现有信息，为数据设计一个合理的图模式。通过这样做，我们可以对基于图的方法在处理路径问题时的表现进行基准测试，并与我们之前用SQL回答的同一问题进行比较。\n\
  \n#### 模式设计\n\n在表格中，我们有两类实体：用户和游戏，它们具有不同的属性。因此，明智的做法是将用户和游戏视为不同的节点类型。\n\n对于用户，每个用户只有一个唯一ID。要将数据添加到igraph图中，我们需要为每个不同节点添加递增的整数igraph节点ID，正如我们在第1章“现实世界中的图简介”和第2章“使用图数据模型”中学到的那样。\n\
  \n另一方面，对于游戏，我们以字符串形式给出游戏名称。我们还必须以与用户节点相同的方式，为不同游戏节点添加igraph ID。\n\n我们已经考虑了节点的模式设计，但还必须考虑应如何表示关系。就我们的目标而言，我们关注用户与游戏之间的交互。我们拥有用户购买游戏的信息以及用户玩某款游戏的时长信息。\n\
  \n因此，将这两种不同交互视为不同边类型是合理的。购买游戏仅通过steam_purchase表格中是否存在相应行来表示，这种关系本质上要么存在，要么不存在。我们没有额外数据来表示此交互，因此对于游戏购买，不会设置边的属性。\n\
  \n然而，对于表示游戏时长的关系，我们有用户玩某款游戏的小时数信息。在这种情况下，我们可以使用边属性来表示用户玩某款游戏的小时数。\n\n综合考虑以上因素，我们可以为图设计如下模式：\n\
  \n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_66_0.png)\n\n图3.2 – 有向异构图模式\n\n从逻辑上讲，由于用户要么购买要么玩游戏，在图模式中，PLAYED和PURCHASED关系都是从用户节点指向游戏节点的有向关系。在本章的其余部分，我们将使用这个模式，但理论上，如果关系从游戏流向用户，并命名为PLAYED_BY和PURCHASED_BY，也不会有什么不同。这种设计的唯一后续差异在于，对图的任何查询中，边的方向都需要反向。\n\
  \n#### 数据导入注意事项\n\n现在我们已经决定了图的模式，可以开始将数据从MySQL关系数据库迁移到igraph图。后续步骤详细说明了如何实现这一点：\n\
  \n- 1. 我们要做的第一件事是从MySQL数据库中提取数据并将其移到Python中。我们可以使用本章前面编写的query_mysql()方法来实现。现在我们对数据有了更多了解，并且已经设计了图模式，我们可以只提取创建图所需的列：\n\
  \n```\nplay_query = 'SELECT id, game_name, hours FROM steam_play'\nplay_data = query_mysql(play_query,\
  \ password=PASSWORD)\n```\n\n\n```python\nprint(play_data[:10])\n\npurchase_query\
  \ = 'SELECT id, game_name FROM steam_purchase'\npurchase_data = query_mysql(purchase_query,\
  \ password=PASSWORD)\nprint(purchase_data[:10])\n```\n\n在 play_data 中，我们拥有关于用户、他们玩过的游戏以及他们在每个游戏上花费的时间的信息。在\
  \ purchase_data 中，我们只需要用户和他们购买的游戏。\n\n接下来，如同在 schema 设计过程中所述，为了使用 igraph，我们需要在 User\
  \ 和 Game 节点上都添加一个递增的整数 igraph 节点 ID，从 0 开始。\n\n- 2. 以下代码行将从 play_data 和 purchase_data\
  \ 列表中的用户生成一个 `set()` 的唯一用户 ID。然后，一个字典推导式结合 `enumerate()` 方法将生成一个字典，其键包含 Steam 用户\
  \ ID，值包含我们的 igraph ID：\n\n```python\nusers = set([row[0] for row in play_data] +\
  \ [row[0] for row in purchase_data])\nuser_ids = {user_id: igraph_id for igraph_id,\
  \ user_id in enumerate(users)}\nprint(len(user_ids))\n```\n\n使用 `len()` 打印我们的字典长度，给出了唯一用户的数量，12393。\n\
  \n- 3. 与用户类似，我们也需要为游戏生成 igraph ID。我们可以使用与前面非常相似的过程，但对 `enumerate()` 方法参数做一个小的改动。我们可以使用\
  \ `enumerate()` 的第二个参数生成递增整数，但与其从 0 开始，我们可以从分配给用户的最高 igraph ID 之后开始，使用 `user_ids`\
  \ 字典的 `len()`：\n\n```python\ngames = set([row[1] for row in play_data] + [row[1]\
  \ for row in purchase_data])\ngame_ids = {user_id: igraph_id for igraph_id, user_id\
  \ in enumerate(games, len(user_ids))}\nprint(len(game_ids))\n```\n\n与用户一样，我们的打印语句显示了我们数据集中唯一游戏的数量，5155。使用带第二个参数的\
  \ `enumerate()` 应避免用户和游戏之间的 ID 冲突。即使它们的节点类型不同，igraph 仍然要求所有节点的 ID 都是从 0 开始的递增整数。\n\
  \n- 4. 我们可以通过使用 `sorted()` 方法和控制台 `print()` 语句检查用户最高 igraph ID 和游戏最低 igraph ID 来验证\
  \ ID 是否已按预期创建：\n\n```python\nprint(sorted(user_ids.values(), reverse=True)[:10])\n\
  print(sorted(game_ids.values(), reverse=False)[:10])\n```\n\n- 5. 这将显示为用户生成的最高 ID\
  \ 为 12,392，而为游戏生成的最低 ID 为 12,393，正如预期的那样。让我们进一步确认所有节点的 igraph ID 从 0 以 1 的增量递增。我们可以通过首先连接并排序我们\
  \ ID 字典的两个 ID 值列表来创建 `all_ids` 变量。然后，我们可以断言我们的所有 ID 都等于从 0 到 `all_ids` 长度的整数范围：\n\
  \n```python\nall_ids = sorted(list(user_ids.values()) + list(game_ids.values()))\n\
  assert all_ids == list(range(len(all_ids)))\n```\n\n由于此断言语句未引发任何异常，我们可以确信我们生成的 ID\
  \ 已被正确创建。\n\n- 6. 现在，我们可以开始向我们的图添加节点。首先，我们必须导入 igraph 并使用 `Graph()` 对象创建一个空的有向图：\n\
  \n```python\nimport igraph as ig\ng = ig.Graph(directed=True)\n```\n\n- 7. 现在，我们可以按列表方式向图添加节点和节点属性。通过对\
  \ `user_ids` 和 `game_ids` 字典进行排序，我们保留了 0 索引的 igraph ID 到 Steam ID 关系的顺序：\n\n```python\n\
  user_ids = dict(sorted(user_ids.items(), key=lambda item: item[1]))\ngame_ids =\
  \ dict(sorted(game_ids.items(), key=lambda item: item[1]))\n```\n\n- 8. 我们现在可以取出这些字典的键并将其转换为列表，以便作为属性添加：\n\
  \n```python\nsteam_user_ids = list(user_ids.keys())\nsteam_game_ids = list(game_ids.keys())\n\
  ```\n\n- 9. 现在，我们准备添加节点。我们可以使用 `add_vertices()` 添加等于我们两个 ID 列表长度的节点；igraph 将从 ID\
  \ 0 创建节点到这些组合列表长度减 1。我们可以通过断言图中所有节点的 `len()` 属性等于组合列表长度来确认这一点：\n\n```python\ng.add_vertices(len(steam_user_ids)\
  \ + len(steam_game_ids))\nassert len(g.vs) == len(steam_user_ids) + len(steam_game_ids)\n\
  ```\n\n- 10. 图中有了节点后，我们可以添加属性。由于一次向所有节点添加属性最高效，让我们创建一个包含用户 ID 和游戏名称的 Steam ID 列表：\n\
  \n```python\nall_steam_ids = steam_user_ids + steam_game_ids\n```\n\n- 11. 让我们也使用列表推导式创建一个包含节点类型的列表，它将是用户或游戏：\n\
  \n```python\nnode_types = ['user' for _ in steam_user_ids] + ['game' for _ in steam_game_ids]\n\
  ```\n\n- 12. 准备好列表后，我们现在可以通过访问 igraph `Graph()` 对象的 `vs` 属性，按列表方式向图中所有节点添加属性：\n\n\
  ```python\ng.vs['steam_id'] = all_steam_ids\ng.vs['type'] = node_types\n```\n\n\
  - 13. 为确保节点属性已按预期添加，我们可以将其打印到控制台。为了更彻底的检查，我们可以将图中游戏节点的数量与第 6 步 Path-based analytics\
  \ in tabular data 部分中计算的唯一游戏数量进行比较：\n\n```python\nprint(g.vs['steam_id'][:10])\n\
  print(g.vs['type'][:10])\n\ngame_nodes = g.vs.select(type_eq='game')\nprint(len(game_nodes))\n\
  ```\n\n使用我们在第 2 章 Working with Graph Data Models 中学到的 `vs.select()` 方法，我们可以看到游戏节点的数量为\
  \ 5155，这与我们之前在数据集中统计的游戏数量相同。\n\n- 14. 接下来，我们需要在图中添加边。边包含在 steam_purchase 和 steam_play\
  \ 的数据中，现在包含在 `purchase_data` 和 `play_data` 变量中。让我们通过查找用户和游戏的 igraph ID 为这两种类型的交易生成边。这些\
  \ igraph ID 包含在我们之前创建的 `user_ids` 和 `game_ids` 字典中，因此我们可以使用列表推导式来设置我们的 igraph 兼容边列表：\n\
  \n```python\npurchase_edges = [[user_ids[user], game_ids[purchase]]\n    for user,\
  \ purchase in purchase_data]\nplay_edges = [[user_ids[user], game_ids[game], hours]\n\
  \    for user, game, hours in play_data]\n```\n\n- 15. 对于 `play_edges`，还包括了小时数，因此我们可以将其作为边属性添加到图中。让我们先以列表方式添加\
  \ PLAYED 边及其 `hours` 属性，使用更多列表推导式：\n\n```python\ng.add_edges([(n, m) for n, m, _\
  \ in play_edges])\ng.es['hours'] = [hours for _, _, hours in play_edges]\n```\n\n\
  - 16. 现在，我们可以添加表示 PURCHASED 关系的边。与游戏购买相关的属性没有要添加到我们数据集的属性，因此我们可以使用以下命令：\n\n```python\n\
  g.add_edges(purchase_edges)\n```\n\n- 17. 最后，为完成我们的图，我们可以向所有边添加 `edge_type` 作为边属性：\n\
  \n```python\nedge_type = ['PLAYED' for _ in play_edges] + ['PURCHASED' for _ in\
  \ purchase_edges]\ng.es['edge_type'] = edge_type\n```\n\n- 18. 始终应确认我们的数据已正确添加。回想一下，本章前面我们检查了特定用户\
  \ ID 为 151603712 的购买游戏数量，为 40。我们可以通过首先使用 `g.vs.select()` 找到 `steam_id` 为 151603712\
  \ 的节点的 `.index` 属性，然后使用 `g.es.select()` 找到源为该用户 ID 的 PURCHASED 类型的所有边，使用两个参数来缩小搜索范围，来检查这在我们新创建的图中是否相同：\n\
  \n```python\nuser_id_ex = g.vs.select(steam_id='151603712')[0].index\npurchased_ex\
  \ = g.es.select(_source_eq=user_id_ex, edge_type='PURCHASED')\nprint(len(list(purchased_ex)))\n\
  ```\n\n此打印语句确认以该用户为源的边的 `len()` 属性为 40，与 steam_purchase 数据集中的情况相同。\n\n现在我们已将所有节点和边添加到\
  \ `igraph.Graph()` 对象中，我们准备好分析其属性。\n\n### Path-based analytics in igraph\n\n图数据模型专为基于路径的分析而设计。与本章前面介绍的\
  \ MySQL 不同，使用图时，我们不需要对数据库进行一系列查询或执行一系列自连接来查找相关对象的路径。为了演示这一点，让我们使用我们创建的图，使用新的 schema，再次查找特定用户可能喜欢的游戏。\n\
  \n上次，我们只使用了 steam_purchase 表的数据，但这次，我们的图包含 steam_purchase 和 steam_play 表的数据，因此我们可以使用两者信息来做出推荐。我们将再次为\
  \ ID 为 151603712 的用户做出推荐，但这次使用基于图的方法。\n\n我们的用户节点 igraph ID 存储在 `user_id_ex` 变量中，因此我们可以在此基础上继续。与重复查询或连接不同，这里我们将使用\
  \ igraph 中的 `get_all_simple_paths()` 方法查找路径。我们要查找的路径是图 3.1 中的那些，从指定用户到相似用户玩的游戏。这些路径从我们的初始用户到推荐的目的地游戏节点包含三跳。\n\
  \n以下步骤将展示我们如何实现这一点：\n\n- 1. 让我们使用 `get_all_simple_paths()` 找到这些路径。我们需要指定路径的起始节点，以及这些路径应有的长度上限。不包括初始起始节点，这些路径长度为\
  \ 3。我们还需使用 `mode` 参数指定我们愿意在路径中遍历的边的方向。由于我们图中所有的关系都从用户指向游戏，并且我们希望在这种情况下以不同方向遍历多个关系来获得路径，因此我们将\
  \ `mode` 设为 `all`：\n\n```python\npaths = g.get_all_simple_paths(user_id_ex, cutoff=3,\
  \ mode='all')\nprint(paths[:10])\n```\n\n\n\n\n通过我们的`print()`语句，我们可以查看一些已找到的路径。`paths`变量包含从原始用户节点遍历的节点的igraph\
  \ ID，以列表的列表形式存储。\n\n> **注意**\n> 有些列表的长度不是4，而这正是我们做出推荐所需的长度。推荐用户已购买的游戏没有意义，比如长度为2的路径；也没有理由向我们的指定用户推荐其他用户，比如长度为3的路径。\n\
  \n- 2. 因此，我们需要从`paths`列表中移除长度小于4的路径。我们只需要这些列表中的第四个元素，它对应一个可以作为推荐依据的游戏。我们可以使用带条件运算符的列表推导式来满足这两个要求，确保所有路径长度均为4：\n\
  \n```\nrec_game_ids = [path[3] for path in paths if len(path) == 4]\n```\n\n- 3.\
  \ 现在，我们得到了表示游戏的节点的igraph ID列表。我们需要这些游戏的名称，因此我们将使用另一个列表推导式，通过`g.vs`访问每个节点的`steam_id`属性：\n\
  \n```\ngame_names = [g.vs[game_id]['steam_id'] for game_id in rec_game_ids]\n```\n\
  \n- 4. 前面的代码会给我们一个游戏名称列表。然而，这个列表包含我们的指定用户已经玩过或购买过的游戏，因此我们不想推荐它们。我们可以先使用igraph中的`neighbors()`方法找到所选用户的邻居节点，从而移除这些游戏。然后，我们可以使用与之前代码片段类似的列表推导式，通过`g.vs`查找`steam_id`值，找到对应的游戏名称：\n\
  \n```\nneighbors = g.neighbors(user_id_ex)\npurchased_games = [g.vs[node_id]['steam_id']\
  \ for node_id in g.neighbors(user_id_ex)]\n```\n\n- 5. 让我们用另一个列表推导式移除用户已玩的游戏，比较这些列表：\n\
  \n```\ngame_names = [game for game in game_names if game not in purchased_games]\n\
  ```\n\n- 6. 与之前使用MySQL实现相同功能的示例一样，让我们使用Python的`collections`库和`Counter()`来查看路径末端出现频率最高的游戏：\n\
  \n```\nfrom collections import Counter\ngame_frequency = Counter(game_names)\nprint(game_frequency)\n\
  ```\n\n查看打印出的`Counter()`对象开头，我们可以看到可能推荐给用户的前三款游戏是《反恐精英：全球攻势》、《未转变者》和《传送门2》。\n\n\
  在本节中，我们使用图对数据进行了基于路径的分析。当涉及路径时，图是表示和查询实体之间关系的理想数据模型。我们研究了使用Steam数据图向用户推荐游戏的简单方法，但现实世界中的推荐引擎通常使用更复杂的方法。\n\
  \n接下来，我们将了解图数据模型如何帮助我们实现一种更智能的推荐方法。\n\n### 我们的推荐系统\n\n现在我们已经将数据放入Python图中，让我们更进一步，设计一个更健壮的推荐流程，这类流程通常使用图数据完成。\n\
  \n让我们以解决方案工程师或数据科学家的身份，基于Steam数据编写一个游戏推荐系统。推荐系统大量用于面向客户的应用中，向用户展示他们可能感兴趣的产品。产品推荐通常基于行为相似的用户玩过和购买过的内容。\n\
  \n### 通用的MySQL到igraph方法\n\n这次，我们将编写一组可复用的通用方法，从MySQL表中的列创建igraph图。这些函数将设计为在给定一组列名的情况下，创建一个异构、二分、有向图。\n\
  \n让我们从编写主函数`mysql_to_graph()`开始。该方法需要接受一个MySQL表名、该表的源列名和目标列名，以及一个边权重列。在本例中，我们将使用`steam_play`表，其中权重是每个游戏（目标）被用户（源）游玩的小时数。我们将按步骤来组织这些方法，以便更容易实现：\n\
  \n- 1. 在我们的新方法中，我们可以使用f字符串和替换来生成符合所需搜索条件的SQL查询。`SELECT`后面的列名以及`FROM`要选择的表，现在可以通过`mysql_to_graph`接受的参数动态设置。然后，我们可以使用在*使用MySQL查询SQL*一节的第4步中定义的方法`query_mysql()`，从MySQL数据库获取一个列表的列表：\n\
  \n```\ndef mysql_to_graph(table, source, target, weights, password):\n    import\
  \ igraph as ig\n\n    sql_query = f'SELECT {source}, {target}, {weights} FROM {table}'\n\
  \n    data = query_mysql(sql_query, password=PASSWORD)\n```\n\n- 2. 现在我们有了数据，我们可以使用一系列列表推导式将数据拆分为源节点和目标节点。这有助于我们以合理的格式获取数据，以便分配igraph\
  \ ID。在编写完主方法`mysql_to_graph()`之后，我们将编写一个单独的方法`create_igraph_ids()`，用于创建{Steam ID:\
  \ igraph ID}对的字典：\n\n```\n    source_nodes = sorted(list(set([source for source,\
  \ _, _ in data])))\n    target_nodes = sorted(list(set([target for _, target, _\
  \ in data])))\n\n    source_igraph_ids = create_igraph_ids(source_nodes)\n    target_igraph_ids\
  \ = create_igraph_ids(target_nodes, len(source_igraph_ids))\n```\n\n- 3. 然后，我们需要使用所创建字典`source_igraph_ids`和`target_igraph_ids`中的键值对生成igraph边列表。我们可以使用另一个列表推导式，以source和target作为键来做到这一点。最后，在创建图之前，我们必须从MySQL返回的列表的列表中提取边权重，以备稍后添加到图的边中：\n\
  \n```\n    edges = [(source_igraph_ids[source], target_igraph_ids[target])\n   \
  \     for source, target, _ in data]\n    weights = [weight for _, _, weight in\
  \ data]\n```\n\n- 4. 现在，所有数据都已准备好以正确的格式添加到igraph图中。首先，我们必须使用`ig.Graph()`创建一个空的有向`Graph()`对象。然后，我们必须使用`g.add_vertices()`添加节点，节点数等于我们的两个节点列表的长度之和。“内部ID”——在本例中即Steam\
  \ ID——然后通过访问图的`g.vs`属性，使用`source_igraph_ids`和`target_igraph_ids`字典键添加到节点上。节点类型同样通过`g.vs`添加，方法是创建类型字符串列表source和target，就Steam数据而言，它们分别对应用户和游戏。最后，可以从包含源和目标igraph\
  \ ID的`edges`列表中添加边，并通过访问图的`g.es`属性按列表添加边权重和游玩小时数。然后返回我们的图`g`，以便在单独的函数中进行分析：\n\n\
  ```\n    g = ig.Graph(directed=True)\n    g.add_vertices(len(source_nodes + target_nodes))\n\
  \    g.vs['internal_id'] = list(source_igraph_ids.keys()) + list(target_igraph_ids.keys())\n\
  \    g.vs['type'] = ['source' for _ in source_nodes] + ['target' for _ in target_nodes]\n\
  \    g.add_edges(edges)\n    g.es['weight'] = weights\n\n    return g\n```\n\n-\
  \ 5. 在我们前面定义的`mysql_to_graph`方法中，我们调用了一个单独的用户自定义函数`create_igraph_ids()`，我们需要单独定义它。我们可以像本章前面所做的那样为每个节点创建igraph\
  \ ID——即使用字典推导式并利用Python的`enumerate()`方法。然后，我们的`create_igraph_ids()`方法需要接受的参数只是节点名称列表和`enumerate()`的起始索引：\n\
  \n```\ndef create_igraph_ids(nodes, from_index=0):\n    igraph_ids = {internal_id:\
  \ igraph_id for igraph_id, internal_id\n                  in enumerate(nodes, from_index)}\n\
  \    return igraph_ids\n```\n\n我们现在有了一个可复用的通用方法，可以从MySQL数据创建图，描述任意具有源、目标以及该关系权重的关系。回到我们的Steam用例，在我们的图中，有用户、他们玩过的游戏，以及他们花费在这些游戏上的时间。这些信息足以让我们就现有用户接下来可能想购买哪些游戏提出建议。\n\
  \n在本章前面，我们根据用户是否玩过与指定用户相同的游戏，以及他们玩过哪些游戏，为一个新游戏做了一个非常简单的推荐。然而，这只是推荐系统的一个非常简单的例子。使用我们的图，我们可以实现一个更健壮的系统，该系统可以产品化，将用户ID作为输入，并使用更复杂的方法（即Jaccard相似度）推荐游戏。使用igraph还可以应用其他相似度方法，例如Dice相似度和逆对数加权相似度，它们也是比较节点组的有效方法。选择Jaccard相似度是因为它简单且总体性能良好，但请随意尝试不同的相似度方法。\n\
  \n\n\n\n### 使用Jaccard相似度的更高级推荐系统\n\n为了更智能地推荐游戏，我们将实现一个基于节点相似度的解决方案。节点相似度比较两个节点的相邻节点并返回一个分数。在我们的方法中，将使用igraph中可用的Jaccard相似度，即`similarity_jaccard()`。`similarity_jaccard()`得到的分数等于两个节点共同邻居的数量，除以与这两个节点中至少一个相邻的邻居数量。结果将是0到1之间的数字，其中0表示没有相似性，1表示节点具有相同的邻居。\n\
  \n结合我们的用例，在Steam图中，用户节点与游戏节点相邻。因此，与其他用户节点具有高Jaccard相似度的用户节点会玩相似的游戏。我们可以利用这些信息向用户提供新的推荐。现在我们将逐步简化这一过程：\n\
  \n- 1. 让我们定义一个函数`make_recommendations()`。我们的函数将接受一个igraph图`g`和一个特定用户`user`，为其生成推荐。我们将利用图边上的权重，指定一个游戏需要被游玩的最少小时数`min_hours`，才能纳入我们的推荐。这样，如果用户购买了游戏但只玩了很短时间，我们可以假设他们不喜欢这款游戏，并且不在推荐新游戏时使用该信息：\n\
  \n```\ndef make_recommendations(g, user, min_hours):\n```\n\n- 2. 首先，我们需要找到由`user`参数表示的节点，使用`g.vs.select()`查询图中`internal_id`等于`user`的节点。这将返回一个包含一个元素的列表，因此我们可以通过列表切片访问第一个也是唯一的元素，并找到该节点的`index`属性，即igraph\
  \ ID：\n\n```\nuser_node = g.vs.select(internal_id_eq=user)\nuser_node = user_node[0].index\n\
  ```\n\n- 3. 然后，我们将使用另一个自定义方法`prune_graph()`，根据游戏被游玩的小时数来删除图中的边。我们将在定义完`make_recommendations()`的其余部分后稍后回到这个方法：\n\
  \n```\ng = prune_graph(g, min_hours)\n```\n\n修改后的图现在可用于生成推荐。为了与其他用户节点进行比较，我们需要找到`type`等于`'source'`的节点，这代表我们之前定义的`mysql_to_graph()`方法中的用户。我们可以使用`g.vs.select()`找到`source`类型的节点。然后，我们需要设置一个包含要比较的节点对的列表的列表。我们希望将指定用户与图中的所有其他用户进行比较，因此我们将编写一个列表推导式来创建一个列表的列表，其中每个元素是一个包含所选用户的igraph\
  \ ID和另一个用户的igraph ID的两元素列表。我们不希望将选定的用户节点与其自身进行比较，因此我们将在推导式中使用条件`!=`来防止这种情况：\n\n\
  ```\nother_user_nodes = g.vs.select(type_eq='source')\npairs = [[user_node, other_user.index]\
  \ for other_user in other_user_nodes if other_user.index != user_node]\n```\n\n\
  现在，有了要进行的比较列表，我们可以运行igraph的`similarity_jaccard()`为我们的节点对生成相似度分数。在这种情况下，由于我们的边从用户指向游戏，是有向的，我们感兴趣的是“out”方向，这在`similarity_jaccard()`的`mode`参数中指定。我们的相似度分数将作为列表返回，因此需要将它们与对比较相关的节点ID关联起来。我们可以使用列表推导式，取`pairs`中每个列表第二个元素中的被比较用户igraph\
  \ ID，并使用`zip()`将其与分数关联：\n\n```\nsimilarities = g.similarity_jaccard(pairs=pairs,\
  \ mode='out')\nnode_similarity = [[pair[1], similarity] for pair, similarity in\
  \ zip(pairs, similarities)]\n```\n\n我们想要找到与指定用户最相似的用户，因此需要按Jaccard相似度分数降序对`node_similarity`列表进行排序。我们可以使用Python的`sorted()`方法，通过一个匿名函数按`node_similarity`中每个列表的第二个元素进行排序。我们将指定`reverse=True`以降序排序。然后，我们可以通过访问排序后列表的第一个元素来获得最相似用户的igraph\
  \ ID：\n\n```\nnode_similarity = sorted(node_similarity, key=lambda x: x[1], reverse=True)\n\
  most_similar_node = node_similarity[0][0]\n```\n\n有了相似用户的igraph ID，我们可以使用`g.neighbors()`查找该用户玩过的游戏的igraph\
  \ ID，并通过`g.vs`查找`internal_id`节点属性来访问这些游戏对应的Steam ID。我们可以对最初指定的用户执行相同操作，从而得到两个相似用户玩过的游戏列表。最后，让我们使用最后一个列表推导式来查找`game_recommendations`列表中不存在于原始用户`owned_games`列表中的所有游戏，并将此列表作为`new_games`返回：\n\
  \n```\ngame_recommendations = g.vs[g.neighbors(most_similar_node)]['internal_id']\n\
  owned_games = g.vs[g.neighbors(user_node)]['internal_id']\nnew_games = [game for\
  \ game in game_recommendations if game not\nin owned_games]\nreturn new_games\n\
  ```\n\n接下来，我们将回到在`make_recommendations()`方法中调用的`prune_graph()`辅助方法。在这里，我们需要一种根据边权重（代表游戏被游玩的小时数）删除边的方法。对于`prune_graph()`，我们接受图`g`和游戏被考虑纳入推荐系统所需的最少小时数`min_hours`作为参数。\n\
  \n此方法将使用`g.es.select()`，以`min_hours`作为`weight`参数，查找所有权重小于我们最小游玩时间的边。然后，`delete_edges()`可以与`select()`的结果一起使用，根据我们的标准修剪图中的边：\n\
  \n```\ndef prune_graph(g, min_hours):\n    edges_to_remove = g.es.select(weight_lt=min_hours)\n\
  \    g.delete_edges(edges_to_remove)\n\n    return g\n```\n\n让我们测试在前面步骤中创建的新函数。我们可以使用`steam_play`表、`source`和`target`列（`id`和`game_name`）以及边权重列`hours`调用`mysql_to_graph()`函数。然后，使用此图，我们可以通过调用`make_recommendations()`为特定用户生成推荐，传入我们的图`g`、用户ID（如`87907200`）以及图边将表示的最少小时数——例如2：\n\
  \n```\ng = mysql_to_graph('steam_play', 'id', 'game_name', 'hours')\nrecommendations\
  \ = make_recommendations(g, '87907200', min_hours=0.5)\nprint(recommendations)\n\
  ```\n\n将为我们的用户打印一个推荐列表。尝试使用不同的用户ID（可以在`steam_play`表的`id`列中找到它们），以及同一用户的不同`min_hours`数值。请注意，在我们更复杂的系统中，最少小时数可以改变为单个用户推荐的游戏。这是因为当边被移除时，图的结构会发生变化，节点之间的相似度也会改变。\n\
  \n在生成推荐的生产系统中，可以改变`min_hours`参数并进行实验测试，以找到能够产生有用游戏推荐的理想值。\n\n这结束了我们使用Jaccard相似度的推荐引擎的更高级示例，也结束了本章。我希望你喜欢掌握从关系数据到图中心数据的转换。\n\
  \n### 总结\n\n在本章中，我们比较和对比了传统关系数据库和图数据库，以执行基于路径的分析。我们选择的基于路径的分析是在Steam发布平台上向用户推荐游戏，并在MySQL和igraph中进行了实现。\n\
  \nMySQL和其他关系数据库可用于查找相关实体表之间的路径，例如用户及其游玩和购买的游戏。然而，这涉及在同一表上执行自连接或重复查询同一表。另一方面，图数据库和数据模型天生支持基于路径的查询，因此我们使用igraph根据图中用户和游戏之间的路径向用户推荐游戏。\n\
  \n然后，我们介绍了如何将数据从MySQL迁移到Python igraph，既逐步进行，也使用了一组可用于任何有向、异构图的通用方法。\n\n最后，我们通过使用图数据模型建立了一个更复杂的系统来向用户推荐游戏。我们的推荐基于相似用户玩过的游戏，使用Jaccard相似度来估计相似性。我们的方法允许我们根据图中的边权重调整结果，边权重对应于每个用户-游戏对的游玩时间。这种基于相似度的推荐系统可用于实验，以确定用户应该玩一个游戏多少小时，才能让它影响对Steam用户的推荐。\n\
  \n在下一章中，我们将进一步巩固你目前所学的内容。下一章的核心将是使用图构建知识图谱，我们将研究医学摘要，并使用这些文档来关联术语和文档。\n\n\n\n\n"
- "## 构建知识图谱\n\n本章将进一步扩展你的知识并介绍知识图谱。在学习知识图谱是什么的同时，你还将通过清理数据以便导入图谱的实践操作来获得动手经验。这将让你了解数据科学和图建模的隐藏一面，在其中你花费大量时间清理数据并使其准备好开始建模。\n\
  \n此外，我们将教你将数据最佳地导入图谱的方法。之后，你就可以分析你的知识图谱了，知识图谱将通过一种称为社区检测的技术进一步扩展，以在你的知识图谱中寻找社区。\n\
  \n社区检测通常用于在网络中发现相似项目的组或集群。这些方法可以被利用，例如，找到在社交媒体上发布关于特定叙事的有影响力的群体，或在我们将要使用的示例中，用于在比较研究摘要时寻找相似的文献。\n\
  \n为了以结构化的方式分解这一点，我们将涵盖以下主要主题：\n\n- 介绍知识图谱\n- 清理我们知识图谱的数据\n- 将数据导入知识图谱\n- 知识图谱分析与社区检测\n\
  \n### 技术要求\n\n我们将使用 Jupyter Notebook 运行我们的编码练习，这需要 python>=3.8.0。此外，以下包需要在你的环境中通过\
  \ pip install 命令安装：\n\n- `igraph==0.9.8`\n- `spacy==3.4.4`\n- `scispacy==0.5.1`\n\
  - `matplotlib`\n\n或者，你也可以运行 `pip install -r requirements.txt`，在支持的 requirements\
  \ 文件中，以安装本章所需的所有支持依赖项。\n\n对于本章，你还需要安装一个用于部分 **自然语言处理 (NLP)** 的文本语料库。前往 https://allenai.github.io/scispacy/\
  \ 并下载 `en_core_sci_sm` 模型。在命令提示符或终端窗口中，导航到下载位置并运行 `pip install en_core_sci_sm-0.5.1.tar.gz`。\n\
  \n所有包含编码练习的笔记本都可在以下 GitHub 链接获得：https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH04。\n\
  \n### 介绍知识图谱\n\n在科学和医学等复杂领域，特定主题上可用的数据和文献 sheer 数量难以夸大。同样，对于成熟公司和行业中的知识管理而言，随着时间的推移，以文本信息形式存在的机构知识不断积累，变得太大而无法合理传播。在这两种情况下，知识图谱可能有助于缓解与过多分散信息相关的问题。\n\
  \n知识图谱的目标是以合理且可搜索的方式将相关信息、文本和文档链接在一起。\n\n在以文本为基础的知识图谱中，图中的链接通常代表相关的文档或文章。文本处理和 NLP\
  \ 本身就是巨大的领域，因此在本章中，我们将保持处理文本的方法简单。当然，文本数据的质量对准备数据以供知识图谱导入有很大影响。我们在这里使用简单的 `.txt`\
  \ 文件，但文档（特别是来自较旧来源的文档）可能以图像、PDF 或类似格式存储，使得文本提取成为连接数据的挑战的重要部分：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_81_0.png)\n\
  \n图 4.1 – 一个示例知识图谱摘录\n\n知识图谱也通常与本体相关联。本体是一组链接的概念，通常与特定主题相关。由于这个原因，本体也可以被视为一种图，其中概念是节点，链接代表这些概念之间的关系。\n\
  \n本体通常具有层次结构，其中一个宽泛的概念可能包含几个不那么宽泛的概念。例如，如果我们要创建一个哺乳动物的分类法，我们可能会在哺乳动物和狗的概念之间建立关系，以及哺乳动物和猫的概念之间建立关系。反过来，由于猫本身是一个宽泛的概念，我们还可能从猫到老虎和猫到猎豹建立关系。\n\
  \n我们可以在知识图谱构建中使用本体来定位文档中的概念；在两个文本体中出现相似概念时，我们可能会将一对文档链接在一起。再次取决于所使用文本处理的复杂程度，这可能像匹配单词一样简单，也可能更复杂，通过使用\
  \ NLP 工具如词形还原来帮助匹配。就知识图谱创建而言，这可以被视为自上而下的方法——我们知道我们正在寻找哪些术语以及它们如何相关，但我们不会找到任何新概念。\n\
  \n将这个想法颠倒过来，我们也可以使用文档中的文本在知识图谱内创建本体。这被称为自下而上方法，与之前示例中预定义的本体使用形成对比。在自下而上方法中，我们可以依赖于这样的假设：如果概念或术语在文本中共同出现（与某物共享位置），它们更有可能相关。例如，在一篇关于国际旅行的文档中，你很可能会看到\
  \ *机场*、*飞机* 等术语。在同一文档中，你不太可能看到例如与太空旅行相关的术语，如 *火箭* 或 *月亮*。利用这些想法，可以使用术语的共现来链接概念并开始构建一个初步的本体。当然，这不会是完美的，像由专家精心构建的本体那样，但这种方法启动起来要快得多，也更容易。机器构建的本体如果需要也可以由专家进一步整理。\n\
  \n在本章中，我们将使用 *自上而下* 和 *自下而上* 方法的想法来创建知识图谱。为了构建图谱，我们将使用来自 PubMed 的公开可用的研究论文摘要和一个医学术语语料库。我们可以通过使用摘要文本来链接共现术语，从而为术语和摘要增加价值。\n\
  \n现在，我们将看看如何在创建知识图谱之前清理你的数据。\n\n### 清理我们知识图谱的数据\n\n知识图谱通常包含代表相关文档之间共同点的关系，并且是使用这些文档文本中的内容构建的。因此，知识图谱构建很大一部分是清理和准备该文本以供后续图创建使用。\n\
  \n让我们先来看看 `20k_abstracts.txt` 中的原始摘要数据。该数据以以下摘要样式显示：\n\n**Aspergillus fumigatus**\n\
  \nBACKGROUND IgE 致敏于 Aspergillus fumigatus 以及阳性的痰真菌培养结果在难治性哮喘患者中很常见。\n\nBACKGROUND\
  \ 目前尚不清楚这些患者是否会从抗真菌治疗中受益。\n\nOBJECTIVE 我们旨在确定 3 个月的伏立康唑疗程是否改善了 IgE 致敏于 Aspergillus\
  \ 的哮喘患者的哮喘相关结局。\n\n我们可以看到，每个摘要都由哈希前缀的参考编号给出，每个句子前面都有大写字母的句子类型。此外，每个摘要都由一个换行符分隔。\n\
  \n文本数据通常在使用前需要处理，本例也不例外。在我们的案例中，摘要文本已为另一个 NLP 应用准备，并包含我们不需要的信息，例如句子类型和参考编号。对于我们的目的，我们只需要每个摘要的文本，所以让我们下一步清理数据以使其进入更可用的格式。\n\
  \n在后续步骤中，我们将带你完成导入和清理数据的过程，这些数据随后将被使用并有助于构建我们的知识图谱：\n\n1. 首先，我们需要导入内置的 `csv` 模块并打开文件。我们需要在\
  \ `csv.reader` 中使用 delimiter 参数指定我们的 `.txt` 文件的格式为制表符分隔。\n\n\n\n\n\n我们还会使用列表推导式将这个文件中的数据转换为列表的列表，并利用\
  \ `!= []` 运算符去除任何空行：\n\n```\nimport csv\nwith open('CH04/data/20k_abstracts.txt')\
  \ as c:\n    reader = csv.reader(c, delimiter='\\t')\n    data = [line for line\
  \ in reader if line != []]\n```\n\n数据加载完成后，我们现在可以将其转换为不同的格式。我们想要将每篇摘要中的各个句子拼接成一个完整的摘要——目前句子分布在不同行中——同时移除不必要的数据。\n\
  \n2. 由于清理这些数据的逻辑涉及多个步骤，我们用一个 for 循环以可读的方式执行数据清理，而不是使用高度复杂的列表推导式。我们可以先创建一个空列表，稍后用于存放清理后的数据。我们还需要初始化一个空的摘要字符串，以便将句子拼接进去，构建出完整的摘要：\n\
  \n```\nclean_data = []\nabstract = ''\n```\n\n3. 现在，我们可以开启 for 循环并添加一些逻辑。我们知道句子从第二行开始，因此我们可以对列表的列表进行切片处理，从\
  \ `data[1:]` 开始循环遍历各行。我们现在需要使用 if 语句以不同方式处理不同的行。当某行的长度仅为 1 时，我们知道这只包含一个我们不需要的引用编号。由于我们从原始数据的第二行开始循环，我们也知道长度为\
  \ 1 的行意味着我们之前看到的句子构成了一个完整的摘要。将这个逻辑应用到循环中，当我们看到 `len(line) == 1` 时，可以使用 `append()`\
  \ 将一篇摘要添加到 clean_data 列表中，并初始化一个新的空摘要字符串。如果当前行的长度不为 1，我们可以将当前行的第二个元素添加到摘要字符串中，以多行文本构建出一个完整的摘要，同时忽略句子类型注释：\n\
  \n```\nclean_data = []\nabstract = ''\nfor line in data[1:]:\n    if len(line) ==\
  \ 1:\n        clean_data.append(abstract)\n        abstract = ''\n    else:\n  \
  \      abstract += ' ' + line[1]\n```\n\n4. 最后，我们只需将数据写回文件，这样在之后每次构建知识图谱时就不必重复进行此清理步骤了。我们可以再次使用\
  \ csv 模块将每篇摘要写入单独的一行。我们还可以借此机会，通过使用 `enumerate()` 为每篇摘要分配一个依次递增的整数 ID，igrapg 稍后会需要用到它：\n\
  \n```\nwith open('CH04/data/20k_abstracts_clean.csv', 'w', newline='') as d:\n```\n\
  \n```\nwriter = csv.writer(d)\nfor i, line in enumerate(clean_data):\n    writer.writerow([i,\
  \ line])\n```\n\n此方法会在你的目录中写入一个干净的摘要文件，格式如下面的示例所示：\n\n```\n0,\" IgE sensitization\
  \ to Aspergillus fumigatus and a positive sputum fungal culture result are common\
  \ in patients with refractory asthma . It is not clear whether these patients would\
  \ benefit from antifungal treatment . We sought to determine whether a 3-month course\
  \ of voriconazole improved asthma-related outcomes in patients with asthma who are\
  \ IgE sensitized to A fumigatus . Asthmatic patients who were IgE sensitized to\
  \ A fumigatus with a history of at least 2 severe exacerbations in the previous\
  \ 12 months were treated for 3 months with 200 mg of voriconazole twice daily ,\
  \ followed by observation for 9 months , in a double-blind , placebo-controlled\
  \ , randomized design . Primary outcomes were improvement in quality of life at\
  \ the end of the treatment period and a reduction in the number of severe exacerbations\
  \ over the 12 months of the study . Sixty-five patients were randomized . Fifty-nine\
  \ patients started treatment ( 32 receiving voriconazole and 27 receiving placebo\
  \ ) and were included in an intention-to-treat analysis . Fifty-six patients took\
  \ the full 3 months of medication . Between the voriconazole and placebo groups\
  \ , there were no significant differences in the number of severe exacerbations\
  \ ( 1.16 vs 1.41 per patient per year , respectively ; mean difference , 0.25 ;\
  \ 95 % CI , 0.19-0 .31 ) , quality of life ( change in Asthma Quality of Life Questionnaire\
  \ score , 0.68 vs 0.88 ; mean difference between groups , 0.2 ; 95 % CI , -0.05\
  \ to -0.11 ) , or any of our secondary outcome measures . We were unable to show\
  \ a beneficial effect of 3 months of treatment with voriconazole in patients with\
  \ moderate-to-severe asthma who were IgE sensitized to A fumigatus on either the\
  \ rate of severe exacerbations , quality of life , or other markers of asthma control\
  \ .\"\n```\n\n现在，我们已经完成了让数据变得更完善、更整洁的步骤，可以开始设计图数据导入的方法了。这就是你付出的努力得到回报的时候。正如他们所说，数据科学家的生活始于你清理完第一个数据集。让我们准备好开始将数据导入我们的知识图谱吧。\n\
  \n### 将数据导入知识图谱\n\n在直接着手从清理后的摘要数据创建知识图谱之前，有很多事情需要考虑。和之前的章节一样，我们必须首先考虑目标图的结构。然后，我们需要处理摘要以提取感兴趣的术语。接着，一旦我们有了术语，就可以创建要导入到\
  \ igraph 中的边列表。\n\n正确地将数据导入知识图谱至关重要，而这完全取决于你如何从概念上和实际操作上设计你的图模式。以下部分展示了如何设计你的模式，以确保你的知识图谱按你期望的方式工作。\n\
  \n### 设计知识图谱模式\n\n在直接进行数据导入之前，我们必须考虑知识图谱的结构。针对我们的用例，我们对连接相关的文档和概念感兴趣。\n\n在节点方面，我们同时有摘要和术语。我们的摘要只有\
  \ ID 和文本。我们的术语也需要类似的东西，尽管文本会更短。因此，我们的节点属性很简单，每个节点只需要两个不同的属性。\n\n> **重要说明**\n> 值得注意的是，我们的摘要通常是非常大的文本字段，超过\
  \ 1000 个字符。就本章的目的而言，将摘要文本添加为节点属性不会成为问题，因为整体图的规模相对较小。然而，在一个拥有数百万节点的更大规模的图中，如此大的属性可能会极大地增加整个图在内存中的大小，并影响性能。在处理非常大规模的图时，通常合理的做法是在节点本身上存储一个代表该属性的\
  \ ID，同时将文本数据保存在一个单独的、带键值的非图数据库中，例如 SQL。访问文本本身（而不是查询图的结构）则可以由另一个高性能的独立进程来处理。\n\n\
  在我们的假设图中存在两种类型的实体，即摘要和术语，这意味着我们的图是异质的（包含多种类型的对象或多种类型的链接）。当我们在摘要中找到术语时，合理的做法是将它们与包含这些术语的摘要链接起来。这种单一类型的关系就足以创建一个基础的知识图谱，其中的实体可以在摘要中被找到。当唯一种类的链接存在于两种不同类型的节点之间时，这被称为二部图。\n\
  \n我们可能还对特定摘要中术语的频率感兴趣，以表示摘要与某个概念的关联强度。这可以在后续分析中用于过滤图表，类似于第三章《数据模型转换——从关系到图数据库》中所执行的操作。\n\
  \n下图展示了一个二部知识图谱关系的示例，在术语和摘要之间有一条 FOUND_IN 边。本质上是说明哪些术语在哪些摘要中可以被找到：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_85_0.png)\n\
  \n图 4.2 – 二部知识图谱\n\n上图表明，我们可以在每个术语与摘要的 FOUND_IN 属性之间建立关系，因此我们实质上是在表述“获取在某篇摘要中被找到的某个术语”，并带有一条有向边。\n\
  \n\n\n\n\n使用我们之前加载的语料库对我们的文本进行处理。现在，我们可以通过访问分析后文本的 ents 属性来打印 spacy 提取的实体：\n\n```\n\
  text = data[0][1]\ndoc = nlp(text)\nprint(list(doc.ents))\n```\n\n我们可以看到，像 IgE 和\
  \ asthma 这样看起来像技术术语的实体被提取出来了，这些正是我们需要用来将摘要连接起来的生物医学语言术语。然而，我们也可以看到 positive 和 severe\
  \ 这样的实体，虽然在技术文献中使用，但不足以具体地告知我们摘要的内容。此外，我们看到有些实体带有大写字母。这可能会阻止在摘要之间链接相同的术语，因为术语匹配但大小写不同。\n\
  \n在这一点上，我们可以直接构建知识图谱，通过在抽象关系中构建找到的术语并将它们添加到 igraph 中。然而，由于我们已识别出的限制，如果我们先对提取的术语进行预处理，我们的图谱将更有用。\n\
  \n3. 让我们首先使用与之前方法类似的方法，但现在使用列表推导式，从每个摘要中提取所有生物医学实体。每行的第二个元素包含摘要的文本，因此我们将把该文本输入到\
  \ nlp() 方法中：\n\n```\nabstract_entities = [[row[0], nlp(row[1]).ents] for row in\
  \ data]\n```\n\n4. 现在我们可以处理在查看第一个摘要时遇到的大小写问题。我们可以再写一个列表推导式，将每个实体转换为字符串术语，然后使用 lower()\
  \ 方法将每个术语转换为小写：\n\n```\nabstract_entities = [\n[row[0], [str(ent).lower() for ent\
  \ in row[1]]\n] for row in abstract_entities]\nprint(abstract_entities[:5])\n```\n\
  \n现在，我们看到提取的术语全部为小写，这意味着当我们稍后用它们创建节点时，不会为 Asthma 和 asthma 这样的术语创建多个节点。\n\n5. 接下来，让我们关注\
  \ scispacy 提取的生物医学语言类型的问题。我们确定了一些提取的技术术语将有助于连接摘要，而有些则可能在不相关的摘要中非常常见，例如 positive。在许多\
  \ NLP 应用中，经过进一步处理的提取实体数量是有限的。这通常通过使用实体在文档中出现的频率来处理。提取的术语 positive 很可能出现多次，对于知识图谱而言，这意味着连接许多不相关的文档，而没有任何实际益处。\n\
  \n6. 为了研究这个问题，我们可以先检查我们所有摘要中提取实体的频率。首先，我们通过列表推导式抓取数据中每一行中的第二个元素，将实体与摘要 ID 分离：\n\n\
  ```\nall_entities = [row[1] for row in abstract_entities]\n```\n\n7. 现在，all_entities\
  \ 包含一个列表的列表，其中每个列表包含许多术语。我们想查看术语在所有摘要中的频率，因此我们需要将这些列表合并成一个大列表。为此，让我们使用 Python 内置的\
  \ itertools 模块，其中包含许多用于处理结构复杂的列表的有用功能。对于我们的情况，我们需要使用 itertools.chain.from_iterable()\
  \ 将我们的列表的列表转换为一个列表：\n\n```\nimport itertools\nentities = itertools.chain.from_iterable(all_entities)\n\
  ```\n\n8. 将所有术语放在一个列表中后，我们可以使用另一个内置 Python 库 collections.Counter() 来计算它们的频率，它会将我们的列表转换为\
  \ {term: frequency} 键值对的字典。然后，我们可以使用 sorted() 方法以相反顺序对 resulting 字典进行排序，按 entity_freq.items()\
  \ 中每个项的第二个元素排序，使用匿名函数：\n\n```\nfrom collections import Counter\nentity_freq = dict(Counter(entities))\n\
  entity_freq = dict(sorted(entity_freq.items(),\n    key=lambda item: item[1], reverse=True))\n\
  print(entity_freq)\n```\n\n我们的 print 语句显示，频率最高的术语是 patients、treatment、study 和 groups，其次是研究文献中发现的许多其他通用术语。这些术语对我们的知识图谱没有任何价值，因为我们将连接许多不相关的摘要。往下看打印的频率，频率较低的术语更有可能对我们有用。\n\
  \n9. 在这一点上，我们需要为我们将允许进入知识图谱的高频术语选择一个截止点。数据太多，无法逐项进行，因此选择阈值或阈值选择方法可能具有任意性。为了本章的目的，我们将删除频率高于\
  \ 100 的任何术语，认识到这将删除一些有用的术语，并保留一些低频的通用术语。在为真实知识图谱设计处理时，此频率截止值可能会与一些下游分析结合修改，以检查对\
  \ resulting 图的影响并确定最佳阈值。让我们看看设置 100 的上限频率阈值将删除多少术语。我们可以使用带条件的字典推导式来限制我们的 entity_freq\
  \ 字典为高频实体并打印 resulting 字典的长度：\n\n```\nhigh_freq = {ent: value for ent, value in\
  \ entity_freq.items() if value > 100}\n```\n\n```\nprint(len(high_freq))\nprint(len(entity_freq))\n\
  ```\n\n我们的第一个 print 语句显示，使用此上限阈值，我们将从图谱中删除 199 个术语。我们的第二个 print 语句显示，在删除任何术语之前提取的唯一术语总数为\
  \ 47,667，因此我们的 100 的上限阈值导致删除了约 0.4% 的术语。\n\n在删除将被带入知识图谱构建的高频实体之前，我们还必须考虑非常低频的术语。仅在一条摘要中出现的术语不会连接摘要，因此在旨在创建相关文档之间关系的知识图谱中，其用途有限。\n\
  \n10. 我们可以使用与之前用于高频术语的类似字典推导式来检查有多少术语在我们整个摘要集中仅出现一次。在这里，我们将 value > 100 条件替换为 value\
  \ == 1，以获取频率为 1 的术语字典：\n\n```\nlow_freq = {ent: value for ent, value in entity_freq.items()\
  \ if value == 1}\nprint(len(low_freq))\n```\n\n这显示有 29,364 个术语仅出现一次。这比高度常见的术语数量大得多，这对于\
  \ NLP 管道来说是相当典型的。回顾我们的总数，我们可以计算出频率为 1 的术语约占提取的唯一术语的 61.6%。由于低频术语数量众多，选择不将它们包含在下游图谱构建中将提高知识图谱分析后期的整体性能。\n\
  \n11. 现在我们可以实施我们选择的阈值，首先创建一个我们不想提取的术语列表。在这里，我们使用带条件的列表推导式，选择出现次数超过 100 次或仅出现一次的实体字符串：\n\
  \n```\nremoved_terms = [ent for ent, value in entity_freq.items() if value > 100\
  \ or value == 1]\n```\n\n12. 有了要排除的术语列表后，我们现在可以精简 abstract_entities 变量中与每个摘要关联的实体。让我们再次使用列表推导式来选择不在\
  \ removed_terms 列表中的术语，同时保留它们与每个单独摘要的关系。然后，我们可以打印第一个摘要的新精简实体，以确认我们的方法按预期工作：\n\n\
  ```\nabstract_entities = [[row[0], [ent for ent in row[1] if ent not in removed_terms]]\
  \ for row in abstract_entities]\nprint(abstract_entities[0])\n```\n\n\n\n\n\n将本节开头打印的实体与打印的实体进行比较，我们可以看到一些非常常见的术语已被删除，以及一些不太可能出现在另一篇摘要中的高度特定术语。\n\
  \n虽然我们在此处用于文本处理的方法相当简单，但 NLP 管道也可以高度复杂和精致。为文本设计预处理工作流程有点像是一门艺术，通常需要对主题有深入的了解，并在任何实现之前对文本数据进行分析。我们本可以做更多的事情来改进摘要和术语的预处理，但为了专注于图数据建模，下一步将是把我们的数据作为节点和边添加到图中。\n\
  \n### 构建知识图谱\n\n现在我们的数据已经清理完毕，并且我们拥有与术语关联的摘要，我们就可以开始构建知识图谱了。这将在以下步骤中得到突出显示，第一步是从我们之前各节中已处理的数据创建节点和边：\n\
  \n- 1. 当我们在本章前面最初处理原始摘要数据时，我们为每个连续的摘要创建了一个递增的整数 ID。这些现在可以用作节点创建中的 igraph ID。然而，我们没有术语的节点\
  \ ID，因为在从摘要中提取术语之前，我们不知道将向图添加多少个节点。\n\n  让我们接下来为每个术语创建节点 ID。我们需要一个唯一术语的列表，我们可以从\
  \ abstract_entities 变量中访问，每个子列表的第一个元素。然后，正如我们在本章前面所做的那样，我们可以使用 itertools.chain.from_iterable()\
  \ 来连接我们术语的列表中的每个列表：\n\n  ```python\n  terms = [abstract[1] for abstract in abstract_entities]\
  \  # get just ents no abstract IDs\n  unique_terms = list(set(itertools.chain.from_iterable(terms)))\n\
  \  ```\n\n  现在，我们需要找到所有唯一术语并为每个术语分配一个整数 ID。这些 ID 也必须从我们分配给摘要的最后一个 ID 开始加 1，以便每个节点无论其类型如何都有唯一的\
  \ igraph ID。为此，我们可以使用字典推导式与 enumerate() 结合，为每个唯一术语创建一个 {term: ID} 对的字典。使用 len()\
  \ of data 作为 enumerate() 中的第二个参数，该参数等于摘要的数量，确保分配给术语的第一个 ID 是先前分配给摘要的最高 ID 之后的下一个整数：\n\
  \n  ```python\n  term_ids = {term: i for i, term in enumerate(unique_terms, len(data))}\n\
  \  ```\n\n- 2. 让我们通过查找 `ige` 的 ID 来确保术语已分配 ID：\n\n  ```python\n  print(term_ids['ige'])\n\
  \  ```\n\n好，现在我们有了图所需的所有节点信息，我们需要构建一个 edgelist 来表示术语和摘要之间的交互。我们需要的所有信息都已保存在 `abstract_entities`\
  \ 变量中，但我们需要将摘要和术语转换为整数 ID，以便导入到 igraph 图中。我们需要遍历 `abstract_entities` 列表中的每个列表，并用相应的整数替换字符串。为此，让我们打开一个\
  \ `for` 循环并将每个列表解包为 `abstract_id` 和术语子列表。我们还需要创建一个新的空列表来保存 igraph 兼容的边：\n\n```python\n\
  edgelist = []\nfor abstract_id, terms in abstract_entities:\n    term_freq = dict(Counter(terms))\n\
  ```\n\n在我们的模式中，我们为 FOUND_IN 关系添加了一个边属性。这是 frequency，它将表示术语在单个摘要中使用的次数，并作为术语与其来源相关性的权重。\n\
  \n要找到摘要中每个术语的频率，我们再次可以使用 `collections.Counter()` 方法。这将创建一个 {term: frequency} 对的字典，我们可以用它为每条边添加权重。Python\
  \ 中的字典数据结构始终遵循键值关系，允许您添加、引用或删除现有索引。\n\n- 3. 现在，我们需要遍历与当前摘要关联的子列表中的每个术语，并从整数 ID 拼装一条边。对于每个术语，我们将一个表示边的列表附加到\
  \ *edgelist* 列表中。每个列表包含当前术语的整数，表示取自我们之前创建的 `term_ids` 字典，强制转换为整数的摘要 ID，以及取自 `Counter()`\
  \ 字典的摘要中术语的频率。然后我们可以打印 `edgelist` 中的前几条边，以检查它们是否按预期结构化：\n\n  ```python\n  for term,\
  \ freq in term_freq.items():\n      edgelist.append([int(term_ids[term]),\n    \
  \                   int(abstract_id), freq])\n\n  print(edgelist[:10])\n  ```\n\n\
  - 4. 让我们也确认 edgelist 中确实存在我们知道应该存在的边。在我们的第一个摘要中，术语 `ige` 被使用了四次。这意味着我们的边的权重应等于 4。我们可以使用\
  \ `assert` 来确保从 `ige` 的 ID 到 ID 为 0 的节点（代表我们的第一个摘要）的边存在，并确保其权重，即第三个列表元素，与预期一致：\n\
  \n  ```python\n  assert [term_ids['ige'], 0, 4] in edgelist\n  ```\n\n- 5. 该建图了——现在我们有了正确格式的节点和边，让我们继续将它们添加到\
  \ *igraph* 图中。我们可以导入 *igraph* 并使用 `igraph.Graph()` 创建一个有向图，指定 directed 选项：\n\n \
  \ ```python\n  g = igraph.Graph(directed=True)\n  ```\n\n- 6. 我们首先需要向图中添加节点。这是一个简单的案例，使用\
  \ `add_vertices` 方法添加等于我们拥有的术语和摘要数量的节点：\n\n  ```python\n  g.add_vertices(len(term_ids)\
  \ + len(data))\n  ```\n\n- 7. 我们可以通过访问图的 vs 属性 g 来将摘要和术语文本作为属性添加到节点。我们可以按列表方式执行此操作，通过创建包含来自我们清理后的数据列表的摘要文本和来自\
  \ term_ids 字典的 items() 的术语文本的单个列表：\n\n  ```python\n  text = [abstract[1] for abstract\
  \ in data] +\n      [ent for ent, _ in term_ids.items()]\n  g.vs['text'] = text\n\
  \  ```\n\n  让我们简要确保代表术语 `ige` 的节点的 text 属性确实等于 `ige`，通过打印它：\n\n  ```python\n  print(g.vs[term_ids['ige']]['text'])\n\
  \  ```\n\n- 8. 我们还需要向图中的节点添加节点类型。我们有两种类型的节点，摘要和术语。由于摘要的 ID 首先分配，我们知道 ID 从 0 到 len(data)\
  \ - 1 是摘要，随后的节点 ID 代表术语。由于这一点，我们可以按列表方式添加节点类型，通过使用两个列表推导式创建两个字符串列表，然后将这些字符串添加到 g.vs\
  \ 中的 type 节点属性：\n\n  ```python\n  types = ['abstract' for _ in data] +\n      ['term'\
  \ for _ in term_ids.items()]\n  g.vs['type'] = types\n  ```\n\n- 9. 再次，让我们确保此操作按预期成功，通过打印\
  \ `ige` 节点的类型。这应等于 term：\n\n  ```python\n  print(g.vs[term_ids['ige']]['type'])\n\
  \  ```\n\n- 10. 在所有节点就位后，我们现在可以将边添加到图中。为此，我们需要首先创建一个没有边权重的成对边列表和一个单独的边权重属性列表。我们可以使用列表推导式完成这两个任务：\n\
  \n  ```python\n  edges = [[source, target] for source,\n      target, _ in edgelist]\n\
  \  frequencies = [freq for _, _, freq in edgelist]\n  ```\n\n- 11. 最后，为了完成知识图谱的设置，我们可以使用\
  \ add_edges() 方法添加这些边，并通过将频率属性添加到 g.es 来分配属性：\n\n  ```python\n  g.add_edges(edges)\n\
  \  g.es['frequency'] = frequencies\n  ```\n\n有了这个，我们的知识图谱已设置完成，可以进行分析。接下来，我们可以使用图来回答关于我们数千篇生物医学摘要中包含的知识的有趣问题。\n\
  \n### 知识图谱分析和社区检测\n\n在我们更深入地研究知识图谱之前，了解其结构是有意义的。关于图结构的 information 将为我们进行的进一步分析提供框架。此分析至关重要，我们将研究如何通过查看哪些组件是连接的来检查知识图谱结构；相反，断开的组件意味着我们的知识图谱中存在独立的术语和摘要，这些术语和摘要与我们医学摘要的主要知识是分开的。从那里，我们将查看常见术语和方法以识别感兴趣的摘要。让我们开始检查知识图谱结构。\n\
  \n#### 检查知识图谱结构\n\n我们流程中的下一步系列将是检查知识图谱结构：\n\n- 1. 让我们首先找到图中节点和边的数量，因为在本章中，我们构建的图不是来自离散数据点，而是来自文本。我们可以通过打印\
  \ g.vs 属性的 len() 来找到节点数量，并通过打印 g.es 属性的 len() 来找到边数量：\n\n  ```python\n  print(len(g.vs))\n\
  \  print(len(g.es))\n  ```\n\n  这向我们展示了我们的知识图谱中有 20,603 个节点和 71,463 条边。\n\n- 2.\
  \ 了解我们的图是否完全连接也很重要，尤其是在知识图谱的情况下。断开的图意味着我们在摘要组中的技术领域从不使用相同的短语或生物医学术语。我们可以通过使用 g.clusters()\
  \ 方法找到连通分量。我们可以选择将参数 mode 设置为 strong 或 weak。强连通节点必须具有无向边或它们之间双向的有向边才能被视为集群的一部分而连接。对我们仅从术语到摘要单向的边有向图的影响将是一个完全断开的图。由于强连通分量算法高估了像我们的知识图谱这样的二分图的断开程度，我们将使用\
  \ weak 选项。我们可以打印结果以检查集群的数量和结构：\n\n  ```python\n  connected_components = g.clusters(mode='weak')\n\
  \  print(connected_components)\n  ```\n\n\n\n我们的打印结果显示，我们只有一个弱连通分量，包含图中所有节点。考虑到我们创建的一些术语节点，即使经过高频过滤，也相当通用，这是一个预期的结果。即使是差异很大的领域，也很可能使用共同的科学语言，这反映在组件数量上。\n\
  \n如果我们使用的是包含我们预期不相关的术语的文档，并从中创建知识图谱，那么连通分量可以作为实体抽取期间术语频率阈值是否设置正确的一个有用指标。在为知识图谱设计数据摄取管道时，可以调整这些阈值以达到预期的弱连通分量数量。\n\
  \n3. 我们可以检查的另一个结构元素是我们知识图谱中节点的度分布。节点的度是邻居节点的数量，即与我们感兴趣的节点共享边的节点。查看整个图中的度分布将帮助我们理解摘要和术语在大规模上是如何连接的。由于我们有一个包含两种类型节点的异构图，因此对每种节点类型的度分布进行单独检查是有意义的。这在二分图中尤其重要，因为我们知道术语只连接到摘要，反之亦然。鉴于我们从每个摘要中提取了大量生物医学术语，我们可能会期望不同类型节点的这些度分布差异很大。\n\
  \n   要创建我们的分布，我们首先需要再次使用 `vs.select()` 方法来仅选择特定类型的节点，首先是标记为 abstract 的节点。我们可以使用自定义的\
  \ `type_eq` 参数来做到这一点，其中 type 指定我们之前创建的节点属性类型，而 `_eq` 后缀指定它必须等于字符串 `abstract`。我们可以使用非常相似的\
  \ `select()` 方法来获取术语节点的列表：\n\n```\nabstract_nodes = g.vs.select(type_eq='abstract')\n\
  term_nodes = g.vs.select(type_eq='term')\n```\n\n4. 要找到我们的摘要和术语节点的度，我们可以使用 igraph\
  \ 的 `degree()` 方法。重要的是要记住我们的图是有向的，而 `degree()` 有一个 mode 参数，指定边应朝哪个方向才能计入度。然而，由于\
  \ mode 的默认值是 degree，我们这次可以省略 mode 参数：\n\n```\nabstract_degree = g.degree(abstract_nodes)\n\
  term_degree = g.degree(term_nodes)\n```\n\n5. 我们的 abstract_degree 和 term_degree\
  \ 变量包含节点度的列表。我们可以使用 matplotlib 模块的 pyplot 在直方图中绘制这些数据。在将模块导入为 plt 之后，让我们首先使用 plt.hist()\
  \ 绘制 abstract_degree 中的值，其中包含将数据划分为若干个箱的 bins 数以及 edgecolor 为黑色，以便区分每个箱。然后，我们可以设置图表的\
  \ xlabel() 和 ylabel()，最后使用 plt.show() 绘制图表：\n\n```\nimport matplotlib.pyplot as\
  \ plt\nplt.hist(abstract_degree, bins=20, edgecolor='black')\nplt.xlabel('Abstract\
  \ Node Degree')\nplt.ylabel('Frequency')\nplt.show()\n```\n\n下图显示了相关术语按其度数的频率：\n\
  \n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_95_0.png)\n\n图 4.3 – 知识图谱中摘要节点的度分布\n\n\
  我们可以看到，从直方图中，我们的数千个摘要节点中的大多数有大约 25-35 个相关术语，而少数几个超过 65 个。这里摘要节点的度更接近正态分布，而非许多其他图度分布的示例。\n\
  \n6. 我们将对术语节点重复此过程，这将使我们能够以并列和并排的方式查看分布：\n\n```\nplt.hist(term_degree, bins=20,\
  \ edgecolor='black')\nplt.xlabel('Term Node Degree')\nplt.ylabel('Frequency')\n\
  plt.show()\n```\n\n此代码生成了 **Term Node Degree** 的图表，可在 *Figure 4.4:* 中观察到：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_96_0.png)\n\
  \n图 4.4 – 知识图谱中术语节点的度分布\n\n可以立即看出，我们的术语节点的度分布与摘要节点非常不同。大多数术语连接到 1 到 10 个摘要之间，我们的分布形状严重偏斜，具有很长的尾部，这在许多图度分布中很典型。很少有术语的度超过\
  \ 50。\n\n回顾我们在使用实体抽取为知识图谱准备数据时应用的阈值，这些图表可以进一步帮助在图构建管道中进行参数调优。随着术语频率阈值的设定，这些分布可能会发生巨大变化，并为我们提供图结构的良好洞察。我们两种节点类型、摘要和术语的度分布差异巨大，表明在异构图中，分别分析节点类型是有益的。如果不独立绘制，我们的节点类型的不同分布形状很可能会丢失。\n\
  \n现在我们对图的结构有了基础的理解，我们可以深入进行更具体的分析和知识图谱用例。我们对图结构的检查将帮助我们将进一步的结果置于上下文中。\n\n### 识别感兴趣的摘要\n\
  \n在组装了知识图谱后，我们现在可以利用它来探究摘要中包含的信息。知识图谱相对于更经典的可搜索数据库提供了几个优势。在摘要数据库中，我们可以搜索特定术语并找到与其关联的所有摘要。然而，从那里，如果我们想找到这些摘要中的主题或相关概念，就需要用户手动进行此分析。这通常还依赖于数据库用户对数据库中文档所涵盖的主题领域的专业知识，以便从原始文本中找到共同点和见解。\n\
  \n在我们的知识图谱中，我们使用已知的生物医学语言语料库提取了科学术语。我们以一种无偏见的方式完成了此操作，无需特定领域的专业知识。我们的术语现在连接了使用它们的摘要，很可能这些摘要反过来包含其他共同术语或相关概念。\n\
  \n以下步骤将展示如何为识别我们感兴趣的摘要设置 Python 逻辑：\n\n1. 让我们通过从一个选定的术语开始来检查我们知识图谱中的一个概念。如果我们想找到使用一个术语的所有摘要，我们可以使用\
  \ vs.select() 方法。例如，让我们通过利用 select() 的 text_eq 参数，找到知识图谱中包含术语 yoga 的所有生物医学摘要。vs.select()\
  \ 方法始终返回一个节点列表，尽管我们知道应该只有一个 yoga 术语节点，所以我们可以使用列表索引选择第一个也是唯一的元素。然后，我们想要用于进一步分析的 igraph\
  \ 节点 ID，因此我们可以使用 .index 属性来访问它：\n\n```\nyoga_node_id = g.vs.select(text_eq='yoga')[0].index\n\
  ```\n\n2. 一旦我们有了术语 yoga 的节点 ID，要找到相关的摘要，我们可以识别其邻居。在 igraph 中，我们可以通过使用 neighbours()\
  \ 方法并添加 yoga 节点的 ID 作为参数来做到这一点：\n\n```\nyoga_abstract_nodes = g.neighbors(g.vs[yoga_node_id])\n\
  ```\n\n3. 这返回一个邻居节点 ID 的列表，由于我们的二分图结构，这些都将是摘要节点。利用我们的邻居 ID 列表，让我们使用列表推导式访问 text\
  \ 节点属性来找到每个节点关联的摘要文本，利用 g.vs：\n\n```\nyoga_abstracts = [g.vs[neighbor]['text'] for\
  \ neighbor in yoga_abstract_nodes]\nprint(yoga_abstracts)\n```\n\n4. 打印这些结果显示，与术语\
  \ yoga 关联的摘要有六个。现在，如果这是例如搜索引擎的结果，我们需要阅读每个摘要并理解其中的概念，以便找到与 yoga 相关的生物医学主题。\n\n\n\n\
  \n\n然而，由于我们的技术术语已被提取并转换为知识图谱，我们可以使用该图谱来定位与这些摘要相关联的术语。\n\n要做到这一点，我们需要再次使用 `neighbors()`\
  \ 方法，这次使用包含术语 `yoga` 的摘要的节点 ID，包含在之前分配的 `yoga_abstract_nodes` 变量中。我们想要为一组节点找到邻居，这可以通过列表推导来完成：\n\
  \n```\nrelated_term_nodes = [g.neighbors(node) for node in yoga_abstract_nodes]\n\
  ```\n\n- 5. 这将返回一个列表的列表，包含每个摘要节点的邻居的节点 ID。要获得所有唯一术语的列表，我们需要先展平我们的列表的列表。正如我们之前所做的，我们可以使用\
  \ `itertools.chain.from_iterable()` 来实现这一点，首先导入内置的 `itertools` Python 库并在 `related_term_nodes`\
  \ 上调用该方法：\n\n```\nimport itertools\nrelated_term_nodes = itertools.chain.from_iterable(related_term_nodes)\n\
  ```\n\n- 6. 然后，我们需要找到与我们展平列表中的每个术语节点关联的文本节点属性。我们可以使用 `g.vs` 来查找文本属性，包含在 `set()`\
  \ 中以去除重复项：\n\n```\nrelated_terms = set(g.vs(related_term_nodes)['text'])\nprint(related_terms)\n\
  print(len(related_terms))\n```\n\n这完成了查找我们特定查询术语的相关术语的步骤。打印 `related_terms` 显示了我们从包含术语\
  \ `yoga` 的摘要中提取的所有生物医学术语。从中，我们可以找到与瑜伽研究相关的术语和概念，例如心理健康、内脏脂肪和慢性中风。总共有 168 个唯一术语与这\
  \ 6 个摘要相关联。\n\n在我们的图谱中，我们所有的边都明确表示在摘要中发现的术语。在一些更先进的知识图谱中，你可能会发现关系反映了节点所代表的词语、短语或概念之间的上下文。例如，而不是\
  \ `yoga` 通过 `FOUND_IN` 关系链接到也包含 `mental health` 的摘要，术语 `yoga` 可能会通过上下文链接连接到 `mental\
  \ health`，例如 `USED_TO_TREAT`。创建上下文链接需要挖掘文本以获取上下文，而且 notoriously 难以推断上下文。有时，这可能不存在于数据中，而且它肯定超出了本章的范围。\n\
  \n然而，通过更复杂的 NLP 方法来为图构建生成节点和边，可以创建更先进、更细致的知识图谱。\n\n### 使用社区检测识别领域\n\n在上一节中，我们使用了生物医学知识图谱来识别包含特定术语的摘要，并通过这些摘要找到与我们原始感兴趣术语相关的术语。这可以被认为是在建立一组相关信息，或者也许是一个概念，或一个领域。\n\
  \n如果我们知道感兴趣的术语，我们可以从起点访问这些节点组。但如果我们想要一种更通用的方法来检查摘要中可能包含的领域呢？我们可能会问：我们的一些摘要是否与特定的科学研究领域相关？\n\
  \n在没有起点的情况下，我们可以查看图的<|message|> 来回答这些问题。当摘要和术语相关时，通常它们之间会有更多的边。例如，如果一组科学文章是由研究大脑的科学家撰写的，你不会期望它们与关于肝脏功能研究的文章包含大量相同的语言。我们可以使用这些假设来尝试将图拆分为强连接的部分，具有共同的语言，使用一组称为社区检测的方法。\n\
  \n社区检测算法通常会找到与其它邻近区域相比高度互连的图的区域。这些方法将连通图拆分为称为社区的部分。\n\n在本节的目的中，我们将使用多层方法进行社区检测。多层社区检测，也称为\
  \ Louvain 方法，通过逐渐将每个节点分配给邻近社区并计算图中社区的模块度来将图拆分为社区。模块度可以被认为是一组节点的互连性，即连接的状态。该算法旨在改变社区节点属于不同社区，直到模块度尽可能高或模块度变化的最小阈值达到为止。最终结果是图被拆分为不同的社区。\n\
  \n值得注意的是，与我们在上一节中检查的图的连通分量相比，社区可以通过边连接。区别在于，虽然社区仍然可以相互链接，但它们之间的链接可能不如社区内的节点那样紧密。\n\
  \n多层社区检测算法只是将图拆分为社区以找到高层结构信息的一种方法，并且不需要设置太多参数，同时也相当容易理解。一些方法非常有效且更复杂，但在大型图上扩展性很差，例如\
  \ `walktrap`，它使用随机游走作为在连接路径上上下移动的驱动力。其他方法运行速度极快，即使在数百万个节点上也是如此，但通常提供的结果较少有用，例如 `label\
  \ propagation`。还有一些方法为同一图上的每次运行提供一致、相同的结果，而许多社区检测方法，包括多层方法，由于算法的随机初始化和迭代，每次运行可能会生成不同的结果。不同的方法适用于不同的图结构，善于辨别的图专家会在为特定用例确定一种方法之前使用并比较几种方法。`igraph`\
  \ 中提供了许多选项。\n\n下面的图表显示了具有不同社区的术语和摘要，即与特定主题相关的研究主体。这些可能是关于某些疾病的医学摘要，例如心血管和肿瘤学疾病，例如：\n\
  \n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_100_0.png)\n\n图 4.5 – 示例：两个不同的概念，被拆分为社区\n\
  \n正如我们在之前的示例中所做的那样，我们现在将突出显示在我们的知识图谱上运行多层社区检测算法的步骤：\n\n- 1. 让我们尝试在我们的知识图谱上运行多层社区检测以找到一些相关摘要和术语的区域。首先，我们需要将有向图转换为同一图的无向表示。这是因为在\
  \ `igraph` 中，多层算法未配置为在有向边上运行。由于我们的图只包含一种类型的边，并且这些边始终从术语运行到摘要，因此在这种转换中我们不会丢失任何信息。在\
  \ `igraph` 中，将图转换为无向格式的最简单方法是使用 `as_undirected()` 方法：\n\n```\ng_u = g.as_undirected()\n\
  ```\n\n- 2. 我们的新图 `g_u` 现在包含我们知识图谱的无向版本。我们现在准备执行社区检测，因此让我们使用 `igraph` 的 `community_multilevel()`\
  \ 方法在图上运行该算法。`community_multilevel()` 有一些可选参数，但现在，我们可以在没有这些参数的情况下运行该方法：\n\n```\n\
  community_membership = g_u.community_multilevel()\nprint(len(community_membership))\n\
  ```\n\n`community_membership` 变量包含 `igraph` 特定的 `VertexClustering` 对象的列表，其中每个对象包含一个社区标签和属于该社区的节点。\n\
  \n打印 `community_membership` 的长度将显示图被拆分为多少个社区。由于多层算法具有随机种子组件，这个数字每次运行可能略有不同，尽管所发现的社区的结构应该保持相对稳定。如果图构建步骤中的阈值参数保持不变，你可以期望大约\
  \ 20 个社区。\n\n- 3. 接下来，让我们看看这些社区的大小。如果我们使用 `enumerate()` 遍历 `community_membership`\
  \ 中的 `VertexClustering` 元素，我们可以使用 f-string 打印社区 ID 和每个社区的大小：\n\n```\nfor i, community\
  \ in enumerate(community_membership):\n    size = len(community)\n    print(f'Community:\
  \ {i}, size: {size}')\n```\n\n社区的大小可能非常不同，因为每个社区都是根据算法反复尝试最大化模块度而不是任何其他度量来分隔的。如果存在一个小的社区，其节点与其它附近社区中的邻近节点相比很可能高度互连。\n\
  \n- 4. 让我们看看单个社区的成员，以了解这种方法是否可用于找到相关的研究术语和领域。我们可以通过简单地将社区检测结果强制转换为 `list()` 来将我们的\
  \ `VertexClustering` 元素转换为仅包含节点成员的列表的列表。我们还可以通过使用 `sorted()` 并使用每个元素的 `len()` 作为\
  \ `key` 参数，然后取排序后列表的第一个元素，来查看最小社区中的节点：\n\n```\nsmallest_community = sorted(list(community_membership),\
  \ key=len)[0]\nprint(smallest_community)\n```\n\n打印语句显示最小社区的节点 ID。为了了解这些术语代表什么概念或领域，我们接下来需要找到该社区中的术语节点以及这些节点持有的文本属性。\n\
  \n我们可以通过调用 `vs.select()` 方法来找到术语节点，正如我们在本章中多次所做的那样。我们可以使用 `select()` 仅使用 `g.vs`\
  \ 属性返回的社区节点列表，并通过在 `type_eq` 参数中指定来指定我们只想找到术语节点：\n\n```\ncommunity_nodes = g.vs[smallest_community].select(type_eq='term')\n\
  ```\n\n- 5. 然后，我们可以通过在我们的 `community_nodes` VertexSeq 对象上指定 `text` 属性来找到这些术语节点的文本节点属性，然后打印术语：\n\
  \n```\ncommunity_terms = community_nodes['text']\nprint(community_terms)\n```\n\n\
  \n\n\n\nVoila！这就是启动你的第一个社区检测算法所需做的全部工作。然而，由于多层社区检测算法的随机性，最小的社区在每次运行中可能包含不同的术语。\n\
  \n这有助于检查属于该社区的术语，并且在回答问题或关键业务问题时非常有帮助，例如：它们之间是否有任何关联？有些是通用的，而另一些是具体的且相关的吗？这种方法可用于在摘要组之间，或实际上任何其他类型的文档之间发现关系，而你可能并不期望它们存在。\n\
  \n此外，社区检测与其他图结构元素一样，在设置知识图谱构建的阈值和参数方面还有另一种用途。如果我们期望来自特定领域的紧密关联的摘要集在完整的知识图谱中得到体现，那么它是否出现了？如果没有，也许阈值和使用的方法，例如实体提取和图构建，应该被修改。通常，与文档内容或图试图表示的知识领域的专家或领域专家一起工作，可以帮助知识图谱的数据建模和管道构建。\n\
  \n至此，本章结束。我们已带你了解了创建知识图谱、正确处理数据以及将实体分离到相互连接的社区以查找术语所需了解的一切。\n\n### Summary\n\n本章带你经历了一场过山车式的旅程，了解如何使用强大的\
  \ *igraph* 包开发知识图谱。首先，我们深入探讨了知识图谱构建的数据准备阶段，通过查看如何分离每个 *abstract* 然后将其保存到单独的清理后摘要文件中。\n\
  \n接下来，我们研究了以正确方式设计图模式所需的步骤。这涉及使用流行的 NLP 库 *spacy*，以及我们下载并通过 pip 安装的用于生物医学 NLP 任务的\
  \ *scispacy* 库。在此之后，我们研究了从数据集中提取术语并为包含或排除的实体设置频率边界。\n\n一旦基础工作就绪，我们迅速转向从零开始构建知识图谱。这涉及执行我们在迄今为止的章节中一直在研究的许多关键数据建模任务。此外，我们确保图包含后续分析所需的摘要和术语。\n\
  \n然后我们通过在 `matplotlib` 中创建简单的可视化来进行分析，查看摘要和术语的分布，涉及它们的度中心性（与邻居节点的关联数量）。\n\n这过渡到识别感兴趣的摘要并使用社区检测来识别研究领域。在这里，我们使用了多层社区检测方法，并提出了其他可研究的选项，例如标签传播和随机游走方法。使用社区检测模型，我们能够通过使用该算法将不同的组或集群分开。然后我们查看生成的节点，以查看这些社区节点中包含的具体术语。这随后导致我们为这些社区提取文本实体。\n\
  \n在本章结尾，我们总结了一些关于社区检测和知识图谱的关键要点。这种方法可用于在摘要组之间，或实际上任何其他类型的文档之间发现关系，而你可能并不期望它们存在。\n\
  \n我们希望你觉得本章有用，并且它可以作为你可能想要为其构建知识图谱的项目的蓝图，以及帮助你探索社区检测。\n\n在下一章中，我们将研究如何将图存储在内存中以及如何查询它。\n"
