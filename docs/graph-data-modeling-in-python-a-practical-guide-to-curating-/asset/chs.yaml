- "## Working with Graph Databases\n\n本章向你介绍内存图数据库。我们将向你展示如何使用非常流行的图数据库 Neo4j 的步骤。我们将带你了解如何在自己的机器上下载此软件以使用，并解释为什么\
  \ Python 在尝试大规模部署图数据库和模型时会变得缓慢。在设置阶段之后，我们将探讨如何在该 *in-memory* 图数据库应用程序中创建关系，然后如何使用流行的查询语言\
  \ Cypher 对其进行查询。\n\n然后，我们将研究在 Neo4j 中存储信息的各种方式，并使用 Python 与应用程序交互。我们将稍作偏离，查看 Neo4j\
  \ 的替代方案，例如 Memgraph，以及它们如何使用。但本章的重点主要在 Neo4j，因为它不需要你配置机器以使用 Docker 和微服务。\n\n最后，我们将研究一个用例，说明\
  \ Python 和 Neo4j 如何协同用于大规模和大数据分析，以快速且可重复的方式进行。这将最终利用我们新获得的 Neo4j 和 Python 技能来解决一个现实用例。该任务的用例是使用图网络在城市之间绘制最佳旅行路线，我们将复制在大多数常见映射软件中使用的功能，例如\
  \ Google Maps。\n\n以下是本章将要涵盖的主题：\n- Using graph databases\n- Storing a graph in Neo4j\n\
  - Optimizing travel with Python and Cypher\n- Moving to ingestion pipelines\n\n\
  ### Technical requirements\n\n我们将使用 Jupyter Notebook 运行我们的编码练习，这需要 `python>=3.8.0`，以及以下需要通过\
  \ `pip install` 命令安装到你的环境中的包：\n- `igraph==0.9.8`\n- `geopy==2.3.0`\n- `neo4j==5.5.0`\n\
  \n对于本章，你需要首先执行以下步骤：\n1. 安装 Neo4j Desktop，它是免费的。主要，我们将使用 Neo4j 进行长期图数据库存储，尽管 Neo4j\
  \ Desktop 会同时安装一个桌面图浏览器。要安装 Neo4j Desktop，请前往 `https://neo4j.com/download-center/#desktop`\
  \ 并填写一些详细信息。在安装期间你需要激活密钥，请记下它，并选择适用于你机器的相关操作系统安装程序。\n2. 安装 Neo4j 后，打开 Neo4j Desktop\
  \ 并创建一个新数据库（这可以通过导航到应用程序中的数据库选项卡并使用 **Add** 下拉菜单创建新的本地 DBMS 来实现），使用唯一名称，例如 `Python\
  \ DB`。为本章的目的，使用一个你可以在明文代码中舒适书写的密码——我们将使用 `testpython`。在真实的 Neo4j 设置中，你可能会希望通过加密来屏蔽此密码，但这超出了本章的范围。\n\
  \n这些步骤将在下一节中更详细地介绍，所以现在先等等。\n\n所有包含编码练习的笔记本都可在以下 GitHub 链接获得：`https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH05`。\n\
  \n### Using graph databases\n\n在之前所有的章节中，我们一直在 Python 脚本中将图创建在内存中。这对于分析工作或创建概念验证应用程序来说是可以的，但对于需要扩展的工作流程或长期存储而言，Python\
  \ 和 `igraph` 将不够用。\n\n在涉及图的生产系统中，图数据库充当持久数据存储解决方案。除了保存大量数据外，图数据库通常设计为高效且并发地执行大量读写操作。它们很可能成为任何依赖于大量图数据处理的生产管道的一部分，例如大型在线零售商的推荐系统。\n\
  \n除了保存数据外，图数据库还允许对它们保存的数据进行基本查询。许多这些数据库可以使用至少一种常见的图查询语言进行查询，\n\n\n\n例如 **Cypher**、**GraphQL**\
  \ 或 **Gremlin**。在本章中，我们将使用一些基本的 Cypher 来读写图数据库。Neo4j 提供了大量 Cypher 查询及其用途的列表；请参阅\
  \ https://neo4j.com/developer/cypher/。\n\n值得注意的是，尽管这些查询语言在访问和写入数据方面非常强大，但它们目前还不能提供像\
  \ *igraph* 这样的包所提供的分析和算法的广度。在本章中，我们将把 Python 与图数据库连接起来，以演示 *igraph* 如何用于复杂的分析管道中。\n\
  \n### 将 Neo4j 作为图数据库\n\n我们将在这里使用的图数据库是 Neo4j，这是一个常用的高性能数据库，提供免费的本地版本。可以使用 Cypher\
  \ 查询 Neo4j，在图查询语言中，Cypher 可以说是对新用户最友好的语言，因此非常适合本入门介绍。有关 Cypher 用法的更深入理解，请参阅文档：https://neo4j.com/developer/cypher/。\n\
  \nNeo4j 拥有与我们之前章节中遇到的所有图概念相对应的概念。在 Cypher 文档中，节点仍然称为节点，但边通常被称为关系，而节点和边的属性被称为属性。\n\
  \n我们在异质图中遇到过包含多种节点类型的图，而在 Neo4j 中，这些节点类型具有不同的*标签*。标签在 Cypher 查询语言中被大量用于访问特定的节点和模式；我们将在读写图数据库时回到这个概念。\n\
  \n要启动并运行 Neo4j，我们需要执行以下步骤：\n\n- 1. 可以按照本章*技术需求*部分中的说明安装 Neo4j。这如下面的截图所示：\n\n  ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_109_0.png)\n\
  \n  图 5.1 – Neo4j 数据库设置\n\n- 2. 单击新数据库上的 **Start** 使其运行，示例数据库将被停止，因为 Neo4j 桌面版只支持同时运行一个数据库。现在可以删除示例数据库了。\n\
  \n- 3. Neo4j 桌面版捆绑了 Neo4j Browser。单击我们新创建的数据库旁边的 **Open** 以打开 Neo4j Browser 窗口。我们主要将重点放在使用\
  \ Neo4j 作为数据库的功能上，而不是其以可视化方式显示网络的能力。从这里，我们还可以创建一个新用户，我们将使用该用户的凭据从 Python 访问数据库。在窗口顶部的命令行中，输入以下内容：\n\
  \n  ```\n  :server user add\n  ```\n\n- 4. 将出现一个包含新用户填写字段的窗口。在用户名字段中添加 admin。对于密码，我们同样使用\
  \ testpython。对于角色，从下拉菜单中选择 **admin** 和 **PUBLIC**，这样新用户将拥有对数据库的完全读写访问权限。\n\n- 5.\
  \ 最后，单击 **Add User** 创建我们新的 admin 用户。\n\n现在，Neo4j 已安装，且我们的 Neo4j 数据库已创建并配置好，接下来我们需要学习如何通过\
  \ Cypher 查询语言与之交互。\n\n### Cypher 查询语言\n\nCypher 是一种开源查询语言，兼容包括 Neo4j 在内的多种图数据库。它与\
  \ SQL 等更常见的查询语言有一些相似之处，但它是为图而设计的，而不是为表格数据而设计的。Cypher 的许多设计都围绕着匹配图中的节点和边模式展开，使用一种几乎看起来像绘制网络路径的特殊语法。\n\
  \n当我们想使用 Cypher 引用一个节点时，我们将其括在圆括号中。类似地，为了表示特定的边，我们使用方括号。节点和边用连字符和箭头连接，如下所示：\n\n\
  ```\n(node) - [edge] -> (node)\n```\n\n此模式将匹配图中以有向方式连接到其他节点的节点。在实践中，我们可能会对创建或返回的节点有更具体的要求。\n\
  \n在我们开始直接从 Python 查询 Neo4j 之前，我们可以先在 Neo4j Browser 窗口中执行一些简单的 Cypher 查询。让我们从创建一些节点开始：\n\
  \n- 1. 可以在行首使用 CREATE 函数来指示 Neo4j 创建新节点。要创建名为 Jeremy 的 Person 类型新节点，我们打开圆括号并使用冒号指定节点类型。然后，使用花括号为该节点添加\
  \ name 属性，值为 Jeremy。我们可以按照此模式创建两个 Person 节点：\n\n  ```\n  CREATE (:Person {name:\
  \ \"Jeremy\"})\n  CREATE (:Person {name: \"Mark\"})\n  ```\n\n- 2. 这些节点现在已经添加到数据库中，但目前还没有连接。我们可以使用\
  \ MATCH 函数在数据库中搜索这些节点，然后使用另一个 CREATE 函数来连接它们。这次，我们通过在每个 MATCH 的冒号前添加 Jeremy 和 Mark\
  \ 来为匹配到的节点提供临时变量。然后，我们通过在圆括号中引用它们的变量来创建 Jeremy 和 Mark 之间的新边，并使用 - [:FOLLOWS] ->\
  \ 关系来表示 Jeremy 在社交媒体平台上关注 Mark：\n\n  ```\n  MATCH (jeremy:Person {name: \"Jeremy\"\
  })\n  MATCH (mark:Person {name: \"Mark\"})\n  CREATE (jeremy)-[:FOLLOWS]->(mark)\n\
  \  ```\n\n- 3. 在处理大量数据时，我们可能会遇到重复信息，或者需要更新数据库而不是创建新条目。MERGE 函数就是为了处理这些情况而存在的，它结合了\
  \ MATCH 和 CREATE 的功能。使用 MERGE 时，会进行匹配以检查图数据库中是否已经存在指定的模式。如果存在匹配，则不执行写入操作。如果没有精确匹配，则将模式用于\
  \ CREATE 函数以添加到图中。下面这行代码不会产生效果，因为已经存在一个名为 Jeremy 的 Person 节点：\n\n  ```\n  MERGE\
  \ (:Person {name: \"Jeremy\"})\n  ```\n\n- 4. 但是，如果我们运行这个 MERGE 函数调用，我们将创建一个名为 Sophie\
  \ 的新 Person 节点，因为该节点尚不存在于图中：\n\n  ```\n  MERGE (:Person {name: \"Sophie\"})\n  ```\n\
  \nMERGE 函数也适用于边和更长的路径模式。\n\n- 5. 我们已经介绍了写入 Neo4j 数据库的基础知识，但让我们简要地看一下如何通过读取操作从图中检索信息。我们已经使用了\
  \ MATCH，可以继续使用它来查找符合特定模式和特征的节点或边进行报告。然后，我们可以使用 RETURN 来检索这些信息。以下代码将查找所有 Person 节点并将它们返回到\
  \ Neo4j Browser 窗口：\n\n  ```\n  MATCH (n: Person)\n  RETURN n\n  ```\n\n- 6. 除了访问整个节点，我们还可以使用\
  \ `.` 来访问节点或边属性，就像访问 Python 对象的属性一样。要仅返回图中节点的 name 属性，我们可以运行以下代码：\n\n  ```\n  MATCH\
  \ (n: Person)\n  RETURN n.name\n  ```\n\n- 7. Cypher 还有用于对结果进行基本分析的方法，包括 count()、sum()\
  \ 和 max() 等聚合函数。例如，我们可以如下计算并返回数据库中节点的数量：\n\n  ```\n  MATCH (n)\n  RETURN count(n)\n\
  \  ```\n\n- 8. 最后，我们可以使用 DETACH DELETE 从数据库中删除数据。这里，我们匹配数据库中的所有节点，并删除与它们相连的边，然后再删除节点本身：\n\
  \n  ```\n  MATCH (n) DETACH DELETE n\n  ```\n\nNeo4j 可以通过这种方式用于创建节点和关系，以及查询数据库和检查图的各个部分。然而，在现实世界的案例中，读写操作通常需要由外部进程触发，而不是直接在\
  \ Neo4j Browser 窗口中输入。此外，当数据库中存储的图变得很大时，可视化功能会变得不那么有用，因为无法显示每个节点和边。考虑到实用性，在本章的其余部分，我们将主要从\
  \ Python 与 Neo4j 数据库进行交互。\n\n### 从 Python 查询 Neo4j\n\nNeo4j 安装完成后，我们就可以准备通过 Python\
  \ 连接数据库了。为此，我们将使用 neo4j Python 模块，它包含从 Python 脚本连接数据库并向其发送查询所需的一切。我们将按以下步骤逐步进行：\n\
  \n- 1. 让我们首先为 Python 到 Neo4j 的连接创建一个 driver 对象。我们首先需要从 neo4j 模块导入 GraphDatabase\
  \ 类。然后，要创建 driver，我们需要向 GraphDatabase.driver() 函数提供 uri、username 和 password 参数：\n\
  \n  ```\n  from neo4j import GraphDatabase\n  driver = GraphDatabase.driver(uri='bolt://localhost:7687',\n\
  \      auth=('admin', 'testpython'))\n  ```\n\n  我们的 uri 参数是本地运行的 Neo4j 实例的地址。如果\
  \ Neo4j 数据库托管在单独的服务器上，则应将其替换为相应的互联网协议（IP）地址和端口。我们还已经将以元组形式将数据库的用户名和密码传递给了 auth 参数。\n\
  \n- 2. 现在，我们需要创建一个会话来向 Neo4j 数据库发送查询，使用 driver 对象的 session() 方法：\n\n  ```\n  session\
  \ = driver.session()\n  ```\n\n\n\n\n3. 设置好会话后，我们现在可以查询数据库了。在本例中，我们将在 Neo4j 会话中添加用于创建图关系的查询参数：\n\
  \n```python\nquery = 'CREATE (:Person {name: \"Jeremy\"})-[:FOLLOWS]->(:Person {name:\"\
  Mark\"})'\nresult = session.run(query)\ndriver.close()\n```\n\n这些代码行不会返回任何内容，因为我们对\
  \ Neo4j 数据库执行了写操作。不过，我们可以通过打开 Neo4j 浏览器或使用 Python 中的读取查询来确认操作是否成功。对于这第一个查询，我们将同时演示这两种方法，先从浏览器开始。\n\
  \n4. 回到我们 Python DB 数据库的 Neo4j 浏览器，在窗口顶部的命令行中运行以下查询：\n\n```python\nMATCH (n) RETURN\
  \ n\n```\n\n该查询本质上匹配数据库中的每个节点并将其返回以供查看。我们在 Python 中添加的节点和关系将显示出来：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_113_0.png)\n\
  \n图 5.2 – Neo4j 浏览器结果\n\n5. 另外，我们可以在 Python 中编写读取查询，以确认我们的写操作按预期运行。为了建立会话，我们将使用与之前的写查询相同的代码框架：\n\
  \n```python\ndriver = GraphDatabase.driver(uri='bolt://localhost:7687',\n      \
  \                      auth=('admin', 'testpython'))\n\nsession = driver.session()\n\
  ```\n\n6. 现在，不要向图数据库写入，而是让我们定义两个读取查询。一个查询将匹配图中的所有 Person 节点，而另一个查询将匹配所有 FOLLOWS\
  \ 边：\n\n```python\nnode_query = 'MATCH (n:Person) RETURN n'\nedge_query = 'MATCH\
  \ () -[e:FOLLOWS]->() RETURN e'\n```\n\n7. 现在，我们可以在关闭连接之前运行这两个查询。访问 run() 的 data()\
  \ 方法可将结果转换为更易处理的格式，从而更容易在 Python 中处理：\n\n```python\nnode_result = session.run(node_query).data()\n\
  edge_result = session.run(edge_query).data()\ndriver.close()\nprint(node_result)\n\
  print(edge_result)\n```\n\n打印结果显示，我们有两条 n 的结果，每条结果都包含我们添加的 Person 节点之一。我们还看到找到了一条\
  \ FOLLOWS 边，确认我们的写过程按预期运行。\n\n此时，你可能会注意到，要实现 Python 与 Neo4j 的交互，我们需要经常运行这类查询。因此，我们将创建一个可重用的\
  \ Python 类来处理与数据库的连接和查询，从而无需每次运行查询时都手动连接数据库。\n\n8. 让我们定义一个名为 Neo4jConnect 的 Python\
  \ 类。该类将有一个 __init__ 方法，当 Neo4jConnect 被实例化时，该方法会被自动调用。因为我们总是希望在调用 Neo4jConnect 时连接数据库，所以我们可以在构造函数中处理驱动程序连接，使用提供给该类的\
  \ uri、user 和 password 参数。我们还将在这个类中定义一个 close() 方法来关闭连接。一个 query() 方法将完善这个类，该方法接收一个\
  \ Cypher 查询，并使用已建立的连接执行它，然后返回结果：\n\n```python\nclass Neo4jConnect:\n    def __init__(self,\
  \ uri, user, password):\n        self.driver = GraphDatabase.driver(uri, auth=(user,\
  \ password))\n    def close(self):\n        self.driver.close()\n    def query(self,\
  \ query):\n        session = self.driver.session()\n        result = session.run(query)\n\
  \        return result\n```\n\n9. 让我们通过重新运行之前执行的读取查询来确保我们的类按预期工作。现在，我们可以创建一个 Neo4jConnect\
  \ 类的连接对象，该对象处理认证和驱动程序。现在可以通过访问连接对象的 query() 方法来运行查询，并且可以使用 close() 方法关闭连接：\n\n```python\n\
  connection = Neo4jConnect('bolt://localhost:7687', 'admin', 'testpython')\n\nnode_cypher\
  \ = 'MATCH (n:Person) RETURN n'\nedge_cypher = 'MATCH ()-[e:FOLLOWS]->() RETURN\
  \ e'\n\nnode_result = connection.query(node_cypher).data()\nedge_result = connection.query(edge_cypher).data()\n\
  \nconnection.close()\nprint(node_result)\nprint(edge_result)\n```\n\n打印 node_result\
  \ 和 edge_result 显示的结果与我们之前获得的结果相同，表明我们的类实现正确。在本章的其余部分，我们将继续使用 Neo4jConnect 类来读写\
  \ Neo4j。\n\n接下来，我们将介绍一个图数据库的实际用例，并使用 Python 和 Cypher 查询数据库并执行复杂的分析。\n\n### 在 Neo4j\
  \ 中存储图\n\n搭建好图数据库并编写好与 Neo4j 交互的方法后，我们就可以开始使用 Python 和 Neo4j 来存储和探索图数据了。\n\n在本节中，我们将研究一个美国与加拿大之间的航空旅行网络，并分析其属性以找到两地之间的高效航线。\n\
  \n#### 预处理数据\n\n首先，让我们看一下我们的数据（来源：斯坦福大学：https://snap.stanford.edu/data/reachability.html）。我们有两个文件：reachability_250.txt\
  \ 和 reachability-meta.csv。\n\n如果我们打开 reachability-meta.csv 并查看前几行，我们会看到一份关于美国和加拿大城市的信息列表：\n\
  \n```text\n\"node_id\",\"name\",\"metro_pop\",\"latitude\",\"longitude\"\n0,\"Abbotsford,\
  \ BC\",133497.0,49.051575,-122.328849\n1,\"Aberdeen, SD\",40878.0,45.45909,-98.487324\n\
  2,\"Abilene, TX\",166416.0,32.449175,-99.741424\n3,\"Akron/Canton, OH\",701456.0,40.79781,-81.371567\n\
  ```\n\n该文件包含我们城市节点的节点属性，以节点 ID 为键。我们有城市名称、城市人口以及各自的纬度和经度。这个 CSV 文件可以直接加载到 Neo4j\
  \ 中，因此我们不需要进行任何预处理。\n\n然而，我们的另一个文件 reachability_250.txt 不是 CSV 格式，而 Neo4j 导入时更倾向于\
  \ CSV 格式。打开 reachability_250.txt 并查看前几行，我们可以看到其中包含一个边列表：\n\n```text\n# \n# \n# \n\
  # \n# \n# \n57 0 -84\n113 0 -90\n235 0 -170\n```\n\n根据数据源，该图是有向的。每条边表示两个城市之间的旅行，由节点\
  \ ID 表示。边的权重衡量两个城市之间的旅行时间，其中更负的值表示更远的距离。还有六行信息我们需要移除。\n\n在接下来的步骤中，我们将开始清理和预处理这些数据，使其为图做好准备。\n\
  \n为了将这些信息预处理为可供 Neo4j 导入的格式，我们将其转换为 CSV 格式并移除头部行。我们还可以将距离度量改为非负值，以简化权重。所有这些预处理都可以通过\
  \ Python 的 csv 模块和一些列表推导式来处理，正如我们在前几章中所做的那样：\n\n```python\nimport csv\nwith open('./data/reachability_250.txt',\
  \ 'r') as txt:\n    reader = csv.reader(txt, delimiter=' ')\n    edges = [edge for\
  \ edge in reader][6:]\n    edges = [[edge[0], edge[1], int(edge[2])*-1] for edge\
  \ in edges]\n\nwith open('./data/reachability.csv', 'w', newline='') as c:\n   \
  \ writer = csv.writer(c)\n    for edge in edges:\n        writer.writerow(edge)\n\
  ```\n\n这一次，我们的数据源已经具有合理的图格式，包含一个节点属性文件和一个边列表。该数据源还为我们提供了图模式的信息。图包含有向边，并且这些边始终连接城市，因此它是一个同构图。我们的每个节点的节点属性类型相同，因此这个航空旅行图的模式相当简单：\n\
  \n```text\nnode_id: int (unique)\nname: str\npopulation: int\nlatitude: float\n\
  longitude: float\n```\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_117_0.png)\n\n\
  图 5.3 – 美国和加拿大航空旅行图模式\n\n我们的数据已具备可供 Neo4j 导入的正确格式，航空旅行模式也已确定，接下来我们可以开始在 Neo4j 数据库中创建图。\n\
  \n#### 将节点、边和属性移入 Neo4j\n\n我们将使用 Python 向 Neo4j 数据库写入数据。我们需要先编写一些 Cypher 查询，然后再让\
  \ Python 将它们发送给 Neo4j。\n\n在这个阶段，我们还应该确保 Neo4j 数据库是空的；如果不是，可以在开始之前在 Neo4j 浏览器窗口中运行\
  \ MATCH (n) DETACH DELETE n 查询。\n\n我们的 Cypher 脚本将从 CSV 文件中读取数据，在本地安装的 Neo4j 中，CSV\
  \ 文件应放在 Neo4j 可以访问的特定文件夹中。请按照以下步骤将数据导入 Neo4j：\n\n1. 在 Neo4j 主应用程序窗口（不是当前数据库的浏览器窗口）中，单击我们新建数据库旁边的\
  \ ... 图标。\n2. 然后，选择“打开文件夹”再选择“导入”，以打开操作系统文件浏览器中的 /import 文件夹。\n3. 将 reachability.csv\
  \ 和 reachability-meta.csv 复制到该导入文件夹中。\n\n\n\n\n\n- 4. 现在 Neo4j 可以读取文件了，让我们编写一些 Cypher\
  \ 来访问其内容。我们可以使用 `LOAD CSV WITH HEADERS` 来加载 `reachability-meta.csv` 数据，并且 `as` 函数告诉\
  \ Neo4j 对每一行 csv 运行剩余的代码，其中每一行现在命名为 `row`。头部会被读取并可用于访问对应的 csv 列，我们在 `CREATE` 中引用它们来构建具有正确属性的节点。节点\
  \ ID 和人口数会使用 `toInteger()` 转换为整数，而我们的纬度和经度属性则使用 `toFloat()` 转换为浮点数。从 Neo4j Browser\
  \ 运行时，以下脚本将加载节点属性文件：\n\n```cypher\nLOAD CSV WITH HEADERS from 'file:///reachability-meta.csv'\
  \ as row\nCREATE (city:City {\n    node_id: toInteger(row.node_id),\n    name: row.name,\n\
  \    population: toInteger(row.metro_pop),\n    latitude: toFloat(row.latitude),\n\
  \    longitude: toFloat(row.longitude)\n})\n```\n\n- 5. 接下来，我们将再次使用 Cypher 加载边文件。与我们的节点属性文件不同，`reachability.csv`\
  \ 不包含头部，因此我们使用 `LOAD CSV` 将数据导入 Neo4j。我们的两个 `MATCH` 函数使用切片表示法（例如 `[0]`）来查找我们边对应的节点，以引用\
  \ csv 列。我们也可以使用 Cypher 的 `toInteger()` 函数将我们的节点属性转换为整数，用于匹配和合并。这标识了我们在上一步中加载的节点。然后，`MERGE`\
  \ 步骤在这些节点之间添加一个 `:AIR_TRAVEL` 边，并将 `travel_time` 作为属性从第三个 csv 列添加：\n\n```cypher\n\
  LOAD CSV from 'file:///reachability.csv' as row\nMATCH (from:City {node_id: toInteger(row[0])})\n\
  MATCH (to:City {node_id: toInteger(row[1])})\nMERGE (from)-[:AIR_TRAVEL {travel_time:\
  \ toInteger(row[2])}]->(to)\n```\n\n- 6. 将数据加载到 Neo4j 后，我们现在应该确认其是否符合预期并尝试从 Python\
  \ 访问它。为了在 Python 中执行 Cypher 查询，我们将再次使用本章前面准备的 Neo4jConnect 类。它可以从我们为本章制作的自定义包 `graphtastic`\
  \ 中导入，位于 GitHub 仓库（`https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/blob/main/CH05/`）中，并且可以在\
  \ Python 代码中实现如下：\n\n```python\nfrom graphtastic.database.neo4j import Neo4jConnect\n\
  ```\n\n- 7. 让我们在 Python 中编写一些简单的 Cypher 查询，以测试我们的数据导入是否成功并且我们的图仍然可以访问。如前所述，我们使用\
  \ Neo4jConnect 类建立连接并使用 `connection.query()` 运行一些 Cypher。这里的 Cypher 只是匹配所有节点，并且\
  \ count(n) 将这些节点聚合为一个总和。然后我们可以关闭连接并打印结果：\n\n```python\nconnection = Neo4jConnect('bolt://localhost:7687',\
  \ 'admin', 'testpython')\ncypher = 'MATCH (n) RETURN count(n)'\nresult = connection.query(cypher).data()\n\
  connection.close()\nprint(result)\n```\n\n结果应显示我们的图中有 456 个节点，这与 reachability-meta.csv\
  \ 中的行数相同，减去一行为头部。\n\n- 8. 接下来，让我们确保 Neo4j 中应该存在的一条边已正确添加。我们可以使用与节点计数示例相同的模式从 Python\
  \ 运行 Cypher 查询，但这次使用替代的 Cypher 代码。reachability.csv 第一行的边是在节点 ID 57 和节点 ID 0 之间。这次，为了测试，让我们创建一个包含两个元素的列表来表示这条边。我们将在\
  \ Cypher 查询中引用这些元素：\n\n```python\nedge_test = [57, 0]\n```\n\n- 9. 现在，我们可以将一些 Cypher\
  \ 写成 Python 字符串，它将使用 f-string 替换接受来自 edge_test 的属性。我们可以使用 MATCH 函数匹配整条边，将 n 和 m\
  \ 分配为我们的节点，r 分配为我们的关系。节点属性我们想要匹配的地方使用双大括号，以转义这些区域中 Python 的 f-string 行为。我们想要替换的地方是我们在\
  \ Cypher 查询中引用每个节点的 node_id 属性，使用 edge_test 中的值。然后，我们可以添加一个 RETURN 语句以返回两个节点的名称以及它们之间的旅行时间，作为分配给\
  \ n、m 和 r 的节点和边的属性。由于这里进行的字符串修改量很大，让我们也打印我们的 Cypher 查询，看看 Neo4j 将如何接收它：\n\n```python\n\
  cypher = f'MATCH (n:City {{node_id:{edge_test[0]}}})' \\\n    '-[r:AIR_TRAVEL]->'\
  \ \\\n    f'(m:City {{node_id:{edge_test[1]}}})' \\\n    'RETURN n.name, m.name,\
  \ r.travel_time'\n\nprint(cypher)\n```\n\n- 10. f-string 替换和转义字符将被解析为有效的 Cypher\
  \ 查询，准备发送到 Neo4j。我们可以以与之前相同的方式发送此查询：\n\n```python\nconnection = Neo4jConnect('bolt://localhost:7687',\
  \ 'admin', 'testpython')\nresult = connection.query(cypher).data()\nconnection.close()\n\
  print(result)\n```\n\n从 print 语句中，你应该会看到我们匹配到一条边，从 Calgary, AB 到 Abbotsford, BC，旅行时间为\
  \ 84。尝试更改 edge_test 中的节点 ID 并重新运行，以检查 reachability.csv 中存在的更多边。\n\n此时，你可能开始看到使用\
  \ Python 和 Cypher 并行带来的一些强大功能，其中 Cypher 中的条件和参数可以通过使用 f-string 或其他字符串替换方法动态设置。当然，这不仅在检查数据是否正确摄取时有用，而且在\
  \ Python 中的下游分析和管道构建中也很有用。在本章的剩余部分，我们将使用这些方法在 Cypher 和 igraph 中进行一些静态分析，使用从 Neo4j\
  \ 流式传输的数据。我们将在第 6 章《Pipeline Development》中重点关注涉及 Neo4j 和 Python 的数据摄取和分析管道。\n\n\
  ### 使用 Python 和 Cypher 优化旅行\n\n我们的图已完全加载到 Neo4j 中，并且我们已设置使用 Cypher 和 Python 查询数据的方法，我们现在可以执行更复杂的分析。在本节开始时，我们将使用\
  \ Cypher 回答问题并在 Python 中返回答案。稍后，我们将通过从 Neo4j 采样图数据并在 igraph 中处理样本来进行更复杂的分析。\n\n\
  让我们首先深入了解我们图的<|message|>\n\n- 1. 我们将运行的第一个查询将找出城市中人口最高者，并返回城市名称和城市人口作为结果。ORDER BY\
  \ 将按这些节点（n）的<|message|>\n\n```python\ncypher = 'MATCH (n) ' \\\n    'RETURN n.name,\
  \ n.population ' \\\n    'ORDER BY n.population ' \\\n    'DESC LIMIT 1'\nconnection\
  \ = Neo4jConnect('bolt://localhost:7687', 'admin', 'testpython')\nresult = connection.query(cypher).data()\n\
  connection.close()\nprint(result)\n```\n\n- 2. 我们的结果显示人口最高的城市是纽约。我们可以向我们的图提出另一个简单的问题，即我们可以从纽约以相对较短的旅行时间飞往哪些城市。对于此，我们可以利用\
  \ WHERE 函数，其效果与 SQL 中的对应函数非常相似。在 MATCH 语句之后使用时，我们可以在返回容易从纽约到达的城市名称之前，使用 WHERE 函数按其旅行时间属性过滤匹配的节点。像往常一样，我们然后使用\
  \ Python 将查询执行到 Neo4j 数据库：\n\n```python\ncypher = 'MATCH (n:City {name: \"New York,\
  \ NY\"}) ' \\\n    'MATCH (n) -[r:AIR_TRAVEL]->(m) ' \\\n    'WHERE r.travel_time\
  \ < 100 ' \\\n    'RETURN m.name'\n\nconnection = Neo4jConnect('bolt://localhost:7687',\
  \ 'admin', 'testpython')\nresult = connection.query(cypher).data()\nconnection.close()\n\
  \nprint(result)\nprint(len(result))\n```\n\n这些第一次分析相当简单，可以使用关系数据库实现。让我们现在转向一些最好用图数据结构和图数据库解决的问题，例如计算路径。\n\
  \n我们的图包含美国和加拿大城市之间的航班，但要进行一些旅程，需要进行中转，途中涉及停靠。作为示例，让我们看看我们如何可能从加州圣地亚哥一路向北前往纽芬兰的圣约翰。\n\
  \n- 3. 我们将开始，如许多 Cypher 查询一样，使用 MATCH 语句。首先，我们匹配感兴趣的城市，以找到它们对应的节点。接下来，我们使用 [*..3]\
  \ 通配符匹配这些节点之间的路径，代替特定的边或边类型。此表示法允许匹配从起始节点 n 开始长达三跳的路径。我们还将这些匹配的整个路径分配给变量 p。我们需要做的最后一步是返回路径\
  \ p，以及使用 relationships(p) 的关系详细信息并将其映射到 rels 变量：\n\n```python\ncypher = 'MATCH (n:City\
  \ {name: \"San Diego, CA\"}) '\\\n    'MATCH (m:City {name: \"St. John's, NL\"})\
  \ '\\\n    'MATCH p=(n)-[*..3]->(m) ' \\\n    'RETURN p, relationships(p) as rels'\n\
  \nconnection = Neo4jConnect('bolt://localhost:7687', 'admin', 'testpython')\nresult\
  \ = connection.query(cypher).data()\nconnection.close()\n```\n\n\n```\n```python\n\
  print(result)\nprint(len(result))\n```\n```\n\n在下一节中，我们将扩展这部分内容，研究如何围绕选择哪条路线提出旅行建议。这是一个更复杂的问题，但幸运的是，我们可以使用\
  \ Dijkstra 算法（https://isaaccomputerscience.org/concepts/dsa_search_dijkstra?examBoard=all&stage=all）。这将在接下来的部分中加以说明。\n\
  \n### 旅行推荐\n\n许多处理旅行推荐和优化的系统都会在后台使用图技术。当你使用 Uber 这样的打车应用时，系统会计算起点和终点之间的优化路径，并考虑交通状况、限速以及任何其他可能影响行程的因素。在这个例子中，这些参数可以看作是边的权重，道路交叉口则是节点。系统会综合考虑行程中各路段的距离，或通过每个路段所需的时间，从而高效地将你从\
  \ A 点送到 B 点。\n\n在我们的数据集中，包含了美国和加拿大城市之间的航空旅行信息，包括以时间单位衡量的城市间旅行时间。这些信息可以像前一个例子中公路旅行那样使用，以找出城市之间最高效的航空旅行路线。\n\
  \n为了抽象这个问题，我们可以研究一种经典的图论方法，许多旅行优化解决方案都可能使用这种方法。Dijkstra 算法通常用于在加权图中寻找优化路径。\n\n我们可以用一个简单的例子来演示\
  \ Dijkstra 算法。在*图 5.3*中，如果我们要从城市 A 到城市 D，就需要规划一条经停多个城市的路线。步数最少的路线是从 A 到 C，再到目的地\
  \ D。乍一看，这似乎是最有效的，因为这条路径的长度最短。然而，将所经过边的旅行时间权重相加，总和为 176。另一方面，走一条不同的路线，从 A 到 B，再到\
  \ C，最后到 D，总旅行时间为 127，尽管步数更多，但总时间更短：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_123_0.png)\n\
  \n### \n\n为了在我们所选的城市之间找到最快路径，让我们回到使用 Python 和 igraph。第一阶段是将最近一次 Cypher 查询得到的结果解析为更适合在\
  \ Python 中处理的格式。使用 igraph 时，请记住我们需要为每个节点定义节点属性列表、边列表和 igraph ID。这可以通过以下步骤来实现：\n\n\
  - 1. 回顾一下，我们查找圣迭戈（San Diego）和圣约翰斯（St. John's）之间路径的查询，返回了路径和关系。我们可以先用列表推导式将查询结果中的路径分离出来，从之前由\
  \ query.data() 返回的字典中提取 p 的结果：\n```\npaths = [path['p'] for path in result]\n```\n\
  \n- 2. 路径列表中的每条路径都包含节点和分隔相邻节点的 [:AIR_TRAVEL]。出于定义节点属性列表和 ID 的目的，我们不需要有关节点邻接性或 [:AIR_TRAVEL]\
  \ 字符串的任何信息。因此，我们可以使用带有 if 语句的双重列表推导式，将路径展平为节点列表：\n```\nnodes = [node for path in\
  \ paths for node in path if node != 'AIR_TRAVEL']\n```\n\n3. 这个节点列表现在包含重复节点，即出现在多条路径中的节点。让我们使用一个巧妙的临时字典推导式创建一个临时字典，其中键是节点\
  \ ID，以过滤掉重复节点。.values() 方法会将我们的节点转换回字典节点对象列表：\n```\nnode_attributes = {node['node_id']:node\
  \ for node in nodes}.values()\n```\n\n4. 现在我们可以生成节点属性列表，将其添加到用于旅行时间图的属性集中。我们还可以创建一个字典，包含新生成的\
  \ igraph 递增整数 ID，并使用 enumerate() 将这些 ID 映射到原始 node_ids，正如我们在前几章中所做的那样。以下代码可以帮助我们实现这一点：\n\
  ```\nnode_ids = [node['node_id'] for node in node_attributes]\nnames = [node['name']\
  \ for node in node_attributes]\npopulations = [node['population'] for node in node_attributes]\n\
  latitudes = [node['latitude'] for node in node_attributes]\nlongitudes = [node['longitude']\
  \ for node in node_attributes]\nigraph_ids = {node['node_id']: i for i, node in\
  \ enumerate(node_attributes)}\n```\n\n5. 设置好节点属性和 igraph 节点 ID 后，现在该创建边列表了。边存在于我们从\
  \ Neo4j 的 query.data() 结果中提取的路径中，其中相邻节点由 :AIR_TRAVEL 字符串分隔。可以通过访问结果中的 rels 提取距离：\n\
  ```\ntravel_time_paths = [path['rels'] for path in result]\nprint(travel_time_paths)\n\
  ```\n\n6. 现在，下一步是从每条路径中提取相邻节点，并分配对应的 travel_time 边属性。这是一个更复杂的操作，因此将在一个 for 循环中完成。\n\
  \n7. 首先，我们为 edge_list 和 edge_attributes 创建空列表。在一个 for 循环中，我们将遍历 zip 打包后的 paths 和\
  \ travel_time_paths，这两个列表长度相同。对于每条路径，我们将获取 node_id 属性并删除 AIR_TRAVEL 字符串，从而得到一个仅包含节点\
  \ ID 的路径。我们对旅行时间也做同样的处理，得到一个边属性列表。接下来，我们使用 zip() 将 clean_path 与其自身进行 zip 打包，并使用\
  \ [1:] 偏移 1，从而生成表示每条边的节点对。然后，我们再用 zip() 将它与旅行时间打包，此时旅行时间的长度将与我们生成的边数相同。最后，我们可以遍历这个\
  \ zip() 对象，将每条边追加到边列表，并以同样的方式在对应索引处添加旅行时间。这样可以确保我们后续能够以列表方式向 igraph 添加边属性：\n```\n\
  edge_list = []\nedge_attributes = []\nfor path, times in zip(paths, travel_time_paths):\n\
  ```\n\n```\nclean_path = [node['node_id'] for node in path if node != 'AIR_TRAVEL']\n\
  \    travel_times = [rel['travel_time'] for rel in times]\n    for n, time in zip(zip(clean_path,\
  \ clean_path[1:]), travel_times):\n        edge_list.append([igraph_ids[n[0]], igraph_ids[n[1]]])\n\
  \        edge_attributes.append(time)\n```\n\n8. 准备好节点属性、边列表和边属性后，我们现在可以创建图了。和往常一样，我们使用\
  \ igraph.Graph() 创建一个空白图，并在本例中指定 directed=True。在这个例子中，指定有向图尤为重要，因为往返两个城市之间的旅行时间可能因方向不同而有所差异。接下来，我们将\
  \ add_vertices() 设置为 node_ids 的数量，并添加相应的节点属性。然后，我们使用 add_edges() 添加边，并以与添加节点属性相同的方式为这些边添加边属性：\n\
  ```\nimport igraph\ng = igraph.Graph(directed=True)\ng.add_vertices(len(node_ids))\n\
  g.vs['node_id'] = node_ids\ng.vs['name'] = names\ng.vs['population'] = populations\n\
  g.vs['latitude'] = latitudes\ng.vs['longitude'] = longitudes\ng.add_edges(edge_list)\n\
  g.es['travel_time'] = edge_attributes\n```\n\n现在，我们的图已在 Python 中组装完成，表示从圣迭戈到圣约翰斯的路径所构成的子图。让我们查看一些边，确认这些边在\
  \ Neo4j 中同样存在，并且我们的代码已按预期工作。\n\n9. 我们可以通过列表推导式访问每条边中的 g.vs[edge.source]['node_id']\
  \ 和 g.vs[edge.target]['node_id']，以及每条边的 travel_times，从而打印相邻节点 ID（与 Neo4j 中的一致）的边。打印结果将向我们展示一个应存在于\
  \ Neo4j 中的边列表：\n```\nprint([[g.vs[edge.source]['node_id'], g.vs[edge.target]['node_id'],\
  \ edge['travel_time']] for edge in g.es])\n```\n\n10. 我们选择节点 ID 294 和节点 ID 401 之间的一条边，并在\
  \ Neo4j Browser 中运行一个小查询（转到 Neo4j Browser，运行以下 Cypher 语句）来确认它存在于 Neo4j 数据库中。我们可以简单地匹配这些节点之间的路径并返回节点，以确认我们的\
  \ Neo4j 到 Python 的 igraph 代码已按预期工作。现在让我们前往 Neo4j Browser 并执行这条 Cypher 语句：\n```\n\
  MATCH (n:City {node_id:294})-[:AIR_TRAVEL]->(m:City {node_id:401})\nRETURN n, m\n\
  ```\n\n\n\n\n11. 回到 Python，现在我们准备在 igraph 中进行更复杂的分析，找出从圣地亚哥到圣约翰斯的最短出行方式。在建立好图之后，用代码实现其实相当简单。我们可以先用\
  \ `g.vs.select()` 指定要查找路径的节点，并将其命名为 source 和 target。要运行 Dijkstra 算法，我们可以在源城市和目标城市之间调用\
  \ igraph 的 `get_shortest_paths()` 方法。只要将权重参数指定为 `travel_time`，igraph 就会在路径计算中将出行时间作为边的权重，并返回最小距离路径：\n\
  \n```\nsource = g.vs.select(name_eq='San Diego, CA')\ntarget = g.vs.select(name_eq='St.\
  \ Johns, NL')\nshortest_path = g.get_shortest_paths(source[0], target[0], weights='travel_time')\n\
  ```\n\n12. `get_shortest_paths()` 的结果将包含 igraph 的整数 ID，因此让我们获取路径中这些节点对应的每个城市的名称并查看：\n\
  \n```\nshortest_path = [g.vs[node]['name'] for node in shortest_path]\nprint(shortest_path)\n\
  ```\n\n13. 我们可以看到，在出行时间方面最优的路径是经由芝加哥，然后到蒙特利尔。要获取每一步的距离，我们可以在 `get_shortest_paths()`\
  \ 中指定一个可选参数 `output='epath'`，它会返回边的 ID。然后，我们可以用列表推导式访问这些边 ID 关联的出行时间并查看。我们还可以进行求和以找出总出行时间：\n\
  \n```\nshort_path_rels = g.get_shortest_paths(source[0], target[0], weights='travel_time',\
  \ output='epath')\nshort_path_distances = [g.es[edge]['travel_time'] for edge in\
  \ short_path_rels]\nprint(short_path_distances)\nshortest_travel_time = sum(short_path_distances[0])\n\
  print(shortest_travel_time)\n```\n\n因此，我们可以使用这种方法在我们的数据集中找到城市之间的最优出行路线。然而，如果我们想查看边的其他特征来推荐城市之间的特定路径呢？例如，节点之间的物理距离可能是个关注点。同样，计算这个更适合用\
  \ Python 而不是图数据库，所以让我们看看如何实现。\n\n14. 我们可以首先通过访问 `g.es` 和 `g.vs` 并执行推导式来从 igraph\
  \ 图中提取边以及纬度和经度。我们将使用节点 ID 将节点与对应的边匹配：\n\n```\nedges = [[g.vs[edge.source]['node_id'],\
  \ g.vs[edge.target]['node_id']] for edge in g.es]\nlatitudes = {node['node_id']:\
  \ node['latitude'] for node in g.vs}\nlongitudes = {node['node_id']: node['longitude']\
  \ for node in g.vs}\n```\n\n15. 接下来，我们需要一个函数根据纬度和经度计算距离。让我们定义一个函数 `find_distances()`，它将接收一个边列表以及两个字典\
  \ `latitudes` 和 `longitudes`，每个字典以节点 ID 为键。我们可以使用 geopy 模块导入 `geodesic()`，它会计算两个经纬度坐标点之间的距离。对于每条边，我们为\
  \ source 和 target 分别构造一个包含纬度和经度的元组，即 `loc_1` 和 `loc_2`。我们可以使用 `geodesic()` 并将这些点作为参数来计算距离，然后通过访问\
  \ `km` 属性将距离转换为千米。每对连接节点之间的距离被追加到一个列表中并返回：\n\n```\nfrom geopy.distance import geodesic\n\
  def find_distances(edges, latitudes, longitudes):\n    distances = []\n    for n,\
  \ m in edges:\n        loc_1 = (latitudes[n], longitudes[n])\n        loc_2 = (latitudes[m],\
  \ longitudes[m])\n        distance = geodesic(loc_1, loc_2).km\n        distances.append(int(distance))\n\
  \    return distances\n```\n\n16. 现在，我们可以在准备好的边、纬度和经度上调用我们的方法，并使用 `g.es` 将距离应用到图中的每条边：\n\
  \n```\ndistances = find_distances(edges, latitudes, longitudes)\ng.es['distance']\
  \ = distances\n```\n\n17. 将距离添加到 igraph 后，我们可以使用与之前相同的过程，找到圣地亚哥和圣约翰斯之间在物理距离方面的最短路径：\n\
  \n```\nsource = g.vs.select(name_eq='San Diego, CA')\ntarget = g.vs.select(name_eq='St.\
  \ Johns, NL')\nshortest_path = g.get_shortest_paths(source[0],\n    target[0], weights='distance')\n\
  shortest_path = [g.vs[node]['name'] for node in shortest_path]\nprint(shortest_path)\n\
  short_path_rels = g.get_shortest_paths(source[0],\n    target[0], weights='distance',\
  \ output='epath')\nshort_path_distances = [g.es[edge]['distance'] for edge in short_path_rels]\n\
  print(short_path_distances)\nshortest_travel_time = sum(short_path_distances[0])\n\
  print(shortest_travel_time)\n```\n\n这给了我们一个不同的答案，路径是经过芝加哥再到多伦多。\n\n在旅行推荐系统中，客户可能对其拟议旅行路线的其他特征感兴趣。在物理距离受关注的场景中，我们可能希望预先计算这些距离并将它们添加到服务于\
  \ Web 应用的图数据库中。\n\n这样，每次进行推荐时就不必重新计算它们。我们可以为美国和加拿大的航空旅行图做到这一点，方法是先用一些简单的 Cypher\
  \ 从 Neo4j 数据库中提取所有边、节点、纬度和经度，然后对这些查询运行 Neo4j：\n\n```\nedges_cypher = 'MATCH (n)-[:AIR_TRAVEL]->(m)\
  \ \\\n' 'RETURN n.node_id, m.node_id'\nnodes_cypher = 'MATCH (n) \\\n' 'RETURN n.node_id,\
  \ n.latitude, n.longitude'\nconnection = Neo4jConnect('bolt://localhost:7687', 'admin',\
  \ 'testpython')\nedges = connection.query(edges_cypher).data()\nlat_longs = connection.query(nodes_cypher).data()\n\
  connection.close()\n```\n\n18. 然后，我们可以使用类似于子图示例的方法来计算所有边的物理距离，并重用我们自定义的 `find_distances()`\
  \ 方法。这些可以写入 CSV 文件，准备导入 Neo4j：\n\n```\nedges = [[edge['n.node_id'], edge['m.node_id']]\
  \ for edge in edges]\nlatitudes = {node['n.node_id']: node['n.latitude'] for node\
  \ in lat_longs}\nlongitudes = {node['n.node_id']: node['n.longitude'] for node in\
  \ lat_longs}\ndistances = find_distances(edges, latitudes, longitudes)\ndistances\
  \ = list(zip(edges, distances))\nimport csv\nwith open('chapter05/data/distances.csv',\
  \ 'w', newline='') as c:\n    writer = csv.writer(c)\n    for edge in distances:\n\
  \        writer.writerow(edge)\n```\n\n19. 现在，就像我们之前首次在 Neo4j 中组装图时那样，我们可以将生成的 `distances.csv`\
  \ 文件移动到 Neo4j 的导入文件夹中。使用我们在本章中学到的知识，一些简单的 Cypher 就能将所有新的距离边属性导入 Neo4j。这里唯一的新函数是\
  \ `SET`，它为指定的节点或边更新给定的特征：\n\n```\nLOAD CSV from 'file:///distances.csv' as row\n\
  MATCH (n:City {node_id: toInteger(row[0])})\nMATCH (m:City {node_id: toInteger(row[1])})\n\
  MATCH (n)-[r:AIR_TRAVEL]->(m)\nSET r.distance = toInteger(row[2])\n```\n\n现在，让我们进入下一节！\n\
  \n### 进入摄取管道\n\n在本章中，我们创建了一个静态的 Neo4j 图，对其进行了查询和分析，并更新了其特征。这类解决方案可能会在生产环境中使用，用于在应用程序中提供结果。\n\
  \n然而，这类流程中还有一些我们尚未涵盖的元素。在生产系统中，节点和边可能会定期以小块的形式读写到图数据库中。复杂处理可能会在数据摄取之前使用 Python 或其他语言在\
  \ Neo4j 之外进行。想一想真正的旅行优化或推荐服务实际会提供多少选项——每一个都必须嵌入到图数据库管道中。\n\n在第 6 章“管道开发”中，我们将看一个复杂图数据管道的示例，并探讨如何使其可靠且高效。\n\
  \n### 总结\n\n我们在本章中涵盖了大量内容，现在你应该对内存数据库（如 Neo4j）的强大之处有了很好的理解。我们开始求知之旅时，先了解了如何设置 Neo4j\
  \ 实例，在那里我们完成了所有配置，安装了本地版本的 Neo4j 并快速启动运行。\n\n接下来，我们了解了如何使用一种名为 Cypher 的查询语言对 Neo4j\
  \ 数据库执行查询。对你们中的一些人来说，这可能是第一次接触 Cypher，我们向你介绍了这种语言如何与其他查询语言（如 SQL）相似。为了更好地理解如何使用\
  \ Cypher，Neo4j 网站（https://neo4j.com/developer/cypher/）是一个很好的资源。\n\n更进一步，我们开始研究如何结合使用\
  \ Cypher 和 Python 的 cypher 包在 Neo4j 图数据库中存储数据，从而开始与图数据库进行交互。\n\n最终，我们探索了一个用例：推荐最佳的出行路线，并分析两点之间的最优路径。在这里，我们介绍了\
  \ Dijkstra 算法（https://isaaccomputerscience.org/concepts/dsa_search_dijkstra?examBoard=all&stage=all），并用它来计算两点之间的最短路径。这模拟了你日常使用的管道和应用程序，例如\
  \ Google 地图或 Uber 的路线规划系统。在这里，你亲手实践了 Python、Cypher、igraph 和 Neo4j。可以说，为了在高潮中结束，我们接着开始解释在下一章中我们将如何扩展摄取管道，并将拓展本章中提供的示例。\n\
  \n自从第一章以来，你已经取得了长足的进步，所以恭喜你走到这里。我们期待在下一章中带你学习如何创建可用于生产的图管道，这将是下一章的重点。\n\n\n\n\n\n\
  对于本章，你还需要安装 Neo4j Desktop。请参阅 *第 5 章，操作图数据库* 中的 *技术要求* 部分，如果尚未安装 Neo4j，因为本章的教程需要跟随时使用它。\n\
  \n所有包含编码练习的笔记本，均可在以下 GitHub 链接获取：https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH06。\n"
- "## 图管道开发\n\n在上一章中，我们学习了如何将 Python 与 Neo4j 数据库进行接口。我们利用 Neo4j 的长期图存储解决方案，搭建了一个更真实、更接近生产环境的系统，可以根据多个参数查询航空旅行路线。\n\
  \n我们通过使用静态查询向其中写入大量数据来设置图数据库。在设置数据库时，我们知道想要存储什么数据，并编写了 Cypher 查询以批量导入数据。 resulting\
  \ 图的重点在于向例如前端 Web 应用程序提供读取查询结果。这些读取查询仅在我们对数据提出问题时才针对数据库执行。\n\n然而，实际上，这些图数据库系统通常作为应用程序的后端，为应用程序频繁且自动地向图数据库发送查询提供服务。这些查询可能不仅由直接用户行为驱动，还可能被执行以被动收集和计算信息。\n\
  \n例如，考虑一家金融服务公司如何存储金融交易图，以便寻找可疑活动。对于这种用例，公司希望在活动发生时检测可疑行为，而不是等待批量数据上传，到那时欺诈活动可能已经发生。在这种情况下，很可能在图数据库（如\
  \ Neo4j）之外存在数据管道中的组件，通过小查询进行交互，以便写入数据并寻找感兴趣的模式。\n\n就写入查询而言，与上一章中批量写入图不同，来自许多用户的小信息事务可以同时写入图。在图数据库中，对于以这种方式运行的系统，有一些额外的注意事项，我们将在本章中介绍。\n\
  \n在以下各节中，我们将设置一个新的 Neo4j 图数据库，并查看如何处理大量小的读取和写入查询，通过模拟在线零售商的用户和用户交互。像以前一样，我们将使用 Neo4j\
  \ 和 Python 来实现这一点，充分利用各自的优势。\n\n### 零售图数据库\n\n在本节中，我们将设计一个后端系统来处理由 Web 应用程序或移动应用程序产生的请求。在一个实际示例中，我们将探讨将零售商入驻以向客户提供产品推荐所需的方法。我们将为一家在线电子产品零售商构建后端数据库，客户可以在其中浏览、比较和购买产品，同时获得他们可能感兴趣的查看推荐。\n\
  \n对于这个复杂系统，就像生产数据库设置一样，我们需要考虑几个元素以及它们如何交互。我们需要初始化一个图数据库以接受查询并模拟与应用程序的交互，从而触发对数据的查询。\n\
  \n### 设计模式和管道\n\n让我们一次解决我们需要设置的一个个元素。对于我们的后端系统，我们需要一个图数据库，因此第一阶段是设置一个新的空白 Neo4j\
  \ 数据库。\n\n#### 设置新数据库\n\n正如我们在第 5 章《操作图数据库》中所做的那样，让我们启动 Neo4j Desktop。一旦加载桌面，我们需要按照以下步骤添加新数据库：\n\
  \n1. 在主 Neo4j 窗口中，选择 Add，并选择 Local DBMS。\n2. 为新数据库选择一个名称，例如 Store DB。\n3. 使用一个通用密码，例如\
  \ testpython。我们将在本示例的开放代码中使用此密码，因此请确保不要使用敏感的密钥短语。在真实的生产系统中，任何由第三方脚本所需的对该数据库的身份验证很可能使用密码密钥系统，以防止此密码以明文和代码形式暴露。\n\
  4. 接下来，单击 Create，并等待新图数据库创建完成。\n5. 一旦图数据库创建完成，请确保你可以通过 Neo4j Desktop 连接到它，方法是单击新数据库名称旁边的\
  \ Start。数据库将显示为 Starting。再次等待数据库加载，然后单击 Open，以打开一个新的 Neo4j Browser 窗口，连接到我们的新数据库。\n\
  6. 我们需要创建一个新的管理员用户，以便从 Python 访问图数据库。在窗口顶部的 Neo4j 命令行中，运行以下命令：\n\n```\n:server user\
  \ add\n```\n\n7. 在 resulting 窗口中，添加用户名和密码。对于我们的示例，我们将再次使用 admin 作为用户名，testpython\
  \ 作为密码。对于此密码与数据库密码相同：不要使用你在开放代码中输入会不舒服的密码（如果提交到 GitHub 等存储库，则会以强类型且对所有人可见的形式出现）。\n\
  8. 接下来，从下拉角色列表中添加用户角色 PUBLIC 和 admin。然后，选择 Add user 以创建管理员用户。我们稍后将使用这些凭据访问数据库。\n\
  \n数据库设置完成后，我们现在需要决定要存储什么类型的数据。第一阶段，如同往常一样，是考虑并设计模式。\n\n#### 模式设计\n\n我们希望在客户身上保存什么数据？什么可以帮助我们向他们推荐产品？\n\
  \n让我们看看我们的在线电子产品零售商销售的产品。我们可以通过打开 `products.csv` 并检查前几行来大致了解我们拥有的信息：\n\n| productID\
  \ | name | brand | mainType | subType |\n|-----------|------|-------|----------|---------|\n\
  | 1001 | WX100 In-ear Headphones | Hans | Audio | Bluetooth Headphones |\n| 1002\
  \ | WX-B210 Bluetooth Headphones | Hans | Audio | Bluetooth Headphones |\n| 1003\
  \ | Hans-3 Bluetooth Headphones | Hans | Audio | Bluetooth Headphones |\n| 1004\
  \ | J9 Bluetooth Headphones | JLB | Audio | Bluetooth Headphones |\n| 1005 | J8-I\
  \ In-ear Headphones | JLB | Audio | Bluetooth Headphones |\n| 1006 | J-Basics Wired\
  \ Headphones | JLB | Audio | Wired Headphones |\n\n从此数据的结构来看，我们的零售商当前提供的每种产品都列在单独的\
  \ CSV 行上。我们为每种产品都有产品 ID、名称和产品品牌。我们还有每个产品的分类级别，位于 `mainType` 和 `subType` 列中。因此，我们有三种不同类型的实体需要保存在我们的图中，可以由节点类型\
  \ Product、Brand 和 Type 表示。每个唯一产品都有一个类型和一个品牌，我们可以用命名边 `HAS_TYPE` 和 `HAS_BRAND` 分别表示。\n\
  \n对于每个主要类型，有几种产品子类型。我们可以将这些描述性类别视为一种本体论，我们在 *第 4 章，构建知识图谱* 中更深入地探讨了这一概念，我们在那里处理了知识图谱。在这种情况下，我们可以考虑在图中将子类型连接到产品的主要类型，并以不同的粒度表示产品类别。一种方法是在子类型和主要类型之间创建更多\
  \ `HAS_TYPE` 关系。\n\n这些数据将构成我们数据库的骨干，包含产品、品牌及其类型之间的链接。我们的图模式将在我们考虑不同元素时发展，并变得更加复杂，但首先，让我们为仅产品设计一个数据模型：\n\
  \n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_135_0.png)\n\n*图 6.1* 说明了我们产品的模式，但我们可能也想存储客户信息。我们可以通过跟踪他们的过去购买来了解客户对哪些类型产品感兴趣。要存储客户，我们需要为每个客户提供唯一的客户\
  \ ID，以及存储有关他们的其他有用信息，例如姓名和地址。\n\n要存储这些特征，我们可以创建客户节点，其中 **ID**、**name** 和 **address**\
  \ 作为节点属性。对于购买，我们可以创建与产品的关系。对于每次购买，我们可以在边上存储 **date** 和 **time**，以区分同一客户对同一商品的多次购买。\n\
  \n\n\n\n\nFigure 6.2 shows an extended schema, containing both product and customer\
  \ information:\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_136_0.png)\n\nFigure\
  \ 6.2 – Adding customer purchases to the graph schema\n\nRepresenting all the features\
  \ of our products, and the features of customers that interact with them, results\
  \ here in a directed heterogeneous graph. The fact that customers can make multiple\
  \ purchases of the same item will result in the potential for more than one edge\
  \ between a pair of nodes, meaning that our network is classed as a multigraph.\n\
  \nThe information in our graph schema is such that if we want to find what types\
  \ or brands of products a customer tends to purchase, we can traverse paths in our\
  \ graph to find an answer. We will come back to this idea later, when making product\
  \ recommendations. We may also want to add to this schema later, to capture additional\
  \ information about our customers. Thankfully, a heterogeneous graph schema is more\
  \ flexible than a relational database, as we explored in Chapter 1, Introducing\
  \ Graphs in the Real World, and allows for additional types of nodes and edges to\
  \ be added when required, without affecting the data currently modeled.\n\nNow that\
  \ we have a plan for representing data in our graph database, we can start to create\
  \ processes to store it.\n\n### Adding static product information\n\nAs we mentioned\
  \ previously, the products on offer in our online store will form the backbone of\
  \ our graph data. We have a list of products already on offer, as well as extra\
  \ information on them, in products.csv.\n\nTo get started, let’s populate our graph\
  \ database with product information:\n\n1. Neo4j can easily access data in a given\
  \ database’s import folder, so let’s first move `products.csv` (this will be stored\
  \ in the supporting GitHub repositories data folder at `https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH06/data`)\
  \ to that location. From the main Neo4j Desktop window, click the three dots … next\
  \ to **Store DB**, or whatever name you have used for this chapter’s database.\n\
  \n2. From the pop-up list, choose **Open folder**, then click on **Import**. This\
  \ will open the database’s import folder in the file browser of your operating system.\
  \ Copy and paste, or drag `products.csv` into this folder to give Neo4j access to\
  \ it in Cypher queries.\n\n3. With our data in the correct location, we can start\
  \ to think about how to turn this tabular CSV into nodes and edges, according to\
  \ the graph schema we have specified. For the initial transfer of data, we can use\
  \ the Neo4j Browser and the command line, by opening up the Browser window for our\
  \ **Store DB** database.\n\n4. Next, let’s write some Cypher to load this data.\
  \ As we did in *Chapter 5, Working with Graph Databases*, we can use the `LOAD CSV\
  \ WITH HEADERS` function to read our data into Neo4j. We specify the filename and\
  \ location in the `/import` folder by using `FROM 'file:///products.csv'`, and read\
  \ one line at a time with `AS row`.\n\n5. From there, we start to add nodes to our\
  \ graph with `MERGE`. We add nodes with the Product, Brand, and Type types, and\
  \ add their node attributes using the `row.column` syntax. We use the aliases `p`,\
  \ `b`, `m`, and `s` for each type of node added or matched with `MERGE` in order\
  \ to easily add edges next. We can use even more `MERGE` functions to now add the\
  \ `HAS_BRAND` and `HAS_TYPE` relationships, including the relationships between\
  \ the main types and sub-types:\n\n```cypher\nLOAD CSV WITH HEADERS FROM 'file:///products.csv'\
  \ AS row\nMERGE (p:Product {productID: toInteger(row.productID), name: row.name})\n\
  MERGE (b:Brand {brandName: row.brand})\nMERGE (m:Type {typeName: row.mainType})\n\
  MERGE (s:Type {typeName: row.subType})\nMERGE (p)-[:HAS_BRAND]->(b)\nMERGE (p)-[:HAS_TYPE]->(s)\n\
  MERGE (s)-[:HAS_TYPE]->(m)\n```\n\n> **Important note**\n> \n> It is important to\
  \ remember that using `MERGE`, rather than `CREATE` here, ensures that duplicate\
  \ nodes are not created for each row. Using `CREATE` could potentially be manageable\
  \ for Product nodes, of which one per CSV row is added, but for Brands and Types,\
  \ the `CREATE` function would add Brand and Type nodes with identical names to the\
  \ graph, as well as creating extraneous edges.\n\n6. Before moving on to the next\
  \ stage, we should confirm that product data has been correctly added to our graph\
  \ using some simple Cypher queries, executed in the Neo4j Browser. Looking at our\
  \ data in `products.csv`, we can use the first row to validate our graph data. We\
  \ can first write Cypher to confirm that the product with ID 1001 has the correct\
  \ node attributes, and run this in the Neo4j Browser:\n\n```\nMATCH (n:Product {productID:1001})\n\
  RETURN n.productID, n.name\n```\n\nThis should show us that this node has the name\
  \ `WX100 In-ear Headphones`.\n\n7. Let’s now confirm that relationships were added\
  \ correctly. We can find the brand of these headphones using another MATCH function,\
  \ and RETURN the connected Brand nodes:\n\n```\nMATCH (n:Product {productID:1001})-[:HAS_BRAND]->(m)\n\
  RETURN m.brandName\n```\n\nThis will show that these headphones are of the Hans\
  \ brand.\n\n8. Finally, let’s make sure product types and connected sub-types are\
  \ as expected. In this case, we need to traverse (travel across or through) several\
  \ edges to find the subtype, and then the main type of the product with productID\
  \ 1001. This can be done over two MATCH functions for clarity:\n\n```\nMATCH (n:Product\
  \ {productID:1001})-[:HAS_TYPE]->(subtype:Type)\nMATCH (subtype)-[:HAS_TYPE]->(maintype:Type)\n\
  RETURN n.name, subtype.typeName, maintype.typeName\n```\n\nWe should see in the\
  \ resulting table that the subtype of these headphones is **Bluetooth Headphones**,\
  \ with a main type of **Audio**.\n\nThese are all the steps needed to complete the\
  \ process of getting your data into your Neo4j graph, by extensively using the Neo4j\
  \ Browser to execute the Cypher queries.\n\nWith our product data successfully assembled\
  \ into a graph, we can now think about how customers might interact with products,\
  \ and how to simulate and store this information in the Neo4j database. This will\
  \ be the purpose of the upcoming section.\n\n### Simulating customer interactions\n\
  \nDepending on its size, an online retailer could have thousands of customers browsing\
  \ products on their web application or app. Each of these customers sends queries\
  \ to a backend database when they search for a product, are recommended a product,\
  \ or purchase something, among other actions. This way, a retailer can serve a customer\
  \ with the information they need, as well as storing data on customer behavior.\n\
  \nWe will be focusing on the product recommendation system for our online electronics\
  \ store, as this is often handled with a graph database. From our graph schema in\
  \ *Figure 6.2*, we can see that we want to store data on customer purchases, where\
  \ each customer has a unique ID, a name, and an address.\n\nOf course, we don’t\
  \ have real customers interacting with an application to store data on for this\
  \ example, but we can mock up some fake customers and simulate the queries they\
  \ would send to our database. In a real software development team, creating fake\
  \ customers and customer interactions might be part of a testing framework for a\
  \ new data pipeline.\n\nThese types of query transactions are, in practice, often\
  \ handled by a publish/subscribe messaging service (pub/sub) or similar, which in\
  \ turn is often managed with a cloud computing service. These transactions typically\
  \ take place between multiple machines, which has implications on machine setup,\
  \ security, and permissions, which is an entire subject in itself, the field of\
  \ DevOps. For our purposes, in this chapter, our fake customers will be generated\
  \ in Python, and make purchases by sending queries from Python to Neo4j. This will\
  \ all take place on a local machine, meaning we can focus on graph data modeling\
  \ and network analysis.\n\nLet’s begin by creating a customer. In our schema, a\
  \ customer has a `customerID`, name, and address. Python has some nice tools for\
  \ generating fake data, which we will lean on in this chapter by using the `Faker`\
  \ library.\n\nFaker comes bundled with a variety of methods to simulate different\
  \ types of data, from simple things such as telephone numbers to entire sets of\
  \ fake personal information. For our purposes, we need to generate names and addresses\
  \ to give to our customers.\n\nIn the upcoming steps, we will generate fake data\
  \ to use in our graph use cases going forward:\n\n1. To import Faker, we import\
  \ the `Faker` class from the `faker` (lowercase) library. We then create an instance\
  \ of Faker by assigning it to a variable, here named *fake*. We can optionally set\
  \ the random seed of the Faker library, so that our randomly generated data is consistent\
  \ between Python script runs:\n\n```python\nfrom faker import Faker\nfake = Faker()\n\
  Faker.seed(0)\n```\n\n2. We can now use our instantiated *fake* object to generate\
  \ names and addresses, by simply calling the `name()` and `address()` methods of\
  \ the class:\n\n```python\nname = fake.name()\naddress = fake.address()\nprint(name)\n\
  print(address)\n```\n\nPrinting our results shows some realistic name and address\
  \ data. You may notice from the address that this data is US-localized, which is\
  \ the default setting. It is possible to change the locale of the Faker library\
  \ if needed, for which you should consult the Faker documentation.\n\n3. Now that\
  \ we can create fake data, let’s attach this data to a customer. A sensible way\
  \ to do this is to create a `Customer` class, which holds a `customerID`, name,\
  \ and address attribute for each person. We can use the `__init__()` method to assign\
  \ attributes to each customer.\n\n\n\n\n\n当它被实例化时。我们将为每个客户传递一个唯一的 customerID，并在\
  \ Customer 对象创建时使用 Faker 为其生成姓名和地址：\n\n```\n```python\nclass Customer:\n    def\
  \ __init__(self, customerID):\n        self.customerID = customerID\n        self.name\
  \ = fake.name()\n        self.address = fake.address()\n```\n```\n\n+   4. 让我们通过生成一个客户来测试我们新的类。为了测试目的，我们可以用任意\
  \ ID 9999 创建一个客户，并打印我们 Customer 对象的属性：\n\n```\n```python\nnew_customer = Customer(9999)\n\
  print(new_customer.customerID)\nprint(new_customer.name)\nprint(new_customer.address)\n\
  ```\n```\n\n+   5. 每次调用 Customer 类时，__init__() 方法都会自动生成客户的姓名和地址。有了我们新的类，我们现在能够快速生成客户来填充我们的图数据库。\n\
  \n+   6. 为了将此客户信息传递到我们的图数据库，以及我们整个管道，我们需要像第 5 章《使用图数据库》中那样从 Python 访问 Neo4j。实例化时，此类使用传递给它的凭据建立与\
  \ Neo4j 的连接。它还可以使用 query() 方法与 Neo4j 建立会话并运行查询，以及使用 close() 关闭连接。这是我们在上一章中使用的同一个\
  \ Neo4jConnect 类，因此有关如何将 Python 连接到 Neo4j 的更多信息，请参阅第 5 章《使用图数据库》。尽管我们还包含了一个名为 Graphtastic\
  \ 的自定义包，您可以使用 from graphtastic.database.neo4j import Neo4jConnect 快速导入此类。为了透明起见，此连接方法的完整实现再次包含在以下代码块中：\n\
  \n```\n```python\nfrom neo4j import GraphDatabase\nclass Neo4jConnect:\n    def\
  \ __init__(self, uri, user, password):\n        self.driver = GraphDatabase.driver(uri,\n\
  \                      auth=(user, password))\n    def close(self):\n        self.driver.close()\n\
  \    def query(self, query):\n        session = self.driver.session()\n        result\
  \ = session.run(query)\n        return result\n```\n```\n\n+   7. 我们现在准备好生成并向 Neo4j\
  \ 添加客户。这可以被视为客户注册我们的在线零售应用或网站。接下来我们需要能够将生成的客户数据传递到图数据库的能力。为此，我们可以创建一个方法 `add_customer()`。该方法将接受一个\
  \ `Customer` 对象 `c`，以及一个使用我们的 `Neo4jConnect` 类创建的经过身份验证的 Neo4j 连接。有了这些参数，我们就可以创建一个\
  \ Cypher 查询来添加客户，将节点属性替换为我们客户的属性，使用 `c.customerID`、`c.name` 和 `c.address`。这一切都通过\
  \ Python 的 f 字符串功能处理，围绕一个简单的 MERGE 函数。使用的额外大括号是为了在某些地方转义 f 字符串行为，因为 Cypher 指定节点属性的语法也使用\
  \ `{ }` 字符。根据我们的图模式，我们还指定新节点的 `customerID` 属性应为整数，使用 Cypher 的 `toInteger()`。组装好的查询然后可以使用\
  \ `connection.query()` 调用：\n\n```\n```python\ndef add_customer(c, connection):\n\
  \    query = f'MERGE (:Customer {{customerID: toInteger({c.customerID}), '\\\n \
  \       f'name: \"{c.name}\", '\\\n        f'address: \"{c.address}\"}})'\n    connection.query(query)\n\
  ```\n```\n\n+   8. 让我们通过创建一个另一个示例客户来尝试这个新方法。使用我们的 `Customer` 类，我们可以生成一个具有所需属性的新\
  \ `Customer` 对象。与所有从 Python 到 Neo4j 的 Cypher 查询一样，我们然后使用 `Neo4jConnect` 建立连接，然后使用我们生成的\
  \ `Customer` 和我们的 Neo4j 连接调用新的 `add_customer` 方法，该方法处理向我们的图数据库写入节点。最后，我们使用 `connection.close()`\
  \ 关闭会话：\n\n```\n```python\ntest_customer = Customer(9999)\nconnection = Neo4jConnect('bolt://localhost:7687',\n\
  \    'admin', 'testpython')\nadd_customer(test_customer, connection)\nconnection.close()\n\
  ```\n```\n\n+   9. 回到 Neo4j Browser，我们可以以多种方式检查节点是否已正确添加，但为了更直观，让我们打开 Neo4j Desktop\
  \ 用于 Store DB 数据库，我们已写入该数据库。使用非常简单的 Cypher 匹配所有类型为 Customer 的节点，我们可以将客户返回到浏览器：\n\
  \n```\n```cypher\nMATCH (c:Customer) RETURN c\n```\n```\n\n我们应该看到返回了一个节点。点击该 Customer\
  \ 节点应该在 Neo4j Browser 窗口右侧显示节点属性，确认我们的属性已正确设置。接下来，我们现在可以向我们的图添加客户，但目前它们仍然与数据库中其余节点断开连接。根据我们的模式，我们需要创建关系来表示产品购买，但我们仍然需要一个模拟这些交易的流程。\n\
  \n10. 让我们接下来创建一个用于添加客户购买的方法，与我们定义 add_customer() 的方式类似。我们可以命名该方法为 add_purchase，这次，为了正确建模购买，我们需要更多参数。函数将接受一个客户\
  \ c、产品 ID、当前时间以及 Neo4j 连接。我们再次使用 f 字符串处理 Cypher 查询的组装。当客户选择产品并购买它时，为了在我们的图中建模这一点，我们需要在正确的\
  \ Customer 节点的 customerID 属性上 MATCH，并在匹配的 Product 节点的 productID 上 MATCH。这些 ID 适合匹配，因为我们在模式中将它们定义为唯一的——没有两个客户或两个产品会共享相同的\
  \ ID。我们查询的最后一步是在我们别名的 Customer 和 Product 节点 c 和 p 之间 MERGE 一条边。我们使用 PURCHASED 关系来描述这条边，并在\
  \ datetime 边属性上标注时间参数。最后一步是将查询发送到我们的 Neo4j 数据库，使用 connection.query()：\n\n```\ndef\
  \ add_purchase(c, productID, time, connection):\n    query = f'MATCH (c:Customer\
  \ {{customerID: toInteger({c.customerID})}})' \\\n    f'MATCH (p:Product {{productID:\
  \ toInteger({productID})}})' \\\n    f'MERGE (c)-[:PURCHASED {{datetime:\"{time}\"\
  }}]->(p)'\n    connection.query(query)\n```\n\n11. 现在我们可以测试 add_purchase() 的行为。让我们使用我们已创建的\
  \ ID 为 9999 的 Customer 对象，它也已存在于数据库中，并模拟一次购买。我们可以在 products.csv 原始数据中或在 Neo4j 中找到客户要购买的产品——对于本示例，我们将使用\
  \ productID 为 1010 的节点。\n\n12. 首先，我们从 datetime 导入 datetime，以便在购买时访问当前时间。然后我们建立与数据库的连接。我们使用我们的\
  \ add_purchase() 方法，并向其传递我们现有的 test_customer，以及 productID 1010、datetime.now() 的当前时间，以及\
  \ Neo4j 连接。边的添加将由我们的函数处理，因此我们可以关闭连接完成：\n\n```\nfrom datetime import datetime\nconnection\
  \ = Neo4jConnect('bolt://localhost:7687',\n    'admin', 'testpython')\nadd_purchase(test_customer,\
  \ 1010, datetime.now(),\n    connection)\nconnection.close()\n```\n\n13. 如同之前所做，让我们进入\
  \ Store DB 数据库的 Neo4j Browser，看看是否能找到我们新创建的边。我们可以再次运行一些 Cypher 来查找 Customer 和 Product\
  \ 节点之间具有 PURCHASED 边类型的边，并返回我们匹配的节点：\n\n```\nMATCH (c:Customer)-[:PURCHASED]->(p:Product)\
  \ RETURN c, p\n```\n\n如果边已正确添加，在浏览器中，我们应该看到两个节点由 PURCHASED 关系连接。如同新添加的 Customer\
  \ 节点一样，我们可以通过点击它并检查 Browser 窗口右侧的其属性来检查 datetime 属性是否已正确添加到我们的新边。\n\n+   14. 在我们的图模式中，我们注意到客户可能想要重复购买同一产品，并且这种行为应由同一对\
  \ Customer 和 Product 节点之间的多条边表示。我们应该确保我们的 Python 管道方法能够实现这种行为。为此，让我们再次运行相同的代码，其中\
  \ `test_customer` 第二次购买 ID 为 1010 的产品：\n\n```\n```python\nconnection = Neo4jConnect('bolt://localhost:7687',\n\
  \    'admin', 'testpython')\nadd_purchase(test_customer, 1010, datetime.now(),\n\
  \    connection)\nconnection.close()\n```\n```\n\n+   15. 当我们的代码运行时，让我们通过在 Neo4j\
  \ Browser 中运行另一个 Cypher 查询来检查是否已在我们的 Product 和 Customer 节点之间添加了一条新的独立关系。我们可以要么使用之前运行的查询在视觉上显示我们在节点之间有两条边，要么运行一个查询将客户和产品详细信息打印到表格中，以及节点之间关系的\
  \ datetime：\n\n```\n```cypher\nMATCH (c:Customer)-[purchase:PURCHASED]->(p:Product)\n\
  RETURN c.name, p.name, purchase.datetime\n```\n```\n\n我们应该看到在这对节点之间成功添加了两条边。在 `add_purchase()`\
  \ 中，我们使用 MERGE 添加边，我们在 *第 5 章，使用图数据库* 中了解到，Cypher 的 MERGE 函数如果已存在匹配指定模式的节点或边，则不会创建新的节点或边。在我们的图中，我们可以通过在\
  \ MERGE 模式中指定 datetime 来允许多条边。因为我们在节点对之间不存在具有完全相同毫秒日期和时间的边，所以模式不匹配，从而创建了新的边。\n\n\
  +   16. 我们的测试表明 `add_customer()` 和 `add_purchase()` 按预期工作，并成功将客户数据写入我们的 Neo4j 数据库。让我们在继续之前快速清理我们添加到图中测试客户和购买。\
  \ 为此，我们可以专门匹配客户节点，防止任何产品数据被删除。然后我们可以 DETACH 它们的关系，并从数据库中 DELETE 它们。这可以从 Neo4j Browser\
  \ 运行：\n\n```\n```cypher\nMATCH (c:Customer) DETACH DELETE c\n```\n```\n\n+   17.\
  \ 在设置了自定义方法后，我们现在拥有了模拟客户使用我们应用程序基本行为所需的一切。然而，在现实场景中，通常在很短的时间内会有许多客户与在线零售商互动。我们接下来可以使用\
  \ Python 函数\n\n\n我们已经编写了代码来模拟许多用户与应用程序交互，并将这些交互数据存储在图数据库中。\n\n18. 之前，我们用硬编码的产品ID\
  \ 1010测试了`add_purchase()`方法。然而，如果我们要模拟许多客户的购买行为，可以假设他们很可能想购买不同的产品。首先，虽然不太现实，我们假设客户随机购买产品。这里，我们旨在测试管道快速连续处理多个查询的能力，而不是测试现实行为。\n\
  \n19. 让我们简要定义一个从Neo4j检索产品的方法。因为起初我们的客户会随机购买产品，所以我们只需要Neo4j中`Product`节点的产品ID。为了获取这些ID，我们可以在方法`get_product_ids()`中编写一个Cypher查询，使用`MATCH`语句。在同一个查询中，我们可以使用`RETURN`返回每个节点的产品ID。接下来，我们使用`connection.query()`运行查询。结果以字典列表形式返回，每个字典包含一个键值对，键为`productID`。因此，我们可以使用列表推导式从每个字典中提取产品ID，并将它们添加到列表中：\n\
  \n```\ndef get_product_ids(connection):\n    query = 'MATCH (p:Product) RETURN p.productID\
  \ as productID'\n    result = connection.query(query).data()\n    result = [product['productID']\
  \ for product in result]\n    return result\n```\n\n20. 我们将通过打开一个Neo4j连接并调用该方法，来确保`get_product_ids()`正常工作：\n\
  \n```\nconnection = Neo4jConnect('bolt://localhost:7687',\n    'admin', 'testpython')\n\
  product_ids = get_product_ids(connection)\nconnection.close()\nprint(product_ids)\n\
  print(len(product_ids))\n```\n\n我们的打印语句应显示一个ID列表，并且该列表包含27个元素，等于`products.csv`中的数据行数。\n\
  \n21. 现在我们可以生成大量客户，他们将注册我们的在线零售应用程序并进行购买。我们可以在列表推导式中创建`Customer`类的实例，每个实例都会由Faker生成相应的数据。如果我们在10000到10100的范围内执行此操作，我们将生成100个具有唯一客户ID的客户：\n\
  \n```\ncustomers = [Customer(customerID) for customerID in range(10000, 10100)]\n\
  ```\n\n22. 现在，我们可以使用for循环将所有客户快速连续地添加到图数据库中。我们可以为列表中的每个客户创建一个连接，并调用`add_customer()`：\n\
  \n```\nfor customer in customers:\n    connection = Neo4jConnect('bolt://localhost:7687',\n\
  \        'admin', 'testpython')\n    add_customer(customer, connection)\n    connection.close()\n\
  ```\n\n请注意，我们每次都会打开和关闭一个Neo4j连接，以避免数据写入数据库失败的错误。如果你尝试在不关闭连接的情况下打开许多连接，Neo4j驱动维护的连接池将会耗尽，下一个请求连接的会话将超时，从而导致错误。\n\
  \n客户数据添加完毕后，接下来我们可以向图中添加一些购买记录。目前，我们随机添加购买记录，以开始用客户和产品之间的边来填充图数据库。\n\n23. 为此，我们可以使用Python内置的`random`库。对于列表中的每个客户，我们可以从之前通过查询Neo4j创建的`product_ids`列表中随机抽取一个产品。然后我们可以打开连接，使用`add_purchase()`方法在图中创建类似于客户购买行为的边：\n\
  \n```\nimport random\nfor customer in customers:\n    product = random.choice(product_ids)\n\
  \    connection = Neo4jConnect('bolt://localhost:7687',\n        'admin', 'testpython')\n\
  \    add_purchase(customer, product, datetime.now(),\n        connection)\n    connection.close()\n\
  ```\n\n我们现在已经向图中添加了客户数据，这为我们接下来考虑如何向在线零售商的用户推荐更多产品提供了一个很好的起点。此时，我们可以通过查询图的子集，或者例如计算节点和路径的数量，在Neo4j\
  \ Browser中可视化地查看一些客户数据。\n\n24. 此外，我们还可以运行几次之前的循环，以生成更多客户和购买记录。如果希望实时监控图的填充情况，可以考虑使用Python\
  \ `time`库中的`sleep()`方法减慢循环，并在逻辑中调用`sleep()`。例如，以下代码将Python执行代码的时间延迟一秒钟：\n\n```\n\
  from time import sleep\nsleep(1)\n```\n\n通过使用`sleep()`，在脚本运行期间，你可以切换到Neo4j Browser，看到节点和边的数量逐渐增加。在Python中使用f字符串组装Cypher查询，是一种通用化图数据库处理的强大方式。当然，在数据管道构建中常用的其他语言（如Java）也提供了类似的行为，不过在考虑我们流程和模式所需的设计元素时，Python是一个很好的起点。\n\
  \n至此，我们已经创建了新的类和方法，拥有了存储客户与在线零售应用程序交互数据所需的一切。我们可以就此打住，因为我们知道正在正确捕获数据，但这并没有充分利用我们建立的图数据模型。相反，接下来让我们看看如何利用收集到的数据来推动进一步的客户交互。\n\
  \n### 做出产品推荐\n\n通常，在使用在线零售应用程序或服务时，你会发现自己会收到产品推荐。这些推荐可能由浏览器Cookie、你已经查看过的产品或之前的购买记录驱动。在我们的案例中，我们有之前产品购买的信息，因此我们将使用这些数据进行推荐。\n\
  \n即使选择使用之前的购买记录来提供推荐，向你推荐特定产品的决策方式也有很多种。如果客户购买了某个品牌的商品，他们是否会感兴趣拥有同一品牌的更多产品？或者，我们是否应该根据其他客户的行为来向客户推荐产品？\n\
  \n在接下来的部分中，我们将设计和测试几种不同的推荐方法，从下一节开始，我们将研究按品牌进行的产品推荐。\n\n#### 按品牌推荐产品\n\n正如我们在模式设计部分简要讨论的，我们可以将产品信息视为图结构的支柱。它包含有关产品类型和品牌的分类信息，可以被视为一种产品本体。我们可以利用本体中的信息，基于客户之前的购买记录，创建一种简单的产品推荐方法。\n\
  \n为此，我们可以假设消费者更有可能对购买他们过去曾购买过品牌的商品感兴趣。我们将在本节的后续步骤中介绍这一点：\n\n- 1. 让我们定义一个新方法，名为`rec_by_brand()`。与我们现有的方法类似，该方法同样接收`c`（一个`Customer`对象）和`connection`（一个经过身份验证的Neo4j会话）。在此函数中，我们可以编写一个使用多个`MATCH`语句的Cypher查询。\n\
  \n2. 我们首先通过查找客户ID来匹配`c`代表的客户。在同一个语句中，我们通过匹配`PURCHASED`边到`Product`节点，来找到我们所讨论的客户已经购买的产品。这些产品被赋予别名`p`，我们使用该节点通过`HAS_BRANDS`边找到这些产品的品牌。这些品牌依次被赋予别名`b`，我们最后的模式匹配步骤是使用`MATCH`遍历回与这些品牌关联的`Product`节点，记为`r`。此时，我们需要确保不会推荐用户已经购买的且具有相同品牌的产品。为此，我们添加一个`WHERE`子句，指定我们只想要`Customer`节点与推荐`Product`节点之间没有现有关系的结果。为了完成查询，我们返回别名为`r`的节点的`productID`属性，并将其重命名为`productID`。我们还使用`DISTINCT`生成一组结果，确保不推荐重复产品。在同一个方法中，我们运行查询并通过调用`data()`获取返回数据，将其赋值给`result`，然后使用列表推导式访问返回字典列表中的每个产品ID，将它们分配到一个列表中，并返回该列表：\n\
  \n```\ndef rec_by_brand(c, connection):\n    query = f'MATCH (c:Customer {{customerID:\
  \ toInteger({c.customerID})}})' \\\n        '-[ :PURCHASED ]->(p:Product) ' \\\n\
  \        'MATCH (p)-[:HAS_BRAND]->(b:Brand) ' \\\n        'MATCH (b)<-[:HAS_BRAND]-(r:Product)\
  \ ' \\\n        'WHERE NOT (c)-[:PURCHASED]->(r) ' \\\n        'RETURN DISTINCT\
  \ r.productID as productID'\n\n    result = connection.query(query).data()\n   \
  \ result = [product['productID'] for product in result]\n\n    return result\n```\n\
  \n3. 现在我们可以测试该方法，并为单个客户获取一些结果。我们再次使用Neo4j Connect打开一个连接，并从列表中选择一个客户作为参数传递给`rec_by_brand()`：\n\
  \n```\nconnection = Neo4jConnect('bolt://localhost:7687', 'admin', 'testpython')\n\
  brand_recommendations = rec_by_brand(customers[10], connection)\nconnection.close()\n\
  print(brand_recommendations)\n```\n\n4. 这将打印一个推荐给该特定客户的产品ID列表。此时，我们可以通过打开Neo4j Browser并运行查询，使用与`rec_by_brand()`方法中类似的逻辑，找到该客户与具有相同品牌的已购买产品之间的路径，来进一步验证这一点：\n\
  \n```\nMATCH (c:Customer {customerID:10010})-[:PURCHASED]->(p:Product)\nMATCH (p)-[:HAS_BRAND]->(b:Brand)\n\
  ```\n\n\n\n\n\n```\nMATCH (b)<-[:HAS_BRAND]-(r:Product)\nWHERE NOT (c)-[:PURCHASED]->(r)\n\
  RETURN c, p, b, r\n```\n\n与其返回推荐的产品 ID，在此查询中我们返回匹配到的 Customer、Brand 和 Product 节点，并可以验证它们之间的路径是否符合预期。我们可以调整\
  \ RETURN 语句以仅筛选推荐的产品或其他感兴趣的节点类型。\n\n5. 当我们对按品牌进行的推荐功能感到满意后，可以为所有客户执行这些操作，并基于这些推荐模拟购买。对于客户列表中的每个\
  \ Customer 对象，我们可以使用 rec_by_brand() 进行推荐，并将结果分配到一个列表中。我们指定一个条件，即 brand_recommendations\
  \ 的长度必须不为 0，因为对于没有任何购买历史的新客户，使用此方法无法选择推荐产品。空列表也会导致下一步失败，在下一步中我们再次使用 random.choice()\
  \ 方法从列表中为客户选择一个推荐产品进行购买。我们再次使用 add_purchase() 函数在图中创建一条边，连接我们的 Customer 与其基于推荐而新购买的产品：\n\
  \n```\nfor customer in customers:\n    connection = Neo4jConnect('bolt://localhost:7687',\
  \ 'admin', 'testpython')\n    brand_recommendations = rec_by_brand(customer, connection)\n\
  \    connection.close()\n    if len(brand_recommendations) != 0:\n        product\
  \ = random.choice(brand_recommendations)\n        connection = Neo4jConnect('bolt://localhost:7687',\
  \ 'admin', 'testpython')\n        add_purchase(customer, product, datetime.now(),\
  \ connection)\n        connection.close()\n```\n\n6. 当然，我们可能还想通过其他简单方法推荐产品，例如基于之前购买的类型或子类型。这将是更改\
  \ rec_by_brand() 中的路径匹配逻辑以遍历不同类型的关系、不同类型的节点的情况。我们可能还想防止基于产品是否与已购买的产品类型相同来推荐产品，假设客户不太可能购买自己已拥有的东西。在\
  \ Neo4j Browser 中，开始设计此过程的 Cypher 可能看起来像这样，利用模式匹配查找产品类型，并通过在 WHERE 子句中添加额外条件来否定为推荐匹配这些类型：\n\
  \n```\nMATCH (c:Customer {customerID:10010})-[:PURCHASED]->(p:Product)\nMATCH (p)-[:HAS_TYPE]->(st:Type)\n\
  MATCH (p)-[:HAS_BRAND]->(b:Brand)\n```\n\n```\nMATCH (b)<-[:HAS_BRAND]-(r:Product)\n\
  WHERE NOT (c)-[:PURCHASED]->(r) AND (r)-[:HAS_TYPE]->(st)\nRETURN DISTINCT r\n```\n\
  \n一旦确认此逻辑工作正确，我们就可以更新 rec_by_brand() 方法以使用此逻辑。现在，让我们继续介绍另一种真实在线零售商常用的产品推荐类型。这将在下一节中介绍。\n\
  \n#### 利用其他客户的购买行为\n\n基于品牌推荐产品是一种简单但合理的方式，利用我们的图本体驱动进一步的客户购买。然而，这并不是在线零售商促进销售所采用的唯一方法，并且只使用了我们图数据库中可用的部分数据。\n\
  \n到目前为止，我们一直在收集模拟客户购买的许多数据，我们可以更整体地使用这些数据来查找客户感兴趣的产品。考虑一位过去通过我们的 Web 应用进行过购买的客户。这将作为图中一条边存储在我们的图中，同时还有其他客户购买相同产品的边。通过遍历与其他客户的关系，我们可以找到购买初始产品的客户随后购买的其他产品，并推荐它们。这种类型的推荐依赖于客户更可能购买彼此相似的一组产品，而不是随机购买商品的假设。\n\
  \n以下步骤展示了我们如何实现这一点：\n\n- 1. 让我们编写一个方法，使用其他客户的购买行为向客户推荐产品，命名为 rec_by_copurchase()。该方法的结构与\
  \ rec_by_brand() 相似，只是 Cypher 修改为沿 PURCHASED 边回溯到我们目标客户已购买产品的其他客户。我们使用 WHERE 子句防止回溯到我们正在为其做推荐的原始客户。然后我们可以从具有相同购买历史的客户，即别名为\
  \ c2，到他们购买的其他产品。我们还确保不推荐客户 c 已购买的产品，同样使用 WHERE。其余部分与 rec_by_brand() 相同，并返回产品 ID\
  \ 列表：\n\n```\ndef rec_by_copurchase(c, connection):\n    query = f'MATCH (c:Customer\
  \ {{customerID: toInteger({c.customerID})}})' \\\n        '-[ :PURCHASED]->(p:Product)'\
  \ \\\n        'MATCH (p)<-[:PURCHASED]-(c2:Customer)' \\\n        'WHERE c2 <> c\
  \ ' \\\n        'MATCH (c2)-[:PURCHASED]->(r:Product)' \\\n        'WHERE p <> r\
  \ ' \\\n        'RETURN DISTINCT r.productID as productID'\n```\n\n#### 使用相似度分数推荐产品\n\
  \n在本章中我们将考虑的最后一个推荐产品的方法更依赖于 Python 及其与 Neo4j 数据库的接口。之前基于联合客户购买的推荐系统利用了客户数据，可能在零售应用中完成购买后使用，以引导用户关注其他感兴趣的产品。然而，我们可以通过查看整体购买历史相似度来扩展客户可能购买相似产品集合的想法。这种基于过去购买集合的通用推荐，更可能在应用的首页向客户提供。\n\
  \n为了比较客户购买情况，我们可以查看相似度度量。这些度量根据两个集合中元素的相似性返回一个分数。几种方法，每种都源于集合论，可用于计算节点组之间的相似性。示例有重叠相似度、Dice\
  \ 系数，以及由于其易于实现和可解释性而常用的 Jaccard 相似度。\n\nJaccard 相似度定义为两个集合的交集除以同一集合的并集。基本上，这会产生\
  \ 0 到 1 之间的值，其中 0 表示没有相似性，分数为 1 表示两个集合相同。我们可以使用此度量来查找在购买方面相似的客户。我们将为 Jaccard 相似度的计算定义自己的简单实现，但更多信息和示例可在\
  \ scikit-learn 文档中找到。\n\n就我们的目的而言，当找到具有较高但不完全重叠的产品购买的相似客户时，我们可以识别它们购买集合之间剩余的差异并向客户推荐这些产品。到目前为止，我们的数据库包含我们\
  \ 100 位客户的大量购买记录，因此充分利用我们可用的数据，让我们继续在 Python 中实现本章的最终推荐方法。以下步骤将展示如何在我们的用例中使用 Jaccard\
  \ 相似度：\n\n- 1. 计算客户购买之间的 Jaccard 相似度比之前的方法更复杂一些，而 Cypher 在基于路径的计算中表现出色，Python 更适合相似度计算。因此，让我们首先定义一个简单的方法，使用与\
  \ rec_by_brand() 和 rec_by_copurchase() 类似的步骤来提取给定客户 ID c_id 的所有购买记录：\n\n```\ndef\
  \ get_customer_purchases(c_id, connection):\n    query = f'MATCH (c:Customer {{customerID:\
  \ toInteger({c_id})}})' \\\n            '-[ :PURCHASED ]->(p:Product)' \\\n    \
  \        'RETURN DISTINCT p.productID as productID'\n    result = connection.query(query).data()\n\
  \    result = [product['productID'] for product in result]\n    return result\n\
  ```\n\n\n\n- 2. 对单个客户调用此方法应返回他们已购买的产品 ID 列表：\n\n    ```python\n    connection =\
  \ Neo4jConnect('bolt://localhost:7687',\n        'admin', 'testpython')\n    purchases\
  \ = get_customer_purchases(\n        customers[10].customerID, connection)\n   \
  \ connection.close()\n    print(purchases)\n    ```\n\n- 3. 为了确保正确性，我们可以将打印出的列表与在\
  \ Neo4j Browser 中通过简单等效查询找到的结果进行比较：\n\n    ```\n    MATCH (c:Customer {customerID:10010})-[:PURCHASED]-(p:Product)\n\
  \    RETURN DISTINCT p.productID as productID\n    ```\n\n- 4. 现在 `get_customer_purchases()`\
  \ 正常工作，我们可以通过对客户对象列表中的所有客户使用字典推导式来获取所有客户的购买记录。对每个客户，我们调用该方法并传入 Neo4j 连接：\n\n   \
  \ ```python\n    connection = Neo4jConnect('bolt://localhost:7687',\n        'admin',\
  \ 'testpython')\n    all_purchases = {customer.customerID:\n        get_customer_purchases(customer.customerID,\n\
  \        connection)\n        for customer in customers}\n\n    print(all_purchases)\n\
  \    ```\n\n    这会生成一个字典，其键包含客户 ID，值包含客户已购买的产品 ID 列表。\n\n- 5. 接下来我们需要定义一个函数来计算这些已购买产品集合之间的\
  \ Jaccard 相似度。我们可以根据标准实现来完成，这需要两个集合，因此首先将参数 `list1` 和 `list2` 转换为 Python 集合。接下来，我们找到\
  \ `set1` 和 `set2` 之间的交集，同时也找到并集。最后，通过将集合交集的长度除以集合并集的长度来计算 Jaccard 相似度，并返回该值：\n\n\
  \    ```python\n    def jaccard_similarity(list1, list2):\n        set1 = set(list1)\n\
  \        set2 = set(list2)\n        intersection = set1.intersection(set2)\n   \
  \     union = set1.union(set2)\n        jaccard = len(intersection) / len(union)\n\
  \        return jaccard\n    ```\n\n- 6. Jaccard 相似度可以手动轻松计算简单集合，因此我们可以通过创建一些测试数据并使用\
  \ `assert` 检查是否得到正确的相似度分数来确保我们的方法按预期运行：\n\n    ```python\n    list1 = [1, 2, 3,\
  \ 4]\n    list2 = [5, 6, 7, 8]\n    list3 = [1, 2]\n    assert jaccard_similarity(list1,\
  \ list1) == 1\n    assert jaccard_similarity(list1, list2) == 0\n    assert jaccard_similarity(list1,\
  \ list3) == 0.5\n    ```\n\n- 7. 在定义并测试了 `jaccard_similarity()` 方法后，我们就可以计算客户购买历史之间成对的相似度。为此，我们需要一个包含所有客户\
  \ ID 对的列表，一个快速的方法是使用 Python 内置的 `itertools` 库。如果我们先从 `all_purchases` 字典中获取所有包含客户\
  \ ID 的键，然后就可以使用 `itertools.combinations()` 找到所有唯一对，将客户 ID 和值 2 传入，后者指定仅返回由两个元素组成的组合：\n\
  \n    ```python\n    import itertools\n    customer_ids = list(all_purchases.keys())\n\
  \    print(customer_ids)\n    customer_pairs = list(itertools.combinations(\n  \
  \      customer_ids, 2))\n    print(customer_pairs[:10])\n    ```\n\n    现在，有了 `customer_pairs`\
  \ 列表，让我们使用另一个字典推导式计算客户购买的 Jaccard 相似度。该推导式会遍历 `customer_pairs` 中的每一对，使用每对的值作为键访问\
  \ `all_purchases` 字典中存储的购买列表值。然后这些列表会传入我们的 `jaccard_similarity()` 方法。这会生成另一个字典，以客户对作为键，以相似度分数作为值，我们将其命名为\
  \ `similarity`：\n\n    ```python\n    similarity = {pair: jaccard_similarity(all_purchases[\n\
  \        pair[0]], all_purchases[pair[1]]) for pair in\n        customer_pairs}\n\
  \    ```\n\n- 8. 让我们查看 `similarity` 字典中客户对分数的分布。我们可以使用 `collections` 库和 `Counter`\
  \ 方法来实现这一点，就像我们在之前几章中所做的那样，并打印字典值分布的快速视图：\n\n    ```python\n    from collections\
  \ import Counter\n    grouped_similarities = Counter(similarity.values())\n    print(grouped_similarities)\n\
  \    ```\n\n- 9. 此时，根据数据库中包含的购买次数和客户数量，你会得到不同的分布。然而，很可能存在一些客户对的 Jaccard 相似度为 1，这意味着他们的购买完全相同。在这种情况下，我们无法合理地向任一客户推荐产品，因为他们已经拥有对方客户拥有的所有产品。很可能也存在相似度分数为\
  \ 0 的客户对。在这种情况下也很难做出推荐，因为 0 分表示购买历史没有重叠，因此没有迹象表明一个客户会特别受益于第二个客户购买的产品，反之亦然。\n\n \
  \   相反，我们希望关注购买历史存在一定重叠的客户，这表明可能存在原因使一个客户购买特定产品集合，而第二个客户可能出于类似原因也想这样做。例如，这可能适用于产品组合良好的情况，如电视和音响。或者，仅仅是两个客户在品牌或产品风格上的品味相似。使用相似度进行产品推荐的美妙之处在于，我们不需要知道客户购买相似的根本原因；他们对相似客户购买的产品感兴趣的可能性仍然高于他们选择购买随机挑选的商品。\n\
  \n    考虑到这一点，我们希望针对相似但不完全相同的购买历史，并利用这些历史推荐进一步的产品购买。为此，我们将定义一个基于我们已进行的相似度分析结果的 Jaccard\
  \ 相似度阈值。让我们把这一切结合起来，定义最后一个方法，该方法可用于在推荐管道中根据客户相似度向客户推荐产品。\n\n- 10. 我们新方法将命名为 `rec_by_similarity()`，并接受两个客户\
  \ ID，`c1` 和 `c2`。我们的流程一部分是添加新购买，但我们现有的 `add_purchase()` 方法以 Customer 对象作为参数。因此，我们应该重新定义\
  \ `add_purchase()` 方法以接受客户 ID，如下所示，并将其命名为 `add_purchase_id()`：\n\n    ```python\n\
  \    def add_purchase_id(c_id, productID, time, connection):\n        query = f'MATCH\
  \ (c:Customer {{customerID: toInteger({c_id})}})'\n        ' \\\n        f'MATCH\
  \ (p:Product {{productID: toInteger({productID})}})'\n        ' \\\n        f'MERGE\
  \ (c)-[:PURCHASED {{datetime:\"{time}\"}}]->(p)'\n        connection.query(query)\n\
  \    ```\n\n- 11. 让我们回到定义 `rec_by_similarity()`，并查看我们还需要另一个参数 `threshold`。我们的阈值将针对\
  \ Jaccard 相似度高于某一水平的客户。这里我们将其设为 0.7，但可以根据需要更改以针对不同范围的相似度：\n\n    ```python\n   \
  \ threshold = 0.7\n    ```\n\n- 12. 现在参数规划完成，我们就可以定义 `rec_by_similarity()` 方法了。我们首先通过重用之前定义的\
  \ `get_customer_purchases()` 方法来查找 `c1` 和 `c2` 的客户购买记录。然后，使用返回的产品列表，我们用 `jaccard_similarity()`\
  \ 计算它们之间的 Jaccard 相似度。接下来，我们可以检查相似度是否高于某个阈值，同时检查两个产品集合是否不相同，使用 if 语句。如果 Jaccard\
  \ 相似度值符合此条件，我们就可以继续，并使用两个列表推导式找到两个客户尚未购买的产品，并将它们存储在变量 `p1_recs` 和 `p2_recs` 中。现在剩下的就是通过为\
  \ `p1_recs` 和 `p2_recs` 中的每个新产品调用我们的 `add_purchase_id()` 方法来模拟零售商产品基于这些推荐的购买：\n\n\
  \    ```python\n    def rec_by_similarity(c1, c2, threshold, connection):\n    \
  \    p1 = get_customer_purchases(c1, connection)\n        p2 = get_customer_purchases(c2,\
  \ connection)\n        similarity = jaccard_similarity(p1, p2)\n        if similarity\
  \ >= threshold and similarity != 1:\n            p1_recs = [p for p in p2 if p not\
  \ in p1]\n            p2_recs = [p for p in p1 if p not in p2]\n            for\
  \ p in p1_recs:\n                add_purchase_id(c1, p, datetime.now(), connection)\n\
  \            for p in p2_recs:\n                add_purchase_id(c2, p, datetime.now(),\
  \ connection)\n    ```\n\n- 13. 在为我们这种新型推荐做好一切准备后，我们只需要调用 `rec_by_similarity()`\
  \ 为我们所有的客户做出基于相似度的推荐，就像我们对之前的推荐方法所做的那样：\n\n    ```python\n    for pair in customer_pairs:\n\
  \        connection = Neo4jConnect('bolt://localhost:7687', 'admin', 'testpython')\n\
  \        rec_by_similarity(pair[0], pair[1], 0.7, connection)\n        connection.close()\n\
  \    ```\n\n为了探索这种推荐类型对我们存储的客户数据的影响，此时可能很有趣打开 Neo4j Browser 并运行一些简单查询。拥有多种不同推荐系统的在线零售商可能会在\
  \ A/B 测试中将不同系统相互比较，并监控它们如何推动购买。这些系统代表了使用表示客户和产品数据的图数据模型可能实现的几种推荐方法。\n\n至此，本章结束。我们将扩展在此处完成的工作，以查看在设置架构时需要进行重构的考虑因素，以及演进架构。本章非常精彩，我们很高兴把它拼凑起来，因为这就是我们许多管道的运行方式，即\
  \ Neo4j 与 Python 之间的接口——让我们称之为幸福的婚姻。\n\n### Summary\n\n我们从本章开始研究了图数据库管道的设计考虑因素，并重新熟悉了如何设置\
  \ Neo4j 图数据库。我们本章的用例是为零售创建图数据库，并设计了架构和管道。在我们的架构中\n\n\n\n"
- "### 重构与模式演进\n\n本章将花一些时间讨论什么才是好的模式，以及当你需要重构或变更模式时可以采取的方法。我们将探讨在图数据库中，实体可以发生哪些变化以及如何变化。这将进而引出为什么需要考虑模式演进。在这里，重点将放在如何让你的模式在演进过程中无懈可击。\n\
  \n接下来，我们将介绍一个 Twitter 圈子（Circles）的用例，其中会涉及设置 Neo4j 与 Python 之间的接口（这一点我们已在其他章节中详细介绍过）、为我们将在\
  \ Neo4j 中构建图数据模型所编写的 Cypher 查询添加约束，以及在模式变更前关于节点和边列表关系需要做的一些考量。然后，我们将根据假设的需求变更模式，同时不中断线上服务。最后，我们将反思为什么演进模式的设计对于成功的图数据管道至关重要。\n\
  \n总而言之，本章将涵盖以下主要内容：\n\n- 重构的考量\n- 有效演进\n- 将变更投入开发\n\n然而，对于关系型数据库来说，事情会随着数据点之间关系的不同而变得更加复杂。现在设想一下，我们希望为系统中的每位客户存储多个收货地址，以便客户可以从中选择。在我们的关系型数据库中，一个列将不再足以描述这些数据。每位客户可以有任意数量的地址，因此在客户表中为每个地址创建一列也不是一个可行的选择。在这种情况下，我们不知道要创建多少列；即使知道，档案中拥有大量地址的客户可能也不常见，结果会导致其他所有客户在这些列中包含大量空值。\n\
  \n相反，为每位客户添加多个地址需要对关系型数据库进行重构。一种典型的解决方案是创建一个新表，每个客户-地址对占一行，并从客户主表中删除地址列。这样既保持了唯一客户与其地址之间的关系，又需要在两个表之间复制客户\
  \ ID（或其他唯一标识属性）。\n\n下图展示了演进中的模式对传统关系型数据库模式的影响：\n\n| 客户 ID | 姓名 | 地址 | 其他.... |\n\
  |---|---|---|---|\n| 101111 | Mark | 165 London Road | ... |\n| 101112 | Jeremy\
  \ | 34 Star Avenue | ... |\n| 101113 | Johnson | 12 Applewood Close | ... |\n| 101114\
  \ | Sue | 1 Elm Street | ... |\n\n| 客户 ID | 姓名 | 其他.... |\n|---|---|---|\n| 101111\
  \ | Mark | ... |\n| 101112 | Jeremy | ... |\n| 101113 | Johnson | ... |\n| 101114\
  \ | Sue | ... |\n\n| 客户 ID | 地址 |\n|---|---|\n| 101111 | 165 London Road |\n| 101112\
  \ | 34 Star Avenue |\n| 101112 | 63 Hill View |\n| 101113 | 12 Applewood Close |\n\
  | 101114 | 1 Elm Street |\n| 101114 | 59 Sparrow Lane |\n\n图 7.1 – 数据库模式演进的影响\n\n\
  在图数据库中，这种类型的模式变更实现起来更简单。图得益于没有固定结构，这是由数据点之间关系建模方式所赋予的特性。只要使用得当，图数据库对所建模的关系类型不加区分；无论是一对一、一对多还是多对多，关系始终由两个节点之间的边表示。这正是图\
  \ 7.2 所强调的那类变更：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_160_0.png)\n\n图 7.2\
  \ – 模式变更前的图数据库\n\n由于每位客户可以有多个地址，我们可以将**地址**属性移动到一个独立的**地址**类型节点上，并通过一条边连接。现在，当为客户添加更多地址时，我们只需在图中增加另一个节点和一条边。这里，无需预先规定每位客户允许的地址数量，也无需在数据库的不同部分复制数据。\n\
  \n在*图数据模型*中，关系是有方向的。如果一个用户关注了另一个用户，并不要求反向关注也成立。\n\n现在，设想在 Twitter 的持续开发过程中，它将发布一个名为*圈子（Circles）*的新功能。在早期版本中，每个用户只能与其他用户一起加入一个*圈子*。此时，我们可能会决定将用户圈子的\
  \ ID 作为属性添加到 User 节点上。使用属性来表示这一点是合理的，因为目前用户与其圈子之间是一对一的关系。\n\n下图展示了当用户只属于一个圈子时，如何设置带有\
  \ FOLLOWS 关系的 User 节点：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_162_0.png)\n\n\
  图 7.4 – 每位用户一个圈子的模式\n\n如果每个用户只能属于一个圈子，这种模式可以完美地工作。然而，如果 Twitter 的新更新允许用户属于多个圈子，会发生什么？在这次更新之后，用户与圈子之间的关系将变成一对多。如果我们将它们列在一个属性中，可能会变得难以处理，因为表示用户圈子成员身份的字符串可能会非常大。随着时间的推移，如果我们想利用图数据库中保存的信息来驱动前端应用中与圈子相关的任何行为，查询起来将非常困难。由于必须在一个长列表中搜索特定圈子，查询性能将受到影响。\n\
  \n相反，我们可以提前规划，把圈子属性移到独立的节点类型 Circle 上。每个节点都可以有唯一 ID，并可以从 User 节点向 Circle 节点建立关系。我们将这种关系称为\
  \ MEMBER_OF。\n\n添加 Circle 节点不仅避免了为每个 User 积累冗长的属性列表，还消除了该属性中保存的圈子 ID 的重复问题。现在，每个圈子都由一个单独节点表示，并连接多个\
  \ User 节点。这将进一步提高性能，使图查询能够遍历现已连接起来的 User/Circle 网络。\n\n此图显示了 User 作为某个特定圈子成员的情况，并通过关系展示还有谁关注该用户：\n\
  \n- 4. 和之前一样，我们需要添加一个具有管理员权限的新用户，以便从 Python 对 Neo4j 数据库运行 Cypher。在 Neo4j Browser\
  \ 控制台中，运行以下命令：\n\n```\n:server user add\n```\n\n- 5. 这会打开一个窗口，你可以在其中输入新用户的用户名和密码。这里，我们将使用用户名\
  \ admin 和密码 testpython。在 Roles 下拉列表中，同时选择 admin 和 PUBLIC。最后，单击 Add User。\n\n数据库设置完毕后，我们就可以添加\
  \ Twitter 模式的第一个迭代版本了。\n\n#### 添加约束\n\n在图数据库中，数据准确性绝对关键，因此我们可能需要考虑其他方法来确保数据严格符合我们的模式。我们之前已经探讨过，在发送写查询时使用\
  \ MERGE 语句而不是 CREATE 语句，以确保不会向数据库中添加重复节点。然而，使用约束会为我们的图数据增加一层额外的控制。\n\n可以在 Neo4j\
  \ 数据库中设置约束，以确保节点、边及其属性符合严格的规则。我们之前探讨过使用 MERGE 语句而不是 CREATE 语句，以确保在发送写查询时不会向数据库添加重复节点。然而，在防止重复方面，使用约束会为我们的图数据增加额外的一层控制。Neo4j\
  \ 中可以使用多种类型的约束；更多实现方式请参阅 https://neo4j.com/docs/cypher-manual/current/constraints/。\n\
  \n在我们的 Twitter 模式中，我们确定了一些节点属性，它们在特定类型的所有节点中都应是唯一的。让我们为 User 节点添加一个唯一性约束，每个 User\
  \ 节点都应具有唯一的 userID 属性。为此，我们需要编写一些 Cypher。创建此约束的步骤如下：\n\n- 1. 我们可以使用 CREATE CONSTRAINT\
  \ 函数添加约束，并为其命名为 unique_user。然后使用 FOR 指定该约束适用的节点类型，后面跟一个节点和所选别名——此处为 u。接着使用 REQUIRE\
  \ 指定适用于该节点的约束类型，并断言 u.userID IS UNIQUE：\n\n```\nCREATE CONSTRAINT unique_user\n\
  FOR (u:User)\nREQUIRE u.userID IS UNIQUE\n```\n\n可以在我们数据库的 Neo4j Browser 中运行这些语句来设置约束。运行后，浏览器应确认已添加一个约束。如图\
  \ 7.6 所示：\n\n\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_165_0.png)\n\nFigure 7.6\
  \ – Neo4j Browser constraint\n\n2. 现在让我们测试一下当我们尝试违反约束规则时会发生什么，在 Neo4j Browser 窗口中。首先，我们可以创建一个\
  \ userID 设为 100 的节点：\n\n```\nCREATE (u:User {userID: '100'})\n```\n\n然后，再次运行此查询。如果约束设置正确，浏览器窗口应返回类似“Node(2)\
  \ already exists with label User and property userID = '100'.”的内容。此约束通过抛出错误来防止使用已存在的用户\
  \ ID 写入新节点。\n\n3. 相比之下，让我们尝试使用 MERGE 添加同一个节点：\n\n```\nMERGE (u:User {userID: '100'})\n\
  ```\n\n在 Neo4j Browser 中运行后，我们应该会看到数据库没有变化。MERGE 语句匹配了 ID 为 '100' 的现有节点，并且随后没有向数据库写入任何新数据。\n\
  \n4. 在继续之前，我们应该通过在 Neo4j Browser 中运行以下命令来清除本节中添加到数据库的测试数据，就像我们在前几章中所做的那样：\n\n```\n\
  MATCH (n) DETACH DELETE n\n```\n\n约束是确保数据符合诸如属性唯一性之类的模式要求的绝佳方式。在为用户设置了唯一性约束并对图数据模型有了更严格的控制后，让我们接下来看看如何向\
  \ Neo4j 添加一些 Twitter 数据。\n\n2. 在函数准备好连接我们的 Neo4j 数据库后，我们可以考虑使用数据填充我们的图，首先从 edgelist\
  \ 开始。我们需要使用内置的 Python csv 库打开 edges1.csv，并将每一行转换为列表，从而得到一个列表的列表：\n\n```\nimport\
  \ csv\nwith open('./data/edges1.csv', 'r') as c:\n    reader = csv.reader(c)\n \
  \   edgelist = [edge for edge in reader]\nprint(edgelist[:5])\n```\n\n3. 我们的 print\
  \ 语句显示边已正确读入 Python。现在我们需要一种方法将这些用户 ID 及其 FOLLOWS 关系传输到 Neo4j，因此我们将为此编写一个单独的函数。函数将接收\
  \ n，即关注另一位用户的用户 ID，另一位用户的 ID 为 m。它还将接收使用 Neo4jConnect 建立的 Neo4j 连接。然后，我们可以使用这些参数组装一个简单的\
  \ Cypher 查询，使用 MERGE 以便不会复制现有节点和边。每个 User 节点首先合并到图中，然后是它们之间的 FOLLOWS 边。用户 ID 属性周围使用引号以确保它们作为字符串添加，符合我们在上一节中设计的模式。最后一步是使用我们的连接将写查询发送到数据库：\n\
  \n```\ndef add_edge_neo4j(n, m, connection):\n    cypher = f'MERGE (u1:User {{userID:\
  \ \"{n}\"}}) ' \\\n             f'MERGE (u2:User {{userID: \"{m}\"}}) ' \\\n   \
  \          'MERGE (u1)-[:FOLLOWS]->(u2)'\n    connection.query(cypher)\n```\n\n\
  4. 让我们通过从 Python 添加一条边来测试此函数是否正常工作。我们可以使用列表切片获取导入的 CSV 中第一条边的源和目标：\n\n```\nconnection\
  \ = Neo4jConnect('bolt://localhost:7687', 'admin', 'testpython')\nadd_edge_neo4j(edgelist[0][0],\
  \ edgelist[0][1], connection)\nconnection.close()\n```\n\n5. 如果操作成功，你应该会看到两个 User\
  \ 节点和一条 FOLLOWS 边已添加到 Neo4j，使用 Neo4j Browser。为确认，我们可以在 Neo4j Browser Terminal 中运行以下命令：\n\
  \n```\nMATCH (u:User) RETURN u\n```\n\nnode attribute, using data read in from a\
  \ CSV. We will first import the circles1.csv data, similarly to how we imported\
  \ our edgelist, using the csv library:\n\n```\nwith open('./data/circle1.csv', 'r')\
  \ as c:\n    reader = csv.reader(c)\n    circles_raw = [row for row in reader]\n\
  print(circles_raw)\n```\n\n我们的 print 语句显示我们有一个列表的列表，每个列表都包含第一个元素中的 circle ID，其后是属于该\
  \ circle 的用户。我们需要将此格式解析为在 Cypher 查询中更易于处理的格式。\n\n8. 让我们定义一个快速函数将此数据格式转换为 circle\
  \ ID 和 user ID 的配对。我们称之为 get_user_circle_pairs()，它将仅接收从 circle1.csv 读取的数据。我们定义一个空列表，对于每个\
  \ circle 及其用户列表，使用列表推导式取 circle ID 从索引 0，以及一个 user ID。因为由此推导产生的列表中的第一个元素将包含两次 circle\
  \ ID，所以我们取从第二个元素开始的切片。然后我们将每对追加到 pairs 列表并返回它：\n\n```\ndef get_user_circle_pairs(circles):\n\
  \    pairs = []\n    for circle in circles:\n        circle_pairs = [[user, circle[0]]\
  \ for user in circle]\n[1:]\n        [pairs.append(pair) for pair in circle_pairs]\n\
  \    return pairs\n```\n\n9. 一旦此函数定义完成，我们可以将 circle 数据传递给此函数，然后将相关输出打印到控制台：\n\n\
  ```\npairs = get_user_circle_pairs(circles_raw)\nprint(pairs)\n```\n\nprint() 的结果将显示\
  \ circle ID/user ID 配对。借助这种更易于消费的数据格式，我们可以继续将 circle ID 属性添加到图中的 Users。\n\n10. 一旦此函数定义完成，我们可以将\
  \ circle 数据传递给此函数，然后将相关输出打印到控制台。\n\n11. 我们需要为向 Neo4j 添加数据定义另一个函数。让我们称之为 add_circles_neo4j()。它将接收用户\
  \ ID、circle ID 和经过身份验证的 Neo4j 连接。正如我们在 add_edge_neo4j() 中所做的那样，我们将使用 f 字符串创建 Cypher\
  \ 查询以替换字符串的一部分。我们的查询将使用 MATCH 查找具有特定用户 ID 的 User 节点，然后使用 SET 将 circle 属性添加到该节点。然后，只需使用\
  \ connection.query() 将写查询执行到 Neo4j 数据库即可：\n\n```\ndef add_circles_neo4j(user_id,\
  \ circle_id, connection):\n    cypher = f'MATCH (u:User {{userID: \"{user_id}\"\
  }})' \\\n```\n\n```\nf'SET u.circle = \"{circle_id}\"'\nconnection.query(cypher)\n\
  ```\n\n+   12. 在定义了添加 `circle` 属性的函数后，让我们为每个用户 ID/circle ID 对运行 `add_circles_neo4j()`：\n\
  \n```\nfor user_id, circle_id in pairs:\n    connection = Neo4jConnect('bolt://localhost:7687',\
  \ 'admin', 'testpython')\n    add_circles_neo4j(user_id, circle_id, connection)\n\
  \    connection.close()\n```\n\n+   13. 前往 Neo4j Browser 并通过实现类似于以下内容的 Cypher 查询来确认是否已为\
  \ User 添加了所需属性：\n\n```\nMATCH (u:User) RETURN u.circle\n```\n\n我们的图数据库目前已设置了 Twitter\
  \ 数据的模式，在 Circles 功能的假设更改之前。现在，假设请求了一个新功能，允许用户成为多个 Circle 的成员。需要对模式和数据库进行更改以反映此新功能产生的数据。\n\
  \n在下一节中，我们将介绍如何更改模式以便在预模式更改时有效地更新。\n\n#### Updating the schema\n\n为了最好地说明为什么在允许每个用户拥有多个\
  \ Twitter Circles 时，我们可能更倾向于一种模式设计而不是另一种，我们将设想运行哪些查询来检索此数据。这些将在以下步骤中概述：\n\n+   1.\
  \ 目前，查找特定 circle 中的用户，当用户只能有一个时，可以通过简单的 MATCH 指定 `circle` 属性来完成：\n\n```\nMATCH (u:User\
  \ {circle: '5'}) RETURN u\n```\n\n+   2. 然而，如果我们开始向 `circle` 属性添加内容以存储用户所属的额外 circle\
  \ 的额外信息，例如作为列表，我们就需要更改此查询以包含 WHERE 语句并定位特定的 circle：\n\n```\nMATCH (u:User)\nWHERE\
  \ '5' in u.circle RETURN u\n```\n\n运行 Cypher 后，Neo4j Browser 窗口中的查询将如下所示：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_171_0.png)\n\
  \nFigure 7.8 – Follower connections with the updated schema\n\n3. 现在，虽然当每个用户的 circle\
  \ 数量较少时，这种查询是可以接受的，就像此功能更新发布时可能的情况一样，但随着用户成为越来越多 circle 的成员，这可能会扩展得非常糟糕。随着列表长度的增加，数据库引擎需要搜索越来越长的列表才能找到特定\
  \ circle 的成员。如果我们要查找共享多个 circle 的用户，或者如果我们尝试查找不互相关注但共享一个 circle 的用户以推荐新的 Twitter\
  \ 用户，查询也可能变得非常复杂。通过提前规划，我们可以避免这些性能陷阱，因为数据库随着时间的推移变得越来越庞大。\n\n4. 相反，我们可以重构数据库并将模式更改为图\
  \ 7.5 中的模式，其中 circles 作为节点添加而不是属性。有了此模式，我们可以更好地利用我们的数据，因为基于路径的查询以查找远距离用户和 circles\
  \ 之间的关系更容易计算。\n\n5. 重要的是，考虑到在此示例中我们的数据库为活跃平台提供服务，我们不能像在前几章中所做的那样运行类似 MATCH (n) DETACH\
  \ DELETE n 的操作。我们希望保留数据库中当前的数据以继续支持应用程序的当前状态。\n\n6. 因此，我们将首先根据新模式添加数据，并在假设的功能部署完成时，删除符合旧的一用户一\
  \ circle 数据模型的数据。\n\n\n\n\n``` \n'MERGE (u)-[:MEMBER_OF]->(c)'\nconnection.query(cypher)\n\
  ```\n\n12. 在此步骤中，我们可以使用 `add_circles_neo4j_new_schema()` 来通过遍历 `pairs2` 中的用户/圈子对向图中添加圈子节点：\n\
  \n```\nfor user_id, circle_id in pairs2:\n    connection = Neo4jConnect('bolt://localhost:7687',\
  \ 'admin', 'testpython')\n    add_circles_neo4j_new_schema(user_id, circle_id, connection)\n\
  \    connection.close()\n```\n\n13. 在添加了新的 Circle 节点后，让我们转到 Neo4j Browser 并创建一个\
  \ Cypher 查询来提取用户和圈子信息。我们的新模式允许我们使用 MATCH 来查找路径，而不是使用 WHERE 在大型属性列表中搜索，这是一种更适合图的查询类型。现在，我们可以使用\
  \ MATCH 来查找具有到特定圈子的 MEMBER_OF 关系的用户：\n\n```\nMATCH (u:User)-[:MEMBER_OF]->(c:Circle\
  \ {circleID: '5'})\nRETURN u, c\n```\n\n这会返回到特定圈子的 MEMBER_OF 关系，如 Neo4j Browser\
  \ 结果中可视化所示：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_173_0.png)\n\n图 7.9 – MEMBER_OF\
  \ 关系\n\n14. 我们需要做的最后一步，现在我们已经将新的图数据模型推广以反映我们对 Twitter Circles 的模拟更改，是删除旧数据。想象一下，现在我们的功能已完全上线，我们不再使用\
  \ User 节点上的 circle 属性，而是改用 Circle 节点来向应用程序的前端呈现信息。由于\n\n从这一点开始，我们研究了构建初始模式（标记为更改前模式），它涉及\
  \ Python 和 Neo4j 脚本（用 Cypher 查询语言编写）的组合。\n\n最后，最后一个阶段是考虑到我们所学到的所有内容并将其应用于我们更新的模式设计。\n\
  \n本章重点介绍了构建处理不断演进和更新模式所需的一切内容，这是在设计时应尽可能牢记的事情。\n\n在下一章中，我们将进一步在我们迄今为止获得的所有知识的基础上进行构建，当我们研究图投影以及它们如何用于下游分析任务时。这些投影可以包含主图在分析上相关的、潜在聚合的拓扑和属性信息。此存储视图将包含图的在分析上相关的、潜在聚合的拓扑属性信息。\n"
- '# 第 4 部分：像专业人士一样构建图


  在本部分中，我们将探讨图投影是什么以及如何使用它们。这将为您提供提取投影以执行分析所需的初步知识。这些投影随后可以提取用于进一步的统计和分析用途。您将在本章中了解如何做到这一点。此外，您还将了解如何将投影导出到
  igraph 和 Neo4j。系好安全带，让分析随着使用案例的展开而流动，该案例研究了使用诸如 *acted in* 和 *starred with* 等关系的电影分析。


  最后，常见错误和调试部分深入探讨了我们在职业生涯中遇到的错误类型，以及如何轻松绕过并有效解决这些错误和 bug。让我们将此视为每当代码中出现任何异常情况时您的参考。


  本部分包含以下章节：


  - *第 8 章，完美投影*

  - *第 9 章，常见错误和调试*

  '
- "## 完美投影\n\n在本章中，我们将重点关注创建图投影，您可以在其上执行复杂的分析，甚至使用机器学习和统计方法等其他算法来形成洞察。我们将首先解释投影是什么，然后介绍如何在实践中使用投影。我们将借鉴您如何在\
  \ igraph 和 Neo4j 中创建投影，使用 Cypher 查询语言和 Python 的组合。\n\n对于我们的用例，我们将重点关注热门电影，重点使用图数据科学来查找演员出演过的电影、共同主演的电影以及我们可以用灵活的图结构定义的其他多种关系。到本章结束时，您将能够为您的用例创建投影并将其投入使用。\n\
  \n我们将涵盖以下主要主题：\n\n- 什么是投影？\n- 如何使用投影\n- 让投影发挥作用\n\n### 技术要求\n\n我们将使用 Jupyter Notebook\
  \ 运行我们的编码练习，这需要 `python>=3.8.0`，以及以下需要使用 `pip install` 命令安装到您环境中的软件包：\n\n- `neo4j==5.5.0`\n\
  - `igraph==0.9.8`\n- `matplotlib==3.6.3`\n\n对于本章，您还需要安装 Neo4j Desktop。请参阅 *第 5 章，操作图数据库*\
  \ 的 *技术要求* 部分，如果 Neo4j 尚未安装，因为它将需要用于跟随本章中的教程。\n\n所有包含编码练习的笔记本都可在以下 GitHub 链接获得：`https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH08`。\n\
  \n### 什么是投影？\n\n图数据模型中的数据通常包含事物之间的关系，无论是人、语言、交通枢纽，还是我们在前几章中看到的其他示例。许多数据模型具有多种类型的节点和关系，使得一个节点或边在含义或价值上不等于另一个。\n\
  \n这类图被称为异构图，我们在本书中已多次看到它们。一种异构图是二分图，其中有两种类型的节点。在二分图中，只有不同类型的节点才能共享边。例如，引用网络可以用二分图表示，作者与他们撰写的文章相连。\n\
  \n使用多种节点和边类型的异构图的分析可能很棘手。为了说明这一点，首先考虑 *图 8.1* 中的作者图。我们可以轻松地使用该图的原生结构回答一些简单问题，例如使用节点度找到作者撰写的文章数量，或者相反，使用相同方法找到一篇文章的作者数量。\n\
  \n然而，要衡量作者群体合作的倾向，例如使用社区检测等算法（我们在 *第 4 章，构建知识图谱* 中使用过），我们需要遍历文章和作者之间的路径才能找到合理的社区。在二分图上运行社区检测等算法的结果在尝试检查仅作者或仅文章的群体的连通性时可能并不一定有意义：\n\
  \n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_180_0.png)\n\n图 8.1 – 二分作者图的示例\n\n为了回答这些主要涉及作者而非文章本身的问题，我们可以使用投影。投影是图的表示形式——通常是复杂网络的简化版本。投影通常将图数据\
  \ *折叠* 成特定实体之间更简化的交互，这意味着在转换过程中信息会丢失。虽然信息会丢失，但分析变得更容易、更直观，并允许对图提出更直接的问题。\n\n*图 8.2*\
  \ 包含 *图 8.1* 所示二分图的单分投影。该图现在仅包含 **Author** 节点，如果原始二分图节点共享对同一合著 **Article** 的关系，则它们共享一条边。通过此投影，我们丢失了某些信息，例如每对作者合作的个别文章。然而，我们获得了在同构图上运行图算法的能力，例如前面提到的社区检测。我们可以在图仅包含\
  \ Author 节点时算法地将图 sensibly 分割为作者社区：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_181_0.png)\n\
  \n图 8.2 – 作者图的对应单分投影\n\n其他类型的异构网络可能更复杂，具有众多节点和边类型，例如知识图。\n\n知识图可以以高度复杂的模式表示大量信息——例如，包含详细客户信息的图，可能包含信息相互关联的许多不同方式。\n\
  \n*图 8.3* 显示了示例客户图数据库的样本，其中包含许多类型的节点和关系。在这种情况下，与二分图不同，简单的图度量，例如某些类型节点的度，将为您提供很少有用的信息。如果我们找到\
  \ **Customer**\n\n\n此图中的节点是客户购买的产品与其地址信息的合并。\n\n此外，在图形数据模型中，节点和关系类型数量众多时，以高效方式提出某些类型的问题可能很困难。考虑如何将地址信息与所购产品的品牌关联起来；我们必须遍历三条关系才能从\
  \ Address 节点到达 Brand 节点：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_182_0.png)\n\
  \n图 8.3 – 异构客户数据图\n\n这里，我们可能会考虑使用客户数据的图投影来回答特定问题，尤其是如果我们经常向图数据库提出此类问题，例如作为推荐系统的一部分。\n\
  \n为了回答品牌与客户地址之间关系的问题，我们可以将这两种节点类型之间的路径压缩为一条边。这样做会丢失地址如何通过客户和产品与品牌关联的信息，但通过大幅减少在这些节点之间遍历所需的中继跳数，大大提高了回答这些节点类型之间关系问题的效率。现在我们可以轻松计算与某个地址关联的品牌数量，或者世界上哪些地点与购买特定品牌产品相关。\n\
  \n这些与不同地址关联的品牌可以在下图中看到，其中建立了 HAS_PURCHASE_FROM 边到节点关系：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_183_0.png)\n\
  \n图 8.4 – 复杂异构客户数据的二部投影\n\n既然你已经了解了为什么我们可能会使用投影，我们将在下一节将该想法付诸实践。我们将探索一个大型电影信息数据集，创建投影以回答在异构知识图谱中难以回答的一些问题，并使用\
  \ Neo4j 中的一些技巧以高效方式处理数据。\n\n### 如何使用投影\n\n以下步骤将涉及设置 Neo4j 实例、创建数据存储以及使用 Cypher 处理我们的投影。这将结合我们在后续章节中学到的技能并将其集中应用：\n\
  \n- 1. 首先像前几章那样创建一个新的 Neo4j 数据库，用于存储电影知识图谱。我们将其命名为 Projection DB，并再次使用密码 testpython，然后启动数据库。\n\
  - 2. 正如我们在第 5、6、7 章中详述的那样，我们将使用 `:server user add`（在 Neo4j Browser 中）创建一个新的管理员用户，用户名为\
  \ admin，密码为 testpython，并添加 PUBLIC 和 admin 角色。有关如何执行此操作的更详细信息，请回顾前三章中的任何一章。\n- 3.\
  \ 在本章中，由于我们的数据集较大，我们将使用 LOAD CSV 将数据导入 Neo4j。为此，我们必须先将 movie.csv 移动到 Neo4j 可以访问的文件夹中。\n\
  \n在 Neo4j Desktop 主窗口中，点击 Projection DB 旁边的 ... 图标，然后选择 Open folder | Import。这将在文件资源管理器中打开该数据库的数据导入文件夹，我们应将\
  \ movie.csv 复制到其中（可在配套的 GitHub 仓库的 data 文件夹中找到）。\n\n4. 我们还将使用 Neo4j 的 Awesome Procedures\
  \ on Cypher（APOC）插件（https://neo4j.com/labs/apoc/4.1/installation/）进行数据导入步骤。要安装它，请转到\
  \ Neo4j Desktop 主窗口，选择 Projection DB 数据库，在窗口右侧找到 Plugins 选项卡。点击此选项卡，在 APOC 下方点击\
  \ Install and Restart。\n\n5. 安装完成后，重启 Projection DB 数据库。\n\n6. 完成所有这些设置后，是时候考虑向数据库添加数据了。一如既往，为了了解我们处理的数据，让我们查看添加至数据库导入文件夹的\
  \ movie.csv 文件的前几行：\n\n```\n002 Operazione Luna,COUNTRY,Italy\n002 Operazione Luna,DIRECTOR,Lucio\
  \ Fulci\n002 Operazione Luna,STARRING,Ciccio Ingrassia\n002 Operazione Luna,STARRING,Franco\
  \ Franchi\n002 Operazione Luna,STARRING,Linda Sini\n```\n\n这里我们看到 movie.csv 包含边数据，第一列和第三列包含相关实体的名称。通过检查，这些实体可以是不同类型的电影相关数据。每个实体通过第二列中的概念（COUNTRY、DIRECTOR\
  \ 等）相关联。这种数据结构在创建图数据库时很常见，每一行被称为一个三元组。\n\n7. 这次，我们的数据集似乎比以前处理的大得多。在将其加载到 Neo4j 之前，我们应该检查导入数据的一些属性。在\
  \ Python 中，我们可以读取数据集并首先检查行数：\n\n```\nimport csv\nwith open('./data/movie.csv', 'r')\
  \ as c:\n    reader = csv.reader(c)\n    data = [line for line in reader]\n\nprint(len(data))\n\
  ```\n\n8. 从 print 语句可以看到，movie.csv 包含超过 410,000 个三元组。我们还可以通过取第二列的 `set()` 来检查将要导入\
  \ Neo4j 数据库的边类型数量：\n\n```\nedge_types = set([triple[1] for triple in data])\nprint(edge_types)\n\
  ```\n\n这表明 movie.csv 中有四种不同的边类型：AWARD、DIRECTOR、COUNTRY 和 STARRING。这意味着我们的节点实体必须对应于奖项、导演、国家和演员，以及它们关联的电影。现在我们对可访问的数据有了更好的了解，可以设计\
  \ Neo4j 数据导入的方法。\n\n随后使用 YIELD，它传递 `apoc.create.relationship` 的输出。我们可以传递 rel 输出，但不会使用它，因为我们正在写入图，不需要使用任何返回值。类似地，我们的子查询要求返回某些内容，但由于我们不需要，可以返回一个虚拟变量\
  \ x：\n\n```\n:auto LOAD CSV FROM 'file:///movie.csv' AS row\nCALL {\n    WITH row\n\
  \    MERGE (n:Entity {name:row[0]})\n    MERGE (m:Entity {name:row[2]})\n    WITH\
  \ n, m, row[1] as type\n    CALL apoc.create.relationship(n, type, {}, m)\n    YIELD\
  \ rel\n    RETURN 1 as x\n} IN TRANSACTIONS OF 1000 ROWS\nRETURN x\n```\n\n此查询将分批运行，根据\
  \ Neo4j 数据库运行的机器，可能需要几分钟。数据加载完成后，我们可以在 Neo4j Browser 中运行查询来检查数据结构是否符合预期。\n\n14.\
  \ 让我们查找一条应该存在于数据库中的边，例如对应于 movie.csv 中第一行的边。该边有两个实体：电影 002 Operazione Luna 和 Italy，通过\
  \ COUNTRY 边连接。我们可以使用 Cypher 匹配此边并返回它，以确认它在 Neo4j 中存在。运行此查询后，我们应该在 Neo4j Browser\
  \ 中看到节点和 COUNTRY 边被返回：\n\n```\nMATCH (n:Entity {name:'002 Operazione Luna'})-[:COUNTRY]-(m:Entity\
  \ {name:'Italy'})\nRETURN n, m\n```\n\n匹配到电影的国家将显示在图形关系图中：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_186_0.png)\n\
  \n图 8.5 – 边上的实体匹配\n\n将电影数据集加载到持久化数据库后，我们可以创建各种投影，以使用图数据回答不同问题。如果我们想查看哪些演员在各种电影中合作过，我们可以创建联合主演演员的投影。我们还可以创建投影，更深入地探讨哪些电影拥有共同演员，以及这在多大程度上受到拍摄国家的影响。接下来我们将解决如何生成这两个投影，然后再使用投影来合理且高效地分析数据。\n\
  \n### 在 igraph 中创建投影\n\n让我们在 Python 中创建第一个投影，从 Neo4j 数据库读取数据并导入 igraph。为此，我们将使用一个我们创建的包来导入在这些图项目中反复使用的函数。我们将使用的函数是\
  \ Neo4jConnect，可以从 graphtastic 包中导入，该包位于配套的 GitHub 仓库中（本章 Technical requirements\
  \ 部分提供了链接）。以下步骤将介绍导入此模块以连接 Neo4j，然后如何逐步使用 igraph 和 Python 创建投影。让我们开始吧：\n\n- 1. 从\
  \ graphtastic 包导入 Neo4jConnect 类：\n\n```\nfrom graphtastic.database.neo4j import\
  \ Neo4jConnect\n```\n\n- 2. 有了连接 Neo4j 数据库的类和方法，我们现在可以思考如何以图投影的形式从 Neo4j 获取一些数据。我们目标的投影是包含演员在电影中合作共演信息的图。在\
  \ Neo4j 数据库中，我们有 STARRING 关系，它将电影 Entity 节点连接到演员 Entity 节点。\n\n- 3. 让我们通过在 Neo4j\
  \ Browser 中使用一些 Cypher 查询一对共同出演同一部电影的演员，快速查看这些关系。这里，我们可以通过使用特定 STARRING 关系类型的 MATCH\
  \ 来识别正确的 Entity 节点类型：\n\n```\nMATCH (act1:Entity)<-[:STARRING]-(film:Entity)-[:STARRING]->(act2:Entity)\n\
  RETURN act1, film, act2 LIMIT 1\n```\n\n从浏览器结果中我们可以看到演员通过电影相互连接。但在我们的投影中，我们希望连接共同主演的演员。因此，我们在\
  \ Python 中运行以获取投影边数据的任何 Cypher 查询，都需要找到具有此模式的节点和边，并且只返回包含演员信息的节点。\n\n- 4. 知道了这一点，我们可以在\
  \ Python 中编写一个方法来访问这些演员数据，即 get_co_stars_neo4j()。该方法只需一个 Neo4j 连接对象，并使用我们在 Neo4j\
  \ Browser 中通过 MATCH 语句找到的模式来查找共同主演的演员。我们只需要返回模式边缘的节点，此处别名为 act1 和 act2。我们使用 connection.query()\
  \ 方法执行查询，并使用 result.data() 访问包含查询结果的字典列表。最后一步，我们通过访问\n\n\n\n我们最终得到的节点名称属性包含在字典中，接下来将这些属性转换为共同出演演员的两两列表：\n\
  \n```\ndef get_co_stars_neo4j(connection):\n    query = 'MATCH (act1:Entity)<-[:STARRING]-(film:Entity)'\
  \  \\\n            '-[:STARRING]->(act2:Entity)  '  \\\n            'RETURN act1,\
  \ act2'\n\n    result = connection.query(query).data()\n    result = [[act['act1']['name'],\
  \ act['act2']['name']] for act in result]\n\n    return result\n```\n\n5. 现在，我们可以使用包含凭据的\
  \ Neo4jConnect 类创建 Neo4j 连接，调用 `get_co_stars_neo4j()` 获取共同出演演员的配对，之后记得关闭数据库连接。让我们打印前几对数据，确保一切符合预期：\n\
  \n```\nconnection = Neo4jConnect('bolt://localhost:7687', 'admin', 'testpython')\n\
  co_stars = get_co_stars_neo4j(connection)\nconnection.close()\nprint(co_stars[:5])\n\
  ```\n\n6. 有了包含演员配对的列表的列表，我们实际上就拥有了 Python 中的边列表，可以用它创建图。正如前面章节所介绍的，我们还需要节点列表和属性列表才能在\
  \ igraph 中组装图。\n\n7. 我们可以使用双重列表推导式获取边列表中的所有节点，再对该列表取集合，从而得到唯一节点列表：\n\n```\nnodes\
  \ = list(set([node for edge in co_stars for node in edge]))\n```\n\n8. 此外，我们可以通过创建字典为这些节点分配递增的整数\
  \ igraph ID。使用字典推导式，在唯一节点列表上调用 `enumerate()`，为每个节点创建映射后的递增 ID：\n\n```\nigraph_ids\
  \ = {film:node_id for node_id, film in enumerate(nodes)}\n```\n\n9. 在 igraph 中，我们需要使用这些新\
  \ ID 向图添加边，因此必须将每个节点名称替换为 `igraph_ids` 中对应的唯一 igraph ID。我们可以再次使用推导式完成此项任务，得到一个对应于我们影片的整数对边列表：\n\
  \n```\nedgelist = [[igraph_ids[n], igraph_ids[m]] for n, m in co_stars]\n```\n\n\
  10. 现在我们已经拥有了组装图所需的一切：\n\n    - I. 首先导入 *igraph*，并使用 `igraph.Graph()` 创建一个空图。\n\n\
  \    - II. 接下来，使用 `add_vertices()` 向图添加节点，数量等于我们唯一 *igraph* 节点 ID 的数量。\n\n    -\
  \ III. 然后，通过图对象 `g` 的 `add_edges()` 方法，并将 ID 边列表作为参数传入，来连接这些节点。\n\n    - IV. 最后，通过访问\
  \ `g.vs`，我们可以将演员属性按列表方式添加到每个节点，这些属性就是唯一节点列表中每位演员的名称：\n\n```\nimport igraph\ng =\
  \ igraph.Graph()\ng.add_vertices(len(igraph_ids))\ng.add_edges(edgelist)\ng.vs['actor']\
  \ = nodes\n```\n\n11. 作为最后一步，我们应该确保图的元素符合预期。我们可以使用 Python 中的 `assert` 语句来确保节点属性的命名正确，将其与节点演员名称列表进行比较。我们还可以确保节点数量符合预期：\n\
  \n```\nassert g.vs[2]['actor'] == nodes[2]\nassert len(g.vs) == len(nodes)\n```\n\
  \n12. 为了最终确认我们的投影已按预期应用，让我们在 *igraph* 图中找到一条边，并在 Neo4j 中存储的原始图数据库中找到对应的路径。首先，为找到\
  \ *igraph* 图中一条边上的节点，我们可以访问图的 `g.es` 属性，并通过依次访问 `source` 和 `target` 属性，找到索引为 0 的边所连接节点的\
  \ ID。然后，使用这些 *igraph* 节点 ID，将该索引传入 `g.vs`，找到我们将在 Neo4j 中查找对应路径所用的演员属性，并将它们赋值给 `actor1`\
  \ 和 `actor2` 变量：\n\n```\nactor1 = g.vs[g.es[0].source]['actor']\nactor2 = g.vs[g.es[0].target]['actor']\n\
  ```\n\n13. 现在，我们可以使用 Neo4jConnect 打开一个到 Neo4j 的连接，并将这些演员名称插入 Cypher 查询中。我们可以使用 f-strings\
  \ 构造有效的 Cypher 查询，查找我们最初查询 Neo4j 以创建投影时的 Entity | Film | Entity 模式。返回演员和影片后，使用 `.data()`\
  \ 创建结果字典，然后使用 `.close()` 关闭连接，并将其打印到控制台：\n\n```\nconnection = Neo4jConnect('bolt://localhost:7687',\
  \ 'admin',\n'testpython')\nquery = f'MATCH (act1:Entity {{name:\"{actor1}\"}}) \\\
  \n          <-[:STARRING]-(film:Entity)' \\\n        f'-[:STARRING]->(act2:Entity\
  \ {{name:\"{actor2}\"}}) ' \\\n        'RETURN act1, film, act2'\nresult = connection.query(query).data()\n\
  connection.close()\nprint(result)\n```\n\n这里的 print 语句应显示原始图中的有效路径，与我们在 igraph 中投影的边相对应，从而确认投影已正确创建：\n\
  \n```\n[{'act1': {'name': 'Roger Pryor (actor)'}, 'film': {'name': 'The Man with\
  \ Nine Lives (film)'}, 'act2': {'name': 'Boris Karloff'}}]\n```\n\n至此，我们从 Neo4j\
  \ 中原始、复杂的知识图谱中提取了共同出演演员的投影，并将其设置在 igraph 中，以便进行进一步分析。我们将在最后一节回到这个投影，进一步探索这些数据。现在，我们将回到\
  \ Neo4j 浏览器，介绍另一种生成投影的方法，以备需要更持久地存储投影时使用。\n\n### 在 Neo4j 中创建投影\n\n虽然 Python 中的投影支持一些高度高级的数据分析，但它存储在内存中，因此不是持久的。如果我们想要一个可重复访问或需要长期存储的投影，我们可能也希望使用像\
  \ Neo4j 这样的图数据库。要构建我们的 Neo4j 投影，我们需要执行以下步骤：\n\n1. 在 Projection DB 中，接下来我们将创建一个投影，将影片按照共享演员及其拍摄国家连接起来，以便进行更多分析。就本章而言，我们可以将这个投影与原始图数据一起存储，只要确保使用新的标签和边类型来保持该图独立即可。这可以防止之后在查询图获取见解时混淆信息。\n\
  \n2. 我们的新图将包含具有 name 属性的 Film 节点。正如我们对主要电影信息图所做的那样，我们首先为 Film 节点在 name 属性上创建索引。这将大幅加快使用影片名称进行匹配的操作。我们将使用本章前面“如何使用投影”部分第\
  \ 9 步中相同的语法：\n\n```\nCREATE INDEX film\nFOR (f:Film)\nON f.name\n```\n\n3. 接下来，我们可以继续查询现有的\
  \ Entity 节点以获取特定信息，并将这些信息添加到新的独立图投影中。这里我们将再次使用一些相当高级的 Cypher，并再次借助 APOC 插件。这次，我们使用\
  \ `apoc.periodic.iterate()` 函数将查询的执行分批进行。这可以防止 Neo4j 一次性加载过多数据到内存中，从而避免因达到内存限制而引发错误。我们将通过使用\
  \ CALL 调用 `periodic.iterate()` 来启动此查询，后面跟一个左括号，其中第一个参数包含匹配 Entity 节点的 Cypher 逻辑。我们希望在投影中连接具有共同演员的影片，因此需要匹配包含两部影片的路径，每部影片都与另一个实体具有\
  \ STARRING 关系，且该实体包含一位演员。路径匹配后，我们通过返回 film1 和 film2 结束第一个 Cypher 字符串，这两个节点就是我们想要添加到投影中的节点。\n\
  \n在 `periodic.iterate()` 中，第二个参数包含另一个 Cypher 字符串，其中包含对前一个查询返回结果进行处理的逻辑。对于找到的每条路径，我们希望合并两个新的\
  \ Film 节点，并为它们设置 name 属性。然后，我们可以将新创建的节点别名 f1 和 f2 用 HAS_COMMON_ACTORS 边连接起来。函数的最后一个参数是一个字典，包含如何执行批处理查询的信息。`batchSize`\
  \ 值为 1000 告诉函数先从第一个 Cypher 查询参数中查找 1,000 条结果，然后再用这些结果执行第二个参数的 Cypher。我们传入的另一个选项是\
  \ `parallel`，当设为 True 时，允许以每批 1,000 条进行并行处理。在这个特定案例中，并行处理这些批次会因为更新期间节点锁定而导致错误，我们将在第\
  \ 9 章“常见错误与调试”中详细讨论。现在，让我们用右括号结束这个复杂的 APOC 函数，并在 Neo4j 浏览器中运行查询：\n\n```\nCALL apoc.periodic.iterate(\n\
  \  \"MATCH (film1:Entity)-[:STARRING]->(actor:Entity)\n    <-[:STARRING]-(film2:Entity)\n\
  \  RETURN film1, film2\",\n  \"MERGE (f1:Film {name:film1.name})\n  MERGE (f2:Film\
  \ {name:film2.name})\n  MERGE (f1)-[:HAS_COMMON_ACTORS]->(f2)\",\n  {batchSize:1000,\
  \ parallel:false}\n)\n```\n\n这个批量查询可能需要几分钟才能运行完成，具体取决于运行它的机器配置。完成后，Neo4j 浏览器将显示完成\
  \ `apoc.periodic.iterate()` 任务所需的批次数，以及是否有任何批次失败。如果我们此处使用了 `parallel:true`，很可能会注意到一些批次失败，并且由于可能同时写入相同节点，一些写操作将无法完成。\n\
  \n4. 图结构设置好后，我们现在可以向节点添加额外属性。对于我们的图投影，我们关注影片拍摄的国家，而在主图中，这些关系由 COUNTRY 边表示。我们可以将此关系转换为一个属性，即影片拍摄国家列表。\n\
  \n\n\n\n\n2. 我们投影中的节点数量很有用，但我们本可以通过在原始知识图谱中搜索具有传入 STARRING 关系的唯一节点来找到数据中 Actor 节点的数量。边的数量相当于共同出演的演员数量，找到起来会稍微复杂一些，但这将涉及搜索与我们构建投影时所搜索的模式相同的唯一路径。\n\
  \n3. 让我们继续讨论一个使用知识图谱计算会更棘手，而使用投影则很简单的问题——度分布。通过从影片开始并返回到每位代表演员的节点的共同主演来搜索路径，以找到共同主演的数量，在原始图数据中会非常耗时。然而，有了我们的共同主演投影，我们只需统计每个节点关联的边数即可。\n\
  \n4. 我们可以使用 igraph g 对象上的 degree() 方法，找到每个 Actor 节点的边数，从而得出每位演员拥有的共同主演数量：\n\n```\n\
  degree = g.degree(igraph_ids.values())\n```\n\n5. 让我们绘制图的度分布，以了解更多关于其结构的信息。我们可以通过导入\
  \ matplotlib.pyplot 并使用其 hist() 方法绘制节点度的直方图来实现。这里，我们对 y 轴使用对数刻度，因为现实世界的图通常具有长尾度分布。这些图有很多节点只有少量边，而少数节点则拥有大量边。使用\
  \ yscale('log') 将确保我们可以看到度分布右侧高度节点的频率：\n\n```\nimport matplotlib.pyplot as plt\n\
  plt.hist(g.degree(), bins=20, edgecolor='#1260CC',\ncolor='#3A9BDC')\nplt.xlabel('Node\
  \ degree')\nplt.ylabel('Frequency')\nplt.yscale('log')\nplt.show()\n```\n\n该图表显示了按节点度划分的频率直方图（表示与各节点相连的边数）：\n\
  \n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_195_0.png)\n\n果然，我们的共同主演图确实具有长尾度分布。这告诉我们，绝大多数演员只与少数其他演员共同出演过，而极少数演员在职业生涯中与数千人合作过。\n\
  \n我们还可以看到，在分布长尾的最右侧，我们有三个 Actor 节点，其影片中的共同主演数量不成比例。让我们检查一下这些演员是谁。\n\n- 6. 我们可以使用\
  \ `zip()` 通过访问节点度列表和 `g.vs['actor']` 的演员属性来创建度与演员名称配对的列表。`g.vs` 中每个节点的度结果顺序得以保留，因此我们可以安全地使用\
  \ `zip` 将它们并排放置。然后我们可以使用 `sorted()` 方法通过匿名函数按 `actor_degree` 列表中每对的第一元素进行排序，并使用\
  \ `reverse=True` 按降序排序：\n\n```\n```python\nactor_degree = list(zip(degree, g.vs['actor']))\n\
  actor_degree = sorted(actor_degree, key=lambda x: x[0],\nreverse=True)\nprint(actor_degree[:3])\n\
  ```\n```\n\n打印我们排序列表中的前三个演员显示，在我们的数据集中，Moe Howard、Larry Fine 和 Mithun Chakraborty\
  \ 是就与他人合作而言联系最紧密的演员，他们各自通过共同出演角色拥有约 3,000 条连接。\n\n### 探索连通分量\n\n我们图值得探索的另一个特征是连通分量的数量。如前几章所述，运行弱连通分量算法可以揭示我们的图是否完全连通，还是像现实世界图数据中经常出现的那样被分割成不相连的部分。在我们原始的知识图谱中，在进行投影之前，找到共同出演演员的连通分量会很困难。在知识图谱中使用弱连通分量算法并不能为我们提供关于演员关系的任何信息，而只是对我们图中的信息组件是否与其他存储的电影知识重叠的非常粗略的衡量。这将是一个非常粗粒度的衡量——国家节点和关系存在的可能性会使我们的知识图谱看起来比预期更紧密地连接。\n\
  \n以下步骤指导您如何探索构建的图中的连通分量：\n\n- 1. 有了投影，我们可以更可靠地询问关于共同主演演员之间连通性的特定问题——在我们的数据中，是否有完全与其它共同主演群体断开的演员群体？为回答这个问题，让我们在\
  \ Python 中使用 igraph 的 components() 方法在图上运行弱连通分量算法。在此指定 mode='weak' 参数可确保我们仍然将边视为连接，而不管方向如何。这很重要，因为虽然边可以在\
  \ igraph 中以源和目标存储，但就共同主演演员图而言，边的方向无关紧要：\n\n```\ncc = g.components(mode='weak')\n\
  print(len(cc))\n```\n\n打印连通分量对象的长度，我们可以看到我们的图包含超过 3,000 个分量，因此远非完全连接。在我们的数据中存在孤立的演员孤岛，它们在图中通过共同出演电影与其它演员没有任何联系。\n\
  \n- 2. 我们可以通过查看最大连通分量的大小来进一步探索这一点。使用列表推导式，我们可以获取每个分量的长度，对应其节点数，并按降序对长度列表进行排序。打印列表切片将显示前几个分量的大小：\n\
  \n```\ncc_size = [len(component) for component in cc]\ncc_size.sort(reverse=True)\n\
  print(cc_size[:10])\n```\n\n我们的最大分量有 71,115 个节点，几乎构成了整个图。按大小排名第二和第三的分量分别只有 45 和\
  \ 34 个节点，因此似乎在我们的共同演员图中，弱连通分量的大小也呈现长尾分布。\n\n- 3. 由于从最大分量到接近最大分量的大小急剧减少，而总共又有超过 3,000\
  \ 个连通分量，我们可能还想检查规模较小端的分量大小。我们可以使用 Python 内置 `collections` 模块中的 `Counter()` 来完成此操作，它会将我们的连通分量大小列表\
  \ `cc_size` 转换为大小和频率的字典。然后我们可以通过另一个匿名函数按其键（包含分量大小）对该字典进行排序，以找到分量大小的频率，从大到小：\n\n\
  ```\n```python\nfrom collections import Counter\ncc_freq = dict(Counter(cc_size))\n\
  cc_freq = sorted(cc_freq.items(), key=lambda x: x[0],\nreverse=True)\nprint(cc_freq)\n\
  ```\n```\n\n从 Python 控制台的输出中，我们可以看到我们有大量与图完全分离的微小分量。打印列表中的每个元组，第一元素包含分量大小，第二元素包含该大小的分量数量：\n\
  \n```\n```text\n[(71115, 1), (45, 1), (34, 1), (30, 2), (25, 1), (24, 1), (23,\n\
  3), (22, 2), (20, 1), (19, 2), (18, 2), (17, 3), (16, 5), (15,\n7), (14, 5), (13,\
  \ 5), (12, 8), (11, 17), (10, 23), (9, 37), (8,\n69), (7, 86), (6, 125), (5, 242),\
  \ (4, 416), (3, 675), (2, 1157),\n(1, 522)]\n```\n```\n\n最常见的分量大小是 2，可能来自在同一部电影中主演过且在我们的数据集中尚未主演过其他电影的演员。\n\
  \n### 探索图中的团\n\n到目前为止，我们已使用共同主演投影查看了一些使用主要数据源知识图谱来计算或解释会很困难的图特征。让我们看看如何回答不同类型的问题。\n\
  \n有一群演员经常出现在同一部电影中。对于使用投影进行更高级类型的分析，我们可能希望识别出在职业生涯中某个阶段全部互相出演过的演员群体。我们可以通过在图中寻找\
  \ *cliques* 来做到这一点。\n\n在图论中，clique 是网络中任何给定子图中一组节点彼此全部相互连接。如果该子图本身就是一个完整的图，我们称其为\
  \ *fully connected*。\n\n\n\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_198_0.png)\n\
  \n在我们最初的知识图谱模式中，在进行投影之前，我们无法使用任何常规的团查找算法来寻找联合主演，因为节点会通过两条边和一个电影节点相关联。我们本可以编写一个自定义的、更复杂的方法，使用原始数据结构来查找联合主演的团，但由于需要遍历额外的边，这可能会导致性能更差。\n\
  \n相反，借助我们的投影，我们可以使用 *igraph* 及其 `largest_cliques()` 方法来查找图中最大的完全连通子图。这会返回一个集合内的节点列表。因此，让我们使用列表切片取出该列表的第一个元素，以简化输出。\n\
  \n在接下来的步骤中，我们将探索演员中最大的团：\n\n1. 我们可以查看最大的联合主演团的大小以及其中包含哪些节点：\n\n   ```python\n  \
  \ largest_clique = g.largest_cliques()[0]\n   print(len(largest_clique))\n   print(largest_clique)\n\
  \   ```\n\n2. 我们的打印语句显示，投影中最大的团由 65 个节点组成。我们还可以看到属于该团的节点 ID，但检查这些节点代表哪些演员会更有意义，因此接下来我们使用图\
  \ g 的 `vs` 属性和我们的 `largest_clique` 列表来查找每个团节点的 actor 属性。\n\n   最后一步将揭示在我们的数据集中，那些在职业生涯中曾以某种方式相互合作过的演员：\n\
  \n   ```python\n   clique_actors = g.vs[largest_clique]['actor']\n   print(clique_actors)\n\
  \   ```\n\n我们已经对 *igraph* 中的联合主演投影进行了大量分析，并通过检查图结构深入了解了演员在电影中如何合作。\n\n在下一节中，我们还有第二个投影需要分析，它在某些方面与我们的联合主演网络互补。\n\
  \n我们之前在 Neo4j 中建立的投影表示具有共同演员的电影，因此让我们深入使用该投影来洞察其中存在的有趣模式。\n\n### 分析 Neo4j 电影投影\n\
  \n我们在 Neo4j 中的投影仅包含 `Film` 节点，如果它们有共同演员则共享一条边。让我们像之前在 *igraph* 中对联合主演投影所做的那样，首先描述我们图的一些基本信息。\n\
  \n以下步骤将告诉您需要在 Neo4j Browser 中执行的 Cypher 查询，以获得与我们在前几节中完成的 Python 分析类似的结果：\n\n1.\
  \ 首先，让我们在 Neo4j Desktop 中使用一个简单的 Cypher 查询来计算图中的节点数，使用 MATCH 仅查找 `Film` 类型的节点，并使用\
  \ `count()` 函数返回这些节点的数量：\n\n   ```cypher\n   MATCH (f:Film) RETURN count(f)\n  \
  \ ```\n\n   控制台输出显示，我们的投影中有 79,478 个 Film 节点。在创建投影时，我们不得不编写批处理查询来读写数据，而大约 80,000\
  \ 个节点通常不会给我们带来任何问题。\n\n2. 我们还要检查构建投影时创建了多少个 HAS_COMMON_ACTORS 关系，方法是在我们的 `Film`\
  \ 节点之间使用模式匹配该关系。这次，我们将关系别名为 r，并再次使用 `count()` 返回节点数：\n\n   ```cypher\n   MATCH (:Film)-[r:HAS_COMMON_ACTORS]->(:Film)\
  \ RETURN count(r)\n   ```\n\n   现在，我们找到了耗时投影存储的根源：我们的图包含 5,774,715 条边。这使我们的图投影总体上高度连通。回顾一下我们的投影代表什么，这是有道理的——对于数据集中的每个演员，根据其出演的每部电影，电影之间会产生许多\
  \ HAS_COMMON_ACTORS 关系。例如，当一个演员出演过五部电影时，在我们的投影中会生成一个由五个 Film 节点组成的团。考虑到许多演员出演的电影数量远不止五部，我们的共享演员投影的高度连通性也就不足为奇了。\n\
  \n3. 在我们的 Neo4j 投影中，`Film` 节点上有一个节点属性，其中拍摄国家会被添加到列表中，对应知识图谱数据中发现的每个拍摄国家。我们可以使用 `country`\
  \ 属性来分析电影之间的共同演员及其拍摄地点。\n\n4. 让我们编写一个 Cypher 查询，查找在不同国家拍摄但有共同演员的电影，并找出最常见的拍摄地点组合。我们可以从\
  \ MATCH 语句开始，仅指定投影中的 `Film` 节点和 `HAS_COMMON_ACTORS` 关系，并确保不查询同一数据库中存储的知识图谱的其余部分。然后，我们可以使用\
  \ WITH 访问 Film 节点的 country 属性，并将它们别名为 c1 和 c2。我们感兴趣的是共享演员但拍摄地点不同的电影，因此我们将使用 <> 运算符来比较国家。然后，使用\
  \ WITH 将国家列表配对，我们可以返回 country_pair 以及每个唯一配对的 count()，这会隐式聚合我们的结果。最后一步是按 count(country_pair)\
  \ 降序对结果排序，以便我们关注最常见的配对：\n\n   ```cypher\n   MATCH (f1:Film)-[:HAS_COMMON_ACTORS]->(f2:Film)\n\
  \   WITH f1.country as c1, f2.country as c2\n   WHERE c1 <> c2\n   WITH [c1, c2]\
  \ as country_pair\n   RETURN country_pair, count(country_pair)\n   ORDER BY count(country_pair)\
  \ DESC\n   ```\n\n   在我们的结果中，我们可以看到共享演员的电影的拍摄地往往非常接近，一些顶级结果是美国和加拿大。语言似乎也有影响，共享演员电影的另一个常见拍摄地组合是美国和英国。我们最常见的结果显示了一对\
  \ `Cinema of Hong Kong` 和 `Hong Kong`，这暗示我们的数据本可以从额外的清理中受益——这在抓取的语义数据中相当常见，并且有助于指导原始知识图谱的数据质量改进。\n\
  \n### 总结\n\n在本章中，我们使用 Python 和 Neo4j 创建、存储和分析图投影，展示了它们在结果效率和可解释性方面的强大能力。每种技术都有其各自的优势。与使用\
  \ Python 中的 *igraph* 轻松实现相比，在 Neo4j 中，我们难以直接使用复杂的图数据科学算法来分析投影。\n\n然而，使用 Neo4j 是一种更永久的存储选择，适用于可能需要重复读写的投影。对于任何特定用例，重要的是考虑当前任务最合适的投影创建和存储工具是什么。\n\
  \n您所获得的这些技能将使您能够轻松地在 Neo4j、Python 和 igraph 之间切换，并为在这两种技术之间构建管道奠定坚实的基础——这确实是天作之合。\n\
  \n在下一章，也就是最后一章中，您将了解图数据科学家常见的一些棘手问题。这些课程将重点介绍调试（事实上，在数据科学中，唯一的学习方式就是编写不完美的代码，然后像夏洛克·福尔摩斯一样去调试这些代码）。然后，我们将通过让您深入了解在图数据科学工作中会遇到的一些常见错误来帮助您。\n"
- "## 常见错误与调试\n\n在本章中，我们将解决新晋图数据科学家或工程师（读完本书后您就是其中之一）会遇到的一些常见错误。重点将放在如何调试图问题上。这将引出在使用\
  \ *igraph* 时遇到常见问题及如何解决。接下来，我们将看看常见的 Neo4j 问题，因为本书大部分内容都是与 igraph、Python 和 Neo4j\
  \ 打交道；因此，了解如何解决图数据库问题也很有用。我们还将讨论如何修改您的 *igraph* 和 Neo4j 脚本以获得最佳性能。\n\n这些部分下有许多示例，说明了这些问题可能出现的场景和原因。因此，读完本章后，您将完全准备好调试并解决项目中的这些常见问题。在接下来的部分中，您将深入探讨在使用\
  \ igraph、Neo4j 和用于图数据建模的 Python 库时可能遇到的常见错误和问题。\n\n总而言之，本章将涵盖以下主题：\n\n- 调试图问题\n\
  - 常见的 igraph 问题\n- 常见的 Neo4j 问题\n\n### 技术要求\n\n我们将使用 Jupyter notebooks 来运行编码练习，这需要\
  \ `python>=3.8.0`，以及以下包，这些包需要使用 `pip install` 命令安装到您的环境中：\n\n- `neo4j==5.5.0`\n\
  - `igraph==0.9.8`\n\n\n\n\n\n对于本章，你还需要安装 Neo4j Desktop。请参阅 *第 5 章，操作图数据库* 的技术要求部分，如果尚未安装\
  \ Neo4j，因为它将需要用于跟随本章中的教程。\n\n所有包含编码练习的笔记本都可在以下 GitHub 链接获得：`https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH09`。\n\
  \n### 调试图问题\n\n随着图数据模型和分析在行业中得到更广泛的应用，以及图数据库解决方案和软件日益流行，你很可能会遇到可以用图形方式解决的数据问题。与此同时，图解决方案对许多企业来说仍然相当新颖，作为图数据从业者，你几乎肯定会遇到错误和问题。\n\
  \n在这里，我们将介绍在使用 *igraph* Python 库时你可能会遇到的最常见问题，以及在使用 Neo4j 时可能看到的一些标准错误和问题。每个问题都将通过简短示例来演示，以帮助你调试自己的问题。\n\
  \n每个错误或问题都将与一个可供你跟随并解决的真实示例一起展示。我们需要一些数据来演示在使用 Neo4j 和 Cypher 时可能遇到的一些问题。\n\n对于本章，我们的示例将使用从\
  \ GitHub 收集的社交网络数据。这将包括 GitHub 开发者之间的关系数据。我们 edgelist `musae_git_edges.csv` 中的每条边代表两个相互关注的开发者。\n\
  \n我们还有开发者的名称，它们将是我们的节点，位于 `musae_git_target.csv` 中。我们的数据代表一个相当大的图，约有 38,000 个节点，近\
  \ 290,000 条边。当然，你可能会遇到许多类型的图问题，就像我们在迄今为止处理过的所有示例数据一样，但在这里，为了演示 *igraph* 和 Neo4j\
  \ 中关于错误和扩展问题的一些问题，将使用 GitHub 社交网络。\n\n以下部分将介绍在使用 igraph 库时你将面临的常见问题。\n\n#### 常见\
  \ igraph 问题\n\n虽然 *igraph* 是图数据及其分析的强大库，但其大部分强大功能来自于 Python 充当其幕后 C 实现的接口。正因为如此，*igraph*\
  \ 带有一些怪癖，在使用其功能时你需要牢记。在以下小节中，我们将带你了解在使用 Python 中的 *igraph* 时用户遇到的一些常见问题。\n\n#####\
  \ 图中没有节点\n\n一些 Python 中的图和网络科学库可以直接从元组列表、edgelist 创建。在 *igraph* 中，由于 C 中节点索引的实现方式，节点必须在边连接它们之前添加到\
  \ Graph 对象中。在接下来的步骤中，我们将演示此问题以及由此产生的后续错误：\n\n1. 我们可以首先使用内置的 csv 模块从 musae_git_edges.csv\
  \ 读取边数据作为示例图加载到 *igraph* 中。此文件有标题，因此我们在列表推导式末尾使用列表切片，从 reader 对象构建列表，以将其删除：\n\n\
  ```\nimport csv\nwith open('./data/musae_git_edges.csv', 'r') as c:\n    reader\
  \ = csv.reader(c)\n    edges = [row for row in reader][1:]\n```\n\n2. 在这一点上，在许多库中，你可能会直接从\
  \ edges 列表创建图。但如果我们尝试这样做，我们将遇到错误：\n\n```\nimport igraph\ng = igraph.Graph()\ng.add_edges(edges)\n\
  ```\n\n这会产生以下错误：\n\n```\nValueError: no such vertex: '0'\n```\n\n3. 这里实际上有两件事发生。图中不存在名称为\
  \ 0 的顶点，因为我们还没有添加任何节点。此外，我们正试图将字符串传递给 add_edges()，而 *igraph* 与之不兼容。我们可以首先通过 int()\
  \ 和列表推导式将 edgelist 中的值转换为整数来修复此问题。然后，我们可以尝试再次添加边：\n\n```\nedges = [[int(edge[0]),\
  \ int(edge[1])] for edge in edges]\ng.add_edges(edges)\n```\n\n我们会看到这仍然不起作用，并得到一个新错误：\n\
  \n```\nigraph.igraph.InternalError: Error at src/graph/type_indexed_edgelist.c:261:\
  \ Out-of-range vertex IDs when adding edges. -- Invalid vertex ID\n```\n\n这就是我们在边列表中有一个尚未存在于图中的节点\
  \ ID 时遇到的错误。在 *igraph* 中，我们必须始终在添加边之前向图添加节点。\n\n4. 正如我们在前几章中所示，我们可以使用双重列表推导式找到 edgelist\
  \ 中两列中的所有节点 ID，包含在 edges 变量中，并取这些的集合。然后，我们只需计算此集合的长度：\n\n```\nnodes = set([node\
  \ for edge in edges for node in edge])\nprint(len(nodes))\n```\n\n我们可以通过将其与数据集提供的\
  \ README.txt 文件进行比较来确认我们获得了正确的节点数。此集合的长度和 README 文件中显示的节点数应为 37,700。\n\n请注意，此 edgelist\
  \ 已经是 0 索引的，如果不是，则需要在此处采取额外的步骤来避免错误。我们需要为每个节点生成 ID，如果是这种情况，我们将在下一小节中介绍。\n\n5. 现在我们知道应该添加多少个节点，让我们在添加边之前将节点添加到我们的\
  \ Graph 对象中：\n\n```\ng.add_vertices(len(nodes))\ng.add_edges(edges)\n```\n\n6. 这次我们没有错误，边已成功添加到图中。让我们通过再次将其与\
  \ README 文件进行比较来检查边的数量是否正确。我们可以打印图 es 属性的长度以找到边的数量：\n\n```\nprint(len(g.es))\n```\n\
  \n我们的边计数是正确的，为 289,003。\n\n##### igraph 中的节点 ID\n\n在本书中，多次在我们的练习示例中，我们使用 igraph\
  \ 将图加载到 Python 中。每次，我们都必须确保创建 igraph ID。\n\n在 igraph 库中，图必须具有 0 索引的节点——没有例外。这是 igraph\
  \ 能够快速加载数据并运行图算法的功能之一，利用其幕后的 C 实现。当我们有非 0 索引的数据时，我们需要首先将其转换以确保它是 0 索引的，并保留此转换的记录，例如在字典中。\n\
  \n以下是上述句子中提到的这些 0 索引标识符转换步骤的工作示例：\n\n1. 首先，我们像往常一样初始化一个图（我们在前几章中已经多次这样做）：\n\n```\n\
  g = igraph.Graph()\n```\n\n幸运的是，对于上一节，GitHub 开发者社交网络已经是 0 索引的。然而，许多数据集和 edgelist\
  \ 并非如此，在使用 igraph 之前可能需要调整。在这种情况下，我们可以想象有额外的开发者被添加到网络中——没有理由他们都具有顺序的 ID 号，因此如果我们想将社交网络加载到图中以在\
  \ Python 中进行分析，我们必须处理这个问题。\n\n2. 让我们看看在我们添加导入的 edgelist 的边到 igraph 时会发生什么。我们知道我们的图恰好有\
  \ 37,700 个节点，使得最高有效节点 ID 为 37,699（因为 0 也是有效节点）。为了打破这种模式，我们可以将几条边添加到我们的 edges 列表的列表中，其中节点\
  \ ID 超出范围。我们将把这些添加到 new_edges 中：\n\n```\nnew_edges = edges + [[40000, 0], [99999,\
  \ 1], [40000, 99999]]\n```\n\n3. 因为 new_edges 中有新节点，我们将再次使用双重列表推导式和 set() 来找到新的唯一节点总数：\n\
  \n```\nnew_nodes = set([node for edge in new_edges for node in edge])\nprint(len(new_nodes))\n\
  ```\n\n我们添加了节点 40,000 和 99,999，因此我们新的唯一节点集合的长度应为 37,704。\n\n4. 像往常一样，让我们现在向我们的 igraph.Graph\
  \ 对象 g 添加与 new_nodes 长度等效的节点，并添加来自 new_edges 的边：\n\n```\ng.add_vertices(len(new_nodes))\n\
  g.add_edges(new_edges)\nigraph.igraph.InternalError: Error at src/graph/type_indexed_edgelist.c:261:\
  \ Out-of-range vertex IDs when adding edges. -- Invalid vertex ID\n```\n\n当我们尝试向图添加边时，我们会看到前面的错误。这是因为当调用\
  \ add_vertices() 时，igraph 已添加 ID 为 37,700 和 37,701 的节点，并且不知道 edgelist 中的节点名称不同。igraph\
  \ 不知道如何处理 edgelist 中的 ID 40,000 和 99,999，因为没有等效的节点被添加，也没有办法让 igraph 将这些节点名称映射到节点\
  \ ID。igraph 图始终受限于节点上的 0 索引。\n\n5. 为了解决这个问题，我们可以考虑将这些新节点映射到顺序且 0 索引的 igraph ID。让我们取我们之前通过查找\
  \ edgelist 中所有唯一节点而组装的 new_nodes 列表，并创建一个字典，将其 ID 映射到顺序的、0 索引的 igraph ID。我们使用 enumerate()\
  \ 来实现这一点，它会遍历唯一 ID 并为每个 ID 创建一个顺序 ID，我们将其用作字典 igraph_ids 中每个原始 ID 键的值：\n\n```\n\
  new_nodes = sorted(list(new_nodes))\nigraph_ids = {node: igraph_id for igraph_id,\
  \ node in enumerate(new_nodes)}\n```\n\n\n\n\n6. 我们可以通过访问新字典中的 igraph ID 值（指定键）来检查已分配给新节点的内容：\n\
  \n```python\nprint(igraph_ids[40000])\nprint(igraph_ids[99999])\nprint(igraph_ids[0])\n\
  ```\n\n我们的 print 语句显示，边列表中编号为 40,000 的节点已正确分配 igraph ID 37,000，编号为 99,999 的节点已分配\
  \ 37,701。为了确保无误，我们还可以检查名称为 0 的节点是否仍被分配了 igraph ID 0，从而确认我们的 ID 映射字典已成功创建。\n\n7.\
  \ 利用新的字典映射，我们可以使用列表推导式重新创建边列表。这里，我们创建一个新的边列表 ig_edges，根据映射将每条边中的每个节点替换为其对应的 igraph\
  \ ID。然后，我们可以使用 add_edges() 方法将这些新边添加到图中：\n\n```python\nig_edges = [[igraph_ids[edge[0]],\
  \ igraph_ids[edge[1]]] for edge in new_edges]\ng.add_edges(ig_edges)\nprint(len(g.es))\n\
  ```\n\n通过访问图 g 的 es 属性的长度来打印边的数量，可以看到我们现在有 289,006 条边，比原始边列表多三条，这是正确的。\n\n在接下来的部分中，我们将介绍添加节点属性的最佳实践或技巧。\n\
  \n### 添加属性\n\n可以通过访问 igraph 图对象的 vs 和 es 属性来为节点和边添加属性。这可用于跟踪节点属性和度量，或简单地为图元素添加额外信息（如\
  \ ID）。\n\n我们在前面的章节中已经展示过，节点和边属性可以按列表方式添加到图中，这比一次添加一个属性要高效得多。让我们通过向图中的节点添加 GitHub\
  \ 开发者姓名来演示这一点。具体步骤如下：\n\n1. 首先，与处理边列表时一样，我们使用 csv 模块将 `musae_git_target.csv` 中的数据导入\
  \ Python：\n\n```python\nwith open('./data/musae_git_target.csv', 'r') as c:\n  \
  \  reader = csv.reader(c)\n    node_attributes = [row for row in reader][1:]\n```\n\
  \n2. 数据加载完成后，我们可以使用 `for` 循环直接遍历导入的 `node_attributes` 列表，通过访问 `g.vs` 中的不同节点，将开发者姓名作为节点属性依次添加到每个节点：\n\
  \n```python\nfor node_id, name in node_attributes:\n    g.vs[int(node_id)]['developer_name']\
  \ = name\nprint(g.vs['developer_name'])\n```\n\n3. 这种方式虽然能按预期工作，但效率不高，因为每处理一个节点都需要反复访问图\
  \ `g`。相反，按列表方式添加节点属性要高效得多：先使用列表推导式从列表的第二个元素中提取 `developer_name` 属性，再将其添加到 `g.vs`：\n\
  \n```python\ndeveloper_names = [row[1] for row in node_attributes]\ng.vs['developer_name']\
  \ = developer_names\nprint(g.vs[0]['developer_name'])\n```\n\n这里的结果完全相同，但所需的处理更少。然而，需要注意的是，当以列表方式向节点或边添加属性时，顺序极其重要。属性被添加到节点时，ID\
  \ 为 0 的 *igraph* 节点会被分配列表中索引 0 处的属性值。添加到图中的属性列表顺序必须与 *igraph* 中节点 ID 的顺序一致。\n\n\
  4. 如果存在重复的节点属性信息，这可能尤其危险。我们可以通过在将姓名添加到图之前，向 `developer_names` 列表添加第一个元素的重复项来演示可能出现的错误：\n\
  \n```python\ndeveloper_names_dup = [developer_names[0]] + developer_names\ng.vs['developer_name']\
  \ = developer_names_dup\n```\n\n5. 尽管列表长度比网络中的节点数多了一个元素，此操作仍会成功完成且不会抛出任何错误。本质上，这一行是静默出错的，因为它导致不仅是第一个节点，而是所有节点的开发者姓名都不正确，预期的名称都被偏移了一位。通过访问\
  \ ID 为 0 和 1 的节点的姓名，我们可以看出问题所在：\n\n```python\nprint(g.vs[0]['developer_name'])\n\
  print(g.vs[1]['developer_name'])\n```\n\n6. 由于这种静默错误，使用 `assert` 语句来确保节点属性添加的预期行为是一种良好的实践。我们知道节点属性列表的长度应与图中的节点数相同，因此这是一个容易执行的测试：\n\
  \n```python\nassert len(g.vs) == len(developer_names_dup)\n```\n\n这将会失败并抛出 `AssertionError`，警告我们数据预处理过程中出了问题。\n\
  \n至此，我们介绍了如何有效地向节点和边添加属性。在下一节中，我们将把注意力转向 select 方法。\n\n### 使用 select 方法\n\n在 igraph\
  \ 中，正如我们在前面章节中探讨过的，可以使用 select() 方法分别对 Graph 对象的 vs 或 es 属性进行操作，从而从图中采样一系列节点或边。select()\
  \ 方法可以按属性采样节点，也可以通过特殊的方法参数对节点和边进行即时计算，例如不同类型的中心性。\n\n尽管这在分析中是很实用的功能，但在数据流水线中使用这种方式的\
  \ select() 方法可能会导致显著的效率问题。在计算计算上更复杂的节点或边度量时，这一点尤为明显。接下来的步骤演示了如何在 GitHub 开发者社交网络上使用它：\n\
  \n1. 首先，如果尚未创建，请使用本节开头的方法将 GitHub 边列表 CSV 作为 igraph 图 g 加载到 Python 中。现在，让我们使用 vs.select()（带有\
  \ `_degree_gt=2000` 参数，指定度数高于 2000 的节点）来查找图中高度数的节点：\n\n```python\nhigh_degree =\
  \ g.vs.select(_degree_gt=2000)\n```\n\n2. 在这里，度数的计算是即时完成的，一旦选出高度数节点，计算结果就会被丢弃。对于一次性分析来说，这种\
  \ select() 方法的使用是可以接受的。然而，如果它被用作分析流水线的一部分，甚至在同一 Python 脚本中需要再次计算，那么计算整个图的度中心性并将其作为属性写入节点可能更有意义。这可以防止对同一度量进行重复计算。为此，我们只需使用\
  \ igraph 计算度数（或任何其他所需度量），结果将以列表形式返回。然后，通过访问 g 的 vs 属性并添加一个新的属性名，可以将该列表按列表方式添加到图中的节点：\n\
  \n```python\ndegree = g.degree()\ng.vs['degree'] = degree\n```\n\n3. 既然每个节点的度数已作为节点属性添加，我们每次在代码中需要使用节点度数时，只需检索每个节点的\
  \ degree 属性即可。这意味着如果我们多次使用节点度数，就不必重复计算。请注意，这次我们的 select() 方法使用的是 `degree_gt` 参数，不带\
  \ `_` 前缀，表示我们要访问属性，而非 igraph 的 degree() 方法：\n\n```python\nhigh_degree = g.vs.select(degree_gt=2000)\n\
  print(list(high_degree))\n```\n\n请注意，对图进行的任何计算都需要一定的处理时间——测量每个节点的度数相当简单，但计算每个节点的介数中心性之类的度量则需要在图中找到所有节点对之间的最短路径，虽然这对某些分析目的很有参考价值，但效率要低得多。这需要大量的计算能力，并且与网络规模相关。当在图上计算计算特别复杂的度量时，这种\
  \ select() 的使用方式要优化得多。\n\n在下一节中，我们将深入探讨链式语句及其与 select 的配合使用。这将展示避免这些方法出现问题的一些方式。\n\
  \n### 链式语句与 select\n\nselect() 方法可以与 vs 和 es 结合使用，通过索引、属性和即时计算的度量，以各种不同的方式访问节点和边。然而，如果要使用\
  \ select() 通过链式语句来采样节点或边，建议谨慎行事。以链式方式使用 select() 可能会产生意想不到的后果。\n\n当使用 select() 时，它会根据用于查找节点还是边而生成\
  \ VertexSeq 或 EdgeSeq 对象。图的 vs 和 es 属性也分别具有 VertexSeq 和 EdgeSeq 类。因此，也可以对 select()\
  \ 调用的结果再次使用 select()。\n\n现在，我们将通过一个完整的示例来说明这一点：\n\n1. 让我们使用 GitHub 开发者社交网络来演示这如何引发一些问题。我们可以通过在\
  \ select() 调用中使用一个可迭代对象作为第一个参数，来采样具有特定索引的节点。这里，我们选择 ID 为 0、1 和 2 的节点：\n\n```python\n\
  sample = g.vs.select([0, 1, 2])\nprint(list(sample))\n```\n\n2. 正如我们之前所见，select()\
  \ 也可以用于采样具有特定属性或度量的节点。这里，我们使用该方法（以 `_degree_eq` 作为特殊参数）查找度数恰好等于 100 的所有节点：\n\n```python\n\
  degree_100 = g.vs.select(_degree_eq=100)\nprint(list(degree_100))\n```\n\n我们的 degree_100\
  \ 变量现在包含一个 VertexSeq 对象，其中包含从原始图 g 中采样的节点。我们也可以对此使用 select 来进一步细化节点样本。然而，在使用 ID\
  \ 来采样或检查特定节点是否存在时，我们应该保持警惕。\n\n3. 想象这样一个场景：我们想通过检查某个节点是否存在，来测试使用 select 的采样方法是否正常工作。我们知道\
  \ ID 为 1075 的节点应该存在于这个 VertexSeq 中，因为它的度数恰好为 100。因此，我们可以使用 assert 语句来确保这一点：\n\n\
  ```python\nassert degree_100.select([1075])\n```\n\n\n\n\n\n也许令人惊讶的是，这个 assert 语句会引发一个错误，它告诉我们该节点超出了对象的范围。这将产生一条类似如下的错误消息：\n\
  \n```\nValueError: vertex index out of range\n```\n\n- 4. 尽管我们知道节点 1075 包含在 select()\
  \ 的结果中，但使用 select() 会对返回的 VertexSeq 中的节点重新编号。节点 1075 已被重新编号为第 0 个元素，实际上可以这样访问：\n\
  \n  ```\n  sample = degree_100.select([0])\n  print(list(sample))\n  ```\n\n  运行\
  \ select() 时，我们并不一定能知道发生了怎样的重新编号，因此最好不要使用节点 ID 去搜索或进一步采样生成的 VertexSeq 对象，而是按节点属性进行采样，例如原始图中添加到每个节点的唯一标识符。重新编号不会影响按属性访问节点，因此链式调用\
  \ select() 会更安全。\n\n在下一节中，我们将研究路径长度引发的问题，并处理一个可能发生这种情况的案例。\n\n### 效率与路径长度\n\n并非所有图算法都是同等的，每种算法都能计算或估计节点、边或整个网络的不同特征。它们在复杂度上也不相同，有些只需几毫秒即可运行，有些则需要数小时才能计算出结果。\n\
  \n在选择一种度量来了解图中节点的某些信息时，我们需要考虑用于度量某个特征的方法的计算复杂度。这通常与图的大小和连通性密切相关。\n\n为了说明这一点，我们可以比较度中心性和介数中心性算法，这两种算法都试图计算图中节点的重要性，但方式不同。度中心性是一种简单的度量，统计每个节点的相连邻居数，其规模与图中的节点数成比例。\n\
  \n另一方面，介数中心性需要遍历图中所有节点对之间的路径，因此其规模不仅与节点数有关，还与边数有关。此外，由于它需要在节点之间查找短路径来估计节点重要性，其计算需求远高于计算度中心性。\n\
  \n虽然度中心性适合查找具有许多关联边的重要枢纽节点，但介数中心性可以向我们展示那些作为图中路径的重要通道的节点。这些概念相互关联，通常相关，但并不相同。然而，介数中心性在图上的计算时间总是比度中心性长几个数量级。它是\n\
  \n- 2. 转至 Neo4j 浏览器，并在浏览器中使用 `:server user add` 命令，就像我们在之前章节中多次做的那样。\n- 3. 然后我们将添加一个新用户，并将该用户命名为\
  \ `admin`。我们还需要为该用户设置密码。这里我们将使用 `testpython`。你需要在 **Password** 和 **Confirm Password**\
  \ 下输入两次此密码。\n- 4. 完成此操作后，我们需要在 Neo4j 浏览器中应用 **admin** 和 **public** 角色。\n- 5. 关于所有步骤的完整细节，我们在*第5章至第8章*中已经多次介绍过。\n\
  - 6. 我们还需要一些数据来演示在使用 Neo4j 和 Cypher 时可能遇到的某些问题，因此让我们将 `musae_git_edges.csv` 和 `musae_git_target.csv`\
  \ 移动到我们数据库的 `Import` 文件夹中。\n- 7. 我们可以从 Neo4j 浏览器主窗口访问此文件夹，点击 `Common Issues DB`\
  \ 旁边的三个点，然后选择 **Open folder** 和 **Import**。为了让 Neo4j 能够访问我们的数据，请将数据文件拖入此文件夹。\n\n\
  现在我们已将所有数据放入 Neo4j 数据库，为流程中的下一步做好了准备。后续章节将演示你可能在使用 Neo4j 时遇到的常见问题。第一个问题是从文件向 Neo4j\
  \ 写入速度慢的问题。在这里，我们将重点讨论如何*提升*对图数据库的写入速度。\n\n### 从文件到 Neo4j 的慢速写入\n\n在使用 Neo4j 和表格数据时，你经常会处理非常大的文件，例如\
  \ `.csv` 或 `.json` 格式的文件。我们通常使用 `LOAD CSV` 函数访问数据库 `import` 文件夹中的文件，并使用每一行的数据向 Neo4j\
  \ 添加节点和边。然而，`LOAD CSV` 有许多不同的用法，并非所有用法都一样。\n\n首先，让我们尝试使用以下 Cypher 脚本将节点和边从 `musae_git_edges.csv`\
  \ 导入到 `Common Issues DB` 中。\n\n在这里，我们只是调用 `LOAD CSV`，并加上 `WITH HEADERS`，因为我们的数据包含表头\
  \ `id_1` 和 `id_2`，并将每一行赋值给 `row` 变量。然后，我们可以使用取自 `row` 的 `githubId` 属性将每个 GitHub\
  \ 开发者节点 `MERGE` 到图中，同时在带别名的节点 d1 和 d2 之间创建关系。在 Neo4j 浏览器中运行此代码，看看它的表现如何：\n\n```\n\
  LOAD CSV WITH HEADERS FROM 'file:///musae_git_edges.csv' AS row\nMERGE (d1:Developer\
  \ {githubId:row.id_1})\nMERGE (d2:Developer {githubId:row.id_2})\nCREATE (d1)-[:FOLLOWS]->(d2)\n\
  ```\n\n你可能已经注意到，此查询运行得非常慢，具体取决于你机器的配置。但无论你的处理器性能如何或内存有多大，这个 Cypher 对它试图执行的数据导入来说都优化得极差。\n\
  \n在 Neo4j 中编写此查询时，你可能已经注意到查询出现下划线，鼠标悬停时会显示警告消息。该消息警告我们，查询使用了 EAGER 运算符，它会在查询运行时消耗大量内存。我们将在后面的小节中更详细地讨论\
  \ EAGER 运算符以及为什么要避免使用它。\n\n让此查询更有效地运行的一个选项是使用子查询，将查询有效地拆分为多个较小规模的事务。这减少了 Neo4j 上的内存负载，因为它在写入节点和边时，每次只从\
  \ CSV 中加载固定数量的行。\n\n这种类型的事务行为查询需要以 `:auto` 语句开头，后面跟上我们的 `LOAD CSV WITH HEADERS`\
  \ 函数。接下来，我们使用 `CALL` 和花括号将向图中添加 GitHub 节点和边的逻辑括起来，以指定我们的子查询。唯一的改变是，我们需要使用 `WITH`\
  \ 将 `row` 变量带入子查询。定义子查询后，我们可以使用 `IN TRANSACTIONS OF 1000 ROWS` 告诉 Neo4j 每次处理多少行\
  \ CSV。在 Neo4j 浏览器中运行此 Cypher 脚本，并将其运行时间与之前没有事务控制的查询进行比较：\n\n```\n:auto LOAD CSV\
  \ WITH HEADERS FROM 'file:///musae_git_edges.csv' AS row\nCALL {\n  WITH row\n \
  \ MERGE (d1:Developer {githubId:row.id_1})\n  MERGE (d2:Developer {githubId:row.id_2})\n\
  \  CREATE (d1)-[:FOLLOWS]->(d2)\n} IN TRANSACTIONS OF 1000 ROWS\n```\n\n你应该会看到此查询比之前的查询快得多，因为\
  \ Neo4j 不再需要在查询运行时将整个 CSV 数据保留在内存中。这释放了内存，使其能够实际处理节点和边的写入，从而加速整个进程。\n\n这当然是一个改进，但我们还可以做其他事情来加速大型数据集的加载，例如使用索引。\n\
  \n### 为查询性能建立索引\n\n在 Neo4j 中，与其他数据库一样，我们可以创建索引来提高搜索性能。索引是针对特定的节点或边属性创建的，本质上会生成一份关于节点或关系属性的有序存储信息列表。当查询涉及搜索该属性时，会使用该索引，而这些属性列表的有序性极大地提高了查询性能在\n\
  \n\n占用一些存储空间，以及创建索引所需的一些初始时间。这将通过一系列步骤来完成：\n\n- 1. 让我们通过比较上一节中写入查询在有索引和没有索引情况下的速度来演示这一点。首先，如果我们的图仍然包含数据，我们可以使用MATCH和DETACH\
  \ DELETE将其删除：\n\n```\nMATCH (n) DETACH DELETE n\n```\n\n- 2. 现在，对于空图，让我们在Developer节点的githubId属性上创建索引。我们使用CREATE\
  \ INDEX，指定名称githubId_index，然后用FOR标识它适用的节点类型，用ON标识要为其构建索引的节点属性：\n\n```\nCREATE INDEX\
  \ githubId_index\nFOR (d:Developer)\nON (d.githubId)\n```\n\n- 3. 现在，尝试重新运行上一节中用于向Neo4j数据库添加Developer节点的写入查询。你会注意到该查询的速度显著提升。当使用CSV数据创建节点时，会为githubId属性建立索引。然后，当使用MERGE语句借助索引添加新的Developer节点时，Neo4j可以更快地找到现有节点或确定它们不存在。\n\
  \n值得注意的是，索引不仅用于写入查询，而且用于涉及匹配特定属性的所有类型的查询。对于匹配许多包含Developer节点的路径并返回其信息的读取查询，在有索引的情况下运行速度远比没有索引时快。\n\
  \n索引的一个潜在缺点是，索引会占用大量存储空间，因此对很少查询的属性建立索引并不总是最优选择，尤其是在图非常大时。\n\n如果需要删除很少查询属性上的索引，可以使用DROP\
  \ INDEX，后跟之前调用CREATE INDEX时设置的索引名称：\n\n```\nDROP INDEX githubId\n```\n\n现在，让我们探讨一下在Neo4j中使用缓存查询可能遇到的问题，以及如何用一点Cypher来解决它们。\n\
  \n### 缓存结果\n\n一个不太明显的查询性能提升来源是重复的相似或相同查询。Neo4j维护一个与先前运行查询输出相关的信息缓存。当在新数据库或最近重启的数据库上运行查询时，尚未缓存任何内容，但一旦查询开始遍历数据库中的节点和关系，后续查询性能就会受到缓存数据的影响。\n\
  \n让我们运行一个查询来演示这一点。以下查询将搜索我们的GitHub社交网络中关注至少10个其他开发者仓库的开发者。为此，我们匹配每个开发者（d）与其他开发者（d2）之间的所有关系。然后，我们使用collect()为每个节点形成所有被关注开发者的列表，并取其大小。这等于每个节点的出度，因此我们这样命名。我们将结果限制为出度至少为10的情况，并按此属性排序返回结果：\n\
  \n```\nMATCH (d:Developer)-[:FOLLOWS]-(d2:Developer)\nWITH size(collect(d2)) as\
  \ degree, d\nWHERE degree >= 10\nRETURN d.githubId, degree ORDER BY degree DESC\n\
  ```\n\n这代表了跨节点的相当详尽的图遍历列表，因此每个节点和关系都会在初始MATCH语句中被考虑。尝试运行此查询一次，记下其速度，然后再运行几次。根据你机器的规格，你应该会注意到第一次执行之后的运行中查询速度有所提升。\n\
  \n这种在启动时运行查询的方法称为“预热缓存”。只要有足够的内存可用，Neo4j就会尽可能多地将查询期间遇到的节点和关系信息存储到内存中。当内存变得有限时，最旧的缓存数据将开始被替换。我们将在下一节中更详细地探讨这一点。\n\
  \n### 内存限制\n\n当要求Neo4j执行某些高度复杂的查询时，你很可能会遇到可用内存问题。如果正在匹配特别大或复杂的模式，或者单个查询中发生大量读/写操作，Neo4j可能会耗尽内存来存储查询步骤之间的中间信息，导致查询处理速度急剧变慢。\n\
  \n在极端情况下，它可能完全耗尽可用内存，导致查询取消和Java错误消息，例如以下内容：\n\n```\njava.lang.OutOfMemoryError:\
  \ Java heap space\n```\n\n运行更简单的查询来解决这个问题并不总是可行的，因此我们可以使用APOC库（https://neo4j.com/developer/neo4j-apoc/）来控制Neo4j处理中间结果的方式，特别是APOC.periodic中的函数。我们在第8章“完美投影”中处理非常大的图时首次遇到了这一点。要将APOC插件添加到我们的数据库，打开主Neo4j\
  \ Desktop窗口，选择我们为本章设置的数据库Common Issues DB。窗口右侧会出现一个菜单，你应该从中选择Plugins选项卡。在此选项卡中，选择APOC，然后点击Install。\n\
  \n格式。初始数据质量较差会严重影响最终图的质量，因此Neo4j提供了一些技巧来防止低质量数据影响图的构建和分析。我们可以使用MERGE和CONSTRAINTS以几种方式处理Neo4j中的重复数据。在以下步骤中，我们将重点介绍使用MERGE函数处理重复数据：\n\
  \n- 1. 对于本小节，我们假设Neo4j数据库已填充了GitHub社交网络。如果没有，请先按照本节开头附近的步骤向Neo4j添加数据。\n- 2. 在第5至8章中，我们使用了Neo4j中的MERGE函数，而不是CREATE函数，以防止在读取表格数据或从Python执行写入查询时创建额外节点。如前所述，MERGE函数首先运行一个匹配查询来查找指定的节点或模式，如果它已经存在，则不会向图写入额外节点。\n\
  - 3. 让我们使用MERGE运行一个基本查询，尝试向图写入一个已存在的节点：\n- 4. 在Neo4j Browser中运行此查询时，结果输出将显示数据库没有发生任何更改。节点已匹配，因此没有执行写操作。为了说明这一点，让我们看看使用相同节点规范运行CREATE函数时的区别：\n\
  - 5. 输出将显示已添加一个节点。如果你愿意，可以使用相同命令运行MATCH查询，以直观显示现在数据库中存在的两个相同节点：\n- 6. 虽然CREATE与MERGE的行为差异相当明显，但不太明显的是，MERGE的匹配部分是针对整个指定模式进行的。因此，如果你尝试将两个节点和一种关系合并到Neo4j中，而该模式中的所有节点、关系及其属性尚未匹配图中的整个模式，那么整个模式将被创建。\n\
  - 7. 让我们通过合并我们可能在边列表中找到的数据来演示这一点。这里，我们尝试合并图中已存在的Developer节点，以及它们之间尚不存在的FOLLOWS关系：\n\
  \n```\nMERGE (d:Developer {githubId: '1'})\n```\n\n```\nCREATE (d:Developer {githubId:\
  \ '1'})\n```\n\n```\nMATCH (d:Developer {githubId: '1'}) RETURN d\n```\n\n```\n\
  MERGE (d:Developer {githubId: '1'})-[:FOLLOWS]->(d2:Developer {githubId: '2'})\n\
  ```\n\nNeo4j输出显示图发生了一些更改。虽然本意是要找到githubId为1和2的节点并添加关系，但由于该关系尚不存在，现在已创建了两个带有边的重复节点。\n\
  \n\n\n\n- 3. 此外，如果我们尝试在图中有重复节点的情况下运行此 `CREATE CONSTRAINT` 查询，将会遇到错误，如下所示：\n\n  ```\n\
  \  Unable to create Constraint( name='githubId_constraint',\n  type='UNIQUENESS',\
  \ schema=(:Developer {githubId}) ):\n  Both Node(2) and Node(3701) have the label\
  \ `Developer` and\n  property `githubId` = '1'\n  ```\n\n- 4. 此错误表明，如果约束已被 Neo4j\
  \ 数据库中的当前数据失效，则无法创建约束。如果是这种情况，由于你已按照之前的示例操作，运行 `MATCH (n) DETACH DELETE n` 以清除所有数据，如我们之前所做。现在，在空白数据库或\
  \ Neo4j 中干净无重复数据的情况下，我们可以安全地使用 `CREATE CONSTRAINT` 查询创建约束。在 Neo4j Browser 控制台中运行\
  \ `SHOW INDEXES` 将显示已创建索引。如果数据库为空，请使用 *Common Neo4j issues* 部分开头的步骤将数据重新添加到数据库中。\n\
  \n- 5. 现在，让我们尝试使用 `MERGE` 添加一个关系，使用在 *Handling duplicates with MERGE* 小节中导致问题的节点和关系模式：\n\
  \n  ```\n  MERGE (d:Developer {githubId: '1'})-[:FOLLOWS]->(d2:Developer\n  {githubId:\
  \ '2'})\n  ```\n\n- 6. 这次，正如预期，我们将遇到一个错误，由我们的数据库约束抛出：\n\n  ```\n  Node(2027) already\
  \ exists with label `Developer` and property\n  `githubId` = '1'\n  ```\n\n  整个\
  \ MERGE 模式都不存在，这意味着 Neo4j 尝试将两个节点和关系都添加到数据库中。但由于具有这些 githubId 的 Developer 节点已存在，因此写入操作不会执行。我们的约束按预期发挥作用，防止重复节点被添加到\
  \ Neo4j。\n\n在这一节之后，我们将查看 `EXPLAIN` 和 `PROFILE` 函数以及 eager 操作符。\n\n### EXPLAIN, PROFILE,\
  \ and the eager operator\n\n除了前面每个 Neo4j 问题小节中的提示之外，有时使用 Cypher 和 Neo4j 实现你所需目标的复杂性可能意味着组装冗长而复杂的查询。\n\
  \n在遇到棘手查询的执行缓慢或不正确的问题时，Neo4j 提供了两种工具来帮助你找出问题的根源。\n\n`EXPLAIN` 和 `PROFILE` Cypher\
  \ 函数是方便的工具，可以清楚地显示 Neo4j 将如何执行查询。使用它们，我们可以展示 Cypher 执行计划的流程，并定位低效之处。\n\n`EXPLAIN`\
  \ 在不实际执行查询的情况下显示查询的执行计划，并显示每个执行计划步骤中操作的估计行数，而 `PROFILE` 显示相同的计划但在数据库上运行查询，并显示处理的实际行数。\n\
  \n让我们使用 `EXPLAIN` 显示匹配连接的 GitHub 开发者的查询计划：\n\n```cypher\nEXPLAIN\nMATCH (d:Developer)-[:FOLLOWS]->(d2:Developer)\n\
  RETURN d, d2\n```\n\n这将导致 Neo4j Browser 生成以下流程图：\n\n![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_220_0.png)\n\
  \nFigure 9.1 – Neo4j EXPLAIN results\n\n`EXPLAIN` 或 `PROFILE` 生成的流程图中的每个步骤都代表数据库正在执行的进程，并按操作符类型分类，例如\
  \ Expand 和 Filter。查询计划通常可以突出显示意外的执行行为——在这里，我们可以看到别名为 `d2` 的 Developer 节点，在我们查询的路径的右侧，实际上是首先定位的，然后再扩展到别名为\
  \ `d` 的节点。这对查询执行的速度没有影响，但其他查询计划模式和操作符可能影响更大。\n\n```\nMATCH (d2:Developer {githubId:row.id_2})\n\
  CREATE (d1)-[:FOLLOWS]->(d2)\n```\n\n查看这两个查询的 EXPLAIN 生成的执行计划，你会注意到 eager 操作符不再使用。这意味着\
  \ Neo4j 可以在不考虑写入冲突中数据完整性丢失的情况下处理每个查询，从而实现更快的执行。\n\n在将非常大的数据集加载到 Neo4j 时，这通常比在单个\
  \ Cypher 查询中添加节点和边更高效、耗时更少。结合本节开头讨论的子查询和 TRANSACTIONS 技巧，这种加载数据的方法可以更有效地快速将数据导入\
  \ Neo4j。\n\n本章到此结束，现在我们将总结你在本章中学到的内容，并结束本书。\n\n### Summary\n\n我们已经学习了很多作为有志于图实践者可能遇到的常见问题。这些问题基于多年处理这些问题的经验，它们在生产代码和系统中出现的频率比我们希望的要高。然而，随着时间的推移，这些问题往往会被\
  \ Python 代码中的有效错误处理和我们在 Cypher 脚本中可以建立的防御机制所覆盖。\n\n我们主要研究的问题是如何在 igraph 和 Neo4j（图数据库）中调试错误。在\
  \ igraph 中，我们研究了如何正确创建图中的边的问题，其中我们研究了与节点索引相关的问题；我们将此节点索引问题扩展到分析 igraph 中的节点 ID 以及如何修复节点\
  \ ID 索引问题。然后我们研究了如何有效地添加属性，利用 igraph 的 vs 和 es 属性，深入了解 select() 方法的工作原理以了解如何使用它，有时使用该方法会存在不足，例如与\
  \ select() 结合使用链式语句以及这如何导致意外后果。最后，我们研究了如何通过查看路径长度和提高中心性算法性能的各种方法来使算法更高效。\n\n关于 Neo4j，我们研究了从文件缓慢写入相关的问题以及如何克服或使用大型数据集加速写入。查询性能是下一个主题，我们研究了索引以及它对查询性能的影响；随后是\
  \ Neo4j 如何缓存结果以及对于大型数据集和路径遍历你可能希望避免这种情况。在查询性能部分，我们研究了如何使用 MERGE 语句处理 Cypher 查询中的重复项以及如何使用约束来处理重复项。调试是最后的重点。这里，我们研究了如何使用\
  \ Cypher EXPLAIN 和 PROFILE 命令为查询生成执行计划并调试可疑结果。此外，在调试部分，我们研究了 eager 操作符以及如何避免它，使\
  \ Neo4j 能够在不等待执行的情况下有效执行查询，同时仍然避免读写冲突问题。\n\n这结束了本章，也确实结束了整本书。你拥有所有必要的知识，可以复制你在本书中学到的内容，去构建解决你数据问题的图解决方案。\n\
  \n在整本书中，我们专注于让你掌握图在现实世界中使用的基本原理；然后我们探讨了如何构建和处理图数据模型——本节的主要重点是让你熟悉图数据科学的 Python 库并构建一个基本推荐系统，用于根据用户的观看资料预测用户最喜欢的电视节目；随后是从关系数据库思维转向图数据库思维——这让我们接触到使用\
  \ MySQL 并构建类似的推荐引擎，但这次是预测用户可能感兴趣的视频游戏。知识图谱是下一个讨论主题，我们专注于数据摄取和清洗方法，然后构建知识图谱并在知识图谱之上应用社区检测；我们随后开始介绍图数据库的概念，并将\
  \ Neo4j 作为我们存储图连接和将 Neo4j 与 Python 和 igraph 接口的解决方案——我们使用的用例是，一旦所有数据都在图数据库中，就着手解决旅行优化方案。然后我们研究了构建生产管道。这专注于\
  \ Neo4j 和 Python 管道各个元素之间的交互组合。接下来，我们研究了如何为快速变化的模式做好准备以及在设计之初构建这些策略的方法。继续，我们研究了如何存储和利用图投影来进行分析和其它下游任务。最后，我们涵盖了最后一块拼图——研究在使用\
  \ igraph 和 Neo4j 时出现的一些常见问题和意外错误。\n\n这真是一次过山车般的旅程，我们希望你喜欢沿途的每一个转折。这将你带过多年积累的知识，并将其提炼成这本书，这是一件令人愉快的事情。\n\
