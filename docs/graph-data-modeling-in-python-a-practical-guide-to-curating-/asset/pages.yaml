    \ igraph-compatible edges:\n\n```\n```python\nedgelist = []\nfor abstract_id,\
    \ terms in abstract_entities:\n    term_freq = dict(Counter(terms))\n```\n```\n\
    \nIn our schema, we added an edge attribute to our FOUND_IN relationships. This\
    \ is frequency, which will represent the number of times a term is used in a single\
    \ abstract and act as a sort of weighting for how relevant a term is to its source.\n\
