- pgno: 85
  md: '# Designing a knowledge graph schema


    Before jumping straight into data ingestion, we must consider the structure of
    our knowledge graph. For our use case, we''re interested in connecting related
    documents and concepts.


    In terms of nodes, we have both abstracts and terms. Our abstracts have only an
    ID and text. Our terms will need to be similar, albeit the text is shorter. Due
    to this, our node properties are simple, with only two different properties needed
    per node.


    > **Important note**

    > It is worth noting that our abstracts are generally very large text fields,
    of over 1,000 characters. For our purposes in this chapter, adding the abstract
    text as a node attribute will not be an issue, due to the relatively small size
    of the overall graph. However, in a far larger graph of millions of nodes, such
    large attributes may vastly increase the in-memory size of the graph as a whole
    and impact performance. In the case of very large graphs, it often makes sense
    to store an ID that represents the attribute on the node itself, while holding
    the text data in a separate, keyed, non-graph database, for example, SQL. Accessing
    the text itself, rather than querying the structure of the graph, can then be
    handled by a separate, performant process.


    The existence of two types of entities in our hypothetical graph, abstracts and
    terms, means that our graph is heterogeneous (containing multiple types of objects
    or multiple types of links). When we find terms in abstracts, it makes sense to
    link them to the abstracts that they are present in. This single type of relationship
    is enough to create a basic knowledge graph, in which entities are found in abstracts.
    Where the only type of link is between two different types of nodes, this is known
    as a bipartite graph.


    We may also be interested in the frequency of terms in a particular abstract,
    to represent how strongly an abstract is related to a concept. This could be used
    to filter the graph in later analysis, similar to how this was performed in Chapter
    3, Data Model Transformation – Relational to Graph Databases.


    The following diagram shows an example of a bipartite knowledge graph relationship
    with a FOUND_IN edge between the term and the abstract. In essence, this says
    what terms are found in what abstracts:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_85_0.png)


    Figure 4.2 – A bipartite knowledge graph


    The preceding figure shows that we can set up a relationship between each term
    and a FOUND_IN property of the abstract, so we are essentially saying get me a
    term that is found in the abstract, with a directional edge.'
