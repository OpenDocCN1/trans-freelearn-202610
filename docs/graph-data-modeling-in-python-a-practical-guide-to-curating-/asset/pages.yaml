- pgno: 112
  md: "7. Cypher also has methods for the basic analysis of results, including aggregations\
    \ such as count(), sum(), and max(). For example, we can count and return the\
    \ number of nodes in our database as follows:\n\n```\nMATCH (n)\nRETURN count(n)\n\
    ```\n\n8. Finally, we can remove data from our database using DETACH DELETE. Here,\
    \ we match all nodes in the database and remove edges attached to them, before\
    \ deleting the nodes themselves:\n\n```\nMATCH (n) DETACH DELETE n\n```\n\nNeo4j\
    \ can be used in this manner to create nodes and relationships, as well as querying\
    \ the database and examining parts of the graph. However, typically, in real-world\
    \ cases, read and write operations need to be triggered by an external process,\
    \ rather than typed directly into the Neo4j Browser window. In addition, visualization\
    \ becomes less useful, as graphs stored in databases become large and cannot display\
    \ every node and edge. With practicality in mind, for the rest of this chapter,\
    \ we will mostly be interacting with the Neo4j database from Python.\n\n# Querying\
    \ Neo4j from Python\n\nWith Neo4j installed, we are ready to connect to the database\
    \ through Python. To do this, we will be using the neo4j Python module, which\
    \ contains everything we need to connect to the database and send queries to it\
    \ from a Python script. We will iterate through this in the following steps:\n\
    \n1. Let’s start by creating a driver object for the Python-to-Neo4j connection.\
    \ We will first need to import the GraphDatabase class from the neo4j module.\
    \ Then, to create the driver, we will need to supply the uri, username, and password\
    \ parameters to the GraphDatabase.driver() function:\n\n```\nfrom neo4j import\
    \ GraphDatabase\ndriver = GraphDatabase.driver(uri='bolt://localhost:7687',\n\
    \    auth=('admin', 'testpython'))\n```\n\nOur uri parameter is the address of\
    \ our local running instance of Neo4j. If the Neo4j database is being hosted on\
    \ a separate server, then this would be substituted for the appropriate Internet\
    \ Proxy (IP) address and port. Our username and password for the database we set\
    \ up have also been passed as a tuple into the auth parameter.\n\n2. Now, we need\
    \ to create a session in order to send queries to the Neo4j database, using the\
    \ session() method of our driver object:\n\n```\nsession = driver.session()\n\
    ```"
  merge: -1
  img_proc: true
