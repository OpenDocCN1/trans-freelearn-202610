- pgno: 111
  md: '2. These nodes have now been added to the database but are currently disconnected.
    We can connect these nodes by searching for them in the database with the MATCH
    function, followed by another CREATE function. This time, we are supplying temporary
    variables to our matched nodes by adding Jeremy and Mark before the colon in each
    MATCH. Then, we create a new edge between Jeremy and Mark by referring to their
    variables in parentheses, with a - [:FOLLOWS] -> relationship to denote that Jeremy
    follows Mark on a social media platform:


    ```

    MATCH (jeremy:Person {name: "Jeremy"})

    MATCH (mark:Person {name: "Mark"})

    CREATE (jeremy)-[:FOLLOWS]->(mark)

    ```


    3. When dealing with a large amount of data, we may get duplicate information
    or need to update a database rather than create new items. The MERGE function
    exists to handle these scenarios and combines the functions of both MATCH and
    CREATE. When MERGE is used, a match takes place to check whether the pattern specified
    already exists in the graph database. If there is a match, no write operation
    takes place. If there is no exact match, the pattern is used in a CREATE function
    to add to the graph. The following line will have no effect, since a Person node
    with the name Jeremy already exists:


    ```

    MERGE (:Person {name: "Jeremy"})

    ```


    4. However, if we run this MERGE function call, we will create a new Person node
    named Sophie, because the node is not already present in the graph:


    ```

    MERGE (:Person {name: "Sophie"})

    ```


    The MERGE function also works with edges and longer path patterns.


    5. We have covered the basics of writing to a Neo4j database, but let’s briefly
    look at how to retrieve information from the graph with read operations. We have
    already used MATCH, and we can continue to use it to find nodes or edges that
    match certain patterns and features to report back on. Then, we can use RETURN
    to retrieve that information. The following code will find all Person nodes and
    return them to the Neo4j Browser window:


    ```

    MATCH (n: Person)

    RETURN n

    ```


    6. As well as accessing whole nodes, we can access node or edge attributes using
    ., as you would access an attribute of a Python object. To return just the name
    attribute of the nodes in our graph, we can run the following:


    ```

    MATCH (n: Person)

    RETURN n.name

    ```'
