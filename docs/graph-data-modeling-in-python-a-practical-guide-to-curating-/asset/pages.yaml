- pgno: 155
  md: "fits this criteria, we can continue, and find the products for both customers\
    \ that they have not already purchased, using two list comprehensions, and store\
    \ these in the variables p1_recs and p2_recs. Now all that is left to do is to\
    \ simulate purchases of our retailer’s products based on these recommendations,\
    \ by calling our add_purchase_id() method for each new product in both p1_recs\
    \ and p2_recs:\n\n```\ndef rec_by_similarity(c1, c2, threshold, connection):\n\
    \    p1 = get_customer_purchases(c1, connection)\n    p2 = get_customer_purchases(c2,\
    \ connection)\n    similarity = jaccard_similarity(p1, p2)\n    if similarity\
    \ >= threshold and similarity != 1:\n        p1_recs = [p for p in p2 if p not\
