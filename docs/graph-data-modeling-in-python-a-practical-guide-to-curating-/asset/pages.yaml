    Following this section, we will look at the `EXPLAIN` and `PROFILE` functions
    and the eager operator.


    # EXPLAIN, PROFILE, and the eager operator


    Aside from the pointers in each of the previous Neo4j issue subsections, occasionally
    the complexity of what you need to achieve using Cypher and Neo4j can mean assembling
    lengthy and complicated queries.


    When encountering issues with tricky queries and slow or incorrect execution,
    Neo4j has two tools you can use to get to the bottom of your problems.


    The `EXPLAIN` and `PROFILE` Cypher functions are handy tools to shine a light
    on exactly how Neo4j will execute a query. Using these, we can show the flow of
    a Cypher execution plan, and locate inefficiencies.


    `EXPLAIN` displays the execution plan for a query without actually executing it,
    and displays the estimated number of rows operated on at each execution plan step,
    while `PROFILE` shows the same plan but runs the query across the database, and
    displays the actual number of rows processed.'
