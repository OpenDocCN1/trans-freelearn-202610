    in any way? Are some generic, while others are specific and related? This kind
    of approach can be used to find relationships between groups of abstracts, or
    indeed any other types of documents, where you might not expect them.


    In addition, community detection, like other elements of graph structure, has
    another use in setting thresholds and parameters for knowledge graph construction.
    If we expect a strongly linked set of abstracts from a particular field to be
    represented in the complete knowledge graph, then does it appear? If not, perhaps
    thresholds and methods used, such as entity extract and graph construction, should
    be modified. Often, working alongside specialists or domain experts in the document
    contents or area of knowledge a graph is trying to represent can help in data
    modeling and pipeline construction for knowledge graphs.


    This brings this chapter to a close. We have taken you through everything you
