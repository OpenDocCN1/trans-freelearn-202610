- pgno: 149
  md: "```\nMATCH (b)<-[:HAS_BRAND]-(r:Product)\nWHERE NOT (c)-[:PURCHASED]->(r) AND\
    \ (r)-[:HAS_TYPE]->(st)\nRETURN DISTINCT r\n```\n\nOnce satisfied this logic was\
    \ working correctly, we could update the rec_by_brand() method to use this logic.\
    \ For now, though, let’s move on to another type of product recommendation commonly\
    \ used by real online retailers. This will be covered in the next section.\n\n\
    # Drawing on other customers purchases\n\nRecommending a product based on brand\
    \ is a simple but sensible way to use our graph ontology to drive further customer\
    \ purchases. However, it is not the only method employed by online retailers to\
    \ promote sales and only uses part of the data we have available in our graph\
    \ database.\n\nBy this point, we have been collecting lots of data on our simulated\
    \ customer purchases, and we can use this data in a more holistic way to find\
    \ products of interest to our customers. Consider a customer that has made a purchase\
    \ in the past through our web application. This will have been stored as an edge\
    \ in our graph, alongside edges representing other customers purchasing the same\
    \ product. By traversing these relationships with other customers, we can find\
    \ the other products that customers buying the initial product went on to purchase,\
    \ and recommend them. This type of recommendation relies on the assumption that\
    \ customers are more likely to buy a similar set of products to one another than\
    \ they are to purchase items at random.\n\nThe following steps show how we can\
    \ achieve this:\n\n+   1. Let’s write a method to recommend a product to a customer\
    \ using other customer purchases, named rec_by_copurchase(). The structure of\
    \ this method is similar to that of rec_by_brand(), with the Cypher modified to\
    \ traverse back along the PURCHASED edges from the products our customer in question\
    \ has purchased to other customers. We use a WHERE clause to prevent traversal\
    \ back to the original customer we are making a recommendation to. We can then\
    \ go from customers with the same purchase history, aliased to c2, to other products\
    \ they have purchased. We also make sure that we don’t recommend a product that\
    \ our customer, c, has already purchased, again using WHERE. The remainder of\
    \ this method is the same as for rec_by_brand(), and returns a list of product\
    \ IDs:\n\n```\ndef rec_by_copurchase(c, connection):\n    query = f'MATCH (c:Customer\
    \ {{customerID: toInteger({c.customerID})}})' \\\n        '-[ :PURCHASED]->(p:Product)'\
    \ \\\n        'MATCH (p)<-[:PURCHASED]-(c2:Customer)' \\\n        'WHERE c2 <>\
    \ c ' \\\n        'MATCH (c2)-[:PURCHASED]->(r:Product)' \\\n        'WHERE p\
    \ <> r ' \\\n        'RETURN DISTINCT r.productID as productID'\n```"
