- pgno: 205
  md: 'Thankfully, for the previous section, the GitHub developer social network is
    already 0-indexed. However, many datasets and edgelists are not and could need
    adjustment before igraph can be used. In this case, we can imagine that additional
    developers have been added to the network – there is no reason that they would
    all have sequential ID numbers, so we would have to deal with this if we wanted
    to load the social network into a graph for analysis in Python.


    2. Let’s see what happens in igraph when we add edges to our imported edgelist.
    We know our graph has exactly 37,700 nodes, making the highest valid node ID 37,699
    (since 0 is also a valid node). To break this pattern, we can add several edges
    to our edges list of lists, where the nodes have IDs that are out of range. We
    will add these to create new_edges:


    ```

    new_edges = edges + [[40000, 0], [99999, 1], [40000, 99999]]

    ```


    3. Because we have new nodes in new_edges, we will need to again use a double
    list comprehension and set() to find the new total number of unique nodes:


    ```

    new_nodes = set([node for edge in new_edges for node in edge])

    print(len(new_nodes))

    ```


    We have added nodes 40,000 and 99,999, so the length of our new unique node set
    should be 37,704.


    4. As always, let’s now add nodes to our igraph.Graph object, g, equivalent to
    the length of new_nodes, and add our edges from new_edges:


    ```

    g.add_vertices(len(new_nodes))

    g.add_edges(new_edges)

    igraph.igraph.InternalError: Error at src/graph/type_indexed_edgelist.c:261: Out-of-range
    vertex IDs when adding edges. -- Invalid vertex ID

    ```


    When we try to add edges to the graph, we see the preceding error. This is because
    when add_vertices() is called, igraph has added nodes with IDs 37,000 and 37,001,
    and doesn’t know that nodes in our edgelist are named differently. igraph doesn’t
    know what to do with the IDs 40,000 and 99,999 in our edgelist, as there is no
    equivalent node added, and no way for igraph to map these node names to node IDs.
    An igraph graph is always constrained to 0-indexing on nodes.


    5. To solve this issue, we can consider mapping these new nodes to igraph IDs
    that are sequential and 0-indexed. Let’s take the new_nodes list we previously
    assembled by finding all unique nodes in the edgelist and create a dictionary
    that maps their IDs to sequential, 0-indexed igraph IDs. We use enumerate() to
    do this, which counts through the unique IDs and creates a sequential ID for each,
    which we use as the value for each original ID key in our dictionary, igraph_ids:


    ```

    new_nodes = sorted(list(new_nodes))

    igraph_ids = {node: igraph_id for igraph_id, node in enumerate(new_nodes)}

    ```'
  merge: -1
