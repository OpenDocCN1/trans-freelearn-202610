- pgno: 162
  md: '*Graph Data Models*, is a directional relationship. If one user follows another,
    there is no requirement for the reverse to be true.


    Now, imagine that later in its ongoing development, Twitter is releasing a new
    feature, *Circles*. In an early release, each user could be part of a single *circle*,
    with other users. Here, we might make the decision to add the ID of a user’s circle
    as an attribute to the User node. Using an attribute to represent this makes sense
    because, currently, the relationship between a user and their circle is one-to-one.


    The following diagram shows how you would set up a User with a FOLLOWS relationship
    if the user belongs to just one circle:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_162_0.png)


    Figure 7.4 – Schema with one circle per user


    This schema would work perfectly well if each user can only belong to one circle.
    However, what would happen if a new Twitter update allowed users to be a member
    of more than one circle? The relationship between a user and a circle after this
    update would be one-to-many. If we listed them in a property, this may become
    unwieldy, where we would potentially have very large strings representing user
    circle memberships. As time goes on, this would become very difficult to query
    should we want to use the information held in the graph database to drive any
    behavior in the frontend application concerning circles. Query performance would
    be impacted by having to search for a specific circle inside a long list.


    Instead, we could plan ahead and move the circle property to its own node type,
    Circle. Each node could have a unique ID, and relationships could be made from
    User to Circle nodes. We will call this relationship MEMBER_OF.


    As well as preventing long lists of properties from building for each User, the
    addition of Circle nodes removes duplication of the circle IDs being held in this
    property. Each circle is now represented by a single node that has several User
    nodes connected to it. This will further increase performance, allowing graph
    queries to traverse through the User/Circle network that has now been connected.


    This diagram shows User as a member of a particular circle, with a relationship
    to show who also follows the user:'
