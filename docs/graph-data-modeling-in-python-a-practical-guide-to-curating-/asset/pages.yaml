    a very similar process to the preceding one, but while making a small change to
    the enumerate() method parameters. We can use the second parameter in enumerate()
    to generate increasing integers, but rather than starting at 0, we can start at
    the highest igraph ID assigned to users using the user_ids dictionary''s len():


    ```

    games = set([row[1] for row in play_data] + [row[1] for row in purchase_data])

    game_ids = {user_id: igraph_id for igraph_id, user_id in enumerate(games, len(user_ids))}

    print(len(game_ids))

    ```


    As with users, our print statement shows the number of unique games in our datasets,
    5155. Using enumerate() with the second parameter should avoid any ID conflicts
    between users and games. Even though their node types are different, igraph still
    requires IDs for all nodes to be increasing integers from 0.


