  md: 'Here, similarly to earlier in the chapter, we use vs.select() to find the node
    with a page name equal to Today Show. Because vs.select() returns an iterable,
    we need to take the first element with [0] so that we can access the first element’s
    .index attribute. Our print statement will show that our node’s ID is 909.


    3. Now, we can find edges that contain node 909 using es.select(). We specify
    the _incident parameter is equal to our today_show_id variable, and put it inside
    a list (note that es.select() requires lists of nodes for all special parameters
    in Table 2.2):


    ```

    today_show_edges = g.es.select(_incident=[today_show_id])

    ```


    4. Just as with vs.select(), this line returns an iterable containing edges. We
    can pull out the two nodes for each edge in today_show_edges using the .source
    and .target attributes of each edge in the iterable:


    ```

    sources = [edge.source for edge in today_show_edges]

    targets = [edge.target for edge in today_show_edges]

    print(sources)

    print(targets)

    ```


    This will show us two lists of node IDs, all present in edges incident to the
    Today Show.


    Note

    Note that in our mutual likes graph, source and target are in reality equivalent,
    as the graph is undirected. Here, source and target are merely denoted by igraph
