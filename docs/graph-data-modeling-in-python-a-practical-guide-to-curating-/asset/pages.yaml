- pgno: 19
  md: '# Introducing Graphs in

    the Real World


    Social network analysis, fraud detection, modeling the stability of systems (for
    example, rail and energy grids), and recommendation systems all rely on graphs
    as the lynchpin underpinning these types of networks. In each of these examples,
    the relationships between individual people, bank accounts, or other single units
    are fundamental to describe and model the data. As opposed to traditional data
    models, a graph is a perfect way to represent groups of interacting elements.


    This chapter will serve as an introduction to why graphs are important and introduce
    you to the fundamentals of what makes up a graph network. Moreover, we will look
    at how to transition from traditional data storage strategies, such as **relational
    databases (RDBs)**, to how you can use this knowledge to work with **graph databases
    (GDBs)**. Throughout this book, we will be working with a popular graph database,
    namely Neo4j. This will be followed by an explanation of how graphs are utilized
    in the *real world* and then a gentle introduction to working with the main package
    workhorses, known as igraph and NetworkX, which are the best and most stable graph
    packages for graph data analysis and modeling.


    In this chapter, we’re going to cover the following topics:


    +   - Why should you use graphs?

    +   - The fundamentals of nodes and edges and the properties of a graph

    +   - Comparing RDBs and GDBs

    +   - The use of graphs across various industries

    +   - Introduction to NetworkX and igraph'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Technical requirements


    We will be using the Jupyter Notebook to run our coding exercises. For this, you
    will require python>=3.8.0, along with the following packages, which will need
    to be installed in your environment with the pip install command:


    +   - networkx==2.8.8

    +   - igraph==0.9.8


    All notebooks, along with the coding exercises, are available at the following
    GitHub link: https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH01.


    # Why should you use graphs?


    In modern, data-driven solutions and enterprises, graph data structures are becoming
    more and more common. This is because, in our modern, data-driven world, relationships
    between things are becoming as, if not more important, than the things themselves.
    In modern industries and enterprises, graphs are starting to become more common
    and powerful in understanding the relationships between entities. I would say
    that these relationships and how they are connected have become more important
    than the entities themselves. We will demonstrate examples of real-life graphs
    in our use cases in the following chapters with detailed instructions on how to
    build these networks and the core considerations you need to make for the graph
    design.


    Graphs are fundamental to many systems we use every day. Each time you are online
    and receive a product recommendation, it is likely that a graph solution is powering
    this recommendation. This is why learning how to work with graph data and leveraging
    these types of networks is a fast-growing and key skill in data science.


    # Composite components of a graph


    Networks are a tool to represent complex systems and the complex nature of the
    connections arising in today''s data. We have already referenced how graphs are
    powering some of the big powerhouse recommendation systems in action today.


    Graph methods tend to fall into four different areas:


    +   - **Movement**: Movement is concerned with how things travel (move) through
    a network. These types of graphs are the drivers behind routing and GPS solutions
    and are utilized by the biggest players in finding the optimal path across a road
    network.

    +   - **Influence**: On social media, this area specifies who the known influencers
    are and how they propagate this influence across a network.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   - **Groups and interactions**: This area involves identifying groups and
    how actors in the network interact with each other. We will look at an example
    of how to apply community detection methods to find these communities through
    the node (the actor involved) and its connections (the edges). Don''t worry if
    you don''t know what these terms are for now; we will focus on these in the *Fundamentals
    of nodes, edges, and the properties of a graph* section.

    +   - **Pattern detection**: Pattern detection involves using a graph to find
    similarities in the network that can be explored. We must look at this from the
    actor''s (node''s) point of view and find similarities between that actor and
    other actors in the network. Here, *actor* is taken to mean person, author profile,
    and so on.


    In this section, we have explained the core components of a graph by providing
    simple working definitions. In the following section, we will delve deeper into
    these fundamental elements, which make up every graph you will come across in
    the industry. We will look at nodes, edges, and the various properties of a graph.


    # The fundamentals of nodes and edges and the properties of a graph


    Graphs, or networks, are particularly powerful data structures for modeling and
    describing relationships between things, whether these things are people, products,
    or machines. In a graph, those *things* that we coined earlier are represented
    by *nodes* (sometimes known as *vertices*). Nodes are connected by *edges* (sometimes
    referred to as *relationships*). In a network, an edge represents a relationship
    between two things, indicating that, somehow, they are linked.


    The following sections will look at the structures and types of graphs. First,
    we will start with undirected graphs before moving on to directed graphs. After
    that, we will look at node properties, then delve into heterogeneous graphs, and
    end by looking at schema design considerations.


    # Undirected graphs


    To illustrate, a simple example is that of a real-life social network. In the
    following example, Jeremy and Mark are each represented by a node. Jeremy is friends
    with Mark, and the *friend* relationship is represented by an edge connecting
    the two nodes. The following diagram shows an **undirected graph**:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_21_0.png)


    Figure 1.1 – Two friend nodes are linked together with a single edge'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'However, not all social networks are the same, and in some online social media
    platforms, relationships between users of a social network may not be mutual.


    For example, on Twitter, one user can follow another, but this doesn’t mean the
    inverse must be true. On Twitter, Jeremy may follow Mark, but Mark may not follow
    Jeremy.


    # Directed graphs


    Here, a directional edge is used to show that Jeremy follows Mark, while the absence
    of an edge in the reverse direction shows that Mark does not follow Jeremy in
    return:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_22_0.png)


    Figure 1.2 – Two friend nodes are linked together with a single edge


    This type of graph is known as a directed graph. For reference, sometimes, undirected
    edges like those in Figure 1.1 are shown as bidirectional edges, pointing to both
    nodes. This bidirectional representation is equivalent to an undirected edge in
    most senses and represents a mutual relationship.


    Importantly, when creating a data model with directional edges, naming relationships
    appropriately becomes important. In our Twitter example, if the edge representing
    the interaction between Mark and Jeremy is follows, then the edge goes from the
    Jeremy node to the Mark node.


    On the other hand, if the edge represents a concept such as followed by, then
    this should be in the other direction – that is, from Mark to Jeremy. This has
    particularly strong implications for some more complex graph modeling and use
    cases, which we will cover in Chapter 2, Working with Graph Data Models.


    # Node properties


    While nodes and edges (directional or not) are the basic building blocks of a
    graph, they are often not sufficient to fully describe a dataset. Nodes can have
    data associated with them that may not be relational, so it would not be expressed
    as a relationship with another node.


    In these cases, to represent data associated with nodes, we can use node properties
    (sometimes known as node attributes). Similarly, where an edge has additional
    information associated with it, in addition to representing a relationship, edge
    properties can be used to hold that data.


    The following diagram shows a black line, indicating that Jeremy follows Mark
    but that Mark does not follow Jeremy – therefore, the black line indicates directionality:'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_23_0.png)


    Figure 1.3 – Two friend nodes are linked together with a single edge


    In the preceding model, node properties are used to describe the number of followers
    Mark and Jeremy have, as well as the locations listed in their Twitter bios. This
    kind of additional node information is particularly important for querying graph
    data when asking questions that involve filtering.


    In our Twitter example, properties would need to be present in the graph if, for
    example, we wanted to know who followed users with above 1,000 followers. We will
    revisit answering graphical questions using nodes, edges, and properties in later
    chapters.


    Depending on the dataset, there may be cases where different nodes have different
    sets of properties. In this case, it is common to have several distinct types
    of nodes in the same graph.


    # Heterogeneous graphs


    Node types can also be referred to as layers, or nodes with different labels,
    though for this book, they will be known simply as types.


    The following diagram shows the nodes representing Jeremy and Mark as people,
    where each node type has different properties, and there are multiple relationship
    types. Due to this, we can term these multiple relationships as heterogenous:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_23_1.png)


    Figure 1.4 – Example of a heterogenous Twitter graph'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'Now, we have added nodes representing Mark and Jeremy as people, relationships
    representing their relationship outside of Twitter, and their ownership of their
    respective accounts. Note that since we have increased the number of node types,
    we also need new edge types to refer to the different interactions between different
    types of nodes.


    Graphs with multiple node types are known as heterogeneous, multilayer, or multilevel
    graphs, though going forward we will use the term heterogeneous to refer to graphs
    with multiple types of nodes. In contrast, graphs with only one node type, as
    in the previous examples, are referred to as homogeneous graphs.


    # Schema design


    At this point, it is reasonable to ask the question: *What features of a dataset
    should be nodes, edges, and properties?*


    For any given dataset, there are multiple ways to represent data as a graph, and
    each is more suited to different purposes. Herein lies the trick to good graph
    modeling: a question or use case-driven schema design.


    If we were particularly interested in the locations of Twitter users in our network,
    then we could move the location node property on the Twitter user nodes to create
    the LOCATED_IN relationship type. This is shown in the following diagram:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_24_0.png)


    Figure 1.5 – The same graph but with the location property moved from a node property
    to a node type'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'If we were particularly interested in the locations of Twitter users in our
    network, then we could move the location node property on the Twitter user nodes
    to a separate node type and create the LOCATED_IN relationship type. We could
    even go one step further to represent the information we know about these locations,
    adding the country related to each location as a separate, abstracted node.


    This graph structure models the same data in a different way, which may be more
    or less suitable or performant for particular use cases. We will explore the effects
    of schema design on the types of questions that can be asked, and performance,
    in later chapters.


    In the next section, we will compare how graph data structures differ from traditional
    RDBs. This will expand on why GDBs can be more performant when modeled as a graph
    data problem.


    # Comparing RDBs and GDBs


    **RDBs** have been a standard for data storage and data analysis across most industries
    for a very long time. Their strength lies in being able to hold multiple tables
    of different information, where some table fields are found across tables, enabling
    data linkage.


    With this data linkage, complex questions can be asked of data in an RDB. However,
    there are drawbacks to this relational structure. While RDBs are useful for returning
    a large number of rows that meet particular criteria, they are not suited to questions
    involving many chained relationships.


    To illustrate this, consider a standard database containing train services and
    their station stops, alongside a graph that might represent the same information:


    | Train | Stops at |

    | --- | --- |

    | GW1426 | Truro |

    | GW1426 | Liskeard |

    | GW1426 | Plymouth |

    | XC1200 | Plymouth |

    | XC1200 | Bristol Parkway |

    | XC1200 | Cheltenham Spa |

    | XC1200 | Birmingham New Street |

    | VT3160 | Birmingham New Street |

    | VT3160 | Crewe |

    | VT3160 | Lancaster |

    | VT3160 | Carlisle |

    | VT6200 | Carlisle |

    | VT6200 | Glasgow Central |


    Figure 1.6 – Relational data structure of trains and their stops'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'In an RDB structure, it would not be difficult to retrieve all trains that
    service a particular stop. On the other hand, it may be a slow operation that
    returns a series of trains that can be taken between two chosen stations.


    Consider the steps needed in a traditional RDB to find the route between Truro
    and Glasgow Central in the preceding table. Starting at Truro, we would know the
    **GW1426** train service stops at Truro, Liskeard, and Plymouth. Knowing that
    these stations can be reached from Truro, we would then need to find what train
    services stop at each of these stations to find our route.


    Upon finding that Plymouth station is reachable and that a separate service runs
    to many more stations, we would need to repeat this process over and over until
    Glasgow Central is reached.


    These steps essentially result in a series of computationally costly *join* operations
    on the same table, where one resulting row would give us the path between our
    stations of interest.


    # GDBs to the rescue


    Using a graph structure to represent this train network puts greater emphasis
    on relationships between our data points, as illustrated in the following diagram:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_26_0.png)


    Figure 1.7 – Graph data structure of trains and their stops'
