  md: "2. With functions ready to connect to our Neo4j database, we can think about\
    \ populating our graph with data, first from our edgelist. We will need to open\
    \ edges1.csv using the inbuilt Python csv library, and convert each row into a\
    \ list, resulting in a list of lists:\n\n```\nimport csv\nwith open('./data/edges1.csv',\
    \ 'r') as c:\n    reader = csv.reader(c)\n    edgelist = [edge for edge in reader]\n\
    print(edgelist[:5])\n```\n\n3. Our print statement shows that edges have been\
    \ read into Python correctly. We now need a way to transfer these user IDs and\
    \ their FOLLOWS relationships into Neo4j, so we will write a separate function\
    \ for this. The functions will take n, the ID of a user who follows another user,\
    \ with ID m. It will also take a Neo4j connection established using Neo4jConnect.\
    \ We can then use these parameters to assemble a simple Cypher query, using MERGE\
    \ so that existing nodes and edges are not replicated. Each User node is first\
    \ merged into the graph, followed by the FOLLOWS edge between them. Quotes are\
    \ used around the user ID properties to ensure they are added as a string, as\
    \ per the schema we designed in the last section. The last step is to use our\
    \ connection to send the write query to the database:\n\n```\ndef add_edge_neo4j(n,\
    \ m, connection):\n    cypher = f'MERGE (u1:User {{userID: \"{n}\"}}) ' \\\n \
    \            f'MERGE (u2:User {{userID: \"{m}\"}}) ' \\\n             'MERGE (u1)-[:FOLLOWS]->(u2)'\n\
    \    connection.query(cypher)\n```\n\n4. Let’s test that this function is working\
    \ by adding a single edge to the database from Python. We can use list slices\
    \ to get the source and target of the first edge in our imported CSV:\n\n```\n\
    connection = Neo4jConnect('bolt://localhost:7687', 'admin', 'testpython')\nadd_edge_neo4j(edgelist[0][0],\
    \ edgelist[0][1], connection)\nconnection.close()\n```\n\n5. If this worked successfully,\
    \ you should see that two User nodes and a FOLLOWS edge have been added to Neo4j,\
    \ when using the Neo4j Browser. To confirm, we could run the following in the\
    \ Neo4j Browser Terminal:\n\n```\nMATCH (u:User) RETURN u\n```"
