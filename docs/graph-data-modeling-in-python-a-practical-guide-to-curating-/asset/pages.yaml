    # Knowledge graph analysis and community detection


    Before we begin to delve deeper into our knowledge graph, it makes sense to get
    an understanding of its structure. Information on our graph''s structure will
    frame further analysis that we carry out. This analysis will be pivotal and we
    will examine how to examine the knowledge graph structure by looking at which
    components are connected; conversely, disconnected components would mean that
    there are abstracts in our knowledge graph that are standalone terms and abstracts
    that are separate from our main knowledge of medical abstracts. From there, we
    will look at common terms and methods to identify abstracts of interest. Let''s
    get started by examining our knowledge graph structure.


    # Examining the knowledge graph structure


    The next series of steps in our process will be to examine the knowledge graph
    structure:


    1. Let''s first find the number of nodes and edges in our graph, since in this
    chapter, we have constructed our graph not from discrete data points but from
    text. We can find the number of nodes by printing the len() of the g.vs attribute
    and the number of edges by printing the len() of the g.es attribute:


    ```

    print(len(g.vs))

    print(len(g.es))

    ```


    This shows us that we have 20,603 nodes and 71,463 edges in our knowledge graph.


    2. It would also be useful to know whether our graph is fully connected, particularly
    in the case of knowledge graphs. A disconnected graph would mean that there are
    technical areas in our groups of abstracts that never use the same phrases or
    biomedical terms. We can find connected components by using the g.clusters() method.
    We have the choice between setting a parameter, mode, to strong or weak. Strongly
    connected nodes have to have undirected edges or directed edges in both directions
    between them to be considered connected as part of a cluster. The impact of this
    on our directed graph, with edges only from terms to abstracts in one direction,
    would be a completely disconnected graph. Since the strongly connected components
    algorithm overestimates the disconnectedness of a bipartite graph like our knowledge
    graph, we will use the weak option. We can print the result to examine the number
    and structure of the clusters:


    ```

    connected_components = g.clusters(mode=''weak'')

    print(connected_components)

    ```'
