  md: '# Part 1:

    Getting Started

    with Graph Data Modeling


    This will be our first delve into graph data modelling in Python. This part covers
    what you need to know with regard to graph data modelling, such as why and when
    you need to use graphs; analyzing the fundamentals of graphs and how they are
    used in industry; and introducing the core packages you will be working with in
    these chapters, igraph and NetworkX.


    Moving on from the fundamentals, we will then look at how to work with graph data
    models and work through a television recommendation use case as a Python pipeline.


    This will serve as the entry-level part of this book and it has the following
    chapters:


    +   - Chapter 1, Introducing Graphs in the Real World

    +   - Chapter 2, Working with Graph Data Models'
