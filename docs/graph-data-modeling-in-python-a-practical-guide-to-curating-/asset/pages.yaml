    To abstract this problem, we can look at a classical graph theory method likely
    to be used by many travel optimization solutions. Dijkstra’s algorithm is commonly
    used to find optimized paths in weighted graphs.


    We can demonstrate Dijkstra’s algorithm with a simple example. In *Figure 5.3*,
    if we wanted to get from city A to city D, we would need to plan a route with
