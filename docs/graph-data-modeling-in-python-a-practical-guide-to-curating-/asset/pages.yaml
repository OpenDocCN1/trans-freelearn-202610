    the CREATE function, to prevent additional nodes from being created when reading
    in tabular data, or when executing write queries from Python. As discussed previously,
    the MERGE function first runs a match query to find a specified node or pattern,
    and if it already exists, does not write an additional node to the graph.

    +   3. Let’s run a basic query with MERGE to attempt to write a node that already
    exists to the graph:

