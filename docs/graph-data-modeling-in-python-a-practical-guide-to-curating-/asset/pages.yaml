  md: "10. Let’s next create a method for adding a customer purchase, in a similar\
    \ way to how we defined add_customer(). We can name our method add_purchase, and\
    \ this time, we will require more parameters in order to model a purchase correctly.\
    \ The function will take a customer, c, a product ID, the current time, and a\
    \ Neo4j connection. We will again handle the assembly of a Cypher query with f\
    \ strings. When a customer chooses a product and purchases it, to model this in\
    \ our graph, we need to MATCH on the customerID attribute of the correct Customer\
    \ node and MATCH on the productID of the matching Product node. These IDs are\
    \ appropriate to match on as we have defined them as unique in our schema – no\
    \ two customers or two products should share the same ID. The last step in our\
    \ query is to MERGE an edge between our aliased Customer and Product nodes, c\
    \ and p. We use a PURCHASED relationship to describe this edge and stamp the time\
    \ parameter on the datetime edge attribute. Again, the last step is to send the\
    \ query to our Neo4j database with connection.query():\n\n```\ndef add_purchase(c,\
    \ productID, time, connection):\n    query = f'MATCH (c:Customer {{customerID:\
    \ toInteger({c.customerID})}})' \\\n    f'MATCH (p:Product {{productID: toInteger({productID})}})'\
    \ \\\n    f'MERGE (c)-[:PURCHASED {{datetime:\"{time}\"}}]->(p)'\n    connection.query(query)\n\
    ```\n\n11. Now we can test the behavior of add_purchase(). Let’s use our already\
    \ created Customer object with ID 9999, which is also already present in the database,\
    \ and simulate a purchase. We can find a product for the customer to purchase\
    \ in the products.csv raw data, or in Neo4j – for this example, we will use the\
    \ node with productID 1010.\n\n12. First, we import datetime from datetime, in\
    \ order to access the current time at the point at which the purchase is made.\
    \ We then establish a connection to the database. We use our add_purchase() method,\
    \ and pass it our existing test_customer, along with productID 1010, the current\
    \ time with datetime.now(), and the Neo4j connection. The addition of the edge\
    \ will be handled by our function, so we can finish up by closing the connection:\n\
    \n```\nfrom datetime import datetime\nconnection = Neo4jConnect('bolt://localhost:7687',\n\
    \    'admin', 'testpython')\nadd_purchase(test_customer, 1010, datetime.now(),\n\
    \    connection)\nconnection.close()\n```\n\n13. As we did before, let’s go into\
    \ the Neo4j Browser for the Store DB database and see if we can find our newly\
    \ created edge. We can again run some Cypher to find edges between Customer and\
    \ Product nodes that have the edge type PURCHASED, and RETURN the nodes we matched:\n\
    \n```\nMATCH (c:Customer)-[:PURCHASED]->(p:Product) RETURN c, p\n```"
