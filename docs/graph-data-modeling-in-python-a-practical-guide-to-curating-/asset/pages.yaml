    # Graph pipeline development


    In the last chapter, we learned how to interface Python with a Neo4j database.
    We harnessed Neo4j’s long-term graph storage solution to set up a more realistic,
    production-like system, which could be queried to find air travel routes, according
    to several parameters.


    We set the graph database up by writing a large amount of data to it using static
    queries. At the point of setting up the database, we knew what data we wanted
    it to hold, and we wrote Cypher queries to get our data in, in bulk. The focus
    of the resulting graph was on delivering read query results to, for example, a
    frontend web application. These read queries were executed against the database
    only when we had a question to ask of the data.


    However, in reality, these graph database systems often serve as the backend to
    applications that frequently and automatically send queries to a graph database.
    These queries may not only be driven by direct user behavior but also executed
    to collect and compute information passively.


    For example, consider how a financial transaction graph might be stored by a financial
    services company, in order to look for suspicious activity. For this type of use
    case, the company would want to detect suspicious behavior as it was happening,
    rather than wait for a bulk upload of data, by which point fraudulent activity
    may have already occurred. In this scenario, there would likely be components
    in a data pipeline outside of just a graph database such as Neo4j, interacting
    in small queries, in order to write data and look for certain patterns of interest.


    In terms of write queries, rather than writing to a graph in bulk, as we did in
    the last chapter, small transactions of information from many users could be written
    to the graph, often simultaneously. In a graph database, there are some extra
    considerations to take into account for a system that performs in this way, which
    we will cover in this chapter.


    In the following sections, we’re going to set up a new Neo4j graph database and
    look at some ways in which large numbers of small read and write queries can be
