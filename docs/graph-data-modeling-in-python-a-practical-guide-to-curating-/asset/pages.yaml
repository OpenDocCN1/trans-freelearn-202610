  md: "+   2. With our data loaded, we could simply iterate through the imported `node_attributes`\
    \ list with a `for` loop, and add the developer name as a node attribute to each\
    \ node in turn, by accessing different nodes in `g.vs`:\n\n```\n```python\nfor\
    \ node_id, name in node_attributes:\n    g.vs[int(node_id)]['developer_name']\
    \ = name\nprint(g.vs['developer_name'])\n```\n```\n\n+   3. This works as intended,\
    \ but is not an efficient method, as our graph, `g`, is repeatedly accessed for\
    \ every node. Instead, it is much more efficient to add node properties listwise,\
    \ extracting the `developer_name` attribute from the second elements of our list\
    \ using a list comprehension, before adding them to `g.vs`:\n\n```\n```python\n\
    developer_names = [row[1] for row in node_attributes]\ng.vs['developer_name']\
    \ = developer_names\nprint(g.vs[0]['developer_name'])\n```\n```\n\nThe result\
    \ here is identical but requires less processing. However, it is important to\
    \ bear in mind that when properties are added to nodes or edges in a listwise\
    \ fashion, that ordering is extremely important. Attributes are added to nodes\
    \ so that the *igraph* node with ID 0 is assigned the attribute value at index\
    \ 0 of the list. The order of the attribute list added to our graph must be in\
    \ line with the order of our node IDs in *igraph*.\n\n+   4. This can be particularly\
    \ dangerous if there is duplicate node attribute information. We can demonstrate\
    \ what might go wrong by adding a duplicate of the first element to our `developer_names`\
