  md: 'Using a graph structure to represent this train network puts greater emphasis
    on relationships between our data points. Starting from Truro station, as in the
    RDB example, we find the train that services that station. However, when traversing
    the graph to find a possible route between Truro and Glasgow Central, at each
    station or train node we are considering fewer data points, and therefore fewer
    options.


    This is in contrast to the RDB example, where repeated table joins are necessary
    to return a path. In this case, the complexity of the operations required over
    the graph representation is lower, which equates to a faster, more efficient method.
    Among many other use cases, those that require some sort of *pathfinding* often
    benefit from a graph data model.


    In addition to being more suitable for specific types of queries, graphs are typically
    useful where a flexible, evolving data model is needed. Again, using the example
    of the train network, imagine that, as the database administrator, you have received
    a request to add bus transport links to the data model.


    With an RDB, a new table would be required, since several bus services would likely
    serve each train station. In this new table, the names of each station would need
    to be duplicated from the existing table, to list alongside their related bus
    services.


    Not only does this duplication increase the size of data stored, but it also increases
    the complexity of the database schema:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_27_0.png)


    Where the train station data is represented with a graph, the new information
    on buses can be added directly to the existing database as a new node type.'
