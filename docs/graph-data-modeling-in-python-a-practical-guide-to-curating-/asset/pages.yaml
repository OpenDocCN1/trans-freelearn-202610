    3. Let’s move on to something that would be trickier to calculate using the knowledge
    graph and trivial with a projection – the degree distribution. Searching for paths
    by starting at films and going back to co-stars for every node representing an
    actor in order to find the number of co-stars would be time consuming in our original
    graph data. However, with our co-star projection, we can simply count the number
