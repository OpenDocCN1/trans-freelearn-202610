    \            add_purchase_id(c1, p, datetime.now(), connection)\n        for p\
    \ in p2_recs:\n            add_purchase_id(c2, p, datetime.now(), connection)\n\
    ```\n\n13. With everything set up for our new type of recommendations, we just\
    \ need to call rec_by_similarity() to make similarity-based recommendations for\
    \ all of our customers, as we did for our previous recommendation methods:\n\n\
    ```\nfor pair in customer_pairs:\n    connection = Neo4jConnect('bolt://localhost:7687',\
    \ 'admin', 'testpython')\n    rec_by_similarity(pair[0], pair[1], 0.7, connection)\n\
    \    connection.close()\n```\n\nTo explore the effect of this type of recommendation\
    \ on our stored customer data, at this point, it may be interesting to open the\
    \ Neo4j Browser and run some simple queries. With many different recommendation\
    \ systems in place, an online retailer might pit different systems against each\
    \ other in A/B testing, and monitor how they drive purchases. These systems represent\
    \ just a few recommendation methods possible with a graph data model representing\
    \ customer and product data.\n\nThis brings this chapter to a close. We will extend\
    \ the work we have done here to look at refactoring considerations to make when\
    \ setting up your schema, and also to look at evolving schema. This chapter has\
