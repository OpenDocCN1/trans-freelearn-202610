    Even very disparate fields are likely to use common scientific language, and this
    is reflected in the number of components.


    If we were using documents containing terms we expected to be unrelated and creating
    a knowledge graph from them, then connected components could be a useful indicator
    of whether term frequency thresholds are set correctly during entity extraction.
    When designing a pipeline for data ingestion into a knowledge graph, these thresholds
    could be varied to reach an expected number of weakly connected components.


    +   3. Another element of structure we can examine is the degree distribution
    of nodes in our knowledge graph. The degree of a node is the number of neighboring
    nodes, or the nodes that share an edge with our node of interest. Looking at the
    degree distribution across our entire graph will help us to understand how abstracts
    and terms are connected on a large scale. Since we have a heterogeneous graph
    containing two types of nodes, it makes sense to examine the degree distribution
    of each node type separately. This is especially important in a bipartite graph,
    as we know that terms only connect to abstracts, and vice versa. We might expect
    these degree distributions for different types of nodes to be quite different,
    given the large number of biomedical terms that we are extracting from each abstract.


    To create our distributions, we first need to use the `vs.select()` method again
    to select only nodes of a specific type, beginning with nodes we have labeled
    abstract. We can do this using the custom `type_eq` parameter, where type specifies
    our node attribute type that we created earlier, and the `_eq` suffix specifies
    that it must be equal to the string `abstract`. We can use a very similar `select()`
    method to get a list of term nodes:


    ```

    abstract_nodes = g.vs.select(type_eq=''abstract'')

    term_nodes = g.vs.select(type_eq=''term'')

    ```


    +   4. To find the degree of our abstract and term nodes, we can use igraph’s
    `degree()` method. It is important to remember that our graph is directed and
    `degree()` has a mode parameter that specifies in which direction edges should
    face in order to be counted for degree. However, since the default value of mode
    is degree, we can leave the mode parameter out this time:


    ```

    abstract_degree = g.degree(abstract_nodes)

    term_degree = g.degree(term_nodes)

    ```


    +   5. Our abstract_degree and term_degree variables contain lists of node degrees.
    We can plot these in a histogram using the matplotlib module, with pyplot. After
    importing the module as plt, let’s first plot a histogram of values in abstract_degree
    by using plt.hist(), with a number of bins to divide our data into and an edgecolour
    of black, in order to tell each bin apart. We can then set the xlabel() and ylabel()
    of our chart, before finishing by drawing the chart with plt.show():


    ```

    import matplotlib.pyplot as plt

    plt.hist(abstract_degree, bins=20, edgecolor=''black'')

    ```'
