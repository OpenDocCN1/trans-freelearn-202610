- pgno: 146
  md: 'By using sleep(), as the script runs, you can switch to the Neo4j Browser and
    see the numbers of nodes and edges increase gradually. Using f strings to assemble
    Cypher queries in Python is a powerful way to generalize graph database processing.
    Of course, similar behavior is available in other languages frequently used in
    data pipeline construction, such as Java, though Python is a good place to start
    when thinking about the design elements required by our processes and schema.


    At this point of creating our newly defined classes and methods, we have everything
    we need to store data on customer interactions with our online retail application.
    We could stop here, knowing that we’re capturing data correctly, but that wouldn’t
    be making the most of the graph data model we have set up. Instead, let’s next
    look at how we can use the data we’ve collected to drive further customer interactions.


    # Making product recommendations


    Often, when using an online retail application or service, you will find that
    products are recommended to you. This can be driven by browser cookies, products
    that you have viewed already, or previous purchases. In our case, we have information
    on previous product purchases, so we will use that data to make suggestions.


    Even with the choice of using prior purchases to inform our recommendations, the
    decision to recommend a specific product to you can be made in many different
    ways. If a customer has purchased an item from a specific brand, would they be
    interested in owning more products from the same brand? Or, should we recommend
    a product to a customer based on other customers behavior?


    In the following sections, we will design and test a few different recommendation
    methods, and this starts in the next section by looking at product recommendations
    by brand.


    # Product recommendations by brand


    As we briefly discussed in the Schema design section, we can think of our product
    information as the backbone of our graph structure. It contains categorical information
    on types of products and brands and can be thought of as a kind of product ontology.
    We can exploit the information in this ontology to create a simple method for
    recommending products to customers, based on their previous purchases.


    To do this, we can make the assumption that a consumer is more likely to be interested
    in purchasing a product from a brand that they have purchased a product from in
    the past. We will cover this in the next steps of this section:


    +   1. Let’s define a new method, named rec_by_brand(). Similar to our existing
    methods, this will again take c, a Customer object, and connection, an authenticated
    Neo4j session. In this function, we can write a Cypher query that makes use of
    several MATCH statements.'
