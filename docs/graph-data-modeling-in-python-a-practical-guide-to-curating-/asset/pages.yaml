    # Chained statements and select


    The select() method can be used in conjunction with vs and es to access nodes
    and edges in all manner of different ways, by their indices, their properties,
    and measures calculated on the fly. However, caution is advised if using select()
    to sample nodes or edges with chained statements. Using select() in a chained
    manner can have unintended consequences.


    When select() is used, it generates either a VertexSeq or EdgeSeq object depending
    on whether it was used to find nodes or edges. The vs and es attributes of a graph
    have VertexSeq and EdgeSeq classes too. It is therefore possible to also use select()
    on the results of a select() call.


    We will now take you through a worked example of this:


    +   1. Let’s demonstrate how this can cause some issues using the GitHub developer
    social network. We can sample nodes with specific indices by using an iterable
    as the first parameter in a select() call. Here, we are selecting nodes with IDs
    0, 1, and 2:


    ```

    sample = g.vs.select([0, 1, 2])

    print(list(sample))

    ```


    +   2. Select() can, as we have previously seen, also be used to sample nodes
    with a specific property, or measure. Here, we are using the method to find all
    nodes with degree equal to exactly 100, by using _degree_eq as a special parameter:


    ```

    degree_100 = g.vs.select(_degree_eq=100)

    print(list(degree_100))

    ```


    Our degree_100 variable now contains a VertexSeq object, containing nodes sampled
    from our original graph, g. We can use select on this too to refine our node sample
    further. However, we should be wary when using IDs to sample or check the existence
    of specific nodes.


    +   3. Imagine a scenario where we want to test our sampling method with select
    is working correctly, by checking for the existence of a node. We know that the
    node with ID 1075 should be present in this VertexSeq, as it has a degree of exactly
    100. So, we could use an assert statement to ensure this:


    ```

    assert degree_100.select([1075])

