- pgno: 151
  md: "# Using similarity scores to recommend products\n\nThere is one last method\
    \ for recommending products that we will consider in this chapter, which leans\
    \ more heavily on Python and its interface with our Neo4j database. The previous\
    \ system of recommending products based on joint customer purchases makes use\
    \ of customer data and might be used after a purchase is made on our retail application,\
    \ to point the user toward additional products of interest. However, we can extend\
    \ the idea that customers are likely to purchase similar sets of products by looking\
    \ at overall purchase history similarity. This type of general recommendation,\
    \ based on sets of past purchases, would more likely be delivered to a customer\
    \ on the home page of our application.\n\nTo compare customer purchases, we can\
    \ look at similarity measures. These measures return a score based on the similarity\
    \ between the elements in two sets. Several methods, each stemming from set theory,\
    \ can be employed to calculate the similarity between groups of nodes. Examples\
    \ are overlap similarity, the dice coefficient, and Jaccard similarity due to\
    \ its ease of implementation and explainability.\n\nJaccard similarity is defined\
    \ as the intersection between two sets, divided by the union of the same sets.\
    \ Essentially, this results in a value from 0 to 1, where 0 represents no similarity,\
    \ and a score of 1 means two sets are identical. We can use this measure to find\
    \ similar customers, in terms of their purchases. We will be defining our own\
    \ simple implementation for the calculation of Jaccard similarity, but more information\
    \ and examples are available in the scikit-learn documentation.\n\nFor our purposes,\
    \ when similar customers are found, with a high but not perfect overlap in product\
    \ purchases, we can identify the differences remaining between their sets of purchases\
    \ and recommend these to a customer. By now, our database contains lots of purchases\
    \ for our 100 customers, so taking full advantage of the data available to us,\
    \ let’s go ahead and implement the final recommendation method for this chapter\
    \ in Python. These steps will show how we can use Jaccard similarity in our use\
    \ case:\n\n+   1. Calculating the Jaccard similarity between customers purchases\
    \ is a little more involved than the previous methods, and while Cypher excels\
    \ in path-based calculations, Python is a more suitable language for similarity\
    \ calculations. Due to this, let’s first define a simple method to extract all\
    \ purchases for a given customer ID, c_id, using similar steps to what we used\
    \ for rec_by_brand() and rec_by_copurchase():\n\n```\ndef get_customer_purchases(c_id,\
    \ connection):\n    query = f'MATCH (c:Customer {{customerID: toInteger({c_id})}})'\
    \ \\\n            '-[ :PURCHASED ]->(p:Product)' \\\n            'RETURN DISTINCT\
    \ p.productID as productID'\n    result = connection.query(query).data()\n   \
    \ result = [product['productID'] for product in result]\n    return result\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: "2. Calling this method for one customer should return a list of product IDs\
    \ they have purchased:\n\n```\nconnection = Neo4jConnect('bolt://localhost:7687',\n\
    \    'admin', 'testpython')\npurchases = get_customer_purchases(\n    customers[10].customerID,\
    \ connection)\nconnection.close()\nprint(purchases)\n```\n\n3. To make sure this\
    \ is correct, we could compare the printed list to that found by a simple, equivalent\
    \ query in the Neo4j Browser:\n\n```\nMATCH (c:Customer {customerID:10010})-[:PURCHASED]-(p:Product)\n\
    RETURN DISTINCT p.productID as productID\n```\n\n4. Now that get_customer_purchases()\
    \ is working, we can get all customer purchases by using a dictionary comprehension\
    \ over all customers in our list of Customer objects. For every customer, we call\
    \ our method, and pass our Neo4j connection:\n\n```\nconnection = Neo4jConnect('bolt://localhost:7687',\n\
    \    'admin', 'testpython')\nall_purchases = {customer.customerID:\n    get_customer_purchases(customer.customerID,\n\
    \    connection)\n    for customer in customers}\n\nprint(all_purchases)\n```\n\
    \nThis results in a dictionary with keys containing customer IDs, and values containing\
    \ lists of product IDs that a customer has purchased.\n\n5. We next need to define\
    \ a function to calculate the Jaccard similarity between these sets of purchased\
    \ products. We can do this according to the standard implementation, which requires\
    \ two sets, so first, the parameters list1 and list2 are converted to Python sets.\
    \ Next, we find the intersection between set1 and set2, as well as finding the\
    \ union. Finally, the Jaccard similarity is calculated by dividing the length\
    \ of the set's intersection by the length of the set's union, and we return the\
    \ value:\n\n```\ndef jaccard_similarity(list1, list2):\n    set1 = set(list1)\n\
    \    set2 = set(list2)\n    intersection = set1.intersection(set2)\n    union\
    \ = set1.union(set2)\n    jaccard = len(intersection) / len(union)\n    return\
    \ jaccard\n```"
  merge: -1
  img_proc: true
- pgno: 153
  md: "6. Jaccard similarity can be calculated by hand easily for simple sets, so\
    \ we can ensure that our method is functioning as expected by creating some test\
    \ data and using `assert` to check we get back the correct similarity scores:\n\
    \n```\n```python\nlist1 = [1, 2, 3, 4]\nlist2 = [5, 6, 7, 8]\nlist3 = [1, 2]\n\
    assert jaccard_similarity(list1, list1) == 1\nassert jaccard_similarity(list1,\
    \ list2) == 0\nassert jaccard_similarity(list1, list3) == 0.5\n```\n```\n\n7.\
    \ With our `jaccard_similarity()` method defined and tested, we are ready to calculate\
    \ the similarities between pairs of our customers purchase histories. For this,\
    \ we need a list of all pairs of our customers IDs, and a quick way to get this\
    \ is by using Python’s inbuilt `itertools` library. If we first get all keys containing\
    \ customer IDs from our `all_purchases` dictionary, we can then find all unique\
    \ pairs with `itertools.combinations()` by passing our customer IDs and the value\
    \ 2, which specifies to return combinations of two elements only:\n\n```\n```python\n\
    import itertools\ncustomer_ids = list(all_purchases.keys())\nprint(customer_ids)\n\
    customer_pairs = list(itertools.combinations(\n    customer_ids, 2))\nprint(customer_pairs[:10])\n\
    ```\n```\n\nNow, with our `customer_pairs` list, let’s calculate Jaccard similarity\
    \ for the customer’s purchases using another dictionary comprehension. This comprehension\
    \ will go through every pair in `customer_pairs`, using the values of each pair\
    \ as keys to access the purchase list values stored in the `all_purchases` dictionary.\
    \ These lists are then passed to our `jaccard_similarity()` method. This results\
    \ in a further dictionary with customer pairs as keys, and similarity scores as\
    \ values, which we will name `similarity`:\n\n```\n```python\nsimilarity = {pair:\
    \ jaccard_similarity(all_purchases[\n    pair[0]], all_purchases[pair[1]]) for\
    \ pair in\n    customer_pairs}\n```\n```\n\n8. Let’s look at the distribution\
    \ of scores for our customer pairs in the similarity dictionary. We can use the\
    \ `collections` library and the `Counter` method for this, as we have done in\
    \ several previous chapters, and print a quick view of the distribution of our\
    \ dictionary’s values:\n\n```\n```python\nfrom collections import Counter\ngrouped_similarities\
    \ = Counter(similarity.values())\nprint(grouped_similarities)\n```\n```\n\n9.\
    \ At this point, depending on how many purchases and customers your database contains,\
    \ you will have differing distributions. However, there are likely to be some\
    \ pairs of customers with a Jaccard similarity of 1, meaning that their purchases\
    \ are identical. In this scenario, we wouldn’t"
  merge: -1
