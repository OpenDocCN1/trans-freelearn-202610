    What data do we want to hold on our customers? What will help us to recommend
    products to them?


    Let’s take a look at the products that our online electronics retailer sells.
    We can get a rough idea of the information we have by opening up `products.csv`,
    and examining the first few lines:


    ```

    productID,name,brand,mainType,subType

    1001,WX100 In-ear Headphones,Hans,Audio,Bluetooth Headphones

    1002,WX-B210 Bluetooth Headphones,Hans,Audio,Bluetooth Headphones

    1003,Hans-3 Bluetooth Headphones,Hans,Audio,Bluetooth Headphones

    1004,J9 Bluetooth Headphones,JLB,Audio,Bluetooth Headphones

    1005,J8-I In-ear Headphones,JLB,Audio,Bluetooth Headphones

    1006,J-Basics Wired Headphones,JLB,Audio,Wired Headphones

    ```


    From the structure of this data, it looks like each product our retailer currently
    offers is listed on a separate CSV row. We have a product ID for each one, a name,
    and a product brand. We also have a level of categorization for each product,
    in the `mainType` and `subType` columns. So, we have three distinct types of entities
    to hold in our graph, which can be represented by the node types Product, Brand,
    and Type. Each unique product has a type and a brand that we could represent with
    the named edges `HAS_TYPE` and `HAS_BRAND`, respectively.


    For each main type, there are several subtypes of products. We can think of these
    descriptive classes as a sort of ontology, a concept we explored more thoroughly
    in *Chapter 4, Building a Knowledge Graph*, where we dealt with knowledge graphs.
    In this case, we can consider connecting subtypes to the main types of products
    in our graph, and represent classes of products at different granularities. One
    way to do this would be to create more `HAS_TYPE` relationships between subtypes
    and the main types.


    This data will form the backbone of our database, containing links between products,
    brands, and their types. The schema of our graph will develop as we consider different
    elements, and will become more complex, but to begin, let’s design a data model
    for our products alone:'
