- pgno: 81
  md: '![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_81_0.png)


    Figure 4.1 – An example knowledge graph excerpt


    Knowledge graphs are also commonly associated with an ontology. An ontology is
    a collection of linked concepts, often related to a specific topic. Because of
    this, an ontology can also be thought of as a kind of graph, where concepts are
    nodes and links represent a relationship between those concepts.


    Ontologies are regularly hierarchical in nature, where one broad concept may encompass
    several less broad concepts. For example, if we were to create a taxonomy of mammals,
    we might make a relationship between the concepts of mammal and dog and mammal
    and cat. In turn, because cat in itself is a broad concept, we may also make relationships
    from cat to tiger and cat to cheetah.


    We can use ontologies in knowledge graph construction to locate concepts within
    documents; where similar concepts appear in two bodies of text, we may link a
    pair of documents together. Again, depending on the level of sophistication of
    the text processing being used, this could be as simple as matching words, or
    more complex, by using NLP tools such as lemmatization to aid in matching. In
    terms of knowledge graph creation, this can be thought of as a top-down approach
    – we know what terms we are looking for and how they are related, but we won’t
    be finding any new concepts.


    Flipping this idea on its head, we can also use text in documents to create an
    ontology within a knowledge graph. This is known as a bottom-up approach and contrasts
    with the previous example and its predefined ontology use. In a bottom-up approach,
    we can lean on the assumption that if concepts or terms are co-located (share
    a location with something else) in text, they are more likely to be related. For
    example, in a document about international travel, you are likely to see the terms
    airport,'
  merge: -1
  img_proc: true
- pgno: 82
  md: '*airplane*, and so on. In the same document, you are far less likely to see
    terms, for example, associated with space travel, such as *rocket* or *moon*.
    Using these ideas, it is possible to use the co-occurrence of terms to link concepts
    and begin to construct a rudimentary ontology. This, of course, will not be perfect,
    like a hand-constructed ontology curated by experts might be, but the approach
    is far faster and easier to get off the ground with. Machine-constructed ontologies
    can also be further curated by experts if required.


    In this chapter, we will be using ideas from both the *top-down* and *bottom-up*
    approaches to create a knowledge graph. To construct the graph, we will use publicly
    available research paper abstracts from PubMed and a corpus of medical terms.
    We can add value to both terms and abstracts by using the abstract’s text to link
    co-occurring terms.


    Now, we will look at how you clean your data prior to creating the knowledge graph.


    # Cleaning the data for our knowledge graph


    Knowledge graphs typically contain relationships that represent commonalities
    between related documents and are built up using the content within those documents
    text. For this reason, a large part of knowledge graph construction is cleaning
    and preparing that text for later graph creation.


    Let’s begin by taking a look at the raw abstract data in `20k_abstracts.txt`.
    This data is displayed as in the following abstract style:


    **Aspergillus fumigatus**

    BACKGROUND IgE sensitization to Aspergillus fumigatus and a positive sputum fungal
    culture result are common in patients with refractory asthma.


    BACKGROUND It is not clear whether these patients would benefit from antifungal
    treatment.


    OBJECTIVE We are seeking to determine whether a 3-month course of voriconazole
    improved asthma-related outcomes in patients with asthma who are IgE sensitized
    to Aspergillus.


    We can see that each abstract is given a reference number preceded by hashes and
    each sentence is preceded by a sentence type in capital letters. In addition,
    each abstract is separated by a newline.


    It is common for text data to need processing before use, and this case is no
    exception. In our case, the abstract text has been prepared for another NLP application
    and contains information that we do not need, such as sentence types and reference
    numbers. For our purposes, we only need the text for each abstract, so let’s next
