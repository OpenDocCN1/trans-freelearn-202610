    We will return to these degree distribution charts, as they are a particularly
    useful visualization of a graph’s structure.


    The type of graph structure we see here, where many nodes have few connections
    and few nodes have many connections, is very common. For reference, nodes that
    are highly connected in any given graph are known as hubs or hub nodes. These
    hub nodes are often responsible for a disproportionate level of connectivity between
    nodes, which gives rise to phenomena such as the six degrees of separation in
    social networks, where just six friends of friends can be used to connect any
    two people. We will explore these concepts in detail in later chapters, but for
    now, we’ll focus on identifying nodes of importance in our Facebook graph.


    # Measuring connectedness


    Not all graphs are fully connected, and it may be of interest to learn about this
    aspect of our Facebook mutual likes dataset. If any node in a graph cannot be
    reached from another node when traversing through edges, then a graph is fragmented.
    Each distinct part of the graph in this case is known as a connected component.


    Let’s use igraph to check how many connected components are in our Facebook mutual
    likes graph. We can use igraph’s inbuilt clusters() method to do this easily:


    ```

    connected_components = g.clusters()

    print(connected_components)

    ```'
