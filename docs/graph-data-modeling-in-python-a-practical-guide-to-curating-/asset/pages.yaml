  md: 'With our film dataset loaded into a persistent database, we can create various
    projections in order to answer different questions using our graph data. If we
    want to see what actors work together on various films, we could create a projection
    of co-starring actors. We could also create a projection to dive deeper into what
    films share common actors, and how much this is influenced by the country used
    in filming. We are next going to tackle how to generate both of these predictions,
    before moving on to using projections to sensibly and efficiently analyze our
    data.


    # Creating a projection in igraph


    Let’s create our first projection in Python, by reading from the Neo4j database
    and importing it into igraph. To do this, we will use a package we have created
    to import the functions we will use again and again in these graph projects. The
    function we will use is the Neo4jConnect function and this can be imported from
    the graphtastic package that is found in the associated GitHub repository (link
    in the Technical requirements section of this chapter). The following steps will
    cover the importing of this module to connect to Neo4j and then how you create
    a projection, step by step, with igraph and Python. Let’s get projecting:


    +   1. Import the Neo4jConnect class from the graphtastic package:


    ```

    from graphtastic.database.neo4j import Neo4jConnect

    ```


    +   2. With our class and methods in place to connect to the Neo4j database, we
    can now figure out how to get some data from Neo4j, in the form of a graph projection.
    The projection we’re aiming for is a graph containing information on what actors
    co-star alongside each other in films. In our Neo4j database, we have the STARRING
    relationship, which connects film Entity nodes to actor Entity nodes.


    +   3. Let’s quickly take a look at these relationships by looking up a pair of
    actors that starred in the same film, with some Cypher in the Neo4j Browser. Here,
    we can identify the correct types of Entity nodes by using MATCH with the specific
    STARRING relationship type:


    ```

    MATCH (act1:Entity)<-[:STARRING]-(film:Entity)-[:STARRING]->(act2:Entity)

    RETURN act1, film, act2 LIMIT 1

    ```


    We can see from the browser results that actors are connected through films. However,
    in our projection, we want to connect co-starring actors. So, any Cypher query
    we run in Python to get edge data for our projection needs to find nodes and edges
    that have this pattern and return just the nodes containing actor information.


    +   4. Knowing this, we can write a method in Python to access this actor data,
    get_co_stars_neo4j(). This method will take only a Neo4j connection object and
    use the pattern we found in a MATCH statement using the Neo4j Browser to find
    co-starring actors. We only need to return the node on the edge of our pattern,
    here aliased to act1 and act2. We execute the query using the connection.query()
    method, and access a list of dictionaries containing our query result with result.data().
    As a last step, we clean up the data structure by accessing'
