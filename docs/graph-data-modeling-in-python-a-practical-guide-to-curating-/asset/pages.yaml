- pgno: 191
  md: "an open parenthesis, with the first parameter containing the Cypher logic to\
    \ match Entity nodes. We want to connect films that have actors in common in our\
    \ projection, so we need to match paths that contain two films, each with a STARRING\
    \ relationship to another entity, containing an actor. Once this path is matched,\
    \ we finish off the first Cypher string by returning film1 and film2, the nodes\
    \ we want to add to our projection.\n\nIn periodic.iterate(), the second parameter\
    \ contains another Cypher string, which contains the logic for what to do with\
    \ the returned results of the previous query. For each path we find, we want to\
    \ merge two new Film nodes and give them the name property. We can then connect\
    \ f1 and f2, our newly created node aliases, with a HAS_COMMON_ACTORS edge. The\
    \ last parameter for our function is a dictionary containing information on how\
    \ to execute our batched query. A batchSize value of 1000 tells the function to\
    \ find 1,000 results from the first Cypher query parameter before executing the\
    \ second parameter's Cypher using the results of the first. The other option we\
    \ pass is parallel, which, when set to True, enables parallel processing in batches\
    \ of 1,000. In this specific case, parallelizing these batches would lead to errors\
    \ due to the locking of nodes during updates, which we will go into more detail\
    \ about in Chapter 9, Common Errors and Debugging. For now, let's close our complex\
    \ APOC function with a parenthesis and run our query in the Neo4j Browser:\n\n\
    ```\nCALL apoc.periodic.iterate(\n  \"MATCH (film1:Entity)-[:STARRING]->(actor:Entity)\n\
    \    <-[:STARRING]-(film2:Entity)\n  RETURN film1, film2\",\n  \"MERGE (f1:Film\
    \ {name:film1.name})\n  MERGE (f2:Film {name:film2.name})\n  MERGE (f1)-[:HAS_COMMON_ACTORS]->(f2)\"\
    ,\n  {batchSize:1000, parallel:false}\n)\n```\n\nThis batched query may take up\
    \ to a few minutes to run, depending on the specifications of the machine running\
    \ it. Once it has finished, the Neo4j Browser will display information on how\
    \ many batches were needed to complete the apoc.periodic.iterate() task, as well\
    \ as whether any batches failed. Had we used parallel:True for this, we would\
    \ have likely noticed some batch failures, and several write operations will not\
    \ have been completed, due to the potential for multiple writes to the same nodes\
    \ at once.\n\n4. With our graph's structure set up, we can now add additional\
    \ properties to our nodes. For our graph projection, we are interested in the\
    \ countries the films are shot in, and in our main graph, these relationships\
    \ are represented with COUNTRY edges. It is possible to move this relationship\
