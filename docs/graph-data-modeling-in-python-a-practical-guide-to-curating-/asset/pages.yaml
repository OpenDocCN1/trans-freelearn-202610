  md: "```\nMATCH (b)<-[:HAS_BRAND]-(r:Product)\nWHERE NOT (c)-[:PURCHASED]->(r)\n\
    RETURN c, p, b, r\n```\n\nInstead of returning product IDs for recommendation,\
    \ in this query we return the Customer, Brand, and Product nodes we have matched,\
    \ and can validate that the paths between them are as expected. We can adjust\
    \ the RETURN statement to filter to just the recommended products or other types\
    \ of nodes of interest.\n\n5. When we’re happy that our recommendations by brand\
    \ are functioning correctly, we can perform these for all customers, and simulate\
    \ purchases based on these recommendations. For each Customer object in our customer\
    \ list, we can make recommendations with rec_by_brand(), and assign these to a\
    \ list. We specify a condition that brand_recommendations must not be of length\
    \ 0, as we cannot choose a product to recommend to a new customer with this method\
    \ that has no purchase history. An empty list would also cause the next step to\
    \ fail, where we again use the random.choice() method to choose a recommended\
    \ product from our list for a customer to buy. We again use the add_purchase()\
    \ function to create an edge in our graph between our Customer and their newly\
    \ purchased product, based on our recommendation:\n\n```\nfor customer in customers:\n\
    \    connection = Neo4jConnect('bolt://localhost:7687', 'admin', 'testpython')\n\
    \    brand_recommendations = rec_by_brand(customer, connection)\n    connection.close()\n\
    \    if len(brand_recommendations) != 0:\n        product = random.choice(brand_recommendations)\n\
    \        connection = Neo4jConnect('bolt://localhost:7687', 'admin', 'testpython')\n\
    \        add_purchase(customer, product, datetime.now(), connection)\n       \
    \ connection.close()\n```\n\n6. Of course, we may want to recommend products through\
    \ other simple methods, for example, based on the type or subtype of previous\
    \ purchases. This would be a case of changing the path-matching logic in rec_by_brand()\
    \ to traverse different types of relationships, to different types of nodes. We\
    \ may also want to prevent products being recommended based on whether they are\
    \ the same product type as one already purchased, assuming that a customer is\
    \ less likely to make a purchase of something they already have. In the Neo4j\
    \ Browser, the Cypher to start designing this process might look something like\
    \ this, making use of pattern matching to find product types, and negating matching\
    \ these types for recommendations, using an additional clause in the WHERE statement:\n\
    \n```\nMATCH (c:Customer {customerID:10010})-[:PURCHASED]->(p:Product)\nMATCH\
    \ (p)-[:HAS_TYPE]->(st:Type)\nMATCH (p)-[:HAS_BRAND]->(b:Brand)\n```"
  merge: -1
