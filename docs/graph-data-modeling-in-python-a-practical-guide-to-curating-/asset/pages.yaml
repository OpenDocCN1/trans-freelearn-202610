- pgno: 200
  md: 'only `Film` nodes and `HAS_COMMON_ACTORS` relationships that are part of our
    projection, and ensuring we are not querying the rest of the knowledge graph stored
    in the same database. Then, we can use WITH to access the country attributes of
    our Film nodes and alias them to c1 and c2. We are interested in films that share
    actors that have different filming locations, so we will use the <> operator to
    compare the countries. Then, using WITH to pair up the country lists, we can return
    country_pair alongside the count () of each unique pair, which implicitly aggregates
    our results. The very last step is to order the results by count (country_pair)
    in descending order so that we can focus on the most common pairings:


    ```

    ```cypher

    MATCH (f1:Film)-[:HAS_COMMON_ACTORS]->(f2:Film)

    WITH f1.country as c1, f2.country as c2

    WHERE c1 <> c2

    WITH [c1, c2] as country_pair

    RETURN country_pair, count(country_pair)

    ORDER BY count(country_pair) DESC

    ```

    ```


    In our results, we can see that films sharing actors often have very closely located
    countries of filming, with some top results being the United States and Canada.
    Language also seems to have an impact, with another frequent location pairing
    for our shared-actor films being the United States and the United Kingdom. Our
    most common result shows us a pair of `Cinema of Hong Kong` and `Hong Kong`, which
    hints to us that our data could have benefitted from additional cleaning – this
    is fairly common in scraped semantic data, and could help to direct data quality
    improvements in the original knowledge graph.


    # Summary


    In this chapter, we have used both Python and Neo4j to create, store, and analyze
    graph projections, demonstrating their power in both the efficiency and interpretability
    of results. Each technology has its own separate strengths. In Neo4j, we have
    less readily available access to complex graph data science algorithms to analyze
    our projection, compared to what we can easily carry out in Python with *igraph*.


    However, using Neo4j is a more permanent storage option and suitable for a projection
    we might want to repeatedly read and write to. For any given use case, it is important
    to consider what the most appropriate projection creation and storage tool is
    for the task at hand.


    These skills you have acquired will allow you to navigate between Neo4j, Python,
    and igraph with ease and will have set a strong foundation to build pipelines
    between the two technologies – a happy marriage indeed.


    In the next, and final, chapter, you will learn about some of the common headaches
    of a graph data scientist. These lessons will focus on debugging (really, the
