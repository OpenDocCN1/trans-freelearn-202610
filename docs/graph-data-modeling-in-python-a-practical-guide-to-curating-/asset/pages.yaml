  md: 'the cost of some storage space, and some initial time required to create the
    index. This will be done in a series of steps:


    +   1. Let’s demonstrate this by comparing the speed of our write query in the
    previous section with and without an index. First, if our graph still contains
    data, we can remove it using MATCH and DETACH DELETE:


    ```

    MATCH (n) DETACH DELETE n

    ```


    +   2. Now, with our empty graph, let’s create an index for Developer nodes, on
    the githubId property. We do this using CREATE INDEX, specifying a name, githubId_index,
    before identifying a node type it applies to with FOR, and the node property to
    build an index for with ON:


    ```

    CREATE INDEX githubId_index

    FOR (d:Developer)

    ON (d.githubId)

    ```


    +   3. Now, try running the write query from the previous section again, used
    to add Developer nodes to the Neo4j database. You will notice that the speed of
    this query has increased dramatically. As nodes are created using data from the
    CSV, an index is built up for the githubId attributes. Then, when the MERGE statements
    are used to add new Developer nodes, using our index, Neo4j can either find existing
    nodes or establish that they don’t exist, far more quickly.


    It is worth bearing in mind that indexes are used for every type of query that
    involves matching on a particular property, not just write queries. A read query
    matching many paths involving Developer nodes and returning information about
    them would run far faster with an index in place than without.


    The one potential downside of indexes is that indexes can take up a large amount
    of storage space and so it is not always optimal to store an index of a property
    that is rarely queried, especially in the case of very large graphs.


    Should you need to remove an index on a rarely queried property, you can use DROP
    INDEX, followed by the name of the index set up when CREATE INDEX was called previously:


    ```

    DROP INDEX githubId

    ```


