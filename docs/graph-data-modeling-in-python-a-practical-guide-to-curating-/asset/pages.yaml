  md: 'The modified graph can now be used to make recommendations. To make comparisons
    to other user nodes, we need to find nodes with type equal to ''source'', which
    represents users in our previously defined mysql_to_graph() method. We can find
    nodes of the source type by using g.vs.select(). Then, we need to set up a list
    of lists containing pairs of nodes to compare. We want to compare our specified
    user to all other users in our graph, so we will write a list comprehension to
    create a list of lists, where each element is a two-element list of our chosen
    user''s igraph ID and another user''s igraph ID. We don''t want to compare our
    selected user node with itself, so we will use a conditional != in the comprehension
    to prevent this:


    ```

    other_user_nodes = g.vs.select(type_eq=''source'')

    pairs = [[user_node, other_user.index] for other_user in other_user_nodes if other_user.index
    != user_node]

    ```


    Now, with our list of comparisons to make, we can run igraph''s similarity_jaccard()
    to generate similarity scores for our pairs of nodes. In this case, since our
    edges run from users to games in a directed manner, we are interested in the “out”
    direction, which is specified in the mode parameter of similarity_jaccard(). Our
    similarity scores will be returned as a list, so they need to be linked to the
    node IDs related to the pair comparisons. We can do this using a list comprehension
    to take the compared user igraph ID in the second element of each list in pairs
    and link this to scores with zip():


    ```

    similarities = g.similarity_jaccard(pairs=pairs, mode=''out'')

    node_similarity = [[pair[1], similarity] for pair, similarity in zip(pairs, similarities)]

    ```


    We want to find the user most similar to our specified user, so we need to sort
    our node_similarity list by descending Jaccard similarity score. We can do this
    using Python''s sorted() method, with an anonymous function to sort by the second
    element in each list in node_similarity. We will specify reverse=True to sort
    the list in descending fashion. Then, we can get the igraph ID of our most similar
    user by accessing the first element in our sorted list:


    ```

    node_similarity = sorted(node_similarity, key=lambda x: x[1], reverse=True)

    most_similar_node = node_similarity[0][0]

    ```


    With the igraph ID of our similar user, we can look up the igraph IDs of the games
    this user has played with g.neighbors(), and access the corresponding Steam IDs
    of these games by looking up the internal_id node attributes using g.vs. We can
    do the same for our originally specified user so that we have two lists of games
    that similar users have played. Finally, let''s use one last list comprehension
    to find all the games in our game_recommendations list that are not present in
    the original user''s owned_games list, and return this list as new_games:


    ```

    game_recommendations = g.vs[g.neighbors(most_similar_node)][''internal_id'']

    owned_games = g.vs[g.neighbors(user_node)][''internal_id'']

    ```'
