    # Path-based analytics in igraph


    Graph data models are specialized for path-based analysis. Unlike in MySQL, which
    we covered earlier in this chapter, we do not need to make a series of queries
    to a database or perform a series of self-joins to find paths of related objects
    when using a graph. To demonstrate this, let’s use the graph we have created,
    with our new schema, to again find games our specific user may enjoy.


    Last time, we only used data from the steam_purchase table, but this time, our
