- pgno: 107
  md: '# Working with Graph Databases


    This chapter introduces you to in-memory graph databases. We will show you the
    steps of how to work with a very popular graph database, Neo4j. We will take you
    through the process of how to download this software to use on your own machine
    and explain why Python can become slow when trying to deploy your graph databases
    and models at scale. Following the setup phases, we will explore how to create
    relationships in this *in-memory* graph database application and then how to query
    them with a popular query language, Cypher.


    Then, we will look at the various ways you can store information in Neo4j and
    use Python to interact with the application. We will take a slight detour to look
    at alternatives to Neo4j, such as Memgraph, and how they can be used. But the
    focus of this chapter will mainly be on Neo4j, as it does not require you to configure
    your machine to work with Docker and microservices.


    Finally, we will look at a use case of how Python and Neo4j can be utilized together,
    in harmony, for large-scale and large data analytics, in a rapid and repeatable
    fashion. This will culminate in using our newly acquired Neo4j and Python skills
    to tackle a real-life use case. The use case for this task will be using graph
    networks to map out optimal travel routes between cities, and we will replicate
    functionality used in most common mapping software, such as Google Maps.


    The following are the topics we are going to cover in this chapter:


    +   - Using graph databases

    +   - Storing a graph in Neo4j

    +   - Optimizing travel with Python and Cypher

    +   - Moving to ingestion pipelines'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Technical requirements


    We will be using Jupyter Notebook to run our coding exercises, which requires
    `python>=3.8.0`, along with the following packages, which will need to be installed
    with the `pip install` command into your environment:


    +   - `igraph==0.9.8`

    +   - `geopy==2.3.0`

    +   - `neo4j==5.5.0`


    For this chapter, you will need to start by going through the following steps:


    +   1. Install Neo4j Desktop, which is free. Primarily, we will be using Neo4j
    for its long-term graph database storage, though Neo4j Desktop installs a desktop
    graph browser alongside this. To install Neo4j Desktop, go to `https://neo4j.com/download-center/#desktop`
    and fill out some details. Make a note of the activation key as you will need
    this during installation and select the relevant operating system installation
    for your machine.

    +   2. Once Neo4j is installed, open Neo4j Desktop and create a new database (this
    can be achieved by navigating to the database tabs in the application and using
    the **Add** dropdown to create a new local DBMS) with a unique name, for example,
    `Python DB`. For the purposes of this chapter, use a password for this database
    that you are comfortable with writing in open code – we will be using `testpython`.
    In a real Neo4j setup, you would likely want to mask this password through the
    use of encryption, but that is beyond the scope of this chapter.


    These steps will be covered in greater detail in the next section, so hold your
    horses for now.


    All notebooks, with the coding exercises, are available at the following GitHub
    link: `https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH05`.


    # Using graph databases


    In all the previous chapters, we have been creating graphs in memory as part of
    Python scripts. This is fine for analytical work, or when creating proof-of-concept
    applications, but for workflows that need to scale, or for long-term storage,
    Python and `igraph` will not be enough.


    In production systems that involve graphs, a graph database acts as a persistent
    data storage solution. As well as holding large amounts of data, graph databases
    are typically designed to perform a large number of read and write operations
    efficiently and concurrently. They are likely to be part of any production pipeline
    that relies on huge amounts of graph data processing, such as in a recommender
    system for a large online retailer.


    As well as holding data, graph databases allow basic queries to be carried out
    on the data they hold. Many of these databases can be queried with at least one
    of several common graph query languages,'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'such as **Cypher**, **GraphQL**, or **Gremlin**. In this chapter, we will be
    using some basic Cypher to read and write data to a graph database. Neo4j has
    an extensive list of Cypher queries and their uses; see https://neo4j.com/developer/cypher/.


    It is worth noting that while these query languages are powerful in terms of accessing
    and writing data, they do not currently offer the breadth of analyses and algorithms
    that a package such as *igraph* offers. In this chapter, we will be interfacing
    Python with a graph database, to demonstrate how *igraph* might be used in a complex
    analysis pipeline.


    # Neo4j as a graph database


    The graph database we will be using here is Neo4j, a commonly used high-performance
    database with a free local version. Neo4j can be queried using Cypher, which,
    of the graph query languages, is arguably the easiest for new users and so perfect
    for this introduction. For a more in-depth understanding of the usage of Cypher,
    see the documentation: https://neo4j.com/developer/cypher/.


    Neo4j has analogous concepts to all of the graph concepts we have come across
    in previous chapters. In the Cypher documentation, while nodes are still named
    nodes, edges are more often referred to as relationships, and node and edge attributes
    are known as properties.


    We have encountered several graphs with multiple types of nodes in heterogeneous
    graphs, and in Neo4j, these types of nodes have distinct *labels*. Labels are
    used heavily in the Cypher query language to access particular nodes and patterns;
    we will return to this concept when reading and writing to the graph database.


    To get up and running with working with Neo4j, we need to carry out the following
    steps:


    +   1. Neo4j can be installed using the instructions in the *Technical requirements*
    section of this chapter. This is shown in the following screenshot:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_109_0.png)


    Figure 5.1 – Neo4j database setup'
  merge: -1
  img_proc: true
