    \ freq in term_freq.items():\n    edgelist.append([int(term_ids[term]),\n    \
    \                 int(abstract_id), freq])\n\nprint(edgelist[:10])\n```\n```\n\
    \n+   4. Let’s also confirm that an edge we know should be present exists in the\
