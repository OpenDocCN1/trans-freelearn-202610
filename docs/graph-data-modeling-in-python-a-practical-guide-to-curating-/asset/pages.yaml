    \ Due to this, we can add the node types listwise, by creating two lists of strings\
    \ using two list comprehensions, before adding these strings to the type node\
    \ attribute in g.vs:\n\n```\ntypes = ['abstract' for _ in data] +\n    ['term'\
    \ for _ in term_ids.items()]\ng.vs['type'] = types\n```\n\n9. Again, let’s make\
