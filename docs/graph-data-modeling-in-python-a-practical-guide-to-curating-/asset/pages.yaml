- pgno: 11
  md: '# # Preface


    Organizations across the globe are starting to use graph approaches and visualization
    techniques to make sense of complex networks. These networks are present in many
    industries, ranging from social network analysis (analyzing the connections of
    people interacting on social networks) to fraud detection (looking at transactions
    in a network to spot outliers), modeling the stability of systems such as rail
    and energy grids, and as critical components of recommendation engines that are
    used in many of your favorite online streaming services, for example, Netflix,
    Prime, and so on.


    This book provides you with the tools to get up and running with these methods
    while working with a familiar language, such as Python. We start by looking at
    how you can create graphs in igraph NetworkX and how these can be used to carry
    out sophisticated graph analytics. We will then delve into the world of Neo4j
    and graph databases, as well as equipping you with the knowledge to query graph
    databases with the Cypher query language.


    # ## Who this book is for


    The primary aim of this book is to assist existing Python developers of an intermediate
    level who may have the ambition of getting into graph data modeling. Or, if you
    are a database developer or IT professional, then the graph database section may
    give you insights into how graph databases are different from traditional databases.


    In essence, this book is targeted at anyone who loves coding in Python and wants
    to learn more about how to build graph data pipelines, how to ingest and clean
    data, various ways to store graph data relationships, how to conduct analytical
    techniques such as community detection and recommendation engine creation, and
    how to use Cypher to store these relationships and then query the *in-memory*
    graph with Cypher.


    # ## What this book covers


    *Chapter 1, Introducing Graphs in the Real World*, takes you through why you should
    consider graphs. What are the fundamental attributes of graph data structures,
    such as nodes and edges? It also covers how graphs are used in various industries
    and provides a gentle introduction to igraph and NetworkX.


    *Chapter 2, Working with Graph Data Models*, deals with how to work with graphs.
    From there, you will implement a model in Python to recommend the most popular
    television show.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Chapter 3, Data Model Transformation – Relational to Graph Databases, gets
    hands-on with MySQL, considers how data gets ingested into MySQL from your graph
    databases, and then looks at building a recommendation engine to recommend similar
    games to a user, based on their gaming history on the popular platform Steam.


    Chapter 4, Building a Knowledge Graph, puts your skills to work on building a
    knowledge graph to analyze medical abstracts, clean the data, and then proceed
    to perform graph analysis and community detection on the knowledge graph.


    Chapter 5, Working with Graph Databases, looks into working with Neo4j and storing
    data in a graph database using Cypher commands. Python will then be used to interact
    with our graph database by connecting Neo4j to Python.


    Chapter 6, Pipeline Development, includes all you need to know to design a schema
    and allow it to work with your graph pipeline to finally make product recommendations
    across Neo4j, igraph, and Python.


    Chapter 7, Refactoring and Evolving Schemas, deals with why you would need to
    refactor, how to evolve effectively, and how to apply these changes to your development
    life cycle.


    Chapter 8, Perfect Projections, deals with understanding, creating, analyzing,
    and using projections in Neo4j and igraph.


    Chapter 9, Common Errors and Debugging, explains how to debug graph issues and
    how to deal with some of the most common issues in Neo4j and igraph.


    # To get the most out of this book


    You will need to create a virtual environment for these tutorials for Python 3.8,
    as all code has been tested on Python 3.8, however, they should work on future
    versions of Python. Furthermore, when working with Neo4j, refer to Chapter 5,
    Working with Graph Databases, as it has comprehensive installation instructions.


    | Software/hardware covered in the book | Operating system requirements |

    |---|---|

    | Python 3.7/3.8/3.9 | Windows, macOS, or Linux |

    | Neo4j Community Edition v1.5.7 | Windows, macOS, or Linux |

    | MySQL 5.7.39 | Windows, macOS, or Linux |


    Each repository for each chapter has a `requirements.txt` file that you will need
    to `pip install` in your working Python environment.


    If you are using the digital version of this book, we advise you to type the code
    yourself or access the code from the book''s GitHub repository (a link is available
    in the next section). Doing so will help you avoid any potential errors related
    to the copying and pasting of code.'
  merge: -1
