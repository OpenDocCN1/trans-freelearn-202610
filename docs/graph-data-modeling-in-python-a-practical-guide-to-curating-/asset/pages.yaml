    ```

    query = ''CREATE (:Person {name: "Jeremy"})-[:FOLLOWS]->(:Person {name:"Mark"})''

    result = session.run(query)

    driver.close()

    ```


    These lines of code won’t return anything, since we have performed a write operation
    on the Neo4j database. However, we can confirm that it was successful by either
