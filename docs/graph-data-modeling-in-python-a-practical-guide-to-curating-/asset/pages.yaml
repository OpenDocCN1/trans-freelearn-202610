- pgno: 97
  md: '# Identifying abstracts of interest


    With our knowledge graph assembled, we can now use it to interrogate the information
    contained in our abstracts. Knowledge graphs provide several advantages over a
    more classical, searchable database. In an abstract database, we could search
    for a particular term and find all abstracts associated with it. However, from
    there, if we want to find themes in those abstracts or associated concepts, it
    would be down to the user to do this analysis manually. This often also relies
    on the database user being an expert in the subject area covered by the documents
    in the database, in order to find the commonalities and insights from the raw
    text.


    In our knowledge graph, we have extracted scientific terms, using a corpus of
    known biomedical language. We have done this in an unbiased way, without needing
    expertise in the specific field. Our terms now connect abstracts that share their
    use, and it is likely that those abstracts in turn contain other common terms
    or related concepts.


    The following steps will show how we can set up our Python logic for the identification
    of the abstracts that we are interested in:


    1. Let’s examine a concept in our knowledge graph, by starting with a chosen term.
    If we wanted to find all abstracts that use one term, we could use the vs.select()
    method. For example, let’s find all biomedical abstracts in our knowledge graph
    containing the term yoga, by making use of select()’s text_eq parameter. The vs.select()
    method always returns a list of nodes, though we know that there should only be
    one yoga term node, so we can select the first and only element using a list index.
    Then, we want the igraph node ID to use in further analysis, so we can use the
    .index attribute to access this:


    ```

    yoga_node_id = g.vs.select(text_eq=''yoga'')[0].index

    ```


    2. Once we have the node ID for the term yoga, to find the associated abstracts,
    we can identify its neighbors. In igraph, we can do this by using the neighbours()
    method and adding our yoga node’s ID as a parameter:


    ```

    yoga_abstract_nodes = g.neighbors(g.vs[yoga_node_id])

    ```


    3. This returns a list of neighboring node IDs, which, due to our bipartite graph
    structure, will all be abstract nodes. With our list of neighbor IDs, let’s find
    the abstract text associated with each node using a list comprehension to access
    the text node attributes, making use of g.vs:


    ```

    yoga_abstracts = [g.vs[neighbor][''text''] for neighbor in yoga_abstract_nodes]

    print(yoga_abstracts)

    ```


    4. Printing these results shows that there are six abstracts associated with the
    term yoga. Now, if this was the result from, for example, a search engine, we
    would need to read each abstract and understand the concepts within them in order
    to find biomedical themes associated with yoga.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'However, because our technical terms have been extracted and converted into
    a knowledge graph, we can use the graph to locate terms that are associated with
    these abstracts.


    To do this, we need to use the neighbors() method again, this time using the node
    IDs of the abstracts containing the term yoga, contained in the previously assigned
    yoga_abstract_nodes variable. We want to find neighbors for a list of nodes, which
    we can perform in a list comprehension:


    ```

    related_term_nodes = [g.neighbors(node) for node in yoga_abstract_nodes]

    ```


    5. This will return a list of lists, containing the node IDs of each abstract
    node’s neighbors. To get a list of all unique terms, we will need to first flatten
    our list of lists. As we have done previously, we can use itertools.chain.from_iterable()
    to achieve this, first importing the inbuilt itertools Python library and calling
    the method on related_term_nodes:


    ```

    import itertools

    related_term_nodes = itertools.chain.from_iterable(related_term_nodes)

    ```


    6. Then, we need to find the text node attribute associated with each of the term
    nodes in our flattened list. We can use g.vs to find the text attributes, contained
    within a set() to remove duplicates:


    ```

    related_terms = set(g.vs(related_term_nodes)[''text''])

    print(related_terms)

    print(len(related_terms))

    ```


    This completes the steps to find the related terms for our specific term to look
    up. Printing related_terms shows us all biomedical terms that were extracted from
    the abstracts containing the term yoga. From this, we can find terms and concepts
    related to research on yoga, such as mental health, visceral fat, and chronic
    stroke. In total, there are 168 unique terms that were associated with these 6
    abstracts.


    In our graph, all of our edges are explicitly representing terms found in abstracts.
    In some more advanced knowledge graphs, you may find that relationships reflect
    the context between words, phrases, or concepts that nodes represent. For example,
    rather than yoga linked to an abstract that also contains mental health through
    FOUND_IN relationships, the term yoga might be connected to mental health via
    a contextual link, such as USED_TO_TREAT. Creating contextual links requires mining
    text for context, and it can be notoriously difficult to infer context. Sometimes,
    this may not be present in the data and it certainly goes beyond the scope of
    this chapter.


    However, with more complex NLP approaches to generate nodes and edges for graph
    construction, more advanced and nuanced knowledge graphs can be created.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Identifying fields with community detection


    In the previous section, we used our biomedical knowledge graph to identify abstracts
    containing a specific term, and through these abstracts found terms related to
    our original term of interest. This can be thought of as establishing a related
    set of information, or perhaps a concept, or field.


    We can access these groups of nodes from a starting point if we know the term
    of interest. But what if we wanted a more general method to examine the fields
    that might be contained in our abstracts? We might ask the question are some of
    our abstracts related to specific scientific research areas?


    Without a starting point, we could look to the structure of the graph to answer
    questions like these. Where abstracts and terms are related, there should generally
    be more edges between them. For example, if a group of scientific articles is
    written by scientists that study the brain, you would not necessarily expect them
    to contain much of the same language as articles containing research on the function
    of the liver. We can use these assumptions to attempt to split the graph into
    strongly connected parts, with a common language, with a group of methods known
    as community detection.


    Community detection algorithms typically find regions of a graph that are highly
    interconnected, compared to other neighboring regions. These methods split a connected
    graph into parts, known as communities.


    For the purposes of this section, we will be using the multilevel method for community
    detection. Multilevel community detection, also known as the Louvain method, splits
    a graph into communities by gradually assigning each node to neighboring communities
    and calculating the modularity of communities in the graph. Modularity can be
    thought of as the interconnectedness (the state of being connected) of groups
    of nodes. The algorithm aims to vary the community nodes belonging to different
    communities until modularity is as high as possible or a minimum threshold for
    the amount of modularity change is reached. The end result is a graph split into
    distinct communities.


    It is worth noting that in contrast to connected components of a graph, which
    we examined in the previous section, communities can be connected through edges.
    The difference is that while communities can still be linked to each other, they
    are likely to be less strongly linked than the nodes residing in a community.


    The multilevel community detection algorithm is just one method for splitting
    a graph into communities to find high-level structural information and doesn''t
    require setting too many parameters, while being fairly easy to understand. Some
    methods are highly effective and more complex but scale poorly to large graphs
    (e.g., walktrap, which uses random walks as the driver for going up and down the
    connected paths). Other methods run extremely quickly, even on millions of nodes,
    but often provide less useful results (e.g., label propagation). Others still
    provide consistent, identical results for each run on the same graph, while many
    community detection methods, including the multilevel method, can generate different
    results each time they are run, due to the random initialization and iteration
    of their algorithms. Different methods are suitable for different graph structures,
    and a discerning graph specialist will use and compare several before settling
    on one method for a particular use case. Many options are available in igraph.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'The following diagram shows terms and abstracts that have different communities,
    that is, bodies of research that relate to a specific subject. These could be
    medical abstracts about certain conditions, such as cardiovascular and oncological
    conditions, for example:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_100_0.png)


    Figure 4.5 – Example of two distinct concepts, split into communities


    As we have done in previous examples, we will now highlight the steps to run the
    multilevel community detection algorithm on our knowledge graph:


    +   1. Let’s try to run multilevel community detection on our knowledge graph
    to find some areas of related abstracts and terms. First, we will need to convert
    our directed graph into an undirected representation of the same graph. This is
    because in igraph, the multilevel algorithm is not configured to run over directed
    edges. Because our graph only contains one type of edge, and these edges always
    run from terms to abstracts, we do not lose any information in this conversion.
    In igraph, the easiest way to convert a graph into an undirected format is using
    the as_undirected() method:


    ```

    g_u = g.as_undirected()

    ```


    +   2. Our new graph, g_u, now contains the undirected version of our knowledge
    graph. We are now ready to perform community detection, so let’s use igraph’s
    community_multilevel() method to run the algorithm over our graph. There are some
    optional parameters for community_multilevel(), but for now, we can run the method
    without these:


    ```

    community_membership = g_u.community_multilevel()

    print(len(community_membership))

    ```


    The community_membership variable contains a list of igraph-specific VertexClustering
    objects, which each contain a community label and the nodes that belong to that
    community.'
