  md: '+   4. Again, as before, we need to add a new user with administrator privileges,
    in order to run Cypher on the Neo4j database from Python. In the Neo4j Browser
    console, run the following:


    ```

    :server user add

    ```


    +   5. This will open a window where you can enter a username and password for
    the new user. Here, we will use the username admin and the password testpython.
    In the drop-down Roles list, choose both admin and PUBLIC. Finally, click Add
    User.


    With our database set up, we’re ready to add the first iteration of the Twitter
    schema.


    # Adding constraints


    In a graph database, where data accuracy is absolutely critical, we may want to
    consider additional ways of making sure data conforms strictly to our schema.
    We have previously explored using MERGE statements, instead of CREATE, to ensure
    that duplicate nodes are not added to our database when sending write queries.
    However, using constraints adds a separate layer of control over our graph data.


    Constraints can be set up in a Neo4j database to ensure that nodes, edges, and
    their properties conform to stringent rules. We previously explored using MERGE
    statements, instead of CREATE, to ensure that duplicate nodes are not added to
    our database when sending write queries. However, using constraints adds an additional
    layer of control over our graph data when preventing duplicates. There are many
    types of constraints that are possible in Neo4j; see https://neo4j.com/docs/cypher-manual/current/constraints/
    for more implementations.


    In our Twitter schema, we have identified some node properties that should be
    unique across all nodes of a particular type. Let’s add a uniqueness constraint
    to our User nodes, which should each have a unique userID property. To do this,
    we need to write some Cypher. The steps to create our constraint are as follows:


    +   1. We can add a constraint using the CREATE CONSTRAINT function and give it
    a name, unique_user. We then set the type of node that the constraint applies
    to using FOR, followed by a node and a chosen alias – here, u. We then specify
    what type of constraint applies to this node, using REQUIRE, and assert u.userID
    IS UNIQUE:


    ```

    CREATE CONSTRAINT unique_user

    FOR (u:User)

    REQUIRE u.userID IS UNIQUE

    ```


    These lines can be run in the Neo4j Browser of our database to set up the constraint.
    When run, the browser should confirm that one constraint has been added. This
    is shown in Figure 7.6:'
  merge: -1
  img_proc: true
- pgno: 165
  md: '![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_165_0.png)


    Figure 7.6 – Neo4j Browser constraint


    2. Let’s test to see what happens now when we attempt to violate the constraint’s
    rule, in the Neo4j Browser window. First, we can create a node with userID set
    to 100:


    ```

    CREATE (u:User {userID: ''100''})

    ```


    Then, try to run this same query again. If the constraint is set up properly,
    the browser window should return something such as “Node(2) already exists with
    label User and property userID = ''100''.” This constraint prevents writing a
    new node with an existing user ID by throwing an error.


    3. In contrast, let’s try to use MERGE to add the same node:


    ```

    MERGE (u:User {userID: ''100''})

    ```


    When run in the Neo4j Browser, we should see that there are no changes to the
    database. The MERGE statement has matched the existing node with ID ''100'' and
    has subsequently written no new data to the database.


    4. Before continuing, we should clear out the test data we added to the database
    in this section by running the following in the Neo4j Browser, as we have done
    in previous chapters:


    ```

    MATCH (n) DETACH DELETE n

    ```


    Constraints are a great way to absolutely ensure data conforms to schema requirements
    such as the uniqueness of properties. With our uniqueness constraint set up on
    users, and more tight control over our graph data model, let’s next look at adding
    some Twitter data to Neo4j.'
