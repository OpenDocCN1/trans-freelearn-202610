    against the Neo4j database, using a query language known as Cypher. For some of
    you, this will have been your first exposure to Cypher, and we took you through
    how this language is similar to other query languages, such as SQL. To get a better
    understanding of how to use Cypher, a good resource is the Neo4j website (https://neo4j.com/developer/cypher/).


    Upping the ante, we then started to look at how you store data in your Neo4j graph
    database, using a combination of Cypher and Python''s cypher package, to start
    interacting with your graph database.


    This culminated in exploring a use case of recommending the best route to travel
    on and analyzing optimal paths between two points. Here, we introduced Dijkstra''s
    algorithm (https://isaaccomputerscience.org/concepts/dsa_search_dijkstra?examBoard=all&stage=all)
