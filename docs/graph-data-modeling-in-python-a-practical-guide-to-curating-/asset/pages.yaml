- pgno: 137
  md: "To get started, let’s populate our graph database with product information:\n\
    \n+   1. Neo4j can easily access data in a given database’s import folder, so\
    \ let’s first move `products.csv` (this will be stored in the supporting GitHub\
    \ repositories data folder at `https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH06/data`)\
    \ to that location. From the main Neo4j Desktop window, click the three dots …\
    \ next to **Store DB**, or whatever name you have used for this chapter’s database.\n\
    +   \n+   2. From the pop-up list, choose **Open folder**, then click on **Import**.\
    \ This will open the database’s import folder in the file browser of your operating\
    \ system. Copy and paste, or drag `products.csv` into this folder to give Neo4j\
    \ access to it in Cypher queries.\n+   \n+   3. With our data in the correct location,\
    \ we can start to think about how to turn this tabular CSV into nodes and edges,\
    \ according to the graph schema we have specified. For the initial transfer of\
    \ data, we can use the Neo4j Browser and the command line, by opening up the Browser\
    \ window for our **Store DB** database.\n+   \n+   4. Next, let’s write some Cypher\
    \ to load this data. As we did in *Chapter 5, Working with Graph Databases*, we\
    \ can use the `LOAD CSV WITH HEADERS` function to read our data into Neo4j. We\
    \ specify the filename and location in the `/import` folder by using `FROM 'file:///products.csv'`,\
    \ and read one line at a time with `AS row`.\n+   \n+   5. From there, we start\
    \ to add nodes to our graph with `MERGE`. We add nodes with the Product, Brand,\
    \ and Type types, and add their node attributes using the `row.column` syntax.\
    \ We use the aliases `p`, `b`, `m`, and `s` for each type of node added or matched\
    \ with `MERGE` in order to easily add edges next. We can use even more `MERGE`\
    \ functions to now add the `HAS_BRAND` and `HAS_TYPE` and relationships, including\
    \ the relationships between the main types and sub-types:\n\n```\n```cypher\n\
    LOAD CSV WITH HEADERS FROM 'file:///products.csv' AS row\nMERGE (p:Product {productID:\
    \ toInteger(row.productID), name: row.name})\nMERGE (b:Brand {brandName: row.brand})\n\
    MERGE (m:Type {typeName: row.mainType})\nMERGE (s:Type {typeName: row.subType})\n\
    MERGE (p)-[:HAS_BRAND]->(b)\nMERGE (p)-[:HAS_TYPE]->(s)\nMERGE (s)-[:HAS_TYPE]->(m)\n\
    ```\n```\n\n> **Important note**\n> \n> It is important to remember that using\
    \ `MERGE`, rather than `CREATE` here, ensures that duplicate nodes are not created\
    \ for each row. Using `CREATE` could potentially be manageable for Product nodes,\
    \ of which one per CSV row is added, but for Brands and Types, the `CREATE` function\
    \ would add Brand and Type nodes with identical names to the graph, as well as\
    \ creating extraneous edges."
  merge: -1
  img_proc: true
- pgno: 138
  md: '+   6. Before moving on to the next stage, we should confirm that product data
    has been correctly added to our graph using some simple Cypher queries, executed
    in the Neo4j Browser. Looking at our data in `products.csv`, we can use the first
    row to validate our graph data. We can first write Cypher to confirm that the
    product with ID 1001 has the correct node attributes, and run this in the Neo4j
    Browser:


    ```

    MATCH (n:Product {productID:1001})

    RETURN n.productID, n.name

    ```


    This should show us that this node has the name `WX100 In-ear Headphones`.


    +   7. Let’s now confirm that relationships were added correctly. We can find
    the brand of these headphones using another MATCH function, and RETURN the connected
    Brand nodes:


    ```

    MATCH (n:Product {productID:1001})-[:HAS_BRAND]->(m)

    RETURN m.brandName

    ```


    This will show that these headphones are of the Hans brand.


    +   8. Finally, let’s make sure product types and connected sub-types are as expected.
    In this case, we need to traverse (travel across or through) several edges to
    find the subtype, and then the main type of the product with productID 1001. This
    can be done over two MATCH functions for clarity:


    ```

    MATCH (n:Product {productID:1001})-[:HAS_TYPE]->(subtype:Type)

    MATCH (subtype)-[:HAS_TYPE]->(maintype:Type)

    RETURN n.name, subtype.typeName, maintype.typeName

    ```


    We should see in the resulting table that the subtype of these headphones is **Bluetooth
    Headphones**, with a main type of **Audio**.


    These are all the steps needed to complete the process of getting your data into
    your Neo4j graph, by extensively using the Neo4j Browser to execute the Cypher
    queries.


    With our product data successfully assembled into a graph, we can now think about
    how customers might interact with products, and how to simulate and store this
    information in the Neo4j database. This will be the purpose of the upcoming section.


    # Simulating customer interactions


    Depending on its size, an online retailer could have thousands of customers browsing
    products on their web application or app. Each of these customers sends queries
    to a backend database when they search for a product, are recommended a product,
    or purchase something, among other actions. This way, a retailer can serve a customer
    with the information they need, as well as storing data on customer behavior.


    We will be focusing on the product recommendation system for our online electronics
    store, as this is often handled with a graph database. From our graph schema in
    *Figure 6.2*, we can see that we want to store data on customer purchases, where
    each customer has a unique ID, a name, and an address.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Of course, we don’t have real customers interacting with an application to
    store data on for this example, but we can mock up some fake customers and simulate
    the queries they would send to our database. In a real software development team,
    creating fake customers and customer interactions might be part of a testing framework
    for a new data pipeline.


    These types of query transactions are, in practice, often handled by a publish/subscribe
    messaging service (pub/sub) or similar, which in turn is often managed with a
    cloud computing service. These transactions typically take place between multiple
    machines, which has implications on machine setup, security, and permissions,
    which is an entire subject in itself, the field of DevOps. For our purposes, in
    this chapter, our fake customers will be generated in Python, and make purchase
    by sending queries from Python to Neo4j. This will all take place on a local machine,
    meaning we can focus on graph data modeling and network analysis.


    Let’s begin by creating a customer. In our schema, a customer has a productID,
    name, and address. Python has some nice tools for generating fake data, which
    we will lean on in this chapter by using the `Faker` library.


    Faker comes bundled with a variety of methods to simulate different types of data,
    from simple things such as telephone numbers to entire sets of fake personal information.
    For our purposes, we need to generate names and addresses to give to our customers.


    In the upcoming steps, we will generate fake data to use in our graph use cases
    going forward:


    +   1. To import Faker, we import the `Faker` class from the `faker` (lowercase)
    library. We then create an instance of Faker by assigning it to a variable, here
    named *fake*. We can optionally set the random seed of the Faker library, so that
    our randomly generated data is consistent between Python script runs:


    ```

    ```python

    from faker import Faker

    fake = Faker()

    Faker.seed(0)

    ```

    ```


    +   2. We can now use our instantiated *fake* object to generate names and addresses,
    by simply calling the `name()` and `address()` methods of the class:


    ```

    ```python

    name = fake.name()

    address = fake.address()

    print(name)

    print(address)

    ```

    ```


    Printing our results shows some realistic name and address data. You may notice
    from the address that this data is US-localized, which is the default setting.
    It is possible to change the locale of the Faker library if needed, for which
    you should consult the Faker documentation.


    +   3. Now that we can create fake data, let’s attach this data to a customer.
    A sensible way to do this is to create a `Customer` class, which holds a `customerID`,
    name, and address attribute for each person. We can use the `__init__()` method
    to assign attributes to each customer'
