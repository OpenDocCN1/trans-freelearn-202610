    Instead, here we might consider using a graph projection of the customer data
    in order to answer a particular question, especially if this is a question we
    might ask of a graph database regularly, for example, as part of a recommendation
    system.


    To answer questions on how brands relate to addresses of customers, we could collapse
    paths between these two node types into a single edge. In doing this, we lose
    information about the way addresses relate to brands through customers and products,
    but we hugely increase the efficiency of answering questions about how these node
    types relate by drastically reducing the number of hops required to traverse between
    these nodes. We can now easily compute the number of brands associated with an
    address, or perhaps locations of the world associated with purchasing particular
    brands of products.


