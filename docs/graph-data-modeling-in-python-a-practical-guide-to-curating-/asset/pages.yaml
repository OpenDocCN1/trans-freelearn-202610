- pgno: 203
  md: '# No nodes in the graph


    Some graph and network science libraries in Python can be created directly from
    a list of tuples, an edgelist. In *igraph*, because of how node indexing is implemented
    in C, nodes have to be added to a Graph object before edges can connect them together.
    In the next steps, we will demonstrate this problem and the subsequent errors
    that arise:


    +   1. We can first read in edge data from musae_git_edges.csv as our example
    graph to load into *igraph*, using the inbuilt csv module. This file has headers,
    so we are using a list slice at the end of the list comprehension, building a
    list from the reader object, to remove them:

    +   ```

    +   import csv

    +   with open(''./data/musae_git_edges.csv'', ''r'') as c:

    +       reader = csv.reader(c)

    +       edges = [row for row in reader][1:]

    +   ```


    +   2. At this point, in many libraries, you might create a graph directly from
    the edges list. But, if we try to do this, we will encounter an error:

    +   ```

    +   import igraph

    +   g = igraph.Graph()

    +   g.add_edges(edges)

    +   ```

    +   This produces the following error:

    +   ```

    +   ValueError: no such vertex: ''0''

    +   ```


    +   3. There are actually two things going on here. No vertex exists in the graph
    with the name 0 because we haven’t yet added any nodes. In addition, we are trying
    to pass strings into add_edges(), with which *igraph* is incompatible. We can
    fix this issue first by converting the values in our edgelist to integers with
    int(), and a list comprehension. Then, we can try to add the edges again:

    +   ```

    +   edges = [[int(edge[0]), int(edge[1])] for edge in edges]

    +   g.add_edges(edges)

    +   ```

    +   We will see that this still doesn’t work, and get a new error:

    +   ```

    +   igraph.igraph.InternalError: Error at src/graph/type_indexed_edgelist.c:261:
    Out-of-range vertex IDs when adding edges. -- Invalid vertex ID

    +   ```


    This is now the error we encounter when we have a node ID in our list of edges
    that doesn’t yet exist in the graph. In *igraph*, we must always add nodes to
    the graph before edges are added.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '4. As we have shown in previous chapters, we can find the number of unique
    nodes by using a double list comprehension to get all node IDs in both columns
    of our edgelist, contained in the edges variable, and taking a set of these. Then,
    we just calculate the length of this set:


    ```

    nodes = set([node for edge in edges for node in edge])

    print(len(nodes))

    ```


    We can confirm we are getting the correct number of nodes by comparing it against
    the README.txt file provided with the dataset. The number of nodes shown in the
    length of this set, and the README file, should be 37,700.


    Note that this edgelist is 0-indexed already and that there would be additional
    steps to take here to avoid errors if it was not. We would need to generate IDs
    for each node if this were the case, which we will cover in the next subsection.


    5. Now that we know how many nodes we should add, let’s add nodes to our Graph
    object before adding edges:


    ```

    g.add_vertices(len(nodes))

    g.add_edges(edges)

    ```


    6. We get no error this time, and edges are successfully added to the graph. Let’s
    check that the number of edges is as it should be, by again comparing it to the
    README file. We can print the length of the es attribute of our graph to find
    the number of edges:


    ```

    print(len(g.es))

    ```


    Our count of edges is as it should be, 289,003.


    # Node IDs in igraph


    Many, many times throughout this book, in our worked examples, we have loaded
    graphs into Python with igraph. Each time, we have had to make sure to create
    igraph IDs.


    In the igraph library, a graph must have 0-indexed nodes – no exceptions. This
    is one of the features that allows igraph to load in data and run graph algorithms
    so quickly, using its C implementation behind the scenes. When we have data that
    is not 0-indexed, we need to first transform it to ensure that it is, and keep
    a record of this transformation, for example, in a dictionary.


    Here’s a worked example of the steps to show the conversion of these 0-indexed
    identifiers, as mentioned in the aforementioned sentences:


    +   1. Firstly, we initialize a graph, as usual (we’ve already done this multiple
    times in the previous chapters):


    ```

    g = igraph.Graph()

    ```'
