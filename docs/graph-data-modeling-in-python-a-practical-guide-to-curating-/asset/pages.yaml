    ```\n\n10. With all of our nodes in place, we can now add our edges to the graph.\
    \ To do this, we need to first create a pairwise edge list without the edge weightings\
    \ and a separate list of edge weight attributes. We can accomplish both of these\
    \ tasks using list comprehensions:\n\n```\nedges = [[source, target] for source,\n\
