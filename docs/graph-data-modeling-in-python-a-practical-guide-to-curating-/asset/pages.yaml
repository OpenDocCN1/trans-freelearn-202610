    \ close the database connection. Let’s make sure things look as expected by printing\
    \ the first few pairs:\n\n```\nconnection = Neo4jConnect('bolt://localhost:7687',\
    \ 'admin', 'testpython')\nco_stars = get_co_stars_neo4j(connection)\nconnection.close()\n\
    print(co_stars[:5])\n```\n\n6. With a list of lists containing actor pairs, we\
    \ essentially now have an edgelist in Python, with which we can create a graph.\
    \ As we have covered in earlier chapters, we will also need a list of nodes and\
    \ lists of attributes to assemble it in igraph.\n\n7. We can get a list of unique\
    \ nodes by using a double list comprehension to get a list of all nodes in the\
    \ edgelist and taking a set of that list:\n\n```\nnodes = list(set([node for edge\
    \ in co_stars for node in edge]))\n```\n\n8. Also, we can assign ascending integer\
    \ igraph IDs to these nodes by creating a dictionary. Using a dictionary comprehension,\
    \ we can use enumerate() on our unique node list, creating mapped ascending IDs\
    \ for each node:\n\n```\nigraph_ids = {film:node_id for node_id, film in enumerate(nodes)}\n\
    ```\n\n9. In igraph, we will need to use these new IDs to add edges to the graph,\
    \ so we must substitute each node name for the unique igraph ID from igraph_ids.\
    \ We can again use a comprehension for this task, resulting in an edgelist of\
    \ paired integers corresponding to our films:\n\n```\nedgelist = [[igraph_ids[n],\
    \ igraph_ids[m]] for n, m in co_stars]\n```"
