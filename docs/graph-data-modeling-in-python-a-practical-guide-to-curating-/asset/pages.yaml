    \ US and Canada air travel graph schema\n\nWith our data in the correct format\
    \ for Neo4j import and our air travel schema finalized, we can move on to creating\
    \ the graph in the Neo4j database.\n\n# Moving nodes, edges, and properties to\
    \ Neo4j\n\nWe will be using Python to write to our Neo4j database. We will need\
    \ to first write some Cypher queries that we will later get Python to send to\
    \ Neo4j.\n\nAt this stage, we should also make sure that our Neo4j database is\
