- pgno: 121
  md: "2. Our results show us that the city with the highest population is New York.\
    \ Another simple task we could ask of our graph is what cities we can travel from\
    \ New York to in a relatively short travel time. For this, we can make use of\
    \ the WHERE function, which again has a similar effect to its SQL counterpart.\
    \ When used after a MATCH statement, we can filter the matched nodes by their\
    \ travel time property with a WHERE function, before returning the names of the\
    \ cities easily reachable from New York. As always, we then execute the query\
    \ against the Neo4j database using Python:\n\n```\ncypher = 'MATCH (n:City {name:\
    \ \"New York, NY\"}) ' \\\n    'MATCH (n) -[r:AIR_TRAVEL]->(m) ' \\\n    'WHERE\
    \ r.travel_time < 100 ' \\\n    'RETURN m.name'\n\nconnection = Neo4jConnect('bolt://localhost:7687',\
    \ 'admin', 'testpython')\nresult = connection.query(cypher).data()\nconnection.close()\n\
