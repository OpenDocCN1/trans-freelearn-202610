    # Efficiency and path lengths


    Not all graph algorithms are equal, with each allowing the calculation or estimation
    of different features of nodes, edges, or an entire network. Nor are they equal
    in complexity, where some can run in milliseconds, and some take hours to compute.


    When choosing a measure to learn something about the nodes in a graph, we need
    to take into account the computational complexity of the method used to measure
    a feature. This is often highly correlated with the size and connectivity of the
    graph.


    To illustrate this point, we can compare the degree centrality and betweenness
    centrality algorithms, which both seek to calculate the importance of nodes in
    a graph, but in different ways. Degree centrality is a simple measure, counting
    each node’s connected neighbors, and scales proportionally to the number of nodes
    in a graph.


    On the other hand, betweenness centrality traverses paths between all pairs of
    nodes in the graph, and so scales not only with the number of nodes, but the number
    of edges. In addition, due to its routine of finding short paths between nodes
    to estimate node importance, it is far more computationally demanding than calculating
    degree centrality.


    While degree centrality is good for finding important hub nodes with many incident
    edges, betweenness centrality can show us nodes that act as important thoroughfares
    for paths through a graph. These concepts are linked and often correlate, but
    are not identical. However, betweenness centrality will always take longer to
    compute on a graph than degree centrality, by several orders of magnitude. It
