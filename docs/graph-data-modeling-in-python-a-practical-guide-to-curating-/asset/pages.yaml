    Facebook pages share a mutual interest in each other, in our dataset.


    +   1. To look into this, we will be using the select() method again, this time
    for edges. The es.select() method can find edges according to their attributes
    (if they have any), using the same syntax as in Table 2.1. However, our edges
    contain no attributes, and we are more interested in the nodes they link.


    As with the vs.select() method, es.select() has some special parameters that can
    be used to find edges that link nodes with particular criteria—again, each starting
    with an underscore.


    The following table shows the various dunder methods, also known as magic methods,
    to use with the vs.select() command. These can be accessed to perform the functions
    listed in the Function column:


    | Edge select parameter prefix | Function |

    |---|---|

    | _incident | Finds edges that are incident on a specific node, or list of nodes,
    ignoring edge direction. |

    | _source (or _from) | In a directed graph, finds edges where a node or list of
    nodes are the edge sources. |

    | _target (or _to) | In a directed graph, finds edges where a node or list of
    nodes are the edge sources. |

    | _within | Finds edges where both nodes making up an edge are contained in a
    given list. |

    | _between | Finds edges where both nodes making up an edge are contained in separate
    lists (these two lists are provided as a tuple). |


    Table 2.2 – es.select() special parameters


    +   2. Now, because our mutual likes graph is undirected, let’s use the _incident
    parameter in es.select() to select the edges incident to the Today Show. es.select()
    works with node IDs, so we need to first find the node ID of our TV show of interest:


