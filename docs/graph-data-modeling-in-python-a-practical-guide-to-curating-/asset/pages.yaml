  md: "You will probably have noticed that this query runs extremely slowly, depending\
    \ on your machine’s specifications. But whatever the power of your process or\
    \ availability of memory, this Cypher is very poorly optimized for the data import\
    \ it is trying to perform.\n\nWhen writing this query in Neo4j, you may have noticed\
    \ that the query becomes underlined, and mousing over it displays a warning message.\
    \ The message warns us that the query uses the EAGER operator, which can consume\
    \ a lot of memory while the query runs. We will look in more detail at the EAGER\
    \ operator, and why it should be avoided, in a later subsection.\n\nOne option\
    \ for getting this query to run more effectively is to use a subquery to effectively\
    \ split up the query into several transactions of a smaller size. This reduces\
    \ the memory load on Neo4j, as it loads in only a set number of rows from the\
    \ CSV at a time as it writes nodes and edges.\n\nThis type of transaction behavior\
    \ query needs to begin with the :auto statement, followed by our LOAD CSV WITH\
    \ HEADERS function. Next, we enclose our logic for adding the GitHub nodes and\
    \ edges to the graph with CALL and curly braces to specify our subquery. The only\
    \ change is that we need to bring the row variable inside the subquery using WITH.\
    \ After the subquery is defined, we can tell Neo4j how many CSV rows to process\
    \ at a time using IN TRANSACTIONS OF 1000 ROWS. Run this Cypher script in the\
    \ Neo4j Browser, and compare the runtime to that of the previous query with no\
    \ transaction control:\n\n```\n:auto LOAD CSV WITH HEADERS FROM 'file:///musae_git_edges.csv'\
    \ AS row\nCALL {\n  WITH row\n  MERGE (d1:Developer {githubId:row.id_1})\n  MERGE\
    \ (d2:Developer {githubId:row.id_2})\n  CREATE (d1)-[:FOLLOWS]->(d2)\n} IN TRANSACTIONS\
    \ OF 1000 ROWS\n```\n\nYou should see that this query runs much faster than the\
    \ previous one because Neo4j no longer needs to hold on to the entire CSV data\
    \ in memory as the query runs. This frees up memory to actually handle the writing\
    \ of nodes and edges, therefore speeding the whole process up.\n\nThis is certainly\
    \ an improvement, but there are other things we can do to speed up the loading\
    \ of large datasets, for example, using indexing.\n\n# Indexing for query performance\n\
    \nWhile splitting our large write query into transactions certainly improved the\
    \ efficiency of our query, we can do more to speed it up, by creating an index.\n\
    \nIn Neo4j, like in other databases, we can create an index to improve search\
    \ performance. Indexes are created for specific node or edge attributes and essentially\
    \ result in a stored, ordered list of information on node or relationship properties.\
    \ The index is used when queries involve searching the attribute in question,\
    \ and the ordered nature of these property lists drastically improves query performance\
    \ at"
