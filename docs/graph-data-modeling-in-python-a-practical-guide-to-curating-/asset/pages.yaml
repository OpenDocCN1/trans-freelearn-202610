  md: "customer data to the graph database. To do this, we can create a method, `add_customer()`.\
    \ The method will take a `Customer` object, `c`, and an authenticated Neo4j connection,\
    \ made with our `Neo4jConnect` class. With these parameters, we can create a Cypher\
    \ query to add a customer, substituting node attributes for the attributes of\
    \ our customer, using `c.customerID`, `c.name`, and `c.address`. This is all handled\
    \ with Python’s f string functionality, wrapping around a simple MERGE function.\
    \ The additional curly braces used are to escape f string behavior in places,\
    \ as Cypher syntax for specifying node attributes uses the `{ }` characters too.\
    \ Looking at our graph schema, we also specify that the `customerID` attribute\
    \ of our new node should be an integer, using Cypher’s `toInteger()`. The assembled\
    \ query can then be called using `connection.query()`:\n\n```\n```python\ndef\
    \ add_customer(c, connection):\n    query = f'MERGE (:Customer {{customerID: toInteger({c.customerID}),\
    \ '\\\n        f'name: \"{c.name}\", '\\\n        f'address: \"{c.address}\"}})'\n\
    \    connection.query(query)\n```\n```\n\n+   8. Let’s give this new method a\
    \ try, by creating another example customer. Using our `Customer` class, we can\
    \ generate a new `Customer` object with the attributes we need. As with all Cypher\
    \ queries to Neo4j from Python, we then establish a connection with `Neo4jConnect`,\
    \ before calling our new `add_customer` method with our generated `Customer` and\
    \ our Neo4j connection, which handles writing a node to our graph database. Finally,\
    \ we close the session with `connection.close()`:\n\n```\n```python\ntest_customer\
    \ = Customer(9999)\nconnection = Neo4jConnect('bolt://localhost:7687',\n    'admin',\
    \ 'testpython')\nadd_customer(test_customer, connection)\nconnection.close()\n\
    ```\n```\n\n+   9. Back in the Neo4j Browser, we can check whether the node was\
    \ added correctly in a number of ways, but for something more visual, let’s open\
    \ up Neo4j Desktop for the Store DB database that we have written to. Using some\
