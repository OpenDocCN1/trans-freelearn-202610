- pgno: 114
  md: "5. Alternatively, we can write read queries in Python to confirm that our write\
    \ operation ran as intended. To establish a session, we will use the same code\
    \ framework as for the previous write query:\n\n```\ndriver = GraphDatabase.driver(uri='bolt://localhost:7687',\n\
    \                            auth=('admin', 'testpython'))\n\nsession = driver.session()\n\
    ```\n\n6. Now, instead of writing to the graph database, let's define two read\
    \ queries. One query will match all Person nodes in the graph, while the other\
    \ will match all FOLLOWS edges:\n\n```\nnode_query = 'MATCH (n:Person) RETURN\
    \ n'\nedge_query = 'MATCH () -[e:FOLLOWS]->() RETURN e'\n```\n\n7. Now, we can\
    \ run both queries, before closing the connection. Accessing the data() method\
    \ of run() transforms the results into a more consumable format that can more\
    \ easily be handled in Python:\n\n```\nnode_result = session.run(node_query).data()\n\
    edge_result = session.run(edge_query).data()\ndriver.close()\nprint(node_result)\n\
    print(edge_result)\n```\n\nPrinting our results shows that we have two results\
    \ for n, which each contains one of our added Person nodes. We also see that we\
    \ found one FOLLOWS edge, confirming that our write process ran as intended.\n\
    \nAt this point, you may notice that to interface Python with Neo4j, we will be\
    \ running these types of queries regularly. For this reason, we will create a\
    \ reusable Python class to handle connections and queries to the database, removing\
    \ the need to manually connect to the database every time we run a query.\n\n\
    8. Let's define a Python class named Neo4jConnect. The class will have a __init__\
    \ method, which will be called automatically when Neo4jConnect is instantiated.\
    \ Because we will always want to connect to the database when we call Neo4jConnect,\
    \ we can handle the driver connection here, using uri, user, and password parameters\
    \ supplied to the class. We will also define a close() method in the class, to\
    \ close the connection. A query() method will complete the class, which will take\
    \ a Cypher query and execute it using the established connection, before returning\
    \ the result:\n\n```\nclass Neo4jConnect:\n    def __init__(self, uri, user, password):\n\
    \        self.driver = GraphDatabase.driver(uri, auth=(user,\npassword))\n   \
    \ def close(self):\n        self.driver.close()\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: "```\ndef query(self, query):\n    session = self.driver.session()\n    result\
    \ = session.run(query)\n    return result\n```\n\n9. Let’s ensure that our class\
    \ is functioning as intended by rerunning the read queries we executed previously.\
    \ Now, we can create a connection object of the Neo4jConnection class, which handles\
    \ authentication and the driver. Queries can now be run by accessing the query()\
    \ method of the connection object, and the connection can be closed with the close()\
    \ method:\n\n```\nconnection = Neo4jConnect('bolt://localhost:7687', 'admin',\
    \ 'testpython')\n\nnode_cypher = 'MATCH (n:Person) RETURN n'\nedge_cypher = 'MATCH\
    \ ()-[e:FOLLOWS]->() RETURN e'\n\nnode_result = connection.query(node_cypher).data()\n\
    edge_result = connection.query(edge_cypher).data()\n\nconnection.close()\nprint(node_result)\n\
    print(edge_result)\n```\n\nPrinting node_result and edge_result displays the same\
    \ results as we obtained previously, showing that our class is implemented correctly.\
    \ For the remainder of this chapter, we will continue to use the Neo4jConnect\
    \ class to read and write to Neo4j.\n\nNext, we will look at a practical use case\
    \ for a graph database, and use Python and Cypher to query the database and perform\
    \ complex analyses.\n\n# Storing a graph in Neo4j\n\nWith our graph database set\
    \ up, and our methods for interacting with Neo4j written, we can start to use\
    \ Python and Neo4j to store and explore our graph data.\n\nIn this section, we\
    \ will be looking at an air travel network between the US and Canada and analyzing\
    \ its properties to find efficient routes between locations.\n\n# Preprocessing\
    \ data\n\nTo begin, let’s take a look at our data (sourced from Stanford University:\
    \ https://snap.stanford.edu/data/reachability.html). We have two files, reachability_250.txt\
    \ and reachability-meta.csv."
