  md: 'In terms of graphs in industry, they are pervasive due to the reasons we have
    already explored in this chapter. The ability to quickly link nodes and edges,
    and create relationships between them, is the reason why more problems in data
    science are being modeled as graphs or network science problems. In addition,
    the underlying data can be queried at a rapid rate. This can be done instead of
    using traditional database solutions, which, as we have already identified, are
    slow to query compared to GDBs.


    Following this, in the next section, we will introduce the main two driving packages
    for graph analytics and modeling. We will show you the basic usage of the packages.
    In the subsequent chapters, we will keep building on why these packages are powerful.


    # Introduction to NetworkX and igraph


    In this chapter, we will introduce two Python packages for creating in-memory
    graphs: NetworkX and igraph.


    NetworkX lets you create graphs, perform graph manipulation, study and visualize
    their structures, and perform several graph manipulation functions when working
    with graphs. Their website (https://networkx.org/) contains details of the major
    changes to the package and the intended usage of the tool.


    igraph contains a suite of useful and practical analysis tools, with the aim being
    to make these efficient and easy to use, in a reproducible way. What is great
    about igraph is that it is open source and free, plus it supports networks to
    be built in R, Python, Mathematica, and C/C++. This is our recommended package
    for creating large networks that can load much more quickly than NetworkX. To
    read more about igraph, go to https://igraph.org/.


    In the following subsections, we will look at the basics of both NetworkX and
    igraph, with easy-to-follow coding steps. This is the first time you are going
    to get your hands dirty with graph data modeling.


    # NetworkX basics


    NetworkX is one of the originally available graph libraries for Python and is
    particularly focused on being user-friendly and Pythonic in its style. It also
    natively includes methods for calculating some classic network analysis measures:


    +   1. To import NetworkX into Python, use the following command:


    ```

    import networkx as nx

    ```


    +   2. And to create an empty graph, g, use the following command:


    ```

    g = nx.Graph()

    ```'
