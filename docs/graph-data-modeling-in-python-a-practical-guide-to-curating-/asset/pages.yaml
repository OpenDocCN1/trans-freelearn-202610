- pgno: 196
  md: '# Exploring connected components


    Another feature of our graph worth exploring is the number of connected components.
    As discussed before in previous chapters, running the weakly connected components
    algorithm reveals whether our graph is wholly connected or it is split into disconnected
    parts, as is often the case in real-world graph data. In our original knowledge
    graph, before taking a projection, finding connected components of co-starring
    actors would have been challenging. Using the weakly connected components algorithm
    in the knowledge graph doesn’t give us any information on actor relationships,
    but rather a very rough measure of whether there are components of information
    in our graph that don’t overlap with other film knowledge we store. This would
    be a very coarse-grained measure – the existence of the country nodes and relationships
    would likely make our knowledge graph appear much more strongly connected than
    you might expect.


    The following steps take you through how to explore the connected components in
    your constructed graph:


    +   1. With a projection, we can much more reliably ask a specific question about
    connectivity among co-starring actors in particular – in our data, are there groups
    of actors in films that are entirely disconnected from other groups of co-stars?
    To answer this question, let’s run the weakly connected components algorithm across
    our graph in Python, using igraph’s components() method. Specifying the mode=''weak''
    parameter here ensures that we still consider an edge as a connection, regardless
    of direction. This is important as although edges can be stored in igraph with
    a source and target, for the purposes of a co-star actor graph, the edge direction
    is irrelevant:


    ```

    cc = g.components(mode=''weak'')

    print(len(cc))

    ```


