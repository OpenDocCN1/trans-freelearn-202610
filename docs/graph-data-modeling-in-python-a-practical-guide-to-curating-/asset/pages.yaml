    query with the same command to visually display the two identical nodes that are
    now present in our database:

    +   6. While the behavior of CREATE compared to that of MERGE is fairly obvious,
    what is less immediately clear is that the matching part of MERGE occurs for the
    entire pattern specified. So, should you attempt to merge two nodes and a relationship
    into Neo4j, and all nodes, relationships, and their attributes in the pattern
