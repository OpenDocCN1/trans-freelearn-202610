  md: "+   10. We now have everything we need to assemble our graph:\n+   \n+   I.\
    \ Let’s first import *igraph* and create an empty graph using `igraph.Graph()`.\n\
    +   \n+   II. Next, we can add nodes to the graph with `add_vertices()`, equivalent\
    \ to the length of our unique *igraph* node IDs.\n+   \n+   III. Then, we can\
    \ link these nodes by using the `add_edges()` method of our graph object, `g`,\
    \ and passing the IDs edgelist as a parameter.\n+   \n+   IV. Finally, by accessing\
    \ `g.vs`, we can add the actor attribute listwise to each node, which is the name\
    \ of each actor from our unique nodes list:\n\n```\nimport igraph\ng = igraph.Graph()\n\
    g.add_vertices(len(igraph_ids))\ng.add_edges(edgelist)\ng.vs['actor'] = nodes\n\
    ```\n\n+   11. As a last step, we should make sure that the elements of the graph\
    \ are as expected. We can use `assert` statements in Python to make sure that\
    \ node attributes are named correctly, comparing them to the nodes actor name\
    \ list. We can also make sure that the number of nodes is as expected too:\n\n\
    ```\nassert g.vs[2]['actor'] == nodes[2]\nassert len(g.vs) == len(nodes)\n```\n\
    \n+   12. For one final test to confirm that our projection has been applied as\
    \ intended, let’s find an edge in our *igraph* graph, and find the equivalent\
    \ path in the original graph database stored in Neo4j. To first find the nodes\
    \ on an edge in *igraph*, we can access the `g.es` attribute of our graph and\
    \ find the ID of the nodes connected by the edge with index 0 by accessing the\
    \ source and target attributes, in turn. Using these *igraph* node IDs, we can\
    \ then feed this index into `g.vs` and locate the actor properties we will use\
    \ to find the corresponding path in Neo4j, assigning them to the `actor1` and\
    \ `actor2` variables:\n\n```\nactor1 = g.vs[g.es[0].source]['actor']\nactor2 =\
    \ g.vs[g.es[0].target]['actor']\n```\n\n+   13. Now, we can open a connection\
    \ to Neo4j with Neo4j Connect and plug these actor names into a Cypher query.\
    \ We can use f-strings to form a valid Cypher query, looking for the Entity |\
    \ Film | Entity pattern we originally queried Neo4j for to create our projection.\
    \ Returning the actors and film, we can then create a result dictionary with `.data()`,\
    \ before closing the connection with `.close()` and printing it to the console:\n\
    \n```\nconnection = Neo4jConnect('bolt://localhost:7687', 'admin',\n'testpython')\n\
    query = f'MATCH (act1:Entity {{name:\"{actor1}\"}}) \\\n          <-[:STARRING]-(film:Entity)'\
    \ \\\n```"
