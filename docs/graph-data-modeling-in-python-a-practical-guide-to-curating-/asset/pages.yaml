- pgno: 31
  md: 'Initially, working with igraph is very similar to working with NetworkX. Let’s
    take a look:


    1. To import igraph into Python, use the following command:


    ```

    import igraph as ig

    ```


    2. And to create an empty graph, g, use the following command:


    ```

    g = ig.Graph()

    ```


    In contrast to NetworkX, in igraph, all nodes have a prescribed internal integer
    ID. The first node that’s added has an ID of 0, with all subsequent nodes assigned
    increasing integer IDs.


    3. Similar to NetworkX, changes can be made to a graph by using the methods of
    a Graph object. Nodes can be added to the graph with the Graph.add_vertices method
    (note that a vertex is another way to refer to a node). Two nodes can be added
    to the graph with the following code:


    ```

    g.add_vertices(2)

    ```


    4. This will add nodes 0 and 1 to the graph. To name them, we have to assign properties
    to the nodes. We can do this by accessing the vertices of the Graph object. Similar
    to how you would access elements of a list, each node’s properties can be accessed
    by using the following notation. Here, we are setting the name and followers attributes
    of nodes 0 and 1:


    ```

    g.vs[0][name] = Jeremy

    g.vs[1][name] = Mark

    g.vs[0][followers] = 130

    g.vs[1][followers] = 2100

    ```


    5. Node properties can also be added listwise, where the first list element corresponds
    to node ID 0, the second to node ID 1, and so on. The following two lines are
    equivalent to the four lines shown in step 4:


    ```

    g.vs["name"] = [Jeremy, Mark]

    g.vs[followers] = [130, 2100]

    ```


    6. To add an edge, we can use the Graph.add_edges() method:


    ```

    g.add_edges([(0, 1)])

    ```


    Here, we are only adding one edge, but additional edges can be added to the list
    parameter required by add_edges. As with NetworkX, if edges are added for nodes
    that are not currently in the graph, nodes will be created implicitly. However,
    since igraph requires nodes to have sequential IDs, attempting to add the edge
    pair (1, 3) to a graph with two vertices will fail.'
