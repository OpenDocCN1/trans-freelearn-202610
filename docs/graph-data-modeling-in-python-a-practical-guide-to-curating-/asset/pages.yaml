- pgno: 145
  md: "22. Now we can add all of our customers to our graph database in quick succession,\
    \ using a for loop. We can create a connection and make a call to add_customer()\
    \ for every customer in our list:\n\n```\nfor customer in customers:\n    connection\
    \ = Neo4jConnect('bolt://localhost:7687',\n        'admin', 'testpython')\n  \
    \  add_customer(customer, connection)\n    connection.close()\n```\n\nNote that\
    \ we open and close a Neo4j connection each time to avoid errors, where data will\
    \ fail to be written to the database. Should you try to open many connections\
    \ without closing them, the connection pool the Neo4j driver maintains will be\
    \ exhausted, and the next session that requests a connection will time out, resulting\
    \ in errors.\n\nWith our customers added, we can next add some purchases to the\
    \ graph. At present, let's add purchases at random to begin populating our graph\
    \ database with edges between customers and products.\n\n23. To do this, we can\
    \ use Python's inbuilt random library. For each customer in our list, we can randomly\
    \ sample a product from the product_ids list we created earlier by querying Neo4j.\
    \ We can then open connections and use our add_purcahse() method to create edges\
    \ in our graph that resemble customer purchases:\n\n```\nimport random\nfor customer\
    \ in customers:\n    product = random.choice(product_ids)\n    connection = Neo4jConnect('bolt://localhost:7687',\n\
    \        'admin', 'testpython')\n    add_purchase(customer, product, datetime.now(),\n\
    \        connection)\n    connection.close()\n```\n\nWe have now added customer\
    \ data to our graph, which gives us a good starting point for considering how\
    \ we might recommend further purchases to our online retailer's users next. At\
    \ this point, we could take a look at some of the customer data visually in the\
    \ Neo4j Browser, by querying subsets of the graph, or, for example, counting nodes\
    \ and paths.\n\n24. Additionally, we could also run the previous loops a few times\
    \ to generate more customers and purchases. If you want to monitor the population\
    \ of the graph in real time, consider slowing down the loops Python is running\
    \ by using the sleep() method from Python's time library, and adding calls to\
    \ sleep() into the logic. For example, the following would delay Python's execution\
    \ of code by one second:\n\n```\nfrom time import sleep\nsleep(1)\n```"
