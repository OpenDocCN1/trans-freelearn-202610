- pgno: 154
  md: "be able to sensibly recommend a product to either customer, as they both already\
    \ have every product the other customer has. There are also likely to be customer\
    \ pairs who have a similarity score of 0. It would also be difficult to make recommendations\
    \ in this case, as a score of zero indicates no overlap in purchase history, and\
    \ therefore no sign that one customer would particularly benefit from products\
    \ that the second customer has purchased, and vice versa.\n\nInstead, we want\
    \ to focus on customers who have some overlap in their purchase history, which\
    \ hints that there might be a reason one customer may purchase a particular set\
    \ of products and that the second may want to do the same for a similar reason.\
    \ For example, this may apply if a set of products works well together, such as\
    \ a TV and soundbar. Or, simply if two customers have a similar taste in brands\
    \ or the style of products. The beauty of using similarity to recommend products\
    \ here is that we don’t need to know the underlying reason for customers having\
    \ similar purchases; it is still more likely that they will be interested in the\
    \ products a similar customer has purchased than it is that they will choose to\
    \ purchase a separate, randomly chosen item.\n\nWith this in mind, we want to\
    \ target similar, but not identical purchase histories, and use these histories\
    \ to recommend further product purchases. To this end, we will define a Jaccard\
    \ similarity threshold, based on the results of the similarity analysis we’ve\
    \ carried out. Let’s bring all of this together and define one last method that\
    \ could be employed in a pipeline to recommend products to customers based on\
    \ their similarity.\n\n10. Our new method will be named rec_by_similarity(), and\
    \ take two customer IDs, c1, and c2. Part of our process will be adding new purchases,\
    \ but our existing add_purchase() method takes Customer objects as a parameter.\
    \ So, we should redefine the add_purchase() method to accept customer IDs, as\
    \ follows, and name it add_purchase_id():\n\n```\ndef add_purchase_id(c_id, productID,\
    \ time, connection):\n    query = f'MATCH (c:Customer {{customerID: toInteger({c_id})}})'\n\
    \    ' \\\n    f'MATCH (p:Product {{productID: toInteger({productID})}})'\n  \
    \  ' \\\n    f'MERGE (c)-[:PURCHASED {{datetime:\"{time}\"}}]->(p)'\n    connection.query(query)\n\
    ```\n\n11. Let’s return to defining rec_by_similarity(), and look at another parameter\
    \ we’ll need, threshold. Our threshold will target customers above a certain level\
    \ of Jaccard similarity. Here, we will set it to 0.7, but this can be changed\
    \ to target customers with a range of similarities:\n\n```\nthreshold = 0.7\n\
    ```\n\n12. Now, with our parameters planned out, we’re ready to define the rec_by_similarity()\
    \ method. We start by finding customer purchases from both c1 and c2, by reusing\
    \ the get_customer_purchases() method we defined earlier. Then, using the returned\
    \ product lists, we calculate the Jaccard similarity between them, with jaccard_similarity().\
    \ Next, we can check whether the similarity is above a certain threshold, as well\
    \ as checking that the two sets of products are not identical, with an if statement.\
    \ If the Jaccard similarity value"
