    # Slow writing from file to Neo4j


    When working with Neo4j and tabular data, it is quite common that you will be
    using huge files, for example in `.csv` or `.json` format. We often use the `LOAD
    CSV` function to access a file in the database’s `import` folder and use the data
    in each row to add nodes and edges to Neo4j. However, there are a number of different
    ways to use `LOAD CSV`, and not all are equal.


    First, let’s try to import nodes and edges from `musae_git_edges.csv` into `Common
    Issues DB`, with the following Cypher script.


    Here, we are simply calling `LOAD CSV`, adding `WITH HEADERS` because our data
    contains the headers `id_1` and `id_2`, and assigning each row to the `row` variable.
    We can then `MERGE` each GitHub developer node into the graph with a `githubId`
