    # Summary


    We have learned a lot about common issues that may be presented to us as aspiring
    graph practitioners. These are based on many years of experience working with
    these issues, and they do spring up in production code and systems more than we
    would like. However, over time, these issues tend to be covered by effective error
    handling in Python code and defense mechanisms we can put in place in Cypher script.


    The main things we looked at were issues such as how to debug errors in igraph
    and Neo4j (graph databases). In igraph, we have looked at issues such as how to
    correctly create edges in the graph, where we looked at the problems associated
    with node indexing; we extended this node indexing problem to analyzing node IDs
    in igraph and how we can fix node ID indexing issues. We then looked at adding
    properties effectively utilizing the vs and es attributes of igraph, getting under
    the hood of the select() method to understand how to use it, and sometimes, the
    shortfalls with using the method, such as working with chained statements in tandem
    with select() and how this can lead to unexpected consequences. Finally, we looked
    at how we can make algorithms more efficient by looking at path lengths and various
    ways to amp up the performance of our centrality algorithms.


    Relating to Neo4j, we looked at issues relating to slow writing from files and
    how to overcome this or speed this up with large datasets. Query performance was
    the next topic, where we looked at indexing and the effect this has on query performance;
    this was followed by how Neo4j caches results and how you may want to avoid this
    for large datasets and path traversals. In the query performance section, we looked
    at handling duplicates in our Cypher queries with the use of the MERGE statement
    and how we can use constraints to deal with duplicates. Debugging was the last
    port of call. Here, we looked at how you can use the Cypher EXPLAIN and PROFILE
    commands to produce an execution plan for your queries and to debug suspicious
    results. Additionally, in the debugging section, we looked at the eager operator
    and how to avoid this, allowing Neo4j to effectively execute queries without waiting
    to execute in places, while still avoiding issues with read and write conflicts.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'This brings this chapter to a close, and indeed the whole book. You have all
    the knowledge you need to replicate what you have learned in this book to go out
    there and start building graph solutions for your data problems.


    Throughout this book, we have focused on getting you to grips with understanding
    the fundamentals of how graphs are used in the real world; we then explored how
    to build and work with graph data models – the main focus of this section was
    to get you familiar with Python libraries for graph data science and to build
    a basic recommender system for predicting a user’s favorite television program,
    based on their viewing profile; this was followed by moving from a relational
    database mindset to a graph database mindset – this exposed us to working with
    MySQL and building a similar recommendation engine, but this time to predict video
    games that the user might be interested in. Knowledge graphs were the next subject
    of discussion, where we focused on methods of ingesting and cleaning data, before
    we built a knowledge graph and applied community detection over the top of the
    knowledge graph; we then started to introduce the concepts of graph databases
    and focused on Neo4j as our solution of choice for storing the graph connections
    and interfacing Neo4j with Python and igraph – the use case we used, once we had
    all our data in the graph database, was to work on a travel optimization solution.
    We then looked at building production pipelines. This focused on a combination
    of Neo4j and the interaction between various elements of the Python pipeline.
    Next, we looked at how to equip ourselves for rapidly changing schemas and the
    strategies to build these into the design upon inception. Moving on, we looked
    at how to store and utilize projections from a graph to do analysis and other
    downstream tasks. Finally, we covered the last piece of the puzzle – looking at
    some of the common issues and unexpected errors that appear when working with
    igraph and Neo4j.


    This really has been a rollercoaster of a ride, and we hope you have enjoyed every
    twist and turn along the way. It has been a pleasure to take you through years
    of acquired knowledge, distilling it down into this book.'
  merge: -1
