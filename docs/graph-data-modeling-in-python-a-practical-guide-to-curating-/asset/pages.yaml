- pgno: 180
  md: 'All notebooks, with the coding exercises, are available at the following GitHub
    link: `https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/tree/main/CH08`.


    # What are projections?


    Data in graph data models usually comprises relationships between things, whether
    they be people, languages, transport hubs, or any of the other examples we’ve
    seen throughout the previous chapters. Plenty of data models have several types
    of nodes and relationships, making one node or edge not equal in meaning or value
    to another.


    These types of graphs are known as heterogeneous graphs, and we have seen them
    throughout this book. One type of heterogeneous graph is a bipartite graph, where
    there are two types of nodes. In bipartite graphs, only different types of nodes
    can share edges. For example, a citation network might be represented as a bipartite
    graph, with authors connected to articles they have written.


    Analysis of heterogeneous graphs with multiple node and edge types can be tricky.
    To illustrate this, first consider the authorship graph in *Figure 8.1*. We can
    answer some simple questions easily, using this graph’s native structure, such
    as finding the number of articles an author has written using node degree, or
    contrastingly, the number of authors for an article, with the same method.


    However, to measure the tendency for groups of authors to work together, for example,
    using an algorithm such as community detection (as we used in *Chapter 4, Building
    a Knowledge Graph*), we would need to traverse paths through both articles and
    authors in order to find sensible communities. The results from running an algorithm
    such as community detection across a bipartite graph may not necessarily make
    sense when trying to examine the connectedness of groups of solely authors or
    solely articles:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_180_0.png)


    Figure 8.1 – A sample from a bipartite authorship graph'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'To answer these types of questions that primarily concern the authors, rather
    than the articles themselves, we can use a projection. A projection is a representation
    of a graph – often a simplified version of a complex network. Projections often
    *collapse* graph data into more simplified interactions between specific entities,
    meaning that information is lost during the conversion. Although information is
    lost, analysis becomes easier and more intuitive and allows more direct questions
    to be asked of the graph.


    *Figure 8.2* contains a unipartite projection of the bipartite graph shown in
    *Figure 8.1*. The graph now contains only **Author** nodes, which share an edge
    if the original bipartite graph nodes shared relationships to the same co-authored
    **Article**. Through this projection, we have lost certain information, for example,
    the individual articles that each pair of authors collaborated on. However, we
    have gained the ability to run graph algorithms over a homogenous graph, for example,
    what was mentioned previously, community detection. We can sensibly split our
    graph into communities of authors algorithmically when our graph exclusively contains
    Author nodes:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_181_0.png)


    Figure 8.2 – Corresponding unipartite projection of the authorship graph


    Other types of heterogeneous networks can be more complicated, with numerous node
    and edge types, such as in a knowledge graph.


    A knowledge graph can represent a wealth of information in a highly complex schema
