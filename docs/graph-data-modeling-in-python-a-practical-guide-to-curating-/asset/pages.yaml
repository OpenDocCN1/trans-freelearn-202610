    # Exploring cliques in our graph


    Up to this point, we have used our co-star projection to take a look at some graph
    features that would have been difficult to either compute or interpret using our
    main source of data, the knowledge graph. Let’s take a look at answering a different
    type of question.


    There are groups of actors who regularly appear in the same films. For a more
    advanced type of analysis using our projection, we may want to identify groups
    of actors that have all starred alongside each other at some stage in their careers.
    We can do this by finding *cliques* in our graph.


    In graph theory, a clique is a subgraph in any given network where a set of nodes
    are all interconnected with each other. If this subgraph were an entire graph
    in itself, we would call this *fully connected*.'
