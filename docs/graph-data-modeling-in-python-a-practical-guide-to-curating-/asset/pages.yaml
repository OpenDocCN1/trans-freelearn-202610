- pgno: 75
  md: '# A more advanced recommendation system using Jaccard similarity


    To recommend games more smartly, we are going to implement a solution based on
    node similarity. Node similarity compares the neighboring nodes of two nodes and
    returns a score. In our method, we will use Jaccard similarity, available in igraph
    as similarity_jaccard(). The score resulting from similarity_jaccard() will be
    equal to the count of two nodes’ common neighbors, divided by the number of neighbors
    adjacent to at least one of the two nodes. The result will be a number between
    0 and 1, where 0 means no similarity and 1 means the nodes have identical neighbors.


    Relating to our use case, in our Steam graph, user nodes are adjacent to game
    nodes. So, user nodes that share a high Jaccard similarity with other user nodes
    play similar games. We can use this information to make new recommendations to
    our users. We will now work through the steps to simplify this process:


    +   1. Let’s define a new function, make_recommendations(). Our function will
    take an igraph graph, g, and a specific user to make recommendations to, user.
    We will take advantage of the weights on our graph edges by specifying a minimum
    number of hours that games need to be played to be involved in our recommendations,
    min_hours. This way, where users have purchased a game but played it for only
    a short amount of time, we can assume that they did not enjoy the game, and not
    use that information in recommending a new one:

    +   2. First, we need to find the node represented by our user parameter, using
    g.vs.select() to query our graph for the node with internal_id equal to user.
    This will return a list of one element, so we can access the first and only element
    with a list slice and find that node’s index attribute, which will be the igraph
    ID:

    +   3. Then, we will use another custom method, prune_graph(), to remove edges
    in our graph based on the number of hours that games have been played. We will
    come back to this method shortly, after defining the remainder of make_recommendations():


    ```

    def make_recommendations(g, user, min_hours):

    ```


    ```

    user_node = g.vs.select(internal_id_eq=user)

    user_node = user_node[0].index

    ```


    ```

    g = prune_graph(g, min_hours)

    ```'
