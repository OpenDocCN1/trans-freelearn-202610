    # Using select() to interrogate the graph


    In the previous section, we used vs.select(), which is worth discussing in more
    detail, as it is a particularly powerful method. Its power stems from its flexible
    parameters, which are comprised of node types or attributes, and comparison operators.


    In the prior example, we used the page_type_eq parameter, set to tvshow. This
    tells vs.select() to search for nodes that have a page_type attribute equal (designated
    by _eq) to tvshow. Here, _eq could be substituted for many other operators, as
    follows:


    | Select parameter element | Comparison operator |

    |---|---|

    | _eq | Is equal to |

    | _ne | Is not equal to |

    | _lt | Is less than |

    | _gt | Is greater than |

    | _le | Is less than or equal to |

    | _ge | Is greater than or equal to |

    | _in | Is in a given list |

    | _not in | Is not in a given list |


    Table 2.1 – Dunder expressions for select()


    So, using the previous table, if we wanted to find nodes of type government or
    politician, we could use the following code:


    ```

    gov_pol_nodes = g.vs.select(page_type_in=[''government'', ''politician''])

    ```'
