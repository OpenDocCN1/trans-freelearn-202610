    # Creating a projection in Neo4j


    While a projection in Python allows for some highly advanced data analytics, it
    is stored in memory and therefore not persistent. Should we want a projection
    that we access repeatedly or need to store long term, we might want to use a graph
    database such as Neo4j for this too. To develop our Neo4j projection we are going
    to need to take the following steps:


    +   1. In Projection DB, we’re next going to create a projection of films sharing
    the actors and the countries they are filmed in, in order to enable some more
    analysis. For the purposes of the chapter, we can store this projection alongside
    the original graph data, as long as we make sure to keep this graph separate by
    using new labels and edge types. This will prevent any mixing of information when
    querying the graph for insights later.


    +   2. Our new graph will contain Film nodes that have a stored name. As we did
    with our main movie information graph, we will first create an index for Film
    nodes, on the name attribute. This will drastically speed up operations where
    we match using film names. We will use the same syntax as we did earlier on in
    this chapter, in the How to use a projection section, in step 9:


    ```

    CREATE INDEX film

    FOR (f:Film)

    ON f.name

    ```


    +   3. Next, we can move on to querying our existing Entity nodes for specific
    information and add this to a new, separate graph projection. We are going to
    be using some fairly advanced Cypher again here, drawing once again on the APOC
    plugin. This time, we are using the apoc.periodic.iterate() function to split
    the execution of a query into batches. This prevents Neo4j from loading too much
    into memory at once and hitting a memory limit that causes it to raise an error.
    We’ll kick off this query by using CALL to call periodic.iterate(), with'
