- pgno: 118
  md: "4. Now that Neo4j can read the files, let’s write some Cypher to access their\
    \ content. We can use `LOAD CSV WITH HEADERS` to load the `reachability-meta.csv`\
    \ data, and the `as` function tells Neo4j to run the remaining code for each csv\
    \ line, where each line is now named `row`. The headers are read in and can be\
    \ used to access the corresponding csv columns, which we reference in `CREATE`\
    \ to build nodes with the correct properties. Node IDs and population numbers\
    \ are turned into integers with `toInteger()`, while our latitude and longitude\
    \ attributes are converted into floats using `toFloat()`. When run from the Neo4j\
    \ Browser, the following script will load the node attributes file:\n\n```\n```cypher\n\
    LOAD CSV WITH HEADERS from 'file:///reachability-meta.csv' as row\nCREATE (city:City\
    \ {\n    node_id: toInteger(row.node_id),\n    name: row.name,\n    population:\
    \ toInteger(row.metro_pop),\n    latitude: toFloat(row.latitude),\n    longitude:\
    \ toFloat(row.longitude)\n})\n```\n```\n\n5. Next, we will use Cypher again to\
    \ load in the edges file. Unlike our node properties file, `reachability.csv`\
    \ doesn’t contain headers, so we use `LOAD CSV` to import the data into Neo4j.\
    \ Our two `MATCH` functions find the corresponding nodes for our edge using slice\
    \ notation (e.g., `[0]`) to refer to the csv columns. We can also use Cypher’s\
    \ `toInteger()` function to convert our node attributes into integers, for both\
    \ matching and merging. This identifies the nodes that we loaded in the previous\
    \ step. Then, a `MERGE` step adds an `:AIR_TRAVEL` edge between these nodes, with\
    \ `travel_time` added as an attribute from the third csv column:\n\n```\n```cypher\n\
    LOAD CSV from 'file:///reachability.csv' as row\nMATCH (from:City {node_id: toInteger(row[0])})\n\
    MATCH (to:City {node_id: toInteger(row[1])})\nMERGE (from)-[:AIR_TRAVEL {travel_time:\
    \ toInteger(row[2])}]->(to)\n```\n```\n\n6. With our data loaded into Neo4j, we\
    \ should now confirm that it is as expected and try to access it from Python.\
    \ To perform Cypher queries in Python, we will again be using the Neo4j Connect\
    \ class we prepared earlier in this chapter. This can be imported from the custom\
    \ package we have made for this chapter, namely `graphtastic` (apologies for the\
    \ cheesy naming), in the GitHub repository (`https://github.com/PacktPublishing/Graph-Data-Modeling-in-Python/blob/main/CH05/`)\
    \ and can be implemented in Python code as so:\n\n```\n```python\nfrom graphtastic.database.neo4j\
    \ import Neo4jConnect\n```\n```\n\n7. Let’s write some simple Cypher queries inside\
    \ Python to test that our data import was successful and that our graph can still\
    \ be accessed. As before, we establish a connection with the Neo4j `Connect` class\
    \ and run some Cypher using `connection.query()`. Our Cypher here simply matches"
