    \ our graph. This is a simple case of adding nodes equal to the number of terms\
    \ and abstracts we have, using the `add_vertices` method:\n\n```\ng.add_vertices(len(term_ids)\
    \ + len(data))\n```\n\n7. We can add our abstract and term text to the nodes as\
    \ attributes, by accessing the vs attribute of our graph, g. We can do this listwise,\
    \ by creating one list of both abstract text and term text, taken from our cleaned\
    \ data list, and the items() in our term_ids dictionary, respectively:\n\n```\n\
    text = [abstract[1] for abstract in data] +\n    [ent for ent, _ in term_ids.items()]\n\
    g.vs['text'] = text\n```\n\nLet’s briefly make sure that the text attribute of\
    \ the node representing the term ige is in fact equal to ige, by printing it:\n\
    \n```\nprint(g.vs[term_ids['ige']]['text'])\n```\n\n8. We also need to add the\
