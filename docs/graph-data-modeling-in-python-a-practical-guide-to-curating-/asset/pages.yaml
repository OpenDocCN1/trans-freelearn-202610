- pgno: 159
  md: 'However, things begin to get more complex for relational databases, depending
    on the relationships between data points. Imagine now that we want to store multiple
    shipping addresses for each customer in our system so that a customer can choose
    between them. In our relational database, one column will no longer be sufficient
    to describe this data. Each customer can have any number of addresses, so creating
    a column in our customers table for each address is not a viable option either.
    In this case, we wouldn’t know how many columns to create, and even if we did,
    customers with a large number of addresses on file would likely be uncommon, resulting
    in columns containing many null values for all other customers.


    Instead, adding multiple addresses per customer would involve refactoring the
    relational database. A typical solution would be to create a new table, containing
    one row per customer-address pair, and removing the Address column from our main
    customers table. This maintains the relationship between the unique customer and
    their address but involves replication of the customer ID (or another uniquely
    identifying feature) between two tables.


    The following figure shows the impact an evolving schema can have on a traditional
    relational database schema:


    | Customer ID | Name | Address | Etc.... |

    |---|---|---|---|

    | 101111 | Mark | 165 London Road | ... |

    | 101112 | Jeremy | 34 Star Avenue | ... |

    | 101113 | Johnson | 12 Applewood Close | ... |

    | 101114 | Sue | 1 Elm Street | ... |


    | Customer ID | Name | Etc.... |

    |---|---|---|

    | 101111 | Mark | ... |

    | 101112 | Jeremy | ... |

    | 101113 | Johnson | ... |

    | 101114 | Sue | ... |


    | Customer ID | Address |

    |---|---|

    | 101111 | 165 London Road |

    | 101112 | 34 Star Avenue |

    | 101112 | 63 Hill View |

    | 101113 | 12 Applewood Close |

    | 101114 | 1 Elm Street |

    | 101114 | 59 Sparrow Lane |


    Figure 7.1 – Evolving database schema impact'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'In a graph database, this type of schema change is more simple to implement.
    Graphs benefit from having no fixed structure, a property conferred by the way
    relationships between data points are modeled. A graph database, when used correctly,
    is agnostic to the type of relationship being modeled; whether it be one-to-one,
    one-to-many, or many-to-many, a relationship is always represented by an edge
    between two nodes. This is the sort of change that is highlighted in Figure 7.2:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_160_0.png)


    Figure 7.2 – Graph database pre-schema change


    With multiple addresses per customer possible, we can move the **address** attribute
    to a separate node of the **Address** type, connected by an edge. Now, when additional
    addresses are added for a customer, we just add another node and edge to the graph.
    Here, there is no need to have a pre-existing number of addresses allowed per
    customer, nor is there any need to duplicate data in separate parts of the database.'
  merge: -1
  img_proc: true
