  md: '# Building a Knowledge Graph


    This chapter will extend your knowledge further and introduce knowledge graphs.
    While learning what a knowledge graph is, you will also get hands-on practice
    with cleaning data in preparation for ingesting into a graph. This will teach
    you about the hidden side of data science and graph modeling, in which you spend
    much of your time cleaning data and getting it ready to commence modeling.


    Moreover, we will teach you the best methods of ingesting your data into a graph.
    After that, you will be ready to analyze your knowledge graph, which will be further
    extended by finding communities in your knowledge graph, with a technique known
    as community detection.


    Community detection is commonly used to discover groups or clusters of similar
    items in your network. These methods can be utilized, for example, to find influential
    groups posting about a certain narrative on social media, or in the example we
    are going to utilize, to look for similar literature when comparing research abstracts.


    To break this down in a structured way, we are going to be covering the following
    main topics:


    +   - Introducing knowledge graphs

    +   - Cleaning the data for our knowledge graph

    +   - Ingesting data into a knowledge graph

    +   - Knowledge graph analysis and community detection


