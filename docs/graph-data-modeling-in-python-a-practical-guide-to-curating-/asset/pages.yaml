  md: '3. Now, we need to add nodes to our graph, which can be done using methods
    of the Graph object belonging to g. There are multiple ways to do this, with the
    simplest being adding one node at a time:


    ```

    g.add_node(Jeremy)

    ```


    4. Alternatively, multiple nodes can be added to the graph at once, like so:


    ```

    g.add_nodes_from([Mark, Jeremy])

    ```


    5. Properties can be added to nodes during creation by passing a node and dictionary
    tuple to Graph.add_nodes_from:


    ```

    g.add_nodes_from([(Mark, {followers: 2100}), (Jeremy,

    {followers: 130})])

    ```


    6. To add an edge to the graph, we can use the Graph.add_edge method, and reference
    the nodes already present in the graph:


    ```

    g.add_edge(Jeremy, Mark)

    ```


    It is worth noting that, in NetworkX, when adding an edge, any nodes specified
    as part of that edge not already in the graph will be added implicitly.


    7. To confirm that our graph now contains nodes and edges, we may want to plot
    it, using matplotlib and networkx.draw(). The with_labels parameter adds the names
    of the nodes to the plot:


    ```

    import matplotlib.pyplot as plt

    nx.draw(g, with_labels=True)

    plt.show()

    ```


    This section showed you how you can get up and running with NetworkX in a couple
    of lines of Python code. In the next section, we will turn our focus to the popular
    igraph package, which allows us to perform calculations over larger datasets much
    quicker than using the popular NetworkX.


    # igraph basics


    NetworkX, while user-friendly, suffers from slow speeds when using larger graphs.
    This is due to its implementation behind the scenes and because it is written
    in Python, with some C, C++, and FORTRAN.


    In contrast, igraph is implemented in pure C, giving the library an advantage
    when working with large graphs and complex network algorithms. While not as immediately
    accessible as NetworkX for beginners, igraph is a useful tool to have under your
    belt when code efficiency is paramount.'
