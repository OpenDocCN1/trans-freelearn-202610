    \ This can be run from the Neo4j Browser:\n\n```\n```cypher\nMATCH (c:Customer)\
    \ DETACH DELETE c\n```\n```\n\n+   17. With our custom methods set up, we now\
    \ have everything in place to simulate the basic behavior of a customer using\
