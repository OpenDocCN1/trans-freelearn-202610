- pgno: 136
  md: 'Figure 6.2 shows an extended schema, containing both product and customer information:


    ![](img/bc74e41f90aaa6ff0a01f7249c87c1d5_136_0.png)


    Figure 6.2 – Adding customer purchases to the graph schema


    Representing all the features of our products, and the features of customers that
    interact with them, results here in a directed heterogeneous graph. The fact that
    customers can make multiple purchases of the same item will result in the potential
    for more than one edge between a pair of nodes, meaning that our network is classed
    as a multigraph.


    The information in our graph schema is such that if we want to find what types
    or brands of products a customer tends to purchase, we can traverse paths in our
    graph to find an answer. We will come back to this idea later, when making product
    recommendations. We may also want to add to this schema later, to capture additional
    information about our customers. Thankfully, a heterogenous graph schema is more
    flexible than a relational database, as we explored in Chapter 1, Introducing
    Graphs in the Real World, and allows for additional types of nodes and edges to
    be added when required, without affecting the data currently modeled.


    Now that we have a plan for representing data in our graph database, we can start
    to create processes to store it.


    # Adding static product information


    As we mentioned previously, the products on offer in our online store will form
    the backbone of our graph data. We have a list of products already on offer, as
    well as extra information on them, in products.csv.'
