    # Debugging graph issues


    With graph data models and analysis being more readily employed in industry, and
    graph database solutions and software gaining popularity, it is likely that you
    will be exposed to data problems that can be solved in a graphical way. At the
    same time, graph solutions are still fairly new to many businesses, and you will
    almost certainly run into errors and issues as a graph data practitioner.


    Here, we will cover some of the most common problems you are likely to encounter
    when using the *igraph* Python library, as well as some standard errors and issues
    you may see when using Neo4j. Each issue will be demonstrated with a short example,
    as an aid in debugging your own issues.


    Each error or problem will be shown alongside a real example you can follow along
    with and resolve. We will need some data with which to demonstrate some issues
    you may encounter when using Neo4j and Cypher.


    For this chapter, our examples will use social network data collected from GitHub.
    This will include data relationships between GitHub developers. Each edge in our
    edgelist, `musae_git_target.csv`, represents two developers that mutually follow
    each other.


    We also have the names of our developers, which will be our nodes, in `musae_git_target.csv`.
    Our data represents a reasonably large graph, with around 38,000 nodes, and nearly
    290,000 edges. Of course, there are many types of graphs you could run into problems
    with, as in all the example data we have worked with so far, but here, for the
    purposes of demonstrating some issues around bugs and scaling issues in both *igraph*
    and Neo4j, the GitHub social network will be used.


    The following section will look at the common issues you will face when working
    with the igraph library.


    # Common igraph issues


    While *igraph* is a powerful library for graph data and its analysis, much of
    its power comes from the fact that Python acts as an interface to *igraph*''s
    implementation behind the scenes, which is in C. Because of this, *igraph* comes
    with some quirks, which you need to bear in mind when using its features. In the
    following subsections we will take you through some common problems users come
    across when working with *igraph* in Python.'
