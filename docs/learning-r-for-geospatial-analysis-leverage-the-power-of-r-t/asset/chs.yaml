  - Kahle, D. and Wickham, H. \"ggmap: Spatial Visualization with ggplot2\". The R\
  \ Journal. 2013. http://journal.r-project.org/archive/2013-1/kahle-wickham.pdf.\n\
  - Lamigueiro, O. P. *Displaying Time Series, Spatial, and Space-Time Data with R.*\
