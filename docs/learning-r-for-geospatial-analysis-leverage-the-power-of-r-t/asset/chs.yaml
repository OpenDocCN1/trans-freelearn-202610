  \nThe defining feature of spatial data analysis is the reference within the data\
  \ being analyzed to locations on the surface of the earth. This is a very broad\
  \ subject encompassing distinct areas of expertise such as spatial statistics, geometric\
  \ computation, and image processing.\n\nIn practice, spatial data is commonly stored,\
  \ viewed, and analyzed in Geographic Information System (GIS) software, of which\
  \ the most well-known example is ArcGIS. However, most often, menu-based interfaces\
  \ of GIS software are too narrow in scope to meet specialized demands or too inflexible\
  \ to feasibly accomplish customized repetitive tasks. Writing scripts rather than\
  \ using menus or working in combination with external software are two commonly\
  \ used paths to solve such problems. However, what if we can use a single environment,\
  \ combining the advantages of programming and spatial data analysis capabilities\
  \ with a comprehensive ecosystem of computational tools that are readily implementable\
  \ in customized procedures?\n\nThis book will demonstrate that the R programming\
  \ language is indeed such an environment and teach you how to use it in order to\
  \ perform various spatial data analysis tasks.\n\nMost currently available books\
  \ on this subject are focused on advanced applications such as spatial statistics,\
  \ assuming you have prior knowledge of R and the respective scientific domains.\
  \ Yet, introductory material on R from the point of view of a spatial data analyst,\
  \ which is focused on introductory topics such as spatial data handling, computation,\
  \ and visualization, is scarce. This book aims to fill that gap.\n\nChapter 8, Spatial\
  \ Interpolation of Point Data, presents the subject of spatial interpolation in\
  \ R from a practical point of view. Using a real-world case study, several common\
  \ interpolation methods are applied and evaluated. An automated interpolation procedure\
  \ is then constructed in order to create a series of interpolated maps from point\
  \ data.\n\nChapter 9, Advanced Visualization of Spatial Data, shows readers how\
  \ to produce publication-quality maps mainly using the popular ggplot2 R package.\n\
  \nAppendix A, External Datasets Used in Examples, provides a summary of the datasets\
  \ used in the examples.\n\nAppendix B, Cited References, lists the cited resources.\n\
  \n## What you need for this book\n\nTo follow through the examples in this book,\
  \ all you need to do is install R (which is available for free) and download the\
  \ example datasets from the book's website. Some of the examples also require you\
  \ to have an Internet connection to download additional datasets and R packages\
  \ from the R environment.\n\n## Who this book is for\n\nThis book is intended for\
  \ anyone who wants to learn how to efficiently analyze geospatial data with R. This\
  \ book primarily targets GIS analysts, researchers, educators, and students who\
  \ are working with spatial data and are interested in expanding their capabilities\
  \ through programming. The book assumes familiarity with basic geographic information\
  \ concepts (such as spatial coordinates) and no prior experience with R and/or programming.\n\
