  \n我们的书籍和出版物分享了您同行的 IT 专业人士在适应和定制当今系统、应用程序和框架方面的经验。我们的解决方案型书籍为您提供定制您正在使用的软件和技术以完成工作的知识和能力。Packt\
  \ 的书籍比您过去看到的 IT 书籍更具体、更少泛泛而谈。我们的独特商业模式使我们能够为您提供更集中的信息，让您获得更多所需了解的内容，而非不需要的内容。\n\n\
  Packt 是一家现代而独特的出版公司，专注于为开发者、管理员和新手社区生产高质量的前沿书籍。有关更多信息，请访问我们的网站 www.packtpub.com。\n\
  \n# 关于 Packt Open Source\n\n2010 年，Packt 推出了两个新品牌 Packt Open Source 和 Packt Enterprise，以便继续专注于专业化。本书是\
