  \ J. 和 de Jonge, E. *学习RStudio进行R统计计算*. Packt出版社. 2012年.\n- Wickham, H. \"使用reshape包重塑数据\"\
  . 统计软件杂志. 2007年. http://www.jstatsoft.org/v21/i12/paper.\n- Wickham, H. *ggplot2:\
  \ 数据分析的优雅图形*. Springer出版社. 2009年.\n- Wickham, H. \"数据分析的拆分-应用-合并策略\". 统计软件杂志. 2011年.\
  \ http://www.jstatsoft.org/v40/i01/paper.\n- Wickham, H. \"整洁数据\". 统计软件杂志. 2014年.\
  \ http://www.jstatsoft.org/v59/i10/paper.\n- Wickham, H. *高级R*. CRC出版社. 2014年. http://adv-r.had.co.nz/.\n\
