  \ lower, upper)\n> df\n  num lower upper\n1   1     a     A\n2   2     b     B\n\
  3   3     c     C\n4   4     d     D\n```\n\n**New terms** and **important words**\
  \ are shown in bold. Words that you see on the screen, in menus or dialog boxes\
  \ for example, appear in the text like this: \"Under the **Getting Started** section,\
  \ select the **download R** link.\"\n\n![](img/ebfd6294770b225fdeceda9a7b8b560e_18_0.png)\n\
