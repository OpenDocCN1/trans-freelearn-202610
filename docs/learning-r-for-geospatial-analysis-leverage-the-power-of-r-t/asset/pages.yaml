- pgno: 229
  md: "The resulting graphical output is shown in the following screenshot:\n\n![](img/ebfd6294770b225fdeceda9a7b8b560e_229_0.png)\n\
    \nThe white background we see corresponds to the NA-filled area in towns_r. These\
    \ are the raster cells where no point in towns falls. The two colored pixels are\
    \ the two cells that have been assigned with values. The light blue pixel is the\
    \ one assigned with the value of 1 (corresponding to Lahav Kibbutz), while the\
    \ brown pixel is the one assigned with 2 (Lehavim).\n\n> Two other useful parameters\
    \ of rasterize are `field` and `fun`.\n> \n> Using `field`, we can override the\
    \ default assignment of raster values and provide a single number, vector, or\
    \ the name of an attribute table column determining the values (see *Chapter 8,\
    \ Spatial Interpolation of Point Data*, for an example of the latter). For example,\
    \ using the `rasterize(towns, r, field=c(3,4))` expression will yield a raster\
    \ with the value of 3 for Lahav Kibbutz and 4 for Lehavim.\n> \n> The `fun` parameter\
    \ determines the method to assign the raster values, and is only relevant when\
    \ some raster cells overlap with more than one feature. It can be provided either\
    \ with a function or one of the predefined character values: `\"first\"`, `\"\
    last\"`, `\"count\"`, `\"sum\"`, `\"min\"`, or `\"max\"` (the default value is\
    \ `\"last\"`). For example, the `rasterize(towns, r, fun=\"count\")` expression\
    \ yields a raster stating how many towns are in each of the 500 meter cells (in\
    \ our case, this is not very instructive—the raster will have two 1 values because\
    \ there is only one town in each of the two individual cells)."
