- pgno: 95
  md: "Let's see another example with tapply involving our climatic data. Say we are\
    \ interested in finding out how many stations are there (and which ones) with\
    \ at least one missing value within its respective time series of precipitation\
    \ amount. For an individual station (such as the one named \"IZANA SP\"), we could\
    \ check whether its tpcp column contains at least one NA value as follows:\n\n\
    ```\n> any(is.na(dat[dat$station_name == \"IZANA SP\", \"tpcp\"]))\n[1] TRUE\n\
    ```\n\nThe returned value is TRUE, meaning the answer is yes. Note that the operation\
    \ consisted of three steps. We first created a subset of dat (consisting of the\
    \ rows for which the station name is \"IZANA SP\" and the column name is \"tpcp\"\
    ). Since the subset is created from a single column, it was automatically simplified\
    \ to a vector. Secondly, we looked for each element whether it is NA with the\
    \ is.na function. Finally, we checked whether at least one element in the resulting\
    \ logical vector is TRUE, with the any function.\n\nTo instantly perform this\
    \ operation on all stations, we can use tapply:\n\n```\n> result = tapply(\n+\
    \ dat$tpcp,\n+ dat$station_name,\n+ function(x) any(is.na(x)))\n```\n\nThis time\
    \ the values vector we use the tapply function upon is dat$tpcp (since we want\
    \ to look for missing values in the precipitation data) and the vector that defines\
    \ the subsets is dat$station_name (since we want to apply the function on data\
    \ from each station separately). Finally, the function that we apply is a user-defined\
    \ one; its definition is encompassed within the tapply function call for compactness.\
    \ The function takes one argument (x) and returns TRUE or FALSE depending on whether\
    \ x does or does not contain at least one NA value, respectively, the same way\
    \ that we did in the previous code section.\n\nThe resulting array indicates,\
    \ for each station, whether at least one precipitation measurement is missing.\
    \ Here are its first ten elements:\n\n```\n> result[1:10]\n        A CORUNA ALVEDRO\
    \ SP             A CORUNA SP\n                    FALSE                     FALSE\n\
    \    ALBACETE LOS LLANOS SP         ALBACETE OBS. SP\n                    FALSE\
    \                     FALSE\n      ALMERIA AEROPUERTO SP        ASTURIAS AVILES\
    \ SP\n                    FALSE                     FALSE\n                AVILA\
    \ SP BADAJOZ TALAVERA LA REAL SP\n```"
  merge: -1
  img_proc: true
