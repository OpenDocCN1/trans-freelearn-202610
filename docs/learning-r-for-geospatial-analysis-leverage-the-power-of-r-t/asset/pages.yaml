- pgno: 144
  md: 'This following screenshot shows the graphical output:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_144_0.png)


    In fact, there is a specialized function for reclassification in the raster package
    called reclassify. The function accepts a raster (which we would like to reclassify)
    and a numeric vector or matrix (specifying the rules of reclassification). For
    example, if we supply a numeric vector, it should be composed of triplets of numeric
    values specifying the classification rules: from-, to-, new value, from-, to-,
    new value, and so on. It is often convenient to use the special value Inf (which
    stands for infinity) to specify unlimited from- or to- edges for a given range.
    For example, to specify the ≤0.2 range, we will say from -Inf to 0.2. Therefore,
    for example, we could create the l_rec raster with the following expression, instead
    of the three expressions shown in the previous example:


    ```

    > l_rec = reclassify(ndvi_00, c(-Inf, 0.2, 0, 0.2, Inf, 1))

    ```'
  merge: -1
  img_proc: true
