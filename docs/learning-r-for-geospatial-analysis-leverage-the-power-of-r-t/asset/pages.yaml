- pgno: 238
  md: "Let's take a look at the attribute table of dem_contour:\n\n```\n> dem_contour@data\n\
    \    level\nC_1     0\nC_2   100\nC_3   200\nC_4   300\nC_5   400\nC_6   500\n\
    ```\n\nIndeed, the layer consists of six line features—one for each break we specified\
    \ with the levels argument.\n\n# Raster-to-polygons conversion\n\nAs mentioned\
    \ previously, raster to polygon conversion involves the generation of rectangular\
    \ polygons in the place of each raster cell (once again, excluding NA cells).\
    \ Similar to the raster-to-point conversion, the resulting attribute table contains\
    \ the respective raster values for each polygon created. The conversion to polygons\
    \ is most useful with categorical rasters when we would like to generate polygons\
    \ defining certain areas in order to exploit the analysis tools this type of data\
    \ is associated with (such as extraction of values from other rasters, geometry\
    \ editing, and overlay).\n\nCreation of polygons from a raster can be performed\
    \ with a function whose name the reader may have already guessed, rasterToPolygons.\
    \ A useful option in this function is to immediately dissolve the resulting polygons\
    \ according to their attribute table values; that is, all polygons having the\
    \ same value are dissolved into a single feature. This functionality internally\
    \ utilizes the rgeos package and it can be triggered by specifying dissolve=TRUE.\n\
    \nIn the previous chapter, we prepared a raster named l_rec_focal_clump, a categorical\
    \ raster with consecutively numbered NDVI>0.2 patches. In our next example, which\
    \ we will begin in this chapter and finish in Chapter 9, Advanced Visualization\
    \ of Spatial Data, we will visually compare the average NDVI time series of Lahav\
    \ and Kramim forests (see earlier), based on all of our Landsat (three dates)\
    \ and MODIS (280 dates) satellite images. In this chapter, we will only prepare\
    \ the necessary data by going through the following intermediate steps:\n\n+ \
    \  1. Creating the Lahav and Kramim forests polygonal layer.\n+   2. Extracting\
    \ NDVI values from the satellite images.\n+   3. Creating a data.frame object\
    \ that can be passed to graphical functions later."
