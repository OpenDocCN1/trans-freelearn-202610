- pgno: 295
  md: '# 9

    Advanced Visualization of

    Spatial Data


    Visualization of spatial data is vital both during intermediate analysis steps
    (to examine preliminary results and make sure we are on the right track) and as
    the final product (to present our results to colleagues or in a publication).
    In this chapter, we are going to visualize various datasets we created in the
    previous chapters, bringing closure to the previously presented case studies.
    While doing this, you will learn how to produce an elaborate and customized graphical
    output in R.


    Most of this chapter is going to concentrate on the popular graphical package
    `ggplot2`. We will begin by presenting the logic behind the special syntax this
    package follows. Afterwards, we will review, through examples, the way spatial
    and nonspatial plots can be produced and customized using this package. The `ggmap`
    package, which automates downloading static maps from the Web and can be used
    to complement plots produced with `ggplot2`, will then be presented. Finally,
    we will experiment a little bit with **three-dimensional (3D)** visualization
    using the `lattice` package.


    In this chapter, we''ll cover the following topics:


    +   - Using `ggplot2` to produce publication-quality plots

    +   - Using `ggmap` to add static maps as the background

    +   - Using `lattice` to produce 3D plots


    > [ In this chapter, we are going to use objects created in the previous chapters.
    ]'
  merge: -1
  img_proc: true
- pgno: 296
  md: "# Plotting with ggplot2 and ggmap\n\nIn this section, you are going to learn\
    \ how to use ggplot2 and ggmap to visualize spatial data. The section is structured\
    \ as follows. First, we will review the ggplot2 framework using a simple example\
    \ of a time series plot since (as you will see right away) the syntax is quite\
    \ different from that of other plotting methods we used until now. After that,\
    \ we will practice a little bit more with producing ordinary, nonspatial plots.\
    \ Next, we will see how the ggplot2 plots can be saved for subsequent use, both\
    \ within the R environment and in external files. Finally, the last two sections\
    \ will deal with the most important material from this book's perspective. In\
    \ these two sections, we will see how spatial data can be incorporated into ggplot2\
    \ visualizations to produce maps, and how we can conveniently download reference\
    \ background images for such maps using ggmap.\n\nBefore going into the details\
    \ of ggplot2, it is important to state that to use this package, our input data\
    \ needs to be contained in a data.frame object and it needs to be tidy (see Chapter\
    \ 7, Combining Vector and Raster Datasets, for more information). Therefore, in\
    \ practice, there are two steps when plotting with ggplot2:\n\n+   - Bringing\
    \ the data to the appropriate form\n+   - Creating the plot\n\nIn some of the\
    \ following examples, when the data is already in the right shape, we will skip\
    \ the first step and move on to creating the plot right away. Otherwise, we will\
    \ first have to reshape our data (using methods already familiar to us from the\
    \ previous chapters) and only then utilize ggplot2 to create the plot itself.\n\
    \n# An overview of ggplot2\n\nThe best way to understand the underlying logic\
    \ of ggplot2 is through examples. Our first example is going to reproduce the\
    \ time series plot we created in Chapter 2, Working with Vectors and Time Series,\
    \ when demonstrating the difference between the three graphics systems in R. As\
    \ you remember, we used the following data.frame object (although not knowing\
    \ that it was a data.frame object at the time) that represents a time series of\
    \ temperature measurements. The time column of this data.frame object contains\
    \ dates, while the tmax column contains the daily temperature maxima:\n\n```\n\
    > head(dat)\n       time tmax\n1 2006-01-01 13.3\n2 2006-01-02 14.4\n3 2006-01-03\
    \ 15.6\n```"
