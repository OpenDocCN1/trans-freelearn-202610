- pgno: 193
  md: '# 6

    Modifying Rasters and

    Analyzing Raster Time Series


    In this chapter, we will continue with the material presented in *Chapter 4, Working
    with Rasters*, moving on to more advanced operations. These involve either the
    modification of the geometric properties of a raster or direction- and distance-related
    calculations on rasters; mostly using additional functions in the `raster` package.
    Examples related to the analysis of spatio-temporal remote sensing data will be
    presented in the last section of this chapter, to demonstrate how more complex,
    custom-made procedures of raster processing can be constructed.


    In this chapter, we will use objects that we previously created in *Chapter 3,
    Working with Tables*, and *Chapter 4, Working with Rasters*.


    In this chapter, we''ll cover the following topics:


    +   - Modifying the geometry of raster layers

    +   - Applying focal filters

    +   - Clumping patches of connected cells

    +   - Resampling and reprojection of rasters

    +   - Performing topography-related calculations on elevation data

    +   - Aggregating spatio-temporal raster data'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# # Changing the spatial extent or resolution of rasters


    With reference to raster geometry, so far we have only dealt with operations where
    the raster extent is manually reduced by selecting a certain combination of rows
    and columns to retain (refer to *Chapter 4, Working with Rasters*). In this chapter,
    we will review more operations that provide us with the freedom to modify the
    raster geometry of datasets according to our specific requirements.


    In this section, we will see how we can change the extent or resolution of rasters
    without modifying the underlying grid arrangement. This category includes operations
    such as merging rasters, cropping, or aggregating/disaggregating raster cells.
    In the next section, we will see how the underlying grid (and possibly the CRS)
    can be modified through resampling and reprojection.


    In the first few examples of this chapter, we will work with a DEM of the area
    surrounding Haifa, and experiment with the modification of raster extent and resolution.
    A DEM is a raster holding elevation values, thus representing the topography of
    the specific area that it covers. There are many ways of creating a DEM, including
    interpolation from a limited set of elevation measurements (such as points or
    contours) or conducting continuous measurements of the surface (with instruments
    such as **Light Detection and Ranging (LIDAR)** or stereoscopy). Here, we will
    use a part of the near-global DEM created in 2000, in an effort called the **Shuttle
    Radar Topography Mission (SRTM)**. In this mission, elevation data has been collected
    using an instrument on board the Space Shuttle Endeavour, covering the Earth''s
    surface up to 60 degrees latitude, north and south.


    SRTM data is available online for free (visit `http://srtm.csi.cgiar.org/`). It
    is also directly accessible through R, using the getData function of the raster
    package (we already used this function in the previous chapter to obtain the Haifa
    administrative borders layer). The SRTM DEM is divided into tiles of 5 x 5 degrees
    of longitude/latitude that can be downloaded separately. With getData, we need
    to set the dataset name to "SRTM" and specify geographic coordinates of interest
    (longitude and latitude). The returned object is a RasterLayer covering the corresponding
    tile.


    Incidentally, the longitude of Haifa is 34.99 degrees (you can check this quickly
    with geocode ("Haifa"); refer to the previous chapter), and thus it is located
    at the intersection of two 5 x 5 degrees tiles. To cover Haifa, we will download
    both tiles:


    +   - longitude 30-35, latitude 30-35

    +   - longitude 35-40, latitude 30-35'
  merge: -1
  img_proc: true
- pgno: 195
