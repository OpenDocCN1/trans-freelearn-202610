- pgno: 97
  md: "# Applying a function on rows or columns of a table\n\nThe second function\
    \ of the apply family that we will meet is apply. This function is also used to\
    \ apply a certain function on subsets of data, but instead of operating on subsets\
    \ defined by a grouping object, it does this on the margins of an array (or an\
    \ object that is analogous to an array, such as a data.frame object with numeric\
    \ values only). Applying a function on each row or each column of a table is,\
    \ for example, such an operation. We will limit ourselves to this type of two-dimensional\
    \ operation for now. In Chapter 6, Modifying Rasters and Analyzing Raster Time\
    \ Series, we will see an example of apply involving three dimensions.\n\nSimilar\
    \ to tapply, the first parameter of apply is the object we would like to base\
    \ our calculation on (x), and the third parameter is the function we would like\
    \ to apply (FUN). The second parameter (MARGIN), however, defines the dimension\
    \ across which we would like to apply the function (rather than which subsets\
    \ of the input, as in tapply). For example, the data.frame objects (and matrices,\
    \ which will be introduced in the next chapter) have two dimensions: rows (dimension\
    \ number 1) and columns (dimension number 2). When the input has more than two\
    \ dimensions (such as in a three-dimensional array), we can apply a function on\
    \ the third dimension as well and so on, although having an array of more than\
    \ three dimensions is not common in practice.\n\nLet's return to our iris example\
    \ to see how apply works. Using apply, we can find out the mean measured value\
    \ for each of the five individual plants by averaging the values on the first\
    \ dimension (that is, the rows) as follows:\n\n```\n> apply(iris[, 1:4], 1, mean)\n\
    \    100   45   90   34   38  101\n  3.475 2.800 3.325 2.825 2.500 4.525\n```\n\
    \nWe can also find the mean measured value for each of the four measured traits\
    \ by averaging the values of the second dimension (that is, the columns) as follows:\n\
    \n```\n> apply(iris[, 1:4], 2, mean)\n  Sepal.Length Sepal.Width Petal.Length\
    \ Petal.Width\n    5.5000000   3.3666667    3.1333333    0.9666667\n```\n\nNote\
    \ that we are working only with the numeric part of the iris object (columns 1\
    \ to 4) since the function that we apply (mean) operates on numeric vectors."
  merge: -1
  img_proc: true
- pgno: 98
  md: "We can also pass additional arguments to apply, which will, in turn, be passed\
    \ to the specific function that we apply. For example, the mean function has an\
    \ additional parameter, na.rm, which we can set to FALSE within the apply function\
    \ call. In that case, we will be able to, for example, find out the column means\
    \ excluding the missing values:\n\n```\n> iris[3,2] = NA\n> iris\n    Sepal.Length\
    \ Sepal.Width Petal.Length Petal.Width   Species\n100          5.7        2.8\
    \         4.1        1.3 versicolor\n45           5.1        3.8         1.9 \
    \       0.4 setosa\n90           5.5         NA         4.0        1.3 versicolor\n\
    34           5.5        4.2         1.4        0.2 setosa\n38           4.9  \
    \      3.6         1.4        0.1 setosa\n101          6.3        3.3        \
    \ 6.0        2.5 virginica\n> apply(iris[, 1:4], 2, mean)\nSepal.Length Sepal.Width\
    \ Petal.Length Petal.Width\n    5.5000000        NA     3.1333333    0.9666667\n\
    > apply(iris[, 1:4], 2, mean, na.rm = TRUE)\nSepal.Length Sepal.Width Petal.Length\
    \ Petal.Width\n    5.5000000   3.5400000     3.1333333    0.9666667\n```\n\nHere,\
    \ we first introduced an NA value to our iris table and then applied the mean\
    \ function on the columns, first with the default arguments (na.rm=FALSE) and\
    \ then with na.rm set to TRUE. Note that passing additional arguments can be done\
    \ the same way in tapply as well.\n\n# Inference from tables by joining, reshaping,\
    \ and aggregating\n\nIn this section, you will learn several more advanced operations\
    \ involving tables. These include, in particular, reshaping of tables and joining\
    \ the information from table pairs. The presented methods, together with the ones\
    \ presented earlier, will compose quite a powerful toolbox, which will suffice\
    \ for all table-related operations that you will use in this book. Since you will\
    \ be using functions from contributed packages, you will first learn how to download\
    \ and install them. The following three sections will then introduce functions\
    \ to reshape, aggregate, and join tables, respectively."
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Using contributed packages


    All predefined objects in R (such as the functions and classes we have been using
    so far) are collected in libraries or *packages* (in R terminology). In order
    to use an object defined in a certain package, it first needs to be loaded into
    memory. This is done using the `library` function. So far, we did not use the
    `library` function, so how come we could use all of the functions we have been
    using? The answer is that several packages are distributed with the R installation
    file (~30 of them as of May 2014), and some of them are automatically loaded into
    computer memory when starting R (these are called base R packages); otherwise,
    we will need to load a package into memory if we would like to use its functions.
    For example, if we would like to use graphical functions from the `lattice` package
    (see the previous chapter), which is automatically installed with R, we need to
    execute the following expression first:


    ```

    > library("lattice")

    ```


    The argument for the `library` function is the name of the required package that
    we would like to load.


    By default, the `library` function can also accept package names without parentheses,
    so we can type `library(lattice)` instead of the previous expression.


    In addition to the preinstalled packages, many contributed packages (~5500 as
    of May 2014) are located on the Comprehensive R Archive Network (CRAN), which
    is a network of FTP and web servers storing up-to-date versions of official R
    packages (unofficial packages or packages currently under development are available
    from various other online sources, such as GitHub). To use one of the packages
    on CRAN, we first have to download it to our computer, which can be automatically
    done in R using the `install.packages` function. For example, to install the `reshape2`
    package (which we are going to use shortly), we need to execute the following
    expression:


    ```

    > install.packages("reshape2")

    ```


    Another contributed package we are going to use in this chapter is called `plyr`.
    Thus, it is necessary that you download both `reshape2` and `plyr` (using the
    `install.packages` function for each one) and load them into memory (using the
    `library` function, again for each one) before executing the upcoming examples
    of code.'
  merge: -1
  img_proc: true
- pgno: 100
  md: "# Working with Tables\n\n![](img/ebfd6294770b225fdeceda9a7b8b560e_100_0.png)\n\
    \n> To save space, from now on, the `install.packages` commands will not be written\
    \ as part of the code sections, nor will commands loading packages using `library`\
    \ be replicated in each and every instance the package is used. Instead, every\
    \ time a code section requires a newly contributed package, you should make sure\
    \ the respective package is loaded.\n\nRemember that downloading a package (using\
    \ the `install.packages` function) is a one-time procedure (unless a new version\
    \ of the package came out and we would like to reinstall it). On the other hand,\
    \ loading the package into memory (using the `library` function) is something\
    \ we need to do in each new R session.\n\n![](img/ebfd6294770b225fdeceda9a7b8b560e_100_1.png)\n\
    \n+   Here are a few more tips concerning the installation of packages:\n+   \n\
    +   - Packages installation is also accessible through the menus in both RGui\
    \ and RStudio\n+   - When packages installation is triggered, the user is prompted\
    \ to select one of the CRAN Mirrors to download the package from\n+   - When installing\
    \ a new version of R, all packages will need to be reinstalled\n\n# Shifting between\
    \ long and wide formats using melt and dcast\n\nIn this section, and the following\
    \ one, you are going to learn several useful methods to reshape data. Reshaping\
    \ operations are an inevitable step of every data analysis process since a lot\
    \ (if not most) of the time, data we get to work with will be structured differently\
    \ from what is required to use a given function or type of software. In data reshaping,\
    \ we change the form our data takes (possibly also reducing its amount, by aggregation),\
    \ but not the data itself. An example of a tool used for data reshaping, from\
    \ other software, is the PivotTable tool in Excel."
  merge: -1
  img_proc: true
- pgno: 101
  md: 'The functions we are going to use in this and the upcoming sections belong
    to the contributed packages reshape2 and plyr. There are other ways to perform
    the presented operations in R; some of them use only base packages. However, the
    methods shown here are considered more intuitive and flexible. Introduction to
    these two packages, by their author Hadley Wickham, can be found in the Journal
    of Statistical Software (see Appendix B, Cited References). Note that one of these
    papers addresses the reshape package (rather than the more efficient reshape2
    package, which was developed later), but the principles of reshape and reshape2
    are the same, so the paper is well relevant to reshape2 users. A good introduction
    to data manipulation with R using (mostly) base packages can be found in the excellent
    book Introduction to Data Technologies (2009) by Paul Murrell (which is also available
    online).


    The first operation you are going to learn about is the transformation between
    wide and long formats. A wide table consists of columns for each measured variable.
    For example, our dat table is in a wide format since it has a column for the station
    name, a column for the precipitation amount, a column for the minimum temperature,
    and so on. A long table is one where a single column holds the variable names
    and another holds the measured values. When switching from wide to long formats,
    we will usually be interested in intermediate forms, where some of the variables
    are in columns, and others are identified in a single column holding variables
    names. In reshape2 terminology, the former are called identifier variables (id.vars),
    while the latter are called measured variables (measure.vars). This will become
    clearer using an example.


    The iris dataset we saw earlier is also in a wide format. To convert it to a long
    format, we can use the melt function, which is used to convert wide formats to
    long formats. When using melt, we need to specify the data.frame object to reshape,
    and the identity of the ID and measure variables (as character vectors). In fact,
    we can specify either the ID or measure variables, and the function will assume
    that the rest of the columns belong to the other kind. For example, the most reasonable
    approach in this particular case would be to use the species as an ID variable
    (since it describes each measured unit) and the flower dimensions traits as measure
    variables (since they are independent measurements conducted on each measured
    unit). Let''s take a look at the following example:


    ```

    > library(reshape2)

    > iris_melt = melt(iris, id.vars = "Species")

    ```'
  merge: -1
  img_proc: true
- pgno: 102
  md: "# Working with Tables\n\nThe first several rows of the resulting table are\
    \ printed as follows:\n\n```\n```text\n> head(iris_melt)\n      Species     variable\
    \ value\n1 versicolor Sepal.Length   5.7\n2     setosa Sepal.Length   5.1\n3 versicolor\
    \ Sepal.Length   5.5\n4     setosa Sepal.Length   5.5\n5     setosa Sepal.Length\
    \   4.9\n6  virginica Sepal.Length   6.3\n```\n```\n\nWe can see that the ID variable\
    \ (in this case there was only one, Species) retained its status as one of the\
    \ columns. The rest of the columns, the measure variables (in this case there\
    \ were four), disappeared; instead, two new columns were created (variable and\
    \ value), holding the measure variables names and values, respectively. The number\
    \ of rows is now 24 (four times the original number of rows, six), since the ID\
    \ part is replicated four times, once for each of the measure variables.\n\nSimilarly,\
    \ we can use the melt function to convert the climatic data table dat to a long\
    \ format, specifying that the tpcp, mmxt, and mmnt columns contain measured variables.\
    \ We shall assign it to a different object named dat_melt:\n\n```\n```text\n>\
    \ dat_melt = melt(dat, measure.vars = c(\"tpcp\",\"mmxt\",\"mmnt\"))\n> head(dat_melt)\n\
    \             station station_name elevation latitude longitude\n1 GHCND:SP000060010\
    \       IZANA SP       2371  28.3089  -16.4992\n2 GHCND:SP000060010       IZANA\
    \ SP       2371  28.3089  -16.4992\n3 GHCND:SP000060010       IZANA SP       2371\
    \  28.3089  -16.4992\n4 GHCND:SP000060010       IZANA SP       2371  28.3089 \
    \ -16.4992\n5 GHCND:SP000060010       IZANA SP       2371  28.3089  -16.4992\n\
    6 GHCND:SP000060010       IZANA SP       2371  28.3089  -16.4992\n          date\
    \ month year variable value\n1   1984-01-01     1 1984     tpcp  51.4\n2   1984-02-01\
    \     2 1984     tpcp   0.0\n3   1984-03-01     3 1984     tpcp  68.7\n4   1984-04-01\
    \     4 1984     tpcp  13.6\n5   1984-05-01     5 1984     tpcp  21.4\n6   1984-06-01\
    \     6 1984     tpcp   6.5\n```\n```\n\nWe can check and see that the molten\
    \ table dat_melt has exactly three times more rows than the original table dat."
