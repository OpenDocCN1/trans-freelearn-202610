    # Examining the structure of a data.frame object


    We can get the number of rows and columns in our data.frame object using the nrow
    and ncol functions, respectively. For example, our small table df has four rows
    and three columns, while dat (containing the monthly climatic data) has 28,536
    rows and nine columns:


    ```

    > nrow(df)

    [1] 4

    > ncol(df)

    [1] 3

    > nrow(dat)

    [1] 28536

    > ncol(dat)

    [1] 9

    ```


    We can, if the table is not too long, print the table''s contents and see how
    many columns (or rows) are there, according to the row names. However, it is generally
    advisable to get the properties of an object using functions (such as ncol), rather
    than typing a specific number manually (such as 9). This way, our code is going
    to be transferable to an analysis of any object and not just the specific object
    we are currently working on.


    We can get the lengths of both row and column dimensions using the dim function.
    If our argument is a data.frame object (we will see later that the dim function
    works with other classes as well; such a function is called a generic function
    in R terminology), a vector of length 2 is returned with the first element being
    the number of rows and the second being the number of columns, as follows:


    ```

    > dim(dat)

    [1] 28536     9

    ```'
