  md: 'Here, in plain language, we request the values from -∞ to 0.2 (closed on the
    right by default, thus including 0.2, as in ≤0.2) to be converted to 0, and the
    values from 0.2 to ∞ to be converted to 1.


    # Summary


    In this chapter, we covered the basic methods for working with raster data in
    R. We now know how to import and export raster data to and from the R environment,
    how to examine the raster objects at hand, and how to perform simple calculations
    to modify these objects. We also covered several ways to visually display raster
    data in R.


    The next chapter is going to be very similar in structure and purpose to the present
    one; it''s just that we are going to cover the other main type of spatial data
    – vector layers.'
