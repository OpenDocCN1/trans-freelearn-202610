    In case we do not have any special requirements for the projected dem to align
    with an existing layer, we can follow the first reprojection approach, supplying
    only the CRS and letting the grid be generated automatically. We can also supply
    the optional res argument, primarily to make sure the x and y axes resolution
    will be equal (90 m, for example). You can try and execute the following expression
    without specifying res, to verify that the default grid generated in this case
    will have a resolution of 78 m and 92.4 m on the x and y axes respectively:


    ```

    > dem = projectRaster(from = dem,

