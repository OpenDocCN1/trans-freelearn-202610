- pgno: 65
  md: "We can switch between the character vector and `Date` classes, using the `as.character`\
    \ and `as.Date` functions. For example, we can convert our `Date` object `x` to\
    \ a character vector using `as.character`:\n\n```\n```r\n> x = as.character(x)\n\
    > x\n[1] \"2014-05-22\"\n> class(x)\n[1] \"character\"\n```\n```\n\nWe can convert\
    \ the character vector back to `Date` using `as.Date`:\n\n```\n```r\n> x = as.Date(x)\n\
    > x\n[1] \"2014-05-22\"\n> class(x)\n[1] \"Date\"\n```\n```\n\nWe can create a\
    \ sequence of consecutive dates using `seq`, since this function accepts `Date`\
    \ objects as well:\n\n```\n```r\n> seq(from = as.Date(\"2013-01-01\"),\n+    \
    \ to = as.Date(\"2013-02-01\"),\n+     by = 3)\n [1] \"2013-01-01\" \"2013-01-04\"\
    \ \"2013-01-07\" \"2013-01-10\"\n [5] \"2013-01-13\" \"2013-01-16\" \"2013-01-19\"\
    \ \"2013-01-22\"\n [9] \"2013-01-25\" \"2013-01-28\" \"2013-01-31\"\n```\n```\n\
    \nThis gives us consecutive dates separated by three days from each other, from\
    \ January 1, 2013 to February 1, 2013.\n\nThe latter conversions, from character\
    \ to date, were made possible so easily since the `\"2014-05-22\"` configuration\
    \ is a default one. This way, the `as.Date` function knew that the first four\
    \ characters in `\"2014-05-22\"` represent the *year*, the next two characters\
    \ (following a hyphen) represent the *month*, and the last two characters represent\
    \ the *day*. When we have characters representing a date in a different configuration,\
    \ we need to use the `format` parameter of `as.Date`, where we specify the encoding\
    \ types of the elements, their order, and the characters separating them (if any)."
  merge: -1
  img_proc: true
- pgno: 66
  md: "# Working with Vectors and Time Series\n\nThe common encoding types of the\
    \ year, month, and day elements, and their respective symbols in R, are summarized\
    \ in the following table:\n\n| Symbol | Meaning |\n|---|---|\n| `%d` | Day (for\
    \ example, 15) |\n| `%m` | Months in number (for example, 08) |\n| `%b` | The\
    \ first three characters of a month (for example, Aug) |\n| `%B` | The full name\
    \ of a month (for example, August) |\n| `%y` | The last two digits of a year (for\
    \ example, 14) |\n| `%Y` | The full year (for example, 2014) |\n\nUsing this symbology,\
    \ along with the format parameter of the `as.Date` function, we can convert character\
    \ values of other formats to dates. Let’s take a look at the following examples:\n\
    \n```\n> as.Date(\"07/Aug/12\")\nError in charToDate(x) :\n  character string\
    \ is not in a standard unambiguous format\n> as.Date(\"07/Aug/12\", format = \"\
    %d/%b/%y\")\n[1] \"2012-08-07\"\n> as.Date(\"2012-August-07\")\nError in charToDate(x)\
    \ :\n  character string is not in a standard unambiguous format\n> as.Date(\"\
    2012-August-07\", format = \"%Y-%B-%d\")\n[1] \"2012-08-07\"\n```\n\nIn each of\
    \ these two example pairs, the first expression resulted in an error since we\
    \ were trying to convert a character value of a non-standard date format to a\
    \ `Date` without specifying the format, while the second expression worked since\
    \ we did specify the format.\n\nOnce we have a `Date` object, we can extract one\
    \ or two (or all) of its three elements (year, month, and day), and encode them\
    \ as we wish using the `format` function, specifying the required format the same\
    \ way as shown earlier. Note that the results are no longer `Date` objects, but\
    \ character vectors:\n\n```\n> d = as.Date(\"1955-11-30\")\n> d\n[1] \"1955-11-30\"\
    \n> format(d, \"%d\")\n[1] \"30\"\n> format(d, \"%B\")\n```"
  merge: -1
  img_proc: true
