- pgno: 244
  md: '# Combining Vector and Raster Datasets


    We now have a polygonal layer named `forests`, with two features delineating the
    Lahav and Kramim forests, named accordingly in the attribute table. In the next
    section, we will proceed with extracting the NDVI data for these forests.


    # Extracting raster values based on vector layers


    So far, we have covered operations to transform a vector layer to a raster and
    vice versa. The third operation involving vector layers and rasters, and the focus
    of this final section, is the extraction of raster values according to vector
    layers. We are often interested in reducing or summarizing raster data using point,
    line, or polygon features, which is when this operation comes in handy. For example,
    we may wish to calculate the elevation profile covered by a GPS track (raster-to-line
    extraction) or the average NDVI of a given forest (raster to polygon extraction).
    In this section, we will see two examples involving extraction by points and extraction
    by polygons.


    # Extracting by points


    Extraction of raster values, according to a vector layer of any kind, can be done
    with the `extract` function. The first two parameters of this function are as
    follows:


    +   - The raster whose values are to be extracted (x)

    +   - The object (usually a vector layer) defining the locations to extract values
    (y) from


    When extracting values according to points, which is the simplest extract scenario,
    the returned object may be either of the following:


    +   - *Vector* — when extracting values from a single band raster

    +   - *Matrix* — when extracting values from a multiband raster


    As an example of extracting single band raster values to points, we will use the
    `spain_stations.csv` file we previously created (see *Chapter 3, Working with
    Tables*), which contains a table with the spatial location records of 96 meteorological
    stations in Spain. We will create a `SpatialPointsDataFrame` object based on this
    table, and then use it to extract elevation values from a DEM of Spain. The DEM
    will be obtained from a file (available on the book''s website) named `spain_elev.tif`.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'First, we will read the DEM file into R. This file, by the way, was created
    by merging SRTM tiles downloaded with `getData`—exactly as we did to create the
    Haifa DEM in the previous chapter—followed by reprojection, masking, and aggregation
    to a 900 meter resolution.


    ```

    > dem_spain = raster("C:\\Data\\spain_elev.tif")

    ```


    Now, we will read the station records from `spain_stations.csv`:


    ```

    > stations = read.csv("C:\\Data\\spain_stations.csv",

    + stringsAsFactors = FALSE)

    ```


    As you remember, the station locations are stored in the longitude and latitude
    columns; therefore, the data.frame object can be promoted to a SpatialPointsDataFrame
    object as follows:


    ```

    > coordinates(stations) = ~ longitude + latitude

    ```


    The station coordinates are given in degrees according to a geographic CRS. Therefore,
    we will define this CRS, and then reproject `stations` to match the CRS of `dem_spain`
    (UTM zone 30N) as follows:


    ```

    > proj4string(stations) = CRS("+proj=longlat +datum=WGS84")

    > stations = spTransform(stations, CRS(proj4string(dem_spain)))

    ```


    Let''s plot stations on top of dem_spain to see that they indeed match in location:


    ```

    > plot(dem_spain)

    > plot(stations, add = TRUE)

    ```'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'The graphical output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_246_0.png)


    What we see here is the elevation map of Spain (the `dem_spain` raster), with
    station locations on top (`stations` point layer). The stations seem to cover
    the whole area of the country, more or less evenly. Note that some of the stations
    are not shown since they are located on the Canary Islands and thus they are beyond
    the scope of the `dem_spain` raster.


    To extract the elevation values underlying each station, we employ the `extract`
    function with the raster and the points as the first two arguments, respectively.
    Since the returned object is going to be a numeric vector with the respective
    elevation values for each station, we can directly assign it to a new column in
    `stations` named `elev_dem`:


    ```

    > stations$elev_dem = extract(dem_spain, stations)

    ```'
  merge: -1
  img_proc: true
- pgno: 247
  md: "Examining the attribute table of `stations` shows that now we have two elevation\
    \ entries per station. These are the elevation values originally provided along\
    \ with the meteorological records (the `elevation` column) and the elevation values\
    \ we just obtained from the DEM (the `elev_dem` column):\n\n```\n```r\n> head(stations@data)\n\
    \          station elevation elev_dem\n1 GHCND:SP000003195       667   651.96\n\
    2 GHCND:SP000004452       185   184.24\n3 GHCND:SP000006155         7     5.80\n\
    4 GHCND:SP000008027       251   212.44\n5 GHCND:SP000008181         4     3.55\n\
    6 GHCND:SP000008202       790   787.28\n```\n```\n\nExamining this table more\
    \ closely will show that some of the stations were assigned with NA in the `elev_dem`\
    \ column either since they are located near Spain's border (and incidentally outside\
    \ the DEM scope) or since they are located in the Canary Islands (which the `dem_spain`\
    \ raster does not cover at all).\n\nIt would be interesting to see the degree\
    \ of agreement between the two sources of information by plotting one vector as\
    \ a function of the other:\n\n```\n```r\n> plot(elev_dem ~ elevation, stations,\n\
    + xlim = c(0, 2000),\n+ ylim = c(0, 2000),\n+ xlab = \"Elevation from station\
    \ record (m)\",\n+ ylab = \"Elevation from DEM (m)\")\n```\n```\n\n> Note that\
    \ the plot(elev_dem~elevation, stations) expression is analogous to plot(stations$elev_dem~stations$elevation).\
    \ In the latter syntax, the vector names are provided explicitly; while in the\
    \ former (often more convenient), the formula addresses columns from a `data.frame`\
    \ object, provided as a second argument.\n\nTo make the assessment more convenient,\
    \ we will also use the `abline` function that can add a straight line to an existing\
    \ plot. One way of specifying the line's location is providing its intercept (a)\
    \ and slope (b). We are going to add a 1:1 line (that is, a line with an intercept\
    \ of 0 and a slope of 1), in order to see how well the `elevation` and `elev_dem`\
    \ records match:\n\n```\n```r\n> abline(a = 0, b = 1, lty = \"dotted\")\n```\n\
    ```"
  merge: -1
  img_proc: true
