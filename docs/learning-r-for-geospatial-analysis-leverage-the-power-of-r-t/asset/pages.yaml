  md: "```\n```r\n> head(states_f)\n      long      lat order  hole piece     group\
    \       id\n1 1076104 -1034268     1 FALSE     1 Alabama.1 Alabama\n2 1085410\
    \ -1033146     2 FALSE     1 Alabama.1 Alabama\n3 1093749 -1031892     3 FALSE\
    \     1 Alabama.1 Alabama\n4 1107308 -1030032     4 FALSE     1 Alabama.1 Alabama\n\
    5 1108666 -1029851     5 FALSE     1 Alabama.1 Alabama\n6 1112841 -1029288   \
    \  6 FALSE     1 Alabama.1 Alabama\n```\n```\n\nTo plot a spatial layer created\
    \ with `fortify` (either lines, as we shall see later, or polygons), we need to\
    \ map the x and y aesthetics to the long and lat columns, respectively. In addition,\
    \ we need to map the group column to the group aesthetic so that each geometry\
    \ will be drawn separately. For example, the California feature is composed of\
    \ several geometries (the mainland plus several islands in the Pacific Ocean),\
    \ and ggplot needs to know which points form separate polygons according to the\
    \ group column (\"California.1\", \"California.2\", and so on). If we want to\
    \ give certain aesthetics to each state, we can do that using the id column (where\
    \ all California polygons share the \"California\" label).\n\n> > The group aesthetic\
    \ can also be implemented in nonspatial layers and in layers other than `geom_polygon`.\
    \ It is used to identify individual geometries in order to draw them separately,\
    \ when no other aesthetic (such as colour or fill) does the job. For example,\
    \ in the following screenshot, we do not want each geometry (such as each island\
    \ of California) to have a unique appearance, but we still want these geometries\
    \ to be drawn separately rather than with a line going through all of them by\
    \ one. Try removing the `group=group` part from the following expression and you\
    \ will see what a mess the result is. You can also try `group=id` to see that\
    \ it messes up only those states that are composed of more than one geometry,\
    \ where grouping by the group column is indeed essential.\n\n![](img/ebfd6294770b225fdeceda9a7b8b560e_315_0.png)\n\
    \nAnother helpful feature we will experiment with in the present example is to\
    \ save a collection of the ggplot2 components in order to integrate them in several\
    \ plots and not have to type the expressions each time. We will create an object\
    \ named `sp_minimal`, defining our own custom theme (based on `theme_bw`, with\
    \ the axis name, labels, and tick marks removed):\n\n```\n```r\n> sp_minimal =\n\
    + theme_bw() +\n+ theme(axis.text = element_blank(),\n+ + axis.title = element_blank(),\n\
    + + axis.ticks = element_blank())\n```\n```"
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Advanced Visualization of Spatial Data


    Before we plot county densities, we will start with a simpler example—drawing
    just the states_f layer—to see how spatial polygon layers are drawn in ggplot2:


    ```

    ```r

    > ggplot() +

    + geom_polygon(data = states_f,

    + aes(x = long, y = lat, group = group),

    + colour = "black", fill = NA) +

    + coord_equal() +

    + sp_minimal

    ```

    ```


    A map of the states is produced as follows:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_316_0.png)


    As you can see in the previous syntax, the polygons are drawn using geom_polygon
    according to the long, lat, and group data columns (mapped to the x, y, and group
    aesthetics, respectively), with the colour and fill polygons set to constant values
    ("black" for colour and NA for fill, respectively; this means empty polygons with
    black borders). The other two plot elements are coord_equal (which makes sure
    the 1:1 aspect ratio is maintained) and the sp_minimal theme we just defined.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'Now, we will make things slightly more complicated by plotting both the states_f
    and county_f layers together. Let''s first view the code and output. Afterwards,
    we will discuss the different components involved. Here''s the code that produces
    a county population density map:


    ```

    > ggplot() +

    + geom_polygon(data = county_f,

    + colour = NA,

    + aes(x = long, y = lat, group = group, fill = density)) +

    + geom_polygon(data = states_f,

    + colour = "white", size = 0.25, fill = NA,

    + aes(x = long, y = lat, group = group)) +

    + scale_fill_gradientn(

    + name = expression(paste("Density (",km^-2,")")),

    + colours = rev(rainbow(7)),

    + trans = "log10",

    + labels = as.character,

    + breaks = 10^(-1:5)) +

    + coord_equal() +

    + sp_minimal

    ```


    The following screenshot shows how the resulting plot looks:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_317_0.png)'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'Reading the preceding code reveals, first of all, that the plot is made by
    combining the following five components:


    +   - `geom_polygon` (with `county_f`)

    +   - `geom_polygon` (with `states_f`)

    +   - `scale_fill_gradientn`

    +   - `coord_equal`

    +   - `sp_minimal`


    The two `geom_polygon` layers, representing "states" and `county` layers, are
    drawn differently according to our needs in this visualization. The first thing
    to note about these layers is their order of appearance: the `county_f` layer
    is added before `states_f`. This is not a coincidence; the layers are drawn on
    the screen in the same order in which they are provided in the code. Since state
    and county borders obviously overlap, and we wish to draw the states borders on
    top of the counties borders (otherwise the states borders will not be visible),
    it is important to specify the layers in the right order.


    The `states_f` layer arguments are identical to those in the previous example;
    except that, we made the polygon borders white (with `colour="white"`) and thin
    (with `size=0.25`). As for the `county_f` layer, the color of the borders (rather
    than `fill`) was set to `NA`, resulting in borderless polygons, and `fill` was
    mapped to `density`. The latter is indeed the defining feature of the map we made:
    mapping the `county_f` polygons `fill` aesthetic to `density` is what gives different
    population densities different colors, and that was the whole purpose of making
    this plot.


    We mapped `fill` to `density`, but which color gets assigned to which density
    level? As already mentioned, the `scale` function determines the way values in
    the data are matched with the aesthetic appearance. So unless we are happy with
    the default scale (which is frequently not the case), we have to set the scale
    characteristics ourselves. For example, we already used `scale_colour_discrete`
    in the forests NDVI time series example (applicable for discrete variables). In
    the present example, the `scale_fill_gradientn` function, as the name suggests,
    was used to set the `fill` scale type to `gradientn`. The latter is just one out
    of several possible `fill` scale types (applicable to the `colour` aesthetic as
    well; see `http://docs.ggplot2.org/` for a complete list). For continuous variables,
    `ggplot2` offers three types of color scales, which can be specified using the
    following functions:'
  merge: -1
  img_proc: true
- pgno: 319
  md: '+   - `scale_fill_gradient`: A two-color gradient, with the gradient end colors
    specified with `high` and `low` (see the Haifa buildings density example later
    in this chapter)

    +   - `scale_fill_gradient2`: A three-color gradient, with the `low`, `med`, and
    `high` colors specified (see the London buildings distance to river example later
    in this chapter)

    +   - `scale_fill_gradientn`: A custom n-color gradient, specified with a `colours`
    vector


    There are several ways to create a vector of colors in R to be supplied to the
    `colours` parameter of `scale_colour_gradientn` as well as to other graphical
    functions. The simplest way, which we used in the present example, is to employ
    one of the predefined color palette functions that can take a numeric value as
    an argument and produce a series of colors (returned as RGB codes) at equal intervals.
    These functions can be used for many purposes:


    +   - `rainbow`

    +   - `heat.colors`

    +   - `terrain.colors`

    +   - `topo.colors`

    +   - `cm.colors`


    In the examples in this chapter, we employ `rainbow` and `terrain.colors`. You
    are welcomed to experiment with the other three palettes to see what they look
    like. The color codes these functions return are rarely useful in their own right.
    Instead, they are passed as color palettes to graphical functions such as `scale_colour_gradientn`.


    ```

    > rainbow(3)

    [1] "#FF0000FF" "#00FF00FF" "#0000FFFF"

    ```


    In cases when you have a different palette in mind which is not covered by these
    functions, you can use the RColorBrewer package (which provides many more palettes)
    or the `colorRampPalette` function available in base R (which can be used to create
    custom-made color palettes; see the last example in this chapter).


    A short explanation of the arguments of the `scale_fill_gradientn` function we
    used is in order:


    +   - `name=expression(paste("Density (",km^-2", ")"))`: The name argument specifies
    the scale name and the way it will appear on the plot legend. We once again used
    the `expression` function, this time to add -2 in superscript (see the preceding
    screenshot).'
  merge: -1
  img_proc: true
- pgno: 320
  md: '+   - `colours=rainbow(7)`: Specifies the vector of colors to create a color
    palette with. Here, specifying seven colors gives a good result, with the whole
    variability the rainbow palette provides represented. It may require trial and
    error to find out how many colors are sufficient in each case.

    +   - `trans="log10"`: The trans parameter can be passed to any continuous scale
    function in ggplot2. It is used to specify a mathematical transformation for the
    data. In this particular example, we use a logarithmic scale ("log10") to highlight
    the differences in the population density between different counties, which is
    necessary since the distribution of county densities is highly nonhomogeneous,
    with many low-density counties and few high-density counties. You can try deleting
    the `trans`, `labels`, and `breaks` arguments, and running the previous code once
    more to see why the default linear scale is inappropriate in this case. There
    are many useful built-in types of transformations, as well as methods to define
    custom transformations but this is beyond the scope of this book.

    +   - `labels=as.character` and `breaks=10^(-1:5)`: The breaks argument specifies
    the breakpoints where tick marks and labels are generated, while the labels argument
    specifies the labels themselves or (as in this case) a function to format the
    labels with. In this case, by default, R prints the `10^(-1:5)` labels vector
    in mathematical notation (`1e-01`, `1e+00`, `1e+01`, and so on). This is evaded
    by converting the numeric values to characters (using `as.character`) to receive
    more comprehensive labels (`0.1`, `1`, `10`, and so on).


    The last two components in the code section that produces the preceding plot—`coord_equal`
    and `sp_minimal`—were already used in the previous plot, so we will not repeat
    their meaning here.


    Finally, referring to the plot itself, we can see the concentration of densely
    populated counties in the eastern half of the USA and along the coast of the Pacific
    Ocean. Further inland in the Western USA, population density is generally low.


    Moving on to the second type of spatial data structure, a raster, we are going
    to experiment with different variations of the Haifa DEM map in the following
    few examples. As the data source, we will take the dem and hill rasters (see *Chapter
    6, Modifying Rasters and Analyzing Raster Time Series*). Data from these two rasters
    will be transferred into a single `data.frame` object with four columns: cell
    coordinates (x and y), elevation value (elev), and hillshade value (hill). Note
    that in this case, we use the `data.frame` function to do this, supplying the
    coordinates and the vector of values from each raster separately (relying on the
    fact that the two rasters are geometrically identical, since `hill` was derived
    from `dem`). An equally good approach would have been to stack the two rasters
    and then convert the result to a `data.frame` object with `as.data.frame(...,
    xy=TRUE)`:'
  merge: -1
  img_proc: true
- pgno: 321
  md: "```\n> dem_hill = data.frame(coordinates(dem),\n+ elev = dem[],\n+ hill = hill[])\n\
    > dem_hill = dem_hill[complete.cases(dem_hill), ]\n> head(dem_hill)\n        \
    \  x        y elev      hill\n2421 698971.3 3648863   19 0.3533017\n2422 699061.3\
    \ 3648863   20 0.3408402\n2423 699151.3 3648863   19 0.3402018\n2424 699241.3\
    \ 3648863   19 0.3451085\n2425 699331.3 3648863   20 0.3439193\n2426 699421.3\
    \ 3648863   21 0.3368811\n```\n\nNow that we have the dem_hill table, we can plot\
    \ the data using a geom_raster layer. The geom_raster function requires the x,\
    \ y, and fill aesthetics to draw a raster, as the following code and images demonstrate.\
    \ In addition, since we are going to make several versions of the Haifa DEM plot,\
    \ it would be best to save this basic plot as a ggplot object (hereby named haifa_relief)\
    \ so that we can later update it by incorporating additional layers:\n\n```\n\
    > haifa_relief = ggplot(dem_hill, aes(x = x, y = y)) +\n+ geom_raster(aes(fill\
    \ = elev)) +\n+ scale_fill_gradientn(\"Elevation (m)\",\n+ colours = terrain.colors(10))\
    \ +\n+ coord_equal() +\n+ theme_bw() +\n+ theme(axis.title = element_blank(),\n\
    + axis.text.y = element_text(angle = 90, hjust = 0.5))\n> haifa_relief\n```\n\n\
    The syntax being used is analogous to the previous example, except that we use\
    \ geom_raster instead of geom_polygon; x and y are mapped to spatial coordinates,\
    \ while fill is mapped to raster values. Note that geom_raster takes aes(fill=elev)\
    \ as an argument, while the missing parts (data, x, and y) are passed, by default,\
    \ from the ggplot set of arguments. As we shall see right away, this mode of operation\
    \ is very convenient when we would like to add another layer (in this case, the\
    \ hillshade) with the same arguments so that we do not have to type them once\
    \ again. The theme components this time specify that the y axis labels should\
    \ be rotated by 90° (which is often used in maps). The resulting plot is shown\
    \ on the left panel in the following screenshot. Note that the color scale used\
    \ (terrain.colors) is particularly useful to display the topography."
  merge: -1
  img_proc: true
- pgno: 322
  md: 'Now that we have our basic relief image, we can experiment with various additional
    components that we may wish to show on top of it. For instance, the hillshade
    calculation gave us a layer of theoretical shading degree for the given topography
    and sun position (see Chapter 6, Modifying Rasters and Analyzing Raster Time Series).
    We can add the shading values as an all-black raster with various levels of transparency
    (making the shaded areas less transparent and thus darker). This will create an
    illusion of a three-dimensional image, which is also known as a shaded relief
    in cartography. To create shading, we need to add another raster layer with black
    pixels whose transparency aesthetic is mapped to the hill values. Transparency,
    in ggplot2 as well as in other graphical functions in R, is determined by a parameter
    named alpha, ranging from 0 to 1, with 0 being completely transparent and 1 being
    completely opaque. Limiting the maximum of the alpha scale to 0.5, using the range
    parameter makes sure we do not get completely black pixels in heavily shaded areas:


    ```

    > haifa_relief_shade = haifa_relief +

    + geom_raster(aes(alpha = hill), fill = "black") +

    + scale_alpha_continuous("Hillshade", range = c(0.5, 0))

    > haifa_relief_shade

    ```


    The resulting plot is shown on the right panel in the following screenshot. Viewing
    the two images side by side demonstrates the effect that shading has.


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_322_0.png)'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'Talking about topography, another feature we may wish to add to this plot is
    contour lines. We already calculated contour lines from rasters both indirectly
    (displaying them using levelplot, in Chapter 4, Working with Rasters, for instance)
    and directly (creating a contour lines layer with rasterToContour, in Chapter
    7, Combining Vector and Raster Datasets). Here, we are looking at yet another
    indirect way to calculate contour lines based on a raster using ggplot2. To add
    a contour lines layer, we can use the geom_contour function, mapping its z aesthetic
    to elevation so that contour lines are calculated according to it:


    ```

    > haifa_relief_shade +

    + geom_contour(aes(z = elev), colour = "black", alpha = 0.3)

    ```


    The following screenshot shows the graphical output that is produced, showing
    semi-transparent contour lines on top of the shaded relief of Haifa:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_323_0.png)'
  merge: -1
  img_proc: true
- pgno: 324
  md: "In the previous example, we generated a contour plot based on the values of\
    \ an existing raster (the Haifa DEM in this case). Another common type of plot\
    \ showing contours is one where contours denote the average density of events\
    \ in a point pattern. Creating density contours is a common way to reduce the\
    \ amount of information and make point pattern visualization more comprehensible.\
    \ For example, when we have so many points that they overlap each other, it may\
    \ be difficult to discern denser and sparser locations. Drawing contours is one\
    \ possible solution to this problem.\n\nA commonly used procedure to create density\
    \ contours out of a point pattern is two-dimensional kernel density estimation,\
    \ available through the base R function named kde2d. The geom_density2d function\
    \ is a ggplot2 adaptation of the latter function, creating contours out of a density\
    \ surface calculated with kde2d.\n\nAs an example of geom_density2d, we will draw\
    \ contours showing the average density of buildings in Haifa.\n\n> It should be\
    \ noted that, in practice, density estimation is only meaningful for mapped point\
    \ patterns, that is, point patterns where all events in the studied area have\
    \ been detected. When detection is incomplete, density estimates will obviously\
    \ be biased to an unknown degree in each location. In our case, for example, if\
    \ the OpenStreetMap layer of Haifa buildings is incomplete, then a density estimate\
    \ based on it will not be very useful as it will encompass underestimation to\
    \ an unknown and variable degree.\n\nSince density estimation requires a point\
    \ pattern, we need to convert the buildings layer to a point layer by finding\
    \ building centroids:\n\n```\n> haifa_buildings_ctr = gCentroid(haifa_buildings,\
    \ byid = TRUE)\n> haifa_buildings_ctr = as.data.frame(haifa_buildings_ctr)\n>\
    \ head(haifa_buildings_ctr)\n      x       Y\n1 684013.4 3629679\n2 688023.0 3629752\n\
    3 687645.0 3627410\n4 685913.9 3631217\n5 683144.4 3633649\n6 683515.3 3628980\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 325
  md: 'Taking the haifa_relief_shade plot, we will now add both the buildings point
    pattern (using geom_point) and the density contours based on that pattern (using
    geom_density2d). Using the limits parameter of scale_x_continuous and scale_y_continuous,
    we will also limit our scope to a window centered at haifa_buildings_ctr. In addition,
    the colour aesthetic of the contours is mapped to ..level.., which corresponds
    to the contour breaks. The level variable is surrounded by .., which is a special
    way to signal to ggplot2 that we are referring to a variable generated by the
    layer itself, rather than a variable present in data.frame:


    ```

    > haifa_relief_shade +

    + geom_contour(aes(z = elev), colour = "black", alpha = 0.3) +

    + geom_point(data = haifa_buildings_ctr, size = 0.5) +

    + geom_density2d(data = haifa_buildings_ctr,

    + aes(colour = ..level..)) +

    + scale_colour_gradient("Density", low = "blue", high = "red") +

    + scale_x_continuous(

    + limits = c(min(haifa_buildings_ctr$x)-2000,

    + max(haifa_buildings_ctr$x)+2000)) +

    + scale_y_continuous(

    + limits = c(min(haifa_buildings_ctr$y)-2000,

    + max(haifa_buildings_ctr$y)+2000))

    ```


    The following screenshot shows the graphical output:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_325_0.png)'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'In the preceding screenshot, we see three different legends as there are three
    different scales: elevation, hillshade, and buildings density. According to this
    map (again, assuming that all buildings have been mapped), we can see that the
    highest density of individual buildings per unit area is found on the eastern
    slopes of Mount Carmel.


    Our final example in this section will be to plot the time series of interpolated
    standardized temperature maps, which we created in the previous chapter. We already
    took the trouble of reshaping the data into a tidy table; therefore, we do not
    need to take any preliminary processing steps. Using the spainT table and the
    following code section, we recreate a plot similar to the rasterVis version from
    the previous chapter with ggplot2:


    ```

    > ggplot(spainT, aes(x = x, y = y, fill = value)) +

    + geom_raster() +

    + scale_fill_gradient2(

    + expression(paste("Value (", degree, "C)")),

    + low = "blue", high = "red", limits = c(-4,4)) +

    + geom_contour(

    + aes(z = value),

    + colour = "black", size = 0.1, breaks = c(-4:-1,1:4)) +

    + coord_equal() +

    + facet_grid(variable ~ year) +

    + sp_minimal

    ```


    The following screenshot shows the graphical output:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_326_0.png)'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'Note that we have once again utilized our `sp_minimal` custom-made theme to
    eliminate the axis annotation. The `geom_contour` function has been used to generate
    contour lines, similar to the Haifa DEM elevation contours, only that now we specified
    the exact vector of breaks, specifying where contour lines will be generated.
    Using `facet_grid(variable~year)`, we arranged the facets in rows according to
    `variable` and in columns according to `year`.


    # Adding static maps from the Web


    Nowadays, cartographers and spatial analysts are lucky to have a variety of online
    resources for map creation. We already used freely available satellite imagery,
    DEMs, and administrative border datasets, for example. However, to recover and
    process such datasets is not always a quick and straightforward task. We may need
    to figure out the spatial location in question, search for available resources,
    import them into R, and so on. On the other hand, several applications, such as
    Google Maps and OpenStreetMap, provide readily available maps of the entire earth
    with a variety of features that can be unreasonable to collect ourselves each
    time we want to create a background for a quick visualization (satellite and aerial
    imagery, roads, borders, town names, and so on).


    The `ggmap` package is an extension to `ggplot2`, providing a simple interface
    to download static maps from such online resources and easily incorporate them
    as the background when creating maps within the `ggplot2` framework. We already
    used the `ggmap` package for geocoding (see Chapter 5, *Working with Points, Lines,
    and Polygons*), and mentioned the introductory paper on this package by Kahle
    and Wickham (2013).


    > By static maps, we refer to maps that cannot be manipulated by scrolling, zooming
    in and zooming out, and so on, as opposed to dynamic maps that respond to such
    user feedback. The whole `ggplot2` framework, in that sense, may be referred to
    as static plotting. It should be noted that dynamic plots and maps (and even entire
    web applications; see the `shiny` package) can also be produced in R. As for dynamic
    maps, for instance, we have already seen a short example of using the Google Earth
    software as a platform for dynamic spatial data display from R using the `plotKML`
    package (see Chapter 4, *Working with Rasters*). Another example is the `plotGoogleMaps`
    package, which can be used to display spatial data from R on top of interactive
    Google Maps in a web browser.'
  merge: -1
  img_proc: true
- pgno: 328
  md: "The static maps incorporation with ggmap is quite simple in practice. Using\
    \ the get_map function of the ggmap package, we first need to download the required\
    \ background image. Then, we can use that image as a background layer with the\
    \ ggmap function of the same package. Any additional layers and components can\
    \ be added to the plot initiated with ggmap the same way as to a plot initiated\
    \ with ggplot.\n\nOur first example featuring ggmap will be to display the City\
    \ of London buildings and their distances to the River Thames, as promised in\
    \ Chapter 5, Working with Points, Lines, and Polygons. Since layers obtained with\
    \ ggmap are always defined in a geographical CRS, we must first reproject the\
    \ two relevant layers that we will plot to such a CRS as well. The layers we are\
    \ going to plot, in this case, are as follows:\n\n+   - buildings: City of London\
    \ buildings\n+   - city: City of London boundary polygon\n\nThe following expressions\
    \ reproject these layers and save them as new objects buildings_geo and city_geo,\
    \ respectively:\n\n```\n> buildings_geo = spTransform(buildings,\n+ CRS(\"+proj=longlat\
    \ +datum=WGS84\"))\n> city_geo = spTransform(city,\n+ CRS(\"+proj=longlat +datum=WGS84\"\
    ))\n```\n\nTo specify the location for which we would like to download a map with\
    \ get_map, we can use the coordinates of the buildings layer centroid, obtained\
    \ in the following manner:\n\n```\n> buildings_ctr = coordinates(gCentroid(buildings_geo))\n\
    > buildings_ctr\n      x        y\n1 -0.09222641 51.51499\n```\n\nNext, we will\
    \ fortify the buildings_geo layer, to make the data available in the form of a\
    \ data.frame object. The region in this case is the osm_id attribute table column,\
    \ which holds unique building identifiers:\n\n```\n> buildings_f = fortify(buildings_geo,\
    \ region = \"osm_id\")\n> head(buildings_f)\n      long      lat order hole piece\
    \      group        id\n1 -0.09962729 51.51428     1 FALSE     1 100684524.1 100684524\n\
    2 -0.09952849 51.51429     2 FALSE     1 100684524.1 100684524\n3 -0.09942449\
    \ 51.51429     3 FALSE     1 100684524.1 100684524\n4 -0.09941299 51.51424   \
    \  4 FALSE     1 100684524.1 100684524\n5 -0.09951839 51.51423     5 FALSE   \
    \  1 100684524.1 100684524\n6 -0.09961579 51.51422     6 FALSE     1 100684524.1\
    \ 100684524\n```"
  merge: -1
  img_proc: true
- pgno: 329
  md: "Similar to what we saw in the county example, `fortify` removes the attribute\
    \ table; therefore, we need to attach it back manually:\n\n```\n```r\n> colnames(buildings_f)[which(colnames(buildings_f)\
    \ == \"id\")] =\n+ \"osm_id\"\n> buildings_f = join(buildings_f, buildings@data,\
    \ \"osm_id\")\n> head(buildings_f)\n         long      lat order hole piece  \
    \      group    osm_id\n1 -0.09962729 51.51428     1 FALSE     1 100684524.1 100684524\n\
    2 -0.09952849 51.51429     2 FALSE     1 100684524.1 100684524\n3 -0.09942449\
    \ 51.51429     3 FALSE     1 100684524.1 100684524\n4 -0.09941299 51.51424   \
    \  4 FALSE     1 100684524.1 100684524\n5 -0.09951839 51.51423     5 FALSE   \
    \  1 100684524.1 100684524\n6 -0.09961579 51.51422     6 FALSE     1 100684524.1\
    \ 100684524\n             name type dist_river\n1 Temple Bar <NA> 378.7606\n2\
    \ Temple Bar <NA> 378.7606\n3 Temple Bar <NA> 378.7606\n4 Temple Bar <NA> 378.7606\n\
    5 Temple Bar <NA> 378.7606\n6 Temple Bar <NA> 378.7606\n```\n```\n\nAs the output\
    \ shows, each building is now, once again, associated with a `dist_river` value.\n\
    \nFinally, we will `fortify` the `city_geo` polygon as well. Since there is no\
    \ attribute data of interest along with it, we do not have to join anything to\
    \ the resulting data frame object in this case:\n\n```\n```r\n> city_f = fortify(city_geo,\
    \ region = \"CTYUA13NM\")\n> head(city_f)\n         long      lat order hole piece\
    \                group\n1 -0.09671385 51.52319     1 FALSE     1 City of London.1\n\
    2 -0.09669776 51.52316     2 FALSE     1 City of London.1\n3 -0.09664868 51.52317\
    \     3 FALSE     1 City of London.1\n4 -0.09662369 51.52318     4 FALSE     1\
    \ City of London.1\n5 -0.09646984 51.52282     5 FALSE     1 City of London.1\n\
    6 -0.09601742 51.52295     6 FALSE     1 City of London.1\n\n                \
    \   id\n1 City of London\n2 City of London\n3 City of London\n4 City of London\n\
    5 City of London\n6 City of London\n```\n```"
  merge: -1
  img_proc: true
- pgno: 330
  md: 'Examining the group column in this particular case will reveal that it has
    the same value ("city of London.1") in all rows since the city layer is composed
    of a single polygon.


    The layers are ready. What is left to be done is download the background and produce
    the map. To download the background, we will employ the get_map function. In order
    to efficiently work with this function, we need to provide arguments for just
    these three parameters:


    +   - location: The center of the map to be downloaded, which can be a longitude/latitude
    pair.


    +   - maptype: The type of map to be downloaded. This is source-specific, but
    for Google Maps (the default data source), "terrain", "satellite", "roadmap",
    and "hybrid" are applicable. See the following screenshot for an example of a
    "hybrid" map; for a "satellite" example, see the screenshot after the following
    screenshot.


    > The default data source, and the one we use here, is Google Maps. Note that
    the Google Static Maps API is used by get_map to download the images in such cases,
    and that by using this function, you are agreeing to the Google Maps API Terms
    of Service (https://developers.google.com/maps/terms). Other data sources can
    be selected by modifying the source parameter of get_map, with possible sources
    being Google Maps ("google"), OpenStreetMap ("osm"), Stamen Maps ("stamen"), or
    CloudMade maps ("cloudmade"). See ?get_map for details.


    +   - zoom: The zoom level; an integer between 3 and 21 (the default value is
    10). The best zoom value for a given map is determined by trying higher or lower
    magnifications and examining the result.


    In our case, to get a static map of the City of London composed of a photographic
    map with roads and other features marked on top (a "hybrid" map), we can use the
    following expression:


    ```

    > city_map = get_map(location = buildings_ctr,

    + maptype = "hybrid",

    + zoom = 14)

    ```'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'Now, plotting this map on its own (to inspect the zoom argument''s effect,
    for instance) can be done by simply typing `ggmap(city_map)`, that returns a ggplot
    object by default, plotted in the graphical window – as we have already seen earlier.
    However, to add our supplementary layers based on the `buildings_f` and `city_f`
    objects, we need to incorporate them using two `geom_polygon` function calls.
    A few minor settings are also introduced in this particular example, which are
    as follows:


    +   - To use muted colors, for a prettier color scale, the `muted` function of
    the `scales` package is being used

    +   - Forcing the legend heading `"Distance to river (m)"` to be split over two
    lines is achieved using the new line symbol `\n`

    +   - The `labs` function is used to easily modify axis titles, instead of modifying
    the scale itself with the `scale` functions


    The code to produce the City of London buildings map appears as follows:


    ```

    ```r

    library(scales)

    ggmap(city_map) +

    + geom_polygon(data = buildings_f,

    + aes(x = long, y = lat, group = group,

    + fill = dist_river),

    + size = 0.1, colour = "black") +

    + geom_polygon(data = city_f,

    + aes(x = long, y = lat, group = group),

    + colour = "yellow", fill = NA) +

    + scale_fill_gradient2("Distance\nto river (m)",

    + low = muted("blue"), high = muted("red"),

    + midpoint = 500) +

    + labs(x = "Longitude", y = "Latitude")

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'The resulting map looks like the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_332_0.png)


    The map shows an up-to-date "hybrid" map of London downloaded from Google Maps,
    with the City of London boundary (in yellow) and buildings (in blue to red colors,
    according to their distance to the River Thames) on top of it.


    To practice using ggmap some more, we will create another map with the following
    components encompassing all three vector layer types – points, lines, and polygons
    – along with a static map downloaded from the Web:


    +   - A "satellite" static map background

    +   - towns: A point layer of two towns'' locations (see Chapter 7, Combining
    Vector and Raster Datasets)'
  merge: -1
  img_proc: true
- pgno: 333
  md: "+   - `track`: A line layer of a GPS track (see *Chapter 5, Working with Points,\
    \ Lines, and Polygons*)\n+   - `forests`: A polygonal layer of two planted forests\
    \ (see *Chapter 7, Combining Vector and Raster Datasets*)\n\nAs in the previous\
    \ example, we first need to bring all of these layers to a geographic CRS:\n\n\
    ```\n> towns_geo = spTransform(towns,\n+ CRS(\"+proj=longlat +datum=WGS84\"))\n\
    > track_geo = spTransform(track,\n+ CRS(\"+proj=longlat +datum=WGS84\"))\n> forests_geo\
    \ = spTransform(forests,\n+ CRS(\"+proj=longlat +datum=WGS84\"))\n```\n\nNext,\
    \ we need to use `fortify` on the line and polygonal layers (`track_geo` and `forests_geo`)\
    \ in order to bring them to a `data.frame` form. Point layers, as previously mentioned,\
    \ have a much simpler structure than lines and polygons, so no `fortify` method\
    \ exists for them. Instead, we can always manually construct a `data.frame` object\
    \ to represent a point layer. In the present case, for example, `towns_geo` is\
    \ a `SpatialPoints` object and `towns_names` is a character vector. Using the\
    \ `coordinates` functions and `data.frame`, we can combine them into a `data.frame`\
    \ object:\n\n```\n> towns_f = data.frame(coordinates(towns_geo), name = towns_names)\n\
    > towns_f\n      lon      lat      name\n1 34.87131 31.37936 Lahav Kibbutz\n2\
    \ 34.81695 31.37383        Lehavim\n> track_f = fortify(track_geo)\n> head(track_f)\n\
    \     long      lat order piece group id\n1 34.85472 31.36520     1     1   0.1\
    \  0\n2 34.85464 31.36540     2     1   0.1  0\n3 34.85458 31.36559     3    \
    \ 1   0.1  0\n4 34.85454 31.36519     4     1   0.1  0\n5 34.85443 31.36639  \
    \   5     1   0.1  0\n6 34.85445 31.36733     6     1   0.1  0\n> forests_f =\
    \ fortify(forests_geo, region = \"name\")\n> head(forests_f)\n     long      lat\
    \ order hole piece   group    id\n1 34.87591 31.33830     1 FALSE     1 Kramim.1\
    \ Kramim\n2 34.87559 31.33831     2 FALSE     1 Kramim.1 Kramim\n3 34.87560 31.33858\
    \     3 FALSE     1 Kramim.1 Kramim\n```"
  merge: -1
  img_proc: true
- pgno: 334
  md: '```

    4 34.87528 31.33858    4 FALSE    1 Kramim.1 Kramim

    5 34.87529 31.33885    5 FALSE    1 Kramim.1 Kramim

    6 34.87529 31.33912    6 FALSE    1 Kramim.1 Kramim

    ```


    The three data.frame objects (towns_f, track_f, and forests_f) are now in memory.
    The missing component is just the background static map, which can be downloaded
    with get_map as follows:


    ```

    > forests_ctr = coordinates(gCentroid(forests_geo))

    > forests_map = get_map(location = forests_ctr,

    + mapt ype = "satellite",

    + zoom = 12)

    ```


    The following code is used to combine all of these components into a single plot.
    Note that track_f is introduced through a geom_path layer (which is the appropriate
    geometry for spatial lines) and forests_f is introduced using geom_polygon. The
    point layer towns_f is added as a geom_text layer, rather than geom_point, in
    order to display the towns'' locations as name labels instead of points. The label
    aesthetic of geom_text controls the text that each point is associated with, which
    in our case is the name column that holds town names.


    ```

    > ggmap(forests_map) +

    + geom_polygon(data = forests_f,

    + aes(x = long, y = lat, group = group, colour = id),

    + fill = NA) +

    + geom_path(data = track_f,

    + aes(x = long, y = lat),

    + colour = "yellow") +

    + geom_text(data = towns_f,

    + aes(x = lon, y = lat, label = name),

    + colour = "white", size = 2.5, fontface = "bold") +

    + scale_colour_discrete("Forest") +

    + labs(x = "Longitude", y = "Latitude")

    ```'
  merge: -1
  img_proc: true
- pgno: 335
  md: 'The resulting map is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_335_0.png)


    This map shows the towns'' locations (as white text labels), the GPS track (as
    a yellow line), and the forest borders (as polygons, with border colors according
    to the forest identity).'
  merge: -1
