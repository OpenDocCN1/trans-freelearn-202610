- pgno: 344
  md: '# Summary


    In this chapter, you learned some of the most useful methods for advanced visualization
    of spatial data in R, using the packages ggplot2, ggmap, and lattice. It was shown
    how these tools can be used to conclude a spatial analysis procedure and create
    publishable maps and plots of the results, all within the R environment. In this
    context, it has been noted that not everything can be accomplished in R, and at
    times we need to migrate to traditional GIS software or graphic editors for interactive
    customization of the graphic output. Nevertheless, visualization in R is extremely
    flexible, while at the same time bringing all of the benefits of programming.
    Once you become more familiar with the techniques presented in this chapter, it
    is almost inevitable that R will become the primary tool of choice for data visualization.
    I sincerely hope that after completing this book you feel the same way about geospatial
    data analysis in R.'
  merge: -1
  img_proc: true
