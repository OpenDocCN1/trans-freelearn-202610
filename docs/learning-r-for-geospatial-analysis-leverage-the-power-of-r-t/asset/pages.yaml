- pgno: 78
  md: "# Using the data.frame class to represent tabular data\n\nIn this section,\
    \ you will learn how tables are represented in R and how you can work with tabular\
    \ objects. In particular, you will learn two common ways to create table objects\
    \ (from vectors or by reading a file from the disk). Afterwards, you will learn\
    \ how to examine, subset, and make calculations with tables.\n\n# Creating a table\
    \ from separate vectors\n\nThe data.frame class is the basic class to represent\
    \ tabular data in R. A data.frame object is essentially a collection of vectors,\
    \ all with the same length. However, the vectors do not have to be of the same\
    \ type. They may also include one-dimensional objects that are not strictly vectors,\
    \ such as Date or factor objects (see the previous chapter). Therefore, data.frame\
    \ objects are particularly suitable to represent data with different variables\
    \ in columns and different cases in rows. Thus, variables may be of different\
    \ types; for example, a table storing climatic data may have one character variable\
    \ to store meteorological station names, another Date variable to represent measurement\
    \ dates, and a third numeric variable to represent the measured values such as\
    \ rainfall amounts or temperatures.\n\nOne way to create a data.frame object is\
    \ to combine several vectors that are already present in the R environment. This\
    \ can be achieved with the data.frame function with the arguments being the names\
    \ of the vector objects we would like to combine. Let's take a look at the following\
    \ examples:\n\n```\n> num = 1:4\n> lower = c(\"a\",\"b\",\"c\",\"d\")\n> upper\
    \ = c(\"A\",\"B\",\"C\",\"D\")\n> df = data.frame(num, lower, upper)\n> df\n \
    \ num lower upper\n1   1     a     A\n2   2     b     B\n3   3     c     C\n4\
    \   4     d     D\n```"
  merge: -1
  img_proc: true
- pgno: 79
  md: "Here, we created a data.frame object named df by combining the vectors num,\
    \ lower, and upper. The previously independent vectors now comprise columns in\
    \ df. As we can see, the names of the columns appear on the first line of the\
    \ printed output of a data.frame object. These are the names of the original vectors,\
    \ num, lower, and upper. Rows have names as well; these are automatically assigned\
    \ with the characters 1, 2, 3, and 4 (as it appears to the left of the first column\
    \ in the printed output).\n\nWe can also create the data.frame object in a single\
    \ step by performing the vector assignments within the data.frame function call\
    \ itself:\n\n```\n> df = data.frame(\n+ num = 1:4,\n+ lower = c(\"a\",\"b\",\"\
    c\",\"d\"),\n+ upper = c(\"A\",\"B\",\"C\",\"D\"))\n```\n\nNote that in this example,\
    \ vector types were different (num is numeric, whereas lower and upper are characters).\
    \ However, the vectors had the same length; otherwise, an error would have occurred\
    \ since all columns of data.frame must have the same length.\n\nAn important parameter\
    \ of the data.frame function (and several other functions such as read.csv, which\
    \ will be introduced in the next section) is stringsAsFactors. The stringsAsFactors\
    \ parameter controls whether character columns are automatically converted to\
    \ factors (the default value is TRUE). Within the context of this book, we would\
    \ usually like to keep the character vectors as characters for greater flexibility\
    \ (we can always make the conversion to factors ourselves when necessary with\
    \ the factor function; see the previous chapter for more information). Therefore,\
    \ a function call preserving character columns will be as follows:\n\n```\n> df\
    \ = data.frame(num, lower, upper,\n+ stringsAsFactors = FALSE)\n> df\n  num lower\
    \ upper\n1   1     a     A\n2   2     b     B\n3   3     c     C\n4   4     d\
