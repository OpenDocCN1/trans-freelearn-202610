- pgno: 89
  md: '# # Controlling code execution


    So far, all of the code sections we have written were executed once in the same
    order as they were sent to the command line. However, one of the most important
    themes in programming is the flow control—operations that are used to control
    the sequences of our code execution. For example, we may want to induce the execution
    of a certain code section only if a condition is met (these are called conditional
    statements), or we may wish to execute a code section several times, over and
    over again (these are called loops). In this section, you will learn about three
    flow control commands: two to construct conditional statements and one to construct
    loops.


    # # Conditioning execution with conditional statements


    The purpose of conditional statements is to condition the execution of a given
    code section. For example, the second expression in the following code section
    is a conditional statement using the `if` operator:


    ```

    x = 3

    if(x > 2) {print("x is large!")}

    [1] "x is large!"

    ```


    A conditional statement is composed of the following elements:


    +   - The conditional statement operator (`if`)

    +   - The condition in parentheses (for example, `(x>2)`)

    +   - Code section opening brackets (`{`)

    +   - The code section to execute when the condition is met (for example, `print("x
    is large!")`)

    +   - Code section closing brackets (`}`)

    +   - Optionally, the `else` operator (`else`)

    +   - Optionally, code section opening brackets (`{`)

    +   - Optionally, the code to execute when the condition is not met

    +   - Optionally, code section closing brackets (`}`)'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Working with Tables


    Importantly, the condition should be an expression that returns a single logical
    value. The code section following this condition will then be executed if the
    value is TRUE or ignored if the value is FALSE. For example, if x is not larger
    than 2, nothing will happen since the `print("x is large!")` expression will not
    be executed:


    ```

    ```r

    > x = 0

    > if(x > 2) {print("x is large!")}

    ```

    ```


    Nothing is printed on screen.


    > The same way as with function definitions (see the previous chapter) and for
    loops (see the next section), code with only one expression does not have to be
    encompassed in parentheses `{`.


    Optionally, we can use the `else` operator to add another code section. The code
    section after the else operator will be executed when the condition in if is FALSE
    as follows:


    ```

    ```r

    > x = 3

    > if(x > 2) {print("x is large!")} else {print("x is small!")}

    [1] "x is large!"

    > x = 1

    > if(x > 2) {print("x is large!")} else {print("x is small!")}

    [1] "x is small!"

    ```

    ```


    There is another conditional operator, specialized in working on vectors element
    by element, called `ifelse`. With `ifelse`, we need to supply three arguments:
    a logical vector, a value for TRUE (the yes parameter), and a value for FALSE
    (the no parameter). What we receive is a new vector with the same length as the
    input logical vector, where the TRUE and FALSE values have been replaced with
    the alternative values we supplied.


    Regarding the replacement values for TRUE and FALSE, the most useful modes of
    operation are either to have them as vectors of length 1 (and then they are recycled
    to fill the entire length of the logical vector) or to have them as vectors of
    the same length as the logical vector (and then the elements of the logical vector
    are replaced with the respective elements either from the yes or no vector).


    For example, the first mode of operation is useful when we want to classify the
    values of a given vector into two categories, according to a condition:


    ```

    ```r

    > dat$mmxt[1:7]

    [1]  5.6  9.8  7.2 12.2 11.8 19.6 24.1

    > ifelse(dat$mmxt[1:7] < 10, "cold", "warm")

    [1] "cold" "cold" "cold" "warm" "warm" "warm" "warm"

    ```

    ```'
  merge: -1
  img_proc: true
