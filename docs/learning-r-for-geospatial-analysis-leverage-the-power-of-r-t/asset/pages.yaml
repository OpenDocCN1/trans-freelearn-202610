- pgno: 29
  md: 'More details can be found on the RStudio website (www.rstudio.com) or in other
    resources such as Mark P.J. van der Loo and Edwin de Jonge''s book *Learning RStudio
    for R Statistical Computing*, Packt Publishing (2012).


    > All references mentioned in this book are collectively provided in *Appendix
    B, Cited References.*


    # Evaluating expressions


    We now know how to enter code for R to interpret, whether directly entering it
    into R''s command line or sending it to the command line from a code editor. Our
    next step will be to see how to use the simplest operations: arithmetic and logical
    operators and functions.


    # Using arithmetic and logical operators


    The standard arithmetic operators in R are as follows:


    +   - `+`: Addition

    +   - `-`: Subtraction

    +   - `*`: Multiplication

    +   - `/`: Division

    +   - `^`: Power


    The following examples demonstrate the usage of these operators:


    ```

    ```r

    > 5+3

    [1] 8

    > 4-5

    [1] -1

    > 1*10

    [1] 10

    > 1/10

    [1] 0.1

    > 2^3

    [1] 8

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Parentheses can be used to construct more elaborate expressions, as follows:


    ```

    > 2*(3+1)

    [1] 8

    > 5^(1+1)

    [1] 25

    ```


    It is better to use parentheses even when it is not required to make the code
    clearer.


    Another very useful symbol is #. All code to the right of this symbol is not interpreted.
    Let''s take a look at the following example:


    ```

    > 1*2 # *3

    [1] 2

    ```


    The # symbol is helpful for adding comments within the code to explain what each
    code segment does, for other people (or oneself, at a later time of reference)
    to understand it:


    ```

    > 5+5 # Adding 5 and 5

    [1] 10

    ```


    Note that R ignores spaces between the components of an expression:


    ```

    > 1+  1

    [1] 2

    ```


    Conditions are expressions that have a yes/no answer (the statement can be either
    true or false). When interpreting a conditional expression, R returns a logical
    value, either TRUE for a true expression or FALSE for a false expression. A third
    option, NA, which stands for Not Available, is used when there is not enough information
    to determine whether the expression is true or false (NA values will be discussed
    in the next chapter).


    The logical operators in R are summarized as follows:


    +   - ==: Equal to

    +   - >: Greater than

    +   - >=: Greater than or equal to

    +   - <: Smaller than

    +   - <=: Smaller than or equal to

    +   - !=: Not equal to'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - `&`: and

    +   - `|`: or

    +   - `!`: not


    For example, we can use condition operators to compare between two numbers as
    follows:


    ```

    ```r

    > 1<2

    [1] TRUE

    > 1>2

    [1] FALSE

    > 2>2

    [1] FALSE

    > 2>=2

    [1] TRUE

    > 2!=2

    [1] FALSE

    ```

    ```


    The and (&) and or (|) operators can be used to construct more complex expressions
    as follows:


    ```

    ```r

    > (1<10) & (10<100)

    [1] TRUE

    > (1<10) & (10>100)

    [1] FALSE

    > (1<10) | (10<100)

    [1] TRUE

    > (1<10) | (10>100)

    [1] TRUE

    ```

    ```


    As you can see in the preceding examples, when the expressions at both the sides
    of the & operator are true, TRUE is returned; otherwise, FALSE is returned (refer
    to the first two expressions). When at least one of the expressions at either
    side of the | operator is true, TRUE is returned; otherwise, FALSE is returned
    (refer to the last two expressions).'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Two other useful conditional operators (`==` and `!=`) are used for testing
    equality and inequality, respectively. These operators are opposites from one
    another since a pair of objects can be either equal or non-equal to each other.


    ```

    ```r

    > 1 == 1

    [1] TRUE

    > 1 == 2

    [1] FALSE

    > 1 != 1

    [1] FALSE

    > 1 != 2

    [1] TRUE

    ```

    ```


    As you can see in the preceding examples, when using the `==` operator, TRUE is
    returned if the compared objects are equal; otherwise FALSE is returned (refer
    to expressions 1 and 2). With `!=` it is the other way around (refer to expressions
    3 and 4).


    The last operator that we are going to cover is the not operator (`!`). This operator
    reverses the resulting logical value, from TRUE to FALSE or from FALSE to TRUE.
    This is used in cases when it is more convenient to ask whether a condition is
    *not* satisfied. Let''s take a look at the following example:


    ```

    ```r

    > 1 == 1

    [1] TRUE

    > !(1 == 1)

    [1] FALSE

    > (1 == 1) & (2 == 2)

    [1] TRUE

    > (1 == 1) & !(2 == 2)

    [1] FALSE

    ```

    ```


    # ## Using functions


    In mathematics, a function is a relation between a set of inputs and a set of
    outputs with the property that each input is related to exactly one output. For
    example, the function *y* = 2*x* relates every input *x* with the output *y*,
    which is equal to *x* multiplied by 2. The function concept in R (and in programming
    in general) is very similar:


    +   - The function is composed of a code section that knows how to perform a certain
    operation.

    +   - Employing the function is done by *calling* the function.

    +   - The function receives one object, or several objects, as input (for example,
    the number 9).'
  merge: -1
  img_proc: true
- pgno: 33
  md: "+   - The function returns a single object as output (for example, the number\
    \ 18). Optionally, it can perform other operations called *side effects* in addition\
    \ to returning the output.\n+   - The type and quantity of the objects that a\
    \ function receives as input has to be defined in advance. These are called the\
    \ function's parameters (for example, a single number).\n+   - The objects that\
    \ a function receives in reality, at a given function call, are called the function's\
    \ *arguments* (for example, the number 9).\n\nThe most common (and the most useful)\
    \ expressions in R are function calls. In fact, we have been using function calls\
    \ all along, since the arithmetic operators are functions as well, which becomes\
    \ apparent when using a different notation:\n\n```\n3*3\n[1] 9\n\n\"*\"(3,3)\n\
    [1] 9\n```\n\nA function is essentially a predefined set of instructions. There\
    \ are plenty of built-in functions in R (functions that are automatically loaded\
    \ into memory when starting R). Later, you will also learn how to use functions\
    \ that are not automatically loaded, and how to define your own functions.\n\n\
    As you might have guessed from the previous example, a function call is composed\
    \ of the function name, followed by the function's arguments within parentheses\
    \ and separated by commas. For example, the function sqrt returns the square root\
    \ of its argument:\n\n```\nsqrt(16)\n[1] 4\n```\n\n> R is case sensitive. For\
    \ example, Sqrt and sqrt are treated as two different names:\n> \n>     > Sqrt(16)\n\
    >     Error: could not find function \"Sqrt\"\n> \n> When trying the first option,\
    \ we receive an error message stating that there is no function named Sqrt in\
    \ memory."
  merge: -1
  img_proc: true
- pgno: 34
  md: '# # Dealing with warning and error messages


    Error messages are printed when for some reason it is impossible to execute the
    expression that we have sent to the interpreter. For example, this can happen
    when one of the objects we refer to does not exist (refer to the preceding information
    box). Another example is trying to pass an inappropriate argument to a function.
    In R, character values are delimited by quotes. Trying to call a mathematical
    function on a character understandably produces an error:


    ```

    ```r

    > "oranges" + "apples"

    Error in "oranges" + "apples" : non-numeric argument to binary op$

    ```

    ```


    > The $ symbol at the end of the text message indicates that we need to scroll
    rightwards in the command-line window to see the whole message.


    Warning messages are returned when an expression can be interpreted but the system
    suspects that the respective employed method is inappropriate. For example, the
    square root of a negative number does not yield a number within the real number
    system. A Not a Number (NaN) value is returned in such a case, along with a warning:


    ```

    ```r

    > sqrt(-2)

    [1] NaN

    Warning message:

    In sqrt(-2) : NaNs produced

    ```

    ```


    R has a set of predefined symbols to represent special constant values, most of
    which we already mentioned:


    +   - `NaN`: Not a number

    +   - `NA`: Not available

    +   - `NULL`: An empty object

    +   - `TRUE` and `FALSE`: Logical values

    +   - `Inf`: Infinity (for example, try typing `1/0`)


    > Unnecessary warnings and information messages, such as an indication that a
    given operation has been successfully carried out, are omitted from the code sections
    in this book to save space. However, readers who reproduce the examples will occasionally
    see such messages on the screen.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Getting help


    A help page on every function in R can be reached by using the ? operator (or
    the help function). For example, the following expression opens the help page
    for the sqrt function:


    ```

    > ?sqrt

    ```


    The same result is achieved by typing help(sqrt).


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_35_0.png)


    > On the other hand, the ?? operator searches the available help pages for a given
    keyword (corresponding to the help.search function).

    > Another useful expression regarding the official R help pages is help.start()
    that opens a page with links to R''s official introductory manuals.


    The structure of all help files on functions is similar, usually including a short
    description of what the function does, the list of its arguments, usage details,
    a description of the returned object, references, and examples. The help pages
    can seem intimidating at first, but with time they become clearer and more helpful
    for reminding oneself of the functions'' usage details.


    Another important source of information on R is the Internet. Entering a question
    or a task that we would like to perform (such as Googling r read raster file)
    into a web search engine usually yields a surprising amount of information from
    forums, blogs, and articles. Using these resources is inevitable when investigating
    new ways to utilize R.


    # Exploring the basic object types in R


    So far, we have encountered two types of objects in R: numeric values (numeric
    vectors, to be precise, as we will see in Chapter 2, Working with Vectors and
    Time Series) and functions. In this section, we are going to introduce the key
    concept that an object is an instance of a certain class. Then, we will distinguish
    between, for operational purposes, the classes that are used to store data (data
    structures) and classes that are used to perform operations (functions). Finally,
    a short sample code that performs a simple GIS operation in R will be presented
    to demonstrate the way themes introduced in this chapter (and those that will
    be introduced in Chapter 2, Working with Vectors and Time Series, and Chapter
    3, Working with Tables) will be applied for spatial data analysis in the later
    chapters of this book.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Everything is an object


    R is an object-oriented language; accordingly, everything in R is an object. Objects
    belong to classes, with each class characterized by certain properties. The class
    to which an object belongs to determines the object''s properties and the actions
    we can do with that object. To use an analogy, a gray Mitsubishi Super-Lancer
    model 1996 object belongs to the class car. It has specific attributes (such as
    color, model, and manufacturer) for each of the data fields a car object has.
    It satisfies all criteria that the car class entails; thus, the actions that are
    applicable to cars (such as igniting the engine and accelerating or using the
    breaks) are also meaningful with that particular object. In much the same way,
    a multi-band raster object in R will obligatorily have certain properties (such
    as the number of rows and columns, and resolution) and applicable actions (such
    as creating a subset of only the first band or calculating an overlay based on
    all bands).


    All objects that are stored in memory can be accessed using their names, which
    begin with a character (without quotes; some functions, such as all arithmetic
    and logical operators can be called using their respective symbol within quotes,
    such as in "*" as we saw earlier). For example, sqrt is the name of the square
    root function object; the class to which this object belongs is function. When
    starting R, a predefined set of objects is loaded into memory, for example, the
    sqrt function and logical constant values TRUE and FALSE. Another example of a
    preloaded object is the number π:


    ```

    ```r

    > pi

    [1] 3.141593

    ```

    ```


    The class function returns the class name of the object that it receives as an
    argument:


    ```

    ```r

    > class(TRUE)

    [1] "logical"

    > class(1)

    [1] "numeric"

    > class(pi)

    [1] "numeric"

    > class("a")

    [1] "character"

    > class(sqrt)

    [1] "function"

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# # Storing data in data structures


    From the point of view of a typical R user, all objects we handle in R can be
    divided into two groups: data structures (which hold data) and functions (which
    are used to perform operations on the data).


    The basic components of all data structures are constant values, usually numeric,
    character, or logical (the last code section shows examples of all three). The
    simplest data structure in R is a vector, which is covered in *Chapter 2, Working
    with Vectors and Time Series*. Later, we''ll see how more complex data structures
    are essentially collections of the simpler data structures. For example, a raster
    object in R may include two numeric vectors (holding the raster values and its
    dimensions) and a character vector (holding the **Coordinate Reference System
    (CRS)** information). The object-oriented nature of the language makes things
    easier both for the people who define the data structure classes (since they can
    build upon predefined simpler classes, rather than starting from the beginning)
    and for the users (since they can utilize their previous knowledge of the simple
    data structure components to quickly understand more complex ones).


    # # Calling functions to perform operations


    Objects of the second type — functions — are typically used to perform operations
    on data structures. A function may have its influence limited to the R environment,
    or it may invoke side effects affecting the environment outside of R. All functions
    we have used until now affect only the R environment; a function to save a raster
    file, for example, has an external effect — it influences the data content of
    the hard drive.


    # # A short sample session


    Finally, let''s take a look at a complete code section that performs a simple
    spatial analysis operation:


    ```

    ```r

    > library(raster)

    > r = raster("C:\\Data\\rainfall.tif")

    > r[120, 120] = 1000

    > writeRaster(r, "C:\\Data\\rainfall2.tif")

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# The R Environment


    The task that this code performs is to read a raster file, `rainfall.tif`, from
    the disk (look at the following screenshot to see its visualization in QGIS),
    change one of its values (the one at row 120 line 120, into 1000) and write the
    resulting raster to a different file.


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_38_0.png)


    > The `rainfall.tif` file, as well as all other external data files used in this
    book, is provided on the book''s website so that the reader can reproduce the
    examples and experiment with them. Refer to *Appendix A, External Datasets Used
    in Examples*, for a summary of all data files encountered throughout the book.
    R code files, containing all code sections that appear in the book, are also provided
    on the book''s website for convenience.


    Do not worry if you do not understand all the lines of code given in the beginning
    of this section. They will become clear by the time you finish reading *Chapter
    4, Working with Rasters*. Briefly, the first line of code tells R to load the
    set of functions that are used to work with rasters (called the raster package),
    such as the raster and writeRaster functions that we use here to read and write
    raster files. In the second line, we read the requested file and load it into
    memory. In the third line of code, we assign the value 1000 to the specified pixel
    of that raster. The fourth line of code writes the new (modified) raster to the
    disk.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'The task indeed sounds simple, but when we use desktop GIS software, it may
    not be easy to perform through the menus and dialog box system (where direct access
    to raster values may be unavailable). For example, we may have to create a new
    point feature over the pixel that we want to change (120,120) in raster A, convert
    it to a raster B (with the value of 1 at the (120,120) pixel and 0 in all other
    pixels), and then use an overlay tool to say that we want the pixel in raster
    A that overlays the value of 1 in raster B to have the value of 1000, while all
    other pixels retain their original values. Finally, we might need to use an additional
    toolbox to export the new raster. However, what if we need to perform this operation
    on several files or repeatedly on a given file as new information comes in?


    Generally speaking, when we use programming rather than menu-based interfaces,
    the steps we have to take may seem less intuitive (writing code rather than scrolling,
    clicking with the mouse, and filling out dialog boxes). However, we have much
    more power with giving the computer specific instructions. The beauty of using
    programming for data analysis, and using R for geospatial analysis in particular,
    is not only that we gain greater efficiency through automation, but also that
    we get closer to the data and discover a wide range of new possibilities to analyze
    it, some of which may not even come to mind when we use a predefined set of tools
    or menus.


    # Summary


    In this chapter, we covered the basics of using R. At this point, you should have
    R installed and you should be able to write and execute several basic commands
    from the command line or from the text editor of your preference. The concepts
    of classes and objects were also introduced, which are both important for the
    rest of the topics that you will learn in this book. We are now ready to proceed
    to more complex data structures and operations used in spatial data analysis.


    The next chapter will be devoted to vectors, the basic data structures in R. Then,
    we will introduce more complex data structures to represent nonspatial data in
    *Chapter 3, Working with Tables*, and spatial data in *Chapter 4, Working with
    Rasters*, and *Chapter 5, Working with Points, Lines, and Polygons*.'
  merge: -1
  img_proc: true
