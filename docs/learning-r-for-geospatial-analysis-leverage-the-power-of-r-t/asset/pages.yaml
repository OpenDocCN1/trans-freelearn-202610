- pgno: 276
  md: "# Spatial Interpolation of Point Data\n\nThe important point here is that the\
    \ `v$var_model` component of `v` is an object of class `variogramModel`, containing\
    \ the function type and parameters defining a variogram model. A `variogramModel`\
    \ object can be passed to the `gstat` function to indicate a variogram model.\
    \ Therefore, we can create an object containing all the necessary information\
    \ to perform the OK interpolation as follows:\n\n```\n```r\n> g = gstat(formula\
    \ = value ~ 1, data = dat, model = v$var_model)\n> g\ndata:\nvar1 : formula =\
    \ value ~ 1 ; data dim = 75 x 5\nvariograms:\n          model     psill     range\
    \ kappa\nvar1[1]   Nug   0.4594258       0.0   0.0\nvar1[2]   Ste  10.9549186\
    \  626562.4   0.3\n```\n```\n\nThe printed output shows that the object indeed\
    \ contains a variogram model. We can now use the `interpolate` function to produce\
    \ the predicted OK surface, and the `mask` function to clip the area of interest,\
    \ exactly the same way we did in IDW interpolation:\n\n```\n```r\n> z = interpolate(dem_spain,\
    \ g)\n> z = mask(z, dem_spain)\n```\n```\n\nThose readers who execute the above\
    \ expression in R should see, this time, the message `[using ordinary kriging]`\
    \ on screen.\n\nLet's plot the interpolation result with the following expressions:\n\
    \n```\n```r\n> plot(z)\n> plot(dat, add = TRUE)\n```\n```"
