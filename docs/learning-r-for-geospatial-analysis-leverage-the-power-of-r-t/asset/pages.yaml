- pgno: 125
  md: '```

    coord. ref. : +proj=utm +zone=36 +ellps=WGS84 +units=m +no_defs

    data source : C:\Data\landsat_04_10_2000.tif

    names      : landsat_04_10_2000.1, landsat_04_10_2000.2, landsat$

    min values :        3.109737e-05,        2.019792e-02,        $

    max values :        0.6080654,        0.6905138,        $

    ```


    This time, our RasterBrick object l_00 holds all six bands the landsat_04_10_2000.tif
    file contains.


    The following table summarizes the previously mentioned properties of the three
    classes:


    | Class | Function | Bands | Storage |

    |---|---|---|---|

    | RasterLayer | raster | 1 | Disk/RAM |

    | RasterStack | stack | Greater than 1 | Disk/RAM |

    | RasterBrick | brick | Greater than 1 | Disk/RAM, single file |


    Once we have a multiband raster object (such as RasterStack), we can access individual
    bands using the double square brackets [[ operator. By supplying a numeric vector
    of band indices within double brackets, we can get a subset of bands from the
    multiband raster. When the index has a length of 1, we get a RasterLayer object
    holding a single band. For example, using the expression l_00[[2]], we get a RasterLayer
    object that holds the second band as follows:


    ```

    > class(l_00[[2]])

    [1] "RasterLayer"

    attr(,"package")

    [1] "raster"

    ```


    When the length of the index is greater than 1, we get a multiband object that
    holds the specific bands we selected. For example, using the expression l_00[[1:3]],
    we get a RasterStack object containing only bands 1-3:


    ```

    > class(l_00[[1:3]])

    [1] "RasterStack"

    attr(,"package")

    [1] "raster"

    ```'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Writing raster files


    Raster objects can be written to disk with the writeRaster function. Writing in
    nine formats is currently supported. For example, to write our recently created
    RasterStack object back to disk, in a different format (say, an ERDAS IMAGINE
    image, *.img), we will run the following expression:


    ```

    > writeRaster(l_00,

    + "C:\\Data\\landsat_04_10_2000.img",

    + format = "HFA",

    + overwrite = FALSE)

    ```


    Note that we specified the values of four parameters:


    +   - The object to be written (l_00)

    +   - The path and name for the file to be written ("C:\\Data\\landsat_04_10_2000.img")

    +   - The format of choice (see ?writeRaster for the list of abbreviations) (format="HFA")

    +   - Whether to overwrite when the file already exists (overwrite=FALSE)


    # Exploring a raster''s properties


    In this section, we are going to review some of the functions used to query the
    properties of raster objects, and modify those properties when appropriate. Accessing
    and modifying the raster values (these can also be viewed as a property the raster
    has) is going to be covered in the next sections.


    The number of rows, columns, and layers of a raster can be obtained using functions
    nrow, ncol, and nlayers, respectively:


    ```

    > nrow(l_00)

    [1] 960

    > ncol(l_00)

    [1] 791

    > nlayers(l_00)

    [1] 6

    ```


    As we have seen previously in other contexts, the dim function returns the lengths
    of all dimensions at once as follows:


    ```

    > dim(l_00)

    [1] 960 791  6

    ```'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'The number of cells (equal to the number of rows multiplied by the number of
    columns) can be obtained using the ncell function:


    ```

    ```r

    > ncell(l_00)

    [1] 759360

    ```

    ```


    As for the spatial reference properties, the res and extent functions return the
    resolution and extent of the raster, while the proj4string function returns the
    CRS information. Let''s see how these functions work, one function at a time:


    ```

    ```r

    > res(l_00)

    [1] 30 30

    ```

    ```


    The output of res is a vector of length 2, and its values denote the resolutions
    on the *x* and *y* axes, respectively (these are usually equal). Here is an example
    of querying the raster''s extent:


    ```

    ```r

    > extent(l_00)

    class      : Extent

    xmin       : 663945

    xmax       : 687675

    ymin       : 3459375

    ymax       : 3488175

    ```

    ```


    The returned object from the extent function is an object of the Extent class.
    Objects of this class define a rectangular bounding box and have several uses,
    such as cropping a raster according to the extent of another raster (using the
    crop function, as we shall see in upcoming chapters).


    The returned object from the proj4string function is a character vector (of length
    1), holding the CRS information in the PROJ.4 format:


    ```

    ```r

    > proj4string(l_00)

    [1] "+proj=utm +zone=36 +ellps=WGS84 +units=m +no_defs"

    ```

    ```


    Certain methods (such as reprojection of vector layers, which will be introduced
    in the next chapter), require CRS information as an object of class CRS rather
    than a character value. A CRS object can be created in a straightforward manner,
    namely applying function CRS to a PROJ.4 character string. The CRS function is
    defined in the sp package—another very important package to work with spatial
    data in R (it is automatically loaded along with the raster package) and one that
    is going to be covered in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 128
  md: "# Working with Rasters\n\nThe CRS object contains exactly the same information,\
    \ only in a different form:\n\n```\n```r\n> CRS(proj4string(l_00))\nCRS arguments:\n\
    \  +proj=utm +zone=36 +ellps=WGS84 +units=m +no_defs\n```\n```\n\nOne of the advantages\
    \ of using the CRS class is that the correspondence of a specific character string\
    \ to a valid CRS is ensured (otherwise the CRS function will trigger an error).\n\
    \nSometimes, we would like to modify the CRS information of a spatial object (or\
    \ assign one if it is missing). For example, assignment of NA to the CRS component\
    \ is equivalent to clearing the CRS information:\n\n```\n```r\n> proj4string(l_00)\
    \ = NA\n> proj4string(l_00)\n[1] NA\n```\n```\n\nWhen a raster does not have a\
    \ CRS specified, we can assign it one. One way to do this is by using the appropriate\
    \ PROJ.4 character string (which, in turn, can be obtained from another resource,\
    \ such as http://www.spatialreference.org/). Here is an example of how this can\
    \ be done:\n\n```\n```r\n> proj4string(l_00) =\n+ CRS(\"+proj=utm +zone=36 +ellps=WGS84\
    \ +units=m +no_defs\")\n> proj4string(l_00)\n[1] \"+proj=utm +zone=36 +ellps=WGS84\
    \ +units=m +no_defs\"\n```\n```\n\nIt is frequently more convenient to transfer\
    \ CRS information from another spatial object (which is analogous to importing\
    \ a CRS from another layer, a common procedure in a GIS software), rather than\
    \ looking up its specific parameters. For example, we can assign our raster object\
    \ l_00 the CRS data from another Landsat satellite image we read from the disk:\n\
    \n```\n```r\n> l1 = raster(\"C:\\\\Data\\\\landsat_15_10_1998.tif\")\n> proj4string(l_00)\
    \ = CRS(proj4string(l1))\n```\n```\n\nA graphical display is often the most helpful\
    \ way to perceive the properties of a given raster. For example, the two basic\
    \ functions plot and hist can give a first impression of the raster values' distribution.\
    \ The plot function, when applied to a raster object, generates a simple map of\
    \ the values in each band. For more advanced visualization of this sort, we are\
    \ going to use the levelplot function (in the following example) and the ggplot2\
    \ package (in Chapter 9, Advanced Visualization of Spatial Data). The hist function\
    \ displays a histogram of the values in each band of the raster."
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Prior to plotting, we will modify another property the raster l_00 has—its
    band names—using the names function, so that more appropriate names will appear
    along with each respective image in the graphical output. The automatically generated
    names are often inconvenient; for example, they may be composed of the filename
    with sequential numbers for the different bands:


    ```

    ```r

    > names(l_00)

    [1] "landsat_04_10_2000.1" "landsat_04_10_2000.2"

    [3] "landsat_04_10_2000.3" "landsat_04_10_2000.4"

    [5] "landsat_04_10_2000.5" "landsat_04_10_2000.6"

    ```

    ```


    We can assign shorter names as follows:


    ```

    ```r

    > names(l_00) = paste("Band", 1:6, sep = "_")

    > names(l_00)

    [1] "Band_1" "Band_2" "Band_3" "Band_4" "Band_5" "Band_6"

    ```

    ```


    Now, using the expression hist(l_00), we will generate histograms of values in
    each band of raster l_00, which are shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_129_0.png)'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Expanded functionality in the visualization of raster data in R is available
    through several contributed packages. For example, the `levelplot` function from
    the `rasterVis` package (which is a modified version of the `levelplot` function
    from the `lattice` package) by default displays all bands of a given raster using
    a single color scale (unlike `plot`), which is something we usually want to do.
    Note that the `levelplot` function has numerous additional parameters to modify
    the plot appearance, and the `rasterVis` package contains several other useful
    functions to visualize rasters, that we are not going to cover (instead, you will
    learn how to produce customized graphical output using the `ggplot2` package in
    Chapter 9, *Advanced Visualization of Spatial Data*). The interested reader is
    referred to the tutorial of the `rasterVis` package (http://oscarperpinan.github.io/rastervis/)
    and the related book by the package author Oscar Perpinan Lamigueiro, *Displaying
    Time Series, Spatial, and Space-Time Data with R, CRC Press (2014).*


    Two very useful parameters of `levelplot` are `par.settings`, which determines
    the color scale (for example, the blue-red scale is available using `RdBuTheme`),
    and `contour`, which determines whether to display contours. Let''s take a look
    at the following example:


    ```

    > library(rasterVis)

    > levelplot(l_00, par.settings = RdBuTheme, contour = FALSE)

    ```


    The following graphical output is generated:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_130_0.png)'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'The previous screenshot shows reflectance values between 0 (completely dark)
    to 1 (completely reflective) for each Landsat band. To produce a so-called true
    color image, we would have to combine bands 1-3 (blue, green, and red), as will
    be shown in the next chapter.


    # Subsetting rasters


    In many situations, we would like to access the values of a given raster either
    to perform calculations involving these values (for example, to calculate a frequency
    table) or to make an assignment (for example, to change a certain value in the
    raster; see the previous code section in Chapter 1, The R Environment). In this
    section, we are going to cover the different ways to do this.


    As an example, we are going to use another multiband raster, modis.tif. First,
    we will assign it to a RasterBrick object named r and print its properties, as
    follows:


    ```

    > r = brick("C:\\Data\\modis.tif")

    > r

    class       : RasterBrick

    dimensions  : 100, 100, 10000, 280  (nrow, ncol, ncell, nlayers)

    resolution  : 500, 500  (x, y)

    extent      : 660000, 710000, 3445000, 3495000  (xmin, xmax, ymin$

    coord. ref. : +proj=utm +zone=36 +datum=WGS84 +units=m +no_defs +$

    data source : C:\Data\modis.tif

    names       : modis.1, modis.2, modis.3, modis.4, modis.5, modis.$

    ```


    The modis.tif file contains Normalized Difference Vegetation Index (NDVI) values
    from the MOD13A1 product of the Terra-MODIS satellite. As with Landsat, the original
    MOD13A1 data is available for free at http://earthexplorer.usgs.gov/. The modis.tif
    image covers an area of 2,500 km² at 500 meters spatial resolution. Unlike with
    Landsat, the bands do not refer to different wavelengths of the satellite sensor,
    but rather to different dates of image acquisition. In other words, we have a
    time series of NDVI images. There are 280 bands, corresponding to the period between
    February 18, 2000 and April 6, 2012 (23 images per year, each corresponding to
    approximately a 16-day time interval). Pixels (raster cells) with unreliable data
    (due to clouds, for example) were assigned with NA as part of the preprocessing.


    The NDVI is a commonly used remote sensing index, quantifying the abundance of
    green vegetation (it has a range of -1 to 1, with values closer to 1 corresponding
    to more abundant vegetation). The NDVI is calculated based on reflectance in the
    red and NIR bands. We are going to see exactly how it is done, using the Landsat
    image as an example, later on in this chapter.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Working with Rasters


    To examine the geographical location of the modis.tif raster, we can use the plotKML
    package that has a suite of functions to export the spatial data from R in the
    KML or KMZ formats and automatically display it in Google Earth. The simplest
    possible example, using nothing but defaults, would be to call the plotKML function
    on one of the bands in the raster r (for example, on band 1) in order to open
    Google Earth and display it there. The expression plotKML(r[[1]]) will thus automatically
    open Google Earth, zoom in on the location of the raster r[[1]], and display its
    values using a color scale (assuming the R packages plotKML and animation are
    loaded and the Google Earth software is installed). The following screenshot demonstrates
    what we see as a result:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_132_0.png)


    To subsequently display the result in Google Earth, the plotKML function has,
    in fact, written a KML file in the current working directory. The working directory
    is the default path that R uses to import and export files. It can be queried
    or modified using functions getwd and setwd, respectively. For example:


    ```

    > getwd()

    [1] "C:/Users/Michael Dorman/Documents"

    > setwd("C:\\Data")

    > getwd()

    [1] "C:/Data"

    ```


    Utilizing working directories can save the time spent in writing absolute file
    paths, but it can also make the code less concrete, so we will not use it in the
    present book.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Interactive visualization, over informative reference layers (for example,
    in Google Earth), is very helpful for the initial examination of spatial data
    we have at hand. For example, we can now see clearly that the NDVI gradient within
    the raster, from relatively high values towards north-west direction to relatively
    low values towards south-east direction, is due to its positioning in the transition
    zone between the relatively humid Mediterranean climatic region (where vegetation
    is more abundant) and the arid Negev desert (where vegetation is scarce).


    The interested reader can refer to the paper in the Journal of Statistical Software
    by Hengl, Roudier, Beaudette, and Pebesma (2014), or to the online tutorial (http://gsif.isric.org/doku.php?id=wiki:tutorial_plotkml)
    for further details and inspirational examples on the wide range of methods the
    plotKML package offers.


    # Accessing raster values as a vector


    Returning to the subject of raster value access, the simplest way of doing that
    is with the [ operator, exactly the same way we would with a vector. When accessing
    the values of a raster with [, the values will be ordered from the top-left corner
    rightwards, then along the second row, and so on, until the lower-right corner
    is reached. For example, to find out the first five values of the first layer
    in the r raster, we will use the following expression:


    ```

    > r[[1]][1:5]

    [1] 0.4242 0.3995 0.4190 0.4272 0.4285

    ```


    Note that indices referring to bands with [[ come first, and indices referring
    to cells with [ come second. Either can be omitted, and then all elements from
    the respective dimension will be returned rather than a subset (for example, as
    we have seen previously, r[[1]] returns the whole first band).


    When the [ operator is used, but the cell value''s index is omitted (as in []),
    we get a vector containing all of the raster values. We can use this vector, for
    example, to calculate the mean NDVI on the first date of acquisition (February
    18, 2000).


    ```

    > mean(r[[1]][], na.rm = TRUE)

    [1] 0.2302056

    ```


    The result is 0.23.'
  merge: -1
  img_proc: true
- pgno: 134
  md: "# Accessing raster values with the matrix notation\n\nSince a raster band is\
    \ a two-dimensional object, it is frequently more useful to access its values\
    \ using a two-dimensional notation. As with matrix objects, the first element\
    \ of the two-dimensional index refers to rows and the second element refers to\
    \ columns. For example, values 1-5 (in vector terms) of raster r[[1]] occupy row\
    \ 1, columns 1-5. We can refer to these same values using a two-dimensional notation\
    \ as follows:\n\n```\n> r[[1]] [1, 1:5]\n[1] 0.4242 0.3995 0.4190 0.4272 0.4285\n\
    ```\n\nNote that, even though we are using a two-dimensional notation to subset\
    \ the raster, the values are still returned in the form of a one-dimensional numeric\
    \ vector.\n\n# Subsets involving more than one layer\n\nIn the last two sections,\
    \ we accessed a subset of raster values confined to a single layer. What happens\
    \ when we subset both the row/column and layer dimensions of a raster? In that\
    \ case, we get a matrix object, rather than a vector, with columns referring to\
    \ layers and rows referring to raster cells. For example, using the following\
    \ expression, we are referring to the values occupying row 1, columns 1-5, and\
    \ layers 1-3:\n\n```\n> r[[1:3]] [1, 1:5]\n      modis.1 modis.2 modis.3\n[1,]\
    \  0.4242  0.4518  0.4211\n[2,]  0.3995  0.3334  0.4123\n[3,]  0.4190  0.3430\
    \  0.4314\n[4,]  0.4272  0.3430  0.4761\n[5,]  0.4285  0.5814  0.4761\n```\n\n\
    As a result, we get a matrix with three columns (corresponding to layers 1-3)\
    \ and five rows (corresponding to the requested five cells, ordered from the top-left\
    \ corner rightwards). Indeed, the values in the first column of the matrix are\
    \ identical to the values of the vector we got in the previous two examples.\n\
    \nAs another example, we can examine the course of NDVI over time at a single\
    \ pixel—for example, in row 45, column 33—by omitting the band index this time\
    \ (and thus referring to all bands at once):\n\n```\n> v = r[45, 33][1, ]\n```"
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Note that with `r[45,33]`, we get a matrix object with 280 columns (since we
    access all 280 bands of raster `r`) and a single row (since we access a single
    cell). Then, with the `[1,]` part, we select the first (and only) row in that
    matrix, containing the values of the (45,33) cell across all bands. As we witnessed
    earlier, a single matrix row is by default simplified to a vector. Finally, we
    assign the vector of NDVI values to `v`.


    To plot the resulting NDVI time series, now held in `v`, we will use the date
    column in the `dates` table (see the previous chapter), which lists the dates
    of acquisition for each band in `r`. We will also specify the labels for the x
    and y axes, using parameters `xlab` and `ylab` of the `plot` function, respectively:


    ```

    > plot(v ~ dates$date, type = "l", xlab = "Time", ylab = "NDVI")

    ```


    The resulting graphical output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_135_0.png)


    We can clearly see the periodical behavior of NDVI at the annual scale; NDVI increases
    in winter (the wet season), when vegetation is more abundant, and declines in
    summer (the dry season), when vegetation desiccates. Lower-than-usual NDVI values
    have been observed from 2009 to 2011 due to a drought period the region experienced
    at the time.


    In all subset methods we have seen in the last three sections, the result was
    automatically converted to a simpler object, either to a vector (when dealing
    with values from a single band) or a matrix (when dealing with values from several
    bands). If we want to suppress the simplification, we can specify `drop=FALSE`,
    the same way we have seen regarding subsets of a `data.frame` object (see the
    previous chapter) and a `matrix` object. In the following example, using `drop=FALSE`
    yields a subset `RasterBrick` object named `u` that has the first two rows, two
    columns, and three layers of the original raster `r`:


    ```

    > u = r[[1:3]][1:2, 1:2, drop = FALSE]

    ```'
  merge: -1
  img_proc: true
- pgno: 136
  md: "Plotting the object will demonstrate that u is indeed a 2 x 2 raster with three\
    \ layers. The following expression plots the raster u:\n\n```\n> levelplot(u,\
    \ layout = c(3,1), par.settings = RdBuTheme)\n```\n\nUsing the parameter layout,\
    \ we specified that the bands should be arranged in a single row and three columns\
    \ within the plot area. The following screenshot shows what the plot will look\
    \ like:\n\n![](img/ebfd6294770b225fdeceda9a7b8b560e_136_0.png)\n\n# Transforming\
    \ a raster into a matrix or an array\n\nAt times, it can be useful to transform\
    \ a raster into a simpler data structure, such as a matrix or an array. One of\
    \ the reasons to do that is to perform faster calculations (see Chapter 6, Modifying\
    \ Rasters and Analyzing Raster Time Series). The transformations can be achieved\
    \ using functions such as as.matrix and as.array, respectively.\n\nFor example,\
    \ a single layer of a raster can be transformed into a matrix as follows:\n\n\
    ```\n> as.matrix(u[[1]])\n     [,1]   [,2]\n[1,] 0.4242 0.3995\n[2,] 0.4495 0.2925\n\
    ```\n\nA multiband raster can be transformed into an array as follows:\n\n```\n\
    > as.array(u[[1:2]])\n, , 1\n\n     [,1]   [,2]\n[1,] 0.4242 0.3995\n[2,] 0.4495\
    \ 0.2925\n```"
  merge: -1
  img_proc: true
- pgno: 137
  md: "```\n[,1]  [,2]\n[1,] 0.4518 0.3334\n[2,] 0.4846 0.3223\n```\n\nIf we try to\
    \ convert a multiband raster into a matrix with as.matrix, we will get a matrix\
    \ with rows representing cells and columns representing layers, as we have seen\
    \ earlier in the context of raster subsetting:\n\n```\n> as.matrix(u[[1:2]])\n\
    \      layer.1 layer.2\n[1,]  0.4242  0.4518\n[2,]  0.3995  0.3334\n[3,]  0.4495\
    \  0.4846\n[4,]  0.2925  0.3223\n```\n\n# Overlay and reclassification of rasters\n\
    \nIn this section, we will introduce two basic operations involving rasters: performing\
    \ mathematical operations between overlapping rasters and reclassifying the values\
    \ of a raster into new aggregated categories.\n\n# Raster algebra and overlay\
    \ operations\n\nIn many cases, when we have two or more overlapping rasters, we\
    \ would like to apply a certain function on each pair, triplet, and so on of overlapping\
    \ pixels in those rasters. As a result, we will get a new raster, where the value\
    \ of each pixel is the result of the latter function on the respective pixels\
    \ in the input rasters. Such operations are also referred to as raster algebra,\
    \ usually when using straightforward arithmetic notation (such as r+s, where r\
    \ and s are rasters) or overlay operations.\n\nThere are numerous functions that\
    \ can be used in raster algebra expressions, including arithmetic operators (such\
    \ as +, -, *, and /), logical operators (such as >, >=, <, <=, ==, and !), and\
    \ several simple functions (such as min, max, and sum). Numeric values can also\
    \ be combined with rasters (as long as the first object in the expression is a\
    \ raster), in which case the numeric values are recycled as if to form a raster\
    \ where all the values are equal to the given numeric value. For example, if r\
    \ is a raster, r+1 would yield a new raster, where 1 is recycled and added to\
    \ each of the values in raster r. Similarly, the expression r*2 would yield a\
    \ raster where each value is multiplied by 2. A single band raster can also be\
    \ combined with a multiband raster, in which case the single band raster is recycled."
  merge: -1
  img_proc: true
- pgno: 138
  md: 'For example, the following expression will give us a new raster with the minimal
    NDVI values observed in each pixel over the 280 layers of raster r, excluding
    NA values:


    ```

    > min_ndvi = min(r, na.rm = TRUE)

    ```


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_138_0.png)


    In cases where we would like to apply a certain function on the values of the
    raster (rather than performing an overlay operation), we need to apply the respective
    function on the vector of raster values, rather than on the raster object itself.


    For example, to find out the minimum value among all cells in the first band of
    raster r, we will have to use the following expression:


    ```

    > min(r[[1]][], na.rm = TRUE)

    [1] 0.007

    ```


    Applying the min function on the raster itself, with min(r[[1]], na.rm=TRUE),
    is an overlay operation. It is not what we want to do in this case since an overlay
    would give us a new raster where each cell contains the minimal observed value
    among all bands of the input raster. The result will be r[[1]] itself since there
    is only one band to choose from.


    Using the range function on the multiband raster r would give us a new raster
    with two bands (since the function returns a vector of length 2), one with the
    minimal values observed in each pixel and the other with the maximal values observed
    in each pixel:


    ```

    > range_ndvi = range(r, na.rm = TRUE)

    ```


    We can examine the range_ndvi result by plotting it with the levelplot function
    (this time, showing contours with contour=TRUE):


    ```

    > levelplot(range_ndvi, par.settings = RdBuTheme, contour = TRUE)

    ```'
  merge: -1
  img_proc: true
