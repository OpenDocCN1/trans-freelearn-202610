- pgno: 164
  md: 'The following screenshot shows the graphical output with the GPS route (in
    yellow) on top of the true-color Landsat image, which is generated as a result
    of the last two expressions:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_164_0.png)


    The additional plotRGB parameters we used, stretch and ext, specify the type of
    stretch and the required extent, respectively. Stretching is essentially a transformation
    from a raster value (which in this case is between 0 and 1) to an RGB color model
    value (between 0, which is the darkest, and 255, which is the brightest). The
    simplest option is lin, which specifies a linear stretch. Supplying an Extent
    object to the ext parameter allows us to zoom in and plot only a portion of the
    raster. In this case, we use the extent of the track layer, plus a 10 kilometer
    buffer on all sides, with the expression extent(track)+10000 (note that all distance-related
    calculations are in CRS units; in this case, meters). When adding the second layer
    (track), we use the col parameter to specify the required line color; in this
    case, "yellow".'
  merge: -1
  img_proc: true
- pgno: 165
  md: "R has excellent capabilities to use colors and color gradients in the graphical\
    \ output, which are mostly beyond the scope of this book. In short, there are\
    \ three main methods to specify colors in R:\n\n+   - **Color name:** For example,\
    \ `\"yellow\"`\n+   - **Position on a color palette:** For example, `rainbow(12)[3]`,\
    \ which gives the third color in a 12-color rainbow palette, which is a kind of\
    \ yellow\n+   - **Position within the RGB color model:** For example, `rgb(1,1,0)`,\
    \ which returns the hex code `\"#FFFF00\"` that corresponds to pure yellow\n\n\
    For the purposes of this book, the first method, involving the predefined color\
    \ names, will mostly be sufficient (a list of available colors can be obtained\
    \ using the expression `colors()`). We are, in fact, also using color palettes\
    \ although indirectly through graphical functions such as `levelplot` (see the\
    \ previous chapter). We will see an example of how to directly use a color palette\
    \ in *Chapter 9, Advanced Visualization of Spatial Data*.\n\n# Working with the\
    \ geometrical properties of vector layers\n\nSpatial objects have a wide range\
    \ of properties related to their geometry; some are instantly available as part\
    \ of the data structure itself (for example, the coordinates of points in a point\
    \ layer); others are derivable via geometrical calculations (for example, the\
    \ area sizes of polygons).\n\nThe coordinates of a point layer can be obtained\
    \ using the coordinates function:\n\n```\n> coordinates(airports)\n          lon\
    \      lat\n[1,] -106.6168 35.04918\n[2,] -106.7947 35.15559\n[3,] -106.0731 35.62866\n\
    ```\n\nThe result is a matrix object with the number of rows corresponding to\
    \ the number of points the layer consists of."
  merge: -1
  img_proc: true
- pgno: 166
  md: 'To derive more complex properties, the rgeos package, which stands for R interface
    to Geometry Engine Open Source (GEOS), offers a range of functions for geometrical
    operations involving vector layers. The available geometrical operations can conceptually
    be divided into three groups according to the output they produce:


    +   - **Numeric values**: Obtained from functions that summarize geometrical properties
    (for example, calculating area sizes)

    +   - **Logical values**: Obtained from functions that evaluate whether a certain
    geometrical property (for example, whether the given geometry is valid), or the
    relation between objects (for example, whether feature A intersects with feature
    B), holds true

    +   - **Spatial layers**: Obtained from functions that create a new layer based
    on an input layer (for example, finding polygon centroids) or a pair of layers
    (for example, finding the intersecting area of feature A with feature B)


    Several examples of functions for each type of these operations will be provided
    in this chapter, while some of the additional functions will only be mentioned
    for reference.


    > For a complete list of functions that the rgeos package offers, refer to the
    help pages of the package available at http://cran.r-project.org/web/packages/rgeos/rgeos.pdf.


    As an example of a function that returns numeric values, the gArea function can
    be used to calculate the area size of polygons. For example, we can calculate
    the area covered by the county polygons as follows:


    ```

    > library(rgeos)

    > gArea(county) / 1000^2

    [1] 7784859

    ```


    The area is given in the units of the projection, in this case m²; dividing the
    result by 1000² transformed the area figure to km² units. According to Wikipedia,
    the land area of the contiguous U.S. is 7,663,942 km², which is close enough to
    our result (given that the CRS and level of detail affect the calculation).'
  merge: -1
  img_proc: true
- pgno: 167
  md: "If we want to calculate the area of each feature (each county, in this case),\
    \ rather than the area of the layer as a whole, we need to specify byid=TRUE.\
    \ The byid parameter determines whether we wish to perform the calculation by\
    \ ID, that is, for each feature separately. This parameter is present in many\
    \ of the functions in the rgeos package with the same functionality, as we shall\
    \ see in the subsequent examples. The following expression returns a numeric vector\
    \ with the area of each feature in the county layer in km². The vector is immediately\
    \ assigned to a new column in the county layer, named area:\n\n```\n> county$area\
    \ = gArea(county, byid = TRUE) / 1000^2\n```\n\nNow the attribute table of a county\
    \ contains an extra column with the area size for each county. We can confirm\
    \ this by printing the first few rows of the attribute table:\n\n```\n> head(county@data)\n\
    \      NAME_1      NAME_2 TYPE_2  FIPS    area\n0 Connecticut Litchfield County\
    \ 09005 2451.876\n1 Connecticut   Hartford County 09003 1941.110\n2 Connecticut\
    \    Tolland County 09013 1077.789\n3 Connecticut    Windham County 09015 1350.476\n\
    4  California   Siskiyou County 06093 16416.572\n5  California  Del Norte County\
    \ 06015 2626.707\n```\n\nAs an example of an operation where a new spatial layer\
    \ is created, we will dissolve the county polygons into state polygons. For simplicity,\
    \ we will perform the dissolving on a subset of county, including only two states:\
    \ Nevada and Utah. At first, we will create the subset and assign it to a new\
    \ object named county_nv_ut:\n\n```\n> county_nv_ut = county[county$NAME_1 %in%\
    \ c(\"Nevada\", \"Utah\"), ]\n```\n\nNow, we will dissolve the county_nv_ut polygons\
    \ using the gUnaryUnion function. The two arguments transferred to this function\
    \ are the layer to be dissolved and the ID, a vector defining the features that\
    \ should be aggregated (all features with identical levels will be dissolved into\
    \ one). If the id argument is omitted, all polygons are dissolved into one, as\
    \ we shall see in subsequent examples. Here is the code for dissolving our current\
    \ layer:\n\n```\n> states = gUnaryUnion(county_nv_ut, id = county_nv_ut$NAME_1)\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 168
  md: 'In the present case, the state name column (NAME_1) was passed as the ID and
    thus, all the counties that form a single state were dissolved into state polygons.
    Since rgeos deals with the geometrical component of vector layers, the returned
    object of gUnaryUnion (and, as we shall see, of other functions in this package)
    has no attribute table. In this case, for example, while the input county_nv_ut
    was a SpatialPolygonsDataFrame object, the output states is a SpatialPolygons
    object. Then, how will we be able to tell which polygon corresponds to which state?
    The answer is that the information is recorded in the ID codes of the resulting
    layer and can be obtained using the row.names function. Using this function, we
    can find out that the first feature in states corresponds to "Nevada" and the
    second to "Utah":


    ```

    > row.names(states)

    [1] "Nevada" "Utah"

    ```


    To get a better understanding of what we just did, it would be helpful to visualize
    the dissolved states'' polygons on top of the original county_nv_ut polygons.
    We can produce a simple plot using two plot function calls (specifying add=TRUE
    the second time):


    ```

    > plot(county_nv_ut, border = "lightgrey", lty = "dotted")

    > plot(states, add = TRUE)

    ```


    Note that the border parameter of plot is used to indicate the polygon border
    color (rather than col, which, in the case of polygons, refers to fill color).
    An additional argument is lty (which stands for the line type), which specifies
    that we want the county borders to be dotted.


    > There are six line types available in R. See the full list at the entry concerning
    the lty parameter on the ?par help page.


    The resulting output is not presented since we are not done just yet. An additional
    layer in our plot is going to consist of labels for county names. Text labels
    can be added to an image created with a plot using the text function. With text,
    we need to supply a set of coordinates defining where the labels will be plotted
    (for example, using a matrix object with two columns, for x and y), and the text
    to be written at each coordinate (for example, using a character vector).


    The most straightforward option would be to place the labels at the centroids
    of each county. For this, we first have to find the centroid coordinates using
    yet another function from rgeos that returns a new layer based on a single input
    layer called gCentroid:


    ```

    > county_ctr = gCentroid(county_nv_ut, byid = TRUE)

    ```'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'The resulting `SpatialPoints` object was assigned to `county_ctr`. Since `byid=TRUE`
    was specified, the layer contains the centroids of the individual counties, rather
    than the centroid of the whole `county_nv_ut` layer.


    We can supply `county_ctr` along with the vector of labels (which we get from
    the `NAME_2` column of `county_nv_ut`) to the text function. The additional parameter
    `cex` defines the labels font size in relative units (1.5 times the default size):


    ```

    > text(county_ctr, county_nv_ut$NAME_2, cex = 1.5)

    ```


    The final graphical output, produced by the two `plot` functions and one `text`
    function call, is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_169_0.png)


    The plot shows the dissolved state polygons (in black), the original county polygons
    (in dotted gray), and county names (as text labels).'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'Many of the functions in the rgeos package cannot handle geometries that are
    invalid from the topological point of view. For example, when referring to polygons,
    a valid layer does not contain self-intersecting polygons (polygons whose boundary
    crosses itself). Examining whether a given layer is valid or not can be done using
    the gIsValid function, which returns TRUE for valid features (either for the layer
    as a whole, by default, or for each feature separately when specifying byid=TRUE).
    Searching for and resolving topological errors, however, is best done interactively.
    Thus, GIS software (such as QGIS) is more suitable for this task than R.


    # Spatial relations between vector layers


    In this section, you will learn how to perform operations involving pairs of vector
    layers. These types of operations are very common in spatial data analysis. We
    often want to know, for instance:


    +   - What are the distances of different resorts from the nearest coastline?

    +   - Which houses are within a radius x of the epicenter of an earthquake?

    +   - Which parts of the habitat of an endangered species are contained within
    protected nature reserves?


    All of these operations require the overlay of features from two distinct layers,
    although, as we have seen earlier, the result can be:


    +   - A numeric value (the distance from a resort to the nearest coastline is
    50 meters)

    +   - A logical value (the house is within a distance of 10 kilometers of the
    earthquake epicenter)

    +   - A spatial layer (a polygon defining the intersecting area between the natural
    distribution of the endangered species and nature reserves)


    In this section, we will see examples of all three kinds of operations.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# # Querying relations between vector layers


    Querying relations between two layers is required when we would like to do one
    of the following:


    +   - Assign data from the attribute table of one feature to another (for example,
    polygon A gets the attribute table entry of polygon B it intersects with)

    +   - Examine whether a specific relation exists between features (for example,
    we get TRUE if polygon A is completely within polygon B, or FALSE otherwise)


    In GIS terminology, the first type of operation is sometimes referred to as a
    spatial join or a join by spatial location. The way it can be done in R will be
    demonstrated using the `airports` and `county` layers. The second type of operation
    (examining relations) will be demonstrated using another example, involving layers
    of buildings and natural areas in London.


    The `over` function provides consistent functionality to join the attribute table
    data from one spatial object to another based on their intersection. All nine
    possible types of relations are permitted (point/line/polygon with point/line/polygon),
    either via the `sp` package (point-point, point-polygon, and polygon-point) or
    `rgeos` (all other combinations). The over function accepts two spatial layers
    (parameters x and y). The function call `over(x,y)` then returns—for all features
    in the first layer (x)—the attribute table entries (or indices, if the layer has
    no attribute table) of the second layer (y) that intersect it. The related syntax
    `x[y,]`, when both x and y are vector layers, serves as a shortcut to over when
    we are interested in subsetting the vector layer x according to intersection.
    The latter function call returns only those features in x that intersect with
    a feature in y.


    As already mentioned, our first example of querying relations between layers will
    involve the `airports` and county layers. The first preliminary step, as always,
    is to bring both layers to a common CRS. In this case, we will reproject `airports`
    to the CRS of `county`:


    ```

    > airports = spTransform(airports, CRS(proj4string(county)))

    ```


    We will now plot airports on top of the county layer to visually examine their
    relation so that we know what to expect later. Since we already know that all
    three airports are located in New Mexico, we will work with a subset of county,
    called nm, containing only the counties of New Mexico:


    ```

    > nm = county[county$NAME_1 == "New Mexico", ]

    > plot(nm)

    > plot(airports, col = "red", pch = 16, add = TRUE)

    ```'
  merge: -1
  img_proc: true
- pgno: 172
  md: "Note that we used yet another parameter of the plot function, pch, to choose\
    \ a different point shape (16 corresponds to the filled circles, while the default\
    \ argument is a plus symbol +).\n\nThere are 26 point shapes available. The possible\
    \ shapes and their code are listed in the ?points help page.\n\nThe following\
    \ screenshot shows the graphical output that is produced:\n\n![](img/ebfd6294770b225fdeceda9a7b8b560e_172_0.png)\n\
    \nWe can see that two of the airports fall within (thus, by definition, also intersect)\
    \ a single county, while the third airports falls within a different county. Using\
    \ over with airports and nm (in that order) will return the following output:\n\
    \n```\n> over(airports, nm)\n      NAME_1   NAME_2 TYPE_2  FIPS    area\n```"
  merge: -1
  img_proc: true
- pgno: 173
  md: "```\n1 New Mexico Bernalillo County 35001 3023.909\n2 New Mexico Bernalillo\
    \ County 35001 3023.909\n3 New Mexico   Santa Fe County 35049 4944.339\n```\n\n\
    Indeed, we see that the first two rows are identical since the first two airports\
    \ are located in the same county (Bernalillo county). To examine specifically\
    \ which airport falls within each county, we can bind the result of `over` with\
    \ the attribute table of airports:\n\n```\n> cbind(airports@data, over(airports,\
    \ nm))\n                         name       NAME_1       NAME_2 TYPE_2  FIPS\n\
    1 Albuquerque International New Mexico Bernalillo County 35001\n2            \
    \     Double Eagle II New Mexico Bernalillo County 35001\n3              Santa\
    \ Fe Municipal New Mexico     Santa Fe County 35049\n                        \
    \ area\n1 3023.909\n2 3023.909\n3 4944.339\n```\n\nNow we can tell that the Albuquerque\
    \ International and Double Eagle II airports are located within Bernalillo County,\
    \ while the Santa Fe Municipal airport is located within Santa Fe County. To permanently\
    \ incorporate the county information into the attribute table of airports, we\
    \ can assign the combined table back to the attribute table slot of airports,\
    \ with an expression such as `airports@data=cbind(airports@data,over(airports,nm))`.\n\
    \nExamining the opposite relation (when nm is x and airports is y), we can, for\
    \ example, subset those counties that intersect with at least one airport using\
    \ the expression `nm[airports,]`. As noted earlier, using `[` with two vector\
    \ layers is in fact a shortcut used to retain those features of x that intersect\
    \ with y. In this case, an equivalent `over` expression would be `nm[!is.na(over(nm,airports)$name),]`,\
    \ but using `nm[airports,]` is obviously more convenient.\n\nWe can plot the `nm[airports,]`\
    \ subset to demonstrate the behavior:\n\n```\n> plot(nm[airports, ])\n> plot(airports,\
    \ add = TRUE, col = \"red\", pch = 16, cex = 1.5)\n> text(airports, airports$name,\
    \ pos = 1)\n```"
  merge: -1
  img_proc: true
- pgno: 174
  md: 'The additional `pos` parameter of the `text` function controls the position
    of the text with respect to the point coordinates (the default behavior we previously
    witnessed is to place the text centered on the coordinates point itself, with
    `pos=1` the text is placed below the point; see ?text for all options). The following
    screenshot shows the graphical output that is produced as a result of the three
    function calls:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_174_0.png)


    We can see that `nm[airports,]` indeed consists of only those `nm` features that
    intersect airports.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'If we try to match the `airports` attribute table entries to `nm` (with `over(nm,
    airports)`), only the first airport that intersects each county will be returned
    in cases where there are multiple matches. If we wish to preserve all matches,
    we need to specify `returnList=TRUE` in the `over` function call. However, the
    returned object will be a `list` object since holding sets of elements with variable
    lengths requires a `list` rather than a `data.frame` object. Many of the more
    advanced uses of R that require such flexibility involve `list` objects. However,
    the subject is beyond the scope of this book. More information on lists can be
    found in the official R''s introduction document at http://cran.r-project.org/doc/manuals/r-release/R-intro.pdf
    and in most introductory books on R.


    As an example of querying polygon-polygon relations, we will use another example
    involving three polygonal Shapefiles:


    +   - Administrative areas of England and Wales (`CTYUA_DEC_2013_EW_BFE.shp`)

    +   - Buildings in Greater London (`london_buildings.shp`)

    +   - Natural areas in Greater London (`london_natural.shp`)


    The datasets were downloaded from freely accessible online resources, either from
    the Office of National Statistics at https://geoportal.statistics.gov.uk/ (administrative
    areas) or OpenStreetMap (buildings and natural areas).


    First, we will read the files into R and bring them to a common CRS. We will begin
    with the administrative areas layer, reading it from the disk and naming it boundary:


    ```

    > boundary = readOGR("C:\\Data", "CTYUA_DEC_2013_EW_BFE")

    ```


    Using the `proj4string` function reveals the CRS of boundary — the British National
    Grid. Note that the resulting string is abbreviated in the following output since
    it does not fit in a single line:


    ```

    > proj4string(boundary)

    [1] "+proj=tmerc +lat_0=49 +lon_0=-2 +k=0.9996012717 +x_0=400000 $"

    ```


    Next, we will read the two OpenStreetMap layers:


    ```

    > buildings = readOGR("C:\\Data", "london_buildings")

    > natural = readOGR("C:\\Data", "london_natural")

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Both these layers are defined in a geographical CRS, as the following output
    demonstrates:


    ```

    > proj4string(buildings)

    [1] "+proj=longlat +datum=WGS84 +no_defs +ellps=WGS84 +towgs84=0,$

    > proj4string(natural)

    [1] "+proj=longlat +datum=WGS84 +no_defs +ellps=WGS84 +towgs84=0,$

    ```


    We will reproject the buildings and natural layers to the CRS of boundary:


    ```

    > buildings = spTransform(buildings, CRS(proj4string(boundary)))

    > natural = spTransform(natural, CRS(proj4string(boundary)))

    ```


    Now that the preliminary preparations are complete, we can continue with the exercise.
    Our goal will be to assign the distance to the River Thames to each of the buildings
    within the City of London. For this, we will go through the following intermediate
    steps:


    +   1. Create a subset of buildings with only those in the City of London.

    +   2. Create a subset of natural with only the riverbanks.

    +   3. Dissolve the riverbank features into a single one.

    +   4. Calculate the distance between each feature in buildings and the riverbank.


    The administrative boundaries layer comes with an explanatory file (Product Specification
    for CTYUA_2013_EW_BFE.docx, which is also provided on the book''s website), where
    we can find out that the names of the different administrative areas are defined
    in the CTYUA13NM column of the attribute table of this layer. Using this column,
    we will create a subset, named city, containing only the polygon defining the
    city of the London administrative area:


    ```

    > city = boundary[boundary$CTYUA13NM == "City of London", ]

    ```


    Using the city polygon, we will create a subset of only those buildings that are
    within the City of London. If we were interested in intersection (in other words,
    buildings that are completely or incompletely within the city polygon), we could
    use the [ or over methods as already shown earlier. To evaluate other types of
    relationships, the rgeos package provides a dozen additional functions: gContains,
    gContainsProperly, gCovers, gCoveredBy, gCrosses, gDisjoint, gEquals, gEqualsExact,
    gIntersects, gTouches, gOverlaps, and gWithin. The names of these functions already
    provide a clue for the relationship they are used to evaluate; the exact definitions
    are provided in the respective help page of each function.'
  merge: -1
  img_proc: true
- pgno: 177
  md: "Since in our example we are interested in creating a subset of the `buildings`\
    \ features that are contained within `city`, we are going to use the function\
    \ that evaluates containment—`gContains`. According to the help page of gContains,\
    \ the expression `gContains(city,buildings)` will return TRUE for buildings features\
    \ that are contained within city. Specifying `byid=TRUE` is necessary to evaluate\
    \ the relation separately for each feature:\n\n```\n```r\n> in_city = gContains(city,\
    \ buildings, byid = TRUE)\n```\n```\n\nThe result, `in_city`, is a two-dimensional\
    \ matrix with rows corresponding to the buildings features (210,937 buildings\
    \ in Greater London) and columns corresponding to the city features (there is\
    \ only one, the City of London; if we had more than one feature in `city`, we\
    \ would have had more columns):\n\n```\n```r\n> class(in_city)\n[1] \"matrix\"\
    \n> head(in_city)\n     119\n0 FALSE\n1 FALSE\n2 FALSE\n3 FALSE\n4 FALSE\n5 FALSE\n\
    ```\n```\n\nThe first (and only) column of this matrix is a logical vector specifying\
    \ the containment status of each building within the city polygon. Using this\
    \ vector as a rows index for `buildings` creates a subset of only those buildings\
    \ within city:\n\n```\n```r\n> buildings = buildings[in_city[, 1], ]\n```\n```\n\
    \nThe first step is now complete. Returning to the natural layer, we will now\
    \ subset the polygons of type `\"riverbank\"` (which in the vicinity of the City\
    \ of London corresponds to the River Thames):\n\n```\n```r\n> river = natural[natural$type\
    \ == \"riverbank\", ]\n```\n```\n\nAs the third step, we will dissolve the separate\
    \ river segments since we will be interested in the shortest distance to any section\
    \ of the river, rather than the distances to its specific parts. As previously\
    \ shown in the county example, dissolving can be achieved with `gUnaryUnion`.\
    \ This time, the `id` parameter is left unspecified so that all geometries will\
    \ be dissolved into a single one:\n\n```\n```r\n> river = gUnaryUnion(river)\n\
    ```\n```"
  merge: -1
  img_proc: true
