- pgno: 298
  md: 'The ggplot2 package is extremely flexible. Due the abundance of functions and
    usage options, the variety of plots it is capable of producing is mainly limited
    by the users'' knowledge and expertise. However, this abundance can be overwhelming
    for beginners. In addition, the ggplot2 syntax is hard to grasp at first, both
    conceptually and practically. Nevertheless, those who overcome the initial difficulties
    are greatly rewarded.


    The purpose of this chapter is to present, through examples, some of the most
    important points to note when using ggplot2 to display spatial data. Obviously,
    we cannot cover all plot types and their optional modifications (even a standalone
    book cannot accomplish such a task). What we can do is provide the initial knowledge
    sufficient for orientation. The subsequent usage of ggplot2 will inevitably require
    trial and error, as well as looking for help online. In addition, the following
    sources of information on ggplot2 are highly recommended:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_298_0.png)


    +   - The ggplot2 package is fortunately accompanied by a highly comprehensive
    collection of help pages (http://docs.ggplot2.org/), where all functions and arguments
    are reviewed – in most cases with code and graphical output examples.

    +   - Winston Chang''s book R Graphics Cookbook, O''Reilly Media, which was published
    in 2012, is notable for providing an extensive coverage in the form of precise
    recipes for visualization using ggplot2 (although there are relatively few examples
    involving spatial data).

    +   - Readers interested in more information on the theoretical background of
    ggplot2 can refer to the absorbing book by the package author Wickham, H. ggplot2:
    Elegant Graphics for Data Analysis, Springer, 2009. Some of the code sections
    in that book are slightly outdated (the package has evolved since the book was
    published), but this does not affects the book''s utility.


    Each expression used to create a plot with ggplot2 is made up of several components
    as we shall see shortly. It starts with the ggplot function call (such as ggplot(dat,
    aes(x=time, y=tmax))), followed by additional layers'' definitions and settings.


    At the core of each plot created with ggplot2 are the layers, with each layer
    necessarily associated with a given geometry and the data used to draw the layer.
    A plot with no layers cannot be produced since there will be nothing to show:


    ```

    > ggplot(dat, aes(x = time, y = tmax))

    Error: No layers in plot

    ```'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'Layers are added to a plot using the + operator, and the data used to create
    the layer, as well as the aesthetic mapping (the link between the data and layers''
    aesthetic appearance), are specified as arguments either in the ggplot function
    (setting them as global arguments for this particular plot) or in the respective
    layer function (setting them as local arguments for the particular layer only).


    The most straightforward way to create a layer is to use the layer function, where
    we can (rather verbosely) specify all of the layer characteristics. The preceding
    plot, for instance, can also be produced with the following expression, which
    demonstrates that geom_line is a layer with a predefined "line" geometry and "identity"
    statistical transformation (this means that there is no statistical transformation;
    the values are taken as is), among other default definitions that remain hidden
    (such as colour="black" for line color):


    ```

    ggplot(data = dat, aes(x = time, y = tmax)) +

    + layer(geom = "line", stat = "identity")

    ```


    However, in practice, layers are most often specified using predefined layer functions
    rather than the layer function. These functions'' names start with geom (such
    as geom_line) or stat (such as stat_contour). There is no conceptual difference
    between these two types of functions; the difference is just in their defaults—the
    latter emphasizes statistical transformations while the former does not; therefore,
    each type of function may be easier to use for a given purpose. However, it should
    be remembered that the settings of any given layer can be overridden, so in many
    cases the geom and stat layers are redundant in terms of the desired result. For
    example, exactly the same layer of contours can be produced with either geom_contour
    or stat_contour.


    In general, each layer is composed of the following five components:


    +   - The geometry the layer follows (this is already encompassed in the layer
    function name, for example, geom_line)

    +   - The data.frame object where the data come from (for example, dat)

    +   - The definition of the link between the data and layer appearance, that is,
    aesthetic mapping inside the aes function (for example, aes(x=time,y=tmax)) or
    the definition of appearance unrelated to the data, that is, aesthetic setting
    outside the aes function

    +   - The statistical transformation that manipulates the data prior to aesthetic
    mapping (we will not use this here)

    +   - A position adjustment to deal with overlapping graphical objects (we will
    not use this here)'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'A function to create a layer (such as `geom_line`) already encompasses defaults
    for the `geom` (geometry) and `stat` (statistical transformation) parameters;
    it is rarely necessary to override these in practice. For our purposes in this
    chapter, we will also not have to deal with position adjustments; these are most
    useful in nonspatial plots such as histograms and boxplots. Therefore, there are
    just two parameters we will usually modify in the ggplot2 layers—the data and
    aesthetic mappings (and, optionally, aesthetic settings). For example, the previous
    plot of `tmax` as a function of `time` has only one layer and the geometry type
    of that layer is "line". The function used to create the layer is named `geom_line`,
    accordingly. The `data.frame` object from where the `time` and `tmax` values come
    is `dat`, with `time` mapped to x (the x axis aesthetic) and `tmax` mapped to
    y (the y axis aesthetic).


    The following table lists the specific layer functions we will use in this chapter
    in order to produce several common types of layers. The table also shows the set
    of required and optional parameters of each function. The required parameters
    (or aesthetics) of a given layer control its geometry and so, a layer cannot be
    drawn without them. For example, the `geom_line` function requires a set of x
    and y coordinates since no line can be drawn without these. As we shall see, in
    practice the required parameters are always mapped to variables in our data (in
    the form of an assignment within an `aes` function call). On the other hand, the
    optional parameters can either be mapped to variables in our data, set at constant
    values or left unspecified (in which case, they are set to their default constant
    values, such as `colour="black"` for `geom_line`, giving the line its default
    black color).


    | Function name | Required parameters | Optional parameters |

    |---|---|---|

    | `geom_line` | x, y | alpha, colour, linetype, size |

    | `geom_histogram` | x | alpha, colour, fill, linetype, size, weight |

    | `geom_point` | x, y | alpha, colour, fill, shape, size |

    | `geom_text` | label, x, y | alpha, angle, colour, family, fontface, hjust, lineheight,
    size, vjust |

    | `geom_path` | x, y | alpha, colour, linetype, size |

    | `geom_contour` | x, y | alpha, colour, linetype, size, weight |

    | `geom_density2d` | x, y | alpha, colour, linetype, size |

    | `geom_polygon` | x, y | alpha, colour, fill, linetype, size |

    | `geom_raster` | x, y | alpha, fill |'
  merge: -1
  img_proc: true
