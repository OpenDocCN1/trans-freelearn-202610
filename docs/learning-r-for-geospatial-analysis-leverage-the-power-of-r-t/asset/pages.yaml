    ```


    To save us the need of manually removing missing values from a vector prior to
    such calculations, many functions that require all values to be non-missing (such
    as mean, min, and max) have a parameter called na.rm to indicate whether we would
    like to remove the missing values before executing the calculation. The default
    for this parameter is FALSE (which means that we do not remove the NA values);
    if we would like the opposite, we need to specify na.rm=TRUE:


    ```

    ```r

    > x = c(3,8,2,NA,1,7,5,NA,9)

    > mean(x)

    [1] NA

    > mean(x, na.rm = TRUE)

    [1] 5

    > max(x)

    [1] NA

    > max(x, na.rm = TRUE)

    [1] 9

    ```

