- pgno: 68
  md: "# Examining our time series\n\nLooking into the documentation on climatic data\
    \ from NOAA (which is also provided on the book's website), we can see that the\
    \ temperature is provided in tenths of Celsius degree, with missing values marked\
    \ as -9999. First, we will convert the -9999 values to NA by selecting the respective\
    \ subset and making an assignment:\n\n```\n> tmax[tmax == -9999] = NA\n```\n\n\
    Then, to convert the data into degrees Celsius units, we will divide each of the\
    \ values by 10:\n\n```\n> tmax = tmax / 10\n> tmax[1:10]\n  [1]  7.2 13.3 17.8\
    \ 18.3 11.1  6.7  7.8  8.3 13.9 15.6\n```\n\nNow, let's check the range of values\
    \ each vector contains:\n\n```\n> range(time)\n[1] \"1931-03-01\" \"2014-05-15\"\
    \n> range(tmax, na.rm = TRUE)\n[1] -14.4  41.7\n```\n\nThis means that the range\
    \ of the measured maximum daily temperatures from March 1, 1931 to May 15, 2014\
    \ was -14.4 to 41.7 degrees Celsius.\n\nRegarding the dates of measurement, looking\
    \ at the first few values of the time vector (or at the original CSV file in a\
    \ spreadsheet, for that matter), it seems that the days are consecutive. However,\
    \ we may want to make sure that all days of the respective period are indeed present\
    \ in the file. We can do this by comparing a consecutive sequence all_dates covering\
    \ the time period from March 1, 1931 to May 15, 2014 with our time vector:\n\n\
    ```\n> range_t = range(time)\n> all_dates = seq(range_t[1], range_t[length(range_t)],\
    \ 1)\n> length(all_dates)\n[1] 30392\n> length(time)\n[1] 30391\n```\n\nThis already\
    \ indicates that we have an incomplete agreement. Our time vector contains the\
    \ 30391 values, while there are 30392 dates during the time period from March\
    \ 1, 1931 to May 15, 2014. Therefore, the CSV file is missing at least one date."
  merge: -1
  img_proc: true
- pgno: 69
  md: 'We will next check how many dates (and which ones) are missing. First, we will
    verify that, indeed, not all dates appear in the time vector using the `%in%`
    operator (asking for each element in `all_dates` whether it appears in the time
    vector) and the `all` function (asking whether all of the values in the resulting
    logical vector are TRUE).


    ```

    > all(all_dates %in% time)

    [1] FALSE

    ```


    The answer is no; at least one of the dates in the range of March 1, 1931 to May
    15, 2014 is indeed missing from the time vector. The next question would be which
    one is missing, or which ones are missing? We can get the indices of the dates
    that appear in `all_dates` but not in `time` with the `which` function:


    ```

    > which(!(all_dates %in% time))

    [1] 5499

    ```


    The missing date is the 5499th element of the `all_dates` vector. Its value is
    as follows:


    ```

    > all_dates[which(!(all_dates %in% time))]

    [1] "1946-03-20"

    ```


    Manually examining the CSV file in a spreadsheet software will confirm that indeed
    the date March 20, 1946 was skipped for some reason.


    Another interesting question we can ask is on what day the highest temperature
    (which was 41.7 degree Celsius, as we saw earlier) has been observed:


    ```

    > max(tmax, na.rm = TRUE)

    [1] 41.7

    time[which.max(tmax)]

    [1] "1994-06-26"

    ```


    The highest maximum daily temperature was observed on June 6, 1994.


    # Creating subsets based on dates


    If we are interested in a particular subset of the time series, say the period
    from December 31, 2005 to January 1, 2014, we could create a subset of the dates
    in that period based on the time vector and a respective subset of data values
    based on the tmax vector. We can do this in two steps. First, we will create a
    logical vector, w, pointing at those dates we would like to keep:


    ```

    > w = time > as.Date("2005-12-31") & time < as.Date("2014-1-1")

    ```'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'To find out the ratio between the number of days we would like to keep in the
    subset and the number of days in the complete series, we can type the following
    expression:


    ```

    > sum(w) / length(w)

    [1] 0.09614689

    ```


    The amount of data within the subset we are interested in (December 31, 2005 to
    January 1, 2014) is about 9.6 percent of the total amount of data since the proportion
    of the TRUE values count in the logical vector, w, from the total number of values
    is 0.096 (remember that before summing a logical vector, it is converted to a
    numeric one with ones instead of TRUE and zeroes instead of FALSE).


    Secondly, we will use the w vector to create subsets of both the time and tmax
    vectors:


    ```

    > time = time[w]

    > tmax = tmax[w]

    ```


    Note that the selection was non-inclusive of the end dates since we used the >
    and < operators:


    ```

    > range(time)

    [1] "2006-01-01" "2013-12-31"

    ```


    If we wanted to include the first and last dates (December 31, 2005 and January
    1, 2014), we would rather use the >= and <= operators.


    # Introducing graphical functions


    The graphical representation of data is a central feature, or even the main purpose,
    of data analysis in general and of spatial data analysis in particular. This section
    serves as a basic introduction to the procedure of creating graphical output in
    R. Such an introduction is necessary before moving on to the later chapters, where
    we would like to quickly be able to display intermediate products during various
    spatial data analysis steps. In Chapter 9, Advanced Visualization of Spatial Data,
    we will devote some additional time to the subject of visualization in R, and
    see how graphical output can be customized when producing publication-quality
    plots as the end product of spatial data analysis.


    # Displaying vectors using base graphics


    We can graphically display a vector''s values using the plot function. For example,
    the following expression opens a new window within the R environment with a plot
    of the vector values:


    ```

    > plot(tmax)

    ```'
