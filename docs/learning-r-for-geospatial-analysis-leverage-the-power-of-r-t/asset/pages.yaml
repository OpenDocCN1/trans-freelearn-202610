    > format(d, "%m/%Y")

    [1] "11/1955"

    ```

    ```


    We are now ready to proceed with our example involving the time and tmax vectors.
    First, we can find out that both vectors are numeric (integers, numbers without
    a fractional component, to be precise) as follows:


    ```

    ```r

    > class(time)

    [1] "integer"

    > class(tmax)

    [1] "integer"

    ```

    ```


    Then, let''s see what the values of these vectors look like by printing the first
    10 values from each one of them:


    ```

    ```r

    > time[1:10]

    [1] 19310301 19310302 19310303 19310304 19310305 19310306

    [7] 19310307 19310308 19310309 19310310

    > tmax[1:10]

    [1]  72 133 178 183 111  67  78  83 139 156

    ```

    ```


    The time vector contains dates in the %Y%m%d configuration (year, month, and day
    indicated by full numeric values, without separating characters). Therefore, we
    can convert it to a Date object, as follows:


    ```

    ```r

    > time = as.Date(as.character(time), format = "%Y%m%d")

    > time[1:10]

    [1] "1931-03-01" "1931-03-02" "1931-03-03" "1931-03-04"

    [5] "1931-03-05" "1931-03-06" "1931-03-07" "1931-03-08"

    [9] "1931-03-09" "1931-03-10"

    > class(time)

    [1] "Date"

    ```

    ```


    Note that we first needed to convert the time vector from numeric to character
    since the as.Date function works on character vectors. Now that time is a vector
    of dates, we have more freedom to treat the data as a time series.'
