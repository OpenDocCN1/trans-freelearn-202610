- pgno: 274
  md: 'As mentioned earlier, a variogram model is a function fitted to the empirical
    variogram. There are several specific functions that are adequate to describe
    the characteristic behavior of an empirical variogram (increasing semivariance
    with distance, usually reaching saturation at some point). These functions, such
    as the spherical and exponential functions, are generally used for a variogram
    model (type `vgm()` for a list of the functions implemented in `gstat` or `show.vgms()`
    for a visual). In addition to choosing one of these functions, we need to decide
    on its specific parameters. There are three main approaches, not mutually exclusive,
    to select a variogram model: a function plus its set of parameters (based on an
    empirical variogram):


    +   - Setting the function and its parameters by hand (for example, using the
    `vgm` function from the `gstat` package)

    +   - Visually fitting a function to the empirical variogram by interactively
    varying the function type and its parameters and seeing how its appearance changes
    (for example, using the `eyefit` function from the `geoR` package)

    +   - Statistically selecting the function and parameters that minimize some goodness-of-fit
    criterion (for example, using the `fit.variogram` function from the `gstat` package,
    the `variofit` function from the `geoR` package, or the `autofitVariogram` function
    from the `automap` package)


    Since we are hereby taking a simple, practical approach, we will use the third
    option of letting the computer select the function that follows the empirical
    variogram most closely. Moreover, we are going to bypass the requirement to supply
    the function type and initial parameter estimates (as required, for example, in
    `fit.variogram`) and use a wrapper function named `autofitVariogram` that automatically
    optimizes this decision for us.


    The `autofitVariogram` function is defined in the `automap` package. It accepts
    the `formula` and `data` arguments (named `input_data`) analogously for `gstat`.
    The following expression, therefore, fits a variogram model to our data:


    ```

    > library(automap)

    > v = autofitVariogram(formula = value ~ 1, input_data = dat)

    ```


    Plotting the returned object of the `autofitVariogram` class generates a plot
    with an empirical variogram and the fitted variogram model on top of it:


    ```

    > plot(v)

    ```'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'The resulting output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_275_0.png)


    The points, once again, show an empirical variogram, while the continuous line
    is the fitted variogram model. In this case, for instance, the selected model
    was "Matern, M. Stein''s parameterization" (code name "Ste"), with the four parameter
    values stated in the bottom-right corner of the image. The object v contains several
    components, such as the empirical variogram data points and the sums of squares
    between the sample variogram and the fitted variogram model. The component we
    are interested in is the fitted variogram model. This components'' name is var_model,
    and it can be accessed with the $ operator, using the expression v$var_model (this
    behavior stems from the fact that an autofitVariogram class is built upon a list,
    and list elements can be accessed the same way as data.frame columns with $).'
  merge: -1
