- pgno: 115
  md: '# # Working with Rasters


    In this chapter, we move on to the realm of spatial data analysis in R. We begin
    by introducing the properties and usage principles of the classes used to store
    raster data in R. For that matter, we are going to first introduce the simpler
    (nonspatial) structures that are conceptually related to rasters: matrices and
    arrays. We then cover the more sophisticated classes defined in the `raster` package
    to represent spatial raster data. You will learn to create, subset, and save objects
    of these classes as well as to query the characteristics of rasters we have at
    hand. Afterwards, you will learn two basic operations involving rasters: overlay
    and reclassification. At the same time, we will see some examples of visualizing
    raster data in R to help us get a better understanding of the data we have.


    In this chapter, we''ll cover the following topics:


    +   - Using matrices to represent two-dimensional sets of numeric values

    +   - Using arrays to represent three-dimensional sets of numeric values

    +   - Using classes for single band and multiband rasters in the `raster` package

    +   - Reading and writing raster files

    +   - Exploring the properties of a given raster object

    +   - Basic visualization of rasters in R

    +   - Subsetting rasters

    +   - Converting raster objects to simpler data structures and vice versa

    +   - Performing raster algebra operations

    +   - Reclassifying raster values'
  merge: -1
  img_proc: true
- pgno: 116
  md: "# Using the matrix and array classes\n\nA raster is essentially a matrix with\
    \ spatial reference information. Similarly, a multiband raster is essentially\
    \ a three-dimensional array with spatial reference information. Therefore, before\
    \ proceeding with spatial rasters, we will cover some prerequisite material on\
    \ working with these (simpler) objects in this section — matrices and arrays.\
    \ Moreover, as we shall see later, matrices and arrays are common data structures\
    \ with many uses in R.\n\n# Representing two-dimensional data with a matrix\n\n\
    A matrix object is a two-dimensional collection of elements, all of the same type\
    \ (as opposed to a data.frame object; see the previous chapter), where the number\
    \ of elements in all rows (and, naturally, all columns) is identical. Matrix objects\
    \ have many uses in R. For example, certain functions take matrices as their arguments\
    \ (such as the focal function to filter rasters) or return matrices (such as the\
    \ extract function to extract raster values; we will meet both these functions\
    \ in the subsequent chapters).\n\nA matrix object can be created with the matrix\
    \ function by specifying its values (in the form of a vector) and dimensions as\
    \ follows:\n\n```\n> matrix(1:6, ncol = 3)\n      [,1] [,2] [,3]\n[1,]    1  \
    \  3    5\n[2,]    2    4    6\n```\n\nThe first four parameters of the matrix\
    \ function are as follows:\n\n+   - data: The vector of values for the matrix\
    \ (for example, 1:6)\n+   - nrow: The number of rows\n+   - ncol: The number of\
    \ columns (for example, 3)\n+   - byrow: Whether the matrix is filled column by\
    \ column (FALSE, which is the default value) or row by row (TRUE)\n\nThe nrow\
    \ and ncol parameters determine the number of rows and columns, respectively.\
    \ We can specify either one of these parameters, and the other will be calculated\
    \ taking into account the overall number of elements. Let's take a look at the\
    \ following example:\n\n```\n> matrix(1:6, nrow = 3)\n      [,1] [,2]\n[1,]  \
    \  1    4\n[2,]    2    5\n[3,]    3    6\n```"
  merge: -1
  img_proc: true
- pgno: 117
  md: "```\n> matrix(1:6, nrow = 2)\n      [,1] [,2] [,3]\n[1,]    1    3    5\n[2,]\
    \    2    4    6\n```\n\nNote that when the allocated number of cells is smaller\
    \ or larger than the number of values in the vector that is being used to populate\
    \ the matrix, the vector is either deprecated or recycled, respectively. Let's\
    \ take a look at the following examples:\n\n```\n> matrix(12:1, ncol = 4, nrow\
    \ = 2)\n      [,1] [,2] [,3] [,4]\n[1,]   12   10    8    6\n[2,]   11    9  \
    \  7    5\n> matrix(12:1, ncol = 4, nrow = 4)\n      [,1] [,2] [,3] [,4]\n[1,]\
    \   12    8    4   12\n[2,]   11    7    3   11\n[3,]   10    6    2   10\n[4,]\
    \    9    5    1    9\n```\n\nThere are several useful functions to examine the\
    \ properties of a matrix. You are familiar with them from Chapter 1, The R Environment,\
    \ and Chapter 2, Working with Vectors and Time Series, since they are analogous\
    \ to the functions we used with vectors and data.frame objects. For example, the\
    \ length function returns the number of elements a matrix has as follows:\n\n\
    ```\n> x = matrix(7:12, ncol = 3, byrow = TRUE)\n> x\n     [,1] [,2] [,3]\n[1,]\
    \    7    8    9\n[2,]   10   11   12\n> length(x)\n[1] 6\n```\n\nThe nrow and\
    \ ncol functions return the number of rows and columns as follows:\n\n```\n> nrow(x)\n\
    [1] 2\n> ncol(x)\n[1] 3\n```\n\nThe dim function returns both (the number of rows\
    \ and columns) at the same time:\n\n```\n> dim(x)\n[1] 2 3\n```"
  merge: -1
  img_proc: true
- pgno: 118
  md: "Using the as.vector function, we can convert a matrix into a vector as follows\
    \ (note that the values in the vector will always be ordered by columns):\n\n\
    ```\n> as.vector(x)\n[1]  7 10  8 11  9 12\n```\n\nSimilar to what we saw regarding\
    \ data.frame objects, we can subset matrices using two-dimensional indices. For\
    \ example, to get the values that occupy the first and third columns in matrix\
    \ x, we will use the following expression:\n\n```\n> x[, c(1,3)]\n     [,1] [,2]\n\
    [1,]    7    9\n[2,]   10   12\n```\n\nTo get the values that occupy the second\
    \ row in matrix x, we will use the following expression:\n\n```\n> x[2, ]\n[1]\
    \ 10 11 12\n```\n\nThe previous example demonstrates that the resulting object\
    \ is simplified to a vector if the values are retrieved from a single row or column.\
    \ Setting the drop parameter to FALSE will suppress this behavior, similar to\
    \ what we saw for the data.frame objects (see the previous chapter):\n\n```\n\
    > x[2, , drop = FALSE]\n     [,1] [,2] [,3]\n[1,]   10   11   12\n```\n\nThe assignment\
    \ of new values to subsets of a given matrix is also possible using the assignment\
    \ operator. For example, we can create an empty 3 x 3 matrix m and then populate\
    \ some of its cells as follows:\n\n```\n> m = matrix(NA, ncol = 3, nrow = 3)\n\
    > m\n     [,1] [,2] [,3]\n[1,]   NA   NA   NA\n[2,]   NA   NA   NA\n[3,]   NA\
    \   NA   NA\n> m[2:3, 1:2] = matrix(1:4, nrow = 2)\n> m\n     [,1] [,2] [,3]\n\
    [1,]   NA   NA   NA\n[2,]    1    3   NA\n[3,]    2    4   NA\n```"
  merge: -1
  img_proc: true
- pgno: 119
  md: "We can also use the apply function to make calculations on rows or columns\
    \ of a matrix, in exactly the same way as with the data.frame objects (see the\
    \ previous chapter). For example, we can calculate the means of all columns in\
    \ matrix x as follows:\n\n```\n> apply(x, 2, mean)\n[1]  8.5  9.5 10.5\n```\n\n\
    In fact, there are two specialized functions named rowMeans and colMeans for the\
    \ specific tasks of calculating row and column means, respectively. Thus, for\
    \ example, the following expression gives exactly the same result as the previous\
    \ one:\n\n```\n> colMeans(x)\n[1]  8.5  9.5 10.5\n```\n\n# Representing more than\
    \ two dimensions with an array\n\nWhile vectors are used to represent one-dimensional\
    \ sets of elements (see Chapter 2, Working with Vectors and Time Series), and\
    \ matrix is a specialized class to represent two-dimensional sets of elements\
    \ (see the previous section), the array class is more general. It is used to represent\
    \ sets of elements having any number of dimensions (including one and two).\n\n\
    We can create an array object (a three-dimensional one, for example) using the\
    \ array function:\n\n```\n> y = array(1:24, c(2,2,3))\n> y\n, , 1\n\n      [,1]\
    \ [,2]\n[1,]    1    3\n[2,]    2    4\n\n, , 2\n\n      [,1] [,2]\n[1,]    5\
    \    7\n[2,]    6    8\n\n, , 3\n\n      [,1] [,2]\n[1,]    9   11\n[2,]   10\
    \   12\n```"
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Working with Rasters


    The first argument we entered (1:24) defined the values, while the second argument
    (c(2,2,3)) defined the number of dimensions and their lengths. As opposed to creating
    a matrix with the matrix function, we need to explicitly specify the lengths of
    all dimensions (or else a one-dimensional object will be created by default) with
    the array function. In the previous example, we were interested in having three
    dimensions—two rows, two columns, and three layers (using raster terminology;
    see the following section). Thus, we specified their lengths as (2,2,3) using
    a vector of length 3.


    Naturally, a three-dimensional array has a three-dimensional indexing system.
    For example, we can reach the (2,1,3) element in our array y as follows:


    ```

    > y[2,1,3]

    [1] 10

    ```


    Working with arrays is very similar to working with vectors and matrices, and
    the application of many of the functions we have previously seen is intuitive.
    For example, we can use the apply function to find the means of all elements in
    each layer (or third dimension):


    ```

    > apply(y, 3, mean)

    [1]  2.5  6.5  10.5

    ```


    We will see an example involving the rowMeans function and three-dimensional array
    objects in *Chapter 6, Modifying Rasters and Analyzing Raster Time Series*.


    # Data structures for rasters in the raster package


    A raster is a rectangular grid of numeric values, referenced to a certain geographical
    extent. As previously mentioned, spatial referencing is what differentiates a
    raster from the simpler data structures (matrices and arrays) we have seen previously.
    A raster can have a single value in each cell (a single band, or single layer,
    raster—analogous to a matrix) or several values (a multiband, or multilayer, raster—analogous
    to an array). Rasters conceptually differ from vector layers, which are data structures
    to represent non-gridded objects such as spatial points, lines, and polygons (these
    will be covered in the next chapter).'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'In this book, we are going to work with classes to represent rasters from the
    raster package. This package does not come with the R installation, so we first
    have to install it using install.packages (see the previous chapter). We will
    also need to install the rgdal package since functions in the raster package use
    functions defined in rgdal for certain tasks, such as input/output operations.
    Taking a look at the official overview of R packages for spatial data analysis
    (http://cran.r-project.org/web/views/Spatial.html) is highly recommended at this
    stage. This web page is useful to find out how the previously mentioned packages
    raster and rgdal (and the ones to be introduced in the upcoming chapters) fit
    within the broader ecosystem of spatial data analysis tools available in R.


    > The rgdal package, which stands for Geospatial Data Abstraction Library (GDAL)
    extensions to R, is a very important one to work with spatial data, and we will
    cover it in several contexts. The name GDAL may be familiar to some readers; GDAL
    is a C library frequently used in other software (such as QGIS) and programming
    languages (such as Python). In fact, there are four C libraries providing the
    core functionality to work with spatial data in R interfaced through R functions.
    They are GDAL, OGR, PROJ.4 (which are available using functions in the rgdal package),
    and GEOS (which is available through functions in the rgeos package).


    The remaining part of this chapter is going to introduce the basic usage of the
    raster package with two real-world examples of remote sensing data. More advanced
    functionality of this package, as well as examples with another common type of
    raster data, Digital Elevation Model (DEM), will be introduced in subsequent chapters.
    We''ll be creating a third type of raster — predicted surfaces from spatial interpolation
    — in Chapter 8, Spatial Interpolation of Point Data.


    > Similarly to the GIS software, the raster package has the capability of working
    with big rasters that cannot be accommodated in the RAM (in such cases, for example,
    the data are automatically processed in chunks and the results are written to
    temporary files on disk).


    A comprehensive overview of the range of capabilities the raster package offers
    can also be found in its accompanying introductory tutorial (http://cran.r-project.org/web/packages/raster/vignettes/Raster.pdf).'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Creating single band rasters


    There are three classes to represent spatial rasters in the raster packages. These
    are RasterLayer, RasterStack, and RasterBrick. The first class is used to represent
    single band rasters (see the following examples), whereas the last two classes
    are used to represent multiband rasters (see the next section).


    The RasterLayer class represents a single band raster. A new RasterLayer object
    can be created using the raster function in several ways. For example, a matrix
    object can be converted to a RasterLayer object as follows:


    ```

    > library(raster)

    > r1 = raster(x)

    > r1

    class      : RasterLayer

    dimensions : 2, 3, 6  (nrow, ncol, ncell)

    resolution : 0.3333333, 0.5  (x, y)

    extent     : 0, 1, 0, 1  (xmin, xmax, ymin, ymax)

    coord. ref. : NA

    data source : in memory

    names      : layer

    values     : 7, 12  (min, max)

    ```


    We see that the print method for RasterLayer objects does something different
    from what we have seen so far. Rather than printing all values the object is composed
    of, a summary of certain properties of the particular RasterLayer object is given.
    We will see how to directly access some of these properties later. For now, it
    is worth repeating that a RasterLayer object (as opposed to a matrix) has spatial
    reference information, that is, a certain resolution, extent, and Coordinate Reference
    System (CRS). Naturally, the particular raster r, which we just created from a
    plain numeric matrix, has no CRS, and its resolution and extent have been automatically
    generated by the raster function (the extent is between 0 and 1 on both the x
    and y axes; the resolution is calculated accordingly).


    A more common way to create a raster object in R is to read the raster data from
    a file. For example, given that the raster and rgdal packages are installed on
    our system and the raster file landsat_15_10_1998.tif exists in the C:\Data directory,
    the following expression will read the contents of its first band and assign it
    to an object named band1 of class RasterLayer:


    ```

    > band1 = raster("C:\\Data\\landsat_15_10_1998.tif")

    ```'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Reading files from disk, as mentioned earlier, is done through the `rgdal`
    package (which is automatically loaded, if it was not already, when trying to
    read a file using the `raster` function). At present, there are ~100 supported
    input formats (you can get a list of these by typing `getGDALDriverNames()$name`
    once `rgdal` is loaded). These include, for example, the frequently used GeoTIFF
    (`*.tif` or `*.tiff`), which we will use in the examples in this book, and ERDAS
    IMAGINE image (`*.img`) formats.


    Printing the properties of raster band1 and comparing them to those of r1 from
    the previous example will demonstrate that this time we do have meaningful spatial
    reference information in the `RasterLayer` object band1, as shown in the following
    example:


    ```

    ```r

    > band1

    class       : RasterLayer

    band        : 1 (of 6 bands)

    dimensions  : 960, 791, 759360 (nrow, ncol, ncell)

    resolution  : 30, 30 (x, y)

    extent      : 663945, 687675, 3459375, 3488175 (xmin, xmax, ymin, ymax)

    coord. ref. : +proj=utm +zone=36 +ellps=WGS84 +units=m +no_defs

    data source : C:\Data\landsat_15_10_1998.tif

    names       : landsat_15_10_1998

    values      : 0.01737053, 0.5723241 (min, max)

    ```

    ```


    Spatial reference information is stored in the GeoTIFF file and incorporated in
    the `RasterLayer` object when it is created. We can see that raster band1 has
    a projected CRS, specifically the UTM Zone 36N coordinate system. Thus, its resolution,
    30 x 30, is in meters. We can also see that it is one of the six bands the `landsat_15_10_1998.tif`
    file contains.


    The input file `landsat_15_10_1998.tif` is, in fact, a subset of a Landsat satellite
    image of central Israel, where the original values were converted to reflectance
    (the fraction of incident electromagnetic radiation that is reflected from the
    surface, for a given wavelength). The original image, taken on October 15, 1998,
    is available for free at http://earthexplorer.usgs.gov/. The `landsat_15_10_1998.tif`
    file has six bands (Landsat bands 1-5 and 7) and covers an area of ~24 x ~29 kilometers
    (out of the 170 x 183 kilometers covered by the original image). The first four
    bands correspond to blue, green, red, and **Near Infrared (NIR)**, while the last
    two belong to the **Short Wave Infrared (SWIR)** portion of the electromagnetic
    spectrum. Two additional Landsat images of the same area, taken about 2 and 5
    years after 1998, are also available as sample datasets along with this book (the
    `landsat_04_10_2000.tif` and `landsat_11_09_2003.tif` files).'
  merge: -1
  img_proc: true
