- pgno: 93
  md: "# Applying a function on separate parts of a vector\n\nThe tapply function\
    \ is used to apply a function over different sections of a vector and then combine\
    \ the results into a single object. To do this, we need to provide three arguments\
    \ for the following three parameters:\n\n+   - Vector A, which the function will\
    \ operate upon (x)\n+   - Vector B, which defines the subsets of vector A (INDEX)\n\
    +   - A function that will be applied to the subsets of vector A (FUN)\n\nAs an\
    \ example, we shall use a short table, which is a random subset of six rows (out\
    \ of the original 150) in the iris dataset (available in R by typing iris). These\
    \ are measurements of four floral traits (first four columns) on different plants\
    \ (rows) that belong to three different iris species (fifth column, Species).\
    \ You can create a data.frame object such as the following example with iris=iris[sample(1:nrow(iris),6),]\
    \ (note that since it is a random sample, the exact values will be different each\
    \ time). The exact table being used in the examples is provided on the book's\
    \ website (iris2.csv). Here is the iris dataset subset we are going to use:\n\n\
    ```\n> iris\n      Sepal.Length Sepal.Width Petal.Length Petal.Width Species\n\
    100          5.7        2.8         4.1        1.3 versicolor\n45           5.1\
    \        3.8         1.9        0.4 setosa\n90           5.5        2.5      \
    \   4.0        1.3 versicolor\n34           5.5        4.2         1.4       \
    \ 0.2 setosa\n38           4.9        3.6         1.4        0.1 setosa\n101 \
    \         6.3        3.3         6.0        2.5 virginica\n```\n\nUsing tapply,\
    \ we can quickly find out, for example, the average petal width per species, as\
    \ follows:\n\n```\n> x = tapply(iris$Petal.Width, iris$Species, mean)\n> x\n \
    \     setosa versicolor virginica\n0.2333333 1.3000000 2.5000000\n```\n\nThe first\
    \ argument, iris$Petal.Width, is the vector on which we apply our function. The\
    \ second argument, iris$Species, is the vector that defines the subsets in iris$Petal.Width.\
    \ Basically, all elements in iris$Petal.Width at the positions with a unique value\
    \ in iris$Species are treated as groups. The last argument is the function that\
    \ we apply on the subsets of iris$Petal.Width; in this case, the mean function.\
    \ Thus, the iris$Petal.Width vector was split into three subsets, a mean was calculated\
    \ for each subset, and the results were combined once again."
  merge: -1
  img_proc: true
- pgno: 94
  md: "The returned object of `tapply` is an `array`, which is a vector with an additional\
    \ attribute stating the number and size of its dimensions. A one-dimensional array,\
    \ which is what we have here, is identical to a vector in its usage. The reason\
    \ that the returned object of `tapply` is an array, however, is that in some cases\
    \ (which we will not cover here), the returned object will have more than one\
    \ dimension, and thus cannot be represented by a vector (for example, when the\
    \ function we apply returns more than one value, such as the `range` function).\
    \ We will further elaborate on two-dimensional (`matrix`) and three-dimensional\
    \ (`array`) vector-like objects in the next chapter.\n\nNote that the array is\
    \ named using the values in the grouping vector, so we can access any value of\
    \ interest using its name as follows:\n\n```\n> x[\"setosa\"]\n  setosa\n  0.2333333\n\
    ```\n\nAlso, if we wish, we can transform the result to a vector using `as.numeric`\
    \ as follows:\n\n```\n> as.numeric(x)\n[1] 0.2333333 1.3000000 2.5000000\n```\n\
    \nAs previously mentioned, the `apply` functions are similar to loops in purpose\
    \ and concept, although simpler and clearer in their syntax. For example, the\
    \ preceding operation can be performed using a `for` loop, although the code would\
    \ be longer (and, arguably, less clear):\n\n```\n> x = NULL\n> for(i in unique(iris$Species))\
    \ {\n+ x = c(x, mean(iris$Petal.Width[iris$Species == i]))\n+ }\n> names(x) =\
    \ unique(iris$Species)\n> x\nversicolor  setosa  virginica\n1.3000000 0.2333333\
    \ 2.5000000\n```\n\nHere, we create an empty object (with `NULL`, the special\
    \ value that denotes an empty object in R) and then go through the unique values\
    \ in `iris$Species` using a loop, each time adding the mean of `iris$Petal.Width`\
    \ to the respective species in x. Finally, we edit the names attribute of the\
    \ resulting vector, using the `names` function, to add the unique species names.\n\
    \n![](img/ebfd6294770b225fdeceda9a7b8b560e_94_0.png)"
  merge: -1
