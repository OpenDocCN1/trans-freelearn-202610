    \ we would like to join the seasons table to the dates table by month:\n\n```\n\
    > dates = join(dates, seasons, \"month\")\n> head(dates)\n    image day month\
    \ year     date season\n1     1  18    2 2000 2000-02-18 winter\n2     2   5 \
