- pgno: 281
  md: 'The graphical output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_281_0.png)


    The preceding screenshot quite obviously resembles Spain''s DEM. In fact, it shows
    the elevation profile of Spain transposed to temperature units (using a linear
    relation based on the data from meteorological stations) and locally calibrated
    using, once again, the stations data. This is what UK results commonly look like.


    Let''s examine the RMSE of the UK prediction model as well:


    ```

    > cv = gstat.cv(g)

    > rmse(cv)

    [1] 1.455196

    ```


    We see that the RMSE of UK, in this case, is even lower than that of OK. This
    result suggests that utilizing the value~elevation trend has further improved
    prediction accuracy.'
  merge: -1
  img_proc: true
- pgno: 282
  md: "# Mapping the annual temperature in Spain\n\nIn the previous sections, we saw\
    \ how to perform spatial interpolation of point data in R using several methods,\
    \ including IDW, OK, and UK. We also learned that, in the case of minimum temperature\
    \ in 2002, UK outperformed the other two methods in terms of accuracy, with a\
    \ LOOCV RMSE value of 1.46, compared to 1.88 and 1.68 for IDW and OK, respectively.\
    \ In this section, we are going to see how we can automate spatial interpolation\
    \ in order to produce a set of temperature maps for different years with a single\
    \ code execution command. For this purpose, we are going to construct two loops:\n\
    \n+   - The first loop will go through 20 point layers (10 years * 2 variables),\
    \ each time calculating the RMSE of LOOCV in prediction using each of the three\
    \ methods (IDW, OK, and UK). Based on the results, we will select the most accurate\
    \ method (on average) out of these three.\n+   - We will then construct the second\
    \ loop to produce predicted temperature maps of Spain (for 5 years—2006-2010)\
    \ using the selected method.\n\nWe will begin with the first task of systematically\
    \ evaluating RMSE among the different years, variables, and methods. A very useful\
    \ function for such tasks, named expand.grid, will help us keep track of the examination.\
    \ Given a set of vectors, expand.grid returns a data.frame object with all possible\
    \ combinations of the elements from each vector. The following expression, for\
    \ example, creates a data.frame object, named cv_results, with four columns (variable,\
    \ year, method, and rmse):\n\n```\n> cv_results = expand.grid(\n+ variable = c(\"\
    mmnt\", \"mmxt\"),\n+ year = 2001:2010,\n+ method = c(\"IDW\", \"OK\", \"UK\"\
    ),\n+ rmse = NA)\n```\n\nSince only three of the columns have more than one possible\
    \ element, and there are 2 variables * 10 years * 3 methods = 60 unique ways to\
    \ combine them, cv_results has 60 rows. The first few rows of this data.frame\
    \ object look as follows:\n\n```\n> head(cv_results)\n    variable year method\
    \ rmse\n1     mmnt 2001    IDW   NA\n2     mmxt 2001    IDW   NA\n3     mmnt 2002\
    \    IDW   NA\n4     mmxt 2002    IDW   NA\n5     mmnt 2003    IDW   NA\n6   \
    \  mmxt 2003    IDW   NA\n```"
  merge: -1
  img_proc: true
- pgno: 283
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 284
  md: "```\n+ v_mod =\n+ autofitVariogram(\n+ formula = form,\n+ input_data = dat)$var_model}\n\
    + # (3) Create gstat object\n+ g = gstat(formula = form, data = dat, model = v_mod)\n\
    + # (4) Perform cross-validation\n+ cv = gstat.cv(g)\n+ # (5) Calculate RMSE and\
    \ assign to cv_results\n+ cv_results$rmse[i] = rmse(cv)\n+ }\n```\n\nNote that,\
    \ in step 2, nested conditional statements are used in order to determine form\
    \ and v_mod according to the interpolation method that is being used. We can write\
    \ down the procedure this particular code section performs in the form of a decision\
    \ tree:\n\n+   - If the method is \"IDW\", then form is value~1 and v_mod is NULL\n\
    +   - Otherwise:\n+     - If the method is \"OK\", then form is value~1\n+   \
    \  - If the method is \"UK\", then form is value~elevation\n+     - The v_mod\
    \ is calculated according to form\n\nOnce the loop execution is completed (this\
    \ may take a few moments), the rmse column of cv_results will be filled with the\
    \ resulting RMSE values instead of NA values:\n\n```\n> head(cv_results)\n   \
    \  variable year method    rmse\n1      mmnt 2001    IDW 1.942872\n2      mmxt\
    \ 2001    IDW 1.594996\n3      mmnt 2002    IDW 1.880490\n4      mmxt 2002   \
    \ IDW 1.570574\n5      mmnt 2003    IDW 1.912887\n6      mmxt 2003    IDW 1.605938\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 285
  md: "Note that, for instance, the RMSE value at the third row table (1.880490),\
    \ which corresponds to the IDW interpolation of \"mmnt\" for 2002 as expected,\
    \ is identical to the result we have previously obtained manually. Several interesting\
    \ comparisons can be made using this RMSE table. As previously stated, we are\
    \ mainly interested in seeing which interpolation method is the most accurate,\
    \ on average, across 10 years and the two variables. To find out, we can use tapply:\n\
    \n```\n> tapply(cv_results$rmse, cv_results$method, mean)\n        IDW       \
    \ OK        UK\n1.773243 1.908957 1.458997\n```\n\nThe result shows that, on average,\
    \ UK yields the lowest prediction error among the three methods. Interestingly,\
    \ OK is less accurate, on average, than IDW although in the particular example\
    \ we previously saw it was the other way around. Based on this result, UK is going\
    \ to be our method of choice to produce annual temperature maps of Spain.\n\n\
    > It should be noted that comparing cross-validation RMSE is only meaningful among\
    \ different spatial prediction models of the same data. Otherwise, RMSE may be\
    \ higher or lower not only because the prediction error is different but also\
    \ because the predicted values themselves are on different scales. For example,\
    \ RMSE of the precipitation amount (\"tpcp\") prediction would have been much\
    \ higher than RMSE of temperature prediction in our case (you can try and see\
    \ this), simply because the generally observed annual precipitation amounts in\
    \ Spain (in mm) are higher by an order of magnitude than temperatures (in Celsius\
    \ degrees). However, this does not mean that the prediction models of precipitation\
    \ are less accurate with respect to the scale of the measured variable itself.\n\
    \nWe are ready to move on and produce annual temperature maps using another loop\
    \ that calculates the predicted values (rather than performing cross-validation,\
    \ which we just did). Once again, a well-organized way of doing this is to construct\
    \ a table describing the set of parameters we need for each spatial interpolation,\
    \ then go through that table and perform the required operations in turn. We will\
    \ once again use the expand.grid function, producing all combinations of just\
    \ two variables this time: year (the 5 years 2006-2010) and variable (\"mmnt\"\
    \ and \"mmxt\"). The method will be left unspecified as we have already decided\
    \ it should be invariably UK.\n\n```\n> spainT_tab = expand.grid(\n+ year = 2006:2010,\n\
    + variable = c(\"mmnt\", \"mmxt\"))\n```"
  merge: -1
  img_proc: true
- pgno: 286
  md: "The resulting table, named `spainT_tab`, looks as follows:\n\n```\n> spainT_tab\n\
    \  year variable\n1  2006      mmnt\n2  2007      mmnt\n3  2008      mmnt\n4 \
    \ 2009      mmnt\n5  2010      mmnt\n6  2006      mmxt\n7  2007      mmxt\n8 \
    \ 2008      mmxt\n9  2009      mmxt\n10 2010      mmxt\n```\n\nWe are ready to\
    \ create the second loop that will go through the rows of `spainT_tab` and spatially\
    \ interpolate the respective temperature data. Since our results are going to\
    \ be rasters (rather than numeric values, as was the case with the cross-validation\
    \ loop) in this case, they cannot be appended to the table itself. Instead, we\
    \ are going to stack the results in a multiband raster where each layer is going\
    \ to correspond to a row in `spainT_tab`. In other words, `spainT_tab` is going\
    \ to function as a supplementary table for the resulting multiband raster (much\
    \ as `dates` served the same purpose for the raster `r`; see Chapter 4, Working\
    \ with Rasters). To construct the raster, we will first create an empty `RasterStack`\
    \ to which the interpolation results will be appended during loop execution:\n\
    \n```\n> spainT = stack()\n```\n\nThe loop will go through the rows of `spainT_tab`,\
    \ each time performing the following set of operations:\n\n+   1. Creating a point\
    \ layer named `dat` with the variable and year set according to the current row\
    \ of `spainT_tab`.\n+   2. Fitting a variogram model (`v`).\n+   3. Creating a\
    \ `gstat` object (`g`) according to `dat` and `v`.\n+   4. Calculating the raster\
    \ of predicted values (`z`) with `interpolate`, based on `g` and `dem_spain`.\n\
    +   5. Masking `z` according to `dem_spain` and attaching the result to `spainT`."
  merge: -1
  img_proc: true
