- pgno: 56
  md: '# ## Subsetting with logical vectors


    Another method to create a subset of a vector is by supplying a logical vector
    within the `[` operator. The logical vector points out to the elements that need
    to be kept within the subset; the elements to be kept are those whose indices
    match the indices of the TRUE values in the logical vector. It is frequently useful
    to create the logical vector that is used for subsetting by applying a conditional
    operator on the same vector we wish to subset. Let''s take a look at the following
    example:


    ```

    ```r

    > x = seq(85, 100, 2)

    > x

    [1] 85 87 89 91 93 95 97 99

    > x > 90

    [1] FALSE FALSE FALSE  TRUE  TRUE  TRUE  TRUE  TRUE

    > x[x > 90]

    [1] 91 93 95 97 99

    ```

    ```


    Here, we created a logical vector x>90, which like the vector x has eight elements
    (since the operation was carried out element by element as we saw previously).
    The values in this vector are either TRUE or FALSE depending on whether the vector
    x has a value larger than 90 at the respective position. When we create a subset
    of the vector x using the logical vector x>90, we get a vector containing those
    five values in x that occupy the same position that the TRUE values occupy in
    the x>90 vector. These are the positions where the values of x are greater than
    90.


    We can even apply more complex conditions to select some very specific values:


    ```

    ```r

    > x

    [1] 85 87 89 91 93 95 97 99

    > x[x>85 & x<90]

    [1] 87 89

    > x[x>92 | x<86]

    [1] 85 93 95 97 99

    ```

    ```


    Note that when subsetting with logical vectors, the order of values in the subset
    matches their order in the original vector, since the first element in the subset
    will be the first element that has TRUE in the logical vector, the second will
    be the second element that has TRUE in the logical vector, and so on.'
