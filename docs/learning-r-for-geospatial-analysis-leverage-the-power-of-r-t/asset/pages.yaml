- pgno: 23
  md: '# # Using R as a calculator


    Start R by navigating to **Start | All Programs | R** and choose the appropriate
    shortcut from there (such as **R x64 3.1.0** when running the 3.1.0 64-bit version
    of R).


    The main screen of the **R Graphical User Interface (RGui)** looks like the following
    screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_23_0.png)


    The window you see when starting the program, **R Console**, is the command line.
    The > symbol followed by a flashing cursor indicates that the system is waiting
    for instructions from the user. When the user types an expression into the command
    line and presses *Enter*, that expression is interpreted from the R language into
    the language that the computer processor understands, and the respective operation
    that expression entails is performed. As you may have noted, very few point-and-click
    menu options are found within the R environment as almost all operations are only
    accessible through code.'
  merge: -1
  img_proc: true
- pgno: 24
  md: "# The R Environment\n\nFirst, we will try simple calculations. For example,\
    \ type the expression 5+5. The result 10 will appear on the next line followed\
    \ by the > symbol, indicating that all instructions have been executed and the\
    \ system is waiting for new ones:\n\n```\n> 5+5\n[1] 10\n```\n\nWhat has just\
    \ happened is that the expression 5+5 was interpreted and the respective instruction\
    \ (add 5 and 5) was sent to the processor. The processor found the result (which\
    \ is 10), which was then returned and printed in the command-line window. As we\
    \ will see later, the result was saved neither in the RAM nor in the long-term\
    \ computer memory, such as the hard disk. The meaning of the [1] part is that\
    \ the result is a vector, with the first member being the number 10. Vectors will\
    \ be covered in the next chapter.\n\nNote that an R expression can be several\
    \ lines long. For example, if we type 5* and press Enter, the symbol + appears\
    \ on the next line, indicating that R is waiting for the remaining part of the\
    \ expression (5 multiplied by ...):\n\n```\n> 5*\n+ 2\n[1] 10\n```\n\nIf you change\
    \ your mind and do not wish to complete the expression, you can press Esc to cancel\
    \ the + mode and return to the command line. Pressing Esc can also be used to\
    \ terminate the current process that is being executed. (We didn't get a chance\
    \ to try that out yet since simple operations such as 5+5 are executed very quickly.)\n\
    \n> While using the command line, you can scroll through the history of previously\
    \ executed expressions with the ↑ and ↓ keys. For example, this can be useful\
    \ to modify a previously executed expression and run it once more.\n> \n> You\
    \ can clear all text from the command-line window by pressing Ctrl + L.\n\n![](img/ebfd6294770b225fdeceda9a7b8b560e_24_0.png)"
  merge: -1
  img_proc: true
