- pgno: 251
  md: "Proceeding with the third step, we would like to have the information from\
    \ `l_forests` and `r_forests` in a single data.frame object with all NDVI values\
    \ in a single column, and additional columns characterizing the measurements (date,\
    \ sat, and forest). Starting with the `l_forests` matrix, we will first transpose\
    \ it (using the `t` function) and convert it to a `data.frame` object (using the\
    \ `as.data.frame` function):\n\n```\n```r\n> l_forests = as.data.frame(t(l_forests))\n\
    > l_forests\n\n                 V1        V2\nlayer.1 0.3053538 0.2840073\nlayer.2\
    \ 0.2487563 0.2190098\nlayer.3 0.2844870 0.2433260\n```\n```\n\nNow, we can set\
    \ the appropriate column names (the forest names) and create new columns for dates\
    \ (obtained from `l_date`) and satellite (\"Landsat\") as follows:\n\n```\n```r\n\
    > colnames(l_forests) = forests$name\n> l_forests$date = l_dates\n> l_forests$sat\
    \ = \"Landsat\"\n```\n```\n\nThe new `l_forests` matrix looks as follows:\n\n\
    ```\n```r\n> l_forests\n\n             Lahav   Kramim        date      sat\nlayer.1\
    \ 0.3053538 0.2840073 1998-10-15 Landsat\nlayer.2 0.2487563 0.2190098 2000-10-04\
    \ Landsat\nlayer.3 0.2844870 0.2433260 2003-09-11 Landsat\n```\n```\n\nExactly\
    \ the same procedure is repeated for `r_forests` (with acquisition dates taken\
    \ from `dates$date` and the satellite name set to \"MODIS\"):\n\n```\n```r\n>\
    \ r_forests = as.data.frame(t(r_forests))\n> colnames(r_forests) = forests$name\n\
