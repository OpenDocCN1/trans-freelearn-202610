- pgno: 140
  md: 'For example, we can write a function called prop_na that takes a numeric vector
    and returns the proportion of the NA values that vector contains (from 0, if the
    vector has no NA values, to 1, if the vector is entirely composed of the NA values).
    The following code section defines the prop_na function and demonstrates that
    it works as expected using a simple example:


    ```

    > prop_na = function(x) length(x[is.na(x)]) / length(x)

    > prop_na(c(10,3,NA,2))

    [1] 0.25

    ```


    We can now utilize calc to perform an overlay operation on all layers in r with
    the function prop_na, as follows:


    ```

    > prop_na_r = calc(r, fun = prop_na)

    ```


    The resulting object prop_na_r is a single band raster, where the value of each
    pixel reflects the proportion of missing values among the bands of the multiband
    raster r.


    As another example, we will calculate an NDVI image based on our Landsat image
    l_00. NDVI is defined as the difference between NIR and red reflectances (which
    in Landsat correspond to bands 4 and 3, respectively) divided by their sum. We
    can perform the calculation by first defining a function called ndvi that, given
    a vector, calculates the NDVI based on its fourth and third elements (assuming
    they correspond to NIR and red, respectively).


    ```

    > ndvi = function(x) (x[4] - x[3]) / (x[4] + x[3])

    ```


    Then, we can apply the function on the Landsat multiband raster l_00 with calc:


    ```

    > ndvi_00 = calc(l_00, fun = ndvi)

    ```


    We will display the result using levelplot. Note that when plotting a single layer,
    an average profile of mean values is shown for rows and columns along plot margins
    (this behavior can be disabled by specifying margin=FALSE):


    ```

    > levelplot(ndvi_00, par.settings = RdBuTheme, contour = FALSE)

    ```'
  merge: -1
  img_proc: true
