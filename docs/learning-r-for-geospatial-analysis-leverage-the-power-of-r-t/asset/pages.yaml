- pgno: 26
  md: '# The R Environment


    The following screenshot shows the way RGui appears with both a command-line window
    and a code editor window:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_26_0.png)


    You can save the R code that you have written to a file at any time (**File |
    Save as...**) in order to be able to work on it another day. An R code file is
    a plain text file, usually with the suffix `.R`. To open an existing R code file,
    simply select it after navigating to the **File | Open script...** menu.


    It is sometimes easier to use other text editors since they provide more options
    than R''s basic text editor. For example, one can edit R code in the all-purpose
    Notepad++ text editor, which is available for free at `http://notepad-plus-plus.org/`.
    Notepad++ can be customized to edit code written in different programming languages
    (including R). By selecting the appropriate language, the specific function names
    and operators of that language will be highlighted in different colors for easier
    interpretation by the user.'
