  md: "We can add rows or columns to an existing data.frame object using the rbind\
    \ (row bind) and cbind (column bind) functions, respectively. For example, we\
    \ can add a fifth row to our df table using rbind as follows:\n\n```\n> row5 =\
    \ c(5,\"e\",\"E\")\n> rbind(df, row5)\n  num lower upper\n1   1     a     A\n\
    2   2     b     B\n3   3     c     C\n4   4     d     D\n5   5     e     E\n```\n\
    \nAlternatively, we could add a fourth column using cbind as follows:\n\n```\n\
    > word = c(\"One\",\"Two\",\"Three\",\"Four\")\n> cbind(df, word, stringsAsFactors\
    \ = FALSE)\n  num lower upper word\n1   1     a     A   One\n2   2     b     B\
    \   Two\n3   3     c     C Three\n4   4     d     D   Four\n```\n\nIn the previous\
    \ example, we had to specify, once again, that we do not want the character vector,\
