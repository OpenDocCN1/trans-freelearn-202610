    # Writing a data.frame object to a CSV file


    A `data.frame` object can be written to a CSV file with the `write.csv` function.
    The two first (and most important) parameters for this function indicate the name
    of the `data.frame` object, which we would like to save, and the path to the new
    file (including the new filename). These parameters have no defaults, so we need
    to specify them. For example, the following expression writes the `data.frame`
    object `df` to the `df.csv` file in the `C:\Data` directory:


    ```

    ```r

    > write.csv(df, "C:\\Data\\df.csv")

