- pgno: 263
  md: 'The preceding screenshot clearly shows that the nearest-neighbor interpolation
    method has, in practice, divided the area of interest into discrete subareas.
    Each subarea includes all the locations that are more proximate to a given measured
    point (that is, a given meteorological station) than to any other. In fact, we
    could have also carried out nearest-neighbor interpolation by creating polygons
    defining such subareas and rasterized them, to produce the same result. Within
    the context of GIS, such polygons are known as Thiessen or Voronoi polygons (interested
    readers will find at least one way to create them in R; for example, using the
    `dirichlet` function of the `spatstat` package).


    As mentioned earlier, nearest-neighbor interpolation is rarely useful to predict
    the behavior of natural phenomena in space. For example, it is clearly unrealistic
    to assume that discrete polygonal areas surrounding each meteorological station
    have uniform temperatures, with a sharp increase or decrease in temperature, along
    the borders between them (as the previous screenshot suggests). In reality, the
    temperature changes more or less gradually from place to place. To describe such
    gradual transitions, we need to use more elaborate methods, such as those described
    in the upcoming sections.


    # IDW interpolation


    The three interpolation methods we will employ next — IDW, Ordinary Kriging (OK),
    and Universal Kriging (UK) — all utilize the same principal procedure, where the
    predicted value of a given point is determined as a weighted average of the values
    from the measured points. Moreover, the weight of each measured value is always
    a function of its distance from the point we are trying to predict (a nearby point
    usually having a higher weight, or influence, on the predicted value than a point
    further away). Within this framework, nearest-neighbor interpolation is, in fact,
    an extreme private case, where the weight of the nearest point is 1 while the
    weights of all other points are 0.


    To better understand the subsequent material in this chapter, we can already state
    that the differences between the three methods concern two properties: the trend
    and the weights definition. The trend is basically an additional function, independent
    of the measured points values, added to the weighted average of the latter. In
    IDW, the trend is 0 and in OK it is a constant value, thus having no effect on
    the predicted pattern in either case. However, in UK, the trend is a function
    of additional covariates. Regarding the weights, in IDW they are arbitrarily determined
    (thus the method is considered deterministic); in OK and UK, conversely, they
    are estimated from the data itself (thus the methods are considered statistical).'
  merge: -1
  img_proc: true
