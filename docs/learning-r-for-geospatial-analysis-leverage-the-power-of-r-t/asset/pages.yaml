- pgno: 270
  md: 'The attribute table columns of the cross-validation result refer to the following
    information:


    +   - `var1.pred`: Predicted value

    +   - `var1.var`: Variance (only for kriging)

    +   - `observed`: Observed value

    +   - `residual`: Residual, the difference between observed and predicted values

    +   - `zscore`: Z-score (only for kriging)

    +   - `fold`: Cross-validation count


    The important column, for our purpose here, is `residual` — the difference between
    the observed and predicted values. Based on the residuals, we can assess how far
    predicted values are from the observed ones, or in other words, prediction accuracy.
    One of the simplest and most common metrics of agreement between observed and
    predicted values is the RMSE. Given a set of predicted-observed value pairs, the
    RMSE is calculated as follows:


    $$RMSE = \sqrt{\frac{\sum_{i=1}^{n} (pred_i - obs_i)^2}{n}} \quad (3)$$


    Here, RMSE is the root mean square error, n is the overall number of points, and
    pred_i and obs_i are the predicted and observed values at point i, respectively.
    As the difference between predicted and observed values is smaller, the RMSE will
    be lower, indicating that the model is more accurate. Given the same input data,
    we can compare the RMSE values among different models to select the most accurate
    one. Translating equation (3) to the R syntax, we can calculate RMSE based on
    the attribute table of cv as follows:


    ```

    > sqrt( sum( (-cv$residual)^2 )/nrow(cv) )

    [1] 1.88049

    ```


    The RMSE in this case is equal to 1.88049. Note that the expression consists of
    the -cv$residual vector (equivalent to cv$var1.pred-cv$observed) squared, then
    summed, and divided by the total number of points. Finally, the square root of
    the result is extracted.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'For convenience, we can wrap this expression into our own function, which calculates
    RMSE, given a gstat.cv output:


    ```

    > rmse = function(x) sqrt(sum((-x$residual)^2)/nrow(x))

    > rmse(cv)

    [1] 1.88049

    ```


    We will use this function later.


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_271_0.png)


    You may have noticed that the gstat object we initially defined (g) was hereby
    used for two distinct and independent purposes. First, to calculate predicted
    values (using the interpolate function), then to perform cross-validation (using
    the gstat.cv function). This is not incidental, but rather a characteristic object-oriented
    behavior common to all, or most, of R''s statistical procedures. This approach
    is advantageous over the menu-based approach commonly encountered in statistical
    or GIS software, where we carry out a given analysis by making selections in a
    set of dialog boxes, and receive a set of results (some of which we do not need,
    while others are lacking since the tool''s creator did not include them). Conversely,
    when a statistical function is applied in R, we usually get an object that holds
    all the data that is necessary to carry out the analysis (such as g) or an object
    that holds a comprehensive set of results (such as cv). From such objects, we
    can then derive the results we are interested in by applying specific functions.
    Moreover, we can create functions of our own to carry out calculations or extract
    meaningful data, for which no built-in methods have been defined (such as the
    rmse function we defined earlier). Readers who are interested in using R as a
    general statistical analysis toolbox will repeatedly encounter this approach.
    For example, the lm function is used to perform ordinary linear regression in
    R; on its returned object, of class lm, numerous functions (such as summary, residuals,
    and plot) may be applied to derive the information we are interested in.'
  merge: -1
  img_proc: true
