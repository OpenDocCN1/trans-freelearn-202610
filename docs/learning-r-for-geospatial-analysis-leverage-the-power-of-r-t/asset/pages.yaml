    # # The recycling principle


    In the previous chapter, we only used operators on two vectors of length 1. In
    this chapter, so far, we have used operations involving one vector of length 1
    and another of length >1. What happens when we perform an operation involving
    two vectors of length >1?


    If we have two vectors of exactly the same length, the operation is performed
    on each consecutive pair of elements taken from the two vectors, as follows:


    ```

    > c(1,2,3) * c(10,20,30)

    [1] 10 40 90

    ```


    In this example, 1 is multiplied by 10, 2 is multiplied by 20, and 3 is multiplied
    by 30, and the three results are combined into a single vector of length 3.


    In case when the lengths of the two vectors are unequal, the shorter vector is
    recycled before the operation is performed. In other words, values at the beginning
    of the shorter vector are attached to its end, sequentially and as many times
    as necessary, until the lengths of both vectors match. The simplest case, which
    we witnessed in the previous section, is the one that involves one vector of length
    1 and another vector of length greater than 1. We can describe what happens in
    such a case as the recycling of the vector that has one element until it matches
    the length of the longer vector. For example, when executing the first of these
    two expressions, it is as if we are performing the second:


    ```

    > 1:4 * 3

    [1] 3 6 9 12


    > 1:4 * c(3,3,3,3)

    [1] 3 6 9 12

    ```


    The same way, in the following example, the vector c(3,5) is recycled until it
    is of length 4, to c(3,5,3,5). The result is c(1,2,3,4) multiplied by c(3,5,3,5):


    ```

    > c(1,2,3,4) * c(3,5)

    [1] 3 10 9 20

    ```'
  merge: -1
