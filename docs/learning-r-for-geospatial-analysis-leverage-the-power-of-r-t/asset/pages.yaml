- pgno: 196
  md: 'Certain operations with rasters (such as merging or reprojection) can be time-consuming.
    A useful additional parameter to the merge function, and many other functions
    in the raster package, is progress. Setting progress="text" or progress="window"
    will show a progress bar (in the textual output or in a separate window) while
    the function code runs. This way, the user can assess how much time a given operation
    will take (and perhaps modify the code to bypass extremely time-consuming steps).
    The rasterOptions(progress="text") expression sets the progress parameter to "text"
    globally for the current R session.


    We now have a DEM of the whole area of longitude 30-40 and latitude 30-35 (as
    shown in the following screenshot). Our next step will be to isolate the area
    of interest surrounding Haifa. We will define the area as the bounding box of
    haifa_buildings (refer to the previous chapter), supplemented with 0.25 degrees
    on all four sides. For this purpose, we will calculate the bounding box of haifa_buildings
    (using the extent function) and then add 0.25 degrees to it, as follows. Beforehand,
    we will read the haifa_buildings layer once again to have it in a geographic CRS:


    ```

    > haifa_buildings = readOGR("C:\\Data", "haifa_buildings")

    > haifa_surrounding = extent(haifa_buildings) + 0.25

    ```


    The created object haifa_surrounding is an Extent object defining our rectangular
    area of interest. Let''s plot dem and the Extent object using a pair of plot function
    calls:


    ```

    > plot(dem)

    > plot(haifa_surrounding, add = TRUE)

    ```


    The graphical output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_196_0.png)'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'The two merged tiles seem in perfect alignment, which is expected as they originate
    from the same (larger) DEM. The black rectangle delineates our areas of interest
    centered on Haifa, which indeed intersects the 35 degrees meridian.


    # Cropping and trimming


    Cropping is the production of a smaller raster from an existing one by selecting
    a certain range of rows and columns. While the manual subset methods we used in
    Chapter 4, Working with Rasters, are also considered cropping, in practice we
    usually would like to select the required range of rows and columns by overlaying
    the raster with another spatial layer, rather than by manually entering row and
    column indices.


    The crop function, given a raster and an Extent object, returns a smaller raster
    with the required extent. Instead of an Extent object, a raster or a vector layer
    can also be provided, in which case their extent is extracted and used in cropping.
    For example, the following expression crops dem according to haifa_surrounding:


    ```

    > dem = crop(dem, haifa_surrounding)

    ```


    To examine the effect, we can visualize the raster once again using the plot(dem)
    expression. The following screenshot shows the graphical output that is produced
    as a result:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_197_0.png)'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Modifying Rasters and Analyzing Raster Time Series


    The high-elevation area in the lower half of the preceding screenshot is Mount
    Carmel. The city of Haifa is located on its northern slopes.


    Another useful function within the context of raster cropping is `trim`. This
    function removes the outer rows and columns of a raster that all have the same
    value. For example, using `trim(x)`, we can automatically remove unnecessary NA
    margins from the raster x.


    > A raster (in R, and in general) is by definition rectangular; rasters where
    values cover a non-rectangular area are obtained by surrounding the area of interest
    with NA values (such as the Mediterranean sea area in the preceding screenshot).
    Both `crop` and `trim` are used to carve smaller rectangular extents from existing
    rasters by removing whole rows and columns from their margins. When we are interested
    in carrying non-rectangular shapes, we need, in fact, to fill the unnecessary
    areas with NA, which is made possible with the `mask` function (we''ll see this
    in the next chapter).


    # Aggregating and disaggregating


    Aggregation is the creation of a lower-resolution raster by grouping rectangular
    sets of cells in the original raster into individual, larger cells in the new
    raster. Aggregation might be necessary when we are ready to lose detail to gain
    processing efficiency or noise reduction. For example, MODIS satellite data products
    are distributed in several spatial (and temporal) resolutions, from 250 to 5600
    m, with the lower-resolution products usually being the results of aggregation
    from the original higher-resolution data. The lower-resolution data are useful
    since as we increase the spatial and temporal extent that is being analyzed, it
    becomes increasingly unfeasible (and unnecessary) to work with high resolutions.
    For example, an analysis of NDVI trends over time at a 250 meter resolution on
    a global scale would involve huge amounts of data; a 5,600 meter resolution is
    more reasonable for such a task (it would reduce the amount of data 500-fold!).
    In addition, lower-resolution products are typically associated with greater confidence
    since noisy pixels are averaged out during aggregation.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'The aggregate function performs aggregation by grouping adjacent pixels into
    new ones, given an input raster and the aggregation factor fact. The aggregation
    factor controls the size of the new raster cells in units of the original cells.
    It can either be a single integer (in which case, aggregation is equal on both
    axes) or a vector of length 2 (in which case, different levels of aggregation
    are applied on the x and y axes). For example, using fact=8 means that each set
    of 8*8 cells in the original raster becomes a single cell in the new raster. Using
    fact=c(5,10) means that each rectangle of 5*10 cells (5 along the x axis, 10 along
    the y axis) becomes a single cell. In addition, the fun parameter specifies which
    function will be used to calculate the new values based on existing ones (the
    default is mean), and the na.rm parameter specifies whether NA values are removed
    from each set prior to calculation (the default is TRUE). To demonstrate the behavior
    of aggregate, we will apply it on our dem raster, aggregating 8*8 and 16*16 sets
    of cells:


    ```

    > dem_agg8 = aggregate(dem, fact = 8)

    > dem_agg16 = aggregate(dem, fact = 16)

    ```


    The following expressions sequentially plot the original dem, and the aggregation
    results dem_agg8 and dem_agg16, along with the appropriate plot titles specified
    using the main parameter:


    ```

    > plot(dem, main = "Original image")

    > plot(dem_agg8, main = "8x8 aggregated")

    > plot(dem_agg16, main = "16x16 aggregated")

    ```


    The following screenshot shows the resulting individual plots from left to right:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_199_0.png)


    We can see that the preceding screenshot becomes increasingly blurred as the degree
    of aggregation increases.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The opposite operation from aggregation is disaggregation; it can be performed
    with the disaggregate function. For example, the disaggregate(dem_agg8,fact=8)
    expression would yield back a higher-resolution raster with the same resolution
    of dem. However, the information that has been lost in aggregation is not recovered
    (each set of 8*8 adjacent cells would have the same value) and the disaggregated
    raster will visually appear identical to dem_agg8.


    # # Raster resampling and reprojection


    In this section, we are going to transfer the values of a given raster from its
    own grid to a different grid. This operation is known as resampling. Raster reprojection
    is a closely related operation; it is basically resampling to a grid having a
    different CRS than that of the original raster.


    # # Raster resampling


    Raster resampling can be performed using the `resample` function. The required
    parameters of this function are as follows:


    +   - The raster whose values are to be resampled (x)

    +   - A raster that defines the grid to which the values will be transferred (y)

    +   - The resampling method (`method`)


    The `resample` function currently provides two resampling methods. The method
    that we use determines the way in which a cell in the new raster gets its value,
    based on the old raster''s values:


    +   - `"ngb"`: Nearest-neighbor; assigns the value of the nearest cell

    +   - `"bilinear"`: Bilinear interpolation; assigns a weighted average of the
    four nearest cells (the default)


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_200_0.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'The nearest-neighbor interpolation retains the original values, only transferring
    them to the new grid according to proximity, while resampling methods that use
    weighted averages from several cells (such as bilinear interpolation) inevitably
    involve modification of the original values thus producing a smoother image. Therefore,
    in cases where the original values should be preserved, the nearest-neighbor resampling
    method is recommended. In categorical rasters with integers representing different
    cover types, for example, it would make no sense to calculate a weighted average
    of categories. For instance, in a raster with two categories, say 1 for forest
    and 2 for pasture, the average of the four cell values is frequently not going
    to be equal to either 1 or 2, making the resulting image meaningless. On the other
    hand, when visual appearance is the primary consideration, bilinear interpolation
    and similar weighted-average methods are recommended.


    For our resampling examples, we will use two NDVI images: one from Landsat and
    one from MODIS. As the Landsat and MODIS images are defined in the same CRS and
    they overlap (the MODIS image extent encompasses the Landsat image extent) – although
    they have very different resolutions (the Landsat image resolution is 30 m while
    the MODIS resolution is 500 m) – we can resample each one with the other. In the
    following three examples, we will perform these steps:


    +   1. Compare the original Landsat image with the one resampled according to
    the MODIS grid.

    +   2. Compare the original MODIS image with the one resampled according to the
    Landsat grid.

    +   3. Compare the MODIS image resampling results using two methods: nearest-neighbor
    and bilinear interpolation.


    For a Landsat NDVI image, we will use the `ndvi_00` raster that we previously
    calculated based on an image obtained on October 4, 2000. As for MODIS, the raster
    `r` contains 280 NDVI images for the period between February 18, 2000 and April
    6, 2012 (refer to *Chapter 4, Working with Rasters*). To make the comparison more
    interesting, we will select the date of acquisition closest to October 4, 2000.
    Using the `dates$date` vector of MODIS acquisition dates (as we saw in *Chapter
    3, Working with Tables*), we can find out the index of the date closest to October
    4, 2000 by performing the following steps:


    +   1. Find the vector of differences between each date in `dates$date` and October
    4, 2000.

    +   2. Calculate absolute differences using the `abs` function.

    +   3. Find the index of the minimal difference value using `which.min`.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'These three steps can be accomplished with a single line of code, as follows:


    ```

    > l_date = which.min(abs(dates$date - as.Date("2000-10-04")))

    ```


    The result, assigned to l_date, is the index of the MODIS image closest in its
    acquisition date to October 4, 2000. It is equal to 15:


    ```

    > l_date

    [1] 15

    ```


    Thus, for the examples, we will use r[[l_date]], the fifteenth layer of the multiband
    raster r (the corresponding date of acquisition is September 29, 2000, as dates$date[l_date]
    will show).


    In our first example, we will resample the Landsat image ndvi_00 to the MODIS
    grid of the r[[l_date]] image using the nearest-neighbor method as follows:


    ```

    > l_resample = resample(ndvi_00, r[[l_date]], method = "ngb")

    ```


    Let''s compare the original Landsat image ndvi_00 and the resampled image l_resample
    by plotting both as follows:


    ```

    > plot(ndvi_00, main = "Original Landsat image")

    > plot(l_resample, ext = extent(ndvi_00),

    + main = "Resampled to MODIS")

    ```


    Note that when plotting l_resample, we supply the ext parameter with the extent
    of the original Landsat image ndvi_00 to zoom in on the area of overlap. The l_resample
    image is, in fact, larger than ndvi_00 (it has the same extent as r[[l_date]])
    but all cells that do not overlap with ndvi_00 are assigned with NA.


    The resulting two images are shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_202_0.png)'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'On the left, we can see the detailed 30 meter resolution ndvi_00 image and
    on the right we see the rough 500 meter resolution image where the values of the
    nearest pixels of ndvi_00 were assigned to each of the pixels in r[[1_date]].


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_203_0.png)


    > When the original raster is much more detailed than the resampled result (such
    as in the previous example), considerable data loss takes place. This happens
    due to the fact that the value of only a single (in nearest-neighbor) or a few
    (in bilinear interpolation) 30 meter pixel(s) determines the value of a much larger
    500 meter pixel in the new image, in our particular example for instance. Aggregation
    and zonal extraction according to polygons (as we will see in the next chapter)
    are more desired solutions when raster resolution is greatly reduced as part of
    resampling.


    The opposite operation is to resample the MODIS NDVI values from r[[1_date]] to
    the Landsat grid of the ndvi_00, again using the nearest-neighbor method:


    ```

    > r_resample = resample(r[[1_date]], ndvi_00, method = "ngb")

    ```


    In this case, the result r_resample is smaller in its extent than the original
    MODIS image r[[1_date]]; it has the same extent as ndvi_00. To show them side-by-side
    more conveniently, we will first extend r_resample to match the extent of r[[1_date]].
    This can be done using the extend function that extends the raster according to
    and an Extent object (or an object from which an Extent object can be derived,
    such as a RasterLayer). The extend function adds NA rows and columns as necessary
    to increase the raster extent; it is therefore, in a way, the opposite of trim:


    ```

    > r_resample = extend(r_resample, r[[1_date]])

    ```


    We will now plot the results of our second resampling example: the original MODIS
    image r[[1_date]] and the resampled image r_resample. While plotting r[[1_date]],
    we will add a rectangle surrounding the extent of ndvi_00 to aid in the comparison:


    ```

    > plot(r[[1_date]], main = "Original MODIS image")

    > plot(extent(ndvi_00), add = TRUE)

    > plot(r_resample, main = "Resampled to Landsat")

    ```'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Modifying Rasters and Analyzing Raster Time Series


    The two resulting images are shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_204_0.png)


    As we can see, the resampled image is identical in appearance to the respective
    portion of the original image, although it has a 30 meter resolution unlike the
    original image that has a 500 meter resolution. The reason is that each set of
    30 m Landsat pixels that coincides with a single 500 meter pixel in the MODIS
    image gets the value of that single pixel. Thus, it appears as if we have 500
    meter pixels even if the underlying resolution is much higher.


    What if we want to make the image look smoother? In such a case, we can use the
    bilinear interpolation method instead of the nearest-neighbor method. Let''s perform
    the resampling operation from the last example twice, using the nearest-neighbor
    method (the same way we just did, assigning the result to r_resample_ngb this
    time) and the bilinear interpolation method (assigning the result to r_resample_bil).
    The results will then be combined in a two-band raster with layer names specifying
    resampling method:


    ```

    > r_resample_ngb = resample(r[[1_data]], ndvi_00, method = "ngb")

    > r_resample_bil = resample(r[[1_data]], ndvi_00,

    + method = "bilinear")

    > resample_results = stack(r_resample_ngb, r_resample_bil)

    > names(resample_results) = c("Nearest neighbor",

    + "Bilinear interpolation")

    ```'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'We will plot the results using the levelplot function of the rasterVis package.
    Contours are enabled with contour=TRUE to highlight the differences between methods:


    ```

    ```r

    > library(rasterVis)

    > levelplot(resample_results,

    + par.settings = RdBuTheme,

    + contour = TRUE)

    ```

    ```


    The following screenshot shows the graphical output:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_205_0.png)


    As we saw in the previous example with nearest-neighbor resampling (the left image),
    sets of adjacent cells that overlap with a single 500 meter pixel get the same
    value, and thus the contours follow the coarse-grained pattern of MODIS pixels.
    With bilinear interpolation (the right image), on the other hand, each 30 m cell
    gets the average of four MODIS pixels closest to it, weighted according to their
    respective distances; thus, most (if not all) cell values are unique and the image
    is much smoother.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Raster reprojection


    As mentioned earlier, raster reprojection— unlike vector layers reprojection—
    involves resampling. Unlike vector layers, where all points are independent and
    thus their coordinates can be individually transformed to a new CRS (refer to
    the previous chapter), raster pixel coordinates that are transformed to a different
    CRS will not form a legitimate grid on that CRS (that is, a grid with equal distances
    between all adjacent pixels and parallel to the CRS x and y axes); rasters therefore
    require resampling. Thus, raster reprojection consists of two steps: reprojection
    of the raster pixel coordinates to the new CRS (analogous to reprojecting a vector
    layer) and resampling of the pixel values to a grid defined in the new CRS.


    There are two main ways of defining the new grid in raster reprojection: we can
    either provide only the new CRS definition and let the grid be generated automatically,
    or we can provide a specific grid of our own. In the latter case, the process
    is very similar to resampling; the only change is that the new grid has a different
    CRS from that of the original raster.


    In R, the `projectRaster` function provides raster reprojection functionality
    and supports both previously mentioned ways of defining a new grid. In the first
    case, when we want the grid to be automatically generated, we need to supply:


    +   - The raster to be reprojected (`from`)

    +   - The target CRS, as a PROJ.4 string (`crs`)

    +   - Optionally, the required resolution (`res`)


    In the second case, when we want to define the grid ourselves, we need to supply:


    +   - The raster to be reprojected (`from`)

    +   - The raster defining the target grid (`to`)


    In both scenarios, we also need to specify the resampling method, either "ngb"
    or "bilinear" (the default).


    As an example, we will reproject `dem` from its geographic CRS to the UTM Zone
    36N projection. The corresponding PROJ.4 string, as we have already done in the
    previous chapters, will be obtained from another raster (`r`). Prior to reprojection,
    let''s print out the current properties of `dem` in order to compare them later
    with the properties of the reprojection result:


    ```

    > dem

    class      : RasterLayer

    dimensions : 390, 384, 149760  (nrow, ncol, ncell)

    resolution : 0.0008333333, 0.000833333  (x, y)

    ```'
  merge: -1
  img_proc: true
