    # Big Data Analytics with R and Hadoop


    ISBN: 978-1-78216-328-2      Paperback: 238 pages


    Set up an integrated infrastructure of R and Hadoop to turn your data analytics
    into Big Data analytics


    +   1. Write Hadoop MapReduce within R.

    +   2. Learn data analytics with R and the Hadoop platform.

    +   3. Handle HDFS data within R.

    +   4. Understand Hadoop streaming with R.


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_362_1.png)


    # Bioinformatics with R Cookbook


    ISBN: 978-1-78328-313-2      Paperback: 340 pages


    Over 90 practical recipes for computational biologists to model and handle real-life
    data using R


    +   1. Use the existing R packages to handle biological data.

    +   2. Represent biological data with attractive visualizations.

    +   3. An easy-to-follow guide to handle real-life problems in bioinformatics
    such as next-generation sequencing and microarray analysis.'
