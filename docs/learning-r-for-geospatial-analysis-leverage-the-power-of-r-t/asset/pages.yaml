- pgno: 236
  md: '```

    5   0.2925  0.3223

    6   0.4998  0.5841

    7     NA    0.5841

    8   0.7126  0.5086

    ```


    We can see that the seventh point feature, the one corresponding to the (3,2)
    raster position, indeed contains an NA value corresponding to layer 1.


    # Raster-to-contours conversion


    Creating points (see the previous section) and polygons (see the next section)
    from a raster is relatively straightforward. In the former case, points are generated
    at cell centroids, while in the latter, rectangular polygons are drawn according
    to cell boundaries. On the other hand, lines can be created from a raster using
    various different algorithms designed for more specific purposes. Two common procedures
    where lines are generated based on a raster are constructing contours (lines connecting
    locations of equal value on the raster) and finding least-cost paths (lines going
    from one location to another along the easiest route when cost of passage is defined
    by raster values). In this section, we will see an example of how to create contours
    (readers interested in least-cost path calculation can refer to the gdistance
    package, which provides this capability in R).


    As an example, we will create contours from the DEM of Haifa (dem; see the previous
    chapter). Creating contours can be done using the rasterToContour function. This
    function accepts a RasterLayer object and returns a SpatialLinesDataFrame object
    with the contour lines. The rasterToContour function internally uses the base
    function contourLines, and arguments can be passed to the latter as part of the
    rasterToContour function call. For example, using the levels parameter, we can
    specify the breaks where contours will be generated (rather than letting them
    be determined automatically).


    The raster dem consists of elevation values ranging between -14 meters and 541
    meters:


    ```

    > range(dem[], na.rm = TRUE)

    [1] -14 541

    ```


    Therefore, we may choose to generate six contour lines, at 0, 100, 200, ..., 500
    meter levels:


    ```

    > dem_contour = rasterToContour(dem, levels = seq(0, 500, 100))

    ```'
  merge: -1
  img_proc: true
