- pgno: 232
  md: 'The mask argument can either be an overlapping raster (in which case the values
    in x corresponding to NA in mask are assigned with NA) or a vector layer (in which
    case the values in x not coinciding with any feature in mask are assigned with
    NA). Therefore, the following expression yields a new raster based on slope where
    all pixels not covered by haifa_natural are masked (that is, assigned with NA):


    ```

    > natural_mask = mask(slope, haifa_natural)

    ```


    > The previous expression is analogous to the following expression:

    > > natural_mask = mask(slope,

    > + rasterize(haifa_natural, slope))


    For convenience, we will crop the result, natural_mask, using haifa_ext:


    ```

    > natural_mask = crop(natural_mask, haifa_ext)

    ```


    We will repeat the exact same procedure with haifa_buildings to get the buildings_mask
    raster as well:


    ```

    > buildings_mask = mask(slope, haifa_buildings)

    > buildings_mask = crop(buildings_mask, haifa_ext)

    ```


    Now let''s plot both natural_mask and buildings_mask, side-by-side, to observe
    how masking has been carried out:


    ```

    > plot(stack(natural_mask, buildings_mask))

    ```


    The resulting graphical output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_232_0.png)'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'After observing the two results, we can see that while natural_mask (the left
    panel) mostly consists of continuous patches of non-NA areas, buildings_mask (the
    right panel) is composed of very small non-NA patches containing a few pixels.
    The reason for such behavior is that masking with a polygonal layer retains the
    values of only those cells whose cell center falls within a polygon. This behavior
    is appropriate for haifa_natural, which is mainly composed of large polygons,
    each one encompassing many cells. However, for haifa_buildings, the pixels that
    are retained are only those whose center falls within either one of the building
    polygons in haifa_buildings. This clearly underestimates the built area. A simple
    solution would be to mask using building centroids instead, in which case those
    pixels where a centroid of haifa_buildings falls will be retained. For this purpose,
    we will create a point layer to build centroids named buildings_ctr:


    ```

    > buildings_ctr = gCentroid(haifa_buildings, byid = TRUE)

    ```


    Now, we will repeat the masking procedure using this layer:


    ```

    > buildings_mask = mask(slope, buildings_ctr)

    > buildings_mask = crop(buildings_mask, haifa_ext)

    ```


    Let''s plot the result once again to see the difference:


    ```

    > plot(stack(natural_mask, buildings_mask))

    ```


    The graphical output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_233_0.png)


    This time, many more pixels remained unmasked in buildings_mask since all pixels
    coinciding with a centroid of at least one building were retained (as in the previous
    example of towns rasterization).


    We will proceed with this example in Chapter 9, Advanced Visualization of Spatial
    Data, displaying the value distribution of both rasters with histograms.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Creating vector layers from a raster


    The opposite operation to rasterization, which has been presented in the previous
    section, is the creation of vector layers from raster data. The procedure of extracting
    features of interest out of rasters, in the form of vector layers, is often necessary
    for analogous reasons underlying rasterization—when the data held in a raster
    is better represented using a vector layer, within the context of specific subsequent
    analysis or visualization tasks. Scenarios where we need to create points, lines,
    and polygons from a raster can all be encountered. In this section, we are going
    to see an example of each.


    # Raster-to-points conversion


    In raster-to-points conversion conversion, each raster cell center (excluding
    NA cells) is converted to a point. The resulting point layer has an attribute
    table with the values of the respective raster cells in it.


    Conversion to points can be done with the rasterToPoints function. This function
    has a parameter named spatial that determines whether the returned object is going
    to be SpatialPointsDataFrame or simply a matrix holding the coordinates and the
    respective cell values (spatial=FALSE, the default value). For our purposes, it
    is thus important to remember to specify spatial=TRUE.


    As an example of a raster, let''s create a subset of the raster r, with only layers
    1-2, rows 1-3, and columns 1-3:


    ```

    > u = r[[1:2]][1:3, 1:3, drop = FALSE]

    ```


    To make the example more instructive, we will place NA in some of the cells and
    see how this affects the raster-to-point conversion:


    ```

    > u[2, 3] = NA

    > u[[1]][3, 2] = NA

    ```


    Now, we will apply rasterToPoints to create a SpatialPointsDataFrame object named
    u_pnt out of u:


    ```

    > u_pnt = rasterToPoints(u, spatial = TRUE)

    ```


    Let''s visually examine the result we got with the first layer of u serving as
    the background:


    ```

    > plot(u[[1]])

    > plot(u_pnt, add = TRUE)

    ```'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'The graphical output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_235_0.png)


    We can see that a point has been produced at the center of each raster cell, except
    for the cell at position (2,3), where we assigned NA to both layers. However,
    at the (3,2) position, NA has been assigned to only one of the layers (the first
    one); therefore, a point feature has been generated there nevertheless.


    The attribute table of u_pnt has eight rows (since there are eight points) and
    two columns (corresponding to the raster layers).


    ```

    > u_pnt@data

    layer.1 layer.2

    1  0.4242  0.4518

    2  0.3995  0.3334

    3  0.4190  0.3430

    4  0.4495  0.4846

    ```'
  merge: -1
