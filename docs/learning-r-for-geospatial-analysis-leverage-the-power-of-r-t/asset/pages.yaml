- pgno: 308
  md: "Then, we will bind both tables into a single one with rbind:\n\n```\n> slopes\
    \ = rbind(nat, build)\n> head(slopes)\n    cover     slope\n1 Natural 0.3740864\n\
    2 Natural 0.3918563\n3 Natural 0.4300925\n4 Natural 0.4843213\n5 Natural 0.5266151\n\
    6 Natural 0.3173897\n```\n\nThe data is ready to be plotted. This time, what we\
    \ are interested in is visually comparing distributions. The most obvious way\
    \ of doing this is to plot histograms of the two variables side by side. In ggplot2,\
    \ a histogram layer can be created with geom_histogram, specifying only a single\
    \ aesthetic — x. In order to produce two histograms in a single plot, we will\
    \ also use faceting.\n\nFaceting, as previously mentioned, is the generation of\
    \ numerous plots of the same type for different subsets of the data, within a\
    \ single graphical output. For example, in the present context we would like to\
    \ create two histograms side by side: one for the \"Buildings\" cover type and\
    \ another for the \"Natural\" cover type. The reason for using faceting — in addition\
    \ to saving the trouble of running the same code several times — is having a similar\
    \ appearance and common axes in all subplots and thereby, making the comparison\
    \ easier. There are two functions to produce facets in ggplot2; the difference\
    \ between them is in the way the subplots are geometrically arranged:\n\n+   -\
    \ facet_wrap: Used to create a continuous ribbon of panels, while (optionally)\
    \ specifying the number of rows or columns (with nrow and ncol). This is most\
    \ useful to create numerous subplots of the same type.\n\n+   - facet_grid: Used\
    \ to create a two-dimensional grid of panels with the rows and columns defining\
    \ different levels of a given variable. This is most useful when subplots are\
    \ defined by combinations of two variables.\n\nThe most important parameter of\
    \ both facet_wrap and facet_grid is the formula defining the grouping factor(s)\
    \ to create the facets. With facet_wrap, we can specify only a single factor (for\
    \ example, facet_wrap(~group)) since the facets form a one-dimensional ribbon.\
    \ With facet_grid, we can specify two factors: one for the rows and another one\
    \ for the columns (for example, facet_grid(group_row~group_column)). If we wish\
    \ to create facets with facet_grid according to a single factor, we can replace\
    \ one of the variables with a dot (.). For example, facet_grid(group_row~.) will\
    \ result in a vertical ribbon of facets (since there is no factor for the columns),\
    \ while facet_grid(.~group_column) will result in a horizontal ribbon of facets\
    \ (since there are no factors for the rows)."
  merge: -1
  img_proc: true
- pgno: 309
  md: 'To clarify things, it is best to show an example. The following code produces
    two histogram facets, according to the grouping variable `cover`, using `facet_grid`.
    Since we have only one grouping factor, we mark the column grouping as `.` to
    obtain a vertical ribbon (later in this chapter, in the Spain temperature maps
    example, we will use `facet_grid` with two grouping factors):


    ```

    ```r

    > ggplot(slopes, aes(x = slope)) +

    + geom_histogram() +

    + facet_grid(cover ~ .) +

    + scale_x_continuous("Slope (radians)") +

    + scale_y_continuous("Count") +

    + theme_bw()

    ```

    ```


    The resulting plot is shown on the *left* in the following screenshot. Since in
    this case we have a single grouping variable, the same kind of plot can also be
    produced with `facet_wrap`. Replacing `facet_grid(cover~.)` with `facet_wrap(~cover,ncol=1)`
    produces an identical plot, except for a slightly different facet labeling scheme;
    the latter plot is shown on the *right* in the following screenshot. Note that
    in both cases, the facets share a common *x* axis.


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_309_0.png)'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'Looking at these histograms, we can see that most buildings are located on
    relatively flat terrain while most natural areas occupy steeper slopes, which
    makes sense.


    > Quantitatively comparing the properties of slopes'' distributions is straightforward
    using tapply and the slopes table. For example, `tapply(slopes$slope, slopes$cover,
    mean)` will show that the mean slopes for the "Natural" and "Buildings" cover
    types are 0.23 and 0.15, respectively. Substituting mean with other functions
    (such as min, max, and sd) will yield other properties.


    # Saving the ggplot2 plots


    In addition to the usual method of saving a graphical output in a file (see *Chapter
    2, Working with Vectors and Time Series*), there is a specialized function called
    `ggsave` for saving ggplot2 plots. For example, the first image in this chapter
    was incorporated into this book from a PNG file, obtained with ggsave as follows:


    ```

    > ggplot(dat, aes(x = time, y = tmax)) +

    + geom_line()

    > ggsave("C:\\Data\\43670S_09_01.png", width = 5.5, height = 3.5)

    ```


    The ggsave function, by default, saves the last ggplot object that has been plotted
    in the graphical window. Therefore, the only mandatory parameter is the file path.
    The file extension provided in the path determines the file format (a PNG image
    in this case; see ?ggsave for a list of possible formats). The figure dimensions
    are taken as those of the currently active graphical window, unless explicitly
    specified through the width and height parameters. For instance, in this case,
    the width is equal to 5.5 inches (inches are the default unit, cm and mm are also
    possible) since this is a commonly used text width in the letter page format.


    > When saving the ggplot2 output to PDF, it is recommended to specify `useDingbats=FALSE`.
    This avoids potential problems associated with plot rendering, due to the default
    conversion of circles to text objects, when we prefer to leave the former as geometric
    objects.


    A ggplot object can also be assigned and kept in memory:


    ```

    > tmax_line = ggplot(dat, aes(x = time, y = tmax)) +

    + geom_line()

    ```'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'It is already apparent, from the last few examples, that the print method applied
    to such an object induces drawing it in a graphical window. Assignment of a complete
    ggplot2 plot, or individual layers (which we will see later), may serve at least
    two useful purposes:


    +   - We can save a plot with ggsave providing the plot object as an argument
    so that we do not have to wait for the plot to be drawn in the graphical window
    for no good reason. This way, we also do not need to keep in mind which plot was
    produced last. For example, after the tmax_line object has been created, we can
    save the plot it describes as follows:


    ```

    > ggsave(plot = tmax_line,

    + filename = "C:\\Data\\4367OS_09_01.png",

    + width = 5.5,

    + height = 3.5)

    ```


    +   - We can define useful combinations of layers and/or settings, which we will
    repeatedly use to save us the trouble of typing the whole collection of components
    when producing a series of plots that have some components in common. Complete
    themes, such as theme_bw, also serve this purpose. For example, the following
    expression produces the same plot we saw in the first image in this chapter:


    ```

    > tmax1 = ggplot(dat, aes(x = time, y = tmax))

    > tmax2 = geom_line()

    > tmax1 + tmax2

    ```


    # Plotting spatial data


    So far in this chapter, we introduced the ggplot2 package and briefly reviewed
    its syntax using a few simple, nonspatial examples. In the next two sections,
    we will move on to slightly more complicated examples, now involving spatial data.
    What you will see right away is that producing a map with ggplot2 is conceptually
    no different from producing any other kind of plot (because spatial data, in turn,
    is not conceptually different from any other type of data).'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'A map is, in fact, simply a two-dimensional plot with points, lines, polygons
    and/or rasters, with plot space corresponding to geographical space through a
    given CRS. Since plot space is tied to geographical space, a map has a specific
    aspect ratio between the x and y axes (1:1). In other words, we cannot stretch
    a map to be wider or narrower since this would distort the correct proportion
    between distances in the x and y directions (unlike the tmax time series plot
    we saw earlier in this chapter, for example, which can be stretched any way we
    like and still remain meaningful). As you may have noticed, the plot method, applied
    on spatial vector layers or rasters in previous chapters, also produces plots
    with a constant 1:1 aspect ratio. The difference is that in ggplot2, the input
    data comes as a data.frame object so the function has no way of knowing that the
    data is spatial. Therefore, we need to manually specify that the aspect ratio
    should be constant using the coord_equal function.


    To summarize these considerations, a map produced with ggplot2 is just like any
    other plot produced with this package, except for the following two characteristics:


    +   - The plot represents geographical space through a given CRS and includes
    spatial data in the form of points, lines, polygons, and/or rasters

    +   - The x and y axes scale ratio is fixed at 1:1 (using coord_equal)


    > It should be noted that ggplot2 (along with ggmap, which will be introduced
    in the next section) is not the best choice for all spatial data visualization
    tasks. Maps that require, for example, substantial annotation (such as labels,
    scale bars, and north arrows) or special display-optimization algorithms (such
    as reduced overlap between street name labels and other map elements) are easier
    to handle in traditional GIS software. The advantage of ggplot2, with respect
    to map making, becomes decisive in fairly analogous situations to those when R
    itself is advantageous:

    > - Automation: When we want to automatically produce a large number of high-quality
    maps, for example, using facets or loops

    > - Reproducibility: When we want to make sure exactly the same map is replicated
    with different datasets, at different times, or among different users

    > - All-in-one environment: When we want to show certain elements computed in
    R on a map (such as spatial interpolation predictions) or integrate other capabilities
    that R has (such as downloading real-time data from the Web) without needing to
    transfer the data between different software'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'Now that the framework to use ggplot2 with spatial data is defined in general
    terms, let''s proceed to the practical application. So far, we witnessed that
    spatial vector layers and rasters are best represented in R using special classes
    such as `SpatialPolygonsDataFrame` or `RasterLayer`. How can we convert these
    data structures to `data.frame` objects to be passed to ggplot? Point and raster
    layers are readily convertible to a `data.frame` object using the `as.data.frame`
    function (for example, we converted the `spain` raster to a `data.frame` object
    in the previous chapter). As already mentioned, however, lines and polygons are
    more complex than points and rasters due to the fact that each line or polygon
    geometry is composed of a variable number of points. The order in which the points
    are connected is also an integral part of the data, responsible for the correct
    geometry drawing. Therefore, a `data.frame` object representing a line or polygon
    layer must have x and y coordinate columns (as do `data.frame` objects for points
    and rasters), but also a grouping column (to denote which set of points forms
    a given line or polygon) and an ordering column (to specify the order by which
    the points are connected when drawing the given line or polygon). Conveniently,
    a function called `fortify` is already defined in ggplot2 to convert line and
    polygon layers into `data.frame` objects while preserving these properties.


    For example, at the end of *Chapter 5, Working with Points, Lines, and Polygons*,
    we created a `SpatialPolygonsDataFrame` object named `county` that contains the
    borders of US counties along with average population densities for each county
    in the attribute table (the density column). In order to bring the data in county
    to a `data.frame` form, readily available to be used by ggplot, we need to apply
    the `fortify` function. The "regions" parameter of `fortify` is used to specify
    which attribute table column corresponds to individual features. Since the FIPS
    column identifies unique counties in the attribute table, we can use it as the
    region:


    ```

    ```r

    > county_f = fortify(county, region = "FIPS")

    > head(county_f)

    ```

    ```


    |   | long | lat | order | hole | piece | group | id |

    |---:|---:|---:|---:|:---|---:|---:|:---|

    | 1 | 1225972 | -1274991 | 1 | FALSE | 1 | 01001.1 | 01001 |

    | 2 | 1234371 | -1274114 | 2 | FALSE | 1 | 01001.1 | 01001 |

    | 3 | 1244907 | -1272280 | 3 | FALSE | 1 | 01001.1 | 01001 |

    | 4 | 1244132 | -1267496 | 4 | FALSE | 1 | 01001.1 | 01001 |

    | 5 | 1265116 | -1263940 | 5 | FALSE | 1 | 01001.1 | 01001 |

    | 6 | 1265318 | -1263907 | 6 | FALSE | 1 | 01001.1 | 01001 |'
  merge: -1
