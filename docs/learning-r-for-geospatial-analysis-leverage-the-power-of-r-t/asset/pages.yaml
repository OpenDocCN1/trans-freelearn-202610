- pgno: 84
  md: '# Subsetting data.frame objects


    There are two principal ways to create a subset of a data.frame object. The first
    involves accessing separate columns, using the column names, with the $ operator.
    The second involves providing the two vectors of indices, names or logical values,
    with the [ operator.


    Using the $ operator, we can gain access to separate columns in a data.frame object.
    To do this, we simply insert the name of the data.frame to the left of the $ operator
    and the name of the required column to the right, as follows:


    ```

    > df$num

    [1] 1 2 3 4

    > df$lower

    [1] "a" "b" "c" "d"

    > df$upper

    [1] "A" "B" "C" "D"

    ```


    Since the columns of a data.frame object are basically vectors, we can employ
    all the previously presented vector methods in columns of a data.frame object
    the same way we would in independent vectors. For example, we can replace the
    -9999 values (which mark the missing data) with NA, for each of the three measured
    variables in dat, as follows:


    ```

    > dat$tcp cp [dat$tcp cp == -9999] = NA

    > dat$mmxt [dat$mmxt == -9999] = NA

    > dat$mmnt [dat$mmnt == -9999] = NA

    ```


    The only difference from how we did this operation in the previous chapter is
    the dat$ part. This means that we refer to columns of the data.frame object (dat),
    rather than independent vectors. Now, let''s convert the tcp cp values to mm units
    and mmxt and mmnt values to degree Celsius units by dividing each value in the
    respective columns by 10, as follows:


    ```

    > dat$tcp cp = dat$tcp cp / 10

    > dat$mmxt = dat$mmxt / 10

    > dat$mmnt = dat$mmnt / 10

    ```


    Note that if we would have made the division by 10 before encoding the -9999 values
    as NA, we would have got the -999.9 values, while now that we have NA values,
    they will remain NA since NA/10 gives NA. This highlights the importance of representing
    missing data with NA to reduce the chance of mistakes.'
  merge: -1
  img_proc: true
- pgno: 85
  md: "Using the [ operator, we can obtain a subset of a data.frame object, which\
    \ will include the intersection of any number of rows and columns. This works\
    \ the same way as vectors subsetting with one difference, that is, a data.frame\
    \ is a two-dimensional object while a vector is a one-dimensional object. Therefore,\
    \ we need to provide two indices rather than just one.\n\nRemember that when subsetting\
    \ with the [ operator in data.frame, the first index refers to rows and the second\
    \ index refers to columns. This arrangement is going to appear in other contexts\
    \ as well (for example, in matrices and rasters).\n\nThe two vectors of indices,\
    \ used in order to create a subset of a data.frame object, can include any combination\
    \ of the following:\n\n+   - A numeric vector, in which case the numeric vector\
    \ refers to the indices of rows/columns to retain in the subset\n+   - A character\
    \ vector, in which case the character vector indicates the names of rows/columns\
    \ to retain\n+   - A logical vector, in which case the logical vector indicates\
    \ whether to retain each row/column of data.frame\n\nWe have been extensively\
    \ using methods 1 and 3 in vectors (see the previous chapter), so extending the\
    \ methods to the two-dimensional case should be intuitive. In fact, method 2 can\
    \ also be used with vectors since vectors can have element names the same way\
    \ that a data.frame object has row names and column names (but we are not going\
    \ to use that here).\n\nFor example, the following expression gives us the element\
    \ populating the second row and the third column of df:\n\n```\n> df[2, 3]\n[1]\
    \ \"B\"\n```\n\nLeaving an empty space instead of the row's or column's index\
    \ indicates we are interested in all the elements of the respective dimension\
    \ (all rows or all columns). For example, the following expressions return all\
    \ elements of the second row and the third column of df:\n\n```\n> df[2, ]\n \
    \ num lower upper\n2   2    b     B\n> df[,3]\n[1] \"A\" \"B\" \"C\"  \"D\"\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 86
  md: "# Working with Tables\n\nBy default, a subset of a `data.frame` object is converted\
    \ into a simpler class if values from a single column are involved. For example,\
    \ the `df[2, 3]` and `df[, 3]` expressions returned (character) vectors. The `df[2,\
    \ ]` expression returned a `data.frame` object since three columns are involved.\
    \ In fact, the second row of df contains both numeric and character values, while\
    \ we already know that a vector can only contain values of the same type. If we\
    \ wish, we can suppress the `data.frame` simplification by using the `drop` parameter,\
    \ indicating `FALSE` (instead of the default value, `TRUE`), and then the subset\
    \ will remain a `data.frame` object no matter what:\n\n```\n```r\n> df[ , 3, drop\
    \ = FALSE]\n  upper\n1     A\n2     B\n3     C\n4     D\n```\n```\n\nCompare the\
    \ output to the one from the previous example. Using `drop=FALSE` in the previous\
    \ expression, we got a `data.frame` object (with four rows and one column) instead\
    \ of a vector.\n\nThe other two methods of subsetting a `data.frame` object are\
    \ using logical and character vectors as indices. Let's take a look at the following\
    \ example:\n\n```\n```r\n> df[df$lower %in% c(\"a\",\"d\"), c(\"lower\",\"upper\"\
    )]\n    lower upper\n1       a     A\n4       d     D\n```\n```\n\nIn this expression,\
    \ if we put it in plain language, we are requesting to get the subset of `df`\
    \ with the rows being where the values of the lower column are either \"a\" or\
    \ \"d\", and the columns are both lower and upper.\n\nOne very helpful function\
    \ to use with `data.frame` objects is `complete.cases`. This function returns\
    \ a logical vector, the same length as the number of rows in the data.frame object,\
    \ indicating whether each row (case) is complete (has no NA values in it). When\
    \ a given row is complete, the respective element in the logical vector will be\
    \ TRUE; when a row is incomplete, the value will be FALSE. Then, the resulting\
    \ logical vector can be used to remove the incomplete rows from a table as follows\
    \ (note that the output is not printed here to save space):\n\n```\n```r\n> dat[complete.cases(dat),\
    \ ]\n```\n```\n\nNote that in this expression, we use the vector returned by `complete.cases`\
    \ as a logical vector indicating the selection of rows in dat to be retained."
  merge: -1
  img_proc: true
- pgno: 87
  md: "# # Calculating new data fields\n\nAs previously shown, we can assign new values\
    \ to a column of a table (or to a subset of a column) using the $ operator. If\
    \ the column name we assign does not exist in the table, a new column will be\
    \ created to accommodate the data. Let's take a look at the following examples:\n\
    \n```\n```r\n> df\n  num lower upper\n1   1     a     A\n2   2     b     B\n3\
    \   3     c     C\n4   4     d     D\n> df$word[df$num == 2] = \"Two\"\n> df\n\
    \  num lower upper word\n1   1     a     A <NA>\n2   2     b     B Two\n3   3\
    \     c     C <NA>\n4   4     d     D <NA>\n```\n```\n\nHere, we made an assignment\
    \ of the character value \"Two\" to a subset of the word column (which did not\
    \ previously exist in df) corresponding to the rows where the value of column\
    \ num is equal to 2. As a result, a new column has been created, which contains\
    \ the assigned value (and NA for all the other elements). Note that <NA> is simply\
    \ the character representation of NA (the column word is a character vector).\n\
    \nAs another example with our climatic data, we are going to create two new columns,\
    \ holding the year and month of each measurement. For this purpose, we will first\
    \ convert the date column to a Date object. Then, we will extract the years and\
    \ months from the data in this column as follows (see the previous chapter for\
    \ details):\n\n```\n```r\n> dat$date = as.Date(as.character(dat$date), format\
    \ = \"%Y%m%d\")\n> dat$month = as.numeric(format(dat$date, \"%m\"))\n> dat$year\
    \ = as.numeric(format(dat$date, \"%Y\"))\n> head(dat)\n             station station_name\
    \ elevation latitude longitude\n1 GHCND:SP000060010       IZANA SP      2371 \
    \ 28.3089  -16.4992\n2 GHCND:SP000060010       IZANA SP      2371  28.3089  -16.4992\n\
    3 GHCND:SP000060010       IZANA SP      2371  28.3089  -16.4992\n4 GHCND:SP000060010\
    \       IZANA SP      2371  28.3089  -16.4992\n5 GHCND:SP000060010       IZANA\
    \ SP      2371  28.3089  -16.4992\n6 GHCND:SP000060010       IZANA SP      2371\
    \  28.3089  -16.4992\n\n                         date tpcp mmxt mmnt month year\n\
    ```\n```"
  merge: -1
