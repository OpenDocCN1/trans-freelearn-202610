- pgno: 221
  md: '![](img/ebfd6294770b225fdeceda9a7b8b560e_221_0.png)


    As we can see in the preceding diagram, our goal is to create a new raster s,
    where each column holds the vector of row averages from r. In other words, each
    s row is going to represent an r row (or y axis positions in space), while each
    s column is going to represent an r layer (or positions in time). We will perform
    the operation in two steps: first, creating an empty raster s (with the required
    dimensions) and second, populating it with values. We will also see two different
    ways of accomplishing the task: using a for loop and using apply.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'As we can see in the preceding diagram, the number of rows in s should be equal
    to the number of rows in r, while the number of columns in s should be equal to
    the number of layers in r. In addition to setting row and column numbers, using
    parameters xmin, xmx, ymin, and ymx, we will set the minimum and maximum coordinates
    on the x and y axes (to avoid the default, where the extent is -180 to 180 on
    the x axis and -90 to 90 on the y axis). The coordinate ranges on the x and y
    axes are going to be 0 to 280 and 0 to 100, respectively; moreover, since the
    number of columns and rows is accordingly 280 and 100, the raster resolution will
    be 1 (an arbitrary unit) on both axes:


    ```

    > s = raster(nrows = nrow(r), ncols = nlayers(r),

    + xmin = 0, xmx = nlayers(r), ymin = 0, ymx = nrow(r))

    ```


    Now that raster s is ready, we need to populate it with values. Following our
    first for loop method, we will define a new function called raster_rowMeans that,
    when provided with a raster (x) and the layer index (layer), returns a vector
    of row means in that layer. This function actually consists of a single expression
    as it simply applies the base function rowMeans on the matrix of values from a
    given layer, obtained with as.matrix:


    ```

    > raster_rowMeans = function(x, layer) {

    + rowMeans(as.matrix(x[[layer]]),

    + na.rm = TRUE)

    + }

    ```


    Now, all is left to be done is to go over the layers of r, each time calculating
    the row means in the current layer (with the raster_rowMeans function) and assigning
    the resulting vector to the appropriate column of s (exactly as depicted in the
    preceding diagram):


    ```

    > for(i in 1:nlayers(r)) {

    + s[,i] = raster_rowMeans(r, i)

    + }

    ```


    Now s is filled with the appropriate values, and we can use the levelplot function
    to display it. The additional at parameter of the levelplot function sets the
    breaks between color levels and contours. We use it to slightly reduce the quantity
    of contours and make the image clearer:


    ```

    > levelplot(s,

    + par.settings = RdBuTheme,

    + contour = TRUE,

    + margin = FALSE,

    + at = seq(0,0.6,0.05))

    ```'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The graphical output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_223_0.png)


    The preceding screenshot shows the average NDVI at each point in time ($x$ axis)
    and north-south position in space ($y$ axis). Two main patterns are evident: first,
    along the $x$ axis (time) we can see the periodical behavior of NDVI between the
    interchanging wet and dry seasons. However, there are also inter-annual differences
    – in certain years, NDVI is higher or lower than average – due to variation in
    climatic conditions and therefore in vegetation activity. Second, along the $y$
    axis (the north-south position), we can see the NDVI gradient from the relatively
    wet conditions, and thus a higher NDVI to the north, compared to drier conditions;
    consequently, we can also see a lower and more stable NDVI to the south.


    The second method of obtaining the same result will be defined with less code,
    although it might be conceptually more difficult to grasp. The first step of the
    task, defining the empty raster $s$, is identical:


    ```

    ```r

    > s = raster(nrows = nrow(r), ncols = nlayers(r),

    + xmm = 0, xmx = nlayers(r), ymn = 0, ymx = nrow(r))

    ```

    ```


    However, the second step is different. Instead of going over the layers of r with
    a for loop, we will convert r to a three-dimensional array and utilize the apply
    function. The former is accomplished with the as.array function:


    ```

    ```r

    > r_array = as.array(r)

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'The result, r_array, is an array object where the first dimension corresponds
    to r rows, the second dimension to r columns, and the third dimension to r layers.
    We can therefore use apply to utilize rowMeans on the third dimension, obtaining
    the vector of row means for each third-dimension element (layer), which is exactly
    what we need. The values of the resulting matrix can be directly transferred to
    s:


    ```

    > s[] = apply(r_array, 3, rowMeans, na.rm = TRUE)

    ```


    The raster s we just created is identical to the one created (and plotted) earlier.
    Although the same results were produced, an important difference between the two
    methods is in the speed of execution. Accessing one raster layer at a time using
    a loop is slow compared to an apply operation on an array, which is generally
    very fast. For example, on the computer this book is written on, calculating the
    values of s using the first method is performed in about 1.8 minutes as compared
    to 2.6 seconds using the second method (that is ~40 times faster!). It is therefore
    often useful to transform a raster into a simpler object (matrix or array) before
    doing intensive calculations.


    # Summary


    In this chapter, you learned additional methods and procedures for working with
    raster layers in R. We now know how to crop, aggregate, or reproject a raster
    to bring it to the desired extent, resolution, and CRS. We discussed how focal
    filtering and clumping can be applied to highlight patterns of interest in a raster.
    We also discussed how topography-related variables can be derived from a DEM,
    and how spatio-temporal raster data can be aggregated.


    In the next chapter, you will learn about the interface between rasters and vector
    layers, and the different ways in which both can be combined in a spatial analysis.'
  merge: -1
  img_proc: true
