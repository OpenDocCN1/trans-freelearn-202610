- pgno: 279
  md: "Sometimes the temperature for a given altitude is lower than usual and sometimes\
    \ higher. Can we create a model where the temperature is predicted using elevation\
    \ and then fine-tuned using nearby meteorological measurements? UK does exactly\
    \ this by adding a weighted average of stations values (as OK does) to a general\
    \ trend surface defined by a linear function based on covariates (in this case,\
    \ elevation).\n\nTo interpolate the temperature data using UK with elevation as\
    \ a covariate, we need to make two principal alterations compared to the OK procedure:\n\
    \n+   - The variogram model is constructed according to the so-called residual\
    \ variogram, which portrays the spatial autocorrelation of the residuals from\
    \ the chosen trend\n+   - The predicted values are calculated based on both the\
    \ neighboring measured values (as in OK) and the covariates; thus, each point\
    \ we would like to predict must be accompanied by its respective set of covariate\
    \ values\n\nStarting with the variogram model, as opposed to OK, our formula now\
    \ contains elevation as an independent variable:\n\n```\n> v = autofitVariogram(formula\
    \ = value ~ elevation,\n+ input_data = dat)\n```\n\nPlotting the new v object\
    \ will show that both the empirical variogram and the variogram model are different\
    \ from what we previously had since they now concern the residuals from the elevation\
    \ trend. Next, we need to create the gstat object, which contains the information\
    \ to perform UK interpolation, supplying value~elevation as the formula and v$var_model\
    \ as the variogram model:\n\n```\n> g = gstat(formula = value ~ elevation,\n+\
    \ data = dat,\n+ model = v$var_model)\n> g\ndata:\nvar1 : formula = value~`elevation`\
    \ ; data dim = 75 x 5\nvariograms:\n       model      psill      range kappa\n\
    var1[1]   Nug 0.7410872      0.00   0.0\nvar1[2]   Ste 0.9696567  35781.93   0.2\n\
    ```"
  merge: -1
  img_proc: true
