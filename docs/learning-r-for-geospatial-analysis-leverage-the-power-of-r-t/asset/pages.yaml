- pgno: 265
  md: 'The core of the gstat package is a function named gstat, which is used to produce
    objects (of a class also named gstat) that hold all necessary information to perform
    spatial interpolation (as well as other operations such as cross-validation).
    Among the numerous parameters that the gstat function accepts, there is, in fact,
    no parameter where we can specify the desired interpolation method. Instead, when
    interpolation is triggered on a gstat object, the method is determined based on
    the input data the object contains. In this chapter, we are going to explore only
    a portion of the functionality of gstat, utilizing three of its parameters:


    +   - formula: The formula that defines the dependent and independent variables
    (an object of the formula class)

    +   - data: The measured point data (a SpatialPointsDataFrame object; it can also
    be a data.frame object but we will not use this option)

    +   - model: The variogram model (an object of the variogramModel class)


    These three parameters determine whether IDW, OK, or UK is used based on the following
    decision tree:


    +   - If there is no variogram model (model=NULL, the default), IDW is used

    +   - If a variogram model is passed to model, and the formula:

    +     - contains no independent variables, OK is used

    +     - contains at least one independent variable, UK is used


    Our dependent variable column is value and an intercept-only model (that is, a
    model with no independent variables) formula in R is, by convention, specified
    by ~1. Therefore, the following expression creates a gstat object (named g) that
    holds the necessary information to predict the minimum temperature based on the
    measured data in dat using IDW:


    ```

    > library(gstat)

    > g = gstat(formula = value ~ 1, data = dat)

    ```


    Printing g shows a summary of the information it contains as follows:


    ```

    > print(g)

    data:

    var1 : formula = value~`1 ; data dim = 75 x 5

    ```


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_265_0.png)


    > Note that this is just a summary; g, in fact, also contains the dat object itself,
    with the measured values and independent variables (if any), since it serves as
    the calibration data necessary to actually perform the interpolation.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Spatial Interpolation of Point Data


    To interpolate, what we now need is to provide the points for which we would like
    to make predictions. Conveniently, the raster function includes a function named
    `interpolate` that, given a raster (the object parameter) and a spatial prediction
    model (the model parameter), yields a new raster with predicted values. This way,
    we do not need to make the manual conversions to and from a raster, as we did
    in nearest-neighbor interpolation. For example, the following expression uses
    the model and calibration data held in `g` to make temperature predictions for
    the grid defined by `dem_spain`:


    ```

    > z = interpolate(dem_spain, g)

    ```


    There are two things to note here:


    +   - First, as you remember, text messages are omitted in this book to save space.
    However, readers who run the preceding expression in R will see the message `[inverse
    distance weighted interpolation]` appearing on the screen. This reassures the
    user that indeed the expected type of model has been chosen by `gstat`.

    +   - Second, it is important to understand that, if we do not use covariates
    (that is, independent variables in the model formula), the `dem_spain` raster
    serves only as a grid pointing to the locations where we would like to calculate
    predicted values (the raster values play no role in the interpolation). This is
    opposed to UK interpolation, where the raster serves both to point at predicted
    locations and provide covariate values for each location.


    Plotting the predicted surface z will show that predicted values were generated
    for all raster cells (including NA cells). It is usually reasonable to make predictions
    for a more specific extent, such as the land area of Spain. We can use mask to
    remove the unnecessary predictions:


    ```

    > z = mask(z, dem_spain)

    ```


    Now let''s plot the predicted value raster, and the station locations on top of
    it, with the following pair of expressions:


    ```

    > plot(z)

    > plot(dat, add = TRUE)

    ```'
