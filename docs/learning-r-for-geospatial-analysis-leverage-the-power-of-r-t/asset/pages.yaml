- pgno: 214
  md: '# Modifying Rasters and Analyzing Raster Time Series


    For example, using the slope and aspect layers that we previously calculated,
    the following expression creates a hillshade layer according to the sun''s elevation
    of 20 degrees and the sun''s direction of 235 degrees:


    ```

    > hill = hillshade(slope, aspect, 20, 235)

    ```


    Now, with the following expression, we will plot the resulting hill raster using
    grayscale (as indicated by the `par.settings` argument `GrTheme`):


    ```

    > levelplot(hill, par.settings = GrTheme, margin = FALSE)

    ```


    The following screenshot shows the graphical output:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_214_0.png)'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'This image clearly shows the relief of Mount Carmel. Since the light source
    is located in the South-west (sun direction: 235°) and at quite a low angle above
    the horizon (sun elevation: 20°), the north-eastern slopes of the mountain are
    in shade while the western slopes are lighted.


    # # Aggregating spatio-temporal raster data


    Spatio-temporal data, such as MODIS images, time series, or meteorological records
    from several stations (see *Chapter 3, Working with Tables*) pose a challenge
    for analysis and visualization due to their three-dimensional nature. One approach
    to simplify such data is to perform aggregation in spatial and/or temporal dimensions
    (another approach to simplify spatio-temporal data is, for example, cluster analysis).


    In this section, we will experiment with two approaches to aggregate the data
    held in the multiband raster `r` in order to get additional perspectives on the
    spatio-temporal behavior of NDVI within the geographic area this raster covers.


    > > More specialized classes and methods (including aggregation) for various types
    of spatio-temporal data are defined in the `spacetime` package. An overview of
    this package can be found in the introductory paper "*spacetime: Spatio-Temporal
    Data in R*" by its creator Pebesma E. 2012.


    # # The time dimension


    In our first example, we will aggregate `r` along the temporal dimension (that
    is, the layers). In fact, the previous example where we mapped the minimum and
    maximum values for each pixel in `r` using overlay with the range function (see
    *Chapter 4, Working with Rasters*, for more information) is also an example of
    aggregation. However, instead of aggregating all layers, what if you want to learn
    the properties of different time series portions? In such cases, you have to perform
    several overlay operations, and then combine the results into a multiband raster.
    That is exactly what we are going to do next.


    Let''s say we are interested in examining the seasonal NDVI averages across the
    studied area. In such cases, we need to perform an overlay of all layers for each
    season using the mean function, and then combine the results into a four-band
    raster (where each layer corresponds to one of the four seasons). Conceptually,
    the simplest way of doing this is with a `for` loop that goes through the four
    seasons, selecting the appropriate layers of `r` each time, applying `overlay`
    on those layers, and keeping the result to form a final multiband raster in the
    end.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'As a preliminary step to construct the loop, we will define a character vector
    with season names (seasons) and an empty RasterStack object (season_means). The
    seasons vector will define loop iterations, while season_means will be used to
    hold the results:


    ```

    > seasons = c("winter", "spring", "summer", "fall")

    > season_means = stack()

    ```


    Now, we are ready to execute the for loop:


    ```

    > for(i in seasons) {

    + season_means = stack(season_means,

    + overlay(r[[which(dates$season == i)]],

    + fun = function(x) mean(x, na.rm = TRUE)))

    + }

    ```


    The loop code section is executed four times (since the number of elements in
    seasons is four), each time assigning the next season name into i. The code adds
    the mean of the relevant layers in r (selected using the dates$season vector that
    we previously created; refer to Chapter 3, Working with Tables) to season_means.
    Therefore, in the first loop iteration, the mean of the "winter" layers in r is
    added to the empty season_means; in the second iteration, the mean of "spring"
    is added to season_means (which already has one layer), and so on until all four
    seasons are covered.


    Now that the result season_means is ready, we can add season names to the respective
    layers for convenience:


    ```

    > names(season_means) = seasons

    ```


    We will view the result using the levelplot function:


    ```

    > levelplot(season_means, par.settings=RdBuTheme, contour=TRUE)

    ```'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'The following screenshot shows the graphical output:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_217_0.png)


    The preceding screenshot shows average NDVI for each season. We can see that NDVI
    is generally high during winter and spring and low during summer and fall. The
    image also shows that certain areas (such as the north-west corner of the image)
    have much higher NDVI in the wet season than in the dry one, while other areas
    (such as the three patches in the center of the image) maintain relatively high
    NDVI values in the summer months as well. The former are, in fact, areas where
    agricultural crops and natural herbaceous vegetation proliferate due to the relatively
    more abundant rainfall in the wet season, while the latter are planted evergreen
    pine forests where vegetation activity is maintained even in the dry season.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'Another way of aggregating raster layers, bypassing the necessity to construct
    a loop, is with the `stackApply` function. Similar to the way in which `tapply`
    can be used to apply a function on different portions of a vector (as we discussed
    in *Chapter 3, Working with Tables*), the function `stackApply` has been defined
    to apply a function on different portions of layers in a multiband raster. Analogous
    to `tapply`, the main three parameters of `stackApply` are as follows:


    +   - The input multiband raster (x)

    +   - A vector of indices defining the layers grouping (indices)

    +   - The function to be applied on each group (fun)


    Unlike `tapply`, the indices vector must be composed of consecutive integers,
    starting with 1. An additional parameter of `stackApply` is `na.rm`, which controls
    whether NA values are removed from calculations.


    For example, we can calculate the monthly NDVI means as follows:


    ```

    > month_means = stackApply(r,

    + indices = dates$month,

    + fun = mean,

    + na.rm = TRUE)

    ```


    As in the previous example, we will name the layers of the result `month_means`:


    ```

    > names(month_means) = month.abb

    ```


    > The character vector `month.abb` is a predefined one in R; it holds the three-letter
    abbreviated month names: "Jan", "Feb", "Mar", and so on.


    We can visualize the result with `levelplot`:


    ```

    > levelplot(month_means, par.settings = RdBuTheme, contour = TRUE)

    ```'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'The following screenshot shows the graphical output:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_219_0.png)


    The preceding screenshot shows NDVI dynamics with greater detail on a monthly
    scale rather than a seasonal scale. We can see that NDVI starts to increase around
    October-November and declines around February-March. During April-September (the
    dry season), NDVI is just about constant.


    Using the monthly averages, we can derive other informative products. For example,
    with the following overlay function call, we can create a raster that shows the
    month in which the lowest NDVI value is observed at each location:


    ```

    > min_month = overlay(month_means, fun = which.min)

    ```


    To save space, we will not plot the result here.'
  merge: -1
  img_proc: true
