- pgno: 147
  md: '# 5


    # Working with Points, Lines, and Polygons


    In this chapter, we will cover the basic usage of the second major type of spatial
    data—vector layers (points, lines, and polygons). In GIS terminology, these data
    are sometimes referred to as vectors, but we will use the term *vector layers*
    to distinguish them from vectors in R (see Chapter 2, *Working with Vectors and
    Time Series*). We will review the architecture of the vector layer classes defined
    in the sp package. Examples of the most common operations involving vector layers
    will then be presented using the sp, rgdal, and rgeos packages.


    In this chapter, we''ll cover the following topics:


    +   - Classes for spatial vector layers (points, lines, and polygons) in the sp
    package

    +   - Creating point layers by geocoding

    +   - Reading and writing vector layer files

    +   - Exploring the properties of vector layers

    +   - Accessing and modifying attribute tables

    +   - Reprojecting vector layers

    +   - Calculating derived geometrical properties (for example, polygon area)

    +   - Querying relations (for example, intersection) between a pair of layers

    +   - Creating new layers based on a single layer or a pair of layers

    +   - Joining data to an attribute table based on the location or common columns'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Data structures for vector layers in R


    Spatial vector layers have two components: the geometry and the attribute table.
    The geometry component holds the spatial coordinates and information regarding
    their arrangement in separate features, while the attribute table holds additional
    information regarding each feature. For example, in a point layer of capital cities,
    the record for London may be composed of a geometric component (a point coordinate,
    such as 51.5072°N, 0.1275°W) and a row in an attribute table holding additional
    data regarding each city (for example, population size, built area, and so on).


    The geometry part in a vector layer is obligatory and there are three types of
    geometries: points, lines, and polygons. The attribute table is optional. Classes
    for the six spatial vector layers types, constituting all possible combinations
    of these two properties, have been defined in the sp package. They are summarized
    in the following table:


    | Geometry type | Attribute table | Class |

    |---|---|---|

    | Points | No | SpatialPoints |

    |  | Yes | SpatialPointsDataFrame |

    | Lines | No | SpatialLines |

    |  | Yes | SpatialLinesDataFrame |

    | Polygons | No | SpatialPolygons |

    |  | Yes | SpatialPolygonsDataFrame |


    Together with the three raster classes from the raster package (presented in the
    previous chapter), these constitute a commonly used set of classes suitable for
    a wide range of spatial analysis applications in R.


    > Additional classes for spatial vector layers (and rasters) do exist in R. They
    are often associated with packages intended for specialized data analysis tasks.
    Conveniently, however, there are usually established methods of converting objects
    to and from such classes, with respect to the highly popular classes in the sp
    and raster packages (which we''ve used throughout this book). For example, the
    ppp class (the spatstat package) is used to represent a point pattern (event locations
    and the window where the pattern has been observed) to employ statistical analysis
    tools for such patterns. A SpatialPoints object can be converted to a ppp object
    and vice versa using the maptools package.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'In this section, we will see an example of how to create a vector layer for
    each of the three types of geometries – points, lines, and polygons. In the next
    section, methods to examine spatial vector layers will be presented, while in
    the last three sections of this chapter, we will see how some more advanced operations
    on vector layers are performed. Additional information regarding the sp package
    and its spatial vector classes can be found in the book *Applied Spatial Data
    Analysis with R, Springer*, whose second edition was published in 2013, by Roger
    Bivand, Edzer Pebesma, and Virgilio Gómez-Rubio.


    # Points


    Points are the simplest type of spatial objects since the geometrical component
    of a point is just a single (x,y) coordinate. A set of (x,y) coordinates, along
    with CRS information, constitutes a spatial point layer, which can be represented
    in R with a `SpatialPoints` object. If we also have an attribute table where each
    row corresponds to a single point, the layer can be represented with a `SpatialPointsDataFrame`
    object.


    In our first example, we are going to create a `SpatialPointsDataFrame` object
    by geocoding, the procedure to convert addresses to geographic coordinates. The
    intermediate steps we will go through are as follows:


    +   1. Creating a vector of addresses we want to geocode.

    +   2. Geocoding the addresses to get a `data.frame` object of geographic coordinates
    for each address.

    +   3. Adding location names as an additional column.

    +   4. Converting the `data.frame` object to a `SpatialPointsDataFrame` object.

    +   5. Adding CRS information.


    In the example, we will geocode the addresses of three airports in New Mexico:


    +   - Albuquerque International Airport

    +   - Double Eagle II Airport

    +   - Santa Fe Municipal Airport


    For the geocoding step (step 2), we are going to use the Google Maps API, accessible
    from R through the ggmap package. Additional functionality of the ggmap package
    for visualization of spatial data will be presented in *Chapter 9, Advanced Visualization
    of Spatial Data*. For an overview of package capabilities, refer to the introductory
    paper on ggmap (*ggmap: Spatial Visualization with ggplot2*) by Kahle, D. and
    Wickham, H. 2013.'
  merge: -1
  img_proc: true
- pgno: 150
  md: "# Working with Points, Lines, and Polygons\n\nOur first step is to create a\
    \ character vector with the airports addresses. The addresses are ordered in accordance\
    \ with the airport names listed earlier:\n\n```\n```r\n> addresses = c(\n+ \"\
    2200 Sunport Blvd, Albuquerque, NM 87106, USA\",\n+ \"7401 Paseo Del Volcan Northwest\
    \ Albuquerque, NM 87121, USA\",\n+ \"121 Aviation Dr, Santa Fe, NM 87507, USA\"\
    )\n```\n```\n\n![](img/ebfd6294770b225fdeceda9a7b8b560e_150_0.png)\n\n> Note that\
    \ the Google Maps API (which we will use for geocoding) can also search for location\
    \ names (such as the White House) or partial addresses, but the result will be\
    \ less determinate (two different places can be go by the same name, but not the\
    \ same address). The exact addresses are used here to ensure that the reader will\
    \ obtain the same results as in the book's text.\n\nWe are ready for the second\
    \ step and will now load the ggmap package and geocode the addresses using the\
    \ geocode function. This function accepts a vector of addresses (such as addresses\
    \ that we just created) and returns a data.frame object of the matched geographic\
    \ coordinates:\n\n```\n```r\n> library(ggmap)\n> airports = geocode(addresses)\n\
    > airports\n       lon      lat\n1 -106.6168 35.04918\n2 -106.7947 35.15559\n\
    3 -106.0731 35.62866\n```\n```\n\n![](img/ebfd6294770b225fdeceda9a7b8b560e_150_1.png)\n\
    \n> The geocode function accesses the Google Maps API. Therefore, an Internet\
    \ connection is required. Using the Google Maps API also implies agreement with\
    \ the Google Maps API Terms of Service (https://developers.google.com/maps/terms)\
    \ and is limited to 2,500 queries in a 24-hour time period (using the free service\
    \ option). A promising alternative can be found in the geocodeHERE package providing\
    \ access to the HERE Geocoding API (https://developer.here.com/geocoder) that\
    \ has a higher threshold of 10,000 queries per day.\n\nWe now have a data.frame\
    \ object named `airports` that holds the longitudes (lon) and latitudes (lat)\
    \ of the three airports."
  merge: -1
  img_proc: true
- pgno: 151
  md: "In our third step, we will add the airport names in an additional column called\
    \ `name` in `airports` as follows:\n\n```\n```r\n> airports$name = c(\"Albuquerque\
    \ International\",\n+ \"Double Eagle II\",\n+ \"Santa Fe Municipal\")\n> airports\n\
    \        lon        lat                     name\n1 -106.6168 35.04918 Albuquerque\
    \ International\n2 -106.7947 35.15559             Double Eagle II\n3 -106.0731\
    \ 35.62866             Santa Fe Municipal\n```\n```\n\nThe resulting `data.frame`\
    \ object has everything we need to create a `SpatialPointsDataFrame` object, where\
    \ the geometry components will be the airports' coordinates, and the attribute\
    \ table will have a single column that holds the airport names. This is our fourth\
    \ step. It is performed using the `coordinates` function of the `sp` package by\
    \ specifying the columns that hold the coordinates with a formula object of the\
    \ structure `~x_coord+y_coord`. In our case, the x coordinate is the longitude\
    \ (`lon`) and the y coordinate is the latitude (`lat`), therefore the formula\
    \ takes the following form:\n\n```\n```r\n> library(sp)\n> coordinates(airports)\
    \ = ~ lon + lat\n```\n```\n\nThe last expression converts `airports` from a `data.frame`\
    \ object to a `SpatialPointsDataFrame` object. We can confirm the conversion took\
    \ place using the `class` function as follows:\n\n```\n```r\n> class(airports)\n\
    [1] \"SpatialPointsDataFrame\"\nattr(,\"package\")\n[1] \"sp\"\n```\n```\n\nUsing\
    \ the print method on the object shows that it holds exactly the same information\
    \ as before; just that the lon and lat columns are now identified as spatial coordinates,\
    \ as shown in the following output:\n\n```\n```r\n> airports\n             coordinates\
    \                    name\n1 (-106.6168, 35.04918) Albuquerque International\n\
    2 (-106.7947, 35.15559)             Double Eagle II\n3 (-106.0731, 35.62866) \
    \            Santa Fe Municipal\n```\n```\n\nOur last step is to specify the CRS\
    \ of airports, which is a geographic CRS:\n\n```\n```r\n> proj4string(airports)\
    \ = CRS(\"+proj=longlat +datum=WGS84\")\n```\n```\n\nThe airports vector layer\
    \ is now complete."
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Writing of Spatial*DataFrame objects (that is, the SpatialPointsDataFrame,
    SpatialLinesDataFrame, and SpatialPolygonsDataFrame objects) can be done with
    the writeOGR function from the rgdal package. In the following example, as well
    as in most other examples in this book, we will use the popular ESRI Shapefile
    format for the input and output of vector layers.


    We can export our SpatialPointsDataFrame object airports to a Shapefile on the
    disk as follows:


    ```

    > library(rgdal)

    > writeOGR(airports, "C:\\Data", "airports", "ESRI Shapefile")

    ```


    The four arguments that were supplied to the first four parameters of the writeOGR
    function are as follows:


    +   - obj: The name of the object to be written (for example, airports)

    +   - dsn: The path of the directory where the file(s) will be written (for example,
    "C:\\Data")

    +   - layer: The layer name (for example, "airports")

    +   - driver: The driver name (for example, "ESRI Shapefile")


    > Since Shapefile datasets are composed of several separate files (at least three:
    *.shp, *.shx, and *.dbf), when reading and writing with the ESRI Shapefile driver,
    we specify the directory (dsn) and filename without the extension (layer). In
    the previous example, with dsn="C:\\Data" and layer="airports", four files were
    written to the C:\Data directory: airports.dbf, airports.prj, airports.shp, and
    airports.shx. The meaning of the dsn and layer parameters can be different with
    other drivers (see the next section and ?writeOGR).


    To read the file we just wrote back into a SpatialPointsDataFrame object in R,
    we can use the readOGR function (also available in the rgdal package). When reading
    vector layers, we need to provide only the dsn and layer arguments (the path and
    layer name, respectively). In addition, we can specify that we do not want character
    values in the attribute table to be converted to factors by specifying stringsAsFactors=FALSE
    (see Chapter 3, Working with Tables):


    ```

    > airports = readOGR("C:\\Data",

    + "airports",

    + stringsAsFactors = FALSE)

    ```'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'Obviously, all the airports.* files that constitute the Shapefile need to be
    found in the same directory (in this case, in the C:\Data directory) for the layer
    to be properly read.


    # Lines


    Line and polygon layers are more complex than point layers in two principal aspects.
    First, individual lines or polygons are defined with a set of points, rather than
    a single one. Specifically, a line is a set of points connected to each other
    from the first point to the last one. A polygon is defined similarly, just that
    the last point is equal to the first. The number of points in each line or polygon
    is not fixed, but dependable on the shape complexity (a more complex shape will
    be defined with more points). Secondly, a single line or polygon feature (corresponding
    to a single entry in an attribute table) can be composed of more than one individual
    line or more than one individual polygon. For example, in a layer of countries''
    boundaries, the USA feature will be composed of more than one polygon since the
    contiguous United States, Alaska, and each of the Hawaii Islands are separate
    from one another.


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_153_0.png)


    > An additional complication, specific to polygonal layers, is the existence of
    holes. A single feature can be composed of an external boundary polygon and hole
    polygons. For example, in a layer of North America''s land area, hole polygons
    may represent the Great Lakes. Hole polygons can once again have internal polygons
    (such as islands inside the Great Lakes) and so on.


    Due to their complexity, it is much less common to manually define line and polygon
    layers from raw coordinates. Instead, they are usually either imported from an
    external source (for example, reading a Shapefile) or created from another object
    (for example, contour lines created based on a DEM raster).


    As an example for SpatialLinesDataFrame, we will read a GPS Exchange Format (GPX)
    file with a track record from a GPS device. With GPX files, unlike with Shapefiles,
    the dsn argument is the file itself, while the layer argument points to the data
    component we would like to read (such as "tracks" or "track_points"; see ?readOGR).
    The particular file GPS_log.gpx contains the GPS log, from driving around the
    Lahav and Dvira forests with the GPS device in recording mode. Let''s read the
    file as follows:


    ```

    > track = readOGR("C:\\Data\\GPS_log.gpx","tracks")

    ```'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Using the `class` function, we can demonstrate that `track` is a `SpatialLinesDataFrame`
    object:


    ```

    > class(track)

    [1] "SpatialLinesDataFrame"

    attr(","package")

    [1] "sp"

    ```


    # Polygons


    As an example of polygonal data, we are going to read another external file; this
    time it''s a Shapefile named `USA_2_GADM_fips`. The file is composed of polygons
    corresponding to the second level administrative division (counties) of the USA,
    with several attributes such as county names and **Federal Information Processing
    Standards (FIPS)** codes. We will assign the resulting `SpatialPolygonsDataFrame`
    to an object named `county` to use in the subsequent examples in this chapter:


    ```

    > county = readOGR("C:\\Data", "USA_2_GADM_fips",

    + stringsAsFactors = FALSE)

    ```


    To summarize, so far we have witnessed two ways to create spatial vector layers
    in R: from a set of (x,y) coordinates (relevant to points) and from a file (relevant
    to points, lines, and polygons). A third way — deriving vector layers from raster
    data — will be presented in *Chapter 7, Combining Vector and Raster Datasets.*


    # Exploring vector layer properties and subsetting


    This section is going to be devoted to the examination of spatial vector layer
    properties, and to subsetting them based on their attribute tables. Some of the
    presented procedures will be analogous to those presented for rasters in the previous
    chapter (for example, plotting and querying CRS information), while others are
    generally relevant only to vector layers (for example, calculating areas and creating
    subsets according to the attribute table). As will quickly become apparent, many
    operations involving attribute tables of vector layers are conveniently analogous
    to operations on `data.frame` objects.'
  merge: -1
  img_proc: true
- pgno: 155
  md: "# Examining vector layer properties\n\nThe summary function produces a useful\
    \ textual summary of the properties of a vector layer, including its class, bounding\
    \ box coordinates, CRS, and attribute table column types. For example, using summary\
    \ on airports produces the following textual output:\n\n```\n```text\n> summary(airports)\n\
    Object of class SpatialPointsDataFrame\nCoordinates:\n                min    \
    \     max\nlon -106.79467 -106.07308\nlat    35.04918    35.62866\nIs projected:\
    \ FALSE\nproj4string : [+proj=longlat +datum=WGS84]\nNumber of points: 3\nData\
    \ attributes:\n      Length      Class      Mode\n          3 character character\n\
    ```\n```\n\nAll of the properties listed in this output can also be accessed,\
    \ and in some cases modified, using functions. For example, similar to what we\
    \ already saw for rasters in the previous chapter, the proj4string function returns\
    \ the CRS definition of a vector layer in the PROJ.4 format. Using proj4string\
    \ on airports returns the definition of the WGS84 CRS:\n\n```\n```text\n> proj4string(airports)\n\
    [1] \"+proj=longlat +datum=WGS84\"\n```\n```\n\nReferring to the geometry part,\
    \ the length function returns the number of features the layer consists of. For\
    \ example, airports contains three points (the three airports), as the following\
    \ output shows:\n\n```\n```text\n> length(airports)\n[1] 3\n```\n```\n\nA spatial\
    \ layer also always has row names that internally serve as ID variables to match\
    \ the geometries with attribute table entries. The number of row names is thus\
    \ equal to the number of features:\n\n```\n```text\n> row.names(airports)\n[1]\
    \ \"1\" \"2\" \"3\"\n```\n```"
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Working with Points, Lines, and Polygons


    The dimensions function returns the number of spatial dimensions:


    ```

    ```r

    > dimensions(airports)

    [1] 2

    ```

    ```


    > In this book, we only deal with two-dimensional vector layers (geometries on
    a plane). Three-dimensional layers can also be useful to represent certain types
    of data, such as points with (x,y) coordinates and (z) elevation.


    # Accessing the attribute table of vector layers


    The attribute table of a vector layer is, in fact, a `data.frame` object and some
    of the functions that work with `data.frame` objects have been defined to consistently
    work directly on vector layers as well. For example, the nrow, ncol, and dim functions
    applied to a vector layer refer to its attribute table to return its dimensions:


    ```

    ```r

    > nrow(county)

    [1] 3145

    > ncol(county)

    [1] 4

    > dim(county)

    [1] 3145    4

    ```

    ```


    We see that the attribute table of county has 3,145 rows (thus, the layer has
    3,145 features) and four columns. The columns contain the following information:


    +   - `NAME_1`: The first-level name (for example, the state name)

    +   - `NAME_2`: The second-level name (for example, the county name)

    +   - `TYPE_2`: The feature type (for example "County" or "Water body")

    +   - `FIPS`: The FIPS code


    Individual columns of an attribute table, or subsets of these, can be accessed
    with the `$` and `[` operators. For example, the second-level names (held in the
    `NAME_2` column) of the first 10 features in `county` can be obtained as follows:


    ```

    ```r

    > county$NAME_2 [1:10]

    [1] "Litchfield" "Hartford"    "Tolland"    "Windham"

    [5] "Siskiyou"  "Del Norte"   "Modoc"       "New London"

    [9] "Fairfield" "Middlesex"

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 157
  md: "As another example, we can check the types of features the county layer contains\
    \ by listing the unique values in the TYPE_2 column:\n\n```\n> unique(county$TYPE_2)\n\
    \  [1] \"County\"          \"District\"          \"Borough\"\n  [4] \"Census Area\"\
    \     \"Municipality\"      \"City And Borough\"\n  [7] \"City And County\" \"\
    Water body\"        \"Parish\"\n [10] \"Independent City\"\n```\n\nThe whole attribute\
    \ table of a spatial vector layer can be accessed directly using the @ operator.\
    \ The @ operator is used to extract a slot, by its name, from an object, using\
    \ the notation object_name@slot_name.\n\n![](img/ebfd6294770b225fdeceda9a7b8b560e_157_0.png)\n\
    \n> More specifically, the @ operator is applicable to objects of the so-called\
    \ S4 classes, which all raster and vector layers we deal with are, as opposed\
    \ to S3 classes whose components are accessed with a different method (using the\
    \ $ operator). The distinction between S3 and S4 concerns the internal class structure\
    \ and is beyond the scope of this book. For more information, refer to Advanced\
    \ R, Wickham, H., CRC Press, 2014 (http://adv-r.had.co.nz/OO-essentials.html).\n\
    \nThe attribute table slot of spatial vector classes defined in the sp package\
    \ is called data. Therefore, adding @data after a vector layer name will yield\
    \ its attribute table (if it has one).\n\nFor example, the following expression\
    \ returns the attribute table of airports:\n\n```\n> airports@data\n         \
    \       name\n1 Albuquerque International\n2          Double Eagle II\n3     \
    \  Santa Fe Municipal\n```\n\nAs another example, we can print the first few rows\
    \ in the attribute table of county using the head function applied to county@data:\n\
    \n```\n> head(county@data)\n        NAME_1      NAME_2 TYPE_2  FIPS\n0 Connecticut\
    \ Litchfield County 09005\n1 Connecticut   Hartford County 09003\n2 Connecticut\
    \    Tolland County 09013\n3 Connecticut   Windham County 09015\n4 California\
    \   Siskiyou County 06093\n5 California  Del Norte County 06015\n```"
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Working with Points, Lines, and Polygons


    As we shall see later in this chapter, the attribute table of a vector layer can
    also be modified using assignment, similar to a separate data.frame object. New
    attribute table columns can be created and populated using the `$` operator, or
    the whole attribute table can be modified (for example, certain columns can be
    deleted or joined) and reassigned to the data slot.


    All other components of spatial vector (and raster, for that matter) objects are
    also contained in slots and thus, are accessible with the `@` operator. Using
    the `str` function, we can obtain a tree describing the object''s structure. Let''s
    take a look at the following example:


    ```

    ```r

    > str(airports)

    Formal class ''SpatialPointsDataFrame'' [package "sp"] with 5 slots

    ..@ data       :''data.frame'': 3 obs. of  1 variable:

    .. ..$ name: chr [1:3] "Albuquerque International" "Double Eagle$

    ..@ coords.nrs : int [1:2] 1 2

    ..@ coords     : num [1:3, 1:2] -106.6 -106.8 -106.1 35 35.2 ...

    .. ..- attr(*, "dimnames")=List of 2

    .. .. ..$ : NULL

    .. .. ..$ : chr [1:2] "lon" "lat"

    ..@ bbox       : num [1:2, 1:2] -106.8 35 -106.1 35.6

    .. ..- attr(*, "dimnames")=List of 2

    .. .. ..$ : chr [1:2] "lon" "lat"

    .. .. ..$ : chr [1:2] "min" "max"

    ..@ proj4string:Formal class ''CRS'' [package "sp"] with 1 slot

    .. .. ..@ projargs: chr "+proj=longlat +datum=WGS84"

    ```

    ```


    > Using such a tree, we can find our way to all the data components of an object.
    Then, why is the use of specialized functions (such as `proj4string`), rather
    than direct access to the relevant property (such as `airports@proj4string@projargs`),
    usually advocated in R? One reason is that working through functions makes our
    code more robust in the face of changes in class definition. In other words, if
    the internal architecture of a certain class changes in a future version of a
    given package (so that, for instance, the slot x is now named y), the user may
    not even notice since the code for all the relevant functions operating on the
    class will also be changed accordingly while access with `@x` will no longer work.
    Accessing the attribute table of a vector layer (with `@data`) is going to be
    the only direct access we have in this book. The exception is necessary since
    certain operations on an attribute table are unfeasible otherwise.


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_158_0.png)'
  merge: -1
  img_proc: true
- pgno: 159
  md: "The attribute table of a vector layer can also be removed altogether, by converting\
    \ a `Spatial*DataFrame` object into a `Spatial*` object. Such a conversion can\
    \ be done with the `as` function, specifying the object name and the class we\
    \ want to convert it to. For example, we can convert `airports`, a `SpatialPointsDataFrame`\
    \ object, to a `SpatialPoints` object as follows:\n\n```\nairports_sp = as(airports,\
    \ \"SpatialPoints\")\n```\n\nSince a `SpatialPoints` object does not have a data\
    \ slot, an error occurs when trying to access it:\n\n```\nairports_sp@data\nError:\
    \ no slot of name \"data\" for this object of class \"SpatialPoints\"\n```\n\n\
    We can also use the `as` function to perform the reverse conversion from a `SpatialPoints`\
    \ object to a `SpatialPointsDataFrame` object. Naturally, the attribute table\
    \ of the resulting object is going to be empty (since `SpatialPoints` objects\
    \ do not have one):\n\n```\nas(airports_sp, \"SpatialPointsDataFrame\")@data\n\
    data frame with 0 columns and 0 rows\n```\n\n# Subsetting vector layers\n\nWe\
    \ can subset a vector layer according to its attribute table using the same notation\
    \ as in subsetting `data.frame` objects. Selecting which features to retain can\
    \ be done by supplying a numeric or logical vector within the `[` operator.\n\n\
    For example, to get a subset of only those county features that belong to the\
    \ contiguous U.S., we need to exclude those features corresponding to the states\
    \ of Alaska and Hawaii. This can be done by creating a logical vector (applying\
    \ a condition to the `county$NAME_1` column holding state names) and supplying\
    \ that vector as the rows index of `county` with the `[` operator, as follows:\n\
    \n```\ncounty = county[\n+ county$NAME_1 != \"Alaska\" &\n+ county$NAME_1 != \"\
    Hawaii\", ]\n```\n\n> Keep in mind the following alternative that utilizes the\
    \ `%in%` operator:\n> \n> ```r\n> county = county[\n> + !(county$NAME_1 %in%\n\
    > + c(\"Alaska\", \"Hawaii\")), ]\n> ```"
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Similarly, we can retain only the land area by excluding water body polygons:


    ```

    > county = county[county$TYPE_2 != "Water body", ]

    ```


    Let''s examine the resulting layer using the plot function. The expression plot(county)
    produces the graphical output as shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_160_0.png)


    As we can see, the plot function, by default, draws polygon borders using black
    lines. In subsequent examples, we will experiment a little bit with several parameters
    of this function to modify the appearance of the plot.'
  merge: -1
