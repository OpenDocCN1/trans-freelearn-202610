- pgno: 74
  md: '# The main graphical systems in R


    There are three main graphics systems in R: base graphics (which we just used
    to create the previous plot), lattice, and ggplot2. For example, the following
    code produces the previous plot as well as two analogous plots using lattice and
    ggplot2. The code includes some functions that will be made clear later, and requires
    installation of additional packages (which we will cover in the next chapter).


    ```

    > dat = data.frame(time = time, tmax = tmax)

    # Base graphics

    > plot(tmax ~ time, dat, type = "l")

    # lattice

    > library(lattice)

    > xyplot(tmax ~ time, data = dat, type = "l")

    # ggplot2

    > library(ggplot2)

    > ggplot(dat, aes(x = time, y = tmax)) +

    + geom_line()

    ```


    The graphs this code produces are sequentially shown in the following screenshot,
    from left to right, with the name of the respective graphics system indicated
    at the top of each panel:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_74_0.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Many types of plots (such as the time series plot we just created) can be produced
    using any of the three systems. Therefore, choosing one in many cases is a matter
    of taste. However, some non-overlapping features do exist among the graphics systems.
    For example, faceting (which produces a series of plots for different portions
    of the data side by side) cannot be achieved using base graphics, while 3D plots
    cannot be produced using ggplot2. As seen in the preceding screenshot, there are
    also some small differences in the default styling of the plots. Finally, as we
    can see in the preceding code section, the ggplot2 system has quite a different
    syntax compared to base graphics and lattice.


    In the upcoming chapters, we are going to use base graphics (and sometimes lattice)
    to quickly visualize the products we get at various steps of spatial data analysis.
    In Chapter 9, Advanced Visualization of Spatial Data, we are going to concentrate
    on customizing graphical output in R, mostly using ggplot2.


    # Summary


    In this chapter, we covered the basic subjects that we are going to use in almost
    every operation from now on. First, you learned the fundamental methods of working
    with vectors, including the creation of three common types of vectors, subsetting
    them, and dealing with missing values in them. You also saw how dates are represented
    in R, and how such a representation can be useful when working with time series.
    In addition, we expanded on the function call structure in R, discussed how to
    define custom functions, and saw how a graphical output can be produced and saved.


    In the next chapter, we are going to discuss working with tables in R. We will
    see that the common tabular data class in R (data.frame) is a direct extension
    of the vector class. Thus, many of the operations to work with tables will be
    intuitive once we know how to work with vectors. Later, we will move on to working
    with spatial data classes, where the principles of working with vectors and tables
    are also directly applicable.'
