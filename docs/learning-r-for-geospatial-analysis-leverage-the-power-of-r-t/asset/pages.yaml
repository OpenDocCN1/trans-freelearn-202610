- pgno: 161
  md: '# Geometrical calculations on vector layers


    In previous sections, we covered the querying of the immediately available properties
    of vector layers (for example, the CRS definition or attribute table), and the
    modification of vector layers involving only the attribute table component (for
    example, removing the attribute table or subsetting the layer according to it).
    In the next two sections, you will learn to examine and modify the geometrical
    component of vector layers. In this section, operations involving a single vector
    layer, such as reprojection and area calculation, will be covered. In the next
    section, we will deal with operations involving pairs of vector layers.


    # Reprojecting vector layers


    Reprojection is the conversion of all the coordinates of a spatial object from
    one CRS to another. Note the distinction when specifying a CRS (which we previously
    did with airports), where only the CRS definition associated with the layer is
    modified, leaving the coordinates unaltered. The reprojection of a vector layer
    is done with the spTransform function from the rgdal package. The function accepts
    two arguments: the layer to be reprojected and the target CRS.


    For example, the following expression transforms the county layer (currently defined
    in a geographical CRS) to the US National Atlas Equal Area projection:


    ```

    > newProj = CRS("+proj=laea +lat_0=45 +lon_0=-100

    + +x_0=0 +y_0=0 +a=6370997 +b=6370997 +units=m +no_defs")

    > county = spTransform(county, newProj)

    ```


    Note that the preceding operation consisted of two steps. The first expression
    created an object named newProj of the class CRS by applying the CRS function
    on a PROJ.4 character string corresponding to the US National Atlas Equal Area
    projection. Second, the county layer has been reprojected to the newProj CRS using
    the spTransform function.


    > The PROJ.4 strings can be obtained from other objects (see the previous chapter)
    or from databases such as http://www.spatialreference.org/. The PROJ.4 string
    used earlier, for example, was copied from http://spatialreference.org/ref/epsg/us-national-atlas-equal-area/proj4/.'
  merge: -1
  img_proc: true
