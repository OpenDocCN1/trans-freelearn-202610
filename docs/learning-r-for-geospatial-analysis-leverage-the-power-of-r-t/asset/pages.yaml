- pgno: 142
  md: '# Working with Rasters


    When applying logical operators on rasters, we get rasters with logical values
    (TRUE or FALSE). However, the same way as we have seen regarding logical vectors
    (Chapter 2, Working with Vectors and Time Series), when we apply an arithmetic
    operation on a logical raster, the logical values are converted to numeric values
    (1 or 0) before the operation is carried out. For example, if we would like to
    find out how many missing values the first layer of raster r contains, we can
    use the following expression:


    ```

    ```r

    > sum(is.na(r[[1]][])

    [1] 721

    ```

    ```


    Note that with is.na(r[[1]]), we first created a logical raster, where the values
    are TRUE in pixels with NA in r[[1]], or FALSE otherwise. Then, with [], we obtained
    the vector of values from this logical raster. Finally, with sum, we found out
    how many TRUE values the vector contains. The answer is 721 NA values in the first
    layer of r.


    Logical rasters can also be used to select a subset of the values of another overlapping
    raster and assign new values to the resulting subset. For example, if we wanted
    to fill the missing values in r[[1]], say with the mean of all non-missing values,
    we could do so as follows:


    ```

    ```r

    > temp = r[[1]]

    > temp[is.na(temp)] = mean(temp[], na.rm = TRUE)

    ```

    ```


    Note that we first assigned the first band of r to a new object named temp so
    that we will not alter the values of the original raster object. Then, we created
    a logical raster named is.na(temp) to subset the NA values in temp and assign
    the mean value of all the other cells to that subset. Plotting the new raster
    temp alongside the original one r[[1]] indeed shows that the missing values—appearing
    white in the left panel of the following screenshot (and transparent in the Google
    Earth visualization as seen in the previous screenshot)—were uniformly filled:


    ```

    ```r

    > levelplot(stack(r[[1]], temp),

    + par.settings = RdBuTheme, contour = FALSE)

    ```

    ```'
  merge: -1
  img_proc: true
