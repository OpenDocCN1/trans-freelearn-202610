- pgno: 302
  md: '# Advanced Visualization of Spatial Data


    It is important to understand that in order to produce a minimal plot, we need
    to specify only a dataset, a single layer, and mappings for the layers'' required
    parameters (such as x and y in `geom_line`). Other layer parameters (such as colour
    or size), scales, faceting, and themes are optional. For example, the following
    expression adds a colour setting and two scale definitions, but it produces exactly
    the same plot as shown in the preceding screenshot, since all of the components
    we added were already specified by default:


    ```

    ggplot(dat, aes(x = time, y = tmax)) +

    geom_line(colour = "black") +

    scale_x_date() +

    scale_y_continuous()

    ```


    The two scale settings used in the preceding expression (`scale_x_date()` and
    `scale_y_continuous()`) had no effect since a continuous variable (such as tmax)
    is by default plotted on a continuous scale, while a Date variable (such as time)
    is by default plotted on a dates scale. In addition, we have an aesthetic setting
    (`colour="black"`) that had no effect either. As opposed to an aesthetic mapping
    (which is always encompassed in the aes function), the aesthetic setting links
    the layer to a constant aesthetic value, irrespective of the data in a given column.
    In the preceding expression, we set the line color to black in the geom_line layer,
    with `colour="black"`. Again, since "black" is the default value for the line
    color in ggplot2, this setting does not affect the plot appearance.


    The plot we produced still needs a little polishing if we would like to include
    it in a publication. In general, certain plot adjustments are not related to the
    data (for example, changing the background color), while others are indirectly
    related to the data (for example, changing the color scale of a raster). First
    of all, we would like to have proper axis titles (for example, "Time" instead
    of "time" for the x axis), preferably without changing the data column names themselves.
    In many cases a journal may require a cleaner appearance, so we may also wish
    to remove the gray background and grid lines. The latter two properties can be
    modified using the scales and themes specifications, respectively.


    Through the `theme` functions, we can control the general appearance of the plots''
    nondata elements, such as plot title, axis labels style, tick marks length, background
    color, and so on. This can be done in two ways, which are not mutually exclusive
    but additive:


    +   - The so-called complete themes can be specified to control all of the elements
    at once, in a predefined way. The predefined themes in ggplot2 currently include
    `theme_grey`, `theme_bw`, `theme_linedraw`, `theme_light`, `theme_minimal`, and
    `theme_classic`. You are welcome to replace `theme_bw` with each of these in the
    following code section, to see what each of them looks like.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '+   - Modifying individual elements can be done using the `theme` function,
    specifying the element names and the required arguments. For example, adding `theme(panel.grid=element_blank())`
    eliminates grid lines. There are currently 50 theme elements (such as `panel.grid`),
    which can be modified through the `theme` function (see `?theme` for the complete
    list). Three important things to note about themes are:

    +     - The value of each theme element can be set using the appropriate function
    (`element_blank`, `element_line`, `element_rect`, or `element_text`). For example,
    to set `axis.title`, we will use `element_text`, but to modify `panel_grid`, we
    will use `element_line` (unless we want to eliminate it altogether, in which case
    we will use `element_blank`). Consult `?theme` to see which element function is
    appropriate in specific cases.

    +     - Within the `element` function, we can supply a list of characteristics
    we want to modify for that particular element. For example, `element_line(colour="red",linetype="dotted")`
    for `panel.grid` will make the grid lines red and dotted. As always, all unspecified
    properties remain at their default values.

    +     - Some element properties inherit from others. For example, with `panel.grid=element_blank()`,
    there is no point modifying the `panel.grid.minor` and `panel.grid.major` (minor
    and major grid lines, respectively) characteristics since the properties of both
    are overridden by `panel.grid`.


    Functions to modify the scales start with `scale`, followed by the aesthetic property
    and the scale type. For example, `scale_x_date` sets the x axis position aesthetic
    property to the date type. Arguments within a `scale` function control additional
    properties of the scale, other than scale type which is determined by the function''s
    name. For example, the `name` parameter determines the scale name that appears
    along the respective axis or legend. Each aesthetic we would like to set a scale
    for requires an individual scale function (for example, `scale_x_date()` and `scale_y_continuous()`).'
  merge: -1
  img_proc: true
- pgno: 304
  md: 'As an example, in the following code we modify several theme and scale properties
    of the time series plot:


    ```

    > ggplot(dat, aes(x = time, y = tmax)) +

    + geom_line() +

    + scale_x_date(name = "Time") +

    + scale_y_continuous(

    + name =

    + expression(paste("Maximum temperature (", degree, "C)") ) +

    + theme_bw() +

    + theme(panel.grid = element_blank())

    ```


    As you may have noticed, the y axis label is specified in a special way in the
    preceding code with expression(paste("Maximum temperature (", degree, "C)")).
    The reason for doing this is to introduce the degree (°) symbol in the y axis
    title (see the following screenshot). The expression function returns an object
    of class expression, which can be used to print mathematical symbols and annotations
    in R. It is combined with paste in order to include both regular characters and
    mathematical symbols. In this case, the text consists of the "Maximum temperature
    (" and "C)" parts, while the mathematical part is degree, which stands for the
    ° symbol. The complete list of possible annotations and their syntax is available
    on the ?plotmath help page.


    The following screenshot shows what the new version of our plot looks like:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_304_0.png)'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'We can see that the plot is now black and white (thanks to `theme_bw`) with
    no grid lines (thanks to `theme(panel.grid=element_blank())`) and it has appropriate
    axis labels (thanks to the `scale` specifications).


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_305_0.png)


    > At times, a touch of interactive fine-tuning is required to introduce nonstandard
    elements or formatting into the graphical output from R. For instance, we may
    wish to put an arrow mark (such as ↓) with annotation (such as *this was an especially
    cold day*) on the preceding plot. Although it is possible to accomplish almost
    everything through the `ggplot2` syntax (including the latter example), in some
    situations it may be advantageous to make final adjustments by hand using a graphical
    editor such as Inkscape (freely available from http://www.inkscape.org/) or Adobe
    Illustrator. For this purpose, it is best to export the plot with `ggsave` to
    a vector graphics file (such as PDF or SVG), and then work on it in a graphical
    editor.


    # Plotting nonspatial data


    Since our main focus is on plotting spatial data, in this section, we will go
    over just two examples of ordinary (nonspatial) plots. Most of the subsequent
    examples in this chapter will deal with producing spatial plots, or in other words,
    maps.


    We will begin with a line plot, but a more elaborate one than in the previous
    example. As promised in *Chapter 7, Combining Vector and Raster Datasets*, we
    are going to compare, visually, the NDVI trajectory in two forests (Lahav and
    Kramim) according to two data sources (the Landsat and MODIS satellites). To do
    this, we will display the four relevant time series in a single plot. We will
    mark the data for each forest with a different color in order to distinguish them.
    In addition, we will use different `geom` functions for the data from each of
    the two satellites – the data from MODIS (where we have 280 data points for each
    forest) is best displayed with `geom_line`, while the data from Landsat (where
    we have only three data points for each forest) will be displayed with `geom_point`.


    In terms of the `ggplot2` syntax, the data from our input table `forests_ndvi`
    will be divided into two parts:


    +   - `forests_ndvi[forests_ndvi$sat == "MODIS", ]`

    +   - `forests_ndvi[forests_ndvi$sat == "Landsat", ]`'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'The first subset of `forests_ndvi` will be passed as the `data` argument to
    `geom_line`, while the second will be passed as the `data` argument to `geom_point`.
    As for the aesthetic mapping (the assignment expressions within the `aes` function),
    x is going to be mapped to `date` and y to `ndvi`, in both layers (NDVI is plotted
    as the function of time). In addition, the `colour` (in `geom_line`) and `fill`
    (in `geom_point`) are mapped to `forest` since we want to display the time series
    for each forest with a different color. One instance of the aesthetic setting
    is used in the point layer (`shape=21`), defining the points shape as 21 (which
    corresponds to a filled circle; see ?points). In addition to these two layers,
    six ggplot components are supplied to specify the various scale settings (just
    their names, in this case) and theme settings (no grid lines and "top" for the
    legend position). Note that the scales for `fill` and `colour` are discrete (`scale_fill_discrete`
    and `scale_colour_discrete`), which is appropriate for categorical variables such
    as the forest name.


    > The assigned colors are generated automatically. There is also a way to explicitly
    specify the color each group will take, using a manual scale. We will not go into
    that here; interested readers can follow the examples on ?scale_colour_manual
    to see how individual colors of choice can be specified.


    The entire expression to produce the plot thus takes the following form:


    ```

    > ggplot() +

    + geom_line(

    + data = forests_ndvi[forests_ndvi$sat == "MODIS", ],

    + aes(x = date, y = ndvi, colour = forest)) +

    + geom_point(

    + data = forests_ndvi[forests_ndvi$sat == "Landsat", ],

    + aes(x = date, y = ndvi, fill = forest), shape = 21) +

    + scale_x_date("Time") +

    + scale_y_continuous("NDVI") +

    + scale_fill_discrete("Forest") +

    + scale_colour_discrete("Forest") +

    + theme_bw() +

    + theme(panel.grid = element_blank(),

    + legend.position = "top")

    ```'
  merge: -1
  img_proc: true
