- pgno: 289
  md: 'When we are interested in interannual differences only, the most reasonable
    course of action is to find out what is the characteristic annual temperature
    state, find out the deviation of each individual year''s state from the characteristic
    state, and then compare the deviation images rather than the original ones. Calculating
    deviations from a general trend is a very common practice to highlight patterns
    of interest in our data, and there are many ways to find both the general trend
    and the deviations of each observation from it. Here, we will employ the simplest
    possible approach—the characteristic temperature in each pixel will be defined
    as the 5-year average observed in that pixel, and the deviations will be equal
    to arithmetic differences of each observation from the average.


    Since we need to treat the minimum and maximum temperature data separately, we
    will first create two vectors identifying the relevant `spainT` layers for each
    case:


    ```

    ```r

    > mmnt_layers = which(spainT_tab$variable == "mmnt")

    > mmnt_layers

    [1] 1 2 3 4 5

    > mmxt_layers = which(spainT_tab$variable == "mmxt")

    > mmxt_layers

    [1]  6  7  8  9 10

    ```

    ```


    We will also create a new two-band RasterStack, named means, to hold the minimum
    and maximum mean temperature pattern in its first and second layers, respectively.
    The two layers will also be named accordingly ("mmnt" and "mmxt"):


    ```

    ```r

    > means = stack(mean(spainT[[mmnt_layers]]),

    + mean(spainT[[mmxt_layers]]))

    > names(means) = c("mmnt", "mmxt")

    ```

    ```


    Now that we have the means, all we need to do is subtract the appropriate mean
    from each set of layers in spainT (the mean of the minimum temperatures from layers
    1-5 and the mean of the maximum temperatures from layers 6-10). There are numerous
    ways to do this. For example, we can divide the spainT raster into two, subtract
    the respective mean from each substack, and then combine them once again. A more
    elegant way, extendable to any number of categories, however, is to create a new
    means raster with the same number of layers as spainT, by means of duplication,
    with the relevant means occupying its layers. In other words, we need a raster
    with means[[1]] duplicated five times (occupying layers 1-5) and means[[2]] duplicated
    five times (occupying layers 6-10). To do this, we can utilize the fact that raster
    layers can also be selected by their names. The following expression therefore
    takes the "mmnt" and "mmxt" layers and duplicates them in agreement with the spainT_tab$variable
    column:


    ```

    ```r

    > means = means[[spainT_tab$variable]]

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Spatial Interpolation of Point Data


    This gives us the desired result, a 10-band raster with temperature means for
    either the minimum or maximum temperature, according to spainT_tab (and thus matching
    spainT). The layer names reveal that indeed the first five layers correspond to
    the minimum temperature and the last five layers correspond to the maximum temperature:


    ```

    ```r

    > names(means)

    [1] "mmnt.1" "mmnt.2" "mmnt.3" "mmnt.4" "mmnt.5" "mmxt.1"

    [7] "mmxt.2" "mmxt.3" "mmxt.4" "mmxt.5"

    ```

    ```


    What is left to be done is just to subtract one 10-band raster from the other:


    ```

    ```r

    > spainT = spainT - means

    ```

    ```


    The data we now have in the new spainT raster is the temperature deviations from
    the five-year average pattern of either the minimum or maximum temperature. We
    can check and see that the deviations are within the range of -4 and +4 degrees
    Celsius around the respective 5-year mean of 2006-2010:


    ```

    ```r

    > range(spainT[], na.rm = TRUE)

    [1] -4.020094  3.200148

    ```

    ```


    Plotting these deviations will help us see more clearly where exactly the temperature
    was high or low, with respect to the average pattern, and what the magnitude of
    the departure was. This time, we will also indicate that contours should be drawn
    at 1°C intervals:


    ```

    ```r

    > levelplot(spainT,

    + par.settings = "BuRdTheme",

    + layout = c(5,2),

    + contour = TRUE,

    + at = c(-4:-1,1:4))

    ```

    ```


    The graphical output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_290_0.png)'
  merge: -1
  img_proc: true
- pgno: 291
  md: "This time, we can easily notice, for example, that the minimum temperatures\
    \ in 2010 were higher than average in southern Spain while the maximum temperatures\
    \ were lower than average in the north of the country.\n\nThis is the final product\
    \ we were looking for, according to the goals specified at the beginning of this\
    \ section. However, we are not done yet. In the next chapter, we will use spainT\
    \ as one of the sample datasets while discussing how to produce plots with the\
    \ ggplot2 package. Since ggplot2 is a general-purpose graphical package, the input\
    \ data must come as a data.frame object. Moreover, the data table should be tidy\
    \ (see the previous chapter) in order to conveniently exploit all of the possibilities\
    \ this package offers. What does that mean in the present case? It means that\
    \ we need to have a data.frame object with all the data currently held in spainT,\
    \ with each column corresponding to a variable and each row corresponding to an\
    \ observation. In this case, the variables are as follows:\n\n+   - x-coordinate\n\
    +   - y-coordinate\n+   - Variable\n+   - Year\n+   - Predicted temperature\n\n\
    Each row in such a data.frame object will correspond to one pixel of an individual\
    \ layer in spainT.\n\nLuckily, the as.data.frame function (that we encountered\
    \ in the previous chapter, when converting a matrix to a data.frame) also has\
    \ a method to convert rasters to the data.frame objects. By setting xy=TRUE, we\
    \ are specifying that we would like to have a table not only with the raster values\
    \ (from all of its layers) but also with the respective spatial coordinates:\n\
    \n```\n> spainT = as.data.frame(spainT, xy = TRUE)\n> head(spainT)\n         \
    \ x      y mmnt_2006 mmnt_2007 mmnt_2008 mmnt_2009\n1 -11957.925 4857128     \
    \   NA        NA        NA        NA\n2  -8357.925 4857128        NA        NA\
    \        NA        NA\n3  -4757.925 4857128        NA        NA        NA    \
    \    NA\n4  -1157.925 4857128        NA        NA        NA        NA\n5   2442.075\
    \ 4857128        NA        NA        NA        NA\n6   6042.075 4857128      \
    \  NA        NA        NA        NA\n  mmnt_2010 mmxt_2006 mmxt_2007 mmxt_2008\
    \ mmxt_2009 mmxt_2010\n1        NA        NA        NA        NA        NA   \
    \     NA\n```"
  merge: -1
  img_proc: true
- pgno: 292
  md: "# Spatial Interpolation of Point Data\n\n|   |   |   |   |   |   |\n|---|---|---|---|---|---|\n\
    | 2 | NA | NA | NA | NA | NA |\n| 3 | NA | NA | NA | NA | NA |\n| 4 | NA | NA\
    \ | NA | NA | NA |\n| 5 | NA | NA | NA | NA | NA |\n| 6 | NA | NA | NA | NA |\
