- pgno: 231
  md: 'The resulting graphical output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_231_0.png)


    The preceding graphical output is familiar from Chapter 5, Working with Points,
    Lines, and Polygons (see the last screenshot in that chapter); the only difference
    is that now the slope raster appears in the background. The area appears to be
    characterized by variable topography. Are the natural and built areas characterized
    by different topographic slopes? This question motivates our next task—subsettng
    the slope pixels covered by natural areas and buildings, separately, to compare
    their value distributions.


    The mask function that we will use to do this task expects two main arguments:


    +   - The raster to be masked (x)

    +   - The object determining which values to mask (mask)'
  merge: -1
