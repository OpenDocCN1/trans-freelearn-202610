- pgno: 179
  md: '# # Creating new geometries


    The rgeos package provides four functions to create new layers based on a pair
    of existing ones: `gDifference`, `gIntersection`, `gSymdifference`, and `gUnion`.
    The usage of these functions is very similar to that of functions to query relationships
    since their main parameters are also a pair of layers and the byid parameter.
    The difference is that they do not return logical values or matched attribute
    table entries (based on whether the examined relationship holds), but rather a
    new layer. The following diagram demonstrates how new geometries are generated
    in each case:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_179_0.png)


    > > Note that the gUnion function operates in a similar way to gUnaryUnion—just
    that the gUnion function dissolves geometries from two different layers, while
    the gUnaryUnion function operates upon the geometries of a single layer.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Working with Points, Lines, and Polygons


    Our next example will utilize two of these functions: `gIntersection` and `gDifference`.
    We will also use three new layers: buildings, natural areas, and administrative
    borders in Haifa. The buildings and natural areas layers originate from OpenStreetMap
    data, the same way as in the London example, while the administrative borders
    of Israel will be downloaded from a global administrative borders dataset directly
    through R. The buildings and natural areas layers will be named `haifa_buildings`
    and `haifa_natural` in order to not be confused with the analogous objects `buildings`
    and `natural` from the London example.


    Our goal will be to create a polygon encompassing the natural areas in the vicinity
    of the buildings in Haifa, excluding those natural areas that are within 50 meters
    of the nearest building. We will follow four intermediate steps:


    +   1. Read the layers into R and bring them to a common CRS.

    +   2. Create a bounding polygon (convex hull) encompassing the buildings.

    +   3. Clip the natural areas according to the bounding polygon.

    +   4. Remove the natural areas that are 50 meters away from buildings.


    As a first step, we will read the Haifa buildings and natural areas layers:


    ```

    ```r

    > haifa_buildings = readOGR("C:\\Data", "haifa_buildings")

    > haifa_natural = readOGR("C:\\Data", "haifa_natural")

    ```

    ```


    The third layer involved, the administrative boundaries, will be downloaded from
    the GADM database of Global Administrative Areas at `http://www.gadm.org/`, which
    is accessible using the getData function from the raster package:


    ```

    ```r

    > israel_adm = getData("GADM", country = "ISR", level = 1)

    ```

    ```


    The hereby used arguments of getData are as follows:


    +   - `name`: The dataset name (for example, "GADM", which stands for the GADM
    dataset; using another dataset, "SRTM", will be demonstrated in the next chapter)

    +   - `country` (relevant for the `name="GADM"` option): The country ISO3 code
    (a list of country codes can be obtained with `getData("ISO3")`)

    +   - `level` (relevant for the `name="GADM"` option): The level of administrative
    subdivision (0: country, 1: first subdivision, and so on)'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'In fact, the county layer we used earlier comes from the GADM dataset as well
    (only that FIPS codes have been added to its attribute table). The reason GADM
    was not used in the London example is that it is less accurate than the Office
    of National Statistics layer.


    We will not need the whole `israel_adm` layer, but only a subset consisting of
    the Haifa administrative area, which includes the city of Haifa:


    ```

    > haifa_adm = israel_adm[israel_adm$NAME_1 == "Haifa", ]

    ```


    Before proceeding with geometrical calculations, as usual, all three layers (`haifa_adm`,
    `haifa_buildings`, and `haifa_natural`) will be reprojected to the same CRS. In
    this case, we are going to use the UTM Zone 36N CRS. We can obtain its parameters
    from the Landsat image object `l_03` we read into R in one of the previous examples:


    ```

    > haifa_adm =

    + spTransform(haifa_adm, CRS(proj4string(l_03)))

    > haifa_buildings =

    + spTransform(haifa_buildings, CRS(proj4string(l_03)))

    > haifa_natural =

    + spTransform(haifa_natural, CRS(proj4string(l_03)))

    ```


    Having completed the first step, we will take a moment to plot the three layers
    and see what they look like:


    ```

    > plot(haifa_natural, col = "lightgreen")

    > plot(haifa_buildings, add = TRUE)

    > plot(haifa_adm, add = TRUE)

    ```'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'The resulting graphical output (in the following screenshot) shows the Haifa
    administrative area border (haifa_adm, in this case marking the Mediterranean
    sea coastline), the Haifa buildings (haifa_buildings), and the natural areas (haifa_natural,
    shown in green):


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_182_0.png)


    Proceeding with the second step, we will create a convex hull polygon, assigned
    to buildings_ch, in order to define our area of interest surrounding the buildings.
    A convex hull is the smallest convex polygon encompassing a certain set of features
    (see the gray polygon in the next screenshot). A convex hull can be created using
    the gConvexHull function:


    ```

    > buildings_ch = gConvexHull(haifa_buildings)

    ```'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'The convex hull crosses the Mediterranean sea. We would like to, however, retain
    only those areas of buildings_ch that are within haifa_adm (in other words, on
    land). This can be achieved by using the gIntersection function on buildings_ch
    and haifa_adm:


    ```

    buildings_ch = gIntersection(buildings_ch, haifa_adm)

    ```


    Now that the bounding polygon buildings_ch is set, we proceed to our third step.
    Turning to the haifa_natural layer, we will merge all of its polygons into one
    polygon (since we are not interested in discerning different types of natural
    areas) using gUnaryUnion, similarly to what we did in the London example:


    ```

    haifa_natural = gUnaryUnion(haifa_natural)

    ```


    Then, we will use buildings_ch to retain only those natural areas that are within
    our area of interest, using another gIntersection function call:


    ```

    haifa_natural = gIntersection(haifa_natural, buildings_ch)

    ```


    What remains to be done is our fourth step, which is removing the areas in haifa_natural
    that are within 50 meters of the nearest building. To do this, we will first create
    a 50 meter buffer polygon surrounding haifa_buildings, using the gBuffer function
    (specifying the buffer size with width):


    ```

    buildings_50m = gBuffer(haifa_buildings, width = 50)

    ```


    Then, using the gDifference function, we will calculate the area in haifa_natural
    that is not within the 50 meters buffer of haifa_buildings:


    ```

    haifa_natural = gDifference(haifa_natural, buildings_50m)

    ```


    We are done. To see the resulting layers, we will plot all four of them (buildings_ch,
    haifa_adm, haifa_natural, and haifa_buildings) together, with the following series
    of plot function calls:


    ```

    plot(buildings_ch, col = "lightgrey", border = "lightgrey")

    plot(haifa_adm, add = TRUE)

    plot(haifa_natural, col = "lightgreen", add = TRUE)

    plot(haifa_buildings, add = TRUE)

    ```'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The resulting graphical output is shown in the following screenshot:


    ![](img/ebfd6294770b225fdeceda9a7b8b560e_184_0.png)


    In the preceding screenshot, we can see the bounding polygon `buildings_ch` in
    gray, the administrative borders, as well as the buildings, in black, and natural
    areas (those within the bounding polygon and excluding areas within 50 meters
    of buildings) in green. We will continue working with the Haifa layers we have
    hereby created in several additional examples in subsequent chapters.'
  merge: -1
  img_proc: true
- pgno: 185
  md: "# # Calculating distances between geometries\n\nLet's now return to the London\
    \ example, to complete its fourth step (which is distance calculation). Distances\
    \ between each feature from one layer to each feature in a second layer can be\
    \ calculated with the `gDistance` function, setting `byid` to TRUE. The following\
    \ expression calculates the distance from each feature in buildings to each feature\
    \ in river:\n\n```\n> dist = gDistance(buildings, river, byid = TRUE)\n```\n\n\
    As seen in the gContains example, the result is a matrix:\n\n```\n> class(dist)\n\
    [1] \"matrix\"\n```\n\nThe matrix rows correspond to river features, whereas its\
    \ columns correspond to buildings features. As the following output of dim demonstrates,\
    \ we have 1,583 buildings features in the City of London and one river feature\
    \ (remember that we dissolved the separate riverbank parts into one):\n\n```\n\
    > dim(dist)\n[1]    1 1583\n```\n\nSelecting the first (and only) row of `dist`\
    \ will yield a numeric vector with the distances of each building to the nearest\
    \ riverbank. With the following expression, we can assign the distances to a new\
    \ column, named `dist_river`, in the attribute table of buildings:\n\n```\n> buildings$dist_river\
    \ = dist[1, ]\n```\n\nExamining the attribute table will demonstrate that, indeed,\
    \ we now have a distance-to-river entry for each of the buildings in the City\
    \ of London:\n\n```\n> head(buildings@data)\n        osm_id                  \
    \       name             type dist_river\n16  4076420                 St Brides\
    \ place_of_worship    313.1239\n56  4364085 Sainsbury's Head Office          \
    \           block    683.5640\n137 4959489             30 St Mary Axe        \
    \         attraction    653.4159\n138 4959510              Bank of England   \
    \                 office    583.7244\n139 4959544             St Paul's Cathedral\
    \               cathedral    287.7122\n140 4959629              Liverpool Street\
    \                train_station 1009.8070\n```\n\nWe are going to wait until *Chapter\
    \ 9, Advanced Visualization of Spatial Data*, to graphically display this result\
    \ while learning some additional visualization methods."
  merge: -1
  img_proc: true
- pgno: 186
  md: "# Joining geometries with tabular data\n\nIn this section, we are going to\
    \ join an attribute table of a spatial vector layer with plain tabular data (as\
    \ opposed to joining with the attribute table of another layer based on spatial\
    \ location). In spatial analysis practice, we often have, at hand, a spatial layer\
    \ and supplementary tabular data as separate objects, while we would like to work\
    \ with them in combination. For instance, in the present example, USA Census data\
    \ regarding county population sizes (a CSV file) will be linked to the county\
    \ layer defining county geometries, in order to calculate county population densities.\
    \ To do the latter, we need to know both the population size (from the census\
    \ table) and area size (from the vector layer) for each county, and the only way\
    \ to do that is to join both datasets.\n\nThe intermediate steps we will perform\
    \ are as follows:\n\n+   1. Read the USA Census data.\n+   2. Subset the portion\
    \ of the data we are interested in.\n+   3. Prepare a common key to join the census\
    \ data with the county layer.\n+   4. Join!\n+   5. Calculate the population density.\n\
    \nOur first step is to read the USA Census data into R.\n\n> The USA Census data\
    \ was downloaded from the United States Census Bureau available at https://www.census.gov/popest/data/counties/totals/2012/CO-EST2012-alldata.html.\n\
    \nThe CSV file, CO-EST2012-Alldata.csv, is provided on the book's website in its\
    \ original form. The following expression reads its contents and assigns it to\
    \ a data.frame object named dat:\n\n```\n> dat = read.csv(\"C:\\\\Data\\\\CO-EST2012-Alldata.csv\"\
    )\n```\n\nThe expression colnames(dat) reveals that we have as many as 52 variables\
    \ in this table. To save space, only the first 15 values are printed here:\n\n\
    ```\n> colnames(dat)[1:15]\n  [1] \"SUMLEV\"      \"REGION\"      \"DIVISION\"\
    \n  [4] \"STATE\"       \"COUNTY\"      \"STNAME\"\n  [7] \"CTYNAME\"     \"CENSUS2010POP\"\
    \ \"ESTIMATESBASE2010\"\n [10] \"POPESTIMATE2010\" \"POPESTIMATE2011\" \"POPESTIMATE2012\"\
    \n [13] \"NPOPCHG_2010\" \"NPOPCHG_2011\" \"NPOPCHG_2012\"\n```"
  merge: -1
  img_proc: true
- pgno: 187
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 188
  md: "Examining the table will also reveal that it contains subtotal entries, for\
    \ entire states, in addition to the county entries. These entries are marked with\
    \ the value 0 in the county column. Since we are interested in counties, not states,\
    \ these entries need to be removed:\n\n```\n> dat = dat[dat$county != 0, ]\n```\n\
    \nWith the first and second steps now complete, we are going to create a key with\
    \ which the county layer and the dat table will be joined. The least problematic\
    \ option is to use the FIPS codes as a key since county names may be slightly\
    \ different among datasets.\n\nWe already have a FIPS column in the county layer.\
    \ For example, the FIPS codes of the first 10 features are as follows:\n\n```\n\
    > county$FIPS[1:10]\n  [1] \"09005\" \"09003\" \"09013\" \"09015\" \"06093\" \"\
    06015\" \"06049\"\n  [8] \"09011\" \"09001\" \"09007\"\n```\n\nThese five-digit\
    \ codes encompass the state code (digits 1 to 2) and county code (digits 3 to\
    \ 5). As we can see, when the state or county code is fewer than two or three\
    \ digits, it is preceded by zeros. For example, the first county polygon has the\
    \ FIPS code 09005, which means its state code is 9 (state of Connecticut) and\
    \ county code is 5 (Litchfield County). However, in the dat table, the state and\
    \ county FIPS codes are kept as separate numeric values without leading zeros\
    \ (9 and 5). In order to get matching values with the county layer, we need to\
    \ perform the following steps:\n\n+   1. Add leading zeros in the state column\
    \ to get uniform two-digit codes.\n+   2. Add leading zeros in the county column\
    \ to get uniform three-digit codes.\n+   3. Paste the state and county columns\
    \ together to get the FIPS codes.\n\nThe first two steps can be performed using\
    \ the formatC function. This function can deal with several formatting tasks including\
    \ the one we need — padding the values of a vector with leading zeros, to obtain\
    \ a common character length. In this particular case, we need to specify three\
    \ arguments: the vector to work upon, the required final character count (the\
    \ width parameter), and the format modifier \"0\" (the flag parameter, where \"\
    0\" marks the pad with leading zeros scenario; see ?formatC):\n\n```\n> dat$state\
    \ = formatC(dat$state, width = 2, flag = \"0\")\n> dat$county = formatC(dat$county,\
    \ width = 3, flag = \"0\")\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: 'We can examine the first few values of the modified state and county columns
    to make sure the expected outcome was obtained:


    ```

    > dat$state[1:10]

    [1] "01" "01" "01" "01" "01" "01" "01" "01" "01" "01"

    > dat$county[1:10]

    [1] "001" "003" "005" "007" "009" "011" "013" "015" "017" "019"

    ```


    Note that the numeric values have been automatically converted to characters since
    a numeric value cannot have leading zeros.


    Finally, we will paste the state and county codes into county FIPS codes and assign
    them to a new column called FIPS:


    ```

    > dat$FIPS = paste0(dat$state, dat$county)

    ```


    Now, we have in dat$FIPS an identical format as seen in county$FIPS:


    ```

    > dat$FIPS[1:10]

    [1] "01001" "01003" "01005" "01007" "01009" "01011" "01013"

    [8] "01015" "01017" "01019"

    ```


    We are ready to move on to the fourth step—joining the attribute table of county
    with the dat table. In fact, we are going to use a subset of dat, containing only
    two columns: FIPS (since the join will be based upon it) and census2010pop (since
    these are the data we are interested in) because the state and county columns
    are of no use to us at this stage. The join operation is done using the join function
    from the plyr package (see Chapter 3, Working with Tables):


    ```

    > library(plyr)

    > county@data = join(county@data,

    + dat[, colnames(dat) %in% c("FIPS", "census2010pop")],

    + by = "FIPS")

    ```


    > Using county@data as the first argument in join and the type of join that is
    being used ("left", by default), ensures that all entries in county@data are preserved
    in their original order (regardless of whether they have a match in dat). This
    is extremely important since the rows of county@data correspond to the county
    polygons. Thus, changing the order of rows would result in a discrepancy between
    the attribute table and the spatial features. Concerning vector layers, operations
    such as join(county@data, x, type="left") are safe to perform, while manual modification
    of the @data component involving altering the row order (for example, deleting
    a single row) should be generally avoided.'
  merge: -1
  img_proc: true
