  \n## 分析数据迁移需求\n\n本节的需求可能会影响你的一些图表，例如架构全景图或数据模型。\n\n*该公司在其旧版 CRM 中拥有超过 8000 万客户。预计数据中包含大量重复项。*\n\
  \n分析此需求后，你可以识别以下需求：\n\n- 对旧版 CRM 中的客户进行去重，以便每个客户只保留一条记录。\n- 仅迁移活跃客户。预计生成的数据集将包含近\
  \ 600 万客户。\n- 将迁移的活跃唯一客户与 ERP 中的相关记录关联起来。这必须在 *不* 对 ERP 数据进行重大更改的情况下完成。\n\n始终牢记\
  \ *可用于解决客户需求的所有工具*。你可以将前三个需求理解为以下内容：\n\n- 需要对旧版 CRM 客户进行去重，并为公司所有客户创建一个 *黄金记录*。\n\
  - 需要从这些客户中选择一个 *子集*（仅活跃客户）。\n- 需要在 ERP 中识别客户，并 *在其记录与唯一客户黄金记录之间构建关系*。这将确保你可以跨所有系统创建客户\
  \ 360 度视图，尽管所有 ERP 都存在冗余。\n\n在 *第 2 章“核心架构概念：数据生命周期”* 中，你了解了三种不同的 MDM 实现风格：\n\n\
  - **注册表式**：这种风格通过运行匹配、使用清洗算法，并为匹配的记录分配唯一全局标识符，来发现各连接系统中的重复项。\n- **整合式**：在这种风格中，数据通常从多个来源收集并在中心进行整合，以创建单一版本的真相，有时也称为\
  \ *黄金记录*。\n- **共存式**：这种风格与整合式相似，因为它也会创建黄金记录，但主数据更改可以在 MDM 中心或数据源系统中进行。\n\n现在你已重新了解了这三种\
  \ MDM 风格，请花点时间再次思考你的数据策略，并考虑共享需求。请记住，你 *可以* 组合多种 MDM 风格，可能分阶段实施。你心中制定了计划吗？将其与以下内容进行交叉核对。\n\
  \n使用实现整合式风格的 MDM 工具可以对源记录进行去重，从而创建整合的、唯一的黄金记录。考虑到去重可能会变得复杂，尤其是在缺乏强属性（例如特定格式的电子邮件地址或电话号码）的情况下，你需要能够执行模糊逻辑匹配而非精确匹配的工具。\n\
  \n这听起来熟悉吗？你在 *第 13 章“展示与辩护：第一次模拟”* 中遇到了同样的挑战。对于解决方案的这一部分，你可以建议使用 **Informatica MDM**。Informatica\
  \ 的 ETL 功能也将很有用，可帮助你识别和选择将要迁移到 Salesforce 的 *活跃客户*。\n\n你终于来到了需求的最后部分，需要将唯一客户与 ERP\
  \ 中的重复和冗余客户记录关联起来。为此，你需要支持 **注册表式** 的 MDM 工具。\n\n该工具将拥有自己的模糊逻辑匹配，并使用它来识别所有 ERP 中客户的不同表示形式。然后，它不会将记录合并以创建黄金记录，而只是生成一个\
  \ **全局 ID** 并将其分配给所有相关系统中的客户记录。完成后，你可以使用全局 ID 跨所有系统获得客户的 360 度视图，尽管存在数据冗余。**Informatica\
  \ MDM** 支持 MDM 注册表式风格。还有其他一些知名工具，例如 **Talend** 和 **IBM InfoSphere**。**Salesforce\
  \ 客户 360 度数据管理器**（自 2021 年 2 月 1 日起停用）也是这些工具之一。\n\n### 注意\n\n避免仅因为产品是新的就提出建议，并假设它们能解决所有问题和挑战。许多挑战可以使用上市多年的工具来解决。基于你的知识和经验，提出你知道可行的工具。\n\
