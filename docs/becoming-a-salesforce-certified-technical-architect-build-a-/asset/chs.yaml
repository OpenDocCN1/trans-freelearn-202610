  ### 非手动创建的线索应根据地理位置（国家）自动分配给国家的营销团队


  让我们先问自己一个简单的问题：是否有开箱即用的可配置功能可以用来满足此要求？作为Salesforce解决方案架构师，您应该了解标准平台功能的细节。在这种情况下，线索分配规则可以与队列结合使用。此解决方案是可配置的、经过优化的，并满足要求。此外，它也是面向未来的，因为它基于标准的可配置Salesforce功能。


  "future-embracing"（面向未来的）一词优于futureproof（未来无忧的），因为精简且架构良好的解决方案应该拥抱和欢迎未来的变化，而不是阻止它们。


  您的拟议解决方案可能如下所示：


  我将利用标准线索分配功能，根据国家字段值将线索分配给国家队列。


  现在，您可以继续下一个要求。


  线索分配后，它会经过多个阶段。在每个阶段，线索所有者都需要完成一组活动。






  在利用开箱即用功能开始时，可以轻松意识到您可以使用标准线索流程功能来定义多个线索流程，每个流程都有不同的线索状态。在每个阶段，您可以生成一组任务并将其分配给线索所有者。这可以通过以下任一方式实现（按顺序）：


  - **Flows（流程）**：Salesforce Flows 可用于在创建或更新记录时执行复杂逻辑。这是一个可配置且可扩展的工具，可以提供所需的功能。此外，它是
  Salesforce 在每个版本中积极增强的现代工具。显然，与列表中的任何其他工具相比，它获得更多未来增强功能的机会更大。


  - **Custom Apex code（自定义 Apex 代码）**：这提供了终极的功能和灵活性，但伴随着不合理的额外开发和维护成本。


  **注意**

  Salesforce 已在 Winter ''23 版本中退役 Process Builder 和工作流规则。虽然当前的工作流规则和流程构建器将继续运行，但您将无法使用这些工具创建新的自动化。这些工具不应被视为您解决方案的一部分。


  您的拟议解决方案可以如下：


  我建议利用线索流程功能来定义具有不同线索状态的多个线索流程。然后，创建一个 Salesforce 记录触发式流程，以便在将线索更新为特定状态时自动创建任务并将其分配给线索所有者。该流程可以配置为使用基于条件的分支逻辑，这样我们可以根据线索状态创建不同的任务集。


  一旦线索合格，必须将其转换为机会，并自动移交给该国的销售运营团队。


  此要求未指定线索转换是否应自动发生，或者是否可以继续手动流程。您可以假设其中一种，并以此为基础制定解决方案。


  默认情况下，当机会通过线索转换创建时，其所有者与转换后线索的所有者相同。您需要一个自动化流程，将其分配给该国销售代理的队列。


  ### 您的拟议解决方案可以如下：


  *该场景未指定转换是否必须自动发生；因此，我假设由线索所有者手动完成。一旦线索转换为机会，我将使用 Salesforce 记录触发式流程来设置目标国家的销售代理作为机会所有者。我假设每个国家都有一个预定义的用户。该流程还会将该国的销售运营用户添加到机会团队中。我还假设每个国家的用户数量有限。*


  *销售运营代理将跟进交易。代理应能够创建报价并与客户协商。*


  这是标准的 Salesforce 功能。销售代理拥有 Sales Cloud 许可证，因此可以使用报价对象。


  ### 您的拟议解决方案可以简单如下：


  *将向销售代理分配 Sales Cloud 许可证；这使他们能够创建和更新报价。这是标准的 Salesforce 功能。*


  在解释解决方案时，请记得使用图表。角色和许可证图表（例如您在图 8.1 中看到的图表）在这种情况下特别有用。


  *一旦报价被接受，代理会将机会更新为合同阶段。*


  主要要求是根据已成交的机会自动创建合同，这可以轻松使用流程或自定义开发代码完成。该场景未指定任何高级合同创建逻辑来证明提出第三方解决方案的合理性。


  市场上有多种 **CLM（合同生命周期管理）** 解决方案，包括一些在 AppExchange 上提供的，例如 Apttus Contract Management、DocuSign
  CLM 和 Conga Contracts。它们提供高级合同创建和谈判功能。但是，本场景未要求此功能。


