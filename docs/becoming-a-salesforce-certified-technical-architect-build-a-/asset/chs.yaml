  ## 深入了解共享需求


  POW 分享了一组需求。您将逐一浏览它们，制定拟议的解决方案，并相应地更新图表。从第一条需求开始：


  该公司希望为其消费者提供便捷的自助服务体验，使他们能够提交支持工单和咨询。


  消费者目前使用公共网站下订单，并且您从场景中知道，该网站允许消费者注册并登录到某种门户。


  利用 Salesforce Service Cloud 的功能，提出应创建和管理案例以满足此需求是合理的。但是，您可能会问自己一个问题：应该建议使用 Salesforce
  社区，还是仅在现有门户之上构建一个自定义解决方案，然后将其与 Salesforce Service Cloud 集成？


  毕竟，门户已经存在。您可以简单地在其中开发创建、查看和更新案例的功能，然后使用集成用户将其与 Service Cloud 集成，对吧？答案是否定的。这是另一个构建或购买的决策。购买选项在大多数情况下能提供更好的投资回报率。但在这种情况下，很容易证明其理由。


  要构建一个安全的门户，您需要在现有门户之上构建完整的用户访问控制功能，以确保用户无法访问不应访问的案例。集成用户可能会访问所有案例。一个完全自定义的用户访问控制模块不易开发、测试或维护。


  此外，以这种方式使用集成用户可能会违反 Salesforce 的条款和条件，如果门户被攻破，可能会导致重大数据泄露。


  所有这些理由足以证明使用 Salesforce 社区是合理的。它们附带一个稳健的用户访问控制模块，此外还有可配置页面。一些客户更喜欢使用他们自己的完全自定义页面。在这种情况下，他们最终可能会使用
  Salesforce 社区许可证，但不使用页面。这在技术上是一种可接受的方法。


  POW 未分享任何表明他们希望将提交支持工单的功能嵌入当前门户的需求。您可以提出引入一个基于 Salesforce 社区的全新门户。然后，通过 SSO 将两个门户链接起来，以便用户无需登录两次。


  您的拟议解决方案可能如下：


  为满足此需求，我建议使用 Salesforce 社区。消费者将被分配一个 Salesforce Customer Community 许可证。我认为基于登录的许可证在这种情况下可能是一个更好的选择。我假设当前门户正在使用支持
  SAML 2.0、OAuth 2.0 或 OpenID Connect 标准的身份提供商。这将允许 POW 在现有门户和 Salesforce 社区之间启用 SSO。






  相应地更新您的角色和许可证图、景观架构图以及集成接口。现在，请查看下一个要求：


  POW还希望向其消费者公开一套丰富的可搜索常见问题解答，以尽可能将更多案例从呼叫中心转移出去。


  Salesforce Knowledge是一款强大的工具，您可以使用它构建内部或外部知识库。可以使用配置文件和权限集，将社区用户配置为对特定文章类型具有读取访问权限。请注意，组织必须至少拥有一个Salesforce
  Knowledge许可证才能启用和设置Salesforce Knowledge。您的建议方案可以如下：


  > 为满足此要求，我建议使用Salesforce Knowledge。我将使用配置文件和权限集来控制社区用户对特定文章类型的访问权限。

  > 此新功能将作为为POW创建的新Salesforce客户社区的一部分。


  更新您的景观架构并移动到下一个要求，其内容如下：


  注册消费者应能够查看长达四年的购买记录。


  根据场景，每天有150,000个订单，每个订单平均包含五个商品。这意味着每月有近450万个订单和2250万个订单行项目。四年之后，这些数字将变得巨大，大约为2.16亿个订单和超过10亿个订单行项目。这两张表在两个方面被归类为LDV对象，即每月数据增长和每年的记录总数。


  您还不清楚将用于订单履行的系统。考虑到数据量，您可以提出一个异地平台解决方案，例如使用自定义Heroku解决方案、ERP扩展或全新系统。


  但是，根据场景，订单通常在不超过两周内完成履行。这意味着您可以使用本平台订单履行解决方案来处理未完成订单，并使用存档机制将已完成履行的订单移出平台。在任何给定时间，存储在本平台上的未完成订单数量都不会导致创建LDV对象。


  AppExchange上有几种订管理解决方案。Salesforce还拥有一个名为Salesforce Order Management的自有解决方案，该方案于2019年推出。场景本身并未深入探讨订单如何履行的详细信息，这意味着即使您不完全了解Salesforce
  Order Management的工作原理，您仍然可以提议并假设其功能足以满足POW的需求。


  使用本平台解决方案交付此功能将使您能够覆盖其他即将到来的要求。因此，建议在开始解决方案之前至少浏览一次场景。这将帮助您对潜在解决方案的某些关键部分形成早期想法。


  您仍然可以提出异地平台解决方案，但您需要确保它仍能满足POW的所有要求。


  > **注意**

  >

  > 小心将不应承担的更多职责转移到异地平台应用程序。这可能表明您不完全了解平台的价值和功能，也不了解在像Force.com这样的灵活平台之上构建解决方案的好处，该平台与其他CRM功能提供原生集成。

  >

  > 简而言之，在提出异地平台解决方案时，请确保它增加价值并解决无法使用本平台功能得到最佳满足的问题。


  对于此要求，您可以选择以下方案之一：


  - POW的网站每天用于捕获大量订单。我进行了一些计算，发现每月将有近450万个订单和2250万个订单行项目。四年之后，将有近2.16亿个订单和超过10亿个订单行项目。在Salesforce中保留如此大量的数据。


  - 我曾考虑使用异地平台订管理解决方案来处理此问题，但这意味着我们将失去Salesforce平台上可用的许多开箱即用功能。我们还知道，用户通常在不超过两周内完成履行。因此，我建议使用Salesforce
  Order Management来处理订单履行要求。此外，我建议引入一种存档机制，其中所有已完成履行的订单都将复制到Heroku并从Salesforce中删除。


  - 我曾考虑使用Heroku Connect进行数据同步，但我知道它不提供部分同步数据的机制，而我只需要同步已完成履行的订单。因此，我建议使用Informatica等ETL工具来同步数据。它将按计划运行，从Salesforce中选取所有已完成履行的订单并将其复制到Heroku，然后删除所有成功同步的订单。同步作业包括订单和订单行项目。


  - 我们可以为此使用MuleSoft，但考虑到需要移动的数据量，我更愿意使用专为这种大容量数据传输设计的ETL工具，而不是MuleSoft，MuleSoft本质上是一个ESB。


  - 一旦记录位于Heroku中，我将使用Salesforce Connect和外部对象将它们重新暴露给社区用户。用户将使用命名主体/服务用户进行身份验证。我将开发一个Lightning组件来显示外部对象，因为这样我可以控制向用户显示哪些记录。我将使用组件控制器中的SOQL语句来确定检索的记录，确保每个查询都有where子句，以将检索的记录限制为当前登录用户ID。


  我将使用OAuth 2.0 Web服务器流向Heroku进行身份验证。我将在Salesforce中使用命名凭据来设置Salesforce Connect身份验证机制。


  社区用户将能够在一个页面上查看未完成订单，在另一个页面上查看所有先前已完成履行的订单。


  请记住，这只是一个建议方案，不是唯一可能的解决方案。您需要交付的方案应切实可行，满足所有要求，并在技术上正确。您还需要为自己的方案提供理由，并解释选择它的依据。您需要在问答环节为自己的方案进行辩护。如果您对自己的逻辑有信心，这并不困难。在解释此类主题时，请留意计时器。上述陈述应在不超过180秒内完成。


