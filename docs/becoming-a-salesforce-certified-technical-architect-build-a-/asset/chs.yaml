  \n## 继续分析需求并创建端到端解决方案\n\n你已在第 14 章“练习评审委员会：第二次模拟”中较早地覆盖了业务流程需求。在该章结束时，你已对潜在数据模型和环境有了良好的了解。你已经将一些对象标记为潜在\
