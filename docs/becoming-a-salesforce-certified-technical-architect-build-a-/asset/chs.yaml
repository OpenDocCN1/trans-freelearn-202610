  | 1 | 1 |

  | 2 | 3 |

  | 3 | 5 |

  | 4 | 3 |


  | 站点 ID | 地址城市 |

  | :--- | :--- |

  | 1 | San Francisco |

  | 3 | London |

  | 5 | Los Angeles |


  图 2.9 – 图 2.8 中的表修改后以符合第二范式（2NF）


  ### 第三范式（3NF）


  如果数据库满足以下条件，则被视为第三范式：


  - 它属于 2NF。

  - 非键属性不对主键存在传递依赖。以下表为例。ID 字段是主键。该表属于 1NF 和 2NF。名称、合作伙伴编号和银行代码字段在功能上依赖于 ID 字段。但是，银行名称字段依赖于银行代码字段。因此，该表不属于
