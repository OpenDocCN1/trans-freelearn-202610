  \n准备好进入下一阶段了吗？继续前进。\n\n## 演示并证明你的解决方案\n\n现在是创建演示文稿的时刻。你将不得不在评审委员会期间即兴制作，因为创建解决方案和支持工件可能会耗费三个小时。\n\
