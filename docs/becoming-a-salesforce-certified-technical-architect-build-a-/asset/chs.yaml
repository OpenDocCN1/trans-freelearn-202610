  \n## 了解演示文稿结构\n\n在评审委员会演示期间，你需要吸引并抓住听众的注意力。此外，你还需要帮助他们跟上你的节奏。\n\n你可以创建一个精彩的宣讲（使用幻灯片或其他工具），从端到端描述解决方案，混合业务流程、可访问性要求和数据迁移，并以一种引人入胜但不够有条理的方式进行展示，一旦相关话题出现在你脑海中就抛出一个解决方案。\n\
  \n这将使评委很难跟上你的思路。你可能会先展示考试场景第 7 页上某个需求的解决方案，接着是第 3 页上某个需求的解决方案，然后再展示第 5 页上的两个需求解决方案。诚然，评委的职责是为你提供的解决方案打分，但请尽量通过更有条理地展示来帮助评委。毕竟，以有条理的方式引导听众是一项你在现实生活中真正需要的软技能。\n\
  \n你应该将演示文稿分为两个主要部分：\n\n- **结构化部分**：在此部分，你将描述解决方案中特定的预先规划的元素。你通常从介绍整体解决方案和所创建的工件开始。然后，继续描述业务流程的拟议解决方案，随后解释你的\
  \ LDV 缓解和数据迁移策略。你可以根据需要向此部分添加更多元素。\n\n在开始演示之前，你需要计划将在此部分涵盖哪些元素和需求。这将帮助你分配时间，并确保为下一部分留出足够的时间。\n\
  \n- **万能部分**：这是你逐一查看需求，并指出那些在第一部分未涵盖的需求的地方。这将确保你不会错过任何要点，特别是那些容易得分的点。\n\n在以下部分中，你将为结构化部分创建示例演示宣讲。首先对解决方案和工件进行总体介绍。\n\
  \n在此阶段，你应当指出图表中的相关部分，以帮助评委可视化你的解决方案。即使你使用的是 PowerPoint 演示文稿，也要使用鼠标光标并在幻灯片之间切换。不要认为专业演示文稿应该单向进行。这不适用于此类演示文稿。你的宣讲可以如下所示：\n\
  \nPPA 正在寻求通过采用以 Salesforce 为中心的解决方案来现代化其 CRM 解决方案。他们目前在 APAC、EMEA 和 AMER 拥有区域性 ERP\
  \ [在图中指出]，并在本地托管。\n\nPPA 还在全球范围内使用五种不同的客户和租赁管理应用程序。这些应用程序将被新的以 Salesforce 为中心的解决方案所取代。\n\
  \n新解决方案将利用 Salesforce Sales Cloud 和 Service Cloud 作为核心系统，用于处理客户注册和预订。两个 Salesforce\
  \ 社区将成为解决方案的一部分，即客户社区和合作伙伴社区。此外，我将使用一个 AppExchange 产品来处理在线支付。\n\n该解决方案还将包括 Heroku\
  \ 作为平台，用于接收和处理追踪设备接收的大量数据，以及 MuleSoft，它将是用于将 Salesforce 与其他外部和内部应用程序集成的中间件。\n\n\
  我选择 MuleSoft 是因为几个共享需求需要能够编排流程的中间件，例如确定目标 ERP 系统并相应地调用它。此外，使用 MuleSoft 的集成接口不会传输大量数据。正是这一点让我意识到需要\
