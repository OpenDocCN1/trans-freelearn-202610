  \n\n\n\n\n## 摘要\n\n在本章中，你深入了解了 Salesforce 通信领域的细节。你了解了 CTA 预期涵盖的内容以及细节程度。你学习了一些展示特定解决方案的实用示例，并理解了标准图表的重要性以及你可能遇到的常见图表类型。\n\
  \n然后，你处理了一个微型假设场景，并进行了假设的问答环节，以练习处理异议。你还了解了一些需要避免的陷阱，以及如何在 CTA 评审委员会和现实生活中留下正确的专业印象。\n\
  \n之后，你探索了处理特定需求的多种潜在方式。你了解了一条路径如何导致完全不同的一组潜在挑战，以及如何为其做好准备。你还了解了如何通过仅仅追求一个简单的解决方案（在那里出错的地方更少）来避免困难局面。\n\
  \n这总结了你需要掌握的七个知识领域。在下一章中，你将开始你的第一个完整假设场景。你将接触到一个全尺寸场景，你需要使用迄今为止所学的所有知识和技术来解决它。系好安全带，准备就绪！\n"
- "# Practice the Review Board: First Mock\n\n在本章中，你将把过去章节学到的所有知识付诸实践。你将接触本书的首个完整模拟场景，该场景与你在评审委员会中可能遇到的真实场景非常接近。\n\
  \n阅读本章和下一章后，建议你重新阅读场景并自行设计解决方案。\n\n你可以根据需要多次重读场景并设计解决方案，直到你对它们感到足够自信为止。请尽量遵守 *三小时解答窗口*。你将在\
  \ *附录、技巧与窍门，以及前进之道* 中学到一些实用的时间管理技巧。\n\n在本章中，你将涵盖以下主要主题：\n\n- 介绍完整模拟场景：**Packt Pioneer\
  \ Auto (PPA)**\n- 分析需求并制定端到端解决方案草案\n\n本章结束时，你将熟悉完整模拟场景的形态、规模和复杂性，这将帮助你备考。你还将学会如何为场景中的业务流程创建端到端解决方案。废话不多说，你现在可以去查看你的第一个完整模拟场景了。\n\
  \n## 介绍完整模拟场景：Packt Pioneer Auto\n\n**PPA** 是一家全球汽车租赁公司，面向美洲（AMER）、欧洲中东非（EMEA）和亚太（APAC）地区的终端客户提供服务。PPA\
  \ 在 10 个不同国家的 50 个主要城市运营，包括意大利、西班牙、法国、澳大利亚、日本、美国和英国。每个城市通过 PPA 办事处平均提供 5,000 辆可出租汽车。每个城市平均设有\
  \ 10 个办事处。\n\nPPA 允许其客户最多提前三个月预订汽车租赁。此前，他们使用呼叫中心处理客户预订，但现在正在努力现代化其服务。客户也可以步入 PPA\
  \ 的任何办事处，直接租赁可用汽车。\n\nPPA 在全球拥有约一百万注册用户，年均汽车租赁量达 1000 万次。\n\nPPA 与合作伙伴网络合作，清洁、维修和保养其汽车车队。每辆车都安装了现代\
  \ GPS 跟踪设备，能够定期发送汽车位置，此外还提供其他服务，例如检测急刹车和超速行为。\n\nPPA 的办事处由销售和支持团队组成，负责管理客户及其与合作伙伴的关系。目前，每个国家都有用于跟踪客户和租赁信息的定制解决方案。这些解决方案以易出错且难以维护而闻名。\n\
  \nPPA 最近决定将 Salesforce 用作统一客户、租赁和合作伙伴流程的中心 CRM 解决方案。\n\n## 项目概览\n\n有五类员工需要访问系统：\n\
  \n- **销售代理**：负责在地区办事处值班，协助现场客户注册并预订汽车租赁。他们还负责检查归还车辆是否有损坏，并提供最终客户发票。\n\n- **支持代理**：负责支持注册客户，解决有关租赁或汽车的报告问题。他们还通过呼叫中心支持汽车预订。支持代理在每个地区（美洲（AMER）、欧洲中东非（EMEA）和亚太（APAC））的单一支持办事处工作。\n\
  \n- **办事处技术员**：确保归还车辆功能齐全；他们对车辆进行深入检查，并向办事处经理提供维护报告。\n\n- **办事处经理**：每个办事处都有一名经理，负责全方位运营业务，包括管理与合作伙伴的关系。\n\
  \n- **地区执行团队**：负责分析美洲（AMER）、欧洲中东非（EMEA）和亚太（APAC）地区的客户和租赁数据。\n\n系统有两类外部用户：\n\n- **注册客户**：需要访问一套全新的现代化服务。\n\
  \n- **合作伙伴**：有权访问系统以接收和更新维护请求。部分合作伙伴愿意使用 PPA 的解决方案，而另一些合作伙伴则表示有兴趣使用自己的系统，并仅与 PPA\
  \ 的解决方案进行集成。\n\nPPA 的现有架构如下。\n\n## 当前架构\n\nPPA 目前使用以下系统：\n\n- 区域 ERPs：区域 ERPs 用于管理合作伙伴的会计和付款。每个\
  \ ERP 基于不同技术，且部署在本地。\n- 全球跟踪系统：这是一种基于云的解决方案，用于远程控制汽车跟踪设备。该解决方案修改成本高昂，且在标准功能之外配置或扩展任何逻辑的能力有限。\n\
  - 客户和租赁管理应用程序：PPA 在全球范围内使用五种以上不同的应用程序进行客户和租赁管理。从历史上看，这些系统存在大量冗余和重复数据。PPA 计划用一个新方案替换它们全部。\n\
  - 违章数据库：PPA 从一家专门收集车辆违章数据的全球供应商处购买了基于订阅的服务。作为该订阅的一部分，PPA 可以访问一个数据库，其中包含其汽车在特定地区收到的所有违章、罚款和罚单。PPA\
  \ 在美洲（AMER）、欧洲中东非（EMEA）和亚太（APAC）地区拥有三个 AWS 上托管的 Oracle 数据库的访问权限。\n- 全球汽车租赁计算器：PPA\
  \ 开发了一个内部应用程序，用于根据多种因素计算汽车租赁成本，例如地点、开始和结束日期、汽车型号、汽车规格等。该应用程序内置 REST API，并托管在 AWS\
  \ 上。\n- PPA 使用 LDAP 对所有员工进行身份验证：PPA 希望在可预见的将来继续使用 LDAP。\n\nPPA 共享了以下业务流程需求。\n\n\
  ## 业务流程需求\n\n以下小节解释了 PPA 期望在新系统中实现的业务流程。\n\n### 客户注册\n\nPPA 要求无论客户使用什么渠道租车，都必须捕获特定客户信息。新系统必须支持以下流程：\n\
  \n- 客户应能够使用在线门户和移动应用程序自助注册。\n- 销售代理也可以为走进 PPA 办事处的新客户进行注册。\n\n  注册客户时必须捕获以下信息：\n\
  \  - 客户全名\n  - 电子邮件地址\n  - 手机号码\n  - 首选语言\n  - 驾驶执照号码\n\n客户还必须接受 PPA 的隐私条款和条件。客户可以选择通过电子邮件、电话或邮寄接收营销材料。\n\
  \n必须使用国家驾驶员和车辆管理局服务实时检查驾驶执照的有效性。\n\nPPA 共享了预订流程的以下要求。\n\n### 汽车预订\n\n客户应能够通过在线服务（门户和移动应用程序）或拨打国家客户服务电话，最多提前三个月预订汽车。在线流程应使用以下步骤：\n\
  \n1. 客户应能够输入取车地点（城市）以及开始和结束日期。系统应显示该地点和时间的可用汽车列表。\n2. 系统应计算并显示每辆汽车的租赁价格。价格可能因日期和预订总天数而异。PPA\
  \ 有一项定价政策，即如果客户预订较长时间，则降低每日成本。\n3. 客户应选择想要的汽车并进行在线支付。解决方案应支持 PayPal 以及所有主要信用卡。\n\
  4. 收到付款后，交易即视为完成。应向客户发送带有特定激活码的确认电子邮件。汽车应立即变为预订日期不可用状态。\n\n使用呼叫中心时，预订流程非常相似，只有细微差别：\n\
  \n1. 支持代理应能够使用开始和结束日期搜索特定地点（城市）的可用汽车。\n2. 支持代理随后可以口头告知客户可用汽车及其相关价格。价格计算规则在所有渠道中保持一致。\n\
  3. 客户确认汽车选择后，代理应捕获客户的付款详细信息并确认预订。\n4. 收到付款后，交易即视为完成。应向客户发送带有特定激活码的确认电子邮件。汽车应立即变为预订日期不可用状态。\n\
  \nPPA 共享了汽车还车流程的以下要求。\n\n\n\n\n\n### 车辆取车登记\n\nPPA希望尽可能自动化其流程。取车登记流程应如下所示：\n\n-\
  \ 1. 每个办公室都配备多台安装特定应用程序的平板电脑，允许客户使用预订期间收到的激活码进行取车登记。输入代码后，应用程序应验证代码、预订地点和日期。如果验证成功，屏幕上将显示确认消息，并更新预订记录以指示客户已取车登记领取车辆。所有平板电脑均连接到互联网。\n\
  - 2. 客户取车登记后，销售代理可以交付车钥匙，并更新预订状态以指示他们已领取钥匙。\n\nPPA已共享车辆还车登记流程的以下要求。\n\n### 车辆还车登记\n\
  \n还车登记流程应如下所示：\n\n- 1. 当客户归还车辆时，销售代理应收回钥匙并快速检查车辆。销售代理应输入与车辆状况变化相关的任何备注，例如凹痕或划痕。如果检测到重大损坏，应通知办公室技术人员并要求他们进一步调查车辆状况。\n\
  - 2. 此信息应发送到ERP系统，ERP系统将在72小时后生成客户发票。\n- 3. 一旦生成发票，系统将向客户发送包含发票金额和结算任何剩余余额说明的通知。\n\
  - 4. 检查完成后，销售代理将预订状态更新为已关闭。\n\nPPA已共享车辆状态更新的以下要求。\n\n### 车辆状态更新与罚款结算\n\n如前所述，所有车辆均安装了GPS跟踪设备。以下详细信息描述了车辆状态更新和罚款结算流程：\n\
  \n- 所有跟踪设备均可通过4G和3G通信。它们每30秒发送一次车辆位置。出于安全考虑，即使车辆关闭，此操作仍会继续。\n- PPA希望收集描述驾驶员行为的信息，包括超速和急刹车。所有这些都应进行分析，以便PPA计算一年中的特定日期和时间的驾驶模式。\n\
  - PPA希望使用GPS跟踪设备检测可能的车辆盗窃。如果设备在车辆关闭时报告车辆位置变化，这可能是盗窃事件，支持团队应在不超过15分钟内得到通知。\n- 每天应检查违规数据库。如果它们包含PPA车辆在特定日期的违规记录，系统应查询该日期车辆的驾驶员详细信息，然后将罚款金额转移到ERP以计算新发票并将其发送给客户。\n\
  \nPPA已共享以下数据迁移要求。\n\n### 数据迁移要求\n\n考虑到先前共享的当前环境信息，PPA共享了以下数据迁移要求：\n\n- PPA希望将当前所有客户和租赁管理应用程序的数据迁移到新系统。\n\
  - PPA知道当前数据包含许多冗余和重复项，并希望获得您的指导来处理这种情况，在目标系统中实现高数据质量。\n- PPA在每个当前租赁管理应用程序中约有5000万条租赁记录。其中大部分是为历史目的存储的，因为PPA希望保留租赁记录至少10年。PPA希望继续允许其销售和支持代理在新系统中访问这些记录。\n\
  \nPPA已共享以下可访问性要求。\n\n### 可访问性和安全性要求\n\nPPA正在寻求设计安全解决方案的指导；他们共享了以下要求：\n\n- 客户账户应对全球的办公室经理、销售代理和服务代理可见。但是，技术人员只能查看其特定国家的客户。\n\
  - 支持事件应仅对支持代理及其经理可见。\n- 只有办公室技术人员可以更新车辆状态以指示车辆已停用并需要维修。\n- 办公室技术人员不应能查看客户的驾驶执照号码。\n\
  - 一旦检测到盗窃事件，只有接受过此类事件培训的支持代理、他们的经理以及地区高管才能查看事件详细信息。\n- 地区高管团队应能访问所有地区数据，包括驾驶员行为，例如急刹车。\n\
  - 办公室经理只能查看其本国合作伙伴账户的详细信息。\n- 合作伙伴应仅能使用Salesforce管理的凭据登录到Salesforce。\n- 客户可以在在线门户和移动应用程序上自行注册。\n\
  - 客户还应能够使用其Facebook账户登录在线门户和移动应用程序。\n- 已登录企业网络的PPA员工应能够自动登录Salesforce，无需再次提供其凭据。\n\
  - PPA员工可以使用LDAP凭据从企业网络外部登录Salesforce。但是，如果他们从网络外部登录，应提供第二因素身份验证，例如接收到的手机短信。\n\n\
  PPA已共享以下报表要求。\n\n### 报表要求\n\nPPA请求了一套丰富的报表功能，包括以下内容：\n\n- 地区高管团队希望有一份报告，显示过去10年中客户驾驶行为与一年中的特定时间之间的关系。\n\
  - 地区高管团队希望有一份趋势月度报告，显示每次租赁的取车和还车地点，以确定其办公室之间汽车的适当分布。\n- 客户应能查看其租赁预订的完整历史记录，包括过去三年的预订。\n\
  - 客户还应能查看每次已完成租赁的完整行程历史。\n- 合作伙伴应能查看显示为PPA完成的维修工作的月度报告。\n\nPPA已共享以下项目开发要求。\n\n###\
  \ 项目开发要求\n\n考虑到PPA计划的复杂性，他们有以下项目开发要求：\n\n- PPA计划有三个不同的服务实施者（SIs），在并行项目中交付不同的功能。PPA希望避免团队之间的冲突，例如代码覆盖或破坏彼此的逻辑。PPA需要您的帮助来定义一种管理代码库的方法，以避免此类冲突并降低破坏现有功能的可能性。\n\
  - 历史上，SIs在处理其他平台时通常遵循自己的编码标准。在许多场合，他们引入了重复功能。PPA希望了解如何在Salesforce中控制和避免这种情况，并实现更好的代码复用。\n\
  - PPA有一位新平台负责人，从另一家也使用Salesforce的公司加入。他们报告说，在多个场合，错误在UAT中被修复，但随后又在生产环境中出现。PPA希望了解此类事件的可能原因以及如何在其计划中避免。\n\
  - PPA希望先在意大利发布解决方案，然后根据预先商定的计划将相同的解决方案推广到其他国家。每个地区国家可能有特定国家的要求，需要在解决方案中定义和适配。PPA希望获得您的支持，以确定合适的开发方法和治理来实现这一目标。\n\
  \nPPA还共享了以下其他要求。\n\n### 其他要求\n\nPPA希望了解管理客户同意的最佳实践。他们共享了以下要求：\n\nPPA希望确保开发环境中的数据始终匿名化。\n\
  \n假设性情景到此结束。在继续之前，请确保您已浏览假设性情景的所有页面和要求。\n\n接下来，是时候开始识别需求并创建草稿解决方案，遵循您在解决第5-11章的特定领域模拟情景时所使用的相同方法。\n\
  \n## 分析需求并创建端到端草稿解决方案\n\n给自己足够的时间来浏览情景并了解全局。您甚至可以开始添加潜在解决方案的注释。如果您计划进行现场评审委员会，您可以在单独的纸上或打印的情景本身上做笔记，而对于虚拟评审委员会，您可以使用Excel表格。您可以结合使用两者来获得两种体验；这取决于您的偏好和您感到舒适的方式。\n\
  \n\n\n\n\n您将在“附录、技巧与窍门，以及前进的方向”中了解准备和进行演示的两种可能方式。您还将看到解决方案和演示阶段的时间计划示例，其中需为预先计划的活动分配特定时间段。\n\
