  \n![](img/a3b1eecf3c87c814267f2877e8a8be1a_386_0.png)\n\n图 12.3 – 环境架构（初稿）\n\n完整场景通常以特定方式结构化，每组相关需求都有一个章节。例如，业务流程需求章节包含解释本场景中所有关键业务流程的小节。\n\
