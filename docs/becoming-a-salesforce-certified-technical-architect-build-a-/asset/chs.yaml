  \n## Anatomy of a Review Board Scenario\n\n## \n\nAs you learned in Chapter 12,\
  \ Practice the Review Board: First Mock, and Chapter 14, Practice the Review Board:\
  \ Second Mock, the review board scenarios are usually structured in a specific way.\
  \ They typically contain the following sections:\n\n正如您在第 12 章“练习评审委员会：首次模拟”和第 14\
  \ 章“练习评审委员会：第二次模拟”中所学，评审委员会场景通常以特定方式构建。它们通常包含以下部分：\n\n- Project overview: This section\
  \ provides general information about the company (which is what the scenario is\
  \ all about), the services it provides, pain points, geographic locations covered\
  \ by the company, growth plans, and so on. This section is generally helpful for\
  \ you to understand the bigger picture. It can also help you develop your initial\
  \ understanding of potential actors (the group of users who would eventually interact\
  \ with the solution) and the role hierarchy details.\n\n- 项目概览：本部分提供有关公司（即场景所涉及内容）的一般信息，包括其提供的服务、痛点、公司覆盖的地理位置、增长计划等。本部分通常有助于您了解全局。它还可以帮助您初步了解潜在参与者（最终将与解决方案交互的用户群体）以及角色层次结构详细信息。\n\
  \nThis section might include some important figures, such as the number of employees\
  \ (which could be the potential users of your proposed solution). However, this\
  \ is not necessarily the only place where such figures can exist. You have learned\
  \ from several previous scenarios in this book that these figures could significantly\
  \ impact the target data volume.\n\n本部分可能包含一些重要数字，例如员工数量（可能是您所提议解决方案的潜在用户）。但是，这不一定是此类数字存在的唯一位置。您已从本书中几个之前的场景中了解到，这些数字可能会显著影响目标数据量。\n\
  \n- Current landscape: The scenario typically has a section that explains the existing\
  \ customer's system landscape. This section is helpful for you to start drafting\
  \ your landscape architecture. As you have learned in previous chapters, including\
  \ retiring systems in your landscape will help give you a complete picture. Moreover,\
  \ this section will provide you with a good early understanding of the task accomplished\
  \ by each system. You can also find important information about the specifications\
  \ of the systems in the landscape, such as their support of APIs and flexibility\
  \ to change. Such information can help you determine the applicable/non-applicable\
  \ integration patterns.\n\n- 当前环境：场景通常包含一个解释现有客户系统环境的部分。本部分有助于您开始绘制环境架构草图。如前几章所学，在环境中包含退役系统有助于形成完整的图景。此外，本部分将让您很好地早期了解每个系统完成的任务。您还可以找到环境中系统规格的重要信息，例如其对\
  \ API 的支持以及变更的灵活性。此类信息可以帮助您确定适用/不适用的集成模式。\n\nThis section might also include brief\
  \ information about supported business functionalities, the company's strategy in\
  \ retaining or replacing some of its existing systems, and overall general pain\
  \ points and risks.\n\n本部分还可能包含有关支持的业务功能、公司保留或替换某些现有系统的策略，以及总体一般痛点和风险的简要信息。\n\n\
  - Business use cases/business process requirements: This section is the meatiest\
  \ and, most likely, the longest in the scenario. This section contains most of the\
  \ scenario's business requirements and describes the general processes used by the\
  \ business. The business processes are usually described in a series of bullet points.\
  \ Each bullet point could include one or more requirements. The business process\
  \ will consist of functional, data, and integration requirements.\n\n- 业务用例/业务流程要求：本部分是场景中内容最丰富，最可能也是最长的部分。本部分包含场景中的大部分业务要求，并描述了业务使用的一般流程。业务流程通常由一系列项目符号描述。每个项目符号可能包含一个或多个要求。业务流程将由功能、数据和集成要求组成。\n\
  \n\n\n\n\n在之前的章节中，你了解到处理这一部分的最佳方式是创建业务流程图（按流程划分）。这不仅可以帮助你以结构化且吸引人的方式展示业务流程，还能帮助你梳理思路并发现潜在的缺口。\n\
  \n- **数据迁移要求**：这可能是一个独立章节，也可能是另一章节的一部分。本章节通常会描述源系统中的预期数据量。这些数据量/数字应帮助你制定数据迁移策略和计划。本章节还可能影响你对\
  \ **大数据量（LDVs）** 的定义以及你的 LDV 缓解策略。\n\n- **可访问性要求**：本章节通常包含 IAM 要求、移动端可访问性规范以及内部和外部预期的用户体验。你可以期望看到诸如用户凭据存储位置以及是否需要为外部用户支持社交登录等信息。本章节可能会为业务流程章节中共享的要求增加更多内容，特别是在系统和数据可访问性方面。在某些考试场景中，本章节可能会与安全要求章节合并。\n\
  \n- **安全要求**：这是最关键的章节之一，并可被视为第二复杂的章节（业务用例章节之后）。本章节通常包含应用程序和网络安全要求。它还可能包含一些要求来挑战你对多个平台安全功能的了解（例如共享规则、配置文件、权限集、平台加密、MFA\
  \ 和共享集）。\n\n- **报告要求**：本章节包含关键所需报告的描述。它还可能指明这些报告所需的数据（例如，来自多个系统的记录）。还可能会包含关于这些报告可用性以及受影响角色的详细信息。\n\
  \n- **项目开发要求**：本章节将包含当前发布流程的描述。它还可能列出一些痛点，这些痛点将帮助你定义正确的开发和发布策略以及适当的治理模型来控制它。\n\n\
  - **其他要求**：本章节可能存在也可能不存在，因为在某些情况下，它可能会与项目开发要求章节合并。本章节可能包含之前章节未涵盖的其他要求，包括可能影响你所提议治理模型的信息和风险。\n\
  \n### 注意\n\n这些章节的命名可能因场景而异。本章中解释的结构可以被视为 *一般结构*，因此请预期实际考试场景可能包含更多或更少的章节，或者具有完全不同的结构。你应做好准备，无论其结构如何都能处理该场景。\n\
  \nSalesforce 拥有定义和更改其考试结构的权利。本章及其描述的元素不应被视为官方文档，因为它仅基于作者的知识和经验。\n\n接下来，你将学习一组通用的解题技巧，即在制定端到端解决方案时应牢记的事项。\n\
  \n## 通用解题技巧\n\n首先介绍一组关于处理、组织和构建你的解决方案的通用技巧。你在之前的章节中已经学习了许多，并将在本节中再学习一些。\n\n### 首先浏览场景并添加批注\n\
  \n这是你在之前的章节中多次练习过的内容。在开始场景求解之前，请浏览整个场景，做笔记，并在每个要求旁边添加批注。\n\n在虚拟评审委员会中，你不会得到场景的打印副本。相反，你将获得一个可编辑的\
  \ MS Word 文档。你可以直接在 MS Word 文档中突出显示章节并添加批注。你还可以使用不同颜色来批注各种主题，例如潜在的 LDV。\n\n浏览整个场景并做笔记，应该能帮助你在场景求解和兜底演示两个阶段都受益。评审委员会的场景既复杂又冗长（正如你在前四个章节中亲身体验的那样）。如果你不清楚地突出显示或批注要求，很容易漏掉或忘记某些要求。\n\
  \n### 提供解决方案，而非一组选项\n\n作为 CTA，你被期望针对特定要求提出一个清晰且有据可依的解决方案。提供一堆解决方案是不可接受的。例如，在处理 LDV\
  \ 时，你不能简单地列出可能的解决方案，如自定义索引、归档和瘦表。你必须具体化，根据共享的要求选择一个解决方案，并予以论证。\n\n提及你考虑过的其他解决方案选项是可以的（如果你有足够的时间），但你必须对你推荐的解决方案及其理由做到简洁明了。\n\
  \n避免使用过多的 buzzwords。例如，仅仅知道 CI/CD 这个 buzzwords 不会得分，但如果你正确解释它，强调其优势，并说明它如何融入你的解决方案以满足共享要求，则可能得分。\n\
  \n### 解决问题时你拥有有限的工具集\n\n对于大多数要求，可能的解决方案数量是有限的。在创建解决方案时，你可能会感到有些不知所措，觉得自己拥有无限的工具集可供选择。但实际上情况并非如此。\n\
  \n以 LDV 为例。可供选择的 LDV 缓解解决方案数量有限。数据共享是另一个例子；在 Salesforce 中，你可以使用的数据共享功能数量有限，例如共享集、共享规则、手动共享、群组和\
  \ Apex。\n\n这些选项中有一个将是基于一组考量（从场景中提取）或你可以做出的假设的理想解决方案。\n\n### 使用架构师的通用语言\n\n你需要使用架构师的通用语言。图表对于可视化解决方案和与受众沟通至关重要。图表还可以帮助你组织思路，并确保涵盖所有需要涵盖的内容。\n\
  \n在适用的地方尽可能使用标准图表。例如，使用标准的时序图来解释一系列活动，而不是设计一个不寻常或非标准的图表。这就像是说一种人人都能理解的通用语言。\n\n\
  有时，你可能需要设计一个非标准图表来解释某个特定主题。请不要犹豫，但要确保在尽可能且容易实现的地方使用标准图表，否则使用易于遵循的非标准/自定义图表。\n\n\
  接下来，你将学习一套技巧和窍门，你可以遵循这些技巧来帮助你管理评审委员会。\n\n### 管理评审委员会\n\n评审委员会的评委是经验丰富的 CTA，接受过专业且中立地评判考试的培训。这意味着他们接受过掩饰情绪的培训。他们在你的演示和问答环节中会保持扑克脸。这意味着他们不会通过积极或消极的反应来打扰或误导考生。在虚拟评审委员会中，评委会关闭摄像头，并且只会在问答环节重新打开。\n\
  \n不过，你可以使用以下简单技巧来帮助你管理委员会。\n\n### 帮助他们跟上你\n\n在展示你的解决方案时，通过在场景中突出显示相关要求的位置，帮助评委跟上你。评委可能会漏掉你的一些陈述。你可以在每次觉得需要时，重复你正在求解的要求来帮助他们。\n\
  \n### 将你的解决方案与要求联系起来\n\n避免展示一个与要求无关的干巴巴的解决方案（也称为 *没有要求的解决方案*）。确保你阐明所提议的解决方案与共享要求之间的关系。\n\
  \n\n\n\n\n这表明你理解了需求。随后，你可以解释在众多可能方案中选择某个特定解决方案时所遵循的假设、理由和权衡。\n\n### 如果可能，观察并留意他们的反应\n\
  \n评委经过训练，能够掩饰任何情绪。然而，评委在你的演示和问答环节会做笔记。他们通常使用笔记本电脑来做笔记。有时，你可能能够观察到他们是否在敲打键盘。\n\n\
  在问答环节中，这一点特别有帮助。如果你在解释某事，而他们没有在敲打键盘，那么也许你并没有在之前描述的内容之上增加任何新信息。\n\n### 埋下一些问题\n\n\
  你在第9章《打造集成方案》中接触过这种技巧，并在第13章《展示与辩护：第一次模拟》和第15章《展示与辩护：第二次模拟》中再次体验过。\n\n你可以在演示中使用这种技巧，将评委的注意力引向你未详细阐述的某个特定主题。如果该主题引起评委的兴趣，他们将在问答环节回到该主题，询问更多信息。\n\
  \n你通常会埋下你自己有把握回答的问题。例如，你可以用恰到好处的细节描述一个集成接口，并提及其将使用的认证流程名称。如果评委有兴趣了解该认证流程的更多信息，或者想测试你的知识，他们将在问答环节回到这一点。届时，你可以使用时序图来解释该认证流程的所有必要细节。\n\
  \n小心不要滥用这种技巧。你仍然需要用所有必要的细节从头到尾解释你的解决方案。埋下太多主题可能会给评委留下你知识有欠缺的印象。你可以埋下一个问题，其详细程度不会影响你所提议解决方案的清晰度或完整性。\n\
  \n### 展示你的专业性\n\n在演示和问答环节中，要保持专业。避免在面对困难问题时虚张声势，因为这只会适得其反。评委会识破这种尝试，并可能认为这不专业，此外还无法回答问题。\n\
  \n展示你在问答环节能够认真倾听并理解。要自信，捍卫你的解决方案，坚持自己的立场，但同时保持谦逊，接受你的答案可能是错误的。如果发生这种情况，要以专业的方式承认错误，并在必要时调整你的解决方案。毕竟，传播和社会化你的解决方案是你需要展示掌握的领域之一。\n\
  \n### 时间管理\n\n时间管理在这次考试中至关重要。无论本书中多少次反复强调，时间管理的重要性都不过分。\n\n以下是一些技巧和窍门，帮助你在评审委员会考试期间管理时间。\n\
  \n### 提前规划并坚持你的计划\n\n你需要为考试的每个阶段制定时间计划：解题阶段、演示阶段和问答阶段。\n你的解题阶段时间计划可能如下所示：\n\n| 活动\
  \ | 子活动 | 最短时间（分钟） | 最长时间（分钟） | 推荐时间（分钟） |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | 全场景阅读与标注 | 阅读、理解，并高亮或标注潜在解决方案 | 20 | 40 | 30 |\n| | 创建草稿构件涂鸦 | | | |\n| 详细求解 |\
  \ 阅读、理解并求解 | 90 | 130 | 110 |\n| | 创建草稿构件 | | | |\n| 方案审查 | 审查你的方案并按需要进行调整 | 10\
  \ | 25 | 15 |\n| 构件最终化 | 创建构件的最终版本 | 10 | 30 | 20 |\n| 缓冲 | 为其他活动可能超时预留的缓冲时间 | 5\
  \ | 10 | 5 |\n\n你可以根据自己的技能和能力制定自己的时间计划。例如，你可能读得慢，但绘图很快。在这种情况下，你可以增加初始场景阅读和标注分配的时间，并减少构件最终化分配的时间。但是，建议不要超过或低于建议的最大和最小界限。\n\
  \n你的演示阶段时间计划可能如下所示：\n\n| 活动 | 子活动 | 最短时间（分钟） | 最长时间（分钟） | 推荐时间（分钟） |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| 介绍 | 自我介绍 | 1 | 3 | 1.5 |\n| | 高层场景和客户概览 | | | |\n|\
  \ 结构化演示 | 高层方案介绍 | 5 | 10 | 5 |\n| | 介绍参与者和许可证以及选择许可证的理由 | | | |\n| | 介绍景观架构和产品选择的理由\
  \ | | | |\n| | 业务流程：拟议方案 | 10 | 25 | 15 |\n| | 可访问性和安全性：拟议方案 | 5 | 10 | 5 |\n| |\
  \ LDV 缓解策略 | 3 | 5 | 3 |\n| | 数据迁移策略 | 3 | 5 | 3 |\n| | 治理，包括开发和发布策略 | 3 | 5 | 3\
  \ |\n| 概括演示或缓冲 | 浏览场景并指出任何缺失点 | 3 | 10 | 9.5 |\n\n附录-表 2 – 拟议的演示阶段时间计划\n\n在演示过程中，时间管理可能会稍微棘手一些。如果你在前面某个部分稍微超时，概括阶段可以充当缓冲。事实上，这很大程度上取决于场景的性质。场景可能包含更具挑战性的业务流程或安全要求，你可能需要相应地延长其各自的演示时间段。\n\
  \n请记住，这些只是建议数字，你需要根据自己的技能、能力和舒适区制定自己的时间计划。例如，你可能对治理宣讲非常熟悉，可以在三分钟内讲完。\n\n你可以在脑海中制定一个具体的计划开始练习，并根据需要进行调整，直到找到你的“舒适区”。\n\
  \n### 排练并完善你的时间安排\n\n在尝试评审委员会之前，你必须练习并完善你的时间计划。起初可能会感到困难，但通过练习和坚持，一切皆有可能。\n\n请同事或朋友在你的模拟演示中帮助你计时。这项活动在评审委员会期间会很有回报。\n\
  \n在评审委员会期间，你会得到一个计时器或可以使用时钟，具体取决于设施和考试性质（线下/虚拟）。你应该始终留意计时器或时钟。确保在练习时也如此。\n\n###\
  \ 练习两分钟宣讲\n\n你可能遇到过“两分钟宣讲”这个词，或者听过爱因斯坦的名言：如果你不能简单地解释它，说明你还不够理解。\n\n坚持这一原则，并在你的模拟和排练中进行练习。试着在两分钟内向同事或朋友解释一个主题。关注关键论点以及选择一种方法而非其他方法的理由。\n\
  \n除了时间管理之外，这项技能对于通过评审委员会至关重要。\n\n#### 平衡你花时间的地方\n\n这次考试的常见陷阱之一是，考生倾向于花太多时间在他们舒适区内的领域。例如，有些考生可能花10分钟仅仅解释发布管理策略。\n\
  \n同样，有些考生倾向于回避他们不一定擅长的主题，并希望能蒙混过关。请务必避免这种情况。不要遗漏任何主题/要求/要点，因为它们都很重要。坚持你的时间计划，并为每个要求部分投入应有的关注。\n\
  \n演示阶段至关重要，可能也是最难掌握的。在下一节中，你将探索更多有助于克服这一挑战的技巧和窍门。\n\n#### 你的演示：成败关键\n\n你现在了解评审委员会演示阶段的重要性。你已经学习了一些时间管理技巧和不同的管理委员会方式。接下来，你将浏览一组主要与你的软性演示技能相关的技巧。\n\
  \n#### 展现自信\n\nCTA 是一项具有挑战性的考试，拥有具有挑战性的演示阶段。你可能会感到紧张和压力巨大。但你必须学会掩饰这些情绪，并在整个演示和问答过程中散发自信。\n\
  \n你需要练习站在委员会面前的姿态。不要显得紧张或害怕，而是看着评委并进行一些眼神交流。他们不会表现出任何情绪（因为他们接受过不表现的训练），但你仍然必须展示你与听众沟通的能力。\n\
  \n试着在手里拿一个东西——一个杯子、一支笔或纸。有些人这样做时会感到更自信。\n\n减少诸如 _ah_ 和 _ehm_ 之类的填充语。要直接明了。如果你在演示过程中加快速度，请确保这是由于可用时间有限，而不是因为紧张。\n\
  \n#### 控制节奏\n\n如果你通常在观众面前感到不自在，这没问题。通过练习和坚持，一切皆有可能。你需要诚实地面对自己，了解自己的优点和缺点。过度自信也可能是一种弱点。\n\
  \n\n\n\n\n演示过程中控制情绪的技巧。你可以尝试在演示过程中不时休息 10 秒钟。喝一口水，慢慢来。你已经为喝这口水预算了 10 秒钟，所以好好利用。那些秒钟并非浪费。它们对组织你的思绪和控制情绪非常有帮助。\n\
  \n有些人天生就是演说家，而有些人则不是。要对自己有信心，并记住这句话：每个人都是天才。但如果你以爬栏的能力来评判一条鱼，它会终生相信自己很笨。\n\n了解你的优势和弱点，并据此制定、练习并完善你的进攻策略。\n\
  \n### 掌控舞台\n\n在舞台上走动，指向白板（或幻灯片的特定部分），并用肢体语言向观众展示你掌控着舞台。\n\n问答环节，放松并靠近提问的人。让评委觉得他们正在与一个同行打交道。\n\
  \n### 使用你的工件\n\n本书之前已多次讨论过此话题。但此处再次提及，是为了强调其重要性。\n\n你之所以创建景观架构图、数据模型图和角色层次结构等工件，是有原因的。主要原因是使用它们来传达你的端到端解决方案。在现实生活中，你也会使用它们来记录你的解决方案。此外，创建这些工件还能帮助你理清思路，发现可能遗漏的内容。\n\
  \n确保你善用图表。清晰地指向相关部分。评委（或任何观众）无法读懂你的心思。成功的演讲者能将完整信息顺畅地传递给观众。\n\n你投入了大量时间来开发一套出色的工具以帮助你进行演示。确保你善用它们。\n\
  \n### 享受过程\n\n你不常有机会向如此杰出的听众进行演示。所以，享受这段经历。这种感受会体现在你演示和问答环节的行动中，并留下良好的印象。\n\n享受问答环节。能够站在这些技术大牛面前，回答他们的问题，挑战他们，并捍卫你的观点，这是一段快乐的经历。\n\
  \n向评委展示你的能力。你想要这张证书来证明你属于享有盛誉的 CTA 俱乐部。没有比这更好的机会来证明这一点了。带着正确的心态参加评审委员会，你会享受这段经历。\n\
  \n### 你的考试，你的方式\n\n你已阅读本书并了解了多条建议和推荐。在准备评审委员会期间，你还将从其他 CTA、教练、候选人和专家那里阅读和听到更多内容。\n\
  \n有些人会推荐与其他人不同的方法。如果你与 10 位不同的 CTA 交谈，你可能会听到 10 条关于他们如何准备和参加评审委员会的不同反馈。在存在大量重叠的同时，也会有不同的观点。\n\
  \n例如，有些人会推荐使用 MS PowerPoint 演示文稿而不是翻页图表。其他人会推荐不同的结构和时间计划。有些人可能完全反对万能演示阶段，而另一些人可能支持它。这些反馈可能来自真实的\
  \ CTA，这意味着他们推荐的方法对他们有效。然而，这可能对你并不适用。\n\n你需要牢记的是，没有正确的方法。你需要找出最适合你的方法。使用本书和其他可用资源进行准备。在准备过程中，尝试找出最适合你的方法。\n\
  \n你需要确保仍然覆盖所有需要覆盖的内容。本书中你已经看到了几个示例。你如何做到这一点，取决于你根据自己的风格、技能、经验、优势和劣势来决定。\n\n确定你自己的识别需求策略、你自己的演示结构和时间计划，以及你自己的构建端到端解决方案的技术。通过练习来完善你的策略，并在考试当天坚持执行。无论你的计划是什么，避免在考试期间更改。临时更改是注定失败的做法。\n\
  \n### 后续步骤\n\n你已经走得很远了。你已经练习解决了多个场景，并成功处理了不同的功能和技术挑战。接下来，你将了解可能的后续步骤。\n\n### 练习，再练习\n\
  \n熟能生巧。这几乎适用于生活中的一切，包括准备 CTA 评审委员会。\n\n简单来说，你练习的模拟次数越多，通过的机会就越大。让自己置身于尽可能接近真实情况的条件下。使用计时器练习，并向他人进行展示。向他们请教反馈意见。\n\
  \n通常要求候选人在被认为已准备好参加评审委员会之前，练习五到九次完整的模拟。如果有机会做更多，就抓住机会。你练习的模拟越多（尤其是使用不同的场景），你就越了解自己应对考试的首选风格和策略。\n\
  \n你甚至可以多次使用相同的场景进行模拟。使用新场景是有价值的。惊喜因素会让你处于压力之下，这将类似于你在真实评审委员会中将要经历的情况。然而，多次做相同的场景仍然有很大价值；你甚至可以尝试每次与不同的评委一起进行，因为每位评委都有自己擅长的知识领域。\n\
  \n你也可以尝试创建自己的场景变体。一些 CTA 已经分享过相关的技巧。其他 CTA 也发布了一些免费的模拟场景。你将在本章末尾找到一套额外的资源。\n\n###\
  \ 考前安排一些休息时间\n\n你可能在工作中忙于千头万绪的事情。再加上社会和家庭责任，你的一天几乎排满了。\n\n你可能可以不时挤出一些学习活动。这可以帮助你为评审委员会做准备，前提是你利用工作时间来练习本书中列出的某些活动。\n\
  \n在评审委员会日期之前安排一些休息时间用于高强度准备活动。也许可以留出一些时间参加训练营，安排两到三周的高强度学习、模拟和练习。这对于帮助你弥补任何剩余的差距并使你进入正确的心态非常重要。\n\
  \n### 与社区和学习小组联系\n\n有多个可用的学习小组。这是几年前还不存在的奢侈品。利用它，并与同行联系以交流想法和经验。\n\n这些学习小组也会不时邀请\
  \ CTA 并进行现场模拟。时区对许多候选人来说可能存在困难，但请寻找你可以加入的本地或附近的学习小组。如果没有，就创建自己的小组。其他人会加入。\n\n你将在本章末尾找到关于这些学习小组的一些信息。\n\
  \n### 保持联系并分享你的经验\n\n有一些由在评审委员会中未成功的 CTA 和候选人撰写的博客。看看它们，并尽量利用他们的反馈。\n\n此外，不要犹豫分享你自己的经验。你不知道谁可能从中受益。这是回馈社区的绝佳举动。作为\
  \ CTA 或未来的 CTA，你有责任培养未来的架构师，帮助他们发挥潜力。\n\n### 社区和可用培训\n\n对架构师的市场需求空前高涨。为每个人培养高技能架构师都有益：Salesforce、Salesforce\
  \ 合作伙伴、客户以及架构师本身。有一些有价值的资源可以帮助你准备评审委员会。以下是一些可以帮助你的资源。\n\n### Salesforce 培训和学习小组\n\
  \nSalesforce 过去曾有两个有价值的培训研讨会来准备 CTA 评审委员会的候选人。它们被称为认证技术架构师准备研讨会（CTA-601）和架构师评审委员会准备诊断（CTA-602）。最近，Salesforce\
  \ 已停用 CTA-602，并引入了架构师评审委员会评估，这成为获得 CTA 凭证的必要条件。\n\n认证技术架构师准备研讨会是研讨会式培训。它将帮助你了解考试目标，并培养你创建端到端解决方案的技能。架构师评审委员会评估是完整模拟评审委员会考试的简化版本。它允许你练习解决、展示和捍卫完整的评审委员会模拟场景。你还将根据你的表现收到包含清晰总结和建议的反馈。\n\
  \n架构师评审委员会评估的结构如下：\n\n- 阅读场景并创建你的解决方案 60 分钟\n- 30 分钟演示\n- 30 分钟问答\n- 45 分钟反馈和讨论\n\
  \n你可以通过以下链接了解有关认证技术架构师准备研讨会和架构师评审委员会评估的更多信息：`https://packt.link/5w8uv`。\n\n\n\n\n\
  \n这里还有其他有价值的培训和学习小组列表：\n\n- **Salesforce 架构师网站**：Salesforce Architect 网站包含多种有用材料，可帮助您了解更多有关不同架构技能的信息。网站地址：https://packt.link/P8cXv\
  \  \n- 它还包括 Salesforce 图表框架，可用于加快创建标准架构图的过程：https://packt.link/M4VJR  \n- Salesforce\
  \ Architect 的一些有价值内容包括决策指南和架构良好框架。以下是两者的链接：  \n- https://packt.link/Mw7ma  \n- https://packt.link/rsxvU\
  \  \n- **CTA 办公时间**：这是一个 Chatter 群组，定期举办线上聚会和活动：https://packt.link/8SZTX  \n- **女性架构师小组**：这是一个最初旨在激励女性架构师的学习小组。但它很快发展成为向所有\
  \ Salesforce 专业人士提供宝贵信息的关键成功群组之一：https://packt.link/BE8vA 和 https://packt.link/iaJdQ\
  \  \n- **Salesforce 架构师小组，英国伦敦**：这是一个面向伦敦（线下）以及 EMEA（远程）总体架构师的学习小组：https://packt.link/eTzDn\
  \  \n- **Salesforce 架构师小组，阿联酋迪拜**：这是一个面向迪拜（线下）以及 EMEA（远程）总体架构师的学习小组：https://packt.link/wbyLB\
  \  \n- **架构师小组，澳大利亚墨尔本**：这是一个面向墨尔本（线下）以及亚洲（远程）总体架构师的学习小组：https://packt.link/5x4kf\
  \  \n- **架构师小组，荷兰乌得勒支**：这是一个面向乌得勒支（线下）以及 EMEA（远程）总体架构师的学习小组：https://packt.link/VGI0d\
  \  \n\n- 架构师开拓者社区：这是一个 Chatter 群组，面向架构师提供宝贵知识和材料：https://packt.link/rGDFd  \n\n\
  - 客户架构师社区：这是一个 Chatter 群组，面向架构师提供宝贵知识和材料：https://packt.link/o4nYy  \n\n- Salesforce\
  \ CTA 学习小组 Benelux：这是一个最初旨在覆盖比利时、荷兰、卢森堡（Benelux）地区，但迅速发展为国际性小组的学习小组：https://packt.link/OKJE6\
  \  \n\n- 使用 Node.js 的 Salesforce SAML 和 OAuth 2.0 授权流：这是一个 GitHub 仓库，包含使用 Node.js\
  \ 的多个身份验证流示例实现 https://packt.link/m804N  \n\n- Apex Hours：Apex Hours 是一个包含大量学习材料的网站，包括来自多个来源的\
  \ CTA 考试模拟场景集。其网站可通过以下链接找到：https://packt.link/UAyrh  \n\n- 模拟场景可通过以下链接找到：https://packt.link/9MUvk\
  \  \n\n官方 Salesforce 频道上还可以找到多种其他资源。此外，还会定期创建其他资源。您应该不断在 Google 上搜索和探索。\n\n### 故事与经验教训\n\
  \n许多架构师已与评审委员会分享了他们的经验。以下是精选列表：\n\n- https://packt.link/CNEAU  \n- https://packt.link/EJdqJ\
  \  \n- https://packt.link/bHNuh  \n- https://packt.link/d9PU8  \n- https://packt.link/xsSE7\
  \  \n- https://packt.link/msOI7  \n- https://packt.link/YYmWn  \n- https://packt.link/HF3v3\
  \  \n\n许多其他架构师也分享了他们的经验。有些人通过录制的视频分享，而另一些人则选择了博客。还会定期添加更多材料。请继续在 Google 上搜索和探索。\n\
  \n### 博客和培训提供商\n\n除了 Salesforce 为准备 CTA 评审委员会而推出的培训之外，还有以下有用的培训资源：\n\n- **Bob Buzzard**：与\
  \ Salesforce 相关知识最著名的博客之一：https://packt.link/qLohZ  \n- **Salesforce Ben**：与 Salesforce\
  \ 相关知识最著名的博客之一：https://packt.link/7ySW4  \n- **Gemma Blezard**：一个为 Salesforce 专业人士提供许多有价值资源的博客：https://packt.link/25BOU\
  \  \n- **FlowRepublic**：一个由多位才华横溢的 CTA 运营的辅导和指导学院：https://packt.link/zq3lS  \n-\
  \ **Cloud Johann**：一个包含许多有价值资源和技巧的博客，面向 Salesforce 架构师：https://packt.link/uxEum\
  \  \n- **CTA 202**：一个包含多个有价值资源和技巧的博客，面向 Salesforce 架构师，包括示例 CTA 模拟场景：https://packt.link/BKaQo\
  \  \n- **Cloud Sundial**：一个包含多个有价值资源的博客，包括有关身份验证流的详细信息：https://packt.link/8y3L6\
  \  \n\n同样，这只是互联网上海量宝贵知识中的有限列表。我们都很幸运有 Google。\n\n最后，结束本章的最后一个建议。参加评审委员会考试后，奖励一下自己。您会感到疲惫，在很多情况下，您对结果会不确定。只需放松，等待您的结果，并尝试在当天剩余时间（以及之后可能的一两天内）做一些愉快有趣的事情。\n\
  \n您现在比以往任何时候都更接近成为 Salesforce 认证技术架构师。保持良好的士气，继续朝着您的梦想迈出下一步！\n"
