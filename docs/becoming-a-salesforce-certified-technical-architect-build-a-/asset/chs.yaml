  ### 您的拟议解决方案可以如下：


  为满足此要求，我建议引入一个带有预定义值的自定义选项列表字段，用于记录失去机会的可能原因。然后，利用标准字段依赖功能，使该字段依赖于机会阶段值。我还建议引入一个自定义验证规则，以确保在机会更新为
  closed-lost 阶段时，始终在此字段中输入值，无论更新是通过 UI、代码还是 API 调用进行的。


  一旦机会 closed-won，应自动创建一个包含从机会中导出的关键信息的项目。


  不要期望要求根据其相关领域而孤立。在许多情况下，您会遇到跨越不同领域知识的要求，就像现实生活中一样。在这里，您有两个要求——一个与解决方案架构相关，另一个与安全相关。


  ### 您的拟议解决方案可以如下：


  为满足此要求，我建议使用自定义对象来存储项目详细信息，并使用 Salesforce 记录触发式流程在机会关闭后创建并填充此对象的记录。我考虑过使用标准对象（例如案例对象）来表示项目，但决定使用自定义对象，因为没有共享要求来证明使用案例对象的合理性，例如
  SLA 要求或升级流程。此外，我假设案例对象未来可能用于客户支持相关主题，并希望不将其重新用于其他目的。


  自定义对象的 OWD（组织范围默认值）将设置为私有，以限制记录可见性仅对其所有者（默认为销售代理）可见。考虑到记录将在关闭机会时创建（这是由销售代理执行的操作），我认为将此记录对销售代理可见是可以接受的。


  我建议引入角色层次结构，以包含护士及其经理。然后，使用基于条件的共享规则将项目记录共享给护士，并自动授予其经理访问权限。


