  \ – 车辆预订业务流程图\n\n在你解决完第二个业务流程后，请继续处理第三个。\n\n### 车辆签入\n\nPPA 为此流程共享了两个需求。\n\n- 每个办公室都有多台平板电脑，安装了特定的应用程序，允许客户使用预订期间收到的激活码进行签入。\n\
  \n客户预计将通过输入激活码与办公室的平板电脑进行交互。平板电脑上安装的应用程序应对 Salesforce 进行身份验证，使用激活码查找订单记录，然后更新其状态（或子状态）以指示客户已签入。可能会设置验证以防止提前签入。\n\
  \n在你的解决方案中，你需要解释所使用的集成模式（远程调用）、身份验证机制（OpenID Connect 用户代理流）以及保护传输中数据的安全措施。\n\n>\
  \ **注意**\n> \n> 身份验证本身无法保护传输中的数据（相互身份验证除外）。大多数身份验证标准都要求安全的 HTTPS 连接。但是，对于简单身份验证，这并非强制性。如果简单身份验证在非安全的\
  \ HTTP 连接上进行，则将没有安全措施来保护传输中的数据。您的数据将以明文格式传输，攻击者可以嗅探网络流量并访问您的数据。保护传输中数据最常见的方法是使用单向或双向\
  \ TLS。\n\n花点时间思考在问答环节中可能引入的对该需求的更改。你可以如何增强此流程？一个可能的补充是向当前办公室班次的销售代理人发送推送通知，以告知他们签入情况。这将使流程更加顺畅。这目前不是共享需求，但请做好在问答环节中应对此类补充/更改的准备。\n\
  \n更新你的架构布局图、集成接口列表以及数据模型，添加所需的任何新字段（如子状态），然后继续处理下一条需求。\n\n- 客户签入后，销售代理人可以交出车辆钥匙，并更新预订状态以指示他们已取走钥匙。\n\
  \n你可以假设此过程将手动进行。代理人将搜索预订，验证订单的子状态，然后交出钥匙并手动再次更新订单。问答环节可能会要求进一步自动化。所以，请做好准备。\n\n\
  此流程的业务流程图可如下所示：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_397_0.png)\n\n图 12.8\
  \ – 车辆签入业务流程图\n\n在你解决完第三个业务流程后，请继续处理第四个。\n\n### 车辆签出\n\n将车辆归还至租赁办公室的流程更加简单。这只能由客户亲自完成。请查看第一条需求，如下所示：\n\
  \n当客户归还车辆时，销售代理人应收取钥匙并快速检查车辆。\n\n销售代理人可以使用激活码或客户信息查找与这次租赁相关的订单。但是，检查详情可以存储在哪里？又如何通知技术人员进行重大损坏跟进呢？\n\
  \n这时你需要展示对平台功能的理解。你可以提出一套基于自定义字段和带电子邮件通知的工作流规则的解决方案。但随后你会发现自己在试图解决其他未来挑战，例如以下问题：\n\
  \n- 如何向整个团队发送电子邮件通知？强烈建议你不要提出基于共享邮箱模式的任何解决方案。该模式几十年前是可接受的，但当今企业希望有更加可追踪和可审计的解决方案。\n\
  - 如何确保技术人员正在处理该事件？如果他们不采取行动，将无法生成正确的发票。这将影响你正在解决的主流程。\n- 如果你打算在 Order 对象上引入一组新字段，这将如何影响用户体验？如果你打算为了同样的目的引入一个全新的自定义对象，那么你是否考虑过可能提供所需功能的标准对象？\n\
  \n从技术角度考虑，如果你需要一个管理良好的事件管理流程，用于报告、分配、进度跟踪以及最终解决事件等需求，则应考虑使用 Case 对象。\n\n对于此需求，销售代理人可以创建一个\
  \ case（Sales Cloud 许可证允许这样做），将其与客户的订单关联，并用其提供结构化反馈。如果满足特定条件，case 可以自动分配给该办公室的技术人员队列。一旦\
  \ case 被分配给队列，所有队列成员都将通过电子邮件警报收到通知（此功能可以开启或关闭）。\n\n队列分配还可以授予技术人员对 case 记录的访问权限和可见性。你可以配置升级规则，以确保如果技术人员在指定期间内未采取行动，则会向更高管理层报告该\
  \ case。\n\n这是一个可扩展且灵活的解决方案。评委可以向你发起挑战并即时更改某些需求，但你的解决方案足够灵活，可以处理这些变化。\n\n\n\n\n\n\
  你提出的方案必须为客户带来其他方案可能无法提供的价值。你必须真正地*相信*这一点，不同于那些仅为了达成销售目标而说教的销售人员。你是客户的可信赖顾问；当你提出解决方案时，你必须相信它，并清晰地阐述其价值。否则，你的不确定性会在演示和问答环节体现在你身上，你也无法展现出CTA所期望的自信。\n\
  \n*此信息应发送到ERP，ERP将在72小时后生成客户发票。*\n\nPPA在本地部署了三个ERP，可能位于完全不同的物理位置。你如何将数据从Salesforce传输到正确的ERP系统以生成发票？你如何将像Salesforce这样的云应用程序连接到本地应用程序？\n\
  \n如果你的答案不是*中间件*，那么你很可能正在踏入雷区。在此提出点对点方法可能会导致集成领域的失败。第一个挑战很简单：Salesforce如何连接到防火墙保护后的系统？\n\
  \n提出诸如将ERP移至DMZ（这意味着它基本上暴露在外部世界）等不合理的假设，会打开你不想处理的潘多拉魔盒。做出这样的不合理假设可能会引来评委们更具挑战性的问题，而你可能无法正确回答。\n\
  \n鉴于你的架构中已有MuleSoft，请使用它。如果你还没有它，那么这是一个提出它的充分理由。你也可以建议其他中间件。考虑到此需要一个能够协调与多个系统调用的系统，并且此接口并非旨在处理大量数据，因此ESB是一个合理的选择。\n\
  \n你可以提出任何你熟悉的ESB工具，而不必仅因为MuleSoft是Salesforce产品就坚持使用它。记住，你必须相信你解决方案的价值。在此场景中，根据许多可信来源，你正在提出MuleSoft，因为它是领先的中间件。此外，假设你比其他类似中间件更熟悉它。但请随意提出你认为能提供类似功能且你感到自如的任何工具。\n\
  \n你仍需指定集成模式、身份验证机制以及如何在传输过程中保护数据。在演示中，你可能需要解释MuleSoft将如何与本地解决方案通信。你在*第11章：传播和推广你的解决方案*中遇到了类似的情况。\n\
  \n选择模式时，你需要考虑计划复制到ERP的对象。\n\n根据你提出的数据模型，你可能需要同步*订单*、*订单项*和*案例*对象，假设*账户*和*联系人*表以及像*产品*这样的查找表已经同步。\n\
  \n你认为哪种模式最适合此处？可以使用哪种Salesforce功能以最小的技术负担同步所有三个对象？你可以考虑以下功能和工具：\n\n- **外发消息**：外发消息只能包含来自一个对象的数据。但是，你可以将主对象（此处为`Order`）发送到MuleSoft，请求MuleSoft执行回调以检索其余对象，然后将它们传输到ERP。这是一个你应该列入候选名单的不错选项，尽管它需要在MuleSoft中进行一些定制开发。\n\
  \n- **平台事件**：可以设计为包含来自多个对象的数据。但是，你正处理一个具有一对多关系的对象。除非采用非标准解决方案（例如定义带有JSON内容的长文本字段），否则无法建模一个结合父记录和子记录数据的单个平台事件。由于相关技术挑战（创建JSON结构、填充它以及在另一端解析它），除非万不得已，否则不建议提出这种方法。\n\
  \n- **未来方法**：你可以开发一个Apex调用以调用MuleSoft公开的远程服务并传递数据。考虑到这需要以异步方式发生，你需要使用未来方法（或队列接口）。由于相关技术挑战（额外的定制开发、重试机制、日志机制等），除非万不得已，否则不建议提出这种方法。\n\
  \n- **Salesforce 流**：使用Flows，你可以使用可配置的点击式功能来调用远程Web服务。这听起来不错，但你仍需考虑所需的支持功能，例如重试和日志机制。\n\
  \n- **批量数据同步**：这种方法可能听起来过时，但实施起来轻松，在许多情况下对业务来说已经足够。你可以在MuleSoft中配置一个每小时运行的批量作业，从所有目标对象中选取相关记录，然后按正确顺序将其发送到ERP。这也是最具成本效益的选择之一。\n\
  \n对上述功能的评估取决于你试图解决的用例。例如，在其他用例中，你可能会发现平台事件是最佳选择。\n\n数据同步到ERP后，你可以假设ERP具备在给定时间范围内生成发票所需的一切。更新你的架构图和集成接口列表，然后进入下一个需求。\n\
  \n生成发票后，将向客户发送包含发票金额和结算任何剩余余额说明的通知。\n\n你可以用多种方式解决此需求。你可以假设整个过程都将在平台外进行。ERP生成发票和电子邮件，然后将其发送给客户。\n\
  \n或者，你可以采用完全在平台上的解决方案，其中ERP生成发票及其行项目，MuleSoft将其复制到Salesforce，然后从Salesforce发送包含发票及其详细行项目的电子邮件通知。但是，在这种情况下，你每年需要处理至少1000万张发票以及至少等量的发票行项目，且可能增长50%（假设一半的发票包含两个行项目）。这意味着你需要在LDV策略中考虑新的发票和发票行项目对象。\n\
  \n但是，如果你仔细阅读场景需求，你会注意到需求只是共享发票金额，可能还包含发票编号、开票日期、到期日期和少量其他属性，这些通常包含在发票表头中。\n\n你可以将这些信息存储在与订单相关的自定义对象中，或作为订单本身的属性。只要你能清楚说明为何选择其中一种，两种选择都合理。\n\
  \n相关自定义对象将允许你在需要时存储多张发票，例如预付发票和最终发票。它会在数据模型中增加一个LDV，但只要你准确阐述这种方法的价值，并将此对象纳入LDV缓解策略，这没问题。\n\
  \n记住，没有唯一正确答案。解决问题的方法有很多，但你只需合理证明你的方法，并有扎实的技术理解来支持其相关的优缺点。\n\n将一个新的自定义对象引入数据模型以保存发票表头详细信息。你还需要在ERP和Salesforce之间建立一个新的集成接口来复制数据。一如既往，你需要提供描述接口所需的所有信息。\n\
  \n更新你的数据模型、集成接口列表和架构图，然后进入下一个需求。\n\n销售代理在检查完成后将预订状态更新为关闭。\n\n此事件在时间上早于最后两个需求中提到的事件。然而，这在这里不是问题，因为此需求很容易实现。你只需确保在图表中绘制正确的时间顺序。预计代理将订单上的Sub_Status__c更新为关闭。请确保不要错过这种轻松的得分点。\n\
  \n\n\n\n\n此流程的业务流程图可如下所示：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_402_0.png)\n\
  \n### 图 12.9 – 车辆签出业务流程图\n\n现在您已解决第四个业务流程，请继续处理第五个也是最后一个流程。\n\n### 车辆状态更新与罚金结算\n\
  \nPPA 的汽车中安装了跟踪设备；这些设备通过定期发送 GPS 坐标来追踪车辆位置。设备还会发送额外信息，例如急刹车或超速事件。\n\n您如何称呼配备传感器和其他技术、能够通过互联网与其他设备和服务通信以交换数据的设备？没错，物联网（IoT）设备。\n\
  \n有一些专门为 IoT 设计的身份验证流，例如设备流和资产令牌流（后者更适合不带屏幕的 IoT 设备）。您在第 4 章“核心架构概念：身份和访问管理”中已学习过这两者。\n\
  \nIoT 设备往往以高频率发送小块数据。考虑到任何给定时间连接的 IoT 设备数量，这通常会产生海量数据。\n\n经验法则，Salesforce Core Cloud（又称\
  \ Force.com）不是接收如此大量入站通信的理想平台，也不是长期存储检索数据的最佳场所。\n\n在某些场景下，您仍可能为这一角色推荐 Salesforce\
  \ Core。但如果这样做，您需要仔细计算预期的入站调用次数，并将其与目标组织可能的管理器限制进行比较。更安全的方法是利用平台外解决方案来接收和汇总结果。Salesforce\
  \ Heroku 是此类场景的绝佳选择，尤其是搭配 Apache Kafka on Heroku、Postgres 和 Redis 等附加产品时。\n\n阅读共享需求并开始构建您的解决方案。第一项要求如下：\n\
  \n- 所有跟踪设备均可通过 4G 和 3G 通信。它们每 30 秒发送一次车辆位置。\n\nPPA 拥有 5,000 辆汽车（可以合理假设这一数字将会增长）。跟踪设备每\
  \ 30 秒发送一条消息；出于安全原因，这日夜不停地进行。\n\n这意味着每分钟两条消息，每小时 120 条，每天 2,880 条。总计，所有汽车每天的消息总数为\
  \ 14,400,000 条。即每月超过 4.3 亿条消息。\n\n显然，Salesforce Core 不是处理如此大量呼入操作或创建/更新操作的理想平台。但您仍需进行计算来证明您的理由。这正是您在实际项目中应做的事。\n\
  \n您是一名架构师，不能简单假设会有大量呼入。基于此，我提出以下解决方案。做出合理假设并进行必要的计算；数字是传达毋庸置疑信息的最佳方式。\n\n您还需要记住，PPA\
  \ 已经有一个全球跟踪系统。该系统用于远程控制汽车跟踪设备。这意味着它可用于远程配置设备，这是您可能希望保留的功能。然而，全球跟踪系统更改或修改成本高昂，且无法通过配置进行扩展。\n\
  \n目前为止，您尚未遇到需要扩展该系统的用例。您仍可利用全球跟踪系统接收来自汽车的消息。但请先继续处理流程需求，看看情况是否会改变。下一项要求如下：\n\n-\
  \ PPA 希望收集描述驾驶员行为的信息。\n\n此要求表明需要存储海量数据。此外，还需要分析这些数据以创建有意义的报告和仪表板。PPA 的全球跟踪系统不具备此类能力。它可能能够存储所需数据量，但缺乏创建此类报告和仪表板的适当功能。您需要一个\
  \ BI 工具，例如 Microsoft Power BI、Tableau 或 Salesforce CRM Analytics。\n\n在评审委员会上，您不太可能深入研究每种工具功能的细节。在实际项目中，您会采取不同的做法，届时会有更多时间进行适当的比较，很可能还会结合一些概念验证。\n\
  \n目前，您知道需要将其中一种工具加入架构。也欢迎提出其他类似工具。您仍不清楚哪个平台将存储这些数据，但下一项要求将帮助您做出决定。它如下所示：\n\n- PPA\
  \ 希望使用 GPS 跟踪设备检测可能的车辆盗窃。\n\n此要求描述了基于接收到的 IoT 数据的业务流程。IoT 数据的常见用途是分析数据并检测模式，但也可根据预定义条件和机器状态触发特定操作。它甚至可以更进一步，实现机器对机器（M2M）流程，即一台机器根据特定逻辑确定是时候与另一台机器通信以触发远程事务。\n\
  \n此要求未涉及那么远。但仍需引入自定义逻辑。哪个平台最适合此类逻辑？您可能可以想到四个选项：\n\n- Salesforce Core Cloud：考虑到通信数据量，该选项将被排除。\n\
  - MuleSoft：MuleSoft 可以接收消息并根据自定义逻辑进行处理。但是，它不是处理此类复杂逻辑（需要机器状态处理）的最佳平台。此外，它也不是具有丰富且用户友好型\
  \ UI 的平台。该选项将被排除。\n- PPA 的全球跟踪系统：可以对其进行修改以容纳此逻辑。然而，PPA 已明确表示这是一项昂贵的工作。该选项不理想。\n\
  - 托管在可扩展 PaaS 平台上的自定义开发应用：这可能是托管在 AWS 上的自定义开发应用，或者更合理的是，托管在 Heroku 上（考虑到 Heroku\
  \ 拥有与 Salesforce Core Cloud 和 Salesforce CRM Analytics 的开箱即用连接器）。Heroku 可以成为接收所有\
  \ IoT 设备发送消息的平台。自定义开发应用可以增加处理盗窃检测用例的功能。它还可以在未来扩展以处理其他用例，并且可以以可扩展且可靠的方式做到这一点。此外，Heroku\
  \ Connect 可以轻松在 Heroku 和 Salesforce 之间同步数据。这允许您在检测到盗窃事件后在 Salesforce 中创建案例。案例随后可以分配给正确的队列，进而向队列成员发送电子邮件通知。考虑所有因素，此解决方案听起来是最佳选择。\n\
  \n您现在可以假设已针对上一项要求使用 Salesforce CRM Analytics，并使用标准连接器将数据从 Heroku 传输到 Salesforce\
  \ CRM Analytics。将其添加到您的架构图中，更新集成接口列表，并继续处理下一项要求，如下所示：\n\n- 每天都应检查违规数据库。\n\n您有三个违规数据库。您需要检查每个数据库，并根据其数据执行统一逻辑。哪种工具可以帮助您实现这一点？\n\
  \n开发 Apex 批处理作业来在夜间完成此任务，在问答环节会让您陷入非常棘手的境地。您可能会感到进退维谷，即使您设法修正了解决方案，也可能会丢分。该选项主要提出了一种次优模式，需要大量自定义开发（连接到三个不同端点、异常处理、日志记录和重试机制），而忽略了您架构中已经拥有能够以更好方式完成此工作的中间件。此类错误可能反映出对中间件价值的理解不足。在问答环节被质疑这一点绝非愉快的经历。\n\
  \n使用您的中间件。您可以安排一个 MuleSoft 批处理作业每晚运行，从三个数据库检索记录，执行所需的过滤和查找逻辑，并将数据传输到 ERP 以生成新发票。\n\
  \n请记住完整描述任何新集成接口。此外，更新架构图以反映最新变更。\n\n\n\n\n\n为提高可访问性，此流程的业务流程图已拆分为两个图表。您可以自由合并它们。汽车状态更新流程图如下：\n\
