  图 12.2 – 角色与许可证（初稿）\n\n此时，建议在图表中为不太清晰的主题留下问号。这有助于您以后识别任何差距。\n\n场景还提供了一些有趣的数据，例如5,000辆汽车、每个城市10个办公室、全球一百万注册用户以及年均1000万次汽车租赁。请关注这些数字，因为它们通常会导致一些数据挑战，例如LDV对象。请记下这些数字，将其放在纸张、笔记或表格的最上方，并在设计解决方案时不断核对。\n\
