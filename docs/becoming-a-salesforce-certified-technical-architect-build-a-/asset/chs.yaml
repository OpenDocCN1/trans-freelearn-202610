  \n## 从考试到现实生活——如何培训成为CTA\n\n除了显著的职业提升之外，还有其他几个原因，值得学习如何按照CTA的期望，在Salesforce平台上设计安全、高性能的技术解决方案。\n\
  \n在评审委员会考试期间，你需要执行某些活动（例如创建数据模型图、在多个潜在解决方案之间进行理性选择，以及以故事的方式展示你的解决方案），并以特定的方式思考。这不应被视为通过考试所需的活动，而更应被视为架构师应遵循的最佳实践，以产生交付价值且实现风险更低的解决方案。\n\
  \n\n\n\n\n无论你是否在瞄准 CTA 资格认证，作为架构师，你都会发现可以将本书中的知识应用到日常工作中。获得所有所需领域知识的实操经验的最佳方法是遵循以下简单步骤：\n\
  \n- 1. 将本书中解释的方法论（或其自身变体）应用到日常工作中。付诸实践，你会发现过一段时间它会变得得心应手。这使得你更容易通过评审委员会考试。可以这样说：如果你日复一日地练习，你就会在正常工作时间内为评审委员会考试做准备。\n\
  \n- 2. 搭建实验环境亲手试试各种事物。作为架构师，必须对构成解决方案的不同元素和技术拥有实操经验。这一点在使用 Salesforce 平台时尤为重要，考虑到其所有灵活性，以及它能让你轻松注册几乎无限数量的开发者环境。\n\
  \n没有什么能比得上实操经验。因此，下次你在调查某个特定 **单点登录 (SSO)** 流程如何工作时，不要只阅读相关内容：*搭建一个实验环境*并*密切观察系统之间如何交互*。在评估给定业务挑战的不同潜在解决方案时，将此作为你日常工作的一部分。\n\
  \n- 3. 让自己熟悉记录设计决策的活动。在进行 Salesforce 实施项目时，你会遇到无数存在多个潜在解决方案的情况。让自己熟悉以结构化方式记录每个选项的细节以及其优缺点。\n\
  \n此活动有多种好处，包括帮助你通过将想法写在纸上并与他人分享来组织思路。这增加了选择正确解决方案/方法的机会。此外，它可以帮助你清晰地向项目架构委员会和利益相关者传达可用的不同选项。不仅如此，它还能帮助你记录解决方案；这是你的项目赞助商会欣赏的事情。\n\
  \n这是另一个可以显著帮助你为评审委员会做准备的日常活动示例。虽然你可能不会以现实中那样彻底的方式记录不同的解决方案和权衡，但识别不同的方法、权衡、妥协和风险，并理性地证明特定解决方案的合理性，这正是评审委员会期间对你的期望。\n\
  \n上述提到的实践和技能不应被视为仅为了通过评审委员会考试而学习和掌握的东西；这些是有价值的技能和实践，应该成为你日常例行工作的一部分。当你这样做时，你会发现自己正在变得准备好参加评审委员会考试。CTA\
  \ 证书将简单地成为锦上添花之物，证明你具备所有所需技能，并且知道如何将它们全部付诸实践。\n\n## 考试的性质：一个积分收集练习\n\n了解评审委员会考试的性质将帮助你准备考试，并在演示阶段特别有价值。下表将帮助你揭开此考试某些元素的神秘面纱：\n\
  \n| 主题 | 详情 |\n| --- | --- |\n| 以引人入胜的故事呈现你的解决方案。 | • 你将被要求创建一个端到端解决方案，并将其传达给评委。为此，你需要创建一组交付物，帮助你以引人入胜的故事讲述解决方案。<br>•\
  \ 你的演示应以能吸引听众注意力的方式执行。<br>• 一旦开始演示，试着忘记自己身处评委面前的考场。相反，想象自己坐在场景中提到的公司的一群高管和 CXO 面前。暂时忘记这些评委为\
  \ Salesforce 工作；让自己处于向他们展示解决方案的正确心态和思维中。他们对该平台有扎实的技术知识，并希望了解你计划如何使用它来解决他们的问题。 |\n\
  | 针对所有要求并避免错失易得点。考试是一个积分收集练习。 | • 考试本身就是一个积分收集练习。你通过识别场景中的任何解决方案要求来获得分数。有些要求容易发现并解决。例如，你可能会遇到一个可以通过字段级安全设置来解决的安全要求。不要忽略它，或将其从你即将讲述的解决方案故事中删除。你可能会简单地错失一个易得点。<br>•\
  \ 在问答环节，评委会尝试询问你在演示中未涵盖的要求。这将为你提供第二次机会来涵盖它们。<br>• 请记住，你在问答环节的时间有限，如果你有许多未识别或未解决的要求，那么在涵盖所有要求之前可能会用完时间。这意味着会丢失可能影响结果的宝贵分数。\
  \ |\n| 拥抱问答环节。 | • 许多 CTA 候选人误解了问答环节的目的，并将其视为考试中最具挑战性的部分。但你应该将此阶段视为弥补一些遗漏差距的机会。这是帮助你向世界上最优秀的技术架构师展示你的知识、技能和经验的阶段。<br>•\
  \ 诚然，你将受到挑战，你的知识将受到考验，但这正是你可以向评委展示技能的时刻。<br>• 你必须保持专注，并精确回答。尽量避免重复。记住充分利用问答环节的可用时间。\
  \ |\n| 为场景中的一些变化做准备并预见它们。 | • 在演示过程中，评委可能会决定更改其中一个要求，以检查你快速调整并即时找到解决方案的能力。<br>•\
  \ 因此避免紧张，或假设自己可能犯了错误。请记住保持冷静，因为这是测试的一部分。 |\n| 处理你犯错时的情况；最重要的是你如何处理这种情况。 | • 在演示（或问答环节）中，你可能会发现犯了错误并决定进行调整。这并非灾难。不要失去专注；评委会欣赏你以专业的方式处理此类困难情况并恢复到正轨。<br>•\
  \ 如果你犯了错误，请专业地承认，解释你决策背后的原因，并予以纠正。<br>• 此外，简要说明你在实际项目中将如何处理此类要求。<br>• 然而，请记住，如果你犯多个错误，通过考试的可能性将降低。\
  \ |\n| 让评委知道你在想什么以及你如何做出决策。 | • 评委在场是为了确保你具备使用 Salesforce 平台创建安全、可扩展解决方案的能力。让他们知道你在想什么以及你如何做出决策是件好事。<br><br>•\
  \ 这将帮助他们理解你的逻辑，从而更好地理解做出导致次优解决方案的决策背后的原因。<br><br>• 你将面对的大多数场景都有多种解决方法。需要牢记的关键是，你的解决方案必须基于正确的考量和逻辑。这是\
  \ CTA 必须具备的一项重要技能，即能够思考整体解决方案、识别潜在解决方案，并理性地选择合适的方案。 |\n| 从技术角度争取最佳解决方案。 | • 你提出的解决方案应是你能从技术角度想到的最佳方案。你不应假设存在场景中未直接或间接提及的挑战。<br><br>•\
  \ 例如，不要因为担心客户可能面临预算挑战而选择次优解决方案；只有当场景本身提及时才这样做。 |\n| 提升你的沟通技巧。 | • 请始终牢记，你给出的解决方案必须基于给定的要求进行呈现。<br><br>•\
  \ 记住，你应该向客户公司的 CXO 做演示，并将解决方案与要求联系起来。<br><br>• 这将吸引听众，并使整体画面更加清晰。你将在本书后面章节中遇到多个此类示例。\
  \ |\n\n表 1.2 – 了解考试的性质\n\n既然你了解了评审委员会考试的性质，让我们来学习和探索你需要创建的交付物，以便为假设场景获得解决方案。\n\n\
  \n\n\n\n## 你需要生成哪些工件及其原因\n\nSalesforce 架构师始终致力于创建安全且可扩展、满足所有所需功能的解决方案。此外，架构师还应确保解决方案的文档以一种能够有效向利益相关者传达的方式编写。这既适用于评审委员会，也适用于处理真实实施项目。\n\
  \n**架构图**是包含在架构中的一组概念的图形表示。它们在软件架构中被广泛使用，当被有效使用时，可以成为记录和传达解决方案的通用语言。\n\n根据经验，在创建架构图时通常存在一些差异。它们可能不一致、碎片化或缺少某些细节。在几种情况下，这些差异可以追溯到对**架构描述语言**（例如，统一建模语言）的误用，或者在某些情况下，完全未使用任何标准。有时，这是由于误解了图表的价值并依赖不当或不一致的指南，而在某些情况下，则是缺乏架构教育。\n\
  \n要描述你的 Salesforce 技术解决方案架构，你需要以下工件：\n\n- 必备项（强制性工件）：\n  - 参与者和许可证\n  - 数据模型图\n\
  \  - 系统架构图\n  - 角色层级\n  - 开发生命周期图\n\n- 可选但有益项（选项但有利）：\n  - 流程图（在真实项目中，这被视为必备项）\n\
  \  - 上下文 SSO 流\n\n- 其他图表，例如数据流图、思维导图等等\n\n> **注意**\n> \n> 你可以使用以下一种或多种工具交付你的工件/图表：\n\
  > \n> - PowerPoint 演示文稿/Google 幻灯片、表格、文档（虚拟）\n> - 翻页图表/手绘扫描图像（虚拟）\n> - 白板（此项不可携带）\n\
  > - 以上工具的组合\n> \n> 没有正确的工具。你需要培养自己的习惯，并使用对你最有效的工具。\n\n关于这些图表，有几点需要牢记：\n\n- **确保质量**：在评审委员会考试中，你有非常有限的时间来构建解决方案并创建你的工件。你的图表质量需要足够。在创建工件和图表时，请牢记这条黄金法则：它们必须值得呈现给\
  \ CXO。在评审委员会考试中，请确保图表可读、可理解、传达正确信息，并反映你对细节的专业关注。\n\n- **使用最适合你技能的工具**：有些架构师在使用 PowerPoint\
  \ 时更得心应手，而另一些人则更擅长手绘图表。避免感到受限，选择最适合你且你最感到舒适的工具。\n\n- **根据场景选择工具**：某些工具更适合特定图表。例如，某些图表如果在交互式环境中绘制，说明效果会更好。例如，观众可以看到图表在他们面前被创建，并将其与你讲述的故事联系起来。\n\
  \n一个很好的例子是 SSO 序列图。但是，其他图表更适合预先绘制，因为创建它们需要大量时间，例如数据模型图。在这里，你需要为正确的图表选择正确的工具（你还必须考虑你计划如何设置你的评审委员会，是线下还是虚拟）。\n\
  \n对于线下评审委员会，白板更适合交互式绘制的图表。翻页图表和 PowerPoint 演示文稿更适合预先绘制的图表和工件。\n\n现在，在下一部分中详细了解每个工件。\n\
  \n## 参与者和许可证图表\n\n该图表的重要性源于根据每组用户预期的具体用例，向利益相关者清晰传达所需的 Salesforce、功能和第三方许可证的需求。该图表将帮助你实现以下目标：\n\
  \n1. 识别每个参与者的关键用例。这将帮助你确定要使用的正确许可证。\n\n2. 清晰传达每个参与者在你的解决方案中的角色。在现实世界中，这也应该帮助你计算所需的许可证、功能许可证或第三方许可证的数量。此外，记录每个角色的范围将帮助你回答常见问题，即这些用户预期要做什么？随着时间的推移，这个问题往往会变得更难回答。\n\
  \n对于此图表，你需要考虑以下事项：\n\n1. 包含场景中提到的所有参与者。\n\n2. 包含所有所需的许可证，包括功能和第三方许可证。对 Community\
  \ 许可证格外小心。你需要了解每种 Salesforce 许可证类型的功能和限制。\n\n3. 选择最合理的技术解决方案（就许可证而言）。避免任何旨在削减成本的非标准方法。避免任何可能违反\
  \ Salesforce 条款和条件的模式。\n\n4. 这不一定要是图表。它可以只是一个表格。但标准参与者和用例图表非常适合上述目的。由于时间限制，你可能会发现用翻页图表或纸张绘制这个图表比使用\
  \ PowerPoint 创建它更容易。或者，你可以将此工件作为参与者和许可证的要点列表，以及活动或用例的子列表来创建。\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_42_0.png)\n\
  \n现在，让我们看一个示例。以下简化的参与者和许可证图表说明了三种不同角色相关的活动或用例，以及每个角色所需的许可证：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_43_0.png)\n\
  \n图 1.3 – 参与者和许可证图表\n\n如果选择一个许可证而非另一个许可证没有明确原因，请将你决策背后的额理由添加到图表/文档中。这将帮助评委（或在现实生活中，利益相关者）进一步理解你的愿景和决策背后的驱动因素。\n\
  \n## 数据模型图\n\n数据模型图是你需要创建的最关键的图表之一。你需要它来恰当地解释你的解决方案，无论是在考试中还是在现实生活中。该图表将帮助你完成以下任务：\n\
  \n- 识别你的解决方案中使用的自定义和标准对象。请记住，标准对象带有预构建的功能和限制，而自定义对象有不同的考虑因素（例如，某些许可证限制了它们可以访问的自定义对象的数量）。同时，请记住标准对象访问取决于所使用的许可证，因此你应该确保数据模型与所选的许可证相匹配。这个图表将帮助你识别和传达你的数据模型以及每个对象的计划用途。\n\
  \n- 识别**大数据量 (LDV)** 对象。虽然识别 LDV 需要的不止是数据模型（它需要基于给定场景进行计算），但拥有一个文档完善的数据模型可以帮助你识别问题可能出现的地方以及数据可能增长更快的地方（例如，联结对象），这可以帮助你制定缓解策略。\n\
  \n- 这个图表对于共享和可见性要求也至关重要。记录所有权以及对象之间的关系类型直接影响记录的可见性。没有一个你能一目了然的图表，这很难轻易识别。\n\n- 你的数据模型直接影响你的报告策略。通过查看这个图表，你应该能够告诉特定报告所需的数据应该来自哪里。\n\
  \n- 在不了解基础数据模型的情况下，你无法制定稳健的集成策略。\n\n这个图表应包括以下内容：\n\n- 关系类型（主从关系 versus 查找关系）。\n\
  - 基数（一对多、多对多等等）。\n- 对象类型（标准对象 versus 自定义对象 versus 外部对象）。\n- 所有权详情（拥有特定对象类型记录的参与者）。\n\
  - **组织范围默认值 (OWD)** 每个对象。\n- 必须突出 LDV 对象，尽管你必须为此做数学计算（将这些内容放在图表中的某个位置是一个良好的做法）。\n\
  - 可选地，你可以包括相关对象的记录类型详情。\n- 对于评审委员会考试，逻辑数据模型级别应该足够了（显示每个对象的关键字段）。在现实生活中，你必须创建物理级数据模型（显示所有字段）。\n\
  \n\n\n\n\n现在，请看一个示例。简化的数据模型显示了一组标准对象和自定义对象之间的关系：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_45_0.png)\n\
  \n图 1.4 – 数据模型图示例\n\n高亮显示每种对象类型的记录所有者，有助于阐明您共享和可见性策略的一部分。为图表添加图例以进行说明，也会是一个专业的加分项。\n\
  \n## 系统架构图\n\n系统架构图将帮助您阐明解决方案中包含的系统以及这些系统之间的关系。这一点至关重要，因为您最终很可能会创建一个跨越多个系统的集成解决方案。该图还将帮助您识别并记录有关集成接口的高级信息。这将是描述数据如何在系统间流动的主图（除非您决定创建数据流图）。\n\
  \n> **注意**\n> \n> 您创建所有这些制品是为了帮助向受众解释端到端解决方案。了解为何需要每个图表以及如何使用它非常重要。如果您不确定是否要使用某个图表，请避免创建它。\n\
  \n对于此图，您需要执行以下操作：\n\n- 显示架构中涉及的所有系统（包括第三方，例如 AppExchange 产品或外部系统）。在实际工作中，您可能还希望扩展系统架构，以包含每个系统提供的关键功能。在评审会上，添加所有关键功能可能会花费比您可分配更多的时间。\n\
  - 包括您计划完全/部分退役的系统。找到一种方法将它们与您想要添加或保留的其他系统区分开来。颜色编码是一个好主意，但您可以简单地在系统旁边添加一个符号来指示其状态。在实际工作中，您可能会创建此图表的多个副本，每个副本代表一个时间点。\n\
  - 显示拟议的集成接口。您还需要包含集成模式、计划如何保护通道以及使用的身份验证标准等信息。您可以将此信息直接添加到图表中，但这可能会使图表显得笨拙。或者，您可以在图表中使用接口参考/代码，并创建一个包含完整详细信息的支持表格。然后，您可以在评审会上同时使用它们来解释您的集成策略。\n\
  - 请记得包含 SSO 接口。您还可以包含架构中涉及的任何移动设备。在其旁边添加移动应用的类型（Salesforce 移动应用、原生自定义应用、混合应用或基于\
  \ HTML5 的应用）。\n\n现在，请看一个示例。图 1.5 显示了 Salesforce 正在替换旧版 CRM 的架构中涉及的系统。您还会注意到，它通过一些集成中间件（MuleSoft）与外部系统集成：\n\
  \n![](img/a3b1eecf3c87c814267f2877e8a8be1a_47_0.png)\n\n图 1.5 – 系统架构图示例\n\n图 1.6\
