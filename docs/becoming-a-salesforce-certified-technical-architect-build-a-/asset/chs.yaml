  \ | Salesforce Mobile -> Salesforce | 数据 | 数据同步 – 阻塞 | 使用 Salesforce 移动应用访问 Salesforce\
  \ 中的账户、联系人和订单对象。 | HTTPS (单向 SSL/TLS) | Open ID Connect 用户代理流 |\n| SSO-000 | Active\
  \ Directory -> Ping -> Salesforce | 数据 | 数据同步 – 异步 | AD 中新预配的用户通过 Ping 同步到 Salesforce。\
  \ | HTTPS (单向 SSL/TLS) | Open ID Connect Web 服务器流 |\n| SSO-001 | 针对 Salesforce 用户的单点登录。Ping\
