  \nPPA共享了五个关键业务流程，即客户注册、汽车预订、汽车办理入住、汽车办理退房以及汽车状态更新和罚金结算。场景的这部分通常包含最重要的需求部分。强烈建议您为每个流程创建业务流程图。这将帮助您发现解决方案中的棘手部分，并且还能为您在演示期间提供一个引人入胜且有吸引力的工具。现在，从第一个共享业务流程开始。\n\
  \n### 客户注册\n\nPPA为客户注册流程共享了五项关键需求。您可能已经注意到，但“可访问性和安全性需求”部分中的一些要求可能会为该流程增加更多需求。这就是为什么增量解决方案开发过程特别有用，以确保您不会意外遗漏任何需求。\n\
  \n从该流程的第一个需求开始。\n\n客户应能够使用在线门户和移动应用程序进行自助注册。\n\n在Salesforce社区中可以轻松启用自助注册。但是，此需求提出了两个主要问题：\n\
  \n- 需要哪种社区许可证类型？\n- 移动应用程序的正确策略是什么？\n\n这是一个与客户相关的需求，因此您应在“客户社区”和“客户社区Plus”许可证之间进行选择。到目前为止，您尚未遇到任何会将您引向“客户社区Plus”许可证的可访问性需求。因此，目前最好坚持使用“客户社区”许可证，并在需要时进行修改。\n\
  \n> **注意**\n>\n> 角色名称不一定映射到拟议许可证的名称。例如，合作伙伴角色不一定映射到“合作伙伴社区”许可证，在某些场景中，使用“客户社区Plus”许可证可能更合适。您必须充分理解共享需求，并相应选择拟议的许可证类型。\n\
  \n“客户社区”许可证更适合处理大量最终客户，而“客户社区Plus”许可证则更适合需要复杂共享机制的用例。\n\n您还应指定是使用指定用户许可证还是按登录计费许可证。您没有需求来帮助您决定，因此需要做出假设。例如，您可以假设客户不会频繁登录，因此Salesforce客户社区登录许可证应该是理想选择。\n\
  \n这就解决了需求的前半部分。接下来，您需要确定正确的移动策略。有几种选择。如您在第5章“开发可扩展系统架构”中所学，可能的选项包括Salesforce移动应用（带或不带Mobile\
  \ Publisher）、原生应用、混合应用或HTML5应用。\n\n您目前了解的场景需求可以使用所有这些选项来实现。因此，请使用最易于开发和部署的选项，即可以节省开发工作并专注于向客户交付价值的选项。Salesforce\
  \ Mobile Publisher可用于创建和部署Salesforce社区的品牌化移动应用。\n\n但是，Salesforce Mobile Publisher是最具成本效益的选项吗？如果您不考虑上市时间和投资回报率计算，那么答案可能是否定的。在评审委员会上，您应该寻找最佳技术解决方案（基于最佳实践和专家判断）。在此情况下，建议使用Salesforce\
  \ Mobile Publisher是合理的。\n\n更新您的环境架构图和角色与许可证图，然后转到下一个需求。\n\n销售代理还可以注册走进PPA办公室的新客户。\n\
  \n这是Salesforce中的开箱即用功能。销售代理可以简单地为客户创建个人账户（或单独的账户和联系人；但在这种情况下，个人账户更合适），然后为其启用客户社区用户。这是一个容易得分的点；请不要在演示中未能识别或解决此类需求。现在，转到下一个需求。\n\
  \n注册客户时必须捕获以下信息。\n\n同样，这是一个容易得分的点。您只需提到注册时将捕获这些字段，并将其设为必填项，以确保始终输入值。联系人对象上没有标准字段来保存驾驶执照值，因此您需要将其作为自定义字段引入。\n\
  \n您需要说明该字段是自定义字段；这样才能确保您捕获该问题的得分。请务必不要错失这样容易得分的点！\n\n建议将所有自定义字段添加到数据模型中。这通常不是数据模型逻辑层面的内容，但对评审委员会特别有用。这样可以确保即使您在演示中未提及自定义字段，仍然可以得分。您的图表将替您回答问题。\n\
  \n创建或更新您的数据模型图，然后转到下一个需求。\n\n客户还必须接受PPA的隐私条款和条件。\n\nSalesforce引入了个人对象，作为丰富的同意管理对象集的一部分。当您遇到同意管理需求时，需要考虑利用标准对象来满足它。在大多数情况下，您不需要引入任何额外的自定义对象或字段。您只需确保熟悉每个标准同意管理对象的用法即可。\n\
  \n> **注意**\n>\n> 完整描述可在以下链接中找到：https://pactt.link/Q13t.Y。\n\n\n\n\n\n在这种情况下，您可以使用个人、联系点类型同意和数据用途对象。更新您的数据模型图，然后进入下一个要求。\n\
  \n必须使用国家驾驶员和车辆许可机构服务实时检查驾照有效性。\n\n此要求包含两个挑战：\n\n- 您如何在客户自注册过程中实现所需功能？\n- 您如何为为现场客户登记的销售代理实现所需功能？\n\
  \n为满足此要求，您需要设计与国家机构服务的集成接口。您可以假设该机构拥有公开可访问的 API。不过，您仍需决定使用哪种集成模式、该接口如何工作、是否需要中间件，以及如何处理身份验证和数据安全性。\n\
  \n“实时”一词应能为您提供关于集成模式的提示。所需模式应在远程系统中调用逻辑、实时获取结果并将其返回给调用者。听起来很熟悉？确实如此，因为这正是远程进程调用–请求和应答模式所要讲述的内容。\n\
  \n您知道此模式需要由调用者触发，然后等待响应。在在线自注册表单中，可以通过多种方式实现，例如在单击提交按钮时调用远程服务。您将不得不使用自定义注册页面，从而控制其所有行为。\n\
  \n您需要为销售代理引入不同的机制，因为他们将使用标准 Salesforce UI。您可以引入一个自定义验证驾照操作，触发 Salesforce 屏幕流。反过来，Flow\
  \ 可以使用 Salesforce 外部服务来调用远程 Web 服务并获取结果。\n\n即使对于如此简单的要求，中间件也能增加价值，因为它可以处理所需的任何重试机制。此外，它为\
  \ Salesforce 提供了一个统一的通信接口。幕后，它根据驾照签发国家与相应的国家机构通信。您可以假设此中间件是 MuleSoft。\n\n从 Salesforce\
  \ 到 MuleSoft 的身份验证应始终使用常见身份验证标准之一，例如 OAuth 2.0。您可以使用 Web 服务器身份验证流（首次使用，随后使用刷新令牌流）或\
  \ JWT 流。在两种情况下，数据在传输过程中将通过 Salesforce 和 MuleSoft 之间的双向 TLS 以及 MuleSoft 与机构 Web 服务之间的单向\
  \ TLS 进行保护，因为您可以安全地假设，您对机构网络安全性的控制不足，无法要求托管您的 MuleSoft 实例的数字证书。\n\n从中间件到机构 Web 服务的身份验证取决于机构本身。您可以假设机构\
  \ Web 服务仅支持简单身份验证（用户名/密码）。\n\n更新您的架构版图和集成接口列表。在此阶段，您还应创建第一个业务流程图。这将在演示期间为您提供很大帮助。它可能如下所示：\n\
  \n![](img/a3b1eecf3c87c814267f2877e8a8be1a_390_0.png)\n\n图 12.4 – 客户注册业务流程图\n\n\
  您可以根据需要向流程添加尽可能多的详细信息。只需记住，这将是您在演示期间讲述故事的工具。在现实生活中，此图很可能会变得更详细。\n\n现在您已解决第一个业务流程，请进入第二个。\n\
  \n### 车辆预订\n\nPPA 共享了三种车辆预订流程模式：第一种是通过在线服务（在线门户和移动应用程序），第二种是通过呼叫中心，第三种是通过亲自访问 PPA\
  \ 分支机构。\n\n从车辆预订流程的第一个要求开始。\n\n客户应能够输入取车地点（城市）和开始及结束日期。\n\n系统应显示该地点和时间点可用车辆列表。这将需要自定义\
  \ Visualforce 页面或 Lightning 组件。页面将根据给定参数查询可用车辆并显示结果。您这里漏掉了什么吗？实际上，是的。\n\n您需要考虑端到端解决方案。作为本项目的首席架构师，这是您的职责。候选人可能犯下的最大错误之一，就是假设其他人会处理此事。您需要考虑以下挑战：\n\
  \n- 将使用哪个对象来表示汽车？\n- 您将如何维护汽车的可用性？\n- 您将如何按地点组织汽车？\n- 哪些可访问性设置将允许客户查看汽车？\n\n> 注意\n\
  >\n> 认为准备 CTA 审查委员会的方式是参与更多预售活动，这是一种常见的误解。预售活动将显著提升您的沟通技巧，但仅此还不够。\n>\n> 从事预售活动时，您很少会深入到本场景中所需的细节程度。要通过\
  \ CTA 审查委员会，这种细节程度是必不可少的。您需要拥有广博的知识、顾问思维、硬核的技术深度以及丰富的软技能。将预售活动与硬核的日常实施工作相结合，将显著加速您的学习曲线。\n\
  \n您可以使用任何标准对象来表示汽车吗？考虑到产品对象还与您可能用于车辆预订的订单对象相关联，因此它是一个明显的选择。您可以利用价目表对象按地点对汽车进行分组。\n\
  \n定价无论如何都将由 PPA 的全球计算器应用程序处理（您将在下一个要求中了解更多相关信息）。您也可以使用自定义对象，但在这种情况下，您可能需要对订单对象进行一些调整。\n\
  \n您的产品和价目表必须对客户可见。直到 Salesforce Spring '22 版本发布之前，产品对象没有 OWD 设置，因为它们由价目表控制，但情况已经改变，您现在可以为\
  \ **产品** 配置 **OWD** 。**价目表** 具有特殊的 **OWD** 设置和共享机制。您可以从 **价目表** 页面手动将 **价目表** 对象共享给所有门户用户（目前仅受\
  \ Classic 支持）。由于易于维护，通过面向门户用户的 **价目表** 共享 **产品** 是本场景将使用的选项。\n\n最后，页面将需要使用订单对象的\
  \ **订单开始日期** (**EffectiveDate**) 和 **订单结束日期** (**EndDate**) 字段来确定给定期间内汽车的可用性。\n\n\
  更新您的数据模型图，并按如下所示进入下一个要求。\n\n### *系统应计算并显示每辆汽车租赁的价格。*\n\nPPA 已拥有一个特定应用程序，用于根据给定参数计算每辆汽车的价格。您需要与该解决方案集成，传递正确的参数，然后在\
  \ Visualforce 页面/Lightning 组件上显示结果。这是一个新的集成接口。您现在熟悉解决方案中每个集成接口所需的详细信息。该模式是 **远程进程调用**：**请求**\
  \ 和 **应答**，因为您在进行下一步（即向客户显示结果）之前需要响应。\n\n如果评委决定将计算器应用程序从架构中移除，您的策略是什么？您将如何处理此要求？为这类挑战做好准备，因为它们可能在问答环节中提出。\n\
  \n目前，请更新您的架构版图和接口列表。然后进入下一个要求。\n\n### *客户应选择所需的汽车并继续进行在线支付。*\n\n您应该能够构建到支付网关的集成，或使用开箱即用提供该功能的产品。从技术角度来看，后者是正确的解决方案，因为它节省了您的时间和精力。此外，经过实战检验的产品通常比自定义解决方案更可靠。\n\
  \n您仍然需要解释产品的工作原理（高层级）以及它将如何以 PCI 合规的方式收集支付详细信息。毕竟，这将是客户在现实场景中首先询问的问题。\n\n请尽量记住一些提供此功能的\
  \ ISV 产品名称，例如 **Bluefin** 和 **Chargent** 。更新您的架构版图，然后按如下所示进入下一个要求。\n\n### *一旦收到付款，交易即被视为完成。*\n\
  \n一旦收到付款，Bluefin 可以创建与订单相关的支付记录（自定义对象）。反过来，这可以触发 Salesforce **Flow** ，更新订单状态为完成，并向客户发送电子邮件通知。\n\
  \n\n\n\n\n将使用“订单开始日期”和“订单结束日期”字段来确定车辆的可用性。\n\n所有需求是否都已覆盖？实际上，还有一个次要需求被遗漏了。作为首席架构师，你需要提供包含所有必需细节的端到端解决方案。你需要解释激活码将如何创建并包含在电子邮件通知中。\n\
  \n这可以简单地是在 Order 对象上的一个自定义字段，其值为全局唯一标识符 (GUID)，在将订单状态更新为完成之前，使用 Apex 触发器生成并填充。\n\
  \n一旦该值填充到该字段中，你就可以使用合并字段将该字段的值包含在电子邮件通知中。创建的订单将链接到客户的人员账户，其余电子邮件通知值（如名、姓等）可从此处获取。现在，更新你的数据模型，它应如下所示：\n\
