  \ Future 方法或 Queueable Apex 以避免混合 DML 异常。创建 Community 用户后，客户将收到一封确认注册的通知电子邮件，并可以使用设置的密码登录。\n\
  \n呼叫中心的支持代理也将获得相同的体验。但是，他们将使用不同的 UI。支持代理将使用标准 Salesforce UI 来创建 Person 帐户、Individual\
