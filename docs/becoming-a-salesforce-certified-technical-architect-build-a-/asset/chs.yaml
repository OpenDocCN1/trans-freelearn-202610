  \n分销商的车队经理将定期按制造商 ID 更新每台设备的库存状态。\n\n大部分内容在以前的解决方案中已经涵盖。但是，请确保完整阅读要求。不要冒跳过要求的风险，从而错失宝贵的分数。你的提议解决方案可能如下：\n\
  \n要求的第一部分已通过我们引入的新自定义对象实现。将使用字段级安全性授予分销商车队经理对这些对象状态字段的读写权限。此外，我已经提到发货对象将使用主/详细关系链接到订单。这意味着记录将对所有有权访问订单记录的合作伙伴用户可见。\n\
  \n为将这些值同步回库存管理系统，我将利用另一个 MuleSoft 计划的批处理作业。我假设它将每小时运行一次，并且该延迟对业务来说是可以接受的。该接口将把更改的发货行项目状态复制回库存管理系统。这将是另一个利用批量数据同步模式的接口。\n\
  \n我考虑过使用平台事件或更改数据捕获 (CDC) 来将更改的数据从 Salesforce 发送到 MuleSoft。但我更倾向于使用计划批处理，以确保将所有更改交付到库存管理系统的一致性，尤其是因为没有共享要求表明需要近实时数据同步。考虑到我们已经有一个向相反方向运行的类似接口，此接口也更容易构建。\n\
  \n此接口也将使用与发货同步接口相同的授权和安全机制。\n\n这是最后一个共享 PME 要求。你可以更新所有图表并查看它们的效果。\n\n这是景观架构图：\n\n\
