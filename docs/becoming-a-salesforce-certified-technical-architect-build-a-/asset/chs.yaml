  您的格局应保持简单，如下所示：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_222_0.png)\n\n图 6.7\
  \ – 格局架构（初稿）\n\n**注意**\n\n在格局架构图中，您也可以使用术语`Force.com`来描述Salesforce Core Cloud。术语**客户360平台**不仅仅包含`Force.com`平台。建议使用Salesforce\
  \ Core Cloud术语，因为不同Salesforce云和跨云解决方案在不断增加，该术语作为描述听起来更精确。\n\n现在，继续下一段，该段以以下行开头：\n\
  \n### *服务部门组织为两个主要产品线。*\n\n本段及其后的项目符号点描述了服务部门的组织图。请相应地更新您的角色层次结构。陈述`Each product\
  \ line has multiple teams of service specialists`（可能多达25个不同的团队）……它们按其支持的不同产品类别组织，例如软件服务器、软件云和硬件桌面。专家可以在多个团队中工作。团队通常包含约30名专家。这尤其有趣，因为它描述了一种角色层次结构不太支持的工作方式。您有用户可能属于多个团队。\n\
  \n用户在特定时间只能拥有一个角色。考虑到您在此处讨论的是*服务部门*，可以合理假设这些用户将主要处理案例对象。此时仍没有明确要求，但假设是合理的。基于该假设，您可以考虑两种可能的开箱即用功能，即案例团队和队列。还有其他可使用的功能，如公共组，但到目前为止，您对要求缺乏足够细节。\n\
  \n在转向编程解决方案之前，您必须耗尽可配置的潜在功能。记下您认为可能使用的功能。这两种功能（案例团队和队列）通常不属于您在*第1章，开始您的CTA之旅*中涵盖的工件。然而，您仍需要将其纳入演示中，即使只是一个简单的陈述。确保您没有遗漏任何要求，因为它们都很重要。\n\
  \n\n\n\n\n再次，根据你的最新设计更新你的笔记和草图。 “500名呼叫中心客服，负责接听客户电话并创建支持工单。他们需要查看所有产品线上的客户记录、服务协议和案例”\
  \ 这些陈述也很有意思，因为它们清晰地描述了呼叫中心客服的可见性需求。这是组织结构图与角色层级不匹配的一个很好的例子。要查看两个产品线的记录，呼叫中心客服必须属于一个位于服务EVP正下方、产品线SVP正上方的角色。这不太可能与组织结构图匹配，但请记住，你正在使用Salesforce角色来梳理记录可见性，而不是复制组织结构图。\n\
