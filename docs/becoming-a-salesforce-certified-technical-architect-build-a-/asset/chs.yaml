  规范化数据集与非规范化数据集的区别可以总结如下：


  - 规范化过程依赖于将数据拆分到多个表中。其目的是减少数据冗余并提高一致性和数据完整性。另一方面，非规范化依赖于合并数据以加快检索过程。在 Salesforce
  中，它还可用于减少数据存储并减少大数据量（LDV）对象的大小。尽管如此，这在其他数据库中并非常见优势。

  - 规范化通常用于**在线事务处理（OLTP）**系统，其中插入、删除和更新操作的速度是关键。另一方面，非规范化用于**在线分析处理（OLAP）**，其中查询速度和分析是关键。

  - 与规范化数据集不同，在非规范化数据集中很难维护数据完整性。

  - 非规范化会增加数据冗余。

  - 与规范化相比，非规范化过程减少了表的数量和潜在的连接语句，而规范化会同时增加这两者。

  - 通常，非规范化数据集占用更多的磁盘存储。如前所述，在 Salesforce 中这不一定成立。


  标准 Salesforce 数据模型默认采用规范化形式。为了进一步理解规范化过程，你需要了解三种主要的不同规范范式。


  ## 规范范式


  如前所述，规范化旨在根据数据库中数据的关系高效地安排数据。数据规范化有三种常见形式。接下来逐一探讨。


  ### 第一范式（1NF）


  如果数据库满足以下条件，则被视为第一范式：


  - **仅包含原子值**：原子值是不可分割的值。例如，在下图中，`Phone Number` 列的值可以分为三个不同的电话号码。因此，它不属于第一范式（非 1NF）：


  #### 表 1


  | 客户 ID | 电话号码 |

  |---|---|

  | 1 | 0794312000, 021432000, 0914312000 |

  | 2 | 0912239382 |

  | 3 | 0773322000,0214332000 |


  图 2.5 – 表 1，不符合第一范式（1NF）


  - 不存在重复组：这意味着表不包含两个或多个字段/列，这些字段/列表示同一数据实体的多个值。例如，在下图中，你可以看到电话号码 1、电话号码 2 和电话号码 3
  字段表示同一数据实体（即电话号码）的多个值。因此，该表不属于 1NF：


  #### 表 2


  | 客户 ID | 电话号码 1 | 电话号码 2 | 电话号码 3 |

  |---|---|---|---|

  | 1 | 0794312000 | 021432000 | 0914312000 |

  | 2 | 0912239382 | | |

  | 3 | 0773322000 | 0214332000 | |


  图 2.6 – 表 2，不符合第一范式（1NF）


  要将图 2.5 中的表转换为 1NF，必须将其拆分为以下两个表：


  #### 表 3


  | 客户 ID | 电话 ID |

  |---|---|

  | 1 | 1 |

  | 1 | 2 |

  | 1 | 3 |

  | 2 | 4 |

  | 3 | 5 |

  | 3 | 6 |


  | 电话 ID | 电话号码 |

  |---|---|

  | 1 | 0794312000 |

  | 2 | 021432000 |

  | 3 | 0914312000 |

  | 4 | 0912239382 |

  | 5 | 0773322000 |

  | 6 | 0214332000 |


  图 2.7 – 图 2.5 中表 1 修改后以符合第一范式（1NF）


  ### 第二范式（2NF）


  如果数据库满足以下条件，则被视为第二范式：


  - 它属于 1NF。

  - 非键属性取决于主键。这尤其适用于你拥有复合键的情况。（在 Salesforce 中，ID 字段始终是主 ID。没有使用复合键，这意味着此条件始终满足。）例如，以下表不属于
  2NF，因为地址城市依赖于复合键（即站点 ID）的一个子集。这一点在第二行和第四行中可以清楚地看到。因此，该表不属于 2NF：


  | 客户 ID | 站点 ID | 地址城市 |

  | :--- | :--- | :--- |

  | 1 | 1 | San Francisco |

  | 2 | 3 | London |

  | 3 | 5 | Los Angeles |

  | 4 | 3 | London |


  图 2.8 – 不符合第二范式（2NF）的表


