  \n图 6.8 – 参与者图（初稿）\n\n你的角色层级应如下所示：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_224_0.png)\n\
  \n图 6.9 – 角色层级（第二稿）\n\n未对景观架构图进行任何更改。\n\n> **注意**\n> 请注意，尽管这个小型场景侧重于安全领域，但你仍然需要生成《第\
  \ 1 章，以 CTA 身份开始你的旅程》中涵盖的标准工件集，以端到端地描述你的解决方案。\n\n现在，转到下一段，该段以以下行开头：\n\n_PIR 对当前设置有顾虑。_\n\
  \n有两个具体的需求。PIR 期望你作为架构师，提出一个共享和可见性架构，以解决他们报告的问题。他们还计划为客户提供自助服务，这表明你可能需要一个客户社区。\n\
  \n请记住这一点，更新你的景观架构图和参与者及许可图，然后继续处理 PIR 共享的长需求列表。\n\n## 深入探讨共享需求\n\nPIR 共享了一组需求。你将逐一审查每个需求，制定拟议解决方案，并相应更新你的图表。从第一个需求开始：\n\
  \n- *销售部门的用户只能访问其本人或其下属拥有的账户。*\n\n若要限制账户记录的可见性，你需要使用 OWD。在此情况下，账户应设置为私有。这样可以确保账户记录仅对拥有它们的用户以及该用户在角色层级中的上级可见。更新你的数据模型图，以指明账户对象的\
  \ OWD 现在为私有。\n\n- *直销报告应从整个销售组织汇总到全球销售 EVP。渠道销售报告应汇总到全球销售 EVP。*\n\n拟议的角色层级已满足此要求。这意味着你对角色层级这部分的最初设想是正确的。图表中无需更改任何内容。\n\
  \n- *服务部门报告应按产品线汇总。*\n\n角色层级也满足了此要求。这是一个很好的例子，说明一张精心制作的图表可以帮助你回答演示过程中提出的问题。\n\n\
  > **注意**\n>\n> 在展示你的解决方案时，使用你创建的工件来讲述故事。你的演示必须引人入胜且具有吸引力。工件是你应该用来传递信息并讲述你对端到端解决方案看法的引人入胜的故事的工具。使用你的图表，指向它们，并帮助听众跟随你并理解你的愿景。\n\
  >\n> 例如，不要只说此要求由拟议的角色层级满足。在这样做时，使用图表，并直接指向满足该要求的角色层级分支/路径。\n\n现在，转到下一个需求。\n\n- *呼叫中心客服可以代表客户创建案例。*\n\
  \n此要求通过授予呼叫中心客服创建案例的正确许可来满足。之前假设他们将使用 Service Cloud 许可，这满足了该要求，并允许用户使用权益对象，该对象被列为\
  \ PIR 使用的对象之一。\n\n- *专家团队可以处理一个或多个案例子类型。*\n\n为了进一步理解此要求，你需要查看下一个要求，其中包含以下详细信息：\n\
  \n只有处理案例的专家团队以及层级中位于他们上方的人员才能查看该案例。案例创建后，会根据案例的类型和子类型分配给专业团队的一名成员。\n\n在提出解决方案之前，应将这些要求综合考虑。你现在应该尝试回答的问题如下：\n\
  \n- 是否有声明式功能可以满足此要求？\n- 应使用哪个 OWD 来限制案例的可见性？如何仅让专家团队可见？\n- 案例分配规则将是什么样子？\n\n考虑不同的可能声明式共享机制。你可以使用案例团队，并将特定专业团队的所有成员添加到他们正在处理的案例中，但随后你需要一种机制将案例分配给团队中的一名成员，由其拥有并关闭案例。\n\
