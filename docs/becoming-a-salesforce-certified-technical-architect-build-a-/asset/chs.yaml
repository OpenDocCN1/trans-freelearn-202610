  \n图 14.13 – 集成接口（第一稿）\n\n进入此业务流程的下一个也是最后一个要求，其始于以下内容：\n\n> 如果报告能源故障，应根据物业地址创建严重事件并将其分配给正确的维护合作伙伴。\n\
  \n受影响地区的所有客户在事件创建、状态更新和事件解决时都应收到短信和电子邮件。\n\n您可以使用 Winter ’22 版本中引入的 **事件** 对象。**案例**\
  \ 对象和 **事件** 对象之间存在多个差异，包括多个 **案例** 可以链接到单个 **事件**，但反之则不行。**事件** 最适合用于处理影响多个客户且通常需要整个团队协作才能解决的中断。相比之下，**案例**\
  \ 最适合用于服务代理处理的一次性客户询问或投诉。\n\n您还可以设计解决方案，使用特定的 **案例** 记录类型来表示事件。Salesforce Partner\
  \ Community 允许读取 **事件** 对象的访问权限，但不允许编辑。因此，**案例** 对象更适合此场景。在您的解决方案中，严重事件将是另一种 **案例**\
  \ 记录类型。您可以使用 **案例分配规则** 将其分配给正确的 Salesforce 社区合作伙伴用户或队列，前提是您有一个指示相关 **案例** 区域的字段。\n\
  \n您可以使用 **保存前流** 根据相关 **属性**（**账户**）详细信息设置该字段的值。\n\n完成此操作后，您需要识别该特定地区的所有客户并向他们全部发送短信通知。这是一种群发短信，Salesforce\
  \ 平台原生不提供此功能。您可以使用 **SMS-Magic** 等第三方，或直接使用 **Marketing Cloud**，前提是 PLU 拥有所需许可证。\n\
  \n您可以使用 **Marketing Cloud 事务性消息 API** 发送事务性电子邮件和短信。这是一个基于 REST 的 API，可用于发送即时的非推广消息。它非常适合此用例。\n\
  \n此 API 无法使用连接器调用。需要执行以下逻辑：\n\n- 1. 基于报告的严重 **案例**，根据其物业地址创建需要通知的客户唯一列表。\n- 2. 使用这些数据调用\
  \ **Marketing Cloud 事务性消息 API**。\n\n您如何同时实现这两点？\n\n您始终需要意识到自己拥有的 _所有工具_。避免仅使用 Salesforce\
  \ Core 来解决所有问题。您在这本书中已经遇到过多个示例，其中使用其他平台（如 Heroku 和 MuleSoft）更为合适。\n\n在这种情况下，您可以使用\
  \ MuleSoft 来处理这两项任务。您可以从 Salesforce 向 MuleSoft 触发带有必要 **案例** 详细信息的 **平台事件**。然后 MuleSoft\
  \ 可以查询 Salesforce 以找出相关客户，再调用 **事务性消息 API**。MuleSoft 可以以可扩展且高性能的方式编排整个过程。如果您选择使用自定义\
  \ Apex 进行开发，应该预计在问答环节会遇到许多挑战。\n\n更新您的景观架构图和集成接口列表。无需为此流程创建业务流程图，因为它足够简单，无需图表即可解释。第二个业务流程到此结束。现在，进入下一个业务流程。\n\
  \n### 计划手动抄表\n\nPLU 共享了五个要点来解释此业务流程（在“计划手动抄表”部分）。前两个要点提供了有关所用流程和技术的信息，其余三个要点提供了详细要求。\n\
  \n逐一查看这三个要点并分析和解决它们，从第一个要求开始。\n\nPLU 希望雷达读取器设备与现场服务技术人员的移动电话配对，然后使用手机将读数数据发送到 Salesforce。\n\
  \n现场服务技术人员使用的移动应用必须能够通过 Bluetooth 与雷达读取器通信。此要求应帮助您确定移动策略。混合应用不太可能支持此功能。因此，需要原生应用。但在做出最终决定之前，请查看接下来的两个要求。\n\
  \nPLU 希望优化其现场服务技术人员的访问时间和差旅成本。\n\nSalesforce 中有两个现成的功能可用于优化访问时间和差旅成本，即 Salesforce\
  \ Maps 和 Salesforce Field Service。后者具有更高级的功能，更侧重于现场服务要求和活动，例如基于技能的分配、班次管理和团队管理。\n\
  \n选择后者以满足此要求。您需要将相关的现场服务对象添加到数据模型中。熟悉标准现场服务对象，并准备好解释它们的使用方法。\n\n> **注释**\n> 您可以在以下链接中找到有关现场服务对象的更多详细信息：https://packt.link/K6cBm。\n\
  \n为保持简单，仅将 WorkOrder 和 ServiceAppointment 对象添加到数据模型中。\n\n更新您的数据模型和景观架构，然后进入下一个要求。\n\
  \nPLU 随时希望跟踪其现场服务技术人员的位置。\n\n您知道 Salesforce Field Service 有一个特定的移动应用，原生提供此功能。可以使用该应用满足此要求。但是，您能扩展\
  \ Salesforce 移动应用以通过 Bluetooth 与雷达读取器通信吗？\n\n您可以更改移动应用上的某些配置。但是，即使您不了解该应用的全部限制，假设它可以扩展以覆盖如此复杂的要求也是有风险的。\n\
  \n\n\n\n\n你可以提议开发另一个原生移动应用程序来处理与雷达读取器的通信。在你的演示中，你可以解释这是一种你确信有效的方法，并且你打算为实际项目进一步调查这一点。\n\
  \n更新你的架构图和集成列表。由于该过程简单，无需为此过程创建业务流程图。\n\n### 计划自动抄表\n\nPLU 为计划自动抄表流程分享了两个关键要求。逐一查看并分析并解决它们。从第一个要求开始，它始于以下内容：\n\
  \n*智能电表在所覆盖的国家广泛使用。*\n\n这一段落本身并不包含明确的要求。但它描述了一种情况，即你需要以某种方式统一与四个不同云平台的交互方式。这让你想起什么了吗？听起来是\
  \ MuleSoft 的领域。继续查看下一个要求以了解更多信息。\n\n*智能读取器必须每月读取。*\n\n此要求的关键点是 PLU 对统一的渴望。他们追求一种获取抄表数据的统一机制。这些系统中唯一共同支持的集成能力是能够*拉取*抄表数据的\
  \ Web 服务。\n\n你可以提议在 MuleSoft 中开发一个每月运行的计划作业，从所有这些不同平台拉取抄表数据，将它们合并，然后使用合并后的数据集更新\
  \ Salesforce。\n\n开发完成后，你可以通过引入一个支持按需数据拉取的 MuleSoft Web 服务来扩展此解决方案。目前不需要此功能，但拥有灵活且可扩展的设计以满足当前和未来的需求是好的。\n\
  \n由于该过程简单，无需为此过程创建业务流程图。更新你的架构图和接口列表，然后进入下一个业务流程。\n\n### 客户注册\n\nPLU 为客户注册流程分享了六个关键要求。逐一查看并分析并解决它们。\n\
  \n*客户除非通过邀请，否则无法在社区中自行注册。B2C 客户的门户访问权限应在其注册 PLU 服务后生成。*\n\n要求的第一部分有点令人困惑。这里提到的邀请是指什么？Salesforce\
  \ 中没有标准的邀请流程。问题是否可能指的是手动将 *联系人* 启用为社区用户的过程？这部分不清楚，直到你阅读完此业务流程的第六个要求之前都将不清楚。实际场景可能会提出此类问题；因此，在开始累积式解决方案之前，至少在开始时完整阅读一遍场景非常重要。\n\
  \n继续处理其余要求。你发现需要在客户注册 PLU 服务后自动生成 B2C 客户门户用户。这可以使用 `Contract` 触发器轻松实现自动化。触发器将检查相关客户是否已有社区用户，如果没有找到，则触发器创建新用户。\n\
  \n这听起来不错吗？再次查看描述的流程，识别在处理快乐路径场景（即所有所需数据均已提供且流程预期能正确运行的场景）时可能面临的潜在挑战。你是否发现有什么缺失或可能出错的地方？没错！\n\
  \n对 Salesforce 设置对象（如 `User`）进行**数据操作语言 (DML)** 操作，不能在同一事务中与其他对象（如 `Account`、`Contact`\
  \ 和 `Contract`）上的 DML 操作混合。\n\n换句话说，你无法在更新 `Contract` 记录的同一事务中创建用户记录。在当前条件下，你的解决方案将失败。这是评委在问答环节会注意到并指出的一点。他们会提出更多问题，以了解你是遗漏提及这一点，还是对这一挑战完全不知情。\n\
  \n你可以通过将事务分为同步和异步部分来克服此挑战。你可以在 `Contract` 触发器中启动一个 future/queueable 方法来创建 **客户社区**\
  \ 用户。在演示中，请务必强调此解决方案将帮助你避免 *混合 DML 异常*。\n\n进入下一个要求，它始于以下内容：\n\n*PLU 希望通过公共网站向未经身份验证的用户展示其产品。*\n\
  \n此要求的核心是将你的 CPQ 解决方案公开给公众。你已经提议开发一个自定义 UI（基于 Lightning 组件），位于一个与 Power Sales 通信的\
  \ MuleSoft 公开 API 之上。你可以将此组件的使用扩展到公共 **客户社区** 页面。响应性可以使用 **Salesforce Lightning\
  \ Design System (SLDS)** 来保证。\n\n进入下一个要求，它始于以下内容：\n\n*客户应能够确认资费。*\n\n这意味着面向公众的 Lightning\
  \ 组件应能够在 Salesforce 中创建启动客户 `Contract` 所需的所有对象记录。可以使用正确的用户权限来确保这一点。值得注意的是，此组件对于未经身份验证的用户将在\
  \ `Guest User` 上下文下运行。你可以授予访客用户访问字段和对象的权限，但请确保遵循 *最小数据访问原则*。\n\n在创建用户访问权限后，客户应收到一封设置密码的电子邮件通知。\n\
  \n这是标准功能。你可以使用 `Site.createPersonAccountPortalUser` 方法创建与 **人员账户** 关联的客户社区用户。\n\n\
  ### 注意\n\n你可以通过以下链接了解此方法的更多详细信息：https://packt.link/yKVYN。\n\n用户将收到一个自动生成的密码，必须在首次登录时更改。你可以使用配置文件设置强制执行严格的密码复杂性规则。你可以将客户社区用户配置文件上的\
  \ `Password complexity requirement` 字段设置为所需值，例如必须包含以下三项：数字、大写字母、小写字母、特殊字符。\n\n登录后，客户应能够查看其联系人和合同详细信息。\n\
  \n这将通过拟议的数据可访问性和共享模型来实现。**共享集** 将确保社区用户可以访问相关 **房产账户**。**合同** 的可见性由 **父级**（父级 **房产账户**\
  \ 记录）控制。这意味着记录级可访问性已覆盖。你需要确保社区用户拥有查看所有必需字段的正确对象级和字段级权限。这可以使用 **配置文件** 和 **权限集**\
  \ 来控制。\n\nPLU 还要求允许其客户使用品牌移动应用程序登录社区。你可以提议使用 **Salesforce 移动出版器**。这是一种快速且简单的方法，可将\
  \ Salesforce Lightning 社区转换为移动应用程序。你可以通过以下链接了解有关 **移动出版器** 的更多信息：https://packt.link/ampDr。\n\
  \n### 注意\n\n你尚未遇到任何证明开发原生应用甚至混合应用是合理的高级功能要求。当然，你可以使用两者开发完全品牌化的移动应用，但这将花费时间和精力。始终考虑客户的投资回报率\
  \ (ROI)。\n\n更新你的架构图和接口列表，然后进入下一个也是最后一个要求。\n\n*客户* 应能够邀请另一个联系人到门户来共同管理特定房产和合同。这里，你回到了此业务流程中第一个要求提到的\
  \ *邀请* 要求。\n\n你可以配置客户社区用户创建其他 Contact 记录，但客户社区用户无法将新创建的联系人转换为用户。此外，B2C 的数据模型基于 **人员账户**，它们通过\
  \ **AccountContactRelation** 对象与 **Properties**（另一种 **Account** 记录类型）相关联。\n\n这些要求表明你需要自定义此功能，同时牢记第一个要求，即社区用户除非受\
  \ *邀请*，否则无法自行注册。\n\n你可以使用一个新的自定义对象来解决这个问题，该对象包含向电子邮件地址发送唯一邀请所需的所有信息。此外，自定义对象还应包含将新创建的\
  \ **社区用户** 与正确的 **房产** 记录关联所需的所有必要信息。\n\n你可以配置 **社区用户的配置文件** 以允许创建邀请自定义对象 **Community_Invitation__c**。你可以通过触发器中的自定义验证控制允许创建的记录数量，或者使用依赖于自定义\
  \ *汇总字段* 值的自定义验证规则。你可以选择第一个选项（尽管它基于代码），以避免消耗有限的汇总字段数量之一，这些字段可以引入到像 **Account** 这种敏感对象中（在此案例中代表\
  \ **房产**）。\n\n邀请流程可能如下所示：\n\n- 1. 已登录的现有社区用户创建 **Community_Invitation__c** 记录并设置所需值，例如电子邮件地址和相关\
  \ **房产**。\n- 2. 一旦创建了 **Community_Invitation__c** 记录，即可使用 Salesforce Flows 发送电子邮件警报。电子邮件警报模板将包含唯一邀请代码（这可能只是\
  \ **Community_Invitation__c** 记录 ID）以及用于在社区中自行注册的链接。\n- 3. 链接本身将包含邀请代码作为参数。当用户点击该链接时，他们将被重定向到带有\
  \ **Lightning 组件** 的社区自助注册页面。邀请号将作为参数传递到页面，允许页面在字段中向客户显示该号码以及其他常用字段，例如名、姓和电子邮件地址。\n\
  - 4. 客户点击提交按钮后，Lightning 组件的 Apex 控制器验证邀请号。如果成功，它将创建一个客户社区用户并启动异步 queueable 作业以创建所需的其他记录（例如\
  \ AccountContactRelation），以便该用户能够访问 **房产** 详细信息。\n- 5. 新创建的用户在异步作业完成之前将无法查看相关 **房产**\
  \ 详细信息。你无法保证这需要多长时间，但可以事先告知需要几分钟。\n\n\n\n\n\n\n相应地更新你的数据模型图。使用业务流程图会更容易解释这个业务流程的解决方案。该图可能如下所示：\n\
  \n![](img/a3b1eecf3c87c814267f2877e8a8be1a_491_0.png)\n\n图 14.14 – 客户注册业务流程图——邀请子流程\n\
  \n至此，该业务流程结束。进入第六个也是最后一个业务流程。\n\n### 现场销售\n\nPLU 共享了现场销售流程的两个关键需求。逐一分析并解决它们。从第一个需求开始，它以如下内容开头：\n\
  \n现场销售代理人访问潜在的 B2B 线索，并向其介绍不同的产品方案。\n\n你在此场景中之前遇到过类似的需求，但渠道不同。你决定在 MuleSoft 暴露的\
  \ API 基础上开发自定义 UI，这些 API 与 Power Sales 集成。该 UI 基本上是一组 **Lightning 组件**。\n\n现场销售代理人可以在他们的平板电脑上使用相同的组件，前提是他们使用\
  \ **Salesforce 移动应用**。新版 Salesforce 移动应用支持 Lightning 应用页面，你可以合理推断自定义 UI 将使用这些页面。\n\
  \n更新你的架构图和接口列表，然后进入下一个需求，它以如下内容开头：\n\n*访问完成后三天，应向 B2B 客户的主要联系人发送电子邮件调查。*\n\n应使用两个不同的调查模板，一个用于成功签约的交易，另一个用于丢失的交易。如果\
  \ **现场销售** 代理人的评分低于 10 分中的 3 分，应自动创建一个 **案例** 并分配给现场销售代理人的经理。\n\n如今，这一要求越来越常见，因为越来越多的公司试图更贴近客户，并向他们表明他们的意见很重要。你有三种潜在方法可以解决这一要求：\n\
  \n- 基于自定义对象和自动化开发自定义调查模块。\n- 使用诸如 **SurveyMonkey** 之类的第三方工具。\n- 使用 **Salesforce\
  \ 调查**。\n\nSalesforce 产品附带 Salesforce 的常规承诺，即它们会定期更新，并会持续加入新功能。此外，它们是专为 Salesforce\
  \ 设计的产品，因此与其他产品相比，它们与平台的集成方式更加直接，并且通常简化其他非功能性要求，例如数据驻留。\n\n在某些情况下，Salesforce 产品可能缺乏某些功能，这证明考虑第三方替代方案是合理的。此处并非这种情况。所述要求可以使用\
  \ Salesforce 调查来满足。\n\n与其他扩展产品（例如 **Salesforce 现场服务** 和 **Vlocity**）类似，你需要知道产品的工作原理并很好地理解其组件。你最需要熟悉的常见元素是数据模型。将你计划从\
  \ Salesforce 调查中使用的关键对象添加到数据模型图中。\n\n**注意**\n你可以在以下链接中找到更多信息：`https://packt.link/DWKUy`。\n\
  \n你仍需要添加一些自定义以提供某些功能，例如安排发送调查、将发送的调查链接到正确的对象（在此示例中为线索），以及处理反馈以确定是否需要创建案例并将其分配给现场销售代理人的经理（如果现场销售代理人的评分低于\
  \ 10 分中的 3 分）。\n\n如果使用 Salesforce 流开发，此自动化可能会变得复杂。因此，你可以提出一种基于 Apex 的解决方案。\n\n>\
  \ 注意\n> 使用 Apex 而非 Salesforce 流来交付复杂逻辑更为合适。极其复杂的流比 Apex 更难调试或阅读。流仍然非常适合解决许多其他挑战，但仍不完全是\
  \ Apex 的替代品。\n\n更新你的数据模型图。你的架构图现在可能如下所示：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_493_0.png)\n\
