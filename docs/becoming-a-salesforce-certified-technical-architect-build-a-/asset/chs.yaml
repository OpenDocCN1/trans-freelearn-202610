  这是一个容易得分的点。但是，没有任何图表显示 FLS 设置。因此，您需要确保在演示中提出此解决方案。\n\n更新您的数据模型图，然后进入下一项要求。\n\n*办公室技术人员不应能够查看客户的驾驶执照号码。*\n\
  \n这是另一项可以使用 FLS 解决的要求。这次，您需要让技术人员配置文件的用户完全不可访问（不可见）`Contact` 对象上的 `Driving_license__c`\
  \ 字段。\n\n进入下一项要求。\n\n*一旦检测到盗窃事件，仅接受过该类型事件培训的支持代理、其经理以及区域高管才能查看事件详情。*\n\n您在解决方案中使用了\
  \ `Case` 对象来建模盗窃事件。您如何根据技能将 `Case` 分配给正确的团队？\n\nSalesforce **全渠道（Omni-Channel）**\
  \ 提供 **基于技能的路由** 功能。您还可以为盗窃事件定义一个特定队列，并将所有受过培训的支持代理添加到该队列。然后，您可以使用标准 **案例分配规则**\
  \ 将特定类型的 `Case` 分配到此队列。\n\n那么，您应该遵循哪种方法？两种方法都可以实现目的；但是，您需要展示您知道从工具箱中选择最合适的工具。作为一个简单的经验法则，这两种方法的区别如下：\n\
  \n- **队列** 适合表示单一技能。如果您需要表示多个技能，则需要定义多个 **队列**。用户可以分配给多个 **队列**，但 `Case` 记录只会分配给其中一个\
  \ **队列**。\n- **基于技能的路由** 会考虑完成特定 `Case` 所需的所有技能。然后，它会识别拥有这些技能的用户，并将 `Case` 记录分配给其中一名用户。\n\
  \n\n\n\n\n前一种方法设置更简单。此外，它足以满足此需求。你可以使用基于队列的分配来解决此需求。由于你的角色层级设置，角色层级较高的用户将默认获得这些记录的访问权限。\n\
  \n区域执行团队应能访问所有区域数据，包括驾驶员行为，例如急刹车。\n\n区域执行团队将默认获得其区域内所有数据的访问权限，这是由于所提议的角色层级。\n\n\
  驾驶员行为数据存储在 Heroku 和 CRM Analytics 中。区域高管需要 CRM Analytics 许可证。你之前在图 12.2（参与者和许可证图）中已勾勒出这一点。现在，你已确认。更新你的参与者和许可证图，然后进入下一个需求。\n\
  \n办公室经理只应能查看其所在国家的合作伙伴账户详细信息。\n\n办公室经理拥有合作伙伴账户。无论 OWD 设置如何，他们都可以查看自己拥有的记录。但是，此处的需求表明，他们应能查看其所在国家的所有合作伙伴账户，即使这些账户由其他办公室经理拥有。\n\
  \n你可以使用基于国家的公共组，就像处理其他先前需求一样，并将该国的所有办公室经理角色添加到其中。此处唯一的区别是，由于合作伙伴账户始终由办公室经理拥有，你可以使用基于所有者的共享规则。\n\
  \n此基于所有者的共享规则非常简单：将此公共组成员拥有的所有账户记录共享给组内所有成员。你最终将得到 10 个基于所有者的共享规则，这远低于控制器限制。\n\n\
  合作伙伴应仅能使用 Salesforce 管理的凭据登录 Salesforce。\n\n你可以为客户和合作伙伴使用单个社区，但这是一种不寻常的设置。他们可能期望完全不同的\
  \ UI、服务和用户体验。\n\n你可以为合作伙伴提议一个单独的社区，且该社区不配备外部身份验证提供程序。这将确保合作伙伴只能使用 Salesforce 管理的凭据登录\
  \ Salesforce。因此，该需求已满足。\n\n将合作伙伴社区添加到你的架构图中，然后进入下一个需求。\n\n客户可以在在线门户和移动应用上自行注册。\n\
  \n你在第 12 章“实践评审委员会：首次模拟”中已经梳理了整个客户注册业务流程。要启用客户自助注册，必须在社区设置中打开该选项。\n\n同样，这是一个易于收集的要点。由于其简单性，也很容易被遗漏。\n\
  \n客户还应能够使用其 Facebook 账户登录在线门户和移动应用。\n\n客户和合作伙伴将拥有两个独立的社区。客户社区可以配置为将 Facebook 作为\
  \ **身份验证提供程序**（Salesforce 功能的确切名称是 **Auth. Provider**）。你在描述社交单点登录解决方案时必须清晰，并提及该功能的名称。你还需要解释如何使用\
  \ **注册处理程序**来管理用户配置、更新以及与现有 Salesforce 用户的关联。\n\n注册处理程序是一个实现 `RegistrationHandler`\
  \ 接口的 Apex 类。当用户由身份验证提供程序（例如 Facebook）进行身份验证时，一个包含多个值的数据结构会被传回 Salesforce，并由与该身份验证提供程序关联的注册处理程序类接收。\n\
  \n该类随后可以解析此有效载荷并执行 Apex 逻辑，以确定是需要配置新用户还是需要更新现有用户。`email address` 是唯一标识用户的常见属性（在此情况下，它等同于你的社区用户的\
  \ *联合标识符*）。但是，场景可能会要求使用不同的属性，例如电话号码。在问答环节中，你也应预料到此类要求。\n\n因此，你需要练习创建注册处理程序并尝试这些场景。你从身份验证提供程序接收到的有效载荷包含多个标准属性，但也可能包含自定义属性。这些属性可用于丰富\
  \ Salesforce 中的用户定义。在某些情况下，这些属性中的某一个可能是给定企业所需的 *联合标识符*。\n\n不言而喻，你应准备好为该身份验证流程绘制序列图。你之前在\
  \ *第 4 章、核心架构概念：身份和访问管理* 中了解过 OAuth 2.0/OpenID Connect Web 服务器流。\n\n> **注意**\n>\
  \ \n> 评委可能会要求你解释/绘制分层流程（即多个流程组合在一起）的序列，例如，社区用户从 Salesforce Mobile Publisher 应用连接并使用社交单点登录进行身份验证。在此示例中，分层流程为\
  \ OAuth 2.0（或 OpenID Connect）用户代理和 OpenID Connect Web 服务器。\n\n通过添加新的 **单点登录 (SSO)**\
  \ 接口来更新你的架构图和集成接口，然后进入下一个需求。\n\n已登录企业网络的 PPA 员工应能够自动登录 Salesforce，而无需再次提供其凭据。\n\n\
  此要求应直接让你想起在 *第 4 章、核心架构概念：身份和访问管理* 中接触过的一种身份验证协议，该协议用于网络（例如本地企业网络）以提供 SSO 功能。所指的协议是\
  \ **Kerberos**。\n\n一旦用户登录企业网络（这基本上就是员工早上打开笔记本电脑/台式机并登录域时所做的事情），将发生以下简化步骤：\n\n- 1.\
  \ 当用户从笔记本电脑/台式机登录域时，**密钥分发中心 (KDC)** 会颁发一个票据/令牌。此令牌在无需任何用户交互的情况下透明地颁发，并存储在用户的计算机上（在特定缓存中）。\n\
  - 2. 当需要向任何其他系统进行身份验证时，浏览器会使用此缓存的令牌。你需要在浏览器本身中更新一些设置来启用此功能（例如 **启用集成 Windows 身份验证**）。这些配置超出了本书的范围。\n\
  \n为了澄清什么是 **KDC**，在基于 Windows 的网络中，KDC 是 **域控制器 (DC)**。\n\n例如 **PingFederate** 之类的身份验证提供程序为\
  \ Kerberos 提供 *适配器*，这使它们能够促进 Kerberos 令牌的请求、接收和验证（在 Kerberos 中，票据和令牌这两个术语可以互换使用。例如，**PingFederate\
  \ IDP**（Ping Identity 产品的全称）的运作方式如下：\n\n- 1. 当客户端通过点击深度链接（或书签）发起 SP 启动的 SSO，或通过从特定页面点击链接发起\
  \ IDP 启动的 SSO 时，会向 **PingFederate** 发送身份验证请求。\n- 2. 使用 Kerberos 适配器，**PingFederate**\
  \ 会将响应 `HTTP 401 Unauthorized` 将用户重定向回浏览器。\n- 3. 浏览器（如果配置正确）会将 Kerberos 令牌返回给 **PingFederate**。\n\
  - 4. **PingFederate** 接收令牌后，会根据存储在 **PingFederate** 适配器中的设置验证其域。\n- 5. 验证成功后，**PingFederate**\
  \ 从票据中提取 **安全标识符 (SID)**、域和用户名，生成 SAML 断言，然后将其传递给 SP。\n- 6. SP（在此示例中为 Salesforce）接收断言并根据其对用户进行身份验证。\n\
  \n值得注意的是，**PingFederate** 将与 **LDAP** 集成，根据场景，LDAP 是 PPA 的身份存储。如果 PPA 使用 **Active\
  \ Directory (AD)**，你本可以使用 **ADFS**。但是，该产品目前不支持 LDAP。\n\n\n\n\n\n以下序列图（第 4 章，核心架构概念：身份与访问管理\
  \ 中 SAML SP 启动流程的修改版）说明了此流程。请注意，此图已简化，并未详细描述 Kerberos 的工作方式：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_426_0.png)\n\
  \n图 13.4 – 带有 Kerberos 的 SAML SP 启动流程\n\n请准备好绘制并解释此序列图，类似于你在第 4 章，核心架构概念：身份与访问管理\
  \ 中涵盖的任何其他身份验证流程。\n\n在你的架构图和集成接口中添加另一个 SSO 接口，然后进入下一个要求，该要求从以下内容开始：\n\nPPA 员工可以使用\
  \ LDAP 凭据从企业网络外部登录到 Salesforce。\n\n好消息是，PingFederate 等工具支持这两项请求的功能。PingFederate\
  \ 有一个名为“自适应身份验证和授权”的功能，它提供了一组功能，包括读取用户的 IP 地址以确定用户位于企业网络内部还是外部，并据此驱动不同的行为。\n\n如果用户从企业网络范围外的\
  \ IP 登录，你可以配置 PingFederate 请求多因素身份验证（MFA）。下面的简单流程图说明了此逻辑：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_427_0.png)\n\
  \n图 13.5 – 说明带有 MFA 的 PingFederate 自适应身份验证和授权的流程图\n\n你可以使用 PingID 等移动应用程序来接收和解决第二个身份验证因素（例如，短信）。将移动应用程序添加到你的架构中。你不需要为它添加新的集成接口，因为它将与\
  \ PingFederate 而非 Salesforce 通信。\n\n可访问性和安全性部分的要求到此结束。恭喜！你已经从复杂度角度覆盖了场景的近 85%。你仍有几个要求需要解决，但你已经通过了大部分棘手的主题。继续前进。下一个目标是报告要求。\n\
  \n## 分析报告要求\n\n报告要求偶尔可能会影响你的数据模型，特别是在决定采用反范式化数据模型以减少生成的记录数量时。报告还可能推动对额外集成接口的需求，或引发对某些特定许可证的需求。逐一查看\
  \ PPA 共享的要求并逐个解决。\n\n区域执行团队希望有一份报告，显示过去 10 年中客户驾驶行为与特定季节之间的关系。\n\n此报告需要处理大量数据。驾驶行为的原始数据在\
  \ Heroku 中。你可以使用 CRM Analytics 等工具来创建所需的报告。你已经在架构设计中拥有了它。`Int-011` 集成接口可用于将数据从 Heroku\
  \ 传输到 CRM Analytics。你可以在需要时在 Salesforce 核心云中公开仪表板。\n\n进入下一个要求，该要求从以下内容开始：\n\n区域执行团队希望有一份月度趋势报告，显示每次租赁的取车和还车地点。\n\
  \n指出需要趋势报告的报告要求应将你指向以下功能之一：\n\n- **报告快照**：Salesforce 核心云内的一种功能，使用户能够对平台上存储的历史数据进行报告。用户可以将标准报告结果保存在自定义对象中，然后安排作业运行特定报告，并使用数据填充自定义对象上的映射字段。完成后，用户可以对包含报告结果的自定义对象进行报告，而不是对原始数据进行报告。\n\
  \n- **分析/商业智能工具**：这些工具旨在处理海量数据集。它们提供更大的灵活性来钻取细节并分析其模式。此外，这些工具可以处理 Salesforce 平台内外的数据。\n\
  \n你会为这个要求选择哪一个？\n\n如果你选择报告快照，那么请准备好在问答环节中，如果评委决定增加挑战并要求你提供更多钻取数据的能力，或将 Salesforce\
  \ 中存储的数据与存档在 Heroku 上的数据相结合，调整你的解决方案。\n\n一个更好、更具可扩展性且更安全的选择是选择分析工具，例如 CRM Analytics。\n\
  \n同样，你已经在架构中拥有了 CRM Analytics 及一系列接口。你现在可以确认区域执行团队成员将需要 CRM Analytics 许可证。更新你的参与者和许可证图，然后进入下一个要求。\n\
  \n客户应能够查看其租赁预订的完整历史记录，包括过去三年的预订。\n\n此报告所需的数据大部分存在于平台之外。作为提醒，未完成订单将在 Salesforce 中，而已完成订单将被存档到\
  \ Heroku。\n\n尽量不要给自己增加复杂性，思考一个从两个来源混合数据并在单个界面上显示的自定义解决方案。采用简单的开箱即用功能。\n\n你可以简单显示两个不同的列表：一个是未完成订单，另一个是已完成订单。前者直接从\
  \ Salesforce 检索，后者使用 **外部对象** (**Salesforce Connect**) 检索。`Int-014` 集成接口可用于此。\n\n\
  还有一点需要考虑；到目前为止，你一直计划为 `Int-014` 接口使用主体用户向 Heroku 进行身份验证。这意味着将返回主体用户可以访问的所有数据，这通常是所有可用数据。\n\
  \n要将此类接口暴露给最终客户，你需要遵循以下两种方法之一：\n\n- 将身份验证策略切换到按用户。这将把控制谁看到什么的责任转移到 Heroku。Heroku\
  \ 必须有一个全面的模块来确定每个用户可以从其数据库中查看或检索的字段、对象和记录。此方法可行，但将需要自定义开发，因为 Heroku 不带有类似 Salesforce\
  \ 核心云中的高级共享和可见性模块。\n\n- 在外部对象之上开发自定义 Lightning 组件，以使用当前用户的 ID 过滤检索到的记录。这将确保用户只能查看他们应该看到的记录。但是，这不是一种安全的方法，因为\
  \ Lightning 组件中的错误可能会泄露不应显示的记录。\n\n此外，考虑到安全措施是由 UI 层而非数据层应用的，经验丰富的黑客有可能找到一种方法来访问他们无权访问的记录。\n\
  \n如果你能传达相关风险和注意事项，可以提出第二种方案。这将是你在本场景中采用的方法。你还需要解释为什么你更倾向于选择它而不是第一种方案（例如，为了节省 Heroku\
  \ 上的开发工作量）。\n\n客户还应能够查看每个已完成租赁的完整行程历史。\n\n这是一个与之前要求相似的挑战。这是个好消息，因为你可以提出类似的解决方案。\n\
  \n完整的行程历史数据也存储在 Heroku 上。你可以开发一个 Lightning 组件，当用户点击特定租赁记录旁边的 **显示行程** 按钮时显示该组件。当组件显示时，它会检索外部对象的数据，按用户\
  \ ID 进行过滤，并在 UI 上显示它们。\n\n请记住，你必须在演示中解释所有这些内容。仅仅说你将开发一个满足此要求的 Lightning 组件是不够的。你必须解释它将如何使用以及如何运行。毕竟，这就是你的客户期望你的。\n\
  \n现在，进入下一个也是最后一个报告要求。\n\n*合作伙伴应能够查看 PPA 完成的修复工作的月度报告。*\n\n这是一个直接的要求。修复工作表示为 Case。合作伙伴用户可以简单地使用标准报告和仪表板来显示他们有权访问的\
  \ Case 数据，即分配给其用户之一的 Case 记录。\n\n报告部分的要求到此结束。场景的最后部分通常列出与治理和开发生命周期相关的要求。保持势头，迎接下一组要求。\n\
  \n## 分析项目开发要求\n\n场景的这一部分通常侧重于 Salesforce 项目中用于治理开发和发布流程的工具和技术。此前，你在 *第 10 章，开发生命周期和部署规划*\
  \ 中创建了一些很好的工件，例如 *图 10.3（拟议的 CoE 结构）*、*图 10.4（拟议的 DA 结构）* 和 *图 10.7（开发生命周期图（最终））*。\n\
  \n这些工具在这个阶段将派上用场。尝试记住它们，并熟悉绘制和解释它们。你现在将逐一查看 PPA 共享的不同要求，并看看如何将这些工具付诸行动以解决一些提出的挑战。从第一个要求开始，该要求以以下内容开始：\n\
  \n*PPA 计划有三个不同的服务实施商（SI），在并行项目中交付不同的功能。*\n\n解决此类情况的最佳机制是使用多层开发环境实现源代码驱动开发。CI/CD\
  \ 还将通过确保所有开发人员都在尽可能最新的代码库上工作（可能不是最新的，但也是最接近的）来减少冲突的机会。\n\n在 *第 10 章，开发生命周期和部署规划*\
  \ 中，你涵盖了此设置的依据和优势。请记住，这是你在演示中需要解释的内容。仅仅绘制图表或抛出一些热门术语而不展示足够的实际知识是不够的。\n\n你还看到了一个示例开发生命周期图，*图\
  \ 10.7（开发生命周期图（最终））*。这可以作为此类场景的基础使用。这里有三个不同的 SI，因此在图表中有三个不同的线程/团队是合理的。\n\n\n\n\n\
