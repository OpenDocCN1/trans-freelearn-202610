  为满足此要求，我建议使用 Salesforce Field Service。它提供根据多种因素为护士创建优化日程的功能，例如地理站点位置、所需技能、护士的工作时间等更多因素。


  在角色和许可证图中，我假设护士将被分配现场服务技术人员（移动员工）许可证。这将允许他们登录 Salesforce 并查看优化后的日程。


  我还假设会有一个或多个用户来管理和创建优化的护士日程。我在图中将此角色称为护士经理。护士经理将需要现场服务调度员许可证才能使用现场服务排程器和调度员控制台。


