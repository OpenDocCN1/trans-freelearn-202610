  ### 支持代理应能够查看提交特定案例的消费者的 360 度视图。


  此需求涉及由多个系统提供的四个不同数据实体。订单在 Salesforce 中管理，完成后归档到 Heroku。案例也在 Salesforce 中管理，但每天有
  20,000 个新案例，这里存在 LDV 对象的潜力。每月增长到近 600,000 条记录，每年将产生大约 720 万个新案例。


