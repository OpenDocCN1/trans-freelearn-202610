  注册消费者应能够对其购买的商品进行评论。


  这些评论应对已注册和未注册的网站访问者公开可用。您有近200万个产品。您对平均评论数量没有明确的了解，因此可以做出一些假设。您对产品评论功能也没有额外要求，除了它应对已注册和未注册客户公开可用之外。


  通常，产品评论允许其他用户对评论进行评分，甚至可能回复它。但是，POW未请求此类功能。您可以在此处自由做出自己的假设。


  接下来的问题是是否有开箱即用的功能可以满足此要求，或者您是否需要考虑自定义解决方案？您需要做出什么样的假设以避免出现LDV对象？


  您的建议方案可以如下：


  为满足此要求，我建议使用Salesforce Chatter。通过将社区偏好设置中的“允许公共API请求访问Chatter”标志（通过社区偏好设置）设置为true，可以通过API向未经过身份验证的社区用户显示Chatter帖子。已注册用户可以针对特定产品发布评论。


  产品的OWD将针对外部用户设置为公共只读。我将通过开发一个Lightning组件来启用未经过身份验证的社区用户查看产品，该组件使用不考虑共享注意事项运行的Apex控制器（使用without
  sharing关键字）。


  考虑到200万个产品，这可能会导致由评论、点赞和评论创建许多额外的Chatter记录。我假设每个产品限制三条评论。我还假设POW同意删除评论



  与不再销售的产品以及超过三年的评论相关。


  我可以利用 ETL 工具运行每周或每月一次的定期清理进程，以删除额外记录。我还假设无需归档这些记录。如果需要，我们可以将其归档到 Heroku 的 Postgres
  数据库中。


  用户只能评论已购买的产品。为实现此目标，我建议在 Chatter FeedItem 对象上引入基于触发器的验证规则。此触发器将确保社区用户只能评论其之前购买过的产品。


  你能想到其他潜在解决方案吗？你本可以创建一个外部评论对象，并将其与无限数量的评论一起使用。但那样的话，你就需要引入更多对象来存储点赞、评论和附件等数据。同样，这是在了解其局限性的情况下使用开箱即用功能，还是开发可能需要大量时间和精力但功能更强大的自定义功能之间做出的决定。在此案例中，你使用了前者。


