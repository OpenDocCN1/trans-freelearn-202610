  现在，探索第二个用户故事。


  > 作为客户经理，我想存储所有客户的地址，以便在查看客户记录页面和列表视图时能够快速查找联系地址。


  此处的重点在于输入或查看数据时的用户体验。在这种情况下，使用非规范化数据集是合理的。这些非规范化字段可以轻松添加到列表视图和页面布局中。它们也可以使用更少的点击次数进行编辑。


  在本书中，你将遇到更复杂的场景，在这些场景中可以利用非规范化数据集来减少数据存储。尽管理论上，非规范化数据集消耗更多的存储数据，但在 Salesforce 中，大多数对象记录的数据存储大约为
  2 KB（少数例外，例如人员账户和文章）。无论其中包含多少个字段，也无论这些字段是否已填写，此规律均适用（某些字段类型除外，例如富文本字段）。如前文所述，Salesforce
  中的某些数据建模概念可能看起来有所不同。


