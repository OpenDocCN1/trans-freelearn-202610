  \n接下来，进入演示中最重要的部分，在那里你将解释你的解决方案如何解决共享业务流程。\n\n## 演示业务流程的端到端解决方案\n\n你仍处于演示的结构化部分。对于每个业务流程，你将使用你创建的相关业务流程图。此外，你还将使用景观架构图、数据模型和接口列表来解释你解决方案的细节。你可以用简短的介绍开始这部分，例如：\n\
  \nPPA 共享了五个业务流程。我将逐一介绍并解释解决方案如何满足每个流程。\n\n接下来，你将浏览第一个业务流程的示例演示。\n\n### 客户注册\n\n\
  你已经为此流程规划了解决方案并创建了业务流程图。查看图 12.4：客户注册业务流程图。你将使用此图来讲述故事并解释此流程的端到端解决方案。你的演示可以如下：\n\
  \n我将从客户注册开始。该流程可以通过两个渠道触发，即在线或通过呼叫中心。通常，PPA 会寻求跨渠道的统一体验。\n\n我建议使用 Salesforce 社区来开发客户门户。我将配置\
  \ Customer Community 以允许用户自行注册。当客户尝试访问社区时，他们将被引导到登录页面，页面底部有一个注册新帐户的链接。点击该链接后，用户将被重定向到注册页面。\n\
  \n注册页面将包含一个 Lightning 组件，其中包含名、姓、电子邮件地址、密码和驾驶执照号码等输入字段。此外，客户将看到一个部分以提供隐私政策的同意。如果所有必填字段都已填写，用户可以提交页面。\n\
  \n点击提交按钮时，我将发起对 MuleSoft 暴露的 REST Web 服务的同步阻塞 Web 服务调用，并传递驾驶执照号码。MuleSoft 将反过来调用相应的国家驾驶员和车辆许可机构并获取结果。\n\
  \n如果收到的结果为正，Lightning 组件将为客户创建 Person 帐户和 Community 用户。Person 帐户将由角色层次结构之外的用户拥有，以避免所有权偏斜。我们可以使用夜间批处理作业在以后将此帐户分配给另一个用户。\n\
