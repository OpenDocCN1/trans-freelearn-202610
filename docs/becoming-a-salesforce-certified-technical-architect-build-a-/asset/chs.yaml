  \ skew）。之后，我们将根据计划的时间表将迁移的记录分配给其合法所有者。此过程将每晚逐步进行，以避免因计算大量共享记录而影响平台性能。\n\n完成每个地区的迁移后，我们将运行一些测试，以确保目标系统中包含所有迁移的记录。同样，迁移将使用\
  \ Informatica 同时迁移到 Salesforce 和 Heroku，其中开放租赁记录将迁移到 Salesforce，已关闭的记录将迁移到 Heroku。\n\
  \n这就涵盖了数据迁移策略和计划。您必须提及这些细节才能获取该领域的分数。同样，请记住控制时间。您在结构化演示部分不应消耗 45 分钟中超过 30-35 分钟。这样您将剩下\
  \ 10-15 分钟用于 catch-all 部分，这对于避免丢掉任何容易得分的点非常重要。进入该部分，看看效果如何。\n\n## 逐一查看场景并捕获所有剩余要求\n\
  \n在演示的这一部分，您将逐一查看要求并确保已涵盖每一个要求。\n\n如果您要进行现场评审委员会（review board），您将收到一份打印的场景版本。您还将可以使用一套笔和马克笔。在阅读并解决场景时，请高亮显示或下划线标注要求。如果您心中有解决方案，请将其写在旁边。这将在场景的\
