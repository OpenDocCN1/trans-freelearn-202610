  *一旦机会关闭，除了管理员和机会所有者之外，锁定所有用户的所有机会字段。*


  沿用你之前使用的相同技术和顺序，你可以思考一些潜在解决方案：


  - 使用自定义验证规则：可以配置为在尝试保存编辑的记录时触发。但是，它们不能防止用户尝试编辑记录。它们仅在尝试保存记录时触发。如果打算使用验证规则，你需要想出一种有效的方法来防止编辑记录的字段。你不能简单地在验证规则中列出每个字段。


  引入一个新的自定义 is_locked__c 字段，并在关闭机会时使用流对其进行更新，这可能是一个解决方案。你的验证规则将仅依赖此字段。但是，如果你追求良好的用户体验（你应该如此），你需要牢记，仅此解决方案本身并不能防止用户尝试编辑记录。


  - 关闭机会时更新记录类型：也可以使用流来完成此工作。然后，你可以向该记录类型分配带有只读字段的页面布局。某些字段无法设置为只读，例如名称、货币、关闭日期、阶段和其他一些字段。此解决方案也不能防止通过代码或
  API（例如，通过数据加载器）编辑记录。你应将此解决方案视为其他方法的补充，而不是自身的全面解决方案。


  - 在 before-update 触发器中使用 Apex 验证：这为你提供了最终的功能和灵活性，但需要额外的开发工作。这种方法还会导致敏捷性下降，因为任何未来更改都需要代码修改。你应仅针对复杂的用例考虑此选项。


  - 通过审批流程锁定记录：你可以使用审批流程完全锁定记录。但是，请注意，在这种情况下，只有管理员或拥有 Modify All 权限的用户才能编辑记录，这不符合要求。


  此要求可以完全通过配置来实现。没有理由使用 Apex 验证。你可以基于前两种方法的组合提出解决方案。在起草要展示的端到端解决方案之前，请先查看接下来的三个要求，因为它们与此相关。


  > 机会行项目的字段也应该被锁定。机会关闭后，不得添加、编辑或删除任何产品。


  你明白锁定也应扩展到机会行项目。你也可以在 OpportunityLineItem 对象上引入验证规则，该规则依赖于其父机会的 is_locked__c 标志。你可能还需要考虑更新记录类型。该要求仍可使用可配置功能实现。现在，探索下一个要求。


  > 机会所有者被允许在机会关闭后最多七天内更改描述字段的值。


  但是，在此期间，这是他们允许更改的唯一字段。所有者应该能够在有限的时间段内更改单个字段。你还能使用验证规则来涵盖此情况吗？当然可以。但你需要稍微改变你的方法。


  与其使用 is_locked__c 这样的 true 或 false 标志，不如改用 locked_date__c 这样的日期字段。验证规则将把该日期与当前日期进行比较，并在所有情况下触发，除非是机会所有者进行更改，locked_date__c
  的值不超过今天日期的七天，且修改针对的是描述字段。


  你还有其他需要考虑的吗？请查看下一个要求。


  七天后，除了管理员之外，所有用户的所有字段都应该被锁定。


  你需要允许管理员随时编辑此记录。管理员还应该能够编辑任何可编辑字段。你可以更新验证规则，如果执行用户的个人资料设置为管理员，则绕过验证。这不够灵活，因为它包含硬编码值。更好的方法是创建自定义权限，将其分配给管理员，然后配置验证规则，如果当前执行用户已分配该自定义权限，则绕过验证。


  你的提议解决方案可能如下：


  为满足此要求，我建议引入一个自定义字段来存储机会的锁定日期。可以使用 Salesforce 记录触发流在关闭机会时设置该字段的值。我建议使用自定义字段而不是标准机会关闭日期字段，因为后者的值可能用于其他目的。


  然后，你可以在 Opportunity 对象上引入自定义验证规则。验证将确保没有人可以修改机会记录。对于机会所有者，有最多七天且仅在尝试更新描述字段时的例外情况。这都可以通过在验证规则中配置正确的逻辑来实现。


  我也建议引入自定义权限来绕过此验证，并将其分配给管理员。验证规则将检查执行用户是否拥有该权限。这将为我们未来在需要时将此权限分配给其他用户提供灵活性。


  将在机会行项目对象上引入类似的验证规则，该规则将检查 Opportunity 对象上的同一自定义字段，并为管理员提供类似的绕过机制。


  最后，我建议使用记录触发流在机会关闭时更新机会的记录类型。你可以向该记录类型分配带有只读字段的页面布局。这将提供更好、更友好的用户体验。





  现在，你可以进入下一个也是最后一个需求。


  *系统应同时支持欧元和英镑货币，并提供带日期的汇率。*


  这是一个简单直接的需求，可以通过开箱即用的功能来满足。你的解决方案可以像下面这样简单：


  *针对这一需求，我建议启用 Salesforce 中的高级货币管理功能。然后，输入合适的带日期汇率。*


  那是最后一个共享 PVA 需求。更新所有图表并查看它们的效果。订购业务流程图如下所示：


