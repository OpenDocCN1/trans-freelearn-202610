  \n- 2. 使用您的凭据登录帐户。如果您尚未激活帐户，请参阅前言中“解锁在线内容的说明”部分以获取详细说明。\n\n登录成功后，您将看到以下屏幕：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_173_0.png)\n\
  \n图 4.22 – 章节摘要和章末闪卡\n\n- 3. 点击闪卡堆栈上的“开始”以开始复习。\n"
- "# 开发可扩展的系统架构\n\n作为 Salesforce 系统架构师，您将被期望主导这些解决方案的设计，利用 Salesforce 丰富的产品和功能以及生态系统中的第三方产品和插件。在此过程中，您必须始终牢记所需的用户体验、施加的治理限制以及客户业务模式的性质。\n\
  \n在本章中，您将深入探讨通过 CTA 评审委员会所需的不同 Salesforce 特定知识领域。然后，您将利用一个侧重于系统架构的微型假设场景，将这些知识付诸实践。您将逐步解决该场景，在每个阶段提出有据且简洁的建议。\n\
  \n本章将涵盖以下主要主题：\n\n- 了解作为 Salesforce 系统架构师您应该知道和能够做什么\n- 介绍系统架构领域微型假设场景：Packt United\
  \ Builder\n- 确定适当的系统组合并构建您的解决方案和演示文稿\n\n## 了解作为 Salesforce 系统架构师您应该知道和能够做什么\n\n\
  系统架构师通常是一位富有才华的技术专家，负责制定实现企业目标所需的正确 IT 策略以及最佳工具、软件、硬件和网络元素。Salesforce 系统架构师显然会花更少的时间考虑硬件组件，而花更多时间解决平台特定的挑战，例如正确的\
  \ Salesforce 组织策略、所需许可证、移动策略、文档管理解决方案 (DMS) 以及报告和分析策略。\n\n**注意**\n\n根据 Salesforce\
  \ 的在线文档，CTA 候选人应满足一组特定目标，所有目标均可在以下链接中找到：https://packt.link/o3EDS。\n\n现在，您将逐一详细了解这些目标。\n\
  \n## 确定适当的系统组合\n\nSalesforce Platform 是一款出色的工具，能为客户带来巨大价值。然而，它并非应对您可能遇到的每个挑战的解决方案。`Force.com`\
  \ 平台在多租户环境中提供 SaaS 解决方案。作为一名对该平台有丰富经验的人，您将理解需要牢记若干限制条件。\n\n在实际的 Salesforce 实施过程中，您可能会遇到非技术挑战，例如预算限制。但在评审委员会考试中则不是这种情况。作为系统架构师，您应始终致力于在技术上设计最佳解决方案，使用有据的工具、功能和产品，以最短的时间为客户提供高价值。\n\
  \n可按客户需求进行`配置`的专业解决方案通常能提供更短的上市时间和更高的投资回报率。使自己熟悉一些常见的 **AppExchange** 解决方案以及其他一些第三方解决方案。您必须了解它们的功能，以及何时、在何处以及如何使用它们。\n\
  \nCTA 评审委员会场景通常会包含相当多的要求，这些要求可以使用原生平台功能来满足。每次您建议第三方解决方案（无论是通过 AppExchange 还是完全不同的平台），都要确保有充分的理由。成本不应成为您决策的主要驱动力，因为客户通常会从设计良好的技术解决方案和更短的上市时间中获益更多。\n\
  \n## 报告和分析的设计注意事项\n\n您需要了解标准 Salesforce 报告功能。四种标准报告格式如下：\n\n- 表格式\n- 汇总\n- 矩阵\n\
  - 合并报表\n\n您需要亲自操作它们，以了解它们的功能和局限性。\n\n标准 Salesforce 报告是针对平台上托管的记录数量有限的数据进行报告的绝佳工具。然而，它们不适用于对百万级记录对象或不托管在平台本身上的数据进行报告。趋势及其他跨多年的报告往往包含大量记录；这些要求会让您立即远离\
  \ Salesforce 的标准报告。请确保根据场景中给出的数字（以及在必要时基于合理的假设）进行数据量计算。然后，相应地确定您的报告策略。\n\n在处理涉及百万级记录数据集的报告要求时，您可以考虑\
  \ CRM Analytics（以前称为 Tableau CRM）、Tableau 以及其他第三方 BI 工具（例如 Power BI）等选项。您不必推荐 Salesforce\
  \ 产品。正确的做法是根据您的知识和经验，推荐您认为正确的解决方案。Salesforce 产品之间以及与 Salesforce Platform 的集成更加容易。\n\
  \n## 组织策略\n\n这是您在实际操作中和评审委员会期间需要指导客户做出的关键决策之一。您需要帮助客户决定解决方案是使用单个 Salesforce 组织还是多个组织来交付更合适。每次面临此决策时，您都需要记住这两种方法的几个主要优缺点。现在，您将首先了解单组织方法。\n\
  \n### 单组织\n\n在此方法中，您的解决方案使用单个 Salesforce 生产组织进行交付。此方法具有以下优点：\n\n- 来自多个部门和业务单元的用户可以在同一组记录上协同工作和协作。\n\
  - 使用此方法通常更容易引入统一流程。例如，跨多个国家/地区使用机会对象的统一销售流程。\n- 所有平台数据都在单个实例上；因此，构建使用这些数据的报告更加容易。\n\
  - 安全配置、策略、配置文件和权限都在一个位置进行管理。\n- 每个用户通常会消耗一个 Salesforce 许可证并使用一组登录凭据。\n- 考虑到您只需处理一个\
  \ Salesforce 组织，集成接口更容易维护。\n- 由于所有平台数据都在一个地方，构建客户 360 度视图更加容易。\n\n\n\n\n然而，这种方法存在以下缺点：\n\
  \n- 请记住，可能阻止您选择此方法的任何法规。\n- 由于您可能需要容纳拥有不同流程和要求的多个业务单元，单个组织的复杂性可能会迅速增加。这意味着它最终可能变得非常难以维护。\n\
  - 您触及 governor 限制的几率更高。\n- 由于组织的复杂性以及更改可能影响许多用户和业务单元，创新和更改可能会缓慢且受到限制。\n- 在单个位置维护所有策略、配置文件和权限所带来的优势，当这些配置过于复杂难以维护时，也可能成为劣势。\n\
  - 不同团队可能正在开发相互冲突的功能，这最终可能导致彼此功能受损。在这样一个环境中，彻底的回归测试策略至关重要。回归测试是一种软件测试类型，用于检查和验证最近的软件更改是否对任何现有功能产生了不利影响。\n\
  - 在本地进行管理比较困难。\n\n## Multi-org\n\n在此方法中，您的解决方案是使用多个 Salesforce 生产组织交付的。它们可以是完全自治的，也可以设计为主子架构风格，其中主组织将数据推送到或从多个子组织拉取数据，或者设计为没有中央组织，其中某些组织彼此直接连接以交换数据。此方法具有以下优点：\n\
  \n- 触及 governor 限制的几率更少。\n- 与单组织方法相比，创新和上市时间更好，因为对每个组织所做的更改不会影响其他组织。\n- 不同业务单元之间发生冲突的几率更少，因为它们可以在自己的组织中工作。\n\
  - 每个组织的复杂性总体较低。\n- 在本地管理比较容易。\n- 更好地处理不同监管要求的能力。\n- 发布周期的灵活性更高，因为每个组织可以有自己的发布周期。\n\
  \n但是，它也有以下缺点：\n\n- 在多个组织之间实现统一流程比较困难。尽管您可以使用未锁定包等部署功能部分地促进这一点，但独立组织更难进行治理，因此最终更有可能采用不同的流程。\n\
  - 与多个组织的用户协作的能力有限。尽管某些第三方产品可以部分弥补这一差距，但单个组织在协作方面始终会提供更好的功能。\n- 维护集成接口既困难又耗时/耗费资源。\n\
  - 需要访问多个 Salesforce 实例的用户将为每个实例消耗一个 Salesforce 用户许可。您可能还需要引入**单点登录 (SSO)** 功能以提供更好的用户体验。\n\
  - 第三方的成本可能会增加，具体取决于其许可结构。\n- 在多个 Salesforce 实例中报告数据的能力较弱。但是，您可以使用 CRM Analytics\
  \ 或 Tableau 等工具来弥补这一差距。\n- 可能需要多个发布策略、工具集以及维护它们的团队。\n\n在确定最适合的组织结构时，您需要考虑上述所有要点以及更多内容。有时，您可能会遇到明确要求，直接将您推向某个选项。建议先假设采用单组织策略，并在经历多场景要求的过程中更新您的假设。\n\
  \n## 移动解决方案和策略\n\n在您的解决方案中，可以考虑四种主要的移动应用程序类型：\n\n- Salesforce 移动应用（由 Salesforce\
  \ 构建并持续更新）。Salesforce Mobile Publisher 是 Salesforce 移动应用的一种形式，旨在让您能够轻松为 Salesforce\
  \ Lightning 应用或 Experience Cloud 站点创建和发布品牌/定制移动应用。它作为独立应用分发。\n- 原生应用（使用特定编程语言为特定平台构建的应用，例如\
  \ iOS）。\n- 混合应用（使用 Apache Cordova（原 PhoneGap）、JavaScript、HTML5 及其他技术等跨平台框架构建的应用）。\n\
  - HTML5 应用（使用 JavaScript 和 CSS 等 Web 技术开发的基于 HTML5 的应用）。\n\n这些应用程序各自最适合特定的用例。下表可以帮助您为解决方案确定合适的移动策略：\n\
  \n| 功能 | Salesforce Mobile App | 原生应用 | 混合应用 | HTML5 应用 |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| 性能 | 最佳 | 最佳 | 次优 | 次优 |\n| 分发 | 通过商店（例如 App Store），Salesforce\
  \ Mobile Publisher 可用于促进品牌列表 | 通过商店（例如 App Store） | 通过商店（例如 App Store） | Web |\n\
  | 访问相机 | 需要定制 | 是 | 是 | 否 |\n| 访问地理位置 | 是 | 是 | 是 | 是 |\n| 访问联系人和日历 | 是 | 是 | 是\
  \ | 否 |\n| 离线 | 有限 | 最佳 | 有限 | 非常有限 |\n| UI 功能（例如捏合、滑动、展开） | 良好 | 最佳 | 有限 | 有限 |\n\
  | 定制 UI | 有限 | 最佳 | 有限 | 有限 |\n| 跨平台 | 是 | 否 | 是 | 是 |\n| 品牌功能 | 否（使用 Salesforce\
  \ Mobile Publisher 时除外） | 是 | 是 | 是 |\n| 所需开发技能 | 无；如果需要自定义功能，则使用 Lightning 组件和\
  \ Visualforce | 原生开发语言，例如 Objective-C 和 Java | 特定框架。HTML5、JavaScript、CSS | HTML5、JavaScript、CSS\
  \ |\n| 开发速度 | 快 | 慢 | 中等 | 中等 |\n\n图 5-1 – 不同类型移动应用的功能比较\n\n作为解决方案的一部分，在考虑场景上下文和共享要求的同时，您应当解释您的移动策略。作为\
  \ CTA，您不仅需要简单列出不同选项，还应根据其要求、合乎逻辑的假设和有效的论据，引导受众选择正确的选项。\n\n## 所需许可类型\n\n您需要为解决方案指定所需的许可，包括任何第三方许可。例如，如果您的用户使用\
  \ Conga Composer 等第三方工具生成 PDF 文档，则需要在解决方案中包含该许可。\n\n在评审委员会期间，您无需详细到粒度级别。不过，在实际解决方案中需要这样做（例如，在评审委员会期间，您可以指定需要\
  \ Conga CLM 许可，但在实际操作中，您可能需要明确指定需要多少个 Conga CLM 完整用户和 Conga CLM 请求/仅查看用户许可）。在实际操作中，您有更多时间浏览所选供应商提供的完整许可类型列表，以确定哪些更符合您的要求。这些列表会不断变化，您不需要将其记下来。\n\
  \n对于 Salesforce 许可，通常只需识别并使用以下主要许可之一即可：Sales Cloud、Service Cloud、Salesforce Platform、Salesforce\
  \ customer community、Salesforce customer community plus、Salesforce Partner Community、CRM\
  \ Analytics、Marketing Cloud 和 Pardot。\n\n请注意，从 Spring '21 版本开始，Salesforce Community\
  \ Cloud 已重命名为 Salesforce Experience Cloud。但是，许可仍称为 Salesforce customer community、Salesforce\
  \ customer community plus、Salesforce Partner Community 和 Salesforce Employee Community。\n\
  \n> **注意**\n> 您可以通过以下链接了解最新的许可列表及其功能（特别是其被允许使用的对象和功能）：https://packt.link/XIy4g。\n\
  \n对于评审委员会场景，您可以合理假设使用 Salesforce Enterprise 版。\n\n## 确定合适的文档管理解决方案\n\n您已经了解过 Salesforce\
  \ Platform 提供的不同类型的 DMS。您还在第二章“核心架构概念：数据生命周期”中简要了解过市场上一些最常见的解决方案以及如何将它们连接到 Salesforce。请确保您对\
  \ Files Connect 有实际操作经验（这是一款 Salesforce 产品，允许 Salesforce 用户访问、搜索和查看存储在 Google Drive、Box\
  \ 或 Microsoft SharePoint 等外部系统中的文档）。\n\n> **注意**\n> 您可以使用此链接查看完整的官方指南：https://packt.link/iFJXi。\n\
  \n现在是将所有这些知识付诸实践的时候了。在下一节中，您将了解一个专注于系统架构领域的微型假设场景。\n\n## 系统架构领域微型假设场景简介：Packt United\
  \ Builder\n\n以下微型场景描述了一个特定客户面临的挑战。您将阅读该场景，然后逐步创建解决方案。为了从中获益最大，建议您阅读每一段，尝试自己解决问题，然后返回本章，阅读建议的解决方案，将其与您的解决方案进行比较，并做笔记。\n\
  \n\n\n\n\n> **注意**\n> \n> 请记住，此处列出的解决方案不一定是 *唯一* 可能的解决方案。只要在技术上正确且逻辑合理，替代方案也是可以接受的。\n\
  \n废话不多说，继续查看场景。\n\n### 场景\n\n**帕克特联合建筑（Packt United Builder，PUB）** 是一家全球房地产开发商。它在20个地区拥有200个办事处，包括15个美国州、法国、德国、意大利、阿联酋和新加坡。PUB提供的服务涵盖房地产设计、建造、管理和维护。它既开展自有房地产开发项目，也为B2B和VIP\
  \ B2C客户提供特殊的定制项目。\n\nPUB拥有超过五百万B2C客户和约10万 B2B客户，此外还有分布在约5万家公司中的广泛供应商和承包商网络。\n\n\
  PUB在全球管理约10万处房产。每处房产平均配备10台智能火灾监控设备、安防设备和传感器。所有设备均连接至互联网，并至少每30秒发送一次状态消息。PUB预计未来五年其管理的房产组合将每年增长10%。\n\
  \nPUB长期面临系统脱节的问题，导致数据质量不佳，员工工作量增加。它已在意大利试点了一个基于Salesforce的解决方案，并希望将其推广到其他地区。各地区都有业务必须遵守的一套房地产开发和管理法规。\n\
  \nPUB在为其管理的房产部署和监控传感器方面推行统一机制也遇到了困难。目前，这些传感器产生的数据被收集在多个功能低下、对业务价值有限的脱节系统中。\n\n###\
  \ 内部利益相关者\n\n以下PUB员工将使用新系统：\n\n- 300名设计师和房地产开发专家，他们与客户会面，设计定制房产并监督开发流程\n- 10,000名项目经理和工程师，他们监督施工团队并汇报项目进度\n\
  - 5,000名专家，他们负责照管较小的房产及其计划维护\n- 10,000名销售代理，他们负责管理房产、维护合同和定制房产的销售周期\n- 100名区域总监，他们需要定期获取房地产开发进度，以及销售和房产管理运营的报告\n\
  - 50名房产主管，他们处理受管房产报告的案例，并确保客户根据其商定的支持等级获得服务\n\n接下来，您将了解更多关于外部利益相关者的信息。\n\n### 外部利益相关者\n\
  \nPUB还识别出将使用该系统的外部用户：\n\n- **五百万B2C客户**：这些是在特定时间购买或租赁了一处或多处PUB房产的个人。\n- **10万 B2B客户**：这些是在特定时间购买或租赁了一处或多处PUB房产的公司。PUB认为其中大部分记录都是最新的。\n\
  - **5万家供应商和承包商**：这些是根据不同类型的协议为PUB提供不同服务的公司。\n\n现在，请继续查看要求。\n\n### 要求\n\nPUB共享了以下要求，描述了当前和期望的解决方案。PUB使用多个系统来运行其业务：\n\
  \n- PUB使用一个自定义的多语言公共网站，向潜在客户提供公司信息、办公地址、电话号码和询价表单。PUB计划保留该网站，并根据需要进行更新以适配新系统。\n\
  - PUB使用七个不同的脱节监控系统，其中没有内置业务逻辑。这些系统部署在本地，拥有公开可访问的 Web 服务，可直接接收安装在受管房产中不同传感器发出的信号。\n\
  \nPUB认为这些系统价值不大，希望用新系统取代它们，新系统将作为一个统一平台，接收、解释并响应来自全球不同类型和型号传感器的不同信号。\n\n- 存在四个不同的ERP系统——一个在美国，一个在欧洲，一个在阿联酋和中东地区，一个在新加坡和东亚地区。由于防火和安全系统的法规要求，这些ERP实现有不同的数据要求。因此，它们一直相互独立。\n\
  - PUB使用一个定制的设计应用程序，专门为在企业平板电脑上使用它的设计师量身打造。设计师在与客户讨论时，使用该应用程序显示和调整不同的设计元素。\n\n该应用程序生成PDF文件作为输出，理想情况下应与描述房产的一组文档一起保存，例如说明已安装传感器位置的文档。\n\
  \n目前，所有这些文件都存储在各个地区的不同系统中。PUB希望将新系统作为集中工具，以结构化且符合地区合规要求的方式存储这些文档。PUB倾向于使用其新购买的 Microsoft\
  \ SharePoint Online 软件来实现这一点，前提是它可以与新系统完全集成。\n\n- PUB拥有一套CRM（意大利除外，均非Salesforce），用于跟踪项目开发和销售活动，这些活动在各地区的性质各不相同。PUB希望用新系统取代所有这些脱节的应用程序。\n\
  \n其中一些CRM与PUB的区域ERP系统集成。PUB希望新系统与ERP系统完全集成，以便客户和订单数据可以根据地区复制到正确的ERP系统中。\n\n- PUB有一个用于计划维护操作的中央系统。该系统在过去曾面临多项挑战，现在被认为效率低下。PUB希望用新系统取代它。\n\
  - 所有现有系统都通过企业 Azure Active Directory (AD) 为内部用户提供单点登录(SSO)。PUB希望新系统继续使用 Azure AD\
  \ 实现新系统与保留的 ERP 之间的单点登录。\n- 德国已推出一款移动应用程序，允许员工在连接互联网时从世界任何地方访问德国CRM。PUB希望为新系统提供类似的功能，并在全球范围内推出。\n\
  \n除上述要点外，PUB认识到，为了提供最佳客户体验，新系统还需要交付以下功能：\n\n- 客户应能下载带有PUB品牌的移动应用程序，查看其在线账户、针对其房产创建工单并更新个人资料。该应用程序应提供现代且定制的用户体验和\
  \ UI。\n- PUB目前与客户沟通较少。PUB希望能够根据客户偏好定期发送营销材料。\n- PUB认识到，受管房产传感器收集的数据可能揭示有价值的业务趋势，帮助\
  \ PUB 提供更好、更高效的服务。维护数据同样适用这一原则。PUB希望能够分析过去五年的数据，以得出有价值的市场趋势。\n\nPUB希望获得您的帮助，根据其共享的要求和愿景设计一个可扩展且面向未来的解决方案。\n\
