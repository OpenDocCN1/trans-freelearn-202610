  \n图 15.11 – 数据模型（最终）\n\n角色层次结构图未发生变化。\n\n恭喜！你已成功完成第二个完整场景。你创建了一个可扩展且安全的端到端解决方案。现在你需要将其与一个强大、引人入胜且有吸引力的演示相结合，以尽可能多地拿分，并将问答阶段仅用于填补几个缺口。\n\
  \n准备好进入下一阶段了吗？继续前进。\n\n## 展示并证明你的解决方案\n\n现在是时候创建你的演示文稿了。在评审委员会期间，你可能需要即兴完成这一任务，因为你可能会花掉全部三个小时来创建解决方案和支持工件。\n\
  \n如你在第 13 章“展示与辩护：首次模拟”中所学，你需要提前规划演示，并运用时间管理技能，确保在给定时间内以足够的细节描述解决方案。你将在附录“技巧与窍门，以及前进之路”中学习一些计时技巧。\n\
  \n你现在已熟悉委员会演示的结构。你从演示的结构化部分开始，然后切换到兜底模式。作为提醒，这两个不同的演示阶段包括以下内容：\n\n- 结构化部分：在这一部分，你将描述解决方案中特定的预先规划元素，从整体解决方案介绍开始，包括对所创建工件的简要演练。然后，你逐一处理业务流程，利用图表和工件解释你的解决方案将如何满足它们。之后，你需要描述你的\
  \ LDV 缓解和数据迁移策略。\n\n你可以根据需要添加更多主题，前提是你已为此规划并预留了足够的时间。\n\n- 兜底部分：在这里，你将逐一审查要求，并指出第一部分中未涵盖的要求。这样做是为了确保你没有遗漏任何要求，特别是那些简单明了的要求。\n\
  \n在本章中，你将为以下主题创建演示提案：整体解决方案和工件介绍、一个业务流程以及项目开发要求。客户服务流程将被使用，因为它是最复杂且冗长的。\n\n随后，你将捍卫你的立场，为你提出的解决方案辩护和证明，知道你可能需要根据新引入的挑战调整解决方案。\n\
  \n在以下部分中，你将为结构化部分创建示例演示提案。从解决方案和工件的整体介绍开始。\n\n### 介绍整体解决方案和工件\n\n与你在第 13 章“展示与辩护：首次模拟”中所做的类似，先自我介绍；这不应超过一个段落。它应该像下面这样简单：\n\
  \n我叫 [你的姓名]，今天来这里是为了介绍 [场景中公司名称] 的拟议解决方案。\n\n然后，接着写一段简短的文字，简要描述公司的业务。这将有助于你进入演示状态并破冰。你可以直接使用场景中第一段的缩写版本，例如：\n\
  \n该场景描述了一家欧洲公用事业公司，在德国、意大利、法国、葡萄牙、比利时和英国的多个城市提供服务。该公司在 40 个城市运营。它既向 B2C 客户（住宅）也向中小型\
  \ B2B 客户提供服务。\n\n记住，自我介绍并设定场景不应超过一分钟。现在你可以开始用一段简短的文字解释公司的关键需求，例如：\n\n该公司多年来一直在为现有的\
  \ CRM 解决方案苦苦挣扎，并作为一项新的战略举措，决定切换到 Salesforce。它希望利用新的 CRM 推出一套全球统一的新销售和服务流程。\n\n现在是时候解释当前和未来的架构图了。使用并展示你的架构图来引导受众了解它；绝不要只是站在旁边单调地讲话。你应该能够查看图表并描述现状和未来的架构。你的提案可以如下：\n\
  \n该公司使用六种不同的 ERP 系统。它们用于服务履行、客户入职、切换和激活。计划是保留所有这些系统，并通过其 API 将新解决方案与之集成。值得注意的是，比利时\
  \ ERP 不提供 API。\n\n数据将在 Salesforce 和这些系统之间双向流动。为了构建可扩展且灵活的架构，我们应该致力于在 Salesforce\
  \ 和 ERP 系统之间建立统一的通信接口。MuleSoft 等中间件将提供这种能力。它还将提供编排这些系统之间数据流并处理任何遇到的异常的能力。\n\nMuleSoft\
  \ 还将能够通过其内置连接器直接与比利时 ERP 所基于的平面文件数据库通信。MuleSoft 不会传输大量数据。这正是让我意识到需要 ESB 而非 ETL 的原因。然而，我还建议使用\
  \ ETL 来处理数据迁移。\n\n该公司使用一个高度定制的 CPQ 解决方案，并计划保留它。我们将使用 MuleSoft 暴露的精细 API 与该解决方案集成，因为该解决方案本身提供的\
  \ API 较差。Power Sales 将在适当阶段被调用，以计算定制报价的价格。\n\n该公司还依赖需要支持的电力和燃气智能电表以及常规雷达式电表。MuleSoft\
  \ 将再次在此发挥关键作用，作为统一的集成中间件。\n\n拟议解决方案将取代目标国家的一组传统 CRM 解决方案。我们将稍后解释数据迁移策略，但我们建议使用 Informatica\
  \ 等 ETL 工具来促进这一过程。\n\n拟议解决方案基于单个 Salesforce 组织。理解公司最近收购了一家也将 Salesforce 作为其核心 CRM\
