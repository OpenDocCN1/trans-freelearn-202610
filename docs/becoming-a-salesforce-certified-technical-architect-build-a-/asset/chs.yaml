  此时，您可能已消耗分配给您的*结构化演示*的大部分时间。请继续进行您的简洁项目开发和发布策略推介：\n\n*公司希望尽快开始实现价值。为实现这一目标，我建议在定义每个版本中包含的功能时遵循\
  \ MVP 的概念。MVP 使企业能够在无需等到项目结束的情况下开始获得收益。这有效地降低了整体风险，因为用户将快速开始使用新系统，并通过增量版本获得额外功能。*\n\
  \n\n\n\n\n我在本项目中识别出至少三个潜在风险。首先是 MVP 解决方案的设计与治理。为缓解这一风险，我们将采用由两部分组成的治理机构：一是卓越中心（CoE），确保在所有利益相关者参与的情况下做出战略决策；二是设计权威（DA），负责解决日常项目挑战，并基于最佳实践提出合理且可审计的解决方案。\n\
  \n接下来是将 ERP 相对缓慢的发布周期与 Salesforce 采用的快速发布周期进行对齐。我们将使用多层开发环境，并将其与合适的 ERP 环境集成，以缓解这一问题。我们将使用\
  \ MuleSoft 在系统之间建立松耦合集成，这将使我们能够利用双速架构概念。双速架构将允许集成系统以自己的节奏进行开发，彼此之间依赖最少。项目中透明的待办列表将确保每个人都知道正在开发的功能。CoE\
  \ 将确保为正确的发布选择正确的功能。\n\n最后一个风险是，在从高生产力桌面应用程序切换到云端/浏览器端解决方案时，管理用户期望和性能。为缓解这一风险，重要的是确保已建立合适的变更管理流程，包括沟通活动、培训、定义先锋用户/超级用户，以及高管团队的持续支持。我们将使用性能与桌面应用程序高度匹配的工具。\n\
  \n我们将使用基于多层开发环境的源代码驱动开发。源代码驱动开发将允许您维护可追踪的审计轨迹，显示项目生命周期中任何给定时间开发的功能。\n\n在此图表 [指向开发生命周期图]\
  \ 中，您可以看到，我们最初将只有一个开发流。\n\n该流中的团队将使用开发沙箱开发新功能。他们将使用另一个开发者沙箱来测试开发的功能，而不会受到任何开发活动的干扰。还将有一个沙箱，用于从所有流中持续合并新开发的功能。\n\
  \n除此之外，还将有一个由测试团队管理的 QA 环境沙箱、一个预发布环境和一个生产环境。热修复可以在单独的沙箱中进行，然后部署到 CI、预发布和生产环境。此设置将允许未来的流并行工作，并确保所有团队始终使用最新的代码库并避免冲突。\n\
  \n我建议使用自动化部署和发布管理工具，例如 Copado，以及自动化测试管理套件，例如 Provar。Apex 单元测试仍将用于测试所有关键功能，此外还要测试无法使用基于\
  \ UI 的自动化测试进行测试的功能。\n\n每次将某个功能从一个环境部署到另一个环境时，都将调用所有 Apex 单元测试。自动化测试脚本也将自动调用。两者共同确保执行所有回归测试，并且新开发的功能符合所有验收标准。当然，仍将有手动测试，但我们应该力求自动化最关键的用例。\n\
  \n评委在问答环节很可能会询问与该领域相关的问题，例如 CoE 的结构、拟议的开发方法、CI 环境的依据、SCM 中分支的使用、如何保持所有开发环境处于最新状态，以及如何确保测试持续被调用。\n\
  \n您在这里也预埋了一些问题。例如，您简要提到 CI 设置将使团队避免冲突，但您没有准确说明如何做到。您将在本章后面解决那个问题。进入演示的兜底阶段。\n\n\
  通读场景并捕获所有剩余需求。\n\n在演示的这一部分，您将逐一过一遍需求，确保已覆盖每个方面。\n\n您在第 13 章“Present and Defend:\
  \ First Mock”中了解过这种方法的优势，它帮助您发现并解决了遗漏的需求。即使您创建了结构完美的演示文稿，也建议留出一些时间再次过一遍需求，确保没有遗漏。\n\
  \n如果您进行现场评审会，将收到场景的打印版。您还可以使用一组钢笔和记号笔。在阅读和解决场景时，请突出显示或加下划线标记需求。如果您心中有解决方案，请将其写在需求旁边。这将在场景的兜底部分为您提供帮助。\n\
