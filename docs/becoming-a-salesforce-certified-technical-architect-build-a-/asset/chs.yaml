  \ | --- | --- | --- | --- |\n| Int-001 | Salesforce -> MuleSoft -> 出版机构一、二和三 | 数据\
  \ | 数据同步 – 阻塞 | 机会关闭后，“发送到出版商”按钮将变得可见。当用户单击它时，机会数据将通过 MuleSoft 发送到出版机构，MuleSoft\
  \ 将处理编排并将结果返回到 Salesforce。 | HTTPS (单向 SSL/TLS) | Salesforce 与 MuleSoft 之间的 Oauth\
  \ 2.0 Web 服务器流。由于限制，MuleSoft 与出版机构系统之间使用简单的用户名/密码 |\n| Int-002 | SAP -> MuleSoft\
  \ -> Salesforce | 数据 | 数据同步 – 批量 | MuleSoft 每 30 分钟启动一个批处理作业，从 SAP 拉取新增/修改的账户并将其同步到\
  \ Salesforce。 | HTTPS (双向 SSL/TLS) | MuleSoft 与 Salesforce 之间的 Oauth 2.0 JWT 流。MuleSoft\
  \ 与 SAP 之间的用户名/密码 |\n| Int-003 | Salesforce -> MuleSoft -> SAP | 数据 | 数据同步 – 批量\
  \ | MuleSoft 每 30 分钟启动一个批处理作业，从 Salesforce 拉取状态为“已确认”的新订单并同步到 SAP。 | HTTPS (双向 SSL/TLS)\
