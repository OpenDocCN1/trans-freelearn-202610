  ### 企业中的集成：了解格局


  数字企业格局不断变得更加复杂。企业曾拥有不到 10 个系统来覆盖大部分业务流程的日子已一去不复返。如今的企业拥有数百个甚至数千个不同的应用程序，这些应用程序是购买的、内部构建的或组合的。此外，还有仍然幸存的一组遗留系统。如今，很常见的情况是，企业拥有数十个网站、多个
  ERP 系统实例以及许多其他部门应用程序，此外还有多个数据仓库或数据湖。


  企业最终陷入此类情况的原因之一是构建业务应用程序所关联的复杂性。构建一个运行所有业务流程的单一应用程序几乎是不可能的。维护它、适应日常业务挑战以及请求变更更具挑战性。将业务功能分解为较小的应用程序块始终是合理的。这为企业提供了足够的灵活性和敏捷性，以其需要的速度前进，而不是受制于更大的一体化解决方案的技术边界。此外，它还为企业提供了挑选和选择最适合其需求的最佳应用套件的机会。这意味着将最佳
  **客户关系管理 (CRM)** 系统与最佳 **订单管理系统 (OMS)** 和 **企业资源规划 (ERP)** 解决方案相结合。


  在过去 20 年左右，供应商为特定核心功能提供了专注的应用程序。对现有应用程序不断添加功能，导致了一种功能外溢。例如，多个客户服务软件已添加扩展以包含有限的计费功能，因为在系统之间划清清晰的功能分界很困难。例如，如果客户对账单提出争议，那会被视为由客户服务还是计费应用程序处理的问题吗？


  另一方面，用户并不真正关心这些边界或幕后的系统。他们期望执行业务功能，而不论涉及哪个或哪些系统来交付该功能。例如，当客户在线下订单时，这可能需要多个系统之间的协调来交付多个功能，例如检查客户的历史记录或信用评分、检查库存、计算税费、创建订单、履行订单、处理运输、发送账单、收取付款等。这些过程可能跨越多个系统，但从客户的角度来看，那是一次单一交易。


  为了支持这些仍需作为连贯业务流程运行的分布式功能，这些应用程序需要以高效、安全、可扩展且可靠的方式进行集成。


  典型的企业集成需求如下：


  - **获取正确信息**: 获取由不同系统和企业业务流程创建的特定信息的精确知识。此知识必须以一种能够支持其他业务需求的方式进行结构化。

  - **将信息传递到正确位置**: 这需要处理跨异构环境的信息交易的机制，这些环境可能基于不同的技术栈，并驻留在不同的服务器/硬件和操作系统上。

  - **在正确时间获取信息**: 理想情况下，这需要实时分发信息，以反映特定数据实体的实际状态。

  - **灵活性和对变化的拥抱**: 这是为了适应外部因素，例如市场需求、客户行为转变、新立法或社会哲学的转变。

  - **协调业务流程**: 这是一项具有挑战性的操作，可能需要对企业业务流程、它们之间的关联方式以及交换的信息类型进行建模。这可能需要深入了解业务以及对企业的某些知识。


  那么，什么是良好的集成架构？您将在下一节中了解。


  ### 集成架构设计原则


  与任何复杂的技术架构主题一样，在设计目标集成策略和架构时，需要牢记若干注意事项和后果。集成是关键领域之一，其中 _次优_ 设计可能对整体解决方案产生重大影响。


  主要决策点通常如下：


  - **原生集成**: 简单来说，如果您能开发一个单独的独立应用程序，无需与任何其他应用程序协作即可独自满足所有业务需求，那么就可以避免由集成要求驱动的大量复杂性。然而，这通常不是您能实现的。多次尝试扩展应用程序以包含其他功能，可能会最终创建一个难以管理和维护、对市场需求反应缓慢且难以调整以满足新业务需求的复杂系统。


  此问题在 Salesforce 世界中也存在，尽管方式更有限。许多 Salesforce 产品是原生集成的，许多被认为是市场上最好的，并能够提供不同的用户体验。例如，Salesforce
  社区为暴露客户门户提供了一个原生解决方案，该门户与您的 CRM 原生集成。


  Salesforce 社区提供了非常好的共享模型和一种简单的方式来控制社区本身的外观和感觉。与其选择技术，不如支持它，然后想办法以安全合规的方式将其与 Salesforce
  集成。此外，使用原生集成为未来使用其他原生集成功能敞开了大门。


  - **简洁性：** 这超越了集成架构。简洁性是架构师和开发人员应始终追求的目标。尽可能避免复杂的解决方案，并始终牢记黄金 80-20 原则。


  使用简化架构满足 80% 的用例，应优于针对使用过度复杂的架构来覆盖 100% 用例的解决方案。保持集成代码简单整洁。在某些用例中，您可能仍需要引入一些复杂模块来提供高度复杂的功能。


  - **应用程序依赖关系：** 集成应用程序应彼此具有最小依赖关系。这使解决方案能够独立发展，而不受彼此路线图的限制。它还允许您完全替换一个应用程序，而不影响其他集成系统。


  紧密耦合的应用程序彼此有许多依赖关系，并依赖关于它们各自工作方式的许多假设。当一个应用程序被修改时，这些假设可能会改变，从而反过来破坏集成。


  在松散耦合的集成中，集成接口足够具体以交付特定功能，但又足够通用以在需要时允许更改。


  - **时序：** 理想情况下，集成架构应力求将应用程序发送数据和另一个应用程序接收数据之间的持续时间最小化。集成架构应力求尽可能频繁地共享小块数据，而不是等待交换可能不一定相关的大块数据。


  在设计架构时应考虑数据共享延迟。数据交换过程耗时越长，就越可能变得更加复杂，并面临其他挑战，例如数据状态的变化。批量数据交换仍可用于合适的用例，例如归档操作数据。


  - **同步与异步：** 在同步过程中，一个过程会等待其所有子过程执行完毕。然而，在集成环境中，集成应用程序可能位于不同的网络上，或者不一定同时可用，您可能会发现更多用例，其中过程不必等待其所有子过程结束。它只需调用子过程，然后让它在后台异步执行，利用当今许多应用程序中可用的多线程能力。





  - 集成技术：选择合适的技术至关重要。根据可用的集成技术，可能会对特定技能集、硬件或软件产生更高的依赖。这可能会影响项目的速度和敏捷性。


  - 数据格式：不同应用程序之间交换的数据必须遵循预先商定的格式。在企业世界中，这不太可能。因此，集成过程必须有一个中间步骤，将数据从一种格式翻译成另一种格式。


  另一个相关挑战是数据格式的自然演变。容纳数据格式变化和扩展的灵活性在定义集成架构的灵活性方面起着重要作用。


  - 数据与功能：集成不一定是关于共享数据。集成的应用程序可能希望共享功能。考虑这样一个用例：一个应用程序需要调用另一系统中的特定功能，例如检查特定客户的信用评分。可能有一组参数会发送到另一端，以促进远程进程的逻辑。调用远程功能可能很困难，并可能对集成的可靠性产生重大影响。身为
  Salesforce 架构师，你需要了解特定的集成模式，并理解平台的局限性。你将在第 9 章“构建集成解决方案”中学习此内容。


  架构师在设计集成策略或分布式解决方案时，需要考虑多个因素。现在，你需要了解有哪些关键的集成样式，以及它们应该用于什么场景。


  ## 介绍常见的集成样式


  在设计两个或多个系统之间的集成架构时，关键挑战是如何实现它。架构师应该熟悉一些常见的集成样式。你需要对它们有基本了解，并理解如何以及何时使用每种样式。在当今世界，其中一些集成样式已经演变，并作为现代企业集成平台的一部分被使用。接下来，你将熟悉文件传输、统一数据存储、远程过程调用（RPI）、消息传递和混搭集成样式。


  ### 文件传输


  在这种集成样式中，应用程序生成包含其他应用程序将使用的数据的文件。此文件通常采用所有目标系统都能读取的格式，并存储在所有相关系统都能访问的存储库中。这些系统负责将文件转换为它们期望的任何其他格式，而文件生产者则负责根据业务需求定期生成数据文件。


  这种方法面临的挑战之一取决于生成的文件类型，因为有些应用程序可能无法以标准格式（例如 XML）生成数据。这对于旧版应用程序尤其如此。该方法的时机和有限的可扩展性一直是一个问题，而可靠性以及及时发现和报告异常的能力则是另一个问题。此外，这种方法仅适合在特定时间点交换数据快照。它缺乏当今集成应用程序所需的敏捷性、可扩展性和速度。


  在当今世界，客户预期在完成付款后立即收到付款收据。订单提交后，他们将收到订单确认邮件，随后还会收到确认发货日期的另一封邮件。未能提供类似或更好的用户体验意味着你的整体解决方案未能达到当今的数字客户体验标准，而数字客户体验被视为数字企业最重要的成功因素之一。然而，对于合适的用例，这种方法仍然有效，特别是当需要从旧版系统或不支持
  API 且不通过任何其他机制授予你访问其数据权限的外部系统复制报告数据时。


  ### 统一数据存储


  可以这样考虑：如果一组集成应用程序被设计为依赖于共同数据库，那么它们几乎始终以一致的方式集成。如果一个应用程序更新了数据，其他系统在尝试检索数据时，将立即访问最新更新的数据版本。只有缓存的数据可能过期。此外，不需要进行任何数据转换，因为所有相关系统都是为使用给定的底层结构而构建的。


  这种方法的挑战在于应用程序之间以及应用程序与数据库之间存在高度依赖。此外，在当今不断变化的技术环境中，期望所有系统都使用统一数据库是不现实的。这种方法在分布式系统的早期非常流行，尤其是在客户端-服务器架构中。今天，它受到数据湖概念的一定推动。许多企业正在尝试一种概念，即将所有运营数据集中在数据湖中，并在其上提供一组丰富的
  API，为其他应用程序提供灵活的接口以进行集成。


  现实地说，这种方法面临许多挑战，包括当今企业应用程序是为使用其自身数据库而设计和构建的。尝试更改成本非常高且耗时。此外，这可能导致原始应用程序失去关键功能，或最终造成性能瓶颈。


  ### 远程过程调用


  当仅交换数据还不够时，会使用这种集成样式。如你可能已经注意到，前两种方法是在系统之间复制数据。然而，这可能不够。应用程序通常在其依赖的数据发生变化后采取特定操作。例如，应用程序
  A 中订单状态的更改可能会触发应用程序 B 中法律实体的创建。为了简化此过程并减少应用程序依赖，引入了 RPI，其中在应用程序 B 中创建该法律实体的逻辑将被封装并提供给其他系统调用。


  从历史上看，有几种技术实现了 RPI 概念，例如 CORBA 和 .NET remoting。在当今世界，首选的技术是 Web 服务。如果你不熟悉 Web 服务，可以将其视为一组使用常用开放标准和协议构建的封装功能。Web
  服务的主要功能是促进系统之间交换数据。它还继承了一些 RPI 概念，因为被调用的 Web 服务可以反过来调用目标应用程序中的另一个操作。Web 服务主要依赖两种常见标准：SOAP
  和 REST。后者被认为更现代，因为其数据占用小且简单，客户端（包括浏览器或移动应用）可以轻松调用它。


  Web 服务的概念有时会与应用程序编程接口（API）的概念混淆。API 是一种软件接口，用于将特定应用程序的逻辑和功能暴露给其他应用程序。这样，不相关的应用程序可以集成和交互，而不需要知道彼此是如何构建的。两者概念混淆的原因在于，许多现代系统已将其自身的
  API 构建为 Web 服务形式，使用 SOAP 和 REST 等标准。有些系统甚至更进一步，将这些 Web 服务公开给公众，例如 AWS 和 Google。


  ### 消息传递


  消息传递是一种异步集成样式，其中两个或多个系统通过消息总线松散集成。消息总线包含连接发送方到接收方（称为通道）的多个虚拟管道，以及消息路由器（即确定如何导航通道拓扑以将消息传递给正确接收方的组件）。


  在这种样式中，集成系统不一定需要同时运行。该样式的异步特性也意味着它更能够扩展以支持高要求的应用程序。然而，如果消息总线的设计未能实现平滑自动扩展，它本身可能会成为瓶颈。这种集成样式提供了企业服务总线（ESB）的原则，ESB
  在当今企业中被广泛采用。你将在本章后面学习 ESB 和其他集成工具。该样式的原则也是事件驱动集成架构以及事件存储和流处理平台（例如 Apache Kafka）兴起的基础。


  ### 混搭


  混搭是一种相对较新的技术，主要依赖于浏览器。在混搭中，Web 应用程序/网站通过将数据嵌入 UI 来利用其他 Web 应用程序/网站的数据。这种集成样式有时被称为
  UI 级集成。






  你很可能多次遇到过混搭应用。想想那些使用 **Google Maps** 将地图嵌入其网页的应用程序。混搭应用通常依赖于 Web 服务，但也可以简单地是一个 **iFrame**（Salesforce
  具有一种功能，可实现与其他第三方 Web 应用程序的 UI 级集成，称为 **Canvas**）。


  大多数混搭应用都是可视的，尽管有些对用户来说可能是不可见的（例如跟踪 Cookie，它们跟踪 Web 用户在多个网站和设备上的行为）。可视化混搭应用（例如 Google
  Maps）天生具有交互性，并且在当今的 Web 应用程序中被大量用于丰富整体用户体验。


  既然你已经探索了不同的集成样式，现在来看看一些现代的集成方法和工具。作为 Salesforce 架构师，你需要深入理解这些工具之间的差异，以便为你的项目选择合适的工具。


  ## 讨论不同的集成工具


  在讨论当今可用的一些常见类型的集成工具之前，你需要理解 **为什么** 这些工具是必要的。作为 Salesforce 架构师，在选择支持商定的集成策略的正确工具集方面，人们期望你指导客户和集成团队。你应该能够基于有效的逻辑和理由来挑战次优的设计决策。选择错误的工具或在不考虑其潜在影响的情况下选择捷径，可能会证明非常昂贵，并且这可能会以多种方式影响项目/计划，并成为
  Salesforce 实施成功的重大风险。在 CTA 评审委员会期间，你始终需要证明你选择集成工具的理由。


  历史上，集成两个应用程序的常见方式是通过直接通道，中间没有第三方应用程序或中介。这可以通过 **点对点（P2P）集成** 来实现。现在，让我们更仔细地看一下。


  ### 点对点集成


  作为架构师，你需要了解 P2P 集成的功能和局限性，以及为什么你很可能需要一个集成工具（在某些情况下，它也被称为 **中间件**），在企业环境中。本节描述了各种
  P2P 连接。


  #### 唯一通道建立


  在每对需要相互交互的应用程序之间建立一个 **唯一通道**。连接 N 个系统所需的唯一通道数量可以使用公式 N (N–1) / 2 计算。例如，如果你需要通过单向接口连接三个系统，则需要三个唯一通道。但是要链接
  10 个不同的应用程序，你将需要 `10 * (10-1) / 2 = 45` 个唯一通道。当然，所有这些都假设是单向方向。每个通道都必须定期开发、记录、测试和维护。


  尽管如此，这不应被视为 P2P 方法的全部成本。真正的成本将在宏观层面开始显现，因为向环境添加额外系统或将额外系统连接到该环境的成本不是线性的。计算一下将三个新应用程序添加到先前提到的环境中需要多少个新的集成通道。实际上，企业不一定期望新应用程序将链接到每个其他应用程序。但是，成本仍然是不可预测的，并且取决于新应用程序及其业务功能的性质，成本可能会大幅上升。


  集线器-辐射模式需要的通道要少得多。在这种方法中，每个应用程序都是一个辐射，并且仅针对任何给定事务连接到集线器。这会产生一个更加灵活的环境，能够轻松预测连接额外系统所需的新通道数量。


  以下图表比较了两种方法所需的通道数量：


  ![](img/a3b1eecf3c87c814267f2877e8a8be1a_100_0.png)


  图 3.3 – P2P 和集线器-辐射连接中的唯一通道数量


  每个唯一集成通道都预计处理所需的任何数据转换。这将要求你的开发人员充分了解两个集成应用程序。此外，数据转换的逻辑将隐藏在每个通道中，降低了重用或集中管理它们的能力。


  ### 流程编排


  流程编排也需要在通道级别进行处理。这包括任何异常处理和重试机制。例如，考虑这样一个场景：你有一个订单录入应用程序 A，它从在线网页收集客户和订单信息。然后它将这些信息传递给订单管理应用程序
  B，后者分别存储客户数据和订单数据。


  假设两个应用程序都有可被其他应用程序调用的安全 API。在这种情况下，应用程序 A 将调用应用程序 B 的客户创建 API，并且一旦收到流程已成功完成的响应，它将调用订单创建
  API 来创建与最近创建的客户相关的订单。集成通道必须构建为处理客户创建的潜在失败，原因可能包括应用程序 B 不可用。它可能需要实现一个具有全面异常处理和日志记录功能的重试机制。


  拥有通知机制也将很有价值。回滚功能也是可取的。请记住，所有这些都必须在环境中的每个 P2P 集成通道中重复。这将需要大量工作，并必然会降低集成解决方案的整体可靠性。


  ### 整体可靠性


  集成解决方案的整体可靠性是一个需要考虑的重要主题，特别是在使用 P2P 连接时。想象一下三个不同应用程序（即 A、B 和 C）的集成解决方案。对于特定的业务流程，应用程序
  A 需要与应用程序 B 通信，而应用程序 B 反过来又将与应用程序 C 通信。在使用 P2P 连接时，这些可以被视为三个按顺序连接的系统。这意味着集成解决方案的整体可靠性可以使用此公式计算：


  ```

  R = A1-R * A2-R * A3-R ... * AN-R

  ```


  此处，AN-R 是应用程序 N 的可靠性。


  在此示例中，假设应用程序具有以下可靠性：


  - A1-R = 0.9

  - A2-R = 0.8

  - A3-R = 0.5


  在此，整体解决方案的可靠性将为 0.9 x 0.8 x 0.5 = 0.36。


  为简单起见，假设给定应用程序的可靠性不会随时间变化，也不受任何外部因素（例如服务器容量降低或网络延迟）的影响。每个应用程序的历史故障率也未计入。与 P2P 相比，使用集线器-辐射方法将显著提高解决方案的整体可靠性，因为它简化了连接。集线器本身可能会成为瓶颈，但可能出错的东西更少了。


  ### 功能受限


  由于所有数据转换和流程编排都在每个单独的通道上进行，其中许多通道最终都变成了简单的集成。虽然简单性是应努力实现的架构目标，但 P2P 强加的有限技术功能将有效地限制企业引入复杂业务差异化服务的能力。


  ### 使 IT 成为阻碍者


  随着时间的推移，P2P 集成必然会变得难以维护和支持。团队会担心尝试对其中的任何内容进行更改，部署任何新功能甚至热修复的过程将变得越来越缓慢和昂贵。这将有效地使
  IT 部门成为企业的阻碍者，而非推动者。


  ### 高度依赖


  通常，紧密耦合的集成应用程序彼此之间具有高度依赖性。你之前在可靠性和拥有成本的背景下遇到过这种情况。但是，这也可以扩展到其他维度。


  考虑一个用例：先前提到的 10 个集成应用程序中有 3 个已达到生命周期结束并需要更换。由于基于 P2P 的环境中存在高度依赖性，这很可能会直接影响环境中所有其他应用程序。


  ### 可扩展性


  由于所有上述原因，很容易理解为什么 P2P 不是设计可扩展企业解决方案的正确选择。






  在提出集成架构时，你需要牢记本节讨论的所有注意事项。在 CTA 评审委员会考试中，你需要提出最佳技术方案。在现实生活中，你需要能够向利益相关者阐述利弊，并引导他们了解不同的选择，因为这将帮助他们为自己选择最合适的方案。在接下来的章节中，你将学习更多
  Salesforce 特定的集成主题。


  既然你了解点对点连接的挑战，你将发现不同的可用集成工具。其中一些工具天生支持辐射型集成架构。


  ## 提取、转换和加载


  在此数据集成方法中，数据从一个或多个数据源复制到目标数据存储，该目标数据存储不一定与数据源具有相同的结构。这种集成方法遵循文件传输集成样式和更现代的 ETL 工具的一些原则，并使用从消息传递样式继承的一些原则：


  - **数据提取**涉及访问一个或多个数据源并从中提取数据。

  - **数据转换**包括数据在传递到目标之前进行的所有活动。这些活动包括数据清洗、数据格式化、数据丰富、数据验证和数据增强。

  - **数据加载**包括访问并将数据加载到最终目标数据存储所需的进程。


  ETL 工具可能会将数据暂存到暂存区或暂存数据存储中，以对其运行复杂的转换，例如去重、自定义逻辑，或通过查找外部参考数据进行数据丰富。通常，暂存数据存储将与 ETL
  工具在同一服务器上共存，以提供尽可能快的响应时间。三个 ETL 进程都需要时间，因此通常将它们计划运行或以异步方式运行。大多数现代 ETL 工具可以计划每隔几分钟运行特定作业。


  某些 ETL 工具还可以公开可触发的端点，这只是一个 HTTP 监听器，可以接收来自特定授权发送者的消息以触发一个或多个 ETL 作业。例如，可以公开一个监听器来接收来自特定
  Salesforce 实例的特定类型外发消息。一旦接收到外发消息，监听器将触发一个或多个 ETL 作业，以检索或更新 Salesforce 以及其他系统中的数据。


  当今大多数 ETL 工具带有针对不同类型应用程序数据库的*内置连接器*，例如 Salesforce、Microsoft Azure、Amazon Redshift、Amazon
  S3 和 SAP。此外，它们还带有通用数据库 API 的适配器，例如 **开放数据库互连 (ODBC)** 和 **Java 数据库连接 (JDBC)**。有些甚至为
  **文件传输协议 (FTP)** 和 **SSH 文件传输协议 (SFTP)** 提供连接器。这些连接器允许你以优化的方式访问特定的应用程序数据库。例如，Salesforce
  连接器可以构建为根据正在执行的操作和处理的数据量，自动在使用 Salesforce 的标准 REST API、Salesforce SOAP API 或 Salesforce
  Bulk API 之间切换。


  当今，多种 ETL 产品以 SaaS 方式提供。在这种情况下，你需要了解 ETL 工具如何连接到防火墙后面的数据库。企业的托管应用程序和数据库通常位于企业防火墙后面。大多数企业都有严格的法规，防止此类资源暴露。这些称为
  **非军事区 (DMZ)**。


  DMZ 是企业用于向外部暴露面向外部的材料和内容（主要面向不受信任的公众用户）的物理或逻辑子网络。这些 DMZ 中的资源可以被基于云的应用程序访问。然而，这并不是基于云的
  ETL 工具访问企业本地托管应用程序的方式。实现此目的最流行的方法之一是在企业本地网络上安装一个 *客户端应用程序*。这是由 ETL 工具产品提供商提供的受信任应用程序，其主要职责是促进企业本地应用程序和数据库与基于云的
  ETL 工具之间的通信。安全团队仍然需要配置防火墙，以允许客户端与基于云的 ETL 工具双向通信。


  ETL 工具适用于 *数据复制* 操作。它们被设计和构建以提供强健且可扩展的服务，因为它们可以处理数百万甚至数十亿条记录。ETL 工具也非常适合需要大量时间的数据复制，例如复制媒体文件。它们灵活且易于使用。


  作为 Salesforce 架构师，你需要了解当今使用的一些流行 ETL 工具。你还需要了解开箱即用工具（例如 Salesforce Data Loader）的局限性，该工具过于简单，无法归类为
  ETL 工具。当今使用的一些最流行的 ETL 工具包括 Informatica PowerCenter、Informatica Cloud、Talend、Jitterbit
  和 MuleSoft（尽管 MuleSoft 通常被认为更多是一种 ESB 工具，但它支持这两种集成方法）。


  ## 企业服务总线


  **企业服务总线** 是用于特定数据集成方法的名称，其中不同的应用程序通过通信总线进行集成。每个应用程序仅与总线通信。这解耦了应用程序并减少了依赖关系，因此系统可以在不知晓其他系统如何运行的细节的情况下进行通信。这种集成方法遵循
  *消息传递集成* 样式以及 *RPI* 样式的原则。ESB 工具进一步发展了这一概念，目前支持不同的架构概念，例如微服务、API 导向的连接性和事件驱动架构。你将在本章后面学习所有这些概念。


  ESB 支持同步和异步两种通信类型，这使它们非常适合在业务逻辑层上运行的集成，RPI 是其中需要寻找的关键能力。ESB 还利用 *内置连接器* 连接到不同类型的应用程序和数据存储，类似于
  ETL 工具。此处的连接器还将数据从源系统格式转换为总线格式。考虑到 ESB 通常是无状态的，总线中每条消息的状态都包含在消息本身中。当数据在总线上传输时，它被认为处于
  **规范数据格式** 中。规范数据格式只是一种数据模型，它涵盖了环境中同一数据的所有其他模型。此规范数据通常 *转译* 为目标数据模型。**云信息模型 (CIM)**
  是规范数据模型的一个好示例。


  > **注意**

  > 描述 CIM 超出了本书的范围，但强烈建议熟悉它。


  ESB 可以处理复杂的编排。例如，应用程序 A 可能正在向 ESB 发送客户详细信息，ESB 随后将与多个外部应用程序通信以进行实时信用检查，然后调用 CRM
  系统以启动客户入职旅程。客户入职旅程随后生成一个唯一客户 ID，并随成功消息返回给应用程序 A。ESB 可以处理复杂的编排，并可以使用支持数据库作为临时存储或某些数据的缓存。数据库通常与
  ESB 工具在同一服务器上共存，以提供尽可能快的响应时间。


  ESB 还处理任何所需的数据清洗、数据格式化、数据丰富、数据验证和数据增强，以及从/到不同数据格式的转换。例如，应用程序 A 以 **中间文档 (IDoc)**
  格式向 ESB 发送数据，ESB 接收该数据，并使用来自查找/参考数据源的其他数据对其进行增强，然后将其转换为接收者预期的格式，例如 XML、CSV 和 JSON。


  ESB 还可以为同一组件提供多个接口，这对于提供向后兼容性特别有用，尤其是对于 Web 服务。ESB 通常设计为可扩展且能够处理高负载流量，当今几种现代 ESB
  以 SaaS 方式提供，并可选择在本地托管。由于其无状态特性，ESB 不被认为适合长时间运行的操作，例如在系统之间复制大量数据或移动大型媒体文件。


  作为 Salesforce 架构师，你需要了解当今使用的一些流行 ESB。你还需要了解何时以及为何建议将 ESB 作为环境的一部分来利用。确保你充分了解 ESB
  和 ETL 之间的区别，以及各自适用的场景。此外，请确保你理解，在大多数情况下，企业应该使用某种中间件而不是点对点连接。请确保你了解 ESB 的 *理想用例*，以识别它们在给定实现中是否以最佳方式利用。ESB
  和 ETL 在 Salesforce 解决方案中非常常见，你将遇到多个示例，其中




  它们将在后续章节中使用。当今与 Salesforce 一起使用的一些流行 ESB 工具包括 MuleSoft、webMethods Integration Server、IBM
  Integration Bus、TIBCO ActiveMatrix Service Bus 和 WSO2 Enterprise Integrator。


  ### 反向代理


  反向代理是正向代理的对立面；正向代理由客户端用作中介以连接到服务器，而反向代理是服务器（或服务器集群）在其自身与潜在客户端之间放置的东西。


  对于最终客户端，任何检索到的资源都将看起来像是源自代理服务器本身，而非其背后的服务器或服务器集群。反向代理常用于为处理不可信客户端（如未经授权的互联网用户）提供更安全的接口，并屏蔽其背后可能无法处理过载或无法提供所需安全措施（例如无法支持
  HTTPS）的其他应用程序。


  反向代理可以提供诸如将 HTTPS 请求转换为 HTTP、处理 Cookie 和会话数据、在后台将一个请求转换为多个请求，然后合并响应并缓冲传入请求，以保护受屏蔽服务器免受过载影响等功能。反向代理产品的一些提供商包括
  VMware、Citrix Systems 和 F5 Networks。


  ### API 网关


  **API 网关**历史上被用于保护您的内部 Web 服务（或 API——请记住，在 Web 语境中这两个术语可以互换使用，因为大多数现代 API 都是作为 Web
  服务提供的）。企业内部 API 可能未设计用于处理身份验证和可扩展性等主题，因此 API 网关将在其上提供一层来保护 API，并启用一组其他功能，例如 API
  商业化、提供实时分析以及防范 **拒绝服务 (DOS)** 攻击。


  API 网关在概念上与反向代理非常相似，可以被描述为一种特殊的反向代理。在某些情况下，您的架构中可能同时拥有两者，其中 API 网关位于处理负载均衡的反向代理之后。API
  网关通常可以通过 API 或 UI 进行配置。另一方面，反向代理通常通过配置文件进行配置，并需要重新启动才能使用新的配置集。API 网关还提供高级 API 功能，例如速率限制、配额和服务发现。


  身为 Salesforce 架构师，您需要了解当今使用的一些流行 API 网关，例如 MuleSoft、Microsoft Azure API Management、Google
  (Apigee) 和 IBM API Management。


  ## 流处理平台


  **流处理平台**旨在充分利用并行处理的系统。这使它们能够充分利用服务器的计算能力。理想情况下，它们用于事件驱动的集成。该过程继承了 *消息集成* 风格的一些原则。流处理平台通常被称为
  *消息队列平台*。您将很快了解事件驱动的集成方法。


  流处理平台可以处理大量传入数据，因为它们设计用于利用弹性伸缩。它们也易于封装在容器中，这使得它们可以轻松部署在不同平台上，包括云、本地或混合环境。由于其功能和特性，流处理平台被认为是需要大规模可扩展消息平台的用例的理想选择，例如
  IoT 服务器。当今使用的一些最流行的流处理工具包括 Apache Kafka、Amazon Kinesis、Redis 和 RabbitMQ。Salesforce
  Heroku 支持其中一些技术，例如 Kafka。


  至此，您已了解 P2P 连接可能产生的挑战以及中间件的必要性。您还发现了不同类型的中间件，每种都反映了几个价值。您现在将探索一些现代集成方法，例如 **面向服务架构
  (SOA)**、微服务、API 连接性和事件驱动架构。


  ## 探索现代集成方法


  技术格局不断变化，身为 Salesforce 架构师，您每天都在处理现代工具和技术。将您之前涵盖的主题与当今的现代集成方法保持一致非常重要。这些方法中的一些已经失去了流行度，但其概念仍然是其他现代方法的基础。


  要完全理解现代集成方法，并能够与客户、企业架构师和集成架构师就采用最合适的集成策略进行讨论，您需要对当今的现代集成方法有广泛了解，并对其基础有深入扎实的理解。有时，技术爱好者会被新概念和术语所吸引。虽然了解最新市场趋势很重要，但作为高级架构师，您需要了解哪种方法最适合您的客户和手头的项目。


  ## 面向服务架构


  SOA 是一种软件开发方法，旨在将业务逻辑封装为 *服务*，以充分利用可重用代码。每个服务包含完成特定业务用例所需的代码和数据集成，例如下单购物或引入新客户。


  这些服务是松耦合的，并使用 *ESB* 相互通信。这意味着开发人员可以通过在企业范围内重用现有 SOA 服务来节省时间。


  SOA 服务是具有明确特定结果的特定业务活动的逻辑表示。它们作为 *黑盒* 提供给消费者，消费者无需担心这些服务的工作原理。这些服务可以由多个底层服务组成。


  SOA 出现于 20 世纪 90 年代末，是其他现代集成方法（如微服务和事件驱动架构）的基础。SOA 的一些批评者提到其性能和可维护性方面的挑战，以及将其设计到适当粒度级别的困难。


