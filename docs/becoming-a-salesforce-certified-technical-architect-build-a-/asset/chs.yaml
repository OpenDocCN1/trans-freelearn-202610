  \n图 12.6 – 架构布局图（第二稿）\n\n下一组需求描述的是由不同角色（支持代理人）执行的相同流程。从第一条需求开始。\n\n支持代理人应能够使用开始日期和结束日期在特定位置（城市）搜索可用车辆。\n\
  \n你可以假设，为客户创建的 Visualforce 页面/Lightning 组件也可供支持代理人使用。新的 Lightning 组件可以轻松嵌入到 Salesforce\
  \ 的选项卡中。你可以假设该组件具有控制其功能的设计时属性。例如，可以设置一个属性来指示内部团队将使用它。该属性控制页面特定部分的可见性，客户的人员账户可在此部分中选择。\n\
  \n如果你愿意，可以为页面创建线框图。如果时间充裕，这被视为你可以额外完成的工作。重要的是要解释如何将预构建的 Visualforce 页面或 Lightning\
  \ 组件重新用于内部用户。\n\n然后，支持代理人可以口头告知客户可用车辆及相关价格。\n\n该要求将自动满足，因为支持代理人将使用面向客户的同一车辆搜索和预订页面。页面通过\
  \ MuleSoft 持续与 PPA 的计算器通信，并应跨渠道返回一致的定价。\n\n应向客户发送带有特定激活码的电子邮件确认。\n\n此前在此场景中曾针对不同角色（客户）提出过此要求。它将自动满足，因为支持代理人使用面向客户的同一车辆搜索和预订页面，该页面应执行相同的逻辑，包括发送电子邮件通知。\n\
