  *该解决方案应为护士提供每日优化的访问日程。*


  沿用你为其他要求使用的相同逻辑并按相同顺序，你应该得出结论：此类功能需要特定的额外产品来实现。


  幸运的是，Salesforce 有一个可提供此功能的产品，它很可能是市场上最先进的现场服务排程工具之一。Salesforce Field Service 允许为技术人员创建优化的现场访问。在此情况下，技术人员可以是护士。排程器可以考虑许多因素，例如不同的工作时间、技能集、首选技术人员、地理位置、排程策略等更多因素。


