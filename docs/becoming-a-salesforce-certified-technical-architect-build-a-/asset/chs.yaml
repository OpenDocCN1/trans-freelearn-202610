  \n演示结束。下一部分是问答环节，评委将在此阶段提问，以填补演示期间您遗漏或未能清晰解释的任何空白。\n\n## 证明并捍卫您的解决方案\n\n接下来，进入问答环节，这个环节应该是您的朋友。放松一下，为迄今为止取得的成就感到骄傲。您离实现梦想很近了。\n\
  \n在问答环节，您还应预料到评委会更改一些要求，以测试您临场解决问题的能力。这都是考试的一部分。接下来，探索一些示例问题和答案。\n\n评委可能会决定质疑您提出的某个解决方案。这不一定意味着它是错误的。即使语气暗示如此，也要相信自己和您的解决方案。要辩护，但不要过度辩护。如果您发现自己犯了错误，请谦虚接受并纠正您的解决方案。评委会感激这一点。\n\
  \n例如，评委可能会提出以下问题：\n\n> 您提议在解决方案中引入集成接口，从设备中拉取智能电表读数。这意味着在可能的情况下，我们无法获取电表的实时读数。您为什么提议这个解决方案，是否有其他替代方案可以为我们提供实时数据？\n\
  \n在回答此类问题时，请确保您的回答犀利且切中要点。不要试图混淆视听并侥幸逃脱。您的回答可以如下所示：\n\n> 问题表明，只有两个系统可以将电表读数推送到服务器（via\
  \ pub/sub）。而且，要求是每月读取这些电表一次。PDU 非常希望开发一种统一机制，以从其所有供应商处检索智能电表数据。\n\n> 因此，我想到在 MuleSoft\
  \ 中开发一个定期每月的 MuleSoft 作业，从所有这些平台拉取电表读数，然后用读数更新 Salesforce。\n\n> 或者，我们可以研究是否要在不支持它的两个系统之上引入一个\
  \ pub/sub 层。这可以通过将 MuleSoft 连接到它们的数据库并定期检查更改来实现，前提是这些系统可以提供一种检索更改数据增量的机制，类似于 CDC\
  \ 概念。\n\n> 如果这些系统不支持此功能，我们可以考虑以两种不同的方式与这些系统集成。第一种是统一拉取接口，第二种是使用 MuleSoft 订阅两个系统提供的\
  \ pub/sub 频道。这样，我们就可以从四个系统中的两个系统实时获取更新。不过，这将违背公司的原始要求。\n\n> 我倾向于拉取机制，因为它确保我们不会不必要地更新\
  \ Salesforce 记录。这将确保我们遵守治理限制并避免任何性能挑战。\n\n您的回答不应超过三分钟。请记住，问答时间有限，您必须确保为评委留出提问尽可能多问题的时间。问答阶段是您的朋友。\n\
  \n\n\n\n\nNext, explore another question raised by the judges:\n\n> *你们提到 MuleSoft\
  \ 将使用 OAuth 2.0 Web 服务器流，随后使用刷新令牌流来对 Salesforce 进行身份验证。是否有其他可使用的身份验证流，以及在什么情况下会使用每种流？*\n\
  \nMuleSoft 正在对 Salesforce 进行身份验证并与其通信。这是一种服务器到服务器或机器到机器的身份验证。本可以使用 JWT 流来实现，JWT\
  \ 流常用于类似场景，并且两个平台都支持。您的回答可以如下：\n\n我本可以使用 OAuth 2.0 JWT 流。它是一种支持机器到机器身份验证的流。两种流都可以满足此要求。但是，使用上下文用户（context\
  \ user）而非命名主体/集成用户/服务用户（named principal/integration user/service user）进行身份验证时，JWT\
