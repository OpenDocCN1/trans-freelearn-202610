  > 其他图表没有更改。\n\n情景到此结束。在接下来的章节中，你将继续看到更多与集成相关的需求。但你现在已经了解了确定集成接口正确设计的结构化方法。\n\n在此场景中，你需要连接到本地托管的应用程序；因此，使用中间件很容易得到合理化。但是，集成中间件在许多其他用例中也能增加价值。请确保你仔细阅读第\
