  \n在本章中，您处理了场景的第一部分。业务流程是任何数字化解决方案的核心和灵魂。创建全面解决方案从了解每个业务流程、将其划分为易于消化的块，然后将其作为整体来解决开始，这不足为奇。\n\
  \n您遇到了有趣的用例和设计决策，并在知道有其他替代方案的情况下，逻辑上选择了正确的方法。您为一些潜在问题准备了现成的答案，并选择了简单但可扩展的架构，以便在需要时有空间进行更改。\n\
  \n您创建了多个业务流程图，在演示过程中通过可视化解决方案，这些图表将为您提供很大帮助。\n\n在下一章中，您将继续解决场景并制作演示文稿。本章涵盖了大量内容，但下一章仍有更多内容需要涵盖。\n\
  \n## 展示与辩护：首次模拟\n\n在本章中，您将为第一个完整模拟场景继续创建端到端解决方案。您已在第 12 章“练习评审委员会：首次模拟”中涵盖了场景的大部分内容，但仍有许多主题需要涵盖。在本章中，您将继续分析和解决每个共享要求，然后练习制作一些演示文稿。\n\
  \n为让您获得最贴近真实考试的体验，您将完成一次练习问答会议，并根据评委的反馈来辩护、证明和更改解决方案。\n\n阅读本章后，建议您重新阅读场景并尝试独立解决它。\n\
  \n在本章中，您将涵盖以下主题：\n\n- 继续分析要求并创建端到端解决方案\n- 展示并证明您的解决方案\n\n到本章结束时，您将完成第一个模拟场景。您将更熟悉完整模拟场景的复杂性，并为考试做好更充分的准备。您还将学会在有限的时间内展示解决方案，并在问答期间证明其合理性。\n\
  \n## 继续分析要求并创建端到端解决方案\n\n您之前在第 12 章“练习评审委员会：首次模拟”中已涵盖业务流程要求。到该章结束时，您已对潜在数据模型和架构有了良好的了解。您已经将一些对象标记为潜在\
  \ LDV。\n\n接下来，有一组您需要解决的数据迁移要求。完成后，您将对每个数据模型对象中的潜在数据量有更深入的了解，这将帮助您制定 LDV 缓解策略。\n\n\
  首先处理数据迁移要求。\n\n\n\n\n## 分析数据迁移需求\n\n本部分中的需求可能会影响您的一些图表，例如总体架构图和数据模型。\n\n一些候选人倾向于创建图表来解释其拟议的数据迁移策略。这些图表在\
  \ CTA 评审委员会考试中被视为可选内容；因此，本书中不会创建此类图表。如果创建额外图表能帮助您组织和解释思路，请随意创建。否则，是时候从第一个共享数据迁移需求开始了。\n\
  \nPPA 希望将其所有当前客户和租赁管理应用程序的数据迁移到新系统。\n\n这是一个可预测的需求，尤其是考虑到 PPA 已经表示有意停用所有五个遗留租赁管理应用程序。但请记住，这五个应用程序可能基于不同的技术，使用不同的数据库类型，并属于不同的代际。下一个需求包含更多详细信息。请转到下一个，其从以下内容开始：\n\
  \nPPA 知道当前数据包含许多冗余和重复项，并希望获得您的指导来处理此情况。\n\nPPA 在数据质量方面一直存在困难，尤其是冗余问题。您如何帮助他们实现以下目标？\n\
  \n- 对其现有数据进行去重\n- 为每条记录打质量分，以帮助识别低质量记录（例如地址详情不完整或电话号码格式不规范）\n- 防止未来创建重复记录\n\nSalesforce\
  \ 原生的 **重复规则** 可以帮助防止创建重复记录。它们有其局限性，但对于简单和中等复杂度的场景来说，是一个不错的工具。\n\n然而，这无法解决前两个需求。去重可能会变得复杂，尤其是在缺乏强属性（例如特定格式的电子邮件地址或电话号码）的情况下。地址和姓名等数据被视为弱属性，因为它们可以以多种格式提供。此外，姓名的拼写方式各不相同，并且可能包含非拉丁字符。\n\
  \n在这种情况下，您需要一个能够执行模糊逻辑匹配而非精确匹配的工具（Salesforce 的重复规则仅提供有限的此类功能）。您可能还需要为每个属性分配权重，以帮助合并逻辑。\n\
  \n此外，您需要一个能够将任何相关记录重新关联到合并后的客户记录的工具。在此情况下，这与历史租赁记录相关。如果多个客户记录合并为一条，您需要所有相关租赁记录都指向新创建的金色记录。\n\
  \n计算每条记录的质量也可能需要一些复杂逻辑，因为它涉及将多条记录与预定义标准进行比较并相应更新一些记录。标准可以简单到预定义的电话号码格式，也可以复杂到整个子流程。\n\
  \n所有这些功能都可以定制开发，前提是您有时间和预算，或者直接购买并配置。这通常可以节省大量资金（考虑整体 ROI 计算）。\n\n作为 CTA，您被期望提出技术上最准确的解决方案。在此情况下，等待\
  \ 9-18 个月直到工具定制开发并测试完成，再延迟整个项目毫无意义。提出一个经过实战检验的 MDM 工具并可配置以满足所有这些需求，才是非常合理的做法。\n\n\
  在评审委员会上，您被期望命名拟议的产品，就像您在实际工作中通常做的那样。您可以建议 **Informatica** 之类的工具。但是，您不一定需要指定确切的子产品名称，因为它们经常更改。\n\
  \n更新您的总体架构图和集成接口，以指示新的迁移接口，然后转到下一个需求。\n\n*PPA 在其每个当前租赁管理应用程序中拥有大约 5000 万条租赁记录。*\n\
  \n其中大部分是出于历史目的存储的，因为 PPA 希望保留租赁记录至少 10 年。PPA 希望继续允许其销售和支持人员在新系统中访问这些记录。\n\nPPA 在其五个旧系统中总共拥有大约\
  \ 2.5 亿条租赁记录（5000 万 × 5）。将所有这些数据迁移到 Salesforce 将把 *Order（订单）* 对象转变为 LDV（大数据量对象）。更不用说，*OrderItem（订单项）*\
  \ 对象将包含至少相同数量的记录。\n\n可以合理地假设，这些租赁记录中的大部分已关闭，仅为遵守 PPA 的政策而保留。因此，您可以将活跃的 *Order（订单）*\
  \ 和 *OrderItem（订单项）* 对象迁移到 Salesforce，同时将任何历史记录迁移到 Heroku。\n\nPPA 仍然希望其销售和支持人员能够访问历史记录。然而，与其将它们复制到\
  \ Salesforce，不如使用 **Salesforce Connect** 和 **外部对象** 实时检索它们。\n\n> **注意**\n>\n> Heroku\
  \ 在 **Heroku Connect** 基础上提供 **Heroku External Objects** 功能，为 Heroku PostgreSQL\
  \ 数据库提供易于使用的 **开放数据协议 (OData)** 封装层。\n\n您需要将外部对象添加到数据模型中。您还需要更新总体架构图和集成接口列表，以指示新的迁移接口以及\
  \ Heroku 和 Salesforce 之间的新集成接口。\n\n接下来，更新您的图表。您的数据模型应如下所示：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_416_0.png)\n\
  \n图 13.1 – 数据模型（第三版）\n\n此需求并未专门要求解释您的数据迁移策略。尽管如此，在考试中，您仍然被期望做到这一点。您需要解释以下内容：\n\n\
  - 您计划如何从其数据源获取数据？\n- 您最终将如何将数据加载到 Salesforce？客户需要注意哪些注意事项，以及如何降低潜在风险？例如，谁将拥有新迁移的记录？如何确保所有记录都已成功迁移？如何确保在迁移期间不违反任何控制器限制？\n\
  - 拟议的迁移计划是什么？\n- 您的迁移方法是什么（大爆炸方式与持续累积方式）？为什么？\n\n您在第 7 章“设计可扩展的 Salesforce 数据架构”中遇到过类似的挑战。您需要制定一个全面的数据迁移方案，包含在演示文稿中，以清晰回答上述所有问题。您将在本章稍后完成此操作。\n\
  \n在此之前，您需要审查您的 LDV 缓解策略。您已将几个对象标记为潜在 LDV，但您仍需要进行计算以确认它们是否可以被视为 LDV。一旦确认，您需要制定缓解策略。您将在接下来解决此挑战。\n\
  \n## 审查已识别的 LDV 并制定缓解策略\n\n查看数据模型（图 13.1）中标记的 LDV，并验证所识别的对象是否确实符合 LDV 的标准。\n\n您知道，PPA\
  \ 在全球拥有大约一百万注册用户，每年平均租赁 100 万辆汽车。这意味着 Order 对象每年将增长 1000 万条记录。该对象符合 LDV 的标准。此外，OrderItem\
  \ 对象将至少有 1000 万条更多记录。合理地推测，它可能包含更多记录，假设 50% 的租赁除了汽车租赁本身外，还会包含额外的行项目，例如保险附加项。\n\n\
  这意味着每年将有超过 1500 万条新记录。除此之外，Payment__c 对象每个 Order 至少包含一条记录。Invoice_Header__c 对象每个\
  \ Order 至少包含一条记录（某些租赁可能会因罚款或所需汽车维护而收到多张发票）。您还将为每个租赁创建至少一条 Case 记录（用于检查反馈）。\n\n大量的\
  \ Order、OrderItem、Case、Payment__c 和 Invoice_Header__c 记录可能会影响 CRUD 操作的速度。它们都被视为\
  \ LDV，因此您需要制定缓解策略。\n\n考虑到您面临的挑战与 CRUD 效率相关，像精简表这样的解决方案不会增加多少价值。自定义索引仅有助于读取操作。分区可能会有所帮助，但会增加不必要的复杂性。相比之下，在此情况下，最合适的选择是将一些非必要数据卸载到非平台存储中。\n\
  \n\n\n\n以这种方式归档数据，可确保这四个对象保持尽可能精简。您的归档策略可以包含所有已关闭的 Order 和 Case 记录。\n\n您可以将数据归档到\
  \ Salesforce Big Objects、外部存储（例如数据仓库）或能够处理海量记录的平台（例如 AWS 或 Heroku）。您的架构中已有 Heroku。在这种情况下，决策应该很容易。您可以使用\
  \ Heroku Connect 将数据传输到 Heroku PostgreSQL 数据库，将归档数据传输到另一个通过 Heroku Connect 和 Heroku\
  \ External Objects 暴露给 Salesforce Connect 的 PostgreSQL 数据库，然后从第一个 PostgreSQL 数据库和\
  \ Salesforce 中删除归档的记录。\n\n更新您的架构图，并在 Heroku 和 Salesforce 之间添加另一个集成接口。您的架构图应如下所示：\n\
  \n![](img/a3b1eecf3c87c814267f2877e8a8be1a_418_0.png)\n\n图 13.2 – 架构图（第四个草稿）\n\n\
  更新您的集成接口列表，然后进入下一组要求，该组要求与可访问性和安全性相关。\n\n## 分析可访问性和安全性要求\n\n在业务流程要求之后，可访问性和安全性部分的要求通常是第二难处理的。与业务流程要求相比，它们通常不冗长，而是更具技术挑战性。\n\
  \n根据可访问性和安全性要求的拟议解决方案，您可能需要调整数据模型、角色层次结构，以及可能的参与者和许可证图。好消息是，平台上可用的共享和可见性功能数量有限。您可选择的工具池较小。但是，您必须非常了解每种工具，才能选择正确的组合。\n\
  \n从第一个共享要求开始，该要求以以下内容开头：\n\n*客户账户应对全球办公室经理、销售代理和服务代理可见。*\n\n您应该花足够的时间来分析这些要求。乍一看，这些要求可能很简单，但如果您没有彻底考虑所有可能的挑战，则有可能会陷入违反总督限制的解决方案中。在问答环节即时更改此类解决方案具有挑战性。请彻底分析这些要求以避免此类情况。\n\
  \n考虑到该要求表明某些记录对某些用户可见而对其他用户不可见，Account 对象的组织范围默认值（OWD）应设置为私有。\n\n这将限制对用户不拥有的账户的访问。您需要想出一种机制，将所有账户共享给上述用户集（即除技术人员之外的所有内部用户），同时仅允许技术人员访问其所在国家的客户账户。\n\
  \n解决此问题有多种方法。您需要选择一种易于维护、可扩展且不会威胁总督限制的方案。\n\n基于您在第 12 章“练习：评审委员会：第一次模拟”中开发的角色层次结构，您可以提出以下解决方案：\n\
  \n- 1. 您可以在办公室经理下方引入两个角色，分别代表该办公室的销售代表和技术人员。\n- 2. 基于所有者的共享规则依赖于账户所有者。客户账户可能由不同角色的多个用户拥有。基于条件的共享规则更适合此要求。您可以配置一组基于条件的共享规则，将所有账户共享给销售代理，这将自动授予角色层次结构中高于他们的所有用户访问客户账户的权限。\n\
  - 3. 您可以配置另一组基于条件的共享规则，将客户账户共享给特定国家的技术人员。\n\n听起来不错？其实不然。\n\n> **注意**\n> 您可以为任何对象定义的基于条件的共享规则数量有限：每个对象最多\
  \ 50 个。您可以通过以下链接查看最新限制：`https://packt.link/OoGuu`。\n\nPPA 仅在 10 个国家运营。但是，每个国家包含多个城市，每个城市包含多个办事处。将客户账户共享给销售代理角色所需的共享规则数量可能轻松超过\
  \ 50 个。\n\n您可以计算一下，但即使数量略低于 50，您也在创建一个处于总督限制边缘的解决方案。这不能被视为可扩展的解决方案。\n\n但是，除了角色层次结构和共享规则之外，您还可以使用另一种工具来解决此挑战。您可以为所有销售代理创建一个公共组。如果您选择将所有销售代理用户添加到该组，则难以维护（想象在用户入职或离职时添加/删除用户所需的工作量）。但是，您可以改为添加角色。\n\
  \n通过将所有销售代理角色添加到该组，并确保该组的 **使用层次结构授予访问权限** 复选框已选中，您将获得一个易于维护且可扩展的解决方案。您只需要一个基于条件的共享规则，即可将所有客户账户记录共享给此公共组。这将确保所有销售代理以及角色层次结构中高于他们的任何人都有权访问这些账户。\n\
  \n您可以为技术人员采用类似的方法，但您需要 10 个不同的公共组，每个国家一个。您还需要 10 个基于条件的共享规则。这不太具备可扩展性，但远低于总督限制。您还可以指出，如果公司继续扩展到其他国家，可能需要切换到基于\
  \ Apex 的共享。\n\n如有需要，请更新您的角色层次结构；它现在应如下所示：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_421_0.png)\n\
  \n图 13.3 – 角色层次结构（最终）\n\n现在，进入下一项要求。\n\n> 支持事件应仅对支持代理及其经理可见。\n\n您可以采用与前一项要求中使用的类似方法。您可以创建一个公共组，确保选中\
  \ **使用层次结构授予访问权限** 复选框，并将所有支持代理角色添加到该组。您还需要将 Case 对象的 OWD 设置为私有，然后创建一个基于条件的共享规则，将特定类型的\
  \ Case 记录共享给此公共组。请记住，一旦将 Account 对象的 OWD 设置为私有，您就别无选择，只能将 Case 对象也设置为私有。\n\n基于条件的共享规则将授予支持代理、其经理以及角色层次结构中高于他们的所有人对\
