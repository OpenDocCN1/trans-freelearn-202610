  ### 图 13.6 – 开发生命周期图（最终）\n\n您还需要一个自动化构建和部署工具。有开源解决方案，例如 Jenkins，以及专为 Salesforce\
  \ 环境构建的工具，例如 Copado 和 AutoRABIT。选择一个并将其添加到您的环境中。另外，请记住添加自动化测试工具，例如 Selenium 或 Provar。\n\
  \n进入下一个要求，其开头如下：\n\n*历史上，系统集成商在处理其他平台时习惯遵循自己的编码标准。*\n\n这是一个有趣的要求。这里的挑战与不同 SI 团队之间缺乏标准化和沟通有关。\n\
  \nCI/CD 能解决这个问题吗？不太能。它可以通过自动化代码扫描和受控合并稍微改善情况，但要显著改善标准化、沟通、复用性和整体质量，您需要引入 Salesforce\
  \ CoE。\n\n汇集功能和技术资源，您甚至可以引入设计权威作为另一种组织结构，以确保在开始任何开发工作之前，讨论、验证并批准每一个需求。\n\n在第 10\
  \ 章“开发生命周期和部署规划”中，您了解了每个结构的价值和结构。图 10.3（提议的 CoE 结构）和图 10.4（提议的 DA 结构）也可帮助您可视化这两种结构。\n\
  \n不太可能要求您绘制 CoE 或 DA 结构，但您很可能会被问及它们的价值以及解决的挑战。如果您正在参与同时拥有这两者的项目，那真是个好消息。否则，不要害怕向您的利益相关者提出这一建议。这种结构为项目带来实实在在的好处，同时有助于培养其成员的技能。这对每个人都是双赢的。\n\
  \n*PPA 有一位新的平台所有者，她是从另一家也使用 Salesforce 的公司加入的。*\n\n基于她在之前工作单位的经验，新加入的平台所有者报告称，UAT\
  \ 中多次修复了错误，但随后又在生产环境中重新出现。这种令人遗憾的经历影响了许多人对平台敏捷性和采用现代发布管理概念能力的评判。通常，这最终会变成对合理概念的糟糕改编。在其他情况下，例如这一情况，显然是由于环境管理策略和发布周期不佳所致。\n\
  \n当 UAT 中的错误被修复时，UAT 的代码库将与较低环境中的代码库不一致。下次从较低级别的环境（例如开发环境）推广功能时，可能会轻易覆盖之前在 UAT 中所做的更改。最终，当推送到生产环境时，已解决的错误又会回来。\n\
  \n您可以简单地说，这种情况发生是因为客户没有使用适当的 CI/CD 发布管理策略，可能依赖于变更集等机制。然而，这不被视为足够好的回答。您不应该使用流行语，而是需要详细解释、教育和证明。这正是\
  \ CTA 在评审委员会和实际工作中应该做出的回应。\n\n这个问题可以通过以下三种方式之一解决：\n\n- 修复 UAT 错误后，每个较低环境都应刷新其代码库以获取此新更改。这需要高度的纪律和组织性。\n\
  - 在推广较低环境的代码时，避免覆盖 UAT 中现有的冲突功能。尝试与开发团队解决这个问题。这并不总是容易的，在处理 Salesforce Flows 等点击式配置功能时可能会变得困难。\n\
  - 在热修复分支和环境中修复错误，将分支合并到 UAT，然后将其推广到生产环境。热修复分支也用于刷新所有较低级别的环境分支。此选项听起来与第一个非常相似，但区别在于它更可追踪且更易于治理。您仍然需要适当水平的纪律和组织性。\n\
  \n像 Copado 这样的发布管理工具使用图形用户界面（GUI）和点击式配置功能，而不是纯命令行界面（CLI），使这一过程比通常更容易。\n\n您必须对这类要求给出足够详细的回答，但不要过度展开。请留意时间，确保留出足够时间涵盖其他主题，无论是在演示环节还是问答环节。\n\
  \n进入本节的最后一个要求，其开头如下：\n\n*PPA 希望先在意大利发布该解决方案，然后根据预先约定的时间表在其他国家推出相同的解决方案。*\n\n您已经解释过在这些情况下\
  \ CoE 结构的价值。它是确保每个人都参与、分享想法和反馈，并了解计划功能和路线图的最佳组织结构。冲突的业务需求正是在此被发现和解决。CoE 将旨在在所有国家创建统一流程。\n\
  \n但是，除此之外，您还需要合适的交付方法来确保解决方案的顺利推出。CoE 和 DA 将确保以正确的方式收集、验证和实施需求，以保证高质量。此外，它们还将确保功能的开发能够适应各国之间的轻微流程差异。100%\
  \ 统一的全球流程是一个难以实现的目标。您的解决方案应设计为以可扩展的方式适应并接纳轻微差异。\n\n在选择合适的交付方法时，请考虑以下几点：\n\n- 严格的\
  \ **瀑布方法** 将确保明确的范围和详细的端到端解决方案。然而，它也会在开发团队和最终将使用该解决方案的业务之间造成巨大的隔阂。此外，它具有更长的价值实现周期。\n\
  \n- **敏捷方法** 确保业务更贴近所开发的解决方案。这能提高采用率并实现快速反馈。然而，如果没有清晰的愿景，这很容易创建一个对某个国家完美契合但对其他国家不合适的解决方案。即使在短期内，这样也很难维护。\n\
  \n- **混合方法** 确保您在做出小幅度妥协的同时兼得两者之长。在蓝图阶段，您会获得一个相对明确的范围，并覆盖 70%-80% 范围的端到端解决方案。它不如瀑布方法那样严格和明确，但它从第一天起就能降低许多风险。\n\
  \n在冲刺的细化活动中，解决方案会进一步澄清。有了 DA 结构，您可以确保在开始交付之前，每个用户故事的解决方案都会被合适的人员质疑并进行技术验证。\n\n再次强调，在解释此类要求时请留意时间。一些候选人在解释这部分时会过度展开，大多是在描述个人经历。另外，请记住您的时间非常有限。您的首要目标是通过评审委员会。\n\
  \n许多候选人在演示的这个阶段会精疲力竭，考虑到到目前为止所需的心理和情感努力，这完全可以理解。但是，您需要保持镇定。您离成为 CTA 很近了。还不要放松对方向盘的控制。\n\
  \n项目开发部分的要求到此结束。下一部分通常较有限，包含其他一般主题和挑战。保持势头，继续进行下一组要求。\n\n## 分析其他要求\n\n在完整的模拟场景中，其他要求部分可能包含其他部分尚未涵盖的任何其他内容的进一步要求。此部分通常包含有限数量的要求。\n\
  \n在这一阶段，您对 Salesforce 平台及其生态系统的经验和广泛知识将发挥至关重要的作用。接下来，探索共享要求。\n\n_PPA 希望确保开发环境中的数据始终经过匿名化处理。_\n\
  \n\n\n\n\n今天，考虑到所有数据隐私法规，这是一项基本要求。作为 CTA，您不仅应准备好回答这个问题，还应主动向客户提出该问题。\n\n并非所有用户都应或能够访问生产环境数据。即使部分用户拥有访问权限，也可能仅限于特定记录集。在不同开发沙箱中开发新功能或修复\
  \ bug 时，确保开发者和测试人员使用的是测试数据至关重要。即使在处理暂存环境（其中的数据应尽可能接近生产环境）时，您仍需确保数据经过匿名化、去标识化处理，甚至被删除。以下是对这三种选项的简要说明：\n\
  \n- **匿名化**：通过更改和打乱字段内容来工作，使其变得无法解释。例如，名为雷切尔·格林的联系人可能变成 hA73Hns#d$。诸如 RachelG@gmail.com\
  \ 之类的电子邮件地址可能变成 JA7ehK23 之类的不可读值。\n\n- **去标识化**：将字段转换为与原始值无关的可读值。例如，名为雷切尔·格林的联系人可能变成马克·贝茨。诸如\
  \ RachelG@gmail.com 之类的电子邮件地址可能变成 MarkBates@SomeDomain.com。\n\n- **删除**：这更明显；此方法只是清空目标字段。\n\
  \nDeveloper 和 Developer Pro 沙箱包含您生产环境组织的元数据副本，但不包含数据。但是，Partial Copy 沙箱包含元数据和您定义的选定数据集。Full\
  \ Copy 沙箱包含您所有生产数据和元数据的副本。\n\n在此处，您的策略可以是执行以下操作：\n\n- 确保在 Developer 和 Developer\
  \ Pro 沙箱中使用的数据始终是专门创建的测试数据。\n\n- 确保 Partial 或 Full Copy 沙箱中的任何数据都经过匿名化或去标识化处理。您可以使用\
  \ **Salesforce Data Mask**（这是一个托管包）、自定义开发的 ETL 作业、自定义开发的 Apex 代码或 **Odaseva** 或\
  \ **OQCT** 等第三方工具来实现这一点。\n\n> > **注意**\n> > 您可以在以下链接中找到有关 **Salesforce Data Mask**\
  \ 的更多详细信息：https://packet.link/pTX3n.\n\n建议为 PPA 使用该工具。将 **Salesforce Data Mask**\
