  ## 本书适合人群


  本书面向对 Salesforce 平台有深入理解并拥有多年架构师经验的 Salesforce 专业人士。这些架构师理想情况下希望通过争取 Salesforce
  CTA 认证来进一步提升自己的职业生涯。本书也面向那些希望通过学习如何在 Salesforce 平台上设计安全、高性能的技术解决方案，以及如何有效地向业务利益相关者传达技术解决方案和设计取舍，并采用确保质量与成功的交付框架，来为自己增加更多技能的架构师。


  随着 Salesforce 生态系统的当前快速增长，某些工作场所中传统角色之间的界限正在变得模糊。拥有能够连接不同团队的卓越人才的价值变得至关重要。未来的 CTAs
  不怕深入挖掘业务挑战，并提出艰难的问题，以揭示特定需求背后的真实业务价值。他们喜欢深入研究问题，并卷起袖子选择适用于当前和未来潜在需求的正确解决方案方法。他们毫不犹豫地加入与开发团队的对话，提供指导和最佳实践，然后与项目管理团队合作，为利益相关者准备尖端的演示文稿。


  ## 本书内容概要


  *第 1 章，开始你的 CTA 之旅，* 提供了关于本书和认证的一般信息。你将了解典型 CTA 的画像，它与 Salesforce 架构师日常工作的相关性，以及为什么了解
  CTA 的思维方式至关重要，即使对于不一定以 CTA 证书为目标的高级架构师也是如此。本章还详细介绍了评审委员会考试设置（无论是物理还是虚拟）的详情。


  *第 2 章，核心架构概念：数据生命周期，* 探讨架构师需要掌握的与数据相关的核心架构技能。其中部分知识与平台无关，尽管其他部分对 Salesforce 架构师尤为重要。这些技能将在本书后续部分以及评审委员会考试本身中大量使用。


  *第 3 章，核心架构概念：集成与加密，* 探讨架构师需要掌握的与集成和加密相关的核心架构技能。其中部分知识与平台无关，尽管其他部分对 Salesforce 架构师尤为重要。这些技能将在本书后续部分以及评审委员会考试本身中大量使用。


  *第 4 章，核心架构概念：身份与访问管理，* 探讨架构师需要掌握的与 **身份与访问管理** (IAM) 相关的核心架构技能。其中部分知识与平台无关，尽管其他部分对
  Salesforce 架构师尤为重要。这些技能将在本书后续部分以及，当然，评审委员会考试本身中大量使用。


  *第 5 章，开发可扩展系统架构，* 对一些最棘手的系统架构领域进行了深入回顾，例如确定构成整体解决方案的正确系统选择，包括本地和平台外组件，并考虑平台的功能、约束和限制。这些知识将通过一个微型假设场景进一步加强。


  *第 6 章，在 Salesforce 中制定安全架构，* 对安全性中一些最棘手的领域进行了深入回顾，例如了解声明式平台安全功能以及如何使用它们来满足记录级可见性和安全性要求。这些知识将通过一个微型假设场景进一步加强。






  第 7 章，设计可扩展的 Salesforce 数据架构，深入审查了数据中一些最棘手的领域，例如设计正确的数据迁移策略和工具，以及架构师需要牢记的不同注意事项。这种知识将通过一个小型假设场景进一步加深。


  第 8 章，创建精益解决方案架构，深入审查了解决方案架构中一些最棘手的领域，例如选择适当的声明式和编程式功能组合以满足特定需求。这种知识将通过一个小型假设场景进一步加深。


  第 9 章，打造集成解决方案，深入审查了集成中一些最棘手的领域，例如合理选择用于与外部系统集成的适当技术，并考虑平台的功能和限制。这种知识将通过一个小型假设场景进一步加深。


  第 10 章，开发生命周期与部署规划，深入审查了开发生命周期和部署规划中一些最棘手的领域，例如推荐合适的全面测试策略并缓解不同项目风险的能力。这种知识将通过一个小型假设场景进一步加深。


  第 11 章，沟通与社交化你的解决方案，深入审查了一些最棘手的沟通领域。这包括解释架构师需要掌握的一组关键软技能，以便向评审委员会评委或在现实生活中向内部或外部客户展示端到端解决方案。这还包括以合理且理性的方式阐述所提议解决方案架构背后的优势、局限性、注意事项和设计选择，并做好处理异议和即时调整的准备。这种知识将通过一个小型假设场景进一步加深。


  第 12 章，演练评审委员会：首次模拟，将之前章节中涵盖的所有知识和技能付诸实践。你将接触到你的第一个完整假设场景。你将逐步解决它，从识别需求、创建草稿解决方案开始，再将所有元素结合起来向评委或在现实生活中向内部或外部客户展示一个有效的解决方案。


  第 13 章，展示与辩护：首次模拟，将之前章节中涵盖的所有知识和技能付诸实践。你将继续使用上一章的假设场景，并利用草稿解决方案创建一个精炼的端到端解决方案和演示文稿。你将通过逐步指南获得实操经验，其中解决方案会被审查、根据需要调整，并创建产出物的最终版本。然后你将利用所有这些内容向评委或在现实生活中向内部或外部客户展示一个有效的解决方案。


  第 14 章，演练评审委员会：第二次模拟，将之前章节中涵盖的所有知识和技能付诸实践。你将接触到你的第二个完整假设场景。你将逐步解决它，从识别需求、创建草稿解决方案开始，再将所有元素结合起来向评委或在现实生活中向内部或外部客户展示一个有效的解决方案。


  第 15 章，展示与辩护：第二次模拟，将之前章节中涵盖的所有知识和技能付诸实践。你将继续使用上一章的假设场景，并利用草稿解决方案创建一个精炼的端到端解决方案和演示文稿。你将通过逐步指南获得实操经验，其中解决方案会被审查、根据需要调整，并创建产出物的最终版本。然后你将利用所有这些内容向评委或在现实生活中向内部或外部客户展示一个有效的策略。


  附录，技巧与诀窍，以及前进之路，提供了一系列技巧和诀窍，帮助考生在评审当天取得成功，首先是演示过程中应遵循的最佳实践，接着是关于时间管理的提示。本章突出了其他
  CTA 通过评审委员会考试所使用的不同策略，并提供了一组准备评审委员会的考生应考虑的建议活动，包括如何为最后一英里做准备、在获得支持方面有哪些资源和群组可用，以及如何在评审委员会考试当天进入正确的心态。


