- '# 设计可扩展的 Salesforce 数据架构


  在本章中，你将继续探索 CTA 必须掌握的其他 Salesforce 特定知识领域。数据领域是七个领域中的第三个。你将理解所需的知识，然后使用每个领域的小型假设场景完成一项动手练习。


  数据领域范围广泛，存在大量的相互依赖。它影响其他多个领域，反之亦然，并可以被视为任何 Salesforce 解决方案的核心部分。它涉及理解设计数据模型的基本原则，而数据模型是任何软件解决方案的核心。可以说，几个世界一流应用程序成功的关键在于其设计良好的数据模型。


  一名成功的数据架构师还应能够基于逻辑和经验发现数据模型中的潜在挑战，并提出切实可行的缓解策略。如果这些挑战不加以缓解，可能会直接影响解决方案的性能或可扩展性。


  以正确的方式组织数据，将使你能够从已收集的数据中交付价值。作为 Salesforce 数据架构师，你需要引导项目相关方了解不同的工具和技术以实现这一目标。你还应该就管理数据和将其迁移到目标平台的最佳方法向他们提供建议。


  你已在第 2 章“核心架构概念：数据生命周期”中介绍了一些通用数据架构概念。在本章中，你将深入探讨更多 Salesforce 特定的主题和架构原则。以下是将要涵盖的主要主题：


  - 了解作为 Salesforce 数据架构师你应该能够做什么

  - 介绍数据架构领域小型假设场景—Packt Online Wizz (POW)

  - 了解数据架构注意事项和影响，并构建你的解决方案和演示文稿


  ## 了解作为 Salesforce 数据架构师你应该能够做什么


  数据架构师是一位经验丰富的技术专业人员，负责设计和描述解决方案的整体数据建模概念，并确定数据收集、组织和迁移的政策、流程和注意事项。数据架构师是设计可扩展、高性能且经过优化的数据模型的主要负责人，该模型会考虑大数据量（LDV）对象的影响。值得注意的是，LDV
  挑战不仅特定于 Salesforce 平台，尽管 Salesforce 数据架构师可能应该更加意识到它们。


  注意 根据 Salesforce 的在线文档，CTA 候选人应满足一组特定目标，所有目标都可以在以下链接中找到：https://pactt.link/3QOIV。


  请仔细查看每个目标。


  ## 在使用大数据量对象时描述平台注意事项、其影响和优化方法


  在 Salesforce 实现中拥有 LDV 对象可能会导致多个性能注意事项，例如查询变慢、记录创建变慢和记录锁定。CTA 应意识到这些挑战，并预料已识别 LDV
  对整体解决方案的潜在风险。CTA 应相应地制定缓解策略来解决这些风险和挑战。


  首先，你需要能够识别 LDV。可以使用一种简单的数学方法来识别 LDV，其中对象必须至少满足以下条件之一：


  - 拥有超过 500 万条记录

  - 具有每年产生 500 万条新记录的增长率


  此外，还有一些其他指标可以指向 LDV 用例，例如：


  - 组织中有数千名活跃用户可以同时访问系统

  - 该对象具有查找/父对象，与具有超过 10,000 条记录的相关/子对象相关联

  - 组织使用超过 100 GB 的存储空间


  上述标准可能有些保守。Salesforce 可以很好地处理两倍于此数量的记录。但是，建议采用更安全的方法，使用前面提到的数字来识别 LDV 对象。


  ## LDV 的影响


  LDV 对多个功能有广泛影响，包括：


  - 减慢 CRUD 记录操作

  - 减慢标准搜索功能

  - 减慢 SOQL 和 SOSL 查询

  - 减慢列表视图

  - 减慢报告和仪表板

  - 影响数据集成接口

  - 增加记录共享计算和重新计算所需的时间

  - 影响 Salesforce API 的性能

  - 增加触发治理器限制的可能性

  - 减慢 Full Copy 沙箱刷新过程

  - 占用组织数据存储空间

  - 增加遇到记录锁定错误的可能性


  值得注意的是，Salesforce 组织上的并非所有事务都会受到 LDV 影响。上述影响仅限于 LDV 对象及其相关对象。换句话说，涉及非 LDV 对象的报告不会受到影响，即使你的实例中有一些
  LDV。另一方面，某些 LDV 的存在可能会在特定情况下影响实例的整体性能，例如重新计算共享记录。


  几乎没有任何完整的 CTA 审核委员会场景不包含至少一个与 LDV 相关的要求。在实际中，这很大程度上取决于项目的类型和规模，以及你所合作的业务。


  ## 缓解 LDV 对象的影响


  当你识别出 LDV 对象时，预期你能提出一个清晰且锐利的*缓解策略*。这不是潜在解决方案的混合体，而是一个明确推荐且有据可依的方法，与 CTA 审核委员会中的所有其他要求类似。以下列表和图表将帮助总结你可以用来创建
  LDV 缓解策略的不同工具和技术：


  LDV 缓解技术：


  - 瘦表

  - 索引

  - 分区

  - 数据归档

  - 非平台数据存储


  LDV 缓解工具：


  - 数据消耗分析

  - 查询优化器

  - Bulk API

  - 批量 Apex

  - 延迟共享


  ![](img/a3b1eecf3c87c814267f2877e8a8be1a_238_0.png)


  图 7.1 – LDV 缓解技术和工具


  现在，让我们简要了解一下这些技术和工具。


  ## 瘦表


  你可以通过联系 Salesforce 支持来在 Salesforce 组织中启用 Salesforce 瘦表。瘦表是一种特殊的只读自定义对象，包含标准或自定义
  Salesforce 对象中一部分字段。瘦表可以显著提高使用它们的 Salesforce 报告、列表视图和 SOQL 查询的速度。瘦表只能在 Account、Contact、Opportunity、Lead
  和 Case 对象以及自定义对象上创建。





  幕后，Salesforce 使用两个独立的表来存储其标准对象和自定义对象，并在用户查询该对象时即时连接它们。其中一个表用于标准字段，而另一个表用于自定义字段。精简表将两种类型的字段合并在一个表中。这消除了连接两个表的需求，因此，精简表非常适合报告。但是，由于其性质，它不能包含多个
  Salesforce 对象的字段，并且不能包含超过 100 个字段。


  Salesforce 会在适当的时候自动在原始表和精简表之间切换；这不是你可以控制的。


  下图说明了精简表的结构：


  ![](img/a3b1eecf3c87c814267f2877e8a8be1a_239_0.png)


  图 7.2 – 精简表的结构


  > **注意**

  > 你可以通过以下链接了解更多关于精简表的信息：https://pact.link/nKZKd。

  > 请确保你完全理解精简表的限制和使用场景。


  值得注意的是，精简表不包含软删除的记录。软删除的记录只是被标记为已删除，但尚未完全从平台中移除，可以通过 Salesforce 回收站访问和恢复。硬删除特定对象的记录可以减少该对象上的
  LDV 影响，特别是在存在大量软删除记录的情况下。


  ## 标准索引和自定义索引


  与任何数据库一样，如果你在查询条件中使用索引，就可以运行高性能查询。与其他数据库一样，**主键**（Salesforce 中对象的 ID 字段）、**外键**（Salesforce
  中的查找和主从/详细关系）和**备用键**（Salesforce 中的唯一外部键）默认都会被索引。


  > **注意**

  > 此外，还有一组标准索引字段，例如 RecordTypeId、Division、CreatedDate、Systemmodstamp (LastModifiedDate)、Name
  和 Email（用于联系人和线索）。你可以通过以下链接找到更多详细信息：https://pact.link/esgWV。


  你也可以请求在其他一些字段上启用自定义索引。只要查询返回的记录占完整数据集的特定百分比，利用索引字段的查询性能会好得多。即使使用了索引字段，仍可能出现 LDV
  查询性能不佳的情况。在许多情况下，这是由于对 Salesforce **查询优化器**工作原理的误解。请确保你完全理解查询不会使用索引的特殊情况。更多详细信息可以在前一个链接中找到。


  ## 分区


  分区类似于普通的数据库分区。它们允许你将 Salesforce 实例的数据分割为多个逻辑分区。这实际上将一个巨大的数据集转换为更小数据集的子集，从而使搜索、列表视图和报告更高效。分区并非用于安全，因为它们不限制对数据的访问。


  分区通常按地理位置进行。启用后，它们会影响 Salesforce 中的多个功能，例如报告和列表视图。


  > **注意**

  > 你可以通过以下链接了解更多关于分区的详细信息：https://pact.link/tkU62。


  ## 非平台数据存储


  处理 LDV 最有效、最高效的机制之一是分析并重新考虑特定数据集是否需要存储在平台上（这是描述将数据存储在 Salesforce Core Cloud，即之前称为
  Force.com 的术语），或者存储在平台外并在需要时即时检索。


  有几种机制可以从外部数据源/应用程序即时获取数据并在 Salesforce 中显示，包括 API 和混搭应用。


  数据可以存储在基于云或本地托管的平台上。常用于此目的的平台之一是 Heroku。Heroku 自带一个名为 **Heroku Connect** 的开箱即用连接器，用于连接
  Salesforce Core Cloud。这可以用于在两个平台之间同步数据，而不会消耗 Salesforce 组织的任何治理限制。


  其他平台包括 AWS、Microsoft Azure、Google Cloud 和 Rackspace。将部分数据存储在平台外可能是数据设计决策的一部分，也可能是数据归档策略的一部分，这将在下一节中解释。


  ## 数据归档


  归档是一种用于处理 LDV 的非常有效的策略。它依赖于识别那些不一定需要保留在平台上并可以移至平台外存储的数据。有时，你甚至可以使用 API 或混搭应用等工具将归档的数据重新暴露出来。Salesforce
  还提供一个与 **OData** 标准兼容的工具，名为 **Salesforce Connect**。它允许你将外部数据表暴露为 **Salesforce 外部对象**。外部对象类似于自定义对象，但有特定的限制和注意事项。


  > **注意**

  > 你可以通过以下链接了解更多关于外部对象的详细信息：https://pact.link/zF5TQ。


  现在，让我们仔细看一下使用非平台数据存储/归档缓解策略的示例。假设你有一个大量使用标准案例对象的 Salesforce 组织。通常，每个月会创建超过 1000
  万个案例。这使得案例对象成为 LDV。列表视图、报告以及其他与 CRUD 相关的操作都会相应面临性能挑战。缓解 LDV 影响的一种方法是将数据卸载到另一个数据存储平台（例如
  Heroku 上的 PostgreSQL 数据库，但对于本示例，你可以选择 **Azure Data Lake**）。数据卸载过程包括以下步骤：


  - 1. 关闭超过一个月的案例会定期从 Salesforce 复制到 Azure（ETL 批处理作业可以完成此操作）。然后将复制的数据从 Salesforce
  中清除（并清空回收站）。这确保案例对象保持精简。但是，对于用户来说，访问卸载/归档的数据将有点具有挑战性且耗时。


  - 2. 为了提升用户体验，你可以开发一个自定义 **Lightning 组件**（或 **Visualforce 页面**）来调用在 Azure 上开发的 API
  以检索存储的数据。然后将该组件嵌入到标准案例页面布局中。但是，这意味着你需要开发一个自定义 Lightning 组件，并且可能需要一组自定义 API 以灵活的方式从
  Azure 检索数据，这既耗时又耗费资源。


  - 3. 为了加快速度，你可以使用适配器（例如 CData.com 提供的适配器）将 Azure 中存储的数据暴露为 **OData**，然后利用 **Salesforce
  Connect** 来使用它。这将在目标 Salesforce 组织中为归档的案例对象生成一个 **外部对象**。它可以命名为类似 `Case__x` 的内容。**外部对象**易于与其他
  Salesforce 对象关联，并且可以通过点击几下轻松添加到页面布局中，从而节省时间并实现更快的功能发布。


  > **注意**

  > 你可以通过以下链接了解更多关于 OData 标准的信息：https://pact.link/TU4YW。


  要制定稳健的归档策略，你需要获得以下关键问题的答案：


  - 必须在平台上保留多少数据/记录？

  - 归档对象的数据保留期是多久？

  - 该策略涉及哪些其他系统？数据将流向哪个系统？

  - 将归档哪些对象，这将如何影响子对象/相关对象？


  你可以将数据归档到非平台存储容器中，例如 Heroku，或使用 **Salesforce 大对象**。大对象旨在平台上存储数十亿条记录。但是，与任何其他技术一样，它有其优缺点。下面的汇总表可以帮助你确定要使用的合适技术：


  | | Salesforce Big Objects | 非平台存储 |

  |---|---|---|

  | 优势 | 存储和管理数十亿条记录<br>相对低成本的数据存储<br>平台上存储，无需额外技术<br>维护的平台更少，因为它是 Salesforce Core
  Cloud 的一部分 | 存储和管理数十亿条记录<br>数据存储成本通常较低<br>你可以选择既支持数据归档又支持报告的目标归档平台<br>有多种可选方案，包括自托管解决方案<br>更适合大型组织，尤其是使用中央数据仓库时<br>假设平台支持
  OData，归档的数据可以使用 Salesforce Connect 重新暴露给 Salesforce |






  | | Salesforce 大型对象 | 非平台存储 |

  |---|---|---|

  | 注意事项 | 无现成 UI；需要开发 Visualforce 页面或 Lightning 组件<br>无现成报告功能<br>无现成搜索功能<br>需要开发自定义代码将数据插入
  Big Objects<br>无记录级访问控制功能 | 可能需要第三方中间件工具定期将数据从 Salesforce 归档并迁移到外部系统<br>数据将分布在多个数据源上；构建整合所有数据源的报告可能需要额外的工具<br>需要维护的额外平台<br>可能会导致合规性尽职调查的额外工作<br>记录级访问控制功能需要开发或购买特定模块
  |


  表 7.1 Salesforce 大型对象与非平台存储的比较


  根据用例，您可能还需要考虑其他几个方面，例如，除非您通过 Heroku Connect 将数据归档到 Heroku，否则非平台存储可能会占用部分 API 限额。


  ## LDV 缓解工具


  这些是一组经过精选的工具，可帮助您制定 LDV 缓解策略。如果您希望开发出正确的端到端解决方案，了解如何以及何时使用这些工具至关重要。


  ## 延迟共享计算


  您在第 6 章《在 Salesforce 中制定安全架构》中了解到，Salesforce 在多种用例中会生成共享记录，以向特定用户或组授予记录访问权限。计算和创建这些共享记录非常耗时，尤其是在处理大量记录时。


  延迟共享计算是一项权限，允许管理员暂停共享计算，然后稍后恢复，以避免干扰或影响任何关键业务流程。


  在加载大量记录时，延迟处理共享规则非常有用。您可以停止计算共享记录，直到加载完新数据或完成跨组织的多步共享机制更改。


  > **注意**

  > 您可以通过以下链接了解有关此功能的更多信息：http://packt.link/TPeWw.


  ## 查询优化器


  查询优化器是一个*透明工具*，在后台运行。它会评估查询（SOQL 和 SOSL）并将查询路由到正确的索引。由于 Salesforce 是一个*多租户平台*，它需要跟踪自己的统计信息，以找到检索数据的最佳方式。统计信息收集过程*每晚*进行，无需用户干预。


  ## 大容量 API


  大容量 API 旨在提供一种快速高效的机制，用于向 Salesforce 组织加载或从中检索大量数据。


  如果在您的 Salesforce 组织中启用了大容量 API 功能，则该功能可用。对于性能版、无限版、企业版和开发者组织，默认已启用。


  您可以编写利用大容量 API 的自定义应用程序，或购买现成的产品。大多数带有内置 Salesforce 连接器的现代 ETL 工具都支持大容量 API。有些工具甚至在检测到您即将加载大量数据时，会自动切换到大容量
  API。


  > **注意**

  > 您可以通过以下链接了解有关大容量 API 的更多信息：https://packt.link/7RX2x.


  ## 批量 Apex


  批量 Apex 可用于开发处理大量记录的复杂、长时间运行的进程，因此需要较宽松的*governor 限制*。


  批量 Apex 分*批*运行，每次处理一批预定大小/记录数的记录。它会这样做，直到正在处理的整个记录集完成。


  您可以使用批量 Apex 构建在计划时间运行（例如，每周）的数据归档解决方案。代码可以查找早于预定义时间期限的记录，并按预定义机制将其归档（例如，将它们移动到聚合反规范化表）。


  您需要记住，这仍然是符合 governor 限制的平台内功能。只是对于批量 Apex，governor 限制稍微宽松一些。您应继续考虑使用第三方工具（例如 ETL）来执行此类数据归档活动。


  > **注意**

  > 您可以通过以下链接了解有关批量 Apex 的更多信息：`https://packt.link/8ysjA`.


  ## 数据消耗分析


  确定合适的 LDV 缓解策略非常实用的一种技术是了解数据存储的消耗情况，找出是否由于数据治理规则不佳而创建了孤立记录，并分析现有数据模型对生成/使用记录数量的影响。


  > **注意**

  > 您可以使用数据使用工具查找有关实例数据用途的更多详细信息。在以下链接中查找更多详细信息：`https://packt.link/J64p6`.


  ## 解释数据建模概念及其对数据库设计的影响


  标准 Salesforce 对象是规范化的。它们以高效的方式在带有关系的表中存储数据，以最大限度地减少冗余并确保数据完整性。


  您可以创建规范化或反规范化的自定义对象。由于 Salesforce 对象的性质，您可以使用在典型数据库系统中被认为是次优的模式，例如定义具有大量字段的对象。


  Salesforce 中的记录大约消耗 2 KB 的数据存储空间，无论字段/列的数量如何（少数例外除外）。创建反规范化对象来存储聚合数据是您可以使用的一种 LDV
  缓解策略。它被视为数据归档的一种特殊情况。


  > **注意**

  > 要了解有关规范化和反规范化数据集的更多详细信息，请参阅*第 2 章，核心架构概念：数据生命周期*。


  除此之外，您需要熟悉**数据偏斜**。Salesforce 在底层使用关系数据库，在不同对象之间保持数据完整性至关重要。Salesforce 在更新记录时使用临时锁来确保数据完整性，并且及时执行此操作，因此您通常不会遇到任何问题。但是，在更新大量记录时，锁可能会持续比平时更长的时间。这可能导致事务失败。


  为避免此类事件，您需要以一种方式设计数据模型，以避免/缓解数据集中数据的非均匀分布，这被称为数据偏斜。


  在设计数据模型以及将数据上传到该数据模型时，需要考虑三种数据偏斜类型：


  - 账户数据偏斜

  - 查找偏斜

  - 所有权偏斜


  您将在下一节中简要介绍不同类型的 Salesforce 数据偏斜。


  ## 账户数据偏斜


  这与特定的标准 Salesforce 对象相关，例如账户和机会。这些对象之间存在一种特殊的数据关系，当账户的组织范围默认值 (OWD) 为私有时，允许访问父记录和子记录。


  当大量子记录与同一父账户记录关联时，就会发生账户数据偏斜。在这些条件下，当您并行（例如，通过 Bulk API）更新与同一账户关联的许多子记录（例如，机会记录）时，可能会遇到记录锁。在这种情况下，Salesforce
  会锁定正在更新的机会及其父账户，以确保数据完整性。这些锁的保持时间非常短。尽管如此，由于所有并行更新进程都在尝试锁定同一账户，因此更新可能会因无法锁定已锁定记录而失败的可能性很高。


  ## 查找偏斜


  将大量记录链接到单个父级/查找记录（适用于标准对象或自定义对象）会创建所谓的查找偏斜。


  例如，您可以通过查找关系将数百万个自定义对象记录与单个账户记录关联。每次创建该自定义对象的记录并将其链接到账户记录时，Salesforce 都会锁定目标账户记录，直到插入的记录提交到数据库，以确保数据完整性。


  同样，在正常情况下，这需要的时间非常短，因此您不太可能遇到任何问题。但是，在 LDV 对象上执行自定义代码、共享记录计算和其他工作流所需的时间可能会减慢保存操作，从而增加遇到锁定异常（基本上，尝试锁定已锁定的记录）的可能性，这会导致操作失败。值得注意的是，如果查找关系被配置为在删除查找记录时清除字段值，则不会发生记录锁。





  查找偏斜难以发现。审查数据模型以理解对象关系，然后将其与数据使用模式以及每个对象中的记录量进行比较，是一个不错的起点。


  你通常会更关注记录量极大的对象以及并发插入和更新操作数量较多的对象。


  ## 所有权偏斜


  当同一用户拥有同一对象类型的多条记录时，就会发生所有权偏斜。在Salesforce中，所有记录都必须有所有者，有时业务流程可能会将记录暂存或默认分配给单个特定用户。但是，由于计算共享记录所需的活动，这可能会影响性能。Salesforce在共享私有对象时，使用共享对象的共享记录来控制访问和可见性。例如，AccountShare对象的记录用于授予对Account对象记录的访问权限（如果Account对象的OWD设置为私有）。这些共享记录可以通过多种方式创建，包括Apex托管共享。


  在Salesforce中，所有权更改被视为昂贵的事务。每次更新记录所有者时，系统都会删除属于前所有者和角色层次结构中父用户的所有共享记录。此外，系统会删除与其他用户关联的共享记录，这些记录是由共享规则或其他共享机制（例如手动共享）创建的。


  你可以通过将记录所有权分配给多个用户，或者确保指定的所有者没有角色，因此不属于角色层次结构，来最大限度地降低所有权偏斜的风险。你还可以确保指定的所有者属于层次结构顶部的角色。


  ## 确定数据迁移方法、工具和策略


  数据迁移是Salesforce项目中的典型任务。虽然这是一个广泛的话题，但在CTA评审委员会期间，你需要解释你的数据迁移策略的高层次细节。在实际生活中，你会深入得多，并在决策中包含许多其他因素。


  ## 数据迁移策略中需要考虑的关键主题


  在评审委员会期间，你需要关注诸如以下等关键主题：


  - 记录数量至关重要，即你将要迁移的对象数量以及每个对象中的记录数量。


  - *涉及的系统*的数量和类型以及从中提取数据的机制。你可能需要假设数据将以特定格式并基于共享模板提供，以限制你这边的风险。


  - 你需要确定哪种数据迁移方法最适合你。两种关键方法是大爆炸方法和持续累积方法。


  - 你可以从关键方法中推导出其他方法，例如在不同区域/业务单元中顺序执行的本地大爆炸、维护多个实时系统并定期迁移数据增量的持续迁移方法，等等。


  - 你需要考虑可能受影响的不同*治理限制*，例如每日入站API调用限制。


  - 触发器和工作流根据特定标准执行特定逻辑。它们在执行时也需要时间和CPU资源，并消耗治理限制，在加载大量数据时可能存在风险。作为最佳实践，建议你在数据加载期间关闭它们或提供一种绕过机制。


  - 如果可能，请使用Bulk API。如果你使用的是现代ETL工具，这可能是一个简单的开关。


  - 使用前面*LDV缓解工具*部分中描述的延迟共享计算功能。然后，在完成数据加载后激活共享规则计算。


  - 加载子记录时，尝试按其父ID进行分组。


  此外，你需要根据你的假设、经验和逻辑提出合适的工具。


  ## 数据备份和恢复


  Salesforce宣布，自2020年7月31日起，作为付费功能的数据恢复将被弃用，不再作为服务提供。但是，基于客户反馈，Salesforce决定恢复其数据恢复服务。在2021年秋季，Salesforce宣布了一种新的内置平台原生备份和恢复功能。


  准备好解释你的解决方案将如何满足数据备份和恢复要求（如果在场景中指定）。


  你可以查看*第2章，核心架构概念：数据生命周期*，以了解有关实现此目标的不同方法和工具的更多信息。


  ## 介绍数据架构领域微型假设场景—Packt Online Wizz


  以下微型场景描述了一个特定客户面临的挑战。该场景已调整为专注于与*数据架构*相关的挑战。但是，该领域与*安全领域—共享和可见性*密切相关，特别是前者。因此，你仍然会注意到大量的共享和可见性要求。在后续章节中，还会有其他也依赖于数据架构领域的场景。


  你将阅读该场景并逐步创建解决方案。为了充分利用此场景，建议阅读每个段落，尝试自己解决问题，然后返回本章，阅读建议的解决方案，将其与你的方案进行比较，并做笔记。


  请记住，此处列出的解决方案不一定是唯一可能的解决方案。只要在技术上正确且在逻辑上有道理，备选解决方案也是可接受的。


  ### 场景


  **Packt Online Wizz (POW)**是一个在线购物门户，交易商在上面向消费者提供不同的商品。POW目前正在与超过100,000名不同的交易商打交道。POW目前估计，他们有超过200万种独特的待售商品，分为150个不同的类别。根据他们当前的网站流量，每天有超过500万访问者访问他们的网站。他们每天下大约150,000个订单。每个订单平均包含五件商品。


  ### 当前情况


  当前网站允许消费者匿名下单或以注册用户身份下单。他们目前有300万注册用户。该网站还支持所有主要的在线支付方式，例如PayPal和信用卡。POW共享以下信息：


  - 一旦下单，可以通过POW或交易商本身来完成履行，具体取决于交易商为其每件产品提供的偏好。订单通常在不超过两周内完成履行。


  - POW存储所有交易商的银行账户详细信息。一旦商品被运送给消费者（无论是由POW还是交易商），POW会自动计算其佣金，从已收付款金额中扣除该佣金，并将余额存入交易商的银行账户。


  POW设有一个全球支持中心，包含2,000名支持代理和100名经理，通过电话和电子邮件渠道全天候运作。POW共享以下信息：


  - 支持中心每天处理大约20,000个案例。


  - 每位支持经理领导一个由20名支持代理组成的团队。所有支持团队都可以查看案例。


  POW拥有一个全球ERP系统来处理账单、库存管理和订单退货。他们使用定制应用程序作为商品主数据，并在AWS上运行其定制网站。他们使用MuleSoft作为所有系统之间的集成中间件。


  ### 要求


  POW共享了以下要求：


  - 公司希望为其消费者提供便捷的自助服务体验，允许他们提出支持工单和询问。


  - POW还希望向消费者公开一套丰富的可搜索常见问题解答，以帮助尽可能多地将案例从呼叫中心转移出去。


  - 注册消费者应能查看长达四年的购买历史。


  - 注册消费者应能评论其购买的商品。这些评论应对注册和非注册的网站访问者公开可用。


  - 支持代理应能对提出特定案例的消费者拥有360度视图。这应包括过去四年客户的历史、过去四年中提出的其他案例、订单退货以及客户的任何产品评论。


  - 支持代理应能看到整体消费者价值指标，该指标显示该消费者在其与POW的整个互动历史中的价值。该指标应考虑多种因素，例如购买的产品、每月消费金额、购买数量以及客户的社交媒体影响力因子。社交媒体影响力因子是POW从三个不同提供商处每日收集和更新的值。


  - 交易商应能查看其客户长达四年的购买历史。


  - 交易商应能登录POW交易商门户以查看其当前待处理的订单。一旦有新订单下单，他们还应收到电子邮件通知。所有电子邮件都应发送到指定的企业电子邮件地址。


  - 交易商应能为自己提出支持工单，以解决与付款和库存相关查询的问题。


  - POW的高层管理人员应能运行报告和仪表板，以跟踪不同类别中商品的性能趋势。仪表板应包括售出商品数量、退货以及特定期间内售出商品的每周总价值等信息。


  - 历史上，POW使用定制开发的解决方案来管理消费者投诉。POW希望停用该系统并用新解决方案替代。当前系统包含超过2亿条记录，其中包括一些仍在处理中的记录。


  POW担心系统的整体性能，希望作为架构师的你能就设计解决方案以确保其具有最佳可能性能提供明确的建议。





