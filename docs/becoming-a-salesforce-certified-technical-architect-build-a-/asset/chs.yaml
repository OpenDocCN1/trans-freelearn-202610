  '
- "# 构建集成解决方案\n\n在本章中，你将继续学习 CTA 必须掌握的 Salesforce 特定知识领域。集成架构是七个领域中的第五个。你将涵盖所需知识，然后为每个领域完成一个使用小型假设情景的实践练习。\n\
  \n企业格局在不断增长并变得日益复杂。当今鲜有企业会将 Salesforce 与其他系统隔离使用。分布式解决方案如今已成为默认选择，因为集成比以前简单得多。然而，它仍然是对已实施软件解决方案的成功产生最重大影响的领域。\n\
  \n集成是一个复杂的领域，但具有有限数量的独特用例。这在一定程度上类似于你在 *第 4 章，核心架构概念：身份和访问管理* 中涵盖的 **身份和访问管理** (**IAM**)\
  \ 概念，其中概念本身具有挑战性和复杂性，但身份验证流程的数量有限。\n\nSalesforce 集成模式数量有限。理解这些不同的模式（包括其优缺点、何时使用每种模式，以及通过此领域的重要性）非常重要。在本章中，你将逐一了解这些模式，并学习它们的特征和典型用例。\n\
  \n在了解何时以及如何使用这些集成模式后，你将处理一个小型假设情景，将该知识付诸实践。在本章中，你将涵盖以下主要主题：\n\n- 了解作为 Salesforce\
  \ 集成架构师你应该能够做什么\n- 介绍集成架构领域小型假设情景—**Packt 医疗设备** (**PME**)\n- 设计企业集成接口以构建你的连接解决方案\n\
  \n## 了解作为 Salesforce 集成架构师你应该能够做什么\n\n集成架构师通常是技术能力强的专业人士，能够理解集成数据结构及其对整体解决方案的影响。\n\
  \n他们推荐、设计并开发合适的企业集成架构，允许多个系统以安全、可扩展和高性能的方式进行交互。\n\n集成架构师应能够根据给定情景选择并证明正确的集成模式。他们应能够制定考虑集成应用程序的权衡、局限性和功能的集成策略。Salesforce\
  \ 集成架构师还应了解平台的开箱即用功能和局限性。\n\n> **注意**\n> 根据 Salesforce 在线文档，CTA 候选人应能够满足一组特定目标，这些目标可通过以下链接查找：https://packt.link/ZAjmz。\n\
  \n在本章结束时，你应能够完成以下操作：\n\n- 推荐合适的集成架构\n- 确定合适的企业集成架构技术\n- 使用正确的集成模式设计集成接口\n- 选择并证明合适的平台特定集成功能\n\
  \n现在，让我们仔细了解每个目标。\n\n## 推荐合适的集成架构\n\n集成是一个复杂的领域。确定集成解决方案的组件包括询问以下问题：\n\n- 它们如何连接？\n\
  - 它们如何安全地交互？\n- 交换什么数据？\n- 这需要对集成原则有深入的理解吗？\n\n在集成领域，对技术缺乏理解很容易导致努力浪费和脆弱的解决方案。\n\
  \n\n\n\n例如，集成架构师可能会决定使用发布-订阅方式在集成的企业系统之间传输文件，而忽略了文件大小对该方法的影响。这可能会严重影响性能和稳定性。\n\n\
  另一个类似的例子是，集成架构师决定在核心 Salesforce 云之上构建整个中间件，引入几十个类、对象和组件来创建一个链接多个系统的编排引擎。在这种情况下，技术被用于错误的上下文，并创建了一个脆弱的解决方案，迟早有一天会崩溃。\n\
  \n不理解技术的细节及其被如此设计的原因，可能会导致你做出错误的设计决策。第 3 章“核心架构概念：集成与加密”将帮助你理解每种集成方法和技术背后的历史、它们之间的差异以及各自的良好用例。这将帮助你为集成解决方案确定理想的架构布局。\n\
  \n## 确定正确的企业集成架构技术\n\n确定集成方法后，技术是接下来需要考虑的话题。你需要了解企业环境中可用的不同工具。需要考虑的几个问题，例如：\n\n\
  - 什么是提取、转换、加载 (ETL) 工具？\n- 什么是企业服务总线 (ESB)？\n- ETL 和 ESB 之间有何区别？何时应该选择其中一种而不是另一种？\n\
  - 什么是反向代理？\n- 什么是 API 管理器？\n- 如何将云应用程序连接到本地应用程序？\n\n你在第 3 章“核心架构概念：集成与加密”中已经学习了其中的大部分内容。\n\
  \n建议亲手体验一下 ETL 工具或 ESB（或两者兼用）。这将帮助你理解某些工具支持的不同方法。\n\n例如，要与本地/防火墙后的应用程序集成，某些工具提供安装安全客户端（也称为安全代理）的功能。安全客户端是一个占用空间小的应用程序（由提供中间件的同一公司提供），可以安装在安全的内网（防火墙后面）上。它可以使用特定端口直接连接到本地数据库或\
  \ API。然后，安全客户端将通过其他端口（例如 80 或 443，分别用于 HTTP 和 HTTPS，通常由防火墙允许）与基于云的解决方案进行通信。在某些情况下，你可能需要要求防火墙管理员允许针对特定地址的特定端口进行通信（假设目标应用程序具有唯一\
  \ URI）。\n\n以下图示说明了安全客户端/安全代理如何用于基于云的 ETL 解决方案（不同 ETL 产品之间可能略有不同）：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_302_0.png)\n\
  \n图 9.1 – 使用安全代理应用的基于云的中间件\n\n因此，图 9.1 说明了以下内容：\n\n- 安全代理会直接与云中间件通信，通常使用端口 443 或\
  \ 90。这些是出站通信，因此无需调整或更改防火墙规则。代理会下载其要执行的集成作业的定义，并将其本地存储（通常是加密的）。\n- 根据下载的作业信息，安全代理执行计划的作业。\n\
  - 数据被提取、转换并直接传输到目标系统（在图 9.1 中为 Salesforce）。数据不会在中间件云中暂存（这通常是数据隐私法规的一项基本要求）。\n- 基于预定义的计划，安全代理会将日志和监控数据发回到基于云的中间件。\n\
  \n理解这些细节将帮助你在评审委员会面前展示完整的端到端解决方案。现在，你将探索 CTA 在这一领域应满足的下一个目标。\n\n## 使用正确的集成模式设计集成接口\n\
  \n集成模式描述了将 Salesforce 与其他系统集成的标准方式。这些原则本身并不特定于技术/平台，因为它们可以应用于任何其他技术和平台。你需要充分理解这些集成模式的目的、常见用例以及用于实现它们的\
  \ Salesforce 技术。在创建端到端解决方案时，你需要根据用例选择使用哪种模式。\n\n> **注意**\n> 你可以在以下链接中找到有关模式的更多详细信息：https://packt.link/bw3nY.\n\
  \n你将学习以下六种模式：\n\n- 远程进程调用 (RPI)：请求和响应\n- RPI：发送即忘\n- 批量数据同步\n- 远程呼入\n- 基于数据变化的 UI\
  \ 更新\n- 数据虚拟化\n\n接下来，你将深入了解这些模式及其特征的细节。\n\n## 远程进程调用：请求和响应\n\n关于该模式的高层信息如下：\n\n\
  - **描述**：该模式用于调用远程 Web 服务并等待其响应。在等待期间，系统处于阻塞状态。在经典的单线程桌面应用程序中，你会发现应用程序在等待响应时会冻结。Web\
  \ 应用程序（如 Salesforce）不是这种情况，但在等待响应时通常会看到一个旋转的进度指示器。\n- **时序**：该模式是同步的，有时也被称为实时。\n\
  - **操作层**：该模式根据实现方式同时作用于数据层和业务逻辑层。该模式的名称可能会令人困惑。RPI 集成作用于业务逻辑层，例如调用远程天气预报 Web 服务，传递位置和日期，并接收给定日期的预期天气预报。此外，该模式还可用于数据层的同步集成，例如调用\
  \ Web 服务将本地记录复制到远程系统，并等待事务提交并返回确认。此处的整个数据插入事务被视为 RPI。\n- **关键用例**：调用远程 Web 服务、执行操作并等待结果。这可能包括传递将被复制到远程系统的数据结构。\n\
  - **相关 Salesforce 功能**：外部调用（Callouts）可被视为相关功能，例如从 Visualforce 页面或 Lightning 组件调用的外部调用。这不包括使用\
  \ future 方法或类似功能调用的异步外部调用。从 Flows 或 Apex 调用的 Salesforce 外部服务也与该模式相关。\n\n> 注意\n>\
  \ 你可以在以下链接中找到更多详细信息：https://packt.link/B7jk7.\n\n## 远程进程调用：发送即忘\n\n关于该模式的高层信息如下：\n\
  \n- **描述：** 该模式用于调用远程 Web 服务并继续执行其他进程，而无需等待响应。系统不会因执行其他操作而阻塞。在经典的单线程桌面应用程序中，应用程序会调用远程\
  \ Web 服务并继续执行其他操作。\n- **时序：** 该模式是异步的。在某些情况下，可以视为近实时。\n- **操作层：** 该模式同时作用于数据层和业务逻辑层，类似于\
  \ RPI 请求和响应模式。\n- **关键用例：** 调用远程 Web 服务以执行操作，而无需等待结果。这可能包括传递将被复制到远程系统的数据结构。该模式可以修改为包含回调。在这种情况下，Salesforce\
  \ 会期望远程系统在处理完成并发送结果后进行回调。由于其近实时特性、敏捷性、可扩展性和小开销，这是一种常见模式。\n- **相关 Salesforce 功能：**\
  \ 几个 Salesforce 功能与此相关，例如外发消息、平台事件、**变更数据捕获**（CDC）、Salesforce 流式 API、使用 future 方法的外部调用、使用\
  \ queueable 类的外部调用、电子邮件通知和推送通知。\n\n> 注意\n> 你可以在以下链接中找到更多详细信息：https://packt.link/dl4cl.\n\
  \n## 批量数据同步\n\n关于该模式的高层信息如下：\n\n- **描述：** 正如其名称所示，该模式主要用于将数据集从一个系统复制到另一个系统。数据集通常包含大量记录，以提高效率。\n\
  - **时序：** 该模式是异步的，通常计划在特定时间和间隔运行。执行时间通常取决于复制的数据集的大小。\n\n\n\n\n\n- **操作层**：此模式在数据层上运行。\n\
  - **关键用例**：将一个系统中的一个数据集复制到另一个系统，或同步两个不同系统上的两个数据集。由于其高效性，这种模式很常见，尽管它无法满足当今应用程序所要求的实时/准实时体验。在许多情况下，业务可以接受延迟的数据同步，例如每\
  \ 12 小时将发票从开票系统复制到数据仓库。\n- **相关的 Salesforce 功能**：Salesforce Bulk API 是一个相关功能（适用于较小数据量的\
  \ REST、SOAP 和 Graph API 也是如此）。Salesforce Batch Apex 结合回调可能很诱人，但这是一种有风险的模式，建议您避免使用。请考虑改用中间件。\n\
  \n> 注意\n> 您可以在以下链接中找到更多详细信息：https://packt.link/B5qRq.\n\n## 远程调用\n\n以下是有关此模式的高级信息：\n\
  \n- **描述**：当远程系统想要在 Salesforce 中调用一个流程时使用此模式。从远程系统的角度来看，这将是 RPI 模式之一。从 Salesforce\
  \ 的角度来看，它被视为调用。\n- **时机**：此模式可以是同步的或异步的，具体取决于实现（调用 Salesforce 的外部系统可能会等待响应，也可能不会）。\n\
  - **操作层**：此模式在数据层和业务逻辑层上运行，具体取决于实现。\n- **关键用例**：调用标准 Salesforce API 以创建、读取、更新或删除（CRUD）数据，或调用自定义\
  \ Salesforce Web 服务（SOAP 或 REST），以返回特定结果。\n- **相关的 Salesforce 功能**：多个 Salesforce\
  \ 功能相关，例如 Salesforce REST API、Salesforce SOAP API、Salesforce Metadata API、Salesforce\
  \ Tooling API、Salesforce Bulk API（用于批量操作）和 Apex Web 服务。\n\n值得注意的是，当您希望暴露一个应用全有或全无事务原则的原子功能时，Apex\
  \ Web 服务特别有用，例如，暴露一个接受特定数据结构作为输入并生成客户、机会和机会产品行的 Web 服务。如果创建这些对象中的任何记录失败，将导致整个事务回滚，当数据完整性是关注点时，此类原子事务至关重要。\n\
  \n您还可以利用 Salesforce 标准 REST API 提供的复合请求来创建原子事务。在复合请求中，多个依赖请求在单个调用中执行，一个请求的输出可能成为后续请求的输入。您可以指定，在子请求中遇到的错误是导致整个复合请求完整回滚，还是仅回滚依赖于它的子请求。\n\
  \n> 注意\n> 您可以在以下链接中找到更多详细信息：https://packt.link/K596j.\n\n## 基于数据变更的 UI 更新\n\n以下是有关此模式的信息：\n\
  \n- **描述**：这是一个相对较新的模式。当您需要根据 Salesforce 数据的某些变更更新 Salesforce UI，而无需刷新整个页面时使用它。\n\
  - **时机**：此模式是异步的。\n- **操作层**：此模式在 UI 层上运行。\n- **关键用例**：构建一个基于 Salesforce 数据显示特定值和图表的动态页面，并在基础数据变更时更新该页面的某些元素。\n\
  - **相关的 Salesforce 功能**：多个 Salesforce 功能相关，例如 Salesforce Streaming API、推送通知、平台事件和\
  \ CDC（技术上基于平台事件）。\n\n> 注意\n> 您可以在以下链接中找到更多详细信息：https://packt.link/S4Ql1.\n\n## 数据虚拟化\n\
  \n以下是有关此模式的信息：\n\n- **描述**：此模式用于在 Salesforce 中检索和显示存储在远程系统上的数据，而无需持久化数据。当无需将数据保留在\
  \ Salesforce 中时，这非常有用。数据会实时按需获取并显示给用户。\n- **时机**：此模式是同步的。但是，诸如懒加载等某些技术可以将其转变为异步通信的一种特殊情况。\n\
  - **操作层**：此模式在 UI 层上运行。\n- **关键用例**：构建利用 Salesforce 外部托管数据的 UI，例如归档数据。使用 Google\
  \ 地图等远程服务的混搭应用是另一个有效的用例。\n- **相关的 Salesforce 功能**：自定义 Visualforce 页面、Lightning 组件、Salesforce\
  \ Connect 和 Salesforce Canvas 都是相关功能。\n\n在设计集成接口时，您需要定义模式并指定要使用的 Salesforce 技术。这项技能是您在此领域接下来需要掌握的内容。\n\
  \n## 选择并证明合适的平台特定集成能力\n\nSalesforce 提供了一组开箱即用的功能，以促进不同的集成模式：\n\n| 功能 | 描述 |\n|---|---|\n\
  | REST API | Salesforce 自带开箱即用的 REST API，可用于与 Salesforce 数据交互。一般来说，REST API 易于集成，尤其是来自移动端和\
  \ JavaScript。Salesforce REST API 支持简单的 HTTP 调用（GET、POST、PUT、PATCH 和 DELETE）。 |\n\
  | SOAP API | Salesforce 自带的开箱即用 SOAP API 可以通过使用标准的两个 Web 服务描述语言 (WSDL) 文件之一来使用。企业\
  \ WSDL 是强类型的，这使得维护具有挑战性。但是，如果数据模型很少更改，则使用它更容易。另一方面，合作伙伴 WSDL 是弱类型的，这使其更加动态，适合由合作伙伴或经常遇到数据模型更改的组织使用。SOAP\
  \ API 可用于像 REST API 一样处理 Salesforce 数据。但是，对于移动设备和 JavaScript 应用等瘦客户端来说，其实现更具挑战性。此外，它的负载往往更大，因此被认为比\
  \ REST 稍慢。 |\n| Bulk API | 此 API 旨在处理大量数据。某些 ETL 工具设计为在用于向 Salesforce 加载大量数据时自动切换到此\
  \ API。 |\n| Salesforce Connect | 这是一项付费功能，允许从支持 OData 2.0 或 OData 4.0 标准的外部数据源实时检索数据。OData\
  \ 接口是 REST 风格的，您可以使用自定义代码调用它们。Salesforce Connect 使该过程更加简单。外部 OData 表会自动在 Salesforce\
  \ 中表示为外部对象，从而允许将此数据与其他 Salesforce 数据关联，并使用常规 SOQL 语句进行查询。 |\n| Canvas | Salesforce\
  \ Canvas 是一项付费功能，可让您在 Salesforce 中集成远程 Web 应用程序。这通常是 UI 级集成，但 Canvas SDK 可以添加更高级的功能。\
  \ |\n| Chatter REST API | Chatter 有其自己的 REST API。此 API 可以与 Chatter 信息流、推荐、群组、话题和关注者等对象进行交互。\
  \ |\n| Metadata API | 此 API 不太可能用于数据集成场景。它主要由发布管理工具使用。它用于检索、创建、更新、部署或删除 Salesforce\
  \ 元数据信息，例如页面布局和用户配置文件。 |\n| Streaming API | 流 API 用于开发现代动态页面。它允许您的页面/组件在 Salesforce\
  \ 数据更改时接收通知，从而相应地更新页面/组件的部分内容。它利用 PushTopic 功能。 |\n| Tooling API | 此 API 旨在帮助构建与\
  \ Salesforce 平台交互的自定义开发工具。 |\n| Apex callouts | 此功能允许使用 Apex 调用远程 Web 服务。Apex 调用可以是同步或异步的。异步方法必须带有\
  \ @future 注解。您还可以利用 Queueable 接口来开发带有异步方法的 Apex 类。您可以使用 continuation 类进行长时间运行的调用。\
  \ |\n| Email | 这是一种旧的集成技术。但是，它仍然有效并有其用例，例如在与不支持任何较新接口的旧版应用程序集成时。您可以利用 InboundEmailHandler\
  \ 接口来开发自定义 Apex 类，以处理 Salesforce 电子邮件服务接收到的入站电子邮件。 |\n\n\n\n\n\n| 功能 | 描述 |\n|---|---|\n\
  | Outbound messages | 这是一个可配置的出站集成功能。它只能包含来自一个 Salesforce 对象的数据，并使用 SOAP 标准发送。这意味着消费者必须能够实现\
  \ SOAP WSDL。发送的出站消息可以包含会话 ID，使接收方能够使用会话 ID 进行身份验证，从而回调到 Salesforce。出站消息具有 24 小时重试机制。\
  \ |\n| Platform events | 平台事件基于发布-订阅集成方法。您可以以类似自定义对象的方式定义平台事件的结构。平台事件可以使用 Apex、Flow\
  \ 和 Process Builder 发布，您可以使用相同的工具以及 CometD 客户端订阅它们。从 Winter '23 版本开始，您还可以使用 Pub/Sub\
  \ API 发布和订阅平台事件。由于平台事件可以使用不同的 Salesforce 功能轻松订阅，因此除了将数据传递给外部订阅者外，还可以利用它们在 Salesforce\
  \ 平台本身内创建基于事件驱动架构的应用程序。 |\n| Change data capture (CDC) | CDC 是构建在平台事件之上的功能，这意味着它们共享许多特征。CDC\
  \ 发布表示 Salesforce 记录更改的事件，例如创建新记录、删除和更新现有记录以及记录未删除。 |\n| External services | 外部服务允许使用\
  \ Salesforce 流和 Apex 调用远程 Web 服务。 |\n\n表 9.1: 用于促进不同集成模式的开箱即用功能\n\n现在您已熟悉该领域的预期，是时候着手一个实际示例了，您将利用这些知识来设计一个集成的、安全的且可扩展的解决方案。\n\
  \n## 介绍集成架构领域微型假设场景：Packt 医疗设备\n\n以下微型场景描述了特定客户面临的挑战。该场景专门针对与集成架构相关的挑战进行了调整。但如您所料，还有与其他领域（如数据和安全）相关的要求。\n\
  \n在开始之前，请先熟悉在“使用正确的集成模式设计集成界面”部分中提到的六种集成模式。在此微型场景中，您将了解这些集成模式中一些模式的实际示例。本章将侧重于设计集成界面所需的逻辑思考。\n\
  \n建议您先通读一遍场景，以构建所需解决方案的初步图景。然后，浏览要求并尝试自行解决。完成尝试后，将其与建议的解决方案进行比较。尝试向另一个人讲解端到端的解决方案，此人将扮演评委角色，描述特定的集成界面。\n\
  \n### 场景\n\n**Packt 医疗设备（PME）**在过去 75 年来一直向全球医疗保健提供商销售医疗设备。PME 目前销售来自不同品牌的 20,000\
  \ 多种不同的设备型号。PME 在近年来经历了巨大增长。去年他们销售了近 500 万台设备，并预计年销售额将增长 10%。\n\n### 当前情况\n\nPME\
  \ 在多个地理区域运营。每个区域都有针对与分销商合作而定制的各种 CRM 解决方案。PME 希望用基于 Salesforce 的解决方案替换所有现有的 CRM\
  \ 解决方案。但是，他们希望保留两个现有系统，因为他们认为这些系统提供了一套有价值的定制服务：\n\n- 一个集中式的基于浏览器的 **企业资源平台（ERP）**系统，PME\
  \ 客户经理使用该系统查看其合作分销商的财务详细信息。该系统仅可从公司内部网访问。\n- 一个集中式库存管理系统，存储每个地点可用设备的数据。它包含关于运往分销商途中的设备的到达日期和时间的更新信息。此外，该系统允许获取分销商地点设备的信息。\n\
  \n目前，数据是手动输入到库存管理系统中的。该系统未与其他系统集成，也没有任何公开的 API。该系统使用 MS SQL 数据库存储数据。ERP 系统也未与其他系统集成。但是，它拥有一组丰富的\
  \ SOAP 和 REST API。\n\n用户在使用这些系统之前必须对每个系统进行身份验证。目前身份验证是单独进行的，因为每个系统都存储自己的用户凭据。\n\n\
  订购流程包括三个阶段，即谈判、确认和发货。订单按季度下达。\n\nPME 希望现代化其系统环境并在全球范围内提供更标准化的流程。此外，他们希望通过尽可能避免重复数据录入来提高用户生产力。\n\
  \n### 要求\n\nPME 分享了以下要求：\n\n- PME 安全团队要求在新解决方案中使用的所有系统（包括 ERP 和库存管理系统）中使用单点登录（SSO）。\n\
  - 设备订单应源自 Salesforce。\n- 在谈判阶段之前，PME 应该能够为每个分销商的设备类型设置最大和最小分配量。\n- 在谈判阶段，分销商应该能够下订单，其中包含设备型号和数量列表。\n\
  - 如果每个型号的请求数量在每个型号定义的分配范围内，订单应自动确认。\n- 如果每个型号的请求数量超出每个型号定义的分配范围，订单应发送给客户经理审批。系统应自动从\
  \ ERP 中检索表示分销商财务状况的四个值。\n- 客户经理应利用财务状况指标值，以及该分销商的历史订单，来确定正确的操作。\n- 当订单即将发货时，库存管理系统可能会创建多个发货。对于每个发货，将创建设备及其唯一制造商\
  \ ID 的列表。发货及其行项目应对分销商的车队经理在 Salesforce 中可见。每个行项目的状态应为“在途中”。\n- 发货送达后，分销商的车队经理有三天时间确认收货。他们应确认由其唯一制造商\
  \ ID 标识的每个设备的状态。每个行项目的状态应为“可用库存”。\n- 如果超过三天仍未收到确认，应通知客户经理。\n- 分销商的车队经理应定期按制造商 ID\
  \ 更新每个设备的库存状态。他们应指示设备是已售出、已退回、已损坏还是仍可用库存。此信息也应在库存系统中更新。\n\nPME 正在寻求您的帮助，设计一个满足其要求和雄心勃勃的路线图的可扩展集成解决方案。\n\
  \n## 设计企业集成界面以构建您的连接解决方案\n\n请花点时间快速浏览场景，了解大局并对解决方案形成一些初步想法。这是每个场景中必不可少的步骤。我们的方法是逐步解决场景。但是，您仍需要先了解大局并形成一些初步想法，否则可能会浪费大量时间重新设计您的解决方案。\n\
  \n## 了解当前情况\n\n第一段包含关于 PME 的一些一般信息。您从中了解到，PME 有一些旧版 CRM 解决方案，并希望使用 Salesforce 将它们整合。此外，您还了解到他们希望保留两个系统：一个仅可通过公司内部网访问的旧版\
  \ ERP 系统，以及一个集中式库存管理系统。\n\n这两个系统都未与任何其他系统连接。场景没有确切说明它们托管在哪里，但根据您对 ERP 解决方案的了解，可以合理假设它是本地托管的（或位于\
  \ VPN 后面，但这种情况较少见）。也可以合理假设库存管理系统也是本地托管的。\n\n即使在这个阶段，您也需要开始思考：我如何将 Salesforce 等基于云的平台与本地托管的应用程序集成？\n\
  \n> **注意** 如果您难以找到答案，请翻回第 3 章“核心架构概念：集成与密码学”，特别是“讨论不同集成工具”部分，并确保您熟悉这些工具中的每一个。\n\n\
  简而言之，您需要某种中间件，从 Salesforce 向本地托管的应用程序进行出站调用。您目前还不确定需要哪种中间件。在通读其余场景时，您会了解更多信息。\n\n\
  暂时，请在草图系统架构图中记录您所了解的内容。您的图表可能如下所示：\n\n\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_313_0.png)\n\
  \n图 9.2 – 系统架构（初稿）\n\nPME 希望使用 Salesforce 现代化其系统环境。他们还希望将其与旧版应用程序集成，并且希望以正确的方式完成，以确保未来的可伸缩性和可扩展性。\n\
  \n他们共享了一份冗长的需求列表，接下来你将对其进行讲解。\n\n## 深入了解共享的需求\n\n现在，浏览 PME 共享的需求，为每个需求制定拟议解决方案，并相应更新图表以帮助演示。从第一个需求开始，它以以下行开头。\n\
  \n> PME 安全团队规定，新解决方案中使用的所有系统都必须使用单点登录，包括 ERP 和库存管理系统。\n\n你知道 ERP 和库存管理系统拥有自己的身份验证功能。但是，场景中并没有任何迹象表明它们不支持\
  \ OAuth 2.0、OpenID Connect 或 SAML 2.0 等标准。你可以做出该假设，清晰地传达它，并以此为基础制定解决方案。\n\n你仍然需要定义一个可与所有系统协同工作的身份提供者。此外，你需要说明哪个系统将保存用户凭据（身份存储）。遗漏身份存储的标识是你应避免的常见错误。\n\
  \n你将在后面的第 11 章《传播和社会化你的解决方案》中学到一种技术，称为问题预埋（question seeding）。简而言之，这是故意留下一些冗长的对话领域不予回答，以便在问答环节吸引大家对其的注意。必须充分理解并谨慎使用。当你使用该技术时，你已经知道某个问题的答案。你将评委的注意力引向它，但随后将其留空，允许他们在问答环节就此提问。\n\
  \n当你因为不了解某些主题的重要性或不知道答案而将其留空时，这更像是试图施放烟雾弹，希望评委不会注意到。这是一种你应不惜一切代价避免的策略。\n\n当你提出单点登录策略时，除非你故意将某些领域留空以供进一步讨论，否则需要对其所有领域都清晰明确。在此场景中，你必须解释你的身份管理策略。你的拟议解决方案可以如下：\n\
  \n我假设 ERP 和库存管理系统都支持 OpenID Connect 标准。我建议将 Ping Identity 等身份提供者和身份管理工具引入系统环境。Ping\
  \ 将使用其身份存储（PingDirectory）来维护用户凭据。\n\n目前，用户凭据由 ERP 和库存管理系统在本地托管。我建议将这些系统中的用户详细信息迁移到\
  \ Ping。\n\n我假设无法迁移系统的密码，因为只存储了它们的哈希值。因此，我们需要向所有已迁移的客户发送电子邮件，要求他们设置新密码。电子邮件将包含一个受保护的一次性链接，允许他们使用\
