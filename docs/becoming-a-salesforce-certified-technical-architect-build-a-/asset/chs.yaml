  ### 交易者应能够查看其客户最多四年的购买记录。


  考虑到该数据在外部对象中可用，这个需求应该很简单。


  你的解决方案可以如下：


  订单和订单行项目在 Heroku 中归档，然后通过 Salesforce Connect 和外部对象重新暴露给 Salesforce。我们将构建一个带有 Lightning
  组件的自定义页面，该组件查询外部对象以获取所有包含此交易者产品的订单并显示它们。


  ### 交易者应能够登录 POW 交易者门户以查看其当前待处理订单。


  处理此类要求时要小心，因为它们可能包含其他次要要求。例如，此处的主要要求是说明交易者如何访问正确记录，但你还有一个嵌入式要求，请求在创建订单时发送电子邮件通知。你的解决方案可以如下：


  将使用 Salesforce 社区向交易者授予 Salesforce 数据访问权限。交易者将被分配 Partner Community 许可证。我认为 Partner
  Community 许可证更适合此用例，因为我们需要能够与交易者共享某些记录，例如订单。我假设交易者的账户记录将由为其入职的销售代表拥有。我还假设每个交易者的合作伙伴账户将只有两个角色。


  订单的 OWD 设置将设置为私有，而不是默认的由父级控制值。这将允许与正确的交易者共享订单，而不会意外授予他们访问不属于他们的其他订单的权限。





  订单将使用自定义 Apex 共享与正确的交易员角色共享。我考虑过使用基于条件的共享规则，但每个对象的此类规则数量有限，而且我们有超过 100,000 名交易员，每人拥有两个角色。我还考虑过使用共享集，因为它们现在可用于合作伙伴社区。但考虑到这将需要对数据模型进行更改以将订单链接到正确的合作伙伴账户记录，并且考虑到它在控制与哪个合作伙伴角色共享记录方面的灵活性较低，我决定使用基于
  Apex 的共享。订单将根据购买的产品与正确的交易员共享。


  待处理订单将保留在 Salesforce 中。已完成订单将被归档。因此，交易员将默认根据前面提到的共享机制访问待处理订单。


  每个交易员在入职时必须提供公司电子邮件地址。此值将存储在交易员的账户记录上。创建订单时，我建议使用 Salesforce Flows 触发向交易员电子邮件地址发送电子邮件警报。我们可以根据购买的产品获取电子邮件地址值，因为产品将链接到其交易员的账户。我建议使用
  Flows 而不是 Apex，因为它是一个可配置的工具，易于编辑和修改。我可以使用 Process Builder 做同样的事情，但 Flows 功能更强大，未来可能需要。


