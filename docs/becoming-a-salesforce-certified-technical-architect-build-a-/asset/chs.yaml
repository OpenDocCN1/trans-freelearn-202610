  \ Connect 用户代理流（之后使用刷新令牌流）。 |\n| Int-005 | Salesforce (Europe) -> MuleSoft -> 七个应用程序\
  \ | 数据 | 批量数据同步 – 异步 | 一个计划的 MuleSoft 批处理作业在特定时间运行，以从 Salesforce 拉取更改的记录并将其复制到其他七个应用程序。\
  \ | Salesforce 与 MuleSoft 之间的 HTTPS (双向 SSL/TLS)，MuleSoft 与七个应用程序之间的 HTTPS (单向 SSL/TLS)\
