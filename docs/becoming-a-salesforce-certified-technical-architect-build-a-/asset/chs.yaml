  正如你在上一章中所学，Salesforce CTA 对期望值很高。架构师应深入理解平台的功能和特性。除了深入理解特定架构概念外，架构师还应在许多架构领域拥有广博的知识。数据是架构师需要掌握的关键架构领域之一。数据无处不在，贯穿你的日常生活，每天你都会为数据发现新的潜力。从销售到服务、市场营销、商业智能和人工智能，数据都是当今现代系统的核心。


  本章，你将学习以下主要主题：


  - 经典 RDBMS 与 Salesforce 的区别

  - 了解数据治理

  - 了解数据安全

  - 数据法规合规性

  - 探索数据类别

  - 数据仓库和数据湖的本质

  - 选择合适的文档管理系统

