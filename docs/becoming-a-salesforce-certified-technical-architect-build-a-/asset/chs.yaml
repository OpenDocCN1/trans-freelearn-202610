- "# 复习委员会练习：第二次模拟\n\n在本章中，您将运用过去章节所学的所有知识。您将接触本书的第二个完整模拟场景，该场景接近您在复习委员会中可能遇到的真实场景。\n\
  \n阅读本章和下一章后，建议您重新阅读场景并自行制定解决方案。\n\n您可以根据需要重复多次，直到感到自如。请尽量坚持*三小时解题窗口*。您将在*附录、技巧与窍门*和*未来之路*中学到一些实用的时间管理技巧。\n\
  \n在本章中，您将涵盖以下主要主题：\n\n- 介绍完整模拟场景：Packt Lightning Utilities\n- 分析需求并创建草稿端到端解决方案\n\
  \n本章结束时，您将熟悉完整模拟场景的复杂性，这将帮助您为实际考试做准备。您还将学习如何为场景中的业务流程创建端到端解决方案。废话不多说，是时候来看看您的第二个完整模拟场景了。\n\
  \n## 介绍完整模拟场景：Packt Lightning Utilities\n\nPackt Lightning Utilities (PLU) 是一家欧洲公用事业公司，为德国、意大利、法国、葡萄牙、比利时和英国的城市提供服务。PLU\
  \ 在 40 个城市运营。他们为 B2C 客户（住宅）和中小型 B2B 客户提供服务。他们提供与电力和天然气分销相关的广泛服务。他们目前为超过 600 万家庭和超过\
  \ 70 万个小型企业账户提供服务。\n\nPLU 长期以来一直在与其现有的 CRM 解决方案作斗争，作为新的战略举措，决定转向 Salesforce。PLU\
  \ 希望利用新 CRM 推出一套新的统一全球销售和服务流程。这是 PLU 为成为更以客户为中心的组织而进行的更大规模数字化转型的一部分。\n\n新服务应提供最现代的客户体验，并保持整体低服务成本运营模式。他们还计划使用新\
  \ CRM 管理与最有价值 B2B 客户的密切特殊关系，并提升其现场销售和现场服务团队的绩效。\n\nPLU 有一个集中式服务支持中心，为所有覆盖国家提供多语言支持。然而，过去三年服务成本一直过高，PLU\
  \ 希望探索引入额外现代服务渠道的可能性。\n\n## 项目概览\n\n有多种类型的员工需要访问系统：\n\n- **关键客户经理**：他们管理与关键 B2B\
  \ 客户的关系，并按地区组织。每个国家包含多个地区。关键客户经理向该国关键客户副总裁汇报，后者再向全球关键客户高级副总裁 (SVP) 汇报。\n- **支持代理**：他们从中央呼叫中心运营。他们服务于住宅和商业客户。代理按其支持的语言组织成团队。有些代理是多语言的。他们都向全球服务高级副总裁汇报。\n\
  - **现场销售代理**：他们在每个国家的特定地区运营，主要负责开发 B2B 业务。他们定期访问现有和潜在客户网站，并为 PLU 争取新交易和续约交易。他们向地区销售总监汇报，后者再向该国销售副总裁汇报。\n\
  - **现场服务技术人员**：他们在每个国家的特定地区运营，负责收集电表读数并修复住宅和商业客户报告的小问题。他们向该国服务副总裁汇报，后者再向全球服务高级副总裁汇报。\n\
  - **营销团队**：他们负责通过执行营销活动来吸引和保留 B2C 和 B2B 客户，从而产生更多潜在客户。他们细分客户并发送大量营销电子邮件。每个覆盖国家都有一个营销团队，向其营销副总裁汇报。营销和销售副总裁向全球销售和营销高级副总裁汇报。\n\
  - **维护合作伙伴**：PLU 与欧洲超过 500 家维护合作伙伴的网络合作。他们处理与能源供应相关的事件。每个合作伙伴与一个国家内的一个或多个地区相关联。\n\
  \n住宅客户每处房产最多可有两个联系人，并可能与多个房产相关联。平均而言，住宅客户每个账户/房产订阅 1.5 种不同的服务。商业客户每个账户最多可有五个联系人，通常有多个相关房产。超过\
  \ 80% 的商业客户同时订阅电力和天然气。\n\nPLU 历史上平均每年每个客户收到三个服务请求。根据法律，他们应保留两年的数据，例如电表读数和服务请求。PLU\
  \ 期望其未来系统支持运营国家的本地语言。现在，您可以深入了解 PLU 的环境。\n\n## 当前环境\n\nPLU 目前正在使用以下系统：\n\n- **国家\
  \ ERP**：PLU 为每个国家使用不同的 ERP 系统。除比利时的 ERP 外，所有这些系统都具有基于 SOAP 的 API。比利时的 ERP 很旧，基于扁平文件数据库。它不提供任何\
  \ API，也不支持任何数据库适配器。但是，它可以连接到 SMTP 服务器。PLU 希望保留所有 ERPs 并将新 CRM 与它们集成。\n- **Power\
  \ Sales**：这是一个高度定制的第三方解决方案。目前用于计算电力和天然气产品的费率、折扣和捆绑包。该系统提供的 API 较差，难以修改。然而，PLU 仍计划在未来五年使用它。它最近与供应商签订了维护合同。\n\
  - **Radar 读卡器**：这是一种用于远程读取旧一代电表的设备。它在 20 米范围内运行，并向电表发送唤醒无线电信号，指示其通电并传输数据。该设备支持有线和蓝牙通信。PLU\
  \ 希望继续使用这些设备来读取旧一代电表。\n- **智能电表**：这些是电表的新版本。它们可以将读数直接传输到集中式服务器。此外，它们还可以从服务器接收数据和信号。PLU\
  \ 与四家不同的智能电表供应商打交道；每家都提供自己的 SaaS 基于云的解决方案来远程管理智能电表。所有智能电表平台都有 REST API。\n- **旧版\
  \ CRM**：PLU 每个国家都有不同的 CRM。其中一个基于旧版 XML 文件存储系统，数据质量差。其他都基于 MS SQL Server。但是，它们具有不同的数据模型，由不同供应商开发。PLU\
  \ 希望退役所有这些系统，并用统一的基于 Salesforce 的解决方案取代它们。\n- **PDF 生成器**：这是一个第三方应用程序，用于生成发票的 PDF\
  \ 版本。它具有定制的 PDF 生成功能并提供丰富的 API。生成的 PDF 将暂时存储在相关的 SSH *文件传输协议* (**SFTP**) 存储中。应用程序会自动删除在\
  \ SFTP 上存储超过 24 小时的文件。\n\nPLU 分享了以下业务流程要求。\n\n## 业务流程要求\n\n以下各节解释了 PLU 希望在其新系统中拥有的业务流程。\n\
  \n### *关键客户管理*\n\nPLU 需要与其关键业务客户保持特殊关系。新系统必须满足以下要求：\n\n- 关键客户是年耗电量超过 50,000 kWh\
  \ 的中小企业，在其一个站点。关键业务客户通常在全国范围内拥有 5 到 15 个站点/房产。\n- PLU 希望系统定期识别新关键客户，并自动将其注册到特定培育计划中。如果任何站点在一年内有三个月消耗超过\
  \ 5,000 kWh，则应通知注册团队。注册团队由该国关键客户副总裁和相关地区的关键客户经理组成。\n- 注册团队应启动注册流程。第一阶段是定义一名主导关键客户经理，开始与客户谈判。可以向客户共享多个定制费率和方案。这些方案应由\
  \ Power Sales 生成。PLU 希望获得关于如何以不影响员工效率的方式促进此过程的建议。\n- 到流程结束时，客户可以切换到不同的、更偏向业务的费率，并应签订新合同。\n\
  - PLU 希望通过引入数字签名来简化流程。一旦文件签署，合同将更新，并应开始将客户切换到新费率的流程。\n- 新合同详细信息将发送到该国 ERP，以促进切换流程。这可能需要长达\
  \ 48 小时。一旦流程完成，相关地区的客户和关键客户经理应得到通知。\n\n\n\n\n\nPLU 分享了关于客户服务流程的以下要求。\n\n### Customer\
  \ Service\n\nPLU 正在寻求扩大支持渠道的数量。此外，他们希望引入一种更受控且标准化的客户处理方式。新系统必须满足以下要求：\n\n- 所有客户都应能够使用自助客户门户或通过呼叫中心创建咨询或投诉。这些请求应根据多种因素（包括语言、事件类型和客户类型）分配给合适的代理。\n\
  - 如果投诉在七天内未得到解决，应通知服务部高级副总裁。\n- 系统应根据上个月的读数自动生成下个月的预测表计读数。\n- 每个站点的预测和实际电力及燃气消耗量应在客户门户中显示。数据应涵盖过去\
  \ 24 个月。客户还应能够查看其过去的发票和付款，并能够查看发票的 PDF 版本。\n- 如果报告能源故障，应创建严重事件，并根据物业地址将其分配给合适的维护合作伙伴。受影响地区的所有客户应在事件创建、状态更新和事件解决时收到短信和电子邮件消息。\n\
  \nPLU 分享了关于计划手动表计读数流程的以下要求。\n\n### Scheduled Manual Meter Reading\n\n手动表计读数流程仍然适用于旧型号表计。PLU\
  \ 分享了以下要求：\n\n- 预计每季度进行一次手动读数。在某些国家，由于法规要求，这必须每月进行一次。现场服务技术人员开车或步行经过住宅或商业场所，使用雷达读取器设备识别\
  \ PLU 服务的附近兼容读取器。\n- 雷达读取器设备带有一个屏幕，显示附近 PLU 服务表计的表计 ID。该设备可以与表计通信以获取其读数。雷达读取器未连接到互联网。但是，它可以与附近的蓝牙设备配对。\n\
  - PLU 希望雷达读取器设备与现场服务技术人员的手机配对，然后使用手机将读数数据发送到 Salesforce。\n- PLU 正在寻求优化其现场服务技术人员的访问时间和差旅成本。\n\
  - 随时，PLU 希望能够跟踪其现场服务技术人员的位置。\n\nPLU 分享了关于计划自动表计读数流程的以下要求。\n\n### Scheduled Automatic\
  \ Meter Reading\n\n自动表计读数流程在不同站点/物业中最常用。PLU 分享了以下要求：\n\n- 智能表计在所覆盖的国家广泛使用。但是，在过去三年中，PLU\
  \ 与四家不同的供应商合作过。每家供应商提供并安装了他们自己的智能表计设备。每家供应商都有一个不同的基于云的平台，用于控制和与表计通信。过去三个月的表计读数也存储在这些平台上。PLU\
  \ 目前已订阅所有四个基于云的平台。\n- 智能读取器必须每月读取。两种设备型号可以定期将数据推送到服务器。所有型号都支持拉取操作。PLU 正在寻求统一从所有供应商检索智能表计数据的方式。所有四个平台都提供一组丰富的\
  \ SOAP 和 REST API。它们提供可用于从智能表计拉取表计读数的 Web 服务。此外，其中两个平台还提供 pub/sub 接口，允许实时接收表计读数。\n\
  \nPLU 分享了关于客户注册流程的以下要求。\n\n### Customer Registration\n\n客户门户是 PLU 现代化客户服务战略的重要组成部分。他们分享了关于客户注册的以下要求：\n\
  \n- 客户无法在社区中自行注册，除非通过邀请。B2C 客户访问门户的权限应在注册 PLU 服务后生成。\n- PLU 希望通过公共网站向未经身份验证的用户展示其产品。用户可以通过提供家庭户数、预计电力消耗和地址详情等信息在线订阅\
  \ PLU 的服务。系统应自动为客户确定并显示正确的费率。PLU 预计这将通过与 Power Sales 集成实现。UI 应对浏览器和手机都具有响应性。\n-\
  \ 客户应能够确认费率。这应在 Salesforce 中生成存储客户和合同详情所需的对象。此外，应创建客户门户的用户访问权限。\n- 在创建用户访问权限后，客户应收到设置密码的电子邮件通知。密码必须满足严格的复杂性要求。\n\
  - 登录后，客户应能够查看其联系信息和合同详情。客户还应能够使用 PLU 品牌的移动应用程序登录门户。\n- 客户应能够邀请更多联系人加入门户，以共同管理特定物业和合同。\n\
  \nPLU 分享了关于现场销售流程的以下要求。\n\n### Field Sales\n\n现场销售流程对发展 B2B 业务至关重要。PLU 分享了以下要求：\n\
  \n- 现场销售代理访问潜在 B2B 线索，并使用手持平板电脑向其介绍可用的不同报价。PLU 希望跟踪与客户进行的所有活动，即使客户决定不使用 PLU 的服务。\n\
  - 完成访问后三天，应向 B2B 客户的主要联系人发送电子邮件调查。应使用两种不同的调查模板，一种用于成功签订的交易，另一种用于流失的交易。如果现场销售代理的得分低于\
  \ 10 分中的 3 分，应自动创建一个案例并分配给现场销售代理的经理。\n\nPLU 分享了以下数据迁移要求。\n\n### Data Migration Requirements\n\
  \n考虑到之前共享的当前现状信息，PLU 分享了以下数据迁移要求：\n\n- PLU 在其旧 CRM 中拥有超过 8000 万客户。数据预计包含大量重复项。唯一活跃客户的数量可能在\
  \ 600 万左右。PLU 希望仅将活跃客户迁移到 Salesforce。PLU 希望了解如何对迁移的记录进行去重，并将它们与相应的 ERP 记录关联，已知同样的重复也存在于\
  \ ERP 中。目前没有计划在 ERP 中进行任何重大数据清理。\n- 旧 CRM 拥有超过 2 亿个表计的详细信息。记录数量庞大是由于显著的记录冗余。预计要迁移的表计实际数量将少于\
  \ 1000 万。PLU 希望清理数据并为每个表计保留单一记录，以构建资产的 360 度视图。\n\nPLU 分享了以下无障碍要求。\n\n### Accessibility\
  \ and Security Requirements\n\nPLU 正在寻求设计安全解决方案的指导。他们分享了以下要求：\n\n- 关键客户及其表计读数仅对管理该客户的关键客户经理及其经理可见，支持代理除外，支持代理可以查看组织中的所有账户。\n\
  - 关键客户经理应能够在特定时期内将客户账户的可见性委派给另一名经理。一旦该期限结束，该记录不应再对被委派经理可见。\n- 投诉仅对处理该投诉的代理及其经理可见。PLU\
  \ 还希望定义一组超级用户，超级用户可以查看系统中的所有投诉。\n- 咨询应对所有支持代理可见。\n- 维护合作伙伴记录应仅对支持代理可见。但是，它们应仅对管理与该合作伙伴直接关系的支持代理可编辑。\n\
  - B2B 客户应能够管理与其账户相关的所有物业和表计。\n- B2C 客户应能够管理其所有相关物业。B2C 客户与多个物业关联是常见情况。\n\nPLU 分享了以下报告要求。\n\
  \n### Reporting Requirements\n\nPLU 请求了一套丰富的报告功能，包括以下内容：\n\n- 全球服务高级副总裁希望一份报告，显示特定年份由维护合作伙伴处理的服务请求与过去四年数据的对比。\n\
  - 全球服务高级副总裁希望一个仪表板，显示按国家和地区划分的接收和解决的咨询及投诉数量。仪表板应指示在目标时间范围内解决的事件数量与超时事件数量的对比。\n-\
  \ 关键客户经理希望一组商业智能报告，显示将关键客户从之前的费率切换到新费率所获得的业务改进。\n- PLU 希望为客户提供一个仪表板，显示过去两年其消耗量的变化。\n\
  \nPLU 分享了以下项目开发要求。\n\n\n\n\n\n### 项目开发要求\n\n考虑到 PLU 计划的复杂性，他们提出了以下项目开发要求：\n\n- PLU\
  \ 希望快速实现价值，并尽快获得 Salesforce 功能。\n- 维护 ERP 的团队采用六个月发布周期，且无法修改其时间表以适应本项目。\n- 从历史上看，客户支持团队习惯于高效率的系统，并且有监管要求，必须在\
  \ 10 分钟内处理通话。他们希望在 Salesforce 中获得类似的体验。\n- PLU 希望获得识别潜在项目风险的支持。\n- PLU 希望有一种清晰、可追溯的方式来跟踪项目生命周期中开发的功能。\n\
  - PLU 正在寻找合适的环境管理策略建议，以确保在每个阶段都能执行适当的测试。PLU 非常渴望了解如何确保其集成接口的可靠性。\n- PLU 正在寻找合适的方法论来管理项目交付并确保适当的技术治理。\n\
  \nPLU 还共享了以下其他要求。\n\n### 其他要求\n\nPLU 的业务正在增长，他们希望拓展可再生能源业务。他们共享了以下要求：\n\n- PLU 最近收购了一家从事可再生能源工作的公司。该公司制造和安装太阳能系统面板以及电池。被收购的公司也在使用\
  \ Salesforce 作为其中央 CRM。PLU 想知道是否应该计划将此 Salesforce 实例与他们自己的合并，还是保持分离，并希望在此决策上获得您的支持。\n\
  \n假设场景到此结束。在继续之前，请确保您已浏览假设场景的所有页面和要求。\n\n开始识别要求并创建草稿解决方案，遵循您在以前场景中使用的相同方法论。\n\n\
  ## 分析要求并创建端到端草稿解决方案\n\n给自己足够的时间来浏览场景并了解全局。您甚至可以开始添加潜在解决方案的笔记。\n\n类似于您在 _第 12 章，练习评审委员会：第一次模拟_\
  \ 和 _第 13 章，展示和辩护：第一次模拟_ 中所经历的，解决方案制定和演示文稿创建活动将分为两个章节。这是由于完整场景的规模和共享要求的数量。您将在本章中涵盖业务流程要求。然后，在下一章中，您将继续处理其余要求并创建演示提案。\n\
  \n就像您在以前的所有模拟中所做的那样，首先了解当前环境并创建图表的第一个草稿。\n\n### 了解当前情况\n\n从第一段开始，您可以找到 PLU 的活动和地理位置描述。您还将遇到参与者、他们的活动以及他们向谁汇报的描述。\n\
  \n仅通过遵循本节中的描述，您就可以了解潜在的角色层次结构。您也可以考虑使用 _企业区域管理_。但是，对于本场景来说，使用角色层次结构要简单得多。最好始终避免复杂化。\n\
  \n> **注意**\n> 您可以通过以下链接了解有关 **企业区域管理** 的更多信息：`https://packt.link/URbEf`。\n> 您可以通过以下链接了解有关使用\
  \ **角色层次结构** 的更多信息：`https://packt.link/lzXl5`。\n\n在这个阶段，您可能能够创建以下角色层次结构草稿：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_465_0.png)\n\
  \n图 14.1 – 角色层次结构（初稿）\n\n考虑到共享的信息，您还可以为参与者规划一些有针对性的许可证。下一节对此进行了说明。\n\n### 确定参与者和许可证\n\
  \nPLU 共享了预期参与者及其活动的简要描述。您可以利用此信息生成其所需许可证的早期草稿。在演示过程中，您还需要解释建议许可证的依据。对于本场景，这可能类似于以下内容：\n\
  \n- **现场销售**：考虑到他们需要处理 B2B 客户并创建新交易和续约交易，他们可能需要使用账户、机会和合同对象。Sales Cloud 许可证似乎很合适。\n\
  \n- **支持代理**：考虑到他们需要处理不同的事件，并且您可能最终会使用 `Case` 对象来建模事件，他们可能需要 **Service Cloud** 许可证。事实上，许多其他许可证可以与\
  \ `Case` 对象一起使用。但是，场景中还提到支持代理根据其技能划分为不同的团队。这可以通过队列或 **Omni-Channel** 实现。如果您最终使用\
  \ **Omni-Channel**，支持代理将需要 **Service Cloud** 许可证。因此，暂时假设使用此许可证。呼叫中心可能还需要一些 CTI 功能。为支持代理暂定\
  \ **Service Cloud Voice** 许可证。\n\n- **服务高级副总裁**：这些参与者可能需要与支持代理相同的许可证，因为他们需要访问相同的对象。\n\
  \n- **营销团队**：考虑到他们需要生成和培育潜在客户，他们需要 **Sales Cloud** 许可证。他们还需要对客户进行细分并向他们发送批量电子邮件。向\
  \ 600 万客户发送批量电子邮件的功能无法使用 **Salesforce Core** 来解决。有几种其他批量电子邮件工具。Salesforce Marketing\
  \ Cloud 与 **Salesforce Core Cloud** 集成得很好。为营销团队成员也假设使用 **Marketing Cloud** 许可证。\n\
  \n- **销售和营销高级副总裁**：关于此角色活动的细节不多。但是，假设此角色需要访问销售和营销团队使用的相同对象和工具，它将需要 **Sales Cloud**\
  \ 和 **Marketing Cloud** 许可证。\n\n- **关键客户经理**：考虑到此参与者需要与 B2B 客户互动并与他们生成新交易，可能需要与\
  \ `Opportunity` 对象进行交互。**Sales Cloud** 许可证似乎很合适。\n\n- **关键客户高级副总裁**：假设此角色需要访问关键客户经理使用的相同对象，您可以假设它也将需要\
  \ **Sales Cloud** 许可证。\n\n- **现场服务**：此参与者需要读取读数并修复小问题。这里的问题可能是事件的另一种名称，您可能会将其与 `Case`\
  \ 对象一起使用。假设此参与者将需要 **Service Cloud** 许可证。您还应该注意 `field` 参与者，因为他们可能表明需要额外的解决方案来帮助他们执行现场访问，例如\
  \ **Salesforce Field Service**。暂定该许可证，如果需要，稍后再调整。\n\n- **维护合作伙伴**：合作伙伴通常不使用任何内部\
  \ Salesforce 许可证。在大多数情况下，他们需要 **Partner Community** 或 **Customer Community Plus**\
  \ 许可证。在这个阶段，您无法确定哪一个更合适。暂时假设使用 **Partner Community** 许可证。\n\n- **客户**：客户需要访问一个在线门户，在那里他们可以管理自己的账户详细信息。考虑到您大约有\
  \ 600 万客户，对于所需的许可证您不应有任何犹豫。此参与者将使用 **Customer Community** 许可证，无论是基于登录的还是基于命名用户的许可证。\n\
  \n您的参与者和许可证图表可能如下所示：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_467_0.png)\n\n\
  图 14.2 – 参与者和许可证（初稿）\n\n您对可能最终使用的一些对象有了良好的了解。利用此信息来创建草稿数据模型。\n\n\n\n\n\n### 创建草稿数据模型\n\
  \nPLU 分享了一条有趣的陈述，表明需要一个复杂的账户模型来实现这种行为。该陈述始于以下内容：\n\n*住宅客户每处房产最多可有两个联系人，并且可与多处房产相关联。*\n\
  \n这表明同一客户可以链接到多处房产。此外，最多两个客户也可以与同一房产相关联。鉴于您计划使用 **客户社区** 许可，并了解其有限的共享功能，您面临以下挑战：\n\
  \n- 您将如何建模房产？您将使用 `Account` 对象还是 `Custom` 对象？\n- 您将如何建模客户？很容易假设使用 **个人账户**，但如何将多个人户与多处房产关联？\n\
  - 您如何确保可以使用 **共享集**（适用于 **客户社区** 许可的共享机制）来控制用户可见性？您尚未达到该要求，但显然客户只应能看到他们关联的房产。\n\
  - 您如何建模其他数据，例如 `Contract`、`Meters` 和 `Meter readings`，以便它们对有权访问 `Property` 记录的用户可见？\n\
  \n其中一些问题可能会影响您解决其他问题的潜在方式。\n\n这是一个关键要求。如果一开始就没有解决好，这是那些可能会让事情变得更棘手的要求之一。\n\nSalesforce\
  \ 在过去几年中做出了许多改进来支持此类用例。它引入了 `AccountContactRelation` 对象，允许将联系人与多个账户关联。它还更新了 **共享集**，以允许基于\
  \ `AccountContactRelation` 对象进行记录共享。这在当时对 Communities 的共享模型是一次巨大的提升。\n\n基于此，您可以利用\
  \ `Person Accounts`、`AccountContactRelation` 和 `Account` 对象的自定义记录类型来建模数据，以表示 `Property`。这将使您能够使用\
  \ `Contract` 和 `Asset` 对象来描述与客户的特定交易以及相关的启用服务（例如，电力）。\n\n以下图表示了 B2C 客户账户结构的数据示例：\n\
  \n![](img/a3b1eecf3c87c814267f2877e8a8be1a_469_0.png)\n\n图 14.3 – B2C 账户结构数据示例\n\
  \n当您遇到如此关键的数据建模要求时，请毫不犹豫地查看 *可访问性和安全性要求* 部分，以确保您的模型将满足与 Community Cloud 用户相关的要求。\n\
  \n在该部分，您还会注意到 B2B 客户需要管理多处房产的需求。遵循相同的原则，您可以为 B2B 用户提出以下建议账户结构的数据示例：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_470_0.png)\n\
  \n图 14.4 – B2B 账户结构数据示例\n\n为您的演示创建此类支持图表很有好处。您可以创建任何有助于进一步解释您解决方案的图表。只需记住在创建任何其他图表时遵循标准。数据示例图表可以帮助您梳理思路并想象解决方案的样子。\n\
  \n现在您已理清思路，请使用您计划使用的对象创建草稿数据模型：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_471_0.png)\n\
  \n图 14.5 – 数据模型图（首个草稿）\n\n在这个阶段，您只是在创建草图和草稿。不必担心整理您的图表。您可以稍后处理。另一个有趣的段落始于以下内容：\n\
  \n> 平均而言，住宅客户每个账户/房产订阅 1.5 种不同的服务。\n>\n> 注意\n> 记下这些数字并密切关注它们。到此时，您应该了解此类数字在场景中的重要性。\n\
  \n最后，查看一下架构全景。\n\n### 编译当前架构全景\n\n这部分很简单。PLU 分享了一组当前使用的系统。您知道 **Salesforce 核心云**（也称为\
  \ Force.com 平台）将处于提议解决方案的中心。如果将所有内容整合在一起，您将得到以下图表：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_472_0.png)\n\
  \n图 14.6 – 架构全景（首个草稿）\n\n现在您已经了解了当前情况和潜在解决方案，请继续分析和解决共享的需求。\n\n### 分析业务流程需求\n\n\
  PLU 分享了六个关键业务流程。场景的这部分通常包含最重要的需求量。强烈建议您为这些流程中的每一个创建业务流程图。这将帮助您发现解决方案中的棘手部分，还能在演示过程中提供一个引人入胜且有吸引力的工具。\n\
  \n从第一个共享的业务流程开始。\n\n### 关键客户管理\n\nPLU 为 **关键客户管理** 流程分享了五个关键需求，因为第一个项目只是此类客户的定义。您将逐一审查每个共享需求并对其进行分析和解决。到本练习结束时，您将拥有一个业务流程图，可帮助您解释端到端的解决方案。现在，从第一个需求开始。\n\
  \nPLU 希望系统能够定期识别新的关键客户，并自动将他们注册到一个特殊的培育计划中。\n\n您脑海中可能立即浮现的三个问题如下：\n\n- 您如何执行流程来定期扫描和评估客户消耗量？\n\
  - 您如何建模月度消耗量？考虑到有 600 万 B2C 客户和 70 万 B2B 客户。您不知道每个组有多少房产，但您知道关键客户拥有 5 到 15 个地点/房产。\n\
  - 注册流程是怎样的？他们将使用哪些对象？\n\n第一个问题最简单，您可以简单地使用 Batch Apex 类或 Schedule-Triggered Flow。但是，取决于您如何建模数据，即使是\
  \ Batch Apex 在处理如此大量的数据时也可能性能不佳。\n\n第二个问题至关重要。这是另一个数据模型相关的设计决策示例，可能会影响许多其他事情。请对这类需求给予额外关注。首先探索将月度消耗量建模为标准化第三范式（3NF）这一常见且最直接的选项。作为提醒，您在第\
  \ 2 章 核心架构概念：数据生命周期 中学习了三个主要范式。以下图说明了数据的样子：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_473_0.png)\n\
  \n图 14.7 – 使用 3NF 建模电表读数\n\n您可以看到，在这里使用 3NF 每年会为每个资产创建 12 条记录。您需要通过进行一些计算来验证此设计。\n\
  \n有 600 万 B2C 客户。平均而言，其中一半同时订阅了电力和天然气。这是 900 万个潜在资产（基于您计划使用 Asset 对象来表示客户通过电表订阅服务）。\n\
  \n还有 70 万 B2B 客户。您不知道其中有多少是关键客户，因此需要假设一个合理的百分比。假设 25% 的 B2B 客户是关键客户，即 175,000 个。\n\
  \n您知道 80% 的 B2B 客户同时注册了电力和天然气。此外，您知道关键客户平均将有 10 处房产。这意味着您大约有 3,150,000 个用于 B2B 的资产（约\
  \ 945,000 个用于常规 B2B 客户和 2,205,000 个用于 B2B 关键客户）。总计，您大约有 12,150,000 个资产。\n\n在 3NF\
  \ 中，您每年每个资产将得到 12 条记录。这将近 1.46 亿条记录。其中大约 3800 万条属于 B2B 客户。任何试图处理如此数量记录的批处理作业都将遇到性能挑战。\n\
  \n一个潜在解决方案是将所有电表读数数据转移到外部平台（如 Heroku），并在该处开发触发注册流程的逻辑。但随后您将遇到与数据可见性和访问管理相关的其他挑战。\n\
  \n另一种解决方案是使用非规范化对象来存储每个电表的月度读数（或者，如果业务有最大限制，甚至针对多个电表）。以下图表是一个说明性数据示例：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_474_0.png)\n\
  \n图 14.8 – 使用非规范化对象建模电表读数\n\n\n\n\n\n你甚至可以使用这些额外字段扩展 `Asset` 对象，除非你想在 Salesforce\
  \ 中保存超过一年的数据（此处正是这种情况，因为系统有一项要求：保留最多两年的数据）。你还可以通过在 `Meter_Reading__c` 对象上引入公式字段，使批量查询更简单，该字段用于判断一年中的三个抄表读数是否存在高于给定阈值的情况。\n\
  \n非规范化对象有其局限性和挑战，但也有其优势和有用的用例。如果你有合理的理由，可以提出这种方法。\n\n现在，来看第三个问题，即如何建模注册流程。\n\nSalesforce\
  \ 中是否有标准对象允许你与现有客户运行涉及多个阶段和活动的销售流程？也就是说，是否存在一个对象，能够启用一套与销售相关的功能，例如销售团队、报表和预测？\n\n\
  你猜对了！你可以使用 `Opportunity` 对象来建模此类销售流程。\n\n如果你将此解决方案整合起来，你计划使用批量作业来查询新的非规范化 `Meter_Reading__c`\
  \ 自定义对象。如果满足某些条件，则创建一个 `Opportunity`，并根据相关区域为其分配合适的 `Opportunity` 团队成员。这项任务看起来太复杂，不适合使用\
  \ Flow，因此你可以使用 Batch Apex（复杂度证明了其合理性）。\n\n更新你的数据模型和业务流程图，然后进入下一项要求，该要求以以下内容开头：\n\
  \n注册团队应启动注册流程。\n\n确定主要关键客户经理可以手动完成。到该流程结束时，该用户将拥有客户账户记录。该要求还表明需要与客户协商不同的报价和资费。这是\
  \ `Quote` 对象的常见用例，整个要求非常适合使用 Configure, Price, Quote (CPQ)。这里的挑战是 PLU 坚持使用 Power\
  \ Sales 作为 CPQ 引擎。\n\n在评审委员会上，你不能假设能说服 PLU 使用不同的 CPQ 解决方案。这主要是因为场景明确表明 PLU 有意继续使用\
  \ Power Sales。PLU 正在寻求建议，即以何种方式最好地促进其用户使用 Power Sales，同时不影响其效率。\n\n你通常可以建议以下方法之一：\n\
  \n- 在 Salesforce 和 Power Sales 之间建立 SSO。用户预计需要在系统之间来回切换并跳转以完成任务。\n- 使用 Salesforce\
  \ Canvas 在 Salesforce 内查看 Power Sales UI。这简化了来回切换的过程，但你仍需处理身份验证。\n- 与 Power Sales\
  \ 开发完全集成，并在其之上构建自定义 UI。\n\n第三种选择最具吸引力，但通常成本较高。在另一系统的业务逻辑之上构建完全新的 UI 并非易事，绝不可低估。\n\
  \n如果这是唯一与 Power Sales 相关的要求，前两种方法都可以采用。但是，你会在场景中后面遇到多个其他要求，其中需要与 Power Sales 集成并在其之上开发自定义\
  \ UI，例如客户注册业务流程中的要求。因此，也为本流程使用相同的集成接口和 UI 是合理的。自定义 UI 可以是一组 Lightning 组件。\n\n在完成此要求的解决方案之前，你需要解决与\
  \ Power Sales 集成的挑战。你已经知道它提供的 API 质量差，难以修改。你不能基于这种质量差的 API 开发自定义 UI。你需要一种方法，除了其\
  \ API 之外，还能直接连接到 Power Sales 的数据库，并在其之上创建一组细粒度的 API。\n\n这非常适合使用 MuleSoft 等中间件。场景中还有几个其他要求证明了需要\
  \ ESB，例如协调与多个本地 ERP 系统的通信。\n\n整合此解决方案后，你将使用 MuleSoft 在与 Power Sales 的集成之上开发自定义 UI。你将使用该接口在\
  \ Salesforce 中生成并填充 `Quote` 对象。随后，可以使用 `Quote` 对象生成并与客户共享 PDF。\n\n确定主要关键客户经理将是一个手动过程，最终将账户所有权分配给选定的用户。\n\
  \n更新你的环境架构图、数据模型和集成列表。然后，进入下一项要求，该要求以以下内容开头：\n\n*在流程结束时，客户可以切换到不同的、更偏向业务的资费，并应签订新合同。*\n\
  \n这是一个常见要求。一旦 `Opportunity` 状态为 closed-won，你可以自动使用其数据创建 `Contract`。你可以使用 Salesforce\
  \ Flows 实现此功能。`Contract` 状态将显示为草稿，并等待客户签名。\n\n值得注意的是，`Contract` 对象与 `Asset` 对象没有开箱即用的关系。`Service\
  \ Contract` 对象有（通过命名令人困惑的 `ContractLineItem` 对象）。不过，`Service Contract` 对象不可用于 **客户社区**\
  \ 用户。因此，你需要使用自定义对象扩展 `Contract` 对象，使其能够与 `Assets` 关联。\n\n`Assets` 将代表与电表的关系，而不是电表本身。这样做的原因是便于多个客户使用同一电表，例如在租赁房产中，而不会丢失对前客户的追踪。这形成了\
  \ `Asset` 的360度视图，通常是公用事业公司所期望的。\n\n你将引入两个自定义对象：`Meter__c` 和 `Contract_Line_Item__c`。\n\
  \n值得注意的是，你可以使用 Salesforce Industries（原 **Vlocity**）的 **能源与公用事业云数据模型**，只要你能解释其对象、用途以及如何识别和缓解任何\
  \ LDV 对象。同样，如果你计划使用其他基于 Vlocity 的功能，例如 **OmniScript**、**DataRaptor** 或 **FlexCards**，则要准备好解释其工作原理并证明其使用的合理性。\n\
  \n> **注意**\n> \n> 如果你对 Salesforce 垂直产品缺乏足够经验，请坚持使用你知道可行的解决方案。这也适用于 Salesforce Field\
  \ Service 等专用解决方案。\n> \n> 简而言之，如果你计划使用这些产品中的任何一种，你必须确保自己对其拥有相当多的了解：为什么使用它、如何使用它（高层次）、其数据模型是什么，以及需要注意的陷阱是什么。\n\
  > \n> Salesforce Field Service 正越来越成为 CTA 应了解的产品之一。\n\n更新你的数据模型，然后进入下一项要求。\n\nPLU\
  \ 希望通过引入数字签名来*简化流程*。\n\n有许多第三方产品可以捕获数字签名。其中大多数还可以触发 Salesforce 中的逻辑或更新记录。\n\n你可以提议使用\
  \ **DocuSign** 之类的产品。一旦捕获签名，DocuSign 可以更新 `Contract` 状态，从而启动切换流程。更新你的环境架构图以包含 DocuSign。\n\
  \n根据下一项要求，切换流程由 ERP 完成。进入下一项要求并进一步阐明解决方案的其余部分。\n\n新合同详细信息将发送到国家 ERP，以促进切换流程。\n\n\
  此过程最多可能需要 48 小时。流程完成后，应通知客户和相关区域的关键客户经理。\n\n该要求未指定将合同详细信息发送到 ERP 的预期时间框架。你可以假设这可以通过\
  \ MuleSoft 的批量同步作业来实现。你还可以利用 **平台事件** 等功能将近实时负载发送到 MuleSoft，然后由 MuleSoft 将其发送到正确的\
  \ ERP。你还可以考虑使用 **外发消息** 实现相同目的，因为你只需从一个对象（`Contract`）发送详细信息。\n\n**平台事件** 提供一种通常被忽视的出色附加功能。顾名思义，它们触发平台本身可以订阅的事件。这使你能够在平台内开发松耦合、可扩展的事件驱动架构。\n\
  \n\n\n\n\n你可能会问自己，签署是否被视为你希望基于其执行特定平台逻辑的事件，例如创建 **Chatter** 帖子或更新其他对象上的某些字段。如果答案是\
  \ *是的* 或 *可能在不久的将来*，那么 **平台事件** 是一个不错的选择。此功能会触发可从平台内部或外部订阅的平台事件。\n\n在这种情况下，考虑到公用事业业务高度依赖其与客户的合同状态，这可能是一个有价值的功能。在签署合同时触发平台事件，可以帮助你满足多项其他未来需求。这将是使用它来解决此需求的依据。\n\
  \n一旦 ERP 完成切换过程，它将发起向 Salesforce 的入站调用以再次更新合同状态。完成此操作后，你可以启动 **Flow** 来创建 **Chatter**\
  \ 帖子，通知属于 **Opportunity** 团队的关键客户经理，并发送电子邮件提醒以通知客户。\n\n为了使其更易读，你已将业务流程图拆分为两部分。第一部分可能如下所示：\n\
  \n![](img/a3b1eecf3c87c814267f2877e8a8be1a_478_0.png)\n\n### 图 14.9 – 关键客户管理业务流程图（第一部分）\n\
  \n第二部分解释了流程中较长的部分，可能如下所示：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_479_0.png)\n\
  \n### 图 14.10 – 关键客户管理业务流程图（第二部分）\n\n一个有趣的挑战将是与比利时 ERP 的集成。你知道它不提供任何 API，它基于平面文件数据库，并且不支持数据库适配器。\n\
  \nMuleSoft 可以连接并与平面文件通信。它们通常是简单的文本或基于 XML 的。向其写入不应该是一个挑战。然而，比利时 ERP 是一个无法使用 API\
  \ 的旧系统。但它可以与简单邮件传输协议（SMTP）服务器通信。这样一来，一旦切换过程完成，它就可以发送一封电子邮件。你可以开发自定义 Apex Email 服务来接收电子邮件、解析它们，然后相应地更新相关记录。\n\
  \n这结束了第一个业务流程。更新你的系统架构图和集成接口列表，然后继续下一个业务流程。\n\n### 客户服务\n\nPLU 为客户服务流程共享了五个关键需求。你将逐一查看这些共享需求并进行分析和制定解决方案。从第一个需求开始，它以如下内容开头：\n\
  \n所有客户都应能够使用自助服务客户门户或致电呼叫中心来创建询问或投诉。\n\n客户将能够使用客户社区提出询问和投诉。你可以使用带有多个记录类型的 Case 对象来表示询问和投诉。\n\
  \n该场景未指定 PLU 是否希望以软电话和 CTI 功能来现代化其呼叫中心，但你可以假设如此，并将 Service Cloud Voice 添加到系统架构图中。\n\
  \n你在第 13 章“呈现与辩护：第一次模拟”中学习了队列与 Salesforce Omni-Channel 之间的区别，并了解到队列适用于表示单个技能。此需求需要实现基于技能的路由，它将考虑履行特定案例所需的所有必要技能，这是\
  \ Salesforce Omni-Channel 提供的功能。\n\n更新系统架构图以包含客户社区和 Omni-Channel，然后继续下一个需求。\n\n\
  如果投诉在七天内未得到解决，应通知服务高级副总裁。\n\n此需求可以使用案例升级规则来满足。你可以配置升级规则，在满足上述条件时向服务高级副总裁发送电子邮件。\n\
  \n系统应根据上个月的读数自动生成下个月的预测表计读数。\n\n你使用反范式化自定义对象对年度表计读数进行了建模。此需求可以通过引入 12 个额外字段来满足，以表示给定年份的预测每月读数。\n\
  \n在第 2 章“核心架构概念：数据生命周期”中，你学习了经典 RDBMS 与 Salesforce 之间的一些区别，包括在 Salesforce 中，为特定用例创建带有许多字段（列）的对象（表）是可以接受的。\n\
  \n你可以拥有一个定时 Flow，以便每月自动填充正确的预测字段。或者，你可以使用 **Before-Save Flow** 在更新实际读数值时更新预测字段值。例如，Flow\
  \ 可以在 **Jan_Actual__c** 字段更新后自动填充 **Feb_Forecasted__c** 字段的值。考虑到系统中将拥有大量 **Meter_Reading__c**\
  \ 记录，这将更高效。\n\n更新你的数据模型，然后继续下一个需求，它以如下内容开头：\n\n*每个站点的预测和实际电力及燃气消耗量应在客户门户中显示。*\n\n\
  数据应涵盖最后 24 个月。客户还应能够查看其过去的发票和付款，并能够查看其发票的 PDF 版本。\n\n根据此需求，**Meter_Reading__c**\
  \ 对象应对特定账户的客户社区用户可见。你可以通过使用主从关系将 **Meter_Reading__c** 对象与 **Asset** 对象关联来实现这一点。这样，任何有权访问\
  \ **Asset** 记录的用户都能查看其相关的 **Meter_Reading__c**。客户社区用户将能够访问其有权访问的 **Accounts** 记录相关的\
  \ **Assets**，包括任何 **Property** 记录。\n\n这是你在此场景中首次遇到与发票和付款相关的需求。可以合理假设这些对象将存在于 ERPs\
  \ 中。你可以随后使用 **Salesforce Connect** 将其在 Salesforce 中公开。\n\n> **注意**\n> 如果你使用与 ERPs\
  \ 的直接连接，你最终会得到六个外部发票对象。此外，一些 ERPs 是旧系统，无法提供 **OData-compatible** 接口。\n\n你可以使用 MuleSoft\
  \ 连接到所有 ERPs，检索发票，并将它们聚合并作为 Salesforce 可以订阅的 **OData** 接口公开。假设你将分别将发票标头、行项目和付款检索为独立的外部对象。现在，更新你的数据模型以包含新的外部对象。\n\
  \n**PLU's PDF Generator** 应用程序应生成 PDF。该应用程序接收输入数据并生成存储在 SFTP 上的 PDF。这意味着它不会提供即时生成\
  \ PDF 的交互式用户体验。PDF 需要预先生成并存储在客户社区用户可访问的位置。\n\n**PLU** 没有 DMS。你可以建议他们开始使用一个，或者使用\
  \ Salesforce Files。后一种选择足够好，考虑到这些文件的内容在生成后不会更改。不需要高级文档管理功能。\n\n要生成这些 PDF，你可以假设一个每月运行的\
  \ MuleSoft 批处理作业，从 ERPs 检索发票详细信息，并将其传递给 PDF Generator 系统以生成 PDF。然后 MuleSoft 将检索存储在\
  \ SFTP 上的所有文件并将其传输到 Salesforce。你可以使用包含账户 ID 的特定文件命名约定。这将允许 MuleSoft 将文件附加到正确的 Account\
  \ 记录。\n\n将 Content Document 对象添加到你的数据模型中。你的数据模型现在可能如下所示：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_482_0.png)\n\
  \n图 14.11 – 数据模型（第二份草稿）\n\n\n\n\n\n您的景观架构图可能如下所示：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_483_0.png)\n\
