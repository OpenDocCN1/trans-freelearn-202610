  ## API 导向架构


  **API 导向架构**是一种 API 策略，其中所有外部和内部服务都作为受管 API 暴露，无论其实现方式如何（微服务、SOA 服务、源自单体应用程序的 Web
  服务，或基于其他架构）。**受管 API**在当今的现代术语中，不仅仅提供诸如安全策略、限流、版本控制和自动服务发现等治理能力。该原则已扩展到包括开发者门户（他们可以在使用
  API 之前尝试 API）、生产力工具以及一种注册和支付 API 使用的机制。在这种方法中，API 通常组织成三个不同的层：


  - 系统 API：这些 API 用于访问核心系统和服务。它们在服务消费者与底层系统或服务之间提供了一个简化的绝缘层。

  - 流程 API：这些 API 用于与来自底层系统 API 或其他流程 API 的数据进行交互、转换和塑造，从而有效地打破数据孤岛。它们不依赖数据来源的源系统，也不依赖数据将要传送到的目标系统。系统
  API 和流程 API 都可以用于连接现有的微服务以及其他企业服务，具体取决于用例。

  - 体验 API：这些 API 用于让最终用户或应用程序轻松访问和消费数据。它们通常与一个或多个流程 API 通信，以交付特定功能。


  微服务众所周知会创建许多端点，这些端点通常难以控制和货币化。API 导向架构旨在制定一种 API 策略，通过利用 REST 等轻量级标准的功能，并将其与现代 API
  网关功能相结合，来管理不同企业服务之间以及与外部消费者之间的交互方式。


  微服务通常由应用程序消费。API 导向架构旨在将这些应用程序转化为一组更小、更轻量的 API。这可以帮助企业向 API 经济迈出步伐。例如，企业可以在其丰富的服务集之上创建一组
  API，这些服务使用不同的技术构建并基于不同的架构，然后利用 API 管理器以不同的适用策略和订阅机制在内外部暴露这些服务。


  此外，这种方法也被视为快速应用程序开发的推动者，因为你可以重用基于不同业务流程构建的 API。MuleSoft Anypoint Platform 是一种工具，可帮助企业交付
  API 导向的集成架构。


  ## 事件驱动架构


  事件驱动架构是一种软件开发方法，利用事件在集成和解耦的应用程序中进行通信和触发操作。事件只是特定对象状态的变化。例如，客户状态值的变化可能会触发客户状态变更事件，从而在集成系统中启动一组操作，例如启动营销旅程。


  事件驱动架构继承了前面提到的消息集成风格的一些原则。事件驱动架构有三个主要组件，即事件生产者、事件路由器和事件消费者。生产者将事件发布到路由器，路由器处理过滤并将事件推送到订阅的消费者，消费者接收事件、解析它、将其转换为适合其需求的格式，然后使用它，通常用于更新其自身的数据版本或触发后续逻辑。流处理平台、现代
  ESB 或 CometD 等事件路由总线通常用作路由器。


  现在您已经掌握了现代集成方法的一个重要主题，可以进入另一组关键的架构概念。密码学是现代数字通信构建的基础之一。它已使用数百年，但在数字时代得到了蓬勃发展。密码学概念与集成密切相关并被大量使用。在下一节中，您将了解一些一般密码学概念，理解关键的密码学算法类型，并详细讨论它们的一些用例。


  ## 密码学：理解一般概念


  密码学与其他架构领域（例如集成以及身份和访问管理 (IAM)）有着紧密的关系。它也与数据有着强烈的关系。作为 Salesforce 架构师，您需要了解密码学的价值、不同类型的密码学算法，并对流程有高层次的理解。这将帮助您了解
  Salesforce 实施项目中日常活动的复杂性，例如使用传输层安全性 (TLS) 或双向 TLS（也称为相互身份验证）来保护集成通道，或者身份验证令牌是如何进行数字签名的。


  **加密**是将原始可读数据（也称为明文）转换为未经授权的一方无法读取的形式（也称为密文）的过程。加密不是防止他人干扰数据的方法，而是一种机制，用于拒绝未经授权的一方访问数据的可读形式。换句话说，攻击者最终会得到一个没有用的数据版本，并且在合理的时间内无法将其转换回有用的格式。


  以古代加密算法为例。移位密码是一种经典且非常基础的方法，用于在不安全地区通过信差发送加密消息。在移位密码中，单词字母的顺序根据特定逻辑重新排列。例如，hello
  world 这样的陈述可能会变成 ehllo owrdl。如果消息落入不法之徒手中，他们仍然可以破坏或篡改它，但理想情况下，他们不应该能够读取它。


  古代加密的另一个例子是替换密码，它依赖于根据只有消息生成器和授权方知道的规则，用其他字母或符号替换字母或符号。例如，London 通过将每个字母替换为英文字母表中的下一个字母，变成
  Mpoeop。通常，一旦你知道两件事（即算法和密钥），消息就可以轻松解密。在此示例中，算法是替换密码，密钥是英文字母表中的字母顺序 + 1。


  在当今，使用计算机很容易破解这些算法。当今的密码学算法要复杂得多，更难以破解。


  直到现代，密码学和加密主要指同一件事。然而，在第一次世界大战期间，密码学使用的技术有了飞跃。首先使用了转子密码机，然后在第二次世界大战期间开发了更多计算能力。


  现代密码学依赖于计算机科学实践和数学理论。它们旨在提供一种机制，通过使破解尝试变得不可行来保护加密数据的内容。理论上，所有加密算法都可以破解，只要给予足够的时间并考虑可用的计算能力（最基本的攻击形式是暴力破解，它会尝试每一个可能的密钥，直到找到正确的密钥为止）。然而，考虑到实现这一过程可能不可行，这使得这些算法在计算上是安全的。例如，要使用暴力破解破解
  AES-256，攻击者平均需要尝试 2^255 个密钥。估计




  这对于 2016 年的高端 PC 来说，将需要 27 万亿年的五倍时间。随着计算机技术的最新进展，所需时间已大幅减少，但仍可能需要一段时间。因此，破解此加密在实践中根本不可行，因此在计算上是安全的。


  你之前已经接触过一些术语，但有一些关键术语你需要熟悉：


  - 密钥/加密密钥：加密密钥是控制密码学算法输出的输入参数。密钥是密码过程中的基本元素。解密密文需要密钥。没有它，密文可以被视为无用。


  在第 2 章“核心架构概念：数据生命周期”中，你接触过一种数据销毁机制，它只是依赖于销毁加密密钥。这样一来，加密数据就变得无用且无法恢复。密钥被认为是密码学过程中最重要的元素。攻击者可以找出用于加密一段信息的算法（这可能是公开可用的东西，例如
  TLS 使用的算法，你将在本章后面学习），但只要密钥尚未泄露，这不应是问题。生成长加密密钥的过程极其复杂。


  对称密码学算法通常使用 128 位和 256 位长度的密钥。另一方面，非对称密码学算法通常使用 1,024 位和 4,096 位长度的密钥。你将在本章末尾了解更多关于对称和非对称密码学算法的信息。


  - 密钥管理：这是管理密码学密钥的过程。它包括生成、交换、存储、使用、替换和销毁密钥。安全的密钥管理对企业至关重要。它涉及制定企业政策、培训用户以及定义组织和部门之间的交互。密钥和证书通常在存储库中进行管理。


  > **注意**

  > 密钥管理是一个广泛的领域，超出了本书的范围。


  最近，云服务提供商开始支持一种称为自带加密（BYOE）或自带密钥（BYOK）的机制，其目的是通过让客户完全控制其加密密钥，而不是依赖云服务提供商提供或托管的密钥存储库，来增强客户在云中存储数据的信心。Salesforce
  Shield 支持 BYOK 概念。


  - 初始化向量（IV）：这通常可以被视为密码过程中使用的一个初始值，很可能在迭代开始时使用。这个伪随机值用于确保每条消息都以不同的方式加密。即使同一条消息被加密两次，结果每次看起来也会不同。这有助于进一步保护密文，因为攻击者不会意识到两个密文块基于相同的明文，这显著降低了攻击者分析模式的能力。与密钥不同，IV
  不应泄露。许多算法会将 IV 设置为密文的前 128 位。如果消息落入不法之徒手中，攻击者可以轻松提取 IV，但没有密钥它是无用的。对于接收者（拥有密钥），使用密钥和唯一
  IV 解密消息是简单直接的。


  如果你熟悉 Salesforce Crypto 类，你会注意到它具有 encryptWithManagedIV 和 decryptWithManagedIV 方法，不像标准的
  encrypt 和 decrypt 方法，它们不希望将 IV 作为输入参数。encryptWithManagedIV 和 decryptWithManagedIV
  都会从加密消息本身中提取 IV，并期望其位于密文的开头。如果你不熟悉 Salesforce Crypto 类，请查看在线文档。你将在后续章节中了解更多关于此类的信息，但查看在线文档并理解该类提供的不同功能仍然是个好主意。


  - 盐：盐是添加到输入中的一段伪随机数据。盐主要用于单向哈希算法。例如，捕获用户密码的系统可以在哈希组合文本之前向其中添加一个盐值。这使得攻击者更难猜测原始密码的长度。此外，考虑到盐值每次都是随机的，对于两个相同的输入，输出将完全不同。


  回到这个例子，即使攻击者设法破解了其中一个密码，他们也无法猜测是否有其他用户使用了相同的密码，从而也危及他们的账户。用更专业的术语来说，加盐会增加低熵输入的熵。


  与 IV 类似，盐值不应泄露。通常，它将与其他用户详细信息一起存储在数据库中。


  - 证书：证书是一份电子文档，包含称为公钥的加密密钥，以及其他信息，例如颁发者和证书的用途。证书用于证明拥有证书公钥对应私钥的特定实体（例如 Web 服务器）的真实性。公钥和私钥是用于非对称密码算法的术语。证书可以由颁发者进行数字签名。对于公共网站，颁发者将是一个称为证书颁发机构（CA）的第三方独立实体。CA
  的示例包括 Comodo、GeoTrust 和 Symantec。


  例如，当您访问安全的 HTTPS 网站时，网站会将其证书呈现给您的浏览器。证书包含服务器的公钥。这是由 CA 颁发的，因此证书本身将包含 CA 的数字签名，以确认证书的真实性。使用公钥和
  CA 签名，浏览器可以确保它正在与之通信的服务器确实是正确的服务器，并且与该服务器的任何通信都将受到中间人攻击的保护。由 CA 颁发或签名的证书通常称为 CA
  签名证书。后来，您将了解 TLS 协议的工作原理，这将帮助您进一步理解数字证书的价值和用途。您还将更详细地了解数字签名的工作原理。


  - **分组密码**：这是赋予对 _固定长度_ 比特组（称为 _块_）进行操作的密码学算法的名称。例如，**高级加密标准**（**AES**）算法使用不同长度的密钥（如
  128、192 或 256 位）加密 128 位块。


  你已经学习了密码学，并探索了当今使用的一些常见术语。现在，让我们继续了解不同类型的密码学算法。


  ## 密码学算法类型和用例


  你将深入研究的两种密码学算法是对称密码学算法和非对称加密算法。你还将深入了解哈希算法、数字签名和 **消息认证码**（**MAC**）。


  ## 对称密码学算法


  这是一类依赖于 _对称密钥_ 来同时加密明文和解密密文的算法。安全、可靠地存储密钥对这种类型的算法至关重要。需要在双方（发送方和接收方）之间共享密钥，是这种类型算法的主要缺点之一，因为攻击者可能会拦截所使用的通道并获取密钥。历史上存在多种变通方法（记住，其中一些算法已经存在多年了）。数字世界中已经采用了更精简的方法，当你了解
  TLS 的工作原理时，会了解更多相关内容。


  有几种对称密码学算法也被视为 **互易密码** 或 **自互易密码**。这是一种密码算法，它可以获取明文并使用加密密钥将其通过特定算法逻辑转换为密文。然后，它获取密文并使用相同的密钥通过完全相同的逻辑再次生成明文。这包括
  XOR 密码和 Beaufort 密码，以及著名的二战 Enigma 机。


  对称密码学算法主要有两种类型，即 _流密码_ 和 _分组密码_。你之前学习过后者，而前者超出了本书的范围。流行的现代对称密码学算法示例包括 **数据加密标准**（**DES**）、Blowfish、AES
  及其不同版本，即 AES-128、AES-192 和 AES-256。Salesforce `Crypto` 类支持这三个版本的 AES。






  还有派生的对称加密算法，其运行方式与您刚才介绍的算法略有不同。虽然 AES 等算法旨在将明文加密为密文，但哈希算法旨在确保特定消息的完整性。MAC 算法用于提供这种哈希功能，以及某种身份验证。下一节将详细介绍这一点。


  ## 哈希算法


  哈希算法是为解决一个简单问题而设计的算法：接收者如何确保接收到的消息未被更改或篡改？哈希算法从明文生成摘要。摘要（也称为哈希值）无法转换回明文。哈希算法是单向函数，即其输出不可逆转。哈希算法具有以下属性：


  - 这些算法是确定性的。因此，对于相同的输入消息，您始终会得到相同的输出结果（除非使用盐值，如前面讨论过。在哈希之前向消息添加不同的盐值会生成不同的哈希结果）。

  - 由于其特性，攻击者尝试生成产生给定哈希值的消息在计算上不可行。

  - 即使对原始明文进行微小更改，也会显著改变哈希值，使新哈希值看起来与旧值完全无关。这有时被称为雪崩效应。

  - 通常，哈希算法不需要或不使用密钥。请记住，哈希算法的目的是确保原始明文的完整性。哈希算法在计算机系统中有广泛用途。它们用于数字签名和 MAC 算法，以及生成加密密钥、创建索引数据、检测重复数据和创建消息校验和。

  - 流行的现代哈希算法示例包括 MD5 消息摘要算法、Whirlpool、安全哈希算法（SHA）及其不同版本，即 SHA-1、SHA-256 和 SHA-512。Salesforce
  Crypto 类支持这三个版本的 SHA。


