  \n## 摘要\n\n在本章中，你深入了解了 Salesforce 集成架构领域的细节。你了解了 CTA 预期涵盖的内容以及详细程度。你发现了关键的 Salesforce\
  \ 集成模式，并理解了它们对设计解决方案清晰度的重要性和影响。\n\n然后你处理了一个聚焦于集成架构的小型假设情景，并为其制定了解决方案，创建了一些引人入胜的演示提案。你学习了设计集成接口的结构化方法，并遇到了一些有趣的设计决策。你接触到了多个示例，其中你使用图表来传达结构化且易于遵循的解决方案演示。你学习了如何避免过早对集成接口得出结论所带来的负面影响。\n\
  \n你还在小型情景中涵盖了其他主题，包括将用户迁移到新身份存储以及处理合作伙伴用户，并初步了解了一种称为问题播种的演示技巧。\n\n你现在将进入需要掌握的第六个领域：开发生命周期与部署规划。\n"
- "# 10 开发生命周期与部署规划\n\n在本章中，你将继续学习 CTA 必须掌握的 Salesforce 特定知识领域。开发生命周期和部署规划是七个领域中的第六个领域的一部分。你将学习所需知识，然后为每个领域完成一个使用小型假设情景的实践练习。\n\
  \n在之前的章节中，你涵盖了使用 Salesforce 平台开发安全且可扩展的企业解决方案所需的若干主题。在本章中，你将了解设置企业开发环境所需的考虑因素、功能、概念、技术和工具。\n\
  \n企业希望确保从其 Salesforce 投资中获得最大收益。如果没有适当的治理水平，无法实现这一点，治理支持并指导整个项目过程中的开发活动。项目/计划治理应确保所开发的解决方案满足业务需求，且易于维护、可扩展、无错误且性能良好。\n\
  \n作为 CTA，你被期望在整个过程中担任指导角色。你应该能够帮助客户建立合适的治理机构，并指导开发团队制定开发和发布流程。这将确保 Salesforce 功能按时、按预算且无错误地交付。\n\
  \n在完整的评审委员会场景中，通常会有一个专门针对该领域的、包含大量要求的章节。该领域的范围定义明确，这意味着挑战通常在于所需知识的深度。在本章中，你将涵盖以下主要主题：\n\
  \n- 了解 Salesforce 开发生命周期与部署架构师的角色\n- 介绍开发生命周期并部署一个小型假设情景 – 模型家具\n- 设计项目环境和发布策略\n\
  \n## 了解 Salesforce 开发生生命周期与部署架构师的角色\n\n开发生命周期与部署架构师通常是动手实践的、技术能力强的专业人员，他们设计并实现软件开发环境，包括其发布管理流程和工具。他们识别并降低项目风险，并与其他专业人员合作制定整体测试策略以解决质量问题。\n\
  \n这些架构师还积极参与构建治理机构，以确保为给定的业务挑战选择最佳技术解决方案。\n\n> **注意**\n>\n> 根据 Salesforce 的在线文档，CTA\
  \ 候选人应能够满足一套特定的目标，所有目标均可在以下链接中找到：`https://pact.link/UskVD`。\n\n在本章结束时，你应该能够做到以下几点：\n\
  \n- 识别项目风险并制定缓解策略\n- 识别开发方法论对工作流的影响\n- 推荐测试策略以缓解项目风险\n- 推荐合适的项目治理以支持技术决策\n- 制定合适的环境管理策略\n\
  - 描述**持续集成**（CI）工具和源代码控制在发布管理中的价值\n\n现在，让我们更仔细地了解每个目标。\n\n## 识别项目风险并制定缓解策略\n\n评审委员会情景旨在代表现实世界中的用例。在实际项目中，你会遇到许多挑战和风险。有些与平台本身相关，而其他则与其他系统、解决方案或并行项目相关。\n\
  \n你被期望识别这些风险并制定一组缓解策略来解决它们。风险可能包括但不限于以下内容：\n\n- 发布周期冲突\n- 流程冲突\n- 采用率低且阻力大\n\n接下来，你将详细了解每种风险。\n\
  \n## 发布周期冲突\n\n你可能会在 Salesforce 平台或与 Salesforce 相关/集成的另一个平台上运行多个并行项目。当不止一个项目/平台有不同的发布周期时，通常会出现冲突，主要是由于所发布解决方案的版本之间存在不兼容性。你通常可以通过提出以下组合来解决这个问题：\n\
  \n- **多层环境策略**：在此策略中，功能在低级环境中开发，并且仅在通过某些测试并满足预定义的质量措施后才会提升到高级环境。这使你可以测试功能并在早期阶段检测任何冲突。测试过程通常包括验证跨系统功能，作为所谓的集成测试的一部分。\n\
  - **治理机构**：治理旨在引入流程和法规来解决和预防冲突。治理机构是一个组织结构，包括所有相关团队/项目/流程中的业务和技术成员。这将确保一个团队开发的功能为其他团队所知并获得批准。\n\
  - **活跃的发布周期**：引入流程、机制和工具，以确保所有不同的流都使用最新的代码库，这可以显著降低冲突的可能性。\n\n有关每种策略的更多详细信息将在稍后的《推荐合适的项目治理以支持技术决策》和《制定合适的环境管理策略》部分中介绍。接下来，你将探讨在设计开发生命周期和部署策略时可能遇到的第二种最常见风险。\n\
  \n## 流程冲突\n\n多区域/多国项目的关键挑战之一是各地区业务流程中缺乏纪律性。许多企业希望在这些流程中实现某种统一/标准化。但这并非易事，你通常通过以下组合来解决：\n\
  \n- **使用合适的组织策略**：你在第 5 章《开发可扩展的系统架构》中涵盖了这个主题。选择合适的组织策略是在标准化和自主性之间取得适当平衡的第一步。有时，在同一组织中运营多个业务单元的价值会被其可能导致的技术挑战所抵消，例如相互依赖和复杂的利益相关者管理。\n\
  - **使用治理机构**：这涉及创建一个组织结构，包括大部分或全部涉及的地区/国家/业务单元中的业务和技术成员。这个治理机构可以帮助协调所有地区收集的需求，从而使你能够设计出满足所有人需求的正确解决方案。\n\
  \n\n\n\n\n- **使用正确的交付方法论**：现代交付方法论拥抱变更，允许原型制作，并让客户与交付团队保持紧密协作。这将有助于您建立正确的预期并减少任何抵触情绪。\n\
  \n您将在 *推荐支持技术决策的正确项目治理* 部分深入了解第二和第三点。接下来，您将探索在设计开发生命周期和部署策略时可能遇到的第三种最常见风险。\n\n##\
  \ 采用率低且抵触情绪高\n\n这是向企业引入任何新解决方案或新技术时都会面临的常见挑战。出于本能，人们往往对不了解的事物持犹豫态度。有些用户可能很难走出舒适区，使用新解决方案或全新平台。这种挑战需要一套全面的变更管理流程。这并非\
  \ Salesforce 架构师预期需要主导的工作。但是，您需要熟悉其一些原则和常见的应对方式，这些方式通常包括以下几种组合：\n\n- **全面的沟通计划**：一个涵盖项目前、项中和项后各个阶段的全面沟通计划，并配有扎实的培训计划。\n\
  \n- **治理机构**：该组织结构包括业务和技术成员，并涉及各部门的技术推动者。这些推动者将在其所在部门/区域内充当项目大使。他们将在项目期间分享自己的想法、挑战和需求。他们将被纳入解决方案的制定过程中，并参与其中。这会让他们感觉自己拥有该解决方案，并且是团队的一部分。随后，这些推动者将成为首选专家，以支持其他同事并确保项目发布后的采用。\n\
  \n- **正确的交付方法论**：这能让客户和推动者与交付团队保持紧密协作。他们将在解决方案构建过程中理解它。因此，他们不会对结果感到惊讶。这种方法论将让他们在构建期间有机会纠正问题并提供反馈。这确保了解决方案将能够满足最终用户的需求。\n\
  \n您将在本章中介绍第二和第三点，但全面沟通计划超出了本书的范围。鼓励您从其他来源（例如 Emily Carr 所著的 *IT 项目的实用变更管理*）了解更多相关信息。\n\
  \n## 识别开发方法论对工作流的影响\n\n作为 Salesforce CTA，您需要对 IT（尤其是 Salesforce 项目）中使用的不同开发方法论有深入的了解和经验。\n\
  \n主要有三种开发和交付方法论：\n\n- **瀑布模型**：在此模型中，活动被分解为顺序阶段（尽管有些阶段可能并行进行）。每个阶段的产出是下一个阶段的输入。这提供了一种刚性且受严格控制的交付模型。\n\
  \n- **敏捷模型**：该模型依赖于通过跨职能团队成员与客户之间的协作来发现需求并开发合适的解决方案。其原则包括拥抱变更、演进式开发、尽早让最终用户参与、持续改进和早期交付。\n\
  \n产品开发被分解为称为冲刺的小型增量迭代。每个冲刺通常持续 1 到 4 周，涉及一个跨职能团队，负责规划、定义、设计、开发、测试和发布每个冲刺中包含的不同功能。\n\
  \n- **混合模型**：这包含瀑布模型和敏捷模型的元素。它通常在项目开始时包含一个前期/蓝图阶段，以定义总体范围并就适当级别的解决方案设计达成一致（故意避免使用“高级设计”这一术语，因为这可能错误地表明此时细节不重要）。随后是一系列源自敏捷模型的活动，其中功能被排序、进一步理解、开发、测试，并使用冲刺进行交付。\n\
  \n值得注意的是，适当级别的解决方案设计正是您在 CTA 评审委员会中预期提供的详细程度。您在已学习的小型场景中已经见过几个示例；这正是蓝图阶段后您的解决方案预期应达到的详细程度。\n\
  \n下图说明了瀑布模型和敏捷模型之间的区别：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_333_0.png)\n\n\
  图 10.1 – 瀑布模型和敏捷模型交付方法论\n\n下图说明了混合方法论：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_334_0.png)\n\
  \n图 10.2 – 混合交付方法论\n\nSalesforce 平台的灵活性使其非常适合敏捷方法论，因为与其他平台相比，引入变更更加容易。但是，在某些情况下，由于缺乏早期解决方案愿景，持续的设计变更会导致难以维护的解决方案。混合方法论更好地解决了这一问题。这就是为什么您看到越来越多的\
  \ Salesforce 项目采用混合方法论进行交付的原因。\n\n## 推荐测试策略以缓解项目风险\n\n每个软件解决方案都必须通过一组严格的测试来确保质量。您需要熟悉不同类型的测试以及执行每种测试最合适的环境。\n\
  \n下表有助于澄清这一点：\n\n| 测试类型 | 目的 | 工具 |\n| --- | --- | --- |\n| 单元测试 | 此测试用于检查解决方案构建模块的有效性，例如\
  \ Apex 代码和不同配置。这是必备测试，不仅是为了强制执行的 Salesforce 测试覆盖率，也是为了其提供的价值。它应被视为第一道防线。每次将新代码部署到特定实例时都会执行单元测试。请注意，这可用于测试配置的功能，而不仅仅是代码。\
  \ | Apex 测试类 |\n| 功能测试 | 此测试用于基于量身定制的测试场景和用例，检查特定功能行为的有效性。可以手动执行，也可以使用特定工具自动执行。自动化这些测试可确保每次需要时都执行完全相同的场景，例如在将新功能部署到环境时。\
  \ | 手动测试脚本和自动化测试工具，例如 Selenium 和 Provar |\n| 集成测试 | 此测试用于检查解决方案的有效性，并确认解决方案的整体部分按预期协同工作。这包括内部部分（例如来自多个沙箱的代码更改）和外部部分（例如与其他系统的集成接口）。\
  \ | 手动测试脚本和自动化测试工具 |\n| 用户验收测试 (UAT) | 此测试用于检查特定的 UAT 脚本/场景，以确保交付的功能满足业务需求。这通常与客户并行完成。\
  \ | 手动测试脚本 |\n| 负载测试 | 此测试用于在正常条件下但环境加载了大量数据集后评估系统性能。这类测试对于潜在对象量较大的解决方案尤为关键。 | 手动测试脚本和自动化测试工具；数据加载使用\
  \ Informatica 等 ETL 工具 |\n| 性能测试 | 此测试用于（并记录）系统在正常和边缘条件下的性能。您需要为 Salesforce 提交案例以规划此测试。这类测试对于设置复杂的解决方案尤为重要。\
  \ | 与 Salesforce 提交案例 |\n| 冒烟测试 | 此测试用于确保系统的整体稳定性。它通常通过运行一组有限的测试（通常在生产环境中执行，但也可能在其他环境中进行）来验证一组基本、常见且使用最频繁的功能，持续一段预定义的时间。然后监控结果。此测试基于您在新购机器上执行的简单测试；例如，您打开它并查看是否有冒烟。\
  \ | 手动测试脚本和自动化测试工具 |\n\n表 10.1 – 确保软件解决方案质量的不同测试类型的目的和工具\n\n> 注意\n> \n> 您可以执行不同类型的测试，例如回归测试、安全测试、渗透测试等。回归测试通常包括功能测试、集成测试和冒烟测试的组合。安全测试和渗透测试超出了本书的范围。\n\
  \n在 *制定正确的环境管理策略* 部分，您将探索执行这些测试最合适的环境。\n\n接下来，您将了解项目所需的治理结构。\n\n## 推荐支持技术决策的正确项目治理\n\
  \n项目治理对任何项目的成功至关重要。假设不同团队正在开发和发布不同的功能和特性。他们可能会相互覆盖彼此的工作、多次重新开发相同的功能、创建冲突的功能、修改数据模型和共享模型从而对性能或安全性产生负面影响，并创建难以变更和维护的系统。简而言之，这可能导致完全混乱。\n\
  \n\n\n\n\n你能想象一个情况更加复杂的实例吗？想象多个 Salesforce 团队（可能来自多个服务实施合作伙伴）正在开发和发布一系列功能和解决方案。这些解决方案涉及其他集成应用程序。一个团队正在构建一系列\
  \ Apex 类以开发点对点集成接口。另一个团队正在使用集成中间件，第三个团队决定开发他们自己版本的这些 Apex 类，因为他们不知道第一个团队的工作或由于时间限制。\n\
  \n当不同的团队开始引入不同的流程并带来使用 Salesforce 的不同方式（可能是为了实现相同的目标）时，这不可避免地会在组织内造成混乱。此外，这很可能会导致大量重复工作，所有企业都应尽量避免，以维持高效的设置。\n\
  \n这不仅是复杂实施项目的常见挑战，甚至对于更简单的项目也是如此。这正是企业创建 Salesforce 卓越中心（CoE）的原因。\n\nSalesforce\
  \ CoE 是一个中央管理机构，负责处理与 Salesforce 相关的一切事务。CoE 是一个统一的实体，负责讨论、评估、质疑并决定与 Salesforce\
  \ 相关的一切事宜。它包括企业各部门的业务和技术人员。CoE 关注的主题包括以下内容：\n\n- IT 和业务是否保持一致？\n- 交付的解决方案是否满足业务需求？\n\
  - 项目是否会按时交付？\n- 项目是否会在提供的预算内交付？\n- 是否已做出必要的合规性考虑？\n- 设计是否遵循最佳实践？\n- 设计是否重用企业级组件？\n\
  - 该项目是否有适当的治理模型？\n- CoE 是否有适当的人员坐在决策桌旁？\n- 是否已定义架构框架？代码标准？最佳实践？\n- 不同团队和利益相关者之间是否有有效的沟通？\n\
  \nCoE 可以包含一个子机构，负责质疑和批准所做的每个设计决策。这被称为 **设计机构 (DA)**。\n\n以下图表说明了 Salesforce CoE 的标准结构：\n\
  \n![](img/a3b1eecf3c87c814267f2877e8a8be1a_338_0.png)\n\n图 10.3 – 提议的 CoE 结构\n\n\
  实际实施可能因客户而异。这绝非一种适用于所有情况的结构。您需要为客户确定合适的格式。在评审会期间，您需要根据场景提出建议。前面的图表是一个很好的起点。\n\n\
  DA 可能具有以下结构：\n\n![](img/a3b1eecf3c87c814267f2877e8a8be1a_339_0.png)\n\n图 10.4 –\
  \ 提议的 DA 结构\n\nDA 的结构也可能因客户而异。\n\n在评审会期间，您需要解释 CoE 的价值、涉及哪些角色，以及预期由该小组完成哪些活动和任务。所有这些都必须在场景的背景下进行，并应解决场景的挑战。\n\
  \n## 构建合适的环境管理策略\n\n您需要了解 Salesforce Platform/Salesforce Core Cloud 中可用的不同环境类型。您应提出一个环境管理计划，包括合适的环境类型，解释每个环境的用途，并说明选择环境类型的依据。\n\
  \n在组织化的开发环境中，开发过程包含多个阶段（例如开发、QA、UAT 等）。这些阶段中的活动在不同的环境中完成。这种关注点分离消除了任何依赖，并允许其他团队并行工作。这种多层开发环境在\
  \ Salesforce 中非常常见，主要是因为创建沙箱很容易。\n\n单体应用程序通常有三个环境（开发、测试和生产）。在 Salesforce 中，您可以创建更多层以提供更有组织的开发和发布周期。典型的安排是开发、CI\
  \ 环境（也称为构建环境）、QA、暂存和生产。根据项目性质，可以添加其他层，例如集成测试、热修复和专用培训环境。\n\n以下表格可用于帮助您为每个任务选择合适的环境组合：\n\
  \n| 沙箱类型 | 开发新功能 | 测试 | 集成测试/性能测试 | 暂存和 UAT |\n|---|---|---|---|---|\n| Scratch\
  \ | 非常合适 | 良好（单元测试、功能测试、UI 自动化测试） | 不太合适 | 不太合适 |\n| Developer | 非常合适 | 良好（单元测试、功能测试、UI\
  \ 自动化测试） | 不太合适 | 不太合适 |\n| Developer pro | 比较合适 | 功能测试非常合适；数据存储可用于有限的回归测试 | 集成测试使用有限；不适合性能测试\
  \ | 不推荐 |\n| Partial copy | 确保数据子集可以与开发人员共享 | 功能测试非常合适；数据存储可用于有限的回归测试和生产调试（数据子集）\
  \ | 集成测试合适（有限数据子集）；不适合性能测试 | 合适（有限数据子集） |\n| Full copy | 不寻常；确保可以与开发人员共享数据 | 最适合用于生产调试\
  \ | 集成测试非常合适；性能测试理想（考虑到它与生产组织具有相同的基础架构） | 非常合适 |\n\n表 10.2 – 不同沙箱类型针对不同任务的适用性描述\n\
