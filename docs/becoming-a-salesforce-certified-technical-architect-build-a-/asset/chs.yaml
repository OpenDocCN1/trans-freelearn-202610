  继续前进，开始分析可访问性和安全性要求，这通常是考试场景中第二棘手的部分。\n\n## 分析可访问性和安全性要求\n\n可访问性和安全性部分的要求通常在业务流程要求之后是第二难以处理的。与业务流程要求相反，它们往往不会冗长，而是更具技术挑战性。\n\
  \n你可能需要调整数据模型、角色层级，以及可能的角色和许可证图。好消息是，平台内可用的共享和可见性功能数量有限。你可选择的工具池较小。不过，你必须非常了解每个工具，才能选择正确的组合。现在，从第一个共享要求开始。\n\
  \n- 关键客户及其读表数据仅对关键客户经理可见。\n\n在 *第 14 章，练习评审委员会：第二次模拟* 中针对关键客户管理流程的拟议解决方案中，你设计解决方案，使关键客户经理最终拥有关键客户的业务账户。你还指出，其他相关关键客户经理将被添加到账户团队。这将确保这些用户及其经理可以访问所需的\
  \ Account 记录。\n\nAccount 对象的 OWD 为私有，这意味着其他用户无法访问这些记录。你可以使用基于条件的共享规则授予支持代理可见性。支持代理需要访问所有账户，包括关键客户。你可以创建一个共享规则，将所有\
  \ Account 记录共享给支持代理角色及层级上方的所有人。\n\n`Meter_Reading__c` 对象通过主从关系与相关资产关联，而该资产又与属性（一种特殊的\
  \ Account 记录类型）相关。为满足要求，你需要确保属性记录仅对正确的用户可见。\n\n父级账户关系不足以授予记录可见性。一种可能的方法是将账户团队成员复制到所有相关属性。你可以依赖\
  \ Lightning 流来完成工作，但需要一个条件来控制它。该条件可以简单地依赖于业务账户上的 `Is_Key_Customer__c` 标志。\n\n选中该标志后，Salesforce\
  \ 流将把所有账户团队成员复制到相关属性。每次向业务账户添加或移除新的账户团队成员时，该流也将执行。\n\n你还需要另一个流，在将属性关联到业务账户时触发，以自动将账户团队成员复制到新连接的属性记录。更新你的数据模型图，进入下一个要求，该要求以以下内容开始：\n\
  \n- 关键客户经理应能够在特定时期内将客户账户的可见性委派给另一位经理。\n\n- 一旦指定的可见性期限过期，记录应不再对被委派的经理可见。\n\nSalesforce\
  \ 提供了一种将审批委派给其他用户的方式，但它并未开箱即用提供所需功能。如果你不知道有第三方产品（例如，来自 AppExchange）提供此类功能，那么你需要自行设计。\n\
  \n你可以以多种方式提出此做法，包括以下几种：\n\n- 定义一个新的 **账户团队角色**，其名称指示预定义时长（例如，**临时管理员 – 七天**）。**关键客户经理**可以使用该角色添加新的\
  \ **账户团队成员**。这将授予用户对 `Account` 记录的访问权限。然后，你可以设置一个定时作业，根据创建日期和名称查询记录（例如，查询创建时间超过七天且具有\
  \ **临时管理员 – 七天** 角色的所有 `AccountTeamMember` 记录）并将其删除。这将确保被委派用户不会获得超出允许期限的访问权限。\n\n\
  - 使用新自定义对象创建类似逻辑。你可以在该自定义对象上定义确切的开始和结束日期。批处理作业将根据自定义对象中的设置创建或删除 **账户团队成员** 条目。你甚至可以将此解决方案扩展到\
  \ `Account` 对象之外，包括其他标准或自定义对象。在这种情况下，你将不使用 **账户团队**。相反，你将通过 Apex 创建 **共享** 记录。\n\
  \n此解决方案提供更多定制功能，并支持更高级的用例，例如为特定对象的所有记录定义基于时间的委派共享。\n\n选择第二个选项，因为它更具灵活性且更具前瞻性。只要时间允许，在演示过程中请不要犹豫，解释这两个选项。\n\
  \n现在，引入新自定义对象 `Delegated_Record_Access__c`，将其添加到数据模型中，并进入下一个要求。\n\n- 投诉仅对正在处理它的代理及其经理可见。\n\
  \n在你的解决方案中，投诉被建模为案例。这意味着 `Case` 对象的 OWD 将是 **私有**。处理投诉的代理也将拥有它，使记录默认对代理及其经理可见。\n\
  \n最后，你可以简单地将超级用户组在 `Case` 对象上的 **查看所有** 权限授予他们。但这将授予他们对所有类型案例的可见性，而不仅仅是投诉。或者，你可以创建一个公共组，将指定用户添加到其中，然后创建一个\
  \ **基于条件的共享规则** 将所有投诉共享给该组。\n\n在提出依赖 **查看所有** 或 **修改所有** 对象权限的解决方案时要小心。使用这些权限的优点是，它们允许用户在不评估记录共享设置的情况下访问记录。这提高了性能。但是，它们可能会授予用户不应拥有的更多访问权限。除非有正当理由证明使用它们的必要性，否则建议避免使用它们。你之前在\
  \ *第 6 章，制定 Salesforce 安全架构* 中已介绍过这一点。\n\n- 询问应对所有支持代理可见。\n\n在你的解决方案中，询问被建模为案例。你可以创建一个基于条件的共享规则，将所有询问共享给支持代理角色。\n\
  \n- 维护合作伙伴的记录应仅对支持代理可见。\n\n所有支持代理都可以查看维护合作伙伴账户记录，但不可编辑。你可以通过创建基于条件的共享规则来实现这一点，将相关账户共享给支持代理角色。共享规则上的访问级别可以设置为\
  \ **只读**。\n\n与合作伙伴建立直接关系的支持代理也将拥有合作伙伴的 `Account` 记录。因此，支持代理默认拥有编辑权限。\n\n- B2B 客户应能够管理其账户相关的所有属性和计量器。\n\
  \n你在 *第 14 章，练习评审委员会：第二次模拟* 的数据模型设计中已解决此要求。你利用 **共享集** 和 `AccountContactRelation`\
  \ 记录的组合来实现所需行为。\n\n值得注意的是，过去共享集仅适用于 **客户社区** 许可，但 Salesforce 在 2018 年夏季将该功能扩展到了\
  \ **合作伙伴社区** 和 **客户社区 Plus** 许可（当时，它正处于公开测试阶段）。\n\n> **注意**\n> 你可以在以下链接中找到有关为 **合作伙伴社区**\
  \ 许可启用共享集的更多详细信息：`https://pact.link/4N3Di`。\n\n现在，进入下一个也是最后一个要求。\n\n- B2C 客户应能够管理其所有相关属性。B2C\
  \ 客户关联多个属性的情况很常见。\n\n你已在 *第 14 章，练习评审委员会：第二次模拟* 中作为拟议数据模型的一部分解决了此要求。你使用 Person Accounts\
  \ 来表示 B2C 客户。你利用共享集和 `AccountContactRelation` 记录的组合，允许社区用户访问多个属性（一种 `Account` 记录类型）。\n\
  \n这结束了可访问性和安全性部分的要求。到目前为止，你已覆盖了场景中近 80%–85% 的复杂度。你还有几个要求需要解决，但你已解决了大多数棘手的主题。继续前进，因为下一个目标是报告要求。\n\
  \n\n\n\n## 分析报告要求\n\n在第 13 章“呈现与辩护：第一次模拟”中，你了解到报告要求有时会影响你的数据模型，尤其是在决定采用反规范化数据模型以减少生成的记录数量时。\n\
  \n报告还可能影响你的景观架构、集成列表或与参与者相关的许可证。请逐一处理公司共享的要求并逐一解决。\n\n*服务全球副总裁希望有一份报告，显示维护合作伙伴在特定年份处理的服务请求，并与其他四个年份的数据进行对比。*\n\
  \n在拟议的解决方案中，维护请求被建模为案例，其中所有超过一年的案例都将被归档。尽管数据在技术上仍然存在于平台上（在 Big Objects 中），但你仍然无法使用标准报告和仪表板来报告这些数据。有两种潜在方式来满足此要求：\n\
  \n- 使用 **Batch Apex** 提取聚合数据：你可以使用 **Batch Apex**（或 **Bulk API**）来提取和聚合归档数据，并将其加载到自定义对象中。然后，你可以使用该对象的标准报告和仪表板。在过去，也可以使用\
  \ **Async SOQL** 来进行提取和聚合，但 Salesforce 已宣布计划在 Summer’23 版本中退役 **Async SOQL**。\n\
  - 使用诸如 **CRM Analytics** 之类的分析工具：此选项将允许更大的灵活性以及深入查看仪表板背后数据的能力。CRM Analytics（以前称为\
  \ **Einstein Analytics** 和 **Tableau CRM**）有一个连接器，可以从 Big Objects 中检索数据。\n\n第二种方法不需要自定义开发，并提供更多灵活性来适应未来的要求。这是使用它的一个合理理由。相应地更新你的景观架构和集成接口列表，然后转到下一个要求。\n\
  \n*服务全球副总裁希望有一个仪表板，显示按国家和地区划分的已收到和已解决的询问和投诉数量。*\n\n使用标准报告和仪表板即可满足此要求，假设过去一年的数据就足够了。SVP\
  \ 已经可以访问所提及的数据。问题没有指定数据的时间范围。不要为自己把事情复杂化，只需假设过去一年的数据足以满足期望。现在，转到下一个要求。\n\n*关键客户经理希望获得一组商业智能报告，显示将关键客户从旧资费转换到新资费所带来的业务改进。*\n\
  \n指示 *商业智能* 的报告要求通常超出了标准平台功能的范围。标准 **报告和仪表板** 无法满足此类要求，除非你投资开发一个自定义解决方案来创建可报告的聚合数据。\n\
  \n对于此类要求，你应该考虑诸如 CRM Analytics 之类的分析和商业智能工具。幸运的是，你的景观架构中已经有它了。你也可以使用它来满足此要求。确保在演示中提出这一点。\n\
  \n公司希望为其客户提供一个仪表板，显示过去两年消费量的变化。\n\n你可以使用自定义 Meter_Reading__c 对象在平台上保存两年的读表数据。你可以轻松开发一个报告，使用该对象显示消费量的变化。\n\
  \n你是否遗漏了什么？是的，Customer Community 用户无法访问标准报告和仪表板，但 Customer Community Plus 用户可以。你是否应该调整拟议的解决方案，对\
  \ B2C 和 B2B 客户都使用 Customer Community Plus 许可证？\n\n答案是否定的。你基于坚实的逻辑选择了 B2C 许可证。你有数百万客户，需要一种适合那么多用户的许可证。不要因为此类要求而对自己的逻辑失去信心。坚持你的立场，并思考一个潜在的解决方案。\n\
  \n你可以轻松开发一个自定义 Lightning 组件，配合一个不错的图表来显示用户消耗量。这确实需要自定义开发（通常最好在 Salesforce 生态系统中尽量避免），但这是完全合理的。\n\
  \n切换到 Customer Community Plus 许可证将对解决方案产生更大的影响。影响不仅来自成本角度，更重要的是来自技术角度。Customer Community\
  \ Plus 用户会占用门户角色，而门户角色数量有限。你在第 6 章“在 Salesforce 中制定安全架构”中已详细涵盖了这一点。\n\n坚持使用拟议的 Customer\
  \ Community 许可证，并使用自定义开发的 Lightning 组件来满足此要求。基于所需用户数量和 Customer Community Plus 许可证的限制，理由非常明确，因此设计决定是合理的。\n\
  \n报告部分的要求到此结束。场景的最后部分通常会列出与治理和开发生命周期相关的要求。保持这种势头，继续处理下一组要求。\n\n## 分析项目开发要求\n\n场景的这部分通常关注用于管理\
  \ Salesforce 项目开发和发布流程的工具和技术。如前面在第 13 章“呈现与辩护：第一次模拟”中提到的，你在第 10 章“开发生命周期和部署规划”中创建的工件，例如图\
  \ 10.3（拟议的 CoE 结构）、图 10.4（拟议的 DA 结构）和图 10.7（开发生命周期图（最终）），对于解决场景的这部分很有帮助。\n\n你需要充分理解并\
  \ *相信* **CoE** 或 **设计机构（DA）** 等组织结构所带来的价值。你需要知道客户 *为什么* 应该考虑 CI/**CD**——而不仅仅是市场炒作，而是这些技术对开发和发布策略所带来的实际\
  \ *价值*。\n\n接下来，浏览不同的公司要求，并找出如何将这些工件付诸实践以解决提出的一些挑战。从第一个要求开始。\n\n*公司希望能够快速实现价值，并尽快获得\
  \ Salesforce 功能。*\n\n这一要求代表了当今企业世界的一个普遍趋势。企业都急切地想要以更敏捷的方式采用产品。企业无法等待数年才开始实现投资的价值。他们愿意踏上一段可以理解的漫长旅程，在整个企业范围内全面推出新系统，但他们希望尽快开始获得部分价值。\n\
  \n因此，**最小可行产品（MVP）** 的概念在过去几年中获得了广泛关注。MVP 概念承诺以最小的努力（因此也是最小的财务风险）快速获得价值。MVP 包含最终产品将包括的核心功能。这些核心功能允许在未来的时间里围绕其开发并扩展更多功能。\n\
  \n可以这样想。只要你的新房子处于可居住状态，理论上就可以开始享受它的好处。你可以稍后通过添加装饰、整理花园、建好漂亮的车库等方式，让它变得美丽。\n\nMVP\
  \ 允许企业在不等到项目结束的情况下就开始获得收益。这有效地降低了整体风险，因为用户将在几周或几个月内而不是数年开始使用新系统。\n\n**注意**\n确定 MVP\
  \ 范围包含哪些内容、哪些内容不包含在内的技巧不在本书范围之内，并且是现代 **产品管理** 的核心。你可以在其他书籍中阅读更多相关内容，例如 Mangalam\
  \ Nandakumar 的 *Lean Product Management*。\n\n仅靠扎实的产品管理不足以开发出可扩展的 MVP 解决方案。在现实生活中，你需要将其与正确的技术指导（由\
  \ DA 提供）、整体治理由（由 CoE 提供）以及正确的交付方法相结合。否则，你可能会冒开发出一个无法很好地扩展或规模化的 MVP 的风险。\n\n这一点对\
  \ Salesforce 项目尤其相关，主要是因为该平台灵活、动态且充满现成的功能，这可能会诱人快速搭建一个 MVP 解决方案，但如果没有适当的规划和治理，很容易错失其未来潜力。\n\
  \n\n\n\n回到公司的需求，可以通过采用 MVP 风格的产品设计和开发来满足。在你的演示中，你需要简要解释什么是 MVP 解决方案，它带来的价值，以及如何确保它满足未来潜力。转到下一个需求。\n\
  \n维护 ERP 的团队采用六个月发布周期，他们无法修改时间表以适应此项目。\n\n这可能是一个潜在风险。你需要在演示中提出任何预见的风险。考虑到 ERP 的发布周期，你可能会遇到\
  \ Salesforce 发布被推迟到下一次 ERP 发布的情况。这意味着需要在任何版本中仔细管理和选择发布的 Salesforce 功能。\n\n此外，你应该拥有合适的环境结构来控制功能开发，以及合适的集成策略以实现松耦合。\n\
  \n提议的环境结构和开发生命周期策略应满足这些要求，并清楚说明它们将如何解决此风险。你将在本章后面的演示推介中介绍这一点。\n\n历史上，客户支持团队习惯于高效率系统，并且有法规要求在不超过\
  \ 10 分钟内处理呼叫。\n\n你可以使用 **Service Cloud Console**（也称为 **Lightning Service Console**）来提高客户支持团队的生产率。控制台还允许配置一些快捷方式以满足公司的期望。此外，**Service\
  \ Cloud Voice** 允许根据来电者电话号码自动查找联系人。**Salesforce** 宏也可用于加速一些重复性任务（例如，单击即可向客户发送电子邮件并更新案例记录）。\n\
  \n所有这些功能将进一步提高客户支持团队的生产率和响应时间。\n\n公司希望在识别潜在项目风险方面获得支持。\n\n你已经遇到三个潜在风险：\n\n- 设计和管理\
  \ MVP 解决方案\n- 将 ERP 相对较慢的发布周期与 Salesforce 采用的快速发布周期相协调\n- 在与高效率桌面应用程序相比切换到云端/基于浏览器的解决方案时管理用户期望和性能\n\
  \n你需要在演示中逐一提出这些风险，并清楚说明你计划如何缓解每个风险。你将在本章后面这样做。\n\n*公司希望有一种清晰、可追溯的方式来跟踪项目生命周期中开发的功能。*\n\
  \n在第 10 章“开发生命周期和部署规划”中，你学习了几种管理发布周期的技术，包括跟踪开发的功能。\n\n你还了解到，在 Salesforce 中处理此类情况的最佳机制是使用多层开发环境实施源代码驱动开发。\n\
  \n**源代码驱动开发**将允许你维护可追溯的审计跟踪，显示项目生命周期中任何给定时间开发的功能。此要求还与下一个要求相关。查看该要求以帮助你为两者制定全面的回复。下一个要求如下：\n\
  \n*公司正在寻求关于合适环境管理策略的建议，以确保在每个阶段执行适当的测试。*\n\n此问题可能以多种不同的方式提出。答案将始终指向你在第 10 章“开发生命周期和部署规划”中学到的内容。应使用多层开发环境、自动化发布管理以及测试自动化工具和技术来满足此要求。\n\
  \n你在第 10 章“开发生命周期和部署规划”图 10.7（开发周期生命周期图（最终））中看到了一个示例开发生命周期图，你将其用作第 13 章“演示与辩护：第一次模拟”中拟议的环境管理和开发生命周期图的基础。你也将使用相同的图表作为本场景的基础。在此情况下，你可以假设一个开发流。你的图表可能如下所示：\n\
  \n| 环境 | 开发环境（开发者沙箱/ Scratch org） | QA 环境（开发者或开发者专业版沙箱/ Scratch org） | CI 环境（开发者沙箱）\
  \ | QA 环境（开发者专业版或部分复制沙箱） | 暂存环境（完整复制沙箱） | 生产环境 |\n|---|---|---|---|---|---|---|\n\
  | SCM 分支 | 功能分支 | 功能 QA 分支 | CI 分支 | QA 分支 | 暂存分支 | 版本分支 主分支 |\n| 进行的活动 | 开发新功能\
  \ | 在本地测试新功能 | 合并新/更改的元数据 | QA 测试 | UAT 测试、暂存和培训 | 生产环境，向用户发布功能 |\n| 执行的测试 | 开发者测试\
  \ 单元测试 | 开发者测试 单元测试 单元测试 自动化功能测试 手动功能测试 | 单元测试 自动化功能测试 代码质量检查 | 单元测试 自动化功能测试 手动功能测试\
  \ 回归测试 | 单元测试 自动化功能测试 用户验收测试 负载测试 性能测试 | 单元测试 冒烟测试 |\n| 参与者 | 开发者 | 开发者 | 发布经理 开发团队负责人\
  \ 开发者 | 发布经理 | 发布经理 | 发布经理 |\n\n图 15.6 – 开发生命周期图（最终）\n\n你会注意到，你在 CI 环境前后仍然有一个 CI\
  \ 沙箱（也称为构建沙箱）和 QA 沙箱。你可能会想为什么需要它们。毕竟，只有一个开发流，环境越少事情应该越简单，对吧？并非如此。\n\n你的发布策略应具有前瞻性。它绝不应该短视到只覆盖近期需求。你的策略应能够扩展并容纳多个并行开发新/更新功能的项目流，即使这目前不是紧急需求。\n\
  \n在大多数 Salesforce 项目中，任何给定时间至少会有两个并行流。一个流负责构建和开发新功能，另一个流负责维护生产组织以及修复和修补遇到的任何错误。理想情况下，所有代码更改都应合并到\
  \ CI 环境中以遵循设计的管道（除少数例外情况外）。你的环境策略应能够满足这一需求及更多。\n\n本地 QA 环境帮助开发团队在功能进一步推进之前进行测试。共享\
  \ QA 环境通常由专门的测试团队管理，他们确保一切协同工作并按预期运行。\n\n随着环境增加，事情确实会变得更加复杂，除非你有合适的工具提供支持。这就是为什么源代码控制管理\
  \ (SCM) 和自动化构建和发布管理工具对于任何企业级 Salesforce 项目的成功至关重要。\n\n对于公司的场景，你需要建议一个自动化构建和发布工具。你可以提出诸如\
  \ Copado 之类的工具。你还需要添加一个自动化测试工具，例如 Provar。请记住，你仍然需要解释你的单元测试将如何与 Provar 并行工作以提供全面的测试体验。你将在本章后面制作演示推介时介绍这一点。将\
  \ Copado 和 Provar 添加到你的架构图中，然后转到下一个也是最后一个要求。\n\n公司正在寻找一种适当的方法论来管理项目交付并确保适当的技术治理。\n\
  \n这是一个组合要求，你可以使用关于各种开发方法论和在第 10 章“开发生命周期和部署规划”中了解到的不同治理机构的知识来解决。\n\n你需要一种能够支持 MVP\
  \ 解决方案的交付方法论，即一种包含蓝图阶段的方法论，以规划计划的成果并定义如何实现，最好附带一些概念验证。但是，该方法论也应足够灵活，以容纳和接受 MVP 阶段之外的其他要求。所有这些都应指向混合方法论。\n\
  \n为确保技术治理，你需要一个治理机构，能够在正确的时间召集正确的人员做出决策，由高管赞助授权，并得到企业各方面专业知识的支持。这就是 CoE 的用途所在。\n\
  \n\n\n\n此外，你需要有一个持续的活动，以在项目交付过程中验证、挑战和批准每个设计决策，这正是 DA 旨在做的事情。MVP 解决方案会随着时间的推移而积累更多功能并变得更加复杂。有了\
  \ DA 结构，你可以确保在开始交付之前，每个用户故事的解决方案都会由正确的人员进行挑战和技术验证。\n\n这总结了项目开发部分的要求。下一部分通常比较有限，包含其他一般性主题和挑战。保持势头，继续下一组要求。\n\
  \n## 分析其他要求\n\n在完整模拟场景中，其他要求部分可能包含其他部分尚未涵盖的任何其他内容的进一步要求。此部分通常包含有限数量的要求。\n\n你在 Salesforce\
  \ Platform 及其生态系统方面的经验和广泛知识将在此时发挥至关重要的作用。继续探索共享要求。\n\n*该公司最近收购了一家从事可再生能源业务的公司。*\n\
  \n被收购公司生产并安装太阳能电池板以及电池。该公司也使用 Salesforce 作为其核心 CRM。该公司想知道是否应该计划将此 Salesforce 实例与自己的合并，还是保持分离。他们正在寻求你对此决策的支持。\n\
  \n组织策略是你在遇到的每个评审委员会场景中都需要考虑的内容。你应该提出明确的建议，并给出决定提出单组织还是多组织的有效依据。你在 *第 5 章，开发可扩展的系统架构*\
  \ 中了解了每种方案的一些优缺点。\n\n在此场景中，你会遇到一个用例，其中已经存在一个通过公司收购继承的第二个组织。将此 Salesforce 组织与主公司组织合并的努力应该被考虑，并且永远不应被低估。\n\
  \n此外，新收购的公司从事略有不同的业务。可以理解的是，制造、分销和安装太阳能电池板及电池将拥有完全不同的一组销售和服务流程及活动。在这种情况下，你通常会发现两家企业之间的互动有限。\n\
  \n被收购公司很可能有自己的一套支持系统，例如 ERPs 和 HR 解决方案。保持两家公司的财务分开或启动三到五年的过渡期也是常见的。\n\n基于所有这些原因，假设多组织策略更安全。全球报告要求（如果有）可以使用\
  \ CRM Analytics 等商业智能工具来满足。\n\n由于你对这个新组织了解不多，不会将其包含在架构图中。你可以在演示中简单解释拟议的组织策略及其背后的理由。你的架构图现在可能如下所示：\n\
