  \n## CTA评审委员会的结构和形式\n\n本节主要面向备考CTA考试的人员。要通过考试，你需要参加由三位CTA评委组成的评审委员会。你会收到一个假设性场景，并在有限的时间内解决它并制作一份端到端的演示文稿，解释你解决方案的不同元素以及你将如何解决识别出的场景要求。评委随后会就你的解决方案提出问题并对其提出挑战。如有需要，你需要证明、捍卫并相应地修改你的解决方案。\n\
  \n以下是关于考试的更多细节：\n\n- **格式**：考生将审查并解决一个假设性场景，然后向三位CTA评委组成的小组进行展示。展示之后是与评委的问答环节。\n\
  - **考试先决条件**：你需要同时持有Salesforce认证应用架构师凭证和Salesforce认证系统架构师凭证。此外，你需要通过架构师评审委员会评估。这与CTA虚拟评审委员会的形式相似，你需要解决一个假设性场景。不同之处在于，这种情况下的场景要短得多（一个迷你场景），并且由一位而非三位CTA评委进行评判。\n\
  - **完成评审委员会考试的时间分配：**\n  - 用于场景审查和解决方案准备的时间为180分钟\n  - 用于场景演示的时间为45分钟\n  - 用于场景问答环节的时间为40分钟\n\
  \  - 非母语者将获得额外时间（解决方案设计30分钟，问答环节20分钟）\n  - 如果你提前完成演示，剩余时间将添加到问答环节中\n\n考试期间，考试协调员和监考人员将在现场（如果考试是虚拟进行的，则将虚拟加入）。\n\
  \n评审委员会期间，考生可使用的以下工具/材料：\n\n| 考试类型 | 现场 | 虚拟 |\n| :--- | :--- | :--- |\n| 提供/允许的工具/材料\
