  \ Community 用户。\n\n集成接口在我的接口列表中有详细描述。\n它将遵循远程进程调用——请求和应答模式。\n身份验证将通过 OAuth 2.0 Web\
  \ 服务器流，随后是\n刷新令牌流来实现。数据将在传输过程中使用 Salesforce 和 MuleSoft 之间的双向 TLS\n以及 MuleSoft 和国家机构系统之间的单向\
  \ TLS 进行保护。\n\n你应该在你的列表中指向正确的集成接口、数据模型中的对象，\n以及景观架构图中的其他不同元素，例如 MuleSoft 和\n国家驾驶员和车辆许可机构系统。\n\
  \n你可以在演示中稍微发挥创意，并从可访问性和安全性要求部分提出一个要求。你可以添加以下内容：\n\n稍后，有一个要求是允许用户使用其 Facebook 凭据登录。为实现此功能，我将在\
  \ Salesforce 中定义一个新的身份验证提供程序。我将其设置为 Facebook 并定义一个注册处理器类。我需要注册处理器来确定用户是否已存在，或者是否需要预配用户。完成身份验证提供程序的设置后，我将配置我的社区在其登录页面上使用它。\n\
  \n完成后，社区的登录页面上将显示一个标题为“使用 Facebook 登录”的新按钮。当用户点击该按钮时，将启动一个 OpenID Connect Web 服务器身份验证流程。用户将被重定向到\
  \ Facebook 进行身份验证。完成后，一个屏幕将显示一条消息，要求用户授予访问个人数据的权限。页面将有“批准”和“拒绝”按钮。一旦用户点击“批准”按钮，他们将被重定向回\
  \ Salesforce 社区。\n\n注册处理器将接收一个包含名、姓和电子邮件地址等数据的有效负载。它将使用这些数据来确定用户是否已存在或需要创建。如果用户已存在，用户将自动登录到社区。否则，注册处理器将创建用户。\n\
  \n但是，在用户继续之前，我们需要捕获驾驶执照。这不是我们将从 Facebook 接收的值。因此，我们需要使用自定义登录流程来防止驾驶执照字段没有值的 Community\
  \ 用户登录社区，而是显示一个自定义 VisualForce 页面来捕获驾驶执照。\n\n页面将有一个按钮。点击按钮后，将调用之前解释的验证 Web 服务来验证驾驶执照并返回结果。如果结果为正，用户将被允许进入社区。\n\
  \n你已经埋下了一些问题，例如 OAuth 2.0 Web 服务器流程的完整描述。如果评委认为需要更多细节，他们将在问答环节回到这一点。\n\n\n\n\n这是一段冗长的业务流程，但展示其解决方案不应超过五分钟。其他业务流程所需时间应更少。请用你自己的话练习演示，并不断练习，直到你能在五分钟内舒适地完成类似的推介。时间管理对本次考试至关重要。\n\
  \n进入结构化演示的下一个元素。\n\n## 介绍 LDV 缓解策略\n\n介绍完业务流程后，场景中的下一组要求与数据迁移有关。在继续之前，请准备好 LDV 对象缓解策略的推介：\n\
  \n> 我们了解到 PPA 每年平均有 1000 万次汽车租赁。\n> 这意味着 Order 对象每年将增加 1000 万条记录。OrderItem、Payment__c、Case\
  \ 和 Invoice_Header__c 对象也将增长，速度至少相当。这意味着它们都被视为 LDV。\n>\n> LDV 会影响系统中许多功能的性能。在这种情况下，最令人担忧的影响是\
  \ CRUD 效率。我考虑过使用 divisions，但我认为将数据存档到 Heroku 更简单，也更容易实现。此外，这种方法不会影响任何现有功能。\n>\n\
  > 已关闭的订单将同步到 Heroku 并从 Salesforce 中移除，同时连同相关的 OrderItem、Payment__c、Case 和 Invoice_Header__c\
  \ 记录一同移除。\n>\n> 然后，我将使用 Salesforce Connect 通过外部对象将这些记录重新暴露给 Salesforce。这意味着历史租赁记录将对内部用户和\
  \ Community 用户可用。我将确保数据仅通过 Lightning 组件对 Community 用户可见，该组件将根据当前用户 ID 过滤接收到的结果。这将确保用户只能看到他们被允许看到的内容。我考虑过使用基于用户的身份验证策略，但更倾向于这种方法，因为它更容易、更快速实现。\n\
  >\n> 我不认为瘦表（skinny tables）能满足此要求，因为主要挑战在于 CRUD 操作而非报告。此外，通过这种存档策略，我们将确保这五个对象包含尽可能少的记录。我不认为需要引入任何自定义索引。\n\
  \n这解释了您的 LDV 缓解策略和理由。请继续介绍数据迁移策略。\n\n## 介绍数据迁移策略\n\n沿用前面列出的四点来解释数据迁移策略。您需要说明如何获取迁移数据、如何将数据加载到\
  \ Salesforce，以及您的迁移计划和方法是什么。开始整合这些内容：\n\nPPA 在其即将退役的五个租赁管理系统中各拥有约 5000 万条租赁记录。总计约\
  \ 2.5 亿条记录。其中许多是历史记录，理想情况下应迁移到 Heroku 而非 Salesforce。\n\n我建议采用分阶段大爆炸（staggering big\
  \ bang）方法。我们将使用大爆炸方法迁移每个即将退役租赁管理系统的记录，然后转到下一个即将退役的系统。迁移活动将在周末进行，届时除了执行迁移的人员外，整个系统将对所有用户关闭。\n\
  \n我们将在迁移到生产环境前三天在 Full Copy 沙箱上执行迁移预演（dry run），以发现潜在问题。在迁移数据之前，我们将禁用所有 Workflows、Flows\
  \ 和其他自动化。\n\n我们将使用 Informatica 进行数据迁移。它经过优化，可使用 Bulk API，这应该会加快迁移过程。我们可以直接将 Informatica\
