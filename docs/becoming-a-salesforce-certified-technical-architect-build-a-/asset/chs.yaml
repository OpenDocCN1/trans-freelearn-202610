  Salesforce Connect 检索。


  每月新案例数量大约为 600,000，每年将产生近 720 万条记录。为了确保保持最佳平台性能，我建议将一年前的案例记录归档到 Heroku，使用与订单相同的机制。然后，我们可以使用
  Salesforce Connect 将其重新暴露给 Salesforce。


  我建议在 MuleSoft 中开发一个 OData 接口，通过 Salesforce Connect 将 ERP 中存储的订单退货数据暴露给 Salesforce。


  产品评论存储为 Chatter 帖子。我建议创建一个 Lightning 组件，用于以组合和有组织的方式查询和显示所有四个数据集，以便在单个位置向支持代理提供所需的客户
  360 度视图。


  Chatter 帖子记录和外部对象都可以在 Lightning 组件的 Apex 控制器中查询。我仍然可以将 Salesforce Connect 外部对象添加到页面布局中，但我相信这个
  Lightning 组件可以通过将所有数据集合并在一个视图中来节省时间。


  支持代理应能够看到整体消费者价值指标，该指标显示该消费者与 POW 整个互动历史中的价值。


  你应当自问的问题如下：


  - 此报告的数据将来自何处？

  - 考虑到包含的数据量，是否有可用来构建此类报告的开箱即用功能？

  - 如何利用来自三个社交媒体影响力来源的数据？


  此类需求应直接指向对商业智能（BI）工具的需求。此数据大部分位于 Salesforce Core Cloud 之外，数据量也应让你轻松判断，这不是可以使用标准
  Salesforce 报表实现的事情。构建自定义模块成本太高，且无法提供所需的灵活性。这应该是一个容易做出的购买决策。


  市场上有很多可用的 BI 工具，它们内置了连接到 Salesforce、Heroku 和其他数据源的连接器。Salesforce CRM Analytics 是其中之一，它是一个
  Salesforce 产品，提供可以轻松嵌入 Salesforce Core Cloud 的吸引人的仪表板。在现实生活中，选择适合此工作的工具时可能还有许多其他因素需要考虑，但对于此场景，Salesforce
  CRM Analytics 听起来是一个不错的解决方案。


  你的解决方案可以如下：


  考虑到此报告所需的灵活性、它涵盖的数据量以及数据来自多个来源这一事实，我建议使用 Salesforce CRM Analytics 等 BI 工具来满足此需求。Salesforce
  CRM Analytics 自带一套丰富的连接器，可帮助其连接到不同的数据源，例如 Salesforce 或 Heroku。我假设三个社交媒体影响力系统以 CSV
  文件形式提供数据，我可以直接将其加载到 Salesforce CRM Analytics 中。生成的仪表板将在 Salesforce 中呈现，支持代理将获得访问权限。


