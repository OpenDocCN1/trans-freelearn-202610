- raw: "Previously, our code was running `App.Contacts.remove(id)`, where `id` was\
    \ the collection ID. This is something that Backbone automatically adds to each\
    \ model in a collection for keeping track of it internally. But now that we've\
    \ updated the application to make use of real ID values, things get a little more\
    \ complicated.\n\nAs we want the deletion of the Contact to be persisted to the\
    \ server, we need to use `model.destroy()`, instead of `collection.remove()`.\
    \ First, we attempt to get the contact from the collection and assign it to the\
    \ variable contact. The user could attempt to delete a contact that doesn't exist,\
    \ and we'd get an error. We then check to see if the model came back and, if it\
    \ did, we run `destroy()`. This sends the DELETE command back to the server.\n\
    \nLet us take a look now at `scripts/views/contact.js`:\n\n```\n  remove: function()\
    \ {\n    App.Browser.navigate('contacts/remove/' + this.model.get('id'));\n  \
    \  this.model.destroy();\n  }\n```\n\nAs mentioned in the previous section, we\
    \ now want to use the real ID of the models instead of the Collection ID. Instead\
    \ of grabbing `model.cid`, we now use `model.get('id')` and pass that along to\
    \ the URL for the router to handle.\n\nFinally let us take a look at `scripts/views/directory.js`\n\
    \n```\n      newContact.save();\n```\n\nThe preceding line of code specifically\
    \ tells Backbone to take this newly created contact and save it to the server.\
    \ Just adding a model to a Collection isn't enough for Backbone to persist that\
    \ collection to the server, unfortunately. It does, however, give us more control\
    \ over the application.\n\nIf you inspect the network traffic for this request,\
    \ you will see it perform the POST operation on the server. However, it will also\
    \ respond with a complete document. Backbone then parses this document, looks\
    \ for the `id` attribute, and then updates the local model. Typically, we want\
    \ the database to come up with `id` values for us, and Backbone honors this for\
    \ us.\n\n### Note\n\nIf you were to kill the Node application (either by pressing\
    \ *Ctrl* + *C* or closing the window), the contact database will be deleted forever.\
    \ The reason this happens is that Node is simply storing the data in a variable\
    \ in memory, which is cleared when the program exits.\n\nIf you want to save data\
    \ forever, look into using a database system, such as MySQL, MongoDB, or Redis.\
    \ There are many options out there for data storage. MongoDB, for example, works\
    \ great with Node, and luckily for us JavaScript developers, uses JSON for representing\
    \ objects.\n\nMore links for you to learn about Backbone.\n\n## Official sites\n\
    \n*   Backbone documentation: [http://backbonejs.org/](http://backbonejs.org/)\n\
    \n*   Backbone GitHub: [http://github.com/documentcloud/backbone/](http://github.com/documentcloud/backbone/)\n\
    \n*   Underscore Documentation: [http://underscorejs.org/](http://underscorejs.org/)\n\
    \n*   jQuery Documentation: [http://api.jquery.com/](http://api.jquery.com/)\n\
    \n*   Node.js Documentation: [http://nodejs.org/api/](http://nodejs.org/api/)\n\
    \n*   The code for the examples in this book can be obtained from [https://github.com/tlhunter/backbone-book](https://github.com/tlhunter/backbone-book)\n\
    \n## Community\n\n*   Freenode IRC: #documentcloud\n\n*   Backbone issues: [http://github.com/documentcloud/backbone/issues](http://github.com/documentcloud/backbone/issues)\n\
    \n*   Mailing list: [https://groups.google.com/forum/#!forum/backbonejs](https://groups.google.com/forum/#!forum/backbonejs)\n\
    \n## Twitter\n\n*   Follow the creators of Backbone.js at `@documentcloud`\n\n\
    *   Follow the author of this book at `@tlhunter`\n\n*   For more open source\
    \ information, follow Packt at `@packtopensource`"
