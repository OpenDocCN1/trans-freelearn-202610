- raw: "Our global `App` object gets a `Views` attribute for storing references to\
    \ our views. The `Directory` attribute is a reference to the instance of the main\
    \ application view. Since there's only one and it is rather important, having\
    \ a global reference makes it easier to work with (and debug in the console).\n\
    \n```\n  App.Directory = new App.Views.Directory({\n    el: $('#display')\n  });\n\
    ```\n\nThis code performs the `Directory` view instantiation, passing in a reference\
    \ to the existing DOM element we would like it to attach to.\n\n```\n  App.Directory.render();\n\
    ```\n\nAfter we instantiated the `Directory` View, we go ahead and execute the\
    \ `render` function, which ends up running the `render` function of each Contact\
    \ in our Contacts Collection.\n\n```\n  App.Contacts.on('add remove', function()\
    \ {\n    App.Directory.render();\n  });\n```\n\nThis code adds two event listeners\
    \ to the Contacts collection, which are triggered when a Contact has been either\
    \ added or removed. With this syntax, we can specify as many events as we would\
    \ like, separated by spaces. As the events fire, the Directory re-renders, displaying\
    \ the updated content.\n\nWhat this means is, whenever we add or remove an item,\
    \ the DOM updates for us automatically! This reduces ad-hoc jQuery calls and disorganized\
    \ code by quite a bit.\n\nFinally we look at `index.html`. These changes reflect\
    \ the new template `<script>` tag, and a few `<script>` tags to load our new files.\n\
    \n```\n    <script id=\"template-contact\" type=\"template\">\n```\n\nStoring\
    \ HTML in a `<script>` tag makes it easier to access the content without having\
    \ to deal with escaping issues. The `id` attribute gives us a handle to reference\
    \ the code with. It's a good idea to prefix your template elements with a common\
    \ namespace, in this case we refer to them all as `#template-`. Otherwise, we\
    \ might later add an element called `#contact` and get things confused. The `type`\
    \ attribute is set to `template`, which is a language our browser doesn't know\
    \ how to interpret, and therefore ignores it.\n\n```\n      <div class=\"contact\"\
    >\n  <h2><%-firstName%><% if (lastName) { %> <%-lastName%><% } %></h2>\n```\n\n\
    ### Note\n\nIt's a good idea to always surround your templates in a single element,\
    \ instead of having several top-level elements adjacent to each other. This way,\
    \ when we go to delete the view from the DOM later, we only have one element to\
    \ remove as the child elements will automatically be removed.\n\nHere we are printing\
    \ a variable for the contacts first name, and then checking to see if they have\
    \ a last name. If they do, we print that one as well; otherwise we don't do anything.\n\
    \nIf you've worked with other template languages before, you likely already know\
    \ this: be sure to not put a lot of logic inside of your View files, otherwise\
    \ they can get a bit out of control. The biggest benefit of breaking an application\
    \ into different pieces such as models and views is that we keep an obvious distinction\
    \ between which type of code goes where, and lots of logic in views will break\
    \ this. The types that are okay to run are simple looping and conditional statements,\
    \ perhaps some helper style functions that reduce writing the same markup everywhere,\
    \ and things such as that.\n\n```\n      <a href=\"mailto:<%-email%>\"><%-email%></a><br\
    \ />\n      <a href=\"tel:<%-phoneNumber%>\"><%-phoneNumber%></a><br />\n```\n\
    \nThese two lines will display the e-mail address and phone number as clickable\
    \ links to tell the device to send an e-mail or place a phone call, respectively.\
    \ Nothing too special here, we're just making use of conventional browser anchor\
    \ tag prefixes.\n\n```\n        <button class=\"delete\">Delete</button>\n   \
    \   </div>\n    </script>\n```\n\nHere is a **Delete** button for the contact;\
    \ however, it is currently non-functioning. We then close the `View` element and\
    \ the `<script>` tag containing it.\n\n### Event listener examples\n\nNow that\
    \ you've seen the document for the page rendered based on the data we entered\
    \ to begin with, it would be really nice to see how dynamic Backbone is, and how\
    \ we can update data later and see how the resulting DOM changes.\n\nIn the contact\
    \ View `initialize` function, we ran the `this.listenTo()` method, which looks\
    \ for changes to the model before re-executing the `render()` method. To see this\
    \ in action, open your console then type and execute the following command:\n\n\
    ```\nApp.Contacts.get('c1').set('lastName', 'Wiggum');\n```\n\nYou should immediately\
    \ see the document change. The last name of the first contact has been changed\
    \ to say **Wiggum**! This change is both reflected in the Model, and in the DOM\
    \ itself. You didn't have to run any ad hoc jQuery commands or anything!\n\n###\
    \ Note\n\n`c1` is a Backbone convention to refer to the first item of a collection.\
    \ There are better ways to refer to these objects, such as a real ID value or\
    \ keeping a reference to the Model upon creation.\n\nIn our main JavaScript file,\
    \ we added the event listener to the Contacts collections, so that , whenever\
    \ a new contact is added, it runs the Directory Views `render()` method. To prove\
    \ this works, type the following command into your JavaScript console and execute:\n\
    \n```\n  App.Contacts.add({\n    firstName: 'Wednesday',\n    lastName: 'Addams',\n\
    \    phoneNumber: '9895551313',\n    email: 'wednesday@example.com'\n  });\n```\n\
    \n### Tip\n\nIf you want to enter multiple lines of a command in this console,\
    \ press *Shift* + *Enter* after each command, as pressing *Enter* will execute\
    \ the incomplete command.\n\nYou should see the document immediately update and\
    \ display the new contact!\n\nFinally, if you'd like to see what happens when\
    \ a contact is removed, you can run the following in your console:\n\n```\nApp.Contacts.pop();\n\
    ```\n\nThe template rendering engine, which comes with Underscore.js, is decent\
    \ enough. If you like greater than, less than, and percent symbols, you will love\
    \ it. However, if you prefer a different syntax, I would recommend doing some\
    \ research on an alternative template engine called Mustache.\n\nThe Mustache\
    \ engine uses curly brackets for defining variables, and conveniently has an implementation\
    \ library in several popular programming languages, such as PHP and Ruby. This\
    \ is convenient because as a developer you can learn a single template engine\
    \ and use it everywhere.\n\nMany other alternative engines exist such as Handlebars,\
    \ which is pretty similar to Mustache, and HAML, which has a very terse syntax\
    \ for easily creating complex HTML documents.\n\n## View events\n\nEvents are\
    \ a method for taking user interactions in a view, and running code when they\
    \ happen. Events are specified using a syntax that looks something like `click\
    \ .controls .add`. The first part of the string (up until the first whitespace)\
    \ is the type of event we're looking for, in this case a `click` event. Everything\
    \ after that is a selector.\n\nWith our preceding example, if we were doing traditional\
    \ jQuery calls, we might have done a search for every element with an `add` class\
    \ located inside an element with a `controls` class, and added a `click` event\
    \ handler. There are two things wrong with this. First, as the DOM changes, we\
    \ need to run this code again; otherwise, new elements matching the selector would\
    \ be missed. Second, we could possibly have hundreds of event listeners listening\
    \ on the page at once, causing it to slow down.\n\nRemember that a view points\
    \ to a single element in the DOM, even though that element may contain many more\
    \ elements. Event bindings are applied to the main element, and use something\
    \ called event delegation to check when the proper event has been called. So,\
    \ with the preceding example event, the entire view listens for a `click` event\
    \ on any of the children elements. When that event occurs, the element that triggered\
    \ the event is matched against the selector. If it passes then our code is executed;\
    \ otherwise, it is ignored.\n\n### Step 1 – getting ready"
  fmt: "\n# Backbone.js 应用程序教程\n\n## 全局 App 对象与 Directory 视图\n\n我们的全局 `App` 对象获得一个\
    \ `Views` 属性，用于存储对视图的引用。`Directory` 属性是对主应用程序视图实例的引用。由于只有一个实例且它相当重要，拥有全局引用使其更易于操作（并在控制台中调试）。\n\
    \n```\nApp.Directory = new App.Views.Directory({\n  el: $('#display')\n});\n```\n\
    \n此代码执行 `Directory` 视图实例化，传入对现有 DOM 元素的引用，我们希望视图附加到该元素。\n\n```\nApp.Directory.render();\n\
    ```\n\n实例化 `Directory` 视图后，我们继续执行 `render()` 函数，这最终会运行 Contacts 集合中每个 Contact\
    \ 的 `render()` 函数。\n\n```\nApp.Contacts.on('add remove', function() {\n  App.Directory.render();\n\
    });\n```\n\n此代码向 Contacts 集合添加两个事件监听器，当 Contact 被添加或移除时触发。使用此语法，我们可以指定任意数量的事件，用空格分隔。事件触发时，Directory\
    \ 重新渲染，显示更新后的内容。\n\n这意味着，每当我们添加或移除项目时，DOM 会自动为我们更新！这在很大程度上减少了临时的 jQuery 调用和混乱的代码。\n\
    \n最后我们来看 `index.html`。这些更改反映了新的模板 `<script>` 标签，以及一些用于加载新文件的 `<script>` 标签。\n\n\
    ```\n<script id=\"template-contact\" type=\"template\">\n```\n\n在 `<script>` 标签中存储\
    \ HTML 使得访问内容更加容易，无需处理转义问题。`id` 属性给我们提供了一个引用代码的句柄。最好用通用的命名空间为模板元素添加前缀，在本例中我们将它们全部称为\
    \ `#template-`。否则，我们稍后可能会添加一个名为 `#contact` 的元素并导致混淆。`type` 属性设置为 `template`，这是浏览器无法识别的语言，因此会忽略它。\n\
    \n```\n<div class=\"contact\">\n  <h2><%-firstName%><% if (lastName) { %> <%-lastName%><%\
    \ } %></h2>\n```\n\n### Note\n\n最好始终用单个元素包裹模板，而不是让多个顶级元素相邻。这样，当我们稍后从 DOM 中删除视图时，只需移除一个元素，因为子元素会自动被移除。\n\
    \n这里我们打印联系人的名字变量，然后检查是否有姓氏。如果有，我们也打印姓氏；否则不做任何操作。\n\n如果您以前使用过其他模板语言，您可能已经知道这一点：请务必不要在\
    \ View 文件中放入大量逻辑，否则它们可能会变得难以控制。将应用程序分解为模型和视图等不同部分的最大好处是，我们保持了代码类型归属的明显区分，而视图中的大量逻辑会破坏这一点。可以运行的类型包括简单的循环和条件语句，也许还有一些减少重复编写标记的辅助风格函数等。\n\
    \n```\n<a href=\"mailto:<%-email%>\"><%-email%></a><br />\n<a href=\"tel:<%-phoneNumber%>\"\
    ><%-phoneNumber%></a><br />\n```\n\n这两行将电子邮件地址和电话号码显示为可点击的链接，分别告诉设备发送电子邮件或拨打电话。这里没有什么特别的，我们只是利用了传统的浏览器锚标签前缀。\n\
    \n```\n<button class=\"delete\">Delete</button>\n</div>\n</script>\n```\n\n这里有一个用于联系人的\
    \ **Delete** 按钮；不过，它目前是无功能的。然后我们关闭 `View` 元素和包含它的 `<script>` 标签。\n\n## 事件监听器示例\n\
    \n既然您已经看到了基于我们最初输入的数据渲染的页面文档，看到 Backbone 的动态特性以及我们如何稍后更新数据并查看生成的 DOM 变化将会非常不错。\n\
    \n在联系人 View 的 `initialize()` 函数中，我们运行了 `this.listenTo()` 方法，它会在重新执行 `render()`\
    \ 方法之前查找模型的变化。要查看此操作，请打开控制台，然后输入并执行以下命令：\n\n```\nApp.Contacts.get('c1').set('lastName',\
    \ 'Wiggum');\n```\n\n您应该立即看到文档发生变化。第一个联系人的姓氏已更改为 **Wiggum**！此变化同时反映在 Model 和 DOM\
    \ 本身中。您不必运行任何临时的 jQuery 命令！\n\n### Note\n\n`c1` 是 Backbone 的约定，用于引用集合的第一项。有更好的方法引用这些对象，例如真实的\
    \ ID 值或在创建时保持对 Model 的引用。\n\n在我们的主 JavaScript 文件中，我们向 Contacts 集合添加了事件监听器，以便每当添加新联系人时，运行\
    \ Directory View 的 `render()` 方法。要证明这有效，请在 JavaScript 控制台中输入并执行以下命令：\n\n```\n\
    App.Contacts.add({\n  firstName: 'Wednesday',\n  lastName: 'Addams',\n  phoneNumber:\
    \ '9895551313',\n  email: 'wednesday@example.com'\n});\n```\n\n### Tip\n\n如果您想在控制台中输入命令的多行，请在每个命令后按\
    \ *Shift* + *Enter*，因为按 *Enter* 将执行未完成的命令。\n\n您应该会看到文档立即更新并显示新联系人！\n\n最后，如果您想查看移除联系人时会发生什么，可以在控制台中运行以下命令：\n\
    \n```\nApp.Contacts.pop();\n```\n\n随 Underscore.js 提供的模板渲染引擎相当不错。如果您喜欢大于号、小于号和百分号，您会喜欢它。但是，如果您喜欢不同的语法，我建议研究一个名为\
    \ Mustache 的替代模板引擎。\n\nMustache 引擎使用大括号定义变量，并且方便地在几种流行的编程语言中拥有实现库，例如 PHP 和 Ruby。这很方便，因为作为开发人员，您可以学习单一模板引擎并在任何地方使用。\n\
    \n许多其他替代引擎也存在，例如 Handlebars（与 Mustache 非常相似）和 HAML（具有非常简洁的语法，可轻松创建复杂的 HTML 文档）。\n\
    \n## View 事件\n\n事件是一种在视图中获取用户交互并在发生时运行代码的方法。事件使用类似 `click .controls .add` 的语法指定。字符串的第一部分（直到第一个空白字符）是我们要查找的事件类型，在本例中是\
    \ `click` 事件。其后的所有内容都是选择器。\n\n以我们前面的示例为例，如果我们使用传统的 jQuery 调用，我们可能会搜索位于具有 `controls`\
    \ 类的元素内的每个具有 `add` 类的元素，并添加 `click` 事件处理程序。这有两个问题。首先，随着 DOM 的变化，我们需要再次运行此代码；否则，与选择器匹配的新元素将被遗漏。其次，我们可能会在页面上同时拥有数百个事件监听器，导致页面变慢。\n\
    \n请记住，视图指向 DOM 中的单个元素，即使该元素可能包含更多元素。事件绑定应用于主元素，并使用称为事件委托的机制来检查何时调用了适当的事件。因此，对于前面的示例事件，整个视图监听其任何子元素上的\
    \ `click` 事件。发生该事件时，触发事件的元素将与选择器进行匹配。如果通过，则执行我们的代码；否则，将其忽略。\n\n### Step 1 – Getting\
    \ Ready\n"
  trans: "\n# Backbone.js 应用程序教程\n\n## 全局 App 对象与 Directory 视图\n\n我们的全局 `App` 对象获得一个\
    \ `Views` 属性，用于存储对视图的引用。`Directory` 属性是对主应用程序视图实例的引用。由于只有一个实例且它相当重要，拥有全局引用使其更易于操作（并在控制台中调试）。\n\
    \n```\nApp.Directory = new App.Views.Directory({\n  el: $('#display')\n});\n```\n\
    \n此代码执行 `Directory` 视图实例化，传入对现有 DOM 元素的引用，我们希望视图附加到该元素。\n\n```\nApp.Directory.render();\n\
    ```\n\n实例化 `Directory` 视图后，我们继续执行 `render()` 函数，这最终会运行 Contacts 集合中每个 Contact\
    \ 的 `render()` 函数。\n\n```\nApp.Contacts.on('add remove', function() {\n  App.Directory.render();\n\
    });\n```\n\n此代码向 Contacts 集合添加两个事件监听器，当 Contact 被添加或移除时触发。使用此语法，我们可以指定任意数量的事件，用空格分隔。事件触发时，Directory\
    \ 重新渲染，显示更新后的内容。\n\n这意味着，每当我们添加或移除项目时，DOM 会自动为我们更新！这在很大程度上减少了临时的 jQuery 调用和混乱的代码。\n\
    \n最后我们来看 `index.html`。这些更改反映了新的模板 `<script>` 标签，以及一些用于加载新文件的 `<script>` 标签。\n\n\
    ```\n<script id=\"template-contact\" type=\"template\">\n```\n\n在 `<script>` 标签中存储\
    \ HTML 使得访问内容更加容易，无需处理转义问题。`id` 属性给我们提供了一个引用代码的句柄。最好用通用的命名空间为模板元素添加前缀，在本例中我们将它们全部称为\
    \ `#template-`。否则，我们稍后可能会添加一个名为 `#contact` 的元素并导致混淆。`type` 属性设置为 `template`，这是浏览器无法识别的语言，因此会忽略它。\n\
    \n```\n<div class=\"contact\">\n  <h2><%-firstName%><% if (lastName) { %> <%-lastName%><%\
    \ } %></h2>\n```\n\n### 注意\n\n最好始终用单个元素包裹模板，而不是让多个顶级元素相邻。这样，当我们稍后从 DOM 中删除视图时，只需移除一个元素，因为子元素会自动被移除。\n\
    \n这里我们打印联系人的名字变量，然后检查是否有姓氏。如果有，我们也打印姓氏；否则不做任何操作。\n\n如果您以前使用过其他模板语言，您可能已经知道这一点：请务必不要在\
    \ View 文件中放入大量逻辑，否则它们可能会变得难以控制。将应用程序分解为模型和视图等不同部分的最大好处是，我们保持了代码类型归属的明显区分，而视图中的大量逻辑会破坏这一点。可以运行的类型包括简单的循环和条件语句，也许还有一些减少重复编写标记的辅助风格函数等。\n\
    \n```\n<a href=\"mailto:<%-email%>\"><%-email%></a><br />\n<a href=\"tel:<%-phoneNumber%>\"\
    ><%-phoneNumber%></a><br />\n```\n\n这两行将电子邮件地址和电话号码显示为可点击的链接，分别告诉设备发送电子邮件或拨打电话。这里没有什么特别的，我们只是利用了传统的浏览器锚标签前缀。\n\
    \n```\n<button class=\"delete\">Delete</button>\n</div>\n</script>\n```\n\n这里有一个用于联系人的\
    \ **删除** 按钮；不过，它目前是无功能的。然后我们关闭 `View` 元素和包含它的 `<script>` 标签。\n\n## 事件监听器示例\n\n\
    既然您已经看到了基于我们最初输入的数据渲染的页面文档，看到 Backbone 的动态特性以及我们如何稍后更新数据并查看生成的 DOM 变化将会非常不错。\n\
