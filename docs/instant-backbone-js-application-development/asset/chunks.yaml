  trans: "\n\n集合代表数据库表，而模型代表该表中的单个行。在我们的应用程序中，我们将把一堆人的联系信息存储在通讯录中。我们将拥有一个用于所有联系人的\
    \ `contacts` 集合，以及集合中每个人对应的不同 `contact` 模型。\n\n### 步骤 1 – 创建一些文件和文件夹\n\n在我们的 `scripts`\
    \ 目录中创建两个新目录，一个名为 `models`，另一个名为 `collections`。\n\n创建一个名为 `scripts/models/contact.js`\
    \ 的新文件。\n\n创建一个 `scripts/collections/contact.js` 文件。\n\n### 步骤 2 – 更新主脚本\n\n用以下代码替换\
    \ `scripts/main.js` 中的所有代码：\n\n```\nvar App = {\n  Models: {},\n  Collections:\
    \ {},\n  Contacts: null\n};\n\n$(function() { // 当 DOM 准备就绪时运行此代码\n  window.tom\
    \ = new App.Models.Contact({\n    firstName: 'Thomas',\n    lastName: 'Hunter',\n\
    \    phoneNumber: '9895135499',\n    email: 'me@thomashunter.name'\n  });\n\n\
    \  App.Contacts = new App.Collections.Contact();\n\n  App.Contacts.add(window.tom);\n\
    \n  App.Contacts.add({\n    firstName: 'Rupert',\n    lastName: 'Styx',\n    phoneNumber:\
    \ '9895551212',\n    email: 'rupertstyx@example.com'\n  });\n\n  App.Contacts.add({});\n\
    \n  var contactListing = '';\n  App.Contacts.each(function(contact) {\n    contactListing\
    \ += \"<div>\" +\n    contact.get('firstName') + \" \" +\n    contact.get('lastName')\
    \ + \" \";\n\n    if (contact.isValid()) {\n      contactListing += \"(valid)\"\
    ;\n    } else {\n      contactListing += \"(invalid)\";\n    }\n    \n    contactListing\
    \ += \"</div>\";\n  });\n  $('#display').html(contactListing);\n\n});\n```\n\n\
    ### 步骤 3 – 更新文档\n\n在 `index.html` 文档中，靠近结束标签 `</body>` 处现有的 `<script>` 标签之后，添加以下两个\
    \ script 标签：\n\n```\n<script src=\"scripts/models/contact.js\"></script>\n<script\
    \ src=\"scripts/collections/contact.js\"></script>\n```\n\n### 步骤 4 – 更新 Contact\
    \ 模型\n\n将以下代码添加到 `scripts/models/contact.js` 文件中：\n\n```\nApp.Models.Contact =\
    \ Backbone.Model.extend({\n  defaults: {\n    firstName: '',\n    lastName: '',\n\
    \    phoneNumber: '<UNLISTED>',\n    email: '<UNLISTED>'\n  },\n\n  validate:\
    \ function(attrs, options) {\n    if (!attrs.firstName) {\n      return \"A valid\
    \ contact must have a first name\";\n    }\n  },\n\n  initialize: function(attributes)\
    \ {\n    var firstName = attributes.firstName || '<EMPTY>';\n    var lastName\
    \ = attributes.lastName || '<EMPTY>';\n    console.log(\"Initializing a new contact\
    \ model for '\" +\n      firstName + \" \" + lastName + \"'.\"\n    );\n  }\n\
    });\n```\n\n### 步骤 5 – 更新 Contact 集合\n\n将以下代码添加到 `scripts/collections/contact.js`：\n\
    \n```\nApp.Collections.Contact = Backbone.Collection.extend({\n  model: App.Models.Contact\n\
    });\n```\n\n### 步骤 6 – 刷新浏览器\n\n完成前面代码的添加后，刷新浏览器窗口。你应该会在浏览器中看到以下屏幕：\n\n![步骤 6\
    \ – 刷新浏览器](img/5668OS_04_01.jpg)\n\n运行此代码后，我们成功创建了集合和模型对象，然后实例化了一个集合并用三个不同的模型填充它。我们还遍历了集合中的每一项，就像处理数据库结果一样，并将它们逐个显示在屏幕上。\n\
    \n### 检查 `scripts/main.js`\n\n让我们看看 `scripts/main.js`。该文件包含我们的应用程序引导代码：\n\n```\n\
    var App = {\n  Models: {},\n  Collections: {},\n  Contacts: null\n};\n```\n\n\
    这段代码创建了一个名为 `App` 的全局对象，包含三个属性。前两个 `Models` 和 `Collections` 是空对象，将包含我们分别扩展了 Backbone\
    \ Model 和 Collection 对象的 `Model` 和 `Collection` 对象。可以将它们视为稍后创建可供我们使用的实例的模板。在 JavaScript\
    \ 中没有类，只有对象，但这些对象将包含我们将假装为类的对象。\n\n第三个属性 `Contacts` 是我们实际存储主 Contact 集合实例的地方。因为我们永远只需要一个，且全局访问很方便，所以我们将其赋值于此。注意，我们不以这种方式跟踪单个\
    \ Contact 模型实例。\n\n创建一个名为 `App` 的全局对象实际上并不是 Backbone 所要求的。这是我使用的一种约定，以便稍后可以从不同的脚本与该全局对象交互。如果你在单个文件中创建整个应用程序，只需创建临时局部变量来指向这些对象即可。\n\
    \n```\n$(function() { // 当 DOM 准备就绪时运行此代码\n```\n\n`main.js` 中的下一段代码在 DOM 加载后执行。原因是一种两难境地（catch\
    \ 22）。我们在调用 `main.js` 后实例化的不同 `Model` 和 `Collection` 文件需要访问全局 `App` 变量。我们 `main.js`\
    \ 中的大部分需要 `Collections` 和 `Models` 对象已附加到全局 `App` 对象上。在 DOM 加载后运行代码可确保 `Model`\
    \ 和 `Collection` 脚本先加载，我们永远不会遇到未初始化变量的问题。\n\n```\n  window.tom = new App.Models.Contact({\n\
    \    firstName: 'Thomas',\n    lastName: 'Hunter',\n    phoneNumber: '9895135499',\n\
    \    email: 'me@thomashunter.name'\n  });\n```\n\n这里我们创建了一个 Contact Model 代码的实例。实例化对象时，我们传入一个简单对象，它将被转换为更复杂的\
    \ Backbone 模型。注意我是如何创建一个名为 `tom` 的全局变量的。这样做的原因是我们可以在 Web Inspector 中轻松检查它。\n\n\
    要查看对象的样子，打开你的 `Console`，只需输入 `tom`，然后按 `Enter`。你可以展开一些属性来查看对象的样子，如下截图所示：\n\n![步骤\
    \ 6 – 刷新浏览器](img/5668OS_04_02.jpg)\n\n正如你所见，Backbone 为我们添加了大量数据。Backbone 使用这些数据来帮助跟踪我们更改的内容、事件绑定、当我们准备持久化时发送到服务器的数据等。\n\
    \n这里最有趣的部分是 `attributes` 属性，它包含我们之前添加的所有简单数据。你可以通过运行 `tom.attributes.firstName`\
    \ 来访问此信息，但按照惯例，你应该通过运行 `tom.get('firstName')` 来访问它。\n\n```\nApp.Contacts = new\
    \ App.Collections.Contact();\n```\n\n前面这行代码创建了一个全局可访问的 Contact Collection 实例，并赋值给\
    \ `App.Contacts`。稍后在我们的应用程序中，当我们想要处理不同的联系人时，只需输入 `App.Contacts` 即可。\n\n```\n \
    \ App.Contacts.add(window.tom);\n\n  App.Contacts.add({\n    firstName: 'Rupert',\n\
    \    lastName: 'Styx',\n    phoneNumber: '9895551212',\n    email: 'rupertstyx@example.com'\n\
    \  });\n\n  App.Contacts.add({});\n```\n\n前面的代码行向我们的 Contact Collection 添加了三个不同的联系人。第一个获取我们预先创建的\
    \ Model 实例并将其添加到集合中。\n\n第二个从我们提供的简单对象中为我们隐式创建了一个新模型。显然，这样做可以节省几行代码。然而，有时你希望在将数据插入\
