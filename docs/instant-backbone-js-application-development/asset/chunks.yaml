    \n### Step 8 – running the server\n\nRunning this Node application should be as\
    \ easy as opening up a Terminal window as shown in the following screenshot, typing\
    \ \"`node `\" (note the space), dragging and dropping the `server.js` file onto\
    \ the Terminal window, and pressing *Enter*.\n\nIn OS X and most Linux's, you\
    \ can launch the Terminal application. In Windows, you can run the command prompt\
    \ application.\n\n![Step 8 – running the server](graphics/5668OS_04_04.jpg)\n\n\
    Once you've executed the Node server, you should see the message **http://localhost:1337/**\
    \ displayed in your terminal. This is the URL that the server is listening on\
    \ for incoming HTTP requests. Open that URL in your browser and you should see\
    \ your application again! From now on, you'll want to use that URL to navigate\
    \ to your application, instead of double-clicking on the `index.html` file directly.\n\
    \nYou should see a listing of the two contacts that you've been seeing before,\
    \ namely **Thomas Hunter** and **Rupert Styx**. Try adding some more contacts,\
    \ and deleting contacts. But, this time, refresh the page in-between. This time\
    \ they are saved on the server side, instead of being deleted every time you refresh!\n\
    \nOne of the most noteworthy changes we've made in the Backbone application is\
    \ the addition of `id` attributes on our Contact models. As soon as Backbone sees\
    \ that `id` attribute, it knows how to refer to objects on the server. We also\
    \ added some features for telling Backbone at what point to talk to the server\
    \ for persisting and retrieving data.\n\nLet us first have a look at `scripts/collections/contact.js`:\n\
    \n```\n  url: '/contacts'\n```\n\nThe `url` attribute on Collection objects is\
    \ a Backbone convention for specifying the root URL point that represents that\
    \ given type of data.\n\nWhen Backbone wants to create a new contact, it will\
    \ perform a POST operation on that location. When Backbone wants to get a list\
    \ of all items in the collection, it will perform a GET operation on that location.\
    \ When Backbone wants to remove a particular item, it will perform a DELETE operation\
    \ on that location followed by a slash and a unique identifier. When Backbone\
    \ wants to retrieve a particular item from the server, it will perform a GET operation\
    \ on that location with the unique identifier. Finally, when Backbone wants to\
    \ change an existing item, it will perform a PUT operation on that location with\
    \ the unique identifier.\n\nThis is a very common way of using URLs to represent\
    \ data on the server. This common way of interacting with resources is generally\
    \ referred to as REST. Because of this, you could say that this server script\
    \ provides a RESTful API for the frontend Backbone application to interact with.\n\
    \nNow we will look at `scripts/main.js`:\n\nMost of the changes in this file are\
    \ removing the code, which adds two default contacts since we would prefer the\
    \ backend server to take care of these for us.\n\n```\n  App.Contacts.fetch();\n\
    ```\n\nThis line of code tells Backbone to perform a fetch of the data. Remember\
    \ from before that, since Backbone wants all the data from the collection, it\
    \ is performing a GET operation at the URL /contacts.\n\nOpen your Network console\
    \ for Chrome, and select what should be the last network request \"contacts\"\
    . This will show you exactly what the data being sent from Node to Backbone looks\
    \ like. You should see an array of objects like the following screenshot:\n\n\
    ![Step 8 – running the server](graphics/5668OS_04_05.jpg)\n\nIf this were an application\
    \ built from the ground up using just jQuery, you probably would have written\
    \ a `$.ajax()` call to perform this work, and iterate over each item by hand.\
    \ Backbone actually uses the same `$.ajax()` call provided by jQuery, but does\
    \ it all behind the scenes for us automatically!\n\nLet us now have a look at\
    \ `scripts/router.js`:\n\n```\n  contactsRemove: function(id) {\n    var contact\
    \ = App.Contacts.get(id);\n    if (contact) {\n      contact.destroy();\n    }\n\
    \    App.Directory.addFormHide();\n  }\n```"
  fmt: "\n# Server Implementation\n\n```javascript\nvar http = require('http');\n\
    var filesystem = require('fs');\n\n// Our Contacts \"Database\"\nvar contacts\
    \ = [{\n  id: '1',\n  firstName: 'Thomas',\n  lastName: 'Hunter',\n  phoneNumber:\
    \ '9895135499',\n  email: 'me@thomashunter.name'\n},\n{\n  id: '2',\n  firstName:\
    \ 'Rupert',\n  lastName: 'Styx',\n  phoneNumber: '9895551212',\n  email: 'rupertstyx@example.com'\n\
    }];\n\nhttp.createServer(function (req, res) {\n  console.log(req.method + ' '\
    \ + req.url);\n\n  if (req.url === '/' && req.method === 'GET') {\n    // Requesting\
    \ HTML Document\n    filesystem.readFile(__dirname + '/index.html',\n      function(err,\
    \ data) {\n      if (err) throw err;\n      res.end(data);\n    });\n\n    return;\n\
    \  } else if (req.url.indexOf('/contacts') === 0) {\n    // Backbone requesting\
    \ some data\n    res.writeHead(200, {\n      'Content-Type': 'application/json'\n\
    \    });\n\n    if (req.method == 'GET') {\n      // Backbone wants a list of\
    \ all Contacts\n      res.end(JSON.stringify(contacts));\n    } else if (req.method\
    \ == 'POST') {\n      // Backbone is creating a new Contact\n      var body =\
    \ '';\n      req.on('data', function(data) {\n        body += data;\n      });\n\
    \      req.on('end', function() {\n        var contact = JSON.parse(body);\n \
    \       // Here we make up a unique ID\n        contact.id = Math.random()\n \
    \         .toString(36).substr(2);\n        // The contact is stored in the DB\n\
    \        contacts.push(contact);\n        // Now we send the updated contact\n\
    \        // (which has an ID) back to the\n        // Backbone application\n \
    \       res.end(JSON.stringify(contact));\n        console.log(\"CONTACT ADD:\
    \ \", contact);\n      });\n    } else if (req.method == 'DELETE') {\n      //\
    \ Backbone is deleting a Contact\n      var id = req.url.split('/')[2];\n    \
    \  console.log(\"DELETE CONTACT: \", id);\n      for (var index in contacts) {\n\
    \        if (contacts[index].id === id) {\n          // Delete Contact from DB\n\
    \          contacts.splice(index, 1);\n          break;\n        }\n      }\n\
    \      res.end();\n    }\n\n    return;\n  } else {\n    // Browser probably requesting\
    \ JavaScript\n    var filename = __dirname + req.url;\n\n    filesystem.lstat(filename,\n\
    \        function(err, stats) {\n      if (err || !stats.isFile()) {\n       \
    \ if (req.url != '/favicon.ico') {\n          console.log(\"404: \" + filename);\n\
    \        }\n        res.writeHead(404, {\n          'Content-Type': 'text/plain'\n\
    \        });\n        res.write('404 Not Found\\n');\n        res.end();\n   \
    \     return;\n      }\n\n      filesystem.readFile(filename,\n        function(err,\
    \ data) {\n        res.writeHead(200, {\n          'Content-Type': 'text/javascript'\n\
    \        });\n        res.end(data);\n      });\n    });\n    return;\n  }\n\n\
    }).listen(1337);\n\nconsole.log('http://localhost:1337/');\n```\n\n## Step 3 –\
    \ Updating the Contacts Collection\n\nUpdate `scripts/collections/contact.js`,\
    \ and add the following attribute after the existing `model` attribute:\n\n```javascript\n\
    url: '/contacts'\n```\n\n## Step 4 – Updating the Main Script\n\nUpdate `scripts/main.js`,\
    \ and remove all the lines where we add the two contacts.\n\nAlso in `scripts/main.js`,\
    \ add the following line of code at the end of the DOM ready code:\n\n```javascript\n\
    App.Contacts.fetch();\n```\n\n## Step 5 – Updating the Router\n\nChange the `contactsRemove()`\
    \ method in `scripts/router.js` to resemble the following:\n\n```javascript\n\
    contactsRemove: function(id) {\n  var contact = App.Contacts.get(id);\n  if (contact)\
    \ {\n    contact.destroy();\n  }\n  App.Directory.addFormHide();\n}\n```\n\n##\
    \ Step 6 – Updating the Contact View\n\nChange the `remove()` method in `scripts/views/contact.js`\
    \ to resemble the following:\n\n```javascript\nremove: function() {\n  App.Browser.navigate('contacts/remove/'\
    \ + this.model.get('id'));\n  this.model.destroy();\n}\n```\n\n## Step 7 – Updating\
    \ the Directory View\n\nIn `scripts/views/directory.js`, update the `addSubmit()`\
    \ method by adding the following line of code after the line where we add the\
    \ contact to the collection:\n\n```javascript\nnewContact.save();\n```\n\n## Step\
    \ 8 – Running the Server\n\nRunning this Node application should be as easy as\
    \ opening up a Terminal window as shown in the following screenshot, typing `node\
    \ ` (note the space), dragging and dropping the `server.js` file onto the Terminal\
    \ window, and pressing Enter.\n\nIn OS X and most Linux's, you can launch the\
    \ Terminal application. In Windows, you can run the command prompt application.\n\
    \n![Step 8 – running the server](graphics/5668OS_04_04.jpg)\n\nOnce you've executed\
    \ the Node server, you should see the message `http://localhost:1337/` displayed\
    \ in your terminal. This is the URL that the server is listening on for incoming\
    \ HTTP requests. Open that URL in your browser and you should see your application\
    \ again! From now on, you'll want to use that URL to navigate to your application,\
    \ instead of double-clicking on the `index.html` file directly.\n\nYou should\
    \ see a listing of the two contacts that you've been seeing before, namely **Thomas\
    \ Hunter** and **Rupert Styx**. Try adding some more contacts, and deleting contacts.\
    \ But, this time, refresh the page in-between. This time they are saved on the\
    \ server side, instead of being deleted every time you refresh!\n\nOne of the\
    \ most noteworthy changes we've made in the Backbone application is the addition\
    \ of `id` attributes on our Contact models. As soon as Backbone sees that `id`\
    \ attribute, it knows how to refer to objects on the server. We also added some\
    \ features for telling Backbone at what point to talk to the server for persisting\
    \ and retrieving data.\n\n### Examining the Collection\n\nLet us first have a\
    \ look at `scripts/collections/contact.js`:\n\n```javascript\nurl: '/contacts'\n\
    ```\n\nThe `url` attribute on Collection objects is a Backbone convention for\
    \ specifying the root URL point that represents that given type of data.\n\nWhen\
    \ Backbone wants to create a new contact, it will perform a `POST` operation on\
    \ that location. When Backbone wants to get a list of all items in the collection,\
    \ it will perform a `GET` operation on that location. When Backbone wants to remove\
    \ a particular item, it will perform a `DELETE` operation on that location followed\
    \ by a slash and a unique identifier. When Backbone wants to retrieve a particular\
    \ item from the server, it will perform a `GET` operation on that location with\
    \ the unique identifier. Finally, when Backbone wants to change an existing item,\
    \ it will perform a `PUT` operation on that location with the unique identifier.\n\
    \nThis is a very common way of using URLs to represent data on the server. This\
    \ common way of interacting with resources is generally referred to as REST. Because\
    \ of this, you could say that this server script provides a RESTful API for the\
    \ frontend Backbone application to interact with.\n\n### Examining main.js\n\n\
    Now we will look at `scripts/main.js`:\n\nMost of the changes in this file are\
    \ removing the code, which adds two default contacts since we would prefer the\
    \ backend server to take care of these for us.\n\n```javascript\nApp.Contacts.fetch();\n\
    ```\n\nThis line of code tells Backbone to perform a fetch of the data. Remember\
    \ from before that, since Backbone wants all the data from the collection, it\
    \ is performing a `GET` operation at the URL `/contacts`.\n\nOpen your Network\
    \ console for Chrome, and select what should be the last network request \"contacts\"\
    . This will show you exactly what the data being sent from Node to Backbone looks\
    \ like. You should see an array of objects like the following screenshot:\n\n\
    ![Step 8 – running the server](graphics/5668OS_04_05.jpg)\n\nIf this were an application\
    \ built from the ground up using just jQuery, you probably would have written\
    \ a `$.ajax()` call to perform this work, and iterate over each item by hand.\
    \ Backbone actually uses the same `$.ajax()` call provided by jQuery, but does\
    \ it all behind the scenes for us automatically!\n\n### Examining the Router\n\
    \nLet us now have a look at `scripts/router.js`:\n\n```javascript\ncontactsRemove:\
    \ function(id) {\n  var contact = App.Contacts.get(id);\n  if (contact) {\n  \
    \  contact.destroy();\n  }\n  App.Directory.addFormHide();\n}\n```\n"
