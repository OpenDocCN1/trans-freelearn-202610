    \n    this.listenTo(this.model, 'change', this.render);\n    this.insert();\n\
    \  },\n```\n\nThe `initialize()` method is run every time this view is instantiated,\
    \ and therefore resembles a constructor in many class-based languages. One is\
    \ able to pass in extra parameters when instantiating the class. As you can see\
    \ in the preceding code, we're referring to this argument as `options`, although\
    \ that isn't necessarily a Backbone convention.\n\nThe `_.bindAll()` method is\
    \ a convenience function for quickly specifying a bunch of other methods of this\
    \ object we would like to overwrite. The preceding code will rebind this to refer\
    \ to the entire View object, instead of just the local method it is being used\
