    \ ever contains a link such as the following, it will trigger the router deletion:\n\
    \n```\n<a href=\"#contacts/remove/c1\">Delete First Contact</a>\n```\n\n## `scripts/views/directory.js`\n\
    \nWe will also take a look at `scripts/views/directory.js`:\n\n```\n    App.Browser.navigate('contacts/add');\n\
    ```\n\nThis of course changes our URL for the Add Contact form. If someone only\
    \ ever goes to our application for the purpose of quickly adding new contacts,\
    \ this URL becomes very convenient for them.\n\n```\n  addFormHide: function()\
    \ {\n    App.Browser.navigate('contacts');\n    this.$('.controls form').hide();\n\
    \  },\n```\n\nHere we've refactored the code a little. Now that we've added the\
    \ concept of a router, the need to toggle the visibility of the Add Contact form\
    \ from elsewhere is important. We update the call in `addSubmit()` later to use\
    \ this new function to complete the refactor.\n\nChanging the URL anchor dynamically\
    \ is good enough to allow the user to bookmark pages, share pages with friends,\
    \ and navigate through history using their browser's forward and back buttons.\
    \ However, if you want to get rid of the anchor symbol `#` (this simply looks\
    \ nicer) you will need to look into a server-side solution to achieve this.\n\n\
    ### Note\n\nThe method for this will be different depending on the backend server\
    \ software you choose for your project. As a general rule, though, you'll want\
    \ to execute the same page generation script and keep track of dynamic URL rules\
    \ using regular expressions. Apache has `mod_rewrite`. Nginx has the HTTP location\
    \ directive.\n\n## Persisting data to a server\n\nOne of the biggest features\
    \ of Backbone is how well it keeps data in synchronization between your backend\
    \ server / database, and the frontend interface that your user is interacting\
    \ with. Collections and Models are such a big part of Backbone that it would be\
    \ a shame if we didn't have a backend to persist our data to!\n\nThis section\
    \ of the book will have you create a simple **Node.js** based server in which\
    \ we can save our contacts. There are two big reasons we're going to use Node\
    \ for this project. The first is because programming is done in JavaScript, and\
    \ you already know JavaScript! The second is that starting a server in Node for\
    \ development is extremely simple. No need to spend hours tweaking configuration\
    \ files and installing package dependencies.\n\n### Step 1 – getting ready\n\n\
    Download and install Node for your operating system. You can download a Node package\
    \ from the following URL:\n\n[http://nodejs.org/download/](http://nodejs.org/download/)\n\
    \nNext, create a `server.js` file. This file should sit in the root of your project\
    \ directory. Since the browser will never execute this code, it doesn't need to\
    \ follow our convention of living inside of the `scripts` directory. In fact,\
    \ it shouldn't follow the convention at all, otherwise one could get confused\
    \ about the purpose of the script. You also will not need to load it using a `<script>`\
    \ tag in our HTML file.\n\n### Step 2 – creating a server script\n\nAdd the following\
    \ code to `server.js`. I won't be explaining the code line-by-line, like with\
    \ the other code we've written, as it is beyond the scope of this book:\n"
