    \  $container: null,\n```\n\nThe template attribute is a Backbone convention for\
    \ storing the template object. In this case, you can see that we're searching\
    \ the DOM for an element identified as `#template-contact` (the `<script>` tag\
    \ we added earlier), then grabbing the HTML contained within it. We then pass\
