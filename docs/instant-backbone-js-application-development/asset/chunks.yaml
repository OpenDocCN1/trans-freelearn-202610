    ## And that's it!\n\nCongratulations, you've now got the necessary files in place\
    \ for a Backbone-based project.\n\nNow that you've got the necessary script files\
    \ and a project directory laid out, let's begin writing some code to confirm that\
    \ the application works. This code will require all scripts we've saved to be\
    \ accessible; otherwise we'll see some error messages.\n\nWe'll also go over the\
    \ Web Inspector and use it to interact with our applications. Learning this tool\
    \ is essential for any web application developer to proficiently debug (and even\
    \ write new code for) their application.\n\n## Step 1 – adding code to the document\n\
    \nAdd the following code to your `index.html` file. Notice that I'm assuming the\
    \ use of LoDash and Zepto, so you'll want to update the code accordingly:\n\n\
    ```\n<!DOCTYPE HTML>\n<html>\n  <head>\n    <title>Backbone Application Development\
    \ Starter</title>\n    <!-- Your Utility Library -->\n    <script src=\"scripts/lodash-1.3.1.js\"\
    ></script>\n    <!-- Your Selector Engine -->\n    <script src=\"scripts/zepto-1.0.js\"\
    ></script>\n    <script src=\"scripts/backbone-1.0.0.js\"></script>\n  </head>\n\
    \  <body>\n    <div id=\"display\">\n      <div class=\"listing\">Houston, we\
    \ have a problem.</div>\n    </div>\n  </body>\n  <script src=\"scripts/main.js\"\
    ></script>\n</html>\n```\n\n### Tip\n\n**Downloading the example code**\n\nYou\
    \ can download the example code files for all Packt books you have purchased from\
    \ your account at [http://www.packtpub.com](http://www.packtpub.com). If you purchased\
    \ this book elsewhere, you can visit [http://www.packtpub.com/support](http://www.packtpub.com/support)\
    \ and register to have the files e-mailed directly to you.\n\nThis file will load\
    \ all of our scripts and has a simple `<div>`, which displays some content.\n\n\
    Notice that I have placed the loading of our `main.js` file after the closing\
    \ `<body>` tag. This is just a personal preference of mine; it will ensure that\
    \ the script is executed after the elements of the DOM have been populated. If\
    \ you were to place it adjacent to the other scripts, you would need to encapsulate\
    \ the contents of the script with a function call so that it gets run after the\
    \ DOM has loaded; otherwise, when the script runs and tries to find the `div#display`\
    \ element, it will fail.\n\n## Step 2 – adding code to the main script\n\nNow,\
    \ add the following code to your `scripts/main.js` file:\n\n```\nvar object =\
    \ {};\n\n_.extend(object, Backbone.Events);\n\nobject.on(\"show-message\", function(msg)\
    \ {\n  $('#display .listing').text(msg);\n});\n\nobject.trigger(\"show-message\"\
    , \"Hello World\");\n```\n\nAllow me to break down the contents of `main.js` so\
    \ that you know what each line does.\n\n```\nvar object = {};\n```\n\nThe preceding\
    \ line should be pretty obvious. We're just creating a new object, aptly named\
    \ `object`, which contains no attributes.\n\n```\n_.extend(object, Backbone.Events);\n\
    ```\n\nThe preceding line is where the magic starts to happen. The utility library\
    \ provides us with many functions, one of which is `extend`. This function takes\
    \ two or more objects as its arguments, copies the attributes from them, and appends\
    \ them to the first object. You can think of this as sort of extending a class\
    \ in a classical language (such as PHP).\n\nUsing the `extend` utility function\
    \ is the preferred way of adding Backbone functionality to your classes. In this\
    \ case, our `object` object is now a Backbone `Event` object, which means it can\
    \ be used for triggering events and running callback functions when an event is\
    \ triggered. By extending your objects in this manner, you have a common method\
    \ for performing event-based actions in your code, without having to write one-off\
    \ implementations.\n\n```\nobject.on(\"show-message\", function(msg) {\n  $('#display\
    \ .listing').text(msg);\n});\n```\n\nThe preceding code adds an event listener\
    \ to our object. The first argument to the `on` function is the name of the event,\
    \ in this case `show-message`. This is a simple string that describes the event\
    \ you are listening for and will be used later for triggering the events. There\
    \ isn't a requirement as far as naming conventions go, but try to be descriptive\
    \ and consistent.\n\nThe second argument is a callback function, which takes an\
    \ argument that can be set at the time the event is triggered. The callback function\
    \ here is pretty simple; it just queries the DOM using our selector engine and\
    \ updates the text of the element to be the text passed into the event.\n\n```\n\
    object.trigger(\"show-message\", \"Hello World\");\n```\n\nFinally, we trigger\
    \ our event. Simply use the `trigger` function on the object, tell it that we\
    \ are triggering the `show-message` event, and pass in the argument for the trigger\
    \ callback as the second argument.\n\n## Step 3 – opening the project in your\
    \ browser\n\nThis will show us the text **Hello World** when we open our `index.html`\
    \ file in our browser. Don't believe me? Double click on the file now, and you\
    \ should see the following screen:\n\n![Step 3 – opening the project in your browser](graphics/5668OS_03_01.jpg)\n\
    \nIf Chrome isn't your default browser, you should be able to right-click on the\
    \ file from within your file browser and there should be a way to choose which\
    \ application to open the file with. Chrome should be in that list if it was installed\
    \ properly.\n\n## Step 4 – encountering a problem\n\nDo you see something other\
    \ than our happy **Hello World** message? The code is set up in a way that it\
    \ should display the message **Houston**, **we have a problem** if something were\
    \ to go wrong (this text is what is displayed in the DOM by default, before having\
    \ JavaScript run and replace it).\n\n### The missing script file\n\nThe first\
    \ place to look for the problem is the **Network** tab of the Web Inspector. This\
    \ tab shows us each of the files that were downloaded by the browser to satisfy\
    \ the rendering of the page. Sometimes, the **Console** tab will also tell us\
    \ when a file wasn't properly downloaded, but not always. The following screenshot\
    \ explains this:\n\n![The missing script file](graphics/5668OS_03_02.jpg)\n\n\
    If you look at the **Network** tab, you can see an item clearly marked in red\
    \ (**backbone-1.0.0.js**). In my project folder, I had forgotten to download the\
    \ Backbone library file, thus the browser wasn't able to load the file. Note that\
    \ we are loading the file from the local filesystem, so the status column says\
    \ either **Success** or **Failure**. If these files were being loaded from a real\
    \ web server, you would see the actual HTTP status codes, such as **200 OK** for\
    \ a successful file download or **404 Not Found** for a missing file.\n\n### The\
    \ script typo\n\nPerhaps you have made a typo in the script while copying it from\
    \ the book. If you have any sort of issues resulting from incorrect JavaScript,\
    \ they will be visible in the **Console** tab, as shown in the following screenshot:\n\
    \n![The script typo](graphics/5668OS_03_03.jpg)\n\nIn my example, I had forgotten\
    \ the line about extending my object with the Backbone events class. Having left\
    \ out the `extend` line of code caused the object to be missing some functionality,\
    \ specifically the method `on()`. Notice how the console displays which filename\
    \ and line number the error is on.\n\nFeel free to remove and add code to the\
    \ files and refresh the page to get a feel for what the errors look like in the\
    \ console. This is a great way to get a feel for debugging Backbone-based (and,\
    \ really, any JavaScript) applications.\n\nThe following sections will guide you\
    \ through building a simple contact manager app. You will write different types\
    \ of code, keeping the code organized into different files and directories depending\
    \ on the purpose of the code.\n\n## Models and Collections"
