- raw: "The `addForm()` method makes the input form visible. We use a bit of jQuery\
    \ function chaining to make it all happen. First, we select the form element located\
    \ within the `.controls` element within our current View. We then run the jQuery\
    \ `show()` method, which makes this element visible (in other words, it disables\
    \ our inline CSS from the `<form>` tag). Next we look for the `firstName` input\
    \ (which is the first input in the form and likely the one the user wants to type\
    \ into) and we have jQuery focus on that element. This lets the user immediately\
    \ begin typing after clicking on the button.\n\n```\n  addSubmit: function(event)\
    \ {\n    event.preventDefault();\n    var $form = this.$('.controls form');\n\
    ```\n\nWe begin this method by taking the event (the form submit event) and immediately\
    \ telling the browser to stop whatever it was planning on doing via the `preventDefault()`\
    \ method. If we didn't do this, the form would still submit and our Single Page\
    \ Application would get blown away.\n\nNext, we grab onto the form element and\
    \ cache it into a local variable. The name of this variable is `$form`, and isn't\
    \ necessarily a Backbone convention. By prefixing variables that are references\
    \ to DOM elements that have been captured using jQuery with the `$` symbol, it\
    \ is easier to look at them and know what type of data they contain. Backbone\
    \ does follow this convention in some places though, such as the `$el` attribute\
    \ on Views.\n\n```\n    var newContact = new App.Models.Contact({\n      firstName:\
    \ $('input.firstName', $form).val(),\n      lastName: $('input.lastName', $form).val(),\n\
    \      phoneNumber: $('input.phoneNumber', $form).val(),\n      email: $('input.email',\
    \ $form).val()\n    });\n```\n\nHere we take all of the data from the form and\
    \ pass it into a newly instantiated Contact model. Note that when we create this\
    \ Model, we haven't actually put it into the Collection yet. It is just an orphaned\
    \ Model for now.\n\n```\n    if (newContact.isValid()) {\n      App.Contacts.add(newContact);\n\
    \      $form.hide();\n      $('input[type=text]', $form).val('').blur();\n   \
    \ } else {\n      alert(newContact.validationError);\n    }\n```\n\nThis is the\
    \ reason we took the raw data from the user and added it to a Model before checking\
    \ it for errors. We will use the `isValid()` method provided to Models to check\
    \ and see if the data is valid or not.\n\nIf the Model is found to be valid, we\
    \ insert it into the Contacts collection, hide the form, and then remove focus\
    \ from any of the input fields by using the `blur` method provided by jQuery.\
    \ If we didn't do this, weird things could happen from having focus in there.\n\
    \nIf the Model is not found to be valid, we display an error message to the user.\
    \ This message is the result of the `isValid()` function executed earlier. Of\
    \ course, if this were a real application, you'd want to display the message in\
    \ a less intrusive manner, such as toggling a message with red text next to the\
    \ form.\n\n### Note\n\nI left out something very important in the functionality\
    \ of this application. We can add contacts and delete them, but we can't edit\
    \ them! Using the knowledge you have obtained so far about Backbone, try to add\
    \ the editing functionality to this app.\n\n## URL-based routing\n\nWhen a user\
    \ navigates around a traditional Request / Response website, they fully expect\
    \ the back and forward history navigation to work. With the stateless nature of\
    \ the traditional website, this was very easy to implement. The browser needed\
    \ only to keep track of the previously requested URLs and request them again when\
    \ the user asks for them.\n\nSingle Page Applications built using JavaScript are\
    \ stateful and will require programmer intervention to allow this appearance of\
    \ functioning history. Luckily for us, Backbone provides mechanisms to make this\
    \ process easier.\n\nUsers do expect the URL of the application to change when\
    \ the content on the screen changes. Users would also like to share URLs with\
    \ other people, as well as bookmark these URLs for later browsing. Typically,\
    \ traditional web apps have a URL that points to a resource on the server, beginning\
    \ with a forward slash. Every time a new page is requested, the server responds\
    \ with an entirely new page based on that URL.\n\nJavaScript, for the longest\
    \ time, couldn't change the URL without redirecting the user to another page,\
    \ except by changing the URL after the `#` symbol (often referred to as an anchor).\
    \ However, there's a relatively new JavaScript API, that allows a URL to be changed\
    \ without needing an anchor, as long as the user is kept within the current domain.\
    \ This is called `pushState` and like many exciting web technologies, is only\
    \ available in modern browsers and therefore may not meet the criteria for your\
    \ project. Luckily, Backbone can work with either method, and provides a common\
    \ interface for both.\n\nWhen using `pushState`, as the user first requests a\
    \ page deep within your application, the browser will make the full request to\
    \ the server, as it has no way of knowing whether a URL is a normal server request\
    \ URL or whether part of that URL was built using `pushState`. For these requests\
    \ to work properly, the server-side application needs to be built in such a way\
    \ to account for this. Since we're still building this application in our browser\
    \ using the local filesystem, we will forego using `pushState` and use the traditional\
    \ anchor-based URLs (the default for Backbone).\n\n### Step 1 – creating a router\
    \ script\n\nCreate a `scripts/router.js` file and add the following code to it:\n\
    \n```\nApp.Routers.Contact = Backbone.Router.extend({\n  routes: {\n    'contacts':\
    \ 'contacts',\n    'contacts/add': 'contactsAdd',\n    'contacts/remove/:id':\
    \ 'contactsRemove'\n  },\n\n  contacts: function() {\n    App.Directory.render();\n\
    \    App.Directory.addFormHide();\n  },\n\n  contactsAdd: function() {\n    App.Directory.addForm();\n\
    \  },\n\n  contactsRemove: function(id) {\n    App.Contacts.remove(id);\n    App.Directory.addFormHide();\n\
    \  }\n});\n```\n\n### Step 2 – updating the document\n\nUpdate `index.html` and\
    \ add the following line after loading `scripts/main.js` so that we can get access\
    \ to this new script file:\P\n\n```\n  <script src=\"scripts/router.js\"></script>\n\
    ```\n\n### Step 3 – updating the main script\n\nUpdate `scripts/main.js` so that\
    \ the main `App` object has two more keys such as the following (don't forget\
    \ that trailing comma):\n\n```\nvar App = {\n  …,\n  Routers: {},\n  Browser:\
    \ null\n};\n```\n\nAlso in `scripts/main.js`, add the following two lines at the\
    \ end of our document-ready function:\n\n```\n  App.Browser = new App.Routers.Contact;\n\
    \  Backbone.history.start();\n```\n\n### Step 4 – updating the Contacts view\n\
    \nUpdate `scripts/views/contact.js`, and add the following line of code to the\
    \ beginning of the `remove()` method:\n\n```\n    App.Browser.navigate('contacts/remove/'\
    \ + this.model.cid);\n```\n\n### Step 5 – updating the directory view\n\nUpdate\
    \ `scripts/views/directory.js`, and add the following line of code to the beginning\
    \ of the `addForm()` method:\n\n```\n    App.Browser.navigate('contacts/add');\n\
    ```\n\nAlso, add this new method to the directory view file after the existing\
    \ `addForm()` method:\n\n```\n  addFormHide: function() {\n    App.Browser.navigate('contacts');\n\
    \    this.$('.controls form').hide();\n  },\n```\n\nBe sure to add `addFormHide`\
    \ to the `bindAll()` call in the `initialize()` method of this object:\n\n```\n\
    _.bindAll(this, 'render', 'addForm', 'addSubmit', 'addFormHide');\n```\n\nLet's\
    \ also do a quick refactor of the `addSubmit()` method. Replace the line of code\
    \ that contains `$form.hide()` with the following line of code:\n\n```\n     \
    \ this.addFormHide();\n```\n\nOnce you've performed these steps, reload the web\
    \ page. Perform some different actions on the app, such as adding new contacts,\
    \ deleting contacts, and so on. Notice how the URL changes while you perform different\
    \ actions."
  fmt: "\n`addForm()` 方法使输入表单可见。我们使用了一点 jQuery 函数链式调用来实现这一切。首先，我们选择当前 View 中 `.controls`\
    \ 元素内的表单元素。然后运行 jQuery `show()` 方法，使该元素可见（换句话说，它禁用了 `<form>` 标签上的内联 CSS）。接下来我们查找\
    \ `firstName` 输入框（这是表单中的第一个输入框，很可能是用户想要输入的那个），并让 jQuery 将焦点放在该元素上。这让用户在点击按钮后可以立即开始输入。\n\
    \n```\naddSubmit: function(event) {\n  event.preventDefault();\n  var $form =\
    \ this.$('.controls form');\n}\n```\n\n我们通过获取事件（表单提交事件）并立即通过 `preventDefault()`\
    \ 方法告诉浏览器停止其原本计划执行的操作来开始此方法。如果不这样做，表单仍会提交，我们的单页应用程序将被销毁。\n\n接下来，我们获取表单元素并将其缓存到局部变量中。该变量名为\
    \ `$form`，并不一定是 Backbone 的约定。通过用 `$` 符号作为前缀来标识那些使用 jQuery 捕获的 DOM 元素引用变量，可以更容易地查看它们并知道它们包含什么类型的数据。Backbone\
    \ 在某些地方也遵循此约定，例如 View 上的 `$el` 属性。\n\n```\nvar newContact = new App.Models.Contact({\n\
    \  firstName: $('input.firstName', $form).val(),\n  lastName: $('input.lastName',\
    \ $form).val(),\n  phoneNumber: $('input.phoneNumber', $form).val(),\n  email:\
    \ $('input.email', $form).val()\n});\n```\n\n这里我们获取表单中的所有数据并将其传递给新实例化的 `Contact`\
    \ 模型。注意，当我们创建此模型时，尚未将其放入 Collection 中。它目前只是一个孤立的模型。\n\n```\nif (newContact.isValid())\
    \ {\n  App.Contacts.add(newContact);\n  $form.hide();\n  $('input[type=text]',\
    \ $form).val('').blur();\n} else {\n  alert(newContact.validationError);\n}\n\
    ```\n\n这就是我们获取用户的原始数据并将其添加到模型中，然后再检查错误的原因。我们将使用提供给模型的 `isValid()` 方法来检查数据是否有效。\n\
    \n如果发现模型有效，我们将其插入 `Contacts` 集合，隐藏表单，然后使用 jQuery 提供的 `blur` 方法移除所有输入字段的焦点。如果不这样做，由于焦点仍在其中可能会发生奇怪的事情。\n\
    \n如果发现模型无效，我们向用户显示错误消息。此消息是先前执行的 `isValid()` 函数的结果。当然，如果这是真实的应用程序，您会希望以一种不那么侵入性的方式显示消息，例如在表单旁切换显示红色文本消息。\n\
    \n### Note\n\n我遗漏了此应用程序功能中非常重要的一点。我们可以添加和删除联系人，但无法编辑它们！利用您迄今为止获得的关于 Backbone 的知识，尝试向此应用添加编辑功能。\n\
    \n# URL-based routing\n\n当用户在传统的请求/响应网站中导航时，他们完全期望后退和前进历史记录导航能够工作。由于传统网站的无状态特性，这很容易实现。浏览器只需跟踪之前请求的\
    \ URL，并在用户请求时再次请求它们。\n\n使用 JavaScript 构建的单页应用程序是有状态的，将需要程序员干预以允许这种历史记录功能的表象。幸运的是，Backbone\
    \ 提供了机制使此过程更容易。\n\n用户确实期望应用程序的 URL 在屏幕内容改变时发生变化。用户也希望与他人共享 URL，以及将这些 URL 加入书签以供稍后浏览。通常，传统\
    \ Web 应用程序具有指向服务器上资源的 URL，以正斜杠开头。每次请求新页面时，服务器都会根据该 URL 响应一个全新的页面。\n\n长期以来，JavaScript\
    \ 无法在不重定向用户到另一页面的情况下更改 URL，除非更改 `#` 符号后的 URL（通常称为锚点）。然而，有一个相对较新的 JavaScript API，允许在不需要锚点的情况下更改\
    \ URL，只要用户保持在当前域内即可。这称为 `pushState`，与许多令人兴奋的 Web 技术一样，它仅在现代浏览器中可用，因此可能不符合您项目的标准。幸运的是，Backbone\
    \ 可以使用任一方法，并为两者提供通用接口。\n\n当使用 `pushState` 时，当用户首次请求应用程序深处的页面时，浏览器将向服务器发出完整请求，因为它无法知道\
    \ URL 是正常的服务器请求 URL，还是部分 URL 是使用 `pushState` 构建的。为了使这些请求正常工作，服务器端应用程序需要以考虑到这一点的方式构建。由于我们仍在使用本地文件系统在浏览器中构建此应用程序，我们将放弃使用\
    \ `pushState`，改用传统的基于锚点的 URL（Backbone 的默认方式）。\n\n## Step 1 – creating a router\
    \ script\n\n创建 `scripts/router.js` 文件并添加以下代码：\n\n```\nApp.Routers.Contact = Backbone.Router.extend({\n\
    \  routes: {\n    'contacts': 'contacts',\n    'contacts/add': 'contactsAdd',\n\
    \    'contacts/remove/:id': 'contactsRemove'\n  },\n\n  contacts: function() {\n\
    \    App.Directory.render();\n    App.Directory.addFormHide();\n  },\n\n  contactsAdd:\
    \ function() {\n    App.Directory.addForm();\n  },\n\n  contactsRemove: function(id)\
    \ {\n    App.Contacts.remove(id);\n    App.Directory.addFormHide();\n  }\n});\n\
    ```\n\n## Step 2 – updating the document\n\n更新 `index.html`，在加载 `scripts/main.js`\
    \ 之后添加以下行，以便我们可以访问这个新脚本文件：\n\n```\n<script src=\"scripts/router.js\"></script>\n\
    ```\n\n## Step 3 – updating the main script\n\n更新 `scripts/main.js`，使主 `App` 对象拥有两个更多的键，如下所示（不要忘记尾随逗号）：\n\
    \n```\nvar App = {\n  …,\n  Routers: {},\n  Browser: null\n};\n```\n\n同样在 `scripts/main.js`\
    \ 中，在我们的 document-ready 函数末尾添加以下两行：\n\n```\nApp.Browser = new App.Routers.Contact;\n\
    Backbone.history.start();\n```\n\n## Step 4 – updating the Contacts view\n\n更新\
    \ `scripts/views/contact.js`，在 `remove()` 方法开头添加以下代码行：\n\n```\nApp.Browser.navigate('contacts/remove/'\
    \ + this.model.cid);\n```\n\n## Step 5 – updating the directory view\n\n更新 `scripts/views/directory.js`，在\
    \ `addForm()` 方法开头添加以下代码行：\n\n```\nApp.Browser.navigate('contacts/add');\n```\n\
    \n此外，在现有 `addForm()` 方法之后向目录视图文件添加此新方法：\n\n```\naddFormHide: function() {\n  App.Browser.navigate('contacts');\n\
    \  this.$('.controls form').hide();\n},\n```\n\n请务必将 `addFormHide` 添加到此对象 `initialize()`\
    \ 方法中的 `bindAll()` 调用中：\n\n```\n_.bindAll(this, 'render', 'addForm', 'addSubmit',\
    \ 'addFormHide');\n```\n\n让我们也快速重构一下 `addSubmit()` 方法。将包含 `$form.hide()` 的代码行替换为以下代码行：\n\
    \n```\nthis.addFormHide();\n```\n\n执行这些步骤后，重新加载网页。在应用程序上执行一些不同的操作，例如添加新联系人、删除联系人等。注意\
    \ URL 在您执行不同操作时如何变化。\n"
