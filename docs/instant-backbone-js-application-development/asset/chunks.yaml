    \ `#`（这只是看起来更美观），你将需要寻找服务端解决方案来实现这一点。\n\n### Note\n\n实现此功能的方法将因你为项目选择的后端服务器软件而异。但作为一般规则，你将需要执行相同的页面生成脚本，并使用正则表达式跟踪动态\
    \ URL 规则。Apache 有 `mod_rewrite`。Nginx 有 HTTP location 指令。\n\n## 将数据持久化到服务器\n\n\
    Backbone 最大的特性之一是它能很好地保持后端服务器/数据库与用户交互的前端界面之间的数据同步。Collection 和 Model 是 Backbone\
    \ 的核心部分，如果我们没有后端来持久化数据，那将是一种遗憾！\n\n本节将指导你创建一个简单的基于 **Node.js** 的服务器，我们可以在其中保存联系人。我们在这个项目中使用\
    \ Node 有两个主要原因。第一是因为编程是用 JavaScript 完成的，而你已经懂 JavaScript 了！第二是因为在 Node 中为开发启动服务器非常简单。无需花费数小时调整配置文件和安装包依赖。\n\
    \n### 步骤 1 - 准备工作\n\n下载并安装适用于你操作系统的 Node。你可以从以下 URL 下载 Node 包：\n\n[`nodejs.org/download/`](http://nodejs.org/download/)\n\
    \n接下来，创建一个 `server.js` 文件。该文件应位于项目目录的根目录下。由于浏览器永远不会执行此代码，它不需要遵循我们放在 `scripts`\
