- raw: "*So what is Backbone.js* explains exactly what Backbone.js is for, what sort\
    \ of use cases you would need for it, who uses it, and the requirements.\n\n*Installation*\
    \ will guide you through acquiring the dependencies of Backbone.js, which need\
    \ to be installed before you can use it in your project. This section will have\
    \ you download and install them and set up a simple directory structure.\n\n*Quick\
    \ start – building a Hello World app* provides a simple Hello World message, to\
    \ verify whether the installation has worked properly and our libraries are being\
    \ loaded.\n\n*Top 5 features you need to know about* covers the different classifications\
    \ of code Backbone has to offer, including Models and collections, Views and their\
    \ corresponding templates, Events, URL routing, and Persisting data to a server.\n\
    \n*People and places you should get to know* covers a good community of free resources\
    \ out there that you should be aware of to take your Backbone development skills\
    \ to the next level.\n\nBackbone.js (or simply Backbone) is a frontend JavaScript\
    \ framework for building data-heavy **Single Page Applications** (**SPAs**). You've\
    \ probably heard of different framework patterns, such as **Model-View-Controller**\
    \ (**MVC**), **Model-View-Presenter** (**MVP**), or even **Model-View-ViewModel**\
    \ (**MVVM**), but Backbone follows its own special paradigm. Backbone doesn't\
    \ require files to be structured in your filesystem in any sort of way, but it\
    \ does have suggestions on how your project should structure code.\n\nBackbone\
    \ is most useful when your application uses a database in the backend to persist\
    \ user data, and your frontend application will need to mirror a lot of this data.\
    \ Assuming your data is accessible to your frontend app using a standardized format\
    \ (RESTful JSON-based API over HTTP GET), and data can be persisted using the\
    \ proper HTTP verbs (PUT, POST, and DELETE), working with Backbone to read and\
    \ write data will be a breeze.\n\nWhile running Backbone-based SPAs, your users\
    \ will be interacting with data from the backend in their browser. When they interact\
    \ with the application, they are doing so using Views. A View represents part\
    \ of the **Document Object Model** (**DOM**), and is tied to a Model. When these\
    \ interactions occur, they trigger Events, which update the data in the model.\
    \ Backbone keeps track of these models and, when changes to data happen, it will\
    \ send the data to your web server to be persisted. It also keeps track of changes\
    \ to model data and can update your Views accordingly. This makes the process\
    \ of updating the DOM and sending data to the server seem to be automatic. Instead\
    \ of building several one-off jQuery `$.ajax` calls, a consistent method will\
    \ be used instead.\n\nFirst let's look at the reasons a web developer would want\
    \ to use Backbone for their application. Many web developers begin building websites\
    \ by throwing a bunch of jQuery calls in a single, monolithic JavaScript file.\
    \ These calls do everything from querying the DOM to performing AJAX requests.\
    \ When this happens, a project will usually get out of control and your application\
    \ will be heavily tied to your DOM, which will mean lots of headaches when the\
    \ designer comes up with a new trendy layout. One of the best reasons to use Backbone,\
    \ in my opinion, is that it keeps your code organized. Many large web applications\
    \ have been strangled by spaghetti code and difficulty in maintainability. A properly\
    \ organized Backbone application will not have this pitfall.\n\nIf you do find\
    \ yourself needing to change the DOM queries when a layout changes, they are kept\
    \ together in the same file. If your database column names change and your frontend\
    \ application stops working, changes could be made in a single file to get the\
    \ frontend application compatible with the backend again.\n\nPlenty of websites\
    \ use Backbone for managing their frontend application! Here's a small list of\
    \ popular web applications you've likely heard of to give you a taste:\n\n*  \
    \ Foursquare ([http://www.foursquare.com](http://www.foursquare.com))\n\n*   Basecamp\
    \ calendar ([http://basecamp.com/calendar](http://basecamp.com/calendar))\n\n\
    *   Airbnb ([http://airbnb.com](http://airbnb.com))\n\n*   Stripe ([https://stripe.com](https://stripe.com))\n\
    \n*   Khan Academy ([http://www.khanacademy.org](http://www.khanacademy.org))\n\
    \n*   Pandora ([http://www.pandora.com/newpandora](http://www.pandora.com/newpandora))\n\
    \n*   Copy ([http://www.copy.com](http://www.copy.com))\n\n*   And many more ([http://backbonejs.org/#examples](http://backbonejs.org/#examples))\n\
    \nTo use Backbone.js, you will need at least Backbone itself, a utility library,\
    \ which binds to the global variable `_` (the underscore character), and a selector\
    \ engine, which binds to the global variable `$`. The de facto utility library\
    \ is Underscore.js, and the de facto selector engine is jQuery.\n\nThe purpose\
    \ of a utility library is to make up for some of the shortcomings of JavaScript.\
    \ These libraries provide several functions to make programming faster. One such\
    \ example is the `foreach` function, something you might have missed coming from\
    \ the world of PHP development. The purpose of the selector engine is to provide\
    \ a common method for querying DOM elements. Different browsers implement these\
    \ in different ways, using a couple of different functions, and the results of\
    \ the query aren't always the same. A good selector engine will abstract those\
    \ complexities away from you and give you a single function, which accepts CSS-based\
    \ selectors for performing queries.\n\nSince I like choices, I'll mention some\
    \ alternative libraries, which you can use for this project. LoDash is a drop-in\
    \ replacement for Underscore.js and is faster, while Zepto is a drop-in replacement\
    \ for jQuery and is smaller but doesn't work with Internet Explorer or older browsers.\n\
    \n## Step 1 – what do I need?\n\nYou will want to use a modern web browser while\
    \ following the examples in this book. I recommend installing Google Chrome. It\
    \ is the browser I will be using in my examples, is free, and has an amazing Web\
    \ Inspector (in Apple OS: *Cmd* + *Option* + *I* and in Windows / Linux: *Ctrl*\
    \ + *Shift* + *I*). The following screenshot shows us the opening console:\n\n\
    ![Step 1 – what do I need?](graphics/5668OS_01_01.jpg)\n\nYou will also need the\
    \ following third party scripts:\n\n*   Backbone\n\n*   Underscore or LoDash\n\
    \n*   jQuery or Zepto\n\n## Step 2 – creating a folder\n\nCreate a folder on your\
    \ computer for the project we'll be building with this book.\n\n## Step 3 – downloading\
    \ the necessary files\n\nThe next step is to download the following files:\n\n\
    *   The Backbone framework Backbone.js version 1.0.0 or later \n\n    *   Download\
    \ the file from [http://backbonejs.org/backbone-min.js](http://backbonejs.org/backbone-min.js)\n\
    \n    *   Save the file as `scripts/backbone-1.0.0.js`\n\n*   The utility library\
    \ Underscore.js version 1.4.4 or later or LoDash version 1.3.1 or later \n\n \
    \   *   Download the file from [http://underscorejs.org/underscore-min.js](http://underscorejs.org/underscore-min.js)\n\
    \n    *   Save the file as `scripts/underscore-1.4.4.js`\n\n    *   Or download\
    \ the file from [https://raw.github.com/bestiejs/lodash/master/dist/lodash.min.js](https://raw.github.com/bestiejs/lodash/master/dist/lodash.min.js)\n\
    \n    *   Save the file as `scripts/lodash-1.3.1.js`\n\n*   The selector engine\
    \ jQuery version 1.9.1 or later or Zepto version 1.0 or later \n\n    *   Download\
    \ the file from [http://code.jquery.com/jquery-1.9.1.min.js](http://code.jquery.com/jquery-1.9.1.min.js)\n\
    \n    *   Save the file as `scripts/jquery-1.9.1.js`\n\n    *   Or download the\
    \ file from [http://zeptojs.com/zepto.min.js](http://zeptojs.com/zepto.min.js)\n\
    \n    *   Save the file as `scripts/zepto-1.0.js`\n\n## Step 4 – creating new\
    \ files\n\nOnce you've got these files downloaded to your `scripts` folder within\
    \ the `project` folder, you'll want to create another file inside of that directory\
    \ called `main.js`, which will be where we put our own application-specific scripts."
  fmt: "\n# Backbone.js Introduction\n\n## So what is Backbone.js\n**So what is Backbone.js**\
    \ explains exactly what Backbone.js is for, what sort of use cases you would need\
    \ for it, who uses it, and the requirements.\n\n## Installation\n**Installation**\
    \ will guide you through acquiring the dependencies of Backbone.js, which need\
    \ to be installed before you can use it in your project. This section will have\
    \ you download and install them and set up a simple directory structure.\n\n##\
    \ Quick start – building a Hello World app\n**Quick start – building a Hello World\
    \ app** provides a simple Hello World message, to verify whether the installation\
    \ has worked properly and our libraries are being loaded.\n\n## Top 5 features\
    \ you need to know about\n**Top 5 features you need to know about** covers the\
    \ different classifications of code Backbone has to offer, including Models and\
    \ collections, Views and their corresponding templates, Events, URL routing, and\
    \ Persisting data to a server.\n\n## People and places you should get to know\n\
    **People and places you should get to know** covers a good community of free resources\
    \ out there that you should be aware of to take your Backbone development skills\
    \ to the next level.\n\n## Overview\n`Backbone.js` (or simply `Backbone`) is a\
    \ frontend JavaScript framework for building data-heavy **Single Page Applications**\
    \ (**SPAs**). You've probably heard of different framework patterns, such as **Model-View-Controller**\
    \ (**MVC**), **Model-View-Presenter** (**MVP**), or even **Model-View-ViewModel**\
    \ (**MVVM**), but Backbone follows its own special paradigm. Backbone doesn't\
    \ require files to be structured in your filesystem in any sort of way, but it\
    \ does have suggestions on how your project should structure code.\n\nBackbone\
    \ is most useful when your application uses a database in the backend to persist\
    \ user data, and your frontend application will need to mirror a lot of this data.\
    \ Assuming your data is accessible to your frontend app using a standardized format\
    \ (RESTful JSON-based API over HTTP GET), and data can be persisted using the\
    \ proper HTTP verbs (PUT, POST, and DELETE), working with Backbone to read and\
    \ write data will be a breeze.\n\nWhile running Backbone-based SPAs, your users\
    \ will be interacting with data from the backend in their browser. When they interact\
    \ with the application, they are doing so using Views. A View represents part\
    \ of the **Document Object Model** (**DOM**), and is tied to a Model. When these\
    \ interactions occur, they trigger Events, which update the data in the model.\
    \ Backbone keeps track of these models and, when changes to data happen, it will\
    \ send the data to your web server to be persisted. It also keeps track of changes\
    \ to model data and can update your Views accordingly. This makes the process\
    \ of updating the DOM and sending data to the server seem to be automatic. Instead\
    \ of building several one-off jQuery `$.ajax` calls, a consistent method will\
    \ be used instead.\n\n## Why Use Backbone?\nFirst let's look at the reasons a\
    \ web developer would want to use Backbone for their application. Many web developers\
    \ begin building websites by throwing a bunch of jQuery calls in a single, monolithic\
    \ JavaScript file. These calls do everything from querying the DOM to performing\
    \ AJAX requests. When this happens, a project will usually get out of control\
    \ and your application will be heavily tied to your DOM, which will mean lots\
    \ of headaches when the designer comes up with a new trendy layout. One of the\
    \ best reasons to use Backbone, in my opinion, is that it keeps your code organized.\
    \ Many large web applications have been strangled by spaghetti code and difficulty\
    \ in maintainability. A properly organized Backbone application will not have\
    \ this pitfall.\n\nIf you do find yourself needing to change the DOM queries when\
    \ a layout changes, they are kept together in the same file. If your database\
    \ column names change and your frontend application stops working, changes could\
    \ be made in a single file to get the frontend application compatible with the\
    \ backend again.\n\n## Who Uses Backbone?\nPlenty of websites use Backbone for\
    \ managing their frontend application! Here's a small list of popular web applications\
    \ you've likely heard of to give you a taste:\n\n*   Foursquare ([http://www.foursquare.com](http://www.foursquare.com))\n\
    *   Basecamp calendar ([http://basecamp.com/calendar](http://basecamp.com/calendar))\n\
    *   Airbnb ([http://airbnb.com](http://airbnb.com))\n*   Stripe ([https://stripe.com](https://stripe.com))\n\
    *   Khan Academy ([http://www.khanacademy.org](http://www.khanacademy.org))\n\
    *   Pandora ([http://www.pandora.com/newpandora](http://www.pandora.com/newpandora))\n\
    *   Copy ([http://www.copy.com](http://www.copy.com))\n*   And many more ([http://backbonejs.org/#examples](http://backbonejs.org/#examples))\n\
    \n## Dependencies\nTo use Backbone.js, you will need at least `Backbone` itself,\
    \ a utility library, which binds to the global variable `_` (the underscore character),\
    \ and a selector engine, which binds to the global variable `$`. The de facto\
    \ utility library is `Underscore.js`, and the de facto selector engine is `jQuery`.\n\
    \nThe purpose of a utility library is to make up for some of the shortcomings\
    \ of JavaScript. These libraries provide several functions to make programming\
    \ faster. One such example is the `foreach` function, something you might have\
    \ missed coming from the world of PHP development. The purpose of the selector\
    \ engine is to provide a common method for querying DOM elements. Different browsers\
    \ implement these in different ways, using a couple of different functions, and\
    \ the results of the query aren't always the same. A good selector engine will\
    \ abstract those complexities away from you and give you a single function, which\
    \ accepts CSS-based selectors for performing queries.\n\nSince I like choices,\
    \ I'll mention some alternative libraries, which you can use for this project.\
    \ `LoDash` is a drop-in replacement for `Underscore.js` and is faster, while `Zepto`\
    \ is a drop-in replacement for `jQuery` and is smaller but doesn't work with Internet\
    \ Explorer or older browsers.\n\n## Step 1 – what do I need?\nYou will want to\
    \ use a modern web browser while following the examples in this book. I recommend\
    \ installing Google Chrome. It is the browser I will be using in my examples,\
    \ is free, and has an amazing Web Inspector (in Apple OS: `Cmd` + `Option` + `I`\
    \ and in Windows / Linux: `Ctrl` + `Shift` + `I`). The following screenshot shows\
    \ us the opening console:\n\n![Step 1 – what do I need?](graphics/5668OS_01_01.jpg)\n\
    \nYou will also need the following third party scripts:\n\n*   `Backbone`\n* \
    \  `Underscore` or `LoDash`\n*   `jQuery` or `Zepto`\n\n## Step 2 – creating a\
    \ folder\nCreate a folder on your computer for the project we'll be building with\
    \ this book.\n\n## Step 3 – downloading the necessary files\nThe next step is\
    \ to download the following files:\n\n*   The Backbone framework `Backbone.js`\
    \ version 1.0.0 or later \n    *   Download the file from [http://backbonejs.org/backbone-min.js](http://backbonejs.org/backbone-min.js)\n\
    \    *   Save the file as `scripts/backbone-1.0.0.js`\n*   The utility library\
    \ `Underscore.js` version 1.4.4 or later or `LoDash` version 1.3.1 or later \n\
    \    *   Download the file from [http://underscorejs.org/underscore-min.js](http://underscorejs.org/underscore-min.js)\n\
    \    *   Save the file as `scripts/underscore-1.4.4.js`\n    *   Or download the\
    \ file from [https://raw.github.com/bestiejs/lodash/master/dist/lodash.min.js](https://raw.github.com/bestiejs/lodash/master/dist/lodash.min.js)\n\
    \    *   Save the file as `scripts/lodash-1.3.1.js`\n*   The selector engine `jQuery`\
    \ version 1.9.1 or later or `Zepto` version 1.0 or later \n    *   Download the\
    \ file from [http://code.jquery.com/jquery-1.9.1.min.js](http://code.jquery.com/jquery-1.9.1.min.js)\n\
    \    *   Save the file as `scripts/jquery-1.9.1.js`\n    *   Or download the file\
    \ from [http://zeptojs.com/zepto.min.js](http://zeptojs.com/zepto.min.js)\n  \
    \  *   Save the file as `scripts/zepto-1.0.js`\n\n## Step 4 – creating new files\n\
    Once you've got these files downloaded to your `scripts` folder within the `project`\
    \ folder, you'll want to create another file inside of that directory called `main.js`,\
    \ which will be where we put our own application-specific scripts.\n"
  trans: "\n# Backbone.js 简介\n\n## 什么是 Backbone.js\n**什么是 Backbone.js** 将详细解释 Backbone.js\
    \ 的用途、适用场景、用户群体及环境要求。\n\n## 安装\n**安装** 将指导您获取 Backbone.js 的依赖项，这些依赖项必须在您的项目中使用\
    \ Backbone.js 之前安装。本节将让您下载并安装它们，并建立一个简单的目录结构。\n\n## 快速入门 – 构建一个 Hello World 应用\n\
    **快速入门 – 构建一个 Hello World 应用** 提供一个简单的 Hello World 消息，以验证安装是否正常工作以及库是否已正确加载。\n\
    \n## 您需要了解的 5 大核心特性\n**您需要了解的 5 大核心特性** 涵盖了 Backbone 提供的不同代码分类，包括模型和集合、视图及其对应的模板、事件、URL\
    \ 路由，以及将数据持久化到服务器。\n\n## 您应该了解的社区资源\n**您应该了解的社区资源** 涵盖了优秀的免费社区资源，您应了解这些资源以将您的\
    \ Backbone 开发技能提升到新的高度。\n\n## 概述\n`Backbone.js`（或简称为 `Backbone`）是一个用于构建数据密集型 **单页应用**\
    \ (**SPA**) 的前端 JavaScript 框架。您可能听说过不同的框架模式，例如 **模型-视图-控制器** (**MVC**)、**模型-视图-展示器**\
    \ (**MVP**)，甚至 **模型-视图-视图模型** (**MVVM**)，但 Backbone 遵循其自身独特的范式。Backbone 不要求以任何特定方式在文件系统中构建文件结构，但它确实对项目如何组织代码结构有建议。\n\
    \n当您的应用程序使用后端数据库来持久化用户数据，且前端应用程序需要镜像大量此类数据时，Backbone 最为有用。假设您的数据可通过标准化格式（基于 HTTP\
    \ GET 的 RESTful JSON API）被前端应用访问，且数据可使用适当的 HTTP 动词（PUT、POST 和 DELETE）进行持久化，那么使用\
    \ Backbone 读写数据将轻而易举。\n\n在运行基于 Backbone 的 SPA 时，用户将在浏览器中与来自后端的数据进行交互。当他们与应用程序交互时，是通过视图进行的。视图代表\
    \ **文档对象模型** (**DOM**) 的一部分，并与模型关联。当这些交互发生时，它们会触发事件，从而更新模型中的数据。Backbone 会跟踪这些模型，当数据发生变化时，它会将数据发送到您的\
    \ Web 服务器以进行持久化。它还会跟踪模型数据的变化，并相应地更新您的视图。这使得更新 DOM 和向服务器发送数据的过程看起来是自动的。您无需编写多个一次性的\
    \ jQuery `$.ajax` 调用，而是将使用一种统一的方法。\n\n## 为什么要使用 Backbone？\n首先，让我们看看 Web 开发者想要在其应用程序中使用\
    \ Backbone 的原因。许多 Web 开发者开始构建网站时，会将大量 jQuery 调用塞进一个单一的、整体的 JavaScript 文件中。这些调用处理从查询\
    \ DOM 到执行 AJAX 请求的所有事情。当这种情况发生时，项目通常会失控，您的应用程序将严重依赖 DOM，这意味着当设计师提出新的时髦布局时，您将面临诸多烦恼。依我之见，使用\
    \ Backbone 最好的理由之一是它能保持您的代码井然有序。许多大型 Web 应用程序都因面条代码和维护困难而陷入瘫痪。一个组织得当的 Backbone\
    \ 应用程序不会陷入这一陷阱。\n\n如果您确实发现需要在布局变更时更改 DOM 查询，它们会被保存在同一个文件中。如果您的数据库列名发生变化导致前端应用程序停止工作，只需在单个文件中进行更改即可使前端应用程序再次与后端兼容。\n\
    \n## 谁在使用 Backbone？\n许多网站都使用 Backbone 来管理其前端应用程序！以下是一小部分您可能听说过的流行 Web 应用程序列表，供您参考：\n\
    \n*   Foursquare ([`www.foursquare.com`](http://www.foursquare.com))\n*   Basecamp\
    \ 日历 ([`basecamp.com/calendar`](http://basecamp.com/calendar))\n*   Airbnb ([`airbnb.com`](http://airbnb.com))\n\
    *   Stripe ([`stripe.com`](https://stripe.com))\n*   可汗学院 ([`www.khanacademy.org`](http://www.khanacademy.org))\n\
    *   Pandora ([`www.pandora.com/newpandora`](http://www.pandora.com/newpandora))\n\
    *   Copy ([`www.copy.com`](http://www.copy.com))\n*   以及更多 ([`backbonejs.org/#examples`](http://backbonejs.org/#examples))\n\
    \n## 依赖项\n要使用 Backbone.js，您至少需要 `Backbone` 本身、一个绑定到全局变量 `_`（下划线字符）的实用工具库，以及一个绑定到全局变量\
    \ `$` 的选择器引擎。事实上的标准实用工具库是 `Underscore.js`，事实上的标准选择器引擎是 `jQuery`。\n\n实用工具库的目的是弥补\
    \ JavaScript 的一些不足。这些库提供了多种函数以加快编程速度。一个例子是 `foreach` 函数，如果您从 PHP 开发转行过来，可能会怀念这个函数。选择器引擎的目的是提供一种通用的方法来查询\
    \ DOM 元素。不同的浏览器使用不同的函数以不同的方式实现这些功能，且查询结果并不总是相同。一个好的选择器引擎会为您隐藏这些复杂性，并提供一个接受基于 CSS\
    \ 选择器的单一函数来执行查询。\n\n既然我喜欢提供选择，我将提及一些可用于此项目的替代库。`LoDash` 是 `Underscore.js` 的直接替代品且速度更快，而\
    \ `Zepto` 是 `jQuery` 的直接替代品且体积更小，但不支持 Internet Explorer 或旧版浏览器。\n\n## 步骤 1 – 我需要什么？\n\
    在学习本书示例时，您需要使用现代 Web 浏览器。我推荐安装 Google Chrome。它是我示例中使用的浏览器，免费且拥有强大的 Web 检查器（在 Apple\
    \ OS 中：`Cmd` + `Option` + `I`，在 Windows/Linux 中：`Ctrl` + `Shift` + `I`）。以下屏幕截图显示了打开的控制台：\n\
    \n![步骤 1 – 我需要什么？](img/5668OS_01_01.jpg)\n\n您还需要以下第三方脚本：\n\n*   `Backbone`\n*\
    \   `Underscore` 或 `LoDash`\n*   `jQuery` 或 `Zepto`\n\n## 步骤 2 – 创建文件夹\n在您的计算机上创建一个文件夹，用于存放我们将通过本书构建的项目。\n\
    \n## 步骤 3 – 下载必要文件\n下一步是下载以下文件：\n\n*   Backbone 框架 `Backbone.js` 1.0.0 版或更高版本\n\
    \    *   从 [`backbonejs.org/backbone-min.js`](http://backbonejs.org/backbone-min.js)\
    \ 下载文件\n    *   将文件保存为 `scripts/backbone-1.0.0.js`\n*   实用工具库 `Underscore.js`\
    \ 1.4.4 版或更高版本，或 `LoDash` 1.3.1 版或更高版本\n    *   从 [`underscorejs.org/underscore-min.js`](http://underscorejs.org/underscore-min.js)\
    \ 下载文件\n    *   将文件保存为 `scripts/underscore-1.4.4.js`\n    *   或从 [`raw.github.com/bestiejs/lodash/master/dist/lodash.min.js`](https://raw.github.com/bestiejs/lodash/master/dist/lodash.min.js)\
    \ 下载文件\n    *   将文件保存为 `scripts/lodash-1.3.1.js`\n*   选择器引擎 `jQuery` 1.9.1 版或更高版本，或\
    \ `Zepto` 1.0 版或更高版本\n    *   从 [`code.jquery.com/jquery-1.9.1.min.js`](http://code.jquery.com/jquery-1.9.1.min.js)\
    \ 下载文件\n    *   将文件保存为 `scripts/jquery-1.9.1.js`\n    *   或从 [`zeptojs.com/zepto.min.js`](http://zeptojs.com/zepto.min.js)\
    \ 下载文件\n    *   将文件保存为 `scripts/zepto-1.0.js`\n\n## 步骤 4 – 创建新文件\n将这些文件下载到 `project`\
    \ 文件夹内的 `scripts` 文件夹后，您需要在该目录下创建另一个名为 `main.js` 的文件，我们将把特定于应用程序的脚本放在那里。\n"
