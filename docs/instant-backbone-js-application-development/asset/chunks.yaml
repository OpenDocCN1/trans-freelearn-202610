    \ identified as `#template-contact` (the `<script>` tag we added earlier), then\
    \ grabbing the HTML contained within it. We then pass this HTML to the `_.template`\
    \ method, which parses the string and performs some work on it, sort of compiling\
    \ the template. This way, the CPU-expensive calculation is done once and we can\
    \ use it later.\n\nThe `$container` attribute will point to the element that our\
    \ Contact views will live inside of. This isn't a Backbone convention, just a\
    \ convenience method.\n\n```\n  initialize: function(options) {\n    _.bindAll(this,\
    \ 'render', 'insert');\n\n    this.$container = options.$container;\n\n    this.listenTo(this.model,\
    \ 'change', this.render);\n    this.insert();\n  },\n```\n\nThe `initialize()`\
    \ method is run every time this view is instantiated, and therefore resembles\
    \ a constructor in many class-based languages. One is able to pass in extra parameters\
    \ when instantiating the class. As you can see in the preceding code, we're referring\
    \ to this argument as `options`, although that isn't necessarily a Backbone convention.\n\
    \nThe `_.bindAll()` method is a convenience function for quickly specifying a\
    \ bunch of other methods of this object we would like to overwrite. The preceding\
    \ code will rebind `this` to refer to the entire View object, instead of just\
    \ the local method it is being used in (either `render()` or `insert()`).\n\n\
    One of the options we pass into our View objects is the containing element that\
    \ they should be added to, so we take this element and assign it to our class\
    \ as `$container` and refer to it later.\n\nThe line where we call `listenTo()`\
    \ is where the real magic starts to happen. When instantiating a View, we can\
    \ pass in a `model` attribute, which is then assigned as the model for that view\
    \ (Backbone handles this assignment for us; we don't have to do it manually in\
    \ the `initialize` method). The View then adds an event handler to the model so\
    \ that whenever the data of that model is updated, the View is notified and the\
    \ `render()` method is executed. This is extremely useful and prevents us from\
    \ having to write ad-hoc DOM-updating code everywhere we have the possibility\
    \ of updating data.\n\nAfter that, we run the `insert()` method, which will insert\
    \ our element into our container. We don't do this in the `render()` method, since\
    \ we don't want to keep inserting our element into the container unnecessarily!\n\
    \n```\n  render: function() {\n    this.$el.html(this.template(this.model.attributes));\n\
    \n    return this;\n  },\n```\n\nThis is the `render()` method, and is a convention\
    \ of Backbone. It is executed every time we want our View to update its DOM element.\
    \ In our example, we simply take our models attributes (remember inspecting it\
    \ earlier and seeing it is where the data is stored in the model), pass it to\
    \ the locally cached template, get the resulting HTML, and assign it to the `$el`\
    \ attribute on our View object. `$el` is a Backbone convention for storing a reference\
    \ to the current Views DOM element. Lastly we return a reference to the object\
    \ to make chaining easier.\n\n```\n  insert: function() {\n    this.$container.append(this.$el);\n\
    \  }\n```\n\nThis code simply appends our element to the containing element. If\
    \ we ran this code every single time we ran `render()`, our elements would continually\
    \ bounce out of order.\n\nNext we shift our attention to `scripts/views/directory.js`.\
    \ This code is related to our main application view.\n\n```\nApp.Views.Directory\
    \ = Backbone.View.extend({\n  initialize: function() {\n    _.bindAll(this, 'render');\n\
    \  },\n```\n\nThis should all be self-explanatory. We extend the Backbone view\
    \ object and have an `initialize` function that just handles binding the `this`\
    \ variable.\n\n```\n  render: function() {\n    var $container = this.$('.listing').empty();\n\
    ```\n\nThe first thing our `render()` method does in this view is clear out the\
    \ existing elements. The first time this function is run it will remove our `Houston`,\
    \ `we have a problem` text. Subsequent calls will remove the individual contact\
    \ views markup.\n\n```\n    App.Contacts.each(function(contact) {\n      new App.Views.Contact({\n\
    \        model: contact,\n        $container: $container\n      }).render();\n\
    \    });\n```\n\nThis code takes our Contact collection and iterates over each\
    \ individual contact. While doing so, we instantiate a new View for said contact.\
    \ The `model` attribute we pass in is the model we are iterating on from the Collection.\
    \ We also pass in a reference to this view's main element, which is to be the\
    \ `$container` for our subviews.\n\nOnce our Views are instantiated, we immediately\
    \ run their `render()` method, and they become visible in the DOM.\n\nWe will\
    \ next have a look at `scripts/main.js`. These changes give us a nicer way to\
    \ iterate over contacts and display them in the DOM.\n\n```\nvar App = {\n  Models:\
    \ {},\n  Collections: {},\n  Views: {},\n  Contacts: null,\n  Directory: null\n\
    };\n```\n"
  trans: "\n\n## 步骤 4 – 更新文档\n\n将以下代码添加到 `index.html` 中，位于现有的 `<div>` 标签之后：\n\n```\n\
    <script id=\"template-contact\" type=\"template\">\n  <div class=\"contact\">\n\
    \    <h2><%-firstName%><% if (lastName) { %> <%-lastName%><% } %></h2>\n    <a\
    \ href=\"mailto:<%-email%>\"><%-email%></a><br />\n    <a href=\"tel:<%-phoneNumber%>\"\
    ><%-phoneNumber%></a><br />\n    <button class=\"delete\">Delete</button>\n  </div>\n\
    </script>\n```\n\n此外，将以下代码添加到 `index.html` 中，位于结束标签 `</body>` 之后现有的 `<script>`\
    \ 标签之后：\n\n```\n<script src=\"scripts/views/contact.js\"></script>\n<script src=\"\
    scripts/views/directory.js\"></script>\n```\n\n## 步骤 5 – 更新主脚本\n\n更新 `main.js`\
    \ 中的 `App` 对象，使其如下所示：\n\n```\nvar App = {\n  Models: {},\n  Collections: {},\n\
    \  Views: {},\n  Contacts: null,\n  Directory: null\n};\n```\n\n另外，在 `main.js`\
    \ 中，移除添加空联系人的代码，以及遍历联系人并将它们显示在 DOM 中的代码。\n\n用以下新代码替换这些代码：\n\n```\n  App.Directory\
    \ = new App.Views.Directory({\n    el: $('#display')\n  });\n\n  App.Directory.render();\n\
    \n  App.Contacts.on('add remove', function() {\n    App.Directory.render();\n\
    \  });\n```\n\n## 步骤 6 – 刷新浏览器\n\n添加完所有新代码后，回到浏览器并刷新页面。你应该会看到类似下面截图的内容：\n\n![步骤\
    \ 6 – 刷新浏览器](img/5668OS_04_03.jpg)\n\n正如你所见，尽管我们只有一个 Collection 和一个 Model，但现在这个应用程序中已经使用了两个\
    \ View。在你的 Backbone 应用程序中，这种情况会经常发生；不同类型的类之间不一定存在一对一的映射关系。在我们的代码中，Directory View\
    \ 代表我们的主应用程序视图。它将始终代表单个元素，该元素将始终存在于页面中。然而，Contact View 可能根本不存在，也可能存在多个。\n\n我们再次详细查看代码。首先让我们看看\
    \ `scripts/views/contact.js`。这段代码与我们单个的 Contact View 相关。\n\n```\nApp.Views.Contact\
    \ = Backbone.View.extend({\n```\n\n同样，我们首先扩展相应的内置 Backbone 对象。\n\n```\n  template:\
    \ _.template($('#template-contact').html()),\n  $container: null,\n```\n\n`template`\
    \ 属性是用于存储模板对象的 Backbone 惯例。在这种情况下，你可以看到我们正在 DOM 中搜索一个标识为 `#template-contact` 的元素（即我们之前添加的\
    \ `<script>` 标签），然后获取其中包含的 HTML。接着我们将此 HTML 传递给 `_.template` 方法，该方法会解析字符串并对其进行一些处理，有点像编译模板。这样，消耗\
    \ CPU 的计算只需执行一次，我们稍后就可以重复使用它。\n\n`$container` 属性将指向我们的 Contact View 所在的容器元素。这不是\
    \ Backbone 惯例，只是一个方便的方法。\n\n```\n  initialize: function(options) {\n    _.bindAll(this,\
    \ 'render', 'insert');\n\n    this.$container = options.$container;\n\n    this.listenTo(this.model,\
    \ 'change', this.render);\n    this.insert();\n  },\n```\n\n每次实例化此视图时都会运行 `initialize()`\
    \ 方法，因此它类似于许多基于类的语言中的构造函数。实例化类时可以传入额外参数。正如你在前面的代码中所见，我们将此参数称为 `options`，尽管这不一定是\
    \ Backbone 惯例。\n\n`_.bindAll()` 方法是一个便捷函数，用于快速指定我们希望重新绑定的该对象的其他方法。前面的代码将 `this`\
    \ 重新绑定为指向整个 View 对象，而不是仅指向正在使用它的局部方法（`render()` 或 `insert()`）。\n\n我们传入 View 对象的选项之一是它们应被添加到的容器元素，因此我们获取此元素并将其作为\
    \ `$container` 分配给我们的类，以便稍后引用。\n\n调用 `listenTo()` 的那一行是真正神奇之处的开始。实例化 View 时，我们可以传入一个\
    \ `model` 属性，该属性随后会被分配为该视图的模型（Backbone 会自动处理此分配；我们不必在 `initialize` 方法中手动执行）。然后，View\
    \ 会向模型添加一个事件处理程序，以便每当该模型的数据更新时，View 都会收到通知并执行 `render()` 方法。这非常有用，避免了我们在每个可能更新数据的地方都编写临时的\
    \ DOM 更新代码。\n\n之后，我们运行 `insert()` 方法，它会将我们的元素插入到容器中。我们不在 `render()` 方法中执行此操作，因为我们不想不必要地反复将元素插入容器中！\n\
    \n```\n  render: function() {\n    this.$el.html(this.template(this.model.attributes));\n\
    \n    return this;\n  },\n```\n\n这是 `render()` 方法，是 Backbone 的一项惯例。每当我们希望 View\
    \ 更新其 DOM 元素时，就会执行此方法。在我们的示例中，我们只需获取模型的属性（还记得之前检查过它吗？那是存储模型数据的地方），将其传递给本地缓存的模板，获取生成的\
    \ HTML，并将其赋值给 View 对象上的 `$el` 属性。`$el` 是用于存储当前 View 的 DOM 元素引用的 Backbone 惯例。最后我们返回对象引用以便于链式调用。\n\
    \n```\n  insert: function() {\n    this.$container.append(this.$el);\n  }\n```\n\
    \n这段代码只是将我们的元素追加到容器元素中。如果我们每次运行 `render()` 都运行这段代码，我们的元素会不断地乱序跳动。\n\n接下来我们将注意力转移到\
    \ `scripts/views/directory.js`。这段代码与我们的主应用程序视图相关。\n\n```\nApp.Views.Directory\
    \ = Backbone.View.extend({\n  initialize: function() {\n    _.bindAll(this, 'render');\n\
    \  },\n```\n\n这些都应该是不言自明的。我们扩展 Backbone View 对象，并有一个仅处理绑定 `this` 变量的 `initialize`\
    \ 函数。\n\n```\n  render: function() {\n    var $container = this.$('.listing').empty();\n\
    ```\n\n此视图中的 `render()` 方法做的第一件事是清空现有元素。第一次运行此函数时，它将移除我们的 `Houston, we have a\
    \ problem` 文本。后续调用将移除各个联系人视图的标记。\n\n```\n    App.Contacts.each(function(contact)\
    \ {\n      new App.Views.Contact({\n        model: contact,\n        $container:\
    \ $container\n      }).render();\n    });\n```\n\n这段代码获取我们的 Contact Collection\
    \ 并遍历每个单独的联系人。在此过程中，我们为该联系人实例化一个新的 View。我们传入的 `model` 属性是我们从 Collection 中遍历出的模型。我们还传入了对该视图主元素的引用，它将作为我们子视图的\
    \ `$container`。\n\n一旦我们的 View 被实例化，我们立即运行它们的 `render()` 方法，它们就会在 DOM 中变得可见。\n\n\
    接下来我们将查看 `scripts/main.js`。这些更改为我们提供了一种更好的方式来遍历联系人并将它们显示在 DOM 中。\n\n```\nvar App\
    \ = {\n  Models: {},\n  Collections: {},\n  Views: {},\n  Contacts: null,\n  Directory:\
    \ null\n};\n```\n\n"
