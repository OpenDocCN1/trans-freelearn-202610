- raw: "Now, click on the button to add a new contact and, while the form is displayed,\
    \ completely refresh the page. Or better yet, copy the URL, close your browser\
    \ window, then open the URL in another fresh browser window. Notice how the add\
    \ contact form is displayed while the page is loaded! While our application is\
    \ fairly simple, this will allow sharing our URLs as well as bookmarking URLs.\n\
    \nLet us first look at `scripts/router.js`:\n\n```\nApp.Routers.Contact = Backbone.Router.extend({\n\
    ```\n\nWe begin by extending the built-in Backbone router object.\n\n```\n  routes:\
    \ {\n    'contacts': 'contacts',\n    'contacts/add': 'contactsAdd',\n    'contacts/remove/:id':\
    \ 'contactsRemove'\n  },\n```\n\nHere we've defined three different routes. The\
    \ first route is executed when the URL simply states contacts. Since we're using\
    \ anchor-based URLs, the URL will say `index.html#contacts`. Had this been using\
    \ a web server, the URL would be `example.com/#contacts`. Had we been using a\
    \ web server as well as the `pushState` URLs, the URL would be `example.com/contacts`\
    \ and would resemble a traditional web page request.\n\nThe value of the router\
    \ is the name of the method on our object to be executed (much as with our events\
    \ object in the View objects).\n\nThe interesting one here is the third route.\
    \ Notice the third URL parameter, `id`. This tells Backbone that we're expecting\
    \ some sort of string in this part of the URL (basically any characters except\
    \ for another forward slash). If you did want to include slashes, you can prefix\
    \ the identifier with an asterisk, such as `*id`. The names you choose for identifiers\
    \ in these dynamic routes don't matter much, as they are passed as arguments to\
    \ the router methods in the order that they appear in. Name them something that\
    \ you will remember, though.\n\n```\n  contacts: function() {\n    App.Directory.render();\n\
    \    App.Directory.addFormHide();\n  },\n```\n\nThe `contacts()` router method\
    \ (executed when the URL matches `contacts`) is used for showing a listing of\
    \ contacts. It will render our Directory again and perform a sort of page refresh\
    \ for us. It will also hide the add form, if it were open. Think of this as the\
    \ default state of the application. If the application performed several other\
    \ functions, we would use this to bring the user back to the contacts listing.\n\
    \n```\n  contactsAdd: function() {\n    App.Directory.addForm();\n  },\n```\n\n\
    The `contactsAdd()` router method (executed when the URL matches `contacts/add`)\
    \ is used for showing the **Add New Contact** form.\n\n```\n  contactsRemove:\
    \ function(id) {\n    App.Contacts.remove(id);\n    App.Directory.addFormHide();\n\
    \  }\n```\n\nThe `contactsRemove()` router method (executed when the URL matches\
    \ `contacts/remove/:id`) is used for performing a remove on the specified contact.\
    \ The name of our first argument is `id`, and is coincidentally the same as the\
    \ identifier used in our dynamic route. Either of these could have been named\
    \ something else and the code would still execute as expected. This code executes\
    \ the Contact models `remove()` method as expected, and hides the contact add\
    \ form if it was open.\n\n```\nscripts/main.js:\nvar App = {\n  …,\n  Routers:\
    \ {},\n  Browser: null\n};\n```\n\nThe `Routers` object we added to the main `App`\
    \ object will contain a listing of different routers we use in the application.\
    \ If your application were to get much more complicated, it wouldn't be a bad\
    \ idea to keep different components separated in this manner.\n\nThe `Browser`\
    \ object will contain our instantiated Contact router. Currently the application\
    \ is rather simple and having a single global pointer makes it convenient to work\
    \ with.\n\nWe will now take a look at `scripts/views/contact.js`:\n\n```\n   \
    \ App.Browser.navigate('contacts/remove/' + this.model.cid);\n```\n\nThis line\
    \ of code is executed when the remove button is clicked. It updates the URL so\
    \ that it shows which item is being deleted. However, simply running this code\
    \ does not cause the applicable route to be updated. If we wanted to do that,\
    \ we would need to pass a second argument to `navigate()`, and it looks like this:\n\
    \n```\n{trigger: true}\n```\n\nThe reason we don't need to pass that second argument\
    \ is because we're already going to be running the Model destroy code on the next\
    \ line. However, if the document ever contains a link such as the following, it\
    \ will trigger the router deletion:\n\n```\n<a href=\"#contacts/remove/c1\">Delete\
    \ First Contact</a>\n```\n\nWe will also take a look at `scripts/views/directory.js`\n\
    \n```\n    App.Browser.navigate('contacts/add');\n```\n\nThis of course changes\
    \ our URL for the Add Contact form. If someone only ever goes to our application\
    \ for the purpose of quickly adding new contacts, this URL becomes very convenient\
    \ for them.\n\n```\n  addFormHide: function() {\n    App.Browser.navigate('contacts');\n\
    \    this.$('.controls form').hide();\n  },\n```\n\nHere we've refactored the\
    \ code a little. Now that we've added the concept of a router, the need to toggle\
    \ the visibility of the Add Contact form from elsewhere is important. We update\
    \ the call in `addSubmit()` later to use this new function to complete the refactor.\n\
    \nChanging the URL anchor dynamically is good enough to allow the user to bookmark\
    \ pages, share pages with friends, and navigate through history using their browser's\
    \ forward and back buttons. However, if you want to get rid of the anchor symbol\
    \ `#` (this simply looks nicer) you will need to look into a server-side solution\
    \ to achieve this.\n\n### Note\n\nThe method for this will be different depending\
    \ on the backend server software you choose for your project. As a general rule,\
    \ though, you'll want to execute the same page generation script and keep track\
    \ of dynamic URL rules using regular expressions. Apache has `mod_rewrite`. Nginx\
    \ has the HTTP location directive.\n\n## Persisting data to a server\n\nOne of\
    \ the biggest features of Backbone is how well it keeps data in synchronization\
    \ between your backend server / database, and the frontend interface that your\
    \ user is interacting with. Collections and Models are such a big part of Backbone\
    \ that it would be a shame if we didn't have a backend to persist our data to!\n\
    \nThis section of the book will have you create a simple **Node.js** based server\
    \ in which we can save our contacts. There are two big reasons we're going to\
    \ use Node for this project. The first is because programming is done in JavaScript,\
    \ and you already know JavaScript! The second is that starting a server in Node\
    \ for development is extremely simple. No need to spend hours tweaking configuration\
    \ files and installing package dependencies.\n\n### Step 1 – getting ready\n\n\
    Download and install Node for your operating system. You can download a Node package\
    \ from the following URL:\n\n[http://nodejs.org/download/](http://nodejs.org/download/)\n\
    \nNext, create a `server.js` file. This file should sit in the root of your project\
    \ directory. Since the browser will never execute this code, it doesn't need to\
    \ follow our convention of living inside of the `scripts` directory. In fact,\
    \ it shouldn't follow the convention at all, otherwise one could get confused\
    \ about the purpose of the script. You also will not need to load it using a `<script>`\
    \ tag in our HTML file.\n\n### Step 2 – creating a server script\n\nAdd the following\
    \ code to `server.js`. I won't be explaining the code line-by-line, like with\
    \ the other code we've written, as it is beyond the scope of this book:"
  fmt: "\nNow, click on the button to add a new contact and, while the form is displayed,\
    \ completely refresh the page. Or better yet, copy the URL, close your browser\
    \ window, then open the URL in another fresh browser window. Notice how the add\
    \ contact form is displayed while the page is loaded! While our application is\
    \ fairly simple, this will allow sharing our URLs as well as bookmarking URLs.\n\
    \n## `scripts/router.js`\n\nLet us first look at `scripts/router.js`:\n\n```\n\
    App.Routers.Contact = Backbone.Router.extend({\n```\n\nWe begin by extending the\
    \ built-in `Backbone.Router` object.\n\n```\n  routes: {\n    'contacts': 'contacts',\n\
    \    'contacts/add': 'contactsAdd',\n    'contacts/remove/:id': 'contactsRemove'\n\
    \  },\n```\n\nHere we've defined three different routes. The first route is executed\
    \ when the URL simply states `contacts`. Since we're using anchor-based URLs,\
    \ the URL will say `index.html#contacts`. Had this been using a web server, the\
    \ URL would be `example.com/#contacts`. Had we been using a web server as well\
    \ as the `pushState` URLs, the URL would be `example.com/contacts` and would resemble\
    \ a traditional web page request.\n\nThe value of the router is the name of the\
    \ method on our object to be executed (much as with our events object in the View\
    \ objects).\n\nThe interesting one here is the third route. Notice the third URL\
    \ parameter, `id`. This tells Backbone that we're expecting some sort of string\
    \ in this part of the URL (basically any characters except for another forward\
    \ slash). If you did want to include slashes, you can prefix the identifier with\
    \ an asterisk, such as `*id`. The names you choose for identifiers in these dynamic\
    \ routes don't matter much, as they are passed as arguments to the router methods\
    \ in the order that they appear in. Name them something that you will remember,\
    \ though.\n\n```\n  contacts: function() {\n    App.Directory.render();\n    App.Directory.addFormHide();\n\
    \  },\n```\n\nThe `contacts()` router method (executed when the URL matches `contacts`)\
    \ is used for showing a listing of contacts. It will render our `Directory` again\
    \ and perform a sort of page refresh for us. It will also hide the add form, if\
    \ it were open. Think of this as the default state of the application. If the\
    \ application performed several other functions, we would use this to bring the\
    \ user back to the contacts listing.\n\n```\n  contactsAdd: function() {\n   \
    \ App.Directory.addForm();\n  },\n```\n\nThe `contactsAdd()` router method (executed\
    \ when the URL matches `contacts/add`) is used for showing the **Add New Contact**\
    \ form.\n\n```\n  contactsRemove: function(id) {\n    App.Contacts.remove(id);\n\
    \    App.Directory.addFormHide();\n  }\n```\n\nThe `contactsRemove()` router method\
    \ (executed when the URL matches `contacts/remove/:id`) is used for performing\
    \ a remove on the specified contact. The name of our first argument is `id`, and\
    \ is coincidentally the same as the identifier used in our dynamic route. Either\
    \ of these could have been named something else and the code would still execute\
    \ as expected. This code executes the `Contact` model's `remove()` method as expected,\
    \ and hides the contact add form if it was open.\n\n## `scripts/main.js`\n\n```\n\
    scripts/main.js:\nvar App = {\n  …,\n  Routers: {},\n  Browser: null\n};\n```\n\
    \nThe `Routers` object we added to the main `App` object will contain a listing\
    \ of different routers we use in the application. If your application were to\
    \ get much more complicated, it wouldn't be a bad idea to keep different components\
    \ separated in this manner.\n\nThe `Browser` object will contain our instantiated\
    \ `Contact` router. Currently the application is rather simple and having a single\
    \ global pointer makes it convenient to work with.\n\n## `scripts/views/contact.js`\n\
    \nWe will now take a look at `scripts/views/contact.js`:\n\n```\n    App.Browser.navigate('contacts/remove/'\
    \ + this.model.cid);\n```\n\nThis line of code is executed when the remove button\
    \ is clicked. It updates the URL so that it shows which item is being deleted.\
    \ However, simply running this code does not cause the applicable route to be\
    \ updated. If we wanted to do that, we would need to pass a second argument to\
    \ `navigate()`, and it looks like this:\n\n```\n{trigger: true}\n```\n\nThe reason\
    \ we don't need to pass that second argument is because we're already going to\
