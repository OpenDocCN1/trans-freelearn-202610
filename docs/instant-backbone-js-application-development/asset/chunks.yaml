    \nThe line where we call `listenTo()` is where the real magic starts to happen.\
    \ When instantiating a View, we can pass in a model attribute, which is then assigned\
    \ as the model for that view (Backbone handles this assignment for us; we don't\
    \ have to do it manually in the `initialize` method). The View then adds an event\
