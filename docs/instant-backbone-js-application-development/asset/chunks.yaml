    \n更新 `scripts/collections/contact.js`，在现有的 `model` 属性后添加以下属性：\n\n```javascript\n\
    url: '/contacts'\n```\n\n## 步骤 4 – 更新主脚本\n\n更新 `scripts/main.js`，删除添加那两个联系人的所有代码行。\n\
    \n同样在 `scripts/main.js` 中，在 DOM 就绪代码的末尾添加以下代码行：\n\n```javascript\nApp.Contacts.fetch();\n\
