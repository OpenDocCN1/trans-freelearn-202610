    \  if (contact) {\n    contact.destroy();\n  }\n  App.Directory.addFormHide();\n\
    }\n```\n\n## 步骤 6 – 更新联系人视图\n\n修改 `scripts/views/contact.js` 中的 `remove()` 方法，使其类似于以下内容：\n\
    \n```javascript\nremove: function() {\n  App.Browser.navigate('contacts/remove/'\
    \ + this.model.get('id'));\n  this.model.destroy();\n}\n```\n\n## 步骤 7 – 更新目录视图\n\
    \n在 `scripts/views/directory.js` 中，更新 `addSubmit()` 方法，在将联系人添加到集合的那行代码后添加以下代码行：\n\
    \n```javascript\nnewContact.save();\n```\n\n## 步骤 8 – 运行服务器\n\n运行这个 Node 应用程序应该很简单，如下面的屏幕截图所示，打开一个终端窗口，输入\
    \ `node `（注意空格），将 `server.js` 文件拖放到终端窗口上，然后按回车键。\n\n在 OS X 和大多数 Linux 发行版中，你可以启动终端应用程序。在\
    \ Windows 中，你可以运行命令提示符应用程序。\n\n![步骤 8 – 运行服务器](img/5668OS_04_04.jpg)\n\n一旦你执行了\
    \ Node 服务器，你应该会在终端中看到消息 `http://localhost:1337/`。这是服务器监听传入 HTTP 请求的 URL。在浏览器中打开该\
    \ URL，你应该又能看到你的应用程序了！从现在起，你将想要使用该 URL 来导航到你的应用程序，而不是直接双击 `index.html` 文件。\n\n\
    你应该会看到之前那两个联系人的列表，即 **Thomas Hunter** 和 **Rupert Styx**。尝试添加更多联系人，并删除联系人。但这一次，在操作之间刷新页面。这一次它们保存在服务器端，而不是每次刷新都被删除！\n\
    \n我们在 Backbone 应用程序中做出的最值得注意的更改之一，是在 Contact 模型上添加了 `id` 属性。一旦 Backbone 看到该 `id`\
    \ 属性，它就知道如何引用服务器上的对象。我们还添加了一些功能，用于告知 Backbone 在何时与服务器通信以持久化和检索数据。\n\n### 检查集合\n\
    \n让我们首先看看 `scripts/collections/contact.js`：\n\n```javascript\nurl: '/contacts'\n\
    ```\n\nCollection 对象上的 `url` 属性是 Backbone 的一个约定，用于指定代表该特定数据类型的根 URL 端点。\n\n当 Backbone\
    \ 想要创建一个新联系人时，它将对该位置执行 `POST` 操作。当 Backbone 想要获取集合中所有项目的列表时，它将对该位置执行 `GET` 操作。当\
    \ Backbone 想要移除特定项目时，它将对该位置执行 `DELETE` 操作，后跟斜杠和唯一标识符。当 Backbone 想要从服务器检索特定项目时，它将对该位置执行\
    \ `GET` 操作，并附带唯一标识符。最后，当 Backbone 想要更改现有项目时，它将对该位置执行 `PUT` 操作，并附带唯一标识符。\n\n这是一种使用\
    \ URL 来表示服务器上数据的非常常见的方式。这种与资源交互的常见方式通常被称为 **REST**。因此，你可以说这个服务器脚本为前端 Backbone\
    \ 应用程序提供了一个 **RESTful API** 来进行交互。\n\n### 检查 main.js\n\n现在我们将查看 `scripts/main.js`：\n\
    \n此文件中的大多数更改都是删除代码，这些代码添加了两个默认联系人，因为我们希望后端服务器来处理这些联系人。\n\n```javascript\nApp.Contacts.fetch();\n\
    ```\n\n这行代码告诉 Backbone 执行数据获取。还记得之前的内容吗，既然 Backbone 想要集合中的所有数据，它就会对 URL `/contacts`\
    \ 执行 `GET` 操作。\n\n打开 Chrome 的网络控制台，选择最后一个网络请求“contacts”（应该是最后一个）。这将向你展示从 Node\
    \ 发送到 Backbone 的数据到底长什么样。你应该会看到如下截图所示的对象数组：\n\n![步骤 8 – 运行服务器](img/5668OS_04_05.jpg)\n\
    \n如果这是一个完全使用 jQuery 从头构建的应用程序，你可能需要编写一个 `$.ajax()` 调用来执行这项工作，并手动遍历每个项目。Backbone\
    \ 实际上使用的是 jQuery 提供的相同 `$.ajax()` 调用，但它会在后台自动为我们完成所有这些工作！\n\n### 检查路由器\n\n现在让我们看看\
    \ `scripts/router.js`：\n\n```javascript\ncontactsRemove: function(id) {\n  var\
    \ contact = App.Contacts.get(id);\n  if (contact) {\n    contact.destroy();\n\
    \  }\n  App.Directory.addFormHide();\n}\n```\n"
