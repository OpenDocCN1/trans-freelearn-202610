    \ `Node` is simply storing the data in a variable in memory, which is cleared\
    \ when the program exits.\n\nIf you want to save data forever, look into using\
    \ a database system, such as `MySQL`, `MongoDB`, or `Redis`. There are many options\
    \ out there for data storage. `MongoDB`, for example, works great with `Node`,\
    \ and luckily for us `JavaScript` developers, uses `JSON` for representing objects.\n\
    \nMore links for you to learn about `Backbone`.\n\n## Official sites\n\n*   Backbone\
    \ documentation: [http://backbonejs.org/](http://backbonejs.org/)\n*   Backbone\
    \ GitHub: [http://github.com/documentcloud/backbone/](http://github.com/documentcloud/backbone/)\n\
    *   Underscore Documentation: [http://underscorejs.org/](http://underscorejs.org/)\n\
    *   jQuery Documentation: [http://api.jquery.com/](http://api.jquery.com/)\n*\
    \   Node.js Documentation: [http://nodejs.org/api/](http://nodejs.org/api/)\n\
    *   The code for the examples in this book can be obtained from [https://github.com/tlhunter/backbone-book](https://github.com/tlhunter/backbone-book)\n\
    \n## Community\n\n*   Freenode IRC: `#documentcloud`\n*   Backbone issues: [http://github.com/documentcloud/backbone/issues](http://github.com/documentcloud/backbone/issues)\n\
    *   Mailing list: [https://groups.google.com/forum/#!forum/backbonejs](https://groups.google.com/forum/#!forum/backbonejs)\n\
    \n## Twitter\n\n*   Follow the creators of Backbone.js at `@documentcloud`\n*\
    \   Follow the author of this book at `@tlhunter`\n*   For more open source information,\
    \ follow Packt at `@packtopensource`\n"
  trans: "\n之前，我们的代码运行的是 `App.Contacts.remove(id)`，其中 `id` 是集合 ID。这是 `Backbone` 自动添加到\
    \ `collection` 中每个 `model` 上的，用于在内部进行跟踪。但现在我们已更新应用程序以使用真实的 ID 值，情况变得稍微复杂一些。\n\n\
    因为我们希望 `Contact` 的删除操作能持久化到服务器，所以我们需要使用 `model.destroy()`，而不是 `collection.remove()`。首先，我们尝试从\
    \ `collection` 中获取 `contact` 并将其赋值给变量 `contact`。用户可能会尝试删除一个不存在的 `contact`，这会导致错误。然后我们检查\
    \ `model` 是否返回，如果返回了，我们就运行 `destroy()`。这会向服务器发送 `DELETE` 命令。\n\n现在让我们看看 `scripts/views/contact.js`：\n\
    \n```\n  remove: function() {\n    App.Browser.navigate('contacts/remove/' + this.model.get('id'));\n\
    \    this.model.destroy();\n  }\n```\n\n正如上一节所述，我们现在想要使用 `models` 的真实 ID，而不是 `Collection`\
    \ ID。我们不再获取 `model.cid`，而是使用 `model.get('id')` 并将其传递给 URL 供 `router` 处理。\n\n最后让我们看看\
    \ `scripts/views/directory.js`\n\n```\n      newContact.save();\n```\n\n这行代码明确告诉\
    \ `Backbone` 获取这个新创建的 `contact` 并将其保存到服务器。遗憾的是，仅将一个 `model` 添加到 `Collection` 中并不足以让\
    \ `Backbone` 将该 `collection` 持久化到服务器。不过，这确实给了我们对应用程序更多的控制权。\n\n如果你检查此请求的网络流量，你会看到它在服务器上执行\
    \ `POST` 操作。然而，它也会响应一个完整的文档。`Backbone` 随后解析此文档，查找 `id` 属性，然后更新本地 `model`。通常，我们希望数据库为我们生成\
    \ `id` 值，而 `Backbone` 正好满足了这一需求。\n\n## 注意\n\n如果你终止 `Node` 应用程序（无论是按 `Ctrl` + `C`\
    \ 还是关闭窗口），联系人数据库将永远被删除。之所以会这样，是因为 `Node` 只是将数据存储在内存中的一个变量里，程序退出时该变量会被清除。\n\n如果你想永久保存数据，请考虑使用数据库系统，例如\
    \ `MySQL`、`MongoDB` 或 `Redis`。数据存储有很多可选方案。例如，`MongoDB` 与 `Node` 配合得很好，幸运的是，对于我们\
    \ `JavaScript` 开发者来说，它使用 `JSON` 来表示对象。\n\n更多供你学习 `Backbone` 的链接。\n\n## 官方网站\n\n\
    *   Backbone 文档：[`backbonejs.org/`](http://backbonejs.org/)\n*   Backbone GitHub：[`github.com/documentcloud/backbone/`](http://github.com/documentcloud/backbone/)\n\
    *   Underscore 文档：[`underscorejs.org/`](http://underscorejs.org/)\n*   jQuery\
    \ 文档：[`api.jquery.com/`](http://api.jquery.com/)\n*   Node.js 文档：[`nodejs.org/api/`](http://nodejs.org/api/)\n\
    *   本书示例的代码可从 [`github.com/tlhunter/backbone-book`](https://github.com/tlhunter/backbone-book)\
    \ 获取\n\n## 社区\n\n*   Freenode IRC：`#documentcloud`\n*   Backbone 问题：[`github.com/documentcloud/backbone/issues`](http://github.com/documentcloud/backbone/issues)\n\
    *   邮件列表：[`groups.google.com/forum/#!forum/backbonejs`](https://groups.google.com/forum/#!forum/backbonejs)\n\
