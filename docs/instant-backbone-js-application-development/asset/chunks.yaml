- raw: "Before jumping right into the coding bit, let's talk a little bit about what\
    \ our application should be able to do, and think a little bit about responsibilities\
    \ of code. We want to be able to add new contacts to our directory. When adding\
    \ an item, that bit of responsibility lies outside of any specific contact. It's\
    \ something we sort of do for the entire directory. For that reason, let's put\
    \ the Add New Contact button inside of the Directory view. Also, we want to be\
    \ able to delete existing contacts. Those definitely are a per-contact item, as\
    \ each contact will need its own delete button. For this reason we'll add a delete\
    \ button to the Contact views.\n\n### Step 2 – updating the document\n\nUpdate\
    \ the `index.html` file with the following code. Place it inside of `div#display`,\
    \ before `div.listing`:\n\n```\n      <div class=\"controls\">\n        <button\
    \ class=\"add\">Add New Contact</button>\n        <form method=\"\" action=\"\"\
    \ style=\"display: none;\">\n          <input type=\"text\" placeholder=\"First\
    \ Name\" class=\"firstName\" /><br />\n          <input type=\"text\" placeholder=\"\
    Last Name\" class=\"lastName\" /><br />\n          <input type=\"text\" placeholder=\"\
    Email\" class=\"email\" /><br />\n          <input type=\"text\" placeholder=\"\
    Phone\" class=\"phoneNumber\" /><br />\n          <input type=\"submit\" value=\"\
    Save Contact\" />\n        </form>\n      </div>\n```\n\n### Step 3 – updating\
    \ the Contact view\n\nUpdate the `scripts/views/contact.js` file with the following\
    \ code before the `initialize` method:\n\n```\n  events: {\n    'click .delete':\
    \ 'remove'\n  },\n```\n\nAlso in this file, add another method at the end of the\
    \ main View object (you'll want to add a trailing comma after the `insert()` method\
    \ preceding it):\n\n```\n  remove: function() {\n    this.model.destroy();\n \
    \ }\n```\n\nBe sure to update the `_.bindAll()` call in `initialize` so that it\
    \ includes the `remove` method:\n\n```\n    _.bindAll(this, 'render', 'insert',\
    \ 'remove');\n```\n\n### Step 4 – updating the directory view\n\nUpdate the `scripts/views/directory.js`\
    \ file by adding the following code near the top of the main View object (before\
    \ the initialize method):\n\n```\n  events: {\n    'click .controls .add': 'addForm',\n\
    \    'submit .controls form': 'addSubmit'\n  },\n```\n\nAlso in this file, add\
    \ the following methods at the end of the main View object, after the existing\
    \ `render()` method (and don't forget that trailing comma after the `render` closing\
    \ brace):\n\n```\n  addForm: function() {\n    this.$('.controls form').show()\n\
    \      .find('input.firstName').focus();\n  },\n\n  addSubmit: function(event)\
    \ {\n    event.preventDefault();\n     var $form = this.$('.controls form');\n\
    \n    var newContact = new App.Models.Contact({\n      firstName: $('input.firstName',\
    \ $form).val(),\n      lastName: $('input.lastName', $form).val(),\n      phoneNumber:\
    \ $('input.phoneNumber', $form).val(),\n      email: $('input.email', $form).val()\n\
    \    });\n\n    if (newContact.isValid()) {\n      App.Contacts.add(newContact);\n\
    \      $form.hide();\n      $('input[type=text]', $form).val('').blur();\n   \
    \ } else {\n      alert(newContact.validationError);\n    }\n  }\n```\n\nBe sure\
    \ to also add `addSubmit` and `addForm` to the `_.bindAll()` call in initialize:\n\
    \n```\n    _.bindAll(this, 'render', 'addForm', 'addSubmit');\n```\n\nThe changes\
    \ we made this time allow us to interact with our Collection of contacts using\
    \ standard form controls.\n\nLet us have a look at `index.html`:\n\n```\n    \
    \  <div class=\"controls\">\n        <button class=\"add\">Add New Contact</button>\n\
    ```\n\nThe new `div.controls` element will contain all of the controls and inputs\
    \ for creating new contacts within our application. The button will be used for\
    \ toggling the visibility of the form for adding contacts.\n\n```\n<form method=\"\
    \" action=\"\" style=\"display: none;\">\n```\n\nThe `<form>` tag here won't actually\
    \ post anything to the server, so we can leave the `method` and `action` attributes\
    \ empty. We really just want to use it to keep track of when the user is attempting\
    \ to submit their new data. Remember, there are two ways a user will typically\
    \ submit a form. One is by pressing *Enter*, the other by clicking on a **Submit**\
    \ button.\n\n### Tip\n\nAs a general JavaScript and HTML pro-tip, do not add events,\
    \ which listen for a button click or for keystrokes, and attempt to look for the\
    \ *Enter* key being pressed.\n\nFor one thing, you are looking for two different\
    \ user actions. For another thing, the user could be submitting the form via another\
    \ method, such as screen reading software or a mobile device, which has a special\
    \ submit form button attached to the keyboard.\n\nWe want the form to be hidden\
    \ by default, so I've added some inline CSS to make it hidden (if this were a\
    \ real application, you'd use an external CSS file to handle this, but I kept\
    \ it inline for brevity).\n\n```\n          <input type=\"text\" placeholder=\"\
    First Name\" class=\"firstName\" /><br />\n          <input type=\"text\" placeholder=\"\
    Last Name\" class=\"lastName\" /><br />\n          <input type=\"text\" placeholder=\"\
    Email\" class=\"email\" /><br />\n          <input type=\"text\" placeholder=\"\
    Phone\" class=\"phoneNumber\" /><br />\n```\n\nThese are the inputs where the\
    \ user will type their information. Notice how I added the `type` attributes and\
    \ set them to `text`. Normally this is done automatically but, when left out,\
    \ the selector used elsewhere in the code to clear the elements wouldn't target\
    \ the elements properly.\n\n```\n          <input type=\"submit\" value=\"Save\
    \ Contact\" />\n        </form>\n      </div>\n```\n\nOf course, we want a submit\
    \ button, so that we can run our code when the form is submitted. Without this\
    \ button, pressing *Enter* will not submit the form. Of course we also want to\
    \ end the form and the View element tags too.\n\nWe next look at `scripts/views/contact.js`:\n\
    \n```\n  events: {\n    'click .delete': 'remove'\n  },\n```\n\nThe `events` attribute\
    \ on View objects is a Backbone convention for specifying which events to listen\
    \ for and which methods to execute when they are triggered. This attribute is\
    \ an object with different key/value pairs for each event being listened for.\
    \ The key represents the special event delegation syntax, and the value is a string\
    \ with the name of the method to be executed.\n\nIn this case, when an element\
    \ with a class of `delete` is clicked, the `remove` method is executed. Make sure\
    \ that you're using a string to represent the name of the method, not an actual\
    \ reference to the method such as `this.remove`.\n\nWhen the event is triggered\
    \ and the code is executed, the first argument to the method will be the event\
    \ object, which you can perform further examination of (for example, if you want\
    \ to find out exactly which element in the View triggered the event).\n\n```\n\
    \  remove: function() {\n    this.model.destroy();\n  }\n```\n\nThis code will\
    \ execute the `destroy()` method on the Model. This method is provided by Backbone\
    \ for performing deletes on your data. It will handle not only deleting the model,\
    \ but also removing it from the collection.\n\nBackbone is actually smart enough\
    \ to take it a step further. When this code is executed, it will even remove the\
    \ relevant contact element from the DOM for us. Open the Element Inspector of\
    \ Chrome, and navigate to the `.listing` element to keep an eye on the DOM while\
    \ deleting (and adding) elements to see this happen first-hand.\n\nThen we look\
    \ at `scripts/views/directory.js`:\n\n```\n  events: {\n    'click .controls .add':\
    \ 'addForm',\n    'submit .controls form': 'addSubmit'\n  },\n```\n\nThis code\
    \ adds two different event listeners to our Directory View. Since the **Add New\
    \ Contact** button simply toggles the visibility of the contact form, and the\
    \ submitting of the contact form does the real work, we need the two separate\
    \ events.\n\n```\n  addForm: function() {\n    this.$('.controls form').show()\n\
    \      .find('input.firstName').focus();\n  },\n```"
  fmt: "\n在直接进入编码之前，让我们先谈谈应用程序应该具备哪些功能，并思考一下代码的职责划分。我们希望能够向目录中添加新联系人。添加条目这一职责不属于任何特定联系人，而是针对整个目录的操作。因此，我们将“Add\
    \ New Contact”按钮放在 `Directory` 视图中。同时，我们也希望能够删除现有联系人。删除操作显然是针对每个联系人的，因为每个联系人都需要自己的删除按钮。因此，我们将在\
    \ `Contact` 视图中添加删除按钮。\n\n## Step 2：更新文档\n\n使用以下代码更新 `index.html` 文件。将其放置在 `div#display`\
    \ 内部，`div.listing` 之前：\n\n```\n<div class=\"controls\">\n  <button class=\"add\"\
    >Add New Contact</button>\n  <form method=\"\" action=\"\" style=\"display: none;\"\
    >\n    <input type=\"text\" placeholder=\"First Name\" class=\"firstName\" /><br\
    \ />\n    <input type=\"text\" placeholder=\"Last Name\" class=\"lastName\" /><br\
    \ />\n    <input type=\"text\" placeholder=\"Email\" class=\"email\" /><br />\n\
    \    <input type=\"text\" placeholder=\"Phone\" class=\"phoneNumber\" /><br />\n\
    \    <input type=\"submit\" value=\"Save Contact\" />\n  </form>\n</div>\n```\n\
    \n## Step 3：更新 Contact 视图\n\n在 `initialize` 方法之前，使用以下代码更新 `scripts/views/contact.js`\
    \ 文件：\n\n```\nevents: {\n  'click .delete': 'remove'\n},\n```\n\n此外，在主 View 对象的末尾添加另一个方法（你需要在前面的\
    \ `insert()` 方法后添加一个尾随逗号）：\n\n```\nremove: function() {\n  this.model.destroy();\n\
    }\n```\n\n确保更新 `initialize` 中的 `_.bindAll()` 调用，使其包含 `remove` 方法：\n\n```\n_.bindAll(this,\
    \ 'render', 'insert', 'remove');\n```\n\n## Step 4：更新 Directory 视图\n\n通过在主 View\
    \ 对象顶部附近添加以下代码（在 `initialize` 方法之前）来更新 `scripts/views/directory.js` 文件：\n\n```\n\
    events: {\n  'click .controls .add': 'addForm',\n  'submit .controls form': 'addSubmit'\n\
    },\n```\n\n同样在该文件中，在现有的 `render()` 方法之后，在主 View 对象的末尾添加以下方法（别忘了在 `render` 闭合大括号后添加尾随逗号）：\n\
    \n```\naddForm: function() {\n  this.$('.controls form').show()\n    .find('input.firstName').focus();\n\
    },\n\naddSubmit: function(event) {\n  event.preventDefault();\n  var $form = this.$('.controls\
    \ form');\n\n  var newContact = new App.Models.Contact({\n    firstName: $('input.firstName',\
    \ $form).val(),\n    lastName: $('input.lastName', $form).val(),\n    phoneNumber:\
    \ $('input.phoneNumber', $form).val(),\n    email: $('input.email', $form).val()\n\
    \  });\n\n  if (newContact.isValid()) {\n    App.Contacts.add(newContact);\n \
    \   $form.hide();\n    $('input[type=text]', $form).val('').blur();\n  } else\
    \ {\n    alert(newContact.validationError);\n  }\n}\n```\n\n确保也将 `addSubmit` 和\
    \ `addForm` 添加到 `initialize` 中的 `_.bindAll()` 调用中：\n\n```\n_.bindAll(this, 'render',\
    \ 'addForm', 'addSubmit');\n```\n\n我们所做的更改使我们能够使用标准表单控件与联系人 Collection 进行交互。\n\
    \n让我们看看 `index.html`：\n\n```\n<div class=\"controls\">\n  <button class=\"add\"\
    >Add New Contact</button>\n```\n\n新的 `div.controls` 元素将包含在应用程序中创建新联系人的所有控件和输入框。该按钮将用于切换添加联系人表单的可见性。\n\
    \n```\n<form method=\"\" action=\"\" style=\"display: none;\">\n```\n\n这里的 `<form>`\
    \ 标签实际上不会向服务器提交任何内容，因此我们可以将 `method` 和 `action` 属性留空。我们只是想用它来跟踪用户何时尝试提交新数据。记住，用户通常有两种提交表单的方式：一种是按\
    \ *Enter* 键，另一种是点击 **Submit** 按钮。\n\n### Tip\n\n作为一个通用的 JavaScript 和 HTML 专业提示，不要添加监听按钮点击或按键的事件，并尝试查找\
    \ *Enter* 键是否被按下。\n\n首先，你是在寻找两种不同的用户操作。其次，用户可能通过其他方式提交表单，例如屏幕阅读软件或移动设备，这些设备的键盘上附有特殊的提交表单按钮。\n\
    \n我们希望表单默认隐藏，所以我添加了一些内联 CSS 来实现隐藏（如果这是一个真实的应用程序，你会使用外部 CSS 文件来处理这个问题，但我为了简洁起见将其保留为内联）。\n\
    \n```\n<input type=\"text\" placeholder=\"First Name\" class=\"firstName\" /><br\
    \ />\n<input type=\"text\" placeholder=\"Last Name\" class=\"lastName\" /><br\
    \ />\n<input type=\"text\" placeholder=\"Email\" class=\"email\" /><br />\n<input\
    \ type=\"text\" placeholder=\"Phone\" class=\"phoneNumber\" /><br />\n```\n\n\
    这些是用户输入信息的输入框。注意我添加了 `type` 属性并将其设置为 `text`。通常这是自动完成的，但如果省略，代码中其他地方用于清除元素的选择器将无法正确定位这些元素。\n\
    \n```\n<input type=\"submit\" value=\"Save Contact\" />\n</form>\n</div>\n```\n\
    \n当然，我们需要一个提交按钮，以便在表单提交时运行我们的代码。没有这个按钮，按 *Enter* 键将不会提交表单。当然，我们也需要结束表单和 View 元素标签。\n\
    \n接下来我们看 `scripts/views/contact.js`：\n\n```\nevents: {\n  'click .delete': 'remove'\n\
    },\n```\n\nView 对象上的 `events` 属性是 Backbone 的一种约定，用于指定监听哪些事件以及触发时执行哪些方法。该属性是一个对象，包含每个被监听事件的不同键值对。键代表特殊的事件委托语法，值是一个字符串，包含要执行的方法名称。\n\
    \n在这种情况下，当具有 `delete` 类的元素被点击时，将执行 `remove` 方法。确保使用字符串来表示方法名称，而不是对方法的实际引用，如 `this.remove`。\n\
    \n当事件触发且代码执行时，传递给方法的第一个参数将是事件对象，你可以对其进行进一步检查（例如，如果你想确切知道 View 中哪个元素触发了该事件）。\n\n\
    ```\nremove: function() {\n  this.model.destroy();\n}\n```\n\n这段代码将在 Model 上执行\
    \ `destroy()` 方法。此方法由 Backbone 提供，用于对数据执行删除操作。它不仅会删除模型，还会将其从 collection 中移除。\n\
    \nBackbone 实际上足够智能，能更进一步。当这段代码执行时，它甚至会为我们从 DOM 中移除相关的联系人元素。打开 Chrome 的 Element\
    \ Inspector，导航到 `.listing` 元素，在删除（和添加）元素时留意 DOM 变化，亲眼见证这一过程。\n\n然后我们看 `scripts/views/directory.js`：\n\
    \n```\nevents: {\n  'click .controls .add': 'addForm',\n  'submit .controls form':\
    \ 'addSubmit'\n},\n```\n\n这段代码为我们的 Directory View 添加了两个不同的事件监听器。由于 **Add New Contact**\
    \ 按钮只是切换联系人表单的可见性，而提交联系人表单才是真正的工作，因此我们需要两个单独的事件。\n\n```\naddForm: function() {\n\
    \  this.$('.controls form').show()\n    .find('input.firstName').focus();\n},\n\
    ```\n"
