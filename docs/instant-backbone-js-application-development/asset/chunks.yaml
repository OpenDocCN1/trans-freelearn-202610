- raw: "Collections represent database tables, and models represent individual rows\
    \ within that table. With our application, we're going to be storing a bunch of\
    \ people's contact information in our address book. We will have a contacts collection\
    \ for all of our contacts and a different contact model for each person in our\
    \ collection.\n\n### Step 1 – creating some files and folders\n\nCreate two new\
    \ directories in our `scripts` directory, one called `models` and the other called\
    \ `collections`.\n\nCreate a new file named `scripts/models/contact.js`.\n\nCreate\
    \ a `scripts/collections/contact.js` file.\n\n### Step 2 – updating the main script\n\
    \nReplace all of the code in `scripts/main.js` with the following:\n\n```\nvar\
    \ App = {\n  Models: {},\n  Collections: {},\n  Contacts: null\n};\n\n$(function()\
    \ { // Run this code when the DOM is ready\n  window.tom = new App.Models.Contact({\n\
    \    firstName: 'Thomas',\n    lastName: 'Hunter',\n    phoneNumber: '9895135499',\n\
    \    email: 'me@thomashunter.name'\n  });\n\n  App.Contacts = new App.Collections.Contact();\n\
    \n  App.Contacts.add(window.tom);\n\n  App.Contacts.add({\n    firstName: 'Rupert',\n\
    \    lastName: 'Styx',\n    phoneNumber: '9895551212',\n    email: 'rupertstyx@example.com'\n\
    \  });\n\n  App.Contacts.add({});\n\n  var contactListing = '';\n  App.Contacts.each(function(contact)\
    \ {\n    contactListing += \"<div>\" +\n    contact.get('firstName') + \" \" +\n\
    \    contact.get('lastName') + \" \";\n\n    if (contact.isValid()) {\n      contactListing\
    \ += \"(valid)\";\n    } else {\n      contactListing += \"(invalid)\";\n    }\n\
    \    \n    contactListing += \"</div>\";\n  });\n  $('#display').html(contactListing);\n\
    \n});\n```\n\n### Step 3 – updating the document\n\nAdd the following two script\
    \ tags to the `index.html` document, after the existing `<script>` tag near the\
    \ closing `<body>` tag:\n\n```\n<script src=\"scripts/models/contact.js\"></script>\n\
    <script src=\"scripts/collections/contact.js\"></script>\n```\n\n### Step 4 –\
    \ updating the Contact model\n\nAdd the following code to the `scripts/models/contact.js`\
    \ file:\n\n```\nApp.Models.Contact = Backbone.Model.extend({\n  defaults: {\n\
    \    firstName: '',\n    lastName: '',\n    phoneNumber: '<UNLISTED>',\n    email:\
    \ '<UNLISTED>'\n  },\n\n  validate: function(attrs, options) {\n    if (!attrs.firstName)\
    \ {\n      return \"A valid contact must have a first name\";\n    }\n  },\n\n\
    \  initialize: function(attributes) {\n    var firstName = attributes.firstName\
    \ || '<EMPTY>';\n    var lastName = attributes.lastName || '<EMPTY>';\n    console.log(\"\
    Initializing a new contact model for '\" +\n      firstName + \" \" + lastName\
    \ + \"'.\"\n    );\n  }\n});\n```\n\n### Step 5 – updating the Contact collection\n\
    \nAdd the following code to `scripts/collections/contact.js`:\n\n```\nApp.Collections.Contact\
    \ = Backbone.Collection.extend({\n  model: App.Models.Contact\n});\n```\n\n###\
    \ Step 6 – refreshing the browser\n\nOnce you're done adding the preceding code,\
    \ refresh your browser window. You should see the following screen in your browser:\n\
    \n![Step 6 – refreshing the browser](graphics/5668OS_04_01.jpg)\n\nAfter running\
    \ this code, we've successfully created our collection and model objects, then\
    \ instantiated a collection as well as populated it with three different models.\
    \ We also iterated over each item within the collection, much like we would with\
    \ a database result, and displayed them one at a time on the screen.\n\nLet us\
    \ have a look at `scripts/main.js`. This file contains our application bootstrapping\
    \ code:\n\n```\nvar App = {\n  Models: {},\n  Collections: {},\n  Contacts: null\n\
    };\n```\n\nThis code creates a global object called `App`, which contains three\
    \ attributes. The first two, `Models` and `Collections`, are empty objects that\
    \ will contain our `Model` and `Collection` objects that have extended the Backbone\
    \ Model and Collection object, respectively. Think of these as templates for later\
    \ creating instances that we can work with. In JavaScript, there are no classes,\
    \ only objects, but these will contain objects we will pretend are classes.\n\n\
    The third attribute, `Contacts`, is where we will actually store our main Contact\
    \ collection instance. Since we will only ever need one of them, and having it\
    \ globally accessible is convenient, we assign it here. Notice that we don't keep\
    \ track of individual Contact model instances in this manner.\n\nCreating a global\
    \ object called `App` isn't actually required by Backbone. This is a convention\
    \ that I use so that I can later interact with this global object from different\
    \ scripts. If you were creating your entire application within a single file,\
    \ you could simply create temporary local variables to point to these objects.\n\
    \n```\n$(function() { // Run this code when the DOM is ready\n```\n\nThe next\
    \ bit of code in `main.js` is executed after the DOM loads. The reason for this\
    \ is a sort of catch 22. The different `Model` and `Collection` files we instantiate\
    \ after calling `main.js` need access to the global `App` variable. The majority\
    \ of our `main.js` code requires the `Collections` and `Models` objects to have\
    \ been attached to the global `App` object. Running the code after the DOM loads\
    \ ensures that the `Model` and `Collection` scripts load first, and we never run\
    \ into uninitialized variable problems.\n\n```\n  window.tom = new App.Models.Contact({\n\
    \    firstName: 'Thomas',\n    lastName: 'Hunter',\n    phoneNumber: '9895135499',\n\
    \    email: 'me@thomashunter.name'\n  });\n```\n\nHere we create an instance of\
    \ our Contact Model code. When instantiating the object, we pass in a simple object\
    \ that will be converted into the more complex Backbone model. Notice how I am\
    \ creating a global variable named `tom`. The reason I did this is that we can\
    \ inspect it easily in the Web Inspector.\n\nTo see what the object looks like,\
    \ open up your **Console**, simply type `tom`, and press *Enter*. You can then\
    \ expand some of the attributes to see what the object looks like, as shown in\
    \ the following screenshot:\n\n![Step 6 – refreshing the browser](graphics/5668OS_04_02.jpg)\n\
    \nAs you can see, Backbone adds a lot of data for us. This data is used by Backbone\
    \ to help keep track of things we change, event bindings, which data to send to\
    \ the server when we're ready to persist, and so on.\n\nThe most interesting part\
    \ in here is the `attributes` attribute, which contains all of that simple data\
    \ we added before. You could access this information by running `tom.attributes.firstName`,\
    \ but you should really access it instead by running `tom.get('firstName')` as\
    \ a convention.\n\n```\nApp.Contacts = new App.Collections.Contact();\n```\n\n\
    The preceding line creates a globally accessible instance of the Contact Collection,\
    \ assigned to `App.Contacts`. Later in our application when we want to work with\
    \ our different contacts, we just have to type `App.Contacts`.\n\n```\n  App.Contacts.add(window.tom);\n\
    \n  App.Contacts.add({\n    firstName: 'Rupert',\n    lastName: 'Styx',\n    phoneNumber:\
    \ '9895551212',\n    email: 'rupertstyx@example.com'\n  });\n\n  App.Contacts.add({});\n\
    ```\n\nThe preceding lines of code add three different contacts to our Contact\
    \ Collection. The first one takes the instance of the Model we created beforehand\
    \ and adds it to the collection.\n\nThe second one implicitly creates a new model\
    \ for us from the simple object we supply. Obviously it can save us a few lines\
    \ of code by doing it this way. However, sometimes you want to perform some model-specific\
    \ actions on your data before inserting it into the Collection. Perhaps you want\
    \ to perform some validation first. In those cases, create the model ahead of\
    \ time; otherwise, just do it this way.\n\nThe third one also implicitly creates\
    \ a new model, but notice how none of the attributes has been set. We add this\
    \ empty Model so we can see how validation and default values work later."
