  });\n```\n\n### 步骤 6 – 刷新浏览器\n\n完成前面代码的添加后，刷新浏览器窗口。你应该会在浏览器中看到以下屏幕：\n\n![步骤 6 –\
  \ 刷新浏览器](img/5668OS_04_01.jpg)\n\n运行此代码后，我们成功创建了集合和模型对象，然后实例化了一个集合并用三个不同的模型填充它。我们还遍历了集合中的每一项，就像处理数据库结果一样，并将它们逐个显示在屏幕上。\n\
  \n### 检查 `scripts/main.js`\n\n让我们看看 `scripts/main.js`。该文件包含我们的应用程序引导代码：\n\n```\n\
  var App = {\n  Models: {},\n  Collections: {},\n  Contacts: null\n};\n```\n\n这段代码创建了一个名为\
