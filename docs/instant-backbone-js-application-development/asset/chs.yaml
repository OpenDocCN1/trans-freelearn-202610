  ;\n    } else {\n      contactListing += \"(invalid)\";\n    }\n    \n    contactListing\
  \ += \"</div>\";\n  });\n  $('#display').html(contactListing);\n\n});\n```\n\n###\
  \ 步骤 3 – 更新文档\n\n在 `index.html` 文档中，靠近结束标签 `</body>` 处现有的 `<script>` 标签之后，添加以下两个\
  \ script 标签：\n\n```\n<script src=\"scripts/models/contact.js\"></script>\n<script\
