  \ Contact 模型实例。\n\n创建一个名为 `App` 的全局对象实际上并不是 Backbone 所要求的。这是我使用的一种约定，以便稍后可以从不同的脚本与该全局对象交互。如果你在单个文件中创建整个应用程序，只需创建临时局部变量来指向这些对象即可。\n\
