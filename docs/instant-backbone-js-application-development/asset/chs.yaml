  前面的代码行向我们的 Contact Collection 添加了三个不同的联系人。第一个获取我们预先创建的 Model 实例并将其添加到集合中。\n\n第二个从我们提供的简单对象中为我们隐式创建了一个新模型。显然，这样做可以节省几行代码。然而，有时你希望在将数据插入\
