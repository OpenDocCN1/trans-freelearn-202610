  Initializing a new contact model for '\" +\n      firstName + \" \" + lastName +\
  \ \"'.\"\n    );\n  }\n});\n```\n\n### 步骤 5 – 更新 Contact 集合\n\n将以下代码添加到 `scripts/collections/contact.js`：\n\
