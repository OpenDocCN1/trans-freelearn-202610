  \ by title', () => {\n        page.navigateTo();\n\n        const title = page.getTitleInput();\n\
  \        title.sendKeys(\"Are we there\");\n\n        expect(page.getTalks().count()).toEqual(1);\n\
  \        expect(page.getTalkText(0)).toContain(\"Are we there yet?\");\n    });\n\
  });\n```\n\n## 让我们回顾一下\n\n在本章中，我们研究了测试 Angular 组件的四种方式：隔离测试、浅层测试、集成测试和 Protractor\
  \ 测试。它们各有其适用的时机与场景：隔离测试是以测试驱动的方式开发组件、测试复杂逻辑的绝佳方法。浅层测试是隔离测试的增强版，在编写有意义的测试需要渲染组件模板时，应当使用它们。最后，集成测试和\
