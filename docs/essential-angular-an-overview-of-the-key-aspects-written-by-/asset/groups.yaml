  - "[PAGE 20]\n\n# # Chapter 4. Components and Directives\n\nTo build an Angular\
    \ application you define a set of components, for every UI element, screen, and\
    \ route. An application will always have root components (usually just one) that\
    \ contain all other components. To make things simpler, in this book let's assume\
    \ the application has a single root component, and thus our Angular application\
    \ will have a component tree, that may look like this:\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_20_0.png)\n\
    \nAppCmp is the root component. The FiltersCmp component has the speaker input\
    \ and the filter button. TalksCmp is the list you see at the bottom. And TalkCmp\
    \ is an item in that list. To understand what constitutes a component in Angular,\
    \ let's look closer at TalkCmp:\n\n```\n```typescript\n@Component({\n  selector:\
    \ 'talk-cmp',\n  template: `\n    {{talk.title}}  {{talk.speaker}}\n    {{talk.rating\
    \ | formatRating }}\n    <watch-button [talk]=\"talk\"></watch-button>\n    <rate-button\
    \ [talk]=\"talk\"></rate-button>\n  `\n})\n```\n```"
  - "[PAGE 21]\n\n```\n```typescript\nclass TalkCmp {\n  @Input() talk: Talk;\n  @Output()\
    \ rate: EventEmitter;\n  //...\n}\n```\n```"
  - "[PAGE 22]\n\n# # Input and output properties\n\nA component has input and output\
    \ properties, which can be defined in the component decorator or using property\
    \ decorators.\n\n```\nclass TalkCmp {\n  @Input() talk: Talk;\n  @Output() rate:\
    \ EventEmitter;\n  //...\n}\n```\n\nData flows into a component via input properties.\
    \ Data flows out of a component via output properties, hence the names: input\
    \ and output.\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_22_0.png)\n\nInput and\
    \ output properties are the public API of a component. You use them when you instantiate\
    \ a component in your application.\n\n```\n<talk-cmp[talk]=\"someExpr\"(rate)=\"\
    onRate($event.rating)\"></talk-\n```\n\nYou can set input properties using property\
    \ bindings, through square brackets. You can subscribe to output properties using\
    \ event bindings, through parenthesis."
  md: "\n## Essential Angular\n\nVictor Savkin, Jeff Cross\n\nAn overview of the key\
    \ aspects written by two of the Angular core contributors\n\n- Resolution\n- Lazy\
    \ loading\n- Getting injector\n- Visualizing injector tree\n- Advanced topics\n\
    - Let's recap\n- 7: Change Detection\n  - Chapter 7: Change Detection\n  - Two\
    \ phases\n  - Why?\n  - How does Angular enforce It?\n  - Content and view children\n\
    \  - ChangeDetectionStrategy.OnPush\n  - Let's recap\n- 8: Forms\n  - Chapter\
    \ 8: Forms\n  - Two modules\n  - High-level overview\n  - Form model\n  - Form\
    \ directives\n  - The DOM\n  - Wrapping up\n- 9: Testing\n  - Chapter 9: Testing\n\
    \  - Isolated tests\n  - Shallow testing\n  - Integration testing\n  - Protractor\
    \ tests\n  - Let's recap\n- 10: Reactive Programming in Angular\n  - Chapter 10:\
    \ Reactive Programming in Angular\n  - Reactive programming in the core framework\n\
    \  - Reactive programming in the Angular ecosystem\n  - Summary\n\nYou can find\
    \ the source code of the application here https://github.com/vsavkin/essential-angular-book-app.\n\
    \n## Chapter 2. Compilation\n\nAt the core of Angular is a sophisticated compiler,\
    \ which takes an `NgModule` type and produces an `NgModuleFactory`.\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_5_0.png)\n\
    \nAn `NgModule` has components declared in it. While creating the module factory,\
    \ the compiler will take the template of every component in the module, and using\
    \ the information about declared components and pipes, will produce a component\
    \ factory. The component factory is a JavaScript class the framework can use to\
    \ stamp out components.\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_6_0.png)\n\
    \n```\nNgModule\n\nComponent/Directive Types\n\nPipe Types\n\n...\n\nTemplate\n\
    \nComponent Factory\n```\n\n### How is it possible?\n\nWhy didn't we do it before,\
    \ in Angular 1? To make AOT work, the application has to have a clear separation\
    \ of the static and dynamic data in the application. And the compiler has to be\
    \ built in such a way that it only depends on the static data. When designing\
    \ and building Angular, we put a lot of effort to do exactly that. And such primitives\
    \ as classes and decorators, which the new versions of JavaScript and TypeScript\
    \ support, made it way easier.\n\nTo see how this separation works in practice,\
    \ let's look at the following example. Here, the information in the decorator\
    \ is known statically. Angular knows the selector and the template of the `talk`\
    \ component. It also knows that the component has an input called `talk` and an\
    \ output called `rate`. But the framework does not know what the constructor or\
    \ the `onRate` function do.\n\n```typescript\n@Component({\n  selector: 'talk-cmp',\n\
    \  template: `\n    {{talk.title}} {{talk.speaker}}\n    Rating: {{ talk.rating\
    \ | formatRating }}\n    <watch-button [talk]=\"talk\"></watch-button>\n    <rate-button\
    \ [talk]=\"talk\" (click)=\"onRate()\"></rate-button>\n  `\n})\nclass TalkCmp\
    \ {\n  @Input() talk: Talk;\n  @Output()...\n}\n```\n\n### Trade-offs\n\nSince\
    \ AOT is so advantageous, we recommend to use it in production. But, as with everything,\
    \ there are trade-offs. For Angular to be able to compile your application ahead\
    \ of time, the metadata has to be statically analyzable. For instance, the following\
    \ code will not work in the AOT mode:\n\n```typescript\n@Component({\n  selector:\
    \ 'talk-cmp',\n  template: () => window.hide ? 'hidden' :\n    '{{talk.title}}\
    \ {{talk.speaker}}\n    Rating: {{ talk.rating | formatRating }}\n    <watch-button\
    \ [talk]=\"talk\"></watch-button>\n    <rate-button [talk]=\"talk\" (click)=\"\
    onRate()\"></rate-button>'\n})\nclass TalkCmp {\n  //...\n}\n```\n\nThe `window.hide`\
    \ property will not be defined. So the compilation will fail to point out the\
    \ error. A lot of work has been done to make the compiler smarter, so it can understand\
    \ most of the day-to-day patterns you would use when building your application.\
    \ But certain things will never work, like the preceding example.\n\n## Chapter\
    \ 3. NgModules\n\n### Providers\n\nI'll cover providers and dependency injection\
    \ in Chapter 5, *Dependency Injection*. Here I'd like to just note that NgModules\
    \ can contain providers. And the providers of the imported modules are merged\
    \ with the target module's providers, left to right, that is, if multiple imported\
    \ modules define the same provider, the last module wins.\n\n```typescript\n@NgModule({\n\
    \  providers: [\n    Repository\n  ]\n})\nclass TalksModule {}\n\n@NgModule({\n\
    \  imports: [TalksModule]\n})\nclass AppModule {}\n```\n\n### Bootstrap\n\nTo\
    \ bootstrap an Angular application in the JIT mode, you pass a module to `bootstrapModule`:\n\
    \n```typescript\nimport {platformBrowserDynamic} from '@angular/platform-browser';\n\
    import {AppModule} from './app';\n\nplatformBrowserDynamic().bootstrapModule(AppModule);\n\
    ```\n\nThis will compile `AppModule` into a module factory and then use the factory\
    \ to instantiate the module. If you use AOT, you may need to provide the factory\
    \ yourself:\n\n```typescript\nimport {platformBrowser} from '@angular/platform-browser';\n\
    import {AppModuleNgFactory} from './app.ngfactory';\n\nplatformBrowser().bootstrapModuleFactory(AppModuleNgFactory);\n\
    ```\n\nI said \"may need to\" because the CLI and the WebPack plugin take care\
    \ of it for you. They will replace the `bootstrapModule` call with `bootstrapModuleFactory`\
    \ when needed.\n\n### Lazy loading\n\nAs I mentioned earlier, NgModules are not\
    \ just the units of compilation, they are also the units of distribution. That\
    \ is why we bootstrap an NgModule, and not a component—we don't distribute components,\
    \ we distribute modules. And that's why we lazy load NgModules as well.\n\n```typescript\n\
    import {NgModuleFactoryLoader, Injector} from '@angular/core';\n\nclass MyService\
    \ {\n    constructor(loader: NgModuleFactoryLoader, injector: Injector) {\n  \
    \      loader.load(\"mymodule\").then((f: NgModuleFactory) => {\n            const\
    \ moduleRef = f.create(injector);\n            moduleRef.injector; // module injector\n\
    \            moduleRef.componentFactoryResolver; // all the component factories\
    \ of the lazy-loaded module\n        });\n    }\n}\n```\n\nThe loader compiles\
    \ the modules if the application is running in the JIT mode, and does not in the\
    \ AOT mode. The default loader that @angular/core ships with uses SystemJS, but,\
    \ as most things in Angular, you can provide your own.\n\n## Chapter 4. Components\
    \ and Directives\n\nTo build an Angular application you define a set of components,\
    \ for every UI element, screen, and route. An application will always have root\
    \ components (usually just one) that contain all other components. To make things\
    \ simpler, in this book let's assume the application has a single root component,\
    \ and thus our Angular application will have a component tree, that may look like\
    \ this:\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_20_0.png)\n\nAppCmp is the\
    \ root component. The FiltersCmp component has the speaker input and the filter\
    \ button. TalksCmp is the list you see at the bottom. And TalkCmp is an item in\
    \ that list. To understand what constitutes a component in Angular, let's look\
    \ closer at TalkCmp:\n\n```typescript\n@Component({\n  selector: 'talk-cmp',\n\
    \  template: `\n    {{talk.title}}  {{talk.speaker}}\n    {{talk.rating | formatRating\
    \ }}\n    <watch-button [talk]=\"talk\"></watch-button>\n    <rate-button [talk]=\"\
    talk\"></rate-button>\n  `\n})\nclass TalkCmp {\n  @Input() talk: Talk;\n  @Output()\
    \ rate: EventEmitter;\n  //...\n}\n```\n\n### Input and output properties\n\n\
    A component has input and output properties, which can be defined in the component\
    \ decorator or using property decorators.\n\n```typescript\nclass TalkCmp {\n\
    \  @Input() talk: Talk;\n  @Output() rate: EventEmitter;\n  //...\n}\n```\n\n\
    Data flows into a component via input properties. Data flows out of a component\
    \ via output properties, hence the names: input and output.\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_22_0.png)\n\
    \nInput and output properties are the public API of a component. You use them\
    \ when you instantiate a component in your application.\n\n```html\n<talk-cmp\
    \ [talk]=\"someExpr\" (rate)=\"onRate($event.rating)\"></talk-cmp>\n```\n\nYou\
    \ can set input properties using property bindings, through square brackets. You\
    \ can subscribe to output properties using event bindings, through parentheses.\n"
  mdcn: "\n# Angular 精要\n\nVictor Savkin, Jeff Cross\n\n由两位 Angular 核心贡献者撰写的关键方面概览\n\
    \n- 解析\n- 懒加载\n- 获取注入器\n- 可视化注入器树\n- 高级主题\n- 回顾\n- 7：变更检测\n  - 第 7 章：变更检测\n  -\
    \ 两个阶段\n  - 为什么？\n  - Angular 如何强制执行它？\n  - 内容和视图子节点\n  - ChangeDetectionStrategy.OnPush\n\
    \  - 回顾\n- 8：表单\n  - 第 8 章：表单\n  - 两个模块\n  - 高级概述\n  - 表单模型\n  - 表单指令\n  - DOM\n\
    \  - 总结\n- 9：测试\n  - 第 9 章：测试\n  - 隔离测试\n  - 浅层测试\n  - 集成测试\n  - Protractor 测试\n\
    \  - 回顾\n- 10：Angular 中的响应式编程\n  - 第 10 章：Angular 中的响应式编程\n  - 核心框架中的响应式编程\n \
    \ - Angular 生态系统中的响应式编程\n  - 摘要\n\n你可以在这里找到应用程序的源代码 https://github.com/vsavkin/essential-angular-book-app。\n\
    \n## 第 2 章 编译\n\nAngular 的核心是一个复杂的编译器，它接收一个 `NgModule` 类型并生成一个 `NgModuleFactory`。\n\
    \n![](img/79f67e6cb2f5bd357461768fccf131e0_5_0.png)\n\n`NgModule` 中声明了组件。在创建模块工厂时，编译器会获取模块中每个组件的模板，并利用已声明组件和管道的信息，生成一个组件工厂。组件工厂是一个\
    \ JavaScript 类，框架可以使用它来实例化组件。\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_6_0.png)\n\
    \n```\nNgModule\n\nComponent/Directive Types\n\nPipe Types\n\n...\n\nTemplate\n\
    \nComponent Factory\n```\n\n### 它是如何实现的？\n\n为什么我们之前没有在 Angular 1 中做到这一点？为了让 AOT\
    \ 工作，应用程序必须清晰地区分静态数据和动态数据。而且编译器的构建方式必须使其只依赖静态数据。在设计并构建 Angular 时，我们投入了大量精力来实现这一点。而类和装饰器这些新版本\
    \ JavaScript 和 TypeScript 支持的原始特性，让这一切变得容易得多。\n\n为了在实践中看到这种分离是如何工作的，让我们看下面的例子。在这里，装饰器中的信息是静态已知的。Angular\
    \ 知道 `talk` 组件的选择器和模板。它也知道该组件有一个名为 `talk` 的输入和一个名为 `rate` 的输出。但框架不知道构造函数或 `onRate`\
    \ 函数做了什么。\n\n```typescript\n@Component({\n  selector: 'talk-cmp',\n  template:\
    \ `\n    {{talk.title}} {{talk.speaker}}\n    Rating: {{ talk.rating | formatRating\
    \ }}\n    <watch-button [talk]=\"talk\"></watch-button>\n    <rate-button [talk]=\"\
    talk\" (click)=\"onRate()\"></rate-button>\n  `\n})\nclass TalkCmp {\n  @Input()\
    \ talk: Talk;\n  @Output()...\n}\n```\n\n### 权衡取舍\n\n由于 AOT 优势显著，我们建议在生产环境使用它。但与其他任何事情一样，也存在权衡取舍。为了让\
    \ Angular 能够提前编译你的应用程序，元数据必须是静态可分析的。例如，以下代码在 AOT 模式下将无法工作：\n\n```typescript\n\
    @Component({\n  selector: 'talk-cmp',\n  template: () => window.hide ? 'hidden'\
    \ :\n    '{{talk.title}} {{talk.speaker}}\n    Rating: {{ talk.rating | formatRating\
    \ }}\n    <watch-button [talk]=\"talk\"></watch-button>\n    <rate-button [talk]=\"\
    talk\" (click)=\"onRate()\"></rate-button>'\n})\nclass TalkCmp {\n  //...\n}\n\
    ```\n\n`window.hide` 属性不会被定义。因此编译将无法指出错误。为了让编译器变得更智能，我们做了大量工作，使其能够理解你在构建应用程序时使用的大多数日常模式。但某些东西永远不会奏效，比如前面的示例。\n\
    \n## 第 3 章 NgModules\n\n### 提供者（Providers）\n\n我将在第 5 章《*依赖注入*》中介绍提供者和依赖注入。这里我只想指出，NgModules\
    \ 可以包含提供者。并且导入模块的提供者会从左到右与目标模块的提供者合并，也就是说，如果多个导入模块定义了同一个提供者，最后一个模块胜出。\n\n```typescript\n\
    @NgModule({\n  providers: [\n    Repository\n  ]\n})\nclass TalksModule {}\n\n\
    @NgModule({\n  imports: [TalksModule]\n})\nclass AppModule {}\n```\n\n### 引导（Bootstrap）\n\
    \n要在 JIT 模式下引导 Angular 应用，你需要将一个模块传递给 `bootstrapModule`：\n\n```typescript\nimport\
    \ {platformBrowserDynamic} from '@angular/platform-browser';\nimport {AppModule}\
    \ from './app';\n\nplatformBrowserDynamic().bootstrapModule(AppModule);\n```\n\
    \n这会将 `AppModule` 编译成模块工厂，然后使用该工厂实例化模块。如果你使用 AOT，可能需要自己提供工厂：\n\n```typescript\n\
    import {platformBrowser} from '@angular/platform-browser';\nimport {AppModuleNgFactory}\
    \ from './app.ngfactory';\n\nplatformBrowser().bootstrapModuleFactory(AppModuleNgFactory);\n\
    ```\n\n我说“可能需要”，是因为 CLI 和 WebPack 插件会替你处理这件事。必要时，它们会将对 `bootstrapModule` 的调用替换为\
    \ `bootstrapModuleFactory`。\n\n### 懒加载\n\n正如我之前提到的，NgModules 不仅仅是编译单元，它们也是分发单元。这就是为什么我们引导\
    \ NgModule，而不是组件——我们不分发组件，我们分发模块。这也是为什么我们也懒加载 NgModules。\n\n```typescript\nimport\
    \ {NgModuleFactoryLoader, Injector} from '@angular/core';\n\nclass MyService {\n\
    \    constructor(loader: NgModuleFactoryLoader, injector: Injector) {\n      \
    \  loader.load(\"mymodule\").then((f: NgModuleFactory) => {\n            const\
    \ moduleRef = f.create(injector);\n            moduleRef.injector; // module injector\n\
    \            moduleRef.componentFactoryResolver; // all the component factories\
    \ of the lazy-loaded module\n        });\n    }\n}\n```\n\n当应用程序运行在 JIT 模式时，加载器会编译模块；而在\
    \ AOT 模式下则不会。`@angular/core` 自带的默认加载器使用 SystemJS，但与 Angular 中的大多数东西一样，你可以提供自己的加载器。\n\
    \n## 第 4 章 组件与指令\n\n要构建一个 Angular 应用，你需要为每个 UI 元素、屏幕和路由定义一组组件。一个应用总是有根组件（通常只有一个），它包含所有其他组件。为了让事情更简单，在本书中我们假设应用只有一个根组件，因此我们的\
    \ Angular 应用将有一个组件树，可能看起来像这样：\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_20_0.png)\n\
    \nAppCmp 是根组件。FiltersCmp 组件具有 speaker 输入和 filter 按钮。TalksCmp 是你在底部看到的列表。TalkCmp\
    \ 是该列表中的一项。为了理解 Angular 中组件的构成，让我们仔细看看 TalkCmp：\n\n```typescript\n@Component({\n\
    \  selector: 'talk-cmp',\n  template: `\n    {{talk.title}}  {{talk.speaker}}\n\
    \    {{talk.rating | formatRating }}\n    <watch-button [talk]=\"talk\"></watch-button>\n\
    \    <rate-button [talk]=\"talk\"></rate-button>\n  `\n})\nclass TalkCmp {\n \
    \ @Input() talk: Talk;\n  @Output() rate: EventEmitter;\n  //...\n}\n```\n\n###\
    \ 输入和输出属性\n\n一个组件有输入和输出属性，它们可以在组件装饰器中定义，也可以使用属性装饰器定义。\n\n```typescript\nclass\
    \ TalkCmp {\n  @Input() talk: Talk;\n  @Output() rate: EventEmitter;\n  //...\n\
    }\n```\n\n数据通过输入属性流入组件。数据通过输出属性流出组件，因此得名：输入和输出。\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_22_0.png)\n\
    \n输入和输出属性是组件的公共 API。当你在应用中实例化组件时，会用到它们。\n\n```html\n<talk-cmp [talk]=\"someExpr\"\
    \ (rate)=\"onRate($event.rating)\"></talk-cmp>\n```\n\n你可以通过方括号使用属性绑定来设置输入属性。可以通过圆括号使用事件绑定来订阅输出属性。\n"
