  - "[PAGE 56]\n\n# ChangeDetectionStrategy.OnPush\n\nIf we use mutable objects that\
    \ are shared among multiple components, Angular cannot know about when those components\
    \ can be affected. A component can affect any other components in the system.\
    \ That is why, by default, Angular does not make any assumptions about what a\
    \ component depends upon. So it has be conservative and check every template of\
    \ every component on every browser event. Since the framework has to do it for\
