    # Let''s recap


    In this chapter we looked at four ways to test Angular components: isolated tests,
    shallow tests, integration tests, and protractor tests. Each of them have their
    time and place: isolated tests are a great way to test drive your components and
    test complex logic. Shallow tests are isolated tests on steroids, and they should
    be used when writing a meaningful test requires to render a component’s template.
    Finally, integration and protractor tests verify that a group of components and
    services (i.e., the application) work together.'
