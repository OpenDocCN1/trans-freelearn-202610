  - "[PAGE 9]\n\n# # How is it possible?\n\nWhy did not we do it before, in Angular\
    \ 1? To make AOT work the application has to have a clear separation of the static\
    \ and dynamic data in the application. And the compiler has to built in such a\
    \ way that it only depends on the static data. When designing and building Angular\
    \ we put a lot of effort to do exactly that. And such primitives as classes and\
    \ decorators, which the new versions of JavaScript and TypeScript support, made\
    \ it way easier.\n\nTo see how this separation works in practice, let's look at\
    \ the following example. Here, the information in the decorator is known statically.\
    \ Angular knows the selector and the template of the `talk` component. It also\
    \ knows that the component has an input called `talk` and an output called `rate`.\
    \ But the framework does not know what the constructor or the `onRate` function\
    \ do.\n\n```\n```typescript\n@Component({\n  selector: 'talk-cmp',\n  template:\n\
    \    {{talk.title}} {{talk.speaker}}\n    Rating: {{ talk.rating | formatRating\
    \ }}\n    <watch-button [talk]=\"talk\"></watch-button>\n    <rate-button [talk]=\"\
    talk\" (click)=\"onRate()\"></rate-button>\n})\nclass TalkCmp {\n  @Input() talk:\
    \ Talk;\n  @Output()...\n}\n```\n```"
  - "[PAGE 10]\n\n# # Trade-offs\n\nSince AOT is so advantageous, we recommend to\
    \ use it in production. But, as with everything, there are trade-offs. For Angular\
    \ to be able to compile your application ahead of time, the metadata has to be\
    \ statically analyzable. For instance, the following code will not work in the\
    \ AOT mode:\n\n```\n```typescript\n@Component({\n  selector: 'talk-cmp',\n  template:\
    \ () => window.hide ? 'hidden' :\n    '{{talk.title}} {{talk.speaker}}\n    Rating:\
    \ {{ talk.rating | formatRating }}\n    <watch-button [talk]=\"talk\"></watch-button>\n\
    \    <rate-button [talk]=\"talk\" (click)=\"onRate()\"></rate-button>'\n})\nclass\
    \ TalkCmp {\n  //...\n}\n```\n```\n\nThe `window.hide` property will not be defined.\
    \ So the compilation will fail to point out the error. A lot of work has been\
    \ done to make the compiler smarter, so it can understand most of the day-to-day\
    \ patterns you would use when building your application. But certain things will\
    \ never work, like the preceding example."
