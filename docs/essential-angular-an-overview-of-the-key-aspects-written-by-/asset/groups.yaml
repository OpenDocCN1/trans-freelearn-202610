    \ 中注册它。\n\n## 懒加载\n\n一旦开始使用懒加载，设置就会变得更复杂。\n\n懒加载一个模块类似于引导一个模块，因为它会从该模块创建一个新的注入器并将其插入到注入器树中。为了亲眼看到它，让我们更新我们的应用程序以懒加载\
    \ talks 模块。\n\n```typescript\n@NgModule({\n  declarations: [AppCmp],\n  imports:\
    \ [RouterModule.forRoot([\n    {path: 'talks', loadChildren: 'talks'}\n  ])]\n\
    })\nclass AppModule { }\n\n@NgModule({\n  declarations: [FormattedRatingPipe,\
    \ WatchButtonCmp, \n    RateButtonCmp, TalkCmp, TalksCmp],\n  entryComponents:\
    \ [TalksCmp],\n  providers: [TalksAppBackend],\n  imports: [RouterModule.forChild([\n\
    \    {path: '', component: TalksCmp}\n  ])]\n})\nclass TalksModule { }\n```\n\n\
    有了这个更改，注入器树将如下所示：\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_43_0.png)\n\n##\
    \ 获取注入器\n\n你可以使用 `ng.probe` 来探测与页面上元素关联的注入器。当抛出异常时，你也可以看到元素的注入器。\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_44_0.png)\n\
    \n右键单击这些对象中的任何一个，将它们存储为全局变量，以便你可以在控制台中与它们交互。\n\n## 高级主题\n\n### 控制可见性\n\n你可以更具体地指定想要从哪里获取依赖。例如，你可以请求同一元素上的另一个指令。\n\
    \n```typescript\nclass CustomInputComponent {\n  constructor(@Self() f: FormatterDirective)\
    \ {}\n}\n```\n\n或者你可以请求同一模板中的指令，也就是说，你只能注入来自同一 HTML 文件的祖先指令。\n\n```typescript\n\
    class CustomInputComponent {\n  constructor(@Host() f: CustomForm) {}\n}\n```\n\
    \n最后，你可以要求跳过当前元素，这对于装饰现有提供者或构建树状结构非常有用。\n\n```typescript\nclass SomeComponent\
    \ {\n  constructor(@SkipSelf() ancestor: SomeComponent) {}\n}\n```\n\n### 可选依赖\n\
    \n要将依赖标记为可选，请使用 Optional 装饰器。\n\n```typescript\nclass Login {\n  constructor(@Optional()\
    \ service: LoginService) {}\n}\n```\n\n## 第 7 章. 变更检测\n\n### 两个阶段\n\nAngular 将更新应用程序模型和在视图中反映模型状态这两个操作分离为两个不同的阶段。开发者负责更新应用程序模型。Angular\
    \ 通过绑定，借助变更检测，负责在视图中反映模型的状态。框架会在每个 VM 轮转时自动执行此操作。\n\n**事件绑定**，可以使用 () 语法添加，可用于捕获浏览器事件或组件输出以在组件或指令上执行某些函数。因此它们通常会触发第一阶段。\n\
    \n**属性绑定**，可以使用 [] 语法添加，应仅用于在视图中反映模型的状态。\n\n正如我们所学，Angular 应用程序由嵌套组件组成，因此它总是有组件树。假设对于此应用，它如下所示：\n\
    \n![](img/79f67e6cb2f5bd357461768fccf131e0_50_0.png)\n\n接下来，定义将存储我们应用程序状态的应用程序模型。\n\
    \n```json\n{\n  \"filters\": {\"speakers\": \"Rich Hickey\"},\n  \"talks\": [\n\
    \    {\n      \"id\":898,\n      \"title\": \"Are we there yet\",\n      \"speaker\"\
    : \"Rich Hickey\",\n      ...\n```\n\n### Angular 如何强制执行它？\n\n如果我尝试破坏这种分离会怎样？如果我尝试在由变更检测系统调用的\
    \ setter 中更改应用程序模型会怎样？\n\nAngular 会尝试确保我们为组件定义的 setter 仅更新此组件或其子组件的视图状态，而不更新应用程序模型。为此，Angular\
    \ 在开发者模式下会检查所有绑定两次。第一次传播更改，第二次确保没有更改。如果在第二次遍历中发现更改，则意味着我们的某个 setter 更新了应用程序模型；框架会抛出异常，指出违规发生的位置。\n\
    \n```typescript\n, </tabs>\n})\nclass CmpUsingTabs {\n}\n```\n\n`tabs` 组件的内容子项是三个\
    \ ...\n\n### ChangeDetectionStrategy.OnPush\n\n如果我们使用在多个组件之间共享的可变对象，Angular 就无法知道这些组件何时可能受到影响。一个组件可能会影响系统中的任何其他组件。这就是为什么默认情况下，Angular\
    \ 不对组件依赖于什么做任何假设。因此它必须保守，并在每次浏览器事件时检查每个组件的每个模板。由于框架必须为每个组件执行此操作，即使新版本的 Angular\
    \ 中的变更检测速度快了很多，它也可能成为性能问题。\n\n如果我们的应用程序模型状态使用不可变对象，如前例所示，我们就可以知道谈话组件何时可能发生变化。组件仅在任何输入发生变化时才会发生变化。我们可以通过将变更检测策略设置为\
    \ OnPush 来将此信息传达给 Angular。\n\n```typescript\n@Component({\n  selector: 'talk',\n\
    \  template: `\n    {{talk.title}} {{talk.speaker}}\n    {{talk.rating | formatRating}}\n\
    \    <watch-button [talk]=\"talk\"></watch-button>\n    <rate-button [talk]=\"\
    talk\" (rate)=\"handleRate($event)\">\n    ...\n```\n\n## 两个模块\n\n在 AngularJS\
    \ 1.x 中，`ng-model` 指令被烘焙到核心框架中。这已不再如此。`@angular/core` 包不包含表单处理库。它只提供了我们可以用来构建它的关键原语。\n\
    \n当然，让每个人都自己构建是不切实际的。这就是 Angular 团队构建了 `@angular/forms` 包的原因，其中包含两个模块：`FormsModule`\
    \ 和 `ReactiveFormsModule`。\n\n`FormsModule` 实现了 AngularJS 风格的表单处理。我们通过在模板中放置指令来创建表单。然后我们使用数据绑定将数据传入和传出该表单。\n\
    \n`ReactiveFormsModule` 是处理输入的另一种方法，我们在组件类中定义表单，然后将其绑定到模板中的元素。我们倾向于使用响应式编程将数据传入和传出表单，因此得名“reactive”。\n\
    \n乍一看，这两个模块似乎非常不同。但一旦我们理解了底层机制，我们就会看到它们有多少共同点。此外，它还会让我们了解如果需要如何构建自己的表单处理模块。\n\n\
    ## 应用模型\n\n应用模型是由应用程序开发者提供的对象。它可以是从服务器获取的 JSON 对象，也可以是在客户端构造的某些对象。Angular 对此没有任何假设。\n\
    \n## 表单模型\n\n表单模型是表单的与 UI 无关的表示。它由三个构建块组成：FormControl、FormGroup 和 FormArray。我们将在本章后面详细介绍表单模型。FormsModule\
    \ 和 ReactiveFormsModule 都使用此模型。\n\n## 表单指令\n\n这些是连接表单模型与 DOM 的指令（例如 NgModel）。FormsModule\
    \ 和 ReactiveFormsModule 提供不同的指令集。\n\n## DOM\n\n这些是我们的输入框、复选框和单选按钮。\n\n"
