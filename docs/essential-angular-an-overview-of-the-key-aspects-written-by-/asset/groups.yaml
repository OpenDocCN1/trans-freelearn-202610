    # # What about directives?


    If you are familiar with Angular 1, you must be wondering "What happened to directives?".


    Actually, directives are still here in Angular. The component is just the most
    important type of a directive, but not the only one. A component is a directive
    with a template. But you can still write decorator-style directives, which do
    not have templates.'
