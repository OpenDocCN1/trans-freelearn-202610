  - '[PAGE 17]


    # # Bootstrap


    To bootstrap an Angular application in the JIT mode, you pass a module to `bootstrapModule`:


    ```

    import {platformBrowserDynamic} from ''@angular/platform-browser'';

    import {AppModule} from ''./app'';


    platformBrowserDynamic().bootstrapModule(AppModule);

    ```


    This will compile `AppModule` into a module factory and then use the factory to
    instantiate the module. If you use AOT, you may need to provide the factory yourself:


    ```

    import {platformBrowser} from ''@angular/platform-browser'';

    import {AppModuleNgFactory} from ''./app.ngfactory'';


    platformBrowser().bootstrapModuleFactory(AppModuleNgFactory);

    ```


    I said "may need to" because the CLI and the WebPack plugin take care of it for
    you. They will replace the `bootstrapModule` call with `bootstrapModuleFactory`
    when needed.'
  - "[PAGE 18]\n\n# Lazy loading\n\nAs I mentioned earlier NgModules are not just\
    \ the units of compilation, they are also the units of distribution. That is why\
    \ we bootstrap a NgModule, and not a component—we don't distribute components,\
    \ we distribute modules. And that's why we lazy load NgModules as well.\n\n```\n\
    import {NgModuleFactoryLoader, Injector} from '@angular/core';\n\nclass MyService\
    \ {\n    constructor(loader: NgModuleFactoryLoader, injector: Injecto\n    loader.load(\"\
    mymodule\").then((f: NgModuleFactory) => {\n        const moduleRef = f.create(injector);\n\
    \        moduleRef.injector; // module injector\n        moduleRef.componentFactoryResolver;\
    \ // all the \\\ncomponents factories of the lazy-loaded module\n    });\n   \
    \ }\n}\n```\n\nThe loader compiles the modules if the application is running in\
    \ the JIT mode, and does not in the AOT mode. The default loader @angular/core\
    \ ships with uses SystemJS, but, as most things in Angular, you can provide your\
    \ own."
