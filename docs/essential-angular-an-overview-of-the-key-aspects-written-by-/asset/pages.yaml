- pgno: 32
  md: "# Why templates?\n\nBefore we jump into how, let's talk about why.\n\nUsing\
    \ templates is aligned with the rule of least power, which is a useful design\
    \ principle.\n\n> the less powerful the language, the more you can do with the\
    \ data stored in that language. [...] I chose HTML not to be a programming language\
    \ because I wanted different programs to do different things with it: present\
    \ it differently, extract tables of contents, index it, and so on.\n> \n> —Tim\
    \ Berners-Lee, on the Principle of Least Power\n\n# Note\n\nFor the full article\n\
    refer https://www.w3.org/DesignIssues/Principles.html#PLP\n\nBecause templates\
    \ are pure HTML, and hence are constrained, tools and developers can make smart\
    \ assumptions about what components are and how they behave, and Angular can do\
    \ a lot of interesting things that would have not been possible if components\
    \ used JavaScript instead. Let's look at some of those.\n\n# Swapping implementations\n\
    \nPerformance is tricky: often it is hard to know ahead of time how well a particular\
    \ technique will work. In addition, what is performant right now may"
  merge: -1
  img_proc: true
