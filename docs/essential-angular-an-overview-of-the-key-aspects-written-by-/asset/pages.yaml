- pgno: 34
  md: "# Angular templates\n\nTemplates *can* be analyzable, transformable, and declarative\
    \ in a way that JavaScript *fundamentally* cannot be. When designing Angular we\
    \ put a lot of effort to make sure the template language has these properties.\
    \ Let's look at what we ended up with.\n\n# Property and event bindings\n\nInput\
    \ and output properties are the public API of a directive. Data flows into a directive\
    \ via its inputs and flows out via its outputs. We can update input properties\
    \ using property bindings. And we can subscribe to output properties using event\
    \ bindings.\n\nSay we have a component that renders a button that allows rating\
    \ a conference talk. We could use this component in our template as follows:\n\
    \n```\n<rate-button[talk]=\"myTalk\" (rate)=\"handleRate($event)\"></rate-\n```\n\
    \nThis tells Angular that whenever `myTalk` changes, Angular needs to automatically\
    \ update the `rate-button` component by calling the setter. This also tells Angular\
    \ that if an event called `rate` is fired, it should invoke `handleRate`.\n\n\
    Now, let's look at the `RateButtonCmp` class:\n\n```\n@Component({\n  selector:\
    \ 'rate-button',\n  templateUrl: './rate-button.component.html',\n  styleUrls:...\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Let''s recap


    That''s how Angular templates work. Let''s see if they are analyzable and transformable,
    and if they provide the benefits I talked about at the beginning of this chapter.


    Contrasting with Angular 1, there is a lot more the framework can tell about the
    template statically.


    For example, regardless of what the component element is, Angular knows that `name
    in [property1]="name"` is a field read and `name in property2="name"` is a string
    literal. It also knows that the `name` property cannot be updated by the component:
    property bindings update from the parent to the child. Similarly, Angular can
    tell what variables are defined in the template by just looking at `*ngFor`. Finally,
    it can tell apart the static and dynamic parts in the template.


    All of these allow us to reliably introspect and transform templates at compile
    time. That''s a powerful feature, that, for instance, the Angular i18n support
    is built upon.


    Having designed templates in this way, we also solved one of the biggest Angular
    1 problems: IDE support. When using Angular 1, editors and IDEs had to do a lot
    of guessing to provide completion, refactoring, and navigation....'
  merge: -1
  img_proc: true
- pgno: 36
  md: "# Chapter 6. Dependency Injection\n\nThe idea behind dependency injection is\
    \ very simple. If you have a component that depends on a service, you do not create\
    \ that service yourself. Instead, you request one in the constructor, and the\
    \ framework will provide you one. By doing so you can depend on interfaces rather\
    \ than concrete types. This leads to more decoupled code, which enables testability,\
    \ and other great things.\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_36_0.png)\n\
    \nAngular comes with a dependency injection system. To see how it can be used,\
    \ let's look at the following component, which renders a list of talks using the\
    \ for directive:\n\n```\n@Component({\n  selector: 'talks-cmp',\n  template: `\n\
    \    <h2>Talk s:</h2>\n    <talk *ngFor=\"let t of talks\" [talk]=\"t\"></talk>\n\
    \  `\n})\nclass TalksCmp {\n  constructor() { //..get the data }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 37
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 38
  md: "# Registering providers\n\nTo do that you need to register a provider, and\
    \ there are two places where you can do it. One is in the component decorator.\n\
    \n```\n@Component({\n  selector: 'talks-cmp',\n  template: `\n    <h2>Talks:</h2>\n\
    \    <talk *ngFor=\"let t of talks\" [talk]=\"t\"></talk>\n  `,\n  providers:\
    \ [TalksAppBackend]\n})\nclass TalksCmp {\n  constructor(backend:TalksAppBackend)\
    \ {\n    this.talks = backend.fetchTalks();\n  }\n}\n```\n\nAnd the other one\
    \ is in the module decorator.\n\n```\n@NgModule({\n  declarations: [FormattedRatingPipe,\
    \ WatchButtonCmp, \\\n    RateButtonCmp, TalkCmp, TalksCmp],\n  exports: [TalksCmp],\n\
    \  providers: [TalksAppBackend]\n})\nclass TalksModule {}\n```\n\nWhat is the\
    \ difference and which one should you prefer?\n\nGenerally, I recommend to register\
    \ providers at the module level when they do not depend on the DOM, components,\
    \ or directives. And only UI-related providers that have to be scoped to a particular\
    \ component should be registered at the component level. Since TalksAppBackend\
    \ has nothing to do with the UI, register it at the module level."
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Injector tree


    Now you know that the dependency injection configuration has two parts:


    +   - **Registering providers**: How and where an object should be created.

    +   - **Injecting dependencies**: What an object depends on.


    And everything an object depends on (services, directives, and elements) is injected
    into its constructor. To make this work the framework builds a tree of injectors.


    First, every DOM element with a component or a directive on it gets an injector.
    This injector contains the component instance, all the providers registered by
    the component, and a few "local" objects (for example, the element).


    Second, when bootstrapping an NgModule, Angular creates an injector using the
    module and the providers defined there.


    So the injector tree of the application will look like this:'
  merge: -1
  img_proc: true
