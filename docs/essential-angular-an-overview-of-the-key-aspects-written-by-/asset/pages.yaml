- pgno: 46
  md: "# Advanced topics\n\n# Controlling visibility\n\nYou can be more specific where\
    \ you want to get dependencies from. For instance, you can ask for another directive\
    \ on the same element.\n\n```\nclass CustomInputComponent {\n  constructor(@Self()\
    \ f: FormatterDirective) {}\n}\n```\n\nOr you can ask for a directive in the same\
    \ template, that is, you can only inject an ancestor directive from the same HTML\
    \ file.\n\n```\nclass CustomInputComponent {\n  constructor(@Host() f: CustomForm)\
    \ {}\n}\n```\n\nFinally, you can ask to skip the current element, which can be\
    \ handy for decorating existing providers or building up tree-like structures.\n\
    \n```\nclass SomeComponent {\n  constructor(@SkipSelf() ancestor: SomeComponent)\
    \ {}\n}\n```\n\n# Optional dependencies\n\nTo mark a dependency as optional, use\
    \ the Optional decorator.\n\n```\nclass Login {\n  constructor(@Optional() service:\
    \ LoginService) {}\n}\n```"
  merge: -1
