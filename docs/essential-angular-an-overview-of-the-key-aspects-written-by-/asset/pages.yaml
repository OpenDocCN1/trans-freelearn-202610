- pgno: 22
  md: "# # Input and output properties\n\nA component has input and output properties,\
    \ which can be defined in the component decorator or using property decorators.\n\
    \n```\nclass TalkCmp {\n  @Input() talk: Talk;\n  @Output() rate: EventEmitter;\n\
    \  //...\n}\n```\n\nData flows into a component via input properties. Data flows\
    \ out of a component via output properties, hence the names: input and output.\n\
    \n![](img/79f67e6cb2f5bd357461768fccf131e0_22_0.png)\n\nInput and output properties\
    \ are the public API of a component. You use them when you instantiate a component\
    \ in your application.\n\n```\n<talk-cmp[talk]=\"someExpr\"(rate)=\"onRate($event.rating)\"\
    ></talk-\n```\n\nYou can set input properties using property bindings, through\
    \ square brackets. You can subscribe to output properties using event bindings,\
    \ through parenthesis."
  merge: -1
