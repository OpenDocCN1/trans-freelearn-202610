- pgno: 25
  md: "# Providers\n\nA component can configure dependency injection by defining the\
    \ list of providers the component and its children may inject.\n\n```\n@Component({\n\
    \  selector: 'conf-app',\n  providers: [Logger]\n})\nclass AppCmp { //... }\n\n\
    @Component({\n  ...\n})\nclass TalksCmp {\n  constructor(logger:Logger) { //...\
    \ }\n}\n```\n\nIn this example, we have the logger service declared in the app\
    \ component, which makes them available in the whole application. The talks component\
    \ injects the logger service. I will cover dependency injection in detail in Chapter\
    \ 5, Dependency Injection. For now, just remember that components can configure\
    \ dependency injection."
