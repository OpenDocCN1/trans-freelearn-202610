- pgno: 24
  md: "# # Life cycle\n\nComponents have a well-defined life cycle, which you can\
    \ tap into. `TalkCmp` does not subscribe to any life cycle events, but some other\
    \ components can. For instance, this component will be notified when its input\
    \ properties change.\n\n```\n```typescript\n@Component({\n  selector: 'cares-about-changes'\n\
    })\nclass CaresAboutChanges implements OnChanges {\n  @Input() field1;\n  @Input()\
    \ field2;\n\n  ngOnChanges(changes) { //.. }\n}\n```\n```"
  merge: -1
