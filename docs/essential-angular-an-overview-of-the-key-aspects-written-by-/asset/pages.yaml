- pgno: 15
  md: "# Providers\n\nI'll cover providers and dependency injection in Chapter 5,\
    \ *Dependency Injection*. Here I'd like to just note that NgModules can contain\
    \ providers. And the providers of the imported modules are merged with the target\
    \ module's providers, left to right, that is, if multiple imported modules define\
    \ the same provider, the last module wins.\n\n```\n@NgModule({\n  providers: [\n\
    \    Repository\n  ]\n})\nclass TalksModule {}\n\n@NgModule({\n  imports: [TalksModule]\n\
    })\nclass AppModule {}\n```"
