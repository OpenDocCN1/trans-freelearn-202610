- pgno: 41
  md: "# Resolution\n\nAnd this is how the dependency resolution algorithm works:\n\
    \n```\n// this is pseudocode.\nlet inj = this;\nwhile (inj) {\n    if (inj.has(requestedDependency))\
    \ {\n        return inj.get(requestedDependency);\n    } else {\n        inj =\
    \ inj.parent;\n    }\n}\nthrow new NoProviderError(requestedDependency);\n```\n\
    \nWhen resolving the backend dependency of TalksCmp, Angular will start with the\
    \ injector of the talks component itself. Then, if it is unsuccessful, it will\
    \ climb up to the injector of the app component, and, finally, will move up to\
    \ the injector created from AppModule. That is why, for TalksAppBackend to be\
    \ resolved, you need to register it at TalkCmp, AppCmp, or AppModule."
  merge: -1
  img_proc: true
- pgno: 42
  md: "# Lazy loading\n\nThe setup gets more complex once you start using lazy-loading.\n\
    \nLazy-loading a module is akin to bootstrapping a module in that it creates a\
    \ new injector out of the module and plugs it into the injector tree. To see it\
    \ in action, let's update our application to load the talks module lazily.\n\n\
    ```\n```typescript\n@NgModule({\n  declarations: [AppCmp],\n  providers: [RouterModule.forRoot([\n\
    \    {path: 'talks', loadChildren: 'talks'}\n  ])]\n})\nclass AppModule { }\n\n\
    @NgModule({\n  declarations: [FormattedRatingPipe, WatchButtonCmp, \n    RateButtonCmp,\
    \ TalkCmp, TalksCmp],\n  entryComponents: [TalksCmp],\n  providers: [TalksAppBackend,\
    \ RouteModule.forChild([\n    {path: '', component: TalksCmp}\n  ])]\n})\nclass\
    \ TalksModule { }\n```\n```\n\nWith this change, the injector tree will look as\
    \ follows:"
  merge: -1
  img_proc: true
