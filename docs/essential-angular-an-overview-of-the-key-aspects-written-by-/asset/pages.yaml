  md: "# ChangeDetectionStrategy.OnPush\n\nIf we use mutable objects that are shared\
    \ among multiple components, Angular cannot know about when those components can\
    \ be affected. A component can affect any other components in the system. That\
    \ is why, by default, Angular does not make any assumptions about what a component\
    \ depends upon. So it has be conservative and check every template of every component\
    \ on every browser event. Since the framework has to do it for every component,\
    \ it might become a performance problem even though the change detection in the\
    \ new versions of Angular got way faster.\n\nIf our model application state uses\
    \ immutable objects, like in the preceding example, we can tell a lot more about\
    \ when the talk component can change. The component can change if and only if\
    \ any of its inputs changes. And we can communicate it to Angular by setting the\
    \ change detection strategy to OnPush.\n\n```\nComponent({\n  selector: 'talk',\n\
    \  template: `\n    {{talk.title}} {{talk.speaker}}\n    {{talk.rating | formatRating}}\n\
    \    <watch-button [talk]=\"talk\"></watch-button>\n    <rate-button [talk]=\"\
    talk\" (rate)=\"handleRate($event)\">\\\n    ...\n```"
