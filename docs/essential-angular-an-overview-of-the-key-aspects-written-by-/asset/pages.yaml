  md: "# # Chapter 4. Components and Directives\n\nTo build an Angular application\
    \ you define a set of components, for every UI element, screen, and route. An\
    \ application will always have root components (usually just one) that contain\
    \ all other components. To make things simpler, in this book let's assume the\
    \ application has a single root component, and thus our Angular application will\
    \ have a component tree, that may look like this:\n\n![](img/79f67e6cb2f5bd357461768fccf131e0_20_0.png)\n\
    \nAppCmp is the root component. The FiltersCmp component has the speaker input\
    \ and the filter button. TalksCmp is the list you see at the bottom. And TalkCmp\
    \ is an item in that list. To understand what constitutes a component in Angular,\
    \ let's look closer at TalkCmp:\n\n```\n```typescript\n@Component({\n  selector:\
    \ 'talk-cmp',\n  template: `\n    {{talk.title}}  {{talk.speaker}}\n    {{talk.rating\
    \ | formatRating }}\n    <watch-button [talk]=\"talk\"></watch-button>\n    <rate-button\
    \ [talk]=\"talk\"></rate-button>\n  `\n})\n```\n```"
  merge: -1
  img_proc: true
