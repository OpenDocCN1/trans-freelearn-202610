  \n## Summary\n\n我们希望你喜欢创建 Factly Skill。 与之前的技能一样，Factly Skill 仍有很大的改进空间。 例如，目前它只包含三个问题，可以扩展到\
  \ 30 个甚至 300 个问题，仅此一项就能将此技能转变为一个严肃的问答游戏。\n\n此外，我们只处理了两种意图。 我们可以扩展技能以处理更多意图，这些意图可以处理问题的重复以及用户其他类型的回复（例如，“我不知道”、“跳过”或“下一个问题”）。\n\
  \nDynamoDB 的持久性是我们在本章中引入并学习的全新内容，其本身的理念可以扩展为持久化多种内容，例如用户分数、用户进度和整体游戏状态。 我们将这些改进留给用户作为练习，以便进一步磨练他们的技能。\n\
  \n在下一章中，我们将进一步扩展我们的 Alexa 知识，通过创建一个更面向目前席卷全球的事物的 Alexa Skill。\n\n你能猜出那是什么吗？ 翻到下一章去寻找答案。\n"
- "## Making Alexa Talk About\nCryptoCurrencies\n\n> > “The future is here. It’s just\
  \ not widely distributed yet.”\n> >\n> > — William Gibson\n\n我们在上一章使用 Alexa 设计了一个名为\
  \ Factly 的问答游戏。 在本章中，正如我们所承诺的，我们将着手处理在本书撰写时席卷全球的事物，正如你可能从本章标题中猜到的那样，它就是加密货币。\n\n\
  在本章中，我们将构建一个名为 `CryptoOracle` 的 Skill（是的，我们明白这在语法、语义和 Alexa Skill 命名规则方面都是一个糟糕的命名选择，但由于我们暂时不会发布它，我们将坚持使用这个名字），它可以让\
  \ Alexa 谈论各种加密货币的最新价格。 本章将涵盖以下主题：\n\n- A Brief Introduction to Cryptocurrencies\n\
  - Designing the CryptoOracle skill\n- Building the CryptoOracle skill\n\n让我们开始吧。\n\
  \n## A Brief Introduction to Cryptocurrencies\n\n对于那些来晚了错过了比特币和其他类似加密货币在 2017 年及以后产生的巨大炒作的人来说：加密货币是数字/虚拟货币，也就是说，与美元、欧元或卢比等实体货币不同，加密货币通常只作为分布式数据库中的条目存在。\
  \ 各种加密技术被部署来记录加密货币交易及其生成，因此这些数字货币通常被称为加密货币。\n\n由于加密技术超出了本书的范围，我们在此不予介绍。\n\n截至撰写本章时，已有超过\
  \ 1,500 种加密货币可用，而这 1,500 种加密货币中更好的加密货币各有其独特用途。\n\n你可以通过导航到 CoinMarketCap https://coinmarketcap.com/\
  \ 来查看已知/交易的加密货币数量。\n\n一些加密货币被用作价值交换媒介，例如比特币、莱特币、门罗币和达世币。 其他加密货币，例如以太坊，用于驱动分布式系统，例如以太坊虚拟机：\n\
  \n| Currency | Purpose |\n|---|---|\n| Bitcoin | Medium of value exchange |\n| Monero\
  \ | Medium of value exchange focused on privacy |\n| Ethereum | Used to power the\
  \ Ethereum Virtual Machine |\n| Litecoin | Faster and improved version of Bitcoin\
  \ |\n\n加密货币之所以引起如此多的关注，一个主要原因是其价格的投机性。 加密货币价格像股票价格一样涨跌，这吸引了公众和投资者的大量关注，他们对价格进行投机。\n\
  \n请注意，本节中关于加密货币价格投机的信息仅用于向读者提供信息，并非投资建议。\n\n由于上述原因，加密货币已成为热门话题，因此我们决定将本章重点放在设计一个技能上，该技能可以帮助\
  \ Alexa 用户即时查询加密货币价格。\n\n## Designing the CryptoOracle skill\n\n现在我们知道了加密货币是什么以及为什么它们最近备受关注，我们可以设计\
  \ `CryptoOracle` 技能。\n\n`CryptoOracle` 将通过以下步骤工作：\n\n- 1. 用户启动技能：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_141_0.png)\n\
  \nFigure 5.1: Launching the CryptoOracle skill\n\n启动响应从 Lambda 获取并播放给用户，如上图所示。\n\
  \n- 2. 用户询问 Alexa 任何加密货币的价格：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_141_1.png)\n\
  \nFigure 5.2: Querying the cryptocurrency price via the CryptoOracle skill\n\n此请求将执行以下操作：\n\
  \n- 启动一个意图以获取价格，并将加密货币名称作为参数\n- Lambda 接收意图并提取加密货币名称\n- Lambda 使用货币名称通过 coinmarketcap\
  \ API 获取加密货币价格\n\n要了解有关 coinmarketcap API 的更多信息，请导航至 https://coinmarketcap.com/。\n\
  \n最后，包含加密货币价格的 Lambda 响应将播放给用户。\n\n3. 可选地，用户也可以在对话的任何时间点要求 CryptoOracle 停止/退出：\n\
