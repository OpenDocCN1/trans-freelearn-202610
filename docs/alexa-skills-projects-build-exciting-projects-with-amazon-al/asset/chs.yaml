  \ 部分下的 `cryptoOracleSkill` 框：\n\nFigure 5.29: Concluding the Lambda configuration\n\
  \n这应会打开一个代码编辑器，我们将在其中添加 Lambda 的代码。\n\n## Coding the Lambda function\n\n我们将在开发者门户本身的\
  \ index.js 文件中内联编辑代码：\n\n+   1. 实现 exports.handler 中的事件处理。我们的 Lambda 将处理两个基本请求：\n\
  \n- LaunchRequest：处理技能的启动\n- IntentRequest：处理各种意图（在我们的例子中我们只有两个意图，第一个是 fetchPrice\
  \ 意图，要求 Lambda 获取特定加密货币的价格，以及 AMAZON.StopIntent，表示退出技能）\n\n我们将首先对技能收到的每个请求进行分离。为此，声明以下处理器：\n\
  \n```\nexports.handler = function (event, context) {\n    try {\n        if (event.request.type\
  \ === \"LaunchRequest\") {\n        } else if (event.request.type === \"IntentRequest\"\
  ) {\n        }\n    } catch (e) {\n        context.fail(\"Exception: \" + e);\n\
  \    }\n};\n```\n\n如前述代码所示，这是我们如何分离启动和意图事件请求的方式。\n\n+   2. 定义一些帮助函数，以便帮助我们创建语音响应，如以下代码所示：\n\
  \n```\n// ------ Helper functions ------\n\nfunction buildSpeechletResponse(output,\
  \ repromptText, shouldEndSession) {\n    return {\n        outputSpeech: {\n   \
  \         type: \"PlainText\",\n            text: output\n        },\n        reprompt:\
  \ {\n            outputSpeech: {\n```\n\n\n\n\n```\ntype: \"PlainText\",\ntext:\
  \ repromptText\n},\n},\nshouldEndSession: shouldEndSession\n};\n}\n\nfunction buildResponse(sessionAttributes,\
  \ speechletResponse) {\nreturn {\nversion: \"1.0\",\nsessionAttributes: sessionAttributes,\n\
  response: speechletResponse\n};\n}\n```\n\n这些函数帮助 Lambda 在收到特定意图/输入时返回 Alexa 要说的响应。\n\
  \n`buildResponse` 函数将生成 Alexa 要发出的语音响应。\n\n`buildSpeechletResponse` 函数将指定 Alexa\
  \ 最终以纯文本形式说出的输出。它还需要一个 `shouldEndSession` 变量，该变量指定 Alexa 在响应后是否应该结束会话。\n\n3. 一旦我们配置了辅助函数，就可以更新\
  \ `LaunchRequest` 和 `IntentRequest` 用例的处理，让 Alexa 说出相关的响应：\n\n```\nexports.handler\
  \ = function (event, context) {\ntry {\nif (event.request.type === \"LaunchRequest\"\
  ) {\nonLaunch(event.request,\nevent.session,\nfunction callback(sessionAttributes,\n\
  speechletResponse) {\ncontext.succeed(buildResponse(sessionAttributes,\nspeechletResponse));\n\
  });\n} else if (event.request.type === \"IntentRequest\") {\n//TBD\n}\n} catch (e)\
  \ {\n```\n\n```\ncontext.fail(\"Exception: \" + e);\n}\n};\n```\n\n如前面的代码所示，当 Lambda\
  \ 收到 `LaunchRequest` 时，它将调用 `onLaunch` 方法发送欢迎消息：\n\n```\nfunction onLaunch(launchRequest,\
  \ session, callback) {\n    getWelcomeResponse(callback);\n}\n```\n\n我们将在下一步实现 `getWelcomeResponse`\
  \ 方法。单击屏幕右上角的 **Save** 按钮保存进度。\n\n+   4. `getWelcomeResponse` 方法负责制定启动响应：\n\n```\n\
  function getWelcomeResponse(callback) {\n    var sessionAttributes = {},\n     \
  \   speechOutput = \" Crypto Oracle can tell you latest prices of the hottest cryptocurrencies\"\
  ,\n        shouldEndSession = false,\n        repromptText = \"\";\n    callback(sessionAttributes,\n\
  \        buildSpeechletResponse(speechOutput, repromptText, shouldEndSession));\n\
  }\n```\n\n如前面的代码所示，该方法为启动消息制定了一个简单的纯文本响应。\n\n+   5. 在完成 `onLaunch` 方法的处理之后，我们现在将重点放在\
  \ `onIntent` 方法上，一旦 Lambda 收到 `IntentRequest`，就会调用该方法：\n\n```\nexports.handler =\
  \ function (event, context) {\n    try {\n        if (event.request.type === \"\
  LaunchRequest\") {\n            onLaunch(event.request,\n                event.session,\n\
  \                function callback(sessionAttributes, speechletResponse) {\n   \
  \             context.succeed(buildResponse(sessionAttributes, speechletResponse));\n\
  \            });\n```\n\n```\n} else if (event.request.type === \"IntentRequest\"\
  ) {\n    onIntent(event.request,\n        event.session,\n        function callback(sessionAttributes,\n\
  \        speechletResponse) {\n        context.succeed(buildResponse(sessionAttributes,\n\
  \        speechletResponse));\n        });\n    }\n} catch (e) {\n    context.fail(\"\
  Exception: \" + e);\n}\n};\n```\n\n`onIntent` 方法处理 CryptoOracle 技能引发的仅有的两个意图：\n\n\
  ```\nfunction onIntent(intentRequest, session, callback) {\n    var intent = intentRequest.intent,\n\
  \        intentName = intentRequest.intent.name;\n\n    if (\"fetchPrice\" === intentName)\
  \ {\n        handleRequest(intent, session, callback);\n    } else if (\"AMAZON.StopIntent\"\
  \ === intentName) {\n        handleFinishSessionRequest(intent, session, callback);\n\
  \    } else {\n        throw \"Invalid intent\";\n    }\n}\n```\n\n我们首先看看两者中较简单的\
  \ `AMAZON.StopIntent`，一旦用户决定提前结束技能执行，说出诸如“Alexa, stop CrypoOracle.”之类的短语时，就会引发该意图。这会导致调用\
  \ `handleFinishSessionRequest`：\n\n```\nfunction handleFinishSessionRequest(intent,\
  \ session, callback)\n{\n    callback(session.attributes,\n        buildSpeechletResponse(\"\
  CryptoOracle will Exit. Good bye!\", \"\", true));\n}\n```\n\n这会在技能退出前向用户说出告别短语。\n\
  \n6. `fetchPrice` 意图请求稍微复杂一些，因为它有多条信息流路径，由 `handleRequest` 方法处理：\n\n```\nfunction\
  \ handleRequest(intent, session, callback) {\n    console.log(\"INSIDE Handle Request\"\
  );\n    var options = {\n        host: 'api.coinmarketcap.com',\n        port: 443,\n\
  \        path: '/v1/ticker/' + intent.slots.currencyName.value +\n        \"/\"\
  ,\n        method: 'GET',\n        headers: {\n            'Content-Type': 'application/json'\n\
  \        }\n    };\n\n    var req = https.request(options, function (res) {\n  \
  \      res.setEncoding('utf-8');\n        var responseString = '';\n        res.on('data',\
  \ function (data) {\n            responseString += data;\n        });\n\n      \
  \  res.on('end', function () {\n            var resp = JSON.parse(responseString);\n\
  \            console.log(resp);\n            var sessionAttributes = {},\n     \
  \       speechOutput = \"The price of \" +\n            intent.slots.currencyName.value\
  \ + \" is . . \" +\n            resp[0].price_usd + \" dollars\",\n            shouldEndSession\
  \ = false,\n            repromptText = \"\";\n            callback(sessionAttributes,\n\
  \                buildSpeechletResponse(speechOutput, repromptText,\n          \
  \      shouldEndSession));\n        });\n    });\n\n    req.end();\n}\n```\n\n`handleRequest`\
  \ 方法从意图中提取槽位，并向 CoinMarketCap API 发出请求，然后 API 返回所请求加密货币的信息。\n\n如果你需要有关 CoinMarketCap\
  \ API 的更多信息，请访问 `https://coinmarketcap.com/`。\n\n最后，Lambda 将从 CoinMarketCap API\
  \ 接收到的信息解析并整理为语音响应。\n\n如你所见，前面的方法使用了 `https` 变量，该变量有助于从 CoinMarketCap API 检索信息；我们将在\
  \ `index.js` 文件的开头声明它，甚至在定义 `exports.handler` 之前：\n\n```javascript\nvar https =\
  \ require('https');\n```\n\n在 `index.js` 文件中添加了最后一段代码后，请单击屏幕右上角的 **Save** 按钮保存进度。\n\
  \n+   7. 我们需要将 Lambda 链接到我们的技能。为此，我们需要 Lambda 的 ARN。ARN 位于 Lambda 函数/代码编辑器页面的右上角：\n\
