- "# Alexa Skills Projects：Amazon Alexa 令人兴奋的项目构建指南与物联网集成\n\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_4_0.png)\n\
  \nmapt.io\n\nMapt 是一个在线数字图书馆，可让您完全访问超过 5,000 本书籍和视频，以及领先的行业工具，帮助您规划个人发展并推进您的职业生涯。如需更多信息，请访问我们的网站。\n\
  \n## 为什么订阅？\n\n- 使用来自 4,000 多名行业专业人士的实用电子书和视频，花更少的时间学习，花更多的时间编码\n- 使用专为你打造的技能计划改善学习\n\
  - 每月免费获得一本电子书或视频\n- Mapt 完全可搜索\n- 复制、粘贴、打印和书签内容\n\n## PacktPub.com\n\n您是否知道 Packt\
  \ 为每本出版的书籍提供电子书版本，提供 PDF 和 ePub 文件？您可以在 www.PactPub.com 升级到电子书版本，作为印刷书籍客户，您有权享受电子书副本的折扣。有关更多详细信息，请联系\
  \ service@packtpub.com。\n\n在 www.PacktPub.com，您还可以阅读大量免费技术文章，注册多种免费通讯，并获得 Packt\
  \ 书籍和电子书的独家折扣和优惠。\n\n## 关于审阅者\n\n**Srini Janarthanam** 是聊天机器人、NLP 和人工智能技术方面的专家，拥有超过\
  \ 10 年的经验。他获得了爱丁堡大学的博士学位。他曾在爱丁堡和赫里奥特-瓦特大学担任研究员，在那里他参与了多个研究项目并撰写了 50 多篇会议/期刊论文。他经营一家聊天机器人和人工智能解决方案机构\
  \ - Chatomate。他最近撰写了由 Packt 出版的书籍 *Hands On - Chatbots and Conversational UI Development*。\n\
  \n## Packt 正在寻找像您这样的作者\n\n如果您有兴趣成为 Packt 的作者，请访问 `authors.packtpub.com` 并立即申请。我们已与数千名开发人员和技术专业人士合作，就像您一样，帮助他们与全球技术社区分享他们的见解。您可以提交通用申请，申请我们正在招聘作者的特定热门主题，或提交您自己的想法。\n\
  \n## Preface\n\n近年来语音计算的兴起引发了地壳般的转变，其结果是交互式语音个人助理不再潜伏在阴影中，亚马逊 Alexa、Siri 和 Google\
  \ Now 已成为家喻户晓的名字。除了传统的移动设备栖息地之外，这些助理也可以在客厅和餐厅的中心找到，形式为亚马逊 Echo、Google Home 和 Apple\
  \ HomePod 设备。\n\n本书重点介绍通过研究 Alexa 来利用语音计算的力量，Alexa 是用于亚马逊 Echo 的交互式语音个人助理。在本书的整个过程中，我们将踏上了解\
  \ Alexa 内部工作原理的旅程，同时创建五个独特的 Alexa Skills，每个技能都将设计用于解决特定目的和现实世界用例。\n\n希望你喜欢这段旅程！\n\
  \n## Who this book is for\n\n本书面向所有对亚马逊 Echo 和 Alexa 所基于的底层语音计算技术感兴趣的人，以及学习如何利用该技术为\
  \ Alexa 创建面向家庭自动化、物联网和各种其他领域的技能的人。\n\n## What this book covers\n\n第 1 章，What Is\
  \ Alexa?，是一章入门章节，不需要任何编程技能。我们讨论智能语音激活个人助理如何从仅仅被动存在于手机中发展成为以专用硬件设备的形式永久存在于普通家庭中的固定装置。\n\
  \n第 2 章，Hello World, Alexa!，将向读者介绍为 Alexa 创建技能的过程，并将解释如何创建基本的 Hello World Alexa\
  \ 技能。\n\n第 3 章，Hands-Free Experience with Alexa，将介绍一种使用 Alexa 发送消息的新方式，即免提方式。\n\n\
  第 4 章，*Let’s Play Factly with Alexa*，将创建一个名为 Factly 的 Alexa 技能游戏。我们还将使用 DynamoDB\
  \ 为其添加持久性。\n\n第 5 章，*Making Alexa Talk about CryptoCurrencies*，将演示 Alexa 如何提供最新的加密货币更新。用户将创建一个\
  \ Alexa 技能，该技能可以获取最新加密货币（如比特币和以太坊）的当前价格。\n\n第 6 章，*Home Automation with Alexa*，将演示\
  \ Alexa 如何与其他物联网设备集成并创建智能家居的基础。用户将创建一个 Weather Monitor Alexa 技能，该技能可以告知用户家庭内的气候（温度/湿度/光照）。\n\
  \n第 7 章，*Future of Voice-Based Personal Assistants*，将讨论智能语音个人助理的未来。\n\n## To get\
  \ the most out of this book\n\n要充分利用本书，以下是先决条件：\n\n- 熟悉现代编程语言，例如 JavaScript。我们为\
  \ Lambdas 编写的全部代码都基于 Node.js。\n- 免费套餐 Amazon AWS 开发人员账户。\n- 熟悉代码编辑器。\n- 不是强制性的，但建议使用亚马逊\
  \ Alexa 启用的设备，例如亚马逊 Echo。\n- 在本书的整个过程中，我们将通过亚马逊开发者门户进行许多配置更改。我们建议您按照所述步骤进行操作，因此强烈建议您拥有良好的互联网连接。\n\
  \n## Download the example code files\n\n您可以从 www.packtpub.com 的账户下载本书的示例代码文件。如果您在其他地方购买了本书，您可以访问\
  \ www.packtpub.com/support 并注册以直接通过电子邮件接收文件。\n\n\n\n\n\n你可以按照以下步骤下载代码文件：\n\n- 1.\
  \ 在 `www.packtpub.com` 登录或注册。\n- 2. 选择 **SUPPORT**（支持）选项卡。\n- 3. 点击 **Code Downloads\
  \ & Errata**（代码下载与勘误）。\n- 4. 在 **Search**（搜索）框中输入书名，然后按照屏幕上的说明操作。\n\n文件下载后，请确保使用最新版本的解压软件解压或提取文件夹：\n\
  \n- Windows 使用 WinRAR/7-Zip\n- Mac 使用 Zipeg/iZip/UnRarX\n- Linux 使用 7-Zip/PeaZip\n\
  \n本书的代码包也托管在 GitHub 上，地址为 `https://github.com/PacktPublishing/Alexa-Skills-Projects`。如果代码有更新，将会在现有的\
  \ GitHub 仓库中更新。\n\n我们还有来自丰富的图书和视频目录中的其他代码包，可在 `https://github.com/PacktPublishing/`\
  \ 获取。快去看看吧！\n\n## 下载彩色图片\n\n我们还提供一份 PDF 文件，其中包含本书使用的截图/图表的彩色图片。你可以在这里下载：\n`http://www.packtpub.com/sites/default/files/downloads/AlexaSkillsProjects_ColorImages.pdf`\n\
  \n## 本书使用的约定\n\n本书通篇使用了多种文本约定。\n\n`CodeInText`：表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 Twitter 句柄。例如：“在控制台搜索栏中，搜索 Lambda，当它出现在自动建议列表中时点击它。”\n\n代码块如下所示：\n\n\
  ```\nbuildSpeechletResponse = (outputText, shouldEndSession) => {\n    return {\n\
  \        outputSpeech: {\n            type: \"PlainText\",\n            text: outputText\n\
  \        },\n        shouldEndSession: shouldEndSession\n    }\n}\n```\n\n当我们希望您注意代码块的特定部分时，相关行或项目会以粗体显示：\n\
  \n```\ngenerateResponse = (speechletResponse) => {\n    return {\n        version:\
  \ \"1.0\",\n        response: speechletResponse\n    }\n}\n```\n\n**粗体**：表示新术语、重要词语或您在屏幕上看到的词语。例如，菜单或对话框中的词语会以这样的形式出现在文本中。例如：“从\
  \ **Administration**（管理）面板中选择 **System info**（系统信息）。”\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_12_0.png)\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_12_1.png)\n\n## 联系我们\n\n我们始终欢迎读者的反馈。\n\
  \n**一般反馈**：发送邮件至 `feedback@packtpub.com`，并在邮件主题中注明书名。如果您对本书的任何方面有疑问，请发送邮件至 `questions@packtpub.com`。\n\
  \n**勘误**：尽管我们已竭尽全力确保内容的准确性，但错误仍在所难免。如果您在本书中发现了错误，我们将不胜感激，请您向我们报告。请访问 `www.packtpub.com/submit-errata`，选择您的图书，点击“Errata\
  \ Submission Form”链接，然后输入详细信息。\n\n**盗版**：如果您在互联网上以任何形式发现我们作品的非法副本，我们将不胜感激，请您提供位置地址或网站名称。请通过\
  \ `copyright@packtpub.com` 联系我们，并提供相关材料的链接。\n\n**如果您有兴趣成为作者**：如果您有擅长的主题，并且对撰写或参与编写一本书感兴趣，请访问\
  \ `authors.packtpub.com`。\n\n## 评论\n\n请留下评论。当您阅读并使用过本书后，为什么不在您购买本书的网站上留下评论呢？潜在的读者可以借此看到并参考您的客观意见来做购买决定，我们\
  \ Packt 可以了解您对我们产品的看法，我们的作者也可以看到您对他们著作的反馈。谢谢！\n\n有关 Packt 的更多信息，请访问 `packtpub.com`。\n"
- "## 什么是 Alexa？\n\n> *“我确实看到了语音的力量。它是一种非常强大的叙事形式。”*  \n> —— 阿基拉·博尔登-莫尼法\n\n对于我们的人类祖先来说，随着大脑的进化，语言也随之发展，从符号和声音到更复杂的有声语言形式，这使他们能够进行复杂的对话，从而形成生存所需的社会联系。与书面交流不同，有声语言不会留下自身的痕迹，因此历史学家很难计算出语言起源的确切日期。然而，历史学家通过多种方法推测，语言发展于30万年前，符号于3万年前，文字于7000年前。自那时起，人类一直将语言和声音用于各种创造性的用途。\n\
  \n在本章中，我们将探讨语音的一种此类用途——能够随意命令基于语音的交互式个人助理执行特定任务的能力。在此之前，我们还将通过以下主题了解什么是基于语音的智能个人助理、它能满足哪些需求，以及当前市场上有哪些基于语音的个人助理（包括\
  \ Alexa）：\n\n- 语音个人助理的需求\n- 语音个人助理的应用\n- 各种语音个人助理的比较\n\n那么，让我们进入第一个主题。\n\n## 语音个人助理的需求\n\
  \n要理解语音个人助理的演变，我们必须回到过去，看看促成其出现的一些重要事件。这些事件之一是计算机的演变。尽管与语音革命没有直接关系，但计算机的演变在语音个人助理的发展中发挥了关键作用，因为它标志着互联网的发明，而互联网是大多数语音个人助理的支柱。计算机革命还带来了有关硬件和集成电路的重大变革，我们将在下面讨论这些变革。\n\
  \n计算机革命始于19世纪，当时查尔斯·巴贝奇发明了第一台分析引擎，这为他赢得了“计算机之父”的称号。20世纪50年代和60年代是有趣的时代，集成电路这一开创性发明为计算机科学领域带来了巨大进步。集成电路取代了二极管和真空管，导致现有计算机的外观尺寸发生了巨大变化，进而使其变得更小、更紧凑。也是在那个时候，戈登·摩尔提出了他著名的观察：集成电路中的晶体管数量每两年翻一番；粗略地说，我们将能够在集成电路中封装越来越多的处理能力，而电路尺寸每两年就会缩小一次。摩尔的观察早已预见了我们技术和硬件的未来，遵循它，我们至少可以容易地预测一件事：我们会看到计算机变得越来越小，非常小，瞧，今天几乎每个人手中都有一台小型计算机——他们的智能手机。\n\
  \n60年代末和70年代初，高级研究计划局网络（ARPANET）也出现了，它最终演变成了我们在80年代所熟知的互联网。这一切起初听起来微不足道，但当你意识到这些都是关键因素时，如果没有它们被发明出来，我们永远不会看到语音个人助理的实际应用。\n\
  \n在语音个人助理出现之前，向计算机系统发送命令的传统方式要么是通过鼠标使用图形用户界面（GUI），要么是通过键盘使用终端。随着传统计算系统的外观尺寸缩小，输入方式也在演变，早期的手持设备/移动电话在传统键盘之外引入了手写笔，以利用设备的触摸屏功能：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_16_0.png)\n\n图 1.1：2010年拍摄的带手写笔的智能手机\n\
  \n演变仍在继续，正如史蒂夫·乔布斯所指出的，手写笔的位置被“世界上最好的指点设备”——我们的手指所取代。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_16_1.png)\n\
  \n2007年，史蒂夫·乔布斯在旧金山举行的MacWorld大会上，用“世界上最好的指点设备”来形容用户的手指，从而在iPhone上引入了触摸功能。这次大会的亮点可以在YouTube上观看：`https://www.youtube.com/watch?v=P-a_R6ewrmM`。\n\
  \n随着计算机与人类之间的界面变得越来越薄，语音自然地成为下一种能够作为计算设备输入工具的媒介，因此语音个人助理应运而生。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_16_2.png)\n\
  \n将语音作为计算设备输入媒介的想法并不新鲜；与计算机革命并行的是语音革命，其许多重要发现见链接：`https://voicebot.ai/2017/07/14/timeline-voice-assistants-short-history-voice-revolution/`\n\
  \n\n在语音革命的众多里程碑中，几乎每位读者都至少熟悉其中几个最新的里程碑，即 Siri、Google Now、Cortana 和亚马逊的 Alexa。其中最流行的是苹果的\
  \ Siri 和谷歌的 Google Now，它们最初分别与 iOS 和 Android 移动设备集成出现。\n\n苹果的 Siri 最初是作为 App Store\
  \ 上的一个应用出现的，但后来被苹果收购，并与 iOS 设备更加紧密地集成。Siri 使用自然语言界面来聆听用户的命令并执行必要的操作。此外，随着 macOS\
  \ Sierra 的到来，它的能力不再局限于 iOS 设备：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_17_0.png)\n\
  \n图 1.3：Siri 的功能不仅限于 iPhone，还扩展到桌面\n\n谷歌紧随苹果之后，在 2011 年 Siri 推出后不久，于 2012 年推出了 Google\
  \ Now。与 Siri 不同，Google Now 在 Android 上原生可用，同时也作为 iOS 设备的独立应用。Google Now 与 Gmail、Google\
  \ 日历和强大的 Google 搜索本身等 Android/Google 功能无缝集成：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_18_0.png)\n\
  \n图 1.4：Google Now 作为原生应用的一部分在 iOS 上可用（Google 和 Google 徽标是 Google Inc. 的注册商标，经许可使用。）\n\
  \n紧随谷歌之后的是微软，它推出了自己的智能语音助手 Cortana，并于 2014 年面向桌面和移动设备推出：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_18_1.png)\n\
  \n图 1.5：微软的 Cortana 最初是为微软的移动和桌面计算系统推出的\n\n随着时间的推移，很明显，基于语音的个人助理已经站稳脚跟，并且需要专属的硬件和空间。亚马逊在这方面率先采取了行动，推出了其品牌\
  \ Amazon Echo，这是一个智能音箱设备系列，由亚马逊公司专门设计和开发，使用户能够使用名为 *Alexa* 的交互式语音个人助理服务（这也是本章标题的由来）：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_19_0.png)\n\n图 1.6：Amazon Echo 设备系列\n\
  \n完整的 Echo 系列及其功能如下表所示：\n\n| 设备 | 用途 |\n|---|---|\n| Amazon Echo | 最初的旗舰智能音箱。 |\n\
  | Echo Dot | Echo 的更小、更便宜版本，没有放大扬声器，因此音质也不如 Echo。 |\n| Echo Plus | 最新版 Echo，集成了\
  \ Zigbee。 |\n| Echo Show | 支持 Alexa 的设备，配备大触摸屏，用户与 Alexa 的交互不仅是听觉的，还有视觉的。 |\n| Echo\
  \ Spot | *Show + Dot = Spot*。具备 Show 和 Dot 设备的全部基本功能，外形尺寸小得多。 |\n| Amazon Tap |\
  \ 支持 Alexa 的蓝牙音箱。 |\n\nEcho 系列标志着亚马逊第二次进军硬件领域，第一次是推出广受欢迎的电子书阅读器 Kindle。谷歌也认识到，交互式语音助手可以通过充分利用智能家居概念做更多事情，因此在亚马逊之后紧跟其后，推出了\
  \ Google Home 智能音箱，其中内置了与 Alexa 对应的 Google Assistant：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_20_0.png)\n\
  \n图 1.7：各种基于语音的个人助理的发布时间线（来源：www.citiusminds.com）\n\n请注意，上图不包括 2012 年推出的 Google\
  \ Now。\n\n我们已经讨论了基于语音的交互式个人助理的演变，以及它们如何从用户智能手机上的另一个应用发展成为用户智能家居的一部分。\n\n在下一节中，我们将讨论基于语音的交互式个人助理的一些常见用途。\n\
  \n## 基于语音的个人助理的应用\n\n我们在上一节讨论了基于语音的个人助理的演变。在本节中，我们将把讨论扩展到每个交互式语音个人助理的一些常见用途，无论该助理是基于桌面、智能手机还是智能家居。我们将从最早且最著名的助手之一——苹果的\
  \ Siri 开始。\n\n### Siri\n\n如前所述，Siri 最初是 2011 年为 iOS 推出的一款独立智能手机应用，后来被苹果收购。最初，Siri\
  \ 的能力仅限于智能手机和简单功能，例如：\n\n- 查找联系人\n- 消息（短信）\n- 按用户需求获取天气更新，以及上一节提到的其他简单查询\n\n然而，苹果的路线图还通过将\
  \ Siri 与第三方应用紧密集成来扩展其功能，并且正如承诺的那样，随着 iOS 10 的到来，苹果还发布了 SiriKit。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_21_0.png)\n\
  \n想了解更多关于 SiriKit 的信息，请访问 https://developer.apple.com/sirikit/。\n\n如果用户安装了以下第三方应用，可以使用\
  \ Siri 叫车：\n\n- Uber\n- Lyft\n\n如果用户安装了以下第三方应用，可以使用 Siri 设置这些应用发送消息（不仅仅是短信）：\n\n\
  - WhatsApp\n- LinkedIn\n- WeChat\n- Slack\n\n用户还可以通过 Siri 使用以下应用拨打 VoIP 电话：\n\n\
  - Skype\n- Viber\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_22_0.png)\n\n请注意，以上列表并非详尽无遗。然而，第三方集成并不是苹果扩展\
  \ Siri 功能路线图中的唯一内容。macOS Sierra 的发布也将 Siri 的功能带到了桌面。要了解有关 Siri 桌面功能的更多信息，请访问 https://support.apple.com/en-us/HT206993。\n\
  \nSiri 还可以帮助用户：\n\n- 在 Mac 上搜索文件\n- 通知用户其存储空间\n- 通过“通讯录”发起 FaceTime 请求，以及此处所示的许多其他功能：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_23_0.png)\n\n图 1.8：Siri 可以帮忙处理的事项列表（非详尽）（来源：www.osxdaily.com）\n\
  \n在了解了 Siri 的桌面和智能手机功能后，现在让我们继续介绍另一款流行的语音助手。\n\n### Google Now\n\n接下来我们将讨论 Android\
  \ 和 Google Now。在撰写本文时，Android 是智能手机市场上最大的参与者，也是 Google Now 的故乡——Google Now 是谷歌于\
  \ 2012 年为 Android 智能手机推出的语音助手。\n\n2010 年初，智能手机市场由许多参与者主导。多年后，市场逐渐筛选，如今只剩下两个主要参与者，如下图所示：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_24_0.png)\n\n图 1.9：2010 年至 2016 年智能手机市场份额分布对比（数据来源：Gartner）\n\
  \nGoogle Now 几乎可以完成 Siri 所能完成的一切；然而，它与网络和基于网络的查询有更好的集成，因为网络是谷歌的强项。用户可以问 Google Now\
  \ 的一些事情包括：\n\n| 类别 | 命令 |\n|---|---|\n| 一般命令 | • “什么是[薛定谔的猫]？”<br>• “谁发明了[互联网]？”<br>•\
  \ “发布到 Google+ [感觉很好]” |\n| 笔记和提醒 | • “设置[晚上8点]的闹钟”<br>• “自我提醒：[我把车停在D区]” |\n| 时间和日期\
  \ | • “[柏林]的时区是什么？”<br>• “家里的时间”<br>• “创建日历事件：[在餐厅用餐] [周六晚上8点]” |\n| 通信 | • “打电话给[Daniel]”<br>•\
  \ “[联系人姓名]”<br>• “给 Daniel 发[电子邮件]，[主题：会议]，[消息：5分钟内到]” |\n| 天气 | • “天气”<br>• “[明天/周五]会下雨吗？”<br>•\
  \ “[波士顿] [周三]的天气怎么样？” |\n| 地图和导航 | • “[弗拉格斯塔夫]的地图”<br>• “开车导航到[柏林]”<br>• “在地图上显示附近的[餐厅]”\
  \ |\n\n图 1.10：Google Now 可以做的部分事情（数据来源：www.cnet.com）\n\n除了 Google Now，谷歌还推出了 Google\
  \ Assistant，它是 Google Now 的更进化版本，因为用户可以与 Google Assistant 进行完整对话，而 Google Now 则无法做到这一点。\n\
  \n\n\n\n很可能 Google Now 将被逐步淘汰，取而代之的是 Google Assistant；然而，Google Assistant 目前仅可在\
  \ Google Home 上使用，Google Home 是 Google 的智能家居音箱；Android Pixel 2 智能手机；以及 Android Wear：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_26_0.png)\n\n图 1.11：可使用 Google Assistant\
  \ 的设备（Google 及 Google 标志是 Google Inc. 的注册商标，经许可使用。）\n\n现在，从智能手机市场转向桌面市场：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_27_0.png)\n\
  \n图 1.12：截至 2017 年 1 月的桌面市场份额（数据来源：www.windowscentral.com）\n\n如前图所示，截至 2017 年 1\
  \ 月，桌面市场的主要参与者有 Windows、Linux 和 Mac OS X，其中微软占据主导地位，这就引出了我们下一个个人助理。\n\n## Cortana\n\
  \n由于微软在桌面市场的明显主导地位，我们不能忽视 Cortana，它是微软对 Siri 和 Google Assistant 的回应，但专注于桌面和 Windows\
  \ Mobile：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_28_0.png)\n\n图 1.13：Cortana\
  \ 可以提供帮助的一些事项列表\n\nCortana 不仅限于 Windows 10、Windows 10 Mobile 和 Windows Phone 8.1，还可用于：\n\
  \n- iOS（作为独立应用）\n- Android（作为独立应用）\n- Xbox One\n- Harman Kardon 品牌的 Invoke 智能蓝牙音箱\n\
  \nCortana 可以完成的一些众多事项包括：\n\n- 使用 Bing Search 进行基于网络的查询（例如，“美国总统是谁？”）\n- 启动应用并打开/关闭\
  \ Wi-Fi/蓝牙\n- 询问天气\n- 管理约会、提醒和事件\n\n至此，我们来讨论本书的明星。\n\n## Alexa\n\nAlexa，本章和本书的核心，是亚马逊推出的基于交互式语音的个人助理，最初随其\
  \ Echo 设备系列推出。Alexa 作为助理以智能家居概念为导向，因此其大部分使用来自 Amazon Echo，一款专为放置在用户家中客厅而设计和开发的智能音箱，使用户可以向其询问日常天气、食谱和笑话等查询，或玩互动问答游戏、设置闹钟、购买日常用品等等。以下图表显示了用户可以向\
  \ Alexa 提出的一些事项：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_29_0.png)\n\n图 1.14：Alexa\
  \ 可以提供帮助的一些事项列表\n\nAlexa 的功能还可以通过安装第三方技能来扩展（类似于 Google Home 的第三方应用）。每个第三方技能都旨在服务于特定目的。例如，Uber\
  \ 技能允许您订车，Domino's 技能允许您订披萨——所有这些都可以在您舒适的家中通过您的声音与 Alexa 协同完成。\n\n截至撰写本文时，Alexa\
  \ 可用的技能已超过 15,000 种，其中 Uber 和 Lyft 在出行类别中是最常用的，Pandora 和 Spotify 用于音乐流媒体，还有多个其他技能用于家庭自动化。\n\
  \n## 各种基于语音的个人助理的比较\n\n由于之前的讨论，我们已经知道，无论是桌面、智能手机还是智能家居，每个市场都有稳定的交互式基于语音的个人助理供应。几乎每个助理都能完成其对应产品所能完成的功能，但这就引出了一个问题，实际差异在哪里？Alexa\
  \ 能做得比 Google Assistant 更好，还是反之？\n\n本书基于 Alexa，这是一款基于智能家居的个人助理，因此在本节中，我们将比较 Alexa\
  \ 和 Google Assistant，以了解两者之间的细微差异：\n\n| Alexa | Google Assistant |\n|---|---|\n\
  | 使用唤醒词，“Alexa” | 使用唤醒词，“OK, Google” |\n| 旗舰硬件——Amazon Echo 设备系列 | 旗舰硬件——Google\
  \ Home、Pixel 2、Android Wear |\n| 对电子商务/购物相关查询的响应略好，因为那是亚马逊的主要强项 | 对基于网络的查询响应略好，因为\
  \ Google 的主要强项是网络搜索 |\n| 上下文感知能力略逊 | 上下文感知能力更好，因此对话显得更自然一些 |\n| Alexa 的功能可以通过安装第三方“技能”来扩展\
  \ | Google Assistant 的功能可以通过安装第三方应用来扩展；然而，目前市场上为其提供的应用数量比 Alexa 的技能少 |\n| 与智能家居设备的集成范围更广，如智能灯、智能锁、智能开关和智能恒温器\
  \ | 与智能家居设备的集成范围略窄 |\n\n简而言之，Google 和 Alexa 都是非常出色的基于语音的助理，为用户提供了很多功能；然而，由于 Google\
  \ Assistant 在市场上相对较新，其与第三方应用和硬件的集成和兼容性仍在不断发展，尽管速度非常快。然而，即使是两者中更新的，Google Home 在网络集成和上下文感知方面仍然表现更好。\n\
  \n在未来时代，人工智能和机器学习的演进将带来什么，以及这些助理如何利用它，将是非常有趣的。\n\n## 总结\n\n在本章中，我们介绍了交互式基于语音的个人助理的演进以及其从用户智能手机转移到智能家居所涉及的各种因素。我们还看到了智能手机、桌面和智能家居市场中的各种交互式基于语音的个人助理，以及各自的功能。\n\
  \n我们的目标是让读者熟悉交互式基于语音的个人助理的历史，以便在本书的后续内容中，我们可以将重点放在 Alexa 上，即随 Amazon Echo 捆绑的交互式个人助理。下一章将使读者能够了解\
  \ Alexa Skill 的结构，并动手编程 Amazon Echo，以便 Alexa 学会说出计算机编程中最古老的短语之一，“Hello, World。”\n"
- "# 2\nHello World, Alexa!\n\n> “人声是灵魂的器官。”\n> \n> — Henry Wadsworth Longfellow\n\
  \n在上一章中，我们讨论了各种基于语音的个人助理的演进，讨论了各自的功能，并最终比较了两个重要的基于智能家居的个人助理，即 Alexa 和 Google Home。\n\
  \n在本章中，我们将专注于 Alexa。我们首先将了解 Amazon Echo，这款来自亚马逊的智能音箱，使用户能够与 Alexa 及其各种变体进行交互。随后，我们将学习\
  \ Alexa 的结构以及使其如此交互性的要素。我们将通过涵盖以下主题来实现这一点：\n\n- Amazon Echo 简介\n- Alexa Skill 的结构\n\
  - 构建 Hello World Alexa Skill\n\n我们将首先介绍 Amazon Echo，然后深入了解 Alexa 和 Alexa Skills\
  \ 的细节。\n\n## Amazon Echo 简介\n\n通常，Amazon Echo 一词与 Alexa 同义使用。然而，虽然两者相互关联，但它们指向非常不同的事物——Amazon\
  \ Echo 是实际的智能音箱（硬件），它是通往亚马逊 Alexa Skills 服务的网关，通过交互式基于语音的个人助理实现。\n\nAmazon Echo\
  \ 拥有完整的设备系列，因此有多种版本，所有这些都将在以下章节中讨论。\n\n## Amazon Echo – 第一代\n\nAmazon Echo 是亚马逊推出的原始第一代旗舰智能音箱。它需要无线互联网连接才能工作，因为其语音功能（Alexa）基于亚马逊的云计算服务：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_33_0.png)\n\nAmazon Echo 的初始设置可通过 Alexa\
  \ 移动应用完成，该应用适用于两个主要移动平台（iOS 和 Android），也可以通过 Alexa 网页门户完成。\n\n为了使其能够触及不同经济能力的用户，亚马逊推出了\
  \ Amazon Echo Dot，它是 Amazon Echo 的更小、更便宜的版本：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_33_1.png)\n\
  \n\n\n\nEcho Dot 旨在作为原始旗舰智能音箱 Echo 的一个更便宜、体积更小的替代品。与 Echo Dot 相比，原始 Echo 音箱之所以价格更高，是因为它确实拥有更清晰的声音和语音控制。\n\
  \n现在，让我们继续了解 Amazon Echo 家族的第二代产品。\n\n## Amazon Echo —— 第二代\n\nAmazon Echo 家族的第二代推出了更新的\
  \ Echo 设备，例如 Echo Plus、Echo Show 和 Echo Look。本章我们主要关注音箱产品：Amazon Echo 和 Amazon Echo\
  \ Dot：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_34_0.png)\n\n图 2.3：Amazon Echo\
  \ 2，第二代 Amazon Echo 音箱\n\n尽管第二代 Amazon Echo 的功能与第一代版本相同，但它拥有更清脆的音质、更小巧的尺寸（第二代 Echo\
  \ 的尺寸几乎是第一代的三分之二），当然，还有织物外壳。\n\nEcho 设备家族的第二代也对 Echo Dot 进行了全面改造，如下图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_35_0.png)\n\
  \n图 2.4：第二代 Echo Dot\n\n正如你会注意到的，主要变化是增加了两个音量控制按钮，取代了旧型号上的环形控制。此外，麦克风阵列的孔位略微增大，以提供更好的音质，并配有电源指示灯。\n\
  \n在本书中，我们将主要使用 Amazon Echo Dot 来测试我们创建的技能。\n\n如果您没有 Amazon Echo 设备，请不要担心。还有其他无需购买\
  \ Echo 硬件设备即可测试技能的方法。我们将在本书中逐步介绍这些方法。\n\n如果你已经拥有 Amazon Echo，或者方便购买一台来测试我们将编写的示例技能（尽管如前所述，我们还有其他方法来测试技能），那么设置过程很简单，即将你的\
  \ Amazon Echo 连接到互联网，并开始向 Alexa 发出命令，如下图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_36_0.png)\n\
  \n希望到现在，你已经清楚地了解了 Amazon Echo 到底是什么，以及 Amazon Echo 与 Alexa 之间的明显区别。在下一节中，我们将深入探究\
  \ Amazon Echo 的内部，剖析一个 Alexa 技能。\n\n## 剖析 Alexa 技能\n\n在本节中，我们将努力理解是什么让 Alexa（Amazon\
  \ Echo 内置的个人助理）如此聪明。Alexa 能够遵循并理解用户的语音命令，唯一的原因就是它拥有技能——这不仅是在字面意义上，更是在实际意义上。\n\n\
  Alexa 技能是一段实际的软件代码，专为单一目的而设计；也就是说，让 Alexa 完成特定任务。以下是一些示例：\n\n- 有一个 Alexa 技能可以从 Domino's\
  \ Pizza 订购比萨\n- 有一个 Alexa 技能可以召唤 Uber\n- 有一个 Alexa 技能可以订购鲜花\n- 有一个 Alexa 技能可以收听星座运势\n\
  \n自 2016 年以来，可用于 Alexa 的技能数量一直在稳步增长。截至 2018 年初，仅在美国，就有超过 30,000 个第三方技能可用于 Alexa：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_37_0.png)\n\n图 2.6：Alexa 第三方技能的增长统计\n\
  \n一旦用户按照上一节所示配置好 Amazon Echo 设备，安装/启用 Alexa 技能只需导航到 Alexa 应用或 Alexa 桌面门户，然后选择用户最喜欢的技能即可：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_38_0.png)\n\n类似地，用户可以通过应用中的**技能**侧边菜单导航到**你的技能**部分，然后选择**禁用**，来停用已激活的\
  \ Alexa 技能。\n\n简单来说，Alexa 技能可以比作教育专业方向。当用户在 Echo 上安装某个 Alexa 技能时，他/她正在让 Alexa 专门执行特定任务。在本章余下部分，我们将了解\
  \ Alexa 技能如何实现专业化。\n\n每个 Alexa 技能的核心包含以下组件：\n\n- 调用名称\n- 意图与槽位\n- Lambda\n\n我们将分别讨论它们。\n\
  \n## 调用名称\n\n调用名称是技能用户将说出的名称，Alexa 会使用它从已启用/可用技能列表中调用或识别你的技能。下面的屏幕截图显示了一个示例技能调用：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_39_0.png)\n\n图 2.8：使用调用名称启动技能\n\n请注意，在前面的示例中，我们使用了一个单词的调用名称，Alexa\
  \ 通常不允许这样做，除非该调用名称对你的品牌/IP 是唯一的。就 Spotify 而言，情况确实如此。亚马逊已经针对调用名称定义了各种规则，这些规则可以在亚马逊开发者门户上找到。\n\
  \n请访问以下链接，了解亚马逊对 Alexa 调用名称的要求：https://developer.amazon.com/docs/custom-skills/choose-the-invocation-name-for-a-custom-skill.html\n\
  \n按照上述关于话语中调用名称的规则，另一个示例技能调用话语如下面的屏幕截图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_39_1.png)\n\
  \n图 2.9：技能调用名称的剖析\n\n因此，每个 Alexa 技能都必须有一个调用名称，在接下来的部分中，我们的 Hello World Alexa 技能也将有一个。\n\
  \n## 意图与槽位\n\n单词 *意图*（Intent）源自 intention（意图），名副其实，它可以映射到 Alexa 技能的一项或多项功能。为了更好地理解意图，让我们将其映射到我们已知的事物，即常见的操作按钮。例如，电商应用或网页可能有一个**购买**按钮，点击该按钮将触发**购买动作**。在设计语音界面时，这种**购买动作**将转化为**购买意图**。稍后我们将讨论**购买意图**的常见用法。\n\
  \n有些意图/动作/功能几乎对每个技能都是通用的，因此它们已经为每个 Alexa 技能预先定义/预先配置好了。例如：\n\n- 帮助意图（Help Intent）\n\
  - 取消意图（Cancel Intent）\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_40_0.png)\n\n\
  要了解有关内置意图的更多信息，请访问 https://developer.amazon.com/docs/custom-skills/standard-built-in-intents.html。\n\
  \n每个意图都有一个唯一名称和一组示例话语映射。作为开发者，你可能会问：*为什么需要示例话语？* 原因非常简单——语音设计有点棘手，因为用户可能会对同一个动作/意图说多种不同的话。例如，对于购买动作/意图，用户可能会说出以下话语：\n\
  \n- 购买 [item-name]\n- 购入 [item-name]\n- 获取 [item-name]\n- 选择 [item-name]\n- 持有 [item-name]\n\
  \n为了解决这个问题，我们为意图设置了话语。一个意图拥有的话语越多，就越容易被调用。\n\n希望到现在你对意图已经有了相当的了解，接下来我们介绍**槽位（Slots）**：如果意图是一个动作，那么槽位就是该动作的参数。在前面提到的“购买动作/意图”示例中，*item-name*\
  \ 将是购买意图的参数，因此 *item-name* 是一个槽位。在接下来的章节中，我们将看到槽位如何与意图协同工作。\n\n## Lambda\n\nLambda\
  \ 是**亚马逊云服务（AWS）**提供的无服务器计算服务。如果这听起来像是很多技术行话，请不要困惑，我们将在本节详细讨论 Lambda。\n\n在 Alexa\
  \ 的语音设计语境中，我们将使用 AWS 以 Lambda 函数的形式托管我们的*核心编程逻辑*。现在，显而易见的问题是：*Lambda 如何与 Alexa 技能协同工作？*\
  \ 答案是，Alexa 技能上的每个意图/动作都会触发 Lambda 函数，Lambda 函数将处理这些意图，并针对该动作/意图返回适当的响应，如下图所示：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_41_0.png)\n\n其工作原理如下：\n\n1. 用户说出语音命令/查询：“Alexa，问一下天气监测器今天的天气。”\n\
  2. Alexa 从查询中识别要启动的技能，本例中是*天气监测器*。\n3. Alexa 根据话语识别相关意图：“*询问* [技能名称] *今天的天气*。”\n\
  4. 该意图由技能工具包识别，并路由到 Lambda。\n5. Lambda 处理该意图并返回适当的响应。\n\n在基本层面上，几乎所有的 Alexa 技能都通过上述五个步骤来运作。在下一节中，我们将在编写第一个技能时实际看到这五个步骤的应用。\n\
  \n\n\n\n## Hello Alexa – Building a Hello World Alexa Skill\n\n本节介绍本章的最终目标，即实际编写我们的第一个\
  \ Alexa Skill。然而，请注意，在我们踏上本章旅程的最后阶段之前，我们仍有一些先决条件。为了本练习的成功，每个用户都需要拥有一个 Amazon Developer\
  \ 账户。注册 Amazon Developer 账户是一个简单直接的过程。用户可以在 https://developer.amazon.com 上注册账户。\n\
  \n注册是一个三步流程，包括提供个人信息、接受服务条款以及提供付款方式。\n\n请注意，虽然注册要求您向 Amazon 提供付款方式，但 Amazon 仅在您最终使用任何付费服务时才会向您收费。然而，在本书的整个过程中，我们将把使用限制在免费层级，并且不会使用任何付费服务。\n\
  \n注册 Amazon Developer 账户不仅可以让您访问 Alexa Skills Kit，还可以访问 Amazon 的众多其他服务，例如 AWS 等。一旦成功登录，您就可以通过仪表板查看所有可用的服务：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_42_0.png)\n\n图 2.11：Amazon Developer\
  \ 账户仪表板（来源：developer.amazon.com）\n\n在完成注册流程后，我们现在可以踏上创建第一个 Alexa Skill 的旅程：\n\n\
  - 1. 请点击可用服务仪表板屏幕右上角的 Developer Console 选项按钮，如前所示。\n- 2. 在导航到 Developer Console\
  \ 后，请从顶部栏中列出的选项中选择 Alexa Skills Kit 选项，如以下屏幕截图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_43_0.png)\n\
  \n图 2.12：Alexa Skills Kit 仪表板（来源：developer.amazon.com）\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_45_0.png)\n\
  \n在我们的例子中，我们将使用名称 `Hello World Greeter`。这是用户在 Skills 商店浏览各种 Alexa Skills 时看到的名称。\n\
  \n请使用 Next 按钮进入下一屏幕，即模型选择屏幕：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_45_1.png)\n\
  \n请选择技能的 **Custom** 模型并点击屏幕右上角的 **Create skill** 按钮：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_46_0.png)\n\
  \n这应该会将我们带到前面屏幕截图所示的技能仪表板。如前所示，技能仪表板将帮助我们通过完成 **Skill builder checklist** 中显示的四个步骤来配置我们的技能。\n\
  \n6. 请点击 **Skill builder checklist** 下的 Invocation Name 部分以进入以下屏幕：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_48_0.png)\n\
  \n图 2.17：设置调用名称（来源：developer.amazon.com）\n\n请按前所示添加调用名称为 hello world greeter，然后点击\
  \ Save Model 按钮保存更改。完成后，请点击 Build 按钮再次返回 Skill builder checklist：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_49_0.png)\n\
  \n图 2.18：第一步完成（来源：developer.amazon.com）\n\n第一步现在应该已完成并标记为绿色。现在我们将为我们的技能设置一个意图。\n\
  \n7. 请点击 **Skill builder checklist** 下的 **Intents, Samples and Slots** 按钮：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_50_0.png)\n\
  \n图 2.19：创建 GreetHelloWorld 意图（来源：developer.amazon.com）\n\n请将意图名称添加为 `GreetHelloWorld`\
  \ 并点击 **Create custom intent** 按钮。\n\n虽然这并不明显，但意图是以 JSON 格式作为交互模型的一部分定义的。\n\n> 要了解有关\
  \ JSON 格式的更多信息，请访问 `https://www.json.org/`。\n\n8. 接下来，我们定义 `GreetHelloWorld` 意图的\
  \ **Sample Utterances**，如以下屏幕截图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_52_0.png)\n\
  \n图 2.20：GreetHelloWorld 意图的示例话语（来源：developer.amazon.com）\n\n请注意，我们没有定义任何槽位，因为此技能不需要。将在即将到来的章节中介绍槽位的使用。\n\
  \n请点击屏幕底部的 **Save Model** 按钮保存这些更改。最后，请点击 **Build** 选项卡再次返回 **Skill builder checklist**。在\
  \ **Skill builder checklist** 上，请点击 **Build Model** 按钮：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_53_0.png)\n\
  \n图 2.21：构建交互模型（来源：developer.amazon.com）\n\n在更改保存并实际构建/创建交互模型之前需要几秒钟。我们还不会进入下一步，而是先配置我们的\
  \ Lambda。原因将在接下来的步骤中变得明显。\n\n9. 一旦交互模型创建完成，我们将保持 **Skill builder checklist** 屏幕不变，并将重点放在创建\
  \ Lambda 上。然而，在此之前，请点击 **Skill builder checklist** 屏幕上的 **Endpoint** 按钮：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_54_0.png)\n\
  \n图 2.22：复制 AWS Lambda ARN（来源：developer.amazon.com）\n\n请选择 AWS Lambda ARN 并复制技能\
  \ ID 并保存在某处。我们将在接下来的步骤中需要此技能 ID。\n\n10. 现在，请打开一个新的浏览器标签页并导航到 AWS 控制台。\n\nAWS 控制台可以在\
  \ `https://console.aws.amazon.com` 找到。请注意，如果您还没有账户，您需要创建一个新账户。\n\n一旦您导航并成功登录 AWS\
  \ 控制台，您应该会看到类似于以下屏幕截图的内容：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_55_0.png)\n\
  \n图 2.23：在 AWS 服务控制台搜索 Lambda（来源：console.aws.amazon.com）\n\n在控制台搜索栏中，请搜索 `Lambda`，并在自动建议列表中出现时点击它。\n\
  \n- 11. 在下一个屏幕上选择 **Create a function**：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_55_1.png)\n\
  \n图 2.24：AWS Lambda 仪表板（来源：console.aws.amazon.com）\n\n12. 在下一个屏幕上，您可以选择从头开始编写 Lambda\
  \ 或从现有模板中选择。我们将选择 **Author from scratch**，因为这是我们的第一个技能，而且相对简单。此外，从头开始编写可以让我们对技能代码有稍大的了解：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_56_0.png)\n\n图 2.25：从头开始编写 Lambda 函数（来源：console.aws.amazon.com）\n\
  \n如前面的屏幕截图所示，我们的 Lambda 函数将命名为 `greeterHelloWorldSkill`，将使用 `Node.js (8.10)` 运行时，并具有现有的角色\
  \ **lambda_basic_execution**。请在填写必要详细信息后点击屏幕底部的 Create function。\n\n13. 一旦函数创建完成，您将被带到下一个屏幕，您可以在其中添加触发器。触发器是会激活我们\
  \ Lambda 的源：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_57_0.png)\n\n图 2.26：将 Alexa\
  \ Skills Kit 触发器添加到 Lambda（来源：console.aws.amazon.com）\n\n在我们的例子中，触发器是 Alexa Skills\
  \ Kit。请从左侧的触发器列表中选择它。\n\n请注意，如果您在左侧的触发器列表中找不到 Alexa Skills Kit，请确保您在屏幕左上角选择了区域为北弗吉尼亚\
  \ “(N. Virginia)” 。这是因为在撰写本文时，只有北弗吉尼亚区域托管 Alexa Skills Kit。\n\n\n\n\n设置好触发器后，我们现在需要对其进行配置。请复制上一步保存的**技能\
  \ ID**，并将其添加到技能验证部分，如下面的截图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_58_0.png)\n\
  \n技能 ID 验证可确保我们的 Lambda 只处理那些由我们实际想要交互的技能发送的查询。\n\n请点击屏幕右上角的**保存**按钮，并在设计器树中选择 **greeterHelloWorldSkill**：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_59_0.png)\n\n图 2.28：配置 Lambda（来源：console.aws.amazon.com）\n\
  \n现在，我们可以配置并开始编写 Lambda 了。\n\n- 14. 由于我们的技能非常简单，我们的 Lambda 将处理两个基本请求：\n    - LaunchRequest：处理技能的启动\n\
  \    - IntentRequest：处理各种意图（在本例中只有一个 GreetHelloWorldIntent，用于问候 Hello World）\n\n\
  我们将直接在开发者门户上进行内联代码编辑。我们首先要对技能收到的每个请求进行区分：\n\n```javascript\nexports.handler = (event,\
  \ context, callback) => {\n    switch (event.request.type) {\n        case \"LaunchRequest\"\
  :\n            break;\n        case \"IntentRequest\":\n            break;\n   \
  \ }\n}\n```\n\n如上面的代码所示，这就是我们对启动（launch）和意图（intent）事件请求进行区分的方法。\n\n- 15. 接下来，我们将定义一些辅助函数，来帮助我们创建语音响应：\n\
  \n```javascript\nbuildSpeechletResponse = (outputText, shouldEndSession) => {\n\
  \    return {\n        outputSpeech: {\n            type: \"PlainText\",\n     \
  \       text: outputText\n        },\n        shouldEndSession: shouldEndSession\n\
  \    }\n}\n\ngenerateResponse = (speechletResponse) => {\n    return {\n       \
  \ version: \"1.0\",\n        response: speechletResponse\n    }\n}\n```\n\n`generateResponse`\
  \ 函数将使用 `buildSpeechletResponse` 函数生成由 Lambda 函数返回的响应。`buildSpeechletResponse` 函数将以纯文本形式指定\
  \ Alexa 最终会输出的内容。它还需要一个变量 `shouldEndSession`，该变量指定 Alexa 是否应在响应后结束会话。\n\n- 16. 配置好辅助函数后，我们就可以更新\
  \ `LaunchRequest` 和 `IntentRequest` 分支，让 Alexa 说出相应的响应，如下面的代码所示：\n\n```javascript\n\
  exports.handler = (event, context, callback) => {\n    switch (event.request.type)\
  \ {\n        case \"LaunchRequest\":\n            context.succeed(generateResponse(buildSpeechletResponse(\"\
  Welcome to Hello World Greeter.\", false)))\n            break;\n        case \"\
  IntentRequest\":\n            switch (event.request.intent.name) {\n           \
  \     case \"GreetHelloWorld\":\n                    context.succeed(generateResponse(buildSpeechletResponse(\"\
  Hello World\", true)))\n                    break;\n            }\n            break;\n\
  \    }\n}\n```\n\n现在，当我们的 Lambda 收到 `LaunchRequest` 时，它可以返回一条欢迎消息，如前面的代码所示。此外，如果它收到\
  \ `IntentRequest`，它可以按意图名称进行筛选（虽然目前不需要筛选，因为我们只有一个自定义意图）。请点击屏幕右上角的**保存**按钮来保存进度。\n\
  \n- 17. 我们需要将 Lambda 与我们的技能关联，为此，我们需要 Lambda 的 ARN。\n\nARN 代表 Amazon Resource Name（亚马逊资源名称）。\n\
  \nARN 位于 Lambda 函数页面的右上角，如下面的截图所示（为保护隐私和安全，图中的 ARN 已做模糊处理）：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_62_0.png)\n\
  \n图 2.29：复制 ARN（来源：console.aws.amazon.com）\n\n复制 ARN 后，请切换回之前的浏览器标签页，我们之前在那里配置技能的交互模型。请选择**端点**（Endpoints）选项卡，并在**默认区域**（Default\
  \ Region）下输入 ARN，如下面的截图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_63_0.png)\n\
  \n图 2.30：将 Lambda 的 ARN 与技能关联（来源：developer.amazon.com）\n\n请点击**保存端点**（Save Endpoints），然后点击**构建**（Build）选项卡进入技能构建器检查清单。请重新构建模型。\n\
  \n- 18. 我们的设置已基本完成，可以测试 Hello World Greeter 技能了。该技能可以通过真实的 Amazon Echo 设备或 Amazon\
  \ Service Simulator（亚马逊服务模拟器）进行测试。我们首先将通过 Amazon Service Simulator 测试我们的技能。请点击“测试”选项卡启动模拟器，并通过拨动“测试开关”为技能启用测试：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_64_0.png)\n\n图 2.31：Alexa 测试模拟器（来源：developer.amazon.com）\n\
  \n请输入如下面截图所示的请求。Lambda 应为每个请求被调用，并返回以下响应：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_65_0.png)\n\
  \n图 2.32：服务模拟器中的 Lambda 响应（来源：developer.amazon.com）\n\n如果系统音量已打开，你甚至可以收听这些响应。\n\n\
  或者，你也可以使用 Amazon Echo 测试该技能。如果 Echo 已连接并设置好，当你说出：“Alexa, Launch Hello World Greeter,”\
  \ 时，它应该回答：“Welcome to Hello World Greeter.”。如果你接着让它“Say hi”或“Say something,”，它应该回答“Hello\
  \ World.”。\n\n至此，本章已接近尾声。\n\n请通过以下链接查看本章的 Lambda 代码：https://github.com/madhurbhargava/AlexaSkillsProjects/blob/master/Chapter2_HelloWorldGreeter_index.js\n\
  \n在下一节中，我们将总结已学内容，并展望后续章节。\n"
- "# 3 与 Alexa 的免提体验\n\n> “舌头能描绘出眼睛看不见的东西。”\n> \n> ——中国谚语\n\n在学习完 Echo 和 Alexa 的细节之后，我们转而设计一个基本的\
  \ Alexa 技能。我们还对基本 Alexa 技能的构成以及技能中各个活动部件如何交互有了一些了解。\n\n在本章中，我们将进一步提升设计技能，创建一个稍微高级一点的技能。这个技能名为\
  \ Handsfree Messenger，它允许用户仅使用 Alexa 和 Echo，无需与手机进行任何交互，就能以免提方式发送短信。除了用于托管 Lambda\
  \ 的 AWS 之外，我们还将使用一个名为 Twilio 的定制服务，该服务允许用户/开发者通过 Web 服务 API 以编程方式拨打/接听电话以及发送/接收文本消息。\n\
  \n在本章中，我们将通过涵盖以下主题来实现这一目标：\n\n- Handsfree Messenger 技能概述\n- 配置 Twilio 消息后端\n- 配置\
  \ Handsfree Messenger 技能\n\n闲话少说，让我们从该技能设计的概述开始。\n\n### Handsfree Messenger 技能概述\n\
  \n在继续设计 Handsfree Messenger 技能之前，我们需要了解几件事：\n\n- 系统的核心功能是什么？\n- 它有哪些活动部件？\n- 这些部件如何交互？\n\
  \nHandsfree Messenger 技能的工作方式如下：\n\n- 1. 用户将说出一个起始短语——“Alexa, Start Handsfree Messenger.”来启动\
  \ Alexa 技能。\n- 2. Alexa 将启动该技能。\n- 3. 用户将说出需要发送的实际消息：“Send message – Get milk!”\n\
  - 4. 现在，有趣的地方来了。当用户在前一步中说出实际消息时，将创建一个 `SendMessage` 意图，实际的消息文本将作为参数传递给该意图。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_68_0.png)\n\
  \n> 我们在前一章已经讨论过意图，因此我们假设读者已经熟悉意图及其功能。\n\n- 5. 该意图由 Lambda 处理，Lambda 从意图中提取消息，并将消息连同预期收件人的信息一起传递给\
  \ Twilio 后端。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_68_1.png)\n\n> 关于 Lambda\
  \ 与 Twilio 后端之间的通信细节，我们不会深入讨论，因为将在后续章节中介绍。\n\n\n\n\n\n6. Twilio 后端将接收到的消息传递给其预期接收者，并向\
  \ Lambda 传递确认响应。\n7. Lambda 接收到确认后，通过语音告知发送者短语 `Message sent.`。\n\n正如您从系统功能描述中已了解到的，这些是我们\
  \ Handsfree Messenger 技能的主要组成部分：\n\n- 实际的 Alexa 技能：Handsfree Messenger\n- 位于 AWS\
  \ 后端的技能 Lambda\n- Twilio 后端\n\n如果您将此技能与我们在上一章中创建的技能进行比较，那么由于它拥有更多组成部分，此技能会稍微复杂一些。\n\
  \nHandsfree Messenger 的 VUI 流程如下：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_69_0.png)\n\
  \nVUI 流程使用 Amazon 首选的模板来描述 Alexa 技能的 VUI 设计。然而，VUI 流程仅限于用户与 Alexa 的交互，因此，也许以图表形式概述功能步骤可以帮助您更好地理解\
  \ Handsfree Messenger 技能的工作原理：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_70_0.png)\n\
  \n上图概述了技能的基本使用方式；我们还可以将步骤压缩成流程图，以明确系统中信息的流向：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_71_0.png)\n\
  \n我们希望读者现在已经清楚我们的 HandsFree Messenger 技能的工作原理以及其所有组成部分如何交互。\n\n在下一节中，我们将开始配置技能的组成部分之一，即我们的\
  \ Twilio 后端。\n\n## 配置 Twilio 消息后端\n\nTwilio 是一个云通信平台，成立于 2007 年，总部位于旧金山。它允许用户/开发者以编程方式拨打/接听电话，并使用网络服务\
  \ API 发送/接收短信。本章中，我们仅演示其消息功能；不过，我们要求并期望读者通过添加电话呼叫功能作为家庭作业练习来扩展此技能的功能。\n\n要将 Twilio\
