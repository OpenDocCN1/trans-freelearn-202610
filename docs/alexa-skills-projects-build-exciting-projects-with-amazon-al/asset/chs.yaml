  ## 3.1 编写 Lambda 函数\n\n### 5.1 树的逻辑结构\n\n树是n（n≥0）个结点的有限集合，在任意一棵非空树中：\n\n+   1. 有且仅有一个特定的称为根的结点；\n\
  \n+   2. 当n>1时，其余结点可分为m（m>0）个互不相交的有限集合，其中每一个集合本身又是一棵树，并且称为根结点的子树。\n\n树的逻辑结构具有以下特点：\n\
  \n+   （1）树的根结点没有前驱结点，除根结点之外的所有结点有且只有一个前驱结点。\n\n+   （2）树中所有结点可以有零个或多个后继结点。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_85_0.png)\n\
  \n图5-1 树结构示意图\n\n## 编写 Lambda 函数\n\n一旦交互模型创建完成，我们将保持此屏幕不变，专注于创建 Lambda。\n\n+   1.\
  \ 请打开一个新的浏览器标签页，并导航到 AWS 控制台，其网址如下：\n\nAWS 控制台位于 https://console.aws.amazon.com。请注意，如果尚未创建账户，您可能需要创建一个新账户。\n\
  \n我们已经在第 2 章 *Hello World, Alexa!* 的“Hello Alexa – 构建 Hello World Alexa 技能”标题下的步骤\
  \ 8-12 中介绍了基本 Lambda 函数的创建，因此这里不再重复这些步骤。请按照这些步骤操作，将 Lambda 函数命名为 `handsFreeMessengerSkill`，并将技能\
  \ ID 与 Lambda 关联，如第 2 章 *Hello World, Alexa!* 的“Hello Alexa – 构建 Hello World Alexa\
  \ 技能”标题下所述。\n\n由于我们的技能非常简单，我们的 Lambda 将处理两个基本请求：\n\n- **启动请求**：用于处理技能启动\n- **意图请求**：用于处理各种意图（在我们的例子中，只有一个\
  \ `SendMessage`，用于发送实际的短信）\n\n我们将直接在开发者门户中的 `index.js` 文件中内联编辑代码。我们首先将技能接收到的每个请求进行分离。为此，请声明以下处理程序：\n\
  \n```\nexports.handler = function (event, context) {\n    try {\n        if (event.request.type\
  \ === \"LaunchRequest\") {\n        } else if (event.request.type === \"IntentRequest\"\
  ) {\n        }\n    } catch (e) {\n        context.fail(\"Exception: \" + e);\n\
  \    }\n};\n```\n\n这就是我们分离启动和意图事件请求的方式。\n\n2. 接下来，我们将定义一些辅助函数，帮助我们创建语音响应：\n\n```\n\
  //------Helper Methods------//\n\nfunction buildSpeechletResponse(output, shouldEndSession)\
  \ {\n    return {\n        outputSpeech: {\n            type: \"PlainText\",\n \
  \           text: output\n        },\n        shouldEndSession: shouldEndSession\n\
  \    };\n}\n\nfunction buildResponse(speechletResponse) {\n    return {\n      \
  \  version: \"1.0\",\n        response: speechletResponse\n    };\n}\n```\n\n这些函数帮助\
  \ Lambda 在收到特定意图/输入时返回 Alexa 要说的响应。\n\n`buildResponse` 函数将生成最终由 Alexa 说出的简明响应。\n\
  \n`buildSpeechletResponse` 函数将以纯文本形式指定 Alexa 最终要说的输出。它还接受另一个变量 `shouldEndSession`，该变量指定\
  \ Alexa 在响应后是否应结束会话。\n\n3. 配置好辅助函数后，我们可以更新 `LaunchRequest` 和 `IntentRequest` 情况的处理，让\
  \ Alexa 说出相应的响应，如下所示：\n\n```\nexports.handler = function (event, context) {\n  \
  \  try {\n        if (event.request.type === \"LaunchRequest\") {\n            onLaunch(function\
  \ callback(speechletResponse) {\n                context.succeed(buildResponse(speechletResponse));\n\
  \            });\n        } else if (event.request.type === \"IntentRequest\") {\n\
  \            onIntent(event.request,\n                function callback(speechletResponse)\
  \ {\n```\n\n```javascript\ncontext.succeed(buildResponse(speechletResponse));\n\
  });\n}\n} catch (e) {\n    context.fail(\"Exception: \" + e);\n}\n};\n```\n\n现在，当我们的\
  \ `Lambda` 收到 `LaunchRequest` 时，它将调用 `onLaunch` 方法发送欢迎消息，我们将在下一步中实现该方法。\n\n此外，如果收到\
  \ `IntentRequest`，它可以调用 `onIntent` 方法，该方法会进一步根据意图名称进行筛选（尽管目前不需要筛选，因为我们只有一个自定义意图）。\n\
  \n点击屏幕右上角的**保存**来保存进度。\n\n+   4. 我们现在将实现上一步讨论的 `onLaunch` 和 `onIntent` 方法：\n\n```\n\
  ```javascript\nfunction onLaunch(callback) {\n    var output = \"Welcome to HandsFree\
  \ Messenger.\";\n    var endSession = false;\n    callback(buildSpeechletResponse(output,\
  \ endSession));\n}\n\nfunction onIntent(intentRequest, callback) {\n    var intent\
  \ = intentRequest.intent,\n        intentName = intentRequest.intent.name;\n   \
  \ if(\"SendMessage\" === intentName){\n        var text = intent.slots.Text.value;\n\
  \        var recipient = '+31XXXXXXXXXX';\n        SendMessage(recipient, text,\
  \ callback);\n    } else {\n        throw \"Intent not recognized\";\n    }\n}\n\
  ```\n```\n\n`onLaunch` 方法很简单——它创建一条欢迎消息，并使用我们之前定义的辅助方法从该消息创建语音响应后将其发送回去。\n\n`onIntent`\
  \ 方法相对复杂一些——它根据意图名称筛选意图，如果意图是 `SendMessage`，则从槽位值中提取短信文本，然后通过 `SendMessage` 函数将其转发到接收者的硬编码手机号码。\n\
  \n我们将在接下来的步骤中定义 `SendMessage` 函数。\n\n+   5. `SendMessage` 函数是整个技能的核心。它负责将消息传递给 Twilio\
  \ 后端。然而，在定义 `SendMessage` 函数之前，我们需要声明一些与 Twilio API 交互时所需的常量。\n\n如果您还记得，我们在上一节的最后一步记下了\
  \ SID 和 Auth Token；现在是时候声明它们了。我们将在 `SendMessage` 函数中使用这些常量。请按如下所示声明这些变量：\n\n```\n\
  var sid = 'ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX';\nvar token = '4bXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX';\n\
  var sender = '+31XXXXXXXXXX';\n\nvar https = require('https');\nvar queryString\
  \ = require('querystring');\n```\n\n请在 AWS 开发者门户的 `index.js` 文件最顶部定义这些常量。定义完成后，开发者门户上的\
  \ `index.js` 文件应类似于下图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_89_0.png)\n\
  \n图 3.20：编写 Lambda 代码\n\n\n\n\n\n请注意，我们已将我们在上一节第 11 步中生成的同一个 Twilio 号码声明为发件人。\n\n\
  - 6. 常量准备就绪后，我们现在终于可以定义 SendMessage 函数：\n\n```\nfunction SendMessage(to, body, callback)\
  \ {\n    var message = {\n        To: to,\n        From: sender,\n        Body:\
  \ body\n    };\n    var messageString = queryString.stringify(message);\n    var\
  \ options = {\n        host: 'api.twilio.com',\n        port: 443,\n        path:\
  \ '/2010-04-01/Accounts/' + sid + '/Messages.json',\n        method: 'POST',\n \
  \       headers: {\n            'Content-Type': 'application/x-www-form-urlencoded',\n\
  \            'Content-Length': Buffer.byteLength(messageString),\n            'Authorization':\
  \ 'Basic ' + new Buffer(sid + ':' + token).toString('base64')\n        }\n    };\n\
  \    var req = https.request(options, function (res) {\n        res.setEncoding('utf-8');\n\
  \        var responseString = '';\n        res.on('data', function (data) {\n  \
  \          responseString += data;\n        });\n        res.on('end', function\
  \ () {\n            var speechOutput = \"Message sent.\";\n            var shouldEndSession\
  \ = true;\n            callback(buildSpeechletResponse(speechOutput, shouldEndSession));\n\
  \        });\n    });\n    req.write(messageString);\n    req.end();\n}\n```\n\n\
  这个函数做了很多事情。SendMessage 函数构造了一个消息对象，其中包含有关发件人、收件人和要发送的文本的信息。\n\n然后它使用 SID、AuthToken\
  \ 和消息字符串作为参数向 Twilio 后端发出请求。\n\n消息成功发送的标志是 Alexa 通过说出短语“Message sent.”来确认它。\n\n\
  在添加此代码后，请通过单击屏幕右上角的 Save 来保存您的进度。\n\n- 7. 现在，我们需要将 Lambda 链接到我们的技能，为此我们需要 Lambda\
  \ 的 Amazon 资源名称（ARN）。ARN 位于 Lambda 函数/代码编辑器页面的右上角。请复制 ARN，并在复制后，请导航到之前的浏览器标签页，在那里我们使用\
  \ Skill builder checklist 配置了技能的交互模型。请从 Skill builder checklist 中选择 Endpoint 部分以进入\
  \ Endpoint 屏幕：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_91_0.png)\n\n图 3.2.1：配置技能\n\
  \n请选择 **AWS Lambda ARN** 作为 **Service Endpoint Type** 并输入我们之前复制的 ARN（出于隐私和安全原因，前面的屏幕截图中已对其进行模糊处理），将此屏幕上的其他选项保持原样，然后单击\
