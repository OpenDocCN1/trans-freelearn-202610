  \    Toast.makeText(this, \"Bluetooth not turned on\",\n        Toast.LENGTH_LONG).show();\n\
  \    finish();\n}\n```\n```\n\nThe result of the user's choice (whether the user\
  \ decided to turn on the Bluetooth or not) will be returned in this method. We finish\
  \ the activity directly if the user does not turn on the Bluetooth since there isn't\
  \ much left to do.\n\n+   6. Let's handle another case, where a device might not\
  \ have Bluetooth support at all. For that, please update the `onResume` method to\
  \ the one shown as follows:\n\n```\n```java\n@Override\nprotected void onResume()\
  \ {\n    super.onResume();\n    BluetoothManager btManager = (BluetoothManager)\n\
  \        getSystemService(BLUETOOTH_SERVICE);\n    BluetoothAdapter btAdapter =\
  \ btManager != null ?\n        btManager.getAdapter() : null;\n    if (btAdapter\
  \ == null) {\n        Toast.makeText(getApplicationContext(),\n            \"No\
  \ Bluetooth Support found\",\n            Toast.LENGTH_LONG).show();\n```\n\n8.\
  \ We are making an assumption here, that is, the App will be operated in a scenario\
  \ where the SensorTag (attached to warehouse shelves) is turned on and is always\
  \ sending out advertisements over Bluetooth Low Energy, so as soon as the app begins\
  \ its operation, it tries to filter out the SensorTag from the list of broadcasting\
  \ devices, connect to it, and read temperature and humidity data continuously. For\
  \ this, add the startScanning method to the MainActivity class:\n\n```\nprotected\
  \ void startScanning() {\n    bluetoothManager =\n    (BluetoothManager)getSystemService(Context.BLUETOOTH_SERVICE);\n\
  \    bluetoothAdapter = bluetoothManager.getAdapter();\n    bluetoothLeScanner =\n\
  \    bluetoothAdapter.getBluetoothLeScanner();\n    AsyncTask.execute(new Runnable()\
  \ { @Override public\n    void run() { bluetoothLeScanner.startScan(leScanCallback);\
  \ } \n    });\n}\n```\n\nThe startScanning method makes use of quite a few variables,\
  \ so declare those in the MainActivity class:\n\n```\nBluetoothManager bluetoothManager;\n\
  BluetoothAdapter bluetoothAdapter;\nBluetoothLeScanner bluetoothLeScanner;\n```\n\
  \nWe now need to call the startScanning method from two places, first, immediately\
  \ after the user grants the location permission. For this, add the method call to\
  \ the startScanning method to the onRequestPermissionResult method (which we implemented\
  \ in Step 3) as shown next:\n\n```\nif (grantResults.length > 0 && grantResults[0]\
  \ ==\nPackageManager.PERMISSION_GRANTED) {\n    Log.i(TAG, \"Permission Granted\"\
  );\n    startScanning();\n}\n```\n\nSecond, if you have already granted all the\
  \ permissions during the initial run of the app, we also add the method call for\
  \ the startScanning method to the ensureLocationPermissionIsEnabled method (which\
  \ we implemented in Step 2):\n\n```\nprivate void ensureLocationPermissionIsEnabled()\
  \ {\n    if (Build.VERSION.SDK_INT >= 23 &&\n```\n\n\n\n\n\nContextCompat.checkSelfPermission(this,\n\
  \    android.Manifest.permission.ACCESS_COARSE_LOCATION)\n!= PackageManager.PERMISSION_GRANTED)\
  \ {\n    ActivityCompat.requestPermissions(this, new String[]{\nandroid.Manifest.permission.ACCESS_COARSE_LOCATION},\n\
  REQUEST_LOCATION);\n    return;\n}\nstartScanning();\n}\n\n我们已经实现了设备扫描代码。现在，我们需要定义一个回调来处理发现的设备。\n\
  \n9. 如果你成功完成了上一步，你的 startScanning 方法实现将使用 ScanCallback，扫描结果会通过它进行传递。请在 MainActivity\
  \ 类中定义 ScanCallback：\n\n```\n// Device scan callback.\nprivate ScanCallback leScanCallback\
  \ = new ScanCallback() {\n    @Override\n    public void onScanResult(int callbackType,\
  \ ScanResult\nresult) {\n    if (result.getDevice() != null) {\n        if (result.getDevice().getName()\
  \ != null &&\nresult.getDevice().getName().contains(NAME_TAG)) {\n            Log.i(TAG,\
  \ result.getDevice().getName());\n            if (connected == false) {\n      \
  \          connected = true;\n                bluetoothLeScanner.stopScan(leScanCallback);\n\
  \                result.getDevice().connectGatt(MainActivity.this, true,\n     \
  \           gattCallback);\n            }\n        }\n    }\n};\n```\n\n请仔细检查上面的代码，它根据所发现设备的名称来过滤可用设备。上述代码使用了一些变量，这些变量需要在\
  \ MainActivity 类中声明：\n\n```\nprivate static String NAME_TAG = \"SensorTag\";\nprivate\
  \ boolean connected = false;\n```\n\n我们需要将每个发现的设备名称与 SensorTag 的名称进行匹配，NAME_TAG\
  \ 变量正好可以帮助我们做到这一点。一旦找到正确的匹配，我们就通过调用 connectGatt 方法来发起连接，并通过更新 connected 变量的状态来表示已发出连接请求。\n\
  \n10. 调用 connectGatt 方法需要三个参数。最后一个参数是一个回调方法，可用于：\n- 监控连接状态变化\n- 服务发现\n- 特征值变化\n\n\
  我们将首先在 MainActivity 类中实现这个回调，用于监听连接状态变化：\n\n```\nprotected BluetoothGattCallback\
  \ gattCallback = new\nBluetoothGattCallback() {\n    @Override\n    public void\
  \ onConnectionStateChange(BluetoothGatt gatt, int status, int newState) {\n    \
  \    super.onConnectionStateChange(gatt, status, newState);\n        if (newState\
  \ == BluetoothGatt.STATE_CONNECTED) {\n            Log.i(TAG, \"onConnectionStateChange()\
  \ - STATE_CONNECTED\");\n            gatt.discoverServices();\n        }\n    }\n\
  };\n```\n\n根据上述实现，如果连接成功，我们就会发起服务发现。\n\n11. 我们关注两个服务：IR_TEMPERATURE_SERVICE 和 HUMIDITY_SERVICE。我们首先在\
  \ MainActivity 类中定义它们的 UUID：\n\n```\nprivate static final String UUID_IR_TEMPERATURE_SERVICE\
  \ =\n\"f000aa00-0451-4000-b000-000000000000\";\nprivate static final String UUID_HUMIDITY_SERVICE\
  \ =\n\"f000aa20-0451-4000-b000-000000000000\";\n```\n\n请注意，虽然我们为 `TEMPERATURE_SERVICE`\
  \ 和 `HUMIDITY_SERVICE` 都定义了 UUID，但在 Android 代码示例中，我们只演示了从 `TEMPERATURE_SERVICE`\
  \ 读取数据。从 `HUMIDITY_SERVICE` 读取数据的方式与之类似，留作练习由你自己完成。接下来，我们将专门关注 `TEMPERATURE_SERVICE`\
  \ 的细节。\n\nSensorTag 上的 `TEMPERATURE_SERVICE` 包含两个重要的特征值：*数据特征值*和*配置特征值*。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_189_0.png)\n\
  \n访问以下链接可以了解 SensorTag 温度服务所暴露的特征值的详细信息：`http://processors.wiki.ti.com/images/a/a8/BLE_SensorTag_GATT_Server.pdf`。\n\
  \n顾名思义，数据特征值保存温度数据，并支持*读取*该数据，以及针对温度数据的*启用/禁用通知*。我们将与这两个特征值进行交互。在 `MainActivity`\
  \ 类中定义它们：\n\n```java\n//Characteristic UUIDs\nprivate static final UUID UUID_CHARACTERISTIC_TEMPERATURE_DATA\n\
  \    = UUID.fromString(\"f000aa01-0451-4000-b000-000000000000\");\nprivate static\
  \ final UUID\nUUID_CHARACTERISTIC_TEMPERATURE_CONFIG =\n    UUID.fromString(\"f000aa02-0451-4000-b000-000000000000\"\
  );\n```\n\n我们在上一步发起的服务发现结果，将通过 `onServicesDiscovered` 方法传递。请重写 `BluetoothGattCallback`\
  \ 中的 `onServicesDiscovered` 方法：\n\n```java\n@Override\npublic void onServicesDiscovered(final\
  \ BluetoothGatt gatt, int status) {\n  super.onServicesDiscovered(gatt, status);\n\
  \  gatt.readCharacteristic(gatt.getService(UUID_IR_TEMPERATURE_SERVICE).getCharacteristic(UUID_CHARACTERISTIC_TEMPERATURE_DATA));\n\
  }\n```\n\n一旦服务发现完成，我们就通过上述代码指示 `BluetoothGatt` 读取温度数据特征值。\n\n12. 如前所述，温度数据特征值支持通知，我们可以启用这些通知来定期更新温度数据。一旦我们成功读取了温度数据特征值，就可以在重写\
  \ `BluetoothGattCallback` 实现中的 `onCharacteristicRead` 方法时，为该特征值启用通知：\n\n```java\n\
  @Override\npublic void onCharacteristicRead(BluetoothGatt gatt,\nBluetoothGattCharacteristic\
  \ characteristic, int status) {\n    super.onCharacteristicRead(gatt, characteristic,\
  \ status);\n    if\n    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
  \ {\n        //Enable local notifications\n        gatt.setCharacteristicNotification(characteristic,\
  \ true);\n        //Enabled remote notifications\n        BluetoothGattDescriptor\
  \ desc =\n        characteristic.getDescriptor(CONFIG_DESCRIPTOR);\n        desc.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE\n\
  \        );\n        gatt.writeDescriptor(desc);\n    }\n}\n```\n\n一旦启用了**通知**，每当\
  \ SensorTag 上的温度数据更新时，应用都会在 `onCharacteristicChanged` 方法中接收到更新后的值。\n\n13. 正如上一步所述，我们将重写\
  \ `onCharacteristicChanged` 方法，以便接收更新后的温度值，并对其进行解析和打印到控制台：\n\n```java\n@Override\n\
  public void onCharacteristicChanged(BluetoothGatt gatt,\nBluetoothGattCharacteristic\
  \ characteristic) {\n    super.onCharacteristicChanged(gatt, characteristic);\n\
  \    if\n    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
  \ {\n        double ambient =\n        Utilities.extractAmbientTemperature(characteristic);\n\
  \    }\n}\n```\n\n温度数据的格式如下：\nObjectLSB:ObjectMSB:AmbientLSB:AmbientMSB,。为了提取数据，我们创建了一个名为\
  \ Utilities 的独立类。在项目中添加一个独立的 Utilities 类，并在其中引入以下 extractAmbientTemperature 方法：\n\
  \n```\npublic static double\nextractAmbientTemperature(BluetoothGattCharacteristic\
  \ c) {\n    int offset = 2;\n    return shortUnsignedAtOffset(c, offset) / 128.0;\n\
  }\n```\n\nextractAmbientTemperature 方法使用了 shortSignedAtOffset 方法，因此我们也将该方法添加到 Utilities\
  \ 类中：\n\n```\n/**\n * Gyroscope, Magnetometer, Barometer, IR temperature\n * all\
  \ store 16 bit two's complement values in the awkward\nformat\n * LSB MSB, which\
  \ cannot be directly parsed as\ngetIntValue(FORMAT_SINT16, offset)\n * because the\
  \ bytes are stored in the \"wrong\" direction.\n *\n * This function extracts these\
  \ 16 bit two's complement values.\n * */\nprivate static Integer\nshortSignedAtOffset(BluetoothGattCharacteristic\
  \ c, int offset)\n{\n    Integer lowerByte = c.getIntValue(FORMAT_UINT8, offset);\n\
  \    Integer upperByte =\n    c.getIntValue(BluetoothGattCharacteristic.FORMAT_SINT8,\
  \ offset\n    + 1); // Note: interpret MSB as signed.\n    return (upperByte <<\
  \ 8) + lowerByte;\n}\n```\n\n上述代码片段来源于 http://processors.wiki.ti.com/。\n\n\n\n\n\
  我们已为数据特征启用了**通知**，理论上，我们现在可以高枕无忧，只需等待温度传感器通过 `onCharacteristicChanged` 方法读取、更新并通知我们最新的温度值。然而，事实并非如此，因为在成功获取温度更新之前，我们还缺少一个关键步骤。\n\
  \n- 14. 如果你仔细阅读过我们在*步骤 11* 中指出的文档链接，你会发现该文档中提到一个关键细节：\n\n| 0x29 | 41 | 0xAA02 |\
  \ IR 温度配置 | 00 | RW | 写入“01”启动传感器和测量，“00”进入睡眠 |\n\n图 6.8：温度配置特征的详细信息\n\n根据上述细节，请注意默认情况下温度传感器并未启用记录测量功能。因此，默认情况下我们的温度传感器处于睡眠模式；我们需要将其切换到活动模式，以便接收定期的通知。我们通过在\
  \ `MainActivity` 类中重写 `BluetoothGattCallback` 实现中的 `onDescriptorWrite` 方法来实现这一点：\n\
  \n```\n@Override\npublic void onDescriptorWrite(BluetoothGatt gatt,\nBluetoothGattDescriptor\
  \ descriptor, int status) {\n    super.onDescriptorWrite(gatt, descriptor, status);\n\
  \    enableConfigurationForCharacteristic(gatt,\n    descriptor.getCharacteristic());\n\
  }\n```\n\n根据 `onDescriptorWrite` 的实现，我们还需要在 `MainActivity` 类中实现 `enableConfigurationForCharacteristic`\
  \ 方法：\n\n```\nprivate void enableConfigurationForCharacteristic(BluetoothGatt gatt,\
  \ BluetoothGattCharacteristic characteristic) {\n    if\n    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
  \ {\n        gatt.readCharacteristic(gatt.getService(UUID_IR_TEMPERATURE_SERVICE).getCharacteristic(UUID_CHARACTERISTIC_TEMPERATURE_CONFIG));\n\
  \    }\n}\n```\n\n这就是我们之前提到的第二个重要特征——配置特征——发挥作用的地方。\n\n15. 接着上一步，我们将读取配置特征（并在下一步中更新它），以便最终将温度传感器从睡眠模式配置为活动模式。为了更新配置特征，将预先实现的\
  \ `onCharacteristicRead` 方法更新为以下内容：\n\n```\n@Override\npublic void onCharacteristicRead(BluetoothGatt\
  \ gatt,\nBluetoothGattCharacteristic characteristic, int status) {\nsuper.onCharacteristicRead(gatt,\
  \ characteristic, status);\nif\n(characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
  \ {\n//Enable local notifications\ngatt.setCharacteristicNotification(characteristic,\
  \ true);\n//Enabled remote notifications\nBluetoothGattDescriptor desc =\ncharacteristic.getDescriptor(CONFIG_DESCRIPTOR);\n\
  desc.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);\n);\ngatt.writeDescriptor(desc);\n\
  } else if\n(characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_CONFIG))\
  \ {\ncharacteristic.setValue(new byte[] {0x01});\ngatt.writeCharacteristic(characteristic);\n\
  }\n}\n```\n\n读取成功后，我们向配置特征写入 `0x01`，以便将温度传感器设置为活动模式。\n\n16. 我们已经完成了实现，现在 `onCharacteristicChanged`\
  \ 方法应该在 SensorTag 每次更新温度值时被调用。作为最后一步，我们可以更新 `onCharacteristicChanged` 方法，向用户显示实时温度更新。同时，我们还可以设置并包含数据上传到\
  \ Firebase 后端，以便我们的应用能持续将定期数据更新上传到远程服务器。我们用于 UI 更新和后端上传的最终代码如下：\n\n```\n```java\n\
  @Override\npublic void onCharacteristicChanged(BluetoothGatt gatt,\nBluetoothGattCharacteristic\
  \ characteristic) {\n    super.onCharacteristicChanged(gatt, characteristic);\n\
  \    if\n    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
  \ {\n        final double ambient =\n        Utilities.extractAmbientTemperature(characteristic);\n\
  \        //Upload to Firebase Backend\n        FirebaseDatabase database = FirebaseDatabase.getInstance();\n\
  \        DatabaseReference myRef =\n        database.getReference(\"Temperature\"\
  );\n        myRef.setValue(ambient);\n        //Update the UI\n        runOnUiThread(new\
  \ Runnable() {\n            @Override\n            public void run() {\n       \
  \         ((TextView)\n                findViewById(R.id.textView).setText(\"Temperature:\
  \ \" + ambient\n                + \"\\\\u00b0\" + \"C\");\n            }\n     \
  \   });\n    }\n}\n```\n```\n\n请注意，我们仍需要在客户端和服务端两端设置 Firebase，因此上述代码可能无法编译，因为我们引用了\
  \ Firebase 但尚未进行设置。我们将在下一步中进行设置。\n\n## 设置 Firebase\n\n现在我们已经有数据了，剩下的事情就是将其上传到服务器，这样\
  \ Alexa 就可以远程读取/访问这些数据。为此，我们将 Firebase 集成到 Android 应用中，并将温度测量值上传到 Firebase 云。我们将按照以下步骤将\
  \ Firebase 集成到移动应用中：\n\n- 1. 要集成 Firebase，请在 Android Studio 的顶部菜单栏中导航到 Tools | Firebase。这应该会打开\
