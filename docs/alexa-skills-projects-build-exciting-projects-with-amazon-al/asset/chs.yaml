  \ bluetoothAdapter) {\n    if (!bluetoothAdapter.isEnabled()) {\n        Intent\
  \ enableBtIntent = new\n        Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE);\n\
  \        startActivityForResult(enableBtIntent, REQUEST_ENABLE_BT);\n        return;\n\
  \    }\n}\n```\n\n```\nensureLocationPermissionIsEnabled();\n}\n```\n\nFor the code\
  \ to compile successfully, define the following member variable in the `MainActivity`\
  \ class:\n\n```\nprivate static final int REQUEST_ENABLE_BT = 0;\n```\n\nThe preceding\
  \ `checkPermissions` method will be responsible for enabling Bluetooth and location\
  \ permissions.\n\n+   5. In the previous step, we started the **System Default**\
  \ setting activity for the user and let the user decide whether they wanted to switch\
