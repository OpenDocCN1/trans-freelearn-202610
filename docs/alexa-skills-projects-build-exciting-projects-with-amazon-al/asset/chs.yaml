  \n  选择 **Save Endpoints** 按钮，导航到 **Skill builder checklist** 并再次重建模型。\n\n## 为 Factly\
  \ 添加持久性\n\n在游戏（以及生活中）中，持久性是关键。说真的，如果我们没有办法在不同关卡保存马里奥的进度，我们最终可能永远救不出公主。\n\n> 要了解更多关于马里奥的信息，请访问\
  \ https://en.wikipedia.org/wiki/Mario。\n\n我们也可以为任何 Alexa Skill 添加持久性，以保存当前状态或用户的进度。保存状态可以用作惊喜，也可以是必需的，特别是在\
  \ **Game/Entertainment** 导向的技能中，保存用户进度至关重要。\n\n在本节中，我们将演示为 Factly 添加持久性；我们将告知用户他们迄今为止玩过\
  \ Factly 的次数，为此我们将使用 **DynamoDB** 存储启动次数，DynamoDB 是 AWS 提供的 NoSQL 数据库服务。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_125_0.png)\n\
  \n要了解有关 DynamoDB 的更多信息，请导航到 https://aws.amazon.com/dynamodb/。\n\n我们将通过 Lambda 代码访问\
