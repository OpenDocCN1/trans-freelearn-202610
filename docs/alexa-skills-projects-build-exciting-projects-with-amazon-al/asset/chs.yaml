  \n从给定选项中选择**AWS Lambda ARN**，复制此页面上的“技能 ID”并保存在某处。我们很快就会用到它。\n\n## 配置 Lambda 函数\n\
  \n创建好**交互模型**后，我们将保持配置仪表板不变，专心创建 Lambda：\n\n- 1. 打开一个新的浏览器标签页，并导航到 AWS 控制台。\n\n\
  AWS 控制台位于 https://console.aws.amazon.com。请注意，如果你还没有账户，可能需要新建一个。\n\n在**服务 | 计算**选项下选择**Lambda**。在下一个屏幕上点击**创建函数**，将\
  \ Lambda 函数命名为 `ambienceManagerSkill`，并按下图所示填写详细信息：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_210_0.png)\n\
  \n填写详细信息后，点击**创建函数**按钮。\n\n2. 在下一个屏幕上，在“设计器”部分，你需要添加一个触发器来调用 Lambda 函数。从左侧的触发器列表中，请选择\
  \ Alexa Skills Kit，因为 Alexa 将调用我们的 Lambda 函数并为其提供输入：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_211_0.png)\n\
  \n图 6.32：为 Lambda 函数添加触发器\n\n添加触发器后，我们需要添加上一节中复制的“技能 ID”。滚动到屏幕底部，在如下截图所示的区域中添加“技能\
  \ ID”：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_211_1.png)\n\n图 6.33：配置触发器\n\n\
  添加**技能 ID**可确保 Lambda 只响应经过验证的技能所生成的请求。添加**技能 ID**后，请点击屏幕底部的**添加**按钮。此时我们的 Lambda\
  \ 配置应有一些未保存的更改。请点击屏幕右上角的**保存**按钮保存最近的更改。\n\n- 3. 点击**保存**按钮后，在**设计器**部分选择 **ambienceManagerSkill**\
  \ 框。这会在底部打开一个代码编辑器，我们将在其中添加 Lambda 的代码。\n\n## 编写 Lambda 函数\n\n完成 Lambda 设置后，接下来就该为实际的\
  \ Lambda 函数编写代码了。我们将按照以下步骤，在开发者门户网站的 `index.js` 文件中直接编辑代码：\n\n- 1. 在 `exports.handler`\
  \ 中实现事件处理。在本例中，我们的 Lambda 将只处理一个意图，即 `OneShotFetchTemperatureIntent`。由于我们实现的是 One-Shot\
  \ 启动，这一个意图就能启动我们的技能并获取温度数据。\n\n在继续编写功能逻辑之前，先声明以下变量，这些变量将被我们的功能逻辑使用：\n\n```\nvar\
  \ https = require('https');\nvar firebaseHost = \"androidwarehousemonitor.firebaseio.com\"\
  ;\n```\n\n`firebaseHost` 就是我们之前在设置 Firebase 时复制的那个 URL（根据你为 Android 应用设置 Firebase\
  \ 的方式，该 URL 可能有所不同）。由于我们将通过 REST 调用连接到 Firebase，因此需要它的 `firebaseHost` URL 和 `https`。\n\
  \n然后，更新 `exports.handler` 的代码，如下所示：\n\n```\nexports.handler = (event, context, callback)\
  \ => {\n    try {\n        if (event.request.type === \"IntentRequest\") {\n   \
  \         if (\"OneShotFetchTemperatureIntent\" ===\n            event.request.intent.name)\
  \ {\n            } else {\n                throw \"Invalid intent\";\n         \
  \   }\n        }\n    }\n```\n\n```\n}\ncatch(e) {\n    context.fail(\"Exception:\
  \ \" + e);\n}\n};\n```\n\n如前所示和所述，我们丢弃了所有其他意图（包括到目前为止我们一直严格处理的 Launch Intent），只处理\
  \ `OneShotFetchTemperatureIntent`，以实现我们技能的 One-Shot 启动。\n\n- 2. 我们将定义一些辅助函数来帮助我们创建语音响应，如下所示：\n\
  \n```\n// ------ Helper functions ------\n\nfunction buildSpeechletResponse(output,\
  \ repromptText, shouldEndSession) {\n    return {\n        outputSpeech: {\n   \
  \         type: \"PlainText\",\n            text: output\n        },\n        reprompt:\
  \ {\n            outputSpeech: {\n                type: \"PlainText\",\n       \
  \         text: repromptText\n            }\n        },\n        shouldEndSession:\
  \ shouldEndSession\n    };\n}\n\nfunction buildResponse(sessionAttributes, speechletResponse)\
  \ {\n    return {\n        version: \"1.0\",\n        sessionAttributes: sessionAttributes,\n\
  \        response: speechletResponse\n    };\n}\n```\n\n这些函数帮助 Lambda 在收到特定意图/输入时返回\
  \ Alexa 要朗读的响应。\n\n\n\n\nbuildResponse 函数将生成要由 Alexa 朗读的直白响应。\n\nbuildSpeechletResponse\
  \ 函数将以纯文本形式指定 Alexa 最终要朗读的输出。它还接受另一个变量 shouldEndSession，该变量指定 Alexa 在响应结束后是否应结束会话。\n\
  \n定义 fbGet 函数，它将接受一个 key 参数，并通过 REST 调用从给定的主机获取数据：\n\n```\nfunction fbGet(key){\n\
  \    return new Promise((resolve, reject) => {\n        var options = {\n      \
  \      hostname: firebaseHost,\n            port: 443,\n            path: key +\
  \ \".json\",\n            method: 'GET'\n        };\n        var req = https.request(options,\
  \ function (res) {\n            res.setEncoding('utf8');\n            var body =\
  \ '';\n            res.on('data', function(chunk) {\n                body += chunk;\n\
  \            });\n            res.on('end', function() {\n                resolve(JSON.parse(body))\n\
  \            });\n        });\n        req.end();\n        req.on('error', reject);\n\
  \    });\n}\n```\n\n前面的函数将接受保存温度数据的键参数（在我们的例子中，这个键是 Temperature），并从 Firebase 主机获取数据。接收到的数据是\
  \ JSON 格式，因此需要解析。\n\n- 3. 添加此方法后，我们需要从 exports.handler 中调用它。请用对 fbGet 的调用更新 exports.handler，如下面的代码所示：\n\
  \n```\nexports.handler = (event, context, callback) => {\n    try {\n        if\
  \ (event.request.type === \"IntentRequest\") {\n            if (\"OneShotFetchTemperatureIntent\"\
  \ ===\n                event.request.intent.name) {\n                fbGet(\"/Temperature\"\
  ).then(res => {\n                    context.succeed(buildResponse(buildSpeechletResponse(\"\
  The temperature is \" + res + \" degrees\", true)));\n                })\n     \
  \       } else {\n                throw \"Invalid intent\";\n            }\n   \
  \     }\n    }\n    catch(e) {\n        context.fail(\"Exception: \" + e);\n   \
  \ }\n};\n```\n\n获取成功后，我们会创建一个语音响应并将其传回，供 Alexa 朗读。这样就完成了我们的 Lambda 实现。\n\n- 4. 我们需要将\
  \ Lambda 链接到我们的技能，为此，我们需要 Lambda 的 Amazon 资源名称（ARN）。ARN 位于 Lambda 函数/代码编辑器页面的右上角：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_215_0.png)\n\n图 6.34：复制 ARN\n\n复制 ARN。复制完成后，请切换到之前配置技能交互模型的浏览器标签页：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_216_0.png)\n\n图 6.35：使用 ARN 更新端点 – 步骤\
  \ 1\n\n如上图所示，单击“技能构建器清单”下的“端点”按钮，这将导航到端点屏幕，如下面的屏幕截图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_216_1.png)\n\
  \n图 6.36：使用 ARN 更新端点 – 步骤 2\n\n选择 **AWS Lambda ARN**，在 **默认区域** 选项下，添加我们从上一屏幕复制的\
  \ ARN，然后点击屏幕左上角的 **保存端点** 按钮。\n\n点击 **保存端点** 按钮后，请再次点击 **构建** 标签页以返回到仪表板。\n\n- 5.\
  \ 在仪表板上，**技能构建器清单** 中的所有项目现在都应显示为绿色，如下面的屏幕截图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_217_0.png)\n\
  \n这表示我们的技能现在已准备好进行测试。请点击上方屏幕截图中显示的 **测试** 标签页。\n\n## 测试与调试技能\n\n**测试** 标签页应会打开 Alexa\
  \ 模拟器：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_218_0.png)\n\nAlexa 模拟器大大减少了对实体\
  \ Amazon Echo 的需求，因为你只需使用模拟器就可以轻松测试 Ambience Manager 技能。\n\n请在文本框中输入 `Alexa ask\
  \ ambience manager to get temperature`，如下面的屏幕截图所示，然后按 *Enter* 键：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_218_1.png)\n\
  \nAlexa 应该会用正确的响应“The temperature is...”进行回复，如果你的电脑音量已打开，你甚至可以听到 Alexa 说出该响应。\n\n\
  我们的技能现在已测试完毕，可以随意把玩了。你可以在信息框中提到的链接处找到本章 Lambda 的代码。\n\n请在此处找到 Lambda 的代码：https://github.com/madhurbhargava/AlexaSkillsProjects/blob/master/Chapter_6_Smart_Home_Index.js.\n\
  \n但是，如果发生错误，技能的行为不符合我们的预期，该怎么办？\n\n对于 Alexa 技能而言，一个有效的调试工具是 Amazon CloudWatch。CloudWatch\
