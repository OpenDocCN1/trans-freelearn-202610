  }\n```\n\nThe preceding method simply logs it to the console if the permission has\
  \ been granted; otherwise, it finishes the activity and exits the app. We have added\
  \ the necessary methods, now we need to call them too.\n\n4. For calling the methods\
  \ that we added in Step 2 regarding enabling of location permissions, add a checkPermissions\
