  \ | Save and retrieve data。这应该会打开 Save and retrieve data 窗口。\n\n- 3. 点击 Connect\
  \ your app to Firebase。Firebase 连接应会要求你选择现有项目或创建新项目。\n\n4. 选择创建新项目，为其提供相关名称，然后点击\
  \ Connect to Firebase：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_196_0.png)\n\n\
  图 6.10：创建新的 Firebase 项目\n\n5. 该过程需要几分钟时间，成功完成后，Assistant 窗口中的 Connect your app to\
  \ Firebase 指示器将变为绿色：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_196_1.png)\n\n\
  图 6.11：Firebase 应用连接状态\n\n6. 点击 Assistant 窗口中的第二项，即 Add the Realtime Database to\
  \ your app。此时会弹出一个提示，询问是否可以对项目进行与包含 Firebase 相关的必要更改。点击此提示中的 Accept Changes：\n\n\
  ![](img/80ddccf2572659c5b147f23cc6356c5a_197_0.png)\n\n图 6.12：将 Firebase 添加到项目\n\
  \n7. 接受更改后，将开始 Gradle Sync。\n\n8. Gradle Sync 之后，在 Assistant 窗口中的步骤 3 下点击 Configure\
  \ your rules for public access。此步骤将在浏览器中打开一些 Firebase 文档。\n\n9. 点击此屏幕右上角的 Go to\
  \ Console。这应该会打开现有应用的仪表板/图库。\n\n10. 选择相关的应用名称：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_198_0.png)\n\
  \n11. 你将进入一个详细的控制台。在此处，点击左侧窗格中的 **Database**，然后在水平选项卡列表中选择 **Rules** 选项卡。\n\n- 12.\
  \ 你面前看到的应该是一个 JSON 文件，表示规则为键值对：\n- 1. 将 `.read` 键从 `auth != null` 改为 `true`。\n-\
  \ 2. 对 `.write` 键执行相同操作。\n- 3. 点击顶部的 **Publish** 按钮。\n\n> 此配置仅用于演示目的，这意味着任何人都可以读取或写入你的数据库。在真实场景中，你的规则将比这更高级、更复杂。\n\
  \n完成上述更改后，安全规则 JSON 应如下图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_199_0.png)\n\
  \n图 6.14：Firebase 详细控制台和规则\n\n13. 完成这些更改后，我们的 Android 应用已经具备了将读数上传到 Firebase 后端的代码。如果你现在启动应用，打开\
  \ SensorTag，并让它在应用附近保持广播，你应该会看到动态温度更新的到来以及 UI 的更新：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_199_1.png)\n\
  \n图 6.15：动态温度更新\n\n\n\n\n呼，这可真不容易！我们的 Android 实现已经完成了。\n\n请注意，如果你运行应用后无法（在日志中或调试时）看到设备被发现，请确保手机已开启定位服务。\n\
