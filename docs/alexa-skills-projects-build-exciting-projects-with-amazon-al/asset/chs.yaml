  \n至此，我们已到达本章的结尾。\n\n## 总结\n\n我们希望您喜欢创建 Handsfree Messenger 技能，它比我们之前的技能更进了一步，并且面向\
  \ Alexa/Echo 设备的实际使用。我们在本节中创建的技能仍有很大的改进空间。例如，目前我们的技能向预定义/硬编码的收件人发送消息，这可以通过将收件人详细信息通过\
  \ slot 传递给 Lambda 来改进，以便它不必在 Lambda 中预定义。我们故意没有涵盖这一点，并且希望将其作为扩展练习，我们强烈建议您如果真的想更早成为\
  \ Alexa Skills Jedi，就去尝试一下。\n\n但是，我们又完成了一个有趣的 Alexa Skill。\n\n在下一章中，我们将通过创建一个更偏向娱乐的\
  \ Alexa Skill、将使用稍微更复杂的语音界面并且会更有趣的 Alexa Skill，进一步扩展我们对 Alexa 知识的掌握。\n\n迫不及待想开始吗？让我们开始吧！\n"
- "# 4 与 Alexa 一起玩 Factly\n\n> “人声是所有乐器中最完美的。”\n> \n> — Arvo Pärt\n\n我们在成为 Alexa Skills\
  \ Jedi 的征程中取得了长足的进步。我们首先设计了一个 Hello World Alexa Skill，这让我们了解了基本 Alexa Skill 的细节。掌握了这些知识后，我们继续通过开发一个稍微更高级的\
  \ Alexa Skill 扩展了我们的武器库，该技能还与第三方后端（Twilio）通信。\n\n在本章中，我们将稍作偏离，创建一个名为 Factly 的自包含技能。Factly\
  \ 将是一个以 trivia/quiz 为导向的 Alexa Skill，可以就各种事实对用户进行测验。它将是一个自包含的技能，不会与任何第三方 API/后端通信。\n\
  \n我们将通过在本章中涵盖以下主题来实现这一点：\n\n- 设计 Factly 的动机\n- 设计 Factly 技能\n- 构建 Factly 技能\n\n\
  不用多说，让我们从技能设计的概述开始。\n\n### 设计 Factly 的动机\n\n在深入了解 Factly Alexa Skill 的细节之前，让我们先通过了解人们使用语音助手的原因来理解我们选择创建此技能的原因。\n\
  \nStatista 对英国智能手机用户进行的一项研究显示，使用语音助手的人主要将其用于 **Amusement**，仅次于 **Search for general\
  \ information**，如下图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_95_0.png)\n\n\
  图 4.1：语音助手最常见的用途\n\n有了这一见解，就不足为奇了，亚马逊 Alexa 应用商店中 Alexa Skills 的最大份额属于游戏和 trivia\
  \ 应用：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_96_0.png)\n\n令人惊讶或不令人惊讶的是，这与智能手机市场的应用分布非常相似：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_96_1.png)\n\n发布的绝大多数应用都是游戏，适用于 Android\
  \ 和 iOS 平台。\n\n用户在 **Gaming and Entertainment** 类别的应用上花费的时间最多，如下图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_97_0.png)\n\
  \n图 4.4：平均移动用户在各个应用上花费的时间（来源：Flurry）\n\n典型的消费者将 32% 的手机时间花费在 **Entertainment/Gaming**\
  \ 应用上。\n\n由于 Skills 市场仍处于起步阶段，我们目前还没有 Skills 市场的类似深入统计数据。然而，我们可以根据智能手机市场应用的分布做出相当准确的决定，因为从\
  \ 2015 年到 2017 年，Alexa Skills 的数量增长非常迅速，如下图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_98_0.png)\n\
  \n图 4.5：Alexa Skills 市场的增长（来源：voicebot.ai）\n\n如上所示，截至 2017 年 9 月，仅美国市场的 Alexa Skills\
  \ 总数就约为 20,000，其中至少 25% 的技能是游戏、trivia 和娱乐导向的，即大约 6,000 个，与全球智能手机市场的应用数量相比微不足道：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_99_0.png)\n\nApple App Store 中的应用数量在\
  \ 7 年内从 0 增长到 150 万，仍在增长。预计会有类似的轨迹并考虑即使是保守的增长率，我们可以清楚地期望语音技能市场会有类似的增长。\n\n前面的分析得出以下结论：\n\
  \n- **Games/Entertainment** 技能无论为哪个平台开发，始终是最受欢迎和最常用的技能\n- 与智能手机应用市场相比，技能市场仍处于起步阶段，仍有很大的增长空间\n\
  \n\n\n\n\nWith the current count of **Games/Trivia**-oriented skills in the Alexa\
  \ Skills store being around 6,000, there is a lot more room to accommodate other\
  \ **Games/Trivia** skills, which is one of the major reasons that we decided to\
  \ introduce our readers to the Factly Skill in this chapter.\n\n## Designing the\
  \ Factly Skill\n\nWe hope that the discussion in the last section should have given\
  \ you a fair idea of the motivation behind the Factly Alexa Skill. Now, we shall\
  \ level up and design the actual Factly Skill. It is always better to design before\
  \ coding anything because it gives us a clarity about the end goals of the software\
  \ and the finer details, which we may otherwise miss when we actually code the software.\n\
  \nThe Factly Alexa Skill is a simple quiz skill. At the code level, the Factly Skill/Lambda\
  \ will contain a bank of questions that will be presented to the user one by one.\
  \ The skill will further perform depending on the user's reply.\n\nFactly will work\
  \ via the following steps:\n\n- 1. The user will launch the Factly Skill via a standard\
  \ Alexa Skill launch utterance.\n- 2. Alexa will confirm the launch and provide\
  \ a brief introduction to the skill and play method:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_100_0.png)\n\
  \nFigure 4.7: Step 1 – Factly, launch\n\nThe skill that we will design will consist\
  \ of three trivia questions and each question will have four answer choices, with\
  \ only a single choice being the correct one.\n\n3. Alexa will begin the quiz by\
  \ asking the first question:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_101_0.png)\n\
  \nFigure 4.8: Step 2 – Factly, questionnaire\n\n4. The user can provide the answer\
  \ by just saying the number of the correct answer, for example: \"The answer is\
  \ 3\" or just \"3\":\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_101_1.png)\n\n\
  Figure 4.9: Step 3 – Factly, answer acknowledgment\n\nDepending on the user's answer,\
  \ the skill will provide a response that the answer is correct or incorrect.\n\n\
  5. The user can also end the session:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_101_2.png)\n\
  \nFigure 4.10: Step 4 – Factly, conclusion\n\n- 6. Steps 4, 5, and 6 will be repeated\
  \ until all the quiz questions have been exhausted or the user decides to end the\
  \ session.\n\nThe interaction flow can be expressed in terms of a VUI diagram:\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_102_0.png)\n\nFigure 4.11: Factly, VUI\
  \ flow\n\nAlso, the overall information flow of a typical quiz session can be mapped\
  \ out as follows:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_102_1.png)\n\nFigure\
  \ 4.12: Factly, data flow\n\n## Building the Factly Skill\n\nNow, since we understand\
  \ how data flows to and from our Factly Skill, it is time to actually build it.\
  \ For this purpose, we will build the actual Lambda via the Amazon Developer portal.\n\
  \nWe will assume that the reader knows about and has already signed up to the Amazon\
  \ Developer portal, and is already aware of the basic starter information about\
  \ the Amazon Alexa Skills Developer Portal, since this has also been already covered\
  \ in detail in Chapter 2, *Hello World, Alexa!*. We already covered account creation\
  \ and other basic details for the Amazon Developer Portal in Chapter 2, *Hello World,\
  \ Alexa!*, so we will not be repeating those here.\n\nWe shall begin with the skill\
  \ creation:\n\n- 1. On the **Skill builder checklist**, select **Invocation Name**\
  \ to navigate to the **Invocation name** screen and provide the skill with an invocation\
  \ name, as shown in the following screenshot:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_104_0.png)\n\
  \nSave these changes by clicking on the **Save Model** button. Once you have successfully\
  \ saved the changes, navigate back to the **Skill builder checklist**.\n\n2. In\
  \ this step, we shall define the **Intents, Samples, and Slots** for the **Interaction\
  \ Model** for our skill. Our skill will be making use of two intents:\n\n- - **Answer\
  \ Intent:** This intent will hold the user's answers to the quiz questions posed\
  \ by the Factly Skill. This intent will also include a slot so that we can pass\
  \ the answer as an argument to the Lambda.\n- - **AMAZON.StopIntent:** This is a\
  \ standard intent pre-provided by ASK, through which the user can terminate the\
  \ skill's execution at any point in time.\n\nTo know more about standard built-in\
  \ intents, please visit https://developer.amazon.com/docs/custom-skills/standard-built-in-intents.html.\n\
  \nFrom the **Skill builder checklist**, click on **Intents, Samples, and Slots**\
  \ to land on the **Add Intent** screen. Rather than directly defining an Intent,\
  \ we will first define a custom slot that we can later include in our **Answer Intent:**\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_105_0.png)\n\nFigure 4.15: Adding a New\
  \ Slot Type\n\nAs shown in the preceding screenshot, click on the **Add** button\
  \ next to **Slot Types** to land on the **Add Slot Type** screen.\n\nTo know more\
  \ about slots, types, and custom slot types, please visit https://developer.amazon.com/docs/custom-skills/custom-interaction-model-reference.html#custom-slot-syntax.\n\
  \nOn the **Add Slot Type** screen, create a custom slot type by the name of `LIST_OF_CHOICES`,\
  \ as shown in the following screenshot:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_106_0.png)\n\
  \nFigure 4.16: Naming the new custom Slot Type\n\nOn the next screen, provide it\
  \ with a list of values, 1, 2, 3, 4, since each of the questions posed by the Factly\
  \ Skill can have these four possible answers:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_107_0.png)\n\
  \nFigure 4.17: Adding Slot Values to the custom Slot Type\n\nWith our slot type\
  \ set up, click on the **Add** button to add an intent, as shown in the following\
  \ screenshot:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_107_1.png)\n\nFigure 4.18:\
  \ Adding an Intent\n\nThis should bring you to the **Add Intent** screen. Define\
  \ an intent called `Answer` on this screen, which is going to contain the answer\
  \ provided by the user for the questions posed by the Factly Skill, as shown in\
  \ the following screenshot:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_108_0.png)\n\
  \nOnce you have defined the intent, click on the **Create custom intent** button\
  \ to land on the **Sample Utterances** screen. Before defining any sample utterances,\
  \ scroll down on this screen and create a new slot type called `Choice`. Give this\
  \ slot the type of `LIST_OF_CHOICES`, which we defined earlier from the drop-down\
  \ menu:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_109_0.png)\n\nFigure 4.20: Adding\
  \ slot to the Intent\n\nOnce we have defined the slot, we can now go ahead and define\
  \ a couple of sample utterances for our intent.\n\n- 3. Add a couple of **Sample\
  \ Utterances** for the *Answer* intent which will, of course, include the **Choice**\
  \ slot, since that is what will contain the actual answer to the questions posed\
  \ by Factly:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_109_1.png)\n\nFigure 4.21:\
  \ Adding Sample Utterances for the Intent\n\nOnce you have defined and saved the\
  \ model, you can also click on the **JSON Editor** option in the left menu pane\
  \ and verify that your JSON configuration matches this one:\n\n```\n```json\n{\n\
  \    \"interactionModel\": {\n        \"languageModel\": {\n            \"invocationName\"\
  : \"factly\",\n            \"intents\": [\n                {\n                 \
  \   \"name\": \"Answer\",\n                    \"slots\": [\n                  \
  \      {\n                            \"name\": \"Choice\",\n                  \
  \          \"type\": \"LIST_OF_CHOICES\"\n                        }\n          \
  \          ],\n                    \"samples\": [\n                        \"the\
  \ answer is {Choice}\",\n                        \"{Choice}\"\n                \
  \    ]\n                },\n                {\n                    \"name\": \"\
  AMAZON.StopIntent\",\n                    \"samples\": []\n                }\n \
  \           ],\n            \"types\": [\n                {\n                  \
  \  \"name\": \"LIST_OF_CHOICES\",\n                    \"values\": [\n         \
  \               {\n                            \"name\": {\n                   \
  \             \"value\": \"1\"\n                            }\n                \
  \        },\n                        {\n                            \"name\": {\n\
  \                                \"value\": \"2\"\n                            }\n\
  \                        },\n                        {\n                       \
  \     \"name\": {\n                                \"value\": \"3\"\n          \
  \                  }\n                        }\n                    ]\n       \
  \         }\n            ]\n        }\n    }\n}\n```\n```\n\n\n```json\n\"name\"\
  : {\n    \"value\": \"4\"\n}\n```\n\n确认 JSON 配置后，返回到 **技能构建者清单**。\n\n- 4. 从 **技能构建者清单**\
  \ 中导航到 **Endpoint** 屏幕，从 Endpoint 屏幕复制技能 ID，并将其保存到某个地方。我们稍后会用到它。\n\n## 配置 Lambda\
  \ 函数\n\n一旦 **交互模型** 创建完成，我们暂时保持配置屏幕不变，并将重点放在创建 Lambda 上：\n\n- 1. 打开一个新的浏览器标签页并导航到\
  \ AWS 控制台，其网页 URL 在以下信息框中提及：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_111_0.png)\n\
  \nAWS 控制台可在 https://console.aws.amazon.com 找到。请注意，如果尚未创建，您可能需要创建一个新账户。\n\n为 Lambda\
  \ 函数命名为 `factlySkill` 并按以下截图所示填写详细信息：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_112_0.png)\n\
  \n图 4.22：命名 Lambda\n\n填写完详细信息后点击 Create function 按钮。\n\n- 2. 在下一个屏幕中，在 **Designer**\
  \ 部分下，您需要添加一个触发器来调用 Lambda 函数：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_112_1.png)\n\
  \n图 4.23：配置 Lambda\n\n从左侧的触发器列表中，选择 **Alexa Skills Kit**，因为 Alexa 将调用我们的 Lambda\
  \ 函数并向其提供输入：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_113_0.png)\n\n添加触发器后，下一步将是添加我们在上一节中复制的\
  \ Skill ID。在以下截图所示的部分中添加 Skill ID：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_113_1.png)\n\
  \n添加 **Skill ID** 可确保 Lambda 仅响应由已验证技能生成的请求。添加 **Skill ID** 后，点击屏幕底部的 **Add** 按钮，然后点击屏幕右上角的\
  \ **Save** 按钮。\n\n- 3. 点击 **Save** 按钮后，选择 **Designer** 部分下的 `factlySkill` 框，如以下截图所示：\n\
  \n![](img/80ddccf2572659c5b147f23cc6356c5a_114_0.png)\n\n图 4.26：完成 Lambda 配置\n\n\
  这将在底部打开一个代码编辑器，我们将在其中添加 Lambda 的代码。\n\n## 编写 Lambda 函数\n\n我们将在开发者门户本身的 `index.js`\
  \ 文件中内联编辑代码：\n\n- 1. 首先，我们将定义一个 JSON 数组，其中将包含测验技能提出的问题。此数组可以定义在 `index.js` 文件的顶部，甚至在\
  \ `exports.handler` 之前：\n\n```javascript\n//questions is an array of json objects\n\
  var questions = [\n    {\n        \"World War I began in which year?\": [\n    \
  \        \"1923\",\n            \"1938\",\n            \"1917\",\n            \"\
  1914\"\n        ]\n    },\n    {\n        \"Adolf Hitler was born in which country?\"\
  : [\n            \"France\",\n            \"Austria\",\n            \"Hungary\"\
  ,\n            \"Germany\"\n        ]\n    },\n    {\n        \"The battle of Hastings\
  \ was fought in which country?\":\n        [\n            \"France\",\n        \
  \    \"Russia\",\n            \"England\",\n            \"Norway\"\n        ]\n\
  \    }\n];\n\nvar correctAnswerSlots = [3, 1, 2];\n```\n\n如前面的代码所示，除了 questions\
  \ 数组之外，我们还定义了另一个名为 `correctAnswerSlots` 的数组，其中包含 `questions` 数组中每个问题的正确答案的索引。\n\n\
  困惑吗？我们可以用一个例子来阐述。可以从 `correctAnswerSlots` 数组推断出第一个问题 World War I began in which\
  \ year? 的答案是 1914，它位于索引 3（即第四个选项）。因此，我们在 `correctAnswerSlots` 数组的第一个位置放置了 3。\n\n\
  - 2. 现在，我们可以继续在 `exports.handler` 中实现事件的处理。我们的 Lambda 将处理两种基本请求：\n    - `LaunchRequest`：处理技能的启动\n\
  \    - `IntentRequest`：处理各种 Intent（在我们的例子中，我们只有两个 intent，第一个是 Answer intent，表示 Factly\
  \ 提出的问题的答案，以及 `AMAZON.StopIntent`，表示退出技能）\n\n我们将首先对技能收到的每个请求进行区分。为此，声明以下处理器：\n\n\
  ```javascript\nexports.handler = function (event, context) {\n    try {\n\n    \
  \    if (event.request.type === \"LaunchRequest\") {\n        } else if (event.request.type\
  \ === \"IntentRequest\") {\n\n        }\n    } catch (e) {\n        context.fail(\"\
  Exception: \" + e);\n    }\n};\n```\n\n这就是我们区分 Launch 和 Intent 事件请求的方式。\n\n- 3.\
  \ 接下来，我们将定义一些辅助函数，帮助我们创建语音响应：\n\n```javascript\n// ------ Helper functions ------\n\
  \nfunction buildSpeechletResponse(output, repromptText, shouldEndSession) {\n  \
  \  return {\n        outputSpeech: {\n            type: \"PlainText\",\n       \
  \     text: output\n        },\n        reprompt: {\n            outputSpeech: {\n\
  \                type: \"PlainText\",\n                text: repromptText\n    \
  \        }\n        },\n        shouldEndSession: shouldEndSession\n    };\n}\n\n\
  function buildResponse(sessionAttributes, speechletResponse) {\n    return {\n \
  \       version: \"1.0\",\n        sessionAttributes: sessionAttributes,\n     \
  \   response: speechletResponse\n    };\n}\n```\n\n这些函数帮助 Lambda 在接收到特定 intent/输入时返回供\
  \ Alexa 朗读的响应。\n\n`buildResponse` 函数将生成供 Alexa 朗读的纯文本响应。\n\n`buildSpeechletResponse`\
  \ 函数将指定 Alexa 最终会以纯文本形式朗读的输出。它还接受另一个变量 `shouldEndSession`，该变量指定 Alexa 在响应后是否应结束会话。\n\
  \n- 4. 配置好辅助函数后，我们可以更新 `LaunchRequest` 和 `IntentRequest` 情况的处理，使 Alexa 朗读相关的响应，如以下代码所示：\n\
  \n```javascript\nexports.handler = function (event, context) {\n    try {\n\n  \
  \      if (event.request.type === \"LaunchRequest\") {\n            onLaunch(event.request,\n\
  \                event.session,\n                function callback(sessionAttributes,\
  \ speechletResponse) {\n                    context.succeed(buildResponse(sessionAttributes,\n\
  \                        speechletResponse));\n                });\n        } else\
  \ if (event.request.type === \"IntentRequest\") {\n            //TBD\n        }\n\
  \    } catch (e) {\n        context.fail(\"Exception: \" + e);\n    }\n};\n```\n\
  \n当 Lambda 接收到 `LaunchRequest` 时，它将调用 `onLaunch` 方法以返回欢迎消息：\n\n```javascript\nfunction\
  \ onLaunch(launchRequest, session, callback) {\n    getWelcomeResponse(callback);\n\
  }\n```\n\n我们将在下一步实现 `getWelcomeResponse` 方法。\n\n请通过点击屏幕右上角的 **Save** 按钮保存我们的进度。\n\
  \n- 5. `getWelcomeResponse` 方法负责制定启动响应并向用户提出第一个问题：\n\n```javascript\nvar ANSWER_COUNT\
  \ = 4;\nvar GAME_LENGTH = 3;\n\nfunction getWelcomeResponse(callback) {\n    var\
  \ sessionAttributes = {},\n        speechOutput = \"Factly will ask you \" +\n \
  \           GAME_LENGTH.toString()\n            + \" questions, try to get as many\
  \ right as you can. Just say the number of the answer. Let's begin. \",\n      \
  \  shouldEndSession = false,\n\n        gameQuestions = populateGameQuestions(),\n\
  \        currentQuestionIndex = 0,\n        correctAnswerIndex =\n            correctAnswerSlots[currentQuestionIndex],\n\
  \        answers = populateAnswers(gameQuestions, 0),\n\n        spokenQuestion\
  \ =\n            Object.keys(questions[gameQuestions[currentQuestionIndex]])[0],\n\
  \        repromptText = \"Question 1. \" + spokenQuestion + \" \",\n\n        i;\n\
  \n    for (i = 0; i < ANSWER_COUNT; i++) {\n        repromptText += (i + 1).toString()\
  \ + \". \" + answers[i] +\n            \". \"\n    }\n    speechOutput += repromptText;\n\
  \    sessionAttributes = {\n        \"speechOutput\": repromptText,\n        \"\
  repromptText\": repromptText,\n        \"currentQuestionIndex\": currentQuestionIndex,\n\
  \        \"correctAnswerIndex\": correctAnswerIndex + 1,\n        \"questions\"\
  : gameQuestions,\n        \"score\": 0\n    };\n    callback(sessionAttributes,\n\
  \        buildSpeechletResponse(speechOutput, repromptText,\n            shouldEndSession));\n\
  }\n```\n\n\n\n\n\n如前面的代码所示，在定义 getWelcomeResponse 函数之前，我们声明了两个变量，ANSWER_COUNT 和\
  \ GAME_LENGTH，它们分别表示每个问题的答案数量和游戏中测验问题的总数。这些变量将被 getWelcomeResponse 函数使用。\n\n接下来，我们定义\
  \ getWelcomeResponse 函数，该函数首先使用 GAME_LENGTH 变量创建一个启动响应。然后它使用 populateGameQuestions\
  \ 方法加载 gameQuestions 的所有索引：\n\n```javascript\nfunction populateGameQuestions() {\n\
  \    var gameQuestions = [];\n    var index = questions.length;\n\n    if (GAME_LENGTH\
  \ > index){\n        throw \"Invalid Game Length.\";\n    }\n\n    for (var j =\
  \ 0; j < GAME_LENGTH; j++){\n        gameQuestions.push(j);\n    }\n\n    return\
