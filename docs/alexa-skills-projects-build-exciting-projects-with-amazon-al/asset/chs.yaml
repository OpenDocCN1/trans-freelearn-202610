  \ 以 **lambda_basic_execution** 模式执行，这是我们在创建它时选择的，该模式仅允许 Lambda 执行一些基本代码并记录一些数据。要连接到\
  \ DynamoDB，我们需要提升 **lambda_basic_execution** 模式，使其能够访问 DynamoDB，我们将通过 **IAM** 实现这一点，IAM\
  \ 是用于 **Identity and Access Management** 的 Amazon Web 服务。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_125_1.png)\n\
  \n要了解有关 IAM 的更多信息，请访问 https://aws.amazon.com/iam/。\n\n让我们开始：\n\n- 1. 导航到 https://console.aws.amazon.com。从提供的服务列表中选择\
