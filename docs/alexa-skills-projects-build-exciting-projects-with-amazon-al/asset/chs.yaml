  \ to the `MainActivity` class:\n\n```\nprivate static final int REQUEST_LOCATION\
  \ = 1;\n```\n\nThe `ensureLocationPermissionIsEnabled` method checks whether the\
  \ location permission is granted, and if not, it requests the permission from the\
  \ system.\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_182_0.png)\n\nNote that Android\
  \ Marshmallow (API Level 23) introduced the runtime permission model, which allows\
  \ the apps to request user permissions in Android at runtime, rather than at compile\
  \ time, which is also the reason why we check for API Level in the preceding code\
  \ before requesting runtime permissions. To read more about the runtime permission\
  \ model, visit https://developer.android.com/training/permissions/requesting.html.\n\
  \nThe preceding method uses the `ActivityCompat` class, which does all the hard\
  \ work for us all in a single line of code.\n\n3. The ActivityCompat class also\
  \ provides the callback method, which gets called with the user's selection result\
  \ (whether or not the user granted the permission). Depending on the result, we\
  \ can take appropriate action. We will also implement this callback method, which\
  \ is called onRequestPermissionResult, to listen for results of the permission request\
  \ presented to the user. Add the following method to your MainActivity class:\n\n\
  ```\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n    String\
