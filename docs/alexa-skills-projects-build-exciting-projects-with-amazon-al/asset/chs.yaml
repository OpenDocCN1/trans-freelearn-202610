  \n图 6.42：从 CloudWatch 仪表板启动日志\n\n这里会显示你拥有的且有可用日志的技能列表。单击你选择的技能，会显示可用日志列表，并按时间顺序排序。你可以单击其中任意一个日志，查看详细的日志记录，其中包含你的技能已响应的完整事件列表：\n\
