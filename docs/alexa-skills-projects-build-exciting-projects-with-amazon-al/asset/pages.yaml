    # Adding Persistence to Factly


    When it comes to games (and also to life), persistence is the key. Seriously,
    if we had no way to save the progress of Mario at different levels, we would have
    never ended up saving the princess eventually.


    > To know more about Mario, please visit https://en.wikipedia.org/wiki/Mario.'
