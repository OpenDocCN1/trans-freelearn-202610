- pgno: 224
  md: '# # Popular Alexa Skills


    At the time of writing, the total count of Alexa Skills available in the US, which
    is also the biggest market for Amazon Alexa, has surpassed 30,000, with an average
    of 50 new skills getting published each day. Each of these skills is available
    under a specific category, and the Alexa Skills Store is currently letting the
    developers and users choose from 23 different major categories, as shown in the
    following screenshot:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_224_0.png)


    Figure 7.1: Alexa Skills – categorical distribution


    At the time of writing (mid-2018), the most popular categories (the ones that
    have the most skills) among developers are:


    +   - **Games and Trivia:** Hosts over 6,000 skills

    +   - **News:** Hosts over 3,000 skills

    +   - **Music and Audio:** Hosts over 3,000 skills

    +   - **Education and Reference:** Hosts over 3,000 skills

    +   - **Lifestyle:** Hosts over 2,000 skills'
  merge: -1
  img_proc: true
