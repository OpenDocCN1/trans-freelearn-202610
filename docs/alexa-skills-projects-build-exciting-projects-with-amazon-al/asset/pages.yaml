- pgno: 183
  md: "3. The ActivityCompat class also provides the callback method, which gets called\
    \ with the user's selection result (whether or not the user granted the permission).\
    \ Depending on the result, we can take appropriate action. We will also implement\
    \ this callback method, which is called onRequestPermissionResult, to listen for\
    \ results of the permission request presented to the user. Add the following method\
    \ to your MainActivity class:\n\n```\n@Override\npublic void onRequestPermissionsResult(int\
    \ requestCode,\n    String permissions[],\n    int[] grantResults) {\n    switch\
    \ (requestCode) {\n    case REQUEST_LOCATION: {\n        // If request is cancelled,\
    \ the result arrays are empty.\n        if ((grantResults.length > 0\n       \
    \     && grantResults[0] ==\n            PackageManager.PERMISSION_GRANTED) {\n\
    \            Log.i(TAG, \"Permission Granted\");\n        } else {\n         \
    \   Toast.makeText(getApplicationContext(),\n                \"Location Permission\
    \ Not granted\",\n                Toast.LENGTH_LONG).show();\n            finish();\n\
    \        }\n        break;\n    }\n    default:\n    }\n}\n```\n\nThe preceding\
    \ method simply logs it to the console if the permission has been granted; otherwise,\
    \ it finishes the activity and exits the app. We have added the necessary methods,\
    \ now we need to call them too.\n\n4. For calling the methods that we added in\
    \ Step 2 regarding enabling of location permissions, add a checkPermissions method\
    \ to the MainActivity class:\n\n```\nprivate void checkPermissions(BluetoothAdapter\
    \ bluetoothAdapter) {\n    if (!bluetoothAdapter.isEnabled()) {\n        Intent\
    \ enableBtIntent = new\n        Intent(BluetoothAdapter.ACTION_REQUEST_ENABLE);\n\
    \        startActivityForResult(enableBtIntent, REQUEST_ENABLE_BT);\n        return;\n\
    \    }\n}\n```"
