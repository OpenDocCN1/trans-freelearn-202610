- pgno: 227
  md: 'Surprisingly, at the time of writing, the **Kids** category has the fewest
    skills, which makes it developers'' least favorite category to develop for, but
    on the bright side, it has the lowest amount of competition and a lot of room
    for growth.


    So far, we have seen the various categories on the Alexa Skills Store and also
    outlined the most and least popular categories of all the available categories.
    Now, delving deeper into the categories, let''s identify the best of the best,
    that is, the skills that are most downloaded/used among the top major categories.


    # Games and Trivia


    One of the top downloaded skills under the **Games and Trivia** category is Would
    You Rather For Family, which has over 3,000 ratings and user reviews.


    ![](img/80ddccf2572659c5b147f23cc6356c5a_227_0.png)


    To learn more about the Would You Rather For Family Alexa Skill, please visit
    `https://www.amazon.com/Would-You-Rather-For-Family/dp/B06WGV16HR`.


    It is the voice-computed version of the popular game Would You Rather, which has
    Alexa asking the players tricky/trivial questions and the players replying to
    those. To keep the fun in the game, new questions are continuously added by the
    developers.


    Other popular skills in this category include Question of the Day, Jeopardy, and
    Twenty Questions. We suggest that you check them out on the Alexa Skills Store.


    # News


    No surprise here, some of the top news-providing skills are from the channels
    and media houses that we are already familiar with:


    +   - BBC

    +   - CNN

    +   - ESPN

    +   - Fox News'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'Some channels even have different options for their skills, depending on the
    user''s requirement. For example, CNN has developed and provided two different
    skills, one for providing flash briefings and the other for regular news. We suggest
    that you check them out on the Alexa Skills Store.


    # Music and Audio


    The top *official* skills under this category are for **Ambient Sounds**, which
    provide Alexa with the capability of playing rain, thunderstorm, and ocean sounds,
    which can help users relax and sleep better. However, Alexa can also be linked
    to your Spotify account, if you have one, and can double as an excellent music
    player.


    ![](img/80ddccf2572659c5b147f23cc6356c5a_228_0.png)


    To learn more about Spotify and Alexa integration, navigate to https://www.spotify.com/us/amazonalexa/.


    Hence, Spotify with Alexa is one of the top contenders in this category.


    # Education and Reference


    One of the top downloaded skills under this category is Word of the Day, which
    has over 900 ratings and promises to teach the user a new word, and how to use
    it in a sentence, every day.


    ![](img/80ddccf2572659c5b147f23cc6356c5a_228_1.png)


    To learn more about the Word of the Day skill, visit https://www.amazon.com/Volley-Inc-Word-the-Day/dp/B06VTHH5MW/.


    As per the developers of the skill, it is updated daily with new content.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Lifestyle


    The most popular skills under this category are for **Meditation/Zen Sounds**,
    which provide Alexa with the capability of playing soothing sounds, which can
    help the users to meditate.


    Another popular skill in this category is **Fitbit**; using this skill, a user
    can keep track of their details recorded via the Fitbit fitness tracker and fitness
    goals using Alexa.


    We have seen the best skills under the top five categories offered by the Alexa
    Skills Store. Now, a question to you: did you notice any common traits among the
    top-selling skills? Take a few minutes to think this over before moving ahead
    to read the answer.


    Well, we hope you have given it some thought by now. Here is the answer: all the
    top skills in these categories have one common feature—**dynamism**. This means
    they are updated with new features very frequently, and some are even updated
    daily. Take any skill (with the exception of the News skills, since their daily
    content is already dynamic in itself); whether it is a **Games/Trivia** skill
    or an educational skill, if it is one of the top spots, then it stays one step
    ahead of its users by always providing them with something new to discover, which
    keeps the users hooked to the Skill, and they keep coming back to discover more
    content. Dynamism of content is the key if you want your skill to be a leader
    in its category.


    We''ve looked at various categories and Alexa Skills; let''s now move on to analyze
    and compare various voice-based personal assistants.


    # Comparing Various Voice-Based Assistants


    Although we have already discussed and compared various voice-based assistants
    to some extent in *Chapter 1, What is Alexa?*, in this section we will limit our
    discussion to voice-enabled speakers that host these assistants.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'As of 2018, there are only a few major players in the voice-enabled speaker
    market (source: voicebot.ai), namely Amazon, which holds the lion''s share of
    52%, then Google Home, standing at 32%, Apple''s HomePod at 12%, and the rest
    of the market is divided between several other players, as depicted in the following
    pie chart:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_230_0.png)


    Figure 7.4: Alexa Skills – distribution of smart speaker market


    We will cover three of the major players in this section; Amazon Echo, Google
    Home, and Apple HomePod.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# # Amazon Echo


    Introduced in November 2014, the Echo series of smart speakers by Amazon had the
    first mover''s advantage in the voice-computing market, which enabled it to grab
    the lion''s share of 70% of the complete market. But that is not the only thing
    going for it; Amazon offers the widest range of voice-enabled speakers, each with
    its own distinctive usage, some of which are mentioned as follows:


    +   - **Echo Dot**: Smallest and most affordable.

    +   - **Echo**: Mid-range product, slightly better sound quality than Echo Dot.

    +   - **Echo Plus**: Bigger than Echo with best sound quality. Has a Zigbee hub
    built in for better smart-home integration.

    +   - **Echo Spot**: Circular Echo with a screen.

    +   - **Echo Spot**: Echo with a larger screen, ideal for video chatting.


    The wide range of products ensures that there is something for every need and
    taste. Also, the cheapest Echo product is around $50, which makes it one of the
    major affordable choices out of the three brands.


    The screen-based Echo already adds the video playback functionality to the smart
    speaker, which is a big add-on. None of the other two major players (Google and
    Apple) has such a device that has the combined functionality of a smart speaker
    powered with video playback.


    Also, Amazon has already created a skills-based ecosystem for the Echo products,
    which enables the Echo to seamlessly integrate with various third-party services,
    such as Uber and Domino''s.


    # # Google Home


    Introduced in late 2016, Google Home was launched to directly compete against
    Amazon Echo, with the Google Assistant being Alexa''s counterpart. The Google
    Home devices have a slightly narrower range as compared to the Echo series of
    devices:


    +   - **Google Home Mini**: Smallest, most affordable, and priced similarly to
    Echo Dot.

    +   - **Google Home**: Original Google flagship smart speaker. Has better sound
    quality than Google Home Mini.

    +   - **Google Home Max**: Largest, best sound quality, and most expensive of
    the three.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'All three are powered by the Google Assistant, and so the differentiating points
    come down to form factors, voice quality, and pricing between the Home Mini, Home,
    and Home Max:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_232_0.png)


    Figure 7.5: Google Home, Mini, and Max (Source: speakerfanatic.com)


    Compared with Amazon Echo, since Google''s niche is web search, Google Home is
    slightly more conversational and better at handling web-based queries. However,
    Amazon Echo quickly tried to bridge that gap by supporting a larger number of
    smart home brands than Google Home, which is due to the fact that Amazon, being
    the first to the market, had already expanded its Skill-based ecosystem to pull
    in more and more third-party developers. However, we are pretty sure that Google
    Home will catch up soon, or at least provide some tough competition.


    # Apple HomePod


    Introduced in late 2017 and released in early 2018, HomePod by Apple is an attempt
    to counterstrike the Amazon Echo and Google Home:'
  merge: -1
  img_proc: true
- pgno: 233
  md: '![](img/80ddccf2572659c5b147f23cc6356c5a_233_0.png)


    It is a smart speaker by Apple, with Siri being the counterpart to the Google
    Assistant and Alexa. Priced at $349 (at the time of writing), it is second only
    to Google Home Max (priced at $399) in terms of price.


    HomePod''s design provides it with 360-degree sound with good clarity and quality,
    however, it is tightly coupled with Apple''s ecosystem. For example, Amazon Echo
    and Google Home easily integrate with third-party services, such as Spotify, which
    is a little difficult on Apple HomePod.


    We hope that you now have a good idea of what each smart speaker has to offer,
    and how they compare to each other. With this information, we''ll move to the
    last section, where we will discuss the future of smart speakers.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Future of Voice-Based Assistants


    In the infancy of the smart speaker market in 2016, the total number of smart
    speaker units sold was less than 10 million, however, at the beginning of the
    latter half of 2017, Amazon Echo had sold more than 20 million devices alone (source:
    voicebot.ai) and it is predicted (source: voicebot.ai) that, during 2018, more
    than 56 million smart speaker devices will be sold:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_234_0.png)


    Figure 7.7: Growth of smart speaker market'
  merge: -1
  img_proc: true
