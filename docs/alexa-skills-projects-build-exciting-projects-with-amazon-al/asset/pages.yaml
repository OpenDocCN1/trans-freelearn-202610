    # # Designing the Factly Skill


    We hope that the discussion in the last section should have given you a fair idea
    of the motivation behind the Factly Alexa Skill. Now, we shall level up and design
    the actual Factly Skill. It is always better to design before coding anything
    because it gives us a clarity about the end goals of the software and the finer
    details, which we may otherwise miss when we actually code the software.


    The Factly Alexa Skill is a simple quiz skill. At the code level, the Factly Skill/Lambda
    will contain a bank of questions that will be presented to the user one by one.
    The skill will further perform depending on the user''s reply.


    Factly will work via the following steps:


    +   1. The user will launch the Factly Skill via a standard Alexa Skill launch
    utterance.

    +   2. Alexa will confirm the launch and provide a brief introduction to the skill
    and play method:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_100_0.png)


    Figure 4.7: Step 1 – Factly, launch


    The skill that we will design will consist of three trivia questions and each
    question will have four answer choices, with only a single choice being the correct
    one.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '3. Alexa will begin the quiz by asking the first question:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_101_0.png)


    Figure 4.8: Step 2 – Factly, questionnaire


    4. The user can provide the answer by just saying the number of the correct answer,
    for example: "The answer is 3" or just "3":


    ![](img/80ddccf2572659c5b147f23cc6356c5a_101_1.png)


    Figure 4.9: Step 3 – Factly, answer acknowledgment


    Depending on the user''s answer, the skill will provide a response that the answer
    is correct or incorrect.


    5. The user can also end the session:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_101_2.png)


    Figure 4.10: Step 4 – Factly, conclusion'
  merge: -1
  img_proc: true
