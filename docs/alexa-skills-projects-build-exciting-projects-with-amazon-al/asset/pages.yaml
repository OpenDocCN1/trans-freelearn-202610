- pgno: 173
  md: '# Introduction to Home Automation and Ambient Sensors


    For introductory purposes, home automation is a concept whereby a user can control
    standard home fixtures such as lights, music systems, televisions, and even climate,
    using an array of intelligent sensors rather than the traditional flipping of
    switches for each individual fixture. Home automation intends to keep the physical
    interaction of the user with the actual hardware as minimal as possible. In the
    recent present and the not-so-distant past, the concept of home automation was
    built on top of mobile operating systems (mostly Android or iOS), where the user
    was able to control the whole house using just a mobile device or a tablet rather
    than interacting with the switches of each individual device present in the house.


    With the advent of Interactive Voice Assistants, the concept of home automation
    has transcended to the level where a user can control a home with just their voice.
    The actual concept of home automation is very broad and a complete solution will
    include a wide array of sensors. In this chapter, we will demonstrate the concept
    of home automation with respect to Voice-Based Personal Assistants using a key
    feature provided in almost every automated home, which is the gathering of information
    regarding climate/ambience (temperature, humidity, and so on). We will create
    a solution that includes an ambient sensor, a mobile app, and Alexa, from which
    a user can get the ambience details of their house by just asking Alexa.


    Ambience monitoring solutions are not only used for home automation, but also
    in various warehouses (where it is imperative that the products are maintained
    at a certain temperature/humidity) due to the fact that they can transmit ambience
    data over long ranges, both over Wi-Fi and/or Bluetooth (BLE). However, those
    solutions are also more expensive and difficult to procure. Hence, for our needs,
    we will be using a popular sensor-prototyping solution called CC2650STK (popularly
    known as SensorTag) manufactured by Texas Instruments, that is small, easily available,
    perfectly fits with the home automation concept, and can be easily purchased from
    hobby/electronics stores or online from the Texas Instruments Inc. (TI) website,
    or Amazon, for a mere US$45-50.


