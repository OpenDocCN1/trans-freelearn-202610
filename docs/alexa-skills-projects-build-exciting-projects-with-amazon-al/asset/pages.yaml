- pgno: 212
  md: "Adding the **Skill ID** ensures that the Lambda responds to only those requests\
    \ that are generated by the verified skill. After adding the **Skill ID**, please\
    \ click on the **Add** button at the bottom of the screen. Our Lambda configuration\
    \ should have some unsaved changes now. Please save the recent changes by clicking\
    \ on **Save** button in the top-right corner of the screen.\n\n+   3. Once you\
    \ have clicked the **Save** button, select the **ambienceManagerSkill** box under\
    \ the **Designer** section. This should bring up a code editor at the bottom where\
    \ we will add the code for the Lambda.\n\n# Coding the Lambda function\n\nFollowing\
    \ the Lambda setup, it's time to code the actual Lambda function. We will be editing\
    \ the code inline, in the `index.js` file on the Developer Portal itself, following\
    \ these steps:\n\n+   1. Implement the handling of events in `exports.handler`.\
    \ Our Lambda, in this case, will be handling only a single intent, that is, `OneShotFetchTemperatureIntent`.\
    \ Since we are implementing a One-Shot Launch, this single intent will launch\
    \ our skill and fetch the temperature data.\n\nBefore we move on to write the\
    \ functional logic, declare the following variables, which will be used by our\
    \ functional logic:\n\n```\nvar https = require('https');\nvar firebaseHost =\
    \ \"androidwarehousemonitor.firebaseio.com\";\n```\n\n`firebaseHost` is the same\
    \ URL (it may be different in your case, depending on how you set up Firebase\
    \ for the Android app) that we copied earlier when we were setting up Firebase.\
    \ Since we will be connecting to Firebase via a REST call, we will need its `firebaseHost`\
    \ URL and `https`.\n\nThen, update the code of `exports.handler`, as shown here:\n\
    \n```\nexports.handler = (event, context, callback) => {\n    try {\n        if\
    \ (event.request.type === \"IntentRequest\") {\n            if (\"OneShotFetchTemperatureIntent\"\
    \ ===\n            event.request.intent.name) {\n            } else {\n      \
    \          throw \"Invalid intent\";\n            }\n        }\n    }\n```"
  merge: -1
