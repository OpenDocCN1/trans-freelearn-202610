    Now, moving on to the second generation of Amazon Echo family.


    # Amazon Echo – Second Generation


    The second generation of the Amazon Echo family introduced newer Echo devices,
    such as Echo Plus, Echo Show, and Echo Look. Our main focus in this chapter is
    on the speakers, Amazon Echo and Amazon Echo Dot:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_34_0.png)


