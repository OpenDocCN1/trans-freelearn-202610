- pgno: 15
  md: '# The Need for Voice-Based Personal Assistants


    To understand the evolution of voice-based personal assistants, we will have to
    go back in time and see some of the important events that led to their advent.
    One of these many events was the evolution of computers. Although not directly
    related to the voice revolution, the evolution of computers played a key role
    in the evolution of voice-based personal assistants because it marked the invention
    of the internet, which is the backbone of most voice-based personal assistants.
    The computer revolution also introduced critical changes concerning hardware and
    integrated circuits, which we shall discuss next.


    The computer revolution began in the 19th century when Charles Babbage invented
    the first analytical engine, which earned him the nickname the Father of Computers.
    The 1950s and 1960s were interesting times, which introduced some tremendous advances
    in the field of computer science with a groundbreaking invention, integrated circuits.
    Integrated circuits replaced diodes and vacuum tubes, which led to tremendous
    form factor changes in existing computers, in turn leading to smaller, more compact
    sizes. It was also the time when Gordon Moore introduced his famous observation
    that the number of transistors in an integrated circuit doubles every two years;
    roughly speaking, we would be able to pack more and more processing power into
    an integrated circuit while the size of the circuit would shrink every two years.
    Moore''s observation already foresaw the future of our technology and hardware,
    and by following it we could have easily predicted at least one thing, that we
    would be seeing our computers getting smaller, a lot smaller, and voilà, today
    nearly everyone has a small computer in his/her hands, their smartphone.


    The late ''60s and early ''70s also saw the advent of the Advanced Research Projects
    Agency Network (ARPANET), which eventually evolved to become the internet as we
    came to know it in the ''80s. All this sounds trivial at first, before you realize
    that all these were the key factors that, had they not been invented, we would
    have never seen voice-based personal assistants in action.


    Prior to voice-based personal assistants, the traditional way of sending commands
    to a computer system was either through the GUI using a mouse or through the terminal
    using a keyboard. As the form factor of traditional computing systems reduced,
    the input methods evolved too and initial handheld devices/mobile phones introduced
    a stylus in addition to the traditional keyboard to leverage the touchscreen capabilities
    of the device:'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/80ddccf2572659c5b147f23cc6356c5a_16_0.png)


    Figure 1.1: A smartphone with a stylus, captured in the year 2010


    The evolution continued and the place of the stylus was taken by, as pointed out
    by Steve Jobs, "the best pointing device in the world," our fingers.


    ![](img/80ddccf2572659c5b147f23cc6356c5a_16_1.png)


    Steve Jobs introduced touch on the iPhone by using the term "best pointing device
    in the world" for a user''s fingers in 2007 during the MacWorld Conference in
    San Francisco. The highlights of this conference are available on YouTube at `https://www.youtube.com/watch?v=P-a_R6ewrmM`.


    As the interface between computers and humans grew thinner, it was only natural
    that voice was the next medium that could act as an input tool to computing devices,
    and hence there has been the advent of voice-based personal assistants.


    ![](img/80ddccf2572659c5b147f23cc6356c5a_16_2.png)


    The idea of having voice as an input medium for computing devices was not new;
    parallel to the computer revolution, there was also the voice revolution, many
    important discoveries of which are shown in the link: `https://voicebot.ai/2017/07/14/timeline-voice-assistants-short-history-voice-revolution/`'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Of the many milestones of the voice revolution, almost every reader will be
    familiar with at least a few of the latest ones, namely Siri, Google Now, Cortana,
    and Amazon''s Alexa. The most popular ones are Apple''s Siri and Google''s Google
    Now, which initially appeared integrated with iOS and Android mobile devices,
    respectively.


    Apple''s Siri initially appeared as an app on Apple''s App Store, but was later
    acquired by Apple and became much more closely integrated with iOS devices. Siri
    uses a natural language interface to listen to commands from the user and perform
    the necessary actions. Also, with the coming of macOS Sierra, its capabilities
    were no longer limited to iOS devices:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_17_0.png)


    Figure 1.3: The capabilities of Siri also extend to desktops in addition to iPhones


    Google closely followed in the footsteps of Apple and, shortly after the introduction
    of Siri in 2011, introduced Google Now in 2012. Unlike Siri, Google Now was available
    natively for Android and also as a separate app for iOS devices. Google Now seamlessly
    integrated with other Android/Google features such as Gmail, Google Calendar,
    and the mighty Google Search itself:'
  merge: -1
  img_proc: true
- pgno: 18
  md: '![](img/80ddccf2572659c5b147f23cc6356c5a_18_0.png)


    Figure 1.4: Google Now is available on iOS as part of a native app (Google and
    the Google logo are registered trademarks of Google Inc., used with permission.)


    Closely behind Google was Microsoft with its own intelligent voice-based assistant,
    Cortana, which it introduced in 2014 for desktop and mobile devices:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_18_1.png)


    Figure 1.5: Microsoft''s Cortana was initially introduced for Microsoft''s mobile
    and desktop computing systems'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'As time passed, it became evident that voice-based personal assistants were
    here to stay and needed exclusive hardware and space of their own. This was something
    that Amazon took the lead on with the introduction of its brand Amazon Echo, which
    was a device family of smart speakers, specifically designed and developed by
    Amazon Inc. to enable its users to use the services of an interactive voice-based
    personal assistant called *Alexa* (hence the title of the chapter):


    ![](img/80ddccf2572659c5b147f23cc6356c5a_19_0.png)


    Figure 1.6: The Amazon Echo device family


    The complete Echo family and their functionalities are described in the following
    table:


    | Device | Use |

    |---|---|

    | Amazon Echo | Original flagship smart speaker. |

    | Echo Dot | Smaller and cheaper version of Echo without the amplified speaker,
    so the sound quality is also inferior to Echo. |

    | Echo Plus | Latest version of Echo with Zigbee integration. |

    | Echo Show | Alexa-enabled device with a large touchscreen so that a user''s
    interaction with Alexa is not just auditory but also visual. |

    | Echo Spot | *Show + Dot = Spot*. All the basic functionality of Show and Dot
    devices with the much lesser form factor. |

    | Amazon Tap | Alexa-enabled Bluetooth speaker. |'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'The Echo family marked Amazon''s second foray into the hardware domain, the
    first being its introduction of the popular ebook reader, Kindle. Google also
    recognized the fact that interactive voice assistants can do much more by specifically
    leveraging the smart home concept and closely followed behind Amazon with its
    Google Home Smart Speaker, which contained Google Assistant as Alexa''s counterpart:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_20_0.png)


    Figure 1.7: Launch timeline for various voice-based personal assistants (source:
    www.citiusminds.com)


    Please note that the preceding diagram does not include Google Now, which was
    introduced in 2012.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'We have discussed the evolution of voice-based interactive personal assistants
    and how they developed from just another app on the user''s smartphone to the
    user''s smart home.


    In the next section, we shall discuss some of the popular uses of voice-based
    interactive personal assistants.


    # Applications of Voice-Based Personal Assistants


    We discussed the evolution of voice-based personal assistants in the previous
    section. In this section, we shall extend that discussion to some of the popular
    uses of each of the interactive voice-based personal assistants, irrespective
    of whether the assistant in question is desktop, smartphone, or smart home-based.
    We shall begin with one of the earliest and most well-known ones, Apple''s Siri.


    # Siri


    As indicated earlier, Siri started as a separate smartphone app in 2011 for iOS,
    which was later on acquired by Apple. Initially, the capabilities of Siri were
    limited to smartphones and simple functions such as:


    +   - Looking up contacts

    +   - Messaging (SMS)

    +   - Fetching weather updates on user demand, plus other simple queries as mentioned
    in the previous section


    However, Apple''s roadmap also extended the capabilities of Siri by closely integrating
    it with third-party apps and, true to their promise, with the coming of iOS 10,
    Apple also released SiriKit.


    ![](img/80ddccf2572659c5b147f23cc6356c5a_21_0.png)


    To know more about SiriKit, please visit https://developer.apple.com/sirikit/.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'If the user has the following third-party apps installed, he/she can request
    a ride using Siri:


    +   - Uber

    +   - Lyft


    If the user has the following third-party apps installed, he/she can set those
    to send a message (and not just an SMS) using Siri:


    +   - WhatsApp

    +   - LinkedIn

    +   - WeChat

    +   - Slack


    A user can also make VoIP calls using the following apps via Siri:


    +   - Skype

    +   - Viber


    ![](img/80ddccf2572659c5b147f23cc6356c5a_22_0.png)


    Please note that the preceding lists are not exhaustive. However, third-party
    integrations were not the only thing on Apple''s roadmap to extend the capabilities
    of Siri. The launch of macOS Sierra also brought the capabilities of Siri to the
    desktop. To know more about Siri''s desktop capabilities, please visit https://support.apple.com/en-us/HT206993.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Siri can also help a user to:


    +   - Search files on his/her Mac

    +   - Notify the user about their storage space

    +   - Send requests to FaceTime with Contacts, and many others as shown here:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_23_0.png)


    Figure 1.8: List of things Siri can help with (non-exhaustive) (source: www.osxdaily.com)


    With a fair idea about Siri''s desktop and smartphone capabilities, let''s now
    move on to another popular voice assistant.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Google Now


    We are going to discuss the Android and Google Now next, which at the time of
    writing is the biggest player in the smartphone market and also the home of Google
    Now, the voice assistant introduced by Google for Android smartphones in 2012.


    In early 2010, the smartphone market was dominated by many players. Over the years,
    this has filtered down and only two major players remain in the market as depicted
    as follows:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_24_0.png)


    Figure 1.9: Smartphone market share distribution comparison between the years
    2010 and 2016 (Data sourced from Gartner)'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Google Now can do pretty much all that Siri can accomplish; however, it has
    better integration with the web and web-based queries, since the web is Google''s
    main forte. Some of the things that a user can ask Google Now are:


    | Categories | Commands |

    |---|---|

    | General commands | • "What is [Schrodinger''s cat]?"\n• "Who invented [the internet]?"\n•
    "Post to Google+ [feeling great]" |

    | Notes and reminders | • "Set alarm for [8 PM]"\n• "Note to self: [I parked my
    car in section D]" |

    | Time and date | • "What is the time zone of [Berlin]"\n• "Time at home"\n• "Create
    a calendar event: [Dinner in restaurant] [Saturday at 8 PM]" |

    | Communication | • "Call [Daniel]"\n• "[Contact name]"\n• "Send [email] to Daniel,
    [Subject: Meeting], [Message: Will be there in 5]" |

    | Weather | • "Weather"\n• "Is it going to rain [tomorrow/Friday]"\n• "How''s
    the weather in [Boston] on [Wednesday] going to be?" |

    | Maps and navigation | • "Map of [Flagstaff]"\n• "Navigate to [Berlin] on car"\n•
    "Show me the nearby [restaurant] on map" |


    Figure 1.10: Some of the things that Google Now can do (Data source: www.cnet.com)


    Apart from Google Now, Google also has introduced Google Assistant, which is a
    more evolved version of Google Now, given the fact that the user can hold full-length
    conversations with Google Assistant, which is not possible with Google Now.'
  merge: -1
  img_proc: true
- pgno: 26
