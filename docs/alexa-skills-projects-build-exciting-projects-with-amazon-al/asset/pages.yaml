- pgno: 90
  md: "Please note that we have declared the same Twilio number as the sender that\
    \ we generated in Step 11 in the previous section.\n\n6. With our constants ready,\
    \ we can now finally define the SendMessage function:\n\n```\nfunction SendMessage(to,\
    \ body, callback) {\n    var message = {\n        To: to,\n        From: sender,\n\
    \        Body: body\n    };\n    var messageString = queryString.stringify(message);\n\
    \    var options = {\n        host: 'api.twilio.com',\n        port: 443,\n  \
    \      path: '/2010-04-01/Accounts/' + sid + '/Messages.json',\n        method:\
    \ 'POST',\n        headers: {\n            'Content-Type': 'application/x-www-form-urlencoded',\n\
    \            'Content-Length': Buffer.byteLength(messageString),\n           \
    \ 'Authorization': 'Basic ' + new Buffer(sid + ':' + token).toString('base64')\n\
    \        }\n    };\n    var req = https.request(options, function (res) {\n  \
    \      res.setEncoding('utf-8');\n        var responseString = '';\n        res.on('data',\
    \ function (data) {\n            responseString += data;\n        });\n      \
    \  res.on('end', function () {\n            var speechOutput = \"Message sent.\"\
    ;\n            var shouldEndSession = true;\n            callback(buildSpeechletResponse(speechOutput,\
    \ shouldEndSession));\n        });\n    });\n    req.write(messageString);\n \
    \   req.end();\n}\n```"
  merge: -1
  img_proc: true
- pgno: 91
  md: 'There is a lot going on in this function. The SendMessage function constructs
    a message object, which contains information about the sender, the recipient,
    and the text to send.


    It then places a request to the Twilio backend with the SID, AuthToken, and message
    string as parameters.


    The successful sending of the message is marked by Alexa confirming it by saying
    the phrase, "Message sent."


