  md: "```\n}\ncatch(e) {\n    context.fail(\"Exception: \" + e);\n}\n};\n```\n\n\
    As shown and discussed previously, we have discarded all the other intents (even\
    \ the Launch Intent, which we have handled religiously so far) and handled just\
    \ OneShotFetchTemperatureIntent to facilitate the One-Shot Launch of our skill.\n\
    \n+   2. We will define some helper functions that will help us create speech\
    \ responses, shown as follows:\n\n```\n// ------ Helper functions ------\n\nfunction\
    \ buildSpeechletResponse(output, repromptText, shouldEndSession) {\n    return\
    \ {\n        outputSpeech: {\n            type: \"PlainText\",\n            text:\
    \ output\n        },\n        reprompt: {\n            outputSpeech: {\n     \
    \           type: \"PlainText\",\n                text: repromptText\n       \
    \     }\n        },\n        shouldEndSession: shouldEndSession\n    };\n}\n\n\
    function buildResponse(sessionAttributes, speechletResponse) {\n    return {\n\
    \        version: \"1.0\",\n        sessionAttributes: sessionAttributes,\n  \
    \      response: speechletResponse\n    };\n}\n```\n\nThese functions help the\
    \ Lambda to return the response to be spoken by Alexa whenever it receives a specific\
    \ intent/input."
