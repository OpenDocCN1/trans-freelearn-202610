    Developer portal, and is already aware of the basic starter information about
    the Amazon Alexa Skills Developer Portal, since this has also been already covered
    in detail in Chapter 2, *Hello World, Alexa!*. We already covered account creation
    and other basic details for the Amazon Developer Portal in Chapter 2, *Hello World,
    Alexa!*, so we will not be repeating those here.


    We shall begin with the skill creation:


