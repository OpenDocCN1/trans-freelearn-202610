  md: "For this, add the `ensureLocationPermissionIsEnabled` method to the `MainActivity`\
    \ class, as follows:\n\n```\nprivate void ensureLocationPermissionIsEnabled()\
    \ {\n    if (Build.VERSION.SDK_INT >= 23 &&\n    ContextCompat.checkSelfPermission(this,\n\
    \    android.Manifest.permission.ACCESS_COARSE_LOCATION) !=\n    PackageManager.PERMISSION_GRANTED)\
    \ {\n    ActivityCompat.requestPermissions(this, new String[]{\n    android.Manifest.permission.ACCESS_COARSE_LOCATION},\n\
    \    REQUEST_LOCATION);\n    return;\n    }\n}\n```\n\nAfter adding the preceding\
    \ code and compiling the project, you will get an error regarding `REQUEST_LOCATION`\
    \ not being found. For that error to go away, add the following member variable\
    \ to the `MainActivity` class:\n\n```\nprivate static final int REQUEST_LOCATION\
    \ = 1;\n```\n\nThe `ensureLocationPermissionIsEnabled` method checks whether the\
    \ location permission is granted, and if not, it requests the permission from\
    \ the system.\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_182_0.png)\n\nNote that\
    \ Android Marshmallow (API Level 23) introduced the runtime permission model,\
    \ which allows the apps to request user permissions in Android at runtime, rather\
    \ than at compile time, which is also the reason why we check for API Level in\
    \ the preceding code before requesting runtime permissions. To read more about\
    \ the runtime permission model, visit https://developer.android.com/training/permissions/requesting.html.\n\
    \nThe preceding method uses the `ActivityCompat` class, which does all the hard\
    \ work for us all in a single line of code."
