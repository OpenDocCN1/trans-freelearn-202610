- pgno: 39
  md: '# Invocation Name


    An Invocation Name is a name that the user of a skill will speak and Alexa will
    use it to summon or identify your skill from its list of enabled/available skills.
    An example of a sample skill invocation is shown in the following screenshot:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_39_0.png)


    Figure 2.8: Launching a skill using an invocation name


    Please note that in the preceding example, we are using a one-word invocation
    name, which normally isn''t allowed by Alexa unless the invocation name is unique
    to your brand/IP. In the case of Spotify, this is true. Amazon has defined various
    rules regarding invocation names and these can be found on the Amazon Developer
    Portal.


    Please navigate to the following link to learn about the invocation name requirements
    imposed by Amazon for Alexa: https://developer.amazon.com/docs/custom-skills/choose-the-invocation-name-for-a-custom-skill.html


    Following the aforementioned rules for an invocation name in an utterance, another
    sample skill invocation utterance as shown in the following screenshot:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_39_1.png)


    Figure 2.9: Anatomy of a skill invocation name


    Hence, every Alexa Skill must have an invocation name and, in the upcoming section,
    our Hello World Alexa Skill will have one, too.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Intents and Slots


    The word *Intent* is derived from intention and, true to its meaning, an intent
    may map to one or many functionalities of an Alexa Skill. To understand intents
    better, let''s map this to something we already know, that is, common action buttons.
    For example, an e-commerce app or a web page may have a **Buy** button and clicking
    on that button will result in a **Buy Action**. When designing for voice, this
    **Buy Action** will translate into **Buy Intent**. We will look at common usages
    of **Buy Intent** shortly.


    Some intents/actions/functionalities are common to almost every skill, hence they
    are already predefined/pre-configured for each Alexa Skill. For example:


    +   - Help Intent

    +   - Cancel Intent


    ![](img/80ddccf2572659c5b147f23cc6356c5a_40_0.png)


    To get more information about built-in intents, please visit https://developer.amazon.com/docs/custom-skills/standard-built-in-intents.html.


    Each intent has a unique name and a mapping of sample utterances. As a developer,
    you may ask: *Why the sample utterances*? And, the reason is very simple—designing
    for voice is a bit tricky, since the user can say multiple things for a single
    action/intent. For example, for a buy action/intent, a user may say/utter the
    following:


    +   - Buy [item-name]

    +   - Purchase [item-name]

    +   - Acquire [item-name]

    +   - Go for [item-name]

    +   - Hold [item-name]


    To tackle this, we have utterances of an intent. The more utterances an intent
    has, the easier it is to invoke it.


    Hopefully, you will have a fair understanding of intents by now and that brings
    us to **Slots**: if an intent is an action, then slots are arguments to that action.
    In the "buy action/intent" example previously mentioned, the *item-name* will
    be the argument for the buy intent, hence *item-name* is a slot. We shall see
    how slots work together with intents in the coming chapters.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Lambda


    Lambda is a serverless computing service from **Amazon Web Services (AWS)**. If
    this sounds like a lot of technical jargon, please do not be confused as we will
    be discussing Lambda in detail in this section.


    In the context of voice design for Alexa, we will use AWS to host our *core programming
    logic* in the form of a Lambda function. Now, the obvious question is, *How does
    Lambda work together with an Alexa Skill?*. To answer, each of the intents/actions
    on the Alexa Skill will trigger the Lambda function, the Lambda function will
    process those intents, and this will result in returning an appropriate response
    for an action/intent, as depicted in the following diagram:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_41_0.png)


    The way this works is as follows:


    +   1. The user utters a voice command/query: "Alexa, ask Weather Monitor about
    today''s weather."

    +   2. Alexa identifies the skill to be launched from the query, which in this
    case is *Weather Monitor*.

    +   3. Alexa identifies the associated intent based on the utterance: "*ask* [skill
    name] *about today''s weather*."

    +   4. The intent is identified by the skills kit and is routed to the Lambda.

    +   5. Lambda processes the intent and returns an appropriate response.


    At a basic level, almost all Alexa Skills work through the preceding five steps.
    In the next section, we will actually see these five steps in action as we write
    our first skill.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Hello Alexa – Building a Hello World Alexa Skill


    This section addresses the final goal of this chapter, that is, actually writing
    our first Alexa Skill. However, please note that we do have a few prerequisites
    before we embark on the final leg of our journey through this chapter. For the
    success of this exercise, each user will need to have an Amazon Developer account.
    Signing up for an Amazon Developer account is a simple and straightforward process.
    The user can sign up for an account at https://developer.amazon.com.


    Signing up is a three-step process and includes providing personal information,
    accepting terms of service, and providing a payment method.


    Please note that although signing up requires you to provide Amazon with a payment
    method, Amazon will charge you if, and only if, you end up using any of the paid
    services. However, over the course of this book, we will be restricting our usage
    to free tier and will not be using any of the paid services.


    Signing up for an Amazon Developer account not only gives you access to the Alexa
    Skills Kit but also to a plethora of other different services by Amazon, such
    as AWS and many others. Once you are successfully logged in, you can see all the
    services that are available to you via the dashboard:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_42_0.png)


    Figure 2.11: Amazon Developer account dashboard (source: developer.amazon.com)'
  merge: -1
  img_proc: true
