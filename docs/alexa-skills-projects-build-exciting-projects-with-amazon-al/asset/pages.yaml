- pgno: 57
  md: '13. Once the function has been created, you will be taken to the next screen,
    where you can add triggers. A trigger is a source that will activate our Lambda:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_57_0.png)


    Figure 2.26: Adding the Alexa Skills Kit trigger to the Lambda (source: console.aws.amazon.com)


    In our case, the trigger is Alexa Skills Kit. Please select this from the list
    of triggers on the left.


    Please note that if you cannot find Alexa Skills Kit in the list of triggers on
    the left, make sure that you have selected the region as North Virginia "(N. Virginia)"
    in the top left of the screen. This is because of the fact that, at the time of
    writing, only the North Virginia region hosts the Alexa Skills Kit.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'With our trigger set, we will now need to configure it. Please copy the **Skill
    ID** that we saved in the previous step and add it to the skill verification section,
    as shown in the following screenshot:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_58_0.png)


    The skill ID verification ensures that our Lambda handles only those queries that
    are sent by the skill we actually want to interact with.


