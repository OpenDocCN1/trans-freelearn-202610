- pgno: 33
  md: '# # Amazon Echo – First Generation


    Amazon Echo was the original first generation flagship smart speaker from Amazon.
    It requires a wireless internet connection to work as its voice capability (Alexa)
    is based on a cloud computing service by Amazon:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_33_0.png)


    The initial setup of Amazon Echo can be done via the Alexa mobile app, available
    for both of the major mobile platforms (iOS and Android) and can also be done
    via the Alexa web portal.


    To enable it to reach users of varied economic capacities, Amazon has introduced
    Amazon Echo Dot, which is a smaller and cheaper version of Amazon Echo:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_33_1.png)'
  merge: -1
  img_proc: true
- pgno: 34
