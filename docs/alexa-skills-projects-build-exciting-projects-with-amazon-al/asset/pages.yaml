- pgno: 61
  md: "The `generateResponse` function will generate the response returned by the\
    \ Lambda function using the `buildSpeechletResponse` function. The `buildSpeechletResponse`\
    \ function will specify the output that Alexa will eventually speak, in the form\
    \ of plain text. It also takes another variable, `shouldEndSession`, which specifies\
    \ whether Alexa should end the session after the response or not.\n\n16. Once\
    \ we have the helper functions configured, we can update the `LaunchRequest` and\
    \ `IntentRequest` cases to have Alexa say relevant responses, as shown in the\
    \ following code:\n\n```\nexports.handler = (event, context, callback) => {\n\
    \    switch (event.request.type) {\n        case \"LaunchRequest\":\n        \
    \    context.succeed(generateResponse(buildSpeechletResponse(\"Welcome to Hello\
    \ World Greeter.\", false)))\n            break;\n        case \"IntentRequest\"\
    :\n            switch (event.request.intent.name) {\n                case \"GreetHelloWorld\"\
    :\n                    context.succeed(generateResponse(buildSpeechletResponse(\"\
    Hello World\", true)))\n                    break;\n            }\n          \
    \  break;\n    }\n}\n```\n\nNow, when our Lambda receives a `LaunchRequest`, it\
    \ can send a welcome message back, as shown in the preceding code. Also, if it\
    \ receives an `IntentRequest`, it can filter down on an intent's name (although\
    \ filtering is not needed currently since we have only one custom intent). Please\
    \ save your progress by clicking **Save** at the top-right corner of the screen."
