    > "Communication must be HOT. That''s Honest, Open, and Two-Way."


    – Dan Oswald


    As we progress through this book, the skills we create are evolving too. We started
    with a simple Hello World Skill and went on to create an SMS sender, a trivia
    game, a skill that talks about cryptocurrencies, and in this chapter, we will
    be working on **Ambience Manager**, which can tell us the ambience parameters,
    such as the temperature and humidity, of our homes.


    We will be designing this skill by covering the following topics:


    +   - Introduction to Home Automation and Ambient Sensors

    +   - Designing the Ambience Manager Skill

    +   - Developing the Mobile App

    +   - Developing the Ambience Manager Skill


    This chapter will be covering a lot of ground since our **Ambience Manager** Skill
    will be communicating with an ambient sensor, hence it will also involve the details
    regarding the ambient sensor as well as a mobile app, which will help us in uploading
    the temperature data to the cloud.'
