  md: "```\n```javascript\ncontext.succeed(buildResponse(speechletResponse));\n});\n\
    }\n} catch (e) {\n    context.fail(\"Exception: \" + e);\n}\n};\n```\n```\n\n\
    Now, when our `Lambda` receives a `LaunchRequest`, it will call the `onLaunch`\
    \ method to send a welcome message back, which we will implement in the next step.\n\
    \nAlso, if it receives an `IntentRequest`, it can call the `onIntent` method,\
