    5. The process will take a few minutes and, on successful completion, the following
    Connect your app to Firebase indicator in the Assistant window will turn green:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_196_1.png)


    Figure 6.11: Firebase app connection status'
