- pgno: 89
  md: 'The onIntent method is comparatively tricky—it filters out the intent based
    on its name and if the intent is the SendMessage intent, then it extracts the
    SMS text from the slot value before forwarding it to the recipient''s hard-coded
    mobile number via the SendMessage function.


    We shall define the SendMessage function in the coming steps.


    +   5. The SendMessage function is the juice of the whole skill. It is the one
    responsible for passing the message to the Twilio backend. However, before defining
    the SendMessage function, we need to declare a few constants that will be required
    while interacting with the Twilio API.


    If you remember, we noted down the SID and the Auth Token in the last step of
    the previous section; it is time now to declare them. We will be using these constants
    in the SendMessage function. Declare those variables as shown here:


    ```

    var sid = ''ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'';

    var token = ''4bXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'';

    var sender = ''+31XXXXXXXXXX'';


    var https = require(''https'');

    var queryString = require(''querystring'');

    ```


    Define these constants at the very top of the index.js file on the AWS developer
    portal. After defining them, the index.js file on the developer portal should
    resemble the one shown here:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_89_0.png)


    Figure 3.20: Coding the Lambda'
