    \nFigure 4.26: Concluding the Lambda configuration\n\nThis should bring up a code\
    \ editor at the bottom where we will add the code for the Lambda.\n\n# Coding\
    \ the Lambda function\n\nWe will be editing the code inline, in the `index.js`\
