- pgno: 188
  md: "We will need to match the name of each device found with the name of the SensorTag,\
    \ and the NAME_TAG variable will help us do exactly that. Once the correct match\
    \ is found, we initiate a connection by calling the connectGatt method and indicate\
    \ that the connection request has been made by updating the state of the connected\
    \ variable.\n\n10. The call to the connectGatt method takes three arguments. The\
    \ last argument is a callback method, which can be used for:\n\n+   - Monitoring\
    \ connection-state changes\n+   - Service discovery\n+   - Characteristic changes\n\
    \nWe will initially implement this callback in the MainActivity class for listening\
    \ to connection-state changes:\n\n```\nprotected BluetoothGattCallback gattCallback\
    \ = new\nBluetoothGattCallback() {\n    @Override\n    public void onConnectionStateChange(BluetoothGatt\
    \ gatt, int status, int newState) {\n        super.onConnectionStateChange(gatt,\
    \ status, newState);\n        if (newState == BluetoothGatt.STATE_CONNECTED) {\n\
    \            Log.i(TAG, \"onConnectionStateChange() - STATE_CONNECTED\");\n  \
    \          gatt.discoverServices();\n        }\n    }\n};\n```\n\nAs per the preceding\
    \ implementation, if the connection succeeds, then we initiate service discovery.\n\
    \n11. We are interested in two services: IR_TEMPERATURE_SERVICE and HUMIDITY_SERVICE.\
    \ We first define their UUID(s) in the MainActivity class:\n\n```\nprivate static\
    \ final String UUID_IR_TEMPERATURE_SERVICE =\n\"f000aa00-0451-4000-b000-000000000000\"\
    ;\nprivate static final String UUID_HUMIDITY_SERVICE =\n\"f000aa20-0451-4000-b000-000000000000\"\
    ;\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "Please note that although we define the UUIDs for both `TEMPERATURE_SERVICE`\
    \ and `HUMIDITY_SERVICE`, we only demonstrate reading data from `TEMPERATURE_SERVICE`\
    \ in the Android code sample. Reading data from `HUMIDITY_SERVICE` is similar\
    \ and is left for you to do as an exercise. Going forward, we will focus specifically\
    \ on the details of `TEMPERATURE_SERVICE`.\n\n`TEMPERATURE_SERVICE` on the SensorTag\
    \ consists of two important characteristics: the *data characteristic* and the\
    \ *configuration characteristic*.\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_189_0.png)\n\
    \nVisit the following link to get insights regarding characteristics exposed by\
    \ the SensorTag Temperature Service: `http://processors.wiki.ti.com/images/a/a8/BLE_SensorTag_GATT_Server.pdf`.\n\
    \nAs the name suggests, the data characteristic holds the temperature data and\
    \ supports *reading* that data and *enabling/disabling notifications* for the\
    \ temperature data. We will be interacting with both of these characteristics.\
    \ Define them in the `MainActivity` class:\n\n```\n```java\n//Characteristic UUIDs\n\
    private static final UUID UUID_CHARACTERISTIC_TEMPERATURE_DATA\n    = UUID.fromString(\"\
    f000aa01-0451-4000-b000-000000000000\");\nprivate static final UUID\nUUID_CHARACTERISTIC_TEMPERATURE_CONFIG\
    \ =\n    UUID.fromString(\"f000aa02-0451-4000-b000-000000000000\");\n```\n```\n\
    \nOur results of service discovery, which we initiated in the last step, will\
    \ be delivered in the `onServicesDiscovered` method. Override the `onServicesDiscovered`\
    \ method as a part of `BluetoothGattCallback`:\n\n```\n```java\n@Override\npublic\
    \ void onServicesDiscovered(final BluetoothGatt gatt, int status) {\n  super.onServicesDiscovered(gatt,\
    \ status);\n  gatt.readCharacteristic(gatt.getService(UUID_IR_TEMPERATURE_SERVICE).getCharacteristic(UUID_CHARACTERISTIC_TEMPERATURE_DATA));\n\
    }\n```\n```\n\nOnce the service discovery is finished, we instruct `BluetoothGatt`\
    \ to read the temperature data characteristic through the preceding code mentioned."
  merge: -1
  img_proc: true
- pgno: 190
  md: "12. As already pointed out, the temperature data characteristic supports notifications,\
    \ and we can enable these notifications for periodic data updates for temperature\
    \ data. Once we have successfully read the temperature data characteristic, we\
    \ can enable notifications for this characteristic while overriding the `onCharacteristicRead`\
    \ method in the `BluetoothGattCallback` implementation:\n\n```\n```java\n@Override\n\
    public void onCharacteristicRead(BluetoothGatt gatt,\nBluetoothGattCharacteristic\
    \ characteristic, int status) {\n    super.onCharacteristicRead(gatt, characteristic,\
    \ status);\n    if\n    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
    \ {\n        //Enable local notifications\n        gatt.setCharacteristicNotification(characteristic,\
    \ true);\n        //Enabled remote notifications\n        BluetoothGattDescriptor\
    \ desc =\n        characteristic.getDescriptor(CONFIG_DESCRIPTOR);\n        desc.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE\n\
    \        );\n        gatt.writeDescriptor(desc);\n    }\n}\n```\n```\n\nOnce **Notifications**\
    \ are enabled, whenever the temperature data is updated on the SensorTag, the\
    \ app will receive the updated value in the `onCharacteristicChanged` method.\n\
    \n13. As already pointed out in the last step, we will override the `onCharacteristicChanged`\
    \ method so that we can receive the updated temperature value in order to parse\
    \ and print it on the console:\n\n```\n```java\n@Override\npublic void onCharacteristicChanged(BluetoothGatt\
    \ gatt,\nBluetoothGattCharacteristic characteristic) {\n    super.onCharacteristicChanged(gatt,\
    \ characteristic);\n    if\n    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
    \ {\n        double ambient =\n        Utilities.extractAmbientTemperature(characteristic);\n\
    \    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 191
  md: "The temperature data is in the following format:\nObjectLSB:ObjectMSB:AmbientLSB:AmbientMSB,.\
    \ For extracting the data, we have created a separate class called Utilities.\
    \ Add a separate Utilities class to the project and introduce the following extractAmbientTemperature\
    \ method in it:\n\n```\npublic static double\nextractAmbientTemperature(BluetoothGattCharacteristic\
    \ c) {\n    int offset = 2;\n    return shortUnsignedAtOffset(c, offset) / 128.0;\n\
    }\n```\n\nThe extractAmbientTemperature method makes use of the shortSignedAtOffset\
    \ method, hence we will also add that to the Utilities class:\n\n```\n/**\n *\
    \ Gyroscope, Magnetometer, Barometer, IR temperature\n * all store 16 bit two's\
    \ complement values in the awkward\nformat\n * LSB MSB, which cannot be directly\
    \ parsed as\ngetIntValue(FORMAT_SINT16, offset)\n * because the bytes are stored\
    \ in the \"wrong\" direction.\n *\n * This function extracts these 16 bit two's\
    \ complement values.\n * */\nprivate static Integer\nshortSignedAtOffset(BluetoothGattCharacteristic\
    \ c, int offset)\n{\n    Integer lowerByte = c.getIntValue(FORMAT_UINT8, offset);\n\
    \    Integer upperByte =\n    c.getIntValue(BluetoothGattCharacteristic.FORMAT_SINT8,\
    \ offset\n    + 1); // Note: interpret MSB as signed.\n    return (upperByte <<\
    \ 8) + lowerByte;\n}\n```\n\nThe preceding code snippet has been sourced from\
    \ http://processors.wiki.ti.com/."
  merge: -1
  img_proc: true
- pgno: 192
  md: "We have enabled **Notifications** for the data characteristic and, theoretically,\
    \ we should be able to sit back and just wait for the temperature sensor to read,\
    \ update, and notify the latest temperature values to us via the `onCharacteristicChanged`\
    \ method. However, this is not the case, as we are still missing a key step before\
    \ we can get temperature updates successfully.\n\n+   14. If you were able to\
    \ go over the documentation link, which we pointed out in *Step 11*, there is\
    \ a key detail mentioned in that document:\n\n| 0x29 | 41 | 0xAA02 | IR Temperature\
    \ Config | 00 | RW | Write \"01\" to start Sensor and Measurements, \"00\" to\
    \ put to sleep |\n\nFigure 6.8: Details of the temperature-configuration characteristic\n\
    \nAs per the preceding details, please note that by default, the temperature sensor\
    \ is not enabled to record measurements. Hence, by default, our temperature sensor\
    \ is in sleep mode; we need to bring it to active mode so that we can receive\
    \ periodic notifications. We do so by overriding the `onDescriptorWrite` method\
    \ in the `BluetoothGattCallback` implementation in the `MainActivity` class:\n\
    \n```\n@Override\npublic void onDescriptorWrite(BluetoothGatt gatt,\nBluetoothGattDescriptor\
    \ descriptor, int status) {\n    super.onDescriptorWrite(gatt, descriptor, status);\n\
    \    enableConfigurationForCharacteristic(gatt,\n    descriptor.getCharacteristic());\n\
    }\n```\n\nAs per the implementation of `onDescriptorWrite`, we will also need\
    \ to implement the `enableConfigurationForCharacteristic` method in the `MainActivity`\
    \ class:\n\n```\nprivate void enableConfigurationForCharacteristic(BluetoothGatt\
    \ gatt, BluetoothGattCharacteristic characteristic) {\n    if\n    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
    \ {\n        gatt.readCharacteristic(gatt.getService(UUID_IR_TEMPERATURE_SERVICE).getCharacteristic(UUID_CHARACTERISTIC_TEMPERATURE_CONFIG));\n\
    \    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 193
  md: 'This is where the second important characteristic, the configuration characteristic,
    which we mentioned earlier, comes into play.


    15. Following up from the last step, we’ll read the configuration characteristic
    (and update it as a next step) so that we can eventually configure our temperature
    sensor to move from sleeping to active mode. For updating the configuration characteristic,
    update the preimplemented onCharacteristicRead method to the following:


    ```

    @Override

    public void onCharacteristicRead(BluetoothGatt gatt,

    BluetoothGattCharacteristic characteristic, int status) {

    super.onCharacteristicRead(gatt, characteristic, status);

    if

    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA)) {

    //Enable local notifications

    gatt.setCharacteristicNotification(characteristic, true);

    //Enabled remote notifications

    BluetoothGattDescriptor desc =

    characteristic.getDescriptor(CONFIG_DESCRIPTOR);

    desc.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);

    );

    gatt.writeDescriptor(desc);

    } else if

    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_CONFIG)) {

    characteristic.setValue(new byte[] {0x01});

    gatt.writeCharacteristic(characteristic);

    }

    }

    ```


    After the successful read, we write 0x01 to the configuration characteristic so
    that our temperature sensor is set to active mode.'
  merge: -1
  img_proc: true
- pgno: 194
  md: "16. We are done with our implementation and now the `onCharacteristicChanged`\
    \ method should be called for every temperature value update on the SensorTag.\
    \ As a final step, we can update the `onCharacteristicChanged` method to display\
    \ live temperature updates to the user. Also, we can set up and include the data\
    \ upload to the Firebase backend so that our app can keep uploading periodic data\
    \ updates to the remote server. Our final code for the UI updates and upload to\
    \ the backend is as follows:\n\n```\n```java\n@Override\npublic void onCharacteristicChanged(BluetoothGatt\
    \ gatt,\nBluetoothGattCharacteristic characteristic) {\n    super.onCharacteristicChanged(gatt,\
    \ characteristic);\n    if\n    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
    \ {\n        final double ambient =\n        Utilities.extractAmbientTemperature(characteristic);\n\
    \        //Upload to Firebase Backend\n        FirebaseDatabase database = FirebaseDatabase.getInstance();\n\
    \        DatabaseReference myRef =\n        database.getReference(\"Temperature\"\
    );\n        myRef.setValue(ambient);\n        //Update the UI\n        runOnUiThread(new\
    \ Runnable() {\n            @Override\n            public void run() {\n     \
    \           ((TextView)\n                findViewById(R.id.textView).setText(\"\
    Temperature: \" + ambient\n                + \"\\\\u00b0\" + \"C\");\n       \
    \     }\n        });\n    }\n}\n```\n```\n\nPlease note that we still need to\
    \ set up Firebase on both the client and server sides, due to which the preceding\
    \ code may fail to compile, as we are referring to Firebase but have not yet set\
    \ it up. We will set it up in the next step."
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Setting up Firebase


    We now have the data, and all that remains is to upload it to a server so that
    it can be remotely accessible to Alexa as it will need to read/access it. For
    this, we will integrate Firebase into our Android app and upload the temperature
    measurement to the Firebase Cloud. We will integrate Firebase into our mobile
    app by walking through the following steps:


    +   1. To integrate Firebase, in the Android Studio, on the top Menu bar, navigate
    to Tools | Firebase. This should bring up the Firebase Assistant window:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_195_0.png)


    Figure 6.9: Firebase Assistant


    +   2. Under the Firebase Assistant window, navigate to Realtime Database | Save
    and retrieve data. This should bring up the Save and retrieve data window.


    +   3. Click on Connect your app to Firebase. The Firebase connection should ask
    you to choose an existing project or create a new one.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '4. Choose to create a new one, provide it with a relevant name, and click on
    Connect to Firebase:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_196_0.png)


