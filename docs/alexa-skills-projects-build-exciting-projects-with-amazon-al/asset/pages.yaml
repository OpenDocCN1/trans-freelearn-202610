  md: '# # Motivation for Designing Factly


    Before we dive deep into the details of the Factly Alexa Skill, let''s try to
    understand the reason for our choice of creating this Skill by understanding what
    people use voice assistants for.


    In a study done by Statista on smartphone users in the UK, it was revealed that
    people who use voice assistants use them mainly for **Amusement**, which is second
    only to **Search for general information**, as shown in the following diagram:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_95_0.png)


    Figure 4.1: Most common uses of voice assistants


    With this insight, it is no surprise also that the lion’s share of Alexa Skills
    on the Amazon Alexa App Store belongs to games and trivia apps:'
  merge: -1
  img_proc: true
- pgno: 96
  md: '![](img/80ddccf2572659c5b147f23cc6356c5a_96_0.png)


