    # Summary


    We do hope that you enjoyed creating the Factly Skill. As with the previous skills,
    the Factly Skill still has room for a lot of improvement. For example, currently
    it only hosts three questions, which can be extended to 30 or even 300 questions,
    and that alone will convert this skill to a serious quiz game.


    Also, we are only handling two intents. We can extend the skill to handle even
