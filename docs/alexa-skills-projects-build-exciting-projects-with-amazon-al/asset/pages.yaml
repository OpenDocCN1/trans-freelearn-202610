- pgno: 67
  md: "# 3\nHands-Free Experience with Alexa\n\n> \"The tongue can paint what the\
    \ eyes can't see.\"\n> \n> – Chinese Proverb\n\nWe moved on from learning about\
    \ the details of Echo and Alexa to designing a basic Alexa Skill. We also gained\
    \ some familiarity with the anatomy of a basic Alexa Skill and how the various\
    \ moving parts in a skill interact with each other.\n\nIn this chapter, we take\
    \ our design skills a little further and create a slightly more advanced skill.\
    \ Our skill is called Handsfree Messenger and it will allow the user to leverage\
    \ Alexa to send SMSes in a hands-free manner, just using Alexa and Echo, without\
    \ any interaction with his/her phone. We will use a custom service called Twilio,\
    \ which allows a user/developer to make/receive phone calls programmatically and\
    \ send/receive text messages using web service APIs, in addition to AWS, where\
    \ we will be hosting our Lambda.\n\nWe do this by covering the following topics\
    \ in this chapter:\n\n+   - Overview of the Handsfree Messenger Skill\n+   - Configuring\
    \ the Twilio Messaging Backend\n+   - Configuring the Handsfree Messenger Skill\n\
    \nWithout further ado, let's begin with an overview of the design of the skill."
  merge: -1
  img_proc: true
- pgno: 68
  md: '# # Overview of the Handsfree Messenger Skill


    Before we go ahead and design the Handsfree Messenger skill, we will need to understand
    a few things:


    +   - What is the system''s core functionality?

    +   - What are all of its moving parts?

    +   - How do these parts interact?


    The Handsfree Messenger skill will work as follows:


    +   1. The user will start the Alexa Skill by saying a start phrase—"Alexa, Start
    Handsfree Messenger."

    +   2. Alexa will launch the skill.

    +   3. The user will voice the actual message that needs to be sent: "Send message
    – Get milk!"

    +   4. Now, this is where it gets interesting. When the user voices the actual
    message in the previous step, a `SendMessage` intent will be created and the actual
    message text will be passed as an argument to that intent.


    ![](img/80ddccf2572659c5b147f23cc6356c5a_68_0.png)


    > We have already discussed intents in the previous chapter and so we are assuming
    that the reader is already familiar with intents and their functionality.


    +   5. The intent is processed by the Lambda, where the Lambda extracts the message
    from the intent and passes it to the Twilio backend, together with information
    about the intended recipient of the message.


    ![](img/80ddccf2572659c5b147f23cc6356c5a_68_1.png)


    > We will not go into many details about the communication between the Lambda
    and the Twilio backend since it will be covered in the upcoming sections.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '+   6. The Twilio backend passes the received message to its intended recipient
    and passes a confirmation response to the Lambda.

    +   7. The Lambda receives the confirmation and informs the sender by voicing
    the phrase `Message sent.`


    As you would have already gathered from the description of the system''s functionality,
    these are the major moving parts of our Handsfree Messenger skill:


    +   - The actual Alexa Skill: Handsfree Messenger

    +   - The skill''s Lambda residing on the AWS backend

    +   - The Twilio backend


    If you were to compare this skill to the one that we created in the previous chapter,
    then this skill would be a slightly more complex one, just due to the fact that
    it has more moving parts.


    The VUI flow of the Handsfree Messenger is as follows:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_69_0.png)'
  merge: -1
  img_proc: true
