- pgno: 178
  md: 'With our data flow in place, we now take the next step: creating an Android
    app that will read data from the ambient sensor via BLE and then push that data
    to the Firebase backend.


    # Developing the Mobile App


    We will be creating an Android app that will communicate with the ambient sensor
    over BLE.


    If you do not know much about developing Android apps and BLE, don''t worry, you
    can simply download the source code from the link provided toward the end of this
    section. Alternatively, you can check out the Android Developer website regarding
    the development of Android apps.


    If you are interested in exploring Android, navigate to https://developer.android.com/
    to find more information on Android app development.


    The following are the prerequisites for this section:


    +   - **Android:**

    +     - Latest Android Studio

    +     - An up-to-date Android device (preferably a Samsung Galaxy S8, since it
    has support for Bluetooth 5, otherwise any device with an API Level of 23 (Android
    M) is fine)

    +     - Basic familiarity with Java, Android, Android Studio, and BLE

    +   - **Hardware:**

    +     - Texas Instruments CC2650 STK SensorTag


    We''ll begin by creating an empty project. Please choose a name for it.


    For the purpose of consistency, and since this project has already been covered
    in another book of mine (titled *IoT Projects with Bluetooth Low Energy* published
    by Packt Publishing), I will call it `AndroidWarehouseMonitor`.


    Since we are about to implement a lot of code for our Android app, for your convenience,
    we have broken down the functionality of the Android app in the following flowchart:'
