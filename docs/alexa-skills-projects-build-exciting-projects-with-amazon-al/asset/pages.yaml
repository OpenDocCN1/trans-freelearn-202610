    \ } \n    });\n}\n```\n\nThe startScanning method makes use of quite a few variables,\
    \ so declare those in the MainActivity class:\n\n```\nBluetoothManager bluetoothManager;\n\
    BluetoothAdapter bluetoothAdapter;\nBluetoothLeScanner bluetoothLeScanner;\n```\n\
    \nWe now need to call the startScanning method from two places, first, immediately\
    \ after the user grants the location permission. For this, add the method call\
    \ to the startScanning method to the onRequestPermissionResult method (which we\
    \ implemented in Step 3) as shown next:\n\n```\nif (grantResults.length > 0 &&\
    \ grantResults[0] ==\nPackageManager.PERMISSION_GRANTED) {\n    Log.i(TAG, \"\
    Permission Granted\");\n    startScanning();\n}\n```\n\nSecond, if you have already\
    \ granted all the permissions during the initial run of the app, we also add the\
    \ method call for the startScanning method to the ensureLocationPermissionIsEnabled\
    \ method (which we implemented in Step 2):\n\n```\nprivate void ensureLocationPermissionIsEnabled()\
    \ {\n    if (Build.VERSION.SDK_INT >= 23 &&\n```"
