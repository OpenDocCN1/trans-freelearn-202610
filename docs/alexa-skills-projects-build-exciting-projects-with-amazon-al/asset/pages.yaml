- pgno: 214
  md: "The buildResponse function will generate the plain-spoken response to be spoken\
    \ by Alexa.\n\nThe buildSpeechletResponse function will specify the output that\
    \ Alexa will eventually speak, in the form of plain text. It also takes another\
    \ variable, shouldEndSession, which specifies whether Alexa should end the session\
    \ after the response.\n\nDefine the fbGet function, which will take a key parameter\
    \ and fetch the data from a provided host via a REST call:\n\n```\nfunction fbGet(key){\n\
    \    return new Promise((resolve, reject) => {\n        var options = {\n    \
    \        hostname: firebaseHost,\n            port: 443,\n            path: key\
    \ + \".json\",\n            method: 'GET'\n        };\n        var req = https.request(options,\
    \ function (res) {\n            res.setEncoding('utf8');\n            var body\
    \ = '';\n            res.on('data', function(chunk) {\n                body +=\
    \ chunk;\n            });\n            res.on('end', function() {\n          \
    \      resolve(JSON.parse(body))\n            });\n        });\n        req.end();\n\
    \        req.on('error', reject);\n    });\n}\n```\n\nThe preceding function will\
    \ take the parameter for the key that holds the temperature data (in our case,\
    \ that key is Temperature) and fetches the data from the Firebase Host. The data\
    \ is received in JSON format and hence needs to be parsed.\n\n+   3. Once we have\
    \ added this method, we will need to call it from exports.handler. Update exports.handler\
    \ with the call to fbGet, as shown in the following code:\n\n```\nexports.handler\
    \ = (event, context, callback) => {\n    try {\n        if (event.request.type\
    \ === \"IntentRequest\") {\n```"
