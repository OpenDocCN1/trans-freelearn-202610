    \ {\n        fbGet(\"/Temperature\").then(res => {\n            context.succeed(buildResponse(buildSpeechletResponse(\"\
    The temperature is . . \" + res + \" . degrees\", true)));\n        })\n    }\
    \ else {\n        throw \"Invalid intent\";\n    }\n}\ncatch(e) {\n    context.fail(\"\
    Exception: \" + e);\n}\n```\n\nUpon a successful fetch, we create a speech response\
