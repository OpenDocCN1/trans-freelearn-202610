- pgno: 85
  md: '# 第五章 树和二叉树


    # 5.1 树的逻辑结构


    树是n（n≥0）个结点的有限集合，在任意一棵非空树中：


    +   1. 有且仅有一个特定的称为根的结点；


    +   2. 当n>1时，其余结点可分为m（m>0）个互不相交的有限集合，其中每一个集合本身又是一棵树，并且称为根结点的子树。


    树的逻辑结构具有以下特点：


    +   （1）树的根结点没有前驱结点，除根结点之外的所有结点有且只有一个前驱结点。


    +   （2）树中所有结点可以有零个或多个后继结点。


    ![](img/80ddccf2572659c5b147f23cc6356c5a_85_0.png)


    图5-1 树结构示意图'
  merge: -1
  img_proc: true
