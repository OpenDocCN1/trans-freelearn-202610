    \n```\n```javascript\nbuildSpeechletResponse = (outputText, shouldEndSession)\
    \ => {\n    return {\n        outputSpeech: {\n            type: \"PlainText\"\
    ,\n            text: outputText\n        },\n        shouldEndSession: shouldEndSession\n\
    \    }\n}\n\ngenerateResponse = (speechletResponse) => {\n    return {\n     \
