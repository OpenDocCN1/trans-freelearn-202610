- pgno: 187
  md: "```\nContextCompat.checkSelfPermission(this,\n    android.Manifest.permission.ACCESS_COARSE_LOCATION)\n\
    != PackageManager.PERMISSION_GRANTED) {\n    ActivityCompat.requestPermissions(this,\
    \ new String[]{\nandroid.Manifest.permission.ACCESS_COARSE_LOCATION},\nREQUEST_LOCATION);\n\
    \    return;\n}\nstartScanning();\n}\n```\n\nWe have implemented our device scan\
    \ code. Now, we need to define a callback that handles the devices found.\n\n\
    9. If you were able to accomplish the previous step successfully, your implementation\
    \ of the startScanning method will make use of ScanCallback, where the results\
    \ of the scan get delivered. Please define ScanCallback in the MainActivity class:\n\
    \n```\n// Device scan callback.\nprivate ScanCallback leScanCallback = new ScanCallback()\
    \ {\n    @Override\n    public void onScanResult(int callbackType, ScanResult\n\
    result) {\n    if (result.getDevice() != null) {\n        if (result.getDevice().getName()\
    \ != null &&\nresult.getDevice().getName().contains(NAME_TAG)) {\n           \
    \ Log.i(TAG, result.getDevice().getName());\n            if (connected == false)\
    \ {\n                connected = true;\n                bluetoothLeScanner.stopScan(leScanCallback);\n\
    \                result.getDevice().connectGatt(MainActivity.this, true,\n   \
    \             gattCallback);\n            }\n        }\n    }\n};\n```\n\nExamine\
    \ the preceding piece of code closely, which is filtering available devices on\
    \ the basis of names of the devices found. The previously mentioned piece of code\
    \ uses a few variables, which need to be declared in the MainActivity class:\n\
    \n```\nprivate static String NAME_TAG = \"SensorTag\";\nprivate boolean connected\
    \ = false;\n```"
