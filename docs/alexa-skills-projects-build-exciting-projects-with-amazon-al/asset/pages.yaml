  md: "We will be editing the code inline on the Developer portal itself. We will\
    \ start by segregating each of the requests that our skill receives:\n\n```\n\
    ```javascript\nexports.handler = (event, context, callback) => {\n    switch (event.request.type)\
    \ {\n        case \"LaunchRequest\":\n            break;\n        case \"IntentRequest\"\
    :\n            break;\n    }\n}\n```\n```\n\nAs shown in the preceding code, this\
    \ is how we segregate the launch and intent event requests.\n\n+   15. Next, we\
