    # Testing the Skill


    Our setup is almost complete and we are ready to test our Handsfree Messenger
    skill. The skill can be tested via the actual Amazon Echo device or via the Alexa
    Simulator.


    Since we have already used the Alexa Simulator in Chapter 2, Hello World, Alexa!,
    this time you can test the skill using an actual Amazon Echo, provided you have
    one and the Echo is connected and set up. Then, if you say "Alexa, launch Handsfree
    Messenger," it should reply with "Welcome to Handsfree Messenger." If you then
    say, "Send message – Pick up groceries," it should reply "Message sent" and an
    SMS with the text "Pick up groceries" should be delivered to the recipient.


    Please note that each free Twilio account comes with a small balance and, hence,
    sending a few messages (10-20) will not incur any cost to you.


    Our skill is now tested and ready to be played around with. You can find the code
    for the Lambda from this chapter at the link mentioned in the information box.


    Please find the code for the Lambda at the following URL https://github.com/madhurbhargava/AlexaSkillsProjects/blob/master/Chapter3_HandsFreeMessenger_index.js.


    With this, we have reached the end of this chapter.'
