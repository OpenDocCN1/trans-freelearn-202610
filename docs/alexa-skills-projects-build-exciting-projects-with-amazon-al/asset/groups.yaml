  mdcn: '

    在语音革命的众多里程碑中，几乎每位读者都至少熟悉其中几个最新的里程碑，即 Siri、Google Now、Cortana 和亚马逊的 Alexa。其中最流行的是苹果的
    Siri 和谷歌的 Google Now，它们最初分别与 iOS 和 Android 移动设备集成出现。


    苹果的 Siri 最初是作为 App Store 上的一个应用出现的，但后来被苹果收购，并与 iOS 设备更加紧密地集成。Siri 使用自然语言界面来聆听用户的命令并执行必要的操作。此外，随着
    macOS Sierra 的到来，它的能力不再局限于 iOS 设备：


    ![](img/80ddccf2572659c5b147f23cc6356c5a_17_0.png)


    图 1.3：Siri 的功能不仅限于 iPhone，还扩展到桌面


    谷歌紧随苹果之后，在 2011 年 Siri 推出后不久，于 2012 年推出了 Google Now。与 Siri 不同，Google Now 在 Android
    上原生可用，同时也作为 iOS 设备的独立应用。Google Now 与 Gmail、Google 日历和强大的 Google 搜索本身等 Android/Google
    功能无缝集成：


    ![](img/80ddccf2572659c5b147f23cc6356c5a_18_0.png)


    图 1.4：Google Now 作为原生应用的一部分在 iOS 上可用（Google 和 Google 徽标是 Google Inc. 的注册商标，经许可使用。）


    紧随谷歌之后的是微软，它推出了自己的智能语音助手 Cortana，并于 2014 年面向桌面和移动设备推出：


    ![](img/80ddccf2572659c5b147f23cc6356c5a_18_1.png)


    图 1.5：微软的 Cortana 最初是为微软的移动和桌面计算系统推出的


    随着时间的推移，很明显，基于语音的个人助理已经站稳脚跟，并且需要专属的硬件和空间。亚马逊在这方面率先采取了行动，推出了其品牌 Amazon Echo，这是一个智能音箱设备系列，由亚马逊公司专门设计和开发，使用户能够使用名为
    *Alexa* 的交互式语音个人助理服务（这也是本章标题的由来）：


    ![](img/80ddccf2572659c5b147f23cc6356c5a_19_0.png)


    图 1.6：Amazon Echo 设备系列


    完整的 Echo 系列及其功能如下表所示：


    | 设备 | 用途 |

    |---|---|

    | Amazon Echo | 最初的旗舰智能音箱。 |

    | Echo Dot | Echo 的更小、更便宜版本，没有放大扬声器，因此音质也不如 Echo。 |

    | Echo Plus | 最新版 Echo，集成了 Zigbee。 |

    | Echo Show | 支持 Alexa 的设备，配备大触摸屏，用户与 Alexa 的交互不仅是听觉的，还有视觉的。 |

    | Echo Spot | *Show + Dot = Spot*。具备 Show 和 Dot 设备的全部基本功能，外形尺寸小得多。 |

    | Amazon Tap | 支持 Alexa 的蓝牙音箱。 |


    Echo 系列标志着亚马逊第二次进军硬件领域，第一次是推出广受欢迎的电子书阅读器 Kindle。谷歌也认识到，交互式语音助手可以通过充分利用智能家居概念做更多事情，因此在亚马逊之后紧跟其后，推出了
    Google Home 智能音箱，其中内置了与 Alexa 对应的 Google Assistant：


    ![](img/80ddccf2572659c5b147f23cc6356c5a_20_0.png)


    图 1.7：各种基于语音的个人助理的发布时间线（来源：www.citiusminds.com）


    请注意，上图不包括 2012 年推出的 Google Now。


    我们已经讨论了基于语音的交互式个人助理的演变，以及它们如何从用户智能手机上的另一个应用发展成为用户智能家居的一部分。


    在下一节中，我们将讨论基于语音的交互式个人助理的一些常见用途。


    ## 基于语音的个人助理的应用


    我们在上一节讨论了基于语音的个人助理的演变。在本节中，我们将把讨论扩展到每个交互式语音个人助理的一些常见用途，无论该助理是基于桌面、智能手机还是智能家居。我们将从最早且最著名的助手之一——苹果的
    Siri 开始。


    ### Siri


    如前所述，Siri 最初是 2011 年为 iOS 推出的一款独立智能手机应用，后来被苹果收购。最初，Siri 的能力仅限于智能手机和简单功能，例如：


    - 查找联系人

    - 消息（短信）

    - 按用户需求获取天气更新，以及上一节提到的其他简单查询


    然而，苹果的路线图还通过将 Siri 与第三方应用紧密集成来扩展其功能，并且正如承诺的那样，随着 iOS 10 的到来，苹果还发布了 SiriKit。


    ![](img/80ddccf2572659c5b147f23cc6356c5a_21_0.png)


    想了解更多关于 SiriKit 的信息，请访问 https://developer.apple.com/sirikit/。


    如果用户安装了以下第三方应用，可以使用 Siri 叫车：


    - Uber

    - Lyft


    如果用户安装了以下第三方应用，可以使用 Siri 设置这些应用发送消息（不仅仅是短信）：


    - WhatsApp

    - LinkedIn

    - WeChat

    - Slack


    用户还可以通过 Siri 使用以下应用拨打 VoIP 电话：


    - Skype

    - Viber


    ![](img/80ddccf2572659c5b147f23cc6356c5a_22_0.png)


    请注意，以上列表并非详尽无遗。然而，第三方集成并不是苹果扩展 Siri 功能路线图中的唯一内容。macOS Sierra 的发布也将 Siri 的功能带到了桌面。要了解有关
    Siri 桌面功能的更多信息，请访问 https://support.apple.com/en-us/HT206993。


    Siri 还可以帮助用户：


    - 在 Mac 上搜索文件

    - 通知用户其存储空间

    - 通过“通讯录”发起 FaceTime 请求，以及此处所示的许多其他功能：


    ![](img/80ddccf2572659c5b147f23cc6356c5a_23_0.png)


    图 1.8：Siri 可以帮忙处理的事项列表（非详尽）（来源：www.osxdaily.com）


    在了解了 Siri 的桌面和智能手机功能后，现在让我们继续介绍另一款流行的语音助手。


    ### Google Now


    接下来我们将讨论 Android 和 Google Now。在撰写本文时，Android 是智能手机市场上最大的参与者，也是 Google Now 的故乡——Google
    Now 是谷歌于 2012 年为 Android 智能手机推出的语音助手。


    2010 年初，智能手机市场由许多参与者主导。多年后，市场逐渐筛选，如今只剩下两个主要参与者，如下图所示：


    ![](img/80ddccf2572659c5b147f23cc6356c5a_24_0.png)


    图 1.9：2010 年至 2016 年智能手机市场份额分布对比（数据来源：Gartner）


    Google Now 几乎可以完成 Siri 所能完成的一切；然而，它与网络和基于网络的查询有更好的集成，因为网络是谷歌的强项。用户可以问 Google Now
    的一些事情包括：


    | 类别 | 命令 |

    |---|---|

    | 一般命令 | • “什么是[薛定谔的猫]？”<br>• “谁发明了[互联网]？”<br>• “发布到 Google+ [感觉很好]” |

    | 笔记和提醒 | • “设置[晚上8点]的闹钟”<br>• “自我提醒：[我把车停在D区]” |

    | 时间和日期 | • “[柏林]的时区是什么？”<br>• “家里的时间”<br>• “创建日历事件：[在餐厅用餐] [周六晚上8点]” |

    | 通信 | • “打电话给[Daniel]”<br>• “[联系人姓名]”<br>• “给 Daniel 发[电子邮件]，[主题：会议]，[消息：5分钟内到]”
    |

    | 天气 | • “天气”<br>• “[明天/周五]会下雨吗？”<br>• “[波士顿] [周三]的天气怎么样？” |

    | 地图和导航 | • “[弗拉格斯塔夫]的地图”<br>• “开车导航到[柏林]”<br>• “在地图上显示附近的[餐厅]” |


    图 1.10：Google Now 可以做的部分事情（数据来源：www.cnet.com）


    除了 Google Now，谷歌还推出了 Google Assistant，它是 Google Now 的更进化版本，因为用户可以与 Google Assistant
    进行完整对话，而 Google Now 则无法做到这一点。

