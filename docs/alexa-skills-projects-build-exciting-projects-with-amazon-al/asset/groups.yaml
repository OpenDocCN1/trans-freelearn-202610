    \ Alexa 创建面向家庭自动化、物联网和各种其他领域的技能的人。\n\n## What this book covers\n\n第 1 章，What Is\
    \ Alexa?，是一章入门章节，不需要任何编程技能。我们讨论智能语音激活个人助理如何从仅仅被动存在于手机中发展成为以专用硬件设备的形式永久存在于普通家庭中的固定装置。\n\
    \n第 2 章，Hello World, Alexa!，将向读者介绍为 Alexa 创建技能的过程，并将解释如何创建基本的 Hello World Alexa\
    \ 技能。\n\n第 3 章，Hands-Free Experience with Alexa，将介绍一种使用 Alexa 发送消息的新方式，即免提方式。\n\
    \n第 4 章，*Let’s Play Factly with Alexa*，将创建一个名为 Factly 的 Alexa 技能游戏。我们还将使用 DynamoDB\
    \ 为其添加持久性。\n\n第 5 章，*Making Alexa Talk about CryptoCurrencies*，将演示 Alexa 如何提供最新的加密货币更新。用户将创建一个\
    \ Alexa 技能，该技能可以获取最新加密货币（如比特币和以太坊）的当前价格。\n\n第 6 章，*Home Automation with Alexa*，将演示\
    \ Alexa 如何与其他物联网设备集成并创建智能家居的基础。用户将创建一个 Weather Monitor Alexa 技能，该技能可以告知用户家庭内的气候（温度/湿度/光照）。\n\
    \n第 7 章，*Future of Voice-Based Personal Assistants*，将讨论智能语音个人助理的未来。\n\n## To get\
    \ the most out of this book\n\n要充分利用本书，以下是先决条件：\n\n- 熟悉现代编程语言，例如 JavaScript。我们为\
    \ Lambdas 编写的全部代码都基于 Node.js。\n- 免费套餐 Amazon AWS 开发人员账户。\n- 熟悉代码编辑器。\n- 不是强制性的，但建议使用亚马逊\
    \ Alexa 启用的设备，例如亚马逊 Echo。\n- 在本书的整个过程中，我们将通过亚马逊开发者门户进行许多配置更改。我们建议您按照所述步骤进行操作，因此强烈建议您拥有良好的互联网连接。\n\
    \n## Download the example code files\n\n您可以从 www.packtpub.com 的账户下载本书的示例代码文件。如果您在其他地方购买了本书，您可以访问\
    \ www.packtpub.com/support 并注册以直接通过电子邮件接收文件。\n\n"
