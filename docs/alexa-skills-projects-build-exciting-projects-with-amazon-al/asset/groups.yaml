    \ This should bring up a code editor at the bottom where we will add the code\
    \ for the Lambda.\n\n# Coding the Lambda function\n\nFollowing the Lambda setup,\
    \ it's time to code the actual Lambda function. We will be editing the code inline,\
    \ in the `index.js` file on the Developer Portal itself, following these steps:\n\
    \n- 1. Implement the handling of events in `exports.handler`. Our Lambda, in this\
    \ case, will be handling only a single intent, that is, `OneShotFetchTemperatureIntent`.\
    \ Since we are implementing a One-Shot Launch, this single intent will launch\
    \ our skill and fetch the temperature data.\n\nBefore we move on to write the\
    \ functional logic, declare the following variables, which will be used by our\
    \ functional logic:\n\n```\nvar https = require('https');\nvar firebaseHost =\
    \ \"androidwarehousemonitor.firebaseio.com\";\n```\n\n`firebaseHost` is the same\
    \ URL (it may be different in your case, depending on how you set up Firebase\
    \ for the Android app) that we copied earlier when we were setting up Firebase.\
    \ Since we will be connecting to Firebase via a REST call, we will need its `firebaseHost`\
    \ URL and `https`.\n\nThen, update the code of `exports.handler`, as shown here:\n\
    \n```\nexports.handler = (event, context, callback) => {\n    try {\n        if\
    \ (event.request.type === \"IntentRequest\") {\n            if (\"OneShotFetchTemperatureIntent\"\
    \ ===\n            event.request.intent.name) {\n            } else {\n      \
    \          throw \"Invalid intent\";\n            }\n        }\n    }\n```\n\n\
    ```\n}\ncatch(e) {\n    context.fail(\"Exception: \" + e);\n}\n};\n```\n\nAs shown\
    \ and discussed previously, we have discarded all the other intents (even the\
    \ Launch Intent, which we have handled religiously so far) and handled just OneShotFetchTemperatureIntent\
    \ to facilitate the One-Shot Launch of our skill.\n\n- 2. We will define some\
    \ helper functions that will help us create speech responses, shown as follows:\n\
    \n```\n// ------ Helper functions ------\n\nfunction buildSpeechletResponse(output,\
    \ repromptText, shouldEndSession) {\n    return {\n        outputSpeech: {\n \
    \           type: \"PlainText\",\n            text: output\n        },\n     \
    \   reprompt: {\n            outputSpeech: {\n                type: \"PlainText\"\
    ,\n                text: repromptText\n            }\n        },\n        shouldEndSession:\
    \ shouldEndSession\n    };\n}\n\nfunction buildResponse(sessionAttributes, speechletResponse)\
    \ {\n    return {\n        version: \"1.0\",\n        sessionAttributes: sessionAttributes,\n\
    \        response: speechletResponse\n    };\n}\n```\n\nThese functions help the\
    \ Lambda to return the response to be spoken by Alexa whenever it receives a specific\
    \ intent/input.\n"
