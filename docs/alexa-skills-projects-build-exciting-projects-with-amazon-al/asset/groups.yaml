    ![](img/80ddccf2572659c5b147f23cc6356c5a_233_0.png)


    它是一款苹果出品的智能音箱，Siri 对应着 Google Assistant 和 Alexa。它的售价为 349 美元（撰写本文时），在价格上仅次于 Google
    Home Max（售价 399 美元）。


    HomePod 的设计使其具备 360 度音效，清晰度和音质都非常出色。然而，它与苹果的生态系统紧密耦合。例如，Amazon Echo 和 Google Home
    可以轻松集成第三方服务（如 Spotify），而这在 Apple HomePod 上则有点困难。


    我们希望你现在已经清楚了解每个智能音箱能提供什么，以及它们之间如何比较。有了这些信息，我们将进入最后一节，讨论智能音箱的未来。


    ## 语音助手的未来


    在 2016 年智能音箱市场起步阶段，智能音箱总销量不到 1000 万台。然而，到 2017 年下半年初，仅 Amazon Echo 就已售出超过 2000
    万台设备（来源：voicebot.ai），并且预计（来源：voicebot.ai）在 2018 年将售出超过 5600 万台智能音箱设备：


    ![](img/80ddccf2572659c5b147f23cc6356c5a_234_0.png)


    图 7.7：智能音箱市场的增长


    ## 总结


    至此，我们到了本章的结尾，也到了本书的结尾。


    我们希望你真的享受了我们共度的时光，并且现在对自己作为 Alexa 技能绝地武士的能力有了坚实的信心。


    此外，我们希望你对 Alexa 技能商店中有哪些类别和技能、为什么有些技能比其他技能更出色，以及设计下一个技能时可以关注哪些小众类别有了清晰的想法。


    掌握了所有这些信息后，我们迫不及待想看到你发布下一个技能。如果你做出了酷炫的东西，给我们留言吧。


