    ## Hello Alexa – Building a Hello World Alexa Skill


    This section addresses the final goal of this chapter, that is, actually writing
    our first Alexa Skill. However, please note that we do have a few prerequisites
    before we embark on the final leg of our journey through this chapter. For the
    success of this exercise, each user will need to have an Amazon Developer account.
    Signing up for an Amazon Developer account is a simple and straightforward process.
    The user can sign up for an account at https://developer.amazon.com.


    Signing up is a three-step process and includes providing personal information,
    accepting terms of service, and providing a payment method.


    Please note that although signing up requires you to provide Amazon with a payment
    method, Amazon will charge you if, and only if, you end up using any of the paid
    services. However, over the course of this book, we will be restricting our usage
    to free tier and will not be using any of the paid services.


    Signing up for an Amazon Developer account not only gives you access to the Alexa
    Skills Kit but also to a plethora of other different services by Amazon, such
    as AWS and many others. Once you are successfully logged in, you can see all the
    services that are available to you via the dashboard:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_42_0.png)


    Figure 2.11: Amazon Developer account dashboard (source: developer.amazon.com)


    With our signing-up process complete, we can now embark on our journey to create
    our first Alexa Skill:


    - 1. Please click on the Developer Console option button, located in the top-right
    corner of the screen of the available services dashboard, as shown previously.

    - 2. Once you have navigated to the Developer Console, please select the option
    Alexa Skills Kit from the list of options mentioned in the top bar, as shown in
    the following screenshot:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_43_0.png)


    Figure 2.12: Alexa Skills Kit dashboard (source: developer.amazon.com)


    ![](img/80ddccf2572659c5b147f23cc6356c5a_45_0.png)


    In our case, we will be using the name `Hello World Greeter`. This is the name
    that the users see when they are browsing for various Alexa Skills in the Skills
    store.


    Please move on to the next screen, which is the model selection screen, by using
    the Next button:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_45_1.png)


    Please select the **Custom** model for the skill and click on the **Create skill**
    button in the top-right corner of the screen:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_46_0.png)


    This should land us on the skills dashboard shown in the preceding screenshot.
    As shown previously, the skills dashboard will help us to configure our skill
    by completing the four steps shown in the **Skill builder checklist**.


    6. Please click on the Invocation Name section under the Skill builder checklist
    to land on the following screen:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_48_0.png)


    Figure 2.17: Setting up an invocation name (source: developer.amazon.com)


    Please add the invocation name as hello world greeter, as shown previously, and
    click on the Save Model button to save the changes. After doing so, please click
    on the Build button to land on the Skill builder checklist again:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_49_0.png)


    Figure 2.18: Completion of the first step (source: developer.amazon.com)


    The first step should be completed now and marked as green. Now we will set up
    an intent for our skill.


    7. Please click on the **Intents, Samples and Slots** button under the **Skill
    builder checklist**:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_50_0.png)


    Figure 2.19: Creating the GreetHelloWorld intent (source: developer.amazon.com)


    Please add the intent name as `GreetHelloWorld` and click on the **Create custom
    intent** button.


    Although this is not immediately obvious, intents are defined in the JSON format
    as a part of the interaction model.


    > To find out more about the JSON format, please visit `https://www.json.org/`.


    8. Next, we define the **Sample Utterances** for the `GreetHelloWorld` intent,
    as shown in the following screenshot:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_52_0.png)


    Figure 2.20: Sample utterances for the GreetHelloWorld intent (source: developer.amazon.com)


    Please note that we are not defining any slots since this skill does not need
    any. We will look at the usage of slots in upcoming chapters.


    Please click the **Save Model** button at the bottom of the screen to save these
    changes. Finally, please click on the **Build** tab to land on the **Skill builder
    checklist** again. On the **Skill builder checklist**, please click on the **Build
    Model** button:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_53_0.png)


    Figure 2.21: Building the interaction model (source: developer.amazon.com)


    It will take a few seconds before the changes are saved and the actual interaction
    model is built/created. We will not move to the next step yet but configure our
    Lambda first. The reason for this will become evident in the coming steps.


    9. Once the interaction model is created, we will leave the **Skill builder checklist**
    screen as is and will focus on creating the Lambda. However, before that, please
    click on the **Endpoint** button on the **Skill builder checklist** screen:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_54_0.png)


    Figure 2.22: Copying the AWS Lambda ARN (source: developer.amazon.com)


    Please select the AWS Lambda ARN and copy the skill ID and save it somewhere.
    We will need this skill ID in the coming steps.


    10. Now, please open a new browser tab and navigate to the AWS console.


    The AWS console can be found at `https://console.aws.amazon.com`. Please note
    that you will need to create a new account if you don''t already have one.


    Once you have navigated and successfully logged into the AWS console, you should
    see something similar to the following screenshot:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_55_0.png)


    Figure 2.23: Searching for Lambda on the AWS services console (source: console.aws.amazon.com)


    On the console search bar, please search for `Lambda`, and click on it when it
    appears in the list of auto-suggestions.


    - 11. Select **Create a function** on the next screen:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_55_1.png)


    Figure 2.24: AWS Lambda dashboard (source: console.aws.amazon.com)


    12. On the next screen, you can either choose to author a Lambda from scratch
    or choose from one of the existing templates. We will choose to **Author from
    scratch** as this is our first skill and rather a simple one. Also, authoring
    from scratch gives us slightly greater insight into the code of the skill:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_56_0.png)


    Figure 2.25: Authoring a Lambda function from scratch (source: console.aws.amazon.com)


    As shown in the preceding screenshot, our Lambda function will be called `greeterHelloWorldSkill`,
    will use a `Node.js (8.10)` runtime, and will have an existing role of **lambda_basic_execution**.
    Please click **Create function** at the bottom of the screen after populating
    the necessary details.


    13. Once the function has been created, you will be taken to the next screen,
    where you can add triggers. A trigger is a source that will activate our Lambda:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_57_0.png)


    Figure 2.26: Adding the Alexa Skills Kit trigger to the Lambda (source: console.aws.amazon.com)


    In our case, the trigger is Alexa Skills Kit. Please select this from the list
    of triggers on the left.


    Please note that if you cannot find Alexa Skills Kit in the list of triggers on
    the left, make sure that you have selected the region as North Virginia "(N. Virginia)"
