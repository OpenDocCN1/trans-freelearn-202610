    ![](img/80ddccf2572659c5b147f23cc6356c5a_36_0.png)


    Hopefully, by now, you should have a clear understanding of what Amazon Echo actually
    is and of the clear distinction between Amazon Echo and Alexa. In the next section,
    we will look under the hood of Amazon Echo and dissect an Alexa Skill.


