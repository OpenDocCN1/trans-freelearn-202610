    desc.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);

    );

    gatt.writeDescriptor(desc);

    } else if

    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_CONFIG)) {

