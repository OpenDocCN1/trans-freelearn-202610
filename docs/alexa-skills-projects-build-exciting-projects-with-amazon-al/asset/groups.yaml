  md: "\nWith the current count of **Games/Trivia**-oriented skills in the Alexa Skills\
    \ store being around 6,000, there is a lot more room to accommodate other **Games/Trivia**\
    \ skills, which is one of the major reasons that we decided to introduce our readers\
    \ to the Factly Skill in this chapter.\n\n## Designing the Factly Skill\n\nWe\
    \ hope that the discussion in the last section should have given you a fair idea\
    \ of the motivation behind the Factly Alexa Skill. Now, we shall level up and\
    \ design the actual Factly Skill. It is always better to design before coding\
    \ anything because it gives us a clarity about the end goals of the software and\
    \ the finer details, which we may otherwise miss when we actually code the software.\n\
    \nThe Factly Alexa Skill is a simple quiz skill. At the code level, the Factly\
    \ Skill/Lambda will contain a bank of questions that will be presented to the\
    \ user one by one. The skill will further perform depending on the user's reply.\n\
    \nFactly will work via the following steps:\n\n- 1. The user will launch the Factly\
    \ Skill via a standard Alexa Skill launch utterance.\n- 2. Alexa will confirm\
    \ the launch and provide a brief introduction to the skill and play method:\n\n\
    ![](img/80ddccf2572659c5b147f23cc6356c5a_100_0.png)\n\nFigure 4.7: Step 1 – Factly,\
    \ launch\n\nThe skill that we will design will consist of three trivia questions\
    \ and each question will have four answer choices, with only a single choice being\
    \ the correct one.\n\n3. Alexa will begin the quiz by asking the first question:\n\
    \n![](img/80ddccf2572659c5b147f23cc6356c5a_101_0.png)\n\nFigure 4.8: Step 2 –\
    \ Factly, questionnaire\n\n4. The user can provide the answer by just saying the\
    \ number of the correct answer, for example: \"The answer is 3\" or just \"3\"\
    :\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_101_1.png)\n\nFigure 4.9: Step 3\
    \ – Factly, answer acknowledgment\n\nDepending on the user's answer, the skill\
    \ will provide a response that the answer is correct or incorrect.\n\n5. The user\
    \ can also end the session:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_101_2.png)\n\
    \nFigure 4.10: Step 4 – Factly, conclusion\n\n- 6. Steps 4, 5, and 6 will be repeated\
    \ until all the quiz questions have been exhausted or the user decides to end\
    \ the session.\n\nThe interaction flow can be expressed in terms of a VUI diagram:\n\
    \n![](img/80ddccf2572659c5b147f23cc6356c5a_102_0.png)\n\nFigure 4.11: Factly,\
    \ VUI flow\n\nAlso, the overall information flow of a typical quiz session can\
    \ be mapped out as follows:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_102_1.png)\n\
    \nFigure 4.12: Factly, data flow\n\n## Building the Factly Skill\n\nNow, since\
    \ we understand how data flows to and from our Factly Skill, it is time to actually\
    \ build it. For this purpose, we will build the actual Lambda via the Amazon Developer\
    \ portal.\n\nWe will assume that the reader knows about and has already signed\
    \ up to the Amazon Developer portal, and is already aware of the basic starter\
    \ information about the Amazon Alexa Skills Developer Portal, since this has also\
    \ been already covered in detail in Chapter 2, *Hello World, Alexa!*. We already\
    \ covered account creation and other basic details for the Amazon Developer Portal\
    \ in Chapter 2, *Hello World, Alexa!*, so we will not be repeating those here.\n\
    \nWe shall begin with the skill creation:\n\n- 1. On the **Skill builder checklist**,\
    \ select **Invocation Name** to navigate to the **Invocation name** screen and\
    \ provide the skill with an invocation name, as shown in the following screenshot:\n\
    \n![](img/80ddccf2572659c5b147f23cc6356c5a_104_0.png)\n\nSave these changes by\
    \ clicking on the **Save Model** button. Once you have successfully saved the\
    \ changes, navigate back to the **Skill builder checklist**.\n\n2. In this step,\
    \ we shall define the **Intents, Samples, and Slots** for the **Interaction Model**\
    \ for our skill. Our skill will be making use of two intents:\n\n- - **Answer\
    \ Intent:** This intent will hold the user's answers to the quiz questions posed\
    \ by the Factly Skill. This intent will also include a slot so that we can pass\
    \ the answer as an argument to the Lambda.\n- - **AMAZON.StopIntent:** This is\
    \ a standard intent pre-provided by ASK, through which the user can terminate\
    \ the skill's execution at any point in time.\n\nTo know more about standard built-in\
    \ intents, please visit https://developer.amazon.com/docs/custom-skills/standard-built-in-intents.html.\n\
    \nFrom the **Skill builder checklist**, click on **Intents, Samples, and Slots**\
    \ to land on the **Add Intent** screen. Rather than directly defining an Intent,\
    \ we will first define a custom slot that we can later include in our **Answer\
    \ Intent:**\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_105_0.png)\n\nFigure 4.15:\
    \ Adding a New Slot Type\n\nAs shown in the preceding screenshot, click on the\
    \ **Add** button next to **Slot Types** to land on the **Add Slot Type** screen.\n\
    \nTo know more about slots, types, and custom slot types, please visit https://developer.amazon.com/docs/custom-skills/custom-interaction-model-reference.html#custom-slot-syntax.\n\
    \nOn the **Add Slot Type** screen, create a custom slot type by the name of `LIST_OF_CHOICES`,\
    \ as shown in the following screenshot:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_106_0.png)\n\
    \nFigure 4.16: Naming the new custom Slot Type\n\nOn the next screen, provide\
    \ it with a list of values, 1, 2, 3, 4, since each of the questions posed by the\
    \ Factly Skill can have these four possible answers:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_107_0.png)\n\
    \nFigure 4.17: Adding Slot Values to the custom Slot Type\n\nWith our slot type\
    \ set up, click on the **Add** button to add an intent, as shown in the following\
    \ screenshot:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_107_1.png)\n\nFigure\
    \ 4.18: Adding an Intent\n\nThis should bring you to the **Add Intent** screen.\
    \ Define an intent called `Answer` on this screen, which is going to contain the\
    \ answer provided by the user for the questions posed by the Factly Skill, as\
    \ shown in the following screenshot:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_108_0.png)\n\
    \nOnce you have defined the intent, click on the **Create custom intent** button\
    \ to land on the **Sample Utterances** screen. Before defining any sample utterances,\
    \ scroll down on this screen and create a new slot type called `Choice`. Give\
    \ this slot the type of `LIST_OF_CHOICES`, which we defined earlier from the drop-down\
    \ menu:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_109_0.png)\n\nFigure 4.20:\
    \ Adding slot to the Intent\n\nOnce we have defined the slot, we can now go ahead\
    \ and define a couple of sample utterances for our intent.\n\n- 3. Add a couple\
    \ of **Sample Utterances** for the *Answer* intent which will, of course, include\
    \ the **Choice** slot, since that is what will contain the actual answer to the\
    \ questions posed by Factly:\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_109_1.png)\n\
    \nFigure 4.21: Adding Sample Utterances for the Intent\n\nOnce you have defined\
    \ and saved the model, you can also click on the **JSON Editor** option in the\
    \ left menu pane and verify that your JSON configuration matches this one:\n\n\
    ```\n```json\n{\n    \"interactionModel\": {\n        \"languageModel\": {\n \
    \           \"invocationName\": \"factly\",\n            \"intents\": [\n    \
    \            {\n                    \"name\": \"Answer\",\n                  \
    \  \"slots\": [\n                        {\n                            \"name\"\
    : \"Choice\",\n                            \"type\": \"LIST_OF_CHOICES\"\n   \
    \                     }\n                    ],\n                    \"samples\"\
    : [\n                        \"the answer is {Choice}\",\n                   \
    \     \"{Choice}\"\n                    ]\n                },\n              \
    \  {\n                    \"name\": \"AMAZON.StopIntent\",\n                 \
    \   \"samples\": []\n                }\n            ],\n            \"types\"\
    : [\n                {\n                    \"name\": \"LIST_OF_CHOICES\",\n \
    \                   \"values\": [\n                        {\n               \
    \             \"name\": {\n                                \"value\": \"1\"\n\
    \                            }\n                        },\n                 \
    \       {\n                            \"name\": {\n                         \
    \       \"value\": \"2\"\n                            }\n                    \
    \    },\n                        {\n                            \"name\": {\n\
    \                                \"value\": \"3\"\n                          \
    \  }\n                        }\n                    ]\n                }\n  \
    \          ]\n        }\n    }\n}\n```\n```\n"
