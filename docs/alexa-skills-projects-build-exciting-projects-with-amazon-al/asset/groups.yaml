  - '[PAGE 25]


    Google Now can do pretty much all that Siri can accomplish; however, it has better
    integration with the web and web-based queries, since the web is Google''s main
    forte. Some of the things that a user can ask Google Now are:


    | Categories | Commands |

    |---|---|

    | General commands | • "What is [Schrodinger''s cat]?"\n• "Who invented [the internet]?"\n•
    "Post to Google+ [feeling great]" |

    | Notes and reminders | • "Set alarm for [8 PM]"\n• "Note to self: [I parked my
    car in section D]" |

    | Time and date | • "What is the time zone of [Berlin]"\n• "Time at home"\n• "Create
