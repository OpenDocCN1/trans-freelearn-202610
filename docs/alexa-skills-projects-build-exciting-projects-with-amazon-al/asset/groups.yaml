  - '[PAGE 175]


    The overall system that we will eventually develop will also include a mobile
    app, which will interact with the CC2650STK SensorTag over BLE and will upload
    the temperature readings to the Firebase backend.


    At the production level, we won''t need the mobile app at all, as most practical
    sensors are fully capable and configured to upload data to backends over Wi-Fi.
    However, since we are prototyping, we are resorting to this solution.


    Those readings can then be fetched from the Firebase backend by the Lambda and
    presented to the user when the user prompts Alexa for them.


    # Designing the Ambience Manager Skill


    Our Ambience Manager Skill will have at least five moving parts, including a User
    that interacts with Amazon Echo, which in turns communicates with the AWS Lambda,
    which in turn fetches the temperature information from the Firebase cloud. The
    temperature information will be pushed to the Firebase cloud via the Mobile Device,
    which reads it from the Ambient Sensor. The flow of information is shown in the
    following diagram:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_175_0.png)'
  - '[PAGE 176]


    The ambient sensor will communicate the ambient parameters, that is, temperature
    and humidity, to a mobile app over BLE.


    To learn more about BLE, visit https://www.bluetooth.com/news/pressreleases/2009/12/17/sig-introduces-bluetooth-low-energy-wireless-technologythe-next-generation-of-bluetooth-wireless-technology.


    This will eventually upload the ambient parameters to the Firebase backend.


    Firebase is a real-time database by Google. To learn more about Firebase, visit
    https://firebase.google.com/.


    Once the data is available on the Firebase backend, the user will be communicating
    with the skill as follows:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_176_0.png)


    Figure 6.3: One-Shot Launch for Ambience Manager Skill


    Do you notice something different?


    If you have not already noticed, we did not launch the skill (as we did for all
    the previous Alexa skills that we created), and yet went ahead to ask about the
    room temperature directly. This is what is known as One-Shot Launch, which is
    when a user launches a skill and requests some information from it. We will be
    covering the One-Shot Launch/Invocation in detail once we design/code the actual
    skill.'
