    \n## 什么是 Alexa？\n\n> *“我确实看到了语音的力量。它是一种非常强大的叙事形式。”*  \n> —— 阿基拉·博尔登-莫尼法\n\n对于我们的人类祖先来说，随着大脑的进化，语言也随之发展，从符号和声音到更复杂的有声语言形式，这使他们能够进行复杂的对话，从而形成生存所需的社会联系。与书面交流不同，有声语言不会留下自身的痕迹，因此历史学家很难计算出语言起源的确切日期。然而，历史学家通过多种方法推测，语言发展于30万年前，符号于3万年前，文字于7000年前。自那时起，人类一直将语言和声音用于各种创造性的用途。\n\
    \n在本章中，我们将探讨语音的一种此类用途——能够随意命令基于语音的交互式个人助理执行特定任务的能力。在此之前，我们还将通过以下主题了解什么是基于语音的智能个人助理、它能满足哪些需求，以及当前市场上有哪些基于语音的个人助理（包括\
    \ Alexa）：\n\n- 语音个人助理的需求\n- 语音个人助理的应用\n- 各种语音个人助理的比较\n\n那么，让我们进入第一个主题。\n\n## 语音个人助理的需求\n\
    \n要理解语音个人助理的演变，我们必须回到过去，看看促成其出现的一些重要事件。这些事件之一是计算机的演变。尽管与语音革命没有直接关系，但计算机的演变在语音个人助理的发展中发挥了关键作用，因为它标志着互联网的发明，而互联网是大多数语音个人助理的支柱。计算机革命还带来了有关硬件和集成电路的重大变革，我们将在下面讨论这些变革。\n\
    \n计算机革命始于19世纪，当时查尔斯·巴贝奇发明了第一台分析引擎，这为他赢得了“计算机之父”的称号。20世纪50年代和60年代是有趣的时代，集成电路这一开创性发明为计算机科学领域带来了巨大进步。集成电路取代了二极管和真空管，导致现有计算机的外观尺寸发生了巨大变化，进而使其变得更小、更紧凑。也是在那个时候，戈登·摩尔提出了他著名的观察：集成电路中的晶体管数量每两年翻一番；粗略地说，我们将能够在集成电路中封装越来越多的处理能力，而电路尺寸每两年就会缩小一次。摩尔的观察早已预见了我们技术和硬件的未来，遵循它，我们至少可以容易地预测一件事：我们会看到计算机变得越来越小，非常小，瞧，今天几乎每个人手中都有一台小型计算机——他们的智能手机。\n\
    \n60年代末和70年代初，高级研究计划局网络（ARPANET）也出现了，它最终演变成了我们在80年代所熟知的互联网。这一切起初听起来微不足道，但当你意识到这些都是关键因素时，如果没有它们被发明出来，我们永远不会看到语音个人助理的实际应用。\n\
    \n在语音个人助理出现之前，向计算机系统发送命令的传统方式要么是通过鼠标使用图形用户界面（GUI），要么是通过键盘使用终端。随着传统计算系统的外观尺寸缩小，输入方式也在演变，早期的手持设备/移动电话在传统键盘之外引入了手写笔，以利用设备的触摸屏功能：\n\
    \n![](img/80ddccf2572659c5b147f23cc6356c5a_16_0.png)\n\n图 1.1：2010年拍摄的带手写笔的智能手机\n\
    \n演变仍在继续，正如史蒂夫·乔布斯所指出的，手写笔的位置被“世界上最好的指点设备”——我们的手指所取代。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_16_1.png)\n\
    \n2007年，史蒂夫·乔布斯在旧金山举行的MacWorld大会上，用“世界上最好的指点设备”来形容用户的手指，从而在iPhone上引入了触摸功能。这次大会的亮点可以在YouTube上观看：`https://www.youtube.com/watch?v=P-a_R6ewrmM`。\n\
    \n随着计算机与人类之间的界面变得越来越薄，语音自然地成为下一种能够作为计算设备输入工具的媒介，因此语音个人助理应运而生。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_16_2.png)\n\
    \n将语音作为计算设备输入媒介的想法并不新鲜；与计算机革命并行的是语音革命，其许多重要发现见链接：`https://voicebot.ai/2017/07/14/timeline-voice-assistants-short-history-voice-revolution/`\n\
    \n"
