  - '[PAGE 125]


    We can also add persistence to any Alexa Skill for saving the current state or
    the user''s progress. Saving state can be used as a delighter or it can also be
    a necessity, especially in **Game/Entertainment**-oriented skills where it is
    critical to save the user''s progress.


    In this section, we shall demonstrate adding persistence to Factly; we shall be
    informing the user of the number of times they have played Factly up until now,
    and for this we will be storing the launch count using **DynamoDB**, which is
    a NoSQL database service provided by AWS.


