  - "[PAGE 192]\n\nWe have enabled **Notifications** for the data characteristic and,\
    \ theoretically, we should be able to sit back and just wait for the temperature\
    \ sensor to read, update, and notify the latest temperature values to us via the\
    \ `onCharacteristicChanged` method. However, this is not the case, as we are still\
    \ missing a key step before we can get temperature updates successfully.\n\n+\
    \   14. If you were able to go over the documentation link, which we pointed out\
    \ in *Step 11*, there is a key detail mentioned in that document:\n\n| 0x29 |\
    \ 41 | 0xAA02 | IR Temperature Config | 00 | RW | Write \"01\" to start Sensor\
    \ and Measurements, \"00\" to put to sleep |\n\nFigure 6.8: Details of the temperature-configuration\
    \ characteristic\n\nAs per the preceding details, please note that by default,\
    \ the temperature sensor is not enabled to record measurements. Hence, by default,\
    \ our temperature sensor is in sleep mode; we need to bring it to active mode\
    \ so that we can receive periodic notifications. We do so by overriding the `onDescriptorWrite`\
    \ method in the `BluetoothGattCallback` implementation in the `MainActivity` class:\n\
    \n```\n@Override\npublic void onDescriptorWrite(BluetoothGatt gatt,\nBluetoothGattDescriptor\
    \ descriptor, int status) {\n    super.onDescriptorWrite(gatt, descriptor, status);\n\
    \    enableConfigurationForCharacteristic(gatt,\n    descriptor.getCharacteristic());\n\
    }\n```\n\nAs per the implementation of `onDescriptorWrite`, we will also need\
    \ to implement the `enableConfigurationForCharacteristic` method in the `MainActivity`\
    \ class:\n\n```\nprivate void enableConfigurationForCharacteristic(BluetoothGatt\
    \ gatt, BluetoothGattCharacteristic characteristic) {\n    if\n    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
    \ {\n        gatt.readCharacteristic(gatt.getService(UUID_IR_TEMPERATURE_SERVICE).getCharacteristic(UUID_CHARACTERISTIC_TEMPERATURE_CONFIG));\n\
    \    }\n}\n```"
