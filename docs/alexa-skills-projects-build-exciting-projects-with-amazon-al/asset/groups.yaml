    \n11. 你将进入一个详细的控制台。在此处，点击左侧窗格中的 **Database**，然后在水平选项卡列表中选择 **Rules** 选项卡。\n\n\
    - 12. 你面前看到的应该是一个 JSON 文件，表示规则为键值对：\n- 1. 将 `.read` 键从 `auth != null` 改为 `true`。\n\
