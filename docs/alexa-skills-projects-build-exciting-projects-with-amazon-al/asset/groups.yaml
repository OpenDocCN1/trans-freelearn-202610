    We will be introducing these over the course of this book.


    If you already have an Amazon Echo or if it is feasible for you to buy one to
    test the sample skills that we will write (although, as indicated earlier, we
    have other ways to test skills), then it involves a simple process to set it up,
    that is, to connect your Amazon Echo to the internet and start issuing commands
