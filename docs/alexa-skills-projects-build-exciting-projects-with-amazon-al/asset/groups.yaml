  mdcn: "\n我们已为数据特征启用了**通知**，理论上，我们现在可以高枕无忧，只需等待温度传感器通过 `onCharacteristicChanged`\
    \ 方法读取、更新并通知我们最新的温度值。然而，事实并非如此，因为在成功获取温度更新之前，我们还缺少一个关键步骤。\n\n- 14. 如果你仔细阅读过我们在*步骤\
    \ 11* 中指出的文档链接，你会发现该文档中提到一个关键细节：\n\n| 0x29 | 41 | 0xAA02 | IR 温度配置 | 00 | RW |\
    \ 写入“01”启动传感器和测量，“00”进入睡眠 |\n\n图 6.8：温度配置特征的详细信息\n\n根据上述细节，请注意默认情况下温度传感器并未启用记录测量功能。因此，默认情况下我们的温度传感器处于睡眠模式；我们需要将其切换到活动模式，以便接收定期的通知。我们通过在\
    \ `MainActivity` 类中重写 `BluetoothGattCallback` 实现中的 `onDescriptorWrite` 方法来实现这一点：\n\
    \n```\n@Override\npublic void onDescriptorWrite(BluetoothGatt gatt,\nBluetoothGattDescriptor\
    \ descriptor, int status) {\n    super.onDescriptorWrite(gatt, descriptor, status);\n\
    \    enableConfigurationForCharacteristic(gatt,\n    descriptor.getCharacteristic());\n\
    }\n```\n\n根据 `onDescriptorWrite` 的实现，我们还需要在 `MainActivity` 类中实现 `enableConfigurationForCharacteristic`\
    \ 方法：\n\n```\nprivate void enableConfigurationForCharacteristic(BluetoothGatt\
    \ gatt, BluetoothGattCharacteristic characteristic) {\n    if\n    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
    \ {\n        gatt.readCharacteristic(gatt.getService(UUID_IR_TEMPERATURE_SERVICE).getCharacteristic(UUID_CHARACTERISTIC_TEMPERATURE_CONFIG));\n\
    \    }\n}\n```\n\n这就是我们之前提到的第二个重要特征——配置特征——发挥作用的地方。\n\n15. 接着上一步，我们将读取配置特征（并在下一步中更新它），以便最终将温度传感器从睡眠模式配置为活动模式。为了更新配置特征，将预先实现的\
    \ `onCharacteristicRead` 方法更新为以下内容：\n\n```\n@Override\npublic void onCharacteristicRead(BluetoothGatt\
    \ gatt,\nBluetoothGattCharacteristic characteristic, int status) {\nsuper.onCharacteristicRead(gatt,\
    \ characteristic, status);\nif\n(characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
    \ {\n//Enable local notifications\ngatt.setCharacteristicNotification(characteristic,\
    \ true);\n//Enabled remote notifications\nBluetoothGattDescriptor desc =\ncharacteristic.getDescriptor(CONFIG_DESCRIPTOR);\n\
    desc.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);\n);\ngatt.writeDescriptor(desc);\n\
    } else if\n(characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_CONFIG))\
    \ {\ncharacteristic.setValue(new byte[] {0x01});\ngatt.writeCharacteristic(characteristic);\n\
    }\n}\n```\n\n读取成功后，我们向配置特征写入 `0x01`，以便将温度传感器设置为活动模式。\n\n16. 我们已经完成了实现，现在 `onCharacteristicChanged`\
    \ 方法应该在 SensorTag 每次更新温度值时被调用。作为最后一步，我们可以更新 `onCharacteristicChanged` 方法，向用户显示实时温度更新。同时，我们还可以设置并包含数据上传到\
    \ Firebase 后端，以便我们的应用能持续将定期数据更新上传到远程服务器。我们用于 UI 更新和后端上传的最终代码如下：\n\n```\n```java\n\
    @Override\npublic void onCharacteristicChanged(BluetoothGatt gatt,\nBluetoothGattCharacteristic\
    \ characteristic) {\n    super.onCharacteristicChanged(gatt, characteristic);\n\
    \    if\n    (characteristic.getUuid().equals(UUID_CHARACTERISTIC_TEMPERATURE_DATA))\
    \ {\n        final double ambient =\n        Utilities.extractAmbientTemperature(characteristic);\n\
    \        //Upload to Firebase Backend\n        FirebaseDatabase database = FirebaseDatabase.getInstance();\n\
    \        DatabaseReference myRef =\n        database.getReference(\"Temperature\"\
    );\n        myRef.setValue(ambient);\n        //Update the UI\n        runOnUiThread(new\
    \ Runnable() {\n            @Override\n            public void run() {\n     \
    \           ((TextView)\n                findViewById(R.id.textView).setText(\"\
    Temperature: \" + ambient\n                + \"\\\\u00b0\" + \"C\");\n       \
    \     }\n        });\n    }\n}\n```\n```\n\n请注意，我们仍需要在客户端和服务端两端设置 Firebase，因此上述代码可能无法编译，因为我们引用了\
    \ Firebase 但尚未进行设置。我们将在下一步中进行设置。\n\n## 设置 Firebase\n\n现在我们已经有数据了，剩下的事情就是将其上传到服务器，这样\
    \ Alexa 就可以远程读取/访问这些数据。为此，我们将 Firebase 集成到 Android 应用中，并将温度测量值上传到 Firebase 云。我们将按照以下步骤将\
