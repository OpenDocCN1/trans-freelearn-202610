    \n- 4. Now, this is where it gets interesting. When the user voices the actual\
    \ message in the previous step, a `SendMessage` intent will be created and the\
    \ actual message text will be passed as an argument to that intent.\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_68_0.png)\n\
    \n> We have already discussed intents in the previous chapter and so we are assuming\
    \ that the reader is already familiar with intents and their functionality.\n\n\
    - 5. The intent is processed by the Lambda, where the Lambda extracts the message\
    \ from the intent and passes it to the Twilio backend, together with information\
    \ about the intended recipient of the message.\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_68_1.png)\n\
    \n> We will not go into many details about the communication between the Lambda\
    \ and the Twilio backend since it will be covered in the upcoming sections.\n"
  mdcn: "\n设置好触发器后，我们现在需要对其进行配置。请复制上一步保存的**技能 ID**，并将其添加到技能验证部分，如下面的截图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_58_0.png)\n\
    \n技能 ID 验证可确保我们的 Lambda 只处理那些由我们实际想要交互的技能发送的查询。\n\n请点击屏幕右上角的**保存**按钮，并在设计器树中选择\
    \ **greeterHelloWorldSkill**：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_59_0.png)\n\
    \n图 2.28：配置 Lambda（来源：console.aws.amazon.com）\n\n现在，我们可以配置并开始编写 Lambda 了。\n\n\
    - 14. 由于我们的技能非常简单，我们的 Lambda 将处理两个基本请求：\n    - LaunchRequest：处理技能的启动\n    - IntentRequest：处理各种意图（在本例中只有一个\
    \ GreetHelloWorldIntent，用于问候 Hello World）\n\n我们将直接在开发者门户上进行内联代码编辑。我们首先要对技能收到的每个请求进行区分：\n\
    \n```javascript\nexports.handler = (event, context, callback) => {\n    switch\
    \ (event.request.type) {\n        case \"LaunchRequest\":\n            break;\n\
    \        case \"IntentRequest\":\n            break;\n    }\n}\n```\n\n如上面的代码所示，这就是我们对启动（launch）和意图（intent）事件请求进行区分的方法。\n\
    \n- 15. 接下来，我们将定义一些辅助函数，来帮助我们创建语音响应：\n\n```javascript\nbuildSpeechletResponse\
    \ = (outputText, shouldEndSession) => {\n    return {\n        outputSpeech: {\n\
    \            type: \"PlainText\",\n            text: outputText\n        },\n\
    \        shouldEndSession: shouldEndSession\n    }\n}\n\ngenerateResponse = (speechletResponse)\
    \ => {\n    return {\n        version: \"1.0\",\n        response: speechletResponse\n\
    \    }\n}\n```\n\n`generateResponse` 函数将使用 `buildSpeechletResponse` 函数生成由 Lambda\
    \ 函数返回的响应。`buildSpeechletResponse` 函数将以纯文本形式指定 Alexa 最终会输出的内容。它还需要一个变量 `shouldEndSession`，该变量指定\
    \ Alexa 是否应在响应后结束会话。\n\n- 16. 配置好辅助函数后，我们就可以更新 `LaunchRequest` 和 `IntentRequest`\
    \ 分支，让 Alexa 说出相应的响应，如下面的代码所示：\n\n```javascript\nexports.handler = (event, context,\
    \ callback) => {\n    switch (event.request.type) {\n        case \"LaunchRequest\"\
    :\n            context.succeed(generateResponse(buildSpeechletResponse(\"Welcome\
    \ to Hello World Greeter.\", false)))\n            break;\n        case \"IntentRequest\"\
    :\n            switch (event.request.intent.name) {\n                case \"GreetHelloWorld\"\
    :\n                    context.succeed(generateResponse(buildSpeechletResponse(\"\
    Hello World\", true)))\n                    break;\n            }\n          \
    \  break;\n    }\n}\n```\n\n现在，当我们的 Lambda 收到 `LaunchRequest` 时，它可以返回一条欢迎消息，如前面的代码所示。此外，如果它收到\
    \ `IntentRequest`，它可以按意图名称进行筛选（虽然目前不需要筛选，因为我们只有一个自定义意图）。请点击屏幕右上角的**保存**按钮来保存进度。\n\
    \n- 17. 我们需要将 Lambda 与我们的技能关联，为此，我们需要 Lambda 的 ARN。\n\nARN 代表 Amazon Resource\
    \ Name（亚马逊资源名称）。\n\nARN 位于 Lambda 函数页面的右上角，如下面的截图所示（为保护隐私和安全，图中的 ARN 已做模糊处理）：\n\
    \n![](img/80ddccf2572659c5b147f23cc6356c5a_62_0.png)\n\n图 2.29：复制 ARN（来源：console.aws.amazon.com）\n\
    \n复制 ARN 后，请切换回之前的浏览器标签页，我们之前在那里配置技能的交互模型。请选择**端点**（Endpoints）选项卡，并在**默认区域**（Default\
    \ Region）下输入 ARN，如下面的截图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_63_0.png)\n\
    \n图 2.30：将 Lambda 的 ARN 与技能关联（来源：developer.amazon.com）\n\n请点击**保存端点**（Save Endpoints），然后点击**构建**（Build）选项卡进入技能构建器检查清单。请重新构建模型。\n\
    \n- 18. 我们的设置已基本完成，可以测试 Hello World Greeter 技能了。该技能可以通过真实的 Amazon Echo 设备或 Amazon\
    \ Service Simulator（亚马逊服务模拟器）进行测试。我们首先将通过 Amazon Service Simulator 测试我们的技能。请点击“测试”选项卡启动模拟器，并通过拨动“测试开关”为技能启用测试：\n\
    \n![](img/80ddccf2572659c5b147f23cc6356c5a_64_0.png)\n\n图 2.31：Alexa 测试模拟器（来源：developer.amazon.com）\n\
    \n请输入如下面截图所示的请求。Lambda 应为每个请求被调用，并返回以下响应：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_65_0.png)\n\
    \n图 2.32：服务模拟器中的 Lambda 响应（来源：developer.amazon.com）\n\n如果系统音量已打开，你甚至可以收听这些响应。\n\
    \n或者，你也可以使用 Amazon Echo 测试该技能。如果 Echo 已连接并设置好，当你说出：“Alexa, Launch Hello World\
    \ Greeter,” 时，它应该回答：“Welcome to Hello World Greeter.”。如果你接着让它“Say hi”或“Say something,”，它应该回答“Hello\
    \ World.”。\n\n至此，本章已接近尾声。\n\n请通过以下链接查看本章的 Lambda 代码：https://github.com/madhurbhargava/AlexaSkillsProjects/blob/master/Chapter2_HelloWorldGreeter_index.js\n\
    \n在下一节中，我们将总结已学内容，并展望后续章节。\n\n## 3 与 Alexa 的免提体验\n\n> “舌头能描绘出眼睛看不见的东西。”\n> \n\
    > ——中国谚语\n\n在学习完 Echo 和 Alexa 的细节之后，我们转而设计一个基本的 Alexa 技能。我们还对基本 Alexa 技能的构成以及技能中各个活动部件如何交互有了一些了解。\n\
    \n在本章中，我们将进一步提升设计技能，创建一个稍微高级一点的技能。这个技能名为 Handsfree Messenger，它允许用户仅使用 Alexa 和\
    \ Echo，无需与手机进行任何交互，就能以免提方式发送短信。除了用于托管 Lambda 的 AWS 之外，我们还将使用一个名为 Twilio 的定制服务，该服务允许用户/开发者通过\
    \ Web 服务 API 以编程方式拨打/接听电话以及发送/接收文本消息。\n\n在本章中，我们将通过涵盖以下主题来实现这一目标：\n\n- Handsfree\
    \ Messenger 技能概述\n- 配置 Twilio 消息后端\n- 配置 Handsfree Messenger 技能\n\n闲话少说，让我们从该技能设计的概述开始。\n\
    \n### Handsfree Messenger 技能概述\n\n在继续设计 Handsfree Messenger 技能之前，我们需要了解几件事：\n\n\
    - 系统的核心功能是什么？\n- 它有哪些活动部件？\n- 这些部件如何交互？\n\nHandsfree Messenger 技能的工作方式如下：\n\n\
    - 1. 用户将说出一个起始短语——“Alexa, Start Handsfree Messenger.”来启动 Alexa 技能。\n- 2. Alexa\
    \ 将启动该技能。\n- 3. 用户将说出需要发送的实际消息：“Send message – Get milk!”\n- 4. 现在，有趣的地方来了。当用户在前一步中说出实际消息时，将创建一个\
    \ `SendMessage` 意图，实际的消息文本将作为参数传递给该意图。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_68_0.png)\n\
    \n> 我们在前一章已经讨论过意图，因此我们假设读者已经熟悉意图及其功能。\n\n- 5. 该意图由 Lambda 处理，Lambda 从意图中提取消息，并将消息连同预期收件人的信息一起传递给\
    \ Twilio 后端。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_68_1.png)\n\n> 关于 Lambda\
    \ 与 Twilio 后端之间的通信细节，我们不会深入讨论，因为将在后续章节中介绍。\n\n"
