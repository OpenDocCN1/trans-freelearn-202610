    ![](img/80ddccf2572659c5b147f23cc6356c5a_16_0.png)


    Figure 1.1: A smartphone with a stylus, captured in the year 2010


    The evolution continued and the place of the stylus was taken by, as pointed out
    by Steve Jobs, "the best pointing device in the world," our fingers.


    ![](img/80ddccf2572659c5b147f23cc6356c5a_16_1.png)


    Steve Jobs introduced touch on the iPhone by using the term "best pointing device
    in the world" for a user''s fingers in 2007 during the MacWorld Conference in
    San Francisco. The highlights of this conference are available on YouTube at `https://www.youtube.com/watch?v=P-a_R6ewrmM`.


    As the interface between computers and humans grew thinner, it was only natural
    that voice was the next medium that could act as an input tool to computing devices,
    and hence there has been the advent of voice-based personal assistants.


    ![](img/80ddccf2572659c5b147f23cc6356c5a_16_2.png)


    The idea of having voice as an input medium for computing devices was not new;
    parallel to the computer revolution, there was also the voice revolution, many
    important discoveries of which are shown in the link: `https://voicebot.ai/2017/07/14/timeline-voice-assistants-short-history-voice-revolution/`'
