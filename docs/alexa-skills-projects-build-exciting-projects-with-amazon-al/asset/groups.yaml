  - '[PAGE 29]


    # Alexa


    Alexa, the whole center point of this chapter and the book, is the interactive
    voice-based personal assistant by Amazon, originally introduced with its family
    of Echo devices. Alexa as an assistant is oriented towards a smart home concept,
    hence most of its use comes from Amazon Echo, a smart speaker designed and developed
    to be kept in the living room of the user''s home so that the user can ask it
    day-to-day queries about weather, food recipes, and jokes, or play interactive
    trivia games, set alarms, shop for day-to-day items, and much more. The following
    diagram shows some of the things that a user can ask Alexa:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_29_0.png)


    Figure 1.14: List of some things that Alexa can help with


    The capabilities of Alexa can also be extended by installing third-party skills
    (similar to Google Home''s third-party apps). Each third-party skill is meant
    to serve a specific purpose. For example, the Uber skill allows you to order a
    ride, the Domino''s skill allows you to order a pizza—all from the comfort of
    your home and through the magic of your voice working together with Alexa.'
  - '[PAGE 30]


    As of the time of writing this, there are more than 15,000 skills available for
    Alexa with Uber and Lyft being the most used ones in the travel category, Pandora
    and Spotify for music streaming, and multiple other skills being utilized in home
    automation.


    # A Comparison of Various Voice-Based Personal Assistants


    Due to our previous discussions, we already know that each market, whether it
    is desktop, smartphones, or smart homes, has a steady supply of interactive voice-based
    personal assistants. Almost every assistant can do whatever its counterparts can
    accomplish, but this leads to the question, where do the actual differences lie?
    Is there something that Alexa can do better than Google Assistant or vice versa?


    This book is based on Alexa, which is a Smart-Home based personal assistant, so
    in this section, we shall compare Alexa and Google Assistant to understand the
    finer differences between the two:


    | Alexa | Google Assistant |

    |---|---|

    | Uses the invocation phrase, "Alexa" | Uses the invocation phrase, "OK, Google"
    |

    | Flagship hardware—Amazon Echo device family | Flagship hardware—Google Home,
    Pixel 2, Android Wear |

    | Responds slightly better to e-commerce/shopping-related queries, since that
    is Amazon''s main forte | Responds slightly better to web-based queries since
    Google''s major forte is web searching |

    | Slightly inferior contextual awareness | Better contextual awareness, hence
    conversations seem a little more natural |

    | Capabilities of Alexa can be extended by installing third-party "skills" | Capabilities
    of Google Assistant can be extended by installing third-party apps; however, it
    has fewer apps currently available for it in the market than Alexa has skills
    |

    | A wider range of integration with smart home devices such as smart lights, smart
    locks, smart switches, and smart thermostats | Slightly narrower range of integration
    with smart home devices |'
  - '[PAGE 31]


    In a nutshell, both Google and Alexa are very skilled voice-based assistants and
    accomplish a lot for their users; however, since Google Assistant is fairly new
    to the market, its integration and compatibility with third-party apps and hardware
    is still evolving, albeit at a very rapid pace. However, even being the newer
    of the two, Google Home still fares better in terms of web integration and contextual
    awareness.


    It would be really interesting to see what the evolution of AI and Machine Learning
    brings to the table in the coming era and how these assistants are able to leverage
    that.


    # Summary


    In this chapter, we covered the evolution of interactive voice-based personal
    assistants and the various factors involved in their move from a user''s smartphone
    to their smart home. We also saw the various interactive voice-based personal
    assistants in the smartphone, desktop, and smart home markets, and the capabilities
    of each.


    Our goal was to get the reader familiar with the history of interactive voice-based
    personal assistants so that over the course of the book, we can direct our focus
    onto Alexa, the interactive personal assistant bundled with Amazon Echo. The next
    chapter will enable the reader to understand the anatomy of an Alexa Skill and
    to hands-on program an Amazon Echo so that Alexa can learn to say one of the oldest
    phrases in computer programming, "Hello, World."'
