    It is a smart speaker by Apple, with Siri being the counterpart to the Google
    Assistant and Alexa. Priced at $349 (at the time of writing), it is second only
    to Google Home Max (priced at $399) in terms of price.


    HomePod''s design provides it with 360-degree sound with good clarity and quality,
    however, it is tightly coupled with Apple''s ecosystem. For example, Amazon Echo
    and Google Home easily integrate with third-party services, such as Spotify, which
    is a little difficult on Apple HomePod.


    We hope that you now have a good idea of what each smart speaker has to offer,
    and how they compare to each other. With this information, we''ll move to the
    last section, where we will discuss the future of smart speakers.


    ## Future of Voice-Based Assistants


    In the infancy of the smart speaker market in 2016, the total number of smart
    speaker units sold was less than 10 million, however, at the beginning of the
    latter half of 2017, Amazon Echo had sold more than 20 million devices alone (source:
    voicebot.ai) and it is predicted (source: voicebot.ai) that, during 2018, more
    than 56 million smart speaker devices will be sold:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_234_0.png)


    Figure 7.7: Growth of smart speaker market


    ## Summary


    With this, we are at the end of this chapter and the end of this book.


    We hope you really enjoyed our time together and now have some solid confidence
    in your skills as an Alexa Skills Jedi.


    Also, we hope that you have a good idea of what kinds of categories and skills
    are available in the Alexa Skills Store, why some of the skills do better than
    others, and which niche categories you can focus on when designing your next skill.


    With all that information at hand, we cannot wait for you to publish your next
    skill. If you build something cool, drop us a line.


