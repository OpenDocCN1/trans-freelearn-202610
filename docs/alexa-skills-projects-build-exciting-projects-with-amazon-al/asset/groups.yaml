    Of the many milestones of the voice revolution, almost every reader will be familiar
    with at least a few of the latest ones, namely Siri, Google Now, Cortana, and
    Amazon''s Alexa. The most popular ones are Apple''s Siri and Google''s Google
    Now, which initially appeared integrated with iOS and Android mobile devices,
    respectively.


    Apple''s Siri initially appeared as an app on Apple''s App Store, but was later
    acquired by Apple and became much more closely integrated with iOS devices. Siri
    uses a natural language interface to listen to commands from the user and perform
    the necessary actions. Also, with the coming of macOS Sierra, its capabilities
    were no longer limited to iOS devices:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_17_0.png)


    Figure 1.3: The capabilities of Siri also extend to desktops in addition to iPhones


    Google closely followed in the footsteps of Apple and, shortly after the introduction
    of Siri in 2011, introduced Google Now in 2012. Unlike Siri, Google Now was available
    natively for Android and also as a separate app for iOS devices. Google Now seamlessly
    integrated with other Android/Google features such as Gmail, Google Calendar,
    and the mighty Google Search itself:'
  - '[PAGE 18]


    ![](img/80ddccf2572659c5b147f23cc6356c5a_18_0.png)


    Figure 1.4: Google Now is available on iOS as part of a native app (Google and
    the Google logo are registered trademarks of Google Inc., used with permission.)


    Closely behind Google was Microsoft with its own intelligent voice-based assistant,
    Cortana, which it introduced in 2014 for desktop and mobile devices:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_18_1.png)


    Figure 1.5: Microsoft''s Cortana was initially introduced for Microsoft''s mobile
    and desktop computing systems'
  - '[PAGE 19]


    As time passed, it became evident that voice-based personal assistants were here
    to stay and needed exclusive hardware and space of their own. This was something
    that Amazon took the lead on with the introduction of its brand Amazon Echo, which
    was a device family of smart speakers, specifically designed and developed by
    Amazon Inc. to enable its users to use the services of an interactive voice-based
    personal assistant called *Alexa* (hence the title of the chapter):


    ![](img/80ddccf2572659c5b147f23cc6356c5a_19_0.png)


    Figure 1.6: The Amazon Echo device family


    The complete Echo family and their functionalities are described in the following
    table:


    | Device | Use |

    |---|---|

    | Amazon Echo | Original flagship smart speaker. |

    | Echo Dot | Smaller and cheaper version of Echo without the amplified speaker,
    so the sound quality is also inferior to Echo. |

    | Echo Plus | Latest version of Echo with Zigbee integration. |

    | Echo Show | Alexa-enabled device with a large touchscreen so that a user''s
    interaction with Alexa is not just auditory but also visual. |

    | Echo Spot | *Show + Dot = Spot*. All the basic functionality of Show and Dot
    devices with the much lesser form factor. |

    | Amazon Tap | Alexa-enabled Bluetooth speaker. |'
