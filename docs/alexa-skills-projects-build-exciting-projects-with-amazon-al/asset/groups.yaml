    ## Making Alexa Talk About

    CryptoCurrencies


    > > “The future is here. It’s just not widely distributed yet.”

    > >

    > > — William Gibson


    We designed a trivia game, called Factly, with Alexa in the last chapter. In this
    chapter, as promised, we are going to work on something that, at the time of writing
    this book, has taken the whole world by storm and, as you may have guessed from
    the chapter''s title, it is cryptocurrencies.


    In this chapter, we will be building a Skill called `CryptoOracle` (yes, we do
    understand it is a bad naming choice both in terms of syntax, semantics, and Alexa
    Skill-naming rules, but since we are not going to publish it yet, we are going
    to stick with this name) that can make Alexa talk about the latest prices of various
    cryptocurrencies. We will cover the following topics in this chapter:


    - A Brief Introduction to Cryptocurrencies

    - Designing the CryptoOracle skill

    - Building the CryptoOracle skill


    Let''s begin.


    ## A Brief Introduction to Cryptocurrencies


    For those who came late and missed the massive hype that Bitcoin and other similar
    cryptocurrencies, generated especially during 2017 and onward: cryptocurrencies
    are digital/virtual currencies, that is, unlike physical currencies, such as the
    dollar, euro or rupee, cryptocurrencies exist just as entries in a distributed
    database (usually). Various cryptographic techniques are deployed to record cryptocurrency
    transactions and their generation, and so these digital currencies are generically
    known as cryptocurrencies.


    Since cryptographic techniques are beyond the scope of this book, we won''t be
    covering them here.


    As of the time of writing this chapter, there are more than 1,500 cryptocurrencies
    available, and the better cryptocurrencies out of those 1,500 cryptocurrencies
    serve a unique purpose.


    You can check the number of known/traded cryptocurrencies by navigating to CoinMarketCap
    at https://coinmarketcap.com/.


    Some cryptocurrencies are used as a medium of exchanging value, such as Bitcoin,
    Litecoin, Monero, and Dash. Other cryptocurrencies, such as Ethereum, are used
    to power distributed systems, such as the Ethereum Virtual Machine:


    | Currency | Purpose |

    |---|---|

    | Bitcoin | Medium of value exchange |

    | Monero | Medium of value exchange focused on privacy |

    | Ethereum | Used to power the Ethereum Virtual Machine |

    | Litecoin | Faster and improved version of Bitcoin |


    One of the major reasons why cryptocurrencies are drawing so much attention is
    due to the speculative nature of their prices. Cryptocurrency prices rise and
    fall just like stock prices, and this draws a lot of attention from the general
    public and investors who speculate on the prices.


    Please note that the information presented in this section, regarding speculation
    on cryptocurrency prices, is just to provide information to our readers and is
    not investment advice.


    Due to the preceding reasons, cryptocurrencies have become all the rage, hence
    we decided to focus this chapter on designing a skill that can help an Alexa user
    to enquire about cryptocurrency prices on the fly.


    ## Designing the CryptoOracle skill


    Now that we know what cryptocurrencies are and why are they are getting all the
    attention lately, we can design the `CryptoOracle` skill.


    `CryptoOracle` will work via the following steps:


    - 1. A user launches the skill:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_141_0.png)


    Figure 5.1: Launching the CryptoOracle skill


    The launch response is fetched from the Lambda and played to the user, as shown
    in the preceding diagram.


    - 2. A user asks Alexa about the price of any cryptocurrency:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_141_1.png)


    Figure 5.2: Querying the cryptocurrency price via the CryptoOracle skill


    This request will do in the following:


    - Launch an intent to fetch the price with the cryptocurrency name as a parameter

    - The Lambda receives the intent and extracts the cryptocurrency name

    - The Lambda fetches the cryptocurrency price via the coinmarketcap API using
    the currency name


    To know more about the coinmarketcap API, navigate to https://coinmarketcap.com/.


    Finally, the response from the Lambda, which contains the cryptocurrency price,
    is played to the user.


    3. Optionally, the user can also ask CryptoOracle to stop/exit at any point of
    time during the dialog:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_142_0.png)


    Figure 5.3: User-initiated exit from the CryptoOracle skill


    In that case, the skill will stop its response midway and exit.


    The complete interaction can be mapped out via a VUI-flow diagram:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_143_0.png)


    Figure 5.4: VUI-flow diagram for the CryptoOracle skill


    The overall information flow of a typical session can be mapped out as shown in
    the following diagram:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_143_1.png)


    Figure 5.5: Information flow in the CryptoOracle skill


    With our data flow in place, it is now time to code the actual CryptoOracle skill.


    ## Building the CryptoOracle skill


    As of the time of writing this chapter, Amazon has recently updated its Alexa
    Skills Kit (ASK) developer console. We will be making use of the updated developer
    console for the purpose of developing our CryptoOracle skill:


    - 1. Navigate to the ASK console at https://developer.amazon.com/alexa, Sign In
    to the portal, and go to the Skills creation page (we have already done this exercise
    in the previous chapters, hence we won''t be repeating those steps):


    ![](img/80ddccf2572659c5b147f23cc6356c5a_144_0.png)


    Figure 5.6: Alexa Skills Portal – ASK Console


    Click on the Create Skill button located at the bottom of the screen.


    - 2. The Create a new skill screen requires a SkillName to proceed further, as
    shown in the following screenshot:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_144_1.png)


    Figure 5.7: Naming the CryptoOracle skill


    Name our skill CryptoOracle and click on the Next button.


    - 3. The next page will display the types of pre-built interaction models that
    can be added to the skill. Click on the **Select** button under the **Custom**
    model to select it, and click on the **Create Skill** button in the top-right
    corner of the screen.

    - 4. After skill creation, we will need to configure its **Interaction Model**
    via the dashboard shown in the following screenshot:


    ![](img/80ddccf2572659c5b147f23cc6356c5a_145_0.png)


    Figure 5.8: Interaction Model dashboard


    We will configure the **Interaction Model** by completing the **Skill builder
    checklist.**

