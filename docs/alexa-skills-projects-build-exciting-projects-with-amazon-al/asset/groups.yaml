    \ Two-Way。”\n\n– Dan Oswald\n\n随着我们逐步阅读本书，我们创建的技能也在不断演进。我们从一个简单的 Hello World 技能开始，接着创建了短信发送器、问答游戏、一个谈论加密货币的技能，而在本章中，我们将致力于\
    \ **Ambience Manager**，它可以告诉我们家庭的氛围参数，例如温度和湿度。\n\n我们将通过以下主题来设计此技能：\n\n- 家庭自动化和环境传感器的介绍\n\
    - 设计 Ambience Manager 技能\n- 开发移动应用\n- 开发 Ambience Manager 技能\n\n本章内容覆盖面很广，因为我们的\
    \ **Ambience Manager** 技能将与环境传感器通信，因此还将涉及环境传感器以及移动应用的细节，该应用将帮助我们把温度数据上传到云端。\n\n\
    ### 家庭自动化和环境传感器的介绍\n\n出于入门目的，家庭自动化是指用户可以通过一系列智能传感器而不是为每个单独设备翻动传统开关的方式来控制标准家庭设备，如灯光、音乐系统、电视，甚至气候。家庭自动化旨在尽可能减少用户与实际硬件的物理交互。在最近的现在和不那么遥远的过去，家庭自动化的概念建立在移动操作系统之上，主要是\
    \ Android 或 iOS，用户只需使用一部移动设备或平板电脑即可控制整栋房屋，而无需与房屋中每个单独设备的开关进行交互。\n\n随着交互式语音助手的出现，家庭自动化的概念已经发展到用户只需用声音即可控制家庭的程度。家庭自动化的实际概念非常广泛，完整的解决方案将包括各种各样的传感器。在本章中，我们将演示家庭自动化与基于语音的个人助理相关的概念，使用几乎每个自动化家庭中都提供的关键功能，即收集有关气候/氛围的信息，例如温度、湿度等。我们将创建一个解决方案，其中包括环境传感器、移动应用和\
    \ Alexa，用户只需询问 Alexa 即可获取房屋的氛围详情。\n\n氛围监测解决方案不仅用于家庭自动化，也用于各种仓库，因为产品必须保持在一定的温度/湿度下，它们可以通过\
    \ Wi-Fi 和/或蓝牙 BLE 在长距离上传输氛围数据。然而，这些解决方案也更昂贵且难以采购。因此，对于我们的需求，我们将使用一种流行的传感器原型解决方案\
    \ CC2650STK，俗称 SensorTag，由德州仪器制造，它体积小、易于获得、完全符合家庭自动化概念，并且可以从爱好/电子商店或德州仪器公司 TI\
    \ 网站、亚马逊在线轻松购买，价格仅为 45-50 美元。\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_173_0.png)\n\
    \n更多信息，请参考：http://www.ti.com/tool/CC2650STK\n\n我们最终开发的整体系统还将包括一个移动应用，该应用将通过 BLE\
    \ 与 CC2650STK SensorTag 交互，并将温度读数上传到 Firebase 后端。\n\n在生产级别，我们根本不需要移动应用，因为大多数实用传感器完全有能力并配置为通过\
    \ Wi-Fi 将数据上传到后端。然而，由于我们正在进行原型设计，我们采用了这种解决方案。\n\n然后，Lambda 可以从 Firebase 后端获取这些读数，并在用户提示\
    \ Alexa 时将其呈现给用户。\n\n### 设计 Ambience Manager 技能\n\n我们的 Ambience Manager 技能将至少有五个活动部分，包括与\
    \ Amazon Echo 交互的用户，Echo 反过来与 AWS Lambda 通信，Lambda 反过来从 Firebase 云获取温度信息。温度信息将通过移动设备推送到\
    \ Firebase 云，移动设备从环境传感器读取。信息流如下图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_175_0.png)\n\
    \n环境传感器将通过 BLE 将环境参数，即温度和湿度，传达给移动应用。\n\n要了解有关 BLE 的更多信息，请访问 https://www.bluetooth.com/news/pressreleases/2009/12/17/sig-introduces-bluetooth-low-energy-wireless-technology-the-next-generation-of-bluetooth-wireless-technology。\n\
    \n这最终会将环境参数上传到 Firebase 后端。\n\nFirebase 是 Google 的实时数据库。要了解有关 Firebase 的更多信息，请访问\
    \ https://firebase.google.com/。\n\n一旦数据在 Firebase 后端可用，用户将按如下方式与技能进行通信：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_176_0.png)\n\
    \n图 6.3：Ambience Manager 技能的一次性启动\n\n你注意到有什么不同了吗？\n\n如果你还没有注意到，我们并没有启动技能，正如我们为之前创建的所有\
    \ Alexa 技能所做的那样，却直接询问了房间温度。这就是所谓的 One-Shot Launch，即用户启动技能并请求其提供某些信息时。我们将在设计/编码实际技能时详细讲解\
    \ One-Shot Launch/Invocation。\n\n如果 One-Shot Launch 成功，Ambience Manager 应该会回复正确的温度：\n\
    \n![](img/80ddccf2572659c5b147f23cc6356c5a_177_0.png)\n\n图 6.4：Ambience Manager\
    \ 技能的对话流程\n\n就用户交互而言，典型会话的整体信息流可以映射如下图所示：\n\n![](img/80ddccf2572659c5b147f23cc6356c5a_177_1.png)\n\
    \n图 6.5：Ambience Manager 技能的操作\n\n在数据流就绪后，我们进入下一步：创建一个 Android 应用，该应用将通过 BLE 从环境传感器读取数据，然后将数据推送到\
    \ Firebase 后端。\n\n### 开发移动应用\n\n我们将创建一个 Android 应用，该应用将通过 BLE 与环境传感器通信。\n\n如果你对开发\
    \ Android 应用和 BLE 不太了解，不用担心，你可以简单地从本节末尾提供的链接下载源代码。或者，你可以查看 Android 开发者网站，了解 Android\
    \ 应用开发的相关信息。\n\n如果你有兴趣探索 Android，请导航到 https://developer.android.com/ 以获取有关 Android\
    \ 应用开发的更多信息。\n\n本节的先决条件如下：\n\n- **Android:**\n  - 最新版 Android Studio\n  - 一台最新的\
    \ Android 设备，最好是三星 Galaxy S8，因为它支持蓝牙 5，否则任何 API 级别为 23 的设备 Android M 即可\n  - 对\
    \ Java、Android、Android Studio 和 BLE 有基本熟悉程度\n- **硬件:**\n  - 德州仪器 CC2650 STK SensorTag\n\
    \n我们将从创建一个空项目开始。请为其选择一个名称。\n\n为了保持一致性，并且由于该项目已在我的另一本书中介绍过，书名为 *IoT Projects with\
    \ Bluetooth Low Energy* 由 Packt Publishing 出版，我将把它命名为 `AndroidWarehouseMonitor`。\n\
    \n由于我们即将为 Android 应用实现大量代码，为方便起见，我们已在以下流程图中分解了 Android 应用的功能：\n\n"
