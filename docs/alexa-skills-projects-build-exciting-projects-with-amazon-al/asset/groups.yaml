  - '[PAGE 15]


    # The Need for Voice-Based Personal Assistants


    To understand the evolution of voice-based personal assistants, we will have to
    go back in time and see some of the important events that led to their advent.
    One of these many events was the evolution of computers. Although not directly
    related to the voice revolution, the evolution of computers played a key role
    in the evolution of voice-based personal assistants because it marked the invention
    of the internet, which is the backbone of most voice-based personal assistants.
    The computer revolution also introduced critical changes concerning hardware and
    integrated circuits, which we shall discuss next.


    The computer revolution began in the 19th century when Charles Babbage invented
    the first analytical engine, which earned him the nickname the Father of Computers.
    The 1950s and 1960s were interesting times, which introduced some tremendous advances
    in the field of computer science with a groundbreaking invention, integrated circuits.
    Integrated circuits replaced diodes and vacuum tubes, which led to tremendous
    form factor changes in existing computers, in turn leading to smaller, more compact
    sizes. It was also the time when Gordon Moore introduced his famous observation
    that the number of transistors in an integrated circuit doubles every two years;
    roughly speaking, we would be able to pack more and more processing power into
    an integrated circuit while the size of the circuit would shrink every two years.
    Moore''s observation already foresaw the future of our technology and hardware,
    and by following it we could have easily predicted at least one thing, that we
    would be seeing our computers getting smaller, a lot smaller, and voilà, today
    nearly everyone has a small computer in his/her hands, their smartphone.


    The late ''60s and early ''70s also saw the advent of the Advanced Research Projects
    Agency Network (ARPANET), which eventually evolved to become the internet as we
    came to know it in the ''80s. All this sounds trivial at first, before you realize
    that all these were the key factors that, had they not been invented, we would
    have never seen voice-based personal assistants in action.


    Prior to voice-based personal assistants, the traditional way of sending commands
    to a computer system was either through the GUI using a mouse or through the terminal
    using a keyboard. As the form factor of traditional computing systems reduced,
    the input methods evolved too and initial handheld devices/mobile phones introduced
    a stylus in addition to the traditional keyboard to leverage the touchscreen capabilities
    of the device:'
