- pgno: 158
  md: '12. You can now customize the available answers for the question and choose
    various other options related to the display of the question. We will enter available
    answers of breakfast, lunch, and dinner, and allow multiple values to be selected.
    When you have finished modifying the options, click the Submit button to add the
    question.


    13. Other questions can be entered in a similar manner. When you have finished
    entering all of your questions, click the Publish button to publish your survey
    to the site.


    # Protecting the survey with Captchas


    Good Eatin'' Goal: Add a Captcha to the survey to help prevent automated entry
    into the survey, to prevent spam.


    Additional modules needed: Webform module (http://drupal.org/project/webform),
    Captcha module (http://drupal.org/project/captcha).


    # Basic steps


    +   1. Begin by installing and activating the Captcha module via the Module Manager.

    +   2. We will then need to modify the settings of the Captcha module. These are
    accessed by selecting User management and then CAPTCHA, from the Administer menu.

    +   3. The key setting we need to enable is the Add CAPTCHA administration links
    to forms option, as shown in the following screenshot:


    ☑ Add CAPTCHA administration links to forms

    This option is very helpful to enable/disable challenges on forms. When enabled,
    users with the "administer CAPTCHA settings" permission will see CAPTCHA administration
    links on all forms (except on administrative pages, which shouldn''t be accessible
    to untrusted users in the first place). These links make it possible to enable
    a challenge of the desired type or disable it.


    This will allow us to add the Captcha to our Survey.


    4. You can also configure Captchas for several predefined forms, specify whether
    or not users have to answer Captchas for each form they submit, specify whether
    or not incorrect answers are logged, and what the various options for each type
    of Captcha are.'
  merge: -1
  img_proc: true
