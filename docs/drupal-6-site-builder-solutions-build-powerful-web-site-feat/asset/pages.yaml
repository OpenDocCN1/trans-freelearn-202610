- pgno: 102
  md: '# Alternative solutions


    Another possible solution for attaching images to content types created with CCK
    is the Image Field Module (http://drupal.org/project/imagefield) which adds CCK
    support to the Image module. To use the Image Field module, you must also install
    the Filefield (http://drupal.org/project/filefield) and ImageAPI(http://drupal.org/project/imageapi)
    modules. The Image Field Module gives you some additional options for controlling
    the allowable sizes of files, as well as letting editors configure the title text
    and alt text that will be used to display a tooltip, and the alternative text
    if images display has been disabled by the visitor, respectively. However, the
    editor cannot easily select images that have already been uploaded to the site.
    The input form for the Image Field Module will appear like this:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_102_0.png)


    # Controlling access to the content type


    Good Eatin'' Goal: Modify the permissions of our editor role so that editors can
    create new Menu Items.


    Additional modules needed: None.


    # Basic steps


    +   1. We can easily control who can create Menu Items by editing the permissions
    for each role. Begin by opening the Permissions Manager by selecting User management
    and then Permissions from the Administer menu.'
