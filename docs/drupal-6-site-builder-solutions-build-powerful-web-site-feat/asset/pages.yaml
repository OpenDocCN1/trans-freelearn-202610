- pgno: 326
  md: '# 11


    # From Restaurants to Other Businesses


    Throughout this book, we have explored how to develop a-best-in-class web site
    for a restaurant, using Drupal. Unfortunately, there is not enough room in this
    book to present all of the possible functionality that you could add to a restaurant''s
    web site. We will begin this chapter by giving you ideas for additional enhancements
    that you can explore on your own.


    Next, we will discuss methods of applying the techniques that you learned in this
    book to other businesses, as most of you probably neither own a restaurant nor
    have clients who are restaurant owners.


    Finally, we will discuss issues to be considered if you decide to outsource your
    site development, as well as suggestions for choosing equipment and locations
    for hosting your web site.


    # Possible enhancements to the Good Eatin'' site


    In this section, we will explore additional ideas for enhancing the web site,
    which we did not have time to cover in detail earlier in this book. For each enhancement,
    we will either describe how to modify the functionalities that we have already
    developed, or we will discuss possible modules that you can explore on your own
    to enhance the site.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Birthday parties


    Many restaurants offer birthday parties for children especially if they have a
    child-friendly theme. Our web site could easily be extended to offer information
    about birthday parties and allow customers to reserve a time slot for their party.
    We could even offer birthday party hosts, and party planning functionality, which
    would allow them to create a guest list, have guests respond to the invitations,
    and track responses.


    The informational pages are simply static pages that would be organized under
    a birthday menu. You should include information about:


    +   - What days and times parties can be booked for

    +   - Activities that can be done at the party

    +   - What is included in the party package and, if there are multiple party packages,
    what the differences between them are

    +   - How long parties last

    +   - Ages that parties are appropriate for

    +   - Printable directions for guests to use if you don''t have a map on the site
    already


    Allowing guests to register for a party could be handled using the Public Bookings
    module.


    There is no dedicated module that would allow you to send invitations for a party.
    However, you could use the Webform module to create a survey that would be used
    to send invitations to guests and allow them to respond. We discussed using Webform
    in Chapter 4.


    # Gift certificates


    Gift certificates are used by many restaurants and other types of businesses to
    solicit new business and to provide an additional revenue source.


    Adding gift certificates is simply a matter of adding a new product to your e-commerce
    store, with specific amounts. You can then either send the customer a printed
    gift certificate or a gift card.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'A fancier solution would be to automatically create a discount coupon that
    the customer could either use online for takeout purchases, or could print and
    bring the printed coupon into the store for in-store purchases. To create this
    type of solution, you would need to integrate Ubercart to ensure that certificates
    are paid for, and then generate coupon codes within Ubercart. You would also need
    to ensure that coupon redemption is handled on the web site to prevent customers
    from redeeming the coupon twice, once in the store and once online.


    # Employment


    Most businesses are constantly looking to hire new employees. Your Drupal site
    can be easily extended to provide information to potential employees. Much of
    the information can be provided in a few static information pages.


    You should include the following information:


    +   - A description of positions that are currently available, including the duties
    of the position and where the employee will work, if you have multiple locations

    +   - Who to contact to submit an application

    +   - When the applicant needs to submit an application by, and when you expect
    to fill the position


    You can automate the process of submitting applications using either a custom-generated
    content type built using CCK form, or with Webform. The Webform solution may be
    easier as the response will not need to be saved. However, if you would like to
    track applications, you may want to use a CCK node that could be extended to track
    the entire interview and hiring process.


    If you do choose to store applicant information, make sure that it is adequately
    protected, to prevent the disclosure of confidential information. You may want
    to consider creating a separate site that is available only to employees for personnel
    information.


    # Loyalty rewards


    Loyalty rewards are a great way of encouraging customers to become repeat customers,
    and to have them return to your store over and over again. Loyalty rewards programs
    typically offer free or reduced-price merchandise after a specific number or value
    of purchases have been made by a customer.


    Although there are companies that will administer rewards programs for you, you
    can also administer the program yourself via your web site.'
  merge: -1
  img_proc: true
- pgno: 329
  md: <!-- no content -->
