    # Managing sign-ups


    *Good Eatin'' Goal:* Generate a list of all of the users who have signed up for
    a newsletter, and demonstrate how to remove suspicious users.


    *Additional modules needed:* Simplenews (http://drupal.org/project/simplenews).


    # Basic steps


    After customers have begun to sign up for your newsletter, you can view a list
    of all existing subscriptions by selecting **Content management** and then **Newsletters**
    from the **Administer** menu, and finally on **Subscriptions**. Drupal will display
    a page similar to the following image:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_193_0.png)'
