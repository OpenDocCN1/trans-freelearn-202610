- pgno: 188
  md: '# 6


    # Newsletters and Calendars


    In this chapter, we will add new features which will allow Chef Wanyama to keep
    his customers informed of current events at Good Eatin''.


    We will provide two new means of communication. The first feature is a quarterly
    newsletter that customers can subscribe to. The newsletter will contain valuable
    information from Chef Wanyama including coupons, news, recipes, and more.


    The second feature is a calendar that will help customers learn about upcoming
    events at the Good Eatin'' restaurant.


    # Creating newsletters


    A newsletter is a great way of keeping customers up-to-date without them needing
    to visit your web site. Customers appreciate well-designed newsletters because
    they allow the customer to keep tabs on their favorite places without needing
    to check every web site on a regular basis.


    # Creating a newsletter


    Good Eatin'' Goal: Create a new newsletter on the Good Eatin'' site, which will
    be contain relevant news about the restaurant, and will be delivered quarterly
    to subscribers.


    Additional modules needed: Simplenews (http://drupal.org/project/simplenews).


    # Basic steps


    Newsletters are containers for individual issues. For example, you could have
    a newsletter called Seasonal Dining Guide, which would have four issues per year
    (Summer, Fall, Winter, and Spring). A customer subscribes to the newsletter and
    each issue is sent to them as it becomes available.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '1. Begin by installing and activating the Simplenews module, as shown below:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_189_0.png)


    At this point, we only need to enable the Simplenews module, and the Simplenews
    action module can be left disabled.


    2. Next, select Content management and then Newsletters, from the Administer menu.
    Drupal will display an administration area divided into the following sections:


    +   a) Sent issues

    +   b) Drafts

    +   c) Newsletters

    +   d) Subscriptions


    3. Click on the Newsletters tab and Drupal will display a page similar to the
    following:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_189_1.png)


    As you can see, a default newsletter with the name of our site has been automatically
    created for us. We can either edit this default newsletter or click on the Add
    newsletter link to create a new newsletter.'
  merge: -1
  img_proc: true
