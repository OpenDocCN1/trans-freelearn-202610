- pgno: 163
  md: '# Table view


    The Table view displays all of the results of the survey in a single, easy to
    read format, as shown in the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_163_0.png)


    # Download view


    The Download view allows you to download all of the survey responses into a comma-delimited
    file, which can then be opened in a program such as Microsoft Excel, for further
    analysis.


    # Clear


    Clicking on the Clear link will remove all of the survey responses from the site.
    This can be useful if you are testing the survey and want to restart, or if you
    want to restart the survey at the beginning of each month.


    # Summary


    In this chapter, we explored various methods of soliciting feedback from visitors
    to your site, including comments, ratings, polls, and surveys. Using these techniques
    will help you to improve the products and services you provide to your customers.


    In the next chapter, we will create a company blog to allow Chef Wanyama to promote
    his restaurant to interested readers. We will also load feeds from other web sites
    into the Good Eatin'' site, to leverage content from other sources.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 5


    # Creating a Company Blog


    A blog is a series of typically short postings that are displayed in reverse chronological
    order. Blogs normally allow users to comment on each posting. With a regularly
    updated blog or blogs, you can ensure that your site always has fresh content,
    which ensures that both visitors and the search engines keep coming back.


    In this chapter, we will create a blog where Chef Wanyama can discuss the Good
    Eatin'' restaurant, cooking, the restaurant business, and more. He plans to use
    the blog to make the site more interactive and to draw search engine traffic.


    Each employee will also be given the opportunity to have his or her own blog,
    where they can create blog entries if they so choose. Employee blogs will be monitored,
    and posts will be added to an approval queue before they are released to the public
    at large.


    Finally, we will demonstrate how users can view the blogs using RSS feeds and
    add related blog posts to their own blogs.


    # Creating blogs


    In this section, we will discuss how to set up the blog module so that a user
    can create blogs. We will demonstrate how Chef Wanyama creates blog posts, and
    will look at ways at ways to moderate blogs and use alternate editors to build
    the blog.


    # Setting up the blog system


    Good Eatin'' Goal: Set up the blog system, so that Chef Wanyama can begin posting
    to the blog.


    Additional modules needed: Blog (core).'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Basic steps


    +   1. Activate the blog module within the **Module Manager**.

    +   2. Drupal will allow any user with the `create blog entries` permission to
    create a blog. To make it easier to control who can create blogs, we will create
    a new role called blogger. To build a new role, click on **User management** and
    then **Roles**.

    +   3. Enter **blogger** as the role name and then click **Add role**, as shown
    below:

    +   4. Once the role has been created, click on the **edit permissions** links,
    so that we can define what this role can do. We will select the following settings
    as follows:


    | Name | Operations |

    |---|---|

    | anonymous user | locked edit permissions |

    | authenticated user | locked edit permissions |

    | VIP user | edit role edit permissions |

    | blogger | Add role |


    | Permission | blogger |

    |---|---|

    | blog module | |

    | create blog entries | ☑ |

    | delete any blog entry | ☐ |

    | delete own blog entries | ☑ |

    | edit any blog entry | ☐ |

    | edit own blog entries | ☑ |


    These settings will allow users to maintain their own blog, but not modify anyone
    else''s blog.


    # Adding a new blog post


    Good Eatin'' Goal: Demonstrate how Chef Wanyama will add new posts to his blog.


    Additional modules needed: Blog (core).'
  merge: -1
  img_proc: true
