- pgno: 111
  md: '# Adding Products and Services


    # Basic steps


    +   1. We will start by clicking on the **Create content menu**. Drupal will now
    open the same list of possible content types that we saw when we built our static
    pages in Chapter 2. However, now our new Menu Item type is also available.

    +   2. Click on **Menu Item** and Drupal will present you with a form based on
    the custom fields that we have created.

    +   3. Complete all of the fields for the new content type, and then click the
    **Save** button.

    +   4. Once the Menu item has been created, the default display will look like
    this:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_111_0.png)


    # Customizing the display of the menu item


    Although the default view works for some content types, most of the time you will
    want to customize the look of your content type so that it is clear and appealing
    to visitors.


    We can improve the display of this menu item to make it more compact and remove
    information that is not relevant to most visitors, such as who submitted the content,
    and when it was created. We will discuss various ways of doing this in this section.


    # Modifying the order of fields and the titles of the menu item


    *Good Eatin'' Goal:* Customize how the fields of our menu item content type are
    displayed, to maximize usability for our visitors.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Additional modules needed: CCK.


    # Basic steps


    The most basic customization you can do is provided by the CCK module. This module
    allows you to control how each field is labeled, and the format used to display
    it.


    To use the basic display customization, edit your content type and then click
    on the Display fields link at the top of the screen. Drupal will then display
    a screen similar to the one shown below:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_112_0.png)


    You can customize whether labels are above the value, on the same line as the
    value, or not displayed at all. You can also customize how the content is formatted
    in the Teaser and Full node. The Teaser display is used when multiple items are
    displayed on the same page, and the Full node is used when the item is displayed
    on its own.


    If you need additional customization for your content type, you can theme the
    content or use content templates.


    # Advanced customization with content templates


    Good Eatin'' Goal: Discuss the possibilities that are offered by Content Templates.


    Additional modules needed: Content Templates (http://drupal.org/project/contemplate).'
