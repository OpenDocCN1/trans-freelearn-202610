    # Building an index for our vocabularies


    *Good Eatin'' Goal:* Create an index of the meals that Good Eatin'' serves, based
    on the key ingredients in each meal.


    *Additional modules needed:* Taxonomy VTN (http://drupal.org/project/taxonomy_vtn).


