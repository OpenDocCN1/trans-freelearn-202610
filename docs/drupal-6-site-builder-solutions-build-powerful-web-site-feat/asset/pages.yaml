- pgno: 246
  md: '# # Freebies and Downloads


    In this chapter, we will explore various ways of adding downloads to your web
    site to provide free content, or to deliver paid content to users. We will also
    discuss the automatic conversion of pages to PDF files, which your users can download
    to read or print.


    Free content is a fantastic way of building customer loyalty. Depending on the
    content that you provide, you can also keep your brand in front of people. For
    example, a simple tastefully-done screen saver or desktop background can be used
    to always keep your logo on your customers'' desktop. Of course, you need to make
    sure that the free content is of the highest possible quality to ensure that the
    customers will actually use the content.


    Many visitors want to print content or save it to their computers for later use
    when they are not online or are not working on their computers. We will build
    PDF files automatically, to give your visitors this convenience.


    If you allow visitors to download content from your site, you need to be careful
    that your site security is solid, so that an unscrupulous user cannot download
    content that you don''t want them to have access to. We will discuss how to protect
    your content in this chapter.


    # ## Adding downloads and PDFs to the web site


    In this section, we will discuss how to add downloads and PDFs to the web site.


    # ## Controlling how files are downloaded


    *Good Eatin'' Goal:* Ensure that Drupal has full control over any files that are
    uploaded, so that we can specify who can download the files.


    *Additional modules needed:* None.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Basic steps


    Drupal allows you to set downloads to either Public or Private. The public setting
    does not have any additional download security. The private setting allows Drupal
    to secure and manage the downloaded files.


    You can control this functionality using the File system settings, which are available
    by selecting Site configuration and then File system, from the Administer menu,
    as shown in the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_247_0.png)


    Because we want Drupal to provide additional security for the downloaded files,
    we will select the Private setting and then save the configuration.


    You can also control where the files are stored on the web site, and also specify
    a temporary location to be used while files are being transferred. In most cases,
    the defaults are acceptable. However, you may need to customize the directories
    depending on how your server and site are configured. If you are using the private
    download method, the File system path should not be accessible via a web browser.
    To ensure that a directory is not available via a web browser, you should choose
    a folder that is not located within the Drupal installation. It should also not
    be located within your root web folder. On most systems, the root web folder is
    named htdocs. If you are unsure what your root web folder is, ask your webhost.
    Some hosting companies do not allow you to create folders outside the root web
    folder. If this is the case, you can contact your host to see if they can make
    an exception, or you will have to use the public download method.'
  merge: -1
  img_proc: true
- pgno: 248
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 249
  md: '5. To add a file to the page, expand the File attachments section. The section
    appears as follows:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_249_0.png)


    6. You can now Browse for the file to be uploaded, and then once you have selected
    it, click Attach.


    7. After a file has been attached, it will be listed on the form as shown below:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_249_1.png)


    8. After you save the new page, users with the appropriate permissions will be
    able to download the file by clicking on the link. You can also add links within
    the text of a page.


    # Sending the correct file types to a user


    Good Eatin'' Goal: Ensure that the correct file type is sent to the browser so
    that the visitor''s computer can accurately determine how to handle it.


    Additional modules needed: File MIME (http://drupal.org/project/filemime).


    # Basic steps


    As you add files to your site for download, it is important to make sure that
    a visitor''s browser knows how to display the file. With web sites, this is done
    by setting the MIME type for the file. Some common MIME types are:


    +   - text/html: A standard web page


    +   - text/csv: A comma-delimited file'
  merge: -1
  img_proc: true
- pgno: 250
  md: '+   - `text/plain`: Plain text with no formatting

    +   - `audio/mpeg`: Audio mpeg1 and mpeg2 files

    +   - `audio/mp4`: Audio mp4 files

    +   - `image/jpeg`: JPEG encoded image files

    +   - `image/gif`: GIF encoded images

    +   - `application/pdf`: A PDF document

    +   - `application/javascript`: A script file written in Javascript


    A full list of how Drupal handles each file type can be found at:


    `http://api.drupal.org/api/function/file_get_mimetype`.


    The **File MIME** module automatically detects the type of file based on the file
    extension, and sets the appropriate MIME type, which is returned to the browser.


    To use the File MIME module, carry out the following steps:


    +   1. Download, install, and activate the **File MIME** module.

    +   2. Configure the module by selecting **Site configuration** and then **File
    MIME**, from the **Administer** menu. The module allows you to specify the location
    of the `mime.types` file, which is installed along with your web server. The Apache
    web server installs this file in the same directory as where your `httpd.conf`
    file is installed.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_250_0.png)'
  merge: -1
  img_proc: true
- pgno: 251
  md: '3. You can also add additional mappings for specific file types. For example,
    you may want .csv files to be treated as Microsoft Excel files if you know that
    a significant number of your users are running Windows-based machines and want
    to download .csv files into Excel. You can do this by adding the following line
    to the settings, as shown in the preceding screenshot:


    ```

    application/vnd.ms-excel csv xls.

    ```


    4. After the module has been properly configured, the module will automatically
    set the correct MIME types each time that a file is downloaded.


    # Forcing a file to be downloaded


    Good Eatin'' Goal: Force a file to be downloaded even if it could be displayed
    within the browser.


    Additional modules needed: File Force (http://drupal.org/project/file_force).


    # Basic steps


    In the previous section, we discussed setting the MIME type automatically so that
    the browser can handle the file correctly. However in some cases, you may want
    the file to always be saved to the user''s computer, even if it is a common file
    type that can be read by the browser. For example, you may want to have PDF files
    or pictures to be downloaded to the customer''s computer even though all modern
    browsers can display these types of files in the browser.


    To use the File Force module, download, install, and activate it.


    The File Force module does not require any configuration, so you can begin using
    it immediately. To use the File Force module, you simply need to prefix any link
    to downloadable content with the text download. So, if you have a link called:


    ```

    /sites/default/files/song.mp3

    ```


    that you want users to always download, you would replace the link with /download/sites/default/files/song.mp3.
    File Force will then modify the information returned to the browser to indicate
    that the file should be downloaded rather than be displayed or played.


    ```

    /download/sites/default/files/song.mp3

    ```


    If you do not add the download prefix to the link, the File Force module will
    not change the behavior of downloads, so you can offer files either as downloads
    or as play-now links.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Tracking download counts


    Good Eatin'' Goal: Track how many downloads have been completed, so that we can
    gauge the effectiveness of our promotions.


    Additional modules needed: Download Count (http://drupal.org/project/download_count).


    # Basic steps


    If you want to be able to determine the effectiveness of your downloads, you should
    track how many times each file has been downloaded. The Download Count module
    is specifically designed to help you with this.


    +   1. To begin with, download and install the Download Count module.

    +   2. The Download counter can be configured by selecting Site configuration
    and then Download counter, from the Administer menu.

    +   3. The most important configuration is defining which file extensions should
    be included in the download counter, and which should be ignored.


    Ignoring certain file extensions


    Excluded file extensions:

    jpg jpeg gif png

    This module only considers files that have been uploaded with the upload module
    and that become file attachments. However, if you are using a contributed module
    to upload images and display them in the body of nodes, these files may get flagged
    as downloaded whenever a visitor or robot views the node page, because strictly
    speaking they are file attachments. This will happen with the module img_assist.
    Note that this won''t happen with the module imce, because imce treats inline
    images as nodes. If you do not want to set a download counter for image files,
    list their extension here. Separate extensions with a space and do not include
    the leading dot. For example, you could list these extensions : jpg jpeg gif png.
    If you do not want to exclude any file, leave that field blank.


    Depending on how your site is configured, you may want to either add or remove
    extensions from the list of extensions to be excluded from the statistics.'
  merge: -1
  img_proc: true
- pgno: 253
