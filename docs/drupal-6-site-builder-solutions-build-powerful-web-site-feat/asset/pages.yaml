- pgno: 34
  md: '# Administrator account


    The administrator account has complete access to the site; it will automatically
    be granted all permissions and can perform any administrative activity. This will
    be the only account that can perform certain activities, so keep its credentials
    safe.


    Username: *


    YourSiteAdmin


    Spaces are allowed; punctuation is not allowed except for periods, hyphens, and
    underscores.


    E-mail address: *


    admin@yoursite.com


    All e-mails from the system will be sent to this address. The e-mail address is
    not made public and will only be used if you wish to receive a new password or
    wish to receive certain news or notifications by e-mail.


    Password: *


    ********  Password strength: Low


    Confirm password: *


    ********  Passwords match: Yes


    The password does not include enough variation to be secure. Try:


    +   - Adding both upper and lowercase letters.

    +   - Adding numbers.

    +   - Adding punctuation.


    If you enter a password that is not very difficult to guess, Drupal will warn
    you and provide suggestions for a more robust password.'
