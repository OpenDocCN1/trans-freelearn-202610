    # Using taxonomy to categorize content


    Taxonomy is a powerful way of classifying the content on your site. After the
    content has been classified, you can group or filter the content based on the
    categories that have been set for the content type.


    If you only have a few pages of content, or if you are grouping based on only
    one category, the taxonomy module is probably overkill for your needs. But the
    power of taxonomy is readily apparent if you have hundreds of pages of content
    and complex categorization needs, or when you are classifying content based on
    multiple categories.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'When you define a taxonomy, you can decide whether the terms in the category
    are predefined, or if the editors can add new categories as they add new content.
    It is best to use predefined terms if the terms are well-defined and are not likely
    to change. For example, the Good Eatin'' site will use predefined values for the
    Meal category. Allowing terms to be dynamically added would be very useful if
    the terms change frequently, if new categories can be created, or if the initial
    list of terms is too large for pre-entry to be practical.


    You can also create a hierarchy of terms by relating taxonomy categories to each
    other. For example, if you are categorizing animals by their scientific name,
    you could create categories for Kingdom, Phylum, Class, Order, Family, Genus,
    and Species. Each would relate to the category above it. This allows you to easily
    categorize animals without needing to repeatedly enter the links between the higher
    level categories.


    Drupal uses the following terms to describe its classification system:


    +   - Taxonomy: The highest level of the classification system.

    +   - Vocabulary: A group or category of terms that are used to describe the one
    aspect of a piece of content. Some example categories are: color, size, and genre.

    +   - Term: A specific identifier within a vocabulary. Red, blue, green, small,
    medium, large, action, comedy, and romance are all possible terms.


    # Create a vocabulary for course type


    Good Eatin'' Goal: Build a Taxonomy to store information about what meals an item
    is available for.


    Additional modules needed: Taxonomy (Core).


    # Basic steps


    To create a new taxonomy, you need to ensure that the taxonomy module has been
    enabled in the Module Manager.


    After enabling the taxonomy module, you can create a new taxonomy by using the
    Taxonomy Manager, which can be accessed by selecting Content management and then
    Taxonomy, the Administer menu. Let''s create the vocabularies for our menu item
    content starting with the Course Type vocabulary.'
  merge: -1
  img_proc: true
- pgno: 105
