- pgno: 244
  md: '# Summary


    In this chapter, we have explored a number of ways to integrate your web site
    with sites created by other developers and other companies around the world, either
    by including information from their sites into your site or by publishing information
    from your site to them.


    Including content from other web sites is an extremely powerful way of building
    new content for your web site without having to dedicate hundreds and thousands
    of hours and precious resources on the development of functionalities that have
    already been created by other developers. This allows you to focus on your core
    business and on the development of functionalities that are critical to the success
    of your site.


    In the next chapter, we will discuss various ways of providing free content to
    your visitors, as well as ways of transferring information to them via the download
    of menus, pictures, brochures, or other content.'
  merge: -1
  img_proc: true
