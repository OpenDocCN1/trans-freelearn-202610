    module in the Module manager as shown in the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_198_0.png)


    Activating the Event module will a create a new Event content type. There are
    also several settings that control how events are displayed and how time zones
    are handled.


    +   2. To modify the time zone settings, select Site configuration, then Events,
    and finally Timezone handling, from the Administer menu.'
  merge: -1
  img_proc: true
