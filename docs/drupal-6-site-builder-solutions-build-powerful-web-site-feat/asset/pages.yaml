- pgno: 130
  md: '# 4


    # Interacting With Customers and Visitors


    Chef Wanyama thinks that his food is the best in the city and to make sure that
    his food stays on the top, he is always seeking feedback from his customers both
    when they are in the restaurant, and when they are visiting the Good Eatin'' web
    site.


    In this chapter, we will create a variety of functionalities that will allow the
    site''s users to interact with the web site and help them feel that they are a
    part of the community, in addition to giving valuable feedback to Chef Wanyama.
    We will allow users to register on the web site, comment on content, respond to
    polls, and answer surveys.


    # Working with users


    In this series of tasks, we will explore Drupal''s user functionality, which allows
    you to add users to your site and specify the functionality that they can use.
    We will also discuss the concept of roles, which allow you to create a group of
    permissions that can easily be assigned to users. Finally, we will discuss how
    to assign roles to the users.


    # Allowing user registration


    Good Eatin'' Goal: Allow users to register on the web site so that they can access
    additional content that is not available to unregistered visitors.


    Additional modules needed: None.


    Drupal contains a sophisticated system of user management and permissions that
    allows you to easily control who can access your web site and what they can do
    on the web site.'
  merge: -1
  img_proc: true
