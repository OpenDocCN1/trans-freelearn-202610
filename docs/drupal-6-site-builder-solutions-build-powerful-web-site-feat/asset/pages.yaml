- pgno: 154
  md: '# Viewing poll results


    Good Eatin'' Goal: Demonstrate how Chef Wanyama can view the poll results, and
    show the results of the poll to customers who have already answered the poll.


    Additional modules needed: Poll (core).


    # Basic steps


    Users with the Inspect all votes permission can view a list of all of the votes
    that have been cast for a poll. This is done by viewing the poll and clicking
    on the Votes tab, to list all the votes, as shown in the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_154_0.png)


    This view is useful for ensuring that all votes are legitimate, and for comparing
    votes submitted by registered users and anonymous users. For registered users
    their user name will be displayed; for unregistered users, the IP address of the
    machine from which they submitted their vote will be displayed.


    # Upgrading to Advanced Poll


    Good Eatin'' Goal: Explain some of the differences between Poll and Advanced Poll.


    Additional modules needed: Advanced Poll (http://drupal.org/project/advpoll).


    The Advanced Poll module provides several additional features that do not exist
    in the core Poll module, including: three new types of voting systems in addition
    to the basic poll, enhanced vote management, enhanced time management, write-in
    votes, and improved display.


    The Advanced poll module has not been ported to Drupal 6 as of the time of writing.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Adding user surveys


    User surveys allow more complex methods of querying visitors for information.
    Surveys support multiple questions that are asked at one time and questions that
    require more complex answers than a simple selection between a finite number of
    predefined choices. Chef Wanyama will use the user survey to get more comprehensive
    information about his customers'' dining experience and what they expect from
    the restaurant in the future.


    # Creating a user survey


    *Good Eatin'' Goal:* Add a survey to the Good Eatin'' web site that asks visitors
    for their opinion on the various aspects of the restaurant, including specifics
    about what new food items they are interested in, what their favorite visiting
    times are, how frequently they visit, and so on.


    *Additional modules needed.* Webform module (http://drupal.org/project/webform).


    # Basic steps


    +   1. Install the Webform module on your site, and activate it by using the Module
    Manager.

    +   2. There are several settings provided for controlling the basic aspects of
    the Webform module. These can be accessed by clicking on **Site configuration**
    and then **Webform**. For the Good Eatin'' site, all of the default values are
    acceptable.

    +   3. To build a new Webform, select **Create Content** and then **Webform**,
    from the **Main** menu. Drupal will display a form that allows you to build your
    survey.

    +   4. The first section of the form allows you to enter a title, description,
    and information to be displayed when the user finishes the survey. We will fill
    this form out as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 156
  md: "![](img/b332d58f89551dfc3ae9a7cf47e6a08f_156_0.png)\n\n+   5. The next section\
    \ of the form controls which users should be able to submit the form. The default\
    \ allows anyone to fill out the survey, which is fine for our needs.\n+   \n+\
    \   6. The next section allows you to control whether or not survey results are\
    \ mailed to a user, and if they are mailed, who they should be sent to. We won't\
    \ automatically email survey results, so this section can be left as it is.\n\
    +   \n+   7. We will also disable comments, and set the URL path to the survey.\n\
    +   \n+   8. Finally, we will add a menu item for this form, called **Customer\
    \ Survey** which will appear in our main menu, using the settings shown in the\
    \ following screenshot:\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_156_1.png)\n\
    \n9. Save the form by clicking the Save button."
  merge: -1
  img_proc: true
