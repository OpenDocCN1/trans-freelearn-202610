    +   1. Install and enable the Taxonomy VTN module.

    +   2. There are a variety of options available for the Taxonomy VTN module, which
    can be accessed by selecting **Site configuration** and then **Taxonomy VTN settings**,
    from the **Administer** menu. For the Good Eatin'' web site, the defaults are
    all correct.

    +   3. Once you enable the Taxonomy VTN module, you will have a new menu item
    called **Vocabularies**. When you select this menu item, Drupal will automatically
    display a page similar to the following, which contains one entry for each vocabulary
    that you have created.'
