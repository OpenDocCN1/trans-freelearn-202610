- pgno: 38
  md: '# 2


    # Creating Good Eatin''s Online Presence


    In this chapter, we will set up the fundamental parts of the Good Eatin'' web
    site using the Drupal Content Management System. We will start by building a few
    pages, including the About page and the Home page. We will also discuss how to
    delete and edit pages. After we get comfortable managing content, we will add
    your pages to the navigation system so that customers can easily find all of the
    information that they need. After the navigation has been completed, we will make
    your site look more visually appealing by adding images and slideshows. Finally,
    we will add a theme to your site, based on one of the many themes available on
    the Drupal web site.


    At each step in this chapter, we will point out ways to ensure that your site
    is secure so that hackers and other malicious visitors can''t interfere with your
    business.


    Before we start making any changes, let''s have a look at the default site provided
    by Drupal.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_38_0.png)'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'At the end of this chapter, you will understand the techniques used by the
    vast majority of web sites on the Internet, and your site will look as shown in
    the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_39_0.png)


    # About Good Eatin'': Adding static pages


    This section will describe how to set up an informational page that has static
    text. For our client, this will cover adding the About Good Eatin'' page. We will
    also create a basic menu page which will be changed later.


    # Adding a page


    At the core of every site are pages that don''t change or rarely change. Drupal
    makes it extremely easy to add these types of pages to a web site without having
    any programming knowledge. We will demonstrate these techniques on the Good Eatin''
    site by creating a simple home page and an about page.


    To add a new static page, select the Create Content link from the menu on the
    left most side of the site. You will now be presented with a list of content types
    that Drupal knows how to create. By default, Drupal knows about the Page type
    and the Story type. Most static pages, including our About Good Eatin'' page,
    will use the Page type. However, if you want visitors to be able to comment on
    your pages, or if you are creating a blog-style site, the Story type may be a
    better choice, because comments are turned on by default for this type. We will
    discuss comments in detail in the next chapter.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'To create our About Good Eatin'' page, click on the Page link. Drupal will
    now present you with a form on which you can enter information about the Page.
    You can enter a title that is displayed in the title of the web browser and above
    the content when it is displayed on the site. We used **About Good Eatin''** as
    the title of our page.


    A typical about page will contain the name of the company, the address of the
    company, and a brief history of what the company does. We will use this as a guideline
    when we create our About Good Eatin'' page.


    You can enter information exactly as you do in the word processor of your choice,
    using the enter key to separate paragraphs. Drupal will automatically convert
    the text you enter into correct HTML for display in a web browser. You don''t
    need to worry about learning HTML. However, if you do know HTML, you can use tags
    to format your pages. Refer to the HTML primer sidebar for information on the
    basic tags that Drupal allows the pages to include.


    The text we used for the About Good Eatin page is shown below:


    ```

    ```html

    <em>Good Eatin'' Bistro</em> is a full service restaurant serving

    breakfast, lunch, and dinner daily. Good Eatin'' Bistro was founded in

    2008 by <cite>Mark Noble</cite> to serve as an example website for the

    <strong>Drupal 6 Site Builder Solutions</strong>.


    <dl>

    <dt>Address:</dt>

    <dd>1500 Main Street<br>

    Anytown, CO<br>

    United States of America</dd>


    <dt>Phone:</dt>

    <dd>303-555-5555</dd>

    </dl>

    Hours of operation

    <ul>

    <li>M-F: 8AM - 10PM</li>

    <li>Sat: 7AM - 12PM</li>

    <li>Sun: 8AM - 8PM</li>

    </ul>

    ```

    ```


    # Spicin up your site with simple HTML


    Drupal allows you to use several simple HTML tags to improve the formatting of
    a page. Although HTML can be intimidating at first, it is really quite easy to
    learn and use.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Basic formatting


    These tags allow you to change the appearance of the text when it is displayed
    on your web site. To use one of these tags, simply place the starting tag before
    the text whose style you want to change, and the ending tag when you want to return
    to the previous style. For example, to set the text hello in bold, you would enter
    <strong>hello</strong>. You can nest tags to apply more than one style to a piece
    of text. For example, to bold and italicize the text hello, you enter <em><strong>hello</strong></em>.
    When you apply more than one tag to a piece of text, make sure the pairs of open
    and close tags are correctly nested, and do not overlap.


    | Start Tag | End Tag | Purpose |

    |---|---|---|

    | <em> | </em> | Provide emphasis to a piece of text; this is done by italicizing
    the text. You should use this tag when you want to draw the reader''s attention
    to a particular piece of text. |

    | <strong> | </strong> | Make a piece of text stand out from the rest of the text;
    this is done by bolding the text when it is displayed in a browser. Setting text
    in bold can help readers to quickly scan your page to determine if they want to
    read it in more detail. You should use this tag when a piece of text is more important
    than the remainder of the text. |

    | <cite> | </cite> | This tag is used to indicate a citation from another source;
    this is typically rendered as italicized text. |

    | <code> | </code> | The code tag displays the text using fixed-width characters,
    which allows characters to line up. This greatly aids readability for text where
    the position of characters on subsequent lines is important. |


    # Creating lists


    There are three styles of list that you can create using HTML tags: ordered lists,
    unordered lists, and definition lists. The ordered list, precedes each element
    in the list with a number. The unordered list precedes each element in the list
    with a bullet. The definition list first displays the definition term and then
    indents the definition under the term. To create a list, put the list start tag
    at the beginning of the list, the list end tag at the end of the list, and surround
    each item in the list with list item tags.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '| List Type | Start Tag | End Tag | Element Tag | Example Code | Example List
    |

    |---|---|---|---|---|---|

    | Unordered List | <ul> | </ul> | <li>element</li> | <ul>

    <li>Item 1</li>

    <li>Item 2</li>

    <li>Item 3</li>

    </ul> | • Item 1

    • Item 2

    • Item 3 |

    | Ordered List | <ol> | </ol> | <li>element</li> | <ol>

    <li>Item 1</li>

    <li>Item 2</li>

    <li>Item 3</li>

    </ol> | 1. Item 1

    2. Item 2

    3. Item 3 |

    | Definition List | <dl> | </dl> | <dt>term name</dt>

    <dd>description</dd> | <dl>

    <dt>Address</dt>

    <dd>2500 Main St.

    Anytown, CO

    USA</dd>

    <dt>Phone</dt>

    <dd>303-555-5555</dd>

    </dl> | Address

    2500 Main St.

    Anytown, CO

    USA

    Phone

    303-555-5555 |


    # Linking to other pages


    You can use the <a> tag to create a link to another part of your site or to another
    web site. This tag is slightly more complicated than the other tags because you
    must specify the destination that you would like the user to be taken to when
    the link is clicked.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'The link tag has the following format: `<a href="destination">Link Text</a>`.
    For example, to link to the Good Eatin'' home page, we would use the following
    tag:


    ```

    ```html

    <a href="http://goodeatin.drupalbyexample.com">Good Eatin'' Bistro</a>

    ```

    ```


    # Editing a page


    After you have created a page, you can change the text on the page at any time
    by editing the page. To edit a page, first open the page in your browser, and
    then select the Edit link that appears next to the title of the page.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_43_0.png)


    Drupal displays a form that is similar to the form we used when adding the page
    to the site.


    # Security considerations


    You can control who is allowed to add pages to your web site by using permissions.
    By default, only the administrator is allowed to create pages and stories. If
    you are working on the site with a team, it is a good idea to create new roles
    which give team members access to only the functionality that they need to do
    their jobs.


    Let''s create an editor role so that other people in our team can add pages to
    our site. To create a new role, click on **User Management** and then **Roles**,
    within the **Administer** menu. Type **editor** as the name of the role and click
    the **Add role** button. Now that we have a new role, we can assign permissions
    to it by selecting the **edit permissions** link. The permissions you set will
    depend on what the user needs to do to perform his or her job and how much you
    trust the user. In most cases, it is best to give users fewer permissions in the
    beginning, and then give them additional privileges as they become more familiar
    with the site.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'For our site, we will give the editor the following permissions, which are
    located below the **node module** heading:


    +   - **Create page content:** Allows the user to create pages for the site

    +   - **Edit own page content:** Allows the user to edit pages they have created,
    but not pages created by other users


    A full list of permissions for creating and editing content is shown here:


    | Permission | anonymous user | authenticated user |

    |---|---|---|

    | **node module** |  |  |

    | access content | ✓ | ✓ |

    | administer content types | ☐ | ☐ |

    | administer nodes | ☐ | ☐ |

    | create event content | ☐ | ☐ |

    | delete any event content | ☐ | ☐ |

    | delete own event content | ☐ | ☐ |

    | delete revisions | ☐ | ☐ |

    | edit any event content | ☐ | ☐ |

    | edit own event content | ☐ | ☐ |

    | revert revisions | ☐ | ☐ |

    | view revisions | ☐ | ☐ |


    If you trust the users who will become editors, you could also give them the privilege
    to edit any page content, which would give them the ability to edit pages created
    by other users. If you are using Drupal 5, be careful when deciding which pages
    a user can edit because allowing a user to edit a page will also allow them to
    delete it.


    If you choose to use other content types such as the **Story** type, you will
    need to assign permissions to these as well.


    We will discuss additional permissions in future sections, so don''t worry if
    you don''t know what they all mean now.


    # Creating Clean URLs


    Due to technical issues with how Drupal creates and displays pages, the default
    path for a page looks like this:


    ```

    http://www.yoursite.com?q=node/1

    ```'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'This format can be confusing to visitors because it is more difficult to type
    and because it is not as familiar. Some search engines will also not index anything
    that comes after a question mark in a URL. This effectively makes your site have
    only one page in the eyes of some search engines. You can convert these to standard
    URLs by using Clean URLs. This will make the same page''s path as follows:


    ```

    http://www.yoursite.com/node/1

    ```


    In Drupal 6 and later versions, you can set up Clean URLs during the installation
    process. If you are still using Drupal 5 or if you did not configure Clean URLs
    during installation, you can access this setting by clicking on Site Configuration
    and then selecting Clean URLs from the Administer menu.


    To enable Clean URLs, your site must first pass an automated test. In Drupal 6
    and later versions, this is done during installation and when the Clean URLs configuration
    page is loaded. In Drupal 5, you must click on the Run the clean URL test link
    on the Clean URLs test page. If your setup meets the requirements, you can click
    on the enabled link to correct the URLs.


    If your setup does not meet the requirements, there is a wealth of information
    on the Drupal site at: http://drupal.org/node/15365 that will help you determine
    why, and correct any issues. If you continue to have trouble setting up Clean
    URLs, you may need to contact your site host.


    # Street presence, setting up the home page


    In this section, we will create the home page for the Good Eatin'' web site. We
    will cover two possible styles of home pages. The first displays short snippets
    of text called teasers from other portions of the web site. This type of page
    is typically used on news sites and blog sites. The other type of home page is
    a more static page which contains its own unique content. This type of page is
    typical of most web sites.


    # Blog style home pages


    The first page that most visitors to your site will see is the home page. Drupal
    makes it very easy to control the appearance and content of the home page.


    By default, Drupal uses a blog style format, in which a portion of several other
    pages are displayed on the home page. Drupal calls the part of each page that
    is displayed a teaser.


    The teaser is automatically created by Drupal according to the Post Settings,
    which can be accessed from the Administer menu by clicking first on Content management
    and then on Post Settings. From this page, you can easily control how many posts
    will be displayed on the home page, and also how long the teasers will be.'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'In Drupal 6 and later, you can easily control how much of the page is used
    for the teaser. First, open the page in the editor, position the cursor where
    you want the teaser to be separated from the rest of the content and click the
    **Split summary at cursor** button. To accomplish the same functionality in Drupal
    5, you need to add a comment with the text `<!--break-->` as follows:


    This is a sample page with a teaser break


    ```

    <!--break-->

    ```


    More information after the teaser.


    To add content to the home page, you must select the **Promoted to front page**
    checkbox in the **Publishing options** section when saving the page.


    # Creating a traditional home page


    Although a blog style home page is appropriate for some sites, for the Good Eatin''
    web site, we want a more traditional page which will allow us to direct visitors
    to the most important parts of our site.


    The first step in creating a traditional home page is to create a static page
    that will serve as the foundation for our home page. We will create the page in
    exactly the same way as we created the about page.


    When you create a home page, you should introduce the visitors to the products
    or services that you offer and make it easy for them to find their way around
    the remainder of the site. A typical visitor will spend only 20–30 seconds on
    a page before deciding if he or she wants to explore the site further or move
    on to another site. So a clear presentation of what differentiates you from your
    competitors is imperative.


    For the initial home page, we enter the text as shown here:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_46_0.png)'
  merge: -1
  img_proc: true
- pgno: 47
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Change the Default front page to make it the path of the page you have created
    and, then click Save configuration to complete the changes. You can also add a
    site slogan, site mission, and a message that will be displayed at the bottom
    of all of the pages on the site.


    # Other home page ideas


    Another type of home page that is used occasionally is a Flash-based home page
    which displays a short video to visitors before they access the actual site. Although
    this technique can be great for certain sites where the use of video or music
    is the key to the web site, it is normally not a good idea for informational sites
    to use this option, because some visitors may turn off Flash, and some search
    engines may have a hard time indexing Flash-based pages.


    If you want to use a Flash-based home page, the Front Page module allows you to
    create custom home pages. The Front Page module is described in detail on the
    Drupal web site at: http://drupal.org/project/front.


    The Splash module will also allow you to display a different page prior to displaying
    your main web site. More information on the Splash menu can be found on the Drupal
    web site at: http://drupal.org/project/splash.


    # Getting around: Setting up navigation


    As your site gets larger and more complex, you will need to ensure that visitors
    can easily find what they are looking for. With traditional web site development,
    managing navigation is among the most difficult, time consuming, and error prone
    tasks. Fortunately, Drupal handles the details of maintaining the navigation system
    for us, so we can concentrate on making sure that the navigation structure makes
    sense and is easy for the user to understand.


    # Building menus


    The primary way to organize content in Drupal is by using menus. The Drupal menu
    system organizes content in a simple outline, where a page can be nested under
    another page. Drupal handles the expansion and collapsing of menus to hide menus
    that aren''t immediately relevant to the user. This helps to keep the menu short
    and also ensures that the visitor can easily understand your site layout. You
    can also create multiple menus for the site. For example, many sites will have
    a main menu that is displayed on the left-hand side of the screen, and a smaller
    menu that is displayed at the top of the page and that lets the visitor jump to
    a specific section of the web site.'
  merge: -1
  img_proc: true
- pgno: 49
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 50
  md: <!-- no content -->
  merge: -1
