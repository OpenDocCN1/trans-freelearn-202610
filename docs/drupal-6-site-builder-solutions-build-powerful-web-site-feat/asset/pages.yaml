- pgno: 182
  md: '# Automatically updating your feeds with cron jobs


    Good Eatin'' Goal: Set up a cron job to automatically read the news feeds at regular
    intervals and update the Good Eatin'' site.


    Additional modules needed: None.


    # Basic steps


    We can manually update each feed by clicking the update items link in the Feed
    Aggregator Manager. However, it can be time consuming and error prone to have
    to do this for each feed, once a day, or more frequently. Drupal allows you to
    automate the process of updating the feeds by using cron jobs.


    A cron job is an automated task that runs at specific intervals. The cron job
    is activated by navigating to http://yoursite.com/cron.php. Each module that has
    been activated can run tasks every time the cron job is started. Even if you are
    not using the Aggregator, you should set up cron because Drupal uses the cron
    job for maintenance tasks, and many other modules use cron to perform maintenance.


    The method of setting up a cron job depends on the operating system that you are
    using. If you are running a control panel on your web server, such as cPanel or
    Plesk, you may be able to configure the cron job from within the control panel.
    In all cases, you will be instructing the operating system to automatically load
    the http://yoursite.com/cron.php page on your web site at specific intervals.


    # Setting up a cron job in Unix or Linux


    To use a cron job in Unix or Linux, you will need either lynx or wget installed
    and available to the user under whom the cron job will run.


    +   1. Login to your server using SSH or another suitable tool.

    +   2. At the command line, type crontab -e to edit your crontab file.

    +   3. Add a new line to the file using the following format.

    +      mm hh dd MM ww command

    +      where:

    +      mm: is the minute at which the command should be run (0-59)

    +      hh: is the hour to run the command should be run (0-23)

    +      dd: is the day of the month on which the command should be run (1-31)

    +      MM: The month of the year in which the command should be run (1-12)

    +      ww: The day of the month on which the command should be run (0-6), where
    0 is Sunday'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'To specify every available interval for a field, use * for the field.


    To specify multiple values for a field, separate them with commas.


    To specify a range of values, separate the start and end values with a hyphen.


    +   4. Save the file.


    For example, to run cron every 15 minutes, every day of the week using wget enter:


    ```

    0,15,30,45 * * * * /usr/bin/wget -O - -q http://yoursite.com/cron.php

    ```


    To run cron twice a day at 10am and 7pm Monday to Friday using lynx, enter:


    ```

    0 10,19 * * 1-5 /usr/bin/lynx -source http://yoursite.com/cron.php

    ```


    # Setting up a cron job in Windows


    Windows uses **Scheduled Tasks** to run tasks at specific intervals.


    +   1. Open the Scheduled Tasks dialog by selecting **Start | All Programs | Accessories
    | System Tools | Scheduled Tasks.**

    +   2. Click **Add Scheduled Task**, to open the Scheduled Task Wizard.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_183_0.png)'
  merge: -1
  img_proc: true
