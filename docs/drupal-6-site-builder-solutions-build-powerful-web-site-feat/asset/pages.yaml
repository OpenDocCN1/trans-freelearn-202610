- pgno: 197
  md: 'It is highly recommended that you send a test newsletter before you send it
    to the entire subscription list to prevent errors in the final newsletter. The
    test address defaults to the administration email address for your site. You can
    change the test address on the Simplenews Settings page, which is accessed by
    selecting Site configuration and then Simplenews, from the Administer menu. The
    available settings are shown in the following screenshot:


    Test addresses

    Supply a comma-separated list of email addresses to be used as test addresses.
    The override function allows to override these addresses in the newsletter editing
    form.

    Email address:

    admin@drpalbyexample.com

    Allow test address override


    +   4. When you are satisfied with your issue, click the Save button.


    +   5. After you have sent a test email and checked that it was delivered correctly,
    you can send the newsletter to the full list of subscribers by editing your draft
    and then changing the Newsletter sending options to Send newsletter.


    +   6. Once the newsletter has been scheduled to be sent, it will be sent to a
    portion of the subscriber list each time that cron is run. This is done to avoid
    flooding the network. You can configure the number of emails that are sent each
    time that cron is called by editing the Mail backend settings for the Newsletter,
    which is accessed by selecting Site Configuration and then Simplenews from the
    Administer menu. The available settings are shown in the following screenshot:


    Mail backend options

    Use cron to send newsletters

    When checked cron will be used to send newsletters (recommended). Test newsletters
    and confirmation emails will be send immediately. Leave unchecked for testing
    purposes.

    Cron throttle:

    20

    Sets the numbers of newsletters sent per cron run. Failure to send will also be
    counted.

    Mail spool expiration:

    Immediate

    Newsletter mails are spooled. How long must messages be retained in the spool
    after successfull sending. Keeping the message in the spool allows mail statistics
    (which is not yet implemented). If cron is not used, immediate expiration is advised.

    Log emails

    When checked all outgoing simplenews emails are logged in the system log. A logged
    email does not guarantee that it is send or will be delivered. It only indicates
    that a message is send to the PHP mail() function. No status information is available
    of delivery by the PHP mail() function.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'By default, only 20 emails are sent each time that cron is run. This is fine,
    if you are running cron frequently, but if you are running it less frequently,
    you may want to increase the number of emails that are sent each time. Some web
    hosting companies only allow a specific number of emails to be sent every hour,
    to help prevent spammers from utilizing their servers. Before sending newsletters
    to large mailing lists, you should check with your host to ensure that you comply
    with their policies.


    # Adding a calendar


    A calendar is a fantastic way of keeping customers coming back to your site and
    your business at regular intervals so that they can take advantage of specials,
    sales, and other time-limited events.


    We will create a basic event calendar, which displays information about musical
    concerts, special events, and more, for the Good Eatin'' restaurant.


    # Adding new events to the calendar


    Good Eatin'' Goal: Create an event that will be displayed on the calendar.


    Additional modules needed: Event (http://drupal.org/project/event).


    # Basic steps


