- pgno: 214
  md: '# Buzzword Compliance:

    Whisking in Some Web 2.0


    Now that we are comfortable with building content, we will begin to add more content
    that is developed and maintained on other web sites. Some of this content will
    be built by you, while some may be created by other people in your community,
    or even across the world.


    You may wonder why you would want to store content on another site that you don''t
    have control over, especially when we have shown that it is so easy to build content
    with Drupal. Although you do give up some control, there are several great reasons
    to use some of these resources:


    +   1. Bandwidth can be expensive. If your site is popular and makes heavy use
    of large pictures, or videos, you can easily exceed your monthly bandwidth limits.
    By storing the pictures and video on someone else''s server (possibly for free),
    you avoid overage charges.

    +   2. Their servers are better than yours. The servers that are used to store
    and serve the pictures and videos are typically best-in-class servers. Because
    they are used to store data from many different people, the actual cost is spread
    out, so you don''t have to pay the full cost.

    +   3. You can leverage the work of other community members to help you build
    and maintain the content. This is especially important if you have a lot of content
    that regularly changes, or you want to collect content that other people have
    created. For example, if you want to offer pictures of your town, you can use
    Flickr to store the pictures, and also link to pictures that other people have
    taken and posted on Flickr. Please make sure that you have permission to use the
    images before linking to them, though!'
  merge: -1
  img_proc: true
- pgno: 215
  md: '4. By allowing the third-party site to maintain the content separately, you
    can also leverage any enhancements that they make to the technology of their site.
    The sites we describe linking to are all very large and actively maintained. They
    also tend to have new functionality released frequently, which could be difficult
    and expensive to do on your own.


    # Online cooking class


    In this section, we will add video content from YouTube that demonstrates various
    cooking techniques used at the restaurant.


    # Embedding a YouTube video with a filter


    *Good Eatin'' Goal:* Add videos that are stored on YouTube to an existing page.


    *Additional modules needed:* Video Filter (http://drupal.org/project/video_filter).


    # Basic steps


    YouTube (www.youtube.com) is a popular video sharing site where you can view videos
    that have been created and submitted by people across the globe. YouTube allows
    you to link to videos stored on their site so that you can share them with your
    own visitors, without incurring bandwidth charges. In fact, you can even earn
    revenue from the videos if you have a Google AdSense account.


    To insert a video into a page, we will use the following process:


    +   1. Install and activate the **Video Filter** module.

    +   2. We now need to build a new input format that will process the filter. To
    do this, select **Site configuration** and then **Input formats**, from the **Administer**
    menu.

    +   3. Click on the **Add input format** link.

    +   4. We will name the input format YouTube and allow only administrators to
    use this format. Depending on your site''s needs, you will need to decide who
    should be able to use the input format. Just make sure that anyone with access
    to this format will comply with your site''s terms and not link to videos that
    you wouldn''t want on your site.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '5. Finally, enable the **Video Filter** filter and **Save the configuration**.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_216_0.png)


    6. We can now use the new input format in a new page. We will create the page
    by clicking on **Create content** and then on **Page**.


    7. We will title the new page **Cooking Classes**, and enter a description as
    follows:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_216_1.png)'
