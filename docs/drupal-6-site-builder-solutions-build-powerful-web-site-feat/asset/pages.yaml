- pgno: 17
  md: '# What this book covers


    *Chapter 1* introduces you to Drupal and the Good Eatin'' web site, our fictional
    client for this book. We will download and install Drupal onto our web server
    and perform the basic setup of the site.


    In *Chapter 2*, we will begin building the content of our web site, and set up
    the navigation system. Then, we will add images and slideshows to the site. Finally,
    we will install a custom theme for our site to change the overall appearance of
    the site.


    In *Chapter 3*, we use CCK and views to create the restaurant''s menu, showing
    the items available at each meal. We will also use Taxonomies to categorize the
    content in the menu.


    In *Chapter 4*, we will invite our customers to interact with the site by leaving
    comments, rating content, filling out polls, and answering surveys.


    In *Chapter 5*, we build a company blog so that customers can easily get timely
    updates from our company. We also integrate content from blogs on other web sites.


    In *Chapter 6*, we create a calendar to display current events at the Good Eatin''
    restaurant. We will also build a newsletter so that we can deliver information
    straight to our customer''s inboxes on a regular basis.


    In *Chapter 7*, we integrate content from several popular web services including
    Flickr, YouTube, and Google Maps, to enhance our site. We will also discuss publishing
    our site to social networking sites such as Digg and del.icio.us.


    In *Chapter 8*, we will add downloadable content to our site, including PDF files
    and other freebies. We will also discuss ways of automatically generating printable
    content and PDF files from our pages so that customers can save any content they
    want for future use.


    In *Chapter 9*, we set up a take-out menu for our restaurant and allow customers
    to place orders online and pay for them at our e-commerce site.


    In *Chapter 10*, we will discuss how to maintain your site including backing up
    files, optimizing your site, and updating the site when new versions of Drupal
    and custom modules are released.


    In *Chapter 11*, we explore ways of adapting the techniques that we have learned
    in this book to a variety of other types of businesses. We also discuss outsourcing
    your web site development to a professional, and leveraging the knowledge you
    gained in this book to ensure that you get the site you want for the best possible
    price.'
  merge: -1
  img_proc: true
- pgno: 18
  md: "# What you need for this book\n\nTo follow along with the examples in this\
    \ book, you will need a computer which can run MySQL and PHP, which are prerequisites\
    \ for Drupal. Luckily, every major operating system can run these applications.\
    \ You may want to create an account with a web site hosting company to test your\
    \ work, although, you can also use a regular desktop or laptop computer.\n\nYou\
    \ will also need the Drupal Content Management system which is available from\
    \ Drupal.org. We will discuss downloading and installing Drupal in Chapter 1.\n\
    \n# Who is this book for\n\nThis book is designed primarily for business owners\
    \ who want to create a new web site for their company, or upgrade a company web\
    \ site to a site that is easier to maintain and has advanced capabilities. However,\
    \ technical users will also find the book useful, as we will explore a wide variety\
    \ of modules that are used to build web sites with Drupal.\n\nPrevious experience\
    \ with web site development or programming languages is not required, although\
    \ it is helpful to have basic computer skills.\n\n# Conventions\n\nIn this book,\
    \ you will find a number of styles of text that distinguish between different\
    \ kinds of information. Here are some examples of these styles, and an explanation\
    \ of their meaning.\n\nCode words in text are shown as follows: \"To create a\
    \ list, put the list start tag at the beginning of the list, and the list end\
    \ tag at the end of the list.\"\n\nA block of code will be set as follows:\n\n\
    ```\n<div class=\"GMapEZ GSmallMapControl\" style=\"width: 600px; height: 480px;\"\
    >\n  <a href=\"http://maps.google.com/maps?q=111%20Main%20Street, %20Parker,%20CO\"\
    ></a>\n</div>\n```\n\nWhen we want to draw your attention to a particular part\
    \ of a code block, the relevant lines or items will be made bold:\n\n```\n<a href=\"\
    #original\" class=\"ZOOM\">Original Location</a>\n```"
  merge: -1
  img_proc: true
