  md: '3. Next, click on the edit permissions link to set up the permissions for our
    moderator role. The only permission that is needed to publish the blog posts is
    administer nodes, as shown in the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_168_0.png)


