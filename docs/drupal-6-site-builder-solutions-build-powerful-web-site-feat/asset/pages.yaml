- pgno: 264
  md: '# Summary


    In this chapter, we reviewed some methods of making the most out of the downloadable
    content. As long as you provide high quality downloadable content, your customers
    will appreciate getting something useful from you. In return, you receive the
    opportunity to market to your customers.


    The amount of downloadable content for a site will vary depending on the goal
    of the web site, as well as the requirements of the visitors to the site.


    We have also discussed automatic creation of PDF files for offline use as well
    as for printing. This is a great way of allowing your users to make use of the
    site even when they are not actively browsing the site, online.


    In the next chapter, we will create a take-out menu that our customers can order
    from and then pay for their orders online.'
  merge: -1
  img_proc: true
- pgno: 265
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Online Orders and Payments


    A common goal for many business web sites is to integrate their web site with
    their store, take reservations, and accept payments.


    For example, a retail store may allow customers to browse their store inventory
    and then purchase items either for delivery or for pick-up at the store. A salon
    may allow patrons to view appointment times that are available, select a time
    for their appointment, and optionally pre-pay for their appointment online.


    For the Good Eatin'' site, we will allow customers to view a take out menu, select
    items that they want to purchase, and then pay for the order online. After an
    order has been submitted, the order will be sent via an email to the kitchen staff
    so that they can begin preparation of the order. The order will also be available
    for viewing online.


    # Take-out ordering


    To expand its services, Good Eatin'' is adding a take out menu that will allow
    patrons to select from a special menu which is available for pick-up. After the
    patron places the order, they can either pay for it online or in the store. The
    order is sent to the kitchen where the food is prepared. When the patron arrives
    at Good Eatin'', their hot meal is ready and waiting for them to take home to
    their family.


    # Setting up the shopping system


    Good Eatin'' Goal: Set up the system that will allow visitors to purchase take-out
    from the web site.


    Additional modules needed: Ubercart (http://drupal.org/project/ubercart).'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Basic configuration


    In order to utilize an e-commerce solution within a web site, you must either
    build a solution from scratch or use a ready-made solution. Because building a
    professional e-commerce solution from scratch would take an entire book and weeks
    or months to build, we are fortunate to have Ubercart, which is a professional
    quality e-commerce solution tailor-made for Drupal.


    To begin using Ubercart, download and install the module. To use Ubercart, you
    will also need to install the Token module, which can be downloaded from http://drupal.org/project/token.
    We will begin by installing the Cart, Order, Product, Store, and Conditional actions
    modules. There are a variety of other modules that can be optionally enabled.
    We will explore some of these in future topics.


    Ubercart installs a new menu within the Administer menu called Store administration,
    which includes the options shown in the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_267_0.png)


    To begin using Ubercart, we will need to edit the Configuration settings, which
    are shown in the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_267_1.png)'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'Clicking on the **Store settings** link allows you to configure several options
    that control how information on the site is displayed, as well as specify some
    basic contact information for the site.


    # Name and contact information:


    +   - Store name is *not set*.

    +   - Store owner is *not set*.

    +   - Store e-mail is *not set*.

    +   - Store phone number is not set.

    +   - Store fax number is not set.

    +   - Store address is:


    # Display settings:


    +   - Store admin page display type:

    +     Dashboard with collapsed submenu links

    +   - Customer billing address used in lists.

    +   - Footer using random message.


    # Format settings:


    +   - Default currency: USD

    +   - Currency format: $1,234.56

    +   - Weight format: 36 lb.

    +   - Date format: 08/18/2007


    # Reporting settings:


    +   - Version information is being reported to Ubercart.org.


    To edit the settings for a section, click on the title of the section. On the
    **Store settings** page, we simply need to update the **Name and contact information**
    for the store.


    If your store is not located in the United States, you will also need to modify
    the **Format Settings**. The **Country settings** will also need to be changed
    if you are not in the United States or Canada.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Permissions


    You should also create a role for store administration, by clicking on User management
    and then Roles. We will call our role Store Administrator.


    | Name | Operations |

    |---|---|

    | anonymous user | locked edit permissions |

    | authenticated user | locked edit permissions |

    | blogger | edit role edit permissions |

    | VIP user | edit role edit permissions |

    | Store Administrator | Add role |


    Click Add role to finish building the role. After the role has been added, click
    the edit permissions link for the role to define the permissions for the new role.


    Ubercart includes several sections of permissions, all of which start with uc_,
    including:


    +   - Store permissions


    | Permission | Store Administrator |

    |---|---|

    | uc_store module | |

    | administer store | ☑ |

    | view customers | ☑ |

    | view store reports | ☑ |'
  merge: -1
  img_proc: true
