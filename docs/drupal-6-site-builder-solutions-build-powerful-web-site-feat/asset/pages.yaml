- pgno: 119
  md: '# Basic settings


    Now that we have defined which content types will be displayed, we can set up
    various items that control the display of the view in the Basic Settings section.


    +   1. We will begin by modifying the title of the view, by first clicking on
    the link next to the title label. Change the title to Good Eatin'' Menu.

    +   2. Next, we will modify the display method by clicking the link next to the
    Row Style within the Basic settings.

    +   3. The Fields option will only display selected fields in a table style format.
    The Node option will display either an entire node or just the teaser for the
    node. For our view, the Node option is a better choice. Select Node and click
    Update to save your changes.

    +   4. The Use pager and Items to display settings control whether the items are
    displayed on a single page, or whether they are broken up into multiple pages.
    Because most people expect a menu to be displayed on a single page, we will leave
    these settings as their defaults.

    +   5. Some additional settings that you may want to set for your view are the
    Header, Footer, and Empty text settings, which allow you to add text before and
    after the main content, and to substitute text if no content is shown in the view,
    respectively.


    # Adding an argument to control meal display


    In order to display menus for each meal independently, we will add an argument
    to the view. This will allow us to specify a specific meal that is to be displayed
    on each page.


    +   1. Click on the + symbol next to the Arguments link, and Drupal will display
    a list of all of the available arguments, as shown in the screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_119_0.png)'
  merge: -1
  img_proc: true
