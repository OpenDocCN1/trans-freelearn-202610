- pgno: 51
  md: '# Creating Good Eatin''s Online Presence


    The **Menu settings** section allows you to control the text that will be displayed
    for this page when visitors view the menu, the Parent under which this page will
    be displayed, and a weight that controls the position of this page in the list.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_51_0.png)


    For the **Home Page**, set the **Menu link title** to Home, the **Parent item**
    to **<navigation>** and the **weight** to -7. Click save to update the menu and
    you will be able to see the **new menu** in the side navigation. Repeat the process
    for the **About Page**, and this time set the **Menu link title** to About Good
    Eatin'', the **Parent item** to **<navigation>** and the **weight** to 7.


    The parent item controls which menu item this page will be shown beneath. Children
    are independent underneath the parent items. If we look back to the first section
    of the menu we want to ultimately create, the parents and children as follows:


    +   1. **Home Page:** Parent is <Navigation>, no children.

    +   2. **Food:** Parent is <Navigation>, children are Breakfast, Lunch, and Dinner.

    +      a) Breakfast: Parent is Food, no children

    +      b) Lunch: Parent is Food, no children

    +      c) Dinner: Parent is Food, no children'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'You should now be able to see both the Home and About Good Eatin'' pages in
    the Navigation menu. If you log out and then view the site, or view the site in
    a different browser, you will see only the Home and About Good Eatin'' items in
    the Navigation menu.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_52_0.png)


    # Creating custom menu items


    To create custom menu items, you will need to use the Menu manager. This can be
    accessed by clicking on the Administer link, then the Site building link and finally
    the Menus link. You can also access the page directly by navigating to admin/build/menu.
    The Menu manager is shown in the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_52_1.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Once the Menu manager has opened, select the menu you want to edit. Because
    we have already done the Navigation menu, we will work on the Primary Links menu
    and add our home page and the About Good Eatin'' page. By default, the Primary
    Links page appears as follows, because we have not created any menu items yet:


    Primary links List items Add item Edit menu


    To rearrange menu items, grab a drag-and-drop handle under the Menu item column
    and drag the items (or group of items) to a new location in the list. (Grab a
    handle by clicking and holding the mouse while hovering over a handle icon.) Remember
    that your changes will not be saved until you click the Save configuration button
    at the bottom of the page.


    There are no menu items yet.


    To add a custom menu item, click on the Add item menu. Drupal will present you
    with a form where you can enter information about the menu item. This information
    includes:


    +   - Path: This indicates the path which will be loaded when the user clicks
    on the menu item

    +   - Menu link title: This is the text that will be displayed when the visitor
    views the menu

    +   - Description: This allows you to give the visitor additional information
    when the visitor hovers over the menu item about what will happen if the visitor
    clicks on the item

    +   - Enabled: This indicates whether or not the visitor can access the menu item;
    you can disable the menu item rather than delete it if a page is temporarily removed
    from the site

    +   - Expanded: The expanded option controls whether or not a visitor can automatically
    see items that are contained within this one

    +   - Parent item: This works exactly like adding a page to a menu and defines
    the link that this menu item will be displayed under

    +   - Weight: This is used to control how the menu items are sorted when they
    are displayed by Drupal'
  merge: -1
  img_proc: true
- pgno: 54
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 55
  md: 'To use the editor, click down on the 4-pointed arrow icon to the left of the
    menu item name and , still holding down the mouse button, move the item to the
    required position in the list. The display of the menu will automatically change
    as you move the item up or down. By using the graphical editor, you do not need
    to worry about the relative weights of the menu items and when you move an item,
    the remaining items are automatically renumbered as necessary. You can also change
    the nesting of menu links by dragging the item to the left or the right. This
    allows you to easily and intuitively change the parent of the menu item.


    If you are using Drupal 5, you will need to manually control the order of items
    within the menu by assigning a relative weight to each item within the menu. Although
    the concept of weights is used frequently within Drupal, it may not be familiar
    to you. When items are displayed in a list, Drupal sorts them according to their
    specified weight weight prior to displaying them. This causes the items with a
    negative weight to be closer to the top of the list, and items with a high weight
    will to be closer to the bottom of the list. If two items have the same weight,
    they may be displayed alphabetically, chronologically, or randomly depending on
    the list being displayed. Each level of a menu contains separate weights, so you
    don''t need to worry about using a limited number of weights for a potentially
    unlimited number of menu items. However, if you find yourself running out of weights,
    take another look at your design to see if there is a better way of organizing
    the content. Most visitors will have a hard time in quickly understanding the
    various options, so simplifying your content will also help your customers.


    When you manually define weights for items in a list, it is a good idea to leave
    gaps between the numbering, so that you can easily insert new items without having
    to re-order all of the existing items. For example, if you have four items to
    sort, you could use the numbers -6, -2, 2, and 6 for the weights of each item.
    When you want to insert a new item between items 2 and 3, you could use a weight
    of 0 and won''t need to reorder any of the other items.


    # Deleting a page from the menu


    Deleting a page from the menu is extremely easy. If you added the menu while editing
    the page, simply re-edit the page, select the Delete this menu item checkbox and
    save the page.


    If you created the menu item using the Menu manager, you will also need to delete
    it using the Menu manager. Simply find the menu item that you want to delete in
    the Menu manager and click the delete link. You cannot delete system menu items.
    However, you can disable system menu items to prevent them from being displayed,
    by deselecting the Enabled checkbox for the menu within the Menu manager.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Security considerations


    Drupal handles the security aspects of menus and ensures that a menu item is only
    shown to a visitor if they have the permission to visit the page to which the
    menu item points.


    It is important that you test your menus in the same way as each type of user
    can access the site. Because our site is new, this simply means that we need to
    test it by logging in once as administrator and again as an unregistered user.
    An easy way of doing this is to open the web site in two different web browsers,
    for example Firefox and Internet Explorer. You can use one web browser to develop
    the site as an administrator, and the other to test the site as it will be accessed
    by other types of users.


    # Version differences


    If you are still using Drupal 5, the Menu manager is slightly different to the
    Menu manager in Drupal 6, although the core functionality is still the same. In
    Drupal 5, the Menu manager displays all of the menus with their menu items on
    a single page. Drupal 6 and later presents each menu on its own page, which makes
    managing the menu much more intuitive.


    Drupal 5 also has fewer weights available for ordering menus. In Drupal 6 and
    7, the weights range from -50 to +50, but in Drupal 5 the weights range from -10
    to +10.


    Drupal 6 also introduced drag-and-drop ordering of the menus, which is a fantastic
    time-saver especially if you have a large menu.


    # Enabling modules


    The functionality that we have used so far is included in the default installation
    of Drupal and you don''t need to do anything special to use it. However, the real
    power of Drupal is unleashed when you begin enabling the optional modules that
    are included with Drupal, and when you install custom modules.


    The Drupal installation includes over 20 modules, some of which are not enabled
    by default. These modules may be disabled by default for several reasons. Some
    are disabled because they are not needed by every Drupal installation, or they
    may require extra configuration, or they may have an impact on performance. There
    are also several optional modules that are enabled by default because they are
    used by a majority of sites. However, if your site doesn''t need the functionality
    they provide, you can disable them.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'You can view a complete list of modules that are available on your site by
    selecting **Site building** and then **Modules** from the **Administer** menu.
    This page gives you a list of all of the currently-installed modules, and allows
    you to enable or disable them. The listing for each module includes a short description
    of the module, along with information about what other modules are required. If
    you try to enable a module that depends on disabled modules, Drupal will prompt
    you to see if you want to enable the required modules that are currently disabled.


    If you want more information on a specific module, the Drupal site contains a
    lot of information on each module. Information on all of the core modules is available
    at `http://drupal.org/handbook/modules`.


    To enable a module, select the **Enabled** checkbox next to the module, and then
    click the **Save Configuration** button. If you enable multiple modules at the
    same time, Drupal will take care of enabling the modules in the correct order
    and checking any dependencies for you.


    After a module has been enabled, the **Administer** menu will be updated with
    **new configuration options** for the module. There may also be new permissions
    for the new module. Check the documentation for the module to learn more about
    how to configure the module.


    # # A page by any other name: Using aliases


    When visitors return to your site, it will help them to have a meaningful path
    for each page. This will help them to be able to type in the URL for the page.
    A clear path can also help search engines understand what your page is about.


    Unfortunately, the default paths that are created for each page are in the format
    **node/#**, where # is a unique identifier for the page. This can be confusing
    for visitors and certainly won’t help you with the search engines. However, Drupal
    offers a solution through the use of **page aliases**. A page alias allows you
    to access a page using a different URL. There is no limit to the number of aliases
    you can assign to a page, but in most cases, you will want only one additional
    path for any given page.


    To create an alias, you must enable the **Path** module. After the Path module
    is enabled, Drupal will add a new section called **URL path settings** to the
    edit form when you edit a page. For example, edit the **About Good Eatin''** page
    and then open the **URL path settings** section. Enter **about-good-eatin** for
    the **new path**. When creating paths, it is good practice not to use spaces in
    the path and to separate words with either hyphens (-) or underscores (_). The
    hyphen may be better for search engines as some search engines may treat words
    separated with underscores as a single word. You should not use spaces because
    they are not technically allowed in URLs. Most browsers will translate any spaces
    to %20, but you may run into compatibility issues.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'After you have created an alias, you can use the alias to create menus and
    build other links.


    # Creating multiple aliases for a page


    Sometimes a single path for a page is not enough. For example, if you are migrating
    to Drupal from an old site, you will probably want to alias the old pages to use
    the new paths, so that visitors and search engines using the old paths can still
    find your information. This is possible for any page on your old site which is
    accessed with simple URLs that do not have extra query information. For example,
    the URL www.oldsite.com/home_page.html can be aliased, while the URL www.oldsite.com/home_page.html?a=Hello
    cannot be.


    If you want to create more than one alias, you need to click on Site Building
    and then on URL aliases, in the Administer menu. You can create a new alias by
    selecting the Add alias link. Drupal will open a form where you can enter the
    "real" path and the alias of the path. The "real path" is the existing system
    path on the site. For our home page, this is node/2. The path alias is another
    name that you would like to use to access the page. For the home page, we can
    use home.


    # Automatically creating page aliases


    If your find yourself creating new aliases for pages that follow a defined format,
    you can use the Pathauto module to automatically build aliases for you. More information
    on this is available at: http://drupal.org/project/pathauto.


    # Deleting a page


    If you decide that a page is no longer relevant to your site, you can remove it
    from your web site. There are two ways of doing this. You can either unpublish
    the page or completely delete the page.


    Unpublishing the page will prevent the visitors from viewing the page, but the
    page will still be stored within Drupal, so it can be republished later if the
    content becomes relevant again. To unpublish a page, edit the page and then click
    on the Publishing options link. This will expand the Publishing options section.
    Simply deselect the Published checkbox and then save the page. Drupal will ensure
    that the page is removed from all of the menus so that unauthorized visitors can''t
    view it.


    If you want to return to the page later, you will either need to type in the URL
    for the page or you can find the page via the content manager, which can be accessed
    at yoursite.com/admin/content/node. This page can also be reached from the Administer
    menu by selecting Content Management and then Content.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The other method of removing a page from your site is by deleting it. If you
    delete a page, it will be completely removed from the site and cannot be recovered.
    To delete a page, edit the page and then click the **Delete** button at the bottom
    of the page. You will be asked to confirm that you really want to delete the page.
    If you click on the **Delete** button again, the page will be completely removed
    from your site. If you change your mind in between clicking the two **Delete**
    buttons, you can select the **Cancel** link.


    # Leveraging the help of others: Installing custom modules


    We have already discussed enabling core modules to add functionality to your site.
    In addition to the optional core modules, many developers from across the globe
    have contributed modules with custom functionality to Drupal. Custom modules add
    support for a wide range of functionalities, including:


    +   - Integration with third-party websites such as YouTube, Amazon, and Flickr

    +   - Administration assistance, including backing up your site, maintaining your
    database, and tracking site usage

    +   - Creation and display of custom content

    +   - Product sales and advertising


    If you want to add a specific piece of functionality to your site, the chances
    are that there is already a module available that does just what you need. A complete
    list of modules can be found at: `http://drupal.org/project/Modules`.


    The modules that are available depend on the version of Drupal you are using.
    The Drupal site tells you which versions of Drupal each module is compatible with,
    and also allows you to filter the available modules based on your version of Drupal.


    Custom module development typically lags Drupal development by a few months, and
    many modules will not be ported to the very latest version until it is generally
    released. For that reason, you may want to wait to migrate to the latest version
    of Drupal until all of the modules that you use have been ported to the latest
    version. Although most custom modules are actively maintained by developers, you
    may find some modules that are not being actively maintained by the original developer.
    If this is the case for a module you want to use, you can take over the development
    process yourself, have a developer modify the custom module for you, or sponsor
    additional development of the module. The Drupal site offers a forum dedicated
    exclusively to companies who want custom development done. You can find the forum
    at: `http://drupal.org/paid-services`.'
  merge: -1
  img_proc: true
- pgno: 60
  md: "To install a custom module, you will need to carry out the following steps:\n\
    \n+   1. Find the module you want to install, on the Drupal web site. As an example,\
    \ we will download the Image Module, which is available at `http://drupal.org/project/image`.\n\
    +   \n+   2. Download the version of the module that corresponds to the version\
    \ of Drupal you are using. As you can see from the following image, a module may\
    \ have multiple releases. The official releases should be used for production\
    \ web sites. Development snapshots can be used for test purposes. You should use\
    \ the version that is recommended for your version of Drupal. We are using Drupal\
    \ 6 for the Good Eatin' site, so we will download that version by clicking on\
    \ the **Download** link.\n\n| Official releases | Date | Size | Links | Status\
    \ |\n|---|---|---|---|---|\n| 6.x-1.0-alpha1 | 2008-Apr-13 | 35.77 KB | Download\
    \ · Release notes | Recommended for 6.x |\n| 5.x-2.0-alpha1 | 2008-Apr-13 | 40.2\
    \ KB | Download · Release notes | Supported for 5.x |\n| 5.x-1.8 | 2008-Apr-13\
    \ | 133.95 KB | Download · Release notes | Recommended for 5.x |\n\n| Development\
    \ snapshots | Date | Size | Links | Status |\n|---|---|---|---|---|\n| 6.x-1.x-dev\
    \ | 2008-Apr-18 | 136.5 KB | Download · Release notes | Development snapshot |\n\
    | 5.x-2.x-dev | 2008-Apr-22 | 137.82 KB | Download · Release notes | Development\
    \ snapshot |\n| 5.x-1.x-dev | 2008-Apr-22 | 134.01 KB | Download · Release notes\
    \ | Development snapshot |\n\n+   3. After you have downloaded the module, you\
    \ need to expand it. Drupal modules are stored as gzipped `.tar` files. If you\
    \ are using the Windows operating system, you probably don't have a program to\
    \ open these files and you need to download one. 7-Zip is a freely-available program\
    \ that will allow you to open these files. You can download 7-Zip from `http://www.7-zip.org/`.\n\
    +   \n+   4. If you use 7-Zip, you will need to first extract the `.tar` file\
    \ and then extract the files from it. After you have done this, you will have\
    \ a group of files that make up the module. For the image module, these files\
    \ will be located in a folder named `image`.\n+   \n+   5. Now that you have the\
    \ module expanded, you will need to upload it to your web site using FTP. This\
    \ is similar to uploading the installation files for Drupal. When you upload the\
    \ module, you should upload the entire folder to `sites/all/modules`. If this\
    \ is the first module that you have added, you will need to create the modules\
    \ directory."
  merge: -1
  img_proc: true
- pgno: 61
  md: '6. The next step is to enable the module. To do this, open the **Module manager**
    in your site. This is accessed by clicking on **Site building** and then **Modules**,
    from the **Administer** menu. As you can see from the following image, a single
    module installation may provide more than one module.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_61_0.png)


    Each module can be enabled independently as long as all requirements are met.
    As you can see, the **Image** module is required by many of the other modules,
    which cannot be enabled until the **Image** module is enabled. We will enable
    only the **Image** module, by selecting the **Enabled** button next to the **Image**
    module and then clicking on the **Save Configuration** button.


    7. After the module has been enabled, you should check the permissions for the
    module to determine if any changes are necessary. This is done on the **Permissions**
    page, which can be accessed by clicking on **User management** and then **Permissions**,
    from the **Administer** menu. As you can see, there are several permissions available
    for the **Image** module.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '| Permission | anonymous user | authenticated user |

    |---|---|---|

    | image module |  |  |

    | create images | ☐ | ☐ |

    | edit images | ☐ | ☐ |

    | edit own images | ☐ | ☐ |

    | view original images | ☐ | ☐ |


    We will allow authenticated users to create images and edit their own images.
    Simply select the checkboxes for these options and then click the Save permissions
    button.


    8. Depending on the module that you install, there may be settings specific to
    the module. You should check for these by clicking on the Administer menu and
    looking for new settings. The majority of the new settings will appear in the
    Site Configuration submenu. However, some settings may appear in other areas.
    The documentation that came with the module will typically describe where to find
    the any required or available settings. In the case of the Image module, there
    are two new sets of settings: the Images settings and the Image toolkit settings.
    Both of these are located in the Site Configuration menu within the Administer
    menu.


    Now that the custom module has been installed, you can use the module to enhance
    your site.


    # Security considerations


    When you add a custom module to your site, you do expose yourself to possible
    security risks. However, the Drupal community does an incredible job of reviewing
    each module for possible security issues, and Drupal core does an excellent job
    of protecting you from potential problems.


    You can further protect yourself by registering on the Drupal web site and subscribing
    to the security alerts newsletter.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Creating Good Eatin''s Online Presence


    # Whetting their appetites: Adding images


    Pictures are a crucial part of any web site because, as the old saying goes, *a
    picture is worth a thousand words*. Pictures also help to draw users into the
    site and give them a reason to explore further. Studies have shown that you only
    have a few seconds to gain a visitor''s interest before he or she navigates away
    from your web site. Stunning images will encourage users to look at the site in
    more detail.


    Drupal offers several methods for inserting images into your web site, ranging
    from the basic use of HTML to using custom modules.


    # Inserting images with simple HTML


    HTML provides the `img` tag to allow web sites to include images on their pages.
    You can use the img tag as follows: `<img src="http://yoursite.com/imagepath/imagename"
    />`. For example, a link to an image on the Good Eatin'' site could be:


    ```

    ```html

    <img src="http://goodeatin.drupalbyexample.com/images/zebra.jpg" />

    ```

    ```


    You can either use double quotes or single quotes around the source, but I found
    that using single quotes typically integrates better with Drupal. You can also
    add size information to the image if you want, by adding `width` and `height`
    attributes to the tag. A tooltip can be added to the image by including a `title`
    attribute. If you need to include a double quote within the title, you should
    use `&quot;` in place of the double quote. If you need to include a single quote
    in the title, you should use `&rsquo;` in place of the single quote.


    If you try editing the home page or the About Good Eatin'' page, and add an image
    to the page, you will notice that it doesn''t show up after you save it. This
    is because Drupal applies filters to your content in order to prevent your site
    from security attacks. These filters are combined into **Input formats**, which
    are applied to the content. Using input formats also helps to simplify content
    management when you have multiple editors with various levels of experience. This
    is because you can give each editor access to different input formats depending
    on their experience.


    To make your image tag visible, you will either need to change the input format
    you are using or create a new format for the page that allows the image tag to
    be displayed.


    If you trust all of your editors not to abuse the formats, the easiest solution
    is to simply change from the **Filtered HTML** format to the **Full HTML** format.
    However, it is much more secure to add a new format that allows images.'
  merge: -1
  img_proc: true
- pgno: 64
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 65
  md: 'To create a new Input format, select the Add input format link. Drupal will
    now open a form to create a new input format. You will need to enter a name for
    the format, and you can also decide which users should be allowed to use this
    input format. This allows you to provide more functionality to users that have
    more experience, or are more trusted. The settings for our new image filter are
    as follows:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_65_0.png)


    After saving the input format, you need to configure the filters so that the image
    tag is allowed. Click on the Configure link and Drupal will display the settings
    for the filters.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Configure Image Format


    Edit Configure Rearrange


    If you cannot find the settings for a certain filter, make sure you have enabled
    it on the view tab first.


    # HTML filter


    # Filter HTML tags:


    +   - Strip disallowed tags

    +   - Escape all tags


    How to deal with HTML tags in user-contributed content. If set to "Strip disallowed
    tags", dangerous tags are removed (see below). If set to "Escape tags", all HTML
    is escaped and presented as it was typed.


    # Allowed HTML tags:


    ```

    <a> <em> <strong> <cite> <code> <ul> <ol> <li> <dl> <dt> <

    ```


    If "Strip disallowed tags" is selected, optionally specify tags which should not
    be stripped. JavaScript event attributes are always stripped.


    +   - Display HTML help


    If enabled, Drupal will display some basic HTML help in the long filter tips.


    +   - Spam link deterrent


    If enabled, Drupal will add rel="nofollow" to all links, as a measure to reduce
    the effectiveness of spam links. Note: this will also prevent valid links from
    being followed by search engines, therefore it is likely most effective when enabled
    for anonymous users.


    To provide better support for adding images to our input format, change the Allowed
    HTML tags to add <img> at the beginning of the text.


    You can now use the input format anywhere, to enter images. To insert the image,
    you will need to:


    +   1. Create a directory on your web server to store the images. To simplify
    site administration and backup, Drupal creates a subdirectory called sites under
    the directory where Drupal is installed. In this directory, there are two subdirectories
    named all and default. This structure is designed to allow multiple sites to utilize
    the same Drupal installation.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Any file contained in the all directory is accessible to all web sites running
    in the installation. Files that relate to a single site should be placed in a
    folder based on the domain of the web site, for example, example.com or goodeatin.drupalbyexample.com.
    If a site-specific folder cannot be found, Drupal will look in the default folder.


    For more information about the sites directory, see the article at:

    http://drupal.org/node/53705.


    +   2. Upload the image to your server via FTP.

    +   3. Verify that the image is accessible by opening a web browser and entering
    http://yoursite.com/sites/yoursite.com/files/images/imagename.jpg as the address.

    +   4. Update your web page to include the img tag with the src set to the address
    you used in step 3.

    +   5. Change the input format to a format that allows the img tag.

    +   6. Save the content and view the page to ensure that your changes are correct.


    If you want to display the image in different sizes depending on where it is installed,
    you will need to manually resize each image to the desired size.


    If you have multiple editors for your site, you will need to provide each editor
    that will enter images images the permissions to send image files to your server.
    This can pose a security risk to your site as the user could update other files
    in addition to the image files.


    # Inserting images using the image module


    Because inserting images manually can be a security risk, as well as a time-consuming
    and error-prone process, the Drupal team created the Image module which allows
    images to be easily added to any page. We have already installed the Image module
    in a previous section, so we can now jump straight into adding images.


    # Creating images


    To create a new image, select the Image link from the Create content menu. Drupal
    will display a form where you can select the image to be added to the site, give
    the picture a Title, and add a description to it.'
  merge: -1
  img_proc: true
- pgno: 68
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 69
  md: 'By default, the image module stores an image in its original size. It also
    creates a thumbnail that is a maximum of 100 pixels on any axis, and a preview
    image which is a maximum of 640 pixels on any axis. When both of these images
    are created, by default the image is scaled proportionally, so the smaller side
    will be less than the maximum. Therefore the final image won''t be square unless
    the original image is square.


    You can create up to three additional image sizes. To create new image sizes,
    select the Site Configuration link and then the Images link, from the Administer
    menu. We will create two new image sizes: a Menu Item List and a Menu Item Large.
    The settings for these new image sizes are as follows:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_69_0.png)


    We will use the first image size to display pictures of food on our menu when
    more than one item is displayed on a page. We will use the second one to display
    pictures of food when only one item is displayed on a page. The Menu Item list
    will also crop the image so that it is square.


    After you have created the new sizes, the images will be automatically regenerated
    when you view them. You can also regenerate the images manually by editing them,
    selecting the Rebuild derivate images checkbox and then finally saving the image.


    # Deleting images


    Deleting an image is exactly the same as deleting a page. Simply edit the image,
    and click on the Delete button. Deleting an image will permanently remove the
    image from your site. If you want to remove it temporarily, you can unpublish
    the image.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Dinner and a show: Adding slideshows to the site


    If you have a large number of pictures, you can display them in a slideshow format,
    where pictures are displayed one after another in a specific order. Pictures in
    a slideshow typically use a fade transition from one to the other. Drupal has
    at least two custom modules that allow you to easily build slideshows — the Slideshow
    Creator module and the Lightbox module.


    # Showing images on the page using Slideshow Creator


    The Slideshow Creator module can be downloaded from http://drupal.org/project/slideshow_creator.
    It also requires the JQuery Plugin module, which is available at http://drupal.org/project/jquery_plugin.
    Download these two modules, install them on your site, and then enable them using
    the Module Manager.


    The Slideshow Creator module does not have any additional permissions that you
    need to worry about. However, there are a few configuration settings:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_70_0.png)


    These options allow you to control the size of the slideshow that will be embedded
    in the page, as well as specify some basic options related to the display.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Slideshow Creator works by creating a new filter that you can add to any input
    format, similarly to how we enabled the use of img tags on a page.


    To enable this filter:


    +   1. Click on the Site Configuration link and then the Input formats link, from
    the Administer menu.

    +   2. Click on the configure link for the input format that you want to add slideshows
    to. We will add slideshow capabilities to our image format.

    +   3. Select the checkbox next to the Slideshow Creator filter.

    +   4. Save the input format.


    You can use Slideshow Creator to either display specific pictures or to display
    all of the pictures that are stored within a specified folder on your web server.
    Displaying specific pictures gives you much more control and allows you to give
    each image a title, description, and the page to be displayed when the image is
    clicked (if any). Displaying all images in a folder is much easier to manage as
    you do not need to add each image to the slideshow individually.


    # Basic steps for inserting a slideshow


    To insert a new slideshow, use the following steps:


    +   1. Upload the pictures that you want to display in the slideshow to your site
    by using either FTP or the Image module.

    +   2. Edit the page that you want to add the slideshow to.

    +   3. Create the slideshow using a filter tag (see the following sections for
    details).

    +   4. Save the page.


    # Setting up a slideshow with individual images


    A slideshow with individual images uses the following format for the filter tag.


    ```

    [slideshow:VERSION, img=|IMAGE_URL|LINK|TITLE|DESCRIPTION|TARGET|, img=|IMAGE_URL|LINK|TITLE|DESCRIPTION|TARGET|]

    ```


    +   - The VERSION should be set to 2 for the current version of Slideshow Creator.

    +   - The IMAGE_URL should be set to the full path to the image that you want
    to display.

    +   - The LINK is the destination you want the visitor to be taken to if they
    click on the picture. You can leave this blank if you do not want the user to
    be able to click on the image.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '+   - The TITLE will be displayed above both the picture and the description.
    It can be left blank if you do not want to display a title.

    +   - The DESCRIPTION is displayed immediately below the title but above the picture.
    This can also be omitted if it is not required.

    +   - The TARGET is used in conjunction with the LINK and describes how the new
    page will be opened when the image is clicked. Valid values are: `_blank`, `_parent`,
    `_top`, and `_self`. The `_blank` option, which is the default, will open the
    link in a new window or tab, depending on the browser. The `_self` option will
    open the link in the same window that the slideshow is being displayed in (and
    will therefore replace the slideshow). The `_parent` and `_top` values are only
    used by sites that use frames.


    Multiple images can be inserted by separating each img section from the previous
    one with a comma.


    The following filter tag is used on the Good Eatin'' home page to display a few
    pictures for the restaurant.


    ```

    [slideshow:2, img=|http://goodeatin.drupalbyexample.com/image/view/3/preview||Elephant
    Smile|This Elephant is one of the many animals you may see as you take a Safari
    through the Good Eatin'' restaurant.||, img=|http://goodeatin.drupalbyexample.com/image/view/4/preview||Zebra
    Friends|Enjoy the sun with these Zebras on a Good Eatin'' Safari meal. ]

    ```


    # Setting up a slideshow to display all images in a folder


    Although creating a slideshow with individual images gives you an enormous amount
    of control over how the slideshow is displayed, it can be very convenient to create
    a slideshow that simply displays all of the pictures in a folder. This type of
    slideshow uses the following filter tag format:


    ```

    [slideshow:VERSION, dir=|DIR_IMAGE|DIR_RECURSIVE|DIR_LINK|TITLE|DESCRIPTION|TARGET|]

    ```


    The VERSION, TITLE, DESCRIPTION, DIR_LINK, and TARGET have the same usage as the
    individual img version, with the exception that the values will be applied to
    each image in the folder. The folder-specific settings are as follows:


    +   - DIR_IMAGE is the folder where the files are located on your web server.
    This path will be relative to the folder where Drupal is installed. Slideshow
    Creator will include all PNG, GIF, JPEG, JPG, and BMP pictures found within this
    folder in the slideshow.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '+   - `DIR_RECURSIVE` can be set to either yes to include images that are within
    the subfolders of the specified image folder or left blank to include only the
    specified folder. In most cases you will leave this blank because it is more convenient
    to organize the pictures for each slideshow in a single folder.


    You can combine `img` groups and `dir` groups within a single slideshow to leverage
    the power of each method to meet your needs.


    When you display all of the images within a folder, the images are displayed in
    random order, and it is not possible to reliably control the order of the display.


    # Additional configuration options


    Slideshow Creator also contains several undocumented features that you can use
    to further customize your slideshows. Some of these allow you to override the
    default settings that are configured via the Administration menu, so that you
    have more precise control over the layout of the slideshows, and you can have
    slideshows with different sizes and layouts on different pages. You can even have
    multiple slideshows on one page, each with different options. The following options
    are available:


    +   - `width`: This allows you to control the width of the slideshow. If an image
    within the slideshow is wider than the specified width, it will be cropped.


    +   - `height`: This allows you to control the height of the slideshow. If an
    image within the slideshow is taller than the specified height, it will be cropped.


    +   - `layout`: This allows you to control the order of the elements (Title, Description,
    Picture, and Controls) in the slideshow. Valid values are Default, Reverse, Top,
    Bottom, and None. These result in the following configurations (elements listed
    as they appear, from top to bottom):


    +   - `Default`: Controls, Title, Picture, Description


    +   - `Reverse`: Title, Picture, Description, Controls


    +   - `Top`: Picture, Title, Description, Controls


    +   - `Bottom`: Controls, Title, Description, Picture


    +   - `None`: Picture, Title, Description


    +   - `blend`: This controls the speed of transition between images. It should
    be set in milliseconds, so to specify 2 seconds you would enter 2000.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   - timeout: This controls how long each image is displayed for, before the
    next image starts loading. This is also set in milliseconds.

    +   - fx: This controls what type of effect is used to transition between slides.
    Some of the available transitions are shuffle, zoom, fade, turnDown, curtainX,
    scrollRight, blindX, blindY, blindZ, cover, and uncover.


    Any of these additional options used should be added before the list of images
    begins. For example, the following code adds a zoom transition effect to the slideshow
    and places the controls for the slideshow, under the pictures.


    ```

    [slideshow:2,width=450,height=650, layout=top, fx=zoom, img=!http://goodeatin.drupalbyexample.com/image/view/3/preview||Elephant
    Smile|This Elephant is one of the many animals you may see as you take a Safari
    through the Good Eatin'' restaurant.|, img=!http://goodeatin.drupalbyexample.com/image/view/4/preview||Zebra
    Friends|Enjoy the sun with these Zebras on a Good Eatin'' Safari meal. ]

    ```


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_74_0.png)


    Additional documentation for the Slideshow Creator Module is available at: http://drupal.org/node/237049.

    Additional documentation for the JQuery Cycle module, which is used to build the
    slideshow, is available at: http://www.malsup.com/jquery/cycle/.


    # Version-specific issues


    The author of Slideshow Creator is currently providing the module only to the
    users of the current version of Drupal (version 6 at the time of writing). If
    you are using another version, you may be able to find a download that is compatible
    with your version, but support may not be available through the original author.


    # Showing images over the page with Lightbox2


    The Slideshow Creator module allows you to view slideshows within a page. However,
    sometimes it looks better to display images in a new window that floats over the
    main page. This is especially true for pictures on a photography or art web site,
    where the pictures are the main focus of the page.


    Showing the slideshow over the main page also improves the appearance of the slideshow
    when all of the pictures are not the same size.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Creating Good Eatin''s Online Presence


    A sample **lightbox** looks like the following picture:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_75_0.png)


    To use the Lightbox2 module:


    +   1. Download the module from the Drupal web site. The project page is located
    at `http://drupal.org/project/lightbox2`.

    +   2. Copy the module to your web site and enable it in the Module manager.

    +   3. Configure Lightbox2 by selecting **Site Configuration** and then **Lightbox
    2**, from the **Administer** menu. Lightbox2 has a large number of settings, divided
    into four sections. Let''s explore each of these.


    # General settings


    The general settings page contains a variety of settings used to control the display
    of the Lightbox. These settings are:


    +   - **Use Lightbox2 Lite:** Enabling this setting will greatly limit the functionality
    of Lightbox2. All controls will be removed, so the visitor will not be able to
    navigate from image to image. This may be desirable if your site gets a large
    amount of traffic, or if you want to ensure that only one image is displayed at
    a time.

    +   - **Use Alternative Layout:** In the normal Lightbox layout, the next and
    previous buttons are overlaid on the image and display only when the mouse passes
    over the link. When the alternative layout is active, the links are always displayed
    and they are placed below the image, alongside the caption. I personally prefer
    to have this option enabled because it is much more user friendly to always show
    the navigation to the user rather than make them search for the controls.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '+   - **Force visibility of navigation links:** Enabling this setting causes
    Lightbox 2 to always display navigation controls.

    +   - **Image Count Text and Page Count Text:** These settings allow you to customize
    the text that is displayed in the caption.

    +   - **Disable Zoom Feature:** This setting will prevent the user from resizing
    the image if the image is larger than the page. Disabling the zoom may make for
    a cleaner Lightbox.

    +   - **Video Settings:** This setting allows you to display videos within the
    Lightbox.

    +   - **Page Specific Lightbox2 Settings:** This setting gives you the ability
    to prevent specific pages from displaying a Lightbox. This is useful if you are
    using custom modules that the Lightbox module detects and automatically attempts
    to display a Lightbox.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_76_0.png)


    # Advanced settings


    The Advanced settings section offers a variety of settings that allow you to fine-tune
    how the Lightbox is displayed on the page. Using these options, you can control
    colors of the Lightbox, how long each transition between images lasts, and whether
    or not the user can see your web site beneath the Lightbox.


    # Slideshow settings


    The Slideshow settings page provides various settings that control the functionality
    of the slideshow. This includes how long each picture is displayed, what should
    happen when the slideshow finishes, and what happens when the user clicks on the
    Next or Previous Image buttons. These options are all well-documented on the settings
    page itself.'
  merge: -1
  img_proc: true
- pgno: 77
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Additional topics


    The Lightbox2 module provides a lot of power, and displaying slideshows is just
    the beginning of what it can do. You can use Lightbox2 to display nearly any type
    of content, including HTML pages, video, Flickr photos, and much more.


    The Drupal site contains a wealth of information about the Lightbox2 module. The
    documentation begins at: http://drupal.org/node/144469.


    # Personalizing the restaurant: Adding themes to the site


    One of the great things about Drupal is that it allows you to thoroughly customize
    the appearance of your web site, rather than force you to build each aspect of
    your design from scratch. Drupal provides several custom themes that can be used
    as-is. You can also use the custom themes as a starting point, and build on them
    to create your own unique theme. A theme is used to give your site a consistent
    look and feel across all pages. Using themes, you can easily change the look of
    your site without changing the actual content of your site. This makes redesigning
    your site much easier (and cheaper) because you only have to modify the theme,
    and you don''t have to edit each individual page.


    You can even have multiple themes set up on your site and allow your users to
    choose to view your site using their favorite theme.


    # Selecting and installing a ready-made theme


    You can find a large list of themes that have been contributed to Drupal at http://drupal.org/project/Themes.
    You can use these themes as inspiration for your own site design, or you can use
    a theme as-is.


    Most themes are shown with a preview image so that you can get an idea of what
    your site will look like using the theme.


    After you have found a theme that you want to try, you can install it on your
    site by carrying out the following steps:


    +   1. Download the theme by clicking on the Download link for the theme.

    +   2. Unpack the gzipped .tar file using the same techniques you have already
    used for unpacking modules.

    +   3. Upload the new theme to your web site by using FTP. The theme should be
    placed in the sites/all/themes directory. If you haven''t added a custom theme
    yet, you will need to create the themes directory.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '4. Open the Theme manager by selecting the Site building link and then the
    Themes link, from the Administer menu. If the theme has been added correctly,
    you will see it in the list of themes shown in the Theme manager.


    5. To enable the theme on the site, select the Enabled checkbox for the theme.
    After enabling the theme, you can set it to be active for a specific user, or
    you can make it the default theme for the entire site. As shown in the following
    image, we will enable the custom Foliage and Marinelli Themes.


    6. The Foliage Theme can be downloaded from http://drupal.org/project/foliage
    and the Marinelli theme can be downloaded from http://drupal.org/project/Marinelli.
    The Marinelli theme also contains two subthemes that control where each column
    is placed.


    | Screenshot | Name | Version | Enabled | Default | Operations |

    |---|---|---|---|---|---|

    |  | Chameleon

    Minimalist tabled theme with light colors. | 6.2 | ☑ | ○ | configure |

    |  | Foliage

    Table-less, source-ordered and multi-column theme. | 6.x-1.3 | ☑ | ○ |  |

    |  | Garland

    Tableless, recolorable, multi-column, fluid width theme (default). | 6.2 | ☑ |
    ○ | configure |

    |  | Marinelli

    A fresh 3-column layout for Drupal. Still usable over 4000m! | 6.x-1.7 | ☑ | ◉
    |  |


    7. After the theme has been enabled, you can configure it by selecting the configure
    link.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Once you have enabled a theme, you can easily switch back and forth between
    themes to decide which theme you like best. If you decide that you don''t like
    a theme, you can remove it by simply deleting the theme files from your web server.


    # Configuring a theme


    The configuration options for a theme will vary depending on the actual theme.
    However, all themes allow you to determine if the following elements are displayed
    or not: logo, site name, site slogan, mission statement, user pictures in posts,
    user pictures in comments, search box, shortcut icon, primary links, and secondary
    links.


    You can also configure the logo that should be used on the site. You can either
    use a default logo or add your own custom logo. If you choose to use your own
    custom logo, you can either specify a path to an existing file on your web server,
    or you can upload a new image.


    You can also configure the shortcut icon that is displayed in the address bar
    when customers visit the web site. Again, you can either use the default icon
    or use a custom icon. This icon is also called the **favicon**, and is also displayed
    alongside the site name in the user''s favorites, if they add it as a favorite.


    If you select the **Global settings** option when you configure the themes, the
    changes will be applied to all of the themes you have installed.


    # Creating themes


    When you create a custom theme, you should carefully consider the structure of
    your site and the content that you intend to display on your site. You should
    also think about the custom modules that you plan to add to your site. By considering
    these items at the beginning, you can plan ahead and ensure that your design is
    flexible enough to accommodate all of your plans.


    After you have planned your theme, you will need to create a graphical design.
    Depending on your budget, you may do this yourself, have a graphic designer do
    it for you, or even hire a large design firm that can create several designs and
    test-market them to find out what your target audience likes best. If you choose
    to outsource your theme creation, you can find a qualified professional via the
    Drupal website at `http://drupal.org/paid-services`.


    After the design is complete, you will need to break the design down into individual
    images and ensure that any dynamic content can be placed over the background images.
    If there are any page-specific images, these will need to be created as well.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'You can now build the css file for your theme, which will control the overall
    look of the page.


    Finally, create your page template, which is typically called page.tpl.php. You
    can also change the appearance of other types of content by creating a template
    file for that content type. For example, a template file named comment.tpl.php
    will control the appearance of all comments within the site.


    For a more complete discussion on creating your own themes, pick up a copy of
    Drupal 6 Themes or Drupal 5 Themes, both by Ric Shreves and both published by
    Packt Publishing. You can find more information about these books at:


    ```

    http://www.packtpub.com/drupal-6-themes/book

    ```


    ```

    http://www.packtpub.com/drupal-5-themes/book

    ```


    # Version-specific issues


    A theme that is created in one version of Drupal is not guaranteed to work in
    future versions of Drupal, because the developers of Drupal have elected not to
    force backwards compatibility to be a constraint on development. This allows new
    development to use best practices to ensure that the latest version of Drupal
    is the best it can technically be. Although this is a fantastic strategy for Drupal
    as a whole, it does mean that you may have to make some modifications to your
    theme after each new release.


    # Playing in the kitchen: Topics to research on your own


    In this chapter, we have covered a lot of ground and thoroughly explored a number
    of topics that are used in several other chapters in this book. As you continue
    to enhance your site, there are a number of areas that you may want to explore
    on your own.


    # Using Image Assist to easily insert images


    The Image Assist module allows you to insert images while you are editing the
    page. This makes adding images much easier. The Image Assist module also works
    automatically with Lightbox2 to create a slideshow of all of the images on a page.


    # Book style pages


    Drupal provides the Book module that is designed for the online editing of books
    that are created by groups of people in a collaborative environment.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Setting up a graphical editor


    There are several graphical editors, also called wysiwyg (what-you-see-is-what-you-get)
    editors that can automatically be opened whenever you create a new page. These
    editors are similar to a word processor embedded in your web site. You can change
    the font of the text by clicking on buttons rather than inserting HTML tags. There
    are several modules that you may want to explore to provide this functionality,
    including:


    +   - TinyMCE: http://drupal.org/project/tinymce

    +   - Tiny Tiny MCE: http://drupal.org/project/tinytinymce

    +   - HTMLBox: http://drupal.org/project/htmlbox


    # Timing the publication of content


    If you have time-sensitive information, you can schedule the content for automatic
    publishing on a specific date and/or at a specific time. You can do this by using
    the Rules module for Drupal 6, which is available at http://drupal.org/project/rules
    or the Workflow-ng module, for Drupal 5, which is available at http://drupal.org/project/workflow_ng.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_82_0.png)'
  merge: -1
  img_proc: true
- pgno: 83
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 3


    # Adding Products and Services


    In the previous chapter, we laid the groundwork for our site and added a few pages
    that are common to nearly all sites on the web. In this chapter, we will use Drupal
    to build a custom content type to store individual items that appear on the Good
    Eatin'' menu. We will also explore different ways of displaying the content, to
    make the menu look its best.


    At the end of this chapter, you will understand how to use CCK to build new content
    types, and how to theme CCK content types to customize the display.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_84_0.png)'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Building the good eatin'' menu with a custom content type


    In this section we will set up a Menu item content type for the Good Eatin'' web
    site. Our menu will contain the name of the dish, a description of the dish, the
    price of the dish, and a picture of the dish.


    # Introduction to the CCK module


    Good Eatin'' Goal: Learn about what the CCK Module offers, and install CCK on
    our site.


    Additional modules needed: CCK (http://drupal.org/project/cck).


    The Content Creation Kit, which is often abbreviated to, CCK is used to develop
    new types of content that can be used throughout a web site. This is a fantastic
    method of building content that fits nicely into a template, and of ensuring that
    all of the content has the same format and all the required fields are filled
    out correctly. Some examples of good content for use with CCK, along with examples
    of possible fields, are:


    +   - Movie: Title, Director, Production Company, Year Released, Rating, and so
    on


    +   - Meeting: Subject, Start Time, End Time, Organizer, Topic, Location, and
    so on


    +   - Book: Title, Author, Year Published, Age Group, and so on


    +   - Home Listing: Address, Price, Number of Bedrooms, Number of Bathrooms, Garage
    Type, Lot Size, and so on


    +   - Shirt: Manufacturer, Style, Price, Color, and so on


    The CCK module has a large number of field types that can be used to build custom
    content types. Some of these types include: Date, Duration, Email, Fivestar ratings,
    Images, Ratings, and Slideshows. Using specific field types when you build your
    new types helps to ensure that the information that is entered is valid. It will
    also help you to view and filter the display as content is added to your site.


    # Installing CCK and CCK field modules


    The CCK module is available for download at: http://drupal.org/project/cck. You
    can download and install the module just like any other module. The base installation
    of CCK includes a wide range of modules that can be individually enabled, as shown
    in the next screenshot:'
  merge: -1
  img_proc: true
- pgno: 86
  md: '| Enabled | Name | Version | Description |

    |---|---|---|---|

    | ☐ | **Content** | 6.x-2.0-beta | Allows administrators to define new content
    types.<br>Required by: Content Copy (disabled), Content Permissions (disabled),
    Fieldgroup (disabled), Node Reference (disabled), Number (disabled), Option Widgets
    (disabled), Text (disabled), User Reference (disabled) |

    | ☐ | **Content Copy** | 6.x-2.0-beta | Enables ability to import/export field
    definitions.<br>Depends on: Content (disabled) |

    | ☐ | **Content Permissions** | 6.x-2.0-beta | Set field-level permissions for
    CCK fields.<br>Depends on: Content (disabled) |

    | ☐ | **Fieldgroup** | 6.x-2.0-beta | Create field groups for CCK fields.<br>Depends
    on: Content (disabled) |

    | ☐ | **Node Reference** | 6.x-2.0-beta | Defines a field type for referencing
    one node from another.<br>Depends on: Content (disabled), Text (disabled), Option
    Widgets (disabled) |

    | ☐ | **Number** | 6.x-2.0-beta | Defines numeric field types.<br>Depends on:
    Content (disabled) |

    | ☐ | **Option Widgets** | 6.x-2.0-beta | Defines selection, check box and radio
    button widgets for text and numeric fields.<br>Depends on: Content (disabled)<br>Required
    by: Node Reference (disabled), User Reference (disabled) |

    | ☐ | **Text** | 6.x-2.0-beta | Defines simple text field types.<br>Depends on:
    Content (disabled)<br>Required by: Node Reference (disabled), User Reference (disabled)
    |

    | ☐ | **User Reference** | 6.x-2.0-beta | Defines a field type for referencing
    a user from a node.<br>Depends on: Content (disabled), Text (disabled), Option
    Widgets (disabled) |


    To use CCK, you will need to enable the Content module, which will allow you to
    create new content types and add custom fields to the new type. You will also
    need to enable the modules that provide the various field types. In the default
    installation, these are:


    +   - **Text:** This allows free form text to be entered

    +   - **Number:** This allows numeric values to be entered

    +   - **Node Reference:** This allows links to other nodes (pages, content types,
    and so on) to be inserted in a type

    +   - **User Reference:** This allows links to users who are registered on the
    web site


    There are also several additional modules, which provide more content types that
    you can install. These can be found on the Drupal site at: `http://drupal.org/project/Modules/category/88`.


    The following modules, which are part of the default CCK module, provide different
    methods of viewing, editing, and administering fields:


    +   - **Option Widget:** This provides checkboxes and option buttons for various
    fields. These can be very helpful if your content fields need to be restricted
    to specific values.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '+   - **Field Group:** This allows you to group fields into logical sections.
    This is especially useful when your content types have a large number of fields.

    +   - **Content Copy:** This allows you to duplicate content easily. This is useful
    if you want to add several items that are similar.

    +   - **Content Permissions:** This gives you fine-grained control over which
    fields can be viewed and edited based on a user''s role. This is especially important
    for sites on which several different types of users work.


    We will enable the **Content**, **Number**, **Text**, and **Option Widgets** modules
    to aid us in creating our menu item type.


    # Designing the menu item


    *Good Eatin'' Goal:* Design a content type to represent meals and drinks which
    are available at the restaurant.


    *Additional modules needed:* CCK (http://drupal.org/project/cck).


    # Basic steps


    When you start designing your site it is a good idea to think about what types
    you will need, and design the types before building them. It is relatively easy
    to add new fields to a type, but if you do so you may need to modify all of the
    existing content, which can be extremely time-consuming.


    Even seemingly simple types, such as an address, require some thought—depending
    on what addresses will be used. For example, if the addresses entered are only
    from the United States, typical fields are Street 1, Street 2, City, State, and
    Zip Code. If the address has to include international addresses, typical fields
    are Street 1, Street 2, City, State/Province, Zip/Postal Code, and Country. If
    the address is only for a single country, state, or city, you can eliminate or
    automatically fill out some of the fields, to make entering information more convenient
    for your editors and users. The types of validation that you do will also depend
    on what expected values can be entered. For example, for truly international sites,
    it is impractical to include every state or province in a drop-down list for users
    to select from. On the other hand, if you know that addresses are only within
    a specific country, giving a list of states or provinces is very easy.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Step 1: Determine how the content type will be used


    The first step in creating a new content type is deciding how the type will be
    used. You need to think about whether there will be a large or small number of
    entries, whether the information will be entered by experienced users, inexperienced
    users, or the general public. You also need to consider where the information
    will be displayed on the site, and in what format.


    By collecting this information at the beginning, you can use it to guide future
    steps.


    # Step 2: Determine what fields need to be included


    Think about what fields need to be included in the content type. You can do this
    in a number of ways:


    +   - Use the fields from an existing paper form

    +   - Use the fields from an existing back end system that the site will interface
    with

    +   - Create fields based on the business process that you are adding to the site

    +   - Brainstorm the possible values with a group of co-workers

    +   - Look at example data to find commonalities, and then create a new field
    for each piece of common data


    If you have tried several methods and still can''t determine what the fields should
    be, you may want to try breaking the type into several separate but related types,
    or hiring a consultant to help you. Alternatively, you may have simply found a
    type that is not a good candidate to be created using CCK.


    Each content type in Drupal automatically contains a field for a title, which
    is a single line of text, and a field for the description, which is a block of
    text. These fields can be renamed or hidden from view depending on your requirements.
    You will find that most content types that you create will use these two fields.


    For our menu item, we will include the following fields:


    +   - The name of the menu item (using the default title field)

    +   - A description of the item (using the default body field)

    +   - The price of the item

    +   - A rating for the item

    +   - Information for with dietary concerns or allergies (gluten free, vegan,
    vegetarian, and so on)

    +   - What meals the item is available for'
  merge: -1
  img_proc: true
- pgno: 89
  md: '+   - The course type of the item (appetizer, first course, second course,
    dinner, dessert, drink, and so on)

    +   - Whether the menu item is available only seasonally

    +   - When the menu item is available, if it is only available seasonally


    # Step 3: Determine what type each field should use and what validation should
    be done


    After you have a list of the fields that you want to include in your new content
    type, you need to think about what information the field will contain, so that
    you can select an appropriate type for the field. You will want to consider whether
    the field contains basic textual information, numeric information, references
    to other content, dates, or some other type of information.


    As you decide what types should be used, you should also consider how long each
    field should be, and whether it should be restricted to specific values, or if
    editors can enter anything they want in the field.


    For our menu item, the fields will use the following types:


    | Field | Type | Validation |

    |---|---|---|

    | Name | Text (single line) | Must be provided, no length requirements |

    | Description | Text (multiple lines) | Must be provided, text should be at least
    10 words long |

    | Price | Numeric (decimal) | Must be a number greater than 0 |

    | Ingredients | Text free form list | This will be a free form list of key ingredients
    that visitors can search or select on. |

    | Dietary Concerns | Text (free form list) | This will be a free-form list of
    possibilities that editors can add to as new allergens are added; it can be left
    blank if there are no allergens for the food |

    | Meals | Text (simple list) | Must be filled out; possible values are Breakfast,
    Lunch, Dinner, Dessert, and Drinks. Multiple items can be included if it is available
    at more than one meal |'
  merge: -1
  img_proc: true
- pgno: 90
  md: '| Field | Type | Validation |

    |---|---|---|

    | Course Type | Text (simple list) | Must be filled out; new values can be added
    by the editor. Default values are: appetizer, first course, second course, soup,
    salad, dessert, and drink |

    | Seasonal | Numeric (true/false) | Must be filled out; default value is false
    |

    | Seasonal Start | Date | Can be left blank if Seasonal is false; can include
    month, date, and year |

    | Seasonal End | Date | Can be left blank if Seasonal is false; can include month,
    date, and year |


    # Step 4: Determine how the fields should be displayed when the user edits them


    When an editor creates or edits your new content type, you can make things easier
    for them by selecting a meaningful control that they use to edit the field. By
    default, CCK only gives you a simple text field that you can use to enter information.
    By enabling the Option Widgets module, you get a selection list, option buttons,
    and checkboxes. Using these optional controls makes selection faster, and easier
    to validate.


    # Step 5: Determine who will be viewing and editing the content type


    In this final step, you need to consider who will enter the content and who will
    view it. This will help you to determine which permissions are to be added for
    each field. If you find that there are several different permissions needed, you
    may need to explore the Content Permissions module which is included in the Core
    CCK installation. This module allows you to set permissions for each individual
    field independently.


    Our menu item type does not need specific permissions for each field.


    # Creating the menu item type


    Good Eatin'' Goal: Build the Menu Item Content Type.


    Additional modules needed: CCK (http://drupal.org/project/cck).


    Now that our Menu item content type has been fully designed, we can begin implementing
    the menu item for the Good Eatin'' web site.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Basic steps


    To create a new content type, we begin at the **Content Type Manager**, which
    is available by selecting **Content management** and then **Content types**, from
    the **Administer** menu. The **Content Type Manager** is shown in the following
    screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_91_0.png)


    Next, click on the **Add content type** tab at the top of the screen. Drupal will
    then display a form that asks for the **Name**, **Type**, and **Description**
    of the new type. We will use the following values:


    +   - **Name:** Menu Item

    +   - **Type:** Menu_item

    +   - **Description:** A Menu item that is included on the restaurant''s menu
    contains information needed to display the item as well as to categorize it for
    use throughout the web site.

    +   - The **Add Content** screen also contains additional options for **Submission**
    requirements, **Workflow** settings, and **Comment** settings.

    +   - The **Submission form** settings section is shown in the following screenshot.
    This section allows you to customize the labels for the **Title** and **Body**
    fields, which we will rename to **Name** and **Description**, respectively. You
    can also control how many words can be entered in the description. If the editor
    enters fewer words, Drupal will display an error and the editor will have to enter
    more words before they can save the entry. By requiring at least 10 words, we
    will help to ensure that our menu items contain complete descriptions, which will
    help our search engine rankings.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '![](img/b332d58f89551dfc3ae9a7cf47e6a08f_92_0.png)


    +   - The **Comment settings** section allows you to control whether or not visitors
    to your site can comment on this type of content. We would like to get feedback
    on our food so we will enable comments for the **Menu Item** type. Most of the
    default settings are perfect for our needs, but we will make some changes to improve
    the display when multiple visitors comment on the same menu item. Change the **Default
    display mode** to **Flat list – expanded**. As we do not expect to have discussions
    between users, there is no reason to group comments based on replies.

    +   - The **Workflow settings** section controls what happens after new content
    has been submitted to the site. As our home page is not automatically created
    from recent postings, we will disable the **Promoted to front page** setting and
    leave all other settings as their defaults. If you want to explicitly approve
    all of the new content, you can disable the **Published** setting. This will cause
    new content to go into a review queue before it is published to the web site.


    # Adding a price to the menu item


    *Good Eatin'' Goal:* To add a field which will store the price of the menu item.


    *Additional modules needed:* CCK (http://drupal.org/project/cck).


    # Basic steps


    Now that we have created the **Menu Item** content type, we can set up the custom
    fields for our type based on the design we did earlier.


    +   1. To create a new field, edit the **Menu Item** by clicking on the **Edit**
    link in the **Content Type Manager**.'
  merge: -1
  img_proc: true
