- pgno: 194
  md: 'You can filter the display to list only specific newsletters, or to list only
    those newsletters that a specific customer has subscribed to. To edit individual
    subscriptions, click on the edit link. This will display a page similar to the
    following:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_194_0.png)


    You can also activate, deactivate, or delete subscriptions by selecting the subscription
    you want to modify, selecting the appropriate action in the Update options drop-down
    list and then clicking the Update button. This allows you to remove malicious
    users who have subscribed to your newsletters. If you receive a significant number
    of invalid sign-ups, you may want to add a Captcha to the sign-up form.


    # Importing subscriptions from an existing list


    Good Eatin'' Goal: Import subscriptions from another list management system that
    was in use prior to you starting to manage your newsletter by using Simplenews.


    Additional modules needed: Simplenews (http://drupal.org/project/simplenews).


    # Basic steps


    If you already have a large list of subscribers to your newsletter, you probably
    wouldn''t want to throw this list away because a good contact list takes time
    to build and can be very lucrative for you.'
