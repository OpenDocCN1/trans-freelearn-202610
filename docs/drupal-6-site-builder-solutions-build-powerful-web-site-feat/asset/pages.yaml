    # # Allow users to browse files


    *Good Eatin'' Goal:* Give users an intuitive interface to see which files are
    available for download, with additional information for each file.


    *Additional modules needed:* Filebrowser (http://drupal.org/project/filebrowser).


    # ## Basic steps


    The filebrowser module allows visitors to easily browse downloadable files on
    your site.


    +   1. Begin by downloading and installing the **filebrowser** module.

    +   2. In order to display a list of files in a directory, we need to create a
    **Directory Listing** page. To do this, first select **Create content** and then
    **Directory listing** from the **Navigation** menu.'
