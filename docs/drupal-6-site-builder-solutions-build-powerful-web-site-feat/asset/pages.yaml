- pgno: 218
  md: 'Additional modules needed: Video Filter (http://drupal.org/project/video_filter).


    # Basic steps


    Now that you can add a single video to your page, you may want to add more videos
    that are displayed in random order, automatically start the video when the page
    loads, or control the size of the video. All of this is possible by using the
    Video Filter.


    To add multiple videos to a filter, you just need to add multiple videos separated
    by commas. For example, you could enter:


    ```

    video:http://www.youtube.com/watch?v=0Q2aPi9ZEgs,

    http://www.youtube.com/watch?v=dTDVKDzVOcg,http://www.youtube.com/watch?v=eV__oOckAPM

    ```


    If you want a video to start automatically, you need to add autoplay:1 to your
    filter separated by a space from the remainder of the filter. For example:


    ```

    video:http://www.youtube.com/watch?v=DqoqFymiGkk autoplay:1

    ```


    To resize your video, you will need to enter the width and height of the video,
    again separated from the remainder of the filter by a space. The filter will ensure
    that the aspect ratio of the video is correct, and that the actual width and height
    are no greater than the sizes you specify. An example appears below:


    ```

    video:http://www.youtube.com/watch?v=BYhrHdvI6m8 width:240

    height:160

    ```


    The final formatting option is to control the alignment of the video on the page.
    Note that you can currently only specify the alignment as being either left or
    right. This is controlled with the align option, as shown below:


    ```

    video:http://www.youtube.com/watch?v=wPhBiu6Sx_w align:right

    ```


    # Enhancing content with the Embedded Media Field


    Good Eatin'' Goal: Integrate a YouTube video into an existing content type instead
    of using a filter.


    Additional modules needed: Embedded Media Field (http://drupal.org/project/emfield).'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Basic steps


    In the last two topics, we explored inserting YouTube videos into existing content.
    But what if you want to add video fields to all instances of a specific content
    type? For example, if you have a content type for a cooking class, you could include
    fields for:


    +   - Class Name

    +   - Class Description

    +   - Class Dates

    +   - Video giving a preview of the class


    In this case, it would be much better to have a specific field for the video rather
    than embedding it into text with a filter.


    Let''s build the example above using the Embedded Media module to add the video
    field.


    +   1. Begin by installing and enabling the **Embedded Media Field** and **Embedded
    Video Field** modules in the Module Manager.

    +   2. We can now create our new content type by selecting **Content Management**
    and then **Content types**, from the **Administer** menu. Finally, click on **Add
    content type**.

    +   3. We will fill out the basic information for the content type as follows:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_219_0.png)


    Click Save content type to save the type.'
