    to create, edit, or delete content, so you need to make sure that you assign this
    permission carefully. After you have selected the desired permissions, click the
    Save permissions button.


    # Setting up moderation for the blog posts


    If you allow many users to post blog entries, it may be useful, when moderating
    the blog postings, to ensure that all posts conform to the standards you set.
    To do this, we will use Drupal''s publishing functionality.


    +   1. We will begin by editing the blog content type by selecting Content management
    and then Content types, from the Administer menu.

    +   2. Then, select the Blog entry content type.

    +   3. Expand the Workflow settings section, and deselect the Published checkbox,
    as shown in the following screenshot:

    +   4. Click the Save content type button to update the blog entry type.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_168_1.png)'
  merge: -1
