  md: '# Basic steps


    Creating a blog post is similar to building content pages.


    +   1. We will start by clicking on the Create content link and then on the Blog
    entry link in the main Navigation menu.

    +   2. Drupal will display a form you can enter the body of the post as well as
    a title for the post, as shown in the following screenshot:

    +   3. Once you are satisfied with the text of your post, simply click Save and
    your new post will be saved.

    +   4. If you would prefer that visitors didn''t comment on a specific post, you
    can disable comments by expanding the Comment settings section of the form and
    selecting the Disabled option.

    +   5. After you have saved the post, the final blog entry will appear as follows:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_166_0.png)


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_166_1.png)


