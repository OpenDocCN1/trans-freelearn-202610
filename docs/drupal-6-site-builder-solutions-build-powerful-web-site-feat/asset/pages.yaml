- pgno: 271
  md: 'If your site has employees, you may also want to create a separate role (or
    several roles) that do not give full control over the store for your employees.
    For example, you may not want an employee to be able to create or delete products,
    but you would like them to be able to take new orders.


    # Blocks


    To make it easier for visitors to your site to see what they have ordered and
    to check out, you can enable the Shopping Cart block using the Block manager,
    which can be accessed by selecting Site building and then Blocks, from the Administer
    menu.


    | Block | Region | Operations |

    | --- | --- | --- |

    | Shopping cart* | Left sidebar | configure |


    These are the basic configuration options which need to be done after you install
    the module.


    # Building the take-out menu


    Good Eatin'' Goal: Create the take-out menu that visitors can order from.


    Additional modules needed: Ubercart (http://drupal.org/project/ubercart).


    # Basic steps


    Now that we have completed the basic configuration of the store, we can begin
    to add products to the store.


    +   1. Products are added to Ubercart from the Product manager, which is accessed
    by selecting Store administration and then Products from the Administer menu.

    +   2. We can now select Manage classes, which will allow us to define the content
    types that are used to build products. We will enter a new class, with the settings
    shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Manage classes


    [more help...]


    Class ID  Name  Description  Operations


    No product classes have been defined yet.


    # Add a class


    Class ID: *

    takeout_item

    The machine-readable name of this content type. This text will be used for constructing
    the URL of the create content page for this content type. This name may consist
    only of lowercase letters, numbers, and underscores. Dashes are not allowed. Underscores
    will be converted into dashes when constructing the URL of the create content
    page. This name must be unique to this content type.


    Class name: *

    Take out Item


    Description:

    An item which is available for takeout or delivery.

