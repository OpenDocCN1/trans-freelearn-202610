    +      - **Title:** Menu Search

    +      - **Style:** Table

    +      - **Use Pager:** Full Pager


    +   4. Next, we need to delete the Argument that we provided earlier, because
    this view should display all values. To do this, click on the link for the argument
    and then click on the **Remove** button at the bottom of the screen.


    # Adding fields


    +   1. Now we need to add the fields that will be displayed in our table to the
    View. Start by clicking on the + symbol next to the Fields label. Drupal will
    then display a form that allows you to select the fields that are to be added,
