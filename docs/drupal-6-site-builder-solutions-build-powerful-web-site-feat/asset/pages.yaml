- pgno: 126
  md: '4. Because we are building a search form, we want to expose the field so that
    the user can modify the values. When you click on the Expose button, the following
    options are added:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_126_0.png)


    5. Once you are satisfied with the options, click **Update** to save the filter.


    # Creating a page and menu


    Now that the view has been fully set up, we can create a Page and Menu for the
    View. Because we cloned this content type, we can simply modify the existing values.


    +   1. Click on the **Page link** link for the view.

    +   2. Click on the link next to the **Path** label in the **Page Settings** group.
    Change this value to `search_menu`, and update the setting.

    +   3. Click on the link next to the **Menu** label and change this value to **Search
    the Menu**.'
