- pgno: 186
  md: '# Additional ways of setting up cron


    The Drupal site has a wealth of information about setting up cron on various other
    systems, at http://drupal.org/cron.


    # Using poormanscron as an alternative way of updating feeds


    Good Eatin'' Goal: Set up a ''cron'' job for a web site that has no other method
    of creating a cron job.


    Additional modules needed: Poormanscron (http://drupal.org/project/poormanscron).


    Poormanscron checks each time a page is loaded to determine if cron needs to be
    run. This allows you to run cron on a site where you are having trouble configuring
    a traditional cron job. This convenience comes at a performance cost, because
    Drupal will check to see if cron needs to be loaded every time a page is loaded
    by a visitor, which can have a significant impact, especially on sites with lots
    of traffic.


    +   1. Install and activate the Poormanscron module.

    +   2. The settings for Poormanscron are available by selecting Site configuration
    and then Poormanscron, from the Administer menu. The settings are shown in the
    following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_186_0.png)'
  merge: -1
  img_proc: true
