- pgno: 205
  md: '# Adding other content types to the event calendar


    Good Eatin'' Goal: Discuss how to add custom content types to the event calendar.


    Additional modules needed: Event (http://drupal.org/project/event).


    An easy way of adding additional content types to your existing event calendar
    is by modifying the content type and then setting the Event calendar options.


    +   1. Open the Content Manager by selecting Content management and then Content
    types, from the Administer menu.

    +   2. Edit the type that you want to add to the event calendar.

    +   3. Open the Event calendar section and modify the options, as shown here:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_205_0.png)


    If you prefer to have a calendar just for the type, you can use the Only in views
    for this type option.


    +   4. Save the changes to your content type, and the event calendar will be automatically
    updated.


    # Creating events using CCK


    Good Eatin'' Goal: Build events using the CCK module and the Date module, rather
    than the Event module, thereby giving additional control over the events.


    Additional modules needed: CCK (http://drupal.org/project/cck),

    Date (http://drupal.org/project/date).'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Basic steps


    Depending on your site, it may be more convenient to use CCK and the Date API
    to build dates. This strategy also gives you additional control over what information
    is included in the event and in the display. In addition, all required modules
    should be updated more quickly after each new Drupal release. However, you will
    need to carry out more initial setup for events and displays if you use this strategy.


    +   1. Install and activate the CCK and Date modules if you have not done so already.

    +   2. Open the Content Type Manager by selecting Content management and then
    Content types, from the Administer menu.

    +   3. Click Add content type to begin creating your new event type. We will call
    this type Event CCK to avoid conflicts with the Event module, as shown below:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_206_0.png)'
