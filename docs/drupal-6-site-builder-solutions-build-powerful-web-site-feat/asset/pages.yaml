- pgno: 277
  md: '# Basic steps


    Before we can allow visitors to order our products, we need to set up a payment
    processor so that we can accept money from our visitors over the Internet.


    +   1. We will begin by adding the modules related to payments. Because this is
    only a demonstration site, we will only enable the Test Gateway, which allows
    you to test your site functionality without using actual money. We also need to
    enable the Payment module, which will allow us to accept payments. These modules
    are shown in the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_277_0.png)'
  merge: -1
  img_proc: true
- pgno: 278
  md: '2. After these modules have been enabled, we need to configure our payment
    settings by clicking on selecting Store administration, then Configuration, and
    finally Payment settings, from the Administer menu. The following settings are
    available:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_278_0.png)


    Because we are only configuring a test payment gateway, we only need to be concerned
    with the Payment methods section.


    3. On the Payment methods page you can prioritize the order in which you want
    to display the payment methods, if you accept more than one method. You can also
    configure several settings that control how the credit card information is handled
    and stored on your web site.


    4. The first and most important section is the Credit card data security section.
    This section controls how credit card details are encrypted on your web site.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_278_1.png)'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'You will need to specify the folder in which to store security keys. This folder
    should be accessible to as few users as possible. For testing purposes, you may
    want to select the Operate in credit card debug mode option, but you should remember
    to disable it before you begin accepting real payments.


    5. The Checkout workflow section allows you to control whether or not credit card
    numbers should be validated before they are submitted to the processor, and whether
    or not cards should be processed when the order is submitted. Both settings should
    be left on unless you are testing your site.


    Checkout workflow

    These settings alter the way credit card data is collected and used during checkout.

    ☑ Validate credit card numbers at checkout.

    Invalid card numbers will show an error message to the user so they can correct
    it.

    This feature is recommended unless you are in debug mode.

    ☑ Attempt to process credit card payments at checkout.

    Failed attempts will prevent checkout completion and display the error message
    from above.

    This box must be checked to process customer credit cards if you are not in debug
    mode.


    6. Next, you can specify the fields that must be entered when the visitor checks
    out.


    Credit card fields

    Specify what information to collect from customers in addition to the card number.

    ☑ Enable CVV text field on checkout form.

    The CVV is an added security measure on credit cards. On Visa, Mastercard, and
    Discover cards it is a three digit number, and on AmEx cards it is a four digit
    number. If your credit card processor or payment gateway requires this information,
    you should enable this feature here.

    ☐ Enable card owner text field on checkout form.

    ☐ Enable card start date on checkout form.

    ☐ Enable card issue number text field on checkout form.

    ☐ Enable issuing bank text field on checkout form.

    ☐ Enable card type selection on checkout form.

    If enabled, specify in the textarea below which card options to populate the select
    box with.

    Card type select box options:

    Visa

    Mastercard

    Discover

    American Express

    Enter one card type per line. These fields will populate the card type select
    box if it is enabled.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'In most cases, the default settings are acceptable, unless your store experiences
    a large number of fraudulent transactions. If this is the case, requiring more
    information may reduce fraud. However, requiring too much information can make
    it more difficult for legitimate visitors to order from your web site.


    7. Next, you can specify the types of cards that you want to accept. If your merchant
    account does not allow you to process specific types of cards, you will need to
    disable them here.


    Accepted card types (for validation)

    Use the checkboxes to specify which card types you accept for payment. Selected
    card types will show their icons in the payment method selection list and be used
    for card number validation.

    ☑ Visa

    ☑ Mastercard

    ☑ Discover

    ☑ American Express


    8. Finally, you can set the messages that are to be displayed to let customers
    know what information they need to provide when ordering, and you can also define
    a failure message that is displayed if the credit card processor declines the
    purchase.


    Customer messages

    Here you can alter messages displayed to customers using credit cards.

    Credit card payment policy:

    Your billing information must match the billing address for the credit card entered
    below or we will be unable to process your payment.

    Instructions for customers on the checkout page above the credit card fields.

    Card processing failure message:

    We were unable to process your credit card payment. Please verify your card details
    and try again. If the problem persists, contact us to complete your order.

    Error message displayed to customers when an attempted payment fails at checkout.


    9. When you are ready to set up your site to accept payments through a merchant
    account, PayPal, or another type of payment gateway, you should refer to the Ubercart
    documentation and your merchant account documentation for additional information.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Setting up notifications when orders are complete


    Good Eatin'' Goal: Ensure that the kitchen is notified when orders are submitted
    from customers, so that they can prepare the meal for the customer.


    Additional modules needed: Ubercart (http://drupal.org/project/ubercart).


    # Basic steps


    +   1. In order to be notified each time an order is placed, we will use **Conditional
    actions**. These are configured by selecting **Site configuration** and then **Conditional
    actions**, from the **Administer** menu.

    +   2. As you can see from the following screenshot, there are several actions
    that are automatically added when you install Ubercart.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_281_0.png)'
  merge: -1
  img_proc: true
- pgno: 282
  md: '3. To add a new action, click on the Add a predicate link. This will open a
    form as shown below, which allows you to define the trigger for the action as
    well as a name for the action.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_282_0.png)


    Enter the required information for your action, and click Save predicate.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '4. You can now add additional conditions to the predicate, to refine the criteria
    for triggering the action. In our case, no additional refinement is necessary.


    Meta data

    Conditions

    Actions

    Send order to kitchen

    Conditions group

    Operator:

    ● AND. If all of these conditions are TRUE.

    ○ OR. If any of these conditions are TRUE.

    Available conditions:

    Check if an order can be shipped

    Add condition

    Remove group

    Add condition group

    Save changes


    5. We can now generate the actions that we want to occur, by clicking on the Actions
    tab. This will display a list of possible actions that can be executed. In our
    case, the Send an order email action is what we want.


    Meta data

    Conditions

    Actions

    Send order to kitchen

    Actions

    These actions will be performed in order when this predicate passes the conditions
    evaluation.

    Available actions:

    Send an order email

    Add action

    Save changes'
  merge: -1
  img_proc: true
