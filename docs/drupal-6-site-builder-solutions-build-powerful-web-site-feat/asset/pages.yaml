- pgno: 125
  md: '2. Select the fields that you want to be displayed, and click the Add button.
    Drupal will then display a new form on which you can customize how the field is
    displayed.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_125_0.png)


    3. Click the Update button to finish adding the new field.


    4. Repeat these steps to include the Node Title, Node Body, Meals, Course Type,
    and the Ingredients list fields.


    # Adding filters


    Next, we will create an exposed filter for each page so that our visitors can
    easily search the menu. This process is similar to the process that we followed
    when we added the filter for Node Type.


    +   1. Click on the + symbol next to the Filters label.

    +   2. Drupal will then display a selection from which you can select the fields
    that can be filtered on. Select all of the fields that you want to display, and
    then click Add. For the taxonomy-based fields, make sure that you select the field
    prefixed with Taxonomy.

    +   3. Drupal will then display a form where you can set the options for the filter.
    The options form for the Meals field is as shown in the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_125_1.png)'
  merge: -1
