- pgno: 99
  md: '# Adding which meals the menu item is available for


    Good Eatin'' Goal: Add fields to determine at which meals an item is available.
    This will be used to build menus for each meal.


    Additional modules needed: CCK (http://drupal.org/project/cck).


    The Meals field is similar to the Seasonal field because it is a text field with
    a selection list widget. However, we will allow the editor to select multiple
    options from our list.


    # Basic steps


    +   1. Edit the Menu Item content type.

    +   2. Add a new text field with the name set to meals and the label set to Available
    at these meals, with widget of Select List.

    +   3. Set the Allowed values list to:

    +      Breakfast

    +      Lunch

    +      Dinner

    +      Dessert

    +   4. Select the Required checkbox and set the Number of values to Unlimited.

    +   5. Save the new field.


    # Adding an image for the menu item


    Good Eatin'' Goal: Allow Chef Wanyama to optionally add picture of the item for
    display in the menu.


    Additional modules needed: CCK (http://drupal.org/project/cck), IMCE (http://drupal.org/project/imce),
    IMCE CCK Image (http://drupal.org/project/imceimage).


    # Basic steps


    +   1. Begin by downloading and installing the IMCE and IMCE CCK Image modules.

    +   2. Create a new field, by clicking on the Add field link. Name the field Picture
    and set the label to Picture. The type will be an IMCE image with an IMCE image
    widget.'
