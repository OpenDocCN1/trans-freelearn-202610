    # Using the Flickr module to insert photos using a filter


    Good Eatin'' Goal: Add images to an existing block of text using a filter.


    Additional modules needed: Flickr module (http://drupal.org/project/flickr).


    # Basic steps


    Although the Embedded Media Field is very convenient for adding pictures as a
    field, there may be times when you want to display an image within a block of
    text. To do this, we will use the Flickr module.


    +   1. Begin by installing and activating the Flickr module. There are several
    available modules included, but we only need the Flickr and the Flickr Filter
    modules.


    | Enabled | Name | Version | Description |

    | --- | --- | --- | --- |

    | ☑ | Flickr | 6.x-1.0-alpha1 | Flickr and Drupal integration. Required by: Flickr
    Block (disabled), Flickr Filter (disabled), Flickr Sets (disabled), Flickr Tags
    (disabled), Flickrfield (disabled) |

    | ☐ | Flickr Block | 6.x-1.0-alpha1 | Flickr Block for inserting photos into content.
    Depends on: Flickr (disabled) |

    | ☑ | Flickr Filter | 6.x-1.0-alpha1 | Flickr Filter for inserting photos into
    content. Depends on: Flickr (disabled) |

    | ☐ | Flickr Sets | 6.x-1.0-alpha1 | Add photoset capability to Flickr module
    Depends on: Flickr (disabled) |

    | ☐ | Flickr Tags | 6.x-1.0-alpha1 | Adds tags capability to Flickr module Depends
    on: Flickr (disabled) |'
  merge: -1
  img_proc: true
