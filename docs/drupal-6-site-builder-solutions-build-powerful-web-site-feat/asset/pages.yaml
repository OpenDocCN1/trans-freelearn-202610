- pgno: 225
  md: '# Basic steps


    We have previously used the Embedded Media Field module to display YouTube movies
    on our site. In this step, we will also use it to display images from Flickr.


    +   1. If you have not already installed and activated the Embedded Media Field
    module, do so now. We also need to activate the Embedded Image Field module, which
    will allow Flickr integration.

    +   2. Before we can add content from Flickr, we will need to apply for a Flickr
    API Key. You can request an API key at http://www.flickr.com/services/api/keys.
    If you do not already have a Yahoo account, you will be prompted to create one.

    +   3. After you sign into your Yahoo and Flickr accounts, you can apply for an
    API key by accepting the terms of service. You will need to specify whether the
    key is for commercial or non-commercial use, and enter your name and email account.
    When the sign-up is complete, you will receive a long key for use with Flickr.
    You should store this key in a safe place.

    +   4. We can enter the Flickr key for the Embedded Media field by selecting Content
    Management and then Embedded Media Field configuration. Expand the Embedded Image
    Field section, which appears as follows, and enter your key.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_225_0.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: "+   5. Open the **Content Type Manager** by selecting **Content management**\
    \ and then **Content types**, from the **Administer** menu.\n+   \n+   6. Click\
    \ on the **add field** link next to the Cooking Class content type.\n+   \n+ \
    \  7. Enter the **name** and **label** for the new field as shown in the following\
    \ screenshot, and make sure that you set the **Field type** to **Embedded Image**.\n\
    \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_226_0.png)\n\n+   8. Click **Continue**\
    \ to select the Widget type. The only available type is **3rd Party Image**, so\
    \ we will leave that set, and click **Continue** again.\n+   \n+   9. We can now\
    \ set several options for the field, including the allowable providers and the\
    \ size to display images when they are displayed full size, preview size, or thumbnail\
    \ size."
  merge: -1
  img_proc: true
- pgno: 227
  md: '10. We will first set the providers to allow images only from Flickr. Depending
    on your site, you may want to add other providers as well.


    # Cooking Class settings


    These settings apply only to the An example of what you will make field as it
    appears in the Cooking Class content type.


    # Providers Supported


    Select which third party providers you wish to allow for this content type from
    the list below. If no checkboxes are checked, then all providers will be supported.
    When a user submits new content, the URL they enter will be matched to the provider,
    assuming that provider is allowed here.


    Providers:


    +   - ☑ Flickr

    +   - ☐ ImageShack

    +   - ☐ Photobucket

    +   - ☐ Picasa


    11. The image resizing options contain the following possibilities:


    # Full size display settings


    These settings control how this image is displayed in its full size, which defaults
    to 500x800. Note that if one of the dimensions is 0, then the image will be resized
    to be no larger than the other dimension.


    Full size display width: *

    500

    The width of the image. It defaults to 500. Set it to 0 if you want to leave the
    image at its original aspect ratio.


    Full size display height: *

    800

    The height of the image. It defaults to 800. Set it to 0 if you want to leave
    the image at its original aspect ratio.


    Full size link:

    Link to provider

    Where the image will link when displayed in its full size. ''Content'' links to
    the content page, ''provider'' links to the provider''s image page, and ''none''
    displays the image with no link.


    In our case, the defaults are acceptable, so we will leave them alone.


    12. Click Save field settings to complete the new field definition.


    13. We can now either create a new cooking class, or edit one that we created
    previously, to add information to our new field.'
  merge: -1
  img_proc: true
