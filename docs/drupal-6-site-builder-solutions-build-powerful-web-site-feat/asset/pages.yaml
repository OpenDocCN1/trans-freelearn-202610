- pgno: 170
  md: '# Automatically moderating content based on keywords


    Good Eatin'' Goal: Add the automatic moderation of posts, based on the content
    entered within a post.


    Additional modules needed: Actions (core), Trigger (core).


    # Basic steps


    An alternative to forcing all posts into moderation is to allow posts to be automatically
    published, but to force specific posts to be moderated if they do not meet your
    guidelines. This can help you cut down on your moderation time and allow most
    posts to be available immediately after they are written.


    +   1. We will begin by creating a new action which will unpublish a post. Select
    site configuration and then Actions, from the Administer menu to open the Actions
    manager.


    +   2. Select a new action of Unpublish post containing keyword(s) and click Create.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_170_0.png)


    Drupal will now display a form on which you can enter the keywords that a post
    should contain if it is to be held for moderation. Enter the words separated by
    commas. If a term that you want to filter on includes a comma, you must enclose
    the entire term in quotes.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_170_1.png)'
