    # Summary


    In this chapter, we have truly integrated the web site into our business by allowing
    users to order from our menu and place orders from the site. You can apply many
    of the same techniques to your own site to make the most of your web site.


    For more information about running an online store with Drupal, check out *Drupal
    e-Commerce* by Michael Peacock, also published by Packt:

    `http://www.packtpub.com/drupal-ecommerce/book.`


    In the next chapter, we will discuss essential tasks for administering your web
    site and ensuring that your site stays up-to-date. We will cover backups, installing
    updates to Drupal, and third party modules, along with moderating content.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# 10


    # Keeping a Clean Kitchen


    Now that we have built our site and integrated it into our business, we need to
    ensure that our site stays clean and up-to-date. In this chapter, we will explore
    various maintenance tasks to keep our site operating at peak performance.


    We will begin by discussing how to back up our web site and then restore it again,
    to protect it against hardware failures or malicious users. Next, we will discuss
    performance tuning to ensure that your site can meet any level of traffic demand.
    Finally, we will review managing and moderating content.


    At the end of this chapter, you will be prepared to publish your web site to the
    world, knowing that you are prepared for anything.


    # Web site backups


    A strong backup plan is critical for any successful web site. A good backup plan
    will protect against hardware failure, allow you to transfer your web site to
    another host, and allow you to recover from malicious hacking into your web site.


    When you create a backup plan, you should also test the restoration from this
    backup to make sure that the backup works correctly.


    In this section, we will explore ways of performing backups regardless of the
    host that you are using. Your hosting provider may also offer a solution that
    will back up files and databases either one time, or on a recurring basis. If
    your host does provide backup capabilities, you should review them to see if they
    suit your needs completely, or if you want to augment them or replace them with
    the techniques in this section.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Manually backing up a site


    Good Eatin'' Goal: Back up the web site without using a custom backup module.


    Additional modules needed: None.


    # Basic steps


    If you do not want to use a dedicated module to perform your backups, you can
    manually download the files and the database information that make up the site.
    However, this can be more time-intensive and error-prone than using a custom backup
    module.


    A manual backup has two steps, in which you must first back up the files that
    make up the site and then back up the database information.


    To back up the files for the web site, use the following procedure:


    +   1. Begin by opening the utility that you use to transfer files to the web
    site. This could be an FTP client, or an online file manager. My favorite FTP
    client is FileZilla, which is a freely-available open source client. The FileZilla
    client can be downloaded from http://filezilla-project.org/.

    +   2. Select the backup location on your local computer to which you want to
    copy the files, and select the root directory of your web server as the remote
    directory. You may want to date the backup folder so that you can maintain a history
    of the site.'
  merge: -1
  img_proc: true
- pgno: 292
  md: "![](img/b332d58f89551dfc3ae9a7cf47e6a08f_292_0.png)\n\n+   3. Next, download\
    \ the files to your local directory. If you want, you can compress the files into\
    \ a ZIP file or a compressed archive.\n+   \n+   4. To reduce the amount of data\
    \ that you need to download, you should be able to download just the `sites` directory,\
    \ because that folder contains all of the custom files, pictures, themes, and\
    \ modules that you have added to the site, assuming that you have followed all\
    \ of the guidelines in this book."
  merge: -1
  img_proc: true
- pgno: 293
  md: 'To back up the database information, you can use your web site provider''s
    database management utility. Many hosts provide phpMyAdmin for this purpose. If
    you are unsure whether or not your host gives you access to phpMyAdmin, you can
    contact their customer support group to check.


    +   1. Begin by opening phpMyAdmin and selecting the database that has your site
    information within it. The screen should be similar to the following:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_293_0.png)


    +   2. If you have multiple databases available on the host, you may need to select
    the database that you want to work with in the drop-down list at the upper left
    corner of the screen.


    +   3. Next, select the Export tab at the top of the screen. phpMyAdmin will prompt
    you to select the tables that you want to download and the format that you want
    to download in, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 294
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 295
  md: 'When you are ready to restore the web site from backup, you simply reverse
    the process.


    +   1. You should always import into a blank database, to avoid conflicts with
    existing data. You can either drop or delete all of the titles in the existing
    database, or you can create a new database to import the data into.

    +   2. After you have cleaned out your database, select the Import tab in phpMyAdmin.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_295_0.png)


    +   3. Now navigate to the file that you exported earlier, and click Go to begin
    the import. You may need to delete all of the tables in the database before you
    import the data, depending on the options you chose when you exported the data.

    +   4. To reload the files, simply open your FTP client, select the same directories
    that you used when creating the backup and then upload the files, rather than
    downloading them.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Automatic site backups


    Good Eatin'' Goal: Back up a web site so that it can be stored for easy recovery.


    Additional modules needed: Backup and Migrate (http://drupal.org/project/backup_migrate).


    # Basic steps


    Although you can manually back up your files and database, this process can be
    time-consuming and error prone. Luckily, the Backup and Migrate module makes this
    process easier, and optimizes the backups to exclude unnecessary data.


    +   1. Begin by downloading and installing the Back up and Migrate module.

    +   2. You can now back up your data by selecting Content management and then
    Backup and migrate, from the Administer menu.

    +   3. The Backup and Migrate module allows you to fully customize the backup
    files that are created. You can control which tables are included in the backup,
    and whether or not the data in the table is backed up. By default, the Backup
    and Migrate module does not back up cache information, session information, or
    watchdog information, because data in these tables is temporary and can easily
    be re-created.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_296_0.png)


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_296_1.png)'
  merge: -1
  img_proc: true
- pgno: 297
  md: '4. There are a variety of other options that you can choose from, which control
    how the resulting file is named, how it is compressed, and where it is compressed
    to.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_297_0.png)


    5. Once you have set the options as desired, click Backup Database to begin the
    backup process. If you have selected the Download option, the file will be sent
    to your computer so that you can store it. If you select the Save to Files Directory
    option, the backup file will be saved onto the server so that you can download
    it later, either directly from the server or using the Saved Backups tab.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_297_1.png)'
  merge: -1
  img_proc: true
- pgno: 298
  md: '6. If you would like the Backup and Migrate module to back up your database
    automatically on a regular basis, you can schedule the back up to occur at specified
    intervals by clicking on the Backup Schedule tab, as shown here:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_298_0.png)


    Please note that the backups created by the Backup and Migrate module do not include
    the files from the site, so you will still need to back up these files independently.
    You can minimize the backup file size by only backing up the files that the users
    can upload. These files are typically stored in the files directory. The process
    for backing up files is identical to the process used in the section on manual
    backups.


    # Restoring a site from a backup


    Good Eatin'' Goal: Restore information from a backup file created by the Backup
    and Migrate module.


    Additional modules needed: Backup and Migrate (http://drupal.org/project/backup_migrate).


    # Basic steps


    Restoring a backup created by the Backup and Migrate module is a simple process.


    +   1. Navigate to the Backup and Migrate manager by selecting Content management
    and then Backup and Migrate, from the Administer menu.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '2. Next, click on the Restore/Import DB tab.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_299_0.png)


    3. Navigate to the location of your backup file.


    4. After you have selected the backup file, click on Restore Database to begin
    the restore process. Please read all displayed warnings carefully, and make sure
    that you test the import on a test installation for your site before running it
    on your production site. If you are sure that you want to proceed with the import,
    agree to the confirmation and click restore.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_299_1.png)


    5. You may also need to import any saved files, if the server file system is not
    fully up-to-date. We discussed this previously in the section on manual backups.


    # Web site optimization


    If your web site has a moderate to large number of visitors, you should tune your
    web site for maximum performance. This will ensure that all your visitors have
    a positive experience, and are not frustrated by delays in loading pages or accessing
    the web site.'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'We will discuss ways to optimize both the back end database, and the front
    end of the web site that displays the information to the visitor.


    # Optimizing the database tables


    *Good Eatin'' Goal:* Optimize the database where your site content is stored,
    to ensure the best possible performance.


    *Additional modules needed:* DB Maintenance (`http://drupal.org/project/db_maintenance`).


    # Basic steps


    When a database is used as frequently as the Drupal database is, it can become
    less optimized over time, because having a large number of records inserted and
    deleted from each table can result in the database having wasted space. All databases
    will allow you to run an optimization process that removes unused space and rebuilds
    the indexes to make the search for information faster.


    The **DB Maintenance** module can automatically perform the optimization process
    for you when cron is run.


    +   1. Begin by downloading and installing the **DB Maintenance** module.

    +   2. You can edit the settings for the **DB Maintenance** module by selecting
    **Site configuration** and then **DB maintenance**, from the **Administer** menu.

    +   3. The settings allow you to control several options, including:

    +      a) Whether or not to write to the log when each optimization is performed.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_300_0.png)'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'b) How often the tables are optimized, with options from hourly to bi-monthly,
    or at each cron run.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_301_0.png)


    c) Finally, you can control which tables are optimized. This allows you to not
    optimize tables that do not change frequently, which will allow the maintenance
    task to complete faster.


    Once you have configured the settings properly, you simply save the settings,
    and the DB maintenance module will automatically perform the optimization at the
    specified intervals.


    # Using caching to improve performance


    Good Eatin'' Goal: Use caching to improve the performance of content display.


    Additional modules needed: None.


    # Basic steps


    Because dynamically-generated pages, such as those created with Drupal, can be
    time-consuming and resource-intensive to generate. Drupal uses a sophisticated
    caching mechanism to pre-load sections of content for display to users.


    To set up the Drupal cache, carry out the following steps:


    +   1. Access the settings for the Drupal cache by selecting Site configuration
    and then Performance, from the Administer menu.


    +   2. The first section of settings relate to the Page cache, which is used to
    cache entire pages of data. The Page cache system will only cache pages for anonymous
    users, to prevent personal data for one user being made visible to other users,
    and also because it is simpler to ensure that the pages are successfully cached
    only if anonymous users are served cached content.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Page cache


    Enabling the page cache will offer a significant performance boost. Drupal can
    store and send compressed cached pages requested by anonymous users. By caching
    a web page, Drupal does not have to construct the page each time it is viewed.


    # Caching mode:


    +   - Disabled

    +   - Normal (recommended for production sites, no side effects)

    +   - Aggressive (experts only, possible side effects)


    The normal cache mode is suitable for most sites and does not cause any side effects.
    The aggressive cache mode causes Drupal to skip the loading (boot) and unloading
    (exit) of enabled modules when serving a cached page. This results in an additional
    performance boost but can cause unwanted side effects.


    The following enabled modules are incompatible with aggressive mode caching and
    will not function properly: poormanscron, uc_cart, uc_store.


    Most sites should enable Normal caching as this can significantly improve load
    times for your visitors without any possibility of adverse side effects.


    +   3. If you choose to use Aggressive site caching, you need to be aware of any
    modules that may have problems. Drupal will identify these modules for you and
    highlight them in red. You should only enable the Aggressive cache if there are
    no potential incompatibilities, or if the module maintainer of a potentially incompatible
    module states that the module is acceptable for use with Aggressive caching. Some
    modules are not compatible with Aggressive mode due to the initialization or cleanup
    code that is run when a page is loaded normally, but not when it has been aggressively
    cached.


    +   4. If your site is exceptionally busy, you may want to enforce a minimum cache
    lifetime, which is the minimum amount of time that Drupal will wait for, before
    rebuilding cached pages. If your site receives infrequent updates, you may see
    a performance benefit by increasing this number to match your update schedule.


    # Minimum cache lifetime:


    5 min

    On high-traffic sites, it may be necessary to enforce a minimum cache lifetime.
    The minimum cache lifetime is the minimum amount of time that will elapse before
    the cache is emptied and recreated, and is applied to both page and block caches.
    A larger minimum cache lifetime offers better performance, but users will not
    see new content for a longer period of time.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '5. The Page compression controls whether or not the cached pages are compressed.
    This can be left as Enabled unless your web server automatically caches all web
    pages.


    Page compression:

    ○ Disabled

    ● Enabled

    By default, Drupal compresses the pages it caches in order to save bandwidth and
    improve download times. This option should be disabled when using a webserver
    that performs compression.


    6. Drupal also provides a Block cache, which caches just the content of the blocks
    rather than the entire page. Unlike the page cache, the block cache works for
    both anonymous users as well as users who have logged into the site.


    Block cache

    Enabling the block cache can offer a performance increase for all users by preventing
    blocks from being reconstructed on each page load. If the page cache is also enabled,
    performance increases from enabling the block cache will mainly benefit authenticated
    users.

    Block cache:

    ○ Disabled

    ● Enabled (recommended)

    Note that block caching is inactive when modules defining content access restrictions
    are enabled.


    7. The final type of optimization provided by Drupal relates to minimizing the
    amount of content that is sent to the user, by combining the CSS files and JavaScript
    files created by each module into a single CSS file and a single JavaScript file,
    which can be downloaded once by the user. These options are disabled if you are
    using the private filesystem. If you want to make use of these options, you will
    need to use the public filesystem on your site.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Bandwidth optimizations


    Drupal can automatically optimize external resources like CSS and JavaScript,
    which can reduce both the size and number of requests made to your website. CSS
    files can be aggregated and compressed into a single file, while JavaScript files
    are aggregated (but not compressed). These optional optimizations may reduce server
    load, bandwidth requirements, and page loading times.


    These options are disabled if you have not set up your files directory, or if
    your download method is set to private.


    # Optimize CSS files:


    +   - Disabled

    +   - Enabled


    This option can interfere with theme development and should only be enabled in
    a production environment.


    # Optimize JavaScript files:


    +   - Disabled

    +   - Enabled


    This option can interfere with module development and should only be enabled in
    a production environment.


    8. Although Drupal caching makes your site faster and gives users a better experience,
    it can interfere with your development of the web site because the cache may prevent
    you from seeing the most recent changes to your site. If this is the case, you
    can clear the cached data by clicking on the Clear cached data button.


    # Clear cached data


    Caching data improves performance, but may cause problems while troubleshooting
    new modules, themes, or translations, if outdated information has been cached.
    To refresh all cached data on your site, click the button below. Warning: high-traffic
    sites will experience performance slowdowns while cached data is rebuilt.


    Clear cached data'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# # Maintaining content


    As you continue to add content to your web site, you will need to ensure that
    your content is properly moderated, that old content is removed, and that changes
    to web site content are tracked.


    # ## Creating content revisions


    *Good Eatin'' Goal:* Create revisions of content to ensure that you have a complete
    record of changes to your web site''s content.


    *Additional modules needed:* None.


    # ### Basic steps


    Throughout this book, we have simply updated our pages as necessary to add new
    functionality and content. However, if you have many editors, content that changes
    frequently, a need to view the history of a page, or need the ability to easily
    return to an old version of a page, you will want to store multiple revisions
    of your pages.


    To do this, carry out the following steps:


    +   1. Edit the content for which you want to create a new revision.

    +   2. Make the changes as needed and, before saving, expand the **Revision information**
    section.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_305_0.png)


    +   3. Select the **Create new revision** option and enter a message describing
    the changes that you have made to the node.

    +   4. When you save the content, you will see a new tab called **Revisions**.
    Clicking on this tab will show you a list of all of the revisions that have been
    created for the page.'
  merge: -1
  img_proc: true
- pgno: 306
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Comparing content revisions


    *Good Eatin'' Goal:* Compare the text of two different revisions of a page.


    *Additional modules needed:* Diff (`http://drupal.org/project/diff`).


    # Basic steps


    Although the built-in functionality for creating revisions in Drupal works perfectly
    well, it can be difficult to review the changes that were made in each revision.
    The **Diff** module makes comparing revisions very easy.


    +   1. Begin by installing and activating the **Diff** module.

    +   2. To use the **Diff** module, simply view the revisions for any page. You
    will notice that the **Revisions** list has changed to allow you to select the
    revisions to be compared.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_307_0.png)


    +   3. Select the revisions to compare and then click on the **Show diff** button.
    Drupal will then display information about the text that has been changed, added,
    or deleted.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_307_1.png)'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# # Moderate content


    *Good Eatin'' Goal:* Find questionable or offensive content, and remove it from
    your site, easily.


    *Additional modules needed:* Modr8 (http://drupal.org/project/modr8).


    # ## Basic steps


    An unfortunate side effect of having a web site on the Internet is that, at some
    point, a malicious user will attempt to post inappropriate content on your site.
    If your site is extremely busy, you may find yourself with a large amount of content
    to review and approve.


    The **Modr8** module can help you manage the workload and can send emails to users
    letting them know when their content has been approved or rejected.


    +   1. Begin by installing and activating the **Modr8** module.

    +   2. The settings for the **Modr8** module can be accessed by selecting **Site
    configuration** and then **Modr8**, from the **Administer** menu.

    +   3. The basic settings control how often logs are removed. Alternatively, you
    can choose to keep the logs forever. You can also change the number of items in
    the moderation queue to be displayed at a time, as well as the default action
    for the content that requires moderation.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_308_0.png)'
  merge: -1
  img_proc: true
- pgno: 309
  md: '4. You can also configure the email settings for the moderation queue, including
    the text of the emails, and whether or not emails should be sent to the user who
    posted the content when their content is approved and/or when their content is
    rejected. You can also choose to send an email if the moderator does not take
    action for the item and wants to send a note to the author.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_309_0.png)


    5. If you would like new content to be added to the moderation queue automatically,
    you can edit the content type and select the In moderation queue setting in the
    workflow section.


    6. To view the moderation queue, select Content management and then Moderated
    content, from the Administer menu.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '7. The moderation queue appears as follows:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_310_0.png)


    8. From this page, you can approve, delete, or defer action on any content that
    needs moderation. After you make your changes, click Save to complete your selections.
    You can also display a log of all the moderation actions, by clicking on Reports
    and then Content moderation log. The moderation log appears as follows:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_310_1.png)


    # Allowing users to report questionable or offensive content.


    Good Eatin'' Goal: Get feedback from users to learn what they find offensive so
    the objectionable content can be removed.


    Additional modules needed: Abuse (http://drupal.org/project/abuse).


    # Basic steps


    In the last task, we reviewed methods that allowed you to moderate every piece
    of content that is added to the site. However, this can be a time-intensive task
    if the proportion of content that you receive that is questionable is low. If
    this is the case, you can allow your users to help you to moderate the content
    by using the Abuse module, to let them report items that they find offensive.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'This strategy has a couple of advantages. Firstly, you are freed from the maintenance
    of pre-approving all content before it is published. Secondly, it ensures that
    the content meets community standards, rather than placing you or your editors
    in charge of defining community standards.


    The Abuse module also has a Watchlist component that allows you to flag content
    as suspicious or banned, and automatically move them into a queue for review by
    an administrator.


    +   1. Begin by downloading and installing the Abuse and Watchlist modules, both
    of which are included in the Abuse installation.


    +   2. We will begin by editing the Watchlist settings, which can be accessed
    by selecting Site configuration and then Watchlist settings, from the Administer
    menu.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_311_0.png)


    +   3. You can include any words that you want to, in the Watch list and Filtered/banned
    word list, depending on your target audience and your site''s needs; just make
    sure that you enter one word per line. Items on the Watch list can be viewed while
    they are in the review queue, and items on the Filtered/banned word list will
    be hidden until they are reviewed.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '4. You can also control which items are automatically added to the Watch list
    or banned list, based on the Watchlist word settings configured above.


    Enable moderation from the watchlist and banned list for these content types


    Content gets flagged into a pending pile (users can still view item) if a match
    is found in the watchlist. Content gets flagged into hidden pile (hidden from
    users) if a match is from from the bannedlist. Users will only be validated against
    banned words.


    ☐ webform

    ☑ blog

    ☐ poll

    ☐ dir_listing

    ☐ image

    ☐ product


    5. You can also force moderation for specific types if they are more prone to
    abuse.


    Enable pre-moderation from the watchlist and banned list for these content types


    Content gets flagged regardless of abuse module setting


    ☐ webform

    ☐ blog

    ☐ poll

    ☐ dir_listing

    ☑ image


    6. We can now modify the Abuse Moderation settings by selecting Site configuration
    and then Abuse Moderation settings, from the Administer menu.'
  merge: -1
  img_proc: true
- pgno: 313
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 314
  md: 'If you have multiple moderators for your site, you can select the **Abuse Assigned
    Moderators** option. If you use this, you will also need to store the maximum
    number of items that have been flagged for abuse that are added to the moderator''s
    queue. If moderators live in different time zones, you can set an hour of the
    day at which all moderation queues are cleared, so that items do not remain in
    the moderation queue for an overly-long period of time.


    9. Finally, you can configure the settings related to all of the items that have
    been flagged as abusive by a user.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_314_0.png)


    The **Abuse threshold** controls how many complaints must be registered for an
    item before it is moved into the moderation queue. 3 is a good number to start
    with, but you may want to increase or decrease the threshold depending on the
    needs of your site.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '10. You can edit the reasons for flagging an item for abuse by selecting Site
    configuration, then Abuse Moderation settings, and finally Abuse Moderation reasons,
    from the Administer menu.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_315_0.png)


    All available reasons will be listed on the page using a format similar to the
    example above. You can add new reasons, remove reasons, or change the text for
    reasons from this page.


    11. Before the abuse module is activated, you need to assign permissions to users,
    so that they can flag content for review.


    | Permission | anonymous user | authenticated user | blogger | Store Administrator
    |

    |---|---|---|---|---|

    | abuse module | | | | |

    | administer abuse reports | ☐ | ☐ | ☐ | ☐ |

    | administer all abuse reports | ☐ | ☐ | ☐ | ☐ |

    | configure abuse administration settings | ☐ | ☐ | ☐ | ☐ |

    | direct flag | ☐ | ☐ | ☐ | ☐ |

    | report abuse | ☐ | ☐ | ☐ | ☐ |'
  merge: -1
  img_proc: true
- pgno: 316
  md: '12. Content that has the abuse module activated will have a new Flag as offensive
    link added to it, as shown in the following screenshot:


