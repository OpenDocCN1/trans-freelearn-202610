- pgno: 257
  md: '# Basic steps


    As you continue to work on your web site, you will find that many users want access
    to your content, even if they aren''t online. With the Printer, email, and PDF
    module, you can easily and automatically provide content in various formats for
    offline usage.


    +   1. To begin with, download and install the Printer, email, and PDF module.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_257_0.png)


    +   2. You can now configure the basic options for the module by selecting Site
    configuration and then Printer-friendly pages from the Administer menu.


    +   3. The general settings are accessed by clicking on the Settings tab. These
    settings are shown below, and include options to style the printable pages, and
    to determine whether or not URLs and comments are displayed on the page. You can
    also control how the page is opened, and also which logos are displayed on it.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_257_1.png)'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'By expanding the **Source URL** section, you can cause the URL of the page
    to be included on the printed output. You can also optionally add the date and
    time when the page was generated to the printed output.


    +   4. The printable page (web page) configuration options include a variety of
    options to control how the links to the printable versions are displayed, as well
    as how the printable pages are displayed.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_258_0.png)


    +   5. We have modified the **Printer-friendly page link** to be in the **Content
    corner** rather than in the **Links area**. You can also optionally display the
    printable page in a new window and automatically call the print function, as needed.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '6. Opening the **Advanced link options** gives you additional options for how
