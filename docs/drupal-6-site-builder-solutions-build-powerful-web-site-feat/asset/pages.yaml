- pgno: 106
  md: 'After you save your new vocabulary, you will be returned to the Taxonomy Manager,
    which will now include your new category, as shown here:


    # Taxonomy


    The taxonomy module allows you to categorize your content using both tags and
    administrator defined terms. It is a flexible tool for classifying content with
    many advanced features. To begin, create a ''Vocabulary'' to hold one set of terms
    or tags. You can create one free-tagging vocabulary for everything, or separate
    controlled vocabularies to define the various properties of your content, for
    example ''Countries'' or ''Colors''.


    Use the list below to configure and review the vocabularies defined on your site,
    or to list and manage the terms (tags) they contain. A vocabulary may (optionally)
    be tied to specific content types as shown in the Type column and, if so, will
    be displayed when creating or editing posts of that type. Multiple vocabularies
    tied to the same content type will be displayed in the order shown below. To change
    the order of a vocabulary, grab a drag-and-drop handle under the Name column and
    drag it to a new location in the list. (Grab a handle by clicking and holding
    the mouse while hovering over a handle icon.) Remember that your changes will
    not be saved until you click the Save button at the bottom of the page.


    [more help...]


    Created new vocabulary Course Type.


    | Name | Type | Operations |

    |---|---|---|

    | Course Type | Menu Item | edit vocabulary list terms add terms |


    # Adding terms to the course type vocabulary


    Good Eatin'' Goal: Create the Terms that will be used in the Course Type Vocabulary.


    Additional modules needed: Taxonomy (Core).


    # Basic steps


    Now that our vocabulary has been created, we can define the terms that can be
    used within this vocabulary by clicking on the add terms link. A single term includes
    the name of the term and the description of the term. You can also use the advanced
    options to define a hierarchy of terms, or to define synonyms for the term. Synonyms
    are especially useful when you want to allow editors to enter their own terms,
    because it allows you to link terms with the same meaning to each other, even
    if two editors used different words.'
  merge: -1
  img_proc: true
