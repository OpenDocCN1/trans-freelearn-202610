- pgno: 241
  md: '# Twitter when you post


    *Good Eatin'' Goal:* Provide Twitter notifications each time content is updated
    on our site to ensure that customers always stay up-to-date.


    *Additional modules needed:* Twitter (`http://drupal.org/project/twitter`).


    # Basic steps


    Twitter allows users to post very brief messages at frequent intervals, so that
    other people can remain updated on what they are doing. You can subscribe to a
    person to follow everything they do, or search for specific posts.


    Once you have installed and activated the **Twitter module**, a message is sent
    via Twitter each time a user with the required permissions adds a new post. You
    can control what types of nodes to send messages to Twitter for, as well how the
    post should be formatted, in the **Twitter settings**. The Twitter settings can
    be accessed by selecting **Site configuration** and then **Twitter setup** from
    the **Administer** menu.


    # Social bookmarking with service links


    *Good Eatin'' Goal:* Allow customers to easily add our content to several different
    social bookmarking sites.


    *Additional modules needed:* Service Links (`http://drupal.org/project/service_links`).


    # Basic steps


    If you would like to display links to several social bookmarking links at the
    same time, you can do so with the **Service Links** module. This can be useful
    if you need many links and don''t need specific controls over each individual
    site.


    +   1. Begin by installing and activating the **Service Links** module.

    +   2. The Service Links options can be configured by selecting **Site configuration**
    and then **Service Links** from the **Administer** menu.

    +   3. The first configuration that needs to be done is to set the types of nodes
    that you want to display links for, as shown below:'
  merge: -1
  img_proc: true
