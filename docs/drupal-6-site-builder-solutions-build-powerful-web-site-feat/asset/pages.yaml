    # Automatically generating PDF files for a page


    Good Eatin'' Goal: Generate PDF files of our pages so that the users can automatically
    download the pages for printing, or for offline usage.


    Additional modules needed: Printer, email, and PDF (http://drupal.org/project/print).'
