- pgno: 114
  md: 'We will use a combination of views and taxonomy to create each of these displays.
    Before we dive into creating each display, let''s look at the Views module.


    # Introducing the Views module


    Good Eatin'' Goal: Introduce the Views module, and activate it on the Good Eatin''
    web site so we can build our views.


    Additional modules needed: Views (http://drupal.org/project/views).


    # Basic steps


    The Views module is used to group content according to information in the content.
    The Views module is available for download at: http://drupal.org/project/views.
    Download the module and install it onto your site. After you have added the Views
    module to your site, there are several other modules that you will require in
    order to be able to activate the Views module and the Views UI module, as shown
    in the screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_114_0.png)


    The Views module handles the core tasks of managing and presenting each view.
    The Views UI module is used to create and edit the views. You may also want to
    download and install the Advanced Help module, which improves the help system
    for some modules — including the Views module. The Advanced Help module is available
    at: http://drupal.org/project/advanced_help.


    After enabling these modules, you can review the predefined views and create new
    views by selecting the Site building and then the views link, from the Administer
    menu.'
  merge: -1
  img_proc: true
