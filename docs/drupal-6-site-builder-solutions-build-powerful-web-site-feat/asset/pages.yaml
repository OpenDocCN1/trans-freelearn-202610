- pgno: 355
  md: '# Drupal 6

    Site Builder Solutions


    Everybody knows that a business needs a web site to enable its growth and to provide
    a customer interface. However, building a web site can be a difficult as well
    as time-consuming process if you do it yourself. Simple web site software does
    not give you access to modern functionality and the resulting site can be difficult
    to maintain. Paying a web site designer to build a complete custom web site can
    be very expensive, and you need to pay every time you want to make a simple change.


    Drupal is a powerful, free system that anyone can use in order to create their
    own web site. With such a powerful tool at your fingertips there is no longer
    any need to pay professionals to design a site when you can do the same job yourself
    entirely for free.


    This book is your step-by-step guide to building a business website in Drupal,
    complete with a blog, an events calendar, a catalogue of products and services,
    and more. These features will allow you to better connect to your customers, and
    allow you to find ways to make more money.


    # Who this book is written for


    This book is designed primarily for business owners who want to create a new web
    site for their company or upgrade an existing company web site to make it easier
    to maintain and have advanced capabilities.


    Whether you know Drupal or not, this book will be your guide to a powerful web
    site.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_355_0.png)


    # What you will learn from this book


    +   - Create a user-friendly, professional-looking, branded site with clear navigation

    +   - Incorporate a blog or ''latest news'' page to keep your customers informed
    about new products, announce special offers, post news about your company, and
    share information that will attract prospective customers to you

    +   - Build a product catalogue with categories, product images, and custom information

    +   - Add e-commerce features so that customers can order and buy products online

    +   - Use a built-in “events calendar” to publicize upcoming special events and
    occasions

    +   - Build a community by integrating with user-generated content on Flickr and
    YouTube

    +   - Use Google Maps to display a professional map on your “where to find us”
    page, and make it easy for customers to find you


    $ 44.99 US

    £ 27.99 UK


    Prices do not include local sales tax or VAT where applicable


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_355_1.png)


    [PACKT]

    PUBLISHING

    "Community Experience Distilled"'
  merge: -1
  img_proc: true
