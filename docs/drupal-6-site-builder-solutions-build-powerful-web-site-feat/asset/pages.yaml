- pgno: 232
  md: "# Basic steps\n\nGoogle requires you to obtain a key from them if you want\
    \ to use one or more of their maps on your web site. This is a very simple process.\n\
    \n+   1. The full process is described on Google's web site at:\n+      `http://code.google.com/apis/maps/signup.html.`\n\
    +   \n+   2. If you do not already have a Google account, you will need to sign-up\
    \ for a new account.\n+   \n+   3. After you have signed up for an account, you\
    \ will need to read and accept the terms of service, enter the URL of your web\
    \ site, and then click on **Generate API Key**, as shown in the following screenshot:\n\
    \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_232_0.png)\n\n+   4. After you click\
    \ on **Generate API Key**, Google will issue you a long string that you will need\
    \ to use as your key. Make sure that you save this key in a safe place so that\
    \ you can use it later."
  merge: -1
