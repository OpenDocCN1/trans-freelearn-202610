- pgno: 233
  md: '# Insert a simple map with GMapEZ


    Good Eatin'' Goal: Add a basic map in a new page to the web site. We will control
    where it is centered as well as the zoom level.


    Additional modules needed: GmapEZ (http://drupal.org/project/gmapez).


    # Basic steps


    +   1. Begin by installing and activating the GmapEZ module.

    +   2. We now need to enter our API Key by clicking on Site configuration and
    then on GmapEZ. The configuration options are shown in the following screenshot:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_233_0.png)


    Simply enter your map key and then click on Save configuration. You can now begin
    adding maps to pages.


    +   3. We will create a new page which will contain a map called Our Locations.
    Select Create content and then Page, from the Navigation menu.

    +   4. To insert a map into a page, you will need to enter a block similar to
    the following one, on your page. You will also need to modify your input format
    to a format that includes divs. You may even want to create a format specifically
    for maps.


    ```

    <div class="GMapEZ GSmallMapControl" style="width: 600px; height: 480px;">

    <a href="http://maps.google.com/maps?q=111%20Main%20Street, %20Parker,%20CO"></a>

    </div>

    ```


    +   5. With the above information, the page will appear as follows:'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Our Locations


    Page Our Locations has been updated.


    Good Eatin'' has several locations offering our fine cuisine. Just click on a
    location to get information.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_234_0.png)


    6. You can specify the center of the map by modifying the portion of the URL after
    the q. This can be an actual street address, the name of a well-known building
    or monument, or a specific latitude and longitude. You can verify whether or not
    Google will be able to find the address by checking on maps.google.com.


    An example of a URL based on an address or place name is:


    ```

    q=Washington+Monument

    ```


    An example of a URL based on a specific latitude and longitude is:


    ```

    ll=39.521985,-104.784765

    ```'
  merge: -1
  img_proc: true
- pgno: 235
  md: "You can retrieve the latitude and longitude either from a GPS or from a Google\
    \ map.\n\nWhen you build your own URLs, make sure that you substitute either a\
    \ + symbol or %20 for all of the spaces, as spaces are not allowed within URLs.\n\
    \n+   7. You can also build URLs by finding the location that you want on Google\
    \ maps and then copying and pasting it into the `<a>` tag.\n+   \n+   8. To change\
    \ the size of the map on the page, simply modify the width and height that are\
    \ specified in the div tag.\n+   \n+   9. If your map does not appear, make sure\
    \ that your input filter allows div tags to be included in content. You may need\
    \ to change the active **Input filter** for your page if the default does not\
    \ allow divs.\n+   \n+   10. If you want to specify multiple locations on the\
    \ map, you can simply add multiple links in the form of `<a>` tags to the div.\
    \ When using multiple markers, you must include the latitude and longitude in\
    \ all of the links. If you don't, only the first marker will be displayed.\n+\
    \   \n+   11. An example of a map with multiple markers is shown in the following\
    \ screenshot:\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_235_0.png)"
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Displaying content in pop-ups


    Good Eatin'' Goal: Enhance our map location by displaying a pop-up balloon when
    a visitor clicks on our pin.


    Additional modules needed: GmapEZ (http://drupal.org/project/gmapez).


    # Basic steps


    If you have played with your map, you may have noticed that there is no information
    available when you click on the pin. Google allows you to display information
    in the pins. To do this, we will use the following steps:


    +   1. Adding pop-up info windows to a location is very easy. You simply need
    to add a div tag containing the contents of the info window.

    +   2. Edit the page with your map so that you can change the contents.

    +   3. We will now edit the Parker location to add an info window using the following
    information:

    +   4. The resulting info window will appear as follows when a user clicks on
    it:


    ```

    <a href="http://maps.google.com/maps?q=111+Main+Street,+Parker,+CO&ie=UTF8&ll=39.521985,-104.784765&spn=0.030853,0.077248&z=14&iwloc=cent">

    </a>

    <div>

    Our original Parker location sets the bar.

    At 111 Main Street

    Call 555-111-2222 for reservations

    </div>

    ```


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_236_0.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: '+   5. You can also add images to the info windows, in addition to text.

    +   6. If you add more than one div to a link, the info window will be displayed
    in several tabs, one for each div.


    # Using links to change the map


    Good Eatin'' Goal: Add links to each restaurant location and have the map automatically
    zoom in to the location.


    Additional modules needed: GmapEZ (http://drupal.org/project/gmapez).


    # Basic steps


    If you want to allow customers to be able to jump easily from location to location,
    you can add links within the text surrounding the map, which will cause GmapEZ
    to automatically re-center the map to the location that you linked it to.


    +   1. You will first need to add IDs to each anchor (<a>) tag.

    +   2. For example, we will modify our links as follows.

    +   ```

    +   <a id="original" href="http://maps.google.com/maps?q=111+Main+Street,+Parker,+CO&ie=UTF8&ll=39.521985,-104.784765&spn=0.030853,0.077248&z=14&iwloc=cent">

    +   </a>

    +   ```

    +   3. We can now link to the location from the text by creating another anchor
    tag as follows:

    +   ```

    +   <a href="#original" class="ZOOM">Original Location</a>

    +   ```

    +   4. The #original indicates that the browser should link to the anchor tag
    on the same that has an ID of original.


    # Content sharing, bookmarking, and twittering—oh my!


    After you have built high quality content for your web site, you need to make
    sure that everyone knows about it. One of the best ways to do this is by letting
    your customers add your content to social bookmarking sites such as Digg, del.ico.us,
    technorati and more.


    # Diggin'' Digg It with DiggThis


    Good Eatin'' Goal: Give our customers the opportunity to vote on our content at
    Digg, to help draw traffic to the site.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'Additional modules needed: DiggThis (http://drupal.org/project/diggthis).


    # Basic steps


    Digg is a popular place for people to discover content on the Internet. It works
    by allowing community members to submit content to the site and then allowing
    anyone to vote either for the content by selecting Digg It, or against the content
    by selecting Bury It. Visitors can also comment on content to give more information
    about their votes. Content with the most number of votes is listed first on the
    home page and in each section of the site.


    +   1. Begin by installing and activating the DiggThis module.

    +   2. You can configure the DiggThis module by selecting Content management and
    then DiggThis, from the Administer menu.

    +   3. The first configuration option controls the display of the link as well
    as the content types that should have the Digg button added to them.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_238_0.png)'
  merge: -1
  img_proc: true
- pgno: 239
  md: '4. We can also control some additional **API settings** for Digg. These settings
    control how frequently Digg is updated, and the domain that should be used in
    the display.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_239_0.png)


    5. After configuring the module, a link will be displayed on your site allowing
    users to easily vote for your content on Digg. You can also add a link to the
    site that contains the top-ranked content from your site.


    # Tagging content for del.icio.us!


    *Good Eatin'' Goal:* Allows you to consume content from `del.icio.us` based on
    specified tags.


    *Additional modules needed:* Delicious (`http://drupal.org/project/delicious`).


    # Basic steps


    **del.icio.us** or **delicious.com**, allows you to organize your bookmarks with
    one or more tags. You can also share your bookmark list with other users and search
    the bookmarks by popularity, or by tag.


    +   1. To begin using **del.icio.us**, install and activate the **del.icio.us**
    module.

    +   2. To configure the **del.icio.us** module, select **Site configuration**
    and then **delicious**, from the **Administer** menu. Please note that this module
    may appear at the bottom of the page because the first letter of "delicious" is
    not capitalized.

    +   3. The **del.icio.us** module offers several settings that control whether
    or not it tries to automatically generate tags, and which pages should have the
    **del.icio.us** tags generated.'
  merge: -1
  img_proc: true
