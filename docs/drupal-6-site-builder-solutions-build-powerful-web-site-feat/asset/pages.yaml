- pgno: 317
  md: '14. Administrators can review content that has been flagged as offensive by
    clicking on **Content management** and then **Moderate**.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_317_0.png)


    15. The administrators can click on the **Get More Tickets** link to have additional
    items assigned to them.


    16. Once a ticket has been assigned to them, the administrator can view information
    about the user who submitted the content as well as the user who flagged the content,
    and choose what action to take for the content.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_317_1.png)


    The administrator can either allow the content, or remove the content from the
    web site. The administrator can also optionally send a warning to the user without
    further action.


    # Upgrading to new versions of Drupal


    One of the fantastic things about Drupal is that it is constantly evolving to
    offer new and improved functionalities. However, this requires you to regularly
    check for updates to Drupal and any contributed modules that are installed.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'In this section, we will discuss how to find updates, test them, and install
    them onto your site.


    There are two types of updates that you will encounter. Minor updates will correct
    security issues or problems found by users, and may have minimal functionality
    enhancements. A major update will typically have much more functionality, and
    may be incompatible with the previous versions.


    The version number for Drupal contains two numbers separated by periods. For example,
    version 6.5 indicates major version 6 and minor version 5.


    A custom module will begin with the version of Drupal it is compatible with, followed
    by a major and minor version for the module itself. If a module is compatible
    with all of the minor releases of a Drupal major release, the minor version will
    be represented by an x. For example, version 6.x-1.5 indicates that the module
    is compatible with any version of Drupal 6, and that the major version of the
    module is 1 and its minor version is 5. A module may also indicate development
    versions by adding —dev to the end of the version, a beta version by adding —beta1,
    or a release candidate by adding —rc1 after the version. Multiple beta and release
    candidates are indicated by incrementing the numbers after beta or rc, respectively.


    # Checking for new updates to Drupal and modules


    *Good Eatin'' Goal:* Ensure that we are using the latest versions of Drupal and
    the contributed modules that the site uses.


    *Additional modules needed:* None (core).


    # Basic steps


    Drupal 6 and later makes it easy to check for updates to Drupal and the modules
    that you have installed. By default, Drupal will check for updates to the system
    each time that cron is run.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'You can check the current status of the system by selecting Reports and then
    Available updates, from the Administer menu. Drupal will also display a warning
    when you navigate to any administration page, if it has detected that Drupal,
    or some related content, is outdated.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_319_0.png)


    If you want to, you can click on the Check manually link to ensure that all modules
    are up-to-date.


    If any modules are outdated, they will be shown as follows.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_319_1.png)


    The display includes the version that you have currently installed, the recommended
    version that should be installed, a link to download a new version, and a link
    to the release notes for the new version. The Release notes will include a list
    of changes that have been made to the module. In the next few tasks, we will discuss
    upgrading your installation.


    # Upgrading minor releases


    Good Eatin'' Goal: Upgrade between minor versions.


    Additional modules needed: None (core).'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Basic steps


    When Drupal detects that a new version of Drupal is available, it will inform
    you as mentioned earlier.


    +   1. Before you download and install the new version, you should read all of
    the release notes for the new version, to determine if there are any potential
    incompatibilities with the other modules that you have installed.

    +   2. If you do not see any potential issues based on the release notes, you
    can begin testing the new version yourself.

    +   3. Before installing the new version, make a complete backup of your site
    including all of the files and the database.

    +   4. You should test the new version on a non-production test site, before installing
    it on your live site. If you do not have a test site set up yet, you can create
    a test site on your local computer, in a different location on your web host,
    or on another web host. If you choose to have the test web site hosted at a web
    host, you should make sure that it is not publicly accessible to visitors. This
    will help to ensure that your visitors are not directed to the wrong version of
    your site through search engines.

    +   5. Open the update page of your site, which is available at http://yoursite.com/update.php.
    In order to reach this page, you must be logged in using the administration account,
    which is the first user you created.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_320_0.png)


    +   6. If your test site is not available to the public, you do not need to worry
    about putting the site into maintenance mode.'
  merge: -1
  img_proc: true
- pgno: 321
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Upgrading to a new major release


    Good Eatin'' Goal: Upgrade to a new major release of Drupal.


    Additional modules needed: None (core).


    # Basic steps


    The process of upgrading Drupal to a new major release can be a non-trivial process,
    which you will want to undertake carefully.


    +   1. Begin by verifying that the contributed modules you use have been upgraded
    to be compatible with the latest release of Drupal. This can be done by checking
    the project page for the module on the Drupal.org web site.

    +   2. If a module has not been ported to the latest version of Drupal, you can
    search for a suitable replacement, wait until the module has been upgraded, or
    remove the functionality provided by the module from your site. It may take several
    months after the latest version of Drupal is released for production usage for
    the maintainers to port the module. You can contact the maintainer to see if they
    have a schedule for development, or to see if you can contribute to help cover
    development costs.

    +   3. Once all of the modules that you have installed are available for update,
    you can begin the actual installation process. As before, you should test the
    installation process on a test site before doing it on the production site, to
    ensure that you don''t encounter problems.

    +   4. If you are upgrading a live site, put your site into maintenance mode by
    selecting Site configuration and then Site maintenance, from the Administer menu.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_322_0.png)


    Change the status to Off-line and then click the Save configuration button.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '+   5. Make a complete backup of the files and the database tables that comprise
    your site.

    +   6. Disable all custom modules that you have installed. This will allow you
    to upgrade them later.

    +   7. Switch to a default theme installed with the Drupal core installation.

    +   8. Upload the new Drupal files to your site.

    +   9. Run the upgrade page at http://yoursite.com/update.php, as described in
    the previous task.

    +   10. Download and install the custom modules for your site.

    +   11. Download and install your site theme(s).

    +   12. Run the upgrade script again.

    +   13. Back up the following files, and then remove them from your site.

    +       a) `install.php`

    +       b) `CHANGELOG.txt`

    +       c) `INSTALL.txt`

    +       d) `INSTALL.mysql.txt`

    +       e) `INSTALL.pgsql.txt`

    +       f) `LICENSE.txt`

    +       g) `MAINTAINERS.txt`

    +       h) `UPGRADE.txt`

    +   14. Test your site to ensure that all of the functionalities are working properly.

    +   15. If your site is working properly, you can either repeat the steps on your
    live site, or copy the test site to the live site.

    +   16. If any functionality is not working properly, you can try the upgrade
    process again using your backup, or contact the maintainers of the functionality
    that is not working, so that they can help you to resolve any issues.'
  merge: -1
  img_proc: true
