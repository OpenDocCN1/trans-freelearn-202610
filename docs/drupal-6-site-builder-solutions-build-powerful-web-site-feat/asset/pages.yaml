- pgno: 173
  md: '# Creating a Company Blog


    From this page, users can read recent posts, create a new blog entry (if they
    have permissions to post), comment on posts, or see all the posts that a given
    user has made by clicking on the link to the user''s blog.


    # Creating a blog block


    +   1. The blog block is enabled by selecting **Site building** and then **Blocks**,
    from the Administer menu, to open the **Block Manager**.

    +   2. The **Recent blog posts** block will be in the **Disabled** section. Change
    the **Region** to the **Left sidebar** and then click **Save blocks**.

    +   3. After saving the blocks, the **Recent blog posts** block will be displayed
    on the leftmost side of the screen. It will look similar to this:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_173_0.png)


    # Creating an RSS feed for newsreaders


    *Good Eatin'' Goal:* Publish blogs using RSS feeds, so customers can follow blogs
    in their favorite newsreader.


    *Additional modules needed:* Blog (core).


    Each blog automatically has an RSS feed created for it. RSS stands for Really
    Simple Syndication, and is a technology that allows readers to automatically retrieve
    posts from one or more sites, into a newsreader. The newsreader checks for new
    content at specified intervals and then automatically downloads new posts if they
    are available. This is a fantastic way for a user to get updates from his or her
    company on a regular basis.'
  merge: -1
  img_proc: true
