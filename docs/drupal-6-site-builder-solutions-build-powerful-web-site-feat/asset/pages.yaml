- pgno: 132
  md: "# # Create a VIP role\n\n**Good Eatin' Goal:** Create a VIP role that will\
    \ be used to give special customers enhanced privileges that normal customers\
    \ do not have. Customers must be granted VIP access; they cannot sign up for it.\n\
    \n**Additional modules needed:** None.\n\n# ## Basic steps\n\n+   1. Drupal allows\
    \ you to manage roles for the web site on the **Roles Manager** page, which can\
    \ be accessed by selecting User Management and then Roles, from the **Administer**\
    \ menu.\n+   \n+   2. After you open the **Roles Manager**, Drupal will display\
    \ a list of the roles currently available on your site, and also provide you with\
    \ the ability to add a new role, as shown below:\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_132_0.png)\n\
    \n+   3. Enter **VIP user** for the name and then press **Add role**. Drupal will\
    \ now add the role to the **Roles Manager** as shown below:\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_132_1.png)"
  merge: -1
  img_proc: true
- pgno: 133
  md: '+   4. From the manager, you can edit the role, which will allow you to modify
    the name for the role, or delete the role.

    +   5. Once the role has been created, you need to update the permissions for
    the role so that the user can perform the tasks that they need to. To modify the
    permissions, click on the edit permissions link for the role.

    +   6. Drupal will then display a list of all of the available permissions, arranged
    by category. By default, all permissions are disabled. This prevents new user
    roles from gaining unwanted access. When a user is assigned to more than one role,
    their actual permissions will be a combination of the permissions of each role.
    This means that you should give each role as few permissions as possible, and
    assign multiple roles to a user in order to fully define each user.

    +   7. For our VIP role, we will only add the post comments without approval permission,
    and then click the Save permissions button to finish the changes.


    # Assign users to the VIP role


    Good Eatin'' Goal: Change a registered customer to a VIP customer and let them
    know that they have been given additional privileges.


    Additional modules needed: None.


    # Basic steps


    Now that we have built the new VIP role, we can assign users to the role. Chef
    Wanyama wants to assign his VIPs manually, but you can also allow visitors to
    request a different role, or assign roles at sign-up.


    +   1. To create a new user with a VIP role, we will start at the User Manager,
    which is accessed by selecting User management and then Users, from the Administer
    menu.

    +   2. Next, click on the Add user link. Drupal will display a form where you
    can enter information about the user who is to be added, as shown in the following
    screenshot:'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Users


    This web page allows administrators to register new users. Users'' e-mail addresses
    and usernames must be unique.


    [more help...]


    Username: *

    Spaces are allowed; punctuation is not allowed except for periods, hyphens, and
    underscores.


    E-mail address: *

    A valid e-mail address. All e-mails from the system will be sent to this address.
    The e-mail address is not made public and will only be used if you wish to receive
    a new password or wish to receive certain news or notifications by e-mail.


    Password: *

    Confirm password: *

    Provide a password for the new account in both fields.


    Status:

    ○ Blocked

    ⊙ Active


    Roles:

    ☑ authenticated user

    ☐ VIP user

    ☐ Notify user of new account


    Create new account


    +   3. Enter the required information about the new user, including a password.
    To make the user a VIP user, select the VIP user checkbox in the Roles section.


    +   4. If a user has already signed up, you can add a role for him or her by clicking
    on the user from the User Manager page, clicking on the edit link, and then simply
    selecting the checkbox for the role that you want to add.


    # Notification on sign up


    Good Eatin'' Goal: Set up a notification system so that web site administrators
    can be notified each time a new user registers on the web site. This can help
    you to quickly review new members and follow up with them to ensure that they
    have a positive experience on the site.


    Additional modules needed: Trigger (Core).'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'In order to notify administrators when a user has signed up, we will need to
    do two things. First, we will need to build an action that creates and sends the
    email. The second thing we need to do is create a trigger that tells Drupal when
    the email should be sent. Let''s begin by creating the action.


    # Creating the email action


    +   1. Actions are created by using the **Actions Manager**, which is accessed
    by selecting **Site Configuration** and then **Actions**, from the **Administer**
    menu.

    +   2. As you can see in the following image, there are several basic actions
    that can be used. Alternatively, you can create your own actions.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_135_0.png)


    As there is no basic action for emailing the administrator, we will need to create
    a new action.


    +   3. Begin by selecting **Send email** from the **Advanced Options** drop-down
    list and then click **Create**.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '4. Drupal will then display a form where you can enter information about the
    email that is to be sent, as shown below:


    # Configure an advanced action


    An advanced action offers additional configuration options which may be filled
    out below. Changing the Description field is recommended, in order to better identify
    the precise action taking place. This description will be displayed in modules
    such as the trigger module when assigning actions to system events, so it is best
    if it is as descriptive as possible (for example, "Send e-mail to Moderation Team"
    rather than simply "Send e-mail").


    Description:

    New User Email

    A unique description for this advanced action. This description will be displayed
    in the interface of modules that integrate with actions, such as Trigger module.


    Recipient:

    admin@drupalbyexample.com

    The email address to which the message should be sent OR enter %author if you
    would like to send an e-mail to the author of the original post.


    Subject:

    A New User Registered registered on %site_name

    The subject of the message.


    Message:

    A new user registered on %site_name with the user name %username. To approve this
    user, please login to %site_name. And visit the User Manager.


    The %site_name team.


    The message that should be sent. You may include the following variables: %site_name,
    %username, %node_url, %node_type, %title, %teaser, %body. Not all variables will
    be available in all contexts.


    Save


    5. Click on Save and the action will be added to the Action Manager. You can modify
    the email at any point by clicking on the configure link, or you can delete the
    action by clicking delete.


    # Creating the new user trigger


    We now need to create the Trigger that will determine when our new email is to
    be sent.


    +   1. Begin by enabling the Trigger module, which is installed as part of the
    core Drupal installation.

    +   2. Once the Trigger module has been installed, you can access the Trigger
    manager by selecting Site building and then Triggers, from the Administer menu.
    The Trigger Manager is divided into several sections, depending on its usage.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '3. To access the manager for user-related Triggers, click on the Users tab
    in the Trigger Manager. Drupal will display a list of all possible Triggers, and
    you can assign actions to each as shown in following screenshot:


    # Triggers


    Triggers are system events, such as when new content is added or when a user logs
    in. Trigger module combines these triggers with actions (functional tasks), such
    as unpublishing content or e-mailing an administrator. The Actions settings page
    contains a list of existing actions and provides the ability to create and configure
    additional actions.


    Below you can assign actions to run when certain user-related triggers happen.
    For example, you could send an e-mail to an administrator when a user account
    is deleted.


    [more help...]


    Trigger: After a user account has been created

    New User Email  Assign


    Trigger: After a user''s profile has been updated

    Choose an action  Assign


    Trigger: After a user has been deleted

    Choose an action  Assign


    Trigger: After a user has logged in

    Choose an action  Assign


    Trigger: After a user has logged out

    No available actions for this trigger.


    Trigger: When a user''s profile is being viewed

    Choose an action  Assign


    4. Change the action for the Trigger: After a user account has been created to
    New User Email and then click Assign. Drupal will add the action and save the
    form. The administrator will then be automatically emailed each time a new user
    account is created. If you want to disable this action in the future, simply click
    the unassign link in the Trigger Manager.


    # Working with comments


    In this group of tasks, we will explore Drupal''s built-in functionality to allow
    users to comment on your content. We will cover setting permissions for to determine
    who can comment and also describe the approval process for comments, to help prevent
    unwanted messages from being posted your site.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Enable comments for a node


    Good Eatin'' Goal: Allow registered users to leave comments on a new guest book
    page. All comments must be approved before they are published, unless the customer
    is a VIP customer, in which case their comments will be automatically approved.


    Additional modules needed: None.


    The first step in enabling content for a single page is to create the page by
    clicking on Create content and then Page.


    We will use the following information for our Guest book page.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_138_0.png)


    By setting the Comment settings to Read/Write, users will be able to enter new
    comments on the site.


    If you are creating your own custom content type using CCK there are many more
    settings you can choose from. We discussed many of these options when we built
    our menu item type.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Adding new comments


    Good Eatin'' Goal: Demonstrate how visitors will add comments to the guest book.


    Additional modules needed: None.


    # Basic steps


    When a page has been created with comments enabled, you will find a link at the
    bottom of the page, which a visitor can click to create a comment, as shown:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_139_0.png)


    When the user clicks on the Add new comment link, Drupal displays a form that
    allows the user to enter the subject of the comment and its text.


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_139_1.png)


    After the visitor has entered a comment, he or she can click Preview to review
    the comment and can also make the changes that he or she wants. Otherwise, he
    or she simply clicks on the Save button to save the changes.


    If the user has permissions to post comments without approval, the comment will
    be automatically published. If the user does not have permission to post comments
    without approval, the comment will be placed in the moderation queue.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "# # Manage comments\n\n*Good Eatin' Goal:* Demonstrate how to manage comments,\
    \ view unpublished comments, and either publish the comment or delete it.\n\n\
    *Additional modules needed:* None.\n\n# ## Basic steps\n\n+   1. Comments can\
    \ be viewed in the **Comment Manager**, which can be accessed by selecting **Content\
    \ management** and then **Comments**, from the **Administer** menu.\n+   \n+ \
    \  2. The Comment Manager contains two tabbed pages—one for published comments\
    \ and another for unpublished comments. The unpublished comments are shown in\
    \ the **Approval queue**, which is shown in the following screenshot:\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_140_0.png)\n\
    \n+   3. To approve a comment, simply select the checkbox to the left of the comment\
    \ that you want to approve, make sure that the **Update options** drop-down list\
    \ is set to **Publish the selected comments**, and then click **Update**.\n+ \
    \  \n+   4. If you want to delete a comment, select the comment that you want\
    \ to delete, change the **Update options** to **Delete the selected comments**\
    \ and then click **Update**."
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Setup email notification when comments are posted


    Good Eatin'' Goal: Automatically notify the administrator when a new comment has
    been submitted to the web site.


    Additional modules needed: Trigger (core).


    # Basic steps


    To create automatic notifications for new comments, we will follow a procedure
    similar to the one we used when we added notifications for new user registrations:


    +   1. First, we will build an action that handles emailing the administrator.
    Begin by selecting Site configuration and then Actions, from the Administer menu.

    +   2. Choose Send e-mail... from the Advanced actions drop-down and click on
    the Create button.

    +   3. Fill out the action as follows:


    # Configure an advanced action


    An advanced action offers additional configuration options which may be filled
    out below. Changing the Description field is recommended, in order to better identify
    the precise action taking place. This description will be displayed in modules
    such as the trigger module when assigning actions to system events, so it is best
    if it is as descriptive as possible (for example, "Send e-mail to Moderation Team"
    rather than simply "Send e-mail").


    Description:

    New Comment Email

    A unique description for this advanced action. This description will be displayed
    in the interface of modules that integrate with actions, such as Trigger module.


    Recipient:

    admin@drupalbyexample.com

    The email address to which the message should be sent OR enter %author if you
    would like to send an e-mail to the author of the original post.


    Subject:

    New Comment Added

    The subject of the message.


    Message:

    A new comment was added to the %site_name by %username. Check the moderation queue
    to approve or delete this comment.

    The message that should be sent. You may include the following variables: %site_name,
    %username, %node_url, %node_type, %title, %teaser, %body. Not all variables will
    be available in all contexts.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '+   4. Click **Save** to add the new action to your site.

    +   5. Next, we need to create the trigger that will tell Drupal when to send
    our email. Open the Trigger Manager by selecting **Site building** and then **Triggers**,
    from the **Administer** menu.

    +   6. Go to the comments section within the Trigger Manager and then change the
    value for **Trigger: After saving a new comment** to **New Comment Email**, and
    click on the **Assign** button. Drupal will then send our new email automatically
    whenever a user enters a new comment.


    # Set up user ratings for content


    Chef Wanyama wants feedback about the dishes he creates because he wants to know
    what should be kept on the menu and what could be rotated off. He would like to
    allow visitors to add some more information about the dish when they rate it,
    so we will enable ratings when the visitor adds comments.


    As we need only a single rating, we will use the Fivestar ratings settings for
    the content type, rather than an individual CCK field.


    # Add Fivestar content ratings to a node


    This task will explain how to implement user ratings. For the client site, this
    will demonstrate how to allow users to rate menu items.


    Good Eatin'' Goal: Allow customers to rate their favorite menu items so that Chef
    Wanyama can get feedback on his food, keep popular meals, and remove unpopular
    food.


    Additional modules needed: Fivestar (http://drupal.org/project/fivestar).'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Basic steps


    +   1. First, select the Content Type that you want to add ratings to, by opening
    the Content Type Manager and then editing the Content Type.

    +   2. Expand the Fivestar ratings section, as shown here:


    ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_143_0.png)'
  merge: -1
  img_proc: true
- pgno: 144
  md: '+   3. For Chef Wanyama''s site, we have selected the **Enable Fivestar rating**
    option, and customized the display of the rating. We have also enabled **ratings**
    when the user comments on our menu item.

    +   4. Save the **Content Type** and your changes will be automatically applied.

    +   5. The final change you need to make to your site is to allow users to rate
    content on the web site. This is done by modifying the permissions for the user
    by selecting **User Management** and then **Permissions**, from the **Administer**
    menu. The available permissions are shown in the following screenshot:


    | fivestar module |  |  |  |

    |---|---|---|---|

    | rate content | ☐ | ☐ | ☐ |

    | use PHP for fivestar target | ☐ | ☐ | ☐ |


    We can turn on rating content for both anonymous users and authenticated users,
    which will automatically enable it for all users as all users will either be anonymous
    or authenticated.


    # View content by rating


    *Good Eatin'' Goal:* Allow both Chef Wanyama and the customers to view a list
    of the most popular menu items.


    *Additional modules needed:* Fivestar (http://drupal.org/project/fivestar), Views
    (http://drupal.org/project/views).


    # Basic steps


    To create a display of menu items sorted according to rating, we will need to
    create another view to hold this information. We will include a full display for
    Chef Wanyama and a top-five that which can be included on the home page of the
    site for the visitors.


    +   1. Begin by opening the **Views Manager** and selecting **Site building**
    and then **Views**, from the **Administer** menu.

    +   2. Add a new view by selecting the **Add** link in the **Views Manager**.'
  merge: -1
  img_proc: true
