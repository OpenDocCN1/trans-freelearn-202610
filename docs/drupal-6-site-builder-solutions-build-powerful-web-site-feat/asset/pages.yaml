- pgno: 146
  md: '7. Add a relationship by clicking the + symbol next to the Relationships label.
    We will want the relationship as Node: Voting results as shown in the following
    screenshot:


    Defaults: Add relationships

    Groups:

    Node

    Node: Individual votes

    Votes cast by users on node content.

    Node: Voting results

    The aggregate results of votes cast on node content.


    8. After you have added the relationship, you will be prompted for more details
    of the relationship. We will need to set up this relationship so that any menu
    item that has not been rated will not be eligible. The other settings will control
    how the values are returned, as shown here:


    Defaults: Configure Relationship "Node: Voting results"

    Label:

    Voting results

