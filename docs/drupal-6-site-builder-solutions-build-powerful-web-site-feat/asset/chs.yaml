  \n13. 点击 Save field settings 按钮以完成添加字段。\n\n\n\n\n\n既然内容类型已经完整定义，我们就可以使用这种新的内容类型来构建内容了。\n\
  \n+   1. 首先点击“创建内容”，然后点击“烹饪课程”。\n+   2. 按下图所示输入课程信息，然后点击“保存”完成新课程的添加。\n\n## 创建烹饪课程\n\
