  \n## Controlling access to the content type\n\nGood Eatin' Goal: 修改编辑角色的权限，使编辑可以创建新的菜单项。\n\
  \nAdditional modules needed: None.\n\n## Basic steps\n\n+   1. 我们可以通过编辑每个角色的权限轻松控制谁可以创建菜单项。首先通过从\
  \ Administer 菜单中选择 User management 然后选择 Permissions 打开权限管理器。\n\n## Adding Products\
  \ and Services\n\n+   2. **Permissions Manager** 包含您创建的每个内容类型的详细权限。这些节点列在 **node\
  \ module** 部分。我们将允许用户对菜单项类型执行任何类型的操作，如下所示：\n\n| Permission | anonymous user | authenticated\
  \ user | editor |\n|---|---|---|---|\n| **node module** |  |  |  |\n| access content\
