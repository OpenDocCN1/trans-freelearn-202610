  \n## Working with polls\n\nPolls are a great way to quickly get information from\
  \ your users. Visitors like to answer short polls, especially if the results are\
  \ immediately available and the questions are interesting. In Drupal, polls can\
  \ contain only a single question, along with a set of predefined responses that\
  \ the user can choose from.\n\n### Create a poll\n\nGood Eatin' Goal: Create a poll\
  \ to allow Chef Wanyama to get feedback from customers. The first poll will ask\
  \ customers what their favorite meal is at Good Eatin'.\n\nAdditional modules needed:\
  \ Poll (core).\n\n### Basic steps\n\n- 1. 我们开始构建投票的过程，首先确保 Poll 模块处于活动状态。Poll 模块是作为\
  \ Core Drupal 安装的一部分包含的。\n- 2. 确认该模块可用后，从主导航菜单中选择 Create content 然后选择 Poll。Drupal\
  \ 将打开一个新表单，您可以在其中输入有关投票的信息。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_150_0.png)\n\
  \n- 3. 默认情况下，您有指定两个选择的空间，但您可以通过点击 **Add another choice** 来包含额外的选择。对于我们的 Good Eatin'\
  \ 网站，我们允许访客在 Breakfast、Lunch、Dinner 和 Dessert 之间进行选择。\n- 4. **Poll status** 控制访客是否可以向系统中输入新的投票。如果您想手动管理投票的持续时间，您只需在投票结束时编辑投票并将\
  \ **Poll status** 设置为 Closed 即可关闭投票。\n- 5. **Poll duration** 可用于在指定间隔后自动关闭投票。投票可以保持开放的时间从\
  \ 1 天到 1 年不等。\n- 6. 当您点击 **Save** 时，Drupal 将把投票添加到网站，并允许您对其进行投票，如以下屏幕截图所示：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_151_0.png)\n\
  \n- 7. 设置投票的最后一步是确保用户可以提交投票答案。这是通过 **Permissions Manager** 控制的，可通过从 **Administer**\
  \ 菜单中选择 **User management** 然后选择 **Permission** 来访问。\n- 8. 有多个权限可用于控制对投票的访问，如以下屏幕截图所示：\n\
  \n| Permission | anonymous user | authenticated user | VIP user |\n|---|---:|---:|---:|\n\
  | **poll module** |  |  |  |\n| cancel own vote | ☑ | ☑ | ☑ |\n| create poll content\
  \ | ☐ | ☐ | ☐ |\n| delete any poll content | ☐ | ☐ | ☐ |\n| delete own poll content\
  \ | ☐ | ☐ | ☐ |\n| edit any poll content | ☐ | ☐ | ☐ |\n| edit own poll content\
  \ | ☐ | ☐ | ☐ |\n| inspect all votes | ☐ | ☐ | ☐ |\n| vote on polls | ☑ | ☑ | ☑\
  \ |\n\n- 9. 我们唯一想要授予的权限是所有用户投票和取消投票的能力。选择这些选项，然后点击 Save permissions。\n\n### Adding\
  \ the poll to the home page\n\nGood Eatin' Goal: Add our new poll to the home page\
  \ on the right-hand side, so that customers will see the poll.\n\nAdditional modules\
  \ needed: Poll (core).\n\n### Basic steps\n\n- 1. 我们可以通过创建块将投票添加到主页。我们通过从 Administer\
  \ 菜单中选择 Site building 然后选择 Blocks 来实现此操作。\n- 2. 最新的投票块已经设置好以满足我们的需求，因此我们将位置更改为 Right\
  \ sidebar，如以下屏幕截图所示：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_152_0.png)\n\n\
  - 3. 我们现在可以通过点击 configure 链接来配置显示。我们将限制投票仅在主页上显示，如以下屏幕截图所示。因为我们为主页创建了一个别名，称为 home，我们只需输入\
  \ home。但是，如果您使用的是自动生成的首页，您需要输入 <front>。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_152_1.png)\n\
  \n- 4. 主页上的块如下所示，在投票之前：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_153_0.png)\n\
  \n### Submitting a poll\n\n*Good Eatin' Goal:* Demonstrate how a customer will submit\
  \ his or her answers to our poll.\n\n*Additional modules needed:* Poll (core).\n\
  \n### Basic steps\n\n访客可以通过选择他们喜欢的选项然后点击 **Vote** 来轻松提交投票答案。\n\n投票后，显示将更新以显示投票结果，如下所示：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_153_1.png)\n\n### Viewing poll results\n\
  \nGood Eatin' Goal: Demonstrate how Chef Wanyama can view the poll results, and\
  \ show the results of the poll to customers who have already answered the poll.\n\
  \nAdditional modules needed: Poll (core).\n\n### Basic steps\n\n具有 Inspect all votes\
  \ 权限的用户可以查看针对投票投出的所有投票的列表。这是通过查看投票并点击 Votes 选项卡来列出所有投票，如以下屏幕截图所示：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_154_0.png)\n\
  \n此视图对于确保所有投票都是合法的以及比较注册用户和匿名用户提交的投票非常有用。对于注册用户，将显示他们的用户名；对于未注册用户，将显示他们提交投票的机器的\
  \ IP 地址。\n\n### Upgrading to Advanced Poll\n\nGood Eatin' Goal: Explain some of\
  \ the differences between Poll and Advanced Poll.\n\nAdditional modules needed:\
  \ Advanced Poll (http://drupal.org/project/advpoll).\n\nAdvanced Poll 模块提供了核心 Poll\
  \ 模块中不存在的多个附加功能，包括：除基本投票外另外三种投票系统、增强的投票管理、增强的时间管理、写入投票和改进的显示。\n\n截至撰写本文时，Advanced\
  \ poll 模块尚未移植到 Drupal 6。\n\n\n\n\n\n## 添加用户调查\n\n用户调查支持以更复杂的方式向访问者询问信息。调查可以同时提出多个问题，也可以要求给出比在有限的预定义选项中进行简单选择更复杂的答案。Wanyama\
  \ 厨师将利用用户调查，更全面地了解顾客的用餐体验以及他们对餐厅未来的期待。\n\n## 创建用户调查\n\n*Good Eatin' 目标：* 向 Good\
  \ Eatin' 网站添加一个调查，询问访问者对餐厅各个方面的意见，包括他们对哪些新菜品感兴趣、最喜欢的用餐时间、访问频率等具体信息。\n\n*所需附加模块：*\
  \ Webform 模块（http://drupal.org/project/webform）。\n\n### 基本步骤\n\n- 1. 在站点中安装 Webform\
  \ 模块，并通过模块管理器激活它。\n- 2. 有多个设置用于控制 Webform 模块的基本方面。可通过点击**站点配置**，然后点击**Webform**来访问这些设置。对于\
  \ Good Eatin' 站点，所有默认值都可以接受。\n- 3. 要构建新的 Webform，请从**主**菜单中选择**创建内容**，然后选择**Webform**。Drupal\
  \ 将显示一个表单，允许你构建调查。\n- 4. 表单的第一部分允许你输入标题、描述以及用户完成调查后显示的信息。我们将按照以下截图所示填写此表单：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_156_0.png)\n\
  \n- 5. 表单的下一部分控制哪些用户能够提交表单。默认允许任何人填写调查，这符合我们的需求。\n- 6. 下一部分允许你控制是否将调查结果通过邮件发送给用户，以及如果发送，应发送给谁。我们不会自动通过电子邮件发送调查结果，因此此部分可以保持默认。\n\
  - 7. 我们还将禁用评论，并设置调查的 URL 路径。\n- 8. 最后，我们将为此表单添加一个菜单项，称为**客户调查**，它将出现在我们的主菜单中，使用以下截图所示的设置：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_156_1.png)\n\n- 9. 通过单击“保存”按钮保存表单。\n\n\
  10. 然后，Drupal 将显示一个表单，允许我们向调查添加新问题，如下面的截图所示：\n\n# 客户调查\n\n此页面显示当前为此 Webform 节点配置的所有组件。你可以向表单添加任意数量的组件，甚至可以是同一类型的多个组件。要添加新组件，请填写名称，并从表格底部的字段中选择类型。提交表单以创建新组件或更新任何更改的表单值。\n\
  \n单击任何现有组件的名称即可编辑其设置。\n\n- - 新的 Webform“客户调查”已创建。请使用下面的表单向你的 Webform 添加新字段。\n- -\
  \ 此 Webform 当前未发布。完成对 Webform 的更改后，请使用下面的“发布”按钮。\n\n| 名称 | 类型 | 值 | 必填 | 电子邮件 |\
  \ 操作 |\n|---|---|---|---|---|---|\n|  | 没有组件，请在下方添加一个组件。 |  |  |  | |\n| 新组件名称 |\
  \ textfield |  | ☐ | ☑ | 添加 |\n| 提交 | 发布 |  |  |  | |\n\n11. 要添加新问题，请在“名称”字段中输入问题，并从“类型”下拉列表中选择答案类型。\n\
  \n| 名称 | 类型 | 值 | 必填 | 电子邮件 | 操作 |\n|---|---|---|---|---|---|\n|  | 没有组件，请在下方添加一个组件。\
  \ |  |  |  | |\n| 您用餐的时段 | select |  | ☐ | ☐ | 添加 |\n\n对于调查，大多数问题将是 textfield（用于开放式回答）或\
  \ select（用于是/否或多项选择问题）。对信息满意后，单击“添加”按钮。\n\n12. 现在，你可以自定义问题的可用答案，并选择与问题显示相关的各种其他选项。我们将输入可用答案：早餐、午餐和晚餐，并允许多选。完成选项修改后，单击“提交”按钮添加问题。\n\
  \n13. 其他问题可以类似方式输入。完成所有问题输入后，单击“发布”按钮将调查发布到站点。\n\n## 使用验证码保护调查\n\nGood Eatin' 目标：为调查添加验证码，以帮助防止自动提交调查，防止垃圾信息。\n\
  \n所需附加模块：Webform 模块（http://drupal.org/project/webform），Captcha 模块（http://drupal.org/project/captcha）。\n\
  \n### 基本步骤\n\n- 1. 首先，通过模块管理器安装并激活 Captcha 模块。\n- 2. 然后，我们需要修改 Captcha 模块的设置。可通过从“管理”菜单中选择“用户管理”，然后选择“CAPTCHA”来访问这些设置。\n\
  - 3. 我们需要启用的关键设置是“向表单添加 CAPTCHA 管理链接”选项，如下面的截图所示：\n\n☑ 向表单添加 CAPTCHA 管理链接\n此选项非常有助于在表单上启用/禁用验证挑战。启用后，具有“管理\
  \ CAPTCHA 设置”权限的用户将在所有表单上看到 CAPTCHA 管理链接（管理页面除外，这些页面首先就不应让不受信任的用户访问）。这些链接可以启用所需类型的验证挑战，或将其禁用。\n\
  \n这样，我们就可以将验证码添加到调查中。\n\n4. 你还可以为多个预定义表单配置验证码，指定用户提交每个表单时是否必须回答验证码，指定是否记录不正确的答案，以及每种验证码类型的各个选项。\n\
  \n5. 你可以通过单击“示例”链接查看每种类型验证码的示例。下面截图中显示了几个示例：\n\n# CAPTCHA\n\n此页面概述所有可用的验证挑战类型，并根据其当前设置生成。\n\
  \n模块“captcha”提供的挑战“数学”\n\n数学问题：*\n11 + 0 = \n解决这个简单的数学问题并输入结果。例如，对于 1+3，输入 4。\n\n\
  此挑战的另外 10 个示例。\n\n模块“image_captcha”提供的挑战“图像”\n\n图片中的代码是什么？：*\n从图片中复制字符（注意大小写）。\n\
  \n此挑战的另外 10 个示例。\n\n模块“text_captcha”提供的挑战“文本”\n\n短语“hutobi nohe ayawe iyiloki duki”中的第五个单词是什么？：*\n\
  \n此挑战的另外 10 个示例。\n\n6. 现在，验证码已配置完毕，你可以编辑或直接查看“客户调查”。在页面中，你会找到一个名为 CAPTCHA 的新分区，可以展开它。\n\
  \nCAPTCHA\n在此处为不受信任的用户放置验证码。\n\n用户输入所有回答后，如果不是注册用户，则需要回答验证码问题。\n\n您一周中的哪几天来 Good\
  \ Eatin' 用餐？：\n☐ 星期一\n☐ 星期二\n☐ 星期三\n☑ 星期四\n☐ 星期五\n☑ 星期六\n☐ 星期日\n\n您最喜欢的菜品是什么：\n\
  鳄鱼尾\n\n您希望我们添加什么菜品到菜单中？：\n含鸵鸟肉的菜品\n\nCAPTCHA\n此问题用于测试您是否为人类访问者，并防止自动垃圾提交。\n\n数学问题：*\n\
  13 + 1 = 14\n解决这个简单的数学问题并输入结果。例如，对于 1+3，输入 4。\n\n提交\n\n然后，用户单击“提交”将回答发送到站点。\n\n\
  如果有任何必填信息缺失，或验证码输入错误，用户将被要求更正这些信息，然后可以再次尝试提交回答。\n\n信息成功提交后，用户将进入完成页面，该页面是在你创建调查时设置的。\n\
  \n## 查看调查结果\n\nGood Eatin' 目标：演示 Wanyama 厨师如何查看调查结果。\n\n所需附加模块：Webform 模块（http://drupal.org/project/webform）。\n\
  \nWebform 模块提供了多种查看调查提交结果的方式。这些方式都可以通过打开调查，然后点击“结果”链接来访问。\n\n\n\n\n\n# 表格视图\n\n\
  表格视图以单一且易于阅读的格式显示调查的所有结果，如下图所示：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_163_0.png)\n\
  \n# 下载视图\n\n下载视图允许您将所有调查回复下载到一个逗号分隔的文件中，该文件随后可在 Microsoft Excel 等程序中打开，以便进一步分析。\n\
  \n# 清除\n\n点击“清除”链接将删除网站上的所有调查回复。如果您正在测试调查并希望重新开始，或者您希望在每个月初重新开始调查，此功能会很有用。\n\n#\
  \ 总结\n\n在本章中，我们探讨了向网站访客征集反馈的各种方法，包括评论、评分、投票和调查。使用这些技术将帮助您改进提供给客户的产品和服务。\n\n在下一章中，我们将创建一个公司博客，让\
  \ Wanyama 主厨能够向感兴趣的读者宣传他的餐厅。我们还将从其他网站向 Good Eatin' 站点加载信息流，以利用其他来源的内容。\n"
- "# 5\n\n# 创建公司博客\n\n博客是一系列通常较短的帖子，按倒序时间顺序显示。博客通常允许用户对每条帖子进行评论。通过定期更新的博客，您可以确保您的网站始终拥有新鲜内容，从而保证访客和搜索引擎持续回访。\n\
  \n在本章中，我们将创建一个博客，Wanyama 主厨可以在其中讨论 Good Eatin' 餐厅、烹饪、餐饮业务等内容。他计划利用博客使网站更具互动性，并吸引搜索引擎流量。\n\
  \n每位员工也将有机会拥有自己的博客，如果他们愿意，可以创建博客条目。员工博客将受到监控，帖子在面向公众发布之前将先进入审批队列。\n\n最后，我们将演示用户如何通过\
  \ RSS 信息流查看博客，以及如何将相关博客帖子添加到他们自己的博客中。\n\n## 创建博客\n\n在本节中，我们将讨论如何设置博客模块，以便用户可以创建博客。我们将演示\
  \ Wanyama 主厨如何创建博客帖子，并探讨如何审核博客以及使用替代编辑器来构建博客。\n\n## 设置博客系统\n\nGood Eatin' 目标：设置博客系统，以便\
  \ Wanyama 主厨可以开始发布博客。\n\n所需附加模块：博客（核心）。\n\n### 基本步骤\n\n- 1. 在**模块管理器**中激活博客模块。\n\
  - 2. Drupal 将允许任何拥有 `create blog entries` 权限的用户创建博客。为了更容易控制谁能创建博客，我们将创建一个名为“博客作者”的新角色。要创建新角色，请点击**用户管理**，然后点击**角色**。\n\
  - 3. 输入 **blogger** 作为角色名称，然后点击**添加角色**，如下所示：\n- 4. 创建角色后，点击**编辑权限**链接，以便我们定义该角色可以执行的操作。我们将选择以下设置，如下所示：\n\
  \n| 名称 | 操作 |\n|---|---|\n| 匿名用户 | 锁定 编辑权限 |\n| 认证用户 | 锁定 编辑权限 |\n| VIP 用户 | 编辑角色\
  \ 编辑权限 |\n| blogger | 添加角色 |\n\n| 权限 | blogger |\n|---|---|\n| 博客模块 | |\n| create\
  \ blog entries | ☑ |\n| delete any blog entry | ☐ |\n| delete own blog entries |\
  \ ☑ |\n| edit any blog entry | ☐ |\n| edit own blog entries | ☑ |\n\n这些设置将允许用户维护自己的博客，但不能修改他人的博客。\n\
  \n## 添加新的博客帖子\n\nGood Eatin' 目标：演示 Wanyama 主厨如何在他的博客中添加新帖子。\n\n所需附加模块：博客（核心）。\n\n\
  ### 基本步骤\n\n创建博客帖子类似于构建内容页面。\n\n- 1. 我们将首先点击**创建内容**链接，然后点击主导航菜单中的**博客条目**链接。\n\
  - 2. Drupal 将显示一个表单，您可以输入帖子的正文以及帖子的标题，如下面的截图所示：\n- 3. 当您对帖子文本满意后，只需点击**保存**，您的新帖子将被保存。\n\
  - 4. 如果您不希望访客对特定帖子发表评论，可以展开表单的**评论设置**部分并选择**已禁用**选项来禁用评论。\n- 5. 保存帖子后，最终的博客条目将如下所示：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_166_0.png)\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_166_1.png)\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_166_2.png)\n\n3. 接下来，点击**编辑权限**链接来为我们的审核员角色设置权限。发布博客帖子所需的唯一权限是\
  \ `administer nodes`，如下面的截图所示：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_168_0.png)\n\
  \n4. `administer nodes` 权限还将允许分配到此角色的用户创建、编辑或删除内容，因此您需要确保谨慎分配此权限。选择所需权限后，点击**保存权限**按钮。\n\
  \n## 为博客帖子设置审核\n\n如果您允许许多用户发布博客条目，则在审核博客帖子时，确保所有帖子符合您设定的标准可能会很有用。为此，我们将使用 Drupal\
  \ 的发布功能。\n\n- 1. 我们将首先通过从**管理**菜单中选择**内容管理**，然后选择**内容类型**来编辑博客内容类型。\n- 2. 然后，选择**博客条目**内容类型。\n\
  - 3. 展开**工作流设置**部分，并取消选中**已发布**复选框，如下面的截图所示：\n- 4. 点击**保存内容类型**按钮以更新博客条目类型。\n\n\
  ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_168_1.png)\n\n- 5. 关闭此设置后，所有帖子都将需要手动批准。您可以在**内容管理器**中查看所有需要批准的帖子，该管理器可通过从**管理**菜单中选择**内容管理**，然后选择**内容**来访问。\n\
  - 6. 要仅查看需要审核的帖子，请将**状态**字段更改为**未发布**，然后点击**筛选**按钮。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_169_0.png)\n\
  \n- 7. Drupal 现在将仅显示那些应被审核的项目，如下面的截图所示：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_169_1.png)\n\
  \n- 8. 要批准帖子，您可以选中其**标题**旁边的复选框，将**更新选项**设置为**发布**，然后点击**更新**。或者，您可以编辑帖子并在帖子的**工作流**设置中选中**已发布**复选框。\n\
  \n## 基于关键词自动审核内容\n\nGood Eatin' 目标：根据帖子中输入的内容，添加帖子的自动审核功能。\n\n所需附加模块：操作（核心）、触发器（核心）。\n\
  \n### 基本步骤\n\n强制所有帖子进入审核的一种替代方案是允许帖子自动发布，但如果特定帖子不符合您的指南，则强制对其进行审核。这可以帮助您减少审核时间，并允许大多数帖子在撰写后立即可用。\n\
  \n- 1. 我们将首先创建一个新操作，用于取消发布帖子。从**管理**菜单中选择**站点配置**，然后选择**操作**，以打开操作管理器。\n- 2. 选择一个新的操作**取消发布包含关键词的帖子**，然后点击**创建**。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_170_0.png)\n\nDrupal 现在将显示一个表单，您可以在其中输入帖子应包含的关键词（如果要将其保留以进行审核）。请输入以逗号分隔的词语。如果要用作筛选条件的术语包含逗号，则必须将整个术语括在引号中。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_170_1.png)\n\n\n\n\n\n对于可公开访问的博客，您需要输入垃圾邮件中常用的术语，如\
  \ http、viagra 等。对于公司内部博客，您可能需要根据竞争对手名称或可能表示贬损性帖子的术语来进行审核。当您对术语列表感到满意后，点击**保存**。\n\
  \n- 3. 现在，我们需要在创建新博客文章时触发新操作。从“管理”菜单中选择**站点构建**，然后选择**触发器**。\n- \n- 4. 为确保新帖子和编辑过的帖子都是干净的，我们将设置触发器，以便当用户保存新帖子或更新现有帖子时，执行我们新建的“取消发布包含关键字的内容”操作。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_171_0.png)\n\n- 5. 点击**分配**以保存您的更改。所有符合我们条件（即包含任何指定关键字）的帖子将自动取消发布并放入审核队列。\n\
  \n## 让客户能够阅读您的博客\n\n为了充分利用我们的博客，我们需要确保客户能够轻松找到并阅读它们。\n\n在本节中，我们将探讨向客户展示博客的各种方式。\n\
  \n## 显示可用博客列表\n\n*美食佳肴目标：* 修改网站以显示可用博客列表，以便访问者快速找到他们最喜欢的博客。\n\n*所需附加模块：* 博客（核心）。\n\
  \n既然我们可以创建新的博客文章，就需要让访问者知道这些文章。我们将添加一个链接到博客的菜单，以及一个显示博客中最新帖子的区块。\n\n## 创建博客菜单\n\n\
  - 1. 要启用博客的菜单链接，请从“管理”菜单中依次选择“站点构建”、“菜单”，最后选择“导航”，打开菜单管理器。\n- 2. 在菜单项列表底部，您将找到“博客”菜单项，如下所示：\n\
  - 3. 要激活“博客”菜单，只需选中“已启用”复选框，然后点击屏幕底部的“保存配置”按钮。新的“博客”项将显示在“导航”菜单中。如果您想更改菜单项的名称，可以点击“操作”列中的“编辑”链接。\n\
  - 4. 当用户点击“博客”链接时，他们将被带到一个包含所有博客最新帖子的页面，如下面的截图所示：\n\n| 菜单项 | 已启用 | 展开 | 操作 |\n|---|---|---|---|\n\
  | 博客（已禁用） | ☐ | ☐ | 编辑 |\n| 我的博客 | ☑ | ☐ | 编辑 |\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_172_0.png)\n\
  \n## 创建公司博客\n\n在此页面上，用户可以阅读最近的帖子、创建新的博客条目（如果他们有权发布）、评论帖子，或者通过点击用户博客的链接查看该用户发布的所有帖子。\n\
  \n## 创建博客区块\n\n- 1. 通过从“管理”菜单中选择**站点构建**，然后选择**区块**，打开**区块管理器**，即可启用博客区块。\n- 2.\
  \ **最近博客帖子**区块将位于**已禁用**部分。将**区域**更改为**左侧边栏**，然后点击**保存区块**。\n- 3. 保存区块后，**最近博客帖子**区块将显示在屏幕最左侧。它看起来类似于这样：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_173_0.png)\n\n## 为新闻阅读器创建RSS源\n\n*美食佳肴目标：*\
  \ 使用RSS源发布博客，以便客户可以在他们喜欢的新闻阅读器中关注博客。\n\n*所需附加模块：* 博客（核心）。\n\n每个博客都会自动为其创建RSS源。RSS代表真正简单的聚合，是一种允许读者通过新闻阅读器自动从一个或多个站点检索帖子的技术。新闻阅读器按指定的时间间隔检查新内容，然后自动下载可用的新帖子。这是用户定期获取公司更新的绝佳方式。\n\
  \n要将您网站的RSS源添加到他们的新闻阅读器中，用户需点击RSS链接图标，该图标出现在所有博客的底部，看起来像这样：\n\n实际订阅过程会因网站访问者使用的Web浏览器而有所不同。在Firefox中，过程如下（其他浏览器也使用类似过程）：\n\
  \n点击订阅图标后，系统将询问用户想使用哪个程序来关注该源，如下面的截图所示。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_174_0.png)\n\
  \n用户可以从几种常见的新闻阅读器中选择，也可以选择他们喜欢的应用程序。要完成订阅，他们只需点击“立即订阅”按钮。\n\n## 添加订阅按钮\n\n*美食佳肴目标：*\
  \ 通过提供订阅按钮，使用户能够轻松地将新闻源添加到他们喜爱的阅读器中。\n\n*所需附加模块：* FeedButtons（http://drupal.org/project/feedbuttons）。\n\
  \n## 基本步骤\n\n通过添加一组按钮，您可以让访问者更轻松、更明显地订阅您的博客，这些按钮会自动将您的博客添加到他们的新闻阅读器中。\n\n- 1. 首先在您的网站上安装并激活FeedButtons模块。\n\
  - 2. 通过从**管理**菜单中选择**站点配置**，然后选择**Feed Buttons**设置，即可访问FeedButtons模块的设置。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_175_0.png)\n\
  \n上面显示的按钮只是您可以添加的按钮中的一小部分示例。\n\n- 3. 选择您希望访问者能够使用的按钮，然后点击**保存配置**。\n- 4. 现在我们需要激活该区块。从**管理**菜单中选择**站点构建**，然后选择**区块**，打开区块管理器。将**订阅按钮**区块的位置更改为**右侧边栏**，然后点击**保存区块**按钮。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_175_1.png)\n\n5. 由于订阅按钮有些分散注意力，并且博客不是“美食佳肴”网站的主要功能，我们将限制此区块仅在博客页面上显示。为此，点击该区块的“配置”链接，然后按如下方式设置可见性设置。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_176_0.png)\n\n## 包含来自其他博客的信息\n\n在本节中，我们将把其他网站上与客户相关的博客内容添加到我们的网站。这有助于客户将您视为您所在领域的权威，并使网站对他们更有用。\n\
  \n## 允许您的网站阅读内容\n\n*美食佳肴目标：* 设置聚合器模块以收集其他博客的帖子，并将其显示在“美食佳肴”网站上。\n\n*所需附加模块：* 聚合器（核心）。\n\
  \n## 基本步骤\n\n- 1. 在模块管理器中激活聚合器模块。\n- 2. 现在可以通过从“管理”菜单中点击“内容管理”，然后点击“Feed聚合器”来访问Feed聚合器。\n\
  \n## 创建公司博客\n\n- 3. Feed聚合器有几个可用设置；这些设置可以通过点击**设置**选项卡找到。这些设置如下所示：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_177_0.png)\n\
  \n对于“美食佳肴”网站，默认值都是可以接受的。\n\n- 4. 如果您计划从不同来源导入许多源，最好对它们进行分类，以便访问者轻松找到他们想要的信息。“美食佳肴”网站将有两个类别：食谱和餐厅经营。\n\
  \n- 5. 要添加新类别，请点击**添加类别**选项卡。Drupal将显示一个表单，允许您为类别输入**标题**和**描述**，如下面的截图所示：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_178_0.png)\n\
  \n- 6. 创建类别后，您可以通过点击**列表**选项卡来编辑它们。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_178_1.png)\n\
  \n| 标题 | 项目 | 最后更新 | 下次更新 | 操作 |\n|---|---|---|---|---|\n| 类别概览 |  |  |  |  |\n\n\
  | 标题 | 项目 | 操作 |\n|---|---:|---|\n| 食谱 | 0 个项目 | 编辑 |\n| 餐厅经营 | 0 个项目 | 编辑 |\n\n\
  \n\n\n7. 要向Feed聚合器添加新feed，请单击“添加feed”选项卡。Drupal会显示一个表单，你可以在其中输入feed的URL以及feed的附加信息，如下所示：\n\
  \n## Feed聚合器\n\n以RSS、RDF或Atom格式添加feed。一个feed只能有一个条目。\n\n标题：*\nAllRecipes.com Main\
  \ Dishes\nfeed的名称（或提供feed的网站名称）。\n\nURL：*\nhttp://rss.allrecipes.com/daily.aspx?hubID=80\n\
  feed的完整URL。\n\n更新间隔：\n6小时\nfeed更新之间的时间长度。（需要正确配置cron维护任务。）\n\n新闻条目分类：\n☑ Recipes\n\
  ☐ Restaurant ownership\n新的feed条目会自动归入选中的分类。\n\n保存\n\n为了减少接收feed的网站流量，你应该尝试将“更新间隔”设置与该网站的更新频率保持一致。例如，如果网站声明feed每天或每周只更新一次，那么没有理由每15分钟轮询一次。\n\
  \n8. 对选择满意后，单击“保存”按钮。\n\n9. 创建feed后，它会显示在“列表”页面上，如下面的截图所示：\n\n| 标题 | 条目 | 上次更新 |\
  \ 下次更新 | 操作 |\n|---|---|---|---|---|\n| AllRecipes.com Main Dishes | 0个条目 | 从未 |\
  \ 从未 | 编辑 移除条目 更新条目 |\n\n10. 如你所见，这个feed没有可用条目，且从未更新过。要手动更新feed，请单击“更新条目”链接。\n\n\
  ## 查看feed\n\nGood Eatin'目标：演示feed将如何在Good Eatin'网站上显示。\n\n其他所需模块：无。\n\n### 基本步骤\n\
  \n1. 为了让feed对用户可见，你必须更新用户角色权限。在“管理”菜单中选择“用户管理”，然后选择“权限”。为你希望看到feed的每个用户角色选中“访问新闻feed”复选框，如下面的截图所示：\n\
  2. 如果用户有权限查看新闻feed，他们将在导航菜单中看到“Feed聚合器”菜单项。如果需要，你可以在菜单项中修改或禁用此菜单项。\n3. 当用户单击“Feed聚合器”链接时，会显示当前帖子的列表，如下面的截图所示：\n\
  \n| 权限 | 匿名用户 | 认证用户 | 博客作者 | VIP用户 |\n|---|---|---|---|---|\n| 聚合器模块 |  |  |  |\
  \  |\n| 访问新闻feed | ☑ | ☑ | ☐ | ☐ |\n| 管理新闻feed | ☐ | ☐ | ☐ | ☐ |\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_180_0.png)\n\
  \n4. 访问者还可以按分类或来源显示新闻条目。分类视图如下面的截图所示：\n\n### 分类\n\n### 食谱\n\n- 主菜鱼类和贝类：意大利面包屑鳕鱼\
  \ | 提交者：Verona 7小时51分钟前，AllRecipes.com Main Dishes\n- 酿辣椒：快速简易酿辣椒 | 提交者：Jen 7小时51分钟前，AllRecipes.com\
  \ Main Dishes\n- 油炸：燕麦脆皮鱼 | 提交者：Pierre 7小时51分钟前，AllRecipes.com Main Dishes\n\n更多\n\
  \n来源视图如下：\n\n### 来源\n\n### AllRecipes.com Main Dishes\n\n- 主菜鱼类和贝类：意大利面包屑鳕鱼 | 提交者：Verona\
  \ 7小时53分钟前\n- 酿辣椒：快速简易酿辣椒 | 提交者：Jen 7小时53分钟前\n- 油炸：燕麦脆皮鱼 | 提交者：Pierre 7小时53分钟前\n\
  \n更多\n\n5. 我们还可以通过块管理器为feed添加一个块。除了特定feed的类别外，每个新闻feed分类都有一个块。你可以通过更改位置然后保存块，将这些块添加到站点的任何部分。\n\
  \n| | Feed块 | 位置 | 操作 |\n|---|---|---|---|\n| | AllRecipes.com Main Dishes feed最新条目\
  \ | <none> | 配置 |\n| | 食谱分类最新条目 | <none> | 配置 |\n| | 餐厅所有权分类最新条目 | <none> | 配置 |\n\
  \n## 使用cron作业自动更新feed\n\nGood Eatin'目标：设置一个cron作业，定期自动读取新闻feed并更新Good Eatin'站点。\n\
  \n其他所需模块：无。\n\n### 基本步骤\n\n我们可以通过单击Feed聚合器管理器中的“更新条目”链接手动更新每个feed。然而，如果每天或更频繁地对每个feed执行此操作，可能会耗时且容易出错。Drupal允许你通过cron作业自动执行更新feed的过程。\n\
  \ncron作业是一种按特定时间间隔运行的自动化任务。通过访问http://yoursite.com/cron.php来激活cron作业。每次启动cron作业时，每个已激活的模块都可以运行任务。即使你不使用聚合器，也应该设置cron，因为Drupal使用cron作业执行维护任务，许多其他模块也使用cron执行维护。\n\
  \n设置cron作业的方法取决于你使用的操作系统。如果你的web服务器上运行着控制面板（如cPanel或Plesk），你可能可以在控制面板内配置cron作业。在所有情况下，你都需要指示操作系统按特定时间间隔自动加载你网站上的http://yoursite.com/cron.php页面。\n\
  \n### 在Unix或Linux中设置cron作业\n\n要在Unix或Linux中使用cron作业，你需要安装lynx或wget，并且运行cron作业的用户必须可以使用它们。\n\
  \n1. 使用SSH或其他合适的工具登录服务器。\n2. 在命令行中，输入 `crontab -e` 编辑你的crontab文件。\n3. 使用以下格式在文件中添加新行。\n\
  \   mm hh dd MM ww command\n   其中：\n   mm：命令应运行的分钟（0-59）\n   hh：命令应运行的小时（0-23）\n\
  \   dd：命令应运行的月份中的某天（1-31）\n   MM：命令应运行的年份中的月份（1-12）\n   ww：命令应运行的星期几（0-6），其中0为星期日\n\
  \n要为某个字段指定所有可用时间间隔，请使用 * 作为该字段。\n\n要为某个字段指定多个值，请用逗号分隔。\n\n要指定一个值范围，请用连字符分隔起始值和结束值。\n\
  \n4. 保存文件。\n\n例如，要使用wget每周每天每15分钟运行一次cron，请输入：\n\n```\n0,15,30,45 * * * * /usr/bin/wget\
  \ -O - -q http://yoursite.com/cron.php\n```\n\n要使用lynx在周一至周五的上午10点和晚上7点每天运行两次cron，请输入：\n\
  \n```\n0 10,19 * * 1-5 /usr/bin/lynx -source http://yoursite.com/cron.php\n```\n\
  \n### 在Windows中设置cron作业\n\nWindows使用**计划任务**按特定时间间隔运行任务。\n\n1. 通过选择**开始 | 所有程序 |\
  \ 附件 | 系统工具 | 计划任务**打开“计划任务”对话框。\n2. 单击**添加计划任务**，打开计划任务向导。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_183_0.png)\n\
  \n3. 单击“下一步”，计划任务向导将允许你选择要运行的程序。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_184_0.png)\n\
  \n你可以使用Internet Explorer、Firefox或你选择的任何其他浏览器加载页面。\n\n4. 单击“下一步”，你可以更改任务的运行时间间隔。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_184_1.png)\n\n5. 单击“下一步”，你可以选择要加载页面的时间。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_185_0.png)\n\n6. 如果你想以特定用户身份运行该任务，可以在下一步中输入用户名和密码。在“高级选项”中，你需要修改任务以加载你的cron页面，如下所示：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_185_1.png)\n\n7. 你还可以通过“计划”选项卡修改任务，使任务每天运行多次。\n\
  \n## 设置cron的其他方式\n\nDrupal网站上有关于在各种其他系统上设置cron的丰富信息，请访问 http://drupal.org/cron。\n\
  \n### 使用poormanscron作为更新feed的替代方法\n\nGood Eatin'目标：为没有其他方法创建cron作业的网站设置一个“cron”作业。\n\
  \n其他所需模块：Poormanscron (http://drupal.org/project/poormanscron)。\n\nPoormanscron在每次页面加载时检查是否需要运行cron。这使你可以在一个难以配置传统cron作业的站点上运行cron。这种便利是以性能为代价的，因为Drupal会在每次访问者加载页面时检查是否需要加载cron，这可能会产生显著影响，尤其是在流量很大的网站上。\n\
  \n1. 安装并激活Poormanscron模块。\n2. 在“管理”菜单中选择“站点配置”，然后选择“Poormanscron”，即可获得Poormanscron的设置。设置如下面的截图所示：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_186_0.png)\n\n\n\n\n"
- "# 6\n\n# 新闻通讯与日历\n\n在本章中，我们将添加新功能，让 Wanyama 大厨能够随时向顾客通报 Good Eatin' 餐厅的最新动态。\n\n\
  我们将提供两种新的沟通方式。第一个功能是季刊新闻通讯，顾客可以订阅。新闻通讯将包含 Wanyama 大厨提供的宝贵信息，包括优惠券、新闻、食谱等。\n\n第二个功能是日历，帮助顾客了解\
  \ Good Eatin' 餐厅的近期活动。\n\n## 创建新闻通讯\n\n新闻通讯是一种很好的方式，可以让顾客无需访问你的网站就能及时了解最新信息。顾客喜欢设计精美的新闻通讯，因为这让他们无需定期查看每一个网站，就能随时掌握自己喜爱的场所的动态。\n\
  \n## 创建新闻通讯\n\nGood Eatin' 目标：在 Good Eatin' 网站上创建一个新的新闻通讯，其中包含餐厅的相关新闻，并按季度发送给订阅者。\n\
  \n需要的额外模块：Simplenews (http://drupal.org/project/simplenews)。\n\n## 基本步骤\n\n新闻通讯是各期内容的容器。例如，你可以有一个名为“季节性餐饮指南”的新闻通讯，每年有四期（夏季、秋季、冬季和春季）。顾客订阅新闻通讯后，每一期发布时都会发送给他们。\n\
  \n1. 首先安装并激活 Simplenews 模块，如下所示：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_189_0.png)\n\
  \n此时，我们只需要启用 Simplenews 模块，Simplenews 操作模块可以保持禁用。\n\n2. 接下来，从“管理”菜单中选择“内容管理”，然后选择“新闻通讯”。Drupal\
  \ 将显示一个管理区域，分为以下几个部分：\n\n+   a) 已发送的期次\n+   b) 草稿\n+   c) 新闻通讯\n+   d) 订阅\n\n3.\
  \ 点击“新闻通讯”选项卡，Drupal 将显示一个类似于下面的页面：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_189_1.png)\n\
  \n正如你所看到的，系统已经自动为我们创建了一个以我们网站名称命名的默认新闻通讯。我们可以编辑这个默认新闻通讯，也可以点击“添加新闻通讯”链接来创建新的新闻通讯。\n\
  \n4. 让我们点击**添加新闻通讯**选项来创建我们的季节性新闻通讯。Drupal 将显示一个标准表单，我们可以在其中输入新闻通讯的名称、描述和相对重要性（相对重要性权重）。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_190_0.png)\n\n5. 点击**保存**以保存新闻通讯。现在它将出现在可用新闻通讯列表中。\n\
  \n6. 如果你想修改新闻通讯的**发件人信息**，使用不同于网站默认名称或电子邮件地址的替代信息，你可以在添加新闻通讯时展开**发件人信息**部分，或者点击**编辑新闻通讯**并修改**发件人信息**，如下面的截图所示：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_190_1.png)\n\n## 允许用户注册新闻通讯\n\nGood Eatin'\
  \ 目标：演示注册用户和未注册用户如何注册新闻通讯，并配置注册流程。\n\n需要的额外模块：Simplenews (http://drupal.org/project/simplenews)。\n\
  \n## 基本步骤\n\n+   1. 为了允许顾客注册新闻通讯，我们首先向页面添加一个区块。\n\n+   2. 从“管理”菜单中选择“网站构建”，然后选择“区块”，打开区块管理器。为你希望允许顾客订阅的新闻通讯添加区块，如下面的截图所示：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_191_0.png)\n\n+   3. 现在我们需要通过从“管理”菜单中选择“用户管理”，然后选择“权限”，授予用户订阅新闻通讯的权限。我们将授予所有用户订阅新闻通讯和查看新闻通讯链接的权限，如下所示：\n\
  \n| 权限 | 匿名用户 | 认证用户 | 博主 | VIP 用户 |\n|---|---|---|---|---|\n| simplenews 模块 | \
  \ |  |  |  |\n| 管理新闻通讯 | ☐ | ☐ | ☐ | ☐ |\n| 创建新闻通讯 | ☐ | ☐ | ☐ | ☐ |\n| 删除任何新闻通讯\
  \ | ☐ | ☐ | ☐ | ☐ |\n| 删除自己的新闻通讯 | ☐ | ☐ | ☐ | ☐ |\n| 编辑任何新闻通讯 | ☐ | ☐ | ☐ | ☐ |\n\
  | 编辑自己的新闻通讯 | ☐ | ☐ | ☐ | ☐ |\n| 发送新闻通讯 | ☐ | ☐ | ☐ | ☐ |\n| 订阅新闻通讯 | ☑ | ☑ | ☑\
  \ | ☑ |\n| 查看区块中的链接 | ☑ | ☑ | ☑ | ☑ |\n\n4. 如果顾客没有订阅新闻通讯的权限，区块将显示为如下面的截图所示：\n\n\
  ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_192_0.png)\n\n但是，如果顾客拥有订阅新闻通讯的权限并且已登录网站，区块将显示为如下面的截图所示：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_192_1.png)\n\n如果顾客有订阅权限但未登录，区块将显示如下。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_192_2.png)\n\n+   5. 顾客只需点击**订阅**按钮即可订阅新闻通讯。一旦订阅成功，**订阅**按钮将变为**取消订阅**，以便用户可以轻松退出新闻通讯。如果用户没有该网站的有效账户，他们需要确认确实想要订阅。\n\
  \n## 管理注册信息\n\n*Good Eatin' 目标：*生成所有已注册新闻通讯用户的列表，并演示如何移除可疑用户。\n\n*需要的额外模块：* Simplenews\
  \ (http://drupal.org/project/simplenews)。\n\n## 基本步骤\n\n在顾客开始注册你的新闻通讯后，你可以通过从**管理**菜单中选择**内容管理**，然后选择**新闻通讯**，最后点击**订阅**，查看所有现有订阅的列表。Drupal\
  \ 将显示一个类似于下面图片的页面：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_193_0.png)\n\n你可以筛选显示内容，仅列出特定的新闻通讯，或仅列出某个特定顾客订阅的新闻通讯。要编辑单个订阅，请点击编辑链接。这将显示一个类似于下面的页面：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_194_0.png)\n\n你也可以通过选择要修改的订阅，在“更新选项”下拉列表中选择相应操作，然后点击“更新”按钮，来激活、停用或删除订阅。这允许你移除订阅了你新闻通讯的恶意用户。如果你收到大量无效注册，你可能需要在注册表单中添加验证码。\n\
  \n## 从现有列表导入订阅\n\nGood Eatin' 目标：从你开始使用 Simplenews 管理新闻通讯之前所使用的另一个列表管理系统中导入订阅。\n\
  \n需要的额外模块：Simplenews (http://drupal.org/project/simplenews)。\n\n## 基本步骤\n\n如果你已经有大量新闻通讯订阅者，你可能不想丢弃这个列表，因为一个好的联系人列表需要时间来积累，并且可能为你带来可观收益。\n\
  \n## 新闻通讯与日历\n\n你可以通过点击**新闻通讯**管理页面中的**批量订阅**链接，导入逗号分隔的电子邮件地址列表。这将显示一个类似于下面的页面：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_195_0.png)\n\n只需从你当前的管理系统中复制并粘贴电子邮件地址列表，然后点击**更新**。Drupal\
  \ 将显示已添加的地址列表。\n\n## 创建新闻通讯的新一期\n\n*Good Eatin' 目标：*制作一期新的季节性特惠新闻通讯，准备发送给新闻通讯订阅者。\n\
  \n*需要的额外模块：* Simplenews (http://drupal.org/project/simplenews)。\n\n## 基本步骤\n\n+\
  \   1. 创建新的新闻通讯期次与在 Drupal 中创建任何其他页面类似。我们首先点击**创建内容**，然后点击**新闻通讯期次**。\n\n\n\n\n\n\
  ## 新闻通讯与日历\n\n强烈建议您在将新闻通讯发送给整个订阅列表之前，先发送一份测试新闻通讯，以避免最终版本出现错误。测试地址默认为您站点的管理邮箱地址。您可以在“Simplenews设置”页面中更改测试地址，该页面可通过从“管理”菜单中选择“站点配置”，然后选择“Simplenews”来访问。可用设置如下截图所示：\n\
  \n测试地址\n提供以逗号分隔的电子邮件地址列表，用作测试地址。覆盖功能允许您在新闻通讯编辑表单中覆盖这些地址。\n电子邮件地址：\nadmin@drupalbyexample.com\n\
  允许覆盖测试地址\n\n- 4. 当您对内容满意后，单击“保存”按钮。\n- 5. 在您发送了测试邮件并确认其已正确送达后，您可以通过编辑草稿并将“新闻通讯发送选项”更改为“发送新闻通讯”，将通讯发送给所有订阅者。\n\
  - 6. 一旦新闻通讯被安排发送，每次运行 cron 时，它将发送给订阅者列表中的一部分人。这样做是为了避免使网络过载。您可以通过编辑新闻通讯的“邮件后端设置”来配置每次调用\
  \ cron 时发送的电子邮件数量，该设置可通过从“管理”菜单中选择“站点配置”，然后选择“Simplenews”来访问。可用设置如下截图所示：\n\n邮件后端选项\n\
  使用 cron 发送新闻通讯\n选中后，将使用 cron 发送新闻通讯（推荐）。测试新闻通讯和确认邮件将立即发送。测试目的可保持未选中状态。\nCron 节流：\n\
  20\n设置每次 cron 运行发送的新闻通讯数量。发送失败也会被计数。\n邮件假脱机过期时间：\n立即\n新闻通讯邮件会进行假脱机处理。成功发送后，消息必须在假脱机队列中保留多长时间？将消息保留在假脱机队列中便于进行邮件统计（尚未实现）。如果不使用\
  \ cron，建议立即过期。\n记录电子邮件\n选中后，所有发出的 simplenews 电子邮件都会记录在系统日志中。已记录的电子邮件并不能保证已发送或将被送达。它仅表示消息已发送到\
  \ PHP 的 mail() 函数。PHP 的 mail() 函数不提供有关送达状态的信息。\n\n默认情况下，每次运行 cron 时只发送 20 封电子邮件。如果您频繁运行\
  \ cron，这没有问题；但如果运行频率较低，您可能希望增加每次发送的电子邮件数量。一些网络托管公司为了帮助防止垃圾邮件发送者利用他们的服务器，只允许每个小时发送特定数量的电子邮件。在向大型邮寄列表发送新闻通讯之前，您应该与您的主机服务商确认，以确保您遵守他们的政策。\n\
  \n### 添加日历\n\n日历是吸引顾客定期访问您的网站和店铺的绝佳方式，这样他们就能享受到特价、促销和其他限时活动。\n\n我们将为 Good Eatin'\
  \ 餐厅创建一个基本的事件日历，用于显示音乐会、特殊活动等信息。\n\n### 向日历添加新事件\n\nGood Eatin' 目标：创建一个将显示在日历上的事件。\n\
  \n所需附加模块：Event (http://drupal.org/project/event)。\n\n#### 基本步骤\n\n- 1. 要添加事件，您必须先在“模块管理器”中安装并启用\
  \ Event 模块，如下截图所示：\n\n   ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_198_0.png)\n\n\
  \   启用 Event 模块将创建一个新的 Event 内容类型。还有一些设置可以控制事件的显示方式以及时区的处理方式。\n\n- 2. 要修改时区设置，请从“管理”菜单中选择“站点配置”，然后选择“事件”，最后选择“时区处理”。\n\
  \n- 3. Drupal 将显示一个类似于下图的页面：\n\n   ![](img/b332d58f89551dfc3ae9a7cf47e6a08f_199_0.png)\n\
  \n- 4. 您需要根据大多数用户所在的位置以及您举办的活动类型来自定义这些设置。例如，如果大多数用户在美国，12 小时制可能比较合适；但如果大多数用户在欧洲，24\
  \ 小时制更好。如果活动在线举办，且用户分布在不同时区，那么以用户所在时区显示活动时间是合理的。但是，如果活动在单一地点举办，则使用活动当地时间更合理。对于 Good\
  \ Eatin' 网站，我们将使用网站时区来设置活动，以活动时区显示活动时间，并使用 12 小时制。\n\n- 8. 输入事件的标题和描述，如下截图所示，然后设置事件的开始时间，并可选地设置结束时间。\n\
  \n   创建事件\n\n   标题：*\n   2008年冬季菜单派对\n\n   菜单设置\n\n   正文：\n   欢迎加入我们，共同揭晓我们的 2008\
  \ 年冬季时令菜单。您可以品尝新菜单中的所有菜肴，并享用免费饮品，这些饮品旨在提升菜单的风味。\n\n   在光标处拆分摘要\n\n   输入格式\n\n  \
