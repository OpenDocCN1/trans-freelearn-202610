  \ 322\n    - 在Drupal.org上寻找开发人员 323\n- **小结** 324\n\n## 索引 327\n\n## 本书涵盖内容\n\n\
  *第1章* 向您介绍Drupal和Good Eatin'网站，这是本书中虚构的客户。我们将下载并安装Drupal到我们的网络服务器上，并完成网站的基本设置。\n\
  \n在*第2章*中，我们将开始构建网站内容，并设置导航系统。然后，我们将为网站添加图片和幻灯片。最后，我们将为网站安装自定义主题，以改变网站的整体外观。\n\n\
  在*第3章*中，我们将使用CCK和视图创建餐厅的菜单，显示每餐提供的菜品。我们还将使用分类法对菜单中的内容进行分类。\n\n在*第4章*中，我们将邀请客户通过发表评论、评价内容、填写投票和回答调查来与网站互动。\n\
  \n在*第5章*中，我们构建一个公司博客，让客户能够轻松获得我们公司的及时更新。我们还整合来自其他网站博客的内容。\n\n在*第6章*中，我们创建一个日历，用于显示Good\
  \ Eatin'餐厅的当前活动。我们还将构建一份新闻通讯，以便定期将信息直接发送到客户的收件箱。\n\n在*第7章*中，我们整合来自Flickr、YouTube和Google\
  \ Maps等多个流行网络服务的内容，以增强我们的网站。我们还将讨论将我们的网站发布到Digg和del.icio.us等社交网站。\n\n在*第8章*中，我们将向网站添加可下载内容，包括PDF文件和其他免费赠品。我们还将讨论从我们的页面自动生成可打印内容和PDF文件的方法，以便客户可以保存他们想要的任何内容供将来使用。\n\
  \n在*第9章*中，我们为餐厅设置外卖菜单，并允许客户在我们的电子商务网站上下单并支付。\n\n在*第10章*中，我们将讨论如何维护您的网站，包括备份文件、优化网站，以及在发布新版本的Drupal和自定义模块时更新网站。\n\
  \n在*第11章*中，我们探索如何将本书中学到的技术应用于各种其他类型的企业。我们还讨论将网站开发外包给专业人士，并利用您从本书中获得的知识，确保您以最优惠的价格获得您想要的网站。\n\
  \n## 本书所需条件\n\n要跟随本书中的示例，您需要一台能够运行MySQL和PHP的计算机，这些是Drupal的先决条件。幸运的是，每个主流操作系统都可以运行这些应用程序。您可能想在网站托管公司创建一个帐户来测试您的工作，不过，您也可以使用普通的台式机或笔记本电脑。\n\
  \n您还需要Drupal内容管理系统，可从Drupal.org获取。我们将在第1章讨论下载和安装Drupal。\n\n## 本书适合谁阅读\n\n本书主要面向那些希望为公司创建新网站，或将公司网站升级为更易于维护且具有高级功能的网站的企业主。然而，技术人员也会发现这本书很有用，因为我们将探索大量用于使用Drupal构建网站的模块。\n\
  \n不要求具备网站开发或编程语言方面的经验，但掌握基本计算机技能会很有帮助。\n\n## 排版约定\n\n在本书中，您会发现多种文本样式，用于区分不同类型的信息。以下是这些样式的一些示例及其含义说明。\n\
  \n文本中的代码词如下所示：“要创建列表，请将列表开始标签放在列表开头，并将列表结束标签放在列表末尾。”\n\n代码块将如下所示：\n\n```\n<div class=\"\
  GMapEZ GSmallMapControl\" style=\"width: 600px; height: 480px;\">\n  <a href=\"\
  http://maps.google.com/maps?q=111%20Main%20Street, %20Parker,%20CO\"></a>\n</div>\n\
  ```\n\n当我们要提请您注意代码块的特定部分时，相关行或项目将以粗体显示：\n\n```\n<a href=\"#original\" class=\"ZOOM\"\
  >Original Location</a>\n```\n\n\n\n\n新术语和重要词语以粗体字体引入。你在屏幕上看到的词语，例如菜单或对话框中的词语，在我们的文本中会这样显示：\"\
  Now, click on the edit permissions link to set up the permissions for our moderator\
  \ role\"。\n\n警告或重要说明会以如下框显示。\n\n提示和技巧会这样显示。\n\n## Reader feedback\n\n我们非常欢迎读者的反馈。请告诉我们您对本书的看法，您喜欢或可能不喜欢的地方。读者的反馈对我们开发您真正受益的书籍非常重要。\n\
