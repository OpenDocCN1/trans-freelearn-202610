  \ **Actions** 下最左侧的图标，如上图所示。这将按以下屏幕截图所示显示订单：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_288_1.png)\n\
  \n11. 你还可以使用其他几个视图。如果你接受订单的部分付款，可以使用 **Payments** 选项卡输入每笔分期付款。\n\n## Summary\n\n\
  In this chapter, we have truly integrated the web site into our business by allowing\
  \ users to order from our menu and place orders from the site. You can apply many\
  \ of the same techniques to your own site to make the most of your web site.\n\n\
  For more information about running an online store with Drupal, check out *Drupal\
  \ e-Commerce* by Michael Peacock, also published by Packt:\n`http://www.packtpub.com/drupal-ecommerce/book`.\n\
  \nIn the next chapter, we will discuss essential tasks for administering your web\
  \ site and ensuring that your site stays up-to-date. We will cover backups, installing\
  \ updates to Drupal, and third party modules, along with moderating content.\n"
- "## 10 Keeping a Clean Kitchen\n\nNow that we have built our site and integrated\
  \ it into our business, we need to ensure that our site stays clean and up-to-date.\
  \ In this chapter, we will explore various maintenance tasks to keep our site operating\
  \ at peak performance.\n\nWe will begin by discussing how to back up our web site\
  \ and then restore it again, to protect it against hardware failures or malicious\
  \ users. Next, we will discuss performance tuning to ensure that your site can meet\
  \ any level of traffic demand. Finally, we will review managing and moderating content.\n\
  \nAt the end of this chapter, you will be prepared to publish your web site to the\
  \ world, knowing that you are prepared for anything.\n\n## Web site backups\n\n\
  A strong backup plan is critical for any successful web site. A good backup plan\
  \ will protect against hardware failure, allow you to transfer your web site to\
  \ another host, and allow you to recover from malicious hacking into your web site.\n\
  \nWhen you create a backup plan, you should also test the restoration from this\
  \ backup to make sure that the backup works correctly.\n\nIn this section, we will\
  \ explore ways of performing backups regardless of the host that you are using.\
  \ Your hosting provider may also offer a solution that will back up files and databases\
  \ either one time, or on a recurring basis. If your host does provide backup capabilities,\
  \ you should review them to see if they suit your needs completely, or if you want\
  \ to augment them or replace them with the techniques in this section.\n\n### Manually\
  \ backing up a site\n\n*Good Eatin' Goal:* Back up the web site without using a\
  \ custom backup module.\n\n*Additional modules needed:* None.\n\n### Basic steps\n\
  \nIf you do not want to use a dedicated module to perform your backups, you can\
  \ manually download the files and the database information that make up the site.\
  \ However, this can be more time-intensive and error-prone than using a custom backup\
  \ module.\n\nA manual backup has two steps, in which you must first back up the\
  \ files that make up the site and then back up the database information.\n\nTo back\
  \ up the files for the web site, use the following procedure:\n\n1. Begin by opening\
  \ the utility that you use to transfer files to the web site. This could be an FTP\
  \ client, or an online file manager. My favorite FTP client is FileZilla, which\
  \ is a freely-available open source client. The FileZilla client can be downloaded\
  \ from http://filezilla-project.org/.\n\n2. Select the backup location on your local\
  \ computer to which you want to copy the files, and select the root directory of\
  \ your web server as the remote directory. You may want to date the backup folder\
  \ so that you can maintain a history of the site.\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_292_0.png)\n\
  \n3. Next, download the files to your local directory. If you want, you can compress\
  \ the files into a ZIP file or a compressed archive.\n\n4. To reduce the amount\
  \ of data that you need to download, you should be able to download just the `sites`\
  \ directory, because that folder contains all of the custom files, pictures, themes,\
  \ and modules that you have added to the site, assuming that you have followed all\
  \ of the guidelines in this book.\n\nTo back up the database information, you can\
  \ use your web site provider's database management utility. Many hosts provide phpMyAdmin\
  \ for this purpose. If you are unsure whether or not your host gives you access\
  \ to phpMyAdmin, you can contact their customer support group to check.\n\n1. Begin\
  \ by opening phpMyAdmin and selecting the database that has your site information\
  \ within it. The screen should be similar to the following:\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_293_0.png)\n\
  \n2. If you have multiple databases available on the host, you may need to select\
  \ the database that you want to work with in the drop-down list at the upper left\
  \ corner of the screen.\n\n3. Next, select the Export tab at the top of the screen.\
  \ phpMyAdmin will prompt you to select the tables that you want to download and\
  \ the format that you want to download in, as shown in the following screenshot:\n\
  \n\n\n\n\n当你准备好从备份恢复网站时，你只需反向执行该过程。\n\n1. 你应始终导入到一个空白数据库中，以避免与现有数据发生冲突。你可以删除或清空现有数据库中的所有表，或者创建一个新数据库来导入数据。\n\
  2. 清理完数据库后，在 phpMyAdmin 中选择 Import 选项卡。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_295_0.png)\n\
  \n3. 现在导航到你之前导出的文件，然后点击 Go 开始导入。你可能需要在导入数据之前删除数据库中的所有表，具体取决于你在导出数据时选择了哪些选项。\n4.\
  \ 要重新加载文件，只需打开你的 FTP 客户端，选择创建备份时所使用的相同目录，然后上传文件，而不是下载它们。\n\n## 自动网站备份\n\nGood Eatin'\
  \ Goal: 备份网站以便轻松恢复。\n\nAdditional modules needed: Backup and Migrate (http://drupal.org/project/backup_migrate)。\n\
  \n### 基本步骤\n\n虽然你可以手动备份文件和数据库，但此过程可能耗时且容易出错。幸运的是，Backup and Migrate 模块使此过程变得更容易，并优化备份以排除不必要的数据。\n\
  \n1. 首先下载并安装 Backup and Migrate 模块。\n2. 你现在可以通过从 Administer 菜单中选择 Content management\
  \ 然后 Backup and Migrate 来备份你的数据。\n3. Backup and Migrate 模块允许你完全自定义创建的备份文件。你可以控制备份中包含哪些表，以及是否备份表中的数据。默认情况下，Backup\
  \ and Migrate 模块不会备份缓存信息、会话信息或 watchdog 信息，因为这些表中的数据是临时的，可以轻松重新创建。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_296_0.png)\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_296_1.png)\n\n4. 你还可以从多种其他选项中进行选择，这些选项控制结果文件的命名方式、压缩方式以及保存位置。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_297_0.png)\n\n5. 设置好选项后，点击 Backup Database\
  \ 开始备份过程。如果你选择了 Download 选项，文件将被发送到你的计算机以便存储。如果你选择 Save to Files Directory 选项，备份文件将保存在服务器上，以便你稍后可以直接从服务器或使用\
  \ Saved Backups 选项卡下载。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_297_1.png)\n\n\
  6. 如果你希望 Backup and Migrate 模块定期自动备份你的数据库，你可以通过点击 Backup Schedule 选项卡按指定间隔安排备份，如图所示：\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_298_0.png)\n\n请注意，Backup and Migrate\
  \ 模块创建的备份不包括网站文件，因此你仍需独立备份这些文件。你可以通过仅备份用户可以上传的文件来最小化备份文件大小。这些文件通常存储在 files 目录中。备份文件的过程与手动备份部分中使用的过程相同。\n\
  \n## 从备份恢复网站\n\nGood Eatin' Goal: 从 Backup and Migrate 模块创建的备份文件恢复信息。\n\nAdditional\
  \ modules needed: Backup and Migrate (http://drupal.org/project/backup_migrate)。\n\
  \n### 基本步骤\n\n恢复由 Backup and Migrate 模块创建的备份是一个简单的过程。\n\n1. 通过从 Administer 菜单中选择\
  \ Content management 然后 Backup and Migrate 导航到 Backup and Migrate 管理器。\n\n2. 接下来，点击\
  \ Restore/Import DB 选项卡。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_299_0.png)\n\
  \n3. 导航到你的备份文件的位置。\n\n4. 选择备份文件后，点击 Restore Database 开始恢复过程。请仔细阅读所有显示的警告，并在在生产站点上运行之前先在站点的测试安装上测试导入。如果你确定要继续导入，请同意确认并点击\
  \ restore。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_299_1.png)\n\n5. 如果服务器文件系统未完全更新，你可能还需要导入任何已保存的文件。我们之前在手动备份部分讨论过这一点。\n\
  \n## 网站优化\n\n如果你的网站有中等到大量的访客，你应该为最佳性能调整你的网站。这将确保所有访客都有良好的体验，而不会因加载页面或访问网站的延迟而感到沮丧。\n\
  \n我们将讨论优化后端数据库和向访客显示信息的前端网站的方法。\n\n### 优化数据库表\n\n*Good Eatin' Goal:* 优化存储站点内容的数据库，以确保最佳性能。\n\
  \n*Additional modules needed:* DB Maintenance (http://drupal.org/project/db_maintenance)。\n\
  \n#### 基本步骤\n\n当数据库像 Drupal 数据库一样频繁使用时，随着时间的推移它可能会变得不够优化，因为在每个表中插入和删除大量记录会导致数据库出现浪费空间的情况。所有数据库都允许你运行优化过程，该过程会删除未使用的空间并重建索引以使信息搜索更快。\n\
  \n**DB Maintenance** 模块可以在 cron 运行期间自动为你执行优化过程。\n\n1. 首先下载并安装 **DB Maintenance**\
  \ 模块。\n2. 你可以通过从 **Administer** 菜单中选择 **Site configuration** 然后 **DB maintenance**\
  \ 来编辑 **DB Maintenance** 模块的设置。\n3. 设置允许你控制多个选项，包括：\n   - a) 是否在每次优化时写入日志。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_300_0.png)\n\
  \n   - b) 表优化的频率，选项从每小时到双月，或每次 cron 运行。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_301_0.png)\n\
  \n   - c) 最后，你可以控制优化哪些表。这允许你不对不经常更改的表进行优化，从而使维护任务更快完成。\n\n配置好设置后，你只需保存设置，DB maintenance\
  \ 模块将在指定的间隔自动执行优化。\n\n### 使用缓存提高性能\n\nGood Eatin' Goal: 使用缓存提高内容显示的性能。\n\nAdditional\
  \ modules needed: None.\n\n#### 基本步骤\n\n由于动态生成的页面，例如使用 Drupal 创建的页面，生成起来可能耗时且资源密集，Drupal\
  \ 使用复杂的缓存机制来预加载内容部分以供用户显示。\n\n要设置 Drupal 缓存，请执行以下步骤：\n\n1. 通过从 Administer 菜单中选择\
  \ Site configuration 然后 Performance 来访问 Drupal 缓存的设置。\n\n2. 设置的第一部分与 Page cache\
  \ 有关，该缓存用于缓存整个页面数据。Page cache 系统仅为匿名用户缓存页面，以防止一个用户的个人数据被其他用户看到，并且因为只有在为匿名用户提供缓存内容时才能更简单地确保页面被成功缓存。\n\
  \n#### Page cache\n\n启用页面缓存将提供显著的性能提升。Drupal 可以存储并发送匿名用户请求的压缩缓存页面。通过缓存网页，Drupal\
  \ 无需每次查看时都重建页面。\n\n##### Caching mode:\n\n- Disabled\n- Normal (recommended for\
  \ production sites, no side effects)\n- Aggressive (experts only, possible side\
  \ effects)\n\n正常缓存模式适用于大多数站点且不会产生任何副作用。激进缓存模式会导致 Drupal 在提供缓存页面时跳过已启用模块的加载（boot）和卸载（exit）。这会带来额外的性能提升，但可能导致不必要的副作用。\n\
  \n以下已启用模块与激进模式缓存不兼容，将无法正常运行：poormanscron, uc_cart, uc_store。\n\n大多数站点应启用 Normal\
  \ 缓存，因为这可以在没有任何不良副作用的情况下显著改善访客的加载时间。\n\n3. 如果你选择使用 Aggressive site caching，你需要了解可能出现问题的模块。Drupal\
  \ 会为你识别这些模块并以红色突出显示。只有在没有潜在不兼容性时，或模块维护者声明潜在不兼容的模块可与 Aggressive caching 一起使用时，才应启用\
  \ Aggressive 缓存。一些模块由于在页面正常加载时运行的初始化或清理代码，而在激进缓存时不运行，因此与 Aggressive 模式不兼容。\n\n4.\
  \ 如果你的站点异常繁忙，你可能希望强制执行最小缓存生命周期，即 Drupal 在重建缓存页面之前等待的最短时间。如果你站点更新不频繁，你可以通过将此数字增加到与更新计划相匹配来获得性能提升。\n\
  \n##### Minimum cache lifetime:\n\n5 min\n\n在高流量站点上，可能需要强制执行最小缓存生命周期。最小缓存生命周期是在缓存被清空并重新创建之前经过的最短时间，并适用于页面和块缓存。更大的最小缓存生命周期提供更好的性能，但用户将更长时间看不到新内容。\n\
  \n\n\n\n\n5. 页面压缩控制缓存的页面是否被压缩。除非你的 Web 服务器自动缓存所有网页，否则此项可保持启用状态。\n\n页面压缩：\n○ 已禁用\n\
  ● 已启用\n默认情况下，Drupal 会压缩其缓存的页面以节省带宽并提高下载速度。当使用执行压缩的 Web 服务器时，应禁用此选项。\n\n6. Drupal\
  \ 还提供块缓存，它仅缓存块的内容而不是整个页面。与页面缓存不同，块缓存适用于匿名用户以及已登录网站的用户。\n\n块缓存\n启用块缓存可以通过防止每次页面加载时重建块，从而为所有用户提供性能提升。如果页面缓存也已启用，则启用块缓存带来的性能提升主要惠及已认证用户。\n\
  块缓存：\n○ 已禁用\n● 已启用（推荐）\n请注意，当启用定义内容访问限制的模块时，块缓存处于非活动状态。\n\n7. Drupal 提供的最后一种优化类型与最小化发送给用户的内容量有关，通过将每个模块创建的\
  \ CSS 文件和 JavaScript 文件合并为单个 CSS 文件和单个 JavaScript 文件，用户只需下载一次。这些选项在你使用私有文件系统时会被禁用。如果你想使用这些选项，你需要在网站上使用公共文件系统。\n\
  \n## 带宽优化\n\nDrupal 可以自动优化外部资源，如 CSS 和 JavaScript，这可以减少对网站发出的大小和请求数量。CSS 文件可以聚合并压缩为单个文件，而\
  \ JavaScript 文件会被聚合（但不压缩）。这些可选优化可能会降低服务器负载、带宽需求和页面加载时间。\n\n如果你尚未设置文件目录，或下载方法设置为私有，则这些选项将被禁用。\n\
  \n### 优化 CSS 文件：\n\n- 已禁用\n- 已启用\n\n此选项可能会干扰主题开发，应仅在生产环境中启用。\n\n### 优化 JavaScript\
  \ 文件：\n\n- 已禁用\n- 已启用\n\n此选项可能会干扰模块开发，应仅在生产环境中启用。\n\n8. 尽管 Drupal 缓存使你的网站更快并为用户提供更好的体验，但它可能会干扰你对网站的开发，因为缓存可能会阻止你看到网站最新更改。如果你是这种情况，你可以通过单击清除缓存数据按钮来清除缓存数据。\n\
  \n## 清除缓存数据\n\n缓存数据可提高性能，但在排查新模块、主题或翻译时，如果已缓存过时信息，可能会导致问题。要刷新网站上的所有缓存数据，请单击下面的按钮。警告：高流量网站在重建缓存数据时将出现性能下降。\n\
  \n清除缓存数据\n\n## 维护内容\n\n随着你继续向网站添加内容，你需要确保内容得到适当审核，旧内容被删除，并且对网站内容的更改得到跟踪。\n\n###\
  \ 创建内容修订\n\n*Good Eatin' Goal:* 创建内容的修订版以确保你拥有网站内容更改的完整记录。\n\n*Additional modules\
  \ needed:* 无。\n\n#### 基本步骤\n\n在本书中，我们只是根据需要更新页面以添加新功能和内容。然而，如果你有许多编辑、内容经常更改、需要查看页面的历史记录，或需要轻松返回页面的旧版本，你将希望存储页面的多个修订版。\n\
  \n为此，请执行以下步骤：\n\n1. 编辑你想要创建新修订的内容。\n2. 根据需要进行更改，并在保存之前展开 **Revision information**\
  \ 部分。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_305_0.png)\n\n3. 选择 **Create new\
  \ revision** 选项并输入描述对节点所做更改的消息。\n4. 保存内容后，你将看到一个名为 **Revisions** 的新标签。单击此标签将显示为该页面创建的所有修订列表。\n\
  \n## 比较内容修订\n\n*Good Eatin' Goal:* 比较页面两个不同修订版的文本。\n\n*Additional modules needed:*\
  \ Diff (`http://drupal.org/project/diff`)。\n\n### 基本步骤\n\n尽管 Drupal 中创建修订的内置功能运行良好，但很难审查每个修订中进行的更改。**Diff**\
  \ 模块使比较修订变得非常容易。\n\n1. 首先安装并激活 **Diff** 模块。\n2. 要使用 **Diff** 模块，只需查看任何页面的修订。你会注意到\
  \ **Revisions** 列表已更改，允许你选择要比较的修订。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_307_0.png)\n\
  \n3. 选择要比较的修订，然后单击 **Show diff** 按钮。Drupal 然后将显示有关已更改、添加或删除的文本的信息。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_307_1.png)\n\
  \n## 审核内容\n\n*Good Eatin' Goal:* 找到可疑或冒犯性的内容，并轻松将其从网站中删除。\n\n*Additional modules\
  \ needed:* Modr8 (http://drupal.org/project/modr8)。\n\n### 基本步骤\n\n网站在互联网上存在的一个不幸副作用是，在某个时候，恶意用户会尝试在你的网站上发布不适当的内容。如果你的网站非常繁忙，你可能会发现自己需要审查和批准大量内容。\n\
  \n**Modr8** 模块可以帮助你管理工作量，并可以向用户发送电子邮件，让他们知道其内容何时被批准或拒绝。\n\n1. 首先安装并激活 **Modr8**\
  \ 模块。\n2. **Modr8** 模块的设置可以通过从 **Administer** 菜单中选择 **Site configuration** 然后 **Modr8**\
  \ 来访问。\n3. 基本设置控制日志被删除的频率。或者，你也可以选择永久保留日志。你还可以更改一次显示在审核队列中的项目数量，以及需要审核的内容的默认操作。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_308_0.png)\n\n4. 你还可以配置审核队列的电子邮件设置，包括电子邮件的文本，以及在用户的内容被批准和/或被拒绝时是否向发布内容的用户发送电子邮件。你还可以选择在审核员未对项目采取行动并且想要向作者发送通知时发送电子邮件。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_309_0.png)\n\n5. 如果你希望新内容自动添加到审核队列中，你可以编辑内容类型并在工作流部分中选择\
  \ In moderation queue 设置。\n\n6. 要查看审核队列，请从 Administer 菜单中选择 Content management 然后\
  \ Moderated content。\n\n7. 审核队列如下所示：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_310_0.png)\n\
  \n8. 从此页面，你可以批准、删除或推迟对任何需要审核的内容采取行动。做出更改后，单击 Save 以完成你的选择。你还可以通过单击 Reports 然后 Content\
  \ moderation log 来显示所有审核操作的日志。审核日志如下所示：\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_310_1.png)\n\
  \n## 允许用户举报可疑或冒犯性内容。\n\nGood Eatin' Goal: 获取用户的反馈以了解他们认为冒犯的内容，以便可以删除有问题的內容。\n\n\
  Additional modules needed: Abuse (http://drupal.org/project/abuse)。\n\n### 基本步骤\n\
  \n在上一个任务中，我们回顾了允许你审核添加到网站的每条内容的方法。然而，如果你收到的可疑内容比例很低，这可能是一项耗时的任务。如果是这种情况，你可以允许用户帮助你审核内容，使用\
  \ Abuse 模块，让他们报告他们认为冒犯的项目。\n\n\n\n\n\n该策略有几个优点。首先，你无需在内容发布前预先批准所有内容，从而免除了维护负担。其次，它确保内容符合社区标准，而不是让你或你的编辑负责定义社区标准。\n\
  \nAbuse 模块还包含一个 Watchlist 组件，允许你将内容标记为可疑或禁止，并自动将其移入管理员审核队列。\n\n- 1. 首先下载并安装 Abuse\
  \ 和 Watchlist 模块，两者均包含在 Abuse 安装包中。\n- 2. 我们将首先编辑 Watchlist 设置，可通过 Administer 菜单选择\
  \ Site configuration 然后 Watchlist settings 来访问。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_311_0.png)\n\
  \n- 3. 你可以根据目标受众和网站需求，在 Watch 列表和 Filtered/banned 词列表中添加任意词语；只需确保每行输入一个词。Watch 列表中的项目可在审核队列中查看，而\
  \ Filtered/banned 词列表中的项目在审核前会被隐藏。\n\n4. 你还可以根据上面配置的 Watchlist 词设置，控制哪些项目会自动添加到\
  \ Watch 列表或禁止列表中。\n\nEnable moderation from the watchlist and banned list for these\
  \ content types\n\n如果在 watchlist 中找到匹配项，内容将被标记到待处理堆中（用户仍可查看该项目）。如果匹配项来自 bannedlist，内容将被标记到隐藏堆中（对用户隐藏）。用户仅会针对禁止词进行验证。\n\
  \n☐ webform\n☑ blog\n☐ poll\n☐ dir_listing\n☐ image\n☐ product\n\n5. 你还可以强制对更容易被滥用的特定类型进行审核。\n\
  \nEnable pre-moderation from the watchlist and banned list for these content types\n\
  \n内容将根据滥用模块设置被标记\n\n☐ webform\n☐ blog\n☐ poll\n☐ dir_listing\n☑ image\n\n6. 我们现在可以通过\
  \ Administer 菜单选择 Site configuration 然后 Abuse Moderation settings 来修改 Abuse Moderation\
  \ 设置。\n\n如果你的网站有多个审核员，可以选择 **Abuse Assigned Moderators** 选项。如果使用此选项，你还需要存储添加到审核员队列中因滥用而被标记的最大项目数。如果审核员位于不同时区，可以设置一天中的某个小时清空所有审核队列，以便项目不会在审核队列中停留过长时间。\n\
  \n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_314_0.png)\n\n**Abuse threshold** 控制在项目被移入审核队列前必须注册的投诉数量。3\
  \ 是一个不错的起点，但你可以根据网站需求增加或减少阈值。\n\n10. 你可以通过选择 Site configuration，然后 Abuse Moderation\
  \ settings，最后 Abuse Moderation reasons，从 Administer 菜单编辑标记项目为滥用的原因。\n\n![](img/b332d58f89551dfc3ae9a7cf47e6a08f_315_0.png)\n\
  \n所有可用原因将以与上方示例类似的格式列在页面上。你可以从此页面添加新原因、删除原因或更改原因文本。\n\n11. 在激活滥用模块之前，你需要为用户分配权限，以便他们可以标记内容以供审核。\n\
  \n| Permission | anonymous user | authenticated user | blogger | Store Administrator\
  \ |\n|---|---|---|---|---|\n| abuse module | | | | |\n| administer abuse reports\
