    ever) in automation, but I can see how they might be useful if you want to style
    your board and make the robots do it instead of yourself.


    Real-world example


    When a vote is added to a card, add a **checkmark** sticker to the card.


    Okay, maybe this is just a style thing, but it still gives your cards a way to
    stand out and sometimes that helps you take action on them!


    # # Add/remove a link


    If you want to add an attachment to a card, such as a link to an article or a
    file, you can add that with this action. You can even make the automation'
