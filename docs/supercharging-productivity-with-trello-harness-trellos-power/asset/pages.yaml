- pgno: 59
  md: '# Figure 2.8 – The due date reminder options


    You can set a reminder for a card from the moment it’s due up to two days before.
    If you need something further ahead, this is possible, but only with Trello automation.
    We’ll cover due date automation more in Part 2.


    The reminders will appear wherever you have Trello notifications configured. For
    instance, if you allow notifications in the mobile app, you’ll receive a push
    notification about a card at the time you set it. You’ll also receive an email
    or desktop notification if you have those types of notifications configured.


    It’s also important to note that anyone who is a member on the card or watching
    it will receive reminders about the due date – not just you!


    If you’d prefer to not receive notifications about a card that is due, simply
    leave this field as is, since the default option is **None**.


    When you’re satisfied with your start date, due date, and reminder configurations,
    click the blue **Save** button at the bottom of the card.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_59_0.png)


    # Figure 2.9 – How the start and due dates appear on the front of a card


    If you want to clear the dates from a card, click the gray **Remove** button.


    The card dates will be visible in the card details above the description and below
    the card name when the card is open, and they are also visible from the Board
    view, so you can reference the dates without needing to open the card.


    # Members'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'The **Members** field allows you to assign team members to a task or project.
    This field is handy to track who is responsible for parts of a task and divide
    responsibilities across multiple teammates.


    Why use members?


    Adding members to cards is key to ensuring that task owners are notified about
    their projects and are aware of any changes happening to things they’re working
    on. It’s also useful to separate tasks on a board so that each person can filter
    it to only see their tasks, while project managers can still use the board to
    view everything in one place.


    Using the Timeline view, you can also view cards plotted by date and member, which
    is a helpful way to understand bandwidth and capacity for a given period. We’ll
    talk more about views in <u>_Chapter 4_</u>. If you are using the free version
    of Trello, you can still view cards organized by members in lists with the Swimlanes
    Power-Up. We’ll talk more about Power-Ups in _Part 3_.


    # # Adding members to a card


    Open a card by clicking it from the board. From the card back, select the **Member**
    button that appears at the top of the **Add to card** menu. This opens the **Members**
    modal.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_60_0.png)


    Figure 2.10 – The Members modal'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'Search for a member who is part of the board or select them from the names
    listed. If a user is already a member of a card, a checkmark appears next to their
    name. The member will receive a notification that you added them to the card.


    To remove a user from a card, click their name to de-select them. They will also
    receive a notification about their removal.


    You can add as many members to a card as you like. If you want to add someone
    but don’t see them listed, you’ll need to add them to the board first. Go back
    to Chapter 1 if you need a refresher on adding a user to a board.


    All members of a card appear with their avatar just below the card title. They’re
    also visible from the front of a card so that you can see who is assigned without
    opening a card.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_61_0.png)


    Figure 2.11 – The member section of a card


    # # Watching


    When someone is a card member, their avatar appears on the card, and they’re assigned
    the item. However, sometimes you might want notifications about activities that
    happen on a card without it being assigned to you in Trello. You can do this in
    Trello, and it’s called **watching**.


    Why watch a card?'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Watching a card is useful when you need notifications about a card but don’t
    want it to appear as one of your designated tasks. It’s also great for when the
    results of a task are relevant to you but there’s no action you can take to make
    progress on the card.


    # # Configuring watching on a card


    Open a card and look just below the name to see a section called **Notifications**.
    Below that, there’s a gray **Watch** button with an eye icon.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_62_0.png)


    Figure 2.12 – The watch section of a card


    By default, the box is unchecked. Click the button to begin watching the card.
    A checkbox appears next to **Watch**, and an eye icon appears near the top of
    the card next to the list name.


    To stop watching a card, click the **Watch** button again to remove the check.


    # # Comments and activity details


    The bottom section of a Trello card offers a log of activities on the card as
    well as comments added from users. The comments are particularly useful to communicate
    with team members or provide updates on the status of a task or project.


    Why use comments?


    Comments are useful to discuss anything that relates to a card. Rather than needing
    to send emails or messages over Slack, it’s easier to have a conversation within
    the card itself. Comments are always saved to cards,'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'and even when a card is archived, you can still access the card and see the
    comments, showing a historical account of any decisions made relating to that
    task or item.


    # # Commenting on a card


    To add a comment to a card, open it by clicking it from the main board, and then
    scroll to the bottom of the card, below the description and any checklists or
    attachments. You’ll see a section called **Activity**, and below that is an input
    field to type a comment.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_63_0.png)


    Figure 2.13 – The comment section of a card


    Click the field and start typing some text. You can attach files, mention another
    user to send them a notification, add emojis for style, or even reference another
    card. When you’re finished, click the blue **Save** button just below your text.


    After you’ve posted, you can still edit or delete a comment with the actions below
    it. If someone else has posted a comment, you’ll see options to **reply**, which
    automatically starts a new comment and mentions the user.


    Finally, you can react to comments. Click the emoji button below a posted comment
    and select from one of the options, or search for the right one.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_64_0.png)


    Figure 2.14 – The emoji picker to react to comments


    # # Activity details


    In between comments on a card, you will see other updates about things happening
    on a card, such as changes to members, dates, labels, custom fields, attachments,
    or even a description. While this is typically helpful when you want to see what
    happened to a card or aren’t sure who changed a field on a card, if you find these
    updates unnecessary or cluttering up your card, you can turn them off. Click **Hide
    Details** to remove those updates and only show comments.


    If you ever change your mind, you can bring them back by clicking **Show Details**.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_65_0.png)


    Figure 2.15 – Activity details listed at the bottom of a card


    # # Card actions


    We’ve already discussed a lot of things you can do to a card, but everything we’ve
    mentioned so far mostly refers to adding information. There are a few more important
    actions you can take with cards.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_65_1.png)


    Figure 2.16 – The card action menu'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The card action menu is found on the right side of a card at the very bottom
    of the card options, below any Power-Ups and automation buttons. These actions
    are useful to do something with the entire card:


    +   - **Move**: Use this action to move a card to another list or board. You can
    specify the position, such as whether you want to add it to the top or bottom
    of the list. Keep in mind that you can also easily move a card around a board
    by simply clicking and dragging.

    +   - **Copy**: Copying a card allows you to duplicate a card and keep the parts
    you want. You can copy everything, and a checklist gives you the option to avoid
    copying over certain items such as attachments, checklists, or comments. Just
    like the **Move** option, you can specify which list and board you want the copied
    card to appear on.

    +   - **Make template**: A template card is a way to let your teammates know whether
    you have a preferred format for cards on a board and make it easy for them to
    copy that format. While you can copy any card on a board, template cards make
    it extremely clear how to copy a card and give new users an easy way to reference
    them.

    +   - **Archive**: Archiving a card removes it from the board. Don’t worry – it’s
    never really lost! You can easily send a card back to the board by going to **Archived
    Items** in your board menu and searching for the card. There’s no real need to
    delete it, as you don’t have any storage limits in your archived data, but some
    people may prefer to delete it if it’s confidential information they never want
    resurfacing.

    +   - **Share**: In some cases, you may want to share a card. The **Share** option
    allows you to print a card or export it in the JSON format. You can also view
    and copy a card’s short link, generate a QR code for the card, or grab the embed
    code to view it on a web page. (Note that this doesn’t enable people who do not
    have access already to see the card.) You can also get the email address for the
    card. Anything sent to that email will appear as a comment on the card.


    Card actions can be useful, so take your time to get to know these actions. You
    can also use a keyboard shortcut – typing the letter C while a card is'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'selected to archive it. With these tips, you’ll avoid scrolling to the **Card
    actions** menu to perform those actions.


    # # Quick actions from the card front


    Everything we’ve discussed so far was from the card back, when you have it open.
    However, you can make changes to cards without clicking them to open them. While
    hovering over a card, click the pencil icon to the right of the card name.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_67_0.png)


    Figure 2.17 – Editing a card from the board view


    This opens a menu that allows you to access the fields of a card and open those
    modals, without needing to go into the card itself.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_67_1.png)


    Figure 2.18 – A list of all card quick actions'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Clicking any of the options that appear opens the same menu you would find
    inside the card, such as a menu to add members, select the due and start dates
    from a calendar, move a card, and add labels. There are also keyboard shortcut
    options to go straight to one of them – check out [trello.com/shortcuts](trello.com/shortcuts).


    # # Summary


    Whoa! We’ve gone through a lot in this chapter. If you’re thinking, “Wow, Trello
    does a lot!”, you’re right. That’s the beauty of it. Rather than get overwhelmed,
    give yourself a chance to see the possibilities!


    Let’s recap. We learned the elements of a card and the attributes you can assign
    to it, such as members, dates, and labels. You’re also now comfortable navigating
    around a card and performing actions, showing details, and making edits as you
    please.


    Now that you know about the most useful parts of a card, it’s time to dive even
    deeper. We’ve only scratched the surface of everything you can do inside these
    super-charged sticky notes, so let’s keep going!'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# # Leveling Up Your Cards


    If your head is still spinning from all the things you can do with a card,

    buckle up because we’re just getting started. While adding members, dates,

    and labels is most common, there are many other things you can include in

    your Trello cards to make them more powerful.


    In this chapter, we’ll discuss how to add files, links, and any other

    attachments to your cards. We’ll also talk about locations, checklists, and

    card covers and how to use all of those fields to give even more context to

    your cards. In case you think of an input we haven’t already mentioned,

    you’ll learn how to create custom fields to store any other info you can

    imagine.


    # # Attachments


    While you can add a lot of info to a Trello card description or through some

    of the other fields we’ve already talked about, sometimes you’ll have data

    or files that live in other places. This is where attachments come in handy.


    Why use attachments?


    I’m not naïve enough to think that Trello is the only tool you’ll ever use.

    Heck, even I still use other things such as spreadsheets to organize financial

    info or Canva to create images for blog posts, and even Google Docs or

    Confluence to collaborate with others through text. Attachments make it

    possible to keep everything in one place, without needing to sacrifice using

    the best tool for the job. You’ll also be using multiple Trello cards and

    boards that relate to each other, so being able to quickly get to relevant

    items while you’re working on a card is critical.


    # # Attaching items to a card'
  merge: -1
  img_proc: true
- pgno: 70
