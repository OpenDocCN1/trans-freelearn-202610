- pgno: 30
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_30_0.png)


    Figure 1.9 – Board filtering options


    Here, you can filter to only show your cards (or another member’s) or filter by
    due dates. You can even filter by keywords, labels, or recency of activity. It’s
    a great tool for drilling down to exactly what matters, and helpful when you have
    a busy board.


    # ## Adding members and setting roles


    You’ll also notice avatars on the top right-hand side of your board, which indicate
    who has joined the board. Click on an avatar to view that member’s information.
    If you need to change their role, click the **Share** button. You can also see
    a list of all the members and their roles here.


    By default, everyone is a **member**, which means they can edit the content on
    a board, such as creating cards, lists, and more.


    Admins have superpowers and can rename a board and close a board.


    If you’re on a Trello Premium or higher plan, you’ll have access to another role
    type: **Observer**. These users can view content and comment on a card, but they
    aren’t able to edit anything on the board. This is helpful if you don’t want to
    make a board public, but need your team to see the content without having the
    power to break anything.


    # ## Accessing the board menu


    The last stop on the board menu is an ellipsis on the right-hand side of the top
    toolbar. Click it to reveal extra settings for configuring your board:'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_31_0.png)


    Figure 1.10 – Menu navigation on Trello boards


    # ## Description


    A board description is a place where you can summarize the board. It’s helpful
    for others to understand the context of the board and also a great place to save
    related links. Let’s go ahead and set this:'
  merge: -1
