- pgno: 381
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_381_0.png)


    # Figure 14.24 – Layout options for Placker views


    This will add the lists from all the boards into one big board (and it’s even
    smart enough to combine lists if they have the same name, such as **In Progress**).


    I also have the option to change my view based on what I’m prioritizing, such
    as planning projects and getting an overview of the week, or vertically grouping
    each list by criteria such as member or priority. And finally, I can create swim
    lanes that display cards in a horizontal grouping. Within each of these layouts
    are additional settings for customizing the view to display your cards in exactly
    the way that’s most helpful to you.


    You can also add filters on the left side of the top bar to narrow down the cards
    that are displayed. These filters are way more advanced than Trello’s native filters.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_382_0.png)


    Figure 14.25 – Filter options in Placker views


    Not only can you pick cards that meet certain criteria, but you can hide cards
    that also meet certain criteria. For instance, I can show all cards except ones
    that have a due date more than a week away, or except ones that don’t have any
    label. Just start typing and you’ll be able to find the attribute you want and
    create a filter. You can also quickly filter to just see your own cards (there’s
    even a button for this at the top of the board, before you click into the filter).


    # # Default attributes for reporting


    When you open a card from the Placker modal, you’ll see a lot more fields than
    you get in Trello. This is helpful when you need more advanced reporting because
    you can assign many attributes to a card, such as planned and actual dates, estimated
    budget, progress on a card, priority, and more!'
  merge: -1
  img_proc: true
- pgno: 383
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_383_0.png)


    # Figure 14.26 – Viewing Trello cards in Placker


    Of course, you can access your custom Trello fields here too, and you can

    create custom attributes that are only shown in Placker if there’s anything

    you want to show up here but not in your boards on Trello.


    It’s possible to create custom fields in Trello for all of these items, but with

    Placker, they’re just there out of the box. Plus, without needing to create

    any special automation, you can set special effects on cards, such as

    relationships to other cards or mirroring other cards.


    You even have the opportunity to create child cards from checklist items

    with one click, making it easy to establish relationships between tasks and

    subtasks.


    # Adding widgets and reports'
