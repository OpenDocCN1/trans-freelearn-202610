- pgno: 364
  md: '# Figure 14.6 – Filtered quick list with the sum of fields


    I’ve now got a handy table showing me exactly how my week is going to shape up,
    and the best part is, each week it will update to check cards for that week. I
    can sort my table by any one of the fields, such as **Priority**. I can also click
    on the name of any card to open a new tab with the card. I can even export the
    board or email it, or I can head to https://app.bluecatreports.com/ and go to
    the list to get a specific URL that will always take me right to that list.


    This is just one way you might use quick lists. You might also create quick lists
    for the following:


    +   - Seeing what tasks were completed over the past month, sorted by team member

    +   - Creating a list of items from multiple boards that are waiting on review

    +   - Listing all cards that were created in the last month that are tagged as
    feature requests, along with the estimated effort to complete them

    +   - There are many ways you might use these lists, but we’re starting to talk
    about how much work was completed and looking at the number of tasks with priority,
    so it’s time to head to the reports and get some visuals to answer our questions.


    # Reports


    You’ll use reports to display a high-level overview of your projects across one
    or more boards. It’s helpful for showing things like how much work is getting
    done or seeing if you’re allocating tasks evenly between teammates. You can also
    see how long work takes, identify slow-moving cards and track other trends on
    your boards. With only a little bit of effort, you can use it to create custom
    reports like this.'
  merge: -1
  img_proc: true
- pgno: 365
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_365_0.png)


    # Figure 14.7 – Creating custom reports


    Let’s go through an example of how to make a simple report showing how much work
    is getting done and a few different charts we can create to look at that.


    Head back to the home page of Blue Cat by clicking the **Home** icon in the top
    left. Click the button on the right-side panel that says **Create a Report**.
    You’ll be asked to name your report. It is helpful at this point to think about
    when you would use the report and name it after that, that is, **Monday morning
    standup** or **Monthly board review**. So if you can think of a sensible name
    then pick that, or feel free to call it **Test report** if you prefer. Now, click
    **Save**.


    Next, you will need to click **Create chart**. You’ll now see various types of
    charts that you can choose from. This book isn’t about charts and task reporting
    overall, just how to do those things in Trello, so I won’t go into much detail
    here, but you can always ask the Blue Cat reports team or post in the Atlassian
    Community if you need some help figuring out which chart to use.'
