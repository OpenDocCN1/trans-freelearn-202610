  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_33_0.png)


    Figure 1.11 – Board description section


    Use the rich text editor to style your text with headers, bullet points, and anything
    else you want. When you’re done, click **Save**.


    # ## Background


    The next setting allows you to change the background to another color, a stock
