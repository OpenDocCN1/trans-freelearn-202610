    We start our Trello journey by exploring what Trello is and its core components
    – boards, lists, and cards. We’ll dive into all of the fields on cards and how
    to use them in productive (and even fun) ways so that every individual contact,
    task, or item has all the information you need. Zooming out, we’ll learn how to
    see all your cards in useful views that highlight what you need when you need
    it and demonstrate some of the most common ways people use Trello.


    This part has the following chapters:


    +   - [Chapter 1, The Structure of Trello](#)

    +   - [Chapter 2, Trello Card Starter Pack](#)

    +   - [Chapter 3, Leveling Up Your Cards](#)

    +   - [Chapter 4, Viewing Cards Your Way](#)

    +   - [Chapter 5, Real-World Trello Boards](#)'
