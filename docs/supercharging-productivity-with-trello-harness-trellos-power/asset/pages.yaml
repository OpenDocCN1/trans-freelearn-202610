- pgno: 54
  md: '# # Enable colorblind friendly mode


    # # Give us feedback


    Figure 2.5 – The Labels modal


    Search for existing labels in the search box by typing a name. To create a label,
    click the **Create a new label** button, or the pencil icon next to an existing
    label that you’d like to edit. A box will then appear, allowing you to add a title
    for the label, which is the text displayed on the label.


    You can also change the color of a label to any of the 30 shades available in
    the palette chooser. If you’d prefer only text and no color, the label will be
    hidden from the front of the Trello card and will only appear when the card is
    open.


    Figure 2.6 – An example of a colorless label


    Once you’ve named a label and selected the color, click **Save**.


    If you’d prefer more color blind-friendly options, click the button below the
    labels to turn on **Colorblind friendly mode**. This changes the labels to various
    patterns instead of just colors, which can be more accessible for anyone with
    difficulty discerning colors.


    To remove a label, click the pencil to the right in the menu, and then select
    the red **Delete** button.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'After you’ve created the labels you want, click the label or the checkbox next
    to a label to add it to the current card. Exit the card, and you can click the
    label from the card front to show or hide the text of the label.


    # Dates


    The start and due date fields are used to set deadlines for a task or project.
    The due date is the date by which a task or project should be completed, while
    the start date is the date on which work should begin. Can’t get enough and need
    more dates? We’ll talk about how to add more dates in Chapter 3 when we discuss
    custom fields.


    To set a start or due date, simply click on a card and select the appropriate
    date from the calendar.


    # Start and due dates


    A card can have both the start and due date fields set, neither of the fields
    set, or one of each set. Both fields offer a date value, but only the due date
    field accepts a time value as well.


    Why use dates?


    Dates are useful to visualize deadlines and prioritize your tasks. Cards with
    a due date can be plotted on a Timeline or Calendar view, which we’ll discuss
    in more detail in Chapter 4.


    Sorting cards by the due date in a list is a useful way to prioritize your workload
    for the week. If you’d prefer to only see tasks that are due soon, you can use
    board filters to show only cards due today or in the next week, or cards that
    are overdue.


    # Adding start and due dates to a card'
  merge: -1
  img_proc: true
