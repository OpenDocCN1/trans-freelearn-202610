- pgno: 187
  md: 'However, dates are never static. When was the last time you had a project or
    task that actually stuck to its intended schedule? Even as I write this book,
    we’ve had to adjust the deadlines for drafts and edits throughout this whole process.
    These automations make setting and shifting due dates easy and allow you to focus
    on doing the work.


    Let’s dive in.


    # # Mark a due date as complete/incomplete


    You can check off a due date as done, or uncheck it if it’s already checked off.


    Real-world example


    When a card is moved to **Done**, mark the due date as complete.


    And a bonus one!


    When a comment is added to a card in the **Done** list, mark the due date as incomplete.


    These help manage the date field by other properties on the card. The second example
    is a great way to “reopen” a card if something changes.


    # # Set the due/start date to ___


    The world is basically your oyster here.


    No, really... you’ve got a ton of options from setting it to be right away, to
    a certain number of hours in the future, to an upcoming day of the week, or a
    specific date or day of this current month, or this year! You can even match it
    to a date in a custom field.'
  merge: -1
  img_proc: true
