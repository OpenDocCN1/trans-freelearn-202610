    When the **Age** custom field is greater than 13 and less than 20, add the “teenager”
    label.


    This is useful if you have specific data that you need to group. It’s another
    example of relating custom field information to other fields on a card.


    # # When a date custom field is set


    Another type of custom field is the date field. You have access to start and due
    dates on a card whether or not you have custom fields enabled on your board. But
    if you need more date fields, you can create them with custom fields. Then, you
    can use this trigger to monitor what happens with them.


