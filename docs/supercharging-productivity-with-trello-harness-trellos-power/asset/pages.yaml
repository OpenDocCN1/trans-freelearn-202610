    You can type in any number or use the arrows to scroll. For my example, I’ll type
    2. Once you’ve set your number, click **Save**. Alternatively, if you have a limit
    set already that you’d like to clear, you can just click **Remove**.


    # # Using List Limits


    When you configure a list limit, a badge will show at the top of the list with
    the current number of cards and the maximum number you set.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_287_1.png)


    Figure 11.15 – Badge at the top of the list showing the number of cards


    If the current number of cards is equal to or less than the maximum, the rest
    of the list will be displayed normally. However, as soon as there are more cards
    than the maximum number, the list changes from a gray background'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'to a light-yellow background and the badge at the top is boldened to make it
    stand out.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_288_0.png)


    Figure 11.16 – Badge boldened and background changed when cards exceed list limit


    You can still add cards past the limit and view the count at the top. I find this
    ideal because sometimes I really do need to make exceptions, and it’s more helpful
    to use the Power-Up as a guideline rather than strictly preventing cards from
    moving to another list.


    Even if you don’t need limits, this Power-Up is helpful for counting the number
    of cards in a list since it always displays that number via the badge at the top.
    I sometimes use this on lists just to keep track of how many cards I have in case
    I want to report on it, such as the number of tasks I’m working on this week,
    or the number of contacts in my **Won** list.


    How you choose to utilize limits is entirely up to you and your team. In fact,
    outlining your intended use of limits is something you can mention in your board’s
    Read Me, which we will discuss in the next section.


    # # Read Me'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'No matter how clearly you organize your board, folks will still join and feel

    a bit lost and unsure of how to use the board. Even if you go through the

    board with your team, it’s still nice to have a central place explaining how

    to use a board and the expectations of board members.


    A README is a file in a software project that typically has important

    information about the project, such as its purpose, how to use it, how to

    install it, and any dependencies or requirements. It is often the first file a

    user will read when exploring a new project. This is where the Read Me

    Power-Up gets its name, as it’s the first thing a user sees when they’re

    added to a board if you have this Power-Up.


    Why add Read Me to Trello boards?


    Having a short snippet of text that introduces people to a board and walks

    them through it will increase the likelihood of people using your board and

    —perhaps even more importantly— help them use it correctly. I

    recommend using this Power-Up with any board that you have other people

    working on, or template boards. It’s free and easy to configure, so there’s no

    reason not to!


    # # Adding the Read Me Power-Up


    If you’re working on a support team, you might want to use Read Me to

    explain to your support engineers how to use your board and ensure

    everyone understands how to grab tasks.


    To add the Read Me Power-Up, head to the Power-Up directory and search

    for Read Me. Choose the first Power-Up that appears, which looks like this:'
