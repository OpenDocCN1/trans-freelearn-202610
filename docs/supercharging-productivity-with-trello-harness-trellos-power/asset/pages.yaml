- pgno: 194
  md: 'Just like with card due date automation, this action is useful when you have
    multiple subtasks due on the same day and need to shift to the next week.


    # # Remove the due dates from the checklist


    This action allows you to specify a checklist that you want to remove dates from.
    For instance, you might use this if you want to clear all of the dates from multiple
    checklist items rather than just a single item.


    Real-world example


    When a due date is removed from a card, remove due dates from the **Initial Steps**
