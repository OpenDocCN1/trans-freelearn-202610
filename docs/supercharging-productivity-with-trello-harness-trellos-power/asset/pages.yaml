- pgno: 225
  md: '# # Bitbucket


    Atlassian also owns Bitbucket, which is a web-based version control repository
    hosting service used for source code management, allowing teams to collaborate
    on code and track changes. It’s similar to GitHub (I just know someone is going
    to throw rocks at me for saying that.).


    ![](img/21bbd56263f8fc423bc91d3203b460bb_225_0.png)


    Figure 8.12 – Bitbucket actions


    If you want to integrate Trello with Bitbucket, you have a few actions here. You
    can open a pull request or set card members as reviewers.


    # ## Real-world example


    When a card is added to the **Ready for QA** list, open a pull request with the
    first Bitbucket branch linked in the attachments.


    This is helpful if your team is using Bitbucket. You can go straight from an issue
    in Trello to PR in Bitbucket and even tie the two together!


    # # Slack


    The final tool that can be easily automated with internal automation options is
    Slack. Slack is an instant messaging and team collaboration tool that enables
    real-time communication, file sharing, and integration with other applications.'
