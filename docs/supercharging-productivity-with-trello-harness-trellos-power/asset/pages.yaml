  md: 'From here, configure what kind of Trello notifications you want to be shared
    in Slack. Select the + **Add Slack Alert...** button under the **ALERTS** section.


    Select a Slack workspace, then choose a channel you want notifications to be posted
    in. To stick with my marketing example, I might set these notifications to go
