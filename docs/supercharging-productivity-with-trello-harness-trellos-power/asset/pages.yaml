- pgno: 228
  md: '# # Building Automation with Triggers


    We learned about triggers that can start automation workflows in <u>Chapter 6</u>.
    We then learned about actions that can follow those triggers to complete various
    tasks in our cards and boards in <u>Chapter 7</u> and 8. Now it’s time to bring
    everything together and see how we use both parts to make automation actually
    happen.


    While rules are simple enough—pick a trigger and string as many actions together
    as you want—I haven’t even shown you every single possible trigger you can use,
    because as you head to different sections of automation, new ones unlock! That’s
    what this chapter is for: to show you how to put the rubber to the road and use
    the knowledge you have to build the workflows that you need to work efficiently
    in Trello.


    Here’s what you’ll learn how to do in this chapter:


    +   - Tie triggers and actions together with rules

    +   - Use buttons on your boards to trigger automation workflows

    +   - Add buttons to your cards for starting an automation sequence


    No matter what you do in Trello, you’re probably going to want to automate some
    of those activities, so this chapter is extremely important. If you’re spending
    all your time organizing items in Trello, assigning members, creating due dates,
    and moving cards between lists... then you’re not saving any time; you’ve just
    created another job for yourself to move things around in places!


    You know how it’s easier to rewrite your checklist on another piece of paper than
    it is to actually, you know, do the task? It’s easy to feel productive when you’re
    organizing your workflow, but anytime you spend doing that takes away from the
    time you could be spending doing your actual work.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'That’s why automation is essential—so you can make Trello _work for you_, rather
    than the other way around. If you’ve been thinking you don’t need automation,
    this chapter will bring everything together to help you simplify your workflows
    so that all the tedious moving of cards and setting of fields doesn’t detract
    you from the tasks at hand.


    This is where it gets fun, so let’s jump in!


    # # Accessing Automation


    If you’re reading through the chapters in order, you’ve seen this already in the
    previous chapters, but here’s a quick recap in case you’re skipping around.


    To access Trello’s amazing automation features, click the **Automation** button
    in the top toolbar of any Trello board.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_229_0.png)


    Figure 9.1 – Automation button in board toolbar'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'This opens a menu with a few of the types of automation. Click any of the options
    that appear to open a full modal with the entire set of automation categories
    on the left side.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_230_0.png)


    Figure 9.2 – Automation sections in the left-side panel


    Throughout this chapter, we’ll review each of those categories of automation.
    As you get to a section, click that category name in the left side panel so you
    can follow along. Let’s start with the first one at the top, just after **Automation
    Tips**.


    # # Rules


    Rules simply combine the triggers and actions we’ve already discussed. _Chapter
    6_ showed the possible triggers that can be set for events. You’ll find all of
    these triggers in this section, and you can then string to any number of actions.


    Remember the examples such as “When a card is added to the board, set the due
    date to seven days from now”? You’d set that type of automation up here because
    it’s watching for an activity that happens on the board (such as a new card being
    added).'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Rules might be the most common type of automation—as you might expect, because
    I wrote an entire chapter about the triggers that live in the **Rules** section!


    # When to use rule automation


    If you want automation to happen based on something else happening in a card or
    on the board, you’ll probably want to use rules. Go back to the “When this happens...
    then that...” statements about your workflow. If your “When” has a specific action
    that occurs, such as a label being added, a card being moved, or a field being
    set or changed, then you’ll want to use rules.


    If you can’t find a trigger that suits the action you’re thinking of, don’t despair!
    You can still manually trigger the action with buttons or set it to happen at
    a regular occurrence with scheduled automation, but we’re getting ahead of ourselves.


    # Creating a rule


    Think about what you want to automate. You have all the triggers and all the actions
    at your disposal. Let’s make a rule together.


    We’ll make a rule that every time a new card is added to the board, you are added
    to the card and a due date is set for seven days from now.


    Sound like a lot? Don’t worry, it’s easy!


    Make sure **Rules** is selected on the left-side panel of your automation modal,
    and then click **Create rule** in the top right.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_232_0.png)


    Figure 9.3 – Create rule button


    Then, you’ll be prompted to add a trigger by using the + **Add Trigger** button.
    Click that, and you’ll see a menu appear with all the available triggers.


    For our example, we want to trigger an action when a card is added to the board.
    Click the + button at the end of the row, next to the first trigger, to add it
    to our rule.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_232_1.png)


    Figure 9.4 – Use the +/plus button to add a trigger or rule to the automation'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'If you want to be more specific and only trigger this rule on cards added to
    a specific list or that have certain labels or other attributes, click the filter
    icon. We won’t need that for now, but just keep that in mind if you need it in
    the future.


    Scroll up and you’ll see that trigger has been added, and the sections below have
    changed to actions.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_233_0.png)


    Figure 9.5 – Steps in automation


    If you accidentally added the wrong trigger, click the trash icon next to the
    trigger to remove it and try again.


    But ours is looking correct, so we’re good to go. Now it’s time to pick out our
    actions.


    Let’s start with the action for adding ourselves to the card. This way, we get
    notifications about anything that happens on that card, and it will show up in
    any filters we apply and any workspace views looking for cards that belong to
    us.


    To do this, click the **Members** tab, and select the very first action to join
    the card. Once again, click the + button at the end of the row.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Figure 9.6 – Action for joining the card


    Scroll up to confirm this is listed as an action, and then you can stop right
    there and save the rule, or you can keep going to add more to it. We’re overachievers,
    so we’ll keep going.


    Head to the **Dates** tab. Look at the second action, which says **set due date
    now**. Click **now**, and you’ll see that you have an assortment of options.


    # Figure 9.7 – Option for action to set due date on a card


    We want to set the card to be due in seven days from the moment it’s created;
    that way, we won’t forget about it, and we’ll be prompted to take some action
    on it within a week, even if the action is reassigned to a later date.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_234_0.png)


    ![](img/21bbd56263f8fc423bc91d3203b460bb_234_1.png)'
  merge: -1
