- pgno: 196
  md: 'If you’re using a checklist from another card and it copies over that checklist
    with some tasks completed and some not, this is a great way to go ahead and clean
    up that checklist and start over from scratch.


    Again, I generally prefer to have a designated card with a clean checklist that
    I use to reference checklists in automation. I just find this cleaner and it prevents
    grabbing half-used checklists. It also makes it easy to add or remove items. But
