- pgno: 224
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_224_0.png)


    # Figure 8.11 – Jira actions


    Atlassian owns Trello and Jira, so thankfully, there are some great ways to keep
    them synced together. Although there are tools out there that are more robust
    for complete mirroring, if you just need info from Trello pushed to Jira, this
