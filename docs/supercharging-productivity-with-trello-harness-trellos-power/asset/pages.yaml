- pgno: 389
  md: '# Figure 14.31 – Widget options for a chart in Placker


    It will take you some time to get familiar with the different options. Scroll
    through the **Widget type** options to see what’s available, but in many cases,
    you’ll probably just stick with the first one, **Tracker (by any attribute)**.


    Next, you can select the attribute (part of the card) you want to observe. Let’s
    say we want to track our custom **Priority** field and check that we’ve been primarily
    completing cards with high priority. Just like with other reporting tools, I can
    define what we want to count, whether it’s the number of cards or the sum of the
    effort involved.


    I’ll now go back up to the top left and select **FILTER & SETTINGS**, which opens
    the same filter we saw on the board view. From here, I’ll select cards that have
    been completed, and ta-dah 🎉 my chart at the bottom now shows my cards completed
    by priority!


    ![](img/21bbd56263f8fc423bc91d3203b460bb_389_0.png)


    # Figure 14.32 – Chart of tasks sorted by priority in Placker


    Looks like of the cards that have priority assigned, we are completing the high-priority
    ones! But we still have some work to do with making sure we actually assign priority
    to cards.


    There’s still a lot more you could discover in Placker, so make sure to take time
    to click around and connect with their team as you go through your 15- day trial.


    # Screenful'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'It’s time to review one more reporting tool for your team. This one is called
    Screenful and what makes it special from the others (in my opinion) is that it’s
    a good hybrid of advanced reporting options with ease of use.


    You’ll see many of the same reporting features you’ve seen in other tools. Screenful
    also allows you to create charts and aggregate data then group it by other attributes
    (such as members or labels). But where Screenful shines is by supplying so many
    charts, reports, and insights right out of the box, without needing to configure
    anything. And they’re beautiful!


    As soon as you connect your boards, you’ll be able to view charts showing you
    how many open cards you have, how many cards you complete each week, and even
    a forecasted project completion date! All of this, just by connecting your boards
    and confirming the lists!


    # Who is Screenful best for?


    There’s no single perfect tool for everyone, so it really depends on what you
    need out of a reporting tool. If you need to quickly answer questions about your
    workflow or if you have less technical users who don’t have time or skills to
    configure reports, Screenful is a perfect fit because you’ll get most of what
    you need right out of the box, or with very little customization.


    You also might prefer Screenful if you’re concerned about beautiful visuals for
    your shared charts and reports. While the other tools I’ve used are manageable
    and look nice enough, I prefer the appearance of the Screenful charts more than
    the others.


    Of course, with everything there are tradeoffs, and for Screenful the tradeoff
    is price. Although they don’t charge by user, their lowest plan starts at $49
    a month, and that’s only for two custom reports and doesn’t include all features,
    such as custom branding or scheduled reports. This tool also won’t work well for
    you if you use labels instead of lists to track the status of tasks. I don’t think
    it’s impossible to track status by labels in Screenful, but it would likely require
    a lot more configuration.


    # Getting started'
  merge: -1
  img_proc: true
- pgno: 391
  md: 'Screenful is another one that you can add via Power-Up, but you can also just
    go directly to their site at https://screenful.com/. Once there, create an account,
    and you’ll be prompted to connect to an account (such as a Trello account!) and
    then select the boards you want to connect.


    I’ll connect my Trello account and select a couple of related boards, and then
    click **Next**. I can always go back later and add more if I want. Screenful will
    guess which lists relate to which status.


    # STEP 2/2 :: LET''S CAPTURE YOUR WORKFLOW


    These are the workflow states that we detected from the selected data sources:


    | NOT STARTED 🛈 | IN PROGRESS 🛈 | DONE 🛈 |

    |---|---|---|

    | Backlog | In Progress | Done |

    | Next Up | Blocked | Completed In Past |

    | This Sprint To Do | QA | Completed In Past |

    | | Ready to Publish | |


    Did we get it right? You can [adjust mapping](https://screenful.com/) if you want
    to exclude some of the state, or change the suggested mapping. These settings
    helps us calculate lead and cycle times, and help you in tracking your goals ([learn
    more](https://screenful.com/))


    Go back Adjust mapping Looks good to me Skip, I''ll do it later


    Figure 14.33 – Mapping workflow stages in Screenful


    It’s pretty good at guessing! But if you need to adjust, you can click **Adjust
    mapping**. But this will only let you exclude lists or move them between stages.


    # Insights


    Once you’ve connected your boards, you land on the **Insights** tab, where you
    can start analyzing data from your cards right away, just by scrolling through
    the page.'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'You’ll first see a summary of how many cards are in all your boards that have
    not been completed. These are your open tasks. This can be helpful as it’s effectively
    the quantity of your to-do list. It will never be zero, but having a high number
    of open cards can make a project feel impossible.


    Next, you’ll see those open (non-completed) cards broken down by label. This can
    help you identify if there are any specific types of tasks that have not been
    completed yet. For instance, if you’re a marketing team and you see a lot of cards
    with a “content” label, you might need to hire another content writer.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_392_0.png)


    Figure 14.34 – Grouping options for charts in Screenful Insights


    But aside from just label, you can group by any number of things, such as who
    the card is assigned to, custom fields on the card, its state, and more. These
    give valuable insights about those aspects of your funnel because you can identify
    any gaps and see where you’re over- or under-indexing.


    You can also compare this information over time.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_393_0.png)


    # Figure 14.35 – OPEN ITEMS TREND chart in Screenful


    Viewing open cards over a period can help you see if you’re consistently having
    the same amount open or if they’re trending down. For one-time projects, such
    as a feature release or a product launch, you should see this decrease as you
    complete more items each week. If it’s going up, you might be adding more tasks
    than you can reasonably complete, which it looks like I might be doing!


    By default, this chart shows the last three months, but you can select other periods
    from the dropdown in the top right above the chart.


    Lastly, you can have it all with a chart that combines the trends with groupings
    by label, member, priority, or other attributes.


    If you want to filter any of this data, just click **Set filter** in the top-right
    corner of the board. You’ll have the options to filter the data by any fields
    and to only show cards with a certain label, giving you the ability to micro-analyze
    a specific type of task’s activity.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_394_0.png)


    # Figure 14.36 – Filter options in Screenful


    My favorite part about Screenful is that all of this comes out of the box. We’ve
