  md: '# # Part 3 – Power Up Your Boards


    In the final part, we’ll discuss add-ons for your Trello boards called Power-Ups.
    You’ll learn about some of the most common ones that cover a variety of use cases,
    and we’ll help you make your boards work as effectively as possible. We’ll even
    discuss reporting Power-Ups to help you make sense of the data in your Trello
    boards so that you have everything you need to be successful!


    This part has the following chapters:


    +   - [Chapter 11, Power-Ups Built by Trello](https://learning.oreilly.com/library/view/the-organized-mind/9781491952466/ch11.html#idm45587385002800)

    +   - [Chapter 12, General-Use Power-Ups](https://learning.oreilly.com/library/view/the-organized-mind/9781491952466/ch12.html#idm45587384999712)

    +   - [Chapter 13, Syncing Info between Boards and Tools](https://learning.oreilly.com/library/view/the-organized-mind/9781491952466/ch13.html#idm45587384996624)

    +   - [Chapter 14, Reporting in Trello](https://learning.oreilly.com/library/view/the-organized-mind/9781491952466/ch14.html#idm45587384993536)'
