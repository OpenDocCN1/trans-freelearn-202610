    # # Move/copy the card to the top/bottom of the list


    This one is sneaky—if you’re looking for the option to copy a card when something
    is created, this is the one you want! Click on **move** and you’ll see the copy
    option appear. This action lets you simply move (or copy) a card to another list.
    (You can even clarify whether you want it added to the top or bottom.) Click the
    board icon at the end and you can specify a list that is on another board. (Note:
    these other boards do not have to be in the same workspace! They just have to
