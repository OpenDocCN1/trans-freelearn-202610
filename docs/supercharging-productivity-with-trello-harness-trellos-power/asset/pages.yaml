- pgno: 167
  md: '# # When a checklist is completed/made incomplete in a card


    Use this if you want something to happen when a checklist is completed, such as
    sending an email notification or a comment. It can also be helpful to indicate
    if a checklist is made incomplete. This happens when something is added to it
    that has not been checked off or a completed item is unchecked.


    This does not require specifying a checklist, although you can. Alternatively,
    leave it to watch any or all checklists.


    # ## Real-world example


    When all checklists are completed, move the card to the **Done** list.


    This rule is helpful if you use checklists regularly because it will make a whole
    card completed automatically when you have finished the checklists inside a card.


    # # When an item is checked/unchecked


    This trigger once again gives you the option to be specific, or to watch any items
    on a checklist. This trigger lets you fire an action when an item is completed
    or unchecked. This is helpful if you’re connecting cards and checklist items.


    # ## Real-world example


    When an item is checked, find a card with the same name and move it to the **Done**
    list.


    This is a useful rule when you are using a single card to keep track of other
    cards as a checklist item. This helps keep them in sync.'
