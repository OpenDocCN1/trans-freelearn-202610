    # # Unito


    As much as I want everyone to use Trello, and as much as I’ve tried, I just can’t
    get everyone in the world on board with it (pun intended). So, you probably won’t
    be able to either (_although if you do, that will make my life easier, so 🙏 thank
    you in advance_). Even if you could get everyone to use Trello, you’d never be
    able to get everyone to use the same board. And for that reason, Unito enters
    the scene to make everyone happy and literally bring everything together.


    Unito offers many Power-Ups, but at its core, it is a syncing company that integrates
    with many tools, such as Trello, GitHub, Monday.com, Asana, Jira, and even Google
    Sheets, to help you keep all your tasks in sync while allowing everyone to work
    from their own spaces. It even works to integrate Trello boards with each other!


    It’s not free, and if I’m being honest, it’s not even cheap (at the moment, plans
    start at $30 a month for basic features and syncing 150 items a month). But you
    can get a 14-day free trial to test it out and make sure it'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'works for your use case, and if you are looking for a quick and easy way to
    sync multiple tools or Trello boards with each other, you won’t find a better
    tool or alternative!


    # Why use Unito?


    Unito is a fantastic tool because we will never all work in the same place. Unito
    lets you keep your tasks in Trello while your engineering team works in GitHub
    and your product team works in whatever tool they want to; Unito keeps everything
    updated, regardless of where the change happened. If a label is updated on a card
    in one Trello board, you can mirror that change on the same card in another board,
    or even another tool, such as Notion!


    There’s so much you can do with Unito that I won’t be able to cover it all in
    this chapter. We’ll go through an example of connecting Trello and Notion, since
    that’s something I’ve been exploring lately, and you’ll follow a similar process
    regardless of what you’re connecting with Trello, even if it’s just another Trello
    board!


    To start using Unito, you can either go directly to their site, or you can find
    them via the Power-Up directory by searching for Unito, or the tool you want to
    sync with.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_348_0.png)


    Figure 13.15 – Unito card in the Power-Up directory'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'I’m searching for Notion since that’s what I want to sync with Trello. Once
    you’ve added the Power-Up, it’s time to create your Unito account and set up your
    flow!


    I prefer to set up Unito flows from their website instead of through their Power-Ups.
    You can do that too, and it eliminates the need to add the Power-Up to your board.
    If you want to do this, head to [unito.io/](https://unito.io/) and create an account.
    You can even sign up with your Trello account!


    # # Creating a flow


    A flow connects two tools together to put them in sync. From the Unito dashboard
    (the main page you arrive at after logging in or creating an account), click the
    + **Create flow** button. Then, you’ll be prompted to connect your tools.


    # # Connecting tools


    A flow is what connects your tools and keeps data in sync. The first step in creating
    a flow is connecting the tools you want to be unified.


    **Start by choosing the tools you want to connect**

    You can either connect two different tools or connect work within the same tool.


    Sync work in [Trello] ▼

    with the account [Brittany Join...] ▼

    of the type Card

    in the [Board] [Notion Sync] ▼


    + Sync work in [Notion] ▼

    with the account [+ Choose account] ▲

    [Connect a new Notion account]

    No results


    Your data is s

    When connecting credentials are er


    Figure 13.16 – Unito account configuration


    This connector is quite easy to use. Just click each dropdown to select the tool,
    connect an account, and choose which board, project, or database you want to sync,
    depending on the tool.'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'I’m choosing a specific Trello board that I want to keep in sync with a Notion
    database. I’ve never connected my Notion, so I’m prompted to do so by clicking
    the **Connect a new Notion account** button from the dropdown.


    I’m using Notion as an example, but you can choose from 30+ integrations. See
    a full list at [unito.io/connectors/](https://unito.io/connectors/). It’s a similar
    process of connecting your account, giving permissions, and selecting the exact
    space, such as a repository, board, or project.


    For my Trello and Notion sync, this is how my settings look.


    # Start by choosing the tools you want to connect


    You can either connect two different tools or connect work within the same tool.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_350_0.png)


    Figure 13.17 – Example Unito flow configuration with Trello and Notion


    Click the **Confirm** button once everything is configured.


    # Choosing your flow direction


    The next step is configuring the direction we want the cards to sync. You probably
    want to sync both ways, which means any change that happens in either space reflects
    in the other.'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'The next step is configuring the flow direction, which controls where new items
    get created. In a two-way flow, you’ll see new Trello cards automatically created
    by Unito when you create new rows in Notion and vice versa.


    If you only wanted to push work items from one tool to another, you’d create a
    one-way flow. So, a one-way flow from Trello to Notion would see Unito creating
    new Notion rows whenever you create a new Trello card. You can still get updates
    in both tools even with a one-way flow, though! That’s because this step only
    controls where _new_ items get created, while any changes in existing items will
    still be synced in both directions.


    If this is the case, you’ll just need to change the arrow to point to the direction
    you _do_ want changes to sync.


    # Choose your flow direction


    By default, Cards and Pages will flow both ways between your tools. If you only
    want Cards to get created in Trello or Pages to get created in Notion, you can
    change this flow’s direction below. Whatever you choose here, you’ll later be
    able to tune that behavior to better reflect the way you work.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_351_0.png)


    Figure 13.18 – Setting flow direction in Unito


    I’d want Unito to create both Trello cards and Notion rows, so I’ll leave it with
    the default bi-directional arrow.


    Just click **Confirm** when you’re ready to move to the next step. This takes
    you back to the flow page. Select the **Continue** button on the next part of'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'the configuration.


    # # Choosing what syncs


    If this feels like a lot, just keep in mind that for most cases, you can just
    click through these settings as the default is often what you want! The reason
    we’re going through these step by step is to show you the options you have available
    in case you want to customize and do something specific.


    In this step, you can filter which cards (or issues, pages, or other items depending
    on the apps you connected) are synced. You might choose to do this if you only
    want to sync your own cards to another board or tool, instead of all cards.


    To do this, you’d click **Add a new rule** to specify that you only want to sync
    tasks from another project where you’re the owner.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_352_0.png)


    Figure 13.19 – Rules for syncing in Unito'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'You can also filter by other criteria, such as syncing only cards created at
    a certain time or with certain labels or attributes.


    By default, your flow will only sync cards from the current date onward and will
    not apply retroactively to previously created cards. If you want it to apply to
    existing cards, you’ll need to click the trash can icon to delete the default
    creation date filter.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_353_0.png)


    Figure 13.20 – Syncing existing cards in Unito


    Once you’re good to go, click **Confirm** to move to the next stage, and then
    click **Continue** once again to specify what information flows between sources.


    # # Specifying what information flows


    We’re nearly done! I know it seems like a lot of options, but in many cases, you’ll
    never need to jump into Unito again and your tools will work together like magic.


    This is the last section to configure because it’s where we specify how the different
    fields relate to each other.


    Unito gives you two options: you can use the Auto-map feature, or **Start from
    scratch** to manually map the fields. In most cases, the Auto-map feature works
    well and knows exactly which fields should map, so I (and Unito) recommend choosing
    that option first. You can always customize the'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'mapping afterward if anything is incorrect, but this gives you something to
    start with. Click **Auto map my fields**.


    If it doesn’t guess them perfectly, or if you want to change them, you can click
    the **+ Add mapping** button at the top and create a new map between fields. For
    instance, I want the title of my Trello card to map to sync to my task name in
    Notion.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_354_0.png)


    Figure 13.21 – Mapping fields between Trello and Notion with Unito


    You can map any other fields you want or remove any mappings by clicking the trash
    icon at the end of the row. You can also pick the flow direction at the field
    level here. So, if you only want updates to go in one direction, you can pick
    a one-way arrow from the source tool to the tool where updates will happen. Usually,
    you’ll want to keep most field mappings two-way, since this is where Unito really
    shines. Once you’re done, click **Confirm**. Then, you’re ready to move to the
    very last step!


    # # Launching your flow'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'Now it’s time to launch your flow and watch the magic unfold. Click **Continue**
    from the flow setup page, then name your flow and confirm you’re ready to start
    syncing.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_355_0.png)


    Figure 13.22 – Naming and launching a flow in Unito


    Leave auto sync enabled to continuously sync cards. You’d only turn this off if
    you wanted to do a one-time sync across tools, or manually go into Unito each
    time you want information to sync.


    Click **Launch flow** when you’re ready.


    You’ll see a notification that the syncing is happening! It might take a few minutes,
    but you should see new cards flowing into your board soon.


    # Testing a flow


    Head to your Trello board and you should see data from your connected source in
    your board! Now make an update to a card, and check that it’s reflected in the
    other tool or board.


    If anything looks off or you need extra help, reach out to the Unito support team
    by clicking the chat icon in the bottom-right corner of the Unito dashboard.


