- pgno: 283
  md: '# Figure 11.10 – Slack alert configuration


    If you have not connected to your Slack workspace yet, you’ll need to do that
    before selecting channels or other options. Just click **+ Add new Slack workspace**
    from the drop-down menu and allow the permissions.


    # Viewing notifications in Slack


    Once the workspace is hooked up and you’ve configured the types of alerts you
    want, you’re ready to get notifications in Slack right away!


    ![](img/21bbd56263f8fc423bc91d3203b460bb_283_0.png)


    # Figure 11.11 – Trello notification in Slack


    They’ll appear in the channel you specified, and anyone can click the link to
    go to the card or the board.


    You can always change these settings later if you are getting too many or too
    few notifications in Slack. Remember—you want these notifications to be useful
    and work for you, not against you; so if it’s too noisy and everyone ignores them,
    you’ll want to reduce the volume of notifications.


    Speaking of too much going on in your boards, let’s talk about List Limits.


    # List Limits'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'Have you ever found yourself starting too many things and finishing nothing?
    I’m guilty of this, especially on my side projects! I have so many ideas and everything
    sounds fun and exciting, but soon I find myself in the middle of 10 different
    things, unable to give any one thing the attention it needs.


    This happens to many teams at work as well. You’ve been given mandates from higher-ups,
    and it seems impossible to get everything done but you keep trying. And at the
    end of the week, to your surprise, you find that not everything has been completed.


    # Why limit tasks?


    Limiting the amount of work in progress is important because it allows you to
    focus on completing tasks before moving on to new ones. When I have too many tasks
    in progress, I lose focus, my productivity decreases, and I’m more likely to make
    mistakes and forget about deadlines. When you limit the amount of work in progress,
    you can prioritize tasks, manage your time more effectively, and ultimately achieve
    better results. Limiting work in progress can also help reduce stress and improve
    work-life balance, as you are able to complete tasks more efficiently and have
    more time for other activities.


    With the List Limits Power-Up, we can set a limit on the maximum number of cards
    to be displayed in a specific list. Although this does not prevent us from moving
    cards to that list, this Power-Up visually changes the display of the list so
    it’s obvious if we’ve gone over the limit.


    Let’s pretend I’m managing my development team’s work, and I’d only like them
    to be working on a maximum of five cards at a time. If they want to grab a new
    feature from the backlog, they can only do that if there are less than five cards
    already in progress. Here’s how we’d set that up with List Limits.


    # Adding the List Limits Power-Up'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'To add the List Limits Power-Up, head to the Power-Up directory and

    search for List Limits in the top left. Choose the first option that appears

    and click **Add**.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_285_0.png)


    Figure 11.12 – List Limits Power-Up card


    Once the button changes to, say, **Settings**, exit out of the Power-Up modal

    by pressing the *Esc* key on your keyboard or clicking the **X** icon in the top-

    right corner of your screen. This takes you back to your board.


    # # Configuring List Limits


    To use this Power-Up, you’ll need to configure the maximum number of

    cards you’d like in each list on the board. You don’t need to set it for every

    list, but you can if you’d like! Find the list where you’d like to set limits

    and click the ellipses next to the list name:'
  merge: -1
  img_proc: true
- pgno: 286
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_286_0.png)


    Figure 11.13 – List actions menu with the Set list limit... action


    Scroll about two-thirds of the way down the menu that appears, and you should
    see the **Set list limit...** action. Click that, and then set the maximum number.'
