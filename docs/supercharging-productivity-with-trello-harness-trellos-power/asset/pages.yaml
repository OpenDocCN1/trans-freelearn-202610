  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_321_0.png)


    Figure 12.20 – Amazing Fields Table view


    Unlike Trello’s **Premium Table** view, this view allows you to view cards in
    a table along with your created fields, and you can control which attributes and
    fields are shown.


    Many more chapters would have to be written to cover everything you can do with
    Amazing Fields, but thankfully, the Power-Up is very intuitive and you’ll learn
    a lot just by clicking around. You can also reach out to support via the chat
    in the bottom-right corner of the **Settings** page.


    You can do so much with your boards, but before we end this chapter, I need to
    show you one more thing—how to quickly edit multiple Trello cards!


    # # Bulk Actions


    While making changes to any one Trello card isn’t all that difficult, making changes
    to many of them at once can take a while. As of 2022, Trello doesn’t natively
    offer a way to quickly edit multiple cards at once, such as adding members, changing
    due dates, or removing labels. But this is possible with the Bulk Actions Power-Up!


    Bulk Actions is built by AxoApps and has been added to over 100,000 boards! There
    is a limited free plan that allows actions on a maximum of 5'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'cards at a time, but you can edit more cards for as little as $1 a month per
    board.


    # Why use Bulk Actions?


    Whether it’s spring cleaning, project dates shifting, or new members added to
    (or leaving) a team, you’ll find there are a lot of situations where you need
    to quickly make sweeping changes in your board.


    It’s possible to do all of this manually, but it takes so much time. If you ever
    find yourself in situations where you have had to quickly move a bunch of cards
    to another list, update due dates on cards when milestone date changes, or re-assign
    labels or members to cards, you’ll find this Power-Up saves you tons of time.


    Let’s go through two examples of editing cards. We’ll edit a handful of cards
    to add labels to them since I came up with a new way to organize my cards, and
    we’ll also walk through an example of shifting the due dates on multiple cards
    when a project changes due dates.


    # Adding Bulk Actions


    Go to the Power-Up directory by clicking on the **Power-Up** button at the top
    of any Trello board, then clicking **Add Power-Ups**. If you already have a couple
    of Power-Ups on your board, the **Power-Up** button might be a rocket ship icon
    instead of the text. When you’ve arrived at the Power-Up directory, search for
    `Bulk Actions`, and click **Add** on the first Power-Up that appears:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_322_0.png)'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Figure 12.21 – Bulk Actions card in the Power-Up directory


    You’ll be asked to click **Add** once more to confirm you acknowledge this Power-Up
    wasn’t built by Trello.


    You’ll see a few intro slides explaining how Bulk Actions works, and then you’ll
    be prompted to sign up for a subscription. You’ll then see some information about
    the premium plans and your free trial:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_323_0.png)


    # Figure 12.22 – Bulk Actions welcome instructions


    You can choose a subscription that pays per board, and you can add a number of
    boards. This is great if you know you specifically have a couple of boards that
    you will want to add this to and want your team to have access to bulk editing
    features. There is a minimum number of licenses, and each plan comes with a free
    7-day trial.


    Next, you’ll need to open the Bulk Actions editor to start choosing cards and
    making changes. Click the **Bulk Actions** button at the top of your Trello board
    to see a version of your board with a few additional elements:'
  merge: -1
  img_proc: true
- pgno: 324
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_324_0.png)


    Figure 12.23 – Bulk Actions editing view


    Notice on the left that there’s a dropdown with a pencil that can be used to filter
    cards, and there’s also a list of actions across the top of the page on the right.


    Lastly, you’ll notice each card and list has a checkbox on it in the top-right
    corner. This is how you select cards to change!


    # ## Selecting multiple cards to edit


    Before you’re ready to make changes to cards, you need to select the ones you
    want to edit. You can do this by manually checking the box on each card, but that
    can still be a lot of clicking around, so I only do this if there’s no clearer
    way to quickly grab all the cards.


    If you want to select all the cards in a list, click the checkbox at the top of
    the list. If you want to select all the cards on the board, just click the checkbox
    on each of the lists.


    Keep in mind that you can only select a maximum of 80 cards at a time. This can
    be tough if you have a lot of cards in a list, but there’s a handy way to still
    quickly select a lot of cards. Hover over any card to see what I mean:'
  merge: -1
  img_proc: true
- pgno: 325
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_325_0.png)


    # Figure 12.24 – Icons for selecting cards between other cards


    You’ll see green and gray boxes appear on the left of the card, which allow you
    to select all cards above or below the current card. This allows you to select
    a card at the top and then scroll down to quickly grab all the ones in between.
    You can see how many cards have been selected at the top left of the board.


    One more way to quickly grab multiple cards is with the filter. Click on the dropdown
    that says --- all cards --- at the top of your board, next to the pencil icon:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_325_1.png)


    # Figure 12.25 – Bulk Actions filter options'
  merge: -1
  img_proc: true
- pgno: 326
  md: 'This opens a modal that filters the cards that are displayed in the **Bulk
    Actions** modal. You can filter by labels, members, keywords, or due dates. You
    can leave the page and the filter will be automatically saved as a draft. However,
    you can also choose **Save as view** to name it and access multiple filtered views.
    This shows a filtered version of your board so that you can quickly check the
    lists to select all the cards.


    This is helpful if you know that you want to change all the cards that are assigned
    to one teammate to another teammate.


    # # Making changes to multiple cards


    Now that you know how to select multiple cards, you’re ready to apply edits to
    those cards! Once you’ve selected the cards you want to change, choose the field
    you want to change from the top of the board:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_326_0.png)


    Figure 12.26 – Bulk Actions nav bar


    We’ll start by changing the labels, so we’ll click **Relabel**. A modal appears
    with all of our board’s labels. We can now check the labels we want on the cards
    and remove the checks on the labels we want to remove. If you don’t want to make
    any more changes to those cards, click **Relabel**. I’m going to adjust the due
    dates, so I’ll click **Relabel and keep selection**:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_326_1.png)


    Figure 12.27 – Bulk Actions options for saving changes


    Now, your cards have new labels! You can see this in the **Bulk Actions** overlay.
    Next, let’s shift the due date. When you’re working on a project and the final
    due date is pushed back 10 days, that’s a real pain because'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'now you must go find all the dependent tasks and click 10 days later for each
    task. I’ve always thought there had to be a better way, and sure enough, there
    is with Bulk Actions.


    I chose to keep the selection, so the same cards are still selected, but if you
    don’t want to use these cards, then go ahead and select the cards that relate
    to the project. You might be wondering—but wait, they are all going to have a
    different date, so is it really a bulk change? And yes, it is, because you can
    _shift_ dates, which is going to move all the dates by the same amount, rather
    than to the same date. Click **Due dates** from the top of the board. This opens
    a modal giving you options for how to change the dates as well as a preview of
    what those changes will look like:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_327_0.png)


    Figure 12.28 – Due date editor


    Check the **date** box and then click the **shift by...** option.


    You’ll then have the option to show how much to shift the date on each card by.
    You can control shifting by years, months, weeks, days, hours, or minutes, and
    you can even use negative numbers if you need to shift to an'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'earlier date instead of a later one. Preview the changes and confirm it looks
    like you’d expect:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_328_0.png)


    Figure 12.29 – Previewing due date changes


    When you’re done, click **Change Due Dates**. You know how to shift due dates
    like magic! Close out of the **Bulk Actions** overlay by clicking the X button
    in the top-right corner, and you’ll see your cards on your board have the new
    due dates.


    There are so many other changes you can make to cards with Bulk Actions, including
    updating custom fields, or archiving or deleting cards. I tend to recommend this
    Power-Up frequently because it’s so useful, no matter how you use Trello.


    # ## Summary


    I’ll say it once more—these are just a couple of the hundreds of Power-Ups that
    are available. There is no perfect answer to “What are the best Power- Ups for
    every Trello user?” because everyone uses Trello so differently! But these Power-Ups
    work well for just about any use case because most involve getting stakeholder
    approval, adding custom data, and making changes to many cards at once.


    Explore the Power-Up directory to learn about Power-Ups for your use case. For
    instance, if you’re managing contacts in your Trello boards, you’ll'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'want to use Crumble to add contact fields and pipeline reporting to your board
    automatically. If you want to build your own app on top of Trello, such as a hiring
    portal or a blog, you can use a Power-Up such as Hipporello to create apps for
    your users that let you operate in your Trello boards. Even email has Power-Ups
    in Trello, such as SendBoard and Cardbox that let you manage your inbox from Trello,
    perfect for support teams or any team with a shared inbox that needs triaging.


    And new Power-Ups are being added all the time! Search the Power-Up directory
    or post in the Atlassian Community to learn about more Power-Ups and get inspiration
    for which ones might work best for your boards.


    No matter how you use Trello, you’ll find these useful to improve your workflows.
    Now, let’s dive into some more Trello Power-Ups that help you get information
    into your boards and synced with other tools or even other boards!'
