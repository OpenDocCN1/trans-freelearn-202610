- pgno: 211
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_211_0.png)


    # Figure 8.2 – Sort actions


    For folks who prefer their cards in a specific order, I don’t think I’m being
    dramatic when I say that this section is going to be life-changing for you. These
    actions help you organize cards in lists by what matters most to you, whether
    it’s due dates, custom field values, or even labels. While you can manually sort
    a list by clicking the ellipses at the top of a list, the options there are actually
    a bit more limited than the automation options. Specifically, there’s no option
    to sort by labels. That’s where automation shines!


    If you’ve ever sorted data in a spreadsheet, this is similar. Sorting will group
    cards by the attributes you define and in the order you’d like. Let’s dive into
    the specifics!


    # Sort list by ___


    You have virtually any option you can think of for sorting a list. This action
    gives you a way to sort by date, title, votes, age, and time in the list. I like
    to think of this as my “quantifiable” sort. What I mean by that is, it’s clear
    what order it should be in (alphabetically, newest to oldest, etc.)


    Choose a specific list to perform the sort on by clicking the bullet list icon,
    but if you don’t select that, by default, it will perform the sort on the list
    on the trigger card’s list.'
