- pgno: 235
  md: 'Click **hours** in the second row, and you can select another cadence. Change
    it to **weeks**, and now your card will be due one week (or seven days) from when
    it was created. Click the + button at the end of the row in the modal.


    Finally, don’t forget to click the + button at the very end of the row to add
    this action to the workflow!


    Almost done, but there’s one more step. Scroll up to confirm the rule looks the
    way you expect.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_235_0.png)


    Figure 9.8 – Preview of triggers and actions


    Make sure the trigger matches your expectations and isn’t so broad that it will
    run often, but also not so narrow that it never runs. You might have to try this
    rule for a few days to figure it out. Also, make sure the actions are what you
    intended. When you’re ready, click **Save** in the top-right corner.


    Enjoy the confetti that sprays across your screen after you save a rule. 🎉 This
    is one of my favorite parts of Trello!


    # # Testing your rule


    You might think you’re done at this point, and you could be. But this next step
    is what sets you apart from an automation rookie. You’re going to test the rule
    because you’re a professional and you don’t want anything to happen inadvertently.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'To test a rule, simply do the action that triggers it. For the rule we made,
    we triggered it to happen every time a card is added to a board. So, create a
    new card, and confirm that you’re added to the board and the due date is set to
    one week from the current date.


    Go ahead and try it out. I’ll wait.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_236_0.png)


    Figure 9.9 – New fields set on automation when a card is added to a board


    Yay, it worked! If it didn’t work for you, make sure your rule looks like the
    screenshot in _Figure 9.8_. If it doesn’t, that’s an easy fix; you can edit existing
    rules.


    # # Editing existing automations


    If you want to make changes to the rules you’ve created, head back to the **Rules**
    section of **Automation** and you’ll see a list of the rules you’ve created. Find
    the rule you created. If you just created it, it will be at the top.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_237_0.png)


    Figure 9.10 – List of existing rules


    Click the pencil icon above the rule, and you’ll be back in the editor. You can
    remove actions and triggers and set them to be whatever you’d like them to be.


    For this example, we built this automation to happen for every single card that
    is created on this board. But after a while, you might find that’s happening too
    often, and you really only want it to happen to cards that are added to a specific
    list or have your name in the card description. This is where you can adjust the
    rule by using filters and changing the trigger and/or actions.


    You can edit all automation this way


    This isn’t just for rules! Any other automation you create can be edited after
    it’s been built by going to its menu from the left-side panel, then clicking the
    pencil icon next to the rule you want to edit.


    # # Other automation settings


    Let’s take a moment to explore the other buttons near the pencil, as they each
    help you be as efficient as possible with your automation.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_238_0.png)


    # Figure 9.11 – Options for editing existing automations


    The **tag icon** to the left of the pencil allows you to label automations and

    group them. Notice the filter button to the top right above all automations

    that says **All** at the top. Clicking that gives you options to show only

    automations that fit the specified criteria, such as a tag.


    The **copy icon** on the automation menu is for copying. This duplicates a

    rule, which can be helpful if you need the same set of actions to occur with

    multiple triggers. As of 2022, there’s no way to apply OR triggering, for

    example, “when a card is added to the **To Do** list” OR “when a card is

    added to the **Doing** list,” so the copy button is helpful to duplicate a rule

    and just swap out the trigger.


    The **trash icon** is for deleting a rule, but if you want to stop a rule from

    running, I recommend unchecking the **Enabled on this board** field below

    the rule. This stops the rule from being executed on the board but keeps it

    saved so you can turn it back on later.


    Lastly, we have the **light bulb icon**. This opens a log so you can see when

    the rule was run and any errors that happened with it. I don’t use this much,

    except for when something doesn’t work the way I expected and I need to

    debug.


    There is one more button at the end that is powerful – it allows you to take

    the current rule and add it to another board. This is incredibly useful if you

    have a series of boards that serve the same purpose and need to use similar

    automation.


    I hope I get the chance to write an updated edition of the book one day and

    report that Trello has made it much easier to bulk apply automation to other'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'boards or share automation with others for them to add to their own boards,

    but for now, this is the best way to do it. You can share libraries of

    commands, which share a group of tagged commands with others in your

    workspace, but this is only available for Trello Standard and Premium

    workspaces, and it only shares with folks within your workspace, so it’s not

    helpful if you’re building automations for other teams or clients. Also,

    buttons can’t be shared, but the Trello docs state that they plan to include

    them at some point. See here for reference:

    support.atlassian.com/trello/docs/working-with-command-libraries/.


    You could spend forever playing with rules, but it’s time to move on to the

    next type of automation.


    # # Button automation


    Sometimes you can’t quite put your finger on when you need to trigger

    automation. For instance, maybe it’s not _every_ time a card is moved to

    another list, just sometimes. Or maybe you don’t always want to convert all

    the checklist items to cards, but you also don’t want to have to manually do

    it for each item either.


    This is where buttons come in handy. You can add buttons to your cards and

    your board so that you decide when the automation happens, and then

    Trello takes over from there.


    When to use button automation


    Use buttons when you have a series of actions you want to automate but

    there are no consistent criteria for when you need it triggered. Or use it

    when you just prefer to have the control of clicking a button to make a

    series of actions happen! I know some people who use card buttons to move

    a card to another list, even though you can drag it or select the **Move** action

    on a card.


    This can be useful if you’re trying to limit the **command runs** you perform.

    All Trello plans have access to the same automation features, but each plan

    offers a different volume of the number of times an automation can run.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'Buttons also make a nice aesthetic on a card and can be great for instructing
    newbies on what needs to happen next on a card.


    Trello offers two kinds of button automation: card and board. Let’s start with
    the card button.


    # # Card buttons


    Card buttons are used for automation that you want to perform on, well, a card!
    This button will appear on every card on your board and will perform the associated
    actions on that specific card.


    Let’s make a card button that removes the members and due dates from a card, and
    then moves it to our **Backlog** list. This is helpful for “resetting” a card,
    which you might need to do if a task has been deprioritized or a project moves
    to another team.


    # # Creating a card button


    To create a card button, go to the **Card Button** section of the **Automation**
    menu on the left-side panel.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_240_0.png)


    Figure 9.12 – Card Button automation section'
  merge: -1
