    tabs that you can look through, all as part of the **INSIGHTS** section. Click
    **Completed** and you’ll see similar charts to what you saw in **Open items**,
    but instead showing the data about cards that have been completed.


    You’ll start by seeing a table of tasks recently completed, and clicking on one
