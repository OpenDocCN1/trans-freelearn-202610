- pgno: 197
  md: '# Figure 7.9 – Options for types of checklist items


    You can also select **from checklist** to have the action remove the qualifying
    items from all checklists on a card.


    # Real-world use case


    When a card is due within a day, remove all completed items from all checklists.


    This is helpful for prioritizing exactly what needs to be done so you can focus
    on only the remaining tasks and make your checklists less cluttered. Just make
    sure to take time to celebrate the things you’ve already done!


    You’re a checklist automation expert now! Next up, let’s look at what we can automate
    with members and people in our boards.


    # Member actions


    Member actions are incredibly helpful because assigning a person to a card makes
    it easy to filter cards and determine who gets notifications about a card. It’s
    also a great way to track capacity and workload management.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_197_0.png)'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Figure 7.10 – Member actions


    Since card members are tied to so many other aspects of Trello, such as

    filters, views, and, perhaps most importantly, notifications, it’s important to

    make sure the right people are on the right cards at all times. If you think

    about it, you probably have a pretty systematic way of adding people to

    your cards, no matter how you use Trello.


    For instance, you might have your designer take over the card when it

    moves to a certain stage in your marketing board, or you might have your

    product manager assigned to any newly added cards to evaluate their

    importance. Once you determine a system for who gets what, you can save

    yourself time each week by avoiding the manual process of opening a card,

    clicking on members, thinking about who it’s for, and then clicking on their

    name.


    Even if you’re the only person on the board, you might still want to assign

    items to yourself for notifications or integrations with other apps.


    # Join/leave a card


    This action is for just you, the one setting it up. So, if you want to

    automatically join a card (or leave a card) based on certain criteria, this is

    the action you want to use.


    # Real-world example


    When a card is due in the next five days, join the card.


    This ensures you’re aware of cards that are due soon, even if you don’t have

    a filter in place or a view that highlights upcoming cards.


    # Subscribe/unsubscribe to a card


    Subscribing to a card is the same as “watching” a card. This means your

    avatar won’t show up on the card and you won’t be an official “member” of'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'the card, but you’ll still get notifications about activity on the card. We
    learned about **watching** in _Chapter 2_.


    Keep in mind, this rule also applies to just you. You can’t subscribe for other
    folks, so if other people on your team want this rule, they’ll need to set it
    up themselves. Maybe you should lend them a copy of this book with this page earmarked!


    # Real-world example


    When a card is added to the board with the yellow “interesting” label, subscribe
    to the card.


    This is a quick way to watch a card, and by tying it to a label, you’ll remember
    why you wanted to watch the card.


    # Add/remove a specific user to a card


    If you want to add (or remove) specific users to a card, this is how you do it.
    They must be members of the board! Don’t worry if you can’t remember exactly what
    their username is, because when you click the member box, all of your members
    will show up as options in a dropdown.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_199_0.png)


    Figure 7.11 – Member drop-down options


    Just click the one you want, and you’ll be ready to go.


    # Real-world example'
