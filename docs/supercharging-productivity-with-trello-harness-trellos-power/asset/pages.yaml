- pgno: 191
  md: '# Figure 7.8 – Checklist actions


    We learned about checklists in <u>Chapter 3</u>, and they’re one of my favorite

    parts of Trello. As someone recently diagnosed with ADHD, I’ve learned

    that breaking tasks into smaller bites and making clear action items make it

    easier for me to get started on something, and easier to finish. Plus, it helps

    me ensure I don’t forget any important steps along the way.


    While that’s all good and well, it means nothing if it becomes another thing

    to do to manage those subtasks. That’s why checklist automation is helpful,

    whether it’s automatically adding a checklist for standard tasks that I have,

    such as cleaning my kitchen, or moving the due date when life happens and

    things get delayed.


    There are a lot of options here. Instead of feeling overwhelmed, just

    remember you don’t need to learn them all now—it simply means there’s

    more you can do with them if you one day decide to!


    # Add/remove checklists to a card


    This is probably the most common action applied to cards. By clicking the

    target icon you can define an existing checklist that you want to add.


    I find this works well with creating a template card that has the checklist

    you plan to use for automation. That way, you don’t have to worry about

    copying over a partially completed checklist or anything and it’s easy to

    edit from one place if you ever want to make changes.


    # Real-world example


    Every day at 6 a.m., create a new card with a Daily Habits checklist.


    This is great for giving me one place to check my daily habits.


    # Add an empty checklist'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'This is effectively the same as the “create a new checklist” action you can
    click inside a card. You can add a new checklist to the card and then add actions
    below it to add items to that new checklist.


    # Real-world example


    When a card is added to the **Design** list, create a new checklist called **Design
    Tasks**.


    This is useful for starting a new checklist on a card automatically. Note that
    this rule doesn’t add items to the checklist, but you can use the next action
    to do that.


    # Add/remove items to a checklist


    You can add/remove items from a checklist on a card. Just specify the name of
    the checklist you want to add it to, and if it doesn’t already exist, then it
    will create that checklist.


    # Real-world example


    When a red urgent label is added to a card, add a checklist item for **follow
    up on the case with customer**.


    This is helpful for dynamically updating items in a checklist based on other activities
    in the card.


    # Assigning the item to someone


    If you have Trello Standard or higher, you will have advanced checklists, which
    let you assign due dates and members to items in a checklist. When someone is
    added to a checklist item, that task shows up on their **Home** page under **Your
    Items**.


    You can also incorporate more automation to organize these subtasks in other ways,
    such as every time someone is added to a subtask, creating a card with that task
    and a link to the card as a new card on another board.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Real-world example


    When a checklist item is added to **Course checklist**, assign Robin.


    This is useful if you tend to have the same people dedicated to specific tasks.
    It saves you the step of adding them after creating the task.


    # Set the item due date


    Similar to being able to add members, if you’re on Trello Standard or higher,
    you can add due dates to checklist items. This action lets you set the date of
    a task and gives you similar options to what we saw with date actions. Clicking
    **now** opens a modal with more date customization options, similar to what you
    see in the **Dates** section.


    # Real-world example


    When a checklist item is added to the **Daily** checklist, set the due date to
