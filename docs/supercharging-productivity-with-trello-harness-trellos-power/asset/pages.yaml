    message **A new card has been added to the board! View it here**

    **{cardlink}**


    If you have trouble getting people on your team to check Trello, try using

    this action to send email notifications. You can even do this for cards people

    are not subscribed to, which is a perfect way to help more people get on

    board—literally.


