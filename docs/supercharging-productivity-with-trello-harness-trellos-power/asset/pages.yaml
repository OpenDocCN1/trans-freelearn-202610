- pgno: 277
  md: '# Figure 11.5 – Power-Up listing


    This takes you to the listing, which shows even more detail. Power-Up developers
    will typically use this section to explain what the Power-Up does, what type of
    user it’s best for, and how it works, often with GIFs and screenshots included.
    You’ll typically see pricing information on here as well if the Power-Up is not
    free.


    You can also find a way to contact the Power-Up developer with the **Contact support**
    button just below the name at the top. This is helpful if you have questions about
    the Power-Up or need to troubleshoot anything.


    When you’re ready to try out a Power-Up, simply click the **Add** button. Every
    Power-Up is a little bit different, so what happens next will vary by Power-Up.
    But it will typically include a screen asking you to approve their access to your
    Trello board, and sign up for or sign in to any third-party accounts or configure
    any initial settings.


    After you’ve added a Power-Up, you can always access it from your board via the
    **Power-Ups** button in the top toolbar.'
