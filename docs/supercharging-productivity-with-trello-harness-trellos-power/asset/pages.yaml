    # Dates


    # Let’s make some automation happen with dates!


    ![](img/21bbd56263f8fc423bc91d3203b460bb_186_0.png)


    Figure 7.6 – Date actions


    If you have a process that involves setting, changing, or completing due dates,
    this is the section you want to pay attention to. Well, of course you do, because
    many of us use due dates in Trello to surface the most time-sensitive tasks and
    make sure we’re moving through our projects at the right pace.'
