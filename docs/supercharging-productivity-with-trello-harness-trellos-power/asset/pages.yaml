    I try to give the button a name that is clear and concise about what’s happening.
    Good luck. This is the hardest part 😅 I’m going to call this one `Reset card`.


    After you’ve picked a name and icon, confirm the options. By default, the buttons
    will be enabled, but you can turn that off so the button does not show up for
    everyone and needs to be added by individuals. You can also check the option to
    close the card once the actions have been completed. I tend to leave these settings
    as is. When I’m making a card button, I tend to want everyone on the board to
