    yet, refer to _Chapter 2_ for instructions on creating new labels.


    Real-world example


    When a comment contains **urgent**, add the red **urgent** label to the card.


    This is great for quickly categorizing cards and helping ensure you don’t miss
    anything important that might be skimmed in the comments.


    # # Add/remove a sticker to a card


