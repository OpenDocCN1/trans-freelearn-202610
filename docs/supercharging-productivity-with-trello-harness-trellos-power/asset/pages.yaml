    and reset it.


    # Real-world example


    When a card is moved to **Design**, add the **Designer** checklist and reset all
    the checklists.


    This is most helpful if you’re using the same checklist across multiple cards
    and not specifying the checklist from a template card, which ensures the checklist
    is always starting off as incomplete. With this rule, you can add a checklist
    and even if it imports a partially completed one, it will reset it for the current
    card.


    # Remove items from checklists


    You can remove all items or complete or incomplete items from all checklists or
    a specific checklist. There are a lot of ways you can go about this, but I would
    mostly group this under the checklist clean-up section. Click **the before items**
    to view a dropdown with additional options for specifying the types of items to
