- pgno: 307
  md: '# # Approving or rejecting an approval


    If you’re the approver, you can click the ✓ or X button to approve or reject.
    If you accidentally click, you can click again to reverse your approval.


    Notice that not only do you see the status visualized on the card back but you
    can also see the status from the card front as well, making it really easy to
    see at a glance on your Trello board:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_307_0.png)


    Figure 12.6 – Rejected status on the card front


    This makes it easy to quickly identify the approval status of cards across a board.


    Of course, you may not want to manually add an approver for every single card
    if you always need the same people to approve a card. Although there’s no way
    to quickly select multiple cards and set approvers for them, here’s what I recommend
    doing.


    Start by creating a card that we can use as an example for any new card added
    to your Trello board. In my example, I might make a template card for a feature
    request. Set the approvers on that card. I’ll add my Tech Lead as the approver.


    Now, whenever I want to add a new feature, I’m going to copy that example card,
    and it will copy over the approvals. (We can do this with automation by making
    a board button! Refer to Chapter 9 for a refresher on creating board buttons.)
    And there we have it—the approvers have been automatically set for this card!'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# # Viewing cards by approval status


    If you want to see which cards you’ve approved, or which ones are waiting on you,
    click the **Approvals** button that appears in the top toolbar of your Trello
    board!


    An **Approvals** dashboard will appear at the bottom of your Trello board so that
    you can easily view your cards by approval status and quickly identify anything
    that needs your attention:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_308_0.png)


    Figure 12.7 – View of cards sorted by approval status


    Use the drop-down menus to see the review status of other approvers. Just click
    your name and select **All members** or another board member to change the displayed
    cards. You can also click **All lists** to specify which lists to view. For instance,
    maybe you’re only interested in cards that require your review right away, so
    maybe you want to only show cards that need your review in the QA list rather
    than every card on the board that will eventually require your approval.


    # # Advanced features


    If this sounds good but you want a bit more, you’ll be excited to know that the
    paid (Pro) version includes more features.


    # # Creating an approval group or team'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'With the Pro plan, you’ll have the ability to create an approval team. Let’s
    say you need someone from legal to sign off on something, but you don’t need a
    specific person—just one member of the legal team. You could create a team of
    five people from legal, and only one of them would need to approve to show a card
    with an approved state. Now, you can specify a type of approval and how many people
    you need from that group to approve.


    # Specifying multiple approvals on a card


    Another Pro feature gives you the ability to specify multiple approvals on a card,
    instead of just one that may contain multiple people. For instance, you might
    do this if you need someone from legal, someone from infosec, and someone from
    finance groups to approve a new tool to add to your company’s workspace.


    # Moving cards based on status


    Typically, when someone approves a card, it’s moved to the next stage in the workflow,
    and if it’s rejected, it might move to a previous stage in the workflow so that
    a teammate can rework it and request approval again. Rather than having to manually
    move the card after you see the approval status updated on a card, you can set
    up automation rules (in **Approval Teams**) that move cards to specific lists
    once their approval status has changed. If you create an Approval team in the
    Pro plan, you can select **Move on Approval** or **Move on Rejected**.


    # Upgrading to Pro


    If any of these features sound interesting and you want to upgrade, it’s easy
    to do. To do this, click on the **Approvals** button on the right side of any
    card, and select the **Get Pro** action at the top:'
  merge: -1
  img_proc: true
- pgno: 310
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_310_0.png)


    Figure 12.8 – Upgrading to the Pro plan


    Now that we’ve covered approvals, let’s talk about other fields you might

    want to add to your board!


    # Amazing Fields


    Trello’s native custom fields are powerful and versatile, but for something

    called custom fields, you can only “customize” so much. There are only

    five types of fields and you can’t style anything about them, other than the

    colors of the drop-down options for the drop-down field type or the name of

    the field. While they’re useful for holding data, if you want to type longer

    notes (or anything more than about 20 characters), the text gets cut off and

    is hard to read. And hey—they work great for many use cases! But

    sometimes you just need a little bit more.


    Amazing Fields takes custom fields a step further, allowing you to create

    additional fields on your Trello cards and customize where and how they

    appear. Amazing Fields is built by the Amazing PowerUps company and

    has been added to over 100,000 boards! Just as with other Power-Ups,

    there’s a free plan that has plenty of functionality and a Premium version

    that lets you do even more!


    # Why use Amazing Fields?


    You’ll want to use Amazing Fields when you have additional info you want

    to add to your boards, such as more dates or more text fields, checkboxes'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'indicating status, or just about any other piece of data that doesn’t exist
    with core Trello card attributes.


    Specifically, you’ll want to use Amazing Fields instead of Trello’s native custom
    fields when you want to choose how additional fields look, or when you want to
    want to control the visibility of fields and who can edit them.


    Although there’s a ton you can do with Amazing Fields, I’ll explain how to get
    set up and create your first field, and then I’ll leave you to play around to
    your heart’s content.


    I’m going to show you a _very_ real-world example because I’m actually using it
    to write this very book! I’ll show you how I use Amazing Fields to keep track
    of the number of pages I need to write for each chapter, as well as the number
    of words.


    # # Adding Amazing Fields


    To add Amazing Fields to your board, click **Add Power-Ups** from the **Power-Up**
    button on the top toolbar of any Trello board. When in the directory, search for
    `Amazing Fields` in the search bar on the top left. You should then see the following:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_311_0.png)


    Figure 12.9 – Amazing Fields card in the Power-Up directory


    Click the **Add** button, and then once again, click **Add** to confirm you’re
    aware this is a Power-Up not created by Trello. Immediately, you’ll be'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'prompted to connect your Trello account and allow access, and then you’re ready
    to create your fields!


    If you close out and go back to your board, you can access this settings page
    by clicking **Fields** in the top toolbar of the board and then selecting **Settings**:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_312_0.png)


    Figure 12.10 – Amazing Fields modal with Settings


    Now, let’s make a field! Specifically, let’s make an _amazing_ one. 😃


    # # Creating a field


    Start by clicking the + **Add** button on the left side of the panel, just inside
    the **Fields** section below the **Settings** section:'
  merge: -1
  img_proc: true
- pgno: 313
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_313_0.png)


    Figure 12.11 – Amazing Fields Settings and Fields sidebar


    Then, you’ll be prompted to choose a type of field. Hover over each one to display
    more options and see which types of fields you can build:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_313_1.png)


    Figure 12.12 – Amazing Fields categories


    There’s a lot you can do! You’re probably expecting basic fields such as text,
    checkbox, date, numbers, and dropdown, but there are many other'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'field types such as progress bar and card reference, and even fields that organize
    your fields such as sections headers or tabs.


    For my Trello book board, each card is a chapter, and I needed a number field
    to store the number of pages for that chapter. I clicked on **Basic Fields** and
    selected **Number Field**. Go ahead and do that to follow along with me!


    Now, you’re on a page giving you options to configure more than you ever thought
    possible for your fields. Start by naming your field. You can even give your field
    an emoji!


    ![](img/21bbd56263f8fc423bc91d3203b460bb_314_0.png)


    Figure 12.13 – Amazing Fields number configuration options


    For numbers, you can set the format of a number, such as a currency or a percentage,
    and you can choose whether it’s displayed as a number or progress bar. Other fields
    will have other settings in this section. If you chose a drop-down field type,
    this is where you’d set the options. If you chose a text field, you could choose
    if you want the text to be single or multiple lines. If it’s a checkbox, you can
    choose from six different ways to style the checkboxes!


    We’ll leave these settings as is for our **Pages** field. Now, let’s look at the
    **Card Display** options:'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_315_0.png)


    Figure 12.14 – Amazing Fields Card Display options


    You can choose whether you want to show the field name and/or value (the answer
    on the front of the card or the view when you are looking at a card on a board
    with other cards), as well as whether you’d like comments on the card to log when
    changes are made to a custom field. This is helpful if you need to see when a
    record changed, who changed it, and what was changed. Lastly, you can choose to
    hide new fields on a card so that empty values don’t clutter your cards.


    Next, you can change the way a field is displayed in the **Field Editor Layout**
    option:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_315_1.png)


    Figure 12.15 – Amazing Fields Field Editor Layout options


    You might choose to make it display the full width of the card if it’s a long
    text field and you want to show as much text as possible. This is something you
    can’t do with Trello’s native custom fields, and it’s extremely helpful for displaying
    long blocks of text, especially when paired with the **Multiple Line** layout
    for text fields. You can also specify the location of the label in relation to
    the field, giving you even more customization options.


    For more styling, you can set the **Background Color** option of a card to help
    it stand out, and you can add conditional logic to specify the'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'background based on the value of the field. You might use this to make a checked
    box appear green and an unchecked box appear red:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_316_0.png)


    Figure 12.16 – Amazing Fields Background Color options


    The next sections of options are only available for Premium subscribers, as shown
    by the **Supporter Only** badge. Field formulas are great for setting values based
    on the value of other fields. Although I don’t use them for my **Pages** field,
    I do use them to calculate the value of my **Words** field. Since I know each
    page should have about 3,500 words on it, my word goal is `Pages * 3,500`, and
    I can build that formula with Amazing Fields. I can also choose to not show the
    **Words** field if I haven’t set the **Pages** field:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_316_1.png)


    Figure 12.17 – Amazing Fields Field Formulas and Advanced options'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'The last section is also only for supporters but is extremely useful if you
    need ultimate control over your fields. In some cases, you may want only your
    admins to be able to edit these fields, or maybe you even only want them to be
    able to view them. With these **Permissions** settings, you can control who can
    see and edit custom fields across the board. This is another limitation of Trello''s
    native custom fields, as anyone on a board can view any values for custom fields.


    The very last setting is what I think really makes Amazing Fields more magical
    than ever because I used to tell people that if you want style, use Amazing Fields,
    but if you want automation, use Trello''s native custom fields. But with this
    final setting, you don''t have to choose!


    Why would you ever want both Amazing Fields and custom fields in your board instead
    of just one? Because Power-Ups don''t work on mobile, so if you want to view field
    values on mobile, you''ll need to use Trello''s native custom fields. Power-Ups
    also aren''t accessible in Trello''s automation suite, so if you want to automate
    anything with your fields, you''ll also need to use custom fields. But as you''ve
    been reading this section, you can hopefully see all the benefits that Amazing
    Fields has over Trello''s native custom fields. That''s why this setting is awesome.
    You can have your cake and eat it too. If checked, Amazing Fields will create
    a custom field for your amazing field and keep it in sync. You can also add the
    **Amazing Fields for Chrome** extension, which will hide custom fields so that
    it doesn''t show duplicate fields on your cards.


    And you''re done! No need to click save or anything—your field is saved as you
    go, and when you''re ready to see it in action, just close out of the X button
    at the top right!


    # # Updating a field


    Open a card on your board, and you should see your newly created fields just below
    the **Description** section:'
  merge: -1
  img_proc: true
- pgno: 318
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_318_0.png)


    Figure 12.18 – Viewing Amazing Fields on cards


    To edit a field, click it and type or select the value, just as you would with

    native custom fields on your board.


    Click the **Visible Fields** button near the top right of the fields if you want
    to

    hide fields on a specific card. You might do this if you have some reference

    or instruction cards that don’t require values like other cards on the board

    do.


    # # Additional features


    There is one more thing I want to show you before we close this section.

    Amazing Fields also offers a board backup feature that copies the board and

    provides a backup just in case anything changes in the board that you want

    to revert. To enable this, toggle on the choice from the **Getting Started**

    page:'
  merge: -1
  img_proc: true
- pgno: 319
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_319_0.png)


    Figure 12.19 – Amazing Fields board backup feature


    You can also export a board in case you need to add the data to another tool or
    in another format. And something else special—you can copy the board configuration,
    which is important if you want to create multiple boards with these created fields.
    For my developer friends, you can also access your Amazing Fields data via an
    API so that you can reference that data in other tools if you’d like. This is
    great if you work with teams that want to be able to access your project data
    through other tools.


    And one more thing! Amazing Fields even lets you view your cards in a table view,
    without requiring a Trello Premium plan. To do this, click the **Fields** button
    in the top toolbar of your board and select the **Table View | Search | Export**
    option. You’ll then see a screen like this:'
