- pgno: 403
  md: 'box. It doesn’t really involve task management and planning, but it excels
    at making an easy interface for getting started with reporting and quickly getting
    valuable information about your projects.


    # # Summary


    Here we are at the end of the chapter, and hopefully you’ve read through all of
    these options and have an idea of which tool might be the right fit for you. If
    you want something that covers most use cases and is easy to use and affordable,
    you might want to go with Blue Cat Reports!


    If you need something that incorporates custom attributes and planning tools as
    well as advanced reporting, you might want to use Placker. And if you want something
    advanced reporting that’s beautiful and easy to configure, you might choose Screenful.


    There’s no right answer as to which one is _best_, but they all offer free trials,
    so take them all for a spin and play around to see which ones work best with your
    workflows. If you have any questions, reach out to their support teams.


    Wow, it feels almost surreal writing the last few sentences of this book. We’ve
    been on quite a journey together. Think about when we started and you learned
    about the components of Trello, all the way to learning how to automate and make
    Trello work for you, and finally to adding integrations that make Trello even
    more powerful and basically a standalone app for handling task management and
    reporting.


    You’ve come so far, and I hope you’re happy with your Trello setup and comfortable
    enough to tweak it as you go. If you ever need a hand, you know where to reach
    me, and in case I haven’t said it enough, I’ll say it once more...head to the
    Trello section of the Atlassian Community to meet other Trello enthusiasts, get
    inspiration, and learn how to do even more cool things with Trello.'
  merge: -1
  img_proc: true
