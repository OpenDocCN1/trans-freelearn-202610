- pgno: 97
  md: 'edit the Google Doc without leaving Trello.


    Learn more about service link cards support on this page: [support.atlassian.com/trello/docs/link-cards/](https://support.atlassian.com/trello/docs/link-cards/).


    # # Disabling link cards


    If you ever want to actually use a link as a normal card, click the pencil icon
    in the top-right corner while hovering over a card and select **Convert to regular
    card**.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_97_0.png)


    Figure 3.31 – Link card menu options


    There are so many ways to add information to your card! Hopefully, it’s clear
    now how you can really keep everything in Trello.


    # # Summary


    Now you can truly put anything you need in your Trello cards. You’ve learned how
    to attach items—whether digital files or links or other Trello cards! You can
    literally map out data in your boards by adding location fields to cards. Your
    worries about delegation and quality assurance are gone because you can add checklists
    to your cards.


    You’re well on your way to becoming a Trello expert since you can confidently
    navigate your cards! Now, it’s time to talk about how we use all of these attributes
    of cards to analyze our cards in different views in Trello.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# # Viewing Cards Your Way


    Now that you know everything you can add to a card, you might be bursting with
    ideas of what to put in your Trello boards. Since organizing a lot of information
    is easy in Trello, you’ll find yourself adding many cards to a board. While seeing
    everything laid out in a board style is helpful, there are multiple ways to view
    your cards that unlock additional insights.


    In this chapter, we’ll discuss how to change the data in your board so that you
    can view the cards that are most relevant to you. You’ll learn how to do the following:


    +   - Set filters to show only the most relevant cards

    +   - Create and view charts that visualize information about cards

    +   - Plot your cards by date on a calendar and timeline

    +   - Make your board look like a spreadsheet

    +   - View your cards by location on a map


    # # Filters


    Filters can be used with every Trello view except **Dashboards**. They do exactly
    what they sound like – they filter all of the cards on the board(s) to only show
    a subset of cards based on criteria that you set.


    Follow along and set up a filter with the cards you’ve already created. To access
    filters, click the gray **Filter** button at the top right of your board, just
    next to the **Automation** button:'
  merge: -1
  img_proc: true
- pgno: 99
