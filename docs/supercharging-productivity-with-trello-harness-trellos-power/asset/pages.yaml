- pgno: 149
  md: '# # Initiating Trello Automations


    By this point, you’re probably using Trello frequently and are familiar with

    updating cards, completing checklists, moving cards around, and getting

    work done in Trello.


    Now, we’re going to talk about how to automate all of those actions so

    keeping up with your work doesn’t turn into its own full-time job. This

    chapter will show you the different types of events that we can implement

    automation workflows for .


    You’ll learn about the following:


    +   - How to know when you’re ready for automation

    +   - Where to find Trello’s automation library

    +   - Types of events that can trigger automation


    Trello is a collaboration tool that assists in managing tasks, but it does not

    actually do all of the managing for you. However, there is a solution—

    automation. By automating certain tasks, Trello can take care of tedious

    work, freeing up your time to focus on other important tasks. Let’s explore

    automation and see how it can make our work with Trello more efficient.


    # # Getting ready to automate


    I want to give a quick word of caution about automation: **don’t start

    automating right away**. Figure out your workflows and how you want to

    use Trello with your team first. Only once you have a solid workflow and

    notice recurring patterns are you ready to start automating.


    # # When are you ready to automate?'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'How do you know when you’re ready to automate? You’ll know you’re ready when
    you can explain what your workflow looks like in terms like this:


    > “When a new card is added to the board, then I add myself to the card and make
    it due in seven days.”


    > “When a card is due this week, then I move it to the Due This Week list.”


    If you can describe your workflow by using When (or If) ... Then statements, then
    you’re ready. That’s because the way automation works is based on two key events:
    **triggers** and **actions**.


    # Exercise


    Grab a pen and paper or your favorite digital drawing tool. Try to draw out the
    way you use your Trello boards, or write out as many “When, then” statements you
    can think of. This will be helpful as you keep reading because you’ll make connections
    between what types of automation you might use.


    # Triggers


    A **trigger** is an event that happens that starts your automation. This is the
    “When” statement in your workflow, such as “When a card is added to a board” or
    “When a card is due.”


    It’s called a trigger because it triggers everything else! Think about a string
    of dominos. When the first one is pushed, then a bunch of others fall. Automation
    is just like that – everything starts with one domino: a trigger.


    In Trello, a trigger is a specific event that serves as the starting point for
    your automation. This event could be something such as the creation of a new card,
    the movement of a card to a particular list, or the addition of a label to a card.
    Once the trigger occurs, it sets off the automated action or sequence of actions
    that you have designated.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'This isn’t just a Trello thing—it’s an automation principle.

    You can make multiple things happen after the trigger. These are called **actions**.


    # # Actions


    Actions are what happen _after_ a trigger. They’re the “then” statements in your
    workflow.

    You can add multiple actions after a trigger. For instance, you can add a label
    to a card **and** post a comment **and** change the due date—all within one automation!

    We’ll discuss actions in <u>_Chapter 7_</u> and in <u>_Chapter 8_</u>, but for
    now, just know that this is what comes after your triggers and are the things
    that actually do the automating. But they can only happen if you tell them when
    to work, which is why we must start with triggers.

    Now let’s explore the triggers that are available in Trello and when you might
    use them! Buckle up, because it’s a lot—but we’ll go through them together, and
    you don’t have to memorize them all. I’ll even provide real-world examples of
    how you might use each one to make them more digestible.


    # # Accessing triggers


    We’ll talk more in <u>_Chapter 9_</u> about how to tie triggers and actions together
    and actually build automation workflows in Trello, but for now, if you want to
    follow along as you read through the types of triggers and actions, you can view
    them by clicking **Automation** in the top toolbar of any Trello board:'
