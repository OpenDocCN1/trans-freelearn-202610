- pgno: 255
  md: '# # Date-Based Automation


    While you can trigger automations to occur when certain things happen with triggers,
    and you can manually make them happen with buttons, there are two other ways you
    can trigger automations, both of which are related to dates. We’ll dive into how
    they work in this chapter.


    Here’s what you’ll learn in this chapter:


    +   - Automation for creating a new card each day

    +   - Testing your date automations

    +   - Automation for joining a card when it’s due


    Just like in the other chapters, you may not use these every day, so there’s no
    need to obsess over every detail if this is your first time learning about them.
    Get comfortable with what’s available and come back to re-read this chapter whenever
    you want to dive deeper into how to set these up.


    # # Scheduled automation


    So, you get it – there’s a lot you can do with Trello automation, and buttons
    are great for when you want to manually trigger something. But what about the
    trigger of time?


    Scheduled automation is Trello’s version of telling specific actions to happen
    at a recurring interval, such as daily, weekly, monthly... or just about any time
    you can think of.


    # ## When to use scheduled automation


    Use scheduled automation when you have processes that you do every day or week,
    such as creating daily reminder cards or moving cards between lists at the start
    or end of a week. If you explain your workflow in Trello'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'and catch yourself saying “Every Monday morning, I...” then that’s a cue that
    you should probably automate it with scheduled automation!


    Because of the nature of scheduled automation, we need more triggers than we’ve
    seen so far. Let’s see what we can find. From the **Automation** modal, make sure
    you’re on the **Scheduled** section in the left-hand side panel:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_256_0.png)


    Figure 10.1 – The Scheduled automations section


    Click the **Create automation** button in the top right, then click **+ Add Trigger**.


    You might think you’ve seen all of this before, but lo and behold, new trigger
    options will appear!


    # # New triggers for schedule automation


    Because we are in the **Scheduled** section, we get some special triggers. These
    are different than the ones we reviewed in _Chapter 6_:'
  merge: -1
