- pgno: 165
  md: 'This might not make a lot of sense until you see it in action, but when you
    set this rule, it will take any type of date (such as a number or even the word
    **Monday**) in the card’s title or description and use that to set the due date
    of the card.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_165_0.png)


    Figure 6.12 – Trigger action under the Dates section that sets the due date from
    the name or description


    For example, if you create a card named **Email client on Tuesday**, it will apply
    the upcoming Tuesday as the due date for a card. If you type a specific date,
    such as **Email client on April 25th**, it will set that date—in this case, April
    25th—as the due date!


    Click the pencil icon after the name and Trello will remove the date from the
    card name.


    This rule is unlike any other rule because it contains both a trigger and an action.
    If you just click the + icon at the end of the rule and save, you won’t need to
    add anything else to it because it already contains both the trigger (when a card
    has a date in it) and the action (set the due date).


    Real-world example


    When I type a date into a card name, set that as the due date.


    This lets you set the due date of a card when creating it. This means when you
    create a card named **Email client on Tuesday**, it will then set the due date
    to the upcoming Tuesday and rename the card to **Email client**.


