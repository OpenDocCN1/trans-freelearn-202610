  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_183_0.png)


    # Figure 7.4 – Add/Remove actions


    If you’re making changes to cards that don’t necessarily have their own sections
    (such as due dates, members, or links), you’ll find this section most helpful.
    It’s also a great place to go when you want to create a specific kind of card
    with checklists, dates, members, and more. For example, maybe you have a board
    for request ads. You could create a button that uses the **create a new card**
    action to create a templated card with all the fields set to your preferences,
    all with the click of a button!


    Let’s start from the top and work our way down.


    # Create a new/unique card


    Don’t get this confused with copying or moving—this creates a brand-new card!
    You can define just about anything you want with this new card. Though only the
    title and specific list are required, you can include a description by clicking
    the pencil icon. The rest is optional, but if you prefer, you can add labels,
    checklists, or due dates, and assign members. This is great for making a templated
    card type or creating recurring cards.


    # Real-world example'
