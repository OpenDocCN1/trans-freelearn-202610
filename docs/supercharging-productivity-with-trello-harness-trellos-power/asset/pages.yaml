- pgno: 262
  md: '# # When to use Due date automation


    You’ll use **Due date** automation if you have specific actions that you need
    to happen concerning a card that’s due. If you felt that the date triggers in
    **Rules** were pretty limited, you’ll be happy to know you have some additional
    triggers here. The difference is that these relate more to monitoring the relation
    of the current day to a due date, whereas **Rules** focus more on changes in the
    fields, regardless of their relation to the current scope of time.


    Because we need to automate based on time, some new triggers are available. Let’s
    explore them!


    Start by making sure you’re in the **Due Date** section of the **Automation**
    modal:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_262_0.png)


    Figure 10.8 – The Due date automations section


    Click the **Create automation** button in the top right, then click **+ Add Trigger**.
    Once again, we have a whole new world of trigger options to explore.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# # New triggers for Due date automation


    These new triggers all focus on monitoring the due dates of cards and the current
    day/time’s relation to that.


    A banner inside this section offers some sage advice that I’ll highlight as well
    because it’s important to know. If you apply a new automation for moving all cards
    due in the next seven days to the **This Week** list, for example, you might be
    wondering why your cards didn’t move after you saved them. That’s because these
    automations _do not work retroactively_ and will not find cards that are due within
    seven days and then move them. The automation will look for the current date and
    any cards due today, plus seven days after, for each day. So, if you don’t see
    your cards move suddenly, that doesn’t mean your automation is broken. It just
    means you’ll need to manually find those cards and move them.


    Pro tip – use a Board Button for any cards you want to retroactively apply this
    rule to


    You can use a board button to move any card with a due date in the next seven
    days to a specific list. This means you can still use automation and don’t have
    to do anything manually!'
  merge: -1
  img_proc: true
