- pgno: 261
  md: 'You might be wondering how you’ll test out your new rule since you can’t just
    enforce your trigger and suddenly make it Saturday (although that would be nice).


    Thankfully, Trello has a way for you to pretend it’s Saturday, or whatever day/time
    you have set up in your trigger:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_261_0.png)


    Figure 10.7 – Rocketship icon for testing scheduled automations


    From the **Scheduled automations** menu, find the rule you want to test; you’ll
    see a new icon above your rule! Upon clicking the rocketship icon, Trello will
    execute your actions as if the day/time trigger has just happened, allowing you
    to be sure the desired actions take place and you’re happy with your rule.


    If you’re not, click the pencil icon and tweak your rule until it does what you’d
    like. Sometimes, it takes some experimentation – no matter how good you are at
    Trello automation!


    There’s one more set of special triggers that we need to discuss before I can
    present you with your Ph.D. in Trello automation. Let’s talk about **Due Date**
    automation since it’s well overdue. 😉


    # # Due date automation


    We’ve almost covered all the ground regarding Trello automation, but if you’ve
    been following along, you might have noticed there’s one more section we haven’t
    discussed yet. Let’s talk about **Due date** automation.'
