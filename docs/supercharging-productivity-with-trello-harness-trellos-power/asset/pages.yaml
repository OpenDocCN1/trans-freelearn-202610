- pgno: 85
  md: '**Delete field** button. This is meant to prevent any accidental deletion of
    data from your boards.


    # # Setting a custom field value


    You can find the **Custom Fields** section of a card just below the card description
    and above the attachments. Interact with the field just like you would any other
    field on the card. If it’s a checkbox, click the box to show whether the task
    is complete or incomplete. Click a text or number field to input a value. Select
    a date field to open a calendar. Click a drop-down field to view the configured
    options.


    There’s no need to click **Save**—simply moving away from the field saves the
    input!


    ![](img/21bbd56263f8fc423bc91d3203b460bb_85_0.png)


    Figure 3.18 – Setting custom fields on a card


    If you need more inspiration with custom fields, head to the Trello section of
    the Atlassian Community to ask questions or see what other folks are doing with
    their boards—you’ll find many cool uses of custom fields!


    # # Checklists


    The checklist feature lets you create a list of subtasks that need to be completed
    in relation to the task or project. This field is particularly useful for breaking
    down complex tasks into smaller, more manageable pieces.


    Why use checklists?


    Checklists are helpful for ensuring you follow a specific set of tasks for routine
    procedures or making sure you don’t forget any essential parts of a'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'task. They’re also a great way to delegate responsibilities if you have multiple
    members assigned to a card.


    # # Adding a checklist


    To add a checklist to a card, open the card and select the **Checklist** button
    from the **Add to card** menu.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_86_0.png)


    Figure 3.19 – Checklist creation modal


    If you’ve already created a checklist in the current board, you can select it
    from the dropdown to create a duplicate version with the same items as in the
    current card. Otherwise, you can simply give it a title and click the blue **Add**
    button.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_86_1.png)


    Figure 3.20 – Checklist on a card'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Add specific items to the checklist by typing in the box that says **Add an
    item**. Press _Enter_ or click the blue **Add** button to create the item. Pro
    tip— you can copy and paste a list of items from a document or spreadsheet and
    it will create a new item from each line break!


    If you accidentally created an item, you can edit the name by selecting the text.
    But if you’re really done with it, you can remove it by hovering over the card
    and clicking the ellipses at the end of the row, then click Delete.


    Sometimes you might create an item as a subtask but realize it’s actually a better
    fit as its own card. It’s easy to change that! Click the ellipses at the end of
    the row of a task and click **Convert to card**. The checklist item becomes a
    new card in the same list as the original card. When you’re done, just click out
    of the checklist.


    # # Advanced checklists


    Standard, Premium, and Enterprise Trello users can use advanced checklists, which
    allow you to add due dates and members to checklist items. This is especially
    useful if you have multiple people involved in completing a card. You can see
    what tasks still need to be done and who is up next.


    To add a due date or member to an existing checklist item, hover over the item
    and you will notice a clock icon and user icon appear. Clicking the clock icon
    opens a modal similar to the due date picker, allowing you to set a due date for
    the item. Clicking the user icon allows you to add one member to the checklist
    item.


    You can also add a member and due date while creating an item. Type the name of
    a task in the checklist. Before pressing _Enter_ or clicking **Add**, use the
    **Assign** or **Due date** button on the right side.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_87_0.png)'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Figure 3.21 – Modal for adding advanced checklist items


    Don’t have a paid Trello plan? You can still mention someone in a checklist item
    by clicking the @ icon. This doesn’t assign them the item, but it does hyperlink
    their profile and send them a notification. Clicking the emoji button allows you
    to add style to your checklist items by selecting an emoji from the emoji picker.
    When you’re done, click the blue Add button.


    # Viewing all your checklist items


    If you’ve been assigned checklist items across multiple cards, you can view them
    all by going to your home view at trello.com. It shows the next upcoming items
    you’ve been assigned. Click Show more to see all of your checklist items.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_88_0.png)


    # Figure 3.22 – Home section in Trello showing assigned checklist items


    You can check off items from this view or click an item to go to the card and
    view more information.


    # Viewing the progress of checklists


    Check off items on a checklist by checking the box to the left of the checklist
    name.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_89_0.png)


    Figure 3.23 – Semi-completed checklist


    A bar appears underneath the checklist title showing you the percentage of items
    that have been completed. A line is crossed through any items that have been checked
    off. If you’d prefer to only see the remaining tasks that haven’t been completed,
    click **Hide checked items** next to the checklist name.


    You can also view the progress of a checklist from the front of a card. Close
    the card to view a fraction on the front of the card, displaying the number of
    completed items and total items in the card.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_89_1.png)


    Figure 3.24 – Card checklist progress fraction on the card front'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'To remove a checklist, click **Delete** from inside the card, just to the right
    of

    the checklist name.


    # # Locations


    Many of the fields we’ve discussed are available on other productivity and

    project management tools, but this one is not something I’ve seen anywhere

    else!


    This field type stores a location value from Google Maps as a field in your

    cards. While this may not be useful for every board, if you work with

    location data for jobs or are planning events or trips, this field will prove

    invaluable for helping you literally map out your workflow.


    Note that this field is only available for Premium and Enterprise

    workspaces.


    Why use location?


    Although not every board will need to use location, it can be incredibly

    handy if you need to see multiple locations and how they relate to each

    other. With the Map view, you can view all of these cards plotted on a map

    and see how close they are in relation to others. It’s perfect for planning an

    order delivery, creating itineraries for trips, or organizing an address book.


    # # Setting a location on a card


    To set a location on a card, click the **Location** button from the **Add to card**

    menu on the right side of a card. This opens a modal allowing you to search

    for a location in Google Maps.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_91_0.png)


    Figure 3.25 – Add location modal


    Type an address or the name of a destination, such as Disney World. As you type,
    options appear below. Select one to see a new section of your card appear that
    adds a preview of a map. Clicking the arrow opens a new tab with the location
    in Google Maps.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_91_1.png)


    Figure 3.26 – Location preview on a card'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'You can change the location or remove it by selecting the ellipses at the end
    of the row.


    # # Covers


    Card covers are the perfect way to make your board more visual. These covers are
    displayed behind or above the card title. There are two types of covers you can
    add to your cards: colors and images.


    Why use card covers?


    Card covers are a great way to style your boards. Colors are useful for creating
    sections or headers in your lists. Images are useful for visualizing important
    aspects of a card. They also work well for organizing galleries of images for
    products, portfolios, or anything else that''s visually dependent.


    # # Adding a card cover


    To add a cover to a card, click the **Cover** button on the **Add to card** menu
    on the right side of a card. If you''ve already added an image to the card, Trello
    might have automatically set that image as the cover. In that case, the **Cover**
    menu will be at the top of the card, in the bottom-right corner of the displayed
    image. Once you click **Cover**, it will open a menu.'
  merge: -1
  img_proc: true
