- pgno: 334
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_334_0.png)


    Figure 13.2 – New form options


    Start by naming the form something that makes it clear what the form is about.
    For instance, you might name it **Request a feature** if you’re planning to collect
    feature requests. In my case, I called mine **Dear Taco** because that’s the name
    of my newsletter section where I solicit reader questions and answer them (Shameless
    plug to subscribe if you haven’t already: trello.substack.com/).


    # # Adding and customizing a field


    Next, drag the fields from the left-side panel into the middle of the page to
    create a field with that type. I’ll drag a text field first since I want to collect
    a subscriber’s name or nickname to reference in the answer. (It’s fun seeing what
    people submit for this... my current favorite is **How I Trello’s #1 Fan!**).


    Click the newly added field to configure it.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_335_0.png)


    # Figure 13.3 – Field options


    We’re going to change the field name from **Description Text** to **Name**. I’m
    also going to update the **Description** field to let folks know that they don’t
    have to actually provide their real name. Give any additional context you want
    for your field, such as examples or helper text to clarify what a user should
    put in the field.


    Next, adjust the way the field text works by selecting **Long Text** and changing
    it to a specific type of text that you’re expecting, such as **Email Address**
    or **Short Text** if you want to take up less space.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_335_1.png)


    # Figure 13.4 – Text input types


    By default, the first field added to your form will have the **Card title** field
    checked since each card must have a name. Once you add more fields, you can select
    that checkbox in another field to make that field’s value the title'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'of the card. In my case, I actually do want to keep the subscriber’s moniker

    as the title, so this is fine.


    Next, you’ll decide whether this field is optional or required, and finally,

    you can choose whether you want to apply conditional logic to a field. This

    will only show this field if the person filling out the form has provided a

    specific value in another field. For example, if you use this form to collect

    shipping info, you might only show a **State** field if someone has chosen

    **United States** in the **Country** field.


    The last section shows where the info from that field will be sent when

    someone fills out the form. You can’t change this, but if you want to send

    information to another section of the card, just choose a different field type.

    For instance, if you want to map the text to a custom field, look on the left-

    side panel at the field options and you’ll see **Custom Fields** as a field type

    to drag over. Any responses to that question on the form will be added to

    that custom field.'
  merge: -1
  img_proc: true
