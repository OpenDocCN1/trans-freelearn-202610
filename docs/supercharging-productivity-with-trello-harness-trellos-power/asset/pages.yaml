- pgno: 205
  md: 'If you have an API endpoint that can receive and store data, then you can use
    this rule to get data from that API or send data to it. This is pretty advanced
    stuff, but if you want to integrate with another tool, this is likely what you’ll
    want to use.


    You’ll need to be familiar with the API you’re working with and what’s returned
    to be able to best use this, but essentially you can reference whatever is returned
    in your next step. You can learn more about HTTP requests with automation in the
    official docs here: support.atlassian.com/trello/docs/issuing-http-requests/.


    # Real-world example


    When a card is moved into the **Get data** list, get the URL https://api.thecatapi.com/v1/images/search?
    breed_ids=beng&include_breeds=true and post {httpresponse.image} as a comment
    on the card.


    _You know, in case you want to put images of cats as comments on your cards. Who
    doesn’t?_


    # Summary


    We’ve covered so much ground, and these are just the “basic” actions you can automate
    with Trello. You can now move cards around, add or remove attributes such as labels
    or links, adjust due dates, create checklists, add members, and more.


    You’ll never remember all of these off the top of your head, and that’s totally
    okay. Even I have to open up the **Automation** section sometimes to remember
    everything that is possible. At first, it’s also not always intuitive which sections
    you’ll find the actions in, but the more you use them, the more familiar they’ll
    become.


    But if you thought that was all, we’re only getting started. You can still automate
    even more actions in Trello, so in the next chapter, we’ll talk through some advanced
    automation actions.'
