- pgno: 302
  md: '# # General-Use Power-Ups


    You’ve already learned about some Power-Ups created by Trello that will help you
    improve your workflows, but it’s time to step outside the internal ecosystem and
    explore Power-Ups created by others. In this chapter, we’ll explore a few Power-Ups
    that aren’t made by Trello but instead are made by other companies and developers.
    Although I’d have to write a million books to talk about all of them, we’ll cover
    a couple that work well with a handful of use cases and solve the most common
    challenges I am asked about.


    In this chapter, you’ll learn about the following topics:


    +   - Approvals for Trello—streamlines your team’s review and approval process

    +   - Amazing Fields—adds custom fields to your Trello cards for a more comprehensive
    overview of your projects

    +   - Bulk Actions—simplifies your workflow by letting you perform actions on
    multiple cards at once


    It’s a lot, so let’s jump right in!


    # # Approvals for Trello


    This Power-Up is useful if you have any approval process as part of your workflow
    in Trello. For instance, maybe you need to keep track of your content calendar
    on Trello, and before any content can be published, your manager or other teammates
    must approve it.


    While you can build your own approval system with Trello’s custom fields and labels,
    why not use a Power-Up that gives you everything you need out of the box? That’s
    where Approvals for Trello comes in.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'It’s a Power-Up built by the AppFox team, the makers of other much-loved apps
    for Jira, Confluence, and monday.com. Approvals has been added to over 75,000
    Trello boards worldwide and is free to use, although there is a paid subscription
    plan that adds some cool extra features.


    # Why use Approvals?


    Adding an approval process in your workflow can help ensure everyone is on the
    same page about who is working on what. It eliminates the “I had no idea that
    was going out!” conversation or the “No one checked with my team!” frustration
    that can tend to happen when we’re all moving fast and (hopefully not) breaking
    things.


    # Adding Approvals for Trello to your board


    To add the Power-Up, go to the Power-Up directory from the top toolbar of any
    Trello board by selecting the **Power-Up** button. Click the **Add Power-Ups**
    button and search for `Approvals` in the search field on the top left. Click the
    **Add** button on the first result that appears:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_303_0.png)


    Figure 12.1 – Approvals for Trello card in the Power-Up directory


    You’ll be prompted to click **Add** again to confirm you understand that this
    is a third-party Trello Power-Up, made by another developer outside of Trello.
    Don’t worry, though—Power-Ups still go through a rigorous review process, so you
    can ensure your data and information are safe!'
  merge: -1
  img_proc: true
