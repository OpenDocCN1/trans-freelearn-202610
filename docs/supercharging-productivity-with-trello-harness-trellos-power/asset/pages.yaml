- pgno: 82
  md: 'whether a card has been through a specific stage of a workflow.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_82_0.png)


    Figure 3.13 – Custom fields with a Checklist type


    I love using this as a toggle on a card to help determine whether it meets some
    criteria (such as **Needs review from a senior manager**). This is helpful in
    automation because you can specify actions to occur on cards that have a field
    checked, such as moving a card to a list when the field is checked, or moving
    it to another list when it’s un-checked.


    A **Date** field is a timestamp field with date and time values. It’s useful if
    you want to add another date to your card, besides just start and due dates.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_82_1.png)


    Figure 3.14 – Custom fields with the Date type'
  merge: -1
