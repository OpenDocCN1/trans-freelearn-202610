- pgno: 75
  md: '# # Trello cards and boards


    You can also attach Trello items to a card, making it easy to quickly reference
    other boards or cards.


    Click **Trello** from the attachment options and a new modal appears asking you
    to search for a card or board to add to the card. Search for a name, type a link,
    or select one of the cards or boards that appears automatically.


    A new section of your card is created called **Trello attachments** and it shows
    the item you’ve selected. It’s a great way to preview a card’s key information
    without having to actually go to the card.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_75_0.png)


    Figure 3.5 – Preview of attached card


    If you attach a board, your attachment shows a preview of the board background
    with the board name, and you’re just a click away from going straight to the board.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_76_0.png)


    Figure 3.6 – Preview of attached board and card


    Note that if a member of the card does not have access to the board for the attached
    Trello item, they will not be able to preview the attachment. This can be useful
    for you to quickly reference something from a private board as you view a card,
    while not permitting others to see that item.


    You''ll notice next to option to search for Trello items, you also see Confluence
    and Jira. Since Trello is owned by Atlassian, there''s a tight integration with
    these other Atlassian tools, allowing you to search for and select Confluence
    pages and Jira tickets in the menu.


    # Cloud drives


    Many of us use tools to share documents in the cloud, such as Google Drive, Box,
    Dropbox, and OneDrive. Attaching cloud files works very similarly, regardless
    of the platform.


    Previously, Trello''s attachments had sections for some of those, such as Box
    and Google Drive. But with recent updates to their Attachment menu, those have
    moved away. If you want to incorporate Cloud files in your board, you can search
    for a Power-Up (such as the Google Drive Power-Up), or you can attach those files
    via their link, which we''ll talk about in a minute.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_77_0.png)


    Figure 3.7 – Attach Google Drive files and folders to cards


    You’ll see a new section appear on the card with the cloud document provider and
    a preview of the image.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_77_1.png)


    Figure 3.8 – Google sheet attached to a card


    Click Comment to start a comment that links to the file. This is useful if you''ve
    added a file and you want to make sure folks on the card know the file is there
    and invite them to take any action needed with the file.


    # ## Links


    In some cases, you might just want to attach a link to an article. Simply paste
    the link in the box at the top of the **Attachment** menu.


    The Display text field below the link gives you the option to name your link.
    This is optional and gives you a quick way to clarify the name for that field
    if the default text that appears isn’t clear enough. I find this'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'particularly helpful with Notion links, which come across as a useless string
    of letters and numbers. I can rename them to for example, Mod Promo Playbook.


    When you’re happy with the link and name, click the blue **Insert** button.


    # # Inline attachments


    Rather than attaching links to a card via the **Attachments** section, you can
    incorporate them inside descriptions and comments. Try it out!


    Paste a link into a comment. I used to hate recording myself, but now I actually
    prefer communicating thoughts over Loom rather than typing a long comment, so
    I’ll paste in a link from Loom.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_78_0.png)


    Figure 3.9 – Smart link options in card comment


    Click the link to see a menu with options for changing how the link looks. You
    can keep it simple and include only the exact copy of the link, you can choose
    the middle option (which is the default) showing a logo and the title hyperlinked,
    or you can choose the third option, which is like an embeddable view of the content
    from the link.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_78_1.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Figure 3.10 – Full embed of smart link in card comment


    To see which services this works for, check

    [support.atlassian.com/trello/docs/link-cards/#supported-services](https://support.atlassian.com/trello/docs/link-cards/#supported-services)
    for the

    most up-to-date information, as I’m sure they add more all the time. These

    work very similarly to link cards, which you’ll read about later in this

    chapter.


    # Custom fields


    We’ve already discussed a lot of specific fields for a card. You can define

    dates, assign members, update a description with any info you’d like, attach

    files, and more! But sometimes, you still just need something else.


    This is where custom fields come in! Trello users on Standard, Premium,

    and Enterprise plans can create custom fields to track additional

    information about a task or project. This field is particularly useful for

    tracking information that is specific to your organization or workflow.


    Custom fields are set at the board level and appear on every card on the

    board. You can’t set fields to only show on certain cards, or make them

    appear on the front of the card unless they’re filled in. You also have the

    option to remove them from the card front altogether if you prefer.


    I use custom fields on just about every board that I create. While you can

    use labels to add information and details about a card, I find custom fields

    to be much easier to work with and more straightforward for defining

    relevant details about a card.


    They’re also fantastic for turning your Trello cards into a form. With

    custom fields, you can tell someone to create a Trello card and fill out the

    fields that appear, rather than describing all of the information they should

    be typing into the card description.


    Why use custom fields?'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'Once you get in a groove with your workflows in Trello, you’ll want to make
    them as smooth as possible. Custom fields help you do that and also provide guardrails
    to make sure others using the board are adding correct data to the cards and ensuring
    nothing is forgotten. It’s also a way to completely customize Trello to be the
    tool you need it to be, rather than just your run-of-the-mill project management
    tool. This is really one of the building blocks that allow you to build Trello
    to be anything you need it to be.


    Are you interested in custom fields but not sure what to create for your board?
    Here are some ideas based on how you use Trello:


    | Content Calendar | Ad title, Publish date, Content topic |

    |------------------|---------------------------------------|

    | Sales Pipeline   | Lead email, Deal amount, Status       |

    | Support Tickets  | Ticket ID, Customer email, Support level/tier |

    | Engineering Sprint | Estimated story points, Actual story points, Priority |

    | Product Roadmap  | Votes for feature, Key stakeholder    |

    | Project Management | Milestone date(s), Impacted team      |

    | E-commerce Orders | Order ID, Estimated delivery date     |


    # # Creating a custom field


    You can create a custom field from within a card or the board menu. Select the
    **Custom Fields** button at the bottom of the **Add to card** menu on the right
    side of a card.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_81_0.png)


    Figure 3.11 – Custom field creation modal


    Trello suggests a few custom fields, such as **Priority** and **Status**. If you
    want to add one of those, simply select **Add**. These are commonly used custom
    fields and a great way to get started.


    Click the gray + **New field** button to create your own field. You’ll be prompted
    to select a title for the field, which shows up on the card. Then you can choose
    from one of the five types of fields.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_81_1.png)


    Figure 3.12 – Options for custom field types


    You might use a **Checkbox** field if the value of something is yes or no. This
    is a great way to show whether something has been approved or to see'
  merge: -1
