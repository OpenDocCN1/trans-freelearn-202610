    This saves the step of assigning due dates to items when you can logically define
    when they’d be due.


    # Move the item due date


    Like shifting the due dates of cards, you can shift the due dates of the checklist
    items inside a card. You have the same options, such as shifting to the same time,
    by a certain number of days, or to a relative or absolute time.


    How you use this will depend on your use case, but it’s helpful to know which
    options are available.


    # Real-world example


    When a card is moved to the **Next Week** list, find each item in the checklist
    and move it to the same day next week.'
  merge: -1
