- pgno: 330
  md: '# # Syncing Info Between Boards and Tools


    Unfortunately, we can’t get everyone to use Trello (don’t worry— I haven’t given
    up trying), and even for those that we can, we can’t all operate on the same board!
    Some of the most common questions I’m asked are how to sync between multiple boards
    and how to quickly get information in Trello.


    Although you can get some syncing capabilities with advanced automation, it’s
    a lot to build and it never works perfectly. But thankfully, there are solutions.
    In this chapter, we’ll explore two Power-Ups that help you solve this challenge
    and make it work like a dream.


    In this chapter, you’ll learn about the following:


    +   - How Forms by Blue Cat gathers information from team members and clients
    in a more organized way to create cards

    +   - How Unito connects different sources of data with your Trello boards for
    a more integrated workflow


    Let’s start by talking about how to sync information from info filled out on a
    web page straight to your Trello board.


    # # Forms by Blue Cat


    While templates work great for creating cards, sometimes folks may still be confused
    about where to put something when creating a card, or what kinds of information
    are needed before work can begin on a task.


    There are also some cases where you may want others to make requests or create
    cards on your boards, but you don’t want them to view or edit cards. Maybe you
    want your users to be able to request a feature that becomes a task on your dev
    team’s Trello board, but you don’t want to add all of your'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'users to your Trello board. That’s costly, requires your users to have or

    create a Trello account, and gives them access to sensitive info in the team’s

    board.


    This is where Forms by Blue Cat can help. This Power-Up lets you create a

    public form that you can embed or share anywhere. On every form

    submitted, a new card is created with the information from that submission.


    This Power-Up is built by Blue Cat, a company that has made many other

    amazing Power-Ups, including Import to Trello, which allows you to

    convert a spreadsheet into a Trello board, and perhaps their most famous

    Power-Up, Blue Cat Reports, which we’ll discuss more in _Chapter 14_.


    Forms by Blue Cat has been added to over 40,000 boards, including many

    of my own!


    Why use Forms by Blue Cat?


    If you want to quickly capture the required information to create new cards

    or tasks, you might want to use Forms by Blue Cat. It’s perfect for defining

    criteria that need to be answered before adding a task to your board and

    prevents you from adding something to your board that hasn’t been thought

    out.


    It’s also great for collecting feedback, information, and files from external

    users, such as people who aren’t part of your board or people who may not

    even have a Trello account! You can map the form fields to attachments as

    well as standard and custom Trello fields. I’ve used Forms to collect

    subscriber feedback for my own Trello newsletter, and I allow my

    subscribers to ask me questions about Trello in the “Dear Taco” section of

    my newsletter. Readers submit questions via Blue Cat forms, which are then

    queued up in my Trello board so I can keep track of which ones I’ve

    answered.


    Like many other Power-Ups, Forms by Blue Cat offers a free version, but to

    get premium features or more volume, you’ll need to pay. The free version

    is very powerful and allows up to 10 submissions per account each month.'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'Let''s go through an example of how I use Forms by Blue Cat to answer my subscribers’
    questions about Trello!


    # # Adding Forms by Blue Cat


    Head to the Power-Up directory by clicking **Add Power-Ups** from the **Power-Up**
    button in the top toolbar of any board. From there, search for `Forms by Blue
    Cat` in the field on the top left.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_332_0.png)


    Figure 13.1 – Forms by Blue Cat card in the Power-Up directory


    Click the **Add** button on the Forms by Blue Cat card. You’re now ready to create
    your first form!


    # # Creating a form


    If you’ve just added the Power-Up, you’ll be immediately directed to the home
    page and should see a button called **Create form**. Click that to get started.
    If you went back to your board after adding the Power-Up, you’ll need to click
    the **Blue Cat Forms** button in the top toolbar of your board.


    Once you arrive in the form editor, you can customize your form to suit your use
    case.'
  merge: -1
  img_proc: true
