    # # Editing dates on a card


    Perhaps the best feature of the Calendar view is easily changing start and due
    dates. Instead of opening the card, selecting new dates from the date menu, and
    then saving those dates and closing the card, you can drag and drop the card to
    another spot on the calendar – by doing this, the dates will update.


    You can drag the left-hand side of the card to an earlier date to set the start
    date and drag the right-hand side of the card to a future date to set the due
    date. Dragging an entire card from the middle keeps the duration but shifts the
    dates.


    This is helpful when you see that you have too much work at the same time and
    need to quickly redistribute it.


