- pgno: 294
  md: 'You’ll be able to reopen the modal and change the text or the configuration
    options and save it.


    If you want more ideas for engaging people on your board, you’ll be excited to
    learn about the Voting Power-Up!


    # # Voting


    Sometimes you might want to get opinions about what people want to work on or
    what types of topics are most interesting to folks. Although you might think about
    just asking someone to join a card if they want to “vote” for something, that
    adds a lot of unnecessary overhead (such as notifications about activity on the
    cards and those cards showing up in your filtered lists).


    Why vote on Trello boards?


    You might want to enable voting features in your Trello board if you want to collect
    feedback from users or teammates. For instance, if you are a product team, you
    could use Trello as your roadmap and allow product users to share feature requests
    and vote on them. This could be useful to allow you to prioritize your backlog
    and work on only the most requested features that would have the highest impact.


    There are many other reasons you might want voting on your board, such as quick
    polls asking teammates to pick a good time for a meeting, or for prioritizing
    items in a meeting agenda. It’s also a great way to ensure buy-in from the team
    for tasks you want to accomplish during a project. By doing the tasks that everyone
    agrees are important, employees will be more likely to complete the tasks.


    The Voting Power-Up makes it easy for you to incorporate voting in your Trello
    boards. This Power-Up adds a button to card actions that allow members (even non-board
    members) to +1 a card. Each card will show a tally of the number of total votes,
    and lists have a new action that allows you to sort the cards in a list by the
    number of votes.'
  merge: -1
  img_proc: true
