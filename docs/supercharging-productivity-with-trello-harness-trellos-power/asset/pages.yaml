- pgno: 372
  md: 'In the top right of the report, you’ll have options as you did in Quick Lists
    to **Export** and **Email** a report. You’ll also be able to **Edit** the report,
    useful for adding or removing charts and reorganizing the page by dragging charts
    around.


    With Reports, you’re now able to answer key questions about your workflow like:


    +   - What''s the average time cards are spending in each list?

    +   - Are we spending enough time on high-priority tasks?

    +   - Is the workload balanced evenly among teammates?

    +   - How much work is planned for future weeks?

    +   - Which cards have spent too long in specific lists?

    +   - How many cards are added over time?

    +   - Get all of this emailed to you or anyone on your team on a schedule you
    define.


    And more! Now let’s talk about another tool you might use for reporting and also
    project management.


    # # Placker


    While I find Blue Cat Reports is plenty good enough for most use cases, sometimes
    you need a little bit more, or you need to get data from multiple places, such
    as Jira boards. To do this, you’ll want to try out a more robust tool, such as
    Placker. I say _more robust_ because it offers features such as time tracking
    and more card data, including estimate-versus-actual fields for budget, effort,
    and time.


    The other benefits of Placker include more project planning tools. You might want
    to use Placker if you’re looking for Gantt charts or more advanced timeline projects.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'Placker is also useful if you can’t get everyone on your team to use Trello.
    The teammates who do like to use Trello can easily work inside the app, but others
    who don’t prefer it can easily operate in the Placker app, which reads everything
    that’s needed from Trello boards and offers more views for cards.


    It’s also nice because if you have 50 people in your Trello boards but only one
    person who needs to view a dashboard, you can pay for Placker for just that one
    member and you’re not charged for all 50 members. Pretty sweet, as there are generally
    far fewer people interested in reporting than those that are active in the Trello
    boards.


    # Who is Placker best for?


    I recommend using Placker if you’re working with many stakeholders and multiple
    projects and you’re not just seeking reporting on your Trello cards, but you’re
    also looking for more robust tools for planning projects. Especially if you have
    multiple projects or different teams in flight, you will appreciate the different
    views and groups you can set up, while allowing the folks who need it to have
    everything in one place. You might also be interested in Placker if you’re part
    of a larger enterprise company that wants to use standardized (and customized)
    dashboards across your teams. Placker allows these teams to create their dashboards
    that show exactly what is required and then re-use these dashboards across different
    boards and board groups.


    If you’re a one-person team, you might find Placker to be a bit more than you
    need and not worth the configuration time.


    While Placker offers some amazing features, the tradeoff is that it’s not going
    to be as quick and easy to set up something like Blue Cat Reports. There’s also
    a lot more buttons and things to click, which can be distracting at best and confusing
    at worst. But don’t worry, it’s still painless and you’ve got a guide (it’s me!)
    to walk you around and help you get the lay of the land.


    Plus, you get a free 15-day trial and the team is very helpful and willing to
    assist, so there’s no reason not to try it out!'
  merge: -1
  img_proc: true
