- pgno: 306
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_306_0.png)


    # Figure 12.4 – Adding an approver to a card


    When you’ve selected a member, the **Create** button darkens to be clicked.

    You could select multiple members here if you have multiple people that

    need to give approval for something. I’m going to leave it to just myself for

    the sake of the example.


    Click **Create** and you’ve set up your first approval! Now, let’s take a look

    at how this looks in your Trello card. As you can see, it appears below the

    card description , and any custom fields you’ve added are above the

