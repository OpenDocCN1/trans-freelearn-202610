    # ## Figure 8.1 – Field actions


    In [Chapter 3], we learned about how powerful custom fields were, and we didn’t
    even talk about automation! While they’re pretty nifty just sitting around on
    cards, the real potency comes from being able to tie automations to them.


    If you think your use case is so unique that Trello probably can’t handle it,
    then I’d say you probably haven’t used custom fields to their full potential.
    Although we’ve discussed a lot of actions for dates, members, checklists, and
    more, custom field actions allow you to do almost everything else. So, if you
    were disappointed to not find something in the previous rules, then buckle up
    because you can find a way to make it work with custom fields. You might just
    have to get a bit creative!


    # # Clear custom field __


    Pick a custom field and clear it—great for when you need to reset a card.


    Real-world example


    When a card is moved to **Backlog**, clear custom field **Prioritized**.'
