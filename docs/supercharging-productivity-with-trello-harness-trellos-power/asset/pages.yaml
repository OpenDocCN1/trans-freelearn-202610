- pgno: 195
  md: 'This action allows you to check off (mark as complete) or uncheck a specific
    item. You can specify which checklist it falls under by clicking the list icon
    next to it. This is often most useful when you’re trying to sync cards and checklists
    so that if a card with a task name that matches a checklist item name is moved
    to a completed list, you can check the item with the name off a checklist in the
    main card.


    # Real-world example


    When a “submitted” label is applied, check the submit item in the **Process**
    checklist.


    Use this rule with care—you’ll need to make sure the text matches what you set!
    But if you are consistent with text, it’s a great way to check off items when
    they’re incorporated with other steps you’re already taking.


    # Check/uncheck all the times in a/all checklist(s)


    This is just like it sounds! It checks off (or unchecks) everything in either
    a specific checklist or all the checklists on the card. This is most useful if
    you get bothered by incomplete checklists and sometimes you just finish multiple
    things and then ship a card over to the **Done** list.


    # Real-world example


    When a card is moved to **Done**, check all the items in all the checklists.


    I use this one all the time because sometimes I get so engrossed in doing the
    thing that I realize I’ve completed all the checklist items and don’t want to
    have to check them off one by one. (_Although sometimes it is kinda satisfying
