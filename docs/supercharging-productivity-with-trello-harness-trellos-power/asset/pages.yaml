- pgno: 396
  md: 'I love this chart because it shows why I can never seem to complete my to-do
    list...for every card I complete, I’m adding at least one more card to my list!
    (This also explains why I have so many cards open!)


    Next, head to the **Timings** tab and you’ll learn more about how cards move through
    your workflow. I won’t go into detail here as most of these charts are well explained,
    but my favorite one is this chart that shows how long cards sit in an **In Progress**
    state.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_396_0.png)


    Figure 14.40 – Chart showing how long cards spend in progress


    This takes the average time of cards that are sitting in your **In Progress**
    lists so you can see how long it’s taking tasks to be completed. If you see long
    cycle times here, it could mean you have some bottlenecks and need to investigate
    what might be taking so long to move cards through your workflow.


    Lastly, we’ll look briefly at the **Forecasts** tab.


    This section helps you make projections and estimates about your projects and
    tasks based on how you’ve been working. You can track velocity history to see
    how much your team is doing each week historically.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_397_0.png)


    Figure 14.41 – Chart showing weekly velocity trends


    Make sure you’re not planning more work than your team has been able to realistically
    handle, otherwise you’re just setting yourself up to never complete your tasks
    and constantly move things over.


    If you keep scrolling, you’ll see more charts that give you a date to predict
    when your project will be completed. There are two ways to estimate – one assumes
    no new work is added, and the other assumes work is added. You can also adjust
    the velocity to be optimistic or pessimistic to help you have a range. I like
    these charts because they’re great to show to a pesky management team that keeps
    extending the scope of a project. You now have an actual chart to show them how
    adding more tasks as you go delays the date significantly.


    Now, just in case you’d like even more info, let’s head to **CHARTS** and see
    what we can build.


