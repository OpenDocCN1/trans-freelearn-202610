- pgno: 400
  md: '# # REPORTS


    Charts are individual, well, charts that show you a specific visualization for
    your data. But you need to piece multiple together to tell a whole story, and
    that’s where reports come in. Click **REPORTS** in the navigation bar at the top.


    By default, Screenful has already created one report for you called **Weekly velocity**.
    Click the name to explore. You’ll see a series of charts pieced together to give
    you a weekly summary and help you see how you’re trending over time.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_400_0.png)


    Figure 14.45 – Weekly velocity chart split by board


    You can edit any of the charts by clicking the three dots in the top-right corner.
    You’ll have options for editing or styling the chart, and you can apply a filter.


    If you want to edit the layout of the report, click **Edit Report** in the top-right
    corner to move things around or add more charts or elements.'
  merge: -1
  img_proc: true
- pgno: 401
  md: 'Figure 14.46 – Report settings and options in Screenful


