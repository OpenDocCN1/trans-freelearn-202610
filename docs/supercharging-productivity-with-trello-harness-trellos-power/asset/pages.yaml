    # Automation variables


    Did you notice that I used `{listname}` inside that rule? It’s because Trello
    automation allows you to access details about the place an automation is happening,
    allowing you to make your automation very smart and customized (dynamic, if you
    will) for the situation. In this example, the email subject will contain the name
    of the new list every time a new one is created. This prevents you from having
    to open Trello and make a guess at what new list was added.


    Using variables is a great way to make your automation 10x more powerful, but
    it can be intimidating at first. When you’re ready to learn about them, visit
    [support.atlassian.com/trello/docs/butler-variables/](https://support.atlassian.com/trello/docs/butler-variables/)
    and learn about all the information you can access. As we go through the chapter,
    you’ll see some examples of this anytime some text is written in curly brackets,
    like this {} .


    # When a list has a specific number or range of cards


    This trigger watches for the number of cards in a list and can perform an action
    when the desired criteria are met. It’s not just for a specific number —click
    **exactly** and see more options.'
