- pgno: 305
  md: '# # Creating an approval


    Every Power-Up is a little bit different, but to use this one, head to any card
    on your Trello board. Look in the **Power-Up** section just below the **Add to
    card** section on the right side of any card.


    I’m going to pick a card in my Review list on my board, but you can choose from
    any card or list you like:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_305_0.png)


    Figure 12.3 – Approvals button on cards


    Click on the **Approvals** button, and a modal invites you to start adding approvals.
    You’ll see any existing approvals, but since we’re new, it’s empty. Click the
    + button at the bottom.


    Pick an approver from the drop-down options, which include all members of the
    board:'
  merge: -1
