- pgno: 279
  md: 'Now let’s talk about some specific Power-Ups built by Trello and how you might
    use them!


    # # Power-Ups for Integrations


    One of the most common reasons people use Power-Ups is to send or receive data
    between Trello and other apps so they can work seamlessly together. Trello has
    developed many Power-Ups with other tools to make this work as efficiently as
    possible and help you have all the data you need in one place.


    Why connect Trello with other apps?


    I’m not naive enough to think that Trello is the only tool you or your team will
    ever use. Trello’s fantastic, but it’s not where I’d go to design images or have
    conversations with my colleagues. Integrating Trello with other apps you use can
    be helpful to bring all the information you need in a central place, while allowing
    each tool to serve its own purpose. It can also save you time from having to repeat
    work by updating multiple tools. If you struggle to keep track of notifications
    in Trello, sending those updates to Slack or Google Chat will help your team see
    what’s most important in the places that matter.


    # # Tools Trello integrates with easily


    If you’re curious about the available tools that can be integrated with Trello,
    the possibilities are endless. In this chapter, I will specifically cover the
    Power-Ups created by Trello, which are native integrations provided by Trello
    itself. In the following list, you’ll find a comprehensive list of these Power-Ups
    and examples of how you can utilize them:


    +   - Box, Google Drive, and OneDrive (preview files from these providers directly
    in your cards)

    +   - Evernote (sync notes between Trello and Evernote)

    +   - Giphy (add GIFs to cards on your board)'
  merge: -1
  img_proc: true
- pgno: 280
  md: '+   - GitHub (preview pull requests and issue info in your cards)

    +   - Google Chat (get Trello notifications via Google Chat)

    +   - Mailchimp (view campaign performance details in a card)

    +   - Salesforce (view case and contact details directly in your cards)

    +   - Slack (get Trello notifications via Slack)

    +   - Twitter (preview Tweets in a card)

    +   - Zendesk (search for tickets and attach them to your cards)


    I won’t go through every single integration as there are a lot of tools out there,
    but this gives you an idea of what you can do. If there are any specific tools
    you’re looking to integrate with, search for them in the search box in the top
    left of the Power-Up directory.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_280_0.png)


    Figure 11.7 – Search field in the Power-Up directory


    Let’s assume that I work at a tech company and I’m using Trello to organize my
    marketing team’s tasks, but we also communicate via Slack. We’ll walk through
    setting up the Slack Power-Up so that my team can get notifications directly in
    our internal marketing channel in our company Slack workspace.'
  merge: -1
  img_proc: true
