    ![](img/21bbd56263f8fc423bc91d3203b460bb_95_0.png)


    Figure 3.29 – Front of a card with color cover


    # # Link cards


    If you create a Trello card with a link as the name, the card gets a bit fancy.
    Trello integrates with certain tools to embed links on your board, making it even
    easier to interact with other tools you use.


    For example, if you paste a YouTube video link as a card name, the card shows
    an embedded YouTube video on your Trello board.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_96_0.png)


    Figure 3.30 – YouTube video embedded Trello card


    A thumbnail appears with the video and the title below, as well as a **Full screen
    view** button. Clicking the button opens a YouTube video player, allowing you
    to watch the video from YouTube without leaving your Trello screen.


    Try this out with other links you use regularly! Creating a new card with a Google
    Sheets or Google Doc link as the name allows you to preview and'
