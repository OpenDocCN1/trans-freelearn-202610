- pgno: 357
  md: '# # Reporting in Trello


    You’re almost ready to conquer the world with Trello. But I can’t leave you without
    discussing your options for reporting in Trello. There are multiple Power-Ups
    and tools that are available. In fact, you might use several together. Maybe my
    next book will be all about reporting in Trello, because it’s a very deep topic.


    But for now, time is limited and we’re coming to the end of this book, so I’m
    going to touch on the three that I am most familiar with and help you understand
    how to decide which ones are right for you and your team.


    In this chapter, you’ll learn how to do the following:


    +   - Build lists with more advanced filtering options

    +   - Create charts showing the progress of a project over a month

    +   - Estimate when a project will be complete based on your team’s historical
    performance


    You might expect things like that from a spreadsheet, but now you’re about to
    learn how to do it from Trello, too! Let’s start with the easy-to-use yet powerful
    option that fits most use cases.


    # # Blue Cat Reports


    Blue Cat Reports is like Trello tables but way more customizable, and it gives
    you charts. That’s the simplest way to describe it, but it’s very powerful.


    Remember when we talked about creating workspace tables in Trello views back in
    Chapter 4? While that’s pretty cool, it’s a bit limited. You can only include
    up to 20 boards, which works for many people, but others have a lot of boards
    that they need to combine. Trello views allow you to filter by'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'lists, labels, and due dates, but you can’t filter by custom fields, and you

    also can’t even display those fields in the table!


    Blue Cat Reports solves this and also gives you the opportunity to make

    charts to show meaningful trends and information about what’s happening

    in your Trello boards. The best part is that it’s really easy to get started with

    and configure. You don’t have to set up any mapping to get started, and

    you’ll go through a helpful list of options that walk you through setting up

    the chart you need.


    # Who is Blue Cat Reports best for?


    Of course this is just an opinion, so make sure to look at multiple tools and

    do your own research, but I’ve found that Blue Cat Reports is best for teams

    that need a lightweight and quick-to-configure reporting solution. If you

    want to see what’s been completed, what’s coming up, create custom tables

    of cards, and aggregate information about those cards, Blue Cat Reports is

    going to be great.


    For most teams, I actually think Blue Cat Reports is a great fit because it

    covers most of what you will likely need in terms of reporting, and it’s

    affordable and incredibly easy to use. Seems like a no-brainer for most

    teams!


    One thing to note: even if you’re the only person using Blue Cat Reports,

    you’ll be charged for each person in your workspace. Although it might

    seem strange, if you think about it, it makes sense because Blue Cat Reports

    is collecting that data from each person’s profile and activities in Trello to

    aggregate the data for you.


    # Adding reports to your board


    From any board, head to the Power-Up directory and search for the Reports

    by Blue Cat Power-Up. It doesn’t matter which board you want to use;

    you’ll be able to choose any board you have access to from inside the

    Reports by Blue Cat Power-Up. But for now, feel free to stick with the data

    board that you just made or copied.'
  merge: -1
  img_proc: true
