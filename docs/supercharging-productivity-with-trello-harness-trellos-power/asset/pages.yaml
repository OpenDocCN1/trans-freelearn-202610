- pgno: 338
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_338_0.png)


    Figure 13.5 – Field types


    You can add as many fields as you want to your form. And the best part,

    you can make those fields map to different parts of the card instead of just

    the description and custom fields!


    # # Mapping fields to other parts of a card


    I like to give folks the opportunity to share screenshots when they ask their

    Trello questions in case that helps clarify the question. To do this, I just

    drag over the **Attachment** field type and update the name and description.

    Just be aware that attachment fields are a paid feature that is only available

    on Basic and higher Forms by Blue Cat plans.


    You can also map form answers to labels or dates. This is helpful if you

    want to ask users to respond with a date, which will set the due date of the

    card, or if you want to sort out what type of request it is and allow users to

    choose from labels.'
  merge: -1
  img_proc: true
- pgno: 339
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_339_0.png)


    Figure 13.6 – Field options for Forms by Blue Cat


    Just keep in mind that if you use labels, this means the options for that question
    will be all the available labels on the board. You cannot select a subset of labels.
    If you want to provide a subset, it’s better to just use the **Dropdown** or **Multi
    Select** field type and then use automation rules to update the label based on
    text inside the card description.


    # # Form settings


    After you’ve added fields, scroll back to the top of the form and click the **More
    Settings** button next to the form name.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_340_0.png)


    # Figure 13.7 – Title and more settings for Blue Cat Forms


    This is where you can customize the experience of the entire form, instead

    of just specific fields. If you want to make your form stand out, you can add

    custom branding, though this will require you to be part of the Forms by

    Blue Cat Pro plan.


    By default, new responses to the form will create cards in the first list on

    the board, but if you’d like to change it to another list, just select it from
    the

    dropdown.


    To make your form extremely clear, set the introduction and thank you

    messages. Introduction messages will be shown above the form, while

    thank you messages will appear after the form is submitted.'
  merge: -1
