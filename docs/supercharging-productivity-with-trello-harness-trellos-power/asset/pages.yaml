- pgno: 83
  md: 'You might use this to track actual completion dates or a draft due date that
    is a week before the final due date. Some even prefer to use these as start and
    end dates instead of the native Trello date fields. It’s easy to build automation
    that sets the date field of a card based on when you perform actions, so you could
    create a date field for tracking when it moves into its current list or when the
    card was created.


    The **Dropdown** field allows you to preset options that people can select from
    a dropdown. This is perfect for data validation and to prevent having inconsistent
    text values as fields on a card.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_83_0.png)


    Figure 3.15 – Custom fields with the Dropdown type


    You might use this to set a card’s priority to high, medium, or low. Add colors
    to a **Dropdown** option to help the different answers stand out.


    **Number** values are just that—numbers. You can perform calculations and report
    on aggregates of these values with third-party Power-Ups, which we’ll discuss
    in _Part 3_.'
  merge: -1
