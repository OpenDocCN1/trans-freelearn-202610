- pgno: 100
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_100_0.png)


    Figure 4.1 – The Filter menu in a board


    Clicking the **Filter** button reveals a menu of options showing you the filtering
    capabilities.


    # # Dimensions to filter by


    Filters are powerful for querying multiple dimensions of a card. You can combine
    them to get a clear picture of exactly what you’re looking for, such as your tasks
    for the week that are currently blocked, or what client tasks must be completed
    today.


    # # Keywords


    You can search for a word or phrase to only show cards that have that text in
    some aspect of the cards. This searches by name, labels, or members.


    Start typing in the box to search for a term; the filter will be applied immediately
    and remove any cards from the board that don’t match the text.


    # # Members


    Speaking of members, a popular filter shows cards that belong to a specific member.
    For example, you might share a board with your entire team, and'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'while it’s nice to see what everyone is working on when you are planning or
    coordinating your day-to-day work, sometimes you may just want to see your own
    tasks.


    If you’re a project manager, you might want to filter by cards that do not have
    a member assigned so you can decide which tasks need to be delegated and assigned
    an owner:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_101_0.png)


    Figure 4.2 – Additional members filter in the Filter menu


    To use the **Members** filter, check the box to the left of the filter you prefer
    or search for a specific member in the **Additional members** field. You can select
    one or multiple. Selecting multiple is great if you have many people on your board
    but want to see what a specific team of a few people is working on.


    Since filtering by your own cards is a common practice, you can press _Q_ on your
    keyboard when you’re on a board to automatically apply the **Cards assigned to
    me** filter.


    # ## Due dates


    Perhaps you’ve narrowed down the cards on the board so that you are viewing just
    your cards, but there might still be many! Using the dates filter helps you see
    which are upcoming so that you can be aware of urgent items.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'These are most helpful for assessing your current workload and seeing whether
    you’ve planned too much or whether anything is falling behind.


    You can filter for cards with no dates to see whether there are any tasks you
    need to plan or use the **Marked as complete** filter to view cards that have
    been completed. This is especially helpful if you aren’t using a _Done_ list to
    indicate a card’s status:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_102_0.png)


    Figure 4.3 – Date filter options in the Filter menu


    To set a date filter, check the box next to the option you’d prefer. Check another
    box if you change your mind.


    # # Labels


    The **Labels** filters are useful for viewing cards that have a certain status
    or are part of a category. Sometimes, I use labels for priority, so applying a
    filter for a red “p1” label would filter the board to show my highest priority
    cards or a “blocked” label would show any cards that I may need to raise to my
    manager:'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_103_0.png)


    Figure 4.4 – Labels filter options in the Filter menu


    You can select a specific label by checking the box to the left of one. If you
    don’t see a label, click the **Select labels** dropdown. You can also filter by
    cards that do not have a label, which is useful for tagging newly created cards
    on a board.


    # ## Activity


    Trello recently added the option to filter cards by activity so you can see which
    cards have been most active over a certain period of time. That’s helpful for
    seeing cards that people have been working in recently.


    You can also filter by cards without activity in the last four weeks, which is
    a great way to see if any cards are being neglected.


    # ## Filter logic


    By default, filters use OR logic. This means that if one of the criteria is true,
    a card will appear on the board:'
  merge: -1
  img_proc: true
- pgno: 104
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_104_0.png)


    Figure 4.5 – Filter logic settings in the Filter menu


    If you prefer to only see cards that meet ALL the criteria, such as cards assigned
    to me AND cards with a yellow label, apply the **Exact match** setting at the
    bottom of the Filter modal.


    # # Removing a filter


    Removing a filter is as simple as clicking the X button in the filter box in the
    board’s toolbar. Many people open an empty board and wonder what’s happened to
    their cards! They didn’t disappear, there’s just likely a filter that’s hiding
    them! Always check for a filter when you’re missing cards on your board.


    I’ll leave this section on filters with a pro filter tip for you: although there
    is no feature to save a filter view, it’s still technically possible. Every filter
    changes the URL of a board. When you apply a filter, you’ll see that the URL changes
    based on the selected filter. Bookmark a URL to save those filters and return
    to a specific view at any time.


    # # Accessing alternative board views


    While filters help control which cards appear on your board, Board views give
    you alternative ways to display the cards that are shown. To access the other
    views in your Trello board, click the arrow next to the **Board** button on the
    top toolbar of your Trello board, just to the right of the board’s name:'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_105_0.png)


    # Figure 4.6 – Board views picker


    In the dropdown that appears, check the box next to the views you’d like to see.
    For each one that is checked, a button will be added to your board toolbar to
    help you navigate to that view. If you don’t have a **Trello Premium** account,
    you’ll be prompted to start a trial of Trello Premium to access these views.


    Go ahead and check all of the boxes – we’ll be exploring each of these views in
    this chapter. To go to a view, click the button that specifies the view’s name,
    such as **Calendar**.


    The rest of this chapter will look at each of these views in detail, so to follow
    along, click the name of the button that matches the section.


    # Dashboard


    The Dashboard view is a lightweight solution for visualizing statistics about
    your cards. Users get a quick overview of their boards and cards and see'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'how they compare across various attributes:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_106_0.png)


    Figure 4.7 – Charts (tiles) on a Dashboard view


    If you need robust reporting features, you’ll likely need to add a third-party
    Power-Up to get more customized charts and insights. We’ll talk more about those
    in Chapter 14, but if you’re looking for some quick insights about your workflows,
    the Dashboard view can highlight workload balance, the feasibility of timelines,
    or blocks in your workflow stages.


    # Adding a new tile


    To customize your dashboard, you can add new charts or remove existing ones. To
    add a new chart, click the + button in the gray box at the bottom of the existing
    charts (called tiles):'
  merge: -1
  img_proc: true
