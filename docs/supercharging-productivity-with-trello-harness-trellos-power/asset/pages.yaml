- pgno: 14
  md: '# # The Structure of Trello


    Before you can start using Trello, you’ll need to understand what it is and how
    it works. In this chapter, we’re going to walk through what you need to know to
    get started with Trello.


    We’ll talk about the following:


    +   - Analogies to help you understand Trello

    +   - Where you can use Trello

    +   - Why it’s preferred over other tools

    +   - Creating a Trello account

    +   - Making your first board and list


    Ready? Let’s get started!


    # # What is Trello?


    I’ve talked to many people about Trello – more than I can count. I always return
    to one metaphor to explain Trello and a second metaphor to explain how it works:
    **a digital whiteboard**.


    I bet you’ve used a whiteboard to keep your projects organized. And you likely
    put sticky notes on that whiteboard to help you keep track of items for that project.
    You use squeaky dry-erase markers to create stages or lists under which your sticky
    notes fall.


    When a sticky note changes, you move it to another whiteboard section. You jot
    down extra notes on it or add a sticker to it. You use specific colors of sticky
    notes to differentiate between them. You might use different colors based on who
    is working on those tasks or what team is responsible for them.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Because of this whiteboard process, you have the big picture of your project
    and can see what is completed, what’s in progress, and what’s still left to do.
    And any time you need to zoom in, you refer to a sticky note.


    The whiteboard is fantastic and a classic approach. But there are a couple of
    problems with it.


    One – it’s not portable.


    Whiteboards only work well when you and your team are all working in close physical
    proximity. After all, the whiteboard is only as effective as the people updating
    it. If no one can see it, check its status, or move items as they have changed,
    the whiteboard isn’t functional.


    If you use one at your home office, it’s only useful when you’re sitting at home,
    and you can’t check it on the go. You can’t reference and update it while you’re
    traveling, and no one on your team can edit it.


    And two, sticky notes are only so powerful!


    You can change colors, add stickers, and sort sticky notes differently. But there’s
    only so much you can do to help them stand out and keep information about their
    task. They won’t hold any data, such as relevant files or images. They’re small,
    so you can only add a little detail to them.


    _Enter Trello... the digital whiteboard._


    Imagine a whiteboard, but better. That’s what Trello is. It’s a digital whiteboard
    with super-charged sticky notes.


    It’s a whiteboard but without the problems. It’s more powerful for collaborating
    with your team and keeping track of everything.


    A Trello board holds cards (sticky notes) organized by lists – no dry-erase marker
    is required. You move your cards around and between the lists, as you would your
    sticky notes. And it takes up less room than a massive physical board with sticky
    notes!'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'The cards are customizable too, but we’ll discuss those in greater detail in
    Chapter 2.


    Now that you understand what Trello is, let’s talk about how it works.


    It’s like LEGO bricks!


    While Trello has much in common with a whiteboard, it also has much in common
    with something else we’ve all used (although, maybe it’s been a few years).


    How does a project management tool have anything in common with a kid’s toy?


    It’s because you can build just about anything you want with Trello. It’s a highly
    customizable platform that is flexible and can be more than just a whiteboard.
    There are a million different things you can build with it – just like LEGO.


    How many different LEGO kits exist in the world? Hundreds, thousands? Maybe more?
    You can build a Hogwarts Castle, a Death Star, racecars, dinosaurs, villages...
    you can even build the Titanic!


    Because LEGO bricks are versatile, you can shape and mold them to be whatever
    you like. You only need a creative person to plan where they need to go. Lucky
    for you, I just happen to be that creative person!


    # # But why Trello?


    You’re not sitting here reading this book because I’m an expert in Asana or Monday.com.
    There’s a reason I chose Trello over those tools, but I won’t get into bashing
    other tools in this book, probably. They all have their place, and in some cases,
    other tools do work better for some folks.


    The magic of Trello is that it’s extremely versatile yet powerful.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'We’re going to get technical in this book and explain all the ins and outs
    of how to use Trello, and as I’m writing this, I realize there’s just so much
    to say because you can customize it and perfect it to work just the way you want
    it to.


    It integrates with just about any software you can think of and is one of the
    most well-known tools on the market. It’s owned by Atlassian, a massive company
    focused on producing quality tools for improving workflows.


    How to tweak the experience to make it exactly what you need it to be might not
    be super clear from the moment you open a board, but everything you need is there.
    Just like a sculptor, you need to carve and work it to make it a beautiful work
    of art for you and your team.


    # # Where can you use Trello?


    You can use Trello in a few places. This makes it more powerful than other tools
    that can only be accessed in the browser.


    # # Via the web


    You can use Trello from any browser as a web-based application. Head to trello.com
    and log in, and you’ll have access to all features, keyboard shortcuts, and more
    from Chrome.


    # # Trello desktop app


    If you prefer computer apps, you can access the Trello desktop app for Windows
    and Mac computers. The app provides notifications, access to Power-Ups, and more
    keyboard shortcuts.


    # # Trello mobile app


    Trello is perfect for use on the go, and this can be done via its Android and
    iOS apps. It’s a great way to create and access cards while away from your'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'computer.


    # # What kinds of things do people use Trello for?


    Many teams use Trello for more than just project management. Let’s take a look.


    # # Work-related use cases


    Here are some examples of work-related use cases:


    +   - Customer support teams use Trello to create an organized flow for responding
    to customer requests

    +   - Sales teams use Trello to keep track of leads through a pipeline as they
    convert them into deals and revenue

    +   - Marketers use Trello boards to plan content calendars and track the content
    creation process

    +   - Event planners use Trello to ensure nothing falls through the cracks and
    to create a timeline of tasks

    +   - Engineering teams use Trello to track bugs and features throughout the development
    cycle

    +   - Product teams use Trello for roadmapping, and often publicly share what
    new features are coming out in apps via their boards

    +   - Small businesses use Trello for managing operations and coordinating with
    stakeholders.

    +   - Agencies use Trello for collaborating with clients and keeping track of
    deliverables.

    +   - Law firms use Trello for managing pleadings for clients, while keeping track
    of billable hours'
  merge: -1
  img_proc: true
- pgno: 19
  md: '+   - Non-profit teams use Trello to organize internal operations and coordinate
    fundraising efforts

    +   - Churches use Trello for organizing worker schedules and tasks to be completed
    for Sunday services


    Now, let’s look at non-work-related use cases.


    # # Non-work-related use cases


    People also use Trello outside of work for a myriad of personal uses, some of
    which are as follows:


    +   - Organizing books to read

    +   - Meal planning

    +   - Household chores and products

    +   - Trip planning

    +   - Storing addresses and contact records

    +   - Workout planning and tracking

    +   - Saving articles

    +   - Online shopping cart with links to products


    And more!


    The possibilities are endless. So, now you see why it’s like LEGO!


    It’s exciting but also intimidating. When I only see a bunch of bricks and a picture
    of Hogwarts Castle, I have no idea how I will get there. How do these little bricks
    combine to make something so cool?


    That’s the purpose of this book. Imagine this as your instruction manual that
    comes with your LEGO. I’ll help you make your Hogwarts Castle. But before we can
    start building, you need to understand what the bricks are.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'So, let’s examine the contents of this LEGO kit we’ve opened and see what we
    have to work with.


    # # Getting started


    Before you can dive into the elements of Trello, you’ll need to create an account
    and create your first workspace.


    # # Creating an account


    Go to [trello.com](https://trello.com/) and click **Sign up**. You’ll be directed
    to an Atlassian login page. You can use your existing Atlassian login if you use
    other Atlassian products (such as Jira, Confluence, or Bitbucket). This makes
    it extremely easy to get started and keeps everything under one login if you use
    multiple tools. Otherwise, you’ll need to create a new account.


    You can do that by typing an email address or choosing one of the social account
    options, such as Gmail:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_20_0.png)'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# # Workspaces (previously called Teams)


    The wizard will walk you through the sign-up flow and help you create your first
    workspace. Think of a workspace as your department or organization, or a type
    of project:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_21_0.png)


    Each workspace is charged by the number of members in that workspace. You can
    have free workspaces, and you can have as many workspaces as you wish. Select
    your team type you are to get specific template recommendations. Next, invite
    team members via email address, or skip this process for now and invite them later.


    Now that you’ve got a Trello account squared away, you’re ready to start playing
    around and getting your hands dirty. It’s time for the rubber to meet'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'the proverbial road because we’re going to start creating boards and lists
    and understand what those things are, as well as how to use them.


    Let’s dive into what Trello is most known for... its boards!


    # # Boards


    The first principal component of Trello is the digital whiteboard – that is, “the
    board.” You can have several boards in Trello (up to 10 per workspace in the free
    plan and unlimited boards in paid plans).


    A board is a collection of cards, but we’ll get to those later. Think of a board
    as a topic or a goal. It could be a specific project you’re working on, or it
    could be a team.


    Don’t worry too much about what your board should be, as it will likely change
    over time, and you’ll find yourself operating on multiple boards. It’s easy to
    adjust as you go.


    Are you ready to put your fingers on the keyboard? It’s time to start digging
    in.


    # # Creating a board


    To help you explore boards, we will create one so that you have a visual as I
    explain what’s going on inside the board.


    From the top toolbar in Trello, click the **Create** button and choose the first
    option that appears – that is, **Create board**:'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_23_0.png)


    Figure 1.3 – Create options in Trello


    Name your board. You can call it `To Do` or `Team Tasks`.


    Next, confirm the workspace you want the board to be in. You can leave the default
    option or click the name of the board to select another available workspace.


    Lastly, you’ll choose a level of visibility – that is, who has access to view
    your board. For now, stick with the default option, which is **Workspace visible**.
    If no one else is part of your workspace, this is effectively the same as private
    visibility. If you aren’t sure and would prefer to hide this board, you can set
    the visibility to **Private**.


    Once you click **Create**, you’ll go straight to your new board.


    # # Finding your boards


    Go to [trello.com](https://trello.com) to see the boards you have joined or created:'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_24_0.png)


    # Figure 1.4 – Trello board home page


    View all boards, starting with starred ones, then your recently viewed ones, and
    finally the remaining boards. You can view only boards from a specific workspace
    by selecting a workspace name on the left-hand side.


    To go to a board, click on its tile.


    # Top toolbar options for a board


    Though boards can look very different, navigating them is the same. They all have
    a top toolbar with items for personalizing your board.


    Although other tools have the “board” concept, did you know Trello was the first
    to promote this type of organization? Trello also offers the best customization
    and set of features at a board level that I’ve seen across all other similar tools.


    # Starring a board


    The first item you will see is the board’s name; immediately next to it will be
    a star. If it’s filled yellow, this means that the board is “starred” and will'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'show up at the top of your **Trello Boards** page.


    You can also access these boards from the **Starred** menu in the very top toolbar
    in Trello.


    By default, the starred field will be unselected. Click it to star it, and click
    again to un-star it:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_25_0.png)


    Figure 1.5 – Board title with star icon for favoriting


    # # Setting board visibility


    The next option you’ll see is your board’s visibility. When creating a board,
    by default, it will be set to **Workspace visible**. This means that anyone who
    is part of your workspace can view the board and join it.


    To change this, select the current visibility option – a menu will appear with
    options to change it:'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_26_0.png)


    # Figure 1.6 – Board visibility options


    You have at least three visibility options, and a fourth one if you are on an
    Enterprise version of Trello.


    **Private** means that only you and the people who you invite can see the board
    and its contents, with one exception – workspace admins are also able to see the
    contents of any board (so make sure not to say anything about your boss in your
    boards 😉).


    You can find your workspace admins by opening the panel on the left-hand side
    of the board and selecting **Members**:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_26_1.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Figure 1.7 – Board member settings


    If you want others to view your content and engage in a board, you can invite
    them to the board, even if its visibility is **Private**. Click the **Share**
    button in the top-right toolbar of your board to see a modal appear:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_27_0.png)


    # Figure 1.8 – Board sharing and invite options


    Here, you can type a member’s name or email address. If they’re not on Trello,
    you can send an invite to their email address.


    You can also click the **Create link** button below the text field to create a
    link that you can send to someone to join the board. This link is not public,
    but anyone you send it to will be able to join the board. You can revoke this
    link any time after you create it.


    **Workspace visible** means that anyone who is part of your workspace can see
    the contents of your board. They’ll also be able to join it and edit. This is
    great for any information that is relevant to your wider group of colleagues and
    doesn’t contain sensitive information.


    **Public** visibility means that anyone can see this board, even if they don’t
    have a Trello account. Sometimes, this is actually kind of useful! For instance,
    perhaps you want to distribute information, such as a roadmap or resources. Although
    anyone can see this board, they can’t edit it.


    It’s also important to note that as of 2022, Google does not index Trello boards,
    so they will not appear in Google search results. Bummer for folks who had Trello
    boards with links that were getting tons of traffic!'
  merge: -1
  img_proc: true
- pgno: 28
  md: '**Organization** visibility is only available to Trello Enterprise accounts.
    It means anyone using Trello with the same company email domain (for example,
    mary@coolcompany.com and john@coolcompany.com) can view this board.


    Next to the visibility settings, you’ll see options for board views. If you want
    to learn about them now, skip to <u>Chapter 4</u>.


    There’s another button called **Power-Ups**, but once again, we won’t cover these
    until a later chapter because we’ve got a lot of ground to cover there. These
    add-ons super-charge your Trello board to do even more powerful things. It’s best
    to start with Trello’s native features before diving into the extras. We will
    discuss those in _Chapters 11, 12, 13, and 14_.


    You’ll also see a button for **Automation**, which allows you to customize rules
    for managing items in Trello. You will learn more about this in <u>Chapter 6</u>.


    # # Filtering a board


    One more button you’ll see in your top bar is the **Filter** button. If you don’t
    have any cards on your board, it won’t be very useful, but once you add cards,
    you can select which cards you want to see:'
  merge: -1
  img_proc: true
