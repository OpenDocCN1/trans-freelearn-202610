  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_202_0.png)


    # Figure 7.13 – Content actions


    I don’t use these sections every day, but when I do, they’re extremely useful.
    The power behind these actions is that you can complete your workflow based entirely
