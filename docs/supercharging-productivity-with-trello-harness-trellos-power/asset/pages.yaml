- pgno: 271
  md: '# # Power-Ups Built by Trello


    At this point, we’ve covered most of the default functionality of Trello,

    which is already pretty powerful. But this is just the core of Trello! Your

    boards can go to the next level when you layer add-ons, called Power-Ups.


    In this chapter, we’ll talk about what Power-Ups are and how they can

    supercharge your board. We’ll review some specific Power-Ups Trello has

    made that add amazing functionality to your board for free. You’ll be able

    to do things such as the following:


    +   - Integrate Trello with other apps you use every day, such as Slack

    +   - Visually indicate how many cards are in a list and change the color if

    +     it’s more than a set amount

    +   - Create and display a how-to guide your colleagues can read when they

    +     visit your board

    +   - Allow board members, or even non-board members, to vote on cards

    +     and then sort those cards by the most votes


    We’ll also discuss a few other Trello-made Power-Ups that you might be

    interested in. Before we dive into specifics, we need to talk about what

    Power-Ups are and where to find them.


    The best Power-ups are what works best for you


    Over the next couple of chapters, we’ll be discussing Power-Ups. People

    always ask: “What are the best Power-Ups to use?” If you’ve come here

    hoping I’ll answer that question for you, I hate to disappoint, but that’s

    something that only you or someone who deeply knows your workflows

    can best answer.


    While the number of boards a Power-Up has been added to is a way to see

    which ones are most popular (or more often, which ones have been around

    longer), there is no ideal Power-Up toolbox set for every single person. Use'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'these chapters as an opportunity to get familiar with searching for and interacting
    with Power-Ups and understanding what they’re capable of. Then, use them if they
    work for you, or explore the Power-Up directory to see whether there’s anything
    better that might fit your workflow.


    # # What are Power-Ups?


    Power-Ups are add-ons that provide more functionality or styling to boards and
    cards. They enhance productivity, collaboration, and organization by adding new
    features or fields, or aggregating information from other sources. There are over
    300 Power-Ups available, so no matter what you’d like to do in Trello, you can
    probably find a Power-Up to help.


    Many people use Power-Ups to integrate Trello with other apps they use, such as
    Slack or GitHub. Power-Ups offer a seamless way to sync information without needing
    to jump between multiple places. You’ll see more examples of this in the _Power-Ups
    for Integrations_ section.


    Aside from integrating with other tools, people use Power-Ups when they’re looking
    for specific features they want in their boards that they can’t natively do. For
    example, if you’re doing reporting or time tracking, you’ll find Power-Ups that
    can help Trello work even better for your use case.


    Power-Ups are free to add to your board, and you can add as many as you like.
    But for some third-party Power-Ups (ones not made by Trello), you’ll be charged
    a fee by the developer. These prices can vary from a couple of dollars a year
    to $20 a month (or more in some cases). Most Power-Ups offer a free trial period
    so you can make sure it’s what you want before you’re asked to pay for it. And
    don’t worry—you’re never charged by merely adding them to your board. Every Power-Up
    is slightly different, but for paid Power-Ups, you’ll be asked to create an account
    and select a subscription.


    Power-Ups can be added to a board by any member of the board and can be customized
    to suit the specific needs of the board or project. Now let’s talk about where
    to find Power-Ups and how to add them to your board.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# # Accessing Power-Ups


