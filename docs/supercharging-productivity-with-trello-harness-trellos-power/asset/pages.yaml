- pgno: 226
  md: 'Many teams, such as my own, use Trello for project management and Slack for
    communication.


    There’s one action for Slack, which is posting a message. This is great for sending
    notifications to keep your team updated on tasks, even if they’re not inside Trello.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_226_0.png)


    # Figure 8.13 – Slack actions


    You can craft a specific message that will send every time it’s triggered, such
    as `a card was just added to your board!`, or you can make the message more specific
    by referencing automation variables from the trigger. For instance, you can say
    `{cardname} was added to your board.`


    You’ll need to specify what channel you want it posted in and what workspace if
    you have multiple connections. (Again, you could use automation variables here
    if you wanted to—for instance, if you have a custom field called `Comms` and a
    dropdown of Slack channels, you could set the channel on the card and then reference
    `{{%Comms}}` for the channel and it will grab that data from the card.)


    You can even set the message to come from you or you can allow it to come from
    Butler* to make it clear that you’re putting the robots to work!'
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_227_0.png)


    Figure 8.14 – Options for Slack message sender in automation


    *Butler is the former name of the suite of automation tools in Trello.


    Real-world example


    When a card is moved to **Done**, post a message saying, `{cardname} was completed
    by {cardmemberfullnames}`. 📢 **Well done team!** to Slack channel **team** in
    workspace **company** as Butler.


    This is another great automation to use if your team is having trouble remembering
    to check Trello. Push more notifications to Slack, which will make it easier to
    have your teammates jump into Trello rather than relying on them to remember to
    go there.


    # ## Summary


    Wow, that covers a lot. I bet you’re either feeling exhausted or inspired...or
    maybe both! That’s okay! Remember—you don’t have to actually remember all of these
    things. Instead, you just want to get to know the foundation so you can come back
    and find them when you wonder, “Is it possible for cards to be checklist items
    and stay in sync?” Spoiler, the answer is _yes_, if you pair together a lot of
    these actions.


    In the next chapter, we’re going to talk about how you can bring triggers and
    actions together to form workflows for your automation.'
  merge: -1
