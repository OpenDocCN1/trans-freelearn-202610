- pgno: 164
  md: 'If you want to trigger an action to happen when a start or due date is added
    to a card, then this is what you’re looking for. As usual, you can click the filter
    button to be even more specific. This trigger is helpful for clarifying cards
    in your board that have been scheduled.


    # Real-world example


    When a due date is added to a card, add the card to the **Scheduled** list.


    This automation is helpful for queuing up cards into a specific list when they’ve
    been assigned deadlines, helping you prioritize the most important upcoming tasks.


    # When the due date is marked complete/incomplete


    This trigger is helpful if you want something to happen when a task is “done,”
    or when someone unchecks the due date of a completed card. This one _only_ applies
    to the due date as a start date isn’t a field that can be marked as complete or
    not.


    # Real-world example


    When a due date is marked complete, move a card to the **Done** list.


    This automation saves you a step for completing a card. Simply checking the due
    date will also move the card to the completed list, so you don’t have to do both!


