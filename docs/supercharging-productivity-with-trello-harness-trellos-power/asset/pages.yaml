- pgno: 34
  md: '# Figure 1.12 – Board background customization options


    Not every tool lets you customize and style your workspace. Trello lets you make
    the board your own rather than being limited to using the default light or dark
    mode background.


    # Stickers


    If you want to add flair to your board, you can add stickers to style cards. Open
    the stickers menu, search for a keyword, select the sticker, and then drag it
    over to a card. You can remove a sticker by hovering over it and clicking the
    x button:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_34_0.png)


    # Figure 1.13 – Trello board stickers


    # Additional settings


    Click **More** to view another hidden layer of settings. If you choose the first
    option, called **Settings**, you’ll see options to change the board’s workspace.


    You can also enable or disable card covers (images that prepend to the top of
    a card).


    Lastly, you can change the permissions of who is allowed to perform various actions
    on a board, such as commenting on cards or adding people.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'You can even edit the ability for workspace members to join the board without
    an invite:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_35_0.png)


    Figure 1.14 – Board advanced settings options


    # # Collections


    Collections are kind of like folders for your Trello boards. If you’d like to
    organize multiple boards together, you can add them to a collection. This feature
    is only available for Premium and higher plans.


    # # Archived items


    Trello makes it very hard to accidentally delete something. If you seem to be
    missing something, there’s a good chance it was just archived! You can find your
    archived items here. Click this option to see anything archived in this board,
    sorted by card or list:'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_36_0.png)


    Figure 1.15 – Archived items in Trello


    To bring something back, click the **Send to board** button.


    This is one of the reasons I prefer to use Trello – because it’s hard to lose
    something. In other tools, you might delete something as the default action. This
    makes it difficult to restore if it was an accident. But when using Trello, if
    you find that something’s missing, it’s easy to recover it.


    # ## Email address


    Did you know that you can email something to a Trello board? Every board has a
    unique email address. You can use the **Email-to-board settings** area to view
    the board’s address, generate a new one, and configure which list to add new items
    to:'
  merge: -1
  img_proc: true
- pgno: 37
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_37_0.png)


    Figure 1.16 – Board email options


    Go ahead and try it! Copy the email address and head to your email. Send an email
    with the subject `Hi` and something in the body. Then, head back to Trello and
    watch it appear on your board within seconds!


    # ## Watching


    If you want notifications about everything that happens to anything on this Trello
    board, click the **Watch** button. But fair warning – that’s a lot of notifications!
    You’ll get a notification whenever something happens to any card on this board:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_37_1.png)


    Figure 1.17 – The board’s Watch button checked'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'You can confirm whether you’re watching a board or not in this section, as
    it will show a checkmark if you are. Or, in the toolbar, you’ll see a watch button.
    You can toggle it off if you’re getting too many notifications.


    # Template


    Once you have your board set up the way you like, you might want to share it as
    a template that you or others can use in the future. This is a great way to customize
    and reuse boards so that you don’t have to set them up from scratch each time:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_38_0.png)


    Figure 1.18 – The Make template button


    You can even publicize a template to help more people discover more uses for Trello!
    To view templates others have contributed to, head to trello.com/templates.


    # Copy


    You don’t have to make a board a template to be able to copy it. Click the **Copy**
    button to duplicate the board and choose which parts you want to copy over, such
    as members and cards:'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_39_0.png)


    Figure 1.19 – Settings to copy a board


    Try it out and make a copy of your current board. Make a duplicate board named
    `House Projects`.


    # ## Exporting


    As much as you’ll enjoy working in Trello, you might find that you need to get
    your information out of Trello. There are multiple ways to do that – you can print
    your boards, export them as a CSV, or export them as a JSON object (pro tip –
    you can also view your board as a JSON object in your browser by appending `.json`
    to the URL):


    ![](img/21bbd56263f8fc423bc91d3203b460bb_39_1.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Figure 1.20 – Board export options


    At the moment, our board is pretty empty, but if you want to test it out, add

    a few cards and try it out!


    # Close board


    If you ever want to delete a board, you can close it. Even after you close it,

    you can undo it if you change your mind! Simply click **Reopen board**. You

    can also find your closed boards from your **Boards** page (to get there, click

    the Trello logo in the top-left corner from anywhere in Trello). From there,

    scroll to the bottom of the page, then click the **View all closed boards**

    button.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_40_0.png)


    # Figure 1.21 – Reopening a closed board


    Go ahead and try it out! Close your board, and then bring it back.


    # Lists


    The second major component of your Trello board is your **lists**. Lists are

    how you organize sticky notes inside the board. While there are a million

    strategies for how you can use lists, they’re often used as stages of your

    workflow.


    In many cases, it’s as simple as **To Do**, **Doing**, and **Done**.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'It’s easy to change the names of lists and drag them around, so don’t worry
    too much about what you call them and whether the name will change.


    To create your first list, click **Add a list** in the box under your board’s
    name. Type anything you want, but if you need inspiration, call this one `Ideas`.
    Press _Enter_ to create your first list:


    ![](img/21bbd56263f8fc423bc91d3203b460bb_41_0.png)


    Figure 1.22 – Empty board before adding a list


    Go ahead and create a few more. You’ll follow the same process – just type the
    name and press _Enter_ in the box to the right of the list.


    Add the **To Do**, **Doing**, and **Done** lists.


    If you put them in the wrong order or want to move a list, drag a list to move
    it to a different spot.


    Just like boards have actions, lists have actions for managing groups of cards.
    Click the three-dot menu at the top right of a list to access the list menu:'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_42_0.png)


    Figure 1.23 – The three-dot menu to access list actions


    # # Add a card


    The first option is to add a card to a list. This isn’t the only way to add a
    card, but it’s available if you like it. Click **Add a card** to name a card,
    after which it will be added to your list. Go ahead and try it!


    ![](img/21bbd56263f8fc423bc91d3203b460bb_42_1.png)'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Figure 1.24 – Adding a card to a list


    Make a card that says `Add cards to my Trello board`. Press `Enter` to save it.
    And voilà! It will appear on your list!


    # Copy


    The next action in the list menu is to copy a list. This does just what it sounds
    like – it duplicates the list and adds it right next to the current list, including
    any cards in that list. Go ahead and try it out! Click **Copy** to see another
    list appear with the card you just created.


    # Move


    Lists also have a **Move** option. You can drag a list to move it to another place
    within the board, or you can use this action to move it. You can even move the
    list to another board entirely! You might want to do this when you’re figuring
    out how to organize your board, or after you’ve completed a project.


    # Watch


    You can also watch a list, similar to watching a board.


    This sends notifications about anything that happens to any card in this list.
    It’s perfect if you’re managing a particular stage of a workflow.


    For instance, if you’re in charge of reviewing content for your blog, you may
    want a notification about every card in the **Review** list:'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_44_0.png)


    Figure 1.25 – Available actions in a list


    Select the **Watch** option for this **To Do** list so that you can get notifications
    whenever a new card is added to this list.


    # # Sort by


    You can use the **Sort list** action to sort cards in a list by certain attributes.
    Here, you can order cards by their name, date created, or by the due date (if
    you have cards with due dates in that list):


    ![](img/21bbd56263f8fc423bc91d3203b460bb_44_1.png)


    Figure 1.26 – List sorting menu


    # # Actions for cards within a list


    The following two options apply to all the cards in a list, but not the list itself.
    You can move all the cards to another list while leaving the list column in its
    current place. You might do this at the end of the week by moving all the cards
    in your **Done This Week** list to another **Done** list:


    Move all cards in this list...

    Archive all cards in this list...'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Figure 1.27 – Actions for cards within a list


    The next action is to archive all the cards in the list while keeping the actual
    list itself. This is useful if you’re done with the cards in the list and want
    to clear them out but still plan to continue using that list.


    # # Archive list


    The last action in the **List** menu is to archive the list, which will archive
    the cards _and_ the list itself. This is useful if you realize you no longer need
    the list. If you accidentally archive a list (or cards in a list), you can go
    to the board settings in the **Archived items** area and send the list back to
    the board.


    # # Cards


    The final element of a Trello board is the super-charged sticky note. Your board
    holds your lists, which contain your cards. You can easily move cards between
    lists (and boards), name them whatever you want, and do so much more.


    That’s why _Chapters 2_ and _3_ will dive deep into the core features of Trello
    that are nested inside these cards.


    For now, just know that these are the sticky notes of your board and can be moved
    between lists. They have superpowers, allowing you to add more detail than you
    could ever imagine to each sticky note:'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_46_0.png)


    Figure 1.28 – Trello card


    # # Summary


    In this chapter, we learned how Trello is a digital whiteboard with sticky notes.
    You can build nearly anything you want with it because, like LEGO, it’s so versatile.
    Many different types of teams and people find value in Trello!


    When building, you’ll use three components – boards, lists, and cards – to design
    your masterpiece. Boards are a collection of cards – super-charged'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'sticky notes – and lists organize those cards across the board. There are

    many options for customizing your board to make it your own.


    Alright you''ve made it through the tough set up content, now it''s time to

    have some fun and dive into Trello cards.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# # Trello Card Starter Pack


    Trello''s key component is the super-charged sticky notes that we call **cards**.
    Everything in Trello centers around the cards – it’s the core of Trello! To get
    the most out of Trello, you’ll need to understand a card’s different functions.


    In this chapter, we’re going to cover the most important things you need to know
    about cards, including the fields that are used most commonly. By the end of this
    chapter, you’ll be able to create cards with clear descriptions and stylish labels,
    adding members and dates to them. You’ll also be able to move things around with
    ease.


    Although there’s a lot to cards, here’s what we’ll focus on in this chapter:


    +   - Card views

    +   - Name and descriptions

    +   - Labels

    +   - Dates

    +   - Members

    +   - Watching cards

    +   - Comments


    We’ll talk more about other features in cards, such as checklists, custom fields,
    and attachments, in _Chapter 3_.


    # # Card views


    Trello cards have two views – the **card front** and the **card back**.


    The front view is what you see from the board, without clicking to open the card:'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/21bbd56263f8fc423bc91d3203b460bb_49_0.png)


    Figure 2.1 – The card front


    The back view is what you see when you open a card. This shows the full

    details of a card and allows you to interact with it.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_49_1.png)


    Figure 2.2 – The card back'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# # Name and description


    Every Trello card must have a title. This is visualized at the top of the card.
    Below that is the description field.


    ![](img/21bbd56263f8fc423bc91d3203b460bb_50_0.png)


    Figure 2.3 – The card description editor


    The description field allows you to provide detailed information about a task
    or project. This is particularly useful to provide context or additional information
    that may not be immediately apparent from the title of the card.


    # ## Why use descriptions?


    Descriptions are a great place to keep notes about a task or project and provide
    additional details. For instance, if you’re a marketer using a card to represent
    a campaign, the description can hold the items you would include in a campaign
    brief. This eliminates the need to link to another document somewhere else. If
    you’re a project manager, you can combine notes from all the stakeholders and
    list the objectives and goals of a project in the description. An engineer might
    use the description to describe a bug and include a screenshot of a broken feature.
    You can also include information in attachments, which we’ll talk about in Chapter
    3.


    # # Editing descriptions


    To add a description to a card, click on the name of the card from the board view
    to open the card. Then, select the box prompting you to make a description, and
    type anything that comes to mind.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'The description field accepts Markdown, but if you prefer, you can use the
    rich text editor to style the text with headers, bold, italics, created links,
    added links, images, and more! If you need to export the card description to Markdown,
    select the M↓ button, and then copy the text.


    # # Labels


    Labels are used to categorize cards. They are color-coded and can be customized
    to suit your needs. For example, you can use labels to indicate the priority of
    a task, the type of task, the status of a project, or anything else you can imagine!


    Why use labels?


    Labels add visual tags to your cards so that you can quickly get relevant details
    about them without having to open the card. They’re also useful to filter your
    board, allowing you to view a subset of your cards at any given time. We’ll talk
    more about filters in Chapter 4.


    # # Creating and editing labels


    There are two places to edit labels – the board menu or from directly within a
    card. Both processes are the same – the only difference is where you access it!


    From within a card, click the **Labels** button on the **Add to card** menu located
    on the right side of the card:'
  merge: -1
  img_proc: true
