- pgno: 208
  md: 'Clearing custom fields is helpful for resetting a card, such as when it’s deprioritized.


    # # Set custom field __ to __


    Use this to update a custom field to a specific value. You can make it a single,
    static value that will apply every time. Or you can make it dynamic by using **automation
    variables**. For instance, you can set a custom field to be the current date,
    the current list name, or anything else!


    Real-world example


    When a card is added to the board, set custom field **Type** to `{cardlistname}`.


    This is a great rule for keeping track of where a card originated. I use this
    in my recipe board to keep track of the type of meal a recipe falls under (like
    Meatless, Quick, or New). I’ll queue up meals to make in my **Meal Plan** list,
    and then when I’m done, I use another automation rule to move the card back to
    its meal type list, by referencing the value in that `Type` custom field.


    # # Check/uncheck custom field


    If you’re using a checkbox custom field, this will allow you to set it to “true”
    or “false” (checked or unchecked).


    Real-world example


    When a card is moved to **Ready for Review** list, check the custom field **Drafted**.


    Some people prefer using custom fields instead of checklists, which is understandable
    as they are at the top of the card, and for a while, there were more options for
    automating custom fields than checklist items.'
