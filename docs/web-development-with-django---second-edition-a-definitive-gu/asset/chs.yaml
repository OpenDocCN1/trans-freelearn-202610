  \ 15.01 – Django configurations 设置一样，如果它能正常启动，你可以确信更改成功。为了确定，请在浏览器中打开 http://127.0.0.1:8000/\
  \ 并检查一切看起来和行为是否与之前一样。你应该访问一个从数据库查询的页面（例如 Books List 页面）并检查书籍列表是否显示：\n\n\n![](img/4840a43efd335abd10b93708225692d6_660_0.png)\n\
  \n图15.6 – Bookr页面，数据库查询仍然正常工作\n\n在本练习中，我们更新了settings.py，使其根据环境变量中指定的URL来确定DATABASES设置。我们使用values.DatabaseURLValue类自动读取该值，并提供了默认URL。我们还将environ_prefix参数设置为DJANGO，这样环境变量名称就是DJANGO_DATABASE_URL，与其他设置保持一致。\n\
  \n在下一节中，我们将介绍Django调试工具栏，这是一个帮助你在浏览器中调试Django应用的应用程序。\n\n## Django调试工具栏\n\nDjango调试工具栏是一个直接在浏览器中显示网页调试信息的应用程序。它包含生成页面时运行了哪些SQL命令、请求和响应头、页面渲染耗时等信息。这些信息在以下情况下非常有用：\n\
  \n- 页面加载耗时过长——也许是因为运行了太多数据库查询。你可以查看相同的查询是否被多次执行，如果是，可以考虑使用缓存。否则，可以通过为数据库添加索引来加速某些查询。\n\
  - 你想确定页面返回错误信息的原因。你的浏览器可能发送了你意料之外的请求头，或者Django返回的某些响应头不正确。\n- 页面速度慢是因为在非数据库代码上花费了时间——你可以对页面进行性能分析，查看哪些函数耗时最长。\n\
  - 页面显示不正确。你可以查看Django渲染了哪些模板。可能有第三方模板被意外渲染。你还可以检查所有正在使用的设置（包括我们未设置的内置Django设置）。这有助于定位可能导致页面行为异常的设置。\n\
  \n我们将解释如何使用Django调试工具栏来查看这些信息。在深入介绍如何设置和使用Django调试工具栏之前，我们先快速了解一下它。该工具栏显示在浏览器窗口右侧，可以展开和收起以显示信息：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_661_0.png)\n\n图15.7 – Django调试工具栏（收起状态）\n\
  \n上图显示了收起状态的Django调试工具栏。请注意窗口右上角的切换条。点击该工具栏即可展开：\n\n![](img/4840a43efd335abd10b93708225692d6_662_0.png)\n\
  \n*图15.8* 显示了展开后的Django调试工具栏。\n\n安装Django调试工具栏使用`pip`：\n\n```\npip3 install django-debug-toolbar\n\
  ```\n\n> **注意**\n>\n> 对于Windows，你可以在上述命令中使用pip代替pip3。\n\n然后，需要进行几个步骤来完成设置，主要是在settings.py中做一些修改：\n\
  \n1. 将debug_toolbar添加到INSTALLED_APPS设置列表中。\n2. 将debug_toolbar.middleware.DebugToolbarMiddleware添加到MIDDLEWARE设置列表中。应尽早添加；对于Bookr，可以将其放在列表的第一项。所有请求和响应都会经过这个中间件。\n\
  3. 将'127.0.0.1'添加到INTERNAL_IPS设置列表中（可能需要创建此设置）。Django调试工具栏只会显示此处列出的IP地址。\n4. 将Django调试工具栏的URL添加到基础的urls.py文件中。我们只想在DEBUG模式下添加这个映射：\n\
  \n```\npath('__debug__', include(debug_toolbar.urls))\n```\n\n在下一个练习中，我们将详细完成这些步骤。\n\
  \n一旦Django调试工具栏安装并设置完成，你访问的任何页面都会显示DjDT侧边栏（你可以通过DjDT菜单打开或关闭它）。当它打开时，你可以看到另一组可点击的部分，以获取更多信息。\n\
  \n每个面板旁边都有一个复选框，允许你启用或禁用该指标的收集。每收集一个指标都会稍微减慢页面加载速度（尽管通常不明显）。如果你发现某个指标收集速度较慢，可以在此处将其关闭。接下来，我们将逐一介绍该工具栏的每个面板：\n\
  \n- 第一个是History（历史记录），显示浏览器中发出的请求历史。你可以切换到之前的请求，以在Django调试工具栏中查看与之关联的统计信息（图15.9）：\n\
  \n  ![](img/4840a43efd335abd10b93708225692d6_663_0.png)\n\n  图15.9 – DjDT History（历史记录）面板（为简洁起见，截图已裁剪）\n\
  \n- 系统时间和用户时间之间的差异超出了本书的范围；基本上，系统时间是花在内核中的时间（例如，进行网络或文件读写），而用户时间是操作系统内核之外的代码（包括你在Django、Python等中编写的代码）。\n\
  \n  同时还显示了浏览器中花费的时间，例如发出请求所花费的时间以及渲染页面所花费的时间。\n\n- 第四个面板**Settings**（设置）显示你的应用程序正在使用的所有设置（*图15.12*）：\n\
  \n  ![](img/4840a43efd335abd10b93708225692d6_665_0.png)\n\n  图15.12 – DjDT Settings（设置）面板\n\
  \n- 第六个面板**Request**（请求）显示生成响应的视图，以及调用它时使用的参数和关键字参数（`args`和`kwargs`参数）（*图15.14*）。你还可以看到URL映射中使用的URL名称：\n\
  \n  ![](img/4840a43efd335abd10b93708225692d6_667_0.png)\n\n  图15.14 – DjDT Request（请求）面板（为简洁起见，部分面板未显示）\n\
  \n  它还显示请求的cookies、会话中存储的信息（会话在第8章“媒体服务与文件上传”中介绍），以及`request.GET`和`request.POST`数据。\n\
  \n- 第七个面板**SQL**显示构建响应时执行的所有SQL数据库查询（*图15.15*）：\n\n  ![](img/4840a43efd335abd10b93708225692d6_668_0.png)\n\
  \n  图15.15 – DjDT SQL面板\n\n  你可以查看每个查询的执行耗时以及它们的执行顺序。它还会标记相似和重复的查询，以便你重构代码来消除它们。\n\
  \n  每个SELECT查询都会显示两个操作按钮：Sel（select的缩写）和Expl（explain的缩写）。这些按钮不会出现在INSERT、UPDATE或DELETE查询中。\n\
  \n  Sel按钮显示已执行的SELECT语句以及为该查询检索的所有数据（图15.16）：\n\n  ![](img/4840a43efd335abd10b93708225692d6_669_0.png)\n\
  \n  图15.16 – DjDT SQL selected（SQL选择）面板\n\n  Expl按钮显示SELECT查询的EXPLAIN查询（图15.17）：\n\
  \n- ![](img/4840a43efd335abd10b93708225692d6_671_0.png)\n\n  图15.18 – DjDT Static\
  \ files（静态文件）面板\n\n- 第九个面板Templates（模板）显示渲染过的模板的信息（图15.19）：\n\n  ![](img/4840a43efd335abd10b93708225692d6_672_0.png)\n\
  \n  图15.19 – DjDT Templates（模板）面板\n\n  它显示模板加载的路径和继承链。\n\n- 第10个面板Cache（缓存）显示从Django缓存中获取数据的信息：\n\
  \n  ![](img/4840a43efd335abd10b93708225692d6_673_0.png)\n\n  图15.20 – DjDT Cache（缓存）面板（为简洁起见，部分面板未显示）\n\
  \n  由于我们在Bookr中未使用缓存，此部分为空。如果使用了缓存，我们就能看到对缓存发出了多少次请求，以及其中有多少次成功检索到条目。我们还会看到有多少条目被添加到了缓存中。这可以让你了解缓存使用是否高效。如果你向缓存中添加了大量条目却没有检索到任何条目，那么你应该重新考虑正在缓存的数据。相反，如果缓存未命中次数很多（未命中是指请求的数据不在缓存中），那么你应该缓存比现有更多的数据。\n\
  \n\n\n\n\n- 第12个面板，**日志**，显示了你的Django应用生成的日志消息（*图15.22*）：\n\n![](img/4840a43efd335abd10b93708225692d6_675_0.png)\n\
  \n*图15.22 — DjDT日志面板*\n\n由于这个请求没有生成任何日志消息，该面板为空。\n\n下一个选项，**拦截重定向**，不是一个包含数据的部分。相反，它允许你切换重定向拦截。如果你的视图返回一个重定向，它不会被跟随。相反，会显示一个类似*图15.22*的页面：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_675_1.png)\n\n*图15.23 — DjDT拦截的重定向*\n\
  \n这允许你为生成重定向的视图打开Django调试工具栏；否则，你只能看到被重定向到的视图的信息。\n\n- 最后一个面板是**性能分析**。默认情况下它是关闭的，因为性能分析可能会大大拖慢你的响应。一旦打开，你必须刷新页面来生成性能分析信息（如图15.24所示）：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_676_0.png)\n\n图15.24 – DjDT性能分析面板\n\n\
  这里显示的信息是响应中每个函数调用所耗时间的分解。页面左侧显示了所有执行的调用的堆栈跟踪。右侧是包含计时数据的列。各列如下：\n\n- **CumTime**：在函数及其调用的任何子函数中花费的累计时间\n\
  - **Per**：累计时间除以调用次数（Count）\n- **TotTime**：在此函数中花费的时间，但不包括其调用的任何子函数\n- **第二个Per**：总时间除以调用次数（Count）\n\
  - **Count**：此函数的调用次数\n\n这些信息可以帮助你确定如何加速应用。例如，将一个被调用1,000次的函数略微加速，比优化一个只被调用一次的大型函数要容易得多。关于如何加速代码的更深入技巧超出了本书的范围。\n\
  \n我们将通过以下练习安装和配置Django调试工具栏，来巩固所学的内容。\n\n## 练习15.03 – 设置Django调试工具栏\n\n在本练习中，我们将通过修改`INSTALLED_APPS`、`MIDDLEWARE`和`INTERNAL_IPS`设置来添加Django调试工具栏的设置。然后，我们将把`debug_toolbar.urls`映射添加到bookr包的`urls.py`文件中。最后，我们将在浏览器中加载一个带有Django调试工具栏的页面并使用它：\n\
  \n- 1. 在终端中，确保你已经激活了bookr虚拟环境，然后运行以下命令来使用pip3安装Django调试工具栏：\n\n```\n```bash\npip3\
  \ install django-debug-toolbar\n```\n```\n\n> **注意**\n>\n> 在Windows上，你可以使用`pip`代替前面命令中的`pip3`。\n\
  \n安装过程将运行，你应该会看到类似于图15.25的输出：\n\n```\n(bookr) → bookr pip3 install django-debug-toolbar\n\
  Looking in indexes: https://pypi.org/simple, https://token:****@gitlab.com/api/v4/projects/28933584/packages/pypi/simple,\
  \ https://token:****@gitlab.com/api/v4/projects/20903871/packages/pypi/simple\n\
  Collecting django-debug-toolbar\n  Downloading django_debug_toolbar-3.8.1-py3-none-any.whl\
  \ (221 kB)\n     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ 221 kB 250 kB/s\nRequirement\
  \ already satisfied: sqlparse>=0.2 in /Users/ben/.virtualenvs/bookr/lib/python3.8/site-packages\
  \ (from django-debug-toolbar) (0.4.2)\nRequirement already satisfied: django>=3.2.4\
  \ in /Users/ben/.virtualenvs/bookr/lib/python3.8/site-packages (from django-debug-toolbar)\
  \ (4.0)\nRequirement already satisfied: asgiref<4,>=3.4.1 in /Users/ben/.virtualenvs/bookr/lib/python3.8/site-packages\
  \ (from django>=3.2.4->django-debug-toolbar) (3.4.1)\nRequirement already satisfied:\
  \ backports.zoneinfo; python_version < \"3.9\" in /Users/ben/.virtualenvs/bookr/lib/python3.8/site-packages\
  \ (from django>=3.2.4->django-debug-toolbar) (0.2.1)\nInstalling collected packages:\
  \ django-debug-toolbar\nSuccessfully installed django-debug-toolbar-3.8.1\n```\n\
  \n图15.25 – 使用pip安装django-debug-toolbar\n\n- 2. 打开bookr包目录中的settings.py。将debug_toolbar添加到INSTALLED_APPS设置中：\n\
  \n```\nINSTALLED_APPS = [\n    'debug_toolbar',\n]\n```\n\n这将允许Django找到Django调试工具栏的静态文件。\n\
  \n- 3. 将debug_toolbar.middleware.DebugToolbarMiddleware添加到MIDDLEWARE设置中——它应该是列表中的第一项：\n\
  \n```\nMIDDLEWARE = [\n    'debug_toolbar.middleware.DebugToolbarMiddleware',\n\
  \    ...\n]\n```\n\n这将使请求和响应通过DebugToolbarMiddleware进行路由，允许Django调试工具栏检查请求并将HTML插入响应中。\n\
  \n- 4. 要添加的最后一个设置是将127.0.0.1地址添加到INTERNAL_IPS。你目前还没有定义INTERNAL_IPS设置，因此请将其添加为一项设置：\n\
  \n```\nINTERNAL_IPS = ['127.0.0.1']\n```\n\n这将使Django调试工具栏只在开发者的计算机上显示。现在你可以保存settings.py了。\n\
  \n- 5. 现在我们需要添加Django调试工具栏的URL。打开bookr包目录中的urls.py。我们已经有一个检查DEBUG模式然后添加媒体URL的if条件，如下所示：\n\
  \n```\nif settings.DEBUG:\n    urlpatterns += static(settings.MEDIA_URL,\n     \
  \                     document_root=settings.MEDIA_ROOT)\n```\n\n我们还将在该if语句中添加对debug_toolbar.urls的include；不过，我们会将其添加到urlpatterns的开头，而不是追加到末尾。请在if语句内添加以下代码：\n\
  \n```\nimport debug_toolbar\n\nurlpatterns = [\n    path('__debug__/',\n       \
  \ include(debug_toolbar.urls)),\n] + urlpatterns\n```\n\n保存urls.py。\n\n6. 如果Django开发服务器尚未运行，请启动它并导航到http://127.0.0.1:8000。你应该会看到Django调试工具栏打开。如果它没有打开，请点击右上角的DjDT切换按钮将其打开：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_679_0.png)\n\n图15.26 – 角落中显示的DjDT切换按钮\n\
  \n7. 尝试浏览一些面板并访问不同的页面，看看你能找到哪些信息。也请尝试打开“拦截重定向”，然后创建一条新的书评。提交表单后，你应该会看到被拦截的页面，而不是被重定向到新书评（图15.27）：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_679_1.png)\n\n图15.27 – 提交新书评后的重定向拦截页面\n\
  \n然后你可以点击**Location**链接转到它原本要重定向到的页面。\n\n- 8. 你也可以尝试打开**性能分析**，查看哪些函数被大量调用，哪些函数占用了大部分渲染时间。\n\
  - 9. 一旦你完成了对Django调试工具栏的实验，请关闭**拦截重定向**和**性能分析**。\n\n在本练习中，我们通过添加设置和URL映射，安装并设置了Django调试工具栏。然后我们看到了它的实际效果，并检查了它能提供给我们的有用信息，包括如何处理重定向以及查看性能分析信息。\n\
  \n在下一节中，我们将学习`django-crispy-forms`应用，它可以减少我们编写表单所需的代码量。\n\n## django-crispy-forms\n\
  \n在Bookr中，我们使用Bootstrap CSS框架。它提供了可以通过CSS类应用于表单的样式。由于Django独立于Bootstrap，当我们使用Django表单时，它甚至不知道我们在使用Bootstrap，因此不知道应该将哪些类应用于表单组件。\n\
  \n`django-crispy-forms`充当Django表单和Bootstrap表单之间的中介。它可以获取一个Django表单，并使用正确的Bootstrap元素和类进行渲染。它不仅支持Bootstrap，还支持其他框架，如**Uni-Form**和**Foundation**（不过Foundation支持必须使用单独的包`crispy-forms-foundation`来添加）。\n\
  \n它的安装和设置非常简单。同样，它使用`pip3`安装：\n\n```\npip3 install django-crispy-forms\n```\n\n\
  > **注意**\n> 在Windows上，你可以使用`pip`代替前面命令中的`pip3`。\n\n然后，只需进行几项设置更改。首先，将`crispy_forms`添加到你的`INSTALLED_APPS`中。然后，你需要告诉`django-crispy-forms`你正在使用什么框架，以便它加载正确的模板。这通过`CRISPY_TEMPLATE_PACK`设置来完成。在我们的案例中，它应该设置为`bootstrap4`：\n\
  \n```\nCRISPY_TEMPLATE_PACK = 'bootstrap4'\n```\n\n`django-crispy-forms`有两种主要操作模式：作为过滤器或作为模板标签。前者更容易插入到现有模板中。后者允许更多配置选项，并将更多HTML生成移入`Form`类。我们将依次介绍这两种模式。\n\
  \n\n\n\n\n## The crispy filter\n\nThe first method to render a form with django-crispy-forms\
  \ is by using the crispy template. First, the filter must be loaded into the template.\
  \ The library name is crispy_forms_tags:\n\n```\n{% load crispy_forms_tags %}\n\
  ```\n\nThen, instead of rendering a form with the as_p method (or another method),\
  \ use the crispy filter. Consider the following line:\n\n```\n{{ form.as_p }}\n\
  ```\n\nReplace it with this:\n\n```\n{{ form|crispy }}\n```\n\nHere's a quick before-and-after\
  \ showing the Review Create form. None of the rest of the HTML has been changed,\
  \ apart from the form rendering. Figure 15.28 shows the standard Django form:\n\n\
  ![](img/4840a43efd335abd10b93708225692d6_681_0.png)\n\nFigure 15.28 – The Review\
  \ Create form with default styling\n\nFigure 15.29 shows the form after django-crispy-forms\
  \ has added the Bootstrap classes:\n\n![](img/4840a43efd335abd10b93708225692d6_682_0.png)\n\
  \nFigure 15.29 – The Review Create form with Bootstrap classes added by django-crispy-forms\n\
  \nWhen we integrate django-crispy-forms into Bookr, we will not use this method;\
  \ however, it is worth knowing about because of how easy it is to drop it into your\
  \ existing templates.\n\n## The crispy template Tag\n\nThe other method of rendering\
  \ a form with django-crispy-forms is with the use of the crispy template tag. To\
  \ use it, the crispy_forms_tags library must first be loaded into the template (as\
  \ we did in the previous section). Then, the form is rendered like this:\n\n```\n\
  {% crispy form %}\n```\n\nHow does this differ from the crispy filter? The crispy\
  \ template tag will also render the <form> element and the {% csrf_token %} template\
  \ tag for you. So, consider, for example, that you used it like this:\n\n```\n<form\
  \ method=\"post\">\n  {% csrf_token %}\n  {% crispy form %}\n</form>\n```\n\nThe\
  \ output for this would be as follows:\n\n```\n<form method=\"post\" >\n<input type=\"\
  hidden\" name=\"csrfmiddlewaretoken\" value=\"...\">\n<form method=\"post\">\n<input\
  \ type=\"hidden\" name=\"csrfmiddlewaretoken\" value=\"...\">\n    ... form fields\
  \ ...\n</form>\n</form>\n```\n\nThat is, the form and CSRF token fields are duplicated.\
  \ In order to customize the <form> element that is generated, django-crispy-forms\
  \ provides a FormHelper class, which can be set as a Form instance's helper attribute.\
  \ It is the FormHelper instance that the crispy template tag uses to determine what\
  \ attributes <form> should have.\n\nLet us look at ExampleForm with a helper added.\
  \ First, import the required modules:\n\n```\nfrom django import forms\nfrom crispy_forms.helper\
  \ import FormHelper\n```\n\nNext, define a form:\n\n```\nclass ExampleForm(forms.Form):\n\
  \    example_field = forms.CharField()\n```\n\nWe could instantiate a FormHelper\
  \ instance and then set it to the form.helper attribute (for example, in a view),\
  \ but it's usually more useful to just create and assign it inside the form's __init__\
  \ method. We haven't created a form with an __init__ method yet, but it's no different\
  \ from any other Python class:\n\n```\ndef __init__(self, *args, **kwargs):\n  \
  \  super().__init__(*args, **kwargs)\n```\n\nNext, we set the helper and form_method\
  \ for the helper (which is then rendered in the form's HTML):\n\n```\nself.helper\
  \ = FormHelper()\nself.helper.form_method = 'post'\n```\n\nOther attributes can\
  \ be set on the helper, such as form_action, form_id, and form_class. We don't need\
  \ to use these in Bookr though. We also do not need to manually set enctype on the\
  \ form or its helper, as the crispy form tag will automatically set this to multipart/form-data\
  \ if the form contains file upload fields.\n\nIf we tried to render the form now,\
  \ we wouldn’t be able to submit it, as there’s no submit button (remember that we\
  \ added submit buttons to our forms manually; they are not part of the Django form).\
  \ django-crispy-forms also includes layout helpers that can be added to the form.\
  \ They will be rendered after the other fields. We can add a submit button like\
  \ this – first, import the Submit class:\n\n```\nfrom crispy_forms.layout import\
  \ Submit\n```\n\n> **Note**\n> django-crispy-forms does not properly support using\
  \ a <button> input to submit a form, but for our purposes, <input type=\"submit\"\
  > is functionally identical.\n\nWe then instantiate it and add it to the helper’s\
  \ inputs in a single line:\n\n```\nself.helper.add_input(Submit(\"submit\", \"Submit\"\
  ))\n```\n\nThe first argument to the Submit constructor is its name, and the second\
  \ is its label.\n\ndjango-crispy-forms is aware that we are using Bootstrap and\
  \ will automatically render the button with the btn btn-primary classes.\n\nThe\
  \ advantage of using a crispy template tag and FormHelper is that it means there\
  \ is only one place where attributes and the behavior of the form are defined. We\
  \ are already defining all the form fields in a Form class; this allows us to define\
  \ the other attributes of the form in the same place. We can change a form from\
  \ a GET submission to a POST submission easily here. The FormHelper instance will\
  \ then automatically know that it needs to add a CSRF token to its HTML output when\
  \ rendered.\n\nWe’ll put all this into practice in the next exercise, where you\
  \ will install django-crispy-forms, update SearchForm to utilize a form helper,\
  \ and then render it using the crispy template tag.\n\n## Exercise 15.04 – using\
  \ Django Crispy Forms with SearchForm\n\nIn this exercise, you will install django-crispy-forms\
  \ and then convert SearchForm to be usable with the crispy template tag. This will\
  \ be done by adding an __init__ method and building a FormHelper instance inside\
  \ it:\n\n+   1. In a terminal, make sure you have activated the bookr virtual environment,\
  \ and then run this command to install django-crispy-forms using pip3:\n\n```\n\
  pip3 install django-crispy-forms\n```\n\n> **Note**\n> For Windows, you can use\
  \ pip instead of pip3 in the preceding command.\n\n+   6. Still inside the `__init__`\
  \ method, set `self.helper` to an instance of `FormHelper`. Then, set the helper’s\
  \ `form_method` to `get`. Finally, create an instance of `Submit`, passing in an\
  \ empty string as the name (first argument), and `Search` as the button label (second\
  \ argument). Add this to the helper with the `add_input` method:\n\n```\nself.helper\
  \ = FormHelper()\nself.helper.form_method = \"get\"\nself.helper.add_input(Submit(\"\
  \", \"Search\"))\n```\n\nYou can save and close `forms.py`.\n\n+   7. In the reviews\
  \ app’s templates directory, open `search-results.html`. At the start of the file,\
  \ after the `extends` template tag, use a `load` template tag to load `crispy_forms_tags`:\n\
  \n```\n{% load crispy_forms_tags %}\n```\n\n+   8. Locate the existing `<form>`\
  \ in the template. It should look like this:\n\n```\n<form>\n    {{ form.as_p }}\n\
  \    <button type=\"submit\" class=\"btn btn-primary\">\n        Search</button>\n\
  </form>\n```\n\nYou can delete the entered `<form>` element and replace it with\
  \ a crispy template tag:\n\n```\n{% crispy form %}\n```\n\nThis will use the `django-crispy-forms`\
  \ library to render the form, including the `<form>` element and submit button.\
  \ After making this change, this portion of the template should look like *Figure\
  \ 15.31*:\n\n![](img/4840a43efd335abd10b93708225692d6_686_0.png)\n\nFigure 15.31\
  \ – search-results.html after replacing `<form>` with the crispy form renderer\n\
  \nYou can now save `search-results.html`.\n\n9. Start the Django dev server if it\
  \ is not already running and go to http://127.0.0.1:8000/book-search/. You should\
  \ see the book search form as shown in Figure 15.32:\n\n![](img/4840a43efd335abd10b93708225692d6_687_0.png)\n\
  \nFigure 15.32 – The book search form rendered with django-crispy-forms\n\nYou should\
  \ be able to use the form in the same manner as you did before (Figure 15.33):\n\
  \n![](img/4840a43efd335abd10b93708225692d6_688_0.png)\n\nFigure 15.33 – Performing\
  \ a search with the updated search form\n\nTry viewing the source of the page in\
  \ your web browser to see the rendered output. You will see that the <form> element\
  \ has been rendered with the method=\"get\" attribute, as we specified to FormHelper\
  \ in step 5. Note also that django-crispy-forms has not inserted a CSRF token field\
  \ – it knows that one is not required for a form submitted using GET.\n\nIn this\
  \ exercise, we installed django-crispy-forms using pip3 (pip for Windows) and then\
  \ configured it in settings.py by adding it to INSTALLED_APPS and defining CRISPY_TEMPLATE_PACK\
  \ we wanted to use (in our case, bootstrap4). We then updated the SearchForm class\
  \ to use a FormHelper instance to control the attributes on the form and added a\
  \ submit button using the Submit class. Finally, we changed the search-results.html\
  \ template to use the crispy template tag to render the form, which allowed us to\
  \ remove the <form> element we were using before and simplify form generation by\
  \ moving all the form-related code into Python code (instead of it being partially\
  \ in HTML and partially in Python).\n\n\n\n\n除了让 Django 网站具有现代外观外，我们还需要一种方式为我们的网站提供既方便又受用户信任的认证标准。\n\
  \n## django-allauth\n\n浏览网站时，你可能见过一些按钮，允许你使用另一个网站的凭据登录——例如，使用你的 GitHub 账号登录：\n\n\
  ![](img/4840a43efd335abd10b93708225692d6_689_0.png)\n\n图 15.34 – 提供使用 Google 或 GitHub\
  \ 登录选项的登录表单\n\n在解释这一过程之前，先介绍我们将使用的术语：\n\n- **请求站点**：用户试图登录的站点。\n- **认证提供商**：用户进行认证的第三方提供商（例如\
  \ Google 或 GitHub）。\n- **认证应用：**由请求站点的创建者在认证提供商处设置的应用。它决定了请求站点将从认证提供商处获得哪些权限。例如，请求应用可以获取你的\
  \ GitHub 用户名，但没有权限写入你的仓库。用户可以通过禁用认证应用的访问权限，来阻止请求站点从认证提供商处获取你的信息。\n\n无论你选择哪种第三方登录选项，该过程通常都是相同的。首先，你将被重定向到认证提供商网站，并被要求授权认证应用访问你的账户（图\
  \ 15.35）：\n\n![](img/4840a43efd335abd10b93708225692d6_690_0.png)\n\n图 15.35 – 认证提供商授权屏幕\n\
  \n在授权认证应用之后，认证提供商会将你重定向回请求站点。你被重定向到的 URL 将包含一个秘密令牌，请求站点可以据此在后端请求你的用户信息。这使请求站点能够直接与认证提供商通信，以验证你的身份。使用令牌验证你的身份后，请求站点可以将你重定向到你的内容。该流程如图\
  \ 15.36 中的时序图所示：\n\n![](img/4840a43efd335abd10b93708225692d6_691_0.png)\n\n图 15.36\
  \ – 第三方认证流程\n\n现在我们已经介绍了如何使用第三方服务进行认证，接下来可以讨论 `django-allauth` 了。这个应用可以轻松地将你的 Django\
  \ 应用接入第三方认证服务，包括 Google、GitHub、Facebook 和 Twitter。事实上，在撰写本文时，`django-allauth` 已支持超过\
  \ 75 个认证提供商。\n\n当用户首次在你的站点进行认证时，`django-allauth` 会为你创建一个标准的 Django User 实例。它还知道如何解析最终用户授权认证应用后认证提供商加载的回调/重定向\
  \ URL。\n\n`django-allauth` 会向你的应用添加三个模型：\n\n- `SocialApplication`：用于存储标识你的认证应用所需的信息。你输入的信息取决于提供商，提供商将为你提供*客户端\
  \ ID*、*密钥*以及（可选）一个*键*。请注意，这些是 `django-allauth` 对这些值使用的名称，并且会因提供商而异。稍后我们会在本节中给出这些值的一些示例。`SocialApplication`\
  \ 是你唯一需要自行创建的 `django-allauth` 模型；当用户认证时，`django-allauth` 会自动创建其他模型。\n- `SocialApplicationToken`：包含向认证提供商标识\
  \ Django 用户所需的值。它包含一个*令牌*以及（可选）一个*令牌密钥*。它还包含对创建它的 `SocialApplication` 模型的引用，以及它所适用的\
  \ `SocialAccount` 模型的引用。\n- `SocialAccount`：将 Django 用户与提供商（例如 Google 或 GitHub）关联，并存储提供商可能提供的额外信息。\n\
  \n由于认证提供商非常多，我们不会逐一介绍如何设置它们，但会提供简短的设置说明，以及如何将来自提供商的认证令牌映射到 `SocialApplication` 中的正确字段。我们将以本章中一直提到的两个认证提供商——Google\
  \ 和 GitHub——为例进行说明。\n\n## django-allauth 的安装与设置\n\n与本章中的其他应用一样，`django-allauth`\
  \ 使用 pip3 安装：\n\n```\n```bash\npip3 install django-allauth\n```\n```\n\n> **注意**\n\
  > \n> 在 Windows 上，你可以使用 `pip` 代替上述命令中的 `pip3`。\n\n然后我们需要做一些设置更改。`django-allauth`\
  \ 需要 `django.contrib.sites` 应用才能运行，因此需要将其添加到 `INSTALLED_APPS` 中。然后，需要添加一个新设置，为我们的站点定义\
  \ `SITE_ID` 值。我们可以在 `settings.py` 文件中将其设置为 1：\n\n```\n```python\nINSTALLED_APPS\
  \ = [\n    \"bookr_admin.apps.BookrAdminConfig\",\n    \"django.contrib.sites\"\
  ,  # this entry added\n    \"django.contrib.auth\",\n    # The rest of the values\
  \ are truncated\n]\n\nSITE_ID = 1\n```\n```\n\n> **注意**\n> \n> 一个 Django 项目可以托管在多个主机名上，并在每个主机名上有不同的行为，同时也可以在所有站点之间共享内容。我们在项目中的其他地方不需要使用\
  \ `SITE_ID`，但必须在此处设置一个实例。你可以在 https://docs.djangoproject.com/en/3.0/ref/contrib/sites/\
  \ 阅读更多关于 `SITE_ID` 设置的信息。\n\n我们还需要将 `allauth` 和 `allauth.socialaccount` 添加到 `INSTALLED_APPS`：\n\
  \n```\n```python\nINSTALLED_APPS = [\n    # The rest of the values are truncated\n\
  \    \"allauth\",\n    \"allauth.socialaccount\",\n]\n```\n```\n\n然后，我们要支持的每个提供商也必须添加到\
  \ `INSTALLED_APPS` 列表中——例如，请看下面的代码片段：\n\n```\n```python\nINSTALLED_APPS = [\n  \
  \  # The rest of the values are truncated\n    \"allauth.socialaccount.providers.github\"\
  ,\n    \"allauth.socialaccount.providers.google\",\n]\n```\n```\n\n完成所有这些之后，我们需要运行\
  \ migrate 管理命令来创建 django-allauth 模型：\n\n```\npython3 manage.py migrate\n```\n\n\
  完成后，可以通过 Django 管理界面添加新的社交应用（图 15.37）：\n\n![](img/4840a43efd335abd10b93708225692d6_694_0.png)\n\
  \n图 15.37 – 添加社交应用\n\n要添加社交应用，请选择一个提供商（此列表只会显示 `INSTALLED_APPS` 列表中的提供商），输入名称（可以与提供商名称相同），并输入提供商网站上的客户端\
  \ ID（稍后我们将详细介绍）。你可能还需要一个密钥和一个键。选择应应用该密钥和键的站点。（如果你只有一个 Site 实例，那么其名称无关紧要——选择它即可。站点名称可以在\
  \ Django 管理的 Sites 部分中更新。你也可以在那里添加更多站点。）\n\n现在，我们来看看三个示例提供商所使用的令牌。\n\n## GitHub\
  \ 认证设置\n\n可以在你的 GitHub 个人资料下设置新的 GitHub 应用。在开发期间，应用的回调 URL 应设置为 http://127.0.0.1:8000/accounts/github/login/callback/，并在部署到生产环境时更新为真实主机名。创建应用后，它将提供客户端\
  \ ID 和客户端密钥。它们分别对应 django-allauth 中的客户端 ID 和密钥。\n\n## Google 认证设置\n\nGoogle 应用的创建通过你的\
  \ Google Developers 控制台完成。在开发期间，授权重定向 URI 应设置为 http://127.0.0.1:8000/accounts/google/login/callback/，并在生产部署后更新。应用的客户端\
  \ ID 在 django-allauth 中对应 Client id，应用的客户端密钥则对应 Secret key。\n\n## 使用 django-allauth\
  \ 发起认证\n\n要通过第三方提供商发起认证，你首先需要在 URL 映射中添加 django-allauth 的 URL。在某个 urls.py 文件的 urlpatterns\
  \ 中添加 allauth.urls：\n\n```\nurlpatterns = [path('allauth', include('allauth.urls')),]\n\
  ```\n\n然后，你将能够使用诸如 http://127.0.0.1:8000/allauth/github/login/?process=login、http://127.0.0.1:8000/allauth/google/login/?process=login\
  \ 之类的 URL 发起登录。django-allauth 将为你处理所有重定向，并在用户返回站点时创建/认证 Django 用户。你可以在登录页面上放置带有“使用\
  \ GitHub 登录”或“使用 Google 登录”等文字的按钮，这些按钮链接到上述 URL。\n\n## django-allauth 的其他功能\n\n\
  除了使用第三方提供商进行认证之外，django-allauth 还可以添加一些 Django 没有内置的有用功能。例如，你可以配置它要求用户提供电子邮件地址，并让用户通过点击收到的确认链接来验证其电子邮件地址，然后才能登录。django-allauth\
  \ 还可以处理生成用于密码重置的 URL，并通过电子邮件发送给用户。你可以在 https://django-allauth.readthedocs.io/en/stable/overview.html\
  \ 找到解释这些功能及更多内容的 django-allauth 文档。\n\n现在我们已经深入介绍了前四个第三方应用，并简要概述了 django-allauth，你可以开始本章的练习了。在这个练习中，我们将重构所使用的\
  \ ModelForm 实例，以便使用 CrispyFormHelper 类。\n\n\n\n\n\n## Activity 15.01 – 使用 FormHelper\
  \ 更新表单\n\n在本活动中，我们将更新 ModelForm 实例（PublisherForm、ReviewForm 和 BookMediaForm）以使用\
  \ crispy FormHelper 类。使用 FormHelper，我们可以在 Form 类本身内部定义提交按钮的文本。然后我们可以将 `<form>` 渲染逻辑从\
  \ instance-form.html 模板中移出，并用 crispy 模板标签替换它。\n\n以下步骤将帮助你完成活动：\n\n- 1. 创建一个 InstanceForm\
  \ 类，该类继承自 forms.ModelForm。这将成为现有 ModelForm 类的基础。\n- 2. 在 InstanceForm 的 `__init__`\
  \ 方法中，在 self 上设置一个 FormHelper 实例。\n- 3. 向 FormHelper 添加一个 Submit 按钮。如果表单是用 instance\
  \ 实例化的，则按钮文本应为 Save；否则，应为 Create。\n- 4. 将 PublisherForm、ReviewForm 和 BookMediaForm\
  \ 更新为从 InstanceForm 继承。\n- 5. 更新 instance-form.html 模板，使 `<form>` 使用 crispy 模板标签进行渲染。其余的\
  \ `<form>` 可以删除。\n- 6. 在 book_media 视图中，is_file_upload 上下文项不再需要。\n\n完成后，你应该会看到表单以\
  \ Bootstrap 主题呈现。图 15.38 显示了新建出版商页面：\n\n![](img/4840a43efd335abd10b93708225692d6_696_0.png)\n\
  \n图 15.38 – 新建出版商页面\n\n图 15.39 显示了新建评论页面：\n\n图 15.39 – 新建评论表单\n\n最后，图书媒体页面显示在图 15.40\
  \ 中：\n\n![](img/4840a43efd335abd10b93708225692d6_698_0.png)\n\n图 15.40 – 图书媒体页面\n\
  \n请注意，表单仍然可以正常工作并允许文件上传。django-crispy-forms 已自动向 `<form>` 添加了 `enctype=\"multipart/form-data\"\
  ` 属性。你可以通过查看页面源代码来验证这一点。\n\n### Note\n\n本活动的解决方案可在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions\
  \ 上找到。\n\n## Summary\n\n在本章中，我们介绍了五个可以增强网站的第三方 Django 应用。我们安装并设置了 `django-configurations`，它使我们能够轻松地在不同的设置之间切换并使用环境变量更改它们。`dj-database-url`\
  \ 也帮助了设置，使我们能够使用 URL 进行数据库设置更改。我们看到了 Django Debug Toolbar 如何帮助我们了解应用程序正在做什么并帮助我们调试问题。`django-crispy-forms`\
  \ 不仅可以使用 Bootstrap CSS 渲染我们的表单，还允许我们通过将行为定义为表单类本身的一部分来节省代码。我们简要查看了 `django-allauth`，并看到了它如何集成到第三方身份验证提供程序中。在本章的活动中，我们更新了\
  \ `ModelForm` 实例以使用 `django-crispy-forms FormHelper`，并通过使用 `crispy` 模板标签从模板中移除了一些逻辑。\n\
  \n在下一章中，我们将研究如何将 React JavaScript 框架集成到 Django 应用程序中。\n"
- "## Using a Frontend JavaScript Library with Django\n\nDjango 是构建应用程序后端的绝佳工具。你已经看到设置数据库、路由\
  \ URL 和渲染模板是多么容易。然而，如果不使用 JavaScript，这些页面在渲染到浏览器后是静态的，不提供任何交互形式。通过使用 JavaScript，你的页面可以转变为在浏览器中完全交互的应用程序。\n\
  \n本章将简要介绍 JavaScript 框架以及如何将其与 Django 一起使用。虽然它不会深入探讨如何从头开始构建整个 JavaScript 应用程序（那本身就是一本书），但我们将提供足够的介绍，以便你可以在自己的\
  \ Django 应用程序中添加交互组件。本章中，我们主要使用 React 框架。即使你没有任何 JavaScript 经验，我们也会介绍足够的内容，以便你在本章结束时能够舒适地编写自己的\
  \ React 组件。在第 12 章《Building a REST API》中，你为 Bookr 构建了一个 REST API。我们将使用 JavaScript\
  \ 与该 API 交互以检索数据。我们将通过在主页面上动态加载并可以分页浏览的评论预览来增强 Bookr。\n\n### Technical requirements\n\
  \n本章练习和活动的代码可以在本书的 GitHub 仓库中找到，地址为 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter16。\n\
  \n### JavaScript frameworks\n\n如今，实时交互是 Web 应用程序的基本组成部分。虽然可以在没有框架的情况下添加简单的交互（不使用框架开发通常称为\
  \ *Vanilla JS*），但随着 Web 应用程序的增长，使用框架可以更轻松地管理。没有框架，你需要自己完成以下所有事情：\n\n- 手动定义数据库模式\n\
  - 将 HTTP 请求中的数据转换为原生对象\n- 编写表单验证\n- 编写 SQL 查询以保存数据\n- 构造 HTML 以显示响应\n\n将其与 Django\
  \ 提供的功能进行比较。它的 **对象关系映射（ORM）**、自动表单解析和验证以及模板化大幅减少了你需要编写的代码量。JavaScript 框架为 JavaScript\
  \ 开发带来了类似的节省时间的增强功能。没有它们，你必须手动更新浏览器中 HTML 元素以反映数据变化。让我们举一个简单的例子：显示按钮被点击次数的计数。没有框架，你需要做以下操作：\n\
  \n- 1. 为按钮点击事件分配一个处理器。\n- 2. 增加存储计数的变量。\n- 3. 定位包含点击计数显示的元素。\n- 4. 用新的点击计数替换元素的文本。\n\
  \n使用框架时，按钮计数变量绑定到显示（HTML），因此你需要编写的过程如下：\n\n- 1. 处理按钮点击。\n- 2. 增加变量。\n\n框架负责自动重新渲染数字显示。这只是一个简单的例子；随着应用程序的增长，两种方法之间的复杂性差异会扩大。有多个\
  \ JavaScript 框架可用，每个框架都有不同的功能，其中一些得到大型公司的支持和使用。一些最受欢迎的是 React（https://reactjs.org）、Vue（http://vuejs.org）、Angular（https://angularjs.org）、Ember（https://emberjs.com）和\
  \ Backbone.js（https://backbonejs.org）。\n\n在本章中，我们将使用 React，因为它很容易集成到现有的 Web 应用程序中，并且允许\
  \ *渐进增强*。这意味着你不必从头开始构建针对 React 的应用程序，而是可以简单地将其应用于 Django 生成的 HTML 的某些部分；例如，一个自动解释\
  \ Markdown 并在不重新加载页面的情况下显示结果的单个文本字段。我们还将介绍 Django 提供的一些功能，这些功能可以帮助集成多个 JavaScript\
  \ 框架。\n\n可以有多个不同级别的 JavaScript 集成到 Web 应用程序中。*图 16.1* 显示了我们当前没有任何 JavaScript 的技术栈（请注意，以下图表未显示对服务器的请求）：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_703_0.png)\n\n图 16.1 – 当前技术栈\n\n你可以使用\
  \ *Node.js*（服务器端 JavaScript 解释器）基于 JavaScript 构建整个应用程序，这将取代技术栈中的 Python 和 Django。*图\
  \ 16.2* 显示了它可能的样子：\n\n![](img/4840a43efd335abd10b93708225692d6_703_1.png)\n\n图 16.2\
  \ – 使用 Node.js 生成 HTML\n\n或者，你可以将前端和模板完全放在 JavaScript 中，只使用 Django 作为 REST API 为渲染提供数据。*图\
  \ 16.3* 显示了这种技术栈：\n\n![](img/4840a43efd335abd10b93708225692d6_703_2.png)\n\n图 16.3\
  \ – 从 Django 发送 JSON 并在浏览器中渲染\n\n\n\n\n\n最终的方法是渐进增强，这正是（正如前面提到的）我们将使用的方法。这样，Django\
  \ 仍然在生成 HTML 模板，而 React 则在此之上添加交互性：\n\n![](img/4840a43efd335abd10b93708225692d6_704_0.png)\n\
  \n图 16.4 – 使用 Django 生成的 HTML，并由 React 提供渐进增强\n\n请注意，通常会将多种技术组合使用。例如，Django 可能生成初始\
  \ HTML，然后在浏览器中应用 React。浏览器随后可以向 Django 查询 JSON 数据，以便使用 React 进行渲染。\n\n为了理解这些方法，我们将首先简要了解一下如何在\
  \ Web 应用程序中使用 JavaScript。\n\n## JavaScript 简介\n\n在本节中，我们将简要介绍一些基本的 JavaScript 概念。这包括变量、常量、数组和对象等数据结构，以及函数、类和方法等可调用对象。不同的运算符将在介绍时进行讲解。\n\
  \n这将为我们提供必要的知识，以便开始简要概述 React 框架。\n\n## 加载 JavaScript\n\nJavaScript 可以内联在 HTML 页面中，也可以包含在单独的\
  \ JavaScript 文件中。这两种方法都使用 <script> 标签。对于内联 JavaScript，JavaScript 代码直接写在 HTML 文件中的\
  \ <script> 标签内；例如，像这样：\n\n```\n<script>\n// comments in JavaScript can start with\
  \ //\n/* Block comments are also supported. This comment is\n   multiple lines and\
  \ doesn't end until we use a star then\n   slash:/\nlet a = 5; // declare the variable\
  \ a, and set its value to 5\nconsole.log(a); // print a (5) to the browser console\n\
  </script>\n```\n\n请注意，console.log 函数会将数据打印到浏览器控制台，该控制台可在浏览器开发者工具中看到：\n\n![](img/4840a43efd335abd10b93708225692d6_705_0.png)\n\
  \n图 16.5 – console.log(a) 调用的结果 – 5 被打印到浏览器控制台\n\n我们也可以将代码放入自己的文件中（在独立文件中不包含 <script>\
  \ 标签）。然后使用 <script> 标签的 src 属性将其加载到页面中，正如我们在第 5 章《提供静态文件》中看到的那样：\n\n```\n<script\
  \ src=\"{% static 'file.js' %}\"></script>\n```\n\n无论是内联还是包含，源代码在浏览器加载 <script>\
  \ 标签时就会立即执行。\n\n## 变量和常量\n\n与 Python 不同，JavaScript 中的变量必须使用 var、let 或 const 关键字声明：\n\
  \n```\nvar a = 1; // variable a has the numeric value 1\nlet b = 'a'; // variable\
  \ b has the string value 'a'\nconst pi = 3.14; // assigned as a constant and can't\
  \ be redefined\n```\n\n不过，与 Python 类似，变量的类型无需声明。你会注意到行尾有分号。JavaScript 不要求行以分号结尾——它们是可选的。然而，一些风格指南强制要求使用它们。你应该为任何项目坚持使用一种约定。\n\
  \n你应该使用 let 关键字来声明变量。变量声明是有作用域的。例如，在 for 循环内部使用 let 声明的变量在循环外部不会被定义。在此示例中，我们将循环遍历\
  \ 10 到 90 的倍数并求和，然后将结果打印到 console.log。你会注意到我们可以访问在函数级别声明的变量，而在 for 循环内部则不能反向访问：\n\
  \n```\nlet total = 0;\nfor (let i=0; i< 10; i++) { // variable i is scoped to the\
  \ loop\n    let toAdd = i * 10; // variable toAdd is also scoped\ntotal += toAdd;\
  \ /* we can access total since it's in\nthe outer scope */\n```\n\n```\n}\nconsole.log(total);\
  \ // prints 450\nconsole.log(toAdd); /* throws an exception as the variable is not\
  \ declared in the outer scope */\nconsole.log(i); /* this code is not executed since\
  \ an exception was thrown the line before, but it would also generate the same exception\
  \ */\n```\n\nconst 用于常量数据，不能重新定义。但这并不意味着它指向的对象不能被更改。例如，你不能这样做：\n\n```\nconst pi\
  \ = 3.1416;\npi = 3.1; /* raises exception since const values can't be reassigned\
  \ */\n```\n\nvar 关键字是旧浏览器所必需的，这些浏览器不支持 let 或 const。如今只有 1% 的浏览器不支持这些关键字，因此在整章的其余部分，我们只会使用\
  \ let 或 const。与 let 类似，使用 var 声明的变量可以重新赋值；但是，它们的范围仅限于函数级别。\n\nJavaScript 支持多种类型的变量，包括字符串、数组、对象（类似于字典）和数字。我们现在将在各自的章节中介绍数组和对象。\n\
  \n## 数组\n\n数组的定义方式与 Python 类似，使用方括号。它们可以包含不同类型的数据，就像 Python 一样：\n\n```\nconst myThings\
  \ = [1, 'foo', 4.5];\n```\n\n关于 const 的另一个需要注意的地方是，它阻止重新分配常量，但不阻止更改常量指向的变量或对象。例如，我们不允许这样做：\n\
  \n```\nmyThings = [1, 'foo', 4.5, 'another value'];\n```\n\n然而，你可以通过使用 push 方法（类似于\
  \ Python 的 list.append）来追加新项目，从而更新 myThings 数组的内容：\n\n```\nmyThings.push('another\
  \ value');\n```\n\n## 对象\n\nJavaScript 对象类似于 Python 字典，提供键值存储。声明它们的语法也类似：\n\n```\n\
  const o = {foo: 'bar', baz: 4};\n```\n\n请注意，与 Python 不同，JavaScript 对象/字典键在创建时不需要加引号——除非它们包含特殊字符（空格、连字符、点等）。\n\
  \no 中的值可以通过项目访问或属性访问来获取：\n\n```\no.foo; // 'bar'\no['baz']; // 4\n```\n\n另请注意，由于\
  \ o 被声明为常量，我们不能重新分配它，但可以更改对象的属性：\n\n```\no.anotherKey = 'another value'  // this\
  \ is allowed\n```\n\n## 函数\n\n在 JavaScript 中定义函数有几种不同的方法。我们将介绍三种。你可以使用 function\
  \ 关键字定义它们：\n\n```\nfunction myFunc(a, b, c) {\n    if (a == b)\n        return c;\n\
  \    else if (a > b)\n        return 0;\n    return 1;\n}\n```\n\nJavaScript 中函数的所有参数都是可选的；也就是说，你可以像这样调用前面的函数：myFunc()，也不会引发错误（至少在调用时）。a、b\
  \ 和 c 变量都将是 undefined 特殊类型。这会在函数的逻辑中造成问题。undefined 特殊类型有点像 Python 中的 None——尽管 JavaScript\
  \ 也有 null，它更类似于 None。函数也可以通过将其分配给变量（或常量）来定义：\n\n```\nconst myFunc = function(a,\
  \ b, c) {\n    // function body is implemented the same as above\n}\n```\n\n我们还可以使用箭头语法定义函数。例如，我们也可以这样定义\
  \ myFunc：\n\n```\nconst myFunc = (a, b, c) => {\n    // function body as above\n\
  }\n```\n\n当在对象的一部分中定义函数时，这更为常见，例如：\n\n```\nconst o = {\nmyFunc: (a, b, c) => {\n\
  \    // function body\n}\n}\n```\n\n在这种情况下，它将像这样调用：\n\n```\no.myFunc(3, 4, 5);\n\
  ```\n\n在介绍类之后，我们将回到使用箭头函数的理由。\n\n## 类和方法\n\n类使用 class 关键字定义。在类定义内部，方法是在不使用 function\
  \ 关键字的情况下定义的。JavaScript 解释器可以识别语法并判断它是一个方法。以下是一个示例类，它在实例化时接受一个要添加的数字（通过 toAdd）。该数字将添加到传递给\
  \ add 方法的任何内容中，并返回结果：\n\n```\nclass Adder {\n    // A class to add a certain value\
  \ to any number\n\n    // this is like Python's init method\n    constructor (toAdd)\
  \ {\n        /* \"this\" is like \"self\" in Python\n           it's implicit and\
  \ not manually passed into every\n           method */\n        this.toAdd = toAdd;\n\
  \    }\n\n    add (n) {\n        // add our instance's value to the passed in number\n\
  \        return this.toAdd + n;\n    }\n}\n```\n\n\n\n\n```\nconsole.log(this);\
  \  // also refers to o2\n}\n    inner();\n}\n}\n```\n\n当我们使用箭头语法时，`this` 在两种情况下都保持一致并指向\
  \ o2。现在我们对 JavaScript 有了非常简短的介绍，让我们介绍 React。\n\n## Further reading\n\n涵盖 JavaScript\
  \ 的所有概念超出了本书的范围。想要一门完整的、实践性的 JavaScript 课程，你可以随时参考《The JavaScript Workshop》书籍：https://courses.packtpub.com/courses/javascript。\n\
  \n在完成对核心 JavaScript 编程概念的简要回顾后，我们将开始对 React 编程进行简要概述。\n\n## Working with React\n\
  \nReact 允许你使用组件构建应用程序。每个组件都可以通过生成要插入页面的 HTML 来自行渲染。\n\n组件还可以跟踪其自己的状态。如果它确实跟踪自己的状态，当状态发生变化时，组件将自动重新渲染自身。这意味着如果你有一个操作方法更新组件上的状态变量，你就不需要再判断组件是否需要重绘；React\
  \ 会为你完成。Web 应用应跟踪其自己的状态，这样它就不需要查询服务器来了解如何更新以显示数据。\n\n数据通过属性，即 props 在组件之间传递。传递属性的方法看起来有点像\
  \ HTML 属性，但有一些差异，我们将在本章后面介绍。属性以单个 props 对象形式接收。\n\n举例说明，你可能会用 React 构建一个购物清单应用。你将有一个用于列表容器的组件（ListContainer），以及一个用于列表项的组件（ListItem）。ListItem\
  \ 将被实例化多次，每次对应购物清单上的一个项目。容器将保存一个包含项目名称列表的状态。每个项目名称将作为 prop 传递给 ListItem 实例。每个 ListItem\
  \ 然后在其自己的状态中存储项目名称和一个 isBought 标志。当你点击一个项目将其标记为已完成时，isBought 将被设置为 true。然后，React\
  \ 会自动调用 ListItem 的 render 来更新显示。\n\n有几种不同的方法可以在你的应用程序中使用 React。如果你想构建一个深度和复杂的 React\
  \ 应用程序，你应该使用 npm（Node Package Manager，Node.js 应用程序的管理工具）来设置 React 项目。由于我们将使用 React\
  \ 来增强一些页面，我们只需使用 `<script>` 标签包含 React 框架代码即可：\n\n```\n<script crossorigin\nsrc=\"\
  https://unpkg.com/react@16/umd/react.development.js\">\n</script>\n<script crossorigin\n\
  src=\"https://unpkg.com/react-dom@16/umd/react-dom.development.js\">\n</script>\n\
  ```\n\n> **Note**\n> `crossorigin` 属性是为了安全，意味着 cookie 或其他数据不能发送到远程服务器。当使用 unpkg.com\
  \ 等公共内容分发网络（CDN）时这是必要的，以防有人在那里托管了恶意脚本。\n\n这些应该放在你想要添加 React 的页面上，放在结束的 `</body>`\
  \ 标签之前。将标签放在这里而不是页面的 `<head>` 中的原因是脚本可能想要引用页面上的 HTML 元素。如果我们将 `<script>` 标签放在 head\
  \ 中，它将在页面元素可用之前执行（因为它们在后面）。\n\n> **Note**\n> 最新 React 版本的链接可以在 https://legacy.reactjs.org/docs/cdn-links.html\
  \ 找到。\n\n## Components\n\n在 React 中构建组件有两种方式：使用函数或使用类。无论采用哪种方法，要在页面上显示，组件必须返回一些要显示的\
  \ HTML 元素。函数式组件是返回元素的单个函数，而基于类的组件将从其 render 方法返回元素。函数式组件无法跟踪自己的状态。\n\nReact 与 Django\
  \ 类似，它会自动转义从 render 返回的字符串中的 HTML。要生成 HTML 元素，必须使用它们的标签、它们应具有的属性/属性以及其内容来构造它们。这是通过\
  \ `React.createElement` 函数完成的。组件将返回一个 React 元素，其中可能包含子元素。\n\n让我们看一下同一个组件的两种实现，首先是函数，然后是类。函数式组件将\
  \ props 作为参数。这是一个包含传递给它的属性的对象。以下函数返回一个 h1 元素：\n\n```\nfunction HelloWorld(props)\
  \ {\nreturn React.createElement('h1', null, 'Hello, ' +\n    props.name + '!' );\n\
  }\n```\n\n请注意，函数以大写字母开头是惯例。\n\n虽然函数式组件是生成 HTML 的单个函数，但基于类的组件必须实现 render 方法来执行此操作。render\
  \ 方法中的代码与函数式组件中的代码相同，只有一个区别：基于类的组件在其构造函数中接受 props 对象，然后 render（或其他）方法可以使用 `this.props`\
  \ 引用 props。以下是作为类实现的相同 HelloWorld 组件：\n\n```\nclass HelloWorld extends React.Component\
  \ {\nrender() {\nreturn React.createElement('h1', null, 'Hello, ' +\n    this.props.name\
  \ + '!');\n}\n}\n```\n\n使用类时，所有组件都从 `React.Component` 类扩展。基于类的组件相对于函数式组件的一个优势是；它们封装了操作/事件的处理以及它们自己的状态。对于简单的组件，使用函数式风格意味着更少的代码。有关组件和属性的更多信息，请参阅\
  \ https://reactjs.org/docs/components-and-props.html。\n\n无论你选择哪种方法来定义组件，使用方式都相同。在本章中，我们将只使用基于类的组件。\n\
  \n我们首先需要在 HTML 页面上为 React 渲染此组件添加一个位置。通常，这使用带有 `id` 属性的 `<div>` 来完成。以下是此示例：\n\n\
  ```\n<div id=\"react_container\"></div>\n```\n\n请注意，`id` 不必是 `react_container`；它只需要对页面唯一即可。然后，在\
  \ JavaScript 代码中，在定义所有组件之后，它们使用 `ReactDOM.render` 函数渲染到页面上。此函数接受两个参数：根 React 元素（不是组件）和应渲染它的\
  \ HTML 元素。\n\n我们会这样使用它：\n\n```\nconst container = document.getElementById('react_container');\n\
  const componentElement = React.createElement(HelloWorld,\n    {name: 'Ben'});\n\
  ReactDOM.render(componentElement, container);\n```\n\n请注意，传递给 render 函数的不是 HelloWorld\
  \ 组件（类/函数）本身；它被包装在 `React.createElement` 调用中以实例化它并将其转换为元素。\n\n正如你可能从其名称猜到的那样，`document.getElementById`\
  \ 函数在文档中定位一个 HTML 元素并返回对其的引用。\n\n组件渲染后浏览器中的最终输出如下：\n\n```\n<h1>Hello, Ben!</h1>\n\
  ```\n\n让我们看一个更高级的示例组件。请注意，由于 `React.createElement` 是一个常用函数，通常会将其别名为更短的名称，例如 `e`：这就是此示例第一行所做的。\n\
  \n此组件显示一个按钮，并有一个内部状态来跟踪按钮被点击的次数。首先，让我们完整地查看组件类：\n\n```\nconst e = React.createElement;\n\
  \nclass ClickCounter extends React.Component {\n  constructor(props) {\n    super(props);\n\
  \    this.state = { clickCount: 0 };\n  }\n\n  render() {\n    return e(\n     \
  \ 'button',  // the element name\n      {onClick: () => this.setState({\n      \
  \  clickCount: this.state.clickCount + 1 }) }, // element props\n      this.state.clickCount\
  \  // element content\n    );\n  }\n}\n```\n\n关于 `ClickCounter` 类需要注意的一些事项如下：\n\n\
  - props 参数是一个对象（字典），其中包含在使用 HTML 中使用组件时传递给组件的属性值，如下所示：\n\n  ```\n  <ClickCounter\
  \ foo=\"bar\" rex=\"baz\"/>\n  ```\n\n  props 字典将包含键 `foo`，值为 `bar`，以及键 `rex`，值为\
  \ `baz`。\n\n\n\n\n\n+   - `super(props)` 调用父类的构造函数方法并传递 props 变量。这与 Python 中的 `super()`\
  \ 方法类似。\n+   - 每个 React 类都有一个 state 变量，它是一个对象。`constructor` 可以初始化它。state 应该使用 `setState`\
  \ 方法进行更改，而不是直接操作。当它被更改时，`render` 方法会被自动调用以重绘组件。\n\n`render` 方法使用 `React.createElement`\
  \ 函数返回一个新的 HTML 元素（记住，变量 e 已别名为此函数）。在这种情况下，React.createElement 的参数将返回一个带有点击处理程序且文本内容为\
  \ `this.state.clickCount` 的 <button> 元素。基本上，它将返回如下元素（当 clickCount 为 0 时）：\n\n```\n\
  <button onClick=\"this.setState(...)\">\n  0\n</button>\n```\n\nonClick 函数被设置为使用箭头语法创建的匿名函数。这类似于以下函数（尽管并不完全相同，因为上下文不同）：\n\
  \n```\nconst onClick = () => {\n  this.setState({clickCount: this.state.clickCount\
  \ + 1})\n}\n```\n\n由于函数只有一行，我们还可以去掉一层包装大括号，最终得到如下结果：\n\n```\n{ onClick: () => this.setState({\n\
  \    clickCount: this.state.clickCount + 1}) }\n```\n\n我们之前在本节中介绍过如何将 ClickCounter\
  \ 放置到页面上，大致如下：\n\n```\nReactDOM.render(e(ClickCounter),\n  document.getElementById('react_container'));\n\
  ```\n\n下面的截图显示了页面加载时按钮中的计数器：\n\n此外，DjDt 指的是我们在第 15 章《Django 第三方库》Django Debug Toolbar\
  \ 部分学到的调试工具栏：\n\n![](img/4840a43efd335abd10b93708225692d6_715_0.png)\n\n图 16.6 –\
  \ 计数为 0 的按钮\n\n点击按钮几次后，按钮看起来如 *图 16.7* 所示：\n\n![](img/4840a43efd335abd10b93708225692d6_715_1.png)\n\
  \n图 16.7 – 点击七次后的按钮\n\n现在，为了演示如何*不*编写 render 函数，我们来看一下如果直接将 HTML 作为字符串返回会发生什么，如下所示：\n\
  \n```\n```javascript\nrender() {\n    return '<button>' + this.state.clickCount\
  \ + '</button>'\n}\n```\n```\n\n现在渲染的页面看起来如 *图 16.8* 所示：\n\n![](img/4840a43efd335abd10b93708225692d6_715_2.png)\n\
  \n图 16.8 – 作为字符串返回的 HTML\n\n这展示了 React 自动转义 HTML 的功能。现在我们对 JavaScript 和 React 有了简要介绍，让我们在\
  \ Bookr 中添加一个示例页面，以便你可以看到它实际运行的效果。\n\n## 练习 16.01 – 设置 React 示例\n\n在本练习中，我们将创建一个示例视图和模板与\
  \ React 一起使用。然后我们将实现 ClickCounter 组件。练习结束时，你将能够使用 ClickCounter 按钮与之交互：\n\n+   1.\
  \ 在 PyCharm 中，进入项目 static 目录下的 New | File。命名新文件为 react-example.js。\n\n+   2. 将此代码放入其中将定义\
  \ React 组件，然后将其渲染到我们将要创建的 react_container <div> 中：\n\n```\nconst e = React.createElement;\n\
  \nclass ClickCounter extends React.Component {\n    constructor(props) {\n     \
  \   super(props);\n        this.state = { clickCount: 0 };\n    }\n\n    render()\
  \ {\n        return e(\n            'button', { onClick: () => this.setState({\n\
  \                clickCount: this.state.clickCount + 1\n            })}\n      \
  \      ,\n            this.state.clickCount\n        );\n    }\n}\n\nReactDOM.render(e(ClickCounter),\n\
  \    document.getElementById('react_container'));\n```\n\n现在可以保存 react-example.js。\n\
  \n+   3. 进入项目 templates 目录下的 **New | HTML File**：\n\n![](img/4840a43efd335abd10b93708225692d6_717_0.png)\n\
  \n图 16.9 – 创建一个新的 HTML 文件\n\n+   4. 将新文件命名为 `react-example.html`：\n\n![](img/4840a43efd335abd10b93708225692d6_717_1.png)\n\
  \n图 16.10 – 将文件命名为 react-example.html\n\n你可以更改 `<title>` 元素中的标题为 *React Example*，但这对本练习不是必需的。\n\
  \n+   5. `react-example.html` 会像我们之前看到的那样创建一些 HTML 骨架。在关闭 `</body>` 标签之前添加以下 `<script>`\
  \ 标签以包含 React：\n\n```\n```html\n<script crossorigin\nsrc=\"https://unpkg.com/react@16/umd/react.development.js\"\
  >\n</script>\n<script crossorigin src=\"https://unpkg.com/\nreact-dom@16/umd/react-dom.development.js\"\
  ></script>\n```\n```\n\n6. react-example.js 文件将使用 <script> 标签包含，我们需要使用 static 模板标签生成脚本路径。首先在文件开头加载\
  \ static 模板库，在第二行添加以下内容：\n\n```\n{% load static %}\n```\n\n文件的开头几行将如下图 16.11 所示：\n\
  \n```\n<!DOCTYPE html>\n{% load static %}\n<html lang=\"en\">\n<head>\n```\n\n图\
  \ 16.11 – 包含的 load static 模板标签\n\n然后，在关闭 </body> 标签之前，但在步骤 5 中添加的 <script> 标签之后，添加此脚本标签以包含\
  \ react-example.js：\n\n```\n<script src=\"{% static 'react-example.js' %}\"></script>\n\
  ```\n\n7. 我们现在需要添加 React 将要渲染到的包含 <div>。在打开的 <body> 标签后添加此元素：\n\n```\n<div id=\"\
  react_container\"></div>\n```\n\n你可以保存 react-example.html。\n\n8. 现在我们将添加一个视图来渲染模板。打开\
  \ reviews 应用的 views.py 文件并在文件末尾添加 react_example 视图：\n\n```\ndef react_example(request):\n\
  \    return render(request, \"react-example.html\")\n```\n\n在这个简单的视图中，我们只需渲染 react-example.html\
  \ 模板，不带任何上下文数据。\n\n9. 最后，我们需要将 URL 映射到新视图。打开 bookr 包的 urls.py 文件。将此映射添加到 urlpatterns\
  \ 变量中：\n\n```\npath('react-example/',\n    reviews.views.react_example)\n```\n\n\
  你可以保存并关闭 urls.py。\n\n10. 如果尚未运行，请启动 Django 开发服务器，然后访问 http://127.0.0.1:8000/react-example/。你应该会看到如\
  \ 图 16.12 所示的 ClickCount 按钮被渲染：\n\n![](img/4840a43efd335abd10b93708225692d6_719_0.png)\n\
  \n图 16.12 – ClickCount 按钮\n\n尝试点击按钮几次并观察计数器的递增。\n\n在这个示例中，我们创建了第一个 React 组件，然后添加了一个模板和视图来渲染它。我们从\
  \ CDN 包含了 React 框架源代码。在下一节中，我们将介绍 JavaScript XML（JSX），它将模板和代码组合到单个文件中，可以简化我们的代码。\n\
  \n## JSX – 一种 JavaScript 语法扩展\n\n使用 React.createElement 函数定义每个元素可能非常冗长——即使我们将其别名为更短的变量名。当我们开始构建更大的组件时，这种冗长会加剧。\n\
  \n在使用 React 时，我们可以使用 JSX 来构建 HTML 元素。JSX 代表 JavaScript XML，因为 JavaScript 和 XML 都写在同一个文件中。例如，考虑以下使用\
  \ render 方法创建按钮的代码：\n\n```\nreturn React.createElement('button', { onClick: ...\
  \ },\n  'Button Text')\n```\n\n与其这样，我们可以直接返回其 HTML，如下所示：\n\n```\nreturn <button\
  \ onClick={...}>Button Text</button>; \n```\n\n请注意 HTML 未被引用并且未作为字符串返回。那就是，我们不是这样做的：\n\
  \n```\nreturn '<button onClick={...}>Button Text</button>';\n```\n\n由于 JSX 是一种不寻常的语法（HTML\
  \ 和 JavaScript 在单个文件中的组合），我们需要在使用它之前包含另一个 JavaScript 库：Babel（https://babeljs.io）。这是一个可以在不同版本的\
  \ JavaScript 之间转译代码的库。你可以使用最新语法编写代码，并让它转译（翻译和编译的组合）为旧浏览器可以理解的代码版本。\n\nBabel 可以像这样使用\
  \ <script> 标签包含：\n\n```\n<script crossorigin\nsrc=\"https://unpkg.com/babel-standalone@6/babel.min.js\"\
  ></script>\n```\n\n这应该在页面上包含在其他 React 相关脚本标签之后，但在包含任何包含 JSX 的文件之前。\n\n任何包含 JSX 的\
  \ JavaScript 源代码都必须添加 type=\"text/babel\" 属性：\n\n```\n<script src=\"path/to/file.js\"\
  \ type=\"text/babel\"></script>\n```\n\n这样 Babel 就知道要解析该文件而不是将其视为纯 JavaScript。\n\
  \n> **注意**\n> \n> 以这种方式使用 Babel 对于大型项目来说可能很慢。它旨在作为 npm 项目构建过程的一部分使用，并提前转译你的 JSX\
  \ 文件（而不是像我们在这里这样实时转译）。npm 项目设置超出了本书的范围。对于我们的目的和我们使用的少量 JSX，使用 Babel 是可以的。\n\nJSX\
  \ 使用大括号在 HTML 中包含 JavaScript 数据，类似于 Django 模板中的双大括号。大括号内的 JavaScript 将被执行。我们现在来看如何将按钮创建示例转换为\
  \ JSX。我们的 render 方法可以更改为如下：\n\n```\nrender() {\n    return <button onClick={() =>this.setState({\n\
  \        clickCount: this.state.clickCount + 1\n    })>\n        {this.state.clickCount}\n\
  \    </button>;\n}\n```\n\n请注意 onClick 属性的值周围没有引号；相反，它被大括号包围。这是将内联定义的 JavaScript\
  \ 函数传递给组件。它将在传递给构造函数方法的该组件的 props 字典中可用。例如，想象一下我们是这样传递它的：\n\n```\nonClick=\"() =>this.setState...\"\
  \n```\n\n\n\n在这种情况下，它会作为字符串值传递给组件，因此无法正常工作。\n\n我们还在按钮的内容中渲染`clickCount`的当前值。这些花括号内也可以执行JavaScript。要显示点击次数加一，我们可以这样做：\n\
  \n```jsx\n{this.state.clickCount + 1}\n```\n\n在下一个练习中，我们将在模板中加入Babel，然后把组件转换为使用JSX。\n\
  \n## 练习16.02 – JSX与Babel\n\n在本练习中，我们将在组件中实现JSX来简化代码。为此，我们需要对`react-example.js`和`react-example.html`文件做一些修改，以便改用JSX来渲染`ClickCounter`：\n\
  \n- 1. 在PyCharm中，打开`react-example.js`，把render方法替换为以下代码，以改用JSX。你可以参考*练习16.01 – 设置React示例*中的*第2步*，我们在那里定义了这个方法：\n\
  \n```javascript\nrender() {\n    return <button onClick={() => this.setState({\n\
  \        clickCount: this.state.clickCount + 1\n    })}>\n        {this.state.clickCount}\n\
  \    </button>;\n}\n```\n\n- 2. 现在我们可以把`ClickCounter`本身当作一个元素。在文件末尾的`ReactDOM.render`调用中，你可以将第一个参数`e(ClickCounter)`替换为`<ClickCounter/>`元素，如下所示：\n\
  \n```javascript\nReactDOM.render(<ClickCounter/>,\n    document.getElementById('react_container'));\n\
  ```\n\n- 3. 由于我们不再使用在*练习16.01 – 设置React示例*的*第2步*中创建的`React.create`函数，我们可以删除创建的那个别名，即删掉第一行：\n\
  \n```javascript\nconst e = React.createElement;\n```\n\n你可以保存并关闭文件。\n\n- 4. 打开react-example.html模板。你需要包含Babel库的JavaScript。将这段代码添加到React脚本元素和react-example.js元素之间：\n\
  \n```\n<script crossorigin\nsrc=\"https://unpkg.com/babelstandalone@6/babel.min.js\"\
  >\n</script>\n```\n\n- 5. 为react-example.html的`<script>`标签添加`type=\"text/babel\"\
  `属性：\n\n```\n<script src=\"{% static 'react-example.js' %}\"\ntype=\"text/babel\"\
  ></script>\n```\n\n保存react-example.html。\n\n- 6. 启动Django开发服务器（如果尚未运行），然后访问http://127.0.0.1:8000/react-example/。你应该能看到和之前一样的按钮（图16.12）。点击按钮时，你应该也能看到计数递增。\n\
  \n在本练习中，我们没有改变ClickCounter React组件的行为。相反，我们重构它以使用JSX。这样可以更轻松地将组件的输出直接写成HTML，并减少我们需要编写的代码量。在下一节中，我们将了解如何向JSX\
  \ React组件传递属性。\n\n## JSX属性\n\n基于JSX的React组件的属性设置方式与标准HTML元素上的属性相同。需要记住的重要一点是：你要将它们设置为字符串还是JavaScript值。\n\
  \n让我们来看看一些使用ClickCounter组件的示例。假设我们想扩展ClickCounter，使其能够指定一个目标数字。当达到目标时，按钮应替换为“干得好，<name>!”文本。这些值应作为属性传入ClickCounter。\n\
  \n当使用变量时，我们必须将它们作为JSX值传递：\n\n```\nlet name = 'Ben'\nlet target = 5;\n\nReactDOM.render(\n\
  \  <ClickCounter name={name} target={target}/>\n  document.getElementById('react_container'));\n\
  ```\n\n我们也可以混合使用传递值的方式。以下也是有效的：\n\n```\nReactDOM.render(<ClickCounter name=\"Ben\"\
  \ target={5}/>, document.getElementById('react_container'));\n```\n\n在下一个练习中，我们将更新ClickCounter，使其从属性中读取这些值，并在达到目标时改变其行为。我们将从Django模板中传入这些值。\n\
  \n## 练习16.03 – React组件属性\n\n在本练习中，我们将修改ClickCounter，使其从props中读取target和name的值。我们将从Django视图中传入这些值，并使用escapejs过滤器使name值在JavaScript字符串中安全使用。完成后，你将能够点击按钮，直到达到目标，然后看到“干得好”消息。让我们开始吧：\n\
  \n- 1. 在PyCharm中，打开reviews应用的views.py。我们将修改react_example视图的render调用，以传入包含name和target的上下文，如下所示：\n\
  \n```\nreturn render(request, \"react-example.html\", {\"name\": \"Ben\", \"target\"\
  : 5})\n```\n\n如果你愿意，可以使用自己的名字并选择不同的目标值。保存views.py。\n\n- 2. 打开react-example.js文件。我们将更新constructor方法中的状态设置，以从props中设置name和target，如下所示：\n\
  \n```\nconstructor(props) {\n  super(props);\n  this.state = { clickCount: 0, name:\
  \ props.name, target: props.target};\n}\n```\n\n- 3. 修改render方法的行为，使其在达到目标后返回“干得好，<name>!”。在render方法中添加这个if语句：\n\
  \n```\nif (this.state.clickCount === this.state.target) {\n  return <span>Well done,\
  \ {this.state.name}!</span>;\n}\n```\n\n- 4. 为了传入这些值，将ReactDOM.render调用移到模板中，以便Django可以渲染那段代码。从react-example.js末尾剪切掉这一行ReactDOM.render代码：\n\
  \n```\nReactDOM.render(<ClickCounter/>, document.getElementById('react_container'));\n\
  ```\n\n我们将在第6步将其粘贴到模板文件中。react-example.js现在应该只包含ClickCounter类。保存并关闭文件。\n\n5. 打开react-example.html。在所有现有的`<script>`标签之后（但在闭合的`</body>`标签之前），添加带有`type=\"\
  text/babel\"`属性的成对`<script>`标签。在它们内部，我们需要将传递给模板的Django上下文值赋给JavaScript变量。总的来说，你应该添加以下代码：\n\
  \n```\n<script type=\"text/babel\">\n    let name = \"{{ name | escapejs }}\";\n\
  \    let target = {{ target }};\n</script>\n```\n\n第一行将name上下文变量赋给name变量。我们使用escapejs模板过滤器；否则，如果我们的name中包含双引号，可能会生成无效的JavaScript代码。第二个值target从target赋值。这是一个数字，因此不需要转义。\n\
  \n# 注意\n\n由于Django为JavaScript转义值的方式，name不能像这样直接传递给组件属性：\n\n```\n<ClickCounter name=\"\
  {{ name|escapejs }}\"/>\n```\n\nJSX不会正确反转义这些值，最终你会得到转义序列。\n\n但是，你可以像这样传入数值target：\n\
  \n```\n<ClickCounter target=\"{ {{ target }} }\"/>\n```\n\n另外，请注意Django花括号和JSX花括号之间的空格。在本书中，我们将首先把所有属性赋给变量，然后将其传递给组件，以保持一致性。\n\
  \n6. 在这些变量声明下方，粘贴你从react-example.js复制的ReactDOM.render调用。然后，为ClickCounter添加`target={\
  \ target }`和`name={ name }`属性。请记住，这些是传入的JavaScript变量，而不是Django上下文变量——它们只是恰好同名。`<script>`块现在应该如下所示：\n\
  \n```\n<script type=\"text/babel\">\n    let name = \"{{ name|escapejs }}\";\n \
  \   let target = {{ target }};\n    ReactDOM.render(\n        <ClickCounter name={\
  \ name } target={ target }/>, \n        document.getElementById('react_container'));\n\
  </script>\n```\n\n你可以保存react-example.html了。\n\n7. 启动Django开发服务器（如果尚未运行），然后访问http://127.0.0.1:8000/react-example/。试着点击按钮几次——它应该会递增，直到你点击了目标次数。然后，它将被替换为“干得好，<name>!”文本。点击足够多次后，它应该看起来如图16.13所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_725_0.png)\n\n图16.13 – “干得好”消息\n\n在本练习中，我们使用props将数据传递给React组件。在赋值给JavaScript变量时，我们使用escapejs模板过滤器对数据进行了转义。在下一节中，我们将介绍如何使用JavaScript通过HTTP获取数据。\n\
  \n**扩展阅读**\n\n如需更详细、更实践的React课程，你随时可以参考*《React工作坊》*：https://courses.packtpub.com/courses/react.\n\
  \n## JavaScript Promise\n\n许多JavaScript函数以异步方式实现，以避免阻塞长时间运行的操作。它们会立即返回，然后在有结果时调用回调函数。这类函数返回的对象就是Promise对象。回调函数通过调用其`then`方法提供给Promise对象。当函数运行完毕时，它会resolve这个Promise（调用成功函数）或reject它（调用失败函数）。\n\
  \n我们将说明使用Promise的错误和正确方式。考虑一个假设的长期运行函数`getResult`，它执行大量计算。它不返回结果，而是返回一个Promise。你不应该这样使用它：\n\
  \n```\nconst result = getResult();\nconsole.log(result); // incorrect, this is a\
  \ Promise\n```\n\n\n\n\n\n相反，应该这样调用：在返回的 Promise 上，将回调函数传递给 then。我们假设 getResult\
  \ 永远不会失败，因此我们只为 resolve 情况提供一个成功函数：\n\n```\nconst promise = getResult();\npromise.then((result)\
  \ => {\n    console.log(result);  /* this is called when the\n                 \
  \         Promise resolves*/\n});\n```\n\n通常，你不会将返回的 Promise 赋值给变量。相反，你会将 then 调用链接到函数调用上。我们将在下一个示例中展示这一点，同时还会提供一个失败回调（假设\
  \ getResult 现在可能失败）。我们还会添加一些注释来说明代码的执行顺序：\n\n```\ngetResult().then(\n    (result)\
  \ => {\n        // success function\n        console.log(result);\n        // this\
  \ is called 2nd, but only on success\n    },\n    () => {\n        // failure function\n\
  \        console.log(\"getResult failed\");\n        // this is called 2nd, but\
  \ only on failure\n    })\n\n// this will be called 1st, before either of the callbacks\n\
  console.log(\"Waiting for callback\");\n```\n\n既然我们已经介绍了 Promise，接下来可以了解一下用于发出 HTTP\
  \ 请求的 fetch 函数。它是异步的，通过返回 Promise 来工作。\n\n## fetch 函数\n\n大多数浏览器（95%）支持一个名为 fetch\
  \ 的函数，它允许你发出 HTTP 请求。它使用带 Promise 的异步回调接口。\n\nfetch 函数接受两个参数。第一个参数是请求的 URL，第二个参数是一个包含请求设置的对象（字典）。例如，考虑以下代码：\n\
  \n```\nconst promise = fetch(\"http://www.google.com\", {...settings});\n```\n\n\
  设置包括以下内容：\n\n- method：请求的 HTTP 方法（GET、POST 等）。\n- headers：要发送的另一个 HTTP 头对象（字典）。\n\
  - body：要发送的 HTTP 请求体（用于 POST/PUT 请求）。\n- credentials：默认情况下，fetch 不会发送任何 cookie。这意味着你的请求会表现为未认证状态。要让\
  \ fetch 在请求中携带 cookie，此选项应设置为 same-origin 或 include 值。\n\n让我们通过一个简单的请求来实际使用它：\n\n\
  ```\nfetch('/api/books/', {\n  method: 'GET',\n  headers: {\n    Accept: 'application/json'\n\
  \  }\n}).then((resp) => {\n  console.log(resp)\n})\n```\n\n上述代码将从 `/api/book-list/`\
  \ 获取数据，然后调用一个函数，使用 `console.log` 将请求记录到浏览器控制台。\n\n图 16.14 展示了上述响应在 Firefox 中的控制台输出：\n\
  \n```\nResponse\n  body: ReadableStream { locked: false }\n  bodyUsed: false\n \
  \ headers: Headers { }\n  ok: true\n  redirected: false\n  status: 200\n  statusText:\
  \ \"OK\"\n  type: \"basic\"\n  url: \"http://127.0.0.1:8000/api/books/\"\n  <prototype>:\
  \ ResponsePrototype { clone: clone(), arrayBuffer: arrayBuffer(), blob: blob(),\
  \ ... }\n```\n\n图 16.14 – 控制台中的响应输出\n\n如你所见，当前控制台中没有多少有用的信息。我们需要先解码响应，然后才能处理它。我们可以使用响应对象上的\
  \ json 方法将响应体解码为 JSON 对象。这也会返回 Promise，所以我们要先获取 JSON，然后在回调中处理数据。完整的代码块如下：\n\n```\n\
  fetch('/api/books/', {\n    method: 'GET',\n    headers: {\n        Accept: 'application/json'\n\
  \    }\n}).then((resp) => {\n    return resp.json(); /* doesn't return JSON, returns\
  \ a Promise */\n}).then((data) => {\n    console.log(data);\n});\n```\n\n这会将解码后的\
  \ JSON 格式对象记录到浏览器控制台。在 Firefox 中，输出如图 16.15 所示：\n\n```\n(18) [...] \n  0: Object\
  \ { title: \"Advanced Deep Learning with Keras\", publication_date: \"2018-10-31\"\
  , isbn: \"9781788629416\", ... }\n  1: Object { title: \"Hands-On Machine Learning\
  \ for Algorithmic Trading\", publication_date: \"2018-12-31\", isbn: \"9781789346411\"\
  , ... }\n  2: Object { title: \"Architects of Intelligence\", publication_date:\
  \ \"2018-11-23\", isbn: \"9781789954531\", ... }\n  3: Object { title: \"Deep Reinforcement\
  \ Learning Hands-On\", publication_date: \"2018-06-20\", isbn: \"9781788834247\"\
  , ... }\n  4: Object { title: \"Natural Language Processing with TensorFlow\", publication_date:\
