  \n图 8.18：pip3 安装 pillow\n\n如果 Pillow 已安装，你会看到 Requirement already satisfied 输出信息。\n\
  \n- 5. 现在，我们可以更新 media_example 视图以在保存前调整图片大小。切换回 PyCharm 并打开 media_example 应用的 views.py\
  \ 文件，然后通过在文件顶部附近添加以下导入行来导入 PIL 的 Image 类：\n\n```\nfrom PIL import Image\n```\n\n\
  - 6. 进入 media_example 视图。在生成 save_path 的行下方，删除打开输出文件、遍历上传文件并写入其块的三个行。用以下代码替换它，该代码使用\
  \ PIL 打开上传的文件，调整其大小，然后保存它：\n\n```\nimage = Image.open(form.cleaned_data[\"file_upload\"\
  ])\nimage.thumbnail((50, 50))\nimage.save(save_path)\n```\n\n第一行通过打开上传的文件创建 Image\
  \ 实例，下一行执行缩略图转换（最大尺寸为 50 px x 50 px），第三行将文件保存到我们在之前的练习中一直生成的相同保存路径。你可以保存文件。它应该如下所示：https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter08/Exercise8.05/media_project/media_example/views.py。\n\
  \n- 7. Django 开发服务器应仍在步骤 2 中运行，但如果未运行，你应该启动它。然后，导航到 http://127.0.0.1:8000/media-example/。你会看到熟悉的\
  \ UploadForm。选择一张图片并提交表单。如果上传和调整大小成功，表单将刷新并再次变为空。\n\n- 8. 使用 MEDIA_URL 查看上传的图片。例如，名为\
  \ cover.jpg 的文件可以从 http://127.0.0.1:8000/media/cover.jpg 下载。你应该会看到图片已被调整大小，最大尺寸仅为\
  \ 50 px：\n\n![](img/4840a43efd335abd10b93708225692d6_418_0.png)\n\n图 8.19：调整大小后的封面\n\
  \n虽然这种尺寸的缩略图可能不太有用，但至少让我们确信图片调整大小已正确工作。\n\n在本练习中，我们将 UploadForm 上的 FileField 改为\
  \ ImageField。我们看到浏览器不允许我们上传除图片之外的任何内容。然后我们向 media_example 视图添加了代码，使用 PIL 调整上传的图片大小。\n\
  \n我们已鼓励出于性能原因使用单独的 Web 服务器来提供静态和媒体文件。然而，在某些情况下，你可能希望使用 Django 来提供文件，例如在允许访问之前提供身份验证。在下一节中，我们将讨论如何使用\
  \ Django 提供媒体文件。\n\n## 使用 Django 提供上传（和其他）文件\n\n在本章以及第 5 章《提供静态文件》中，我们一直不鼓励使用 Django\
  \ 提供文件。这是因为它会不必要地占用 Python 进程来提供文件，而 Web 服务器完全有能力处理此事。不幸的是，Web 服务器通常不提供动态访问控制，即仅允许经过身份验证的用户下载文件。根据你在生产环境中使用的\
  \ Web 服务器，你可能可以让它针对 Django 进行身份验证，然后自行提供文件；然而，特定 Web 服务器的具体配置超出了本书的范围。\n\n你可以采取的一种方法是指定\
  \ MEDIA_ROOT 目录的子目录，并让你的 Web 服务器阻止访问仅此特定文件夹。任何受保护的媒体都应存储在其中。如果你这样做，只有 Django 才能读取其中的文件。例如，你的\
  \ Web 服务器可以提供 MEDIA_ROOT 目录中的所有内容，除了 MEDIA_ROOT/protected 目录。\n\n另一种方法是将 Django\
  \ 视图配置为从磁盘提供特定文件。视图将确定要发送的文件在磁盘上的路径，然后使用 FileResponse 类发送它。FileResponse 类接受一个打开的文件句柄作为参数，并尝试根据文件的内容确定正确的\
  \ content type。Django 会在请求完成后关闭文件句柄。\n\n视图函数将接受请求和要下载的文件的相对路径作为参数。此相对路径是 MEDIA_ROOT/protected\
  \ 文件夹内部的路径。\n\n在我们的例子中，我们只需检查用户是否匿名（未登录）。我们将通过检查 request.user.is_anonymous 属性来做到这一点。如果他们未登录，我们将引发\
  \ django.core.exceptions.PermissionDenied 异常，该异常向浏览器返回 HTTP 403 Forbidden 响应。这将停止视图的执行并且不会返回任何文件：\n\
  \n```\nimport os.path\nfrom django.conf import settings\nfrom django.http import\
  \ FileResponse\nfrom django.core.exceptions import PermissionDenied\n\ndef download_view(request,\
  \ relative_path):\n    if request.user.is_anonymous:\n        raise PermissionDenied\n\
  \    full_path = os.path.join(settings.MEDIA_ROOT,\n        \"protected\", relative_path)\n\
  \    file_handle = open(full_path, \"rb\")\n    return FileResponse(file_handle)\
  \  # Django sends the file then closes the handle\n```\n\n此视图的 URL 映射可以如下所示，使用 path\
  \ path 转换器在你的 urls.py 文件中：\n\n```\nurlpatterns = [\n    ...\n    path(\"downloads/<path:relative_path>\"\
  ,\n    views.download_view)\n]\n```\n\n你可以以多种方式选择实现发送文件的视图。重要的是你使用 FileResponse\
  \ 类，该类旨在将文件分块流式传输给客户端，而不是全部加载到内存中。这将减少服务器的负载，并在你必须使用 Django 发送文件时减轻对资源使用的影响。\n\n\
  现在我们知道了如何上传和处理图片，让我们看看如何将它们存储在模型上。\n\n## 在模型实例上存储文件\n\n到目前为止，我们手动管理文件的上传和保存。你也可以通过将保存的路径分配给\
  \ CharField 来将文件与模型实例关联起来。然而，与 Django 的许多功能一样，此功能（以及更多功能）已由 models.FileField 类提供。FileField\
  \ 实例实际上并不存储文件数据；相反，它们存储文件存储的路径（就像 CharField 会做的那样），但它还提供了辅助方法。这些方法有助于加载文件（因此你不必手动打开它们）并根据实例的\
  \ ID（或其他属性）为你生成磁盘路径。\n\n\n\n\n\n请注意 user_grouped_file_path 只是一个说明性的函数，故意保持简短，因此它在文件名只有单个字符或用户名包含无效字符时将无法正确工作。例如，如果用户名中包含\
  \ / 字符，则它将在生成的路径中充当目录分隔符。\n\n现在，我们已经深入研究了如何在模型上设置 FileField，但我们如何实际将上传的文件保存到其中呢？这和为任何类型的值赋值一样简单，只需将上传的文件分配给模型的属性即可。下面是一个使用视图和本节前面示例中使用的简单\
  \ ExampleModel 的快速示例：\n\n```python\nclass ExampleModel(models.Model):\n    file_field\
  \ = models.FileField(upload_to=\"files/\")\n\ndef view(request):\n    if request.method\
  \ == \"POST\":\n        m = ExampleModel()  # Create a new ExampleModel instance\n\
  \        m.file_field = request.FILES[\"uploaded_file\"]\n        m.save()\n   \
  \ return render(request, \"template.html\")\n```\n\n在这个示例中，我们创建了一个新的 ExampleModel\
  \ 并将上传的文件（在表单上称为 uploaded_file）分配给其 file_field 属性。当我们保存模型实例时，Django 会自动将文件以其名称写入\
  \ upload_to 目录路径。如果上传的文件名为 image.jpg，则保存路径将为 MEDIA_ROOT/upload_to/image.jpg。\n\n\
  我们也可以同样轻松地更新现有模型的 file 字段或使用表单（在保存前进行验证）。下面是另一个简单的示例来演示这一点：\n\n```python\nclass\
  \ ExampleForm(forms.Form):\n    uploaded_file = forms.FileField()\n\ndef view(request,\
  \ model_pk):\n    form = ExampleForm(request.POST, request.FILES)\n    if form.is_valid():\n\
  \        # Get an existing model instance\n        m = ExampleModel.objects.get(pk=model_pk)\n\
  \n        # store the uploaded file on the instance\n        m.file_field = form.cleaned_data[\"\
  uploaded_file\"]\n        m.save()\n    return render(request, \"template.html\"\
  )\n```\n\n你可以看到，在现有模型实例上更新 FileField 的过程与在新实例上设置它相同，如果你选择使用 Django 表单或直接访问 request.FILES，过程也一样简单。\n\
  \n现在我们将看看如何使用 ImageField 在模型上存储图像。\n\n## 在模型实例上存储图像\n\n虽然 FileField 可以存储任何类型的文件，包括图像，但也存在\
  \ ImageField。正如你所预期的那样，这仅用于存储图像。模型 forms.FileField 与 forms.ImageField 之间的关系与 models.FileField\
  \ 和 models.ImageField 之间的关系类似，这意味着 ImageField 扩展了 FileField 并添加了用于处理图像的额外方法。\n\n\
  ImageField 构造函数接受与 FileField 相同的参数，并添加了两个额外的可选参数：\n\n- `height_field`：这是模型上字段的名称，每次保存模型实例时都会用图像的高度进行更新\n\
  \n- `width_field`：这是 height_field 的宽度对应项：存储图像宽度的字段，每次保存模型实例时都会更新\n\n这两个参数都是可选的，但如果使用，它们命名的字段必须存在。也就是说，将\
  \ height_field 或 width_field 设为空是有效的，但如果它们被设置为不存在的字段的名称，则会发生错误。其目的是帮助在数据库中搜索具有特定尺寸的文件。\n\
  \n下面是一个使用 ImageField 的示例模型，它会更新图像尺寸字段：\n\n```python\nclass ExampleModel(models.Model):\n\
  \    image = models.ImageField(upload_to=\"images/%Y/%m/%d/\",\n               \
  \               height_field=\"image_height\",\n                              width_field=\"\
  image_width\"\n                              )\n    image_height = models.IntegerField()\n\
  \    image_width = models.IntegerField()\n```\n\n请注意，`ImageField` 使用 `upload_to`\
  \ 参数，其中包含在保存时更新的日期格式化指令。`upload_to` 的行为与 `FileField` 完全相同。\n\n保存 `ExampleModel`\
  \ 实例后，其 `image_height` 字段将被更新为图像的高度，`image_width` 将被更新为图像的宽度。\n\n我们不会展示在视图中设置 `ImageField`\
  \ 值的示例，因为该过程与普通 `FileField` 相同。\n\n## 使用 FieldFile\n\n当你访问模型实例的 `FileField` 或 `ImageField`\
  \ 属性时，你不会得到一个原生的 Python 文件对象。相反，你将使用一个 `FieldFile` 对象。`FieldFile` 类是对文件的包装，添加了额外的方法。是的，拥有名为\
  \ `FileField` 和 `FieldFile` 的类可能会令人困惑。\n\nDjango 使用 `FieldFile` 而不是仅使用文件对象的理由有两个。首先，它添加了打开、读取、删除文件以及生成文件\
  \ URL 的额外方法。其次，它提供了一个抽象层以允许使用替代存储引擎。\n\n## 自定义存储引擎\n\n我们在 *第 5 章，Serving Static\
  \ Files* 中研究了自定义存储引擎，关于存储静态文件。我们不会详细检查媒体文件的自定义存储引擎，因为 *第 5 章，Serving Static Files*\
  \ 中为静态文件概述的代码也适用于媒体文件。需要注意的重要一点是，你使用的存储引擎可以在不更新其他代码的情况下更改。这意味着你可以在开发期间将媒体文件存储在本地驱动器上，然后在应用程序部署到生产环境时将它们保存到\
  \ CDN。\n\n默认存储引擎类可以用 `settings.py` 中的 `DEFAULT_FILE_STORAGE` 设置。存储引擎也可以按字段指定（对于\
  \ `FileField` 或 `ImageField`），使用 storage 参数，例如：\n\n```python\nstorage_engine = CustomStorageEngine()\n\
  \nclass ExampleModel(models.Model):\n    image_field = ImageField(storage=storage_engine)\n\
  ```\n\n这演示了上传或检索文件时实际发生的情况。Django 将写入或读取操作委托给存储引擎。即使保存到磁盘时也是如此；然而，这是基础性的，对用户来说是不可见的。\n\
  \n## 读取存储的 FieldFile\n\n现在我们已经了解了自定义存储引擎，让我们来看一下如何从 FieldFile 读取。在前面的章节中，我们看到了如何将文件设置在模型实例上。再次读取数据也一样简单——我们有几种不同的方法可以帮助我们，具体取决于我们的用例。\n\
  \n在下面的几个代码片段中，假设我们位于一个视图中，并且以某种方式检索了我们的模型实例，并将其存储在 m 变量中：\n\n```python\nm = ExampleModel.objects.get(pk=model_pk)\n\
  ```\n\n我们可以使用 read 方法读取文件的全部数据：\n\n```python\ndata = m.file_field.read()\n```\n\n\
  或者，我们可以使用 open 方法手动打开文件。如果我们想将自己生成的数据写入文件，这可能会很有用：\n\n```python\nwith m.file_field.open(\"\
  wb\") as f:\n    chunk = f.write(b\"test\")  # write bytes to the file\n```\n\n\
  如果我们想分块读取文件，可以使用 chunks 方法。这与我们之前看到的从上传文件读取块的方式相同：\n\n```python\nfor chunk in m.file_field.chunks():\n\
  \    write_chunk(open_file, chunk)  # assume this method is defined somewhere\n\
  ```\n\n我们也可以通过使用其 path 属性手动自行打开文件：\n\n```python\nopen(m.file_field.path)\n```\n\n\
  如果我们想为下载而流式传输 FileField，最好的方法是使用 FileResponse 类，正如我们之前看到的那样。将此与 FileField 上的 open\
  \ 方法结合使用。请注意，如果我们只是想提供一个媒体文件，我们只有在尝试限制对文件的访问时才应实现一个视图来执行此操作。否则，我们应该只使用 MEDIA_URL\
  \ 提供文件并让 Web 服务器处理请求。以下是我们如何编写 download_view 以使用 FileField 而不是手动指定的路径：\n\n```python\n\
  def download_view(request, model_pk):\n    if request.user.is_anonymous:\n     \
  \   raise PermissionDenied\n    m = ExampleModel.objects.get(pk=model_pk)\n    return\
  \ FileResponse(m.file_field.open())  # Django sends the file then closes the handle\n\
  ```\n\n\n\nDjango 会打开正确的路径，并在响应后关闭它。Django 还会尝试确定文件的正确 MIME 类型。我们假设 FileField 的\
  \ upload_to 属性已设置为受保护的目录，Web 服务器禁止直接访问该目录。\n\n## 在 FileField 中存储现有文件或内容\n\n我们已经看到如何将上传的文件存储到图像字段中：只需像这样将其分配给字段即可：\n\
  \n```python\nm.file_field = request.FILES[\"file_upload\"]\n```\n\n但是我们如何将字段值设置为我们可能已经在磁盘上拥有的现有文件呢？你可能会认为可以使用标准的\
  \ Python 文件对象，但这不起作用：\n\n```python\nm.file_field = open(\"/path/to/file.txt\", \"\
  rb\")  # Don't do this\n```\n\n你也可能尝试使用一些内容来设置文件：\n\n```python\nm.file_field = \"\
  new file content\"  # Don't do this\n```\n\n这同样不会起作用。\n\n你需要改用 FileField 的 save\
  \ 方法，该方法接受 Django File 对象或 ContentFile 对象的实例（这两个类的完整路径分别是 django.core.files.File\
  \ 和 django.core.files.base.ContentFile）。我们将简要讨论 save 方法及其参数，然后再回到这些类。\n\nFileField\
  \ 的 save 方法接受三个参数：\n\n- name：这是你要保存的文件的名称，也是文件在存储引擎中保存时的名称（在我们的例子中，是保存在磁盘上的 MEDIA_ROOT\
  \ 内部）。\n- content：这是一个我们刚刚看到的 File 或 ContentFile 的实例；同样，我们很快会讨论这些。\n- save：此参数是可选的，默认为\
  \ True。它表示在保存文件后是否将模型实例保存到数据库。如果设置为 False（即模型未保存），则文件仍会写入存储引擎（到磁盘），但关联不会存储在模型上。之前的\
  \ file 路径（如果未设置则无文件）仍会存储在数据库中，直到手动调用模型实例的 save 方法。你只有在打算对模型实例进行其他更改然后手动保存它时，才应将此参数设置为\
  \ False。\n\n回到 `File` 和 `ContentFile`：要使用哪一个取决于你想在 `FileField` 中存储什么。\n\n`File`\
  \ 用作 Python 文件对象的包装器，如果你有一个现有的文件或类似文件的对象想要保存，就应该使用它。类似文件的对象包括 `io.BytesIO` 或 `io.StringIO`\
  \ 实例。要实例化一个 `File` 实例，只需将原生文件对象传递给构造函数，例如：\n\n```python\nf = open(\"/path/to/file.txt\"\
  , \"rb\")\nfile_wrapper = File(f)\n```\n\n当你已经加载了一些数据时使用 `ContentFile`，数据可以是 `str`\
  \ 对象或 `bytes` 对象。将数据传递给 `ContentFile` 构造函数：\n\n```python\nstring_content = ContentFile(\"\
  A string value\")\nbytes_content = ContentFile(b\"A bytes value\")\n```\n\n现在你有了\
  \ `File` 实例或 `ContentFile` 实例，将数据保存到 `FileField` 很简单，使用 `save` 方法：\n\n```python\n\
  m = ExampleModel.objects.first()\nwith open(\"/path/to/file.txt\") as f:\n    file_wrapper\
  \ = File(f)\n    m.file_field.save(\"file.txt\", file_wrapper)\n```\n\n由于我们没有为 save\
  \ 方法传递 `save` 的值，它将默认为 `True`，因此模型实例会自动持久化到数据库中。\n\n接下来，我们将查看如何将使用 PIL 处理过的图像保存回图像字段。\n\
  \n## 将 PIL 图像写入 ImageField\n\n在 *Exercise 8.05 – image uploads using Django forms*\
  \ 中，你使用 PIL 调整图像大小并将其保存到磁盘。当使用模型时，你可能希望执行类似的操作，但让 Django 使用 `ImageField` 处理文件存储，这样你就不必手动操作了。如练习中所示，你可以将图像保存到磁盘，然后使用\
  \ `File` 类包装存储的路径——像这样：\n\n```python\nimage = Image.open(request.FILES[\"image_field\"\
  ])\nimage.thumbnail((150, 150))\nimage.save(\"/tmp/thumbnail.jpg\")  # save thumbnail\
  \ to temp\n                             # location\n\nwith open(\"/tmp/thumbnail.jpg\"\
  , \"rb\") as f:\n    image_wrapper = File(f)\n    m.image_field.save(\"thumbnail.jpg\"\
  , image_wrapper)\n\nos.unlink(\"/tmp/thumbnail.jpg\")  # clean up temp file\n```\n\
  \n在这个例子中，我们让 PIL 使用 `Image.save()` 方法将图像存储到临时位置，然后重新打开文件。\n\n这种方法有效，但并不理想，因为它涉及将文件写入磁盘然后再次读出，有时速度会很慢。相反，我们可以在内存中执行整个过程。\n\
  \n> **Note**\n>\n> `io.BytesIO` 和 `io.StringIO` 是有用的对象。它们的行为像文件，但只存在于内存中。BytesIO\
  \ 用于存储原始字节，StringIO 接受 Python 3 的原生 Unicode 字符串。你可以使用 read、write 和 seek，就像普通文件一样。与普通文件不同，它们不会写入磁盘，而是在程序终止时消失，或超出作用域后被垃圾回收。它们非常有用，如果一个函数想要写入类似文件的内容，但你希望立即访问数据。\n\
  \n首先，我们将图像数据保存到 `io.BytesIO` 对象中。然后，我们将 BytesIO 对象包装在 `django.core.files.images.ImageFile`\
  \ 实例中（File 的子类，专门用于图像，并提供 width 和 height 属性）。一旦我们有了这个 ImageFile 实例，我们就可以在 ImageField\
  \ 的 save 方法中使用它。\n\n> **Note**\n>\n> `ImageFile` 是一个文件或类似文件的包装器，就像 `File` 一样。它提供了两个额外的属性：width\
  \ 和 height。ImageFile 不会在你用它包装非图像时产生任何错误。例如，你可以使用 `open()` 打开一个文本文件并将文件句柄传递给 ImageFile\
  \ 构造函数而不会有问题。你可以通过尝试访问 width 或 height 属性来检查你传入的图像文件是否有效：如果这些值为 None，则 PIL 无法解码图像数据。你可以自行检查这些值的有效性，如果它们为\
  \ None 则抛出异常。\n\n让我们在一个视图中实际看看这一点：\n\n```python\nfrom io import BytesIO\nfrom PIL\
  \ import Image\nfrom django.core.files.images import ImageFile\n\n\ndef index(request,\
  \ pk):\n    # trim out logic for checking if method is POST\n\n    # get a Model\
  \ instance, or create a new one\n    m = ExampleModel.objects.get(pk=pk)\n\n   \
  \ # store the uploaded image in a variable for shorter code\n    uploaded_image\
  \ = request.FILES[\"image_field\"]\n\n    # load a PIL image instance from the uploaded\
  \ file\n    image = Image.open(uploaded_image)\n\n    # perform the image resize\n\
  \    image.thumbnail((150, 150))\n\n    # Create a BytesIO file-like object to store\n\
  \    image_data = BytesIO()\n\n    # Write the Image data back out to the BytesIO\
  \ object\n    # Retain the existing format from the uploaded image\n    image.save(fp=image_data,\
  \ format=uploaded_image.format)\n\n    # Wrap the BytesIO containing the image data\n\
  \    image_file = ImageFile(image_data)\n\n    # Save the wrapped image file data\
  \ with the original name\n    m.image_field.save(uploaded_image.name, image_file)\n\
  \    # this also saves the model instance\n    return redirect(\"/success-url/\"\
  )\n```\n\n你可以看到这段代码稍微多一点，但它节省了将数据写入磁盘的操作。你可以根据需要选择使用任一方法（或你自己想出的其他方法）。\n\n## 在模板中引用媒体\n\
  \n一旦我们上传了文件，我们希望能够在模板中引用它。对于上传的图像，例如书籍封面，我们希望在页面上显示图像。我们在 Exercise 8.02 – template\
  \ settings, and using MEDIA_URL in templates 中看到如何使用 MEDIA_URL 在模板中构建 URL。当在模型实例上使用\
  \ FileField 或 ImageField 时，不必这样做，因为 Django 已为你提供了此功能。\n\nFileField 的 url 属性将根据 settings\
  \ 中的 MEDIA_URL 自动生成媒体文件的完整 URL。\n\n> **Note**\n>\n> 注意，本节中对 FileField 的引用也适用于 ImageField，因为它是\
  \ FileField 的子类。\n\n\n\n\n\n这可以在你能够访问实例和字段的任何地方使用，例如在视图或模板中。以下示例在视图中：\n\n```\ninstance\
  \ = ExampleModel.objects.first()\nurl = instance.file_field.url  # Get the URL\n\
  ```\n\n或在模板中（假设实例已传递到模板上下文）：\n\n```\n<img src=\"{{ instance.file_field.url }}\"\
  >\n```\n\n在下一个练习中，我们将创建一个带有 FileField 和 ImageField 的新模型，然后展示 Django 如何自动保存这些文件。我们还将演示如何检索已上传文件的\
  \ URL。\n\n## 练习 8.06 – 模型上的 FileField 和 ImageField\n\n在本练习中，我们将创建一个带有 FileField\
  \ 和 ImageField 的模型。完成此操作后，我们需要生成迁移并应用它。我们将更改一直在使用 UploadForm，使其同时具有 FileField 和\
  \ ImageField。media_example 视图将被更新以将上传的文件存储到模型实例上。最后，我们将在示例模板中添加 <img> 以显示之前上传的图像：\n\
  \n- 1. 在 PyCharm 中，打开 media_example 应用的 models.py 文件。创建一个名为 ExampleModel 的新模型，包含两个字段：名为\
  \ image_field 的 ImageField，以及名为 file_field 的 FileField。ImageField 应将 upload_to 设置为\
  \ images/，FileField 应将 upload_to 设置为 files/。完成的模型应如下所示：\n\n```\nclass ExampleModel(models.Model):\n\
  \    image_field = models.ImageField(upload_to=\"images/\")\n    file_field = models.FileField(upload_to=\"\
  files/\")\n```\n\n你的 models.py 文件现在应如下所示：https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter08/Exercise8.06/media_project/media_example/models.py。\n\
  \n- 2. 打开终端并导航到 media_project 项目目录。确保你的 bookr 虚拟环境处于激活状态。运行 makemigrations 管理命令为此新模型生成迁移（对于\
  \ Windows，你可以在以下代码中使用 python 而不是 python3）：\n\n```\npython3 manage.py makemigrations\n\
  ```\n\n> Note\n> 要了解如何创建和激活虚拟环境，请参阅本书的 Preface 部分。\n\n输出应如下所示：\n\n```\n(bookr)$\
  \ python3 manage.py makemigrations\nMigrations for 'media_example':\n    media_example/migrations/0001_initial.py\n\
  \      - Create model ExampleModel\n```\n\n3. 通过运行 migrate 管理命令应用迁移：\n\n```\npython3\
  \ manage.py migrate\n```\n\n输出将如下所示：\n\n```\n(bookr)$ python3 manage.py migrate\n\
  Operations to perform:\n  Apply all migrations: admin, auth, contenttypes,\n  reviews,\
  \ sessions\nRunning migrations:\n  # output trimmed for brevity\n  Applying media_example.0001_initial...\
  \ OK\n```\n\n请注意，所有初始 Django 迁移也将被应用，因为我们在创建项目后没有应用这些迁移。\n\n4. 切回 PyCharm 并打开 media_example\
  \ 应用的 forms.py 文件。将现有的 ImageField 从 file_upload 重命名为 image_upload。然后，添加一个名为 file_upload\
  \ 的新 FileField。进行这些更改后，你的 UploadForm 代码应如下所示：\n\n```\nclass UploadForm(forms.Form):\n\
  \    image_upload = forms.ImageField()\n    file_upload = forms.FileField()\n```\n\
  \n你可以保存并关闭文件。它应如下所示：https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter08/Exercise8.06/media_project/media_example/forms.py。\n\
  \n5. 打开 media_example 应用的 views.py 文件。首先，将 ExampleModel 导入到文件中。为此，在现有导入语句之后在文件顶部添加这一行：\n\
  \n```\nfrom .models import ExampleModel\n```\n\n一些导入将不再需要，因此你可以删除这些行：\n\n```\nfrom\
  \ PIL import Image\nfrom django.conf import settings\n```\n\n10. 如果尚未运行，请启动 Django\
  \ 开发服务器，然后导航到 `http://127.0.0.1:8000/media-example/`。你应该会看到渲染出包含两个字段的表单：\n\n![](img/4840a43efd335abd10b93708225692d6_434_0.png)\n\
  \n图 8.20：包含两个字段的 UploadForm\n\n11. 为每个字段选择一个文件 – 对于 `ImageField`，你必须选择一张图片，但对于 `FileField`\
  \ 允许任何类型的文件。图 8.20 显示了选择文件后的字段：\n\n![](img/4840a43efd335abd10b93708225692d6_434_1.png)\n\
  \n图 8.21：选择文件后的 ImageField 和 FileField\n\n然后，提交表单。如果提交成功，页面将重新加载，并且我们上次上传的图像将被显示（图\
  \ 8.22）：\n\n![](img/4840a43efd335abd10b93708225692d6_435_0.png)\n\n图 8.22：显示上次上传的图像\n\
  \n12. 你可以通过查看 MEDIA_ROOT 目录来了解 Django 如何存储文件。图 8.23 显示了 PyCharm 中的目录结构：\n\n![](img/4840a43efd335abd10b93708225692d6_435_1.png)\n\
  \n图 8.23：Django 创建的已上传文件\n\n你可以看到 Django 已创建了 `files` 和 `images` 目录。这些是你设置在模型 `ImageField`\
  \ 和 `FileField` 的 `upload_to` 参数中的目录。\n\n我们也可以通过尝试下载它们来验证这些上传，例如，`http://127.0.0.1:8000/media/files/sample.txt`\
  \ 或 `http://127.0.0.1:8000/media/images/cover.jpg`。\n\n在本练习中，我们创建了带有 FileField 和\
  \ ImageField 的 ExampleModel，并了解了如何将上传的文件存储在其上。我们了解了如何为模板生成已上传文件的 URL。我们尝试上传了一些文件，并看到\
  \ Django 自动创建了 upload_to 目录（media/files 和 media/images），然后将文件存储在其中。\n\n在下一节中，我们将了解如何通过使用\
  \ ModelForm 来生成表单并在无需手动在视图中设置文件的情况下保存模型，从而进一步简化流程。\n\n## ModelForms 和文件上传\n\n我们已经看到在表单上使用\
  \ `form.ImageField` 可以防止非图像被上传。我们还看到 `models.ImageField` 使为模型存储图像变得容易。但我们需要意识到 Django\
  \ 并不会阻止你将非图像文件设置为 `ImageField`。例如，考虑一个同时具有 `FileField` 和 `ImageField` 的表单：\n\n```\n\
  class ExampleForm(forms.Form):\n    uploaded_file = forms.FileField()\n    uploaded_image\
  \ = forms.ImageField()\n```\n\n在下面的视图中，如果表单上的 `uploaded_image` 字段不是图像，则表单将不会验证，因此上传数据的某些有效性得以保证。以下是一个示例：\n\
  \n```\ndef view(request):\n    form = ExampleForm(request.POST, request.FILES)\n\
  \    if form.is_valid():\n        m = ExampleModel()\n        m.file_field = form.cleaned_data[\"\
  uploaded_file\"]\n        m.image_field = \n            forms.cleaned_data[\"uploaded_image\"\
  ]\n        m.save()\n    return render(request, \"template.html\")\n```\n\n由于我们确信表单有效，我们知道\
  \ `forms.cleaned_data[\"uploaded_image\"]` 必须包含一张图像。因此，我们永远不会将非图像分配给模型实例的 `image_field`。\n\
  \n然而，如果我们在代码中犯了错误，写了如下内容怎么办：\n\n```\nm.image_field = forms.cleaned_data[\"uploaded_file\"\
  ]\n```\n\n也就是说，如果我们不小心引用了 `FileField`，Django 不会验证是否将（潜在的）非图像分配给 `ImageField`，因此它不会抛出异常或产生任何错误。我们可以通过使用\
  \ `ModelForm` 来减轻此类问题的可能性。\n\n我们在 *第 7 章，高级表单验证和模型表单* 中介绍了 `ModelForm`。这些是其字段从模型自动定义的表单。我们看到\
  \ `ModelForm` 具有 save 方法，可自动在数据库中创建或更新模型数据。当与具有 `FileField` 或 `ImageField` 的模型一起使用时，`ModelForm`\
  \ 的 save 方法也会保存上传的文件。\n\n以下是使用 `ModelForm` 在视图中保存新模型实例的示例。在这里，我们只需确保将 `request.FILES`\
  \ 传递给 `ModelForm` 构造函数：\n\n```\nclass ExampleModelForm(forms.Model):\n    class\
  \ Meta:\n        model = ExampleModel  # The same ExampleModel class\n         \
  \                   # we've seen previously\n        fields = \"__all__\"\n\n\n\
  def view(request):\n    if request.method == \"POST\":\n        form = ExampleModelForm(request.POST,\n\
  \                                request.FILES)\n        form.save()\n        return\
  \ redirect(\"/success-page\")\n    else:\n        form = ExampleModelForm()\n  \
  \  return (request, \"template.html\", {\"form\": form})\n```\n\n与任何 `ModelForm`\
  \ 一样，save 方法可以调用时将 commit 参数设置为 `False`。然后模型实例不会保存到数据库，并且 `FileField` 和 `ImageField`\
  \ 文件不会保存到磁盘。save 方法应在其模型实例上调用 – 这将提交对数据库的更改并保存文件。在下面的这个简短示例中，我们在保存之前在模型实例上设置一个值：\n\
  \n```\ndef view(request):\n    if request.method == \"POST\":\n        form = ExampleModelForm(request.POST,\n\
  \                                request.FILES)\n        m = form.save(False)\n\
  \        m.attribute = \"value\"  # Set arbitrary value on the\n               \
  \                 # model instance before save\n\n\n\n\n```\nm.save()  # save the\
  \ model instance, also write the\n            files to disk\n        return redirect(\"\
  /success-page/\")\n    else:\n        form = ExampleModelForm()\n    return (request,\
  \ \"template.html\", {\"form\": form})\n```\n\n调用模型实例的 save 方法会将模型数据保存到数据库，并将上传的文件保存到磁盘。在下一个练习中，我们将从练习\
  \ 8.06 – FileField 和 ImageField on models 中创建的 ExampleModel 构建 ModelForm，然后使用它测试文件上传。\n\
  \n## 练习 8.07 – 使用 ModelForm 进行文件和图片上传\n\n在本练习中，你将把 UploadForm 更新为 ModelForm 的子类，并使其自动从\
