  - Harper Collins\n- Packt Publishing\n9 publishers\n\n图 4.25 – Select publisher\
  \ to change 列表\n\n我们可以跟随更改列表中的一个链接并检查 Change publisher 页面。\n\n## The Change publisher\
  \ page\n\nChange publisher 页面位于 http://127.0.0.1:8000/admin/reviews/publisher/1，包含我们所期望的内容（见图\
  \ 4.26）。有一个用于编辑出版商详细信息的表单。这些详细信息是从 reviews.models.Publisher 类派生的：\n\n# Change publisher\n\
  \n![](img/4840a43efd335abd10b93708225692d6_191_0.png)\n\n图 4.26 – Change publisher\
  \ 页面\n\n如果我们点击了 **ADD PUBLISHER +** 按钮，admin 应用将返回一个类似的用于添加出版商的表单。admin 应用的美妙之处在于，它仅用一行代码\
  \ – `admin.site.register(Publisher)` – 就为我们提供了所有这些 CRUD 功能，使用 `reviews.models.Publisher`\
  \ 属性的定义作为页面内容的模式：\n\n```\n```python\nclass Publisher(models.Model):\n    \"\"\"\
  A company that publishes books.\"\"\"\n    name = models.CharField(max_length=50,\n\
  \        help_text=\"The name of the Publisher.\")\n    website = models.URLField(\n\
  \        help_text=\"The Publisher's website.\")\n    email = models.EmailField(\n\
  \        help_text=\"The Publisher's email address.\")\n```\n```\n\n出版商 **Name**\
  \ 字段被限制为 50 个字符，如模型中指定。每个字段下方以灰色显示的帮助文本是从模型上指定的 `help_text` 属性派生的。我们可以看到 `models.CharField`、`models.URLField`\
  \ 和 `models.EmailField` 分别以 HTML 呈现为 text、url 和 email 类型的输入元素。\n\n\n\n\n\n表单中的字段会在适当位置进行验证。除非模型字段设置为\
  \ `blank=True` 或 `null=True`，否则如果字段留空，表单将抛出错误，就像 `Publisher.name` 字段的情况一样。同样，由于\
  \ `Publisher.website` 和 `Publisher.email` 分别定义为 `models.URLField` 和 `models.EmailField`\
  \ 的实例，它们也会相应地得到验证。在图4.27中，我们可以看到**名称**作为必填字段的验证、**网站**作为URL的验证，以及**电子邮件**作为电子邮件地址的验证：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_192_0.png)\n\n图4.27 – 字段验证\n\n检查管理应用如何渲染模型元素，有助于理解其工作原理。在浏览器中，右键单击**查看页面源代码**，并检查为此表单渲染的HTML。您将看到一个浏览器标签页显示类似如下内容：\n\
  \n```\n```html\n<fieldset class=\"module aligned \">\n  <div class=\"form-row errors\
  \ field-name\">\n    <ul class=\"errorlist\"><li>This field is\n      required.</li></ul>\n\
  \    <div>\n      <label class=\"required\" for=\"id_name\">Name:</label>\n    \
  \  <input type=\"text\" name=\"name\" class=\"vTextField\"\n        maxlength=\"\
  50\" required=\"\" id=\"id_name\">\n```\n```\n<div class=\"help\">The name of the\
  \ Publisher.</div>\n</div>\n</div>\n<div class=\"form-row errors field-website\"\
  >\n<ul class=\"errorlist\"><li>Enter a valid URL.</li></ul>\n<div>\n<label class=\"\
  required\" for=\"id_website\">Website:</label>\n<input type=\"url\" name=\"website\"\
  \ value=\"packtcom\" class=\"vURLField\" maxlength=\"200\" required=\"\" id=\"id_website\"\
  >\n<div class=\"help\">The Publisher's website.</div>\n</div>\n</div>\n<div class=\"\
  form-row errors field-email\">\n<ul class=\"errorlist\"><li>Enter a valid email\
  \ address.</li></ul>\n<div>\n<label class=\"required\" for=\"id_email\">Email:</label>\n\
  <input type=\"email\" name=\"email\" value=\"infoatpackt.com\" class=\"vTextField\"\
  \ maxlength=\"254\" required=\"\" id=\"id_email\">\n<div class=\"help\">The Publisher's\
  \ email address.</div>\n</div>\n</div>\n</fieldset>\n```\n\n表单有一个publisher_form\
  \ ID，并且包含一个fieldset，其中的HTML元素对应于reviews/models.py中Publisher模型的数据结构，如下所示：\n\n```\n\
  class Publisher(models.Model):\n    \"\"\"A company that publishes books.\"\"\"\n\
  \    name = models.CharField(max_length=50,\n        help_text=\"The name of the\
  \ Publisher.\")\n    website = models.URLField(\n        help_text=\"The Publisher's\
  \ website.\")\n    email = models.EmailField(\n        help_text=\"The Publisher's\
  \ email address.\")\n```\n\n注意，对于name，输入字段渲染如下：\n\n```\n<input type=\"text\" name=\"\
  name\" value=\"Packt Publishing\" class=\"vTextField\" maxlength=\"50\" required=\"\
  \" id=\"id_name\">\n```\n\n它是一个必填字段，具有文本类型和50的maxlength，由模型定义中的 `max_length` 参数指定：\n\
  \n```\nname = models.CharField(max_length=50,\n    help_text=\"The name of the Publisher.\"\
  )\n```\n\n类似地，我们可以看到模型中定义为URLField和EmailField的website和email在HTML中分别渲染为url和email类型的input元素：\n\
  \n```\n<input type=\"url\" name=\"website\"\n    value=\"https://www.packtpub.com/\"\
  \n    class=\"vURLField\" maxlength=\"200\" required=\"\"\n    id=\"id_website\"\
  >\n<input type=\"email\" name=\"email\" value=\"info@packtpub.com\"\n    class=\"\
  vTextField\" maxlength=\"254\"\n    required=\"\" id=\"id_email\">\n```\n\n我们已经了解到，Django管理应用会根据我们提供的模型定义，为Django模型派生出合理的HTML表示。\n\
  \n## 书籍修改页面\n\n类似地，有一个修改页面，可以通过从**站点管理**页面选择**图书**，然后从更改列表中选择特定的书来访问：\n\n![](img/4840a43efd335abd10b93708225692d6_194_0.png)\n\
  \n图4.28 – 从站点管理页面选择图书\n\n单击**图书**后，如前面的截图所示，您将在屏幕上看到以下内容：\n\n![](img/4840a43efd335abd10b93708225692d6_195_0.png)\n\
  \n图4.29 – 书籍修改页面\n\n在本例中，选择书籍*智能架构师*将把我们带到URL http://127.0.0.1:8000/admin/reviews/book/3/change/。在之前的示例中，所有模型字段都被渲染为简单的HTML文本控件。`models.Book`中使用的`django.db.models.Field`的其他一些子类的渲染方式值得进一步研究：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_196_0.png)\n\n### 图4.30 – 修改书籍页面\n\n\
  这里，publication_date是使用models.DateField定义的。它使用日期选择控件渲染。控件的视觉表示会因不同的操作系统和浏览器选择而有所不同：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_196_1.png)\n\n### 图4.31 – 日期选择控件\n\n\
  由于Publisher被定义为外键关系，它被渲染为一个**Publisher**下拉菜单，其中包含Publisher对象的列表：\n\n![](img/4840a43efd335abd10b93708225692d6_197_0.png)\n\
  \n图4.32 – Publisher下拉菜单\n\n这让我们了解到管理应用如何处理删除操作。管理应用在确定如何实现删除功能时，会从模型的外键约束中获取线索。在BookContributor模型中，Contributor被定义为外键。reviews/models.py中的代码如下所示：\n\
  \n```\n```python\ncontributor = models.ForeignKey(Contributor,\n    on_delete=models.CASCADE)\n\
  ```\n```\n\n通过在外键上设置 `on_delete=CASCADE`，模型指定了删除记录时所需的数据库行为；删除操作会级联到外键引用的其他对象。\n\
  \n理解外键设置对删除流程的影响非常重要，下面的练习将探讨这一点。\n\n## 练习4.03 – 管理应用中的外键与删除行为\n\n目前，reviews模型中的所有`ForeignKey`关系都定义为`on_delete=CASCADE`行为。例如，假设管理员删除一个出版商，这将删除与该出版商关联的所有图书。我们不希望发生这种情况，而这正是我们将在本练习中更改的行为：\n\
  \n- 1. 访问`http://127.0.0.1:8000/admin/reviews/contributor/`处的**贡献者**更改列表，并选择一个要删除的贡献者。确保该贡献者是一本书的作者。\n\
  - 2. 单击**删除**按钮，但不要单击确认对话框上的**是的，我确定**。您将看到类似于*图4.33*中的消息：\n\n### 您确定吗？\n\n您确定要删除贡献者“Rowel”吗？以下所有相关项都将被删除：\n\
  \n### 摘要\n\n- 贡献者：1\n- 书籍贡献者：1\n\n### 对象\n\n- 贡献者：Rowel\n  - 书籍贡献者：BookContributor\
  \ object (19)\n\n是的，我确定\n不，带我返回\n\n图4.33 – 级联删除确认对话框\n\n根据外键的on_delete=CASCADE参数，我们会收到警告：删除此Contributor对象将对BookContributor对象产生级联影响。\n\
  \n3. 在reviews/models.py文件中，将BookContributor的Contributor属性修改为以下内容并保存文件：\n\n```\n\
  contributor = models.ForeignKey(Contributor,\n    on_delete=models.PROTECT)\n```\n\
  \n4. 现在，再次尝试删除Contributor对象。您将看到类似于图4.34中的消息：\n\n### 无法删除贡献者\n\n删除贡献者“Rowel”将需要删除以下受保护的相关对象：\n\
  \n- 书籍贡献者：BookContributor object (19)\n\n图4.34 – 外键保护错误\n\n由于on_delete参数为PROTECT，我们尝试删除具有依赖关系的对象将抛出错误。如果我们在模型中使用这种方法，则需要先删除ForeignKey关系中的对象，然后才能删除原始对象。在这种情况下，这意味着在删除Contributor对象之前，需要先删除BookContributor对象。\n\
  \n\n\n\n\n5. 现在我们已经了解了 admin 应用如何处理 ForeignKey 关系，让我们将 BookContributor 类中的 ForeignKey\
  \ 定义恢复为以下内容：\n\n```\ncontributor = models.ForeignKey(Contributor,\n    on_delete=models.CASCADE)\n\
  ```\n\n我们已经考察了 admin 应用的行为如何适应在模型定义中表达的 ForeignKey 约束。如果 `on_delete` 行为设置为 `models.PROTECT`，admin\
  \ 应用会返回一个错误，解释为什么受保护的对象阻止了删除。在构建真实应用时，此功能非常有用，因为手动错误意外导致重要记录被删除的情况时有发生。在下一节中，我们将了解如何自定义\
  \ admin 应用界面以获得更流畅的用户体验。\n\n## 自定义 admin 界面\n\n在最初开发应用程序时，默认 admin 界面的便利性对于构建应用的快速原型非常出色。事实上，对于许多更简单的应用程序或仅需要最少数据维护的项目而言，此默认\
  \ admin 界面可能完全足够。然而，随着应用程序成熟到发布阶段，admin 界面通常需要进行自定义，以便更直观地使用并在用户权限范围内稳健地控制数据。你可能希望保留默认\
  \ admin 界面的某些方面，同时对某些功能进行一些调整以更好地满足你的目的。例如，你希望出版商列表显示出版商的完整名称，而不是 Publisher (1)、Publisher\
  \ (2) 等等。除了美观之外，这还使使用和在应用中导航变得更容易。\n\n在本节中，我们将研究 AdminSite 对象并了解其一些重要属性，这些属性可用于修改\
  \ admin 应用的全局外观。然后我们将研究在项目中对 AdminSite 进行子类化的方法，以便我们可以对其进行自定义而不是使用其默认外观。最后，我们将通过创建一个新项目并自定义其\
  \ admin 界面来检验我们对这些技术的掌握。\n\n### 全局 Django admin 自定义\n\n我们看到过一个标题为 Log in | Django\
  \ site admin 的页面，其中包含一个 Django 管理表单。然而，Bookr 应用程序的管理用户可能会对所有这些 Django 术语感到困惑，如果他们必须处理多个\
  \ Django 应用，而这些应用都具有相同的 admin 应用，则会非常混乱且容易出错。作为一个直观且用户友好的应用程序的开发者，你应该对其进行自定义。此类全局属性指定为\
  \ AdminSite 对象的属性。下面的表格详细说明了一些最简单的自定义，以提高你的应用 admin 界面的可用性：\n\n| AdminSite 属性 |\
  \ 基础值 | 描述 |\n| --- | --- | --- |\n| `site_title` | `\"Django site admin\"` | 填充\
  \ admin 界面每个页面的 `<title>` 标签。 |\n| `site_header` | `\"Django administration\"` |\
  \ 设置登录表单上的标题。 |\n| `index_title` | `\"Site administration\"` | 设置 admin 索引页面的标题（模型列出之处）。\
  \ |\n| `index_template` | `None` | 提供查找 admin 索引模板的路径。如果未设置，则使用 `admin/index.html`\
  \ 模板。 |\n| `app_index_template` | `None` | 提供查找应用 admin 索引模板的路径。如果未设置，则使用 `admin/app_index.html`\
  \ 模板。 |\n| `login_template` | `None` | 提供查找登录模板的路径。如果未设置，则使用 `admin/login.html`\
  \ 模板。 |\n| `logout_template` | `None` | 提供查找注销模板的路径。如果未设置，则使用 `registration/logged_out.html`\
  \ 模板。 |\n| `password_change_template` | `None` | 提供查找密码更改模板的路径。如果未设置，则使用 `registration/password_change_form.html`\
  \ 模板。 |\n| `password_change_done_template` | `None` | 提供查找密码更改完成模板的路径。如果未设置，则使用\
  \ `registration/password_change_done.html` 模板。 |\n\n图 4.35 – 重要的 AdminSite 属性\n\n\
  如果这看起来有点抽象，检查本表格中的属性使用 Django shell 可能会有所帮助。\n\n### 从 Python shell 检查 AdminSite\
  \ 对象\n\n让我们更深入地研究 AdminSite 类。我们已经遇到过 AdminSite 类的一个对象。它就是我们在上一个 *Registering the\
  \ reviews model* 部分中使用的 `admin.site` 对象。如果开发服务器未运行，现在使用 `runserver` 子命令启动它，如下所示（Windows\
  \ 上使用 `python` 而不是 `python3`）：\n\n```\npython3 manage.py runserver\n```\n\n我们可以通过再次使用\
  \ `manage.py` 脚本在 Django shell 中导入 admin 应用来检查 `admin.site` 对象：\n\n```\npython3\
  \ manage.py shell\n>>> from django.contrib import admin\n```\n\n我们可以交互式地检查 `site_title`、`site_header`\
  \ 和 `index_title` 的默认值，并看到它们与我们在 Django admin 应用的渲染网页上已观察到的预期值 `'Django site admin'`、`'Django\
  \ administration'` 和 `'Site administration'` 相匹配：\n\n```\n>>> admin.site.site_title\n\
  'Django site admin'\n>>> admin.site.site_header\n'Django administration'\n>>> admin.site.index_title\n\
  'Site administration'\n```\n\nAdminSite 类还指定了用于渲染 admin 界面并确定其全局行为的表单和视图。\n\n现在我们已经检查了对象的属性，我们将尝试对其进行子类化，以便在我们的\
  \ Django 项目中自定义它们。\n\n### 对 AdminSite 进行子类化 – 第一种方法\n\n我们可以对 `reviews/admin.py`\
  \ 文件进行一些修改。不是导入 `django.contrib.admin` 模块并使用其 `site` 对象，我们将导入 `AdminSite`，对其进行子类化，并实例化我们自定义的\
  \ `admin_site` 对象。考虑以下代码片段。这里，`BookrAdminSite` 是 `AdminSite` 的子类，包含 `site_title`、`site_header`\
  \ 和 `index_title` 的自定义值；`admin_site` 是 `BookrAdminSite` 的实例，我们可以使用它代替默认的 `admin.site`\
  \ 对象来注册我们的模型。`reviews/admin.py` 文件将如下所示：\n\n```\nfrom django.contrib.admin import\
  \ AdminSite\nfrom reviews.models import (Publisher, Contributor, Book,\n    BookContributor,\
  \ Review)\n\nclass BookrAdminSite(AdminSite):\n    site_title = 'Bookr Admin'\n\
  \    site_header = 'Bookr administration'\n    index_title = 'Bookr site admin'\n\
  \nadmin_site = BookrAdminSite(name='bookr')\n\n# Register your models here.\nadmin_site.register(Publisher)\n\
  admin_site.register(Contributor)\nadmin_site.register(Book)\nadmin_site.register(BookContributor)\n\
  admin_site.register(Review)\n```\n\n现在我们创建了自己的 `admin_site` 对象，该对象覆盖了 `admin.site`\
  \ 对象的行为，我们需要在代码中删除对 `admin.site` 对象的现有引用。在 `bookr/urls.py` 中，我们需要将 admin 指向新的 `admin_site`\
  \ 对象并更新我们的 URL 模式。否则，我们仍在使用默认的 admin 站点，我们的自定义将被忽略。更改将如下所示：\n\n```\nfrom reviews.admin\
  \ import admin_site\nimport reviews.views\nfrom django.urls import include, path\n\
  \nurlpatterns = [\n    path(\"admin/\", admin_site.urls),\n    path(\"book-search\"\
  , reviews.views.book_search),\n    path(\"\", include(\"reviews.urls\")),\n]\n```\n\
  \n这在登录屏幕上产生了预期的结果：\n\n![](img/4840a43efd335abd10b93708225692d6_203_0.png)\n\n图 4.36\
  \ – 自定义登录屏幕\n\n然而，现在出现了一个问题；我们丢失了 auth 对象的界面。以前，admin 应用通过自动发现过程发现了在 `reviews/admin.py`\
  \ 和 `django.contrib.auth.admin` 中注册的模型，但现在我们通过创建新的 AdminSite 覆盖了此行为：\n\n![](img/4840a43efd335abd10b93708225692d6_203_1.png)\n\
  \n图 4.37 – 自定义 AdminSite 缺少身份验证和授权\n\n\n\n\n\n我们可以在 `bookr/urls.py` 中将两个 `AdminSite`\
  \ 对象都引用到 URL 模式，但这种方法会导致我们最终拥有两个独立的 admin 应用，一个用于认证，一个用于 reviews。因此，URL `http://127.0.0.1:8000/admin`\
  \ 将带你进入从 `admin.site` 对象派生的原始 admin 应用，而 `http://127.0.0.1:8000/bookradmin` 将带你进入我们的\
  \ `BookrAdminSite`，`admin_site`。这不是我们想要做的，因为我们仍然会剩下没有我们通过子类化 `BookrAdminSite` 时添加的自定义的\
  \ admin 应用：\n\n```\n```python\nfrom django.contrib import admin\nfrom reviews.admin\
  \ import admin_site\nfrom django.urls import path\nurlpatterns = [path('admin/',\
  \ admin.site.urls),\n               path('bookradmin/', admin_site.urls),]\n```\n\
  ```\n\n为避免此问题，让我们在下一小节中看看我们可以做什么。\n\n## Subclassing AdminSite – a better way\n\n\
  这一直是 Django admin 界面中一个笨拙的问题，导致早期版本中出现了大量临时解决方案。然而，自 Django 2.1 发布以来，已经有一种简单的方法可以在不破坏自动发现或其任何其他默认功能的情况下集成\
  \ admin 应用的自定义界面。让我们通过以下步骤看看如何操作：\n\n- 1. 由于 `BookrAdminSite` 是项目特定的，代码实际上不属于我们的\
  \ reviews 文件夹。因此，将 `BookrAdminSite` 移动到 Bookr 项目目录顶层名为 `admin.py` 的新文件中：\n\n```\n\
  ```python\nfrom django.contrib import admin\n\nclass BookrAdminSite(admin.AdminSite):\n\
  \    title_header = 'Bookr Admin'\n    site_header = 'Bookr administration'\n  \
  \  index_title = 'Bookr site admin'\n```\n```\n\n`bookr/urls.py` 中的 URL 设置路径更改为\
  \ `path('admin/', admin.site.urls)`，我们定义我们的 `ReviewsAdminConfig`。\n\n- 2. 添加一个名为\
  \ `reviews/adminconfig.py` 的文件，包含以下内容：\n\n```\n```python\nfrom django.contrib.admin.apps\
  \ import AdminConfig\nclass ReviewsAdminConfig(AdminConfig):\n    default_site =\
  \ 'admin.BookrAdminSite'\n```\n```\n\n3. 用 reviews.apps.ReviewsAdminConfig 替换 django.contrib.admin，以便\
  \ INSTALLED_APPS 在 bookr/settings.py 文件中如下所示：\n\n```\nINSTALLED_APPS = [\n    'reviews.adminconfig.ReviewsAdminConfig',\n\
  \    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n\
  \    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'reviews']\n\
  ```\n\n有了 ReviewsAdminConfig 对 default_site 的指定，我们不再需要用自定义的 AdminSite 对象 admin_site\
  \ 替换对 admin.site 的引用。我们可以用我们最初拥有的 admin.site 调用替换那些 admin_site 调用。现在，reviews/admin.py\
  \ 恢复为以下内容：\n\n```\nfrom django.contrib import admin\nfrom reviews.models import\
  \ (Publisher, Contributor,\n    Book, BookContributor, Review)\n\n# Register your\
  \ models here.\nadmin.site.register(Publisher)\nadmin.site.register(Contributor)\n\
  admin.site.register(Book, BookAdmin)\nadmin.site.register(BookContributor)\nadmin.site.register(Review)\n\
  ```\n\n我们还可以自定义 AdminSite 的其他方面，但我们将在第 9 章《Sessions and Authentication》中重新审视这些内容，一旦我们对\
  \ Django 的模板和表单有更全面的理解。\n\n以下活动旨在测试你为新 Django 项目配置和自定义 Django admin 应用而学到的技能。\n\n\
  ## Activity 4.02 – customizing the AdminSite object\n\n你已经学会了如何在 Django 项目中修改 AdminSite\
  \ 对象的属性。此活动将挑战你使用这些技能来定制一个新项目并覆盖其站点标题、站点头部和索引头部。此外，你还将通过创建项目特定的模板并将其设置在我们的自定义 AdminSite\
