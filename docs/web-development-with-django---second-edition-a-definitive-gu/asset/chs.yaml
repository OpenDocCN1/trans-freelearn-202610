  \ disabled={ this.state.fetchInProgress }>{buttonText}\n</button>\n</div>;\n}\n\
  ```\n\n这使用 map 方法遍历 state 中的 books 数组。我们为每本书生成 <li>，使用书籍的 pk 作为列表项的 key 实例。<li>\
