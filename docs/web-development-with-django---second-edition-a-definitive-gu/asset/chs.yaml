  \                .media\",\n            ],\n```\n```\n```\n},\n},\n]\n```\n\n完整的文件应如下所示：https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter08/Exercise8.02/media_project/media_project/settings.py。\n\
