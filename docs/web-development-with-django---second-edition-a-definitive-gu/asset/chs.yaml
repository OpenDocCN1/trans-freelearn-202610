  > 你现在不需要测试上传文件，因为结果与练习 8.04 – 使用 Django 表单上传文件 中的结果相同。\n\n- 4. 你需要做的第一件事是确保 Pillow\
  \ 库已安装。在终端中（确保已激活虚拟环境），运行以下命令：\n\n```\npip3 install pillow\n```\n\n（在 Windows 中，这是\
