  \ for brevity\n    \"media_example\",\n]\n```\n```\n\n+   2. 文件大约 halfway 下方，你会找到\
  \ `TEMPLATES` 设置，它是一个字典。其内部是 `OPTIONS` 项（另一个字典）。`OPTIONS` 内部是 `context_processors`\
