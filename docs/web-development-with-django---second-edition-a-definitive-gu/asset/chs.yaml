  \n## 高级表单验证和\n模型表单\n\n继续使用你在上一章开始的 `form_project` 应用程序，你将在本章开始时为你的应用添加一个新表单，其中包含自定义多字段验证和表单清理。你将学习如何设置表单的初始值以及自定义小部件（生成的\
  \ HTML 输入元素）。然后，你将被介绍 `ModelForm` 类，它允许表单从模型自动创建。你将在视图中使用它来自动保存新的或更改的 Model 实例。\n\
  \n在本章中，我们将通过引入构成大多数生产网站基础的概念，进一步深入 Django 表单验证的知识。\n\n例如，某个字段可能仅在另一个字段设置时才需要。假设我们想添加一个复选框，让用户订阅我们的月度新闻通讯。其下方有一个文本框，让他们输入电子邮件地址。通过一些基本验证，我们可以检查以下内容：\n\
  \n- 用户是否已勾选复选框\n- 用户是否已输入其电子邮件地址\n\n当用户点击 **Submit** 按钮时，我们将能够验证两个字段是否都被操作。但如果用户不想订阅我们的新闻通讯呢？如果他们点击\
  \ **Submit** 按钮，理想情况下，两个字段都应为空。这就是验证每个字段可能不起作用的地方。\n\n另一个例子可能是我们有两个字段，每个字段的最大值为\
  \ 50。但两个字段的总和必须小于 75。我们将从本章开始，探讨如何编写自定义验证规则来解决此类问题。\n\n之后，随着本章的进展，我们将查看如何在表单上设置初始值。这在自动填写用户已知的<|message|>信息时很有用。例如，如果用户已登录，我们可以自动将用户的联系信息填入表单。\n\
  \n我们将通过查看模型表单来结束本章，它将允许我们从 Django Model 类自动创建表单。这减少了创建新 Model 实例所需编写的代码量。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 自定义字段验证和清理\n- 添加占位符和初始值\n- 创建或编辑 Django 模型\n\n到本章结束时，你将知道如何为 Django 表单添加额外的多字段验证，如何自定义和设置字段的表单小部件，如何使用\
  \ ModelForms 从 Django 模型自动创建表单，以及如何从 ModelForms 自动创建 Model 实例。\n\n## 技术要求\n\n本章的完整代码文件可在\
  \ https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter07\
  \ 找到\n\n## 自定义字段验证和清理\n\n我们已经看到 Django 表单如何将来自 HTTP 请求的值（字符串）转换为 Python 对象。在非自定义\
  \ Django 表单中，目标类型取决于字段类。例如，IntegerField 派生的 Python 类型是 int，并且字符串值按用户输入的方式原样提供给我们。但是，我们也可以在\
  \ Form 类上实现方法，以任何我们选择的方式更改字段的输出值。这使我们能够清理或过滤用户的输入数据，使其更符合我们的预期。我们可以将整数四舍五入到最接近的\
  \ 10 的倍数，以便适合特定项目的订购批量大小。或者，我们可以将电子邮件地址转换为小写，以便搜索数据一致。\n\n我们也可以实现一些自定义验证器。我们将从几个不同的角度来看验证字段的方法：通过编写自定义验证器，以及通过为字段编写自定义\
  \ clean 方法。每种方法都有其优缺点：自定义验证器可以应用于不同的字段和表单，因此你不必为每个字段编写验证逻辑；自定义 clean 方法必须在你想要清理的每个表单上实现，但更强大，允许验证，因为你可以使用表单中的其他字段或更改字段返回的\
  \ cleaned 值。\n\n## 自定义验证器\n\n验证器只是一个接受值并在值无效时引发 django.core.exceptions.ValidationError\
  \ 的函数——有效性由你编写的代码决定。值是一个 Python 对象（即 cleaned_data，它已经从 POST 请求字符串转换而来）。\n\n下面是一个简单的示例，验证值是否小写：\n\
  \n```\n```python\nfrom django.core.exceptions import ValidationError\n\n\ndef validate_lowercase(value):\n\
  \    if value.lower() != value:\n        raise ValidationError(\"{} is not lowercase.\"\
  \n                              .format(value))\n```\n```\n\n请注意，该函数对成功或失败均不返回任何内容。它只会在值无效时引发\
  \ `ValidationError`。\n\n> **Note**\n> \n> 请注意，`ValidationError` 的行为和处理方式与我们在 Django\
  \ 中看到的其他异常不同。通常，如果你在视图中引发异常，你会从 Django 得到一个 500 状态码的 HTTP 响应（如果你没有在代码中处理异常）。\n>\
  \ \n> 当在验证/清理代码中引发 `ValidationError` 时，Django 表单类会为你捕获该错误；然后，表单的 `is_valid` 方法将返回\
  \ `False`。你不必在可能引发 `ValidationError` 的代码周围编写 try/except 处理程序。\n\n验证器可以作为字段构造函数的\
  \ `validators` 参数传递给表单中的列表；例如，传递给我们 `ExampleForm` 中的 `text_input` 字段：\n\n```\n```python\n\
  class ExampleForm(forms.Form):\n    text_input =\n        forms.CharField(validators=[validate_lowercase])\n\
  ```\n```\n\n现在，如果我们提交表单并且字段包含大写值，我们将收到错误，如下图所示：\n\n- Text is not lowercase.\n\n\
  ![](img/4840a43efd335abd10b93708225692d6_343_0.png)\n\n图 7.1 – 小写文本验证器生效\n\n验证器函数可以在任意数量的字段上使用。在我们的示例中，如果我们希望大量字段强制小写，validate_lowercase\
  \ 可以传递给它们所有。现在，让我们看看如何以另一种方式实现它，使用自定义 clean 方法。\n\n## 清理方法\n\nclean 方法是在 Form 类上创建的，并以\
  \ clean_field_name 格式命名。例如，text_input 的 clean 方法将称为 clean_text_input，books_you_own\
  \ 的 clean 方法将称为 clean_books_you_own，依此类推。\n\n清理方法不接受参数；相反，它们应使用 self 上的 cleaned_data\
  \ 属性来访问字段数据。此字典将包含在标准 Django 方式下清理后的数据，如我们在前一个示例中看到的那样。clean 方法必须返回清理后的值，该值将替换 cleaned_data\
  \ 字典中的原始值。即使该方法没有更改值，也必须返回一个值。你也可以在 clean 方法中使用 raise ValidationError，并且错误将被附加到该字段（与验证器相同）。\n\
  \n让我们将小写验证器重新实现为 clean 方法，如下所示：\n\n```\nclass ExampleForm(forms.Form):\n    text_input\
  \ = forms.CharField()\n    ...\n\n    def clean_text_input(self):\n        value\
  \ = self.cleaned_data[\"text_input\"]\n        if value.lower() != value:\n    \
  \        raise ValidationError(\"{} is not lowercase.\"\n                .format(value))\n\
  \n        return value\n```\n\n你可以看到逻辑本质上是相同的，只是我们必须在最后返回验证后的值。如果我们提交表单，我们将得到与上次尝试相同的结果（图\
  \ 7.1）。\n\n让我们再看一个清理示例。不是在值无效时引发异常，我们可以将其转换为小写。我们将使用以下代码实现它：\n\n```\nclass ExampleForm(forms.Form):\n\
  \    text_input = forms.CharField()\n    ...\n\n    def clean_text_input(self):\n\
  \        value = self.cleaned_data['text_input']\n        return value.lower()\n\
  ```\n\n\n\n\n\n现在，假设我们以大写形式在输入中输入文本：\n\n文本输入：ALL UPPERCASE\n\n图 7.2 – 输入的 ALL UPPERCASE\
  \ 文本\n\n如果我们使用视图中的调试输出来检查清理后的数据，我们会看到它已变为小写：\n\n```\ntext_input: (<class 'str'>)\
  \ all uppercase\n```\n\n图 7.3 – 清理后的数据已被转换为小写\n\n这些只是使用验证器和 clean 方法验证字段的几个简单示例。你当然可以根据需要使每种类型的验证更加复杂，并使用\
  \ clean 方法以更复杂的方式转换数据。\n\n到目前为止，你只学习了简单的表单验证方法，其中每个字段都是独立处理的。字段是否有效（或无效）仅基于其包含的信息，而与其它无关。如果一个字段的有效性取决于用户在另一个字段中输入的内容会怎样？一个例子是，你有一个电子邮件字段，用于收集希望订阅邮件列表的人的电子邮件地址。该字段只有在他们勾选表示希望订阅的复选框时才为必填项。单独来看，这两个字段都不是必填的——我们不希望复选框必须被勾选，但如果被勾选，则电子邮件字段也应为必填。\n\
  \n在下一节中，我们将展示如何通过重写表单中的 clean 方法来验证字段相互依赖的表单。\n\n## 多字段验证\n\n我们刚刚查看了可以添加到 Django\
  \ 表单中的 clean_field_name 方法，用于清理特定字段。Django 还允许我们重写 clean 方法，在其中我们可以访问所有字段的 cleaned_data，并且我们知道所有自定义字段方法都已被调用。这使得字段可以根据另一个字段的数据进行验证。\n\
  \n参考我们之前的示例，即表单中只有在复选框被勾选时才需要电子邮件地址，我们将看看如何使用 clean 方法实现这一点。\n\n首先，创建一个 Form 类并添加两个字段——使用\
  \ required=False 参数使它们都为可选：\n\n```\nclass NewsletterSignupForm(forms.Form):\n  \
  \  signup = forms.BooleanField(label=\"Sign up to newsletter?\", required=False)\n\
  \    email = forms.EmailField(help_text=\"Enter your email address to subscribe\"\
  , required=False)\n```\n\n我们还引入了可用于任何字段的两个新参数：\n\n- label\n  这允许你为字段设置标签文本。如我们所见，Django\
  \ 会从字段名自动生成标签文本。如果设置了 label 参数，你可以覆盖此默认值。如果想要更有描述性的标签，请使用此参数。\n- help_text\n  如果需要显示有关字段所需输入的更多信息，可以使用此参数。默认情况下，它显示在字段之后。\n\
  \n渲染后的表单如下所示：\n\n![](img/4840a43efd335abd10b93708225692d6_346_0.png)\n\n图 7.4 –\
  \ 带自定义标签和帮助文本的电子邮件订阅表单\n\n如果我们现在提交表单且不输入任何数据，什么也不会发生。两个字段都不是必填的，因此表单验证通过。\n\n现在，我们可以在\
  \ clean 方法中添加多字段验证。我们将检查“Sign up to newsletter”复选框是否被勾选，然后检查“Email”字段是否有值。内置的 Django\
  \ 方法已在此阶段验证了电子邮件地址的有效性，因此我们只需要检查是否存在值。我们将使用 add_error 方法为电子邮件字段设置错误。这是你之前未见过的方法，但非常简单；它接受两个参数——要设置错误的字段名，以及错误文本。\n\
  \n以下是 `clean` 方法的代码：\n\n```\nclass NewsletterSignupForm(forms.Form):\n    …\n\n\
  \    def clean(self):\n        cleaned_data = super().clean()\n\n        if cleaned_data[\"\
  signup\"] and not\n            cleaned_data.get(\"email\"):\n                self.add_error(\"\
  email\", \"Your email address is\n                    required if signing up for\
  \ the newsletter.\")\n```\n\n你的 `clean` 方法必须始终调用 `super().clean()` 方法以检索清理后的数据。当调用\
  \ `add_error` 为表单添加错误时，表单将不再验证（`is_valid` 方法返回 `False`）。\n\n现在，如果我们提交表单且未勾选复选框，仍然不会生成错误，但如果你在没有电子邮件地址的情况下勾选复选框，你将收到我们刚刚编写的代码的错误：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_347_0.png)\n\n图 7.5 – 尝试在没有电子邮件地址的情况下订阅时显示的错误\n\
  \n你可能会注意到，我们使用 `get` 方法从 `cleaned_data` 字典中检索电子邮件。之所以这样做，是因为如果表单中的 `email` 值无效，则\
  \ `email` 键将不存在于字典中。浏览器应防止用户在输入无效电子邮件时提交表单，但用户可能使用的是不支持此客户端验证的旧浏览器，因此，出于安全考虑，我们使用\
  \ `get` 方法。由于 signup 字段是 `BooleanField`，且不是必填项，只有在使用自定义验证函数时才会无效。我们这里没有使用，因此使用方括号符号访问其值是安全的。\n\
  \n在进入第一个练习之前，还有一个验证场景需要考虑，那就是添加不特定于任何字段的错误。Django 将这些称为 *非字段错误*。在多个字段相互依赖的情况下，你可能希望在许多场景中使用这些错误。\n\
  \n例如，考虑一个购物网站。你的订单表单可能有两个数值字段，其总和不能超过某个值。如果总和被超过，可以减少任一字段的值以使总和低于最大值，因此错误不特定于任一字段。要添加非字段错误，请调用\
  \ add_error 方法并将第一个参数设为 None。\n\n让我们看看如何实现这一点。在此示例中，我们将有一个表单，用户可以在其中指定要订购的项目 A 或项目\
  \ B 的数量。用户总共不能订购超过 100 件商品。字段将具有 max_value 为 100 和 min_value 为 0，但需要在 clean 方法中编写自定义验证来处理总量的验证：\n\
  \n```\nclass OrderForm(forms.Form):\n    item_a = forms.IntegerField(min_value=0,\
  \ max_value=100)\n    item_b = forms.IntegerField(min_value=0, max_value=100)\n\n\
  \    def clean(self):\n        cleaned_data = super().clean()\n        if cleaned_data.get(\"\
  item_a\", 0) +\n        cleaned_data.get(\"item_b\", 0) > 100:\n            self.add_error(None,\
  \ \"The total number of items must be 100 or less.\")\n```\n\n字段（item_a 和 item_b）以正常方式添加，并带有标准验证规则。你可以看到我们以与之前相同的方式使用了\
  \ clean 方法。此外，我们已在此方法中实现了最大商品逻辑。以下行是在超过最大商品数时注册非字段错误的内容：\n\n```\nself.add_error(None,\
  \ \"The total number of items must be 100 or less.\")\n```\n\n再次，我们使用 get 方法并提供默认值\
  \ 0 来访问 item_a 和 item_b 的值。这是为了防止用户使用旧浏览器（2011 年或更早）并能够提交包含无效值的表单。\n\n在浏览器中，字段级验证确保每个字段中输入的值在\
  \ 0 到 100 之间，否则会阻止表单提交：\n\n![](img/4840a43efd335abd10b93708225692d6_349_0.png)\n\
  \n图 7.6 – 如果某个字段超过最大值，则表单无法提交\n\n然而，如果我们输入两个值，其总和超过 100，我们可以看到 Django 如何显示非字段错误：\n\
  \n- The total number of items must be 100 or less.\n\n![](img/4840a43efd335abd10b93708225692d6_349_1.png)\n\
  \n图 7.7 – 表单开头显示的 Django 非字段错误\n\nDjango 非字段错误始终显示在表单的开头，在其他字段或错误之前。\n\n在以下练习中，我们将构建一个表单，实现验证函数、字段\
  \ clean 方法和表单 clean 方法。\n\n## 练习 7.01 – 自定义 clean 和验证方法\n\n在此练习中，你将构建一个新表单，允许用户为书籍或杂志创建订单。它必须具有以下验证标准：\n\
  \n- 用户最多可订购 80 本杂志和/或 50 本书籍，但商品总数不得超过 100\n- 用户可以选择接收订单确认，如果选择，则必须输入电子邮件地址\n- 如果用户未选择接收订单确认，则不应输入电子邮件地址\n\
  \n\n\n\n\n+   - 为确保其属于我们公司，电子邮件地址必须属于我们公司的域名（就我们而言，我们只需使用 `example.com`）\n+   -\
  \ 为了与其他电子邮件地址保持一致，地址应转换为小写\n\n这听起来像很多规则，但使用 Django，如果我们逐一处理，就会很简单。我们将继续使用你在 *Chapter\
  \ 6, Forms* 中开始的 `form_project` 应用。如果你尚未完成 *Chapter 6, Forms*，你可以从 `https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter06/final/form_project`\
  \ 下载代码。\n\n+   1. 在 PyCharm 中，打开 `form_example` 应用的 `forms.py` 文件。\n\n> **Note**\n\
  > \n> 请确保 Django 开发服务器未在运行；否则，在你修改此文件时它可能会崩溃，导致 PyCharm 跳入调试器。\n\n由于我们对 `ExampleForm`\
  \ 的工作已完成，你可以将其从此文件中删除。\n\n+   2. 创建一个名为 `OrderForm` 的新类，它继承自 `forms.Form`：\n\n```\n\
  ```python\nclass OrderForm(forms.Form):\n```\n```\n\n+   3. 按如下方式向该类添加四个字段：\n+ \
  \  \n+   - `magazine_count`，IntegerField，`min_value` 为 0，`max_value` 为 80\n+   -\
  \ `book_count`，IntegerField，`min_value` 为 0，`max_value` 为 50\n+   - `send_confirmation`，BooleanField，非必填\n\
  +   - `email`，EmailField，也是非必填\n\n该类应如下所示：\n\n```\n```python\nclass OrderForm(forms.Form):\n\
  \    magazine_count = forms.IntegerField(min_value=0,\n                        \
  \                max_value=80)\n    book_count = forms.IntegerField(min_value=0,\n\
  \                                    max_value=50)\n    send_confirmation = \n \
  \       forms.BooleanField(required=False)\n    email = forms.EmailField(required=False)\n\
  ```\n```\n\n4. 添加一个验证函数来检查用户的电子邮件地址是否在正确的域名上。首先，需要导入 ValidationError；将此行添加到文件顶部：\n\
  \n```\nfrom django.core.exceptions import ValidationError\n```\n\n然后，在导入行之后编写此函数（在\
  \ OrderForm 类实现之前）：\n\n```\ndef validate_email_domain(value):\n    if value.split(\"\
  @\")[-1].lower() != \"example.com\":\n        raise ValidationError(\"The email\
  \ address must\n            be on the domain example.com.\")\n```\n\n该函数在 @ 符号上分割电子邮件地址，然后检查其后的部分是否等于\
  \ example.com。此函数单独使用时将验证非电子邮件地址。例如，not-valid@some other domain@example.com 字符串不会在此函数中引发\
  \ ValidationError。这在我们的情况下是可以接受的，因为我们使用的是 EmailField，其他标准字段验证器将检查电子邮件地址的有效性。\n\n\
  5. 将 validate_email_domain 函数作为验证器添加到 OrderForm 上的 email 字段。更新 EmailField 构造函数调用以添加\
  \ validators 参数，并传入包含验证函数的列表：\n\n```\nclass OrderForm(forms.Form):\n    ...\n  \
  \  email = forms.EmailField(required=False,\n        validators=[validate_email_domain])\n\
  ```\n\n6. 添加 clean_email 方法到表单以确保电子邮件地址为小写：\n\n```\nclass OrderForm(forms.Form):\n\
  \    # truncated for brevity\n\n    def clean_email(self):\n        return self.cleaned_data['email'].lower()\n\
  ```\n\n7. 现在，添加 clean 方法以执行所有跨字段验证。首先，我们将仅添加确保只有在请求订单确认时才输入电子邮件地址的逻辑：\n\n```\nclass\
