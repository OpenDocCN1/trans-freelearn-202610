  \n图 16.15 – 解码后的书籍列表输出到控制台\n\n在练习 16.04 – 获取并渲染书籍中，我们将编写一个新的 React 组件，它将获取书籍列表，然后将每本书渲染为一个列表项（`<li>`）。在此之前，我们需要了解\
  \ JavaScript 的 map 方法以及如何在 React 中使用它来构建 HTML。\n\n## JavaScript 的 map 方法\n\n有时，我们希望对不同的输入数据多次执行同一段代码（JavaScript\
  \ 或 JSX）。在本章中，最有用的场景是生成具有相同 HTML 标签但不同内容的 JSX 元素。在 JavaScript 中，map 方法会遍历目标数组，然后为数组中的每个元素执行一次回调函数。这些元素随后会被添加到新数组中，并最终返回该数组。例如，下面的简短代码片段使用\
  \ map 将 numbers 数组中的每个数字翻倍：\n\n```\nconst numbers = [1, 2, 3];\nconst doubled =\
  \ numbers.map((n) => {\n    return n * 2;\n});\n```\n\n现在，doubled 数组包含 [2, 4, 6]\
  \ 这些值。\n\n我们也可以使用这个方法创建 JSX 值的列表。唯一需要注意的是，列表中的每一项都必须设置唯一的 key 属性。在下一个简短示例中，我们将一个数字数组转换为\
  \ `<li>` 元素。然后我们可以将它们放在 `<ul>` 中使用。下面是一个示例 render 函数：\n\n```\nrender() {\n    const\
  \ numbers = [1, 2, 3];\n    const listItems = numbers.map((n) => {\n        return\
  \ <li key={n}>{n}</li>;\n    });\n    return <ul>{listItems}</ul>\n}\n```\n\n渲染后，它将生成以下\
  \ HTML：\n\n```\n<ul>\n    <li>1</li>\n    <li>2</li>\n    <li>3</li>\n</ul>\n```\n\
  \n在下一个练习中，我们将构建一个带有按钮的 React 组件。当按钮被点击时，它会从 API 获取书籍列表，然后显示该列表。\n\n## 练习 16.04 –\
  \ 获取并渲染书籍\n\n在本练习中，我们将创建一个名为 `BookDisplay` 的新组件，它会在 `<ul>` 中渲染一个书籍数组。书籍将使用 `fetch`\
  \ 获取。为此，我们将 React 组件添加到 `react-example.js` 文件中。然后，我们在 Django 模板中将书籍列表的 URL 传递给该组件：\n\
  \n- 1. 在 PyCharm 中，打开你之前在*练习 16.03 的第 9 步 – React 组件属性*中使用的 `react-example.js`。你可以删除整个\
