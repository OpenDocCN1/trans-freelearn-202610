  \ = []\n```\n```\n\n这里，我们删除了 AllBook 和 BookDetail 视图，并用 BookViewSet 和 ReviewViewSet\
  \ 取代。在第一行，我们从 `rest_framework` 导入 ViewSets 模块。BookViewSet 类是 ReadOnlyModelViewSet\
  \ 的子类，这确保视图仅用于 GET 操作。\n\n+   3. 接下来，打开 `bookr/reviews/urls.py` 文件，删除以 `api/` 开头的最初两个\
  \ URL 模式，然后添加以下（高亮显示）代码：\n\n```\n```python\nfrom django.urls import path, include\n\
  from rest_framework.routers import DefaultRouter\nfrom . import views, api_views\n\
  router = DefaultRouter()\nrouter.register(r'books', api_views.BookViewSet)\nrouter.register(r'reviews',\
  \ api_views.ReviewViewSet)\n\nurlpatterns = [\n    path(\n        'api/', include((router.urls,\
  \ 'api'))\n    ),\n    path(\n```\n```\n\n4. 保存所有文件，并在 Django 服务重启后（或手动使用 python\
  \ manage.py runserver 命令启动），转到 http://127.0.0.1:8000/api/books/ URL 获取所有图书的列表。你应该在\
  \ API explorer 中看到以下视图：\n\n![](img/4840a43efd335abd10b93708225692d6_571_0.png)\n\
  \n图 12.5：/api/books 路径上的图书列表\n\n5. 你也可以使用 http://127.0.0.1:8000/api/books/1/ URL\
  \ 访问特定图书的详细信息。在这种情况下，它将返回主键为 1 的图书的详细信息（如果它存在于你的数据库中）：\n\n![](img/4840a43efd335abd10b93708225692d6_572_0.png)\n\
  \n图 12.6：“Advanced Deep Learning with Keras” 的图书详情\n\n在本练习中，我们看到了如何使用 ViewSets 和路由器将列表和详情视图组合到单个\
  \ viewset 中。使用 ViewSets 使我们的代码更一致、更符合惯例，使与其他开发人员协作变得更容易。当与独立的前端应用集成时，这变得尤为重要。在下一节中，我们将简要了解不同类型的身份验证并为图书评论应用实现基于令牌的身份验证。\n\
  \n## 实现身份验证\n\n正如我们在第 9 章《会话和身份验证》中学到的，验证应用用户的身份非常重要。良好的做法是只允许在应用中注册的用户登录并访问应用信息。同样，对于\
  \ REST API，我们也需要在传递任何信息之前设计一种验证和授权用户的方式。例如，假设 Facebook 网站发出 API 请求以获取帖子的所有评论列表。如果该端点没有身份验证，你就可以以编程方式获取你想要的任何帖子的评论。他们显然不希望允许这样做，因此需要实现某种身份验证。\n\
  \n\n\n\n\n存在不同的认证方案，例如 **basic authentication**、**session authentication**、**token\
  \ authentication**、**remote user authentication**，以及各种第三方认证解决方案。对于本章的范围以及我们的 Bookr\
  \ 应用，我们将使用 token 认证。\n\n> **Note**\n> 有关所有认证方案的进一步阅读，请参阅 https://www.django-rest-framework.org/api-guide/authentication\
  \ 上的官方文档。\n\n## Token-based authentication\n\n基于令牌的认证通过为用户生成一个唯一的令牌来工作，以换取用户的用户名和密码。一旦令牌生成，它将被存储在数据库中以供进一步参考，并在每次登录时返回给用户。\n\
  \n此令牌是用户独有的，用户随后可以使用它来授权他们发出的每个 API 请求。基于令牌的认证消除了在每个请求中传递用户名和密码的需求。它更安全，非常适合客户端-服务器通信，例如基于\
  \ JavaScript 的 Web 客户端通过 REST API 与后端应用程序交互。\n\n一个例子是 ReactJS 或 AngularJS 应用程序通过\
  \ REST API 与 Django 后端交互。\n\n如果您正在开发移动应用程序以通过 REST API 与后端服务器交互，也可以使用相同的架构，例如 Android\
  \ 或 iOS 应用程序通过 REST API 与 Django 后端交互。\n\n## Exercise 12.05 – Implementing token-based\
  \ authentication for Bookr APIs\n\n在本练习中，您将为 bookr 应用程序的 API 实现基于令牌的认证：\n\n- 1.\
  \ 打开 bookr/settings.py 文件并将 rest_framework.authtoken 添加到 INSTALLED_APPS：\n\n```\n\
  INSTALLED_APPS = [\n  'django.contrib.admin',\n  'django.contrib.auth',\n  'django.contrib.contenttypes',\n\
  \  'django.contrib.sessions',\n  'django.contrib.messages',\n  'django.contrib.staticfiles',\n\
  \  'rest_framework',\n  'rest_framework.authtoken',\n  'reviews']\n```\n\n- 2. 由于\
  \ authtoken 应用有相关的数据库更改，请在命令行/终端中按如下方式运行 migrate 命令：\n\n```\npython manage.py migrate\n\
  ```\n\n- 3. 打开 bookr/reviews/api_views.py 文件，删除任何现有代码，并替换为以下内容：\n\n```\nfrom django.contrib.auth\
  \ import authenticate\nfrom rest_framework import viewsets\nfrom rest_framework.authentication\
  \ import\n    TokenAuthentication\nfrom rest_framework.authtoken.models import Token\n\
  from rest_framework.pagination import\n    LimitOffsetPagination\nfrom rest_framework.permissions\
  \ import IsAuthenticated\nfrom rest_framework.response import Response\nfrom rest_framework.status\
  \ import HTTP_404_NOT_FOUND,\n    HTTP_200_OK\nfrom rest_framework.views import\
  \ APIView\n```\n\n您可以在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/blob/main/Chapter12/Exercise12.05/bookr/reviews/api_views.py\
  \ 找到此文件的完整代码。\n\n在这里，我们定义了一个名为 Login 的视图。此视图的目的是允许用户获取（如果尚不存在则创建）一个令牌，以便他们可以使用它来对\
  \ API 进行认证。\n\n我们重写此视图的 post 方法，因为我们希望自定义用户向我们发送数据（即他们的登录详细信息）时的行为。首先，我们使用 Django\
  \ auth 库中的 authenticate 方法来检查用户名和密码是否正确。如果正确，则我们将拥有一个用户对象。如果不正确，我们将返回 HTTP 404 错误。如果我们确实拥有有效的用户对象，那么我们只需获取或创建令牌并将其返回给用户。\n\
  \n- 4. 接下来，让我们将 authentication class 添加到 BookViewSet。这意味着当用户尝试访问此 viewset 时，它将要求他们使用基于令牌的认证进行认证。请注意，可以包含不同接受的认证方法的列表，而不仅仅是一种。我们还添加了\
  \ permissions_classes 属性，它只是使用 DRF 的内置类来检查给定用户是否有权限查看此模型中的数据：\n\n```\nclass BookViewSet(viewsets.ReadOnlyModelViewSet):\n\
  \    queryset = Book.objects.all()\n    serializer_class = BookSerializer\n    authentication_classes\
  \ = [TokenAuthentication]\n    permission_classes = [IsAuthenticated]\n```\n\n>\
  \ **Note**\n> \n> 上述代码（高亮显示）与您在 GitHub 上看到的代码不匹配，因为我们在第 9 步中稍后会对其进行修改。\n\n- 5. 打开\
  \ `bookr/reviews/urls.py` 文件并在 URL 模式中添加以下路径：\n\n```\npath(\n    'api/login', api_views.Login.as_view(),\n\
  \    name='login'\n)\n```\n\n- 6. 保存文件并等待应用程序重启，或使用 `python manage.py runserver`\
  \ 命令手动启动服务器。然后使用 `http://127.0.0.1:8000/api/login` URL 访问应用程序。您的屏幕应如下所示：\n\n![](img/4840a43efd335abd10b93708225692d6_575_0.png)\n\
  \n`/api/login` 上的 API 仅为 POST 消息；因此显示 Method GET not allowed。\n\n7. 接下来，在 Content\
  \ 字段中输入以下片段并点击 POST：\n\n```\n{\n\"username\": \"Peter\",\n\"password\": \"testuserpassword\"\
  \n}\n```\n\n您需要将其替换为您数据库中账户的实际用户名和密码。现在您可以看到为用户生成的令牌。这是我们需要用来访问 BookSerializer 的令牌：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_576_0.png)\n\n图 12.8：为用户生成的令牌\n\n8. 尝试使用我们之前创建的\
  \ API 在 http://127.0.0.1:8000/api/books/ 访问图书列表。请注意，您现在不被允许访问它。这是因为此 viewset 现在要求您使用令牌进行认证。\n\
  \n相同的 API 可以使用命令行上的 curl 访问：\n\n```\ncurl -X GET http://127.0.0.1:8000/api/books/\n\
  \n{\"detail\":\"Authentication credentials were not provided.\"}\n```\n\n由于未提供令牌，因此显示\
  \ `Authentication credentials were not provided` 消息：\n\n![](img/4840a43efd335abd10b93708225692d6_577_0.png)\n\
  \n图 12.9：提示未提供认证详细信息的消息\n\n请注意，如果您使用的是 Windows 10，请将上述命令中的 `curl` 替换为 `curl.exe`\
  \ 并从命令提示符执行。\n\n要将 Authorization 令牌（在第 7 步获得）作为 header 传递，您可以使用以下命令（Windows 用户可以将\
  \ `curl` 替换为 `curl.exe`）：\n\n```\n```bash\ncurl -X GET http://127.0.0.1:8000/api/books/\
  \ -H \"Authorization: Token cd5dafa1d4361df1502652d260eed3ddb55c64f1\"\n```\n```\n\
  \n> **Note**\n> \n> 在粘贴此命令之前，请确保您已将令牌替换为您在执行本练习第 7 步时获得的令牌。它与我们在此处显示的不同。\n\n上述命令现在应返回图书列表：\n\
  \n```\n```json\n[{\"title\":\"Advanced Deep Learning with Keras\",\"publication_date\"\
  :\"2018-10-31\",\"isbn\":\"9781788629416\",\"publisher\":{\"name\":\"Packt Publishing\"\
  ,\"website\":\"https://www.packtpub.com/\",\"email\":\"info@packtpub.com\"},\"rating\"\
  :4,\"reviews\":[{\"content\":\"A must read for all\",\"date_created\":... (truncated)\n\
  ```\n```\n\n此操作确保只有应用程序的现有用户才能访问并获取所有图书的集合。\n\n9. 在继续之前，将 BookViewSet 上的 authentication\
  \ 和 permission classes 设置为空字符串。未来的章节将不会使用这些认证方法，并且为了简单起见，我们假设未经认证的用户可以访问我们的 API：\n\
  \n```\nclass BookViewSet(viewsets.ReadOnlyModelViewSet):\n    queryset = Book.objects.all()\n\
  \    serializer_class = BookSerializer\n    authentication_classes = []\n    permission_classes\
  \ = []\n```\n\n在本练习中，我们在 Bookr 应用中实现了基于令牌的认证。我们创建了一个登录视图，允许我们检索给定已认证用户的令牌。这随后使我们能够通过在请求中将令牌作为\
  \ header 传递，从命令行发出 API 请求。\n\n总体而言，在本节中，我们了解了不同类型的认证，然后在与 REST API 协作时详细了解了令牌认证和授权。\n\
  \n## Summary\n\n本章介绍了 REST API，这是大多数现实世界 Web 应用程序中的基本构建块。这些 API 促进了后端服务器与 Web 浏览器之间的通信，因此对于您作为\
  \ Django Web 开发人员的成长至关重要。我们学习了如何序列化数据库中的数据，以便通过 HTTP 请求传输。接下来，我们了解了 DRF 为我们提供的各种选项来简化我们编写的代码，利用模型本身的现有定义。我们还介绍了\
  \ ViewSets 和路由器，并看到了它们如何通过结合多个视图的功能来进一步压缩代码。最后，我们了解了认证和授权，并为图书评论应用实现了基于令牌的认证。\n\n\
  在下一章中，我们将通过学习如何生成 CSV、PDF 和其他二进制文件类型来扩展 Bookr 的用户功能。\n\n\n\n\n\n## 生成 CSV、PDF 及其他二进制文件\n\
  \n到目前为止，我们已经学习了 Django 框架的各个方面，并探索了如何使用 Django 构建具有我们想要的所有功能和自定义的 Web 应用程序。\n\n\
  假设在构建 Web 应用程序时，我们需要进行一些分析和准备一些报告。我们可能需要分析用户的人口统计数据，了解平台的使用情况，或生成可输入机器学习系统以寻找模式的数据。我们希望我们的网站以表格格式显示分析结果的一部分，并以详细的图表和图形显示其他结果。此外，我们希望允许用户导出报告，并在\
  \ Jupyter Notebook 和 Excel 等应用程序中进一步查看。\n\n随着我们逐步学习本章，我们将学习如何将这些想法付诸实践，并在我们的 Web\
  \ 应用程序中实现功能，允许我们将记录导出为结构化格式，例如通过使用逗号分隔值（CSV）文件或 Excel 文件的表格。我们还将学习如何允许用户生成我们 Web\
  \ 应用程序中存储的数据的可视化表示，并以 PDF 格式导出，以便于快速参考时轻松分发。\n\n让我们从学习如何在 Python 中处理 CSV 文件开始。学习这项技能将帮助我们创建允许读者导出数据以进行进一步分析的功能。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 在 Python 内部处理 CSV 文件\n- 使用 Python 的 csv 模块\n- 在 Python 中处理\
  \ Excel 文件\n- 在 Python 中处理 PDF 文件\n- 在 Python 中玩转图表\n- 将可视化与 Django 集成\n\n## 技术要求\n\
  \n本章的完整代码文件可以在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter13\
  \ 找到\n\n## 在 Python 内部处理 CSV 文件\n\n我们可能需要导出应用程序中的数据，有几个原因。其中一个原因可能涉及分析该数据——例如，我们可能需要了解在应用程序上注册的用户的人口统计数据，或提取应用程序使用模式。我们可能还需要了解我们的应用程序对用户的工作情况，以便设计未来的改进。此类用例要求数据采用易于使用和分析的格式。在这里，CSV\
  \ 文件格式派上了用场。\n\nCSV 是一种方便的文件格式，可用于以行列格式快速从应用程序导出数据。CSV 文件通常使用简单的分隔符分隔数据，用于区分一列和另一列，并使用换行符来指示表中新记录（或行）的开始。\n\
  \nPython 在其标准库中对处理 CSV 文件有很好的支持，这要归功于 csv 模块。此支持使读取、解析和写入 CSV 文件成为可能。让我们看看如何利用 Python\
  \ 提供的 csv 模块来处理 CSV 文件并从中读取和写入数据。\n\n## 使用 Python 的 csv 模块\n\nPython 的 csv 模块允许我们与\
  \ CSV 格式的文件进行交互，这只是一种文本文件格式——也就是说，存储在 CSV 文件中的数据是人类可读的。\n\ncsv 模块要求在应用 csv 模块提供的方法之前先打开文件。让我们看看如何开始最基本的操作——从\
  \ CSV 文件读取数据。\n\n### 从 CSV 文件读取数据\n\n从 CSV 文件读取数据非常容易，并且包含以下步骤：\n\n首先，我们必须通过运行以下脚本打开文件：\n\
  \n```\ncsv_file = open('path to csv file')\n```\n\n这里，我们使用 Python 的 open() 方法读取文件，该方法需要文件的完全限定名称。这应该打开，以便将其作为参数传递给方法。\n\
  \n然后，我们必须使用 csv 模块的 reader 方法从文件对象读取数据：\n\n```\nimport csv\ncsv_data = csv.reader(csv_file)\n\
  ```\n\n2. 一旦文件下载完成，打开它并查看其内容。你会意识到该文件包含一组用逗号分隔的值，每个不同的记录都在自己的行上：\n\n![](img/4840a43efd335abd10b93708225692d6_582_0.png)\n\
  \n图 13.1 – market_cap CSV 文件的内容\n\n3. 一旦文件下载完成，你可以编写第一段代码。为此，在 CSV 文件下载的同一目录中创建一个名为\
  \ csv_reader.py 的新文件，并添加以下代码：\n\n```\nimport csv\n\ndef read_csv(filename):\n  \
  \  \"\"\"Read and output the details of CSV file.\"\"\"\n    try:\n        with\
  \ open(filename, newline='') as csv_file:\n            csv_reader = csv.reader(csv_file)\n\
  \            for record in csv_reader:\n                print(record)\n    except\
  \ (IOError, OSError) as file_read_error:\n```\n\n```\nprint(\"Unable to open the\
  \ csv file. Exception: {}\".format(file_read_error))\n\nif __name__ == '__main__':\n\
  \    read_csv('market_cap.csv')\n```\n\n让我们尝试理解你在前面的代码片段中实现的内容。\n\n在导入 csv 模块后，为了保持代码模块化，你创建了一个名为\
  \ read_csv() 的新方法，它接受一个参数——要从中读取数据的文件名：\n\n```\ntry:\n    with open(filename, newline='')\
  \ as csv_file:\n```\n\n现在，如果你不熟悉前面代码片段中显示的打开文件的方法，这也称为 try-with-resources 方法。在这种情况下，封装在\
  \ with 块范围内的任何代码块都将有权访问文件对象，并且一旦代码退出 with 块的范围，文件将自动关闭。\n\n**重要说明**\n\n将文件 I/O 操作封装在\
  \ try-except 块中是一个好习惯，因为文件 I/O 可能因多种原因而失败，向用户显示堆栈跟踪不是一个好选择。\n\nreader() 方法返回一个 reader\
  \ 对象，你可以对其进行迭代以访问值，正如我们在 从 CSV 文件读取数据 部分所看到的：\n\n```\nfor record in csv_reader:\n\
  \    print(record)\n```\n\n完成此操作后，你必须编写入口点方法，从该方法开始执行你的代码，通过调用 read_csv() 方法并传递要读取的\
  \ CSV 文件的名称：\n\n```\nif __name__ == '__main__':\n    read_csv('market_cap.csv')\n\
  ```\n\n4. 这样，你就完成了并准备好解析你的 CSV 文件。你可以通过在终端或命令提示符中运行你的 Python 文件来做到这一点，如下所示：\n\n\
