  \ 类替换它。第一个参数（默认值）应为 SQLite 数据库的 URL：f'sqlite:///{BASE_DIR}/db.sqlite3'。同时传入 environ_prefix，设置为\
  \ DJANGO。完成此步骤后，你应像这样设置该属性：\n\n```\nDATABASES = values.DatabaseURLValue(\n    f'sqlite:///{BASE_DIR}/db.sqlite3',\n\
