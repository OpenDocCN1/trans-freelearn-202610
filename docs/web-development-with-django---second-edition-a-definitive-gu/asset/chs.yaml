  from django.contrib import admin\nfrom django.urls import path\nfrom django.conf\
  \ import settings\nfrom django.conf.urls.static import static\n\nurlpatterns = [\n\
  ```\n\n```\npath(\"admin/\", admin.site.urls),\n]\n```\n\n8. 然后，在 urlpatterns 定义之后立即添加以下代码（参考上一步中的代码块），以条件性地将\
  \ MEDIA_URL 设置映射到静态视图，该视图将从 MEDIA_ROOT 提供文件服务：\n\n```\nif settings.DEBUG:\n    urlpatterns\
  \ += static(settings.MEDIA_URL,\n    document_root=settings.MEDIA_ROOT)\n```\n\n\
  现在可以保存此文件了。它应如下所示：https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter08/Exercise8.01/media_project/media_project/urls.py。\n\
  \n9. 启动 Django 开发服务器（如果尚未运行），然后访问 http://127.0.0.1:8000/media/test.txt。如果一切正确，您应该在浏览器中看到\
  \ Hello, world! 文本：\n\n![](img/4840a43efd335abd10b93708225692d6_392_0.png)\n\n图\
  \ 8.3：提供媒体文件服务\n\n如果您的浏览器显示如图 8.3 所示，则说明媒体文件正在从 MEDIA_ROOT 目录提供。\n\n我们创建的 test.txt\
  \ 文件仅用于测试，但在练习 8.02 – 模板设置及在模板中使用 MEDIA_URL 中我们还会用到它，所以暂时不要删除。\n\n在此练习中，我们配置了 Django\
  \ 来提供媒体文件服务。我们提供了一个测试文件，以确保一切按预期工作，结果也确实如此。接下来，我们将了解如何在模板中自动生成媒体 URL。\n\n## 上下文处理器与在模板中使用\
  \ MEDIA_URL\n\n要在模板中使用 MEDIA_URL，我们可以通过视图中的渲染上下文字典将其传入。例如，如下代码块所示：\n\n```\n```python\n\
  from django.conf import settings\n\ndef my_view(request):\n    return render(request,\
  \ \"template.html\", {\"MEDIA_URL\":\n        settings.MEDIA_URL, \"username\":\
  \ \"jbloggs\"})\n```\n```\n\n这样是可行的，但问题在于，MEDIA_URL 是一个常见变量，我们可能希望在多个地方使用，这样我们就几乎必须在每个视图中都传递它。\n\
  \n相反，我们可以使用**上下文处理器**，它可以在每次渲染调用时自动向上下文字典中添加一个或多个变量。\n\n上下文处理器是一个接受一个参数（当前请求）的函数。它返回一个上下文信息字典，该字典将与传递给渲染调用的字典合并。\n\
  \n我们可以查看媒体上下文处理器的源代码，它会说明其工作原理：\n\n```\n```python\ndef media(request):\n    \"\"\
  \"\n    Add media-related context variables to the context.\n    \"\"\"\n    return\
  \ {\"MEDIA_URL\": settings.MEDIA_URL}\n```\n```\n\n启用媒体上下文处理器后，MEDIA_URL 将被添加到上下文字典中。我们可以将之前看到的渲染调用改为：\n\
  \n```\n```python\nreturn render(request, \"template.html\", {\"username\": \"jbloggs\"\
  })\n```\n```\n\n发送到模板的数据相同，因为上下文处理器会添加 MEDIA_URL。\n\n媒体上下文处理器的完整模块路径是 django.template.context_processors.media。Django\
  \ 提供的其他上下文处理器示例如下：\n\n- `django.template.context_processors.debug`：返回 `{\"DEBUG\"\
  : settings.DEBUG}` 字典。\n- `django.template.context_processors.request`：返回 `{\"request\"\
  : request}` 字典；也就是说，它只是将当前 HTTP 请求添加到上下文中。\n\n要启用某个上下文处理器，必须将其模块路径添加到 TEMPLATES\
  \ 设置的 context_processors 选项中。例如，要启用媒体上下文处理器，请添加 django.template.context_processors.media。我们将在练习\
  \ 8.02 – 模板设置及在模板中使用 MEDIA_URL 中详细介绍具体做法。\n\n启用媒体上下文处理器后，就可以像普通变量一样在模板中访问 MEDIA_URL\
  \ 变量：\n\n```\n{{ MEDIA_URL }}\n```\n\n例如，您可以使用它来引用图像：\n\n```\n<img src=\"{{ MEDIA_URL\
  \ }}uploads/image.jpg\">\n```\n\n请注意，与静态文件不同，没有用于加载媒体文件的模板标签（即，没有与 {% static %}\
  \ 模板标签对应的等效标签）。\n\n也可以编写自定义上下文处理器。例如，回到我们构建的 Bookr 应用程序，我们可能希望在每页的侧边栏中显示最近五条评论的列表。这样的上下文处理器可以执行以下代码：\n\
  \n```\nfrom reviews.models import Review\n\ndef latest_reviews(request):\n    return\
  \ {\"latest_reviews\": Review.objects.order_by(\"-date_created\")[:5]}.\n```\n\n\
  这可以保存在 Bookr 项目目录中名为 context_processors.py 的文件中，然后在 context_processors 设置中通过其模块路径\
  \ context_processors.latest_reviews 来引用。或者，我们可以将其保存在 reviews 应用中，并引用为 reviews.context_processors.latest_reviews。上下文处理器是应视为项目级还是应用特定，由您自行决定。但是请记住，无论它存储在哪里，一旦启用，它都会应用于所有应用的所有渲染调用。\n\
  \n上下文处理器可以返回包含多个项目甚至零项目的字典。如果它有条件地仅在满足特定标准时才添加项目，就会出现这种情况。例如，仅在用户登录时显示最新评论。\n\n\
  让我们在下一个练习中详细探讨这一点。\n\n\n\n\n\n# 练习 8.02 – 模板设置和使用模板中的 MEDIA_URL\n\n在本练习中，你将继续使用\
  \ `media_project` 并配置 Django 以自动将 `MEDIA_URL` 设置添加到每个模板。你通过将 `django.template.context_processors.media`\
  \ 添加到 `TEMPLATES` 上下文处理器设置来实现这一点。然后你将添加一个使用此新变量的模板以及一个用于渲染它的示例视图。你将在本章的练习中不断修改视图和模板：\n\
