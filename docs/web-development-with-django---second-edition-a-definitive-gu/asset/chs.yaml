  \n## 使用 HTML 表单进行文件上传\n\n在 *第 6 章，表单* 中，我们学习了 HTML 表单。我们讨论了如何使用 `<form>` 的 method\
  \ 属性进行 GET 或 POST 请求。到目前为止，我们仅使用表单提交文本数据，但也可以使用表单提交一个或多个文件。\n\n提交文件时，我们必须确保表单上至少有两个属性：method\
  \ 和 enctype。你可能仍需要其他属性，例如 action。支持文件上传的表单可能如下所示：\n\n```\n```html\n<form method=\"\
  post\" enctype=\"multipart/form-data\">\n```\n```\n\n文件上传仅适用于 POST 请求。GET 请求无法实现，因为无法通过\
  \ URL 发送文件的全部数据。enctype 属性必须设置为让浏览器知道应将表单数据作为多部分发送，一部分用于表单的文本数据，单独的部分用于附加到表单的每个文件。这种编码对用户是无缝的，他们不知道浏览器如何编码表单，也无需做任何不同的操作。\n\
  \n要将文件附加到表单，你需要创建一个 `file` 类型的输入。你可以手动编写 HTML 代码如下：\n\n```\n```html\n<input type=\"\
  file\" name=\"file-upload-name\">\n```\n```\n\n当输入在浏览器中渲染时，空时看起来像这样：\n\n![](img/4840a43efd335abd10b93708225692d6_399_0.png)\n\
  \n图 8.6：空文件输入\n\n按钮的标题可能因浏览器而异。\n\n点击 **Browse…** 按钮将显示 *文件打开* 对话框：\n\n![](img/4840a43efd335abd10b93708225692d6_399_1.png)\n\
  \n图 8.7：macOS 上的文件浏览器\n\n选择文件后，文件名会显示在字段中：\n\n![](img/4840a43efd335abd10b93708225692d6_399_2.png)\n\
  \n图 8.8：文件输入中选择了 cover.jpg\n\n*图 8.8* 显示了一个文件输入，其中已选择名为 `cover.jpg` 的文件。\n\n我们简要了解了文件上传字段在浏览器中的外观，让我们开始查看\
  \ Django 端的文件上传过程。\n\n## 在视图中处理上传的文件\n\n除了文本数据，如果表单还包含文件上传，Django 将使用 request.FILES\
  \ 属性填充上传的文件。request.FILES 属性是一个类似字典的对象，其键为赋予文件输入的 name 属性。\n\n在上一节的表单示例中，文件输入的 name\
  \ 为 file-upload-name。因此，文件在视图中可通过 request.FILES[\"file-upload-name\"] 访问。\n\nrequest.FILES\
  \ 包含的文件是类似文件的对象（具体为 django.core.files.uploadedfile.UploadedFile 实例），因此要使用它们，必须读取其数据。例如，要在视图中获取上传文件的内容，可以编写如下代码：\n\
  \n```\ncontent = request.FILES[\"file-upload-name\"].read()\n```\n\n更常见的做法是将文件内容写入磁盘。当文件上传时，它们存储在临时位置（如果小于\
  \ 2.5 MB 则在内存中，否则在磁盘上的临时文件）。要将文件数据存储在已知位置，必须读取内容然后将其写入该位置的磁盘。UploadedFile 具有 chunks\
  \ 方法，可一次读取文件数据的一个块，以防止一次性读取整个文件而使用过多内存。\n\n因此，不要简单地使用 read 和 write 函数，使用 chunks\
  \ 方法一次仅将文件的小块读入内存：\n\n```\nwith open(\"/path/to/output.jpg\", \"wb+\") as output_file:\n\
  \    uploaded_file = request.FILES[\"file-upload-name\"]\n    for chunk in uploaded_file.chunks():\n\
  \        output_file.write(chunk)\n```\n\n请注意，在接下来的一些示例中，我们将此代码称为 save_file_upload\
  \ 函数。假设该函数定义如下：\n\n```\ndef save_file_upload(upload, save_path):\n    with open(save_path,\
  \ \"wb+\") as output_file:\n        for chunk in upload.chunks():\n            output_file.write(chunk)\n\
  ```\n\n之前的示例代码然后可以重构为调用该函数：\n\n```\nuploaded_file = request.FILES[\"file-upload-name\"\
  ]\nsave_file_upload(uploaded_file, \"/path/to/output.jpg\")\n```\n\n\n\n\n每个`UploadedFile`对象（前面示例代码中的`uploaded_file`变量）也包含关于上传文件的额外元数据，例如文件的名称、大小和内容类型。你会发现以下属性最为有用：\n\
  \n- `size`：顾名思义，这是上传文件的大小（以字节为单位）。\n- `name`：这是上传文件的名称，例如`image.jpg`、`file.txt`、`document.pdf`等等。此值由浏览器发送。\n\
  - `content_type`：上传文件的内容类型（MIME类型）。例如`image/jpeg`、`text/plain`、`application/pdf`等等。与`name`一样，此值由浏览器发送。\n\
  - `charset`：对于文本文件，这是上传文件的字符集或文本编码。类似UTF-8或ASCII。同样，此值也由浏览器确定并发送。\n\n这里有一个快速访问这些属性的示例（例如在视图中）：\n\
  \n````\n```python\nupload = request.FILES[\"file-upload-name\"]\nsize = upload.size\n\
  name = upload.name\ncontent_type = upload.content_type\ncharset = upload.charset\n\
  ```\n````\n\n## 浏览器发送值的安全性与信任\n\n正如我们刚才所述，`UploadedFile`的`name`、`content_type`和`charset`值由浏览器决定。这一点很重要，因为恶意用户可能发送伪造值来伪装实际上传的文件。Django不会自动尝试确定上传文件的内容类型或字符集，因此它依赖客户端在发送此信息时保持准确。\n\
  \n如果我们手动处理文件上传的保存而没有适当的检查，那么可能会发生以下情况：\n\n1. 网站的一个用户上传了一个恶意的`malware.exe`可执行文件，但发送了`image/jpeg`内容类型。\n\
  2. 我们的代码检查内容类型并认为是安全的，因此将`malware.exe`保存到`MEDIA_ROOT`文件中。\n3. 网站的另一个用户下载了一个他们认为是书籍封面图片的文件，但实际上是`malware.exe`可执行文件。他们打开该文件后，电脑便感染了恶意软件。\n\
  \n这个场景已经简化了，恶意文件可能不会有一个如此明显的名称（也许是类似`cover.jpg.exe`这样的名字），但整个过程已经说明。\n\n你选择如何处理上传文件的安全将取决于具体的用例，但在大多数情况下，以下这些提示会有所帮助：\n\
  \n- 当你将文件保存到磁盘时，生成一个名称，而不是使用上传者提供的名称。你应该将文件扩展名替换为你期望的扩展名。例如，如果文件名为`cover.exe`，但内容类型是`image/jpeg`，则将文件保存为`cover.jpg`。你也可以生成一个完全随机的文件名以获得额外的安全性。\n\
  - 检查文件扩展名是否与内容类型匹配。这种方法并非万无一失，因为MIME类型太多，如果你处理的是不常见的文件，可能无法匹配。Python内置的`mimetypes`模块可以在这方面提供帮助。它的`guess_type`函数接收一个文件名并返回一个MIME类型元组（内容类型）和编码。以下是在Python控制台中使用它的简短片段：\n\
  \n````\n```python\n>>> import mimetypes\n>>> mimetypes.guess_type('file.jpg')\n\
  ('image/jpeg', None)\n>>> mimetypes.guess_type('text.html')\n('text/html', None)\n\
  >>> mimetypes.guess_type('unknownfile.abc')\n(None, None)\n>>> mimetypes.guess_type('archive.tar.gz')\n\
  ('application/x-tar', 'gzip')\n```\n````\n\n- 如果你期望的是图片上传，请使用`Pillow`库尝试将上传的文件作为图像打开。如果它不是有效的图像，Pillow将无法打开它。这正是Django使用`ImageField`上传图像时所做的事情。我们将在*练习8.05\
  \ – 使用Django表单上传图像*中展示如何使用此技术打开和处理图像。\n\n如果类型或编码无法猜测，元组中的任何一个元素都可能是`None`。通过执行`import\
  \ mimetypes`将模块导入到你的文件中后，你就可以在视图函数中像这样使用它：\n\n````\n```python\nupload = request.FILES[\"\
  file-upload-name\"]\nmimetype, encoding = mimetypes.guess_type(upload.name)\nif\
  \ mimetype != upload.content_type:\n    raise TypeError(\"Mimetype doesn't match\
  \ file\n    extension.\")\n```\n````\n\n这种方法适用于常见文件类型（如图像），但如前所述，许多不常见的类型可能对mimetype返回`None`。\n\
  \n你还可以考虑使用python-magic Python包，它会检查文件的实际内容以尝试确定其类型。它通过PIP安装，其GitHub项目位于：https://github.com/ahupp/python-magic。安装并使用import\
  \ magic将其导入到你的文件中后，你就可以在视图函数中这样使用它：\n\n```\nupload = request.FILES[\"field_name\"\
  ]\nmimetype = magic.from_buffer(upload.read(2048),\n mime=True)\n```\n\n然后你可以验证`mimetype`是否在允许的类型列表中。\n\
  \n这并不是防范恶意文件上传的所有方法的完整列表。最佳方法取决于你正在构建的应用程序类型。你可能会构建一个用于托管任意文件的网站，在这种情况下，你根本不需要任何内容检查。\n\
  \n现在让我们看看如何构建一个HTML表单和视图来允许上传文件。然后我们将它们存储在media目录中，并在浏览器中检索下载的文件。\n\n## 练习8.03 –\
  \ 文件上传与下载\n\n在本练习中，你将在media-example.html模板中添加一个带有文件字段的表单。这将允许你使用浏览器将文件上传到media_example视图。你还将更新media_example视图，将文件保存到MEDIA_ROOT目录，以便可供下载。然后，你将通过再次下载文件来测试这一切是否正常工作：\n\
  \n1. 在PyCharm中，打开templates文件夹中的media-example.html模板。在`<body>`元素内，删除在练习8.02 – 模板设置及在模板中使用MEDIA_URL的第6步中添加的`<a>`链接。将其替换为一个`<form>`元素（在以下代码片段中突出显示）。确保开始标签具有method=\"\
  post\"和enctype=\"multipart/form-data\"：\n\n```\n</head>\n<body>\n    <form method=\"\
  post\" enctype=\"multipart/form-data\">\n\n    </form>\n</body>\n```\n\n2. 在`<form>`主体中插入`{%\
  \ csrf_token %}`模板标签。\n\n3. 在`{% csrf_token %}`之后，添加一个`<input>`元素，带有type=\"file\"\
  和name=\"file_upload\"：\n\n```\n<input type=\"file\" name=\"file_upload\">\n```\n\
  \n4. 最后，在结束的`</form>`标签之前，添加一个`<button>`元素，带有type=\"submit\"和“Submit”文本内容：\n\n```\n\
  <button type=\"submit\">Submit</button>\n```\n\n你的HTML主体现在应该如下所示：\n\n```\n<body>\n\
  \    <form method=\"post\" enctype=\"multipart/form-data\">\n        {% csrf_token\
  \ %}\n        <input type=\"file\" name=\"file_upload\">\n        <button type=\"\
  submit\">Submit</button>\n    </form>\n</body>\n```\n\n现在，保存并关闭文件。它应该看起来像这样：https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter08/Exercise8.03/media_project/media_example/templates/media-example.html。\n\
  \n5. 打开media_example应用的views.py文件。在media_example视图中，添加代码将上传的文件保存到MEDIA_ROOT目录。为此，你需要从settings访问MEDIA_ROOT，因此在文件顶部导入Django\
  \ settings：\n\n```\nfrom django.conf import settings\n```\n\n6. 仅当请求方法为POST时，才应保存上传的文件。在media_example视图中，添加一个if语句来验证request.method是否为POST：\n\
  \n```\ndef media_example(request):\n    if request.method == \"POST\":\n       \
  \ ...\n```\n\n7. 在上一步添加的if语句中，通过将上传的文件名与MEDIA_ROOT目录拼接来生成输出路径。然后，以wb模式打开此路径，并使用chunks方法遍历上传的文件。最后，将每个块写入保存的文件：\n\
  \n```\ndef media_example(request):\n    if request.method == 'POST':\n        save_path\
  \ = settings.MEDIA_ROOT /\n        request.FILES[\"file_upload\"].name\n\n     \
  \   with open(save_path, \"wb\") as output_file:\n            for chunk in\n   \
  \             request.FILES[\"file_upload\"].chunks():\n                    output_file.write(chunk)\n\
  \n    return render(request, \"media-example.html\")\n```\n\n\n\n\n\n请注意，上传的文件及其元数据正通过\
  \ `request.FILES` 字典访问，使用的键与文件输入的名称一致（在我们的示例中，这个名称是 `file_upload`）。现在可以保存并关闭 `views.py`\
  \ 了。它现在应该看起来像这样：`https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter08/Exercise8.03/media_project/media_example/views.py`。\n\
  \n+   8. 如果 Django 开发服务器尚未运行，请启动它，然后导航到 `http://127.0.0.1:8000/media-example/`。你应该会看到文件上传字段和**提交**按钮，如下图所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_405_0.png)\n\n图 8.9：文件上传表单\n\n点击**浏览…**（或浏览器中对应的按钮），然后选择一个要上传的文件。文件名将出现在文件输入框中。然后，点击**提交**。\n\
  \n页面将重新加载，表单将再次变为空。这是正常现象——在后台，文件应该已经保存了。\n\n+   9. 尝试使用 `MEDIA_URL` 下载你上传的文件。在本示例中，上传了一个名为\
  \ `cover.jpg` 的文件。它将可以通过 `http://127.0.0.1:8000/media/cover.jpg` 下载。你的 URL 将取决于你上传的文件名称：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_406_0.png)\n\n图 8.10：在 `MEDIA_URL` 中可见的上传文件\n\
  \n如果你上传的是图片、HTML 文件或其他浏览器可以显示的文件类型，你将能够在浏览器中直接查看它。否则，你的浏览器只会再次将其下载到磁盘。这两种情况都意味着上传成功。\n\
  \n你还可以通过在 media_project 项目目录中查看 media 目录来确认上传是否成功：\n\n![](img/4840a43efd335abd10b93708225692d6_406_1.png)\n\
  \n图 8.11：media 目录中的 cover.jpg\n\n图 8.11 显示了 PyCharm 中 media 目录里的 cover.jpg 文件。\n\
  \n在本练习中，你添加了一个 `enctype` 设置为 `multipart/form-data` 的 HTML 表单，以便允许文件上传。它包含一个用于选择要上传文件的文件输入。然后，你为\
  \ media_example 视图添加了保存功能，以便将上传的文件保存到磁盘。\n\n在下一节中，我们将介绍如何使用 Django 表单简化表单生成并添加验证，以处理文件上传。\n\
  \n## 使用 Django 表单上传文件\n\n在第 6 章“表单”中，我们了解了 Django 如何简化表单的定义并自动将其渲染为 HTML。在前面的示例中，我们手动定义了表单并编写了\
  \ HTML。我们可以将其替换为 Django 表单，并使用 `FileField` 构造器来实现文件输入。\n\n以下是在表单上定义 `FileField`\
  \ 的方法：\n\n```\nfrom django import forms\n\nclass ExampleForm(forms.Form):\n    file_upload\
  \ = forms.FileField()\n```\n\n`FileField` 构造器可以接受以下关键字参数：\n\n- Required：对于必填字段，该参数应为\
  \ `True`；如果字段是可选的，则为 `False`\n- max_length：指上传文件的文件名的最大长度\n- allow_empty_file：如果设置了此参数，即使上传的文件为空（大小为\
  \ 0），该字段也会被视为有效\n\n除了这三个关键字参数之外，构造器还可以接受标准的 `Field` 参数，例如 `widget`。`FileField` 的默认\
  \ widget 类是 `ClearableFileInput`；这是一个文件输入，可以显示一个复选框，勾选该复选框可以发送一个空值，并清除模型字段上已保存的文件。\n\
  \n在视图中使用带有 `FileField` 构造器的表单与其他表单类似，但当表单已提交（即 `request.METHOD` 为 `POST`）时，还应该将\
  \ `request.FILES` 传入表单构造器。这是因为 Django 在验证表单时需要访问 `request.FILES` 来查找有关上传文件的信息。\n\
  \n因此，视图函数中的基本流程类似于这样：\n\n```\ndef view(request):\n    if request.method == \"POST\"\
  :\n        # 使用 POST 数据和文件实例化表单\n        form = ExampleForm(request.POST, request.FILES)\n\
  \        if form.is_valid():\n            # 处理表单并保存文件\n            return redirect(\"\
  success-url\")\n    else:\n        # 像之前一样实例化一个空表单\n        form = ExampleForm()\n\
  ```\n\n```\n# 与其他表单一样渲染模板\nreturn render(request, \"template.html\", {\"form\":\
  \ form})\n```\n\n在处理上传文件和表单时，你可以通过 `request.FILES` 或 `form.cleaned_data` 来访问上传的文件；这两个方式返回的是同一个对象。在前面的示例中，我们可以像这样处理上传的文件：\n\
  \n```\nif form.is_valid():\n    save_file_upload(\"/path/to/save.jpg\",\n      \
  \               request.FILES[\"file_upload\"])\n    return redirect(\"/success-url/\"\
  )\n```\n\n或者，由于它们包含的是同一个对象，你也可以使用 `form.cleaned_data`：\n\n```\nif form.is_valid():\n\
  \    save_file_upload(\"/path/to/save.jpg\",\n                     form.cleaned_data[\"\
  file_upload\"])\n    return redirect(\"/success-url/\")\n```\n\n保存的数据将是相同的。\n\n\
  > **注意**\n> \n> 在*第 6 章“表单”*中，你尝试了表单并提交了无效值。当页面刷新并显示表单错误时，你之前输入的数据会在页面重新加载时被重新填充。但文件字段不会出现这种情况；相反，如果表单无效，用户将需要重新导航并再次选择文件。\n\
  \n在下一个练习中，我们将通过构建一个示例表单，并修改视图使其仅在表单有效时保存文件，来将我们学到的 `FileField` 知识付诸实践。\n\n## 练习\
  \ 8.04 – 使用 Django 表单上传文件\n\n在之前的练习中，你在 HTML 中创建了一个表单，并使用它将文件上传到 Django 视图。如果你在未选择文件的情况下尝试提交表单，你会看到\
  \ Django 异常页面。你没有对表单进行任何验证，因此这种方法相当脆弱。\n\n在本练习中，你将创建一个带有 `FileField` 的 Django 表单，这样你就可以使用表单验证功能来使视图更加健壮，同时减少代码量：\n\
  \n+   1. 在 PyCharm 中，在 `media_example` 应用内部，创建一个名为 `forms.py` 的新文件。它会自动打开。在文件开头，导入\
  \ Django 表单库：\n\n```\nfrom django import forms\n```\n\n然后，创建一个 `forms.Form` 的子类，并将其命名为\
  \ `UploadForm`。在其中添加一个名为 `file_upload` 的 `FileField` 字段。你的类应该包含以下代码：\n\n```\nclass\
  \ UploadForm(forms.Form):\n    file_upload = forms.FileField()\n```\n\n你可以保存并关闭此文件。完整的文件应该看起来像这样：`https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter08/Exercise8.04/media_project/media_example/forms.py`。\n\
  \n+   2. 打开 `form_example` 应用的 `views.py` 文件。在文件开头、现有导入语句的正下方，你需要像这样导入新类：\n\n```\n\
  from .forms import UploadForm\n```\n\n+   3. 如果你位于视图的 POST 分支中，则需要同时使用 `request.POST`\
  \ 和 `request.FILES` 来实例化 `UploadForm`。如果不传入 `request.FILES`，则表单实例将无法访问上传的文件。在 `if\
  \ request.method == \"POST\"` 检查下方，使用这两个参数实例化 `UploadForm`：\n\n```\nform = UploadForm(request.POST,\
  \ request.FILES)\n```\n\n+   4. 现有的定义 `save_path` 和存储文件内容的行可以保留，但它们应该缩进一个代码块，并放入表单有效性检查中，这样它们就只在表单有效时执行。添加\
  \ `if form.is_valid():` 这一行，然后缩进其他行，使代码看起来像这样：\n\n```\nif form.is_valid():\n   \
  \ save_path = os.path.join(settings.MEDIA_ROOT,\n    request.FILES[\"file_upload\"\
  ].name)\n\n    with open(save_path, \"wb\") as output_file:\n        for chunk in\n\
  \        request.FILES[\"file_upload\"].chunks():\n            output_file.write(chunk)\n\
  ```\n\n\n\n\n\n5. 由于你现在使用的是表单，可以通过表单访问文件上传。将 `request.FILES[\"file_upload\"]` 的用法替换为\
  \ `form.cleaned_data[\"file_upload\"]`：\n\n```python\nif form.is_valid():\n    save_path\
  \ = settings.MEDIA_ROOT /\n        form.cleaned_data[\"file_upload\"].name\n\n \
  \   with open(save_path, \"wb\") as output_file:\n        for chunk in\n       \
  \     form.cleaned_data[\"file_upload\"].chunks():\n            output_file.write(chunk)\n\
  ```\n\n6. 最后，添加一个 else 分支来处理非 POST 请求，它只需在不带任何参数的情况下实例化一个表单：\n\n```python\nif request.method\
  \ == \"POST\":\n    ...\nelse:\n    form = UploadForm()\n```\n\n7. 在 render 调用中添加一个上下文字典参数，并在\
  \ `form` 键中设置表单变量：\n\n```python\nreturn render(request, \"media-example.html\",\
  \ {\"form\":\nform})\n```\n\n你现在可以保存并关闭此文件。它应该看起来像这样：`https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter08/Exercise8.04/media_project/media_example/views.py`。\n\
  \n8. 最后，打开 `media-example.html` 模板并删除你手动定义的 `<input>` 文件。用 `form` 替换它，使用 `as_p`\
  \ 方法渲染（已高亮）：\n\n```html\n<body>\n    <form method=\"post\" enctype=\"multipart/form-data\"\
  >\n        {% csrf_token %}\n        {{ form.as_p }}\n        <button type=\"submit\"\
  >Submit</button>\n    </form>\n</body>\n```\n\n你不应更改文件的其他任何部分。你可以保存并关闭此文件。它应该看起来像这样：`https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter08/Exercise8.04/media_project/media_example/templates/media-example.html`。\n\
  \n9. 如果尚未运行，请启动 Django 开发服务器，然后导航到 `http://127.0.0.1:8000/media-example/`。你应该会看到文件上传字段和\
  \ **Submit** 按钮如下：\n\n![](img/4840a43efd335abd10b93708225692d6_411_0.png)\n\n图 8.12：浏览器中渲染的\
  \ Django 文件上传表单\n\n10. 由于我们使用的是 Django 表单，因此我们会自动获得其内置验证。如果尝试在未选择文件的情况下提交表单，浏览器应会阻止它并显示错误，如下所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_411_1.png)\n\n图 8.13：表单提交被浏览器阻止\n\n11.\
  \ 最后，重复你在 *Exercise 8.03 – file upload and download* 中执行的文件上传测试，选择一个文件并提交表单。然后你应该能够使用\
  \ MEDIA_URL 检索该文件。在此例中，文件名为 `cover.jpg` 再次被上传（见以下截图）：\n\n![](img/4840a43efd335abd10b93708225692d6_412_0.png)\n\
  \n图 8.14：上传名为 cover.jpg 的文件\n\n然后你可以在 http://127.0.0.1:8000/media/cover.jpg 处检索该文件，并在浏览器中看到如下内容：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_412_1.png)\n\n图 8.15：使用 Django 表单上传的文件在浏览器中也可见\n\
  \n在本练习中，我们用包含 FileField 的 Django 表单替换了手动构建的表单。我们通过同时传入 request.POST 和 request.FILES\
  \ 在视图中实例化了表单。然后我们使用标准的 is_valid 方法检查表单的有效性，并且只有在表单有效时才保存文件上传。我们测试了文件上传，并看到我们能够使用\
  \ MEDIA_URL 检索上传的文件。\n\n在下一节中，我们将研究 ImageField，它与 FileField 类似，但专门用于图像。\n\n## 使用\
  \ Django 表单上传图像\n\n如果你想在 Python 中处理图像，你会使用的最常见库称为 Pillow，而 Django 用于验证图像的也是该库。最初有一个名为\
  \ Python Imaging Library 的库，称为 PIL。它没有得到更新，最终该库被分叉并仍在维护，即 Pillow。为了保持向后兼容性，安装时该包仍称为\
  \ PIL。例如，Image 对象是从 PIL 导入的：\n\n```\nfrom PIL import Image\n```\n\nPython Imaging\
  \ Library、PIL 和 Pillow 的术语经常可以互换使用。你可以假设如果有人提到 PIL，他们指的是最新的 Pillow 库。\n\nPillow\
  \ 提供了各种获取图像数据或对其进行操作的方法。你可以了解图像的宽度和高度、缩放、裁剪并对其应用转换。可用操作太多，无法在本章中全部涵盖，因此我们只介绍一个简单示例（缩放图像），你将在下一个练习中使用它。\n\
  \n由于图像是用户可能想要上传的最常见文件类型之一，Django 还包括 ImageField。它与 FileField 行为相似，但还会自动验证数据是否为图像文件。这有助于防止安全问题，即我们期望图像，但用户上传了恶意文件。\n\
  \nImageField 的 UploadedFile 具有与 FileField 相同的全部属性和方法（size、content_type、name、chunks()\
  \ 等），但额外增加了一个属性：image。这是用于验证上传文件是否为有效图像的 PIL Image 对象实例。\n\n在检查表单有效后，底层 PIL Image\
  \ 对象将被关闭。这是为了释放内存并防止 Python 进程打开太多文件，从而可能导致性能问题。这对开发人员意味着你可以访问图像的一些元数据（如宽度、高度和格式），但在不重新打开图像的情况下无法访问实际的图像数据。\n\
  \n为了说明，我们将创建一个带有 ImageField 的表单，名为 picture：\n\n```\nclass ExampleForm(forms.Form):\n\
  \    picture = forms.ImageField()\n```\n\n在视图函数内部，可以在表单的 cleaned_data 中访问 picture\
  \ 字段：\n\n```\nif form.is_valid():\n    picture_field = form.cleaned_data[\"picture\"\
  ]\n```\n\n然后可以检索 picture 字段的 Image 对象：\n\n```\nimage = picture_field.image\n```\n\
  \n现在我们在视图中有了对图像的引用，可以获取一些元数据：\n\n```\nw = image.width  # 一个整数，例如 600\nh = image.height\
  \  # 也是一个整数，例如 420\nf = image.format  # 图像格式的字符串，例如 \"PNG\"\n```\n\nDjango 还会自动将\
  \ UploadedFile 的 content_type 属性更新为 picture 字段的正确类型。这会覆盖浏览器在上传文件时发送的值。\n\n尝试使用访问实际图像数据（而非仅元数据）的方法将导致引发异常。这是因为\
  \ Django 已关闭底层图像文件。\n\n例如，以下代码片段将引发 AttributeError：\n\n```\nimage.getdata()\n```\n\
  \n相反，我们需要重新打开图像。图像数据可以使用 ImageField 引用在导入 Image 类后打开：\n\n```\nfrom PIL import Image\n\
  ```\n\n```\nimage = Image.open(picture_field)\n```\n\n现在图像已打开，你可以对其执行操作。在下一节中，我们将研究一个简单示例——调整上传图像的大小。\n\
  \n## 使用 Pillow 调整图像大小\n\nPillow 支持在保存图像之前可能想要执行的大量操作。我们无法在本书中全部解释，因此我们只使用一个常见操作：在保存之前将图像调整为特定大小。这将帮助我们节省存储空间并提高下载速度。例如，用户可能在\
  \ Bookr 中上传的封面图像比我们所需的大得多。在保存文件（写回磁盘）时，我们必须指定使用的格式。我们可以通过多种方法确定上传图像的类型（例如检查上传文件的\
  \ `content_type` 或 Image 对象的 `format`），但在我们的示例中，我们将始终将其保存为 JPEG 文件。\n\nPIL Image\
  \ 类有一个 thumbnail 方法，它会在保留宽高比的同时将图像调整为最大尺寸。例如，我们可以设置最大尺寸为 50 像素（px）乘 50 px。200 px\
  \ × 100 px 的图像将被调整为 50 px × 25 px：通过将最大维度设置为 50 px 来保留宽高比。每个维度按 0.25 的因子缩放：\n\n\
  ```python\nfrom PIL import Image\n\nsize = 50, 50  # 调整大小的目标宽度、高度元组\nimage = Image.open(image_file)\
  \  # 像之前一样打开图像\nimage.thumbnail(size)  # 执行调整大小\n```\n\n此时，调整大小仅在内存中完成。更改不会在调用 save\
  \ 方法之前保存到磁盘，如下所示：\n\n```python\nimage.save(\"path/to/file.jpg\")\n```\n\n输出格式会自动根据使用的文件扩展名确定，在本例中为\
  \ JPEG。save 方法还可以接收 format 参数来覆盖它，例如：\n\n```python\nimage.save(\"path/to/file.png\"\
  , \"JPEG\")\n```\n\n尽管扩展名为 .png，但格式指定为 JPEG，因此输出将为 JPEG 格式。正如你可能想象的那样，这可能会非常令人困惑，因此你可能决定只指定扩展名。\n\
  \n在下一个练习中，我们将更改我们一直在使用的 UploadForm，使其使用 ImageField 而不是 FileField，然后在保存到媒体目录之前实现上传图像的调整大小。\n\
  \n\n\n\n\n## 练习 8.05 – 使用 Django 表单上传图片\n\n在本练习中，你将更新在练习 8.04 – 使用 Django 表单上传文件\
