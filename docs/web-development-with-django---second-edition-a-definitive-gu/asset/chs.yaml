  \ / 'subdir'.\n    BASE_DIR = Path(__file__).resolve().parent.parent\n\n    # Quick-start\
  \ development settings - unsuitable for production\n    # See https://docs.djangoproject.com/en/4.0/howto/deployment/checklist/\n\
  \n    # SECURITY WARNING: keep the secret key used in production secret!\n    SECRET_KEY\
  \ = \"django-insecure-cled4dqj0us$i%z&fx#spkgkey%$kzplg-pz6^$__k6w#eo7&\"\n\n  \
  \  # SECURITY WARNING: don't run with debug turned on in production!\n    DEBUG\
  \ = True\n```\n\n图 15.3 – 新的 Dev 配置\n\n5. 缩进设置后，我们将更改一些设置以从环境变量读取。首先，将 DEBUG 更改为作为\
  \ BooleanValue 读取。它应默认为 True。考虑以下行：\n\n```\nDEBUG = True\n```\n\n然后，将其更改为：\n\n```\n\
  DEBUG = values.BooleanValue(True)\n```\n\n这将自动从 DJANGO_DEBUG 环境变量读取 DEBUG 并将其转换为布尔值。如果环境变量未设置，则默认为\
  \ True。\n\n6. 此外，将 ALLOWED_HOSTS 转换为从环境变量读取，使用 values.ListValue 类。它应默认为 []（空列表）。考虑以下行：\n\
  \n```\nALLOWED_HOSTS = []\n```\n\n将其更改为：\n\n```\nALLOWED_HOSTS = values.ListValue([])\n\
  ```\n\nALLOWED_HOSTS 将从 DJANGO_ALLOWED_HOSTS 环境变量读取，并默认为空列表。\n\n7. 到目前为止你所做的一切都涉及在\
  \ Dev 类上添加/更改属性。现在，在同一文件的末尾，添加一个继承自 Dev 的 Prod 类。它应定义两个属性，DEBUG = True 和 SECRET_KEY\
  \ = values.SecretValue()。完成的类应如下所示：\n\n```\nclass Prod(Dev):\n    DEBUG = False\n\
  \    SECRET_KEY = values.SecretValue()\n```\n\n保存 settings.py。\n\n8. 如果我们现在尝试运行任何管理命令，我们将收到\
  \ django-configurations 未正确设置的错误。我们需要对 manage.py 进行一些更改使其再次工作。打开 bookr 项目目录中的 manage.py。\n\
  \n考虑以下读取的行：\n\n```\nos.environ.setdefault('DJANGO_SETTINGS_MODULE',\n    'bookr.settings')\n\
  ```\n\n在其下方添加这一行：\n\n```\nos.environ.setdefault('DJANGO_CONFIGURATION', 'Dev')\n\
  ```\n\n这将默认配置设置为 Dev 类。它可以通过设置 DJANGO_CONFIGURATION 环境变量（例如，设置为 Prod）来覆盖。\n\n\n\n\
  \n\n+   9. 在上一步行的下方两行，你应该已经有以下导入语句：\n+   ```\n+   from django.core.management import\
  \ execute_from_command_line\n+   ```\n+   将其更改为以下内容：\n+   ```\n+   from configurations.management\
  \ import execute_from_command_line\n+   ```\n+   这将使 manage.py 脚本使用 Django 配置的 execute_from_command_line\
  \ 函数，而不是 Django 内置的函数。\n+   保存 manage.py。\n\n+   10. 启动 Django 开发服务器。如果它能够无错误地启动，你可以确信所做的更改已生效。为了确定，请检查页面是否在浏览器中加载。打开\
  \ http://127.0.0.1:8000/ 并尝试浏览网站。所有内容应看起来并感觉与之前一样：\n\n![](img/4840a43efd335abd10b93708225692d6_654_0.png)\n\
  \n在本练习中，我们安装了 django-configurations 并重构了 settings.py 文件以使用其 Configuration 类来定义我们的设置。我们添加了\
  \ Dev 和 Prod 配置，并使 DEBUG、ALLOWED_HOSTS 和 SECRET_KEY 能够通过环境变量设置。最后，我们更新了 manage.py\
  \ 以使用 Django 配置的 execute_from_command_line 函数，这使得使用这种新的 settings.py 格式成为可能。\n\n\
  在下一节中，我们将介绍 dj-database-url，这是一个使你能够使用 URL 配置 Django 数据库设置的包。\n\n输出如下：\n\n```\n\
  Collecting dj-database-url\n    Downloading https://files.pythonhosted.org/packages/d4/a6/4b8578c1848690d0c307c7c0596af2077536c9ef2a04d42b00fabaa7e49d/dj_database_url-0.5.0-py2.py3-none-any.whl\n\
  Installing collected packages: dj-database-url\nSuccessfully installed dj-database-url-0.5.0\n\
  ```\n\n现在，dj_database_url 可以导入到 settings.py 中，并且 dj_database_url.parse 方法可用于将 URL\
  \ 转换为 Django 可用的字典。我们可以使用其返回值来设置 DATABASES 字典中的默认值（或其他项）：\n\n```\nimport dj_database_url\n\
  \nDATABASES = {'default': dj_database_url.parse(\n'postgres://bookr:b00ks@db.example.com:5432/bookr_django'\n\
  )}\n```\n\n或者，对于我们的 SQLite 数据库，我们可以利用 BASE_DIR 设置，就像我们已经在做的那样，并将其包含在 URL 中：\n\n\
  ```\nimport dj_database_url\n\nDATABASES = {'default': dj_database_url.parse(\n\
  \    f'sqlite:///{BASE_DIR}/db.sqlite3')}\n```\n\n解析后，DATABASES 字典与我们之前定义的内容相似。它包含一些不适用于\
  \ SQLite 数据库的冗余项（USER、PASSWORD、HOST 等），但 Django 会忽略它们：\n\n```\nDATABASES = {\n \
  \   'default': {\n        'NAME': '/Users/ben/bookr/bookr/db.sqlite3',\n       \
  \ 'USER': '',\n        'PASSWORD': '',\n        'HOST': '',\n        'PORT': '',\n\
  \        'CONN_MAX_AGE': 0,\n        'ENGINE': 'django.db.backends.sqlite3'\n  \
  \  }\n}\n```\n\n这种设置数据库连接信息的方法并不太有用，因为我们仍然在 settings.py 中静态定义数据。唯一的区别是我们使用 URL 而不是字典。`dj-database-url`\
  \ 还可以自动从环境变量读取 URL。这将允许我们通过在环境中设置它们来覆盖这些值。\n\n要从环境中读取数据，请使用 `dj_database_url.config`\
  \ 函数，如下所示：\n\n```\n```python\nimport dj_database_url\n\nDATABASES = {'default':\
  \ dj_database_url.config()}\n```\n```\n\nURL 会自动从 `DATABASE_URL` 环境变量中读取。\n\n我们可以通过向\
  \ config 函数也提供一个 `default` 参数来改进这一点。这是如果环境变量中未指定则将使用的默认 URL：\n\n```\n```python\n\
  import dj_database_url\n\nDATABASES = {\n    'default': dj_database_url.config(\n\
  \        default=f'sqlite:///{BASE_DIR}/db.sqlite3')}\n```\n```\n\n这样，我们可以指定一个默认\
  \ URL，该 URL 可以被生产环境中的环境变量覆盖。\n\n我们还可以通过传入 `env` 参数来指定读取 URL 的环境变量——这是第一个位置参数。这样，你就可以为不同的数据库设置读取多个\
  \ URL：\n\n```\n```python\nimport dj_database_url\n\nDATABASES = {\n    'default':\
  \ dj_database_url.config(\n        default=f'sqlite:///{BASE_DIR}/db.sqlite3'),\n\
  \    'secondary': dj_database_url.config(\n        'DATABASE_URL_SECONDARY',\n \
  \       default=f'sqlite:///{BASE_DIR}/db-secondary.sqlite3')\n}\n```\n```\n\n在此示例中，`default`\
  \ 项的 URL 从 `DATABASE_URL` 环境变量读取，而 `secondary` 从 `DATABASE_URL_SECONDARY` 读取。\n\n\
  django-configurations 还提供了一个与 dj_database_url 协同工作的配置类：DatabaseURLValue。它与 dj_database_url.config\
  \ 略有不同，因为它生成整个 DATABASES 字典，包括 default 项。例如，考虑以下代码：\n\n```\nimport dj_database_url\n\
  \nDATABASES = {'default': dj_database_url.config()}\n```\n\n此代码等同于以下内容：\n\n```\n\
  from configurations import values\n\nDATABASES = values.DatabaseURLValue()\n```\n\
  \n不要编写 DATABASES['default'] = values.DatabaseURLValue()，否则你的字典会双重嵌套。\n\n如果需要指定多个数据库，你将需要直接回退到\
  \ dj_database_url.config，而不是使用 DatabaseURLValue。\n\n像其他 values 类一样，DatabaseURLValue\
  \ 将默认值作为其第一个参数。你可能还想使用 environ_prefix 参数并将其设置为 DJANGO，以便读取的环境变量与其他变量命名一致。使用 DatabaseURLValue\
  \ 的完整示例因此如下所示：\n\n```\nDATABASES = values.DatabaseURLValue(\n    f'sqlite:///{BASE_DIR}/db.sqlite3',\n\
  \    environ_prefix='DJANGO')\n```\n\n通过这样设置 environ_prefix，我们可以使用 DJANGO_DATABASE_URL\
  \ 环境变量设置数据库 URL（而不是仅 DATABASE_URL）。这意味着它与其他以 DJANGO_ 开头的环境变量设置（如 DJANGO_DEBUG 或\
  \ DJANGO_ALLOWED_HOSTS）保持一致。\n\n请注意，即使我们没有在 settings.py 中导入 dj-database-url，django-configurations\
  \ 在内部使用它，因此它仍然必须安装。\n\n在下一个练习中，我们将配置 Bookr 使用 DatabaseURLValue 来设置其数据库配置。它将能够从环境变量读取并回退到我们指定的默认值。\n\
