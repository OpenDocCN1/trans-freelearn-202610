  \ - 获取和渲染书籍中所做的方式实现 fetch。它应遵循相同的模式，请求 state.currentUrl 然后从响应中获取 JSON 数据。然后，在状态中设置以下值：\n\
  \n- `loading: false`\n- `reviews: data.results`\n- `nextUrl: data.next`\n- `previousUrl:\
