  \nFigure 7.31 – The Modified on: date field has now been populated\n\n## Note\n\n\
  本活动的解决方案可在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions\
  \ 上找到。\n\n## Summary\n\n本章深入探讨了表单。 我们看到了如何通过自定义验证高级规则来增强 Django 表单以清理数据和验证字段。 我们还看到了自定义清理方法如何转换从表单中获取的数据。\
  \ 我们看到可以添加到表单的一个不错功能是能够在字段上设置初始值和占位符值，以便用户不必填写它们。\n\n然后我们研究了如何使用 ModelForm 类从 Django\
  \ 模型自动创建表单。 我们看到了如何只向用户显示某些字段以及如何将自定义表单验证规则应用于 ModelForm。 我们还看到了 Django 如何在视图内部自动将新的或更新的模型实例保存到数据库中。\
  \ 在本章的活动中，我们通过添加用于创建和编辑出版商以及提交评论的表单进一步增强了 Bookr。\n\n在下一章中，我们将继续用户输入提交的主题，并讨论 Django\
  \ 如何处理文件上传和下载。\n"
- "## Media Serving and File Uploads\n\n媒体文件是指可在部署后添加以丰富 Django 应用的额外文件。 通常，它们是你将在网站中使用的额外图像，但任何类型的文件（包括视频、音频、PDF、文本、文档，甚至\
  \ HTML）都可以作为媒体提供。\n\n你可以将它们视为介于动态数据和静态资源之间。 它们不是 Django 即时生成的动态数据，例如渲染模板时。 它们也不是站点开发人员在站点部署时包含的静态文件。\
  \ 相反，它们是可以由用户上传或由你的应用程序为以后检索而生成的额外文件。\n\n媒体文件的一些常见示例（你将在本章后面的 Activity 8.01 – image\
  \ and PDF upload of books 中看到）是可附加到 Book 对象的图书封面和预览 PDF。 你还可以使用媒体文件允许用户为博客文章上传图像或为社交媒体网站上传头像。\
  \ 如果你想使用 Django 构建自己的视频分享平台，你将把上传的视频存储为媒体。 如果所有这些文件都是静态文件，你的网站将无法正常运行，因为用户将无法上传自己的图书封面、视频等，只能使用你部署的那些。\n\
  \n在本章中，我们将涵盖以下主题：\n- Settings for media uploads and serving\n- File uploads using\
  \ HTML forms\n- File uploads with Django forms\n- Image uploads with Django forms\n\
  - Serving uploaded (and other) files using Django\n- ModelForms and file uploads\n\
  - Activity 8.01 – image and PDF upload for books\n- Activity 8.02 – displaying cover\
  \ and sample link\n\n## Technical requirements\n\n本章练习和活动的代码可在本书的 GitHub 仓库中找到，地址为\
  \ https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter08。\n\
  \n## Settings for media uploads and serving\n\n在第 5 章 Serving Static Files 中，我们研究了\
  \ Django 如何用于提供静态文件。 提供媒体文件非常相似。 必须在 settings.py 中配置两个设置：MEDIA_ROOT 和 MEDIA_URL。\
  \ 它们类似于用于提供静态文件的 STATIC_ROOT 和 STATIC_URL。\n\n- MEDIA_ROOT： 这是媒体（例如上传的文件）将在磁盘上存储的路径。\
  \ 与静态文件一样，你的 Web 服务器应配置为直接从此目录提供服务，以减轻 Django 的负担。\n- MEDIA_URL： 这与 STATIC_URL 类似，但如你可能猜到的，它是应用于提供媒体的\
  \ URL。 它必须以 / 结尾。 通常，你将使用诸如 /media/ 之类的内容。\n\n> **Note**\n> 出于安全原因，MEDIA_ROOT 的路径必须与\
  \ STATIC_ROOT 的路径不同，且 MEDIA_URL 必须与 STATIC_URL 不同。 如果它们相同，用户可能会用恶意代码替换你的静态文件（例如\
  \ JavaScript 或 CSS 文件）并利用你的用户。\n\nMEDIA_URL 设计用于在模板中使用，以便你不硬编码 URL，并且可以轻松更改它们。 例如，当你部署到生产环境时，你可能希望将其设置为特定主机或内容分发网络（CDN）。\
  \ 我们将在即将到来的部分中讨论在模板中使用 MEDIA_URL。\n\n## Serving media files in development\n\n与静态文件一样，在生产环境中提供媒体时，你的\
  \ Web 服务器应配置为直接从 MEDIA_ROOT 目录提供服务，以防止 Django 被请求占用。 Django 开发服务器可以在开发中提供媒体文件。 然而，与静态文件不同，媒体文件的\
  \ URL 映射和视图并未自动设置。\n\n\n\n\n\nDjango 提供了静态 URL 映射，可以添加到现有的 URL 映射中，以提供媒体文件服务。将其添加到您的\
  \ urls.py 文件中，如下所示：\n\n```\nfrom django.conf import settings\nfrom django.conf.urls.static\
  \ import static\n\nurlpatterns = [\n    # your existing URL maps\n]\nif settings.DEBUG:\n\
  \    urlpatterns += static(settings.MEDIA_URL,\n                          document_root=settings.MEDIA_ROOT)\n\
  ```\n\n这将把 settings.py 中定义的 MEDIA_ROOT 设置对应的目录，通过同样在 settings.py 中定义的 MEDIA_URL\
  \ 设置来提供服务。我们在追加映射之前检查 settings.DEBUG，是为了不在生产环境中添加此映射。\n\n例如，如果您的 MEDIA_ROOT 设置为\
  \ /var/www/bookr/media，而 MEDIA_URL 设置为 /media/，那么 /var/www/bookr/media/image.jpg\
  \ 文件就可以通过 http://127.0.0.1:8000/media/image.jpg 访问。\n\n当 Django 的 DEBUG 设置为 False\
  \ 时，静态 URL 映射不起作用，因此它不能在生产环境中使用。但是，如前所述，在生产环境中，您的 Web 服务器应该处理这些请求，这样 Django 就不需要处理它们了。\n\
  \n在第一个练习中，您将新建一个项目，并将 MEDIA_ROOT 和 MEDIA_URL 添加到 settings.py 中。然后添加静态媒体服务 URL 映射，并添加一个测试文件，以确保媒体服务配置正确。\n\
  \n## 练习 8.01 – 配置媒体存储和服务\n\n在此练习中，您将新建一个 Django 项目，作为本章使用的示例项目。然后，配置它以能够提供媒体文件服务。您将创建一个\
  \ media 目录，并添加 MEDIA_ROOT 和 MEDIA_URL 设置，然后为 MEDIA_URL 设置 URL 映射。\n\n图 8.1 显示了 PyCharm\
  \ 中项目的 Runserver 配置。\n\n3. 在 media_project 项目目录下创建一个名为 media 的新目录。然后，在此目录中创建一个名为\
