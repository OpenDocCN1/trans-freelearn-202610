  \"\"\n```\n```\n\n```\ntry:\n    with open(filename, 'w') as csv_file:\n       \
  \ csv_writer = csv.writer(csv_file)\n        csv_writer.writerow(header)\n     \
  \   csv_writer.writerows(data)\nexcept (IOError, OSError) as csv_file_error:\n \
  \   print(\"Unable to write the contents to csv\n          file. Exception:\n  \
  \        {}\".format(csv_file_error))\n```\n\n有了这段代码，您现在应该能够轻松创建新的 CSV 文件。现在，逐步来看，我们在这段代码中试图做什么。\n\
  \n我们定义了一个名为 write_csv() 的新方法，它接收三个参数：要写入数据的文件名（filename）、用作标题的列名列表（header），以及包含需要映射到各个列的数据的列表的列表（data）：\n\
  \n```\ndef write_csv(filename, header, data):\n```\n\n现在参数就绪，下一步是打开需要写入数据的文件并将其映射到对象：\n\
  \n```\nwith open(filename, 'w') as csv_file:\n```\n\n文件打开后，我们执行三个主要步骤：\n\n+   首先，我们使用\
  \ csv 模块的 writer() 方法获得一个新的 CSV 写入器对象，并将其传递给保存我们打开文件引用的文件处理程序：\n\n```\ncsv_writer\
  \ = csv.writer(csv_file)\n```\n\n+   下一步涉及使用 CSV 写入器的 writerow() 方法将数据集的标题字段写入文件：\n\
  \n```\ncsv_writer.writerow(header)\n```\n\n+   写入标题后，最后一步是将数据写入 CSV 文件的各个列。为此，我们可以使用\
  \ csv 模块的 writerows() 方法一次写入多行：\n\n```\ncsv_writer.writerows(data)\n```\n\n## 重要说明\n\
  \n虽然前面的步骤概述了写入 CSV 文件的详细版本，以提供对 CSV 文件应如何结构化的底层工作原理的更好清晰度，但我们本可以将写入标题和数据的步骤合并为一行代码，通过将标题列表作为数据列表的第一个元素，并调用\
  \ writerows() 方法并将数据列表作为参数。\n\n2. 一旦我们创建了可以将提供的数据写入 CSV 文件的方法，我们必须编写入口点调用的代码，并在其中设置\
  \ header、data 和 filename 字段的值，最后调用我们之前定义的 write_csv() 方法：\n\n```\nif __name__ ==\
  \ '__main__':\n    header = ['name', 'age', 'gender']\n    data = [['Richard', 32,\
  \ 'M'], ['Mumzil', 21, 'F'],\n            ['Melinda', 25, 'F']]\n    filename =\
  \ 'sample_output.csv'\n    write_csv(filename, header, data)\n```\n\n3. 现在代码就绪，执行我们刚刚创建的文件，看看它是否创建了\
  \ CSV 文件。要执行它，运行以下命令：\n\n```\npython3 csv_writer.py\n```\n\n执行完成后，您会看到在执行命令的同一目录中创建了一个新文件。打开该文件后，其内容应类似于以下图所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_587_0.png)\n\n图 13.3：CSV 写入器 sample_output.csv\
  \ 的输出\n\n这应导致以下输出：\n\n```\n```text\n{'id': '1', 'stock_symbol': 'HOTRW', 'market_cap':\
