  \nFigure 4.42 – App index page after customization\n\n最后，注销页面将看起来像这样：\n\n![](img/4840a43efd335abd10b93708225692d6_209_0.png)\n\
  \nFigure 4.43 – Logout page after customization\n\n你已通过子类化 AdminSite 成功自定义了 admin\
  \ 应用。\n\nNote\n此活动的解决方案可以在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions\
  \ 上找到。\n\n在下一节中，我们将检查 AdminSite 对象并了解其一些重要属性，这些属性可用于修改 admin 应用的全局外观。然后我们将检查在项目中子类化\
  \ AdminSite 的方法，以便我们可以将其从默认外观中自定义。我们将通过创建一个新项目并自定义其 admin 界面来测试我们对这些技术的了解。\n\n##\
  \ Customizing the ModelAdmin classes\n\n现在我们已经了解了如何使用子类化的 AdminSite 来自定义 admin 应用的全局外观，我们将看看如何自定义\
  \ admin 应用对单个模型的界面。由于 admin 界面是从模型结构自动生成的，它的外观过于通用，需要出于美观和可用性的考虑进行自定义。点击 admin 应用中\
  \ Books 的一个链接并将其与 Users 链接进行比较。两个链接都会带你进入更改列表页面。这些是 Bookr 管理员在想要添加新书籍或添加或更改用户的权限时访问的页面。如前所述，更改列表页面会列出模型对象，并提供选择其中一组进行批量删除（或其他批量活动）、检查单个对象以编辑它或添加新对象的选项。注意两者之间的区别\n\
  \n\n两个变更列表页面，目的是让我们的原始 Books 页面具有与 Users 页面一样完整的功能。下面来自 Authentication and Authorization\
  \ 应用的截图包含了一些实用功能，例如搜索栏、可排序的重要用户字段列标题以及结果过滤器：\n\n![](img/4840a43efd335abd10b93708225692d6_210_0.png)\n\
  \n图 4.44 – Users 变更列表包含自定义的 ModelAdmin 功能\n\n在本节中，我们将学习如何开发 ModelAdmin 类来定制变更列表页面上的字段，并实现过滤器和搜索栏。我们还会了解如何将模型字段分组到\
  \ admin 的增删改查（CRUD）表单中，或者如果某些字段应保留默认值或系统生成的值，则将其从表单中排除。\n\n## 列表显示字段\n\n在 Users\
  \ 变更列表页面上，你会看到以下内容：\n\n- 其中列出了用户对象，并通过其 USERNAME、EMAIL ADDRESS、FIRST NAME、LAST NAME\
  \ 和 STAFF STATUS 属性进行摘要显示。\n- 这些单独的属性是可排序的。可以通过单击列标题来更改排序顺序。\n- 页面顶部有一个搜索栏。\n- 在右侧列中，有一个选择过滤器，允许选择多个用户字段，其中一些字段不会出现在列表显示中。\n\
  \n回顾第 2 章“模型与迁移”，我们在 Publisher、Book 和 Contributor 类上定义了 __str__ 方法。以 Book 类为例，它的\
  \ __str__() 表示返回图书对象的标题：\n\n```\nclass Book(models.Model):\n    ...\n    def __str__(self):\n\
  \        return self.title\n```\n\n如果我们没有在 Book 类上定义 __str__() 方法，它会从基类 Model，即\
  \ django.db.models.Model 中继承该方法。\n\n这个基类提供了一种以字符串形式表示对象的抽象方式。例如，当我们有一个 Book，其主键（此处为\
  \ id 字段）值为 17 时，最终会得到字符串表示形式 Book object (17)：\n\n![](img/4840a43efd335abd10b93708225692d6_212_0.png)\n\
  \n图 4.46 – 使用 Model __str__ 表示的 Books 变更列表\n\n在我们的应用中，将 Book 对象表示为多个字段的组合可能会很有用。例如，如果我们希望图书以\
  \ Title (ISBN) 的形式表示，下面的代码片段将产生所需的结果：\n\n```\nclass Book(models.Model):\n    ...\n\
  \    def __str__(self):\n        return \"{} ({})\".format(self.title, self.isbn)\n\
  ```\n\n这本身就是一项有用的更改，因为它使对象在应用中的表示更加直观：\n\n![](img/4840a43efd335abd10b93708225692d6_213_0.png)\n\
  \n图 4.47 – 带有自定义字符串表示的 Books 变更列表的一部分\n\n我们并不局限于在 list_display 字段中使用对象的 __str__\
  \ 表示。列表显示中出现的列由 Django admin 应用的 ModelAdmin 类决定。在 Django shell 中，我们可以导入 ModelAdmin\
  \ 类并检查其 list_display 属性：\n\n```\npython manage.py shell\n>>> from django.contrib.admin\
  \ import ModelAdmin\n>>> ModelAdmin.list_display\n('__str__',)\n```\n\n这就解释了为什么\
  \ list_display 的默认行为是显示一个单列表格，其中内容是对象的 __str__ 表示，这样我们就可以通过覆盖该值来定制列表显示。最佳实践是为每个对象创建\
  \ ModelAdmin 的子类。如果我们希望图书列表显示包含两个单独的列（Title 和 ISBN），而不是像图 4.47 那样用一个包含两个值的单列，我们可以创建\
  \ ModelAdmin 的子类 BookAdmin，并指定自定义的 list_display。这样做的好处是，我们现在可以按 Title 和 ISBN 对图书进行排序。我们可以将这个类添加到\
  \ reviews/admin.py 中：\n\n```\nclass BookAdmin(admin.ModelAdmin):\n    list_display\
  \ = ('title', 'isbn')\n```\n\n- 它可以接受 ModelAdmin 子类中的一个方法，该方法将模型对象作为单个参数。请注意，这需要以字符串参数的形式指定，因为若在类内部直接引用，它会超出作用域而未被定义：\n\
  \n```\nclass BookAdmin(admin.ModelAdmin):\n\n    list_display = ('title', 'isbn13')\n\
  \    def isbn13(self, obj):\n        \"\"\" '9780316769174' => '978-0-31-676917-4'\
  \ \"\"\"\n        return \"{}-{}-{}-{}-{}\".format(obj.isbn[0:3],\n            obj.isbn[3:4],\
  \ obj.isbn[4:6],\n            obj.isbn[6:12], obj.isbn[12:13])\n```\n\n- 它可以接受模型类的一个方法（或非字段属性），例如\
  \ __str__，只要该方法接受模型对象作为参数。例如，我们可以将 isbn13 转换为 Book 模型类上的一个方法：\n\n```\nclass Book(models.Model):\n\
  \n    def isbn13(self):\n        \"\"\" '9780316769174' => '978-0-31-676917-4' \"\
  \"\"\n        return \"{}-{}-{}-{}-{}\".format(self.isbn[0:3],\n            self.isbn[3:4],\
  \ self.isbn[4:6],\n            self.isbn[6:12], self.isbn[12:13])\n```\n\n现在，当你在\
  \ http://127.0.0.1:8000/admin/reviews/book 查看 Books 变更列表时，可以看到带连字符的 ISBN13 字段：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_215_0.png)\n\n图 4.49 – 带连字符 ISBN13 的\
  \ Books 变更列表的一部分\n\n值得注意的是，诸如 __str__ 或我们的 isbn13 方法之类的计算字段，在摘要页面上无法作为可排序字段。此外，我们不能在\
  \ list_display 中包含 ManyToManyField 类型的字段。\n\n虽然从模型属性派生的列会从字段属性中获取其列标题和属性，但我们可以使用\
  \ display 装饰器来指定计算字段的显示列属性。\n\n## display 装饰器\n\n在 `list_display` 中使用可调用对象时，如 `initialled_name`\
  \ 和 `isbn13` 的情况，我们可以使用 `admin.display` 装饰器，通过 `description` 参数指定将出现在变更列表标题中的列名。我们还可以通过在该可调用对象上指定\
  \ `ordering`，来绕过计算字段不可排序的限制。`empty_value` 参数可用于指定 None 值或空字符串的显示方式。默认的 empty_value\
  \ 显示为单个短横线字符：\n\n```\n@admin.display(\n    ordering='isbn',\n    description='ISBN-13',\n\
  \    empty_value='-/-'\n)\ndef isbn13(self, obj):\n    \"\"\" '9780316769174' =>\
  \ '978-0-31-676917-4' \"\"\"\n    return \"{}-{}-{}-{}-{}\".format(obj.isbn[0:3],\n\
  \                                   obj.isbn[3:4], obj.isbn[4:6], obj.isbn[6:12],\n\
  \                                   obj.isbn[12:13])\n```\n\n`admin.display` 的 boolean\
  \ 参数可用于标记一个值，使其以布尔形式呈现：\n\n```\n@admin.display(\n    boolean=True,\n    description='Has\
  \ ISBN',\n)\ndef has_isbn(self, obj):\n    \"\"\" '9780316769174' => True \"\"\"\
  \n    return bool(obj.isbn)\n```\n\n这些 display 装饰器设置组合在一起，将为我们提供如下所示的显示列：\n\n![](img/4840a43efd335abd10b93708225692d6_217_0.png)\n\
  \n图 4.50 – 带有 admin display 设置的 Books 变更列表\n\n## 过滤器\n\n一旦管理界面需要处理大量记录，缩小变更列表页面上显示的结果就很方便。最简单的过滤器是选择单个值。例如，图\
  \ 4.6 中描述的用户过滤器允许通过选择“按员工状态”、“按超级用户状态”和“按活跃状态”来筛选用户。我们已经在用户过滤器上看到，BooleanField 可以用作过滤器。我们还可以在\
  \ CharField、DateField、DateTimeField、IntegerField、ForeignKey 和 ManyToManyField 上实现过滤器。在这种情况下，通过将\
  \ publisher 添加为 Book 的 ForeignKey，其定义如下：\n\n```\npublisher = models.ForeignKey(Publisher,\n\
  \    on_delete=models.CASCADE)\n```\n\n过滤器是通过 ModelAdmin 子类的 list_filter 属性实现的。在我们的\
  \ Bookr 应用中，按书名或 ISBN 过滤是不切实际的，因为这会产生一个很大的过滤器选项列表，而每个选项只返回一条记录。页面右侧的过滤器会比实际的变更列表占据更多空间。一个实用的选择是按出版社过滤图书。我们为\
  \ Publisher 模型定义了一个自定义的 __str__ 方法，该方法返回出版社的 name 属性，因此我们的过滤器选项将显示为出版社名称。\n\n我们可以像这样在\
  \ reviews/admin.py 的 BookAdmin 类中指定变更列表过滤器：\n\n```\nlist_filter = ('publisher',)\n\
  ```\n\n\n\n\n以下是图书变更列表页面现在应呈现的样子：\n\n选择要更改的图书\n\n添加图书 +\n\n操作： — 执行 已选择 0 / 6 项\n\
  \n| 标题 | 图书 ISBN 号 |\n| --- | --- |\n| Hands-On Reinforcement Learning with Python\
  \ | 9781788836524 |\n| Natural Language Processing with TensorFlow | 9781788478311\
  \ |\n| Deep Reinforcement Learning Hands-On | 9781788834247 |\n| Architects of Intelligence\
  \ | 9781789954531 |\n| Hands-On Machine Learning for Algorithmic Trading | 9781789346411\
  \ |\n| Advanced Deep Learning with Keras | 9781788629416 |\n\n6 本图书\n\n筛选\n\n按出版社\n\
  \n- 全部\n- Packt Publishing\n- Harper Collins\n- Penguin Classics\n- Scribner\n-\
  \ Bay Back Books\n- Simon and Schuster\n- Houghton Mifflin Harcourt\n- HardPress\n\
  \n图 4.50 – 带出版社筛选器的图书变更列表页面\n\n通过这行代码，我们在图书变更列表页面上实现了一个有用的出版社筛选器。\n\n为了巩固我们对筛选器的理解，我们将为图书变更列表页面添加更多筛选器。\n\
  \n## 练习 4.04 – 添加 date list_filter 和 date_hierarchy 筛选器\n\n我们已知 `admin.ModelAdmin`\
  \ 类提供了一些有用的属性，用于自定义变更列表页面上的筛选器。例如，按日期筛选是许多应用程序的关键功能，也能帮助我们让应用更易于使用。在本练习中，我们将研究如何通过在筛选器中加入日期字段来实现日期筛选，并了解\
  \ `date_hierarchy` 筛选器：\n\n1. 编辑 `reviews/admin.py` 文件，修改 `BookAdmin` 类中的 `list_filter`\
  \ 属性，使其包含 `'publication_date'`：\n\n```\nclass BookAdmin(admin.ModelAdmin):\n   \
  \ list_display = ('title', 'isbn13')\n    list_filter = ('publisher', 'publication_date')\n\
  ```\n\n2. 重新加载图书变更列表页面，确认筛选器现在包含日期设置：\n\n![](img/4840a43efd335abd10b93708225692d6_219_0.png)\n\
  \n图 4.51 – 确认图书变更列表页面包含日期设置\n\n如果 Bookr 项目接收大量新书发布，并且我们想筛选最近七天或一个月内发布的图书，那么这个出版日期筛选器会非常方便。不过，有时我们可能希望按特定年份或特定年份中的特定月份进行筛选。幸运的是，`admin.ModelAdmin`\
  \ 类自带一个自定义筛选器属性，专用于按时间信息层级进行导航，它就是 `date_hierarchy`。\n\n3. 向 `BookAdmin` 添加一个 `date_hierarchy`\
  \ 属性，并将其值设置为 `publication_date`：\n\n```\nclass BookAdmin(admin.ModelAdmin):\n  \
  \  date_hierarchy = 'publication_date'\n    list_display = ('title', 'isbn13')\n\
  \    list_filter = ('publisher', 'publication_date')\n```\n\n6. 确认选择其中一个月后，会进一步筛选到该月中的具体日期：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_221_0.png)\n\n图 4.54 – 将月份筛选到该月中的具体日期\n\
  \n正如我们在本练习中所看到的，`date_hierarchy` 筛选器是一种方便的方式，用于自定义包含大量可按时间排序数据的变更列表，以便更快速地选择记录。\n\
  \n现在让我们来看看应用中搜索栏的实现。\n\n## 搜索栏\n\n这就引出了我们想要实现的最后一项功能——搜索栏。与筛选器一样，基本的搜索栏实现起来非常简单。我们只需在\
  \ `ModelAdmin` 类中添加 `search_fields` 属性即可。我们的 `Book` 类中显而易见的字符字段是 `title` 和 `isbn`。目前，图书变更列表顶部显示了一个日期层级。搜索栏将出现在其上方：\n\
  \n### 选择要更改的图书\n\n- 1996\n- 2001\n- 2002\n- 2004\n- 2006\n- 2012\n- 2017\n- 2018\n\
  - 2019\n\n操作：\n\n已选择 0 / 17 项\n\n|  | 标题 | 图书 ISBN 号 |\n| --- | --- | --- |\n| \
  \ | Paul Clifford | 9781719053167 |\n|  | Animal Farm: A Fairy Story | 9780151002177\
  \ |\n|  | 1984 | 9781328869333 |\n|  | Pride and Prejudice | 9780141439518 |\n|\
  \  | Fahrenheit 451 | 9781451673319 |\n|  | The Catcher in the Rye | 9780316769174\
  \ |\n|  | The Great Gatsby | 9780743273565 |\n|  | To Kill A Mockingbird | 9780060935467\
  \ |\n|  | For Whom The Bell Tolls | 9781476787770 |\n|  | The Grapes of Wrath |\
  \ 9780143039433 |\n\n筛选\n\n按出版社\n\n- 全部\n- Packt Publishing\n- Harper Collins\n\
  - Penguin Classics\n- Scribner\n- Bay Back Books\n- Simon and Schuster\n- Houghton\
  \ Mifflin Harcourt\n- HardPress\n\n按图书出版日期\n\n- 任意日期\n- 今天\n- 过去 7 天\n- 本月\n- 今年\n\
  \n图 4.55 – 添加搜索栏之前的图书变更列表\n\n我们可以先在 `reviews/admin.py` 的 `BookAdmin` 中添加此属性，然后查看结果：\n\
  \n```\nsearch_fields = ('title', 'isbn')\n```\n\n结果将如下所示：\n\n![](img/4840a43efd335abd10b93708225692d6_223_0.png)\n\
  \n图 4.56 – 带搜索栏的图书变更列表\n\n现在我们可以对与标题字段或 ISBN 匹配的字段执行简单的文本搜索。此搜索需要精确的字符串匹配，因此“color”不会匹配“colour”。它也缺乏我们期望从\
  \ Elasticsearch 等更复杂的搜索工具中获得的那种深层语义处理。如果你碰巧有条码扫描器，ISBN 查找是一个非常不错的功能。将搜索限制在 Books\
  \ 模型上的字段显得相当局限。我们可能还想按出版社名称搜索。幸运的是，`search_fields` 足够灵活，可以实现这一点。要搜索 `ForeignKeyField`\
  \ 或 `ManyToManyField`，我们只需指定当前模型上的字段名和关联模型上的字段名，两者用两个下划线分隔。在这种情况下，Book 有一个外键 `publisher`，我们想搜索\
  \ `Publisher.name` 字段，因此可以在 `BookAdmin.search_fields` 中将其指定为 `'publisher__name'`：\n\
  \n```\nsearch_fields = ('title', 'isbn', 'publisher__name')\n```\n\n如果我们希望将搜索字段限制为精确匹配，而不是返回包含搜索字符串的结果，那么可以在字段后加上\
  \ `__exact` 后缀。因此，将 `isbn` 替换为 `isbn__exact` 将要求匹配完整的 ISBN，我们将无法使用 ISBN 的一部分来获得匹配。\n\
  \n类似地，我们可以使用 `__startswith` 后缀来限制搜索字段，使其只返回以搜索字符串开头的匹配结果。将出版社名称搜索字段限定为 `publisher__name__startswith`\
  \ 意味着我们搜索“pack”会得到结果，但搜索“ackt”则不会。\n\n至此，我们完成了对变更列表页面常见自定义的探讨。我们可能还想自定义应用中创建和更新表单的行为。\n\
  \n## 排除字段和字段分组\n\n在某些情况下，在管理界面中限制模型中某些字段的可见性是合适的。这可以通过 `exclude` 属性来实现。\n\n这是带有**编辑日期**字段可见的评论表单屏幕。请注意，**创建日期**字段并未出现——它已经是一个隐藏视图，因为\
  \ `date_created` 在模型上是通过 `auto_now_add` 参数定义的：\n\n![](img/4840a43efd335abd10b93708225692d6_224_0.png)\n\
  \n图 4.57 – 评论表单\n\n如果我们想从评论表单中排除**编辑日期**字段，我们可以在 `ReviewAdmin` 类中进行如下操作：\n\n```python\n\
  exclude = ('date_edited',)\n```\n\n然后评论表单将不显示**编辑日期**：\n\n![](img/4840a43efd335abd10b93708225692d6_225_0.png)\n\
  \n图 4.58 – 排除编辑日期字段后的评论表单\n\n相反，更稳妥的做法可能是将管理字段限制为那些明确允许的字段。这可以通过 `fields` 属性来实现。这种方法的好处是，如果模型中添加了新字段，除非将它们添加到\
  \ `ModelAdmin` 子类的 `fields` 元组中，否则它们不会出现在管理表单中：\n\n```python\nfields = ('content',\
  \ 'rating', 'creator', 'book')\n```\n\n这将得到与之前相同的结果。\n\n\n\n\n另一个选项是使用 `ModelAdmin`\
  \ 子类的 `fieldsets` 属性，将表单布局指定为一系列分组字段。`fieldsets` 中的每个分组由一个标题和一个字典组成，字典中包含一个指向字段名字符串列表的\
  \ `fields` 键：\n\n```\nfieldsets = (\n    (\"Linkage\", {\"fields\": (\"creator\"\
  , \"book\")}),\n    (\"Review content\", {\"fields\": (\"content\", \"rating\")}),\n\
  )\n```\n\n评价表单应如下所示：\n\n![](img/4840a43efd335abd10b93708225692d6_226_0.png)\n\n\
  图 4.59 – 使用 fieldsets 的评价表单\n\n如果我们想省略某个 fieldset 的标题，可以将其设置为 `None`：\n\n```\nfieldsets\
  \ = (\n    (None, {'fields': ('creator', 'book')}),\n    ('Review content', {'fields':\
  \ ('content',\n                                   'rating')})\n)\n```\n\n现在，评价表单应如以下截图所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_227_0.png)\n\n图 4.60 – 第一个 fieldset 无标题的评价表单\n\
  \n我们已经了解了变更列表和表单定制，接下来可以通过一个综合活动将所学知识付诸实践。\n\n### 活动 4.03 – 定制 Model admin\n\n在我们的数据模型中，`Contributor`\
