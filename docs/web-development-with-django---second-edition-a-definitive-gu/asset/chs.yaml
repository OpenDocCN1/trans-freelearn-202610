  一旦你为书上传了封面和/或示例，就应该显示封面图像和示例链接（图 8.34）：\n\n![](img/4840a43efd335abd10b93708225692d6_448_0.png)\n\
  \n图 8.34：显示的图书封面和示例链接\n\n## 注意\n\n此活动的解决方案可在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions\
  \ 找到。\n\n## 总结\n\n在本章中，我们添加了 MEDIA_ROOT 和 MEDIA_URL 设置以及一个用于提供媒体文件的特殊 URL 映射。然后，我们创建了一个表单和一个视图来上传文件并将它们保存到媒体目录。我们了解了如何添加上下文处理器，以便在所有模板中自动访问\
  \ MEDIA_URL 设置。然后，我们通过使用带 FileField 或 ImageField 的 Django 表单，而不是在 HTML 中手动定义表单，增强并简化了表单代码。\n\
  \n我们了解了 Django 为 ImageField 提供的一些图像增强功能，以及如何使用 Pillow 与图像交互。我们展示了一个示例视图，该视图可以使用\
  \ FileResponse 类提供需要身份验证的文件。然后，我们了解了如何使用 FileField 和 ImageField 在模型上存储文件，并使用 FileField.url\
  \ 属性在模板中引用它们。通过从模型实例自动构建 ModelForm，我们减少了必须编写的代码量。最后，我们做了两个活动来增强 Bookr，为 Book 模型添加了封面图片和示例文件。\n\
  \n在第 9 章“会话与身份验证”中，我们将学习如何向 Django 应用程序添加身份验证，以保护其免受未经授权用户的访问。\n\n因此，当我们在 Django\
  \ 中编写视图时，不必在响应头中显式设置一系列重要的安全功能。这些对响应对象的附加内容会在视图返回响应后由 SecurityMiddleware 实例自动完成。由于中间件组件包装了视图，并对请求执行一系列预处理、对响应执行后处理，视图不会充满大量重复代码，我们可以专注于编写应用程序逻辑，而不是担心低层服务器行为。Django\
  \ 的中间件栈实现并没有将这些功能构建到 Django 核心中，而是允许这些组件既可选用又可替换。\n\n## 中间件模块\n\n当我们运行 startproject\
  \ 子命令时，默认的中间件模块列表会被添加到 <project>/settings.py 文件的 MIDDLEWARE 变量中，如下所示：\n\n```\nMIDDLEWARE\
  \ = [\n    \"django.middleware.security.SecurityMiddleware\",\n    \"django.contrib.sessions.middleware.SessionMiddleware\"\
  ,\n    \"django.middleware.common.CommonMiddleware\",\n    \"django.middleware.csrf.CsrfViewMiddleware\"\
  ,\n    \"django.contrib.auth.middleware.AuthenticationMiddleware\",\n    \"django.contrib.messages.middleware.MessageMiddleware\"\
  ,\n    \"django.middleware.clickjacking.XFrameOptionsMiddleware\",\n]\n```\n\n这是一个适合大多数\
  \ Django 应用程序的最小中间件栈。下面的列表详细说明了每个模块的通用用途：\n\n- SecurityMiddleware 提供常见的安全增强功能，例如处理\
  \ SSL 重定向和添加响应头以防止常见攻击\n- SessionMiddleware 启用会话支持，并无缝地将存储的会话与当前请求关联起来\n- CommonMiddleware\
  \ 实现许多杂项功能，例如拒绝来自 DISALLOWED_USER_AGENTS 列表的请求、实现 URL 重写规则以及设置 Content-Length 头\n\
  - CsrfViewMiddleware 添加针对跨站请求伪造（CSRF）的保护\n- AuthenticationMiddleware 向请求对象添加 user\
  \ 属性\n- MessageMiddleware 添加“flash”消息支持\n- `XFrameOptionsMiddleware` 防止 X-Frame-Options\
  \ 头导致的点击劫持攻击\n\n中间件模块按照它们在 MIDDLEWARE 列表中的出现顺序加载。这是合理的，因为我们希望首先调用处理初始安全问题的中间件，以便在进一步处理之前拒绝危险请求。Django\
  \ 还附带几个执行重要功能的其他中间件模块，例如使用 gzip 文件压缩、重定向配置和 Web 缓存配置。\n\n本章专门讨论作为中间件组件实现的有状态应用程序开发的两个重要方面\
  \ —— `SessionMiddleware` 和 `AuthenticationMiddleware`。\n\n`SessionMiddleware` 的\
  \ `process_request` 方法将一个 session 对象作为 `request` 对象的属性添加。`AuthenticationMiddleware`\
  \ 的 `process_request` 方法将一个 user 对象作为 `request` 对象的属性添加。\n\n如果项目不需要用户身份验证或不需要保留单独交互状态的手段，那么可以在没有这些中间件栈层的情况下编写\
  \ Django 项目。然而，大多数默认中间件在应用程序安全性中扮演重要角色。如果你没有充分理由更改中间件组件，最好保持这些初始设置。Admin 应用程序需要\
  \ `SessionMiddleware`、`AuthenticationMiddleware` 和 `MessageMiddleware` 才能运行，如果安装了\
  \ Admin 应用程序但没有它们，Django 服务器将抛出如下错误：\n\n```\ndjango.core.management.base.SystemCheckError:\
  \ SystemCheckError: System check identified some issues:\n\nERRORS:\n\n?: (admin.E408)\
  \ 'django.contrib.auth.middleware.AuthenticationMiddleware' must be in MIDDLEWARE\
  \ in order to use the admin application.\n?: (admin.E409) 'django.contrib.messages.middleware.MessageMiddleware'\
  \ must be in MIDDLEWARE in order to use the admin application.\n?: (admin.E410)\
  \ 'django.contrib.sessions.middleware.SessionMiddleware' must be in MIDDLEWARE in\
  \ order to use the admin application.\n```\n\n既然我们了解了中间件模块，让我们看看如何使用身份验证应用程序的视图和模板在我们的项目中启用身份验证的一种方法。\n\
  \n\n\n\n## 实现认证视图和模板\n\n我们在第4章“Django Admin 简介”中遇到了 Admin 应用中的登录表单。这是为有权访问 Admin\
  \ 应用的员工用户提供的认证入口点。我们还需要为想要发表书评的普通用户创建登录功能。幸运的是，认证应用提供了实现这一点的工具。\n\n当我们深入学习认证应用的表单和视图时，我们会遇到其实现中的很多灵活性。我们可以自由地实现自己的登录页面，在视图级别定义非常简单或细粒度的安全策略，并针对外部权威机构进行认证。\n\
  \n认证应用之所以存在，是为了容纳许多不同的认证方法，从而使 Django 不会僵化地强制执行单一机制。对于第一次接触文档的用户来说，这可能会让人相当困惑。在本章的大部分内容中，我们将遵循\
  \ Django 的默认设置，但也会指出一些重要的配置选项。\n\nDjango 项目的 settings 对象包含用于控制登录行为的属性。LOGIN_URL\
  \ 指定登录页面的 URL，默认值为 '/accounts/login/'。LOGIN_REDIRECT_URL 指定成功登录后重定向的路径，默认路径为 '/accounts/profile/'。\n\
  \n认证应用提供了用于执行典型认证任务的标准表单和视图。这些表单位于 django.contrib.auth.forms，而视图位于 django.contrib.auth.views。\n\
  \n这些视图被 django.contrib.auth.urls 中的以下 URL 模式引用：\n\n```python\nurlpatterns = [\n\
  \    path('login/', views.LoginView.as_view(),\n         name='login'),\n    path('logout/',\
  \ views.LogoutView.as_view(),\n         name='logout'),\n    path('password_change/',\n\
  \         views.PasswordChangeView.as_view(),\n         name='password_change'),\n\
  \    path('password_change/done/',\n         views.PasswordChangeDoneView.as_view(),\n\
  \         name='password_change_done'),\n    path('password_reset/',\n         views.PasswordResetView.as_view(),\n\
  \         name='password_reset'),\n    path('password_reset/done/',\n         views.PasswordResetDoneView.as_view(),\n\
  \         name='password_reset_done'),\n    path('reset/<uidb64>/<token>/',\n  \
  \       views.PasswordResetConfirmView.as_view(),\n         name='password_reset_confirm'),\n\
  \    path('reset/done/',\n         views.PasswordResetCompleteView.as_view(),\n\
  \         name='password_reset_complete'),\n]\n```\n\n如果这种视图风格看起来不熟悉，那是因为它们是类视图（class-based\
  \ views），而不是我们之前遇到的函数视图（function-based views）。我们将在*第11章“高级模板和类视图”*中了解更多关于类视图的内容。现在，请注意认证应用利用类继承来分组视图的功能，并避免大量重复编码。\n\
  \n如果我们想保持认证应用和 Django 设置预先配置的默认 URL 和视图，我们可以将认证应用的 URL 包含在我们项目的 `urlpatterns` 中。\n\
  \n通过这种方法，我们节省了大量工作。我们只需将认证应用的 URL 包含在 `<project>/urls.py` 文件中，并将其分配给 `accounts`\
  \ 命名空间。指定此命名空间可确保我们的反向 URL 与视图的默认模板值相对应。认证应用的视图包含对名为 `password_reset_done` 和 `password_reset_complete`\
  \ 的模板的代码引用，因此它们的路径也需要显式包含在我们的 urlpatterns 中：\n\n```python\nfrom django.contrib import\
  \ admin, auth\n...\n\nurlpatterns = [\n    path(\"admin/\", admin.site.urls),\n\
  \    path(\"accounts/\", include((\"django.contrib.auth.urls\",\n        \"auth\"\
  ),\n        namespace=\"accounts\")),\n    path(\"accounts/password_reset/done/\"\
  ,\n        auth.views.PasswordResetDoneView.as_view(),\n        name=\"password_reset_done\"\
  ),\n    path(\"accounts/reset/done/\",\n        auth.views.PasswordResetCompleteView.as_view(),\n\
  \        name=\"password_reset_complete\"),\n    path(\"\", reviews.views.index),\n\
  \    path(\"book-search/\", reviews.views.book_search,\n        name=\"book_search\"\
  ),\n    path(\"\", include(\"reviews.urls\")),\n]\n```\n\n尽管认证应用提供了表单和视图，但它缺乏将这些组件渲染为\
  \ HTML 所需的模板。*图 9.1* 列出了我们在项目中实现认证功能所需的模板。幸运的是，Admin 应用确实实现了一组我们可以使用的模板。\n\n我们可以简单地将\
  \ Django 源代码中 `django/contrib/admin/templates/registration` 目录和 `django/contrib/admin/templates/admin/login.html`\
  \ 下的模板文件复制到我们项目的 `templates/registration` 目录：\n\n> **注意**\n>\n> 当我们说 Django 源代码时，指的是您的\
  \ Django 安装所在的目录。如果您在虚拟环境中安装了 Django（如*前言*所述），您可以在 `<您的虚拟环境名称>/lib/python3.X/site-packages/django/contrib/admin/templates/registration/`\
  \ 找到这些模板文件。如果您的虚拟环境已激活且 Django 已安装在其中，您还可以在终端中运行 `python -c \"import sys; print(sys.path)\"\
  ` 命令来获取 `site-packages` 目录的完整路径。\n\n| 模板路径 |\n| --- |\n| `templates/registration/login.html`\
  \ |\n| `templates/registration/password_reset_email.html` |\n| `templates/registration/password_change_form.html`\
  \ |\n| `templates/registration/password_change_done.html` |\n| `templates/registration/password_reset_form.html`\
  \ |\n| `templates/registration/password_reset_done.html` |\n| `templates/registration/password_reset_confirm.html`\
  \ |\n| `templates/registration/password_reset_complete.html` |\n| `templates/registration/logged_out.html`\
  \ |\n\n图 9.1 – 认证模板的默认路径\n\n## 会话与认证\n\n> **注意**\n>\n> 我们只需要复制视图所依赖的模板，并应避免复制 `base.html`\
  \ 或 `base_site.html` 文件。\n\n起初这看起来结果不错，但就目前而言，Admin 模板并不能满足我们的精确需求，这一点从登录页面（*图 9.2*）可以看出：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_458_0.png)\n\n图 9.2 – 用户登录界面的初步尝试\n\n\
  由于这些认证页面继承自 Admin 应用的 `admin/base_site.html` 模板，因此它们遵循 Admin 应用的风格。我们希望这些页面遵循我们开发的\
  \ `bookr` 项目的风格。为此，我们可以对从 Admin 应用复制到我们项目中的每个 Django 模板执行以下三个步骤：\n\n1. 需要做的第一个更改是将\
  \ `{% extends \"admin/base_site.html\" %}` 标记替换为 `{% extends \"base.html\" %}`。\n\
  \n2. 鉴于 `templates/base.html` 仅包含标题、品牌和内容块的定义，我们应该检查 `bookr` 文件夹中模板的额外块替换。我们不会在应用的模板布局中使用\
  \ `userlinks` 和 `breadcrumbs` 块中的内容，因此这些块可以完全删除。\n\n   其中一些块，如 `content_title` 和\
  \ `reset_link`，包含与我们的应用程序相关的 HTML 内容，因此应予以保留。\n\n   例如，`password_change_done.html`\
  \ 模板包含 userlinks 和 breadcrumbs 块：\n\n```html\n{% extends \"admin/base_site.html\"\
  \ %}\n{% load i18n %}\n{% block userlinks %}{% url 'django-admindocs-docroot' as\
  \ docroot %}{% if docroot %}<a href=\"{{ docroot }}\">{% translate 'Documentation'\
  \ %}</a> / {% endif %}{% translate 'Change password' %} / <a href=\"{% url 'admin:logout'\
  \ %}\">{% translate 'Log out' %}</a>{% endblock %}\n{% block breadcrumbs %}\n<div\
  \ class=\"breadcrumbs\">\n<a href=\"{% url 'admin:index' %}\">{% translate 'Home'\
  \ %}</a>\n&rsaquo; {% translate 'Password change' %}\n</div>\n{% endblock %}\n\n\
  {% block content %}\n<p>{% translate 'Your password was changed.' %}</p>\n{% endblock\
  \ %}\n```\n\n   在 bookr 项目中，它将被简化为以下模板：\n\n```html\n{% extends \"base.html\" %}\n\
  {% load i18n %}\n\n{% block content %}\n<p>{% translate 'Your password was changed.'\
  \ %}</p>\n{% endblock %}\n```\n\n3. 同样，有一些反向 URL 模式需要更改以反映当前路径，因此 `{% url 'login'\
  \ %}` 将被替换为 `{% url 'accounts:login' %}`。\n\n鉴于这些考虑，下一个练习将重点将 Admin 应用的登录模板转换为 bookr\
  \ 项目的登录模板。\n\n> **注意**\n>\n> `i18n` 模块用于创建多语言内容。如果您打算为网站开发多语言内容，请在模板中保留 `i18n` 导入、`translate`\
  \ 标签和 `blocktrans` 语句。为简洁起见，本章不详细讨论这些内容。\n\n\n\n\n## 练习 9.01 – 改造 Admin 应用的登录模板\n\
  \n我们在本章开始时没有为项目提供登录页面。通过添加用于身份验证的 URL 模式，并将 Admin 应用中的模板复制到项目中，我们可以实现登录页面的功能。但这个登录页面直接从\
  \ Admin 应用复制而来，与 Bookr 的设计脱节，因此并不令人满意。在本练习中，我们将按照所需的步骤，将 Admin 应用的登录模板改造为适用于我们项目的模板。新的登录模板需要直接从\
  \ bookr 项目的 `templates/base.html` 中继承样式和格式：\n\n1. 在项目中创建一个 `templates/registration`\
  \ 目录。\n\nAdmin 登录模板位于 Django 源码目录下的 `django/contrib/admin/templates/admin/login.html`\
  \ 路径。它以 `extends` 标签、`load` 标签开始，导入 `i18n` 和 `static` 模块，并包含一系列覆盖父模板 `django/contrib/admin/templates/admin/base.html`\
  \ 中定义块的 `block` 扩展。`login.html` 文件的截断片段如以下代码块所示：\n\n```\n{% extends \"admin/base_site.html\"\
  \ %}\n{% load i18n static %}\n\n{% block extrastyle %}{{ block.super }}...\n{% endblock\
  \ %}\n\n{% block bodyclass %}{{ block.super }} login{% endblock %}\n{% block usertools\
  \ %}{% endblock %}\n{% block nav-global %}{% endblock %}\n{% block content_title\
  \ %}{% endblock %}\n{% block breadcrumbs %}{% endblock %}\n```\n\n2. 将此 Admin 登录模板\
  \ `django/contrib/admin/templates/admin/login.html` 复制到 `templates/registration`\
  \ 中，并使用 PyCharm 开始编辑该文件。\n\n3. 由于你正在编辑的登录模板位于 `templates/registration/login.html`，并扩展了基础模板（`templates/base.html`），请将\
  \ `templates/registration/login.html` 顶部的 `extends` 标签参数替换为以下内容：\n\n```\n{% extends\
  \ \"base.html\" %}\n```\n\n4. 我们不需要这个文件的大部分内容。只需保留包含登录表单的 `content` 块。模板的其余部分将包含加载\
  \ `i18n` 和 `static` 标签库的内容：\n\n```\n{% load i18n static %}\n\n{% block content %}\n\
  ...\n{% endblock %}\n```\n\n5. 现在，你必须将 `templates/registration/login.html` 中的路径和反向\
  \ URL 模式替换为适合你的项目的路径和反向 URL 模式。由于你的模板中没有定义 `app_path` 变量，因此需要用登录的反向 URL `'accounts:login'`\
  \ 来替换它。所以，考虑下面这一行：\n\n```\n<form action=\"{{ app_path }}\" method=\"post\" id=\"\
  login-form\">\n```\n\n这一行将更改为：\n\n```\n<form action=\"{% url 'accounts:login' %}\"\
  \ method=\"post\"\nid=\"login-form\">\n```\n\n你的项目路径中没有定义 `'admin_password_reset'`，因此它将替换为\
  \ `'accounts:password_reset'`。\n\n考虑下面这一行：\n\n```\n{% url 'admin_password_reset'\
  \ as password_reset_url %}\n```\n\n这将更改为以下一行：\n\n```\n{% url 'accounts:password_reset'\
  \ as password_reset_url %}\n```\n\n你的登录模板将如下所示：\n\n`templates/registration/login.html`\n\
  \n```\n{% extends \"base.html\" %}\n{% load i18n static %}\n\n{% block content %}\n\
  {% if form.errors and not form.non_field_errors %}\n<p class=\"errornote\">\n{%\
  \ if form.errors.items|length == 1 %}{% translate \"Please correct the error below.\"\
  \ %}{% else %}{% translate \"Please correct the errors below.\" %}{% endif %}\n\
  </p>\n{% endif %}\n```\n\n你可以在以下网址找到该文件的完整代码：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter09/Exercise9.01/bookr。\n\
  \n6. 如前所述，要使用标准的 Django 身份验证视图，我们必须为它们添加 URL 映射。打开 bookr 项目目录中的 `urls.py` 文件，确保从\
  \ `django.contrib` 中导入了 `auth`，并将这三个路径添加到 URL 模式中：\n\n```\nfrom django.contrib import\
  \ admin, auth\n...\nurlpatterns = [\n    ...\n    path(\"accounts/\",\n        include((\"\
  django.contrib.auth.urls\", \"auth\"),\n        namespace=\"accounts\")),\n    path(\"\
  accounts/password_reset/done/\",\n        auth.views.PasswordResetDoneView.as_view(),\n\
  \        name=\"password_reset_done\"),\n    path(\"accounts/reset/done/\",\n  \
  \      auth.views.PasswordResetCompleteView.as_view(),\n        name=\"password_reset_complete\"\
  ),\n    ...\n]\n```\n\n7. 现在，当你访问 http://127.0.0.1:8000/accounts/login/ 处的登录链接时，你将看到此页面：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_462_0.png)\n\n图 9.3 – Bookr 登录页面\n\n\
  完成此练习后，你已在项目中创建了非管理员身份验证所需的模板。\n\n> **注意**\n>\n> 在继续之前，你需要确保 `registration` 目录中的其余模板遵循\
  \ bookr 项目的样式；也就是说，它们不能继承自 Admin 应用的 `admin/base_site.html` 模板。你已经看到了 `password_change_done.html`\
  \ 和 `login.html` 模板是如何做到这一点的。请将你在本练习（以及之前部分）中学到的知识应用到 `registration` 目录中的其余文件。或者，你可以从本书的\
  \ GitHub 仓库下载修改后的文件：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter09/Activity9.01/bookr。\n\
  \n现在我们已经修改了项目以启用身份验证，接下来我们将学习 Django 中的密码和会话存储。\n\n## Django 中的密码存储\n\nDjango 不会将密码以明文形式存储在数据库中。相反，密码会使用\
  \ PBKDF2/SHA256、BCrypt/SHA256 或 Argon2 等哈希算法进行摘要处理。由于哈希算法是单向转换，这可以防止用户的密码从数据库中存储的哈希值被解密。用户通常期望系统管理员能找回他们遗忘的密码，因此这常常令他们感到意外，但这是安全设计中的最佳实践。所以，如果我们查询数据库中的密码，会看到类似这样的内容：\n\
  \n```\nsqlite> select password from auth_user;\npbkdf2_sha256$320000$auohDtokS8a6LAoaG79Tv1$Mxzssu6gfd5uZvI1ADFI4faAjP0g3puP2JxxFdWZI0=\n\
  pbkdf2_sha256$320000$SqoVF8nhgo4zgw4juRUNtAK5TATQEqXtbRAfc4Ccuuwr9nRHVuShZo5W6N90ygpvVbA=\n\
  pbkdf2_sha256$320000$Ss3eprgniu7e4q0ux9Xj5nh$/SAFKgXuYIWSm08PWEwBUsMfmPCYd60rAaz0JZnLKGs=\n\
  ```\n\n图 9.4 – Django SQLite3 数据库中的密码哈希\n\n此字符串的组成部分为 `<algorithm>$<iterations>$<salt>$<hash>`。由于一些哈希算法会随着时间推移而被攻破，而且我们有时需要满足强制性的安全要求，Django\
  \ 足够灵活，能够容纳新的算法，并可以维护用多种算法加密的数据。\n\n## 个人资料页面与 `request.user` 对象\n\n当登录成功时，登录视图会重定向到\
  \ `/accounts/profile`。但是，这个路径并未包含在现有的身份验证 URL 中，身份验证应用也没有为其提供模板。为了避免“Page not found”错误，需要一个视图和相应的\
  \ URL 模式。\n\n每个 Django 请求都有一个 `request.user` 对象。如果请求是由未认证用户发出的，`request.user` 将是一个\
  \ `AnonymousUser` 对象。如果请求是由已认证用户发出的，那么 `request.user` 将是一个 `User` 对象。这使得在 Django\
  \ 视图中检索个性化用户信息并在模板中渲染变得很容易。\n\n在下一个练习中，我们将向 bookr 项目添加一个个人资料页面。\n\n## 练习 9.02 –\
  \ 添加个人资料页面\n\n在本练习中，我们将向项目添加一个个人资料页面。为此，我们需要在 URL 模式中包含其路径，并在视图和模板中同时包含它。个人资料页面将简单地显示\
  \ `request.user` 对象中的以下属性：\n\n- `username`\n- `first_name` 和 `last_name`\n- `date_joined`\n\
  - `email`\n- `last_login`\n\n执行以下步骤以完成本练习：\n\n1. 将 `bookr/views.py` 添加到项目中。它需要一个简单的\
  \ `profile` 函数来定义我们的视图：\n\n```\nfrom django.shortcuts import render\n\ndef profile(request):\n\
  \    return render(request, 'profile.html')\n```\n\n2. 在你的主 bookr 项目的 `templates`\
  \ 文件夹中，创建一个名为 `profile.html` 的新文件。在此模板中，可以使用类似 `{{ request.user.username }}` 的表示法轻松引用\
  \ `request.user` 对象的属性：\n\n```\n{% extends \"base.html\" %}\n\n{% block title %}Bookr{%\
  \ endblock %}\n\n{% block content %}\n<h2>Profile</h2>\n<div>\n    <p>\n       \
  \ Username: {{ request.user.username }} <br>\n        Name: {{ request.user.first_name\
  \ }} {{\n```\n\n\n\n\n\n```\n```html\nrequest.user.last_name }}<br>\nDate Joined:\
  \ {{ request.user.date_joined }} <br>\nEmail: {{ request.user.email }}<br>\nLast\
  \ Login: {{ request.user.last_login }}<br>\n\n</p>\n</div>\n{% endblock %}\n```\n\
  ```\n\n我们还添加了一个包含用户个人资料详细信息的块。更重要的是，我们确保 `profile.html` 继承自 `base.html`。\n\n+  \
  \ 3. 最后，该路径需要在 `bookr/urls.py` 中的 `urlpatterns` 列表顶部添加。首先导入新的视图，然后添加一条将 `accounts/profile/`\
  \ URL 链接到 `bookr.views.profile` 的路径：\n\n```\n```python\nfrom bookr.views import\
  \ profile\n\nurlpatterns = [\n    path('accounts/profile/', profile,\n         name='profile'),\n\
  \    path(\"\", reviews.views.index),\n    path(\"book-search/\",\n         reviews.views.book_search,\n\
  \         name=\"book_search\"),\n    path('', include('reviews.urls'))]\n```\n\
  ```\n\n这是一个用户个人资料页面的良好开端。当 Alice 登录并访问 `http://localhost:8000/accounts/profile/`\
  \ 时，它会按图 9.5 所示渲染。请记住，如果需要启动服务器，请使用 `python manage.py runserver` 命令：\n\n![](img/4840a43efd335abd10b93708225692d6_466_0.png)\n\
  \n图 9.5 – Alice 访问她的用户个人资料\n\n至此，我们已经了解了如何在用户成功登录后将其重定向到其个人资料页面。现在，让我们讨论如何仅向特定用户授予内容访问权限。\n\
  \n## Authentication decorators and redirection\n\n现在我们已经学会如何允许普通用户登录到我们的项目，我们可以了解如何将内容限制为已认证用户。身份验证模块附带了一些有用的装饰器，可根据当前用户的身份验证或访问权限来保护视图。\n\
  \n不幸的是，如果例如名为 Alice 的用户退出 Bookr，个人资料页面仍会渲染并显示空的详细信息。最好不要发生这种情况，而是将任何未认证的访问者重定向到登录屏幕：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_467_0.png)\n\n图 9.6 – 未认证用户访问用户个人资料\n\
  \n身份验证应用附带了用于向 Django 视图添加身份验证行为的有用装饰器。在保护我们的个人资料视图这种情况下，我们可以使用 login_required 装饰器：\n\
  \n```\nfrom django.contrib.auth.decorators import login_required\n\n@login_required\n\
  def profile(request):\n    ...\n```\n\n现在，如果未认证用户访问 /accounts/profile URL，他们将被重定向到\
  \ http://localhost:8000/accounts/login/?next=/accounts/profile/。\n\n此 URL 将用户带到登录\
  \ URL。GET 变量中的 next 参数告诉登录视图在成功登录后重定向到何处。默认行为是重定向回当前视图，但这可以通过为 login_required 装饰器指定\
  \ login_url 参数来覆盖。例如，如果我们在登录后需要重定向到不同的页面，我们可以在装饰器调用中明确说明，如下所示：\n\n```\n@login_required(login_url='/accounts/profile2')\n\
  ```\n\n如果我们重写了登录视图，使其期望重定向 URL 指定在不同于 'next' 的 URL 参数中，我们可以在装饰器调用中使用 `redirect_field_name`\
  \ 参数明确说明：\n\n```\n```python\n@login_required(redirect_field_name='redirect_to')\n\
  ```\n```\n\n通常存在 URL 应该限制为持有特定条件的用户或组的情況。考虑我们有一个页面供员工用户查看任何用户个人资料的情况。我们不希望此 URL\
  \ 对所有用户都可访问，因此我们希望将此 URL 限制为具有 'view_user' 权限的用户或组，并将未经授权的请求转发到登录 URL：\n\n```\n\
  ```python\nfrom django.contrib.auth.decorators import (login_required,\n    permission_required)\n\
  …\n\n@permission_required('view_group')\ndef user_profile(request, uid):\n    user\
  \ = get_object_or_404(User, id=uid)\n    permissions = user.get_all_permissions()\n\
  \    return render(request, 'user_profile.html',\n        {'user': user, 'permissions':\
  \ permissions})\n```\n```\n\n因此，使用此装饰器应用于我们的 user_profile 视图后，未经授权的用户访问 `http://localhost:8000/accounts/users/123/profile/`\
  \ 将被重定向到 `http://localhost:8000/accounts/login/?next=/accounts/users/123/profile/`。\n\
  \n有时，我们需要构建更微妙的条件权限，这些权限不属于这两个装饰器的范围。为此目的，Django 提供了一个自定义装饰器，该装饰器接受任意函数作为参数。user_passes_test\
  \ 装饰器需要 test_func 参数：\n\n```\n```python\nuser_passes_test(test_func, login_url=None,\n\
  \    redirect_field_name='next')\n```\n```\n\n下面是一个示例，我们有一个视图 veteran_features，仅对注册时间超过一年的用户可用：\n\
  \n```\n```python\nfrom django.contrib.auth.decorators import (login_required,\n\
  \    permission_required, user_passes_test)\n…\n\ndef veteran_user(user):\n    now\
  \ = datetime.datetime.now()\n    if user.date_joined is None:\n        return False\n\
  \    return now - user.date_joined > datetime.timedelta(days=365)\n```\n\n```\n\
  @user_passes_test(veteran_user)\ndef veteran_features(request):\n    user = request.user\n\
  \    permissions = user.get_all_permissions()\n    return render(request, 'veteran_profile.html',\n\
  \        {'user': user, 'permissions': permissions})\n```\n\n有时，我们视图中的逻辑无法通过其中一个装饰器处理，我们需要在视图的控制流程中应用重定向。我们可以使用\
  \ redirect_to_login 辅助函数来执行此操作。它接受与装饰器相同的参数，如以下代码段所示：\n\n```\nredirect_to_login(next,\
  \ login_url=None,\n    redirect_field_name='next')\n```\n\n我们将在以下练习中通过将它们应用于 Bookr\
  \ 项目来巩固我们对身份验证装饰器的了解。\n\n## Exercise 9.03 – adding authentication decorators to\
  \ the views\n\n在了解了身份验证应用的权限和身份验证装饰器的灵活性后，我们现在将开始在 Reviews 应用中使用它们。我们需要确保只有已认证用户可以编辑评论，并且只有员工用户可以编辑出版社。有几种方法可以做到这一点，因此我们将尝试几种方法。所有这些步骤中的代码都在\
  \ reviews/views.py 文件中：\n\n+   1. 你解决这个问题的第一反应可能是认为 publisher_edit 方法需要一个适当的装饰器来强制用户具有\
  \ edit_publisher 权限。为此，你可以轻松地执行以下操作：\n\n```\nfrom django.contrib.auth.decorators\
  \ import\npermission_required\n...\n@permission_required('edit_publisher')\ndef\
  \ publisher_edit(request, pk=None):\n    ...\n```\n\n2. 使用这种方法是可以的，它是向视图添加权限检查的一种方法。你也可以使用稍微复杂但更灵活的方法。不要使用权限装饰器来强制\
  \ publisher_edit 方法的权限，你可以创建一个要求员工用户的测试函数，并将此测试函数应用于 publisher_edit，使用 user_passes_test\
  \ 装饰器。编写测试函数允许对用户访问权限或权限的验证方式进行更多自定义。如果你在步骤 1 中对 views.py 文件进行了更改，请随意注释掉装饰器（或删除它），并改写以下测试函数：\n\
  \n```\nfrom django.contrib.auth.decorators import\nuser_passes_test\n...\n\ndef\
  \ is_staff_user(user):\n    return user.is_staff\n\n@user_passes_test(is_staff_user)\n\
  ...\n```\n\n3. 通过添加适当的装饰器，确保 review_edit 和 book_media 需要登录：\n\n```\n...\n\nfrom\
  \ django.contrib.auth.decorators import\n    (login_required, user_passes_test)\n\
  ...\n@login_required\ndef review_edit(request, book_pk, review_pk=None):\n\n@login_required\n\
  def book_media(request, pk):\n...\n```\n\n4. 在 review_edit 方法中，添加逻辑要求用户必须是员工用户或评论的所有者。review_edit\
  \ 视图控制评论创建和评论更新的行为。我们正在开发的约束仅适用于现有评论正在更新的情况。因此，添加代码的位置是在成功检索到 Review 对象之后。如果用户不是员工帐户或评论的创建者与当前用户不匹配，我们需要引发\
  \ PermissionDenied 错误：\n\n\n```\n```python\n...\n\nfrom django.core.exceptions import\
  \ PermissionDenied\nfrom PIL import Image\nfrom django.contrib import messages\n\
  \n...\n\n@login_required\ndef review_edit(request, book_pk, review_pk=None):\n \
  \   book = get_object_or_404(Book, pk=book_pk)\n\n    if review_pk is not None:\n\
  \        review = get_object_or_404(Review,\n                                  \
  \ book_id=book_pk,\n                                   pk=review_pk)\n        user\
  \ = request.user\n        if not user.is_staff and review.creator.id != user.id:\n\
  \            raise PermissionDenied\n    else:\n        review = None\n\n...\n```\n\
  ```\n\n现在，当非工作人员用户尝试编辑其他用户的评论时，将抛出 Forbidden 错误，如图 *9.7* 所示。在下一节中，我们将研究如何在模板中应用条件逻辑，这样用户就不会进入其权限不足而无法访问的页面：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_471_0.png)\n\n图 9.7 – 非工作人员用户禁止访问\n\n\
  在本练习中，我们使用身份验证装饰器来保护 Django 应用中的视图。所应用的这些身份验证装饰器提供了一种简单的机制，来限制缺少必要权限的用户、非工作人员用户以及未认证用户访问视图。Django\
  \ 的身份验证装饰器提供了一种遵循 Django 角色和权限框架的健壮机制，而 `user_passes_test` 装饰器则提供了开发自定义身份验证的选项。\n\
  \n现在我们已经使用装饰器控制了应用的身份验证流程，接下来可以利用用户身份验证数据来自定义模板。\n\n## 使用身份验证数据增强模板\n\n在练习 9.02——添加个人资料页面中，我们看到可以将\
  \ `request.user` 对象传递给模板，以在 HTML 中渲染当前用户的属性。我们也可以根据用户类型或用户所拥有的权限，采用不同的模板渲染方式。考虑我们要添加一个仅对工作人员用户可见的编辑链接，可以使用一个\
  \ if 条件来实现这一点：\n\n```\n{% if user.is_staff %}\n<p><a href=\"{% url 'review:edit'\
  \ %}\">Edit this Review</a>\n</p>\n{% endif %}\n```\n\n如果我们不花时间根据权限有条件地渲染链接，用户在应用中导航时会感到沮丧，因为他们点击的许多链接都会导致\
  \ 403 禁止访问页面。接下来的练习将展示如何利用模板和身份验证在项目中呈现与上下文相符的链接。\n\n## 练习 9.04 ——在基础模板中切换登录和退出登录链接\n\
  \n在 bookr 项目的基础模板中（位于 `templates/base.html`），我们在页头有一个占位符形式的退出登录链接。其 HTML 代码如下：\n\
  \n```\n<li class=\"nav-item\">\n<a class=\"nav-link\" href=\"#\">Logout</a>\n</li>\n\
  ```\n\n我们不希望用户在退出登录后仍然看到退出登录链接。因此，本练习旨在对模板应用条件逻辑，以便根据用户是否已认证来切换登录和退出登录链接：\n\n- 1.\
  \ 编辑 `templates/base.html` 文件。复制退出登录列表元素的结构并创建一个登录列表元素。然后，将占位符链接替换为退出登录和登录页面的正确\
  \ URL——分别为 `/accounts/logout` 和 `/accounts/login`，如下所示：\n\n```\n```html\n<li class=\"\
  nav-item\">\n    <a class=\"nav-link\" href=\"/accounts/logout\">Logout\n    </a>\n\
  </li>\n<li class=\"nav-item\">\n    <a class=\"nav-link\" href=\"/accounts/login\"\
  >Login</a>\n</li>\n```\n```\n\n- 2. 现在，将我们的两个 `li` 元素放在一个 `if ... else ... endif`\
  \ 条件块中。我们要应用的逻辑条件是 `user.is_authenticated`：\n\n```\n```django\n{% if user.is_authenticated\
  \ %}\n    <li class=\"nav-item\">\n        <a class=\"nav-link\" href=\"/accounts/logout\"\
  >Logout\n        </a>\n    </li>\n{% else %}\n    <li class=\"nav-item\">\n    \
  \    <a class=\"nav-link\" href=\"/accounts/login\">Login\n        </a>\n    </li>\n\
  {% endif %}\n```\n```\n\n- 3. 现在，访问用户个人资料页面 `http://localhost:8000/accounts/profile/`。当已认证时，你会看到退出登录链接：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_473_0.png)\n\n图 9.8 – 已认证用户会看到退出登录链接\n\
  \n4. 现在，点击退出登录链接；你将被带到 `/accounts/logout` 页面。菜单中会出现登录链接，这证实了该链接是根据用户的认证状态而上下文相关的：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_474_0.png)\n\n图 9.9 – 未认证用户会看到登录链接\n\n\
  本练习是 Django 模板如何与身份验证信息结合使用，以创建有状态且上下文相关的用户体验的一个简单示例。我们也不希望提供用户无权访问的链接，或用户权限级别不允许执行的操作。以下活动将使用这一模板技术来修复\
  \ Bookr 中的一些此类问题。\n\n## 活动 9.01 ——在模板中使用条件块生成基于身份验证的内容\n\n在本活动中，你将在模板中应用条件块，根据用户认证和用户状态修改内容。不应向用户展示他们无权访问的链接或未被授权执行的操作。以下步骤将帮助你完成本活动：\n\
  \n- 1. 在 `book_detail` 模板中（文件位于 `reviews/templates/reviews/book_detail.html`），对未认证用户隐藏“添加评论”和“媒体”按钮。\n\
  - 2. 另外，隐藏显示“成为第一个撰写评论的人”的标题，因为这不是未认证用户可用的选项。\n- 3. 在同一个模板中，让“编辑评论”链接仅对工作人员用户或撰写该评论的用户显示。该模板块的条件逻辑与我们在上一节的\
  \ `review_edit` 视图中使用的条件逻辑非常相似：\n\n![](img/4840a43efd335abd10b93708225692d6_475_0.png)\n\
  \n图 9.10 – 当 Alice 登录后，她的评论上会出现编辑评论链接\n\n当另一个用户登录时，**编辑评论**链接将不会出现：\n\n![](img/4840a43efd335abd10b93708225692d6_475_1.png)\n\
  \n图 9.11 – 当 Bob 登录时，Alice 的评论上没有编辑评论链接\n\n- 4. 修改 `template/base.html`，使其在页头搜索表单右侧显示当前已认证用户的用户名，并链接到用户个人资料页面。\n\
  \n完成本活动后，你将在模板中添加反映当前用户认证状态和身份的动态内容，如下面的截图所示：\n\n![](img/4840a43efd335abd10b93708225692d6_475_2.png)\n\
  \n图 9.12 – 已认证用户的名称出现在搜索表单之后\n\n> **注意**\n> 你可以在此处找到本活动的解决方案：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions。\n\
  \n至此，我们已经回顾了 Django 中可用的身份验证机制，接下来可以考察 Django 如何实现会话。\n\n## 会话\n\n了解一些理论有助于理解为什么会话是\
  \ Web 应用中管理用户内容的常见解决方案。HTTP 协议定义了客户端与服务器之间的交互。它被称为“无状态”协议，因为服务器在请求之间不保留任何状态信息。这种协议设计在万维网早期非常适用于传递超文本信息，但并不适合那些向特定用户传递定制信息的安全\
  \ Web 应用的需求。\n\n我们现在已经习惯看到网站适应我们的浏览习惯。购物网站会推荐与我们最近浏览过的商品相似的商品，并告知我们本地区热门的商品。这些功能都需要一种有状态的网站开发方法。实现有状态\
  \ Web 体验的最常见方式之一就是通过会话。会话是指用户当前与 Web 服务器或应用的交互，要求在交互期间持续保存数据。这可能包括用户访问过的链接、执行过的操作，以及在交互中做出的偏好设置等信息。\n\
  \n如果用户在一个页面上将博客网站设置为深色主题，那么人们会期望下一页也使用相同的主题。我们将这种表现描述为维持状态。会话密钥作为浏览器 cookie 存储在客户端，可以与用户登录期间持续存在的服务器端信息进行关联。\n\
  \n在 Django 中，会话以中间件的形式实现。当我们最初在第 4 章《Django Admin 简介》中创建应用时，会话支持已经默认激活。\n\n### 会话引擎\n\
  \n当前和已过期会话的信息需要存储在某个地方。在万维网早期，这是通过将会话信息保存在服务器上的文件中完成的，但随着 Web 服务器架构变得更加复杂、性能需求不断提高，诸如数据库或内存存储等更高效的策略已成为常态。默认情况下，在\
  \ Django 中，会话信息存储在项目的数据库中。\n\n对于大多数小型项目来说，这是一个合理的默认设置。然而，Django 的中间件会话实现使我们能够灵活地以多种方式存储项目的会话信息，以\n\
  \n\n\n适合我们的系统架构和性能要求。每种不同的实现都称为会话引擎。如果我们想要更改会话配置，需要在项目的 settings.py 文件中指定 SESSION_ENGINE\
  \ 设置：\n\n- **缓存会话：** 在某些环境中，将会话信息缓存到内存或数据库中是一种适合高性能的方法。Django 为此目的提供了 django.contrib.sessions.backends.cache\
  \ 和 django.contrib.sessions.backends.cached_db 会话引擎。\n\n- **基于文件会话：** 如前所述，这是一种维护会话信息的方式，已有些过时，但在性能不是问题且有理由不将动态信息存储在数据库中的站点中可能适用。\n\
  \n- **基于 Cookie 的会话：** 而不是在服务器端保存会话信息，你可以通过将会话内容序列化为 JSON 并将其存储在基于浏览器的 cookie 中，从而完全在\
  \ Web 浏览器客户端中保存它们。\n\n## 你需要标记 cookie 内容吗？\n\nDjango 的所有会话实现都需要在用户的 Web 浏览器中存储一个\
  \ session ID cookie。\n\n无论使用哪种会话引擎，所有这些中间件实现都涉及在 Web 浏览器中存储站点特定的 cookie。在 Web 开发的早期，将\
  \ session ID 作为 URL 参数传递并不罕见，但出于安全原因，这种方法在 Django 中已被弃用。\n\n在许多司法管辖区，包括欧盟，网站在浏览器中设置\
  \ cookie 时在法律上必须警告用户。如果你在运营网站的地区存在此类立法要求，则有责任确保代码符合这些义务。请务必使用最新实现，并避免使用未跟上立法变化的已废弃项目。\n\
  \n> **注意**\n> 为了适应这些变化和立法要求，有许多有用的应用，例如 **Django Cookie Consent** 和 **Django Cookie\
  \ Law**，它们旨在与多个立法框架一起使用。你可以通过以下链接了解更多信息：\n> - https://github.com/jazzband/django-cookie-consent\n\
  > - https://github.com/TyMaszWeb/django-cookie-law\n> 存在许多 JavaScript 模块实现了类似的 cookie\
  \ 同意机制。\n\n有了这个认识，我们可以检查会话数据如何在 Django 中实现。\n\n## Pickle 还是 JSON 存储？\n\nPython 在其标准库中提供了\
  \ **pickle** 模块，用于将 Python 对象序列化为字节流表示。pickle 是一种二进制结构，其优点是不同架构和不同 Python 版本之间具有互操作性，因此可以在\
  \ Windows PC 上将 Python 对象序列化为 pickle，然后在 Linux Raspberry Pi 上反序列化为 Python 对象。\n\n\
  这种灵活性带来了安全漏洞，不建议将其用于表示不可信数据。考虑以下包含多种类型数据的 Python 对象。它可以使用 pickle 序列化：\n\n```\nimport\
  \ datetime\ndata = dict(viewed_books=[17, 18, 3, 2, 1],\n    search_history=['1981',\
  \ 'Machine Learning',\n    'Bronte'],\n    background_rgb=(96, 91, 92),\n    foreground_rgb=(17,\
  \ 17, 17),\n    last_login_login=datetime.datetime(2019, 12, 3,\n    15, 30, 30),\n\
  \    password_change=datetime.datetime(2019, 9, 2,\n    8, 41, 25),\n    user_class='Veteran',\n\
  \    average_rating=4.75,\n    reviewed_books={18, 3, 7})\n```\n\n使用 pickle 模块的\
  \ dumps（dump string）方法，我们可以将 data 对象序列化以生成字节表示：\n\n```\nimport pickle\ndata_pickle\
  \ = pickle.dumps(data)\n```\n\n**JSON 代表 JavaScript Object Notation。** JSON 的语法是\
  \ JavaScript 语言的一个小子集。它是消息传递和数据交换的广泛标准，通常用于在 Web 浏览器和服务器之间传输数据。我们可以使用与 pickle 格式概述类似的方法来序列化\
  \ JSON：\n\n```\nimport json\ndata_json = json.dumps(data)\n```\n\n由于 data 包含 Python\
  \ `datetime` 和 `set` 对象，而这些对象无法使用 JSON 序列化，因此在尝试序列化结构时，会抛出类型错误：\n\n```\nTypeError:\
  \ Object of type datetime is not JSON serializable\n```\n\n对于序列化为 JSON，我们可以将 `datetime`\
  \ 对象转换为 `string` 类型并将它们设置在列表中：\n\n```\ndata['last_login_login'] = \n    data['last_login_login'].strftime(\"\
  %Y%d%m%H%M%S\")\ndata['password_change'] = \n    data['password_change'].strftime(\"\
  %Y%d%m%H%M%S\")\ndata['reviewed_books'] = list(data['reviewed_books'])\n```\n\n\
  由于 JSON 数据是人类可读的，因此很容易检查：\n\n```\n{\"viewed_books\": [17, 18, 3, 2, 1], \"search_history\"\
  : [\"1981\", \"Machine Learning\", \"Bronte\"], \"background_rgb\": [96, 91, 92],\
  \ \"foreground_rgb\": [17, 17, 17], \"last_login_login\": \"20190312153030\", \"\
  password_change\": \"20190209084125\", \"user_class\": \"Veteran\", \"average_rating\"\
  : 4.75, \"reviewed_books\": [18, 3, 7]}\n```\n\n请注意，我们必须显式转换 `datetime` 和 `set`\
  \ 对象，但元组会自动转换为 JSON 中的列表。Django 随附 `PickleSerializer` 和 `JSONSerializer`。如果需要更改序列化器，可以通过在项目的\
  \ `settings.py` 文件中设置 `SESSION_SERIALIZER` 变量来更改：\n\n```\nSESSION_SERIALIZER =\n\
  'django.contrib.sessions.serializers.JSONSerializer'\n```\n\n## 练习 9.05 – 检查会话键\n\
  \n本练习的目的是查询项目的 SQLite 数据库并对 session 表执行查询，以熟悉会话数据是如何存储的。然后你将创建一个 Django 管理命令，用于检查使用\
  \ `JSONSerializer` 存储的会话数据：\n\n- 1. 启动 DB Browser for SQLite 应用程序并打开你的 db.sqlite3\
  \ 数据库：\n\n![](img/4840a43efd335abd10b93708225692d6_480_0.png)\n\n图 9.13 - DB Browser\
  \ for SQLite 中的表选择\n\n- 2. 在 Database Structure 选项卡下，展开 django_session 表：\n\n![](img/4840a43efd335abd10b93708225692d6_480_1.png)\n\
  \n图 9.14 - DB Browser for SQLite 中的表定义\n\n这会显示数据库中的 django_session 表在 session_key、session_data\
  \ 和 expire_date 字段中存储会话信息。\n\n3. 点击 Browse Data 选项卡并选择 django_session 表：\n\n![](img/4840a43efd335abd10b93708225692d6_481_0.png)\n\
  \n图 9.15 – 在 django_session 表中查询数据\n\n4. Django 使用加密签名值存储会话数据。由于默认情况下我们使用数据库来存储会话，因此我们将导入\
  \ Session 模型，以及 django.contrib.sessions.backends.db.SessionStore 的 SessionStore\
  \ 类，它具有 decode 方法，我们可以使用它来读取 Session 对象中编码的 session_data。\n\n5. 此代码片段可以通过在命令行中输入\
  \ python manage.py shell 来使用 Django shell 执行，以获取交互式提示：\n\n```\n>>> from django.contrib.sessions.backends.db\
  \ import SessionStore\n>>> from django.contrib.sessions.models import Session\n\
  >>> session_store = SessionStore()\n>>> sessions = Session.objects.all()\n>>> session_store.decode(sessions[0].session_data)\n\
  {'_auth_user_id': '2', '_auth_user_backend': 'django.contrib.auth.backends.ModelBackend',\
  \ '_auth_user_hash': 'eb5de6bf54460bafc9e0f555c65d16b17b3fdf754617d1d73529d9605fea2f0c'}\n\
  ```\n\n6. 使用这种方法，我们可以创建一个用于检查会话数据的管理命令。会话中可能存储敏感数据，因此创建管理命令可确保只有具有服务器控制台访问权限的用户才能访问数据。\n\
  \n7. 使用 PyCharm，在 Bookr 项目的 reviews/management/commands 目录中，创建一个名为 sessioninfo.py\
  \ 的 Python 文件。\n\n8. 让我们首先导入必要的模块。我们将使用 Python 标准库的 pprint 模块中的 pformat 命令来格式化会话数据。我们需要\
  \ django.contrib.auth.models 中的 User 模型和 django.contrib.sessions.models 中的 Session\
  \ 模型来查询 User 和 Session 对象。django.core.management.base 中的 BaseCommand 类为我们的 Django\
  \ 管理命令提供了脚手架：\n\n```\nfrom pprint import pformat\n\nfrom django.contrib.auth.models\
  \ import User\nfrom django.contrib.sessions.models import Session\nfrom django.contrib.sessions.backends.db\
  \ import SessionStore\nfrom django.core.management.base import BaseCommand\n```\n\
  \n9. 最低限度，用户命令需要通过将 Command 类子类化为 BaseCommand 并定义 handle 方法来定义。通常，额外的命令行参数将在 add_arguments\
  \ 方法中定义，但我们旨在创建一个非常简单的示例。Command 类的 help 属性用于在用户输入 python manage.py --help 或 python\
  \ manage.py sessioninfo --help 时提供信息：\n\n```\nclass Command(BaseCommand):\n    help\
  \ = \"List all user sessions and the data that\n            they contain.\"\n```\n\
  \n10. 编写 Command 类的 handle 方法。首先实例化一个 SessionStore 对象，然后遍历 Session 对象并使用 SessionStore.decode\
  \ 方法解码每个会话的数据。解密数据的 _auth_user_id 键引用数据库中的 User.id，因此我们可以使用 User 模型检索用户。\n\n现在，对于每个会话，将会话键、用户\
  \ ID、用户名和电子邮件地址写入控制台。我们将开发一个简单的 Python 实用程序来解密此会话信息。请注意，在管理命令中写入控制台时，最好调用 self.stdout.write\
  \ 而不是 print：\n\n```\ndef handle(self, *args, **options):\n    session_store = SessionStore()\n\
  \    for session in Session.objects.all():\n        data = session_store.decode(\n\
  \            session.session_data)\n        user = User.objects.get(\n         \
  \   id=data['_auth_user_id'])\n        self.stdout.write(\n            f\"Session\
  \ Key: {session.session_key}\"\n            f\" User: {user.id} {user.username}\"\
  \n            f\" {user.email}\")\n        self.stdout.write(pformat(data))\n```\n\
  \n\n\n\n\n```\n{user.email} \") self.stdout.write(pformat(data))\n```\n\n11. 现在，你可以使用这个管理命令来检查存储在数据库中的会话数据。你可以在命令行中按如下方式调用它：\n\
  \n```\npython manage.py sessioninfo\n```\n\n这将有助于在尝试最终活动时调试会话行为：\n\n```\n> python\
  \ manage.py sessioninfo\nSession Key: ocgo7sypaz01tlw92dr1ffkrogy0ux03 User: 2 carol\
  \ carol.brown@example.com\n{'_auth_user_backend': 'django.contrib.auth.backends.ModelBackend',\n\
  '_auth_user_hash': 'eb5de6bf54460bafc9e0f555c65d16b17b3fdf754617d1d73529d9605fea2f0c',\n\
  '_auth_user_id': '2'}\nSession Key: y2r3d7fwtpmsmrn2azcha2a01ehdnbhr User: 1 bob\
  \ bob.black@example.com\n{'_auth_user_backend': 'django.contrib.auth.backends.ModelBackend',\n\
  '_auth_user_hash': '322625efba7788f598d02fca5ad86bb14db4893f3c92bc4099822ea3bf4d1e4f',\n\
  '_auth_user_id': '1'}\nSession Key: gyfciciqm8ht8vmx3c8i8m8m6zh1ltgl User: 3 bookradmin\
  \ bookradmin@example.com\n{'_auth_user_backend': 'django.contrib.auth.backends.ModelBackend',\n\
  '_auth_user_hash': 'a30d9315c9b5dda38802da5e8e64f94b0b063f0136fad8456205ed8cced8ff30',\n\
  '_auth_user_id': '3'}\n```\n\n图 9.16 – Python 脚本\n\n此脚本输出解码后的会话信息。目前，会话仅包含三个键：\n\
  \n- `_auth_user_backend` 是用户后端类的字符串表示。由于我们的项目将用户凭据存储在模型中，因此使用 ModelBackend。\n\n\
  - `_auth_user_hash` 是用户密码的哈希值。\n\n- `_auth_user_id` 是从模型的 `User.id` 属性获得的用户 ID。\n\
  \n此练习帮助你熟悉 Django 中会话数据的存储方式。现在，我们将把注意力转向向 Django 会话中添加额外信息。\n\n## 在会话中存储数据\n\n\
  我们已经介绍了 Django 中会话的实现方式。现在，我们将简要研究一些可以利用会话来丰富用户体验的方法。在 Django 中，会话是请求对象的属性。它被实现为类似字典的对象。在我们的视图中，我们可以像典型的字典一样为会话对象分配键，如下所示：\n\
  \n```\nrequest.session['books_reviewed_count'] = 39\n```\n\n但有一些限制。首先，会话中的键必须是字符串，因此不允许使用整数和时间戳。其次，以下划线开头的键保留供内部系统使用。数据仅限于可以编码为\
  \ JSON 的值，因此某些无法解码为 UTF-8 的字节序列，例如之前列出的 `binary_key`，不能存储为 JSON 数据。另一个警告是避免将 `request.session`\
  \ 重新分配给不同的值。我们应该只分配或删除键。因此，不要这样做：\n\n```\nrequest.session = {'books_read_count':30,\
  \ 'books_reviewed_count': 39}\n```\n\n而是这样做：\n\n```\nrequest.session['books_read_count']\
  \ = 30\nrequest.session['books_reviewed_count'] = 39\n```\n\n在了解这些限制后，我们将研究如何在 Reviews\
  \ 应用中使用会话数据。\n\n### 练习 9.06 – 在会话中存储最近查看的书籍\n\n本练习的目的是使用会话来保存经过身份验证的用户最近浏览的 10 本书的信息。此信息将显示在\
  \ bookr 项目的个人资料页面上。当浏览一本书时，会调用 `book_detail` 视图。在本练习中，我们将编辑 `reviews/views.py` 并向\
  \ `book_detail` 方法添加一些额外逻辑。我们将在会话中添加一个名为 `viewed_books` 的键。利用 HTML 和 CSS 的基本知识，可以创建页面以在页面的不同分区中显示个人资料详细信息和已查看的书籍，如下所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_484_0.png)\n\n图 9.17 – 包含已查看书籍的个人资料页面\n\
  \n让我们开始步骤：\n\n1. 编辑 `reviews/views.py` 和 `book_detail` 方法。我们只对经过身份验证的用户添加会话信息感兴趣，因此添加一个条件语句来检查用户是否已通过身份验证，并将\
  \ `max_viewed_books_length`，即已查看书籍列表的最大长度，设置为 10：\n\n```python\ndef book_detail(request,\
  \ pk):\n    ...\n    if request.user.is_authenticated:\n        max_viewed_books_length\
  \ = 10\n```\n\n2. 在同一个条件块内，添加代码以检索 `request.session['viewed_books']` 的当前值。如果会话中不存在此键，则从空列表开始：\n\
  \n```python\nviewed_books = request.session.get(\n    'viewed_books', [])\n```\n\
  \n3. 如果当前书籍的主键已存在于 `viewed_books` 中，则以下代码将删除它：\n\n```python\nviewed_book = [book.id,\
  \ book.title]\nif viewed_book in viewed_books:\n    viewed_books.pop(\n        viewed_books.index(viewed_book))\n\
  ```\n\n4. 以下代码将当前书籍的主键插入到 `viewed_books` 列表的开头：\n\n```python\nviewed_books.insert(0,\
  \ viewed_book)\n```\n\n5. 添加以下键以仅保留列表的前 10 个元素：\n\n```python\nviewed_books = viewed_books[\n\
  \    :max_viewed_books_length]\n```\n\n6. 以下代码将我们的 `viewed_books` 添加回 `request.session['viewed_books']`，以便在后续请求中可用：\n\
  \n```python\nrequest.session['viewed_books'] = viewed_books\n```\n\n7. 如前所述，在 `book_detail`\
  \ 函数的末尾，使用请求和上下文数据渲染 `reviews/book_detail.html` 模板：\n\n```python\nreturn render(request,\
  \ \"reviews/book_detail.html\", context)\n```\n\n完成后，`book_detail` 视图将具有以下条件块：\n\
  \n```python\ndef book_detail(request, pk):\n    ...\n    if request.user.is_authenticated:\n\
  \        max_viewed_books_length = 10\n        viewed_books = request.session.get(\"\
  viewed_books\", [])\n        viewed_book = [book.id, book.title]\n        if viewed_book\
  \ in viewed_books:\n            viewed_books.pop(viewed_books.index(viewed_book))\n\
  \        viewed_books.insert(0, viewed_book)\n        viewed_books = viewed_books[:max_viewed_books_length]\n\
  \        request.session[\"viewed_books\"] = viewed_books\n    return render(request,\
  \ \"reviews/book_detail.html\", context)\n```\n\n8. 修改 `templates/profile.html`\
  \ 的页面布局和 CSS 以容纳已查看书籍分区。由于我们将来可能在此页面中添加更多分区，因此一个方便的布局概念是 **flexbox**。我们将添加此 CSS\
  \ 并将内容分离为嵌套的 div 实例，这些实例将在页面上水平排列。我们将内部 div 实例称为 `infocell` 实例，并为其设置绿色边框和圆角样式：\n\
  \n```\n<style>\n.flexrow { display: flex;\n           border: 2px black;\n}\n.flexrow\
  \ > div { flex: 1; }\n\n.infocell {\n    border: 2px solid green;\n    border-radius:\
  \ 5px 25px;\n    background-color: white;\n    padding: 5px;\n    margin: 20px 5px\
  \ 5px 5px;\n}\n\n</style>\n\n<div class=\"flexrow\" >\n    <div class=\"infocell\"\
  \ >\n        <p>Profile</p>\n        ...\n    </div>\n\n    <div class=\"infocell\"\
  \ >\n        <p>Viewed Books</p>\n        ...\n    </div>\n</div>\n```\n\n9. 修改\
  \ `templates/profile.html` 中的已查看书籍 div 元素，以便如果存在书籍，则显示其标题并链接到各个书籍详情页。这将呈现如下：\n\n\
  ```\n<a href=\"/books/1\">Advanced Deep Learning with Keras</a><br>\n```\n\n如果列表为空，则应显示一条消息。整个\
  \ div，包括对 `request.session.viewed_books` 的迭代，将如下所示：\n\n```\n<div class=\"infocell\"\
  \ >\n    <p>Viewed Books</p>\n    <p>\n    {% for book_id, book_title in\n    request.session.viewed_books\
  \ %}\n    <a href=\"/books/{{ book_id }}\">{{ book_title }}</a><br>\n    {% empty\
  \ %}\n        No recently viewed books found.\n    {% endfor %}\n    </p>\n</div>\n\
  ```\n\n一旦合并所有这些更改，完整的个人资料模板将如下所示：\n\n### templates/profile.html\n\n```\n{% extends\
  \ \"base.html\" %}\n\n{% block title %}Bookr{% endblock %}\n\n{% block heading %}Profile{%\
  \ endblock %}\n\n{% block content %}\n\n<style>\n```\n\n你可以在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter09/Exercise9.06/bookr/templates/profile.html\
  \ 找到此文件的完整代码。\n\n\n\n\n本练习通过添加最近查看的图书列表增强了个人资料页面。现在，当你访问个人资料链接 `http://127.0.0.1:8000/accounts/profile/`\
  \ 时，你将看到此页面：\n\n![](img/4840a43efd335abd10b93708225692d6_488_0.png)\n\n图 9.18 –\
  \ 最近查看的图书\n\n我们可以使用在 *练习 9.05 – 检查会话键* 中开发的 `sessioninfo` 管理命令，在此功能实现后检查用户的会话。它可以通过在命令行中传递会话数据作为参数来调用：\n\
  \n```bash\npython manage.py sessioninfo\n```\n\n我们可以看到图书 ID 和标题列在 `viewed_books`\
  \ 键中。请记住，通过查询 SQLite 数据库中的 `django_session` 表获得编码数据：\n\n```text\n> python manage.py\
  \ sessioninfo\nSession Key: mjbbpj6e6y0qayh1mj6sgw27kfugq1qc User: 4 alice alice.white@example.com\n\
  {'_auth_user_backend': 'django.contrib.auth.backends.ModelBackend',\n '_auth_user_hash':\
  \ '384340e0724b154062dca2d2c94a9fc94380dc323b9e1e433aff3aef799b99a3e',\n '_auth_user_id':\
  \ '4',\n 'viewed_books': [[17, 'Paul Clifford'],\n                  [1, 'Advanced\
  \ Deep Learning with Keras'],\n                  [13, 'Fahrenheit 451'],\n     \
  \             [6, 'Hands-On Reinforcement Learning with Python'],\n            \
  \      [4, 'Deep Reinforcement Learning Hands-On']]}\n```\n\n图 9.19 – 查看的图书存储在会话数据中\n\
  \n在本练习中，我们使用了 Django 的会话机制来存储有关用户与 Django 项目交互的临时信息。我们学习了如何从用户会话中检索此信息并在视图中显示，以告知用户其最近的活动。\n\
  \n## 活动 9.02 – 为图书搜索页面使用会话存储\n\n会话是存储有助于在网站上保持有状态体验的短暂信息的有效方式。用户经常重新访问诸如搜索表单之类的页面，当他们返回这些页面时，存储最近使用的表单设置会很方便。在第\
  \ 3 章 URL 映射、视图和模板中，我们为 bookr 项目开发了图书搜索功能。图书搜索页面有两个搜索范围选项 – 标题和贡献者。目前，每次访问该页面时，它都默认为标题：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_489_0.png)\n\n图 9.20 – 图书搜索表单的搜索和搜索范围字段\n\
  \n在此活动中，你将使用会话存储，以便当访问图书搜索页面 /book-search 时，它将默认为最近使用的搜索选项。你还将在个人资料页面添加第三个信息单元，其中包含最近使用的搜索词的链接列表。按照以下步骤完成此活动：\n\
  \n1. 编辑 book_search 视图并从会话中检索 search_history。\n2. 当表单收到有效输入且用户已登录时，将搜索选项和搜索文本追加到会话的搜索历史列表中。\n\
  \n   如果表单未填写（例如，首次访问页面时），则使用之前使用的搜索范围选项呈现表单 – 即标题或贡献者（图 9.21）：\n\n   ![](img/4840a43efd335abd10b93708225692d6_489_1.png)\n\
  \n   图 9.21 – 在搜索字段中选择贡献者\n\n3. 在个人资料模板中，包含一个额外的 `infocell` 分区用于搜索历史。\n4. 将搜索历史列为一系列指向图书搜索页面的链接。链接将采用以下形式：`/book-search?search=Python&search_in=title`。\n\
  \n此活动将挑战你应用会话数据来解决 Web 表单中的可用性问题。这种方法在许多现实世界情况下都有适用性，并将让你了解会话在创建有状态 Web 体验中的使用。完成此活动后，个人资料页面将包含第三个信息单元，如图\
  \ 9.22 所示：\n\n![](img/4840a43efd335abd10b93708225692d6_490_0.png)\n\n图 9.22 – 带有搜索历史信息单元的个人资料页面\n\
  \n> **注意**\n> 你可以在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions\
  \ 上找到此活动的解决方案。\n\n## 摘要\n\n在本章中，我们检查了 Django 的中间件实现的身份验证和会话。我们还学习了如何将身份验证和权限逻辑纳入视图和模板。现在，我们可以对特定页面设置权限并限制其访问仅限经过身份验证的用户。我们还检查了如何在用户的会话中存储数据并在后续页面上呈现它。\n\
  \n有了这些，你就具备了自定义 Django 项目以提供个性化 Web 体验的技能。你可以将内容限制为经过身份验证或特权用户，并根据他们之前的交互个性化用户的体验。在下一章中，我们将重新审视\
  \ Admin 应用并学习一些高级技术，我们可以使用这些技术来自定义我们的用户模型并对我们模型的管理员界面进行细粒度更改。\n"
- "## 高级 Django 管理和自定义\n\n假设我们想要自定义大型组织的管理站点首页。我们希望显示组织中不同系统的健康状况，并查看任何活跃的高优先级警报。如果这是一个建立在\
  \ Django 之上的内部网站，我们将需要对其进行自定义。添加此类功能将要求 IT 团队的开发人员自定义默认的管理面板并创建自己的自定义 AdminSite\
  \ 模块，该模块将呈现与默认管理站点提供的不同的索引页面。幸运的是，Django 使此类自定义变得容易。\n\n在本章中，我们将了解如何利用 Django 的框架及其可扩展性来自定义\
  \ Django 的默认管理界面（如 *图 10.1* 所示）。我们不仅将学习如何使界面更个性化；我们还将学习如何控制管理站点的不同方面，以便让 Django\
  \ 加载自定义管理站点，而不是随默认框架提供的管理站点。这种自定义在我们想要向管理站点引入默认情况下不存在的功能时非常有用：\n\n![](img/4840a43efd335abd10b93708225692d6_493_0.png)\n\
  \n图 10.1 – 默认 Django 管理面板界面\n\n本章建立在 *第 4 章、Django Admin 简介* 中练习的技能之上。简单回顾一下，我们学习了如何使用\
  \ Django 管理站点来控制我们 Bookr 应用的管理和授权。我们还学习了如何注册模型以读取和编辑其内容，以及如何使用 `admin.site` 属性自定义\
  \ Django 的管理界面。\n\n本章涵盖以下主题：\n\n- 自定义管理站点\n- 向管理站点添加视图\n\n现在，让我们通过了解如何开始自定义管理站点，利用\
  \ Django 的 `AdminSite` 模块为我们 Web 应用的管理门户添加强大的新功能，从而进一步扩展我们的知识。\n\n### 技术要求\n\n本章的完整代码文件可以在\
  \ `https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter10`\
  \ 找到\n\n### 自定义管理站点\n\nDjango 作为一个 Web 框架，为构建 Web 应用提供了大量自定义选项。我们在为项目构建管理应用时将使用\
  \ Django 提供的同样自由。\n\n在 *第 4 章、Django Admin 简介* 中，我们查看了如何使用 `admin.site` 属性来自定义 Django\
  \ 管理界面的元素。但是，如果我们需要更多地控制管理站点的行为怎么办？例如，如果我们想为用户访问 Bookr 管理面板时显示登录页面或注销页面的自定义模板怎么办？在这种情况下，提供的\
  \ `admin.site` 属性可能不够，我们将需要构建可以扩展默认管理站点行为的自定义。幸运的是，这可以通过扩展 Django 管理模块中的 `AdminSite`\
  \ 类轻松实现。但是，在我们开始构建管理站点之前，让我们先了解 Django 如何发现管理文件，以及如何利用此管理文件发现机制在 Django 内部构建一个新应用，该应用将充当我们的管理站点应用。\n\
  \n### 在 Django 中发现管理文件\n\n当我们在 Django 项目中构建应用时，我们经常使用 `admin.py` 文件来注册我们的模型或创建 `ModelAdmin`\
  \ 类来自定义我们在管理界面中与模型交互的方式。这些 `admin.py` 文件存储此信息并将其提供给项目的管理界面。一旦我们在 `settings.py` 文件的\
  \ `INSTALLED_APPS` 部分中添加 `django.contrib.admin`，Django 就会自动执行这些文件的发现：\n\n\n![](img/4840a43efd335abd10b93708225692d6_495_0.png)\n\
  \nFigure 10.2 – Bookr 应用结构\n\n如前图所示，我们在 reviews 应用目录下有一个 admin.py 文件，Django 使用它来自定义\
  \ Bookr 的管理站点。\n\n当 admin 应用被添加时，它会尝试在我们正在工作的 Django 项目的每个应用中查找 admin 模块，如果找到模块，admin\
  \ 应用就会从中加载内容。\n\n## Django 的 AdminSite 类\n\n在开始自定义 Django 管理站点之前，我们必须了解默认的管理站点是如何生成并由\
  \ Django 处理的。\n\n为了提供默认的管理站点，Django 打包了一个名为 admin 模块的模块，其中包含一个名为 AdminSite 的类。该类实现了大量有用的功能和智能默认值，Django\
  \ 社区认为这些对于为大多数 Django 网站实现有用的管理面板很重要。默认的 AdminSite 类提供了大量内置属性，这些属性不仅控制默认管理站点在 Web\
  \ 浏览器中呈现的外观和感觉，还控制我们如何与其交互，以及特定交互将导致什么操作。\n\n这些默认值中的一些包括站点模板属性，例如要在站点标题中显示的文本，要在\
  \ Web 浏览器标题栏中显示的文本，与 Django `auth` 模块集成的文本以进行管理站点的身份验证，以及许多其他属性。\n\n随着我们朝着为我们的 Django\
  \ Web 项目构建自定义管理站点的目标前进，保留 Django `AdminSite` 类中已内置的大量有用功能是非常可取的。这就是 Python 面向对象编程概念来救援的地方。\n\
  \n当我们开始向前迈进创建自定义管理站点时，我们将尝试利用 Django 默认 `AdminSite` 类提供的现有有用功能集。为此，我们不会从头开始构建一切，而是将致力于创建一个继承自\
  \ Django `AdminSite` 类的新子类的创建，以利用 Django 已经为我们提供的现有功能集和有用集成。这种方法使我们能够专注于为自定义管理站点添加新的有用功能集，而不是花费时间从头实现基本功能集。例如，以下代码片段展示了如何创建\
  \ Django `AdminSite` 类的子类：\n\n```\nclass MyAdminSite(admin.AdminSite):\n    ...\n\
  ```\n\n为了开始为我们的 Web 应用构建自定义管理站点，让我们首先通过使用我们将要工作的自定义 `AdminSite` 类来覆盖 Django 管理面板的一些基本属性。\n\
  \n可以覆盖的属性包括 `site_header`、`site_title` 等。\n\n> **Note**\n> 在创建自定义管理站点时，我们将不得不再次注册任何我们可能使用默认\
  \ `admin.site` 变量注册的 `Model` 和 `ModelAdmin` 类。这是因为自定义管理站点不会继承 Django 提供的默认管理站点的实例细节，因此除非我们重新注册我们的\
  \ `Model` 和 `ModelAdmin` 接口，否则我们的自定义管理站点将不会显示它们。\n\n现在，知道了 Django 如何发现要加载到管理界面中的内容以及我们如何开始构建自定义管理站点，让我们继续尝试为\
  \ Bookr 创建自定义 admin 应用，该应用扩展了 Django 提供的现有 `admin` 模块。在接下来的练习中，我们将使用 Django 的 `AdminSite`\
  \ 类为我们的 Bookr 应用创建自定义管理站点界面。\n\n## Exercise 10.01 – 为 Bookr 创建自定义管理站点\n\n在本练习中，你将创建一个扩展默认\
  \ Django 管理站点的新应用，并允许你自定义界面的组件。因此，你将自定义 Django 管理面板的默认标题。完成此操作后，你将覆盖 Django 的 admin.site\
  \ 属性的默认值，使其指向你的自定义管理站点：\n\n1. 在开始处理自定义管理站点之前，你首先需要确保你位于项目中可以运行 Django 应用管理命令的正确目录中。为此，使用终端或\
  \ Windows 命令提示符导航到 bookr 目录，然后通过运行以下命令创建一个名为 bookr_admin 的新应用，它将作为 Bookr 的管理站点：\n\
  \n```\npython3 manage.py startapp bookr_admin\n```\n\n一旦此命令成功执行，你应该在项目内部看到一个名为 bookr_admin\
  \ 的新目录。\n\n2. 现在，默认结构已配置好，下一步是创建一个名为 BookrAdmin 的新类，它将扩展 Django 提供的 AdminSite 类以继承默认管理站点的属性。为此，在\
  \ PyCharm 中打开 bookr_admin 目录下的 admin.py 文件。打开文件后，你会看到文件内部已经存在以下代码片段：\n\n```\nfrom\
  \ django.contrib import admin\n```\n\n现在，保持此导入语句不变，从下一行开始，创建一个名为 BookrAdmin 的新类，它继承自你之前导入的\
  \ admin 模块提供的 AdminSite 类：\n\n```\nclass BookrAdmin(admin.AdminSite):\n```\n\n在此新的\
  \ BookrAdmin 类内部，通过设置 site_header 属性来覆盖 site_header 变量的默认值，该变量负责在 Django 管理面板中渲染站点标题，如下所示：\n\
  \n```\nsite_header = \"Bookr Administration\"\n```\n\n至此，自定义管理站点类已定义。要使用此类，你将首先创建此类的一个实例。这可以按如下方式完成：\n\
  \n```\nadmin_site = BookrAdmin(name='bookr_admin')\n```\n\n3. 保存文件但不要关闭它；我们将在第 5\
  \ 步中重新访问它。接下来，让我们编辑 bookr 应用中的 urls.py 文件。\n\n在前面的屏幕截图（Figure 10.3）中，你会看到 Django\
  \ 显示一条消息，You don't have permission to view or edit anything。权限不足的问题发生是因为在此之前，我们尚未向自定义\
  \ AdminSite 实例注册任何模型。该问题也适用于随 Django auth 模块一起提供的 User 和 Groups 模型。现在，让我们通过注册 Django\
  \ auth 模块中的 User 模型来使我们的自定义管理站点更有用。\n\n+   6. 要注册 Django auth 模块中的 User 模型，请在 PyCharm\
  \ 中打开 bookr_admin 目录下的 admin.py 文件，并在文件顶部添加以下行：\n\n```\nfrom django.contrib.auth.admin\
  \ import User\n```\n\n在文件末尾，使用你的 BookrAdmin 实例按如下方式注册此模型：\n\n```\nadmin_site.register(User)\n\
  ```\n\n到目前为止，你的 admin.py 文件应如下所示：\n\n```\nfrom django.contrib import admin\nfrom\
  \ django.contrib.auth.admin import User\n\nclass BookrAdmin(admin.AdminSite):\n\
  \    site_header = \"Bookr Administration\"\n\nadmin_site = BookrAdmin(name='bookr_admin')\n\
  admin_site.register(User)\n```\n\n完成此操作后，重新加载 Web 服务器并访问 http://localhost:8000/admin。现在，你应该能够在管理界面中看到\
  \ User 模型以供编辑，如下所示：\n\n![](img/4840a43efd335abd10b93708225692d6_499_0.png)\n\nFigure\
  \ 10.4 – 显示我们在 Bookr Administration 站点上已注册模型的首页视图\n\n至此，我们刚刚创建了我们的 admin 站点应用，并且我们也可以现在验证自定义站点具有不同的标题\
  \ – **Bookr Administration**。\n\n## 覆盖默认的 admin.site\n\n在上一节中，在我们创建自己的 `AdminSite`\
  \ 应用后，我们看到我们必须手动注册模型。这是因为我们在自定义管理站点之前构建的大多数应用仍然使用 `admin.site` 属性来注册其模型，如果我们想使用我们的\
  \ `AdminSite` 实例，我们将不得不更新所有这些应用以使用我们的实例，如果项目中有很多应用，这可能会变得繁琐。\n\n幸运的是，我们可以通过覆盖默认的\
  \ `admin.site` 属性来避免这种额外的负担。为此，我们首先必须创建一个新的 `AdminConfig` 类，它将为我们覆盖默认的 `admin.site`\
  \ 属性，以便我们的应用被标记为默认管理站点，从而覆盖项目中 `admin.site` 属性。在下一个练习中，我们将了解如何将我们的自定义管理站点映射为应用的默认管理站点。\n\
  \n## Exercise 10.02 – 覆盖默认管理站点\n\n在本练习中，你将使用 `AdminConfig` 类来覆盖项目的默认管理站点，这样你就可以继续使用默认的\
  \ `admin.site` 变量来注册模型、覆盖站点属性等：\n\n+   1. 打开 `bookr_admin` 目录下的 `admin.py` 文件并删除你在\
  \ *Exercise 10.01 – creating a custom admin site for Bookr* 的第 5 步中编写的 User 模型的导入和\
  \ BookrAdmin 实例创建。完成此操作后，文件内容应类似于以下内容：\n\n```\n```python\nfrom django.contrib import\
  \ admin\n\nclass BookrAdmin(admin.AdminSite):\n    site_header = \"Bookr Administration\"\
  \n```\n```\n\n+   2. 然后你需要为自定义管理站点创建一个 `AdminConfig` 类，以便 Django 识别 BookrAdmin 类作为\
  \ AdminSite 并覆盖 `admin.site` 属性。为此，打开 `bookr_admin` 目录中的 `apps.py` 文件并用此处显示的内容覆盖文件的内容：\n\
  \n```\n```python\nfrom django.contrib.admin.apps import AdminConfig\n\nclass BookrAdminConfig(AdminConfig):\n\
  \    default_site = 'bookr_admin.admin.BookrAdmin'\n```\n```\n\n\n\n\n\n在此过程中，我们首先从Django的admin模块中导入了AdminConfig类。该类用于定义哪个应用应被用作默认管理站点，并覆盖Django管理站点的默认行为。\n\
  \n针对我们的用例，我们创建了一个名为BookrAdminConfig的类，它是Django的AdminConfig类的子类，并覆盖了default_site属性，使其指向我们的自定义管理站点BookrAdmin类：\n\
  \n```\ndefault_site = 'bookr_admin.admin.BookrAdmin'\n```\n\n完成此操作后，我们需要在Bookr项目中将我们的应用设置为管理应用。为此，打开Bookr项目的settings.py文件，在INSTALLED_APPS部分，将'reviews.apps.ReviewsAdminConfig'替换为'bookr_admin.apps.BookrAdminConfig'。settings.py文件应如下所示：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter10/Exercise10.02/bookr/settings.py.\n\
  \n3. 将应用映射为管理应用后，最后一步涉及修改URL映射，使'admin/'端点使用admin.site属性来查找正确的URL。为此，打开bookr项目下的urls.py文件。请查看urlpatterns列表中的以下条目：\n\
  \n```\npath('admin/', admin_site.urls)\n```\n\n将其替换为以下条目：\n\n```\nfrom django.contrib\
  \ import admin\n\nurlpatterns = [\n    ...\n    path('admin/', admin.site.urls)\n\
  ]\n```\n\n请记住，admin_site.urls是一个模块，而admin.site是Django的内部属性。\n\n完成上述步骤后，让我们重新加载Web服务器，并通过访问http://localhost:8000/admin来检查管理站点是否加载。如果加载的网站如下图所示，那么我们现在就有了自己的自定义管理应用用于管理界面：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_502_0.png)\n\n图10.5——自定义Bookr管理站点的主页视图\n\
  \n如你所见，一旦我们用自定义管理应用覆盖admin.site，之前使用admin.site.register属性注册的模型就会自动显示出来。\n\n这样一来，我们现在有了一个自定义基础模板，可以利用它来构建Django管理站点其余的自定义功能。随着本章的深入，我们将发现一些有趣的自定义方法，使管理仪表盘成为我们应用程序的集成部分。\n\
  \n## 使用AdminSite属性自定义管理站点文本\n\n就像我们可以使用admin.site属性来自定义Django应用程序的文本一样，我们也可以使用AdminSite类公开的属性来定制这些文本。在练习10.02——覆盖默认管理站点中，我们了解了如何更新管理站点的site_header属性。类似地，还有许多其他属性可以修改。下面描述了一些可以被覆盖的属性：\n\
  \n- site_header：在管理站点每个页面顶部显示的文本（默认为“Django Administration”）。\n- site_title：在浏览器标题栏中显示的文本（默认为“Django\
  \ Admin Site”）。\n- site_url：用于“查看站点”选项的链接（默认为/）。当站点运行在自定义路径上时，该属性会被覆盖，重定向应直接将用户带到子路径。\n\
  - index_title：应显示在管理应用程序索引页面上的文本（默认为“Site administration”）。\n\n> 注意\n> 有关所有AdminSite属性的更多信息，请参阅官方Django文档：https://docs.djangoproject.com/en/4.1/ref/contrib/admin/#adminsite-attributes.\n\
  \n如果我们想在自定义管理站点中覆盖这些属性，过程非常简单，如下所示：\n\n```\nclass MyAdminSite(admin.AdminSite):\n\
  \    site_header = \"My web application\"\n    site_title = \"My Django Web application\"\
  \n    index_title = \"Administration Panel\"\n```\n\n正如我们到目前为止在示例中所看到的，我们为Bookr创建了一个自定义管理应用程序，然后将其设为项目的默认管理站点。一个有趣的问题是，既然我们迄今为止所自定义的属性也可以直接使用admin.site对象进行自定义，那么与修改admin.site属性相比，什么时候应该创建自定义管理应用程序呢？\n\
  \n事实证明，有人会选择自定义管理站点可能有多种原因——例如，他们想要更改默认管理站点的布局，使其与应用程序的整体布局保持一致。当你为企业创建Web应用程序时，这一点非常常见，因为内容的同质性非常重要。以下是一小段需求列表，这些需求可能会促使开发人员继续构建自定义管理站点，而不是简单地修改admin.site变量的属性：\n\
  \n- 需要覆盖管理界面的索引模板\n- 需要覆盖登录或退出模板\n- 需要向管理界面添加自定义视图\n\n## 自定义管理站点模板\n\n与site_header和site_title等出现在管理站点中的一些可自定义公共文本一样，Django也允许我们通过设置AdminSite类中的某些属性来自定义用于渲染管理站点不同页面的模板。\n\
  \n这些自定义可以包括修改用于渲染索引页面、登录页面、模型数据页面等的模板。利用Django提供的模板系统，可以轻松完成这些自定义。例如，以下代码片段展示了如何向Django管理仪表盘添加新模板：\n\
  \n```\n{% extends \"admin/base_site.html\" %}\n\n{% block content %}\n<!-- Template\
  \ Content -->\n{% endblock %}\n```\n\n在这个自定义模板中，有几个重要方面需要我们理解。\n\n在通过修改仪表盘内某些页面的外观或向仪表盘添加一组新页面来定制现有Django管理仪表盘时，开发人员可能不想从头重新编写每一段HTML，以保持Django管理仪表盘的基本外观和感觉。\n\
  \n通常，在自定义管理仪表盘时，我们希望保留Django组织仪表盘上显示的不同元素的布局，这样我们就可以专注于修改页面中对我们重要的部分。页面的基本布局以及页眉和页脚等常见页面元素都定义在Django管理站点的基础模板中，该模板也是默认Django管理网站内所有页面的母版模板。\n\
  \n当我们想保留Django管理页面中公共元素的组织和渲染方式时，我们需要扩展这个基础模板，以便我们的自定义模板页面能提供与Django管理仪表盘内其他页面一致的用户体验。这可以通过使用模板扩展标签并扩展Django提供的admin模块中的base_site.html模板来实现：\n\
  \n```\n{% extends \"admin/base_site.html\" %}\n```\n\n完成此操作后，下一个任务是为自定义模板定义我们自己的内容。Django提供的base_site.html模板为开发人员提供了一个基于块的占位符，以便他们为模板添加自己的内容。要添加此内容，开发人员必须将其自定义页面元素的逻辑放在{%\
  \ block content %}标签内。这实质上覆盖了base_site.html模板中由{% block content %}标签定义的任何内容，遵循了Django中的模板继承概念。\n\
  \n现在，让我们看看如何自定义用于渲染退出页面的模板，即当用户在管理面板中单击“退出”（Logout）按钮时。\n\n## 练习10.03——为Bookr管理站点自定义退出模板\n\
  \n在本练习中，您将自定义用于渲染退出页面的模板，即当用户在管理站点上单击“退出”按钮时。当为银行用户开发的网站可能希望在用户点击“退出”后将其重定向到说明页面，以向他们显示说明，确保其银行会话安全关闭时，这种覆盖会非常有用：\n\
  \n- 1. 在您应该已在前面章节中创建的templates目录下，再创建一个名为admin的目录，该目录将用于存储自定义管理站点的模板。\n\n> 注意\n\
  > 在继续之前，请确保templates目录已添加到settings.py文件（位于bookr/project下）的DIRS列表中。\n\n- 2. 现在，目录结构设置已完成，Django也已配置为加载模板，下一步涉及编写您想要渲染的自定义退出模板。为此，让我们在步骤1中创建的templates/admin目录下创建一个名为logout.html的新文件，并在其中添加以下内容：\n\
  \n```\n{% extends \"admin/base_site.html\" %}\n\n{% block content %}\n<p>You have\
  \ been logged out from the Admin panel.</p>\n<p><a href=\"{% url 'admin:index' %}\"\
  >Login Again</a>\nor <a href=\"{{ site_url }}\">Go to Home Page</a></p>\n{% endblock\
  \ %}\n```\n\n在上述代码片段中，我们做了几件事。首先，对于我们的自定义退出模板，我们将使用与django.contrib.admin模块所提供的相同的母版布局。因此，请考虑以下内容：\n\
  \n```\n{% extends \"admin/base_site.html\" %}\n```\n\n当我们编写此代码时，Django会尝试在django.contrib.admin模块提供的templates目录中查找并加载admin/base_site.html模板。\n\
  \n现在，我们的基础模板已经准备好被扩展，接下来我们要做的就是尝试通过以下代码块来覆盖内容块的HTML：\n\n```\n{% block content %}\n\
  ...\n{% endblock %}\n```\n\n\n\n\n\nadmin:index 和 site_url 的值由 AdminSite 类根据我们定义的设置自动提供。\n\
  \n利用 admin:index 和 site_url 的值，我们将创建 Login Again 超链接（单击后将带用户返回登录表单）和 Go to Home\
  \ Page 链接（单击后将带用户返回网站主页）。文件现在应如下所示：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter10/Exercise10.03/templates/admin/logout.html。\n\
  \n- 3. 现在，自定义模板已定义，下一步是在我们的自定义管理站点上使用该自定义模板。为此，让我们打开 bookr_admin 目录下的 admin.py 文件，并在\
  \ BookrAdmin 类中添加以下字段作为最终值：\n\n```\nlogout_template = 'admin/logout.html'\n```\n\
  \n保存该文件。文件应如下所示：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter10/Exercise10.03/bookr_admin/admin.py。\n\
  \n- 4. 完成上述所有步骤后，让我们通过运行以下命令启动开发服务器：\n\n```\npython manage.py runserver localhost:8000\n\
  ```\n\n然后，我们导航到 http://localhost:8000/admin。\n\n到达那里后，尝试登录，然后点击 Logout。注销后，您将看到呈现以下页面：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_506_0.png)\n\n图 10.6 – 用户点击 Logout 按钮后看到的注销视图\n\
  \n至此，我们已经成功覆盖了第一个模板。类似地，我们还可以覆盖 Django 管理面板中的其他模板，例如索引视图和登录表单的模板。\n\n## 向管理站点添加视图\n\
  \n就像 Django 内部的常规应用可以关联多个视图一样，Django 也允许开发者向管理站点添加自定义视图，从而扩大管理站点界面的功能范围。\n\n向管理站点添加自定义视图的能力为网站的管理面板提供了很大的可扩展性，可用于多种额外用例。例如，正如本章开头所讨论的，大型组织的\
  \ IT 团队可以向管理站点添加一个自定义视图，用于监控组织内各个 IT 系统的运行状况，并让 IT 团队能够快速查看需要处理的紧急警报。\n\n现在，我们需要回答的下一个问题是：如何向管理站点添加自定义视图？\n\
  \n事实证明，在管理模板内部添加一个新视图非常容易，并且与我们为应用创建视图时所用的方法相同，只需要做一些细微的修改。那么，让我们来看看如何向 Django 管理仪表板添加一个自定义视图。\n\
  \n### 创建视图函数\n\n向 Django 应用添加新视图的第一步是创建一个视图函数，该函数实现处理视图的逻辑。在前面的章节中，我们在一个名为 views.py\
  \ 的独立文件中创建视图函数，该文件用于保存我们所有的基于方法和基于类的视图。\n\n在向 Django 管理仪表板添加新视图的上下文中，要创建新视图，我们需要在自定义\
  \ AdminSite 类中定义一个新的视图函数。例如，要添加一个新视图来呈现一个页面，显示组织内不同 IT 系统的运行状况，我们可以在自定义 AdminSite\
  \ 类的实现中创建一个名为 system_health_dashboard() 的新视图函数，如下面的代码片段所示：\n\n```\nclass SysAdminSite(admin.AdminSite):\n\
  \    def system_health_dashboard(self, request):\n        # View function logic\n\
  ```\n\n在视图函数内部，我们可以执行任何需要的操作来生成视图，并最终使用该响应来渲染模板。在这个视图函数中，有一些重要的逻辑需要我们确保正确实现。\n\n\
  第一个是设置视图函数内 request 字段的 current_app 属性。这是必需的，以便模板中的 Django URL 解析器能够正确解析应用的视图函数。要在我们刚刚创建的自定义视图函数中设置此值，我们需要设置\
  \ current_app 属性，如下面的代码片段所示：\n\n```\nrequest.current_app = self.name\n```\n\nself.name\
  \ 字段由 Django 的 AdminSite 类自动填充，我们无需显式初始化。至此，我们最简单的自定义视图实现将如下面的代码片段所示：\n\n```\nclass\
  \ SysAdminSite(admin.AdminSite):\n    def system_health_dashboard(self, request):\n\
  \        request.current_app = self.name\n        # View function logic\n```\n\n\
  ### 访问常用模板变量\n\n在创建自定义视图函数时，我们可能希望访问常用模板变量，例如 site_header 和 site_title，以便在与视图函数关联的模板中正确渲染它们。事实证明，使用\
  \ AdminSite 类提供的 each_context() 方法可以很容易地实现这一点。\n\nAdminSite 类的 each_context() 方法接受一个参数\
  \ request，即当前请求上下文，并返回要插入到所有管理站点模板中的模板变量。\n\n例如，如果我们想在自定义视图函数中访问模板变量，我们可以实现类似于以下代码片段的代码：\n\
  \n```\ndef system_health_dashboard(self, request):\n    request.current_app = self.name\n\
  \    context = self.each_context(request)\n    # view function logic\n```\n\neach_context()\
  \ 方法返回的值是一个字典，包含变量名和关联值。\n\n### 为自定义视图映射 URL\n\n定义视图函数后，下一步涉及将此视图函数映射到 URL，以便用户可以访问它，或允许其他视图链接到它。对于\
  \ AdminSite 内部定义的视图，此 URL 到视图的映射由 AdminSite 类实现的 get_urls() 方法控制。get_urls() 方法返回映射到\
  \ AdminSite 视图的 urlpatterns 列表。\n\n如果我们想为自定义视图添加 URL 映射，首选方法包括在我们自定义的 AdminSite\
  \ 类中覆盖 get_urls() 的实现并在那里添加 URL 映射。此方法在以下代码片段中进行了演示：\n\n```\nclass SysAdminSite(admin.AdminSite):\n\
  \    def get_urls(self):\n        base_urls = super().get_urls()  # Get the existing\n\
  \        # Define our URL patterns for custom views\n        urlpatterns = [\n \
  \           path(\"health_dashboard/\",\n                self.system_health_dashboard)\n\
  \        ]\n        return base_urls + urlpatterns  # Return the updated mapping\n\
  ```\n\nget_urls() 方法通常由 Django 自动调用，我们无需对它进行任何手动处理。\n\n完成此操作后，最后一步涉及确保我们的自定义管理视图只能通过管理站点访问，非管理员用户应该无法访问它。让我们看看如何实现这一点。\n\
  \n### 将自定义视图限制在管理站点内\n\n如果你仔细阅读了前几个小节，那么现在你已有一个可供使用的自定义 AdminSite 视图。然而，有一个小问题：这个视图也可以直接被任何不在管理站点上的用户访问。\n\
  \n为了确保不出现这种情况，我们需要将此视图限制在管理站点内。这可以非常简单地在 admin_view() 调用中包装我们的 URL 路径来实现，如下面的代码片段所示：\n\
  \n```\nurlpatterns = [\n    self.admin_view(path(\"health_dashboard/\",\n      \
  \                  self.system_health_dashboard))\n]\n```\n\nadmin_view 函数确保提供给它的路径仅限于管理仪表板，并且没有管理员权限的用户无法访问它。\n\
  \n现在，让我们向管理站点添加一个新的自定义视图。\n\n\n\n\n\n# 练习 10.04 – 向管理站点添加自定义视图\n\n在本练习中，你将向管理站点添加一个自定义视图，该视图将渲染用户个人资料并向用户展示修改其电子邮件和添加新个人资料图片的选项。要构建此自定义视图，请按照以下步骤操作：\n\
  \n+   1. 打开 bookr_admin 目录下的 admin.py 文件并添加以下导入。这些导入将用于在管理站点应用程序内部构建我们的自定义视图：\n\n\
  ```\nfrom django.template.response import TemplateResponse\nfrom django.urls import\
  \ path\n```\n\n+   2. 打开 bookr_admin 目录下的 admin.py 文件并在 BookrAdmin 类内部创建一个名为 profile_view\
  \ 的新方法，该方法以 request 变量作为其参数：\n\n```\ndef profile_view(self, request):\n```\n\n接下来，在方法内部，获取当前应用程序的名称并将其设置在请求上下文中。为此，你可以使用类的\
  \ name 属性，该属性由 Django 自动填充。要获取此属性并将其设置在你的请求上下文中，你需要添加以下行：\n\n```\nrequest.current_app\
  \ = self.name\n```\n\n一旦将应用程序名称填充到请求上下文中，下一步就是获取模板变量，这些变量是用于在管理模板中渲染内容（如 site_title\
  \ 和 site_header）所必需的。为此，利用 AdminSite 类的 each_context() 方法，该方法从类中提供管理站点模板变量的字典：\n\
  \n```\ncontext = self.each_context(request)\n```\n\n获取数据后，最后一步是返回一个 TemplateResponse\
  \ 对象，当有人访问映射到你的自定义视图的 URL 端点时，该对象将渲染自定义个人资料模板：\n\n```\nreturn TemplateResponse(request,\n\
  \    \"admin/admin_profile.html\", context)\n```\n\n+   3. 在创建了视图函数后，下一步是使 AdminSite\
  \ 返回将视图映射到 AdminSite 内部路径的 URL。为此，你需要创建一个名为 get_urls() 的新方法，该方法覆盖 AdminSite.get_urls()\
  \ 方法并返回你的新视图的映射。这可以通过首先在你为自定义管理站点创建的 BookrAdmin 类内部创建一个名为 get_urls() 的新方法来实现：\n\n\
  ```\ndef get_urls(self):\n```\n\n在此方法内部，你需要做的第一件事是获取已映射到管理端点的 URL 列表。这是一个必需步骤；否则，如果此映射丢失，你的自定义管理站点将无法加载与模型编辑页面、注销页面等相关联的任何结果。要获取此映射，请调用\
  \ BookrAdmin 类派生的基类的 get_urls() 方法：\n\n```\nurls = super().get_urls()\n```\n\n一旦捕获了来自基类的\
  \ URL，下一步就是创建将我们的自定义视图映射到管理站点中 URL 端点的 URL 列表。为此，我们将创建一个名为 url_patterns 的新列表，并将我们的\
  \ profile_view 方法映射到 admin_profile 端点。这是通过使用 Django 的 path 实用函数完成的，该函数允许我们使用基于字符串的\
  \ API 端点路径将视图函数映射起来：\n\n```\nurl_patterns = [\n    path(\"admin_profile\", self.profile_view)\n\
  ]\nreturn url_patterns + urls\n```\n\n保存 admin.py 文件。它应如下所示：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter10/Exercise10.04/bookr_admin/admin.py。\n\
  \n请注意，get_urls() 返回的值是一个不可修改的列表。在前面的代码片段中，如果我们尝试在合并 url_patterns 和 urls 对象之间切换顺序，该方法将无法工作，并且\
  \ admin_profile URL 不会被创建。\n\n4. 现在 BookrAdmin 类已为新视图配置好，下一步是为管理个人资料页面创建模板。为此，在项目根目录的\
  \ templates/admin 目录下创建一个名为 admin_profile.html 的新文件。在此文件内部，首先添加一个 extends 标签以确保你是从默认管理模板扩展的：\n\
  \n```\n{% extends \"admin/index.html\" %}\n```\n\n此步骤可确保你的所有管理模板样式表和 HTML 都可在你的自定义视图模板中使用。例如，如果没有此\
  \ extends 标签，你的自定义视图将不会显示已映射到管理站点的任何特定内容，例如 site_header、site_title 或注销或前往另一页面的链接。\n\
  \n添加 extends 标签后，添加一个 block 标签并为其提供 content 的值。这可确保你在 {% block content %}...{% endblock\
  \ %} 段之间添加的代码会覆盖 Django 管理模块随附的 index.html 模板中已有的任何值：\n\n```\n{% block content %}\n\
  ```\n\n在 block 标签内部，添加在本次练习第 2 步中创建的个人资料视图所需的 HTML：\n\n```\n<p>Welcome to your profile,\
  \ {{ username }}</p>\n<p>You can do the following operations</p>\n<ul>\n    <li><a\
  \ href=\"#\">Change E-Mail Address</a></li>\n    <li><a href=\"#\">Add Profile Picture</a></li>\n\
  </ul>\n{% endblock %}\n```\n\n该文件现在应如下所示：https://github.com//PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter10/Exercise10.04/templates/admin/admin_profile.html。\n\
  \n5. 现在，前面的步骤已完成，通过运行 python manage.py runserver localhost:8000 重新加载你的应用程序服务器，然后访问\
  \ http://localhost:8000/admin/admin_profile。\n\n当页面打开时，你可以期望看到如下截图：\n\n![](img/4840a43efd335abd10b93708225692d6_512_0.png)\n\
  \n图 10.7 – Bookr 管理站点上的个人资料页面视图\n\n注意\n\n到目前为止创建的视图将无论用户是否登录到管理应用程序都能正常渲染。\n\n为了确保此视图仅可供已登录的管理员访问，你需要在\
  \ `get_urls()` 方法内部进行少量修改，该方法在本次练习第 2 步中定义。\n\n在 `get_urls()` 方法内部，将 `url_patterns`\
  \ 列表修改为如下所示：\n\n```\n```python\nurl_patterns = [\n    path(\"admin_profile\",\n\
  \         self.admin_view(self.profile_view)),\n]\n```\n```\n\n在前面的代码中，你将 `profile_view`\
  \ 方法包装在 `admin_view()` 方法内部。\n\n`AdminSite.admin_view()` 方法会导致视图仅限于已登录的用户。如果当前未登录到管理站点的用户尝试直接访问\
  \ URL，他们将被重定向到登录页面，只有在成功登录后才允许他们查看我们自定义页面的内容。\n\n在本练习中，我们利用了我们对为 Django 应用程序编写视图的现有理解，并将其与\
  \ `AdminSite` 类的上下文合并，以为我们的管理仪表板构建自定义视图。有了这一知识，我们现在可以继续并向我们的 Django 管理添加有用的功能，以超充电其有用性。\n\
  \n## 使用模板变量向模板传递额外键\n\n在管理站点内部，传递给模板的变量值是通过使用模板变量完成的。这些模板变量由 `AdminSite.each_context()`\
  \ 方法准备并返回。\n\n现在，如果你想将某个值传递给管理站点的所有模板，你可以覆盖 `AdminSite.each_context()` 方法并将所需字段添加到请求上下文中。让我们看一个示例，了解如何实现这一结果。\n\
  \n考虑我们之前传递给 `admin_profile` 模板的 username 字段。如果我们想将其传递给自定义管理站点内的每个模板，我们首先需要在 BookrAdmin\
  \ 类内部覆盖 `each_context()` 方法，如下所示：\n\n```\n```python\ndef each_context(self, request):\n\
  \    context = super().each_context(request)\n    context['username'] = request.user.username\n\
  \    return context\n```\n```\n\n`each_context()` 方法接受一个单一参数（我们在这里不考虑 `self`），类型为\
  \ `HTTPRequest`，它用于评估某些其他值。\n\n\n\n\n\n现在，在我们重写的 each_context() 方法内部，我们首先调用基类 each_context()\
  \ 方法来检索 admin 站点的上下文字典：\n\n```\n```python\ncontext = super().each_context(request)\n\
  ```\n```\n\n完成之后，下一步要做的是将我们的 username 字段添加到 context 中，并将其值设置为 request.user.username\
  \ 字段的值：\n\n```\n```python\ncontext['username'] = request.user.username\n```\n```\n\
  \n完成此操作后，最后剩下的就是返回这个修改后的上下文。\n\n现在，每当我们的自定义 admin 站点渲染一个模板时，模板将带上这个额外的 username\
  \ 变量。\n\n## Activity 10.01 – building a custom admin dashboard with a built-in search\n\
  \n在本活动中，你将利用关于创建自定义 admin 站点的不同方面的知识，为 Bookr 构建一个自定义 admin 仪表板。在此仪表板中，你将引入允许用户通过使用书籍名称或书籍出版商名称来搜索书籍的功能，并允许用户修改或删除这些书籍记录。\n\
  \n以下步骤将帮助你构建一个自定义 admin 仪表板并添加按出版商名称搜索书籍记录的能力：\n\n- 1. 在 Bookr 项目内部创建一个名为 `bookr_admin`\
  \ 的新应用程序，如果尚未创建的话。这将存储我们自定义 admin 站点的逻辑。\n- 2. 在 `bookr_admin` 目录下的 `admin.py` 文件中，创建一个新的类\
  \ `BookrAdmin`，它继承自 Django admin 模块的 `AdminSite` 类。\n- 3. 在 *步骤 2* 中创建的 `BookrAdmin`\
  \ 类内部，添加站点标题或 admin 仪表板任何其他品牌组件的自定义设置。\n- 4. 在 `bookr_admin` 目录下的 `apps.py` 文件中，创建一个新的\
  \ `BookrAdminConfig` 类，并在这个新的 `BookrAdminConfig` 类内部，将默认站点属性设置为我们自定义 admin 站点类 `BookrAdmin`\
  \ 的完全限定模块名称。\n- 5. 在你的 Django 项目的 `settings.py` 文件中，将 *步骤 4* 中创建的 `BookrAdminConfig`\
  \ 类的完全限定路径作为第一个已安装应用程序添加。\n- 6. 为了在 Bookr 中注册来自 `reviews` 应用程序的 Books 模型，打开 `reviews`\
  \ 目录内的 `admin.py` 文件，并确保 Books 模型已通过使用 `admin.site.register(ModelClass)` 注册到 admin\
  \ 站点。\n- 7. 为了允许用户按出版商名称搜索书籍，在 `reviews` 应用程序的 `admin.py` 文件中，修改 `BookAdmin` 类并向其添加一个名为\
  \ `search_fields` 的属性，其中包含 `publisher_name` 作为字段。\n- 8. 为了正确获取 `search_fields` 属性的出版商名称，在\
  \ `BookAdmin` 类内部引入一个名为 `get_publisher` 的新方法，该方法将从 Book 模型返回出版商的名称字段。\n- 9. 确保 `BookAdmin`\
  \ 类已通过使用 `admin.site.register(Book, BookModel)` 作为 Book 模型的 Model admin 类注册到我们的\
  \ Django admin 仪表板中。\n\n完成此活动后，一旦你启动应用程序服务器并访问 http://localhost:8000/admin 并导航到\
  \ Book 模型，你应该能够使用出版商名称搜索书籍，并在成功搜索的情况下看到一个类似于以下屏幕截图中所示的页面：\n\n![](img/4840a43efd335abd10b93708225692d6_515_0.png)\n\
  \nFigure 10.8 – The book editing page inside the Bookr Administration dashboard\n\
  \n> **Note**\n> The solution for this activity can be found on https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions\n\
  \n## Summary\n\n在本章中，我们研究了 Django 如何允许自定义其 admin 站点，通过为站点中一些更通用的部分提供易于使用的属性，例如标题字段、标题和主页链接。除此之外，我们学习了如何通过利用\
  \ Python 中面向对象编程的概念并创建 AdminSite 的子类来构建自定义 admin 站点。\n\n此功能通过实现注销页面的自定义模板得到了进一步增强。我们还学习了如何通过添加一组新的视图来增强我们的\
  \ admin 仪表板，从而允许增强仪表板的使用。\n\n当我们进入下一章时，我们将能够在我们迄今为止学到的知识之上进行构建，并通过介绍构建我们自己的自定义模板标签和过滤器的概念，以及使用类视图概念以面向对象的方式构建视图的能力来扩展该知识。\n\
  \n# 11\n"
- "# Advanced Templating and Class-Based Views\n\n在第 3 章 URL Mapping, Views, and Templates\
  \ 中，我们学习了如何在 Django 中构建视图并创建模板。然后，我们学习了如何使用这些视图来渲染我们构建的模板。在本章中，我们将在使用类视图的基础上发展我们开发视图的知识，允许我们将逻辑方法分组到一个单一实体中。当开发一个映射到同一应用程序编程接口\
  \ API 端点的多个 HTTP 请求方法的视图时，此技能非常有用。使用基于方法的视图，我们可能最终会使用大量 if-else 条件来成功处理不同类型的 HTTP\
  \ 请求方法。相比之下，类视图允许我们为我们想要处理的每个 HTTP 请求方法定义单独的方法。然后，根据收到的请求类型，Django 会负责调用类视图中的正确方法。\n\
  \n除了能够基于不同的开发技术构建视图之外，Django 还配备了强大的模板引擎。该引擎允许开发人员为其 Web 应用程序构建可重用的模板。这种模板引擎的可重用性通过使用模板标签和过滤器进一步增强，这些标签和过滤器有助于在模板内部轻松实现常用功能，例如迭代数据列表、以给定样式格式化数据、从变量中提取一段文本以显示，以及覆盖模板中特定块的内容。所有这些功能也扩展了\
  \ Django 模板的可重用性。\n\n在本章中，我们将研究如何通过利用 Django 定义我们自己的自定义模板标签和过滤器的能力来扩展 Django 提供的默认模板过滤器和模板标签集。然后，这些自定义模板标签和过滤器可以以可重用的方式在我们的\
  \ Web 应用程序中使用来实现一些常见功能。例如，在构建可在 Web 应用程序内部多个位置显示的用户配置文件徽章时，最好利用编写自定义模板包含标签的能力，该标签只需在我们希望的任何视图中插入徽章的模板，而不是重写整个徽章模板的代码或向模板引入额外的复杂性。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- Template filters\n- Custom template filters\n- String filters\n\
  - Template tags\n- Django views\n\n# Technical requirements\n\n本章的完整代码文件可以在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter11\
  \ 找到\n\n## Template filters\n\n在开发模板时，开发人员通常只想在将其渲染给用户之前更改模板变量的值。例如，假设我们正在为 Bookr\
  \ 用户构建一个个人资料页面。在那里，我们想显示用户已阅读的书籍数量。在其下方，我们还想显示他们已阅读的书籍列表表。\n\n为了实现这一点，我们可以从视图向 HTML\
  \ 模板传递两个单独的变量。一个可以命名为 `books_read`，表示用户阅读的书籍数量。另一个可以是 `book_list`，包含用户阅读的书籍名称列表，例如：\n\
  \n```\n```html\n<span class=\"books_read\">You have read {{ books_read }}\n    books</span>\n\
  <ul>\n    {% for book in book_list %}\n        <li>{{ book }}</li>\n    {% endfor\
  \ %}\n</ul>\n```\n```\n\nDjango 中的 **Template filters** 是简单的基于 Python 的函数，它们接受一个变量作为参数（以及变量上下文中的任何额外数据），根据我们的要求更改其值，然后渲染更改后的值。\n\
  \n现在，通过使用 Django 中的模板过滤器，可以通过以下方式获得与编写前一段代码相同的结果，而无需使用两个单独的变量：\n\n```\n```html\n\
  <span class=\"books_read\">You have read\n    {{ book_list|length }}</span>\n<ul>\n\
  \    {% for book in book_list %}\n```\n\n\n\n\n\n```\n<li>{{ book }}</li>\n{% endfor\
  \ %}\n</ul>\n```\n\n这里，我们使用了 Django 提供的内置 length 过滤器。使用该过滤器会导致对 `book_list` 变量的长度进行求值并返回结果，然后在渲染期间将其插入到我们的\
  \ HTML 模板中。\n\n与 length 类似，还有很多其他模板过滤器随 Django 一起预打包并且可供使用。例如，lowercase 过滤器会将文本转换为全小写格式，last\
  \ 过滤器可用于返回列表中的最后一项，而 json_script 过滤器可用于将传递给模板的 Python 对象作为 JSON 值输出，并在模板中用 `<script>`\
  \ 标签包裹。\n\n> **重要说明**\n> 你可以参考 Django 的官方文档以获取 Django 提供的完整模板过滤器列表，网址为 https://docs.djangoproject.com/en/3.1/ref/templates/builtins/。\n\
  \n现在，在了解了如何使用模板过滤器之后，让我们深入了解如何编写自己的自定义过滤器。\n\n## 自定义模板过滤器\n\nDjango 提供了许多有用的过滤器，我们在项目开发过程中可以在模板中使用它们。但如果有人想格式化特定文本并使用不同的字体进行渲染呢？或者说，有人想根据后端中错误代码的映射将错误代码翻译成对用户友好的错误信息。在这些情况下，预定义的过滤器是不够的，我们希望编写一个可以在项目中重复使用的自定义过滤器。\n\
  \n幸运的是，Django 提供了易于使用的 API，我们可以用它来编写自定义过滤器。该 API 为开发人员提供了一些有用的装饰器函数，可用于快速将 Python\
  \ 函数注册为自定义模板过滤器。一旦 Python 函数被注册为自定义过滤器，开发人员就可以开始在模板中使用该函数。\n\n需要一个模板库方法的实例来访问过滤器。该实例可以通过从\
  \ Django 的模板模块实例化 `Library()` 类来创建，如下所示：\n\n```\nfrom django import template\nregister\
  \ = template.Library()\n```\n\n实例创建后，我们现在可以使用模板库实例中的 filter 装饰器来注册我们的过滤器。\n\n##\
  \ 创建自定义模板过滤器\n\n创建自定义模板过滤器需要执行几个步骤。让我们尝试了解这些步骤是什么，以及它们如何帮助我们创建自定义模板过滤器，下一个小节将对此进行说明。\n\
  \n### 设置用于存储模板过滤器的目录\n\n需要注意的是，在创建自定义模板过滤器或模板标签时，我们需要将它们放在应用程序目录下的 `templatetags`\
  \ 目录中。之所以有此要求，是因为 Django 在内部配置为在加载 Web 应用程序时查找自定义模板标签和过滤器。如果目录名称不是 `templatetags`，Django\
  \ 将不会加载我们创建的自定义模板过滤器和标签。\n\n要创建此目录，首先导航到你想要创建自定义模板过滤器的应用程序文件夹，然后在终端中运行以下命令：\n\n\
  ```\nmkdir templatetags\n```\n\n目录创建后，下一步是在 `templatetags` 目录内创建一个新文件来存储自定义过滤器的代码。这可以通过在\
  \ `templatetags` 目录内执行以下命令来完成：\n\n```\ntouch custom_filter.py\n```\n\n> **重要说明**\n\
  > 上述命令在 Windows 上不起作用。你可以通过 Windows 资源管理器导航到所需目录并创建新文件。\n\n或者，可以通过 PyCharm 提供的 GUI\
  \ 界面完成此操作。\n\n### 设置模板库\n\n一旦用于存储自定义过滤器代码的文件创建完成，我们就可以开始着手实现自定义过滤器代码了。为了使自定义过滤器在\
  \ Django 中工作，它们需要在模板中使用之前先注册到 Django 的模板库。为此，第一步是设置模板库的一个实例，该实例将用于注册我们的自定义过滤器。为此，在上一节中创建的\
  \ `custom_filters.py` 文件内，我们首先需要从 Django 项目导入模板模块：\n\n```\nfrom django import template\n\
  ```\n\n导入解决后，下一步是创建模板库的实例，添加以下代码行：\n\n```python\nregister = template.Library()\n\
  ```\n\nDjango 模板模块中的 `Library` 类被实现为一个 **singleton** 类，它返回在应用程序启动时仅初始化一次的相同对象。\n\
  \n模板库实例设置完成后，我们可以继续实现自定义过滤器。\n\n### 实现自定义过滤器函数\n\nDjango 中的自定义过滤器不过是简单的 Python 函数，本质上接受以下参数：\n\
  \n- 应用过滤器的值（必需）\n- 需要传递给过滤器的任何附加参数（零个或多个）（可选）\n\n这些函数需要用 Django 模板库实例中的 `filter`\
  \ 属性进行装饰，才能作为模板过滤器发挥作用。例如，自定义过滤器的通用实现如下所示：\n\n```python\n@register.filter\ndef my_filter(value,\
  \ arg):\n    # Implementation logic of the filter\n```\n\n至此，我们已经了解了如何实现可在模板中使用的自定义过滤器。在下一节中，我们将学习如何使用这些自定义过滤器。\n\
  \n### 在模板中使用自定义过滤器\n\n过滤器创建后，使用它在模板中非常简单。为此，过滤器必须首先导入到模板中。这可以通过在模板文件顶部添加以下行轻松完成：\n\
  \n```django\n{% load custom_filter %}\n```\n\n当 Django 的模板引擎解析模板文件时，前一行会自动由 Django\
  \ 解析，以找到 `templatetags` 目录下指定的正确模块。因此，`custom_filter` 模块中提到的所有过滤器都会自动在模板中可用。\n\n\
  在模板中使用我们的自定义过滤器与添加以下行一样简单：\n\n```django\n{{ some_value|generic_filter:\"arg\" }}\n\
  ```\n\n掌握了这些知识后，让我们现在创建我们的第一个自定义过滤器。\n\n## 练习 11.01 – 创建自定义模板过滤器\n\n在本练习中，我们将编写一个名为\
  \ `explode` 的自定义过滤器，当提供一个字符串和用户提供的分隔符时，它会返回一个字符串列表。例如，考虑以下字符串：\n\n```text\nnames\
  \ = \"john,doe,mark,swain\"\n```\n\n你将对该字符串应用以下过滤器：\n\n```django\n{{ names|explode:\"\
  ,\" }}\n```\n\n应用此过滤器后的输出应如下所示：\n\n```text\n[\"john\", \"doe\", \"mark\", \"swain\"\
  ]\n```\n\n让我们开始执行以下步骤：\n\n- 1. 在 `bookr` 项目内创建一个新的应用程序，可用于演示目的：\n  \n      ```bash\n\
  \      python manage.py startapp filter_demo\n      ```\n  \n      上述命令将在你的 Django\
  \ 项目中设置一个新的应用程序。\n  \n- 2. 现在，在你的 `filter_demo` 应用程序目录内创建一个名为 `templatetags` 的新目录，以存储自定义模板过滤器的代码。要创建目录，请从终端应用程序或命令提示符中的\
  \ `filter_demo` 目录内运行以下命令：\n  \n      ```bash\n      mkdir templatetags\n      ```\n\
  \  \n- 3. 目录创建后，在 `templatetags` 目录内创建一个名为 `explode_filter.py` 的新文件。\n  \n- 4. 打开文件并添加以下行：\n\
  \  \n      ```python\n      from django import template\n\n      register = template.Library()\n\
  \      ```\n  \n      上述代码创建了一个 Django 库的实例，可用于将我们的自定义过滤器与 Django 注册。\n\n\n\n\n\n\
  5. 添加以下代码来实现 explode 过滤器：\n\n```\n@register.filter\ndef explode(value, separator):\n\
  \    return value.split(separator)\n```\n\nexplode 过滤器接收两个参数；一个是使用该过滤器的 value，另一个是\
  \ separator，从模板传递给过滤器。过滤器将使用此分隔符将字符串转换为列表。\n\n6. 自定义过滤器准备好后，创建一个可在此过滤器上应用的模板。为此，首先在\
  \ filter_demo 目录下创建一个名为 templates 的新文件夹，然后在其中创建一个名为 index.html 的新文件，其内容如下：\n\n```\n\
  <html>\n<head>\n<title>Custom Filter Example</title>\n<body>\n{% load explode_filter\
  \ %}\n\n{{ names|explode:\",\" }}\n</body>\n</html>\n```\n\n在第一行，Django 的模板引擎从 explode_filter\
  \ 模块加载自定义过滤器，以便在模板内部使用。为此，Django 将在 templatetags 目录下查找 explode_filter 模块，如果找到，则会加载它以供使用。\n\
  \n在下一行，你将传递给模板的 names 变量传递过去并对其应用 explode 过滤器，同时将 , 符号作为分隔符值传递给过滤器。\n\n7. 现在模板已创建，接下来要创建的是一[content]\n\
  \n5. 添加以下代码来实现 explode 过滤器：\n\n```\n@register.filter\ndef explode(value, separator):\n\
  \    return value.split(separator)\n```\n\nexplode 过滤器接收两个参数；一个是使用该过滤器的 value，另一个是\
  \ separator，从模板传递给过滤器。过滤器将使用此分隔符将字符串转换为列表。\n\n6. 自定义过滤器准备好后，创建一个可在此过滤器上应用的模板。为此，首先在\
  \ filter_demo 目录下创建一个名为 templates 的新文件夹，然后在其中创建一个名为 index.html 的新文件，其内容如下：\n\n```\n\
  <html>\n<head>\n<title>Custom Filter Example</title>\n<body>\n{% load explode_filter\
  \ %}\n\n{{ names|explode:\",\" }}\n</body>\n</html>\n```\n\n在第一行，Django 的模板引擎从 explode_filter\
  \ 模块加载自定义过滤器，以便在模板内部使用。为此，Django 将在 templatetags 目录下查找 explode_filter 模块，如果找到，则会加载它以供使用。\n\
  \n在下一行，你将传递给模板的 names 变量传递过去并对其应用 explode 过滤器，同时将 , 符号作为分隔符值传递给过滤器。\n\n7. 现在模板已创建，接下来要创建的是一个可以渲染此模板并将\
  \ name 变量传递给模板的 Django 视图。为此，打开 views.py 文件并添加以下高亮代码：\n\n```\nfrom django.shortcuts\
  \ import render\n\ndef index(request):\n    names = \"john,doe,mark,swain\"\n  \
  \  return render(request, \"index.html\", {'names':\n        names})\n```\n\n前面的代码片段执行了一些基本操作。它首先从\
  \ django.shortcuts 模块导入 render 辅助函数，该函数有助于渲染模板。导入完成后，它定义了一个名为 index() 的新视图函数，该函数渲染\
  \ index.html。\n\n8. 现在将视图映射到 URL，以便随后可以在浏览器中渲染结果。为此，在 filter_demo 目录内创建一个名为 urls.py\
  \ 的新文件并添加以下代码：\n\n```\nfrom django.urls import path\n\nfrom . import views\n\nurlpatterns\
  \ = [\n    path('', views.index, name='index')\n]\n```\n\n9. 将 filter_demo 应用程序添加到项目\
  \ URL 映射中。为此，打开 bookr 项目目录中的 urls.py 并在 urlpatterns 内部添加以下高亮行：\n\n```\nurlpatterns\
  \ = [\n    path('filter_demo/', include('filter_demo.urls')),\n    ...\n]\n```\n\
  \n进行更改后，bookr 项目目录下的 urls.py 文件应类似于 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter11/Exercise11.01/bookr/urls.py\
  \ 下所示的文件。\n\n10. 最后，在 bookr 项目的 settings.py 的 INSTALLED_APPS 部分下添加该应用程序：\n\n```\n\
  INSTALLED_APPS = [\n    ...,\n    'filter_demo'\n]\n```\n\n此要求源于 Django 实施的安全指南，该指南要求实现自定义过滤器/标签的应用程序需要添加到\
  \ INSTALLED_APPS 部分。进行更改后，settings.py 文件应类似于 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter11/Exercise11.01/bookr/settings.py\
  \ 下的文件。\n\n11. 要查看自定义过滤器是否有效，运行以下命令：\n\n```\npython manage.py runserver localhost:8000\n\
  ```\n\n现在，导航到浏览器中的以下页面：http://localhost:8000/filter_demo。\n\n12. 此页面应如图 11.1 所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_525_0.png)\n\n图 11.1 – 使用 explode 过滤器显示的索引页面\n\
  \n至此，我们看到了如何在 Django 中快速创建一个自定义过滤器，然后在模板中使用它。在下一节中，让我们看一下另一种类型的过滤器，即字符串过滤器，它仅对字符串类型的值起作用。\n\
  \n## 字符串过滤器\n\n在练习 11.01 创建自定义模板过滤器 中，我们构建了一个自定义过滤器，它允许我们使用分隔符拆分提供的字符串并从中生成列表。此过滤器可以接受任何类型的变量并根据提供的分隔符将其拆分为值列表。但如果我们希望限制过滤器仅对字符串有效，而不对其他类型的值，例如整数有效，该怎么办？\n\
  \n我们可以使用 Django 模板库提供的 stringfilter 装饰器来开发仅对字符串起作用的过滤器。当使用 stringfilter 装饰器将 Python\
  \ 方法注册为 Django 中的过滤器时，框架会确保在过滤器执行之前将传递给过滤器的值转换为字符串。这减少了当非字符串值传递给我们的过滤器时可能出现的问题。\n\
  \n实现 **字符串过滤器** 的步骤与我们为构建自定义过滤器所遵循的步骤类似，只是有些细微的改动。\n\n还记得我们在 *设置存储模板过滤器的目录* 部分中创建的\
  \ `custom_filter.py` 文件吗？让我们现在在其中添加一个新的 Python 函数，它将充当我们的字符串过滤器。\n\n在我们实现字符串过滤器之前，我们首先需要导入\
  \ `stringfilter` 装饰器，该装饰器将自定义过滤器函数标记为字符串过滤器。你可以通过在 `custom_filters.py` 文件中添加以下导入语句来添加此装饰器：\n\
  \n```\nfrom django.template.defaultfilters import stringfilter\n```\n\n现在，要实现我们的自定义字符串过滤器，可以使用以下语法：\n\
  \n```\n```python\n@register.filter\n@stringfilter\ndef generic_string_filter(value,\
  \ arg):\n    # Logic for string filter implementation\n```\n```\n\n通过这种方法，我们可以构建任意数量的字符串过滤器，并像使用任何其他过滤器一样使用它们。\n\
  \n## 模板标签\n\n模板标签是 Django 模板引擎的一个强大功能。它们允许开发人员通过评估某些条件来生成 HTML，从而构建强大的模板，并避免重复编写常见代码。\n\
  \n一个可能使用模板标签的示例是网站导航栏中的注册/登录选项。在这种情况下，我们可以使用模板标签来评估当前页面上的访问者是否已登录。基于此，我们可以渲染个人资料横幅或注册/登录横幅。\n\
  \n在开发模板时，标签也很常见。例如，考虑以下我们上节在模板中导入自定义过滤器时使用的代码行：\n\n```\n{% load explode_filter %}\n\
  ```\n\n这使用了一个名为 `load` 的模板标签，负责将 `explode` 过滤器加载到模板中。与过滤器相比，模板标签功能更强大。虽然过滤器只能访问其操作的值，但模板标签可以访问整个模板的上下文，因此它们可用于在模板内部构建大量复杂功能。\n\
  \n让我们现在来看一下 Django 支持的不同类型的模板标签以及如何构建我们自己的自定义模板标签。\n\n## 模板标签的类型\n\nDjango 主要支持两种类型的模板标签：\n\
  \n- **简单标签**：这些标签对提供的变量数据（以及传递给它们的任何附加变量）进行操作，并在调用它们的同一模板中渲染。例如，一个这样的用例可以包括根据用户的用户名向用户渲染自定义欢迎消息，或根据用户名显示用户的最后登录时间。\n\
  - **包含标签**：这些标签接收提供的变量数据并通过渲染另一个模板来生成输出。例如，标签可以接收对象列表并对其进行迭代以生成 HTML 列表。\n\n在下一节中，我们将了解如何创建这些不同类型的标签并在我们的应用程序中使用它们。\n\
  \n## 简单标签\n\n简单标签为开发人员提供了一种构建模板标签的方式，该标签接收模板中的一个或多个变量，对其进行处理并返回响应。从模板标签返回的响应会替换\
  \ HTML 模板中提供的模板标签定义。这些类型的标签可用于构建多种有用的功能，例如日期解析或显示我们想要向用户展示的任何活动警报。\n\n简单标签可以使用模板库提供的\
  \ `simple_tag` 装饰器轻松创建，通过装饰应充当模板标签的 Python 方法。现在，让我们看看如何使用 Django 的模板库实现自定义简单标签。\n\
  \n## 创建简单模板标签\n\n创建简单模板标签遵循我们在 *自定义模板过滤器* 部分中讨论的约定，只是有些细微差别。首先，让我们回顾一下如何为在 Django\
  \ 模板中使用创建模板标签。\n\n## 设置目录\n\n就像自定义过滤器一样，自定义模板标签也需要创建在同一个 `templatetags` 目录内，以便 Django\
  \ 的模板引擎可以发现它们。该目录可以使用 PyCharm GUI 直接创建，也可以通过在我们想要创建自定义标签的应用程序目录内运行以下命令来创建：\n\n```\n\
  mkdir templatetags\n```\n\n\n\n完成此操作后，我们现在可以使用以下命令创建一个新文件来存储自定义模板标签的代码：\n\n```\n\
  touch custom_tags.py\n```\n\n> **重要提示**\n> \n> 上述命令在 Windows 上无法使用。 但是，您可以使用 Windows\
  \ 资源管理器创建一个新文件。\n\n## 设置模板库\n\n设置好目录结构并为存储自定义模板标签代码的文件做好准备后，我们现在可以开始创建模板标签。 但在此之前，我们需要像之前一样设置\
  \ Django 模板库的实例。 这可以通过向我们的 custom_tag.py 文件添加以下代码行来完成：\n\n```\nfrom django import\
  \ template\nregister = template.Library()\n```\n\n与自定义过滤器一样，这里使用的模板库实例用于在 Django\
  \ 模板中注册自定义模板标签以供使用。\n\n## 实现一个简单的模板标签\n\nDjango 中的简单模板标签是可以接受我们想要的任意数量参数的 Python\
  \ 函数。 这些 Python 函数需要用模板库中的 simple_tag 装饰器进行装饰，以将这些函数注册为简单模板标签。 以下代码片段展示了简单模板标签是如何实现的：\n\
  \n```\n@register.simple_tag\ndef generic_simple_tag(arg1, arg2):\n    # Logic to\
  \ implement a generic simple tag\n```\n\n接下来，让我们将这些简单标签用于模板中。\n\n## 在模板中使用简单标签\n\
  \n在 Django 模板中使用简单标签非常容易。 在模板文件中，我们首先需要确保标签已在模板中导入，通过将以下内容添加到模板文件的顶部：\n\n```\n{%\
  \ load custom_tag %}\n```\n\n前面的语句将从我们之前定义的 `custom_tag.py` 文件加载所有标签，并使它们在模板中可用。\
  \ 然后我们可以通过添加以下命令来使用我们的自定义简单标签：\n\n```\n```django\n{% custom_simple_tag \"argument1\"\
  \ \"argument2\" %}\n```\n```\n\n不是很容易吗？！ 现在，让我们将这些知识付诸实践并创建我们的第一个自定义简单标签。\n\n##\
  \ 练习 11.02 – 创建一个自定义简单标签\n\n在本练习中，我们将创建一个简单标签，它将接受两个参数：第一个是问候信息，第二个是用户的姓名。 该标签将打印格式化的问候信息。\
  \ 让我们开始步骤：\n\n- 1. 延续 *练习 11.01* 中显示的示例，让我们重用相同的目录结构来存储简单标签的代码。 因此，首先在 `filter_demo`\
  \ 目录下创建一个名为 `simple_tag.py` 的新文件。 在此文件中，添加以下代码：\n\n```\n```python\nfrom django import\
  \ template\n\nregister = template.Library()\n\n@register.simple_tag\ndef greet_user(message,\
  \ username):\n    return \"{greeting_message}, {user}!!!\"\n        .format(greeting_message=message,\
  \ user=username)\n```\n```\n\n在这种情况下，您创建一个新的 Python 方法 `greet_user()`，它接受两个参数，`message`，用于问候的消息，以及\
  \ `username`，应被问候的用户的姓名。 然后该方法用 `@register.simple_tag` 装饰，表示该方法是一个简单标签，可以用作模板中的模板标签。\n\
  \n- 2. 现在，创建一个将使用您的简单标签的新模板。 为此，在 `filter_demo/templates` 目录下创建一个名为 `simple_tag_template.html`\
  \ 的新文件，并向其中添加以下代码：\n\n```\n```html\n<html>\n<head>\n    <title>Simple Tag Template\
  \ Example</title>\n</head>\n<body>\n{% load simple_tag %}\n{% greet_user \"Hey\"\
  \ username %}\n</body>\n</html>\n```\n```\n\n在浏览器中访问 http://localhost:8000/filter_demo/greet\
  \ 后，您应该会看到以下页面：\n\n![](img/4840a43efd335abd10b93708225692d6_531_0.png)\n\n图 11.2\
  \ – 使用自定义简单标签生成的问候信息\n\n通过此操作，我们创建了第一个自定义模板标签，并成功地使用它来渲染模板，如图 11.2 所示。 现在，让我们看看简单标签的另一个重要方面，即将模板中可用的上下文变量传递给模板标签。\n\
  \n## 在自定义模板标签中传递模板上下文\n\n在之前的练习中，我们创建了一个简单标签，我们向其传递了两个参数，问候信息和用户名。 但是如果我们想向标签传递大量变量呢？\
  \ 或者简单地说，如果我们不想显式地将用户的用户名传递给标签怎么办？\n\n有时开发人员希望模板中存在的所有变量和数据都能在自定义标签内部使用。 幸运的是，对我们来说，实现起来很容易。\n\
  \n使用我们之前 `greet_user` 标签的示例，让我们创建一个名为 contextual_greet_user 的新标签，看看我们如何将模板中可用的数据直接传递给标签，而不是手动将其作为参数传递。\n\
  \n我们需要做的第一个修改是将我们的装饰器修改为如下所示：\n\n```\n@register.simple_tag(takes_context=True)\n\
  ```\n\n通过此操作，我们告诉 Django，当使用我们的 contextual_greet_user 标签时，Django 还应将模板上下文传递给它，该上下文包含从视图传递到模板的所有数据。\
  \ 完成此添加后，我们需要做的下一件事是更改我们的 contextual_greet_user 实现以接受作为参数添加的上下文。 以下代码显示了使用模板上下文来渲染问候信息的\
  \ contextual_greet_user 标签的修改形式：\n\n```\n@register.simple_tag(takes_context=True)\n\
  def contextual_greet_user(context, message):\n    username = context['username']\n\
  \    return \"{greeting_message}, {user}\"\n        .format(greeting_message=message,\
  \ user=username)\n```\n\n在前面的代码示例中，我们可以看到 contextual_greet_user() 方法是如何被修改为接受作为第一个参数传递的上下文，然后是用户传递的问候信息。\n\
  \n为了利用此修改后的模板标签，我们需要做的就是将 simple_tag_template.html 下 filter_demo 中对 contextual_greet_user\
  \ 标签的调用更改为如下所示：\n\n```\n{% contextual_greet_user \"Hey\" %}\n```\n\n然后，当我们重新加载 Django\
  \ Web 应用程序时，http://localhost:8000/filter_demo/greet 处的输出应与练习 11.02 – 创建自定义简单标签的步骤\
  \ 5 中显示的内容相同。\n\n通过此操作，我们学习了如何构建简单标签并处理将模板上下文传递给标签。 现在，让我们看看如何构建一个包含标签，该标签可用于以另一个模板描述的格式呈现数据。\n\
  \n## 包含标签\n\n简单标签允许我们构建接受一个或多个输入变量、对它们进行一些处理并返回输出的标签。 然后此输出将插入简单标签使用的位置。\n\n但是如果我们想构建标签，而不是返回文本输出，而是返回\
  \ HTML 模板，该模板可用于呈现页面的各个部分怎么办？ 例如，许多 Web 应用程序允许用户向其个人资料添加自定义小部件。 这些单独的小部件可以构建为包含标签并独立呈现。\
  \ 这种方法使基本页面模板和单独模板的代码保持分离，从而便于重用和重构。\n\n开发自定义包含标签的过程与开发简单标签的过程类似。 这涉及使用模板库提供的 inclusion_tag\
  \ 装饰器。 因此，让我们看看我们是如何做到的。\n\n## 练习 11.03 – 构建自定义包含标签\n\n在本练习中，我们将构建一个自定义包含标签，它将呈现用户阅读的书籍列表：\n\
  \n- 1. 对于本练习，您将继续使用与早期练习中相同的演示文件夹。 首先，在 filter_demo/templates 目录下创建一个名为 inclusion_tag.py\
  \ 的新文件，并在其中写入以下代码：\n\n```\nfrom django import template\n\nregister = template.Library()\n\
  \n@register.inclusion_tag('book_list.html')\ndef book_list(books):\n    book_list\
  \ = [book_name for book_name, book_author\n                 in books.items()]\n\
  \    return {'book_list': book_list}\n```\n\n@register.inclusion_tag 装饰器用于将方法标记为自定义包含标签。\
  \ 此装饰器采用应用于呈现标签函数返回的数据的模板的名称作为参数。\n\n在装饰器之后，我们定义了一个函数来实现自定义包含标签的逻辑。 此函数接受一个名为 books\
  \ 的单个参数。 此参数将从模板文件传递，并包含读者阅读的书籍列表（以 Python 字典的形式）。 在定义中，我们将字典转换为 Python 书名列表。 字典中的键映射到书名，值映射到作者：\n\
  \n```\nbooks_list = [book_name for book_name, book_author in books.items()]\n```\n\
  \n形成列表后，以下代码将列表作为上下文返回给传递给包含标签的模板（在本例中为 book_list.html）：\n\n```\nreturn {'book_list':\
  \ books_list}\n```\n\n此方法返回的值将由 Django 传递给 book_list.html 模板，然后内容将被呈现。\n\n- 2. 接下来，创建实际的模板，该模板将包含模板标签的呈现结构。\
  \ 为此，在 filter_demo/templates 目录下创建一个新的模板文件 book_list.html，并向其中添加以下内容：\n\n```\n<ul>\n\
  \    {% for book in book_list %}\n    <li>{{ book }}</li>\n    {% endfor %}\n</ul>\n\
  ```\n\n\n\n\n\n在这里，在新的模板文件中，我们创建了一个无序列表，用于存放用户已读的书籍列表。接下来，使用 for 模板标签，我们遍历由自定义模板函数提供的\
  \ book_list 中的值：\n\n```\n{% for book in book_list %}\n```\n\n此迭代会根据以下内容创建多个列表项：\n\
  \n```\n<li>{{ book }}</li>\n```\n\n列表项会使用来自 book_list 的内容生成并传递给模板。for 标签执行的次数与 book_list\
  \ 中存在的项目数量相同。\n\n3. 在为 book_list 标签定义了模板后，修改现有的问候模板以使其在模板内部可用，并使用它来显示用户已读的书籍列表。为此，修改\
  \ filter_demo/templates 目录下的 simple_tag_template.html 文件，并将代码更改如下：\n\n```\n<html>\n\
  <head>\n<title>Simple Tag Template Example</title>\n</head>\n<body>\n{% load simple_tag\
  \ inclusion_tag %}\n{% greet_user \"Hey\" username %}\n<br />\n<span class=\"message\"\
  >You have read the following\nbooks till date</span>\n{% book_list books %}\n</body>\n\
  </html>\n```\n\n在此片段中，你做的第一件事是通过编写以下内容加载 inclusion_tag 模块：\n\n```\n{% load simple_tag\
  \ inclusion_tag %}\n```\n\n加载标签后，你现在可以在模板中的任何位置使用它。为此，你以以下格式添加了 book_list 标签：\n\n\
  ```\n{% book_list books %}\n```\n\n此标签接受一个参数，即书籍的字典，其中键为书名，键的值为该书的作者。\n\n4. 在模板修改完成后，最后一步涉及将所需数据传递给模板。为此，修改\
  \ filter_demo 目录中的 views.py 并将 greeting 视图函数更改如下：\n\n```\ndef greeting_view(request):\n\
  \    books = {\n\"The night rider\": \"Ben Author\",\n\"The Justice\": \"Don Abeman\"\
  \n}\nreturn render(request, 'simple_tag_template.html',\n{'username': 'jdoe', 'books':\
  \ books})\n```\n\n在这里，我们修改了 greeting_view 函数以添加书籍及其作者的字典，然后将其传递给 simple_tag_template\
  \ 上下文。\n\n完成更改后，文件应类似于托管在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter11/Exercise11.03\
  \ 的文件。\n\n5. 在实施了上述更改后，现在是时候渲染修改后的模板了。为此，通过运行以下命令重新启动 Django 应用程序服务器：\n\n```\npython\
  \ manage.py runserver localhost:8080\n```\n\n6. 导航到 http://localhost:8080/greet，它现在应渲染一个类似于以下屏幕截图的页面：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_536_0.png)\n\n图 11.3 – 用户访问问候端点时已读书籍列表\n\
  \n该页面显示了用户访问问候端点时已读的书籍列表。你在页面上看到的列表是使用 inclusion 标签渲染的。用于列出这些书籍的模板是先单独创建的，然后使用 inclusion\
  \ 标签将其添加到页面中。\n\n至此，我们现在拥有了可以构建高度复杂的模板过滤器或自定义标签的基础，这些标签在我们想要从事的项目开发中会很有帮助。\n\n##\
  \ 现在，让我们来看看 Django 视图，并深入到 Django 提供的基于类的视图这一新领域，以帮助我们利用面向对象编程的力量，从而实现视图渲染的代码重用。\n\
  \n# Django views\n\n回顾一下，Django 中的视图是一段 Python 代码，它允许接收请求，基于请求执行操作，然后向用户返回响应，从而构成了我们\
  \ Django 应用程序的重要组成部分。\n\n在 Django 内部，我们有两种不同的构建视图的方法，其中一种我们在前面的示例中已经看到过，称为基于函数的视图，而另一种我们即将介绍的称为基于类的视图：\n\
  \n- **基于函数的视图 (FBVs)**：Django 中的 FBVs 只不过是普通的 Python 函数，它们应该以 `HTTPRequest` 类型对象作为第一个位置参数，并返回对应于视图在请求被处理后想要执行的操作的\
  \ `HTTPResponse` 类型对象。在前面的练习中，`index()` 和 `greeting_view()` 就是 FBVs 的示例。\n- **基于类的视图\
  \ (CBVs)**：CBVs 是严格遵循 Python 面向对象原则的视图，允许将视图调用映射为基于类的表示。这些视图具有专门的性质，给定类型的 CBV 执行特定操作。CBV\
  \ 提供的优势包括视图易于扩展和代码重用，这在 FBVs 中可能是一项复杂的任务。\n\n现在，基本定义已经明确，并且我们已经掌握了 FBVs 的知识，让我们来看看\
  \ CBVs，看看它们为我们准备了什么。\n\n# Class-based views\n\nDjango 提供了开发人员为其应用程序编写视图的不同方式。一种方式是将\
  \ Python 函数映射为视图函数以创建 FBVs。创建视图的另一种方式是使用 Python 对象实例（基于 Python 类）。这些被称为 CBVs。出现的一个重要问题是，当我们已经可以使用\
  \ FBV 方法创建视图时，为什么还需要 CBV？\n\n在创建 FBVs 时，想法是，有时我们可能会一遍又一遍地复制相同的逻辑，例如处理某些字段或处理某些请求类型的逻辑。虽然完全可以创建在逻辑上分离的函数来处理特定逻辑，但随着应用程序复杂性的增加，管理任务变得困难。\n\
  \n这就是 CBVs 派上用场的地方，因为它们抽象掉了我们需要编写的常见重复代码的实现，以处理某些任务，例如模板的渲染，同时还通过使用继承和混入使代码片段易于重用。例如，以下代码片段显示了\
  \ CBV 的实现：\n\n```\n```python\nfrom django.http import HttpResponse\nfrom django.views\
  \ import View\n\nclass IndexView(View):\n\n    def get(self, request):\n       \
  \ return HttpResponse(\"Hey there!\")\n```\n```\n\n在前面的示例中，我们通过继承 Django 提供的内置视图类构建了一个简单的\
  \ CBV。\n\n使用这些 CBVs 也非常容易。例如，假设我们想将 `IndexView` 映射到应用程序中的 URL 端点。在这种情况下，我们只需在应用程序的\
  \ `urls.py` 文件中的 `urlpatterns` 列表中添加以下行即可：\n\n```\n```python\nurlpatterns = [\n\
  \    path('my_path', IndexView.as_view(), name='index_view')\n]\n```\n```\n\n在这里，正如我们所观察到的，我们使用了我们创建的\
  \ CBV 的 `as_view()` 方法。每个 CBV 都实现了 `as_view()` 方法，该方法允许视图类通过从视图类返回视图控制器的实例来映射到 URL\
  \ 端点。\n\nDjango 提供了一些内置的 CBV，它们提供了大量常见任务的实现，例如如何渲染模板或如何处理特定请求。内置的 CBV 有助于避免在处理基本功能时从头开始重写代码，从而实现代码的重用。其中一些内置视图包括以下内容：\n\
  \n- **View**：这是 Django 中所有 CBV 的基类，允许使用所有提供的功能编写自定义 CBV，并且可以覆盖。用户可以为不同的 HTTP 请求方法实现自己的定义，例如\
  \ GET、POST、PUT 和 DELETE，并且视图将根据收到的请求类型自动将调用委托给负责处理请求的方法。\n- **TemplateView**：这是一个可用于根据调用\
  \ URL 中提供的模板数据参数渲染模板的视图。这使开发人员能够轻松渲染模板，而无需编写与渲染处理相关的任何逻辑。\n- **RedirectView**：这是一个视图，可以根据用户发出的请求自动将用户重定向到正确的资源。\n\
  \n\n\n\n\n`DetailView`：这是一个映射到 Django 模型的视图，可用于使用所选模板渲染从模型获取的数据。\n\n前面的视图只是 Django\
  \ 默认提供的内置视图中的一些，我们将在本章的后续内容中介绍更多视图。\n\n现在，为了更好地理解 CBV 在 Django 内部的工作原理，让我们尝试构建我们的第一个\
  \ CBV。\n\n## 练习 11.04 – 使用 CBV 创建图书目录\n\n在本练习中，我们将创建一个基于类的表单视图，该视图将帮助构建图书目录。此目录将包含图书名称和图书作者的名称：\n\
  \n- 1. 首先，在我们的 `book` 项目中创建一个新的应用程序并将其命名为 `book_management`。这可以通过简单地运行以下命令来完成：\n\
  \n```bash\npython manage.py startapp book_management\n```\n\n- 2. 现在，在构建图书目录之前，您首先需要定义一个\
  \ Django 模型来帮助您将记录存储在数据库中。为此，打开刚刚创建的 `book_management` 应用下的 `models.py` 文件并定义一个名为\
  \ Book 的新模型，如下所示：\n\n```python\nfrom django.db import models\n\nclass Book(models.Model):\n\
  \    name = models.CharField(max_length=255)\n    author = models.CharField(max_length=50)\n\
  ```\n\n该模型包含两个字段，图书名称和作者名称。\n\n- 3. 在模型就位后，将模型迁移到数据库，以便您可以开始在数据库中存储数据。\n\n- 4. 一旦完成上述所有步骤，将您的\
  \ `book_management` 应用程序添加到 `INSTALLED_APPS` 列表中，以便 Django 可以发现它并且您可以正确使用您的模型。为此，打开\
  \ `book` 目录下的 `settings.py` 文件并在 `INSTALLED_APPS` 部分的最后位置添加以下代码：\n\n```python\n\
  INSTALLED_APPS = [\n    ...,\n    'book_management'\n]\n```\n\n- 5. 更改完成后，`settings.py`\
  \ 文件应如下所示：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter11/Exercise11.04/book/settings.py。\n\
  \n- 6. 通过运行以下两个命令将您的模型迁移到数据库。这些命令将首先创建 Django 迁移文件，然后在数据库中创建表：\n\n```python\npython\
  \ manage.py makemigrations\npython manage.py migrate\n```\n\n- 7. 现在，数据库模型已就位，让我们创建一个新表单，我们将使用它来捕获有关图书的信息，例如图书标题、作者和\
  \ ISBN。为此，在 `book_management` 目录下创建一个名为 `forms.py` 的新文件并在其中添加以下代码：\n\n```python\n\
  from django import forms\n\nfrom .models import Book\nclass BookForm(forms.ModelForm):\n\
  \    class Meta:\n        model = Book\n        fields = ['name', 'author']\n```\n\
  \n在前面的代码片段中，我们首先导入了 Django 的 `forms` 模块，这将使我们能够轻松创建表单并提供表单的渲染功能。下一行导入将存储表单数据的模型：\n\
  \n```python\nfrom django import forms\nfrom .models import Book\n```\n\n在下一行，我们创建了一个名为\
  \ BookForm 的新类，它继承自 ModelForm。这只是一个将模型字段映射到表单的类。为了成功实现模型和表单之间的映射，我们在 BookForm 类下定义了一个名为\
  \ Meta 的新子类，并将属性 model 设置为指向 Book 模型，并将属性 fields 设置为您希望在表单中显示的字段列表：\n\n```python\n\
  class Meta:\n    model = Book\n    fields = ['name', 'author']\n```\n\n这允许 ModelForm\
  \ 在需要时渲染正确的 HTML 表单。ModelForm 类提供了一个内置的 `Form.save()` 方法，当使用时，它会将表单中的数据写入数据库并有助于避免编写冗余代码。\n\
  \n- 8. 现在您已经准备好模型和表单，请继续实现一个视图来渲染表单并接受用户的输入。为此，打开 `book_management` 目录下的 `views.py`\
  \ 并向文件中添加以下代码行：\n\n```python\nfrom django.http import HttpResponse\nfrom django.views.generic.edit\
  \ import FormView\nfrom django.views import View\n```\n\n```python\nfrom .forms\
  \ import BookForm\n\nclass BookRecordFormView(FormView):\n    template_name = 'book_form.html'\n\
  \    form_class = BookForm\n    success_url = '/book_management/entry_success'\n\
  \n    def form_valid(self, form):\n        form.save()\n        return super(BookRecordFormView).form_valid(form)\n\
  \nclass FormSuccessView(View):\n    def get(self, request, *args, **kwargs):\n \
  \       return HttpResponse(\"Book record saved successfully\")\n```\n\n在前面的代码片段中，我们创建了两个主要视图，BookRecordFormView，它负责渲染图书目录条目表单，以及\
  \ FormSuccessView，如果表单数据成功保存，您将使用它来渲染成功消息。让我们现在分别查看这两个视图并了解我们正在做什么。\n\n首先，我们创建了一个名为\
  \ BookRecordFormView CBV 的新视图，它继承自 FormView：\n\n```\nclass BookRecordFormView(FormView)\n\
  ```\n\nFormView 类允许我们轻松创建处理表单的视图。对于此类，我们需要提供某些参数，例如它将渲染以显示表单的模板名称、它应用于渲染表单的表单类以及表单成功处理时重定向到的成功\
  \ URL：\n\n```\ntemplate_name = 'book_form.html'\nform_class = BookForm\nsuccess_url\
  \ = '/book_management/entry_success'\n```\n\nFormView 类还提供了一个 form_valid() 方法，当表单成功完成验证时调用。在\
  \ form_valid() 方法内部，我们可以决定想要做什么。对于我们的用例，当表单验证成功完成时，我们首先调用 form.save() 方法，该方法将表单的数据持久化到数据库中，然后调用基类\
  \ form_valid() 方法，这将导致表单视图在表单验证成功的情况下重定向到成功的 URL：\n\n```\ndef form_valid(self, form):\n\
  \    form.save()\n    return super().form_valid(form)\n```\n\n10. CBV 构建完成后，请继续将它们映射到\
  \ URL，以便您可以开始使用它们添加新的图书记录。为此，在 book_management 目录下创建一个名为 urls.py 的新文件并添加以下代码：\n\n\
  ```python\nfrom django.urls import path\n\nfrom .views import BookRecordFormView,\
  \ FormSuccessView\n\nurlpatterns = [\n    path('new_book_record',\n         BookRecordFormView.as_view(),\n\
  \         name='book_record_form'),\n    path('entry_success', FormSuccessView.as_view(),\n\
  \         name='form_success')\n]\n```\n\n前面代码片段的大部分内容与您之前编写的内容相似，但在将 CBV 映射到 URL\
  \ 模式的方式上有一个不同之处。使用 CBV 时，我们不是直接添加函数名称，而是使用类名及其 as_view 方法，该方法将类对象映射到视图。例如，要将 BookRecordFormView\
  \ 映射为视图，我们将使用 BookRecordFormView.as_view()。\n\n11. 将 URL 添加到我们的 urls.py 文件后，下一步是将我们的应用程序\
  \ URL 映射添加到我们的 bookr 项目。为此，打开 bookr 应用程序下的 urls.py 文件并将以下行添加到 urlpatterns：\n\n```python\n\
  urlpatterns = [\n    path('book_management/',\n         include('book_management.urls')),\n\
  \    ...\n]\n```\n\n12. 现在，通过运行以下命令启动开发服务器：\n\n```\npython manage.py runserver localhost:8080\n\
  ```\n\n13. 然后，访问 `http://localhost:8080/book_management/new_book_record`。\n\n如果一切正常，您将看到如下所示的页面：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_544_0.png)\n\n图 11.4 – 用于向数据库添加新图书的视图\n\
  \n单击 **Save record** 后，您的记录将被写入数据库，并会出现以下页面：\n\n![](img/4840a43efd335abd10b93708225692d6_544_1.png)\n\
  \n图 11.5 – 记录成功插入时渲染的模板\n\n至此，我们创建了自己的 CBV，它允许我们保存新图书的记录。带着我们对 CBV 的了解，让我们现在看看如何借助\
  \ CBV 执行 **创建、读取、更新和删除（CRUD）** 操作。\n\n\n\n\n# 使用CBVs进行CRUD操作\n\n在处理Django模型时，最常见的模式之一涉及对数据库中存储的对象进行创建、读取、更新和删除操作。Django管理界面使我们可以轻松完成这些CRUD操作，但如果想构建自定义视图来获得同样的能力呢？\n\
  \n事实证明，Django的基于类的视图（CBVs）让我们可以非常轻松地实现这一点。我们要做的就是编写自定义的CBV，并继承Django提供的内置基类。基于我们已有的书籍记录管理示例，来看看如何在Django中构建基于CRUD的视图。\n\
  \n## 创建视图\n\n要构建一个帮助创建对象的视图，我们需要打开`book_management`目录下的`view.py`文件，并向其中添加以下代码行：\n\
  \n```\nfrom django.views.generic.edit import CreateView\nfrom .models import Book\n\
  \nclass BookCreateView(CreateView):\n    model = Book\n    fields = ['name', 'author']\n\
  \    template_name = 'book_form.html'\n    success_url = '/book_management/entry_success'\n\
  ```\n\n这样，我们就为book资源创建了`CreateView`。在可以使用它之前，需要将其映射到URL。为此，我们可以打开`urls.py`文件，并在`urlpatterns`列表下添加以下条目：\n\
  \n```\nurlpatterns = [\n    ...,\n    path('book_record_create', BookCreateView.as_view(),\n\
  \        name='book_create')\n]\n```\n\n现在，当我们访问`http://localhost:8080/book_management/book_record_create`时，会看到以下页面：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_546_0.png)\n\n图11.6——基于创建视图插入新书记录的视图\n\
  \n这看起来与我们使用表单视图时得到的页面类似。填写数据并点击保存记录后，Django会将数据保存到数据库中。\n\n## 读取视图\n\n在这个视图中，我们希望看到数据库为书籍存储的记录列表。为了实现这一点，我们将构建一个名为`DetailView`的视图，它用于渲染所请求书籍的详细信息。要构建这个视图，可以在`book_management`目录下的`views.py`文件中添加以下代码行：\n\
  \n```\nfrom django.views.generic import DetailView\n\nclass BookRecordDetailView(DetailView):\n\
  \    model = Book\n    template_name = 'book_detail.html'\n```\n\n在上面的代码片段中，我们创建了`DetailView`，它可以帮助我们渲染与所请求书籍ID相关的详细信息。`DetailView`内部使用我们提供的书籍ID查询数据库模型，如果找到记录，则将记录中的数据作为对象变量传入模板上下文，并渲染模板。\n\
  \n完成后，下一步是为书籍详细信息创建模板。为此，我们需要在`book_management`应用内的`templates`目录下创建一个名为`book_detail.html`的新模板文件，内容如下：\n\
  \n```\n<html>\n<head>\n<title>Book List</title>\n</head>\n<body>\n  <span>Book Name:\
  \ {{ object.name }}</span><br />\n  <span>Author: {{ object.author }}</span>\n</body>\n\
  </html>\n```\n\n现在，模板已经创建好了，最后一步是为`DetailView`添加URL映射。可以在`book_management`应用的`urls.py`文件下的`urlpatterns`列表末尾追加以下内容：\n\
  \n```\npath('book_record_detail/<int:pk>',\n     BookRecordDetailView.as_view(),\
  \ name='book_detail')\n```\n\n现在，所有这些都配置完成后，如果我们打开`http://localhost:8080/book_management/book_record_detail/2`，就能看到书籍的详细信息，如下所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_547_0.png)\n\n图11.7——当我们尝试访问之前存储的书籍记录时渲染的视图\n\
  \n通过前面的示例，我们刚刚为`Book`模型启用了CRUD操作，并且全程使用了CBVs。\n\n## 更新视图\n\n在这个视图中，我们要更新给定记录的数据。为此，需要打开`book_management`目录下的`view.py`文件，并向其中添加以下代码行：\n\
  \n```\nfrom django.views.generic.edit import UpdateView\n\nfrom .models import Book\n\
  \nclass BookUpdateView(UpdateView):\n    model = Book\n```\n\n```\nfields = ['name',\
  \ 'author']\ntemplate_name = 'book_form.html'\nsuccess_url = '/book_management/entry_success'\n\
  ```\n\n在上面的代码片段中，我们使用了内置的`UpdateView`模板类，它允许我们更新已存储的记录。因此，这里的`fields`属性应包含我们允许用户更新的字段名称。\n\
  \n视图创建完成后，下一步是添加URL映射。为此，打开`book_management`目录下的`urls.py`文件，并添加以下代码行：\n\n```\nurlpatterns\
  \ = [\n    path('book_record_update/<int:pk>',\n        BookUpdateView.as_view(),\
  \ name='book_update')\n]\n```\n\n在这个示例中，我们在URL字段中追加了`<int:pk>`。这表示我们需要检索记录所需的字段输入。在Django模型中，Django会插入一个整数类型的主键，用于唯一标识记录。在URL映射中，这就是我们要求插入的字段。\n\
  \n现在，当我们尝试打开`http://localhost:8080/book_management/book_record_update/1`时，它应该会显示我们插入到数据库中的第一条记录，并允许我们对其进行编辑：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_548_0.png)\n\n图11.8——基于更新视图显示书籍记录更新模板的视图\n\
  \n## 删除视图\n\n顾名思义，删除视图是从数据库中删除记录的视图。要为我们的`Book`模型实现这样一个视图，我们需要打开`book_management`目录下的`views.py`文件，并向其中添加以下代码片段：\n\
  \n```\nfrom django.views.generic.edit import DeleteView\nfrom .models import Book\n\
  ```\n\n```\nclass BookDeleteView(DeleteView):\n    model = Book\n    template_name\
  \ = 'book_delete_form.html'\n    success_url = '/book_management/delete_success'\n\
  ```\n\n这样，我们就为书籍记录创建了一个删除视图。如我们所见，这个视图使用了不同的模板，我们只需要向用户确认他们是否真的想要删除该记录。为了实现这一点，可以创建一个新的模板文件`book_delete_form.html`，并向其中添加以下代码：\n\
  \n```\n<html>\n<head>\n    <title>Delete Book Record</title>\n</head>\n<body>\n\
  \    <p>Delete Book Record</p>\n    <form method=\"POST\">\n        {% csrf_token\
  \ %}\n        Do you want to delete the book record?\n        <input type=\"submit\"\
  \ value=\"Delete record\" />\n    </form>\n</body>\n</html>\n```\n\n> **重要说明**\n\
  > \n> 与`/delete_success`端点相关的代码，请参阅本书随附GitHub仓库中第11章目录下的代码文件。\n\n然后，我们可以通过修改`book_management`目录下`urls.py`文件中的`urlpatterns`列表来为删除视图添加映射，如下所示：\n\
  \n```\nurlpatterns = [\n    ...,\n    path('book_record_delete/<int:pk>',\n    \
  \     BookDeleteView.as_view(), name='book_delete')\n]\n```\n\n现在，当访问`http://localhost:8080/book_management/book_record_delete/1`时，我们应该会看到以下页面：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_550_0.png)\n\n图11.9——基于删除视图类的“删除书籍记录”视图\n\
  \n点击**删除记录**按钮后，记录将从数据库中删除，并渲染**删除成功**页面。\n\n凭借我们对CRUD视图以及模板过滤器和标签的了解，让我们尝试将其应用于解决一个实现活动。\n\
  \n## 活动11.01——使用包含标签在用户个人资料页面上渲染详细信息\n\n在此活动中，你将创建一个自定义包含标签，用于开发一个用户个人资料页面，该页面不仅渲染用户详细信息，还列出他们读过的书籍。\n\
  \n以下步骤应能帮助你成功完成此活动：\n\n- 1. 在`bookr`项目内的`reviews`应用下创建一个新的`templatetags`目录，为创建自定义模板标签提供位置。\n\
  - 2. 创建一个名为`profile_tags.py`的新文件，用于存储包含标签的代码。\n- 3. 在`profile_tags.py`文件中，导入Django的模板库，并使用它初始化模板库类的一个实例。\n\
  - 4. 从`reviews`应用导入`Review`模型，以获取用户撰写的评论。这将用于筛选当前用户的评论，以便在用户个人资料页面上渲染。\n- 5. 接下来，创建一个名为`book_list`的新Python函数，其中包含包含标签的逻辑。此函数应只接受一个参数：当前登录用户的用户名。\n\
  \n\n\n\n\n- 6. 在 `book_list` 函数体内，添加获取该用户评论并提取该用户已读书籍名称的逻辑。假设用户已阅读了所有他们发表过评论的书籍。\n\
  \n- 7. 使用 `inclusion_tag` 装饰器装饰这个 `book_list` 函数，并为其提供模板名称 `book_list.html`。\n\n\
  - 8. 创建一个名为 `book_list.html` 的新模板文件，该文件在第 7 步中已指定给 inclusion tag 装饰器。在此文件内部，添加代码以渲染书籍列表。这可以通过使用\
  \ `for` 循环结构，并为提供的列表中的每个项目渲染 HTML 列表标签来实现。\n\n- 9. 修改模板目录下现有的 `profile.html` 文件，该文件将用于渲染用户个人资料。在此模板文件内部，包含自定义模板标签，并使用它来渲染用户已读的书籍列表。\n\
  \n完成所有这些步骤后，启动应用服务器并访问用户个人资料页面，应该会渲染出一个与 *图 11.10* 中所示页面相似的页面：\n\n![](img/4840a43efd335abd10b93708225692d6_551_0.png)\n\
  \n图 11.10 – 显示用户已读书籍列表的用户个人资料页面\n\n> **重要说明**\n> \n> 本活动的解决方案可在 `https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions`\
  \ 找到。\n\n## 总结\n\n在本章中，我们学习了 Django 中的高级模板概念，并了解了如何创建自定义模板标签和过滤器，以适应各种用例并支持组件在应用程序中的可重用性。然后，我们研究了\
  \ Django 如何为我们提供实现 FBV 和 CBV 的灵活性，以渲染我们的响应。\n\n在探索 CBV 时，我们学习了它们如何帮助我们避免代码重复，并利用内置的\
  \ CBV 来渲染保存数据的表单、帮助我们更新现有记录，以及在我们的数据库资源上实现 CRUD 操作。\n\n当我们进入下一章时，我们将利用所学的 CBV 知识来实现\
  \ Django 中的 REST API。这将使我们能够在 Bookr 应用程序中对数据执行定义良好的 HTTP 操作，而无需在应用程序内维护任何状态。\n"
- "## 12 构建 REST API\n\n在上一章中，我们学习了模板和基于类的视图。这些概念极大地帮助我们扩展了可以在前端（用户的网络浏览器中）向用户提供的功能范围。然而，这还不足以构建一个现代网络应用程序。Web\
  \ 应用通常使用完全独立的库（如 ReactJS 或 AngularJS）构建前端。这些库提供了构建动态用户界面的强大工具，但不会直接与我们的 Django 后端代码或数据库通信。前端代码只是在网络浏览器中运行，无法直接访问后端服务器上的任何数据。因此，我们需要创建一种方式，使这些应用程序能够“对话”我们的后端代码。在\
  \ Django 中，实现这一目标的最佳方法之一是使用 REST API。\n\n**API** 用于促进不同软件之间的交互，它们通过**超文本传输协议（HTTP）**进行通信。这是服务器和客户端之间通信的标准协议，也是信息在网络上传送的基础。API\
  \ 以 HTTP 格式接收请求并发送响应。\n\n本章介绍 **REST API** 和 **Django REST framework（DRF）**。您将首先为\
  \ Bookr 项目实现一个简单的 API。接下来，您将学习模型实例的序列化，这是向 Django 应用程序前端传递数据的关键步骤。最后，您将探索不同类型的 API\
  \ 视图，包括函数式视图和基于类的视图。\n\n在本章的使用场景中，API 将帮助我们促进 Django 后端与前端 JS 代码之间的交互。例如，假设我们要创建一个允许用户向\
  \ Bookr 数据库添加新书的前端应用程序。用户的网络浏览器会向我们的 API 发送一条消息（HTTP 请求），表示他们要为新书创建一个条目，并可能在该消息中包含一些书籍详细信息。我们的服务器会发送回一个响应，报告书籍是否成功添加。然后，网络浏览器便能够向用户显示其操作的结果。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 理解 REST API\n- Django REST framework\n\n到本章结束时，您将能够实现自定义\
  \ API 端点，包括基于令牌的身份验证。\n\n### 技术要求\n\n本章的所有代码文件可在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter12\
  \ 找到。\n\n### 理解 REST API\n\n大多数现代 Web API 都可以归类为 **REST** API。REST API 只是一种专注于在数据库服务器和前端客户端之间通信和同步对象*状态*的\
  \ API 类型。\n\n例如，假设您正在一个已登录账户的网站上更新您的详细信息。当您进入账户详细信息页面时，网络服务器会告诉您的浏览器与您账户相关的各种详细信息。当您更改该页面上的值时，浏览器会将更新后的详细信息发送回网络服务器，并告诉它在数据库中更新这些详细信息。如果操作成功，网站将向您显示一条确认消息。\n\
  \n这是所谓的前后端系统之间**解耦**架构的一个非常简单示例。解耦提供了更大的灵活性，并使更新或更改架构中的组件更加容易。所以，假设您想创建一个新的前端网站。在这种情况下，只要您的新前端构建为发出与旧前端相同的\
  \ API 请求，您根本不需要更改后端代码。\n\nREST API 是*无状态的*，这意味着客户端和服务器都不会存储任何状态来进行通信。每次发出请求时，数据都会被处理，并发送回响应，而协议无需存储任何中间数据。这意味着\
  \ API 是隔离地处理每个请求的。它不需要存储有关会话本身的信息。这与有状态协议（如**传输控制协议（TCP）**）形成对比，后者在其生命周期内维护有关会话的信息。\n\
  \n因此，**RESTful Web 服务**，顾名思义，是用于执行一组任务的 REST API 集合。例如，如果我们为 Bookr 应用程序开发一组 REST\
  \ API 来执行某一组任务，我们可以称之为 RESTful Web 服务。接下来，我们将开始使用 DRF。\n\n### Django REST framework\n\
  \nDRF 是一个开源的 Python 库，可用于为 Django 项目开发 REST API。DRF 内置了大多数必要的功能，可帮助为任何 Django 项目开发\
  \ API。在本章中，我们将使用它为 Bookr 项目开发 API。在下一节中，我们将安装和配置 DRF。\n\n### 安装与配置\n\n要在与 PyCharm\
  \ 一起设置的虚拟环境中安装 djangorestframework，请按照以下步骤操作：\n\n- 1. 在您的终端应用程序或命令提示符中输入以下代码：\n\n\
  ```\npip install djangorestframework\n```\n\n- 2. 接下来，打开 settings.py 文件，并将 rest_framework\
  \ 添加到 INSTALLED_APPS，如以下代码片段所示：\n\n```\nINSTALLED_APPS = [\n    \"bookr_admin.apps.BookrAdminConfig\"\
  ,\n    \"django.contrib.auth\",\n    \"django.contrib.contenttypes\",\n    \"django.contrib.sessions\"\
  ,\n    \"django.contrib.messages\",\n    \"django.contrib.staticfiles\",\n    \"\
  rest_framework\",\n    \"reviews\", ]\n```\n\n您现在可以开始使用 DRF 创建您的第一个简单 API 了。\n\n\
  ### 函数式 API 视图\n\n在第 3 章“URL 映射、视图和模板”中，我们学习了简单的函数式视图，它们接收一个请求并返回一个响应。我们可以使用 DRF\
  \ 编写类似的函数式视图。但是，请注意，基于类的视图更常用，接下来将介绍。函数式视图只需将以下装饰器添加到普通视图上即可创建，如下所示：\n\n```\nfrom\
  \ rest_framework.decorators import api_view\n\n@api_view\ndef my_view(request):\n\
  \    ...\n```\n\n该装饰器将函数式视图转换为 APIView DRF 的子类。这是将现有视图作为 API 一部分包含进来的快速方法。在下一节中，我们将利用目前学到的知识，使用\
  \ DRF 创建一个简单的 REST API。\n\n\n\n\n\n+   4. 使用 `python manage.py runserver` 命令启动 Django\
  \ 服务，并访问 `http://127.0.0.1:8000/api/first_api_view/` 发出你的第一次 API 请求。你的屏幕应如图 12.1\
  \ 所示：\n\n![](img/4840a43efd335abd10b93708225692d6_557_0.png)\n\n图 12.1 – 带有书籍数量的第一个\
  \ API 视图\n\n调用此 URL 端点对 API 端点发出了默认的 GET 请求，该请求返回了一个 JSON 键值对 (`\"num_books\": 0`)。此外，请注意\
  \ DRF 如何提供一个漂亮的界面来查看和与 API 交互。\n\n+   5. 我们也可以使用 Linux `curl`（客户端 URL）命令发送 HTTP\
  \ 请求，如下所示：\n\n```\n```bash\ncurl http://127.0.0.1:8000/api/first_api_view/\n{\"\
  num_books\":18}\n```\n```\n\n或者，如果你使用的是 Windows 10，你也可以从命令提示符使用 `curl.exe` 发出等效的\
  \ HTTP 请求，如下所示：\n\n```\n```bash\ncurl.exe http://127.0.0.1:8000/api/first_api_view/\n\
  ```\n```\n\n在本练习中，我们学习了如何使用 DRF 和一个简单的函数视图创建 API 视图。现在我们将看看使用序列化器在数据库中存储的信息与 API\
  \ 返回的内容之间进行转换的更优雅的方法。\n\n```\n```python\nclass BookSerializer(serializers.Serializer):\n\
  \    title = serializers.CharField()\n    publication_date = serializers.DateField()\n\
  \    isbn = serializers.CharField()\n    publisher = PublisherSerializer()\n```\n\
  ```\n\n这里，第一行从 rest_framework 模块导入了序列化器。\n\n在导入之后，我们定义了两个类，PublisherSerializer 和\
  \ BookSerializer。顾名思义，它们分别是 Publisher 和 Book 模型的序列化器。这两个序列化器都是 serializers.Serializer\
  \ 的子类，我们为每个序列化器定义了字段类型，例如 CharField、URLField、EmailField 等。\n\n查看 bookr/reviews/models.py\
  \ 文件中的 Publisher 模型。Publisher 模型具有 name、website 和 email 属性。因此，要序列化 Publisher 对象，我们需要在序列化器类中使用\
  \ name、website 和 email 属性，我们已在 PublisherSerializer 中相应地定义了它们。\n\n同样，对于 Book 模型，我们在\
  \ BookSerializer 中将 title、publication_date、isbn 和 publisher 定义为期望的属性。由于 publisher\
  \ 是 Book 模型的外键，我们使用了 PublisherSerializer 作为 publisher 属性的序列化器。\n\n+   3. 打开 `bookr/reviews/api_views.py`，删除任何预先存在的代码，并添加以下代码：\n\
  \n```\n```python\nfrom rest_framework.decorators import api_view\nfrom rest_framework.response\
  \ import Response\n\nfrom .models import Book\nfrom .serializers import BookSerializer\n\
  \n\n@api_view()\ndef all_books(request):\n    books = Book.objects.all()\n    book_serializer\
  \ = BookSerializer(books, many=True)\n    return Response(book_serializer.data)\n\
  ```\n```\n\n在第二行，我们从 serializers 模块导入了新创建的 BookSerializer。\n\n然后我们添加一个函数视图 all_books（与之前的练习一样）。该视图接收包含所有书籍的查询集，然后使用\
  \ BookSerializer 对其进行序列化。序列化器类还接收一个参数 many=True，这表明 books 对象是查询集或多个对象的列表。请记住，序列化会将\
  \ Python 对象转换为 JSON 可序列化格式，如下所示：\n\n```\n[OrderedDict([('title', 'Advanced Deep\
  \ Learning with Keras'), ('publication_date', '2018-10-31'), ('isbn', '9781788629416'),\
  \ ('publisher', OrderedDict([('name', 'Packt Publishing'), ('website', 'https://www.packtpub.com/'),\
  \ ('email', 'info@packtpub.com')]))]), OrderedDict([('title', 'Hands-On Machine\
  \ Learning for Algorithmic Trading'), ('publication_date', '2018-12-31'), ('isbn',\
  \ '9781789346411'), ('publisher', OrderedDict([('name', 'Packt Publishing'), ('website',\
  \ 'https://www.packtpub.com/'), ('email', 'info@packtpub.com')]))]) ...\n```\n\n\
  4. 打开 bookr/reviews/urls.py，删除 first_api_view 的先前示例路径，并添加 all_books 路径，如以下代码所示：\n\
  \n```\nfrom django.urls import path\nfrom . import views, api_views\n\nurlpatterns\
  \ = [\n    path(\n        'api/all_books/',\n        api_views.all_books, name='all_books'\n\
  \    ),\n    ...\n]\n```\n\n当 URL 中遇到 api/all_books/ 路径时，此新添加的路径会调用 all_books 视图函数。\n\
  \n与常规视图一样，DRF 提供了一组通用视图，使得编写基于类的视图变得更加简单。通用视图是针对创建 API 时所需的一些最常见操作而设计的。DRF 提供的一些通用视图有\
  \ ListAPIView、RetrieveAPIView 等。在练习 12.02《创建 API 视图以显示书籍列表》中，我们的函数视图负责创建对象的查询集然后调用序列化器。等效地，我们可以使用\
  \ ListAPIView 来完成同样的事情：\n\n```\nclass AllBooks(ListAPIView):\n    queryset = Book.objects.all()\n\
  \    serializer_class = BookSerializer\n```\n\n这里，对象的查询集被定义为类属性。将查询集传递给序列化器由 ListAPIView\
  \ 上的方法处理。\n\n## 模型序列化器\n\n在练习 12.02《创建 API 视图以显示书籍列表》中，我们的序列化器定义如下：\n\n```\nclass\
  \ BookSerializer(serializers.Serializer):\n    title = serializers.CharField()\n\
  \    publication_date = serializers.DateField()\n    isbn = serializers.CharField()\n\
  \    publisher = PublisherSerializer()\n```\n\n然而，我们的 Book 模型看起来像这样（注意模型和序列化器的定义有多相似）：\n\
  \n```\nclass Book(models.Model):\n    \"\"\"A published book.\"\"\"\n\n    title\
  \ = models.CharField(max_length=70,\n        help_text=\"The title of the book.\"\
  )\n    publication_date = models.DateField(\n        verbose_name=\"Date the book\
  \ was published.\")\n    isbn = models.CharField(max_length=20,\n        verbose_name=\"\
  ISBN number of the book.\")\n    publisher = models.ForeignKey(Publisher, on_delete=models.CASCADE)\n\
  \    contributors = models.ManyToManyField(\"Contributor\",\n        through=\"\
  BookContributor\")\n```\n\n我们更希望不指定 title 必须是 serializers.CharField()。如果序列化器只需查看\
  \ title 在模型中的定义并能推断出要使用的序列化器字段类型，那就更容易了。\n\n这就是模型序列化器的用武之地。它们通过利用模型上字段的定义来提供创建序列化器的快捷方式。不是指定\
  \ title 应该使用 CharField 进行序列化，我们只需告诉模型序列化器我们想要包含 title，它就会使用 CharField 序列化器，因为模型上的\
  \ title 字段也是 CharField。\n\n例如，假设我们想要为 models.py 中的 Contributor 模型创建一个序列化器。不是为每个字段指定应使用哪些序列化器类型，我们可以给它一个字段名称列表，让它推断其余部分：\n\
  \n```\nfrom rest_framework import serializers\n\nfrom .models import Contributor\n\
  \nclass ContributorSerializer(serializers.ModelSerializer):\n    class Meta:\n \
  \       model = Contributor\n        fields = ['first_names', 'last_names', 'email']\n\
  ```\n\n在下面的练习中，我们将看到如何使用模型序列化器来避免前述类中的代码重复。\n\n## 练习 12.03 – 创建基于类的 API 视图和模型序列化器\n\
  \n在本练习中，你将创建基于类的视图来显示所有书籍的列表，同时使用模型序列化器：\n\n+   1. 打开 bookr/reviews/serializers.py\
  \ 文件，删除任何预先存在的代码，并用以下代码替换它：\n\n```\nfrom rest_framework import serializers\nfrom\
  \ .models import Book, Publisher\n\nclass PublisherSerializer(\n    serializers.ModelSerializer):\n\
  \    class Meta:\n```\n\n```\nmodel = Publisher\nfields = ['name', 'website', 'email']\n\
  \nclass BookSerializer(serializers.ModelSerializer):\n    publisher = PublisherSerializer()\n\
  \n    class Meta:\n        model = Book\n        fields = ['title', 'publication_date',\
  \ 'isbn',\n            'publisher']\n```\n\n这里，我们包含了两个模型序列化器类，PublisherSerializer\
  \ 和 BookSerializer。这两个类都继承自 serializers.ModelSerializer 父类。我们不需要指定每个字段如何被序列化；相反，我们可以简单地传递一个字段名称列表，字段类型将从\
  \ models.py 中的定义中推断出来。\n\n虽然在 fields 中提及字段对于模型序列化器来说已经足够，但在某些特殊情况下，例如这种情况，我们可能需要自定义字段，因为\
  \ publisher 字段是外键。因此，我们必须使用 PublisherSerializer 来序列化 publisher 字段。\n\n2. 接下来，打开\
  \ bookr/reviews/api_views.py，删除任何预先存在的代码，并添加以下代码：\n\n```\nfrom rest_framework import\
  \ generics\n\nfrom .models import Book\nfrom .serializers import BookSerializer\n\
  \nclass AllBooks(generics.ListAPIView):\n    queryset = Book.objects.all()\n   \
  \ serializer_class = BookSerializer\n```\n\n这里，我们使用 DRF 基于类的 ListAPIView 而不是函数视图。这意味着书籍列表被定义为类属性，我们不必编写一个直接处理请求并调用序列化器的函数。来自上一步的书籍序列化器也被导入并分配为该类的属性。\n\
  \n打开 bookr/reviews/urls.py 文件并修改 /api/all_books API 路径以包含新的基于类的视图，如下所示：\n\n```\n\
  urlpatterns = [\n    path(\n        'api/all_books/',\n        api_views.AllBooks.as_view(),\n\
  \        name='all_books'\n    ),\n```\n\n\n\n\n\n由于我们使用的是基于类的视图，因此必须使用类名以及 as_view()\
  \ 方法。\n\n+   3. 完成上述所有修改后，等待 Django 服务重启或使用 python manage.py runserver 命令启动服务器，然后在浏览器中打开\
  \ API 地址 http://127.0.0.1:8000/api/all_books/。你应该会看到类似图 12.3 的内容：\n\n![](img/4840a43efd335abd10b93708225692d6_565_0.png)\n\
  \n图 12.3：all_books 端点中显示的图书列表\n\n与我们在练习 12.02《创建 API 视图以显示图书列表》中看到的情况类似，这是一个图书评论应用中所有图书的列表。在本练习中，我们使用模型序列化器简化了代码，并使用通用的基于类的\
  \ ListAPIView 返回数据库中图书的列表。在下一节中，你将实现一个 API 端点来返回顶级贡献者的列表。\n\n## 活动 12.01 – 为顶级贡献者页面创建\
  \ API 端点\n\n假设你的团队决定创建一个网页来展示数据库中的顶级贡献者（作者、合著者和编辑）。他们决定聘请外部开发人员使用 ReactJS 创建一个应用。为了与\
  \ Django 后端集成，开发人员需要一个提供以下内容的端点：\n\n+   - 数据库中所有贡献者的列表\n+   - 对于每个贡献者，他们所贡献的所有图书的列表\n\
  +   - 对于每个贡献者，他们所贡献的图书数量\n+   - 对于他们所贡献的每本书，他们在该书中的角色\n\n最终的 API 视图应如下所示：\n\n![](img/4840a43efd335abd10b93708225692d6_566_0.png)\n\
  \n图 12.4：顶级贡献者端点\n\n要执行此任务，请执行以下步骤：\n\n+   1. 向 `Contributor` 类添加一个方法，返回所做的贡献数量。\n\
  +   2. 添加 `ContributionSerializer`，序列化 `BookContribution` 模型。\n+   3. 添加 `ContributorSerializer`，序列化\
  \ `Contributor` 模型。\n+   4. 添加 `ContributorView`，使用 `ContributorSerializer`。\n+\
  \   5. 在 `urls.py` 中添加一个模式以启用对 `ContributorView` 的访问。\n\n> **注意**\n> \n> 本活动的解决方案可在\
  \ https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions\
  \ 上找到。\n\n## 使用 ViewSets 简化代码\n\n我们已经看到如何使用基于类的通用视图优化代码并使其更简洁。**ViewSets** 和 **routers**\
  \ 帮助我们进一步简化代码。正如名称所示，ViewSets 是一组表示在单个类中的视图。例如，我们使用 `AllBooks` 视图返回应用中所有图书的列表，并使用\
  \ `BookDetail` 视图返回单本图书的详细信息。使用 ViewSets，我们可以将这两个类合并为一个类。\n\nDRF 还提供了一个名为 `ModelViewSet`\
  \ 的类。该类不仅结合了前面讨论中提到的两个视图（列表和详情），而且还允许你创建、更新和删除模型实例。实现所有这些功能所需的代码可能就像指定序列化器和查询集一样简单。例如，允许你管理用户模型的所有这些操作的视图可以简洁地定义如下：\n\
  \n```\nclass UserViewSet(viewsets.ModelViewSet):\n    serializer_class = UserSerializer\n\
  \    queryset = User\n```\n\n最后，DRF 提供了一个 `ReadOnlyModelViewSet` 类。这是前面 `ModelViewSet`\
  \ 的简化版本。它是相同的，只是它只允许你列出和检索特定用户。你无法创建、更新或删除记录。在下一节中，我们将学习有关路由器的内容。\n\n## 使用路由器和 Viewsets\
  \ 进行 URL 配置\n\n路由器与 viewset 一起使用时，会自动为 viewset 创建所需的 URL 端点。这是因为单个 viewset 在不同的\
  \ URL 下访问。例如，在前面的 UserViewSet 中，你将在 /api/users/ URL 访问用户列表，并在 /api/users/123 URL\
  \ 访问特定用户记录，其中 123 是该用户记录的主键。以下是如何在之前定义的 UserViewSet 的上下文中使用路由器的简单示例：\n\n```\nfrom\
  \ rest_framework import routers\nrouter = routers.SimpleRouter()\nrouter.register(r'users',\
  \ UserViewSet)\nurlpatterns = router.urls\n```\n\n现在，让我们尝试在一个简单的练习中结合路由器和 ViewSets\
  \ 的概念。\n\n## 练习 12.04 – 使用 ViewSets 和路由器\n\n在本练习中，我们将组合现有视图以创建 viewset 并为 viewset\
  \ 创建所需的路由：\n\n+   1. 打开 bookr/reviews/serializers.py 文件，删除预先存在的代码，并添加以下代码片段：\n\n\
  ```\nfrom django.contrib.auth.models import User\nfrom django.utils import timezone\n\
  from rest_framework import serializers\nfrom rest_framework.exceptions import\n\
  \    NotAuthenticated, PermissionDenied\nfrom .models import Book, Publisher, Review\n\
  from .utils import average_rating\nclass PublisherSerializer(\n    serializers.ModelSerializer):\n\
  ```\n\n你可以在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/blob/main/Chapter12/Exercise12.04/bookr/reviews/serializers.py\
  \ 找到完整的代码片段。\n\n这里，我们向 BookSerializer 添加了两个新字段，即 reviews 和 rating。这些字段有趣的地方在于其背后的逻辑是在序列化器本身上定义为方法。这就是为什么我们使用\
  \ serializers.SerializerMethodField 类型来设置序列化器类属性的原因。\n\n+   2. 打开 `bookr/reviews/api_views.py`\
  \ 文件，删除预先存在的代码，并添加以下内容：\n\n```\n```python\nfrom rest_framework import viewsets\n\
  from rest_framework.pagination import (\n    LimitOffsetPagination)\n\nfrom .models\
  \ import Book, Review\nfrom .serializers import (BookSerializer,\n    ReviewSerializer)\n\
  \nclass BookViewSet(viewsets.ReadOnlyModelViewSet):\n    queryset = Book.objects.all()\
  \ serializer_class\n    = BookSerializer\n\nclass ReviewViewSet(viewsets.ModelViewSet):\n\
