  ```\n\n- 4. 现在，我们需要移动所有现有设置，使它们成为 Dev 类的属性而不是全局变量。在 PyCharm 中，这只需选择所有设置然后按 Tab 键缩进即可。执行此操作后，你的设置应如下所示：\n\
  \n```\nfrom pathlib import Path\nfrom configurations import Configuration, values\n\
