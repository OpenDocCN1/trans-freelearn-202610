  \n- - Comment8or admin 站点将被称为 c8admin。这将出现在站点头部和索引标题中。\n- - 对于标题头部，它将显示 c8 site\
  \ admin。\n- - 默认的 Django admin 注销消息是 `Thanks for spending some quality time with\
  \ the Web site today.` 在 Comment8or 中，它将显示 `Bye from c8admin.` \n\n完成此活动的步骤如下：\n\
