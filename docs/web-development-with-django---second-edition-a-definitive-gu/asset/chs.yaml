  \ `doFetch` 方法。你可以复制并粘贴以下代码来创建它：\n\n```\ndoFetch() {\n    if (this.state.fetchInProgress)\n\
  \        return;\n\n    this.setState({ fetchInProgress: true })\n\n    fetch(this.state.url,\
  \ {\n        method: 'GET',\n        headers: {\n            Accept: 'application/json'\n\
  \        }\n    })\n    .then((response) => {\n        return response.json();\n\
  ```\n\n\n\n}).then((data) => {\n    this.setState({ fetchInProgress: false,\n  \
  \                  books: data })\n})\n}\n\n首先，使用 if 语句检查是否已经开始 fetch。如果是，则从函数中返回。然后，我们使用\
  \ setState 更新状态，将 fetchInProgress 设置为 true。这将同时更新按钮显示文本并阻止同时运行多个请求。然后，我们使用 fetch\
  \ 获取 this.state.url（我们将在练习后面的模板中传入）。响应使用 GET 方法检索，我们只想使用 Accept 来接受 JSON 响应。在获得响应后，我们然后使用\
  \ json 方法返回其 JSON。这返回 Promise，因此我们使用另一个 then 来处理 JSON 解析时的回调。在最终回调中，我们设置组件的状态，将\
  \ fetchInProgress 恢复为 false，并将 books 数组设置为解码后的 JSON 数据。\n\n5. 接下来，创建 render 方法。你也可以复制粘贴这段代码：\n\
  \n```\nrender() {\n  const bookListItems = this.state.books.map((book) =>\n  {\n\
