  \ 上找到。\n\n### 摘要\n\n在本章中，我们了解了如何通过 Django 命令行创建超级用户，以及如何使用超级用户访问 admin 应用。然后，在简要浏览了\
  \ admin 应用的基本功能之后，我们探讨了如何将模型注册到 admin 应用中，为数据生成 CRUD 界面。\n\n接着，我们学习了如何通过修改站点级功能来改进这个界面。我们通过向\
  \ admin 站点注册自定义模型 admin 类，改变了 admin 应用向用户展示模型数据的方式。这使我们能够对模型界面的表示进行细粒度的更改。这些修改包括：通过添加额外的列、过滤器、日期层级和搜索栏来定制变更列表页面。我们还通过分组和排除字段来修改模型\
  \ admin 页面的布局。\n\n这只是对 admin 应用功能的浅尝辄止。我们将在第 10 章“高级 Django Admin 与定制”中重新探讨 `AdminSite`\
  \ 和 `ModelAdmin` 的丰富功能。但首先，我们需要学习 Django 的一些中级功能。在下一章中，我们将学习如何组织并服务静态内容，例如 CSS、JavaScript\
  \ 和图片，以及如何从 Django 应用中提供这些内容。\n"
- "## 服务静态文件\n\n一个仅包含纯超文本标记语言（HTML）的 Web 应用是非常有限的。我们可以使用层叠样式表（CSS）和图片来增强网页的外观，并使用\
  \ JavaScript 添加交互。我们将所有这些类型的文件称为“静态文件”。它们在开发完成后作为应用的一部分被部署。我们可以将此与动态响应进行比较，动态响应是在发出请求时实时生成的。你编写的所有视图都是通过渲染模板来生成动态响应的。请注意，我们不会将模板视为静态文件，因为它们不是原样发送给客户端的；而是先渲染，然后作为动态响应的一部分发送。\n\
  \n在开发期间，静态文件在开发者的机器上创建，然后必须移动到生产 Web 服务器。如果你必须在短时间内（例如，几小时）上线，那么收集所有静态资源、将它们移动到正确的目录并上传到服务器可能会非常耗时。在使用其他框架或语言开发\
  \ Web 应用时，你可能需要手动将所有静态文件放入 Web 服务器托管的特定目录。更改服务静态文件的 URL 可能意味着需要更新代码中的多处值。\n\nDjango\
  \ 可以帮助我们管理静态资源，使这一过程更加容易。它提供了在开发期间使用其开发服务器提供静态文件的工具。当你的应用上线时，它还可以收集所有资源并将它们复制到一个文件夹中，供专门的\
  \ Web 服务器托管。这使你可以再开发期间以有意义的方式隔离静态文件，并在部署时自动打包它们。\n\n此功能由 Django 内置的 `staticfiles`\
  \ 应用提供。它添加了几个用于处理和服务静态文件的有用功能：\n\n- `static` 模板标签会自动构建资源的静态 URL 并将其包含在 HTML 中。\n\
  - 一个名为 `static` 的视图在开发环境中提供静态文件。\n- 静态文件查找器可用于自定义在文件系统中哪里可以找到资源。\n- `collectstatic`\
  \ 管理命令会查找所有静态文件并将它们移动到一个目录中以便部署。\n- `findstatic` 管理命令会显示针对特定请求加载了磁盘上的哪个静态文件。这也可以帮助我们调试某个文件是否未加载。\n\
  \n在本章的练习和活动中，我们将向 Bookr 应用添加静态文件（图片和 CSS）。在开发期间，每个文件都将存储在 Bookr 项目目录内。我们需要为每个文件生成一个\
  \ URL，以便模板可以引用它们，并且浏览器可以下载它们。URL 生成后，Django 需要提供这些文件。当我们把 Bookr 应用部署到生产环境时，需要找到所有静态文件并将它们移动到一个可以由生产\
  \ Web 服务器提供服务的目录中。如果有静态文件未按预期加载，我们需要某种方法来确定原因。\n\n为了简单起见，让我们以单个静态文件为例：`logo.png`。我们将简要介绍前面提到的每个功能的作用，并在本章中深入解释。我们将介绍静态文件应用的五个部分：\n\
  \n- `static` 模板标签用于将文件名转换为可在模板中使用的 URL 或路径，例如从 `logo.png` 到 `/static/logo.png`。\n\
  - `static` 视图接收在 `/static/logo.png` 路径加载静态文件的请求。它读取文件并将其发送到浏览器。\n- 静态文件查找器（或简称 `finder`）由\
  \ `static` 视图用于在磁盘上定位静态文件。有不同的查找器，但在本例中，其中一个只是将 `/static/logo.png` URL 路径转换为磁盘上的路径\
  \ `bookr/static/logo.png`。\n- 部署到生产环境时，必须使用 `collectstatic` 管理命令。这将把 `logo.png`\
  \ 文件从 Bookr 项目目录复制到 Web 服务器目录，例如 `/var/www/bookr/static/logo.png`。\n- 如果静态文件无法正常工作（例如，对其请求返回\
  \ `404 Not Found` 响应，或提供了错误的文件），那么我们可以使用 `findstatic` 管理命令来尝试确定原因。该命令以文件名作为参数，并输出查看了哪些目录以及在哪里找到了请求的文件。\n\
  \n这些是日常最常用的功能，但我们还将讨论其他功能。\n\n在本章中，你将首先学习静态响应和动态响应之间的区别。然后你将看到 Django 的 `staticfiles`\
  \ 应用如何帮助管理静态文件。当你继续开发 Bookr 应用时，你将使用图片和 CSS 来增强它。你将看到为项目布局静态文件的不同方式，并了解 Django 如何为生产部署整合这些文件。Django\
  \ 包含了用于在模板中引用静态文件的工具；你将看到这些工具如何帮助减少部署应用到生产环境时必须做的工作。在此之后，\n\n\n你将探索 `findstatic`\
  \ 命令，该命令可用于调试与静态文件相关的问题。随后，你将了解如何为将静态文件存储在远程服务上编写代码的概述。最后，你将查看缓存网络资源以及 Django 如何帮助进行缓存失效。\n\
  \n本章将涵盖以下主要主题：\n\n- Static file serving\n- Introduction to Static Files Finder\n\
  - Generating static URLs with the static template tag\n- FileSystem Finder\n- Static\
  \ file finders – use during collectstatic\n- `STATICFILES_DIRS` prefixed mode\n\
  - The `findstatic` command\n- Serving the latest files (for cache validation)\n\
  - Custom storage engines\n\n## Technical requirements\n\n本章的所有代码文件均可在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter05\
  \ 获取。\n\n## Static file serving\n\n在引言中，我们提到 Django 包含一个名为 `static` 的视图函数，用于提供静态文件。关于提供静态文件，首要需要明确的是\
  \ Django 并非打算在生产环境中提供它们。这不是 Django 的职责，而且在生产环境中，Django 会拒绝提供静态文件。这是正常且预期的行为。如果 Django\
  \ 只是从文件系统读取并发送文件，那么它与普通 Web 服务器相比并无优势，而普通 Web 服务器在执行此任务时可能性能更好。此外，如果你使用 Django 提供静态文件，你将使\
  \ Python 进程在请求期间保持忙碌状态，而它无法处理更适合它的动态请求。\n\n出于这些原因，Django `static` 视图仅设计用于开发期间使用，并且在你的\
  \ DEBUG 设置为 False 时将无法工作。由于在开发期间我们通常只有一个人访问站点（开发者），因此 Django 提供静态文件是可以的。我们稍后将讨论\
  \ `staticfiles` 应用如何支持生产部署。整个生产部署流程将在第 17 章《Deploying a Django Application (Part\
  \ 1 – Server Setup)》中介绍，该章节托管在此书的 GitHub 仓库中。\n\n当运行 Django 开发服务器时，只要你的 settings.py\
  \ 文件包含以下元素，就会为静态视图自动设置 URL 映射：\n\n- 将 DEBUG 设置为 True\n- 在其 INSTALLED_APPS 中包含 'django.contrib.staticfiles'\n\
  \n这两个设置默认都存在。\n\n创建的 URL 映射大致等同于在你的 urlpatterns 中有以下映射：\n\n```\npath(settings.STATIC_URL,\
  \ django.conf.urls.static)\n```\n\n任何以 settings.STATIC_URL 开头的 URL（默认为 /static/）都会映射到静态视图。\n\
  \n> Note\n> 你可以在不将 staticfiles 包含在 INSTALLED_APPS 中的情况下使用静态视图，但你必须手动设置等效的 URL 映射。\n\
  \n接下来，我们将讨论 Django 如何使用 Static Files Finder 定位静态文件。\n\n## Introduction to Static\
  \ Files Finder\n\nDjango 需要在磁盘上定位静态文件的有三种情况，为此它使用静态文件查找器。它可以被视为一个插件。它是一个实现将 URL\
  \ 路径转换为磁盘的方法的类，并遍历项目目录以查找静态文件。\n\n第一次使用是在 Django 静态视图接收到加载特定静态文件的请求时；此时，它需要将 URL\
  \ 中的路径转换为磁盘上的位置。例如，假设 URL 的路径是 /static/logo.png，并且它被转换为磁盘上的 bookr/static/logo.png\
  \ 路径。正如我们在上一节中所述，这仅在开发期间发生。在生产服务器上，Django 不应接收此请求，因为它将由 Web 服务器直接处理。\n\n第二次是在使用\
  \ collectstatic 管理命令时。它收集项目目录中的所有静态文件并将其复制到单个目录，以便由生产 Web 服务器提供服务。bookr/static/logo.png\
  \ 将被复制到 Web 服务器根目录——例如，/var/www/bookr/static/logo.png。静态文件查找器包含用于定位项目目录内所有静态文件的代码。\n\
  \n最后一次使用静态文件查找器是在执行 findstatic 管理命令时。这与第一次使用类似，其中它接受一个静态文件名（如 logo.png），但它会将完整路径（bookr/static/logo.png）输出到终端，而不是加载文件内容。\n\
  \nDjango 附带了一些内置查找器，但如果你想将静态文件存储在自定义目录结构中，也可以编写自己的查找器。Django 使用的查找器列表由 settings.py\
  \ 中的 STATICFILES_FINDERS 设置定义。在本章中，我们将在 AppDirectoriesFinder 和 FileSystemFinder\
  \ 部分分别介绍默认静态文件查找器 AppDirectoriesFinder 和 FileSystemFinder 的行为。\n\n> **Note**\n>\
  \ \n> 如果你查看 settings.py，你不会看到默认情况下定义了 STATICFILES_FINDERS 设置。这是因为 Django 将使用其内置的默认设置，定义为\
  \ ['django.contrib.staticfiles.finders.FileSystemFinder', 'django.contrib.staticfiles.finders.AppDirectoriesFinder']。如果你将\
  \ STATICFILES_FINDERS 设置添加到 settings.py 文件以包含自定义查找器，请确保在使用的情况下包含这些默认值。\n\n在本节中，我们将首先讨论静态文件查找器及其在第一种情况——响应请求中的使用。然后，我们将介绍一些更多概念并返回\
  \ collectstatic 的行为以及它如何使用静态文件查找器。\n\n## Static file finders – use during a request\n\
  \n当 Django 接收到对静态文件的请求时（请记住，Django 仅在开发期间提供静态文件），每个已定义的静态文件查找器将被查询，直到在磁盘上找到文件。或者，如果没有任何查找器能定位到文件，静态视图将返回\
  \ HTTP 404 Not Found 响应。\n\n例如，请求的 URL 将类似于 /static/main.css 或 /static/reviews/logo.png。每个查找器将依次使用\
  \ URL 中的路径进行查询，并返回诸如 bookr/static/main.css 的路径用于第一个文件，以及 bookr/reviews/static/reviews/logo.png\
  \ 用于第二个文件。每个查找器将使用其逻辑将 URL 路径转换为文件系统路径——我们将在 AppDirectoriesFinder 和 FileSystemFinder\
  \ 部分讨论此逻辑。\n\n## AppDirectoriesFinder\n\nAppDirectoriesFinder 类用于在每个应用目录中的名为 static\
  \ 的目录内查找静态文件。应用程序必须在你的 settings.py 文件的 INSTALLED_APPS 设置中列出（我们在第 1 章《An Introduction\
  \ to Django》中已完成此操作）。正如我们在第 1 章《An Introduction to Django》中也提到的，应用程序最好是自包含的。通过让每个应用程序拥有一个静态目录，我们可以通过将应用特定的静态文件也存储在应用目录内来继续自包含的设计。\n\
  \n在我们使用 AppDirectoriesFinder 之前，我们将解释如果多个静态文件具有相同名称时可能出现的问题，以及如何解决此问题。\n\n## Static\
  \ file namespacing\n\n在之前的部分《Static file finders – use during a request》中，我们讨论了提供名为\
  \ logo.png 的文件。这将为 reviews 应用程序提供一个 logo。文件名（logo.png）可能很常见——你可以想象，如果我们添加一个 store\
  \ 应用（用于购买书籍），它也将有一个 logo。更不用说第三方 Django 应用也可能想要使用 logo.png 这样的通用名称。即将描述的问题可能适用于任何具有通用名称的静态文件，例如\
  \ styles.css 或 main.js。\n\n让我们考虑 reviews 和 stores 示例。我们可以在这两个应用中添加一个静态目录。然后，每个静态目录都将有一个\
  \ logo.png 文件（尽管是不同的 logo）。目录结构如 Figure 5.1 所示：\n\n![](img/4840a43efd335abd10b93708225692d6_238_0.png)\n\
  \nFigure 5.1 – Directory layout with static directories inside app directories\n\
  \n用于下载静态文件的 URL 路径是相对于静态目录的。因此，如果我们对 /static/logo.png 发出 HTTP 请求，则不清楚引用的是哪个 logo.png。Django\
  \ 将依次检查每个应用程序的静态目录（按 INSTALLED_APPS 设置中指定的顺序）。它找到的第一个 logo.png 将被提供。在这种目录布局中，没有办法指定要加载哪个\
  \ logo.png。\n\n我们可以通过为静态文件命名空间来解决此问题。这是在静态目录内使用另一个目录的过程，该目录的名称与应用相同。reviews 应用在其静态目录内有一个\
  \ reviews 目录，而 store 应用在其静态目录内有一个 store 目录。相应的 logo.png 文件随后被移动到这些子目录中。新的目录布局如 Figure\
  \ 5.2 所示：\n\n\n\n![](img/4840a43efd335abd10b93708225692d6_239_0.png)\n\n*图 5.2 –\
  \ 使用命名空间目录的目录布局*\n\n要加载特定文件，我们必须同时包含命名空间目录。对于评论 logo，其 URL 路径为 `/static/reviews/logo.png`，在磁盘上映射到\
  \ `bookr/reviews/static/reviews/logo.png`。同样，对于商店 logo，路径为 `/static/store/logo.png`，映射到\
  \ `bookr/store/static/store/logo.png`。你可能已经注意到，在 *静态文件查找器 – 请求期间使用* 部分中，logo.png\
  \ 文件的示例路径已经是命名空间化的。\n\n> **注意**\n> \n> 如果你正在考虑编写一个可能作为独立插件发布的 Django 应用，你可以使用更明确的子目录名称。例如，你可以选择包含整个点分项目路径的名称：`bookr/reviews/static/bookr.reviews`。不过在大多数情况下，让子目录名称仅对你的项目唯一就足够了。\n\
  \n现在我们已经介绍了 `AppDirectoriesFinder` 和静态文件命名空间，我们就可以使用它们来提供我们的第一个静态文件。在本章的第一个练习中，我们将为一个基础业务网站创建一个新的\
  \ Django 项目。然后我们将从一个名为 `landing` 的应用中提供一个 logo 文件，该应用将在此项目中创建。`AppDirectoriesFinder`\
  \ 类用于在每个应用目录中的 `static` 目录内查找静态文件。应用必须在你的 `settings.py` 文件的 `INSTALLED_APPS` 设置中列出。正如我们在\
  \ *第 1 章，Django 简介* 中提到的，应用最好是自包含的。通过让每个应用都有一个 `static` 目录，我们可以通过将应用特定的静态文件也存储在应用目录内来继续这种自包含的设计。\n\
  \n从应用目录提供静态文件是最简单的方法。这是因为我们不需要进行任何设置更改。相反，我们只需在正确的目录中创建文件，它们就会使用默认的 Django 配置提供服务。\n\
  \n> **业务网站项目**\n> 在本章的练习中，我们将创建一个新的 Django 项目，并用它来演示静态文件概念。该项目将是一个基础业务网站，具有一个简单的落地页，其中包含一个\
  \ logo。该项目将有一个应用，名为 *landing*。\n> \n> 你可以参考 *第 1 章，Django 简介* 中的 *练习 1.01 – 创建项目和应用，并启动开发服务器*，以回顾创建\
  \ Django 项目的方法。\n\n## 练习 5.01 – 从应用目录提供文件\n\n在本练习中，你将为 *landing* 应用添加一个 logo 文件。这将通过在\
  \ *landing* 应用目录内的 `static` 目录中放置一个 `logo.png` 文件来完成。完成后，你可以测试静态文件是否正确提供，并确认将提供它的\
  \ URL：\n\n- 1. 首先创建新的 Django 项目。你可以重用已安装 Django 的 Bookr 虚拟环境。\n- 2. 打开一个新的终端并激活虚拟环境（请参考\
  \ *前言* 中有关如何创建和激活虚拟环境的说明）。\n- 3. 在终端（或命令提示符）中运行 `django-admin` 命令以启动名为 `business_site`\
  \ 的 Django 项目：\n```\ndjango-admin startproject business_site\n```\n不会有任何输出。此命令将在名为\
  \ `business_site` 的新目录中搭建 Django 项目。\n- 4. 使用 `startapp` 管理命令在此项目中创建一个新的 Django\
  \ 应用。应用应命名为 *landing*。为此，`cd` 进入 `business_site` 目录，然后运行以下命令：\n```\npython3 manage.py\
  \ startapp landing\n```\n同样不会有任何输出。该命令将在 `business_site` 目录内创建 `landing` 应用目录。\n\
  \n> **注意**\n> 请记住，在 Windows 上，命令是 `python manage.py startapp landing`。\n\n5. 启动\
  \ PyCharm 并打开 business_site 目录。如果你已经打开了一个项目，可以通过选择 File | Open 来执行此操作；否则，只需在欢迎 PyCharm\
  \ 窗口中点击 Open。导航到 business_site 目录，选择它，然后点击 Open。如果提示，请选择 Trust Project。business_site\
  \ 项目窗口应与图 5.3 所示类似：\n\n> 注意\n> 有关如何设置和配置 PyCharm 以与你的 Django 项目配合使用的详细说明，请参考第 1\
  \ 章 *An Introduction to Django* 中的练习 1.02 – 在 PyCharm 中进行项目设置。\n\n![](img/4840a43efd335abd10b93708225692d6_241_0.png)\n\
  \n图 5.3 – business_site 项目\n\n6. 创建一个新的运行配置以执行项目的 manage.py runserver。你可以再次重用 Bookr\
  \ 虚拟环境。完成后，Run/Debug Configurations 窗口应与图 5.4 所示类似：\n\n## 注意\n\n> 如果你不确定如何在 PyCharm\
  \ 中配置这些设置，请参考第 1 章 *An Introduction to Django* 中的练习 1.02 – 在 PyCharm 中进行项目设置。\n\n\
  ![](img/4840a43efd335abd10b93708225692d6_242_0.png)\n\n图 5.4 – Runserver 的 Run/Debug\
  \ Configurations\n\n你可以通过点击 Run 按钮，然后在浏览器中访问 http://127.0.0.1:8000/ 来测试配置是否正确设置。你应该会看到\
  \ Django 欢迎屏幕。如果调试服务器无法启动或你看到 Bookr 主页，那么你可能仍在运行 Bookr 项目。尝试停止 Bookr runserver 进程（在运行它的终端中按\
  \ Ctrl + C），然后启动你刚刚设置的新服务器。\n\n- 7. 打开 business_site 目录中的 settings.py 并将 'landing'\
  \ 添加到 INSTALLED_APPS 设置中。我们在第 1 章 *An Introduction to Django* 中练习 1.05 – 创建模板目录和基础模板\
  \ 的步骤 1 中学习了如何执行此操作。\n- 8. 在 PyCharm 中，右键单击项目窗格中的 landing 目录并选择 New | Directory。\n\
  \n9. 输入 `static` 并按 *Enter* 键：\n\n![](img/4840a43efd335abd10b93708225692d6_243_0.png)\n\
  \n图 5.5 – 将目录命名为 static\n\n10. 右键单击你刚刚创建的 `static` 目录并再次选择 **New | Directory**。\n\
  \n11. 输入 `landing` 并按 *Enter*。这将实现我们之前讨论的静态文件目录的命名空间化：\n\n![](img/4840a43efd335abd10b93708225692d6_243_1.png)\n\
  \n图 5.6 – 命名新的目录 reviews 以实现命名空间化\n\n12. 从 `https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter05/Exercises.01/business_site/landing/static/landing/logo.png`\
  \ 下载 `logo.png` 文件并将其移动到 `landing/static/landing` 目录中。\n\n13. 启动 Django 开发服务器。如果尚未运行，请导航到\
  \ `http://127.0.0.1:8000/static/landing/logo.png`。你应该在浏览器中看到图像被提供：\n\n![](img/4840a43efd335abd10b93708225692d6_243_2.png)\n\
  \n图 5.7 – Django 提供的图像\n\n如果你看到图 5.7 所示的图像，则表示你已正确设置了静态文件提供。\n\n现在你已经看到加载静态图像工作正常，我们将学习更多关于如何防止硬编码这些\
  \ URL 的方法。在下一节中，你将看到 Django 如何自动为模板使用生成正确的静态 URL。\n\n## 使用 static 模板标签生成静态 URL\n\
  \n在练习 5.01 – 从应用目录提供文件 中，你设置了一个由 Django 提供的图像文件。我们看到图像的 URL 为 http://127.0.0.1:8000/static/landing/logo.png，你可以在\
  \ HTML 模板中使用它。例如，要使用 img 标签显示图像，你可以在模板中使用以下代码：\n\n```\n<img src=\"http://127.0.0.1:8000/static/landing/logo.png\"\
  >\n```\n\n或者，由于 Django 也提供媒体并且与动态模板响应具有相同的 host，你可以简化为仅包含路径，如下所示：\n\n```\n<img src=\"\
  /static/landing/logo.png\">\n```\n\n这两个地址（URL 和路径）都已硬编码到模板中——也就是说，我们包含静态文件的完整路径并假设文件托管的位置。这在使用\
  \ Django 开发服务器或将静态文件和 Django 网站托管在同一域名上时效果很好。随着网站变得更受欢迎，为了获得更好的性能，你可能考虑从自己的域名或内容分发网络（CDN）提供静态文件。\n\
  \n> 注意\n> CDN 是一种可以为你托管网站部分或全部的服务。它提供多个 Web 服务器，可以无缝加速你的网站加载。例如，它可能会从地理位置最接近用户的服务器为用户提供文件。有多个\
  \ CDN 提供商，具体取决于设置方式，它们可能要求你指定用于提供静态文件的特定域名。\n\n例如，一个常见的分离方法：为静态文件提供使用不同的域名。你将主网站托管在\
  \ https://www.example.com，但希望从 https://static.example.com 提供静态文件。在开发期间，我们可以使用上面看到的\
  \ logo 文件的路径。但在部署到生产服务器时，我们的 URL 需要更改以包含域名，如下所示：\n\n```\n<img src=\"https://static.example.com/landing/logo.png\"\
  >\n```\n\n\n\n\n\n我们可以通过 img 标签将 logo 作为页面上的图像包含进来，如下所示：\n\n```\n<img src=\"{% static\
  \ 'landing/logo.png' %}\">\n```\n\n这在模板中渲染如下：\n\n```\n<img src=\"/static/landing/logo.png\"\
  >\n```\n\n或者，我们也可以使用 static 标签来生成链接 CSS 文件的 URL，如下所示：\n\n```\n<link href=\"{% static\
  \ 'path/to/file.css' %}\" rel=\"stylesheet\">\n```\n\n这将被渲染为如下：\n\n```\n<link href=\"\
  /static/path/to/file.css\" rel=\"stylesheet\">\n```\n\n它也可以在 script 标签中使用来包含 JavaScript\
  \ 文件，使用以下代码行：\n\n```\nin a script tag:<script src=\"{% static 'path/to/file.js'\
  \ %}\"></script>\n```\n\n这被渲染为如下：\n\n```\n<script src=\"/static/path/to/file.js\"\
  ></script>\n```\n\n你甚至可以使用它来生成指向静态文件的下载链接，就像我们在这里做的那样：\n\n```\n<a href=\"{% static\
  \ 'path/to/document.pdf' %}\">Download PDF</a>\n```\n\n> **Note**\n> 请注意，这不会生成实际的\
  \ PDF 内容——它只会创建一个指向已存在文件的链接。\n\n这被渲染为如下：\n\n```\n<a href=\"/static/path/to/document.pdf\"\
  >Download PDF</a>\n```\n\n在参考这些示例的同时，我们现在可以展示使用 static 标签而不是硬编码的优势。当我们准备部署到生产环境时，我们只需在\
  \ settings.py 中更改 STATIC_URL 值。模板中的任何值都不需要更改。\n\n例如，我们可以将 STATIC_URL 更改为 https://static.example.com/，然后当页面下次渲染时，我们看到的示例将自动更新。\n\
  \n以下行显示了图像的这种情况：\n\n```\n<img src=\"https://static.example.com/landing/logo.png\"\
  >\n```\n\n以下内容用于 CSS 链接：\n\n```\n<link href=\"https://static.example.com/path/to/files.css\"\
  \ rel=\"stylesheet\">\n```\n\n对于脚本，它如下所示：\n\n```\n<script src=\"https://static.example.com/path/to/file.js\"\
  ></script>\n```\n\n最后，以下内容用于链接：\n\n```\n<a href=\"https://static.example.com/path/to/document.pdf\"\
  >Download PDF</a>\n```\n\n请注意，在所有这些示例中，都将字面字符串作为参数传递（它是带引号的）。你也可以使用变量作为参数——例如，如果你正在使用上下文渲染模板，如此示例代码中：\n\
  \n```\ndef view_function(request):\n    context = {\"image_file\": \"logofile.png\"\
  }\n    return render(request, \"example.html\", context)\n```\n\n我们正在使用一个名为 image_file\
  \ 的变量渲染 example.html 模板。此变量的值为 logo.png。\n\n你将不带引号地将此变量传递给 static 标签：\n\n```\n<img\
  \ src=\"{% static image_file %}\">\n```\n\n它将像这样渲染（假设我们将 STATIC_URL 改回 /static/）：\n\
  \n```\n<img src=\"/static/logo.png\">\n```\n\n模板标签也可以与 as [variable] 后缀一起使用，将结果分配给一个变量以便在模板后面使用。这在静态文件查找花费很长时间并且你想多次引用同一个静态文件时很有用（例如在多个地方包含图像）。\n\
  \n第一次引用静态 URL 时，给它一个变量名以分配给它。在这种情况下，我们正在创建 logo_path 变量：\n\n```\n<img src=\"{% static\
  \ 'logo.png' as logo_path %}\">\n```\n\n这与我们之前看到的示例渲染方式相同：\n\n```\n<img src=\"/static/logo.png\"\
  >\n```\n\n然而，我们随后可以在模板后面的位置再次使用已分配的变量（logo_path）：\n\n```\n<img src=\"{{ logo_path\
  \ }}\">\n```\n\n这再次渲染为相同内容：\n\n```\n<img src=\"/static/logo.png\">\n```\n\n此变量现在只是在模板作用域中的一个普通上下文变量，可以在模板中的任何位置使用。但是要小心，因为你可能会覆盖已经定义过的变量——尽管这是在使用任何分配变量的模板标签（例如\
  \ {% with %}）时的一般警告。\n\n在下一个练习中，我们将通过向 business_site 项目添加模板，然后包含示例图像，将 static 模板付诸实践。\n\
  \n## Exercise 5.02 – using the static template tag\n\n在 Exercise 5.01 – serving\
  \ a file from an app directory 中，你测试了从 static 目录提供 logo.png。在本练习中，你将继续使用 business\
  \ site 项目并创建 index.html 文件作为我们着陆页的模板。然后，你将使用 {% static %} 模板标签在此页面中包含 logo：\n\n\
  - 1. 在 PyCharm 中（确保你在 business_site 项目中），右键单击 landing 目录并创建一个名为 templates 的新文件夹。\n\
  - 2. 右键单击新的 templates 目录并选择 New | HTML File。选择 HTML 5 file 并将其命名为 index.html：\n\n\
  ![](img/4840a43efd335abd10b93708225692d6_248_0.png)\n\nFigure 5.8 – New index.html\n\
  \n- 3. 打开 `index.html` 文件并首先加载 static 标签库以使 static 标签在模板中可用。使用 `load` 模板标签来完成此操作。在文件的第二行（就在\
  \ `<!DOCTYPE html>` 之后），添加此行以加载 static 库：\n  \n  ```django\n  {% load static %}\n\
  \  ```\n\n- 4. 你也可以通过添加一些额外内容使模板更漂亮一些。在 `<title>` 标签内输入 Business Site 文本：\n  \n\
  \  ```html\n  <title>Business Site</title>\n  ```\n  \n  然后，在 body 内，添加一个包含 `Welcome\
  \ to my Business Site` 文本的 `<h1>` 元素：\n  \n  ```html\n  <h1>Welcome to my Business\
  \ Site</h1>\n  ```\n\n- 5. 在标题文本下方，使用 `{% static %}` 模板标签设置 `<img>` 的源。你将使用它来引用来自\
  \ *Exercise 5.01 – serving a file from an app directory* 的 logo：\n  \n  ```html\n\
  \  <img src=\"{% static 'landing/logo.png' %}\">\n  ```\n\n- 6. 最后，为了丰富网站内容，在 `<img>`\
  \ 下方添加一个 `<p>` 元素。给它一些关于业务的文本：\n  \n  ```html\n  <p>Welcome to the site for my Business.\
  \ For all your Business needs!</p>\n  ```\n  \n  尽管额外的文本和标题不是很重要，但它们让我们了解如何在其余内容周围使用\
  \ `{% static %}` 模板标签。保存文件。完成后，它应该看起来像这样：https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter05/Exercise5.02/business_site/landing/templates/index.html。\n\
  \n- 7. 接下来，设置一个 URL 来使用以渲染模板。你还将使用内置的 `TemplateView` 来渲染模板，而无需创建视图。打开 `business_site`\
  \ 包目录中的 `urls.py`。在文件开头按如下方式导入 `TemplateView`：\n  \n  ```python\n  from django.views.generic\
  \ import TemplateView\n  ```\n  \n  你也可以删除此 Django admin 导入行，因为我们在本项目中不使用它：\n  \n\
  \  ```python\n  from django.contrib import admin\n  ```\n\n- 8. 添加一个从 `/` 到 `TemplateView`\
  \ 的 URL 映射。`TemplateView` 的 `as_view` 方法接受 `template_name` 作为参数，它的使用方式与你可能传递给 render\
  \ 函数的路径相同。你的 `urlpatterns` 应该如下所示：\n  \n  ```python\n  urlpatterns = [\n      path(\"\
  \", \n           TemplateView.as_view(template_name=\"index.html\")),\n  ]\n  ```\n\
  \n保存 urls.py 文件。完成后，它应该看起来像这样：https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter05/Exercise5.02/business_site/business_site/urls.py。\n\
  \n9. 启动 Django 开发服务器，如果它尚未运行。导航到 http://127.0.0.1:8000/ 在你的浏览器中。你应该看到你的新着陆页，如图 5.9\
  \ 所示：\n\n![](img/4840a43efd335abd10b93708225692d6_250_0.png)\n\nFigure 5.9 – My\
  \ business site with a logo\n\n在本练习中，我们为 landing 添加了一个基础模板并将 static 库加载到模板中。一旦 static\
  \ 库被加载，我们就能够使用 static 模板标签加载图像。然后，我们能够在浏览器中看到我们的业务 logo 渲染出来。\n\n到目前为止，静态文件加载已使用\
  \ AppDirectoriesFinder，因为它使用时不需要额外配置。在下一节中，我们将查看 FileSystemFinder，它更灵活但需要少量配置才能使用。\n\
  \n\n\n\n\n## FileSystemFinder\n\n到目前为止，我们已经学习了 `AppDirectoriesFinder`，它会加载 Django\
  \ 应用目录内的静态文件。然而，我们期望设计良好的应用是自包含的，因此它们只应包含所依赖的静态文件。如果我们有在整个网站或不同应用中使用的其他静态文件，则应将它们存储在应用目录之外。\n\
  \n> **Note**\n>\n> 作为一般规则，你的 CSS 可能在整个网站中保持一致，可以保存在全局目录中。某些图片和 JavaScript 代码可能特定于应用，因此这些会存储在该应用的\
  \ `static` 目录中。这只是一般建议：你可以将静态文件存储在对你的项目最有意义的任何位置。\n\n在我们的 business site 应用中，我们将在站点\
  \ `static` 目录中存储一个 CSS 文件，因为它不仅会在 `landing` 应用中使用，而且在我们添加更多应用时也会在整个站点中使用。\n\nDjango\
  \ 提供了使用其 `FileSystemFinder` 静态文件查找器从任意目录提供静态文件的支持。目录可以位于磁盘上的任何位置。通常，你会在项目目录内有一个\
  \ `static` 目录，但如果你的公司有一个在许多不同项目中使用的全局 `static` 目录，包括非 Django Web 应用，那么你也可以使用它。\n\
  \n`FileSystemFinder` 使用 `settings.py` 文件中的 `STATICFILES_DIRS` 设置来确定在其中搜索静态文件的目录。创建项目时不存在此设置，必须由开发者设置。我们将在下一个练习中添加它。有两种构建此列表的选项：\n\
  \n- 设置目录列表\n- 设置形如 `(prefix, directory)` 的元组列表\n\n一旦我们涵盖了更多基础知识，第二种用例将更容易理解，因此我们将在解释并演示第一种情况后返回。将在\
  \ *STATICFILES_DIRS prefixed mode* 部分介绍。对于现在，我们将只解释第一种用例，即一个或多个目录的列表。\n\n在 `business_site`\
  \ 中，我们将在项目目录内添加一个静态目录，即包含 landing 应用和 `manage.py` 文件的同一目录。我们可以使用 `BASE_DIR` 设置在分配给\
  \ `STATICFILES_DIRS` 的列表构建时：\n\n```python\nSTATICFILES_DIRS = [BASE_DIR / \"static\"\
  ]\n```\n\n我们也在本节前面提到，你可能想在此列表中设置多个目录路径，例如，如果你有一些由多个 Web 项目共享的公司范围的静态数据。只需将额外目录添加到\
  \ STATICFILES_DIRS 列表中：\n\n```python\nSTATICFILES_DIRS = [BASE_DIR / \"static\"\
  ,\n    \"/Users/username/projects/company-static/\"\n]\n```\n\n每个目录都将按指定顺序检查以查找匹配的文件。如果文件同时存在于两个目录中，则会提供先找到的那个。例如，如果\
  \ static/main.css（位于 business_site 项目目录内）和 /Users/username/projects/company-static/bar/main.css\
  \ 文件都存在，则对 /static/main.css 的请求将提供 business_site 项目的 main.css，因为它在列表中排在前面。在决定将目录添加到\
  \ STATICFILES_DIRS 的顺序时请考虑这一点；你可以选择优先使用项目静态文件而不是全局文件，反之亦然。\n\n在我们的 business site（以及后来的\
  \ Bookr）中，我们将只在此列表中使用一个静态目录，因此我们不必担心这个问题。\n\n在下一个练习中，我们将添加一个包含 CSS 文件的静态目录。然后，我们将配置\
  \ STATICFILES_DIRS 设置，以便可以从静态目录提供服务。\n\n### Exercise 5.03 – serving from a project\
  \ static directory\n\n我们在 Exercise 5.01 – serving a file from an app directory 中展示了提供应用特定图片文件的示例。现在，我们想提供一个要在整个项目中用于设置样式的\
  \ CSS 文件，因此我们将从项目文件夹内的静态目录提供此文件。\n\n在此练习中，你将设置项目以从特定目录提供静态文件，然后再次使用 `{% static %}`\
  \ 模板标签将其包含在模板中。这将使用 business_site 示例项目完成：\n\n- 1. 如果 business_site 项目尚未打开，请在 PyCharm\
  \ 中打开它。然后，右键单击 business_site 项目目录（顶层的 business_site 目录，而不是 business_site 包目录）并选择\
  \ New | Directory。\n- 2. 在 New Directory 对话框中，输入 static 并单击 OK。\n- 3. 右键单击你刚创建的\
  \ static 目录并选择 New | File。\n- 4. 在 New File 对话框中，输入 main.css 并单击 OK。\n- 5. 应该会自动打开空白的\
  \ `main.css` 文件。输入几条简单的 CSS 规则以居中文本并设置字体和背景颜色，如下所示：\n\n  ```css\n  body {\n    \
  \  font-family: Arial, sans-serif;\n      text-align: center;\n      background-color:\
  \ #f0f0f0;\n  }\n  ```\n\n  你现在可以保存并关闭 `main.css`。你可以在 https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter05/Exercise5.03/business_site/static/main.css\
  \ 查看完整文件以供参考。\n\n- 6. 打开 `business_site/settings.py`。在此处，设置 `STATICFILES_DIRS` 设置的目录列表。在这种情况下，列表将只有一个项目。在\
  \ `settings.py` 文件底部使用以下代码定义一个名为 `STATICFILES_DIRS` 的新变量：\n\n  ```python\n  STATICFILES_DIRS\
  \ = [BASE_DIR / \"static\"]\n  ```\n\n  在 `settings.py` 文件中，`BASE_DIR` 是一个包含项目目录路径的变量。你可以通过将\
  \ `static` 连接到 `BASE_DIR` 来构建你在 *Step 2* 中创建的 `static` 目录的完整路径。然后，你可以将它放在一个列表中。完整的\
  \ `settings.py` 文件应如下所示：https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter05/Exercise5.03/business_site/business_site/settings.py。\n\
  \n- 7. 如果尚未运行，请启动 Django 开发服务器。你可以通过检查是否可以加载 `main.css` 文件来验证设置是否正确。请注意，这不是命名空间的，因此\
  \ URL 为 `http://127.0.0.1:8000/static/main.css`。在浏览器中打开此 URL 并检查内容是否与你刚刚输入和保存的内容匹配：\n\
  \n  ![](img/4840a43efd335abd10b93708225692d6_253_0.png)\n\n  Figure 5.10 – CSS served\
  \ by Django\n\n  如果文件无法加载，请检查你的 STATICFILES_DIRS 设置。如果你是在修改 settings.py 时服务器正在运行，可能需要重新启动\
  \ Django 开发服务器。\n\n- 8. 现在，你需要在 index 模板中包含 main.css。打开 templates 文件夹中的 index.html。在关闭的\
  \ `</head>` 标签之前，添加此 `<link>` 标签以加载 CSS：\n\n  ```html\n  <link rel=\"stylesheet\"\
  \ href=\"{% static 'main.css' %}\">\n  ```\n\n  这会链接 main.css 文件，使用 `{% static %}`\
  \ 模板标签。如前所述，由于 main.css 不是命名空间的，你只需包含其名称。保存文件；它应如下所示：https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter05/Exercise5.03/business_site/landing/templates/index.html。\n\
  \n- 9. 在浏览器中加载 `http://127.0.0.1:8000/`；你应该会看到背景颜色、字体和对齐方式都发生了变化：\n\n  ![](img/4840a43efd335abd10b93708225692d6_254_0.png)\n\
  \n  Figure 5.11 – CSS applied with custom fonts visible\n\n你的 business landing 页面应如下图所示\
  \ Figure 5.11。由于你将 CSS 包含在 index.html 模板中，它将在扩展此模板的所有模板中可用（尽管目前还没有；这是为未来做的好规划）。\n\
  \n在此练习中，我们将一些 CSS 规则放入文件中，并使用 Django 的 `FileSystemFinder` 提供它们。这是通过在 `business_site`\
  \ 项目目录内创建 `static` 目录并在 Django 设置（`settings.py` 文件）中使用 `STATICFILES_DIRS` 设置指定它来实现的。我们使用静态模板标签将\
  \ `main.css` 文件链接到 `index.html` 模板。我们在浏览器中加载主页面并看到字体和颜色更改已应用。\n\n我们现在已经介绍了在请求期间如何使用静态文件查找器（在给定\
  \ URL 时加载特定静态文件）。我们现在将查看它们的另一个用例：在运行 `collectstatic` 管理命令时查找和复制静态文件以进行生产部署。\n\n\
  ## Static file finders – use during collectstatic\n\n一旦我们完成了对静态文件的操作，就需要将它们移动到可以由生产\
  \ Web 服务器提供的特定目录。然后，我们可以通过将 Django 代码和静态文件复制到生产 Web 服务器来部署我们的网站。在 `business_site`\
  \ 的情况下，我们希望将 `logo.png` 和 `main.css`（以及 Django 本身包含的其他静态文件）移动到可以复制到生产 Web 服务器的单个目录中。这就是\
  \ `collectstatic` 管理命令的作用。\n\n我们已经讨论了 Django 在请求处理期间如何使用静态文件查找器。现在，我们将介绍另一个用例：收集静态文件以进行部署。运行\
  \ `collectstatic` 管理命令时，Django 使用每个查找器列出磁盘上的静态文件。找到的每个静态文件然后被复制到 `STATIC_ROOT` 目录（也在\
  \ `settings.py` 中定义）。这有点像处理请求的逆过程。不是获取 URL 路径并将其映射到文件系统路径，而是将文件系统路径复制到前端 Web 服务器可以预测的位置。这允许前端\
  \ Web 服务器独立于 Django 处理对静态文件的请求。\n\n> **Note**\n>\n> 前端 Web 服务器是设计用于将请求路由到应用程序（如\
  \ Django）或从磁盘读取静态文件的 Web 服务器。它们可以处理请求更快，但不能像 Django 这样的东西那样以相同的方式生成动态内容。前端 Web 服务器是\
  \ Apache HTTPD、Nginx 和 lighttpd 等软件。\n\n对于 `collectstatic` 如何工作的一些具体示例，我们将使用来自 *Exercise\
  \ 5.01 – serving a file from an app directory* 和 *Exercise 5.03 – serving from a\
  \ project static directory* 的两个文件，分别是 `landing/static/landing/logo.png` 和 `static/main.css`。\n\
  \n假设 `STATIC_ROOT` 已设置为由普通 Web 服务器提供服务的目录——这将是类似 `/var/www/business_site/static`\
  \ 的内容。这些文件的目标将分别是 `/var/www/business_site/static/landing/logo.png` 和 `/var/www/business_site/static/main.css`。\n\
  \n\n\n\n\n现在，当静态文件请求到来时，Web 服务器将能够轻松地提供它，因为路径映射是一致的：\n\n- `/static/main.css` 是从\
  \ `/var/www/business_site/static/main.css` 文件提供的\n- `/static/reviews/logo.png` 是从\
  \ `/var/www/business_site/static/reviews/logo.png` 文件提供的\n\n这意味着 Web 服务器根目录是 `/var/www/business_site/`，静态路径会以\
  \ Web 服务器加载文件的常规方式直接从磁盘加载。\n\n至此，我们已经演示了 Django 在开发期间如何定位静态文件并自行提供它们。在生产环境中，我们需要前端\
  \ Web 服务器能够在不涉及 Django 的情况下提供静态文件，这既是为了安全，也是为了速度。\n\n如果不运行 `collectstatic`，Web 服务器将无法将\
  \ URL 映射回路径。例如，它不知道 `main.css` 必须从项目静态目录加载，而 `logo.png` 要从 landing 应用目录加载——它完全没有\
  \ Django 目录布局的概念。\n\n你可能会想通过将 Web 服务器根目录设置为 Django 项目目录来直接提供文件——**不要这样做。** 共享整个\
  \ Django 项目目录存在**安全风险**，因为这会使 `settings.py` 或其他敏感文件可能被下载。运行 `collectstatic` 会将文件复制到一个目录中，为了安全起见，可以将该目录移出\
  \ Django 项目目录，放到 Web 服务器根目录。\n\n到目前为止，我们已经讨论了使用 `collectstatic` 将静态文件直接复制到 Web 服务器根目录。你也可以让\
  \ Django 将文件复制到中间目录，然后让部署过程将其移动到 CDN 或其他服务器。我们不会详细讨论具体的部署过程；你选择如何将静态文件复制到 Web 服务器将取决于你或你公司现有的设置（例如，持续交付流水线）。\n\
  \n> **注意**\n>\n> `collectstatic` 命令不会考虑静态模板标签的使用。它会收集静态目录中的所有静态文件，即使你的项目没有在模板中包含这些文件。\n\
  \n在下一个练习中，我们将实际操作 `collectstatic` 命令。我们将使用它把到目前为止所有的 `business_site` 静态文件复制到一个临时目录中。\n\
  \n## 练习 5.04 – 为生产环境收集静态文件\n\n虽然本章不涉及部署到 Web 服务器，但我们仍然可以使用 `collectstatic` 管理命令并查看其结果。在本练习中，我们将创建一个临时存放目录，用于将要复制的静态文件。该目录名为\
  \ `static_production_test`，位于 `business_site` 项目目录内。作为部署过程的一部分，你可以将此目录复制到生产 Web\
  \ 服务器。但是，由于我们要到第 17 章《部署 Django 应用程序（第 1 部分 – 服务器设置）》才会设置 Web 服务器，因此我们将只检查其内容，以了解文件是如何复制和组织的：\n\
  \n- 1. 在 PyCharm 中，创建一个临时目录来存放收集的文件。右键单击 `business_site` 项目目录（这是顶层文件夹，而不是 `business_site`\
  \ 模块），然后选择**新建 | 目录**。\n- 2. 在**新建目录**对话框中，输入 `static_production_test`，然后点击**确定**。\n\
  - 3. 打开 `settings.py`，在文件底部为 `STATIC_ROOT` 定义一个新设置。将其设置为你刚创建的目录路径：\n- 4. 在终端中运行\
  \ `collectstatic` 管理命令：\n- 5. 让我们查看 `static_production_test` 目录，检查已创建的内容。该目录的展开视图（来自\
  \ PyCharm 项目页面）如图 5.12 所示，供参考。你的目录应该类似：\n\n```\nSTATIC_ROOT = BASE_DIR / \"static_production_test\"\
  \n```\n\n这将把 `static_dir` 与 `BASE_DIR`（`business_site` 项目路径）连接起来，以生成完整路径。保存 `settings.py`\
  \ 文件。它应类似于：https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter05/Exercise5.04/business_site/business_site/settings.py。\n\
  \n```\npython3 manage.py collectstatic\n```\n\n你应该会看到类似下面的输出：\n\n```\n130 static\
  \ files copied to '/Users/ben/business_site/static_production_test'.\n```\n\n如果你期望它只复制两个文件，这似乎很多，但请记住，它会复制所有已安装应用的所有文件。在这种情况下，由于你安装了\
  \ Django admin 应用，132 个文件中的大部分都是为其提供的。\n\n![](img/4840a43efd335abd10b93708225692d6_258_0.png)\n\
  \n图 5.12 – collectstatic 命令的目标目录\n\n你应该会注意到其中有三项：\n\n- admin 目录：其中包含 Django admin\
  \ 应用的文件。如果查看其内部，你会发现它已按 css、fonts、img 和 js 组织成子文件夹。\n- landing 目录：这是来自 landing 应用的静态目录。里面是\
  \ logo.png 文件。创建此目录是为了与我们之前创建的目录的命名空间匹配。\n- main.css 文件：它来自你的项目静态目录。由于你没有将其放在命名空间目录中，因此它被直接放在\
  \ STATIC_ROOT 内。\n\n如果你愿意，可以打开其中任意文件，验证其内容与你刚刚处理的文件是否一致——它们应该一致，因为它们只是原始文件的副本。\n\
  \n在本练习中，我们收集了 business_site 中的所有静态文件（包括 Django 自带的 admin 静态文件）。它们被复制到由 `STATIC_ROOT`\
  \ 设置定义的目录中（`business_site` 项目目录内的 `static_production_test`）。我们看到 `main.css` 直接位于此文件夹内，但其他静态文件则按命名空间放在其应用目录中（admin\
  \ 和 reviews）。此文件夹本可以复制到生产 Web 服务器来部署我们的项目。\n\n在下一节中，我们将了解如何为每个静态文件目录源添加前缀，以自定义收集后静态文件的组织方式。\n\
  \n## STATICFILES_DIRS 前缀模式\n\n如前所述，`STATICFILES_DIRS` 设置也接受元组形式的条目，格式为 `(prefix,\
  \ directory)`。这些操作模式并不互斥；`STATICFILES_DIRS` 可以同时包含非前缀（字符串）或前缀（元组）条目。本质上，这允许你将某个\
  \ URL 前缀映射到目录。在 Bookr 中，我们没有足够的静态资源需要这样设置，但如果你想以不同方式组织静态资源，这会很有用。例如，你可以将所有图片放在某个目录中，而将所有\
  \ CSS 放在另一个目录中。如果你使用第三方 CSS 生成工具（例如带 LESS 的 Node.js），则可能需要这样做。\n\n> **注意**\n>\n\
  > LESS 是一个使用 Node.js 的 CSS 预处理器。它允许你使用变量和其他原生 CSS 中不存在的类编程概念来编写 CSS。然后 Node.js 会将其编译为\
  \ CSS。更深入的说明超出了本书的范围；只要这样说就足够了：如果你使用它（或类似工具），那么你可能希望直接从其保存编译输出的目录提供文件。\n\n解释前缀模式工作原理的最简单方式是举一个简短示例。这将扩展我们在*练习\
  \ 5.03 – 从项目静态目录提供文件*中创建的 `STATICFILES_DIRS` 设置；不过，这并不是一个练习。在此示例中，将向此设置添加两个带前缀的目录——一个用于提供图片，一个用于提供\
  \ CSS：\n\n```\nSTATICFILES_DIRS = [\n    BASE_DIR / \"static\",\n    (\"images\"\
  , BASE_DIR / \"static_images\"),\n    (\"css\", BASE_DIR / \"static_css\"),\n]\n\
  ```\n\n除了已经无前缀提供的 static 目录外，我们还添加了 `business_site` 项目目录内的 `static_images` 目录来提供文件。它的前缀为\
  \ `images`。我们还添加了 Bookr 项目目录内的 `static_css` 目录来提供文件，前缀为 `css`。\n\n然后，我们可以分别从 static、`static_css`\
  \ 和 `static_images` 目录提供三个文件：`main.js`、`main.css` 和 `main.jpg`。目录布局将如*图 5.13*所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_259_0.png)\n\n图 5.13 – 使用前缀 URL 的目录布局\n\
  \n\n\n\n\n通过 URL 访问这些文件时，映射关系如*图5.14*所示：\n\n![](img/4840a43efd335abd10b93708225692d6_260_0.png)\n\
  \n图5.14 – 根据前缀将 URL 映射到文件\n\nDjango 会将任何带有前缀的静态 URL 路由到与该前缀匹配的目录。\n\n当与 `static`\
  \ 模板标签一起使用时，请使用前缀和文件名，而不是目录名；请看以下示例：\n\n```\n```django\n{% static 'images/main.jpg'\
  \ %}\n```\n```\n\n当使用 `collectstatic` 命令收集静态文件时，它们会被移入 `STATIC_ROOT` 中以前缀名称命名的目录。`STATIC_ROOT`\
  \ 目录内的源路径和目标路径如*图5.15*所示：\n\n![](img/4840a43efd335abd10b93708225692d6_260_1.png)\n\
  \n图5.15 – 从项目目录中的路径到 `STATIC_ROOT` 中路径的映射\n\nDjango 会在 `STATIC_ROOT` 内部创建前缀目录。这样一来，即使使用\
  \ Web 服务器而不通过 Django 进行 URL 查找，路径也能保持一致。\n\n接下来，我们将了解一个管理命令，当静态文件未按预期加载时，它对故障排除非常有用：findstatic。\n\
  \n## findstatic 命令\n\nstaticfiles 应用还提供了另一个管理命令：findstatic。该命令允许你输入静态文件的相对路径（与在\
  \ `static` 模板标签中使用的路径相同），Django 会告诉你该文件位于哪里。它还可以在 verbose 模式下使用，以输出它正在搜索的目录。\n\n\
  > **注意**\n> 你可能不熟悉 verbosity 或 verbose 模式的概念。较高的 verbosity（或直接开启 verbose 模式）会使命令生成更多输出。许多命令行应用程序可以以不同级别的\
  \ verbosity 执行。当你尝试调试正在使用的程序时，这会很有帮助。要查看 verbose 模式的示例，你可以尝试以 verbose 模式运行 Python\
  \  shell。输入 `python -v`（而不是仅输入 `python`）并按回车。Python 将以 verbose 模式启动，并打印出它导入的每个文件的路径。\n\
  \n此命令主要用于调试/故障排除。如果加载了错误的文件，或者找不到特定文件，你可以使用此命令来尝试找出原因。该命令将显示磁盘上正在为特定路径加载哪个文件，或者让你知道找不到该文件以及搜索了哪些目录。\n\
  \n这有助于解决多个文件同名且优先级与你预期不符的问题。你可能还会发现 Django 没有在你期望的目录中搜索该文件，这种情况下，可能需要将静态目录添加到 `STATICFILES_DIRS`\
  \ 设置中。\n\n在下一个练习中，你将执行 findstatic 管理命令，以便熟悉好（文件正确找到）和坏（文件缺失）场景下的输出。\n\n## 练习5.05\
  \ – 使用 findstatic 查找文件\n\n你现在将使用各种选项运行 findstatic 命令，并理解其输出的含义。首先，我们将使用它来查找一个存在的文件，并查看它显示的文件路径。然后，我们将尝试查找一个不存在的文件，并检查输出的错误。接下来，我们将以不同的详细程度和不同的命令交互方式重复此过程。虽然此练习不会对\
  \ Bookr 项目进行更改或推进，但最好熟悉此命令，以防在你自己的 Django 应用程序中需要用到它。让我们开始吧：\n\n- 1. 打开终端，导航到 business_site\
  \ 项目目录。\n- 2. 不带任何选项执行 findstatic 命令。它将输出一些帮助信息，解释其使用方法：\n- 3. 你可以一次查找一个或多个文件。让我们从一个我们知道存在的文件开始：main.css。我们将使用\
  \ findstatic 管理命令在磁盘上定位它，输入以下命令：\n- 4. 让我们尝试查找一个不存在的文件，logo.png：\n\n```\npython3\
  \ manage.py findstatic\n```\n\n将显示以下帮助输出：\n\n```\nusage: manage.py findstatic [-h]\
  \ [--first] [--version] [-v {0,1,2,3}] [--settings SETTINGS] [--pythonpath PYTHONPATH]\
  \ [--traceback] [--no-color] [--force-color] [--skip-checks] staticfile [staticfile\
  \ ...]\nmanage.py findstatic: error: Enter at least one label.\n```\n\n```\npython3\
  \ manage.py findstatic main.css\n```\n\n上述命令输出找到 main.css 的路径：\n\n```\nFound 'main.css'\
  \ here:\n/Users/ben/business_site/static/main.css\n```\n\n你的完整路径会有所不同（除非你也叫 Ben），但你可以看到，当\
  \ Django 在请求中找到 main.css 时，它会从项目的 static 目录加载 main.css 文件。\n\n如果你安装的第三方应用程序没有正确设置静态文件的命名空间，并且与你的某个文件冲突，这将非常有用。\n\
  \n```\npython3 manage.py findstatic logo.png\n```\n\nDjango 将显示一条错误信息，说明无法找到该文件：\n\
  \n```\nNo matching file found for 'logo.png'.\n```\n\nDjango 无法找到此文件，因为我们已经对其进行了命名空间化——我们必须包含完整的相对路径，就像在\
  \ static 模板标签中使用的那样。\n\n- 5. 再次尝试查找 logo.png，但这次使用完整路径：\n\n```\npython3 manage.py\
  \ findstatic landing/logo.png\n```\n\nDjango 现在可以找到该文件了：\n\n```\nFound 'landing/logo.png'\
  \ here:\n/Users/ben/business_site/landing/static/landing/logo.png\n```\n\n- 6. 你可以通过将每个文件作为参数添加来一次查找多个文件：\n\
  \n```\npython3 manage.py findstatic landing/logo.png\nmissing-file.js main.css\n\
  ```\n\n每个文件的位置状态显示如下：\n\n```\nNo matching file found for 'missing-file.js'.\nFound\
  \ 'landing/logo.png' here:\n/Users/ben/business_site/landing/static/landing/logo.png\n\
  Found 'main.css' here:\n/Users/ben/business_site/static/main.css\n```\n\n- 7. 该命令可以以\
  \ 0、1 或 2 的详细程度执行。默认情况下，它以详细程度 1 执行。要设置详细程度，请使用 `--verbosity` 或 `-v` 标志。将详细程度降低到\
  \ 0 只会输出它定位到的路径，而没有任何额外信息。对于缺失的路径，不会显示错误：\n\n```\npython3 manage.py findstatic -v0\
  \ landing/logo.png\nmissing-file.js main.css\n```\n\n输出只显示找到的路径——注意，没有显示缺失文件 missing-file.js\
  \ 的错误：\n\n```\n/Users/ben/business_site/landing/static/landing/logo.png\n/Users/ben/business_site/static/main.css\n\
  ```\n\n如果你将输出通过管道传递给另一个文件或命令，这种详细程度会很有用。\n\n- 8. 要获得关于 Django 正在搜索所请求文件的哪些目录的更多信息，请将详细程度提高到\
  \ 2：\n\n```\n```bash\npython3 manage.py findstatic -v2 landing/logo.png\nmissing-file.js\
  \ main.css\n```\n```\n\n输出包含更多信息，包括为所请求文件搜索过的目录。你可以看到，由于安装了 admin 应用，Django 也在 Django\
  \ admin 应用目录中搜索静态文件：\n\n```\n```text\n(bookr) → business_site python3 manage.py\
  \ findstatic -v2 landing/logo.png missing-file.js main.css\nNo matching file found\
  \ for 'missing-file.js'.\n\nLooking in the following locations:\n    /Users/ben/business_site/static\n\
  \    /Users/ben/.virtualenvs/bookr/lib/python3.9/site-packages/django/contrib/admin/static\n\
  \    /Users/ben/business_site/landing/static\nFound 'landing/logo.png' here:\n \
  \   /Users/ben/business_site/landing/static/landing/logo.png\nLooking in the following\
  \ locations:\n    /Users/ben/business_site/static\n    /Users/ben/.virtualenvs/bookr/lib/python3.9/site-packages/django/contrib/admin/static\n\
  \    /Users/ben/business_site/landing/static\nFound 'main.css' here:\n    /Users/ben/business_site/static/main.css\n\
  Looking in the following locations:\n    /Users/ben/business_site/static\n    /Users/ben/.virtualenvs/bookr/lib/python3.9/site-packages/django/contrib/admin/static\n\
  \    /Users/ben/business_site/landing/static\n```\n```\n\n图5.16 – 以详细程度 2 执行 findstatic，准确显示搜索了哪些目录\n\
  \n`findstatic` 命令并不是你在使用 Django 时会日常使用的命令，但在尝试排查静态文件问题时，了解它很有用。我们看到了命令的输出，存在的文件的完整路径，以及文件不存在时的错误消息。我们还运行该命令并一次提供多个文件，并看到所有文件的信息都输出出来了。最后，我们以不同的详细程度运行了该命令。`-v0`\
  \ 标志抑制了有关缺失文件的错误。`-v1` 是默认值，显示找到的路径和错误。使用 `-v2` 标志提高详细程度，还会打印出正在为特定静态文件搜索的目录。\n\n\
  在下一节中，我们将了解静态文件缓存，以及 Django 如何帮助我们确保用户获得最新版本。\n\n\n\n\n\n## 为最新文件提供服务（用于缓存失效）\n\n\
  如果你不熟悉缓存，其基本思想是某些操作执行起来可能需要很长时间。我们可以通过将操作结果存储在访问速度更快的地方来加快系统速度，这样下次需要时就可以快速检索。耗时较长的“操作”可以是任何东西——一个运行时间很长的函数、一个渲染时间很长的图像，或一个在互联网上下载时间很长的较大资源。我们关注的是最后一种情况。\n\
  \n你可能已经注意到，第一次访问某个网站时加载速度可能很慢，但下一次加载就会快得多。这是因为你的浏览器缓存了一些（或全部）站点加载所需的静态文件。\n\n以我们的业务站点为例，我们有一个页面包含\
  \ `logo.png` 文件。第一次访问业务站点时，我们必须下载动态 HTML，它很小且传输速度很快。我们的浏览器解析 HTML 并看到应包含 `logo.png`\
  \ 文件。然后它也可以下载此文件，该文件要大得多，下载时间可能更长。请注意，此场景假设我们的业务站点现在托管在远程服务器上，而不是本地机器上——后者对我们访问速度非常快。\n\
  \n如果 Web 服务器已正确设置，你的浏览器会将 `logo.png` 存储在你的计算机上。下一次我们访问 *landing* 页面（或确实包含 `logo.png`\
  \ 文件的任何页面）时，我们的浏览器会识别 URL 并可以从磁盘加载文件，而无需再次下载，从而加快浏览体验。\n\n> **注意**\n> 我们说浏览器会在“Web\
  \ 服务器设置正确”的情况下进行缓存。这是什么意思？前端 Web 服务器应配置为在静态文件响应中发送特殊的 HTTP 头。它可以发送 `Cache-Control`\
  \ 头，其值可以是 `no-cache`（文件不应被缓存——也就是说，每次都应请求最新版本）或 `max-age=seconds`（文件只有在上次检索时间超过\
  \ *seconds* 秒后才应再次下载）。响应中还可能包含 `Expires` 头，其值为一个日期。一旦达到此日期，文件就被视为“过期”，此时应请求新版本。\n\
  \n计算机科学中最困难的问题之一是缓存失效。例如，如果我们更改了 `logo.png`，我们的浏览器如何知道应下载新版本？确定其是否已更改的唯一可靠方法是每次都重新下载文件并将其与已保存的版本进行比较。当然，这违背了缓存的初衷，因为我们仍会在文件更改时每次都下载（或不下载）。我们可以缓存任意或服务器指定的时间，但如果在此时间到期前静态文件已更改，我们就不会知道。我们将继续使用旧版本，直到我们认为它已过期，此时才会下载新版本。\n\
  \n如果我们有一周的过期时间，而静态文件在第二天就更改了，我们仍将使用旧文件六天。当然，浏览器可以强制不使用缓存重新加载页面（具体操作方法取决于浏览器；例如 Shift\
  \ + F5 或 Cmd + Shift + R），如果你想强制再次下载所有静态资源。\n\n没有必要尝试缓存我们的动态响应（渲染模板）。由于它们设计为动态，我们希望确保用户在每次页面加载时都能获得最新版本，因此不应缓存它们。它们的大小也相当小（与图像等资源相比），因此缓存它们带来的速度优势不大。\n\
  \nDjango 提供了一个内置解决方案。在 `collectstatic` 阶段，当文件被复制时，Django 可以在其文件名中附加内容的哈希值。例如，源文件\
  \ `logo.png` 将被复制到 `static_production_test/landing/logo.f30ba08c60ba.png`。这仅在使用\
  \ `ManifestFilesStorage` 存储引擎时才会执行。\n\n由于文件名只有在内容更改时才会更改，浏览器将始终下载新内容。\n\n使用 ManifestFilesStorage\
  \ 只是使缓存失效的一种方法。对于你的特定应用程序，可能还有其他更合适的选项。\n\n> **注意**\n> 哈希是一个单向函数，它会生成固定长度的字符串，而与输入的长度无关。有多种不同的哈希函数可用，Django\
  \ 用于内容哈希的是 **MD5**。虽然不再具有加密安全性，但对于此目的已足够。为了说明固定长度的特性，字符串的 MD5 哈希为 `0cc175b9c0f1b6a831c399e269772661`。一个更长字符串的\
  \ MD5 哈希为 `69fc4316c18cdd594a58ec2d59462b97`。它们都长 32 个字符。\n\n你可以通过更改 `settings.py`\
  \ 中的 `STATICFILES_STORAGE` 值来选择存储引擎。这是一个指向要使用的模块和类的带点路径的字符串。实现哈希添加功能的类是 `django.contrib.staticfiles.storage.ManifestStaticFilesStorage`。\n\
  \n使用此存储引擎不需要对 HTML 模板进行任何更改，前提是你使用 `static` 模板标签包含静态资源。Django 会生成一个清单文件（`staticfiles.json`，JSON\
  \ 格式），其中包含原始文件名与哈希文件名之间的映射。它在使用 `static` 模板标签时会自动插入哈希文件名。如果你不使用 `static` 标签包含静态文件，而是手动插入静态\
  \ URL，那么你的浏览器将尝试加载未哈希的路径，并且在缓存应失效时 URL 不会自动更新。\n\n例如，你可以使用 `static` 标签包含 `logo.png`：\n\
  \n```html\n<img src=\"{% static 'reviews/logo.png' %}\">\n```\n\n页面渲染时，将从 `staticfiles.json`\
  \ 中检索最新的哈希，输出将如下所示：\n\n```html\n<img src=\"/static/landing/logo.f30ba08c60ba.png\"\
  >\n```\n\n而如果我们没有使用 `static` 标签，而是硬编码路径，它将始终按原样显示：\n\n```html\n<img src=\"/static/landing/logo.png\"\
  >\n```\n\n由于其中不包含哈希，我们的浏览器将看不到路径的更改，因此永远不会尝试下载新文件。\n\nDjango 在运行 `collectstatic`\
  \ 时会保留带有旧哈希的文件的先前版本，因此如果需要，应用程序的旧版本仍可以引用它。文件的最新版本也会以无哈希形式复制，以便非 Django 应用程序可以在无需查找哈希的情况下引用它。\n\
  \n在下一个练习中，我们将更改项目设置以使用 `ManifestFilesStorage` 引擎，然后运行 `collectstatic` 管理命令。这将像 *练习\
  \ 5.04 – 为生产收集静态文件* 中那样复制所有静态资源；但是，它们现在将在文件名中包含哈希。\n\n### 练习 5.06 – 探索 ManifestFilesStorage\
  \ 存储引擎\n\n在本练习中，你将暂时更新 `settings.py` 以使用 `ManifestFilesStorage`，然后运行 `collectstatic`\
  \ 以查看文件如何生成哈希：\n\n1. 在 PyCharm 中（仍在 `business_site` 项目中），打开 `settings.py` 并在文件底部添加\
  \ `STATICFILES_STORAGE` 设置：\n\n    ```python\n    STATICFILES_STORAGE = \"django.contrib.staticfiles.storage.ManifestStaticFilesStorage\"\
  \n    ```\n\n    完成的 files 应该如下所示：https://github.com/PacktWorkshops/The-Django-Workshop/blob/master/Chapter05/Exercise5.06/business_site/business_site/settings.py。\n\
  \n2. 打开终端，导航到 `business_site` 项目目录，并像之前一样运行 `collectstatic` 命令：\n\n    ```bash\n\
  \    python3 manage.py collectstatic\n    ```\n\n\n\n如果你的 `static_production_test`\
  \ 目录不是空的（在练习 5.04 – 收集生产用静态文件 中文件已被移入该目录，因此很可能不是空的），那么在执行收集时会提示你是否覆盖现有文件：\n\n```\n\
  (bookr) → business_site python3 manage.py collectstatic\n```\n\n```\nYou have requested\
  \ to collect static files at the destination location as specified in your settings:\n\
  ```\n\n```\n/Users/ben/business_site/static_production_test\n```\n\n```\nThis will\
  \ overwrite existing files!\nAre you sure you want to do this?\n```\n\n```\nType\
  \ 'yes' to continue, or 'no' to cancel:\n```\n\n图 5.17 – 静态文件收集时允许覆盖的提示\n\n只需输入\
  \ yes 然后按 Enter 即可允许覆盖。\n\n该命令的输出会告诉你复制了多少个文件，以及有多少个文件被处理并在文件名中添加了哈希：\n\n```\n0\
  \ static files copied to '/Users/ben/business_site/static_production_test', 130\
  \ unmodified, 98 post-processed.\n```\n\n由于自上次运行 collectstatic 以来你没有更改任何文件，因此没有文件被复制。相反，Django\
  \ 会对文件进行后处理（其中 28 个）——即生成它们的哈希并将其附加到文件名。\n\n3. 静态文件已像之前一样被复制到 `static_production_test`\
  \ 目录中；不过，每个文件现在都有两个副本：一个带哈希命名，一个不带哈希。例如，`static/main.css` 已被复制到 `static_production_test/main.856c74fb7029.css`（如果你的\
  \ CSS 文件内容不同，例如有额外的空格或换行符，则文件名可能会不同）：\n\n![](img/4840a43efd335abd10b93708225692d6_269_0.png)\n\
  \n图 5.18 – 带有哈希文件名的展开的 static_production_test 目录\n\n*图 5.18* 显示了展开的 `static_production_test`\
  \ 目录结构。你可以看到每个静态文件的两个副本，以及 `staticfiles.json` 清单文件。以 `logo.png` 为例，你可以看到 `landing/static/landing/logo.png`\
  \ 已被复制到 `static_production_test/landing/logo.ba8d3d8fe184.png`。\n\n让我们修改 `main.css`\
  \ 文件，看看哈希如何变化。\n\n+   4. 在文件末尾添加一些空行并保存它（确保你编辑的是源文件，而不是已复制到 `static_production_test`\
  \ 目录中的文件）。这不会改变 CSS 的效果，但文件内容的更改会影响其哈希值。重新在终端中运行 `collectstatic` 命令：\n\n```\n```bash\n\
  python3 manage.py collectstatic\n```\n```\n\n再次，你可能需要输入 yes 来确认覆盖，这将给出以下输出：\n\n\
  ```\n```\nYou have requested to collect static files at the destination\nlocation\
  \ as specified in your settings:\n\n    /Users/ben/business_site/static_production_test\n\
  \nThis will overwrite existing files!\nAre you sure you want to do this?\n\nType\
  \ 'yes' to continue, or 'no' to cancel: yes\n\n1 static file copied to '/Users/ben/business_site/static_\n\
  production_test', 129 unmodified, 98 post-processed.\n```\n```\n\n由于只有一个文件被更改，因此只有一个静态文件被复制（`main.css`）。\n\
  \n5. 再次查看 `static_production_test` 目录。你应该会看到带有旧哈希的旧文件被保留，并且添加了一个带有新哈希的新文件：\n\n![](img/4840a43efd335abd10b93708225692d6_270_0.png)\n\
  \n图 5.19 – 添加了带有最新哈希的另一个 main.css 文件\n\n在本例中，我们有 `main.856c74fb7029.css`（已存在）、`main.02b59bcc5cd9.css`（新）和\
  \ `main.css`。你的哈希值可能不同。\n\n`main.css` 文件（无哈希）始终包含最新内容——也就是说，`main.02b59bcc5cd9.css`\
  \ 和 `main.css` 文件的内容是相同的。在 collectstatic 执行期间，Django 会复制带哈希的文件，也会复制不带哈希的文件。\n\n\
  6. 现在，检查 Django 生成的 `staticfiles.json` 文件。这是允许 Django 从普通路径查找哈希路径的映射。打开 `static_production_test/staticfiles.json`。所有内容可能都显示在一行中。如果是这样，请从\
  \ View 菜单 | Active Editor | Soft Wrap 启用文本软换行。滚动到文件末尾；你应该会看到 `main.css` 文件的条目；以下是一个示例：\n\
  \n```\n\"main.css\": \"main.02b59bcc5cd9.css\"\n```\n\n这就是 Django 在使用 `static` 模板标签时能够在模板中填充正确\
  \ URL 的方式：通过在此映射文件中查找哈希路径。\n\n7. 我们已经完成了对 `business_site` 的使用，它只是用于测试。你可以删除该项目或保留它以供活动期间参考。\n\
  \n> Note\n> \n> 不幸的是，我们无法检查模板中哈希 URL 的插值方式，因为在调试模式下运行 Django 时，Django 不会查找文件的哈希版本。正如我们所知，Django\
  \ 开发服务器仅在调试模式下运行，因此如果我们关闭调试模式以尝试查看哈希插值，Django 开发服务器将无法启动。你需要在部署到生产环境并使用前端 Web 服务器时自行检查此插值。\n\
  \n在本练习中，我们通过在 settings.py 中添加 STATICFILES_STORAGE 设置，将 Django 配置为对静态文件存储使用 ManifestFilesStorage。然后，我们执行了\
  \ collectstatic 命令，查看哈希是如何生成并添加到复制文件的文件名中的。我们看到了 staticfiles.json 清单文件，它存储了从原始路径到哈希路径的查找。最后，我们清理了本练习和练习\
  \ 5.04 – 收集生产用静态文件 中添加的设置和目录。这些是 STATIC_ROOT 设置、STATICFILES_STORAGE 设置以及 static_production_test\
  \ 目录。\n\n到目前为止，我们只看到了如何定位存储在磁盘上的静态文件。Django 可以被定制为定位存储在其他位置的静态文件（例如云中）。在下一节中，我们将简要介绍如何使用自定义存储引擎。\n\
  \n## Custom storage engines\n\n在上一节中，我们将存储引擎设置为 ManifestFilesStorage。该类由 Django\
  \ 提供，但也可以编写自定义存储引擎。例如，你可以编写一个存储引擎，在运行 collectstatic 时将静态文件上传到 CDN、Amazon S3 或 Google\
  \ Cloud 存储桶。\n\n编写自定义存储引擎超出了本书的范围。已经存在第三方库支持上传到各种云服务。其中一个库是 Django Storages，可以在\
  \ https://django-storages.readthedocs.io/ 找到。\n\n以下代码是一个简短的骨架，指示你应实现哪些方法来创建自定义文件存储引擎：\n\
  \n```\nfrom django.conf import settings\nfrom django.contrib.staticfiles import\
  \ storage\n\nclass CustomFilesStorage(storage.StaticFilesStorage):\n    def __init__(self):\n\
  \        \"\"\"The class must be able to be instantiated\n        without any arguments.\n\
  \        Create custom settings in settings.py and read them\n        instead.\"\
  \"\"\n```\n\n```\nself.setting = settings.CUSTOM_STORAGE_SETTING\n```\n\n你定义的类型（在本例中称为\
  \ CustomFilesStorage）必须能够在没有任何参数的情况下实例化。__init__ 函数必须能够从全局标识符（在本例中来自 Django 设置）加载任何设置：\n\
  \n```\ndef delete(self, name):\n    \"\"\"Implement delete of the file from the\
  \ remote service.\"\"\"\n```\n\ndelete 方法应能够从远程服务中删除由 name 参数指定的文件：\n\n```\ndef\
  \ exists(self, name):\n    \"\"\"Return True if a file with name exists in the remote\
  \ service.\"\"\"\n```\n\nexists 方法应查询远程服务以检查指定名称的文件是否存在。如果文件存在则返回 True，如果不存在则返回\
  \ False：\n\n```\ndef listdir(self, path):\n    \"\"\"List a directory in the remote\
  \ service. Return should be a 2-tuple of lists, the first a list of directories,\
  \ the second a list of files.\"\"\"\n```\n\nlistdir 方法应查询远程服务以列出 path 处的目录。然后它应返回一个二元组列表。该元组的第一个元素是\
  \ path 内部的目录列表，而第二个元素是文件列表；以下是一个示例：\n\n```\nreturn ([\"directory1\", \"directory2\"\
  ], [\"main.css\", \"document.txt\", \"image.jpg\"])\n```\n\n如果 path 不包含任何目录或不包含任何文件，则应为该元素返回空列表。如果目录为空，则应返回两个空列表：\n\
  \n```\ndef size(self, name):\n    \"\"\"Return the size in bytes of the file with\
  \ name.\"\"\"\n```\n\n\n\n\n\nThe size method should query the remote service and\
  \ get the size of the file specified by name:\n\n```\ndef url(self, name):\n   \
  \ \"\"\"Return the URL where the file of with name can be access on the remote service.\
  \ For example, this might be URL of the file after it has been uploaded to a specific\
  \ remote host with a specific domain.\"\"\"\n```\n\nThe url method should determine\
  \ the URL to access the file specified by name. This can be built by appending name\
  \ to a specific static hosting URL:\n\n```\ndef _open(self, name, mode=\"rb\"):\n\
  \    \"\"\"Return a File-like object pointing to file with name. For example, this\
  \ could be a URL handle for a remote file.\"\"\"\n```\n\nThe _open method will provide\
  \ a handle remote file, specified by name. How you implement this will depend on\
  \ the type of remote service. You might have to download the file and then use a\
  \ memory buffer (such as an io.BytesIO object) to simulate opening the file:\n\n\
  ```\ndef _save(self, name, content):\n    \"\"\"Write the content for a file with\
  \ name. In this method you might upload the content to a remote service.\"\"\"\n\
  ```\n\nThe _save method should save content to the remote file at name. The method\
  \ of implementing this will depend on your remote service. It might transfer the\
  \ file over SFTP, or upload it to a CDN.\n\nWhile this example does not implement\
  \ any transferring to or from a remote service, you can refer to it to get an idea\
  \ of how to implement a custom storage engine.\n\nAfter implementing your custom\
  \ storage engine, you can make it active by setting its dotted module path in the\
  \ STATICFILES_STORAGE setting in settings.py.\n\nYou’ll now work on the first activity\
  \ in this chapter. In this activity, you’ll add a static logo image to the Bookr\
  \ application. The logo will be displayed in the Reviews section of the website.\n\
  \n## Activity 5.01 – adding a Reviews logo\n\nThe Bookr app should have a logo that\
  \ is specific to pages in the Reviews app. This will involve adding a base template\
  \ just for the Reviews app and updating our current Reviews templates to inherit\
  \ from it. Then, you'll include the Bookr Reviews logo on this base template.\n\n\
  These steps will help you complete this activity:\n\n- 1. Add a CSS rule to position\
  \ the logo. Put this rule into the existing `base.html` file, after the `.navbar-brand`\
  \ rule:\n  ```\n  .navbar-brand > img {\n    height: 60px;\n  }\n  ```\n- 2. Add\
  \ a `brand` block template tag that inheriting templates can override. Put this\
  \ inside the `<a>` element with the `navbar-brand` class. The default contents of\
  \ `block` should be left as *Book Review*.\n- 3. Add a static directory inside the\
  \ Reviews app, containing a namespaced directory. Download the Reviews `logo.png`\
  \ file from `https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter05/Activity5.01/bookr/reviews/static/reviews/logo.png`\
  \ and put it inside this directory.\n- 4. Create a `templates` directory for the\
  \ Bookr project (inside the Bookr project directory). Then, move the Reviews app's\
  \ current `base.html` into this directory so that it becomes a base template for\
  \ the whole project.\n- 5. Add the new `templates` directory's path to the `TEMPLATES[\"\
  DIRS\"]` setting in `settings.py`.\n- 6. Create another `base.html` template specifically\
  \ for the Reviews app. Put it inside the Reviews app's `templates` directory. The\
  \ new template should extend the existing (now global) `base.html` file.\n- 7. The\
  \ new `base.html` file should override the content of the `brand` block. This block\
  \ should contain just a `<img>` whose `src` attribute is set using the `{% static\
  \ %}` template tag. The image source should be the logo we added in *Step 2*.\n\n\
  ```\n.navbar-brand > img {\n  height: 60px;\n}\n```\n\nRefer to the following screenshots\
  \ to see what your pages should look like after these changes. Note that although\
  \ you are making changes to the base template, it will not change the layout of\
  \ the main page:\n\n![](img/4840a43efd335abd10b93708225692d6_275_0.png)\n\nFigure\
  \ 5.20 – The Book List page after adding the Reviews logo\n\nOn the **Book Details**\
  \ page, you will also see the Reviews logo:\n\n![](img/4840a43efd335abd10b93708225692d6_276_0.png)\n\
  \nFigure 5.21 – The Book Details page after adding the Reviews logo\n\n> **Note**\n\
  > The solution for this activity can be found on https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions.\n\
  \n## Activity 5.02 – CSS enhancements\n\nCurrently, the CSS is kept inline in the\
  \ base.html template. As a best practice, it should be moved into its own file so\
  \ that it can be cached separately and decrease the size of the HTML downloads.\
  \ As part of this, you’ll also add some CSS enhancements such as fonts and colors,\
  \ and link in Google Fonts CSS to support these changes.\n\nThese steps will help\
  \ you complete this activity:\n\n- 1. Create a directory named `static` in the Bookr\
  \ project directory. Then, create a new file inside it named `main.css`.\n- 2. Copy\
  \ the contents of the `<style>` element from the main `base.html` template into\
  \ the new `main.css` file, then remove the `<style>` element from the template.\
  \ Add these extra rules to the end of the CSS file:\n  ```\n  body {\n      font-family:\
  \ 'Source Sans Pro', sans-serif;\n      background-color: #e6efe8\n      color:\
  \ #393939;\n  }\n  \n  h1, h2, h3, h4, h5, h6 {\n      font-family: 'Libre Baskerville',\
  \ serif;\n  }\n  ```\n- 3. Link to the new `main.css` file with a `<link rel=\"\
  stylesheet\" href=\"...\">` tag. Use the `{% static %}` template tag to generate\
  \ the URL for the href attribute, and don't forget to load the `static` library.\n\
  - 4. Link in the Google Fonts CSS by adding this code to the base template:\n  ```\n\
  \  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css?family=Libre+Baskerville|Source+Sans+Pro&display=swap\"\
  >\n  ```\n\n(You will need to have an active internet connection so that your browser\
  \ can include this remote CSS file.)\n\n5. Update your Django settings to add `STATICFILES_DIRS`,\
  \ which is set to the static directory you created in *Step 1*. When you’re finished,\
  \ your Bookr application should look like *Figure 5.22*:\n\n![](img/4840a43efd335abd10b93708225692d6_278_0.png)\n\
  \nFigure 5.22 – Main page with a new font and background color\n\nNotice the new\
  \ font and background color. These should be displayed on all the Bookr pages.\n\
  \n> **Note**\n> \n> The solution for this activity can be found on `https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions`.\n\
  \n## Activity 5.03 – adding a global logo\n\nYou have already added a logo that\
  \ is served on pages for the Reviews app. We have another logo to be used globally\
  \ by default, but other apps will be able to override it:\n\n- 1. Download the Bookr\
  \ logo (`logo.png`) from `https://raw.githubusercontent.com/PacktPublishing/Web-Development-with-Django-Second-Edition/main/Chapter05/Activity5.03/bookr/static/logo.png`.\n\
  - 2. Save it in the main static directory for the project.\n- 3. Edit the main `base.html`\
  \ file. We already have a block for the logo (brand), so a `<img>` can be placed\
  \ inside here. Use the `static` template tag to refer to the logo you just downloaded.\n\
  - 4. Check that your pages work. On the main URL, you should see the Bookr logo,\
  \ but on the **Book List** and **Book Details** pages, you should see the Bookr\
  \ Reviews logo.\n\nWhen you’re finished, you should see the Bookr logo on the main\
  \ page:\n\n![](img/4840a43efd335abd10b93708225692d6_279_0.png)\n\nFigure 5.23 –\
  \ Bookr logo on the main page\n\nWhen you visit a page that had the Bookr Reviews\
  \ logo before, such as the **Book List** page, it should still show the Bookr Reviews\
  \ logo:\n\n![](img/4840a43efd335abd10b93708225692d6_279_1.png)\n\nFigure 5.24 –\
  \ Bookr Reviews logo still appears on the Reviews pages\n\nNote\nThe solution for\
  \ this activity can be found on https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions.\n\
  \n## Summary\n\nIn this chapter, we showed you how to use Django’s staticfiles app\
  \ to find and serve static files. We used the built-in static view to serve these\
  \ files with the Django dev server in DEBUG mode. We showed different places to\
  \ store static files by using a directory that is global to the project or in a\
  \ specific directory for the application; global resources should be stored in the\
  \ former while application-specific resources should be stored in the latter. We\
  \ showed the importance of namespacing static file directories to prevent conflicts.\
  \ After serving the assets, we used the static tag to include them in our template.\
  \ We then demoed how the collectstatic command copies all the assets into the STATIC_ROOT\
  \ directory, for production deployment. We showed how to use the findstatic command\
  \ to debug the loading of static files. To invalidate caches automatically, we looked\
  \ at using ManifestFilesStorage to add a hash of the file’s content to the static\
  \ file URL. Finally, we briefly talked about using a custom file storage engine.\n\
  \nSo far, we have only fetched web pages using content that already exists. In the\
  \ next chapter, we will start adding forms so that we can interact with web pages\
  \ by sending data to them over HTTP.\n\n\n\n\n"
- "## Forms\n\n本章介绍网页表单，这是一种将信息从浏览器发送到 Web 服务器的方法。我们将先介绍表单的一般概念，并讨论数据如何被编码以发送到服务器。\n\
  \n到目前为止，我们为 Django 构建的视图都是单向的。我们的浏览器正在从我们编写的视图中检索数据，但它不会向这些视图发送任何数据。在第 4 章《Django\
  \ 管理员简介》中，我们通过使用 Django 管理员并提交表单来创建模型实例，但这些表单使用的是 Django 内置的视图，而不是我们自己创建的。在本章中，我们将使用\
  \ Django Forms 库开始接收用户提交的数据。数据将通过 URL 参数中的 GET 请求和/或请求体中的 POST 请求提供。但在深入细节之前，先让我们了解\
  \ Django 中的表单是什么。你将了解到在 GET HTTP 请求中发送表单数据与在 POST HTTP 请求中发送表单数据的区别，以及如何选择使用哪一种。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 什么是表单？\n- Django Forms 库\n- 验证表单并检索 Python 值\n- 活动 1 – 书籍搜索\n\
  \n到本章结束时，你将学会 Django 的 Forms 库如何用于自动构建和验证表单，以及它如何减少需要手动编写的 HTML 数量。\n\n### 技术要求\n\
  \n本章的完整代码文件可在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter06\
  \ 获取。\n\n### What is a form?\n\n在使用交互式 Web 应用时，我们不仅希望向用户提供数据，还希望从用户那里接受数据，以定制我们生成的响应，或让他们向网站提交数据。在浏览网页时，你肯定使用过表单。无论你是否登录到网上银行账户、使用浏览器冲浪、在社交媒体上发布消息，或向在线邮件客户端写邮件，在所有这些情况下，你都在表单中输入数据。表单由输入组成，这些输入定义了要提交到服务器的数据的键值对。例如，登录网站时发送的数据将具有键\
  \ *username* 和 *password*，值分别为你的用户名和你的密码。我们将在后面的部分更详细地介绍不同类型的输入。表单中的每个输入都有一个 *name*，这就是服务器端（在\
  \ Django 视图中）识别其数据的方式。可以有多个具有相同 *name* 的输入，其数据以包含该名称的所有已发布值的列表形式提供——例如，具有要应用于用户的权限的复选框列表。每个复选框将具有相同的名称但不同的值。表单具有属性，指定浏览器应将数据提交到哪个\
  \ URL 以及应使用什么方法提交数据（浏览器仅支持 *GET* 或 *POST*）。\n\n以下图所示的 GitHub 登录页面就是一个表单的示例：\n\n\
  ![](img/4840a43efd335abd10b93708225692d6_282_0.png)\n\n图 6.1：GitHub 登录页面是表单的一个示例\n\
  \n它有三个可见的输入：一个文本字段（**用户名或电子邮件地址**）、一个密码字段（**密码**）和一个提交按钮（**登录**）。它还有一个不可见的字段——其类型为隐藏，包含用于安全性的特殊令牌，称为\
  \ CSRF 令牌。我们将在本章后面讨论这个问题。当你点击 **登录** 按钮时，表单数据将通过 *POST* 请求提交。如果输入了有效的用户名和密码，你将被登录；否则，表单将显示错误，如下所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_283_0.png)\n\n图 6.2：使用错误的用户名或密码提交的表单\n\
  \n表单可以有两种状态：提交前和提交后。第一种是页面首次加载时的初始状态。所有字段都将具有默认值（通常为空），并且不会显示错误。如果输入到表单中的所有信息都是有效的，那么通常在提交后，你将被带到显示提交结果的页面。这可能是搜索结果页面或显示你创建的新对象的页面。在这种情况下，你将看不到表单的提交后状态。\n\
  \n如果你没有输入有效的信息到表单中，那么它将被再次渲染为提交后状态。在此状态下，你将看到你输入的信息，以及任何错误以帮助你解决表单问题。这些错误可能是字段错误或非字段错误。字段错误适用于特定字段——例如，留下必填字段空白或输入的值过大、过小、过长或过短。如果表单要求你输入姓名而你留空，这将显示为该字段旁边的字段错误。\n\
  \n非字段错误要么不适用于某个字段，要么适用于多个字段，并在表单顶部显示。在前面的图中，我们可以看到一条消息，提示用户名或密码可能不正确以登录。出于安全原因，GitHub\
  \ 不会透露用户名是否有效，因此这显示为非字段错误，而不是用户名或密码的字段错误（Django 也遵循此约定）。非字段错误也适用于相互依赖的字段。例如，在信用卡表单上，如果付款被拒绝，我们可能不知道信用卡号码或安全码是否不正确；因此，我们不能在特定字段上显示该错误。它适用于整个表单。\n\
  \n让我们从表单元素本身开始，查看 HTML 表单的不同部分。\n\n### The form element\n\n所有在表单提交期间使用的输入都必须包含在\
  \ `<form>` 元素内。有三个 HTML 属性你必须使用来修改表单的行为：\n\n- `method`\n  这是提交表单的 HTTP 方法；要么是 `get`\
  \ 要么是 `post`。如果省略，则默认为 `get`（因为这是你在浏览器中输入 URL 并按 *Enter* 时的默认方法）。\n- `action`\n\
  \  这是指发送表单数据到的 URL（或路径）。如果省略，数据将被发送回当前页面。\n- `enctype`\n  这设置表单的编码类型。你只有在使用表单上传文件时才需要更改此设置。最常见的值是\
  \ `application/x-www-form-urlencoded`（如果省略此值时的默认值）或 `multipart/form-data`（如果你上传文件则设置此值）。请注意，你不必担心视图中的编码类型——Django\
  \ 会自动处理不同类型。\n\n以下是未设置任何属性的表单示例：\n\n```\n<form>\n    <!-- Input elements go here\
  \ -->\n</form>\n```\n\n它将使用 GET 请求向表单显示的当前 URL 提交其数据，使用 `application/x-www-form-urlencoded`\
  \ 编码类型。\n\n在下面的示例中，我们将在表单上设置全部三个属性：\n\n```\n<form method=\"post\" action=\"/form-submit\"\
  \nenctype=\"multipart/form-data\">\n    <!-- Input elements go here -->\n</form>\n\
  ```\n\n此表单将使用 POST 请求向 /form-submit 路径提交其数据，将数据编码为 multipart/form-data。\n\nGET 和\
  \ POST 请求在数据发送方式上有什么不同？回想一下第 1 章《Django 简介》中，我们讨论了浏览器发送的底层 HTTP 请求和响应数据是什么样的。在接下来的两个示例中，我们将两次提交相同的表单，第一次使用\
  \ GET，第二次使用 POST。表单将有两个输入：名字和姓氏。\n\n使用 GET 提交的表单会像这样在 URL 中发送其数据：\n\n```\nGET /form-submit?first_name=Joe&last_name=Bloggs\
  \ HTTP/1.1\nHost: www.example.com\n```\n\n而使用 POST 提交的表单会像这样在请求体中发送其数据：\n\n```\n\
  POST /form-submit HTTP/1.1\nHost: www.example.com\nContent-Length: 31\nContent-Type:\
  \ application/x-www-form-urlencoded\n\nfirst_name=Joe&last_name=Bloggs\n```\n\n\
  你会注意到，在这两种情况下，表单数据都被编码相同；只是对于 GET 和 POST 请求放置的位置不同。在“在 GET 或 POST 之间选择”部分，我们将讨论如何在这两种类型的请求之间进行选择。\n\
  \n### Types of inputs\n\n到目前为止，我们已经看到了四种输入的示例（文本、密码、提交和隐藏）。大多数输入都是使用 <input> 标签创建的，其类型通过其\
  \ type 属性指定。每个输入都有一个 name 属性，定义了发送到服务器的 HTTP 请求中的键值对的键。\n\n在下一个练习中，我们将看看如何用 HTML\
  \ 构建一个表单。这将使你能够熟悉许多不同的表单字段。\n\n\n\n\n## 练习 6.01 – 用 HTML 构建表单\n\n在本章的前几个练习中，我们需要一个\
  \ HTML 表单来进行测试。我们将在本练习中手动编写一个。这也能让你体验不同字段是如何被验证和提交的。我们将在一个新的 Django 项目中完成此操作，以免干扰\
  \ Bookr。你可以参考第 1 章来回顾如何创建一个 Django 项目：\n\n1. 我们先创建新的 Django 项目。你可以复用已经安装了 Django\
  \ 的 Bookr 虚拟环境。打开一个新终端并激活虚拟环境。然后使用 django-admin 启动一个名为 form_project 的 Django 项目。为此，运行以下命令：\n\
  \n```\ndjango-admin startproject form_project\n```\n\n这将在名为 form_project 的目录中搭建\
  \ Django 项目。\n\n2. 使用 startapp 管理命令在此项目中创建一个新的 Django 应用。该应用应命名为 form_example。为此，先\
  \ cd 进入 form_project 目录，然后运行以下命令：\n\n```\npython3 manage.py startapp form_example\n\
  ```\n\n这将在 form_project 目录内创建 form_example 应用目录。\n\n3. 启动 PyCharm，然后打开 form_project\
  \ 目录。如果你已经有打开的项目，可以通过选择 File -> Open 来完成；否则，只需在 Welcome to PyCharm 窗口中点击 Open。导航到\
  \ form_project 目录，选中它，然后点击 Open。\n\n如果出现提示，请务必选择 Trust Project。\n\nform_project\
  \ 项目窗口应如下所示：\n\n![](img/4840a43efd335abd10b93708225692d6_286_0.png)\n\n图 6.3：form_project\
  \ 项目已打开\n\n4. 创建一个新的运行配置，为项目执行 manage.py runserver。你可以再次复用 Bookr 虚拟环境。完成后，Run/Debug\
  \ Configurations 窗口应类似于下图：\n\n![](img/4840a43efd335abd10b93708225692d6_287_0.png)\n\
  \n图 6.4：Runserver 的 Run/Debug Configurations\n\n你可以通过点击 Run 按钮，然后在浏览器中访问 http://127.0.0.1:8000/\
  \ 来测试配置是否正确。你应该会看到 Django 欢迎屏幕。如果调试服务器无法启动，或者你看到的是 Bookr 主页，那么你可能还有 Bookr 项目在运行。试着停止\
  \ Bookr 的 runserver 进程，然后启动你刚刚设置的新进程。\n\n5. 打开 form_project 目录中的 settings.py，并将\
  \ \"form_example\" 添加到 INSTALLED_APPS 设置中。\n\n6. 设置这个新项目的最后一步是为 form_example 应用创建一个\
  \ templates 目录。右键点击 form_example 目录，然后选择 New | Directory。将其命名为 templates。\n\n7.\
  \ 我们需要一个 HTML 模板来显示我们的表单。右键点击你刚刚创建的 templates 目录，然后选择 New | HTML File 来创建一个。\n\n\
  在出现的对话框中，输入名称 form-example.html 并按 Enter 创建它。\n\n8. form-example.html 文件现在应该已经在\
  \ PyCharm 的编辑窗格中打开了。首先创建 form 元素。我们将把它的 method 属性设置为 post。action 属性将被省略，这意味着表单将提交回加载它的同一个\
  \ URL。\n\n将这段代码插入到 <body> 和 </body> 标签之间：\n\n```\n<form method=\"post\">\n</form>\n\
  ```\n\n9. 现在，让我们添加一些输入字段。为了在每个输入之间添加一点间距，我们将它们包裹在 <p> 标签中。我们先从一个文本字段和一个密码字段开始。这段代码应该插入到你刚刚创建的\
  \ <form> 标签之间：\n\n```\n<p>\n    <label for=\"id_text_input\">Text Input</label><br>\n\
  \    <input id=\"id_text_input\" type=\"text\"\n        name=\"text_input\" value=\"\
  \" placeholder=\n        \"Enter some text\">\n</p>\n<p>\n    <label for=\"id_password_input\"\
  >Password Input\n    </label><br>\n    <input id=\"id_password_input\" type=\"password\"\
  \n        name=\"password_input\" value=\"\" placeholder=\"Your\n        password\"\
  >\n</p>\n```\n\n10. 接下来，我们将添加两个复选框和三个单选按钮。在你在上一步中添加的 HTML 之后插入这段代码；它应该出现在 </form>\
  \ 标签之前：\n\n```\n<p>\n    <input id=\"id_checkbox_input\" type=\"checkbox\"\n   \
  \     name=\"checkbox_on\" value=\"Checkbox Checked\"\n        checked>\n    <label\
  \ for=\"id_checkbox_input\">Checkbox</label>\n</p>\n<p>\n    <input id=\"id_radio_one_input\"\
  \ type=\"radio\"\n```\n\n```\n```html\nname=\"radio_input\" value=\"Value One\"\
  >\n<label for=\"id_radio_one_input\">Value One</label>\n<input id=\"id_radio_two_input\"\
  \ type=\"radio\"\n    name=\"radio_input\" value=\"Value Two\" checked>\n<label\
  \ for=\"id_radio_two_input\">Value Two</label>\n<input id=\"id_radio_three_input\"\
  \ type=\"radio\"\n    name=\"radio_input\" value=\"Value Three\">\n<label for=\"\
  id_radio_three_input\">Value Three\n</label>\n</p>\n```\n```\n\n11. 接下来是一个下拉选择菜单，用于选择最喜欢的书。将这段代码添加在上一步的代码之后，但在\
  \ `</form>` 标签之前：\n\n```\n```html\n<p>\n    <label for=\"id_favorite_book\">Favorite\
  \ Book\n    </label><br>\n    <select id=\"id_favorite_book\" name=\n        \"\
  favorite_book\">\n        <optgroup label=\"Non-Fiction\">\n            <option\
  \ value=\"1\">Deep Learning with\n                Keras</option>\n            <option\
  \ value=\"2\">Web Development with\n                Django</option>\n        </optgroup>\n\
  \        <optgroup label=\"Fiction\">\n            <option value=\"3\">Brave New\
  \ World</option>\n            <option value=\"4\">The Great\n                Gatsby</option>\n\
  \        </optgroup>\n    </select>\n</p>\n```\n```\n\n它会显示四个选项，分为两组。用户将只能选择一个选项。\n\
  \n12. 接下来是一个多选列表（通过 multiple 属性实现）。将这段代码添加在上一步的代码之后，但在 </form> 标签之前：\n\n```\n<p>\n\
  \    <label for=\"id_books_you_own\">Books You Own</label><br>\n    <select id=\"\
  id_books_you_own\" name=\"books_you_own\" multiple>\n        <optgroup label=\"\
  Non-Fiction\">\n            <option value=\"1\">Deep Learning with Keras</option>\n\
  \            <option value=\"2\">Web Development with Django</option>\n        </optgroup>\n\
  \        <optgroup label=\"Fiction\">\n            <option value=\"3\">Brave New\
  \ World</option>\n            <option value=\"4\">The Great Gatsby</option>\n  \
  \      </optgroup>\n    </select>\n</p>\n```\n\n用户可以从四个选项中选择零个或多个。它们显示为两组。\n\n13.\
  \ 接下来是一个 textarea。它类似于文本字段，但有多行。与前面的步骤一样，这段代码应该添加在结束的 </form> 标签之前：\n\n```\n<p>\n\
  \    <label for=\"id_text_area\">Text Area</label><br>\n    <textarea name=\"text_area\"\
  \ id=\"id_text_area\" placeholder=\"Enter multiple lines of text\">\n    </textarea>\n\
  </p>\n```\n\n14. 接下来，我们将添加一些用于特定数据类型的字段：数字、电子邮件和日期输入。把所有这些添加到 </form> 标签之前：\n\n\
  ```\n<p>\n    <label for=\"id_number_input\">Number Input</label><br>\n    <input\
  \ id=\"id_number_input\" type=\"number\"\n        name=\"number_input\" value=\"\
  \" step=\"any\"\n        placeholder=\"A number\">\n</p>\n<p>\n    <label for=\"\
  id_email_input\">Email Input</label><br>\n    <input id=\"id_email_input\" type=\"\
  email\"\n        name=\"email_input\" value=\"\" placeholder=\"Your\n        email\
  \ address\">\n</p>\n<p>\n    <label for=\"id_date_input\">Date Input</label><br>\n\
  \    <input id=\"id_date_input\" type=\"date\"\n        name=\"date_input\" value=\"\
  2019-11-23\">\n</p>\n```\n\n15. 现在我们将添加一些按钮来提交表单。同样，在结束的 </form> 标签之前插入：\n\n```\n\
  <p>\n    <input type=\"submit\" name=\"submit_input\"\n        value=\"Submit Input\"\
  >\n</p>\n<p>\n    <button type=\"submit\" name=\"button_element\"\n        value=\"\
  Button Element\">Button With<strong>\n        Styled</strong> Text\n    </button>\n\
  </p>\n```\n\n这将演示创建提交按钮的两种方式：作为 <input> 或 <button>。\n\n16. 最后，我们将添加一个隐藏字段。在结束的 </form>\
  \ 标签之前插入：\n\n```\n<input type=\"hidden\" name=\"hidden_input\" value=\"Hidden Value\"\
  >\n```\n\n这个字段无法被看到或编辑，因此它有一个固定的值。\n\n你现在可以保存并关闭 form-example.html 了。\n\n17. 与任何模板一样，除非我们有一个视图来渲染它，否则我们无法看到它。打开\
  \ form_example 应用的 views.py 文件，并添加一个名为 form_example 的新视图。它应该渲染并返回你刚刚创建的模板，如下所示：\n\
  \n```\ndef form_example(request):\n    return render(request, \"form-example.html\"\
  )\n```\n\n你现在可以保存并关闭 views.py 了。\n\n18. 现在你应该熟悉下一步了，那就是为视图添加一个 URL 映射。打开 form_project\
  \ 包目录中的 urls.py 文件。将 form-example 路径到你的 form_example 视图的映射添加到 urlpatterns 变量中。它应该看起来像这样：\n\
  \n```\npath('form-example/', form_example.views.form_example)\n```\n\n确保你还要添加 form_example.views\
  \ 的导入。保存并关闭 urls.py。\n\n19. 启动 Django 开发服务器（如果它还没有运行），然后在你的浏览器中加载你的新视图；地址是 http://127.0.0.1:8000/form-example/。你的页面应该看起来像这样：\n\
  \n\n\n![](img/4840a43efd335abd10b93708225692d6_294_0.png)\n\nFigure 6.7: CSRF verification\
  \ error\n\n20. If you do receive an error, just go **Back** in your browser to return\
  \ to the input example page.\n\nIn this exercise, you created an example page showcasing\
  \ many HTML inputs, then created a view to render it and a URL to map to it. You\
  \ loaded the page in your browser and experimented with changing data and trying\
  \ to submit the form when it contained errors.\n\nWe just saw an example of Django’s\
  \ CSRF protection. In the next section, we’ll learn what CSRF is and how Django’s\
  \ protection works.\n\n## Form security with Cross-Site Request Forgery Protection\n\
  \nThroughout this book, we have mentioned features that Django includes to prevent\
  \ certain types of security exploits. One of these features is protection against\
  \ **Cross-Site Request Forgery (CSRF)**.\n\nThe CSRF attack exploits the fact that\
  \ a form on a website can be submitted to any other website. The `action` attribute\
  \ of this form just needs to be set appropriately. Let’s look at an example for\
  \ Bookr. We don’t have this set up yet, but we will be adding a view and a URL that\
  \ allows us to post a review for a book. To do this, we’ll have a form for posting\
  \ the review content and selecting the rating. Its HTML is like this:\n\n```\n```html\n\
  <form method=\"post\" action=\"http://127.0.0.1:8000/books/4/reviews/\">\n    <p>\n\
  \        <label for=\"id_review_text\">Your Review\n```\n```\n\n```\n```html\nplaceholder=\"\
  Enter your review\"></textarea>\n</p>\n<p>\n    <label for=\"id_rating\">Rating</label><br/>\n\
  \    <input id=\"id_rating\" type=\"number\" name=\"rating\"\n        placeholder=\"\
  Rating 1-5\">\n</p>\n<p>\n    <button type=\"submit\">Enter My Website</button>\n\
  </p>\n</form>\n```\n```\n\nWhen the template gets rendered, the template tag is\
  \ interpolated, so the output HTML ends up like this (note that the inputs are still\
  \ in the output – they have just been removed here for brevity):\n\n```\n```html\n\
  <form method=\"post\" action=\n\"http://127.0.0.1:8000/books/4/reviews/\">\n   \
  \ <input type=\"hidden\" name=\"csrfmiddlewaretoken\"\n        value=\"tETZjLDUxEv1tiYqGCSbMQkhWiesHCnutxpt6mutHI6YH6\n\
  4F0nin5k2JW3B68IeJ\">\n    ...\n\n</form>\n```\n```\n\nSince this is a hidden field,\
  \ the form on the page does not look any different from how it did before.\n\nThe\
  \ CSRF token is unique to every visitor on the site. If an attacker were to copy\
  \ the HTML from our site, they would get their own CSRF token, which would not match\
  \ that of any other user, so Django would reject the form when it was posted by\
  \ someone else.\n\nCSRF tokens also change periodically. This limits how long the\
  \ attacker would have to take advantage of a particular user and token combination.\
  \ Even if they were able to get the CSRF token of a user that they were trying to\
  \ exploit, they would have a short window of time to use it.\n\nNow that you know\
  \ what a CSRF token is used for, we will be adding it to our example form in the\
  \ next exercise. Before we get to that, let’s have a quick refresh about accessing\
  \ data in a request using QueryDict objects.\n\n## Accessing data in the View\n\n\
  As we discussed in Chapter 1, Django provides two QueryDict objects on the HTTPRequest\
  \ instances that are passed to the view function. These are request.GET, which contains\
  \ parameters passed in the URL, and request.POST, which contains parameters in the\
  \ HTTP request body. Even though request.GET has GET in its name, this variable\
  \ is populated even for non-GET HTTP requests. This is because the data it contains\
  \ is parsed from the URL. Since all HTTP requests have a URL, all HTTP requests\
  \ may contain GET data, even if they are POST or PUT, and so on.\n\nIn the next\
  \ exercise, we will add code to our view to read and display the POST data.\n\n\
  ## Exercise 6.02 – working with POST data in a view\n\nWe will now add some code\
  \ to our example view to print out the received POST data to the console. We will\
  \ also insert the HTTP method that was used to generate the page, into the HTML\
  \ output. This will allow us to be sure of what method was used to generate the\
  \ page (GET or POST) and see how the form differs for each type:\n\n+   1. First,\
  \ in PyCharm, open the form_example app’s views.py file. Alter the form_example\
  \ view so that it prints each value in the POST to the console by adding this code\
  \ inside the function:\n\n```\nfor name in request.POST:\n    print(\"{}\": {}\"\
  .format(name,\n        request.POST.getlist(name)))\n```\n\nThis code iterates over\
  \ each key in the request POST data’s QueryDict and prints the key and list of values\
  \ to the console. We already know that each QueryDict can have multiple values for\
  \ a key, so we use the getlist function to get them all.\n\n+   2. Pass the template’s\
  \ request.method into a context variable named method. Do this by updating the call\
  \ to render in the view so that it’s like this:\n\n```\nreturn render(request, \"\
  form-example.html\", {\"method\":\nrequest.method})\n```\n\n+   3. We will now display\
  \ the method variable in the template. Open the form-example.html template and use\
  \ a <h4> tag to show the method variable. Put this just after the opening <body>\
  \ tag, like so:\n\n```\n<body>\n    <h4>Method: {{ method }}</h4>\n```\n\nNote that\
  \ we could access the method directly inside the template without passing it in\
  \ a context dictionary, by using the request.method variable. We know from Chapter\
  \ 3, URL Mapping, Views, and Templates, that by using the render shortcut function,\
  \ the request is always available in the template. We just demonstrated how to access\
  \ the method in the view here because later on, we will change the behavior of the\
  \ page based on the method.\n\n+   4. We also need to add the CSRF token to the\
  \ form HTML. We do this by putting the {% csrf_token %} template tag after the opening\
  \ <form> tag. The start of the form should look like this:\n\n```\n<form method=\"\
  post\">\n    {% csrf_token %}\n```\n\nNow, save the file.\n\n+   5. Start the Django\
  \ Dev Server if it's not already running. Load the example page (http://127.0.0.1:8000/form-example/)\
  \ in your browser; you should see it now displays the method at the top of the page\
  \ (GET):\n\n![](img/4840a43efd335abd10b93708225692d6_299_0.png)\n\nFigure 6.10:\
  \ Method at the top of the page\n\n+   6. Enter some text or data in each of the\
  \ inputs and submit the form by clicking the Submit Input button:\n\n![](img/4840a43efd335abd10b93708225692d6_300_0.png)\n\
  \nFigure 6.11: Clicking the Submit Input to submit the form\n\nYou should see the\
  \ page reload and the method display change to POST:\n\n![](img/4840a43efd335abd10b93708225692d6_300_1.png)\n\
  \nFigure 6.12: Method updated to POST after form submitted\n\n+   7. Switch back\
  \ to PyCharm and look in the Run console at the bottom of the window. If the console\
  \ is not visible, click the Run button at the bottom of the window to show it:\n\
  \n![](img/4840a43efd335abd10b93708225692d6_300_2.png)\n\nFigure 6.13: Clicking the\
  \ Run button at the bottom of the window to display the console\n\nIf you’re running\
  \ the dev server in Debug mode, click Debug instead.\n\nInside the Run console,\
  \ the list of the values that were posted to the server should be displayed:\n\n\
  ![](img/4840a43efd335abd10b93708225692d6_301_0.png)\n\nFigure 6.14: Input values\
  \ shown in the Run console\n\nHere are some things you should note:\n\n+   - All\
  \ values are sent as text, even number and date inputs\n+   - For the select inputs,\
  \ the selected value attributes of the selected options are sent, not the text content\
  \ of the option tag.\n+   - If you select multiple options for books_you_own, then\
  \ you will see multiple values in the request. This is why we use the getlist method\
  \ since multiple values are sent for the same input name.\n+   - If the checkbox\
  \ was checked, you will have a checkbox_on input in the debug output. If it was\
  \ not checked, then the key will not exist at all (that is, there is no key instead\
  \ of having the key existing with an empty string or None value).\n+   - We have\
  \ a value for the submit_input name, which is the text Submit Input. You submitted\
  \ the form by clicking the Submit Input button, so we receive its value. Notice\
  \ that no value is set for the button_element input since that button was not clicked.\n\
  \n8. We will experiment with two other ways of submitting the form, first by pressing\
  \ Enter on the keyboard when your cursor is in a text-like input (text, password,\
  \ date, email, but not text area as pressing Enter will add a new line).\n\n\n\n\
  \n\n如果你以这种方式提交表单，表单的行为就好像你点击了表单上的第一个提交按钮一样，因此 `submit_input` 输入值会被包含进去。你看到的输出应该与前一幅图相匹配。\n\
  \n另一种提交表单的方式是点击 `button_element` 提交输入。我们将尝试点击此按钮来提交表单。你应该会看到 `submit_button` 不再出现在已发布的值列表中，而\
  \ `button_element` 现在出现了：\n\n```\ncsrfmiddlewaretoken: ['HmMPTL0LXLRT\\ntext_input:\
  \ ['Text']\\npassword_input: ['']\\ncheckbox_on: ['Checkbox Checked']\\nradio_input:\
  \ ['Value Two']\\nfavorite_book: ['1']\\nbooks_you_own: ['1', '3']\\ntext_area:\
  \ ['Text Area']\\nnumber_input: ['154']\\nemail_input: ['email@example.com']\\ndate_input:\
  \ ['2022-03-22']\\nbutton_element: ['Button Element']\\nhidden_input: ['Hidden Value']\n\
  ```\n\nFigure 6.15: submit_button is now gone from the inputs, and button_element\
  \ has been added\n\n你可以使用这种多提交技术来改变视图的行为，具体取决于点击了哪个按钮。你甚至可以拥有多个具有相同 *name* 属性的提交按钮，以使逻辑更易于编写。\n\
  \n在此练习中，你通过使用 `{% csrf_token %}` 模板标签向表单元素添加了 CSRF 令牌。这意味着你的表单可以成功提交到 Django，而不会生成\
  \ **HTTP Permission Denied** 响应。然后我们添加了一些代码来输出表单在提交时包含的值。我们尝试使用各种值提交表单，以查看它们是如何解析为\
  \ `request.POST` 部分的 `QueryDict` 中的 Python 变量的。我们现在将讨论有关 GET 和 POST 请求之间差异的更多理论，然后转向\
  \ Django Forms 库，该库使设计和验证表单变得更容易。\n\n## Choosing between GET or POST\n\n选择使用 GET\
  \ 还是 POST 请求需要考虑多个因素。最重要的是决定请求是否应该是幂等的。如果请求可以重复并且每次都产生相同的结果，则可以说该请求是幂等的。让我们看一些例子。\n\
  \n如果你在浏览器中输入任何网页地址（例如我们迄今为止构建的 Bookr 页面中的任何一个），它将执行 GET 请求来获取信息。你可以刷新页面，无论你刷新多少次，你都会得到相同的数据返回。你所做的请求不会影响服务器上的内容。我们称这些请求为幂等。\n\
  \n现在，回忆一下你在第 4 章中通过 Django 管理界面添加数据时。你将新书的信息输入到表单中，然后点击保存。你的浏览器发出 POST 请求在服务器上创建一个新书。如果你重复该\
  \ POST 请求，服务器将创建另一本 Book，并且每次重复请求时都会这样做。由于请求正在更新信息，因此它不是幂等的。你的浏览器会警告你这一点。如果你曾经尝试刷新提交表单后被发送到的页面，你可能会收到一条消息，询问你是否要“Repost\
  \ form data?”（或更冗长的描述，如下图所示）。这是一个警告，说明你正在再次发送表单数据，这可能会导致你刚刚执行的操作被重复：\n\n![](img/4840a43efd335abd10b93708225692d6_303_0.png)\n\
  \nFigure 6.16: Firefox confirming if information should be resent\n\n这并不是说所有 GET\
  \ 请求都是幂等的，而所有 POST 请求都不是——你的后端应用程序可以按你想要的任何方式设计。尽管这不是最佳实践，但开发人员可能决定在他们的 Web 应用程序中在\
  \ GET 请求期间使数据更新。当你构建应用程序时，你应该尝试确保 GET 请求是幂等的，并且只将更改数据的操作留给 POST 请求。除非你有充分的理由不这样做，否则请坚持这些原则。\n\
  \n另一个需要考虑的点是，Django 仅对 POST 请求应用 CSRF 保护。任何 GET 请求，包括更改数据的请求，都可以在没有 CSRF 令牌的情况下访问。\n\
  \n有时，很难判断请求是否幂等——例如登录表单。在你提交用户名和密码之前，你未登录，之后服务器认为你已登录，所以我们可以认为它是非幂等的，因为它改变了你在服务器上的身份验证状态？另一方面，一旦登录，如果你能够再次发送你的凭据，你仍将保持登录状态。这意味着请求是幂等且可重复的。那么，请求应该是\
  \ GET 还是 POST？这就引出了在选择使用哪种方法时需要考虑的第二个点：表单数据可见性。\n\n如果使用 GET 请求发送表单数据，表单参数将可见于 URL\
  \ 中。例如，如果我们使用 GET 请求制作登录表单，登录 URL 可能是 https://www.example.com/login?username=user&password=password1。用户名，更糟糕的是密码，在\
  \ Web 浏览器的地址栏中可见。它也会存储在浏览器历史记录中，因此任何在真实用户之后使用该浏览器的人都可以登录到该站点。URL 也常存储在 Web 服务器日志文件中，这意味着凭据也会在那里可见。总之，无论请求的幂等性如何，都不要通过\
  \ URL 参数传递敏感数据。\n\n有时，知道参数将可见于 URL 中可能是你所期望的。例如，在使用搜索引擎搜索时，通常搜索参数会可见于 URL 中。要亲身体验，请尝试访问\
  \ https://www.google.com 并搜索某些内容。你会注意到，结果页面的 URL 中包含你的搜索词作为 q 参数。例如，搜索“Django”会带你到\
  \ URL https://www.google.com/search?q=Django。这允许你通过发送此 URL 与他人分享搜索结果。在活动 1 中，你将添加一个搜索表单，类似地传递参数。\n\
  \n另一个考虑因素是，浏览器允许的 URL 最大长度可能与 POST 主体的大小相比很短——有时只有大约 2,000 个字符（或约 2 KB），而 POST 主体可以是数兆字节或数千兆字节（假设你的服务器设置为允许这些大小的请求）。\n\
  \n如前所述，无论请求的类型如何（GET、POST、PUT 等），URL 参数都可在 request.GET 中使用。你可能会发现将一些数据发送到 URL 参数中，而另一些数据发送到请求主体（可在\
  \ request.POST 中使用）很有用。例如，你可以在 URL 中指定一个格式参数来设置某些输出数据的转换格式，但输入数据在 POST 主体中提供。\n\n\
  在 GET 查询字符串中设置参数似乎是多余的，因为值可以作为 URL 路径的一部分传递，然后由 Django 解析以路由 URL。接下来，我们将看看为什么你可能更喜欢使用查询字符串。\n\
  \n## Why use GET when we can put parameters in the URL mappings?\n\nDjango 允许我们轻松定义包含变量的\
  \ URL 映射。例如，我们可以为搜索视图设置如下 URL 映射：\n\n```\npath(\"/search/<str:search>/\", reviews.views.search)\n\
  ```\n\n这乍一看似乎是个不错的方法，但当我们开始想要使用参数自定义结果视图时，它会很快变得复杂。例如，我们可能希望能够从一个结果页移动到下一个结果页，因此我们将添加一个\
  \ page 参数：\n\n```\npath(\"/search/<str:search>/<int:page>/\", reviews.views.search)\n\
  ```\n\n然后，我们可能还希望按特定类别（如作者姓名或出版日期）对搜索结果进行排序，因此我们将为此添加另一个参数：\n\n```\npath(\"/search/<str:search>/<int:page>/<str:order\
  \ >\", reviews.views.search)\n```\n\n你可能已经看到了这种方法的问题——我们无法在不提供页面的情况下对结果进行排序。如果我们还想添加\
  \ results_per_page 参数，我们就无法在不设置 page 和 order 键的情况下使用它。\n\n与之相比，使用查询参数——所有参数都是可选的，因此你可以这样搜索：\n\
  \n```\n?search=search+term:\n```\n\n或者你可以这样设置页面：\n\n```\n?search=search+term&page=2\n\
  ```\n\n或者只设置结果排序方式：\n\n```\n?search=search+term&order=author\n```\n\n或者你可以将它们全部组合：\n\
  \n```\n?search=search+term&page=2&order=author\n```\n\n使用 URL 查询参数的另一个原因是，当提交表单时，浏览器总是以这种方式发送输入值——它无法更改为将参数作为\
  \ URL 路径组件提交。因此，当使用 GET 提交表单时，必须使用 URL 查询参数作为输入数据。\n\n现在我们已经介绍了 HTTP 请求和 HTML 中表单的基础知识，让我们看看\
  \ Django Forms 库，它使处理表单和请求变得容易得多。\n\n## The Django Forms library\n\n我们已经了解了如何在 HTML\
  \ 中手动编写表单，以及如何使用 QueryDict 在请求对象上访问数据。我们看到浏览器为我们提供了某些字段类型（如电子邮件或数字）的一些验证，但我们尚未尝试在\
  \ Python 视图中验证数据。我们应该在 Python 视图中验证表单，原因有两个：\n\n- 仅依赖浏览器对输入数据的验证是不安全的。浏览器可能未实现某些验证功能，这意味着用户可以发布任何类型的数据。例如，较旧的浏览器不验证数字字段，因此用户可以输入超出我们预期范围的数字。此外，恶意用户可能完全不使用浏览器来尝试发送有害数据。浏览器验证应被视为对用户的便利，仅此而已。\n\
  \n\n\n\n\n- 浏览器不允许我们进行跨字段验证。例如，我们可以使用 `required` 属性来标记必须填写的输入。经常情况下，我们希望根据另一个输入的值来设置\
  \ `required` 属性。例如，电子邮件地址输入只有在用户勾选了 **Register My Email** 复选框时才应被设为 `required`。\n\
  \nDjango Forms 库允许你使用 Python 类快速定义一个表单。这是通过创建 Django Form 基类的子类来完成的。然后你可以使用该类的实例在模板中渲染表单并验证输入数据。我们将我们的类称为表单，这与我们通过子类化\
  \ Django Models 来创建 Model 类的方式类似。表单包含一个或多个特定类型的字段（例如文本字段、数字字段或电子邮件字段）。你会注意到这听起来像\
  \ Django Models，而表单 *确实* 与 Models 相似，但使用不同的字段类。你甚至可以从 Model 自动创建一个表单——我们将在 *Chapter\
  \ 7* 中介绍这一点。\n\n## Defining a form\n\n创建 Django 表单与创建 Django 模型类似：你定义一个继承自 `django.forms.Form`\
  \ 类的类。该类具有不同 `django.forms.Field` 子类的实例作为属性。渲染时，类中的属性名对应于 HTML 中的输入名称。为了让你快速了解有哪些字段，一些示例是\
  \ `CharField`、`IntegerField`、`BooleanField`、`ChoiceField` 和 `DateField`。每个字段通常在\
  \ HTML 中渲染为一个输入，但表单字段类与输入类型之间并不总是存在一一对应关系。表单字段更与它们收集的数据类型耦合，而不是它们如何显示。\n\n为说明这一点，请考虑一个\
  \ `text` 输入和一个 `password` 输入。它们都接受一些键入的文本数据，但它们之间的主要区别在于文本在 `text` 输入中会被显示，而在 `password`\
  \ 输入中文本会被隐藏。在 Django 表单中，这两个字段都使用 `CharField` 表示。它们在显示上的差异是通过更改字段使用的 *widget* 来设置的。\n\
  \n> **Note**\n> 如果你不熟悉 widget 这个词，它指的是实际进行交互的输入以及它如何显示。文本输入、密码输入、选择菜单、复选框和按钮都是不同\
  \ widget 的示例。我们在 HTML 中看到的输入与 widget 是一一对应的。在 Django 中并非如此，同一类型的 `Field` 类可以根据指定的\
  \ widget 以多种方式渲染。\n\nDjango 定义了多个 widget 类来定义字段应如何作为 HTML 渲染。它们继承自 django.forms.widgets.Widget。widget\
  \ 可以传递给 Field 构造函数以更改其渲染方式。例如，CharField 默认渲染为 text <input>。如果我们使用 PasswordInput\
  \ widget，它将改为渲染为 password <input>。我们将使用的其他 widget 如下：\n\n- RadioSelect，将 ChoiceField\
  \ 渲染为单选按钮而不是 <select> 菜单\n- Textarea，将 CharField 渲染为 <textarea>\n- HiddenInput，将字段渲染为隐藏的\
  \ <input>\n\n我们将看一个示例表单并逐一添加字段和功能。首先，让我们只创建一个包含文本输入和密码输入的表单。\n\n```\nfrom django\
  \ import forms\n\nclass ExampleForm(forms.Form):\n    text_input = forms.CharField()\n\
  \    password_input = forms.CharField(widget=forms.PasswordInput)\n```\n\nwidget\
  \ 参数可以只是 widget 子类，这在很多情况下是可以的。如果你想进一步自定义输入的显示及其属性，你可以将 widget 参数设置为 widget 类的实例。我们很快就会进一步查看自定义\
  \ widget 显示。在这种情况下，我们只使用 PasswordInput 类，因为我们没有超出更改输入类型的自定义。\n\n当表单在模板中渲染时，它看起来像这样：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_307_0.png)\n\nFigure 6.17: Django form\
  \ rendered in the browser\n\n请注意，页面加载时输入中不包含任何内容；文本已被输入以说明不同的输入类型。\n\n如果我们检查页面源代码，我们将看到\
  \ Django 生成的 HTML。对于前两个字段，它看起来像这样（为可读性添加了一些空格）：\n\n```\n<p>\n    <label for=\"id_text_input\"\
  >Text input:</label>\n    <input type=\"text\" name=\"text_input\" required\n  \
  \      id=\"id_text_input\">\n</p>\n<p>\n    <label for=\"id_password_input\">Password\
  \ input:</label>\n    <input type=\"password\" name=\"password_input\" required\n\
  \        id=\"id_password_input\">\n</p>\n```\n\n请注意 Django 已自动生成一个标签，其文本源自字段名。name\
  \ 和 id 属性已被自动设置。Django 还会自动向输入添加 required 属性。与模型字段类似，表单字段构造函数也接受 required 参数——默认为\
  \ True。将其设置为 False 会从生成的 HTML 中移除 required 属性。\n\n接下来，我们将看看如何向表单添加复选框。\n\n复选框使用\
  \ BooleanField 表示，因为它只有两种值：已勾选或未勾选。它以与其它字段相同的方式添加到表单中：\n\n```\nclass ExampleForm(forms.Form):\n\
  \    ...\n    checkbox_on = forms.BooleanField()\n```\n\nDjango 为这个新字段生成的 HTML 与前两个字段类似：\n\
  \n```\n<label for=\"id_checkbox_on\">Checkbox on:</label>\n<input type=\"checkbox\"\
  \ name=\"checkbox_on\" required\n    id=\"id_checkbox_on\">\n```\n\n接下来是选择输入：\n\n\
  - 我们需要提供要在 <select> 下拉列表中显示的选择列表。\n- 字段类构造函数接受一个 `choices` 参数。choices 以二元元组的元组形式提供。每个子元组中的第一个元素是该选项的值，而第二个元素是该选项的文本或描述。例如，choices\
  \ 可以这样定义：\n\n```\nBOOK_CHOICES = (\n    (\"1\", \"Deep Learning with Keras\"),\n\
  \    (\"2\", \"Web Development with Django\"),\n    (\"3\", \"Brave New World\"\
  ),\n    (\"4\", \"The Great Gatsby\")\n)\n```\n\n请注意，如果你愿意，可以使用列表代替元组（或两者结合）。如果希望你的\
  \ choices 可变，这会很有用：\n\n```\nBOOK_CHOICES = (\n    [\"1\", \"Deep Learning with Keras\"\
  ],\n    [\"2\", \"Web Development with Django\"],\n    [\"3\", \"Brave New World\"\
  ],\n    [\"4\", \"The Great Gatsby\"]\n]\n```\n\n- 要实现 `optgroup`，我们可以嵌套 choices。要像我们在之前的示例中那样实现\
  \ choices，我们可以使用如下结构：\n\n```\nBOOK_CHOICES = (\n    (\n        \"Non-Fiction\",\
  \ (\n            (\"1\", \"Deep Learning with Keras\"),\n            (\"2\", \"\
  Web Development with Django\")\n        )\n    ),\n    (\n        \"Fiction\", (\n\
  \            (\"3\", \"Brave New World\"),\n            (\"4\", \"The Great Gatsby\"\
  )\n        )\n    )\n)\n```\n\nChoices 也可以在表单实例化后设置。你可能希望在视图中动态生成 `list/tuple` choice，然后将其分配给字段的\
  \ `choices` 属性，如下所示：\n\n```\nform = ExampleForm()\nform.fields[\"books_you_own\"\
  ].choices = [(\"1\", \"Deep\nLearning with Keras\"), ...]\n```\n\n接下来是单选输入，与选择输入类似：\n\
  \n- 与选择输入一样，单选输入使用 ChoiceField，因为它们在多个选项之间提供单一选择。\n- 选择的选项通过 choices 参数传递给字段构造函数。\n\
  - choices 以二元元组的元组形式提供，也与选择输入相同：\n\n```\nchoices = (\n    (\"1\", \"Option One\"\
  ),\n    (\"2\", \"Option Two\"),\n    (\"3\", \"Option Three\")\n)\n```\n\n- ChoiceField\
  \ 默认显示为选择输入，因此必须将 widget 设置为 RadioSelect 才能将其渲染为单选按钮。把选择设置与此结合起来，我们可以像这样向表单添加单选按钮：\n\
  \n```\nRADIO_CHOICES = (\n    (\"Value One\", \"Value One\"),\n    (\"Value Two\"\
  , \"Value Two\"),\n    (\"Value Three\", \"Value Three\")\n)\n\nclass ExampleForm(forms.Form):\n\
  \    ...\n    radio_input =\n        forms.ChoiceField(choices=RADIO_CHOICES,\n\
  \        widget=forms.RadioSelect)\n```\n\n\n\n\n以下是生成的 HTML：\n\n```\n<label for=\"\
  id_radio_input_0\">Radio input:</label>\n<ul id=\"id_radio_input\">\n<li>\n<label\
  \ for=\"id_radio_input_0\">\n<input type=\"radio\" name=\"radio_input\"\n    value=\"\
  Value One\" required\n    id=\"id_radio_input_0\">\nValue One\n</label>\n</li>\n\
  <li>\n<label for=\"id_radio_input_1\">\n<input type=\"radio\" name=\"radio_input\"\
  \n    value=\"Value Two\" required\n    id=\"id_radio_input_1\">\nValue Two\n</label>\n\
  </li>\n<li>\n<label for=\"id_radio_input_2\">\n<input type=\"radio\" name=\"radio_input\"\
  \n    value=\"Value Three\" required\n    id=\"id_radio_input_2\">\nValue Three\n\
  </label>\n</li>\n</ul>\n```\n\nDjango 会自动为这三个单选按钮生成唯一的 label 和 ID。\n\n- 要创建文本区域，请使用带有\
  \ Textarea 控件的 CharField：\n\n```\nclass ExampleForm(forms.Form):\n    ...\n    text_area\
  \ = forms.CharField(widget=forms.Textarea)\n```\n\n您可能会注意到，该文本区域比我们之前见到的要大得多（见下图）：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_313_0.png)\n\n图 6.18：普通文本区域（上）与 Django\
  \ 默认文本区域（下）\n\n这是因为 Django 会自动添加 cols 和 rows 属性。它们分别设置文本字段显示的列数和行数：\n\n```\n<label\
  \ for=\"id_text_area\">Text area:</label>\n<textarea name=\"text_area\" cols=\"\
  40\" rows=\"10\" required id=\"id_text_area\"></textarea>\n```\n\n- 请注意，cols 和 rows\
  \ 设置不会影响字段中可以输入的文本量，只影响一次显示的量。另外，文本区域的大小可以通过 CSS（例如 height 和 width 属性）来设置。这会覆盖 cols\
  \ 和 rows 设置。\n\n- IntegerField 生成的 HTML 缺少其他两个字段所拥有的 `step` 属性，这意味着该控件将只接受整数值。\n\
  \n- 另外两个字段（`FloatField` 和 `DecimalField`）生成的 HTML 非常相似，它们在浏览器中的行为相同，只有在 Django 代码中使用其值时才有所不同。\n\
  \n正如您可能已经猜到的，可以使用 EmailField 创建电子邮件输入框：\n\n```\nclass ExampleForm(forms.Form):\n\
  \    ...\n    email_input = forms.EmailField()\n```\n\n其 HTML 与我们手动创建的电子邮件输入框类似：\n\
  \n```\n<label for=\"id_email_input\">Email input:</label>\n<input type=\"email\"\
  \ name=\"email_input\" required\nid=\"id_email_input\">\n```\n\n继续我们手动创建的表单，接下来要查看的字段是\
  \ DateField：\n\n- 默认情况下，Django 会将 DateField 渲染为文本输入，浏览器在点击该字段时不会显示日历弹窗。\n\n我们可以不带任何参数地将\
  \ DateField 添加到表单中，如下所示：\n\n```\nclass ExampleForm(forms.Form):\n    ...\n    date_input\
  \ = forms.DateField()\n```\n\n渲染后，它看起来就像一个普通的文本输入框：\n\n![](img/4840a43efd335abd10b93708225692d6_315_0.png)\n\
  \n图 6.19：表单中默认的 DateField 显示\n\n以下是默认生成的 HTML：\n\n```html\n<label for=\"id_date_input\"\
  >Date input:</label>\n<input type=\"text\" name=\"date_input\" required\nid=\"id_date_input\"\
  >\n```\n\n使用文本输入的原因是它允许用户以多种不同格式输入日期。例如，默认情况下，用户可以按*年-月-日*（以连字符分隔）或*月/日/年*（以斜杠分隔）的格式输入日期。\n\
  \n可以通过使用 `input_formats` 参数向 `DateField` 构造函数传递格式列表来指定可接受的格式。例如，我们可以接受*日/月/年*或*日/月/年（含世纪）*格式的日期，如下所示：\n\
  \n```python\nDateField(input_formats = [\"%d/%m/%y\", \"%d/%m/%Y\"])\n```\n\n我们可以通过向控件构造函数传递\
  \ `attrs` 参数来覆盖字段控件上的任何属性。该参数接受一个属性键/值字典，这些属性将被渲染到输入的 HTML 中。\n\n我们还没有使用过这个功能，但在下一章深入定制字段渲染时，我们会再次看到它。现在，我们只设置一个属性\
  \ type，它将覆盖默认的输入类型：\n\n```python\nclass ExampleForm(forms.Form):\n    …\n    date_input\
  \ =\n    forms.DateField(widget=forms.DateInput(attrs={\"type\":\n    \"date\"}))\n\
  ```\n\n渲染后，它现在看起来就像我们之前的日期字段，点击它会弹出日历日期选择器：\n\n![](img/4840a43efd335abd10b93708225692d6_316_0.png)\n\
  \n图 6.20：带日期输入的 DateField\n\n现在检查生成的 HTML，我们可以看到它使用了 date 类型：\n\n```html\n<label\
  \ for=\"id_date_input\">Date input:</label>\n<input type=\"date\" name=\"date_input\"\
  \ required\nid=\"id_date_input\">\n```\n\n我们最后缺少的输入是隐藏输入：\n\n- 同样，由于 Django 表单以数据为中心的特性，没有\
  \ `HiddenField`。\n- 相反，我们选择需要隐藏的字段类型，并将其控件设置为 `HiddenInput`。然后，我们可以使用字段构造函数的 `initial`\
  \ 参数来设置该字段的值：\n\n```\nclass ExampleForm(forms.Form):\n    …\n    hidden_input =\n\
  \    forms.CharField(widget=forms.HiddenInput,\n    initial=\"Hidden Value\")\n\
  ```\n\n以下是生成的 HTML：\n\n```\n<input type=\"hidden\" name=\"hidden_input\" value=\"\
  Hidden Value\" id=\"id_hidden_input\">\n```\n\n- 请注意，由于这是一个 `hidden` 输入，Django 不会生成\
  \ `label` 或周围的 `p` 元素。\n\nDjango 还提供了其他以类似方式工作的表单字段。从 `DateTimeField`（用于捕获日期和时间）、`GenericIPAddressField`（用于\
  \ IPv4 或 IPv6 地址）到 `URLField`（用于 URL）等等。完整的字段列表可在 https://docs.djangoproject.com/en/4.0/ref/forms/fields/\
  \ 查看。\n\n## 在模板中渲染表单\n\n我们已经了解了如何创建表单并添加字段，也了解了表单的外观和生成的 HTML。但表单在模板中是如何渲染的呢？我们只需实例化表单类，并像传递任何其他变量一样，通过上下文将其传递给视图中的\
  \ render 函数。\n\n例如，下面是我们如何将 `ExampleForm` 传递给模板：\n\n```\ndef view_function(request):\n\
  \    form = ExampleForm()\n    return render(request, \"template.html\", {\"form\"\
  : form})\n```\n\n在渲染模板时，Django 不会为您添加 <form> 元素或提交按钮；您应该在模板中放置表单的位置周围添加这些元素。表单可以像任何其他变量一样渲染。\n\
  \n我们之前简要提到过，表单在模板中使用 as_p 方法渲染。选择这种布局方法是因为它最接近我们之前手动构建的示例表单。Django 提供了三种可用的布局方法：\n\
  \n- as_table\n\n表单以表格行的形式渲染，每个输入占据一行。Django 不会生成外围的 table 元素，因此您需要自己包裹表单；例如：\n\n\
  ```\n<form method=\"post\">\n    <table>\n        {{ form.as_table }}\n    </table>\n\
  </form>\n```\n\nas_table 是默认的渲染方法，因此 {{ form.as_table }} 和 {{ form }} 是等价的。\n\n\
  渲染后，表单看起来像这样：\n\n![](img/4840a43efd335abd10b93708225692d6_318_0.png)\n\n图 6.21：以表格形式渲染的表单\n\
  \n以下是生成的一小段 HTML 示例：\n\n```\n<tr>\n    <th>\n        <label for=\"id_text_input\"\
  >Text input:</label>\n    </th>\n    <td>\n        <input type=\"text\" name=\"\
  text_input\" required\n            id=\"id_text_input\">\n    </td>\n</tr>\n<tr>\n\
  \    <th>\n        <label for=\"id_password_input\">Password input:\n        </label>\n\
  \    </th>\n    <td>\n        <input type=\"password\" name=\"password_input\"\n\
  \            required id=\"id_password_input\">\n    </td>\n</tr>\n```\n\n- as_ul\n\
  \n这会以列表项（li）的形式将表单字段渲染在 ul 或 ol 元素内。与 as_table 一样，Django 不会创建包含元素（<ul> 或 <ol>），必须由您自行添加：\n\
  \n```\n<form method=\"post\">\n    <ul>\n        {{ form.as_ul }}\n    </ul>\n</form>\n\
  ```\n\n\n以下是使用 as_ul 渲染的表单：\n\n![](img/4840a43efd335abd10b93708225692d6_320_0.png)\n\
  \n图 6.22：使用 as_ul 渲染的表单\n\n下面是生成的 HTML 示例：\n\n```\n<li>\n  <label for=\"id_text_input\"\
  >Text input:</label>\n  <input type=\"text\" name=\"text_input\" required\n    id=\"\
  id_text_input\">\n</li>\n<li>\n  <label for=\"id_password_input\">Password input:\n\
  \  </label>\n  <input type=\"password\" name=\"password_input\"\n    required id=\"\
  id_password_input\">\n</li>\n```\n\n+   - as_p\n\n最后，还有 as_p 方法，我们在之前的示例中使用过它。每个输入都包装在\
  \ p 标签内，这意味着你不需要像之前的方法那样手动包装表单（在 <table> 或 <ul> 中），：\n\n```\n<form method=\"post\"\
  >\n    {{ form.as_p }}\n</form>\n```\n\n以下是渲染后的表单的样子：\n\n![](img/4840a43efd335abd10b93708225692d6_321_0.png)\n\
  \n图 6.23：使用 as_p 渲染的表单\n\n你以前见过这个，但再次，这里有一个生成的 HTML 示例：\n\n```\n<p>\n    <label\
  \ for=\"id_text_input\">Text input:</label>\n    <input type=\"text\" name=\"text_input\"\
  \ required\n        id=\"id_text_input\">\n</p>\n<p>\n    <label for=\"id_password_input\"\
  >Password input:\n    </label>\n    <input type=\"password\" name=\"password_input\"\
  \n        required id=\"id_password_input\">\n</p>\n```\n\n选择哪种方法来渲染你的表单取决于哪种最适合你的应用程序。在行为和在视图中的使用方面，它们都是相同的。在第\
  \ 15 章中，我们还将介绍一种渲染表单的方法，它将使用 Bootstrap CSS 类。\n\n现在你已经了解了 Django 表单，我们可以更新我们的示例表单页面，使其使用\
  \ Django 表单而不是手动编写所有 HTML。我们将在下一个练习中通过用 Django 表单替换手写的 HTML 来实现这一点。\n\n## 练习 6.03\
  \ – 构建和渲染一个 Django 表单\n\n在这个练习中，你将使用我们见过的所有字段构建一个 Django 表单。表单和视图的行为将与手动构建的表单类似；然而，你将能够看到使用\
  \ Django 编写表单时所需的代码要少得多。你的表单还将自动获得字段验证，并且如果我们对表单进行更改，我们不必再更改 HTML，因为它将根据表单定义动态更新：\n\
  \n- 1. 在 PyCharm 中，在 form_example 应用目录内创建一个名为 forms.py 的新文件。\n- 2. 在 forms.py 文件顶部导入\
  \ Django forms 库：\n- 3. 通过创建 RADIO_CHOICES 变量来定义单选按钮的选项。按如下方式填充它：\n\n```\nfrom django\
  \ import forms\n```\n\n```\nRADIO_CHOICES = (\n    (\"Value One\", \"Value One Display\"\
  ),\n    (\"Value Two\", \"Text For Value Two\"),\n    (\"Value Three\", \"Value\
  \ Three's Display Text\")\n)\n```\n\n你将在创建名为 radio_input 的 ChoiceField 时很快使用它。\n\
  \n保存文件。\n\n6. 打开 form_example 应用的 views.py 文件。在文件顶部，添加一行代码从 forms.py 文件导入 ExampleForm：\n\
  \n```\nfrom .forms import ExampleForm\n```\n\n7. 在 form_example 视图内部，实例化 ExampleForm\
  \ 类并将其分配给 form 变量：\n\n```\nform = ExampleForm()\n```\n\n8. 使用 form 键将 form 变量添加到上下文字典中。返回行应如下所示：\n\
  \n```\nreturn render(request, \"form-example.html\",\n    {\"method\": request.method,\
  \ \"form\": form})\n```\n\n保存文件。\n\n确保你没有删除打印表单发送数据的代码，因为我们将在本练习后面再次使用它。\n\n9. 打开\
  \ form_example 应用 templates 目录中的 form-example.html 文件。你可以删除 form 元素的大部分内容，除了 {%\
  \ csrf_token %} 模板标签和提交按钮。完成后，它应如下所示：\n\n```\n<form method=\"post\">\n    {% csrf_token\
  \ %}\n\n    <p>\n        <input type=\"submit\" name=\"submit_input\"\n        \
  \       value=\"Submit Input\">\n    </p>\n    <p>\n        <button type=\"submit\"\
  \ name=\"button_element\"\n                value=\"Button Element\">\n         \
  \   Button With <strong>Styled</strong> Text\n        </button>\n    </p>\n</form>\n\
  ```\n\n10. 使用 as_p 方法添加对 form 变量的渲染。将其放在 {% csrf_token %} 模板标签之后的那一行。整个 form 元素现在应如下所示：\n\
  \n```\n<form method=\"post\">\n    {% csrf_token %}\n    {{ form.as_p }}\n    <p>\n\
  ```\n\n```\n```html\n<input type=\"submit\" name=\"submit_input\"\n       value=\"\
  Submit Input\">\n</p>\n<p>\n    <button type=\"submit\" name=\"button_element\"\n\
  \            value=\"Button Element\">\n        Button With <strong>Styled</strong>\
  \ Text\n    </button>\n</p>\n</form>\n```\n```\n\n11. 如果尚未运行，请启动 Django Dev Server，然后在浏览器中访问表单示例页面，地址为\
  \ http://127.0.0.1:8000/form-example/。它应如下所示：\n\n![](img/4840a43efd335abd10b93708225692d6_325_0.png)\n\
  \n图 6.24：浏览器中渲染的 Django ExampleForm\n\n## 验证表单并检索 Python 值\n\n到目前为止，我们已经看到 Django\
  \ 表单如何使使用 Python 代码定义表单变得更加简单，并自动渲染它。现在我们将研究使 Django 表单有用的另一部分：它们能够自动验证表单，然后从中检索原生的\
  \ Python 对象和值。\n\n在 Django 中，表单可以是 *未绑定* 或 *已绑定*。这些术语描述表单是否已接收提交的 POST 数据用于验证。到目前为止，我们只看到未绑定的表单——它们是在没有参数的情况下实例化的，像这样：\n\
  \n```\n```python\nform = ExampleForm()\n```\n```\n\n如果表单是用一些用于验证的数据调用的，例如 POST 数据，则表单是绑定的。可以这样创建已绑定的表单：\n\
  \n```\n```python\nform = ExampleForm(request.POST)\n```\n```\n\n已绑定的表单允许我们开始在表单实例上使用内置的与验证相关的工具。首先是\
  \ `is_valid` 方法，它检查表单的有效性，然后是 `cleaned_data` 属性，其中包含从字符串转换为 Python 对象的<|message|>。`cleaned_data`\
  \ 属性仅在表单已被 *清理* 后可用，清理过程是将数据清理并从字符串转换为 Python 对象的过程。清理过程在 `is_valid` 调用期间运行。如果在调用\
  \ `is_valid` 之前尝试访问 `cleaned_data`，将引发 `AttributeError`。\n\n访问 `ExampleForm` 的清理数据的简短示例如下所示：\n\
  \n```\n```python\nform = ExampleForm(request.POST)\n\nif form.is_valid(): # cleaned_data\
  \ 只有在表单有效时才会被填充\n    if form.cleaned_data[\"integer_input\"] > 5:\n        do_something()\n\
  ```\n```\n\n在这个示例中，`form.cleaned_data[\"integer_input\"]` 是整数值 10，因此可以与数字 5 进行比较。将其与已发布的值进行比较，后者是字符串\
  \ 10。清理过程为我们执行了此转换。其他字段如日期或布尔值也会相应转换。\n\n清理过程还会在表单和字段上设置任何错误，这些错误将在再次渲染表单时显示。让我们看看这一切的实际效果。现代浏览器提供大量客户端验证，因此它们会防止表单在未满足基本验证规则时被提交。如果你尝试在上一个练习中提交表单且字段为空，你可能已经看到过这种情况：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_328_0.png)\n\n*图 6.26* 显示浏览器阻止表单提交。由于浏览器阻止了提交，Django\
  \ 从未有机会自行验证表单。为了允许表单被提交，我们需要添加一些浏览器无法自行验证的更高级验证。我们将在下一节讨论可以应用于表单字段的不同类型的验证，但现在，我们只需将\
  \ `max_digits` 设置为 3 添加到 `ExampleForm` 的 `decimal_input`。这意味着用户不应在表单中输入超过三位数。\n\n\
  > **注意**\n> \n> 为什么 Django 应该验证表单如果浏览器已经在这样做并阻止提交？服务器端应用程序永远不应信任来自用户的输入：用户可能使用旧浏览器或其他\
  \ HTTP 客户端发送请求，因此不会从浏览器收到任何错误。此外，正如我们刚才提到的，有一些浏览器不理解的验证类型，因此 Django 必须在自己的端验证这些。\n\
  \n\n\n\nExampleForm 可以这样更新：\n\n```\nclass ExampleForm(forms.Form):\n    ...\n  \
  \  decimal_input = forms.DecimalField(max_digits=3)\n    ...\n```\n\n现在，视图应该更新为：当请求方法为\
  \ POST 时，将 `request.POST` 传递给表单类，例如：\n\n```\nif request.method == \"POST\":\n  \
  \  form = ExampleForm(request.POST)\nelse:\n    form = ExampleForm()\n```\n\n如果你在请求方法不是\
  \ POST 时将 `request.POST` 传入表单构造函数，那么表单首次渲染时总会包含错误，因为 `request.POST` 将是空的。\n\n现在，浏览器将允许我们提交表单，但如果\
  \ `decimal_input` 包含超过三位数字，就会显示错误：\n\n- 确保总数字不超过 3 位。\n\n![](img/4840a43efd335abd10b93708225692d6_329_0.png)\n\
  \n图 6.27：字段无效时显示的错误\n\n当表单有错误时，Django 会在模板中自动以不同的方式渲染表单。但是我们如何让视图根据表单的有效性采取不同的行为呢？如前面提到的，我们应该使用表单的\
  \ `is_valid` 方法。包含这种检查的视图可能会包含如下代码：\n\n```\nform = ExampleForm(request.POST)\n\n\
  if form.is_valid():\n    # perform operations from with data from\n    form.cleaned_data\n\
  \    return redirect(\"/success-page\")  # redirect to a\n    success page\n```\n\
  \n在这个例子中，如果表单有效，我们会重定向到一个成功页面。否则，我们假定执行流程照常继续，并将无效表单传回 `render` 函数，以便显示给用户并附上错误信息。\n\
  \n> 注意\n> 为什么在成功时返回重定向？有两个原因：第一，提前返回可以阻止视图其余部分的执行（即失败分支）；第二，如果用户随后重新加载页面，可以避免浏览器弹出关于重新发送表单数据的提示。\n\
  \n在下一个练习中，我们将实际看到表单验证，并根据表单的有效性改变视图的执行流程。\n\n## 练习 6.04 – 在视图中验证表单\n\n在本练习中，我们将更新示例视图，使其根据\
  \ HTTP 方法以不同方式实例化表单。我们还将修改表单，使其打印出已清理的数据（cleaned data）而不是原始 POST 数据，但仅在表单有效时这样做：\n\
  \n- 1. 在 PyCharm 中，打开 `form_example` 应用目录下的 `forms.py` 文件。给 `ExampleForm` 的 `decimal_input`\
  \ 添加一个 `max_digits=3` 参数：\n\n```\nclass ExampleForm(forms.Form):\n    ...\n    decimal_input\
  \ = forms.DecimalField(max_digits=3)\n```\n\n添加此参数后，我们就能提交表单了，因为浏览器不知道如何验证这条规则，但\
  \ Django 知道。\n\n- 2. 打开 `reviews` 应用的 `views.py` 文件。我们需要更新 `form_example` 视图，使得如果请求方法是\
  \ POST，则用 POST 数据实例化 `ExampleForm`；否则，不带参数实例化它。用以下代码替换当前表单初始化代码：\n\n```\ndef form_example(request):\n\
  \    if request.method == \"POST\":\n        form = ExampleForm(request.POST)\n\
  \    else:\n        form = ExampleForm()\n```\n\n- 3. 接下来，同样针对 POST 请求方法，我们将使用 `is_valid`\
  \ 方法检查表单是否有效。如果表单有效，我们将打印出所有已清理的数据。在 `ExampleForm` 实例化之后添加一个检查 `form.is_valid()`\
  \ 的条件，然后将调试打印循环移入此条件内。你的 POST 分支应如下所示：\n\n```\nif request.method == \"POST\":\n\
  \    form = ExampleForm(request.POST)\n    if form.is_valid():\n        for name\
  \ in request.POST:\n            print(\"{}\": {}\".format(name,\n            request.POST.getlist(name)))\n\
  ```\n\n- 4. 我们不再遍历原始的 `request.POST` `QueryDict`（其中所有数据都是字符串），而是遍历表单的 `cleaned_data`。这是一个普通字典，包含转换为\
  \ Python 对象后的值。将 `for` 行和 `print` 行替换为以下两行：\n\n```\nfor name, value in\n    form.cleaned_data.items():\n\
  \        print(\"{}: ({}) {}\".format(name,\n        type(value), value))\n```\n\
  \n我们不再需要使用 `getlist()`，因为 `cleaned_data` 已经将多值字段转换为列表。\n\n- 5. 启动 Django 开发服务器（如果尚未运行）。切换到浏览器，访问示例表单页面，地址为\
  \ `http://127.0.0.1:8000/form-example/`。表单看起来应该和之前一样。填写所有字段，但确保在**十进制输入**字段中输入四个或更多数字以使表单无效。提交表单；当页面刷新时，你应该会看到**十进制输入**字段的错误信息显示出来：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_331_0.png)\n\n图 6.28：表单提交后显示的十进制输入错误\n\
  \n- 6. 修正表单错误，确保“十进制输入”字段中只有三位数字，然后再次提交表单。切换回 PyCharm 并检查调试控制台。你应该会看到所有已清理的数据已打印出来：\n\
  \n```\ntext_input: (<class 'str'>) Text\npassword_input: (<class 'str'>) password\n\
  checkbox_on: (<class 'bool'>) True\nradio_input: (<class 'str'>) Value One\nfavorite_book:\
  \ (<class 'str'>) 1\nbooks_you_own: (<class 'list'>) ['1']\ntext_area: (<class 'str'>)\
  \ Test Value\ninteger_input: (<class 'int'>) 10\nfloat_input: (<class 'float'>)\
  \ 11.0\ndecimal_input: (<class 'decimal.Decimal'>) 123\nemail_input: (<class 'str'>)\
  \ user@example.com\ndate_input: (<class 'datetime.date'>) 2022-04-20\nhidden_input:\
  \ (<class 'str'>) Hidden Value\n```\n\n图 6.29：已打印出表单的已清理数据\n\n注意所发生的类型转换。CharFields\
  \ 已被转换为 `str`，BooleanField 被转换为 `bool`，IntegerField、FloatField 和 DecimalField 分别被转换为\
  \ `int`、`float` 和 `Decimal`。DateField 变成 `datetime.date`，选择字段将保留其初始选择值的字符串值。注意 `books_you_own`\
  \ 会自动转换为 `str` 列表。\n\n另外，请注意，与遍历所有 POST 数据时不同，`cleaned_data` 只包含表单字段。其他数据（例如 CSRF\
  \ 令牌和被点击的提交按钮）存在于 POST 的 `QueryDict` 中，但并不包含在其中，因为它们不是表单字段。\n\n在本练习中，你更新了 `ExampleForm`，使得浏览器允许提交它，即使\
  \ Django 会认为它无效。这允许 Django 对表单执行验证。然后，你更新了 `form_example` 视图，根据 HTTP 方法以不同方式实例化\
  \ `ExampleForm` 类，对于 POST 请求传入请求的 POST 数据。视图还更新了调试输出代码，以打印 `cleaned_data` 字典。最后，你测试了提交有效和无效表单数据，以查看不同的执行路径以及表单生成的数据类型。我们看到，Django\
  \ 根据字段类自动将 POST 数据从字符串转换为 Python 类型。\n\n接下来，我们将了解如何向字段添加更多验证选项，从而让我们更严格地控制可以输入的值。\n\
  \n## 内置字段验证\n\n我们还没有讨论可以在字段上使用的标准验证参数。虽然我们已经提到了 `required` 参数（默认值为 `True`），但还可以使用许多其他参数来更严格地控制输入到字段中的数据。下面是一些有用的参数：\n\
  \n- `max_length`\n  设置可输入字段的最大字符数，适用于 CharField（以及 FileField——我们将在第 8 章中讨论）。\n-\
  \ `min_length`\n  设置必须输入到字段的最小字符数，适用于 CharField（以及 FileField——同样，更多内容见第 8 章）。\n\
  - `max_value`\n  设置可输入到数值字段中的最大值，适用于 IntegerField、FloatField 和 DecimalField。\n-\
  \ `min_value`\n  设置可输入到数值字段中的最小值，适用于 IntegerField、FloatField 和 DecimalField。\n-\
  \ `max_digits`\n  设置可输入的最大数字位数。这包括小数点前后的数字（如果存在小数点）。例如，数字 12.34 有四位数字，而 56.7 有三位。这用于\
  \ DecimalField。\n- `decimal_places`\n  设置小数点后最多允许的位数。此参数与 `max_digits` 配合使用，且小数位数始终计入总位数，即使小数点后没有输入那么多位也是如此。例如，`max_digits`\
  \ 为 4，`decimal_places` 为 3：如果输入数字 12.34，它将被解释为 12.340——也就是说，会补零，直到小数点后的位数等于 `decimal_places`\
  \ 设置。由于我们将 `decimal_places` 设置为 3，总位数最终为 5，超过了 `max_digits` 的 4。数字 1.2 则是有效的，因为即使扩展为\
  \ 1.200，总位数也只有 4。\n\n你可以混合搭配这些验证规则（前提是字段支持它们）。CharField 可以有 `max_length` 和 `min_length`；数值字段可以同时有\
  \ `min_value` 和 `max_value`，依此类推。\n\n\n\n\n如果需要更多验证选项，你可以编写自定义验证器，我们将在下一节中介绍。现在，我们将向\
  \ ExampleForm 添加一些验证器，以便在实际操作中查看它们。\n\n## 练习 6.05 – 添加额外字段验证\n\n在本练习中，我们将在 ExampleForm\
  \ 的字段上添加和修改验证规则。然后我们将看到这些更改如何影响表单的行为，无论是在浏览器中还是在 Django 验证表单时：\n\n- 1. 在 PyCharm\
  \ 中，打开 form_example 应用目录中的 forms.py 文件。\n- 2. 我们将使 text_input 最多需要三个字符。向 CharField\
  \ 构造函数添加一个 max_length=3 参数：\n- 3. 通过要求至少八个字符使 password_input 更安全。向 CharField 构造函数添加一个\
  \ min_length=8 参数：\n- 4. 用户可能没有书籍，因此 books_you_own 字段不应为必填项。向 MultipleChoiceField\
  \ 构造函数添加一个 required=False 参数：\n- 5. 用户只能在 integer_input 中输入 1 到 10 之间的值。向 IntegerField\
  \ 构造函数添加 min_value=1 和 max_value=10 参数：\n- 6. 最后，向 DecimalField 构造函数添加 max_digits=5\
  \ 和 decimal_places=3：\n- 保存文件。\n\n```\ntext_input = forms.CharField(max_length=3)\n\
  ```\n\n```\npassword_input = forms.CharField(min_length=8,\nwidget=forms.PasswordInput)\n\
  ```\n\n```\nbooks_you_own =\nforms.MultipleChoiceField(required=False,\nchoices=BOOK_CHOICES)\n\
  ```\n\n```\ninteger_input = forms.IntegerField(min_value=1,\nmax_value=10)\n```\n\
  \n```\ndecimal_input = forms.DecimalField(max_digits=5,\ndecimal_places=3)\n```\n\
  \n7. 如果尚未运行，请启动 Django 开发服务器。我们不需要对任何其他文件进行任何更改即可获得这些新的验证规则，因为 Django 会自动更新 HTML\
  \ 生成和验证逻辑。这是使用 Django 表单所带来的巨大好处。只需在浏览器中访问或刷新 http://127.0.0.1:8000/form-example/，新的验证就会自动添加。表单在尝试提交不正确的值之前看起来不会有任何不同，在这种情况下，浏览器可以自动显示错误。可以尝试以下操作：\n\
  \n- - 输入 **Text input** 字段中多于三个字符是无法完成的。\n- - 在密码字段中输入少于八个字符然后移开焦点可能会导致浏览器显示错误，指出此值无效（只有某些浏览器支持此功能）。\n\
  - - 不要为 **Books you own** 字段选择任何值。这将不再阻止你提交表单。\n- - 使用 **Integer input** 上的步进按钮。你只能输入\
  \ 1 到 10 之间的值。如果输入超出此范围的值，浏览器应显示错误。\n- - **Decimal input** 是唯一一个在浏览器中不验证 Django\
  \ 规则的字段。你需要输入无效值（例如 123.456）并提交表单，然后才会显示由 Django 生成的错误。\n\n下图显示了浏览器可用于自行验证的一些字段：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_335_0.png)\n\n图 6.30：某些浏览器会突出显示无效字段\n\
  \n图 6.31 显示了浏览器在表单提交时可能以另一种方式呈现验证错误的示例 – 在特定字段旁边放置错误消息：\n\n![](img/4840a43efd335abd10b93708225692d6_335_1.png)\n\
  \n图 6.31：浏览器可能会在提交时在字段旁边显示消息\n\n图 6.32 显示了一个只能由 Django 生成的错误，因为浏览器不理解 DecimalField\
  \ 验证规则：\n\n- - 确保总共不超过 3 位数字。\n\nDecimal input: 1234\n\n图 6.32：浏览器认为表单有效，但 Django\
  \ 认为无效\n\n在本练习中，我们在表单字段上实现了一些基本的验证规则。然后我们在不更改模板或视图的情况下在浏览器中加载了表单示例页面。我们尝试使用不同的值提交表单，以检查浏览器如何验证表单与\
  \ Django 的比较。\n\n在本章的活动中，我们将使用 Django 表单实现 Book Search 视图。\n\n## 活动 1 – 书籍搜索\n\n\
  在此活动中，你将完成在第 1 章中开始的 Book Search 视图。你将构建一个 SearchForm，它提交并接受来自 request.GET 的搜索字符串。它将有一个选择字段来选择搜索标题或贡献者。然后它将搜索标题或贡献者的\
  \ first_names 或 last_names 中包含给定文本的所有书籍。你将然后在 search-results.html 模板中呈现此书籍列表。搜索词不应为必填项，但如果存在，则长度应超过三个字符。由于视图即使使用\
  \ GET 方法也会进行搜索，因此表单始终会进行验证检查。如果我们将字段设为必填，则每次页面加载时都会始终显示错误。\n\n搜索将有两种方式。第一种是通过 base.html\
  \ 模板中的搜索表单提交，该表单位于每个页面的右上角。这将只搜索 Book 标题。另一种方法是通过在 search-results.html 页面上呈现的 SearchForm\
  \ 提交。此表单将显示一个 ChoiceField 用于在标题或贡献者搜索之间进行选择。\n\n以下步骤将帮助你完成此活动：\n\n- 1. 创建一个 forms.py\
  \ 文件，导入 Django forms 库，然后创建一个 SearchForm 类。\n- 2. SearchForm 应有两个字段。第一个是名为 search\
  \ 的 CharField。此字段不应为必填项，但应具有最小长度为 3。\n- 3. SearchForm 上的第二个字段是名为 search_in 的 ChoiceField。这将允许你在标题和贡献者之间进行选择（标签分别为\
  \ Title 和 Contributor）。它不应为必填项。\n- 4. 更新 book_search 视图，以便使用来自 request.GET 的数据实例化\
  \ SearchForm。\n- 5. 添加代码以使用 title__icontains 搜索 Book 模型（用于不区分大小写的搜索）。如果按标题搜索，应执行此操作。搜索仅在表单有效且包含某些搜索文本时执行。search_in\
  \ 值应使用 GET 方法从 cleaned_data 中检索，因为它可能不存在，因为它不是必填项。将其默认为 title。\n- 6. 搜索贡献者时，使用 first_names__icontains\
  \ 或 last_names__icontains，然后遍历贡献者并检索每个贡献者的书籍。如果按贡献者搜索，应执行此操作。搜索仅在表单有效且包含某些搜索文本时执行。组合\
  \ first 或 last 名称的搜索结果有多种方法。到目前为止，你所介绍的技术中最简单的方法是执行两个查询，一个用于匹配名字，然后用于姓氏，并分别迭代它们。\n\
  - 7. 更新 render 调用，以便在上下文中包含 form 变量和检索到的书籍（以及 search_text，它已在传递）。模板的位置在第 3 章中已更改，因此相应地更新\
  \ render 的第二个参数。\n- 8. 我们在第 1 章中创建的 search-results.html 模板现在基本上是多余的，因此你可以清除其内容。更新\
  \ search-results.html，使其从 base.html 扩展，而不是作为独立的模板文件。\n- 9. 添加一个 title 块，如果表单有效且已设置\
  \ search_text，则显示 Search Results for <search_text>；否则，只显示 Book Search。此块稍后也会添加到\
  \ base.html 中。\n- 10. 添加一个 content 块，其中应显示一个 <h2> 标题，文字为 Search for Books，在 <h2>\
  \ 下呈现表单。 <form> 元素可以没有属性，它将默认为向其所在的同一 URL 发出 GET 请求。添加一个提交按钮，如我们在之前的活动中所使用，具有 btn\
  \ btn-primary 类。\n- 11. 在表单下方，显示一条消息，说明 Search results for <search_text>，如果表单有效且已输入搜索文本；否则不显示消息。这应显示在\
  \ <h3> 标签中，搜索文本应用 <em> 标签包裹。\n- 12. 遍历搜索结果并呈现每个结果。显示书籍标题和任何贡献者的名字和姓氏。书籍标题应链接到 book_detail\
  \ 页面。如果书籍列表为空，则显示文本 No results found。你应将结果包装在 <ul> 标签中，class 为 list-group；每个结果应为\
  \ class 为 list-group-item 的 <li> 项。这将类似于 book_list 页面，但我们不会显示太多信息（仅标题和贡献者）。\n\n\n\
  \n\n\n+   13. 更新 `base.html`，使其在搜索 `<form>` 标签中包含 action 属性。使用 `url` 模板标签为此属性生成\
  \ URL。\n+   \n+   14. 将搜索字段的 name 属性设置为 `search`，value 属性设置为输入的 `search_text`。同时，确保该字段的最小长度为\
  \ 3。\n+   \n+   15. 在 `base.html` 中，添加一个标题块到被其他模板覆盖的 title 标签中（如步骤 9）。在 `<title>`\
  \ HTML 元素内部添加一个块模板标签。它应包含内容 **Bookr**。\n\n完成此活动后，你应该能够打开位于 `http://127.0.0.1:8000/book-search/`\
  \ 的 Book Search 页面；它看起来像图 6.33：\n\n![](img/4840a43efd335abd10b93708225692d6_338_0.png)\n\
  \n图 6.33：没有搜索的 Book Search 页面\n\n当使用仅两个字符搜索时，你的浏览器应阻止你提交任一搜索字段。\n\n如果你搜索的内容没有结果，你将看到一条没有结果的消息。通过标题搜索（这可以在任一字段中完成）将显示匹配结果：\n\
