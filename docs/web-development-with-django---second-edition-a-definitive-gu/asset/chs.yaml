  \ `clean` 方法来验证相互依赖的表单。在此方法中，我们添加了字段和非字段错误。\n\n\n\n\n\n到目前为止，我们已经学习了多字段验证，以及如何实现它们以确保我们可以在一次完成表单验证，而不是逐一高亮错误。\n\
  \n在下一节中，我们将介绍如何为表单添加占位符和初始值。\n\n## 添加占位符和初始值\n\n我们第一个手工构建的表单具有我们当前 Django 表单仍然没有的两个东西——占位符和初始值。添加占位符很简单；它们只是作为表单字段的\
  \ widget 构造函数的属性添加。这与我们在之前的示例中为 DateField 设置类型所见的类似。\n\n这里有一个例子：\n\n```\nclass ExampleForm(forms.Form):\n\
  \    text_field = forms.CharField(\n        widget=forms.TextInput(attrs={\"placeholder\"\
  : \"Text Placeholder\"})\n    )\n    password_field = forms.CharField(\n       \
  \ widget=forms.PasswordInput(attrs={\"placeholder\": \"Password Placeholder\"})\n\
  \    )\n    email_field = forms.EmailField(\n        widget=forms.EmailInput(attrs={\"\
  placeholder\": \"Email Placeholder\"})\n    )\n    text_area = forms.CharField(\n\
  \        widget=forms.Textarea(attrs={\"placeholder\": \"Text Area Placeholder\"\
  })\n    )\n```\n\n`request.POST` 中的值将覆盖 `initial` 中的值。这意味着即使我们为必填字段设置了初始值，如果提交时留空，则它将无法通过验证。字段不会回退到\
  \ `initial` 中的值。\n\n是否在 Form 类本身或视图中设置初始值取决于你以及你的用例。如果你有一个在多个视图中使用的表单，但通常具有相同的值，那么最好在表单中设置\
  \ `initial` 值。否则，在视图中使用 `setting` 可以更灵活。\n\n在下一个练习中，我们将为上一个练习中的 `OrderForm` 类添加占位符和初始值。\n\
  \n## 练习 7.02 – 占位符和初始值\n\n在这个练习中，你将通过添加占位符文本来增强 `OrderForm` 类。你将模拟向表单传递一个初始电子邮件地址。它将是一个硬编码地址，但一旦用户可以登录，它可以是与他们账户关联的电子邮件地址——你将在\
  \ *第 9 章，Sessions and Authentication* 中学习会话和身份验证：\n\n+   1. 在 PyCharm 中打开 `reviews`\
  \ 应用的 `forms.py` 文件。你将为 `OrderForm` 上的 `magazine_count`、`book_count` 和 `email` 字段添加占位符，这意味着也需要设置\
  \ widget。\n+   \n+   对于 `magazine_count` 字段，添加一个 `NumberInput` widget，并在 `attrs`\
  \ 字典中使用 `placeholder`。此 `placeholder` 应设置为 **Number of Magazines**。编写以下代码：\n\n```\n\
  magazine_count = forms.IntegerField(\n    min_value=0,\n    max_value=80,\n    widget=forms.NumberInput(attrs={\"\
  placeholder\":\n    \"Number of Magazines\"}),\n)\n```\n\n+   2. 以相同的方式为 `book_count`\
  \ 字段添加占位符。占位符文本应为 **Number of Books**：\n\n```\nbook_count = forms.IntegerField(\n\
  \    min_value=0,\n    max_value=50,\n    widget=forms.NumberInput(attrs={\"placeholder\"\
  :\n    \"Number of Books\"}),\n)\n```\n\n3. 对 OrderForm 的最后一次更改是为 email 字段添加占位符。这次，widget\
  \ 是 EmailInput。占位符文本应为 Your company email address：\n\n```\nemail = forms.EmailField(\n\
  \    required=False,\n    validators=[validate_email_domain],\n    widget=forms.EmailInput(attrs={\"\
  placeholder\":\n    \"Your company email address\"}),\n)\n```\n\n请注意，clean_email\
  \ 和 clean 方法应保持在练习 7.01 中自定义 clean 和验证方法时的状态。保存文件。\n\n4. 打开 form_project 应用的 views.py\
  \ 文件。在 form_example 视图函数中，创建一个名为 initial 的新字典变量，只有一个键 email，如下所示：\n\n```\ninitial\
  \ = {\"email\": \"user@example.com\"}\n```\n\n5. 在你实例化 OrderForm 的两个地方，也使用 initial\
  \ kwarg 传入 initial 变量。第一个实例如下：\n\n```\nform = OrderForm(request.POST, initial=initial)\n\
  ```\n\n第二个实例如下：\n\n```\nform = OrderForm(initial=initial)\n```\n\nviews.py 的完整代码可以在\
  \ https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/blob/main/Chapter07/Exercise7.02/form_project/form_example/views.py\
  \ 找到。保存 views.py 文件。\n\n+   6. 如果尚未运行，请启动 Django dev 服务器。在浏览器中浏览至 http://127.0.0.1:8000/form-example/。你应该会看到你的表单现在具有占位符和初始值设置：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_362_0.png)\n\n图 7.17 – 具有初始值和占位符的订单表单\n\
  \n在这个练习中，我们向表单字段添加了占位符。这是通过在表单类上定义表单字段时设置表单 widget 并在 attrs 字典中设置占位符值来完成的。我们还使用字典为表单设置了初始值，并使用\
  \ initial kwarg 将其传递给表单实例。\n\n在下一节中，我们将讨论如何使用表单中的数据与 Django 模型一起工作，以及 ModelForm\
  \ 如何使这变得更容易。\n\n## 创建或编辑 Django 模型\n\n我们已经看到了如何定义表单，并且在第 2 章，Models and Migrations\
  \ 中，你学习了如何创建 Django 模型实例。通过将这些东西结合使用，你可以构建一个显示表单并将模型实例保存到数据库的视图。这为你提供了一种在无需编写大量样板代码或创建自定义表单的情况下保存数据的方式。在\
  \ Bookr 中，我们将使用此方法允许用户在无需访问 Django 管理站点的情况下添加评论。如果不使用 ModelForm，你可以这样做：\n\n+   你可以基于现有模型创建一个表单；例如，Publisher。表单将称为\
  \ PublisherForm。\n\n+   - 你可以手动在 PublisherForm 上定义字段，使用在 Publisher 模型上定义相同的规则，如下所示：\n\
  \n```\nclass PublisherForm(forms.Form):\n    name = forms.CharField(max_length=50)\n\
  \    website = forms.URLField()\n    ...\n```\n\n+   - 在视图中，初始值将从数据库中查询的模型中检索，然后使用\
  \ initial 参数传递给表单。如果你正在创建新实例，初始值将为空——如下所示：\n\n```\nif create:\n    initial = {}\n\
  else:\n    publisher = Publisher.objects.get(pk=pk)\n    initial = {\"name\": publisher.name,\
  \ \"website\":\n    publisher.website, ...}\n\nform = PublisherForm(initial=initial)\n\
  ```\n\n+   - 然后，在视图的 POST 流程中，你可以根据 cleaned_data 创建或更新模型：\n\n```\nform = PublisherForm(request.POST,\
  \ initial=initial)\nif create:\n    publisher = Publisher()\nelse:\n    publisher\
  \ = Publisher.objects.get(pk=pk)\n\npublisher.name = form.cleaned_data['name']\n\
  publisher.website = forms.cleaned_data['website']\n...\npublisher.save()\n```\n\n\
  这需要大量工作，我们必须考虑我们有多少重复的逻辑。例如，我们在 name 表单字段中定义了 name 的长度。如果我们在这里犯了错误，我们可能会允许字段中的名称比模型允许的更长。我们还必须记住在\
  \ `initial` 字典中设置所有字段，以及使用表单的 `cleaned_data` 在新模型或更新的模型上设置值。如果模型发生变化，这里有很多出错的机会，以及记住为这些步骤中的每一个添加或删除字段设置数据。所有这些代码也必须为你工作的每个\
  \ Django 模型重复，加剧了重复问题。\n\n## ModelForm 类\n\n幸运的是，Django 提供了使用 ModelForm 类以更简单的方式从表单构建\
  \ Model 实例的方法。ModelForm 是从特定模型自动构建的表单。它将继承模型的验证规则（例如字段是否必填或 CharField 实例的最大长度等）。它提供了一个额外的\
  \ `__init__` 参数（称为 instance），用于从现有模型自动填充初始值。它还添加了一个 save 方法以自动将表单数据持久化到数据库。你需要做的就是指定其模型和应使用的字段：这是在表单类的\
  \ class Meta 属性上完成的。让我们看看如何从 Publisher 构建表单。\n\n在包含表单的文件内部（例如我们一直在使用的 `forms.py`\
  \ 文件），唯一的变化是必须导入模型：\n\n```\n```python\nfrom .models import Publisher\n```\n```\n\
  \n然后，可以定义 Form 类。该类需要一个 `class Meta` 属性，而该属性又必须定义 model 属性以及 fields 或 excludes 属性：\n\
  \n```\n```python\nclass PublisherForm(forms.ModelForm):\n    class Meta:\n     \
  \   model = Publisher\n        fields = (\"name\", \"website\", \"email\")\n```\n\
  ```\n\n`fields` 是要包含在表单中的字段的列表或元组。当手动设置字段列表时，如果你向模型添加额外字段，你还必须在此处添加其名称以使其显示在表单上。\n\
  \n你也可以使用特殊的 `__all__` 值代替列表或元组以自动包含所有字段，如下所示：\n\n```\n```python\nclass PublisherForm(forms.ModelForm):\n\
  \    class Meta:\n        model = Publisher\n        fields = \"__all__\"\n```\n\
  ```\n\n如果模型字段的 editable 属性设置为 False，则它将不会自动包含。\n\n\n\n\n相反，`exclude` 属性会将字段设置为在表单中不显示。添加到模型中的任何字段都将自动添加到表单中。我们可以使用\
  \ `exclude` 定义前面的表单，使用任何空元组，因为我们想要所有字段。代码如下：\n\n```\n```python\nclass PublisherForm(forms.ModelForm):\n\
  \    class Meta:\n        model = Publisher\n        exclude = ()\n```\n```\n\n\
  这可以为你节省一些工作，因为你不需要将字段同时添加到模型和 `fields` 列表中；然而，它并不那么安全，因为你可能会自动向最终用户公开你不想让他们看到的字段。例如，如果你有一个\
  \ User 模型和 UserForm，你可能会向 User 模型添加一个 `is_admin` 字段，以便给予管理员用户额外的权限。如果该字段不在 `exclude`\
  \ 中，它将被显示给用户。然后用户就可以让自己成为管理员，这可能是你不希望发生的。\n\n无论我们决定使用这三种选择表单显示的方法中的哪一种，在我们的情况下，它们在浏览器中显示都是一样的。这是因为我们选择显示所有字段。它们在浏览器中渲染时看起来都像这样：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_365_0.png)\n\n图 7.18 – PublisherForm\n\
  \n请注意，来自 Publisher 模型的 `help_text` 也会自动渲染。\n\n在视图中的使用与我们之前看到的其他表单类似。此外，正如前面提到的，可以提供一个额外的参数，称为\
  \ `instance`。它可以设置为 None，这将渲染一个空表单。\n\n假设，在你的视图函数中，你有一些方法来确定你是在创建还是编辑模型实例（我们稍后会讨论如何做到这一点），这将决定一个名为\
  \ `is_create` 的变量（如果正在创建实例则为 True，如果正在编辑现有实例则为 False）。你的用于创建表单的视图函数可以这样写：\n\n```\n\
  ```python\nif is_create:\n    instance = None\nelse:\n    instance = get_object_or_404(Publisher,\
  \ pk=pk)\n\nif request.method == \"POST\":\n    form = PublisherForm(request.POST,\
  \ instance=instance)\n    if form.is_valid():\n```\n```\n\n额外字段放在 Model 字段之后。额外字段不会自动处理——它们不存在于模型上，因此\
  \ Django 不会尝试在模型实例上保存它们。相反，你应该通过检查表单的 `cleaned_data` 值来处理它们的值的保存方式，就像处理标准表单一样，例如（在你的视图函数内部）：\n\
  \n```\n```python\nif form.is_valid():\n    if form.cleaned_data.get(\"email_on_save\"\
  ):\n        send_email()  # assume this function is defined\n    else:\n       \
  \ form.save()  # save the instance regardless of sending\n        the email or not\n\
  \    return redirect(success_url)\n```\n```\n\n在下面的练习中，你将在 Bookr 中编写一个新的视图函数，以便创建和编辑\
  \ Publisher。\n\n## 练习 7.03 – 创建和编辑一个出版商\n\n在本练习中，我们将回到 Bookr。我们希望在不使用 Django 管理后台的情况下添加创建和编辑\
  \ Publisher 的能力。为此，我们将为 Publisher 模型添加一个 ModelForm。它将在一个新的视图函数中使用。该视图函数将接受一个可选参数\
  \ `pk`，它将是正在编辑的 Publisher 对象的 ID，或者为 None 以创建新的 Publisher。我们将添加两个新的 URL 映射来促进这一点。当完成时，我们将能够通过其\
  \ ID 查看和更新任何出版商。例如，*Publisher 1* 的信息将在 `/publishers/1` URL 路径下查看/编辑：\n\n- 1. 在 PyCharm\
  \ 中，打开 reviews 应用的 `forms.py` 文件。在 forms 导入之后，导入 Publisher 模型：\n  \n  ```python\n\
  \  from .models import Publisher\n  ```\n  \n- 2. 创建一个 PublisherForm 类，继承自 `forms.ModelForm`：\n\
  \  \n  ```python\n  class PublisherForm(forms.ModelForm):\n  ```\n  \n- 3. 在 PublisherForm\
  \ 上定义类 Meta 属性。Meta 所需的属性是 model（Publisher）和 fields（`\"__all__\"`）：\n  \n  ```python\n\
  \  class PublisherForm(forms.ModelForm):\n      class Meta:\n          model = Publisher\n\
