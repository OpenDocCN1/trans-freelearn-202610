  \n## 14\n"
- "## 测试你的 Django 应用\n\n在前几章中，我们专注于通过编写数据库模型、视图和模板等不同组件，在 Django 中构建 Web 应用。我们这样做是为了给用户提供一个交互式应用，让他们能够创建个人资料并为他们读过的书撰写书评。\n\
  \n除了构建和运行应用之外，还有一个重要方面：确保应用代码按我们期望的方式工作。这可以通过一种称为**测试**的技术来保证。在测试中，我们运行 Web 应用的不同部分，并检查所执行组件的输出是否与预期输出匹配。如果输出匹配，我们就说该组件测试成功；如果输出不匹配，我们就说该组件未能按预期工作。\n\
  \n在本章中，随着我们浏览不同的小节，我们将学习测试为何重要、测试 Web 应用的不同方法，以及如何构建一个强大的测试策略，以帮助我们确保所构建的 Web 应用是健壮的。\n\
  \n在本章中，我们将介绍以下主题：\n\n- 测试的重要性\n- 自动化测试\n- Django 中的测试\n- 测试 Django 模型\n- 测试 Django\
  \ 视图\n- Django 请求工厂\n- Django 中的测试用例类\n\n让我们先从了解测试的重要性开始我们的旅程。\n\n### 技术要求\n\n本章的完整代码文件可以在\
  \ https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter14\
  \ 找到。\n\n### 测试的重要性\n\n确保应用按设计的方式工作是开发工作中的一个重要方面，否则我们的用户可能会不断遇到奇怪的行为，这通常会降低他们对应用的参与度。\n\
  \n我们在测试上付出的努力有助于确保我们打算解决的各种问题确实得到正确解决。想象一下，一个开发人员正在构建一个在线事件调度平台。在这个平台上，用户可以根据当地时区在日历上安排事件。现在，如果在这个平台上，用户能够按预期安排事件，但由于一个\
  \ bug，事件被安排到了错误的时区，会怎么样？正是这类问题往往会赶走许多用户。\n\n这就是为什么许多企业公司花费大量资金来确保他们正在构建的应用经过了全面测试。这样，他们就能确保不会发布有缺陷的产品，或者远远不能满足用户需求的产品。\n\
  \n简而言之，测试帮助我们实现以下目标：\n\n- 确保应用组件按照规范工作\n- 确保在不同基础设施平台上的互操作性，例如应用可以部署在 Linux 或 Windows\
  \ 等不同操作系统上\n- 有助于降低在重构应用代码时引入 bug 的概率\n\n现在，许多人对测试的一个常见设想是，他们必须在组件开发时手动测试所有组件，以确保每个组件符合其规范，并在每次更改或向应用中添加新组件时重复这项工作。虽然这没错，但这并不能提供测试的完整图景。随着时间推移，测试作为一项技术已经变得非常强大，作为开发人员，你可以通过实现自动化测试用例来减少大量测试工作。那么，这些自动化测试用例是什么呢？或者换句话说，什么是自动化测试？让我们来了解一下。\n\
  \n### 自动化测试\n\n当单个组件被修改时，反复测试整个应用可能会变成一项具有挑战性的任务，如果该应用包含大型代码库，则更是如此。代码库的规模可能归因于功能的绝对数量或它解决问题的复杂性。\n\
  \n### 实现测试用例\n\n在着手实现用于测试代码的机制时，你需要理解的第一件事是如何对这种实现进行逻辑分组，以便彼此密切相关的模块在一个逻辑单元中进行测试。\n\
  \n实现**测试用例**可以简化这一过程。测试用例不过是一个逻辑单元，将相关的测试分组在一起，以便所有为测试用例初始化环境的通用逻辑可以合并到同一处，从而避免在实现应用测试代码时重复工作。\n\
  \n### Django 中的单元测试\n\n既然我们已经理解了测试，让我们来看看如何在 Django 中进行单元测试。在 Django 的上下文中，单元测试由两个主要部分组成：\n\
  \n- 一个 `TestCase` 类，它封装了为给定模块分组的不同测试用例\n- 一个实际需要执行的测试用例，用于测试特定组件的流程\n\n实现单元测试的类应继承自\
  \ Django 的 `test` 模块提供的 `TestCase` 类。默认情况下，Django 在每个应用目录中都提供了一个 `tests.py` 文件，可用于存储应用模块的测试用例。\n\
  \n一旦编写好这些单元测试，就可以直接使用 `manage.py` 中提供的 `test` 命令轻松运行它们，如下所示：\n\n```\npython manage.py\
  \ test\n```\n\n现在，让我们看看断言如何帮助我们构建单元测试并检查预期行为。\n\n### 利用断言\n\n编写测试的一个重要部分是验证测试是通过还是失败。通常，为了在测试环境中做出此类判断，我们会使用一种称为**断言**的东西。\n\
  \n断言是软件测试中的一个常见概念。它们接收两个操作数，并验证**左侧（LHS）**操作数的值是否与**右侧（RHS）**操作数的值匹配。如果 LHS 的值与\
  \ RHS 的值匹配，则断言被视为成功；如果值不同，则断言被视为失败。\n\n评估结果为 `False` 的断言本质上会使测试用例被评估为失败，然后向用户报告。\n\
  \nPython 中的断言实现起来相当容易，它们使用一个名为 assert 的简单关键字。例如，以下代码片段展示了一个非常简单的断言：\n\n```\nassert\
  \ 1 == 1\n```\n\n上述断言接收一个表达式，该表达式求值为 True。如果这个断言是测试用例的一部分，那么测试就会成功。\n\n现在，让我们看看如何使用\
  \ Python unittest 库实现测试用例。这样做非常简单，可以通过一些易于遵循的步骤来完成：\n\n1. 导入 unittest 模块，它允许我们构建测试用例：\n\
  \n```\nimport unittest\n```\n\n2. 导入模块后，我们可以创建一个类，其名称以 Test 开头，并继承自 unittest 模块提供的\
  \ TestCase 类：\n\n```\nclass TestMyModule(unittest.TestCase):\n    def test_method_a(self):\n\
  \        assert <expression>\n```\n\n只有当 TestMyModule 类继承 TestCase 类时，Django 才能自动运行它，并与框架完全集成。定义类之后，我们可以在类中实现一个名为\
  \ test_method_a() 的新方法，用于验证断言。就是这样。\n\n这里需要注意的一个重要部分是测试用例和测试函数的命名规范。实现的测试用例应以 Test\
  \ 名称为前缀，以便测试执行模块能够将它们识别为有效测试用例并执行它们。同样的规则也适用于测试方法的命名。\n\n3. 编写完测试用例后，只需运行以下命令即可执行：\n\
  \n```\npython manage.py test\n```\n\n在明确了实现测试用例的基本思路之后，让我们编写一个非常简单的单元测试，来感受一下 Django\
  \ 中单元测试框架的行为。\n\n\n\n\n# 练习 14.01 – 编写一个简单的单元测试\n\n在本练习中，我们将编写一个简单的单元测试来了解 Django\
  \ 单元测试框架的工作原理，并利用这一知识来实现我们的第一个测试用例，该用例验证一个简单的表达式：\n\n+   1. 首先，打开 Bookr 项目中 reviews\
  \ 应用下的 tests.py 文件。默认情况下，该文件将只包含一行代码，即从 test 模块导入 Django 的 TestCase 类：\n\n```\n\
  from django.test import TestCase\n```\n\n+   2. 在刚刚打开的 tests.py 文件中添加以下代码行：\n\n\
  ```\nclass TestSimpleComponent(TestCase):\n    def test_basic_sum(self):\n     \
  \   assert 1+1 == 2\n```\n\n这里，我们创建了一个名为 TestSimpleComponent 的新类，它继承自 Django 测试模块提供的\
  \ TestCase 类。assert 语句将比较 LHS 上的表达式 (1+1) 与 RHS 上的表达式 (2)。\n\n+   3. 编写完测试用例后，返回到项目文件夹并运行以下命令：\n\
  \n```\npython manage.py test\n```\n\n应生成以下输出：\n\n```\n% ./manage.py test\nCreating\
  \ test database for alias 'default'...\nSystem check identified no issues (0 silenced).\n\
  .\n----------------------------------------------------\n-----\nRan 1 test in 0.001s\n\
  \nOK\nDestroying test database for alias 'default'...\n```\n\n前面的输出表明 Django 的测试运行器执行了\
  \ 1 个测试用例，该用例成功通过了评估。\n\n+   4. 在确认测试用例正常工作并通过后，我们现在将在 test_basic_sum() 方法的末尾添加另一个断言，如以下代码片段所示：\n\
  \n```\nassert 1+1 == 3\n```\n\n第二个是 tearDown() 方法。该方法在测试函数执行完毕后被调用，并在测试用例执行结束后清理变量及其值。无论测试用例评估为\
  \ True 还是 False，该方法都会被执行。使用 tearDown() 方法的示例如下所示：\n\n```\nclass MyTestCase(unittest.TestCase):\n\
  \    def setUp(self):\n        # Do some initialization work\n    def test_method_a(self):\n\
  \        # code for testing method A\n    def test_method_b(self):\n        # code\
  \ for testing method B\n    def tearDown(self):\n        # perform cleanup\n```\n\
  \n在前面的示例中，tearDown() 方法将在每次测试方法执行完毕后被调用——即在 test_method_a() 执行完毕后调用一次，并在 test_method_b()\
  \ 执行完毕后再次调用。\n\n现在我们了解了编写测试用例的不同组件。让我们看看如何使用提供的测试框架来测试 Django 应用的不同方面。\n\n## 测试\
  \ Django 模型\n\nDjango 中的模型是数据将在应用数据库中存储方式的基于对象的表示。它们提供可帮助我们验证给定记录的数据输入的方法，以及在数据插入数据库之前对数据进行任何处理。\n\
  \n在 Django 中测试模型与创建它们一样简单。现在，让我们看看如何使用 Django 测试框架测试 Django 模型。\n\n## 练习 14.02 –\
  \ 测试 Django 模型\n\n在本练习中，我们将创建一个新的 Django 模型并为其编写测试用例。测试用例将验证你的模型是否能正确地将数据插入数据库并从数据库中检索数据。当一支开发团队在大型项目上协作时，同一个数据库模型可能会随着时间的推移被多名开发人员修改，这类在数据库模型上工作的测试用例会很有用。实现数据库模型的测试用例可以让开发人员预先识别他们可能在工作中无意中引入的潜在破坏性更改。让我们开始步骤：\n\
  \n+   1. 创建一个新的应用，用于本章的练习。为此，运行以下命令，它将为你的用例设置一个新的应用：\n\n```\npython manage.py startapp\
  \ bookr_test\n```\n\n2. 为了确保 bookr_test 应用的行为与 Django 项目中的任何其他应用相同，将此应用添加到 Bookr\
  \ 项目的 INSTALLED_APPS 部分。为此，打开 Bookr 项目中的 settings.py 文件并将以下代码附加到 INSTALLED_APPS\
  \ 列表中：\n\n```\nINSTALLED_APPS = [\n    '...',\n    '...',\n    'bookr_test'\n]\n\
  ```\n\n3. 现在应用设置完成，创建一个新的数据库模型用于测试目的。对于本练习，我们将创建一个名为 Publisher 的新模型，它将存储我们数据库中图书出版商的详细信息。要创建模型，请打开\
  \ bookr_test 目录下的 models.py 文件并向其中添加以下代码：\n\n```\nfrom django.db import models\n\
  \nclass Publisher(models.Model):\n    \"\"\"A company that publishes books.\"\"\"\
  \n    name = models.CharField(\n        max_length=50, help_text=\"The name of the\
  \ Publisher.\")\n    website = models.URLField(\n        help_text=\"The Publisher's\
  \ website.\")\n    email = models.EmailField(\n        help_text=\"The Publisher's\
  \ email address.\")\n\n    def __str__(self):\n        return self.name\n```\n\n\
  在前面的代码片段中，你创建了一个名为 Publisher 的新类，它继承自 Django models 模块的 Model 类，将该类定义为将用于存储出版商数据的\
  \ Django 模型：\n\n```\nclass Publisher(models.Model)\n```\n\n在此模型内部，我们添加了三个字段，它们将作为模型的属性：\n\
  \n+   - `name`: 出版商的名称\n+   - `website`: 出版商的网站\n+   - `email`: 出版商的电子邮件地址\n\n完成此操作后，我们创建了一个名为\
  \ `__str__()` 的类方法，它定义了 Model 类的字符串表示形式将是什么样的。\n\n+   4. 现在模型已创建，在对它运行测试之前需要先迁移此模型。为此，运行以下命令：\n\
  \n```\n```bash\npython manage.py makemigrations\npython manage.py migrate\n```\n\
  ```\n\n+   5. 模型现在已设置好，编写用于测试你在 *步骤 3* 中创建的模型的测试用例。为此，打开 `bookr_test` 目录下的 `tests.py`\
  \ 文件并向其中添加以下代码：\n\n```\n```python\nfrom django.test import TestCase\nfrom .models\
  \ import Publisher\n\n\nclass TestPublisherModel(TestCase):\n    \"\"\"Test the\
  \ publisher model.\"\"\"\n    def setUp(self):\n        self.p = Publisher(name='Packt',\n\
  \                           website='www.packt.com',\n                         \
  \  email='contact@packt.com')\n\n    def test_create_publisher(self):\n        self.assertIsNotNone(self.p,\
  \ Publisher)\n\n    def test_str_representation(self):\n        self.assertEquals(str(self.p),\
  \ \"Packt\")\n```\n```\n\n在前面的代码片段中，有几件事值得探讨。\n\n开始时，在从 Django 测试模块导入 TestCase 类后，你从\
  \ bookr_test 目录导入了 Publisher 模型，它将用于测试。\n\n导入所需库后，我们必须创建一个名为 TestPublisherModel\
  \ 的新类，它继承 TestCase 类并用于对与 Publisher 模型相关的单元测试进行分组：\n\n```\nclass TestPublisherModel(TestCase):\n\
  ```\n\n在此类内部，我们定义了几个方法。首先，我们定义了一个名为 setUp() 的新方法，并向其中添加了 Model 对象创建代码，以便在该测试用例内部每次执行新的测试方法时创建\
  \ Model 对象。此 Model 对象存储为类成员，以便可以在其他方法中无问题地访问它：\n\n```\ndef setUp(self):\n    self.p\
  \ = Publisher(name='Packt',\n                    website='www.packt.com',\n    \
