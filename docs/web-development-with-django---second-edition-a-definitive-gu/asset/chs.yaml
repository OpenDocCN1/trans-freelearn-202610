  \n现在，让我们看看如何使用 Python csv 模块创建新的 CSV 文件。\n\n## 使用 Python 写入 CSV 文件\n\n在上一节中，我们探讨了如何使用\
  \ Python 中的 csv 模块读取 CSV 格式文件的内容。现在，让我们学习如何将 CSV 数据写入文件。\n\n写入 CSV 数据遵循与从 CSV 文件读取类似的方法，只是存在一些细微差异。以下步骤概述了将数据写入\
  \ CSV 文件的过程：\n\n通过运行以下脚本以写入模式打开文件：\n\n```\ncsv_file = open('path to csv file', 'w')\n\
  ```\n\n\n\n\n\n获取一个 CSV 写入器对象，它可以帮助我们以正确的 CSV 格式写入数据。这可以通过调用 csv 模块的 `writer()`\
  \ 方法来完成，该方法返回一个写入器对象，可用于将兼容 CSV 格式的数据写入 CSV 文件：\n\n```\n```python\ncsv_writer =\
  \ csv.writer(csv_file)\n```\n```\n\n一旦写入器对象可用，我们就可以开始写入数据。这由写入器对象的 `writerow()`\
  \ 方法实现。`write_row()` 方法接收一个值列表并将其写入 CSV 文件。列表本身表示一行，列表中的值表示列的值：\n\n```\n```python\n\
  record = ['value1', 'value2', 'value3']\ncsv_writer.writerow(record)\n```\n```\n\
  \n如果您想在一次调用中写入多条记录，也可以使用 CSV 写入器的 `writerows()` 方法。`writerows()` 方法的行为与 `writerow()`\
  \ 方法类似，但接收一个列表的列表，可以一次性写入多行：\n\n```\n```python\nrecords = [['value11', 'value12',\
  \ 'value13'], ['value21',\n'value22', 'value23']]\ncsv_writer.writerows(records)\n\
  ```\n```\n\n记录写入后，我们可以关闭 CSV 文件：\n\n```\n```python\ncsv_file.close()\n```\n```\n\
  \n现在，让我们将所学应用到下一个练习中，并实现一个程序来帮助我们将值写入 CSV 文件。\n\n## 练习 13.02 – 使用 Python 的 csv 模块生成\
  \ CSV 文件\n\n在本练习中，您将使用 Python csv 模块创建新的 CSV 文件：\n\n+   1. 创建一个名为 `csv_writer.py`\
  \ 的新文件，在其中编写 CSV 写入器的代码。在此文件中，添加以下代码：\n\n```\n```python\nimport csv\n\n\ndef write_csv(filename,\
  \ header, data):\n    \"\"\"Write the provided data to the CSV file.\n\n    :param\
