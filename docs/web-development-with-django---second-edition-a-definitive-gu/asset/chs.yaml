  \ 'stock_symbol': 'MMM', 'market_cap': '$127.36B'}\n{'id': '12', 'stock_symbol':\
  \ 'GATX', 'market_cap': '$2.54B'}\n{'id': '13', 'stock_symbol': 'JPM^D', 'market_cap':\
  \ 'n/a'}\n```\n```\n\n图 13.4：使用 DictReader 的输出\n\n正如前一幅图所示，各个行被映射为字典中的键值对。要访问行中的这些各个字段，我们可以使用以下方法：\n\
  \n```\n```python\nprint(record.get('stock_symbol'))\n```\n```\n\n这将为我们提供来自各个记录的\
  \ stock_symbol 字段的值。\n\n同样，您也可以使用 DictWriter() 接口以字典形式操作 CSV 文件。为了演示这一点，让我们看一下来自\
  \ *练习 13.02 – 使用 Python 的 csv 模块生成 CSV 文件* 的 write_csv() 方法，并按如下方式修改它：\n\n```\n\
  ```python\ndef write_csv(filename, header, data):\n    \"\"\"Write the provided\
  \ data to the CSV file.\n\n    :param str filename: The name of the file to which\
  \ the\n                         data should be written\n    :param list header:\
  \ The header for the columns in CSV\n                        file\n    :param list\
  \ data: The list of dicts mapping the values\n                      to the columns\n\
  \    \"\"\"\n    try:\n        with open(filename, 'w') as csv_file:\n         \
  \   csv_writer = csv.DictWriter(csv_file,\n                                    \
  \    fieldnames=header)\n            csv_writer.writeheader()\n            csv_writer.writerows(data)\n\
  \    except (IOError, OSError) as csv_file_error:\n        print(\"Unable to write\
  \ the contents to CSV file.\n              Exception: {}\".format(csv_file_error))\n\
  ```\n```\n\n在前面的代码中，我们将 csv.writer() 替换为 csv.DictWriter()，它提供了一个类似字典的接口来与 CSV 文件交互。DictWriter()\
  \ 还接收一个 fieldnames 参数，用于在写入前映射 CSV 文件中的各个列。\n\n接下来，要写入此标题，请调用 writeheader() 方法，它会将\
  \ fieldname 标题写入 CSV 文件。\n\n最后一次调用涉及 writerows() 方法，它接收一个字典列表并将其写入 CSV 文件。为了使代码正确工作，您还需要将\
  \ data 列表修改为如下所示：\n\n```\ndata = [{'name': Richard, 'age': 32, 'gender': 'M'},\n\
  \    {'name': Mumzil', 'age': 21, 'gender':'F'},\n    {'name': 'Melinda', 'age':\
  \ 25, 'gender': 'F'}]\n```\n\n有了这些，您就有足够的知识在 Python 中处理 CSV 文件。\n\n通过本节，我们学习了如何使用标准库提供的\
  \ csv 模块在 Python 中处理 CSV 文件。\n\n由于我们正在讨论如何处理表格数据，特别是将其读写到文件，让我们看一下由最受欢迎的表格数据编辑器之一使用的更知名的文件格式之一\
  \ – Microsoft Excel。\n\n## 在 Python 中使用 Excel 文件\n\nMicrosoft Excel 是记账和表格记录管理领域世界闻名的软件。同样，随着\
  \ Excel 引入的 XLSX 文件格式也得到了快速和广泛的采用，现在已得到所有主要产品供应商的支持。\n\n您会发现 Microsoft Excel 及其\
  \ XLSX 格式在许多公司的市场营销和销售部门被大量使用。假设，对于这样一家公司的市场营销部门，您正在 Django 中构建一个 Web 门户，用于跟踪用户购买的产品。它还显示有关购买的数据，例如购买时间和购买地点。市场营销和销售团队计划使用这些数据来生成潜在客户或创建相关广告。\n\
  \n市场营销和销售团队也大量使用 Excel。您可能希望以 Excel 原生的 XLSX 格式导出 Web 应用程序中的可用数据。\n\n很快，我们将了解如何使我们的网站与\
  \ XLSX 格式协同工作。但在此之前，让我们先快速了解一下二进制文件格式的使用。\n\n\n\n\n## 数据导出的二进制文件格式\n\n到目前为止，我们主要处理的是文本数据，以及如何从文本文件中读写这些数据。但通常，基于文本的格式并不够用。例如，假设你想导出一张图片或一个图表。你如何将图片或图表表示为文本，又如何读写这些图片呢？\n\
  \n为了帮助我们应对这些情况，二进制文件格式应运而生，它可以帮助我们读写各种丰富多样的数据。所有商业操作系统都原生支持文本和二进制文件格式，而且毫不奇怪的是，Python\
  \ 提供了最通用的处理二进制数据文件的实现之一。一个简单的例子是 open 命令，你可以用它来指定要以哪种格式打开文件：\n\n```\nfile_handler\
  \ = open('path to file', 'rb')\n```\n\n这里的 b 表示二进制。\n\n从本节开始，我们现在将处理如何使用二进制文件，并用它们来表示和导出来自\
  \ Django Web 应用的数据。我们将要讨论的第一种格式是 XLSX 文件格式，这种格式因 Microsoft Excel 而广受欢迎。\n\n那么，让我们深入了解如何使用\
  \ Python 处理 XLSX 文件。\n\n## 使用 XlsxWriter 包处理 XLSX 文件\n\n在本节中，我们将进一步了解 XLSX 文件格式，并理解如何使用\
  \ XlsxWriter 包来处理它。\n\n### XLSX 文件\n\nXLSX 文件是用于存储表格数据的二进制文件。任何实现了对该格式支持的软件都可以读取这些文件。XLSX\
  \ 格式将数据划分为两个逻辑分区：\n\n- **工作簿**：每个 XLSX 文件都称为一个工作簿，应该包含与特定领域相关的数据集。在图 13.5 中，Examplefile.xlsx\
  \ 是一个工作簿（1）：\n\n![](img/4840a43efd335abd10b93708225692d6_592_0.png)\n\n图 13.5：Excel\
  \ 中的工作簿和工作表\n\n- **工作表**：在每个工作簿中，可以有一个或多个工作表，它们以表格格式存储不同但逻辑相关的数据集。在图 13.5 中，**Sheet1**\
  \ 和 **Sheet2** 是两个工作表（2）。\n\n处理 XLSX 格式时，我们通常操作的就是这两个单元。如果你了解关系数据库，可以将工作簿视为数据库，将工作表视为表。\n\
  \n现在，让我们试着理解如何在 Python 中开始处理 XLSX 文件。\n\n### XlsxWriter Python 包\n\nPython 没有通过其标准库提供对\
  \ XLSX 文件的原生支持。但得益于 Python 生态系统中庞大的开发者社区，很容易找到几个可以帮助我们管理与 XLSX 文件交互的包。这一类别中一个流行的包是\
  \ **XlsxWriter**。\n\nXlsxWriter 是一个由开发者社区积极维护的包，为与 XLSX 文件交互提供支持。该包提供了许多有用的功能，支持创建和管理工作簿，以及各个工作簿中的工作表。你可以在终端或命令提示符中运行以下命令来安装它：\n\
  \n```\npip install XlsxWriter\n```\n\n安装完成后，你可以按如下方式导入 xlsxwriter 模块：\n\n```\nimport\
  \ xlsxwriter\n```\n\n那么，让我们看看如何使用 XlsxWriter 包开始创建 XLSX 文件。\n\n### 创建工作簿\n\n要开始处理\
  \ XLSX 文件，我们首先需要创建它们。XLSX 文件也称为工作簿，可以通过调用 xlsxwriter 包中的 Workbook 类来创建，如下所示：\n\n\
  ```\nworkbook = xlsxwriter.Workbook(filename)\n```\n\n调用 Workbook 类会打开一个由 filename\
  \ 参数指定的二进制文件，并返回一个工作簿实例，该实例可用于进一步创建工作表和写入数据。\n\n### 创建工作表\n\n在开始向 XLSX 文件写入数据之前，我们需要先创建一个工作表。这可以通过调用上一节中获得的工作簿对象的\
  \ add_worksheet() 方法轻松完成：\n\n```\nworksheet = workbook.add_worksheet()\n```\n\n\
  add_worksheet() 方法会创建一个新工作表，将其添加到工作簿中，并返回一个与该工作表相对应的 Python 对象，通过该对象我们可以向工作表写入数据。\n\
  \n### 向工作表写入数据\n\n一旦获得了对工作表的引用，我们就可以通过调用工作表对象的 write 方法开始向其写入数据，如下所示：\n\n```\nworksheet.write(row_num,\
  \ col_num, col_value)\n```\n\n如你所见，write() 方法接受三个参数：行号（row_num）、列号（col_num），以及属于\
  \ [row_num, col_num] 对的数据，由 col_value 表示。可以重复调用此方法，将多个数据项插入工作表中。\n\n### 向工作簿写入数据\n\
  \n一旦所有数据都已写入，要完成写入数据集的收尾并干净地关闭 XLSX 文件，你必须对工作簿调用 close() 方法：\n\n```\nworkbook.close()\n\
  ```\n\n此方法会写入文件缓冲区中可能存在的任何数据，并最终关闭工作簿。现在，让我们利用这些知识来实现我们自己的代码，帮助我们向 XLSX 文件写入数据。\n\
  \n> 重要说明\n> 本章无法涵盖 XlsxWriter 包提供的所有方法和功能。如需更多信息，你可以阅读官方文档：https://xlsxwriter.readthedocs.io/contents.html。\n\
  \n## 练习 13.03 – 在 Python 中创建 XLSX 文件\n\n在本练习中，我们将使用 XlsxWriter 包创建一个新的 Excel（XLSX）文件，并从\
  \ Python 向其中添加数据：\n\n- 1. 在系统上安装 XlsxWriter 包，请在终端应用或命令提示符中运行以下命令：\n  \n      `pip\
  \ install XlsxWriter`\n  \n      命令执行完成后，你的系统上就会安装好该包。\n      安装好该包后，我们就可以开始编写用于创建\
  \ Excel 文件的代码了。\n\n- 2. 创建一个名为 xlsx_demo.py 的新文件，并向其中添加以下代码：\n\n```\nimport xlsxwriter\n\
  \ndef create_workbook(filename):\n    \"\"\"Create a new workbook on which we can\
  \ work.\"\"\"\n    workbook = xlsxwriter.Workbook(filename)\n    return workbook\n\
  ```\n\n在上面的代码片段中，我们创建了一个新函数，它将帮助我们创建一个可用于存储你的数据的新工作簿。创建好新工作簿后，下一步是创建一个工作表，它为我们提供了组织存储在\
  \ XLSX 工作簿中的数据所需的表格格式。\n\n3. 工作簿创建好后，通过向你的 xlsx_demo.py 文件中添加以下代码片段来创建一个新工作表：\n\n\
  ```\ndef create_worksheet(workbook):\n    \"\"\"Add a new worksheet in the workbook.\"\
  \"\"\n    worksheet = workbook.add_worksheet()\n    return worksheet\n```\n\n在上面的代码片段中，我们使用\
  \ XlsxWriter 包提供的工作簿对象的 add_worksheet() 方法创建了一个新工作表。该工作表将用于写入对象的数据。\n\n4. 下一步是创建一个辅助函数，帮助我们将数据按行号和列号定义的表格格式写入工作表。为此，请将以下代码片段添加到你的\
  \ xlsx_writer.py 文件中：\n\n```\ndef write_data(worksheet, data):\n    \"\"\"Write\
  \ data to the worksheet.\"\"\"\n    for row in range(len(data)):\n        for col\
  \ in range(len(data[row])):\n            worksheet.write(row, col, data[row][col])\n\
  ```\n\n在上面的代码片段中，我们创建了一个名为 write_data() 的新函数，它接受两个参数：需要写入数据的工作表对象，以及需要写入工作表的、由列表的列表表示的数据对象。该函数遍历传递给它的数据，然后将数据写入其所属的行和列。\n\
  \n现在，所有核心方法都已实现，我们可以添加一个方法，帮助干净地关闭工作簿对象，以便数据能够写入文件，而不会发生任何文件损坏。为此，请在 xlsx_demo.py\
  \ 文件中实现以下代码片段：\n\n```\ndef close_workbook(workbook):\n    \"\"\"Close an opened\
  \ workbook.\"\"\"\n    workbook.close()\n```\n\n最后一步是集成我们在前面步骤中实现的所有方法。为此，请在 xlsx_demo.py\
  \ 文件中创建一个新的入口点方法：\n\n```\nif __name__ == '__main__':\n    data = [['John Doe', 38],\
  \ ['Adam Cuvver', 22],\n            ['Stacy Martin', 28], ['Tom Harris', 42]]\n\
  \    workbook = create_workbook('sample_workbook.xlsx')\n    worksheet = create_worksheet(workbook)\n\
  \    write_data(worksheet, data)\n    close_workbook(workbook)\n```\n\n\n\n\n\n\
  在前面的代码片段中，我们创建了一个数据集，我们希望以列表的列表形式将其写入 XLSX 文件。完成之后，我们获得了一个新的工作簿对象，该对象将用于创建 XLSX\
  \ 文件。在此工作簿对象内部，我们创建了一个工作表以以行列格式组织数据，将数据写入工作表，并关闭工作簿以将数据持久化到磁盘。\n\n5. 现在，让我们看看你编写的代码是否按预期工作。为此，运行以下命令：\n\
  \n```\npython3 xlsx_demo.py\n```\n\n命令执行完成后，你会看到在执行命令的目录中出现了一个名为 sample_workbook.xlsx\
  \ 的新文件。为验证其是否包含正确的结果，请使用 Microsoft Excel 或 Google Sheets 打开此文件并查看其内容。它应类似于此处所示的内容：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_596_0.png)\n\n图 13.6：使用 xlsxwriter 生成的\
  \ Excel 表格\n\n借助 xlsxwriter 模块，你还可以对列应用公式。例如，如果你想添加一行来显示电子表格中人员的平均年龄，可以通过修改 write_data()\
  \ 方法来实现，如下所示：\n\n```\ndef write_data(worksheet, data):\n    \"\"\"Write data to\
  \ the worksheet.\"\"\"\n    for row in range(len(data)):\n        for col in range(len(data[row])):\n\
  \            worksheet.write(row, col, data[row][col])\n    worksheet.write(len(data),\
  \ 0, \"Avg. Age\")\n    # len(data) will give the next index to write to\n    avg_formula\
  \ = \"=AVERAGE(B{}:B{})\".format(\n        1, len(data))\n    worksheet.write(len(data),\
  \ 1, avg_formula)\n```\n\n在前面的代码片段中，我们向工作表添加了一个额外的 `write` 调用，并使用了 Excel 提供的 `AVERAGE`\
  \ 函数来计算工作表中人员的平均年龄。\n\n至此，你现在知道如何使用 Python 生成与 Microsoft Excel 兼容的 XLSX 文件，以及如何导出可供组织中不同团队轻松使用的表格内容。\n\
  \n现在，让我们介绍另一种在全球范围内广泛使用的有趣文件格式：PDF。\n\n## 在 Python 中处理 PDF 文件\n\n**Portable Document\
  \ Format 或 PDF** 是世界上最常见的文件格式之一。你一定在某个时候遇到过 PDF 文档。这些文档可以包括业务报告、电子书等。\n\n你还记得遇到过带有\
  \ **Print page as PDF** 按钮的网站吗？许多政府机构的网站都 readily 提供此选项，允许你直接将网页打印为 PDF。那么问题来了，我们如何为我们的\
  \ Web 应用实现这一点？我们应如何添加将某些内容导出为 PDF 的选项？\n\n多年来，庞大的开发者社区为 Python 生态系统贡献了大量有用的包。其中一个包可以帮助我们实现\
  \ PDF 文件生成。\n\n## 将网页转换为 PDF\n\n有时，我们可能会遇到想要将网页转换为 PDF 的情况。例如，我们可能想打印网页以将其存储为本地副本。这在尝试打印原生以网页形式显示的证书时也很有用。\n\
  \n为了帮助我们完成此类工作，我们可以利用一个名为 weasyprint 的简单库，该库由 Python 开发者社区维护，允许网页快速轻松地转换为 PDF。因此，让我们看看如何生成网页的\
  \ PDF 版本。\n\n## 练习 13.04 – 在 Python 中生成网页的 PDF 版本\n\n在本练习中，我们将使用 Python 生成网站的 PDF\
  \ 版本。我们将使用一个名为 weasyprint 的社区贡献的 Python 模块来帮助我们生成 PDF。让我们开始吧：\n\n- 1. 为了使即将到来的步骤中的代码正常工作，通过运行以下命令在你的系统上安装\
  \ weasyprint 模块：\n\n```\n```bash\npip install weasyprint\n```\n```\n\n### 重要说明\n\
  \nweasyprint 依赖于 cairo 库。如果你尚未安装它，使用 weasyprint 可能会引发错误，并显示 libcairo-2.dll 文件未找到的消息。要解决此错误，请按照\
  \ weasyprint 安装链接 https://weasyprint.readthedocs.io/en/stable/install.html#windows\
  \ 中提到的步骤操作。\n\n- 2. 安装完包后，创建一个名为 pdf_demo.py 的新文件，用于存放 PDF 生成逻辑。在此文件中，编写以下代码：\n\n\
  ```\nfrom weasyprint import HTML\n\ndef generate_pdf(url, pdf_file):\n    \"\"\"\
  Generate PDF version of the provided URL.\"\"\"\n    print(\"Generating PDF...\"\
  )\n    HTML(url).write_pdf(pdf_file)\n```\n\n现在，让我们尝试理解这段代码的作用。在第一行，我们从 weasyprint\
  \ 包导入了 HTML 类，该包你在步骤 1 中安装了：\n\n```\nfrom weasyprint import HTML\n```\n\n此 HTML\
  \ 类为我们提供了一种机制，通过该机制，如果我们有其 URL，我们可以读取网站的 HTML 内容。\n\n在下一步中，我们创建了一个名为 generate_pdf()\
  \ 的新方法，它接受两个参数 – 应用作生成 PDF 的源 URL 的 URL，以及 pdf_file 参数，它接受应写入文档的文件名：\n\n```\ndef\
  \ generate_pdf(url, pdf_file):\n```\n\n接下来，我们将 URL 传递给前面导入的 HTML 类对象。这导致 URL 被 weasyprint\
  \ 库解析并读取其 HTML 内容。完成此操作后，我们调用 HTML 类对象的 write_pdf() 方法并提供应写入内容的文件名：\n\n```\nHTML(url).write_pdf(pdf_file)\n\
  ```\n\n- 3. 之后，编写入口点代码，设置应用于演示的 URL（在本练习中，我们将使用 **National Public Radio (NPR)**\
  \ 网站的文本版本）以及应用于写入 PDF 内容的文件名。设置完成后，代码调用 `generate_pdf()` 方法生成内容：\n\n```\n```python\n\
  if __name__ == '__main__':\n    url = 'http://text.npr.org'\n    pdf_file = 'demo_page.pdf'\n\
  \    generate_pdf(url, pdf_file)\n```\n```\n\n- 4. 现在，为查看代码的运行情况，运行以下命令：\n\n```\n\
  ```bash\npython3 pdf_demo.py\n```\n```\n\n命令执行完成后，你将在执行命令的同一目录中获得一个名为 `demo_page.pdf`\
  \ 的新 PDF 文件。打开文件时，它应类似于此处所示的内容：\n\n![](img/4840a43efd335abd10b93708225692d6_599_0.png)\n\
  \n图 13.7：使用 weasyprint 将网页转换为 PDF\n\n在生成的 PDF 文件中，我们可以看到内容似乎缺少实际网站的格式。这是因为 weasyprint\
  \ 包读取 HTML 内容但不解析页面的附加 CSS 样式表，因此页面格式丢失了。\n\nweasyprint 也使更改页面格式变得非常容易。这可以通过简单地向\
  \ write_pdf() 方法引入 stylesheets 参数来完成。对我们 generate_pdf() 方法的简单修改如下所示：\n\n```\nfrom\
  \ weasyprint import CSS, HTML\n\ndef generate_pdf(url, pdf_file):\n    \"\"\"Generate\
  \ PDF version of the provided URL.\"\"\"\n    print(\"Generating PDF...\")\n   \
  \ css = CSS(string='body{ font-size: 8px; }')\n    HTML(url).write_pdf(pdf_file,\
  \ stylesheets=[css])\n```\n\n现在，执行前面的代码后，我们会看到打印的 PDF 版本中 HTML body 内容中所有文本的字体大小为\
  \ 8px。\n\n> **重要说明**\n> weasyprint 中的 HTML 类也能够接受任何本地文件以及原始 HTML 字符串内容，并使用这些文件生成\
  \ PDF。有关更多信息，请访问 weasyprint 文档 https://weasyprint.readthedocs.io。\n\n到目前为止，我们已经了解了如何使用\
  \ Python 生成不同类型的二进制文件，这可以帮助我们以结构化方式导出数据，或帮助我们打印页面的 PDF 版本。接下来，我们将学习如何使用 Python 生成数据的图形表示。\n\
  \n## 在 Python 中玩转图表\n\n图表是直观表示特定维度内变化数据的绝佳方式。我们在日常生活中经常遇到图表，无论是每周的天气图表、股市走势，还是学生成绩单。\n\
  \n同样，图表在我们处理 Web 应用时也非常有用。对于 Bookr，我们可以使用图表作为视觉媒介来展示用户每周阅读了多少本书。或者，我们可以根据特定时间阅读给定书籍的读者数量来展示书籍随时间的受欢迎程度。现在，让我们看看如何使用\
  \ Python 生成绘图并让它们显示在我们的网页上。\n\n\n\n\n\n## 使用 plotly 生成图表\n\n在尝试可视化应用程序所维护数据中的模式时，图表会非常有用。有许多\
  \ Python 库可以支持开发者生成静态或交互式图表。\n\n在本书中，我们将使用 plotly，这是一个社区支持的 Python 库，可以生成图表并将其渲染到网页上。plotly\
  \ 特别吸引我们的一点是它易于与 Django 集成。\n\n要在你的系统上安装它，可以运行以下命令：\n\n```\npip install plotly\n\
  ```\n\n现在你已经完成了安装，让我们看看如何使用 plotly 生成一个图表可视化。\n\n## 设置图形对象\n\n在开始生成图表之前，我们需要初始化一个\
  \ plotly Figure 对象，它本质上充当图表的容器。plotly Figure 对象非常容易初始化；可以通过以下代码片段完成：\n\n```\nfrom\
  \ plotly.graph_objs import graphs\nfigure = graphs.Figure()\n```\n\nplotly 库的 `graph_objs`\
  \ 模块中的 `Figure()` 构造函数返回一个 Figure 图形容器的实例，图表可以在其中生成。一旦 Figure 对象就绪，我们必须生成一个绘图。\n\
  \n## 生成绘图\n\n绘图是数据集的可视化表示。这个绘图可以是散点图、折线图、图表等等。例如，要生成一个散点图，可以使用以下代码片段：\n\n```\nscatter_plot\
  \ = graphs.Scatter(x_axis_values, y_axis_values)\n```\n\n`Scatter` 构造函数接收 X 轴和 Y\
  \ 轴的值，并返回一个可用于构建散点图的对象。一旦生成了 `scatter_plot` 对象，下一步就是将此绘图添加到我们的 Figure 中。可以按如下方式完成：\n\
  \n```\nfigure.add_trace(scatter_plot)\n```\n\n`add_trace()` 方法负责将绘图对象添加到图形中，并在图形内部生成其可视化。\n\
  \n## 在网页上渲染绘图\n\n一旦绘图被添加到图形中，就可以通过调用 plotly 库的 `offline` 绘图模块中的 `plot()` 方法将其渲染到网页上。如下面的代码片段所示：\n\
  \n```\nfrom plotly.offline import plot\nvisualization_html = plot(figure, output_type='div')\n\
  ```\n\n`plot()` 方法接受两个主要参数：第一个是需要渲染的图形，第二个是容器 HTML 标签，图形 HTML 将在此容器内部生成。`plot` 方法返回完全集成的\
  \ HTML，可以嵌入到任何网页中，或作为模板的一部分来渲染图表。\n\n现在，了解了图表绘图的工作原理后，让我们尝试一个动手练习，为我们示例数据集生成一个图表。\n\
  \n## 练习 13.05 – 在 Python 中生成图表\n\n在本练习中，我们将使用 Python 生成一个图表绘图。它将是一个表示二维数据的散点图：\n\
  \n- 1. 在本练习中，我们将使用 `plotly` 库。要使用此库，我们需要通过运行以下命令将其安装到系统上：\n  \n      ```bash\n \
  \     pip install plotly\n      ```\n\n- 2. 现在库已安装，创建一个名为 `scatter_plot_demo.py`\
  \ 的新文件，并向其中添加以下导入语句：\n  \n      ```python\n      from plotly.offline import plot\n\
  \      import plotly.graph_objs as graphs\n      ```\n\n- 3. 导入完成后，创建一个名为 `generate_scatter_plot()`\
  \ 的方法，该方法接受两个参数——X 轴的值和 Y 轴的值：\n  \n      ```python\n      def generate_scatter_plot(x_axis,\
  \ y_axis):\n          \"\"\"Generate a scatter plot for the provided x and\n   \
  \          y-axis values.\"\"\"\n      ```\n\n- 4. 在此方法内部，首先创建一个对象作为图表的容器：\n  \n\
  \      ```python\n      figure = graphs.Figure()\n      ```\n\n5. 图表容器设置完成后，使用 X\
  \ 轴和 Y 轴的值创建一个新的 Scatter 对象，并将其添加到图表的 Figure 容器中：\n\n```\nscatter = graphs.Scatter(x=x_axis,\
  \ y=y_axis)\nfigure.add_trace(scatter)\n```\n\n6. 散点图就绪并已添加到图形后，最后一步是生成 HTML，该 HTML\
  \ 可用于在网页内渲染此绘图。为此，调用 `plot()` 方法并将图形容器对象传递给它。然后，在 HTML div 标签内渲染 HTML：\n\n```\n\
  return plot(figure, output_type='div')\n```\n\n完整的 `generate_scatter_plot()` 方法现在应如下所示：\n\
  \n```\ndef generate_scatter_plot(x_axis, y_axis):\n    figure = graphs.Figure()\n\
  \    scatter = graphs.Scatter(x=x_axis, y=y_axis)\n    figure.add_trace(scatter)\n\
  \    return plot(figure, output_type='div')\n```\n\n7. 一旦生成了绘图的 HTML，就需要将其渲染到某个地方。为此，创建一个名为\
  \ `generate_html()` 的新方法，该方法将绘图 HTML 作为参数，并渲染一个包含该绘图的 HTML 文件：\n\n```\ndef generate_html(plot_html):\n\
  \    \"\"\"Generate an HTML page for the provided plot.\"\"\"\n    html_content\
  \ = \"<html><head><title>Plot Demo</title></head><body>{}</body></html>\"\n    .format(plot_html)\n\
  \    try:\n        with open('plot_demo.html', 'w') as plot_file:\n            plot_file.write(html_content)\n\
  \    except (IOError, OSError) as file_io_error:\n        print(\"Unable to generate\
  \ plot file. Exception: {}\".format(file_io_error))\n```\n\n8. 方法设置完成后，最后一步是调用它。为此，创建一个脚本入口点，设置\
  \ X 轴列表和 Y 轴列表的值，然后调用 `generate_scatter_plot()` 方法。使用该方法返回的值，调用 `generate_html()`\
  \ 方法，该方法将创建一个包含散点图的 HTML 页面：\n\n```\nif __name__ == '__main__':\n    x = [1,2,3,4,5]\n\
  \    y = [3,8,7,9,2]\n    plot_html = generate_scatter_plot(x, y)\n    generate_html(plot_html)\n\
  ```\n\n9. 代码就绪后，运行该文件并查看生成的输出。要运行代码，请执行以下命令：\n\n```\npython3 scatter_plot_demo.py\n\
  ```\n\n执行完成后，将在脚本执行的同一目录中生成一个新的 `plot_demo.html` 文件。打开该文件后，你应该会看到以下内容：\n\n![](img/4840a43efd335abd10b93708225692d6_604_0.png)\n\
  \n![](img/4840a43efd335abd10b93708225692d6_604_1.png)\n\n图 13.8：使用 plotly 在浏览器中生成的图表\n\
  \n至此，我们已经生成了第一个散点图，其中不同的点通过一条线连接起来。\n\n在本练习中，我们使用 plotly 库生成了一个可以在浏览器中渲染的图表，以便读者可视化数据。\n\
  \n现在，你了解了如何在 Python 中处理图表，以及如何从它们生成 HTML 页面。\n\n但作为 Web 开发者，你如何在 Django 中使用这些图表呢？让我们来了解一下。\n\
  \n## 将 plotly 与 Django 集成\n\nplotly 生成的图表非常容易嵌入到 Django 模板中。由于 `plot()` 方法返回完全包含的\
  \ HTML，可用于渲染图表，我们可以将返回的 HTML 作为 Django 中的模板变量并按原样传递。然后，Django 模板引擎将在最终模板显示在浏览器中之前，将该生成的\
  \ HTML 添加到最终模板中。\n\n以下是一些示例代码：\n\n```\ndef user_profile(request):\n    username\
  \ = request.user.get_username()\n    scatter_plot_html = scatter_plot_books_read(username)\n\
  \    return render(request, 'user_profile.html',\n                  context={'plt_div':\
  \ scatter_plot_html})\n```\n\n前面的代码将使模板中使用的 `{{ plt_div }}` 内容被存储在 `scatter_plot_demo`\
  \ 变量中的 HTML 替换，最终模板将渲染每周阅读书籍数量的散点图。\n\n现在，让我们深入探讨如何处理向 Django 添加可视化，以及通过绘图和图表增强应用程序体验。\n\
  \n## 将可视化与 Django 集成\n\n在前几节中，你学习了如何以不同格式读写数据，以满足用户的不同需求。但是我们如何将所学内容与 Django 集成呢？\n\
  \n例如，在 Bookr 中，我们可能希望允许用户导出他们阅读过的书籍列表，或者可视化他们一年中的阅读活动。这该如何实现？下一个练习将聚焦于这一方面。你将学习目前所见的组件如何集成到\
  \ Django Web 应用程序中。\n\n## 练习 13.06 – 在用户个人资料页面上可视化用户的阅读历史\n\n在本练习中，我们将修改用户的个人资料页面，以便用户在访问\
  \ Bookr 上的个人资料页面时，能够可视化其书籍阅读历史。\n\n让我们看看如何实现：\n\n- 1. 要开始集成可视化用户阅读历史的功能，你需要安装 plotly\
  \ 库。为此，请在终端中运行以下命令：\n  \n  ```\n  pip install plotly\n  ```\n\n\n\n\n\n2. 安装完库后，下一步是编写代码来获取用户总共阅读的书籍数量以及用户按月阅读的书籍数量。为此，在\
  \ `bookr` 应用目录下创建一个名为 `utils.py` 的新文件，并添加所需的导入，这些导入将用于从 `reviews` 应用的 `Review` 模型中获取用户的图书阅读历史：\n\
  \n```python\nimport datetime\n\nfrom django.db.models import Count\nfrom reviews.models\
  \ import Review\n```\n\n3. 接下来，创建一个名为 `get_books_read_by_month()` 的新工具方法，该方法接收需要获取阅读历史的用户的用户名。\n\
  \n4. 在此方法内部，我们将查询 `Review` 模型并返回用户按月阅读的书籍字典：\n\n```python\ndef get_books_read_by_month(username):\n\
  \    \"\"\"Get the books read by the user on per month basis.\n\n    :param: str\
  \ The username for which the books needs to be returned\n\n    :return: dict of\
  \ month wise books read\n    \"\"\"\n    current_year = datetime.datetime.now().year\n\
  \n    books = Review.objects.filter(\n        creator__username__contains=username,\n\
  \        date_created__year=current_year\n    ).values('date_created__month').annotate(book_count=Count('book__title'))\n\
  \    return books\n```\n\n现在，让我们检查以下查询，该查询负责获取今年每月阅读书籍的结果：\n\n```python\nReview.objects.filter(\n\
  \    creator__username__contains=username,\n    date_created__year=current_year\n\
  ).values('date_created__month').annotate(book_count=Count('book__title'))\n```\n\
  \n```python\n# Set the value for books read per month on Y-Axis\nfor num_books_read\
  \ in books_read_by_month:\n    list_index = num_books_read['date_created__month']\
  \ - 1\n    books_read[list_index] = num_books_read['book_count']\n\n# Generate a\
  \ scatter plot HTML\nfigure = graphs.Figure()\nscatter = graphs.Scatter(x=months,\
  \ y=books_read)\nfigure.add_trace(scatter)\nfigure.update_layout(xaxis_title=\"\
  Month\",\n                     yaxis_title=\"No. of books read\")\nplot_html = plot(figure,\
  \ output_type='div')\n# Add to template\nreturn render(request, 'profile.html',\n\
  \              {'user': user, 'permissions': permissions,\n               'books_read_plot':\
  \ plot_html})\n```\n\n在此方法中，你做了几件事。首先，你调用了 `get_books_read_by_month()` 方法并提供了当前登录用户的用户名。此方法返回给定用户在当年按月阅读的书籍列表：\n\
  \n```python\nbooks_read_by_month = get_books_read_by_month(user.username)\n```\n\
  \n你接下来做的就是使用一些默认值预先初始化图表的 X 轴和 Y 轴。对于此可视化，使用 X 轴显示月份，Y 轴显示阅读书籍的数量。\n\n现在，由于你已经知道一年只有\
  \ 12 个月，因此使用 1 到 12 之间的值预先初始化 X 轴：\n\n```python\nmonths = [i+1 for i in range(12)]\n\
  ```\n\n对于已阅读的书籍，将 Y 轴初始化为全部 12 个索引都设为 0，如下所示：\n\n```python\nbooks_read = [0 for\
  \ _ in range(12)]\n```\n\n现在预初始化完成后，填充每月阅读书籍的实际值。为此，遍历对 `get_books_read_by_month(user.username)`\
  \ 的调用所得到的结果列表，并从中提取月份和当月的书籍数量。\n\n一旦提取了书籍数量和月份，下一步是将 `book_count` 值分配给 `books_read`\
  \ 列表的月份索引：\n\n```python\nfor num_books_read in books_read_by_month:\n    list_index\
  \ = num_books_read['date_created__month'] - 1\n    books_read[list_index] = num_books_read['book_count']\n\
  ```\n\n现在轴的值已设置，使用 plotly 库生成散点图：\n\n```python\nfigure = graphs.Figure()\nscatter\
  \ = graphs.Scatter(x=months, y=books_read)\nfigure.add_trace(scatter)\nfigure.update_layout(xaxis_title=\"\
  Month\",\n                     yaxis_title=\"No. of books read\")\nplot_html = plot(figure,\
  \ output_type='div')\n```\n\n生成图表的 HTML 后，使用 `render()` 方法将其传递给模板，以便在个人资料页面上可视化：\n\
  \n```python\nreturn render(request, 'profile.html',\n              {'user': user,\
  \ 'permissions': permissions,\n               'books_read_plot': plot_html})\n```\n\
  \n7. 在创建了视图函数后，下一步是修改模板以渲染此图表。为此，打开 `templates` 目录下的 `profile.html` 文件，并在最后一个 `{%\
  \ endblock %}` 语句之前添加以下突出显示的代码到文件中：\n\n```html\n{% extends \"base.html\" %}\n\n\
  {% block title %}Bookr{% endblock %}\n\n{% block heading %}Profile{% endblock %}\n\
  \n{% block content %}\n    <ul>\n        <li>Username: {{ user.username }} </li>\n\
  \        <li>Name: {{ user.first_name }} {{ user.last_name }}</li>\n        <li>Date\
  \ Joined: {{ user.date_joined }} </li>\n        <li>Email: {{ user.email }}</li>\n\
  \        <li>Last Login: {{ user.last_login }}</li>\n        <li>Groups: {{ groups\
  \ }}{% if not groups %}None{% endif %} </li>\n    </ul>\n    {% autoescape off %}\n\
  \    {{ books_read_plot }}\n    {% endautoescape %}\n\n{% endblock %}\n```\n\n此代码片段将\
  \ `books_read_plot` 变量添加到视图函数中传递，以便在我们的 HTML 模板中使用。另请注意，此变量的 `autoescape` 已设置为关闭。这是因为该变量包含由\
  \ plotly 库生成的 HTML。如果允许 Django 转义 HTML，你将在个人资料页面上只看到原始 HTML 而不是图表可视化。\n\n至此，你已成功将图表集成到应用程序中。\n\
  \n8. 要尝试可视化，运行以下命令，然后通过访问 http://localhost:8080/accounts/profile 导航到你的用户个人资料\n\n\
  ```bash\npython manage.py runserver localhost:8080\n```\n\n你应该会看到一个类似于此处所示的页面：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_610_0.png)\n\n图 13.9：用户图书阅读历史散点图\n\n\
  在此练习中，你学习了如何将绘图库与 Django 集成以可视化用户的阅读历史。同样，Django 允许你将任何通用 Python 代码集成到 Web 应用程序中，唯一的限制是集成产生的<|message|>\
  \ 数据应转换为有效的 HTTP 响应，该响应可以由任何标准 HTTP 兼容工具处理，例如 Web 浏览器或命令行工具，例如 curl。\n\n## 活动 13.01\
