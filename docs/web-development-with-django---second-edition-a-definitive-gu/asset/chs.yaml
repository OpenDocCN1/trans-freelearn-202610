  \ 模型的字符串表示应输出出版商的名称。为了测试这一点，我们创建了一个名为 test_str_representation() 的新方法，并检查生成的模型字符串表示是否与我们期望的一致：\n\
  \n```\ndef test_str_representation(self):\n    self.assertEquals(str(self.p), \"\
  Packt\")\n```\n\n为了执行此验证，我们使用了 unittest 库的 assertEquals 方法，它验证传递给它的两个值是否相等。\n\n\
  6. 测试用例现在已就位，你可以运行它们来查看会发生什么。要运行这些测试用例，运行以下命令：\n\n```\npython manage.py test\n```\n\
  \n\n\n一旦命令执行完毕，你将看到与此处所示类似的输出：\n\n```\n% python manage.py test\nCreating test database\
  \ for alias 'default'...\nSystem check identified no issues (0 silenced).\n..\n\
  ----------------------------------------------------------------------\nRan 2 tests\
  \ in 0.002s\n\nOK\nDestroying test database for alias 'default'...\n```\n\n正如前述输出所示，测试用例已成功执行，从而验证了诸如创建新的\
  \ Publisher 对象以及在获取时对其字符串表示的操作等，都是正确进行的。\n\n通过本练习，我们看到了如何轻松地为 Django 模型编写测试用例，并通过创建对象、检索它们并对其进行表示来验证其功能。\n\
  \n此外，请注意练习 14.02 中测试 Django 模型的输出中的以下重要行：\n\n```\n\"Destroying test database for\
  \ alias 'default'...\"\n```\n\n这是因为当存在需要将数据持久化到数据库中的测试用例时，Django 不会使用生产数据库，而是为测试用例创建一个新的空数据库，用于在测试用例中持久化值。\n\
  \n现在我们知道了如何在 Django 中测试模型，在下一节中，我们将学习如何在 Django 中测试视图。\n\n## 测试 Django 视图\n\nDjango\
  \ 中的视图根据用户在 Web 应用程序中访问的 URL 控制 HTTP 响应的渲染。在本节中，我们将学习如何在 Django 中测试视图。假设你正在开发一个网站，其中需要大量应用程序编程接口\
  \ API 端点。一个有趣的问题是，你将如何验证每个新端点？如果手动操作，每次添加新端点时你都必须先部署应用程序，然后手动在浏览器中访问该端点以验证其是否正常工作。这种方法在端点数量较少时可能可行，但在端点数以百计时可能会变得极其繁琐。\n\
  \nDjango 提供了非常全面的应用程序视图测试方式。这是通过使用 Django 测试模块提供的测试客户端类来实现的。此类可用于访问映射到视图的 URL 并捕获访问\
  \ URL 端点时生成的输出。然后，我们可以使用捕获的输出来测试 URL 是否生成正确的响应。此客户端可通过从 Django 测试模块导入 Client 类然后对其进行初始化来使用，如以下代码段所示：\n\
  \n```python\nfrom django.test import Client\n\nc = Client()\n```\n\nClient 对象支持多种方法，可用于模拟用户可以发出的不同\
  \ HTTP 调用——即 GET、POST、PUT、DELETE 等。进行此类请求的一个示例如下所示：\n\n```python\nresponse = c.get('/welcome')\n\
  ```\n\n视图生成的响应随后会被客户端捕获并作为响应对象暴露出来，然后可以查询该对象以验证视图的输出。\n\n有了这些知识，让我们来看看如何为 Django\
  \ 视图编写测试用例。\n\n### 练习 14.03 – 为 Django 视图编写单元测试\n\n在本练习中，我们将使用 Django 测试客户端为映射到特定\
  \ URL 的 Django 视图编写测试用例。这些测试用例将帮助你验证在通过其映射的 URL 访问时，View 函数是否生成正确的响应。让我们开始逐步操作：\n\
  \n1. 对于本练习，你将使用在 *练习 14.02 – 测试 Django 模型* 的 *步骤 1* 中创建的 `bookr_test` 应用程序。开始时，打开\
  \ `bookr_test` 目录下的 `views.py` 文件并向其中添加以下代码：\n\n```python\nfrom django.http import\
  \ HttpResponse\n\ndef greeting_view(request):\n    \"\"\"Greet the user.\"\"\"\n\
  \    return HttpResponse(\"Hey there, welcome to Bookr!\\n    Your one stop place\
  \ to review books.\")\n```\n\n在这里，你创建了一个简单的 Django 视图，用于在用户访问映射到所提供视图的端点时向用户发送欢迎问候。\n\
  \n2. 创建视图后，你需要将其映射到可在浏览器或测试客户端中访问的 URL 端点。为此，打开 `bookr_test` 目录下的 urls.py 文件并将高亮代码添加到\
  \ urlpatterns 列表中：\n\n```python\nfrom django.urls import path\nfrom . import views\n\
  \nurlpatterns = [\n    path('test/greeting', views.greeting_view,\n        name='greeting_view')\n\
  ]\n```\n\n在前面的代码片段中，我们通过在 urlpatterns 列表中设置路径，将 greeting_view 映射到应用程序的 `'test/greeting'`\
  \ 端点。\n\n3. 设置此路径后，我们需要确保它也能被我们的项目识别。为此，我们需要将此条目添加到 Bookr 项目的 URL 映射中。为实现这一点，打开\
  \ bookr 目录中的 urls.py 文件并将以下高亮行附加到 urlpatterns 列表的末尾：\n\n```python\nurlpatterns =\
  \ [\n    '...',\n    '...',\n    path('', include('bookr_test.urls'))\n]\n```\n\n\
  4. 设置视图后，验证其是否正常工作。通过运行以下命令来执行此操作：\n\n```\npython manage.py runserver localhost:8080\n\
  ```\n\n然后，在你的 Web 浏览器中访问 http://localhost:8080/test/greeting。页面打开后，你应该会看到在步骤 1 中添加到\
  \ greeting view 的以下文本显示在浏览器中：\n\n```\nHey there, welcome to Bookr! Your one stop\
  \ place to review books.\n```\n\n5. 现在，我们准备为 `greeting_view` 编写测试用例。对于本练习，我们将编写一个测试用例，检查在访问\
  \ `/test/greeting` 端点时是否获得成功结果。为实现此测试用例，打开 `bookr_test` 目录下的 `tests.py` 文件并将以下代码添加到文件末尾：\n\
  \n```python\nfrom django.test import TestCase, Client\n\nclass TestGreetingView(TestCase):\n\
  \    \"\"\"Test the greeting view.\"\"\"\n    def setUp(self):\n        self.client\
  \ = Client()\n\n    def test_greeting_view(self):\n        response = self.client.get('/test/greeting')\n\
  \        self.assertEquals(response.status_code, 200)\n```\n\n在前面的代码片段中，我们定义了一个测试用例，帮助验证\
  \ greeting view 是否正常工作。\n\n这是通过首先导入 Django 的测试客户端来实现的，该客户端允许你通过对其进行调用并分析生成的响应来测试映射到\
  \ URL 的视图：\n\n```python\nfrom django.test import TestCase, Client\n```\n\n导入完成后，我们必须创建一个名为\
  \ `TestGreetingView` 的新类，用于对在 *步骤 2* 中创建的 greeting view 相关的测试用例进行分组：\n\n```python\n\
  class TestGreetingView(TestCase):\n```\n\n在此测试用例中，我们定义了两个方法，`setUp()` 和 `test_greeting_view()`。`test_greeting_view()`\
  \ 方法实现了你的测试用例。在其中，我们首先向映射到 greeting view 的 URL 发出 HTTP GET 调用，并将视图生成的响应存储在创建的 response\
  \ 对象中：\n\n```python\nresponse = self.client.get('/test/greeting')\n```\n\n此调用完成后，其\
  \ HTTP 响应代码、内容和标头将可在 response 变量中使用。接下来，通过以下代码，我们进行断言，验证调用生成的状态码是否与成功 HTTP 调用的状态码\
  \ HTTP 200 匹配：\n\n```python\nself.assertEquals(response.status_code, 200)\n```\n\
  \n至此，我们已准备好运行测试。\n\n幸运的是，Django 的测试客户端提供了此功能，通过它我们可以登录到我们的视图然后对其运行测试。可以使用 Django\
  \ 的测试客户端 `login()` 方法实现此结果。当此方法被调用时，Django 的测试客户端会对服务执行身份验证操作。如果身份验证成功，它会将登录 cookie\
  \ 内部存储起来，以便在后续测试中使用。以下代码片段展示了如何设置 Django 的测试客户端以模拟已登录用户：\n\n```python\nlogin = self.client.login(username='testuser',\n\
  \                          password='testpassword')\n```\n\nlogin 方法需要用于测试的测试用户的用户名和密码，如下一练习所示。因此，让我们看看如何测试需要用户身份验证的流程。\n\
  \n### 练习 14.04 – 编写测试用例以验证已认证用户\n\n在本练习中，我们将为需要用户身份验证的视图编写测试用例。作为其一部分，我们将验证当未登录用户尝试访问页面时以及当已登录用户尝试访问映射到视图函数的页面时，视图方法生成的输出。让我们开始逐步操作：\n\
  \n1. 对于本练习，我们将使用你在练习 14.02 – 测试 Django 模型 的步骤 1 中创建的 `bookr_test` 应用程序。开始时，打开 `bookr_test`\
  \ 应用程序下的 views.py 文件并向其中添加以下代码：\n\n```python\nfrom django.http import HttpResponse\n\
  from django.contrib.auth.decorators import login_required\n```\n\n2. 添加前面的代码片段后，在文件末尾创建一个名为\
  \ `greeting_view_user()` 的新函数，如以下代码片段所示：\n\n```python\n@login_required\ndef greeting_view_user(request):\n\
  \    \"\"\"Greeting view for the user.\"\"\"\n    user = request.user\n    return\
  \ HttpResponse(\"Welcome to Bookr!\\n{username}\".format(username=user))\n```\n\n\
  在这里，我们创建了一个简单的 Django 视图，用于在已登录用户访问映射到所提供视图的端点时向其发送欢迎问候。\n\n\n\n\n3. 创建此视图后，我们需要将该视图映射到一个\
  \ URL 端点，以便可以在浏览器或测试客户端中访问。为此，请打开 `bookr_test` 目录下的 `urls.py` 文件，并向其中添加高亮显示的代码：\n\
  \n```\nfrom django.urls import path\nfrom . import views\n\nurlpatterns = [\n  \
  \  path('test/greet_user', views.greeting_view_user,\n        name='greeting_view_user')\n\
  ]\n```\n\n在上面的代码片段中，我们通过设置 `urlpatterns` 列表中的路径，将 `greeting_view` 映射到了应用的 `'test/greet_user'`\
  \ 端点：\n\n```\npath('test/greet_user', views.greeting_view_user,\n    name='greeting_view_user')\n\
  ```\n\n如果你已经完成了之前的练习，这个 URL 应该已经设置好，可用于项目中的检测，无需采取进一步步骤来配置 URL 映射。\n\n4. 视图设置完成后，接下来我们需要验证其是否能正确工作。为此，运行以下命令：\n\
  \n```\npython manage.py runserver localhost:8080\n```\n\n然后，在您的 Web 浏览器中访问 http://localhost:8080/test/greet_user。\n\
  \n如果您尚未登录，访问上述 URL 时，您将被重定向到项目的登录页面。\n\n5. 现在，为 `greeting_view_user` 编写测试用例，这些用例检查访问\
  \ `/test/greet_user` 端点时是否获得成功结果。要实现此测试用例，请打开 `bookr_test` 目录下的 `tests.py` 文件，并向其中添加以下代码：\n\
  \n```\nfrom django.contrib.auth.models import User\n\nclass TestLoggedInGreetingView(TestCase):\n\
  \    \"\"\"Test the greeting view for the authenticated users.\"\"\"\n    def setUp(self):\n\
  \        test_user =\n            User.objects.create_user(\n                username='testuser',\n\
  \                password='test@#628password')\n        test_user.save()\n     \
  \   self.client = Client()\n\n    def test_user_greeting_not_authenticated(self):\n\
  ```\n\n```\nresponse = self.client.get('/test/greet_user')\nself.assertEquals(response.status_code,\
  \ 302)\n\ndef test_user_authenticated(self):\n    login = self.client.login(username='testuser',\n\
  \            password='test@#628password')\n    response = self.client.get('/test/greet_user')\n\
  \    self.assertEquals(response.status_code, 200)\n```\n\n在上面的代码片段中，我们实现了一个测试用例，该用例检查那些在内容可见之前需要启用身份验证的视图。\n\
  \n这里，首先我们导入了用于定义测试用例和初始化测试客户端所需的类和方法：\n\n```\nfrom django.test import TestCase,\
  \ Client\n```\n\n接下来，您需要从 Django 的 auth 模块中导入 User 模型：\n\n```\nfrom django.contrib.auth.models\
  \ import User\n```\n\n这个模型是必需的，因为对于需要身份验证的测试用例，我们需要初始化一个新的测试用户。接下来，我们创建了一个名为 `TestLoggedInGreetingView`\
  \ 的新类，它封装了与 `greeting_user` 视图（该视图需要身份验证）相关的测试。在这个类中，我们定义了三个方法：`setUp()`、`test_user_greeting_not_authenticated()`\
  \ 和 `test_user_authenticated()`。`setUp()` 方法用于初始化测试用户，该用户将用于身份验证。这是必需的步骤，因为 Django\
  \ 中的测试环境是一个完全隔离的环境，它不会使用生产应用程序中的数据，因此所有必需的模型和对象都需要在测试环境中单独实例化。\n\n然后，我们使用以下代码创建了测试用户并初始化了测试客户端：\n\
  \n```\ntest_user = User.objects.create_user(\n    username='testuser', password='test@#628password')\n\
  test_user.save()\nself.client = Client()\n```\n\n接下来，我们为用户未通过身份验证时的 `greet_user`\
  \ 端点编写了测试用例。在这里，您应期望 Django 将用户重定向到登录端点。此重定向可以通过检查响应的 HTTP 状态代码来检测，该状态代码应设置为 HTTP\
  \ 302，表示重定向操作：\n\n```python\ndef test_user_greeting_not_authenticated(self):\n \
  \   response = self.client.get('/test/greet_user')\n    self.assertEquals(response.status_code,\
  \ 302)\n```\n\n接下来，我们编写了另一个测试用例，以检查当用户通过身份验证时，`greet_user` 端点是否成功渲染。要对用户进行身份验证，您必须首先调用测试客户端的\
  \ `login()` 方法，并通过提供您在 `setUp()` 方法中创建的测试用户的用户名和密码来执行身份验证，如下所示：\n\n```python\nlogin\
  \ = self.client.login(username='testuser',\n                          password='test@#628password')\n\
  ```\n\n登录完成后，我们必须向 `greet_user` 端点发出 HTTP GET 请求，并通过检查返回响应的 HTTP 状态代码来验证端点是否生成了正确的结果：\n\
  \n```python\nresponse = self.client.get('/test/greet_user')\nself.assertEquals(response.status_code,\
  \ 200)\n```\n\n6. 测试用例编写完成后，下面来检查它们如何运行。为此，运行以下命令：\n\n```bash\npython manage.py\
  \ test\n```\n\n执行完成后，我们可以预期看到类似如下的响应：\n\n```text\n% python manage.py test\nCreating\
  \ test database for alias 'default'...\nSystem check identified no issues (0 silenced).\n\
  .....\n----------------------------------------------------------------------\n\
  Ran 5 tests in 0.366s\n\nOK\nDestroying test database for alias 'default'...\n```\n\
  \n从上面的输出中我们可以看出，我们的测试用例已成功通过，这验证了我们创建的视图能够生成预期的响应：如果用户未通过身份验证，则将用户重定向到网站；如果用户已通过身份验证，则允许用户查看页面。\n\
  \n```\nOK\nDestroying test database for alias 'default'...\n```\n\n从输出中可以看出，我们编写的测试用例已成功通过，从而验证了\
  \ RequestFactory 类的行为。\n\n通过本次练习，我们学习了如何利用 RequestFactory 为视图函数编写测试用例，将请求对象直接传递给视图函数，而不是使用测试客户端模拟\
  \ URL 访问，从而实现更直接的测试。\n\n在下一节中，我们将测试基于类的视图。\n\n## 测试基于类的视图\n\n在之前的练习中，我们了解了如何测试定义为方法的视图。但基于类的视图又如何？我们应该如何测试它们呢？\n\
  \n事实证明，测试基于类的视图非常容易。例如，如果我们有一个名为 `ExampleClassView(View)` 的基于类的视图，要测试该视图，我们只需使用以下语法：\n\
  \n```\nresponse = ExampleClassView.as_view()(request)\n```\n\n就这么简单。\n\nDjango 应用程序通常由几个不同的组件组成，有些组件可以单独工作，例如模型，而另一些组件则需要与\
  \ URL 映射和框架的其他部分交互才能工作。测试这些不同的组件可能需要一些仅针对这些组件的通用步骤。例如，在测试模型时，我们可能希望在开始测试之前先创建 Model\
  \ 类的某些对象；或者对于视图，我们可能希望先用用户凭据初始化测试客户端。\n\n事实证明，Django 还基于 TestCase 类提供了其他一些类，这些类可用于针对所使用的组件类型编写特定类型的测试用例。让我们看看\
  \ Django 提供的不同类。\n\n## Django 中的测试用例类\n\n除了 Django 提供的基础 TestCase 类（可用于为不同组件定义大量测试用例）之外，Django\
  \ 还提供了一些从 TestCase 类派生的专门类。\n\n这些类根据它们为开发人员提供的功能，用于特定类型的测试用例。让我们看看 Django 提供的不同类。\n\
  \n\n\n\n## SimpleTestCase 类\n\n此类派生自 Django 测试模块提供的 `TestCase` 类，应在编写用于测试视图函数的简单测试用例时使用。通常，当测试用例涉及数据库查询时，不建议使用此类。该类还提供了许多实用功能，例如：\n\
  \n- 检查视图函数引发的异常\n- 测试表单字段\n- 内置测试客户端\n- 验证视图函数执行的重定向\n- 匹配视图函数生成的两个 HTML、JSON 或\
  \ XML 输出是否相等\n\n现在我们已经基本了解了 `SimpleTestCase` 类，接下来继续了解另一种测试用例类，它可以帮助我们编写与数据库交互相关的测试用例。\n\
  \n## TransactionTestCase 类\n\n此类派生自 `SimpleTestCase` 类，应在编写涉及数据库交互的测试用例时使用，例如数据库查询、创建模型对象等。\n\
  \n该类提供了以下附加功能：\n\n- 在测试用例运行前将数据库重置为默认状态\n- 可以根据数据库功能跳过测试；如果用于测试的数据库不支持生产数据库的全部功能，这一功能会非常方便\n\
  \n## LiveServerTestCase 类\n\n此类与 `TransactionTestCase` 类类似，但有一个小区别：使用此类编写的测试用例不使用默认测试客户端，而是使用由\
  \ Django 创建的实时服务器。\n\n在编写用于测试已渲染网页及其交互的测试用例时，运行实时服务器的能力非常有用，因为使用默认测试客户端无法完成这类测试。\n\
  \n此类测试用例可以利用 Selenium 等工具，通过与已渲染页面交互来修改页面状态，从而构建交互式测试用例。\n\n## 模块化测试代码\n\n在前面的练习中，我们了解了如何为项目的不同组件编写测试用例。但需要注意的是，到目前为止，我们一直将所有组件的测试用例都写在同一个文件中。\n\
  \n当应用程序中的视图和模型数量不多时，这种方式没有问题。但随着应用程序不断增长，这种方式可能会带来问题，因为此时单个 `tests.py` 文件将难以维护。\n\
  \n为了避免出现这种情况，我们应尝试将测试用例模块化，将模型测试用例与视图及其他属性相关的测试用例分开保存。要实现模块化，只需执行以下两个简单步骤：\n\n-\
  \ 1. 在应用程序目录中运行以下命令，创建一个名为 tests 的新目录：\n\n```\nmkdir tests\n```\n\n- 2. 在 tests\
  \ 目录中运行以下命令，创建一个名为 __init__.py 的新空文件：\n\n```\ntouch __init__.py\n```\n\nDjango 需要这个\
  \ __init__.py 文件，才能正确识别我们创建的 tests 目录，将其视为模块而不是普通目录。\n\n完成上述步骤后，就可以为应用程序中的不同组件创建新的测试文件。例如，要为模型编写测试用例，可以在\
  \ tests 目录中创建一个名为 test_models.py 的新文件，并将与模型测试相关的代码添加到该文件中。\n\n此外，运行测试时不需要执行其他额外步骤。相同的命令也可以正常运行模块化的测试代码：\n\
  \n```\npython manage.py test\n```\n\n至此，我们已经了解了如何为项目编写测试用例。那么，不如应用这些知识，为正在开发的 Bookr\
  \ 项目编写测试用例吧？\n\n## 总结\n\n本章学习了如何使用 Django 为 Web 应用程序项目的不同组件编写测试用例。我们了解了测试为何在任何 Web\
  \ 应用程序的开发过程中都发挥着关键作用，也了解了业界采用的不同测试技术，以确保发布的应用程序代码稳定且没有错误。\n\n然后，我们了解了如何使用 Django\
  \ 测试模块提供的 TestCase 类来实现单元测试，该类可用于测试模型和视图。我们还了解了如何使用 Django 测试客户端测试视图函数，其中一些视图函数要求用户经过身份验证。此外，我们还简要介绍了使用\
  \ RequestFactory 测试基于方法的视图和基于类的视图的另一种方法。\n\n最后，我们通过了解 Django 提供的预定义类及其适用场景结束了本章，同时还了解了如何将测试代码模块化，使其结构更加整洁。\n\
  \n进入下一章后，我们将了解如何通过将第三方库集成到项目中，使 Django 应用程序更加强大。我们将使用这一功能在 Django 应用程序中实现第三方身份验证，让用户能够通过\
  \ Google Sign-In、Facebook Sign-In 等常用服务登录应用程序。\n"
- "## Django 第三方库\n\n由于 Django 自 2007 年以来一直存在，因此已经形成了丰富的第三方库生态系统，可以将这些库插入应用程序，为其提供额外功能。到目前为止，我们已经学习了许多\
  \ Django 知识，并使用了它的许多功能，包括数据库模型、URL 路由、模板、表单等。我们直接使用这些 Django 工具构建了 Web 应用程序，但现在我们将了解如何利用他人的工作，快速为自己的应用程序添加更多高级功能。我们之前提到过用于存储文件的应用程序（在第\
  \ 5 章“提供静态文件”中，我们提到过一个名为 django-storages 的应用程序，它可以将静态文件存储在 CDN 中），但除了文件存储之外，我们还可以使用应用程序接入第三方身份验证系统、集成支付网关、自定义设置的构建方式、修改图像、更轻松地构建表单、调试网站、使用不同类型的数据库，以及完成更多工作。如果你想添加某项功能，很可能已经存在能够实现该功能的应用程序。\n\
  \n本章无法涵盖所有应用程序，因此我们只关注其中四个应用程序，它们能够为许多不同类型的应用程序提供实用功能。django-configurations 允许你使用类配置\
  \ Django 设置，并利用继承简化不同环境的设置。这一功能可以与 dj-database-urls 配合使用，只需通过一个 URL 指定数据库连接设置。Django\
  \ Debug Toolbar 可以让你直接在浏览器中获取额外信息，以帮助调试。最后要介绍的应用程序是 django-crispy-forms，它提供了额外的\
  \ CSS 类，使表单外观更加美观，同时还可以仅使用 Python 代码更轻松地进行配置。\n\n对于这些库中的每一个，我们都将介绍其安装、基本设置和使用方式，主要说明它们如何应用于\
  \ Bookr。它们还提供了更多配置选项，可以进一步定制以满足应用程序的需求。这些应用程序都可以使用 pip 安装。\n\n我们还将简要介绍 django-allauth，它允许\
  \ Django 应用程序通过第三方提供商（例如 Google、GitHub、Facebook 和 Twitter）对用户进行身份验证。我们不会详细介绍它的安装和设置，但会提供一些示例，帮助你完成配置。\n\
  \n本章将涵盖以下主题：\n\n- 环境变量\n- `django-configurations`\n- `dj-database-urls`\n- Django\
  \ Debug Toolbar\n- `django-crispy-forms`\n- `django-allauth`\n\n## 技术要求\n\n本章的所有代码文件都可以在以下地址找到：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter15。\n\
  \n## 环境变量\n\n创建程序时，我们通常希望用户能够配置程序的某些行为。例如，假设你有一个连接数据库并将找到的所有记录保存到文件中的程序。通常，它可能只会向终端输出一条*成功*消息，但你可能还希望在*调试模式*下运行它，使其同时输出正在执行的所有\
  \ SQL 语句。\n\n配置此类程序有很多方法。例如，可以让程序从配置文件中读取设置。但在某些情况下，用户可能希望快速使用特定设置（例如调试模式）运行 Django\
  \ 服务器，然后再次关闭该设置运行服务器。每次都修改配置文件可能很不方便。在这种情况下，我们可以从*环境变量*中读取设置。环境变量是可以在操作系统中设置、然后由程序读取的键值对。设置环境变量有以下几种方式：\n\
  \n- Shell（终端）可以在启动时从配置文件脚本中读取变量，之后每个程序都可以访问这些变量。\n- 可以在终端中设置变量，随后启动的任何程序都可以使用该变量。在\
  \ Linux 和 macOS 中，可以使用 `export` 命令完成此操作；Windows 使用 `set` 命令。以这种方式设置的变量会覆盖配置文件脚本中的变量，但只对当前会话有效。关闭终端后，这些变量就会丢失。\n\
  - 可以在终端运行命令的同时设置环境变量。这些变量只会在正在运行的程序中持续存在，并且会覆盖已导出的环境变量以及从配置文件脚本中读取的变量。\n- 可以在正在运行的程序内部设置环境变量，这些变量只会在该程序内部可用（或者对该程序启动的其他程序可用）。以这种方式设置的环境变量会覆盖我们刚才介绍的所有其他方式设置的变量。\n\
  \n\n\n\n\n在 Linux 和 macOS 上，我们也可以通过在命令前设置它们来提供环境变量（实际命令只是 `python3 env_example.py`）：\n\
  \n```\n$ VAR2=\"Set From Command Line\" VAR3=\"Also Set From Command Line\"\npython3\
  \ env_example.py\n```\n\n**重要说明**\n请注意，前面的命令在 Windows 上无法工作。对于 Windows，环境变量必须在执行前设置，不能同时传入。\n\
  \n此前面命令的输出如下：\n\n```\nUNSET_VAR:UNSET_VAR_VALUE\nSET_VAR:Set Using Export\nHOME:\
  \ /Users/ben\nVAR1: Set Using Export\nVAR2: Set From Command Line\nVAR3: Also Set\
  \ From Command Line\nVAR4:\n```\n\nPython 脚本对环境变量的解释如下：\n\n- 当脚本运行 `os.environ.setdefault('UNSET_VAR',\
  \ 'UNSET_VAR_VALUE')` 时，值在脚本内部设置，因为 shell 未为 UNSET_VAR 设置值。输出的值是脚本本身设置的值。\n- 当执行\
  \ `os.environ.setdefault('SET_VAR', 'SET_VAR_VALUE')` 时，值未被设置，因为 shell 已提供了一个值。这是通过\
  \ `export SET_VAR=\"Set Using Export\"` 命令设置的。\n- HOME 的值并未由任何已运行的命令设置——这是 shell\
  \ 提供的。它是用户的主目录。这只是 shell 通常提供的一个环境变量的示例。\n- VAR1 由 export 设置，并在执行脚本时未被覆盖。\n- VAR2\
  \ 由 export 设置，但在执行脚本时随后被覆盖。\n- VAR3 仅在执行脚本时设置。\n- VAR4 从未被设置——我们使用 get 方法访问它以避免\
  \ KeyError。\n\n既然环境变量已经介绍完毕，我们就可以回到讨论需要对 manage.py 进行哪些更改以支持 django-configurations。\n\
  \n## django-configurations\n\n将 Django 应用程序部署到生产环境时，主要考虑之一是如何配置它。正如你在本书中看到的那样，`settings.py`\
  \ 文件是所有 Django 配置的定义位置。即使是第三方应用，其配置也在此文件中。你已经在 *第 12 章，构建 REST API* 中看到过这一点，在使用\
  \ Django REST framework 时。\n\n在 Django 中提供不同的配置并在它们之间切换有很多方法。如果你已经开始在现有应用程序上工作，该应用程序已有特定的方法在开发和生产环境之间切换配置，那么你可能应该继续使用该方法。\n\
  \n当我们在 *第 17 章，部署 Django 应用程序（第 1 部分 - 服务器设置）* 中将 Bookr 发布到产品 Web 服务器时，我们需要切换到生产配置，而这时我们将使用\
  \ `django-configurations`。\n\n要安装 `django-configurations`，请使用 `pip3` 如下：\n\n```\n\
  pip3 install django-configurations\n```\n\n> **重要说明**\n> 对于 Windows，你可以使用 `pip`\
  \ 代替前述命令中的 `pip3`。\n\n输出将如下所示：\n\n```\nCollecting django-configurations\n  Downloading\
  \ django_configurations-2.4-py3-none-any.whl\n    (17 kB)\nRequirement already satisfied:\
  \ django>=3.2 in /Users/ben/.virtualenvs/bookr/lib/python3.8/site-packages (from\
  \ django-configurations) (4.0)\nRequirement already satisfied: sqlparse>=0.2.2 in\
  \ /Users/ben/.virtualenvs/bookr/lib/python3.8/site-packages (from django>=3.2->django-configurations)\
  \ (0.4.2)\nRequirement already satisfied: asgiref<4,>=3.4.1 in /Users/ben/.virtualenvs/bookr/lib/python3.8/site-packages\
  \ (from django>=3.2->django-configurations) (3.4.1)\nRequirement already satisfied:\
  \ backports.zoneinfo; python_version < \"3.9\" in /Users/ben/.virtualenvs/bookr/lib/python3.8/site-packages\
  \ (from django>=3.2->django-configurations) (0.2.1)\nInstalling collected packages:\
  \ django-configurations\nSuccessfully installed django-configurations-2.4\n```\n\
  \n`django-configurations` 会更改你的 `settings.py` 文件，使所有设置都从你定义的一个类读取，该类将是 `configurations.Configuration`\
  \ 的子类。设置不再是 `settings.py` 中的全局变量，而是你定义的类的属性。通过使用这种基于类的 方法，我们可以利用面向对象的范式，最值得注意的是继承。设置在类中定义，可以从另一个类继承设置。例如，生产设置类可以继承开发设置类，只覆盖一些特定的设置——例如在生产环境中强制\
  \ `DEBUG` 为 `False`。\n\n我们可以通过仅显示文件中的前几个设置来说明需要对设置文件做什么。标准的 Django `settings.py`\
  \ 文件通常像这样开始（注释行已删除）：\n\n```\n```python\nfrom pathlib import Path\n\n\nBASE_DIR =\
  \ Path(__file__).resolve().parent.parent\nSECRET_KEY = \"django-insecure-c!...-pz6s^_k6w#eo7&\"\
  \nDEBUG = True\n# The rest of the settings are not shown\n```\n```\n\n要将设置转换为 `django-configurations`，首先从\
  \ `configurations` 导入 `Configuration`。然后，定义一个 `Configuration` 子类。最后，将所有设置缩进到类之下。在\
  \ PyCharm 中，这只需选择所有设置并按 *Tab* 将它们全部缩进即可。\n\n完成此操作后，你的 `settings.py` 文件将如下所示：\n\n\
  ```\n```python\nfrom pathlib import Path\nfrom configurations import Configuration\n\
  \n\nclass Dev(Configuration):\n    BASE_DIR = Path(__file__).resolve().parent.parent\n\
  \    SECRET_KEY = \"django-insecure-c!...&xxf*skpgkey6%$ld-pz6s^_k6w#eo7&\"\n  \
  \  DEBUG = True\n    ...\n    # All other settings indented in the same manner\n\
  ```\n```\n\n要拥有不同的配置（不同的设置集合），你只需扩展你的配置类并覆盖应不同的设置。\n\n例如，一个需要在生产环境中覆盖的变量是 `DEBUG`；出于安全和性能原因，它应为\
  \ `False`。可以定义一个 `Prod` 类，扩展 `Dev` 并设置 `DEBUG`，如下所示：\n\n```\n```python\nclass Dev(Configuration):\n\
  \    DEBUG = True\n    ...\n    # Other settings truncated\n```\n```\n\n```\nclass\
  \ Prod(Dev):\n    DEBUG = False\n    # no other settings defined since we're only\
  \ overriding\n    DEBUG\n```\n\n当然，你也可以覆盖其他生产设置，而不仅仅是 DEBUG。通常，出于安全原因，你还会重新定义 SECRET_KEY\
  \ 和 ALLOWED_HOSTS，并且为了配置 Django 使用你的生产数据库，你也会设置 DATABASES 值。可以按你选择的任何方式配置任何 Django\
  \ 设置。\n\n如果你现在尝试执行 runserver（或其他管理命令），你将收到错误，因为 Django 不知道如何找到 settings.py 文件，当设置文件像这样布局时：\n\
  \n```\ndjango.core.exceptions.ImproperlyConfigured: django-configurations settings\
  \ importer wasn't correctly installed. Please use one of the starter functions to\
  \ install it as mentioned in the docs: https://django-configurations.readthedocs.io/\n\
  ```\n\n在它再次开始工作之前，我们需要对 manage.py 文件进行一些更改。\n\n## manage.py 更改\n\n需要在 manage.py\
  \ 中添加/更改两行以启用 django-configurations。首先，我们需要定义一个默认环境变量，告诉 Django 配置应加载哪个 Configuration\
  \ 类。\n\n此行应添加到 main() 函数中，以设置 DJANGO_CONFIGURATION 环境变量的默认值：\n\n```\nos.environ.setdefault('DJANGO_CONFIGURATION',\
  \ 'Dev')\n```\n\n这将其默认值设置为 Dev——我们定义的类的名称。正如我们在示例脚本中看到的那样，如果此值已定义，则不会被覆盖。这将允许我们使用环境变量在配置之间切换。\n\
  \n第二个更改是将 execute_from_command_line 函数替换为 django-configurations 提供的函数。考虑以下行：\n\n\
  ```\nfrom django.core.management import execute_from_command_line\n```\n\n此行更改如下：\n\
  \n```\nfrom configurations.management import execute_from_command_line\n```\n\n\n\
  \n\n\n从现在开始，manage.py 将像以前一样工作，只是它在启动时会打印出它正在使用的 Configuration 类（图 15.1）：\n\n```\n\
  (bookr) -> bookr python manage.py runserver\ndjango-configurations version 2.4,\
  \ using configuration Dev\nWatching for file changes with StatReloader\nPerforming\
  \ system checks...\n\nSystem check identified no issues (0 silenced).\nDecember\
  \ 31, 2022 - 02:18:39\nDjango version 4.0, using settings 'bookr.settings'\nStarting\
  \ development server at http://127.0.0.1:8000/\nQuit the server with CONTROL-C.\n\
  ```\n\n图 15.1 – django-configurations 使用配置 Dev\n\n在第二行，你可以看到 django-configurations\
  \ 的输出，它对设置使用 Dev 类。\n\n## Configuration from environment variables\n\n除了使用环境变量在\
  \ Configuration 类之间切换外，django-configurations 还允许我们使用环境变量为单个设置提供值。它提供了 Value 类，这些类会自动从环境中读取值。我们可以在未提供值时定义默认值。由于环境变量始终是字符串，因此不同的\
  \ Value 类用于将字符串转换为指定类型。\n\n让我们通过几个示例在实践中查看这一点。我们将允许使用环境变量设置 DEBUG、ALLOWED_HOSTS、TIME_ZONE\
  \ 和 SECRET_KEY，如下所示：\n\n```\nfrom configurations import Configuration, values\n\n\
  class Dev(Configuration):\n    DEBUG = values.BooleanValue(True)\n    ALLOWED_HOSTS\
  \ = values.ListValue([])\n    TIME_ZONE = values.Value('UTC')\n    SECRET_KEY =\
  \ \"django-insecure-c!...-pz6s^_k6w#e0?&\n    ...\n    # Other settings truncated\n\
  \nclass Prod(Dev):\n    DEBUG = False\n    SECRET_KEY = values.SecretValue()\n \
  \   # no other settings are present\n```\n\n我们将逐一解释这些设置：\n\n- 在 Dev 中，DEBUG 从环境变量读取并转换为布尔值。值\
  \ yes、y、true 和 1 变成 True；值 no、n、false 和 0 变成 False。这允许我们在开发机器上关闭 DEBUG 运行，这在某些情况下很有用（例如，测试自定义异常页面而不是\
  \ Django 的默认页面）。在 Prod 配置中，我们不希望 DEBUG 意外变为 True，因此我们将其静态设置。\n- ALLOWED_HOSTS 在生产环境中是必需的。它是\
  \ Django 应该接受请求的域名列表。\n- ListValue 类会将逗号分隔的字符串转换为 Python 列表。\n  例如，字符串 www.example.com,\
  \ example.com 被转换为 [\"www.example.com\", \"example.com\"]。\n- TIME_ZONE 只接受字符串值，因此使用\
  \ Value 类设置。此类只是读取环境变量且完全不对其进行转换。\n- SECRET_KEY 在 Dev 配置中静态定义；它不能通过环境变量更改。在 Prod\
  \ 配置中，它使用 SecretValue 设置。这与 Value 类似，因为它只是一个字符串设置；但是，它不允许默认值。如果设置了默认值，则会引发异常。这是为了确保你永远不会将密钥值放入\
  \ settings.py 中，因为它可能会被意外共享（例如，上传到 GitHub）。请注意，由于我们在生产环境中不使用 Dev 的 SECRET_KEY，因此我们不在乎它是否泄露。\n\
  \n默认情况下，django-configurations 期望每个环境变量都有 DJANGO_ 前缀。例如，要设置 DEBUG，请使用 DJANGO_DEBUG\
  \ 环境变量，要设置 ALLOWED_HOSTS，请使用 DJANGO_ALLOWED_HOSTS。\n\n现在我们已经介绍了 django-configurations\
  \ 以及使项目支持它的所需更改，让我们将其添加到 Bookr 并进行这些更改。在下一个练习中，我们将安装并在 Bookr 中设置 django-configurations。\n\
  \n## Exercise 15.01 – Django configurations setup\n\n在本练习中，我们将使用 pip 安装 django-configurations，然后更新\
  \ settings.py 以添加 Dev 和 Prod 配置。然后我们将对 manage.py 进行必要的更改以支持新的配置样式，并测试一切是否仍在正常工作。让我们开始以下步骤：\n\
