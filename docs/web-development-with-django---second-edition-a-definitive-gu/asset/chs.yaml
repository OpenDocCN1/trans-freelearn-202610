  \n图 8.27：上传的文件目录与练习 6 匹配\n\n在本练习中，我们将 `UploadForm` 改为 `ModelForm` 子类，这使我们能够自动生成上传字段。我们可以用对表单\
  \ `save` 方法的调用替换存储上传文件到模型的代码。\n\n在继续本章的活动之前，我们需要简要讨论在使用实例时如何处理文件保存。\n\n### 处理文件保存\n\
  \n正如你在 *第 7 章* 中使用 `ModelForms` 时所知，你可以向 `ModelForm` 传递 instance 参数，使其在保存时更新现有模型而不是创建新模型。\n\
  \n例如，按如下方式更新视图中的示例模型：\n\n```\n```python\ndef update_view(request, pk):\n    instance\
  \ = ExampleModel.objects.get(pk=pk)\n    form = UploadForm(request.POST, request.FILES,\n\
  \                      instance=instance)\n    if form.valid():\n        form.save()\n\
  ```\n```\n\n当访问表单的 `cleaned_data` 属性时，我们会得到 `request.POST` 中包含的数据。如果该键没有值，则我们会从实例中获取值。\n\
  \n这通常不会引起任何问题，但在处理 `ImageField` 或 `FileField` 时，返回的数据类型会与请求或实例不同。\n\n如果上传了文件，则 cleaned\
  \ data 将为 InMemoryUploadedFile 或 TemporaryUploadedFile（取决于其大小；只有小文件才能放入内存）。如果未上传文件，则类型将为\
  \ FileField 的 FieldFile 或 ImageField 的 ImageFieldFile。\n\n为了解释，请考虑以下代码：\n\n```\n\
  def update_view(request, pk):\n    instance = ExampleModel.objects.get(pk=pk)\n\
  \    form = UploadForm(request.POST, request.FILES,\n        instance=instance)\n\
  \    if form.is_valid()\n        form_file = form.cleaned_data[\"file_field\"]\n\
  \        form_image = form.cleaned_data[\"image_field\"]\n```\n\n在上传了数据的情况下（即用户在表单中选择了图片和文件），则\
  \ form_file 和 form_image 将为 InMemoryUploadedFile 或 TemporaryUploadedFile。但是，如果用户未为字段上传任何内容（假设表单中字段不是必需的），则\
  \ form_file 将为 FieldFile 实例，而 form_image 将为 ImageFieldFile 实例。\n\n为了区分它们，你可以进行几种不同的检查。其中最简单的方法是检查\
  \ path 属性的存在。由于上传的文件尚未保存到磁盘，因此它们没有 path：\n\n```\nif hasattr(form_file, \"path\"\
  ):\n    print(\"This is a FieldFile\")\nelse:\n    print(\"This is an uploaded file\"\
  )\n```\n\n有时你需要在执行某些操作之前检查正在处理的文件类型，并且如果用户未上传新文件则跳过该操作。例如，我们不希望调整已分配给模型的图片大小。我们只会对新上传的图片进行图片调整大小：\n\
  \n```\nif hasattr(image_file, \"path\"):\n    print(\"This image was on the instances\
  \ so no need to resize\")\nelse:\n    perform_resize(image_file)\n```\n\n你需要在本章的第一个活动中进行类似的检查。\n\
  \n我们现在已经涵盖了开始使用文件上传增强 Bookr 所需的一切。在本章的活动中，我们将为书籍添加封面图片和示例文档（PDF、文本文件等）的上传支持。书籍封面将在保存前使用\
  \ PIL 调整大小。\n\n## 活动 8.01 – 书籍的图片和 PDF 上传\n\n在本活动中，你将首先清理（删除）我们在本章练习中使用的示例视图、模板、表单、模型和\
