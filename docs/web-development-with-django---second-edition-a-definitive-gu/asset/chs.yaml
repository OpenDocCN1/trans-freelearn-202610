- "# Django 简介\n\n“完美主义者的截止日期之选的 Web 框架。” 这句标语恰如其分地描述了 Django，这是一个已经存在十多年之久的框架。它经过实战检验并被广泛使用，每天都有越来越多的人使用它。所有这些可能会让你认为\
  \ Django 已经过时且不再相关。恰恰相反——它的长寿证明了其 API 的可靠性和一致性，甚至那些在 2007 年学习 Django v1.0 的人今天大多仍可为\
  \ Django 4 编写相同的代码。Django 仍在积极开发中，每月都会发布错误修复和安全补丁。\n\n与编写它的语言 Python 一样，Django 易于学习，同时又足够强大和灵活，能够随着你的需求而成长。它是一个“开箱即用”的框架——换句话说，你不需要查找和安装许多其他库或组件即可让你的应用程序运行起来。其他框架，如\
  \ Flask 或 Pylons，需要手动安装第三方框架用于数据库连接或模板渲染。相比之下，Django 内置了数据库查询、URL 映射和模板渲染的支持（我们很快会详细介绍这些含义）。然而，Django\
  \ 易于使用并不意味着它功能有限。Django 被许多大型网站使用，包括 Disqus (https://disqus.com/)、Instagram (https://www.instagram.com/)、Mozilla\
  \ (https://www.mozilla.org/)、Pinterest (https://www.pinterest.com/)、OpenStack (https://www.openstack.org/)\
  \ 和国家地理 (http://www.nationalgeographic.com/)。\n\nDjango 在 Web 中处于什么位置？谈到 Web 框架时，你可能会想到\
  \ ReactJS、Angular 或 Vue 等前端 JavaScript 框架。这些框架用于增强或为已生成的网页添加交互性。Django 位于这些工具之下的一层，负责路由\
  \ URL、从数据库获取数据、渲染模板以及处理用户的表单输入。然而，这并不意味着你必须二选一；JavaScript 框架可用于增强 Django 的输出或与 Django\
  \ 生成的 REST API 交互。\n\n在本書中，我们将使用专业 Django 开发者每天使用的相同方法构建一个 Django 项目。该应用程序名为 Bookr，允许你浏览和添加书籍及书评。本工作坊分为四个部分。在第一部分，我们将从搭建\
  \ Django 应用的基础开始，快速构建一些页面，并使用 Django 开发服务器提供服务。你将能够使用 Django 管理站点向数据库添加数据。\n\n本章向你介绍\
  \ Django 及其在 Web 开发中的作用。你将首先了解 **model-view-template** 范式的工作原理以及 Django 如何处理 HTTP\
  \ **请求**和**响应**。掌握基本概念后，你将创建你的第一个 Django 项目 Bookr，这是一个用于添加、查看和管理书评的应用程序。这是一个你将在本书中不断增强和添加功能的应用程序。你将然后学习\
  \ `manage.py` 命令（用于编排 Django 操作）。你将使用此命令启动 Django 开发服务器并测试迄今为止编写的代码是否按预期工作。你还将学习如何使用\
  \ **PyCharm**，这是一款流行的 Python IDE，你将在本书中全程使用它。你将使用它编写代码以向 Web 浏览器返回**响应**。最后，你将学习如何使用\
  \ PyCharm 的调试器来排查代码中的问题。到本章结束时，你将具备使用 Django 开始创建项目的必要技能。\n\n本章将涵盖以下主题：\n\n- 搭建\
  \ Django 项目和应用\n- 理解 model-view-template 范式\n- 探索 Django 项目结构\n- 介绍 Django 视图\n\
  - 探索 URL 映射细节\n- 探索 Django 设置\n- 在应用目录中找到 HTML 模板\n- 调试和处理错误\n- 活动 1.01 – 创建站点欢迎屏幕\n\
  - 活动 1.02 – 书籍搜索脚手架\n\n到本书结束时，你将拥有足够的经验来从头到尾设计和构建自己的 Django 项目。\n\n## 技术要求\n\n在本書中，你将编写代码。如果需要参考本章的完整代码，你可以在此\
  \ GitHub 仓库中找到：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter01。\n\
  \n## 搭建 Django 项目和应用\n\n在深入探讨 Django 范式和 HTTP 请求背后的理论之前，我们将向你展示启动一个 Django 项目是多么容易。在本节和练习之后，你将创建一个\
  \ Django 项目，使用浏览器向其发出请求，并看到响应。\n\n\n\n\n\n一个 Django 项目是一个包含项目所有数据的文件夹——代码、设置、模板和资源。它是通过在命令行上运行\
  \ `django-admin` 命令并使用 `startproject` 参数并提供项目名称创建并搭建的。例如，要创建一个名为 `myproject` 的 Django\
  \ 项目，运行的命令如下：\n\n```\n```bash\ndjango-admin startproject myproject\n```\n```\n\n\
  这将创建 `myproject` 目录，Django 会在其中填充运行项目所需的必要文件。`myproject` 目录内有两个文件（显示在 *图 1.1* 中）：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_25_0.png)\n\n图 1.1 – myproject 的项目目录\n\
  \n`manage.py` 是一个在命令行执行的 Python 脚本，用于与项目交互。我们将使用它来启动 **Django 开发服务器**，这是一个开发 Web\
  \ 服务器，你将用它在本地计算机上与 Django 项目交互。与 `django-admin` 类似，命令在命令行中传递。与 `django-admin` 不同，该脚本未映射到系统路径，因此我们必须使用\
  \ Python 执行它。我们需要使用命令行来执行此操作。例如，在项目目录内，我们运行以下命令：\n\n```\n```bash\npython3 manage.py\
  \ runserver\n```\n```\n\n这会将 `runserver` 命令传递给 `manage.py` 脚本，从而启动 Django 开发服务器。我们稍后将研究\
  \ `manage.py` 接受的更多命令。以这种方式与 `manage.py` 交互时，我们称之为管理命令。例如，我们可能会说我们正在执行 `runserver`\
  \ 管理命令。\n\n`startproject` 命令还创建了一个与项目同名的目录——在本例中为 `myproject`。这是一个 Python 包，包含设置和项目运行所需的其他配置文件。我们稍后将研究其内容。\n\
  \n2. 在你的终端（或命令提示符）中，使用 cd 命令切换到 bookr 项目目录，然后按如下方式运行 manage.py runserver 命令：\n\n\
  ```\npython3 manage.py runserver\n```\n\n注意\n在 Windows 上，你可能需要运行并将 python3 替换为仅\
  \ python，以便每次运行时命令都能正常工作。\n\n此命令启动 Django 开发服务器。你应该会看到类似以下的输出：\n\n```\nWATCHING\
  \ FOR FILE CHANGES WITH StatReloader\n\nPERFORMING SYSTEM CHECKS...\n\nSYSTEM CHECK\
  \ IDENTIFIED NO ISSUES (0 SILENCED).\n\nYOU HAVE 18 UNAPPLIED MIGRATION(S). YOUR\
  \ PROJECT MAY NOT WORK PROPERLY UNTIL YOU APPLY THE MIGRATIONS FOR APP(S): ADMIN,\
  \ AUTH, CONTENTTYPES, SESSIONS.\nRUN 'PYTHON MANAGE.PY MIGRATE' TO APPLY THEM.\n\
  JANUARY 01, 2022 - 02:54:03\nDJANGO VERSION 4.0, USING SETTINGS 'BOOKR.SETTINGS'\n\
  STARTING DEVELOPMENT SERVER AT HTTP://127.0.0.1:8000/\nQUIT THE SERVER WITH CONTROL-C.\n\
  ```\n\n你可能会收到一些关于未应用迁移的警告，但现在没关系。\n\n3. 打开 Web 浏览器并转到 http://127.0.0.1:8000/，这将显示\
  \ Django 欢迎屏幕（图 1.2）。如果看到它，你就知道你的 Django 项目已成功创建，一切目前运行正常：\n\n![](img/4840a43efd335abd10b93708225692d6_28_0.png)\n\
  \n图 1.2 – Django 欢迎屏幕\n\n- 4. 返回终端并通过键入 *Ctrl + C* 停止正在运行的开发服务器。\n- 5. 我们现在将为 Bookr\
  \ 项目创建 *reviews* 应用。在终端中，确保你位于 bookr 项目目录中，然后执行以下命令创建 *reviews* 应用：\n\n```\n```text\n\
  python3 manage.py startapp reviews\n```\n```\n\n> **注意**\n> \n> 创建 reviews 应用后，你的\
  \ Bookr 项目目录中的文件将如下所示： `https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter01/Exercise1.01/bookr`。\n\
  \n如果命令成功，则没有输出，但已创建 reviews 应用目录。你可以查看此目录内的文件，查看创建的文件——migrations 目录、`admin.py`、`models.py`\
  \ 等等。我们将在 *Django 应用* 部分详细介绍这些内容。\n\n在本练习中，我们创建了 Bookr 项目，通过启动 Django 开发服务器测试项目是否正常工作，然后为项目创建了\
  \ *reviews* 应用。现在你已经亲手操作过 Django 项目，我们将回到 Django 设计背后的一些理论，以及 HTTP 请求和响应。\n\n##\
  \ 理解模型-视图-模板范式\n\n应用程序设计中常见的设计模式是 **模型-视图-控制器（MVC）**，其中应用程序的模型（其数据）在一个或多个视图中显示，并且控制器协调模型与视图之间的交互。Django\
  \ 遵循一种不同但相似的范式，称为 **模型-视图-模板（MVT）**。\n\n与 MVC 类似，MVT 也使用模型来存储数据。然而，在 MVT 中，视图将查询模型然后使用模板渲染它。通常，使用\
  \ MVC 语言时，所有三个组件都需要使用相同的语言开发。使用 MVT 时，模板可以用不同的语言编写。在 Django 的情况下，模型和视图用 Python 编写，模板用\
  \ HTML 编写。这意味着 Python 开发人员可以处理模型和视图，而专业的 HTML 开发人员处理 HTML。我们将首先更详细地解释模型、视图和模板，然后再查看一些使用示例。\n\
  \n## 模型\n\nDjango 模型定义应用程序的数据并提供对 SQL 数据库访问的抽象层，通过 **对象关系映射器（ORM）**。ORM 让你能够使用 Python\
  \ 代码定义数据模式（类、字段及其关系），而无需了解底层数据库。基本上，这意味着你可以在 Python 代码中定义数据库层，Django 会负责为你生成 SQL\
  \ 查询。ORM 将在 *第 2 章，模型和迁移* 中详细介绍。\n\n> **注意**\n> \n> **SQL 代表结构化查询语言**，是一种描述一种存储数据在表中的数据库类型的方式，每个表有若干行。想象每个表就像一个单独的电子表格。但是，与电子表格不同，数据在每个表之间可以定义关系。你可以通过执行\
  \ SQL 查询（在谈论数据库时通常简称为查询）与数据交互。查询允许你检索数据（`SELECT`）、添加或更改数据（`INSERT` 和 `UPDATE` 分别）、以及删除数据（`DELETE`）。可以选择的\
  \ SQL 数据库服务器有很多，例如 SQLite、PostgreSQL、MySQL 或 Microsoft SQL Server。每个数据库之间的 SQL 语法大部分相似，但方言可能存在一些差异。Django\
  \ 的 ORM 会为你处理这些差异——当我们开始编码时，我们将使用 SQLite 数据库在磁盘上存储数据，但后来当我们部署到服务器时，我们将切换到 PostgreSQL，但无需进行任何代码更改。\n\
  \n通常，查询数据库时，结果会作为原始 Python 对象返回（例如，字符串、int、float 或 bytes 的列表）。使用 ORM 时，结果会自动转换为你已定义的模型类的实例。使用\
  \ ORM 意味着你会自动受到一种称为 SQL 注入攻击的漏洞的保护。\n\n如果你更熟悉数据库和 SQL，你也可以选择编写自己的查询。\n\n## 视图\n\n\
  Django 视图是定义应用程序大部分逻辑的地方。当用户访问你的网站时，他们的 Web 浏览器会发送请求以从你的网站检索数据（我们将在下一节更详细地介绍 HTTP\
  \ 请求是什么以及它包含的信息）。视图是你编写的函数，它会以 Python 对象的形式接收此请求（具体来说，是 Django HttpRequest 对象）。你的视图需要决定如何响应请求以及向用户发送什么内容。你的视图必须返回一个\
  \ HttpResponse 对象，该对象封装了提供给客户端的所有信息——内容、HTTP 状态和其他标头。\n\n视图还可以选择从请求的 URL 中接收信息——例如\
  \ ID 号。视图的一个常见设计模式是使用 Django ORM 通过传递到视图的 ID 查询数据库。然后，视图可以通过提供从数据库检索的模型的数据来渲染模板（稍后会详细介绍）。渲染后的模板成为\
  \ HttpResponse 对象的 content，并从视图函数返回。Django 会负责将数据传回浏览器的通信。\n\n## 模板\n\n模板是一个超文本标记语言（HTML）文件（通常——任何文本文件都可以是模板），其中包含由应用程序提供的变量替换的特殊占位符。例如，你的应用程序可以在画廊布局或表格布局中渲染项目列表。你的视图将为两者获取相同的模型，但能够渲染不同的\
  \ HTML 文件，使用相同的信息以不同方式呈现数据。Django 强调安全性，因此会自动为你转义变量。例如，< 和 > 符号（以及其他符号）在 HTML 中是特殊字符。如果你尝试在变量中使用它们，Django\
  \ 会自动对其进行编码，以便在浏览器中正确渲染。\n\n## 实践中的 MVT\n\n我们现在将通过一些示例来说明 MVT 在实践中如何工作。在示例中，我们有一个\
  \ Book 模型，存储有关不同书籍的信息，以及一个 Review 模型，存储有关书籍不同评论的信息。\n\n第一个示例中，我们希望能够编辑 Book 或 Review\
  \ 的信息。以编辑书籍详情的第一个场景为例。我们将有一个视图从数据库获取 Book 数据并提供 Book 模型。然后，我们将包含 Book 对象（和其他数据）的上下文信息传递给模板，该模板将显示一个表单以捕获新信息。第二个场景（编辑评论）类似——从数据库获取\
  \ Review 模型，然后传递\n\n\n\nReview object and other data to a template to display an\
  \ edit form. These scenarios might be so similar that we can reuse the same template\
  \ for both, as shown in Figure 1.3.\n\n![](img/4840a43efd335abd10b93708225692d6_31_0.png)\n\
  \nFigure 1.3 – Editing a single book or review\n\nYou can see here that we use two\
  \ models, two views, and one template. Each view fetches a single instance of its\
  \ associated model, but they can both use the same template, which is a generic\
  \ HTML page to display a form. Views can provide extra context data to slightly\
  \ alter the display of the template for each model type. Also illustrated in the\
  \ diagram are the parts of the code that are written in Python and those that are\
  \ written in HTML.\n\nIn the second example, we want to be able to show a user a\
  \ list of the books or reviews that are stored in the application. Furthermore,\
  \ we want to allow the user to search for books and get a list of all that match\
  \ their criteria. We will use the same two models as the previous example (Book\
  \ and Review) but we will create new views and templates. Since there are three\
  \ scenarios, we'll use three views this time – the first fetches all books, the\
  \ second fetches all reviews, and the last searches for books based on some search\
  \ criteria. Once again, if we write a template well, we might be able to just use\
  \ a single HTML template again, as shown in Figure 1.4.\n\nFigure 1.4 – Viewing\
  \ multiple books or reviews\n\nThe Book and Review models remain unchanged from\
  \ the previous example; the three views will fetch many (zero or more) books or\
  \ reviews. Then, each view can use the same template, which is a generic HTML file\
  \ that iterates over a list of objects it is provided and renders them. Once again,\
  \ the views can send extra data in the context to alter how the template behaves,\
  \ but the majority of the template will be as generic as possible.\n\nIn Django,\
  \ a model does not always need to be used to render an HTML template. A view can\
  \ generate the context data itself and render a template with it, without requiring\
  \ any model data. Figure 1.5 shows a view sending data straight to a template.\n\
  \nFigure 1.5 – A view sending data to a template without a model\n\nIn this example,\
  \ there is a welcome view to welcome a user to the site. It doesn’t need any information\
  \ from the database, so it can just generate the context data itself. The context\
  \ data depends on the type of information you want to display – for example, you\
  \ could pass the user information to greet them by name if they are logged in.\n\
  \nIt is also possible for a view to render a template without any context data.\
  \ This can be useful if you have static information in an HTML file that you want\
  \ to serve.\n\nNow that you have been introduced to MVT in Django, we can look at\
  \ how Django processes an HTTP request and generates an HTTP response. However,\
  \ we first need to explain in more detail what HTTP requests and responses are and\
  \ what information they contain. We will see this in the next section.\n\n## An\
  \ introduction to HTTP\n\nLet’s say someone wants to visit your web page. They type\
  \ in its URL or click a link to your site from a page they are already on. Their\
  \ web browser creates an HTTP request, which is sent to the server hosting your\
  \ website. Once a web server receives the HTTP request from your browser, it can\
  \ interpret it and then send back a response. The response that the server sends\
  \ might be simple, such as just reading an HTML or image file from disk and sending\
  \ it. Alternatively, the response might be more complex, maybe using server-side\
  \ software (such as Django) to dynamically generate the content before sending it.\n\
  \nThe following diagram shows the direction of the transmission of HTTP requests\
  \ and HTTP responses, between a browser and a web server.\n\n![](img/4840a43efd335abd10b93708225692d6_33_0.png)\n\
  \nFigure 1.6 – An HTTP request and an HTTP response\n\nThe request is made up of\
  \ four main parts – the method, the path, headers, and the body. Some types of requests\
  \ don’t have a body. If you just visit a web page, your browser will not send a\
  \ body, whereas if you are submitting a form (for example, by logging into a site\
  \ or performing a search), then your request will have a body containing the data\
  \ you’re submitting. We’ll look at two example requests now to illustrate this.\n\
  \nThe first request will be to an example page with the following URL: `https://www.example.com/page`.\
  \ When your browser visits that page, this is what it’s sending behind the scenes:\n\
  \n```\nGET /page HTTP/1.1\nHost: www.example.com\nUser-Agent: Mozilla/5.0 (X11;\
  \ Ubuntu; Linux x86_64; rv:15.0) Firefox/15.0.1\nCookie: sessid=abc123def456\n```\n\
  \nThe first line contains the method (GET) and the path (/page). It also contains\
  \ the HTTP version – in this case, 1.1, although you don’t have to worry about this.\
  \ There are many different HTTP methods that can be used, depending on how you want\
  \ to interact with the remote page. Some common ones are GET (to retrieve the remote\
  \ page), POST (to send data to the remote page), PUT (to create a remote page) and\
  \ DELETE (to delete the remote page). Note that the descriptions of the actions\
  \ are somewhat simplified – the remote server can choose how it responds to different\
  \ methods, and even experienced developers can disagree on the correct method to\
  \ implement for a particular action. It’s also important to note that even if a\
  \ server supports a particular method, you will probably need the correct permissions\
  \ to perform that action – you can’t just delete a web page you don’t like, for\
  \ example.\n\nWhen writing a web application, the vast majority of the time you\
  \ will only deal with GET requests. When you start accepting forms, you’ll also\
  \ have to use POST requests. It is only when you are working with advanced features,\
  \ such as creating REST APIs, that you will have to worry about PUT, DELETE, and\
  \ other methods.\n\nReferring to the example request again, line 2 onwards features\
  \ the headers of the request. The headers contain extra metadata about the request.\
  \ Each header is on its own line, with the header name and its value separated by\
  \ a colon. Most are optional (except for Host – there’ll be more on that soon).\
  \ Header names are not case-sensitive. For the sake of this example, we’re only\
  \ showing three common headers here. Let’s look at the example headers in order:\n\
  \n- **Host:** As mentioned, this is the only header that is required (for HTTP 1.1\
  \ or later). It is needed for the web server to know which website or application\
  \ should respond to the request if there are multiple sites hosted on a single server.\n\
  - **User-Agent:** Your browser usually sends to the server a string identifying\
  \ its version and operating system. Your server application could use this to serve\
  \ different pages to different devices (for example, a mobile-specific page for\
  \ smartphones).\n- **Cookie:** You have probably seen a message when visiting a\
  \ web page that lets you know that it is storing a cookie in the browser. These\
  \ are small pieces of information that a website can store in your browser and use\
  \ to identify you or save settings for when you return to the site. If you were\
  \ wondering about how your browser sends these cookies back to the server, it is\
  \ through this header.\n\nThere are many other standard headers defined, and it\
  \ would take up too much space to list them all. They can be used to authenticate\
  \ to the server (*Authorization*), tell the server what kind of data you can receive\
  \ (*Accept*), or even what language you’d like for the page (*Accept-Language*,\
  \ although this will only work if the page creator has made the content available\
  \ in the particular language you request). You can even define your own headers\
  \ that only your application knows how to respond to.\n\nNow, let’s look at a slightly\
  \ more advanced request – one that sends some information to a server and thus (unlike\
  \ the previous example) contains a body. In this example, we are logging into a\
  \ web page by sending a username and password – for example, you visit https://www.example.com/login,\
  \ and it displays a form to enter a username and password. After you click the **Login**\
  \ button, this is the request that is sent to the server:\n\n```\nPOST /login HTTP/1.1\n\
  Host: www.example.com\nContent-Type: application/x-www-form-urlencoded\nContent-Length:\
  \ 32\n\nusername=user&password=password1\n```\n\n\n\n\n正如你所见，这看起来与第一个示例相似，但有一些不同之处。方法现在是\
  \ POST，并且引入了两个新的头部（你可以假设你的浏览器仍会发送之前示例中出现的其他头部）：\n\n- Content-Type：这告诉服务器主体中包含的数据类型。在\
  \ application/x-www-form-urlencoded 的情况下，主体是一组键值对。HTTP 客户端可以设置此头部来告诉服务器如果发送其他类型的数据，例如\
  \ JSON 或 XML。\n- Content-Length：为了让服务器知道要读取多少数据，客户端必须告诉它发送了多少数据。内容长度头部包含主体的长度。如果你计算此示例中主体的长度，你会发现它是\
  \ 32 个字符。\n\n头部始终由一个空行与主体分隔。通过查看示例，你应该能够看出表单数据是如何在主体中编码的 – username 的值是 user1，password\
  \ 的值是 password1。\n\n这些请求相当简单，但大多数请求不会更复杂。它们可能有不同的方法和头部，但应遵循相同的格式。现在我们已经看到了请求，我们将看看从服务器返回的\
  \ HTTP 响应。\n\nHTTP 响应看起来与请求相似，由三个主要部分组成 – 状态、头部和主体。就像请求一样，取决于响应的类型，它可能没有主体。第一个响应示例是一个简单的成功响应：\n\
  \n```\nHTTP/1.1 200 OK\nServer: nginx\nContent-Length: 18132\nContent-Type: text/html\n\
  Set-Cookie: sessid=abc123def46\n\n<!DOCTYPE html><html><head>...\n```\n\n第一行包含 HTTP\
  \ 版本、数字状态码（200），然后是代码含义的文本描述（OK – 请求成功）。我们将在下一个示例之后展示更多状态。第 2–5 行包含头部，与请求类似。你可能见过其中的一些头部；我们将在此上下文中解释它们全部：\n\
  \n- Server：这与 User-Agent 头部类似但相反 – 这是服务器告诉客户端它运行的软件。\n- Content-Length：客户端使用此值来确定从服务器读取多少数据以获取主体。\n\
  \n- Content-Type：服务器使用此头部向客户端指示它发送的数据类型。客户端然后可以选择如何显示数据 – 例如，图像必须与 HTML 不同地显示。\n\
  - Set-Cookie：我们在第一个请求示例中看到客户端如何向服务器发送 cookie。这是服务器发送以在浏览器中设置该 cookie的对应头部。\n\n头部之后是一个空行，然后是响应的主体。我们在这里没有全部显示，只是收到的\
  \ HTML 的前几个字符，共 18,132 个，服务器已发送。\n\n接下来，我们将展示一个请求的页面未找到时返回的响应示例：\n\n```\nHTTP/1.1\
  \ 404 Not Found\nServer: nginx\nContent-Length: 55\nContent-Type: text/html\n\n\
  <!DOCTYPE html><html><body>Page Not Found</body></html>\n```\n\n它与前一个示例相似，但状态现在是\
  \ 404 Not Found。如果你曾经在浏览互联网时收到 404 错误，这就是你的浏览器收到的响应类型。各种状态码按它们指示的成功或失败类型分组：\n\n\
  - 100–199：服务器发送此范围内的代码以指示协议更改或需要更多数据。你不必担心这些。\n- 200–299：此范围内的状态码表示响应被成功处理。正如我们所见，你最常处理的常见代码是\
  \ 200 OK。\n- 300–399：此范围内的状态码意味着你请求的页面已移动到另一个地址。一个例子是 URL 缩短服务，当你访问时它会将你从短 URL 重定向到完整\
  \ URL。常见响应是 301 Moved Permanently 或 302 Found。在发送重定向响应时，服务器还将包含一个 Location 头部，其中包含应重定向到的\
  \ URL。\n- 400–499：此范围内的状态码意味着请求无法处理，因为客户端发送的内容存在问题。这与由于服务器问题而无法处理请求形成对比（我们很快会讨论这些）。我们已经看到\
  \ 404 Not Found 响应；这是由于请求错误，因为客户端请求不存在的文档。其他常见响应是 401 Unauthorized（客户端应登录）或 403\
  \ Forbidden（客户端不允许访问特定资源）。这两个问题都可以通过让客户端登录来避免，因此它们被视为客户端（请求）问题。\n\n- 500-599：此范围内的状态码表示服务器端错误。客户端不应该期望能够调整请求来解决问题。在使用\
  \ Django 时，你最常见的服务器错误状态是 500 Internal Server Error。如果你的代码引发异常，就会生成此错误。另一个常见的是 504\
  \ Gateway Timeout，如果你的代码运行时间过长可能会发生。其他常见的变体是 502 Bad Gateway 和 503 Service Unavailable，通常意味着你的应用程序托管存在某种问题。\n\
  \n这些只是最常见的 HTTP 状态之一。你可以在 https://developer.mozilla.org/en-US/docs/Web/HTTP/Status\
  \ 找到更完整的列表。就像 HTTP 头部一样，状态是任意的，应用程序可以返回自定义状态。服务器和客户端自行决定这些自定义状态和代码的含义。\n\n如果你第一次接触\
  \ HTTP 协议，有很多信息需要吸收。幸运的是，Django 做了所有艰苦的工作，并将传入数据封装到 HttpRequest 对象中。大多数时候，你不需要知道大部分传入的信息，但如果需要，它是可用的。同样，在发送响应时，Django\
  \ 将你的数据封装在 HttpResponse 对象中。通常，你只需设置要返回的内容，但你也有自由设置 HTTP 状态码和头部。我们将在本章后面讨论如何在 HttpRequest\
  \ 和 HttpResponse 中访问和设置信息。在下一节 处理请求 中，我们将了解 Django 如何接收、解析和响应 HTTP 请求。\n\n## Processing\
  \ a request\n\n这是请求和响应流程的基本时间线，以便你了解你在每个阶段编写的代码的作用。就编写代码而言，你首先编写的是你的视图。你创建的视图将执行某些操作，例如查询数据库获取数据。然后，视图会将此数据传递给另一个函数来渲染模板，最后返回封装你要发送回客户端的数据的\
  \ HttpResponse 对象。\n\n接下来，Django 需要知道如何将特定 URL 映射到你的视图，以便它可以为请求中收到的 URL 加载正确的视图。你将在\
  \ URL 配置 Python 文件中编写此 URL 映射。\n\n当 Django 收到请求时，它会解析 URL 配置文件，然后找到对应的视图。它调用视图，并传入代表请求的\
  \ HttpRequest 对象。你的视图将返回其 HttpResponse，然后 Django 再次接管，将此数据发送到其托管的 Web 服务器并传回请求它的客户端。\n\
  \n![](img/4840a43efd335abd10b93708225692d6_38_0.png)\n\n请求和响应流程如图 1.7 所示；标记为 Your\
  \ Code 的部分是你要编写的代码，而第一步和最后一步由 Django 处理。Django 为你进行 URL 匹配，调用你的视图代码，然后处理将响应传回客户端。\n\
  \n在本节中，我们了解了 HTTP 请求和响应的结构，包括不同类型的请求用于什么。我们还看到了 HTTP 状态码如何用于表示 HTTP 请求或响应中的错误。我们还概述了\
  \ Django 如何处理 HTTP 请求。在下一节中，我们将探索 Django 项目结构，并了解各种文件和目录的用途。\n\n## Exploring the\
  \ Django project structure\n\n我们已经在 Scaffolding a Django project and app 部分介绍了 Django\
  \ 项目。让我们提醒自己在运行 startproject（对于名为 myproject 的项目）时会发生什么 – 该命令创建一个名为 myproject 的目录，其中包含一个名为\
  \ manage.py 的文件，以及一个名为 myproject 的目录（这与项目名称匹配；在 Exercise 1.01 – creating a project\
  \ and app, and starting the development server 中，此文件夹称为 bookr，与项目相同）。目录布局如图 1.8\
  \ 所示。我们现在将更详细地检查 manage.py 文件和 myproject 包的内容。\n\n\n\n\n\n![](img/4840a43efd335abd10b93708225692d6_39_0.png)\n\
  \n图 1.8 – 我的项目的项目目录\n\n顾名思义，`manage.py` 是一个用于管理你的 Django 项目的脚本。用于与项目交互的大多数命令都将作为命令行参数提供给此脚本。命令作为此脚本的参数提供——例如，如果我们想运行\
  \ `manage.py runserver` 命令，则意味着像这样运行 `manage.py` 脚本：\n\n```bash\npython3 manage.py\
  \ runserver\n```\n\n`manage.py` 提供了许多有用的命令。你将在本书中更详细地了解它们；其中一些常见命令如下：\n\n- `runserver`:\
  \ 这会启动 Django 开发 HTTP 服务器，在你的本地计算机上提供 Django 应用。\n- `startapp`: 这会在你的项目中创建一个新的 Django\
  \ 应用。我们很快会更深入地讨论应用是什么。\n- `shell`: 这会启动一个预加载了 Django 设置的 Python 解释器。这对于在无需手动加载 Django\
  \ 设置的情况下与你的应用程序交互很有用。\n- `dbshell`: 这会启动一个与你的数据库连接的交互式 shell，使用来自 Django 设置的默认参数。你可以通过这种方式运行手动\
  \ SQL 查询。\n- `makemigrations`: 这会根据你的模型定义生成数据库更改指令。你将在 *第 2 章，模型和迁移* 中了解这意味着什么以及如何使用此命令。\n\
  - `migrate`: 这会应用由 `makemigrations` 命令生成的迁移。你也将在 *第 2 章，模型和迁移* 中使用它。\n- `test`:\
  \ 这会运行你编写的自动化测试。你将在 *第 14 章，测试你的 Django 应用程序* 中使用此命令。\n\n所有命令的完整列表可在 `https://docs.djangoproject.com/en/3.0/ref/django-admin/`\
  \ 获取。\n\n在接下来的部分中，我们将探索项目目录的内容，了解 Django 应用目录包含什么，并了解如何在 PyCharm 中加载你的项目。\n\n##\
  \ The myproject directory\n\n除了 manage.py 文件外，startproject 创建的另一个文件项是 myproject\
  \ 目录。这是你的项目的实际 Python 包。它包含项目的设置、Web 服务器的一些配置文件以及全局 URL 映射。myproject 目录内有五个文件：\n\
  \n- __init__.py\n- asgi.py\n- settings.py\n- urls.py\n- wsgi.py\n\n它们也可以在以下屏幕截图中看到：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_40_0.png)\n\n图 1.9 – myproject 包（在 myproject\
  \ 项目目录内）\n\n现在让我们看看这些文件包含什么内容：\n\n- `__init__.py`: 这是一个空文件，让 Python 知道 myproject\
  \ 目录是一个 Python 模块。如果你以前使用过 Python，你会熟悉这些文件。\n- `settings.py`: 这包含你的应用程序的所有 Django\
  \ 设置。我们很快会解释其内容。\n- `urls.py`: 这具有 Django 最初用于定位视图或其他子 URL 映射的全局 URL 映射。你很快就会向此文件添加\
  \ URL 映射。\n- `asgi.py` 和 `wsgi.py`: 这些文件是 ASGI 或 WSGI Web 服务器在将你的 Django 应用部署到生产\
  \ Web 服务器时用于与之通信的文件。你通常不需要编辑它们，它们在日常开发中也不使用。它们的使用将在 *第 17 章，部署 Django 应用程序（第 1 部分\
  \ – 服务器设置）* 中更详细地讨论，该章节托管在此书的 GitHub 仓库上。\n\n## Django development server\n\n你已经在\
  \ *练习 1.01 – 创建项目和应用并启动开发服务器* 中启动了 Django 开发服务器。正如我们之前提到的，它是一个仅 intended 在开发期间在开发人员机器上运行的\
  \ Web 服务器。它不 intended 用于生产环境。\n\n默认情况下，服务器在 `localhost (127.0.0.1)` 的端口 8000 上监听，但可以通过在\
  \ `runserver` 参数后添加端口号，或地址和端口号来更改：\n\n```bash\npython3 manage.py runserver 8001\n\
  ```\n\n这将使服务器在 `localhost (127.0.0.1)` 的端口 8001 上监听。\n\n你也可以让它监听特定地址，如果你的计算机有多个地址，或\
  \ `0.0.0.0` 表示所有地址：\n\n```bash\npython3 manage.py runserver 0.0.0.0:8000\n```\n\n\
  这将使服务器在你计算机的所有地址上端口 8000 上监听，如果你想从另一台计算机或你的智能手机测试你的应用程序，这会很有用。\n\n开发服务器会监视你的 Django\
  \ 项目目录，并在你保存文件时自动重启，以便你所做的任何代码更改都会自动重新加载到服务器中。但是，你仍然需要手动刷新浏览器才能看到更改。\n\n当你想停止 `runserver`\
  \ 命令时，可以以在终端中停止进程的通常方式完成——通过键入 *Ctrl + C.*\n\n## Django apps\n\n现在我们已经涵盖了关于应用的大部分理论，我们可以更具体地说明它们的目的。应用目录包含它们提供应用功能所需的所有模型、视图、模板（以及更多）。Django\
  \ 项目将至少包含一个应用（除非它被大量定制以不依赖大量 Django 功能）。如果设计良好，应用应该能够在不修改的情况下从一个项目中移除并移动到另一个项目。通常，应用将包含单个设计域的模型，这可以作为判断你的应用是否应拆分为多个应用的有用方法。\n\
  \n你的应用可以有任何名称，只要它是有效的 Python 模块名称（即，仅字母、数字和下划线）并且不与项目目录中的其他文件冲突即可。例如，正如我们所见，项目目录中已经有一个名为\
  \ `myproject` 的目录（包含 `settings.py` 文件），因此你不能有一个名为 `myproject` 的应用。正如我们在 *练习 1.01\
  \ – 创建项目和应用并启动开发服务器* 中所见，创建应用使用 `manage.py startapp appname` 命令，如下所示：\n\n```bash\n\
  python3 manage.py startapp myapp\n```\n\n`startapp` 命令会在你的项目内创建一个以指定应用名称命名的目录。它还会为应用搭建文件。应用目录内有一系列文件和一个文件夹，如\
  \ *图 1.10* 所示：\n\n![](img/4840a43efd335abd10b93708225692d6_42_0.png)\n\n图 1.10 –\
  \ myapp 应用目录的内容\n\n让我们回顾一下这些文件和文件夹：\n\n- `__init__.py`: 一个空文件，表示此目录是一个 Python 模块。\n\
  - `admin.py`: Django 有一个内置的 admin 站点，用于通过 GUI 查看和编辑数据。在此文件中，你将定义你的应用的模型如何在 Django\
  \ admin 站点中公开。我们将在 *第 4 章，Django Admin 简介* 中更详细地介绍这一点。\n- `apps.py`: 这包含应用元数据的一些配置。你不需要编辑此文件。\n\
  - `models.py`: 这是你将定义应用程序模型的所在位置。你将在 *第 2 章，模型和迁移* 中更详细地阅读此内容。\n- `migrations`:\
  \ Django 使用迁移文件自动记录模型更改时对底层数据库的更改。它们由 Django 在你运行 `manage.py makemigrations` 命令时生成并存储在此目录中。它们在你运行\
  \ `manage.py migrate` 之前不会应用到数据库中。它们也将在 *第 2 章，模型和迁移* 中介绍。\n- `tests.py`: 为了测试你的代码是否按预期运行，Django\
  \ 支持编写测试（单元、功能或集成）并会在此文件中查找它们。我们将在本书中编写一些测试，并在 *第 14 章，测试你的 Django 应用程序* 中详细介绍测试。\n\
  - `views.py`: 你的 Django 视图（响应 HTTP 请求的代码）将放在这里。你很快就会创建一个基本视图，视图将在 *第 3 章，URL 映射、视图和模板*\
  \ 中更详细地介绍。\n\n我们稍后会更详细地检查这些文件的内容，但现在，我们将让 PyCharm 运行起来。\n\n## PyCharm setup\n\n\
  我们在 *练习 1.01 – 创建项目和应用并启动开发服务器* 中确认 Bookr 项目已正确设置（因为开发服务器运行成功），因此我们现在可以开始使用 PyCharm\
  \ 运行和编辑我们的项目。PyCharm 是 Python 开发的 IDE，包含代码补全、自动样式格式化和内置调试器等功能。我们将然后使用 PyCharm 开始编写自己的\
  \ URL 映射、视图和模板。它还将用于启动和停止开发服务器，这将允许通过设置断点来调试你的代码。\n\n### Exercise 1.02 – project\
  \ setup in PyCharm\n\n在此练习中，我们将打开 Bookr 项目在 PyCharm 中并设置项目解释器，以便 PyCharm 可以运行和调试项目。请按照以下步骤操作：\n\
  \n1. 打开 PyCharm。当你第一次打开 PyCharm 时，你会看到 **Welcome to PyCharm** 屏幕，询问你想要做什么：\n\n\n\
  \n![](img/4840a43efd335abd10b93708225692d6_44_0.png)\n\nFigure 1.11 – The PyCharm\
  \ welcome screen\n\n- 2. 点击 Open，然后浏览到你刚刚创建的 bookr 项目并打开它。确保你打开的是 bookr 项目目录，而不是内部的\
  \ bookr 包目录。\n\n- 3. 系统会询问你是否要信任 bookr 项目。由于你刚刚创建了它，所以是安全的，点击 Trust Project：\n\n\
  ![](img/4840a43efd335abd10b93708225692d6_44_1.png)\n\nFigure 1.12 – PyCharm’s Trust\
  \ Project dialog\n\n如果你之前从未使用过 PyCharm，它会询问你想要使用哪些设置和主题，回答完所有问题后，你将在窗口左侧的 **Project**\
  \ 面板中看到你的 **bookr** 项目结构打开：\n\n![](img/4840a43efd335abd10b93708225692d6_45_0.png)\n\
  \n你的项目面板应如下 *Figure 1.13* 所示，并显示 bookr 和 reviews 目录以及 manage.py 文件。如果没有看到这些，而看到的是\
  \ asgi.py、settings.py、urls.py 和 wsgi.py，则说明你打开的是 bookr 包目录而非项目目录。选择 **File | Open**，然后浏览并打开\
  \ bookr 项目目录。\n\n在 PyCharm 知道如何执行你的项目以启动 Django 开发服务器之前，解释器必须设置为虚拟环境内部的 Python 二进制文件。这首先通过将解释器添加到全局解释器设置中来完成。\n\
  \n- 4. 在 PyCharm 内部打开 **Preferences**（macOS）或 **Settings**（Windows/Linux）窗口：\n \
  \ - macOS：**PyCharm** 菜单 | **Preferences**\n  - Windows 和 Linux：**File** | **Settings**\n\
  \n5. 在左侧的偏好设置列表窗格中，打开 Project: bookr 项，然后点击 Project Interpreter：\n\n![](img/4840a43efd335abd10b93708225692d6_46_0.png)\n\
  \nFigure 1.14 – The project interpreter settings\n\n6. 有时，PyCharm 能够自动确定虚拟环境，因此在这种情况下，项目解释器可能已经填充了正确的解释器。如果是这样，并且你在软件包列表中看到\
  \ Django，请点击 OK 关闭窗口并完成此练习。\n\n7. 在大多数情况下，Python 解释器必须手动设置。点击 Python Interpreter\
  \ 下拉菜单旁边的齿轮图标，然后点击 Add....\n\n8. 现在会显示 Add Python Interpreter 窗口。选择 Existing environment\
  \ 单选按钮，然后点击 Interpreter 选择旁边的省略号 (...)。然后你应该浏览并选择虚拟环境的 Python 解释器。\n\n![](img/4840a43efd335abd10b93708225692d6_47_0.png)\n\
  \nFigure 1.15 – The Add Python Interpreter window\n\n9. 在 macOS 上（假设你将虚拟环境命名为 bookr），路径通常为\
  \ /Users/<yourusername>/.virtualenvs/bookr/bin/python3。类似地，在 Linux 上，它应该在 /home/<yourusername>/.virtualenvs/bookr/bin/python3。\n\
  \n10. 如果不确定，你可以在之前运行 python manage.py 命令的终端中运行 which python3 命令，它会告诉你 Python 解释器的路径：\n\
  \n```\nwhich python3\n/Users/BEN/.VIRTUALENVS/BOOKR/BIN/PYTHON3\n```\n\n在 Windows\
  \ 上，它将是你使用 virtualenv 命令创建虚拟环境的位置。\n\n选择解释器后，你的 Add Python Interpreter 窗口应如下 Figure\
  \ 1.15 所示。\n\n11. 点击 OK 关闭 Add Python Interpreter 窗口。\n\n你现在应该看到主偏好设置窗口，并且 Django（以及虚拟环境中的其他软件包）将被列出（见\
  \ Figure 1.16）。\n\n![](img/4840a43efd335abd10b93708225692d6_49_0.png)\n\nFigure\
  \ 1.18 – Adding a new Python configuration in the Run/Debug Configurations window\n\
  \n3. 一个包含有关如何运行你的项目字段的新配置面板将显示在窗口右侧。继续按如下方式填写字段：\n\n- - **Name** 字段可以是任何内容，但应易于理解。输入\
  \ `Django Dev Server`。\n\n- - **Script path** 是指向你的 `manage.py` 文件的路径。如果点击此字段中的文件夹图标，你可以浏览文件系统以选择\
  \ `bookr` 项目目录内的 `manage.py` 文件。\n\n- - **Parameters** 指的是 `manage.py` 脚本之后的参数，与从命令行运行它时相同。我们将在这里使用相同的参数来启动服务器，因此输入\
  \ `runserver`。\n\n**Note**\n如前所述，`runserver` 命令还可以接受端口或要监听的地址的参数。如果你愿意，可以在同一个 `Parameters`\
  \ 字段中在 `runserver` 之后添加此参数。\n\n4. **Python interpreter** 设置应已自动设置为在 *Exercise 1.02*\
  \ 中设置的解释器。如果没有，请点击右侧的箭头下拉菜单进行选择。\n\n**Working directory** 设置应为 `bookr` 项目目录。这可能已经正确设置。\n\
  \n8. 点击 Play 图标启动 Django 开发服务器。\n\nNote\n确保停止正在运行的其他 Django 开发服务器实例（例如在终端中）；否则，你启动的服务器将无法绑定到端口\
  \ 8000 并启动失败。\n\nPyCharm 窗口底部将打开一个控制台，显示开发服务器已启动的输出（Figure 1.21）。\n\n![](img/4840a43efd335abd10b93708225692d6_51_0.png)\n\
  \nFigure 1.21 – The console with the Django development server running\n\n9. 打开一个\
  \ Web 浏览器并导航到 http://127.0.0.1:8000。你应该会看到与你在练习 1.01 中看到的相同的 Django 示例屏幕——创建项目和应用并启动开发服务器（Figure\
  \ 1.21），这将确认一切再次设置正确。\n\n在本练习中，我们在 PyCharm 中打开了 bookr 项目，然后为项目设置了 Python 解释器。我们还在\
  \ PyCharm 中添加了一个运行配置，这使我们能够从 PyCharm 内部启动和停止 Django 开发服务器。稍后我们还将能够通过在 PyCharm 的调试器中运行项目来调试项目。\n\
  \n在本节中，我们探索了 Django 文件夹结构并了解了脚手架中目录和文件夹的目的。我们还了解了如何创建 Django 应用及其包含的文件。最后，我们在 PyCharm\
  \ 中成功运行了一个 Django 项目。\n\n## Introducing Django views\n\n你现在已准备好开始编写自己的 Django 视图并配置将映射到它们的\
  \ URL。正如我们在本章前面看到的，视图只是一个函数，它接收一个 HttpRequest 实例（由 Django 构建）和（可选）来自 URL 的一些参数。它将执行一些操作，例如从数据库获取数据。最后，它返回\
  \ HttpResponse。\n\n以我们的 Bookr 应用为例，我们可能有一个视图接收对某本书的请求。它查询数据库以获取这本书，然后返回一个包含显示书籍信息的\
  \ HTML 页面的响应。另一个视图可以接收列出所有书籍的请求，然后返回包含该列表的另一个 HTML 页面的响应。视图还可以创建或修改数据；另一个视图可以接收创建新书籍的请求，然后将书籍添加到数据库并返回显示新书籍信息的\
  \ HTML 响应。\n\n在本章中，我们只使用函数作为视图，但 Django 也支持类视图，允许你利用面向对象的范式（例如继承）。这使你能够简化在多个具有相同业务逻辑的视图中使用的代码。例如，你可能想要显示所有书籍或仅显示某个出版商的书籍。两个视图都需要从数据库查询书籍列表并将其渲染到书籍列表模板。一个视图类可以继承另一个视图类，只需以不同的方式实现数据获取，而其余功能（例如渲染）保持相同。类视图可能更强大，但也更难学习。它们将在第\
  \ 11 章《高级模板和类视图》中介绍，当你对 Django 有更多经验时。\n\n传递给视图的 HttpRequest 实例包含与请求相关的所有数据，其属性如下：\n\
  \n- - method：一个字符串，包含浏览器用于请求页面的 HTTP 方法，通常为 GET，但如果用户提交了表单则为 POST。你可以使用它来改变视图的流程——例如，在\
  \ GET 时显示空表单，或在 POST 时验证并处理表单提交。\n- - GET：这是一个 QueryDict 类，包含 URL 查询字符串中使用的参数。这是\
  \ URL 中 ? 之后的部分（如果有）。我们很快会更深入地了解 QueryDict 类。请注意，即使请求不是 GET，此属性也始终可用。\n- - POST：这也是一个\
  \ QueryDict，包含在 POST 请求中发送到视图的参数，例如来自表单提交。通常，你会将其与 Django 表单一起使用，这将在第 6 章《表单》中介绍。\n\
  - - headers：这是一个不区分大小写的键字典，其中包含来自请求的 HTTP 头。例如，你可以根据 User-Agent 头为不同浏览器提供不同的内容来改变响应。我们在本章前面讨论了一些由客户端发送的\
  \ HTTP 头。\n\n\n\n\n\n+   - path: 这是在请求中使用的路径。通常，你不需要检查它，因为 Django 会自动解析路径并将其作为参数传递给视图函数，但在某些情况下它会很有用。\n\
  \n我们现在还不会使用所有这些属性，并且稍后还会介绍其他属性，但你现在可以看到 HttpRequest 参数在你的视图中扮演的角色。\n\n接下来，我们将了解\
  \ Django 如何确定针对特定 URL 使用哪个视图。\n\n## 探索 URL 映射细节\n\n我们在“处理请求”部分中简要提到了 URL 映射。Django\
  \ 并不会自动知道在收到特定 URL 的请求时应该执行哪个视图函数。URL 映射的作用是建立 URL 与视图之间的链接。例如，在 Bookr 中，你可能希望将\
  \ /books/ URL 映射到你创建的 books_list 视图。\n\nURL 到视图的映射在 Django 自动创建的文件 urls.py 中定义，位于\
  \ bookr 包目录内（尽管也可以在 settings.py 中设置不同的文件；稍后会详细介绍）。\n\n该文件包含一个变量 urlpatterns，它是一个路径列表，Django\
  \ 会依次评估这些路径，直到找到与所请求 URL 匹配的路径。匹配结果将解析为一个视图函数或另一个 urls.py 文件，其中也包含 urlpatterns 变量，将以相同的方式解析。URL\
  \ 文件可以以这种方式无限链式连接。这样，你就可以将 URL 映射拆分为单独的文件（例如每个应用一个或多个），以免变得过大。一旦找到视图，Django 就会使用\
  \ HttpRequest 和从 URL 解析出的任何参数调用它。\n\n规则是通过调用 path 函数来设置的，该函数将 URL 的路径作为第一个参数。路径可以包含将作为函数参数传递给视图的命名参数。它的第二个参数是视图或另一个也包含\
  \ urlpatterns 的文件。\n\n还有 re_path 函数，它与 path 类似，只是它将正则表达式作为第一个参数，以便进行更高级的配置。URL 映射还有很多内容；它将在第\
  \ 3 章《URL 映射、视图和模板》中介绍。为了说明这些概念，图 1.22 显示了 Django 生成的默认 urls.py 文件：\n\n```\nfrom\
  \ django.contrib import admin\nfrom django.urls import path\n\nurlpatterns = [\n\
  \    path('admin/', admin.site.urls),\n]\n```\n\n图 1.22 – 默认的 urls.py 文件\n\n你可以看到列出所有已设置\
  \ URL 的 `urlpatterns` 变量。目前只设置了一条规则，它将以 `admin/` 开头的任何路径映射到 admin URL 映射（`admin.site.urls`\
  \ 模块）。这不是映射到视图；相反，它是链式连接 URL 映射的示例 – `admin.site.urls` 模块将定义剩余的路径（在 `admin/` 之后），这些路径映射到\
  \ admin 视图。我们将在本书后面介绍 Django 管理站点，从 *第 4 章，Django 管理简介* 开始。\n\n我们现在将编写一个视图并为其设置\
  \ URL 映射，以便实际操作。\n\n## 练习 1.03 – 编写一个视图并将 URL 映射到它\n\n我们的第一个视图将非常简单，只返回一些静态文本内容。在本练习中，我们将了解如何编写视图并设置\
  \ URL 映射以解析到视图：\n\n> **注意**\n> 当你在项目中修改文件并保存时，你可能会看到运行 Django 开发服务器的终端或控制台中服务器自动重启。这是正常的——它会自动重启以加载你所做的代码更改。请注意，如果你编辑模型或迁移，它不会自动应用对数据库的更改——有关此内容的更多信息将在\
  \ *第 2 章，模型和迁移* 中介绍。\n\n-   1. 在 PyCharm 中，展开左侧 **Project** 浏览器中的 `reviews` 文件夹，然后双击其中的\
  \ `views.py` 文件以打开它。在 PyCharm 的右侧（编辑器）窗格中，你应该会看到 Django 自动生成的占位符文本：\n\n```\nfrom\
  \ django.shortcuts import render\n\n# Create your views here.\n```\n\n![](img/4840a43efd335abd10b93708225692d6_55_0.png)\n\
  \n图 1.23 – views.py 默认内容\n\n-   2. 从 views.py 中删除此占位符文本，并改插入以下内容：\n\n```\nfrom django.http\
  \ import HttpResponse\n\ndef index(request):\n    return HttpResponse(\"Hello, world!\"\
  )\n```\n\n首先，需要从 django.http 导入 HttpResponse 类。这用于创建返回给 Web 浏览器的响应。你也可以用它来控制诸如 HTTP\
  \ 头或状态码之类的内容。现在，它将只使用默认的头和 200 Success 状态码。它的第一个参数是要作为响应正文发送的字符串内容。\n\n然后，视图函数返回一个\
  \ HttpResponse 实例，其中包含我们定义的内容（Hello, world!）。\n\n![](img/4840a43efd335abd10b93708225692d6_56_0.png)\n\
  \n图 1.24 – 编辑后的 views.py 内容\n\n3. 我们现在将为 index 视图设置一个 URL 映射。这将非常简单，不包含任何参数。展开项目窗格中的\
  \ bookr 目录，然后打开 urls.py。Django 已自动生成此文件。\n\n现在，我们只需添加一个简单的 URL 来替换 Django 提供的默认索引。\n\
  \n4. 通过在其他现有导入之后添加以下行，将你的视图导入到 urls.py 文件中：\n\n```\nimport reviews.views\n```\n\n\
  5. 通过添加对 path 函数的调用，使用空字符串和对 index 函数的引用，将映射到 index 视图添加到 urlpatterns 列表中：\n\n```\n\
  urlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', reviews.views.index)\n\
  ]\n```\n\n确保不要在 index 函数后添加括号（即应为 reviews.views.index 而不是 reviews.views.index()，因为我们传递的是对函数的引用而不是调用它。完成后，你的\
  \ urls.py 文件应如下图 1.25 所示。\n\n![](img/4840a43efd335abd10b93708225692d6_57_0.png)\n\
  \n图 1.25 – 编辑后的 urls.py\n\n6. 切换回你的 Web 浏览器并刷新。Django 默认欢迎屏幕应被视图中定义的文本 Hello, world!\
  \ 替换。\n\n![](img/4840a43efd335abd10b93708225692d6_57_1.png)\n\n图 1.26 – Web 浏览器现在应显示\
  \ Hello, world! 消息\n\n我们刚刚了解了如何编写视图函数并将 URL 映射到它。然后我们通过在 Web 浏览器中加载它来测试视图。\n\n接下来，我们将了解如何处理通过\
  \ HTTP 请求发送但不在 URL 路径中的数据。\n\n## 使用 GET、POST 和 QueryDict 对象\n\n数据可以通过 URL 上的参数或\
  \ POST 请求的主体作为 HTTP 请求的一部分传入。你可能在浏览网页时注意到 URL 中的参数——问号 ? 后的文本——例如，http://www.example.com/?parameter1=value1&parameter2=value2。我们在本章前面也看到了登录用户时\
  \ POST 请求中的表单数据示例（请求主体为 username=user&password=password1）。\n\nDjango 会自动将这些参数字符串解析为\
  \ QueryDict 对象。数据随后可在传递给你的视图的 HttpRequest 对象上使用——具体来说，分别用于 URL 参数和主体参数的 HttpRequest.GET\
  \ 和 HttpRequest.POST 属性。QueryDict 对象在大多数情况下表现得像字典，只是它们可以为一个键包含多个值。\n\n为了展示访问项的不同方法，我们将使用一个简单的\
  \ QueryDict（qd 变量）作为示例，其中只有一个键（k）。k 项在列表中有三个值——字符串 a、b 和 c。以下代码片段显示了 Python 解释器的输出。\n\
  \n首先，从参数字符串构造 QueryDict qd 变量：\n\n```\n>>> qd = QueryDict(\"k=a&k=b&k=c\")\n```\n\
  \n使用方括号表示法或 get 方法访问项时，将返回该键的最后一个值：\n\n```\n>>> qd[\"k\"]\n'c'\n>>> qd.get(\"k\"\
  )\n'c'\n```\n\n要访问键的所有值，应使用 getlist 方法，如下所示：\n\n```\n>>> qd.getlist(\"k\")\n['a',\
  \ 'b', 'c']\n```\n\ngetlist 总是返回一个列表；如果键不存在，则为空：\n\n```\n>>> qd.getlist(\"bad key\"\
  )\n[]\n```\n\n\n\n\n\n虽然 `getlist` 对不存在的键不会抛出异常，但使用方括号表示法访问不存在的键会像普通字典一样抛出 `KeyError`。请使用\
  \ `get` 方法来避免此错误。\n\nGET 和 POST 的 `QueryDict` 对象是不可变的（无法更改），因此如果你需要更改其值，应使用 `copy`\
  \ 方法获取可变副本，如下所示：\n\n```\n>>> qd[\"k\"] = \"d\"\nAttributeError: This QueryDict instance\
  \ is immutable\n>>> qd2 = qd.copy()\n>>> qd2\n<QueryDict: {'k': ['a', 'b', 'c']}>\n\
  >>> qd2[\"k\"] = \"d\"\n>>> qd2[\"k\"]\n\"d\"\n```\n\n为了举例说明 `QueryDict` 是如何从 URL\
  \ 填充的，让我们设想一个示例 URL：http://127.0.0.1:8000?val1=a&val2=b&val2=c&val3。\n\n在后台，Django\
  \ 会将 URL 中的查询（? 之后的所有内容）传入以实例化一个 `QueryDict` 对象，并将其附加到传给视图函数的 `request` 上。过程大致如下：\n\
  \n```\nrequest.GET = QueryDict(\"val1=a&val2=b&val2=c&val3\")\n```\n\n请记住，这是在视图函数内收到\
  \ `request` 之前完成的，因此您无需执行此操作。\n\n对于上面的示例 URL，我们可以按如下方式访问视图函数中的参数：\n\n```\nrequest.GET[\"\
  val1\"]\n```\n\n使用标准字典访问，它将返回 \"a\" 值：\n\n```\nrequest.GET[\"val2\"]\n```\n\n同样，使用标准字典访问，由于\
  \ `val2` 键设置了两个值，它将返回最后一个值 \"c\"：\n\n```\nrequest.GET.getlist(\"val2\")\n```\n\n\
  这将返回 `val2` 的所有值组成的列表 - [\"b\", \"c\"]：\n\n```\nrequest.GET[\"val3\"]\n```\n\n-\
  \ 3. 在浏览器中访问 `http://127.0.0.1:8000`。请注意，页面仍然显示 **Hello, world!** 这是因为我们还没有提供 `name`\
  \ 参数。您可以将名字添加到 URL 中——例如，`http://127.0.0.1:8000?name=Ben`。这可以在以下截图中看到：\n\n![](img/4840a43efd335abd10b93708225692d6_61_0.png)\n\
  \n图 1.28 – 在 URL 中设置名字\n\n- 4. 尝试添加两个名字——例如，`http://127.0.0.1:8000?name=Ben&name=John`。如前所述，`get`\
  \ 函数会获取参数的最后一个值，因此您应该看到 **Hello, John!**：\n\n![](img/4840a43efd335abd10b93708225692d6_61_1.png)\n\
  \n图 1.29 – 在 URL 中设置多个名字\n\n- 5. 尝试不设置名字，如下所示——`http://127.0.0.1:8000?name=`。页面应恢复显示\
  \ **Hello, world!**：\n\n![](img/4840a43efd335abd10b93708225692d6_62_0.png)\n\n>\
  \ **注意**\n>\n> 您可能想知道为什么我们使用 `or` 将 name 设置为默认值 **world**，而不是将 `'world'` 作为默认值传给\
  \ `get`。想一想在 *步骤 6* 中，当我们为 `name` 参数传入一个空值时发生了什么。如果我们把 `'world'` 作为 `get` 的默认值，`get`\
  \ 函数仍然会返回一个空字符串。这是因为 `name` 已经设置了一个值；只是该值为空。在开发视图时请记住这一点，因为未设置值和设置为空值是有区别的。根据您的用例，您可以选择将默认值传给\
  \ `get`。\n\n在本练习中，我们在视图中使用传入请求的 `GET` 属性从 URL 检索值。我们了解了如何设置默认值，以及如果同一参数设置了多个值，会检索哪个值。视图返回了\
  \ `HttpResponse`，其中包含我们想要发送到浏览器的消息。\n\n在下一节中，我们将学习如何更新和使用 Django 的设置。\n\n## 探索 Django\
  \ 设置\n\n我们还没有查看 Django 如何存储其设置。现在我们已经了解了 Django 的不同部分，现在是检查 `settings.py` 文件的好时机。Django\
  \ 包含许多可用于自定义它的设置。当您启动 Bookr 项目时，系统会为您创建一个默认的 `settings.py` 文件。我们现在将讨论文件中一些更重要的设置，以及随着您对\
  \ Django 越来越熟练可能会用到的一些其他设置。您应该在 PyCharm 中打开 `settings.py` 文件并跟着操作，以便查看项目中的值位于何处以及具体是什么值。\n\
  \n此文件中的每个设置只是一个文件级全局变量。我们将按它们在此文件中出现的顺序来讨论，虽然我们可能会跳过一些设置——例如，在 `DEBUG` 和 `INSTALLED_APPS`\
  \ 之间有一个 `ALLOWED_HOSTS` 设置，我们不会在本书的这一部分介绍它（您将在第 16 章“Django 应用程序的部署”中看到它）：\n\n```\n\
  SECRET_KEY = '...'\n```\n\n这是一个自动生成的值，不应与任何人共享。它用于哈希、令牌和其他加密功能。如果 cookie 中已有现有会话，并且您更改了此值，则这些会话将不再有效：\n\
  \n```\nDEBUG = True\n```\n\n将此值设置为 `True` 后，Django 会自动向浏览器显示异常，以便您调试遇到的任何问题。当您将应用部署到生产环境时，应将其设置为\
  \ `False`：\n\n```\nINSTALLED_APPS = [...]\n```\n\n当您编写自己的 Django 应用（例如 reviews 应用）或安装第三方应用（这将在第\
  \ 15 章“集成第三方库”中介绍）时，应将它们添加到此列表中。正如我们所见，在此处添加它们并不是严格必需的（我们的 index 视图在 reviews 应用不在列表中的情况下也能正常工作）。但是，为了让\
  \ Django 能够自动找到应用的模板、静态文件、迁移和其他配置，必须在此处列出：\n\n```\nROOT_URLCONF = 'bookr.urls'\n\
  ```\n\n这是 Django 首先加载以查找 URL 的 Python 模块。请注意，它就是我们之前将 index 视图 URL 映射添加到的文件：\n\n\
  ```\nTEMPLATES = [...]\n```\n\n现在，理解此设置中的所有内容并不十分重要，因为您不会更改它；需要指出的一行是：\n\n```\n\
  'APP_DIRS': True,\n```\n\n这告诉 Django，在加载要渲染的模板时，它应在每个 `INSTALLED_APP` 内的 `templates`\
  \ 目录中查找。我们还没有为 reviews 创建 `templates` 目录，但将在下一个练习中添加一个。\n\nDjango 还有更多设置未在 settings.py\
  \ 文件中列出，因此在这些情况下它将使用其内置默认值。您也可以使用该文件为您的应用程序设置任意自定义设置。第三方应用可能也希望在此处添加设置。在后面的章节中，我们将在此处为其他应用添加设置。您可以在\
  \ https://docs.djangoproject.com/en/3.0/ref/settings/ 找到所有设置及其默认值的列表。\n\n## 在代码中引用\
  \ Django 设置\n\n有时在自己的代码中引用 settings.py 中的设置会很有用，无论这些设置是 Django 的内建设置还是您自己定义的设置。您可能会倾向于编写如下导入设置的代码：\n\
  \n```\nfrom bookr import settings\n\nif settings.DEBUG:  # check if running in DEBUG\
  \ mode\n    do_some_logging()\n```\n\n这种方法是不正确的，原因如下：\n\n- 您可以运行 Django 并指定一个不同的设置文件来读取，在这种情况下，前面的代码会引发错误，因为它无法找到该文件。或者，如果文件存在，导入会成功，但会包含错误的设置。\n\
  - Django 有一些设置可能不在 settings.py 文件中列出，如果没有列出，它将使用自己的内部默认值。例如，如果您从 settings.py 文件中删除了\
  \ `DEBUG = True` 这一行，Django 将回退到使用其内部的 `DEBUG` 值（即 `False`）。但是，如果您尝试直接使用 `settings.DEBUG`\
  \ 访问它，您将收到错误。\n- 第三方库可以改变设置的定义方式，因此您的 settings.py 文件看起来会完全不同。预期的变量可能根本不存在。所有这些应用的行为超出了本书的范围，但这是需要注意的一点。\n\
  \n首选方法是改用 `django.conf` 模块，如下所示：\n\n```\nfrom django.conf import settings  # import\
  \ settings from here instead\n\nif settings.DEBUG:\n    do_some_logging()\n```\n\
  \n从 `django.conf` 导入设置时，Django 会缓解我们刚才讨论的三个问题：\n\n- 设置从指定的任何 Django 设置文件中读取\n- 任何默认设置值都会被填充\n\
  - Django 负责解析第三方库定义的任何设置\n\n在我们新的、更短的示例代码片段中，即使 settings.py 文件中缺少 `DEBUG`，它也会回退到\
  \ Django 内部默认值（即 `False`）。Django 定义的所有其他设置也是如此；但是，如果您在此文件中定义自己的自定义设置，Django 不会有它们的内部值，因此在您的代码中，您应该为它们不存在的情况做好准备——您的代码如何表现由您决定，并且超出了本书的范围。\n\
  \n\n\n\n接下来，我们将了解 Django 如何定位模板文件。\n\n## 在应用目录中查找 HTML 模板\n\n有许多选项可用来告诉 Django 如何查找模板，这些选项可以在\
  \ settings.py 的 TEMPLATES 设置中进行配置，但（目前）最简单的做法是在 reviews 目录内创建一个 templates 目录。由于\
  \ settings.py 中的 APP_DIRS 为 True（如上一节所见），Django 会查找该目录（以及其他应用的 templates 目录）。然而，要让\
  \ Django 知道 reviews 目录是一个应用，我们需要在设置中对其进行配置。我们将在下一个练习中完成这一点。\n\n## 练习 1.05 – 创建 templates\
  \ 目录和基础模板\n\n在本练习中，你将为 reviews 应用创建一个 templates 目录。然后，你将添加一个 HTML 模板文件，Django 可以将其渲染为\
  \ HTTP 响应。\n\n我们在“探索 Django 设置”一节中讨论过 settings.py 及其 INSTALLED_APPS 设置。我们需要将 reviews\
  \ 应用添加到 INSTALLED_APPS 中，以便 Django 能够找到模板。请按照以下步骤操作：\n\n- 1. 在 PyCharm 中打开 settings.py。更新\
  \ INSTALLED_APPS 设置，并在末尾添加 reviews。它应如下所示：\n\n```\nINSTALLED_APPS = [\n    'django.contrib.admin',\n\
  \    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n\
  \    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'reviews'\n\
  ]\n```\n\n图 1.31 – 已将 reviews 应用添加到 settings.py\n\n- 2. 保存并关闭 settings.py。\n\n-\
  \ 3. 在 PyCharm 的项目浏览器中，右键单击 reviews 目录，然后选择“新建 | 目录”。\n\n图 1.32 – 在 reviews 目录内新建一个目录\n\
  \n4. 输入名称 `templates`，然后按 *Enter/Return* 键创建它：\n\n![](img/4840a43efd335abd10b93708225692d6_67_0.png)\n\
  \n图 1.33 – 将目录命名为 templates\n\n5. 右键单击新创建的 `templates` 目录，然后选择 **新建 | HTML 文件**。\n\
  \n![](img/4840a43efd335abd10b93708225692d6_67_1.png)\n\n图 1.34 – 在 templates 目录中新建一个\
  \ HTML 文件\n\n6. 在出现的窗口中，输入名称 `base.html`，保持选中 **HTML 5 文件**，然后按 *Enter/Return* 键创建文件：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_67_2.png)\n\n图 1.35 – 新建 HTML 文件窗口\n\n\
  7. PyCharm 创建文件后，也会自动打开该文件。其内容如下：\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n\
  <head>\n    <meta charset=\"UTF-8\">\n    <title>Title</title>\n</head>\n<body>\n\
  \n</body>\n</html>\n```\n\n8. 在 <body> 和 </body> 标签之间，添加一条简短消息，以验证模板正在被渲染：\n\n```\n\
  <body>\n    Hello from a template!\n</body>\n```\n\n以下截图展示了你的完整代码应呈现的样子：\n\n![](img/4840a43efd335abd10b93708225692d6_68_0.png)\n\
  \n图 1.36 – 带有一些示例文本的 base.html 模板\n\n在本练习中，我们为 reviews 应用创建了一个 templates 目录，并添加了一个\
  \ HTML 模板。一旦我们在视图上实现 render 函数的使用，该 HTML 模板就会被渲染。\n\n## 使用 render 函数渲染模板\n\n现在我们有一个可用的模板，但我们需要更新\
  \ index 视图，使其渲染该模板，而不是像当前那样返回 “Hello (name)!” 文本（可参考图 1.30 查看当前效果）。我们将通过使用 render\
  \ 函数并提供模板名称来实现这一点。render 是一个返回 HttpResponse 的快捷函数。还有其他渲染模板的方法可以提供更多控制，但目前这个函数已足够满足我们的需求。render\
  \ 至少接受两个参数——第一个始终是传递给视图的 request，第二个是被渲染模板的名称/相对路径。我们还将使用第三个参数调用它，即包含模板中所有可用变量的渲染上下文——有关这方面的更多内容，将在练习\
  \ 1.07“在模板中使用变量”中介绍。\n\n## 练习 1.06 – 在视图中渲染模板\n\n在本练习中，你将更新 index 视图函数，以渲染你在练习 1.05“创建\
  \ templates 目录和基础模板”中创建的 HTML 模板。你将使用 render 函数，该函数会从磁盘加载你的模板，渲染它，并将其发送到浏览器。这将取代你当前从\
  \ index 视图函数返回的静态文本：\n\n- 1. 在 PyCharm 中，打开 reviews 目录中的 views.py。\n- 2. 我们不再手动创建\
  \ HttpResponse，因此删除导入 HttpResponse 的那一行：\n\n```\nfrom django.http import HttpResponse\n\
  ```\n\n- 3. 将其替换为从 django.shortcuts 导入 render 函数的语句：\n\n```\nfrom django.shortcuts\
  \ import render\n```\n\n- 4. 更新 index 函数，使其不再返回 HttpResponse，而是返回对 render 的调用，并传入\
  \ request 和模板名称：\n\n```\ndef index(request):\n    return render(request, \"base.html\"\
  )\n```\n\n以下截图展示了完整的 views.py 文件：\n\n![](img/4840a43efd335abd10b93708225692d6_70_0.png)\n\
  \n图 1.37 – 完成了模板渲染的 view.py\n\n5. 如果开发服务器尚未运行，请启动它。然后，打开你的 Web 浏览器并刷新 http://127.0.0.1:8000。你应该会看到渲染出的“Hello\
  \ from a template!”消息，如图 1.38 所示：\n\n![](img/4840a43efd335abd10b93708225692d6_70_1.png)\n\
  \n图 1.38 – 你渲染的第一个 HTML 模板\n\n## 在模板中渲染变量\n\n模板并非仅仅是静态 HTML。大多数情况下，它们会包含在渲染过程中被插值的变量。这些变量通过上下文（context）从视图传递给模板——上下文是一个字典（或类似字典的对象），包含模板可以使用的所有变量的名称。我们再次以\
  \ Bookr 为例。如果模板中没有变量，那么每显示一本书，你就需要一个不同的 HTML 文件。相反，我们在模板中使用诸如 book_name 这样的变量，然后视图为模板提供一个\
  \ book_name 变量，其值设为其加载的书籍模型的标题。当显示另一本书时，HTML 无需更改；视图只是向它传递一本不同的书。你可以看到模型、视图和模板现在是如何协同工作的。\n\
  \n与 PHP 等其他一些语言不同，变量必须显式传递给模板，视图中的变量不会自动对模板可用。这既是出于安全原因，也是为了避免意外污染模板的命名空间（我们不希望模板中出现任何意外的变量）。\n\
  \n在模板内部，变量用双花括号 – {{ }} 表示。虽然这并非严格的标准，但这种风格相当常见，并用于其他模板工具，如 Vue.js 和 Mustache。Symfony（一个\
  \ PHP 框架）在其 Twig 模板语言中也使用了双花括号，因此你可能在那里见过类似的用法。\n\n要在模板中渲染变量，只需用花括号将其包裹起来 – {{ book_name\
  \ }}。Django 会自动对输出中的 HTML 进行转义，因此你可以在变量中包含特殊字符（如 < 或 >），而不必担心它会破坏你的输出。如果某个变量未传递给模板，Django\
  \ 只会在该位置渲染为空，而不会抛出异常。\n\n还有更多使用过滤器以不同方式渲染变量的方法，但这些将在第 3 章“URL 路由器、视图和模板”中介绍。\n\n\
  ## 练习 1.07 – 在模板中使用变量\n\n我们将在 base.html 文件中放入一个简单变量，以演示 Django 的变量插值是如何工作的：\n\n\
  - 1. 在 PyCharm 中，打开 base.html 文件。\n- 2. 更新 <body> 元素，使其包含一个渲染 name 变量的位置：\n\n```\n\
  <body>\nHello, {{ name }}!\n</body>\n```\n\n3. 回到你的 Web 浏览器并刷新（你应该仍在 http://127.0.0.1:8000）。你会看到页面现在显示\
  \ “Hello, !”。这是因为我们尚未在渲染上下文中设置 name 变量。\n\n![](img/4840a43efd335abd10b93708225692d6_72_0.png)\n\
  \n图 1.39 – 由于未设置上下文，模板中没有渲染出任何值\n\n4. 打开 views.py，在 index 函数中添加一个名为 name 的变量，并将其值设置为\
  \ \"world\"：\n\n```\ndef index(request):\n    name = \"world\"\n    return render(request,\
  \ \"base.html\")\n```\n\n5. 再次刷新浏览器。请注意，没有任何变化——我们想要渲染的任何内容都必须作为上下文显式传递给 render\
  \ 函数。这是在渲染时可供使用的变量字典。\n\n6. 将上下文字典作为第三个参数传递给 render 函数。将你的 render 代码行改为如下：\n\n```\n\
  return render(request, \"base.html\", {\"name\": name})\n```\n\n\n\n整个 views.py\
  \ 文件在下面的截图中显示：\n\n![](img/4840a43efd335abd10b93708225692d6_73_0.png)\n\n图 1.40 –\
  \ views.py 中在 render 上下文中设置了 name 变量\n\n- 7. 再次刷新浏览器，你会看到它现在显示 Hello, world!。\n\n\
  ![](img/4840a43efd335abd10b93708225692d6_73_1.png)\n\n图 1.41 – 使用变量渲染的模板\n\n在本练习中，我们将上一练习中创建的模板与\
  \ render 函数结合起来，渲染一个 HTML 页面，其中 name 变量通过上下文字典传递给它。\n\n在下一节中，我们将看看一些调试代码和处理错误的方法。\n\
  \n## 调试和处理错误\n\n在编程时，除非你是从不犯错的完美程序员，否则你可能在某个时候需要处理错误或调试代码。当程序中出现错误时，通常有两种方式可以察觉——要么你的代码会引发异常，要么在查看页面时你会得到意外的输出或结果。你可能会更频繁地看到异常，因为有很多偶然的方式会导致它们。如果你的代码生成了意外的输出但没有引发任何异常，你可能希望使用\
  \ PyCharm 调试器来找出原因。\n\n我们将首先概述一些 Python 异常以及如何处理它们，并附带一个练习来演示 Django 如何显示异常。然后，我们将看看如何在\
  \ PyCharm 调试器中运行 Django，以便在程序执行时窥探其内部。\n\n## 异常\n\n如果你之前使用过 Python 或其他编程语言，你可能已经遇到过异常。如果没有，这里有一个快速介绍。异常在发生错误时会被\
  \ *引发*（在其他语言中称为 *抛出*）。程序的执行在代码的该点停止，并且异常会沿着函数调用链向后传播，直到被捕获。如果未被捕获，则程序将崩溃，有时还会显示描述异常及其发生位置的错误消息。Python\
  \ 本身会引发一些异常，你的代码也可以在任何时候引发异常以快速停止执行。你在用 Python 编程时可能会看到的一些常见异常如下：\n\n- **IndentationError**：如果你的代码缩进不正确或混合使用了制表符和空格，Python\
  \ 会引发此错误\n- **SyntaxError**：如果你的代码语法无效，Python 会引发此错误：\n```\n>>> a === 1\n  File\
  \ \"<stdin>\", line 1\n    a === 1\n        ^\nSyntaxError: invalid syntax\n```\n\
  - **ImportError**：当导入失败时引发——例如，尝试从不存在的文件导入或尝试导入文件中未设置的名称：\n```\n>>> import missing_file\n\
  Traceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\nImportError:\
  \ No module named missing_file\n```\n\n```\n>>> a === 1\n  File \"<stdin>\", line\
  \ 1\n    a === 1\n        ^\nSyntaxError: invalid syntax\n```\n\n```\n>>> import\
  \ missing_file\nTraceback (most recent call last):\n  File \"<stdin>\", line 1,\
  \ in <module>\nImportError: No module named missing_file\n```\n\n- NameError：尝试访问尚未设置变量时引发：\n\
  ```\n>>> a = b + 5\nTraceback (most recent call last):\n  File \"<stdin>\", line\
  \ 1, in <module>\nNameError: name 'b' is not defined\n```\n- KeyError：访问 dict（或类似\
  \ dict 的对象）中未设置的键时引发：\n```\n>>> d = {'a': 1}\n>>> d['b']\nTraceback (most recent\
  \ call last):\n  File \"<stdin>\", line 1, in <module>\nKeyError: 'b'\n```\n- IndexError：访问列表索引超出长度时引发：\n\
  ```\n>>> l = ['a', 'b']\n>>> l[3]\nTraceback (most recent call last):\n  File \"\
  <stdin>\", line 1, in <module>\nIndexError: list index out of range\n```\n- TypeError：尝试对不支持该操作的<|message|>\n\
  ```\n>>> 1 + '1'\nTraceback (most recent call last):\n  File \"<stdin>\", line 1,\
  \ in <module>\nTypeError: unsupported operand type(s) for +: 'int' and 'str'\n```\n\
  \nDjango 也会引发自己的自定义异常，你将在本书中逐步了解它们。\n\n当使用 settings.py 文件中 DEBUG = True 运行 Django\
  \ 开发服务器时，Django 会自动捕获代码中发生的异常（而不是崩溃）。它随后会生成一个 HTTP 响应，向你展示堆栈跟踪和其他信息以帮助你调试问题。在生产环境中运行，DEBUG\
  \ 应设置为 False。Django 然后会返回一个标准的内部服务器错误页面，而不包含任何敏感信息。你也可以选择显示自定义错误页面。\n\n## 练习 1.08\
  \ – 生成和查看异常\n\n让我们在视图中创建一个简单的异常，以便你熟悉 Django 如何显示它们。在这种情况下，我们将尝试使用一个不存在的变量，这将引发\
  \ NameError：\n\n- 1. 在 PyCharm 中打开 views.py。在 index 视图函数中，修改发送给 render 函数的上下文，使其使用一个不存在的变量。我们将尝试在上下文字典中发送\
  \ invalid_name，而不是 name。不要更改上下文字典的键，只更改其值：\n```\nreturn render(request, \"base.html\"\
  , {\"name\": invalid_name})\n```\n- 2. 返回浏览器并刷新页面。你应该会看到类似图 1.42 的屏幕：\n\n```\nreturn\
  \ render(request, \"base.html\", {\"name\": invalid_name})\n```\n\n![](img/4840a43efd335abd10b93708225692d6_76_0.png)\n\
  \n图 1.42 – Django 异常屏幕\n\n# 图 1.45 – 第 5 行的断点\n\n4. 返回浏览器并刷新页面。你的浏览器不会显示任何内容；相反，它将继续尝试加载页面。根据你的操作系统，PyCharm\
  \ 应该再次变得活跃；如果没有，将其带到前台。你应该会看到第 5 行被高亮显示，并且在窗口底部显示调试器。堆栈帧（调用到当前行的函数链）在左侧，当前函数的变量在右侧。\n\
  \n![](img/4840a43efd335abd10b93708225692d6_79_0.png)\n\n# 图 1.46 – 调试器在当前行（5）高亮处暂停\n\
  \n当前作用域中只有一个变量 request。如果你点击其名称左侧的切换三角形，可以显示或隐藏它所设置的属性。\n\n![](img/4840a43efd335abd10b93708225692d6_80_0.png)\n\
  \n图 1.47 – request 变量的属性\n\n例如，如果你向下滚动属性列表，你可以看到 method 是 GET 而 path 是 /。\n\n![](img/4840a43efd335abd10b93708225692d6_80_1.png)\n\
  \n图 1.48 – 操作栏\n\n5. 操作栏，如图 1.48 所示，位于堆栈帧和变量之上。其按钮（从左到右）如下：\n\n- Step Over：执行当前行代码并继续到下一行。\n\
  - Step Into：进入当前行。例如，如果该行包含一个函数，它将继续在调试器中进入该函数。\n\n- **Step into My Code**：进入正在执行的行，但继续直到找到你编写的代码。例如，如果你正在进入第三方库代码，而该代码后来调用了你的代码，它不会显示第三方代码，而是继续直到返回到你编写的代码。\n\
  - **Step Out**：从当前代码返回到调用它的函数或方法。它是 **Step In** 操作的相反操作。\n- **Run to Cursor**：如果你有一个比当前位置更靠后的代码行想要执行，而不想为中间的所有行点击\
  \ Step Over，请将光标放在该行上。然后点击 **Run to Cursor**，执行将继续直到该行。\n\n请注意，并非所有按钮在任何时候都很有用。例如，很容易跳出你的视图并最终混淆\
  \ Django 库代码。\n\n- 6. 点击 **Step Over** 按钮一次以执行第 5 行。\n- 7. 你可以看到 name 变量已添加到调试器视图的变量列表中，其值为\
  \ world。\n\n![](img/4840a43efd335abd10b93708225692d6_81_0.png)\n\n图 1.49 – 新变量 name\
  \ 现在在作用域中，其值为 world\n\n- 8. 我们现在位于 index 视图函数的末尾，如果我们对这行代码执行下一步，它将跳转到 Django 库代码，我们不想看到它。要继续执行并将响应发送回浏览器，请点击窗口左侧的\
  \ **Resume Program** 按钮（图 1.50）。你应该会看到浏览器现在再次加载了页面：\n\n![](img/4840a43efd335abd10b93708225692d6_81_1.png)\n\
  \n图 1.50 – 控制执行的动作——绿色播放图标是 Resume Program 按钮\n\n\n\n\n图1.50中还有更多按钮；自上而下分别是**重新运行**（停止程序并重新启动）、**修改运行配置...**（打开运行配置窗口）、**恢复程序**（继续运行直到下一个断点）、**暂停程序**（在程序当前执行点处中断）、**停止**（停止调试器）、**查看断点**（打开窗口查看所有已设置的断点）和**静音断点**（用于将全部断点切换为启用或禁用，但不会移除它们）。\n\
  \n9. 现在，点击 PyCharm 中的断点（第5行旁边的红色圆圈）将其关闭。\n\n![](img/4840a43efd335abd10b93708225692d6_82_0.png)\n\
  \n图1.51 – 单击第5行上的断点会将其禁用\n\n这只是对如何在 PyCharm 中设置断点的简要介绍。如果你在其他 IDE 中使用过调试功能，那么你应该熟悉这些概念——你可以单步执行代码、进入或跳出函数，或计算表达式。设置断点后，你可以右键单击断点来更改选项。例如，你可以让断点带有条件，使执行只在特定情况下停止。所有这些都超出了本书的范围，但在尝试解决代码中的问题时，了解这些是很有用的。\n\
  \n在本章结束时，我们将完成两个活动。首先，你将构建 Bookr 的欢迎页面，然后搭建图书搜索页面的框架。\n\n### 活动 1.01 – 创建站点欢迎页面\n\
  \n我们正在构建的 Bookr 网站需要一个欢迎页，向用户致意并让他们知道自己所在的网站。该页面还将包含指向网站其他部分的链接，但这些链接将在后续章节中添加。现在，你将创建一个带有欢迎消息的页面。\n\
  \n以下步骤将帮助你完成此活动：\n\n1. 在你的 `index` 视图中，渲染 `base.html` 模板。\n2. 更新 `base.html` 模板，使其包含欢迎消息。消息应同时放在\
  \ `<head>` 中的 `<title>` 标签内，以及正文中一个新的 `<h1>` 标签内。\n\n完成此活动后，你应该能看到类似下面的内容：\n\n![](img/4840a43efd335abd10b93708225692d6_83_0.png)\n\
  \n图1.52 – Bookr 欢迎页面\n\n**注意**\n\n此活动的解决方案可在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions\
  \ 找到。\n\n在下一个活动中，你将构建一个基本页面，用于在 Bookr 中显示图书搜索结果。\n\n### 活动 1.02 – 图书搜索脚手架\n\n像 Bookr\
  \ 这样的网站有一个有用的功能，就是可以快速搜索数据以找到网站上的内容。Bookr 将实现图书搜索，允许用户通过部分书名找到特定图书。虽然我们还没有任何图书可搜索，但我们仍然可以实现一个显示用户搜索文本的页面。用户将搜索字符串作为\
  \ URL 参数的一部分输入。我们将在第6章“表单”中实现搜索和便于文本输入的表单。\n\n以下步骤将帮助你完成此活动：\n\n1. 创建搜索结果 HTML 模板。模板中应包含一个变量占位符，用于显示通过渲染上下文传入的搜索词。在\
  \ `<title>` 和 `<h1>` 标签中显示传入的变量。在正文中，使用 `<em>` 标签将搜索文本包裹起来，使其显示为斜体。\n2. 在 `views.py`\
  \ 中添加搜索视图函数。该视图应从 URL 参数（位于请求的 GET 属性中）读取搜索字符串，然后渲染你在上一步中创建的模板，并使用上下文字典传入要替换的搜索值。\n\
  3. 在 `urls.py` 中为新视图添加 URL 映射。URL 可以是类似 `/book-search` 的路径。\n\n完成此活动后，你应该能够通过 URL\
  \ 参数传入搜索值，并看到它渲染在结果页面上。看起来应该像这样：\n\n![](img/4840a43efd335abd10b93708225692d6_84_0.png)\n\
  \n图1.53 – 搜索 Django workshop\n\n你还应该能够传入特殊 HTML 字符，例如 `<` 和 `>`，以观察 Django 如何在模板中自动转义它们。\n\
  \n![](img/4840a43efd335abd10b93708225692d6_84_1.png)\n\n图1.54 – 注意 HTML 字符如何被转义，从而保护我们免受标签注入\n\
  \n**注意**\n\n此活动的解决方案可在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions\
  \ 找到。\n\n### 总结\n\n本章是对 Django 的快速介绍。你首先快速了解了 HTTP 协议以及 HTTP 请求和响应的结构。然后我们看到了 Django\
  \ 如何使用 MVT 范式，以及它如何解析 URL、生成 HTTP 请求并将其发送到返回 HTTP 响应的视图。我们构建了 Bookr 项目的脚手架，然后为其创建了\
  \ reviews 应用。接下来，我们构建了两个示例视图，以说明如何从请求中获取数据并在渲染模板时使用这些数据。你还通过实验了解了 Django 在渲染模板时如何对\
  \ HTML 输出进行转义。\n\n我们通过 PyCharm IDE 完成了所有这些操作，你学习了如何设置它以调试应用程序。调试器将帮助你找出程序无法按预期工作的原因。\n\
  \n在下一章中，你将开始学习 Django 的数据库集成及其模型系统，从而能够为应用程序存储和检索真实数据。\n"
- "## 模型与迁移\n\n在上一章中，我们简要介绍了 Django 及其在 Web 应用开发中的用途。然后，我们学习了**模型-视图-模板（MVT）**的概念。之后，我们创建了一个\
  \ Django 项目并启动了 Django 开发服务器。我们还简要讨论了 Django 的视图、URL 和模板。\n\n在本章中，你将了解数据库的概念、数据库的类型以及它们在构建\
  \ Web 应用中的重要性。你将首先使用名为 SQLite DB Browser 的开源数据库可视化工具创建一个数据库。然后，你将使用 SQL 命令执行一些基本的**创建、读取、更新和删除（CRUD）**数据库操作。接下来，你将学习\
  \ Django 的**对象关系映射（ORM）**，通过它，你的应用程序可以使用简单的 Python 代码与关系数据库交互并无缝协作，无需运行复杂的 SQL 查询。你将学习模型和迁移，它们是\
  \ Django ORM 的一部分，用于将数据库模式更改从应用程序传播到数据库，并执行数据库 CRUD 操作。在本章末尾，你将研究各种类型的数据库关系，并利用这些知识对相关记录执行查询。\n\
  \n本章将涵盖以下主题：\n\n- 理解并使用数据库\n- 使用 SQL 理解 CRUD 操作\n- 探索 Django ORM\n- 创建 Django 模型和迁移\n\
  - Django 的数据库 CRUD 操作\n- 批量创建和批量更新操作\n- 使用 Q 对象执行复杂查询\n- 活动 2.01 – 为项目管理应用程序创建模型\n\
  - 填充 Bookr 项目的数据库\n\n数据库是结构化数据的集合，有助于轻松管理信息。一个称为**数据库管理系统（DBMS）**的软件层用于存储、维护和对数据执行操作。数据库有两种类型：关系数据库和非关系数据库。在以下小节中，我们将简要了解关系数据库以及数据如何存储在这些数据库中。\n\
  \n### 关系数据库\n\n关系数据库或**结构化查询语言（SQL）**数据库以预定义的行和列结构存储数据，这种结构称为**表**。一个数据库可以由多个这样的表组成，这些表具有固定的属性、数据类型以及与其他表的关系。例如，正如我们在*图2.1*中所见，图书库存表具有固定的列结构，包含**图书编号**、**作者**、**书名**和**副本数量**，条目构成表中的行。还可能存在其他表，例如**学生信息**和**借阅记录**，它们可能与库存表相关。此外，每当有图书借给学生时，记录将根据多个表（例如**学生信息**表与**图书库存**表）之间的关系来存储。\n\
  \n这种预定义的规则结构定义了数据类型、表结构以及不同表之间的关系，就像数据库的脚手架或蓝图。这个蓝图统称为**数据库模式**。将其应用于数据库时，它会为数据库存储应用程序数据做好准备。为了管理和维护这些数据库，关系数据库有一种通用语言，称为\
  \ SQL。关系数据库的一些示例包括 SQLite、PostgreSQL、MySQL 和 OracleDB。\n\n### 非关系数据库\n\n非关系数据库或**不仅仅是\
  \ SQL（NoSQL）**数据库旨在存储非结构化数据。它们非常适合大量生成的数据，这些数据不遵循关系数据库那样的严格规则。非关系数据库的一些示例包括 Cassandra、MongoDB、CouchDB\
  \ 和 Redis。\n\n例如，假设你需要使用 Redis 在数据库中存储公司的股票价值。这里，公司名称将作为键存储，股票价值将作为值存储。在这种用例中使用键值型\
  \ NoSQL 数据库是合适的，因为它为唯一键存储所需的值，并且访问速度更快。\n\n就本书的范围而言，我们将只处理关系数据库，因为 Django 官方不支持非关系数据库。但是，如果你想探索，有许多分支项目（例如\
  \ **Django non-rel**）支持 NoSQL 数据库。\n\n在下一节中，你将了解使用 SQL 命令进行数据库 CRUD 操作。\n\n\n\n\n\
  ## 使用 SQL 进行数据库操作\n\nSQL 使用一组命令来执行各种数据库操作，例如创建条目、读取值、更新条目和删除条目。这些操作统称为 CRUD 操作。为了详细了解数据库操作，让我们先对\
  \ SQL 命令进行一些实践。大部分关系型数据库共享相似的 SQL 语法；然而，部分操作会有所不同。\n\n在本章范围内，我们将使用 SQLite 作为数据库。SQLite\
  \ 是一种轻量级关系型数据库，并且是 Python 标准库的一部分。这就是 Django 将 SQLite 作为其默认数据库配置的原因。不过，我们还将在 *第\
  \ 17 章，部署 Django 应用（第 1 部分 – 服务器设置）* 中学习更多关于如何进行配置更改以使用其他数据库的内容。本章可以从本书的 GitHub\
  \ 仓库下载，地址为：`https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter17`。\n\
  \n在下一节中，我们将学习数据库中数据类型的重要性。\n\n### 关系型数据库中的数据类型\n\n数据库为我们提供了一种限制可存储在给定列中的数据类型的方式。这些称为数据类型。以下是关系型数据库（如\
  \ SQLite3）的数据类型示例：\n\n- `INTEGER`：用于存储整数\n- `TEXT`：可存储文本\n- `REAL`：用于浮点值\n\n例如，你希望一本书的标题使用\
  \ TEXT 作为数据类型。因此，数据库将强制执行一条规则：除了文本数据之外，其他类型的数据都不能存储在该列中。同样，书的价格可以具有 REAL 数据类型，以此类推。\n\
  \n利用之前关于数据库学到的一些概念，在下一节中，我们将通过创建数据库和数据表来进行实践。\n\n### 练习 2.01 – 创建图书数据库\n\n在本练习中，你将为图书评论应用创建一个图书数据库。为了更好地可视化\
  \ SQLite 数据库中的数据，你将安装一个名为 DB Browser for SQLite 的开源工具。该工具有助于可视化数据并提供一个执行 SQL 命令的\
  \ shell。\n\n如果尚未安装，请访问 https://sqlitebrowser.org，并从下载部分根据你的操作系统安装该应用程序并启动它。DB Browser\
  \ 安装的详细说明可在前言中找到。要创建数据库，请按照以下步骤操作：\n\n> **注意**\n> 数据库操作也可以使用命令行 shell 执行。\n\n1.\
  \ 启动应用程序后，点击应用程序左上角的 **New Database** 创建新数据库。创建一个名为 `bookr` 的数据库，因为你正在开发图书评论应用：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_91_0.png)\n\n图 2.1 - 创建名为 `bookr` 的数据库\n\
  \n![](img/4840a43efd335abd10b93708225692d6_93_0.png)\n\n图 2.3：创建名为 publisher 和 author\
  \ 的 TEXT 字段\n\n这将在 `bookr` 数据库中创建一个名为 `book` 的数据表，其中包含 `title`、`publisher` 和 `author`\
  \ 字段。可以如下所示查看：\n\n![](img/4840a43efd335abd10b93708225692d6_93_1.png)\n\n图 2.4：具有\
  \ title、publisher 和 author 字段的数据库\n\n总的来说，在本节关于数据库的内容中，我们学习了为什么需要数据库以及它们如何存储数据，并简要介绍了两种最常见的数据库类型。此外，我们还使用名为\
  \ DB Browser 的开源工具创建了一个简单的数据库和表。在下一节中，我们将学习如何使用 SQL 对数据库执行 CRUD 操作。\n\n## 使用 SQL\
  \ 理解 CRUD 操作\n\n假设我们的图书评论应用的编辑或用户想要对图书库存进行一些修改，例如向数据库添加几本书、更新数据库中的条目等。SQL 提供了多种执行此类\
  \ CRUD 操作的方法。在深入 Django 模型和迁移的世界之前，让我们先探索这些基本的 SQL 操作。\n\n你将为以下 CRUD 操作运行一些 SQL\
  \ 命令。\n\n要运行它们，请按照以下步骤操作：\n\n1. 在 DB Browser 中导航到 **Execute SQL** 选项卡。你可以在 **SQL\
  \ 1** 窗口中输入或粘贴我们在以下各节中列出的 SQL 命令。你可以在执行之前花一些时间修改查询并理解它们。\n\n2. 准备好后，点击看起来像 **Play**\
  \ 按钮的图标或按 F5 键执行命令。结果将显示在 **SQL 1** 窗口下方的窗口中：\n\n![](img/4840a43efd335abd10b93708225692d6_94_0.png)\n\
  \n图 2.5：在 DB Browser 中执行 SQL 命令\n\n现在我们将尝试一些 SQL 创建操作来在数据库中创建几条记录。\n\n### SQL 创建操作\n\
  \nSQL 中的创建操作使用 `insert` 命令执行，正如名称所示，它允许我们向数据库插入数据。让我们回到图书示例。由于我们已经创建了数据库和 book 表，现在可以通过执行以下命令在数据库中创建或插入条目：\n\
  \n```sql\ninsert into book values ('The Sparrow Warrior', 'Super Hero Publications',\
  \ 'Patric Javagal');\n```\n\n这会将命令中定义的值插入到 book 表中。这里，`The Sparrow Warrior` 是标题，`Super\
  \ Hero Publications` 是出版商，`Patric Javagal` 是作者。请注意，插入的顺序与我们创建表的方式相对应；即值分别插入到代表 title、publisher\
  \ 和 author 的列中。同样，让我们再执行两次插入以填充 book 表：\n\n```sql\ninsert into book values ('Ninja\
  \ Warrior', 'East Hill Publications', 'Edward Smith');\ninsert into book values\
  \ ('The European History', 'Northside Publications', 'Eric Robbins');\n```\n\n到目前为止执行的三次插入将在\
  \ book 表中插入三行。但我们如何验证呢？我们如何知道我们插入的那三条条目是否已正确输入到数据库中？让我们在下一节学习如何做到这一点。\n\n### SQL\
  \ 读取操作\n\n我们可以使用 `select` SQL 操作从数据库读取。例如，以下 SQL `select` 命令检索在 book 表中创建的选定条目：\n\
  \n```sql\nselect title, publisher, author from book;\n```\n\n你应该会看到以下输出：\n\n|  \
  \ | title | publisher | author |\n|---|---|---|---|\n| 1 | The Sparrow Warrior |\
  \ Super Hero Publications | Patric Javagal |\n| 2 | Ninja Warrior | East Hill Publications\
  \ | Edward Smith |\n| 3 | The European History | Northside Publications | Eric Robbins\
  \ |\n\n图 2.6：使用 select 命令后的输出\n\n这里，`select` 是从数据库读取的命令，title、publisher 和 author\
  \ 字段是我们打算从 book 表中选择的列。由于这些是数据库中所有的列，`select` 语句返回了数据库中存在的所有值。`select` 语句也称为 SQL\
  \ 查询。获取数据库中所有字段的另一种方法是使用 `*` 通配符代替显式指定所有列名：\n\n```sql\nselect * from book;\n```\n\
  \n这将返回与前一图所示相同的输出。现在，假设我们想要获取标题为 `The Sparrow Warrior` 的书的作者姓名；此时，`select` 查询如下：\n\
  \n```sql\nselect author from book where title=\"The Sparrow Warrior\";\n```\n\n\
  在这里，我们添加了一个特殊的 SQL 关键字 `where`，以便 `select` 查询仅返回匹配条件的条目。查询的结果，当然是 `Patric Javagal`。现在，如果我们想更改这本书的出版商名称怎么办？\n\
  \n### SQL 更新操作\n\n在 SQL 中，更新数据库中记录的方式是使用 `update` 命令：\n\n```sql\nupdate book set\
  \ publisher = 'Northside Publications' where title='The Sparrow Warrior';\n```\n\
  \n这里，如果 title 的值为 `The Sparrow Warrior`，我们将 publisher 值设置为 `Northside Publications`。然后我们可以运行在\
  \ SQL *读取操作* 部分运行的 `select` 查询，以查看运行更新命令后更新后的表是什么样子的：\n\n|   | title | publisher\
  \ | author |\n|---|---|---|---|\n| 1 | The Sparrow Warrior | Northside Publications\
  \ | Patric Javagal |\n| 2 | Ninja Warrior | East Hill Publications | Edward Smith\
  \ |\n| 3 | The European History | Northside Publications | Eric Robbins |\n\n图 2.7：更新\
  \ The Sparrow Warrior 的出版商值\n\n接下来，如果我们想删除刚刚更新的记录怎么办？我们将在下一节看到这一点。\n\n\n\n\n\n#\
  \ SQL 删除操作\n\n下面是一个使用 `delete` 命令从数据库中删除记录的示例：\n\n```sql\ndelete from book where\
  \ title='The Sparrow Warrior';\n```\n\n`delete` 是 SQL 中用于删除操作的关键字。在这里，只有当标题为 The\
  \ Sparrow Warrior 时，才会执行此操作。删除操作后，book 表将如下所示：\n\n|   | title | publisher | author\
  \ |\n|---|---|---|---|\n| 1 | Ninja Warrior | East Hill Publications | Edward Smith\
  \ |\n| 2 | The European History | Northside Publications | Eric Robbins |\n\n![](img/4840a43efd335abd10b93708225692d6_97_0.png)\n\
  \n这些是 SQL 的基本操作。我们不会进一步深入所有 SQL 命令和语法，但欢迎你探索更多关于使用 SQL 进行数据库基础操作的内容。\n\n> **注意**\n\
  > \n> 如需进一步阅读，你可以先探索使用 `join` 语句的某些高级 SQL `select` 操作，它们用于跨多个表查询数据。有关 SQL 的详细课程，你可以参考\
  \ *The SQL Workshop* (`https://www.packtpub.com/product/the-sql-workshop/9781838642358`)。\n\
  \n在本节中，我们学习了如何通过使用 SQL 对数据库执行 CRUD 操作来与数据库交互。在下一节中，我们将学习 Django 的 ORM，即一个抽象层，如何与数据库交互。\n\
  \n## 探索 Django ORM\n\nWeb 应用程序不断与数据库交互，其中一种方式是使用 SQL。如果你决定不使用 Django 等 Web 框架而仅使用\
  \ Python 编写 Web 应用程序，可以使用 `psycopg2` 等 Python 库（用于 PostgreSQL）直接使用 SQL 命令与数据库交互。但是在开发具有多个表和字段的\
  \ Web 应用程序时，SQL 命令很容易变得过于复杂，从而难以维护。因此，像 Django 这样流行的 Web 框架提供了一层抽象，使我们能够轻松地处理数据库。Django\
  \ 中帮助我们实现这一点的部分称为 ORM。\n\nDjango ORM 将面向对象的 Python 代码转换为实际的数据库结构，例如具有数据类型定义的数据库表，并通过简单的\
  \ Python 代码实现所有数据库操作。\n\n因此，在执行数据库操作时，我们不必处理 SQL 命令。这有助于更快地进行应用程序开发并便于维护应用程序源代码。\n\
  \nDjango 支持 SQLite、PostgreSQL、Oracle Database 和 MySQL 等关系数据库。Django 的数据库抽象层确保相同的\
  \ Python/Django 源代码可以在这些关系数据库中的任何一个中使用，只需对项目设置进行很少的修改即可。由于 SQLite 是 Python 库的一部分，并且\
  \ Django 默认配置为 SQLite，因此在本章的范围内，我们在学习 Django 模型和迁移时将使用 SQLite。接下来，我们将了解如何使用 Django\
  \ 进行数据库配置。\n\n## 数据库配置和创建 Django 应用程序\n\n正如我们在 *Chapter 1, An Introduction to Django*\
  \ 中已经看到的，当我们创建一个 Django 项目并运行 Django 服务器时，默认的数据库配置是 SQLite3。数据库配置位于项目目录中，`settings.py`\
  \ 文件内。\n\n> **注意**\n> \n> 请确保查看 bookr 应用的 `settings.py` 文件。通读整个文件一次将有助于你理解后续的概念。你可以在此处找到该文件：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/blob/main/Chapter02/final/bookr/bookr/settings.py。\n\
  \n因此，对于我们的示例项目，数据库配置将位于以下位置：`bookr/settings.py`。当创建 Django 项目时，此文件中存在的默认数据库配置如下所示：\n\
  \n```\nDATABASES = {\n    'default': {\n        'ENGINE': 'django.db.backends.sqlite3',\n\
  \        'NAME': BASE_DIR / 'db.sqlite3',\n    }\n}\n```\n\n`DATABASES` 变量被分配一个包含项目数据库详细信息的字典。在字典内部，有一个以\
  \ default 为键的嵌套字典。它保存了 Django 项目默认数据库的配置。我们使用以 `default` 为键的嵌套字典的原因是 Django 项目可能与多个数据库交互，而默认数据库是在未明确指定时\
  \ Django 用于所有操作的数据库。`ENGINE` 键表示使用哪个数据库引擎；在本例中为 `sqlite3`。\n\nNAME 键定义数据库的名称，可以是任意值。但对于\
  \ SQLite3，由于数据库以文件形式创建，NAME 可以具有文件需要创建的目录的完整路径。db 文件的完整路径是通过将 BASE_DIR 中之前定义的路径与\
  \ db.sqlite3 拼接（或连接）来处理的。请注意，BASE_DIR 是 settings.py 文件中已定义的项目目录。\n\n如果你使用其他数据库，如\
  \ PostgreSQL、MySQL 等，则必须在前述数据库设置中进行更改，如下所示：\n\n```\nDATABASES = {\n    'default':\
  \ {\n        'ENGINE': 'django.db.backends.postgresql',\n        'NAME': 'bookr',\n\
  \        'USER': <username>,\n        'PASSWORD': <password>,\n        'HOST': <host-IP-address>,\n\
  \        'PORT': '5432',}}\n```\n\n这里，ENGINE 已更改为使用 PostgreSQL。需要为 HOST 和 PORT 分别提供服务器的主机\
  \ IP 地址和端口号。如名称所示，USER 是数据库用户名，PASSWORD 是数据库密码。除了配置更改外，我们还必须安装数据库驱动程序或绑定以及数据库主机和凭据。这将在后面的章节中详细介绍，但现在由于我们使用的是\
  \ SQLite3，默认配置已足够。请注意，前面的代码只是示例，展示了使用 PostgreSQL 等不同数据库时需要进行的更改，但由于我们使用的是 SQLite，我们将使用已存在的数据库配置，无需对数据库设置进行任何修改。接下来，我们将简要介绍\
  \ Django 应用以及 Django 中存在的一些默认应用。\n\n## Django 应用\n\nDjango 项目可以有多个应用，它们通常作为独立实体存在。因此，每当需要时，一个应用也可以插入到不同的\
  \ Django 项目中。例如，如果我们开发一个电子商务 Web 应用程序，该 Web 应用程序可以有多个应用，例如用于客户支持的聊天机器人或用于在用户从应用程序购买商品时接受付款的支付网关。如果需要，这些应用也可以插入到或在不同的项目中重用。\n\
  \nDjango 默认启用了以下应用。以下是一个项目 settings.py 文件的片段：\n\n```\nINSTALLED_APPS = [\n    'django.contrib.admin',\n\
  \    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n\
  \    'django.contrib.messages',\n    'django.contrib.staticfiles',\n]\n```\n\n这些是用于管理站点、身份验证、内容类型、会话、消息以及用于收集和管理静态文件的一个应用程序的一组已安装或默认应用。在接下来的章节中，我们将深入研究这一点。对于本章的范围而言，我们将在下一节中了解为什么这些已安装应用需要\
  \ Django 迁移。\n\n## Django 迁移\n\n正如我们之前所学，Django 的 ORM 有助于简化数据库操作。操作的一个主要部分是将 Python\
  \ 代码转换为数据库结构，例如具有指定数据类型的数据库字段和表。换句话说，将 Python 代码转换为数据库结构的过程称为 **migration**。例如，而不是通过运行\
  \ SQL 命令创建数据库表，你会在 Python 中为它们编写模型；这将在即将到来的 *Creating models and migrations* 部分中学习。这些模型将具有\
  \ **fields**，它们构成了数据库表的蓝图。字段反过来将具有不同的字段类型，为我们提供有关存储在其中的数据类型的信息（回想一下我们在 Exercise\
  \ 2.01 – 创建书籍数据库的第 4 步中如何将字段的数据类型指定为 TEXT）。\n\n由于我们已经设置了 Django 项目，让我们执行第一次迁移。虽然我们尚未向项目添加任何代码，但我们可以迁移\
  \ INSTALLED_APPS 中列出的应用程序。这是因为 Django 的已安装应用需要在数据库中存储相关数据以供其操作，而迁移将创建所需的数据库表来在数据库中存储数据。应在此终端或\
  \ shell 中输入以下命令来执行此操作：\n\n```\npython manage.py migrate\n```\n\n> **注意**\n> 对于 macOS，你可以使用\
  \ python3 代替前述命令中的 python。\n\n这里，manage.py 是一个在项目创建时自动创建的脚本。它用于执行管理或管理任务。通过执行此命令，我们创建了已安装应用所需的所有数据库结构。\n\
  \n由于我们使用 DB Browser for SQLite 来浏览数据库，让我们查看执行 migrate 命令后所做的更改的数据库。\n\n\n\n\n\n\
  数据库文件将在项目目录下以 `db.sqlite3` 的名称创建。按照以下步骤验证迁移是否成功以及数据库表是否已创建：\n\n1. 打开 DB Browser，点击\
  \ **Open Database**，导航直到找到 `db.sqlite3` 文件并打开它。你应该会看到由 Django 迁移创建的一组新表。在 DB Browser\
  \ 中看起来如下：\n\n![](img/4840a43efd335abd10b93708225692d6_101_0.png)\n\nFigure 2.9:\
  \ Contents of the db.sqlite3 file\n\n2. 现在，通过点击数据库表浏览新创建的数据库结构，我们应该会看到以下内容：\n\n\
  ![](img/4840a43efd335abd10b93708225692d6_101_1.png)\n\nFigure 2.10: Browsing through\
  \ the newly created database structure\n\n3. 注意到创建的数据库表具有不同的字段，每个字段都有各自的数据类型。在 DB\
  \ Browser 中点击 Browse data 选项卡并从下拉菜单中选择一个表。例如，点击 auth_group_permissions 表后，你应该会看到类似如下的内容：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_102_0.png)\n\nFigure 2.11: Viewing the\
  \ auth_group_permissions table\n\n你会看到这些表目前还没有可用数据，因为 Django 迁移只创建数据库结构或蓝图，而实际数据在应用程序运行期间存储。现在我们已经迁移了内置或默认的\
  \ Django 应用，让我们尝试创建一个应用并执行 Django 迁移。\n\n在本节中，我们学习了 Django 的 ORM 以及它如何简化 Web 应用程序的数据库操作。之后，我们学习了\
  \ Django 数据库配置设置。我们还简要介绍了 Django 迁移，我们将在下一节中通过为我们的 Bookr 应用程序创建模型和迁移来更深入地学习。\n\n\
  ## Creating Django models and migrations\n\nDjango 模型本质上是一个 Python 类，它保存了在数据库中创建表的蓝图。models.py\
  \ 文件可以包含许多这样的模型，每个模型都会被转换为一个数据库表。类的属性根据模型定义形成数据库表字段和关系。\n\n对于我们的 reviews 应用程序，我们需要依次创建以下模型及其数据库表：\n\
  \n- Book: 这应该存储有关书籍的信息\n- Contributor: 这应该存储有关为书籍撰写做出贡献的人的信息，例如作者、合著者或编辑\n- Publisher:\
  \ 顾名思义，这是指图书出版商\n- Review: 这应该存储应用程序用户撰写的全部图书评论\n\n我们应用程序中的每本书都需要有一个出版商，所以让我们将 Publisher\
  \ 作为第一个模型创建。在 reviews/models.py 中输入以下代码：\n\n```\nfrom django.db import models\n\n\
  class Publisher(models.Model):\n    \"\"\"A company that publishes books.\"\"\"\n\
  \    name = models.CharField(\n        max_length=50,\n        help_text=\"The name\
  \ of the Publisher.\")\n    website = models.URLField(\n        help_text=\"The\
  \ Publisher's website.\")\n    email = models.EmailField(\n        help_text=\"\
  The Publisher's email address.\")\n```\n\n**Note**\n\n你可以通过点击以下链接查看 bookr 应用的完整\
  \ models.py 文件：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/blob/main/Chapter02/final/bookr/reviews/models.py。\n\
  \n第一行代码导入了 Django models 模块。虽然在创建 Django 应用时这一行会自动生成，但请确保如果不存在则添加它。导入之后，其余代码定义了一个名为\
  \ Publisher 的类，它是 Django 的 models.Model 的子类。此外，该类将具有 name、website 和 email 等属性或字段。以下是创建此模型时使用的字段类型。\n\
  \n正如我们所见，每个字段都被定义为以下类型：\n\n- CharField: 此字段类型存储较短的字符串字段，例如 Packt Publishing。对于非常长的字符串，我们使用\
  \ TextField。\n- EmailField: 这与 CharField 类似，但会验证字符串是否代表有效的电子邮件地址，例如 customersupport@packtpub.com。\n\
  - URLField: 同样，这与 CharField 类似，但会验证字符串是否代表有效的 URL，例如 https://www.packtpub.com。\n\
  \n接下来，我们将查看在创建每个字段时使用的字段选项。\n\n## Field options\n\nDjango 提供了一种为模型字段定义字段选项的方法。这些字段选项用于设置值或约束等。例如，我们可以使用\
  \ `default=<value>` 为字段设置默认值，以确保每次在数据库中为该字段创建记录时，它都会设置为我们指定的默认值。以下是在定义 Publisher\
  \ 模型时我们使用的两个字段选项：\n\n- `help_text`: 此字段选项帮助我们为字段添加描述性文本，该文本会自动包含在 Django 表单中\n-\
  \ `max_length`: 此选项提供给 `CharField`，其中定义了字段的最大长度，以字符数为单位\n\nDjango 还有许多其他字段类型和字段选项，可以从详尽的官方\
  \ Django 文档中探索。随着我们开发示例图书评论应用程序，我们将学习项目中使用的类型和字段。现在，让我们通过以下步骤将 Django 模型迁移到数据库中：\n\
  \n1. 在 shell 或终端中执行以下命令来执行此操作（从存储 `manage.py` 文件的文件夹运行）：\n\n```\npython manage.py\
  \ makemigrations reviews\n```\n\n命令的输出如下所示：\n\n```\nMigrations for 'reviews':\n\
  \    reviews/migrations/0001_initial.py\n        - Create model Publisher\n```\n\
  \n`makemigrations <appname>` 命令为给定应用创建迁移脚本，在本例中为 reviews 应用。注意，在运行 makemigrations\
  \ 后，migrations 文件夹下会创建一个新文件：\n\n![](img/4840a43efd335abd10b93708225692d6_104_0.png)\n\
  \nFigure 2.12: New file under the migrations folder\n\n这是 Django 创建的迁移脚本。当我们不带应用名称运行\
  \ `makemigrations` 时，将为项目中的所有应用创建迁移脚本。\n\n2. 接下来，让我们列出项目迁移状态。记住，之前我们已经将迁移应用到 Django\
  \ 的已安装应用，现在我们创建了一个新的应用 reviews。在 shell 或终端中运行以下命令，它将显示整个项目的模型迁移状态（从存储 manage.py\
  \ 文件的文件夹运行）：\n\n```\npython manage.py showmigrations\n```\n\n前述命令的输出如下：\n\n```\n\
  admin\n  [X] 0001_initial\n  [X] 0002_logentry_remove_auto_add\n  [X] 0003_logentry_add_action_flag_choices\n\
  auth\n  [X] 0001_initial\n  [X] 0002_alter_permission_name_max_length\n  [X] 0003_alter_user_email_max_length\n\
  \  [X] 0004_alter_user_username_opts\n  [X] 0005_alter_user_last_login_null\n  [X]\
  \ 0006_require_contenttypes_0002\n  [X] 0007_alter_validators_add_error_messages\n\
  \  [X] 0008_alter_user_username_max_length\n  [X] 0009_alter_user_last_name_max_length\n\
  \  [X] 0010_alter_group_name_max_length\n  [X] 0011_update_proxy_permissions\ncontenttypes\n\
  \  [X] 0001_initial\n  [X] 0002_remove_content_type_name\nreviews\n  [ ] 0001_initial\n\
  sessions\n  [X] 0001_initial\n```\n\n这里，[X] 标记表示迁移已应用。注意区别，所有其他应用的迁移都已应用，除了 reviews。showmigrations\
  \ 命令可以执行以了解迁移状态，但在执行模型迁移时这不是强制步骤。\n\n3. 接下来，让我们了解 Django 如何将模型转换为实际的数据库表。为此，按如下方式运行\
  \ `sqlmigrate` 命令：\n\n```\npython manage.py sqlmigrate reviews 0001_initial\n```\n\
  \n我们应该看到以下输出：\n\n```\nBEGIN;\n--\n-- Create model Publisher\n--\nCREATE TABLE \"\
  reviews_publisher\" (\"id\" integer\n    NOT NULL PRIMARY KEY AUTOINCREMENT, \"\
  name\"\n    varchar(50) NOT NULL, \"website\" varchar(200)\n    NOT NULL, \"email\"\
  \ varchar(254) NOT NULL);\nCOMMIT;\n```\n\n前面的片段显示了 Django 迁移数据库时使用的 SQL 命令等价物。在本例中，我们创建\
  \ `reviews_publisher` 表，其中包含 name、website 和 email 字段，并具有定义的字段类型。此外，所有这些字段都被定义为 NOT\
  \ NULL，意味着这些字段的条目不能为空并且必须具有值。`sqlmigrate` 命令在执行模型迁移时不是强制步骤。\n\n在下一节中，我们将学习主键及其在存储数据库数据时的重要性。\n\
  \n## Primary keys\n\n假设一个名为 `users` 的数据库表，如其名称所示，存储有关用户的信息。假设它有超过 1,000 条记录，并且至少有\
  \ 3 个用户同名 Joe Burns。我们如何从应用程序中唯一识别这些用户？解决方案是拥有一种唯一识别数据库中每条记录的方法。这是通过 **primary keys**\
  \ 实现的。主键对于数据库表是唯一的，并且根据规则，表不能有两行具有相同的主键。在 Django 中，当数据库模型中未明确提及主键时，Django 会自动创建\
  \ `id` 作为主键（整数类型），并且随着新记录的创建而自动递增。\n\n在上一节中，注意 `python manage.py sqlmigrate` 命令的输出。在创建\
  \ Publisher 表时，SQL CREATE TABLE 命令向表中添加了一个名为 `id` 的字段。`id` 值被定义为 PRIMARY KEY AUTOINCREMENT。在关系数据库中，主键用于唯一标识数据库中的条目。例如，book\
  \ 表具有 `id` 作为主键，其数字从 1 开始。随着新记录的创建，该值每次递增一个。`id` 的整数值在 book 表中始终是唯一的。由于迁移脚本已通过执行\
  \ `makemigrations` 创建，让我们现在通过执行以下命令迁移 reviews 应用中新建的模型：\n\n```\npython manage.py\
  \ migrate reviews\n```\n\n\n你应该得到以下输出：\n\n```\nOperations to perform:\n  Apply all\
  \ migrations: reviews\nRunning migrations:\n  Applying reviews.0001_initial... OK\n\
  ```\n\n此操作为 reviews 应用创建数据库表。以下是从 DB Browser 中截取的片段，显示在执行迁移后数据库中已创建新的 reviews_publisher\
  \ 表：\n\n|  | 名称 | 类型 | 数据库定义 |\n|---|---|---|---|\n|  | reviews_publisher |  | CREATE\
  \ TABLE \"reviews_publisher\" (\"id\" integer NOT NULL ... |\n|  | id | integer\
  \ | \"id\" integer NOT NULL PRIMARY KEY AUTOINCREMENT |\n|  | name | varchar(50)\
  \ | \"name\" varchar(50) NOT NULL |\n|  | website | varchar(200) | \"website\" varchar(200)\
  \ NOT NULL |\n|  | email | varchar(254) | \"email\" varchar(254) NOT NULL |\n\n\
  图 2.13：在执行迁移命令后创建的 reviews_publisher 表\n\n到目前为止，我们已经探讨了如何创建模型并将其迁移到数据库。现在让我们着手为我们的图书评论应用创建剩余的模型。正如我们已经看到的，该应用将具有以下数据库表：\n\
  \n- **Book:** 这是保存图书本身信息的数据库表。我们已经创建了 Book 模型并已将其迁移到数据库。\n- **Publisher:** 此表保存有关图书出版商的信息。\n\
  - **Contributor:** 此表保存有关贡献者的信息，即作者、合著者或编辑。\n- **Review:** 此表保存评论者发布的评论信息。\n\n让我们按照以下代码片段所示，将\
  \ Book 和 Contributor 模型添加到 reviews/models.py 中：\n\n```\nclass Book(models.Model):\n\
  \    \"\"\"A published book.\"\"\"\n    title = models.CharField(\n        max_length=70,\
  \ help_text=\"The title of the book.\")\n    publication_date = models.DateField(\n\
  \        verbose_name=\"Date the book was published.\")\n    isbn = models.CharField(\n\
  \        max_length=20, verbose_name=\"ISBN number of the book.\")\nclass Contributor(models.Model):\n\
  \    \"\"\"A contributor to a Book, e.g. author, editor,\n       co-author.\"\"\"\
  \n    first_names = models.CharField(\n        max_length=50, help_text=\"The contributor's\
  \ first name or names.\")\n    last_names = models.CharField(\n        max_length=50,\
  \ help_text=\"The contributor's last name or names.\")\n    email = models.EmailField(\n\
  \        help_text=\"The contact email for the contributor.\")\n```\n\n代码不言自明。Book\
  \ 模型具有 title、publication_date 和 isbn 字段。Contributor 模型具有 first_names 和 last_names\
  \ 字段以及贡献者的电子邮件 ID。除了我们在 Publisher 模型中看到的模型之外，还有一些新添加的模型。它们具有 DateField 作为新的字段类型，其名称所暗示的那样，用于存储日期。还使用了名为\
  \ verbose_name 的新字段选项。它为字段提供描述性名称。接下来，我们将了解关系型数据库中关系的工作方式。\n\n## Relationships\n\
  \n关系型数据库的强大之处之一是能够在跨数据库表的存储数据之间建立关系。关系通过在表之间建立正确的引用来维护数据完整性，这反过来有助于维护数据库。另一方面，关系规则确保数据一致性并防止重复。\n\
  \n在关系型数据库中，可以存在以下类型的关系：\n\n- Many-to-one\n- Many-to-many\n- One-to-one\n\n让我们在以下各节中详细探讨每种关系。\n\
  \n### Many-to-one\n\n在此关系中，一个表中的许多记录（行/条目）可以引用另一个表中的一条记录（行/条目）。例如，可以由一个出版商出版许多本书。这是一个多对一关系的示例。要建立这种关系，我们需要使用数据库的外键。关系型数据库中的外键在来自一个表的字段与来自不同表的主键之间建立关系。\n\
  \n例如，假设你有一个名为 employee_info 的表，其中存储了属于不同部门的员工数据，其员工 ID 作为主键，同时还有一列存储其部门名称；该表还包含一列存储该部门的部门\
  \ ID。现在，还有另一个名为 departments_info 的表，其中部门 ID 作为主键。在这种情况下，部门 ID 就是 employee_info 表中的外键。\n\
  \n在我们的 bookr 应用中，Book 模型可以有一个外键引用 Publisher 表的主键。由于我们已经创建了 Book、Contributor 和 Publisher\
  \ 的模型，现在让我们在 Book 和 Publisher 模型之间建立多对一关系。对于 Book 模型，添加最后一行：\n\n```\nclass Book(models.Model):\n\
  \    \"\"\"A published book.\"\"\"\n    title = models.CharField(\n        max_length=70,\
  \ help_text=\"The title of the book.\")\n    publication_date = models.DateField(\n\
  \        verbose_name=\"Date the book was published.\")\n    isbn = models.CharField(\n\
  \        max_length=20, verbose_name=\"ISBN number of the book.\")\n    publisher\
  \ = models.ForeignKey(\n        Publisher, on_delete=models.CASCADE)\n```\n\n现在新添加的\
  \ publisher 字段使用外键在 Book 和 Publisher 之间建立多对一关系。这种关系确保了多对一关系的性质，即许多本书可以有一个出版商：\n\n\
  - models.ForeignKey：这是建立多对一关系的字段选项。\n- Publisher：当我们在 Django 中与不同表建立关系时，我们引用创建该表的模型；在这种情况下，Publisher\
  \ 表由 Publisher 模型（或 Publisher Python 类）创建。\n- on_delete：这是一个字段选项，用于确定在引用对象被删除时应采取的操作。在这种情况下，on_delete\
  \ 选项设置为 CASCADE（models.CASCADE），这会删除被引用的对象。\n\n例如，假设一个出版商出版了一组书籍。出于某种原因，如果出版商必须从应用中删除，下一个操作是\
  \ CASCADE，这意味着从应用中删除所有被引用的书籍。还有许多其他 on_delete 操作，例如以下：\n\n- PROTECT：这会防止记录删除，除非所有被引用的对象都被删除\n\
  - SET_NULL：如果数据库字段已配置为存储空值，则将其设置为 null 值\n- SET_DEFAULT：在引用对象被删除时设置为默认值\n\n我们将仅对我们的图书评论应用使用\
  \ CASCADE 选项。\n\n### Many-to-many\n\n在此关系中，一个表中的多个记录可以与另一个表中的多个记录相关。例如，一本书可以有多个合著者，而每位作者（贡献者）可能写过多本书。因此，这在\
  \ Book 和 Contributor 表之间形成多对多关系：\n\n![](img/4840a43efd335abd10b93708225692d6_110_0.png)\n\
  \n图 2.14：书籍与合著者之间的多对多关系\n\n在 models.py 中，对于 Book 模型，添加最后一行，如下所示：\n\n```\nclass Book(models.Model):\n\
  \    \"\"\"A published book.\"\"\"\n    title = models.CharField(\n        max_length=70,\
  \ help_text=\"The title of the book.\")\n    publication_date = models.DateField(\n\
  \        verbose_name=\"Date the book was published.\")\n    isbn = models.CharField(\n\
  \        max_length=20, verbose_name=\"ISBN number of the book.\")\n    publisher\
  \ = models.ForeignKey(\n        Publisher, on_delete=models.CASCADE)\n    contributors\
  \ = models.ManyToManyField(\n        'Contributor', through=\"BookContributor\"\
  )\n```\n\n新添加的 contributors 字段使用 ManyToManyField 字段类型在 Book 和 Contributor 之间建立多对多关系：\n\
  \n- models.ManyToManyField：这是建立多对多关系的字段类型。\n\n- through：这是多对多关系的特殊字段选项。当我们在两个表之间有多对多关系时，如果我们想存储有关该关系的额外信息，则可以使用它通过中间表建立关系。\n\
  \n\n\n\n\n例如，我们有两个表，即 Book 和 Contributor，我们需要在其中存储书籍的贡献者类型信息，例如 Author、Co-Author\
  \ 或 Editor。然后贡献者类型存储在名为 BookContributor 的中间表中。以下是 BookContributor 表/模型的示例。请确保将此模型包含在\
  \ reviews/models.py 中：\n\n```python\nclass BookContributor(models.Model):\n    class\
  \ ContributionRole(models.TextChoices):\n        AUTHOR = \"AUTHOR\", \"Author\"\
  \n        CO_AUTHOR = \"CO_AUTHOR\", \"Co-Author\"\n        EDITOR = \"EDITOR\"\
  , \"Editor\"\n\n    book = models.ForeignKey(\n        Book, on_delete=models.CASCADE)\n\
  \    contributor = models.ForeignKey(\n        Contributor, on_delete=models.CASCADE)\n\
  \    role = models.CharField(\n        verbose_name=\"The role this contributor\
  \ had in the book.\",\n        choices=ContributionRole.choices,\n        max_length=20)\n\
  ```\n\n> **注意**\n> 完整的 models.py 文件可以在此处查看：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/blob/main/Chapter02/final/bookr/reviews/models.py。\n\
  \n像 BookContributor 这样的中间表通过使用外键同时指向 Book 和 Contributor 表来建立关系。它还可以具有额外的字段，可以存储有关\
  \ BookContributor 模型与以下字段的关系的信息：\n\n- **book**：这是对 Book 模型的外键。如前所述，`on_delete=models.CASCADE`\
  \ 会在相关书籍从应用程序中删除时删除关系表中的条目。\n- **Contributor**：同样，这是对 Contributor 模型/表的外键。这在删除时也定义为\
  \ CASCADE。\n- **role**：这是中间模型的字段，用于存储有关 Book 和 Contributor 之间关系的额外信息。\n- **class\
  \ ContributionRole(models.TextChoices)**：这可以通过创建 `models.TextChoices` 的子类来定义一组选择。例如，ContributionRole\
  \ 是从 TextChoices 创建的子类，由 roles 字段使用以将 Author、Co-Author 和 Editor 定义为一组选择。\n- **`choices`**：这是指在模型中定义的一组选择，在使用模型创建\
  \ Django 表单时很有用。\n\n> **注意**\n> 当在建立多对多关系时未提供 `through` 字段选项时，Django 会自动创建一个中间表来管理该关系。\n\
  \n## 一对一关系\n\n在此关系中，表中的一条记录将仅引用不同表中的一条记录。例如，一个人只能有一个驾驶执照，因此拥有驾驶执照的人可以形成一对一的关系：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_112_0.png)\n\n图 2.15：一对一关系的示例\n\nOneToOneField\
  \ 可用于建立一对一关系，如下所示：\n\n```python\nclass DriverLicence(models.Model):\n    person\
  \ = models.OneToOneField(\n        Person, on_delete=models.CASCADE)\n    licence_number\
  \ = models.CharField(max_length=50)\n```\n\n现在我们已经探索了数据库关系，让我们回到我们的 bookr 应用程序并在其中添加一个模型。\n\
  \n## 添加 Review 模型\n\n我们已经将 Book 和 Publisher 模型添加到 reviews/models.py 文件中。我们将要添加的最后一个模型是\
  \ Review 模型。以下代码片段可以帮助我们完成此操作：\n\n```python\nfrom django.contrib import auth\n\n\
  class Review(models.Model):\n    content = models.TextField(\n        help_text=\"\
  The Review text.\")\n    rating = models.IntegerField(\n        help_text=\"The\
  \ rating the reviewer has given.\")\n    date_created = models.DateTimeField(\n\
  \        auto_now_add=True,\n        help_text=\"The date and time the review was\
  \ created.\")\n    date_edited = models.DateTimeField(\n        null=True,\n   \
  \     help_text=\"The date and time the review was last edited.\"\n    )\n    creator\
  \ = models.ForeignKey(\n        auth.get_user_model(), on_delete=models.CASCADE)\n\
  \    book = models.ForeignKey(\n        Book, on_delete=models.CASCADE,\n      \
  \  help_text=\"The Book that this review is for.\"\n    )\n```\n\n> **注意**\n> \n\
  > 完整的 `models.py` 文件可以在此处查看：https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/blob/main/Chapter02/final/bookr/reviews/models.py。\n\
  \nreview 模型/表将用于存储用户提供的书籍评论和评分。它具有以下字段：\n\n- **content**：此字段存储书籍评论的文本；因此使用的字段类型为\
  \ `TextField`，因为它可以存储大量文本。\n- **rating**：此字段存储书籍的评论评分。由于评分将为整数，因此使用的字段类型为 `IntegerField`。\n\
  - **date_created**：此字段存储评论撰写的时间和日期；因此字段类型为 `DateTimeField`。\n- **date_edited**：此字段存储每次编辑评论时的日期和时间。同样，字段类型为\
  \ `DateTimeField`。\n- **Creator**：此字段指定评论创建者或撰写书籍评论的人。请注意，这是一个指向 `auth.get_user_model()`\
  \ 的外键，它指的是 Django 内置身份验证模块中的 User 模型。它具有 `on_delete=models.CASCADE` 字段选项。这说明当用户从数据库中删除时，该用户撰写的所有评论都将被删除。\n\
  - **Book**：Reviews 具有一个名为 book 的字段，是对 Book 模型的外键。这是因为评论必须为书籍评论应用程序撰写，并且一本书可以有许多评论，所以这是一对多的关系。这也使用\
  \ `on_delete=models.CASCADE` 字段选项定义，因为一旦书籍被删除，就没有保留评论的意义了。因此，当一本书被删除时，所有引用该书的评论也将被删除。\n\
  \n在下一节中，我们将学习并实现模型方法。\n\n## 模型方法\n\n在 Django 中，我们可以在模型类中编写方法。这些被称为 **模型方法**，它们可以是自定义方法或覆盖\
  \ Django 模型默认方法的特殊方法。其中一种方法就是 `__str__()`。此方法返回模型实例的字符串表示形式，在使用 Django shell 时尤其有用。在以下示例中，`__str__()`\
  \ 方法被添加到 Publisher 模型中，Publisher 对象的字符串表示形式将为出版商的名称；因此返回 `self.name`，其中 `self` 指的是\
  \ Publisher 对象：\n\n```python\nclass Publisher(models.Model):\n    \"\"\"A company\
  \ that publishes books.\"\"\"\n    name = models.CharField(\n        max_length=50,\n\
  \        help_text=\"The name of the Publisher.\")\n    website = models.URLField(\n\
  \        help_text=\"The Publisher's website.\")\n    email = models.EmailField(\n\
  \        help_text=\"The Publisher's email address.\")\n\n    def __str__(self):\n\
  \        return self.name\n```\n\n同样将 `__str__()` 方法添加到 Contributor 和 Book 中，如下所示：\n\
  \n```python\nclass Book(models.Model):\n    \"\"\"A published book.\"\"\"\n    title\
  \ = models.CharField(\n        max_length=70, help_text=\"The title of the book.\"\
  )\n    publication_date = models.DateField(\n        verbose_name=\"Date the book\
  \ was published.\")\n    isbn = models.CharField(\n        max_length=20,\n    \
  \    verbose_name=\"ISBN number of the book.\")\n    publisher = models.ForeignKey(\n\
  \        Publisher,\n        on_delete=models.CASCADE)\n    contributors = models.ManyToManyField(\n\
  \        'Contributor', through=\"BookContributor\")\n\n    def __str__(self):\n\
  \        return self.title\n\n\nclass Contributor(models.Model):\n    \"\"\"A contributor\
  \ to a Book, e.g. author, editor, co-author.\"\"\"\n    first_names = models.CharField(\n\
  \        max_length=50,\n        help_text=\"The contributor's first name or names.\"\
  )\n    last_names = models.CharField(\n        max_length=50,\n        help_text=\"\
  The contributor's last name or names.\")\n    email = models.EmailField(\n     \
  \   help_text=\"The contact email for the contributor.\")\n\n    def __str__(self):\n\
  \        return self.first_names\n```\n\n同样，book 的字符串表示形式是 title，因此返回值为 `self.title`，其中\
  \ `self` 指的是 Book 对象。Contributor 的字符串表示形式是贡献者的名字；因此返回 `self.first_names`。这里，`self`\
  \ 指的是 Contributor 对象。接下来，我们将查看迁移 reviews 应用。\n\n## 迁移 reviews 应用\n\n由于我们已经准备好了整个模型文件，让我们现在将模型迁移到数据库中，类似于我们之前对已安装应用所做的操作。由于\
  \ reviews 应用有一组由我们创建的模型，在运行迁移之前创建迁移脚本非常重要。迁移脚本有助于识别模型中的任何更改，并在运行迁移时将这些更改传播到数据库中。按照以下步骤创建迁移脚本，然后将模型迁移到数据库中：\n\
  \n1. 执行以下命令创建迁移脚本：\n\n```bash\npython manage.py makemigrations reviews\n```\n\n\
  你应该会得到类似以下的输出：\n\n```text\nreviews/migrations/0002_auto_20191007_0112.py\n  - Create\
  \ model Book\n  - Create model Contributor\n  - Create model Review\n  - Create\
  \ model BookContributor\n  - Add field contributors to book\n  - Add field publisher\
  \ to book\n```\n\n迁移脚本将在应用程序文件夹中的名为 migrations 的文件夹中创建。\n\n2. 接下来，使用 migrate 命令将所有模型迁移到数据库中：\n\
  \n```bash\npython manage.py migrate reviews\n```\n\n\n\n\n你应该会看到以下输出：\n\n```\nOperations\
  \ to perform:\n  Apply all migrations: reviews\nRunning migrations:\n  Applying\
  \ reviews.0002_auto_20191007_0112... OK\n```\n\n执行此命令后，我们成功创建了 reviews 应用中定义的数据库表。迁移完成后，你可以使用\
  \ DB Browser for SQLite 来浏览刚刚创建的表。\n\n- 3. 为此，打开 DB Browser for SQLite，单击 Open Database\
  \ 按钮（图 2.16），然后导航到你的项目目录：\n\n![](img/4840a43efd335abd10b93708225692d6_116_0.png)\n\
  \n图 2.16：单击 Open Database 按钮\n\n- 4. 选择 db.sqlite3 数据库文件将其打开（图 2.17）。\n\n![](img/4840a43efd335abd10b93708225692d6_116_1.png)\n\
  \n图 2.17：在 bookr 目录中定位 db.sqlite3\n\n现在你应该能够浏览已创建的新表集合。以下截图显示了 reviews 应用中定义的数据库表：\n\
  \n图 2.18：reviews 应用中定义的数据库表\n\n在本节中，我们进一步了解了 Django 模型和迁移，以及 Python 的简单类如何转化为数据库表。我们还学习了各种类属性如何按照定义的字段类型转换为相应的数据库列。随后，我们学习了主键以及数据库中可能存在的不同类型的关系。我们还为书评应用创建了模型，并迁移了这些模型，将它们转换为数据库表。在下一节中，我们将学习如何使用\
  \ Django 的 ORM 执行数据库 CRUD 操作。\n\n## Django 的数据库 CRUD 操作\n\n由于我们已经为书评应用创建了必要的数据库表，接下来让我们了解\
  \ Django 中的基本数据库操作。\n\n在 SQL CRUD 操作一节中，我们已经简要介绍了使用 SQL 语句进行数据库操作。我们尝试过使用 insert\
  \ 语句在数据库中创建条目，使用 select 语句从数据库读取，使用 update 语句更新条目，以及使用 delete 语句从数据库删除条目。\n\nDjango\
  \ 的 ORM 提供了相同的功能，而无需处理 SQL 语句。Django 的数据库操作就是简单的 Python 代码，因此我们免去了在 Python 代码中维护\
  \ SQL 语句的麻烦。让我们看看这些操作是如何执行的。\n\n为了执行 CRUD 操作，我们将运行以下命令进入 Django 的命令行 shell：\n\n\
  ```\npython manage.py shell\n```\n\n> **注意**\n> 在本章中，我们将使用代码块开头的 >>> 符号（高亮显示）来表示\
  \ Django shell 命令。将查询粘贴到 DB Browser 中时，请确保每次都排除该符号。\n\n当交互式控制台启动时，它看起来如下：\n\n```\n\
  Type \"help\", \"copyright\", \"credits\" or \"license\" for more information.\n\
  (InteractiveConsole)\n>>>\n```\n\n在下面的练习中，我们将执行一个创建操作。\n\n## 练习 2.02 – 在 bookr 数据库中创建一条记录\n\
  \n在本练习中，你将通过保存一个模型实例来在数据库中创建一条新记录。换句话说，你将在不显式运行 SQL 查询的情况下，在数据库表中创建一条记录。请按照以下步骤操作：\n\
  \n- 1. 首先，从 reviews.models 导入 Publisher 类/模型：\n\n```\n>>> from reviews.models import\
  \ Publisher\n```\n\n- 2. 通过传递 Publisher 模型所需的全部字段值（name、website 和 email），创建 Publisher\
  \ 类的一个对象或实例：\n\n```\n>>> publisher = Publisher(name='Packt Publishing',\n    website='https://www.packtpub.com',\n\
  \    email='info@packtpub.com')\n```\n\n- 3. 接下来，要将对象写入数据库，务必调用 save() 方法，因为在调用该方法之前，记录不会在数据库中创建：\n\
  \n```\n>>> publisher.save()\n```\n\n现在你可以使用 DB Browser 看到数据库中创建的新记录：\n\n![](img/4840a43efd335abd10b93708225692d6_119_0.png)\n\
  \n图 2.19：在数据库中创建的记录\n\n- 4. 使用对象属性对对象进行进一步修改，并将更改保存到数据库：\n\n```\n>>> publisher.email\
  \ = 'info@packtpub.com'\n>>> publisher.email = 'customersupport@packtpub.com'\n\
  >>> publisher.save()\n```\n\n你可以使用 DB Browser 查看更改，如下所示：\n\n![](img/4840a43efd335abd10b93708225692d6_119_1.png)\n\
  \n图 2.20：更新了 email 字段的记录\n\n在本练习中，我们通过创建模型对象的实例在数据库中创建了一条记录，并使用 save() 方法将模型对象写入数据库。\n\
  \n请注意，按照上述方法，只有在调用 save() 方法后，对类实例的修改才会被保存。然而，如果我们使用 create() 方法，Django 会一步将修改保存到数据库。我们将在接下来的练习中使用该方法。\n\
  \n## 练习 2.03 – 使用 create() 方法创建记录\n\n与之前的练习不同，之前的练习是分两步执行：先创建对象，然后使用 save() 方法在数据库中创建记录。而本练习中，你将使用\
  \ create() 方法一步在 contributor 表中创建一条记录：\n\n- 1. 首先，像之前一样导入 Contributor 类：\n\n```\n\
  >>> from reviews.models import Contributor\n```\n\n- 2. 调用 `create()` 方法，一步在数据库中创建一个对象。确保传递所有必需的参数（`first_names`、`last_names`\
  \ 和 `email`）：\n\n```\n>>> contributor =\n    Contributor.objects.create(first_names=\"\
  Rowel\",\n    last_names=\"Atienza\",\n    email=\"RowelAtienza@example.com\")\n\
  ```\n\n- 3. 使用 DB Browser 验证 contributor 记录已在数据库中创建。如果 DB Browser 尚未打开，请像上一节那样打开\
  \ `db.sqlite3` 数据库文件。单击 **Browse Data**，从 Table 下拉菜单中选择所需的表——本例中是 `reviews_contributor`\
  \ 表，如截图所示——并验证新创建的数据库记录：\n\n![](img/4840a43efd335abd10b93708225692d6_120_0.png)\n\
  \n图 2.21：在 DB Browser 中验证记录的创建\n\n在本练习中，我们了解到，使用 `create()` 方法可以一步在数据库中为模型创建一条记录。\n\
  \n## 创建带有外键的对象\n\n类似于我们在 `Publisher` 和 `Contributor` 表中创建记录的方式，现在让我们为 `Book` 表创建一条记录。如果你还记得，`Book`\
  \ 模型有一个指向 `Publisher` 的外键，该外键不能为 null。因此，填充 publisher 外键的一种方法是在 book 的 `publisher`\
  \ 字段中提供已创建的 `publisher` 对象，如下面的练习所示。\n\n## 练习 2.04 – 为多对一关系创建记录\n\n在本练习中，你将在 `Book`\
  \ 表中创建一条记录，包括指向 `Publisher` 模型的外键。如你所知，`Book` 和 `Publisher` 之间的关系是多对一关系，因此你必须先获取\
  \ `Publisher` 对象，然后在创建 book 记录时使用它。为此，请按照以下步骤操作：\n\n- 1. 首先，导入 `Publisher` 类：\n\n\
  ```\n>>> from reviews.models import Book, Publisher\n```\n\n- 2. 使用以下命令从数据库中检索 publisher\
  \ 对象。get() 方法用于从数据库中检索对象。我们还没有探索数据库读取操作。目前，请使用以下命令；我们将在下一节中更深入地探讨如何从数据库读取/检索数据：\n\
  \n```\n>>> publisher =\n    Publisher.objects.get(name='PacktPublishing')\n```\n\
  \n- 3. 创建 book 时，我们需要提供一个 date 对象，因为 publication_date 是 Book 模型中的一个 date 字段。因此，从\
  \ datetime 导入 date，以便在创建 book 对象时可以提供 date 对象，如下面的代码所示：\n\n```\n>>> from datetime\
  \ import date\n```\n\n- 4. 使用 create() 方法在数据库中创建一条 book 记录。确保传递所有字段，即 title、publication_date、isbn\
  \ 和 publisher 对象：\n\n```\n>>> book = Book.objects.create(title=\"Advanced Deep Learning\
  \ with Keras\", publication_date=date(2018, 10, 31), isbn=\"9781788629416\", publisher=publisher)\n\
  ```\n\n请注意，由于 publisher 是一个外键，并且它不是可空的（不能包含 null 值），因此必须传递一个 publisher 对象。当未提供必需的\
  \ foreign key 对象 publisher 时，数据库将抛出完整性错误。\n\n图 2.22 显示了创建第一条记录后的 Book 表。请注意，外键字段（publisher_id）指向\
  \ Publisher 表的 id 值（主键）。book 记录中的 publisher_id 指向主键为 1 的 Publisher 记录，如下面的两张截图所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_121_0.png)\n\n图 2.22：指向 reviews_book\
  \ 主键的外键\n\n\n\n\n\n![](img/4840a43efd335abd10b93708225692d6_122_0.png)\n\n图 2.23：指向\
  \ reviews_publisher 主键的外键\n\n在本练习中，我们了解到在创建数据库记录时，如果是外键，则可以将对象分配给字段。我们知道 Book 模型也与\
  \ Contributor 模型存在多对多关系。现在让我们探索在数据库中创建记录时建立多对多关系的方式。\n\n## 练习 2.05 – 使用多对多关系创建记录\n\
  \n在本练习中，你将使用 BookContributor 关系模型在 Book 和 Contributor 之间创建多对多关系：\n\n- 1. 如果你已重新启动\
  \ shell 并丢失了 publisher 和 book 对象，请使用以下 Python 语句集从数据库中检索它们：\n\n```\n>>> from reviews.models\
  \ import Book\n>>> from reviews.models import Contributor\n>>> contributor =\n \
  \   Contributor.objects.get(first_names='Rowel')\n>>> book = Book.objects.get(title=\"\
  Advanced Deep\n    Learning with Keras\")\n```\n\n- 2. 建立多对多关系的方式是通过在中间模型或关系模型中存储有关关系的信息；在这种情况下为\
  \ BookContributor。由于我们已经从数据库中获取了 book 和 contributor 记录，让我们在为 BookContributor 关系模型创建记录时使用这些对象。为此，首先创建\
  \ BookContributor 关系类的实例，然后将对象保存到数据库中。在此过程中，确保传递所需的字段，即 book 对象、contributor 对象和\
  \ role：\n\n```\n>>> from reviews.models import BookContributor\n>>> book_contributor\
  \ = BookContributor(book=book,\n    contributor=contributor, role='AUTHOR')\n>>>\
  \ book_contributor.save()\n```\n\n请注意，我们在创建 `book_contributor` 对象时将 role 设置为 `AUTHOR`。这是在建立多对多关系时存储关系数据的经典示例。role\
  \ 可以是 `AUTHOR`、`CO_AUTHOR` 或 `EDITOR`。\n\n这建立了书籍 *Advanced Deep Learning with Keras*\
  \ 与贡献者 Rowel 之间的关系（Rowel 是该书的作者）。\n\n在本练习中，我们使用 `BookContributor` 关系模型在 Book 和 `Contributor`\
  \ 之间建立了多对多关系。关于我们刚刚创建的多对多关系的验证，我们将在本章后面的几个练习中详细介绍。\n\n## 练习 2.06 – 使用 add() 方法的多对多关系\n\
  \n在本练习中，你将使用 `add()` 方法建立多对多关系。当我们不使用关系来创建对象时，可以使用 `through_default` 传递一个包含定义所需字段的参数的字典。继续上一个练习，让我们再向题为\
  \ *Advanced Deep Learning with Keras* 的书籍添加一位贡献者。这次，该贡献者是该书的编辑：\n\n- 1. 如果你已重新启动\
  \ shell，请运行以下两个命令以导入并获取所需的 book 实例：\n\n```\n```python\n>>> from reviews.models import\
  \ Book, Contributor\n>>> book = Book.objects.get(title=\"Advanced Deep\nLearning\
  \ with Keras\")\n```\n```\n\n- 2. 使用 `create()` 方法创建贡献者，如下所示：\n\n```\n```python\n\
  >>> contributor =\n    Contributor.objects.create(first_names='Packt',\n    last_names='Example\
  \ Editor',\n    email='PacktEditor@example.com')\n```\n```\n\n- 3. 使用 `add()` 方法将新创建的贡献者添加到书籍中。确保以\
  \ dict 的形式提供 `role` 关系参数。输入以下代码：\n\n```\n```python\n>>> book.contributors.add(contributor,\n\
  \    through_defaults={'role': 'EDITOR'})\n```\n```\n\n因此，我们使用 `add()` 方法在书籍和贡献者之间建立了多对多关系，同时将关系数据\
  \ role 存储为 `EDITOR`。让我们现在看看其他实现方式。\n\n## 使用 create() 和 set() 方法进行多对多关系\n\n假设书籍 Advanced\
  \ Deep Learning with Keras 共有两位编辑。让我们使用以下方法向书籍添加另一位编辑。如果贡献者尚未存在于数据库中，则可以使用 create()\
  \ 方法同时创建条目并建立其与书籍的关系：\n\n```\n>>> book.contributors.create(first_names='Packtp',\n\
  \    last_names='Editor Example',\n    email='PacktEditor2@example.com',\n    through_defaults={'role':\
  \ 'EDITOR'})\n```\n\n同样，我们也可以使用 set() 方法添加书籍的贡献者列表。让我们创建一个 publisher、两位共同作者的贡献者集合以及一个\
  \ book 对象。首先，如果尚未导入，请使用以下代码导入 Publisher 模型：\n\n```\n>>> from reviews.models import\
  \ Publisher\n```\n\n以下代码将帮助我们实现：\n\n```\n>>> publisher =\n    Publisher.objects.create(name='Pocket\
  \ Books',\n    website='https://pocketbookssampleurl.com',\n    email='pocketbook@example.com')\n\
  >>> contributor1 =\n    Contributor.objects.create(first_names='Stephen',\n    last_names='Stephen',\
  \ email='StephenKing@example.com')\n>>> contributor2 =\n    Contributor.objects.create(first_names='Peter',\n\
  \    last_names='Straub', email='PeterStraub@example.com')\n\n>>> book = Book.objects.create(title='The\
  \ Talisman',\n    publication_date=date(2012, 9, 25),\n    isbn='9781451697216',\
  \ publisher=publisher)\n```\n\n由于这是多对多关系，我们可以使用 set() 方法一次性添加对象列表。我们可以使用 through_defaults\
  \ 指定贡献者的角色；在这种情况下，他们是共同作者：\n\n```\n>>> book.contributors.set([contributor1, contributor2],\n\
  \    through_defaults={'role': 'CO_AUTHOR'})\n```\n\n## 读操作\n\nDjango 为我们提供了允许从数据库读取/检索的方法。我们可以使用\
  \ `get()` 方法从数据库检索单个对象。我们已在前几节中创建了一些记录，因此让我们使用 `get()` 方法检索一个对象。\n\n## 练习 2.07 –\
  \ 使用 get() 方法检索对象\n\n在本练习中，你将使用 `get()` 方法从数据库检索对象。请按照以下步骤操作：\n\n- 1. 获取 name 字段为\
  \ Pocket Books 的 Publisher 对象：\n\n```\n```python\n>>> from reviews.models import\
  \ Publisher\n>>> publisher =\n    Publisher.objects.get(name='Pocket Books')\n```\n\
  ```\n\n- 2. 重新输入检索到的 publisher 对象并按 *Enter*：\n\n```\n```\n>>> publisher\n<Publisher:\
  \ Pocket Books>\n```\n```\n\n请注意，输出会显示在 shell 中。这称为对象的字符串表示。它是添加 `__str__()` 模型方法的结果，就像我们在\
  \ *Model methods* 部分为 Publisher 类所做的那样。\n\n- 3. 检索对象后，你可以访问对象的所有属性。由于这是一个 Python\
  \ 对象，可以通过使用 `.` 后跟属性名来访问对象的属性。因此，你可以使用以下命令检索出版商的名称：\n\n```\n```\n>>> publisher.name\n\
  'Pocket Books'\n```\n```\n\n- 4. 同样，要检索出版商的网站，请使用以下命令：\n\n```\n```\n>>> publisher.website\n\
  'https://pocketbookssampleurl.com'\n```\n```\n\n出版商的电子邮件地址可以按如下方式检索：\n\n```\n```\n\
  >>> publisher.email\n'pocketbook@example.com'\n```\n```\n\n在本练习中，我们学习了如何使用 `get()`\
  \ 方法获取单个对象。使用此方法有几个缺点。让我们接下来找出它们是什么。\n\n## 使用 get() 方法返回对象\n\n需要注意的是，get() 方法只能获取一个对象。如果另一个对象携带与所提字段相同的值，则我们可以预期返回多于一个错误消息。例如，如果\
  \ Publisher 表中有两个条目 name 字段的值相同，我们可以预期出现错误。在这种情况下，有其他方法可以检索这些对象，我们将在后续部分中探讨。\n\n\
  当 get() 查询没有返回对象时，我们也可以收到匹配查询不存在的错误消息。get() 方法可与对象的任何字段一起使用以检索记录。在以下情况下，我们使用 website\
  \ 字段：\n\n```\n```python\n>>> publisher =\n    Publisher.objects.get(\n    website='https://pocketbookssampleurl.com')\n\
  ```\n```\n\n检索对象后，我们仍然可以获取出版商的名称，如下所示：\n\n```\n```python\n>>> publisher.name\n'Pocket\
  \ Books'\n```\n```\n\n另一种检索对象的方法是使用其主键 pk，如下所示：\n\n```\n```python\n>>> Publisher.objects.get(pk=2)\n\
  <Publisher: Pocket Books>\n```\n```\n\n使用 pk 作为主键是使用主键字段的更通用方法。但对于 Publisher 表，由于我们知道\
  \ id 是主键，因此可以简单地使用 id 字段名来创建我们的 get() 查询：\n\n```\n```python\n>>> Publisher.objects.get(id=2)\n\
  <Publisher: Pocket Books>\n```\n```\n\n> **注意**\n> \n> 对于 Publisher 和所有其他表，主键是 id，这是\
  \ Django 自动创建的。这发生在创建表时未提及主键字段时。但也可能存在显式声明某个字段为主键的情况。\n\n在下一个练习中，我们将了解如何查询并检索给定模型的全部对象。\n\
  \n\n\n\n\n## 练习 2.08 – 使用 all() 方法检索一组对象\n\n我们可以使用 all() 方法检索所有对象的集合。在本练习中，你将使用此方法检索所有贡献者的姓名。为此，请按照以下步骤操作：\n\
  \n- 1. 添加以下代码以从 Contributor 表中检索所有对象：\n\n```\n>>> from reviews.models import Contributor\n\
  \n>>> Contributor.objects.all()\n<QuerySet [<Contributor: Rowel>, <Contributor:\
  \ Packt>,\n<Contributor: Packt>, <Contributor: Stephen>, <Contributor:\nPeter>]>\n\
  ```\n\n执行后，你将获得所有对象的 QuerySet。\n\n- 2. 我们可以使用列表索引查找特定对象，或使用循环遍历列表以执行其他操作：\n\n```\n\
  >>> contributors = Contributor.objects.all()\n```\n\n- 3. 由于 Contributor 是一个对象列表，你可以使用索引访问列表中的任何元素，如以下命令所示：\n\
  \n```\n>>> contributors[0]\n<Contributor: Rowel>\n```\n\n在这种情况下，列表中的第一个元素是一个 first_names\
  \ 值为 'Rowel' 且 last_names 值为 'Atienza' 的贡献者，如以下代码所示：\n\n```\n>>> contributors[0].first_names\n\
  'Rowel'\n>>> contributors[0].last_names\n'Atienza'\n```\n\n在本练习中，我们学习了如何使用 all()\
  \ 方法检索所有对象，以及如何将检索到的对象集合作为列表使用。\n\n## 通过过滤检索对象\n\n如果某个字段值对应多个对象，我们就不能使用 get() 方法，因为\
  \ get() 方法只能返回一个对象。对于这种情况，我们有 filter() 方法，它可以检索所有符合指定条件的对象。\n\n## 练习 2.09 – 使用 filter()\
  \ 方法检索对象\n\n在本练习中，你将使用 filter() 方法获取特定条件下的对象集合。具体来说，你将检索所有名字为 Peter 的贡献者姓名。为此，请按照以下步骤操作：\n\
  \n- 1. 首先，创建另外两个贡献者：\n\n```\n>>> from reviews.models import Contributor\n>>> Contributor.objects.create(first_names='Peter',\n\
  \    last_names='Wharton',\n    email='PeterWharton@example.com')\n>>> Contributor.objects.create(first_names='Peter',\n\
  \    last_names='Tyrrell',\n    email='PeterTyrrell@example.com')\n```\n\n- 2. 要检索\
  \ first_names 值为 Peter 的贡献者，请添加以下代码：\n\n```\n>>> Contributor.objects.filter(first_names='Peter')\n\
  <QuerySet [<Contributor: Peter>, <Contributor: Peter>,\n<Contributor: Peter>]>\n\
  ```\n\n- 3. filter() 方法即使只有一个对象也会返回该对象。你可以在此处看到这一点：\n\n```\n>>> Contributor.objects.filter(first_names='Rowel')\n\
  <QuerySet [<Contributor: Rowel]>\n```\n\n- 4. 此外，如果查询不匹配任何内容，filter() 方法将返回一个空的\
  \ QuerySet。这可以在此处看到：\n\n```\n>>> Contributor.objects.filter(first_names='Nobody')\n\
  <QuerySet []>\n```\n\n在本练习中，我们看到了使用过滤器根据特定条件检索少量对象集合的用法。在下一节中，我们将学习使用字段查找进行过滤。\n\
  \n## 通过字段查找进行过滤\n\n现在，假设我们想要通过提供某些条件，使用对象的字段来过滤和查询一组对象。在这种情况下，我们可以使用双下划线查找。例如，Book\
  \ 对象有一个 publication_date 字段；假设我们想要过滤并获取所有在 01-01-2014 之后出版的书籍。我们可以通过使用双下划线方法轻松查找这些书籍。为此，我们将首先导入\
  \ Book 模型：\n\n```\n>>> from reviews.models import Book\n>>> book = Book.objects.filter(publication_date__gt=date(\n\
  \    2014, 1, 1))\n```\n\n这里，publication_date__gt 表示 publication date 大于 (gt) 某个指定日期，在本例中为\
  \ 01-01-2014。类似地，我们有以下缩写：\n\n- lt: 小于\n- lte: 小于或等于\n- gte: 大于或等于\n\n过滤后的结果可以在此处看到：\n\
  \n```\n>>> book\n<QuerySet [<Book: Advanced Deep Learning with Keras>]>\n```\n\n\
  以下是查询集中书籍的出版日期，这证实了出版日期在 01-01-2014 之后：\n\n```\n>>> book[0].publication_date\ndatetime.date(2018,\
  \ 10, 31)\n```\n\n## 使用模式匹配进行过滤操作\n\n对于过滤结果，我们还可以查找参数是否包含我们正在查找的字符串的一部分：\n\n```\n\
  >>> book =\n    Book.objects.filter(title__contains='Deep learning')\n```\n\n这里，title__contains\
  \ 查找标题包含 'Deep learning' 作为字符串一部分的所有对象：\n\n```\n>>> book\n<QuerySet [<Book: Advanced\
  \ Deep Learning with Keras>]>\n\n>>> book[0].title\n'Advanced Deep Learning with\
  \ Keras'\n```\n\n同样，如果字符串匹配需要不区分大小写，我们可以使用 icontains。使用 startswith 匹配以指定字符串开头的任何字符串。\n\
  \n## 使用 `exclude()` 方法检索对象\n\n在上一节中，我们学习了通过匹配特定条件获取一组对象。现在，假设我们想要做相反的操作；也就是说，我们想要获取所有不匹配特定条件的对象。在这种情况下，我们可以使用\
  \ `exclude()` 方法排除特定条件并获取所有所需对象。这将通过示例更清晰。以下是所有贡献者的列表：\n\n```\n```python\n>>> Contributor.objects.all()\n\
  <QuerySet [<Contributor: Rowel>, <Contributor: Packt>,\n<Contributor: Packt>, <Contributor:\
  \ Stephen>,\n<Contributor: Peter>, <Contributor: Peter>,\n<Contributor: Peter>]>\n\
  ```\n```\n\n现在，从此列表中，我们将排除所有 first_names 值为 Peter 的贡献者：\n\n```\n```python\n>>> Contributor.objects.exclude(first_names='Peter')\n\
  <QuerySet [<Contributor: Rowel>, <Contributor: Packt>,\n<Contributor: Packt>, <Contributor:\
  \ Stephen>]>\n```\n```\n\n我们在这里看到，查询返回了所有名字不是 Peter 的贡献者。\n\n## 使用 `order_by()`\
  \ 方法检索对象\n\n我们可以使用 `order_by()` 方法按指定字段对对象列表进行排序并检索。例如，在以下代码片段中，我们按出版日期对书籍进行排序：\n\
  \n```\n```python\n>>> books = Book.objects.order_by(\"publication_date\")\n>>> books\n\
  <QuerySet [<Book: The Talisman>, <Book: Advanced Deep Learning with\nKeras>]>\n\
  ```\n```\n\n让我们检查查询的顺序。由于查询集是一个列表，我们可以使用索引检查每本书的出版日期：\n\n```\n```python\n>>> books[0].publication_date\n\
  datetime.date(2012, 9, 25)\n>>> books[1].publication_date\ndatetime.date(2018, 10,\
  \ 31)\n```\n```\n\n请注意，索引为 0 的第一本书的出版日期早于索引为 1 的第二本书的出版日期。因此，这证实了查询的书籍列表已按其出版日期正确排序。我们也可以为字段参数使用带负号的前缀以按降序排列结果。这可以从以下代码片段中看出：\n\
  \n```\n>>> books = Book.objects.order_by(\"-publication_date\")\n>>> books\n\n<QuerySet\
  \ [<Book: Advanced Deep Learning with Keras>,\n<Book: The Talisman>] >\n```\n\n\
  由于我们在 publication date 前加上了负号，请注意查询的书籍集合现在已按相反顺序返回，其中索引为 0 的第一本书对象具有比第二本书更新的日期：\n\
  \n```\n>>> books[0].publication_date\ndatetime.date(2018, 10, 31)\n\n>>> books[1].publication_date\n\
  datetime.date(2012, 9, 25)\n```\n\n我们也可以使用字符串字段或数值字段进行排序。例如，以下代码可用于按主键或 id 对书籍进行排序：\n\
  \n```\n>>> books = Book.objects.order_by('id')\n>>> books\n<QuerySet [<Book: Advanced\
  \ Deep Learning with Keras>,\n<Book: The Talisman>] >\n```\n\n查询的书籍集合已按 book id\
  \ 升序排列：\n\n```\n>>> books[0].id\n1\n>>> books[1].id\n2\n```\n\n同样，要按降序排列，可以使用负号作为前缀，如下所示：\n\
  \n```\n>>> books = Book.objects.order_by('-id')\n>>> books\n<QuerySet [<Book: The\
  \ Talisman>, <Book: Advanced Deep Learning with Keras>] >\n```\n\n\n\n\n\n现在，按 book\
  \ id 降序排列的书籍查询集如下：\n\n```\n>>> books[0].id\n2\n>>> books[1].id\n1\n```\n\n要按字符串字段进行字母顺序排序，我们可以这样做：\n\
  \n```\n>>> books = Book.objects.order_by('title')\n>>> books\n<QuerySet [<Book:\
  \ Advanced Deep Learning with Keras>, <Book: The Talisman>]>\n```\n\n由于我们使用书籍标题进行排序，查询集已按字母顺序排列。我们可以按如下方式看到这一点：\n\
  \n```\n>>> books[0]\n<Book: Advanced Deep Learning with Keras>\n>>> books[1]\n<Book:\
  \ The Talisman>\n```\n\n与之前看到的排序类型类似，负号前缀可以帮助我们按反向字母顺序排序，如下所示：\n\n```\n>>> books\
  \ = Book.objects.order_by('-title')\n>>> books\n<QuerySet [<Book: The Talisman>,\
  \ <Book: Advanced Deep Learning with Keras>]>\n```\n\n这将导致以下输出：\n\n```\n>>> books[0]\n\
  <Book: The Talisman>\n>>> books[1]\n<Book: Advanced Deep Learning with Keras>\n\
  ```\n\nDjango 提供的另一个有用的方法是 values()。它帮助我们获取字典的查询集而不是对象。在下面的代码片段中，我们将其用于 Publisher\
  \ 对象：\n\n```\n>>> publishers = Publisher.objects.all().values()\n\n>>> publishers\n\
  <QuerySet [{'id': 1, 'name': 'Packt Publishing', 'website': 'https://www.packtpub.com',\
  \ 'email': 'customersupport@packtpub.com'}, {'id': 2, 'name': 'Pocket Books', 'website':\
  \ 'https://pocketbookssampleurl.com',\n'email': 'pocketbook@example.com'}]>\n>>>\
  \ publishers[0]\n{'id': 1, 'name': 'Packt Publishing', 'website': 'https://www.packtpub.com',\
  \ 'email': 'customersupport@packtpub.com'}\n\n>>> publishers[0]\n{'id': 1, 'name':\
  \ 'Packt Publishing', 'website': 'https://www.packtpub.com', 'email': 'customersupport@packtpub.com'}\n\
  ```\n\n在接下来的几节中，我们将探讨如何跨关系进行查询。\n\n## Querying across relationships\n\n正如本章所研究的那样，reviews\
  \ 应用有两个种类的关系：多对一和多对多。到目前为止，我们已经学习了使用 get()、filters、字段查找等进行查询的各种方法。现在让我们研究如何跨关系执行查询。有几种方法可以做到这一点——我们可以使用外键、对象实例等。让我们借助一些示例来探索这些。\n\
  \n### Querying using foreign keys\n\n当我们在两个模型/表之间存在关系时，Django 提供了一种使用关系执行查询的方法。本节中显示的命令将通过使用模型关系执行查询来检索\
  \ Packt Publishing 出版的所有书籍。与之前看到的类似，这使用双下划线查找来完成。例如，Book 模型有一个指向 Publisher 模型的 publisher\
  \ 外键。使用此外键，我们可以使用双下划线和 Publisher 模型中的 name 字段执行查询。这可以从以下代码中看出：\n\n```\n>>> Book.objects.filter(publisher__name='Packt\
  \ Publishing')\n<QuerySet [<Book: Advanced Deep Learning with Keras>]>\n```\n\n\
  ### Querying using the model name\n\n另一种查询方式是使用关系反向查询，使用小写的模型名称。例如，假设我们想使用查询中的模型关系查询出版了书籍\
  \ Advanced Deep Learning with Keras 的出版商。对于此，我们可以执行以下语句以检索 Publisher 信息对象：\n\n```\n\
  >>> Publisher.objects.get(book__title='Advanced Deep Learning with Keras')\n<Publisher:\
  \ Packt Publishing>\n```\n\n这里，book 是小写的模型名称。正如我们所知，Book 模型有一个 publisher 外键，其 name\
  \ 值为 Packt Publishing。\n\n### Querying across foreign key relationships using the\
  \ object instance\n\n我们也可以使用对象的外键检索信息。假设我们想查询标题为 The Talisman 的出版商名称：\n\n```\n>>>\
  \ book = Book.objects.get(title='The Talisman')\n>>> book.publisher\n<Publisher:\
  \ Pocket Books>\n```\n\n使用对象在这里是一个示例，我们使用反向方向通过使用 set.all() 方法获取出版商出版的所有书籍：\n\n\
  ```\n>>> publisher = Publisher.objects.get(name='Pocket Books')\n\n>>> publisher.book_set.all()\n\
  <QuerySet [<Book: The Talisman>] >\n```\n\n我们也可以使用查询链创建查询：\n\n```\n>>> Book.objects.filter(publisher__name='Pocket\
  \ Books').filter(title='The Talisman')\n<QuerySet [<Book: The Talisman>] >\n```\n\
  \n让我们执行一些练习来巩固我们迄今为止学到的各种查询知识。\n\n## Exercise 2.10 – querying across a many-to-many\
  \ relationship using the field lookup\n\n我们知道 Book 和 Contributor 之间存在多对多关系。在本练习中，不创建对象，你将执行查询以检索所有为题为\
  \ The Talisman 的书籍撰稿的贡献者：\n\n- 1. 首先，导入 Contributor 类：\n  ```\n  >>> from reviews.models\
  \ import Contributor\n  ```\n- 2. 现在，添加以下代码以查询 The Talisman 的贡献者集合：\n  ```\n  >>>\
  \ Contributor.objects.filter(book__title='The Talisman')\n  ```\n\n```\n>>> from\
  \ reviews.models import Contributor\n```\n\n```\n>>> Contributor.objects.filter(book__title='The\
  \ Talisman')\n```\n\n- 3. 使用 contributor 对象和 book_set() 方法，获取该贡献者撰写的所有书籍：\n\n```\n\
  >>> contributor.book_set.all()\n<QuerySet [<Book: Advanced Deep Learning with Keras>]>\n\
  ```\n\n由于 Book 和 Contributor 之间存在多对多关系，我们可以使用 set() 方法查询与模型关联的对象集合。在这种情况下，contributor.book_set.all()\
  \ 返回了该贡献者撰写的所有书籍。\n\n## Exercise 2.13 – using the update() method\n\n在本练习中，你将使用\
  \ update() 方法更新现有记录：\n\n- 1. 更改 last name 为 Tyrrell 的贡献者的 first_names：\n\n```\n\
  >>> from reviews.models import Contributor\n>>> Contributor.objects.filter(last_names='Tyrrell').\n\
  \    update(first_names='Mike')\n1\n```\n\n返回值显示已更新的记录数。在这种情况下，已更新一条记录。\n\n- 2.\
  \ 使用 get() 方法获取刚刚修改的贡献者，并验证名字已更改为 Mike：\n\n```\n>>> Contributor.objects.get(last_names='Tyrrell').\n\
  \    first_names\n'Mike'\n```\n\n> Note\n> 如果 filter 操作有多个记录，则 update() 方法将更新 filter\
  \ 返回的所有记录中指定的字段。\n\n在本练习中，我们学习了如何使用 update() 方法更新数据库中的记录。现在，最后，让我们尝试使用 delete()\
  \ 方法从数据库中删除一条记录。\n\n## Exercise 2.14 – using the delete() method\n\n数据库中现有的记录可以使用\
  \ delete() 方法删除。在本练习中，你将从 contributors 表中删除 last_name 值为 Wharton 的记录：\n\n- 1. 使用\
  \ get() 方法获取对象并使用 delete() 方法，如下所示：\n\n```\n>>> from reviews.models import Contributor\n\
  >>> Contributor.objects.get(last_names='Wharton').\n    delete()\n(1, {'reviews.Contributor':\
  \ 1}\n```\n\n请注意，你在不将 contributor 对象分配给变量的情况下调用了 delete() 方法。由于 get() 方法返回单个对象，因此你可以在不实际为其创建变量的情况下访问对象的方法。\n\
  \n- 2. 验证 last_name 为 'Wharton' 的贡献者对象已被删除：\n\n```\n>>> Contributor.objects.get(last_names='Wharton')\n\
  Traceback (most recent call last):\nFile \"<console>\", line 1, in <module>\nFile\
  \ \"../../site-packages/django/db/models/manager.py\",\nline 82, in manager_method\n\
  return getattr(self.get_queryset(), name)(*args,\n**kwargs)\nFile \"../../site-packages/django/db/models/query.py\"\
  ,\nline 417, in get\nself.model._meta.object_name\nreviews.models.Contributor.DoesNotExist:\
  \ Contributor\nmatching query does not exist.\n```\n\n正如你所见，运行查询后，我们得到了对象不存在错误。这是预期的，因为记录已被删除。在本练习中，我们学习了如何使用\
  \ delete() 方法从数据库中删除记录。\n\n## Bulk create and bulk update operations\n\n当我们有一大批需要创建或更新的记录时，我们可以使用\
  \ bulk_create() 和 bulk_update() 方法分别执行批量创建和批量更新操作。当我们有大量记录需要创建或更新时，使用这些方法在执行数据库操作时可以是高效的。\n\
  \n\n\n\n\n通常，使用对象列表调用 `bulk_create` 方法的方式如下：\n\n```\nPerson.objects.bulk_create([\n\
  \    Person(name='Robert', address='5, Byron bay, NSW'),\n    Person(name='Mark',\
  \ address=\"Unit 12, New town, NSW 2000\"),])\n```\n\n同样，批量更新也是在类似对象的列表上执行。可以按以下示例所示更改对象的属性，并使用\
  \ `bulk_update()` 方法在单个命令中将它们更新到数据库中，如以下代码段所示：\n\n```\npersons[0].address = \"8,\
  \ Byron bay, NSW\"\npersons[1].address = \"15, New town, NSW\"\nPerson.objects.bulk_update(persons,\
  \ [\"address\"])\n```\n\n我们将在接下来的练习中看到这两种方法的更多示例。\n\n## 练习 2.15 – 使用 bulk_create\
  \ 创建多条记录\n\n在本练习中，我们将使用 `bulk_create()` 方法一次性向 Publisher 表中创建多条条目。为此，请执行以下步骤：\n\n\
  - 1. 如果尚未导入，请在 Django shell 中导入 Publisher 模型：\n\n```\n>>> from reviews.models import\
  \ Publisher\n```\n\n- 2. 通过将 Publisher 对象列表传递给 `bulk_create()` 方法，在 Publisher 表中创建多条记录：\n\
  \n```\n>>> Publisher.objects.bulk_create([\n    Publisher(name=\"New Town Publisher\"\
  ,\n              website=\"www.newtownexample.com\",\n              email='newtow@example.com'),\
  \ Publisher(name=\"Byron Bay Press\", website=\"www.byronbayexample.com\", email='byronbayexample@email.com'),\n\
  \    Publisher(name=\"Katoomba Publisher\",\n              website=\"www.katoombaexample.com\"\
  ,\n              email='katoombaexample@email.com')])\n\n[<Publisher: New Town Publisher>,\
  \ <Publisher: Byron Bay Press>, <Publisher: Katoomba Publisher>]\n```\n\n该方法返回作为数据库中条目创建的对象列表。如果需要创建大量条目，这可能是执行任务最有效的方法之一。\n\
  \n接下来，我们将尝试使用 `bulk_update` 方法高效地批量更新记录。\n\n## 练习 2.16 – 使用 `bulk_update` 更新多条记录\n\
  \n与前一个练习类似，我们可以使用 `bulk_update` 方法一次性更新多条记录：\n\n- 1. 首先，如果尚未导入，请导入 `Publisher` 模型：\n\
  \n```\n```python\n>>> from reviews.models import Publisher\n```\n```\n\n- 2. 在下一步中，我们将挑选几个\
  \ `Publisher` 对象作为列表。\n\n- 3. 假设这两个出版商已合并为一家公司，并且需要共享相同的网站，现在让我们在一个查询集中更新这两个对象：\n\
  \n```\n```python\n>>> publishers = [Publisher.objects.get(name='New Town Publisher'),\
  \ Publisher.objects.get(name='Byron Bay Press')]\n>>> publishers[0].website = \"\
  www.newsouthwalespublisher.com\"\n>>> publishers[1].website = \"www.newsouthwalespublisher.com\"\
  \n\n>>> Publisher.objects.bulk_update(publishers, [\"website\"])\n2\n```\n```\n\n\
  运行 `bulk_update` 方法后，它会返回已更新对象的数量；在本例中为两个对象。同样，这也是一次性更新多个对象的高效方式。\n\n## 使用 Q 对象执行复杂查询\n\
  \nQ 对象用于执行复杂查询，尤其是在查询涉及 WHERE 子句中的 AND 或 OR 操作时。例如，如果我们需要执行与此处所示的 SQL 查询类似的查询：\n\
  \n```\n```sql\nSELECT * FROM Person WHERE name LIKE \"Rob%\" OR name LIKE \"Bob%\"\
  ;\n```\n```\n\n前面的 SQL 语句查询任何名字以 Rob 或 Bob 开头的人。\n\n在 `LIKE \"Rob%\"` 中，这里 `LIKE`\
  \ 关键字模式匹配字符串，以检查字符串是否以指定的 Rob 值开头。\n\nQ 对象在组合 WHERE 子句时使用 & 和 | 运算符分别表示 AND 和 OR\
  \ 操作。前面使用 Q 对象的查询可以写成如下形式：\n\n```\nPerson.objects.get(Q(name__startswith='Rob')\
  \ | Q(name__startswith='Bob'))\n```\n\n## 练习 2.17 – 使用 Q 对象执行复杂查询\n\n接下来，使用之前学到的概念，Q\
  \ 对象让我们可以查询两个出版商：\n\n- 1. 如果尚未导入，请导入 Publisher 并从 django.db.models 导入 Q，如以下命令所示：\n\
  \n```\n>>> from django.db.models import Q\n>>> from reviews.models import Publisher\n\
  ```\n\n- 2. 按如下所示执行 Q 对象查询。在这里，我们检查是否有任何 Publisher 对象的名称以 New 或 Idea 开头：\n\n```\n\
  >>> Publisher.objects.filter(Q(name__startswith=\"New\")\n        | Q(name__startswith=\"\
  Idea\"))\n<QuerySet [<Publisher: New Town Publisher>]>\n```\n\n由于没有名称以 Idea 开头的\
  \ Publisher，而有一个名称以 New 开头的对象，因此返回了一个对象。\n\n这是一个使用 AND 运算符的 Q 对象查询示例。在此查询中，我们查询名称以\
  \ New 开头并且名称以 Publisher 结尾的 Publisher 对象：\n\n```\n>>> Publisher.objects.filter(Q(name__startswith=\"\
  New\") &\n        Q(name__endswith=\"Publisher\"))\n<QuerySet [<Publisher: New Town\
  \ Publisher>]>\n```\n\n在这种情况下，只返回了一个对象，即 New Town Publisher，它满足查询中所述的条件。这样，可以使用\
  \ AND 或 OR 运算符组合多个 WHERE 子句以获得所需的结果。\n\n## 练习 2.18 – 验证查询集是否包含给定对象\n\n在本练习中，我们将使用\
  \ contains 方法检查查询是否包含指定的对象：\n\n- 1. 如果尚未导入，请导入 Publisher 模型：\n\n```\n>>> from reviews.models\
  \ import Publisher\n```\n\n- 2. 运行如下所示的查询。在此示例中，我们正在执行 Q 对象查询，结果有两个出版商：\n\n```\n\
  ```python\n>>> publishers =\n    Publisher.objects.filter(Q(name__startswith=\"\
  New\")\n        | Q(name__endswith=\"Publisher\"))\n>>> publishers\n<QuerySet [<Publisher:\
  \ New Town Publisher>, <Publisher: Katoomba Publisher>]>\n```\n```\n\n- 3. 获取一个新的出版商对象并验证它是否属于之前的查询集：\n\
  \n```\n```python\n>>> new_town_publisher =\n    Publisher.objects.get(name='New\
  \ Town Publisher')\n>>> new_town_publisher\n<Publisher: New Town Publisher>\n>>>\
  \ publishers.contains(new_town_publisher)\nTrue\n```\n```\n\n如果对象存在，则返回布尔值，例如 `True`\
  \ 或 `False`。\n\n以下是查询集不包含指定对象的示例，在这种情况下返回的结果为 `False`：\n\n```\n```python\n>>> publishers.contains(Publisher.objects.get(name='Byron\n\
  \    Bay Press'))\nFalse\n```\n```\n\n在本练习中，我们学习了如何使用简单的 `contains()` 方法检查对象是否属于查询集。\n\
  \n总体而言，在本整个部分中，我们学习并使用了 Django 的命令行交互式 shell。使用上一节为图书评论应用程序创建的模型，我们使用 Django 交互式\
  \ shell 执行了 CRUD 操作。我们还探索了从数据库中过滤和查询（读取）的各种方法。所有这些数据库操作在开发任何 Django 应用程序时都将派上用场。在本章中迄今为止学到的概念的基础上，在下一节中，您将为示例应用程序创建模型并执行一些\
  \ CRUD 操作。\n\n## 活动 2.01 – 为项目管理应用程序创建模型\n\n假设您正在开发一个名为 Juggler 的项目管理应用程序。Juggler\
  \ 是一个可以跟踪多个项目的应用程序，每个项目可以有多个相关任务。以下步骤将帮助您完成此活动：\n\n- 1. 使用迄今为止学到的技术，创建一个名为 `juggler`\
  \ 的 Django 项目。\n- 2. 创建一个名为 `projectp` 的 Django 应用。\n- 3. 将应用 projects 添加到 `juggler/settings.py`\
  \ 文件中。\n- 4. 在 `projectp/models.py` 中创建两个相关的模型类 Project 和 Task。\n- 5. 创建迁移脚本并将模型的定义迁移到数据库。\n\
  - 6. 打开 Django shell 并导入模型。\n- 7. 使用示例填充数据库并编写查询以显示给定项目关联的任务列表。\n\n> **注意**\n> 此活动的完整解决方案可在\
  \ https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions\
  \ 上找到。\n\n## 填充 Bookr 项目的数据库\n\n虽然我们知道如何为项目创建数据库记录，但在接下来的几章中，我们将不得不创建大量记录来处理项目。因此，我们创建了一个脚本，可以使事情变得更容易。该脚本通过读取包含大量记录的逗号分隔值（CSV）文件来填充数据库。请按照以下步骤填充项目的数据库：\n\
  \n- 1. 在项目目录内创建以下文件夹结构：\n- `bookr/reviews/management/commands/`\n- 2. 从以下位置复制 `loadcsv.py`\
  \ 文件和 WebDevWithDjangoData.csv 到创建的文件夹中。这可以在本书的 GitHub 仓库 http://packt.live/3pvbCLM\
  \ 上找到。\n\n由于 `loadcsv.py` 放置在 management/commands 文件夹中，它现在就像一个 Django 自定义管理命令。您可以查看\
  \ `loadcsv.py` 文件并阅读有关编写 Django 自定义管理命令的更多信息：https://docs.djangoproject.com/en/3.0/howto/custom-management-commands/。\n\
  \n\n\n\n\n+   3. 现在，让我们重新创建一个新的数据库。删除项目文件夹中存在的 SQL 数据库文件：\n\n```\nrm db.sqlite3\n\
  ```\n\n+   4. 要创建新的数据库，请执行 Django migrate 命令：\n\n```\npython manage.py migrate\n\
  ```\n\n现在你可以在 bookr 文件夹下看到新创建的 db.sqlite3 文件。\n\n+   5. 执行 loadcsv 自定义管理命令来填充数据库：\n\
  \n```\npython manage.py loadcsv --csv reviews/management/commands/\nWebDevWithDjangoData.csv\n\
  ```\n\n+   6. 使用 DB Browser for SQLite，验证 bookr 项目创建的所有表都已填充。\n\n至此，我们已成功填充了应用程序的数据库，这将在本书后续章节的工作中派上用场。\n\
  \n## 摘要\n\n在本章中，我们学习了一些基本的数据库概念及其在应用程序开发中的重要性。我们使用了一个免费的数据库可视化工具 DB Browser for\
  \ SQLite，来理解数据库表和字段是什么以及记录如何在数据库中存储，并进一步使用简单的 SQL 查询对数据库执行了一些基本的 CRUD 操作。\n\n我们随后学习了\
  \ Django 如何提供一个名为 ORM 的有价值的抽象层，它帮助我们使用简单的 Python 代码无缝地与关系数据库交互，而无需编写 SQL 命令。作为 ORM\
  \ 的一部分，我们学习了 Django 模型、迁移，以及它们如何帮助将对 Django 模型所做的更改传播到数据库中。\n\n我们通过学习数据库关系及其在关系数据库中的关键类型来巩固了我们对数据库的了解。我们还使用\
  \ Django shell，使用 Python 代码执行了之前使用 SQL 执行的相同 CRUD 查询。后来，我们学习了如何使用模式匹配和字段查找以更精细的方式检索数据。随着我们学习这些概念，我们也在\
  \ Bookr 应用程序上取得了相当大的进展。我们为 reviews 应用创建了模型，并获得了与应用程序数据库中存储的数据交互所需的所有技能。在下一章中，我们将学习如何创建\
  \ Django 视图、URL 路由和模板。\n"
- "## URL 映射、视图和模板\n\n在上一章中，我们介绍了数据库，并学习了如何从数据库中存储、检索、更新和删除记录。我们还学习了如何创建 Django 模型并应用数据库迁移。\n\
  \n然而，仅靠这些数据库操作无法向用户显示应用程序的数据。我们需要一种以有意义的方式向用户显示所有存储信息的方法——例如，在浏览器中以可呈现的格式显示 Bookr\
  \ 应用程序数据库中存在的所有书籍。这就是 Django 视图、模板和 URL 映射发挥作用的地方。视图是 Django 应用程序的一部分，它接收 Web 请求并提供\
  \ Web 响应。例如，Web 请求可能是用户尝试通过输入网站地址来查看网站，而 Web 响应可能是网站的首页在用户浏览器中加载。视图是 Django 应用程序最重要的部分之一，其中编写应用程序逻辑。该应用程序逻辑控制与数据库的交互，例如从数据库中创建、读取、更新或删除记录。它还控制数据如何显示给用户。这是通过\
  \ Django HTML 模板实现的。\n\n本章向您介绍 Django 的三个核心概念：视图、模板和 URL 映射。您将首先探索 Django 中的两种主要视图类型：基于函数的视图和基于类的视图。接下来，您将学习\
  \ Django 模板语言和模板继承的基础知识。利用这些概念，您将创建一个页面来显示 Bookr 应用程序中所有书籍的列表。您还将创建另一个页面来显示书籍的详细信息、评论和评分。\n\
  \n在本章中，我们将研究以下主题：\n\n- 理解基于函数的视图\n- 理解基于类的视图\n- URL 配置\n- 使用 Django 模板\n- Django\
  \ 的模板语言\n\n通过使用和学习上述主题，到本章结束时，我们将实现一种列出所有书籍并在 Bookr 应用程序中显示任何给定书籍详情的方法。\n\nDjango\
  \ 视图可以大致分为两种类型：**基于函数的视图**和**基于类的视图**。在本章中，我们将更深入地了解 Django 中的基于函数的视图。\n\n> **注意**\n\
  > 基于类的视图是一个更高级的主题，将在 *第 11 章，高级模板和基于类的视图* 中详细讨论。\n\n## 技术要求\n\n本章的完整代码文件可以在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter03\
  \ 找到。\n\n### 理解基于函数的视图\n\n顾名思义，基于函数的视图以 Python 函数实现。为了理解它们的工作原理，请考虑以下片段，它展示了一个名为\
  \ home_page 的简单视图函数：\n\n```\nfrom django.http import HttpResponse\n\ndef home_page(request):\n\
  \    message = \"<html><h1>Welcome to my Website</h1></html>\"\n    return HttpResponse(message)\n\
  ```\n\n这里定义的视图函数 home_page 以请求对象作为参数，并返回一个 HttpResponse 对象，其中包含 Welcome to my Website\
  \ 消息。使用基于函数视图的优点是，由于它们以简单的 Python 函数实现，因此更容易学习，也更容易被其他程序员阅读。基于函数视图的主要缺点是代码无法重用，也无法像基于类的视图那样简洁地用于通用用例。下一节是对基于类视图的简要介绍。\n\
  \n### 理解基于类的视图\n\n顾名思义，基于类的视图以 Python 类实现。利用类继承的原则，这些类被实现为 Django 通用视图类的子类。与基于函数视图中所有视图逻辑都显式表达在函数中不同，Django\
  \ 的通用视图类带有各种预构建的属性和方法，可以提供编写简洁、可重用视图的捷径。此属性在 Web 开发期间经常派上用场；例如，开发人员经常需要渲染一个 HTML\
  \ 页面，而不需要从数据库插入任何数据，或针对用户的任何自定义。在这种情况下，可以简单地继承 Django 的 TemplateView，并指定 HTML 文件的路径。以下是一个基于类视图的示例，它可以显示与基于函数视图示例中相同的消息：\n\
  \n```\nfrom django.views.generic import TemplateView\n\nclass HomePage(TemplateView):\n\
  \    template_name = 'home_page.html'\n```\n\n在前面的代码片段中，HomePage 是一个基于类的视图，继承自 django.views.generic\
  \ 模块中的 Django TemplateView。template_name 类属性定义了在调用视图时要渲染的模板。对于模板，我们在 templates 文件夹中添加一个\
  \ HTML 文件，其内容如下：\n\n```\n<html><h1>Welcome to my Website</h1></html>\n```\n\n这是一个非常基本的基于类视图的示例，将在第\
  \ 11 章 高级模板和基于类视图 中进一步探讨。使用基于类视图的主要优点是，与基于函数视图相比，实现相同功能所需的代码行更少。此外，通过继承 Django 的通用视图，我们可以保持代码简洁并避免代码重复。然而，基于类视图的缺点是，对于刚接触\
  \ Django 的人来说，代码通常可读性较差，这意味着学习它通常是一个比基于函数视图更长期的过程。\n\n在下一节中，我们将学习 URL 配置。\n\n###\
  \ URL 配置\n\nDjango 视图无法单独在 Web 应用程序中工作。当向应用程序发出 Web 请求时，Django 的 URL 配置负责将请求路由到适当的视图函数来处理请求。Django\
  \ 中 urls.py 文件中的典型 URL 配置如下所示：\n\n```\nfrom . import views\n\nurlpatterns = [\n\
  \    path('url-path/', views.my_view, name='my-view'),\n]\n```\n\n这里，urlpatterns\
  \ 是定义 URL 路径列表的变量，而 'url-path/' 定义了要匹配的路径。\n\n\n\n\n在前面的代码片段中，我们首先从 `django.http`\
  \ 模块导入了 `HttpResponse` 类。接下来，我们定义了 `welcome_view` 函数，它可以在 Web 浏览器中显示 “Welcome to\
  \ Bookr!” 消息。`request` 对象是一个函数参数，承载着 HTTP 请求对象。下一行定义了 `message` 变量，其中包含显示标题的 HTML，随后一行统计数据库中可用的图书数量。\n\
  \n在最后一行，我们返回一个 `HttpResponse` 对象，其字符串与 `message` 变量相关联。当调用 `welcome_view` 视图函数时，它会在\
  \ Web 浏览器中显示 “Welcome to Bookr! 2 books and counting”。\n\n3. 现在，创建 URL 映射以调用新创建的视图函数。打开项目\
  \ URL 文件 `bookr/urls.py`，并添加 `urlpatterns` 列表，如下所示：\n\n```\nfrom django.contrib\
  \ import admin\nfrom django.urls import include, path\n\nurlpatterns = [\n    path('admin/',\
  \ admin.site.urls),\n    path('', include('reviews.urls'))\n]\n```\n\n`urlpatterns`\
  \ 列表中的第一行，即 `path('admin/', admin.site.urls)`，如果 URL 路径中包含 `admin/`（例如 `http://0.0.0.0:8000/admin`），则会路由到\
  \ admin URL。\n\n类似地，考虑第二行 `path('', include('reviews.urls'))`。这里提到的路径是空字符串 `''`。如果\
  \ URL 在 `http://hostname:port-number/` 之后没有任何特定路径（例如 `http://0.0.0.0:8000/`），则会包含\
  \ `review.urls` 中存在的 `urlpatterns`。\n\n`include` 函数是一个快捷方式，允许你组合 URL 配置。在 Django\
  \ 项目中，通常每个应用保留一个 URL 配置。这里，我们为 `reviews` 应用创建了一个单独的 URL 配置，并将其添加到项目级 URL 配置中。\n\n\
  4. 由于我们还没有 `reviews.urls` URL 模块，因此创建一个名为 `bookr/reviews/urls.py` 的文件，并添加以下代码行：\n\
  \n```\nfrom django.contrib import admin\nfrom django.urls import path\nfrom . import\
  \ views\n\nurlpatterns = [\n    path('', views.welcome_view,\n    name='welcome_view'),\n\
  ]\n```\n\n这里，我们再次对 URL 路径使用了空字符串。因此，当调用 `http://0.0.0:8000/` 时，在从 `bookr/urls.py`\
  \ 路由到 `bookr/reviews/urls.py` 之后，此模式会调用 `welcome_view` 视图函数。\n\n5. 在对这两个文件进行修改之后，我们已经准备好了调用\
  \ `welcome_view` 视图所需的 URL 配置。现在，使用 `./manage.py runserver` 启动 Django 服务器，并在 Web\
  \ 浏览器中输入 `http://0.0.0:8000` 或 `http://127.0.0.1:8000`。你应该能够看到 “Welcome to Bookr!”\
  \ 消息：\n\n![](img/4840a43efd335abd10b93708225692d6_151_0.png)\n\n图 3.1 – 在主页上显示 “Welcome\
  \ to Bookr!” 和图书数量\n\n注意\n如果没有 URL 匹配，Django 会调用错误处理，例如显示 “404 Page not found” 消息或类似内容。\n\
  \n在本练习中，我们学习了如何编写基本的视图函数并执行相关的 URL 映射。我们创建了一个网页，向用户显示一条简单的消息，并报告当前数据库中有多少本书。\n\n\
  然而，敏锐的读者会注意到，像前面的示例那样将 HTML 代码放在 Python 函数中看起来并不优雅。随着我们的视图越来越大，这变得更加不可持续。因此，在下一节中，我们将把注意力转向\
  \ HTML 代码应该所在的位置——模板内部。\n\n## 使用 Django 模板\n\n在练习 3.01 – 实现一个简单的基于函数的视图中，我们看到了如何创建视图、进行\
  \ URL 映射并在浏览器中显示消息。但如果你还记得，我们在视图函数本身中硬编码了 “Welcome to Bookr!” HTML 消息，并返回了一个 `HttpResponse`\
  \ 对象，如下所示：\n\n```\nmessage = f\"<html><h1>Welcome to Bookr!</h1> \"\n\"<p>{Book.objects.count()}\
  \ books and counting!</p></html>\"\nreturn HttpResponse(message)\n```\n\n在 Python\
  \ 模块中硬编码 HTML 并不是一个好习惯，因为随着要在网页上渲染的内容量增加，我们需要为其编写的 HTML 代码量也会增加。在 Python 代码中夹杂大量\
  \ HTML 代码会使代码难以阅读，并且从长远来看难以维护。\n\n因此，Django 模板为我们提供了一种更好的方式来编写和管理 HTML 模板。Django\
  \ 的模板不仅适用于静态 HTML 内容，也适用于动态 HTML 模板。\n\nDjango 的模板配置在 `settings.py` 文件中的 `TEMPLATES`\
  \ 变量中完成。默认配置如下所示：\n\n```\nTEMPLATES = [\n    {\n        'BACKEND':\n           \
  \ 'django.template.backends.django.DjangoTemplates',\n        'DIRS': [],\n    \
  \    'APP_DIRS': True,\n        'OPTIONS': {\n            'context_processors':\
  \ [\n                'django.template.context_processors.debug',\n             \
  \   'django.template.context_processors.request',\n                'django.contrib.auth.context_processors.auth',\n\
  \                'django.contrib.messages.context_processors.messages',\n      \
  \      ],\n        },\n    },\n]\n```\n\n让我们逐一了解前面代码片段中的每个关键字：\n\n- `'BACKEND':\
  \ 'django.template.backends.django.DjangoTemplates'`：这指的是要使用的模板引擎。模板引擎是 Django 用于处理\
  \ HTML 模板的 API。Django 内置了 Jinja2 和 DjangoTemplates 引擎。默认配置是 DjangoTemplates 引擎和\
  \ Django 模板语言。但是，如果需要，可以更改为其他引擎，例如 Jinja2 或任何其他第三方模板引擎。不过，对于我们的 Bookr 应用程序，我们将保持此配置不变。\n\
  - `'DIRS': []`：这指的是 Django 按给定顺序搜索模板的目录列表。\n- `'APP_DIRS': True`：这告诉 Django 模板引擎是否应该在\
  \ `settings.py` 文件的 `INSTALLED_APPS` 下定义的已安装应用中查找模板。此选项的默认值是 `True`。\n- `'OPTIONS'`：这是一个包含模板引擎特定设置的字典。在此字典中，有一个默认的上下文处理器列表，它帮助\
  \ Python 代码与模板交互，以创建和渲染动态 HTML 模板。\n\n当前的默认设置大多适合我们的目的。但是，在下一个练习中，我们将为模板创建一个新目录，并且需要指定此文件夹的位置。例如，如果我们有一个名为\
  \ `my_templates` 的目录，我们需要通过将其添加到 `TEMPLATES` 设置中来指定其位置，如下所示：\n\n```\nTEMPLATES =\
  \ [\n{\n    'BACKEND':\n        'django.template.backends.django.DjangoTemplates',\n\
  \    'DIRS': [os.path.join(BASE_DIR, 'my_templates')],\n    'APP_DIRS': True,\n\
  \    'OPTIONS': {\n        'context_processors': [\n            'django.template.context_processors.debug',\n\
  \            'django.template.context_processors.request',\n            'django.contrib.auth.context_processors.auth',\n\
  \            'django.contrib.messages.context_processors.messages',\n        ],\n\
  \    },\n},\n]\n```\n\n`BASE_DIR` 是项目文件夹的目录路径。这在 `settings.py` 文件中定义。`os.path.join()`\
  \ 方法将项目目录与模板目录连接起来，返回模板目录的完整路径。在接下来的练习中，我们将使用模板向用户显示消息。\n\n## 练习 3.02 – 使用模板显示问候消息\n\
  \n在本练习中，我们将创建第一个 Django 模板，并且就像在之前的练习中所做的那样，我们将使用模板显示 `Welcome to Bookr!` 消息。让我们开始执行这些步骤：\n\
  \n- 1. 在 `bookr` 项目目录中创建一个名为 `templates` 的目录，并在其中创建一个名为 `base.html` 的文件。目录结构应如下图所示：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_154_0.png)\n\n图 3.2 – bookr 的目录结构\n\n\
  > **注意**\n> \n> 使用默认配置时（即 `DIRS` 为空列表时），Django 只会搜索应用文件夹的 `templates` 目录中存在的模板（对于图书评论应用，即\
  \ `reviews/templates` 文件夹）。由于我们将新的模板目录放在了主项目目录中，因此除非在 `DIRS` 列表中包含该目录，否则 Django\
  \ 的模板引擎将无法找到它。\n\n- 2. 将该文件夹添加到 `TEMPLATES` 设置中：\n\n```\nTEMPLATES = [\n    {\n\
  \        'BACKEND':\n            'django.template.backends.django.DjangoTemplates',\n\
  \        'DIRS': os.path.join(BASE_DIR, 'my_templates'),\n        'APP_DIRS': True,\n\
  \        'OPTIONS': {\n            'context_processors': [\n                'django.template.context_processors.debug',\n\
  ```\n\n\n\n\n```\n'django.template.context_processors.request',\n'django.contrib.auth.context_processors.auth',\n\
  django.contrib.messages.context_processors\n    .messages',\n],\n},\n},\n]\n```\n\
  \n+   3. 将以下代码行添加到 `base.html` 文件中：\n\n```\n<!doctype html>\n<html lang=\"en\">\n\
  <head>\n    <meta charset=\"utf-8\">\n    <title>Home Page</title>\n</head>\n<body>\n\
  \    <h1>Welcome to Bookr!</h1>\n</body>\n</html>\n```\n\n这是一个简单的 HTML，用于在标题中显示“Welcome\
  \ to Bookr!”消息。\n\n+   4. 修改 `bookr/reviews/views.py` 内的代码，使其如下所示：\n\n```\nfrom\
  \ django.shortcuts import render\n\ndef welcome_view (request):\n    return render(request,\
  \ 'base.html')\n```\n\n由于我们已经在 TEMPLATES 配置中配置了 `'templates'` 目录，因此模板引擎可以使用 `base.html`。该代码使用从\
  \ `django.shortcuts` 模块导入的 render 方法来渲染 `base.html` 文件。\n\n+   5. 保存文件，运行 `./manage.py\
  \ runserver`，然后在浏览器中打开 http://0.0.0.8000/ 或 http://127.0.0.1:8000/ URL，以检查新添加的模板是否已在浏览器中加载：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_156_0.png)\n\n图 3.3 – 在首页显示“Welcome to\
  \ Bookr!”\n\n在本练习中，我们创建了一个 HTML 模板，并使用 Django 模板和视图返回了 `Welcome to Bookr!` 消息。\n\
  \n总的来说，Django 模板帮助我们处理 HTML 模板，并以所需格式向用户呈现信息。接下来，我们将学习 Django 模板语言，它可以与 HTML 模板一起用于渲染应用程序的数据。\n\
  \n## Django 模板语言\n\nDjango 模板不仅可以返回静态 HTML 模板，还可以在生成模板时添加动态应用程序数据。除了数据，我们还可以在模板中包含一些编程元素。所有这些共同构成了\
  \ Django 模板语言的基础。接下来的几节将介绍 Django 模板语言的一些基本部分，例如模板变量、模板标签、注释和过滤器。\n\n### 模板变量\n\n\
  模板变量用两个花括号表示，如下所示：\n\n```\n{{ variable }}\n```\n\n当模板中出现这个时，变量携带的值将被替换到模板中。模板变量有助于将应用程序的数据添加到模板中：\n\
  \n```\ntemplate_variable = \"I am a template variable.\"\n\n<body>\n    {{ template_variable\
  \ }}\n</body>\n```\n\n### 模板标签\n\n标签类似于程序化控制流，例如 if 条件或 for 循环。标签用两个花括号和百分号表示，如下所示。以下是一个使用模板标签遍历列表的\
  \ for 循环示例：\n\n```\n{% for element in element_list %}\n\n{% endfor %}\n```\n\n与\
  \ Python 编程不同，我们还需要通过添加结束标签（例如 `{% endfor %}`）来标记控制流的结束。这可以与模板变量一起使用，以显示列表中的元素，如下所示：\n\
  \n```\n<ul>\n    {% for element in element_list %}\n        <li>{{ element.title\
  \ }}</li>\n    {% endfor %}\n</ul>\n```\n\n### 注释\n\nDjango 模板语言中的注释可以如下编写；`{% comment\
  \ %}` 和 `{% endcomment %}` 之间的任何内容都将被注释掉：\n\n```\n{% comment %}\n    <p>This text\
  \ has been commented out</p>\n{% endcomment %}\n```\n\n### 过滤器\n\n过滤器可用于修改变量，使其以不同格式呈现。过滤器的语法是变量与过滤器名称之间用管道符（|）分隔：\n\
  \n```\n{{ variable|filter }}\n```\n\n以下是一些内置过滤器的示例：\n\n- {{ variable|lower }}：此过滤器将变量字符串转换为小写\n\
  - {{ variable|title }}：此过滤器将每个单词的首字母转换为大写\n\n让我们使用所学概念来开发图书评论应用程序。\n\nrender 函数接受三个参数：第一个是传入视图的\
  \ request 对象，第二个是 `books_list.html` HTML 模板，它将显示书籍列表，第三个是我们传递给模板的 context。\n\n由于我们已将\
  \ `book_list` 作为 context 的一部分传递，模板将使用它通过模板标签和模板变量来渲染书籍列表。\n\n3. 在路径 `bookr/reviews/templates/reviews/books_list.html`\
  \ 下创建 `book_list.html` 文件，并将以下 HTML 代码添加到该文件中：\n\n```\n<!doctype html>\n<html lang=\"\
  en\">\n<head>\n    <meta charset=\"utf-8\">\n    <title>Bookr</title>\n</head>\n\
  \    <body>\n        <h1>Book Review application</h1>\n        <hr>\n```\n\n你可以在\
  \ https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/blob/main/Chapter03/Exercise3.03/bookr/reviews/templates/reviews/book_list.html\
  \ 找到完整代码。\n\n这是一个简单的 HTML 模板，其中包含遍历 `book_list` 以显示书籍列表的模板标签和变量。\n\n4. 在 `bookr/reviews/urls.py`\
  \ 中，添加以下 URL 模式以调用 `books_list` 视图：\n\n```\nfrom django.urls import path\nfrom .\
  \ import views\n\nurlpatterns = [\n    path('books/', views.book_list,\n       \
  \ name='book_list'),\n]\n```\n\n这为 `books_list` 视图函数进行了 URL 映射。\n\n## 模板继承\n\n随着项目的构建，模板数量会增加。在设计应用程序时，很可能某些页面看起来相似，并且某些功能具有共同的\
  \ HTML 代码。使用模板继承，其他 HTML 文件可以继承共同的 HTML 代码。这类似于 Python 中的类继承，父类拥有所有公共代码，子类拥有子类需求所特有的额外部分。\n\
  \n例如，假设以下是一个名为 `base.html` 的父模板：\n\n```\n<!doctype html>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"utf-8\">\n<title>Hello World</title>\n</head>\n<body>\n<h1>Hello\
  \ World using Django templates!</h1>\n{% block content %}\n{% endblock %}\n</body>\n\
  </html>\n```\n\n以下是一个子模板的示例：\n\n```\n{% extends 'base.html' %}\n{% block content\
  \ %}\n<h1>How are you doing?</h1>\n{% endblock %}\n```\n\n在前面的代码片段中，`{% extends\
  \ 'base.html' %}` 行从父模板 `base.html` 扩展模板。从父模板扩展后，`block content` 之间的任何 HTML 代码都将与父模板一起显示。子模板渲染后，在浏览器中的效果如下：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_161_0.png)\n\n图 3.5 – 扩展 base.html 模板后显示问候消息\n\
  \n在下一节中，我们将使用 Bootstrap 进行一些模板样式设计。\n\n## 使用 Bootstrap 进行模板样式设计\n\n我们已经了解了如何使用视图、模板和\
  \ URL 映射来显示所有书籍。虽然我们能够在浏览器中显示所有信息，但如果我们能添加一些样式，让网页看起来更好，那就更好了。为此，我们可以添加一些 Bootstrap\
  \ 元素。Bootstrap 是一个开源层叠样式表（CSS）框架，特别适合设计可在桌面和移动浏览器上运行的响应式页面。\n\n使用 Bootstrap 很简单。首先，你需要将\
  \ Bootstrap CSS 添加到 HTML 中。你可以自己创建一个名为 `example.html` 的新文件进行实验。用以下代码填充它，并在浏览器中打开：\n\
  \n```\n<!doctype html>\n<html lang=\"en\">\n<head>\n<!-- Required meta tags -->\n\
  <meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1, shrink-to-fit=no\">\n\n<!-- Bootstrap CSS -->\n<link rel=\"stylesheet\"\
  \ href=\"https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css\"\
  \ integrity=\"sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9M uhOf23Q9Ifjh\"\
  \ crossorigin=\"anonymous\">\n</head>\n<body>\nContent goes here\n</body>\n</html>\n\
  ```\n\n前面代码中的 Bootstrap CSS 链接会将 Bootstrap CSS 库添加到你的页面。这意味着某些 HTML 元素类型和类将从 Bootstrap\
  \ 继承其样式。例如，如果你将 `btn-primary` 类添加到按钮的 class 中，按钮将以蓝底白字的形式呈现。\n\n\n\n\n\n尝试在 `<body>`\
  \ 和 `</body>` 之间添加以下内容：\n\n```\n<h1>Welcome to my Site</h1>\n<button type=\"button\"\
  \ class=\"btn btn-primary\">\n  Checkout my Blog!</button>\n```\n\n你会看到标题和按钮都得到了很好的样式，使用的是\
  \ Bootstrap 的默认样式：\n\n![](img/4840a43efd335abd10b93708225692d6_163_0.png)\n\n图 3.6\
  \ – 应用 Bootstrap 后的显示效果\n\n这是因为在 Bootstrap CSS 代码中，它使用以下代码指定了 btn-primary 类的颜色：\n\
  \n```\n.btn-primary {\n  color: #fff;\n  background-color: #007bff;\n  border-color:\
  \ #007bff\n}\n```\n\n你可以看到，使用 Bootstrap 等第三方 CSS 库可以让你快速创建样式精美的组件，而无需编写太多 CSS。接下来，我们将使用基础模板的模板继承，并添加一些样式元素，例如导航栏。\n\
  \n> **注意**\n> 我们建议你通过以下教程进一步探索 Bootstrap：\n> https://getbootstrap.com/docs/4.4/getting-started/introduction/。\n\
  \n## 练习 3.04 – 添加模板继承和 Bootstrap 导航栏\n\n在本练习中，我们将使用模板继承从基础模板继承模板元素并在 book_list 模板中重用它们以显示书籍列表。我们还将在\
  \ base HTML 文件中使用 Bootstrap 的某些元素，在页面顶部添加导航栏。base.html 的 bootstrap 代码取自 https://getbootstrap.com/docs/4.4/getting-started/introduction/\
  \ 和 https://getbootstrap.com/docs/4.4/components/navbar/。让我们开始以下步骤：\n\n- 1. 打开位于\
  \ bookr/templates/base.html 的 base.html 文件。删除任何现有代码并替换为以下代码：\n\n```\n<!doctype html>\n\
  {% load static %}\n<html lang=\"en\">\n<head>\n    <!-- Required meta tags -->\n\
  \    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1, shrink-to-fit=no\">\n    <!-- Bootstrap CSS -->\n```\n\n你可以在\
  \ https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/blob/main/Chapter03/Exercise3.04/bookr/reviews/templates/reviews/base.html\
  \ 查看此文件的完整代码。\n\n这是一个包含所有 Bootstrap 样式元素和导航栏的 base.html 文件。\n\n- 2. 接下来，打开模板 bookr/reviews/templates/reviews/books_list.html，删除所有现有代码，并替换为以下代码：\n\
  \n```\n{% extends 'base.html' %}\n\n{% block content %}\n<ul class=\"list-group\"\
  >\n    {% for item in book_list %}\n    <li class=\"list-group-item\">\n       \
  \ <span class=\"text-info\">Title: </span> <span>{{ item.book.title }}</span>\n\
  \        <br>\n        <span class=\"text-info\">Publisher: </span><span>{{ item.book.publisher\
  \ }}</span>\n```\n\n你可以在 `https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/blob/main/Chapter03/Exercise3.04/bookr/reviews/templates/reviews/book_list.html`\
  \ 查看此文件的完整代码。\n\n此模板已配置为继承 `base.html` 文件，并且还添加了一些样式元素以显示书籍列表。模板中帮助继承 `base.html`\
  \ 文件的部分如下：\n\n```\n```django\n{% extends 'base.html' %}\n\n{% block content %}\n\
  {% endblock %}\n```\n```\n\n- 3. 添加两个新模板后，在你的网络浏览器中打开其中一个 URL（`http://0.0.0.0:8000/books/`\
  \ 或 `http://127.0.0.1:8000/books/`）以查看书籍列表页面，现在应该格式整齐：\n\n![](img/4840a43efd335abd10b93708225692d6_165_0.png)\n\
  \n图 3.7 – 格式整齐的书籍列表页面\n\n在本练习中，我们使用 Bootstrap 为应用程序添加了一些样式，并且在显示书籍评论应用程序中的书籍列表时使用了模板继承。到目前为止，我们一直在大量处理显示应用程序中存在的全部书籍。在下一个活动中，你将显示单个书籍的详细信息和评论。\n\
  \n## 活动 3.01 – 实现书籍详情视图\n\n在此活动中，你将实现一个新的视图、模板和 URL 映射，以显示书籍的以下详细信息：标题、出版商、出版日期和总体评分。此外，页面还应显示所有评论评论，指定评论者的姓名以及评论的撰写日期和（如果适用）修改日期。以下步骤将帮助你完成此活动：\n\
  \n- 1. 创建一个书籍详情端点，扩展基础模板。\n- 2. 创建一个书籍详情视图，该视图将特定书籍的主键作为参数，并返回一个列出书籍详细信息和任何相关评论的\
  \ HTML 页面。\n- 3. 在 `urls.py` 中进行所需的 URL 映射。书籍详情视图 URL 应为 `http://0.0.0.0:8000/books/1/`（其中\
  \ 1 代表正在访问的书籍的 ID）。你可以使用 `get_object_or_404` 方法检索具有给定主键的书籍。\n\n> **注意**\n> \n> `get_object_or_404`\
  \ 函数是根据主键检索实例的有用快捷方式。你也可以使用 *第 2 章，模型和迁移* 中描述的 `.get()` 方法来执行此操作：`Book.objects.get(pk=pk)`。然而，`get_object_or_404`\
  \ 的额外优势在于，如果对象不存在，它会返回 HTTP `404 Not Found` 响应。如果我们只是使用 `get()`，并且有人尝试访问不存在的对象，我们的\
  \ Python 代码将遇到异常并返回 HTTP `500 Server Error` 响应。这是不希望的，因为它看起来像是我们的服务器未能正确处理请求。\n\n\
  - 4. 活动结束时，你应该能够点击书籍列表页面上的 **Reviews** 按钮并获取书籍的详细视图。详细视图应显示所有详细信息，如以下屏幕截图所示：\n\n\
  ![](img/4840a43efd335abd10b93708225692d6_167_0.png)\n\n# 图 3.8 – 显示书籍详情的页面\n\n#\
  \ 注意\n\n此活动的解决方案可以在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions\
  \ 上找到。\n\n在模板部分，我们学习了如何使用 Django 模板向用户展示静态信息，使用模板语言显示应用程序的动态数据，以及使用 Bootstrap 为信息添加样式，使其对用户更具可读性。\n\
  \n## 总结\n\n本章介绍了处理网站 HTTP 请求所需的核心基础设施。请求首先通过 URL 模式映射到适当的视图。URL 中的参数也会传递给视图，以指定页面上显示的对象。视图负责编译要在网站上显示的任何必要信息，然后将此字典传递给模板，模板将其渲染为\
  \ HTML 代码，可作为响应返回给用户。我们介绍了基于类和基于函数的视图，并学习了 Django 模板语言和模板继承。我们为书籍评论应用程序创建了两个新页面，一个显示存在的全部书籍，另一个是书籍详情视图页面。在下一章中，我们将学习\
  \ Django 管理员和超级用户、注册模型，以及使用管理站点执行 **创建、读取、更新和删除（CRUD）** 操作。\n"
- "## Django 管理员简介\n\n本章向你介绍 Django 管理应用程序的基本功能。你将首先为 Bookr 应用程序创建超级用户帐户，然后继续使用管理应用程序执行\
  \ **创建、读取、更新和删除（CRUD）** 操作。你将学习如何将 Django 应用程序与管理应用程序集成，并查看 `ForeignKey` 在管理应用程序中的行为。在本章结束时，你将看到如何通过子类化\
  \ `AdminSite` 和 `ModelAdmin` 类，根据独特的一组偏好来自定义管理应用程序，使其界面更直观、更用户友好。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 创建超级用户帐户\n- 使用 Django 管理应用程序进行 CRUD 操作\n- 管理 Django 用户和组\n- 在管理应用程序中注册模型\n-\
  \ 自定义管理界面\n\n到本章结束时，你将能够执行以下操作：\n\n- 创建管理员帐户\n- 创建用户帐户和组，并分配权限\n- 将你的模型与管理应用程序注册\n\
  - 自定义管理应用程序的全局属性\n- 自定义管理模型更改列表页面和表单的功能\n\n\n\n在开发应用时，通常需要填充数据然后修改这些数据。我们已经在第 2\
  \ 章《模型和迁移》中看到，如何在命令行中使用 Python manage.py shell 来完成此操作。在第 3 章《URL 映射、视图和模板》中，我们学习了如何使用\
  \ Django 的视图和模板为我们的模型开发 Web 表单界面。但这两种方法都不适合管理 reviews/models.py 中的类数据。使用 shell 管理数据对非程序员来说过于技术化，而构建单独的网页将是一个繁琐的过程，因为这会让我们为模型中的每个表重复相同的视图逻辑和非常相似的模板功能。幸运的是，这个问题的解决方案在\
  \ Django 早期开发阶段就被设计出来了。\n\nDjango 管理站点实际上是以 Django 应用的形式编写的。它提供了一个直观呈现的 Web 界面，用于对模型数据进行管理访问。管理界面设计用于网站管理员使用。它并非\
  \ intended 用于与站点交互的非特权用户。在我们这种图书评论系统的情况下，普通图书评论者永远不会遇到管理应用。他们会看到我们使用第 3 章《URL 映射、视图和模板》中的视图和模板构建的应用页面，并在页面上撰写评论。\n\
  \n此外，虽然开发者花费大量精力为普通用户创建简单且引人入胜的 Web 界面，但面向管理用户的管理界面保持了实用主义的感觉，通常会显示模型的复杂性。它可能逃过了你的注意，但你的\
  \ Bookr 项目中已经有一个管理应用。查看 bookr/settings.py 中的已安装应用列表：\n\n```\nINSTALLED_APPS = [\n\
  \    'django.contrib.admin',\n    ...\n]\n```\n\n现在，查看 bookr/urls.py 中的 URL 模式：\n\
  \n```\nurlpatterns = [\n    path('admin/', admin.site.urls),\n    ...\n]\n```\n\n\
  如果我们将此路径放入浏览器中，我们可以看到在开发服务器上管理应用的链接是 http://127.0.0.1:8000/admin/。不过，在使用它之前，我们需要通过命令行创建一个超级用户。\n\
  \n## 技术要求\n\n本章的完整代码文件可以在 https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/Chapter04/\
  \ 找到。\n\n## 创建超级用户账户\n\n我们的 Bookr 应用刚刚找到了一位新用户。她的名字是 Alice，她想立即开始添加她的评论。Bob 已经在使用\
  \ Bookr，他刚刚通知我们他的个人资料似乎不完整，需要更新。David 不再想使用该应用，想要删除他的账户。出于安全原因，我们不希望任何用户都能为我们执行这些任务。这就是为什么我们需要创建一个具有提升权限的超级用户。让我们从现在就开始做这件事。\n\
  \n在 Django 的授权模型中，超级用户是指 Staff 属性已设置的账户。我们将在本章后面检查这一点，并在第 9 章《会话和身份验证》中更深入地了解此授权模型。\n\
  \n我们可以通过使用我们在前几章中探索过的 manage.py 脚本来创建超级用户。再次强调，我们在输入命令时需要位于项目目录中。我们将使用 createsuperuser\
  \ 子命令，通过在命令行中输入以下命令（如果你使用的是 Windows，你需要输入 python 或 py 而不是 python3）：\n\n```\npython3\
  \ manage.py createsuperuser\n```\n\n> **注意**\n> 在本章中，我们将使用属于 example.com 域的电子邮件地址。这遵循了使用此保留域进行测试和文档的既定惯例。如果你愿意，也可以使用自己的电子邮件地址。\n\
  \n让我们继续创建我们的超级用户。\n\n### 练习 4.01 – 创建超级用户账户\n\n在本练习中，你将创建一个超级用户账户，让用户可以登录到管理站点。此功能也将在即将进行的练习中用于实现只有超级用户才能执行的操作。以下步骤将帮助你完成此练习：\n\
  \n- 1. 输入以下命令创建超级用户：\n\n```\npython manage.py createsuperuser\n```\n\n执行上述命令后，你将被提示创建超级用户。此命令会提示你输入超级用户名、可选的电子邮件地址和密码。\n\
  \n- 2. 按如下方式添加超级用户的用户名和电子邮件。这里，我们在提示符下输入 `bookradmin`（已高亮）并按 *Enter* 键。同样，在下一个提示符，即要求你输入电子邮件地址时，你可以添加\
  \ `bookradmin@example.com`（已高亮）。按 *Enter* 键继续：\n\n```\nUsername (leave blank to\
  \ use 'django'): bookradmin\nEmail address: bookradmin@example.com\nPassword:\n\
  ```\n\n这将把名称 `bookradmin` 分配给超级用户。请注意，你不会立即看到任何输出。\n\n- 3. shell 中的下一个提示是密码。添加一个强密码并按\
  \ *Enter* 键再次确认：\n\n```\nPassword:\nPassword (again):\n```\n\n你应该在屏幕上看到以下消息：\n\n\
  ```\nSuperuser created successfully.\n```\n\n请注意，密码会根据以下标准进行验证：\n\n- 它不能是 20,000\
  \ 个最常见密码之一\n- 它应至少有八个字符\n- 它不能仅为数字字符\n- 它不能从用户名、名字、姓氏或用户电子邮件地址派生\n\n至此，你已创建了一个名为\
  \ `bookradmin` 的超级用户，可以登录到管理应用。以下屏幕截图显示了 shell 中的外观：\n\n![](img/4840a43efd335abd10b93708225692d6_172_0.png)\n\
  \n- 4. 访问 `http://127.0.0.1:8000/admin` 上的管理应用并使用你创建的超级用户账户登录：\n\n![](img/4840a43efd335abd10b93708225692d6_173_0.png)\n\
  \n图 4.2 – Django 管理登录表单\n\n在本练习中，你创建了一个超级用户账户，我们将在本章剩余部分使用它根据需要分配或移除权限。\n\n创建了超级用户账户后，我们现在能够登录到\
  \ Django 管理应用并了解它提供的 CRUD 功能。\n\n## 使用 Django 管理应用进行 CRUD 操作\n\n让我们回到 Bob、Alice\
  \ 和 David 的请求。作为超级用户，你的任务将涉及创建、更新、检索和删除各种用户账户、评论和书名。这组活动统称为 CRUD。CRUD 操作是管理应用行为的核心。事实证明，管理应用已经知道来自另一个\
  \ Django 应用《身份验证和授权》的模型——在 INSTALLED_APPS 中引用为 'django.contrib.auth'。登录 http://127.0.0.1:8000/admin/\
  \ 时，我们会看到来自授权应用的模型，如图 4.3 所示：\n\n![](img/4840a43efd335abd10b93708225692d6_173_1.png)\n\
  \n图 4.3 – Django 管理窗口\n\n当管理应用初始化时，它会调用其 autodiscover() 方法来检测是否有其他已安装的应用包含 admin\
  \ 模块。如果有，这些 admin 模型将被导入。在我们的例子中，它已发现 'django.contrib.auth.admin'。现在模块已导入，我们的超级用户账户也已准备就绪，让我们开始处理\
  \ Bob、Alice 和 David 的请求。\n\n### 创建\n\n在 Alice 开始撰写评论之前，我们需要通过管理应用为她创建一个账户。完成后，我们可以查看可以分配给她的管理访问级别。要创建用户，我们需要点击\
  \ Users 旁边的 + Add 选项（参见图 4.3），并填写表单，如图 4.4 所示。\n\n> **注意**\n> 我们不希望任何随机用户能够访问 Bookr\
  \ 用户的账户。因此，选择强而安全的密码至关重要。\n\n![](img/4840a43efd335abd10b93708225692d6_174_0.png)\n\
  \n图 4.4 – 添加用户页面\n\n表单底部有三个按钮：\n\n- **保存并添加另一个**：这会创建用户并再次呈现相同的添加用户页面，字段为空。\n- **保存并继续编辑**：这会创建用户并加载更改用户页面。更改用户页面让你添加在添加用户页面上不存在的额外信息，\n\
  \n\nsuch as **名字**、**姓氏**以及更多（参见 *图4.5*）。请注意，**密码**在表单上没有可编辑字段。相反，它显示有关密码存储所用哈希技术的信息，此外还有一个指向单独的*更改密码*表单的链接：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_175_0.png)\n\n图4.5 – 点击“保存并继续编辑”后显示的“更改用户”页面\n\
  \n- **保存**：这将创建用户，并让用户导航到**选择要更改的用户**列表页面，如*图4.6*所示。\n\n## 活动 4.01 – 创建用户账户\n\n\
  我们现在已经了解了如何通过 Django 管理界面创建用户账户。\n\n是时候将所学知识付诸实践了：使用电子邮件地址 `david.green@example.com`\
  \ 为新用户 David Green 创建一个账户。\n\n与 Alice White 的账户一样，只需将此账户设为活跃用户，不要勾选**员工状态**或**超级用户状态**复选框。\n\
  \n> **注意**\n> \n> 本活动的解决方案可在 `https://github.com/PacktPublishing/Web-Development-with-Django-Second-Edition/tree/main/ActivitySolutions`\
  \ 中找到。\n\n现在你已经通过 Django 管理界面创建了用户，我们可以研究其余三个 CRUD 操作——检索、更新和删除。\n\n## 检索\n\n管理任务需要分配给一些用户，为此，管理员（拥有超级用户账户的人）希望查看那些电子邮件地址以\
  \ `n@example.com` 结尾的用户，并将任务分配给这些用户。这正是**检索**功能派上用场的地方。在“添加用户”页面上点击**保存**按钮后（参见\
  \ *图4.4*），我们会进入**选择要更改的用户**列表页面（如 *图4.6* 所示），该页面执行检索操作。请注意，在**选择要更改的用户**列表页面上，也可以通过点击**添加用户\
  \ +**按钮访问**创建**表单。因此，在我们添加了几个用户之后，更改列表将如下所示：\n\n![](img/4840a43efd335abd10b93708225692d6_176_0.png)\n\
  \n页面顶部有一个搜索栏，用于搜索用户名、电子邮件地址以及用户的名字和姓氏等内容。右侧是一个筛选面板，可根据“按员工状态”、“按超级用户状态”和“按活跃”的值缩小选择范围。在图4.7中，你可以看到我们搜索字符串\
  \ n@example.com 时发生的情况。这将只返回那些电子邮件地址由以 n 结尾的用户名和以 example.com 开头的域名组成的用户的姓名。我们只能看到三个电子邮件地址符合此要求的用户——bookradmin@example.com、carol.brown@example.com\
  \ 和 david.green@example.com：\n\n![](img/4840a43efd335abd10b93708225692d6_177_0.png)\n\
  \n图4.7 – 按电子邮件地址的一部分搜索用户\n\n检索功能（如列表页面和搜索栏）允许我们获取用于更新和删除操作的记录。\n\n## 更新\n\n请记住，Bob\
  \ 想要更新他的个人资料。让我们通过点击**选择要更改的用户**列表中的 **bob** 用户名链接来**更新** Bob 未完成的个人资料：\n\n![](img/4840a43efd335abd10b93708225692d6_178_0.png)\n\
  \n图4.8 – 从“选择要更改的用户”列表中选择 bob\n\n这将带我们返回**更改用户**表单，在其中可以输入**名字**、**姓氏**和**电子邮件地址**的值：\n\
  \n## Django 管理\n\n欢迎，BOOKRADMIN 查看站点 / 更改密码 / 注销\n\n首页 › 身份验证和授权 › 用户 › bob\n\n\
  # 更改用户\n\n用户名：\n\nbob\n\n必填。150 个字符或更少。仅限字母、数字和 @/./+/-/_。\n\n密码：\n\n算法：pbkdf2_sha256\
  \ 迭代次数：180000 盐值：uC20bk***** 哈希：4vVTw**********\n\n原始密码不会被存储，因此无法查看此用户的密码，但你可以通过此表单更改密码。\n\
  \n# 个人信息\n\n名字：\n\nBob\n\n姓氏：\n\nBlack\n\n电子邮件地址：\n\nbob.black@example.com\n\n图4.9\
  \ – 添加个人信息\n\n从图4.9可以看出，我们在此添加关于 Bob 的个人信息——具体来说，是他的名字、姓氏和电子邮件地址。\n\n另一种类型的更新操作是“软删除”。Active\
  \ 布尔属性允许我们停用用户，而不是删除整个记录并丢失所有依赖该账户的数据。这种使用布尔标志将记录标记为不活动或已删除（并随后在查询中过滤掉这些标记记录）的做法被称为软删除。类似地，我们可以通过勾选相应的复选框，将用户升级为员工状态或超级用户状态：\n\
  \n## 权限\n\nActive\n指定是否应将此用户视为活跃。取消勾选此项而不是删除账户。\n\n员工状态\n指定用户是否可以登录此管理站点。\n\n超级用户状态\n\
  指定此用户拥有所有权限，而无需显式分配。\n\n图4.10 – Active、员工状态和超级用户状态布尔字段\n\n## 删除\n\nDavid 不再想使用 Bookr\
  \ 应用程序，并已请求我们删除他的账户。auth 管理后台也支持这一点。在“选择要更改的用户”列表页面上选择一个用户或用户记录，然后从“操作”下拉菜单中选择“删除选定的用户”选项。然后，点击“执行”按钮（图4.11）：\n\
  \n![](img/4840a43efd335abd10b93708225692d6_180_0.png)\n\n图4.11 – 从“选择要更改的用户”列表页面删除\n\
  \n系统将显示一个确认屏幕，一旦你删除了该对象，系统将带你返回“选择要更改的用户”列表：\n\n![](img/4840a43efd335abd10b93708225692d6_181_0.png)\n\
  \n图4.12 – 用户删除确认\n\n用户被删除后，你将看到以下消息：\n\n![](img/4840a43efd335abd10b93708225692d6_181_1.png)\n\
  \n图4.13 – 用户删除通知\n\n完成确认后，你会发现 David 的账户不再存在。\n\n到目前为止，我们已经学习了如何添加新用户、获取其他用户的详细信息、修改用户数据以及删除用户。这些技能帮助我们满足了\
  \ Alice、Bob 和 David 的请求。随着我们应用的用户数量增长，处理数百名用户的请求最终将变得相当困难。解决这个问题的一个方法是将部分管理职责委托给一组选定的用户。我们将在接下来的章节中学习如何做到这一点。\n\
  \n## 管理 Django 用户和组\n\nDjango 的身份验证模型由用户、组和权限组成。用户可以属于多个组，这是一种对用户进行分类的方式。它还通过允许将权限分配给用户集合以及单个用户，简化了权限的实现。\n\
  \n在练习 4.01（创建超级用户账户）中，我们了解了如何满足 Alice、David 和 Bob 对其个人资料进行修改的请求。这非常容易做到，而且我们的应用程序似乎完全有能力处理他们的请求。\n\
  \n当用户数量增长时会发生什么？管理员用户能同时管理 100 或 150 个用户吗？可以想象，这可能是一项相当复杂的任务。为了克服这一点，我们可以为一组特定用户提供更高的权限，他们可以帮助减轻管理员的任务。这正是组派上用场的地方。虽然我们将在\
  \ *第9章，会话与身份验证* 中了解更多关于用户、组和权限的内容，但我们可以通过创建一个**帮助台用户组**来开始理解组及其功能，该组包含可以访问管理界面但缺乏许多强大功能的账户，例如添加、编辑或删除组，或添加或删除用户的能力。\n\
  \n## 练习 4.02 – 通过管理应用添加和修改用户和组\n\n在本练习中，我们将向我们的一位 Bookr 用户 Carol 授予一定级别的管理访问权限。首先，我们将定义组的访问级别，然后将\
  \ Carol 添加到该组。这将允许 Carol 更新用户个人资料并检查用户日志。以下步骤将帮助你完成本练习：\n\n- 1. 访问 `http://127.0.0.1:8000/admin/`\
  \ 上的管理界面，并使用通过超级用户命令设置的账户以 bookradmin 身份登录。\n- 2. 在管理界面中，依次点击链接**首页 | 身份验证和授权 |\
  \ 组**：\n\n![](img/4840a43efd335abd10b93708225692d6_182_0.png)\n\n图4.14 – “身份验证和授权”页面上的“组”和“用户”选项\n\
  \n\n\n\n3. 在右上角使用 ADD GROUP + 添加一个新组：\n\n![](img/4840a43efd335abd10b93708225692d6_183_0.png)\n\
  \n图 4.15 – 添加一个新组\n\n4. 将组命名为 Help Desk User 并赋予以下权限，如图 4.16 所示：\n\n- Can view log\
  \ entry\n- Can view permission\n- Can change user\n- Can view user\n\n![](img/4840a43efd335abd10b93708225692d6_183_1.png)\n\
  \n图 4.16 – 选择权限\n\n5. 现在，导航到 Home | AUTHENTICATION AND AUTHORIZATION | Users 并点击名字为\
  \ carol 的用户的链接：\n\nSelect user to change\n\n图 4.19 – 点击用户名 carol\n\n6. 滚动到 Permissions\
  \ 字段集并选中 Staff status 复选框。这是 Carol 能够登录到 admin 应用所必需的：\n\n图 4.20 – 点击 Staff status\
  \ 复选框\n\n7. 通过从 **Available groups** 选择框中选中它（参考图 4.20）并点击右箭头将其移入她的 **Chosen groups**\
  \ 列表中，如图 4.21 所示，将 Carol 添加到我们在之前步骤中创建的 **Help Desk User** 组中。注意，除非你这样做，否则 Carol\
  \ 将无法使用她的凭据登录到 admin 界面：\n\n![](img/4840a43efd335abd10b93708225692d6_186_0.png)\n\
  \n图 4.21 – 将 Help Desk User 组移入 Carol 的 Chosen groups 列表中\n\n8. 让我们测试一下到目前为止我们所做的工作是否产生了正确的结果。为此，退出\
  \ admin 站点然后再次以 Carol 的身份登录。退出后，你应该在屏幕上看到以下内容：\n\n![](img/4840a43efd335abd10b93708225692d6_186_1.png)\n\
  \n图 4.22 – 已退出屏幕\n\n**Note**\n如果你不记得最初给她设置的密码，可以通过在命令行中输入 `python3 manage.py changepassword\
  \ carol` 来更改密码。\n\n成功登录后，在 admin 仪表板上，你可以看到没有指向 Groups 的链接：\n\n![](img/4840a43efd335abd10b93708225692d6_187_0.png)\n\
  \n图 4.23 – admin 仪表板\n\n由于我们没有为 Help Desk User 组分配任何组权限，甚至没有分配 auth | group | Can\
  \ view group，当 Carol 登录时，她无法访问 Groups 管理界面。同样，当你导航到 Home | AUTHENTICATION AND AUTHORIZATION\
  \ | Users 并点击一个用户链接时，你会看到没有编辑或删除用户的选项。这是因为授予了 Help Desk User 组的权限，而 Carol 是该组成员。组成员可以查看和编辑用户，但不能添加或删除任何用户。\n\
  \n在本练习中，我们学习了如何向 Django 应用的用户授予一定程度的管理权限。\n\n现在我们已经了解了 admin 应用如何与 AUTHENTICATION\
  \ AND AUTHORIZATION 模型中的 Users 和 Groups 协同工作，我们可以将注意力转向在 reviews 应用中注册我们开发的模型。\n\
  \n## Registering models with the admin app\n\nDjango admin 应用会根据模型的特点，以最少的代码量为 Django\
  \ 对象生成可用的 CRUD 界面。在本节中，我们将首先了解如何将模型注册到 admin 应用，以及界面元素（如更改列表和更改页面）是如何从模型属性派生的。我们将以一个重要的练习结束，该练习演示了模型中外键设置如何决定对象删除过程的行为。\n\
  \n## Registering the reviews model\n\n假设 Carol 被要求改进 Bookr 中的 **Reviews** 部分；也就是说，只有最相关和最全面的评论才应显示，重复或垃圾条目应被删除。为此，她需要访问\
  \ `reviews` 模型。正如我们在之前对组和用户的调查中所看到的，admin 应用已经包含 Authentication and Authorization\
  \ 应用模型的 admin 页面，但它尚未引用我们 Reviews 应用中的模型。为了使 admin 应用感知到这些模型，我们需要显式地将它们注册到 admin\
  \ 应用。幸运的是，我们不需要修改 admin 应用的代码来做到这一点，因为我们可以在项目中导入 admin 应用并使用其 API 来注册我们的模型。这已经在\
  \ Authentication and Authorization 应用中完成了，所以让我们在 Reviews 应用中尝试一下。我们的目标是能够使用 admin\
  \ 应用编辑我们 `reviews` 模型中的数据。\n\n查看 `reviews/admin.py` 文件。它是一个占位符文件，是使用我们在 *Chapter\
  \ 1, An Introduction to Django* 中使用的 `startapp` 子命令生成的，目前包含以下行：\n\n```\nfrom django.contrib\
  \ import admin\n\n# Register your models here.\n```\n\n现在我们可以尝试扩展它。为了使 admin 应用感知到我们的模型，我们可以修改\
  \ `reviews/admin.py` 文件并导入模型。然后我们可以使用 `AdminSite` 对象 `admin.site` 将模型注册。`AdminSite`\
  \ 对象包含 Django admin 应用的实例（稍后，我们将学习如何子类化这个 `AdminSite` 并覆盖其许多属性）。然后，`reviews/admin.py`\
  \ 将如下所示：\n\n```\nfrom django.contrib import admin\nfrom reviews.models import (Publisher,\
  \ Contributor,\n                            Book, BookContributor, Review)\n\n#\
  \ Register your models here.\nadmin.site.register(Publisher)\nadmin.site.register(Contributor)\n\
  admin.site.register(Book)\nadmin.site.register(BookContributor)\nadmin.site.register(Review)\n\
  ```\n\n`admin.site.register` 方法通过将其添加到 `admin.site._registry` 中包含的类注册表中，使模型可供 admin\
  \ 应用使用。如果我们选择不通过 admin 界面使模型可访问，我们只需不注册它。当你在浏览器中重新加载 http://127.0.0.1:8000/admin/\
  \ 时，你将在 admin 应用登陆页面上看到以下内容：\n\n## Site administration\n\n![](img/4840a43efd335abd10b93708225692d6_189_0.png)\n\
  \n图 4.24 – Admin 应用登陆页面\n\n注意在导入 reviews 模型后 admin 页面外观的变化。\n\n将 Reviews 应用的五个模型注册到\
  \ admin 应用后，我们可以检查它为我们创建的一些默认界面。\n\n## Change lists\n\n我们现在有了模型的更改列表。如果我们点击 Publishers\
  \ 链接，我们将被带到 http://127.0.0.1:8000/admin/reviews/publisher 并看到包含指向出版商的链接的更改列表。这些链接由\
  \ Publisher 对象的 id 字段指定。如果你的数据库已使用第 3 章 URL Mapping, Views, and Templates 中的脚本填充，你将看到包含七个出版商的列表，如图\
  \ 4.25 所示。\n\n> **Note**\n> 根据你的数据库状态和已完成的活动，这些示例中的对象 ID、URL 和链接的编号可能与此处列出的不同。\n\
