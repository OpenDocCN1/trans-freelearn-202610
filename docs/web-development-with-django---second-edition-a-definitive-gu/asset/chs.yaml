  \n图 16.18 – 书籍 fetch 完成\n\n这个练习是整合 React 与你在 *第 12 章，构建 REST API* 中构建的 Django REST\
  \ API 的机会。我们构建了一个新的组件（`BookDisplay`），并调用了 `fetch` 来获取书籍列表。我们使用 JavaScript `map`\
  \ 方法将书籍数组转换为一些 `<li>` 元素。如前所述，我们使用 `button` 在点击时触发 `fetch`。然后我们在 Django 模板中向 React\
  \ 组件提供了书籍列表 API URL。后来，我们在 Bookr 中看到了使用 REST API 动态加载的书籍列表。\n\n在进入本章的活动之前，我们将讨论在使用\
  \ Django 时针对其他 JavaScript 框架的一些考虑因素。\n\n## verbatim 模板标签\n\n我们已经看到在使用 React 时，可以在\
  \ Django 模板中使用 JSX 插值值。这是因为 JSX 使用单大括号来插值值，而 Django 使用双大括号。只要 JSX 和 Django 大括号之间有空格，就应该可以正常工作。\n\
  \n其他框架，如 Vue，也使用双大括号进行变量插值。这意味着如果你在模板中有 Vue 组件的 HTML，你可能会尝试像这样插值一个值：\n\n```\n<h1>Hello,\
  \ {{ name }}!</h1>\n```\n\n当然，当 Django 渲染模板时，它会在 Vue 框架有机会渲染之前插值 name 值。\n\n我们可以使用\
  \ verbatim 模板标签让 Django 按原样输出模板中的数据，而不执行任何渲染或变量插值。使用它与前面的示例一起非常简单，如下所示：\n\n```\n\
  {% verbatim %}\n<h1>Hello, {{ name }}!</h1>\n{% endverbatim %}\n```\n\n现在当 Django\
  \ 渲染模板时，模板标签之间的 HTML 将按原样输出，允许 Vue（或其他框架）接管并自行插值变量。许多其他框架将其模板分离到自己的文件中，这不应与 Django\
  \ 的模板冲突。\n\n有许多 JavaScript 框架可用，你最终决定使用哪一个将取决于你自己的意见或你的公司/团队使用的框架。如果你确实遇到冲突，解决方案将取决于你的特定框架。本节中的示例应该能帮助你找到正确的方向。\n\
  \n我们现在已经涵盖了将 React（或其他 JavaScript 框架）与 Django 集成所需的大部分内容。在下一个活动中，你将实现这些学习成果来获取 Bookr\
  \ 上最近的评论。\n\n## 活动 16.01 – 评论预览\n\n在这个活动中，我们将更新 Bookr 主页以获取六条最近的评论并显示它们。用户将能够点击按钮向前浏览接下来的六条评论，然后再返回到之前的评论。\n\
  \n以下步骤将帮助你完成活动：\n\n+   1. 首先，我们可以清理之前练习中的一些代码。如果你愿意，可以备份这些文件以供以后参考。或者，你也可以使用 GitHub\
