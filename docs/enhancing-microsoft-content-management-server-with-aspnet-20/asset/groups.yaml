    ```\n\n```\n// Add each posting to the site map\nforeach (Posting p in pc)\n{\n\
    \    smnc.Add(GetSiteMapNodeFromChannelItem(p));\n}\n}\nreturn smnc;\n}\n```\n\
    \n- 6. The class is complete. Save the MCMSSiteMapProviderSummary class file.\n\
    - 7. As before, we need to add a reference to the custom site-map provider in\
    \ the web.config file before we can use it. Add the highlighted line to the <providers>\
    \ section of the web.config file.\n\n```\n<providers>\n    . . . code continues\
    \ . . .\n    <add name=\"MCMSSiteMapProviderSummary\"\n        type=\"TropicalGreen.MCMSSiteMapProviderSummary\"\
    />\n</providers>\n```\n\n## Configuring the TreeView Control to Display a Flat\
    \ Listing of Items\n\nNow that we have created the custom site-map provider that\
    \ provides a listing of all pages within a given channel, we need to find a control\
    \ that is capable of displaying the list. Out of the box, we have a choice of\
    \ using either the SiteMapPath, Menu, or TreeView controls. For the purpose of\
    \ this example, let’s pick the TreeView control.\n\nIt may seem counterintuitive\
    \ to use the TreeView control to display a flat listing of items. After all, it\
    \ was designed to show a hierarchical list. Nevertheless, we shall see that the\
    \ TreeView control is a very versatile control, able to display hierarchical nested\
    \ items as well as a single-dimension flat list.\n\n- 1. First, create a new web\
    \ form in the /Templates/ folder of the TropicalGreen project. Name the file ChannelRenderingScript.aspx.\
    \ Choose to select a master page.\n- 2. In the Select a Master Page dialog, choose\
    \ the tropicalgreen.master file located in the Templates folder.\n- 3. With ChannelRenderingScript.aspx\
    \ opened in Design view, drag a SiteMapDataSource control from the Data section\
    \ of the toolbox and drop it anywhere in the content area. Give the control the\
    \ following property values:\n\n| Property | Value |\n|---|---|\n| ID | SiteMapDataSourceSummary\
    \ |\n| SiteMapProvider | MCMSSiteMapProviderSummary |\n| ShowStartingNode | False\
    \ |\n\nWe have set the SiteMapDataSource to link to the site map provider that\
    \ we built earlier: MCMSSiteMapProviderSummary. Note that as we don’t want the\
    \ currently viewed channel to be displayed as part of the list, we have set the\
    \ ShowStartingNode property to false.\n\n- 4. Next, drag a TreeView control from\
    \ the Navigation section of the toolbox and drop it anywhere in the content area.\
    \ Give it the following property values:\n\n| Property | Value |\n|---|---|\n\
    | ID | TreeView1 |\n| DataSourceID | SiteMapDataSourceSummary |\n| MaxDataBindDepth\
    \ | 1 |\n| ShowExpandCollapse | False |\n\nBy setting the MaxDataBindDepth property\
    \ to 1, we have ensured that the TreeView control will never show more than one\
    \ level of items. In this way, the list will always be flat. Also, we set ShowExpandCollapse\
    \ to false to prevent the expandable plus [+] and minus [-] signs from appearing.\n\
    \n- 5. Finally, to display a bullet next to each item on the list, we will manually\
    \ define the binding of each node. Toggle to Source view and add the highlighted\
    \ code between the <asp:TreeView> tags.\n\n```\n<asp:TreeView ID=\"TreeView1\"\
    \ runat=\"server\" DataSourceID=\"SiteMapDataSourceSummary\" MaxDataBindDepth=\"\
    1\" ShowExpandCollapse=\"False\">\n<DataBindings>\n<asp:TreeNodeBinding TextField=\"\
    Title\" NavigateUrlField=\"Url\" ToolTipField=\"Description\" FormatString='<li>{0}</>'\
    \ />\n</DataBindings>\n</asp:TreeView>\n```\n\nWe have bound the tree view node\
    \ to the Title, Url, and Description properties of the site-map node. In addition,\
    \ by setting the FormatString to include the <li> tag, we have included a bullet\
    \ to be printed next to each item.\n\n- 6. The page is completed. Save and compile\
    \ the website.\n\nNext, let’s assign the ChannelRenderingScript.aspx file to be\
    \ the channel-rendering script for the plant catalog channel.\n\n- 1. In Site\
    \ Manager, right-click on the PlantCatalog channel. Select Properties.\n- 2. In\
    \ the PlantCatalog Properties dialog, click on the Publishing tab.\n- 3. In the\
    \ Channel Rendering section, click on the Select button.\n- 4. In the Select Channel\
    \ Rendering dialog, enter /tropicalgreen/templates/ChannelRenderingScript.aspx\
    \ in the Script URL field.\n- 5. Click OK and close all opened dialogs.\n\nWith\
    \ that, we are ready to view the summary page. Navigate to http://tropicalgreen/plantcatalog\
    \ and view the listing of all plant pages within the channel.\n\nThe channel-rendering\
    \ script, ChannelRenderingScript.aspx, can be applied on all other channels on\
    \ the website. Go ahead and assign it to be the channel-rendering script for the\
    \ Columns and Gardens channels as well.\n\n## Summary\n\nWith the navigation controls\
    \ that ship with ASP.NET 2.0, building site navigation has never been easier.\
    \ In this chapter we started by building a custom SiteMapProvider that reads off\
    \ the MCMS repository to populate a site map. Next, we showed how a SiteMapPath\
    \ control works with the custom SiteMapProvider to provide a breadcrumb trail\
    \ of links that show the user exactly where he or she is in the site. We saw that\
    \ no extra programming was required for the SiteMapPath control to work correctly.\
    \ Following which, we looked at the Menu control. We built two versions of the\
    \ control—a static horizontal menu placed at the top of the page, and a dynamic\
    \ vertical menu located on the right-hand side of the page. Finally, we demonstrated\
    \ how the TreeView control could be used together with the SiteMapProvider to\
    \ provide a comprehensive view of the site’s hierarchy. We showed how it can be\
    \ configured to populate nodes on demand as well as part of a channel-rendering\
    \ script to display a summary listing of all postings within a particular channel.\n"
