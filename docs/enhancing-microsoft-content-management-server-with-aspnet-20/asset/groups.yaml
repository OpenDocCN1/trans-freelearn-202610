    \ registered if the request is for a ChannelItem (e.g. a channel-rendering script\
    \ or a posting). We wrap the code around a try-catch block, as an exception may\
    \ be raised if the page was requested when the user’s form’s login has expired.\
    \ In such a case, we will ignore the error as the page will not be rendered.\n\
    \n```\n```csharp\npublic void OnPreRequestHandlerExecute(object sender, EventArgs\
    \ e)\n{\n    HttpContext ctx = ((HttpApplication)sender).Context;\n    IHttpHandler\
