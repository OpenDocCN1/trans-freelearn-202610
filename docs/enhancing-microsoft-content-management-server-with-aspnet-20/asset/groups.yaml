    \ 文件中，在 `<httpModules>` 标签之间插入以下代码。\n\n```\n<add type=\"TropicalGreenHttpModules.CorrectLinksInThemes,\n\
    \    TropicalGreenHttpModules\" name=\"CorrectLinksInThemes\"/>\n```\n\n此外，将 **TropicalGreenHttpModules**\
    \ 项目（或 `TropicalGreenHttpModules.dll` 库）作为引用添加到 **TropicalGreen** 项目中。\n\n下次您查看同时应用了两种主题且\
    \ `RobotMetaTag` 的 `RenderBaseHref` 属性被禁用的帖子时，所有样式表都将被正确应用。查看 HTML 源代码，您会发现 HTTP\
    \ 模块已将所有相对链接更正为绝对链接。\n\n## Summary\n\n我们已经了解了如何使用主题高效地管理 MCMS 网站的外观和感觉。主题由皮肤、层叠样式表和其他支持文件组成。皮肤和层叠样式表共同有效地将设计元素与代码分离。\n\
    \n虽然主题在大多数 MCMS 网站上都能很好地工作，但在 `RobotMetaTag` 的 `RenderBaseHref` 属性被禁用时，一些站点可能需要一些自定义。这是因为样式表的链接被渲染为相对链接。作为变通方法，可以构建自定义\
    \ HTTP 模块来将页面上的相对链接更正为绝对链接。\n\n## 6\n\n## 身份验证控件和成员资格提供程序\n\nMembership Provider\
    \ 模型是 ASP.NET 2.0 引入的新关键概念之一，它使开发利用第三方或自定义成员资格存储的 Web 应用程序变得更加容易。此外，ASP.NET 2.0\
    \ 随附了许多与角色成员资格相关的身份验证控件，极大地减少了在应用程序中实现 Forms Authentication 和相关功能所需的代码量。\n\nMCMS\
    \ 拥有自己的基于角色的授权和用户管理系统，无法扩展。然而，Membership Provider 模型和随附的控件可在 MCMS 应用程序中使用，以改进\
    \ Forms Authentication 的实现，并为“账户映射”场景提供更优雅的解决方案，在该场景中身份验证针对外部存储进行，并且账户映射到 Windows\
    \ 账户以用于 MCMS 授权。\n\n在本章中，我们首先将简要介绍 ASP.NET 2.0 身份验证控件，然后继续实现一个 MCMS Membership\
    \ Provider，以支持在 MCMS 应用程序中使用身份验证控件。\n\n### 身份验证控件\n\nASP.NET 2.0 随附了七个与身份验证相关的复合控件，例如\
    \ Login 控件（提供实现 Forms Authentication 的标准用户界面）和 PasswordRecovery 控件（允许检索用户的密码）。这些控件可以在\
    \ Visual Studio 2005 工具箱的 Login 选项卡中看到。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_176_0.png)\n\
    \n由于 MCMS 拥有自己的用户管理系统且不提供受支持的 API，因此只有其中三个控件可与 MCMS 应用程序一起使用：\n\n- `Login`：提供\
    \ Forms Authentication 所需的用户界面。\n- `LoginStatus`：根据用户当前登录状态提供 **Login** 或 **Logout**\
    \ 超链接。\n- `LoginName`：显示当前已登录用户的名称。\n\n`LoginName` 控件可直接在 MCMS 应用程序中无修改使用，无论其身份验证模式如何，都可显示当前已登录用户的名称。然而，除非使用\
    \ Forms Authentication，否则 `LoginStatus` 控件没有实用目的，在这种情况下，可通过少量自定义代码使用它来启用用户登录和退出\
    \ MCMS 应用程序。\n\n`Login` 控件可用作手工编写必要代码以实现 MCMS 应用程序基于表单的身份验证的替代方案。然而，由于 MCMS 身份验证和授权系统，我们必须实现一个\
    \ Membership Provider 在幕后执行验证用户凭据的工作。通过使用这种方法，还可以操作来自 MCMS 身份验证和授权系统的结果，例如向返回的用户票据添加额外详细信息。\n\
    \n### 实现 MCMS Membership Provider\n\n为了支持 MCMS 应用程序，我们的 MCMS Membership Provider\
    \ 必须实现 ValidateUser() 方法，该方法执行 MCMS Forms Authentication。这是当用户从 Login 控件提交其凭据时将被调用的方法。以下示例显示了此类实现：\n\
    \n```csharp\npublic override bool ValidateUser(string strUsername,\n    string\
    \ strPassword)\n{\n    bool ValidUser = false;\n    CmsAuthenticationTicket Ticket\
    \ =\n        CmsFormsAuthentication.AuthenticateAsUser(strUsername,\n        \
    \    strPassword);\n\n    if (Ticket != null)\n    {\n        ValidUser = true;\n\
    \    }\n\n    return ValidUser;\n}\n```\n\n如果身份验证成功，此代码将生成 MCMS 身份验证票据。我们现在可以直接调用\
    \ CmsFormsAuthentication.SetAuthCookie 来设置 cookie，但提供程序不是设置 cookie 的正确位置。ValidateUser()\
    \ 方法应仅验证提供的用户凭据是否有效。在提供程序中，我们也无法访问 Login 控件的属性，例如 RememberMeSet 复选框，该复选框使用户有机会决定\
    \ cookie 是否应持久化。\n\n设置身份验证 cookie 的正确位置是 Login 控件的 LoggedIn 事件。问题是 Membership\
    \ Provider 模型不允许我们将票据传回 Login 控件。为克服此限制，我们可以将 MCMS 票据添加到当前 HttpContext 的 Items\
    \ 集合中：\n\n```csharp\npublic override bool ValidateUser(string strUsername,\n \
    \   string strPassword)\n{\n    bool ValidUser = false;\n    CmsAuthenticationTicket\
    \ Ticket =\n        CmsFormsAuthentication.AuthenticateAsUser(strUsername,\n \
    \           strPassword);\n\n    if (Ticket != null)\n    {\n        HttpContext.Current.Items.Add(\"\
    MCMSTicket\", Ticket);\n        ValidUser = true;\n    }\n\n    return ValidUser;\n\
    }\n```\n\nItems 集合是一个存储桶，可用于在单个请求内的不同代码部分之间传递各种对象——甚至在不同的 HttpModules 之间。HttpContext\
    \ Items 集合的生命周期是一个请求。我们现在可以在 Login 控件中使用由 Membership Provider 创建的 MCMS 票据。\n\n\
    现在让我们为 MCMS 实现一个 Base Membership Provider 类。我们将通过创建新的 Class Library 项目而不是使用 App_Code\
    \ 文件夹来实现。一旦完成，它可以在多个 MCMS 应用程序中重复使用。\n\n通过实现基础 Membership Provider，我们可以将与 MCMS\
    \ 身份验证和授权系统交互所需的代码与用于操作凭据格式或与外部身份验证系统交互的代码分离。\n\n- 1. 在 Visual Studio 2005 中打开\
