    - 2. 双击安装程序。\n- 3. 在“欢迎使用 Microsoft Visual J# 2.0 可再发行组件包安装”页面上，单击“下一步”。\n- 4.\
    \ 在“最终用户许可协议”页面上，选中“我接受许可协议条款”复选框并单击“安装”。\n- 5. 等待 J# 2.0 安装完成，并在出现“安装完成”页面时单击“完成”。\n\
    \n## MCMS 的 Internet Explorer Web 控件\n\nInternet Explorer Web 控件（IEWC）是 MCMS Web\
    \ Author 所必需的。\n\n- 1. 从以下位置下载并保存 IEWC 安装程序： http://www.microsoft.com/downloads/details.aspx?FamilyID=FAC6350C-8AD6-4BCA-8860-8A6AE3F64448&displaylang=en.\n\
    - 2. 双击安装程序。\n- 3. 在“**欢迎使用 Microsoft Internet Explorer WebControls 安装向导**”页面上，单击“**下一步**”。\n\
    - 4. 在“**许可协议**”页面上，选择“**我同意**”单选按钮并单击“**下一步**”。\n- 5. 在“**确认安装**”页面上，单击“**下一步**”。\n\
    - 6. 等待 Web 控件安装完成，并在出现“**安装完成**”页面时单击“**关闭**”。\n\n## 安装 MCMS 2002 SP1a\n\n- 1.\
    \ 插入 MCMS 2002 SP1a CD-ROM，并在启动画面上单击“**安装组件**”。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_55_0.png)\n\
    \n- 2. 在“**客户信息**”页面上，输入您的“**用户名**”和“**组织**”以及“**产品密钥**”，然后单击“**下一步**”。\n\n###\
    \ 安装\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_56_0.png)\n\n- 3. 在许可协议页面上，单击“接受”。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_56_1.png)\n\n- 4. 在“安装选项”页面上，选择“自定义”单选按钮并单击“下一步”。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_57_0.png)\n\n- 5. 在“自定义安装”页面上，取消选择“站点分发器”项，然后单击“下一步”。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_57_1.png)\n\n### 安装\n\n- 6. 在“摘要”页面上，单击“安装”。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_58_0.png)\n\n- 7. 等待 MCMS 2002 SP1a\
    \ 安装完成。\n\n- 8. 在“安装完成”页面上，取消选中“启动 MCMS 数据库配置应用程序”复选框，然后单击“完成”。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_58_1.png)\n\
    \n## 删除临时项目\n\n现在 MCMS SP1a 已安装，我们可以清理之前创建的临时项目以欺骗安装程序。\n\n- 1. 选择“**开始 | 运行...**”\n\
    - 2. 在“**运行**”对话框中，输入“**cmd**”并单击“**确定**”。\n- 3. 执行以下命令：\n  ```\n  cd c:\\kb915190\n\
    \  cscript VS2003ByPass.vbs c:\\VSTemp remove\n  ```\n- 4. 使用 Windows 资源管理器删除文件夹\
    \ `c:\\VSTemp` 和 `c:\\kb915190`。\n\n## 安装 Visual Studio 2005\n\n- 1. 插入 Visual\
    \ Studio 2005 DVD，并在启动画面上单击“**安装 Visual Studio 2005**”。\n- 2. 在“**欢迎使用 Microsoft\
    \ Visual Studio 2005 安装向导**”页面上，单击“**下一步**”。\n- 3. 在“**开始页**”上，选中“**我接受许可协议条款**”复选框，输入您的“**产品密钥**”和“**姓名**”，然后单击“**下一步**”。\n\
    - 4. 在“**选项页**”上，选择“**自定义**”单选按钮，输入所需的“**产品安装路径**”，然后单击“**下一步**”。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_60_0.png)\n\
    \n- 5. 在第二个选项页上，在“语言工具”部分中选择 Visual C# 和 Visual Web Developer 复选框，并在“.NET Framework\
    \ SDK”部分中选择“工具”复选框。确保未选择其他所有选项，然后单击“安装”。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_61_0.png)\n\
    \n您可以随意安装您可能想要使用的任何其他功能。上述选择是遵循本书示例所需的所有内容。\n\n- 6. 等待（或休息一下喝杯咖啡）Visual Studio\
    \ 2005 安装完成。当出现“完成页”时，单击“完成”。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_62_0.png)\n\
    \n- 7. 从 Visual Studio 2005 设置对话框中，如果需要，可以安装产品文档（MSDN 库），否则单击“退出”。\n- 8. 从 Visual\
    \ Studio 2005 设置对话框中，单击“检查 Visual Studio 服务版本”以安装可能可用的任何更新。\n- 9. 单击“退出”。\n\n\
    ## 安装 MCMS SP2\n\n- 1. 从“开始”菜单中，单击“运行...”\n- 2. 在“打开”文本框中，输入 IISRESET /STOP 并单击“确定”。\n\
    - 3. 等待 IIS 服务停止。\n- 4. 双击 SP2 安装包。\n- 5. 在“欢迎使用 Microsoft Content Management\
    \ Server 2002 SP2 安装向导”页面上，单击“下一步”。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_63_0.png)\n\
    \n- 6. 选择“我接受此许可协议条款”单选按钮，然后单击“下一步”。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_63_1.png)\n\
    \n- 7. 在“向导已准备好开始安装”页面上，单击“下一步”。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_64_0.png)\n\
    \n- 8. 等待 Service Pack 2 安装完成。\n- 9. 在“安装向导已完成”页面上，单击“完成”。\n- 10. 如果提示，请在对话框中单击“是”重新启动计算机，以完成安装。\n\
    - 11. 否则，从“开始”菜单中单击“运行...”\n- 12. 在“运行”文本框中，输入 IISRESET /START 并单击“确定”以重新启动 IIS\
    \ 服务。\n\n> 在安装 SP2 之前停止 IIS 可避免在安装过程中替换锁定文件时出现潜在问题，并可防止需要重新启动。\n\n## 配置开发环境\n\n\
    继续之前，我们需要查看配置开发环境所需的一小部分额外步骤。\n\n### Site Manager 快捷方式\n\n在安装 SP2 期间，**Site Manager**“开始”菜单快捷方式将被覆盖。要配置\
    \ **Site Manager** 以绕过 **Connect To** 对话框，请按照以下步骤操作：\n\n- 1. 选择“**开始**” | “**所有程序**”\
    \ | “**Microsoft Content Management Server**”。\n- 2. 右键单击“**Site Manager**”快捷方式并单击“**属性**”。\n\
    - 3. 在“**目标**”文本框中，将\n  ```\n  \"C:\\Program Files\\Microsoft Content Management\
    \ Server\\Client\\NRClient.exe\" http:// //NR/System/ClientUI/login.asp\n  ```\n\
    \  用\n  ```\n  \"C:\\Program Files\\Microsoft Content Management Server\\Client\\\
    NRClient.exe\" http://localhost/NR/System/ClientUI/login.asp.\n  ```\n- 4. 单击“**确定**”。\n\
    \n### Visual Studio 模板\n\n安装 MCMS Service Pack 2 会自动在 Visual Studio 2005 中注册 MCMS\
    \ 开发人员工具，例如 MCMS 模板资源管理器。但是，在使用 Visual Studio 创建 MCMS 应用程序之前，我们需要使网站和项目模板可用。\n\
    \n- 1. 选择“**开始**” | “**所有程序**” | “**Microsoft Visual Studio 2005**” | “**Visual\
    \ Studio 工具**” | “**Visual Studio 2005 命令提示符**”。\n- 2. 执行以下命令，将 `MCMS_INSTALL_PATH`\
    \ 替换为 MCMS 的安装位置（通常为 `C:\\Program Files\\Microsoft Content Management Server`）并将\
    \ `PATH_TO_MY_DOCUMENTS_FOLDER` 替换为“我的文档”文件夹的位置：\n  ```\n  xcopy \"MCMS_INSTALL_PATH\\\
    DevTools\\NewProjectWizards80\\Visual Web Developer\" \"PATH_TO_MY_DOCUMENTS_FOLDER\\\
    Visual Studio 2005\\Templates\\ProjectTemplates\\Visual Web Developer\" /E\n \
    \ xcopy \"MCMS_INSTALL_PATH\\DevTools\\NewItemWizards80\\Visual Web Developer\"\
    \ \"PATH_TO_MY_DOCUMENTS_FOLDER\\Visual Studio 2005\\Templates\\ItemTemplates\\\
    Visual Web Developer\" /E\n  ```\n- 3. 执行以下命令以将模板注册到 Visual Studio 2005：\n  ```\n\
    \  devenv /setup\n  ```\n- 4. 关闭命令提示符。\n"
