  - "[PAGE 147]\n\nsource of the page (right-click anywhere on the page and choose\
    \ **View Source**), you will find that the `TreeView_PopulateNode()` method is\
    \ triggered by the anchor’s `href` attribute:\n\n```\n<a id=\"ctl00_ContentPlaceHolder1_TreeView1n2\"\
    \ href=\"javascript:\nTreeView_PopulateNode(. . . code continues . . . )>\n```\n\
    \nUsing the anchor’s `href` attribute gets the job done, but it does cause the\
    \ page to unload, hence prompting the leave warning message to appear.\n\nInstead\
    \ of using the anchor’s `href` attribute to call the script, we should instead\
    \ use the `onclick()` method. The `onclick()` event behaves like a regular **Submit**\
    \ button. The page’s URL does not change when it fires, and therefore does not\
    \ trigger the page’s `OnBeforeUnload()` event, and the alert does not appear.\n\
    \nWe need to move the entire content of the anchor’s `href` attribute and embed\
    \ it in the `onclick()` event such that the generated code appears as follows.\
    \ The script should return `false` so as to cancel any further action that may\
    \ be taking place, such as the execution of the `href` attribute.\n\n```\n<a id=\"\
    ctl00_ContentPlaceHolder1_TreeView1n2\"\nonclick=\"TreeView_PopulateNode(. . .\
    \ code continues . . . );\nreturn false;\">\n```\n\nThe best way to go about modifying\
    \ the way the anchor tag is generated is to create a custom `TreeView` control\
    \ and override its `Render()` method.\n\n+   1. Add a C# Class Library project\
    \ to the solution. Name the project **TropicalGreenControlLib**.\n+   2. Delete\
    \ the `Class1.cs` file generated by the wizard. We won’t need it.\n+   3. Add\
    \ a reference to the `System.Web` library to the project.\n+   4. Add a class\
    \ file named `MCMSTreeView.cs` to the project.\n+   5. The code requires the use\
    \ of the methods in the namespaces highlighted in the following snippet. Add them\
    \ above the namespace declaration.\n\n```\n. . . code continues . . .\nusing System.Web;\n\
    using System.Web.UI;\nusing System.Web.UI.WebControls;\nusing System.IO;\nusing\
    \ System.Text.RegularExpressions;\n\nnamespace TropicalGreenControlLib\n{\n  \
    \  . . . code continues . . .\n}\n```"
  - "[PAGE 148]\n\n6. As we are merely modifying the way the tree view is rendered,\
    \ we won’t attempt to build the control from scratch. Instead, have the custom\
    \ control inherit from the System.Web.UI.WebControls.TreeView class.\n\n```\n\
    public class MCMSTreeView : TreeView\n{\n}\n```\n\n7 To modify the anchors generated\
    \ by the base TreeView class, we need to override the Render() method. We first\
    \ retrieve the HTML output generated by the base TreeView control. Once we have\
    \ gotten the original content, we look for instances of the href attribute. Using\
    \ a regular expression, we get the value that was previously stored in the href\
    \ attribute and move it to the onclick() event handler of the anchor. Add the\
    \ code as shown here:\n\n```\nprotected override void Render(System.Web.UI.HtmlTextWriter\n\
    \    output)\n{\n    // Get the output of the original TreeView Control\n    TextWriter\
    \ tempWriter = new StringWriter();\n    base.Render(new System.Web.UI.HtmlTextWriter(tempWriter));\n\
    \    string orightml = tempWriter.ToString();\n\n    // Search for the javascript\
    \ postback code in the href attribute\n    // and if found add an onclick event\
    \ handler to execute it in a\n    // way that does not cause the MCMS authoring\
    \ warning to show up\n    Regex hrefRegex =\n        new Regex(\"href=\\\"javascript:(?<PostBackScript>.*?)\\\
    \"\",\n            RegexOptions.Singleline);\n    string newhtml = hrefRegex.Replace(orightml,\n\
    \        \"href=\\\"javascript:${PostBackScript}\\\" \" +\n        \"onclick=\\\
    \"eval(this.href.substr(11)); \" +\n        \"return false;\\\"\" );\n    output.Write(newhtml);\n\
    }\n```\n\n8. The control is complete. Save and compile the TropicalGreenControlLib\
    \ project.\n\nTo use the custom control, add it to the Toolbox by right-clicking\
    \ anywhere within the box and by selecting Choose Items. In the Choose Items dialog,\
    \ select the .NET Framework Components tab. Click on the Browse button and select\
    \ the TropicalGreenControlLib.dll file found in the /debug/bin/ folder of the\
    \ TropicalGreenControlLib project."
