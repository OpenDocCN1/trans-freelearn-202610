    # # About the Authors


    **Spencer Harbar**, an MCSD for Microsoft .NET, MCSE and MVP for MCMS, has

    over twelve years commercial experience of architecture, design, development,

    deployment, and operational support of web-based applications and hosting

    platforms for some of Europe’s largest organisations.


    Spencer maintains www.mcmsfaq.com: an MCMS resources portal, and is active in
    the

    public newsgroups. His experience of MCMS goes back to the days of NCompass

    Resolution, and he has been involved in many enterprise implementations.


    Currently working as an independent consultant, Spencer delivers enterprise content

    management and portal systems architecture, design, development, and deployment

    solutions, application security best practices, threat modeling, and the implementation

    of highly available Windows-Server-System-based hosting platforms.


    Product expertise includes MCMS, SharePoint Technologies, IIS, SQL Server,

    Commerce Server and BizTalk Server, Windows Security, PKI, and High Availability.


    Selected clients include Barclays Bank, Scottish Power plc, HBOS, Microsoft,

    The Royal Bank of Scotland, Scottish Enterprise, Centrica, Clifford Chance, The

    Automobile Association, and BASF.


    Spencer resides in Edinburgh, UK.'
  - '[PAGE 5]


    **Lim Mei Ying** is a Senior Consultant with Avanade and has extensive experience
    in setting up MCMS systems at the enterprise level. She has spent many hours figuring
    out the dos and don’ts of the product, and enjoys finding new ways to solve MCMS-related
    problems.


    She contributes actively to the newsgroup community and is a Microsoft Most Valuable
    Professional for Content Management Server. Mei Ying lives on the sunny island
    of Singapore and blogs at `http://meiyinglim.blogspot.com`. She also co-authored
    the earlier book, _Building Websites with Microsoft Content Management Server_
    (ISBN 1-904811-16-7, Packt Publishing).


    > Thanks to my husband, Louis, for the much needed support throughout the many
    months of writing. Special thanks to my family and friends for their encouragement.


    **Stefan Goßner** works for Microsoft as an Escalation Engineer in the Developer
    Support department. He provides customers with technical solutions to problems
    related to Microsoft Internet Server Products. Stefan has a wide understanding
    of all areas of MCMS.


    His contributions to the newsgroup have helped many people to implement MCMS solutions
    in corporations around the globe to the point where it has been said that if you
    don’t know Stefan, then you’re probably new to MCMS.


    Stefan maintains a huge MCMS 2002 FAQ on the Microsoft website, and provides MCMS
    tips and tricks on his personal blog `http://blogs.technet.com/stefan_gossner`.


    Stefan has also written the books _Building Websites With Microsoft Content Management
    Server_ (ISBN 1-904811-16-7, Packt Publishing), and _Advanced Microsoft Content
    Management Server Development_ (ISBN 1-904811-53-1, Packt Publishing).


    He lives in Munich, Germany, and can be reached at `webmaster@stefan-gossner.de`


    > I would like to thank my girlfriend Michaela, for her support throughout months
    of writing, reviewing, and coding for the book. Also many thanks to my friends
    in the MCMS Support Teams worldwide and to my friends in the MCMS product team
    in the US.'
  - '[PAGE 6]


    # # About the Reviewers


    **Andreas Klein** started in the PC business in 1981, working as a consultant
    for several years before joining Microsoft in 1990. Since then he has held programming
    trainings. On the technical side, he has covered many different areas, including
    Win16 (Windows 2.x, 3.x) and Win32 Application and Driver Programming, helping
    customers manage their systems running Windows 9x, Windows NT, and later versions,
    and even Exchange 4.0 - 2000.


    His current focus is web server scenarios (IIS, MCMS 2002), DHTML programming,
    and PKI/Security concepts in the IT scope.


    **Mick Badran** has been performing Microsoft technical classroom-based training
    for more than nine years, and has over 12 years commercial development experience
    in various languages. Mick has been consulting for Microsoft in areas of CMS,
    SPS, and BizTalk for over five years. He also specializes in customized training
    in these areas.


    Mick speaks at various Microsoft Events such as TechEd and Security summits, and
    is a BizTalk MVP.


    He can be reached at `mickb@breezetraining.com.au`, and would love to hear your
    feedback.


    **Joel Ward** works as a web developer and technical manager. Once destined to
    be an architect, he switched tracks midway through college and instead graduated
    with a degree in Integrative Arts from the Pennsylvania State University. His
    professional career has taken him on a journey through design, programming, usability,
    and accessibility.


    Joel has enjoyed working with MCMS since its first release in 2001. Over the years,
    Joel has been active in the newsgroups and has been recognized as a Microsoft
    Most Valuable Professional for his work in the MCMS community.


    He enjoys a good challenge, which includes working on projects that use ASP.NET,
    MCMS, and SharePoint.


    Joel lives in the Commonwealth of Virginia in the United States. You can visit
    his website at `http://www.wardworks.com/joel/`.'
