    \ string adsGalleryPath;\n\n    [Bindable(true)]\n    [Category(\"Behavior\")]\n\
    \    [DefaultValue(\"\")]\n    [Localizable(true)]\n    public string AdsGalleryPath\n\
    \    {\n        get { return adsGalleryPath; }\n        set { adsGalleryPath =\
    \ value; }\n    }\n}\n```\n\n7. The advertisement to be displayed will be picked\
