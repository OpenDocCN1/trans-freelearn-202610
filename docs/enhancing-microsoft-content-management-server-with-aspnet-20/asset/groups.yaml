    in the Script URL field.

    +   5. Click OK and close all opened dialogs.


    With that, we are ready to view the summary page. Navigate to http://tropicalgreen/plantcatalog
    and view the listing of all plant pages within the channel.


    The channel-rendering script, ChannelRenderingScript.aspx, can be applied on all
    other channels on the website. Go ahead and assign it to be the channel-rendering
    script for the Columns and Gardens channels as well.


    # Summary


    With the navigation controls that ship with ASP.NET 2.0, building site navigation
    has never been easier. In this chapter we started by building a custom SiteMapProvider
    that reads off the MCMS repository to populate a site map. Next, we showed how
    a SiteMapPath control works with the custom SiteMapProvider to provide a breadcrumb
    trail of links that show the user exactly where he or she is in the site. We saw
    that no extra programming was required for the SiteMapPath control to work correctly.
    Following which, we looked at the Menu control. We built two versions of the control—a
    static horizontal menu placed at the top of the page, and a dynamic vertical menu
    located on the right-hand side of the page. Finally, we demonstrated how the TreeView
    control could be used together with the SiteMapProvider to provide a comprehensive
    view of the site’s hierarchy. We showed how it can be configured to populate nodes
    on demand as well as part of a channel-rendering script to display a summary listing
    of all postings within a particular channel.'
