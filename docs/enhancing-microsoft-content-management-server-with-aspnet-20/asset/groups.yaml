    \ `SiteMapProvider`，它仅包含 `MenuLocation` 自定义属性值为 Top 的频道。\n\n- 1. 在 `\\App_Code\\\
    SiteMapProviders` 文件夹中添加一个名为 `MCMSSiteMapProviderTop.cs` 的类文件。\n- 2. 添加突出显示的命名空间以及命名空间声明。\n\
    \n```\nusing System;\nusing System.Data;\nusing System.Configuration;\nusing System.Web;\n\
    using System.Web.Security;\nusing System.Web.UI;\nusing System.Web.UI.WebControls;\n\
