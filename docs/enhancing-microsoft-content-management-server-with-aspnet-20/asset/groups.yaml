  - '[PAGE 115]


    # 4

    Navigation Controls


    Developing site navigation is an exercise that often leaves developers in a dilemma.
    Early versions of Visual Studio did not provide any ready-to-use navigation controls.
    Developers had to choose between spending many hours building controls from scratch
    or expanding project budgets to purchase shrink-wrapped software. While free controls
    were available for download from the Internet, they weren’t always ready for use,
    and developers still had to spend a fair bit of time understanding the code and
    customizing it to fit their requirements.


    The good news is: ASP.NET 2.0 introduces a whole new way of implementing site
    navigation. Packaged as part of ASP.NET 2.0 are three powerful navigation controls:


    +   - The `SiteMapPath` control generates a series of links that connect to one
    another on a website, for example, **Home > Plant Catalog > Aloe Vera**. It is
    the "You Are Here" sign that tells visitors exactly where they are. It is also
    sometimes known as a breadcrumb trail, and like the trail of breadcrumbs left
    by the fictional characters Hansel and Gretel, it helps users find their way back
    from the main page.

    +   - The `Menu` control can be configured to show static horizontal or vertical
    lists of items. It can even be dynamic, showing and hiding sub-items when the
    cursor hovers over an item.

    +   - The `TreeView` control provides a hierarchical representation of the site.
    It contains a list of all items on the site nested in a tree. Users can click
    to expand leaf nodes to reveal sub-nodes.


    All of the above listed controls can be driven by site maps. You can think of
    site maps as a collection of items that make up the structure of your site. By
    programmatically adding channels and postings to a site map, we are able to smoothly
    integrate these controls to any MCMS site as we will see in this chapter.'
