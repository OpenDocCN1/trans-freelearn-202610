    # Use the Provider Model Design Pattern


    In this book, we have discussed how the Provider Model can be used when building
    site navigation controls (Chapter 4) or when performing Forms Authentication (Chapter
    6).


    Using the Provider Model extends the idea of isolating code that uses the PAPI
    from other sections of code. As we have seen in earlier chapters, the Provider
    Model allows us to separate the "business logic", which interrogates the MCMS
    repository, from the "presentation logic", which is responsible for returning
    HTML to the browser. For example, when building the site navigation, we used the
    standard `SiteMapPath` and `TreeView` controls for the presentation logic. We
    then implemented the business logic by building the `MCMSsiteMapProvider` class,
    which used the PAPI to query the repository for a list of navigation items.


    When it’s time to upgrade the site, only the Provider Model needs to be replaced,
    either with native MOSS 2007 functionality or an alternative provider that speaks
    to MOSS. For example, to upgrade the navigation controls for the TropicalGreen
    site, we would just rewrite the `MCMSsiteMapProvider.cs` class file. The `SiteMapPath`
    or `TreeView` controls that are part of the presentation layer can be reused without
    further modifications.


    > More details on how to plan for the future release of MOSS 2007 are available
    in the following white paper:

    > http://msdn.microsoft.com/library/en-us/dnmscms02/html/CMSDesigningCMS2002Sol.asp


    # Summary


    In this chapter we discussed a couple of tips that will ease developing websites
    with MCMS. First we saw how the `PostBackUrl` property can be used to pass data
    from one page to another. Following that, we devised a workaround to get it to
    work correctly on MCMS sites.


    Next, we discussed the nifty Ad Rotator control that ships with ASP.NET 2.0. While
    the Ad Rotator control has been around for a while, this latest version allows
    us to bind the control’s contents directly with a non-static XML file. We are
    now able to integrate the control directly with MCMS resource-gallery items, providing
    a flexible and useful addition to our toolbox.


    Finally, we discussed some considerations for future plans to ease the migration
    of existing applications to the next release of MOSS 2007.'
