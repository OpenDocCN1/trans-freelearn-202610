    ## 关于作者


    **Spencer Harbar**，微软 .NET 的 MCSD、MCSE 以及 MCMS 的 MVP，拥有超过十二年的商业经验，负责为欧洲一些最大组织的基于
    Web 的应用程序和托管平台进行架构、设计、开发、部署和运营支持。


    Spencer 维护 www.mcmsfaq.com：一个 MCMS 资源门户，并在公共新闻组中活跃。他对 MCMS 的经验可追溯至 NCompass Resolution
    时代，并参与了许多企业级实施。


    目前作为独立顾问工作，Spencer 提供企业内容管理和门户系统架构、设计、开发和部署解决方案、应用程序安全最佳实践、威胁建模，以及基于 Windows Server
    System 的高可用性托管平台的实现。


    产品专长包括 MCMS、SharePoint 技术、IIS、SQL Server、Commerce Server 和 BizTalk Server、Windows
    安全、PKI 和高可用性。


    选定的客户包括 Barclays Bank、Scottish Power plc、HBOS、Microsoft、The Royal Bank of Scotland、Scottish
    Enterprise、Centrica、Clifford Chance、The Automobile Association 和 BASF。


    Spencer 居住在英国爱丁堡。


    **Lim Mei Ying** 是 Avanade 的高级顾问，在企业级搭建 MCMS 系统方面拥有丰富的经验。她花费了大量时间研究该产品的注意事项，并喜欢寻找解决
    MCMS 相关问题的新方法。


    她积极为新闻组社区做出贡献，并是内容管理服务器的微软最有价值专家。Mei Ying 生活在阳光明媚的新加坡岛屿，并在 `http://meiyinglim.blogspot.com`
    博客。她还合著了早期书籍 _使用 Microsoft Content Management Server 构建网站_（ISBN 1-904811-16-7，Packt
    Publishing）。


    > 感谢我的丈夫 Louis 在漫长的写作月里给予的迫切需要的支持。特别感谢我的家人和朋友的鼓励。


    **Stefan Goßner** 在微软开发者支持部门担任升级工程师。他为客户提供与微软互联网服务器产品相关问题的技术解决方案。Stefan 对 MCMS
    的各个领域都有广泛的了解。


    他对新闻组的贡献帮助了许多人全球各地的公司实施 MCMS 解决方案，以至于有人说如果你不认识 Stefan，那你可能刚接触 MCMS。


    Stefan 在微软网站上维护了一个庞大的 MCMS 2002 常见问题解答，并在他的个人博客 `http://blogs.technet.com/stefan_gossner`
    上提供 MCMS 技巧。


    Stefan 还撰写了书籍 _使用 Microsoft Content Management Server 构建网站_（ISBN 1-904811-16-7，Packt
    Publishing），以及 _高级 Microsoft Content Management Server 开发_（ISBN 1-904811-53-1，Packt
    Publishing）。


    他居住在德国慕尼黑，可通过 `webmaster@stefan-gossner.de` 联系。


    > 我想感谢我的女朋友 Michaela，在为本书的写作、审阅和编码的数月里给予的支持。还要非常感谢全球 MCMS 支持团队的朋友们以及美国 MCMS 产品团队的朋友们。


    ## 关于审阅者


    **Andreas Klein** 于 1981 年进入 PC 业务，在 1990 年加入微软之前担任了数年的顾问。自那以后他一直举办编程培训。在技术方面，他涵盖了许多不同的领域，包括
    Win16（Windows 2.x、3.x）和 Win32 应用程序和驱动程序编程，帮助客户管理运行 Windows 9x、Windows NT 及后续版本，甚至
    Exchange 4.0 - 2000 的系统。


    他目前的重点是 Web 服务器场景（IIS、MCMS 2002）、DHTML 编程，以及 IT 范围内的 PKI/安全概念。


    **Mick Badran** 已从事微软技术课堂培训超过九年，并在各种语言方面拥有超过 12 年的商业开发经验。Mick 已为微软在 CMS、SPS 和
    BizTalk 领域提供咨询超过五年。他还专门从事这些领域的定制培训。


    他在各种微软活动上演讲，如 TechEd 和安全峰会，并是 BizTalk MVP。


    他可以通过 `mickb@breezetraining.com.au` 联系，并很乐意听取您的反馈。


    **Joel Ward** 担任 Web 开发人员和技术经理。他曾立志成为建筑师，但在大学中途改变方向，转而从宾夕法尼亚州立大学获得整合艺术学位。他的职业生涯经历了设计、编程、可用性和可访问性的历程。


    Joel 自 2001 年首次发布以来一直乐于使用 MCMS。多年来，Joel 在新闻组中活跃，并因其在 MCMS 社区的工作而被认可为微软最有价值专家。


    他喜欢好的挑战，其中包括使用 ASP.NET、MCMS 和 SharePoint 的项目。


    Joel 住在美国弗吉尼亚联邦。你可以访问他的网站 `http://www.wardworks.com/joel/`。


