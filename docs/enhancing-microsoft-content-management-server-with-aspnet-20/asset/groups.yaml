    # Site Manager Shortcut


    During the installation of SP2, the **Site Manager** Start-menu shortcut will
    be overwritten. To configure **Site Manager** to bypass the **Connect To** dialog,
    follow the steps here:


    +   1. Select **Start** | **All Programs** | **Microsoft Content Management Server**.

    +   2. Right-click the **Site Manager** shortcut and click **Properties**.

    +   3. In the **Target** textbox, replace

    +   ```

    +   "C:\Program Files\Microsoft Content Management Server\Client\NRClient.exe"
    http:// //NR/System/ClientUI/login.asp

    +   ```

    +   with

    +   ```

    +   "C:\Program Files\Microsoft Content Management Server\Client\NRClient.exe"
    http://localhost/NR/System/ClientUI/login.asp.

    +   ```

    +   4. Click **OK**.


    # Visual Studio Templates


    The installation of MCMS Service Pack 2 automatically registers the MCMS developer
    tools such as MCMS Template Explorer in Visual Studio 2005. However, before we
    can create MCMS applications with Visual Studio, we need to make the website and
    item templates available.


    +   1. Select **Start** | **All Programs** | **Microsoft Visual Studio 2005**
    | **Visual Studio Tools** | **Visual Studio 2005 Command Prompt**.

    +   2. Execute the following commands, replacing `MCMS_INSTALL_PATH` with the
    installation location of MCMS (usually `C:\Program Files\Microsoft Content Management
    Server`) and `PATH_TO_MY_DOCUMENTS_FOLDER` with the location of your My Documents
    folder:

    +   ```

    +   xcopy "MCMS_INSTALL_PATH\DevTools\NewProjectWizards80\Visual Web Developer"
    "PATH_TO_MY_DOCUMENTS_FOLDER\Visual Studio 2005\Templates\ProjectTemplates\Visual
    Web Developer" /E

    +   xcopy "MCMS_INSTALL_PATH\DevTools\NewItemWizards80\Visual Web Developer" "PATH_TO_MY_DOCUMENTS_FOLDER\Visual
    Studio 2005\Templates\ItemTemplates\Visual Web Developer" /E

    +   ```

    +   3. Execute the following command to register the templates with Visual Studio
    2005:

    +   ```

    +   devenv /setup

    +   ```

    +   4. Close the command prompt.'
