  - "[PAGE 205]\n\nTo correct this problem, we need modify the behavior of the client-side\
    \ scripts added by MCMS to set __CMS_PostbackFormBeenReset to true when performing\
    \ cross-page postbacks. Here’s how it may be done.\n\n+   - First, we will identify\
    \ whether cross-page postbacks are required. To do so, we look for a method named\
    \ WebForm_DoPostBackWithOptions(). The WebForm_DoPostBackWithOptions() method\
    \ is an enhancement of the old ASP.NET 1.x __doPostBack() method and is injected\
    \ by ASP.NET whenever at least one button on the page performs a cross postback.\n\
    +   - Next, we make a copy of the original WebForm_DoPostBackWithOptions() method\
    \ and store it in a variable named __CrossPostBack_Backup_WebForm_DoPostBackWithOptions.\n\
    +   - Following this, we assign WebForm_DoPostBackWithOptions() a new method named\
    \ __CrossPostBack_Redirect_WebForm_DoPostBackWithOptions().\n+   - The __CrossPostBack_Redirect_WebForm_DoPostBackWithOptions()\
    \ method simply sets __CMS_PostbackFormBeenReset to true and calls the original\
    \ WebForm_DoPostBackWithOptions() method, which we have backed up in the __CrossPostBack_Backup_WebForm_DoPostBackWithOptions\
    \ variable.\n\nDon’t worry about typing the code for now. We will be injecting\
    \ the code on all pages using server-side code in the next section.\n\n```\nif\
    \ ( typeof WebForm_DoPostBackWithOptions != \"undefined\" )\n{\n    __CrossPostBack_Backup_WebForm_DoPostBackWithOptions\
    \ =\n        WebForm_DoPostBackWithOptions;\n\n    WebForm_DoPostBackWithOptions\
    \ =\n        __CrossPostBack_Redirect_WebForm_DoPostBackWithOptions;\n}\n\nfunction\
    \ __CrossPostBack_Redirect_WebForm_DoPostBackWithOptions(options)\n{\n    __CMS_PostbackFormBeenReset\
    \ = true;\n    __CrossPostBack_Backup_WebForm_DoPostBackWithOptions(options);\n\
    }\n```"
