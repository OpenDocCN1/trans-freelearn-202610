    \ and click **Create**.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_39_0.png)\n\
    \n9. In the **New User** dialog, enter **mcmssys** in the **User name** textbox.\n\
    10. Provide a **Full Name** and **Description**.\n11. Provide a **Password**.\n\
    12. Uncheck the **User must change password at next logon** checkbox.\n13. Check\
    \ the User cannot change password and Password never expires checkboxes and click\
    \ Create.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_40_0.png)\n\n14. Close the\
    \ New User dialog and close Computer Management.\n\n## Installing Internet Information\
    \ Services\n\nThe following steps detail the installation of the minimal required\
    \ components of Internet Information Services (IIS). Any differences to the procedure\
    \ when installing on Windows Server 2003 SP1 are noted.\n\n1. Select Start | Control\
    \ Panel.\n2. Double-click Add or Remove Programs.\n3. Click Add/Remove Windows\
    \ Components.\n4. In the Windows Components Wizard, click (note: not check) Internet\
    \ Information Services (IIS) followed by Details...\n5. In the Internet Information\
    \ Services (IIS) dialog, click (note: not check) World Wide Web Service followed\
    \ by Details...\n6. In the World Wide Web Service dialog, check the World Wide\
    \ Web Service item and click OK.\n"
  mdcn: "\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_29_0.png)\n\n5. 完成后，单击 下一步，并等待系统配置检查完成。\n\
    6. 在“欢迎使用 Microsoft SQL Server 安装向导”页面上，单击 下一步。\n7. 在“系统配置检查”页面上，所有操作都应报告状态为成功。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_30_0.png)\n\n8. 单击 **下一步** 并等待安装程序准备安装。\n\
    \n9. 在 **注册信息** 页面上，个性化您的安装详细信息，输入产品密钥，然后单击 **下一步**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_30_1.png)\n\
    \n10. 在“要安装的组件”页面上，选择 SQL Server 数据库服务和工作站组件、Books Online 和开发工具复选框，然后单击 下一步。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_31_0.png)\n\n11. 在“实例名称”页面上，选择默认实例单选按钮，然后单击\
    \ 下一步。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_31_1.png)\n\n## Installation\n\
    \n12. 在“现有组件”页面上，选中 SQL Server 数据库服务 8.00.2039 复选框，然后单击 下一步。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_32_0.png)\n\
    \n13. 在“升级登录信息”页面上，选择 Windows 身份验证模式单选按钮，然后单击 下一步。\n\n等待升级分析完成。\n\n14. 在“服务帐户”页面上，从服务组合框中选择\
    \ SQL Browser，输入您的 SQL Server 服务帐户详细信息，然后单击 下一步。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_33_0.png)\n\
    \n15. 在“错误和使用情况报告设置”页面上，选择是否要向 Microsoft 提交错误和使用情况报告，然后单击 下一步。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_33_1.png)\n\
    \n16. 在“准备安装”页面上，单击 安装。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_34_0.png)\n\
    \n17. 等待 SQL Server 升级完成，然后单击 下一步。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_34_1.png)\n\
    \n18. 在“完成 Microsoft SQL Server 2005 安装”页面上，单击 完成。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_35_0.png)\n\
    \n为避免在升级到 SQL Server 2005 后在 Web Author 中保存时出现可能的 ODBC 错误，请在 MCMS 服务器计算机上执行 **IISRESET**。请注意，对于生产系统，我们会在升级\
    \ SQL Server 实例之前停止 IIS。\n\n## Installing SQL Server 2005 Service Pack 1\n\n我们现在将安装\
    \ SQL Server 2005 的 Service Pack 1，可从 `http://www.microsoft.com/downloads/details.aspx?FamilyID=cb6c71ea-d649-47ff-9176-e7cac58fd4bc`\
    \ 下载。\n\n1. 双击安装程序文件，等待文件提取完成。\n2. 在 **欢迎** 页面上，单击 **下一步**。\n3. 在 **最终用户许可协议**\
    \ 页面上，选中 **我接受许可条款和条件** 复选框，然后单击 **下一步**。\n4. 在 **功能选择** 页面上，单击 **下一步**。\n5. 在\
    \ **身份验证模式** 页面上，单击 **下一步**。\n6. 在 **准备安装** 页面上，单击 **安装**，并等待 Service Pack 安装完成。在安装过程中，您可能会被提示有关\
    \ **待重启文件**。如果提示，请单击 **是**。\n7. 当出现 **已锁定文件** 对话框时，单击 **继续**。\n8. 在 **需要重新启动计算机**\
    \ 对话框中，单击 **确定**。\n9. 单击 **下一步**，在 **安装完成** 页面上，单击 **完成**。\n10. 重新启动计算机。\n\n##\
    \ Modifying the CreateBackgroundProcessingJob Stored Procedure\n\n在继续之前，您需要修改其中一个\
    \ MCMS 存储过程，以确保其与 SQL Server 2005 兼容。\n\n1. 选择 **开始 | 所有程序 | Microsoft SQL Server\
    \ 2005 | SQL Server Management Studio**。\n2. 在 **连接到** 对话框中，单击 **连接**。\n3. 在 **对象资源管理器**\
    \ 中，展开 **数据库** 文件夹，右键单击 MCMS 数据库，然后单击 **新建查询**。\n4. 打开 Internet Explorer 并导航到\
    \ `http://support.microsoft.com/default.aspx?id=906145#XSLTH3161121120121120120`。\n\
    5. 将灰色文本框中的 SQL 脚本复制并粘贴到 **SQL Server Management Studio** 中的 **查询窗口**。\n6. 在 **SQL\
    \ 编辑器** 工具栏上，单击 **执行** 按钮。\n7. 关闭 **SQL Server Management Studio**。\n\n这完成了升级\
    \ SQL Server 2005 的步骤。您现在可以继续进行第 2 章。\n\n## Fresh Installation of Microsoft Content\
    \ Management Server 2002 Service Pack 2\n\n本节详细说明了使用 SQL Server 2005 执行 SP2 新安装所需的步骤。所有组件均安装在单台计算机上，并安装到其默认位置。以下安装顺序提供了所有必要的先决条件，并且从时间角度来看是最佳的安装顺序。我们从\
    \ Windows XP Professional SP2 的基本安装开始，并安装了所有 Windows 更新。安装的概要流程如下：\n\n- 配置本地安全策略。\n\
    - 创建服务帐户。\n- 安装 Internet Information Services。\n- 配置 Internet Information Services。\n\
    - 安装 SQL Server 2005。\n- 安装 SQL Server 2005 SP1。\n- 配置 SQL Server 2005。\n- 跳过\
    \ Visual Studio.NET 2003 的安装。\n- 安装 MCMS 2002 先决条件。\n- 安装 MCMS 2002 SP1a。\n- 删除临时项目。\n\
    - 安装 Visual Studio 2005。\n- 安装 MCMS 2002 SP2。\n- 使用数据库配置应用程序配置 MCMS。\n- 配置开发环境。\n\
    \n我们将在以本地计算机管理员身份登录的情况下执行所有步骤。\n\n## Configuring Local Security Policy\n\n为了验证服务帐户身份，我们需要修改\
    \ Windows XP 本地安全策略。请注意，如果您的计算机是域的成员，则本节不是必需的。\n\n1. 选择 开始 | 控制面板。\n2. 双击 管理工具，然后双击\
    \ 本地安全策略。\n   （如果看不到 管理工具，请单击 切换到经典视图 链接。）\n3. 展开 本地策略 节点，然后单击 安全选项 节点。\n4. 在策略窗格中，滚动查找\
    \ 网络访问：本地帐户的共享和安全模型 项目，然后双击它。\n5. 将组合框设置为 **经典 – 本地用户作为自己进行身份验证** 并单击 **确定**。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_38_0.png)\n\n6. 关闭 **本地安全设置** 和 **管理工具**。\n\
    \n## Creating Service Accounts\n\n我们将创建两个服务帐户，一个供 SQL Server 使用，一个用于 MCMS 系统帐户。\n\
    \n1. 从 **桌面** 右键单击 **我的电脑** 并选择 **管理**。\n2. 在 **计算机管理** 中，展开 **本地用户和组** 节点。\n\
    3. 右键单击 **用户** 文件夹并单击 **新建用户...**\n4. 在 **新建用户** 对话框中，在 **用户名称** 文本框中输入 **mssql**。\n\
    5. 提供 **全名** 和 **说明**。\n6. 提供 **密码**。\n7. 取消选中 **用户下次登录时必须更改密码** 复选框。\n8. 选中 **用户不能更改密码**\
    \ 和 **密码永不过期** 复选框，然后单击 **创建**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_39_0.png)\n\
    \n9. 在 **新建用户** 对话框中，在 **用户名称** 文本框中输入 **mcmssys**。\n10. 提供 **全名** 和 **说明**。\n\
    11. 提供 **密码**。\n12. 取消选中 **用户下次登录时必须更改密码** 复选框。\n13. 选中 用户不能更改密码 和 密码永不过期 复选框，然后单击\
    \ Create。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_40_0.png)\n\n14. 关闭 新建用户\
    \ 对话框并关闭 计算机管理。\n\n## Installing Internet Information Services\n\n以下步骤详细说明了 Internet\
    \ Information Services (IIS) 最小必需组件的安装。在 Windows Server 2003 SP1 上安装时的任何差异都已注明。\n\
    \n1. 选择 开始 | 控制面板。\n2. 双击 添加或删除程序。\n3. 单击 添加/删除 Windows 组件。\n4. 在 Windows 组件向导中，单击（注意：不是选中）\
    \ Internet Information Services (IIS) 后跟 详细信息...\n5. 在 Internet Information Services\
    \ (IIS) 对话框中，单击（注意：不是选中） World Wide Web Service 后跟 详细信息...\n6. 在 World Wide Web\
    \ Service 对话框中，选中 World Wide Web Service 项目并单击 OK。\n\n"
