    />\n        <add name=\"MCMSSiteMapProviderRight\"\n            type=\"TropicalGreen.MCMSSiteMapProviderRight\"\
    />\n    </providers>\n</siteMap>\n```\n\nThe `SiteMapProviderRight` class has\
