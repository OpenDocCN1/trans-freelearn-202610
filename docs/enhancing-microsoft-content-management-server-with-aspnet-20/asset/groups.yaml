    # 7


    # How-Tos, Tips, and Tricks


    ASP.NET 2.0 introduces many exciting new tools. In this chapter, we have put together
    several tips that you can use to enhance your sites:


    +   - **Tip #1: How to Perform Cross-Page Postbacks**: ASP.NET 2.0 introduces
    a new way of passing data from page to page. Instead of having all forms post
    data back to themselves, you may now specify an alternative form to post the data
    to. In this tip, we will take a look at how cross-page postbacks can be done,
    and the workaround required for it to be successfully implemented on MCMS pages.

    +   - **Tip #2: How to Implement an Ad Rotator**: While the Ad Rotator existed
    in earlier versions of ASP and ASP.NET, the latest version that ships with ASP.NET
    2.0 has the ability to programmatically access the data source. In this tip, we
    will build a server control that shows how you can integrate the Ad Rotator control
    directly with an MCMS resource gallery.

    +   - **Tip #3: Considerations for Microsoft Office SharePoint Server 2007**:
    In preparation for the upcoming release of Office SharePoint Portal Server, we
    take a look at some of the things that should be considered to make the migration
    of code easier.


    # Tip #1: How to Perform Cross-Page Postbacks


    Previously in ASP.NET 1.x, web forms were designed to submit information (or post
    back) only to themselves. Doing so offered the convenience of performing server-side
    processing within the page itself. Events like button clicks, page loads, and
    form submissions could be handled from the page’s code-behind file. However, because
    the form could only post to itself, sharing data across pages became a tricky
    and messy affair.'
  - '[PAGE 194]


    ASP.NET 2.0 introduces the PostBackUrl property to the Button, LinkButton, and
    ImageButton controls. With the PostBackUrl property, developers may now send postback
    data to any web form within the site. This feature is particularly useful when
    working with multiple web forms that share data or interact with one another.


    In this tip, we will take a look at the PostBackUrl feature as well as an essential
    workaround required for it to work correctly on MCMS sites. Here’s what we will
    be building. We will start by creating a page that accepts input from a user.
    Next, we will add a button that has its PostBackUrl property set to another page.
    Following which, we will build the page specified in the PostBackUrl property
    of the button and program it to accept the inputs from the first page. Finally,
    we will take a look at some required workarounds for PostBackUrl properties to
    work correctly in MCMS sites.


    # Passing Data between Pages


    A common scenario where data is passed from page to page is to have a search input
    field on all your postings or a dedicated search page that contains fields for
    entering keywords and other criteria. The entered search criteria could be submitted
    to a separate page that performs the search and displays the results.


    Or you may have a ubiquitous wizard-style dialog similar to the ones found in
    popular online stores like Amazon or eBay. Wizards break down a task (say, checking
    out the items in a shopping basket) into a series of individual steps. Information
    such as the list of items in the shopping basket, the user’s name, shipping address,
    and other details are passed from page to page until the transaction is finally
    committed.


    One way of tackling the problem would be to place all sections of the wizard in
    a single web form. The sections are usually managed by panels or tables. As the
    user progresses through the task, he or she sees only a portion of the page. Sections
    not related to the step he or she is working on are hidden from view. In this
    way, the user never leaves the page. However, the main drawback to this approach
    is that as the sections increase in both number and complexity, the page becomes
    progressively more difficult to maintain.


    Alternatively, you could call Server.Transfer(), which accepts an input parameter
    that indicates whether the state and values input fields should be preserved when
    directing from one page to another. For example, in Page1.aspx, we could call
    Page2.aspx as follows:


    ```

    ```

    Server.Transfer("Page2.aspx", true);

    ```

    ```


    By setting the second, Boolean parameter to true, the state of all form values
    will be passed to Page2.aspx. From Page2.aspx, we can retrieve input field values
    using the Request.Form collection:


    ```

    ```

    string myText = Request.Form["MyText"];

    ```

    ```'
  - '[PAGE 195]


    However, `Server.Transfer()` suffers from several drawbacks. Firstly, the URL
    on the address bar remains the same from page to page, which may not be desirable.
    More importantly, `Server.Transfer()` cannot be used in combination with MCMS
    pages because it bypasses the ISAPI filter.


    Another solution would be to pass the entire chunk of information using query
    strings. Nevertheless, query strings suffer from a couple of limitations. Not
    only do long query strings create unfriendly looking URLs, the value is exposed
    in the address bar of the browser, giving users the opportunity to alter its value
    causing the application to behave unexpectedly. Also, if the length exceeds the
    maximum allowable length of a query string, data may get lost along the way.


    You could even store the data in session variables or in database tables. While
    these methods work, they are expensive to implement and may result in performance
    issues. For example, session objects are usually stored in the server’s memory.
    Maintaining the session state of thousands of simultaneous users may take up a
    significant amount of memory — and if not managed properly may cause a site to
    crash.


    With so many pitfalls and considerations, how then should we pass data from one
    page to another? The new `PostBackUrl` property in button controls offers an attractive
    alternative. Instead of managing the page’s state in sections or intermediate
    storage locations like query strings, session objects, or database tables, we
    can simply post the data directly to another form. Let’s take a look at how it’s
    implemented.


    # The "Order a Plant" Wizard


    To demonstrate how the `PostBackUrl` property works, we will create a wizard that
    guides visitors through the process of ordering plants from the TropicalGreen
    society. To keep things simple, we will just have two screens.


    In the first screen, visitors will enter their name and address. They will also
    select a plant from a drop-down list.


    ![](img/18a0aa8d36427a4c069b30410f998b8e_195_0.png)'
