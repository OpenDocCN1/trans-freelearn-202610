    \ days\n    PostingCollection newPostings = cmsContext.Searches.NewPostings(7);\n\
    \n    // Bind the result to the DataGrid\n    DataGrid1.DataSource = newPostings;\n\
    \    DataGrid1.DataBind();\n}\n```\n\n为了模块化代码并将与 MCMS PAPI 交互的部分与使用 PAPI 的部分隔离开来，可以创建一个数据抽象层。数据抽象层可以是一个单独的类文件。在开始模块化代码之前，让我们先识别出使用\
    \ MCMS PAPI 的部分。如下所示，使用 PAPI 的代码行是获取当前 CmsHttpContext 以及最近七天内修改的帖子列表的部分：\n\n```\n\
    protected System.Web.UI.WebControls.DataGrid DataGrid1;\nprivate void Page_Load(object\
    \ sender, System.EventArgs e)\n{\n    // Get the current CMS Http context\n  \
    \  CmsHttpContext cmsContext = CmsHttpContext.Current;\n\n    // Get a list of\
    \ all postings that have been modified in the last\n    // 7 days\n    PostingCollection\
    \ newPostings = cmsContext.Searches.NewPostings(7);\n\n    // Bind the result\
    \ to the DataGrid\n    DataGrid1.DataSource = newPostings;\n    DataGrid1.DataBind();\n\
    }\n```\n\n为了隔离代码，我们将提取所有突出显示的代码部分并将其添加到数据抽象层中。在此示例中，数据抽象层只是一个名为 DataAbstractionExample\
    \ 的单独类文件。这里有两个方法：GetCurrentCMSContext() 获取当前 CmsHttpContext，而 GetListOfPostings()\
    \ 返回最近七天内修改的所有帖子的列表。\n\n```\npublic class DataAbstractionExample\n{\n    private\
    \ static CmsHttpContext GetCurrentCMSContext()\n    {\n        return CmsHttpContext.Current;\n\
    \    }\n    public static PostingCollection GetListOfPostings()\n    {\n     \
    \   // Get the current CMS Http Context\n        CmsHttpContext cmsContext = GetCurrentCMSContext();\n\
    \        // Get a list of all postings that have been modified in the\n      \
    \  // last 7 days\n        PostingCollection newPostings =\n            cmsContext.Searches.NewPostings(7);\n\
    \        return newPostings;\n    }\n```\n```\n\n接下来，我们修改原始代码，使其改为调用数据抽象层中的 GetListOfPostings()。请注意，我们已从\
    \ Page_Load() 事件处理程序中移除了所有使用 MCMS PAPI 的代码。\n\n```\n    protected System.Web.UI.WebControls.DataGrid\
    \ DataGrid1;\n    private void Page_Load(object sender, System.EventArgs e)\n\
    \    {\n        // Bind the result to the DataGrid\n        DataGrid1.DataSource\
    \ = DataAbstractionExample.GetListOfPostings(7);\n        DataGrid1.DataBind();\n\
    \    }\n```\n```\n\n乍一看，提取所有与 PAPI 接口的代码似乎不会对网站的行为产生任何影响。事实上，我们所做的只是向应用程序添加了更多代码行，使其变得稍微复杂一些。\n\
    \n尽管如此，将代码分离成模块化层会使迁移过程变得更容易，如果你以后选择进行迁移的话。与其在网站的分散区域进行代码修改，你可以将精力集中在数据抽象层上。在此示例中，我们只需要修改\
    \ DataAbstractionExample 类即可，而原始 Web 表单（以及所有使用 GetListOfPostings() 方法的其他 Web 表单）保持不变。\n\
    \n此外，根据你网站的设置，可能可以让 MCMS 和 MOSS 2007 并行运行并分阶段升级网站。这样，你可以计划分段重写数据抽象层。分阶段方法的优势在于，你可以在整个网站升级完成之前就享受到\
    \ MOSS 2007 的新功能。\n\n## 使用提供程序模型设计模式\n\n在本書中，我們討論了在構建站點導航控件（第 4 章）或執行窗體身份驗證（第\
    \ 6 章）時如何使用提供程序模型。\n\n使用提供程序模型扩展了将使用 PAPI 的代码与代码其他部分隔离开来的思想。正如我们在前几章中所看到的，提供程序模型允许我们将“业务逻辑”，它查询\
    \ MCMS 仓库，与“表示逻辑”，负责向浏览器返回 HTML 分离。例如，在构建站点导航时，我们使用了标准的 `SiteMapPath` 和 `TreeView`\
    \ 控件作为表示逻辑。然后我们通过构建 `MCMSsiteMapProvider` 类来实现业务逻辑，该类使用 PAPI 查询仓库以获取导航项列表。\n\n\
    当升级网站时，只需替换提供程序模型即可，要么使用原生的 MOSS 2007 功能，要么使用与 MOSS 通信的替代提供程序。例如，要升级 TropicalGreen\
    \ 站点的导航控件，我们只需重写 `MCMSsiteMapProvider.cs` 类文件即可。表示层中的 `SiteMapPath` 或 `TreeView`\
    \ 控件可以无需进一步修改即可重复使用。\n\n> 有关如何规划 MOSS 2007 未来发布的更多详细信息，请参阅以下白皮书：\n> http://msdn.microsoft.com/library/en-us/dnmscms02/html/CMSDesigningCMS2002Sol.asp\n\
    \n## 摘要\n\n在本章中，我们讨论了一些有助于使用 MCMS 开发网站的技巧。首先我们看到了如何使用 `PostBackUrl` 属性在页面之间传递数据。随后，我们设计了一种变通方法，使其在\
    \ MCMS 网站上正常工作。\n\n接下来，我们讨论了随 ASP.NET 2.0 提供的巧妙的 Ad Rotator 控件。虽然 Ad Rotator 控件已经存在一段时间了，但这个最新版本允许我们将控件的内容直接绑定到非静态\
    \ XML 文件。我们现在能够将控件直接与 MCMS 资源库项目集成，为我们的工具箱提供了一个灵活且有用的补充。\n\n最后，我们讨论了一些未来计划的考虑因素，以便于将现有应用程序迁移到下一个版本的\
    \ MOSS 2007。\n\n## 索引\n\nA\nActive Directory 应用程序模式\n  关于 182\n  用于身份验证 181\n\
