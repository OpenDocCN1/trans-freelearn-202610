    \ 属性中存储的值的值。基本上，这就是跨回发功能的工作方式。\n\n```\nfunction WebForm_DoPostBackWithOptions(options)\n\
    {\n    . . . code continues . . .\n\n    if ((typeof(options.actionUrl) != \"\
    undefined\") &&\n        (options.actionUrl != null) &&\n        (options.actionUrl.length\
    \ > 0))\n    {\n        theForm.action = options.actionUrl;\n    }\n    . . .\
