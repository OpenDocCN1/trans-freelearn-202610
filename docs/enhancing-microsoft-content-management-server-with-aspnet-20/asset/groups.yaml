    | Property | Value |

    |---|---|

    | ID | SiteMapDataSourceSummary |

    | SiteMapProvider | MCMSSiteMapProviderSummary |

    | ShowStartingNode | False |


    We have set the SiteMapDataSource to link to the site map provider that we built
    earlier: MCMSSiteMapProviderSummary. Note that as we don’t want the currently
    viewed channel to be displayed as part of the list, we have set the ShowStartingNode
    property to false.


    4. Next, drag a TreeView control from the Navigation section of the toolbox and
    drop it anywhere in the content area. Give it the following property values:


    | Property | Value |

    |---|---|

    | ID | TreeView1 |

    | DataSourceID | SiteMapDataSourceSummary |

    | MaxDataBindDepth | 1 |

    | ShowExpandCollapse | False |


    By setting the MaxDataBindDepth property to 1, we have ensured that the TreeView
    control will never show more than one level of items. In this way, the list will
    always be flat. Also, we set ShowExpandCollapse to false to prevent the expandable
    plus [+] and minus [-] signs from appearing.


    5. Finally, to display a bullet next to each item on the list, we will manually
    define the binding of each node. Toggle to Source view and add the highlighted
    code between the <asp:TreeView> tags.


    ```

    <asp:TreeView ID="TreeView1" runat="server" DataSourceID="SiteMapDataSourceSummary"
    MaxDataBindDepth="1" ShowExpandCollapse="False">

    <DataBindings>

    <asp:TreeNodeBinding TextField="Title" NavigateUrlField="Url" ToolTipField="Description"
    FormatString=''<li>{0}</>'' />

    </DataBindings>

    </asp:TreeView>

    ```


    We have bound the tree view node to the Title, Url, and Description properties
    of the site-map node. In addition, by setting the FormatString to include the
    <li> tag, we have included a bullet to be printed next to each item.


    6. The page is completed. Save and compile the website.'
