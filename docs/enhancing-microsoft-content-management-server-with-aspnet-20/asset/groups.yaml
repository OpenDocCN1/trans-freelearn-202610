    ## 摘要


    我们已回顾了新的 Visual Studio 2005 MCMS 开发环境的基础知识，配置了 ''CMS'' 虚拟目录，并为 MCMS 创建了自己的自定义
    Visual Studio 2005 模板。我们现在准备使用 ASP.NET 2.0 深入 MCMS 开发！


    ## 3


    ## 使用母版页


    ASP.NET 2.0 引入的最佳功能之一是母版页，它允许开发人员在应用程序内的页面之间强制执行统一的布局和行为。虽然初看时许多母版页概念与 MCMS 模板相似，但在
    MCMS 应用程序中使用母版页可以获得许多好处。


    本章概述了使用母版页的好处，并为在 MCMS 应用程序中实现母版页提供了逐步指南，在那里它们成为母版模板！


    ### 母版页的概述和优势


    一 **母版页** 包含通用标记和一个或多个 **内容占位符**。从此母版页可以创建新的 **内容页**，其中包含链接到母版页中内容占位符的 **内容控件**。这提供了一种理想的方式来将通用站点品牌、导航等与实际内容页面分离，并且可以显著减少重复和标记错误。


    与以前相比，母版页使使用模板文件变得更加容易。您可以向母版页添加通用标记和共享控件，例如页眉、页脚和导航栏。一旦母版页构建完成，您就可以基于它创建 MCMS
    模板文件。模板文件将立即采用母版模板中定义的风格。


    您还可以通过引入内容占位符来标记母版页的某些区域为可自定义（请注意，这些是专门为母版页设计的控件，不应与 MCMS 占位符控件混淆）。内容占位符标记的空间提供了可以添加单个模板标记以及
    MCMS 占位符控件的区域，如下图所示：


    ![](img/18a0aa8d36427a4c069b30410f998b8e_100_0.png)


    虽然乍一看，母版页和 MCMS 模板都提供了一种标准化站点外观和感觉的方式，但它们的相似之处仅此而已。不要误以为母版页完全取代了 MCMS 模板的作用。两者之间的一个关键区别是，母版页的使用仅限于站点开发人员，以确保创建的模板文件具有统一的外观和感觉。您不能创建母版页并期望作者使用它来创建帖子。


    事实上，母版页与模板文件一起工作，并为 MCMS 开发人员提供许多好处。


    - **避免 MCMS 模板文件中的重复：** 通常 MCMS 模板包含通用页面布局代码（通常是 HTML 表格）以及导航栏、页眉和页脚（通常是 Web 用户控件）。此代码必须在创建后复制并粘贴到每个新模板文件中，或抽象为用户控件。此外，对此通用代码布局的更改必须应用于所有模板文件。因此，例如，具有十个模板文件的
    MCMS 应用程序将重复此标记十次。通过将此标记放在母版页中，可以消除这种重复。

    - **将站点范围标记与模板标记分离：** MCMS 最大的缺点之一是模板开发任务无法轻松分离。常见要求是将定义站点品牌、布局以及开发导航等控件的任务（由网站管理员和程序员执行）与设计模板布局的任务（由业务用户执行）分离。虽然由于
    MCMS 的固有架构，母版页和 Visual Studio 2005 并不能完全解决这个问题，但它们在此方面提供了实质性改进。

    - **避免 MCMS 模板文件 Visual Studio 模板的问题：** MCMS 项目项模板存在一些问题，并且没有完全采用 Visual Studio
    2005 项目系统。虽然任何 Web 表单都可以被 MCMS“启用”，但母版页提供了更无缝的开发体验，需要的手动调整更少。

    - **Visual Studio 2005 设计器支持：** 在 Visual Studio .NET 中使用模板文件中的用户控件时常见问题是，模板设计视图不能为模板开发人员提供足够的体验。Visual
    Studio 2005 提供了改进的设计视图体验，包括渲染用户控件内容，这在处理母版页时尤其有价值。

    - **母版页的经验：** 正如 MCMS 是学习 ASP.NET 的好方法一样，MCMS SP2 是学习 ASP.NET 2.0 的好方法！此外，母版页是微软未来
    Web 内容管理产品的基础构建块。


    > 母版页中的 MCMS 占位符控件可以工作，但不受官方支持。


    正如本章将看到的，母版页提供了一种理想的方式来将通用站点品牌、导航等与实际内容页面分离，并且可以显著减少重复和标记错误。


    ### TropicalGreen 网站


    Tropical Green 是本书示例网站所基于的虚构园艺协会。在 Packt Publishing 出版的书籍 *使用 Microsoft 内容管理服务器构建网站*（ISBN
    1-904811-16-7）中，我们使用 ASP.NET 1.x 从头开始构建了 Tropical Green 网站。


    在本书中，我们将尝试使用 MCMS SP2 和 ASP.NET 2.0 重建网站的部分内容。虽然代码将从头重写，但我们不会从空白数据库开始。相反，我们将走捷径并从
    Packt Publishing 网站支持部分提供的 `TropicalGreen.sdo` 文件中导入 TropicalGreen 数据库对象（http://www.packtpub.com/support）。

    '
