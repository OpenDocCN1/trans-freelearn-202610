  - "[PAGE 163]\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_163_0.png)\n\n3. The skin\
    \ file contains sample code that shows how a skin template looks. We won’t need\
    \ the sample for our example. Delete all existing code.\n\n4. Now let’s define\
    \ a skin for the SiteMapPath control. For a dramatic effect so that we can see\
    \ the difference in the screenshots later, we will set the font size to be extra\
    \ large. Enter the following code in the skin file:\n\n```\n<asp:SiteMapPath runat=\"\
    server\" Font-Names=\"Verdana\" Font-Size=\"X-Large\" PathSeparator=\":\">\n \
    \   <PathSeparatorStyle Font-Bold=\"True\" ForeColor=\"green\"/>\n    <CurrentNodeStyle\
    \ ForeColor=\"orange\"/>\n    <NodeStyle Font-Bold=\"True\" ForeColor=\"green\"\
    />\n    <RootNodeStyle Font-Bold=\"True\" ForeColor=\"green\"/>\n</asp:SiteMapPath>\n\
    ```\n\nThe code does not look very different from that in specified the original\
    \ control. The difference is that the code now sits in a skin file instead of\
    \ being embedded within the template file, providing a clean separation of design\
    \ and application!\n\nSince the skin that we have created is a default skin, we\
    \ don’t need to do anything more to see it in action. All SiteMapPath controls\
    \ on the TropicalGreen site will"
  - "[PAGE 164]\n\nimmediately adopt the style provided by the skin. Navigate to any\
    \ page on the website. The nodes of the breadcrumb trail now show up with bold\
    \ green Verdana font, with the exception of the current node, which is orange,\
    \ with extra large fonts as defined in the skin.\n\nHome : Plant Catalog : Aloe\
    \ Vera\n\n# Creating a Name-Controlled Skin\n\nWhat happens when there are controls\
    \ on the page that should not adopt the default skin? For example, in the SiteMapPath\
    \ control skinned earlier, we set the default skin to display extra-large sized\
    \ fonts. If we didn’t want to change the default skin, and yet apply a different\
    \ font setting, we could use name-controlled skins.\n\nA name-controlled skin\
    \ makes use of the SkinID property. Here’s how it works. First, we set the SkinID\
    \ of the control defined in the skin file. Next, we identify the controls in the\
    \ web form that will adopt that particular skin and set the SkinID of those controls\
    \ to match the value of the skin. In this way, only controls with the same SkinID\
    \ will adopt the look and feel of the skin.\n\nLet’s try giving the site map control\
    \ a skin with normal sized fonts. Append a skin control in the Sunny.skin file\
    \ as follows. Notice that we have set the font size to be Medium and the SkinID\
    \ to Breadcrumb.\n\n```\n<asp:SiteMapPath runat=\"server\" Font-Names=\"Verdana\"\
    \n    PathSeparator=\":\"\n    Font-Size=\"Medium\" SkinID=\"Breadcrumb\">\n \
    \   <PathSeparatorStyle Font-Bold=\"True\" ForeColor=\"green\"/>\n    <CurrentNodeStyle\
    \ ForeColor=\"orange\"/>\n    <NodeStyle Font-Bold=\"True\" ForeColor=\"green\"\
    />\n    <RootNodeStyle Font-Bold=\"True\" ForeColor=\"green\"/>\n</asp:SiteMapPath>\n\
    ```\n\nIn order for the site map control to pick up the name-controlled skin,\
    \ we need to assign the SkinID of the control to Breadcrumb as well. In the tropicalgreen.master\
    \ file, set the SkinID of the control as shown:\n\n```\n<asp:SiteMapPath ID=\"\
    SiteMapPath1\" runat=\"server\" SkinID=\"Breadcrumb\">\n</asp:SiteMapPath>\n```\n\
    \nSave the file. Now, navigate to any of the existing plant postings. The font-size\
    \ is back to normal, showing that the control now adopts the name-controlled skin\
    \ instead of the default skin."
  - "[PAGE 165]\n\nHome : Plant Catalog : Aloe Vera\n\n# Completing the Skin\n\nLet’s\
    \ complete the skin file by defining skins for both the top horizontal menu and\
    \ right vertical menu.\n\nFirst, with Tropicalgreen.master open, remove some of\
    \ the style elements added to the top menu earlier such that the code looks as\
    \ follows:\n\n```\n<asp:Menu ID=\"Menu1\" runat=\"server\" DataSourceID=\"SiteMapDataSourceTop\"\
    \nSkinID=\"TopMenu\">\n</asp:Menu>\n```\n\nWe will also remove any style elements\
    \ that may have been added to the right menu. The code for the right menu should\
    \ resemble the following:\n\n```\n<asp:Menu ID=\"Menu2\" runat=\"server\" DataSourceID=\n\
    \"SiteMapDataSourceRight\" SkinID=\"RightMenu\">\n</asp:Menu>\n```\n\nNow let’s\
    \ add these style elements back using skins. Add the following skin definitions\
    \ to the Sunny.skin file.\n\n```\n<asp:Menu SkinID=\"TopMenu\" runat=\"server\"\
    \ Orientation=\"Horizontal\"\n    MaximumDynamicDisplayLevels=\"1\" StaticDisplayLevels=\"\
    2\"\n    StaticMenuItemStyle-CssClass=\"TopMenu\"\n    StaticEnableDefaultPopOutImage=\"\
    False\">\n</asp:Menu>\n\n<asp:Menu SkinID=\"RightMenu\" runat=\"server\" Orientation=\"\
    Vertical\"\n    MaximumDynamicDisplayLevels=\"1\" StaticDisplayLevels=\"1\"\n\
    \    StaticMenuItemStyle-CssClass=\"RightMenu\"\n    StaticEnableDefaultPopOutImage=\"\
    False\">\n</asp:Menu>\n```\n\nWe have added skin definitions for both menus; now\
    \ set the SkinID of the menus to match those of the skins:\n\n| Control ID | Set\
    \ the SkinID to |\n|------------|-------------------|\n| MenuTop | TopMenu |\n\
    | MenuRight | RightMenu |"
  - '[PAGE 166]


    Notice that the skin definitions make use of cascading style sheets (see the CssClass
    property). We have not created any style sheets yet; so if you took a look at
    any themed page, you probably wouldn’t see much difference after applying the
    new skin. Let’s take a look at how skins and style sheets work together within
    a theme.


    # Using Style Sheets


    We have seen how skins can be used to apply specific styles on ASP.NET server
    controls. They are really useful for styling elements such as navigation, form,
    and other server-side-based controls. Without a doubt, they are pretty nifty and
    practical tools to have in our toolbox.


    However, in the world of MCMS, an important aspect of ensuring that the site has
    a consistent look and feel throughout is to make sure that content entered by
    authors in placeholder controls, like the HtmlPlaceholderControl, also follows
    the style guidelines of the website. In order to enforce design rules of HTML
    content, skins do not help us very much. For HTML controls and code, we still
    have to make use of good old cascading style sheets.


    Previously, to apply a CSS file to a site, we would add a <link> tag to all template
    files and web forms that required it:


    ```

    <link type="text/css" href="UrlOfFile.css"/>

    ```


    Or, we could embed styles directly within the page itself, using <style> tags:


    ```

    <style>

    H1{color:#993300;font-weight:bold;font-size:14pt}

    </style>

    ```


    Either technique will work, but still can be a messy affair especially when working
    with multiple style sheets and web forms.


    The good news is: themes support CSS as well. Now, we can add the CSS file directly
    to the theme. Behind the scenes, ASP.NET will generate the <link> tag for us.


    # Creating a Style Sheet


    The master template of the TropicalGreen site is made up mostly of tables. In
    addition, all custom content entered by authors is limited to regular HTML text.
    As these aren’t ASP.NET server controls, they do not support skins. To ensure
    that the look and feel of such content is consistent with the rest of the site,
    we need to apply a style sheet.'
  - "[PAGE 167]\n\nLet’s try adding styling to the rest of the TropicalGreen site\
    \ by using style sheets.\n\n+   1. To add a style sheet to a theme, right-click\
    \ on the **Sunny** theme folder in **Solution Explorer** and select **Add New\
    \ Item...**\n+   2. In the **Add New Item** dialog, choose the **Style Sheet**\
    \ template and name the file **Sunny.css**.\n+   3. The style sheet that we will\
    \ use in this example is a relatively simple one. We will specify styles for the\
    \ body, anchor, and a couple of header levels, as well as a few named styles for\
    \ the banner and menus. Enter the following code:\n+   10. Save Sunny.css.\n\n\
    ```\nBody {font-family:Verdana,Arial;font-size:11pt}\nA{color:#0000FF;font-size:10pt;font-weight:bold}\n\
    H1{color:#993300;font-weight:bold;font-size:14pt}\nH2{color:#FF6600;font-weight:bold;font-size:12pt}\n\
    .Banner{background-color:#ffcc00}\n.TopMenu{background-color:#66cc33;font-weight:bold;color:#CCFF99;\n\
    \        text-decoration:none;padding:5px;}\n.RightMenu{background-color:#669900;color:#CCFF99;\n\
    \        text-decoration: none; font-weight:bold;padding:5px;}\n```\n\n> We won’t\
    \ go into the details of the syntax of CSS. For a primer on CSS, take a look at\
    \ the following website:\n> http://www.w3c.rl.ac.uk/primers/css/cssprimer.htm.\n\
    \n> Visual Studio also ships with a **Style Builder** that provides a graphical\
    \ interface for defining styles. To launch the **Style Builder**, toggle to **Design**\
    \ view and select **Format | Style** from the menu.\n\nNow, take a look at any\
    \ existing plant posting on the TropicalGreen website. The styles have been successfully\
    \ applied on the posting."
  md: "\n![](img/18a0aa8d36427a4c069b30410f998b8e_163_0.png)\n\n3. The skin file contains\
    \ sample code that shows how a skin template looks. We won’t need the sample for\
    \ our example. Delete all existing code.\n\n4. Now let’s define a skin for the\
    \ SiteMapPath control. For a dramatic effect so that we can see the difference\
    \ in the screenshots later, we will set the font size to be extra large. Enter\
    \ the following code in the skin file:\n\n```\n<asp:SiteMapPath runat=\"server\"\
    \ Font-Names=\"Verdana\" Font-Size=\"X-Large\" PathSeparator=\":\">\n    <PathSeparatorStyle\
    \ Font-Bold=\"True\" ForeColor=\"green\"/>\n    <CurrentNodeStyle ForeColor=\"\
    orange\"/>\n    <NodeStyle Font-Bold=\"True\" ForeColor=\"green\"/>\n    <RootNodeStyle\
    \ Font-Bold=\"True\" ForeColor=\"green\"/>\n</asp:SiteMapPath>\n```\n\nThe code\
    \ does not look very different from that in the original control. The difference\
    \ is that the code now sits in a skin file instead of being embedded within the\
    \ template file, providing a clean separation of design and application!\n\nSince\
    \ the skin that we have created is a default skin, we don’t need to do anything\
    \ more to see it in action. All SiteMapPath controls on the TropicalGreen site\
    \ will immediately adopt the style provided by the skin. Navigate to any page\
    \ on the website. The nodes of the breadcrumb trail now show up with bold green\
    \ Verdana font, with the exception of the current node, which is orange, with\
    \ extra large fonts as defined in the skin.\n\nHome : Plant Catalog : Aloe Vera\n\
    \n## Creating a Name-Controlled Skin\n\nWhat happens when there are controls on\
    \ the page that should not adopt the default skin? For example, in the SiteMapPath\
    \ control skinned earlier, we set the default skin to display extra-large sized\
    \ fonts. If we didn’t want to change the default skin, and yet apply a different\
    \ font setting, we could use name-controlled skins.\n\nA name-controlled skin\
    \ makes use of the SkinID property. Here’s how it works. First, we set the SkinID\
    \ of the control defined in the skin file. Next, we identify the controls in the\
    \ web form that will adopt that particular skin and set the SkinID of those controls\
    \ to match the value of the skin. In this way, only controls with the same SkinID\
    \ will adopt the look and feel of the skin.\n\nLet’s try giving the site map control\
    \ a skin with normal sized fonts. Append a skin control in the Sunny.skin file\
    \ as follows. Notice that we have set the font size to be Medium and the SkinID\
    \ to Breadcrumb.\n\n```\n<asp:SiteMapPath runat=\"server\" Font-Names=\"Verdana\"\
    \n    PathSeparator=\":\"\n    Font-Size=\"Medium\" SkinID=\"Breadcrumb\">\n \
    \   <PathSeparatorStyle Font-Bold=\"True\" ForeColor=\"green\"/>\n    <CurrentNodeStyle\
    \ ForeColor=\"orange\"/>\n    <NodeStyle Font-Bold=\"True\" ForeColor=\"green\"\
    />\n    <RootNodeStyle Font-Bold=\"True\" ForeColor=\"green\"/>\n</asp:SiteMapPath>\n\
    ```\n\nIn order for the site map control to pick up the name-controlled skin,\
    \ we need to assign the SkinID of the control to Breadcrumb as well. In the tropicalgreen.master\
    \ file, set the SkinID of the control as shown:\n\n```\n<asp:SiteMapPath ID=\"\
    SiteMapPath1\" runat=\"server\" SkinID=\"Breadcrumb\">\n</asp:SiteMapPath>\n```\n\
    \nSave the file. Now, navigate to any of the existing plant postings. The font-size\
    \ is back to normal, showing that the control now adopts the name-controlled skin\
    \ instead of the default skin.\n\nHome : Plant Catalog : Aloe Vera\n\n## Completing\
    \ the Skin\n\nLet’s complete the skin file by defining skins for both the top\
    \ horizontal menu and right vertical menu.\n\nFirst, with Tropicalgreen.master\
    \ open, remove some of the style elements added to the top menu earlier such that\
    \ the code looks as follows:\n\n```\n<asp:Menu ID=\"Menu1\" runat=\"server\" DataSourceID=\"\
    SiteMapDataSourceTop\"\nSkinID=\"TopMenu\">\n</asp:Menu>\n```\n\nWe will also\
    \ remove any style elements that may have been added to the right menu. The code\
    \ for the right menu should resemble the following:\n\n```\n<asp:Menu ID=\"Menu2\"\
    \ runat=\"server\" DataSourceID=\n\"SiteMapDataSourceRight\" SkinID=\"RightMenu\"\
    >\n</asp:Menu>\n```\n\nNow let’s add these style elements back using skins. Add\
    \ the following skin definitions to the Sunny.skin file.\n\n```\n<asp:Menu SkinID=\"\
    TopMenu\" runat=\"server\" Orientation=\"Horizontal\"\n    MaximumDynamicDisplayLevels=\"\
    1\" StaticDisplayLevels=\"2\"\n    StaticMenuItemStyle-CssClass=\"TopMenu\"\n\
    \    StaticEnableDefaultPopOutImage=\"False\">\n</asp:Menu>\n\n<asp:Menu SkinID=\"\
    RightMenu\" runat=\"server\" Orientation=\"Vertical\"\n    MaximumDynamicDisplayLevels=\"\
    1\" StaticDisplayLevels=\"1\"\n    StaticMenuItemStyle-CssClass=\"RightMenu\"\n\
    \    StaticEnableDefaultPopOutImage=\"False\">\n</asp:Menu>\n```\n\nWe have added\
    \ skin definitions for both menus; now set the SkinID of the menus to match those\
    \ of the skins:\n\n| Control ID | Set the SkinID to |\n|------------|-------------------|\n\
    | MenuTop | TopMenu |\n| MenuRight | RightMenu |\n\nNotice that the skin definitions\
    \ make use of cascading style sheets (see the CssClass property). We have not\
    \ created any style sheets yet; so if you took a look at any themed page, you\
    \ probably wouldn’t see much difference after applying the new skin. Let’s take\
    \ a look at how skins and style sheets work together within a theme.\n\n## Using\
    \ Style Sheets\n\nWe have seen how skins can be used to apply specific styles\
    \ on ASP.NET server controls. They are really useful for styling elements such\
    \ as navigation, form, and other server-side-based controls. Without a doubt,\
    \ they are pretty nifty and practical tools to have in our toolbox.\n\nHowever,\
    \ in the world of MCMS, an important aspect of ensuring that the site has a consistent\
    \ look and feel throughout is to make sure that content entered by authors in\
    \ placeholder controls, like the HtmlPlaceholderControl, also follows the style\
    \ guidelines of the website. In order to enforce design rules of HTML content,\
    \ skins do not help us very much. For HTML controls and code, we still have to\
    \ make use of good old cascading style sheets.\n\nPreviously, to apply a CSS file\
    \ to a site, we would add a <link> tag to all template files and web forms that\
    \ required it:\n\n```\n<link type=\"text/css\" href=\"UrlOfFile.css\"/>\n```\n\
    \nOr, we could embed styles directly within the page itself, using <style> tags:\n\
    \n```\n<style>\nH1{color:#993300;font-weight:bold;font-size:14pt}\n</style>\n\
    ```\n\nEither technique will work, but still can be a messy affair especially\
    \ when working with multiple style sheets and web forms.\n\nThe good news is:\
    \ themes support CSS as well. Now, we can add the CSS file directly to the theme.\
    \ Behind the scenes, ASP.NET will generate the <link> tag for us.\n\n## Creating\
    \ a Style Sheet\n\nThe master template of the TropicalGreen site is made up mostly\
    \ of tables. In addition, all custom content entered by authors is limited to\
    \ regular HTML text. As these aren’t ASP.NET server controls, they do not support\
    \ skins. To ensure that the look and feel of such content is consistent with the\
    \ rest of the site, we need to apply a style sheet.\n\nLet’s try adding styling\
    \ to the rest of the TropicalGreen site by using style sheets.\n\n- 1. To add\
    \ a style sheet to a theme, right-click on the **Sunny** theme folder in **Solution\
    \ Explorer** and select **Add New Item...**\n- 2. In the **Add New Item** dialog,\
    \ choose the **Style Sheet** template and name the file **Sunny.css**.\n- 3. The\
    \ style sheet that we will use in this example is a relatively simple one. We\
    \ will specify styles for the body, anchor, and a couple of header levels, as\
    \ well as a few named styles for the banner and menus. Enter the following code:\n\
    - 4. Save Sunny.css.\n\n```\nBody {font-family:Verdana,Arial;font-size:11pt}\n\
    A{color:#0000FF;font-size:10pt;font-weight:bold}\nH1{color:#993300;font-weight:bold;font-size:14pt}\n\
    H2{color:#FF6600;font-weight:bold;font-size:12pt}\n.Banner{background-color:#ffcc00}\n\
    .TopMenu{background-color:#66cc33;font-weight:bold;color:#CCFF99;\n        text-decoration:none;padding:5px;}\n\
    .RightMenu{background-color:#669900;color:#CCFF99;\n        text-decoration: none;\
    \ font-weight:bold;padding:5px;}\n```\n\n> We won’t go into the details of the\
    \ syntax of CSS. For a primer on CSS, take a look at the following website:\n\
    > http://www.w3c.rl.ac.uk/primers/css/cssprimer.htm.\n\n> Visual Studio also ships\
    \ with a **Style Builder** that provides a graphical interface for defining styles.\
    \ To launch the **Style Builder**, toggle to **Design** view and select **Format\
    \ | Style** from the menu.\n\nNow, take a look at any existing plant posting on\
    \ the TropicalGreen website. The styles have been successfully applied on the\
    \ posting.\n"
  mdcn: "\n![](img/18a0aa8d36427a4c069b30410f998b8e_163_0.png)\n\n3. 皮肤文件包含示例代码，展示皮肤模板的外观。我们在示例中不需要该示例。请删除所有现有代码。\n\
    \n4. 现在让我们为 SiteMapPath 控件定义一个皮肤。为了产生戏剧性效果，以便稍后在屏幕截图中可以看到差异，我们将字体大小设置为超大。请在皮肤文件中输入以下代码：\n\
    \n```\n<asp:SiteMapPath runat=\"server\" Font-Names=\"Verdana\" Font-Size=\"X-Large\"\
    \ PathSeparator=\":\">\n    <PathSeparatorStyle Font-Bold=\"True\" ForeColor=\"\
    green\"/>\n    <CurrentNodeStyle ForeColor=\"orange\"/>\n    <NodeStyle Font-Bold=\"\
    True\" ForeColor=\"green\"/>\n    <RootNodeStyle Font-Bold=\"True\" ForeColor=\"\
    green\"/>\n</asp:SiteMapPath>\n```\n\n该代码与原始控件中的代码看起来并没有太大不同。不同之处在于，代码现在位于皮肤文件而不是嵌入在模板文件中，从而实现了设计与应用的清晰分离！\n\
    \n由于我们创建的皮肤是默认皮肤，因此无需做任何其他操作即可看到其效果。TropicalGreen 网站上的所有 SiteMapPath 控件将立即采用皮肤提供的样式。导航到网站上的任何页面。面包屑轨迹的节点现在以粗体绿色\
    \ Verdana 字体显示，当前节点除外，当前节点为橙色，字体大小为皮肤中定义的超大字体。\n\nHome : Plant Catalog : Aloe\
    \ Vera\n\n## 创建名称受控皮肤\n\n当页面上存在不应采用默认皮肤的控件时会怎样？例如，在前面皮肤化的 SiteMapPath 控件中，我们将默认皮肤设置为显示超大字体。如果我们不想更改默认皮肤，但又要应用不同的字体设置，则可以使用名称受控皮肤。\n\
    \n名称受控皮肤使用 SkinID 属性。工作原理如下。首先，我们设置皮肤文件中定义的控件的 SkinID。接下来，我们识别将在 Web 表单中采用该特定皮肤的控件，并将这些控件的\
    \ SkinID 设置为与皮肤的值匹配。这样，只有具有相同 SkinID 的控件才会采用皮肤的外观和感觉。\n\n让我们尝试为站点地图控件提供一个字体大小为正常的皮肤。按如下方式在\
    \ Sunny.skin 文件中追加一个皮肤控件。请注意，我们已将字体大小设置为 Medium，并将 SkinID 设置为 Breadcrumb。\n\n\
    ```\n<asp:SiteMapPath runat=\"server\" Font-Names=\"Verdana\"\n    PathSeparator=\"\
    :\"\n    Font-Size=\"Medium\" SkinID=\"Breadcrumb\">\n    <PathSeparatorStyle\
    \ Font-Bold=\"True\" ForeColor=\"green\"/>\n    <CurrentNodeStyle ForeColor=\"\
    orange\"/>\n    <NodeStyle Font-Bold=\"True\" ForeColor=\"green\"/>\n    <RootNodeStyle\
    \ Font-Bold=\"True\" ForeColor=\"green\"/>\n</asp:SiteMapPath>\n```\n\n为了使站点地图控件拾取名称受控皮肤，我们还需要将控件的\
    \ SkinID 分配为 Breadcrumb。在 tropicalgreen.master 文件中，按如下所示设置控件的 SkinID：\n\n```\n\
    <asp:SiteMapPath ID=\"SiteMapPath1\" runat=\"server\" SkinID=\"Breadcrumb\">\n\
    </asp:SiteMapPath>\n```\n\n保存文件。现在，导航到任何现有的植物发布内容。字体大小已恢复正常，表明控件现在采用名称受控皮肤而不是默认皮肤。\n\
    \nHome : Plant Catalog : Aloe Vera\n\n## 完成皮肤\n\n让我们通过为顶部水平菜单和右侧垂直菜单定义皮肤来完成皮肤文件。\n\
    \n首先，在打开 Tropicalgreen.master 的情况下，删除之前添加到顶部菜单的一些样式元素，使代码如下所示：\n\n```\n<asp:Menu\
    \ ID=\"Menu1\" runat=\"server\" DataSourceID=\"SiteMapDataSourceTop\"\nSkinID=\"\
    TopMenu\">\n</asp:Menu>\n```\n\n我们还将删除可能已添加到右侧菜单的任何样式元素。右侧菜单的代码应类似于以下内容：\n\n```\n\
    <asp:Menu ID=\"Menu2\" runat=\"server\" DataSourceID=\n\"SiteMapDataSourceRight\"\
    \ SkinID=\"RightMenu\">\n</asp:Menu>\n```\n\n现在让我们使用皮肤将这些样式元素添加回来。将以下皮肤定义添加到 Sunny.skin\
    \ 文件中。\n\n```\n<asp:Menu SkinID=\"TopMenu\" runat=\"server\" Orientation=\"Horizontal\"\
    \n    MaximumDynamicDisplayLevels=\"1\" StaticDisplayLevels=\"2\"\n    StaticMenuItemStyle-CssClass=\"\
    TopMenu\"\n    StaticEnableDefaultPopOutImage=\"False\">\n</asp:Menu>\n\n<asp:Menu\
    \ SkinID=\"RightMenu\" runat=\"server\" Orientation=\"Vertical\"\n    MaximumDynamicDisplayLevels=\"\
    1\" StaticDisplayLevels=\"1\"\n    StaticMenuItemStyle-CssClass=\"RightMenu\"\n\
    \    StaticEnableDefaultPopOutImage=\"False\">\n</asp:Menu>\n```\n\n我们已为两个菜单添加了皮肤定义；现在将菜单的\
    \ SkinID 设置为与皮肤相匹配：\n\n| 控制 ID | 将 SkinID 设置为 |\n|------------|-------------------|\n\
    | MenuTop | TopMenu |\n| MenuRight | RightMenu |\n\n请注意，皮肤定义使用了级联样式表（请参阅 CssClass\
    \ 属性）。我们尚未创建任何样式表；因此，如果您查看任何主题页面，在应用新皮肤后可能看不到太多差异。让我们看看皮肤和样式表在主题内是如何协同工作的。\n\n\
    ## 使用样式表\n\n我们已经看到如何使用皮肤为 ASP.NET 服务器控件应用特定样式。它们对于设置导航、表单和其他基于服务器的控件的样式非常有用。毫无疑问，它们是我们工具箱中非常巧妙实用的工具。\n\
    \n然而，在 MCMS 的世界中，确保网站在整个过程中保持一致的外观和感觉的一个重要方面是确保作者在占位符控件（如 HtmlPlaceholderControl）中输入的内容也遵循网站的样式指南。为了强制执行\
    \ HTML 内容的设计规则，皮肤对我们帮助不大。对于 HTML 控件和代码，我们仍然必须使用好旧的级联样式表。\n\n以前，要将 CSS 文件应用于站点，我们会向所有需要它的模板文件和\
    \ Web 表单添加 <link> 标签：\n\n```\n<link type=\"text/css\" href=\"UrlOfFile.css\"/>\n\
    ```\n\n或者，我们也可以使用 <style> 标签直接在页面本身中嵌入样式：\n\n```\n<style>\nH1{color:#993300;font-weight:bold;font-size:14pt}\n\
    </style>\n```\n\n这两种技术都有效，但仍然可能是一件混乱的事情，尤其是在处理多个样式表和 Web 表单时。\n\n好消息是：主题也支持 CSS。现在，我们可以直接将\
    \ CSS 文件添加到主题中。在幕后，ASP.NET 将为我们生成 <link> 标签。\n\n## 创建样式表\n\nTropicalGreen 网站的主模板主要由表格组成。此外，作者输入的所有自定义内容都仅限于常规\
    \ HTML 文本。由于这些不是 ASP.NET 服务器控件，因此不支持皮肤。为了确保此类内容的外观和感觉与网站其余部分一致，我们需要应用样式表。\n\n\
    让我们尝试通过使用样式表为 TropicalGreen 网站的其余部分添加样式。\n\n- 1. 要向主题添加样式表，请在 **Solution Explorer**\
    \ 中右键单击 **Sunny** 主题文件夹并选择 **Add New Item...**\n- 2. 在 **Add New Item** 对话框中，选择\
    \ **Style Sheet** 模板并将文件命名为 **Sunny.css**。\n- 3. 我们在此示例中使用的样式表相对简单。我们将为 body、anchor\
    \ 和几个标题级别指定样式，以及为横幅和菜单指定一些命名样式。输入以下代码：\n- 4. 保存 Sunny.css。\n\n```\nBody {font-family:Verdana,Arial;font-size:11pt}\n\
    A{color:#0000FF;font-size:10pt;font-weight:bold}\nH1{color:#993300;font-weight:bold;font-size:14pt}\n\
    H2{color:#FF6600;font-weight:bold;font-size:12pt}\n.Banner{background-color:#ffcc00}\n\
    .TopMenu{background-color:#66cc33;font-weight:bold;color:#CCFF99;\n        text-decoration:none;padding:5px;}\n\
    .RightMenu{background-color:#669900;color:#CCFF99;\n        text-decoration: none;\
    \ font-weight:bold;padding:5px;}\n```\n\n> 我们不会详细介绍 CSS 的语法。要了解 CSS 入门，请查看以下网站：\n\
    > http://www.w3c.rl.ac.uk/primers/css/cssprimer.htm.\n\n> Visual Studio 还附带了 **Style\
    \ Builder**，它提供了一个用于定义样式的图形界面。要启动 **Style Builder**，请切换到 **Design** 视图并从菜单中选择\
    \ **Format | Style**。\n\n现在，查看 TropicalGreen 网站上的任何现有植物发布内容。样式已成功应用于发布内容。\n"
