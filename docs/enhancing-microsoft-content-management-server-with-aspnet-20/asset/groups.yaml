  mdcn: "\n- 1. 打开 **站点管理器** 并导航到 **站点地图** 频道。\n- 2. 右键单击 **站点地图** 频道并选择 **属性**。\n\
    - 3. 在 **属性** 对话框中，单击 **发布** 选项卡。\n- 4. 在对话框的 **频道呈现** 部分，单击 **选择**。\n- 5. 在 **选择频道呈现**\
    \ 对话框中，将 **脚本 URL** 字段设置为 `/tropicalgreen/templates/sitemap.aspx` 并单击 **确定**。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_143_0.png)\n\n6. 关闭所有打开的对话框。\n\n现在导航到网站上的任何页面并单击顶部菜单栏上的\
    \ **站点地图** 链接。整个树被加载并显示。展开或收缩任何节点以显示子项。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_144_0.png)\n\
    \n> 这里，我们只是将 TreeView 控件拖放到页面上，并将构建树的必要逻辑直接添加到页面本身。更好的设计是将 TreeView 控件添加到 Web\
    \ 用户控件或服务器控件中。封装在 Web 用户控件或服务器控件中，站点地图可以在站点的多个位置重复使用。\n\n## 按需填充节点\n\n对于非常大的树，每次加载时填充整个\
    \ TreeView 控件可能并不实用。想象一个站点，其中树中有成千上万个节点；在所有节点加载完成之前可能需要相当长的时间。作为替代方案，我们可以配置树仅在展开父节点后才加载子节点。\n\
    \n好消息是，TreeView 控件的树视图节点已经具有一个内置属性名为 PopulateOnDemand，当设置为 true 时，将导致子节点仅在父节点首次展开时才被填充。让我们看看如何配置\
    \ TreeView 控件以按需填充节点。\n\n- 1. 在设计视图中打开之前创建的 Plant.aspx 模板文件。\n- 2. 从工具箱的数据部分拖动一个\
    \ SiteMapDataSource 控件并将其放置到内容区域。设置 ID 为 SiteMapDataSourceTree，SiteMapProvider\
    \ 为 MCMSSiteMapProvider。\n- 3. 从工具栏的导航部分拖动一个 TreeView 控件并将其放置在内容区域的任何位置。设置 DataSourceID\
    \ 为 SiteMapDataSourceTree。\n- 4. 切换到源视图。在 <asp:TreeView> 标签之间，添加以下突出显示的代码：\n\n\
    ```\n<asp:TreeView ID=\"TreeView1\" runat=\"server\"\n    DataSourceID=\"SiteMapDataSourceTree\"\
    \n    ShowLines=\"True\">\n    <DataBindings>\n        <asp:TreeNodeBinding PopulateOnDemand=\"\
    true\"\n            TextField=\"Title\"\n            NavigateUrlField=\"Url\"\n\
    \            ToolTipField=\"Description\"/>\n    </DataBindings>\n</asp:TreeView>\n\
    ```\n\n<DataBindings> 标签使我们能够指定每个站点地图节点如何转换为树视图节点。在这里，我们已将每个树视图节点的 PopulateOnDemand\
    \ 属性设置为 true。此外，我们已在树视图节点和站点地图节点之间映射了以下属性：\n\n| TreeView 节点 | SiteMap 节点 |\n|---|---|\n\
    | Text | Title |\n| NavigateUrl | Url |\n| Tooltip | Description |\n\n- 5. 接下来，我们设置树的深度，使仅显示第一级节点。我们还将\
    \ TreeView 的 PopulateNodesFromClient 属性设置为 true，这样使用最新浏览器的访问者（比 Internet Explorer\
    \ 5.5 或 Netscape 6.0 更新的浏览器）在检索子节点时不会使整个页面重新加载。相反，将生成一组 JavaScripts（也称为 AJAX 或异步\
    \ JavaScript 和 XML）。脚本将使用 Microsoft 的 XMLHTTP ActiveX 对象调用服务器端脚本，并在不刷新整个页面的情况下异步将子节点加载到树中。\n\
    \n```\n<asp:TreeView ID=\"TreeView1\" runat=\"server\"\n    DataSourceID=\"SiteMapDataSourceTree\"\
    \n    ShowLines=\"True\" PopulateNodesFromClient=\"True\"\n    ExpandDepth=\"\
    1\">\n    . . . code continues . . .\n</asp:TreeView>\n```\n\n我们已配置树以按需填充节点。查看任何植物页面。注意树现在仅显示根频道以及第一级项目。展开任何节点并注意每次这样做时，页面调用的脚本都是\
    \ TreeView_PopulateNode()。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_145_0.png)\n\
    \n现在将鼠标光标放在 [-] 符号上。注意此时调用的脚本已更改为 TreeView_ToggleNode()。所调用函数名称的变化表明节点确实在首次展开时进行了往返以检索子节点。\n\
    \n## 导航控件\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_146_0.png)\n\n## 在编辑模式下展开节点时移除离开警告消息\n\
    \n当 TreeView 控件在编辑模式下的帖子中显示时存在一个问题。每次展开节点时，离开警告消息就会出现。\n\n通过按 F5 刷新页面，使树折叠到其原始状态。现在切换到编辑站点并编辑帖子。展开树的任何节点。你是否收到一条警告消息，提示刷新页面将导致未保存的更改丢失？\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_146_1.png)\n\n离开警告提示是在浏览器触发 OnBeforeUnload()\
    \ 事件时设计出现的。通常，这发生在浏览器窗口关闭或页面导航到不同位置时。如果查看页面的 HTML 源代码（右键单击页面上的任何位置并选择 **查看源代码**），你会发现\
    \ `TreeView_PopulateNode()` 方法是由锚点的 `href` 属性触发的：\n\n```\n<a id=\"ctl00_ContentPlaceHolder1_TreeView1n2\"\
    \ href=\"javascript:\nTreeView_PopulateNode(. . . code continues . . . )>\n```\n\
    \n使用锚点的 `href` 属性可以完成工作，但它会导致页面卸载，从而提示离开警告消息出现。\n\n与其使用锚点的 `href` 属性调用脚本，我们应该改用\
    \ `onclick()` 方法。`onclick()` 事件的行为类似于常规的 **提交** 按钮。当它触发时，页面的 URL 不会更改，因此不会触发页面的\
    \ `OnBeforeUnload()` 事件，警报也不会出现。\n\n我们需要将锚点 `href` 属性的全部内容移出并嵌入到 `onclick()` 事件中，使生成的代码如下所示。脚本应返回\
    \ `false` 以取消可能发生的任何进一步操作，例如执行 `href` 属性。\n\n```\n<a id=\"ctl00_ContentPlaceHolder1_TreeView1n2\"\
    \nonclick=\"TreeView_PopulateNode(. . . code continues . . . );\nreturn false;\"\
    >\n```\n\n修改锚标记生成的最佳方法是创建一个自定义 `TreeView` 控件并重写其 `Render()` 方法。\n\n- 1. 向解决方案添加一个\
    \ C# 类库项目。将项目命名为 **TropicalGreenControlLib**。\n- 2. 删除向导生成的 `Class1.cs` 文件。我们不需要它。\n\
    - 3. 向项目添加对 `System.Web` 库的引用。\n- 4. 向项目添加一个名为 `MCMSTreeView.cs` 的类文件。\n- 5. 代码需要使用以下代码段中突出显示的命名空间中的方法。将它们添加到命名空间声明之上。\n\
    \n```\n. . . code continues . . .\nusing System.Web;\nusing System.Web.UI;\nusing\
    \ System.Web.UI.WebControls;\nusing System.IO;\nusing System.Text.RegularExpressions;\n\
    \nnamespace TropicalGreenControlLib\n{\n    . . . code continues . . .\n}\n```\n\
    \n- 6. 由于我们只是修改树视图的呈现方式，因此我们不会从头开始构建控件。相反，让自定义控件继承自 System.Web.UI.WebControls.TreeView\
    \ 类。\n\n```\npublic class MCMSTreeView : TreeView\n{\n}\n```\n\n- 7 To 修改基 TreeView\
    \ 类生成的锚点，我们需要重写 Render() 方法。我们首先检索基 TreeView 控件生成的 HTML 输出。一旦获得原始内容，我们就会查找 href\
    \ 属性的实例。使用正则表达式，我们获取之前存储在 href 属性中的值并将其移动到锚点的 onclick() 事件处理程序中。添加如下所示的代码：\n\n\
    ```\nprotected override void Render(System.Web.UI.HtmlTextWriter\n    output)\n\
    {\n    // Get the output of the original TreeView Control\n    TextWriter tempWriter\
    \ = new StringWriter();\n    base.Render(new System.Web.UI.HtmlTextWriter(tempWriter));\n\
    \    string orightml = tempWriter.ToString();\n\n    // Search for the javascript\
    \ postback code in the href attribute\n    // and if found add an onclick event\
    \ handler to execute it in a\n    // way that does not cause the MCMS authoring\
    \ warning to show up\n    Regex hrefRegex =\n        new Regex(\"href=\\\"javascript:(?<PostBackScript>.*?)\\\
    \"\",\n            RegexOptions.Singleline);\n    string newhtml = hrefRegex.Replace(orightml,\n\
    \        \"href=\\\"javascript:${PostBackScript}\\\" \" +\n        \"onclick=\\\
    \"eval(this.href.substr(11)); \" +\n        \"return false;\\\"\" );\n    output.Write(newhtml);\n\
    }\n```\n\n- 8. 控件已完成。保存并编译 TropicalGreenControlLib 项目。\n\n要使用自定义控件，请右键单击工具箱内的任意位置并选择“选择项”。在“选择项”对话框中，选择\
    \ .NET Framework 组件选项卡。单击“浏览”按钮并选择 TropicalGreenControlLib 项目的 /debug/bin/ 文件夹中\
    \ found 的 TropicalGreenControlLib.dll 文件。\n"
