    # # Installing MCMS 2002 Prerequisites


    Before we can proceed with the installation of MCMS itself, we need to install
    two prerequisites. Installation of MCMS will be halted if these prerequisites
    are not met.


    +   • J# 2.0 redistributable:

    +   Elements of MCMS Site Manager require the J# redistributable.

    +   • Internet Explorer Web Controls for MCMS:

    +   Portions of the MCMS Web Author make use of the Internet Explorer Web Controls
    (IEWC), of which a specific MCMS distribution exists for which compilation is
    unnecessary. These controls, unlike the standard IEWC, are supported as part of
    an MCMS installation. As they are a prerequisite for MCMS, IEWC can be utilized
    within your applications. However, ASP.NET 2.0 offers far richer controls for
    navigation, as we will see later in this book.


    # # J# 2.0 Redistributable


    We need to install the Visual J# 2.0 Redistributable to enable the installation
    of the MCMS Site Manager.


    +   1. Download and save the J# 2.0 installer from: http://www.microsoft.com/downloads/details.aspx?familyid=f72c74b3-ed0e-4af8-ae63-2f0e42501be1&displaylang=en

    +   2. Double-click the installer.

    +   3. On the Welcome to Microsoft Visual J# 2.0 Redistributable Package Setup
    page, click Next.

    +   4. On the End User License Agreement page, check the I accept the terms of
    the License Agreement checkbox and click Install.

    +   5. Wait while J# 2.0 installs, and when the Setup Complete page appears, click
    Finish.'
