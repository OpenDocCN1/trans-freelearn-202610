    \n- 8. Click **Next** and wait while Setup prepares the installation.\n- 9. On\
    \ the **Registration Information** page, personalize your installation details,\
    \ enter your **Product Key**, and click **Next**.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_45_0.png)\n\
    \n- 10. On the **Components to Install** page, select the SQL Server Database\
    \ Services and Workstation components, Books Online and development tools checkboxes,\
    \ and click **Next**.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_45_1.png)\n\n\
    ### Installation\n\n- 11. On the Instance Name page, select the Default instance\
    \ radio button, and click Next.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_46_0.png)\n\
    \n- 12. On the Service Account page, select the Use a domain user account radio\
    \ button and enter the Service Account details for the mssql account. Check the\
    \ SQL Server Agent and SQL Browser checkboxes, and click Next.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_46_1.png)\n\
    \n- 13. On the Authentication Mode page, select the Windows Authentication Mode\
    \ radio button, and click Next.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_47_0.png)\n\
    \n- 14. On the Collation Settings page, click Next.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_47_1.png)\n\
    \n- 15. On the Error and Usage Report Settings page, choose if you would like\
    \ to submit error and usage reports to Microsoft, and click Next.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_48_0.png)\n\
    \n- 16. On the Ready to Install page, click Install.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_48_1.png)\n\
    \n- 17. Wait while SQL Server is installed, and click **Next**.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_49_0.png)\n\
    \n- 18. On the **Completing Microsoft SQL Server 2005 Setup** page, click **Finish**.\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_49_1.png)\n\nThis completes the steps\
    \ to install SQL Server 2005.\n\n## Installing SQL Server 2005 Service Pack 1\n\
    \nWe will now install Service Pack 1 for SQL Server 2005, which can be downloaded\
    \ from http://www.microsoft.com/downloads/details.aspx?FamilyID=cb6c71ea-d649-47ff-9176-e7cac58fd4bc.\n\
    \n- 1. Double-click the installer file and wait while the files are extracted.\n\
    - 2. On the Welcome page, click Next.\n- 3. On the End User License Agreement\
    \ page, check the I accept the licensing terms and conditions checkbox, and click\
    \ Next.\n- 4. On the Feature Selection page, click Next.\n- 5. On the Authentication\
    \ Mode page, click Next.\n- 6. On the Ready to Install page, click Install, and\
    \ wait while the Service Pack is installed. During the installation, you may be\
    \ prompted regarding Pending Reboot Files. If you are, click Yes.\n- 7. When the\
    \ Locked Files Found dialog appears, click Continue.\n- 8. In the Computer Reboot\
    \ Required dialog, click OK.\n- 9. Click Next, and on the Installation Complete\
    \ page, click Finish.\n- 10. Restart your computer.\n\n## Configuring SQL Server\
    \ 2005\n\nWe will now configure our installation of SQL Server 2005 and create\
    \ a database for use by our MCMS applications.\n\n- 1. Select Start | Programs\
    \ | Microsoft SQL Server 2005 | Microsoft SQL Management Studio.\n- 2. In the\
    \ Connect to Server dialog, select your server in the Server name combo box, Windows\
    \ Authentication in the Authentication combo box, and click Connect.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_51_0.png)\n\
    \n- 3. In the Object Explorer, right-click the Database folder, and click New\
    \ Database...\n- 4. In the Database name textbox, enter TropicalGreen, click OK,\
    \ and wait while the database is created.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_51_1.png)\n\
    \n- 5. In the **Object Explorer**, expand the **Security** folder.\n- 6. Right-click\
    \ the **Logins** folder, and click **New Login**...\n- 7. In the **Login name**\
    \ textbox, enter **MACHINENAME\\\\mcmssys**.\n- 8. In the **Default database**\
    \ combo box, select **TropicalGreen**.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_52_0.png)\n\
    \n- 9. Click the **User Mapping** item within the **Select a page** pane.\n- 10.\
    \ In the **Users mapped to this login** grid, click the **Map** checkbox for the\
    \ **TropicalGreen** database.\n- 11. In the **Database role membership** grid,\
    \ check the **db_datareader**, **db_datawriter**, and **db_ddladmin** checkboxes.\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_53_0.png)\n\n- 12. Click OK, and close\
    \ SQL Management Studio.\n\n## Bypass the Installation of Visual Studio.NET 2003\n\
    \nMCMS SP1a requires an installation of a previous version of Visual Studio.NET\
    \ to enable the Developer Tools component, prior to installing SP2. Installing\
    \ Visual Studio.NET 2003 is both time consuming and undesirable. It is possible\
    \ to bypass this requirement using the following procedure, which tricks the SP1a\
    \ installer into thinking Visual Studio .NET 2003 is installed.\n\n- 1. Request\
    \ the following MCMS hotfix from Microsoft:\n  `http://support.microsoft.com/?kbid=915190`\n\
    - 2. Run the hotfix executable to extract the files to a local folder, e.g. `c:\\\
    kb915190`.\n"
  mdcn: "\n![](img/18a0aa8d36427a4c069b30410f998b8e_41_0.png)\n\n- 7. 确保已选中“通用文件”、“Internet\
    \ Information Services 快捷方式”和“World Wide Web 服务”。单击“确定”。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_41_1.png)\n\
    \n> 尽管产品文档中说明了该要求，并且在稍后安装 Visual Studio.NET 2003 期间，安装 FrontPage 2000 Server Extensions\
    \ 并不必要。\n\n- 8. 单击 **下一步** 并等待 IIS 安装完成；系统可能会提示您插入 Windows XP CD-ROM。\n- 9. 当出现\
    \ **完成 Windows 组件向导** 页面时，单击 **完成**，并关闭 **添加或删除程序**。\n\n> **在 Windows Server 2003\
    \ SP1 上安装时。**\n> 使用“管理我的服务器”应用程序安装带有 ASP.NET（但不包括 FrontPage Server Extensions）的应用程序服务器角色。然后使用\
    \ **添加或删除程序... Windows 组件** 添加 Active Server Pages 和 Server Side Includes。无法使用\
    \ IIS 管理器启用这些功能；必须使用 **添加或删除程序**，否则 MCMS 安装程序将无法识别它们！\n> \n> 此外，创建一个新的虚拟网站来托管服务器配置应用程序。该站点应配置为使用\
    \ Windows 身份验证，并拒绝除 localhost 之外的其他主机的访问。最好托管 SCA 的该站点也使用安全套接字层（SSL）。如果不可能，请将站点配置为使用\
    \ 80 以外的端口。\n\n## 配置 Internet Information Services\n\n我们将首先配置 IIS 以使用 Windows\
    \ 身份验证。书中稍后我们将探讨替代的身份验证方法。\n\n- 1. 从 **开始菜单** 中，单击 **运行...**\n- 2. 在 **打开** 文本框中，输入\
    \ **inetmgr** 并单击 **确定**。\n- 3. 展开 **本地计算机** 节点和 **网站** 文件夹。\n- 4. 右键单击 **默认网站**\
    \ 并单击 **属性**。\n- 5. 单击 **目录安全性** 选项卡，并在 **匿名访问和身份验证控制** 框架内单击 **编辑...**\n- 6.\
    \ 取消选中 **匿名访问** 复选框并选中 **集成 Windows 身份验证** 复选框，然后单击 **确定**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_43_0.png)\n\
    \n- 7. 单击 确定，并关闭 Internet Information Services。\n\n## 安装 SQL Server 2005\n\n以下步骤详细说明\
    \ SQL Server 2005 的安装：\n\n- 1. 插入 SQL Server 2005 CD-ROM 或 DVD。\n- 2. 在启动画面上，在\
    \ **安装** 部分中单击 **服务器组件、工具、联机丛书和示例** 链接。\n- 3. 在 **最终用户许可协议** 对话框中，选中 **我接受许可条款和条件**\
    \ 复选框并单击 **下一步**。\n- 4. 在 **安装先决条件** 对话框中，单击 **安装** 并等待先决条件安装完成。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_44_0.png)\n\
    \n- 5. 完成后，单击 下一步，并等待系统配置检查完成。\n- 6. 在“欢迎使用 Microsoft SQL Server 安装向导”页面上，单击 下一步。\n\
    - 7. 在系统配置检查页面上，所有操作的状态都应报告为成功。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_44_1.png)\n\
    \n- 8. 单击 **下一步** 并等待安装程序准备安装。\n- 9. 在 **注册信息** 页面上，个性化您的安装详细信息，输入您的 **产品密钥**，然后单击\
    \ **下一步**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_45_0.png)\n\n- 10. 在 **要安装的组件**\
    \ 页面上，选择 SQL Server 数据库服务和工作站组件、联机丛书和开发工具复选框，然后单击 **下一步**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_45_1.png)\n\
    \n### 安装\n\n- 11. 在实例名称页面上，选择默认实例单选按钮，然后单击 下一步。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_46_0.png)\n\
    \n- 12. 在服务帐户页面上，选择使用域用户帐户单选按钮并输入 mssql 帐户的服务帐户详细信息。选中 SQL Server 代理 和 SQL Server\
    \ 浏览器 复选框，然后单击 下一步。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_46_1.png)\n\n\
    - 13. 在身份验证模式页面上，选择 Windows 身份验证模式单选按钮，然后单击 下一步。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_47_0.png)\n\
    \n- 14. 在排序规则设置页面上，单击 下一步。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_47_1.png)\n\
    \n- 15. 在错误和使用情况报告设置页面上，选择是否要向 Microsoft 提交错误和用法报告，然后单击 下一步。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_48_0.png)\n\
    \n- 16. 在准备安装页面上，单击 安装。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_48_1.png)\n\
    \n- 17. 等待 SQL Server 安装完成，然后单击 **下一步**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_49_0.png)\n\
    \n- 18. 在 **完成 Microsoft SQL Server 2005 安装** 页面上，单击 **完成**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_49_1.png)\n\
    \n这完成了安装 SQL Server 2005 的步骤。\n\n## 安装 SQL Server 2005 Service Pack 1\n\n我们现在将安装\
    \ SQL Server 2005 的 Service Pack 1，可从 http://www.microsoft.com/downloads/details.aspx?FamilyID=cb6c71ea-d649-47ff-9176-e7cac58fd4bc\
    \ 下载。\n\n- 1. 双击安装程序文件并等待文件提取完成。\n- 2. 在欢迎页面上，单击 下一步。\n- 3. 在最终用户许可协议页面上，选中 我接受许可条款和条件\
    \ 复选框，然后单击 下一步。\n- 4. 在功能选择页面上，单击 下一步。\n- 5. 在身份验证模式页面上，单击 下一步。\n- 6. 在准备安装页面上，单击\
    \ 安装，并等待 Service Pack 安装完成。安装过程中，您可能会收到有关待重启文件的提示。如果收到提示，请单击 是。\n- 7. 当出现“找到锁定文件”对话框时，单击\
    \ 继续。\n- 8. 在“需要重新启动计算机”对话框中，单击 确定。\n- 9. 单击 下一步，并在安装完成页面上单击 完成。\n- 10. 重新启动计算机。\n\
    \n## 配置 SQL Server 2005\n\n我们现在将配置 SQL Server 2005 的安装并为我们的 MCMS 应用程序创建数据库。\n\n\
    - 1. 选择 开始 | 程序 | Microsoft SQL Server 2005 | Microsoft SQL Management Studio。\n\
    - 2. 在“连接到服务器”对话框中，在服务器名称组合框中选择您的服务器，在身份验证组合框中选择 Windows 身份验证，然后单击 连接。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_51_0.png)\n\
    \n- 3. 在对象资源管理器中，右键单击数据库文件夹，然后单击 新建数据库...。\n- 4. 在数据库名称文本框中，输入 TropicalGreen，单击\
    \ 确定，并等待数据库创建完成。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_51_1.png)\n\n- 5.\
    \ 在 **对象资源管理器** 中，展开 **安全性** 文件夹。\n- 6. 右键单击 **登录名** 文件夹，然后单击 **新建登录名**...\n-\
    \ 7. 在 **登录名** 文本框中，输入 **MACHINENAME\\\\mcmssys**。\n- 8. 在 **默认数据库** 组合框中，选择 **TropicalGreen**。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_52_0.png)\n\n- 9. 单击 **选择页** 窗格中的 **用户映射**\
    \ 项。\n- 10. 在 **映射到此登录的用户** 网格中，为 **TropicalGreen** 数据库单击 **映射** 复选框。\n- 11. 在\
    \ **数据库角色成员身份** 网格中，选中 **db_datareader**、**db_datawriter** 和 **db_ddladmin** 复选框。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_53_0.png)\n\n- 12. 单击 确定，并关闭 SQL Management\
    \ Studio。\n\n## 绕过 Visual Studio.NET 2003 的安装\n\nMCMS SP1a 在安装 SP2 之前需要安装一个较早版本的\
    \ Visual Studio.NET 以启用开发人员工具组件。安装 Visual Studio.NET 2003 既耗时又不理想。可以使用以下过程绕过此要求，该过程会欺骗\
    \ SP1a 安装程序使其认为已安装 Visual Studio .NET 2003。\n\n- 1. 向 Microsoft 请求以下 MCMS 热修复程序：\n\
    \  `http://support.microsoft.com/?kbid=915190`\n- 2. 运行热修复程序可执行文件以将文件提取到本地文件夹，例如\
    \ `c:\\kb915190`。\n"
