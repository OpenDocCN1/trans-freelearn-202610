    - 3. Click the `LoginStatus` control (**LoginStatus1**) and the events icon in\
    \ the **Property** window.\n- 4. Double-click the **LoggedOut** event to add the\
    \ `Login1_LoggedOut` event handler and jump to it in **Code** view.\n- 5. Add\
    \ the following using statement:\n\n```\nusing Microsoft.ContentManagement.Web.Security;\n\
    ```\n\n- 6. Implement the following directly beneath the `Page_Load` method:\n\
    \n```\nprotected void LoginStatus1_LoggedOut(object sender, EventArgs e)\n{\n\
    \    CmsFormsAuthentication.SignOut();\n}\n```\n\n- 7. Save your work, and from\
    \ the **Build** menu, choose **Build Web Site**.\n\nWe can now test the `LoginStatus`\
    \ control by logging in to our site:\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_189_0.png)\n\
    \n## Authentication Controls and Membership Providers\n\nWhen we click the Logout\
    \ link, we are signed out of MCMS and returned to our login page. If Guest access\
    \ was enabled on our MCMS installation, the LoginStatus control would display\
    \ a Login link.\n\nLet’s now go ahead and add a LoginName control to our master\
    \ page:\n\n- 1. Open TropicalGreen.master in Design view.\n- 2. From the Login\
    \ tab of the toolbox, drag a LoginName control to the right-hand table cell above\
    \ the existing LoginStatus control.\n- 3. Switch to Source view.\n- 4. After the\
    \ <asp:LoginName /> element, add a non-breaking space:\n- 5. Save your work and\
    \ from the Build menu choose Build Web Site.\n\n```\n<asp:LoginName ID=\"LoginName1\"\
    \ runat=\"server\"/>\n<br/>\n```\n\nNow when we are logged in, we can see the\
    \ name of the currently logged-in user:\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_190_0.png)\n\
    \nWe could easily enhance the look and feel of the LoginStatus and LoginName controls\
    \ using skins as detailed in the previous chapter.\n\n## Supporting Custom Authentication\
    \ Schemes\n\nSo far we’ve seen how to make use of the new ASP.NET 2.0 login controls\
    \ by creating an MCMS Membership Provider for Windows accounts and using it with\
    \ Forms Authentication. It is also possible to use the same approach to provide\
    \ a more elegant solution for \"account mapping\" scenarios whereby authentication\
    \ takes place against an external user store.\n\nFor example, suppose we needed\
    \ to use Active Directory Application Mode (ADAM) for authentication, we could\
    \ implement an ADAM Membership Provider based upon our MCMSMembershipProviderBase\
    \ class by overriding the ValidateUser() method:\n\n```\nusing System.DirectoryServices;\n\
    ... Code Continues ...\npublic override bool ValidateUser(string strName, string\
    \ strPassword)\n{\n    // the LDAP server to connect to\n    string strLdapServer\
    \ = \"LDAP://localhost:389/\";\n    // the DN of the OU containing the user\n\
    \    string strLdapObj = \"OU=MCMSUsers,O=TropicalGreen\";\n    // the DirectoryEntry\
    \ property to validate\n    string strDECheck = \"MCMSUsers\";\n    // the DN\
    \ of the user we are connecting as\n    string strBindName = \"CN=\" + strName\
    \ + \",\" + strLdapObj;\n    // the Windows Username format for passing to ValidateUser\n\
    \    string strWindowsUser = \"WinNT://webdev/\" + strName;\n\n    try\n    {\n\
    \        // Connect to ADAM using LDAP AuthN...\n        DirectoryEntry ent =\
    \ new DirectoryEntry(strLdapServer +\n            strLdapObj, strBindName,\n \
    \           strPassword, AuthenticationTypes.None);\n\n        // We must bind\
    \ to perform authentication\n        if ((string)ent.Properties[\"name\"].Value\
    \ == strDECheck)\n        {\n            // LDAP AuthN succeeded, so perform Windows\n\
    \            // AuthN to setup a MCMS context...\n            return base.ValidateUser(strWindowsUser,\
    \ strPassword);\n        }\n        // LDAP AuthN failed, so return a false\n\
    \        return false;\n    }\n    catch (Exception)\n    {\n        //LDAP AuthN\
    \ failed, so return a false\n        return false;\n    }\n}\n```\n\nActive Directory\
    \ Application Mode (ADAM) is a standalone LDAP 3 directory service. The above\
    \ sample assumes that ADAM is installed on the same machine as MCMS, is configured\
    \ to allow unsecured operation, MCMS users are stored within an Organizational\
    \ Unit named MCMSUsers, and that passwords are identical in both ADAM and Active\
    \ Directory or the Local Security Accounts (SAM) database.\n\nThe above sample\
    \ could be extended to create Windows and ADAM user accounts and provide additional\
    \ functionality, such as password reset, to end users. However, there remains\
    \ no supported mechanism to manage MCMS Role Group membership. An appropriate\
    \ compromise is to create a Windows group for each MCMS Role Group. The Windows\
    \ group is then added to the MCMS Role Group using Site Manager, and users can\
    \ be added to the Windows group programmatically.\n\n## Summary\n\nWe have covered\
    \ using the new ASP.NET 2.0 Login controls and Membership Provider Model by creating\
    \ an MCMS Membership Provider for Windows Accounts and using it with Forms Authentication.\
    \ We also learned which controls are useful to MCMS applications and how to integrate\
    \ them with our MCMS applications. We have also seen how to make use of these\
    \ ASP.NET 2.0 features to enhance \"account mapping\" scenarios by developing\
    \ a Membership Provider for an external authentication system.\n"
  mdcn: "\n6. 修改身份验证部分以使用表单身份验证：\n\n```\n<authentication mode=\"Forms\">\n  <forms\
    \ loginUrl=\"Login.aspx\" />\n</authentication>\n```\n\n## 使用登录控件创建登录页面\n\n现在让我们继续实现一个登录页面，允许用户登录，该页面将使用新的\
    \ ASP.NET 2.0 登录控件。\n\n- 1. 右键单击 **TropicalGreen** 网站，然后单击 **添加新项**。\n- 2. 选择\
    \ **Web Form** 图标，在 **Name** 文本框中输入 **Login.aspx** 并单击 **添加**。确保未选中 **选择母版页**\
    \ 复选框。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_185_0.png)\n\n> 将 `Login` 控件添加到母版页是可行的。但是如果母版页包含与\
    \ PAPI 交互的代码（例如导航控件或发布属性），则您的 MCMS 安装需要启用访客访问。此类实现仅适用于使用表单身份验证的混合创作和只读托管场景。\n\n\
    - 3. 切换到 **设计** 视图。\n- 4. 从工具箱 **Login** 选项卡拖动 **Login** 控件到设计表面。\n\n## 身份验证控件和成员资格提供程序\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_186_0.png)\n\n- 5. 如有需要，使用登录控件的自动格式任务选择格式方案。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_186_1.png)\n\n- 6. 单击登录控件（Login1），然后在属性窗口中单击事件图标（闪电符号）。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_187_0.png)\n\n- 7. 双击 LoggedIn 事件以添加\
    \ Login1_LoggedIn 事件处理程序并在代码视图中跳转到它。\n- 8. 添加以下 using 语句：\n\n```\nusing Microsoft.ContentManagement.Web.Security;\n\
    ```\n\n- 9. 在 Page_Load 方法正下方实现以下内容：\n\n```\nprotected void Login1_LoggedIn(object\
    \ sender, EventArgs e)\n{\n    Login myLogin = sender as Login;\n\n    if (HttpContext.Current.Items.Contains(\"\
    MCMSTicket\"))\n    {\n        CmsAuthenticationTicket Ticket =\n            HttpContext.Current.Items[\"\
    MCMSTicket\"]\n            as CmsAuthenticationTicket;\n        CmsFormsAuthentication.SetAuthCookie(Ticket,\n\
    \            false, Login1.RememberMeSet);\n    }\n}\n```\n\n- 10. 从“生成”菜单中选择“生成网站”。\n\
    \n现在我们已完成登录页面，可以继续在 Internet Explorer 中通过浏览 http://localhost/tropicalgreen 来测试功能。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_188_0.png)\n\n- 11. 输入用户名和密码并单击 **登录**。请记住以\
    \ **MachineOrDomainName\\username** 的格式输入用户名。\n- 12. 如果凭据正确，您将登录并被带到 Tropical\
    \ Green 主页。否则，`Login` 控件中将显示一条消息。\n\n## 使用 LoginStatus 和 LoginName 控件\n\n现在我们有了登录页面，可以使用\
    \ `LoginStatus` 和 `LoginName` 控件为模板提供额外的成员资格相关功能。让我们继续将这些控件添加到我们的母版页。\n\n- 1.\
    \ 在 **设计** 视图中打开 `TropicalGreen.master`。\n- 2. 从工具箱的 **Login** 选项卡拖动 **LoginStatus**\
    \ 控件到右侧表格单元格中，位于现有菜单控件 (**MenuRight**) 之上。\n- 3. 单击 `LoginStatus` 控件 (**LoginStatus1**)\
    \ 和 **属性** 窗口中的事件图标。\n- 4. 双击 **LoggedOut** 事件以添加 `Login1_LoggedOut` 事件处理程序并在\
    \ **代码** 视图中跳转到它。\n- 5. 添加以下 using 语句：\n\n```\nusing Microsoft.ContentManagement.Web.Security;\n\
    ```\n\n- 6. 在 `Page_Load` 方法正下方实现以下内容：\n\n```\nprotected void LoginStatus1_LoggedOut(object\
    \ sender, EventArgs e)\n{\n    CmsFormsAuthentication.SignOut();\n}\n```\n\n-\
    \ 7. 保存您的工作，然后从 **生成** 菜单中选择 **生成网站**。\n\n我们现在可以通过登录我们的网站来测试 `LoginStatus` 控件：\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_189_0.png)\n\n## 身份验证控件和成员资格提供程序\n\n\
    当我们单击注销链接时，我们将从 MCMS 注销并返回到登录页面。如果在我们的 MCMS 安装上启用了访客访问，则 LoginStatus 控件将显示登录链接。\n\
    \n现在让我们继续向母版页添加 LoginName 控件：\n\n- 1. 在 Design 视图中打开 TropicalGreen.master。\n-\
    \ 2. 从 Login 选项卡的工具箱拖动 LoginName 控件到右侧表格单元格中，位于现有 LoginStatus 控件之上。\n- 3. 切换到源视图。\n\
    - 4. 在 <asp:LoginName /> 元素之后添加一个不间断空格：\n- 5. 保存您的工作，然后从生成菜单中选择生成网站。\n\n```\n\
    <asp:LoginName ID=\"LoginName1\" runat=\"server\"/>\n<br/>\n```\n\n现在当我们登录时，可以看到当前登录用户的名称：\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_190_0.png)\n\n我们可以使用上一章中详细介绍的皮肤轻松增强\
    \ LoginStatus 和 LoginName 控件的外观和感觉。\n\n## 支持自定义身份验证方案\n\n到目前为止，我们已经了解了如何通过为 Windows\
    \ 帐户创建 MCMS 成员资格提供程序并将其与表单身份验证一起使用来使用新的 ASP.NET 2.0 登录控件。也可以使用相同的方法为“帐户映射”场景提供更优雅的解决方案，在该场景中身份验证针对外部用户存储进行。\n\
    \n例如，假设我们需要使用 Active Directory 应用程序模式 (ADAM) 进行身份验证，我们可以通过重写 ValidateUser() 方法基于我们的\
    \ MCMSMembershipProviderBase 类实现 ADAM 成员资格提供程序：\n\n```\nusing System.DirectoryServices;\n\
    ... Code Continues ...\npublic override bool ValidateUser(string strName, string\
    \ strPassword)\n{\n    // the LDAP server to connect to\n    string strLdapServer\
    \ = \"LDAP://localhost:389/\";\n    // the DN of the OU containing the user\n\
    \    string strLdapObj = \"OU=MCMSUsers,O=TropicalGreen\";\n    // the DirectoryEntry\
    \ property to validate\n    string strDECheck = \"MCMSUsers\";\n    // the DN\
    \ of the user we are connecting as\n    string strBindName = \"CN=\" + strName\
    \ + \",\" + strLdapObj;\n    // the Windows Username format for passing to ValidateUser\n\
    \    string strWindowsUser = \"WinNT://webdev/\" + strName;\n\n    try\n    {\n\
    \        // Connect to ADAM using LDAP AuthN...\n        DirectoryEntry ent =\
    \ new DirectoryEntry(strLdapServer +\n            strLdapObj, strBindName,\n \
    \           strPassword, AuthenticationTypes.None);\n\n        // We must bind\
    \ to perform authentication\n        if ((string)ent.Properties[\"name\"].Value\
    \ == strDECheck)\n        {\n            // LDAP AuthN succeeded, so perform Windows\n\
    \            // AuthN to setup a MCMS context...\n            return base.ValidateUser(strWindowsUser,\
    \ strPassword);\n        }\n        // LDAP AuthN failed, so return a false\n\
    \        return false;\n    }\n    catch (Exception)\n    {\n        //LDAP AuthN\
    \ failed, so return a false\n        return false;\n    }\n}\n```\n\nActive Directory\
    \ 应用程序模式 (ADAM) 是一个独立的 LDAP 3 目录服务。上面的示例假定 ADAM 安装在与 MCMS 相同的机器上，已配置为允许不安全操作，MCMS\
    \ 用户存储在名为 MCMSUsers 的组织单位中，并且密码在 ADAM 和 Active Directory 或本地安全帐户 (SAM) 数据库中相同。\n\
    \n上面的示例可以扩展以创建 Windows 和 ADAM 用户帐户，并为最终用户提供附加功能，例如密码重置。但是，仍然没有受支持的机制来管理 MCMS 角色组成员资格。一个合适的折中方案是为每个\
    \ MCMS 角色组创建一个 Windows 组。然后使用站点管理器将 Windows 组添加到 MCMS 角色组，并且用户可以以编程方式添加到 Windows\
    \ 组。\n\n## 摘要\n\n我们已经介绍了如何通过为 Windows 帐户创建 MCMS 成员资格提供程序并将其与表单身份验证一起使用来使用新的 ASP.NET\
    \ 2.0 登录控件和成员资格提供程序模型。我们还了解了哪些控件对 MCMS 应用程序有用以及如何将它们与我们的 MCMS 应用程序集成。我们还看到了如何通过为外部身份验证系统开发成员资格提供程序来利用这些\
    \ ASP.NET 2.0 功能来增强“帐户映射”场景。\n"
