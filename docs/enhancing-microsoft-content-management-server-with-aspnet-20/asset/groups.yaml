    \ 2005 年 1 月出版的上一本书《Building Websites with Microsoft Content Management Server》中的详细说明（ISBN\
    \ 1-904811-16-7）。\n\n设置 SP2 开发环境有两种方法：从现有的 SP1a 安装升级，或从头开始构建包含 SP2 的全新安装。本章将介绍这两种方法。\n\
    \n对于本书中的示例，我们将使用 Windows XP Professional SP2 作为开发工作站。但是，对于 Windows Server 2003\
    \ SP1 机器的显著差异，将会注明。所有示例均假定已登录用户是本地机器管理员。\n\n### MCMS 2002 Service Pack 2 概述\n\n\
    与其他 Microsoft Service Pack 一样，SP2 的主要目的之一是为大量之前发布的热修复提供集成安装。SP2 将成为任何未来热修复发布的先决条件。\n\
    \n虽然许多客户将 SP2 视为常规 Service Pack，但它还为 Microsoft 的最新开发平台和工具提供支持，即 SQL Server 2005、.NET\
    \ Framework 2.0 和 ASP.NET 2.0，以及 Visual Studio 2005：\n\n- **SQL Server 2005**：MCMS\
    \ 数据库可以由 SQL Server 2005 主机，提供在安全性、部署以及最重要的是性能方面的众多优势。\n- .NET Framework 2.0 和\
    \ ASP.NET 2.0：MCMS 应用程序可以托管在 .NET Framework 2.0 运行时中，并利用 v2.0 语言功能以及安全性和性能改进。此外，还可以使用\
    \ ASP.NET 2.0 的许多新功能，例如母版页、主题、导航和 Membership Providers。这为改进和重构 MCMS 应用程序提供了众多机会，并且是本书的重点。\n\
    - Visual Studio 2005：MCMS 应用程序可以使用 Visual Studio 2005 进行开发。这里最大的优势之一是使用 VS.NET\
    \ 中的新 HTML 编辑和设计器功能以及改进的开发人员生产力。\n\n如果您愿意，可以继续使用 SQL Server 2000 用于 MCMS 应用程序。但是，我们建议升级到\
    \ SQL Server 2005，并在本书的示例中始终使用它。\n\nVisual Studio 2005 有众多版本或库存单位（SKUs），所有这些都与\
    \ SP2 兼容。在本书的示例中，我们将使用 Visual Studio 2005 Professional Edition。\n\n> 不幸的是，SP2\
    \ 不是累积服务包，因此需要现有的 SP1a 安装。同样，SP2 没有集成发行版。SP2 发行版适用于 MCMS 的所有版本。\n\n主要由于在 .NET\
    \ 2.0、Visual Studio 2005 和 SQL Server 2005 发布到制造（RTM）后，SP2 的准备和发布速度极快，Microsoft\
    \ 安装信息（KB906145）记录得并不特别完善，有点令人困惑。请放心，本章中的指导已针对所涵盖的两种安装场景进行了验证和测试。\n\n## 获取 MCMS\
    \ Service Pack 2\n\n可以从以下位置下载 MCMS SP2：\n\n- English: http://www.microsoft.com/downloads/details.aspx?FamilyId=3DE1E8F0-D660-4A2B-8B14-0FCE961E56FB&displaylang=en\n\
    - French: http://www.microsoft.com/downloads/details.aspx?FamilyId=3DE1E8F0-D660-4A2B-8B14-0FCE961E56FB&displaylang=fr\n\
    - German: http://www.microsoft.com/downloads/details.aspx?FamilyId=3DE1E8F0-D660-4A2B-8B14-0FCE961E56FB&displaylang=de\n\
    - Japanese: http://www.microsoft.com/downloads/details.aspx?FamilyId=3DE1E8F0-D660-4A2B-8B14-0FCE961E56FB&displaylang=ja\n\
    \n## 安装方法\n\n本章涵盖了就地升级到 SP2 和全新安装。\n您选择的方法取决于您的具体要求以及您当前是否\n有任何 MCMS 安装。\n\n如果您希望升级，请继续阅读下一节《Upgrading\
    \ to Microsoft Content Management Server 2002 Service Pack 2》，然后跳到第 2 章《Getting\
    \ Started with the Development Environment》。\n\n如果您希望执行全新安装，请跳到本章约 18 到 20 页的《Fresh\
    \ Installation of Microsoft Content Management Server 2002 Service Pack 2》部分。\n\
    \n## 升级到 Microsoft Content Management Server 2002 Service Pack 2\n\n本节详细说明升级现有\
    \ MCMS\nSP1a 安装所需的步骤，其中包括 Visual Studio.NET 2003 组件的开发人员工具。\n升级的大致流程如下：\n\n+ \
    \  1. 安装 Visual Studio 2005。\n+   2. 安装 MCMS 2002 Service Pack 2。\n+   3. 配置开发环境。\n\
    +   4. （可选）为 SQL Server 2005 准备 MCMS 数据库。\n+   5. （可选）升级 SQL Server。\n+   6. （可选）安装\
    \ SQL Server 2005 Service Pack 1。\n\n我们将在以本地机器管理员身份登录的情况下执行所有步骤。\n\n"
