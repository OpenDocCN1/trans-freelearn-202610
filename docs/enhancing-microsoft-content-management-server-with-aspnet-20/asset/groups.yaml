  - '[PAGE 75]


    +   - **Developer tools for VS.NET 2003 disappear after installing MCMS 2002 Service
    Pack 2.** A hotfix for this has been released and can be requested from Microsoft
    Support as KB 914195.

    +   - **Developer Tools for VS.NET 2003 do not work with some regional settings.**
    A hotfix for this has been released and can be requested from Microsoft Support
    as KB 914195.


    In addition if you have performed a fresh installation of MCMS SP2 and wish to
    move an existing database to your new installation, you need to obtain the KB913401
    hotfix and follow the steps detailed in the *Prepare the MCMS Database for SQL
    Server 2005* section under our discussion on upgrading to MCMS 2002 Service Pack
    2 towards the beginning of this chapter.


    # Installation Tips


    The following section provides two tips for installations on different editions
    of Windows or across separate machines.


    # Installing MCMS SP2 on Windows Server 2003 X64 Edition


    MCMS Service Pack 2 introduces support for 64-bit versions of Windows Server 2003.
    However MCMS requires IIS to be configured to run in 32-bit compatibility mode.
    This means that all IIS applications (not just MCMS ones) cannot take advantage
    of the additional addressable memory on the X64 platform. In order to install
    MCMS SP2 on this platform, the following extra steps are necessary:


    +   - ASP.NET 2.0 must be manually registered with IIS by executing the `aspnet_regiis`
    utility.

    +   - IIS must be configured to run in the 32-bit compatibility mode, using the
    following command from the `c:\Inetpub\adminscripts` folder:

    +     `cscript adsutil.vbs set w3svc/AppPools/Enable32bitAppOnWin64 1`


    # Installing the Required SQL Server 2005 Components


    When making use of SQL Server on separate machine from the one running MCMS SP2,
    there is a prerequisite for SQLDMO, also known as SQL Server Client Tools, on
    the MCMS machine. This can be installed from your SQL Server 2005 distribution
    by:'
  - '[PAGE 76]


    +   - Clicking the **Advanced** button on the **Components to Install** dialog.

    +   - Expanding the **Client Components** item.

    +   - Selecting the **Legacy Components** item.


    ![](img/18a0aa8d36427a4c069b30410f998b8e_76_0.png)


    # Summary


    We have completed either an upgrade to SP2 or a new installation. In addition,
    we have covered the necessary configuration steps to avoid common problems with
    MCMS installation, seen how to avoid installing Visual Studio.NET 2003, and some
    additional installation tips. We are now ready to explore the MCMS SP2 development
    environment.'
  - '[PAGE 77]


    # 2

    Getting Started with the Development Environment


    Before proceeding, we will spend some time getting familiar with the MCMS Service
    Pack 2 development environment for Visual Studio 2005, which is slightly different
    from what we are used to with previous versions of Visual Studio. In addition
    we will create custom Visual Studio 2005 templates to overcome some of the issues
    that are present with the templates that shipped with MCMS SP2.


    # Visual Web Developer Websites


    The key difference between developing MCMS applications with Visual Studio .NET
    2003 and Visual Studio 2005 is that ASP.NET applications (and therefore MCMS applications)
    are now built using the Visual Web Developer component of Visual Studio 2005.
    Visual Web Developer introduces a new "project system", which no longer uses the
    project (`*.csproj`) files and simply accesses web applications via HTTP or the
    file system.


    In Visual Studio .NET 2003, MCMS applications were created by choosing the **MCMS
    Web Application** project type. This project type was effectively a regular ASP.NET
    web application project with some modifications required by MCMS, such as additional
    references, the web authoring console, and modifications to the `web.config`.
    In Visual Studio 2005, developing web applications has been separated from developing
    other project types. The feature to develop a web application has been moved into
    the Visual Web Developer component.


    To reflect this design change, you are no longer using **New Project** but **New
    Web Site** from the **File** menu in Visual Studio 2005 to create a new website.'
