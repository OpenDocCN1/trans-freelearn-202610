    \ navigation controls:\n\n- The `SiteMapPath` control generates a series of links\
    \ that connect to one another on a website, for example, **Home > Plant Catalog\
    \ > Aloe Vera**. It is the \"You Are Here\" sign that tells visitors exactly where\
    \ they are. It is also sometimes known as a breadcrumb trail, and like the trail\
    \ of breadcrumbs left by the fictional characters Hansel and Gretel, it helps\
    \ users find their way back from the main page.\n- The `Menu` control can be configured\
    \ to show static horizontal or vertical lists of items. It can even be dynamic,\
    \ showing and hiding sub-items when the cursor hovers over an item.\n- The `TreeView`\
    \ control provides a hierarchical representation of the site. It contains a list\
    \ of all items on the site nested in a tree. Users can click to expand leaf nodes\
    \ to reveal sub-nodes.\n\nAll of the above listed controls can be driven by site\
    \ maps. You can think of site maps as a collection of items that make up the structure\
    \ of your site. By programmatically adding channels and postings to a site map,\
    \ we are able to smoothly integrate these controls to any MCMS site as we will\
    \ see in this chapter.\n\n## Navigation for TropicalGreen\n\nIn the book, *Building\
    \ Websites with Microsoft Content Management Server* from Packt Publishing (ISBN\
    \ 1-904811-16-7), we designed TropicalGreen to display:\n\n- A horizontal menu\
    \ with the following items:\n  - Home\n  - Help\n  - Site map\n- A vertical menu\
    \ with the following items:\n  - Columns\n  - Gardens\n  - Plant catalog\n- A\
    \ SiteMapPath control (or breadcrumb trail)\n- A TreeView control for the site\
    \ map\n- A listing for summary pages\n\nLet’s attempt to re-create this navigation\
    \ structure using the controls available in ASP.NET 2.0. At the end of the chapter,\
    \ the TropicalGreen site will contain each element as shown in the following screenshot:\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_116_0.png)\n\n## Site Maps and Site-Map\
    \ Providers\n\nSite maps contain a collection of items to be included as part\
    \ of the website’s navigation structure. The items are usually displayed in a\
    \ hierarchical tree-like structure. In MCMS, this would usually be a list of channels\
    \ and postings or sometimes galleries, resources, and templates. In its simplest\
    \ form, a site map can be a plain XML file that stores a list of nodes, such as\
    \ the following:\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<siteMap\
    \ xmlns=\"http://schemas.microsoft.com/AspNet/SiteMap-File-1.0\">\n    <siteMapNode\
    \ url=\"http://tropicalgreen/\" title=\"Home\"/>\n        <siteMapNode url=\"\
    /PlantCatalog/\" title=\"Plant Catalog\">\n        <siteMapNode url=\"/Gardens/\"\
    \ title=\"Gardens\">\n            <siteMapNode url=\"/Gardens/Members/\" title=\"\
    Members\"/>\n        </siteMapNode>\n    . . . code continues . . .\n    </siteMapNode>\n\
    </siteMapNode>\n</siteMap>\n```\n\nAfter defining the site map, you could add\
    \ a SiteMapDataSource to the page together with, say, a Menu control, bind the\
    \ site map data source to the Menu control, and the contents of the XML file will\
    \ get translated into menu items. Of course, the conversion of XML nodes to menu\
    \ items is not magical. Behind the scenes, a SiteMapProvider (specifically, the\
    \ XmlSiteMapProvider) reads the XML file and programmatically loads each node\
    \ into the SiteMapDataSource.\n\nWhile we could use an XML file to hold the list\
    \ of nodes, it would merely be a static snapshot of the site’s structure. When\
    \ new channels or pages are added or deleted, the file has to be updated accordingly.\
    \ Hardcoding nodes and links in an XML file may work well on sites with a relatively\
    \ fixed structure. However, for many MCMS websites where channels and pages are\
    \ added and deleted frequently or where different users might be allowed to see\
    \ a different set of pages, a more dynamic approach would be preferred.\n\nAs\
    \ the XmlSiteMapProvider is the only provider that ships with ASP.NET 2.0, we\
    \ will need to build a custom site-map provider to read from the MCMS repository.\n\
    \nThe custom site-map provider will use the MCMS Publishing Application Programming\
    \ Interface (PAPI) to retrieve the channels and postings from the MCMS repository\
    \ to form the site map. The benefit of this approach is that security\n"
