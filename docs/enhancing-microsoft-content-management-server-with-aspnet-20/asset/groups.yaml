    NRNODEGUID=%7b6bE3510D2-519A-4D4F-92A8-621B43F5894F%7d&\nNRORIGINALURL=%2ftropicalgreen%2fSiteMap%2f&\n\
    NR_CACHEHINT=ModifyLoggedIn\";\n```\n\nPutting the pieces together, in order to\
    \ assign the value stored in __CMS_CurrentUrl to the value of the action attribute\
    \ of the form, __CMS_PostbackForm, we need to somehow execute the following script\
    \ on the client:\n\n```\n<script type=\"text/javascript\">\n    if (typeof (__CMS_CurrentUrl)\
    \ != \"undefined\")\n    {\n        __CMS_PostbackForm.action = __CMS_CurrentUrl;\n\
    \    }\n</script>\n```\n\nA good place to register the script is in the Render()\
    \ method of the TreeView control. Open the MCMS TreeView.cs file and add the highlighted\
    \ code to the Render() method.\n\n```\nprotected override void Render(System.Web.UI.HtmlTextWriter\
    \ output)\n{\n    ... code continues ...\n    // Register a client script that\
    \ ensures that the action property\n    // is correct when AJAX tries to do its\
    \ postback.\n    string script = \"\\n<script type=\\\"text/javascript\\\">\\\
    n\" +\n        \" if (typeof (__CMS_CurrentUrl) != \" +\n        \" \\\"undefined\\\
    \")\\n\" +\n        \" {\\n\" +\n        \"   __CMS_PostbackForm.action = \" +\n\
    \        \" __CMS_CurrentUrl;\\n\" +\n        \" }\\n\" +\n        \"</script>\\\
    n\";\n```\n\n```\nPage.ClientScript.RegisterStartupScript(this.GetType(),\n  \
    \  \"AdjustActionForTreeView\", script);\n}\n```\n\nNow, replace the TreeView\
    \ control on SiteMap.aspx with the custom MCMS TreeView control. After setting\
    \ it up to populate nodes on demand, the tree no longer freezes, and you should\
    \ be able to expand and contract nodes to reveal sub-nodes.\n\n## Using the TreeView\
    \ Control in Summary Pages\n\nSummary pages (also known as default, cover, or\
    \ index pages) provide a listing of pages within a given section. They are particularly\
    \ useful when visitors know only of the existence of a page but not its exact\
    \ location. For example, you may know that there’s a page that describes the Aloe\
    \ Vera in the plant catalog, but you may not know its address. If the plant catalog\
    \ page provides a listing of all the plant pages on the site, you could easily\
    \ find the page that you are looking for.\n\nEarly versions of summary pages were\
    \ often hand-coded pieces of work that had to be updated frequently when new pages\
    \ were added, deleted, or renamed. Over the years, this practice has slowly been\
    \ phased out when active-scripting enabled developers to dynamically assemble\
    \ the summary page on the fly. This meant that the page showed the latest version\
    \ of the list, providing for efficient and effective link management.\n\nIn MCMS\
    \ sites built on ASP.NET 1.x, summary pages were typically built by iterating\
    \ through the collection of channels and postings. The collection of channel items\
    \ was then displayed in a table-like control such as the DataGrid. While this\
    \ technique still works today, ASP.NET 2.0 introduces a faster and easier approach\
    \ to building summary pages.\n\nLet’s take a look at an alternative solution that\
    \ involves building a custom site-map provider and the TreeView control. Here’s\
    \ the game plan:\n\n- 1. We start off by creating a custom site-map provider that\
    \ sets the currently viewed channel as the root node. All postings within the\
    \ channel are then added as site-map nodes.\n- 2. Next, we will use the TreeView\
    \ control to provide a listing of all pages within the channel. While the TreeView\
    \ control is designed to show a hierarchical listing of items, its versatility\
    \ allows it to display a simple single-level list just as well.\n"
  mdcn: "\n一旦控件已添加到工具箱中，就将其拖放到 Plant.aspx 模板文件的任何可编辑区域。像之前为 TreeView 控件所做的那样设置 MCMSTreeview\
    \ 的属性。页面渲染后，节点会按预期展开和折叠，即使在编辑模式下也不会出现离开警告消息。\n\n完成后，删除植物模板文件中的所有 TreeView 控件。\n\
    \n## 使 TreeView 控件的按需填充功能在通道渲染脚本中工作\n\n正如我们所见，按需填充功能在嵌入模板文件时可以正常工作。然而，如果你尝试将其添加到通道渲染脚本中，你可能会发现当展开任何节点时\
    \ TreeView 控件似乎会冻结。作为示例，让我们修改之前创建的 SiteMap.aspx 页面的 TreeView 控件：\n\n- 1. 在源视图中打开\
    \ SiteMap.aspx 文件。\n- 2. 按如下所示修改 TreeView 控件的属性：\n- 3. 保存页面。\n\n```\n<asp:TreeView\
    \ ID=\"TreeView1\" runat=\"server\" DataSourceID=\n\"SiteMapDataSourceTree\"\n\
    ShowLines=\"True\" PopulateNodesFromClient=\"True\" ExpandDepth=\"1\">\n<DataBindings>\n\
    <asp:TreeNodeBinding PopulateOnDemand=\"true\"\nTextField=\"Title\"\nNavigateUrlField=\"\
    Url\"\nToolTipField=\"Description\"/>\n</DataBindings>\n</asp:TreeView>\n```\n\
    \n完成后，导航到站点地图页面。尝试展开任意节点。注意没有任何反应！\n\n要理解为什么会发生这种情况，让我们仔细看看按需填充功能的工作方式。当节点展开时，浏览器会静默执行一次回发。回发需要\
    \ <form> 标签的 action 属性中存储的信息。如果你查看页面的生成的 HTML，你会发现表单的 action 属性中存储的值类似于以下内容：\n\
    \n```\n<form name=\"aspnetForm\" method=\"post\" action=\"sitemap.aspx?...code\
    \ continues...\">\n```\n\naction 属性中存储的值有趣之处在于它是一个相对 URL。在常规 Web 应用程序中，使用相对 URL\
    \ 工作良好。然而，对于 MCMS 页面，URL 必须是绝对的。这是因为用于访问页面的 URL（例如 http://tropicalgreen/sitemap/）并不指向物理文件夹——它纯粹是虚拟的，并指向存储库中的一个通道。因此当它尝试访问诸如\
    \ sitemap.aspx 的相对 URL 时，它会在 http://tropicalgreen/sitemap/sitemap.aspx 处查找它。由于文件在该位置物理上不存在，代码就会失败。\n\
    \n要纠正此问题，我们需要改用绝对链接。要在表单的 action 属性中生成绝对链接，我们可以选择：\n\n- 1. 生成一个 <base> 标签并在其中存储页面的绝对路径。有了\
    \ <base> 标签，所有相对链接都会通过在链接前加上标签中存储的值而转换为绝对链接。通常，<base> 标签由 RobotMetaTag 控件生成。然而，控件中的一个错误阻止它在通道渲染脚本中生成\
    \ <base> 标签。一个增强版的 RobotMetaTag 可在通道渲染脚本和模板文件上同时工作，可在此处找到：http://www.gotdotnet.com/Community/UserSamples/Details.aspx?SampleGuid=8600bae5-7aba-481b-93bb-d179927179d5。\n\
    - 2. 使用客户端 JavaScript 修改 <form> 标签的 action 属性。虽然生成 <base> 标签是一种可能的解决方案，但你可能不想启用它（我们在第\
    \ 5 章讨论了一些 <base> 标签不能使用的可能原因）。要使此方法工作，我们需要修改树视图的渲染方式，为此我们必须创建一个自定义 TreeView 控件。由于我们之前已经创建了一个自定义\
    \ TreeView 控件，让我们探讨如何增强它以在通道渲染脚本中工作。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_150_0.png)\n\
    \n> TreeView 控件的按需填充功能之所以适用于植物模板文件，是因为我们已将 RobotMetaTag 控件的 RenderBaseHref 属性设置为\
    \ true。如果将其设置为 false，<base> 标签将不会生成，并且树视图将无法按需填充子节点。\n\n我们需要将表单 action 属性中存储的相对链接转换为绝对链接。为此，我们将利用生成的页面中已有的一些功能。\n\
    \n如果你检查任何 MCMS 页面的 HTML 源代码，你会发现一个名为 __CMS_PostbackForm 的 JavaScript 变量，它存储了表单对象的实例。\n\
    \n```\nvar __CMS_PostbackForm = document.forms['aspnetForm'];\n```\n\n此外，还有一个名为\
    \ __CMS_CurrentUrl 的变量，它存储页面的绝对 URL。以下是站点地图页面的 __CMS_CurrentUrl 在你的页面上可能的样子。请注意，你站点上的\
    \ GUID 值可能不同。\n\n```\nvar __CMS_CurrentUrl = \"/tropicalgreen/templates/sitemap.aspx?\n\
    NRMODE=Published&\nNRNODEGUID=%7b6bE3510D2-519A-4D4F-92A8-621B43F5894F%7d&\nNRORIGINALURL=%2ftropicalgreen%2fSiteMap%2f&\n\
    NR_CACHEHINT=ModifyLoggedIn\";\n```\n\n把这些片段组合起来，为了将 __CMS_CurrentUrl 中存储的值赋给表单、__CMS_PostbackForm\
    \ 的 action 属性的值，我们需要在客户端以某种方式执行以下脚本：\n\n```\n<script type=\"text/javascript\"\
    >\n    if (typeof (__CMS_CurrentUrl) != \"undefined\")\n    {\n        __CMS_PostbackForm.action\
    \ = __CMS_CurrentUrl;\n    }\n</script>\n```\n\n注册脚本的好地方是 TreeView 控件的 Render()\
    \ 方法。打开 MCMS TreeView.cs 文件并将突出显示的代码添加到 Render() 方法中。\n\n```\nprotected override\
    \ void Render(System.Web.UI.HtmlTextWriter output)\n{\n    ... code continues\
    \ ...\n    // Register a client script that ensures that the action property\n\
    \    // is correct when AJAX tries to do its postback.\n    string script = \"\
    \\n<script type=\\\"text/javascript\\\">\\n\" +\n        \" if (typeof (__CMS_CurrentUrl)\
    \ != \" +\n        \" \\\"undefined\\\")\\n\" +\n        \" {\\n\" +\n       \
    \ \"   __CMS_PostbackForm.action = \" +\n        \" __CMS_CurrentUrl;\\n\" +\n\
    \        \" }\\n\" +\n        \"</script>\\n\";\n```\n\n```\nPage.ClientScript.RegisterStartupScript(this.GetType(),\n\
    \    \"AdjustActionForTreeView\", script);\n}\n```\n\n现在，用自定义的 MCMS TreeView 控件替换\
    \ SiteMap.aspx 上的 TreeView 控件。设置好按需填充节点后，树不再冻结，你应该能够展开和收缩节点以显示子节点。\n\n## 在摘要页面中使用\
    \ TreeView 控件\n\n摘要页面（也称为默认、封面或索引页面）提供给定部分内页面的列表。它们在访问者只知道页面的存在但不知道其确切位置时特别有用。例如，你可能知道植物目录中有一页描述芦荟，但你可能不知道其地址。如果植物目录页面提供了站点上所有植物页面的列表，你就可以轻松找到所需页面。\n\
    \n早期版本的摘要页面通常是手工编码的工作，当添加、删除或重命名新页面时必须频繁更新。多年来，随着活动脚本使开发人员能够即时动态组装摘要页面，这种做法逐渐被淘汰。这意味着页面显示的是列表的最新版本，为高效有效的链接管理提供了便利。\n\
    \n在基于 ASP.NET 1.x 构建的 MCMS 站点中，摘要页面通常通过遍历通道和帖子的集合来构建。然后将通道项的集合显示在类似表格的控件中，例如 DataGrid。虽然这种技术今天仍然有效，但\
    \ ASP.NET 2.0 引入了一种更快、更易于构建摘要页面的方法。\n\n让我们看看一个替代方案，它涉及构建自定义站点地图提供程序和 TreeView\
    \ 控件。以下是计划：\n\n- 1. 我们首先创建一个自定义站点地图提供程序，将当前查看的通道设为根节点。然后将通道内的所有帖子添加为站点地图节点。\n\
    - 2. 接下来，我们将使用 TreeView 控件提供通道内所有页面的列表。虽然 TreeView 控件旨在显示项目的分层列表，但其多功能性也允许它同样好地显示简单的单级列表。\n"
