    \ checkout page, the orders page continues to post back to itself.\n\n```\nvar\
    \ __CMS_PostbackFormBeenReset = false;\nfunction __cmsRestFormAction()\n{\n  \
    \  if ( !__CMS_PostbackFormBeenReset )\n    {\n        // set form postback Url\
    \ to be current translated CMS Url\n        __CMS_PostbackForm.action = __CMS_CurrentUrl;\n\
    \    }\n}\n```"
