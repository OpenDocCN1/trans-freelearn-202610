    ## 前言

    《使用 ASP.NET 2.0 增强 Microsoft Content Management Server》深入探讨了将 ASP.NET 2.0 的关键功能（如母版页、站点导航、主题和皮肤以及成员资格提供程序模型）与
    Microsoft Content Management Server 2002 (MCMS) Service Pack 2 集成。


    每章都建立在前一章的基础上，逐步介绍 MCMS 开发人员可用的这些新功能，并构建一个示例站点，该站点与我们在 Packt Publishing 于 2005
    年 1 月出版的前一本书《使用 Microsoft Content Management Server 构建网站》（ISBN 1-904811-16-7）中介绍的站点类似。


    ## 本书涵盖内容

    第 1 章指导您在单台开发工作站上安装和配置 MCMS 2002 Service Pack 2 (SP2)，以及 SQL Server 2005 和 Visual
    Studio 2005。设置 SP2 开发环境有两种方法：从之前的 SP1a 安装升级，或从头开始构建包含 SP2 的全新安装。本章将介绍这两种方法。


    在第 2 章中，我们花一些时间熟悉 MCMS Service Pack 2 开发环境，该环境与我们习惯的 MCMS 和 Visual Studio 早期版本略有不同。我们将介绍这些变化以及在
    SP2 开发环境中工作的一些提示，例如创建自定义 MCMS Visual Studio 2005 模板。


    第 3 章向您介绍 ASP.NET 2.0 引入的最佳新功能之一——母版页，它允许开发人员在应用程序内的页面中强制执行统一的布局和行为。乍一看，许多母版页概念与
    MCMS 模板相似，但在 MCMS 应用程序中利用母版页可以获得诸多益处。本章提供了使用母版页的优势概述，以及在 MCMS 应用程序中实现它们的逐步指南，在那里它们成为主模板！


    第 4 章涵盖了新的 ASP.NET 2.0 导航提供程序模型和控件，以及如何将它们集成到您的 MCMS 应用程序中。开发站点导航控件通常会让开发人员陷入两难境地。Visual
    Studio 的早期版本未提供任何即用型导航控件。开发人员必须在花费大量时间从头构建控件或扩大项目预算购买现成软件之间做出选择。


    在第 5 章中，我们将了解如何通过使用主题高效地为 MCMS 站点应用统一的外观和感觉。我们将创建皮肤和层叠样式表，并演示它们如何协同工作以定义站点的外观。最后，我们将讨论使主题在
    MCMS 站点中正确工作的必要自定义。


    第 6 章涵盖了成员资格提供程序模型，这是 ASP.NET 2.0 引入的关键新概念之一，它使开发利用第三方或自定义成员资格存储的 Web 应用程序变得更加容易。此外，ASP.NET
    2.0 附带了与角色成员资格相关的多个身份验证控件，大大减少了在应用程序中实现表单身份验证及相关功能所需的代码量。本章展示了如何使用这些功能改进 Forms
    Authentication 的实现，并为“账户映射”场景提供更优雅的解决方案，在该场景中身份验证针对外部存储进行，而账户则映射到 Windows 账户以用于
    MCMS 授权。


    在第 7 章中，我们提供了与 ASP.NET 2.0 和 MCMS SP2 配合使用的多个提示以及代码示例，并为考虑迁移到即将推出的 Microsoft Office
    SharePoint Server 2007 的用户提供实施建议。


    ## 本书所需条件

    本书面向熟悉我们前一本书《使用 Microsoft Content Management Server 构建网站》中介绍的材料并对 C# 有扎实掌握的 MCMS
    开发人员。要使用本书，您需要具备以下访问权限：


    - Visual Studio 2005（任意版本）。

    - Microsoft Content Management Server 2002 Service Pack 2（任意版本）。MCMS 的 120 天试用版可从
    http://www.microsoft.com/cmserver 获取。

    '
