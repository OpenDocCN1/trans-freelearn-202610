    \    ResourceGallery rg =\n        (ResourceGallery)cmsContext.Searches.GetByPath(adsGalleryPath);\n\
    \n    if (rg != null)\n    {\n        // Get only files that are images\n    \
    \    ResourceCollection ads = rg.Resources;\n        ads.FilterByMimeType(\"image\"\
    , true);\n\n        // Randomly pick one of the Ads\n        int resourceIndex\
    \ = Randomiser(ads.Count);\n        Resource r = ads[resourceIndex];\n\n     \
    \   // Display the image\n        e.ImageUrl = r.Url;\n        e.NavigateUrl =\
    \ r.Description;\n        e.AlternateText = r.DisplayName;\n    }\n}\n```\n\n\
    9. The control is complete. Save the file and compile the project.\n\nTo see the\
    \ control in action, first add it to the toolbox by right-clicking anywhere within\
    \ the toolbox and selecting Choose Items. In the Choose Toolbox Item dialog, click\
    \ browse and select the TropicalGreenControlLib.dll file (usually found in the\
    \ \\bin\\debug\\ folder of the project). Once the control has been added to the\
    \ Toolbox, drag and drop the control anywhere on a web form or template file.\
    \ Set the AdsGalleryPath property to contain the path of an existing resource\
    \ gallery item, such as /Resources/TropicalGreen/PlantCatalog. The next time you\
    \ view the page, you will see rotating advertisements.\n\n## Tip #3: Considerations\
    \ for Microsoft Office SharePoint Server 2007\n\nWeb Content Management (WCM)\
    \ features that are today in MCMS will be part of the upcoming Microsoft Office\
    \ SharePoint Server 2007 (MOSS 2007). MOSS 2007 will provide vastly richer capabilities\
    \ as well:\n\n- SharePoint and MCMS will ship as a single product, and henceforth,\
    \ there will be no more confusion between the two. Along with WCM features, you\
    \ will get the full suite of SharePoint capabilities such as:\n  - Document management\n\
    \  - Enterprise search\n  - Surveys and discussion boards\n  - Lists and alerts\n\
    \  - Built-in support for portals and web parts\n- In addition, MOSS 2007 includes\
    \ several new exciting features:\n  - Wikis and blogs.\n  - An enhanced web-authoring\
    \ experience (ActiveX components and client installations of Site Manager not\
    \ required). Includes time-saving power tools such as recycle bins and one-click\
    \ rollbacks to previous versions.\n  - All the functionality in Site Manager is\
    \ now part of the Publishing API. For example, you can programmatically administer\
    \ roles, groups, and users, and other tasks that were not possible in the current\
    \ version of the PAPI.\n  - Extensible workflow built upon Windows Workflow Foundation.\n\
    \  - Extreme scalability. Capable of handling millions of items in a single container.\n\
    \nMOSS 2007 will ship with many more new and enhanced features. For a complete\
    \ list, take a look at the Microsoft Office SharePoint Server 2007 Guide available\
    \ for download at the 2007 Microsoft Office system preview site (http://www.microsoft.com/office/preview/servers/sharepointserver/highlights.mspx).\n\
    \nFor those of us who have an existing installation of MCMS and are planning to\
    \ migrate to MOSS 2007, a key point to note is that WCM applications under Office\
    \ SharePoint Server 2007 will use an entirely different set of APIs from the current\
    \ version of MCMS. Part of the reason for the major code overhaul is the integration\
    \ of the MCMS base architecture with that of Windows SharePoint Services (version\
    \ 3.0).\n\nWhile the complete revamp of the Publishing API will probably mean\
    \ that most of the custom code that we have written for our web sites will have\
    \ to be re-coded, the good news is: there will be a one-to-one mapping of functionality\
    \ for most of the current properties and methods. Details may be found in the\
    \ article, Mapping MCMS 2002 APIs to SharePoint 2007 (http://msdn.microsoft.com/office/server/moss/2007/migration/default.aspx?pull=/library/en-us/dnmscms02/html/CMSISVersionAPIDiffs.asp).\n\
    \nIn addition, Microsoft will be providing migration utilities to ease the transition.\
    \ The CMS Assessment Tool scans a site and generates various reports (e.g. PAPI\
    \ Usage Summary Report, PAPI Class Usage Report, etc.) that will help you gauge\
    \ the amount of work required to re-code your site to be ready for MOSS 2007.\
    \ The CMS Assessment tool is available for download at Microsoft’s web site: http://www.microsoft.com/downloads/details.aspx?FamilyId=360D0E83-FA70-4C24-BCD6-426CAFBCC627&displaylang=en.\n\
    \nFor various reasons, you may not wish to migrate to Microsoft Office SharePoint\
    \ Server 2007 immediately and choose to continue building your site using MCMS\
    \ 2002. If that is your intention, you can take steps today to ease your migration\
    \ in the future. You could:\n\n- Isolate code that uses the PAPI into modules.\n\
    - Use the Provider Model design pattern as far as possible.\n\n## Isolate Code\
    \ that Uses the PAPI into Modules\n\nThe move to change the underlying MCMS PAPI\
    \ has a huge impact on existing web applications should you plan to upgrade to\
    \ MOSS 2007 in the future. Unless you have used the out-of-the box solution without\
    \ any form of customization, chances are you have used the PAPI to tailor the\
    \ solution to meet the requirements of your website.\n\nAll the customizations\
    \ that you have done using the PAPI will have to be rewritten. While rewriting\
    \ code is inevitable, you can plan the code structure in such a way that the re-coding\
    \ process is made as painless as possible. A good idea would be to write modular\
    \ code and isolate code that uses the PAPI as far as possible. In this way, when\
    \ the time comes to upgrade the website, the code that requires rewriting will\
    \ be easier to locate.\n\nTake, for example, a fairly common scenario of a custom\
    \ control that lists all pages on the site that have been modified in the last\
    \ seven days. Previously, the list could be programmed to be displayed in a DataGrid.\
    \ The list is retrieved from the PAPI using the `Searches.NewPostings()` method.\
    \ Also, when the page loads, the list is bound directly to the DataGrid using\
    \ the `DataGrid.DataBind()` method. Here’s an example of how the code would probably\
    \ look:\n"
