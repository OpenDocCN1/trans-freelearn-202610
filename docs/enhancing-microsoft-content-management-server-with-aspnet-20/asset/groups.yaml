    \ addition, CSS was limited to defining the appearance of controls. For example,\
    \ you couldn’t use it to define the columns that make up a grid or the nodes of\
    \ a tree.\n\nAnother limitation of CSS was the varying levels of support the different\
    \ browsers had for style sheets. The situation gets more complex when older browsers\
    \ or alternative web devices such as personal digital assistants and mobile phones\
    \ are added to the picture. For a website to appear consistent across all browser\
    \ types and versions, complicated workarounds had to be implemented.\n\nASP.NET\
    \ 2.0 takes the idea behind CSS a step further by introducing the concept of themes.\
    \ A theme acts as a central location for storing information about the site’s\
    \ design. You could store CSS files in a theme. ASP.NET automatically generates\
    \ links to all CSS files for all pages that reference the theme.\n\nBesides managing\
    \ CSS files, themes also store entire sets of images and other design files required\
    \ by the site. In addition, you could define multiple themes within a single site.\
    \ If you switched the site’s theme, the site will automatically pick up the images\
    \ and other supporting files used by the selected theme. In this way, you could\
    \ customize the look and feel of a site for various devices or browsers.\n\nThemes\
    \ may also contain skins. Think of skins as an outer covering of server controls—somewhat\
    \ like a pillow case. When you slip a new casing over a pillow, you change its\
    \ design but underneath, the pillow remains essentially the same. In the same\
    \ way, skins can be applied to ASP.NET server controls. Skins address the design\
    \ requirements of complex server controls by combining the style definitions of\
    \ entire controls into a single file as opposed to having multiple style sheets.\
    \ With skins, you could apply styles and set the properties of complex controls\
    \ such as Calendars and DataGrids with minimal effort. You could even define elements\
    \ such as the columns that make up the grid or the nodes of a tree within a skin—a\
    \ task that was not possible with CSS.\n\nAnother nice aspect of themes is that\
    \ they reside in the web application’s directory. You could have multiple web\
    \ applications, each with its own unique themes. In this way, you could go ahead\
    \ and apply a theme to postings and not worry about affecting the look and feel\
    \ of say, pages in other web applications like the MCMS dialogs.\n\n### Creating\
    \ a Theme\n\nLet’s start by creating a theme for the TropicalGreen site. We will\
    \ name the theme Sunny and use it to apply a new design on our website. In ASP.NET\
    \ 2.0, themes used by a single project are stored directly below the project’s\
    \ application folder in a special folder named App_Themes. You can create as many\
    \ themes (or sub folders) as your site requires.\n\n- 1. First, let's create the\
    \ `App_Themes` folder. In **Solution Explorer**, right-click the **TropicalGreen**\
    \ project and select **Add ASP.NET folder | Theme**. A new folder named `App_Themes`\
    \ appears.\n- 2. Within the `App_Themes` folder is a subfolder named `Theme1`.\
    \ Rename the folder to `Sunny`.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_161_0.png)\n\
    \n### Applying a Theme to the Entire Site\n\nWe have created a theme named Sunny.\
    \ Now let's apply it to the TropicalGreen site.\n\nIn the web.config file, look\
    \ for the `<pages>` tag and add an attribute named theme and set its value to\
    \ Sunny.\n\n```\n<pages validateRequest=\"false\"\n    theme=\"Sunny\"/>\n```\n\
    \nWe have applied the Sunny theme to the TropicalGreen site. However, the theme\
    \ doesn't define any styles or designs yet. In the next section, we will add skins\
    \ and style sheets to define the look and feel of the site.\n\n> Instead of applying\
    \ the theme to the entire site, we could have defined it at the page level by\
    \ setting the theme attribute of the @Page directive. If we needed more flexibility\
    \ (for example, when changing the theme based on a user's profile), we could apply\
    \ the theme using code.\n\n### Skins for Server Controls\n\nAs the name suggests,\
    \ skins serve as outer covers of controls. Most out-of-the-box ASP.NET server\
    \ controls support skins. Nevertheless, it's always a good idea to check if the\
    \ control you plan to work with can be skinned. To do so, look for the SkinID\
    \ property. If the control has a SkinID property, you can apply a skin to it.\n\
    \nThere are two types of skins:\n\n- **Default skins**, which are applied to all\
    \ controls that do not have a corresponding skin defined in the `SkinID`. For\
    \ example, if you define a default skin for a `TextBox` control, all `TextBox`\
    \ controls on pages that adopt the theme will follow the styles defined in the\
    \ default skin.\n- **Name-controlled skins**, which target only controls that\
    \ share the same `SkinID`. For instance, you may have a skin for a `TextBox` defined.\
    \ Suppose the skin has the `SkinID` of `MyTextBox`. Only `TextBox` controls that\
    \ have a matching `SkinID` of `MyTextBox` will have the skin applied.\n\n### Creating\
    \ a Default Skin\n\nConsider the case of the `SiteMapPath` control created earlier\
    \ in our `TropicalGreen.master` template. We would like the control to use a colon\
    \ character (:) as the node separator. The font type should be Verdana. All nodes\
    \ will be in bold font and green color, with the exception of the current node,\
    \ which will be colored orange. If we set these properties using code, here’s\
    \ how it would look:\n\n```\n<asp:SiteMapPath ID=\"SiteMapPath1\" runat=\"server\"\
    \ Font-Names=\"Verdana\" PathSeparator=\":\">\n    <PathSeparatorStyle Font-Bold=\"\
    True\" ForeColor=\"green\"/>\n    <CurrentNodeStyle ForeColor=\"orange\"/>\n \
    \   <NodeStyle Font-Bold=\"True\" ForeColor=\"green\"/>\n    <RootNodeStyle Font-Bold=\"\
    True\" ForeColor=\"green\"/>\n</asp:SiteMapPath>\n```\n\nWhile setting the controls\
    \ of a property is easily done through code, we can do the same thing using a\
    \ skin. Before doing so, remove all style properties from the `SiteMapPath` control\
    \ such that the code becomes:\n\n```\n<asp:SiteMapPath ID=\"SiteMapPath1\" runat=\"\
    server\">\n</asp:SiteMapPath>\n```\n\nNow let’s build a skin for the `SiteMapPath`\
    \ control.\n\n- 1. In **Solution Explorer**, right-click the **Sunny** folder\
    \ and select **Add New Item...**\n- 2. In the **Add New Item** dialog, choose\
    \ to create a new **Skin File** and give it the name **Sunny.skin**.\n"
  mdcn: "\n## 5 应用主题\n\n大多数网站都是在考虑统一的外观和感觉的前提下设计的。毕竟，如果你访问一个网站，其页面之间差异明显，你可能会开始怀疑（可能在第二个页面之后）自己是否仍在浏览同一个网站。\n\
    \n在本章中，我们将了解如何通过使用主题高效地将统一的外观和感觉应用于 MCMS 网站。我们将创建皮肤和层叠样式表，并演示它们如何协同工作以定义网站的外观。最后，我们将讨论使主题在\
    \ MCMS 网站中正确工作所需的一项基本自定义。\n\n### 主题与层叠样式表\n\n在整个网站上保持一致的外观和感觉的挑战并非新鲜事。没过多久，开发人员就使用层叠样式表（CSS）来定义网站的外观。使用\
    \ CSS 是将设计元素与 HTML 分离的一步。图形设计师可以独立地处理 CSS 文件，提供诸如配色方案、字体类型、间距、边距和其他视觉效果等信息。如果需要更改其中任何属性，设计师所需要做的就是修改\
    \ CSS 文件，瞧，网站的外观和感觉就会立即焕然一新！\n\n然而，尽管使用 CSS 有其优势，但对网站设计的修改仍然需要相当多的工作。只要想想最近一次在你负责的网站上引入了新的日历控件等复杂控件的情况。为了给控件赋予期望的外观和感觉，必须应用多种样式：标题一种，选中日期另一种，导航箭头还有几种。此外，网站上的每个日历控件都必须重复同样的任务。你可以将“已样式化”的日历封装在自定义控件中并在整个网站中重用，但这意味着要考虑到设计元素编写代码，这使得开发人员和设计人员之间的工作安排变得复杂。此外，CSS\
    \ 在定义控件外观方面存在局限。例如，你无法用它来定义构成网格的列或树的节点。\n\nCSS 的另一个局限性是不同浏览器对样式表的支持程度不一。当加入旧版浏览器或个人数字助理和手机等替代网络设备时，情况变得更加复杂。为了使网站在所有浏览器类型和版本中保持一致的外观，必须实施复杂的变通方法。\n\
    \nASP.NET 2.0 通过引入主题的概念将 CSS 背后的思想更进一步。主题充当存储网站设计信息的中心位置。你可以在主题中存储 CSS 文件。ASP.NET\
    \ 会自动为引用该主题的所有页面生成指向所有 CSS 文件的链接。\n\n除了管理 CSS 文件外，主题还存储网站所需的一整套图像和其他设计文件。此外，你可以在单个网站中定义多个主题。如果切换网站的主题，网站将自动采用所选主题使用的图像和其他支持文件。这样，你就可以为各种设备或浏览器自定义网站的外观和感觉。\n\
    \n主题还可能包含皮肤。可以把皮肤想象成服务器控件的外层覆盖物——有点像枕套。当你把新的套子套在枕头上时，你改变了它的设计，但枕头本身基本保持不变。同样，皮肤可以应用于\
    \ ASP.NET 服务器控件。皮肤通过将整个控件的样式定义合并到单个文件中，而不是使用多个样式表，来解决复杂服务器控件的设计需求。有了皮肤，你就可以轻松地为日历和数据网格等复杂控件应用样式并设置其属性。你甚至可以在皮肤中定义诸如构成网格的列或树的节点等元素——这是\
    \ CSS 无法完成的任务。\n\n主题的另一个优点是它们驻留在 Web 应用程序的目录中。你可以拥有多个 Web 应用程序，每个应用程序都有其独特的主题。这样，你就可以放心地将主题应用于帖子，而不必担心影响例如\
    \ MCMS 对话框等其他 Web 应用程序中页面的外观和感觉。\n\n### 创建主题\n\n让我们开始为 TropicalGreen 网站创建一个主题。我们将主题命名为\
    \ Sunny，并用它为我们的网站应用新的设计。在 ASP.NET 2.0 中，单个项目使用的主题存储在项目应用程序文件夹下方的特殊文件夹 App_Themes\
    \ 中。你可以根据网站需要创建任意数量的主题（或子文件夹）。\n\n- 1. 首先，让我们创建 `App_Themes` 文件夹。在 **Solution\
    \ Explorer** 中，右键单击 **TropicalGreen** 项目并选择 **Add ASP.NET folder | Theme**。一个新的名为\
    \ `App_Themes` 的文件夹出现。\n- 2. 在 `App_Themes` 文件夹内有一个名为 `Theme1` 的子文件夹。将文件夹重命名为\
    \ `Sunny`。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_161_0.png)\n\n### 将主题应用于整个网站\n\
    \n我们已经创建了一个名为 Sunny 的主题。现在让我们将其应用于 TropicalGreen 网站。\n\n在 web.config 文件中，查找 `<pages>`\
    \ 标签并添加一个名为 theme 的属性，并将其值设置为 Sunny。\n\n```\n<pages validateRequest=\"false\"\n\
    \    theme=\"Sunny\"/>\n```\n\n我们已将 Sunny 主题应用于 TropicalGreen 网站。然而，主题尚未定义任何样式或设计。在下一节中，我们将添加皮肤和样式表来定义网站的外观和感觉。\n\
    \n> 而不是将主题应用于整个网站，我们本可以在页面级别通过设置 @Page 指令的 theme 属性来定义它。如果我们需要更大的灵活性（例如，根据用户配置文件更改主题），我们可以使用代码应用主题。\n\
    \n### 服务器控件的皮肤\n\n顾名思义，皮肤充当控件的外层覆盖物。大多数开箱即用的 ASP.NET 服务器控件都支持皮肤。然而，检查你计划使用的控件是否可以套用皮肤始终是个好主意。为此，请查找\
    \ SkinID 属性。如果控件具有 SkinID 属性，则可以为其应用皮肤。\n\n皮肤有两种类型：\n\n- **Default skins**，应用于\
    \ `SkinID` 中未定义对应皮肤的所有控件。例如，如果你为 `TextBox` 控件定义默认皮肤，则采用该主题的页面上的所有 `TextBox` 控件都将遵循默认皮肤中定义的样式。\n\
    - **Name-controlled skins**，仅针对共享相同 `SkinID` 的控件。例如，你可能为 `TextBox` 定义了一个皮肤。假设该皮肤的\
    \ `SkinID` 为 `MyTextBox`。只有 `SkinID` 与 `MyTextBox` 匹配的 `TextBox` 控件才会应用该皮肤。\n\n\
    ### 创建默认皮肤\n\n考虑在我们的 `TropicalGreen.master` 模板中之前创建的 `SiteMapPath` 控件的情况。我们希望控件使用冒号字符\
    \ (:) 作为节点分隔符。字体类型应为 Verdana。所有节点都将以粗体和绿色显示，当前节点除外，当前节点将为橙色。如果我们使用代码设置这些属性，其外观如下：\n\
    \n```\n<asp:SiteMapPath ID=\"SiteMapPath1\" runat=\"server\" Font-Names=\"Verdana\"\
    \ PathSeparator=\":\">\n    <PathSeparatorStyle Font-Bold=\"True\" ForeColor=\"\
    green\"/>\n    <CurrentNodeStyle ForeColor=\"orange\"/>\n    <NodeStyle Font-Bold=\"\
    True\" ForeColor=\"green\"/>\n    <RootNodeStyle Font-Bold=\"True\" ForeColor=\"\
    green\"/>\n</asp:SiteMapPath>\n```\n\n虽然通过代码轻松设置控件的属性，但我们也可以使用皮肤实现同样的效果。在此之前，从\
    \ `SiteMapPath` 控件中删除所有样式属性，使代码变为：\n\n```\n<asp:SiteMapPath ID=\"SiteMapPath1\"\
    \ runat=\"server\">\n</asp:SiteMapPath>\n```\n\n现在让我们为 `SiteMapPath` 控件构建一个皮肤。\n\
    \n- 1. 在 **Solution Explorer** 中，右键单击 **Sunny** 文件夹并选择 **Add New Item...**\n-\
    \ 2. 在 **Add New Item** 对话框中，选择创建新的 **Skin File** 并将其命名为 **Sunny.skin**。\n"
