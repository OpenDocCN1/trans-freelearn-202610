    - 5. In the **Add New Item** dialog, select the **MCMS Template File** item and
    enter **Basic.aspx** in the **Name** textbox. Click **Add**.


    ![](img/18a0aa8d36427a4c069b30410f998b8e_83_0.png)


    - 6. The new `Basic.aspx` template file is created and opened in **Source View**.

    - 7. Examine the contents of `Basic.aspx`.


