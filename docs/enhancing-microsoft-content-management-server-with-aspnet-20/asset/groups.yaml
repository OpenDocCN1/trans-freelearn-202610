  - "[PAGE 144]\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_144_0.png)\n\n> Here,\
    \ we have simply dragged and dropped the TreeView control onto the page and added\
    \ the necessary logic for building the tree directly onto the page itself. A better\
    \ design would be to add the TreeView control to a web user control or a server\
    \ control. Encapsulated within a web user control or server control, the site\
    \ map may be reused across multiple places in the site.\n\n# Populating Nodes\
    \ on Demand\n\nFor very large trees, it may not be practical to populate the entire\
    \ TreeView control each time it loads. Imagine a site where there are tens of\
    \ thousands of nodes in a tree; it may take quite a while before all nodes get\
    \ loaded. As an alternative, we could configure the tree to load child nodes only\
    \ after expanding a parent node.\n\nThe good news is, tree view nodes of the TreeView\
    \ control already have a built-in property named PopulateOnDemand, which when\
    \ set to true, will cause child nodes to be populated only when a parent node\
    \ expands for the first time. Let’s take a look at how we can configure the TreeView\
    \ control to populate nodes on demand.\n\n+   1. Open the Plant.aspx template\
    \ file created earlier in Design view.\n+   2. Drag a SiteMapDataSource control\
    \ from the Data section of the toolbox and drop it into the content area. Set\
    \ the ID to SiteMapDataSourceTree and the SiteMapProvider to MCMSSiteMapProvider.\n\
    +   3. Drag a TreeView control from the Navigation section of the toolbar and\
    \ drop it anywhere on the content areas. Set the DataSourceID to SiteMapDataSourceTree.\n\
    +   4. Toggle to Source view. Between the <asp:TreeView> tags, add the highlighted\
    \ code as shown here:\n\n```\n<asp:TreeView ID=\"TreeView1\" runat=\"server\"\n\
    \    DataSourceID=\"SiteMapDataSourceTree\"\n    ShowLines=\"True\">\n    <DataBindings>\n\
    \        <asp:TreeNodeBinding PopulateOnDemand=\"true\"\n            TextField=\"\
    Title\"\n            NavigateUrlField=\"Url\"\n            ToolTipField=\"Description\"\
    />\n    </DataBindings>\n</asp:TreeView>\n```\n\nThe <DataBindings> tag enables\
    \ us to specify how each site map node transforms to a tree view node. Here, we\
    \ have set the PopulateOnDemand property of each tree view node to be true. In\
    \ addition, we have mapped the following properties between the tree view node\
    \ and the site map node:"
  - "[PAGE 145]\n\n| TreeViewNode | SiteMapNode |\n|---|---|\n| Text | Title |\n|\
    \ NavigateUrl | Url |\n| Tooltip | Description |\n\n5. Next, we set the depth\
    \ of the tree such that only the first-level nodes are shown. We will also set\
    \ the PopulateNodesFromClient property of the TreeView to true so that visitors\
    \ using the latest browsers (browsers later than Internet Explorer 5.5 or Netscape\
    \ 6.0) will not have the entire page reloaded when retrieving child nodes. Instead,\
    \ a set of JavaScripts (also called AJAX or Asynchronous JavaScript and XML) will\
    \ be generated. The scripts will make use of Microsoft’s XMLHTTP ActiveX object\
    \ to call server-side scripts and asynchronously load child nodes into the tree\
    \ without refreshing the entire page.\n\n```\n<asp:TreeView ID=\"TreeView1\" runat=\"\
    server\"\n    DataSourceID=\"SiteMapDataSourceTree\"\n    ShowLines=\"True\" PopulateNodesFromClient=\"\
    True\"\n    ExpandDepth=\"1\">\n    . . . code continues . . .\n</asp:TreeView>\n\
    ```\n\nWe have configured the tree to populate nodes on demand. View any of the\
