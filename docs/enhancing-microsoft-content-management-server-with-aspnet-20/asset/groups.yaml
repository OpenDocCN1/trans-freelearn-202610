    ![](img/18a0aa8d36427a4c069b30410f998b8e_66_0.png)


    It is not necessary at this stage to register ASP.NET as detailed in the Microsoft
    Installation Instructions (KB 906145). This registration was performed by the
    Visual Studio 2005 installer.


    Additionally, it is unnecessary to configure IIS to use ASP.NET 2.0 using the
    Internet Information Services snap-in, as Visual Studio 2005 automatically sets
    this option on each MCMS website application created.


