    \ |\n| SiteMapProvider | MCMSSiteMapProvider |\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_130_0.png)\n\
    \n| 属性 | 值 |\n|---|---|\n| ID | TopMenu |\n| Orientation | Horizontal |\n| StaticDisplayLevels\
    \ | 2 |\n\n请注意，我们尚未编写任何一行代码！要查看水平菜单的实际效果，请查看任意植物页面。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_131_0.png)\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_131_1.png)\n\n菜单在首次加载时显示异常。所有菜单项，包括应隐藏的子菜单项都被显示。子菜单项只有在鼠标光标移过它们之后才会消失。我该怎么办？\n\
    \n菜单需要 XHTML 才能正确显示。在使用向导创建 MCMS Web 应用程序时，`web.config` 文件中添加了 `<xhtmlConformance>`\
    \ 标签。`<xhtmlConformance>` 标签包含一个名为 `mode` 的属性，该属性指定应用程序的 XHTML 渲染模式。MCMS 网站的默认\
    \ `mode` 属性值为 `Legacy`，这意味着某些代码将被回退以符合 XHTML v1.1 渲染行为。将 `mode` 属性值更改为 `Strict`\
    \ 或 `Transitional`，菜单控件才能正常工作。\n\n水平菜单包含所有顶级频道项的列表。然而，虽然在某些网站上显示所有项目可能有效，但对 TropicalGreen\
    \ 来说不行。我们要求水平菜单仅显示三个项目：\n\n- **首页**\n- **帮助**\n- **站点地图**\n\n## 使用自定义属性区分顶部和右侧菜单项\n\
    \n为了指定出现在顶部菜单中的项目，我们为每个顶级频道添加了自定义属性值。每个频道都有一个名为 `MenuLocation` 的自定义属性，其值可以是 `Top`\
    \ 和 `Right` 中的一个。三个频道项 `TropicalGreen`、`Help` 和 `SiteMap` 已配置为 `MenuLocation`\
    \ 为 `Top`，如 **站点管理器** 中所示。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_132_0.png)\n\
    \n## MCMSSiteMapProviderTop 类\n\n我们需要修改 `SiteMapProvider` 以查看存储在 `MenuLocation`\
