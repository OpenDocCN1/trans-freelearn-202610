    \ MCMS 的先决条件，因此可以在您的应用程序中使用 IEWC。但是，ASP.NET 2.0 提供了更丰富的导航控件，正如本书后面将看到的那样。\n\n\
    ## J# 2.0 可再发行组件\n\n我们需要安装 Visual J# 2.0 可再发行组件以启用 MCMS Site Manager 的安装。\n\n\
