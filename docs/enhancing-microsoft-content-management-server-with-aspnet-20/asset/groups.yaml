    \ of the toolbox and drop it in the table cell that contains the words (Space\
    \ for Main Body). Delete the text markers.\n- 7. Save your work.\n\nAt this stage\
    \ our simple master page contains the skeletal structure and layout of the page.\
    \ It could be further modified to include any common elements required. For example,\
    \ web controls can be used to add a common footer. Generally speaking, existing\
    \ resources from MCMS applications can be reused without any issues once they\
    \ are added to a website. However, careful consideration as to the best place\
    \ to store such elements should be taken; for example, simply reusing user controls\
    \ from a previous project may not be the best approach, as their content could\
    \ be transferred to the master page.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_107_0.png)\n\
    \nNow let’s add the MCMS Web Author Console to our master page:\n\n- 1. In **Solution\
    \ Explorer**, expand the **Console** folder.\n- 2. Drag and drop **DefaultConsole.ascx**\
    \ onto the page directly after the (**Space For Console**) text marker, and then\
    \ delete the text marker.\n- 3. From the **Build** menu choose **Build Web Site.**\n\
    \nWe have completed our TropicalGreen master page!\n\n## Creating an MCMS Template\
    \ File Based on a Master Page\n\nNow it is time to create an MCMS template file\
    \ based on the master template that we have just created. We will create a plant\
    \ template, which will be used within the TropicalGreen site to create fact-sheet\
    \ postings about plants.\n\nThe fact sheet is a resource for hobbyists wishing\
    \ to find out more about certain plants. Club members are avid gardeners. They\
    \ often exchange gardening tips with fellow members. Younger green thumbs look\
    \ up the information posted in the Plant fact sheet to tap into the wealth of\
    \ experience that has been posted by fellow gardeners.\n\n- 1. In **Solution Explorer**,\
    \ right-click the **Templates** folder, and click the **Add New Item...** button.\n\
    - 2. Select **Web Form** template within the **Visual Studio Installed Templates**\
    \ section.\n- 3. In the **Name** textbox, enter **Plant.aspx**.\n- 4. Select the\
    \ **Select master page** checkbox and click the **Add** button.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_109_0.png)\n"
  mdcn: "\n## 导入 TropicalGreen 站点部署对象文件\n\n开始之前，让我们使用站点部署管理器通过导入对象来填充数据库。\n\n- 1.\
    \ 从本书的配套网站下载 `TropicalGreen.sdo` 文件。\n- 2. 打开 **站点管理器** 并使用 MCMS 管理员账户登录。\n- 3.\
    \ 从菜单中选择 **文件 | 包 | 导入...**。\n- 4. 在站点部署导入对话框中，单击 **浏览...** 按钮。导航到之前下载的 `TropicalGreen_Final.sdo`\
    \ 文件。\n- 5. 在 **容器规则** 选项卡中，设置以下内容：\n- 6. 在 **权限组** 选项卡中，设置以下内容：\n- 7. 单击 **导入**。\n\
    - 8. 导入确认对话框出现。单击 **继续**。\n\n| 属性 | 值 |\n|---|---|\n| 添加容器时 | 使用包容器权限 |\n| 替换容器时\
    \ | 保留目标容器权限 |\n\n| 属性 | 值 |\n|---|---|\n| 选择如何导入权限组 | 导入用户权限组 |\n\n## 创建新的 MCMS\
    \ Web 应用程序\n\n开始之前，让我们使用上一章创建的项目模板创建一个新的 MCMS Web 应用程序。\n\n- 1. 在 Visual Studio\
    \ 中，从 **文件菜单** 中选择 **新建 | 网站**。\n- 2. 在 **新建网站** 对话框中，在 **我的模板** 部分选择 **MCMS SP2\
    \ Web 应用程序** 图标。\n- 3. 在 **位置** 列表框中选择 **HTTP**。\n- 4. 在 **位置** 文本框中输入 **http://localhost/TropicalGreen**，然后单击\
    \ **确定**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_103_0.png)\n\n我们的 MCMS Web\
    \ 应用程序已创建并在 Visual Studio 2005 中打开。\n\n## 为 MCMS 创建主页面\n\n我们现在将向 MCMS Web 应用程序添加一个母版页，并添加使其可与\
    \ MCMS 一起使用的必要元素。\n\n- 1. 在 **解决方案资源管理器** 中，右键单击您的网站并单击 **添加新项...**\n- 2. 在 **添加新项**\
    \ 对话框中，在 **Visual Studio 已安装模板** 部分选择 **母版页** 模板。\n\n### 使用母版页\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_104_0.png)\n\
    \n- 3. 在名称文本框中输入 TropicalGreen.master，然后单击添加。\n- 4. 母版页已创建并在 Visual Studio 源视图中打开。\n\
    \n> 为了在母版页中使用 MCMS 控件（如 RobotMetaTag 控件），需要一个 Register 指令。\n\n- 5. 在母版页中直接在现有的\
    \ Page 指令下方输入以下内容：\n\n```\n<%@ Register Assembly=\"Microsoft.ContentManagement.WebControls,\
    \ Version=5.0.1200.0, Culture=neutral, PublicKeyToken=31bf3856ad364e35\" Namespace=\"\
    Microsoft.ContentManagement.WebControls\" TagPrefix=\"cms\" %>\n```\n\n在母版页中添加此\
    \ Register 指令允许我们在母版页中使用 MCMS 控件，并避免我们必须将其添加到使用该母版页的模板中。\n\n现在可以添加 MCMS 控件，并提供完整的\
    \ Visual Studio 2005 IntelliSense 支持！\n\n- 6. 将光标放置在 `<head />` 元素内的 `<title />`\
    \ 元素正下方。\n- 7. 输入 `<cms:`，IntelliSense 将弹出。选择 **cms:RobotMetaTag** 并按 *空格*。\n\n\
    ![](img/18a0aa8d36427a4c069b30410f998b8e_105_0.png)\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_105_1.png)\n\
    \nRobotMetaTag 控件负责发出 `robots` 元标记，搜索引擎使用这些标记来决定是否索引页面，以及是否应跟随当前页面上的链接。这些元标记的值由帖子的\
    \ `IsRobotIndexable` 和 `IsRobotFollowable` 属性控制。此外，该控件会在 HTML 内容中添加一个 base 标签，以确保在请求帖子时可以找到模板项目内部文件的相对引用。\n\
    \n- 8. 使用 IntelliSense 通过添加 `runat=\"server\"` 属性来完成该标签。\n\n母版页现在已准备好用于任何通用布局、品牌和导航元素。我们现在将使用基于\
    \ HTML 表格的简单布局重新创建我们的 TropicalGreen 设计。\n\n- 1. 从本书的配套网站下载 `Logo.gif` 文件。\n- 2.\
    \ 在 **解决方案资源管理器** 中，右键单击您的网站并单击 **新建文件夹**，并将其命名为 `images`。\n- 3. 将 `Logo.gif`\
    \ 文件添加到 `images` 文件夹。\n- 4. 我们将配置页面，使其顶部和左侧边缘没有边距。按如下方式修改 `<body />` 元素：\n  `<body\
    \ topmargin=\"0\" leftmargin=\"0\">`\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_106_0.png)\n\
    \n> 此标记将产生验证错误。我们可以通过用全局 CSS 文件中的定义替换它来避免这种情况。主题和皮肤在第 5 章中介绍。\n\n- 5. 按原样在 <form>\
    \ 标签之间输入以下代码，替换现有内容。包含文本标记（例如 (Space for Console)）。标记为我们提供了视觉提示，告诉我们稍后放置控件的位置。页面在表格内格式化，顶部为徽标和水平菜单，右侧为垂直菜单。其余空间用于主体或内容。\n\
    \n```\n<table width=\"100%\" border=\"0\" cellspacing=\"0\" cellpadding=\"0\"\
    \ height=\"100%\">\n<tr>\n    <td width=\"100%\" colspan=\"2\" valign=\"top\"\
    \ bgcolor=\"#FFD300\">\n        <img src=\"/tropicalgreen/images/Logo.gif\"/>\n\
    \    </td>\n    <td rowspan=\"10\" valign=\"top\">\n        (Space for Console)\n\
    \    </td>\n</tr>\n<tr bgcolor=\"#66CC33\">\n    <td colspan=\"2\">(Space for\
    \ Top Menu)</td>\n</tr>\n<tr>\n    <td valign=\"top\">\n        (Space for SiteMapPath\
    \ Control)<br/>\n        (Space for Main Body)\n    </td>\n    <td class=\"RightMenuBar\"\
    \ width=\"20%\" valign=\"top\" height=\"100%\" align=\"middle\" rowspan=\"2\"\
    \ bgcolor=\"#669900\">\n        (Space for Right Menu Bar)\n    </td>\n</tr>\n\
    </table>\n```\n\n- 6. 切换到设计视图。从工具箱的标准部分拖动 ContentPlaceholder 控件并将其放置在包含文字 (Space\
    \ for Main Body) 的表格单元格中。删除文本标记。\n- 7. 保存您的工作。\n\n在此阶段，我们的简单母版页包含页面的骨架结构和布局。它可以进一步修改以包含所需的任何通用元素。例如，可以使用\
    \ Web 控件添加通用页脚。一般来说，一旦将 MCMS 应用程序的现有资源添加到网站中，就可以毫无问题地重复使用它们。但是，应仔细考虑存储此类元素的最佳位置；例如，简单地重用来自先前项目的用户控件可能不是最佳方法，因为其内容可以转移到母版页。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_107_0.png)\n\n现在让我们将 MCMS Web 作者控制台添加到我们的母版页：\n\
    \n- 1. 在 **解决方案资源管理器** 中，展开 **Console** 文件夹。\n- 2. 将 **DefaultConsole.ascx** 拖放到页面中\
    \ (**Space For Console**) 文本标记之后，然后删除文本标记。\n- 3. 从 **生成** 菜单中选择 **生成网站。**\n\n\
    我们已完成 TropicalGreen 母版页！\n\n## 基于母版页创建 MCMS 模板文件\n\n现在是时候基于我们刚刚创建的主模板创建 MCMS 模板文件了。我们将创建一个植物模板，该模板将在\
    \ TropicalGreen 网站内用于创建有关植物的事实表帖子。\n\n事实表是爱好者了解有关某些植物的更多信息的资源。俱乐部成员都是热衷的园丁。他们经常与\
    \ fellow 成员交换园艺技巧。年轻的园艺爱好者会查阅 Plant 事实表中发布的信息，以利用 fellow 园丁发布的丰富经验。\n\n- 1. 在\
    \ **解决方案资源管理器** 中，右键单击 **Templates** 文件夹，然后单击 **添加新项...** 按钮。\n- 2. 在 **Visual\
    \ Studio 已安装模板** 部分中选择 **Web Form** 模板。\n- 3. 在 **名称** 文本框中输入 **Plant.aspx**。\n\
    - 4. 选择 **选择母版页** 复选框并单击 **添加** 按钮。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_109_0.png)\n"
