    \ Services（版本 3.0）集成。\n\n虽然 Publishing API 的全面改造可能意味着我们为网站编写的大部分自定义代码都必须重新编码，但好消息是：大多数当前属性和方法的功能将有一对一的映射。详细信息可在文章\
