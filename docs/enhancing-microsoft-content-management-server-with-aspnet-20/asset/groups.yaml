    \ 并查看频道内的所有植物页面列表。\n\n频道渲染脚本 ChannelRenderingScript.aspx 可以应用于网站上的所有其他频道。请继续将其分配为\
    \ Columns 和 Gardens 频道的频道渲染脚本。\n\n## 摘要\n\n使用随 ASP.NET 2.0 提供的导航控件，构建站点导航从未如此简单。在本章中，我们首先构建了一个自定义\
