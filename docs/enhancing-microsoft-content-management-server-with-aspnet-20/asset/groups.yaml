  md: "\n## Why Themes with Style Sheets May Not Work on MCMS Sites\n\nLook at the\
    \ HTML source of the posting (right-click anywhere on the page and select View\
    \ Source) and take a closer look at the <link> tag generated by the theme. It\
    \ should resemble the one that follows:\n\n```\n<link href=\"../App_Themes/Sunny/Sunny.css\"\
    \n    type=\"text/css\" rel=\"stylesheet\"/>\n```\n\nThe URL stored in the <link>\
    \ tag is a path that is relative to that of the template file. In this example,\
    \ the preceding dot-dot-slash (../) characters indicate that the App_Themes folder\
    \ is stored in the same parent folder as the current page. In a regular web application,\
    \ referring to the style sheet using its relative path works correctly. After\
    \ all, if you looked at the file structure, you can indeed find the style sheet\
    \ at the suggested path.\n\nHowever, when viewing a posting, we aren’t accessing\
    \ the template file directly. For example, to view the Aloe Vera posting, we request\
    \ the URL http://tropicalgreen/PlantCatalog/AloeVera.htm. The browser, not knowing\
    \ that the MCMS ISAPI filter has rewritten the URL, attempts to retrieve the file\
    \ by converting the relative path to the absolute path http://tropicalgreen/PlantCatalog/../App_Themes/Sunny/Sunny.css.\n\
    \nThis path will, however, not evaluate to the real location of the CSS file,\
    \ as the folder that’s one-level above the AloeVera.htm page is tropicalgreen.\
    \ Also, because the App_Themes folder is stored in the Templates project directory\
    \ (see the following screenshot), looking for it under tropicalgreen (or the root\
    \ website) will result in an HTTP 404 error.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_168_0.png)\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_169_0.png)\n\nIf using relative paths\
    \ results in HTTP 404 errors when accessing the style sheet, how then, did the\
    \ style get successfully applied to the posting? The secret lies in the RobotMetaTag.\
    \ In MCMS websites, the RobotMetaTag has a RenderBaseHref property, which when\
    \ set to true (its default value), will generate a <base> tag between the <head>\
    \ tags of the page. Search the generated HTML source of the posting, and you will\
    \ find the <base> tag that looks like the following:\n\n```\n<base href=\"http://tropicalgreen/tropicalgreen/Templates/Plant.aspx\"\
    >\n```\n\nWhen evaluating links on a page, the web browser automatically prefixes\
    \ all relative links with the value stored in the href attribute of the <base>\
    \ tag (instead of the requesting URL for the page) such that a relative path like\
    \ ../App_Themes/Sunny/Sunny.css becomes http://tropicalgreen/tropicalgreen/Templates/../App_Themes/Sunny/Sunny.css.\n\
    \nThe converted URL does lead to the style sheet, so we don’t get any HTTP 404\
    \ errors.\n\nBy default, the RenderBaseHref property of the RobotMetaTag control\
    \ stores the Boolean true. So usually, the <base> tag is generated and you won’t\
    \ have to worry about paths to style sheets and other relative links being inaccessible.\
    \ However, depending on the site setup, there may be special situations where\
    \ generating a <base> is not desirable.\n\nConsider the case of a hosting scenario\
    \ where a firewall or proxy forwards the request to an internal web server. The\
    \ trouble with the MCMS-generated <base> tag is that it contains the full URL,\
    \ which may include the server’s name, especially when the \"map channels to host\
    \ headers\" option has been turned off. When the internal server returns the page\
    \ back to the proxy, the <base> tag of the returned page will contain the name\
    \ of the internal server instead of the site’s domain name as entered in the browser.\n\
    \nTo simulate this scenario, try viewing the postings again, but this time by\
    \ using a URL like http://servername/tropicalgreen/plantcatalog/aloevera.htm.\
    \ Notice that when you do so, the server’s name is stored in the <base> tag as\
    \ such:\n\n```\n<base href=\"http://servername/tropicalgreen/tropicalgreen/Templates/Plant.aspx\"\
    >\n```\n\n> Of course, the usual URL omits the server’s name and will just be\
    \ http://tropicalgreen/plantcatalog/aloevera.htm. But since we are testing to\
    \ see how the server name creeps into the base URL, we have added it in for this\
    \ exercise.\n\nUnless the user’s browser has access to the internal server, it\
    \ will likely receive HTTP 404 errors when attempting to access resources like\
    \ style sheets. In such cases, the RenderBaseHref property has to be disabled\
    \ and an alternative solution found.\n\n## Applying Themes when the RenderBaseHref\
    \ Property is Disabled\n\nIn case the <base> tag can’t be used, we need to have\
    \ a different way to ensure that the App_Themes folder is accessed with the correct\
    \ URL. As ASP.NET has no way to configure the way it generates the URL to the\
    \ theme’s folder, we need to modify this URL after ASP.NET has generated it.\n\
    \nThere are many ways to address the problem. We could manually add code to each\
    \ and every template file that has the theme applied. However, not only would\
    \ that be tedious, but repeating code in multiple places is also not good programming\
    \ practice. We could create a server-side control to encapsulate the code and\
    \ insert it into each template file that requires it. Again, this requires code\
    \ for the control to be copied into every template file — there’s still the possibility\
    \ that it may get forgotten, especially when new templates are created.\n\nThe\
    \ solution is to build an HTTP module. In this way, we can guarantee that all\
    \ pages will have the correction without having to touch any of the existing template\
    \ files. Before the page is sent to the browser, the HTTP module will convert\
    \ all relative paths stored in <link> tags to absolute paths that do not contain\
    \ the name of the server. The module will look for <link> tags such as the one\
    \ for the style sheet:\n\n```\n<link href=\"../App_Themes/Sunny/Sunny.css\" type=\"\
    text/css\" rel=\"stylesheet\"/>\n```\n\nAfter the conversion process, the <link>\
    \ tag will be rendered as:\n\n```\n<link href=\"/tropicalgreen/App_Themes/Sunny/Sunny.css\"\
    \ type=\"text/css\" rel=\"stylesheet\"/>\n```\n\n## Creating the CorrectThemes\
    \ HTTP Module\n\nLet’s create the HTTP module that corrects the URL stored in\
    \ the <link> tags.\n\n- 1. Add a new Visual C# Class Library project to the solution.\
    \ Name the project **TropicalGreenHttpModules**.\n- 2. Delete the `Class1.cs`\
    \ file created by the wizard. We won’t need it.\n- 3. Add the following reference\
    \ required by the project:\n```\nMicrosoft.ContentManagement.Publishing.dll\n\
    ```\n(The library file is located in the `<install directory>\\Microsoft Content\
    \ Management Server\\Server\\bin\\` directory).\nAs well as the following references\
    \ from the `System` namespace:\n```\nSystem.Web\n```\n- 4. Add a class file to\
    \ the **TropicalGreenHttpModules** project. Name the new class file **CorrectLinksInThemes.cs**.\n\
    - 5. Add the following using statements above the namespace declaration:\n```\n\
    using System;\n. . . code continues . . .\n\nusing System.Web;\nusing System.Web.UI;\n\
    using System.Web.UI.HtmlControls;\nusing Microsoft.ContentManagement.Publishing;\n\
    \nnamespace TropicalGreenHttpModules\n{\n    . . . code continues . . .\n}\n```\n\
    - 6. As we are creating an HTTP module, the class will implement the `IHttpModule`\
    \ interface. Add a colon followed by the interface name as shown in the following\
    \ code:\n```\npublic class CorrectLinksInThemes : IHttpModule\n{\n}\n```\n- 7.\
    \ The IHttpModule requires the implementation of both the Init() and Dispose()\
    \ methods. Add the following code to the CorrectLinksInThemes class file:\n```\n\
    public class CorrectLinksInThemes : IHttpModule\n{\n    public void Init(HttpApplication\
    \ httpApp)\n    {\n    }\n\n    public void Dispose()\n    {\n    }\n}\n```\n\
    - 8. As all <link> tags stored in the page are analyzed before the page is rendered,\
    \ we will write the code in the OnPreRender() event handler of the page object.\
    \ The code loops through each control found in the page header. If the control\
    \ is a <link> tag, it checks if the link is relative, and converts it to an absolute\
    \ link if necessary. Add the OnPreRender() event handler below the Dispose() method.\n\
    ```\npublic void OnPreRender(object sender, EventArgs eventArgs)\n{\n    Page\
    \ currentPage = sender as Page;\n    HtmlHead pageHeader = currentPage.Header\
    \ as HtmlHead;\n    if (pageHeader != null)\n    {\n        foreach (Control control\
    \ in pageHeader.Controls)\n        {\n            HtmlLink link = control as HtmlLink;\n\
    \            if (link != null &&\n                VirtualPathUtility.IsAppRelative(link.Href))\n\
    \            {\n                link.Href = VirtualPathUtility.ToAbsolute\n  \
    \                  (link.Href);\n            }\n        }\n    }\n}\n```\n- 9.\
    \ We need to register the OnPreRender() event handler that we have written earlier\
    \ to the PreRender() event of the page. A good place to do so would be within\
    \ the OnPreRequestHandlerExecute() event handler of the current\n"
  mdcn: "\n## 为什么使用样式表的主题在 MCMS 站点上可能无法工作\n\n查看帖子的 HTML 源代码（在页面任意位置右键单击并选择查看源代码），并仔细查看主题生成的\
    \ <link> 标签。它应该类似于以下内容：\n\n```\n<link href=\"../App_Themes/Sunny/Sunny.css\"\n\
    \    type=\"text/css\" rel=\"stylesheet\"/>\n```\n\n<link> 标签中存储的 URL 是相对于模板文件的路径。在此示例中，前面的点点斜杠\
    \ (../) 字符表示 App_Themes 文件夹存储在当前页面所在的同一父文件夹中。在常规 Web 应用程序中，使用相对路径引用样式表可以正常工作。毕竟，如果查看文件结构，确实可以在建议的路径下找到样式表。\n\
    \n然而，在查看帖子时，我们并不是直接访问模板文件。例如，要查看芦荟帖子，我们请求 URL http://tropicalgreen/PlantCatalog/AloeVera.htm。浏览器不知道\
    \ MCMS ISAPI 过滤器已重写 URL，尝试通过将相对路径转换为绝对路径 http://tropicalgreen/PlantCatalog/../App_Themes/Sunny/Sunny.css\
    \ 来检索文件。\n\n然而，此路径不会解析为 CSS 文件的实际位置，因为 AloeVera.htm 页面上一级的文件夹是 tropicalgreen。此外，由于\
    \ App_Themes 文件夹存储在 Templates 项目目录中（参见以下屏幕截图），在 tropicalgreen（或根网站）下查找它将导致 HTTP\
    \ 404 错误。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_168_0.png)\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_169_0.png)\n\
    \n如果使用相对路径在访问样式表时会产生 HTTP 404 错误，那么样式是如何成功应用于帖子的呢？秘密在于 RobotMetaTag。在 MCMS 网站中，RobotMetaTag\
    \ 具有 RenderBaseHref 属性，当设置为 true（其默认值）时，会在页面的 <head> 标签之间生成一个 <base> 标签。搜索帖子生成的\
    \ HTML 源代码，你会找到如下所示的 <base> 标签：\n\n```\n<base href=\"http://tropicalgreen/tropicalgreen/Templates/Plant.aspx\"\
    >\n```\n\n在评估页面上的链接时，Web 浏览器会自动将所有相对链接与 <base> 标签的 href 属性中存储的值前缀（而不是页面请求的 URL），使得像\
    \ ../App_Themes/Sunny/Sunny.css 这样的相对路径变为 http://tropicalgreen/tropicalgreen/Templates/../App_Themes/Sunny/Sunny.css。\n\
    \n转换后的 URL 确实指向样式表，因此我们不会收到任何 HTTP 404 错误。\n\n默认情况下，RobotMetaTag 控件的 RenderBaseHref\
    \ 属性存储布尔值 true。因此通常会生成 <base> 标签，你无需担心样式表路径和其他相对链接无法访问的问题。然而，根据站点设置，可能存在生成 <base>\
    \ 不希望的特殊情况。\n\n考虑防火墙或代理将请求转发到内部 Web 服务器的主机场景。MCMS 生成的 <base> 标签的问题在于它包含完整的 URL，其中可能包含服务器名称，尤其是在关闭了“将频道映射到主机头”选项时。当内部服务器将页面返回给代理时，返回页面的\
    \ <base> 标签将包含内部服务器的名称，而不是浏览器中输入的站点域名。\n\n要模拟此场景，请再次查看帖子，但这次使用类似 http://servername/tropicalgreen/plantcatalog/aloevera.htm\
    \ 的 URL。注意，当你这样做时，服务器的名称会以如下方式存储在 <base> 标签中：\n\n```\n<base href=\"http://servername/tropicalgreen/tropicalgreen/Templates/Plant.aspx\"\
    >\n```\n\n> 当然，通常的 URL 省略了服务器名称，只会是 http://tropicalgreen/plantcatalog/aloevera.htm。但由于我们正在测试服务器名称如何渗入\
    \ base URL，因此在此练习中我们特意添加了它。\n\n除非用户的浏览器可以访问内部服务器，否则在尝试访问样式表等资源时很可能会收到 HTTP 404\
    \ 错误。在这种情况下，必须禁用 RenderBaseHref 属性并找到替代解决方案。\n\n## 在 RenderBaseHref 属性被禁用时应用主题\n\
    \n如果无法使用 <base> 标签，我们需要有另一种方法来确保 App_Themes 文件夹使用正确的 URL 被访问。由于 ASP.NET 没有配置其生成主题文件夹\
    \ URL 的方式，我们需要在 ASP.NET 生成它之后修改此 URL。\n\n解决此问题的方法有很多。我们可以手动向每个应用了主题的模板文件添加代码。然而，这不仅繁琐，而且在多个地方重复代码也不是良好的编程实践。我们可以创建一个服务器端控件来封装代码并插入到需要它的每个模板文件中。同样，这要求控件的代码被复制到每个模板文件中——仍然有可能被遗忘，尤其是在创建新模板时。\n\
    \n解决方案是构建一个 HTTP 模块。这样，我们就可以保证所有页面都进行修正，而无需触及任何现有的模板文件。在页面发送到浏览器之前，HTTP 模块会将 <link>\
    \ 标签中存储的所有相对路径转换为不包含服务器名称的绝对路径。模块将查找如下样式表的 <link> 标签：\n\n```\n<link href=\"../App_Themes/Sunny/Sunny.css\"\
    \ type=\"text/css\" rel=\"stylesheet\"/>\n```\n\n转换过程后，<link> 标签将被渲染为：\n\n```\n\
    <link href=\"/tropicalgreen/App_Themes/Sunny/Sunny.css\" type=\"text/css\" rel=\"\
    stylesheet\"/>\n```\n\n## 创建 CorrectThemes HTTP 模块\n\n让我们创建纠正 <link> 标签中存储的 URL\
    \ 的 HTTP 模块。\n\n- 1. 在解决方案中添加一个新的 Visual C# 类库项目。将项目命名为 **TropicalGreenHttpModules**。\n\
    - 2. 删除向导创建的 `Class1.cs` 文件。我们不需要它。\n- 3. 添加项目所需的以下引用：\n```\nMicrosoft.ContentManagement.Publishing.dll\n\
    ```\n（库文件位于 `<install directory>\\Microsoft Content Management Server\\Server\\\
    bin\\` 目录中）。\n以及来自 `System` 命名空间的以下引用：\n```\nSystem.Web\n```\n- 4. 向 **TropicalGreenHttpModules**\
    \ 项目添加一个类文件。将新类文件命名为 **CorrectLinksInThemes.cs**。\n- 5. 在命名空间声明上方添加以下 using 语句：\n\
    ```\nusing System;\n. . . code continues . . .\n\nusing System.Web;\nusing System.Web.UI;\n\
    using System.Web.UI.HtmlControls;\nusing Microsoft.ContentManagement.Publishing;\n\
    \nnamespace TropicalGreenHttpModules\n{\n    . . . code continues . . .\n}\n```\n\
    - 6. 由于我们正在创建 HTTP 模块，类将实现 `IHttpModule` 接口。在以下代码中所示添加冒号后跟接口名称：\n```\npublic class\
    \ CorrectLinksInThemes : IHttpModule\n{\n}\n```\n- 7. IHttpModule 要求实现 Init()\
    \ 和 Dispose() 方法。向 CorrectLinksInThemes 类文件添加以下代码：\n```\npublic class CorrectLinksInThemes\
    \ : IHttpModule\n{\n    public void Init(HttpApplication httpApp)\n    {\n   \
    \ }\n\n    public void Dispose()\n    {\n    }\n}\n```\n- 8. 由于页面中存储的所有 <link>\
    \ 标签在页面呈现之前都会被分析，我们将在页面对象的 OnPreRender() 事件处理程序中编写代码。代码遍历页面头中找到的每个控件。如果控件是 <link>\
    \ 标签，它会检查链接是否相对，并在必要时将其转换为绝对链接。在 Dispose() 方法下方添加 OnPreRender() 事件处理程序。\n```\n\
    public void OnPreRender(object sender, EventArgs eventArgs)\n{\n    Page currentPage\
    \ = sender as Page;\n    HtmlHead pageHeader = currentPage.Header as HtmlHead;\n\
    \    if (pageHeader != null)\n    {\n        foreach (Control control in pageHeader.Controls)\n\
    \        {\n            HtmlLink link = control as HtmlLink;\n            if (link\
    \ != null &&\n                VirtualPathUtility.IsAppRelative(link.Href))\n \
    \           {\n                link.Href = VirtualPathUtility.ToAbsolute\n   \
    \                 (link.Href);\n            }\n        }\n    }\n}\n```\n- 9.\
    \ 我们需要将之前编写的 OnPreRender() 事件处理程序注册到页面的 PreRender() 事件。一个好的位置是在当前\n"
