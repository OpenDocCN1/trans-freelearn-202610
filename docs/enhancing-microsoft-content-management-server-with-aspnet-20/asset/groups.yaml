  md: "\n```\nprotected System.Web.UI.WebControls.DataGrid DataGrid1;\nprivate void\
    \ Page_Load(object sender, System.EventArgs e)\n{\n    // Get the current CMS\
    \ Http context\n    CmsHttpContext cmsContext = CmsHttpContext.Current;\n\n  \
    \  // Get a list of all postings that have been modified in the last\n    // 7\
    \ days\n    PostingCollection newPostings = cmsContext.Searches.NewPostings(7);\n\
    \n    // Bind the result to the DataGrid\n    DataGrid1.DataSource = newPostings;\n\
    \    DataGrid1.DataBind();\n}\n```\n\nTo modularize the code and isolate the parts\
    \ that interact with the MCMS PAPI and the parts that work with the PAPI, you\
    \ could create a data abstraction layer. The data abstraction layer could be a\
    \ separate class file. Before we begin modularizing the code, let’s identify the\
    \ parts that make use of the MCMS PAPI. The lines of code that use the PAPI are\
    \ the parts that get the current CmsHttpContext and the list of postings modified\
    \ in the last seven days as highlighted here:\n\n```\nprotected System.Web.UI.WebControls.DataGrid\
    \ DataGrid1;\nprivate void Page_Load(object sender, System.EventArgs e)\n{\n \
    \   // Get the current CMS Http context\n    CmsHttpContext cmsContext = CmsHttpContext.Current;\n\
    \n    // Get a list of all postings that have been modified in the last\n    //\
    \ 7 days\n    PostingCollection newPostings = cmsContext.Searches.NewPostings(7);\n\
    \n    // Bind the result to the DataGrid\n    DataGrid1.DataSource = newPostings;\n\
    \    DataGrid1.DataBind();\n}\n```\n\nTo isolate the code, we will extract all\
    \ highlighted portions of the code and add them to the data abstraction layer.\
    \ In this example, the data abstraction layer will simply be a separate class\
    \ file called DataAbstractionExample. Here, we have two methods: GetCurrentCMSContext()\
    \ gets the current CmsHttpContext, and GetListOfPostings() returns a list of all\
    \ postings modified in the last seven days.\n\n```\npublic class DataAbstractionExample\n\
    {\n    private static CmsHttpContext GetCurrentCMSContext()\n    {\n        return\
    \ CmsHttpContext.Current;\n    }\n    public static PostingCollection GetListOfPostings()\n\
    \    {\n        // Get the current CMS Http Context\n        CmsHttpContext cmsContext\
    \ = GetCurrentCMSContext();\n        // Get a list of all postings that have been\
    \ modified in the\n        // last 7 days\n        PostingCollection newPostings\
    \ =\n            cmsContext.Searches.NewPostings(7);\n        return newPostings;\n\
    \    }\n```\n```\n\nNext, we modify the original code to call GetListOfPostings()\
    \ from the data abstraction layer instead. Notice that we have removed all code\
    \ that uses the MCMS PAPI from the Page_Load() event handler.\n\n```\n    protected\
    \ System.Web.UI.WebControls.DataGrid DataGrid1;\n    private void Page_Load(object\
    \ sender, System.EventArgs e)\n    {\n        // Bind the result to the DataGrid\n\
    \        DataGrid1.DataSource = DataAbstractionExample.GetListOfPostings(7);\n\
    \        DataGrid1.DataBind();\n    }\n```\n```\n\nAt first glance, extracting\
    \ all code that interfaces with the PAPI may not appear to make any difference\
    \ to the behavior of the site. In fact, what we have done is added more lines\
    \ of code to the application and made it a little more complex.\n\nNevertheless,\
    \ separating the code into modular layers makes the migration process, should\
    \ you choose to embark on one later, easier. Instead of making code modifications\
    \ in scattered areas of the website, you could concentrate your effort on the\
    \ data abstraction layers. In this example, we would only need to amend the DataAbstractionExample\
    \ class, leaving the original web form (and all other web forms that use the GetListOfPostings()\
    \ method) intact.\n\nIn addition, depending on your site’s setup, it may be possible\
    \ to run MCMS and MOSS 2007 side by side and upgrade the site in phases. In this\
    \ way, you could plan to rewrite the data abstraction layers in sections. The\
    \ advantage of a phased approach would mean that you get to enjoy the new features\
    \ of MOSS 2007 without waiting for the entire site to be upgraded.\n\n## Use the\
    \ Provider Model Design Pattern\n\nIn this book, we have discussed how the Provider\
    \ Model can be used when building site navigation controls (Chapter 4) or when\
    \ performing Forms Authentication (Chapter 6).\n\nUsing the Provider Model extends\
    \ the idea of isolating code that uses the PAPI from other sections of code. As\
    \ we have seen in earlier chapters, the Provider Model allows us to separate the\
    \ \"business logic\", which interrogates the MCMS repository, from the \"presentation\
    \ logic\", which is responsible for returning HTML to the browser. For example,\
    \ when building the site navigation, we used the standard `SiteMapPath` and `TreeView`\
    \ controls for the presentation logic. We then implemented the business logic\
    \ by building the `MCMSsiteMapProvider` class, which used the PAPI to query the\
    \ repository for a list of navigation items.\n\nWhen it’s time to upgrade the\
    \ site, only the Provider Model needs to be replaced, either with native MOSS\
    \ 2007 functionality or an alternative provider that speaks to MOSS. For example,\
    \ to upgrade the navigation controls for the TropicalGreen site, we would just\
    \ rewrite the `MCMSsiteMapProvider.cs` class file. The `SiteMapPath` or `TreeView`\
    \ controls that are part of the presentation layer can be reused without further\
    \ modifications.\n\n> More details on how to plan for the future release of MOSS\
    \ 2007 are available in the following white paper:\n> http://msdn.microsoft.com/library/en-us/dnmscms02/html/CMSDesigningCMS2002Sol.asp\n\
    \n## Summary\n\nIn this chapter we discussed a couple of tips that will ease developing\
    \ websites with MCMS. First we saw how the `PostBackUrl` property can be used\
    \ to pass data from one page to another. Following that, we devised a workaround\
    \ to get it to work correctly on MCMS sites.\n\nNext, we discussed the nifty Ad\
    \ Rotator control that ships with ASP.NET 2.0. While the Ad Rotator control has\
    \ been around for a while, this latest version allows us to bind the control’s\
    \ contents directly with a non-static XML file. We are now able to integrate the\
    \ control directly with MCMS resource-gallery items, providing a flexible and\
    \ useful addition to our toolbox.\n\nFinally, we discussed some considerations\
    \ for future plans to ease the migration of existing applications to the next\
    \ release of MOSS 2007.\n\n## Index\n\nA\nActive Directory Application Mode\n\
