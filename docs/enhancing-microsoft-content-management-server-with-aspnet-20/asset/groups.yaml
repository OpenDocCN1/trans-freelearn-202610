  - '[PAGE 139]


    # # The TreeView Control


    The TreeView control provides a hierarchical view of all items on the site. It
    is often used in site maps or as an alternative to the menu control. TreeViews
    are popular because they are intuitive to use. Most users would instinctively
    know how to expand and collapse folders to get content.


    Let’s add a page that uses the TreeView control. We will use it to display a graphical
    view of the entire site map and link it to the Site Map link in the top horizontal
    menu item. Here’s how the completed tree will look when done. Don’t worry about
    the look and feel of the tree for now; we will spice it up with colors and images
    in the next chapter on themes.


    ![](img/18a0aa8d36427a4c069b30410f998b8e_139_0.png)


    The first cut of our site map loads all nodes into the tree at once. In a later
    section, we will show how nodes may be populated on demand, when the parent node
    is expanded.'
