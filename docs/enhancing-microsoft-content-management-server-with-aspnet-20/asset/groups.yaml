  mdcn: "\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_66_0.png)\n\n在此阶段无需按照 Microsoft\
    \ 安装说明（KB 906145）中所述注册 ASP.NET。此注册已由 Visual Studio 2005 安装程序完成。\n\n此外，无需使用 Internet\
    \ Information Services 快照配置 IIS 以使用 ASP.NET 2.0，因为 Visual Studio 2005 会在创建的每个\
    \ MCMS 网站应用程序上自动设置此选项。\n\n但是，如果您在 Windows Server 2003 SP1 上安装，则必须配置虚拟网站根目录和 MCMS\
    \ 虚拟目录以使用 ASP.NET 2.0，因为在同一个应用程序池中无法使用两个版本的 ASP.NET。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_66_1.png)\n\
    \n支持开箱即用的占位符控件的 ActiveX 工具栏控件已随 SP2 更新。因此，首次切换到编辑模式时，您可能会被提示安装此控件。\n\n您可以使用 regsvr32\
    \ 或组策略预先安装控件，详细说明请参见 http://download.microsoft.com/download/4/2/5/4250f79a-c3a1-4003-9272-2404e92bb76a/MCMS+2002++(complete)+FAQ.htm#51C0CE4B-FC57-454C-BAAE-12C09421B57B。\n\
    \n## 运行数据库配置应用程序\n\n在此阶段，我们准备配置 MCMS。\n\n1. 选择 **Start | Programs | Microsoft\
    \ Content Management Server | Database Configuration Application.**\n\n2. 在启动画面上，单击\
    \ Next。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_67_0.png)\n\n3. 在“选择 MCMS\
    \ 内容服务器 ASP 兼容模式”页面上，选择 ASP.NET Mode 单选按钮并单击 Next。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_67_1.png)\n\
    \n4. 在 **Please select a virtual site for hosting the Microsoft Content Management\
    \ Server** 页面上，选择 **Read/Write Site** 单选按钮，然后单击 **Next**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_68_0.png)\n\
    \n5. 在 **SCA Web Entry Point** 页面上，单击 **Next**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_68_1.png)\n\
    \n6. 当出现安全警告提示时，单击 **Yes**（因为在 Windows XP 上没有进一步保护 SCA 的方法）。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_69_0.png)\n\
    \n### 在 Windows Server 2003 SP1 上安装时\n\n在 *Installing Internet Information Services*\
    \ 部分中，选择之前创建的额外虚拟网站作为 SCA Web Entry Point。\n\n7. 在 **MCMS System Account** 页面上，输入在前面\
    \ *Creating Service Accounts* 部分中创建的帐户详细信息，然后单击 **Next**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_69_1.png)\n\
    \n8. 在 **Grant right?** 对话框中，单击 **Yes**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_70_0.png)\n\
    \n9. 在 **Stop service?** 对话框中，单击 **Yes**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_70_1.png)\n\
    \n10. 在 **Select MCMS Database** 屏幕上，单击 **Select Database** 按钮。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_70_2.png)\n\
    \n11. 在 SQL Server 登录对话框中，在服务器文本框中输入一个句点 (.)，然后单击 Options。在数据库组合框中选择 TropicalGreen\
    \ 然后单击 OK。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_71_0.png)\n\n> 一个句点 (.)\
    \ 是本地计算机的 Netbios/RPC 别名。如果 SQL Server 客户端库能够确定 SQL Server 在本地计算机上，则当 SQL Server\
    \ 与应用程序安装在同一台计算机上时，应用程序将使用共享内存而不是网络协议来访问 SQL Server。此配置也可以使用 SQL 客户端配置实用工具进行控制。\n\
    \n12. 在 Select MCMS Database 页面上，单击 Next。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_71_1.png)\n\
    \n13. 在 **Empty Database** 对话框中，单击 **Yes**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_72_0.png)\n\
    \n14. 在 **Database Population** 页面上，单击 **Next**，并等待 MCMS Schema 安装完成。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_72_1.png)\n\
    \n15. 在 **Select Initial MCMS Administrator** 页面上，输入当前登录用户的帐户详细信息，然后单击 **Next**。\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_73_0.png)\n\n16. 等待更改提交完成，并在 **MCMS\
    \ Site Stager Access Configuration** 页面上单击 **Next**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_73_1.png)\n\
    \n17. 在 DCA 对话框中，单击 Finish 以启动服务器配置应用程序，并验证您的设置。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_74_0.png)\n\
    \n18. 关闭 SCA。\n\n这完成了 MCMS 的配置。\n\n## 移除 Visual Studio.NET 2003\n\n如果您只打算使用 Visual\
    \ Studio 2005 进行开发，现在可以移除 Visual Studio.NET 2003（如果之前安装过），因为它不再需要。\n\n## MCMS\
    \ SP2 安装的已知问题\n\n与 MCMS SP2 安装相关的已知问题有几个，已发布了相应的热修复程序。\n\n- DCA 在使用 SQL 身份验证选择数据库时会抱怨缺少权限。已发布此问题的热修复程序，可向\
    \ Microsoft 支持请求，编号为 KB 913400。\n\n- **安装 MCMS 2002 Service Pack 2 后，VS.NET 2003\
    \ 的开发人员工具会消失。** 已发布此问题的热修复程序，可向 Microsoft 支持请求，编号为 KB 914195。\n- **VS.NET 2003\
    \ 的开发人员工具在某些区域设置下无法工作。** 已发布此问题的热修复程序，可向 Microsoft 支持请求，编号为 KB 914195。\n\n此外，如果您已全新安装\
    \ MCMS SP2 并希望将现有数据库迁移到新安装中，您需要获取 KB913401 热修复程序并按照本章开头关于升级到 MCMS 2002 Service\
    \ Pack 2 的讨论中 *Prepare the MCMS Database for SQL Server 2005* 部分中详细说明的步骤进行操作。\n\
    \n## 安装提示\n\n以下部分提供了在不同版本的 Windows 或跨不同机器安装时的两个提示。\n\n## 在 Windows Server 2003\
    \ X64 版上安装 MCMS SP2\n\nMCMS Service Pack 2 引入了对 Windows Server 2003 64 位版本的支持。但是\
    \ MCMS 要求 IIS 配置为以 32 位兼容模式运行。这意味着所有 IIS 应用程序（不仅仅是 MCMS 应用程序）都无法利用 X64 平台上的额外可寻址内存。为了在此平台上安装\
    \ MCMS SP2，需要执行以下额外步骤：\n\n- 必须通过执行 `aspnet_regiis` 实用工具手动将 ASP.NET 2.0 注册到 IIS。\n\
    - 必须使用以下命令配置 IIS 以在 32 位兼容模式下运行，该命令从 `c:\\Inetpub\\adminscripts` 文件夹执行：\n  `cscript\
    \ adsutil.vbs set w3svc/AppPools/Enable32bitAppOnWin64 1`\n\n## 安装所需的 SQL Server\
    \ 2005 组件\n\n当在与运行 MCMS SP2 的机器不同的机器上使用 SQL Server 时，MCMS 机器上需要 SQLDMO，即 SQL Server\
    \ 客户端工具作为先决条件。这可以从您的 SQL Server 2005 发行版中安装：\n\n- 在 **Components to Install**\
    \ 对话框中单击 **Advanced** 按钮。\n- 展开 **Client Components** 项。\n- 选择 **Legacy Components**\
    \ 项。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_76_0.png)\n\n## 摘要\n\n我们已完成升级到\
    \ SP2 或全新安装。此外，我们还介绍了避免 MCMS 安装常见问题的必要配置步骤，了解了如何避免安装 Visual Studio.NET 2003，以及一些额外的安装提示。现在我们准备探索\
    \ MCMS SP2 开发环境。\n\n## 2 开始使用开发环境\n\n在继续之前，我们将花一些时间熟悉适用于 Visual Studio 2005 的\
    \ MCMS Service Pack 2 开发环境，该环境与我们之前使用的 Visual Studio 版本略有不同。此外，我们将创建自定义 Visual\
    \ Studio 2005 模板，以克服随 MCMS SP2 提供的模板中存在的一系列问题。\n\n## Visual Web Developer 网站\n\
    \n使用 Visual Studio .NET 2003 和 Visual Studio 2005 开发 MCMS 应用程序之间的关键区别在于，ASP.NET\
    \ 应用程序（因此 MCMS 应用程序）现在使用 Visual Studio 2005 的 Visual Web Developer 组件构建。Visual\
    \ Web Developer 引入了一个新的“项目系统”，不再使用项目（`*.csproj`）文件，而是简单地通过 HTTP 或文件系统访问 Web 应用程序。\n\
    \n在 Visual Studio .NET 2003 中，MCMS 应用程序是通过选择 **MCMS Web Application** 项目类型创建的。此项目类型本质上是一个常规的\
    \ ASP.NET Web 应用程序项目，并带有 MCMS 所需的一些修改，例如额外的引用、Web 作者控制台以及对 `web.config` 的修改。在\
    \ Visual Studio 2005 中，开发 Web 应用程序已与开发其他项目类型分离。开发 Web 应用程序的功能已移至 Visual Web Developer\
    \ 组件。\n\n为了反映这一设计变更，您在 Visual Studio 2005 中不再使用 **New Project**，而是从 **File** 菜单中使用\
    \ **New Web Site** 来创建新网站。\n\n"
