    \        <td>\n            First Name:\n        </td>\n        <td>(TextBox for\
    \ the First Name)</td>\n    </tr>\n    <tr>\n        <td>\n            Last Name:\n\
    \        </td>\n        <td>(TextBox for the Last Name)</td>\n    </tr>\n    <tr>\n\
    \        <td>\n            Shipping Address:\n        </td>\n        <td>(TextBox\
    \ for the Shipping Address)</td>\n    </tr>\n    <tr>\n```"
