  - "[PAGE 191]\n\n# Supporting Custom Authentication Schemes\n\nSo far we’ve seen\
    \ how to make use of the new ASP.NET 2.0 login controls by creating an MCMS Membership\
    \ Provider for Windows accounts and using it with Forms Authentication. It is\
    \ also possible to use the same approach to provide a more elegant solution for\
    \ \"account mapping\" scenarios whereby authentication takes place against an\
    \ external user store.\n\nFor example, suppose we needed to use Active Directory\
    \ Application Mode (ADAM) for authentication, we could implement an ADAM Membership\
    \ Provider based upon our MCMSMembershipProviderBase class by overriding the ValidateUser()\
    \ method:\n\n```\nusing System.DirectoryServices;\n... Code Continues ...\npublic\
    \ override bool ValidateUser(string strName, string strPassword)\n{\n    // the\
    \ LDAP server to connect to\n    string strLdapServer = \"LDAP://localhost:389/\"\
    ;\n    // the DN of the OU containing the user\n    string strLdapObj = \"OU=MCMSUsers,O=TropicalGreen\"\
    ;\n    // the DirectoryEntry property to validate\n    string strDECheck = \"\
    MCMSUsers\";\n    // the DN of the user we are connecting as\n    string strBindName\
    \ = \"CN=\" + strName + \",\" + strLdapObj;\n    // the Windows Username format\
    \ for pasing to ValidateUser\n    string strWindowsUser = \"WinNT://webdev/\"\
    \ + strName;\n\n    try\n    {\n        // Connect to ADAM using LDAP AuthN...\n\
    \        DirectoryEntry ent = new DirectoryEntry(strLdapServer +\n           \
    \ strLdapObj, strBindName,\n            strPassword, AuthenticationTypes.None);\n\
    \n        // We must bind to perform authentication\n        if ((string)ent.Properties[\"\
    name\"].Value == strDECheck)\n        {\n            // LDAP AuthN succeeded,\
    \ so perform Windows\n            // AuthN to setup a MCMS context...\n      \
    \      return base.ValidateUser(strWindowsUser, strPassword);\n        }\n   \
    \     // LDAP AuthN failed, so return a false\n```"
  - "[PAGE 192]\n\n```\nreturn false;\n}\n\ncatch (Exception)\n{\n    //LDAP AuthN\
    \ failed, so return a false\n    return false;\n}\n}\n```\n\nActive Directory\
    \ Application Mode (ADAM) is a standalone LDAP 3 directory service. The above\
    \ sample assumes that ADAM is installed on the same machine as MCMS, is configured\
    \ to allow unsecured operation, MCMS users are stored within an Organizational\
    \ Unit named MCMSUsers, and that passwords are identical in both ADAM and Active\
    \ Directory or the Local Security Accounts (SAM) database.\n\nThe above sample\
    \ could be extended to create Windows and ADAM user accounts and provide additional\
    \ functionality, such as password reset, to end users. However, there remains\
    \ no supported mechanism to manage MCMS Role Group membership. An appropriate\
    \ compromise is to create a Windows group for each MCMS Role Group. The Windows\
    \ group is then added to the MCMS Role Group using Site Manager, and users can\
    \ be added to the Windows group programmatically.\n\n# Summary\n\nWe have covered\
    \ using the new ASP.NET 2.0 Login controls and Membership Provider Model by creating\
    \ an MCMS Membership Provider for Windows Accounts and using it with Forms Authentication.\
    \ We also learned which controls are useful to MCMS applications and how to integrate\
    \ them with our MCMS applications. We have also seen how to make use of these\
    \ ASP.NET 2.0 features to enhance \"account mapping\" scenarios by developing\
    \ a Membership Provider for an external authentication system."
  md: "\n6. Modify the authentication section to use Forms Authentication:\n\n```\n\
    <authentication mode=\"Forms\">\n  <forms loginUrl=\"Login.aspx\" />\n</authentication>\n\
    ```\n\n## Creating a Login Page Using the Login Control\n\nNow let’s go ahead\
    \ and implement a login page allowing users to sign in, which will utilize the\
    \ new ASP.NET 2.0 login controls.\n\n- 1. Right-click the **TropicalGreen** website,\
    \ and click **Add New Item**.\n- 2. Select the **Web Form** icon, enter **Login.aspx**\
    \ in the **Name** textbox and click **Add**. Ensure that the **Select Master Page**\
    \ checkbox is not selected.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_185_0.png)\n\
    \n> Adding a `Login` control to a master page will work. However if the master\
    \ page includes code that interacts with the PAPI (such as navigation controls\
    \ or posting properties), your MCMS installation will require Guest access to\
    \ be enabled. Such an implementation is only appropriate for mixed authoring and\
    \ read-only hosting scenarios that utilize Forms Authentication.\n\n- 3. Switch\
    \ to **Design** view.\n- 4. From the toolbox **Login** tab, drag a **Login** control\
    \ onto the design surface.\n\n## Authentication Controls and Membership Providers\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_186_0.png)\n\n- 5. If desired, use\
    \ the Login control’s Auto Format task to select a format scheme.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_186_1.png)\n\
    \n- 6. Click the Login control (Login1) and then the events icon (the lightning\
    \ bolt) in the Property window.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_187_0.png)\n\
    \n- 7. Double-click the LoggedIn event to add the Login1_LoggedIn event handler\
    \ and jump to it in Code view.\n- 8. Add the following using statement:\n\n```\n\
    using Microsoft.ContentManagement.Web.Security;\n```\n\n- 9. Implement the following\
    \ directly beneath the Page_Load method:\n\n```\nprotected void Login1_LoggedIn(object\
    \ sender, EventArgs e)\n{\n    Login myLogin = sender as Login;\n\n    if (HttpContext.Current.Items.Contains(\"\
    MCMSTicket\"))\n    {\n        CmsAuthenticationTicket Ticket =\n            HttpContext.Current.Items[\"\
    MCMSTicket\"]\n            as CmsAuthenticationTicket;\n        CmsFormsAuthentication.SetAuthCookie(Ticket,\n\
    \            false, Login1.RememberMeSet);\n    }\n}\n```\n\n- 10. From the Build\
    \ menu, choose Build Web Site.\n\nNow that we have completed our login page, we\
    \ can go ahead and test the functionality in Internet Explorer by browsing to\
    \ http://localhost/tropicalgreen.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_188_0.png)\n\
    \n- 11. Enter your user name and password and click **Log In**. Remember to enter\
    \ your user name in the format **MachineOrDomainName\\username**.\n- 12. If your\
    \ credentials are correct, you will be logged in and taken to the Tropical Green\
    \ home page. Otherwise a message will be displayed in the `Login` control.\n\n\
    ## Using the LoginStatus and LoginName Controls\n\nNow we have a login page we\
    \ can use the `LoginStatus` and `LoginName` controls to provide the additional\
    \ membership-related functionality in our templates. Let’s go ahead and add these\
    \ controls to our master page.\n\n- 1. Open `TropicalGreen.master` in **Design**\
    \ view.\n- 2. From the **Login** tab of the toolbox, drag a **LoginStatus** control\
