    Visual Studio 2005 ships with several website templates. The installation of the
    developer tools for MCMS extends the list of website templates with three additional
    templates: MCMS Empty Web Project, MCMS Web Application, and MCMS Web Service.
    These templates are actually modified versions of the similarly named standard
    templates shipped with Visual Studio 2005.


    ## Creating an MCMS Web Application


    Let''s create an MCMS web application using Visual Studio 2005.


    - 1. Open Visual Studio 2005.

    - 2. From the File menu, choose New, followed by Web Site...

    - 3. In the New Web Site dialog, select the MCMS Web Application within the My
    Templates section.


    > If the MCMS Web Application template does not appear in the My Templates section,
    the MCMS Visual Studio 2005 templates have not been correctly installed. Please
    refer to the Visual Studio Templates section of Chapter 1 for installation details.


    - 4. In the Location combo box, select HTTP, and in the textbox, enter `http://localhost/mcmstest`.


    > MCMS applications have to be created using a local installation of IIS and do
    not support being created using the file system, which makes use of the built-in
    Visual Web Developer Web Server.

    >

    > Note that the New Web Site wizard will not prevent you from configuring an invalid
    website using the File System and Visual Web Developer Web Server.


    - 5. In the **Language** combo box (shown in the following figure), select **Visual
    C#**, and click **OK**.


    ![](img/18a0aa8d36427a4c069b30410f998b8e_79_0.png)


    > If you wish, you can also choose VB.NET. The samples in this book are all written
    in Visual C#.


    - 6. Visual Studio 2005 will create your project and initialize the MCMS Template
    Explorer. When it''s done, you will be presented with an MCMS website with the
    basic foundation files.


    ![](img/18a0aa8d36427a4c069b30410f998b8e_80_0.png)


    > The MCMS Template Explorer within Visual Studio 2005 logs on to the MCMS repository
    using the credentials of the currently logged-on user. If this operation fails,
    check your MCMS Rights Groups configuration. The Template Explorer does not allow
    you to specify alternative credentials.


    - 7. Click the **MCMS Template Explorer** tab at the bottom of the **Solution
    Explorer**, and note that the **Template Gallery** is accessible.


    ![](img/18a0aa8d36427a4c069b30410f998b8e_80_1.png)


    ![](img/18a0aa8d36427a4c069b30410f998b8e_81_0.png)


    > If you don''t see the Template Explorer, it is likely you didn''t select **HTTP**
    in the **Location** combo box in step 4. You may also not see the Template Explorer
    if you are using a locale other than US English, in which case you need to install
    hotfix 914195 as detailed in Chapter 1.


    - 8. Click the **Solution Explorer** tab at the bottom of the **MCMS Template
    Explorer**, and click the **Refresh** button. Notice that unlike the web applications
    from ASP.NET 1.x days, the ''CMS'' virtual directory is now part of the website.

    - 9. If you examine the contents of the website, its references, and `web.config`
    file, you will see that the necessary MCMS files and configuration changes have
    been added.


    ## Checking the Website Configuration Settings in IIS


    We can verify that Visual Studio 2005 has configured the MCMS application correctly
    by using the Internet Information Services snap-in. First, let''s ensure that
    the `mcmstest` website is indeed running on ASP.NET 2.0.


    - 1. From the **Start Menu** click **Run**, enter `inetmgr` in the **Run** textbox,
    and click **OK**.

    - 2. In **Internet Information Services**, expand the tree view to display the
    `mcmstest` application.

    - 3. Right-click the `mcmstest` application and click **Properties**.

    - 4. Click the **ASP.NET** tab and note that the ASP.NET version is correctly
    configured as **2.0.50727**.


    ![](img/18a0aa8d36427a4c069b30410f998b8e_81_1.png)


    > When developing on Windows Server 2003, the Virtual Website root must run in
    the same worker process (i.e. Application Pool) as all MCMS applications so that
    the MCMS ISAPI Filter can work as expected. This filter cannot route requests
    across worker-process boundaries. In effect this means that all MCMS applications
    will share the same ASP.NET version, as ASP.NET does not support side-by-side
    execution of different versions inside the same worker process. This is not necessary
    with IIS on Windows XP as it does not use Worker Process Isolation mode.


    Next, we will check the authentication settings. For now, we will configure the
    website to use integrated Windows authentication. Only users with a domain or
    local user account will have access to the site. Later in Chapter 6 we will show
    alternative authentication methods such as Forms Authentication.


    - 1. Click the **Directory Security** tab followed by the **Edit...** button,
    and note that the permissions are correctly inherited from the Virtual Web Site
    settings. In this example, we will use integrated Windows authentication.


    ![](img/18a0aa8d36427a4c069b30410f998b8e_82_0.png)


    > Note that we configured the Virtual Web Site to use Windows authentication in
    Chapter 1. Authentication methods can be configured on a per-application basis.


    - 2. Click **Cancel** and close **Internet Information Services**.


    ## Developing MCMS Web Applications


    We are now ready to get started on developing our ASP.NET 2.0-based MCMS applications.
    There are a number of quirks with the MCMS web application templates, which we
