  - "[PAGE 211]\n\n8. After the Ad Rotator control loads but before the page loads,\
    \ the control’s AdCreated() event is called. Here, we will first get an instance\
    \ of the resource gallery and the collection of resources that make up our advertisements.\
    \ We will retrieve only images—other file formats like Office documents will be\
    \ ignored. Following this, we will call the Randomiser() method to select the\
    \ advertisement to display. Once an advertisement has been selected, we set the\
    \ control’s properties to show the resource, link it to the URL specified in the\
    \ resource’s description, and set the image’s tooltip (or alternate text) to the\
    \ resource’s display name. Append the OnAdCreated() event handler to the code.\n\
    \n```\nprotected override void OnAdCreated(AdCreatedEventArgs e)\n{\n    // Get\
    \ an instance of the resource gallery that contains the Ads\n    CmsHttpContext\
    \ cmsContext = CmsHttpContext.Current;\n    ResourceGallery rg =\n        (ResourceGallery)cmsContext.Searches.GetByPath(adsGalleryPath);\n\
    \n    if (rg != null)\n    {\n        // Get only files that are images\n    \
    \    ResourceCollection ads = rg.Resources;\n        ads.FilterByMimeType(\"image\"\
    , true);\n\n        // Randomly pick one of the Ads\n        int resourceIndex\
    \ = Randomiser(ads.Count);\n        Resource r = ads[resourceIndex];\n\n     \
    \   // Display the image\n        e.ImageUrl = r.Url;\n        e.NavigateUrl =\
    \ r.Description;\n        e.AlternateText = r.DisplayName;\n    }\n}\n```\n\n\
