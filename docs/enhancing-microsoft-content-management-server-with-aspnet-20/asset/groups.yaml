  - '[PAGE 149]


    Once the control has been added to the toolbox, drag and drop it anywhere onto
    the editable areas of the Plant.aspx template file. Set the properties of the
    MCMSTreeview as we did for the TreeView control earlier. When rendered on a page,
    the nodes expand and collapse as you would expect them to, and the leave warning
    message does not appear even in edit mode.


    When you are done, delete all TreeView controls from the plant template file.


    # Getting the Populate-On-Demand Feature of the TreeView Control to Work in Channel-Rendering
    Scripts


    As we have seen, the populate-on-demand feature works when embedded within a template
    file. However, if you attempted to add it to a channel-rendering script, you may
    have found that the TreeView control appears to freeze when you expand any node.
    As an example, let’s modify the TreeView control of the SiteMap.aspx page created
    earlier:


    +   1. Open SiteMap.aspx file in Source view.

    +   2. Modify the properties of the TreeView control as shown here:

    +   3. Save the page.


    ```

    <asp:TreeView ID="TreeView1" runat="server" DataSourceID=

    "SiteMapDataSourceTree"

    ShowLines="True" PopulateNodesFromClient="True" ExpandDepth="1">

    <DataBindings>

    <asp:TreeNodeBinding PopulateOnDemand="true"

    TextField="Title"

    NavigateUrlField="Url"

    ToolTipField="Description"/>

    </DataBindings>

    </asp:TreeView>

    ```


    When you are done, navigate to the Site Map page. Attempt to expand any of the
    nodes. Notice that nothing happens!


    To understand why this happens, let’s take a close look at the way the populate-on-demand
    feature works. When a node is expanded, a postback is performed silently by the
    browser. The postback requires the information stored in the action attribute
    of the <form> tag. If you looked at the generated HTML of the page, you would
    find that the value stored in the action attribute of the form resembles the following:


    ```

    <form name="aspnetForm" method="post" action="sitemap.aspx?...code continues...">

    ```'
  - "[PAGE 150]\n\nWhat’s interesting about the value stored in the action attribute\
    \ is that it’s a relative URL. In regular web applications, using a relative URL\
    \ works well. However, for MCMS pages, the URL has to be absolute. That’s because\
    \ the URL used to access the page (e.g. http://tropicalgreen/sitemap/) does not\
    \ lead to a physical folder— it’s purely virtual and points to a channel in the\
    \ repository. So when it tries to access the relative URL such as sitemap.aspx,\
    \ it looks for it at http://tropicalgreen/sitemap/sitemap.aspx. Because the file\
    \ does not physically exist at that location, the code fails.\n\nTo correct this\
    \ problem, we need to use absolute links instead. To generate an absolute link\
    \ in the action attribute of the form, we can choose to:\n\n+   1. Generate a\
    \ <base> tag and store the absolute path to the page there. With a <base> tag,\
    \ all relative links are converted to absolute links by prepending the value stored\
    \ in the tag to the link. Usually, the <base> tag gets generated by the RobotMetaTag\
    \ control. However, a bug in the control prevents it from generating the <base>\
    \ tag in a channel-rendering script. An enhanced version of the RobotMetaTag that\
    \ works on both channel-rendering scripts and template files can be found here:\
    \ http://www.gotdotnet.com/Community/UserSamples/Details.aspx?SampleGuid=8600bae5-7aba-481b-93bb-d179927179d5.\n\
    +   \n+   2. Modify the action attribute of the <form> tag using client-side JavaScripts.\
    \ While generating the <base> tag is a possible solution, you may not want to\
    \ enable it (we discuss some possible reasons why <base> tags can’t be used, in\
    \ Chapter 5). For this method to work, we need to modify the way the tree view\
    \ is rendered, and to do so, we will have to create a custom TreeView control.\
    \ Since we have already created a custom TreeView control earlier, let’s explore\
    \ how we can enhance it to work in a channel-rendering script.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_150_0.png)\n\
    \n> The populate-on-demand feature of the TreeView control worked for the plant\
    \ template file because we have set the RenderBaseHref property of the RobotMetaTag\
    \ control to true. If it had been set to false, the <base> tag would not be generated,\
    \ and the tree view would not have been able to populate child nodes on demand.\n\
    \nWe need to convert the relative link stored in the action attribute of the form\
    \ to an absolute link. To do so, we will leverage some of the existing functionality\
    \ found in the generated page."
  - "[PAGE 151]\n\nIf you examined the HTML source of any MCMS page, you would find\
    \ a JavaScript variable named __CMS_PostbackForm, which stores an instance of\
    \ the form object.\n\n```\nvar __CMS_PostbackForm = document.forms['aspnetForm'];\n\
    ```\n\nIn addition, there is a variable named __CMS_CurrentUrl that stores the\
    \ absolute URL of the page. Here’s how the __CMS_CurrentUrl of the Site Map page\
    \ may look on your page. Note that the GUID values on your site may be different.\n\
    \n```\nvar __CMS_CurrentUrl = \"/tropicalgreen/templates/sitemap.aspx?\nNRMODE=Published&\n\
    NRNODEGUID=%7b6bE3510D2-519A-4D4F-92A8-621B43F5894F%7d&\nNRORIGINALURL=%2ftropicalgreen%2fSiteMap%2f&\n\
    NR CACHEHINT=ModifyLoggedIn\";\n```\n\nPutting the pieces together, in order to\
    \ assign the value stored in __CMS_CurrentUrl to the value of the action attribute\
    \ of the form, __CMS_PostbackForm, we need to somehow execute the following script\
    \ on the client:\n\n```\n<script type=\"text/javascript\">\n    if (typeof (__CMS_CurrentUrl)\
    \ != \"undefined\")\n    {\n        __CMS_PostbackForm.action = __CMS_CurrentUrl;\n\
    \    }\n</script>\n```\n\nA good place to register the script is in the Render()\
    \ method of the TreeView control. Open the MCMS TreeView.cs file and add the highlighted\
    \ code to the Render() method.\n\n```\nprotected override void Render(System.Web.UI.HtmlTextWriter\
    \ output)\n{\n    ... code continues ...\n    // Register a client script that\
    \ ensures that the action property\n    // is correct when AJAX tries to do its\
    \ postback.\n    string script = \"\\n<script type=\\\"text/javascript\\\">\\\
    n\" +\n        \" if (typeof (__CMS_CurrentUrl) != \" +\n        \" \\\"undefined\\\
    \")\\n\" +\n        \" {\\n\" +\n        \"   __CMS_PostbackForm.action = \" +\n\
    \        \" __CMS_CurrentUrl;\\n\" +\n        \" }\\n\" +\n        \"</script>\\\
    n\";\n```"
  - "[PAGE 152]\n\n```\nPage.ClientScript.RegisterStartupScript(this.GetType(),\n\
    \    \"AdjustActionForTreeView\", script);\n}\n```\n\nNow, replace the TreeView\
    \ control on SiteMap.aspx with the custom MCMS TreeView control. After setting\
    \ it up to populate nodes on demand, the tree no longer freezes, and you should\
    \ be able to expand and contract nodes to reveal sub-nodes.\n\n# Using the TreeView\
    \ Control in Summary Pages\n\nSummary pages (also known as default, cover, or\
    \ index pages) provide a listing of pages within a given section. They are particularly\
    \ useful when visitors know only of the existence of a page but not it’s exact\
    \ location. For example, you may know that there’s a page that describes the Aloe\
    \ Vera in the plant catalog, but you may not know its address. If the plant catalog\
    \ page provides a listing of all the plant pages on the site, you could easily\
    \ find the page that you are looking for.\n\nEarly versions of summary pages were\
    \ often hand-coded pieces of work that had to be updated frequently when new pages\
    \ were added, deleted, or renamed. Over the years, this practice has slowly been\
    \ phased out when active-scripting enabled developers to dynamically assemble\
    \ the summary page on the fly. This meant that the page showed the latest version\
    \ of the list, providing for efficient and effective link management.\n\nIn MCMS\
    \ sites built on ASP.NET 1.x, summary pages were typically built by iterating\
    \ through the collection of channels and postings. The collection of channel items\
    \ was then displayed in a table-like control such as the DataGrid. While this\
    \ technique still works today, ASP.NET 2.0 introduces a faster and easier approach\
    \ to building summary pages.\n\nLet’s take a look at an alternative solution that\
    \ involves building a custom site-map provider and the TreeView control. Here’s\
    \ the game plan:\n\n+   1. We start off by creating a custom site-map provider\
    \ that sets the currently viewed channel as the root node. All postings within\
    \ the channel are then added as site-map nodes.\n+   2. Next, we will use the\
    \ TreeView control to provide a listing of all pages within the channel. While\
    \ the TreeView control is designed to show a hierarchical listing of items, its\
    \ versatility allows it to display a simple single-level list just as well."
