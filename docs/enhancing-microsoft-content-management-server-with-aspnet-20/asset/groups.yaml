    using System.Web.UI.WebControls.WebParts;\nusing System.Web.UI.HtmlControls;\n\
    using Microsoft.ContentManagement.Publishing;\n\nnamespace TropicalGreen\n{\n\
    \    public class MCMSSiteMapProviderRight\n    {\n        . . . code continues\
    \ . . .\n    }\n}\n```\n\n- 3. As before, we won’t be building the SiteMapProvider\
    \ from scratch. Instead, we will inherit from the MCMSSiteMapProvider class that\
    \ we created earlier.\n\n```csharp\npublic class MCMSSiteMapProviderRight : MCMSSiteMapProvider\n\
    {\n    . . . code continues . . .\n}\n```\n\n- 4. We will override the GetChildNodes()\
    \ method of the base class and modify it to include only items that belong to\
    \ the right menu. To do so, we read the value of the custom property MenuLocation.\
    \ If it contains the value Right, the item is inserted into the site map. In addition,\
    \ we will also add sub-menu items to the site map. Append the GetChildNodes()\
    \ method to the code.\n\n```csharp\npublic override SiteMapNodeCollection GetChildNodes(SiteMapNode\
    \ node)\n{\n    SiteMapNodeCollection smnc = new SiteMapNodeCollection();\n\n\
    \    Channel currentChannel =\n        CmsHttpContext.Current.Searches.GetByGuid(node.Key)\
    \ as Channel;\n\n    if (currentChannel != null)\n    {\n        ChannelCollection\
    \ cc = currentChannel.Channels;\n        cc.SortByDisplayName();\n\n        foreach\
    \ (Channel c in cc)\n        {\n            if (c.CustomProperties[\"MenuLocation\"\
    ] != null)\n            {\n                // Add top-level menu items\n     \
    \           if (c.CustomProperties[\"MenuLocation\"].Value == \"Right\")\n   \
    \             {\n                    smnc.Add(GetSiteMapNodeFromChannelItem(c));\n\
    \                }\n            }\n            else if(c.Parent.Path!=base.RootChannel)\n\
    \            {\n                // Add sub menu items\n                smnc.Add(GetSiteMapNodeFromChannelItem(c));\n\
    \            }\n        }\n    }\n    return smnc;\n}\n```\n\n- 5. The class is\
    \ complete. Save the file.\n- 6. Before the `MCMSSiteMapProviderRight` class can\
    \ be used, we need to register it in the web.config file.\n\n```xml\n<siteMap\
    \ defaultProvider =\"MCMSSiteMapProvider\" enabled =\"true\">\n    <providers>\n\
    \        <add name=\"MCMSSiteMapProvider\"\n            type=\"TropicalGreen.MCMSSiteMapProvider\"\
