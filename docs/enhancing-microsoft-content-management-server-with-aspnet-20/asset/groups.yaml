    # 5


    # Applying Themes


    Most websites are designed with a common look and feel in mind. After all, if
    you went to a site that had pages that are distinctively different from one another,
    you might start to wonder (probably after the second page) if you were still surfing
    the same website.


    In this chapter, we will see how a common look and feel can be applied efficiently
    to an MCMS site by using themes. We will create skins and cascading style sheets
    and demonstrate how they work together to define the appearance of a site. Finally,
    we will discuss an essential customization required for themes to work correctly
    in an MCMS site.


    # Themes versus Cascading Style Sheets


    The challenge of maintaining a consistent look and feel across a website is not
    a new one. Not too long ago, developers used cascading style sheets (CSS) to define
    how the site should look. The use of CSS was a step towards separating design
    elements from HTML. Graphic designers could work independently on the CSS file,
    providing information such as color schemes, font types, spacing, margins, and
    other visual effects. Should the need arise to change any of these attributes,
    all that the designer needed to do was to amend the CSS file, and voilà, the look
    and feel of the site would be instantly refreshed!


    Nevertheless, despite the advantages of using CSS, modifications to a site’s design
    still required a fair bit of work. Just think about the last time a complex control
    such as a new calendar control was introduced to a site that you worked on. In
    order to give a desired look and feel to the control, several styles had to be
    applied: One for the title, another for the selected date, and a couple more for
    the navigation arrows. Also, the same task had to be repeated for each calendar
    control on the site. You could wrap the "styled" calendar in a custom control
    and reuse it across the site, but that would mean writing code with design elements
    in mind, which makes for a'
  - '[PAGE 160]


    complicated work arrangement between developers and designers. In addition, CSS
    was limited to defining the appearance of controls. For example, you couldn’t
    use it to define the columns that make up a grid or the nodes of a tree.


    Another limitation of CSS was the varying levels of support the different browsers
    had for style sheets. The situation gets more complex when older browsers or alternative
    web devices such as personal digital assistants and mobile phones are added to
    the picture. For a website to appear consistent across all browser types and versions,
    complicated workarounds had to be implemented.


    ASP.NET 2.0 takes the idea behind CSS a step further by introducing the concept
    of themes. A theme acts as a central location for storing information about the
    site’s design. You could store CSS files in a theme. ASP.NET automatically generates
    links to all CSS files for all pages that reference the theme.


    Besides managing CSS files, themes also store entire sets of images and other
    design files required by the site. In addition, you could define multiple themes
    within a single site. If you switched the site’s theme, the site will automatically
    pick up the images and other supporting files used by the selected theme. In this
    way, you could customize the look and feel of a site for various devices or browsers.


    Themes may also contain skins. Think of skins as an outer covering of server controls—somewhat
    like a pillow case. When you slip a new casing over a pillow, you change its design
    but underneath, the pillow remains essentially the same. In the same way, skins
    can be applied to ASP.NET server controls. Skins address the design requirements
    of complex server controls by combining the style definitions of entire controls
    into a single file as opposed to having multiple style sheets. With skins, you
    could apply styles and set the properties of complex controls such as Calendars
    and DataGrids with minimal effort. You could even define elements such as the
    columns that make up the grid or the nodes of a tree within a skin—a task that
    was not possible with CSS.


    Another nice aspect of themes is that they reside in the web application’s directory.
    You could have multiple web applications, each with its own unique themes. In
    this way, you could go ahead and apply a theme to postings and not worry about
    affecting the look and feel of say, pages in other web applications like the MCMS
    dialogs.


    # Creating a Theme


    Let’s start by creating a theme for the TropicalGreen site. We will name the theme
    Sunny and use it to apply a new design on our website. In ASP.NET 2.0, themes
    used by a single project are stored directly below the project’s application folder
    in a special folder named App_Themes. You can create as many themes (or sub folders)
    as your site requires.'
  - "[PAGE 161]\n\n+   1. First, let's create the `App_Themes` folder. In **Solution\
    \ Explorer**, right-click the **TropicalGreen** project and select **Add ASP.NET\
    \ folder | Theme**. A new folder named `App_Themes` appears.\n+   2. Within the\
    \ `App_Themes` folder is a subfolder named `Theme1`. Rename the folder to `Sunny`.\n\
    \n![](img/18a0aa8d36427a4c069b30410f998b8e_161_0.png)\n\n# Applying a Theme to\
    \ the Entire Site\n\nWe have created a theme named Sunny. Now let's apply it to\
    \ the TropicalGreen site.\n\nIn the web.config file, look for the `<pages>` tag\
    \ and add an attribute named theme and set its value to Sunny.\n\n```\n<pages\
    \ validateRequest=\"false\"\n    theme=\"Sunny\"/>\n```\n\nWe have applied the\
    \ Sunny theme to the TropicalGreen site. However, the theme doesn't define any\
    \ styles or designs yet. In the next section, we will add skins and style sheets\
    \ to define the look and feel of the site.\n\n> Instead of applying the theme\
    \ to the entire site, we could have defined it at the page level by setting the\
    \ theme attribute of the @Page directive. If we needed more flexibility (for example,\
    \ when changing the theme based on a user's profile), we could apply the theme\
    \ using code.\n\n# Skins for Server Controls\n\nAs the name suggests, skins serve\
    \ as outer covers of controls. Most out-of-the-box ASP.NET server controls support\
    \ skins. Nevertheless, it's always a good idea to check if the control you plan\
    \ to work with can be skinned. To do so, look for the SkinID property. If the\
    \ control has a SkinID property, you can apply a skin to it.\n\nThere are two\
    \ types of skins:\n\n+   - **Default skins**, which are applied to all controls\
    \ that do not have a corresponding skin defined in the `SkinID`. For example,\
    \ if you define a default skin for a `TextBox` control, all `TextBox` controls\
    \ on pages that adopt the theme will follow the styles defined in the default\
    \ skin."
  - "[PAGE 162]\n\n+   - **Name-controlled skins**, which target only controls that\
    \ share the same `SkinID`. For instance, you may have a skin for a `TextBox` defined.\
    \ Suppose the skin has the `SkinID` of `MyTextBox`. Only `TextBox` controls that\
    \ have a matching `SkinID` of `MyTextBox` will have the skin applied.\n\n# Creating\
    \ a Default Skin\n\nConsider the case of the `SiteMapPath` control created earlier\
    \ in our `TropicalGreen.master` template. We would like the control to use a colon\
    \ character (:) as the node separator. The font type should be Verdana. All nodes\
    \ will be in bold font and green color, with the exception of the current node,\
    \ which will be colored orange. If we set these properties using code, here’s\
    \ how it would look:\n\n```\n<asp:SiteMapPath ID=\"SiteMapPath1\" runat=\"server\"\
    \ Font-Names=\"Verdana\" PathSeparator=\":\">\n    <PathSeparatorStyle Font-Bold=\"\
    True\" ForeColor=\"green\"/>\n    <CurrentNodeStyle ForeColor=\"orange\"/>\n \
    \   <NodeStyle Font-Bold=\"True\" ForeColor=\"green\"/>\n    <RootNodeStyle Font-Bold=\"\
    True\" ForeColor=\"green\"/>\n</asp:SiteMapPath>\n```\n\nWhile setting the controls\
    \ of a property is easily done through code, we can do the same thing using a\
    \ skin. Before doing so, remove all style properties from the `SiteMapPath` control\
    \ such that the code becomes:\n\n```\n<asp:SiteMapPath ID=\"SiteMapPath1\" runat=\"\
    server\">\n</asp:SiteMapPath>\n```\n\nNow let’s build a skin for the `SiteMapPath`\
    \ control.\n\n+   1. In **Solution Explorer**, right-click the **Sunny** folder\
    \ and select **Add New Item...**\n+   2. In the **Add New Item** dialog, choose\
    \ to create a new **Skin File** and give it the name **Sunny.skin**."
