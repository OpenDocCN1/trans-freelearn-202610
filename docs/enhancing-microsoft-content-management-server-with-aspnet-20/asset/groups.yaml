    The menu appears strange on the first load. All menu items, including sub-menu
    items that should be hidden are shown. The sub menu items only disappear after
    the mouse cursor goes over them. What should I do?


    The menus require XHTML to display correctly. A `<xhtmlConformance>` tag was added
    to the `web.config` file when the MCMS web application was created using the wizard.
    The `<xhtmlConformance>` tag contains an attribute named `mode`, which specifies
    the XHTML rendering mode for the application. The default `mode` attribute value
    for MCMS websites is `Legacy`, which means some code will be reverted to conform
    to the XHTML v1.1 rendering behavior. Change the `mode` attribute value to either
