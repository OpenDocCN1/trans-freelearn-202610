  - "[PAGE 168]\n\n# Why Themes with Style Sheets May Not Work on MCMS Sites\n\nLook\
    \ at the HTML source of the posting (right-click anywhere on the page and select\
    \ View Source) and take a closer look at the <link> tag generated by the theme.\
    \ It should resemble the one that follows:\n\n```\n<link href=\"../App_Themes/Sunny/Sunny.css\"\
    \n    type=\"text/css\" rel=\"stylesheet\"/>\n```\n\nThe URL stored in the <link>\
    \ tag is a path that is relative to that of the template file. In this example,\
    \ the preceding dot-dot-slash (../) characters indicate that the App_Themes folder\
    \ is stored in the same parent folder as the current page. In a regular web application,\
    \ referring to the style sheet using its relative path works correctly. After\
    \ all, if you looked at the file structure, you can indeed find the style sheet\
    \ at the suggested path.\n\nHowever, when viewing a posting, we aren’t accessing\
    \ the template file directly. For example, to view the Aloe Vera posting, we request\
    \ the URL http://tropicalgreen/PlantCatalog/AloeVera.htm. The browser, not knowing\
    \ that the MCMS ISAPI filter has rewritten the URL, attempts to retrieve the file\
    \ by converting the relative path to the absolute path http://tropicalgreen/PlantCatalog/../App_Themes/Sunny/Sunny.css.\n\
    \nThis path will, however, not evaluate to the real location of the CSS file,\
    \ as the folder that’s one-level above the AloeVera.htm page is tropicalgreen.\
    \ Also, because the App_Themes folder is stored in the Templates project directory\
    \ (see the following screenshot), looking for it under tropicalgreen (or the root\
    \ website) will result in an HTTP 404 error.\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_168_0.png)"
  - '[PAGE 169]


    ![](img/18a0aa8d36427a4c069b30410f998b8e_169_0.png)


    If using relative paths results in HTTP 404 errors when accessing the style sheet,
    how then, did the style get successfully applied to the posting? The secret lies
    in the RobotMetaTag. In MCMS websites, the RobotMetaTag has a RenderBaseHref property,
    which when set to true (its default value), will generate a <base> tag between
    the <head> tags of the page. Search the generated HTML source of the posting,
    and you will find the <base> tag that looks like the following:


    ```

    <base href="http://tropicalgreen/tropicalgreen/Templates/Plant.aspx">

    ```


    When evaluating links on a page, the web browser automatically prefixes all relative
    links with the value stored in the href attribute of the <base> tag (instead of
    the requesting URL for the page) such that a relative path like ../App_Themes/Sunny/Sunny.css
    becomes http://tropicalgreen/tropicalgreen/Templates/../App_Themes/Sunny/Sunny.css.


    The converted URL does lead to the style sheet, so we don’t get any HTTP 404 errors.


    By default, the RenderBaseHref property of the RobotMetaTag control stores the
    Boolean true. So usually, the <base> tag is generated and you won’t have to worry
    about paths to style sheets and other relative links being inaccessible. However,
    depending on the site setup, there may be special situations where generating
    a <base> is not desirable.


    Consider the case of a hosting scenario where a firewall or proxy forwards the
    request to an internal web server. The trouble with the MCMS-generated <base>
    tag is that it contains the full URL, which may include the server’s name, especially
    when the "map channels to host headers" option has been turned off. When the internal
    server returns the page back to the proxy, the <base> tag of the returned page
    will contain the name of the internal server instead of the site’s domain name
    as entered in the browser.'
  - '[PAGE 170]


    To simulate this scenario, try viewing the postings again, but this time by using
    a URL like http://servername/tropicalgreen/plantcatalog/aloe vera.htm. Notice
    that when you do so, the server’s name is stored in the <base> tag as such:


    ```

    <base href="http://servername/tropicalgreen/tropicalgreen/Templates/Plant.aspx
    ">

    ```


    > Of course, the usual URL omits the server’s name and will just be http://tropicalgreen/plantcatalog/aloe
    vera.htm. But since we are testing to see how the server name creeps into the
    base URL, we have added it in for this exercise.


    Unless the user’s browser has access to the internal server, it will likely receive
    HTTP 404 errors when attempting to access resources like style sheets. In such
    cases, the RenderBaseHref property has to be disabled and an alternative solution
    found.


    # Applying Themes when the RenderBaseHref Property is Disabled


    In case the <base> tag can’t be used, we need to have a different way to ensure
    that the App_Themes folder is accessed with the correct URL. As ASP.NET has no
    way to configure the way it generates the URL to the theme’s folder, we need to
    modify this URL after ASP.NET has generated it.


    There are many ways to address the problem. We could manually add code to each
    and every template file that has the theme applied. However, not only would that
    be tedious, but repeating code in multiple places is also not good programming
    practice. We could create a server-side control to encapsulate the code and insert
    it into each template file that requires it. Again, this requires code for the
    control to be copied into every template file — there’s still the possibility
    that it may get forgotten, especially when new templates are created.


    The solution is to build an HTTP module. In this way, we can guarantee that all
    pages will have the correction without having to touch any of the existing template
    files. Before the page is sent to the browser, the HTTP module will convert all
    relative paths stored in <link> tags to absolute paths that do not contain the
    name of the server. The module will look for <link> tags such as the one for the
    style sheet:


    ```

    <link href="../App_Themes/Sunny/Sunny.css" type="text/css" rel="stylesheet"/>

    ```'
