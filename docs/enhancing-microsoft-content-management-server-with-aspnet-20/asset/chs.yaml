  - 3. 出现 **菜单任务** 对话框。将 **选择数据源** 字段设置为 **SiteMapDataSourceRight**，将 **视图** 字段设置为\
  \ **静态**。尽管右侧菜单是动态菜单，但我们仍要求第一级为静态，因此选择了静态视图。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_138_0.png)\n\
  \n- 4. Delete the text marker **Space for Right Menu**.\n- 4. 删除文本标记 **右侧菜单位置**。\n\
