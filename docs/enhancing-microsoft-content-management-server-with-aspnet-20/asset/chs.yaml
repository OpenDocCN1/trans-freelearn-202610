  \n5. 类已完成。保存文件。\n\n6. 与之前一样，在使用之前，我们需要在 web.config 文件中注册 MCMSSiteMapProviderTop。将突出显示的代码添加到\
  \ web.config 文件中。\n\n```\n<siteMap defaultProvider =\"MCMSSiteMapProvider\" enabled\
  \ =\"true\">\n  <providers>\n    <add name=\"MCMSSiteMapProvider\"\n      type=\"\
  TropicalGreen.MCMSSiteMapProvider\"/>\n    <add name=\"MCMSSiteMapProviderTop\"\n\
  \      type=\"TropicalGreen.MCMSSiteMapProviderTop\"/>\n  </providers>\n</siteMap>\n\
  ```\n\n7. 要查看其实际效果，请将 SiteMapDataSourceTop 的 SiteMapProvider 属性设置为 MCMSSiteMapProviderTop。\n\
  \n![](img/18a0aa8d36427a4c069b30410f998b8e_134_0.png)\n\n\n\n现在导航到任意一个植物页面。菜单仅显示我们指定为顶部的三个频道项。\n\
  \n![](img/18a0aa8d36427a4c069b30410f998b8e_135_0.png)\n\n## Building a Dynamic Multi-Level\
  \ Vertical Menu\n\n构建动态多级垂直菜单\n\n我们已使用菜单控件构建了单级静态水平菜单。现在，让我们提高难度，使用相同的控件创建多级菜单。为了更有趣，我们还将菜单旋转九十度并创建垂直显示。\n\
  \n所有不属于顶部菜单的顶级频道项都将在垂直菜单中显示。当鼠标光标悬停在父菜单项上（例如 Gardens），会出现一个弹出窗口，显示子菜单项列表。完成后菜单将如下所示：\n\
  \n![](img/18a0aa8d36427a4c069b30410f998b8e_135_1.png)\n\n## The MCMSSiteMapProviderRight\
  \ Class\n\nMCMSSiteMapProviderRight 类\n\n到目前为止，我们已创建了两个 SiteMapProvider 类——第一个列出所有频道项，第二个仅包含顶部菜单项。\n\
  \n现在，让我们创建一个第三个 SiteMapProvider 类，仅列出垂直右侧菜单的项。\n\n- 1. Add a class file named `MCMSSiteMapProviderRight.cs`\
  \ to the `App_Code` folder.\n- 1. 在 `App_Code` 文件夹中添加一个名为 `MCMSSiteMapProviderRight.cs`\
  \ 的类文件。\n- 2. The class requires the use of the namespace highlighted in the following\
  \ code snippet. Add also the namespace declaration.\n- 2. 该类需要使用以下代码片段中突出显示的命名空间。还添加命名空间声明。\n\
  \n```csharp\nusing System;\nusing System.Data;\nusing System.Configuration;\nusing\
  \ System.Web;\nusing System.Web.Security;\nusing System.Web.UI;\nusing System.Web.UI.WebControls;\n\
  using System.Web.UI.WebControls.WebParts;\nusing System.Web.UI.HtmlControls;\nusing\
  \ Microsoft.ContentManagement.Publishing;\n\nnamespace TropicalGreen\n{\n    public\
  \ class MCMSSiteMapProviderRight\n    {\n        . . . code continues . . .\n  \
  \  }\n}\n```\n\n- 3. As before, we won’t be building the SiteMapProvider from scratch.\
  \ Instead, we will inherit from the MCMSSiteMapProvider class that we created earlier.\n\
  - 3. 与之前一样，我们不会从头构建 SiteMapProvider。相反，我们将继承之前创建的 MCMSSiteMapProvider 类。\n\n```csharp\n\
  public class MCMSSiteMapProviderRight : MCMSSiteMapProvider\n{\n    . . . code continues\
  \ . . .\n}\n```\n\n- 4. We will override the GetChildNodes() method of the base\
  \ class and modify it to include only items that belong to the right menu. To do\
  \ so, we read the value of the custom property MenuLocation. If it contains the\
  \ value Right, the item is inserted into the site map. In addition, we will also\
  \ add sub-menu items to the site map. Append the GetChildNodes() method to the code.\n\
  - 4. 我们将重写基类的 GetChildNodes() 方法，并修改它以仅包含属于右侧菜单的项。为此，我们读取自定义属性 MenuLocation 的值。如果它包含值\
  \ Right，则该项将被插入到站点地图中。此外，我们还将子菜单项添加到站点地图中。将 GetChildNodes() 方法附加到代码中。\n\n```csharp\n\
  public override SiteMapNodeCollection GetChildNodes(SiteMapNode node)\n{\n    SiteMapNodeCollection\
  \ smnc = new SiteMapNodeCollection();\n\n    Channel currentChannel =\n        CmsHttpContext.Current.Searches.GetByGuid(node.Key)\
  \ as Channel;\n\n    if (currentChannel != null)\n    {\n        ChannelCollection\
  \ cc = currentChannel.Channels;\n        cc.SortByDisplayName();\n\n        foreach\
  \ (Channel c in cc)\n        {\n            if (c.CustomProperties[\"MenuLocation\"\
  ] != null)\n            {\n                // Add top-level menu items\n       \
  \         if (c.CustomProperties[\"MenuLocation\"].Value == \"Right\")\n       \
  \         {\n                    smnc.Add(GetSiteMapNodeFromChannelItem(c));\n \
  \               }\n            }\n            else if(c.Parent.Path!=base.RootChannel)\n\
  \            {\n                // Add sub menu items\n                smnc.Add(GetSiteMapNodeFromChannelItem(c));\n\
  \            }\n        }\n    }\n    return smnc;\n}\n```\n\n- 5. The class is\
  \ complete. Save the file.\n- 5. 类已完成。保存文件。\n- 6. Before the `MCMSSiteMapProviderRight`\
  \ class can be used, we need to register it in the web.config file.\n- 6. 在可以使用\
  \ `MCMSSiteMapProviderRight` 类之前，我们需要在 web.config 文件中注册它。\n\n```xml\n<siteMap defaultProvider\
  \ =\"MCMSSiteMapProvider\" enabled =\"true\">\n    <providers>\n        <add name=\"\
  MCMSSiteMapProvider\"\n            type=\"TropicalGreen.MCMSSiteMapProvider\"/>\n\
  \        <add name=\"MCMSSiteMapProviderTop\"\n            type=\"TropicalGreen.MCMSSiteMapProviderTop\"\
  />\n        <add name=\"MCMSSiteMapProviderRight\"\n            type=\"TropicalGreen.MCMSSiteMapProviderRight\"\
  />\n    </providers>\n</siteMap>\n```\n\nThe `SiteMapProviderRight` class has been\
  \ built and registered. Let’s add a `SiteMapDataSource` and menu control to the\
  \ `tropicalgreen.master` template.\n`SiteMapProviderRight` 类已构建并注册。让我们向 `tropicalgreen.master`\
  \ 模板添加一个 `SiteMapDataSource` 和菜单控件。\n\n- 1. With `tropicalgreen.master` opened,\
  \ drag a **SiteMapDataSource** control from the **Data** section of the toolbox\
  \ and assign the following property values:\n- 1. 打开 `tropicalgreen.master` 后，从工具箱的\
  \ **数据** 部分拖动 **站点地图数据源** 控件，并为其分配以下属性值：\n\n| 属性 | 值 |\n|---|---|\n| ID | SiteMapDataSourceRight\
  \ |\n| SiteMapProvider | MCMSSiteMapProviderRight |\n| ShowStartingNode | False\
  \ |\n\n- 2. Next, drag a menu control from the **Navigation** section of the toolbox\
