  \ section of the toolbox into the content area, above the **SiteMapDataSource**\
  \ control.\n- 4. 从工具箱的 **导航** 部分拖动 **TreeView** 控件到内容区域，放置在 **站点地图数据源** 控件上方。\n\n\
  ## Navigation Controls\n\n导航控件\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_142_0.png)\n\
  \n- 5. As soon as the TreeView control has been added to the form, the TreeView\
  \ Tasks dialog appears. Set the Choose Data Source field to SiteMapDataSourceTree\
  \ and select the Show Lines checkbox.\n- 5. 一旦 TreeView 控件已添加到窗体中，TreeView 任务对话框就会出现。将选择数据源字段设置为\
  \ SiteMapDataSourceTree 并选中显示线条复选框。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_142_1.png)\n\
  \nThe page is complete. Save and build the website. Now, let’s check the properties\
  \ of the SiteMap channel to ensure that it links to the SiteMap.aspx page. If you\
  \ have downloaded the site deployment file from the book’s companion website, the\
  \ SiteMap channel will already be configured to display the SiteMap.aspx page. Otherwise,\
  \ take the following steps to set the properties of the SiteMap channel.\n页面已完成。保存并构建网站。现在，让我们检查\
  \ SiteMap 频道的属性，以确保它链接到 SiteMap.aspx 页面。如果您已从本书的配套网站下载了站点部署文件，则 SiteMap 频道已配置为显示\
  \ SiteMap.aspx 页面。否则，请执行以下步骤设置 SiteMap 频道的属性。\n\n\n\n- 1. 打开 **站点管理器** 并导航到 **站点地图**\
  \ 频道。\n- 2. 右键单击 **站点地图** 频道并选择 **属性**。\n- 3. 在 **属性** 对话框中，单击 **发布** 选项卡。\n- 4.\
  \ 在对话框的 **频道呈现** 部分，单击 **选择**。\n- 5. 在 **选择频道呈现** 对话框中，将 **脚本 URL** 字段设置为 `/tropicalgreen/templates/sitemap.aspx`\
  \ 并单击 **确定**。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_143_0.png)\n\n6. 关闭所有打开的对话框。\n\
  \n现在导航到网站上的任何页面并单击顶部菜单栏上的 **站点地图** 链接。整个树被加载并显示。展开或收缩任何节点以显示子项。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_144_0.png)\n\
  \n> 这里，我们只是将 TreeView 控件拖放到页面上，并将构建树的必要逻辑直接添加到页面本身。更好的设计是将 TreeView 控件添加到 Web 用户控件或服务器控件中。封装在\
  \ Web 用户控件或服务器控件中，站点地图可以在站点的多个位置重复使用。\n\n## 按需填充节点\n\n对于非常大的树，每次加载时填充整个 TreeView\
  \ 控件可能并不实用。想象一个站点，其中树中有成千上万个节点；在所有节点加载完成之前可能需要相当长的时间。作为替代方案，我们可以配置树仅在展开父节点后才加载子节点。\n\
  \n好消息是，TreeView 控件的树视图节点已经具有一个内置属性名为 PopulateOnDemand，当设置为 true 时，将导致子节点仅在父节点首次展开时才被填充。让我们看看如何配置\
  \ TreeView 控件以按需填充节点。\n\n- 1. 在设计视图中打开之前创建的 Plant.aspx 模板文件。\n- 2. 从工具箱的数据部分拖动一个\
  \ SiteMapDataSource 控件并将其放置到内容区域。设置 ID 为 SiteMapDataSourceTree，SiteMapProvider 为\
  \ MCMSSiteMapProvider。\n- 3. 从工具栏的导航部分拖动一个 TreeView 控件并将其放置在内容区域的任何位置。设置 DataSourceID\
  \ 为 SiteMapDataSourceTree。\n- 4. 切换到源视图。在 <asp:TreeView> 标签之间，添加以下突出显示的代码：\n\n```\n\
  <asp:TreeView ID=\"TreeView1\" runat=\"server\"\n    DataSourceID=\"SiteMapDataSourceTree\"\
  \n    ShowLines=\"True\">\n    <DataBindings>\n        <asp:TreeNodeBinding PopulateOnDemand=\"\
  true\"\n            TextField=\"Title\"\n            NavigateUrlField=\"Url\"\n\
  \            ToolTipField=\"Description\"/>\n    </DataBindings>\n</asp:TreeView>\n\
  ```\n\n<DataBindings> 标签使我们能够指定每个站点地图节点如何转换为树视图节点。在这里，我们已将每个树视图节点的 PopulateOnDemand\
  \ 属性设置为 true。此外，我们已在树视图节点和站点地图节点之间映射了以下属性：\n\n| TreeView 节点 | SiteMap 节点 |\n|---|---|\n\
  | Text | Title |\n| NavigateUrl | Url |\n| Tooltip | Description |\n\n- 5. 接下来，我们设置树的深度，使仅显示第一级节点。我们还将\
  \ TreeView 的 PopulateNodesFromClient 属性设置为 true，这样使用最新浏览器的访问者（比 Internet Explorer\
  \ 5.5 或 Netscape 6.0 更新的浏览器）在检索子节点时不会使整个页面重新加载。相反，将生成一组 JavaScripts（也称为 AJAX 或异步\
  \ JavaScript 和 XML）。脚本将使用 Microsoft 的 XMLHTTP ActiveX 对象调用服务器端脚本，并在不刷新整个页面的情况下异步将子节点加载到树中。\n\
  \n```\n<asp:TreeView ID=\"TreeView1\" runat=\"server\"\n    DataSourceID=\"SiteMapDataSourceTree\"\
  \n    ShowLines=\"True\" PopulateNodesFromClient=\"True\"\n    ExpandDepth=\"1\"\
  >\n    . . . code continues . . .\n</asp:TreeView>\n```\n\n我们已配置树以按需填充节点。查看任何植物页面。注意树现在仅显示根频道以及第一级项目。展开任何节点并注意每次这样做时，页面调用的脚本都是\
  \ TreeView_PopulateNode()。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_145_0.png)\n\
  \n现在将鼠标光标放在 [-] 符号上。注意此时调用的脚本已更改为 TreeView_ToggleNode()。所调用函数名称的变化表明节点确实在首次展开时进行了往返以检索子节点。\n\
  \n## 导航控件\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_146_0.png)\n\n## 在编辑模式下展开节点时移除离开警告消息\n\
  \n当 TreeView 控件在编辑模式下的帖子中显示时存在一个问题。每次展开节点时，离开警告消息就会出现。\n\n通过按 F5 刷新页面，使树折叠到其原始状态。现在切换到编辑站点并编辑帖子。展开树的任何节点。你是否收到一条警告消息，提示刷新页面将导致未保存的更改丢失？\n\
  \n![](img/18a0aa8d36427a4c069b30410f998b8e_146_1.png)\n\n离开警告提示是在浏览器触发 OnBeforeUnload()\
  \ 事件时设计出现的。通常，这发生在浏览器窗口关闭或页面导航到不同位置时。如果查看页面的 HTML 源代码（右键单击页面上的任何位置并选择 **查看源代码**），你会发现\
  \ `TreeView_PopulateNode()` 方法是由锚点的 `href` 属性触发的：\n\n```\n<a id=\"ctl00_ContentPlaceHolder1_TreeView1n2\"\
  \ href=\"javascript:\nTreeView_PopulateNode(. . . code continues . . . )>\n```\n\
  \n使用锚点的 `href` 属性可以完成工作，但它会导致页面卸载，从而提示离开警告消息出现。\n\n与其使用锚点的 `href` 属性调用脚本，我们应该改用\
  \ `onclick()` 方法。`onclick()` 事件的行为类似于常规的 **提交** 按钮。当它触发时，页面的 URL 不会更改，因此不会触发页面的\
  \ `OnBeforeUnload()` 事件，警报也不会出现。\n\n我们需要将锚点 `href` 属性的全部内容移出并嵌入到 `onclick()` 事件中，使生成的代码如下所示。脚本应返回\
  \ `false` 以取消可能发生的任何进一步操作，例如执行 `href` 属性。\n\n```\n<a id=\"ctl00_ContentPlaceHolder1_TreeView1n2\"\
  \nonclick=\"TreeView_PopulateNode(. . . code continues . . . );\nreturn false;\"\
  >\n```\n\n修改锚标记生成的最佳方法是创建一个自定义 `TreeView` 控件并重写其 `Render()` 方法。\n\n- 1. 向解决方案添加一个\
  \ C# 类库项目。将项目命名为 **TropicalGreenControlLib**。\n- 2. 删除向导生成的 `Class1.cs` 文件。我们不需要它。\n\
  - 3. 向项目添加对 `System.Web` 库的引用。\n- 4. 向项目添加一个名为 `MCMSTreeView.cs` 的类文件。\n- 5. 代码需要使用以下代码段中突出显示的命名空间中的方法。将它们添加到命名空间声明之上。\n\
  \n```\n. . . code continues . . .\nusing System.Web;\nusing System.Web.UI;\nusing\
  \ System.Web.UI.WebControls;\nusing System.IO;\nusing System.Text.RegularExpressions;\n\
  \nnamespace TropicalGreenControlLib\n{\n    . . . code continues . . .\n}\n```\n\
  \n- 6. 由于我们只是修改树视图的呈现方式，因此我们不会从头开始构建控件。相反，让自定义控件继承自 System.Web.UI.WebControls.TreeView\
  \ 类。\n\n```\npublic class MCMSTreeView : TreeView\n{\n}\n```\n\n- 7 To 修改基 TreeView\
  \ 类生成的锚点，我们需要重写 Render() 方法。我们首先检索基 TreeView 控件生成的 HTML 输出。一旦获得原始内容，我们就会查找 href\
  \ 属性的实例。使用正则表达式，我们获取之前存储在 href 属性中的值并将其移动到锚点的 onclick() 事件处理程序中。添加如下所示的代码：\n\n```\n\
  protected override void Render(System.Web.UI.HtmlTextWriter\n    output)\n{\n  \
  \  // Get the output of the original TreeView Control\n    TextWriter tempWriter\
  \ = new StringWriter();\n    base.Render(new System.Web.UI.HtmlTextWriter(tempWriter));\n\
  \    string orightml = tempWriter.ToString();\n\n    // Search for the javascript\
  \ postback code in the href attribute\n    // and if found add an onclick event\
  \ handler to execute it in a\n    // way that does not cause the MCMS authoring\
  \ warning to show up\n    Regex hrefRegex =\n        new Regex(\"href=\\\"javascript:(?<PostBackScript>.*?)\\\
  \"\",\n            RegexOptions.Singleline);\n    string newhtml = hrefRegex.Replace(orightml,\n\
  \        \"href=\\\"javascript:${PostBackScript}\\\" \" +\n        \"onclick=\\\"\
  eval(this.href.substr(11)); \" +\n        \"return false;\\\"\" );\n    output.Write(newhtml);\n\
  }\n```\n\n- 8. 控件已完成。保存并编译 TropicalGreenControlLib 项目。\n\n要使用自定义控件，请右键单击工具箱内的任意位置并选择“选择项”。在“选择项”对话框中，选择\
  \ .NET Framework 组件选项卡。单击“浏览”按钮并选择 TropicalGreenControlLib 项目的 /debug/bin/ 文件夹中\
  \ found 的 TropicalGreenControlLib.dll 文件。\n\n\n\n一旦控件已添加到工具箱中，就将其拖放到 Plant.aspx\
  \ 模板文件的任何可编辑区域。像之前为 TreeView 控件所做的那样设置 MCMSTreeview 的属性。页面渲染后，节点会按预期展开和折叠，即使在编辑模式下也不会出现离开警告消息。\n\
  \n完成后，删除植物模板文件中的所有 TreeView 控件。\n\n## 使 TreeView 控件的按需填充功能在通道渲染脚本中工作\n\n正如我们所见，按需填充功能在嵌入模板文件时可以正常工作。然而，如果你尝试将其添加到通道渲染脚本中，你可能会发现当展开任何节点时\
  \ TreeView 控件似乎会冻结。作为示例，让我们修改之前创建的 SiteMap.aspx 页面的 TreeView 控件：\n\n- 1. 在源视图中打开\
  \ SiteMap.aspx 文件。\n- 2. 按如下所示修改 TreeView 控件的属性：\n- 3. 保存页面。\n\n```\n<asp:TreeView\
  \ ID=\"TreeView1\" runat=\"server\" DataSourceID=\n\"SiteMapDataSourceTree\"\nShowLines=\"\
  True\" PopulateNodesFromClient=\"True\" ExpandDepth=\"1\">\n<DataBindings>\n<asp:TreeNodeBinding\
  \ PopulateOnDemand=\"true\"\nTextField=\"Title\"\nNavigateUrlField=\"Url\"\nToolTipField=\"\
  Description\"/>\n</DataBindings>\n</asp:TreeView>\n```\n\n完成后，导航到站点地图页面。尝试展开任意节点。注意没有任何反应！\n\
  \n要理解为什么会发生这种情况，让我们仔细看看按需填充功能的工作方式。当节点展开时，浏览器会静默执行一次回发。回发需要 <form> 标签的 action 属性中存储的信息。如果你查看页面的生成的\
  \ HTML，你会发现表单的 action 属性中存储的值类似于以下内容：\n\n```\n<form name=\"aspnetForm\" method=\"\
  post\" action=\"sitemap.aspx?...code continues...\">\n```\n\naction 属性中存储的值有趣之处在于它是一个相对\
  \ URL。在常规 Web 应用程序中，使用相对 URL 工作良好。然而，对于 MCMS 页面，URL 必须是绝对的。这是因为用于访问页面的 URL（例如 http://tropicalgreen/sitemap/）并不指向物理文件夹——它纯粹是虚拟的，并指向存储库中的一个通道。因此当它尝试访问诸如\
  \ sitemap.aspx 的相对 URL 时，它会在 http://tropicalgreen/sitemap/sitemap.aspx 处查找它。由于文件在该位置物理上不存在，代码就会失败。\n\
  \n要纠正此问题，我们需要改用绝对链接。要在表单的 action 属性中生成绝对链接，我们可以选择：\n\n- 1. 生成一个 <base> 标签并在其中存储页面的绝对路径。有了\
  \ <base> 标签，所有相对链接都会通过在链接前加上标签中存储的值而转换为绝对链接。通常，<base> 标签由 RobotMetaTag 控件生成。然而，控件中的一个错误阻止它在通道渲染脚本中生成\
  \ <base> 标签。一个增强版的 RobotMetaTag 可在通道渲染脚本和模板文件上同时工作，可在此处找到：http://www.gotdotnet.com/Community/UserSamples/Details.aspx?SampleGuid=8600bae5-7aba-481b-93bb-d179927179d5。\n\
  - 2. 使用客户端 JavaScript 修改 <form> 标签的 action 属性。虽然生成 <base> 标签是一种可能的解决方案，但你可能不想启用它（我们在第\
  \ 5 章讨论了一些 <base> 标签不能使用的可能原因）。要使此方法工作，我们需要修改树视图的渲染方式，为此我们必须创建一个自定义 TreeView 控件。由于我们之前已经创建了一个自定义\
  \ TreeView 控件，让我们探讨如何增强它以在通道渲染脚本中工作。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_150_0.png)\n\
  \n> TreeView 控件的按需填充功能之所以适用于植物模板文件，是因为我们已将 RobotMetaTag 控件的 RenderBaseHref 属性设置为\
  \ true。如果将其设置为 false，<base> 标签将不会生成，并且树视图将无法按需填充子节点。\n\n我们需要将表单 action 属性中存储的相对链接转换为绝对链接。为此，我们将利用生成的页面中已有的一些功能。\n\
  \n如果你检查任何 MCMS 页面的 HTML 源代码，你会发现一个名为 __CMS_PostbackForm 的 JavaScript 变量，它存储了表单对象的实例。\n\
  \n```\nvar __CMS_PostbackForm = document.forms['aspnetForm'];\n```\n\n此外，还有一个名为\
  \ __CMS_CurrentUrl 的变量，它存储页面的绝对 URL。以下是站点地图页面的 __CMS_CurrentUrl 在你的页面上可能的样子。请注意，你站点上的\
  \ GUID 值可能不同。\n\n```\nvar __CMS_CurrentUrl = \"/tropicalgreen/templates/sitemap.aspx?\n\
  NRMODE=Published&\nNRNODEGUID=%7b6bE3510D2-519A-4D4F-92A8-621B43F5894F%7d&\nNRORIGINALURL=%2ftropicalgreen%2fSiteMap%2f&\n\
  NR_CACHEHINT=ModifyLoggedIn\";\n```\n\n把这些片段组合起来，为了将 __CMS_CurrentUrl 中存储的值赋给表单、__CMS_PostbackForm\
  \ 的 action 属性的值，我们需要在客户端以某种方式执行以下脚本：\n\n```\n<script type=\"text/javascript\">\n\
  \    if (typeof (__CMS_CurrentUrl) != \"undefined\")\n    {\n        __CMS_PostbackForm.action\
  \ = __CMS_CurrentUrl;\n    }\n</script>\n```\n\n注册脚本的好地方是 TreeView 控件的 Render()\
  \ 方法。打开 MCMS TreeView.cs 文件并将突出显示的代码添加到 Render() 方法中。\n\n```\nprotected override\
  \ void Render(System.Web.UI.HtmlTextWriter output)\n{\n    ... code continues ...\n\
  \    // Register a client script that ensures that the action property\n    // is\
  \ correct when AJAX tries to do its postback.\n    string script = \"\\n<script\
  \ type=\\\"text/javascript\\\">\\n\" +\n        \" if (typeof (__CMS_CurrentUrl)\
  \ != \" +\n        \" \\\"undefined\\\")\\n\" +\n        \" {\\n\" +\n        \"\
  \   __CMS_PostbackForm.action = \" +\n        \" __CMS_CurrentUrl;\\n\" +\n    \
  \    \" }\\n\" +\n        \"</script>\\n\";\n```\n\n```\nPage.ClientScript.RegisterStartupScript(this.GetType(),\n\
  \    \"AdjustActionForTreeView\", script);\n}\n```\n\n现在，用自定义的 MCMS TreeView 控件替换\
  \ SiteMap.aspx 上的 TreeView 控件。设置好按需填充节点后，树不再冻结，你应该能够展开和收缩节点以显示子节点。\n\n## 在摘要页面中使用\
  \ TreeView 控件\n\n摘要页面（也称为默认、封面或索引页面）提供给定部分内页面的列表。它们在访问者只知道页面的存在但不知道其确切位置时特别有用。例如，你可能知道植物目录中有一页描述芦荟，但你可能不知道其地址。如果植物目录页面提供了站点上所有植物页面的列表，你就可以轻松找到所需页面。\n\
  \n早期版本的摘要页面通常是手工编码的工作，当添加、删除或重命名新页面时必须频繁更新。多年来，随着活动脚本使开发人员能够即时动态组装摘要页面，这种做法逐渐被淘汰。这意味着页面显示的是列表的最新版本，为高效有效的链接管理提供了便利。\n\
  \n在基于 ASP.NET 1.x 构建的 MCMS 站点中，摘要页面通常通过遍历通道和帖子的集合来构建。然后将通道项的集合显示在类似表格的控件中，例如 DataGrid。虽然这种技术今天仍然有效，但\
  \ ASP.NET 2.0 引入了一种更快、更易于构建摘要页面的方法。\n\n让我们看看一个替代方案，它涉及构建自定义站点地图提供程序和 TreeView 控件。以下是计划：\n\
  \n- 1. 我们首先创建一个自定义站点地图提供程序，将当前查看的通道设为根节点。然后将通道内的所有帖子添加为站点地图节点。\n- 2. 接下来，我们将使用 TreeView\
  \ 控件提供通道内所有页面的列表。虽然 TreeView 控件旨在显示项目的分层列表，但其多功能性也允许它同样好地显示简单的单级列表。\n\n\n\n完成后，植物目录频道的摘要将如下所示：\n\
  \n- Aloe Vera\n- Banana Tree\n- Bougainvillea\n- Coconut Tree\n- EggPlants\n- Ficus\n\
  - Hibiscus\n- Ixora\n- Man Eating Plant\n\n## SiteMapProviderSummary 类\n\n让我们开始创建自定义站点地图提供程序类，它将与之前创建的\
  \ `MCMS SiteMapProvider` 类相似，有几点不同：站点地图不再包含网站上所有频道的层级列表，而是从（并且仅包含）当前查看的频道开始。其次，只有当前频道内的页面才会被添加到站点地图中。\n\
  \n- 1. 在 **TropicalGreen** 项目的 `App_Code/SiteMapProviders` 文件夹中添加一个类文件。将文件命名为 **MCMS\
  \ SiteMapProviderSummary.cs**。\n- 2. 我们需要在以下代码中使用的命名空间中的方法。添加突出显示的命名空间以及命名空间声明。\n\
  \n```\nusing System;\nusing System.Data;\nusing System.Configuration;\nusing System.Web;\n\
  using System.Web.Security;\nusing System.Web.UI;\nusing System.Web.UI.WebControls;\n\
  using System.Web.UI.WebControls.WebParts;\nusing System.Web.UI.HtmlControls;\nusing\
  \ Microsoft.ContentManagement.Publishing;\n\nnamespace TropicalGreen\n{\n    . .\
  \ . code continues . . .\n}\n```\n\n- 3. 与我们构建的其他自定义站点地图提供程序一样，我们不会从头编写它。我们将走捷径并继承之前创建的\
  \ MCMSSiteMapProvider 类。\n\n```\npublic class MCMSSiteMapProviderSummary : MCMSSiteMapProvider\n\
  {\n    . . . code continues . . .\n}\n```\n\n- 4. 由于列表显示的是单个频道的内容，因此我们无需将其他所有频道添加到站点地图中。相反，我们将当前查看的频道设为根站点地图节点路径。为此，我们重写\
  \ GetRootNodeCore() 方法。\n\n```\nprotected override SiteMapNode GetRootNodeCore()\n\
  {\n    // Set the currently viewed channel to be the root node\n    Channel root\
  \ = CmsHttpContext.Current.Channel;\n    return base.GetSiteMapNodeFromChannelItem(root);\n\
  }\n```\n\n- 5. 接下来，我们将重写 GetChildNodes() 方法。我们检索当前频道内的所有页面的集合，并按显示名称按字母顺序排序。然后我们将它们逐个添加到站点地图中。\n\
  \n```\npublic override SiteMapNodeCollection GetChildNodes(SiteMapNode node)\n{\n\
  \    // Create a new SiteMapNodeCollection\n    SiteMapNodeCollection smnc = new\
  \ SiteMapNodeCollection();\n\n    // Get an instance of the currently viewed channel\n\
  \    Channel channel =\n        CmsHttpContext.Current.Searches.GetByGuid(node.Key)\
  \ as Channel;\n\n    if (channel != null)\n    {\n        // Get a collection of\
  \ all postings within the channel\n        PostingCollection pc = channel.Postings;\n\
  \n        // Sort the postings by Display Name (from A-Z)\n        pc.SortByDisplayName();\n\
  ```\n\n```\n// Add each posting to the site map\nforeach (Posting p in pc)\n{\n\
  \    smnc.Add(GetSiteMapNodeFromChannelItem(p));\n}\n}\nreturn smnc;\n}\n```\n\n\
  - 6. 类已完成。保存 MCMSSiteMapProviderSummary 类文件。\n- 7. 与之前一样，在使用之前，我们需要在 web.config\
  \ 文件中添加对自定义站点地图提供程序的引用。将突出显示的行添加到 web.config 文件的 <providers> 部分。\n\n```\n<providers>\n\
  \    . . . code continues . . .\n    <add name=\"MCMSSiteMapProviderSummary\"\n\
  \        type=\"TropicalGreen.MCMSSiteMapProviderSummary\"/>\n</providers>\n```\n\
  \n## 配置 TreeView 控件以显示平面项目列表\n\n现在我们已经创建了提供给定频道内所有页面列表的自定义站点地图提供程序，我们需要找到一个能够显示该列表的控件。开箱即用，我们可以选择使用\
  \ SiteMapPath、Menu 或 TreeView 控件。为本示例的目的，让我们选择 TreeView 控件。\n\n使用 TreeView 控件来显示平面项目列表似乎违反直觉。毕竟，它被设计用来显示层级列表。尽管如此，我们将看到\
  \ TreeView 控件是一个非常多用途的控件，能够显示层级嵌套项目以及单维平面列表。\n\n- 1. 首先，在 TropicalGreen 项目的 /Templates/\
  \ 文件夹中创建一个新的 Web 表单。将文件命名为 ChannelRenderingScript.aspx。选择要选择母版页。\n- 2. 在“选择母版页”对话框中，选择位于\
  \ Templates 文件夹中的 tropicalgreen.master 文件。\n- 3. 在设计视图中打开 ChannelRenderingScript.aspx，从工具箱的数据部分拖动\
  \ SiteMapDataSource 控件并将其放置在内容区域的任何位置。为控件赋予以下属性值：\n\n| 属性 | 值 |\n|---|---|\n| ID\
  \ | SiteMapDataSourceSummary |\n| SiteMapProvider | MCMSSiteMapProviderSummary |\n\
  | ShowStartingNode | False |\n\n我们已将 SiteMapDataSource 设置为链接到我们之前构建的站点地图提供程序：MCMSSiteMapProviderSummary。注意，由于我们不希望当前查看的频道作为列表的一部分显示，因此我们将\
  \ ShowStartingNode 属性设置为 false。\n\n- 4. 接下来，从工具箱的导航部分拖动 TreeView 控件并将其放置在内容区域的任何位置。为其赋予以下属性值：\n\
  \n| 属性 | 值 |\n|---|---|\n| ID | TreeView1 |\n| DataSourceID | SiteMapDataSourceSummary\
  \ |\n| MaxDataBindDepth | 1 |\n| ShowExpandCollapse | False |\n\n通过将 MaxDataBindDepth\
  \ 属性设置为 1，我们确保 TreeView 控件永远不会显示超过一个层级的项目。这样列表始终是平面的。此外，我们将 ShowExpandCollapse 设置为\
  \ false 以防止展开的加号 [+] 和减号 [-] 符号出现。\n\n- 5. 最后，为了在列表中的每个项目旁边显示一个项目符号，我们将手动定义每个节点的绑定。切换到源视图并在\
  \ <asp:TreeView> 标签之间添加突出显示的代码。\n\n```\n<asp:TreeView ID=\"TreeView1\" runat=\"\
  server\" DataSourceID=\"SiteMapDataSourceSummary\" MaxDataBindDepth=\"1\" ShowExpandCollapse=\"\
  False\">\n<DataBindings>\n<asp:TreeNodeBinding TextField=\"Title\" NavigateUrlField=\"\
  Url\" ToolTipField=\"Description\" FormatString='<li>{0}</>' />\n</DataBindings>\n\
  </asp:TreeView>\n```\n\n我们已将树视图节点绑定到站点地图节点的 Title、Url 和 Description 属性。此外，通过将 FormatString\
  \ 设置为包含 <li> 标签，我们包含了要在每个项目旁边打印的项目符号。\n\n- 6. 页面已完成。保存并编译网站。\n\n接下来，让我们将 ChannelRenderingScript.aspx\
  \ 文件分配为植物目录频道的频道渲染脚本。\n\n- 1. 在站点管理器中，右键单击 PlantCatalog 频道。选择属性。\n- 2. 在 PlantCatalog\
  \ 属性对话框中，单击“发布”选项卡。\n- 3. 在“频道渲染”部分，单击“选择”按钮。\n- 4. 在“选择频道渲染”对话框中，在脚本 URL 字段中输入\
  \ /tropicalgreen/templates/ChannelRenderingScript.aspx。\n- 5. 单击“确定”并关闭所有打开的对话框。\n\
  \n这样，我们就可以查看摘要页面了。导航到 http://tropicalgreen/plantcatalog 并查看频道内的所有植物页面列表。\n\n频道渲染脚本\
  \ ChannelRenderingScript.aspx 可以应用于网站上的所有其他频道。请继续将其分配为 Columns 和 Gardens 频道的频道渲染脚本。\n\
  \n## 摘要\n\n使用随 ASP.NET 2.0 提供的导航控件，构建站点导航从未如此简单。在本章中，我们首先构建了一个自定义 SiteMapProvider，它从\
  \ MCMS 仓库读取以填充站点地图。接下来，我们展示了 SiteMapPath 控件如何与自定义 SiteMapProvider 配合工作，以提供面包屑链接，显示用户在站点中的确切位置。我们看到\
  \ SiteMapPath 控件正常工作不需要额外的编程。随后，我们研究了 Menu 控件。我们构建了该控件的两个版本——一个放置在页面顶部的静态水平菜单，以及一个位于页面右侧的动态垂直菜单。最后，我们演示了\
  \ TreeView 控件如何与 SiteMapProvider 一起使用，以提供站点层级的全面视图。我们展示了如何配置它以按需填充节点，以及作为频道渲染脚本的一部分来显示特定频道内所有帖子的摘要列表。\n\
  \n\n"
- "# 5 应用主题\n\n大多数网站都是在考虑统一的外观和感觉的前提下设计的。毕竟，如果你访问一个网站，其页面之间差异明显，你可能会开始怀疑（可能在第二个页面之后）自己是否仍在浏览同一个网站。\n\
  \n在本章中，我们将了解如何通过使用主题高效地将统一的外观和感觉应用于 MCMS 网站。我们将创建皮肤和层叠样式表，并演示它们如何协同工作以定义网站的外观。最后，我们将讨论使主题在\
  \ MCMS 网站中正确工作所需的一项基本自定义。\n\n### 主题与层叠样式表\n\n在整个网站上保持一致的外观和感觉的挑战并非新鲜事。没过多久，开发人员就使用层叠样式表（CSS）来定义网站的外观。使用\
  \ CSS 是将设计元素与 HTML 分离的一步。图形设计师可以独立地处理 CSS 文件，提供诸如配色方案、字体类型、间距、边距和其他视觉效果等信息。如果需要更改其中任何属性，设计师所需要做的就是修改\
  \ CSS 文件，瞧，网站的外观和感觉就会立即焕然一新！\n\n然而，尽管使用 CSS 有其优势，但对网站设计的修改仍然需要相当多的工作。只要想想最近一次在你负责的网站上引入了新的日历控件等复杂控件的情况。为了给控件赋予期望的外观和感觉，必须应用多种样式：标题一种，选中日期另一种，导航箭头还有几种。此外，网站上的每个日历控件都必须重复同样的任务。你可以将“已样式化”的日历封装在自定义控件中并在整个网站中重用，但这意味着要考虑到设计元素编写代码，这使得开发人员和设计人员之间的工作安排变得复杂。此外，CSS\
  \ 在定义控件外观方面存在局限。例如，你无法用它来定义构成网格的列或树的节点。\n\nCSS 的另一个局限性是不同浏览器对样式表的支持程度不一。当加入旧版浏览器或个人数字助理和手机等替代网络设备时，情况变得更加复杂。为了使网站在所有浏览器类型和版本中保持一致的外观，必须实施复杂的变通方法。\n\
  \nASP.NET 2.0 通过引入主题的概念将 CSS 背后的思想更进一步。主题充当存储网站设计信息的中心位置。你可以在主题中存储 CSS 文件。ASP.NET\
  \ 会自动为引用该主题的所有页面生成指向所有 CSS 文件的链接。\n\n除了管理 CSS 文件外，主题还存储网站所需的一整套图像和其他设计文件。此外，你可以在单个网站中定义多个主题。如果切换网站的主题，网站将自动采用所选主题使用的图像和其他支持文件。这样，你就可以为各种设备或浏览器自定义网站的外观和感觉。\n\
  \n主题还可能包含皮肤。可以把皮肤想象成服务器控件的外层覆盖物——有点像枕套。当你把新的套子套在枕头上时，你改变了它的设计，但枕头本身基本保持不变。同样，皮肤可以应用于\
  \ ASP.NET 服务器控件。皮肤通过将整个控件的样式定义合并到单个文件中，而不是使用多个样式表，来解决复杂服务器控件的设计需求。有了皮肤，你就可以轻松地为日历和数据网格等复杂控件应用样式并设置其属性。你甚至可以在皮肤中定义诸如构成网格的列或树的节点等元素——这是\
  \ CSS 无法完成的任务。\n\n主题的另一个优点是它们驻留在 Web 应用程序的目录中。你可以拥有多个 Web 应用程序，每个应用程序都有其独特的主题。这样，你就可以放心地将主题应用于帖子，而不必担心影响例如\
  \ MCMS 对话框等其他 Web 应用程序中页面的外观和感觉。\n\n### 创建主题\n\n让我们开始为 TropicalGreen 网站创建一个主题。我们将主题命名为\
  \ Sunny，并用它为我们的网站应用新的设计。在 ASP.NET 2.0 中，单个项目使用的主题存储在项目应用程序文件夹下方的特殊文件夹 App_Themes\
  \ 中。你可以根据网站需要创建任意数量的主题（或子文件夹）。\n\n- 1. 首先，让我们创建 `App_Themes` 文件夹。在 **Solution Explorer**\
  \ 中，右键单击 **TropicalGreen** 项目并选择 **Add ASP.NET folder | Theme**。一个新的名为 `App_Themes`\
  \ 的文件夹出现。\n- 2. 在 `App_Themes` 文件夹内有一个名为 `Theme1` 的子文件夹。将文件夹重命名为 `Sunny`。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_161_0.png)\n\
  \n### 将主题应用于整个网站\n\n我们已经创建了一个名为 Sunny 的主题。现在让我们将其应用于 TropicalGreen 网站。\n\n在 web.config\
  \ 文件中，查找 `<pages>` 标签并添加一个名为 theme 的属性，并将其值设置为 Sunny。\n\n```\n<pages validateRequest=\"\
  false\"\n    theme=\"Sunny\"/>\n```\n\n我们已将 Sunny 主题应用于 TropicalGreen 网站。然而，主题尚未定义任何样式或设计。在下一节中，我们将添加皮肤和样式表来定义网站的外观和感觉。\n\
  \n> 而不是将主题应用于整个网站，我们本可以在页面级别通过设置 @Page 指令的 theme 属性来定义它。如果我们需要更大的灵活性（例如，根据用户配置文件更改主题），我们可以使用代码应用主题。\n\
  \n### 服务器控件的皮肤\n\n顾名思义，皮肤充当控件的外层覆盖物。大多数开箱即用的 ASP.NET 服务器控件都支持皮肤。然而，检查你计划使用的控件是否可以套用皮肤始终是个好主意。为此，请查找\
  \ SkinID 属性。如果控件具有 SkinID 属性，则可以为其应用皮肤。\n\n皮肤有两种类型：\n\n- **Default skins**，应用于 `SkinID`\
  \ 中未定义对应皮肤的所有控件。例如，如果你为 `TextBox` 控件定义默认皮肤，则采用该主题的页面上的所有 `TextBox` 控件都将遵循默认皮肤中定义的样式。\n\
  - **Name-controlled skins**，仅针对共享相同 `SkinID` 的控件。例如，你可能为 `TextBox` 定义了一个皮肤。假设该皮肤的\
  \ `SkinID` 为 `MyTextBox`。只有 `SkinID` 与 `MyTextBox` 匹配的 `TextBox` 控件才会应用该皮肤。\n\n\
  ### 创建默认皮肤\n\n考虑在我们的 `TropicalGreen.master` 模板中之前创建的 `SiteMapPath` 控件的情况。我们希望控件使用冒号字符\
  \ (:) 作为节点分隔符。字体类型应为 Verdana。所有节点都将以粗体和绿色显示，当前节点除外，当前节点将为橙色。如果我们使用代码设置这些属性，其外观如下：\n\
  \n```\n<asp:SiteMapPath ID=\"SiteMapPath1\" runat=\"server\" Font-Names=\"Verdana\"\
  \ PathSeparator=\":\">\n    <PathSeparatorStyle Font-Bold=\"True\" ForeColor=\"\
  green\"/>\n    <CurrentNodeStyle ForeColor=\"orange\"/>\n    <NodeStyle Font-Bold=\"\
  True\" ForeColor=\"green\"/>\n    <RootNodeStyle Font-Bold=\"True\" ForeColor=\"\
  green\"/>\n</asp:SiteMapPath>\n```\n\n虽然通过代码轻松设置控件的属性，但我们也可以使用皮肤实现同样的效果。在此之前，从 `SiteMapPath`\
  \ 控件中删除所有样式属性，使代码变为：\n\n```\n<asp:SiteMapPath ID=\"SiteMapPath1\" runat=\"server\"\
  >\n</asp:SiteMapPath>\n```\n\n现在让我们为 `SiteMapPath` 控件构建一个皮肤。\n\n- 1. 在 **Solution\
  \ Explorer** 中，右键单击 **Sunny** 文件夹并选择 **Add New Item...**\n- 2. 在 **Add New Item**\
  \ 对话框中，选择创建新的 **Skin File** 并将其命名为 **Sunny.skin**。\n\n\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_163_0.png)\n\
  \n3. 皮肤文件包含示例代码，展示皮肤模板的外观。我们在示例中不需要该示例。请删除所有现有代码。\n\n4. 现在让我们为 SiteMapPath 控件定义一个皮肤。为了产生戏剧性效果，以便稍后在屏幕截图中可以看到差异，我们将字体大小设置为超大。请在皮肤文件中输入以下代码：\n\
  \n```\n<asp:SiteMapPath runat=\"server\" Font-Names=\"Verdana\" Font-Size=\"X-Large\"\
  \ PathSeparator=\":\">\n    <PathSeparatorStyle Font-Bold=\"True\" ForeColor=\"\
  green\"/>\n    <CurrentNodeStyle ForeColor=\"orange\"/>\n    <NodeStyle Font-Bold=\"\
  True\" ForeColor=\"green\"/>\n    <RootNodeStyle Font-Bold=\"True\" ForeColor=\"\
  green\"/>\n</asp:SiteMapPath>\n```\n\n该代码与原始控件中的代码看起来并没有太大不同。不同之处在于，代码现在位于皮肤文件而不是嵌入在模板文件中，从而实现了设计与应用的清晰分离！\n\
  \n由于我们创建的皮肤是默认皮肤，因此无需做任何其他操作即可看到其效果。TropicalGreen 网站上的所有 SiteMapPath 控件将立即采用皮肤提供的样式。导航到网站上的任何页面。面包屑轨迹的节点现在以粗体绿色\
  \ Verdana 字体显示，当前节点除外，当前节点为橙色，字体大小为皮肤中定义的超大字体。\n\nHome : Plant Catalog : Aloe Vera\n\
  \n## 创建名称受控皮肤\n\n当页面上存在不应采用默认皮肤的控件时会怎样？例如，在前面皮肤化的 SiteMapPath 控件中，我们将默认皮肤设置为显示超大字体。如果我们不想更改默认皮肤，但又要应用不同的字体设置，则可以使用名称受控皮肤。\n\
  \n名称受控皮肤使用 SkinID 属性。工作原理如下。首先，我们设置皮肤文件中定义的控件的 SkinID。接下来，我们识别将在 Web 表单中采用该特定皮肤的控件，并将这些控件的\
  \ SkinID 设置为与皮肤的值匹配。这样，只有具有相同 SkinID 的控件才会采用皮肤的外观和感觉。\n\n让我们尝试为站点地图控件提供一个字体大小为正常的皮肤。按如下方式在\
  \ Sunny.skin 文件中追加一个皮肤控件。请注意，我们已将字体大小设置为 Medium，并将 SkinID 设置为 Breadcrumb。\n\n```\n\
  <asp:SiteMapPath runat=\"server\" Font-Names=\"Verdana\"\n    PathSeparator=\":\"\
  \n    Font-Size=\"Medium\" SkinID=\"Breadcrumb\">\n    <PathSeparatorStyle Font-Bold=\"\
  True\" ForeColor=\"green\"/>\n    <CurrentNodeStyle ForeColor=\"orange\"/>\n   \
  \ <NodeStyle Font-Bold=\"True\" ForeColor=\"green\"/>\n    <RootNodeStyle Font-Bold=\"\
  True\" ForeColor=\"green\"/>\n</asp:SiteMapPath>\n```\n\n为了使站点地图控件拾取名称受控皮肤，我们还需要将控件的\
  \ SkinID 分配为 Breadcrumb。在 tropicalgreen.master 文件中，按如下所示设置控件的 SkinID：\n\n```\n<asp:SiteMapPath\
  \ ID=\"SiteMapPath1\" runat=\"server\" SkinID=\"Breadcrumb\">\n</asp:SiteMapPath>\n\
  ```\n\n保存文件。现在，导航到任何现有的植物发布内容。字体大小已恢复正常，表明控件现在采用名称受控皮肤而不是默认皮肤。\n\nHome : Plant Catalog\
  \ : Aloe Vera\n\n## 完成皮肤\n\n让我们通过为顶部水平菜单和右侧垂直菜单定义皮肤来完成皮肤文件。\n\n首先，在打开 Tropicalgreen.master\
  \ 的情况下，删除之前添加到顶部菜单的一些样式元素，使代码如下所示：\n\n```\n<asp:Menu ID=\"Menu1\" runat=\"server\"\
  \ DataSourceID=\"SiteMapDataSourceTop\"\nSkinID=\"TopMenu\">\n</asp:Menu>\n```\n\
  \n我们还将删除可能已添加到右侧菜单的任何样式元素。右侧菜单的代码应类似于以下内容：\n\n```\n<asp:Menu ID=\"Menu2\" runat=\"\
  server\" DataSourceID=\n\"SiteMapDataSourceRight\" SkinID=\"RightMenu\">\n</asp:Menu>\n\
  ```\n\n现在让我们使用皮肤将这些样式元素添加回来。将以下皮肤定义添加到 Sunny.skin 文件中。\n\n```\n<asp:Menu SkinID=\"\
  TopMenu\" runat=\"server\" Orientation=\"Horizontal\"\n    MaximumDynamicDisplayLevels=\"\
  1\" StaticDisplayLevels=\"2\"\n    StaticMenuItemStyle-CssClass=\"TopMenu\"\n  \
  \  StaticEnableDefaultPopOutImage=\"False\">\n</asp:Menu>\n\n<asp:Menu SkinID=\"\
  RightMenu\" runat=\"server\" Orientation=\"Vertical\"\n    MaximumDynamicDisplayLevels=\"\
  1\" StaticDisplayLevels=\"1\"\n    StaticMenuItemStyle-CssClass=\"RightMenu\"\n\
  \    StaticEnableDefaultPopOutImage=\"False\">\n</asp:Menu>\n```\n\n我们已为两个菜单添加了皮肤定义；现在将菜单的\
  \ SkinID 设置为与皮肤相匹配：\n\n| 控制 ID | 将 SkinID 设置为 |\n|------------|-------------------|\n\
  | MenuTop | TopMenu |\n| MenuRight | RightMenu |\n\n请注意，皮肤定义使用了级联样式表（请参阅 CssClass\
  \ 属性）。我们尚未创建任何样式表；因此，如果您查看任何主题页面，在应用新皮肤后可能看不到太多差异。让我们看看皮肤和样式表在主题内是如何协同工作的。\n\n##\
  \ 使用样式表\n\n我们已经看到如何使用皮肤为 ASP.NET 服务器控件应用特定样式。它们对于设置导航、表单和其他基于服务器的控件的样式非常有用。毫无疑问，它们是我们工具箱中非常巧妙实用的工具。\n\
  \n然而，在 MCMS 的世界中，确保网站在整个过程中保持一致的外观和感觉的一个重要方面是确保作者在占位符控件（如 HtmlPlaceholderControl）中输入的内容也遵循网站的样式指南。为了强制执行\
  \ HTML 内容的设计规则，皮肤对我们帮助不大。对于 HTML 控件和代码，我们仍然必须使用好旧的级联样式表。\n\n以前，要将 CSS 文件应用于站点，我们会向所有需要它的模板文件和\
  \ Web 表单添加 <link> 标签：\n\n```\n<link type=\"text/css\" href=\"UrlOfFile.css\"/>\n\
  ```\n\n或者，我们也可以使用 <style> 标签直接在页面本身中嵌入样式：\n\n```\n<style>\nH1{color:#993300;font-weight:bold;font-size:14pt}\n\
  </style>\n```\n\n这两种技术都有效，但仍然可能是一件混乱的事情，尤其是在处理多个样式表和 Web 表单时。\n\n好消息是：主题也支持 CSS。现在，我们可以直接将\
  \ CSS 文件添加到主题中。在幕后，ASP.NET 将为我们生成 <link> 标签。\n\n## 创建样式表\n\nTropicalGreen 网站的主模板主要由表格组成。此外，作者输入的所有自定义内容都仅限于常规\
  \ HTML 文本。由于这些不是 ASP.NET 服务器控件，因此不支持皮肤。为了确保此类内容的外观和感觉与网站其余部分一致，我们需要应用样式表。\n\n让我们尝试通过使用样式表为\
  \ TropicalGreen 网站的其余部分添加样式。\n\n- 1. 要向主题添加样式表，请在 **Solution Explorer** 中右键单击 **Sunny**\
  \ 主题文件夹并选择 **Add New Item...**\n- 2. 在 **Add New Item** 对话框中，选择 **Style Sheet**\
  \ 模板并将文件命名为 **Sunny.css**。\n- 3. 我们在此示例中使用的样式表相对简单。我们将为 body、anchor 和几个标题级别指定样式，以及为横幅和菜单指定一些命名样式。输入以下代码：\n\
  - 4. 保存 Sunny.css。\n\n```\nBody {font-family:Verdana,Arial;font-size:11pt}\nA{color:#0000FF;font-size:10pt;font-weight:bold}\n\
  H1{color:#993300;font-weight:bold;font-size:14pt}\nH2{color:#FF6600;font-weight:bold;font-size:12pt}\n\
  .Banner{background-color:#ffcc00}\n.TopMenu{background-color:#66cc33;font-weight:bold;color:#CCFF99;\n\
  \        text-decoration:none;padding:5px;}\n.RightMenu{background-color:#669900;color:#CCFF99;\n\
  \        text-decoration: none; font-weight:bold;padding:5px;}\n```\n\n> 我们不会详细介绍\
  \ CSS 的语法。要了解 CSS 入门，请查看以下网站：\n> http://www.w3c.rl.ac.uk/primers/css/cssprimer.htm.\n\
  \n> Visual Studio 还附带了 **Style Builder**，它提供了一个用于定义样式的图形界面。要启动 **Style Builder**，请切换到\
  \ **Design** 视图并从菜单中选择 **Format | Style**。\n\n现在，查看 TropicalGreen 网站上的任何现有植物发布内容。样式已成功应用于发布内容。\n\
  \n\n\n## 为什么使用样式表的主题在 MCMS 站点上可能无法工作\n\n查看帖子的 HTML 源代码（在页面任意位置右键单击并选择查看源代码），并仔细查看主题生成的\
  \ <link> 标签。它应该类似于以下内容：\n\n```\n<link href=\"../App_Themes/Sunny/Sunny.css\"\n \
  \   type=\"text/css\" rel=\"stylesheet\"/>\n```\n\n<link> 标签中存储的 URL 是相对于模板文件的路径。在此示例中，前面的点点斜杠\
  \ (../) 字符表示 App_Themes 文件夹存储在当前页面所在的同一父文件夹中。在常规 Web 应用程序中，使用相对路径引用样式表可以正常工作。毕竟，如果查看文件结构，确实可以在建议的路径下找到样式表。\n\
  \n然而，在查看帖子时，我们并不是直接访问模板文件。例如，要查看芦荟帖子，我们请求 URL http://tropicalgreen/PlantCatalog/AloeVera.htm。浏览器不知道\
  \ MCMS ISAPI 过滤器已重写 URL，尝试通过将相对路径转换为绝对路径 http://tropicalgreen/PlantCatalog/../App_Themes/Sunny/Sunny.css\
  \ 来检索文件。\n\n然而，此路径不会解析为 CSS 文件的实际位置，因为 AloeVera.htm 页面上一级的文件夹是 tropicalgreen。此外，由于\
  \ App_Themes 文件夹存储在 Templates 项目目录中（参见以下屏幕截图），在 tropicalgreen（或根网站）下查找它将导致 HTTP\
  \ 404 错误。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_168_0.png)\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_169_0.png)\n\
  \n如果使用相对路径在访问样式表时会产生 HTTP 404 错误，那么样式是如何成功应用于帖子的呢？秘密在于 RobotMetaTag。在 MCMS 网站中，RobotMetaTag\
  \ 具有 RenderBaseHref 属性，当设置为 true（其默认值）时，会在页面的 <head> 标签之间生成一个 <base> 标签。搜索帖子生成的\
  \ HTML 源代码，你会找到如下所示的 <base> 标签：\n\n```\n<base href=\"http://tropicalgreen/tropicalgreen/Templates/Plant.aspx\"\
  >\n```\n\n在评估页面上的链接时，Web 浏览器会自动将所有相对链接与 <base> 标签的 href 属性中存储的值前缀（而不是页面请求的 URL），使得像\
  \ ../App_Themes/Sunny/Sunny.css 这样的相对路径变为 http://tropicalgreen/tropicalgreen/Templates/../App_Themes/Sunny/Sunny.css。\n\
  \n转换后的 URL 确实指向样式表，因此我们不会收到任何 HTTP 404 错误。\n\n默认情况下，RobotMetaTag 控件的 RenderBaseHref\
  \ 属性存储布尔值 true。因此通常会生成 <base> 标签，你无需担心样式表路径和其他相对链接无法访问的问题。然而，根据站点设置，可能存在生成 <base>\
  \ 不希望的特殊情况。\n\n考虑防火墙或代理将请求转发到内部 Web 服务器的主机场景。MCMS 生成的 <base> 标签的问题在于它包含完整的 URL，其中可能包含服务器名称，尤其是在关闭了“将频道映射到主机头”选项时。当内部服务器将页面返回给代理时，返回页面的\
  \ <base> 标签将包含内部服务器的名称，而不是浏览器中输入的站点域名。\n\n要模拟此场景，请再次查看帖子，但这次使用类似 http://servername/tropicalgreen/plantcatalog/aloevera.htm\
  \ 的 URL。注意，当你这样做时，服务器的名称会以如下方式存储在 <base> 标签中：\n\n```\n<base href=\"http://servername/tropicalgreen/tropicalgreen/Templates/Plant.aspx\"\
  >\n```\n\n> 当然，通常的 URL 省略了服务器名称，只会是 http://tropicalgreen/plantcatalog/aloevera.htm。但由于我们正在测试服务器名称如何渗入\
  \ base URL，因此在此练习中我们特意添加了它。\n\n除非用户的浏览器可以访问内部服务器，否则在尝试访问样式表等资源时很可能会收到 HTTP 404 错误。在这种情况下，必须禁用\
  \ RenderBaseHref 属性并找到替代解决方案。\n\n## 在 RenderBaseHref 属性被禁用时应用主题\n\n如果无法使用 <base>\
  \ 标签，我们需要有另一种方法来确保 App_Themes 文件夹使用正确的 URL 被访问。由于 ASP.NET 没有配置其生成主题文件夹 URL 的方式，我们需要在\
  \ ASP.NET 生成它之后修改此 URL。\n\n解决此问题的方法有很多。我们可以手动向每个应用了主题的模板文件添加代码。然而，这不仅繁琐，而且在多个地方重复代码也不是良好的编程实践。我们可以创建一个服务器端控件来封装代码并插入到需要它的每个模板文件中。同样，这要求控件的代码被复制到每个模板文件中——仍然有可能被遗忘，尤其是在创建新模板时。\n\
  \n解决方案是构建一个 HTTP 模块。这样，我们就可以保证所有页面都进行修正，而无需触及任何现有的模板文件。在页面发送到浏览器之前，HTTP 模块会将 <link>\
  \ 标签中存储的所有相对路径转换为不包含服务器名称的绝对路径。模块将查找如下样式表的 <link> 标签：\n\n```\n<link href=\"../App_Themes/Sunny/Sunny.css\"\
  \ type=\"text/css\" rel=\"stylesheet\"/>\n```\n\n转换过程后，<link> 标签将被渲染为：\n\n```\n\
  <link href=\"/tropicalgreen/App_Themes/Sunny/Sunny.css\" type=\"text/css\" rel=\"\
  stylesheet\"/>\n```\n\n## 创建 CorrectThemes HTTP 模块\n\n让我们创建纠正 <link> 标签中存储的 URL\
  \ 的 HTTP 模块。\n\n- 1. 在解决方案中添加一个新的 Visual C# 类库项目。将项目命名为 **TropicalGreenHttpModules**。\n\
  - 2. 删除向导创建的 `Class1.cs` 文件。我们不需要它。\n- 3. 添加项目所需的以下引用：\n```\nMicrosoft.ContentManagement.Publishing.dll\n\
  ```\n（库文件位于 `<install directory>\\Microsoft Content Management Server\\Server\\\
  bin\\` 目录中）。\n以及来自 `System` 命名空间的以下引用：\n```\nSystem.Web\n```\n- 4. 向 **TropicalGreenHttpModules**\
  \ 项目添加一个类文件。将新类文件命名为 **CorrectLinksInThemes.cs**。\n- 5. 在命名空间声明上方添加以下 using 语句：\n\
  ```\nusing System;\n. . . code continues . . .\n\nusing System.Web;\nusing System.Web.UI;\n\
  using System.Web.UI.HtmlControls;\nusing Microsoft.ContentManagement.Publishing;\n\
  \nnamespace TropicalGreenHttpModules\n{\n    . . . code continues . . .\n}\n```\n\
  - 6. 由于我们正在创建 HTTP 模块，类将实现 `IHttpModule` 接口。在以下代码中所示添加冒号后跟接口名称：\n```\npublic class\
  \ CorrectLinksInThemes : IHttpModule\n{\n}\n```\n- 7. IHttpModule 要求实现 Init() 和\
  \ Dispose() 方法。向 CorrectLinksInThemes 类文件添加以下代码：\n```\npublic class CorrectLinksInThemes\
  \ : IHttpModule\n{\n    public void Init(HttpApplication httpApp)\n    {\n    }\n\
  \n    public void Dispose()\n    {\n    }\n}\n```\n- 8. 由于页面中存储的所有 <link> 标签在页面呈现之前都会被分析，我们将在页面对象的\
  \ OnPreRender() 事件处理程序中编写代码。代码遍历页面头中找到的每个控件。如果控件是 <link> 标签，它会检查链接是否相对，并在必要时将其转换为绝对链接。在\
  \ Dispose() 方法下方添加 OnPreRender() 事件处理程序。\n```\npublic void OnPreRender(object sender,\
  \ EventArgs eventArgs)\n{\n    Page currentPage = sender as Page;\n    HtmlHead\
  \ pageHeader = currentPage.Header as HtmlHead;\n    if (pageHeader != null)\n  \
  \  {\n        foreach (Control control in pageHeader.Controls)\n        {\n    \
  \        HtmlLink link = control as HtmlLink;\n            if (link != null &&\n\
  \                VirtualPathUtility.IsAppRelative(link.Href))\n            {\n \
  \               link.Href = VirtualPathUtility.ToAbsolute\n                    (link.Href);\n\
  \            }\n        }\n    }\n}\n```\n- 9. 我们需要将之前编写的 OnPreRender() 事件处理程序注册到页面的\
  \ PreRender() 事件。一个好的位置是在当前\n\nHTTP 应用程序。OnPreRender() 事件处理程序仅在请求为 ChannelItem（例如频道渲染脚本或帖子）时才会被注册。我们将代码包裹在\
  \ try-catch 块中，因为如果在用户表单登录已过期时请求页面，可能会引发异常。在这种情况下，我们将忽略错误，因为页面不会被渲染。\n\n```csharp\n\
  public void OnPreRequestHandlerExecute(object sender, EventArgs e)\n{\n    HttpContext\
  \ ctx = ((HttpApplication)sender).Context;\n    IHttpHandler handler = ctx.Handler;\n\
  \n    // Only execute for ASP.NET page and master page\n    // http handler - not\
  \ for custom\n    // http handler or for the ASP.NET 2.0 handler to handle\n   \
  \ // embedded resource items.\n    // Check handler to see if it starts with \"\
  ASP.\"\n    if (handler.GetType().ToString().StartsWith(\"ASP.\"))\n    {\n    \
  \    try\n        {\n            if (CmsHttpContext.Current.ChannelItem != null)\n\
  \            {\n                ((System.Web.UI.Page)handler).PreRender +=\n   \
  \                 new EventHandler( this.OnPreRender );\n            }\n       \
  \ }\n        catch\n        {\n            // An exception may be raised if the\
  \ request is made\n            // in the middle of\n            // an expired forms\
  \ authentication login\n            // Just ignore this.\n        }\n    }\n}\n\
  ```\n\n10. 最后，我们在 HTTP 模块的 Init() 事件中，将 OnPreRequestHandlerExecute() 事件处理程序注册到当前\
  \ HttpApplication 的 PreRequestHandlerExecute 事件。\n\n```csharp\npublic void Init(HttpApplication\
  \ httpApp)\n{\n    httpApp.PreRequestHandlerExecute += new\n        EventHandler(this.OnPreRequestHandlerExecute);\n\
  }\n```\n\nHTTP 模块已完成。保存并构建项目。要将该模块添加到 **TropicalGreen** 项目中，请在 TropicalGreen 的 `web.config`\
  \ 文件中，在 `<httpModules>` 标签之间插入以下代码。\n\n```\n<add type=\"TropicalGreenHttpModules.CorrectLinksInThemes,\n\
  \    TropicalGreenHttpModules\" name=\"CorrectLinksInThemes\"/>\n```\n\n此外，将 **TropicalGreenHttpModules**\
  \ 项目（或 `TropicalGreenHttpModules.dll` 库）作为引用添加到 **TropicalGreen** 项目中。\n\n下次您查看同时应用了两种主题且\
  \ `RobotMetaTag` 的 `RenderBaseHref` 属性被禁用的帖子时，所有样式表都将被正确应用。查看 HTML 源代码，您会发现 HTTP\
  \ 模块已将所有相对链接更正为绝对链接。\n\n## 摘要\n\n我们已经了解了如何使用主题高效地管理 MCMS 网站的外观和感觉。主题由皮肤、层叠样式表和其他支持文件组成。皮肤和层叠样式表共同有效地将设计元素与代码分离。\n\
  \n虽然主题在大多数 MCMS 网站上都能很好地工作，但在 `RobotMetaTag` 的 `RenderBaseHref` 属性被禁用时，一些站点可能需要一些自定义。这是因为样式表的链接被渲染为相对链接。作为变通方法，可以构建自定义\
  \ HTTP 模块来将页面上的相对链接更正为绝对链接。\n\n# 6 身份验证控件和成员资格提供程序\n\n## 身份验证控件和成员资格提供程序\n\nMembership\
  \ Provider 模型是 ASP.NET 2.0 引入的新关键概念之一，它使开发利用第三方或自定义成员资格存储的 Web 应用程序变得更加容易。此外，ASP.NET\
  \ 2.0 随附了许多与角色成员资格相关的身份验证控件，极大地减少了在应用程序中实现 Forms Authentication 和相关功能所需的代码量。\n\n\
  MCMS 拥有自己的基于角色的授权和用户管理系统，无法扩展。然而，Membership Provider 模型和随附的控件可在 MCMS 应用程序中使用，以改进\
  \ Forms Authentication 的实现，并为“账户映射”场景提供更优雅的解决方案，在该场景中身份验证针对外部存储进行，并且账户映射到 Windows\
  \ 账户以用于 MCMS 授权。\n\n在本章中，我们首先将简要介绍 ASP.NET 2.0 身份验证控件，然后继续实现一个 MCMS Membership Provider，以支持在\
  \ MCMS 应用程序中使用身份验证控件。\n\n### 身份验证控件\n\nASP.NET 2.0 随附了七个与身份验证相关的复合控件，例如 Login 控件（提供实现\
  \ Forms Authentication 的标准用户界面）和 PasswordRecovery 控件（允许检索用户的密码）。这些控件可以在 Visual Studio\
  \ 2005 工具箱的 Login 选项卡中看到。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_176_0.png)\n\
  \n由于 MCMS 拥有自己的用户管理系统且不提供受支持的 API，因此只有其中三个控件可与 MCMS 应用程序一起使用：\n\n- `Login`：提供 Forms\
  \ Authentication 所需的用户界面。\n- `LoginStatus`：根据用户当前登录状态提供 **Login** 或 **Logout** 超链接。\n\
  - `LoginName`：显示当前已登录用户的名称。\n\n`LoginName` 控件可直接在 MCMS 应用程序中无修改使用，无论其身份验证模式如何，都可显示当前已登录用户的名称。然而，除非使用\
  \ Forms Authentication，否则 `LoginStatus` 控件没有实用目的，在这种情况下，可通过少量自定义代码使用它来启用用户登录和退出\
  \ MCMS 应用程序。\n\n`Login` 控件可用作手工编写必要代码以实现 MCMS 应用程序基于表单的身份验证的替代方案。然而，由于 MCMS 身份验证和授权系统，我们必须实现一个\
  \ Membership Provider 在幕后执行验证用户凭据的工作。通过使用这种方法，还可以操作来自 MCMS 身份验证和授权系统的结果，例如向返回的用户票据添加额外详细信息。\n\
  \n### 实现 MCMS Membership Provider\n\n为了支持 MCMS 应用程序，我们的 MCMS Membership Provider\
  \ 必须实现 ValidateUser() 方法，该方法执行 MCMS Forms Authentication。这是当用户从 Login 控件提交其凭据时将被调用的方法。以下示例显示了此类实现：\n\
  \n```csharp\npublic override bool ValidateUser(string strUsername,\n    string strPassword)\n\
  {\n    bool ValidUser = false;\n    CmsAuthenticationTicket Ticket =\n        CmsFormsAuthentication.AuthenticateAsUser(strUsername,\n\
  \            strPassword);\n\n    if (Ticket != null)\n    {\n        ValidUser\
  \ = true;\n    }\n\n    return ValidUser;\n}\n```\n\n如果身份验证成功，此代码将生成 MCMS 身份验证票据。我们现在可以直接调用\
  \ CmsFormsAuthentication.SetAuthCookie 来设置 cookie，但提供程序不是设置 cookie 的正确位置。ValidateUser()\
  \ 方法应仅验证提供的用户凭据是否有效。在提供程序中，我们也无法访问 Login 控件的属性，例如 RememberMeSet 复选框，该复选框使用户有机会决定\
  \ cookie 是否应持久化。\n\n设置身份验证 cookie 的正确位置是 Login 控件的 LoggedIn 事件。问题是 Membership Provider\
  \ 模型不允许我们将票据传回 Login 控件。为克服此限制，我们可以将 MCMS 票据添加到当前 HttpContext 的 Items 集合中：\n\n```csharp\n\
  public override bool ValidateUser(string strUsername,\n    string strPassword)\n\
  {\n    bool ValidUser = false;\n    CmsAuthenticationTicket Ticket =\n        CmsFormsAuthentication.AuthenticateAsUser(strUsername,\n\
  \            strPassword);\n\n    if (Ticket != null)\n    {\n        HttpContext.Current.Items.Add(\"\
  MCMSTicket\", Ticket);\n        ValidUser = true;\n    }\n\n    return ValidUser;\n\
  }\n```\n\nItems 集合是一个存储桶，可用于在单个请求内的不同代码部分之间传递各种对象——甚至在不同的 HttpModules 之间。HttpContext\
  \ Items 集合的生命周期是一个请求。我们现在可以在 Login 控件中使用由 Membership Provider 创建的 MCMS 票据。\n\n现在让我们为\
  \ MCMS 实现一个 Base Membership Provider 类。我们将通过创建新的 Class Library 项目而不是使用 App_Code\
  \ 文件夹来实现。一旦完成，它可以在多个 MCMS 应用程序中重复使用。\n\n通过实现基础 Membership Provider，我们可以将与 MCMS 身份验证和授权系统交互所需的代码与用于操作凭据格式或与外部身份验证系统交互的代码分离。\n\
