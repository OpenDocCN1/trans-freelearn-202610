- "# 4 导航控件\n\n开发网站导航通常会让开发人员陷入两难境地。Visual Studio 的早期版本没有提供任何即用的导航控件。开发人员必须在花费数小时从头构建控件或扩大项目预算购买成品软件之间做出选择。虽然互联网上可以下载免费控件，但它们并不总是可直接使用，开发人员仍需花费大量时间理解代码并对其进行定制以满足需求。\n\
  \n好消息是：ASP.NET 2.0 引入了一种全新的网站导航实现方式。ASP.NET 2.0 中包含三个强大的导航控件：\n\n- The `SiteMapPath`\
  \ control generates a series of links that connect to one another on a website,\
  \ for example, **Home > Plant Catalog > Aloe Vera**. It is the \"You Are Here\"\
  \ sign that tells visitors exactly where they are. It is also sometimes known as\
  \ a breadcrumb trail, and like the trail of breadcrumbs left by the fictional characters\
  \ Hansel and Gretel, it helps users find their way back from the main page.\n- The\
  \ `Menu` control can be configured to show static horizontal or vertical lists of\
  \ items. It can even be dynamic, showing and hiding sub-items when the cursor hovers\
  \ over an item.\n- The `TreeView` control provides a hierarchical representation\
  \ of the site. It contains a list of all items on the site nested in a tree. Users\
  \ can click to expand leaf nodes to reveal sub-nodes.\n\n上述所有列出的控件都可以通过站点地图驱动。你可以将站点地图视为构成网站结构的项目集合。通过以编程方式将频道和发布内容添加到站点地图，我们能够将这些控件平滑地集成到任何\
  \ MCMS 网站中，正如本章将看到的那样。\n\n## TropicalGreen 的导航\n\n在 Packt Publishing 出版的书籍 *Building\
  \ Websites with Microsoft Content Management Server*（ISBN 1-904811-16-7）中，我们设计了\
  \ TropicalGreen 以显示：\n\n- 一个水平菜单，包含以下项目：\n  - Home\n  - Help\n  - Site map\n- 一个垂直菜单，包含以下项目：\n\
  \  - Columns\n  - Gardens\n  - Plant catalog\n- 一个 SiteMapPath 控件（或面包屑导航）\n- 用于站点地图的\
  \ TreeView 控件\n- 摘要页面的列表\n\n让我们尝试使用 ASP.NET 2.0 中可用的控件重新创建此导航结构。本章结束时，TropicalGreen\
  \ 网站将包含以下屏幕截图中所示的每个元素：\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_116_0.png)\n\n\
  ## 站点地图和站点地图提供程序\n\n站点地图包含作为网站导航结构一部分的项目集合。这些项目通常以层次树状结构显示。在 MCMS 中，这通常是频道和发布内容的列表，有时也是库、资源和模板。最简单形式，站点地图可以是一个纯\
  \ XML 文件，存储节点列表，如下所示：\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<siteMap\
  \ xmlns=\"http://schemas.microsoft.com/AspNet/SiteMap-File-1.0\">\n    <siteMapNode\
  \ url=\"http://tropicalgreen/\" title=\"Home\"/>\n        <siteMapNode url=\"/PlantCatalog/\"\
  \ title=\"Plant Catalog\">\n        <siteMapNode url=\"/Gardens/\" title=\"Gardens\"\
  >\n            <siteMapNode url=\"/Gardens/Members/\" title=\"Members\"/>\n    \
  \    </siteMapNode>\n    . . . code continues . . .\n    </siteMapNode>\n</siteMapNode>\n\
  </siteMap>\n```\n\n在定义站点地图后，你可以将 SiteMapDataSource 添加到页面中，同时添加一个 Menu 控件，将站点地图数据源绑定到\
  \ Menu 控件，XML 文件的内容将被转换为菜单项。当然，XML 节点到菜单项的转换并非魔法。在幕后，SiteMapProvider（具体来说是 XmlSiteMapProvider）读取\
  \ XML 文件并以编程方式将每个节点加载到 SiteMapDataSource 中。\n\n虽然我们可以使用 XML 文件保存节点列表，但它只是网站结构的静态快照。当添加或删除新频道或页面时，文件必须相应更新。在\
  \ XML 文件中硬编码节点和链接在结构相对固定的网站上可能效果良好。然而，对于许多 MCMS 网站，其中频道和页面经常添加和删除，或者不同用户可能被允许查看不同的页面集，更动态的方法会更受欢迎。\n\
  \n由于 XmlSiteMapProvider 是随 ASP.NET 2.0 提供的唯一提供程序，我们需要构建一个自定义站点地图提供程序来从 MCMS 仓库读取数据。\n\
  \n自定义站点地图提供程序将使用 MCMS 发布应用程序编程接口（PAPI）从 MCMS 仓库检索频道和发布内容以形成站点地图。这种方法的优点是安全性\n\n\
  修剪会自动由 PAPI 提供，因为只会检索当前用户有权查看的项目。\n\n## 构建 MCMS 站点地图提供程序\n\n要构建自定义的 SiteMapProvider，我们将创建一个继承自基类\
  \ SiteMapProvider 的类并实现基类继承的四个方法：\n\n- The FindSiteMapNode() method returns a site\
  \ map node based on a given URL or GUID.\n- The GetChildNodes() method returns a\
  \ collection of nodes of a specified parent node.\n- The GetParentNode() method\
  \ returns the parent node of a specified child.\n- The GetRootNodeCore() method\
  \ returns the first node in the hierarchy.\n\n由于 TropicalGreen 站点的导航控件提供对频道项的链接，每个站点地图节点都映射到相应的频道项。尽管如此，您可以轻松修改方法以显示模板库项或资源库项。\
  \ 现在，让我们继续构建 MCMSSiteMapProvider 类。\n\n## MCMSSiteMapProvider 类\n\n为了保持简单，我们可以利用\
  \ ASP.NET 中的另一个新功能：App_Code 文件夹。 App_Code 文件夹还允许我们在无需重建网站的情况下添加功能。\n\n- 1. 首先，如果您尚未执行此操作，请将\
  \ App_Code ASP.NET 文件夹添加到 TropicalGreen 解决方案。右键单击项目并选择 添加 | ASP.NET 文件夹 | App_Code。\n\
  - 2. 在 App_Code 文件夹内创建一个名为 SiteMapProviders 的新子文件夹。\n- 3. 右键单击新创建的 SiteMapProviders\
  \ 文件夹并添加一个名为 MCMSSiteMapProvider.cs 的类文件。\n- 4. 代码需要使用以下代码片段中突出显示的命名空间中的方法；因此将其添加到类文件中。\
  \ 同时添加命名空间声明。\n\n```\nusing System;\nusing System.Data;\nusing System.Configuration;\n\
  using System.Web;\nusing System.Web.Security;\n```\n\n```\nusing System.Web.UI;\n\
  using System.Web.UI.WebControls;\nusing System.Web.UI.WebControls.WebParts;\nusing\
  \ System.Web.UI.HtmlControls;\nusing Microsoft.ContentManagement.Publishing;\n\n\
  namespace TropicalGreen\n{\n    public class MCMSSiteMapProvider\n    {\n      \
  \  . . . code continues . . .\n    }\n}\n```\n\n5. 由于没有可直接使用的与 MCMS 对象配合的 SiteMapProviders，自定义提供程序将继承自基类\
  \ SiteMapProvider 类。\n\n```\npublic class MCMSSiteMapProvider : SiteMapProvider\n\
  {\n    . . . code continues . . .\n}\n```\n\n6. 我们还将添加一个名为 rootPath 的私有变量来存储顶级频道的路径。\
  \ 对于 TropicalGreen，路径为 /Channels/tropicalgreen/。 在类声明中添加突出显示的代码。\n\n```\npublic\
  \ class MCMSSiteMapProvider : SiteMapProvider\n{\n    protected string RootChannel\
  \ = \"/Channels/tropicalgreen/\";\n\n    . . . code continues . . .\n}\n```\n\n\
  另外，我们可以将频道路径存储在 web.config 文件的 <appSettings> 部分中。这样可以使代码更易于在其他解决方案中重用，因为我们不必在路径更改时每次都重新编译代码。\n\
  \n7. 最后，删除类构造函数（代码如下）。它不是必需的。\n\n```\npublic MCMSSiteMapProvider()\n{\n    //\n\
  \    // TODO: Add constructor logic here\n    //\n}\n```\n\n## 实现 GetRootNodeCore()\
  \ 方法\n\nGetRootNodeCore() 方法返回层次结构中的第一个节点。在 TropicalGreen 站点的情况下，第一个节点是第一级频道 TropicalGreen\
  \ 的节点。我们已经将它的路径存储在类变量 rootChannel 中。我们使用 PAPI 中的 Searches.GetByPath() 方法返回 TropicalGreen\
  \ 频道的实例。将 GetRootNodeCore() 方法添加到类中。\n\n```\nprotected override SiteMapNode GetRootNodeCore()\n\
  {\n    Channel root = CmsHttpContext.Current.Searches.GetByPath\n        (RootChannel)\
  \ as Channel;\n    return GetSiteMapNodeFromChannelItem(root);\n}\n```\n\n请注意，在代码中，我们使用名为\
  \ GetSiteMapNodeFromChannelItem() 的方法基于频道项创建站点地图节点。站点地图节点有四个基本属性：\n\n- **键**：用于唯一标识节点的数值。我们将将其设置为频道项的\
  \ GUID。\n- **网址**：指定节点的地址，对于我们的站点将是频道项的 URL。\n- **标题**：指定用于显示节点的文本标签。我们检索频道项的显示名称并将其用于标题。\n\
  - **描述**：指定当鼠标放置在节点上时显示的工具提示内容。特别适用于为访问者提供有关链接后面页面的描述。\n\n从频道项，我们将基于前面列表中讨论的属性创建一个站点地图节点。将\
  \ GetSiteMapNodeFromChannelItem() 方法附加到类文件。\n\n```\nprotected SiteMapNode GetSiteMapNodeFromChannelItem(ChannelItem\
  \ ci)\n{\n    SiteMapNode smn = null;\n    if (ci != null)\n    {\n        smn =\
  \ new SiteMapNode(this, ci.Guid);\n        smn.Url = ci.Url;\n        smn.Title\
  \ = ci.DisplayName;\n        smn.Description = ci.Description;\n    }\n```\n\n```\n\
  return smn;\n}\n```\n\n## 实现 FindSiteMapNode() 方法\n\nFindSiteMapNode() 方法根据给定的 URL\
  \ 或 GUID 返回站点地图节点。我们将创建该方法的两个重载版本。\n\n第一个接受一个字符串，该字符串可以是 GUID 或 URL，并返回一个节点。为了检测我们正在处理\
  \ URL 还是 GUID，我们查看字符串的第一个字符。如果它以左大括号 ({) 开头，那么它一定是 GUID。\n\n从 GUID，我们使用 Searches.GetByGuid()\
  \ 方法获取相应的频道项。对于 URL，我们调用辅助函数 EnhancedGetByUrl()。它与 Searches.GetByUrl() 执行相同的任务，但包括我们稍后将看到的若干增强功能。\n\
  \n一旦我们获得了频道项，我们将使用 GetSiteMapNodeFromChannelItem() 方法构造一个站点地图节点对象。\n\n```\npublic\
  \ override SiteMapNode FindSiteMapNode(string urlOrGuid)\n{\n    ChannelItem ci\
  \ = null;\n    if (urlOrGuid.StartsWith(\"{\"))\n    {\n        ci = CmsHttpContext.Current.Searches.GetByGuid(urlOrGuid)\n\
  \            as ChannelItem;\n    }\n    else\n    {\n        ci = EnhancedGetByUrl(CmsHttpContext.Current,\
  \ urlOrGuid);\n    }\n\n    return GetSiteMapNodeFromChannelItem(ci);\n}\n```\n\n\
  第二个方法接受当前的 HttpContext 并返回代表当前正在访问的频道项的节点。\n\n```\npublic override SiteMapNode FindSiteMapNode(HttpContext\
  \ context)\n{\n    ChannelItem ci = CmsHttpContext.Current.ChannelItem;\n    return\
  \ GetSiteMapNodeFromChannelItem(ci);\n}\n```\n\n## 增强 Searches.GetByUrl() 方法\n\n\
  将频道名称映射到主机标头是 MCMS 企业版中一个有用的功能。它使多个网站能够托管在同一服务器上。启用后，根频道下方的顶级频道也将成为主机标头。例如，如果根频道下方的频道名为\
  \ `tropicalgreen`，则该频道的 URL 将变为 `http://tropicalgreen`，而不是 `http://localhost/tropicalgreen`。\n\
  \n问题是 `Searches.GetByUrl()` 方法在启用映射主机标头时不可靠。当 `Searches.GetByUrl()` 方法接收到例如顶级频道的\
  \ URL `http://tropicalgreen` 时，我们期望它返回 `tropicalgreen` 频道的实例。然而，它返回 null 对象。这是因为\
  \ `Searches.GetByUrl()` 方法存在一个问题，导致它期望输入 URL 为 `http://localhost/tropicalgreen`，无论是否启用了将频道名称映射到主机标头名称。\n\
  \n作为变通方法，我们将增强 `Searches.GetByUrl()` 方法。我们首先检查是否已启用映射主机标头功能。为此，我们查看根频道的 URL。如果根频道的\
  \ URL 为 `http://Channels/`（URL 包含根频道本身的名称），我们就知道频道已被映射到主机标头。\n\n如果已打开将频道名称映射到主机标头功能，我们将把\
  \ URL 转换为路径并使用 `Searches.GetByPath()` 方法获取频道项的实例。例如，如果 URL 为 `http://tropicalgreen/plantcatalog`，例程将其转换为频道的路径\
  \ `/Channels/tropicalgreen/plantcatalog`，并基于路径获取频道项的实例。将以下代码添加到类中：\n\n```\nprivate\
  \ bool MapChannelToHostHeaderEnabled(CmsContext ctx)\n{\n    return (ctx.RootChannel.UrlModePublished\
  \ == \"http://Channels/\");\n}\n\nprivate ChannelItem EnhancedGetByUrl(CmsContext\
  \ ctx, string Url)\n{\n    if (MapChannelToHostHeaderEnabled(ctx))\n    {\n    \
  \    string Path = HttpUtility.UrlDecode(Url);\n        Path = Path.Replace(\"http://\"\
  , \"/Channels/\");\n        if (!Path.StartsWith(\"/Channels/\"))\n        {\n \
  \           Path = \"/Channels/\" + HttpContext.Current.Request.Url.Host\n```\n\n\
  \n\n```\n        Path = Path;\n    }\n    if (Path.EndsWith(\".htm\"))\n    {\n\
  \        Path = Path.Substring(0, Path.Length - 4);\n    }\n    if (Path.EndsWith(\"\
  /\"))\n    {\n        Path = Path.Substring(0, Path.Length - 1);\n    }\n    return\
  \ (ChannelItem)(ctx.Searches.GetByPath(Path));\n    }\n    else\n    {\n       \
  \ return ctx.Searches.GetByUrl(Url);\n    }\n}\n```\n\n## 实现 GetParentNode() 方法\n\
  \nGetParentNode() 返回指定节点的父节点。对于 MCMS，父节点始终是当前频道项的父频道。获取父节点本质上是一个两步过程（如果排除隐藏根频道的步骤的话）。\n\
  \n- 1. 获取频道项的实例。\n- 2. 使用 ChannelItem.Parent 获取频道项的父频道。\n- 3. 从站点地图中隐藏根频道 /Channels/。\n\
  \n我们首先检索存储在节点键中的 GUID。借助该 GUID，我们使用 Searches.GetByGuid() 方法检索对应的频道项。\n\n```\npublic\
  \ override SiteMapNode GetParentNode(SiteMapNode node)\n{\n    // Get the current\
  \ channel item\n    ChannelItem ci =\n        CmsHttpContext.Current.Searches.GetByGuid(node.Key)\n\
  \        as ChannelItem;\n}\n```\n\n要获取父节点，我们只需检索 ChannelItem.Parent 属性返回的频道。当前频道项可能为空。例如，当页面状态为\
  \ New 时，它实际上还不存在，尽管我们有其 GUID，但无法获取其实例。在这种情况下，我们将父节点设置为当前频道。\n\n```\npublic override\
  \ SiteMapNode GetParentNode(SiteMapNode node)\n{\n    . . . code continues . . .\n\
  \n    // Variable for storing the parent channel item\n    ChannelItem parent =\
  \ null;\n\n    if (ci != null)\n    {\n        if (ci.Path != RootChannel)\n   \
  \     {\n            // Get the parent of the current channel item\n           \
  \ parent = ci.Parent;\n        }\n    }\n    else\n    {\n        // We’ve got a\
  \ null channel item, possibly because the\n        // page’s status is New\n   \
  \     // Set the parent to be the current channel\n        parent = CmsHttpContext.Current.Channel;\n\
  \    }\n}\n```\n\n一旦我们获得了父频道项的实例，我们就使用 GetSiteMapNodeFromChannelItem() 方法从频道项创建站点地图节点。\n\
  \n```\npublic override SiteMapNode GetParentNode(SiteMapNode node)\n{\n    . . .\
  \ code continues . . .\n    // Create a site map node based on the parent channel\
  \ item\n    // and return it\n    return GetSiteMapNodeFromChannelItem(parent);\n\
  }\n```\n\nGetParentNode() 方法尚未完成。如果现在运行它，你会发现它返回根节点 /Channels/。因此，像 SiteMapPath\
  \ 控件这样的控件会显示包含根频道 /Channels/ 的路径。\n\n将根频道从站点地图中隐藏起来是个好主意，因为它不是站点层次结构中可见的一部分。根节点可能被包含在站点地图中的情况有几种：\n\
  \n- 访问的节点就是根频道 `/Channels/` 本身。\n- 访问的节点是位于根频道中的页面或频道项。例如，它可以是主页 (`/Channels/Home.htm`)\
  \ 或顶级频道之一 (`/Channels/tropicalgreen/`)。因此，其父节点是根频道。\n\n在这两种情况下，我们需要将 GetParentNode()\
  \ 的返回值设为 null，以便在站点地图中隐藏根频道。按如下所示添加高亮代码：\n\n```\npublic override SiteMapNode GetParentNode(SiteMapNode\
  \ node)\n{\n    . . . code continues . . .\n\n    if (parent == null)\n    {\n \
  \       // The parent is null, possibly because we are somehow\n        // accessing\
  \ the root channel itself.\n        return null;\n    }\n    else {\n        //\
  \ Check to see if the parent channel is \"/Channels/\"\n        if(parent.Path ==\
  \ \"/Channels/\" && RootChannel != \"/Channels/\")\n        {\n            // We\
  \ don’t want \"Channels\" to be part of the site map\n            return null;\n\
  \        }\n        else\n        {\n            // Create a site map node based\
  \ on the parent channel item\n            // and return it\n            return GetSiteMapNodeFromChannelItem(parent);\n\
  \        }\n    }\n}\n```\n\n完整的方法如下所示：\n\n```\npublic override SiteMapNode GetParentNode(SiteMapNode\
  \ node)\n{\n    // Get the current channel item\n    ChannelItem ci = CmsHttpContext.Current.Searches.GetByGuid\n\
  \    (node.Key) as ChannelItem;\n\n    // Variable for storing the parent channel\
  \ item\n    ChannelItem parent = null;\n\n    if (ci != null)\n    {\n        if\
  \ (ci.Path != RootChannel)\n        {\n            // Get the parent of the current\
  \ channel item\n            parent = ci.Parent;\n        }\n    }\n    else\n  \
  \  {\n        // We’ve got a null channel item, possibly because the\n        //\
  \ page’s status is New\n        // Set the parent to be the current channel\n  \
  \      parent = CmsHttpContext.Current.Channel;\n    }\n\n    if (parent == null)\n\
  \    {\n        // The parent is null, possibly because we are somehow\n       \
  \ // accessing the root channel itself.\n        return null;\n    }\n    else\n\
  \    {\n        // Check to see if the parent channel is \"/Channels/\"\n      \
  \  if (parent.Path == \"/Channels/\" && RootChannel != \"/Channels/\")\n       \
  \ {\n            // We don’t want \"Channels\" to be part of the site map\n    \
  \        return null;\n        }\n        else\n        {\n            // Create\
  \ a site map node based on the parent channel item\n            // and return it\n\
  \            return GetSiteMapNodeFromChannelItem(parent);\n        }\n    }\n}\n\
  ```\n\n## 实现 GetChildNodes() 方法\n\nGetChildNodes() 方法返回指定节点的所有子项（子频道和帖子）的列表。如前所述，我们使用存储在节点键中的\
  \ GUID 来检索频道。然后我们遍历子频道和帖子的集合，并将它们作为节点添加到站点地图中。\n\n```\npublic override SiteMapNodeCollection\
  \ GetChildNodes(SiteMapNode node)\n{\n    SiteMapNodeCollection smnc = new SiteMapNodeCollection();\n\
  \n    Channel currentChannel =\n        CmsHttpContext.Current.Searches.GetByGuid(node.Key)\n\
  \        as Channel;\n\n    if (currentChannel != null)\n    {\n        ChannelCollection\
  \ cc = currentChannel.Channels;\n        cc.SortByDisplayName();\n\n        foreach\
  \ (Channel c in cc)\n        {\n            smnc.Add(GetSiteMapNodeFromChannelItem(c));\n\
  \        }\n\n        PostingCollection pc = currentChannel.Postings;\n        pc.SortByDisplayName();\n\
  \n        foreach (Posting p in pc)\n        {\n            smnc.Add(GetSiteMapNodeFromChannelItem(p));\n\
  \        }\n    }\n\n    return smnc;\n}\n```\n\n请注意，在遍历子频道和帖子之前，我们按显示名称对每个集合进行了排序。你可以轻松地通过调用其他排序函数（如\
  \ SortByStartDate() 或 SortBySortOrdinal()）或实现自定义排序算法来更改排序顺序。\n\n## 注册 SiteMapProvider\n\
  \nMCMSSiteMapProvider 已完成。在使用 SiteMapProvider 之前，我们需要在 web.config 文件中注册它。按如下所示在\
  \ <System.Web> 标签之间添加高亮代码：\n\n```\n<system.web>\n. . . code continues . . .\n\n\
  <siteMap defaultProvider=\"MCMSSiteMapProvider\" enabled=\"true\">\n    <providers>\n\
  \        <add name=\"MCMSSiteMapProvider\"\n            type=\"TropicalGreen.MCMSSiteMapProvider\"\
  />\n    </providers>\n</siteMap>\n</system.web>\n```\n\n## SiteMapPath 控件\n\nSiteMapPath\
  \ 控件显示一系列超链接，可返回到主页。它有时被称为面包屑导航，因为它类似于虚构人物汉塞尔和格雷特留下的面包屑痕迹。它是“您在此处”标志，告诉网站访问者他们所在的位置。例如，在查看植物页面时，SiteMapPath\
  \ 控件会显示 Home > Plant Catalog > Aloe Vera。\n\n在页面上放置 SiteMapPath 控件可使访问者轻松返回到植物目录或任何其他父节点。正如我们将看到的，将其包含在\
  \ MCMS 站点中也相当简单。\n\n在 ASP.NET 的早期版本（1.x）中，我们必须编写递归函数来获取通往根节点的父频道集合。有了我们之前创建的 SiteMapProvider\
  \ 和 SiteMapPath 控件，我们可以在不编写任何代码的情况下实现相同的结果。让我们看看它是怎么做到的。\n\n- 1. 首先，在 Visual Studio\
  \ 中打开第 3 章（使用母版页）中创建的 TropicalGreen.master 母版页。\n\n\n\n- 2. 切换到 **设计** 视图并从工具栏的\
  \ **导航** 部分拖动一个 **SiteMapPath** 控件，放置到写着 **SiteMapPath 控件的占位空间** 的文本标记上。然后删除该文本标记。\n\
  - 3. 保存文件。\n\n我们已将 `SiteMapPath` 控件添加到站点。要查看其在站点上的显示效果，请导航到任意页面。请注意，该控件会显示通向站点根频道的全部链接。\n\
  \n首页 > 植物目录 > 芦荟\n\n背后发生的情况是，`SiteMapProvider` 已向 `SiteMapPath` 控件提供了通向当前页面的父频道。在我们无需额外编程的情况下，这两个组件已协同工作生成了路径。\n\
  \n## 菜单控件\n\n无处不在的菜单控件几乎无需介绍。菜单为用户提供可供选择的链接列表。它们传统上水平放置在页面顶部，或垂直放置在页面的左侧或右侧。如果你构建过网站，很可能尝试在站点某处放置菜单，要么使用即用型小部件，要么使用一组脚本从头构建。无论哪种方式，都需要编写相当多的代码才能使菜单正常工作。\n\
  \n使用 ASP.NET 2.0 的菜单控件创建菜单轻而易举。让我们为 TropicalGreen 站点添加几个菜单。我们将首先为站点横幅构建一个静态水平菜单。之后，我们将尝试做一些更复杂的事情，并构建一个动态垂直菜单，该菜单以弹出形式显示子菜单。\n\
  \n## 构建水平菜单\n\n静态菜单易于构建。我们只需在母版页中硬编码链接即可完成任务。然而，当链接的 URL 发生变化或列表中添加新项目时，仍需要开发人员来执行此操作。此外，硬编码还意味着所有链接对站点的所有访客都可见。如果没有额外的编码，很难隐藏指向受限站点的链接。\n\
  \n因此，即使菜单是静态的，也最好让菜单项动态生成。在 ASP.NET 的早期版本（1.x）中，我们必须编写递归函数来生成每个菜单项。好消息是 `SiteMapProvider`\
  \ 已为我们完成了大部分工作。剩下的工作就是使用 `SiteMapDataSource` 控件将其连接到菜单控件。\n\n与 `SiteMapPath` 控件不同，菜单控件需要一个\
  \ `SiteMapDataSource` 控件来从 SiteMapProvider 绑定数据。让我们看看这是如何完成的。\n\n- 1. 在 **设计** 视图中打开\
  \ `tropicalgreen.master`，从工具箱的 **数据** 部分拖动一个 **SiteMapDataSource** 控件并将其放置在 Web\
  \ 表单底部。右键单击 **SiteMapDataSource** 控件并为其设置以下属性值：\n- 2. 从工具箱的 **导航** 部分拖动一个 **Menu**\
  \ 控件并将其放置在 `tropicalgreen.master` 文件中 **顶部菜单的占位空间** 文本标记旁边。会出现一个名为 **菜单任务** 的智能标记对话框。将\
  \ **选择数据源** 字段设置为 **SiteMapDataSourceTop**，将 **视图** 字段设置为 **静态**。\n- 3. 删除文本标记。为菜单控件设置以下属性值：\n\
  - 4. 保存文件。\n\n| 属性 | 值 |\n|---|---|\n| ID | SiteMapDataSourceTop |\n| SiteMapProvider\
  \ | MCMSSiteMapProvider |\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_130_0.png)\n\
  \n| 属性 | 值 |\n|---|---|\n| ID | TopMenu |\n| Orientation | Horizontal |\n| StaticDisplayLevels\
  \ | 2 |\n\n请注意，我们尚未编写任何一行代码！要查看水平菜单的实际效果，请查看任意植物页面。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_131_0.png)\n\
  \n![](img/18a0aa8d36427a4c069b30410f998b8e_131_1.png)\n\n菜单在首次加载时显示异常。所有菜单项，包括应隐藏的子菜单项都被显示。子菜单项只有在鼠标光标移过它们之后才会消失。我该怎么办？\n\
  \n菜单需要 XHTML 才能正确显示。在使用向导创建 MCMS Web 应用程序时，`web.config` 文件中添加了 `<xhtmlConformance>`\
  \ 标签。`<xhtmlConformance>` 标签包含一个名为 `mode` 的属性，该属性指定应用程序的 XHTML 渲染模式。MCMS 网站的默认 `mode`\
  \ 属性值为 `Legacy`，这意味着某些代码将被回退以符合 XHTML v1.1 渲染行为。将 `mode` 属性值更改为 `Strict` 或 `Transitional`，菜单控件才能正常工作。\n\
  \n水平菜单包含所有顶级频道项的列表。然而，虽然在某些网站上显示所有项目可能有效，但对 TropicalGreen 来说不行。我们要求水平菜单仅显示三个项目：\n\
  \n- **首页**\n- **帮助**\n- **站点地图**\n\n## 使用自定义属性区分顶部和右侧菜单项\n\n为了指定出现在顶部菜单中的项目，我们为每个顶级频道添加了自定义属性值。每个频道都有一个名为\
  \ `MenuLocation` 的自定义属性，其值可以是 `Top` 和 `Right` 中的一个。三个频道项 `TropicalGreen`、`Help`\
  \ 和 `SiteMap` 已配置为 `MenuLocation` 为 `Top`，如 **站点管理器** 中所示。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_132_0.png)\n\
  \n## MCMSSiteMapProviderTop 类\n\n我们需要修改 `SiteMapProvider` 以查看存储在 `MenuLocation`\
  \ 中的值。同时，它应继续为之前添加的 `SiteMapPath` 控件显示整个站点的导航结构。\n\n幸运的是，ASP.NET 2.0 支持使用多个站点地图。我们可以保留第一个\
  \ `SiteMapProvider` 不变，并创建第二个派生自它的提供程序。让我们创建一个名为 `MCMSSiteMapProviderTop` 的第二个 `SiteMapProvider`，它仅包含\
  \ `MenuLocation` 自定义属性值为 Top 的频道。\n\n- 1. 在 `\\App_Code\\SiteMapProviders` 文件夹中添加一个名为\
  \ `MCMSSiteMapProviderTop.cs` 的类文件。\n- 2. 添加突出显示的命名空间以及命名空间声明。\n\n```\nusing System;\n\
  using System.Data;\nusing System.Configuration;\nusing System.Web;\nusing System.Web.Security;\n\
  using System.Web.UI;\nusing System.Web.UI.WebControls;\nusing System.Web.UI.WebControls.WebParts;\n\
  using System.Web.UI.HtmlControls;\nusing Microsoft.ContentManagement.Publishing;\n\
  \nnamespace TropicalGreen\n{\n    public class MCMSSiteMapProviderTop\n    {\n \
  \       . . . code continues . . .\n    }\n}\n```\n\n3. 我们不会从头重建 SiteMapProvider。由于我们之前创建的\
  \ MCMSSiteMapProvider 类中已编写了大部分代码，我们只需继承它即可。\n\n```\npublic class MCMSSiteMapProviderTop\
  \ : MCMSSiteMapProvider\n{\n    . . . code continues . . .\n}\n```\n\n4. 我们需要修改\
  \ GetChildNodes() 方法，使其查看每个频道 MenuLocation 自定义属性中存储的值。只有属于顶部菜单的频道才会被添加到站点地图。\n\n\
  ```\npublic override SiteMapNodeCollection GetChildNodes(SiteMapNode node)\n{\n\
  \    SiteMapNodeCollection smnc = new SiteMapNodeCollection();\n\n    Channel currentChannel\
  \ =\n        CmsHttpContext.Current.Searches.GetByGuid(node.Key) as Channel;\n\n\
  \    if (currentChannel != null)\n    {\n        ChannelCollection cc = currentChannel.Channels;\n\
  \        cc.SortByDisplayName();\n\n        foreach (Channel c in cc)\n        {\n\
