  \ 菜单中选择 **生成网站**。\n\n我们现在可以看到显示名称显示在 Internet Explorer 标题栏中以及 ASP.NET `Literal`\
  \ 控件中。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_113_0.png)\n\n## 摘要\n\n我们已经介绍了\
  \ ASP.NET 2.0 主页面的基础知识，创建了第一个 MCMS 主模板，并看到了它们为 MCMS 开发人员提供的众多好处，包括大大增强的设计时体验和消除标记重复。通过使用主页面，你可以强制执行设计一致性，减少代码，并在开发\
