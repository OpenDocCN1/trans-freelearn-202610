  \ TropicalGreen 母版页！\n\n## 基于母版页创建 MCMS 模板文件\n\n现在是时候基于我们刚刚创建的主模板创建 MCMS 模板文件了。我们将创建一个植物模板，该模板将在\
  \ TropicalGreen 网站内用于创建有关植物的事实表帖子。\n\n事实表是爱好者了解有关某些植物的更多信息的资源。俱乐部成员都是热衷的园丁。他们经常与\
