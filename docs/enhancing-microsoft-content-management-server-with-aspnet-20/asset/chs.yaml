  \n现在让我们基于抽象类实现一个简单的 MCMS 成员资格提供程序，用于 Windows 账户，它在调用基类中的 ValidateUser() 方法之前仅正确格式化用户名。\n\
  \n- 1. 右键单击 **MCMSMembershipProviders** 项目并点击 **添加**，然后点击 **新建项目...**。在 **添加新项目**\
