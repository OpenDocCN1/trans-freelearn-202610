  \n## The TreeView Control\n\nTreeView 控件\n\nThe TreeView control provides a hierarchical\
  \ view of all items on the site. It is often used in site maps or as an alternative\
  \ to the menu control. TreeViews are popular because they are intuitive to use.\
  \ Most users would instinctively know how to expand and collapse folders to get\
  \ content.\nTreeView 控件提供站点上所有项的层次视图。它通常用于站点地图或作为菜单控件的替代方案。TreeView 很受欢迎，因为它们使用直观。大多数用户会本能地知道如何展开和折叠文件夹以获取内容。\n\
  \nLet’s add a page that uses the TreeView control. We will use it to display a graphical\
  \ view of the entire site map and link it to the Site Map link in the top horizontal\
  \ menu item. Here’s how the completed tree will look when done. Don’t worry about\
  \ the look and feel of the tree for now; we will spice it up with colors and images\
  \ in the next chapter on themes.\n让我们添加一个使用 TreeView 控件的页面。我们将使用它来显示整个站点地图的图形视图，并将其链接到顶部水平菜单项中的站点地图链接。完成后树将如下所示。暂时不用担心树的样式和外观；我们在下一章主题中会用颜色和图像对其进行美化。\n\
  \n![](img/18a0aa8d36427a4c069b30410f998b8e_139_0.png)\n\nThe first cut of our site\
  \ map loads all nodes into the tree at once. In a later section, we will show how\
  \ nodes may be populated on demand, when the parent node is expanded.\n我们站点地图的第一个版本会一次性将所有节点加载到树中。在后面的部分，我们将展示如何在父节点展开时按需填充节点。\n\
  \n## The Site Map Page\n\n站点地图页面\n\nLet’s create a channel-rendering script for\
