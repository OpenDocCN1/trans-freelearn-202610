  - 2. 修改命名空间声明为：\n  `TropicalGreen.MCMSMembershipProviders`\n- 3. 修改类声明为：\n  `public\
  \ class McmsWindowsMembershipProvider : MCMSMembershipProviderBase`\n- 4. 在 `McmsWindowsMembershipProvider`\
  \ 类中实现以下内容：\n\npublic override bool ValidateUser\n    (string strName, string strPassword)\n\
  {\n    string strLogin = \"WinNT:///\" + strName.Replace(\"\\\\\", \"/\");\n   \
  \ return base.ValidateUser(strLogin, strPassword);\n}\n\n> 为简洁起见，此示例代码不包含任何输入验证或异常处理，并假设\
  \ `strName` 的格式为 `MachineOrDomainName\\username`。对于生产应用程序，我们将实现异常处理和输入验证。\n\n5.\
  \ 保存并构建 **MCMSMembershipProviders** 项目。\n\n## 使用 MCMS 成员资格提供程序\n\n现在我们已经创建了 MCMS\
  \ 成员资格提供程序，需要将其注册到我们的 Tropical Green MCMS 应用程序中。\n\n- 1. 右键单击 **TropicalGreen**\
  \ 网站并点击 **添加引用...**\n- 2. 在 **添加引用** 对话框中，点击 **项目** 选项卡。\n- 3. 点击 **MCMSMembershipProviders**\
  \ 并点击 **确定**。\n- 4. 打开 `web.config` 文件。\n\n5. 在现有的 `<authentication />` 标签正下方添加以下部分：\n\
  \n<membership defaultProvider=\"McmsWindowsMembershipProvider\" userIsOnlineTimeWindow=\"\
  30\">\n  <providers>\n    <add name=\"McmsWindowsMembershipProvider\"\n        \
  \ type=\"TropicalGreen.MCMSMembershipProviders.McmsWindowsMembershipProvider\"\n\
  \         applicationName=\"/\" />\n  </providers>\n</membership>\n\n> 请注意，`<add>`\
  \ 元素的 `type` 属性需要在 一行中输入，且不能有空格或换行。上面的格式仅用于打印。\n\n\n\n6. 修改身份验证部分以使用表单身份验证：\n\n\
  ```\n<authentication mode=\"Forms\">\n  <forms loginUrl=\"Login.aspx\" />\n</authentication>\n\
  ```\n\n## 使用登录控件创建登录页面\n\n现在让我们继续实现一个登录页面，允许用户登录，该页面将使用新的 ASP.NET 2.0 登录控件。\n\n\
  - 1. 右键单击 **TropicalGreen** 网站，然后单击 **添加新项**。\n- 2. 选择 **Web Form** 图标，在 **Name**\
  \ 文本框中输入 **Login.aspx** 并单击 **添加**。确保未选中 **选择母版页** 复选框。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_185_0.png)\n\
  \n> 将 `Login` 控件添加到母版页是可行的。但是如果母版页包含与 PAPI 交互的代码（例如导航控件或发布属性），则您的 MCMS 安装需要启用访客访问。此类实现仅适用于使用表单身份验证的混合创作和只读托管场景。\n\
  \n- 3. 切换到 **设计** 视图。\n- 4. 从工具箱 **Login** 选项卡拖动 **Login** 控件到设计表面。\n\n## 身份验证控件和成员资格提供程序\n\
  \n![](img/18a0aa8d36427a4c069b30410f998b8e_186_0.png)\n\n- 5. 如有需要，使用登录控件的自动格式任务选择格式方案。\n\
  \n![](img/18a0aa8d36427a4c069b30410f998b8e_186_1.png)\n\n- 6. 单击登录控件（Login1），然后在属性窗口中单击事件图标（闪电符号）。\n\
  \n![](img/18a0aa8d36427a4c069b30410f998b8e_187_0.png)\n\n- 7. 双击 LoggedIn 事件以添加\
  \ Login1_LoggedIn 事件处理程序并在代码视图中跳转到它。\n- 8. 添加以下 using 语句：\n\n```\nusing Microsoft.ContentManagement.Web.Security;\n\
  ```\n\n- 9. 在 Page_Load 方法正下方实现以下内容：\n\n```\nprotected void Login1_LoggedIn(object\
  \ sender, EventArgs e)\n{\n    Login myLogin = sender as Login;\n\n    if (HttpContext.Current.Items.Contains(\"\
  MCMSTicket\"))\n    {\n        CmsAuthenticationTicket Ticket =\n            HttpContext.Current.Items[\"\
  MCMSTicket\"]\n            as CmsAuthenticationTicket;\n        CmsFormsAuthentication.SetAuthCookie(Ticket,\n\
  \            false, Login1.RememberMeSet);\n    }\n}\n```\n\n- 10. 从“生成”菜单中选择“生成网站”。\n\
  \n现在我们已完成登录页面，可以继续在 Internet Explorer 中通过浏览 http://localhost/tropicalgreen 来测试功能。\n\
  \n![](img/18a0aa8d36427a4c069b30410f998b8e_188_0.png)\n\n- 11. 输入用户名和密码并单击 **登录**。请记住以\
  \ **MachineOrDomainName\\username** 的格式输入用户名。\n- 12. 如果凭据正确，您将登录并被带到 Tropical Green\
  \ 主页。否则，`Login` 控件中将显示一条消息。\n\n## 使用 LoginStatus 和 LoginName 控件\n\n现在我们有了登录页面，可以使用\
  \ `LoginStatus` 和 `LoginName` 控件为模板提供额外的成员资格相关功能。让我们继续将这些控件添加到我们的母版页。\n\n- 1. 在\
  \ **设计** 视图中打开 `TropicalGreen.master`。\n- 2. 从工具箱的 **Login** 选项卡拖动 **LoginStatus**\
  \ 控件到右侧表格单元格中，位于现有菜单控件 (**MenuRight**) 之上。\n- 3. 单击 `LoginStatus` 控件 (**LoginStatus1**)\
  \ 和 **属性** 窗口中的事件图标。\n- 4. 双击 **LoggedOut** 事件以添加 `Login1_LoggedOut` 事件处理程序并在 **代码**\
  \ 视图中跳转到它。\n- 5. 添加以下 using 语句：\n\n```\nusing Microsoft.ContentManagement.Web.Security;\n\
  ```\n\n- 6. 在 `Page_Load` 方法正下方实现以下内容：\n\n```\nprotected void LoginStatus1_LoggedOut(object\
  \ sender, EventArgs e)\n{\n    CmsFormsAuthentication.SignOut();\n}\n```\n\n- 7.\
  \ 保存您的工作，然后从 **生成** 菜单中选择 **生成网站**。\n\n我们现在可以通过登录我们的网站来测试 `LoginStatus` 控件：\n\n\
  ![](img/18a0aa8d36427a4c069b30410f998b8e_189_0.png)\n\n## 身份验证控件和成员资格提供程序\n\n当我们单击注销链接时，我们将从\
  \ MCMS 注销并返回到登录页面。如果在我们的 MCMS 安装上启用了访客访问，则 LoginStatus 控件将显示登录链接。\n\n现在让我们继续向母版页添加\
  \ LoginName 控件：\n\n- 1. 在 Design 视图中打开 TropicalGreen.master。\n- 2. 从 Login 选项卡的工具箱拖动\
  \ LoginName 控件到右侧表格单元格中，位于现有 LoginStatus 控件之上。\n- 3. 切换到源视图。\n- 4. 在 <asp:LoginName\
  \ /> 元素之后添加一个不间断空格：\n- 5. 保存您的工作，然后从生成菜单中选择生成网站。\n\n```\n<asp:LoginName ID=\"LoginName1\"\
  \ runat=\"server\"/>\n<br/>\n```\n\n现在当我们登录时，可以看到当前登录用户的名称：\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_190_0.png)\n\
  \n我们可以使用上一章中详细介绍的皮肤轻松增强 LoginStatus 和 LoginName 控件的外观和感觉。\n\n## 支持自定义身份验证方案\n\n\
  到目前为止，我们已经了解了如何通过为 Windows 帐户创建 MCMS 成员资格提供程序并将其与表单身份验证一起使用来使用新的 ASP.NET 2.0 登录控件。也可以使用相同的方法为“帐户映射”场景提供更优雅的解决方案，在该场景中身份验证针对外部用户存储进行。\n\
  \n例如，假设我们需要使用 Active Directory 应用程序模式 (ADAM) 进行身份验证，我们可以通过重写 ValidateUser() 方法基于我们的\
  \ MCMSMembershipProviderBase 类实现 ADAM 成员资格提供程序：\n\n```\nusing System.DirectoryServices;\n\
  ... Code Continues ...\npublic override bool ValidateUser(string strName, string\
  \ strPassword)\n{\n    // the LDAP server to connect to\n    string strLdapServer\
  \ = \"LDAP://localhost:389/\";\n    // the DN of the OU containing the user\n  \
  \  string strLdapObj = \"OU=MCMSUsers,O=TropicalGreen\";\n    // the DirectoryEntry\
  \ property to validate\n    string strDECheck = \"MCMSUsers\";\n    // the DN of\
  \ the user we are connecting as\n    string strBindName = \"CN=\" + strName + \"\
  ,\" + strLdapObj;\n    // the Windows Username format for passing to ValidateUser\n\
  \    string strWindowsUser = \"WinNT://webdev/\" + strName;\n\n    try\n    {\n\
  \        // Connect to ADAM using LDAP AuthN...\n        DirectoryEntry ent = new\
  \ DirectoryEntry(strLdapServer +\n            strLdapObj, strBindName,\n       \
  \     strPassword, AuthenticationTypes.None);\n\n        // We must bind to perform\
  \ authentication\n        if ((string)ent.Properties[\"name\"].Value == strDECheck)\n\
  \        {\n            // LDAP AuthN succeeded, so perform Windows\n          \
  \  // AuthN to setup a MCMS context...\n            return base.ValidateUser(strWindowsUser,\
  \ strPassword);\n        }\n        // LDAP AuthN failed, so return a false\n  \
  \      return false;\n    }\n    catch (Exception)\n    {\n        //LDAP AuthN\
  \ failed, so return a false\n        return false;\n    }\n}\n```\n\nActive Directory\
  \ 应用程序模式 (ADAM) 是一个独立的 LDAP 3 目录服务。上面的示例假定 ADAM 安装在与 MCMS 相同的机器上，已配置为允许不安全操作，MCMS\
  \ 用户存储在名为 MCMSUsers 的组织单位中，并且密码在 ADAM 和 Active Directory 或本地安全帐户 (SAM) 数据库中相同。\n\
  \n上面的示例可以扩展以创建 Windows 和 ADAM 用户帐户，并为最终用户提供附加功能，例如密码重置。但是，仍然没有受支持的机制来管理 MCMS 角色组成员资格。一个合适的折中方案是为每个\
  \ MCMS 角色组创建一个 Windows 组。然后使用站点管理器将 Windows 组添加到 MCMS 角色组，并且用户可以以编程方式添加到 Windows\
  \ 组。\n\n## 摘要\n\n我们已经介绍了如何通过为 Windows 帐户创建 MCMS 成员资格提供程序并将其与表单身份验证一起使用来使用新的 ASP.NET\
  \ 2.0 登录控件和成员资格提供程序模型。我们还了解了哪些控件对 MCMS 应用程序有用以及如何将它们与我们的 MCMS 应用程序集成。我们还看到了如何通过为外部身份验证系统开发成员资格提供程序来利用这些\
  \ ASP.NET 2.0 功能来增强“帐户映射”场景。\n\n\n\n# 7 如何操作、技巧和窍门\n\n## 如何操作、技巧和窍门\n\nASP.NET 2.0\
  \ 引入了许多令人兴奋的新工具。在本章中，我们汇总了一些可用于增强您网站的技巧：\n\n- **技巧 #1：如何执行跨页回发**：ASP.NET 2.0 引入了一种从页面到页面传递数据的新方法。过去所有表单都将数据回发给自身，现在您可以指定一个替代表单来接收数据。在本技巧中，我们将介绍如何实现跨页回发，以及使其在\
  \ MCMS 页面上成功实现所需的工作区。\n- **技巧 #2：如何实现广告轮播器**：虽然广告轮播器在早期版本的 ASP 和 ASP.NET 中就已存在，但随\
  \ ASP.NET 2.0 提供的最新版本具有以编程方式访问数据源的能力。在本技巧中，我们将构建一个服务器控件，展示如何将广告轮播器控件直接与 MCMS 资源库集成。\n\
  - **技巧 #3：关于 Microsoft Office SharePoint Server 2007 的注意事项**：为即将发布的 Office SharePoint\
  \ Portal Server 做准备，我们将介绍一些应考虑的事项，以便使代码迁移更轻松。\n\n## 技巧 #1：如何执行跨页回发\n\n早在 ASP.NET\
  \ 1.x 中，Web 表单设计为仅向自身提交信息（或回发）。这样做提供了在页面本身内执行服务器端处理的便利。按钮点击、页面加载和表单提交等事件可以从页面的代码隐藏文件中处理。然而，由于表单只能回发到自身，跨页面共享数据变得棘手且混乱。\n\
  \nASP.NET 2.0 为 Button、LinkButton 和 ImageButton 控件引入了 PostBackUrl 属性。有了 PostBackUrl\
  \ 属性，开发人员现在可以将回发数据发送到站点内的任何 Web 表单。此功能在处理共享数据或相互交互的多个 Web 表单时特别有用。\n\n在本技巧中，我们将介绍\
  \ PostBackUrl 功能以及使其在 MCMS 站点上正确工作所需的重要解决方法。以下是我们将构建的内容。我们将首先创建一个接受用户输入的页面。接下来，我们将添加一个按钮，其\
  \ PostBackUrl 属性设置为另一个页面。之后，我们将构建按钮 PostBackUrl 属性指定的页面，并对其进行编程以接受来自第一个页面的输入。最后，我们将介绍\
  \ PostBackUrl 属性在 MCMS 站点上正常工作所需的解决方法。\n\n### 在页面之间传递数据\n\n在页面之间传递数据的常见场景是在所有帖子上设置搜索输入字段，或有一个专门的搜索页面，其中包含用于输入关键字和其他条件的字段。输入的搜索条件可以提交到单独的页面，该页面执行搜索并显示结果。\n\
  \n或者您可能有一个无处不在的向导式对话框，类似于 Amazon 或 eBay 等流行在线商店中的对话框。向导将任务（例如结账购物车中的商品）分解为一系列单独的步骤。购物车中的商品列表、用户名、收货地址和其他详细信息会在页面之间传递，直到交易最终完成。\n\
  \n解决此问题的一种方法是將向导的所有部分放在单个 Web 表单中。这些部分通常由面板或表格管理。随着用户完成任务，他或她只能看到页面的一个部分。与当前步骤无关的部分会被隐藏。在这种方式下，用户永远不会离开页面。然而，这种方法的最大缺点是，随着部分数量和复杂性的增加，页面变得越来越难以维护。\n\
  \n或者，您可以调用 Server.Transfer()，它接受一个输入参数，指示在从一个页面定向到另一个页面时是否应保留状态和输入字段的值。例如，在 Page1.aspx\
  \ 中，我们可以按如下方式调用 Page2.aspx：\n\n```\nServer.Transfer(\"Page2.aspx\", true);\n```\n\
  \n通过将第二个布尔参数设置为 true，所有表单值的状态将被传递到 Page2.aspx。从 Page2.aspx，我们可以使用 Request.Form 集合检索输入字段值：\n\
  \n```\nstring myText = Request.Form[\"MyText\"];\n```\n\n然而，`Server.Transfer()`\
  \ 有几个缺点。首先，地址栏上的 URL 从页面到页面保持不变，这可能不是理想的。更重要的是，`Server.Transfer()` 不能与 MCMS 页面结合使用，因为它会绕过\
  \ ISAPI 过滤器。\n\n另一种解决方案是使用查询字符串传递整个信息块。然而，查询字符串也有一些限制。不仅长的查询字符串会创建不友好的 URL，值还会暴露在浏览器的地址栏中，给用户机会更改其值，导致应用程序行为异常。此外，如果长度超过查询字符串的最大允许长度，数据可能会在传输过程中丢失。\n\
  \n您甚至可以将数据存储在会话变量或数据库表中。虽然这些方法有效，但实现成本高昂，并可能导致性能问题。例如，会话对象通常存储在服务器的内存中。维护数千名同时用户的会话状态可能会占用大量内存——如果管理不当可能会导致网站崩溃。\n\
  \n鉴于如此多的陷阱和注意事项，那么我们应如何从一个页面向另一个页面传递数据呢？按钮控件中的新 `PostBackUrl` 属性提供了一个有吸引力的替代方案。无需在部分或查询字符串、会话对象或数据库表等中间存储位置管理页面的状态，我们可以直接将数据发布到另一个表单。让我们看看它是如何实现的。\n\
  \n### “订购植物”向导\n\n为了演示 `PostBackUrl` 属性的工作方式，我们将创建一个向导，引导访问者完成从 TropicalGreen 社会社订购植物的过程。为了保持简单，我们将只有两个屏幕。\n\
  \n在第一个屏幕中，访问者将输入姓名和地址。他们还将从下拉列表中选择一种植物。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_195_0.png)\n\
  \n第二个屏幕将打印访问者在第一个屏幕中输入的值，并提供一个按钮来确认订单。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_196_0.png)\n\
  \n### 订购页面\n\n让我们开始创建订单页面。\n\n- 1. 首先，在 TropicalGreen 解决方案中添加一个名为 Forms 的文件夹。\n\
  - 2. 在 Forms 文件夹中添加一个 Web 表单。将表单命名为 Order.aspx 并应用之前创建的 tropicalgreen.master 主页。\n\
  - 3. 切换到源视图。在 <asp:Content> 标签之间添加以下代码。该表格保存了稍后将添加的控件的布局。\n\n```\n<h1>Order a Plant</h1>\n\
  <table>\n    <tr>\n        <td>\n            First Name:\n        </td>\n      \
  \  <td>(TextBox for the First Name)</td>\n    </tr>\n    <tr>\n        <td>\n  \
  \          Last Name:\n        </td>\n        <td>(TextBox for the Last Name)</td>\n\
  \    </tr>\n    <tr>\n        <td>\n            Shipping Address:\n        </td>\n\
  \        <td>(TextBox for the Shipping Address)</td>\n    </tr>\n    <tr>\n<td>Select\
  \ a Plant</td>\n<td>(Dropdown list for the selection of plants)</td>\n</tr>\n<tr>\n\
  <td colspan=\"2\" align=\"right\">\n(Button to Check Out)\n</td>\n</tr>\n</table>\n\
  ```\n\n4. 我们将为客户提供输入其名字、姓氏和收货地址的字段，以及他或她想要订购的植物。切换回设计视图。从工具箱的标准部分拖动三个 TextBoxes、一个\
  \ DropdownList 和一个 Button 控件，并将其放置如下图所示：\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_197_0.png)\n\
  \n为控件设置以下属性值：\n\n| 控件 | 属性 | 属性值 |\n|---|---|---|\n| TextBox | ID | txtFirstName\
  \ |\n| TextBox | ID | txtLastName |\n| TextBox | ID | txtAddress |\n| DropDownList\
  \ | ID | ddlPlant |\n| Button | ID | btnOrder |\n|  | Text | Order |\n|  | PostBackUrl\
  \ | /tropicalgreen/forms/checkout.aspx |\n\n\n\n请注意，我们已将按钮的 PostBackUrl 属性设置为指向名为\
  \ checkout.aspx 的页面（我们将在下一节中构建该页面）。而不是让结果回发到当前页面，数据将被发送到 checkout.aspx。\n\n- 5.\
  \ 在表单上任意位置双击以打开代码隐藏文件。在页面顶部添加高亮的命名空间。\n\n```\nusing System;\n... code continues\
  \ ...\nusing Microsoft.ContentManagement.Publishing;\n\npublic partial class Forms_Order\
  \ : System.Web.UI.Page\n{\n    ... code continues ...\n}\n```\n\n- 6. 在 Page_Load()\
  \ 事件处理程序中，我们将使用目录中所有可用的植物列表填充下拉列表。按如下所示添加代码：\n\n```\nprotected void Page_Load(object\
  \ sender, EventArgs e)\n{\n    // Get the current context\n    CmsHttpContext cmsContext\
  \ = CmsHttpContext.Current;\n\n    // Get an instance of the plant catalog\n   \
  \ Channel plantCatalog = cmsContext.Searches.GetByPath(\n        \"/Channels/tropicalgreen/PlantCatalog\"\
  ) as Channel;\n\n    if (plantCatalog != null)\n    {\n        // Get a collection\
  \ of all postings in the plant catalog\n        // channel\n        PostingCollection\
  \ plants = plantCatalog.Postings;\n\n        // Sort the postings by display name\n\
  \        plants.SortByDisplayName();\n\n        // Populate the dropdown with a\
  \ list of plants from the\n        // catalog\n        foreach (Posting plant in\
  \ plants)\n        {\n            ListItem li =\n                new ListItem(plant.DisplayName,\
  \ plant.DisplayName);\n            ddlPlant.Items.Add(li);\n        }\n    }\n}\n\
  ```\n\n- 7. 为了在结账过程中更轻松地检索字段值，我们将创建属性来返回在 `txtFirstName`、`txtLastName` 和 `txtAddress`\
  \ 文本框中输入的文本。我们还将添加一个属性来返回从下拉列表中选择的植物名称。将以下代码直接附加在 `Page_Load()` 事件处理程序下方。\n\n```csharp\n\
  // First Name\npublic string FirstName\n{\n    get\n    {\n        return txtFirstName.Text.Trim();\n\
  \    }\n}\n\n// Last Name\npublic string LastName\n{\n    get\n    {\n        return\
  \ txtLastName.Text.Trim();\n    }\n}\n\n// Address\npublic string Address\n{\n \
  \   get\n    {\n        return txtAddress.Text.Trim();\n    }\n}\n\n// Plant\npublic\
  \ string Plant\n{\n    get\n    {\n        return ddlPlant.SelectedItem.Value.Trim();\n\
  \    }\n}\n```\n\n## 结账屏幕\n\n结账页面将接收在订购屏幕中输入的值并在屏幕上显示它们。当用户对信息感到满意时，他或她点击 **结账**\
  \ 按钮，然后会出现一条消息，告知他或她订单已成功下达。\n\n- 1. 在 `Forms` 文件夹中添加一个 Web 表单。将表单命名为 `checkout.aspx`\
  \ 并将 `tropicalgreen.master` 设置为主页。\n- 2. 在 **源代码** 视图中，在 `<asp:Content>` 标签之间添加以下代码：\n\
  \n```\n<h1>Checkout</h1>\n<table>\n    <tr>\n        <td>First Name:</td>\n    \
  \    <td>(Space for First Name Label)</td>\n    </tr>\n    <tr>\n        <td>Last\
  \ Name:</td>\n        <td>(Space for Last Name Label)</td>\n    </tr>\n    <tr>\n\
  \        <td>Address:</td>\n        <td>(Space for Address Label)</td>\n    </tr>\n\
  \    <tr>\n        <td>Plant:</td>\n        <td>(Space for Plant Label)</td>\n \
  \   </tr>\n    <tr>\n        <td colspan=\"2\" align=\"right\">\n            (Space\
  \ for Confirm Button)\n        </td>\n    </tr>\n</table>\n(Space for Message Label)\n\
  ```\n\n- 3. 切换到设计视图。将五个标签控件和一个按钮控件拖放到表单上，按以下屏幕截图所示进行排列：\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_201_0.png)\n\
  \n为控件分配以下属性值：\n\n| 控制 | 属性 | 属性值 |\n|---|---|---|\n| Label | ID | lblFirstName |\n\
  | Label | ID | lblLastName |\n| Label | ID | lblAddress |\n| Label | ID | lblPlant\
  \ |\n| Button | ID | btnCheckOut |\n|  | Text | Checkout |\n| Label | ID | lblMessage\
  \ |\n\n- 4. 之前，在构建订单表单时，我们创建了一些属性来返回用户输入的值。为了让结账页面更轻松地检索这些值，我们将首先使用 PreviousPageType\
  \ 指令强类型化订单页面。切换到源代码视图，并在 <%@Page%> 指令下方添加以下代码行。\n\n```\n<%@ PreviousPageType VirtualPath=\"\
  ~/Forms/Order.aspx\"%>\n```\n\n- 5. 切换到设计视图并在表单上任意位置双击，以在代码隐藏文件中打开其 Page_Load()\
  \ 事件处理程序。在这里，我们将检索从订购页面发布的数据并将其分配给标签。为此，我们将检索之前创建的 FirstName、LastName、Address 和\
  \ Plant 属性中存储的值。\n\n```csharp\nprotected void Page_Load(object sender, EventArgs\
  \ e)\n{\n    if (!Page.IsPostBack)\n    {\n        // Get the first name\n     \
  \   lblFirstName.Text = PreviousPage.FirstName;\n\n        // Get the last name\n\
  \        lblLastName.Text = PreviousPage.LastName;\n\n        // Get the address\n\
  \        lblAddress.Text = PreviousPage.Address;\n\n        // Get the plant\n \
  \       lblPlant.Text = PreviousPage.Plant;\n    }\n}\n```\n\n- 6. 切回 **设计** 视图并双击\
  \ `btnConfirm` 按钮以打开 `btnConfirm_Click()` 事件处理程序。在这里，我们只需通知用户订单已成功下达。当然，在实际网站中，您可能不止于在屏幕上打印一条消息。\n\
  \n```csharp\nprotected void btnConfirm_Click(object sender, EventArgs e)\n{\n  \
  \  lblMessage.Text = \"Plant has been successfully ordered.\";\n}\n```\n\n- 7. 页面已完成。保存并构建网站。\n\
  \n## 添加“订购植物”菜单项\n\n现在我们已经创建了订购和订单确认屏幕，让我们为我们的“Order a Plant”向导在右侧菜单中添加一个新项目，以便网站访问者可以访问它。请记住，菜单由站点的频道结构驱动。因此，要添加菜单项，我们只需插入一个新频道并将其脚本\
  \ URL 设置为指向订单页面。\n\n- 1. 打开 **站点管理器** 并使用具有管理员权限的帐户登录。\n- 2. 在 **tropicalgreen**\
  \ 频道下直接创建一个频道。为新频道提供以下属性值：\n\n| 属性 | 属性值 |\n|---|---|\n| Name | OrderPlant |\n|\
  \ DisplayName | Order Plants |\n| Script URL | /tropicalgreen/forms/order.aspx |\n\
  \n- 3. 创建频道后，创建一个名为 **MenuLocation** 的选择类型自定义属性并为其分配以下选项：\n\n- Top\n- Right (make\
  \ it the default value)\n\n“Order a Plant”菜单项现在应出现在左侧菜单上。\n\n![](img/18a0aa8d36427a4c069b30410f998b8e_203_0.png)\n\
  \n## 为什么跨页回发在 MCMS 站点上不起作用\n\n导航到网站内的任何页面并点击 **Order a Plant**。在订购页面中，输入您的名字、姓氏和地址，选择一种植物，然后点击\
  \ **Order** 按钮。\n\n页面将刷新。页面似乎正在回发到自身，即使我们已将按钮的 `PostBackUrl` 属性设置为不同的页面！\n\n为了了解为什么跨页回发在\
  \ MCMS 页面上不起作用，让我们看一下生成的页面的客户端脚本。观察为 `btnOrder` 按钮生成的代码（在页面上任意位置右键单击并选择 **查看源代码**），其类似于以下代码：\n\
  \n```\n<input type=\"submit\"\nname=\"ctl00$ContentPlaceHolder1$btnOrder\"\nvalue=\"\
  Order\"\nonclick=\"javascript:\n```\n\n```\nWebForm_DoPostBackWithOptions(new\n\
  WebForm_PostBackOptions(&quot;ctl00$ContentPlaceHolder1$btnOrder&quot;, &quot;&quot;,\
  \ false, &quot;&quot;, &quot;/tropicalgreen/Forms/CheckOut.aspx&quot;, false, false))\"\
  \ id=\"ctl00_ContentPlaceHolder1_btnOrder\"/>\n```\n\n请注意，onclick() 事件处理程序调用了一个\
  \ JavaScript 方法 WebForm_DoPostBackWithOptions()。每当按钮的 UrlPostBack 属性被设置时，ASP.NET\
  \ 都会生成此方法。以下代码显示了幕后发生情况的片段。请注意，在提交表单之前，表单元素的 action 属性被设置为按钮的 PostBackUrl 属性中存储的值的值。基本上，这就是跨回发功能的工作方式。\n\
  \n```\nfunction WebForm_DoPostBackWithOptions(options)\n{\n    . . . code continues\
  \ . . .\n\n    if ((typeof(options.actionUrl) != \"undefined\") &&\n        (options.actionUrl\
  \ != null) &&\n        (options.actionUrl.length > 0))\n    {\n        theForm.action\
  \ = options.actionUrl;\n    }\n    . . . code continues . . .\n}\n```\n\n向下滚动到页面底部。注意，在\
  \ </form> 标签关闭之前，MCMS 已生成自己的客户端脚本集。特别是，请查看名为 __cmsRestFormAction() 的方法（如下所示）。当布尔变量\
  \ __CMS_PostbackFormBeenReset 设置为 false 时，__cmsRestFormAction() 方法将表单元素的 action\
  \ 属性设置为当前页面的 URL，从而覆盖 WebForm_DoPostBackWithOptions() 方法所做的任何工作。因此，当点击按钮时，信息不会发布到结账页面，订单页面继续回发到自身。\n\
  \n```\nvar __CMS_PostbackFormBeenReset = false;\nfunction __cmsRestFormAction()\n\
  {\n    if ( !__CMS_PostbackFormBeenReset )\n    {\n        // set form postback\
  \ Url to be current translated CMS Url\n        __CMS_PostbackForm.action = __CMS_CurrentUrl;\n\
  \    }\n}\n```\n\n\n\n\n为了解决此问题，我们需要修改 MCMS 添加的客户端脚本的行为，在执行跨页回发时将 __CMS_PostbackFormBeenReset\
  \ 设置为 true。以下是可能的做法。\n\n- 首先，我们将确定是否需要跨页回发。为此，我们查找名为 WebForm_DoPostBackWithOptions()\
  \ 的方法。WebForm_DoPostBackWithOptions() 方法是对旧版 ASP.NET 1.x __doPostBack() 方法的增强，并在页面上至少有一个按钮执行跨页回发时由\
  \ ASP.NET 注入。\n- 接下来，我们复制原始的 WebForm_DoPostBackWithOptions() 方法，并将其存储在名为 __CrossPostBack_Backup_WebForm_DoPostBackWithOptions\
  \ 的变量中。\n- 随后，我们将 WebForm_DoPostBackWithOptions() 分配一个新的方法，名为 __CrossPostBack_Redirect_WebForm_DoPostBackWithOptions()。\n\
  - __CrossPostBack_Redirect_WebForm_DoPostBackWithOptions() 方法 simply 设置 __CMS_PostbackFormBeenReset\
  \ 为 true 并调用原始的 WebForm_DoPostBackWithOptions() 方法，该方法已备份在 __CrossPostBack_Backup_WebForm_DoPostBackWithOptions\
  \ 变量中。\n\n现在不必担心输入代码。我们将在下一节中使用服务器端代码将代码注入到所有页面。\n\n```\nif ( typeof WebForm_DoPostBackWithOptions\
  \ != \"undefined\" )\n{\n    __CrossPostBack_Backup_WebForm_DoPostBackWithOptions\
  \ =\n        WebForm_DoPostBackWithOptions;\n\n    WebForm_DoPostBackWithOptions\
  \ =\n        __CrossPostBack_Redirect_WebForm_DoPostBackWithOptions;\n}\n\nfunction\
  \ __CrossPostBack_Redirect_WebForm_DoPostBackWithOptions(options)\n{\n    __CMS_PostbackFormBeenReset\
  \ = true;\n    __CrossPostBack_Backup_WebForm_DoPostBackWithOptions(options);\n\
  }\n```\n\n## CorrectCrossPostBack HTTP 模块\n\n由于对客户端脚本的修改可能会影响解决方案中的所有模板文件，实现此更改的一个好方法就是编写一个\
  \ HTTP 模块。HTTP 模块会拦截所有页面请求，并且可以编程为自动将修改后的脚本注入到需要它们的模板文件中。\n\n要创建 HTTP 模块，首先检查解决方案中是否存在\
  \ TropicalGreenHttpModules 类库。如果不存在，请将其添加为新的 Visual C# 类库。\n\n接下来，在 TropicalGreenHttpModules\
  \ 类库中添加一个名为 CorrectCrossPostBack.cs 的类。在类声明上方，添加此处突出显示的命名空间：\n\n```\n. . . code\
  \ continues . . .\n\nusing System.Web;\nusing Microsoft.ContentManagement.Publishing;\n\
  \nnamespace TropicalGreenHttpModules\n{\n    . . . code continues . . .\n}\n```\n\
  \n由于我们正在构建一个 HTTP 模块，让该类实现 IHttpModule 接口。\n\n```\nclass CorrectCrossPostBack :\
  \ IHttpModule\n{\n}\n```\n\nIHttpModule 接口要求类实现 Init() 和 Dispose() 方法。我们在 Dispose()\
  \ 方法中无需执行任何操作。\n\n在 Init() 方法中，我们将为 HTTP 模块的 PreRequestHandlerExecute 事件注册一个新的事件处理程序，名为\
  \ OnPreRequestHandlerExecute()。将这两个方法追加到类文件中。\n\n```\npublic void Dispose()\n{\n\
  \    // Nothing to do.\n}\n\npublic void Init(HttpApplication httpApp)\n{\n```\n\
  \n```\nhttpApp.PreRequestHandlerExecute += new EventHandler\n    (this.OnPreRequestHandlerExecute);\n\
  }\n```\n\n接下来，我们将添加 OnPreRequestHandlerExecute() 事件处理程序，该处理程序检查当前请求是否为 ASP（或 ASP.NET）页面。为此，它检查处理程序的类型是否以\
  \ ASP 开头。HTTP 模块将忽略所有其他请求，例如 ASP.NET 2.0 资源处理程序或其他自定义处理程序的请求。\n\n在 OnPreRequestHandlerExecute()\
  \ 事件处理程序内部，我们将进行另一项检查，以查看请求是否为 MCMS 频道项。如果是，我们将注册另一个事件处理程序 OnInit()。\n\n```\npublic\
  \ void OnPreRequestHandlerExecute(object sender, EventArgs e)\n{\n    HttpContext\
  \ ctx = ((HttpApplication)sender).Context;\n    IHttpHandler handler = ctx.Handler;\n\
  \n    // Only execute for ASP.NET handler\n    // not for custom http handlers or\
  \ for the ASP.NET 2.0 resource\n    // handlers.\n    if (handler.GetType().ToString().StartsWith(\"\
  ASP.\"))\n    {\n        try\n        {\n            if (CmsHttpContext.Current.ChannelItem\
  \ != null)\n            {\n                ((System.Web.UI.Page)handler).Init +=\
  \ new\n                    EventHandler(this.OnInit);\n            }\n        }\n\
  \        catch\n        {\n            // This will happen if the request is in\
  \ the middle of an\n            // expired forms authentication login we just ignore\
  \ this.\n        }\n    }\n}\n```\n\n最后，我们将注入纠正跨页回发问题的客户端脚本。我们将构建脚本，并在 OnInit()\
  \ 方法中使用 Page.ClientScript.RegisterStartupScript() 方法。\n\n```\nstring Override_WebForm_DoPostBackWithOptions\
  \ =\n    \"    if ( typeof WebForm_DoPostBackWithOptions != \\\"undefined\\\" )\
  \ \\\\n\" +\n```\n\n```\n\"  {\\n\" +\n\"    __CrossPostBack_Backup_WebForm_DoPostBackWithOptions\
  \ = \" + \n\"        WebForm_DoPostBackWithOptions;\\n\" + \n\"    WebForm_DoPostBackWithOptions\
  \ = \" + \n\"        __CrossPostBack_Redirect_WebForm_DoPostBackWithOptions;\\n\"\
  \ + \n\"  }\\n\" + \n\"  function __CrossPostBack_Redirect_WebForm_DoPostBackWithOption\\\
  ns(options)\" + \n\"  {\\n\" + \n\"    __CMS_PostbackFormBeenReset = true;\\n\"\
  \ + \n\"    __CrossPostBack_Backup_WebForm_DoPostBackWithOptions\\n    (options);\\\
  n\" + \n\"  }\\n\";\n```\n\n```csharp\npublic void OnInit(object sender, EventArgs\
  \ eventArgs)\n{\n    System.Web.UI.Page currentPage = sender as System.Web.UI.Page;\n\
  \    currentPage.ClientScript.RegisterStartupScript(this.GetType(),\n        \"\
  Override_WebForm_DoPostBackWithOptions\",\n        Override_WebForm_DoPostBackWithOptions,\
  \ true);\n}\n```\n\n该类已完成。保存并构建项目。\n\n要使用 HTTP 模块，请在 web.config 项目的 <HttpModules>\
  \ 部分添加以下条目。\n\n```xml\n<add type=\"TropicalGreenHttpModules.CorrectCrossPostBack,\n\
  \    TropicalGreenHttpModules\"\n    name=\"CorrectCrossPostBack\"/>\n```\n\n现在，让我们看看\
  \ HTTP 模块是否确实纠正了问题。尝试从订购页面订购一株植物。当单击 Order 按钮时，注意信息已正确发布到确认页面。\n\n## 提示 #2：如何实现广告轮播\n\
  \n如今广告无处不在。在大多数商业互联网网站上，您会发现某种形式的广告，要么是沿着页面高度或宽度运行的横幅，要么是每次页面加载时吸引注意力的弹出窗口。\n\n\
  热门网站可能有多家广告商要求在线投放广告。当竞争激烈时，必须制定一个流程来确定谁的广告先出现、广告应如何排序以及何时发布或下线。\n\n好消息是：ASP.NET\
  \ 2.0 附带了 Ad Rotator 控件。在本提示中，我们将了解 Ad Rotator 如何与 MCMS 资源库项目集成。使用 MCMS 内置的资源管理器，用户可以添加新图像或替换现有图像，而不必担心超链接损坏。当图像从库中删除时，它会立即下线。\n\
  \n虽然 Ad Rotator 并不是一个新控件，自 ASP.NET 1.x 时代（甚至更早）就已存在，但旧版本的控件要求开发人员在物理 XML 文件中定义广告列表。控件的增强版本允许以编程方式填充广告及其属性，使其非常适合与\
  \ MCMS 集成。\n\n## MCMSAdRotator\n\n让我们构建一个自定义 Ad Rotator 服务器控件。完成后，该控件的行为与开箱即用的 Ad\
  \ Rotator 控件完全相同，但会与选定的资源库集成。它将从库中随机选择一个资源并显示图像。刷新页面时，广告会发生变化！\n\n- 1. 首先，确保 TropicalGreen\
  \ 解决方案包含一个名为 `TropicalGreenControlLib` 的 Visual C# 类库项目。否则，请创建它。\n- 2. 项目应添加以下引用：\n\
  \  - `System.Web`\n  - `Microsoft.ContentManagement.Publishing`\n- 3. 向 **TropicalGreenControlLib**\
  \ 项目添加一个类文件。将类命名为 **MCMSAdRotator.cs**。\n- 4. 在命名空间声明上方添加突出显示的命名空间。\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\nusing System.Text;\n\nusing System.ComponentModel;\n\
  using System.Web.UI;\nusing System.Web.UI.WebControls;\nusing Microsoft.ContentManagement.Publishing;\n\
  \nnamespace TropicalGreenControlLib\n{\n    . . . code continues . . .\n}\n```\n\
  \n\n\n5. 接下来，我们将从 AdRotator 类继承。这将使我们的控件立即具备开箱即用的 Ad Rotator 控件的所有功能。我们将添加一些组件设计值，以便开发人员从工具箱拖放时，控件能获得正确的标签名称。\n\
  \n```\n[ToolboxData(\"<{0}:MCMSAdRotator runat=server></{0}:MCMSAdRotator>\")] public\
  \ class MCMSAdRotator : AdRotator\n{\n}\n```\n\n6. 我们将提供一个名为 AdsGalleryPath 的属性，其中包含包含图像的资源库的路径。将以下代码按所示插入类声明中。\n\
  \n```\npublic class MCMSAdRotator : AdRotator\n{\n    // Property to get and set\
  \ the path of the\n    // resource gallery that contains the Ads\n    private string\
  \ adsGalleryPath;\n\n    [Bindable(true)]\n    [Category(\"Behavior\")]\n    [DefaultValue(\"\
  \")]\n    [Localizable(true)]\n    public string AdsGalleryPath\n    {\n       \
  \ get { return adsGalleryPath; }\n        set { adsGalleryPath = value; }\n    }\n\
  }\n```\n\n7. 要显示的广告将从资源库中随机选取。Randomizer() 方法将从 1 到库中项目数量之间随机选取一个数字。在此，我们将使用 Random.Next()\
  \ 方法生成随机数。我们可以采用更复杂的随机数生成方法，但目前这样就足够了。将以下代码添加到 AdsGalleryPath 属性下方。\n\n```\nprivate\
  \ int Randomiser(int max)\n{\n    // Generate a random number\n    int index = 0;\n\
  \    Random rand = new Random();\n    index = rand.Next(0, max);\n\n    return index;\n\
  }\n```\n\n8. 在 Ad Rotator 控件加载但页面加载之前，将调用控件的 AdCreated() 事件。在这里，我们首先获取包含广告的资源库的实例以及构成我们广告的资源集合。我们只检索图像——其他文件格式如\
  \ Office 文档将被忽略。之后，我们将调用 Randomiser() 方法来选择要显示的广告。一旦选择了广告，我们将设置控件的属性以显示资源，将其链接到资源描述中指定的\
  \ URL，并将图像的工具提示或替代文本设置为资源的显示名称。将 OnAdCreated() 事件处理程序附加到代码中。\n\n```\nprotected override\
  \ void OnAdCreated(AdCreatedEventArgs e)\n{\n    // Get an instance of the resource\
  \ gallery that contains the Ads\n    CmsHttpContext cmsContext = CmsHttpContext.Current;\n\
  \    ResourceGallery rg =\n        (ResourceGallery)cmsContext.Searches.GetByPath(adsGalleryPath);\n\
  \n    if (rg != null)\n    {\n        // Get only files that are images\n      \
  \  ResourceCollection ads = rg.Resources;\n        ads.FilterByMimeType(\"image\"\
  , true);\n\n        // Randomly pick one of the Ads\n        int resourceIndex =\
  \ Randomiser(ads.Count);\n        Resource r = ads[resourceIndex];\n\n        //\
  \ Display the image\n        e.ImageUrl = r.Url;\n        e.NavigateUrl = r.Description;\n\
  \        e.AlternateText = r.DisplayName;\n    }\n}\n```\n\n9. 控件已完成。保存文件并编译项目。\n\
  \n要查看控件的实际效果，首先通过在工具箱中右键单击并选择“选择项”将其添加到工具箱中。在“选择工具箱项”对话框中，单击“浏览”并选择 TropicalGreenControlLib.dll\
  \ 文件，通常位于项目的 \\bin\\debug\\ 文件夹中。将控件添加到工具箱后，将控件拖放到 Web 表单或模板文件中的任意位置。将 AdsGalleryPath\
  \ 属性设置为包含现有资源库项的路径，例如 /Resources/TropicalGreen/PlantCatalog。下次查看页面时，您将看到轮播广告。\n\n\
  ## 提示 #3：有关 Microsoft Office SharePoint Server 2007 的注意事项\n\nWeb Content Management（WCM）功能目前在\
  \ MCMS 中，将成为即将推出的 Microsoft Office SharePoint Server 2007（MOSS 2007）的一部分。MOSS 2007\
  \ 还将提供更丰富的功能：\n\n- SharePoint 和 MCMS 将作为单一产品发布，从此两者之间不再混淆。除了 WCM 功能外，您还将获得完整的 SharePoint\
  \ 功能套件，例如：\n  - 文档管理\n  - 企业搜索\n  - 调查和讨论板\n  - 列表和提醒\n  - 对门户和 Web 部件的内置支持\n- 此外，MOSS\
  \ 2007 还包含多个令人兴奋的新功能：\n  - Wiki 和博客。\n  - 增强的 Web 作者体验，无需 ActiveX 组件和 Site Manager\
  \ 的客户端安装。包括节省时间的强大工具，如回收站和一键回滚到以前版本。\n  - Site Manager 中的所有功能现在都是 Publishing API\
  \ 的一部分。例如，您可以以编程方式管理角色、组和用户，以及当前 PAPI 版本中无法完成的任务。\n  - 基于 Windows Workflow Foundation\
  \ 的可扩展工作流。\n  - 极强的可扩展性。能够在一个容器中处理数百万个项目。\n\nMOSS 2007 将附带更多新功能和增强功能。如需完整列表，请查看可在\
  \ 2007 Microsoft Office 系统预览网站下载的 Microsoft Office SharePoint Server 2007 指南（http://www.microsoft.com/office/preview/servers/sharepointserver/highlights.mspx）。\n\
  \n对于我们这些已有 MCMS 安装并计划迁移到 MOSS 2007 的人来说，需要注意的关键点是，Office SharePoint Server 2007\
  \ 下的 WCM 应用程序将使用与当前 MCMS 版本完全不同的 API 集合。进行大规模代码改造的部分原因是将 MCMS 基础架构与 Windows SharePoint\
  \ Services（版本 3.0）集成。\n\n虽然 Publishing API 的全面改造可能意味着我们为网站编写的大部分自定义代码都必须重新编码，但好消息是：大多数当前属性和方法的功能将有一对一的映射。详细信息可在文章\
  \ Mapping MCMS 2002 APIs to SharePoint 2007（http://msdn.microsoft.com/office/server/moss/2007/migration/default.aspx?pull=/library/en-us/dnmscms02/html/CMSISVersionAPIDiffs.asp）中找到。\n\
  \n此外，Microsoft 将提供迁移实用工具以简化过渡。CMS Assessment Tool 会扫描站点并生成各种报告，例如 PAPI 使用情况汇总报告、PAPI\
  \ 类使用报告等，帮助您评估使站点为 MOSS 2007 做好准备所需的重编码工作量。CMS Assessment 工具可在 Microsoft 网站下载：http://www.microsoft.com/downloads/details.aspx?FamilyId=360D0E83-FA70-4C24-BCD6-426CAFBCC627&displaylang=en。\n\
  \n出于各种原因，您可能不希望立即迁移到 Microsoft Office SharePoint Server 2007，而选择继续使用 MCMS 2002 构建站点。如果这是您的意图，您可以今天采取措施以便将来更轻松地迁移。您可以：\n\
  \n- 将使用 PAPI 的代码隔离到模块中。\n- 在可能的情况下使用 Provider Model 设计模式。\n\n## 将使用 PAPI 的代码隔离到模块中\n\
  \n更改底层 MCMS PAPI 的举措，如果您计划将来升级到 MOSS 2007，将对现有 Web 应用程序产生巨大影响。除非您使用的是没有任何形式定制的开箱即用解决方案，否则很可能您已使用\
  \ PAPI 来根据网站需求定制解决方案。\n\n您使用 PAPI 所做的所有定制都必须重写。虽然重写代码不可避免，但您可以规划代码结构，使重新编码过程尽可能轻松。好主意是编写模块化代码并尽可能隔离使用\
  \ PAPI 的代码。这样，当升级网站时，需要重写的代码将更容易定位。\n\n例如，一个相当常见的场景是自定义控件，列出站点上最近七天内修改过的所有页面。以前，列表可以编程为在\
  \ DataGrid 中显示。列表是从 PAPI 使用 `Searches.NewPostings()` 方法检索的。此外，当页面加载时，列表会直接绑定到 DataGrid，使用\
  \ `DataGrid.DataBind()` 方法。以下是代码可能的样子示例：\n\n```\nprotected System.Web.UI.WebControls.DataGrid\
  \ DataGrid1;\nprivate void Page_Load(object sender, System.EventArgs e)\n{\n   \
  \ // Get the current CMS Http context\n    CmsHttpContext cmsContext = CmsHttpContext.Current;\n\
  \n    // Get a list of all postings that have been modified in the last\n    //\
  \ 7 days\n    PostingCollection newPostings = cmsContext.Searches.NewPostings(7);\n\
  \n    // Bind the result to the DataGrid\n    DataGrid1.DataSource = newPostings;\n\
  \    DataGrid1.DataBind();\n}\n```\n\n为了模块化代码并将与 MCMS PAPI 交互的部分与使用 PAPI 的部分隔离开来，可以创建一个数据抽象层。数据抽象层可以是一个单独的类文件。在开始模块化代码之前，让我们先识别出使用\
  \ MCMS PAPI 的部分。如下所示，使用 PAPI 的代码行是获取当前 CmsHttpContext 以及最近七天内修改的帖子列表的部分：\n\n```\n\
  protected System.Web.UI.WebControls.DataGrid DataGrid1;\nprivate void Page_Load(object\
  \ sender, System.EventArgs e)\n{\n    // Get the current CMS Http context\n    CmsHttpContext\
  \ cmsContext = CmsHttpContext.Current;\n\n    // Get a list of all postings that\
  \ have been modified in the last\n    // 7 days\n    PostingCollection newPostings\
  \ = cmsContext.Searches.NewPostings(7);\n\n    // Bind the result to the DataGrid\n\
  \    DataGrid1.DataSource = newPostings;\n    DataGrid1.DataBind();\n}\n```\n\n\
  为了隔离代码，我们将提取所有突出显示的代码部分并将其添加到数据抽象层中。在此示例中，数据抽象层只是一个名为 DataAbstractionExample 的单独类文件。这里有两个方法：GetCurrentCMSContext()\
  \ 获取当前 CmsHttpContext，而 GetListOfPostings() 返回最近七天内修改的所有帖子的列表。\n\n```\npublic class\
  \ DataAbstractionExample\n{\n    private static CmsHttpContext GetCurrentCMSContext()\n\
  \    {\n        return CmsHttpContext.Current;\n    }\n    public static PostingCollection\
  \ GetListOfPostings()\n    {\n        // Get the current CMS Http Context\n    \
  \    CmsHttpContext cmsContext = GetCurrentCMSContext();\n        // Get a list\
  \ of all postings that have been modified in the\n        // last 7 days\n     \
  \   PostingCollection newPostings =\n            cmsContext.Searches.NewPostings(7);\n\
  \        return newPostings;\n    }\n```\n```\n\n接下来，我们修改原始代码，使其改为调用数据抽象层中的 GetListOfPostings()。请注意，我们已从\
  \ Page_Load() 事件处理程序中移除了所有使用 MCMS PAPI 的代码。\n\n```\n    protected System.Web.UI.WebControls.DataGrid\
  \ DataGrid1;\n    private void Page_Load(object sender, System.EventArgs e)\n  \
  \  {\n        // Bind the result to the DataGrid\n        DataGrid1.DataSource =\
  \ DataAbstractionExample.GetListOfPostings(7);\n        DataGrid1.DataBind();\n\
  \    }\n```\n```\n\n乍一看，提取所有与 PAPI 接口的代码似乎不会对网站的行为产生任何影响。事实上，我们所做的只是向应用程序添加了更多代码行，使其变得稍微复杂一些。\n\
  \n尽管如此，将代码分离成模块化层会使迁移过程变得更容易，如果你以后选择进行迁移的话。与其在网站的分散区域进行代码修改，你可以将精力集中在数据抽象层上。在此示例中，我们只需要修改\
  \ DataAbstractionExample 类即可，而原始 Web 表单（以及所有使用 GetListOfPostings() 方法的其他 Web 表单）保持不变。\n\
  \n此外，根据你网站的设置，可能可以让 MCMS 和 MOSS 2007 并行运行并分阶段升级网站。这样，你可以计划分段重写数据抽象层。分阶段方法的优势在于，你可以在整个网站升级完成之前就享受到\
  \ MOSS 2007 的新功能。\n\n## 使用提供程序模型设计模式\n\n在本書中，我們討論了在構建站點導航控件（第 4 章）或執行窗體身份驗證（第 6\
  \ 章）時如何使用提供程序模型。\n\n使用提供程序模型扩展了将使用 PAPI 的代码与代码其他部分隔离开来的思想。正如我们在前几章中所看到的，提供程序模型允许我们将“业务逻辑”，它查询\
  \ MCMS 仓库，与“表示逻辑”，负责向浏览器返回 HTML 分离。例如，在构建站点导航时，我们使用了标准的 `SiteMapPath` 和 `TreeView`\
  \ 控件作为表示逻辑。然后我们通过构建 `MCMSsiteMapProvider` 类来实现业务逻辑，该类使用 PAPI 查询仓库以获取导航项列表。\n\n当升级网站时，只需替换提供程序模型即可，要么使用原生的\
  \ MOSS 2007 功能，要么使用与 MOSS 通信的替代提供程序。例如，要升级 TropicalGreen 站点的导航控件，我们只需重写 `MCMSsiteMapProvider.cs`\
  \ 类文件即可。表示层中的 `SiteMapPath` 或 `TreeView` 控件可以无需进一步修改即可重复使用。\n\n> 有关如何规划 MOSS 2007\
  \ 未来发布的更多详细信息，请参阅以下白皮书：\n> http://msdn.microsoft.com/library/en-us/dnmscms02/html/CMSDesigningCMS2002Sol.asp\n\
  \n## 摘要\n\n在本章中，我们讨论了一些有助于使用 MCMS 开发网站的技巧。首先我们看到了如何使用 `PostBackUrl` 属性在页面之间传递数据。随后，我们设计了一种变通方法，使其在\
  \ MCMS 网站上正常工作。\n\n接下来，我们讨论了随 ASP.NET 2.0 提供的巧妙的 Ad Rotator 控件。虽然 Ad Rotator 控件已经存在一段时间了，但这个最新版本允许我们将控件的内容直接绑定到非静态\
  \ XML 文件。我们现在能够将控件直接与 MCMS 资源库项目集成，为我们的工具箱提供了一个灵活且有用的补充。\n\n最后，我们讨论了一些未来计划的考虑因素，以便于将现有应用程序迁移到下一个版本的\
  \ MOSS 2007。\n"
