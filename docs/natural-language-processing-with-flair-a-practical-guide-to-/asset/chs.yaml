  > **重要提示**\n> 从未经过审查的分支安装代码可能会引入不可靠或不安全的代码。在从开发分支安装 Flair 时，请确保你安装的代码来自可信来源。另请注意，Flair\
  \ 的未来版本（大于 0.11 的版本）可能与本书中提供的代码片段不兼容。\n\n将术语 master 替换为任何其他分支名称，即可从你选择的分支安装包。\n\n\
  ## 使用 Flair 运行代码\n\n使用 Flair Python 包的代码与运行任何其他类型的 Python 代码没有区别。\n\n本书中代码片段的推荐运行方式是将其作为代码单元在\
  \ Jupyter notebook 中执行，你可以按如下方式安装和运行它：\n\n```\n(learning-flair) $ pip install notebook\n\
  (learning-flair) $ jupyter notebook\n```\n\n然后你可以创建一个新的 Python 3 笔记本并运行你的第一个 Flair\
  \ 脚本来验证包是否成功导入：\n\n```\nimport flair\nprint(flair.__version__)\n```\n\n执行后，前面的代码应打印出你当前使用的\
  \ Flair 版本，表明 Flair 包已成功导入，你已准备好开始。\n\n## 摘要\n\n在本章中，你熟悉了基本 NLP 术语和任务。随着你学习 Flair，你经常会遇到诸如\
  \ tokenization、NER 和 POS 等术语，本章获得的知识将帮助你理解它们的含义。\n\n你现在也了解了 Flair 在 NLP 领域中的位置，它解决的问题以及它擅长的领域。最后，你学会了如何从\
  \ PyPI 包或 Git 分支在虚拟环境中安装 Flair。你现在准备好开始使用 Flair 编程了！\n\n在下一章中，我们将介绍 Flair 的基本语法和基本对象，即所谓的\
  \ base types。\n\n## 2\n\n## Flair 基础类型\n\n对于任何 NLP 框架来说，一个良好的起点是熟悉代码中频繁使用的基本对象和方法。在\
  \ Flair 中，第一步是熟悉其 **base types**。这些是用于定义句子或文本片段并通过分词形成 token 的基本对象。\n\nNLP 当今面临的主要挑战之一是对代表性不足语言的支持。大多数最先进的预建\
  \ NLP 模型通常仅针对部分使用最广泛的语言构建，而未能为地球上约 7,000 种其他语言提供支持。虽然 Flair 以其出色的语言覆盖范围和多语言嵌入工作而脱颖而出，但在\
  \ *语料库可用性*、*分词方法* 和 *预建序列标注模型* 等领域，它仍远未支持所有可能的语言。对于 Flair 目前不支持特殊分词规则的语言形成 token，你需要实现自己的分词器。幸运的是，在\
  \ Flair 中这样做再简单不过了。\n\n在本章中，你将学习 `Sentence` 对象，它用于表示句子或文本片段，以及 `Token` 基础类型，它用于表示分词后的句子中的单词。你将学习如何实现自定义分词器以及如何使用它们。你还将了解\
  \ Flair 中的 `Corpus` 对象以及如何使用其辅助函数加载和交互语料库和数据集。\n\n本章涵盖以下主题：\n\n- Sentence and Token\
  \ 对象\n- 使用自定义分词器\n- Corpus 对象\n\n## 技术要求\n\n对于本章，你需要安装了 **Flair version 0.11** 的\
  \ **Python** 环境以及稳定的互联网连接，因为我们将下载语料库。\n\n本章中的代码示例可以在本书的官方 GitHub 仓库中找到，具体在以下 Jupyter\
  \ notebook 中：https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter02。\n\
  \n## Sentence 和 Token 对象\n\n**Sentence** 和 **Token** 对象可以被视为 **Flair** 语法中最常见的对象。前者用于表示句子或任何其他文本片段，例如段落。它们本质上是\
  \ Token 对象的列表及其对应的标签分配。\n\n如果你想知道对象、类和方法是什么意思，这只是说明你对 **面向对象编程 (OOP)** 并不是特别熟悉。幸运的是，**OOP**\
  \ 在 Python 中非常容易掌握。在 **OOP** 中，存储和/或处理数据的代码片段被组织成称为类的蓝图。类的一个例子可以是 Word 类，它可以存储和处理单个单词。OOP\
  \ 中的类可以包含几个称为方法的过程。Word 类方法的一个例子可以是 get_length()，它只会返回单词的长度。类还可以包含一种特殊类型的方法，称为构造函数，在类被实例化时会被调用。实例化类的结果是一个对象。例如，调用\
  \ word_1 = Word('potato') 会调用构造函数并将 'potato' 作为第一个参数值，返回一个 Word 对象并将其存储为 word_1。然后我们可以使用这个变量来调用该对象的方法，例如\
  \ word_1.get_length()。\n\n这篇关于 OOP 的简要介绍应该能让你获得足够的理解，以便直接深入 Flair arguably 最基础的实体——Sentence\
  \ 类。\n\n## 了解 Sentence 类\n\nSentence 类构造函数接受以下参数：\n\n- text: 原始字符串（句子）或字符串 token（单词）列表。\n\
  - use_tokenizer: 要使用的分词器。如果为 True，则使用 SegTokTokenizer。如果为 False，则改用 SpaceTokenizer。如果提供了\
  \ Tokenizer 对象，则将使用它作为自定义分词器。\n- language_code: 用于某些嵌入的语言代码（可选）。\n- start_position:\
  \ 句子在文档中的起始字符偏移量（可选）。\n\n例如，让我们创建一个简单的 Sentence 对象并检查其字符串表示行为：\n\n```\nfrom flair.data\
  \ import Sentence\n\nsentence = Sentence('Some nice text.')\nprint(sentence, len(sentence))\n\
  ```\n\n前面的脚本应打印出以下内容：\n\n```\nSentence: \"Some nice text .\" 4\n```\n\n前面的输出表明句子已被拆分为四个\
  \ token，其中一个是句号。单独的 . token 是未提供 use_tokenizer 参数的直接结果，如果留空，则默认为使用 SegTokTokenizer。\n\
  \n## 了解 Token 类\n\nToken 类表示分词句子中单个实体，例如单词。\n\n每个 token 可以有零个、一个或多个标签。例如，Flair 允许对同一个\
  \ Sentence 对象同时进行 POS 标注和 NER。这意味着单个 token 理论上可以同时具有命名实体标签和词性标签。\n\nToken 对象的对应文本可以通过引用其\
  \ Token.text 属性轻松获得。\n\n我们现在对这两种基础类型的工作方式有了模糊的了解。但要完全理解基础类型的工作方式，我们需要更深入地研究 Flair\
  \ 中的分词技术。\n\n\n\n## Flair 中的分词\n\n根据你的需求和所用语言的类型，你可以从 Flair 中提供的以下任何分词器中选择：\n\n\
  - `SpaceTokenizer()`: 一个简单的分词器，按空格字符分割文本。请注意，此分词器仅按空格字符 (\" \") 分割。它不会按包含在 Python\
  \ 的 `string.whitespace` 中的字符分割，该字符常用于分割或格式化文本的方法中。空白字符（连同空格字符）还包括换行符和制表符，而 `SpaceTokenizer`\
  \ 不会考虑这些。\n- `SpacyTokenizer(model)`: 使用一个名为 **spaCy** 的常用 NLP 库的分词器。它接受一个名为 `model`\
  \ 的参数，该参数可以是表示 **spaCy** 模型（例如，`en_core_web_sm`）的字符串，也可以是 spaCy `Language` 对象。\n\
  - `SciSpacyTokenizer()`: 使用 spaCy 的 **`en_core_sci_sm`** 模型的分词器，并扩展了诸如 `(, )` 和\
  \ `-.` 等特殊字符。这些用作额外的词元分隔符。\n- `SegtokTokenizer()`: 使用 Flair 依赖项 **segtok** 的分词器，该依赖项专注于分割（印欧语系）文本。\n\
  - `JapaneseTokenizer(tokenizer, sudachi_mode)`: 使用 **konoha** 库的分词器类，并为日语提供多种分词器选择。`tokenizer`\
  \ 参数可以是 `mecab`、`janome` 或 `sudachi`。\n\n现在我们对 Flair 中可用的分词器有了很好的了解，让我们尝试使用非默认分词器使用\
  \ Sentence 对象：\n\n```python\nfrom flair.data import Sentence\nfrom flair.tokenization\
  \ import SpaceTokenizer\n\ntokenizer = SpaceTokenizer()\ns = Sentence('Some nice\
  \ text.', use_tokenizer=tokenizer)\n\n### 使用魔术方法 __str__ 获取字符串表示\nprint(s, len(s))\n\
  ```\n\n上述脚本使用 SpaceTokenizer，应该打印出以下内容：\n\n```\nSentence: \"Some nice text.\" 3\n\
  ```\n\n这与 SegtokTokenizer 不同，由于仅按空格字符分割，它将 text. 字符串视为单个词元。\n\n在下一节中，我们将了解如何从 Sentence\
  \ 和 Token 对象中提取信息以及如何为其添加标签。\n\n## Sentence 和 Token 对象辅助方法\n\nSentence 对象有几个有用的方法和属性。最直接的一个，也是我们在前面的示例中已经使用过的，是\
  \ __str__ 魔法方法的实现，它返回对象的字符串表示形式，例如在尝试打印它时。\n\n为了能够完全理解 Sentence 对象的字符串表示格式，我们需要为至少一个词元添加标签。为此，我们将使用\
  \ get_token(n) 方法获取第 n 个词元的 Token 对象，然后使用 add_label(label_type, value) 方法为词元分配标签：\n\
  \n```python\nfrom flair.data import Sentence\n\nsentence = Sentence('A short sentence')\n\
  sentence.get_token(1).add_label('manual-pos', 'DT')\nprint(sentence)\n```\n\n上述脚本将打印出以下内容：\n\
  \n```\nSentence: \"A short sentence\" → [\"A\"/DT]\n```\n\n打印字符串的第一部分显示整个句子在其原始形式，而句子的第二部分显示带有相应标签的词元。在此代码示例中，我们手动标记了第一个词元以测试对象的字符串表示，而在\
  \ Flair 中，词元通常会由序列标注器进行标记。\n\n类似的 Sentence 对象字符串表示也可以通过调用 to_tagged_string() 方法直接获得。\n\
  \n> **重要提示**\n> get_token(n) 方法使用基于 1 的索引，这意味着 n=1 将检索第一个词元，而 n=0 将返回 None。使用 get_token(n)\
  \ 的基于 0 的索引替代方案是使用索引运算符。例如，要获取名为 sentence 的 Sentence 对象的第一个词元，我们可以简单地调用 sentence[0]。\n\
  \n标记化的 Sentence 对象中的词元也可以通过使用其 __iter__() 魔法函数获得，这使我们可以通过简单地迭代对象来获取所有词元。我们例如可以通过使用\
  \ for 循环来做到这一点。\n\n让我们使用前一个脚本中的相同 sentence 变量运行以下脚本：\n\n```python\nfor token in\
  \ sentence:\n    print(token)\n```\n\n脚本将打印出以下内容：\n\n```\nToken[0]: \"A\" → DT (1.0)\n\
  Token[1]: \"short\"\nToken[2]: \"sentence\"\n```\n\n这使我们能够清楚地了解原始字符串是如何被分词的。\n\n\
  在使用 Sentence 对象时，了解使用 len() 方法的行为很重要。它将返回词元数量，而不是原始字符串的长度。这意味着使用前一个脚本中的变量调用 len(sentence)\
  \ 将返回 3。如果您希望获取实际句子（即原始文本）的长度，则需要运行 len(sentence.to_original_text())。\n\n如果这里描述的任何分词器都不适合你，Flair\
  \ 也能满足你的需求。你需要做的只是实现自己的自定义分词器并将其传递给 Flair。让我们学习如何操作。\n\n## 使用自定义分词器\n\n虽然 Flair\
  \ 随附了支持最常用语言的多个分词器，但你可能正在处理一种使用目前未被 Flair 覆盖的分词规则的语言。幸运的是，Flair 提供了一个简单的接口，允许我们实现自己的分词器或使用第三方库。\n\
  \n### 使用 TokenizerWrapper 类\n\nTokenizerWrapper 类为构建自定义分词器提供了一个简单的接口。要构建一个，你只需通过传递\
  \ tokenizer_func 参数来实例化该类。该参数是一个函数，它接收整个句子文本作为输入并返回一个词元字符串列表。\n\n作为练习，让我们尝试实现一个将文本拆分为字符的自定义分词器。此分词器将把每个字符视为一个词元：\n\
  \n```python\nfrom flair.data import Token\nfrom flair.tokenization import TokenizerWrapper\n\
  \ndef char_splitter(sentence):\n    return list(sentence)\n\nchar_tokenizer = TokenizerWrapper(char_splitter)\n\
  ```\n\n在前面的代码中，我们实现了 space_splitter 函数，它只是将句子拆分为字符列表。最后，我们通过使用新的函数实例化 TokenizerWrapper\
  \ 类来创建新的分词器对象。\n\n现在，我们可以通过使用 Sentence 对象并打印生成的词元来测试我们的分词器：\n\n```python\nfrom flair.data\
  \ import Sentence\n\ntext = \"Good day.\"\nsentence = Sentence(text, use_tokenizer=char_tokenizer)\n\
  \nfor token in sentence:\n    print(token)\n```\n\n结果脚本将打印出以下内容：\n\n```text\nToken[0]:\
  \ \"G\"\nToken[1]: \"o\"\nToken[2]: \"o\"\nToken[3]: \"d\"\nToken[4]: \" \"\nToken[5]:\
  \ \"d\"\nToken[6]: \"a\"\nToken[7]: \"y\"\nToken[8]: \".\"\n```\n\n打印的文本表明我们的分词器按预期执行并且与\
  \ Sentence 对象兼容。\n\n> **关于分词器的重要提示**\n> 语言的分词规则通常很复杂并且包含许多边缘情况。因此，强烈建议使用来自成熟 NLP\
  \ 包的第三方分词器，而不是自己实现。\n\n现在我们已经介绍了分词以及 Sentence 和 Token 基础类型，是时候继续深入了解 Corpus 对象了。\n\
  \n## 理解 Corpus 对象\n\nCorpus 对象是 Flair 中在内存中存储语料库的主要对象。每个 Corpus 都是三个数据集的集合，这些数据集的行为类似于\
  \ Sentence 对象列表。可以通过以下属性访问这些数据集：\n\n- **train** 属性，其中包含将用于训练模型的数据集。\n- **test**\
  \ 属性，其中包含独立于 train 数据集的数据集。它用于模型验证。\n- **dev** 属性，其中包含用于超参数调优的数据集。\n\n这三个数据集理想情况下包含来自相同数据源的数据并遵循相同的概率分布。\n\
  \n可以通过加载 Flair 的其中一个准备好的数据集来获得示例语料库对象：\n\n```python\nfrom flair import datasets\n\
  \ncorpus = datasets.UD_ENGLISH()\n```\n\n可以通过简单地打印对象来获得语料库摘要：\n\n```python\nprint(corpus)\n\
  ```\n\n这应该打印出以下内容：\n\n```\nCorpus: 12543 train + 2002 dev + 2077 test sentences\n\
  ```\n\n语料库的训练数据集可以通过简单调用 train 属性获得：\n\n```\ntrain_dataset = corpus.train\n```\n\
  \n然后，可以使用索引运算符获取数据集的第 n 个句子。例如，可以使用以下代码获取第 101 个句子：\n\n```\nsentence = train_dataset\
  \ [100]\n```\n\n```\nprint(sentence)\n```\n\n前述脚本将打印出训练数据集中第 101 个句子。\n\n该对象还附带了多个辅助方法。其中最广泛使用的是\
  \ downsample(percentage) 方法，它可以减小语料库的大小，其中 percentage 是介于 0 和 1 之间的值，用于确定新语料库的大小。\n\
  \n> 注意\n> downsample(percentage) 方法会修改并返回原始的 Corpus 对象。这意味着多次调用它会多次对语料库进行下采样。\n\n\
  例如，如果我们想将语料库下采样到 1%，我们将使用以下代码：\n\n```\ncorpus.downsample(0.01)\n```\n\n```\nprint(corpus)\n\
  ```\n\n这将打印出以下内容：\n\n```\nCorpus: 125 train + 20 dev + 21 test sentences\n```\n\n\
  这是原始语料库大小的 1%。\n\nFlair 附带了多种技术和 Corpus 对象的实例，允许我们从 CSV 文件加载数据并读取自己的序列标注数据集。它提供了大量准备好的数据集，这些数据集将在本书后面更详细地介绍。\n\
  \n## 摘要\n\n在本章中，我们介绍了 Flair 的基础类型，例如 `Sentence` 和 `Token` 对象，解释了如何初始化和使用它们，并尝试了一些基本辅助方法。这应该使我们在转向更复杂主题时能够更轻松地处理、转换和理解\
  \ Flair 中的数据。我们还介绍了在 Flair 中使用自定义分词器并实现了我们自己的基于字符的分词器。最后，我们初步了解了 Flair 的数据集和 `Corpus`\
  \ 对象可以做什么。我们学习了如何加载语料库和数据集，评估其大小，提取和读取单个句子，以及对整个数据集进行下采样。\n\n我们现在对语法、基本对象和辅助方法足够熟悉，可以继续学习\
  \ Flair 最强大的 NLP 技术——序列标注。我们将在下一章介绍这一点。\n\n## 3\n\n## Embeddings in Flair\n\nEmbeddings\
  \ 是 **Natural Language Processing (NLP)** 任务中 **Flair** 的核心概念。理解不同嵌入的工作原理、可用的类型以及在何种情况下使用何种类型，对于成为一名熟练的\
  \ Flair 用户非常重要。\n\n虽然该框架提供了大量不同类型的嵌入，但其中一种是绝对必不可少的，并在实现 Flair 在 NLP 任务上的出色性能中发挥着关键作用。这种称为\
  \ Flair 嵌入的嵌入类型，被主要作者称为 *the secret sauce of Flair*。理解 Flair 嵌入的来龙去脉将帮助你更好地理解 Flair\
  \ 在众多 NLP 任务中取得成功的背后原因，并在训练自定义模型时帮助你选择合适的嵌入。\n\n在本章中，我们将学习不同类型的嵌入、它们的工作原理，以及如何在\
  \ Flair 中使用各个嵌入技术来生成词、句子和文档嵌入。阅读本章后，你将对在何种情况下使用何种嵌入有更深入的理解。我们将演示如何使用词嵌入上的算术运算来理解词语的含义和关系，使用\
  \ “king is to man as queen is to woman” 这一类比。我们将学习如何通过堆叠嵌入将多个现有嵌入组合成新的嵌入类型。我们还将介绍文档嵌入以及如何使用它们为整个文档生成嵌入。\n\
  \n该框架提供了一系列可以分为多个类别的嵌入：*classic word embeddings*、*Flair embeddings*、*stacked embeddings*、*document\
  \ embeddings* 和 *other embeddings*。这些类别在以下主题中介绍：\n\n- 理解词嵌入\n- Flair 嵌入\n- 堆叠嵌入\n\
  - 文档嵌入\n- Flair 中的其他嵌入\n\n### 技术要求\n\n本章使用的所有 Python 库都是 Flair 0.11 版本的直接 Flair\
  \ 依赖项，只要机器上已安装 Flair，就无需特殊设置。本章介绍的代码示例可在本书官方 GitHub 仓库的以下 Jupyter 笔记本中找到：https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter03。\n\
  \n### 理解词嵌入\n\n**Word embeddings** 是词语的机器可解释表示，使得语义相似的词对的嵌入会相似，而语义不相似的词的嵌入会截然不同。\n\
  \n在第一章中，我们介绍了嵌入的基础知识，我们将嵌入松散地定义为特定字符、词语、句子、段落或文本文档的向量表示。这些向量通常由数百或数千个实数组成。向量中的每个位置称为一个维度。\n\
  \n到目前为止，你可能想知道我们如何判断两个词嵌入是否相似或不同。有几种指标，例如余弦相似度、欧几里得距离和 Jaccard 距离，试图量化这一点。**Cosine\
  \ similarity** 通常是最常用的方法。\n\n### 余弦相似度\n\n给定两个嵌入向量 A 和 B，余弦相似度定义如下：\n\n$similarity(\\\
  mathbf{A},\\mathbf{B}) = \\frac{\\mathbf{A}\\cdot\\mathbf{B}}{\\|\\mathbf{A}\\|\\\
  |\\mathbf{B}\\|} = \\frac{\\sum_{i=1}^n A_i B_i}{\\sqrt{\\sum_{i=1}^n A_i^2}\\sqrt{\\\
  sum_{i=1}^n B_i^2}}$\n\n这里，分子的上部分是两个向量的点积，分母的下部分是每个向量的幅度的乘积。\n\n resulting 相似度分数的值介于\
  \ -1 和 1 之间。-1 的值表示向量完全相反。0 的值表示向量正交，意味着没有相关性。1 的值表示向量相似。\n\n例如，如果我们比较代表两位客户音乐品味的两个嵌入向量，其中他们对不同歌曲进行了评分，我们将得到以下结果：\n\
  \n- *similarity*(**A**, **B**) = 1；表示客户对完全相同的歌曲给出了完全相同的评分。\n- *similarity*(**A**,\
  \ **B**) = −1；表示客户对同一首歌曲的评分方式相反。\n- *similarity*(**A**, **B**) = 0；表示客户音乐品味之间没有相关性，意味着他们可能在某些歌曲上达成一致，但在其他歌曲上不一致。\n\
  \n你现在应该对嵌入在 NLP 中的作用和价值有了高层次的理解。现在是时候将理论付诸实践，并通过 Flair 获得处理嵌入的实践经验了。\n\n### “king\
  \ – man ≈ queen – woman” 类比\n\n设计良好且训练充分、维度足够高的嵌入不仅代表或唯一标识某个词或句子，还包含有关词的含义及其语义属性的抽象信息。令人惊讶的是，我们可以使用词向量的算术运算来形成新词。这意味着理论上，如果我们将两个词向量相加，应该会得到一个新词，其含义是这两个词含义的总和。同样，如果我们从一个嵌入向量中减去另一个嵌入向量，我们会得到一个包含第一个词含义减去第二个词含义的新嵌入。这就引出了\
  \ king – man ≈ queen – woman 类比。\n\n如果我们取词 *king* 的词嵌入并从该嵌入向量中减去词 *man*，我们应该会得到一个代表某种性别中性君主的词嵌入。同样，如果我们取词\
  \ *queen* 的词嵌入并从中减去词 *woman*，我们也应该得到一个性别中性君主词的表示。\n\n利用前述假设，我们可以得出以下等式：\n\n*king\
  \ − man ≈ queen − woman*\n\n**Important note**\n请注意我们使用了 *approximately equal to*\
  \ 符号。这意味着即使该说法成立，两个嵌入也只会近似相等。其主要原因在于词嵌入并不是词的完美表示，并且受其维度、训练偏差和训练数据的完整性的限制。两个词对之间的关系也极不可能完全相同。\n\
  \n这个类比所说的是，词 *king* 与 *man* 之间的关系与词 *queen* 与 *woman* 之间的关系非常相似。换句话说，我们可以说：\n\n\
  *king is to man as queen is to woman*\n\n理论上，我们应该能够将这一概念应用于任何共享相似匹配关系的两个词对。为了进一步验证这一假设，让我们用词占位符\
  \ *A*、*B*、*C* 和 *D* 替换我们的君主、*man* 和 *woman*：\n\n*A − B ≈ C − D*\n\n这使我们能够转换该等式以计算\
  \ *D*：\n\n*D ≈ B + C − A*\n\n换句话说，假设我们有以下陈述：\n\n*A is to B as C is to D*\n\n我们现在可以根据词\
  \ A、B 和 C 的词嵌入来计算词 D 的词嵌入。一旦我们得到词 D 的词嵌入，找到其对应的词就很简单了。我们只需搜索整个词汇表的词嵌入并找到匹配最接近的词。\n\
  \n现在是时候用 Flair 来测试我们的类比求解器了。\n\n## 实现\n\n我们将实现一个算法，给定词 A、B 和 C，计算词 D，使得 A 比 B 如同\
  \ C 比 D 的类比成立。例如，给定输入 King is to man as queen is to...，算法将返回 woman。该算法包含以下步骤：\n\n\
  - 1. 选择并实例化我们在 Flair 中使用的嵌入类\n- 2. 获取词 A、B 和 C 的词嵌入\n- 3. 使用 D = B + C − A 公式计算词\
  \ D 的近似词嵌入\n- 4. 获取 Flair 中所有英语词的词嵌入\n- 5. 找到最匹配的词\n\n### 选择并初始化嵌入类\n\n选择嵌入类型时，重要的是我们选择一种非上下文相关的技术，因为我们将独立于可能出现的上下文来计算新词。\n\
  \n因此我们将使用 crawl ID 选择一组经典的随机词嵌入。crawl 嵌入是在网络爬虫数据上训练的英语词嵌入。嵌入对象可以通过运行以下代码简单初始化：\n\
  \n```\nfrom flair.embeddings import WordEmbeddings\nfasttext = WordEmbeddings('crawl')\n\
  ```\n\n首次执行此代码时，Flair 将下载嵌入模型，这会占用一些空间，并且完全下载可能需要几分钟。\n\n为了避免我们再次下载模型，Flair 在下次使用时会确保使用本地存储的版本。\n\
  \n一旦嵌入对象加载完成，我们可以将其保留在内存中并重复使用并传递给后续的辅助函数以节省执行时间。\n\n### 获取词 A、B 和 C 的词嵌入并计算词嵌入\
  \ D\n\n正如我们在前几章学到的，我们可以通过先将词包装在 `Sentence` 对象中来在 Flair 中嵌入词。例如，给定一个如前所述定义的 `fasttext`\
  \ 对象，我们的 `Sentence` 对象可以用 `sentence = Sentence('word')` 定义。然后，我们可以通过运行 `fasttext.embed(sentence)`\
  \ 来嵌入 `Sentence` 对象中的词。我们还可以通过调用 `sentence[0].embedding` 来获取句子中第一个词的词嵌入。这将返回一个 **PyTorch**\
  \ `torch.Tensor` 对象。它可以通过调用 `sentence[0].embedding.tolist()` 转换为向量分量的列表。\n\n有了这些知识，我们可以实现一个\
  \ `compute_embedding_for_D(A, B, C, embedding)` 函数，该函数接收我们的三个词（A、B 和 C）以及一个嵌入对象，并返回计算得到的词\
  \ D 的词嵌入向量。\n\n该方法的实现如下：\n\n```python\nfrom flair.data import Sentence\n\ndef compute_embedding_for_D(A,\
  \ B, C, embedding):\n    wordsABC_sentence = Sentence(' '.join([A, B, C]))\n   \
  \ embedding.embed(wordsABC_sentence)\n\n    A_embedded = wordsABC_sentence[0].embedding\n\
  \    B_embedded = wordsABC_sentence[1].embedding\n    C_embedded = wordsABC_sentence[2].embedding\n\
  \n    D_embedding = B_embedded + C_embedded - A_embedded\n\n    return D_embedding.tolist()\n\
  ```\n\n在此辅助函数的第一部分中，我们定义了 `wordsABC_sentence` 对象，其中包含一个包含我们三个输入词 A、B 和 C 的以空格分隔的字符串。然后我们继续嵌入该句子中的所有词并提取我们三个输入词的词嵌入，从而获得名为\
  \ `A_embedded`、`B_embedded` 和 `C_embedded` 的词嵌入。使用我们的 $D = B + C - A$ 公式和 Python\
  \ 的算术运算符，我们然后简单地计算 `D_embedding` 并将其作为列表返回。\n\n要测试我们的方法，我们可以运行以下代码：\n\n```python\n\
  from flair.embeddings import WordEmbeddings\nfasttext = WordEmbeddings('crawl')\n\
  D = compute_embedding_for_D('king', 'man', 'queen', fasttext)\nprint(D)\n```\n\n\
  这应该打印出我们的 D 词嵌入——一个长数字列表，看起来像这样：\n\n```\n[0.13569998741149902, -0.3856000006198883,\
  \ -0.102299957203865,\n-0.13539999723434448, -0.01410001516342163,\n-0.04699999839067459,\
  \ ...]\n```\n\n鉴于我们的 King is to man as queen is to woman 类比， resulting embedding\
  \ 应该与词 woman 的词嵌入相似。为了验证这一点，我们需要先计算英语词汇表的词嵌入，然后找到最匹配的词。\n\n### 在 Flair 中获取所有英语词的词嵌入\n\
  \n为了获得在英语中在合理程度上可以预期的词列表，我们将从一个大型英语语料库中提取词汇表。这样，我们将获得一套几乎完整的常用英语词，同时去掉英语中很少使用的词，而我们极不可能遇到这些词，从而减少搜索空间并加快代码运行速度。\n\
  \n然后我们将把这些词作为包含词汇表以空格分隔的列表的单个句子的一部分进行嵌入。这只能在使用非上下文词嵌入时完成。如果我们使用上下文字符串嵌入，则必须为每个词单独定义一个\
  \ Sentence 对象。\n\n我们将把解决方案实现为 get_embedded_english_vocab(embedding) 函数，该函数接收嵌入对象并返回一个\
  \ Sentence 对象，其中包含我们的整个词汇表作为标记以及相应的词嵌入：\n\n```python\nfrom flair import datasets\n\
  from flair.data import Sentence\n\ndef get_embedded_english_vocab(embedding):\n\
  \    dataset = datasets.UD_ENGLISH()\n    vocab_list = dataset.make_vocab_dictionary().get_items()\n\
  ```\n\n```\nvocab = Sentence(' '.join(vocab_list))\nembedding.embed(vocab)\nreturn\
  \ vocab\n```\n\nget_embedded_english_vocab(embedding) 函数使用 Flair 的 UD_ENGLISH 英语通用依存树库数据集。它将数据集的整个词汇表连接成一个以空格分隔的字符串，然后将其标记化并作为\
  \ Sentence 对象的一部分进行嵌入。\n\n可以通过运行以下代码来测试前述函数：\n\n```\nfrom flair.embeddings import\
  \ WordEmbeddings\nfasttext = WordEmbeddings('crawl')\nprint(get_embedded_english_vocab(fasttext)[6].embedding)\n\
  ```\n\n在这里，我们初始化一个词嵌入类并将其传递给 get_embedded_english_vocab 函数。然后该片段最终将打印出我们词汇表中第七个词的词嵌入。\n\
  \n鉴于我们现在可以访问英语中可以合理预期的所有词的词嵌入，我们现在可以计算最接近我们计算得到的 D 词嵌入的词。\n\n### 找到最匹配的词\n\n一旦我们计算出\
  \ D 词嵌入，我们最终需要找到词嵌入所代表的词。因为词嵌入极不可能与词汇表中的词完全匹配，所以我们需要使用某种相似度度量来找到最匹配的词。我们将使用余弦相似度。为了找到最匹配的词，我们只需计算\
  \ D 与词汇表中每个词之间的余弦相似度，并选择相似度分数最高的词。这将实现为 find_closest_matching_word(D, vocab, ABC)，其中\
  \ D 是我们计算得到的词嵌入，vocab 是我们嵌入的词汇表，ABC 是词 A、B 和 C 的列表：\n\n```python\nfrom sklearn.metrics.pairwise\
  \ import cosine_similarity as sim\ndef find_closest_matching_word(D, vocab, ABC):\n\
  \    max_match = -1\n```\n\n```\nfor word in vocab:\n    match = sim([D], [word.embedding.tolist()])[0][0]\n\
  \    if match > max_match and word.text not in ABC:\n        max_match = match\n\
  \        closest_matching_word = word.text\nreturn closest_matching_word\n```\n\n\
  前述代码简单地遍历我们的 vocab 对象并计算 D 词嵌入与 vocab 对象中每个词之间的相似度。然后我们选择并返回 closest_matching_word，即我们类比求解器的解决方案。\n\
  \n> 提示\n> 虽然我们使用算术运算来解决类比的想法在理论上是有意义的，但在实践中结果往往不如你预期的那么合理。经常发生的情况是，新计算的词嵌入实际上最接近我们原始词中的一个。当然，我们希望\
  \ D 是一个新词，而不是原始词 A、B 或 C 中的一个。当这种情况发生时，我们可以简单地忽略最匹配的词并选择第二、第三或第四最匹配的词。我们通过在前述 if\
  \ 语句中检查 word.text not in ABC 来实现这一点，从而避免结果是原始词之一并增加产生合理结果的机会。\n\n在实现了类比求解器所需的所有逻辑后，我们现在可以编写一个简单的辅助函数，将所有函数集成在一起并打印出类比谜题的解决方案：\n\
  \n```python\ndef A_is_to_B_as_C_is_to(A, B, C):\n    fasttext = WordEmbeddings('crawl')\n\
  \    result = compute_embedding_for_D(A, B, C, fasttext)\n    vocab = get_embedded_english_vocab(fasttext)\n\
  \    D = find_closest_matching_word(result, vocab, {A, B, C})\n    \n    print(f'{A}\
  \ is to {B} as {C} is to {D}')\n```\n\n\n\n## 速度优化\n\n请注意，在前面的函数中，我们只实例化了一次 WordEmbeddings\
  \ 对象，然后直接将其传递给我们的函数。这提高了求解器的性能。我们还可以做许多其他优化，主要是关于我们如何找到最匹配的词。不是使用 for 循环遍历词汇表并为每个词计算余弦相似度，我们本可以将整个词汇表传递给\
  \ cosine_similarity 方法，该方法允许一次计算多个嵌入对的相似度。\n\n现在是时候尝试我们的解决方案了！\n\n## 尝试类比求解器\n\n\
  我们现在可以尝试几个示例，看看我们的类比求解器在实际中的表现如何：\n\n- `A_is_to_B_as_C_is_to(\"king\", \"man\",\
  \ \"queen\")` 结果如下：\n  ```\n  king is to man as queen is to woman\n  ```\n- `A_is_to_B_as_C_is_to(\"\
  do\", \"did\", \"go\")` 结果如下：\n  ```\n  do is to did as go is to went\n  ```\n-\
  \ `A_is_to_B_as_C_is_to(\"bread\", \"baker\", \"meat\")` 结果如下：\n  ```\n  bread is\
  \ to baker as meat is to butcher\n  ```\n- `A_is_to_B_as_C_is_to(\"London\", \"\
  England\", \"Ljubljana\")` 结果如下：\n  ```\n  London is to England as Ljubljana is\
  \ to Slovenia\n  ```\n- `A_is_to_B_as_C_is_to(\"life\", \"death\", \"beginning\"\
  )` 结果如下：\n  ```\n  life is to death as beginning is to ending\n  ```\n- `A_is_to_B_as_C_is_to(\"\
  big\", \"bigger\", \"small\")` 结果如下：\n  ```\n  big is to bigger as small is to smaller\n\
  \  ```\n- `A_is_to_B_as_C_is_to(\"man\", \"actor\", \"woman\")` 结果如下：\n  ```\n \
  \ man is to actor as woman is to actress\n  ```\n\n前面的代码展示了一些求解器表现惊人良好的示例。然而，公平地说，我们采用了一个小技巧，确保预测的词永远不会是原来的三个词之一，如果没有这个技巧，通常就会出现这种情况。\n\
  \n在本次练习中，我们获得了使用 Flair 进行实践的经验，并加深了对词嵌入的理解和知识。\n\n我们现在将介绍 Flair 支持的各种不同的嵌入类型。\n\n\
  ## Flair 中的经典词嵌入\n\nFlair 中最简单的仍包含词语义信息的嵌入类型称为 **经典词嵌入**。这些嵌入是预训练的、无上下文的，并且不需要预处理。无上下文的特性意味着一个词始终映射到一个预计算的嵌入，而与上下文无关。要使用它们，我们只需通过传入所选嵌入的\
  \ ID 来实例化一个 `WordEmbeddings` 类。然后，我们只需将文本封装到一个 `Sentence` 对象中，并在我们的 `WordEmbeddings`\
  \ 类上调用 `embed(sentence)` 方法。\n\n让我们使用 FastText \"crawl\" 嵌入为几个随机词获取嵌入：\n\n```\n\
  from flair.data import Sentence\nfrom flair.embeddings import WordEmbeddings\n\n\
  embedding = WordEmbeddings('crawl')\nsentence = Sentence(\"one two three one\")\n\
  embedding.embed(sentence)\n\nfor token in sentence:\n    print(token.embedding)\n\
  ```\n\n前面的代码将打印出词 one、two、three 和 one 的嵌入。请注意，我们打印了 one 词元两次。因为 `WordEmbeddings`\
  \ 类是无上下文的，所以第一个和第四个词元的嵌入是相同的。\n\n我们可以用一个简单的检查来验证这一点：\n\n```\ntoken1 = sentence[0]\n\
  token4 = sentence[3]\nprint(token1.embedding.tolist() == token4.embedding.tolist())\n\
  ```\n\n前面的代码将打印出 True，表明同一个词的两个嵌入是等价的。\n\n> **注意**\n> 首次加载嵌入时，Flair 会下载嵌入模型并将其存储在本地。后续调用将使用本地存储的版本。\n\
  \nFlair 目前支持以下类型的经典词嵌入：\n\n- GloVe 嵌入：\n  - ID: `glove` (英语)\n- Komninos 嵌入：\n \
  \ - ID: `extvec` (英语)\n- Twitter 嵌入：\n  - ID: `twitter` (英语)\n- Turian 嵌入（小型）：\n\
  \  - ID: `turian` (英语)\n- 基于网络爬取的 FastText 嵌入：\n  - ID: `crawl` (英语)\n- 基于新闻和维基百科数据的\
  \ FastText 嵌入：\n  - ID: `ar` (阿拉伯语), `bg` (保加利亚语), `ca` (加泰罗尼亚语), `cz` (捷克语), `da`\
  \ (丹麦语), `de` (德语), `es` (西班牙语), `en` (英语), `eu` (巴斯克语), `fa` (波斯语), `fi` (芬兰语),\
  \ `fr` (法语), `he` (希伯来语), `hi` (印地语), `hr` (克罗地亚语), `id` (印度尼西亚语), `it` (意大利语),\
  \ `ja` (日语), `ko` (韩语), `nl` (荷兰语), `no` (挪威语), `pl` (波兰语), `pt` (葡萄牙语), `ro` (罗马尼亚语),\
  \ `ru` (俄语), `si` (斯洛文尼亚语), `sk` (斯洛伐克语), `sr` (塞尔维亚语), `sv` (瑞典语), `tr` (土耳其语),\
  \ `zh` (中文)\n\n你现在应该对如何使用 Flair 的经典词嵌入方法在多种语言中生成简单的词嵌入有了良好的理解。我们现在有了基础和理解，可以继续进入一个稍微复杂但也更有趣的话题，这个话题被认为是\
  \ Flair 卓越序列标注性能背后的原因，即 Flair 的所谓秘密武器 – Flair 嵌入。\n\n## Flair 嵌入\n\n**Flair 嵌入**\
  \ 是一种特殊的上下文字符串嵌入，它将词建模为字符序列。它们是 Flair 卓越序列标注性能背后的原因，也是引入 Flair NLP 框架的本质动机。由 Flair\
  \ 的原创者撰写的 *Contextual String Embeddings for Sequence Labeling* 论文，一篇有趣且易读的文章，精彩地解释了\
  \ Flair 嵌入的内部工作原理。但要从 NLP 工程师的角度把握 Flair 嵌入，我们只需要理解其两个属性：上下文相关性和字符级序列建模。\n\n###\
  \ 理解 Flair 嵌入的上下文相关性\n\n上下文字符串嵌入背后的思想是，每个词嵌入应不仅由其句法-语义含义定义，还应由其出现的上下文定义。这意味着每个词在每种出现的上下文中都会有不同的嵌入。\n\
  \n每个预训练的 Flair 模型都提供一个 **正向** 版本和一个 **反向** 版本。假设你正在处理一种语言，就像这本书一样，使用从左到右的书写方式。正向版本会考虑词之前的上下文——在左侧。反向版本则相反。它会考虑词之后的上下文——在词的右侧。\n\
  \n如果这是真的，那么在两个不同句子的开头出现的两个相同词应该具有相同的正向嵌入，因为它们的上下文为空。让我们来测试一下：\n\n```\nfrom flair.data\
  \ import Sentence\nfrom flair.embeddings import FlairEmbeddings\n\nembedding = FlairEmbeddings('news-forward')\n\
  s1 = Sentence(\"nice shirt\")\ns2 = Sentence(\"nice pants\")\n\nembedding.embed(s1)\n\
  ```\n```\nembedding.embed(s2)\n\nprint(s1[0].embedding.tolist() == s2[0].embedding.tolist())\n\
  ```\n\n在前面的代码中，我们实例化了 news-forward Flair 嵌入，并计算了 nice shirt 上下文中词 nice 的嵌入，以及 nice\
  \ pants 上下文中词 nice 的嵌入。因为我们使用的是正向模型，它只考虑词之前出现的上下文。此外，因为我们的词在其在句子中的位置左侧没有上下文，所以两个嵌入是相同的，代码假设它们是相同的，确实打印出了\
  \ True。\n\n现在让我们在我们关注的词之前加上一些上下文。相同词的不同上下文应该导致两个不同的嵌入：\n\n```\ns1 = Sentence(\"\
  very nice shirt\")\ns2 = Sentence(\"pretty nice pants\")\n\nembedding.embed(s1)\n\
  embedding.embed(s2)\n\nprint(s1[1].embedding.tolist() == s2[1].embedding.tolist())\n\
  ```\n\n在前面的代码中，我们定义了两个句子，它们对词 nice 具有不同的前置上下文，并且因为我们使用的是 news-forward 嵌入模型，所以词 nice\
  \ 的两个嵌入应该是不同的。我们在最后一行验证了这一点，该行假设词 nice 的两个嵌入是等价的。该操作的结果为 False。这表明正向类型的 Flair 嵌入确实考虑了词左侧的上下文。\n\
  \n### Flair 嵌入中的字符级序列建模\n\nFlair 嵌入中使用字符级序列建模有很多好处，但其最容易观察到的优势是它能异常好地处理 **词汇表外 (OOV)**\
  \ 词。一些词嵌入技术，例如 **GloVe**，对 OOV 词不提供支持，并为词汇表中不存在的词返回零向量。OOV 支持不仅为从未出现在原始训练集中的词提供良好的性能，还为拼写错误的词提供支持。\n\
  \n\n\nFlair 的优秀 OOV 词性能可以在以下实验中观察到。我们将为一个正确拼写的词获取一个嵌入，例如词 `potato`。然后，我们将获取其拼写错误版本的嵌入，例如词\
  \ `potatoo`。然后我们将使用余弦相似度来计算这两个词在语义上的相似程度。我们的假设是，一个好的嵌入模型能够识别出第二个词与第一个词非常相似。余弦相似度大于\
  \ 0.8 可以合理地被视为相似嵌入的指标：\n\n```\nfrom sklearn.metrics.pairwise import cosine_similarity\
  \ as sim\n\ns1 = Sentence(\"eating potato\")\ns2 = Sentence(\"eating potatoo\")\n\
  \nembedding = FlairEmbeddings('news-forward')\nembedding.embed(s1)\nembedding.embed(s2)\n\
  e1 = s1[1].embedding.tolist()\ne2 = s2[1].embedding.tolist()\n\nprint(sim([e1],\
  \ [e2]))\n```\n\n前述代码打印出 `eating potato` 上下文中词 `potato` 与 `eating potatoo` 上下文中词\
  \ `potatoo` 之间的余弦相似度。打印出的相似度分数为 0.865，表明这两个词嵌入之间存在强关联。\n\n## 池化 Flair 嵌入\n为了获得更好的性能，您还可以使用\
  \ `PooledFlairEmbeddings`。它使用完全相同的语法接口并支持与 `FlairEmbeddings` 相同的模型集合，但通常能提供轻微的性能提升。请注意，`PooledFlairEmbeddings`\
  \ 需要大量内存，这意味着性能的边际提升可能并不总是值得额外的内存消耗。\n\n## 可用的 Flair 嵌入\n框架中支持的 Flair 嵌入集合不断变化，到您阅读本书时，完整的列表很可能已经过时。但通常，您很可能在以下某一类别中找到所需的嵌入：\n\
  - 在 10 亿词语料库上训练的英语 Flair 嵌入：\n  - ID: `news-DIRECTION`\n- 在 Wikipedia、Opus 或其他大型语料库上训练的\
  \ Flair 嵌入：\n  - ID: `LANGUAGE_CODE-DIRECTION`。\n  - 例如，对于德语 Flair 嵌入的前向版本，使用 `de-forward`。\n\
  - 在生物医学 PubMed 摘要上训练的 Flair 嵌入：\n  - ID: `pubmed-DIRECTION`\n- 支持 300 多种语言的多语言 Flair\
  \ 嵌入：\n  - ID: `multi-DIRECTION`\n\n请注意，使用嵌入 ID 时，术语 `DIRECTION` 需要替换为 `backward`\
  \ 或 `forward`。\n\n若要获取支持的 Flair 嵌入的完整且最新的列表，您应查阅 Flair 的官方文档 at https://github.com/flairNLP/flair/blob/master/resources/docs/embeddings/FLAIR_EMBEDDINGS.md。\n\
  \n在前面的练习中，我们介绍了 Flair 嵌入的基本用法。但您可能问过自己：如何使用 Flair 嵌入以利用出现在词前后完整上下文的方式？这些问题以及许多其他问题将在下一节中得到解答。\n\
  \n## 堆叠嵌入\n**堆叠嵌入** 是一种元嵌入类型，允许我们通过组合两个或多个嵌入来形成新的嵌入。这些元嵌入，正如名称所示，只是将多个嵌入堆叠在一起。它们非常适合组合\
  \ Flair 嵌入的前向和后向版本。它们还可以用于添加其他嵌入类型，例如将上下文字符串嵌入与经典词嵌入混合。事实上，这正是 Flair 建议的组合类型，并且通常能产生最先进的结果。\n\
  \n要使用堆叠嵌入，只需实例化一个 StackedEmbeddings 类，并传入一个嵌入对象列表。然后您就可以以与在 Flair 中使用任何其他嵌入完全相同的方式使用此元嵌入。\n\
  \n让我们在 Flair 推荐的最佳性能嵌入集合上尝试一下。我们将堆叠 glove 词嵌入与 news-forward 和 news-backward Flair\
  \ 嵌入：\n\n```python\nfrom flair.embeddings import FlairEmbeddings, WordEmbeddings\n\
  from flair.embeddings import StackedEmbeddings\n\nglove = WordEmbeddings('glove')\n\
  news_fw = FlairEmbeddings('news-forward')\nnews_bw = FlairEmbeddings('news-backward')\n\
  \ncombined_embeddings_list = [glove, news_fw, news_bw]\n\nstack = StackedEmbeddings(combined_embeddings_list)\n\
  ```\n\n然后您可以在 Sentence 对象上运行 stack.embed(sentence)，就像使用 Flair 中的任何其他嵌入类型一样。\n\n\
  我们现在已经介绍了 Flair 中的主要词嵌入类型。现在是时候提升一个层次，学习如何计算的不仅是词的嵌入，还有整个文档的嵌入。\n\n## 文档嵌入\n文档嵌入与词嵌入类似，唯一的区别是，我们不是为每个词获取一个嵌入，而是为整个文档获取一个嵌入。\n\
  \n在 Flair 中，文档可以在 Sentence 对象内部定义。不是通过 sentence[n].embedding 访问嵌入（这将返回第 n 个词的嵌入），我们只需运行\
  \ sentence.embedding 或 sentence.get_embedding()。\n\nFlair 目前支持以下嵌入类型：\n- TransformerDocumentEmbeddings,\
  \ 使用预训练的 Hugging Face transformers 的文档嵌入类。\n- DocumentPoolEmbeddings, 一个元文档嵌入类，接收词嵌入对象，计算每个词的嵌入，并返回所有词嵌入的平均值。\n\
  - DocumentRNNEmbeddings, 一个元文档嵌入类，接收词嵌入对象，在整个文档上训练循环神经网络，并将最终状态作为该文档的嵌入返回。\n- SentenceTransformerDocumentEmbeddings,\
  \ 使用外部 sentence-transformers 库的文档嵌入类。该库需要单独安装。\n\nFlair 建议在文档分类任务中使用 TransformerDocumentEmbeddings\
  \ 类。让我们尝试一下：\n\n```\nfrom flair.data import Sentence\nfrom flair.embeddings import\
  \ TransformerDocumentEmbeddings\n\nembedding = TransformerDocumentEmbeddings('bert-base-uncased')\n\
  \nsentence = Sentence('Example sentence .')\nembedding.embed(sentence)\n\nprint(sentence.embedding)\n\
  ```\n\n前述代码将打印出代表我们句子的单个嵌入。\n\n请注意，在前述代码示例中，我们将 bert-base-uncased 嵌入 ID 传递给了 TransformerDocumentEmbeddings\
  \ 类。这是我们决定使用的变换器模型名称。您可以从 Hugging Face transformer 模型库中选择任何其他兼容模型。\n\n## Flair 中的其他嵌入\n\
  在本章中，我们介绍了 Flair 最先进性能背后的大多数嵌入类型和技术，尽管本书中仍有许多其他嵌入类型未作解释。\n\n包括以下内容：\n- ELMoEmbeddings:\
  \ 使用双向 LSTM 的上下文嵌入\n- OneHotEmbeddings: 每个词都是 one-hot 向量的嵌入\n- BytePairEmbeddings:\
  \ 在子词级别预计算的嵌入\n- `TransformerWordEmbeddings`: 使用基于变换器架构的嵌入\n- `CharacterEmbeddings`:\
  \ 每次初始化类时随机设置的字符级嵌入\n\n虽然这些嵌入的内部工作原理超出了本书的范围，即使不完全理解它们的工作原理，您现在也应该能够像使用 Flair 中的任何其他嵌入对象一样使用它们，因为它们都共享相同的接口。\n\
  \n## 总结\n在本章中，我们介绍了 Flair 中的嵌入。它们是所有 NLP 任务的核心概念。我们通过动手实践练习了解了嵌入的行为方式、其作用以及如何在 Flair\
  \ 中使用它们。\n\n我们实现了一个 NLP 类比求解器，可以使用算术运算和词嵌入之间的关系预测类比中的最后一个词。通过这样做，我们不仅复习了如何在实践中使用\
  \ Flair 的基本类型，还说明了词嵌入是什么以及如何从中推导出含义。然后我们还介绍了 Flair 中的所有嵌入类型。我们首先介绍了经典词嵌入，然后是 Flair\
  \ 嵌入。\n\n使用元嵌入方法，我们使用了堆叠嵌入并将多个嵌入组合成新的嵌入——这是一种在 Flair 中实现最先进结果的技术。然后我们获得了在 Flair\
  \ 中形成文档嵌入的实践经验，并以超出本书范围的嵌入类型列表结束了本章。\n\n在下一章中，我们将学习 Flair 如何利用这些嵌入来生成 NLP 中性能最佳的序列标注器之一。\n\
  \n\n\n## 4\n## 序列标注\n\n**序列标注** (或 **序列标记**) 指的是一组 **自然语言处理** (**NLP**) 任务，它们为文本的词元或其他单元分配标签或标记。当标签为命名实体时，我们就是在处理\
  \ **命名实体识别** (**NER**) 。当标签为词性时，此任务称为 **词性** (**PoS**) 标注。与以无监督方式训练的嵌入不同，序列标注器使用监督训练技术进行训练，使其更容易评估和比较。\n\
  \n**序列标注** 是 **Flair** 真正大放异彩的领域。**Flair** 利用 **Flair** 嵌入的巧妙设计（在上一章中解释），在许多不同的序列标注任务和语言中实现最先进的结果。\n\
  \n在本章中，我们将简要解释 **Flair** 中序列标注器的工作原理。这将使我们在介绍 **NER**、**PoS** 标注、分块以及 **Flair**\
  \ 中找到的其他序列标注技术时，能够充分理解其内部工作原理。这些部分获得的知识将帮助您了解 **Flair** 解决的序列标注任务范围以及可供您使用的预训练模型。我们随后将展示在\
  \ **NLP** 中通常用于衡量和比较序列标注器性能的指标。\n\n我们将在以下部分介绍 Flair 中的序列标注：\n\n- 理解 Flair 中序列标注的工作原理\n\
  - Flair 中的命名实体识别\n- Flair 中的词性标注\n- Flair 中的其他序列标注器\n- 序列标注指标\n\n### 技术要求\n\n对于本章，您需要一个安装了\
  \ Flair 版本 0.11 的 **Python** 环境。\n\n本章涵盖的代码示例可在本书官方 GitHub 仓库的以下 **Jupyter Notebook**\
  \ 中找到：\n\n```\nhttps://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter04.\n\
  ```\n\n### 在 Flair 中理解序列标注\n\n在直接深入了解如何在 Flair 中使用序列标注器之前，让我们先简要解释序列标注（也称为序列标记）的工作原理。从工程角度来看，序列标注器是一个工具，它接收文本作为输入并返回一系列分配，其中每个分配包含一个标签名称和一个跨度，指示标注的文本单元（通常是单词）的开始和结束位置。\n\
  \nFlair 中序列标注的架构和设计可以用下图最好地解释：\n\n![](img/c56c48b8fd18a11ab705352d618ed976_62_0.png)\n\
  \n图 4.1 - Flair 中序列标注的概述\n\n上图显示了由两个组件组成的序列标注架构：语言模型（黄色）和序列标注（标记）模型（蓝色）。双向字符语言模型接收原始文本作为输入，并为每个单词计算上下文嵌入（r_George,\
  \ r_Washington, r_was, r_born）。然后将它们传递给 BiLSTM-CRF 序列标注器。这种特殊的标注器是一种新颖的序列标注方法，它使用双向\
  \ LSTM（BiLSTM）循环神经网络模型与条件随机场（CRF）——一种组合算法相结合。它输出与各个单词对应的标签的概率分布。然后为每个单词选择最可能的标签（如前图所示的顶行所示）。例如，在前图中，单词\
  \ Washington 被标记为 E-PER，其中 PER 表示该词与人相关，E 标记了双词命名实体块的结尾。单词通常还会被标记为特殊标签 O（意为其他），用于不被视为命名实体或不属于任何定义类别的命名实体的单词。\n\
  \n上图用最常见的序列标注应用之一——NER 说明了序列标注器的设计。让我们在下一节学习如何在 Flair 中使用它。\n\n### 在 Flair 中进行命名实体识别\n\
  \nNER 是一种特殊的序列标注任务，用于识别和标记命名实体。命名实体是现实世界中的对象，例如人、地点或组织。可能的不同命名实体的集合没有严格定义，可能因模型而异。Flair\
  \ 附带丰富的预训练 NER 模型，以及训练自定义模型的工具。在本节中，我们将重点介绍预训练模型，以及如何解释和理解其输出。\n\n为了很好地理解 Flair\
  \ 中 NER 标注的工作原理，让我们作为练习的一部分来尝试一下。我们将从标记一个明显是命名实体的单个单词开始。\n\n```\nfrom flair.data\
  \ import Sentence\nfrom flair.models import SequenceTagger\n\ntagger = SequenceTagger.load('ner')\n\
  sentence = Sentence('Berlin')\ntagger.predict(sentence)\n\nprint(sentence.to_tagged_string())\n\
  ```\n\n在前面的脚本中，我们通过调用 SequenceTagger.load('ner') 将 Flair 的默认英文 NER 标注器加载到内存中。然后我们用单个单词\
  \ Berlin 标记了一句话。最后，我们打印出了标记后的句子。输出如下：\n\n```\nSentence: \"Berlin\" → [\"Berlin\"\
  /LOC]\n```\n\n第一次使用 ner 标注器时，您还会看到下载进度条以及模型托管在 HuggingFace ModelHub 上的通知。\n\n前面的\
  \ NER 标注代码片段打印出：\"Berlin\"/LOC。这表明标注器认为在给定上下文（或缺乏上下文）中，单词 Berlin 是一个地点，因为它被标记为 LOC。\n\
  \nNER 类别集会因模型而异，即使在 Flair 内部也是如此，但大多数 NER 标注器会使用以下类别对实体进行分类：\n\n- 人\n- 地点\n- 组织\n\
  - 杂项\n\n让我们看另一个例子，这是介绍 Flair 给 NLP 世界的论文中使用的例子。它展示了一个案例，其中 Flair 出色的词义消歧性能真正大放异彩：\n\
  \n```\ntagger = SequenceTagger.load('ner')\ntext = 'George Washington was born in\
  \ Washington.'\nsentence = Sentence(text)\ntagger.predict(sentence)\n\nprint(sentence.to_tagged_string())\n\
  ```\n\n前面的脚本将打印：\n\n```\nSentence: \"George Washington was born in Washington .\"\
  \ → [\"George Washington\"/PER, \"Washington\"/LOC]\n```\n\n上述输出清楚地显示了 Flair 如何区分作为地点的\
  \ Washington（标记为 LOC）和作为人的 Washington（标记为 PER）。\n\n### Flair 中的 NER 标注器类型\n\nFlair\
  \ 的预训练 NER 模型分为单语或多语 NER 模型。\n\n**单语 NER 模型** 是在单一语言上训练的。它们经过调优以实现该单一语言的最佳性能，同时不提供对任何其他语言的支持。\n\
  \n最值得注意的预训练单语 NER 标注器如下：\n\n- 在 Conll-03 数据集上训练的英文（4 类）NER 标注器。\n  ID: ner.\n- 在\
  \ Conll-03 数据集上训练的英文（4 类）NER 标注器，尺寸减小，速度提高，但准确率降低。\n  ID: ner-fast.\n- 在 Conll-03\
  \ 数据集上训练的英文（4 类）NER 标注器，准确率提高，但速度降低且尺寸增加。\n  ID: ner-large.\n- 在 Ontonotes 数据集上训练的英文（18\
  \ 类）NER 标注器。\n  ID: ner-ontonotes.\n- 在 Conll-03 数据集上训练的德文（4 类）NER 标注器。\n  ID: de-ner.\n\
  - 在 WikiNER 数据集上训练的法文（4 类）NER 标注器。\n  ID: fr-ner.\n- 在 Conll-03 数据集上训练的西班牙文（4 类）NER\
  \ 标注器。\n  ID: es-ner-large.\n\n与前面的单语模型不同，Flair 还支持多语 NER 模型。它们在每种特定语言上的准确率确实明显较低，但带来的好处是可以让我们使用单一模型处理多种语言。Flair\
  \ 的多语 NER 模型在英语、德语、荷兰语和西班牙语上训练。这些模型可以使用 ner-multi 和 ner-multi-fast ID 加载。\n\n您现在应该很好地了解如何在\
  \ Flair 中使用 NER 标注器并解释其结果。我们现在可以继续介绍标注器，它们不是标记命名实体，而是标记词性。\n\n\n\n## Flair 中的词性标注\n\
  \nPoS 标注器负责为词元标注/标记其对应的词性。简化的词性类别集合包括名词、动词、形容词和副词。然而，Flair 中的大多数标注器使用更大、更具描述性的标签集。例如，Penn\
  \ 标签集包含 36 种不同的标签。\n\n标注过程和 PoS 标注语法与 Flair 中的 NER 或任何其他标注任务没有区别。加载 PoS 标注器时唯一的差别在于选择与我们所选\
  \ PoS 标注器相对应的正确标注器 ID。\n\n让我们使用 pos 标注器 ID 来尝试 Flair 中的默认英语 PoS 标注器：\n\n```python\n\
  from flair.data import Sentence\nfrom flair.models import SequenceTagger\n\ntagger\
  \ = SequenceTagger.load('pos')\nsentence = Sentence('Making a living')\ntagger.predict(sentence)\n\
  \nprint(sentence.to_tagged_string())\n```\n\n在前面的脚本中，我们加载了 Flair 的默认英语 pos 标注器并对一个示例句子进行了标注。然后我们打印出了\
  \ resulting 标注句子。输出结果以及首次使用标注器时的下载条如下：\n\n```\nSentence: \"Making a living\" → [\"\
  Making\"/VBG, \"a\"/DT, \"living\"/NN]\n```\n\n从前面的输出中，我们可以看到我们的句子，由 Making、a 和\
  \ living 词元组成，被分别标注为 VBG、DT 和 NN 标签。这意味着单词 Making 被标注为现在分词的动词，单词 a 被标注为限定词，单词 living\
  \ 被标注为单数名词。这表明标注器很好地处理了词义消歧，因为单词 living 根据上下文可以是动词也可以是名词。\n\n为了充分理解 Flair 中英语 PoS\
  \ 标注器产生的每个单独标签的含义，我们需要参考 Penn 标签集的文档。\n\n## 词性标注标签集\n\n前面脚本中的 PoS 标注器使用 **Penn Treebank\
  \ Project PoS tag set**。它是一个标准化的标签集，包含 36 种不同的 PoS 标签。它允许研究人员使用一个标准，以便在不同标注器之间比较结果。它最初用于标注\
  \ **The Penn Treebank Project** 中的语料库，但今天已在许多不同的数据集中使用。\n\nPenn 标签集包含以下 36 个标签：\n\
  \n- CC: 并列连词\n- CD: 基数词\n- DT: 限定词\n- EX: 存在性 there\n- FW: 外来词\n- IN: 介词或从属连词\n\
  - JJ: 形容词\n- JJR: 形容词，比较级\n- JJS: 形容词，最高级\n- LS: 列表项标记\n- MD: 情态动词\n- NN: 名词，单数或不可数\n\
  - NNS: 名词，复数\n- NNP: 专有名词，单数\n- NNPS: 专有名词，复数\n- PDT: 前限定词\n- POS: 所有格结尾\n- PRP:\
  \ 人称代词\n- PRP$: 所有格代词\n- RB: 副词\n- RBR: 副词，比较级\n- RBS: 副词，最高级\n- RP: 小品词\n- SYM:\
  \ 符号\n- TO: To\n- UH: 感叹词\n- VB: 动词，原形\n- VBD: 动词，过去时\n- VBG: 动词，动名词或现在分词\n- VBN:\
  \ 动词，过去分词\n- VBP: 动词，非第三人称单数现在时\n- VBZ: 动词，第三人称单数现在时\n- WDT: 疑问词限定词\n- WP: 疑问词代词\n\
  - WP$: 所有格疑问词代词\n- WRB: 疑问词副词\n\n大多数英语 PoS 标注器可能会使用此标签集或其略有修改的版本。然而，与 NER 标注不同，NER\
  \ 类别通常在多种语言中使用，Penn 集标签非常特定于英语，不能有效地直接用于许多非英语语言。解决此问题的方法是通用 PoS 标签集。它定义了一个简化的通用标签集，可在多种语言中使用。\n\
  \n通用 PoS 标签集定义了以下 PoS 标签：\n\n- VERB: 动词（所有时态和语气）\n- NOUN: 名词（普通名词和专有名词）\n- PRON:\
  \ 代词\n- ADJ: 形容词\n- ADV: 副词\n- ADP: 介词（介词和后置词）\n- CONJ: 连词\n- DET: 限定词\n- NUM: 基数词\n\
  - PRT: 小品词或其他功能词\n- X: 其他：外来词、拼写错误、缩写\n- .: 标点符号\n\n前面的标签不那么特定于英语，可在多种语言中使用。它们用于\
  \ Flair 的多语言 PoS 标注器（将在下一节中详细介绍）。\n\n## Flair 中的 PoS 标注器类型\n\nFlair 提供了多个预训练的 PoS\
  \ 标注器。就像 NER 标注器一样，Flair 的 PoS 标注器可分为单语言或多语言标注器。\n\nFlair 中的单语言预训练 PoS 标注器在单一语言上训练，并且经常使用特定于语言的标签集。\n\
  \n一些常用的标注器描述如下：\n\n- 在 `Ontonotes` 数据集上训练的英语 PoS 标注器，使用 Penn 标签集。\n  ID: `pos`\n\
  - 英语 PoS 标注器的更快、更轻但准确率较低的版本，在 `Ontonotes` 数据集上训练，使用 Penn 标签集。\n  ID: `pos-fast`\n\
  - 使用通用 POS 标签集训练的英语 PoS 标注器。\n  ID: `upos`\n- 使用通用 POS 标签集的 `upos` 标注器的更快、更轻但准确率较低的版本。\n\
  \  ID: `upos-fast`\n- 在 `UD German - HDT` 数据集上训练的德语 PoS 标注器。\n  ID: `de-pos`\n\n\
  前面的标注器在它们所训练的语言上会达到最佳性能，但在任何其他语言上都不会表现良好。为了处理多语言语料库，Flair 提供了一组多语言 PoS 标注器。它们在 12\
  \ 种语言上训练：英语、德语、法语、意大利语、荷兰语、波兰语、西班牙语、瑞典语、丹麦语、挪威语、芬兰语和捷克语。要加载它们，只需使用 `pos-multi` 或\
  \ `pos-multi-fast` 标注器 ID 即可。\n\n## Flair 中的其他标注任务\n\n虽然 PoS 和 NER 标注是最常用的两种序列标注任务，但\
  \ Flair 支持许多其他任务。这在 Flair 中成为可能，因为其序列标注架构并非针对特定的序列标注任务而设计。它可以处理任何任务，只要训练语料库和标注以与\
  \ Flair 兼容的格式存储即可。\n\nFlair 预训练模型解决的其他序列标注任务包括分块、语义框架检测，以及生物医学文本中的否定和推测标注等领域特定标注器。\n\
  \nFlair 官方文档中提到的每个序列标注器都附带一个准确率分数。根据你感兴趣的序列标注器，用于计算的指标可能不同。为了充分理解这些分数的含义，我们需要了解用于计算它们的指标。我们将在下一节中介绍这一点。\n\
  \n## 序列标注指标\n\n在比较一个序列标注器与另一个时，我们不能简单地手动尝试并随意猜测哪个表现更好。它们的性能需要使用相同的数据集进行评估，并使用相同的预定义指标计算。序列标注中最常用的指标是准确率和\
  \ F1 分数。\n\n## 序列标注任务的准确率测量\n\n准确率是一个介于 0 到 1 之间的度量，简单地计算正确标注词元的比例。\n\n假设 `correctly_tagged_tokens`\
  \ 是正确标注词元的数量，`all_tokens` 是所有词元的总数量，准确率可以定义为：\n\naccuracy = correctly_tagged_tokens\
  \ / all_tokens\n\n前面的公式简单且提供易于解释的结果，但在处理不平衡数据集（类别/标签名称代表不均等的数据集）时，该指标可能会具有误导性。这在\
  \ NER 中尤其明显，其中大多数词元属于单一类别。例如，准确率为 85% 的 NER 标注器听起来相当不错。但当我们查看 NER 数据集中标签的分布时，会注意到大多数词元都被标记为\
  \ O（其他）标签，表示非命名实体。假设语料库中 85% 为非命名实体，一个将所有词元都标记为 O 的模型默认即可达到 85% 的准确率。为了解决这个问题，我们可以使用另一种称为宏观\
  \ F1 分数的指标。\n\n\n\n## 衡量序列标注任务的 F1 分数\n\nF1 分数是另外两个指标称为 *精确率* 和 *召回率* 的调和平均值。其取值范围从\
  \ 0（最差可能分数）到 1（最佳可能分数）。\n\n在序列标注中，*精确率* 定义为学习系统找到的命名实体中正确的百分比。其定义如下：\n\n$$precision\
  \ = \\frac{tp}{tp + fp}$$\n\n*召回率* 是语料中存在的命名实体被系统识别出的百分比。其定义为：\n\n$$recall = \\\
  frac{tp}{tp + fn}$$\n\n以下适用：\n\n- **真阳性** (*tp*)：被正确标注为特定标签的 token 数量。例如，如果某个 token\
  \ 在训练数据中被标注为名词，而我们的标注器也将其标注为名词标签，则视为真阳性。\n- **假阳性** (*fp*)：被错误标注为特定标签的 token 数量。例如，如果某个\
  \ token 在训练数据中被标注为动词，但我们的标注器却将其标注为名词标签。\n- **假阴性** (*fn*)：本应被标注为特定标签但未被标注的 token\
  \ 数量。例如，如果某个 token 在训练数据中被标注为名词，但我们的标注器却将其标注为动词标签。\n\nF1 分数随后被定义为精确率和召回率的调和平均值。\n\
  \n$$F1 = 2 \\cdot \\frac{precision \\cdot recall}{precision + recall}$$\n\n因此计算\
  \ F1 分数的过程涉及以下步骤：\n\n- 统计真阳性、假阳性和假阴性\n- 使用上述公式计算 *精确率* 和 *召回率*\n- 将 F1 分数计算为 *精确率*\
  \ 和 *召回率* 的调和平均值\n\n如果我们分别计算每个标签（例如每个命名实体）的 F1 分数，然后对所有 F1 分数取平均，就得到宏观 F1 分数。该指标考虑了语料中标签表示不均的情况。\n\
  \n如果我们将所有标签的总真阳性、假阴性和假阳性合并计算 F1 分数，就得到 *微观 F1 分数*。该指标在单标签问题（标注器中一个 token 最多只能分配一个标签）中的值与准确率相同。\n\
  \n下次评估报告的序列标注器结果时，请注意 F1 分数指的是微观还是宏观变体。Flair 结果中（在未明确指定时）最常使用的变体是微观 F1 分数。\n\n##\
  \ 摘要\n\n通过本章获得的知识，我们不仅能够使用 Flair 中提供的许多预训练序列标注器，还能够解释和理解其输出。\n\n在本章中，我们从不同角度介绍了\
  \ Flair 中的序列标注。我们涉及了 Flair 提出的序列标注器的设计和架构。然后我们介绍了 NER 的动机和理论，以及可在 Flair 中找到的预训练\
  \ NER 标注器。我们对词性标注也做了同样的处理，其中我们介绍了最著名的标签集，例如宾州标签集和通用词性标签集，然后介绍了 Flair 中找到的重要预训练词性标注器。最后我们研究了用于评估序列标注器最常用的两个指标，并强调了区分微观和宏观\
  \ F1 分数的重要性。\n\n在下一章中，我们将研究如何使用 Flair 来训练、存储和重用您自己的序列标注模型。\n"
