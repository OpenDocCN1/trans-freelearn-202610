  \ 100% 减少到原始大小的 1% 的代码片段吗？通过这样做，我们大大提高了模型训练的速度，这使我们能够更快地进行超参数优化，但与此同时，我们也将模型集中在非常小且可能有偏的数据子集上。要对英语数据集进行适当的超参数调优，我们需要在\
  \ 100% 语料库大小下进行，并考虑更多超参数选项。这将大大增加我们的搜索空间和执行时间，但也会提高我们模型的性能。这些发现导致了以下结论。\n\n## 摘要\n\
  \n超参数调优是一种非常有用的技术，可用于寻找最佳超参数，不仅在序列标注中，而且在机器学习的许多领域中。然而，它是有代价的；它非常昂贵。从本质上讲，它会执行训练和评估过程数十次、数百次甚至数千次。但在现实世界中，探索每个可能有用的超参数值可能需要数月时间来执行，并且搜索空间通常会缩小到一组有限的可能有用的选项。因此，超参数调优是一个需要一定专业知识和经验的过程，这将帮助您在探索（尝试不同尚未探索的选项）和利用（将参数值缩小到通常似乎有效的那些）之间实现正确的权衡。\n\
  \n作为本章的一部分，我们学习了为什么超参数调优有用、何时使用它以及如何使用它。我们学习了如何在 Python 中以最纯粹的形式使用超参数调优库，以及如何通过\
  \ Flair 调优序列标注模型。\n\n在下一章中，我们将介绍超参数调优证明有用的又一个 NLP 问题 – 训练嵌入。\n\n## 7 训练自己的嵌入\n\n\
  Flair 序列标注器之所以能取得如此出色的性能，主要是归功于其秘密武器 – Flair 嵌入。它们的上下文设计、基于字符的事实以及在反向-前向配置中使用的[content]\n\
  ```\ntag_type = 'pos'\n### 将语料库下采样到原始大小的 1%\ncorpus.downsample(0.01)\n```\n\n在前面的代码片段中，我们将英语语料库加载到\
  \ corpus 变量，将标签类型定义为 PoS 标注，然后将语料库下采样到原始大小的 1%，以加快演示训练。\n\n然后我们可以使用 hp.choice 参数表达式定义搜索空间：\n\
  \n```\nfrom flair.embeddings import WordEmbeddings\nfrom flair.hyperparameter.param_selection\
  \ import \\\n    SearchSpace, Parameter\nfrom hyperopt import hp\n\nsearch_space\
  \ = SearchSpace()\nsearch_space.add(Parameter.HIDDEN_SIZE,\n                 hp.choice,\n\
  \                 options=[128, 256])\nsearch_space.add(Parameter.LEARNING_RATE,\n\
  \                 hp.choice,\n                 options=[0.05, 0.1, 0.15, 0.2])\n\
  search_space.add(Parameter.EMBEDDINGS,\n                 hp.choice,\n          \
  \       options=([WordEmbeddings('en')]))\n```\n\n前面的代码片段定义了搜索空间，包含三个超参数。我们为学习率和模型隐藏层大小选择了一些可能有用的值。虽然使用\
  \ hyperopt.hp.quniform 和 hyperopt.hp.uniform 可能效果更好，但会大幅增加搜索空间。当前搜索空间很小，只有八种组合，即两个隐藏层选项乘以四个学习率选项。\n\
  \n> **重要说明**\n> 进行超参数优化时，Flair 中的某些超参数是强制性的，包括 `Parameter.EMBEDDINGS` 和 `Parameter.LEARNING_RATE`\
  \ 参数。若不想优化这些参数，只需为这些超参数的搜索空间传递单个选项即可。\n\n我们现在准备定义 SequenceTaggerParamSelector 对象：\n\
  \n```\nfrom flair.hyperparameter.param_selection import \\\n    SequenceTaggerParamSelector\n\
  \nparam_selector = SequenceTaggerParamSelector(corpus,\n                       \
  \                       tag_type,\n                                            \
  \  'paramopt')\n```\n\n这使用加载的语料库、定义的 PoS 标签类型以及 `paramopt` 文件夹名称定义了超参数优化对象，调优结果将写入该文件夹。\n\
  \n我们只需传入搜索空间和评估次数即可开始优化。在本例中搜索空间离散，次数明确为 8。但在大多数非离散参数情况下，可能的组合数无限，评估次数需经验选择：\n\n\
  ```\nparam_selector.optimize(search_space, max_evals=8)\n```\n\n前面的代码将用 8 种超参数组合训练\
  \ 8 个序列标注器。以 loss 作为 `objective` 函数在开发集上评估，每个运行训练 50 个 epoch。Flair 的 Hyperopt 实现使用\
  \ TPE 优化器。在普通 CPU 上执行约需 10 到 30 分钟。\n\n优化完成后，结果写入 `paramopt/param_selection.txt`。文件包含每次评估的细节及以下摘要：\n\
  \n```\nbest parameter combination\n    embeddings: 0\nhidden_size: 1\nlearning_rate:\
  \ 3\n```\n\n摘要表明最佳隐藏层大小为第二个选项，即 256；最佳学习率为第四个选项 0.2。嵌入因只有一个选项而被选中。\n\n这是否意味着英语中应始终使用隐藏层大小\
  \ 256 和学习率 0.2？简短回答是否。最优超参数取决于数据、问题和技术。前面我们将语料库从 100% 降到 1%，虽加快训练和优化，但也使模型聚焦于很小且可能有偏的子集。对英语数据集进行恰当调优需在\
  \ 100% 语料库上进行并考虑更多选项，这会大幅增加搜索空间和时间，但也能提升性能。由此得出以下结论。\n\n## 摘要\n\n超参数调优是寻找最优超参数的有用技术，不仅适用于序列标注，也适用于机器学习的许多领域。但代价高昂，本质上需重复训练和评估数十、数百甚至数千次。现实中探索所有可能值可能需数月，搜索空间通常被限制为有限的有用选项。因此超参数调优需要一定专业知识和经验，以在探索和利用之间取得正确平衡。\n\
  \n本章我们学习了超参数调优为何有用、何时使用、如何使用，以及如何在 Python 中以纯形式使用调优库并通过 Flair 调优序列标注模型。\n\n下一章将介绍超参数调优同样有用的另一个\
  \ NLP 问题 – 训练嵌入。\n\n## 7 训练自己的嵌入\n\nFlair 序列标注器出色性能主要归功于其秘密武器 – Flair 嵌入。其上下文设计、基于字符以及反向-前向配置的使用，使其非常适合序列标注任务。但到目前为止，本书尚未重点介绍这些嵌入的实际训练方法。\n\
  \n上一章介绍模型训练和词嵌入时，我们仅使用了 Flair Python 包提供的预训练嵌入。但在许多 NLP 问题中，预训练嵌入可能不足。\n\n使用 flair\
  \ 时，您可能需要处理 Flair 预训练嵌入尚未覆盖的语言，或需要针对特定语料库训练的嵌入。此时可使用 Flair 的内置类训练自己的 Flair 嵌入，后续用于训练序列标注器或解决其他下游\
  \ NLP 任务。\n\n我们将先解释为何以及在何种情况下训练自定义嵌入有用。介绍 Flair 嵌入的工作原理及其在下游序列标注任务上的出色表现。然后聚焦词嵌入的评估方法。最后通过在世界上最小语言上的动手练习训练自己的嵌入。\n\
  \n本章将涵盖训练 Flair 词嵌入的以下部分：\n\n- 理解自定义 Flair 嵌入的原理和原因\n- 评估词嵌入\n- 在世界上最小的语言上训练 Flair\
  \ 嵌入\n\n## 技术要求\n\n本章练习需要 Flair 版本 0.11 以及 `requests` Python 包已安装在开发机器上。\n\n本章代码示例可在本书官方\
  \ GitHub 仓库的以下 Jupyter 笔记本中找到：`https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter07.`\n\
  \n## 理解自定义 Flair 嵌入的原理和原因\n\n词嵌入在序列标注模型性能中起着重要甚至必不可少的作用。嵌入的细节在 *第 3 章，Flair 中的嵌入*\
  \ 中介绍。但本章需了解嵌入本质上是词表示，通常以实值向量形式存在。这些向量可作为下游任务的输入，如 **词性** (**PoS**) 标注和 **命名实体识别**\
  \ (**NER**)。首先简要介绍 Flair 如何生成嵌入及训练方式。\n\n## 为什么训练嵌入很少真正意味着训练嵌入\n\n术语 **训练嵌入** 常令人困惑，可追溯到旧方法，当时训练嵌入的结果是一组词嵌入。在\
  \ Flair 的训练方式下该术语意义不大，尤其嵌入是上下文且基于字符。对于传统嵌入如 **GloVe**，训练后可为字典中每个词记住一个嵌入。此时不完全理解\
  \ Flair 嵌入设计的人可能会问：\n\n*鉴于 Flair 的嵌入是上下文的，这是否意味着训练嵌入的过程会导致为字典中每个词在每个可能上下文中预先计算一个嵌入？*\n\
  \n\n\n答案是否定的。 对于基于词的、非上下文词嵌入，可能的嵌入数量确实受限于词典中的词数。 但是，由于 Flair 嵌入可以对任何给定上下文中的几乎任何字符序列（不一定是已知词）进行建模，因此可能的嵌入数量是难以想象的庞大。\
  \ 这是由于以下原因：\n\n- Flair 嵌入是上下文相关的，这意味着同一个词放在不同的上下文中会产生不同的嵌入。\n- Flair 嵌入是在没有明确的词概念的情况下训练的。\
  \ 词被建模为字符序列。\n\n当我们谈论训练 Flair 嵌入时，我们实际上并不是在谈论预先计算嵌入本身。 相反，我们是在谈论训练语言模型。 让我们进一步了解这一点。\n\
  \n## Flair 嵌入背后的思想\n\n训练 Flair 嵌入实际上是一个训练语言模型的过程。 Flair 嵌入模型本质上是语言模型，它们根据某些上下文（\
  \ surrounding text）预测下一个字符。 Flair 使用基于长短期记忆（LSTM）循环神经网络节点的语言模型。 这些节点能够处理序列数据。\n\n\
  > **什么是语言模型？**\n> 简单来说，语言模型是一种对文本字符串的概率分布进行建模的工具。 它通常根据某些上下文（前文）为每个可能的字符、词或词序列分配一个概率。\
  \ 直到深度学习的出现，流行的语言模型类型是统计 n-gram 模型； 但是，更近期的基于神经网络的方法 consistently outperform n-gram\
  \ 模型。 经典 n-gram 模型仍然有一些优势。 与大多数神经模型不同，n-gram 模型不需要太多数据，并且在大小方面可以非常轻量。\n\n基于字符的语言模型将输入文本作为字符序列接收，并被训练以预测下一个字符。\
  \ 然后模型被训练以学习根据过去的字符预测可能下一个字符的概率分布。\n\n*那么，预测下一个字符与词嵌入有什么关系？*\n\n训练好的 Flair 语言模型本质上是生成词嵌入的模型。\
  \ 首先，我们将整个上下文（围绕我们词的文本），包括我们想要计算嵌入的词，作为输入传递给模型。 然后，我们不关注预测的字符，而是关注 LSTM 单元的一个特殊值，称为隐藏状态。\
  \ 我们提取词中最后一个字符之后的隐藏状态，这就是我们的词嵌入。\n\n很明显，上下文会影响某些词的语义。 但是，你可能会想，是文本在词 *之前* 影响词的含义，还是词\
  \ *之后* 的文本影响其含义。 答案是两者兼有。\n\n## 前向-后向嵌入堆栈\n\nFlair 嵌入中一个精妙的设计概念是它们使用后向-前向嵌入堆栈的方式，这有助于它们实现出色的性能。\n\
  \n**前向模型** 考虑词之前的整个上下文以及词本身。 它捕捉了受词前文本影响的词的语义含义。 但是，该模型实际上并没有考虑到我们试图计算嵌入的词之后的全部词。\
  \ 为了实现这一点，我们需要构建一个反向工作的模型。 我们需要构建一个 **后向模型**。\n\n后向模型以相反的方向处理词。 对于英语而言，这意味着从右到左。\
  \ 它考虑词之后的全部上下文加上词本身。 该模型捕捉了受词后文本影响的词的语义含义。\n\n一旦两个模型都训练完成，我们就可以计算前向嵌入和后向嵌入。 然后我们通常将它们结合起来形成一个新的嵌入，我们称之为\
  \ **嵌入堆栈**。\n\n## Flair 嵌入的语料库\n\n训练任何类型的机器学习模型都需要数据。 幸运的是，训练嵌入是一个无监督学习任务。 用于训练的数据是未标记的。\
  \ 这意味着任何包含有意义构造词的文本都可能被用作我们语料库的一部分。 重要的是我们使用足够大的语料库。\n\n还有版权问题。 目前仍有一个持续的法律问题，即语料库的版权相关权利是否也适用于语言模型本身，以及在什么条件下适用。\
  \ 例如，如果分发原始语料库需要署名，那么对在同一语料库上训练的语言模型是否也适用相同的署名要求？ 这个问题的答案取决于许多因素，但目前没有一种明确的答案方式适用于所有类型的场景。\
  \ 但是，仍然有一些通用规则适用。 如果你在家用个人电脑学习 NLP，如果你在任何公开可用的文本上训练模型，你不太可能惹上麻烦。 然而，这些实际豁免在商业环境中并不适用。\
  \ 随着你向大型科技公司靠拢，版权法的执行会变得越来越严格。\n\n## 训练 Flair 嵌入的词典\n\nFlair 嵌入训练最好的事情之一是为语言模型准备词典所需的努力，或缺乏努力。\
  \ 对于大多数传统的基于词的语言模型，你需要为给定语言制定一个完整的词列表。\n\n幸运的是，Flair 嵌入是基于字符的。 这意味着语言模型的输入不是词，而是字符序列。\
  \ 我们无需担心制定完整的词列表。 相反，我们只需要列出我们语言中使用的所有可能字符。 这意味着如果我们处理的是使用拉丁字母的语言，我们的词典只会包含少数几项。\
  \ Flair 还提供了带有预定义常用词典的类，例如 Latin。\n\nFlair 的预训练嵌入在许多语言的许多下游 NLP 任务上取得了最先进的结果。 但是，在训练新的嵌入模型时，性能将取决于许多因素，并非我们训练的每个嵌入模型都会表现良好。\
  \ 我们需要找到方法来判断我们新训练的嵌入是否达到标准。\n\n## 评估词嵌入\n\n在上一节中，我们介绍了使用语言模型的 Flair 嵌入的设计。 训练这些语言模型的过程与任何其他类型的深度学习训练并没有太大不同。\
  \ 但是，性能良好的语言模型并不一定意味着能产生下游任务优秀结果的好嵌入。\n\n相反，我们通常需要依赖以下两种评估词嵌入的方法：\n\n- **内在评估**\
  \ 旨在测试嵌入词表示的质量，而不依赖于任何自然语言处理任务。 这是通过衡量词之间的语义关系来完成的。 最简单的内在嵌入评估类型是词相似度。 它 simply\
  \ 使用相似度指标，例如余弦距离，来衡量词嵌入之间的相似度，并将其与人类感知的语义相似度进行比较。 例如，词 *开始* 和 *起始* 在语义上非常相似。 如果我们的嵌入训练良好，那么我们期望这两个词在余弦距离上彼此接近。\n\
  \n其他类型的内在评估方法利用词之间的类比关系，类似于我们在 *国王对男人如同女王对女人* 类比练习中学习词嵌入的方式，该练习在 *第 3 章，Flair 中的嵌入*\
  \ 中。\n\n- **外在评估** 旨在通过将词嵌入用于下游 NLP 任务（例如 PoS 标注、NER 或分块）来测试词嵌入的质量。 我们将嵌入作为输入提供给\
  \ NLP 模型。 然后我们评估 NLP 模型的质量，并假设其性能的改善/退化可以归因于我们嵌入的性能。 Flair 拥有训练序列标注模型的所有工具，并为常用语言提供标记数据集。\
  \ 如果你发现自己正在训练 Flair 嵌入，很可能你计划将它们用作下游序列标注 NLP 任务的输入。 这通常使外在评估成为一个直接的选择。\n\n让我们现在进入本章的下一部分，在那里我们训练自己的嵌入，并稍后使用此处描述的技术之一进行评估。\n\
  \n## 在世界上最小的语言上训练 Flair 嵌入\n\nFlair 包为训练 Flair 嵌入提供了一个简单、直接的 API。 该过程涉及训练任何语言模型所需的所有必要步骤。\
  \ 步骤包括以下内容：\n\n- 准备词典\n- 准备语料库\n- 定义语言模型\n- 训练语言模型\n\n让我们通过一个实践动手练习来介绍训练 Flair 嵌入的过程。\n\
  \n对大多数语言进行嵌入训练并不是一个快速的过程。 一台 decent 的配备 GPU 的机器需要超过一周的训练时间才能产生与英语或类似语言上已发表的最先进 Flair\
  \ 结果相当的结果。 大多数预训练的 Flair 嵌入，例如 en 英语嵌入模型，产生长度为 2,048 的嵌入。\n\n我们需要 2,048 维向量部分原因是像英语这样的语言在词典中有大量词，并且它们的语义会根据使用的上下文而变化。\
  \ 但是，如果我们在本次练习中，在一种非常小的语言上训练嵌入会怎样？ 如果我们在一种如此小的语言上训练嵌入，以至于我们甚至可以在没有专用图形处理单元（GPU）的机器上完成它会怎样？\n\
  \n\n\n作为本次练习的一部分，我们将为世界上最小的语言——**托基·波纳**训练 Flair 上下文词嵌入。\n\n托基·波纳是一种人造（自创）语言，以其极小的词汇量而闻名。该语言的原始版本仅有约\
  \ 120 个词。该语言围绕极简主义的概念创建，旨在简化思想和交流。它只有九个辅音和五个元音，且托基·波纳词的发音与世界上大多数语言兼容。\n\n现在让我们为托基·波纳训练一个微小的\
  \ Flair 嵌入模型。\n\n## 准备词典\n\n在训练经典词嵌入时，为一种语言定义完整词典的过程往往繁琐且耗费精力。对于 Flair 嵌入来说并非如此。\n\
  \n这是因为 Flair 嵌入建模的是字符，而不是词。这意味着为了定义词典，我们不需要所有可能词的完整列表。我们只需要所有可能字符的列表即可。\n\n在托基·波纳语言中，仅使用了以下\
  \ 14 个字符：`ptksmnljwaeiou`。这些字符是拉丁字符集的子集。Flair 预编译的拉丁词典只需运行以下代码即可加载：\n\n```\nfrom\
  \ flair.data import Dictionary\n\ndictionary = Dictionary.load('chars')\n```\n\n\
  但是，需要知道的是，该字符集包含许多在托基·波纳中从未使用的字符。这意味着语言模型需要更长时间的训练才能学会某些在词典中定义的字符是无意义的。\n\n相反，如果我们想保持词典最小化，仅包含我们语言中使用的字母，我们可以通过使用\
  \ Dictionary.add_item(c) 方法手动构建自己的 Dictionary 类：\n\n```\nfrom flair.data import\
  \ Dictionary\n\ndictionary = Dictionary()\ntoki_pona_symbols = 'ptksmnljwaeiou'\n\
  toki_pona_symbols += toki_pona_symbols.upper()\n\nfor c in toki_pona_symbols + '?.\
  \ ':\n    dictionary.add_item(c)\n```\n\n在之前的代码片段中，我们定义了一个词典，其中包含托基·波纳中使用的所有可能字符的大写和小写形式，以及空格和两个标点符号。Dictionary\
  \ 类还会自动添加一个特殊的 <unk> 符号，用于标记未知字符。\n\n## 准备语料库\n\n如果没有数据，我们的嵌入模型就无法学习任何东西。训练嵌入模型的一般规则是数据越多越好。实际上，这意味着一个好的嵌入模型需要超过一百万句句子。但就本次练习而言，并且由于我们处理的是大约只有\
  \ 120 个词的语言，我们可以选择一个小得多的语料库。我们将选择一个公开可用的托基·波纳 1,000 句语料集合，可通过以下地址获取：https://raw.githubusercontent.com/tadejmagajna/TokiponaCorpus/master/bot4/corpus.txt。\n\
  \n然后我们将把语料库拆分为训练集、测试集和验证集，并将语料库目录传递给 TextCorpus 类的构造函数。\n\n让我们先下载语料库并将其拆分为测试集、训练集和验证集：\n\
  \n```python\nimport requests\n\nurl = \"https://raw.githubusercontent.com/tadejmagajna/TokiponaCorpus/master/bot4/corpus.txt\"\
  \nresponse = requests.get(url)\n\nsentences = response.text.splitlines()\none_tenth_corp_len\
  \ = int(len(sentences)/10)\n\ntest, valid, train = (\n    sentences[:one_tenth_corp_len],\n\
  \    sentences[one_tenth_corp_len:one_tenth_corp_len*2],\n    sentences[one_tenth_corp_len*2:])\n\
  ```\n\n前面的代码片段首先从 GitHub 下载整个语料库。然后按换行符拆分句子，并将语料库的前 10% 载入 test，将另外 10% 载入 valid，剩余的\
  \ 80% 载入 train。\n\n另外值得一提的是，在实践中，数据集拆分几乎总是使用辅助 NLP 框架函数来完成。这些辅助函数可以确保数据集被正确打乱，以便数据在各集合之间得到良好分布。但在这个代码示例中，我们可以假设数据已经分布良好，这意味着我们可以简单地将句子列表切片为三个部分。\n\
  \n> **重要说明**\n> 运行前面的代码片段，您需要安装本地 Python 3 以及 Flair 版本 0.11 和 requests 包。requests\
  \ 包可通过运行 `pip3 install requests` 安装。\n\n现在语料库已存储在内存中（如果处理的是包含数百万句子的语料库则不可能）。在初始化\
  \ `TextCorpus` 类之前，我们需要将语料库集合存储在本地目录中，该目录按以下文件夹和文件组织语料库：\n\n- 包含验证集的 `valid.txt`\
  \ 文件\n- 包含测试集的 `test.txt` 文件\n- 包含训练集的 `train/` 文件夹，训练集被拆分为编号文件，命名模式如下：`train_split_1`、`train_split_2`、`train_split_3`，以此类推\n\
  \n我们通过运行以下代码将语料库组织成前面定义的结构：\n\n```python\nfrom tempfile import TemporaryDirectory\n\
  from os.path import join\nfrom os import mkdir\n\ndataset_dir_obj = TemporaryDirectory()\n\
  dataset_dir = dataset_dir_obj.name\ntrain_dir = join(dataset_dir, 'train')\nmkdir(train_dir)\n\
  \nwith open(join(dataset_dir, \"test.txt\"), \"w\") as file:\n    file.write(' '.join(test))\n\
  \nwith open(join(dataset_dir, \"valid.txt\"), \"w\") as file:\n    file.write('\
  \ '.join(valid))\n\nwith open(join(train_dir, \"train_split_1\"), \"w\") as file:\n\
  \    file.write(' '.join(train))\n```\n\n在前述代码片段的第一部分中，我们使用 tempfile 库创建一个临时目录，在其中存储我们的语料库。在\
  \ Python 中使用临时目录是个好主意，因为该库提供了在完成后轻松清理的接口。\n\n在前述代码片段的第二部分中，我们随后将 test、valid 和 train\
  \ 语料库集合分别写入 train.txt、test.txt 和 train_split_1 文件。整个语料库现在存储在 dataset_dir 目录中。\n\n\
  现在语料库已正确组织，我们可以初始化 TextCorpus 类：\n\n```\nfrom flair.trainers.language_model_trainer\
  \ import TextCorpus\n\ncorpus = TextCorpus(dataset_dir,\n                    dictionary,\n\
  \                    forward=True,\n                    character_level=True)\n\
  ```\n\n前面的代码片段初始化 TextCorpus 类，我们提供数据集目录和词典，并明确告诉构造函数我们正在为前向模型准备语料库（该模型会考虑词及其之前的上下文）。\n\
  \n## 训练语言模型\n\n现在我们可以定义并训练我们的语言模型：\n\n```\nfrom flair.models import LanguageModel\n\
  from flair.trainers.language_model_trainer import (\n    LanguageModelTrainer)\n\
  \nlanguage_model = LanguageModel(dictionary,\n                               is_forward_lm=True,\n\
  \                               hidden_size=64,\n                              \
  \ nlayers=1)\n\ntrainer = LanguageModelTrainer(language_model, corpus)\ntrainer.train('forward_model_directory',\n\
  \    sequence_length=25,\n    mini_batch_size=10,\n    max_epochs=100)\n```\n\n\
  在前述代码片段的第一部分中，我们通过告知它我们正在构建一个具有单层和隐藏大小为 64 的前向模型来初始化 LanguageModel 类。hidden_size\
  \ 是一个重要参数，定义了 LSTM 节点隐藏层的大小，这实际上定义了我们的嵌入向量的维度。hidden_size 通常需要设置得高得多，例如 2,048。但由于我们是在大约只有\
  \ 120 个词的语言上训练模型，并且这只是练习的一部分，因此可以使用低维嵌入。\n\n在前一个片段的第二部分中，我们通过初始化 LanguageModelTrainer\
  \ 类并告知其使用序列长度 25 并运行 100 个 epoch 来开始模型训练过程。这里选择的参数 purposely 远低于在生产环境中训练大型嵌入模型时所使用的参数。实际上，使用比这更长的序列长度并进行更多\
  \ epoch 是个好主意。\n\n然后我们通过调用 LanguageModelTrainer.train() 开始训练，其中指定了训练后模型的输出目录，在我们的例子中是\
  \ forward_model_directory/。该目录将相对于我们运行此代码的目录创建。\n\n如果一切做对，模型训练应该开始，Flair 应该开始向标准输出打印一些调试文本和指标值：\n\
  \n```\nms/batch  5.88 | loss  0.77 | ppl    2.15\nEpoch    97: reducing learning\
  \ rate of group 0 to 1.2207e-03.\nbest loss so far  0.98\n('\\n ni li sike. mi pini\
  \ e ma mije? kala ni li sin e pan lawa\nen kena t\n---------------------------------------------------------------\n\
  end of split 1/1 | epoch  97 | time:  1.75s | valid loss 0.99\n---------------------------------------------------------------\n\
  Epoch time: 1.92\nread text file with 1 lines\n```\n\n\n\n前面的输出提供了有价值的信息。它告诉我们当前正在处理的\
  \ epoch（本例中为 epoch 97），训练损失是多少（本例中为 0.77），验证损失是多少（本例中为 0.99），并且打印出了由我们的语言模型生成的一些文本：ni\
  \ li sike. mi pini e ma mije? kala ni li sin e pan lawa en kena t.\n\n在最初几个 epoch\
  \ 中，你会注意到我们的语言模型产生的是一堆胡言乱语。大多数词都是词汇表外的词，输出完全随机。但随着训练的进行，你会注意到损失在下降，生成的文本开始看起来像 Toki\
  \ Pona.\n\n在普通机器上，用 CPU 训练这 100 个 epoch 不应超过 10 分钟。训练完成后，Flair 会打印出最终的验证损失和困惑度：\n\
  \n```\nTEST: valid loss 0.92 | valid ppl 2.52\n```\n\n就这样！\n\n我们的 Flair 嵌入模型现在已经训练完成。我们可以开始生成一些嵌入。但在这样做之前，我们可以先稍微玩一下语言模型，并使用\
  \ generate_text() 方法生成一些文本：\n\n```\nt = language_model.generate_text(number_of_characters=40)[0]\n\
  print(t)\n```\n\n这将打印出语言模型生成的 40 个字符（由于权重随机初始化，每次训练的结果都会不同）：\n\n```\nsike ni li\
  \ pona mute. soweli ni li pana\n```\n\n虽然这些 Toki Pona 语句对人类来说意义不大，但至少我们可以欣慰的是，生成的词都是真正的\
  \ Toki Pona 词，词的结构似乎遵循某种逻辑模式。还请注意，我们只生成了 40 个字符，这意味着最后一个词可能会被截断。如果你自己训练模型，你的随机初始化模型权重会不同，模型产生的文本几乎肯定会与所示示例不同。\n\
  \n## 使用自定义嵌入进行下游任务\n\n训练 Flair 嵌入模型的主要目的并不是玩弄生成的文本和打印嵌入向量。很可能，我们训练嵌入是为了在下游 NLP 任务中使用它们。\n\
  \n幸运的是，加载自定义训练的 Flair 嵌入的语法与加载任何其他预训练 Flair 嵌入模型相同。我们只需将模型路径传递给构造函数即可。\n\n如果传递给\
  \ LanguageModelTrainer 类的输出路径是 forward_model_directory/，我们将在 forward_model_directory/best-lm.pt\
  \ 找到训练好的模型。\n\n然后我们可以通过运行以下代码实例化一个 FlairEmbeddings 对象：\n\n```\nfrom flair.embeddings\
  \ import FlairEmbeddings\nfw = FlairEmbeddings('forward_model_directory/best-lm.pt')\n\
  ```\n\n前面的代码片段将我们的自定义嵌入模型加载到 fw 变量中。\n\n请注意，在本练习中，我们只训练了前向嵌入模型，它考虑的是词之前的上下文。为了获得更好的性能，你现在可能希望使用\
  \ forward 和 is_forward_lm 参数设为 False 重复整个嵌入训练过程，这将改为训练反向模型。然后你可以将嵌入模型堆叠在一起形成一个 StackedEmbeddings\
  \ 对象，这是第 5 章 Training Sequence Labeling Models 中深入介绍的过程的一部分。\n\n你现在可以在任何使用词嵌入的 Flair\
  \ 下游 NLP 任务中使用此模型。这样做还可以让你通过评估使用这些自定义嵌入的标注器的性能来对嵌入模型进行外部评估。\n\n但训练标注器需要很长时间。因此，在这样做之前，你可能只想做一个合理性检查，以验证我们的嵌入是否至少包含一些有用的信息。\n\
  \n## 对自定义 Flair 嵌入进行内在评估\n\n在我们进行冗长的序列标注模型训练过程以验证我们的嵌入是否有意义之前，我们可以改做一个非常简单的内在评估作为合理性检查。\n\
  \n我们可以做的一个简单的内在检查是为几个同义词计算嵌入，然后使用相似度指标判断 resulting 嵌入是否相似。同样，我们可以为语义上不相似的词计算嵌入并检查它们的嵌入是否也不相似。为了简化操作，我们将对不相似的词使用一个词汇表外（OOV）词。因此，我们的测试将验证两个相似词的嵌入是否比一个词典词和一个\
  \ OOV 词的嵌入更接近（以余弦距离衡量）。\n\n对于相似词，我们将选择 lukin 和 oko。虽然不是真正的同义词，但在 Toki Pona 中它们的含义都与视觉和眼睛有关。我们将为这两个词和另一个\
  \ OOV 词生成嵌入，然后测量这些嵌入之间的相似度。如果我们的嵌入质量不错，lukin 和 oko 在相似度指标上应该得分很高，而 OOV 词则不期望与前两者相似。\n\
  \n让我们使用我们的自定义嵌入模型为这三个词全部计算嵌入：\n\n```\nfrom flair.embeddings import FlairEmbeddings\n\
  from flair.data import Sentence\n\nsynonym_1 = Sentence('lukin')\nsynonym_2 = Sentence('oko')\n\
  rand_word = Sentence('oovword')\n\nfw = FlairEmbeddings('forward_model_directory/best-lm.pt')\n\
  fw.embed(synonym_1)\nfw.embed(synonym_2)\nfw.embed(rand_word)\n\nembedding_syn_1\
  \ = synonym_1[0].embedding.tolist()\nembedding_syn_2 = synonym_2[0].embedding.tolist()\n\
  embedding_rnd_wrd = rand_word[0].embedding.tolist()\n```\n\n在前述代码片段的第一部分，我们只是为词\
  \ lukin、oko 和 oovword（随机 OOV 词）初始化 Sentence 类。\n\n然后我们可以使用余弦相似度指标来衡量这三个嵌入之间的相似度：\n\
  \n```\nfrom sklearn.metrics.pairwise import cosine_similarity as sim\n\ns_synonym\
  \ = sim([embedding_syn_1], [embedding_syn_2])[0][0]\ns_rand_1 = sim([embedding_syn_1],\
  \ [embedding_rnd_wrd])[0][0]\ns_rand_2 = sim([embedding_syn_2], [embedding_rnd_wrd])[0][0]\n\
  ```\n\n前面的片段计算了三个词对之间的相似度，并将 lukin 和 oko（同义词）之间的相似度存储到 s_synonym 中。它还计算了 lukin 与\
  \ oovword 之间，以及 oko 与 oovword 之间的相似度。\n\n让我们看看我们的假设是否正确：\n\n```\nprint(s_synonym\
  \ , s_rand_1 , s_rand_2)\n```\n\n如果你的嵌入训练得不错，前面的代码片段将打印出类似以下内容：\n\n```\n0.6111595281781783\
  \ 0.2691232575537895 0.18826418665007352\n```\n\n太好了！\n\n事实证明我们的假设得到了支持。相似词在相似度得分上得分很高（打印出的第一个数字），而不相关的词（打印出的第二个和第三个数字）得分较低。请注意，我们从这些结果中唯一可以得出的结论是我们的嵌入中存储了一些程度的\
  \ Toki Pona 信息，但我们不应就这些嵌入在下游 NLP 任务中的有用性做出任何结论。要正确训练 Flair 嵌入以供实际使用，我们需要在更大的数据集上训练，使用更高的嵌入维度，训练更多\
  \ epoch，并使用更长的序列长度。\n\n## 总结\n\n训练自定义嵌入是 Flair 中较为复杂的功能之一。它需要所有有助于我们选择正确参数并正确准备数据的知识和理解，以便利用训练较大语言嵌入所需的大量计算能力。它也是一个关键概念，必须正确理解和执行，因为\
  \ Flair 的几乎所有其他功能都以某种方式依赖于嵌入。\n\n在本章中，我们介绍了训练自定义 Flair 词嵌入的动机，并概述了嵌入设计。我们通过为世界上最小的语言\
  \ – Toki Pona 训练前向词嵌入，介绍了训练这些嵌入所需的语法。\n\n到目前为止，我们将嵌入呈现为可作为下游 NLP 序列标注任务输入的东西。但嵌入也可以用于其他\
  \ NLP 应用，例如文本分类。让我们在下一章学习关于那方面的内容。\n\n\n"
- "## 8 Flair 中的文本分类\n\n在涵盖了超参数调优、嵌入和序列标注模型训练等复杂主题之后，我们现在准备转向自然语言处理（NLP）中一个稍微更直接、更容易理解的部分。在本章中，我们将介绍**文本**（也称为**文档**）**分类**。虽然\
  \ Flair 的传统优势在于**序列标注**，但该库提供的解决方案利用了 Flair 嵌入以及其他第三方解决方案，使其在文本分类中也能取得不错的结果。其优势之一在于训练的简易性，另一优势则在于零样本和少样本分类器——这些分类器几乎不需要或不需要训练数据。\n\
  \n我们将首先介绍文本分类是什么、它可用于什么、如何训练以及如何评估成功。随后我们将介绍 Flair 在文本分类方面能提供什么，并介绍不同类型的文本分类器。我们将通过动手练习训练我们自己的分类器。最后，我们将探索一种几乎不需要或不需要训练数据的文本分类新方法。\n\
  \n我们将作为以下内容的一部分学习文本分类以及如何在 Flair 中训练和使用文本分类器：\n\n- 理解文本分类\n- Flair 中的文本分类\n- 在 Flair\
  \ 中训练文本分类器\n- 使用几乎不需要训练示例的文本分类器\n\n让我们开始吧！\n\n## 技术要求\n\n本章使用的所有 Python 库都是 Flair\
  \ 0.11 版本的直接依赖项，只要机器上已安装 Flair，就无需特殊设置。本章涵盖的代码示例可在本书官方 GitHub 仓库的以下 Jupyter 笔记本中找到：https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter08。\n\
  \n你可以使用 CPU 运行本章的大部分代码并训练大部分模型。然而，最后一个练习确实需要配备 GPU 的机器。\n\n## 理解文本分类\n\n文本或文档分类仅仅是将一个或多个标签（通常称为类别）分配给一段文本（通常称为文档）的过程。文本分类器是一种机器学习模型，它接收文本作为输入并计算一组类别上的概率分布。\n\
  \n文本分类有许多实际应用，并被积极用于解决以下问题：\n\n- **主题分类** – 将主题分配给文档的过程\n- **垃圾邮件检测** – 检测不需要的电子邮件的过程\n\
  - **情感分析** – 将文本情感分类为积极和消极\n- **仇恨言论检测** – 在文本中识别仇恨言论\n- **语言识别** – 确定文档使用何种语言书写\n\
  \n以下是文本分类在现实世界中的一个例子：\n\n![](img/c56c48b8fd18a11ab705352d618ed976_126_0.png)\n\n\
  图 8.1 – 垃圾邮件检测\n\n关于文档的分类方式，我们知道三种不同的文本分类类型：\n\n- **二元分类** – 在二元分类中只有一个可能的类别。每个文档要么属于该类别，要么不属于该类别。\n\
  - **多类分类** – 仅将众多可能类别中的一个分配给文档。\n- **多标签多类分类** – 一个文档可以同时属于多个类别。\n\n现在应该很清楚，文本分类虽然是一个概念上相当简单的概念，但仍是\
  \ NLP 的重要组成部分。但在我们直接深入 Flair 中如何对文本进行分类之前，让我们先快速了解一下文本分类器通常是如何训练的。\n\n## 训练文本分类器\n\
  \n文档或文本分类是一种监督式机器学习形式。这意味着机器学习模型在充当地面真实的标记数据上进行训练。例如，对于垃圾邮件检测分类器，每个文档将被标记为 *spam*\
  \ 或 *not-spam*。\n\n文本分类中没有规则定义可以定义多少个类别以及如何定义类别来解决特定问题。可能的类别集合通常是人为构建的，以便以最优方式解决某个业务问题。因此，文本分类与其他形式的监督式机器学习不同，因为通常除了标记数据本身之外没有客观的地面真实。例如，对于词性标注，地面真实，即词语应该如何被标注的解决方案，是由语法定义的，并且对于句子中每个词应该被分类为什么词性有一个明确的答案。但在文本分类中，类别通常是抽象的高层次概念，没有明确的定义或边界。因此，类别分配通常是主观的。例如，在情感分析中，我们需要将句子分类为\
  \ *positive* 和 *negative*。然而，不同的人对某些句子是积极还是消极会有不同的看法。因此，对于分类问题，通常除了标记数据本身之外没有地面真实。这也是文本分类器容易受到标注偏差影响的原因之一。这意味着如果我们训练文本中的类别标签包含偏差，无论我们如何训练模型，我们的预测都会有偏差。\n\
  \n检测和缓解偏差是一个复杂的问题，超出了 NLP 的范围，更不用说本书的范围了。在这里，我们计划介绍模型的训练方法，以及更重要的是，训练后如何以及依据什么进行评估。\n\
  \n训练文本分类器的过程与训练序列标注器并没有太大区别。我们从一个具有随机初始化权重的深度学习模型开始，然后以适应训练数据的方式训练模型。当然，为了避免过拟合，我们不希望模型过度拟合训练数据。这就是为什么在测试数据集上评估模型很重要。为了评估模型并确定其是否按预期工作，我们使用以下其中一种指标。\n\
  \n## 单标签和多标签文本分类的指标\n\n可以应用于包括文本分类在内的许多分类问题的最简单、最易于理解的指标是 **准确率**。准确率仅仅是被正确分类的数据的比例。它可以使用以下公式计算：\n\
  \n$$\\frac{correctlyClassified}{(incorrectlyClassified + correctlyClassified)}$$\n\
  \n这里，`correctlyClassified` 是被分配正确标签的示例数量，而 `incorrectlyClassified` 是被分配错误标签的示例数量。虽然该指标的结果在\
  \ 0 到 1 之间，但可以乘以 100 并以百分比（%）值表示。\n\n对于具有平衡类别分布（训练数据中每个类别的示例数量相同）的文本分类问题以及单类分类问题，该指标通常已经足够好。但当我们开始处理多标签（为每个训练示例分配多个类别）分类或不平衡数据集时，我们可能会进一步考虑其他指标，例如\
  \ **F1score**。\n\nF1 分数已在 *第 4 章，序列标注* 中得到充分解释，并且在那里适用于序列标注的相同 F1 分数概念也适用于此处的文本分类。该分数是另两个指标\
  \ **精确率** 和 **召回率** 的调和平均值。其范围从 0（最差分数）到 1（最佳分数）。\n\n为了充分理解 F1 分数在分类方面的含义，我们需要单独评估每个类别标签。对于每个预测标签，我们检查它是否是所讨论的标签（意味着正例）还是不是（意味着负例）。然后我们计算以下指标。\n\
  \n在分类中，`precision` 是被标记为正例的示例中真正为正例的比例：\n\n$$precision = \\frac{tp}{tp + fp}$$\n\
  \n而 `recall` 是真正为正例的示例中被正确分类的比例：\n\n$$recall = \\frac{tp}{tp + fn}$$\n\n其中：\n\n\
  - **真正例 (TP)**：被预测为正例且实际为正例的样本数量\n- **假阳性 (FP)**：被预测为正例但实际为负例的样本数量\n- **假阴性 (FN)**：被预测为负例但实际为正例的样本数量\n\
  \nF1 分数随后被定义为精确率和召回率的调和平均数：\n\n$F1 = 2 \\cdot \\frac{precision \\cdot recall}{precision\
  \ + recall}$\n\n计算 F1 分数的过程与序列标注中使用的方法相同，涉及以下步骤：\n\n- 1. 统计真正例、假阳性和假阴性\n- 2. 使用上述公式计算精确率和召回率\n\
  - 3. 将 F1 分数计算为精确率和召回率的调和平均数\n\n如果我们分别对每个类别标签计算 F1 分数，然后对所有 F1 分数取平均，就得到 **宏 F1\
  \ 分数**。该指标考虑了我们数据集中类别分布不平衡的情况。\n\n如果我们对所有类别一起计算 F1 分数，将总的真正例、假阴性和假阳性合并计算，就得到 **微\
  \ F1 分数**。在单标签分类中，该指标的值与准确率相同。\n\n让我们看看这一理论在实践中如何表现，使用最简单但功能强大的 NLP 库之一。\n\n## Flair\
  \ 中的文本分类\n\nFlair 提供了使用预训练模型以及训练自定义文本分类器的简单接口。虽然 Flair 的秘诀——前向和后向 Flair 嵌入——并不是文本分类任务的最佳工具，但\
  \ Flair 可以利用其他第三方方法来实现文本分类的出色性能。\n\n让我们先学习如何训练和使用 Flair 的预训练模型。\n\n### 使用预训练的 Flair\
  \ 文本分类模型\n\nFlair 中可用的预训练文本分类模型集合相当小，很可能你想要的模型并不在其中。即使如此，以下语法仍然很有价值，因为加载和使用 Flair\
  \ 预训练模型的 API 与加载和使用自定义训练模型的 API 相同。我们将在下一节中训练这些模型。\n\nFlair 目前提供以下稳定的预训练模型：\n\n\
  - sentiment – 用于将英文文本分类为正面和负面的情感分析模型\n- sentiment-fast – sentiment 文本分类模型的一个略小版本，推理速度更快\n\
  - de-offensive-language – 用于将德语文本标记为冒犯性或非冒犯性的文本分类模型——例如，模型会将包含粗俗用语的句子标记为冒犯性\n\n\
  了解 Flair 中当前可用的文本分类模型名称后，我们现在可以使用以下语法加载和使用模型：\n\n```\nfrom flair.models import TextClassifier\n\
  from flair.data import Sentence\n\nclassifier = TextClassifier.load(\"sentiment\"\
  )\nsentence = Sentence(\"Flair is pretty cool!\")\nclassifier.predict(sentence)\n\
  \nprint(sentence.labels)\n```\n\n前面的代码片段首先使用 TextClassifier.load() 函数通过传入 sentiment\
  \ 模型名称来加载分类器。第一次加载此模型时，Flair 会从其 Web 服务器将其下载到我们的本地机器上。这些模型随后将被缓存到磁盘以供将来使用。\n\n然后我们使用一个明确传达积极信息的句子初始化\
  \ Sentence 类。接下来，我们将使用 TextClassifier.predict() 方法生成预测并将其存储为 Sentence 对象的部分内容。\n\
  \n最后，我们只需打印出对象即可预测类别标签概率。它产生以下输出：\n\n```\n['Sentence: \"Flair is pretty cool !\"\
  /'POSITIVE' (0.9991)]\n```\n\n前面的消息显示，我们的 Flair is pretty cool! 句子被分配了单个 POSITIVE\
  \ 类别标签。该消息还表明我们的模型对其决策有 99.9% 的信心。\n\n我们可以用一个极其负面的句子尝试完全相反的情况：\n\n```\nsentence\
  \ = Sentence(\"I don't get enough sleep.\")\nclassifier.predict(sentence)\nprint(sentence.labels)\n\
  ```\n\n这会打印出以下内容：\n\n```\n['Sentence: \"I don't get enough sleep .\"/'NEGATIVE'\
  \ (0.9911)]\n```\n\n这表明我们的模型有 99.1% 的把握认为前一条消息具有负面含义。\n\n就是这样！几行代码我们就可以进行文本分类。Flair\
  \ 预训练文本分类模型的缺点是可供选择的模型实在少得可怜。幸运的是，Flair 提供了易于使用的接口来训练新的自定义模型，我们可以训练任意多个！让我们先学习如何利用\
  \ Flair 中执行文本分类所需的底层技术——文档嵌入——来学习如何做到这一点。\n\n## Flair 中的文档嵌入\n\n与词嵌入是 Flair 中生成序列标注模型的关键部分的方式相同，许多文本分类模型也利用了类似的概念——文档嵌入。\n\
  \n文档嵌入本质上是文档的向量表示。术语文档 simply 指的是一串词。这些文档的长度可以从单个词到整本书或语料库不等。\n\nFlair 提供了一套不同类型的文档嵌入，如以下小节所述。\n\
  \n### DocumentPoolEmbeddings\n\n这是最简单的文档嵌入类型。它是一段代码，为文档中的每个词计算词嵌入并返回平均值。例如，如果我们有一个包含两个词的文档，第一个词的嵌入为\
  \ [1, 2]，第二个词的嵌入为 [3, 0]，那么 DocumentPoolEmbeddings 嵌入将为 [2, 1]。除了计算平均嵌入（称为平均池化）之外，这种类型的文档嵌入还可以使用其他池化方式，例如最小池化（意味着对每个嵌入维度取最小值）和最大池化（意味着对每个嵌入维度取最大值）。要使用\
  \ DocumentPoolEmbeddings，你只需要训练好的词嵌入。文档嵌入本身不需要训练，这是一个巨大的优势！\n\n```python\nfrom flair.data\
  \ import Sentence\nfrom flair.embeddings import (DocumentPoolEmbeddings,\n     \
  \                          WordEmbeddings)\n\nglove = WordEmbeddings('glove')\n\
  document_embeddings = DocumentPoolEmbeddings([glove])\nsentence = Sentence('two\
  \ words')\nglove.embed(sentence)\n\nprint((sentence[0].embedding + sentence[1].embedding)\
  \ / 2)\n```\n\n在前面的代码片段中，我们自己实现了使用平均池化的文档嵌入。我们只需加载一个词嵌入对象并为两个词（词 two 和词 words）计算词嵌入。然后我们将两个词嵌入相加并将结果嵌入除以二——从而对两个嵌入取平均或执行平均池化。我们可以使用\
  \ DocumentPoolEmbeddings 类完成完全相同的事情：\n\n```python\ndocument_embeddings = DocumentPoolEmbeddings([glove])\n\
  document_embeddings.embed(sentence)\n\nprint(sentence.embedding)\n```\n\n前面的代码片段使用\
  \ DocumentPoolEmbeddings 类为我们的文档计算嵌入。打印出嵌入的输出显示，结果与我们之前通过对两个词嵌入向量取平均计算出的嵌入相同。\n\n\
  但是使用 DocumentPoolEmbeddings 的便利性是有代价的——它们通常不能像以下嵌入方法那样提供良好的性能。\n\n### DocumentRNNEmbeddings\n\
  \nDocumentRNNEmbeddings 是一种特殊的文档嵌入类型，由 Flair 实现，使用循环神经网络形成文档向量表示。\n\n它通常比 DocumentPoolEmbeddings\
  \ 产生更好的性能，并且以相同的方式接收词嵌入对象作为输入。然而，开箱即用的 DocumentRNNEmbeddings 是无用的——新初始化的嵌入对象本质上是一个具有随机权重的未训练神经网络模型。该模型需要训练后才有用。\n\
  \n但与其被训练另一种嵌入类型分散注意力，不如探索 Flair 中另一种文档嵌入，它既是预训练的，又能产生出色的性能。\n\n### TransformerDocumentEmbeddings\n\
  \n解决任何问题的良好方法是不要重新发明轮子，而是利用已经有效的工作技术。近年来取得巨大进展的一种特殊 NLP 模型是 transformers。Flair 提供了一个包装类，能够直接从预训练的\
  \ Transformer 为整个文档计算嵌入。\n\nTransformerDocumentEmbeddings 的使用方式与 Flair 中任何其他嵌入类相同——它可用于使用\
  \ .embed(sentence) 方法嵌入句子。让我们使用 roberta-base Transformer 模型尝试此嵌入：\n\n```\nfrom flair.embeddings\
  \ import TransformerDocumentEmbeddings\n\nembedding = TransformerDocumentEmbeddings('roberta-base')\n\
  sentence = Sentence('two words')\n\nembedding.embed(sentence)\n\nprint(sentence.embedding)\n\
  ```\n\n\n\nThe preceding code snippet will print out a 768-dimensional vector representation\
  \ of our sentence. The class uses **Hugging Face** transformers and thus allows\
  \ us to use a wide variety of models, which are fetched directly from the publicly\
  \ available Hugging Face Models Hub. We will cover a lot more about Hugging Face\
  \ and learn how to publish our own models on the Models Hub in Chapter 10, *动手练习\
  \ – 使用 Flair 构建交易机器人*.\n\nThere is a number of transformer-based pre-trained embedding\
  \ models that are used by the `TransformerDocumentEmbeddings` class. The most notable\
  \ examples are the following:\n\n- `bert-base-uncased`\n- `roberta-base`\n- `distilbert-base-uncased`\n\
  - `xlnet-base-cased`\n\nWe have now covered an essential underlying NLP concept\
  \ that fuels Flair text classifiers. We're now ready to dive deeper and explore\
  \ how Flair text classifiers are designed.\n\n## Flair 中的文本分类器\n\nMost text classifiers\
  \ in Flair utilize the `TextClassifier` class. It is responsible for providing the\
  \ tools for defining and using text classifiers in Flair. Unlike many other concepts\
  \ in Flair, it is a surprisingly simple design. `TextClassifier` is a model that\
  \ utilizes a single linear neural network layer, taking the document embeddings\
  \ as input and returning the class labels as output.\n\nLet's learn how to train\
  \ text classifiers in Flair as part of a hands-on exercise. Let's build our own\
  \ sentiment analysis text classifier!\n\n## Training a text classifier in Flair\n\
  \nIn this section, we will be training a sentiment analysis text classification\
  \ model capable of labeling text as *正面* or *负面*. Text classifier training follows\
  \ a sequence of steps very similar to how sequence labeling models are trained.\n\
  \nThe steps required to train text classifiers in Flair include the following:\n\
  \n- 1. Loading a tagged corpus and computing the label dictionary map\n- 2. Loading\
  \ and preparing the document embeddings\n- 3. Initializing the `TextClassifier`\
  \ class\n- 4. Training the model\n\nThe process, given what we covered as part of\
  \ sequence labeling model training, should look very familiar – and indeed it is.\
  \ Let's start by loading the data required to train the classifier.\n\n### 加载标注语料库\n\
  \nTraining text classification models requires a set of text documents (typically,\
  \ sentences or paragraphs) where each document is associated with one or more classification\
  \ labels. To train our sentiment analysis text classification model, we will be\
  \ using the famous **互联网电影数据库 (IMDb)** dataset, which contains 50,000 movie reviews\
  \ from IMDB, where each review is labeled as either positive or negative. References\
  \ to this dataset are already baked into Flair, so loading the dataset couldn't\
  \ be easier:\n\n```\nfrom flair.data import Corpus\nfrom flair.datasets import IMDB\n\
  import _locale\n\n### 针对罕见的 Windows 仅有的 Flair 编码错误的解决方法\n_locale._getdefaultlocale\
  \ = lambda *_: ['en_US', 'utf8']\n\ncorpus = IMDB()\ncorpus.downsample(0.05)\nlbl_type\
  \ = 'sentiment'\nlabel_dict = corpus.make_label_dictionary(label_type=lbl_type)\n\
  ```\n\nThe preceding code snippet loads the IMDB dataset into memory. It also creates\
  \ the `label_dict` object, which is a dictionary containing all possible class labels.\
  \ This will be required later when we build the classifier.\n\n> **重要说明**\n> \n\
  > In this code example, we utilized the `downsample()` method. The method downsamples\
  \ the dataset. It reduces the number of items in our dataset, and by doing that,\
  \ we also reduce the amount of data our model will be able to learn from. As a result,\
  \ the model is likely to perform worse. This method should, unless there really\
  \ is too much data, only be used for learning and demonstration purposes. We used\
  \ a downsample rate of 0.05, meaning we only keep 5% of the original data.\n\nLet's\
  \ now move on to loading the document embeddings into memory.\n\n### 加载和准备文档嵌入\n\
  \nIn the previous section, we covered all the different types of document embeddings\
  \ that we can use in Flair. To keep this exercise simple, we will use DocumentPoolEmbeddings.\
  \ They require no training prior to training the classification model itself:\n\n\
  ```\nfrom flair.embeddings import (DocumentPoolEmbeddings,\n                   \
  \           WordEmbeddings)\n\nglove = WordEmbeddings('glove')\ndocument_embeddings\
  \ = DocumentPoolEmbeddings([glove])\n```\n\nIn the preceding code snippet, we used\
  \ GloVe embeddings. We passed them to the DocumentPoolEmbeddings class, which, if\
  \ you remember the previous section well, simply computes an average of all the\
  \ word embeddings in the document.\n\nWith document embeddings out of the way, we\
  \ can now define our text classification model.\n\n### 初始化 TextClassifier 类\n\n\
  This is the point where all the variables defined in the previous sections come\
  \ together as part of a newly initialized object – TextClassifier:\n\n```\nfrom\
  \ flair.models import TextClassifier\n\nclassifier = TextClassifier(document_embeddings,\n\
  \                            label_dictionary=label_dict,\n                    \
  \        label_type=lbl_type)\n```\n\nIn the preceding code snippet, we define our\
  \ text classifier object, which initializes as a fully functioning classifier with\
  \ randomized weights. Classifiers such as TextClassifier need to know the total\
  \ number of classes in advance, as it affects the neural network architecture –\
  \ hence the need to provide label_dict. We also need to pass in the document embeddings\
  \ class at the point of defining the model so that the model knows the embedding\
  \ length, which defines the number of input nodes. Finally, we also pass in the\
  \ lbl_type variable, which is used at a later point.\n\nOur model is actually a\
  \ fully functional text classification model now. The tiny problem is that its weights\
  \ are randomly initialized, which means that the output it produces will be useless.\
  \ To make our model useful, we need to train it.\n\n### 训练模型\n\nTraining the text\
  \ classifier model involves two simple steps:\n\n- 1. Defining the model trainer\
  \ class by passing in the classifier model and the corpus\n- 2. Setting off the\
  \ training process passing in the required training hyperparameters\n\nThe following\
  \ classification model training syntax is very similar to how we trained sequence\
  \ labeling models in the previous chapters:\n\n```python\nfrom flair.trainers import\
  \ ModelTrainer\n\ntrainer = ModelTrainer(classifier, corpus)\n\ntrainer.train('classifier',\n\
  \    learning_rate=0.1,\n    mini_batch_size=32,\n    max_epochs=40)\n```\n\nThe\
  \ preceding code snippet sets off the training process where we pass in a number\
  \ of training-related hyperparameters, all of which were explained in detail in\
  \ Chapter 5, Training Sequence Labeling Models. The training process will now run\
  \ for 40 epochs or until the model stops improving and will store the final model\
  \ in the classifier directory.\n\n> **重要说明**\n> \n> In the preceding exercise, we\
  \ used the `DocumentPoolEmbeddings` document embeddings. However, if you ever plan\
  \ to use `TransformerDocumentEmbeddings` (which is almost guaranteed to offer better\
  \ performance), you should use the `ModelTrainer.fine_tune()` method instead of\
  \ `ModelTrainer.train()`, which presets some of the training hyperparameters to\
  \ aid fine-tuning transformers.\n\nTraining should take about 30 minutes on an average\
  \ CPU. When done, we'll be ready to test the new classifier out.\n\nUpon completion,\
  \ the model trainer will print out a bunch of metrics. The simplest and most telling\
  \ metric to look out for is the test_score metric. It shows the classification accuracy\
  \ of the test dataset. In our case, test_score was 0.672, although be aware that\
  \ yours will be slightly different due to the randomly initialized weights.\n\n\
  ## Loading and using custom text classifiers\n\nAfter training the text classification\
  \ model, the resulting classifier will already be stored in memory as part of the\
  \ classifier variable. It is possible, however, that your Python session exited\
  \ after training. If so, you'll need to load the model into memory with the following:\n\
  \n```\nfrom flair.models import TextClassifier\nclassifier = TextClassifier.load('classifier/best-model.pt')\n\
  ```\n\nWe can now generate predictions on some made-up text input:\n\n```\nfrom\
  \ flair.data import Sentence\nsentence = Sentence(\"great\")\nclassifier.predict(sentence)\n\
  print(sentence.labels)\n```\n\nThe preceding code snippet tests our sentiment analysis\
  \ classifier on the most trivial problem we could think of. We are classifying a\
  \ single word, great, which, we can all agree, is unambiguously positive. The code\
  \ snippet will print out the predicted class along with the prediction probability:\n\
  \n```\n['Sentence: \"great\"/'POSITIVE' (0.9999)]\n```\n\nThis indicates that the\
  \ model is 99.9% positive that the label is... well, POSITIVE.\n\nBut be aware that\
  \ the model was initialized on random weights and trained on a significantly downsampled\
  \ dataset. The results will, therefore, likely be a little different every time\
  \ you run this code.\n\nWe can give another simple example a go using the exact\
  \ opposite. We can test whether our classifier behaves as expected when given an\
  \ unambiguously negative message:\n\n```\nsentence = Sentence(\"bad\")\nclassifier.predict(sentence)\n\
  print(sentence.labels)\n```\n\n\n\n你不需要是情感分析专家就能判断单词 bad 应该标记为 NEGATIVE，我们的模型也是如此。它输出如下：\n\
  \n```\n[ 'Sentence: \"bad\" / 'NEGATIVE' (0.9998) ]\n```\n\n这表明模型有 99.9% 的把握认为单词\
  \ bad 是负面的，虽然这并不特别令人震惊。\n\n我们应该在稍微复杂一点的示例上测试我们的模型：\n\n```\nsentence = Sentence(\"\
  Not quite my cup of tea\")\nclassifier.predict(sentence)\nprint(sentence.labels)\n\
  ```\n\n前面的代码示例提出了一个更复杂的情感分析问题，因为它试图为一份文档预测标签，而该文档不一定包含任何本身为正面或负面的词。\n\n我们对前面句子的预测如下：\n\
  \n```\n[ 'Sentence: \"Not quite my cup of tea\" / 'POSITIVE' (0.7513) ]\n```\n\n\
  显然不正确。前一句明显带有负面含义。很可能当你自己运行代码并且权重初始化不同时，结果会有所不同，但预测置信度（在我们的例子中为 75%）会始终保持较低。\n\n\
  我们可以采取几个步骤来提高分类器的预测质量。最明显的选择可能是简单地减少对语料库的下采样并花更多时间进行训练。这是一个有效的选择，但不太可能在很大程度上帮助我们提高预测质量。在这种情况下，提高分类准确性的最大瓶颈是文档嵌入的选择。我们在练习中使用了\
  \ DocumentPoolEmbeddings。它使用起来快速简单，但只能做到这一点。当以获得良好结果为目标训练文本分类模型时，你应该改用 TransformerDocumentEmbeddings。\n\
  \n在前面的文本分类练习中，我们使用了一种称为 `downsampling` 的方法来减小语料库的大小，这显著加快了训练过程，但也显著影响了我们的预测质量。为了提高分类质量，我们可以简单地减少对语料库的下采样。最初，我们丢弃了\
  \ 95% 的数据集。为了获得更好的预测质量，我们可以只丢弃 80%，也许只有 50%，或者也许根本不丢弃任何数据。但到这一点，我们就会撞上砖墙。我们无法通过在更多数据上训练来改进分类器，因为根本没有更多数据。在我们的例子中，作为练习的一部分，我们能够利用数百人时的工作成果，人们逐条手工标注了整个数据集。但在现实世界中，你试图解决的问题很可能不会有标记数据集等着你利用。更糟糕的是，标记数据成本高昂。昂贵到有时，手工标注数据甚至不值得付出努力，构建模型所需的资源会超过收益。\n\
  \n但如果有一种方法可以在不需要依赖许多或任何训练示例的情况下训练分类器怎么办？实际上有办法。它被称为 **任务感知句子表示 (TARS)**。让我们学习如何将其用于\
  \ Flair。\n\n## 需要很少或不需要训练数据的文本分类器的工作\n\n在前几章提到 Flair 及其优势时，我们主要关注解决序列标注任务的各种强大方法。然而在谈论文本分类时，Flair\
  \ 通常被呈现为一个不错的文本分类工具，尽管与其实序列标注能力相比没有什么特别之处。这确实是事实——直到现在。Flair 最近引入了一种名为 TARS 的新颖文本分类方法。该概念在\
  \ *任务感知句子表示用于通用文本分类* 论文中有深入描述，可在 `https://aclanthology.org/2020.coling-main.285/`\
  \ 获取，值得一读。\n\nFlair 中的基于 Transformer 的文本分类器利用 Transformer 模型顶部的特殊线性层来生成类别概率分布。这种方法存在两个问题：第一，当向问题中引入新的类别标签，或尝试使用不同的类别标签（这在现实世界的机器学习中经常发生）时，我们基本上需要丢弃该线性层并从头开始训练。第二，这种方法中，模型仅基于训练示例与手工标注类别标签之间的联系来学习类别的含义。它不会从类别标签词背后的语义含义中提取任何知识。例如，在上一节的练习中，我们使用\
  \ IMDB 数据集并使用 `NEGATIVE` 和 `POSITIVE` 类别标签执行了情感分析。在经典的文本分类方法中，类别标签只是类别的唯一标识符，没有语义含义。如果我们调整标记语料库并将\
  \ NEGATIVE 重命名为 CLASS_1，将 POSITIVE 重命名为 CLASS_2，结果将完全相同。TARS 通过一种新颖的文本分类技术克服了这两个问题，该技术使用\
  \ Transformer 模型本身并利用 Transformer 中的类别标签词语义信息。\n\n这使得 TARS 能够仅借助少量训练示例（少样本分类）进行文本分类，有时甚至完全不需要训练示例（零样本分类）。TARS\
  \ 在小规模训练数据上优于之前的方法。最重要的是，它已在 Flair 中完全实现并可直接使用。\n\n让我们尝试使用 TARS 进行少样本和零样本文本分类！\n\
  \n## 使用 TARS 进行零样本分类\n\n使用 TARS 进行零样本分类利用预训练 Transformer 内部捕获的类别标签词的语义信息，而无需使用任何训练数据。\n\
  \n在 Flair 中使用 TARS 进行零样本文本分类再简单不过了。你需要遵循以下三个步骤：\n\n- 1. 为正确的语言加载预训练的 TARS 模型。\n\
  - 2. 定义类别（希望 TARS Transformer 模型知道的）。\n- 3. 使用 `predict_zero_shot()` 方法生成预测。\n\n\
  前面的步骤听起来可能很费力，或者至少需要一定程度的编码。实际上，每个步骤只是一行代码。\n\n### 为正确的语言加载预训练的 TARS 模型\n\n在对不需要任何训练数据抱有希望之前，我们首先需要确保有可供使用的模型适用于正确的语言。在\
  \ Flair 中，截至 0.11 版本，只有一个模型可用。它是一个英语模型，名为 **tars-base**。\n\n让我们看看 tars-base 的零样本文本分类如何处理情感分析。\n\
  \n我们通过调用 `TARSClassifier.load()` 函数来加载 TARS 模型：\n\n```\nfrom flair.models import\
  \ TARSClassifier\n\ntars = TARSClassifier.load('tars-base')\n```\n\n这将下载 TARS 模型并将其存储在内存中，同时也将其存储到磁盘以供将来使用。我们现在可以定义类别标签。\n\
  \n### 定义类别\n\nTARS 模型的类别标签只是一个字符串列表。因此我们可以将情感分析类别定义如下：\n\n```\nclasses = [\"positive\"\
  , \"negative\"]\n```\n\n就这样——不需要训练或训练示例！让我们生成一些预测。\n\n### 使用 TARS 生成零样本预测\n\n让我们使用与测试基于\
  \ DocumentPoolEmbeddings 并利用 GloVe 嵌入的分类器相同的输入来测试我们的 TARS 模型。我们将看看 tars-base 是否也能正确分类这个单字句子\
  \ great：\n\n```\nfrom flair.data import Sentence\n\nsentence = Sentence(\"great\"\
  )\ntars.predict_zero_shot(sentence, classes)\n\nprint(sentence)\n```\n\n我们使用 predict_zero_shot()\
  \ 方法生成预测。前面的代码片段将打印出以下内容：\n\n```\nSentence: \"great\" → positive (0.9691)\n```\n\
  \n这表明预测的标签为 positive，置信度为 96.9%。\n\n在零训练数据的情况下，这已经相当令人印象深刻了！让我们看看使用一个带有负面含义的单字句子是否也能取得同样的成功结果：\n\
  \n```\nsentence = Sentence(\"bad\")\ntars.predict_zero_shot(sentence, classes)\n\
  \nprint(sentence)\n```\n\n\n\n这会打印出以下内容：\n\n```\nSentence: \"bad\" → negative (0.9037)\n\
  ```\n\n这清楚地表明单词 bad 与负面情感相关——或者更准确地说，与类别标签词 negative 的语义相关。\n\n最后，我们可以在之前文本分类器并不太确定的\
  \ Not quite my cup of tea 句子上测试我们的零样本分类器：\n\n```\nsentence = Sentence(\"Not quite\
  \ my cup of tea\")\ntars.predict_zero_shot(sentence, classes)\nprint(sentence)\n\
  ```\n\n这会打印出以下内容：\n\n```\nSentence: \"Not quite my cup of tea\" → negative (0.9859)\n\
  ```\n\n耶！我们有一个明显的赢家。tars-base 明确地以 98.6% 的置信度预测句子 Not quite my cup of tea 为 negative——或者更准确地说，将该句子与单词\
  \ negative 的语义含义关联起来。当然，要确定我们的分类器确实比基本的 DocumentPoolEmbeddings 分类器表现更好，我们需要进行某种评估。但与其这样做，让我们探索如何使用少样本学习进一步改进我们的分类模型。\n\
  \n## 使用 TARS 进行少样本分类\n\nTARS 模型允许我们仅使用少量标注示例来训练一个能够提供出色性能的文本分类器。\n\n让我们通过解决上一节中处理的相同问题——对\
  \ IMDB 数据集进行情感分析，来探索 TARS 少样本学习。\n\n训练 TARS 模型与我们训练 DocumentPoolEmbeddings 分类器时几乎没有区别。它涉及以下步骤：\n\
  \n- 1. 加载标注语料库并计算标签字典映射\n- 2. 加载 TARS 模型并设置任务\n- 3. 训练模型\n\n### 加载标注语料库\n\n让我们开始加载数据集。但请记住，我们需要的数据会比预期少得多得多。\n\
  \n我们将以与上一节相同的方式加载 IMDB 语料库。但这次，我们会对其进行更大幅度的降采样。毕竟，我们正在进行少样本学习。如果这些说法属实，我们应该能够仅使用几个训练示例就获得出色的性能。\n\
  \n让我们加载数据集并将其降采样到原始大小的 1%：\n\n```\nfrom flair.data import Corpus\nfrom flair.datasets\
  \ import IMDB\nimport _locale\n\n### 针对罕见的 Windows 仅有的 Flair 编码错误的解决方法\n_locale.getdefaultlocale\
  \ = lambda *_: ['en_US', 'utf8']\n\ncorpus = IMDB()\ncorpus.downsample(0.01)\nlbl_type\
  \ = 'sentiment'\nlabel_dict = corpus.make_label_dictionary(label_type=lbl_type)\n\
  ```\n\n通过前面的代码片段，我们加载了 IMDB 数据集，该数据集最初包含来自 IMDB 的 50,000 条电影评论。每条评论都标记为 POSITIVE\
  \ 或 NEGATIVE 标签。然后我们将语料库降采样到原始大小的 1%——仅剩 500 条评论。然后我们计算标签字典，这在不久后会派上用场。\n\n### 加载\
  \ TARS 模型并设置任务\n\n我们现在将以与零样本学习示例相同的方式加载 TARS 模型。但这次，我们需要告诉模型它将被重新训练，目标是预测两个特定的标签。我们将通过使用\
  \ add_and_switch_to_new_task() 方法来实现这一点：\n\n```\nfrom flair.models import TARSClassifier\n\
  from flair.data import Sentence\n\ntars = TARSClassifier().load('tars-base')\n```\n\
  \n```\ntars.add_and_switch_to_new_task(\n    task_name=\"sentiment_analysis\",\n\
  \    label_dictionary=label_dict,\n    label_type=lbl_type)\n```\n\n与之前相同，我们加载 tars-base\
  \ 模型。但这次，我们传入了一些额外信息，告诉模型它将执行特定任务。它将把文本分类为 label_dict 变量中定义的部分类别。\n\n我们现在准备训练实际模型。\n\
  \n### 训练少样本 TARS 模型\n\n本身而言，训练少样本模型并不比在 Flair 中训练任何其他模型更复杂。唯一显著的区别是所需的计算能力。在本书之前的练习中，你可以用\
  \ CPU 进行模型训练，而唯一牺牲的是由于 epoch 较少或模型尺寸较小而导致的模型性能略有下降。但在这里，我们处理的是一个完整尺寸的 Transformer\
  \ 模型，几乎没有办法减少所需的计算能力。\n\n你需要一台配备 GPU 的机器或 Google Colab GPU 运行时才能成功运行以下代码。\n\n此时本书中的以下训练语法应该看起来非常熟悉：\n\
  \n```\nfrom flair.trainers import ModelTrainer\n\ntrainer = ModelTrainer(tars, corpus)\n\
  trainer.train(base_path='few-shot-tars',\n            learning_rate=0.02,\n    \
  \        mini_batch_size=16,\n            mini_batch_chunk_size=4,\n           \
  \ max_epochs=6)\n```\n\n在前面的代码片段中，我们指示模型训练器将我们的 TARS 模型训练六个 epoch（在训练生产模型时，此数字应设置得更高）。我们还将批量大小和批量块大小设置为非常低的值，以增加机器能够处理它的可能性。\n\
  \n这现在将开始训练，在平均 GPU 实例上大约需要 30 分钟。完成后，模型将存储在 few-shot-tars/best-model.pt 中，相对于你运行代码的位置。在\
  \ Google Colab 中，你可以通过将代码指向其位置 few-shot-tars/best-model.pt 作为同一运行时的部分来无问题地访问模型。但是，如果你重新启动\
  \ Colab 笔记本运行时，模型将会消失。\n\n### 使用自定义少样本 TARS 模型\n\n训练完成后，训练好的模型将存储在内存中。但如果由于某种原因你的\
  \ Python 会话崩溃，你可以通过运行以下命令从磁盘加载模型：\n\n```\ntars = TARSClassifier().load('few-shot-tars/best-model.pt')\n\
  ```\n\n很好。我们现在可以生成一些预测。让我们使用该模型并为其提供与之前训练的模型完全相同的输入，观察是否有任何改进。\n\n让我们从最基本的例子开始。让我们用单词\
  \ great 进行预测：\n\n```\nfrom flair.data import Sentence\n\nsentence = Sentence(\"\
  great\")\ntars.predict_zero_shot(sentence, classes)\n\nprint(sentence)\n```\n\n\
  这会打印出以下内容：\n\n```\nSentence: \"great\" → positive (0.9991)\n```\n\n99.9% 的确定性！这明显优于零样本模型得到的\
  \ 96.9%。\n\n让我们再试一个简单的例子——单词 bad：\n\n```\nsentence = Sentence(\"bad\")\ntars.predict(sentence)\n\
  \nprint(sentence)\n```\n\n这会打印出以下内容：\n\n```\nSentence: \"bad\" → NEGATIVE (0.946)\n\
  ```\n\n不错！这又是零样本模型的又一次改进。现在，让我们尝试稍微复杂一点的句子：\n\n```\nsentence = Sentence(\"Not quite\
  \ my cup of tea\")\ntars.predict(sentence)\n\nprint(sentence)\n```\n\n这会打印出以下内容：\n\
  \n```\nSentence: \"Not quite my cup of tea\" → NEGATIVE (0.9921)\n```\n\n这是迄今为止最好的结果！\n\
  \n> **重要说明**\n> 在我们的练习中，我们经常通过比较仅基于几个示例的结果来评估模型性能。这只是为了说明我们的新模型在一般情况下的表现。要得出哪个模型表现最好的结论性答案，你应该始终使用适当的评估技术并在相同数据上评估模型。\n\
  \n我们的 TARS 少样本模型在仅使用原始数据集的 1% 并且仅训练六个 epoch 的情况下，实现了与之前模型相当或更好的性能。真是令人惊叹！\n\n凭借这一卓越的、最先进的\
  \ NLP 技术，我们结束了文本分类主题的讨论。\n\n## 总结\n\n本章提供了 Flair 中文本分类方法的概述。我们首先介绍了为动手文本分类任务奠定基础的一些基础知识和理论。我们从探索经典文本分类技术开始，并在\
  \ IMDB 数据集上训练了我们自己的模型。后来，我们了解了 TARS 分类器，并见证了它们惊人的少样本和零样本分类能力。\n\n这不仅结束了本书的文本分类部分；它还结束了探索\
  \ Flair 能做什么的整个部分。我们现在拥有了序列标注、词嵌入、Flair 的预训练模型集合、训练我们自己的序列标注模型、超参数调优等方面的知识和经验，以及更多、更多的内容。\n\
  \n\n\n\n没有什么能阻止我们把一些代码组合起来并在现实世界中部署一个 NLP 模型……好吧，除了我们不太确定如何将这些模型作为生产级服务的一部分进行部署、托管或维护之外。我们将在下一章学习关于这方面的内容。\n"
- '# 第 3 部分：使用 Flair 进行实际应用


  在本部分中，您将学习如何在生产环境中部署和使用 Flair 模型。您将通过一系列实践练习，使用本书中获得的所有知识来解决现实世界的问题。


  本部分包含以下章节：


  - 第 9 章，在生产环境中部署和使用模型

  - 第 10 章，动手练习 – 使用 Flair 构建交易机器人

  '
- "## 9 在生产环境中部署和使用模型\n\n当 **自然语言处理** (**NLP**) 研究人员和科学家致力于改进某个 NLP 模型时，他们通常会花费大量时间来改进模型某个非常具体的部分或方面。工作完成后，结果会被收集并作为学术论文的一部分发表。然而，如果你计划将\
  \ NLP 用于实际目的，无论是作为商业解决方案还是作为个人项目的一部分，经过良好训练的模型通常只是你旅程的开始。\n\n在本章的第一部分，我们计划介绍在使用\
  \ NLP 模型进行生产时通常遇到的典型问题，如何克服这些问题，以及如何使我们的模型公开可用。然后我们将通过构建自托管 NLP 解决方案从底层解决这个问题。我们将讨论可用于自托管的工具和库，以及你应该或不应该选择自托管的原因。最后，我们将介绍各种托管的\
  \ NLP 机器学习即服务解决方案，以及如何以及何时使用它们。我们将以一个动手练习作为总结，在该练习中我们使用 **Hugging Face 加速推理 API**\
  \ 将 Flair 模型部署到生产环境。\n\n在本章中，我们将讨论如何解决这些问题并轻松地将自己的 Flair 模型部署到生产环境，具体内容如下：\n\n-\
  \ 生产环境中 NLP 模型的技術考量\n- 自托管 Flair 模型\n- 使用托管服务部署和使用 Flair 模型\n\n### 技术要求\n\n运行本章代码，您需要使用\
  \ Flair 版本 0.11 的常规本地 Python 环境。您还需要一个额外的 Python 库，名为 Flask 版本 2.0.3。本章涵盖的代码示例可在本书官方\
  \ GitHub 仓库的以下 Jupyter 笔记本中找到：https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter09。\n\
  \n### 生产环境中 NLP 模型的技術考量\n\n部署机器学习（尤其是 NLP）模型与部署其他软件解决方案的不同之处在于一个关键领域——运行服务所需的资源。从理论上讲，为简单的移动或\
  \ Web 应用托管通用服务，可以由任何现代设备（如 PC 或手机）完成。只有当你开始扩展服务以满足更多受众时，才需要投入额外的思考、努力和资源来使其更具可扩展性。在提供机器学习模型服务时，事情往往从一开始就变得复杂。我们处理的模型非常庞大，以至于典型的\
  \ Web 服务器有时甚至无法将模型加载到内存中。每个请求都会消耗大量资源，但我们需要在按需、实时并面向大量受众的情况下提供请求。但该怎么做呢？\n\n将本章主题与本书迄今为止所涵盖的内容进行比较时，您会注意到将模型部署到生产环境是一个全新的问题，需要略微不同的技能集。我们在前几章中所做的工作专注于数据的理解和处理，以及利用不同的机器学习和自然语言处理技术来实现特定目标。这些知识现在相关性较低。我们现在关心的是以能够尽可能快地、尽可能可靠地、尽可能少地使用资源的方式部署和维护\
  \ NLP 服务。简单，对吧？\n\n实现这一目标所需的技能集通常与设计和训练 NLP 模型所需的技能集如此不同，以至于通常会交给完全不同的人——软件或 MLOps（机器学习、DevOps\
  \ 和数据工程相结合的领域）工程师。Packt 出版了一本名为 Engineering MLOps 的优秀书籍，您可以在其中了解更多关于这个有趣的工程领域的信息。但虽然将\
  \ ML 模型部署到生产环境需要非常特定的技能集，但它本身并不是一个不可能的过程，任何遵循这些步骤的人都可以做到。\n\n在做出有关部署 NLP 模型的任何决定之前，您需要先问自己以下问题：\n\
  \n- 推理（生成预测的过程）将在客户端还是服务端进行？\n- 服务需要可扩展吗？\n- 你是想通过这项工作来学习，还是仅仅实现一个目标？\n- 你的模型能否部署在托管服务上？\n\
  \n所有这些决定在确定 NLP 模型部署的位置和方式方面都起着重要作用。让我们详细研究每个要点。\n\n### 客户端与服务端推理\n\n可能与部署 NLP 模型相关最重要的、同时也是最容易回答的问题是，它们是存储在客户端机器上并在本地执行推理，还是模型存储在服务器或托管云服务上并远程执行推理。\n\
  \n当机器学习推理在客户端机器（如手机、笔记本电脑、PC 或电子书阅读器）上本地执行时，我们称之为客户端推理。\n\n当机器学习推理在服务器或托管云服务上远程执行时，我们称之为服务端推理。\n\
  \n这两种方法各有利弊，选择哪一种几乎总是取决于你试图用 NLP 模型解决的问题，因为此时你已经知道模型解决的是什么 NLP 问题；这意味着该决策通常非常直接。\n\
  \n因为机器学习模型通常很大且需要大量资源，ML 社区中普遍存在一种误解，即所有机器学习推理都需要在大型的 GPU 配备机器上在服务端完成。\n\n毫无疑问，鉴于\
  \ Transformer 和其他 NLP 模型规模的近期增长，使用机器学习模型本地化的时代已经结束？我的手机或笔记本电脑永远无法处理生产级的机器学习模型，对吧？\n\
  \n尽管前一句听起来很合理，但它无可否认且完全是错误的。如果你正在使用电子设备阅读本书，那么你使用的机器很可能装满了机器学习模型。\n\n现代电子设备使用本地存储的机器学习模型来解决多种不同的任务：\n\
  \n- *手机、笔记本电脑和 PC 上的面部识别*：现代电子设备使用针对低性能设备优化的计算机视觉模型来即时执行面部识别，无需网络连接。如果只有在互联网连接正常时才能解锁手机或笔记本电脑，那将是相当不幸的。\n\
  - *手机上的指纹识别*：指纹识别是另一种强调速度的解锁设备方法。用户期望指纹在毫秒内被识别。除了速度之外，存储指纹识别模型在本地的另一个主要原因是隐私。大多数用户如果意识到他们的指纹数据被传输到位于地球另一端的大型科技公司拥有的服务器上，即使公司的意图完全无害，也会感到震惊。低延迟和隐私对于指纹识别至关重要，这就是为什么制造商几乎总是选择客户端推理。\n\
  - *虚拟键盘的输入预测*：低延迟和隐私超过预测质量的另一个领域是虚拟键盘。软件键盘会下载并本地存储输入预测模型，这使用户即使在地下火车等离线环境中也能利用输入预测。\n\
  - *自动驾驶汽车*：自动驾驶汽车使用多种机器学习模型，使其能够对车辆导航做出决策。\n- *手机上的 AI 相机应用*：现代手机相机应用利用专门的机器学习算法，根据环境选择正确的相机设置，然后使用基于机器学习的图像处理软件对图像进行后处理。模型需要快速、响应迅速且始终可用——这非常适合本地推理。\n\
  \n\n\n列表还在继续，这清楚地表明目前存在对专为本地推理设计的专用低资源机器学习模型的需求。完全有可能未来趋势会更偏向服务器端，但本地模型不太可能完全消失。这仅仅是因为支配理论最小信号延迟的物理定律。例如，即使在理论上最好的情况下，我们开发出将推理时间接近于零的服务器端机器学习服务，并构建以真空中光速传输信号的网络基础设施，从巴黎的设备向纽约的服务器发送推理请求并返回所需的时间仍将为\
  \ 54 毫秒（光在真空中从巴黎到纽约再返回所需的时间）。因此，即使是服务器端推理在理论上最好的情况，对于自动驾驶汽车等某些应用来说仍然太慢。\n\n服务器端推理和客户端推理显然各有一套优势和缺点，在仓促做出决定之前，权衡利弊非常重要。\n\
  \n### 使用本地推理的优势：\n- *隐私：* 对了解网络协议和通信有多安全的普通工程师来说，自己的面部照片或指纹扫描通过互联网传输的想法并不令人反感或害怕。然而，对于非技术人员来说，这意味着灾难。当高度个人化或生物识别数据通过互联网传输的消息引起媒体关注时，对公司的影响将是巨大的。无论公司是否开发了最安全的算法，甚至可能比本地推理更安全，媒体和对此感到震惊的人都不会在意，损害已经造成。因此，在处理个人和生物识别数据时，必须仔细考虑这些数据将如何以及在何处传输和存储。完全避免这一问题的最好方法是根本不传输数据，而是改用本地推理。\n\
  - *无网络延迟：* 强大的服务器和超级计算机有可能比普通手机更快地进行推理，但如果我们选择远程推理路线，我们的请求和结果需要在互联网上传输，会产生网络延迟。通过完全不进行网络通信——即使用本地推理——我们可以完全消除网络延迟。\n\
  - *维护：* 为低资源设备优化模型很困难。但一旦做对，并构建出可在各种设备上运行的模型并成功部署，你的工作就完成了。使用本地推理时，没有需要维护的服务，也没有需要监控的网络峰值——只需坐下来放松即可。\n\
  - *成本节约：* 听起来很苛刻，但这是事实。当公司使用客户端推理而不是服务器端推理时，生成机器学习模型结果所需的所有计算都将在客户设备上完成。这些计算会使用电力。而电费是由……客户支付的。\n\
  - *按设计扩展：* 当我们使用服务器端推理从 1 个用户扩展到 10 个用户时，所需的计算能力将增加十倍。使用本地推理则不同。推理默认是分布式的。我们为每个用户都有一台专用的机器学习推理机器——他们自己的设备。无论是单个用户在其机器上进行推理，还是十亿用户，都无关紧要。这引出了一个有趣的结论——*本地推理按设计实现扩展。*\n\
  \n### 使用本地推理的缺点：\n- *兼顾资源和性能限制：* 你计划部署的模型很可能需要在计算能力各不相同的多种设备上运行。你应该部署一个非常简单、功能受限的模型，让它能在所有设备上运行但性能不佳吗？你应该只在高端设备上部署模型，直接告诉低端设备用户无法使用该功能吗？还是应该为每种设备类型构建不同的模型——一些用于低端设备，一些用于高端设备？如果你选择本地推理路线，这些都是你需要回答的问题，而答案将取决于业务需求和要求。\n\
  - *因尺寸和资源限制导致预测质量受损：* 本地推理模型需要很小。它们需要能够装入手机等设备并存储在其非常有限的内存中。这意味着模型在参数数量方面将受到极大限制。为了优化本地推理模型，你可能需要大幅减小其尺寸。这无疑会对预测质量造成巨大打击。\n\
  - *模型更新的版本地狱：* 如果你将模型托管在远程服务上，要用更新、改进的版本更新模型，只需在远程服务上将旧模型替换为新模型即可。然而，使用本地推理，事情变得复杂。为了使模型更新成为可能，你首先需要实现一个管理更新的系统。然后你需要将新模型发布给拥有互联网连接并选择接收更新的所有设备，但你也需要考虑到仍有一部分用户由于没有互联网连接或拒绝接受更新而永远不会更新。因此，你的用户群将使用各种不同版本的模型，你需要全部支持它们。\n\
  \n相反，使用服务器端推理的优势列表也很长：\n- *服务器端应用可以使用开箱即用的机器学习即服务解决方案：* 如果你选择服务器端推理，一个全新的现成解决方案世界将为你敞开，这些解决方案可能只需几次点击就能将你的模型从文件部署到生产服务。如果你计划在服务器端进行推理，可以使用大量托管服务，而对于本地推理，你至少在一定程度上需要重新造轮子。\n\
  - *你可以使用最先进的模型：* 当前最先进的 NLP 模型具有大量的参数，我们短期内无法期望它们中的任何一个能装入手机等设备。要在生产中使用最先进的 NLP\
  \ 模型，你只能求助于服务器端推理。\n- *更新简单且全面：* 与本地推理不同，要在服务器端更新模型，只需在一个点上将旧模型替换为新模型即可。一旦这样做，从那时起进行的所有推理都将使用新模型生成的结果。\n\
  \n在本节开头，我们提到在客户端推理或服务器端推理之间做出选择通常是一个简单的问题要回答。归根结底，无非是想要拥有巨大的高性能模型但伴随网络延迟，还是想要完全没有网络延迟但模型质量受损。\n\
  \n服务器端推理方法简化了 NLP 模型部署的许多方面，但也提出了许多新的问题。让我们在下一节中讨论这些问题。\n\n## 何时使用托管服务，何时自行托管服务器端模型\n\
  \n另一个对你如何管理 NLP 服务产生巨大影响的重要决策，归结为你是否选择托管服务还是决定自行托管。\n\n如果我们决定自行托管模型，这意味着我们将负责设置服务器基础设施，构建交付\
  \ NLP 结果的端点软件，构建对模型进行推理的软件，在用户群增长时扩展系统，以及更多、更多。我们本质上将手动负责整个机器学习生命周期。\n\n\n\n相反地，托管或完全托管的服务是一种商业解决方案，可为其中大部分任务提供支持。完全托管的机器学习服务提供开箱即用的以下支持：\n\
  \n- *受管基础设施：* 在部署 NLP 服务时，最终模型很可能存放在数据中心某处的特定机器上。为了让我们的用户使用我们的服务，他们需要通过域名或 IP 地址访问这台机器的方式。要搭建自助式\
  \ NLP 服务，需要部署基础设施以确保正确的请求到达正确的服务器，从而将结果返回给用户。所有这些决策在托管服务中都已为我们处理好。\n- *托管端点：* 从工程角度来看，机器学习模型是一个二进制文件，可以加载到内存中，并通过机器学习库执行推理。然而，由于我们采用的是服务端推理方法，这意味着如果用户需要从\
  \ NLP 模型获得预测，他们需要通过互联网发送请求。该请求需要到达服务，服务需要解释请求并以适当的结果作出响应。因此，客户端和服务之间需要达成一致的通信方式。一种流行的解决方案是使用名为\
  \ **REST** 的通信协议，它允许通过使用 **HTTP** 或 **HTTPS** 协议的 **REST API** 进行通信。但机器学习端点不仅仅负责客户端-服务器通信、解析请求、执行推理并将结果返回给用户。它们还有许多其他职责。它们需要返回适当的错误消息，如果出现问题（例如输入文本超过长度限制）。如果用户没有访问权限，它们需要返回适当的错误消息。它们需要能够同时处理大量请求并适当排队。它们需要执行诸如缓存之类的优化任务。\n\
  \n在构建生产级 NLP 服务时，你需要考虑这些问题并自行实施解决方案。托管服务会处理所有这些问题。\n\n但值得一提的是，托管服务只能做到一定程度。虽然自托管很麻烦，但它允许你实现任何想要的功能并添加任何你能想到的特性。使用托管服务时，你仅限于使用服务提供的功能。\n\
  \n- *扩展：* 完全托管 ML 服务的最大卖点之一是可扩展性的承诺。它解决了自托管最大的问题之一，即陷入不可扩展的基础设施。例如，假设你在单台虚拟机上实现了一个简单的\
  \ ML 端点。该解决方案易于实现，并且对少数日常用户效果很好。但当你开始获得更多用户时，服务开始返回延迟结果，过多的流量迟早会导致服务拒绝。应用程序然后需要被修改以能够处理中等数量的日常用户。到该解决方案实施时，你将因服务不可用而失去大量客户。当能够处理中等流量量的解决方案实施后，你可能会意识到用户数量增长过快，整个解决方案需要再次重新实现以使其具备高流量处理能力。\n\
  \n完全托管的 ML 服务声称可以解决所有这些问题。它们宣传其服务默认可扩展。这意味着如果你的服务对 1 个日常用户效果很好，理论上对 100 万个日常用户也应同样有效。这使你能够将时间和资源花费在更有用的工作上。\n\
  - *部署模型和版本控制：* 大多数完全托管的 ML 服务都附带一套用于部署 ML 模型的工具和功能。在某些情况下，使用它们就像上传 ML 模型二进制文件并点击\
  \ **deploy** 一样简单。\n- *监控：* 如果你决定自托管，你不可避免地还需要构建或设置监控工具。这些工具提供有关有多少用户使用该服务的洞察，并帮助你决定是否应该扩展。几乎所有托管服务都开箱即用提供此功能。\n\
  - *Freemium 定价计划和低设置成本：* 大多数完全托管的 ML 服务具有接近零的设置成本，并且采用按需付费的定价计划。此外，一些服务提供 Freemium\
  \ 服务，其中前 *N* 个每日/每月请求是免费的。与自托管相比，这些服务的定价通常具有竞争力且价格实惠。只有当公司发展到相当大的规模（例如成为大型企业）时，完全托管服务才会变得比雇佣专门负责自托管的团队更不经济。\n\
  \n## 重要说明\n\n完全托管的 ML 服务还提供完整的 ML 生命周期工具，其中包括数据标注、数据预处理、模型训练、部署和验证。这些功能在设计上在它们能做什么方面有限，并且通常仅支持有限的\
  \ NLP 任务集，例如文本分类，但可能不适用于序列标注等任务或专门训练 Flair 模型。\n\n由于很少有流行的托管 ML 服务提供对 Flair 可以构建的所有类型模型整个\
  \ ML 生命周期的支持，我们计划仅关注将你的 NLP 模型部署到生产所需的步骤。设置用于维护和模型更新的自动化管道所需的步骤将被省略，因为它们与一个更通用的领域相关，称为\
  \ MLOps。\n\n前面的项目符号列表显示了许多明显有利于完全托管服务的要点。这就引出了一个问题，为什么不在每次都使用托管服务而不是自托管？\n\n对前面问题的一般回答是：如果可以，你应该这样做。然而，在某些情况下，自托管可能是一个更合理的选择。如果你符合以下情况，可以决定自托管：\n\
  \n- 你想从低级工程角度了解如何设置 ML 服务。\n- 你拥有足够大的用户群，以至于使用托管 ML 服务变得不经济。\n- 你正在使用的 ML 库、框架或任务不受托管服务支持。\n\
  \n除非你属于前面项目符号列表中描述的任何类别，否则你很可能最好直接使用完全托管的服务。\n\n有了这些，让我们来看看你可以用哪些服务来部署 Flair 模型。\n\
  \n## Managed services for Flair models\n\n用于托管 ML 模型的托管服务通常是由大型科技云平台或提供 ML 即服务的专业\
  \ ML 公司的商业解决方案提供的。\n\n然而，可以与 Flair 一起使用的服务列表不断变化，用于交互和管理这些服务的用户界面也是如此。这意味着一个专注于如何与特定托管\
  \ ML 服务的 UI 或 API 交互的分步指南很可能在一年内就会过时。\n\n不过你并不无计可施！有一个例外。有一种特定的服务与 Flair 紧密集成，并且很可能在未来几年内得到支持。它被称为\
  \ **Hugging Face Models Hub**。它是一个托管大量 ML 模型的存储库，同时还提供在网络浏览器中测试它们、查看如何训练它们的说明以及将其作为服务部署的工具。\n\
  \n稍后，我们将看看如何训练、托管和使用作为 Hugging Face Accelerated Inference API 服务一部分部署的 Flair 模型。\n\
  \n但在结束本节之前，让我们回顾一下本节中涵盖的所有建议、提示和技巧。\n\n## 模型部署决策流程图\n\n为了让 Flair 模型部署决策更容易，我们准备了一个流程图，帮助你决定将\
  \ Flair 模型部署到生产环境的正确路径。\n\n根据你的业务需求、资源和抱负，你将有以下三种部署 Flair 模型的选项：\n\n- 客户端部署与本地推理\n\
  - 完全托管的 ML 即服务解决方案\n- 自托管\n\n\n\n\n下面的流程图将使你更容易在前述三种方法之间做出选择：\n\n![](img/c56c48b8fd18a11ab705352d618ed976_162_0.png)\n\
  \n图 9.1 – NLP 模型部署决策流程图\n\n根据你的具体情况，你最终会使用三种机器学习部署类型之一。请记住，所提出的决策过程纯粹基于良好的实践和主观建议。每个人的情况都不同，你应始终使用自己的或其他专家的判断。\n\
  \n无论你选择哪种机器学习部署路线，了解每种可能选项至少达到一定程度都是很有用的。\n\n让我们在以下动手练习中探索自助式服务和使用托管机器学习解决方案。\n\n\
  ## 自助式 Flair 模型\n\n无论你决定自助服务还是使用完全托管的服务，对 NLP 模型部署推理在生产环境中如何工作有基本的了解始终是有用的。\n\n\
  由于在生产环境中部署 NLP 模型更像是一项软件工程壮举而非 NLP 挑战，因此通用的软件工程规则适用——其中最主要的一条是，*不要重复造轮子。*\n\n虽然自行实现\
  \ NLP 模型服务框架完全可行，但这样做需要大量的时间。很可能即使你竭尽全力实现一个解决方案，也无法构建出比由数百名不同贡献者打造的现有开源解决方案更好的产品。\n\
  \n用于自助式 NLP 模型的工具和包种类繁多，但有一个特定包因其对 **PyTorch** 包的支持（Flair 建立在 PyTorch 之上）以及对 Hugging\
  \ Face 模型的支持而脱颖而出。该包名为 **TorchServe。**\n\n## 使用 TorchServe 自助式服务 Flair 模型\n\nPyTorch\
  \ 是一个流行的开源机器学习框架。Flair 本身是一个 NLP 框架，建立在 PyTorch 之上，并利用其工具来设计、训练和存储神经模型。\n\n由于 Flair\
  \ 模型本质上是 PyTorch 模型，像 TorchServe 这样的工具似乎非常契合。让我们通过查看其设计图来了解 TorchServe 的工作原理：\n\n\
  ![](img/c56c48b8fd18a11ab705352d618ed976_163_0.png)\n\n单台物理或虚拟机\n\n图 9.2 – TorchServe\
  \ 设计\n\n前述设计示意图展示了 TorchServe 框架的各个部分，如其官方文档 https://github.com/pytorch/serve 中所述。\n\
  \n让我们来看一下主要组件：\n\n- **前端：**负责处理请求的组件。它接收用户的请求作为输入，对其进行解析，并将其传递给后端，后端返回模型输出，然后对输出进行处理、格式化并发送回用户。\n\
  - **推理端点：**前端的特定部分，可通过特定地址访问，负责处理请求并返回结果。\n- **推理 API：**允许并定义客户端与前端之间通信的 API。\n\
  - **模型存储：**包含模型的目录。\n- **后端：**一个线程组件，包含负责执行推理的模型处理器。\n- **管理 API：**一个专用 API，面向应用程序所有者，允许我们配置服务。\n\
  \n使用 TorchServe 服务一次的事件流程如下。客户端首先使用推理 API 向前端发送请求。请求包含一个负载，其中包含将提供给 NLP 模型的输入。如果框架太忙而无法处理请求，则请求会被批处理（排队）。如果不忙，则请求会被传递到端点，在那里进行解析，并将负载传递给模型处理器。模型处理器对加载的\
  \ NLP 模型执行推理并将输出返回给端点。端点准备并格式化输出（通常使用 JSON 格式）并将其返回给用户。\n\n前述对 TorchServe 设计的介绍提供了其工作原理以及如何用于服务\
  \ NLP 模型的高层次概述。TorchServe 的设置和安装过程可能非常依赖平台，并非几行代码就能轻松涵盖的内容。设置 TorchServe 的整个过程在\
  \ GitHub 上的官方文档中得到了精彩的描述。\n\n但不要因为本书不会深入介绍 TorchServe 而感到沮丧。在接下来的部分中，我们将实现我们自己的用于服务\
  \ Flair 模型的概念验证工具。\n\n## Flair 的概念验证自助服务工具\n\n实现一个可靠、可扩展、安全且生产级的 NLP 自助服务工具是一个复杂的过程，需要数周甚至数月的精心思考和准备。在大多数情况下，与其自己实现解决方案，使用现有的开源工具如\
  \ TorchServe 会更好。\n\n但有时，我们只是想构建一个概念验证。这是一个简单的工具，展示我们的模型能做什么，并使服务至少可供少数用户/客户使用。\n\
  \n为了了解这一点，让我们构建一个简单的服务，使用 Flair 的最先进的英语命名实体识别（NER）标注器执行命名实体识别。\n\n该解决方案可按照以下步骤实现：\n\
  \n- 1. 安装所需的库\n- 2. 定义序列标注函数\n- 3. 定义端点\n- 4. 启动服务\n\n让我们逐步实现该解决方案。\n\n## 安装所需库\n\
  \n除了 Flair 之外，这个概念验证工具还需要一个额外的库，该库不是 Python 标准库的一部分预装的；它也不是 Flair 的传递依赖（必需库的要求）。该库称为\
  \ Flask。它是一个轻量级的 Python 框架，用于设置端点，是一个完美的原型工具。\n\n我们将通过运行以下命令安装版本 2.0.3：\n\n```\n\
  pip install flask==2.0.3\n```\n\n这将安装 Flask 2.0.3 版本，确保你的代码行为一致。\n\n## 定义序列标注函数\n\
  \n接下来，我们需要定义一个函数，对某些输入文本执行命名实体识别。我们将使用 Flair 默认的最先进的 NER 标注模型，该模型使用 ner 模型键：\n\n\
  ```\nfrom flair.data import Sentence\nfrom flair.models import SequenceTagger\n\n\
  tagger = SequenceTagger.load('ner')\n\ndef tag_text(input_text):\n    sentence =\
  \ Sentence(input_text)\n    tagger.predict(sentence)\n\n    return sentence.to_tagged_string()\n\
  ```\n\n在前面的代码片段中，我们使用本书中多次使用的标准序列标注语法定义了 tag_text(input_text) 函数。该函数接收文本作为输入并返回标注后的文本作为输出。例如，对于输入文本\
  \ in New York，它将返回输入字符串的标注版本 – \"in New York\" → [\"New York\"/LOC]。\n\n前面的代码围绕我们如何定义\
  \ tagger 对象展开。它在标注函数外部全局定义，确保模型只加载一次，可用于任意数量的请求。请注意，这种方法会导致生产级解决方案出现问题，其中多个进程尝试使用同一个\
  \ Flair 模型对象。\n\n我们现在准备定义我们的端点。\n\n## 定义端点\n\n该端点负责在特定地址可用以接收请求，解析请求，将其传递给 tag_text()\
  \ 函数，准备结果并将其传回用户：\n\n```python\nfrom flask import Flask, jsonify, request\n\napp\
  \ = Flask(__name__)\napp.config['JSON_AS_ASCII'] = False\n\n@app.route('/ner-service')\n\
  def query_example():\n    text = request.args.get('input', '')\n\n    tagged_text\
  \ = tag_text(text).replace('\"', '\\'')\n\n    return jsonify({\"result\": tagged_text})\n\
  ```\n\n前面的代码片段首先定义了 Web 服务的 app 对象。下面的函数是 Web 端点的定义。我们通过在函数定义前加上 @app.route('/ner-service')\
  \ 装饰器来定义端点。这确保端点可在 /ner-service 地址访问。\n\n\n\n我们然后直接从 URL 中获取输入文本，作为 `input` 查询字符串参数的一部分。这意味着如果用户向\
  \ `/ner-service?input=in+New+York` 发送 GET 请求，`text` 变量的值将是 *in New York*。\n\n> **重要提示**\n\
  > 使用 GET 查询字符串参数作为接收客户端文本输入的方式几乎总是一个坏主意。我们在此代码示例中使用 GET 是因为仅使用 Web 浏览器进行调试很容易。对于生产级服务，您应该改用\
  \ POST。\n\n该端点将输入文本传递给我们的 `tag_text()` 函数并以 **JSON** 格式返回结果，这使得结果既可被软件轻松解析，也可被人类阅读。\n\
  \n就这样！现在，我们只需要启动服务。\n\n## 启动服务\n\n然后可以通过运行以下命令启动服务：\n\n```\napp.run(debug=False,\
  \ port=9002)\n```\n\n该代码将使用端口 `9002` 启动一个 Web 服务，并将在 `/ner-service` 地址注册一个先前定义的端点。请注意，前述命令将一直运行，直到我们的\
  \ Web 服务崩溃为止。如果您需要停止服务，只需终止代码片段的执行即可。\n\n现在我们可以通过将浏览器指向我们自己的机器的本地 IP 地址 `127.0.0.1`\
  \ 来测试我们出色的 NER 标注 Web 服务。\n\n让我们首先在不提供任何输入文本的情况下访问我们的端点，将 Web 浏览器指向 `http://127.0.0.1:9002/ner-service`。\n\
  \n我们的服务返回以下内容：\n\n```\n{\"result\":\"\"}\n```\n\n这表明返回的标注文本为空字符串。鉴于未提供输入，这是有意义的。现在，让我们使用一些实际输入进行测试，访问\
  \ `http://127.0.0.1:9002/ner-service?input=Never+been+to+Lima`。\n\n我们期望前述请求的响应是一个字符串，其中单词\
  \ Lima 被标记为地点。让我们看看：\n\n```\n{\"result\":\"Sentence: 'Never been to Lima' → ['Lima'/LOC]\"\
  }\n```\n\n耶！看起来我们的 NER 标注服务按预期工作。您现在可以在 Web 服务器上启动此服务，或将您自己的开发机器的 IP 地址公开——从而使服务面向全世界可用。\n\
  \n但在这样做之前，请记住，我们的概念验证解决方案有一长串缺点和问题，如果服务用于商业用途，这些问题将会出现。缺点包括：没有输入清理、没有请求授权、没有缓存、没有多线程可用性或线程安全、输出难以解析、没有日志或监控……等等。这清楚地表明此类代码只能用于原型设计。对于生产级代码，使用开箱即用的解决方案（如\
  \ TorchServe）几乎总是有意义的。\n\n更好的办法是，您可以完全避免编写代码——通过使用托管服务。让我们在下一节学习如何做到这一点。\n\n## 使用托管服务部署和使用\
  \ Flair 模型\n\n与自托管不同，自托管需要手动处理机器学习生命周期的大多数方面，而托管和完全托管的机器学习服务则推销完整的开箱即用机器学习即服务解决方案的理念。\n\
  \n这些服务大多数提供关于服务可用性（服务保证正常工作的百分比）和可扩展性（无需每次用户群增长时都重构整个基础设施即可扩展的能力）的保证。一些服务还提供称为机器学习模型运营化（MLOps）管理的整个机器学习生命周期的管理。但一些托管服务可能难以提供对\
  \ Flair 能够解决的所有功能和任务的支持。这适用于几乎所有流行的机器学习即服务解决方案，只有一个例外——Hugging Face Models Hub。\n\
  \n## Hugging Face 模型库\n\nHugging Face 是一家以自然语言处理为导向的公司，拥有庞大的开源社区。该公司在发布其 transformers\
  \ 库后变得广受欢迎（更多信息可参见 https://huggingface.co/）。他们还提供 Hugging Face Models Hub，这是一个 NLP\
  \ 模型和数据集的集合，其中大多数是公开的，意味着它们可以免费下载供任何人使用。此外，托管在 Hugging Face Models Hub 上的模型可以使用\
  \ Accelerated Inference API。这是一项具有 Freemium 定价计划的托管 NLP 服务。该服务起初是免费的，只有当更多用户开始使用时才会开始收费。模型还可以在浏览器中使用浏览器小部件进行测试，这允许您在浏览器内输入文本并观察模型行为。\n\
  \n最好的是，Hugging Face Models Hub 完全支持 flair 模型。一旦您将模型上传到 Hugging Face Models Hub，模型将为：\n\
  \n- 可通过 Accelerated Inference API 作为 NLP 服务使用\n- 可作为 Flair 中的预训练模型使用\n\n让我们作为一次动手练习的一部分学习如何同时做到这两点，该练习包括以下内容：\n\
  \n- 1. 训练一个模拟 Flair 模型\n- 2. 将模拟模型上传到 Hugging Face Models Hub\n- 3. 将模型作为 Accelerated\
  \ Inference API 的一部分使用\n- 4. 在 Flair 中使用公共模型\n\n立即开始吧。\n\n## 训练模拟 Flair 模型\n\n专注于部署和托管模型的练习首先需要一个实际模型。因为本次练习的目标是学习部署\
  \ Flair 模型，模型的实际质量并不重要。事实上，如果我们有一个极小的模型会更好，因为这会显著减少模型上传时间并让我们更快地完成本次练习。\n\n因此，让我们训练\
  \ Flair 中可以产生的最小序列标注模型。该模型在标注文本方面会很糟糕，但对于本次练习来说这并不重要。\n\n首先，让我们加载一个语料库并显著对其进行下采样以减少训练时间：\n\
  \n```python\nfrom flair.datasets import UD_ENGLISH\n\ncorpus = UD_ENGLISH().downsample(0.001)\n\
  \nlbl_type = 'upos'\nlabel_dict = corpus.make_label_dictionary(label_type=lbl_type)\n\
  ```\n\n然后，让我们选择我们的嵌入。我们将选择 CharacterEmbeddings。它在正确标注文本方面会很糟糕，但它会产生一个微小的模型，而这正是本次练习中我们真正关心的：\n\
  \n```python\nfrom flair.embeddings import CharacterEmbeddings\n\n### 使用轻量级嵌入以获得一个微小但无用的模型\n\
  embedding = CharacterEmbeddings()\n```\n\n然后，我们将以最快的方式定义并训练我们的序列标注模型——仅一个 epoch——以得到一个具有一维隐藏大小的微小序列标注器：\n\
  \n```python\nimport shutil\nfrom flair.models import SequenceTagger\nfrom flair.trainers\
  \ import ModelTrainer\n\n### 使用一维隐藏大小以生成微小模型\ntagger = SequenceTagger(embeddings=embedding,\n\
  \                        tag_dictionary=label_dict,\n                        tag_type=lbl_type,\n\
  \                        hidden_size=1)\n\ntrainer = ModelTrainer(tagger, corpus)\n\
  \n### 仅训练一个 epoch，因为此处质量无关紧要\ntrainer.train('tiny_model', max_epochs=1)\nshutil.copy2('tiny_model/final-model.pt',\n\
  \             'tiny_model/pytorch_model.bin')\n```\n\n前述代码将输出一个大约 100 KB 大小且标注文本很糟糕的微小序列标注模型——正好适合我们的练习。模型将以\
  \ `final-model.pt` 的名称保存在相对于运行此代码位置的 `tiny_model` 目录中。因为模型稍后将被上传到 Hugging Face Models\
  \ Hub，在那里它需要命名为 `pytorch_model.bin`，因此前述代码片段还创建了 `final-model.pt` 文件的副本，命名为 `pytorch_model.bin`。\n\
  \n现在我们有了模型。是时候将其上传到 Hugging Face Models Hub 了。\n\n## 将模型上传到 Hugging Face Models\
  \ Hub\n\n将模型上传到 Hugging Face Models Hub 的详细说明可在官方文档 https://huggingface.co/docs/hub/adding-a-model\
  \ 中找到。\n\n有三种方法可以将模型上传到 Hugging Face Models Hub：\n\n- 使用 `huggingface-cli` 命令行界面工具\n\
  - 使用 `huggingface_hub` Python 库\n- 使用 Hugging Face Web 界面\n\n为了保持一致性并由于其易用性，我们将介绍使用\
  \ Web 界面的过程。\n\n## 注册 Hugging Face\n\n要为 Hugging Face Models Hub 做出贡献，您首先需要一个账户。只需作为常规注册流程的一部分进行注册即可。\n\
  \n在填写一个特定的表单项时请格外小心——您的用户名。用户名极其重要，因为它将定义模型通过 Accelerated Inference API 可用的地址，以及在\
  \ Flair 中使用此模型的公共版本时的模型键。\n\n我们将选择一个随机用户名 `flairbook`，但请记住您的用户名需要是唯一的。\n\n完成注册流程后，请务必使用发送到您电子邮件地址的链接验证电子邮件地址。\n\
  \n## 创建新的模型仓库\n\n注册并验证电子邮件地址后，访问 Hugging Face 主页并点击 **New > Model**。\n\n\n\nA Hugging\
  \ Face model repository is a store of all binary files, documentation, metadata,\
  \ license files, and any other files relating to a certain model. It uses **Git**\
  \ and **Git Large File Storage (LFS)** to store the files. You can use it just like\
  \ using any other Git software repository.\n\nWe'll create a new model repository\
  \ and give it a random name, `flairmodel`. The user interface shows the model will\
  \ be available via the `<username>/<reponame>` format, which in our case is `flairbook/flairmodel`.\n\
  \nMake sure to mark the model as public.\n\n## 上传相关模型文件\n\nAfter creating the repository,\
  \ we will be redirected to the model home page. From the home page, we have the\
  \ option to clone the repository to our local filesystem or to edit and upload the\
  \ repository files through the web user interface. As part of this exercise, we'll\
  \ be using the browser interface to upload files. But keep in mind that for a large\
  \ model, using Git is highly recommended. We'll need to upload two files:\n\n- 名称为\
  \ `pytorch_model.bin` 的模型二进制文件\n- 名称为 `README.md` 的模型卡片\n\nThe model binary is our\
  \ trained model and is stored at `tiny_model/pytorch_model.bin`. We will need to\
  \ upload this file to the `root` of our Hugging Face repository. Using the web interface,\
  \ this can be done by clicking the **Files and versions** tab and then clicking\
  \ **Add file > upload file** to navigate to a form, where you can drag and drop\
  \ the model binary. After dragging and dropping the file, click **Commit changes**,\
  \ which will do the same as adding and pushing this file through Git.\n\nThe model\
  \ card can now also be added by clicking on the **Model card** tab and clicking\
  \ **Create model card**. This file is a model description file that contains metadata\
  \ (information that tells Hugging Face about what type of model this is) and description\
  \ (information that tells humans about what type of model this is).\n\nLet's create\
  \ a model card with the following content:\n\n```\n---\ntags:\n- flair\n- token-classification\n\
  widget:\n- text: \"does this work\"\n---\n## 测试模型 README\nSome test README description\n\
  ```\n\nThe top part of the preceding snippet, wrapped in the --- symbols, contains\
  \ metadata that tells Hugging Face that this is a sequence tagging model trained\
  \ by Flair. It also defines some default placeholder text for the browser widget.\
  \ The bottom part of the snippet simply defines the part of the snippet visible\
  \ to humans and acts as a description.\n\nMake sure to click **Commit new file**,\
  \ which will save the model card as README.md and make the description visible on\
  \ the **Model card** tab.\n\nWe're now ready to test our model.\n\n## 将模型作为 Accelerated\
  \ Inference API 的一部分使用\n\nAt this point, your Hugging Face model repository should\
  \ contain these two files:\n\n- `pytorch_model.bin`\n- `README.md`\n\nThe latter\
  \ will tell Hugging Face that we're dealing with a sequence tagging model trained\
  \ by Flair, and the former is the actual model binary that the hub will use.\n\n\
  If we did everything right, the model will, by default, be available on the Accelerated\
  \ Inference API. Best of all, it can be tested using the browser widget with no\
  \ code required.\n\nIf you navigate to the **Model card** tab, you will see the\
  \ widget on the right-hand side, where you can input some random text. Click **Compute**\
  \ to perform inference and produce some results, as shown in the following screenshot:\n\
  \n![](img/c56c48b8fd18a11ab705352d618ed976_173_0.png)\n\nFigure 9.3 – The Hugging\
  \ Face Models Hub widget producing test results\n\nA working widget returning some\
  \ tagged text will indicate that we did everything correctly so far. We can now\
  \ use the same model as part of the Accelerated Inference API through code.\n\n\
  > **重要说明**\n> When using the widget immediately after uploading the model, the widget\
  \ may come back with an error message saying, `Pipeline is not defined for model\
  \ flairbook/flairmodel`. If this happens, simply wait about 10 minutes and try again.\n\
  \nTo use the API, we'll first need to create a token. This token is our means of\
  \ telling Hugging Face who we are so that they can track how many requests we've\
  \ made so far and bill us accordingly. The token can be generated by going to the\
  \ user profile page on Hugging Face and clicking Edit profile and Access Tokens.\
  \ We then generate a new token with a random name and read access. When the token\
  \ is generated, it's important to copy it to a clipboard or store it somewhere safe.\n\
  \nWe're now ready to use the Accelerated Inference API. Let's run some code that\
  \ uses our newly created Flair sequence tagging service:\n\n```python\nimport requests\n\
  \nAPI_URL = \"https://api-inference.huggingface.co/models/flairbook/flairmodel\"\
  \nh = {\"Authorization\": \"Bearer <TOKEN>\"}\n\ndef query(payload):\n    response\
  \ = requests.post(API_URL, headers=h, json=payload)\n    return response.json()\n\
  \nprint(query({\"inputs\": \"abc def\"}))\n```\n\nIn the preceding code snippet,\
  \ make sure to replace <TOKEN> with the Hugging Face token you just recently generated,\
  \ flairbook with your Hugging Face username, and flairmodel with your model repository\
  \ name.\n\n> **重要说明**\n> Just like with the widget, you may see an error when using\
  \ the Accelerated Inference API immediately after uploading the model. The API may\
  \ come back with an error message saying, `the model is currently loading.` If this\
  \ happens, make sure to wait and try again in a few minutes.\n\nThe code snippet\
  \ will send input text abc def to the API and receive tagged text formatted as a\
  \ Python dictionary. The output will be different for each model trained and will\
  \ look similar to the following:\n\n```\n[{'entity_group': 'PRON', 'word': 'abc',\
  \ 'start': 0, 'end': 3, 'score': 0.24}, {'entity_group': 'ADP', 'word': 'def', 'start':\
  \ 4, 'end': 7, 'score': 0.13}]\n```\n\nThe output indicates that the first token\
  \ was tagged as PRON and the second as ADP.\n\nOur API appears to work! We now have\
  \ an allowance of a certain number of free requests that we can use for development\
  \ or even in production on a very small user base. As the number of requests grow,\
  \ we'll need to update to a paid plan – but our code won't need to change one bit!\n\
  \nOur API is now live and available for public use as part of the Accelerated Inference\
  \ API. But uploading a public Flair model to Hugging Face doesn't only achieve that.\
  \ There is another great benefit from uploading the model to the Hugging Face Models\
  \ Hub – the ability to use the model in Flair from anywhere.\n\n## 在 Flair 中使用公共的\
  \ Hugging Face Models Hub 模型\n\nWhen we successfully upload a Flair model – for\
  \ example, a sequence tagger – to the Hugging Face Models Hub, the model not only\
  \ becomes available as part of the Accelerated Inference API, it also becomes available\
  \ for public use from within Flair. Anyone can now use our model in Flair by simply\
  \ referring to it using the right key.\n\nThe key used for loading Hugging Face\
  \ Models Hub models in Flair uses the <username>/<reponame> format, where username\
  \ is our Hugging Face username and reponame is the name of our model repository.\
  \ In our case, this results in flairbook/flairmodel.\n\nIt means that anyone can\
  \ use our sequence tagger in Flair by loading it the same way any other pre-trained\
  \ model is loaded:\n\n```\nfrom flair.data import Sentence\nfrom flair.models import\
  \ SequenceTagger\n\ntagger = SequenceTagger.load('flairbook/flairmodel')\n\nsentence\
  \ = Sentence('abc')\ntagger.predict(sentence)\n\nprint(sentence.to_tagged_string())\n\
  ```\n\nMake sure to replace flairbook with your Hugging Face username and flairmodel\
  \ with your model repository name when running the preceding code snippet. It will\
  \ download our public model from Hugging Face and use it to perform sequence tagging\
  \ on the abc input. It will print out something similar to the following:\n\n```\n\
  Sentence: \"abc\" → [\"abc\"/NUM]\n```\n\nThis indicates that our sequence tagger\
  \ works even as a publicly hosted model. Anyone can use it now – either as a fully\
  \ managed NLP service or as a hosted pre-trained model. Do note that because we\
  \ trained a mock model that isn't supposed to generate any meaningful results, the\
  \ generated predictions will be different for each trained model.\n\nIt's now clear\
  \ that hosting and deploying NLP services and models on platforms that are well\
  \ integrated, such as the Hugging Face Models Hub, is truly as easy as advertised.\n\
  \n## 摘要\n\nThroughout this book, we have covered several concepts, features, and\
  \ ways of using Flair to solve NLP problems. We started with the base types and\
  \ used the pre-trained Flair models. We explained the idea of sequence tagging and\
  \ embeddings, including their role in the downstream NLP tasks. We learned how to\
  \ train our own sequence tagging models and even train our own embeddings. We now\
  \ know how to train models using the optimal training parameters by utilizing the\
  \ Flair hyperparameter optimization tools. We also learned about text classifiers,\
  \ including the few-shot and zero-shot Task-Aware Sentences (TARS) classifier, which\
  \ delivers excellent performance, utilizing only a few training examples.\n\nFinally,\
  \ in this chapter, we learned about ways of deploying Flair models to production.\
  \ We now not only know how to use Flair to build NLP models, but also how to make\
  \ them widely available by deploying them to production.\n\nIn the upcoming chapter,\
  \ we plan to combine all the knowledge and skills learned throughout this book and\
  \ solve a real-world NLP problem with Flair through a hands-on exercise.\n\n\n\n"
- "## 10 动手练习 – 使用 Flair 构建交易机器人\n\n在本章中，我们将通过一个动手编程练习，利用 Flair 的多个预训练模型来构建一个实际应用。我们将构建一个简单的交易机器人，它使用\
  \ Flair 的命名实体识别（NER）和情感分析工具来做出交易决策。该交易策略包括将当天的新闻标题作为输入，并使用 NER 来判断新闻文章是否在讨论我们感兴趣的公司。然后我们将运行情感分析，帮助我们决定是否持有、买入或卖出该公司的股票。\n\
  \n在第一部分，我们将通过解释基于新闻情感的交易方法的动机来介绍我们的交易策略的细节。然后，我们将使用 Flair 实现一个交易机器人。我们计划用一份 Flair\
  \ 编程速查表收尾，其中包含 Flair 中最常用的类列表。我们将在以下部分涵盖所有这些内容：\n\n-   了解交易策略\n-   实现 Flair 交易机器人\n\
  -   Flair 编程速查表\n\n但在直接深入交易机器人的细节之前，让我们确保所有技术要求都已得到满足。\n\n## 技术要求\n\n本章使用的所有 Python\
  \ 库都是 Flair 0.11 版本的直接依赖项，前提是 Flair 已安装在您的机器上，无需特殊设置。本章涵盖的代码示例可在本书官方 GitHub 仓库的以下\
  \ Jupyter 笔记本中找到：https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter10.\n\
  \n## 了解交易策略\n\n对于本次动手练习，我们将实现一种有趣的交易策略，该策略利用了 Flair NLP 框架的多个部分。该策略绝不是最佳、最优的交易策略，也不是保证让你致富的策略。然而，它确实清晰地展示了\
  \ Flair 如何轻松解决现实世界问题。\n\n该策略将帮助我们做出股票交易决策。人们可以根据许多信息来源做出交易决策。一种特别有趣的交易策略类型利用 NLP\
  \ 处理最新的新闻内容。这些交易策略的基本假设是，讨论某家公司的新闻文章包含有关可能影响公司股价事件的重要信息。与人类相比，自动化的 NLP 策略在投资方面具有诸多优势。这些优势主要归结于机器能够完成的交易速度和规模。一个好的\
  \ NLP 交易机器人可以在人类所需时间的一小部分内分析数千字的文本并做出交易决策。\n\n然而，典型的 NLP 交易机器人在词义消歧问题上存在困难。人类历史上擅长利用上下文解读模糊的词义。但\
  \ NLP 的最新进展，例如 Flair 在下游 NLP 任务中使用的上下文字符串嵌入，使机器更进一步。例如，考虑以下陈述：*亚马逊森林砍伐由贪婪助长。*\n\n\
  前面的新闻标题对人类来说，显然是在谈论亚马逊雨林以及它如何受到森林砍伐的影响。然而，对一个天真的 NLP 交易机器人来说，这很容易听起来像是一篇讨论亚马逊科技公司的文章。当我们尝试交易以真实实体或物体命名的公司时，例如\
  \ Apple、Tesla、Visa 和 Shell，我们会遇到相同类型的问题。因此，一个好的交易机器人应该能够利用上下文来弄清一个词的真正含义，以确定新闻文章是否在谈论某家特定公司。基于上下文字符串嵌入的\
  \ Flair 上下文感知 NER 标注器将帮助我们做到这一点。\n\n我们的 Flair 股票交易策略遵循以下步骤序列：\n\n-   1. 查找可能包含有助于我们做出交易决策的有用信息的新闻文章。\n\
  -   2. 对新闻文章标题使用 Flair 的 NER 来确定新闻文章是否在谈论我们感兴趣的公司。\n-   3. 执行情感分析以确定新闻文章的情感。\n-\
  \   4. 如果情感分析结果为正面，则买入股票。如果结果为负面，则卖出。\n-   5. 返回 *步骤 1*。\n\n该策略最好用流程图来说明：\n\n![](img/c56c48b8fd18a11ab705352d618ed976_179_0.png)\n\
  \n图 10.1 – Flair 交易机器人策略流程图\n\n前面的流程图显示了我们的交易策略在原则上是多么简单。而且由于我们计划使用 Flair 来实现它，它肯定会如此。\n\
  \n让我们在下一节学习如何实现该策略。\n\n## 实现 Flair 交易机器人\n\n交易策略由三个主要逻辑独立的组件组成：\n\n-   新闻文章获取组件\n\
  -   NER 组件\n-   情感分析组件\n\n第一个组件，即新闻获取，是非常特定于领域的代码。所使用的数据源很大程度上取决于我们感兴趣交易的公司类型。没有通用的新闻来源适用于所有股票。因此，我们计划将新闻获取部分移出我们的策略，并设计成新闻文本仅作为输入提供给我们的机器人。\n\
  \n我们的交易策略组件经常会访问相同的共享变量，例如我们感兴趣的公司名称。因此，使用面向对象的设计并将我们的策略作为 Python 类的一部分来实现是有意义的。我们将我们的交易策略类命名为\
  \ FlairTrader。类的构造函数方法将接收公司名称（我们想要交易的公司名称）并将其存储在内存中，同时存储一个 NER 标注器对象和一个情感分析分类器对象，后者将分别由命名实体识别和情感分析组件后续使用：\n\
  \n```python\nfrom flair.data import Sentence\nfrom flair.models import SequenceTagger\n\
  from flair.models import TextClassifier\n\nclass FlairTrader:\n    def __init__(self,\
  \ company_name):\n        self.company_name = company_name\n        self.tagger\
  \ = SequenceTagger.load('ner')\n        self.classifier = TextClassifier.load('en-sentiment')\n\
  ```\n\n在前面的代码片段中，我们简单地定义了 FlairTrader 类及其构造函数（在类实例化时被调用的一种方法）__init__。然后我们设置了三个类属性——名为\
  \ company_name 的公司名称变量、名为 tagger 的 Flair 默认英语 NER 标注器对象，以及名为 classifier 的 Flair\
  \ 英语情感分析分类器对象。\n\nFlair 目前仅支持英语情感分析模型。对于英语以外的语言，您需要使用 Hugging Face 等提供更广泛语言支持的其他\
  \ NLP 库。然而，Flair 确实支持多种语言的各种 NER 标注器。例如，您可以在前面的代码片段中将 ner 替换为 fr-ner 以使用法语 NER 标注。\n\
  \n现在是实现命名实体识别组件的时候了。它的唯一目的是，给定一些输入文本，确定该文本是否与我们想要投资的公司相关。它将通过查找名为 ORG 的命名实体标签来实现这一目标，该标签表示我们公司名称所使用的上下文指的是一个组织——即我们实际的公司。在相反的场景中，例如，当\
  \ Amazon 指的是亚马逊雨林而不是公司时，标签将为 LOC——表示位置：\n\n```python\ndef _references_company(self,\
  \ text):\n    sentence = Sentence(text)\n    self.tagger.predict(sentence)\n\n \
  \   for entity in sentence.get_spans('ner'):\n        if (entity.get_label('ner').value\
  \ == \"ORG\" and\n            entity.text == self.company_name):\n            return\
  \ True\n\n    return False\n```\n\n前面的代码片段以新闻文章标题或文本作为输入，并使用 Flair 的默认英语 NER 标注器对其进行标注。然后它查找与我们的\
  \ company_name 匹配的词元，并检查是否有任何词元被标记为 ORG。如果是，该方法返回 True，表示文本确实引用了我们的公司。如果不是，该方法返回\
  \ False。\n\n请注意，方法名称前面加上了 __。这在 Python 中通常用于私有类方法，这些方法仅由同一类的其他方法使用，而不打算从类外部直接调用。\n\
  \n> **重要说明**\n> 前面的代码片段是一个类方法，这意味着代码不应作为独立代码片段——它属于 FlairTrader 类定义内部。这也是整个代码块缩进四个字符的原因。\n\
  \n\n\n我们现在可以测试命名实体识别组件的性能如何：\n\n-   我们首先需要实例化 FlairTrader 对象。我们将使用 amazon 作为我们想要投资的公司名称进行测试。这仅仅是因为\
  \ Amazon 可能与亚马逊雨林或亚马逊河等地理位置混淆。我们可以通过运行以下代码来定义 FlairTrader 对象：\n\n```python\nft =\
  \ FlairTrader(\"amazon\")\n```\n\n-   这现在允许我们通过运行以下内容来测试 NER 组件：\n\n```python\n\
  print(ft._references_company(\"amazon river is deadly\"))\n```\n\n前面的代码块打印出 False。理所当然，它表明在给定上下文中，单词\
  \ amazon 与亚马逊公司无关。让我们再试一个例子：\n\n```python\nprint(ft._references_company(\"amazon\
  \ is underpaying staff\"))\n```\n\n前面的代码块打印出 True。Flair 正确地判断出前一句确实与亚马逊公司相关。再试一个：\n\
  \n```python\nprint(ft._references_company(\"amazon deforestation is bad\"))\n```\n\
  \n这个前面的代码块不出所料打印出 False。\n\n在前面的代码中，我们可以清楚地看到，我们的命名实体识别组件在区分引用亚马逊河或亚马逊雨林的文本与讨论亚马逊科技公司的文本方面表现出色。\n\
  \n-   我们现在可以实现情感分析组件，其职责正如名称所示，进行情感分析并判断我们是否应该买入、卖出或持有。该方法将被优化，以便只有当我们认为输入文本与我们想要交易的公司相关时才会执行情感分析。如果不相关，它将返回\
  \ hold（意味着我们既不买也不卖股票）：\n\n```python\ndef buy_or_sell(self, text):\n    if self._references_company(text):\n\
  \        sentence = Sentence(text)\n        self.classifier.predict(sentence)\n\
  ```\n\n```python\nif sentence.labels[0].value == \"POSITIVE\":\n    return \"buy\"\
  \nelif sentence.labels[0].value == \"NEGATIVE\":\n    return \"sell\"\nelse:\n \
  \   return \"hold\"\n```\n\n该组件是一个名为 buy_or_sell(self, text) 的类方法。它接收文本作为输入，如果文本与我们的公司相关，则执行情感分析。如果情感分析分类器认为文本为正面，我们就买入。如果文本为负面，我们就卖出。如果文本与我们的公司不相关，我们就持有。这里需要注意的是，我们完全忽略了分类器的概率。有时分类器对其结果有\
  \ 100% 的把握，有时它只是在做 51% 的猜测。好的策略会利用这些信息并使用一定的概率阈值。\n\n> **Important Note**\n> Make\
  \ sure to add the preceding method to the FlairTrader class definition and not define\
  \ it as a standalone piece of code.\n\n我们的交易策略类现在已完成！\n\n我们现在可以通过使用另一个公司名称，例如 Apple\
  \ 来尝试它：\n\n```python\nft = FlairTrader(\"apple\")\n```\n\n让我们看看我们的交易策略表现如何：\n\n\
  ```python\nprint(ft.buy_or_sell(\"this year's apple harvest\"))\n```\n\n前面的代码块打印出\
  \ hold，这是有道理的。文本谈论的是苹果作为水果，而不是 Apple 公司，这意味着我们没有获得关于做出什么交易决策的信息。\n\n现在，让我们试一个正面情感的例子：\n\
  \n```python\nprint(ft.buy_or_sell(\"apple stock is doing great\"))\n```\n\n前面的代码块不出所料打印出\
  \ buy。\n\n我们现在可以尝试一个稍微不那么直接的正面例子：\n\n```python\nprint(ft.buy_or_sell(\"apple shows\
  \ steady growth\"))\n```\n\n该代码块也打印出 buy。它表明 Flair 能够捕捉到文本中更微妙的正面信号。\n\n下面这个代码块，值得庆幸的是，打印出\
  \ sell：\n\n```python\nprint(ft.buy_or_sell(\"apple is being sued by the EU\"))\n\
  ```\n\n前面的例子展示了我们的交易策略在买入、卖出或持有股票的决策方面有多好。它在输入文本上表现尤其出色，例如新闻文章标题，其中英语单词通常大写，无法从大写推断含义。\n\
  \n在合适的每日新闻文章源下，FlairTrader 类为我们提供了一个出色的交易机器人基础，可在现实世界中使用。但在把全部积蓄投入这个交易机器人之前，你应该意识到现实世界的股票交易通常比看起来更复杂。好的交易机器人通常依赖于多种不同的指标，很少依赖单一的事实来源，例如新闻文章情感。一种方便的测试交易策略而无需投入真钱的方法是使用回测，其中策略在数月或数年的历史交易数据上进行测试，这让我们在投入真实资金之前对交易策略在现实世界中的预期有一个大致的了解。如果你想深入研究使用\
  \ Python 等语言进行交易的领域，你应该尝试 Packt 出版的优秀技术书籍《Python for Finance》。\n\n但无论你的机器人在现实世界中是盈利还是亏损，实现过程清楚地展示了使用\
  \ Flair 如何让我们仅用几行简单的代码就能构建智能且功能强大的应用程序。\n\n## Flair 编程速查表\n\n在结束之前，我们应该快速回顾一下本书中使用的最重要的\
  \ Flair 类：\n\n| Class | Description |\n|---|---|\n| Sentence | 用于存储文本的类，可以是单个单词、句子或整个段落。也包含与该对象所属\
  \ token 关联的潜在标签。 |\n| Token | 表示 token 及其对应标签和嵌入的类。 |\n| SpaceTokenizer | 仅基于空格字符的\
  \ tokenizer。 |\n| WordEmbeddings | 静态词级嵌入。 |\n| FlairEmbeddings | 最先进的 Flair 嵌入。\
  \ |\n| StackedEmbeddings | 用于生成一个或多个嵌入的堆叠的类。 |\n| TransformerDocumentEmbeddings\
  \ | 基于 Transformer 的文档嵌入。 |\n| SequenceTagger | 用于加载序列标注器并执行序列标注的类。 |\n| Corpus\
  \ | 用于存储数据集并执行简单操作的类。 |\n| ModelTrainer | 负责在 Flair 中训练模型的类。 |\n| SequenceTaggerParamSelector\
  \ | 超参数选择类。 |\n| LanguageModel | 用于定义和存储语言模型的类。 |\n| LanguageModelTrainer | 负责训练语言模型的类，语言模型最常用于生成嵌入。\
  \ |\n| TextClassifier | 用于加载和使用文本分类模型的工具集。 |\n| TARSClassifier | 用于零样本和少样本文本分类的类。\
  \ |\n\n这个常用的 Flair 类和命令的简短概述希望能作为本书中使用的最重要的 Flair 命令的易于记忆的列表。\n\n## 总结\n\n这个简单有趣的动手练习结束了我们对最先进的\
  \ NLP 库 Flair 的探索之旅。本书开始时，我们从一些动机开始，随后介绍了 Flair 基础类型，这些类型奠定了 Flair 中不同对象通常如何相互交互的基础。然后我们介绍了词嵌入和文档嵌入，它们是\
  \ Flair 的重要组成部分，也是其标注器在序列标注任务上实现最先进性能的主要原因之一。这使我们能够进入序列标注本身，在那里我们了解了 Flair 中所有不同类型的序列标注器。然而，我们并不局限于仅重用预训练模型；我们在下一章中很快学会了如何训练自己的序列标注器。这让我们被漫长的训练超参数列表所淹没，我们必须找到一种利用机器学习帮助我们找到最佳参数集的方法。我们通过掌握超参数调优并学习如何在\
  \ Flair 中进行它来实现这一点。\n\n\n\n不久之后，我们深入到了本书最复杂的话题，即训练我们自己的嵌入向量。其后是 Flair 中稍显轻松的文本分类主题，该主题也是探索\
  \ Flair 功能和能力的最后一章。然后我们将重点转向 Flair 在现实世界中的适用性，通过学习如何在生产环境中部署 NLP 模型，最后通过实现一个简单的\
  \ Flair 交易机器人结束了本书。\n\n尽管本书在相当高的层面上涵盖了大多数 Flair 功能，但您应注意，Flair 是一个不断发展的开源项目，拥有超过\
  \ 170 名贡献者。它不断发展和改进，每月都会添加新功能。因此，这些最后的结语不应标志着您 Flair 之旅的结束。而应标志着一个新的开始。一个您对自己的 NLP\
  \ 能力充满信心，并准备好通过 Flair 让它们变为现实的旅程的开始。\n"
