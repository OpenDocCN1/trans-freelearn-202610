  ## 1'
- "Flair 简介\n\nThere are few **Natural Language Processing** (**NLP**) frameworks\
  \ out there as easy to learn and as easy to work with as **Flair**。Packed with pre-trained\
  \ models, excellent documentation, and readable syntax, it provides a gentle learning\
  \ curve for NLP researchers who are not necessarily skilled in coding; software\
  \ engineers with poor theoretical foundations; students and graduates; as well as\
  \ individuals with no prior knowledge simply interested in the topic. But before\
  \ diving straight into coding, some background about the motivation behind Flair,\
  \ the basic NLP concepts, and the different approaches to how you can set up your\
  \ local environment may help you on your journey toward becoming a Flair NLP expert.\n\
  \n在 Flair 的官方 GitHub README 中，该框架被描述为：\n\n> \"用于最先进自然语言处理的非常简单的框架\"\n\n此描述会引起一些注意。NLP\
  \ 研究人员会立即有兴趣了解该框架在哪些具体任务中实现了最先进的结果。工程师会被 *非常简单* 的标签所吸引，但会想知道需要哪些步骤才能开始使用以及可以在哪些环境中使用。那些不了解\
  \ NLP 的人会想知道他们是否能够掌握理解 Flair 试图解决的问题所需的知识。\n\n在本章中，我们将通过以下部分来回答所有这些问题，涵盖基本 NLP 概念和术语，提供\
  \ Flair 的概览，并设置我们的开发环境：\n\n- NLP 简介\n- 什么是 Flair？\n- 准备工作\n\n## 技术要求\n\n开始之前，您需要一个配备\
  \ Python 3.6+ 的开发环境。有关安装 Python 的特定于平台的说明可在 https://docs.python-guide.org/starting/installation/\
  \ 找到。\n\n您不需要配备 GPU 的开发机器，但拥有一个将显著加快本书后面描述的一些训练相关练习的速度。\n\n您需要访问命令行。在 Linux 和 macOS\
  \ 上，只需启动终端应用程序。在 Windows 上，按 Windows + R 打开运行框，输入 cmd 然后单击确定。\n\nFlair 的官方 GitHub\
  \ 仓库可通过以下链接访问：https://github.com/flairNLP/flair。本章中我们将安装 Flair 0.11 版本。\n\n本章涵盖的代码示例可在本书的官方\
  \ GitHub 仓库中的以下 Jupyter 笔记本中找到：https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter01。\n\
  \n## NLP 简介\n\n在深入了解 Flair 的功能及其如何利用其功能之前，我们将进行 NLP 的简要介绍，为不熟悉 Flair 解决的所有 NLP 技术和任务的读者提供一些背景信息。NLP\
  \ 是人工智能、语言学和软件工程的一个分支，有助于机器理解人类语言。当我们人类阅读一个句子时，我们的大脑会立即理解许多看似微不足道的问题，例如以下内容：\n\n\
  - 该句子是否使用我能理解的语言书写？\n- 如何将句子拆分为单词？\n- 单词之间的关系是什么？\n- 各单词的含义是什么？\n- 这是一个问题还是一个答案？\n\
  - 单词被分配到哪些词性类别？\n- 句子的抽象含义是什么？\n\n人类大脑擅长共同且通常无缝地解决这些问题，使我们意识不到仅仅通过阅读句子就理解了所有这些内容。\n\
  \n即使现在，机器在同时解决所有这些问题方面仍然不如人类。因此，为了教会机器理解人类语言，我们必须将自然语言的理解拆分为一组更小、机器可理解的任务，以便逐一回答这些问题。\n\
  \n在本节中，您将找到一些重要 NLP 任务的列表，重点介绍 Flair 支持的任务。\n\n## 分词\n\n**分词**是将句子或文档分解为称为 **词元**\
  \ 的有意义单元的过程。词元可以是段落、句子、搭配或仅仅是一个单词。\n\n例如，词分词器会将句子 *Learning to use Flair* 拆分为词元列表\
  \ `[\"Learning\", \"to\", \"use\", \"Flair\"]`。\n\n分词必须遵守特定语言的规则，并且很少是微不足道的任务。例如，对于无空格语言，词边界不以空格定义，很难确定一个词何时结束下一个词何时开始。明确定义的词元边界是大多数旨在处理单词、搭配或句子的\
  \ NLP 任务的先决条件，包括本章中解释的以下任务。\n\n## 文本向量化\n\n**文本向量化**是将单词、句子或文档从其书面形式转换为机器可理解的数值表示的过程。\n\
  \n文本向量化最简单的形式之一是 **独热编码**。它将单词映射到长度等于词典中单词数量的二进制向量。向量中的所有元素均为 0，除了表示该单词的元素设置为 1——因此得名\
  \ *one-hot*。\n\n例如，取以下词典：\n\n- Cat\n- Dog\n- Goat\n\n单词 **cat** 将是我们词典中的第一个单词，其独热编码为\
  \ `[1, 0, 0]`。单词 **dog** 将是我们词典中的第二个单词，其独热编码为 `[0, 1, 0]`。单词 **goat** 将是我们词典中的第三个也是最后一个单词，其独热编码为\
  \ `[0, 0, 1]`。\n\n然而，这种方法存在高维度的問題，因为向量的长度随词典中单词数量线性增长。它也不捕获单词的任何语义含义。为了应对这一问题，大多数现代最先进的方法使用称为词或文档嵌入的表示。每个嵌入通常是一个由实数组成的固定长度向量。虽然这些数字乍一看对人类来说难以理解，但在某些情况下，一些向量维度可能代表单词的某些抽象属性——例如，词嵌入向量的一个维度可以表示单词的总体（积极或消极）情感。给定两个或多个嵌入，我们可以使用称为\
  \ **余弦相似度** 的距离度量来计算它们之间的相似性或距离。在包括 **Flair** 在内的许多现代 NLP 解决方案中，嵌入被用作更高级别 NLP 任务（如命名实体识别）的底层输入表示。\n\
  \n早期词嵌入方法的主要问题之一是多义词（多义词）仅限于单一且恒定的嵌入表示。**Flair** 中解决此问题的方法之一是使用上下文字符串嵌入，其中单词由其周围文本进行上下文化，这意味着在不同的周围文本下它们将具有不同的表示。\n\
  \n## 命名实体识别\n\n**命名实体识别**（NER）是一种 NLP 任务或技术，用于在文本中识别命名实体并为其标记相应的类别。命名实体类别包括但不限于\
  \ *地点*、*人名*、*品牌*、*时间表达* 和 *货币值*。\n\n\n\n下图说明了使用彩色背景和与单词关联的标签的 NER：\n\n![](img/c56c48b8fd18a11ab705352d618ed976_25_0.png)\n\
  \n图 1.1 – NER 标注的可视化\n\n在前面的示例中，我们可以看到识别并标注了三个实体。第一个和第三个标签特别有趣，因为它们都代表同一个词 Berkeley，但第一个明显指的是一个组织，而第三个指的是一个地理位置。人脑在根据上下文区分不同实体类型方面表现出色，并且几乎可以无缝地做到这一点，而机器在几十年里一直为此苦苦挣扎。上下文字符串嵌入的最新进展，Flair\
  \ 的核心部分，在解决这一问题上取得了巨大飞跃。\n\n## 词义消歧\n\n词义消歧（WSD）是一种 NLP 技术，关注于识别具有多种含义的给定词的预期词义。\n\
  \n例如，来看给定的句子：\n\n*George 试图返回柏林归还他的帽子。*\n\nWSD 的目标是识别单词 return 第一次使用时的词义，指归还某物的行为，以及第二次\
  \ return 的词义，指返回同一地点的行为。\n\n## 词性标注\n\n词性标注（POS）是一种与 WSD 和 NER 密切相关的技术，旨在将单词标注为对应特定词性的类别，例如名词、动词、形容词、副词等。\n\
  \n![](img/c56c48b8fd18a11ab705352d618ed976_25_1.png)\n\n图 1.2 – POS 标注的可视化\n\n实际的\
  \ POS 标注器提供的标签信息远不止将单词与名词/动词/形容词类别关联。例如，宾州树库项目语料库，是最广泛使用的 NER 语料库之一，区分了 36 种不同的\
  \ POS 标签类型。\n\n## 切分\n\n另一种与 POS 标注密切相关的 NLP 技术是 **chunking**。与 **parts of speech\
  \ (POS)** 不同，后者识别单个 POS，在切分中我们识别完整的短语，例如名词短语。在 *图 1.2* 中，短语 *A lovely day* 可以被视为一个\
  \ chunk，因为它是一个名词短语，并且在与其他词的关系中，其作用方式与名词相同。\n\n## 词干提取和词形还原\n\n**Stemming** 和 **lemmatization**\
  \ 是 NLP 中使用的两种密切相关的文本规范化技术，用于将词还原为其共同的基础形式。例如，单词 *play* 是单词 *playing*、*played* 和\
  \ *plays* 的基本词。\n\n两种技术中更简单的一种，**stemming**，只是通过截断单词的末尾或开头来实现这一点。这种简单的解决方案通常有效，但并非万无一失。例如，单词\
  \ *ladies* 永远无法仅通过词干提取转变为单词 *lady*。因此我们需要一种理解单词的 POS 类别并考虑其上下文的技术。这种技术称为 *词形还原*。词形还原的过程可以用以下示例来演示。\n\
  \n取以下句子：\n\n```\nthis meeting was exhausting\n```\n\n词形还原将前一句还原为以下内容：\n\n```\nthis\
  \ meeting be exhaust\n```\n\n它将单词 *was* 还原为 *be*，并将单词 *exhausting* 还原为 *exhaust*。另请注意，单词\
  \ *meeting* 用作名词，因此映射到相同的单词 *meeting*，而如果单词 *meeting* 用作动词，则会被还原为 *meet*。\n\n一个流行且易于使用的用于使用\
  \ Python 执行词形还原的库是 **spaCy**。其模型在大型语料库上训练，能够区分不同的 POS，从而取得令人印象深刻的结果。\n\n## 文本分类\n\
  \n文本分类是一种 NLP 技术，用于将文本或文档分配给一个或多个类别或文档类型。文本分类的实际用途包括垃圾邮件过滤、语言识别、情感分析以及根据语法进行编程语言识别。\n\
  \n在介绍了基本 NLP 概念和术语之后，我们现在可以继续了解 Flair 是什么以及它如何以最先进的结果解决 NLP 任务。\n\n## 介绍 Flair\n\
  \nFlair 是一个功能强大的 NLP 框架，以 Python 包的形式发布。它提供了一个简单、友好、易于使用的界面，适合各种背景的人使用，包括编程知识很少的人。它在\
  \ MIT 许可证下发布，这是最宽松的自由软件许可证之一。\n\nFlair 作为 NLP 框架具有多种工具和用途。它可以按以下方式定义：\n\n- *它是一个用于\
  \ NLP 研究的 NLP 框架，用于生成在多种 NLP 任务中实现最先进结果的模型，例如跨多种语言和数据集的 POS 标注、NER 和 chunking。*\
  \ 在 Flair 的 GitHub 仓库中，您可以找到逐步说明，了解如何重现这些结果。\n- *它是一个用于训练、验证和分发 NER、POS 标注、chunking、词义消歧和文本分类模型的工具。*\
  \ 它具有有助于简化训练和验证过程的工具，例如自动语料库下载工具，以及有助于模型调优的工具，例如超参数优化工具。它支持日益增长的语言数量。\n- *它是一个用于下载和使用最先进的预训练模型的工具。*\
  \ 模型可以无缝下载，这意味着它们将在您第一次使用时自动下载并保留供将来使用。\n- *它是所提出的最先进的 Flair 嵌入的平台。* Flair 在许多 NLP\
  \ 任务中取得的最先进结果在很大程度上可归因于其提出的 Flair 上下文字符串嵌入，论文 *用于序列标注的上下文字符串嵌入* 中有更详细的描述。作者将其称为\
  \ Flair 的“秘密酱料”。\n- *它是一个用于处理生物医学数据的 NLP 框架。* Flair 的一个特殊部分专门用于处理生物医学数据，并提供了一套实现最先进结果的预训练模型，以及一些语料库和关于如何训练自定义生物医学标注模型的全面文档。\n\
  - *它是对 NLP 的一个很好的实践介绍。* Flair 的详尽在线文档、简单界面、对大量语言的包容性支持以及能够在非 GPU 设备上执行大量任务的能力，都使其成为希望通过实践动手实验学习\
  \ NLP 的人的绝佳切入点。\n\n## 设置开发环境\n\n现在您已经对框架提供的功能有了基本了解，并且对基本 NLP 概念也有了了解，您现在准备好进入下一步，为\
  \ Flair 设置开发环境。\n\n要能够按照本节中的说明操作，请首先确保您的设备上已安装 Python 3.6+，如 技术要求 部分所述。\n\n## 创建虚拟环境\n\
  \n在 Python 中，通常建议在虚拟环境中安装包，这样您当前正在处理的项目依赖项不会影响您的全局 Python 依赖项或将来可能处理的其他项目。\n\n我们将使用\
  \ venv 工具，它是 Python 标准库的一部分，无需安装。要创建虚拟环境，只需创建一个新目录，进入其中，然后运行以下命令：\n\n```\n$ python3\
  \ -m venv learning-flair\n```\n\n然后，要在 Linux 或 macOS 上激活虚拟环境，请运行以下命令：\n\n```\n$\
  \ source learning-flair/bin/activate\n```\n\n如果您运行的是 Windows，请运行以下命令：\n\n```\n$\
  \ learning-flair\\Scripts\\activate.bat\n```\n\n您的命令行应以 (learning-flair) $ 为前缀，您的虚拟环境现已激活。\n\
  \n## 在虚拟环境中安装已发布的 Flair 版本\n\n您现在应该准备好使用以下单个命令安装 Flair 版本 0.11：\n\n```\n(learning-flair)\
  \ $ pip install flair==0.11\n```\n\n安装现在应该开始，并且根据您的互联网连接速度，大约一分钟内即可完成。\n\n\n\n你可以通过运行以下命令来验证安装情况，该命令将显示包含其版本的包属性列表：\n\
  \n```\n(learning-flair) $ pip show flair\nName: flair\nVersion: 0.11\nSummary: A\
  \ very simple framework for state-of-the-art NLP\nHome-page: https://github.com/flairNLP/flair\n\
  ...\n```\n\n如上所示的命令输出表明该包已成功安装在你的虚拟环境中。\n\n## 直接从 GitHub 仓库安装（可选）\n\n在某些情况下，我们希望在\
  \ Flair 中使用的功能可能已经在 GitHub 上的某个分支中实现，但这些更改可能尚未作为发布在 PyPI 上的 Python 包的一部分发布。我们可以直接从\
  \ Git 仓库分支安装具有这些功能的 Flair。\n\n例如，这里是如何从 master 分支安装 Flair：\n\n```\n(learning-flair)\
  \ $ git clone https://github.com/flairNLP/flair.git\n(learning-flair) $ cd flair\n\
