  md: 'Luckily, the syntax for loading custom-trained Flair embeddings is identical
    to loading any other pre-trained Flair embedding model. We simply need to pass
    the model path to the constructor.


    If the output path passed to the LanguageModelTrainer class was forward_model_directory/,
    we will find our trained model at forward_model_directory/best-lm.pt.


    We can then instantiate a FlairEmbeddings object by running the following:


    ```

    from flair.embeddings import FlairEmbeddings

    fw = FlairEmbeddings(''forward_model_directory/best-lm.pt'')

    ```


    The preceding code snippet loads our custom embedding model into the fw variable.


    Note that in this exercise, we only trained the forward embedding model, which
    takes into account the context before the word. For added performance, you may
    now want to repeat the entire embedding training process with the forward and
    is_forward_lm parameters set to False, which will train the backward model instead.
    You can then stack the embedding models together to form a StackedEmbeddings object,
    a part of the process covered in depth in Chapter 5, Training Sequence Labeling
    Models.


    You can now use this model on any Flair downstream NLP task that uses word embeddings.
    Doing this will also allow you to perform extrinsic evaluations of the embedding
    models by evaluating the performance of taggers that use these custom embeddings.


    But training taggers takes a long time. So, before you do just that, you may simply
    want to do a sanity check to verify our embeddings carry at least some useful
    information.


    # Performing intrinsic evaluation on custom Flair embeddings


    Before we go through the lengthy process of training sequence tagging models to
    verify whether our embeddings make any sense, we can instead perform a very simple
    intrinsic evaluation as a sanity check.


    A simple intrinsic check we can do is to compute embeddings for a few synonyms,
    and then use a similarity metric to determine whether the resulting embeddings
    are similar. Similarly, we can compute embeddings for words that are semantically
    dissimilar and check whether their embeddings are dissimilar as well. To make
    our lives easier, we will use an out-of-vocabulary (OOV) word for the dissimilar
    words. Our test will, therefore, verify whether embeddings of two similar words
    are closer together (in terms of cosine distance) than embeddings of one dictionary
    word and one OOV word.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'For similar words, we will choose the words lukin and oko. While not actual
    synonyms, their meaning in Toki Pona relates to vision and eyes. We will generate
    embeddings for these words and one other OOV word, and then measure the similarity
    between those embeddings. If our embeddings are any good, lukin and oko should
    score high on the similarity metric, whereas the OOV word is not expected to be
    similar to the previous two.


    Let''s compute embeddings for all three words using our custom embedding model:


    ```

    from flair.embeddings import FlairEmbeddings

    from flair.data import Sentence


    synonym_1 = Sentence(''lukin'')

    synonym_2 = Sentence(''oko'')

    rand_word = Sentence(''oovword'')


    fw = FlairEmbeddings(''forward_model_directory/best-lm.pt'')

    fw.embed(synonym_1)

    fw.embed(synonym_2)

    fw.embed(rand_word)


    embedding_syn_1 = synonym_1[0].embedding.tolist()

    embedding_syn_2 = synonym_2[0].embedding.tolist()

    embedding_rnd_wrd = rand_word[0].embedding.tolist()

    ```


    In the first part of the preceding code snippet, we simply initialize the Sentence
    classes for the words lukin, oko, and oovword (the random OOV word).


    We can then use the cosine similarity metric to measure the similarity between
    those three embeddings:


    ```

    from sklearn.metrics.pairwise import cosine_similarity as sim


    s_synonym = sim([embedding_syn_1], [embedding_syn_2])[0][0]

    s_rand_1 = sim([embedding_syn_1], [embedding_rnd_wrd])[0][0]

    s_rand_2 = sim([embedding_syn_2], [embedding_rnd_wrd])[0][0]

    ```


    The preceding snippet computes the similarity between the three word pairs and
    stores the similarity between lukin and oko (the synonyms) into s_synonym. It
    also computes the similarity between lukin and oovword, and oko and oovword.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Let''s see if our assumptions were correct:


    ```

    print(s_synonym , s_rand_1 , s_rand_2)

    ```


    The preceding code snippet, if you trained your embeddings well, will print out
    something similar to the following:


    ```

    0.6111595281781783 0.2691232575537895 0.18826418665007352

    ```


    Hooray!


    Turns out our hypothesis was supported. The similar words scored highly in the
    similarity score (the first number printed), whereas the unrelated words (the
    second and third number printed) scored lower. Note that the only thing we may
    conclude from these results is that there is some level of Toki Pona information
    stored in our embeddings, but we shouldn''t jump to any conclusions on how useful
    these embeddings would be on downstream NLP tasks. To train Flair embeddings properly
    for real-world use, we would need to train them on a much larger dataset, using
    a higher embeddings dimensionality, for more epochs, and using a longer sequence
    length.


    # Summary


    Training custom embeddings is one of the more complicated Flair features. It requires
    all the knowledge and understanding that helps us choose the right parameters,
    and prepare data correctly to make use of the huge compute power required to train
    embeddings on larger languages. It is also one of the key concepts to understand
    and perform correctly because almost everything else that Flair does depends on
    embeddings in one way or another.


    In this chapter, we covered the motivation behind training custom Flair word embeddings
    and did an overview of the embeddings design. We covered the syntax required to
    train these embeddings by training forward word embeddings for the world''s smallest
    language – Toki Pona.


    So far, we have presented embeddings as something that can be used as an input
    to a downstream NLP sequence labeling task. But, embeddings can also be used in
    other NLP applications, such as text classification. Let''s learn about that in
    the next chapter.'
