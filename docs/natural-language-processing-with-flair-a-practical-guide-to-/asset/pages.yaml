    still some practical advice we all can follow to help us determine whether it''s
    worth restarting training with different parameters, different model types, or
    even new data.


    The two basic techniques for measuring success during and after training are as
    follows:


    +   1. Monitoring loss

    +   2. Assessing and comparing performance metrics'
