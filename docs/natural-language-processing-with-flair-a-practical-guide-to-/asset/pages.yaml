    ```


    Hurray! It looks like our NER tagger service works as expected. You can now start
    this service on a web server or make your own development machine''s IP address
    public – and you will make the service available to the world.


    But before you do just that, keep in mind that our proof-of-concept solution has
    a long list of drawbacks and issues that will arise if the service is used for
    commercial purposes. The drawbacks include: no input sanitization, no request
    authorization, no caching, no multithread availability or thread safety in place,
    hard-to-parse output, no logging or monitoring... the list goes on. It clearly
    shows that such code should only be used for prototyping. For production-grade
    code, it almost always makes sense to use out-of-the-box solutions such as TorchServe.


    Better still, you can avoid writing code altogether – by using a managed service.
    Let''s learn how to do that in the upcoming section.


    # Using managed services for deploying and using Flair models


    Unlike self-serving, where most aspects of the ML life cycle need to be taken
    care of manually, the managed and fully managed ML services sell the idea of a
    complete out-of-the box ML as a service solution.


    Most of these services offer guarantees about service availability (what percentage
    of the time the service is guaranteed to be working) and scalability (the ability
    to scale without having to refactor the entire infrastructure every time the user
    base grows). Some services also offer management of the entire ML life cycle called
    Machine Learning Model Operationalization (MLOps) management. But some managed
    services may have trouble providing support for all the features and tasks Flair
    is capable of solving. This applies to almost all popular ML-as-a-service solutions,
    with one exception – the Hugging Face Models Hub.'
