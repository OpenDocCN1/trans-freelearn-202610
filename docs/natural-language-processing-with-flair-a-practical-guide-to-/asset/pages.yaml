- pgno: 135
  md: "The process, given what we covered as part of sequence labeling model training,\
    \ should look very familiar – and indeed it is. Let's start by loading the data\
    \ required to train the classifier.\n\n# Loading a tagged corpus\n\nTraining text\
    \ classification models requires a set of text documents (typically, sentences\
    \ or paragraphs) where each document is associated with one or more classification\
    \ labels. To train our sentiment analysis text classification model, we will be\
    \ using the famous **Internet Movie Database (IMDb)** dataset, which contains\
    \ 50,000 movie reviews from IMDB, where each review is labeled as either positive\
    \ or negative. References to this dataset are already baked into Flair, so loading\
    \ the dataset couldn't be easier:\n\n```\nfrom flair.data import Corpus\nfrom\
    \ flair.datasets import IMDB\nimport _locale\n\n# workaround for a rare Windows-only\
    \ Flair encoding bug\n_locale._getdefaultlocale = lambda *_: ['en_US', 'utf8']\n\
    \ncorpus = IMDB()\ncorpus.downsample(0.05)\nlbl_type = 'sentiment'\nlabel_dict\
    \ = corpus.make_label_dictionary(label_type=lbl_type)\n```\n\nThe preceding code\
    \ snippet loads the IMDB dataset into memory. It also creates the `label_dict`\
    \ object, which is a dictionary containing all possible class labels. This will\
    \ be required later when we build the classifier.\n\n> **Important Note**\n> \n\
    > In this code example, we utilized the `downsample()` method. The method downsamples\
    \ the dataset. It reduces the number of items in our dataset, and by doing that,\
    \ we also reduce the amount of data our model will be able to learn from. As a\
    \ result, the model is likely to perform worse. This method should, unless there\
    \ really is too much data, only be used for learning and demonstration purposes.\
    \ We used a downsample rate of 0.05, meaning we only keep 5% of the original data.\n\
    \nLet's now move on to loading the document embeddings into memory."
  merge: -1
