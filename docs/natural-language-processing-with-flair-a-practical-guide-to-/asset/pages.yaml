    The preceding summary indicates that the best hidden size is the second option
    (because the summary says 1 and we use zero indexing, meaning 1 refers to the
    second option): 256. The best learning rate is the fourth option – 0.2. For embeddings,
    of course, because we only had a single option to choose from, the first and the
    only option was chosen as the best.


    Does this mean that we should always use 256 as the hidden size and 0.2 as the
    optimal learning rate for English? In short, no. Optimal hyperparameter values
    will depend on the data used, the problem attempting to be solved, and the techniques
    used to tackle it. Remember the preceding code snippet where we loaded the corpus
    and reduced it from 100% to 1% of its original size? By doing this, we greatly
    increased the speed of model training, which allowed us to perform hyperparameter
    optimization much quicker, but by doing so, we also focused our model on a very
    small and potentially biased subset of data. To perform proper hyperparameter
    tuning on an English dataset, we''d need to do it at 100% corpus size and consider
    more hyperparameter options. This would vastly increase our search space and execution
    time, but also improve the performance of our model. These findings lead us to
    the following takeaway.


    # Summary


    Hyperparameter tuning is an utterly useful technique for finding optional hyperparameters,
    not just in sequence tagging, but across many areas of machine learning. However,
    it does so at a cost; it is incredibly expensive. In essence, it performs the
    training and evaluation process tens, hundreds, or potentially thousands of times.
    But in the real world, exploring each and every potentially useful hyperparameter
    value can take months to execute, and the search space is usually narrowed down
    to a finite set of potentially useful options. Hyperparameter tuning is, therefore,
    a process that does require a certain level of expert knowledge and experience
    that will help you achieve the correct trade-off between exploration (trying out
    different not-yet-explored options) and exploitation (narrowing down the parameter
    values to the ones that generally seem to work well).


    As part of this chapter, we learned why hyperparameter tuning is useful, when
    to use it, and how. We learned how to use a hyperparameter tuning library in its
    purest form in Python as well as how to use it through Flair to tune sequence-labeling
    models.


    In the next chapter, we will be covering yet another NLP problem where hyperparameter
    tuning proves to be useful – training embeddings.'
