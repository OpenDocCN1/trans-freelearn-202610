- pgno: 67
  md: '# Part-of-speech tagging tag sets


    The PoS tagger in the preceding script uses the **Penn Treebank Project PoS tag
    set**. It is a standardized set of tags consisting of 36 different PoS tags. It
    allows researchers to use a standard that enables them to compare results across
    different taggers. It was originally used to tag the corpora in **The Penn Treebank
    Project**, but is today used across many different datasets.


    The Penn tag set consists of the following 36 tags:


    +   - CC: Coordinating conjunction

    +   - CD: Cardinal number

    +   - DT: Determiner

    +   - EX: Existential there

    +   - FW: Foreign word

    +   - IN: Preposition or subordinating conjunction

    +   - JJ: Adjective

    +   - JJR: Adjective, comparative

    +   - JJS: Adjective, superlative

    +   - LS: List item marker

    +   - MD: Modal

    +   - NN: Noun, singular or mass

    +   - NNS: Noun, plural

    +   - NNP: Proper noun, singular

    +   - NNPS: Proper noun, plural

    +   - PDT: Predeterminer

    +   - POS: Possessive ending

    +   - PRP: Personal pronoun

    +   - PRP$: Possessive pronoun

    +   - RB: Adverb

    +   - RBR: Adverb, comparative

    +   - RBS: Adverb, superlative'
  merge: -1
  img_proc: true
- pgno: 68
