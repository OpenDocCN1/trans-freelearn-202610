  md: '# Available Flair embeddings


    The set of supported Flair embeddings in the framework is ever-changing and a
    complete list would likely already be outdated by the time you read this book.
    But in general, you are likely to find the embedding you are looking for in one
    of the following categories:


    +   - English Flair embeddings trained on a 1 billion-word corpus:

    +     - ID: `news-DIRECTION`

    +   - Flair embeddings trained on Wikipedia, Opus, or other large corpora:

    +     - ID: `LANGUAGE_CODE-DIRECTION`.

    +     For example, for the forward version of German Flair embeddings, use `de-forward`.

    +   - Flair embeddings trained on biomedical PubMed abstracts:

    +     - ID: `pubmed-DIRECTION`

    +   - Multilingual Flair embeddings supporting 300+ languages:

    +     - ID: `multi-DIRECTION`


    Note that the term `DIRECTION` needs to be replaced with either `backward` or
    `forward` when using the embedding ID.


    For a complete and up-to-date list of supported Flair embeddings, you should check
    Flair''s official documentation at https://github.com/flairNLP/flair/blob/master/resources/docs/embeddings/FLAIR_EMBEDDINGS.md.


    In the preceding exercises, we covered the basic use of Flair embeddings. But
    you might have asked yourself: how can I use Flair embeddings in a way that uses
    the complete context appearing both before and after the word? This, and many
    more questions, will be answered in the next section.


    # Stacked embeddings


    **Stacked embeddings** are a type of meta embeddings that allow us to form new
    embeddings by combining two or more embeddings together. These meta embeddings,
    as the name suggests, simply stack multiple embeddings on top of each other. They
    are ideal for combining the forward and backward versions of Flair embeddings.
    They can also be used for adding other embedding types to the mix, for example,
    to mix contextual string embeddings with the classic word embeddings. In fact,
    this is the type of a combination suggested by Flair and often the combination
    yielding state-of-the-art results.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'To use stacked embeddings, simply instantiate a StackedEmbeddings class, passing
    in a list of embedding objects. You may then use this meta embedding in the same
    exact way you would use any other embedding in Flair.


    Let''s try this out on the set of embeddings recommended by Flair for best performance.
    We will stack glove word embeddings combined with news-forward and news-backward
    Flair embeddings:


    ```

    ```python

    from flair.embeddings import FlairEmbeddings, WordEmbeddings

    from flair.embeddings import StackedEmbeddings


    glove = WordEmbeddings(''glove'')

    news_fw = FlairEmbeddings(''news-forward'')

    news_bw = FlairEmbeddings(''news-backward'')


    combined_embeddings_list = [glove, news_fw, news_bw]


    stack = StackedEmbeddings(combined_embeddings_list)

    ```

    ```


    You may then run stack.embed(sentence) on a Sentence object as you would using
    any other embedding types in Flair.


    We have now covered the main word embedding types in Flair. It''s now time to
    move one level up and learn how to compute embeddings not just for words but entire
    documents.


    # Document embeddings


    Document embeddings are similar to word embeddings, with the only difference being
    that instead of getting one embedding for each word, we get one embedding for
    the entire document.


    In Flair, a document can be defined inside the Sentence object. Instead of accessing
    the embedding through sentence[n].embedding, which would return the nth word''s
    embedding, we simply run sentence.embedding or sentence.get_embedding().


    Flair currently supports the following embedding types:


    +   - TransformerDocumentEmbeddings, a document embedding class using a pre-trained
    Hugging Face transformers.

    +   - DocumentPoolEmbeddings, a meta document embedding class that takes a word
    embedding object, computes the embedding for each word, and returns the mean of
    all word embeddings.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   - DocumentRNNEmbeddings, a meta document embedding class that takes a word
    embedding object, trains a recurrent neural network on the entire document, and
    returns the final state as the embedding for that document.

    +   - SentenceTransformerDocumentEmbeddings, a document embedding class using
    the external sentence-transformers library. The library needs to be installed
    separately.


    Flair recommends using the TransformerDocumentEmbeddings class for document classification
    tasks. Let''s try it out:


    ```

    from flair.data import Sentence

    from flair.embeddings import TransformerDocumentEmbeddings


    embedding = TransformerDocumentEmbeddings(''bert-base-uncased'')


    sentence = Sentence(''Example sentence .'')

    embedding.embed(sentence)


    print(sentence.embedding)

    ```


    The preceding code will print out a single embedding representing our sentence.


    Note that in the preceding code example, we passed the bert-base-uncased embedding
    ID to the TransformerDocumentEmbeddings class. This is the name of the transformer
    model we decided to use. You may choose any other compatible model from the Hugging
    Face transformer models library.


    # Other embeddings in Flair


