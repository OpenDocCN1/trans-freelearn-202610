- pgno: 136
  md: "# Loading and preparing the document embeddings\n\nIn the previous section,\
    \ we covered all the different types of document embeddings that we can use in\
    \ Flair. To keep this exercise simple, we will use DocumentPoolEmbeddings. They\
    \ require no training prior to training the classification model itself:\n\n```\n\
    from flair.embeddings import (DocumentPoolEmbeddings,\n                      \
    \        WordEmbeddings)\n\nglove = WordEmbeddings('glove')\ndocument_embeddings\
    \ = DocumentPoolEmbeddings([glove])\n```\n\nIn the preceding code snippet, we\
    \ used GloVe embeddings. We passed them to the DocumentPoolEmbeddings class, which,\
    \ if you remember the previous section well, simply computes an average of all\
    \ the word embeddings in the document.\n\nWith document embeddings out of the\
    \ way, we can now define our text classification model.\n\n# Initializing the\
    \ TextClassifier class\n\nThis is the point where all the variables defined in\
    \ the previous sections come together as part of a newly initialized object –\
    \ TextClassifier:\n\n```\nfrom flair.models import TextClassifier\n\nclassifier\
    \ = TextClassifier(document_embeddings,\n                            label_dictionary=label_dict,\n\
    \                            label_type=lbl_type)\n```\n\nIn the preceding code\
    \ snippet, we define our text classifier object, which initializes as a fully\
    \ functioning classifier with randomized weights. Classifiers such as TextClassifier\
    \ need to know the total number of classes in advance, as it affects the neural\
    \ network architecture – hence the need to provide label_dict. We also need to\
    \ pass in the document embeddings class at the point of defining the model so\
    \ that the model knows the embedding length, which defines the number of input\
    \ nodes. Finally, we also pass in the lbl_type variable, which is used at a later\
    \ point.\n\nOur model is actually a fully functional text classification model\
    \ now. The tiny problem is that its weights are randomly initialized, which means\
    \ that the output it produces will be useless. To make our model useful, we need\
    \ to train it."
  merge: -1
  img_proc: true
- pgno: 137
  md: "# Training the model\n\nTraining the text classifier model involves two simple\
    \ steps:\n\n+   1. Defining the model trainer class by passing in the classifier\
    \ model and the corpus\n+   2. Setting off the training process passing in the\
    \ required training hyperparameters\n\nThe following classification model training\
    \ syntax is very similar to how we trained sequence labeling models in the previous\
    \ chapters:\n\n```\n```python\nfrom flair.trainers import ModelTrainer\n\ntrainer\
    \ = ModelTrainer(classifier, corpus)\n\ntrainer.train('classifier',\n    learning_rate=0.1,\n\
    \    mini_batch_size=32,\n    max_epochs=40)\n```\n```\n\nThe preceding code snippet\
    \ sets off the training process where we pass in a number of training-related\
    \ hyperparameters, all of which were explained in detail in Chapter 5, Training\
    \ Sequence Labeling Models. The training process will now run for 40 epochs or\
    \ until the model stops improving and will store the final model in the classifier\
    \ directory.\n\n> **Important Note**\n> \n> In the preceding exercise, we used\
    \ the `DocumentPoolEmbeddings` document embeddings. However, if you ever plan\
    \ to use `TransformerDocumentEmbeddings` (which is almost guaranteed to offer\
    \ better performance), you should use the `ModelTrainer.fine_tune()` method instead\
    \ of `ModelTrainer.train()`, which presets some of the training hyperparameters\
    \ to aid fine-tuning transformers.\n\nTraining should take about 30 minutes on\
    \ an average CPU. When done, we'll be ready to test the new classifier out.\n\n\
    Upon completion, the model trainer will print out a bunch of metrics. The simplest\
    \ and most telling metric to look out for is the test_score metric. It shows the\
    \ classification accuracy of the test dataset. In our case, test_score was 0.672,\
    \ although be aware that yours will be slightly different due to the randomly\
    \ initialized weights."
