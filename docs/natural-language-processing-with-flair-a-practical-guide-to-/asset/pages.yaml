    # Understanding training output files


    After a successful training session, Flair will have written a number of training
    output files to a directory defined by the `base_dir` parameter. They, aside from
    the actual model, hold important information about training.


    Here is a list of files to expect in `base_dir` after a training run:


    +   - `final-model.pt`: The actual model. This can also be called `best-model.pt`
    when using dev data for hyperparameter tuning.

    +   - `loss.tsv`: A tab-separated document containing information about the training
    loss for each epoch.

    +   - `training.log`: A complete log of standard output written out during training.

    +   - `test.tsv`: A tab-separated document containing tokens, their real tags,
    and their predicted tags. This document allows you to do token-level analysis,
    verifying which tokens were predicted correctly and which weren''t.

    +   - `weights.txt`: Model weights. This file will only be populated only if `write_weights`
    was set to `True` during training.


    With our trained model now stored in the filesystem, we can now test loading the
    model from a file in a fresh Python session.


    # Loading and using custom Flair models


    In the final stages of model training, Flair will write a file called `final-model.pt`
    to a path defined by the `base_dir` argument of our `ModelTrainer`. Loading this
    model into Flair is as easy as passing it as the first argument to the `SequenceTagger.load`
    method.'
