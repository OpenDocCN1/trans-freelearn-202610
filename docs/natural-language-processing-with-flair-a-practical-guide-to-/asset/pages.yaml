    # Understanding sequence tagging in Flair


    Before diving straight into how to use sequence taggers in Flair, let''s first
    briefly explain how sequence tagging (also known as sequence labeling) works.
    From an engineering point of view, a sequence tagger is a tool that receives text
    as input and returns a list of assignments, where each assignment includes a tag
    name and a span indicating where the annotated unit of text (usually a word) begins
    and ends.


    The architecture and design of sequence labeling in Flair can best be explained
    with the following diagram:


    ![](img/c56c48b8fd18a11ab705352d618ed976_62_0.png)


    Figure 4.1 - Overview of sequence tagging in Flair'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'The preceding diagram displays the sequence tagging architecture consisting
    of two components: the language model (in yellow) and the sequence tagging (labeling)
    model (in blue). The bidirectional character language model receives the original
    text as input and computes contextual embeddings (r_George, r_Washington, r_was,
    r_born) for each word. These are then passed into a BiLSTM-CRF sequence labeler.
    This special type of labeler is a novel sequence labeling approach that makes
    use of a bidirectional LSTM (BiLSTM) recurrent neural model combined with a Conditional
    Random Field (CRF) – a type of combinatorial algorithm. It outputs the probability
    distribution of labels corresponding to individual words. The most probable label
    is then chosen for each word (as seen in the preceding figure in the top row).
    For example, the word Washington is labeled as E-PER in the preceding figure,
    where PER suggests the word relates to a person and E marks the ending of a two-word
    named entity chunk. Words are often also tagged with a special label, O (meaning
    other), used for words not considered named entities or named entities belonging
    to none of the defined categories.


    The preceding diagram illustrates the design of sequence taggers with one of the
    most common sequence tagging applications – NER. Let''s learn how to use it in
    Flair in the following section.


    # Named entity recognition in Flair


    NER is a special sequence tagging task that identifies and labels named entities.
    Named entities are real-word objects such as persons, locations, or organizations.
    The set of possible distinct named entities isn''t strictly defined and may vary
    from model to model. Flair ships with a rich set of pretrained NER models, as
    well as tools to train custom models. In this section, we are going to focus on
    covering the pretrained models, as well as how to interpret and understand their
    output.


    To get a good understanding of how NER tagging works in Flair, let''s try it out
    as part of an exercise. We will start with tagging a single word that is clearly
    a named entity.


    ```

    from flair.data import Sentence

    from flair.models import SequenceTagger


    tagger = SequenceTagger.load(''ner'')

    sentence = Sentence(''Berlin'')

    tagger.predict(sentence)


    print(sentence.to_tagged_string())

    ```'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'In the preceding script, we loaded Flair''s default English NER tagger into
    memory by calling SequenceTagger.load(''ner''). We then tagged a sentence with
    a single word – Berlin. Finally, we printed out the tagged sentence. The output
    is as follows:


    ```

    Sentence: "Berlin" → ["Berlin"/LOC]

    ```


    When using the ner tagger for the first time, you will also see a download progress
    bar and a notification that the model is hosted on the HuggingFace ModelHub.


    The preceding NER tagging code snippet printed out: "Berlin"/LOC. This indicates
    that the tagger thinks the word Berlin in its given context, or lack thereof,
    is a location as it was tagged with the label LOC.


    The set of NER classes varies from model to model, even within Flair, but most
    NER taggers classify entities with the following categories:


    +   - Person

    +   - Location

    +   - Organization

    +   - Miscellaneous


    Let''s have a look at another example, one that was used in the paper that introduced
    Flair to the NLP world. It presents a case where Flair''s excellent word sense
    disambiguation performance truly shines:


    ```

    tagger = SequenceTagger.load(''ner'')

    text = ''George Washington was born in Washington.''

    sentence = Sentence(text)

    tagger.predict(sentence)


    print(sentence.to_tagged_string())

    ```


    The preceding script will print:


    ```

    Sentence: "George Washington was born in Washington ." → ["George Washington"/PER,
    "Washington"/LOC]

    ```


    The above output clearly shows how Flair was able to distinguish between Washington
    in the sense of a location (where it was tagged with LOC) and Washington in the
    sense of a person (where it was tagged as PER).'
