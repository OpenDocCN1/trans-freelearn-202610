    # About the author


    Tadej Magajna is a former lead machine learning engineer, former data scientist,
    and now a software engineer at Microsoft. He currently works in a team responsible
    for language model training and building language packs for keyboards such as
    Microsoft SwiftKey. He has a master''s degree in computer science. He started
    his career as a 15-year-old at a local media company as a web developer and progressed
    toward more complex problems. He has tackled problems such as NLP market research,
    public transport bus and train capacity forecasting, and finally, language model
