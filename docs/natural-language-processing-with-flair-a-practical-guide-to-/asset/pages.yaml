- pgno: 184
  md: 'The code block also prints out buy. It indicates that Flair was able to pick
    up more subtle positive signals in the text.


    The following code block, thankfully, prints out sell:


    ```

    print(ft.buy_or_sell("apple is being sued by the EU"))

    ```


    The preceding examples show how good our trading strategy is at making decisions
    about buying, selling, or holding stock. It performs especially well on input
    text, such as news article titles where words in English are typically capitalized
    and there''s no way of inferring meaning from capitalization.


    Given the right set of daily news article feeds, the FlairTrader class gives us
    an excellent base for a trading bot that can be used in the real world. But before
    throwing all your life savings into this trading bot, you should be aware that
    real-world stock trading is usually more complicated than it appears. Good trading
    bots usually rely on a number of different indicators and rarely rely on a single
    source of truth, such as news article sentiment. A handy way to test a trading
    strategy without investing real money is to use backtesting where the strategy
    is tested on months or years of historical trading data, which gives us a rough
    idea of what to expect from our trading strategy in the real world before investing
    real funds. If you want to dig deeper into the field of trading with languages
    such as Python, you should give the brilliant Packt technical book called Python
    for Finance a go.


    But regardless of whether your bot will make a profit or a loss in the real world,
    the implementation clearly shows how using Flair allows us to build smart and
    capable apps with only a few simple lines of code.


    # A Flair coding cheat sheet


    Before wrapping up, we should do a quick recap of the most important Flair classes
    used throughout this book:


    | Sentence | A class responsible for storing text either as a single word, a sentence,
    or a whole paragraph. Also contains potential tags associated with tokens belonging
    to this object. |

    | Token | A class representing tokens and their corresponding tags and embeddings.
    |

    | SpaceTokenizer | A tokenizer based on space character only. |

    | WordEmbeddings | Static word-level embeddings. |'
  merge: -1
  img_proc: true
- pgno: 185
  md: '| FlairEmbeddings | State-of-the-art Flair embeddings. |

    | StackedEmbeddings | A class for generating stacks of one or more embeddings.
    |

    | TransformerDocumentEmbeddings | Transformer-based document embeddings. |

    | SequenceTagger | A class for loading sequence taggers and performing sequence
    labeling. |

    | Corpus | A class for storing and performing simple operations on datasets. |

    | ModelTrainer | A class responsible for training models in Flair. |

    | SequenceTaggerParamSelector | A hyperparameter selection class. |

    | LanguageModel | A class for defining and storing language models. |

    | LanguageModelTrainer | A class responsible for training language models most
    commonly used for generating embeddings. |

    | TextClassifier | A set of tools for loading and using text classification models.
    |

    | TARSClassifier | A class for zero-shot and few-shot text classification. |


    This short overview of frequently used Flair classes and commands should hopefully
    serve as an easy-to-remember list of the most important Flair commands used throughout
    this book.


    # Summary


    This simple and fun hands-on exercise concludes our journey through the state-of-the-art
    NLP library Flair. At the beginning of the book, we kicked off with some motivation,
    followed by the Flair base types that set the foundation of how different objects
    typically interact with one another in Flair. We then covered word and document
    embeddings, which are an essential part of Flair and one of the main reasons why
    its taggers achieve state-of-the-art performance on sequence labeling tasks. This
    allowed us to progress towards sequence tagging itself, where we learned about
    all the different types of sequence taggers available in Flair. However, we weren''t
    constrained to reusing the pre-trained models only; we quickly learned how to
    train our own sequence taggers as part of the next chapter. This left us overwhelmed
    by the long list of training hyperparameters, and we had to find a way of using
    machine learning to help us find the best set of parameters. We did so by mastering
    hyperparameter tuning and learning how to do it in Flair.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Shortly after, we dove into the most complex topic of this book where we trained
    our very own embeddings. This was followed by a slightly more relaxed topic of
    text classification in Flair, which was also the last chapter that explored Flair''s
    features and capabilities. We then switched our focus on the applicability of
    Flair in the real world by learning how to deploy NLP models in production and
    finally wrapped up the book by implementing a simple Flair trading bot.


    Though this book covers most Flair features at a fairly high level, you should
    note that Flair is a constantly evolving open source project with over 170 contributors.
    It constantly evolves and improves, and new features are added on a monthly basis.
    These final closing words should, therefore, not mark the end of your Flair journey.
    Instead, they should mark a new beginning. A beginning of a journey where you
    feel confident in your NLP abilities and are ready to see them come to life through
    Flair.'
