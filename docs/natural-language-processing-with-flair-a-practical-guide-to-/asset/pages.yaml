- pgno: 65
  md: '# Types of NER taggers in Flair


    Flair''s pretrained NER models are classified as either monolingual or multilingual
    NER models.


    **Monolingual NER models** are trained on a single language. They are tuned to
    achieve optimal performance for that single language while providing no support
    for any other language.


    The most notable pretrained monolingual NER taggers are the following:


    +   - English (4-class) NER tagger trained on the Conll-03 dataset.

    +     ID: ner.

    +   - English (4-class) NER tagger trained on the Conll-03 dataset with reduced
    size, improved speed, but reduced accuracy.

    +     ID: ner-fast.

    +   - English (4-class) NER tagger trained on the Conll-03 dataset with improved
    accuracy, but reduced speed and a size increase.

    +     ID: ner-large.

    +   - English (18-class) NER tagger trained on the Ontonotes dataset.

    +     ID: ner-ontonotes.

    +   - German (4-class) NER tagger trained on the Conll-03 dataset.

    +     ID: de-ner.

    +   - French (4-class) NER tagger trained on the WikiNER dataset.

    +     ID: fr-ner.

    +   - Spanish (4-class) NER tagger trained on the Conll-03 dataset.

    +     ID: es-ner-large.


    Unlike the preceding monolingual models, Flair also supports multilingual NER
    models. They do achieve a noticeably lower accuracy score for each specific language
    but come with an added benefit of allowing us to use one single model for a number
    of languages. Flair''s multilingual NER models are trained over English, German,
    Dutch, and Spanish. The models can be loaded using the ner-multi and ner-multi-fast
    IDs.


    You should now have a good understanding of how to use and interpret the results
    of NER taggers in Flair. We can now move on to taggers that, instead of tagging
    named entities, tag parts of speech.'
