    train_dataset = corpus.train

    ```


    Then, the nth sentence of the dataset can be obtained by using the indexer operator.
    For example, the 101st sentence can be obtained by using the following code:


    ```

    sentence = train_dataset [100]

    ```


    ```

    print(sentence)

    ```


    The preceding script will print out the 101st sentence in the train dataset.


    The object also ships with several helper methods. One of the most widely used
    is the downsample(percentage) method, which reduces the size of the corpus, where
    percentage is a value between 0 and 1 that determines the size of the new corpus.


    > Note

    > The downsample(percentage) method modifies and returns the original Corpus object.
    This means that calling it several times downsamples the corpus multiple times.


    For example, if we wanted to downsample our corpora to 1%, we would use the following
    code:


    ```

    corpus.downsample(0.01)

