    +   - SYM: Symbol

    +   - TO: To

    +   - UH: Interjection

    +   - VB: Verb, base form

    +   - VBD: Verb, past tense

    +   - VBG: Verb, gerund or present participle

    +   - VBN: Verb, past participle

    +   - VBP: Verb, non-third-person singular present

    +   - VBZ: Verb, third-person singular present

    +   - WDT: Interrogative word determiner

    +   - WP: Interrogative word pronoun

    +   - WP$: Possessive interrogative word pronoun

    +   - WRB: Interrogative word adverb


    Most English PoS taggers are likely to use this or a slightly modified version
    of this tag set. However, unlike NER tagging where the same NER classes are often
    used across several languages, the Penn set tags are very English-specific and
    cannot be effectively directly used on many non-English languages. A solution
    to this problem is the Universal PoS tag set. It defines a reduced universal tag
    set that can be used across multiple languages.


    The Universal PoS tag set defines the following PoS tags:


    +   - VERB: Verbs (all tenses and modes)

    +   - NOUN: Nouns (common and proper)

    +   - PRON: Pronouns

    +   - ADJ: Adjectives

    +   - ADV: Adverbs

    +   - ADP: Adpositions (prepositions and postpositions)

    +   - CONJ: Conjunctions

    +   - DET: Determiners

    +   - NUM: Cardinal numbers'
