    # Technical requirements


    All of the Python libraries used in this chapter are direct dependencies of Flair
    0.11 and require no special setup, assuming Flair is already installed on your
    machine. Code examples covered in this chapter are found in this book''s official
    GitHub repository in the following Jupyter notebook: https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter05.


    Running the code covered in this chapter on a GPU-enabled machine is not mandatory,
    though it is advised, as it will speed up the training process and allow you to
    train higher-quality models.


    # The motivation behind training custom models


    In this book we so far discussed the features and models that are available in
    Flair straight out of the box. However, if you work with NLP long enough, you
    will likely encounter a sequence labeling problem that is complex or specific
    enough that there will be no pre-trained models available out there. This can
    happen in either of the following situations:


    +   - *The problem you are solving is domain-specific*: Sequence taggers such
    as **Named Entity Recognition (NER)** or **Part-of-Speech (PoS)** taggers are
    usually trained on large, generic corpora that are supposed to represent the general
    use of a language. But if our problem is domain-specific, it''s likely that we
    will require a custom tagger with domain-specific labels trained on domain-specific
    corpora.

    +   - *A pre-trained model exists but doesn''t perform well enough*: Every model
    made available in Flair and the approaches used for training are usually reviewed
    by other contributors, but it''s entirely possible you may be able to build a
    better model yourself. Chances for this increase as you move toward the less popular
    languages, since their performance will not be as optimized. It may also happen
    that the pre-trained model achieves better overall performance in terms of the
    F1-score or accuracy but may fall short in tagging that one specific label that
    you really care about.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '+   - *The language you''re working on is less widely spoken and isn''t supported
    by the framework:* When it comes to advances in NLP, the new, state-of-the-art
    solutions are often built for English or popular western languages. It is only
    when a technique gains popularity and traction that the models start being built
    for the underrepresented languages as well. If you are working with a rare language,
