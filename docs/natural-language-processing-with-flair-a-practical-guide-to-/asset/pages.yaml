  md: "```\nif sentence.labels[0].value == \"POSITIVE\":\n    return \"buy\"\nelif\
    \ sentence.labels[0].value == \"NEGATIVE\":\n    return \"sell\"\nelse:\n    return\
    \ \"hold\"\n```\n\nThis component is a class method called buy_or_sell(self, text).\
    \ It receives text as input and, if the text is relevant to our company, performs\
    \ sentiment analysis. If the text is deemed positive by the sentiment analysis\
    \ classifier, we buy. If the text is negative, we sell. If the text isn't relevant\
    \ to our company, we hold. It's important to note here that we completely disregard\
    \ the classifier probability. Sometimes, the classifier will be 100% sure of its\
    \ results, and sometimes, it'll be making a 51% guess. A good strategy will leverage\
    \ this information and make use of certain probability thresholds.\n\n> **Important\
    \ Note**\n> Make sure to add the preceding method to the FlairTrader class definition\
    \ and not define it as a standalone piece of code.\n\nOur trading strategy class\
    \ is now complete!\n\nWe can now try it out by using another company name, such\
    \ as Apple:\n\n```\nft = FlairTrader(\"apple\")\n```\n\nLet's see how our trading\
    \ strategy performs:\n\n```\nprint(ft.buy_or_sell(\"this year's apple harvest\"\
    ))\n```\n\nThe preceding code block prints out hold, which makes sense. The text\
    \ is talking about apple as fruit and not Apple the company, meaning we gained\
    \ no information about what trading decision to make.\n\nNow, let's try an example\
    \ with a positive sentiment:\n\n```\nprint(ft.buy_or_sell(\"apple stock is doing\
    \ great\"))\n```\n\nThe preceding code block, as expected, prints out buy.\n\n\
    We can now try a slightly less straightforward positive example:\n\n```\nprint(ft.buy_or_sell(\"\
    apple shows steady growth\"))\n```"
