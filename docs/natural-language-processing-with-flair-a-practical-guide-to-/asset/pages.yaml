- pgno: 13
  md: '# Preface


    Natural Language Processing (NLP) is currently one of the fastest-growing subfields
    of AI where new advances or changes to NLP frameworks happen daily. Anyone new
    to the field will find it difficult to know where to start, which ideas are outdated,
    which ones are still relevant, and which are soon to become state of the art.
    Similarly, people with a solid theoretical NLP background aiming to gain practical
    experience in NLP will find it difficult to choose the right NLP library or framework
    given the oversupply of different options currently available in the open source
    community. As someone who has used Flair both professionally as well as for personal
    projects, I would find it hard to recommend any other framework that is as intuitive,
    as relevant, and as packed with ready-to-use, state-of-the-art models as Flair.


    The most interesting thing about Flair may not be its simplicity, performance,
    or ease of use. Instead, it has to do with how Flair was originally designed.
    The first release was never intended to serve as a full-fledged NLP framework.
    The first release of Flair (v0.1), at heart, was merely a tool that served as
    a real-world implementation of Flair embeddings – the underlying concept that
    gives Flair sequence labeling models their amazing performance. It wasn’t until
    later Flair versions that the library introduced Transformer models, text classification
    models, and other tools that you would normally expect from an established NLP
    framework.


    Anyone aiming to build real-world NLP solutions will need to juggle between spending
    time learning more about NLP theory and investing effort in choosing the right
    engineering approach. This book will help you find the right balance between both.
    It will arm you with just the right amount of theoretical foundation to help understand
    the underlying NLP concepts as well as help you gain enough engineering knowledge
    and experience so that you can use Flair proficiently.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Who this book is for


    This book is for anyone eager to learn about NLP through one of the most beginner-friendly,
    yet powerful, Python NLP libraries out there. The audience includes software engineering
    students, developers, data scientists, and anyone who is transitioning into NLP
    and is interested in learning about practical approaches to solving problems with
    Flair. This book, however, is not recommended for readers aiming to get an in-depth
    theoretical understanding of the mathematics behind NLP. Beginner-level knowledge
    of Python is recommended to get the most out of this book.


    The book is also an opportunity for anyone hoping to start contributing to the
    open source community. You could fix bugs, create new tutorials, expand documentation,
    add support for new languages by building pre-trained models, or simply open new
    GitHub issues with suggestions about improving Flair. The knowledge gained by
    reading and doing the exercises in this book will help you considerably on your
    way to becoming an active Flair contributor.


    # What this book covers


    *Chapter 1, Introduction to Flair,* provides a quick overview of NLP and its basic
    problems and techniques. The chapter then introduces Flair and shows how to set
    up your local environment.


    *Chapter 2, Flair Base Types,* introduces Flair’s basic syntax, its typical classes,
    and methods.


    *Chapter 3, Embeddings in Flair,* explains the concept behind word and document
    embeddings and their role in NLP. It describes all the different types of embeddings
    available in Flair.


    *Chapter 4, Sequence Tagging,* describes sequence tagging and its subtypes, such
    as named entity recognition and part-of-speech tagging. This chapter also demonstrates
    how to use pre-trained sequence taggers in Flair.


    *Chapter 5, Training Sequence Labeling Models,* explains how to train, save, and
    use custom sequence tagging models in Flair.


    *Chapter 6, Hyperparameter Optimization in Flair,* shows the importance of using
    the right hyperparameters for model training. It introduces hyperparameter optimization
    tools in Python and explains how to perform hyperparameter optimization in Flair.


    *Chapter 7, Train Your Own Embeddings,* explains how to train custom embeddings
    in Flair and how to leverage different evaluation techniques for measuring success.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Chapter 8, Text Classification in Flair, introduces the problem of text classification.
    This chapter demonstrates how to use pre-trained models as well as how to train
    custom classifiers. It also introduces a novel approach to text classification
