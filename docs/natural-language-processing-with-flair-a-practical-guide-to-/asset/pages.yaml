  md: '# 8

    Text Classification

    in Flair


    After covering complex topics such as hyperparameter tuning, embedding and sequence
    labeling model training, we''re now ready to move to a slightly more straightforward
    and easy to grasp part of **Natural Language Processing (NLP)**. In this chapter,
    we''ll be covering **text** (also known as **document**) **classification**. While
    Flair''s strength traditionally lies in **sequence tagging**, the library offers
    solutions that leverage both Flair embeddings as well as other third-party solutions
    that allow it to yield decent results with text classification. Some of its strengths
    lie in its simplicity in training while others lie in the zero and few-shot classifiers
    – classifiers that require little to no training data.


    We''ll be starting off with some background on what text classification is, what
    it can be used for, how it is trained, and how success is evaluated. We''ll later
    move on to what Flair can offer for text classification and cover the different
    types of text classifiers available. We will train our very own classifier as
    part of a hands-on exercise. Finally, we will explore a novel approach to text
    classification that requires little to no training data.


    We''ll be learning about text classification and how to train and use text classifiers
    in Flair as part of the following:


    +   - Understanding text classification

    +   - Text classification in Flair'
