    ```

    Corpus: 125 train + 20 dev + 21 test sentences

    ```


    This is 1% of the size of the original corpus.


    Flair ships with several techniques and instances of the Corpus object that allow
    us to load data from CSV files and read our own sequence labeling datasets. It
    offers a vast selection of prepared datasets, all of which will be covered in
    more detail later in the book.'
