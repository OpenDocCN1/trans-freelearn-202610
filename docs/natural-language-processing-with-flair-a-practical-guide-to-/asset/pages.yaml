- pgno: 138
  md: '# Loading and using custom text classifiers


    After training the text classification model, the resulting classifier will already
    be stored in memory as part of the classifier variable. It is possible, however,
    that your Python session exited after training. If so, you''ll need to load the
    model into memory with the following:


    ```

    from flair.models import TextClassifier

    classifier = TextClassifier.load(''classifier/best-model.pt'')

    ```


    We can now generate predictions on some made-up text input:


    ```

    from flair.data import Sentence

    sentence = Sentence("great")

    classifier.predict(sentence)

    print(sentence.labels)

    ```


    The preceding code snippet tests our sentiment analysis classifier on the most
    trivial problem we could think of. We are classifying a single word, great, which,
    we can all agree, is unambiguously positive. The code snippet will print out the
    predicted class along with the prediction probability:


    ```

    [''Sentence: "great"/''POSITIVE'' (0.9999)]

    ```


    This indicates that the model is 99.9% positive that the label is... well, POSITIVE.


    But be aware that the model was initialized on random weights and trained on a
    significantly downsampled dataset. The results will, therefore, likely be a little
    different every time you run this code.


    We can give another simple example a go using the exact opposite. We can test
    whether our classifier behaves as expected when given an unambiguously negative
    message:


    ```

    sentence = Sentence("bad")

    classifier.predict(sentence)

    print(sentence.labels)

    ```'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'You don''t have to be an expert in sentiment analysis to determine that the
    word bad should be labeled as NEGATIVE, but neither does our model. It prints
    out the following:


    ```

    [ ''Sentence: "bad" / ''NEGATIVE'' (0.9998) ]

    ```


    This shows that the model is 99.9% certain the word bad is negative, although
    this shouldn''t be particularly shocking.


    We should test our model on a slightly more complex example:


    ```

    sentence = Sentence("Not quite my cup of tea")

    classifier.predict(sentence)

    print(sentence.labels)

    ```


    The preceding code example presents a much more complex sentiment analysis problem,
    as it tries to predict a label for a document that doesn''t necessarily contain
    any words that are positive or negative on their own.


    The prediction we get for the preceding sentence is as follows:


    ```

    [ ''Sentence: "Not quite my cup of tea" / ''POSITIVE'' (0.7513) ]

    ```


    Obviously incorrect. The preceding sentence clearly had a negative connotation.
    It''s likely that when you run the code yourself and your weights are initialized
    differently, the outcome will be different, but it''s certain that the prediction
    confidence (in our case, 75%) will be consistently low.


    There are several steps we can take to improve the prediction quality of our classifier.
    The most obvious choice may be to simply downsample our corpus less and spend
    more time on training. It would be a valid choice, but it would be unlikely to
    help us improve the prediction quality by a huge margin. The biggest bottleneck
    to improving the classification accuracy, in this case, is the choice of document
    embeddings. We used DocumentPoolEmbeddings in our exercise. It is quick and simple
    to use, but it can only do so much. When training text classification models with
    the aim of getting good results, you should use TransformerDocumentEmbeddings
    instead.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'In the preceding text classification exercise, we used a method called `downsampling`
    to reduce the size of our corpus, which significantly sped up the training process,
    but it also significantly affected our prediction quality. To improve the classification
    quality, we can simply downsample our corpus less. Originally, we threw out 95%
    of the dataset. In an effort to get better prediction quality, we could throw
    away only 80%, maybe only 50%, or maybe not throw away any data at all. But at
    this point, we''d hit a brick wall. We wouldn''t be able to improve our classifier
    by training it on more data because there simply wouldn''t be more data. In our
    case, as part of the exercise, we were able to leverage work of hundreds of man-hours
    of people hand-labeling the entire dataset entry one by one. But in the real world,
    the problem you''ll be trying to solve most likely won''t have a labeled dataset
    waiting for you to take advantage of. To make matters worse, labeling data is
    expensive. So much so that sometimes, hand-labeling data isn''t even worth the
    effort, and the resources required to build a model will outweigh the benefits.


    But what if there was a way to train a classifier without having to rely on many
    or possibly any training examples? Actually, there is a way. It''s called **Task-Aware
    Representation of Sentences (TARS)**. Let''s learn how to use it for Flair.


    # Working with text classifiers that require little to no training data


    When mentioning Flair and its strengths in the previous chapters, we mainly focused
    on various powerful ways of solving sequence labeling tasks. When talking about
    text classification, however, Flair was generally presented as a decent text classification
    tool, although nothing special compared to its sequence labeling capabilities.
    This was indeed the case – until now. Flair recently introduced a novel text classification
    method called TARS. The concept is described in depth in the *Task-Aware Representation
    of Sentences for Generic Text Classification* paper available at `https://aclanthology.org/2020.coling-main.285/`,
    which is well worth a read.


    Transformer-based text classifiers in Flair leverage a special linear layer on
    top of the transformer model to produce the class probability distributions. The
    first problem with this approach is that when new class labels are introduced
    to the problem, or when we try to use different class labels (something that happens
    often in real-world machine learning), we basically need to discard this linear
    layer and train from scratch. The second problem with this approach is that the
    model learns about the meaning of the classes purely based on the connection between
    the training examples and the hand-labeled class labels. It doesn''t extract any
    knowledge from the semantic meaning behind the class label word. For example,
    in the exercise from the previous section, we performed sentiment analysis with
    the IMDB dataset using the `NEGATIVE` and `POSITIVE` class labels. With classical
    text classification approaches, the class labels are simply unique identifiers
    of the'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'classes and hold no semantic meaning. If we tweaked the labeled corpus and
    renamed NEGATIVE to CLASS_1 and POSITIVE to CLASS_2, the results would be exactly
    the same. TARS overcomes both of these problems with a novel text classification
    technique that uses the transformer model itself and leverages the class label
    word semantic information from the transformer.


    This allows TARS to perform text classification with the help of only a few training
    examples (few-shot classification) and, sometimes, even no training examples at
    all (zero-shot classification). TARS outperforms previous approaches on small
    training data. Best of all, it''s fully implemented and ready to use Flair.


    Let''s give both few-shot and zero-shot text classification with TARS a try!


    # Zero-shot classification with TARS


    Zero-shot classification with TARS leverages the semantic information of the class
    label words captured inside a pre-trained transformer without the use of any training
    data.


    Using TARS for zero-shot text classification in Flair couldn''t be simpler. You
    need to follow the following three steps:


    +   1. Load the pre-trained TARS model for the right language.

    +   2. Define the classes (which the TARS transformer model hopefully knows about).

    +   3. Use the `predict_zero_shot()` method to generate predictions.


    The preceding steps may sound like a lot of work or at least something that requires
    some level of writing code. Instead, each step is merely a one-liner.


    # Load the pre-trained TARS model for the right language


    Before getting our hopes of not needing any training data up, we need to first
    make sure there is a model available for us to use for the right language. In
    Flair, as of version 0.11, there is only a single model available. It is an English
    model and is called **tars-base**.


    Let''s see how tars-base''s zero-shot text classification handles sentiment analysis.


    We load a TARS model by calling the `TARSClassifier.load()` function:


    ```

    from flair.models import TARSClassifier


    tars = TARSClassifier.load(''tars-base'')

    ```'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'This will download the TARS model and store it in memory, as well as also storing
    it to disk for future use. We can now define the class labels.


    # Defining the classes


    Class labels for TARS models are simply a list of strings. We can therefore define
    our sentiment analysis classes as the following:


    ```

    classes = ["positive", "negative"]

    ```


    And that''s all there really is to it – no training or training examples required!
    Let''s generate some predictions.


    # Generating zero-shot predictions with TARS


    Let''s test our TARS model using the same input we used to test our DocumentPoolEmbeddings
    based classifier that leveraged GloVe embeddings. We''ll see whether tars-base
    can also classify this single-word sentence, great, correctly:


    ```

    from flair.data import Sentence


    sentence = Sentence("great")

    tars.predict_zero_shot(sentence, classes)


    print(sentence)

    ```


    We generate the predictions using the predict_zero_shot() method. The preceding
    code snippet will print out the following:


    ```

    Sentence: "great" → positive (0.9691)

    ```


    This indicates that the predicted label is positive with 96.9% confidence.


    That''s pretty impressive given zero training data! Let''s see whether the same
    successful outcome is achieved using a single-word sentence with a negative connotation:


    ```

    sentence = Sentence("bad")

    tars.predict_zero_shot(sentence, classes)


    print(sentence)

    ```'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'This prints out the following:


    ```

    Sentence: "bad" → negative (0.9037)

    ```


    This clearly indicates that the word bad is associated with a negative sentiment
    – or rather with the semantics of the class label word negative.


    Finally, we can test our zero-shot classifier on the Not quite my cup of tea sentence
    that our previous text classifier wasn''t really sure about:


    ```

    sentence = Sentence("Not quite my cup of tea")

    tars.predict_zero_shot(sentence, classes)

    print(sentence)

    ```


    This prints out the following:


    ```

    Sentence: "Not quite my cup of tea" → negative (0.9859)

    ```


    Hurray! We have a clear winner. tars-base clearly, with 98.6% confidence, predicts
    the sentence Not quite my cup of tea as negative – or rather associates the sentence
    with the semantic meaning of the word negative. Of course, to determine that our
    classifier indeed performs better than our basic DocumentPoolEmbeddings classifier,
    we''d need to perform some means of evaluation. But instead of doing that, let''s
    explore how we can further improve our classification model using few-shot learning.


    # Few-shot classification with TARS


    TARS models allow us to use only a handful of labeled examples to train a text
    classifier callable of delivering excellent performance.


    Let''s explore TARS few-shot learning through solving the same problem that we
    tackled in the previous section – sentiment analysis on the IMDB dataset.


    Training a TARS model is hardly any different from what we did with training DocumentPoolEmbeddings
    classifiers. It involves the following steps:


    +   1. Loading a tagged corpus and computing the label dictionary map

    +   2. Loading a TARS model and setting the task

    +   3. Training the model'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Let''s start with loading the dataset. But bear in mind we''ll need much, much
    less data than one would expect.


    # Loading a tagged corpus


    We''ll be loading the IMDB corpus the same way we did in the previous section.
    But this time, we''ll be downsampling it much more significantly. After all, we
    are doing few-shot learning. And if the claims are true, we should be able to
    get excellent performance using only a few training examples.


    Let''s load the dataset and downsample it to 1% of its original size:


    ```

    from flair.data import Corpus

    from flair.datasets import IMDB

    import _locale


    # workaround for a rare Windows-only Flair encoding bug

    _locale.getdefaultlocale = lambda *_: [''en_US'', ''utf8'']


    corpus = IMDB()

    corpus.downsample(0.01)

    lbl_type = ''sentiment''

    label_dict = corpus.make_label_dictionary(label_type=lbl_type)

    ```


    With the preceding code snippet, we loaded the IMDB dataset that originally contained
    50,000 movie reviews from IMDB. Each review is labeled with either a POSITIVE
    or a NEGATIVE label. We then downsample the corpus to 1% of its original size
    – to only 500 reviews. We then compute the label dictionary, which will come in
    handy soon.


    # Loading a TARS model and setting the task


    We will now load a TARS model the same way we did in the zero-shot learning example.
    But this time, we''ll need to tell the model that it''ll be retrained with the
    aim of predicting two specific labels. We will do this by using the add_and_switch_to_new_task()
    method:


    ```

    from flair.models import TARSClassifier

    from flair.data import Sentence


    tars = TARSClassifier().load(''tars-base'')

    ```'
  merge: -1
  img_proc: true
- pgno: 145
  md: "```\ntars.add_and_switch_to_new_task(\n    task_name=\"sentiment_analysis\"\
    ,\n    label_dictionary=label_dict,\n    label_type=lbl_type)\n```\n\nIn the same\
    \ manner as before, we load the tars-base model. But this time, we pass in some\
    \ extra info, telling the model that it'll be performing a specific task. It'll\
    \ be classifying text into classes defined as part of the label_dict variable.\n\
    \nWe are now ready to train the actual model.\n\n# Training few-shot TARS models\n\
    \nTraining few-shot models in and of itself isn't any more complex than training\
    \ any other model in Flair. The only significant difference is the amount of compute\
    \ power required. In most prior exercises in this book, you could get away with\
    \ doing model training on a CPU where the only sacrifice was slightly lower model\
    \ performance due to fewer epochs or smaller model size. But here, we are dealing\
    \ with a fully sized transformer model, and there isn't much we can do to reduce\
    \ the needed compute power.\n\nYou will need a GPU-equipped machine or a Google\
    \ Colab GPU runtime to successfully run the following code.\n\nThe following training\
    \ syntax should, at this point in the book, look very familiar:\n\n```\nfrom flair.trainers\
    \ import ModelTrainer\n\ntrainer = ModelTrainer(tars, corpus)\ntrainer.train(base_path='few-shot-tars',\n\
    \            learning_rate=0.02,\n            mini_batch_size=16,\n          \
    \  mini_batch_chunk_size=4,\n            max_epochs=6)\n```\n\nIn the preceding\
    \ code snippet, we instructed the model trainer to train our TARS model for six\
    \ epochs (when training production models, this number should be set higher).\
    \ We also set batch size and batch chunk size to a very low value to increase\
    \ the chances of our machine being able to handle it."
  merge: -1
