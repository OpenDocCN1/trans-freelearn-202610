    \ WordEmbeddings\nfrom flair.hyperparameter.param_selection import \\\n    SearchSpace,\
    \ Parameter\nfrom hyperopt import hp\n\nsearch_space = SearchSpace()\nsearch_space.add(Parameter.HIDDEN_SIZE,\n\
    \                 hp.choice,\n                 options=[128, 256])\nsearch_space.add(Parameter.LEARNING_RATE,\n\
    \                 hp.choice,\n                 options=[0.05, 0.1, 0.15, 0.2])\n\
    search_space.add(Parameter.EMBEDDINGS,\n                 hp.choice,\n        \
    \         options=([WordEmbeddings('en')]))\n```\n```\n\nThe preceding code snippet\
    \ defines our search space, consisting of three hyperparameters. We decided to\
    \ come up with some likely useful values for the learning rate and the model's\
    \ hidden size. Although using parameter expressions such hyperopt.hp.quniform\
    \ and hyperopt.hp.uniform would have likely yielded better results, they would\
    \ also have vastly increased the search space size. Our search space is now pretty\
    \ small. There are only eight possible hyperparameter combinations (two times\
    \ four because there are two hidden size parameter options and four learning rate\
    \ options)."
