- pgno: 169
  md: '# The Hugging Face Models Hub


    Hugging Face is an NLP-oriented company with a big open source community. The
    company became largely popular after releasing their transformers library (more
    information can be found at https://huggingface.co/). They also feature the Hugging
    Face Models Hub, which is a collection of NLP models and datasets, most of which
    are public, meaning they are free to download and can be used by anyone. Furthermore,
    models hosted on the Hugging Face Models Hub can make use of the Accelerated Inference
    API. This is a managed NLP service with a freemium pricing plan. This service
    is available for free at the beginning and only starts costing money once more
    users start using it. The models can also be tested in a browser using a browser
    widget, which allows you to input text and observe model behavior from within
    the browser.


    Best of all, the Hugging Face Models Hub features full support for flair models.
    Once you upload a model to the Hugging Face Models Hub, the model will be:


    +   - Available as an NLP service via the Accelerated Inference API

    +   - Available as a pre-trained model in Flair


    Let''s learn how to do both as part of a hands-on exercise that includes the following:


    +   1. Training a mock Flair model

    +   2. Uploading the mock model on the Hugging Face Models Hub

    +   3. Using the model as part of the Accelerated Inference API

    +   4. Using the public model inside Flair


    Let''s dive right in.


    # Training a mock Flair model


    An exercise focusing on deploying and hosting models first needs an actual model.
    Because the goal of this exercise is to learn about deploying Flair models, the
    actual quality of the model doesn''t matter. In fact, it would be great if we
    had an extremely small model because this would decrease the model upload time
    significantly and allow us to go through this exercise faster.


    Therefore, let''s train the smallest possible sequence tagging model we can produce
    in Flair. This model will be terrible at tagging text, but that doesn''t matter
    for this exercise.'
  merge: -1
  img_proc: true
- pgno: 170
  md: "First, let's load a corpus and downsample it significantly to reduce the training\
    \ time:\n\n```\n```python\nfrom flair.datasets import UD_ENGLISH\n\ncorpus = UD_ENGLISH().downsample(0.001)\n\
    \nlbl_type = 'upos'\nlabel_dict = corpus.make_label_dictionary(label_type=lbl_type)\n\
    ```\n```\n\nThen, let's choose our embeddings. We'll choose CharacterEmbeddings.\
    \ It will be terrible at tagging text correctly, but it will produce a tiny model,\
    \ which is all we really care about as part of this exercise:\n\n```\n```python\n\
    from flair.embeddings import CharacterEmbeddings\n\n# lightweight embeddings to\
    \ get a tiny, but useless model\nembedding = CharacterEmbeddings()\n```\n```\n\
    \nWe'll then define and train our sequence tagging model in the fastest way possible\
    \ – for only one epoch – to end up with a tiny sequence tagger with a one-dimensional\
    \ hidden size:\n\n```\n```python\nimport shutil\nfrom flair.models import SequenceTagger\n\
    from flair.trainers import ModelTrainer\n\n# one-dimensional hidden size to produce\
    \ a tiny model\ntagger = SequenceTagger(embeddings=embedding,\n              \
    \          tag_dictionary=label_dict,\n                        tag_type=lbl_type,\n\
    \                        hidden_size=1)\n\ntrainer = ModelTrainer(tagger, corpus)\n\
    \n# train for only one epoch as quality does not matter here\ntrainer.train('tiny_model',\
    \ max_epochs=1)\nshutil.copy2('tiny_model/final-model.pt',\n             'tiny_model/pytorch_model.bin')\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 171
  md: 'The preceding code will spit out a tiny sequence tagging model roughly 100
    KB in size and terrible at tagging text – just right for our exercise. The model
    will be saved as `final-model.pt` in the `tiny_model` directory relative to where
    we ran this code from. Because the model will later be uploaded to the Hugging
    Face Models Hub where it will need to be named `pytorch_model.bin`, the preceding
    code snippet also creates a copy of the `final-model.pt` file called `pytorch_model.bin`.


    We now have our model. It''s time to upload it to the Hugging Face Models Hub.


    # Uploading the model to the Hugging Face Models Hub


    Uploading models to the Hugging Face Models Hub is described in detail in the
    official documentation at https://huggingface.co/docs/hub/adding-a-model.


    There are three ways of uploading models to Hugging Face models hub:


    +   - Using the `huggingface-cli` command line interface tool

    +   - Using the `huggingface_hub` Python library

    +   - Using the Hugging Face web interface


    For consistency and due to its ease of use, we will cover the process of using
    the web interface.


    # Signing up to Hugging Face


    To contribute to the Hugging Face Models Hub, you first need an account. Simply
    sign up as part of the usual registration process.


    Do take extra care when filling out one specific form item – your username. The
    username is extremely important because it will define the address at which the
    model will be available through the Accelerated Inference API, as well as the
    model key for using the public version of this model in Flair.


    We''ll choose a random username, `flairbook`, but remember that your username
    needs to be unique.


    Once done with the registration process, make sure to verify the email address
    using the link sent to your email address.


    # Create a new model repository


    After signing up and verifying the email address, visit the Hugging Face home
    page and click **New > Model**.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'A Hugging Face model repository is a store of all binary files, documentation,
    metadata, license files, and any other files relating to a certain model. It uses
    **Git** and **Git Large File Storage (LFS)** to store the files. You can use it
    just like using any other Git software repository.


    We''ll create a new model repository and give it a random name, `flairmodel`.
    The user interface shows the model will be available via the `<username>/<reponame>`
    format, which in our case is `flairbook/flairmodel`.


    Make sure to mark the model as public.


    # Uploading the relevant model files


    After creating the repository, we will be redirected to the model home page. From
    the home page, we have the option to clone the repository to our local filesystem
    or to edit and upload the repository files through the web user interface. As
    part of this exercise, we''ll be using the browser interface to upload files.
    But keep in mind that for a large model, using Git is highly recommended. We''ll
    need to upload two files:


    +   - The model binary named `pytorch_model.bin`

    +   - The model card named `README.md`


    The model binary is our trained model and is stored at `tiny_model/pytorch_model.bin`.
    We will need to upload this file to the `root` of our Hugging Face repository.
    Using the web interface, this can be done by clicking the **Files and versions**
    tab and then clicking **Add file > upload file** to navigate to a form, where
    you can drag and drop the model binary. After dragging and dropping the file,
    click **Commit changes**, which will do the same as adding and pushing this file
    through Git.


    The model card can now also be added by clicking on the **Model card** tab and
    clicking **Create model card**. This file is a model description file that contains
    metadata (information that tells Hugging Face about what type of model this is)
    and description (information that tells humans about what type of model this is).


    Let''s create a model card with the following content:


    ```

    ---

    tags:

    - flair

    - token-classification

    widget:

    - text: "does this work"

    ---

    ```'
