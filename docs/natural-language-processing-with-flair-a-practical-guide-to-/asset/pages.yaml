- pgno: 87
  md: 'This code block will spit out something like the following:


    ```

    Sentence: "Hello world" → ["Hello"/RB, "world"/VB]

    ```


    Here, the words Hello and world are tagged with RB and VB, suggesting that the
    first word is an adverb and the second one is a verb. This is clearly incorrect.
    If you run these two code snippets yourself, you will likely get different results.
