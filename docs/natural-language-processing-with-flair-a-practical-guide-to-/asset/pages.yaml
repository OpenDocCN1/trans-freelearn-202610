- pgno: 151
  md: '# 9

    Deploying and Using Models in Production


    When **Natural Language Processing** (**NLP**) researchers and scientists work
    on improving a certain NLP model, they usually spend significant amount of time
    working on improving some very specific part or aspect of the model. When their
    work is done, results are gathered and then published as part of an academic paper.
    However, if you plan to leverage NLP for practical purposes, either as a commercial
    solution or simply as part of a personal project, a well-trained model is usually
    the point where your journey only begins.


    In the first section of this chapter, we plan to cover the typical issues generally
    encountered when using NLP models in production, how to overcome these issues,
    and how to make our models publicly available. We will then address the issue
    from the low level by building a self-serving NLP solution. We will talk about
    the tools and libraries available for self-serving and the reasons why you should
    or shouldn''t opt in for self-serving. Finally, we will cover the various types
    of managed NLP machine-learning-as-a-service solutions, and how and when to use
    them. We will wrap up with a hands-on exercise where we deploy Flair models to
    production using the **Hugging Face Accelerated Inference API**.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'In this chapter, we will talk about how to tackle these problems and deploy
    our own Flair models to production with ease as part of the following sections:


    +   - Technical considerations for NLP models in production

    +   - Self-serving Flair models

    +   - Using managed services for deploying and using Flair models


    # Technical requirements


    To run the code in this chapter, you will need the usual local Python setup with
    Flair version 0.11. You will also need one additional Python library called Flask
    version 2.0.3. Code examples covered in this chapter are found in this book''s
    official GitHub repository in the following Jupyter notebook: https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter09.


    # Technical considerations for NLP models in production


    Deploying machine learning (especially NLP) models differs from deploying other
    software solutions in one key area – the resources needed to run the service.
    Hosting a generic service for a simple mobile or web app can, in theory, be done
    by any modern device such as a PC or a mobile phone. Only as you start to scale
    the service to cater to a larger audience is when you need to put extra thought,
    effort, and resources into making the service more scalable. When serving machine
    learning models, things often get complicated right from the start. We are dealing
    with huge models where a typical web server sometimes can''t even load a model
    into memory. Each request uses up a significant amount of resources, yet we need
    to serve requests on demand, in real time, and to a large audience. But how do
    you do that?


    When comparing this chapter''s topic to what we covered in this book so far, you
    will notice that deploying models to production is an entirely new problem that
    requires a slightly different set of skills. What we did in the preceding chapters
    was focused on the understanding and processing of data and the utilization of
    different machine learning and natural language processing techniques to achieve
    a certain goal. All this knowledge is less relevant now. What we care about now
    is deploying and maintaining NLP services in a way that will allow them to serve
    as many requests as quickly as possible, as reliably as possible, and using as
    few resources as possible. Easy, right?'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'The set of skills to achieve this is often so different from the set of skills
    required to design and train NLP models that it''s typically handed over to completely
    different individuals – the software or MLOps (a field joining machine learning,
    DevOps and data engineering) engineers. There is a great book published by Packt
    called Engineering MLOps where you can learn more about this interesting engineering
    field. But while deploying ML models to production requires a very specific set
    of skills, it''s not an impossible process in and of itself and can be done by
    anyone who follows these steps.


    Before you make any decisions about deploying your NLP model, you need to first
    ask yourself the following questions:


    +   - Is the inference (the process of generating predictions) going to be done
    client-side or server-side?

    +   - Does the service need to be scalable?

    +   - Do you want to learn by doing this work or simply achieve a goal?

    +   - Is your model deployable on a managed service?


    All these decisions play an important role in determining where and how the NLP
    models will be deployed. Let''s investigate each point in detail.


    # Client-side versus server-side inference


    Probably the most important and, at the same time, the easiest to answer question
    relating to deploying NLP models is whether they will be stored and perform inference
    locally on a client''s machine, or whether the model will be stored and the inference
    performed remotely on a server or a managed cloud service.


    When machine learning inference is performed locally on a client''s machine (such
    as a mobile phone, laptop, PC, or an e-book reader), we call this client-side
    inference.


    When machine learning inference is performed remotely on a server or a managed
    cloud service, we call this server-side inference.


    Both approaches have their pros and cons, and deciding which one to use almost
    always depends on the problem you are trying to solve with the NLP model because,
    at this point, you already know what NLP problem the model solving; this means
    that the decision is generally very straightforward.


    Because machine learning models are typically large and require significant resources,
    there is a general misconception in the ML community that all machine learning
    inference needs to be done server-side on large GPU-equipped machines.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'Surely, given the recent growth in the size of transformers and other NLP models,
    the era of using machine learning models locally is over? My mobile phone or laptop
    could never handle production-grade machine learning models, right?


    As plausible as the preceding sentence sounds, it is undeniably and utterly false.
    If you are using an electronic device to read this book, chances are that the
    machine you are using is packed with machine learning models.


    Modern electronic devices use locally stored machine learning models to solve
    a number of different tasks:


    +   - *Face recognition on mobile phones, laptops, and PCs*: Modern electronic
    devices use computer vision models optimized to run on low-performance devices
    to perform face recognition instantaneously without the need for a network connection.
    It would be rather unfortunate if you were only able to unlock your phone or laptop
    if your internet connection worked.

    +   - *Fingerprint recognition on mobile phones*: Fingerprint recognition is yet
    another method of unlocking a device with emphasis on speed. A user expects their
    fingerprint to be recognized in a matter of milliseconds. Aside from speed, another
    major reason why storing a fingerprint recognition model locally makes sense,
    is privacy. Most users would be appalled if they realized their fingerprint data
    is being streamed to a server located on the other side of the planet owned by
    a big tech corporation, even if the company’s intentions were completely non-malicious.
    Low latency and privacy are key for fingerprint recognition, which is why manufacturers
    almost always opt in for client-side inference.

    +   - *Typing predictions for virtual keyboards*: Another area where low latency
    and privacy outweighs prediction quality is virtual keyboards. Software keyboards
    download and store typing prediction models locally, which allows users to leverage
    typing predictions even when offline in environments such as an underground train.

    +   - *Self-driving cars*: Self-driving cars make use of a number of machine learning
    models that allow them to make decisions about navigating a vehicle.

    +   - *AI camera apps on mobile phones*: Modern mobile phone camera applications
    leverage specialized machine learning algorithms that select the right camera
    settings based on the environment and then post-process the image using machine
    learning-based image processing software. The models need to be fast, responsive,
    and available consistently – a perfect match for local inference.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'The list goes on, and it clearly shows that there currently is a demand for
    specialized low-resource machine learning models designed for local inference.
    It''s entirely possible the trends may lean more towards the server side in the
    future, but it''s unlikely local models will disappear completely. This is simply
    due to the physical laws that govern the theoretically minimal signal latency.
    For example, even in the theoretically best possible scenario where we develop
    a server-side machine learning service that brings inference time close to zero
    and build a network infrastructure that sends signals at the speed of light in
    a vacuum, the amount of time needed to send an inference request from a device
    in Paris to a server in New York and back will still take 54 milliseconds (the
    amount of time light travels from Paris to New York and back in a vacuum). So
    even the theoretically best possible scenario for server-side inference is still
    too slow for some applications such as self-driving cars.


    Both server-side inference and client-side inference clearly come with a set of
    advantages and drawbacks, and before making a rushed decision, it''s important
    to consider the pros and cons.


    *The advantages of using local inference:*


    +   - *Privacy:* To an average engineer who understands how safe network protocols
    and communication can be, the thought of a photo of their face or a scan of their
    fingerprint being transmitted over the internet isn''t off-putting or scary. However,
    for the non-tech-savvy, this spells disaster. When the news of highly personal
    or biometric data being streamed over the internet draws media attention, the
    impact for the company will be significant. It doesn''t matter whether the company
    developed the safest possible algorithm, one that could even be safer than local
    inference; the media and people appalled by this fact won''t care, and the damage
    will be done. When dealing with personal and biometric data, it''s therefore important
    to take into careful consideration how and where this data is going to be transmitted
    and stored. A good way to avoid this problem altogether is to not transmit the
    data at all and use local inference instead.

    +   - *No network latency:* Powerful servers and supercomputers have the potential
    to do inference quicker than an average mobile phone, but if we decide to go down
    the remote inference route, our requests and results will need to travel over
    the internet, incurring network latency. We can completely eliminate network latency
    by not doing network communication at all – with local inference.

    +   - *Maintenance:* Optimizing a model for low-resource devices is hard. But
    once you get it right, and build a model that works on all different types of
    devices and deploy it successfully, your job is done. With local inference, there''s
    no service to take care of or network spikes to monitor – just sit back and relax.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '+   - *Cost saving:* As harsh as it sounds, it''s true. When a company does
    client-side inference instead of server-side inference, it means that all the
    computations required to generate results as part of the machine learning models
    will be done on customers'' devices. These computations will use electricity.
    And the electricity is paid for by... the customer.

    +   - *Scaling by design:* When we go from 1 user to 10 users with server-side
    inference, the amount of compute power required will increase tenfold. With local
    inference, it''s different. Inference is distributed by default. We have a dedicated
    machine learning inference machine for each user – their own device. It doesn''t
    matter whether a single user does inference on their machine or whether it''s
    a billion users. This leads us to an interesting conclusion – *local inference
    delivers scaling by design.*


    *The disadvantages of using local inference:*


    +   - *Catering to resource and performance constraints:* The model you plan to
    deploy will likely need to work on a number of different devices with varying
    compute capabilities. Should you deploy a very simple dumbed-down model that''ll
    work on all devices but won''t deliver great performance? Should you deploy models
    on high-end devices only and simply tell the low-end device users they can''t
    use the feature? Or should you build different models for each device type – some
    models for low-end devices and some for high-end devices? These are all questions
    you''ll need to answer if you go down the local inference route, and the answers
    will depend on business needs and requirements.

    +   - *Compromised prediction quality due to size and resource constraints:* Local
    inference models need to be small. They need to fit on a device such as a mobile
    phone and be stored in its very-limited memory. This means that the model will
    be hugely limited in terms of the number of parameters. To optimize a model for
    local inference, you may need to reduce it in size significantly. This undoubtedly
    results in a huge hit for prediction quality.

    +   - *Versioning hell for model updates:* If you host a model on a remote service,
    to update a model with a newer, improved version, you simply need to swap the
    old model with the new one on the remote service. However, with local inference,
    things get complicated. To make model updates possible, you first need to implement
    a system that manages updates. You then need to release the new model to all the
    devices that have an internet connection and have opted in for updates, but you
    also need to keep in mind that there will be a certain proportion of users who
    will never update due to no internet connection or refusal to accept updates.
    As a result, your user base will be using a variety of different versions of models,
    and you will need to support them all.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Conversely, there''s a long list of advantages to using server-side inference:


    +   - *Server-side applications can make use of the out-of-the-box, machine-learning-as-a-service
    solutions:* If you opt in for server-side inference, a whole new world of ready-to-be-used
    solutions awaits that likely requires a few clicks to get your model from a file
    to a production service. There is a long list of managed services you can make
    use of if you plan to do inference server-side, whereas for local inference, you
    will need to, at least to some extent, reinvent the wheel.

    +   - *You can use state-of-the-art models:* Current state-of-the-art NLP models
    have a large number of parameters, and we can''t expect any of them to fit on
    a device such as a mobile phone anytime soon. To use state-of-the-art NLP models
    in production, you simply need to resort to server-side inference.

    +   - *Updates are easy and comprehensive:* To update a model server-side, unlike
    with local inference, you simply need to swap the old model with the new one at
    a single point. Once you do that, all inference performed from that point onward
    will feature results generated by the new model.


    At the beginning of this section, we mentioned that deciding between client-side
    or server-side inference is usually a simple question to answer. All it really
    boils down to is whether we want huge high-performance models with network latency
    or no network latency at all but compromised model quality.


    The server-side inference approach simplifies a number of aspects of NLP model
    deployment but also raises a number of new questions. Let''s discuss these as
    part of the next section.


    # When to use managed services and when to self-serve server-side models


    Another important decision that has a huge impact on how you manage your NLP services
    boils down to whether you will choose a managed service or decide to self-serve.


    If we decide to self-serve our models, it''ll mean that we''ll be responsible
    for setting up server infrastructure, building software for the endpoint that
    delivers NLP results, building software for performing inference on the model,
    scaling the system when our user base grows, and much, much more. We will essentially
    be taking care of the entire machine learning life cycle manually.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Conversely, a managed or fully managed service is a commercial solution that
    provides support for most of these tasks. Fully managed machine learning services
    provide out-of-the-box support for the following:


    +   - *A managed infrastructure:* When deploying NLP services, the final model
    will likely live on a particular machine somewhere in a data center. In order
    for our users to use our service, they will need to have means of reaching this
    machine through a domain name or an IP address. To set up a self-serve NLP service,
    infrastructure needs to be put in place to make sure that the right requests hit
    the right server so that it can return the results to the user. All these decisions
    are taken care of for us as part of a managed service.

    +   - *Managed endpoints:* A machine learning model, from an engineering perspective,
    is a binary file that can be loaded into memory and, through a machine library,
    perform interface. However, given that we are using a server-side inference approach,
    it means that if a user needs some predictions from an NLP model, they will need
    to send a request over the internet. This request will need to reach the service,
    which will need to interpret the request and respond appropriately with results.
    Therefore, there needs to be a means of communication agreed by the client and
    the service. A popular solution to this is using a communication protocol called
    **REST**, which allows communication through a **REST API** that utilizes the
    **HTTP** or **HTTPS** protocol. But the machine learning endpoints are not just
    responsible for client-server communication, parsing requests, performing inference,
    and returning the results to the user. They have a number of other responsibilities.
    They need to return appropriate error messages if something goes wrong (for example,
    if the input text exceeded the length limit). They need to return appropriate
    error messages if the user doesn''t have access. They need to be able to handle
    a large number of requests at the same time and queue appropriately. They need
    to perform optimization tasks such as caching.


    When building a production-grade NLP service, you will need to think about these
    issues and implement solutions yourself. Managed services take care of all that.


    But it''s worth mentioning that managed services can only do so much. Self-serving,
    while cumbersome, allows you to implement whatever you want and add any feature
    you can think of. With managed services, you are limited to using only the features
    offered by the service.'
  merge: -1
  img_proc: true
- pgno: 159
  md: "+   - *Scaling*: One of the biggest selling points of fully managed ML services\
    \ is the promise of scaling. It resolves one of the biggest issues with self-serving,\
    \ which is getting caught up in a non-scalable infrastructure. For example, let's\
    \ imagine you implement a simple ML endpoint on a single virtual machine. This\
    \ solution will be easy to implement and work great for a few daily users. But\
    \ when you start getting more users, the service will start returning delayed\
    \ results, and too much traffic will sooner or later cause a denial of service.\
    \ The application will then need to be modified to be able to handle a medium\
    \ amount of daily users. By the time this solution is implemented, you will have\
    \ lost a great deal of customers due to service unavailability. When a solution\
    \ capable of dealing with a medium amount of traffic is implemented, you may realize\
    \ that the number of users is increasing too quickly and that the entire solution\
    \ will need to be reimplemented again to make it high-traffic capable.\n+   \n\
    +     Fully managed ML services claim to solve all these problems. They advertise\
    \ their services as scalable by default. This means that if your service works\
    \ great for 1 daily user, it should, in theory, work the same for 1 million daily\
    \ users. This allows you to spend time and resources on more useful endeavors.\n\
    +   - *Deploying models and versioning*: Most fully managed ML services come with\
    \ a set of tools and features for deploying ML models. In some cases, using them\
    \ is as easy as uploading the ML model binary and clicking **deploy**.\n+   -\
    \ *Monitoring*: If you decide to self-serve, you will inevitably also need to\
    \ build or set up tools for monitoring. These tools provide insights about how\
    \ many users are using the service and help you decide whether or not you should\
    \ scale. Nearly all managed services offer this out of the box.\n+   - *Freemium\
    \ pricing plans and low setup costs*: Most fully managed ML services have a near-zero\
    \ setup cost and a pricing plan where you pay only for what you use. Furthermore,\
    \ some services offer a freemium service where the first *N* daily/ monthly requests\
    \ are free. Pricing for these services is often competitive and affordable compared\
    \ to the spending resources with self-serving. It is only when a company grows\
    \ to a significant size (such as becoming a big corporation) that a fully managed\
    \ service will become less economical than hiring a dedicated team responsible\
    \ for self-serving."
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Important Note


    Fully managed ML services also feature tools for the complete ML life cycle, which
    includes data labeling, data preprocessing, model training, deployment, and validation.
    These features are, by design, limited in terms of what they can do and often
    only support a limited set of NLP tasks, such as text classification, but they
    may not work for tasks such as sequence tagging or specifically training Flair
    models.


    Because few popular managed ML services offer support for the entire ML life cycle
    of all the types of models that Flair can build, we plan to focus only on the
    steps required to get your NLP model deployed to production. The steps required
    for setting up automation pipelines for maintenance and model refresh will be
    left out, as they relate to a more general field called MLOps.


    The preceding bullet list shows a number of points clearly working in favor of
    fully managed services. This begs the question, why not use a managed service
    over self-serving every time?


    The general answer to the preceding question is: if you can, you should. There
    are, however, some cases where self-serving may be a more reasonable choice. You
    can decide to self-serve if the following applies:


    +   - You want to learn about how setting up ML services works from a low-level
    engineering perspective.

    +   - You have a large enough user base that makes using managed ML services uneconomical.

    +   - The ML library, framework, or task you are working on isn''t supported by
    the managed service.


    Unless you fall under any of the categories described in the preceding bullet
    list, you are likely to be better off simply using a fully managed service.


    With this, let''s have a look at what services you can use to deploy Flair models.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Managed services for Flair models


    Managed services for hosting ML models are usually commercial solutions offered
    by either big-tech cloud platforms or specialized ML-oriented companies that offer
    ML as a service.


    The list of services that can be used with Flair, however, is constantly changing,
    and so the user interfaces for interacting and managing these services. This means
    that a step-by-step guide focusing on how to interact with the UI or API of a
    specific managed ML service is likely to become outdated within a year.


    However, you''re not out of luck! There is one exception. There is one specific
    service that is tightly integrated with Flair and is likely to be supported for
    years to come. It''s called the **Hugging Face Models Hub**. It''s a repository
    that hosts a vast number of ML models, as well as providing tools to test them
    in a web browser, viewing instructions on how to train them, and deploying them
    as a service.


    Later on, we''ll have a look at how to train, host, and use Flair models deployed
    as part of the Hugging Face Accelerated Inference API service.


    But before wrapping this section up, let''s recap all the advice, tips, and tricks
    covered in this section.


    # A model deployment decision-making flowchart


    To make Flair model deployment decision-making easier, we prepared a flowchart
    that helps you decide on the right path to deploying Flair models to production.


    Depending on your business needs, resources, and aspirations, you will have these
    three options for deploying your Flair model:


    +   - Client-side deployment with local inference

    +   - Fully managed ML as a service solution

    +   - Self-serving'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'The following flowchart will make it easier for you to decide between the preceding
    three approaches:


    ![](img/c56c48b8fd18a11ab705352d618ed976_162_0.png)


    Figure 9.1 – The NLP model deployment decision-making flowchart


    Depending on what situation you are in, you will end up using one of the three
    ML deployment types. Bear in mind that the proposed decision-making process is
    based purely on good practices and subjective advice. Everyone’s situation will
    be different, and you should always use your own or other experts’ judgment.


    Regardless of which ML deployment route you choose to go down, it’s always useful
    to have at least some level of understanding of each possible option.


    Let’s explore both self-serving and using managed ML solutions as part of the
    following hands-on exercises.


    # Self-serving flair models


    Regardless of whether you decide to self-serve or use a fully managed service,
    having some basic understanding of how NLP model deployment inference works in
    production is always useful.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Since deploying NLP models in production is more of a software engineering
    feat than an NLP challenge, general software engineering rules apply – the main
    one being, *don''t reinvent the wheel.*


    While implementing your own NLP model-serving frameworks is entirely possible,
    doing so will require a significant amount of time. Chances are that even if you
    put your best efforts into implementing a solution, you won''t be able to build
    a product better than the open source solutions out there built by hundreds of
    different contributors.


    There is a wide range of tools and packages out there for self-serving NLP models,
    but one specific package stands out due to its support for **PyTorch** packages
    (Flair is built on top of PyTorch) and its support for Hugging Face models. The
    package is called **TorchServe.**


    # TorchServe for self-serving Flair models


    PyTorch is a popular open source ML framework. Flair, an NLP framework on its
    own, is built on top of PyTorch and utilizes its tools for designing, training,
    and storing neural models.


    Because Flair models are essentially PyTorch models, a tool such as TorchServe
    seems like a perfect fit. Let''s see how TorchServe works by having a look at
    its design chart:


    ![](img/c56c48b8fd18a11ab705352d618ed976_163_0.png)


    Single physical or virtual machine


    Figure 9.2 – TorchServe design'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'The preceding design schematic shows various parts of the TorchServe framework
    as described in their official documentation at https://github.com/pytorch/serve.


    Let''s take a look at the main components:


    +   - **Frontend:** The component responsible for handling requests. It receives
    the user''s request as input, parses it, and passes it on to the backend that
    returns the model output, which is then processed, formatted, and sent back to
    the user.

    +   - **Inference endpoint:** A specific part of the frontend, reachable at a
    certain address, and responsible for handling requests and returning results.

    +   - **Inference API:** An API that allows and defines communication between
    the client and the frontend.

    +   - **Model store:** A directory that contains the models.

    +   - **Backend:** A threaded component that contains model handlers responsible
    for performing inference.

    +   - **Management API:** A special API, dedicated to the owners of the application,
    allowing us to configure the service.


    The flow of events of a single use of a TorchServe service is as follows. A client
    first sends a request to the frontend using the inference API. The request contains
    a payload containing the input that will be provided to the NLP model. If the
    framework is too busy to process the request, the request is batched (queued).
    If not, it is passed to the endpoint, where it is parsed, and the payload is passed
    on to a model handler. A model handler performs inference on the loaded NLP model
    and returns the output to the endpoint. The endpoint prepares and formats the
    output (typically, using the JSON format) and returns it to the user.


    The preceding TorchServe design run-through provides a very high-level overview
    of how it works and how it is used to serve NLP models. The setup and installation
    process of TorchServe can be very platform-specific and not something that can
    easily be covered in a few lines of code. The entire process of setting up TorchServe
    is described brilliantly as part of their official documentation on GitHub.


    But don''t let the fact that this book won''t be covering TorchServe in great
    depths get you down. As part of the upcoming section, we''ll implement our very
    own proof-of-concept tool for serving Flair models.


    # A proof-of-concept self-serve tool for Flair


    Implementing a reliable, scalable, safe, and production-grade NLP self-serving
    tool is a complex process that requires weeks, if not months, of careful thought
    and preparation. In most cases, instead of implementing the solution yourself,
    you''ll be better off using an already available open source tool such as TorchServe.'
  merge: -1
  img_proc: true
- pgno: 165
  md: "But sometimes, we simply want to build a proof of concept. This is a simple\
    \ tool that demonstrates what our model can do and allows the service to be available\
    \ to at least a handful of users/customers.\n\nTo learn about that, let's build\
    \ a simple service that performs named entity recognition using Flair's state-of-the-art\
    \ English Named Entity Region (NER) tagger.\n\nThe solution can be implemented\
    \ by following these steps:\n\n+   1. Installing the required libraries\n+   2.\
    \ Defining the function for sequence labeling\n+   3. Defining the endpoint\n\
    +   4. Starting the service\n\nLet's implement the solution step by step.\n\n\
    # Installing required libraries\n\nThis proof-of-concept tool, aside from Flair,\
    \ requires one extra library that isn't preinstalled as part of the Python standard\
    \ library; neither is it a Flair transitive dependency (a requirement of a required\
    \ library). This library is called Flask. It's a lightweight Python framework\
    \ for setting up endpoints and is a perfect prototyping tool.\n\nWe'll install\
    \ version 2.0.3 by running the following:\n\n```\npip install flask==2.0.3\n```\n\
    \nThis will install Flask version 2.0.3, ensuring that your code behaves consistently.\n\
    \n# Defining the sequence labeling function\n\nNext, we need to define the function\
    \ that performs named entity recognition on some input text. We'll be using Flair's\
    \ default, state-of-the-art NER tagging model, which uses the ner model key:\n\
    \n```\nfrom flair.data import Sentence\nfrom flair.models import SequenceTagger\n\
    \ntagger = SequenceTagger.load('ner')\n\ndef tag_text(input_text):\n    sentence\
    \ = Sentence(input_text)\n```"
  merge: -1
  img_proc: true
- pgno: 166
  md: "```\n```\ntagger.predict(sentence)\n\nreturn sentence.to_tagged_string()\n\
    ```\n```\n\nIn the preceding code snippet, we define the tag_text(input_text)\
    \ function using the standard sequence tagging syntax used many times across this\
    \ book. The function receives text as input and returns tagged text as output.\
    \ For example, for the input text in New York, it'll return the tagged version\
    \ of the input string – \"in New York\" → [\"New York\"/LOC].\n\nThe preceding\
    \ code revolves around how we define the tagger object. It's defined globally\
    \ outside the tagging function, which ensures that the model is only loaded once\
    \ and can be reused for any number of requests. Do note that this approach will\
    \ cause issues for production-grade solutions where multiple processes attempt\
    \ to use the same Flair model object.\n\nWe're now ready to define our endpoint.\n\
    \n# Defining the endpoint\n\nThis endpoint is responsible for being available\
    \ to receive requests at a certain address, parsing requests, passing them onto\
    \ the tag_text() function, preparing the results, and passing them back to the\
    \ user:\n\n```\n```python\nfrom flask import Flask, jsonify, request\n\napp =\
    \ Flask(__name__)\napp.config['JSON_AS_ASCII'] = False\n\n@app.route('/ner-service')\n\
    def query_example():\n    text = request.args.get('input', '')\n\n    tagged_text\
    \ = tag_text(text).replace('\"', '\\'')\n\n    return jsonify({\"result\": tagged_text})\n\
    ```\n```\n\nThe preceding code snippet starts by defining the app object for the\
    \ web service. The following function is a definition of a web endpoint. We define\
    \ the endpoint by prepending the function definition with the @app.route('/ner-service')\
    \ decorator. This ensures that the endpoint is available at the /ner-service address."
  merge: -1
  img_proc: true
- pgno: 167
  md: 'We then fetch the input text straight from the URL as part of the `input` query
    string parameter. This means that if the user sends a GET request to `/ner-service?input=in+New+York`,
    the value of the `text` variable will be *in New York*.


    > **Important Note**

    > Using GET query string parameters as a means to receive text input from clients
    is almost always a bad idea. We used GET in this code example because it''s easy
    to do debugging using only a web browser. For production-grade services, you should
    use POST instead.


    The endpoint passes the input text to our `tag_text()` function and returns the
    result in **JSON** format, which allows the result to be both easily parsable
    by software as well as readable by humans.


    And that''s it! Now, we only need to start the service.


    # Starting the service


    The service can then be started by running the following:


    ```

    app.run(debug=False, port=9002)

    ```


    The code will start a web service using port `9002` and will register a previously
    defined endpoint at the `/ner-service` address. Note that the preceding command
    will run forever or at least until our web service crashes. If you ever need to
    stop the service, simply terminate the execution of the code snippet.


    We can now test our amazing NER tagging web service by directing the browser to
    our own machine''s local IP address at `127.0.0.1`.


    Let''s first visit our endpoint without providing any input text by directing
    our web browser to `http://127.0.0.1:9002/ner-service`.


    Our service returns the following:


    ```

    {"result":""}

    ```


    This indicates that the returned tagged text is an empty string. This makes sense
    given no provided input. Now, let''s test it out with some actual input by visiting
    `http://127.0.0.1:9002/ner-service?input=Never+been+to+Lima`.'
