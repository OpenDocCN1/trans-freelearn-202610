    # To get the most out of this book


    To run the code in this book, you will need a Python environment version 3.6 or
    later. It is highly recommended you run the code as part of a Jupyter notebook
    session, which will allow you to experiment and try out different variations of
    the original code more easily. To bypass the local setup, you can also run the
    code in a hosted Jupyter notebook environment such as Google Colab. You will also
    need the following Python packages:


    | Python packages needed to run the code in this book | Operating system requirements
    |

    |---|---|

    | Flair 0.11 | Windows, macOS, or Linux |

    | Flask 2.0.3 | Windows, macOS, or Linux |


    Detailed instructions about how to set up your local environment and install the
    Python packages can be found in Chapter 1, Introduction to Flair.


    If you are using the digital version of this book, we advise you to type the code
    yourself or access the code from the book''s GitHub repository (a link is available
    in the next section). Doing so will help you avoid any potential errors related
    to the copying and pasting of code.


    # Download the example code files


    You can download the example code files for this book from GitHub at https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/.
    If there''s an update to the code, it will be updated in the GitHub repository.


    We also have other code bundles from our rich catalog of books and videos available
    at https://github.com/PacktPublishing/. Check them out!'
