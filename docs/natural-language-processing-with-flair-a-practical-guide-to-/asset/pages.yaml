- pgno: 126
  md: '+   - Training a text classifier in Flair

    +   - Working with text classifiers that require little to no training examples


    Let''s dive in!


    # Technical requirements


    All of the Python libraries used in this chapter are direct dependencies of Flair
    version 0.11 and require no special setup, assuming Flair is already installed
    on your machine. Code examples covered in this chapter are found in this book''s
    official GitHub repository in the following Jupyter notebook: https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter08.


    You will be able to run most of the code and train most models in this chapter
    using a CPU. However, the final exercise does require a GPU-equipped machine.


    # Understanding text classification


    Text or document classification is simply a process of assigning one or more labels
    (often called classes) to a piece of text (often called a document). A text classifier
    is a machine learning model that receives some text as input and computes a probability
    distribution over a set of classes.


    Text classification has many real-world uses and is actively used to solve the
    following problems:


    +   - **Topic classification** – the process of assigning a topic to a document

    +   - **Spam detection** – the process of detecting unwanted emails

    +   - **Sentiment analysis** – classifying text sentiment into positive and negative

    +   - **Hate speech detection** – identifying hate speech in text

    +   - **Language identification** – figuring out what language a document is written
    in


    Here''s an example of the real world use of text classification:


    ![](img/c56c48b8fd18a11ab705352d618ed976_126_0.png)


    Figure 8.1 – Spam detection'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'In relation to how documents are classified, we know three different types
    of text classification:


    +   - **Binary classification** – there is only one possible class in binary classification.
    Each document either belongs to that class or doesn''t belong to that class.

    +   - **Multiclass classification** – only one of the many possible classes is
    assigned to a document.

    +   - **Multilabel multiclass classification** – one document can belong to multiple
    classes simultaneously.


    It should now be clear that text classification, while a fairly simple concept
    to grasp, is still an important part of NLP. But before we dive straight into
    how to classify text in Flair, let''s have a quick look at how text classifiers
    are trained in general.


    # Training text classifiers


    Document or text classification is a form of supervised machine learning. This
    means that a machine learning model is trained on labeled data that acts as the
    ground truth. For example, for a spam detection classifier, each document would
    be labeled as *spam* or *not-spam*.


    There are no rules in text classification that define what and how many classes
    can be defined to solve a particular problem. The set of possible classes is usually
    artificially constructed so that it solves a certain business problem in the most
    optimal way. Text classification is therefore different from other forms of supervised
    machine learning, in the sense that there is usually no objective ground truth
    other than the labeled data itself. For example, for part-of-speech tagging, the
    ground truth, the solutions to how the words are supposed to be tagged, is defined
    by grammar, and there is a clear answer to what part of speech each word in the
    sentence should be classified into. But with text classification, the classes
    are often abstract, high-level concepts with no clear definitions or boundaries.
    Class assignments are, therefore, often subjective. For example, in sentiment
    analysis, we need to classify sentences into *positive* and *negative*. However,
    different people will have different opinions about whether certain sentences
    are positive or negative. Therefore, with classification problems, often there
    is no ground truth other than the labeled data itself. This is one of the reasons
    why text classifiers are susceptible to labeling bias. It means that if the class
    labels in our training text contain bias, our predictions, regardless of how well
    we train the model, will be biased.


    Detecting and mitigating bias is a complex problem that extends NLP and, even
    more so, extends the scope of this book. Here, we plan to cover how the models
    are trained and, more importantly, once trained, how and what they are evaluated
    against.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'The process of training a text classifier is not a whole lot different from
    training sequence taggers. We start off with a certain deep learning model with
    randomly initialized weights, and then we train the model in a way that fits the
    training data. Of course, we don''t want our model to fit the training data too
    well in an effort to avoid overfitting. This is why it''s important to assess
    the model on the test dataset. To evaluate the model and determine whether it
    works as intended, we use one of the following metrics.


    # Metrics for single and multi-label text classification


    The simplest and easiest way to understand a metric that can be applied to many
    classification problems including text classification is **accuracy**. Accuracy
    is simply the proportion of correctly classified data. It can be computed using
    the following formula:


    $$\frac{correctlyClassified}{(incorrectlyClassified + correctlyClassified)}$$


    Here, `correctlyClassified` is the number of examples that were assigned the correct
    label, and `incorrectlyClassified` is the number of examples that were assigned
    an incorrect label. While this metric results in a number between 0 and 1, it
    can be multiplied by 100 and expressed by a percentage (%) value.


    For text classification problems with balanced class distribution (where there
    is the same number of examples that belong to each class in our training data)
    and single-class classification, this metric is often as good as it gets. But
    when we start dealing with multi-label (assigning more than one class to each
    training example) classification or imbalanced datasets, that''s when we may look
    further toward other metrics, such as the **F1score**.


    The F1 score was already well explained in *Chapter 4, Sequence Tagging*, and
    the same F1 score concepts that apply to sequence labeling there apply to text
    classification here. The score is a harmonic mean of two other metrics called
    **precision** and **recall**. It ranges from 0 (worst possible score) to 1 (best
    possible score).


    To fully understand the F1 score in terms of classification, we need to assess
    each class label individually. For each predicted label, we check whether it is
    the label in question (meaning positive) or not (meaning negative). We then compute
    the following metrics.


    In classification, `precision` is the proportion of positively labeled examples
    that are truly positive:


    $$precision = \frac{tp}{tp + fp}$$


    And `recall` is the proportion of positive examples that were actually correctly
    classified:


    $$recall = \frac{tp}{tp + fn}$$'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Where:


    +   - **True Positives (TP)**: The number of examples predicted positive that
    are actually positive

    +   - **False Positives (FP)**: The number of examples predicted positive that
    are actually negative

    +   - **False Negatives (FN)**: The number of examples predicted negative that
    are actually positive


    The F1 score is then defined as the harmonic mean of precision and recall:


    $F1 = 2 \cdot \frac{precision \cdot recall}{precision + recall}$


    The process of working out the F1 score is the same as the one used for sequence
    labeling and involves the following steps:


    +   1. Counting true positives, false positives, and false negatives

    +   2. Getting precision and recall using the preceding formulae

    +   3. Computing the F1 score as the harmonic mean of precision and recall


    If we compute the F1 score for each class label separately and then average all
    the F1 scores, we obtain the **macro F1 score**. This metric takes into account
    imbalanced class distributions in our dataset.


    If we compute the F1 score for all the classes counting the total true positives,
    false negatives, and false positives together, we obtain the **micro F1 score**.
    This metric will have the same value as accuracy in single-label classification.


    Let''s see how this theory holds up in practice with one of the simplest yet most
    powerful NLP libraries out there.


    # Text classification in Flair


    Flair offers a simple interface for using pre-trained models as well as training
    custom text classifiers. While Flair''s secret sauce – the forward and backward
    Flair embeddings – aren''t the best tool for text classification tasks, Flair
    can leverage other third-party methods to yield excellent performance in text
    classification.


    Let''s first learn how to train and use Flair''s pre-trained models.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Using pre-trained Flair text classification models


    The set of pre-trained text classification models available in Flair is fairly
    small, and chances are, the model you''re looking for isn''t there. Even so, the
    following syntax will be valuable, as the API for loading and using the Flair
    pre-trained models is the same as the API for loading and using custom-trained
    models. We will train those in the next section.


    Flair currently offers the following stable pre-trained models:


    +   - sentiment – a sentiment analysis model for English to classify text as positive
    and negative

    +   - sentiment-fast – a slightly smaller version of the sentiment text classification
    model with faster inference

    +   - de-offensive-language – a text classification model for labeling German
    text as either offensive or non-offensive – for example, the model will label
    sentences that contain profanities as offensive


    Knowing which text classification model names are currently available in Flair,
    we can now load and use a model using the following syntax:


    ```

    from flair.models import TextClassifier

    from flair.data import Sentence


    classifier = TextClassifier.load("sentiment")

    sentence = Sentence("Flair is pretty cool!")

    classifier.predict(sentence)


    print(sentence.labels)

    ```


    The preceding code snippet will first load a classifier using the TextClassifier.load()
    function by passing in the sentiment model name. The first time we load this model,
    Flair will download it from its web servers onto our local machine. These models
    will then be cached on the disk for future use.


    We then initialize a Sentence class with a sentence that clearly delivers a positive
    message. Next, we will use the TextClassifier.predict() method to generate predictions
    and store them as part of our Sentence object.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Finally, we predict the class label probability by simply printing out the
    object. It produces the following output:


    ```

    [''Sentence: "Flair is pretty cool !"/''POSITIVE'' (0.9991)]

    ```


    The preceding message shows that our Flair is pretty cool! sentence was assigned
    a single POSITIVE class label. The message also indicates that our model is 99.9%
    confident in its decision.


    We can try the exact opposite with a profoundly negative sentence:


    ```

    sentence = Sentence("I don''t get enough sleep.")

    classifier.predict(sentence)

    print(sentence.labels)

    ```


    This prints out the following:


    ```

    [''Sentence: "I don''t get enough sleep ."/''NEGATIVE'' (0.9911)]

    ```


    This indicates that our model is 99.1% sure that the preceding message has a negative
    connotation.


    And that''s it! A few lines of code and we can already classify text. The downside
    of Flair''s pre-trained text classification models is that there''s sadly only
    a handful to choose from. Luckily, Flair provides an easy-to-use interface to
    train new custom models, and we can train as many as we want! Let''s learn how
    to do that by first learning about how to leverage the underlying technology required
    to perform text classification in Flair – document embeddings.


    # Document embeddings in Flair


    The same way word embeddings are a key part of producing sequence labeling models
    in Flair, many text classification models leverage a similar concept – document
    embeddings.


    Document embeddings are essentially vector representations of documents. The term
    document simply refers to a sequence of words. The length of these documents can
    range from a single word to an entire book or corpus.


    Flair offers a set of different types of document embeddings as discussed in the
    following subsections.'
  merge: -1
  img_proc: true
- pgno: 132
  md: "# DocumentPoolEmbeddings\n\nThis is the simplest type of document embeddings.\
    \ It is a piece of code that computes word a word embedding for each word in the\
    \ document and returns an average. For example, if we had a two-word document\
    \ and the first word's embedding was [1, 2] and the second word's embedding was\
    \ [3, 0], the DocumentPoolEmbeddings embedding would be [2, 1]. Other than computing\
    \ the average embedding (referred to as mean pooling), this type of document embedding\
    \ can also use other means of pooling, such as min pooling (meaning it takes the\
    \ smallest value for each embedding dimension) and max pooling (meaning it takes\
    \ the maximum value of each embedding dimension). To use DocumentPoolEmbeddings,\
    \ you only really need the trained word embeddings. The document embeddings themselves\
    \ require no training, which is a huge plus!\n\n```\n```python\nfrom flair.data\
    \ import Sentence\nfrom flair.embeddings import (DocumentPoolEmbeddings,\n   \
    \                            WordEmbeddings)\n\nglove = WordEmbeddings('glove')\n\
    document_embeddings = DocumentPoolEmbeddings([glove])\nsentence = Sentence('two\
    \ words')\nglove.embed(sentence)\n\nprint((sentence[0].embedding + sentence[1].embedding)\
    \ / 2)\n```\n```\n\nIn the preceding code snippet, we implemented document embeddings\
    \ with mean pooling ourselves. We simply loaded a word embedding object and computed\
    \ word embeddings for two words (the word two and the word words). We then summed\
    \ the two word embeddings up and divided the resulting embedding by two – thus\
    \ averaging the two embeddings or performing mean pooling. We can do the exact\
    \ same by using the DocumentPoolEmbeddings class:\n\n```\n```python\ndocument_embeddings\
    \ = DocumentPoolEmbeddings([glove])\ndocument_embeddings.embed(sentence)\n\nprint(sentence.embedding)\n\
    ```\n```\n\nThe preceding code snippet uses the DocumentPoolEmbeddings class to\
    \ compute the embedding for our document. The output of printing out the embedding\
    \ shows that the result is the same as the embedding we computed previously by\
    \ averaging the two word embedding vectors."
  merge: -1
  img_proc: true
- pgno: 133
  md: 'But the convenience of using DocumentPoolEmbeddings comes at a cost – they
    often don''t deliver as good performance as the following embedding methods.


    # DocumentRNNEmbeddings


    DocumentRNNEmbeddings is a special type of document embeddings, implemented in
    Flair, that uses recurrent neural networks to form document vector representations.


    It usually yields better performance than DocumentPoolEmbeddings and, in the same
    manner, receives word embedding objects as input. However, out-of-the-box DocumentRNNEmbeddings
    is useless – a newly initialized embedding object is essentially an untrained
    neural network model with randomized weights. The model needs to be trained in
    order to be useful.


    But instead of getting sidetracked by training yet another type of embedding,
    let''s instead explore a different kind of document embedding in Flair that is
    both pre-trained and yields excellent performance.


    # TransformerDocumentEmbeddings


    A good approach to solving any problem is not to reinvent the wheel but instead
    to make use of technologies that already work well. A special kind of NLP model
    that has seen immense progress in recent years is transformers. Flair offers a
    wrapper class that is capable of computing embeddings for a whole document directly
    from a pre-trained transformer.


    TransformerDocumentEmbeddings is used the same way as any other embedding class
    is used in Flair – it can be used to embed sentences using the .embed(sentence)
    method. Let''s try this embedding out using the roberta-base transformer model:


    ```

    from flair.embeddings import TransformerDocumentEmbeddings


    embedding = TransformerDocumentEmbeddings(''roberta-base'')

    sentence = Sentence(''two words'')


    embedding.embed(sentence)


    print(sentence.embedding)

    ```'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'The preceding code snippet will print out a 768-dimensional vector representation
    of our sentence. The class uses **Hugging Face** transformers and thus allows
    us to use a wide variety of models, which are fetched directly from the publicly
    available Hugging Face Models Hub. We will cover a lot more about Hugging Face
    and learn how to publish our own models on the Models Hub in Chapter 10, *Hands-On
    Exercise – Building a Trading Bot with Flair.*


    There is a number of transformer-based pre-trained embedding models that are used
    by the `TransformerDocumentEmbeddings` class. The most notable examples are the
    following:


    +   - `bert-base-uncased`

    +   - `roberta-base`

    +   - `distilbert-base-uncased`

    +   - `xlnet-base-cased`


    We have now covered an essential underlying NLP concept that fuels Flair text
    classifiers. We''re now ready to dive deeper and explore how Flair text classifiers
    are designed.


    # Text classifiers in Flair


    Most text classifiers in Flair utilize the `TextClassifier` class. It is responsible
    for providing the tools for defining and using text classifiers in Flair. Unlike
    many other concepts in Flair, it is a surprisingly simple design. `TextClassifier`
    is a model that utilizes a single linear neural network layer, taking the document
    embeddings as input and returning the class labels as output.


    Let''s learn how to train text classifiers in Flair as part of a hands-on exercise.
    Let''s build our own sentiment analysis text classifier!


    # Training a text classifier in Flair


    In this section, we will be training a sentiment analysis text classification
    model capable of labeling text as *positive* or *negative*. Text classifier training
    follows a sequence of steps very similar to how sequence labeling models are trained.


    The steps required to train text classifiers in Flair include the following:


    +   1. Loading a tagged corpus and computing the label dictionary map

    +   2. Loading and preparing the document embeddings

    +   3. Initializing the `TextClassifier` class

    +   4. Training the model'
