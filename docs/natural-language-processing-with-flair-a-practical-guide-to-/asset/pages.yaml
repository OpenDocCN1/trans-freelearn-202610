  md: '# 3


    # Embeddings in Flair


    Embeddings are a core concept of **Natural Language Processing (NLP)** tasks in
    **Flair**. Understanding how different embeddings work, what types are available
    and knowing what type to use in what scenario is important in becoming a seasoned
    Flair user.


    While the framework offers a large selection of different embedding types, there
    is one that is absolutely essential and plays a pivotal role in achieving Flair''s
    excellent performance on NLP tasks. This type of embeddings, called Flair embeddings,
    is referred to by the main author as *the secret sauce of Flair*. Understanding
    the ins and outs of Flair embeddings will help you better understand the success
    behind Flair across so many NLP tasks and allow you to choose the right embeddings
    when training custom models.


    In this chapter, we will learn about the different embedding types, how they work,
    and how to use the individual embedding techniques in Flair for producing word,
    sentence, and document embeddings. After reading this chapter, you will get a
    deeper understanding of what embeddings to use in what situation. We will demonstrate
    how you can use arithmetic operations on word embeddings to understand the meaning
    and relationships between words using the "king is to man as queen is to woman"
    analogy. We will learn how to form new embedding types by combining multiple existing
    embeddings using stacked embeddings. We will also cover document embeddings and
    how to use them to produce embeddings for entire documents.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'The framework offers a range of embeddings that can be classified into various
    categories: *classic word embeddings*, *Flair embeddings*, *stacked embeddings*,
    *document embeddings*, and *other embeddings*. These categories are covered in
    the following topics:


    +   - Understanding word embeddings

    +   - Flair embeddings

    +   - Stacked embeddings

    +   - Document embeddings

    +   - Other embeddings in Flair


    # Technical requirements


    All of the Python libraries used in this chapter are direct Flair dependencies
    of Flair version 0.11 and will require no special setup, assuming Flair is already
    installed on your machine. The code examples covered in this chapter are found
    in this book''s official GitHub repository in the following Jupyter notebook:
    https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter03.


    # Understanding word embeddings


    **Word embeddings** are machine-interpretable representations of words such that
    embeddings of word pairs with similar meanings will have similar embeddings and
    words with dissimilar meanings will have vastly different embeddings.


    In the first chapter, where we covered the basics of embeddings, we loosely defined
    embeddings as vector representations of a particular character, word, sentence,
    paragraph, or text document. These vectors are often made up of hundreds or thousands
    of real numbers. Each position in this vector is referred to as a dimension.


    By now, you''ve probably wondered how we can tell whether two word embeddings
    are similar or different from each other. There are several metrics, such as cosine
    similarity, Euclidean distance, and Jaccard distance, that try to quantify this.
    **Cosine similarity** is usually the most commonly used method.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Cosine similarity


    Given two embedding vectors, A and B, cosine similarity is defined as follows:


    $similarity(\mathbf{A},\mathbf{B}) = \frac{\mathbf{A}\cdot\mathbf{B}}{\|\mathbf{A}\|\|\mathbf{B}\|}
    = \frac{\sum_{i=1}^n A_i B_i}{\sqrt{\sum_{i=1}^n A_i^2}\sqrt{\sum_{i=1}^n B_i^2}}$


    Here, the numerator (the top part of the fraction) is a dot product of the two
    vectors and the denominator (the bottom part of the fraction) is the product of
    magnitudes of each vector.


    The resulting similarity score is a value between -1 and 1. A value of -1 indicates
    that the vectors are the exact opposite of each other. A value of 0 indicates
    that the vectors are orthogonal, meaning there is no correlation. A value of 1
    indicates the vectors are similar.


    For example, if we compared two embedding vectors representing two customers''
    music tastes where they rated different songs, we would have the following:


    +   - *similarity*(**A**, **B**) = 1; means that the customers rated the same
    exact songs exactly the same.

    +   - *similarity*(**A**, **B**) = −1; means that the customers rated the same
    songs in the opposite way.

    +   - *similarity*(**A**, **B**) = 0; means that there is no correlation between
    the customers'' music tastes, meaning they probably agreed on some songs, but
    disagreed on other.


    You should now have a high-level understanding of the role and value of embeddings
    in NLP. It''s now time to put the theory into practice and get some hands-on experience
    with working with embeddings with Flair.


    # The "king – man ≈ queen – woman" analogy


    Well-designed and trained embeddings with a high enough dimensionality not only
    represent or uniquely identify a certain word or a sentence but also contain abstract
    information about the meaning of the word and its semantic properties. Surprisingly
    enough, we can use arithmetic operations on word vectors to form new words. This
    means that, in theory, if we add two word vectors together, we should get a new
    word that is the sum of the meanings of both of those words. Similarly, if we
    subtract one embedding vector from another, we get a new embedding that contains
    the meaning of the first word minus the meaning of the second word. This brings
    us to the king – man ≈ queen – woman analogy.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'If we take the word embedding for the word *king* and subtract the word *man*
    from that embedding vector, we should get an embedding for a word embedding representing
    some sort of a gender-neutral monarch. Similarly, if we take the word embedding
    for the word *queen* and subtract the word *woman* from it, we should also get
    a gender-neutral monarch word representation.


    By using the preceding assumptions, we can come up with the following equation:


    *king − man ≈ queen − woman*


    **Important note**

    Note that we used the *approximately equal to* symbol. It means that even if this
    claim holds, the two embeddings will only be approximately equal. The reason for
    this is mainly that the word embeddings are not perfect representations of words
    and are limited by their dimensionality, training biases, and the completeness
    of training data. The relationships between two pairs of words are also very unlikely
    to be identical.


    What this analogy is saying is that the relationship between the words *king*
    and *man* is very similar to the relationship between the words *queen* and *woman*.
    In other words, we could say the following:


    *king is to man as queen is to woman*


    In theory, we should be able to apply this concept to any two pairs of words that
    share similarly matching relationships. To take this hypothesis further, let''s
    replace our monarchs, *man*, and *woman*, with word placeholders such as *A*,
    *B*, *C*, and *D*:


    *A − B ≈ C − D*


    This allows us to transform this equation so that we can compute *D*:


    *D ≈ B + C − A*


    In other words, say we have the following statement:


    *A is to B as C is to D*'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'We can now compute the embedding for the word D given the embeddings for words
    A, B, and C. Once we get the embedding for the word D, finding its corresponding
    word is easy. We simply search embeddings of the entire vocabulary and find the
    word with the closest matching embedding.


    It''s now time we put our analogy solver to the test with Flair.


    # Implementation


    We are going to implement an algorithm that, given the words A, B, and C, computes
    the word D, in such a way that the A is to B as C is to D analogy will hold. For
    example, when given the input King is to man as queen is to..., the algorithm
    will respond with woman. The algorithm will consist of the following steps:


    +   1. Choosing and instantiating the embedding class we will be using in Flair

    +   2. Obtaining the embeddings for words A, B, and C

    +   3. Computing the approximate embedding for the word D using the D = B + C
    − A formula

    +   4. Obtaining embeddings for all English words in Flair

    +   5. Finding the closest matching word


    # Choosing and initializing the embedding class


    When choosing embedding types, it''s important that we choose a technique that
    isn''t contextual because we will be computing new words independently of the
    context we might find them in.


    We will therefore choose a set of random classic word embeddings using the crawl
    ID. The crawl embeddings are English word embeddings trained over web crawl data.
    The embedding object can simply be initialized by running the following:


    ```

    from flair.embeddings import WordEmbeddings

    fasttext = WordEmbeddings(''crawl'')

    ```


    The first time this code is executed, Flair will download the embedding model,
    which takes up some space and may take a few minutes to download fully.


    To save us from having to download the model again, Flair will make sure to use
    the locally stored version next time we use it.


    Once the embedding object is loaded, we can keep it in memory and reuse and pass
    it to our helper functions down the line to save execution time.'
  merge: -1
  img_proc: true
- pgno: 46
  md: "# Obtaining the embeddings for words A, B, and C and computing the embedding\
    \ D\n\nAs we learned in previous chapters, we can embed words in Flair by first\
    \ wrapping them in the `Sentence` object. For example, given a `fasttext` object\
    \ such as the one defined previously, our `Sentence` object can be defined with\
    \ `sentence = Sentence('word')`. Then, we can embed the words in our `Sentence`\
    \ object by running `fasttext.embed(sentence)`. We can also obtain the embedding\
    \ for the first word in the sentence by calling `sentence[0].embedding`. This\
    \ will return a **PyTorch** `torch.Tensor` object. It can be turned into a list\
    \ of vector components by calling `sentence[0].embedding.tolist()`.\n\nWith this\
    \ knowledge, we can implement a `compute_embedding_for_D(A, B, C, embedding)`\
    \ function that receives our three words (A, B, and C) and an embedding object\
    \ and returns the embedding vector of the computed word D.\n\nThe implementation\
    \ of this method is as follows:\n\n```\n```python\nfrom flair.data import Sentence\n\
    \ndef compute_embedding_for_D(A, B, C, embedding):\n    wordsABC_sentence = Sentence('\
    \ '.join([A, B, C]))\n    embedding.embed(wordsABC_sentence)\n\n    A_embedded\
    \ = wordsABC_sentence[0].embedding\n    B_embedded = wordsABC_sentence[1].embedding\n\
    \    C_embedded = wordsABC_sentence[2].embedding\n\n    D_embedding = B_embedded\
    \ + C_embedded - A_embedded\n\n    return D_embedding.tolist()\n```\n```\n\nIn\
    \ the first part of this helper function, we define the `wordsABC_sentence` object,\
    \ which contains a space-separated string containing our three input words, A,\
    \ B, and C. We then proceed to embed all the words in that sentence and extract\
    \ embeddings for each of our three input words and thus obtain our word embeddings\
    \ called `A_embedded`, `B_embedded`, and `C_embedded`. Using our $D = B + C -\
    \ A$ formula and Python's arithmetic operators, we then simply compute `D_embedding`\
    \ and return it as a list."
  merge: -1
  img_proc: true
