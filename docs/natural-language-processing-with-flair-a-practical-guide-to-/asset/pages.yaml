    To make our model produce good results, we need to tweak the model weights in
    such a way that they will produce as accurate results as possible. This is done
    through model training. Let''s figure it out.


    # Training the model


    We now have a tagged corpus that is loaded into memory, embeddings are defined,
    and the SequenceTagger object is created. We''re now ready to start training.


    The process of training involves first creating a ModelTrainer object and then
    calling its train() method.


    ModelTrainer expects the following required parameters:


    +   - `model`: A Flair model class – for example, a `SequenceTagger` object

    +   - `corpus`: A `Corpus` object


    Knowing all of this information, we can now initialize the ModelTrainer object
    by executing the following lines of code:


    ```

    from flair.trainers import ModelTrainer


    trainer = ModelTrainer(tagger, corpus)

    ```


    This leaves us at the last step of sequence labeling model training – calling
    the train() method. It receives a ridiculously long number of parameters, but
    here are some you might find useful:


    +   - `base_path`: The path to where the model will be stored. If the directory,
    or the subdirectories within it don''t exist, they will be created.

    +   - `learning_rate`: The initial learning rate. It defaults to 0.1.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '+   - `mini_batch_size`: The size of the mini-batches during training. It defaults
    to 32.

    +   - `max_epochs`: The number of epochs before finishing training. `150` is a
    good number to start with.

    +   - `patience`: The number of epochs with no improvement before terminating.
    It defaults to 3.

    +   - `train_with_dev`: Whether to use both the dev and train datasets for training.
    The dev dataset (sometimes also called the validation dataset) is a dataset used
    for tuning hyperparameters. If you aren''t doing any hyperparameter tuning, you
    can use that dataset for training instead. This allows you to train the model
    on a larger amount of data.

    +   - `checkpoint`: If True, Flair will store a model snapshot named `checkpoint.pt`
    in `base_dir` at the end of each epoch so that training can be resumed in case
    it gets interrupted.

    +   - `write_weights`: If True, Flair will write weights to a file called `weights.txt`.

    +   - `optimizer`: A **PyTorch** optimizer class. It uses stochastic gradient
    descent by default.

    +   - `epoch`: The starting epoch used if continuing a training run that was interrupted.

    +   - `use_tensorboard`: Writes out **TensorBoard** information if `True`.

    +   - `tensorboard_log_dir`: The directory where the TensorBoard data may be stored.

    +   - `metrics_for_tensorboard`: Custom optional metrics for TensorBoard.


    # But What Is TensorBoard?


    TensorBoard is a web tool for inspecting and understanding neural network training
    runs. It plots all the training data, such as loss, accuracy, and many other metrics,
    and allows us to easily monitor the training process. The tool was primarily built
    for integration with the **TensorFlow** deep learning framework but has since
    been integrated into many other tools. One of the tools that integrated TensorBoard
    is **PyTorch** – the underlying deep learning framework powering Flair. That''s
