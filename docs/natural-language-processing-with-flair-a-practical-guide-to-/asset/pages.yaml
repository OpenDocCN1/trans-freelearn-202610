- pgno: 177
  md: '# 10

    Hands-On Exercise – Building a Trading Bot with Flair


    In this final chapter, we will go through a hands-on programming exercise where
    we will leverage a number of Flair''s pre-trained models to build a real-world
    application. We will build a simple trading bot that uses Flair''s Named Entity
    Recognition (NER) and sentiment analysis tools to make trading decisions. The
    trading strategy consists of taking the current day''s news headlines as input
    and using NER to determine whether the news articles are discussing a company
    we are interested in. We will then run sentiment analysis that helps us make a
    call about whether to hold, buy, or sell this company''s stock.


    In the first section, we will cover the details of our trading strategy by explaining
    the motivation behind news sentiment-based trading approaches. Then, we will implement
    a trading bot using Flair. We plan to wrap the book up with a Flair coding cheat
    sheet containing a list of the most frequently used classes in Flair. We will
    cover all this as part of the following sections:


    +   - Understanding the trading strategy

    +   - Implementing the Flair trading bot

    +   - A Flair coding cheat sheet'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'But before diving straight into the ins and outs of trading bots, let''s make
    sure that we have all the technical requirements taken care of.


    # Technical requirements


    All of the Python libraries used in this chapter are direct dependencies of Flair
    version 0.11 and require no special setup, assuming Flair is already installed
    on your machine. Code examples covered in this chapter are found in this book''s
    official GitHub repository in the following Jupyter notebook: https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter10.


    # Understanding the trading strategy


    For this hands-on exercise, we''ll be implementing an interesting trading strategy
    that leverages several parts of the Flair NLP framework. The strategy is by no
    means the best and optimal trading strategy or one that is guaranteed to get you
    rich. It is, however, a strategy that clearly shows how Flair can be used to solve
    real-world problems with ease.


    The strategy will help us make decisions about trading stock. There are many sources
    of information based on which one can make their trading decisions. A particularly
    interesting type of trading strategy leverages NLP to process recent news content.
    The underlying assumption of these trading strategies is that news articles that
    discuss a certain company hold important information about events that are likely
    to affect the company''s stock price. Automated NLP strategies have a number of
    advantages compared to humans when it comes to investing. The advantages mostly
    boil down to the speed and scale of transactions that machines are capable of
    doing. A good NLP trading bot can analyze thousands of words of text and make
    a trading decision in a fraction of the time a human would.


    Typical NLP trading bots, however, struggle with the problem of word sense disambiguation.
    Humans have historically been great at deciphering ambiguous word meanings using
    context. But recent advancements in NLP, such as Flair''s contextual string embeddings
    used on downstream NLP tasks, bring machines one step closer. Take this statement,
    for example: *Amazon deforestation fuelled by greed.*


    The preceding news article title, to a human, clearly talks about the Amazon rainforest
    and how it''s being affected by deforestation. However, to a naive NLP trading
    bot, this can easily sound like an article that discusses the Amazon tech company.
    We can encounter the same type of problems when attempting to trade with companies
    named after real-world entities or objects, such as Apple, Tesla, Visa, and Shell.
    A good trading bot should therefore be able to use context to figure out the true
    meaning of a word in order to determine whether a news article talks about a certain
    company. Flair''s contextually aware NER tagger based around the contextual string
    embeddings will help us do just that.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Our Flair stock trading strategy follows this sequence of steps:


    +   1. Find news articles potentially containing useful information that will
    help us make trading decisions.

    +   2. Use Flair''s NER on news article titles to determine whether a news article
    talks about a company we are interested in.

    +   3. Perform sentiment analysis to determine the news article sentiment.

    +   4. If the result of sentiment analysis is positive, buy stock. If the result
    of sentiment analysis is negative, sell.

    +   5. Go back to *step 1*.


    The strategy can best be illustrated using a flowchart:


    ![](img/c56c48b8fd18a11ab705352d618ed976_179_0.png)


    Figure 10.1 – A Flair trading bot strategy flowchart'
  merge: -1
  img_proc: true
- pgno: 180
  md: "The preceding flowchart shows how simple our trading strategy is in principle.\
    \ And because we plan to implement it using Flair, it surely will be.\n\nLet's\
    \ learn how to implement this strategy as part of the upcoming section.\n\n# Implementing\
    \ the Flair trading bot\n\nThe trading strategy consists of three main logically\
    \ independent components:\n\n+   - News article acquisition component\n+   - NER\
    \ component\n+   - Sentiment analysis component\n\nThe first component, news acquisition,\
    \ is a very domain-specific piece of code. The data source used largely depends\
    \ on the types of companies we're interested in trading. There's no universal\
    \ source of news that will work well for all stock. Therefore, we plan to move\
    \ the news acquisition part out of our strategy and design it so that the news\
    \ text is merely provided as input to our bot.\n\nOur trading strategy components\
    \ will often access the same mutual variables such as the name of the company\
    \ we are interested in. Therefore, it makes sense to use an object-oriented design\
    \ and implement our strategy as part of a Python class. We will call our trading\
    \ strategy class FlairTrader. The class's constructor method will receive the\
    \ company name (the name of the company we want to trade) and will store it in\
    \ memory, along with a NER tagger object and a sentiment analysis classifier object\
    \ that will later be used by the named entity recognition and the sentiment analysis\
    \ components respectively:\n\n```\n```python\nfrom flair.data import Sentence\n\
    from flair.models import SequenceTagger\nfrom flair.models import TextClassifier\n\
    \nclass FlairTrader:\n    def __init__(self, company_name):\n        self.company_name\
    \ = company_name\n        self.tagger = SequenceTagger.load('ner')\n        self.classifier\
    \ = TextClassifier.load('en-sentiment')\n```\n```\n\nIn the preceding code snippet,\
    \ we simply define the FlairTrader class and its constructor (a type of method\
    \ that gets called when a class is instantiated) __init__. We then set three class\
    \ properties – the company name variable called company_name, Flair's default\
    \ English NER tagger object called tagger, and Flair's English sentiment analysis\
    \ classifier object called classifier."
  merge: -1
  img_proc: true
- pgno: 181
  md: "Flair currently supports only English sentiment analysis models. For languages\
    \ other than English, you'll need to use other NLP libraries such as Hugging Face\
    \ that offer a wider support of languages. Flair does, however, support a variety\
    \ of NER taggers for a number of languages. For example, you can replace ner with\
    \ fr-ner in the preceding code snippet to use French NER tagging instead.\n\n\
    It's now time to implement the named entity recognition component. Its only purpose\
    \ is, given some input text, to determine whether the text relates to the company\
    \ we want to invest in or not. It will achieve this goal by looking for a named\
    \ entity tag called ORG, which indicates that the context in which our company\
    \ name was used refers to an organization – meaning our actual company. In the\
    \ opposite scenario, for example, when Amazon refers to the Amazon rainforest\
    \ as opposed to the company, the tag will be LOC – meaning location:\n\n```\n\
    ```python\ndef _references_company(self, text):\n    sentence = Sentence(text)\n\
    \    self.tagger.predict(sentence)\n\n    for entity in sentence.get_spans('ner'):\n\
    \        if (entity.get_label('ner').value == \"ORG\" and\n            entity.text\
    \ == self.company_name):\n            return True\n\n    return False\n```\n```\n\
    \nThe preceding code snippet takes the news article title or text as input and\
    \ tags it using Flair's default English NER tagger. It then looks for tokens matching\
    \ our company_name and checks whether any tokens are tagged with ORG. If yes,\
    \ the method returns True, meaning the text indeed references our company. If\
    \ not, the method returns False.\n\nNote that the method name is prepended with\
    \ __. This is often used for private class methods in Python that are only used\
    \ by other methods of the same class, while the method isn't intended to be called\
    \ directly from outside the class.\n\n> **Important Note**\n> The preceding code\
    \ snippet is a class method, meaning that the code should not be a standalone\
