- pgno: 94
  md: '# Monitoring loss


    The first and most important thing you should look out for during training is
    whether the model is learning in an expected way. This is done by monitoring training
    output metrics such as loss. A typical training session follows the following
    pattern. In the initial stage of training, our weights are randomized, and loss
    will be huge (remember how bad our model with random weights was?). Then, even
    after one or two epochs, we will see a significant improvement in loss and model
    performance. Finally, as we progress towards two- or three-digit epoch numbers,
    the improvement will get smaller and smaller. Ideally, the loss should start to
    plateau and converge towards a certain value. That way, assuming we didn''t hit
    a local minimum, we can be confident that, given the parameters we chose, the
    model trainer did a good job. If we fail to see a convergence toward a certain
    value before training finishes, this may mean we finished training too soon and
    may need to run it for a couple more epochs.


    These training debug values such as loss will be printed out during training.
    But these values, shown as raw numbers, are sometimes very hard to make sense
    of. Just by looking at the numbers, it''s hard to see what the general trend is,
    whether the numbers are converging toward a certain value, or whether they are
    jumping all over the place. This is much easier to comprehend when metrics such
    as training loss are visualized.


    # Plotting training loss


    Flair offers a simple tool that allows us to visually inspect metrics such as
    training loss and accuracy and store the output as an image.


    Assuming we ran a training session from the same directory as our current Python
    session and used base_dir called tagger, we can plot the training loss by running
    the following:


    ```

    ```python

    from flair.visual.training_curves import Plotter

    plotter = Plotter()

    plotter.plot_training_curves(''tagger/loss.tsv'')

    ```

    ```


    This will store the plot as tagger/training.png and, if you are running this code
    snippet inside a Jupyter notebook, display the plot in the notebook itself.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Assessing and comparing performance metrics


    The final metric that will determine how good our tagger is, is the performance
    metric that evaluates our model on training data. In the case of PoS tagging,
    this will likely be the F1-score. But the value itself doesn''t tell us much.
    For example, in the preceding exercise, we achieved an F1-score of 0.88. If we
    used a representative dataset, this number on its own does should give us some
    general understanding of how well the model will perform in the real world, but
    it does little in helping assess whether our tagger is something we should be
    happy with or whether it is better than any other tagger out there.


    One of the most objective ways of assessing model performance is comparing it
    to the state-of-the-art results published as part of related studies or experiments.
    That way, if we achieved a larger F1-score, we can claim that (given the testing
    data that was used in evaluation) our model indeed achieves better performance.
    However, when comparing results across different studies or experiments, we need
    to be absolutely sure that the same train and test data were used in all experiments.
    Otherwise, we will essentially be comparing apples to oranges. For example, if
    one study used a dataset with very repetitive and simple language with a small
    vocabulary whereas the other one focused on some highly specialized and obscure
    uses of language with a rich vocabulary, it''s safe to assume that a tagger trained
    on the former type of dataset will achieve better results. It''s therefore vital
    to only compare the performance of taggers trained on same data.


    # Summary


    The code examples, explanations, and exercises that we covered in this chapter
    are a quick introduction to training sequence labeling models in Flair, and it
    should give you the confidence to prepare, train, validate, and use Flair models
    that solve real-world problems.


    Also, you should now be able to have the ability to tell whether model training
    was a success or whether it should be restarted with different parameters. We
    learned that there is a large number of parameters that govern sequence labeling
    model training as well as the training process. There''s the learning rate, the
    number of epochs, the optimizer type, the number of hidden RNN layers, and a long
    list of other parameters that will likely affect the performance of our model.
    In the preceding examples, we usually chose the default parameters that Flair
    happens to use in most of its code examples, but there''s no guarantee that the
    default parameters are the optimal parameters for our problem. In fact, it''s
    highly unlikely. This will leave you wondering which parameters you should really
    use.


    Luckily, Flair features a solution to this problem – a special technique that
    attempts model training with different combinations of parameters. It then measures
    performance on a special dataset called the development or validation dataset.
    This technique is called hyperparameter tuning. Let''s learn how to do it in Flair
    in the upcoming chapter.'
  merge: -1
  img_proc: true
