- pgno: 37
  md: "# Using the TokenizerWrapper class\n\nThe TokenizerWrapper class provides an\
    \ easy interface for building custom tokenizers. To build one, you simply need\
    \ to instantiate the class by passing the tokenizer_func parameter. The parameter\
    \ is a function that receives the entire sentence text as input and returns a\
    \ list of token strings.\n\nAs an exercise, let's try to implement a custom tokenizer\
    \ that splits the text into characters. This tokenizer will treat every character\
    \ as a token:\n\n```\n```python\nfrom flair.data import Token\nfrom flair.tokenization\
    \ import TokenizerWrapper\n\ndef char_splitter(sentence):\n    return list(sentence)\n\
    \nchar_tokenizer = TokenizerWrapper(char_splitter)\n```\n```\n\nIn the preceding\
    \ code, we implemented the space_splitter function, which simply splits the sentence\
    \ into a list of characters. Finally, we created the new tokenizer object by instantiating\
    \ the TokenizerWrapper class with our new function.\n\nNow, we can test our tokenizer\
    \ by using it with a Sentence object and printing out the generated tokens:\n\n\
    ```\n```python\nfrom flair.data import Sentence\n\ntext = \"Good day.\"\nsentence\
    \ = Sentence(text, use_tokenizer=char_tokenizer)\n\nfor token in sentence:\n \
    \   print(token)\n```\n```\n\nThe resulting script will print out the following:\n\
    \n```\n```text\nToken[0]: \"G\"\nToken[1]: \"o\"\nToken[2]: \"o\"\nToken[3]: \"\
    d\"\nToken[4]: \" \"\nToken[5]: \"d\"\n```\n```"
  merge: -1
  img_proc: true
