- pgno: 70
  md: '# Other tagging tasks in Flair


    While PoS and NER tagging are the two most commonly used sequence tagging tasks,
    Flair supports many others. This is possible in Flair because its sequence tagging
    architecture isn''t tailored to a specific sequence tagging task. It can work
    with any, as long as the training corpus and annotations are stored in a format
    compatible with Flair.


    Other sequence tagging tasks solved by Flair''s pre-trained models include chunking,
    semantic frame detection, and domain-specific taggers such as negation and speculation
    tagging in biomedical texts.


    Each sequence tagger mentioned in Flair''s official documentation is accompanied
    by an accuracy score. Depending on what sequence tagger you are interested in,
    the metrics used to compute it might be different. In order to fully understand
    what the scores mean, we need to understand the metrics used to compute them.
    We will be covering that in the following section.


    # Sequence labeling metrics


    When comparing one sequence tagger to another, we can''t simply try them out by
    hand and take a wild guess about which one performs better. Their performance
    needs to be evaluated using the same dataset and computed using the same predefined
    metric. The most common metrics used in sequence labeling are accuracy and F1
    score.


    # Measuring accuracy for sequence labeling tasks


    Accuracy is a measure ranging from 0 to 1 that simply computes the proportion
    of correctly tagged tokens.


    Assuming `correctly_tagged_tokens` is the number of correctly tagged tokens and
    `all_tokens` is the total number of all tokens, accuracy can be defined as:


    accuracy = correctly_tagged_tokens / all_tokens


    The preceding formula is simple and provides an easily interpretable result, but
    the metric can be misleading when dealing with imbalanced datasets (datasets where
    classes/tag names are not represented equally). This is particularly noticeable
    with NER where the majority of tokens belongs to a single class. For example,
    a NER tagger with 85% accuracy sounds like a pretty good tagger. But when we look
    at the distribution of tags in a NER dataset, we will notice most of the tokens
    are tagged with the O (other) tag representing non-named entities. Assuming there
    are 85% of non-named entities in our corpus, a model that tags all tokens with
    O will achieve 85% accuracy by default. To solve this problem, we can use an alternative
    metric called the macro F1 score.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Measuring the F1 score for sequence labeling tasks


    F1 score is the harmonic mean of two other metrics called *precision* and *recall*.
    It ranges from 0 (worst possible score) to 1 (best possible score).


    In sequence tagging, *precision* is defined as the percentage of named entities
    found by the learning system that are correct. It is defined as the following:


    $$precision = \frac{tp}{tp + fp}$$


    *Recall* is the percentage of named entities present in the corpus that are identified
    by the system. It is defined as:


    $$recall = \frac{tp}{tp + fn}$$


    The following apply:


    +   - **True positives** (*tp*): The number of tokens that are correctly labeled
    with a specific tag. For example, if a token is labeled as noun in the training
    data and our tagger labels it with the noun tag, this is considered a true positive.

    +   - **False positives** (*fp*): The number of tokens that were incorrectly labeled
    with a specific tag. For example, if a token is labeled as verb in the training
    data, but our tagger labels it with the noun tag.

    +   - **False negatives** (*fn*): The number of tokens that should have been labeled
    with a specific tag, but weren''t. For example, if a token is labeled as noun
    in the training data, but our tagger labels it with the verb tag.


    F1 score is then defined as the harmonic mean of precision and recall.


    $$F1 = 2 \cdot \frac{precision \cdot recall}{precision + recall}$$


    The process of working out the F1 score therefore involves the following:


    +   1. Counting true positives, false positives, and false negatives

    +   2. Getting *precision* and *recall* using the above formulae

    +   3. Computing the F1 score as the harmonic mean of *precision* and *recall*


    If we compute the F1 score for each tag (for example, for each named entity) separately,
    and then average all the F1 scores, we obtain the macro F1 score. This metric
    takes into account unequal representations of tags in the corpus.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'If we compute the F1 score for all the tags counting the total true positives,
    false negatives, and false positives together, we obtain the *micro F1 score*.
    This metric will have the same value for accuracy as single-label problems (for
    taggers where one token can have at most one tag assigned).


    Next time you assess reported sequence tagger results, be careful about whether
    the F1 score refers to the micro or the macro variant. The variant most often
    used in Flair''s results (when not explicitly specified) is the micro F1 score.


    # Summary


    With the knowledge gained in this chapter, we are not only able to use many of
    the pretrained sequence taggers available in Flair, but we are also capable of
    interpreting and understanding their output.


    In this chapter, we covered sequence tagging in Flair from different angles. We
    touched on the design and architecture of Flair''s proposed sequence taggers.
    We then covered NER motivation and theory, and what pretrained NER taggers can
    be found in Flair. We did the same with PoS tagging, where we covered the most
    notable tag sets, such as the Penn tag set and the universal PoS tag set, before
    covering the important pretrained PoS taggers found in Flair. We then finally
    studied the two metrics most often used to evaluate sequence taggers, and we emphasized
    the importance of distinguishing between micro and macro F1 scores.


    In the next chapter, we will be looking into using Flair to train, store, and
    reuse your own sequence labeling models.'
  merge: -1
