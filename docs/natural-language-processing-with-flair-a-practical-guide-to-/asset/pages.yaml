  md: "As part of this exercise, we will train Flair contextual word embeddings for\
    \ the world's smallest language – **Toki Pona.**\n\nToki Pona is a constructed\
    \ (made up) language known for its tiny vocabulary. The original version of the\
    \ language has only around 120 words. The language was created around the concept\
    \ of minimalism with the aim of simplifying thoughts and communication. It has\
    \ only has nine consonants and five vowels, and the pronunciation of Toki Pona\
    \ words is compatible with most world's languages.\n\nLet's now train a tiny Flair\
    \ embeddings model for Toki Pona.\n\n# Preparing the dictionary\n\nWhen training\
    \ classic word embeddings, the process of defining a complete dictionary for a\
    \ language can often be rigorous and exhausting. This isn't the case with Flair\
    \ embeddings.\n\nIt's because Flair embeddings model characters, not words. This\
    \ means that in order to define a dictionary, we don't need a complete list of\
    \ all possible words. We instead only need a list of all possible characters.\n\
    \nIn the Toki Pona language, only the following 14 characters are used: `ptksmnljwaeiou`.\
    \ These characters are a subset of the Latin character set. Flair's pre-compiled\
    \ Latin dictionary can simply be loaded by running the following:\n\n```\nfrom\
    \ flair.data import Dictionary\n\ndictionary = Dictionary.load('chars')\n```\n\
    \nBut, it's important to know that this character set contains many characters\
    \ that are never used in Toki Pona. This would mean that the language model would\
    \ need longer to train in order to learn that some of the characters defined in\
    \ the dictionary are meaningless.\n\nInstead, if we want to keep our dictionary\
    \ minimal and only include the letters that are used in our language, we can construct\
    \ our own Dictionary class manually by using the Dictionary.add_item(c) method:\n\
    \n```\nfrom flair.data import Dictionary\n\ndictionary = Dictionary()\ntoki_pona_symbols\
    \ = 'ptksmnljwaeiou'\ntoki_pona_symbols += toki_pona_symbols.upper()\n\nfor c\
    \ in toki_pona_symbols + '?. ':\n    dictionary.add_item(c)\n```"
