    # Working with parameters for training and evaluation


    Flair is arguably one of the simplest NLP frameworks out there. But to produce
    good performing taggers, we still need to have some level of understanding of
    the underlying concepts and parameters passed to Flair.


    First, let''s quickly explain what model training really is.


    # Understanding neural model training


    Neural networks are a special subset of machine learning. They are loosely based
    on biological neural networks such as the human brain. Neural nets generally comprise
    the network architecture and their weights and biases.


    The network architecture is all that defines the design of the network. It includes
    everything from the number of layers and the number of input and output nodes
    to the types of units used. These properties are referred to as hyperparameters.
    They remain unchanged for a single model training session.'
  merge: -1
  img_proc: true
- pgno: 80
  md: "Then, there are weights and biases – they are the final result of model training.\
    \ The process of model training is essentially a process of computing the optimal\
    \ weights. Training starts by first initializing all the weights and biases with\
    \ random values. We then repeat the following steps a number of times:\n\n+  \
    \ 1. The model is fed a batch of training data samples for which we can compute\
    \ output. In the case of sequence labeling models, the output is token labels.\n\
    +   2. The output (predicted labels) is then compared to the target values (actual\
    \ labels) and evaluated using the loss function also known as the `objective`\
    \ function. It tells us how close our predictions are to the ground truth.\n+\
    \   \n+   The goal of the model trainer is to find weights that result in the\
    \ smallest loss possible. A loss of zero would be an ideal loss. It would mean\
    \ all predictions align with the target values in the training data.\n+   3. Once\
    \ loss for a single batch of training is computed, the network tweaks the weights\
    \ in the hope of improving the model, using a technique called backpropagation.\n\
    +   4. We then feed the next batch of training data to the model and repeat the\
    \ process from *step 1* onwards, until we run out of all training data.\n\nThe\
    \ preceding sequence of steps in which all training data is consumed for training\
    \ is called an **epoch**. But because the changes applied to the model weights\
    \ are very small, one pass through the data usually isn't enough. We usually keep\
    \ repeating the training process for many more epochs until the loss function\
    \ converges and stops improving. The optimal number of epochs will largely depend\
    \ on the type and amount of data, the number of tags, and the hyperparameters\
    \ used. At the end of each epoch, we also evaluate the model on the test dataset\
    \ using a performance metric such as accuracy or the F1-score.\n\nWhen training\
    \ completes, the weights stored in memory are then usually written to a file so\
    \ that they can be loaded when we want to do inference on the model or simply\
    \ continue training.\n\nThe process described in this section may seem complex\
    \ and overwhelming. But luckily, all of it is implemented and automated as part\
    \ of the framework. So, not having a complete understanding of the underlying\
    \ logic behind neural network training is not a deal-breaker for anyone hoping\
    \ to build sequence taggers. What is important is understanding the purpose and\
    \ meaning of the parameters and values passed to the model training classes and\
    \ methods in Flair.\n\nLet's cover these parameters one by one."
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Parameters and terminology used in Flair model training


    Here are some common hyperparameters, parameters, and general machine learning
    concepts you will encounter as part of training models in Flair:


    +   - **Learning rate:** It is possibly the most important parameter in model
    training. It''s essential to get this value right. If the learning rate is set
    too low, the model will require a huge number of epochs, and the tiny increments
    will lead to a slow learning progress. A low learning rate, on the other hand,
    can cause our model to get stuck in a local minimum (a seemingly best solution
    that can likely be improved by exploring more options). If the learning rate is
    too high, it will cause the optimizer to adjust the weights too aggressively,
    causing the corrections to the weights to overshoot. It will cause the loss to
    fluctuate all over the place across different epochs and fail to converge to a
    minimum. Choosing the right learning rate is therefore essential.

    +   - **Mac epochs:** This is a setting that determines how many passes through
    the training data the trainer will make before finishing. This setting affects
    training time linearly. When set too high, training can take longer than we were
    prepared to wait for. When set too low, the trainer will finish before it had
    a chance to find the optimal weights.

    +   - **Loss:** This is a measure of how well our model is doing compared to the
    ground truth. The value is usually averaged across several samples. The goal of
    model training is to minimize loss. If the loss value is zero, it would mean that
    our model predicted all the tags correctly. Loss is often plotted on a graph to
    illustrate the progress and trend of learning. Seeing a decrease in loss value
    usually indicates that the model is learning, but it can also mean that it is
    merely overfitting our training data.

    +   - **Mini batch size:** When training models, we are unlikely to feed the entire
    training set to the model at once. Instead, we may, due to memory limitations,
    choose to split the training set into smaller batches. We can then feed each batch
    of data to the model individually. The size determining the number of learning
    samples in a single batch is called the **mini-batch size**.

    +   - **Patience:** This is the number of bad epochs (epochs without improvement
    to the objective function) to train before stopping.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   - **Hidden size:** In deep learning, this refers to the number of hidden
    layers or number of hidden **Recurrent Neural Network (RNN)** states. This setting
    is supplied as a parameter to the tagger classes as well as some embedding classes,
    such as **FlairEmbeddings**.

    +   - **Checkpoints:** These are temporary snapshots of the model usually done
    at the end of an epoch. Checkpoints can be useful if we think our training session
    may get interrupted, which will save us from having to start all over again. We
    can simply load the checkpoint at the beginning of the new training session and
    continue from where we left off before our session was interrupted.


    The terminology explained in the preceding list covers the concepts found throughout
    many machine learning frameworks, including Flair. Having a rough understanding
    of their role in model training means that you''re ready for the real thing. You
    are now ready to train sequence labeling models in Flair. Let''s dive right in.


    # Training custom sequence labeling models


    In this section, we will be looking at the process, syntax, objects, and methods
    involved in training custom sequence labeling models in Flair. If you read the
    previous sections of this chapter and understood the contents, you''re in luck.
    Once you understand the underlying concepts of neural networks, have a GPU-equipped
    rig running, and are familiar with the most common parameters, the actual training
    process is actually fairly straightforward.


    The process can be broken down into the following steps:


    +   1. Loading a tagged corpus

    +   2. Loading the tag dictionary

    +   3. Building the embedding stack

    +   4. Initializing the `SequenceTagger` object

    +   5. Training the model


    Each of these steps requires only a few lines of code. To best understand the
    code, let''s cover it as part of a practical example of training a PoS tagger.
    For example, let''s pretend there are no pre-trained English taggers in Flair
    and attempt to train a PoS tagger for English from scratch.


    We will be following an adapted version of Flair''s recommended training steps
    found in Flair''s GitHub repository documentation.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Loading a tagged corpus


    When attempting to load a tagged corpus in Flair, we need to do the following:


    +   1. We first need to verify whether such a corpus even exists and exactly how
    is it named. This information can be found in the official documentation on Flair''s
    GitHub page at https://github.com/flairNLP/flair/blob/master/resources/docs/TUTORIAL_6_CORPUS.md.


    For example, the default corpus for English is called UD_ENGLISH. It can be loaded
    with a single function call:


    ```

    from flair.data import Corpus

    from flair.datasets import UD_ENGLISH


    corpus = UD_ENGLISH()

    ```


    This will, if executed for the first time, download the model from internet storage,
    which may take a few minutes.


    The model will then be stored for future use, meaning that the next time you run
    the same command, it will load the model from disk and execute within seconds.


    +   2. Because our corpus contains a wide range of different tags and labels,
    we need to decide what the goal of our tagger will be so that we can filter out
    all irrelevant tags. We will do that by storing the type of tagger used into a
    variable. This variable will later be passed to different methods:


    ```

    tag_type = ''pos''

    ```


    The tag_type variable set to pos indicates we are dealing with PoS tagging.


    +   3. Finally, we need to decide whether we will be aiming for a state-of-the-art
    model or whether we simply want to give Flair a go in order to gain experience
    in training models without the expectation of good results. If you fall into the
    latter category, you can vastly reduce your training time by simply downsampling
    your dataset. We can, for example, reduce the dataset to 1% of its original size
    and reduce the training time from hours to minutes by running the following:


    ```

    import random


    random.seed(123)  # ensure we get same split every time

    corpus.downsample(0.01)

    ```'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'This will allow us to train the tagger even on a CPU. Note that in the preceding
    script, aside from downsampling the corpus, we also imported the random library
    and set a random generator seed. We downsampled our dataset so that we can go
    through this exercise quicker without having to wait for long periods of time
    for the models to train. When training neural models on small amounts of data,
    we don''t always get the expected results, and the training process can be unstable.
    This means that if you choose a slightly different subset of the dataset, the
    results may be entirely different. To counter this issue, we used the random.seed()
    method, which ensures that Flair''s randomized subset selection method behaves
    consistently every time.


    Our corpus is now ready. Let''s move on to the next data loading and preprocessing
    step.


    # Loading the tag dictionary


    A tag dictionary is simply a set of all possible tags. For PoS, this includes
    categories such as verbs, adjectives, nouns, and interjections. It also includes
    a few special tags, such as the unk tag, indicating unknown words that we can''t
    compute classic word embeddings for.


    A tag dictionary can be acquired by running the following code block:


    ```

    tag_dictionary = corpus.make_label_dictionary(tag_type)

    print(tag_dictionary)

    ```


    The preceding snippet will print out the following result:


    ```

    Dictionary with 50 tags: <unk>, O, DT, NN, VBZ, RB, NNP, CD, ., WP, PRP, JJ, '''',
    '''', IN, CC, NNS, ,, VBP, MD, VB, TO, POS, WRB, VBD, VBG, NNPS, VBN, HYPH, -LRB-

    ```


    The preceding output shows that we are dealing with 50 different PoS tags where
    a few (such as the unk tag) have special meaning and do not represent parts of
    speech.


    We can now move on to the next section, in which you will greatly benefit from
    the knowledge gained from Chapter 3, Embeddings in Flair.


    # Building the embedding stack


    The ability to build embedding stacks is one of the great features in Flair that
    often contributes to it achieving state-of-the-art results. A stack can be built
    by simply passing a list of Flair-supported embedding objects to a StackedEmbeddings
    class constructor.'
  merge: -1
  img_proc: true
- pgno: 85
  md: "In this example, we are going to build a stack of non-contextual English FastText\
    \ embeddings (the default embeddings when using language codes such as en), contextual\
    \ English forward Flair embeddings, and contextual English backward Flair embeddings.\
    \ This can be done by running the following code block:\n\n```\nfrom flair.embeddings\
    \ import (WordEmbeddings,\n                              StackedEmbeddings,\n\
    \                              FlairEmbeddings)\n\nembedding_types = [\n    WordEmbeddings('en'),\n\
    \    FlairEmbeddings('news-forward'),\n    FlairEmbeddings('news-backward'),\n\
    ]\n\nembeddings = StackedEmbeddings(embeddings=embedding_types)\n```\n\nFlair\
    \ will, just like when loading corpora, download the web-hosted embedding objects\
    \ and store them for future use. This step can take up to a few minutes.\n\nWe\
    \ can now move to the last two preparation steps before the actual training.\n\
    \n# Initializing the SequenceTagger object\n\nWe will use the same SequenceTagger\
    \ class that we previously used to load pre-trained models in Chapter 4, Sequence\
    \ Tagging, but this time, to define entirely new models. If you remember correctly,\
    \ we used a static call to SequenceTagger.load() to create tagger objects from\
    \ pre-trained models. Here, we will initialize the class directly by passing in\
    \ the properties that define our model. These properties define everything from\
    \ the architecture of the model, the types of recurrent units, and the number\
    \ of hidden RNN states to the set of possible tags predicted by the model.\n\n\
    The required parameters of the SequenceTagger class are as follows:\n\n+   - hidden_size:\
    \ This defines the number of hidden states in an RNN. A common number to start\
    \ with is 256, but the optimal value will completely depend on the problem you\
    \ are solving.\n+   - embeddings: The embeddings class needs to be an instance\
    \ of the TokenEmbeddings class. It can either be CharacterEmbeddings, FlairEmbeddings,\
    \ WordsEmbeddings, or the class we are using in our example – StackedEmbeddings."
  merge: -1
  img_proc: true
- pgno: 86
  md: "+   - `tag_dictionary`: The dictionary containing all the possible tags that\
    \ we generated in the previous section using the `corpus.make_label_dictionary()`\
    \ method.\n+   - `tag_type`: A string representing the type of tagger we are training.\
