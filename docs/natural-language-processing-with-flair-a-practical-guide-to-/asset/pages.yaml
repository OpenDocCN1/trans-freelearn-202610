    \ amazon as the name of the company we want to invest in. This is simply due to\
    \ the fact that Amazon can be confused with geographical places such as the Amazon\
    \ rainforest or the Amazon River. We can define the FlairTrader object by running\
    \ the following code:\n\n```\n```python\nft = FlairTrader(\"amazon\")\n```\n```\n\
    \n2. This now allows us to test the NER component out by running the following:\n\
    \n```\n```python\nprint(ft._references_company(\"amazon river is deadly\"))\n\
    ```\n```\n\nThe preceding code block prints out False. Rightfully so, it indicates\
    \ that the word amazon does not relate to the Amazon company in the given context.\
    \ Let's try another example:\n\n```\n```python\nprint(ft._references_company(\"\
    amazon is underpaying staff\"))\n```\n```\n\nThe preceding code block prints out\
    \ True. Flair correctly figured out that the previous sentence indeed relates\
    \ to Amazon the company. Let's try another:\n\n```\n```python\nprint(ft._references_company(\"\
    amazon deforestation is bad\"))\n```\n```\n\nThis preceding code block, as expected,\
    \ prints False.\n\nIn the preceding code, we can clearly see our named entity\
    \ recognition component is excellent in differentiating between text that references\
    \ the Amazon River or the Amazon rainforest as opposed to text that discusses\
    \ the Amazon tech company.\n\n3. We can now implement the sentiment analysis component,\
    \ responsible for doing, as the name suggests, sentiment analysis and making calls\
    \ about whether we should buy, sell, or hold. The method will be optimized so\
    \ that it will only perform sentiment analysis if we think the input text is relevant\
    \ to the company we want to trade with. If not, it will return hold (meaning we\
    \ neither buy nor sell stock):\n\n```\n```python\ndef buy_or_sell(self, text):\n\
    \    if self._references_company(text):\n        sentence = Sentence(text)\n \
    \       self.classifier.predict(sentence)\n```\n```"
