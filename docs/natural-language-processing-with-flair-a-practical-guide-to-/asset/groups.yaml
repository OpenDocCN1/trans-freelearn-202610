    Conversely, a managed or fully managed service is a commercial solution that provides
    support for most of these tasks. Fully managed machine learning services provide
    out-of-the-box support for the following:


    - *A managed infrastructure:* When deploying NLP services, the final model will
    likely live on a particular machine somewhere in a data center. In order for our
    users to use our service, they will need to have means of reaching this machine
    through a domain name or an IP address. To set up a self-serve NLP service, infrastructure
    needs to be put in place to make sure that the right requests hit the right server
    so that it can return the results to the user. All these decisions are taken care
    of for us as part of a managed service.

    - *Managed endpoints:* A machine learning model, from an engineering perspective,
    is a binary file that can be loaded into memory and, through a machine learning
    library, perform inference. However, given that we are using a server-side inference
    approach, it means that if a user needs some predictions from an NLP model, they
    will need to send a request over the internet. This request will need to reach
    the service, which will need to interpret the request and respond appropriately
    with results. Therefore, there needs to be a means of communication agreed by
    the client and the service. A popular solution to this is using a communication
    protocol called **REST**, which allows communication through a **REST API** that
    utilizes the **HTTP** or **HTTPS** protocol. But the machine learning endpoints
    are not just responsible for client-server communication, parsing requests, performing
    inference, and returning the results to the user. They have a number of other
    responsibilities. They need to return appropriate error messages if something
    goes wrong (for example, if the input text exceeded the length limit). They need
