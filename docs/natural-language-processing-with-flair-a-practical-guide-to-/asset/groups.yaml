    # Contributors


    # About the author


    Tadej Magajna is a former lead machine learning engineer, former data scientist,
    and now a software engineer at Microsoft. He currently works in a team responsible
    for language model training and building language packs for keyboards such as
    Microsoft SwiftKey. He has a master''s degree in computer science. He started
    his career as a 15-year-old at a local media company as a web developer and progressed
    toward more complex problems. He has tackled problems such as NLP market research,
    public transport bus and train capacity forecasting, and finally, language model
    training in his current role. Currently, he is based in his hometown of Ljubljana,
    Slovenia.'
  - '[PAGE 5]


    # About the reviewers


    After studying engineering and physics, **Pascal Tartarin** held various senior
    management positions (sales, marketing, and R&D) mainly in the chemical and medical
    device industries in Europe and Asia Pacific. A keen lifelong learner, he later
    developed his expertise in data science and NLP. Over the last 6 years, he has
    built applications in the field of business (forecasts, CRM) based on ML, deep
    learning, NLP, and more recently, knowledge graphs (Neo4j).


    **Amardeep Kumar** has sound experience in Natural Language Processing and machine
    learning systems. He has industry experience of 2 years working on different technical
    stacks in NLP and software development. Amardeep regularly contributes to open
    source software development as a developer, mentor, and reviewer in Google Summer
    of Code programs. He has published research papers for top-tier NLP-proc conferences,
    such as ACL and EMNLP.'
