    sentence = Sentence(''A short sentence'')

    sentence.get_token(1).add_label(''manual-pos'', ''DT'')


    print(sentence)

    ```


    任何命令行输入或输出均如下所示：


    ```

    $ python3 --version

    $ pip3 install flair==0.11

    ```


    **关键字**：表示一个新术语、一个重要的名称或一个非常重要的概念；例如，**Hugging Face** 转换器模型。

