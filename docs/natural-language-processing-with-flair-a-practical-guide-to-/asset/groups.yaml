    Since deploying NLP models in production is more of a software engineering feat
    than an NLP challenge, general software engineering rules apply – the main one
    being, *don''t reinvent the wheel.*


    While implementing your own NLP model-serving frameworks is entirely possible,
    doing so will require a significant amount of time. Chances are that even if you
    put your best efforts into implementing a solution, you won''t be able to build
    a product better than the open source solutions out there built by hundreds of
    different contributors.


    There is a wide range of tools and packages out there for self-serving NLP models,
    but one specific package stands out due to its support for **PyTorch** packages
    (Flair is built on top of PyTorch) and its support for Hugging Face models. The
    package is called **TorchServe.**


    # TorchServe for self-serving Flair models


    PyTorch is a popular open source ML framework. Flair, an NLP framework on its
    own, is built on top of PyTorch and utilizes its tools for designing, training,
    and storing neural models.


    Because Flair models are essentially PyTorch models, a tool such as TorchServe
    seems like a perfect fit. Let''s see how TorchServe works by having a look at
    its design chart:


    ![](img/c56c48b8fd18a11ab705352d618ed976_163_0.png)


    Single physical or virtual machine


    Figure 9.2 – TorchServe design'
  - '[PAGE 164]


    The preceding design schematic shows various parts of the TorchServe framework
    as described in their official documentation at https://github.com/pytorch/serve.


    Let''s take a look at the main components:


    +   - **Frontend:** The component responsible for handling requests. It receives
    the user''s request as input, parses it, and passes it on to the backend that
    returns the model output, which is then processed, formatted, and sent back to
    the user.

    +   - **Inference endpoint:** A specific part of the frontend, reachable at a
    certain address, and responsible for handling requests and returning results.

    +   - **Inference API:** An API that allows and defines communication between
    the client and the frontend.

    +   - **Model store:** A directory that contains the models.

    +   - **Backend:** A threaded component that contains model handlers responsible
    for performing inference.

    +   - **Management API:** A special API, dedicated to the owners of the application,
    allowing us to configure the service.


    The flow of events of a single use of a TorchServe service is as follows. A client
    first sends a request to the frontend using the inference API. The request contains
    a payload containing the input that will be provided to the NLP model. If the
    framework is too busy to process the request, the request is batched (queued).
    If not, it is passed to the endpoint, where it is parsed, and the payload is passed
    on to a model handler. A model handler performs inference on the loaded NLP model
    and returns the output to the endpoint. The endpoint prepares and formats the
    output (typically, using the JSON format) and returns it to the user.


    The preceding TorchServe design run-through provides a very high-level overview
    of how it works and how it is used to serve NLP models. The setup and installation
    process of TorchServe can be very platform-specific and not something that can
    easily be covered in a few lines of code. The entire process of setting up TorchServe
    is described brilliantly as part of their official documentation on GitHub.


    But don''t let the fact that this book won''t be covering TorchServe in great
    depths get you down. As part of the upcoming section, we''ll implement our very
    own proof-of-concept tool for serving Flair models.


    # A proof-of-concept self-serve tool for Flair


    Implementing a reliable, scalable, safe, and production-grade NLP self-serving
    tool is a complex process that requires weeks, if not months, of careful thought
    and preparation. In most cases, instead of implementing the solution yourself,
    you''ll be better off using an already available open source tool such as TorchServe.'
