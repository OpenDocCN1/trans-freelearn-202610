    ## Flair 模型训练中使用的参数和术语


    以下是你在 Flair 中训练模型时将会遇到的一些常见超参数、参数和通用机器学习概念：


    - **Learning rate:** 它可能是模型训练中最重要的参数。正确设置该值至关重要。如果学习率设置过低，模型将需要大量的 epoch，且微小的增量会导致学习进展缓慢。另一方面，较低的学习率可能导致我们的模型陷入局部最小值（一个看似最佳的解，但通过探索更多选项可能得到改进）。如果学习率过高，它会使优化器过于激进地调整权重，导致权重修正出现超调。它会使损失在不同
    epoch 间大幅波动，无法收敛到最小值。因此，选择合适的学习率至关重要。

    - **Max epochs:** 这是一个设置，用于确定训练器在完成前对训练数据进行多少次遍历。该设置线性影响训练时间。当设置过高时，训练可能需要比我们准备等待的时间更长。当设置过低时，训练器会在找到最优权重之前就结束。

    - **Loss:** 这是衡量我们的模型与真实标签相比表现如何的指标。该值通常在多个样本上取平均。模型训练的目标是最小化损失。如果损失值为零，则意味着我们的模型预测了所有标签都正确。损失通常绘制在图表上以说明学习进度和趋势。看到损失值下降通常表示模型正在学习，但也可能意味着它只是过拟合了训练数据。

    - **Mini batch size:** 在训练模型时，我们不太可能一次性将整个训练集喂给模型。相反，由于内存限制，我们可能会选择将训练集拆分为更小的批次。然后我们可以将每个批次的数据单独喂给模型。决定单个批次中学习样本数量的大小称为
    **mini-batch size**。

    - **Patience:** 这是在停止之前要训练的坏 epoch 数（目标函数无改善的 epoch）。

    - **Hidden size:** 在深度学习中，这指的是隐藏层的数量或隐藏 **Recurrent Neural Network (RNN)** 状态的数量。该设置作为参数提供给
    tagger 类以及一些嵌入类，例如 **FlairEmbeddings**。

    - **Checkpoints:** 这些是通常在每个 epoch 结束时完成的模型临时快照。如果我们认为训练会话可能会被中断，检查点会很有用，这样可以避免我们不得不从头开始。我们只需在新的训练会话开始时加载检查点，即可从会话中断前的断点继续。


    前述列表中解释的术语涵盖了包括 Flair 在内的许多机器学习框架中出现的概念。对它们在模型训练中的作用有一个大致的了解意味着你已准备好进行实际操作。你现在已准备好在
    Flair 中训练序列标注模型。让我们直接开始吧。


    ## 训练自定义序列标注模型


    在本节中，我们将研究在 Flair 中训练自定义序列标注模型所涉及的过程、语法、对象和方法。如果你阅读了本章的前几节并理解了内容，你很幸运。一旦你理解了神经网络的底层概念，拥有一个配备
    GPU 的设备，并且熟悉最常见的参数，实际的训练过程其实相当直接。


    该过程可以分解为以下步骤：


    - 1. Loading a tagged corpus

    - 2. Loading the tag dictionary

    - 3. Building the embedding stack

    - 4. Initializing the `SequenceTagger` object

    - 5. Training the model


    这些步骤每一步只需要几行代码。为了更好地理解代码，让我们将其作为训练词性标注器的实际示例的一部分来讲解。例如，让我们假装 Flair 中没有预训练的英语标注器，并尝试从头开始训练英语词性标注器。


    我们将遵循 Flair GitHub 仓库文档中提供的 Flair 推荐训练步骤的改编版本。


    ### Loading a tagged corpus


    尝试在 Flair 中加载标注语料库时，我们需要执行以下操作：


    - 1. 我们首先需要验证这样的语料库是否存在以及它具体叫什么名字。这些信息可以在 Flair 的 GitHub 页面上的官方文档中找到，网址为 https://github.com/flairNLP/flair/blob/master/resources/docs/TUTORIAL_6_CORPUS.md。


    例如，英语的默认语料库称为 UD_ENGLISH。它可以用一个函数调用加载：


    ```

    from flair.data import Corpus

    from flair.datasets import UD_ENGLISH


    corpus = UD_ENGLISH()

    ```


    如果首次执行，这将从互联网存储中下载模型，可能需要几分钟。


    模型随后将被存储以供将来使用，这意味着下次你运行同一命令时，它将从磁盘加载模型并在几秒内执行。


    - 2. 由于我们的语料库包含各种不同的标签和标注，我们需要决定标注器的目标，以便过滤掉所有无关的标签。我们将通过将使用的标注器类型存储到一个变量中来实现这一点。该变量稍后将被传递给不同的方法：


    ```

    tag_type = ''pos''

    ```


    tag_type 变量设置为 pos 表示我们正在处理词性标注。


    - 3. 最后，我们需要决定是追求最先进的模型，还是仅仅想尝试 Flair 以获得训练模型的经验，而不期望得到好的结果。如果你属于后者类别，只需对数据集进行下采样即可大幅减少训练时间。例如，我们可以将数据集减少到其原始大小的
    1%，并通过运行以下命令将训练时间从数小时减少到数分钟：


    ```

    import random


    random.seed(123)  # ensure we get same split every time

    corpus.downsample(0.01)

    ```


    这将使我们即使在 CPU 上也能训练标注器。请注意，在前面的脚本中，除了对语料库进行下采样外，我们还导入了 random 库并设置了随机生成器种子。我们对数据集进行下采样，以便更快地完成此练习，而不必等待模型训练很长时间。当在少量数据上训练神经模型时，我们并不总是能得到预期结果，训练过程可能不稳定。这意味着如果你选择数据集的略有不同的子集，结果可能完全不同。为了解决这个问题，我们使用了
    random.seed() 方法，这确保了 Flair 的随机子集选择方法每次都表现一致。


    我们的语料库现在已准备就绪。让我们继续下一个数据加载和预处理步骤。


    ### Loading the tag dictionary


    标签词典只是一个所有可能标签的集合。对于词性，这包括动词、形容词、名词和感叹词等类别。它还包括一些特殊标签，例如 unk 标签，表示我们无法为其计算经典词嵌入的未知词。


    可以通过运行以下代码块获取标签词典：


    ```

    tag_dictionary = corpus.make_label_dictionary(tag_type)

    print(tag_dictionary)

    ```


    前面的代码段将打印出以下结果：


    ```

    Dictionary with 50 tags: <unk>, O, DT, NN, VBZ, RB, NNP, CD, ., WP, PRP, JJ, '''',
    '''', IN, CC, NNS, ,, VBP, MD, VB, TO, POS, WRB, VBD, VBG, NNPS, VBN, HYPH, -LRB-

    ```


    前面的输出显示我们处理的是 50 个不同的词性标签，其中一些（例如 unk 标签）具有特殊含义，并不代表词性。


    我们现在可以进入下一节，在那里你将从第 3 章《Flair 中的嵌入》中获得的知识会大有裨益。


    ### Building the embedding stack


    构建嵌入堆栈的能力是 Flair 的一大特色，通常有助于其取得最先进的结果。堆栈可以通过简单地将 Flair 支持的嵌入对象列表传递给 StackedEmbeddings
    类构造函数来构建。

