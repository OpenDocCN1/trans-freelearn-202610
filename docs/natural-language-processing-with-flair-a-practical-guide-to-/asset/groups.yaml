    没有什么能阻止我们把一些代码组合起来并在现实世界中部署一个 NLP 模型……好吧，除了我们不太确定如何将这些模型作为生产级服务的一部分进行部署、托管或维护之外。我们将在下一章学习关于这方面的内容。


    ## 第 3 部分：使用 Flair 进行实际应用


    在本部分中，您将学习如何在生产环境中部署和使用 Flair 模型。您将通过一系列实践练习，使用本书中获得的所有知识来解决现实世界的问题。


    本部分包含以下章节：


    - 第 9 章，在生产环境中部署和使用模型

    - 第 10 章，动手练习 – 使用 Flair 构建交易机器人


    ## 9 在生产环境中部署和使用模型


    当 **自然语言处理** (**NLP**) 研究人员和科学家致力于改进某个 NLP 模型时，他们通常会花费大量时间来改进模型某个非常具体的部分或方面。工作完成后，结果会被收集并作为学术论文的一部分发表。然而，如果你计划将
    NLP 用于实际目的，无论是作为商业解决方案还是作为个人项目的一部分，经过良好训练的模型通常只是你旅程的开始。


    在本章的第一部分，我们计划介绍在使用 NLP 模型进行生产时通常遇到的典型问题，如何克服这些问题，以及如何使我们的模型公开可用。然后我们将通过构建自托管 NLP
    解决方案从底层解决这个问题。我们将讨论可用于自托管的工具和库，以及你应该或不应该选择自托管的原因。最后，我们将介绍各种托管的 NLP 机器学习即服务解决方案，以及如何以及何时使用它们。我们将以一个动手练习作为总结，在该练习中我们使用
    **Hugging Face 加速推理 API** 将 Flair 模型部署到生产环境。


    在本章中，我们将讨论如何解决这些问题并轻松地将自己的 Flair 模型部署到生产环境，具体内容如下：


    - 生产环境中 NLP 模型的技術考量

    - 自托管 Flair 模型

    - 使用托管服务部署和使用 Flair 模型


    ### 技术要求


    运行本章代码，您需要使用 Flair 版本 0.11 的常规本地 Python 环境。您还需要一个额外的 Python 库，名为 Flask 版本 2.0.3。本章涵盖的代码示例可在本书官方
    GitHub 仓库的以下 Jupyter 笔记本中找到：https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter09。


    ### 生产环境中 NLP 模型的技術考量


    部署机器学习（尤其是 NLP）模型与部署其他软件解决方案的不同之处在于一个关键领域——运行服务所需的资源。从理论上讲，为简单的移动或 Web 应用托管通用服务，可以由任何现代设备（如
    PC 或手机）完成。只有当你开始扩展服务以满足更多受众时，才需要投入额外的思考、努力和资源来使其更具可扩展性。在提供机器学习模型服务时，事情往往从一开始就变得复杂。我们处理的模型非常庞大，以至于典型的
    Web 服务器有时甚至无法将模型加载到内存中。每个请求都会消耗大量资源，但我们需要在按需、实时并面向大量受众的情况下提供请求。但该怎么做呢？


    将本章主题与本书迄今为止所涵盖的内容进行比较时，您会注意到将模型部署到生产环境是一个全新的问题，需要略微不同的技能集。我们在前几章中所做的工作专注于数据的理解和处理，以及利用不同的机器学习和自然语言处理技术来实现特定目标。这些知识现在相关性较低。我们现在关心的是以能够尽可能快地、尽可能可靠地、尽可能少地使用资源的方式部署和维护
    NLP 服务。简单，对吧？


    实现这一目标所需的技能集通常与设计和训练 NLP 模型所需的技能集如此不同，以至于通常会交给完全不同的人——软件或 MLOps（机器学习、DevOps 和数据工程相结合的领域）工程师。Packt
    出版了一本名为 Engineering MLOps 的优秀书籍，您可以在其中了解更多关于这个有趣的工程领域的信息。但虽然将 ML 模型部署到生产环境需要非常特定的技能集，但它本身并不是一个不可能的过程，任何遵循这些步骤的人都可以做到。


    在做出有关部署 NLP 模型的任何决定之前，您需要先问自己以下问题：


    - 推理（生成预测的过程）将在客户端还是服务端进行？

    - 服务需要可扩展吗？

    - 你是想通过这项工作来学习，还是仅仅实现一个目标？

    - 你的模型能否部署在托管服务上？


    所有这些决定在确定 NLP 模型部署的位置和方式方面都起着重要作用。让我们详细研究每个要点。


    ### 客户端与服务端推理


    可能与部署 NLP 模型相关最重要的、同时也是最容易回答的问题是，它们是存储在客户端机器上并在本地执行推理，还是模型存储在服务器或托管云服务上并远程执行推理。


    当机器学习推理在客户端机器（如手机、笔记本电脑、PC 或电子书阅读器）上本地执行时，我们称之为客户端推理。


    当机器学习推理在服务器或托管云服务上远程执行时，我们称之为服务端推理。


    这两种方法各有利弊，选择哪一种几乎总是取决于你试图用 NLP 模型解决的问题，因为此时你已经知道模型解决的是什么 NLP 问题；这意味着该决策通常非常直接。


    因为机器学习模型通常很大且需要大量资源，ML 社区中普遍存在一种误解，即所有机器学习推理都需要在大型的 GPU 配备机器上在服务端完成。


    毫无疑问，鉴于 Transformer 和其他 NLP 模型规模的近期增长，使用机器学习模型本地化的时代已经结束？我的手机或笔记本电脑永远无法处理生产级的机器学习模型，对吧？


    尽管前一句听起来很合理，但它无可否认且完全是错误的。如果你正在使用电子设备阅读本书，那么你使用的机器很可能装满了机器学习模型。


    现代电子设备使用本地存储的机器学习模型来解决多种不同的任务：


    - *手机、笔记本电脑和 PC 上的面部识别*：现代电子设备使用针对低性能设备优化的计算机视觉模型来即时执行面部识别，无需网络连接。如果只有在互联网连接正常时才能解锁手机或笔记本电脑，那将是相当不幸的。

    - *手机上的指纹识别*：指纹识别是另一种强调速度的解锁设备方法。用户期望指纹在毫秒内被识别。除了速度之外，存储指纹识别模型在本地的另一个主要原因是隐私。大多数用户如果意识到他们的指纹数据被传输到位于地球另一端的大型科技公司拥有的服务器上，即使公司的意图完全无害，也会感到震惊。低延迟和隐私对于指纹识别至关重要，这就是为什么制造商几乎总是选择客户端推理。

    - *虚拟键盘的输入预测*：低延迟和隐私超过预测质量的另一个领域是虚拟键盘。软件键盘会下载并本地存储输入预测模型，这使用户即使在地下火车等离线环境中也能利用输入预测。

    - *自动驾驶汽车*：自动驾驶汽车使用多种机器学习模型，使其能够对车辆导航做出决策。

    - *手机上的 AI 相机应用*：现代手机相机应用利用专门的机器学习算法，根据环境选择正确的相机设置，然后使用基于机器学习的图像处理软件对图像进行后处理。模型需要快速、响应迅速且始终可用——这非常适合本地推理。

