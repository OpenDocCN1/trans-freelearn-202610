- raw:
  - '[PAGE 172]


    A Hugging Face model repository is a store of all binary files, documentation,
    metadata, license files, and any other files relating to a certain model. It uses
    **Git** and **Git Large File Storage (LFS)** to store the files. You can use it
    just like using any other Git software repository.


    We''ll create a new model repository and give it a random name, `flairmodel`.
    The user interface shows the model will be available via the `<username>/<reponame>`
    format, which in our case is `flairbook/flairmodel`.


    Make sure to mark the model as public.


    # Uploading the relevant model files


    After creating the repository, we will be redirected to the model home page. From
    the home page, we have the option to clone the repository to our local filesystem
    or to edit and upload the repository files through the web user interface. As
    part of this exercise, we''ll be using the browser interface to upload files.
    But keep in mind that for a large model, using Git is highly recommended. We''ll
    need to upload two files:


    +   - The model binary named `pytorch_model.bin`

    +   - The model card named `README.md`


    The model binary is our trained model and is stored at `tiny_model/pytorch_model.bin`.
    We will need to upload this file to the `root` of our Hugging Face repository.
    Using the web interface, this can be done by clicking the **Files and versions**
    tab and then clicking **Add file > upload file** to navigate to a form, where
    you can drag and drop the model binary. After dragging and dropping the file,
    click **Commit changes**, which will do the same as adding and pushing this file
    through Git.


