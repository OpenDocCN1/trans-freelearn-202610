    ## Working with parameters for training and evaluation


    Flair is arguably one of the simplest NLP frameworks out there. But to produce
    good performing taggers, we still need to have some level of understanding of
    the underlying concepts and parameters passed to Flair.


    First, let''s quickly explain what model training really is.


    ## Understanding neural model training


    Neural networks are a special subset of machine learning. They are loosely based
    on biological neural networks such as the human brain. Neural nets generally comprise
    the network architecture and their weights and biases.


    The network architecture is all that defines the design of the network. It includes
    everything from the number of layers and the number of input and output nodes
    to the types of units used. These properties are referred to as hyperparameters.
    They remain unchanged for a single model training session.


    Then, there are weights and biases – they are the final result of model training.
    The process of model training is essentially a process of computing the optimal
    weights. Training starts by first initializing all the weights and biases with
    random values. We then repeat the following steps a number of times:


    - 1. The model is fed a batch of training data samples for which we can compute
    output. In the case of sequence labeling models, the output is token labels.

    - 2. The output (predicted labels) is then compared to the target values (actual
    labels) and evaluated using the loss function also known as the `objective` function.
    It tells us how close our predictions are to the ground truth.


    The goal of the model trainer is to find weights that result in the smallest loss
    possible. A loss of zero would be an ideal loss. It would mean all predictions
    align with the target values in the training data.

    - 3. Once loss for a single batch of training is computed, the network tweaks
    the weights in the hope of improving the model, using a technique called backpropagation.

    - 4. We then feed the next batch of training data to the model and repeat the
    process from *step 1* onwards, until we run out of all training data.


    The preceding sequence of steps in which all training data is consumed for training
    is called an **epoch**. But because the changes applied to the model weights are
    very small, one pass through the data usually isn''t enough. We usually keep repeating
    the training process for many more epochs until the loss function converges and
    stops improving. The optimal number of epochs will largely depend on the type
    and amount of data, the number of tags, and the hyperparameters used. At the end
    of each epoch, we also evaluate the model on the test dataset using a performance
    metric such as accuracy or the F1-score.


    When training completes, the weights stored in memory are then usually written
    to a file so that they can be loaded when we want to do inference on the model
    or simply continue training.


    The process described in this section may seem complex and overwhelming. But luckily,
    all of it is implemented and automated as part of the framework. So, not having
    a complete understanding of the underlying logic behind neural network training
    is not a deal-breaker for anyone hoping to build sequence taggers. What is important
    is understanding the purpose and meaning of the parameters and values passed to
    the model training classes and methods in Flair.


    Let''s cover these parameters one by one.

