  - '[PAGE 155]


    The list goes on, and it clearly shows that there currently is a demand for specialized
    low-resource machine learning models designed for local inference. It''s entirely
    possible the trends may lean more towards the server side in the future, but it''s
    unlikely local models will disappear completely. This is simply due to the physical
    laws that govern the theoretically minimal signal latency. For example, even in
    the theoretically best possible scenario where we develop a server-side machine
    learning service that brings inference time close to zero and build a network
    infrastructure that sends signals at the speed of light in a vacuum, the amount
    of time needed to send an inference request from a device in Paris to a server
    in New York and back will still take 54 milliseconds (the amount of time light
    travels from Paris to New York and back in a vacuum). So even the theoretically
    best possible scenario for server-side inference is still too slow for some applications
    such as self-driving cars.


    Both server-side inference and client-side inference clearly come with a set of
    advantages and drawbacks, and before making a rushed decision, it''s important
    to consider the pros and cons.


    *The advantages of using local inference:*


    +   - *Privacy:* To an average engineer who understands how safe network protocols
    and communication can be, the thought of a photo of their face or a scan of their
    fingerprint being transmitted over the internet isn''t off-putting or scary. However,
    for the non-tech-savvy, this spells disaster. When the news of highly personal
    or biometric data being streamed over the internet draws media attention, the
    impact for the company will be significant. It doesn''t matter whether the company
    developed the safest possible algorithm, one that could even be safer than local
    inference; the media and people appalled by this fact won''t care, and the damage
    will be done. When dealing with personal and biometric data, it''s therefore important
    to take into careful consideration how and where this data is going to be transmitted
    and stored. A good way to avoid this problem altogether is to not transmit the
    data at all and use local inference instead.

    +   - *No network latency:* Powerful servers and supercomputers have the potential
    to do inference quicker than an average mobile phone, but if we decide to go down
    the remote inference route, our requests and results will need to travel over
    the internet, incurring network latency. We can completely eliminate network latency
    by not doing network communication at all – with local inference.

    +   - *Maintenance:* Optimizing a model for low-resource devices is hard. But
    once you get it right, and build a model that works on all different types of
    devices and deploy it successfully, your job is done. With local inference, there''s
    no service to take care of or network spikes to monitor – just sit back and relax.'
  - '[PAGE 156]


    +   - *Cost saving:* As harsh as it sounds, it''s true. When a company does client-side
    inference instead of server-side inference, it means that all the computations
    required to generate results as part of the machine learning models will be done
    on customers'' devices. These computations will use electricity. And the electricity
    is paid for by... the customer.

    +   - *Scaling by design:* When we go from 1 user to 10 users with server-side
    inference, the amount of compute power required will increase tenfold. With local
    inference, it''s different. Inference is distributed by default. We have a dedicated
    machine learning inference machine for each user – their own device. It doesn''t
    matter whether a single user does inference on their machine or whether it''s
    a billion users. This leads us to an interesting conclusion – *local inference
    delivers scaling by design.*


    *The disadvantages of using local inference:*


    +   - *Catering to resource and performance constraints:* The model you plan to
    deploy will likely need to work on a number of different devices with varying
    compute capabilities. Should you deploy a very simple dumbed-down model that''ll
    work on all devices but won''t deliver great performance? Should you deploy models
    on high-end devices only and simply tell the low-end device users they can''t
    use the feature? Or should you build different models for each device type – some
    models for low-end devices and some for high-end devices? These are all questions
    you''ll need to answer if you go down the local inference route, and the answers
    will depend on business needs and requirements.

    +   - *Compromised prediction quality due to size and resource constraints:* Local
    inference models need to be small. They need to fit on a device such as a mobile
    phone and be stored in its very-limited memory. This means that the model will
    be hugely limited in terms of the number of parameters. To optimize a model for
    local inference, you may need to reduce it in size significantly. This undoubtedly
    results in a huge hit for prediction quality.

    +   - *Versioning hell for model updates:* If you host a model on a remote service,
    to update a model with a newer, improved version, you simply need to swap the
    old model with the new one on the remote service. However, with local inference,
    things get complicated. To make model updates possible, you first need to implement
    a system that manages updates. You then need to release the new model to all the
    devices that have an internet connection and have opted in for updates, but you
    also need to keep in mind that there will be a certain proportion of users who
    will never update due to no internet connection or refusal to accept updates.
    As a result, your user base will be using a variety of different versions of models,
    and you will need to support them all.'
  - '[PAGE 157]


    Conversely, there''s a long list of advantages to using server-side inference:


    +   - *Server-side applications can make use of the out-of-the-box, machine-learning-as-a-service
    solutions:* If you opt in for server-side inference, a whole new world of ready-to-be-used
    solutions awaits that likely requires a few clicks to get your model from a file
    to a production service. There is a long list of managed services you can make
    use of if you plan to do inference server-side, whereas for local inference, you
    will need to, at least to some extent, reinvent the wheel.

    +   - *You can use state-of-the-art models:* Current state-of-the-art NLP models
    have a large number of parameters, and we can''t expect any of them to fit on
    a device such as a mobile phone anytime soon. To use state-of-the-art NLP models
    in production, you simply need to resort to server-side inference.

    +   - *Updates are easy and comprehensive:* To update a model server-side, unlike
    with local inference, you simply need to swap the old model with the new one at
    a single point. Once you do that, all inference performed from that point onward
    will feature results generated by the new model.


    At the beginning of this section, we mentioned that deciding between client-side
    or server-side inference is usually a simple question to answer. All it really
    boils down to is whether we want huge high-performance models with network latency
    or no network latency at all but compromised model quality.


    The server-side inference approach simplifies a number of aspects of NLP model
    deployment but also raises a number of new questions. Let''s discuss these as
    part of the next section.


    # When to use managed services and when to self-serve server-side models


    Another important decision that has a huge impact on how you manage your NLP services
    boils down to whether you will choose a managed service or decide to self-serve.


    If we decide to self-serve our models, it''ll mean that we''ll be responsible
    for setting up server infrastructure, building software for the endpoint that
    delivers NLP results, building software for performing inference on the model,
    scaling the system when our user base grows, and much, much more. We will essentially
    be taking care of the entire machine learning life cycle manually.'
