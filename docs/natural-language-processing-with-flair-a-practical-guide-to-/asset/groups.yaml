    \ classification labels. To train our sentiment analysis text classification model,\
    \ we will be using the famous **Internet Movie Database (IMDb)** dataset, which\
    \ contains 50,000 movie reviews from IMDB, where each review is labeled as either\
    \ positive or negative. References to this dataset are already baked into Flair,\
