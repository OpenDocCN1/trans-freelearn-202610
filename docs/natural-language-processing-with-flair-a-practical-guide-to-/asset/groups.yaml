    \ TextClassifier class\n\nThis is the point where all the variables defined in\
    \ the previous sections come together as part of a newly initialized object –\
    \ TextClassifier:\n\n```\nfrom flair.models import TextClassifier\n\nclassifier\
    \ = TextClassifier(document_embeddings,\n                            label_dictionary=label_dict,\n\
    \                            label_type=lbl_type)\n```\n\nIn the preceding code\
    \ snippet, we define our text classifier object, which initializes as a fully\
    \ functioning classifier with randomized weights. Classifiers such as TextClassifier\
    \ need to know the total number of classes in advance, as it affects the neural\
    \ network architecture – hence the need to provide label_dict. We also need to\
    \ pass in the document embeddings class at the point of defining the model so\
    \ that the model knows the embedding length, which defines the number of input\
    \ nodes. Finally, we also pass in the lbl_type variable, which is used at a later\
