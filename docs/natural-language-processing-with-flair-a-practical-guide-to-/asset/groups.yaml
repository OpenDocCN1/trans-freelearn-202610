    \n## Flair 中的经典词嵌入\n\nFlair 中最简单的仍包含词语义信息的嵌入类型称为 **经典词嵌入**。这些嵌入是预训练的、无上下文的，并且不需要预处理。无上下文的特性意味着一个词始终映射到一个预计算的嵌入，而与上下文无关。要使用它们，我们只需通过传入所选嵌入的\
