    ## 9 Deploying and Using Models in Production


    When **Natural Language Processing** (**NLP**) researchers and scientists work
    on improving a certain NLP model, they usually spend significant amount of time
    working on improving some very specific part or aspect of the model. When their
    work is done, results are gathered and then published as part of an academic paper.
    However, if you plan to leverage NLP for practical purposes, either as a commercial
    solution or simply as part of a personal project, a well-trained model is usually
    the point where your journey only begins.


