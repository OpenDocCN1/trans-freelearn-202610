    You should now have a good understanding of how to produce simple word embeddings
    in many languages using one of Flair''s classic word embedding methods. We now
    have the foundation and understanding to move on to a slightly more complex, but
    also more interesting, topic, one that is regarded as the reason behind Flair''s
    excellent sequence tagging performance, the so-called secret sauce of Flair –
    Flair embeddings.


    # Flair embeddings


    **Flair embeddings** are a special type of contextual string embeddings that model
    words as a sequence of characters. They are the reason behind Flair''s excellent
    sequence tagging performance and were essentially the motivation for the introduction
    of the Flair NLP framework. The *Contextual String Embeddings for Sequence Labeling*
    paper, an interesting and easy read written by the original creator of Flair,
    explains the inner workings of Flair embeddings brilliantly. But to grasp Flair
    embeddings from the perspective of an NLP engineer, we only need to understand
    their two properties: their contextuality and character-level sequence modeling.


    # Understanding the contextuality of Flair embeddings


    The idea behind contextual string embeddings is that each word embedding should
    be defined by not only its syntactic-semantic meaning but also the context it
    appears in. What this means is that each word will have a different embedding
    for every context it appears in.


    Each pre-trained Flair model offers a **forward** version and a **backward** version.
    Let''s assume you are processing a language that, just like this book, uses the
    left-to-right script. The forward version takes into account the context that
    happens before the word – on the left-hand side. The backward version works in
    the opposite direction. It takes into account the context after the word – on
    the right-hand side of the word.


    If this is true, then two same words that appear at the beginning of two different
    sentences should have identical forward embeddings, because their context is null.
    Let''s test this out:


    ```

    from flair.data import Sentence

    from flair.embeddings import FlairEmbeddings


    embedding = FlairEmbeddings(''news-forward'')

    s1 = Sentence("nice shirt")

    s2 = Sentence("nice pants")


    embedding.embed(s1)

    ```'
