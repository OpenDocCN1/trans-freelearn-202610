    ![](img/c56c48b8fd18a11ab705352d618ed976_25_0.png)


    Figure 1.1 – Visualization of NER tagging


    In the previous example, we can see that three entities were identified and tagged.
    The first and third tags are particularly interesting because they both represent
    the same word, Berkeley, yet the first one clearly refers to an organization whereas
    the second one refers to a geographic location. The human brain is excellent at
    distinguishing between different entity types based on context and is able to
    do so almost seamlessly, whereas machines have struggled with it for decades.
    Recent advancements in contextual string embeddings, an essential part of Flair,
    made a huge leap forward in solving that.


    # Word-sense disambiguation


    Word-Sense Disambiguation (WSD) is an NLP technique concerned with identifying
    the intended sense of a given word with multiple meanings.


    For example, take the given sentence:


    *George tried to return to Berlin to return his hat.*


    WSD would aim to identify the sense of the first use of the word return, referring
    to the act of giving something back, and the sense of the second return, referring
    to the act of going back to the same place.


    # Part-of-speech tagging


    Part-of-Speech (POS) tagging is a technique closely related to both WSD and NER
    that aims to tag the words as corresponding to a particular part of speech such
    as nouns, verbs, adjectives adverbs, and so on.


    ![](img/c56c48b8fd18a11ab705352d618ed976_25_1.png)


    Figure 1.2 – Visualization of POS tagging


    Actual POS taggers provide a lot more information with the tags than simply associating
    the words with noun/verb/adjective categories. For example, the Penn Treebank
    Project corpus, one of the most widely used NER corpora, distinguishes between
    36 different types of POS tags.'
