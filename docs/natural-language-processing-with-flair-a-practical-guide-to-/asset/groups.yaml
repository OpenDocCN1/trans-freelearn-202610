    fluctuate all over the place across different epochs and fail to converge to a
    minimum. Choosing the right learning rate is therefore essential.

    +   - **Mac epochs:** This is a setting that determines how many passes through
    the training data the trainer will make before finishing. This setting affects
    training time linearly. When set too high, training can take longer than we were
    prepared to wait for. When set too low, the trainer will finish before it had
    a chance to find the optimal weights.

    +   - **Loss:** This is a measure of how well our model is doing compared to the
    ground truth. The value is usually averaged across several samples. The goal of
    model training is to minimize loss. If the loss value is zero, it would mean that
    our model predicted all the tags correctly. Loss is often plotted on a graph to
    illustrate the progress and trend of learning. Seeing a decrease in loss value
    usually indicates that the model is learning, but it can also mean that it is
    merely overfitting our training data.

    +   - **Mini batch size:** When training models, we are unlikely to feed the entire
    training set to the model at once. Instead, we may, due to memory limitations,
    choose to split the training set into smaller batches. We can then feed each batch
    of data to the model individually. The size determining the number of learning
    samples in a single batch is called the **mini-batch size**.

    +   - **Patience:** This is the number of bad epochs (epochs without improvement
    to the objective function) to train before stopping.'
