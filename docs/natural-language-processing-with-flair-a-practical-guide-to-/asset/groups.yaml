  mdcn: '

    ## 衡量序列标注任务的 F1 分数


    F1 分数是另外两个指标称为 *精确率* 和 *召回率* 的调和平均值。其取值范围从 0（最差可能分数）到 1（最佳可能分数）。


    在序列标注中，*精确率* 定义为学习系统找到的命名实体中正确的百分比。其定义如下：


    $$precision = \frac{tp}{tp + fp}$$


    *召回率* 是语料中存在的命名实体被系统识别出的百分比。其定义为：


    $$recall = \frac{tp}{tp + fn}$$


    以下适用：


    - **真阳性** (*tp*)：被正确标注为特定标签的 token 数量。例如，如果某个 token 在训练数据中被标注为名词，而我们的标注器也将其标注为名词标签，则视为真阳性。

    - **假阳性** (*fp*)：被错误标注为特定标签的 token 数量。例如，如果某个 token 在训练数据中被标注为动词，但我们的标注器却将其标注为名词标签。

    - **假阴性** (*fn*)：本应被标注为特定标签但未被标注的 token 数量。例如，如果某个 token 在训练数据中被标注为名词，但我们的标注器却将其标注为动词标签。


    F1 分数随后被定义为精确率和召回率的调和平均值。


    $$F1 = 2 \cdot \frac{precision \cdot recall}{precision + recall}$$


    因此计算 F1 分数的过程涉及以下步骤：


    - 统计真阳性、假阳性和假阴性

    - 使用上述公式计算 *精确率* 和 *召回率*

    - 将 F1 分数计算为 *精确率* 和 *召回率* 的调和平均值


    如果我们分别计算每个标签（例如每个命名实体）的 F1 分数，然后对所有 F1 分数取平均，就得到宏观 F1 分数。该指标考虑了语料中标签表示不均的情况。


    如果我们将所有标签的总真阳性、假阴性和假阳性合并计算 F1 分数，就得到 *微观 F1 分数*。该指标在单标签问题（标注器中一个 token 最多只能分配一个标签）中的值与准确率相同。


    下次评估报告的序列标注器结果时，请注意 F1 分数指的是微观还是宏观变体。Flair 结果中（在未明确指定时）最常使用的变体是微观 F1 分数。


    ## 摘要


    通过本章获得的知识，我们不仅能够使用 Flair 中提供的许多预训练序列标注器，还能够解释和理解其输出。


    在本章中，我们从不同角度介绍了 Flair 中的序列标注。我们涉及了 Flair 提出的序列标注器的设计和架构。然后我们介绍了 NER 的动机和理论，以及可在
    Flair 中找到的预训练 NER 标注器。我们对词性标注也做了同样的处理，其中我们介绍了最著名的标签集，例如宾州标签集和通用词性标签集，然后介绍了 Flair
    中找到的重要预训练词性标注器。最后我们研究了用于评估序列标注器最常用的两个指标，并强调了区分微观和宏观 F1 分数的重要性。


    在下一章中，我们将研究如何使用 Flair 来训练、存储和重用您自己的序列标注模型。


    ## 第 2 部分：深入 Flair – 训练自定义模型


    在本部分，您将学习如何使用 Flair 训练自定义序列标注模型、嵌入和分类器，评估其性能，并通过超参数优化实现最佳结果。


    本部分包含以下章节：


    - 第 5 章，训练序列标注模型

    - 第 6 章，Flair 中的超参数优化

    - 第 7 章，训练自己的嵌入

    - 第 8 章，Flair 中的文本分类


    ## 5 训练序列标注模型


    在本书中，迄今为止我们已经介绍了一些 Flair 开箱即用的功能和模型。预训练序列标注器、嵌入和其他模型的集合乍一看似乎足够大，以至于我们永远不需要 Flair
    中已有的东西之外的任何东西。但如果您从事 **自然语言处理 (NLP)** 工作足够长的时间，您很可能会遇到一个问题，其通用性不足以用预训练模型解决。面对此类问题，我们通常需要自行训练模型。此过程涉及获取训练数据、预处理它，可能手动标注它，最后使用
    NLP 框架训练模型。但由于 Flair 提供了大量标注语料库，您可能只需要执行最后一步，即模型训练——本章的重点。


    我们将从解释何时以及为何需要训练自定义模型开始本章。接下来，我们将介绍训练序列标注模型的硬件要求，并展示在云中训练模型的免费和付费方法。


    然后我们将简要介绍神经模型训练的过程。之后，我们将查看控制训练的指标和参数。我们将在一个动手练习中介绍实际的模型训练语法，在该练习中我们训练一个英语词性标注器。最后，我们将学习一些评估模型质量和运行可视化的基本方法，这将帮助我们判断模型是否足够好，或者是否应该继续训练或从头开始。


    在本章中，我们将作为以下部分的一部分介绍上述主题：


    - 训练自定义模型的动机

    - 了解训练模型的硬件要求

    - 处理训练和评估参数

    - 训练自定义序列标注模型

    - 知道何时停止并重试


    ## 技术要求


    本章使用的所有 Python 库都是 Flair 0.11 的直接依赖项，在假设 Flair 已安装在您的机器上的情况下无需特殊设置。本章介绍的代码示例可在本书的官方
    GitHub 仓库中的以下 Jupyter notebook 找到：https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter05。


    在启用 GPU 的机器上运行本章介绍的代码不是强制性的，但建议这样做，因为它将加快训练过程并允许您训练更高质量的模型。


    ## 训练自定义模型的动机


    在本书中，我们迄今为止讨论了 Flair 开箱即用的功能和模型。然而，如果您从事 NLP 工作足够长的时间，您很可能会遇到一个序列标注问题，其复杂性或特殊性足以导致没有可用的预训练模型。这可能发生在以下任一情况下：


    - *您解决的问题是领域特定的*：诸如 **命名实体识别 (NER)** 或 **词性 (PoS)** 标注器之类的序列标注器通常是在大型通用语料库上训练的，这些语料库旨在代表语言的一般用法。但如果我们的问题是领域特定的，那么我们很可能需要一个使用领域特定语料库训练的、具有领域特定标签的自定义标注器。

    - *存在预训练模型但性能不足*：Flair 中提供的每个模型以及用于训练的方法通常都会由其他贡献者审查，但完全有可能您自己构建更好的模型。机会随着您转向不太流行的语言而增加，因为它们的性能不会得到同等优化。也可能发生预训练模型在
    F1 分数或准确率方面总体表现更好，但在您真正关心的那个特定标签的标注上却有所不足。


