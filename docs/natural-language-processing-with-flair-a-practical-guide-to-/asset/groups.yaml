    ## 8 Flair 中的文本分类


    在涵盖了超参数调优、嵌入和序列标注模型训练等复杂主题之后，我们现在准备转向自然语言处理（NLP）中一个稍微更直接、更容易理解的部分。在本章中，我们将介绍**文本**（也称为**文档**）**分类**。虽然
    Flair 的传统优势在于**序列标注**，但该库提供的解决方案利用了 Flair 嵌入以及其他第三方解决方案，使其在文本分类中也能取得不错的结果。其优势之一在于训练的简易性，另一优势则在于零样本和少样本分类器——这些分类器几乎不需要或不需要训练数据。


    我们将首先介绍文本分类是什么、它可用于什么、如何训练以及如何评估成功。随后我们将介绍 Flair 在文本分类方面能提供什么，并介绍不同类型的文本分类器。我们将通过动手练习训练我们自己的分类器。最后，我们将探索一种几乎不需要或不需要训练数据的文本分类新方法。


    我们将作为以下内容的一部分学习文本分类以及如何在 Flair 中训练和使用文本分类器：


    - 理解文本分类

    - Flair 中的文本分类

    - 在 Flair 中训练文本分类器

    - 使用几乎不需要训练示例的文本分类器


    让我们开始吧！


    ## 技术要求


    本章使用的所有 Python 库都是 Flair 0.11 版本的直接依赖项，只要机器上已安装 Flair，就无需特殊设置。本章涵盖的代码示例可在本书官方
    GitHub 仓库的以下 Jupyter 笔记本中找到：https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter08。


    你可以使用 CPU 运行本章的大部分代码并训练大部分模型。然而，最后一个练习确实需要配备 GPU 的机器。


    ## 理解文本分类


    文本或文档分类仅仅是将一个或多个标签（通常称为类别）分配给一段文本（通常称为文档）的过程。文本分类器是一种机器学习模型，它接收文本作为输入并计算一组类别上的概率分布。


    文本分类有许多实际应用，并被积极用于解决以下问题：


    - **主题分类** – 将主题分配给文档的过程

    - **垃圾邮件检测** – 检测不需要的电子邮件的过程

    - **情感分析** – 将文本情感分类为积极和消极

    - **仇恨言论检测** – 在文本中识别仇恨言论

    - **语言识别** – 确定文档使用何种语言书写


    以下是文本分类在现实世界中的一个例子：


    ![](img/c56c48b8fd18a11ab705352d618ed976_126_0.png)


    图 8.1 – 垃圾邮件检测


    关于文档的分类方式，我们知道三种不同的文本分类类型：


    - **二元分类** – 在二元分类中只有一个可能的类别。每个文档要么属于该类别，要么不属于该类别。

    - **多类分类** – 仅将众多可能类别中的一个分配给文档。

    - **多标签多类分类** – 一个文档可以同时属于多个类别。


    现在应该很清楚，文本分类虽然是一个概念上相当简单的概念，但仍是 NLP 的重要组成部分。但在我们直接深入 Flair 中如何对文本进行分类之前，让我们先快速了解一下文本分类器通常是如何训练的。


    ## 训练文本分类器


    文档或文本分类是一种监督式机器学习形式。这意味着机器学习模型在充当地面真实的标记数据上进行训练。例如，对于垃圾邮件检测分类器，每个文档将被标记为 *spam*
    或 *not-spam*。


    文本分类中没有规则定义可以定义多少个类别以及如何定义类别来解决特定问题。可能的类别集合通常是人为构建的，以便以最优方式解决某个业务问题。因此，文本分类与其他形式的监督式机器学习不同，因为通常除了标记数据本身之外没有客观的地面真实。例如，对于词性标注，地面真实，即词语应该如何被标注的解决方案，是由语法定义的，并且对于句子中每个词应该被分类为什么词性有一个明确的答案。但在文本分类中，类别通常是抽象的高层次概念，没有明确的定义或边界。因此，类别分配通常是主观的。例如，在情感分析中，我们需要将句子分类为
    *positive* 和 *negative*。然而，不同的人对某些句子是积极还是消极会有不同的看法。因此，对于分类问题，通常除了标记数据本身之外没有地面真实。这也是文本分类器容易受到标注偏差影响的原因之一。这意味着如果我们训练文本中的类别标签包含偏差，无论我们如何训练模型，我们的预测都会有偏差。


    检测和缓解偏差是一个复杂的问题，超出了 NLP 的范围，更不用说本书的范围了。在这里，我们计划介绍模型的训练方法，以及更重要的是，训练后如何以及依据什么进行评估。


    训练文本分类器的过程与训练序列标注器并没有太大区别。我们从一个具有随机初始化权重的深度学习模型开始，然后以适应训练数据的方式训练模型。当然，为了避免过拟合，我们不希望模型过度拟合训练数据。这就是为什么在测试数据集上评估模型很重要。为了评估模型并确定其是否按预期工作，我们使用以下其中一种指标。


    ## 单标签和多标签文本分类的指标


    可以应用于包括文本分类在内的许多分类问题的最简单、最易于理解的指标是 **准确率**。准确率仅仅是被正确分类的数据的比例。它可以使用以下公式计算：


    $$\frac{correctlyClassified}{(incorrectlyClassified + correctlyClassified)}$$


    这里，`correctlyClassified` 是被分配正确标签的示例数量，而 `incorrectlyClassified` 是被分配错误标签的示例数量。虽然该指标的结果在
    0 到 1 之间，但可以乘以 100 并以百分比（%）值表示。


    对于具有平衡类别分布（训练数据中每个类别的示例数量相同）的文本分类问题以及单类分类问题，该指标通常已经足够好。但当我们开始处理多标签（为每个训练示例分配多个类别）分类或不平衡数据集时，我们可能会进一步考虑其他指标，例如
    **F1score**。


    F1 分数已在 *第 4 章，序列标注* 中得到充分解释，并且在那里适用于序列标注的相同 F1 分数概念也适用于此处的文本分类。该分数是另两个指标 **精确率**
    和 **召回率** 的调和平均值。其范围从 0（最差分数）到 1（最佳分数）。


    为了充分理解 F1 分数在分类方面的含义，我们需要单独评估每个类别标签。对于每个预测标签，我们检查它是否是所讨论的标签（意味着正例）还是不是（意味着负例）。然后我们计算以下指标。


    在分类中，`precision` 是被标记为正例的示例中真正为正例的比例：


    $$precision = \frac{tp}{tp + fp}$$


    而 `recall` 是真正为正例的示例中被正确分类的比例：


    $$recall = \frac{tp}{tp + fn}$$

