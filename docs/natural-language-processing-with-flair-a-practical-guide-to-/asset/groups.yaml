  mdcn: '

    答案是否定的。 对于基于词的、非上下文词嵌入，可能的嵌入数量确实受限于词典中的词数。 但是，由于 Flair 嵌入可以对任何给定上下文中的几乎任何字符序列（不一定是已知词）进行建模，因此可能的嵌入数量是难以想象的庞大。
    这是由于以下原因：


    - Flair 嵌入是上下文相关的，这意味着同一个词放在不同的上下文中会产生不同的嵌入。

    - Flair 嵌入是在没有明确的词概念的情况下训练的。 词被建模为字符序列。


    当我们谈论训练 Flair 嵌入时，我们实际上并不是在谈论预先计算嵌入本身。 相反，我们是在谈论训练语言模型。 让我们进一步了解这一点。


    ## Flair 嵌入背后的思想


    训练 Flair 嵌入实际上是一个训练语言模型的过程。 Flair 嵌入模型本质上是语言模型，它们根据某些上下文（ surrounding text）预测下一个字符。
    Flair 使用基于长短期记忆（LSTM）循环神经网络节点的语言模型。 这些节点能够处理序列数据。


    > **什么是语言模型？**

    > 简单来说，语言模型是一种对文本字符串的概率分布进行建模的工具。 它通常根据某些上下文（前文）为每个可能的字符、词或词序列分配一个概率。 直到深度学习的出现，流行的语言模型类型是统计
    n-gram 模型； 但是，更近期的基于神经网络的方法 consistently outperform n-gram 模型。 经典 n-gram 模型仍然有一些优势。
    与大多数神经模型不同，n-gram 模型不需要太多数据，并且在大小方面可以非常轻量。


    基于字符的语言模型将输入文本作为字符序列接收，并被训练以预测下一个字符。 然后模型被训练以学习根据过去的字符预测可能下一个字符的概率分布。


    *那么，预测下一个字符与词嵌入有什么关系？*


    训练好的 Flair 语言模型本质上是生成词嵌入的模型。 首先，我们将整个上下文（围绕我们词的文本），包括我们想要计算嵌入的词，作为输入传递给模型。 然后，我们不关注预测的字符，而是关注
    LSTM 单元的一个特殊值，称为隐藏状态。 我们提取词中最后一个字符之后的隐藏状态，这就是我们的词嵌入。


    很明显，上下文会影响某些词的语义。 但是，你可能会想，是文本在词 *之前* 影响词的含义，还是词 *之后* 的文本影响其含义。 答案是两者兼有。


    ## 前向-后向嵌入堆栈


    Flair 嵌入中一个精妙的设计概念是它们使用后向-前向嵌入堆栈的方式，这有助于它们实现出色的性能。


    **前向模型** 考虑词之前的整个上下文以及词本身。 它捕捉了受词前文本影响的词的语义含义。 但是，该模型实际上并没有考虑到我们试图计算嵌入的词之后的全部词。
    为了实现这一点，我们需要构建一个反向工作的模型。 我们需要构建一个 **后向模型**。


    后向模型以相反的方向处理词。 对于英语而言，这意味着从右到左。 它考虑词之后的全部上下文加上词本身。 该模型捕捉了受词后文本影响的词的语义含义。


    一旦两个模型都训练完成，我们就可以计算前向嵌入和后向嵌入。 然后我们通常将它们结合起来形成一个新的嵌入，我们称之为 **嵌入堆栈**。


    ## Flair 嵌入的语料库


    训练任何类型的机器学习模型都需要数据。 幸运的是，训练嵌入是一个无监督学习任务。 用于训练的数据是未标记的。 这意味着任何包含有意义构造词的文本都可能被用作我们语料库的一部分。
    重要的是我们使用足够大的语料库。


    还有版权问题。 目前仍有一个持续的法律问题，即语料库的版权相关权利是否也适用于语言模型本身，以及在什么条件下适用。 例如，如果分发原始语料库需要署名，那么对在同一语料库上训练的语言模型是否也适用相同的署名要求？
    这个问题的答案取决于许多因素，但目前没有一种明确的答案方式适用于所有类型的场景。 但是，仍然有一些通用规则适用。 如果你在家用个人电脑学习 NLP，如果你在任何公开可用的文本上训练模型，你不太可能惹上麻烦。
    然而，这些实际豁免在商业环境中并不适用。 随着你向大型科技公司靠拢，版权法的执行会变得越来越严格。


    ## 训练 Flair 嵌入的词典


    Flair 嵌入训练最好的事情之一是为语言模型准备词典所需的努力，或缺乏努力。 对于大多数传统的基于词的语言模型，你需要为给定语言制定一个完整的词列表。


    幸运的是，Flair 嵌入是基于字符的。 这意味着语言模型的输入不是词，而是字符序列。 我们无需担心制定完整的词列表。 相反，我们只需要列出我们语言中使用的所有可能字符。
    这意味着如果我们处理的是使用拉丁字母的语言，我们的词典只会包含少数几项。 Flair 还提供了带有预定义常用词典的类，例如 Latin。


    Flair 的预训练嵌入在许多语言的许多下游 NLP 任务上取得了最先进的结果。 但是，在训练新的嵌入模型时，性能将取决于许多因素，并非我们训练的每个嵌入模型都会表现良好。
    我们需要找到方法来判断我们新训练的嵌入是否达到标准。


    ## 评估词嵌入


    在上一节中，我们介绍了使用语言模型的 Flair 嵌入的设计。 训练这些语言模型的过程与任何其他类型的深度学习训练并没有太大不同。 但是，性能良好的语言模型并不一定意味着能产生下游任务优秀结果的好嵌入。


    相反，我们通常需要依赖以下两种评估词嵌入的方法：


    - **内在评估** 旨在测试嵌入词表示的质量，而不依赖于任何自然语言处理任务。 这是通过衡量词之间的语义关系来完成的。 最简单的内在嵌入评估类型是词相似度。
    它 simply 使用相似度指标，例如余弦距离，来衡量词嵌入之间的相似度，并将其与人类感知的语义相似度进行比较。 例如，词 *开始* 和 *起始* 在语义上非常相似。
    如果我们的嵌入训练良好，那么我们期望这两个词在余弦距离上彼此接近。


    其他类型的内在评估方法利用词之间的类比关系，类似于我们在 *国王对男人如同女王对女人* 类比练习中学习词嵌入的方式，该练习在 *第 3 章，Flair 中的嵌入*
    中。


    - **外在评估** 旨在通过将词嵌入用于下游 NLP 任务（例如 PoS 标注、NER 或分块）来测试词嵌入的质量。 我们将嵌入作为输入提供给 NLP 模型。
    然后我们评估 NLP 模型的质量，并假设其性能的改善/退化可以归因于我们嵌入的性能。 Flair 拥有训练序列标注模型的所有工具，并为常用语言提供标记数据集。
    如果你发现自己正在训练 Flair 嵌入，很可能你计划将它们用作下游序列标注 NLP 任务的输入。 这通常使外在评估成为一个直接的选择。


    让我们现在进入本章的下一部分，在那里我们训练自己的嵌入，并稍后使用此处描述的技术之一进行评估。


    ## 在世界上最小的语言上训练 Flair 嵌入


    Flair 包为训练 Flair 嵌入提供了一个简单、直接的 API。 该过程涉及训练任何语言模型所需的所有必要步骤。 步骤包括以下内容：


    - 准备词典

    - 准备语料库

    - 定义语言模型

    - 训练语言模型


    让我们通过一个实践动手练习来介绍训练 Flair 嵌入的过程。


    对大多数语言进行嵌入训练并不是一个快速的过程。 一台 decent 的配备 GPU 的机器需要超过一周的训练时间才能产生与英语或类似语言上已发表的最先进 Flair
    结果相当的结果。 大多数预训练的 Flair 嵌入，例如 en 英语嵌入模型，产生长度为 2,048 的嵌入。


    我们需要 2,048 维向量部分原因是像英语这样的语言在词典中有大量词，并且它们的语义会根据使用的上下文而变化。 但是，如果我们在本次练习中，在一种非常小的语言上训练嵌入会怎样？
    如果我们在一种如此小的语言上训练嵌入，以至于我们甚至可以在没有专用图形处理单元（GPU）的机器上完成它会怎样？

