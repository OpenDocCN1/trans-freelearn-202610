    encountered when using NLP models in production, how to overcome these issues,
    and how to make our models publicly available. We will then address the issue
    from the low level by building a self-serving NLP solution. We will talk about
    the tools and libraries available for self-serving and the reasons why you should
    or shouldn''t opt in for self-serving. Finally, we will cover the various types
    of managed NLP machine-learning-as-a-service solutions, and how and when to use
    them. We will wrap up with a hands-on exercise where we deploy Flair models to
