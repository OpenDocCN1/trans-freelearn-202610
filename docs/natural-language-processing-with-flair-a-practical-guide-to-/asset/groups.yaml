    # Part-of-speech tagging tag sets


    The PoS tagger in the preceding script uses the **Penn Treebank Project PoS tag
    set**. It is a standardized set of tags consisting of 36 different PoS tags. It
    allows researchers to use a standard that enables them to compare results across
    different taggers. It was originally used to tag the corpora in **The Penn Treebank
    Project**, but is today used across many different datasets.


    The Penn tag set consists of the following 36 tags:


    +   - CC: Coordinating conjunction

    +   - CD: Cardinal number

    +   - DT: Determiner

    +   - EX: Existential there

    +   - FW: Foreign word

    +   - IN: Preposition or subordinating conjunction

    +   - JJ: Adjective

    +   - JJR: Adjective, comparative

    +   - JJS: Adjective, superlative

    +   - LS: List item marker

    +   - MD: Modal

    +   - NN: Noun, singular or mass

    +   - NNS: Noun, plural

    +   - NNP: Proper noun, singular

    +   - NNPS: Proper noun, plural

    +   - PDT: Predeterminer

    +   - POS: Possessive ending

    +   - PRP: Personal pronoun

    +   - PRP$: Possessive pronoun

    +   - RB: Adverb

    +   - RBR: Adverb, comparative

    +   - RBS: Adverb, superlative'
  - '[PAGE 68]


    +   - RP: Particle

    +   - SYM: Symbol

    +   - TO: To

    +   - UH: Interjection

    +   - VB: Verb, base form

    +   - VBD: Verb, past tense

    +   - VBG: Verb, gerund or present participle

    +   - VBN: Verb, past participle

    +   - VBP: Verb, non-third-person singular present

    +   - VBZ: Verb, third-person singular present

    +   - WDT: Interrogative word determiner

    +   - WP: Interrogative word pronoun

    +   - WP$: Possessive interrogative word pronoun

    +   - WRB: Interrogative word adverb


    Most English PoS taggers are likely to use this or a slightly modified version
    of this tag set. However, unlike NER tagging where the same NER classes are often
    used across several languages, the Penn set tags are very English-specific and
    cannot be effectively directly used on many non-English languages. A solution
    to this problem is the Universal PoS tag set. It defines a reduced universal tag
    set that can be used across multiple languages.


    The Universal PoS tag set defines the following PoS tags:


    +   - VERB: Verbs (all tenses and modes)

    +   - NOUN: Nouns (common and proper)

    +   - PRON: Pronouns

    +   - ADJ: Adjectives

    +   - ADV: Adverbs

    +   - ADP: Adpositions (prepositions and postpositions)

    +   - CONJ: Conjunctions

    +   - DET: Determiners

    +   - NUM: Cardinal numbers'
  - '[PAGE 69]


    +   - PRT: Particles or other function words

    +   - X: Other: foreign words, typos, abbreviations

    +   - .: Punctuation


    The preceding tags are less English-specific and can be used across multiple languages.
    They are used for Flair''s multilingual PoS taggers (described in more detail
    in the following section).


    # Types of PoS taggers in Flair


    Flair ships with a number of pretrained PoS taggers. Just like NER taggers, Flair''s
    PoS taggers can be classified as either monolingual or multilingual taggers.


    Monolingual pretrained PoS taggers in Flair are trained on a single language and
    often use language-specific tag sets.


    Some of the commonly used taggers are described as follows:


    +   - English PoS tagger trained on the `Ontonotes` dataset using the Penn tag
    set.

    +     ID: `pos`

    +   - A faster, lighter, and less accurate version of the English PoS tagger trained
    on the `Ontonotes` dataset using the Penn tag set.

    +     ID: `pos-fast`

    +   - English PoS tagger trained on using the Universal POS tag set.

    +     ID: `upos`

    +   - A faster, lighter, and less accurate version of the `upos` tagger using
    the Universal POS tag set.

    +     ID: `upos-fast`

    +   - German PoS tagger trained on the `UD German - HDT` dataset.

    +     ID: `de-pos`


    The preceding taggers will achieve optimal performance on the language they were
    trained on, but will not work well on any other language. To deal with multilingual
    corpora, Flair offers a set of multilingual PoS taggers. They were trained on
    12 languages: English, German, French, Italian, Dutch, Polish, Spanish, Swedish,
    Danish, Norwegian, Finnish, and Czech. To load them, simply use the `pos-multi`
    or `pos-multi-fast` tagger IDs.'
  - '[PAGE 70]


    # Other tagging tasks in Flair


    While PoS and NER tagging are the two most commonly used sequence tagging tasks,
    Flair supports many others. This is possible in Flair because its sequence tagging
    architecture isn''t tailored to a specific sequence tagging task. It can work
    with any, as long as the training corpus and annotations are stored in a format
    compatible with Flair.


    Other sequence tagging tasks solved by Flair''s pre-trained models include chunking,
    semantic frame detection, and domain-specific taggers such as negation and speculation
    tagging in biomedical texts.


    Each sequence tagger mentioned in Flair''s official documentation is accompanied
    by an accuracy score. Depending on what sequence tagger you are interested in,
    the metrics used to compute it might be different. In order to fully understand
    what the scores mean, we need to understand the metrics used to compute them.
    We will be covering that in the following section.


    # Sequence labeling metrics


    When comparing one sequence tagger to another, we can''t simply try them out by
    hand and take a wild guess about which one performs better. Their performance
    needs to be evaluated using the same dataset and computed using the same predefined
    metric. The most common metrics used in sequence labeling are accuracy and F1
    score.


    # Measuring accuracy for sequence labeling tasks


    Accuracy is a measure ranging from 0 to 1 that simply computes the proportion
    of correctly tagged tokens.


    Assuming `correctly_tagged_tokens` is the number of correctly tagged tokens and
    `all_tokens` is the total number of all tokens, accuracy can be defined as:


    accuracy = correctly_tagged_tokens / all_tokens


    The preceding formula is simple and provides an easily interpretable result, but
    the metric can be misleading when dealing with imbalanced datasets (datasets where
    classes/tag names are not represented equally). This is particularly noticeable
    with NER where the majority of tokens belongs to a single class. For example,
    a NER tagger with 85% accuracy sounds like a pretty good tagger. But when we look
    at the distribution of tags in a NER dataset, we will notice most of the tokens
    are tagged with the O (other) tag representing non-named entities. Assuming there
    are 85% of non-named entities in our corpus, a model that tags all tokens with
    O will achieve 85% accuracy by default. To solve this problem, we can use an alternative
    metric called the macro F1 score.'
