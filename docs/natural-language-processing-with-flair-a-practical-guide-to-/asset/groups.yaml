    \n```\ndef objective(value):\n    return value ** 2\n```\n\n然后我们可以为单个超参数定义搜索空间。为了保持简单，我们将选择均匀分布并采样一个我们知道最小值所在的范围，例如\
    \ -100 到 100：\n\n```\nfrom hyperopt import hp\n```\n\n```\n# define the search\
    \ space for a single hyperparameter\nspace = hp.uniform('param1', -100, 100)\n\
    ```\n\n前面的代码片段将在您之前安装了 Flair 的情况下成功执行。如果没有，请确保在运行之前在控制台中运行 pip3 install flair==0.11。\n\
    \n最后，我们现在可以选择优化方法：\n\n```\nfrom hyperopt import tpe\n\n# the Tree of Parzen Estimators\
    \ (TPE) algorithm\noptimization_method = tpe.suggest\n```\n\n定义了所有三个必需对象后，我们可以启动优化过程并打印结果：\n\
    \n```\nfrom hyperopt import fmin\n\n# minimize the objective function over 1000\
