    to serve requests on demand, in real time, and to a large audience. But how do
    you do that?


    When comparing this chapter''s topic to what we covered in this book so far, you
    will notice that deploying models to production is an entirely new problem that
    requires a slightly different set of skills. What we did in the preceding chapters
    was focused on the understanding and processing of data and the utilization of
    different machine learning and natural language processing techniques to achieve
    a certain goal. All this knowledge is less relevant now. What we care about now
    is deploying and maintaining NLP services in a way that will allow them to serve
    as many requests as quickly as possible, as reliably as possible, and using as
    few resources as possible. Easy, right?


    The set of skills to achieve this is often so different from the set of skills
    required to design and train NLP models that it''s typically handed over to completely
    different individuals – the software or MLOps (a field joining machine learning,
    DevOps and data engineering) engineers. There is a great book published by Packt
    called Engineering MLOps where you can learn more about this interesting engineering
    field. But while deploying ML models to production requires a very specific set
    of skills, it''s not an impossible process in and of itself and can be done by
    anyone who follows these steps.


    Before you make any decisions about deploying your NLP model, you need to first
    ask yourself the following questions:


    - Is the inference (the process of generating predictions) going to be done client-side
    or server-side?

    - Does the service need to be scalable?

    - Do you want to learn by doing this work or simply achieve a goal?

    - Is your model deployable on a managed service?


    All these decisions play an important role in determining where and how the NLP
    models will be deployed. Let''s investigate each point in detail.


    ### Client-side versus server-side inference


    Probably the most important and, at the same time, the easiest to answer question
    relating to deploying NLP models is whether they will be stored and perform inference
    locally on a client''s machine, or whether the model will be stored and the inference
    performed remotely on a server or a managed cloud service.


    When machine learning inference is performed locally on a client''s machine (such
    as a mobile phone, laptop, PC, or an e-book reader), we call this client-side
    inference.


    When machine learning inference is performed remotely on a server or a managed
    cloud service, we call this server-side inference.


    Both approaches have their pros and cons, and deciding which one to use almost
