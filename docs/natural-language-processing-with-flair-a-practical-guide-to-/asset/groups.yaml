    本章涵盖以下主题：


    - Sentence and Token 对象

    - 使用自定义分词器

    - Corpus 对象


    ## 技术要求


    对于本章，你需要安装了 **Flair version 0.11** 的 **Python** 环境以及稳定的互联网连接，因为我们将下载语料库。


    本章中的代码示例可以在本书的官方 GitHub 仓库中找到，具体在以下 Jupyter notebook 中：https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter02。


    ## Sentence 和 Token 对象


    **Sentence** 和 **Token** 对象可以被视为 **Flair** 语法中最常见的对象。前者用于表示句子或任何其他文本片段，例如段落。它们本质上是
    Token 对象的列表及其对应的标签分配。


    如果你想知道对象、类和方法是什么意思，这只是说明你对 **面向对象编程 (OOP)** 并不是特别熟悉。幸运的是，**OOP** 在 Python 中非常容易掌握。在
    **OOP** 中，存储和/或处理数据的代码片段被组织成称为类的蓝图。类的一个例子可以是 Word 类，它可以存储和处理单个单词。OOP 中的类可以包含几个称为方法的过程。Word
