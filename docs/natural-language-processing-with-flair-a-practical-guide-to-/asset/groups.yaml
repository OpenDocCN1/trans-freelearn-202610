    \ import Sentence\nfrom flair.embeddings import TransformerDocumentEmbeddings\n\
    \nembedding = TransformerDocumentEmbeddings('bert-base-uncased')\n\nsentence =\
    \ Sentence('Example sentence .')\nembedding.embed(sentence)\n\nprint(sentence.embedding)\n\
    ```\n\n前述代码将打印出代表我们句子的单个嵌入。\n\n请注意，在前述代码示例中，我们将 bert-base-uncased 嵌入 ID 传递给了 TransformerDocumentEmbeddings\
    \ 类。这是我们决定使用的变换器模型名称。您可以从 Hugging Face transformer 模型库中选择任何其他兼容模型。\n\n## Flair\
    \ 中的其他嵌入\n在本章中，我们介绍了 Flair 最先进性能背后的大多数嵌入类型和技术，尽管本书中仍有许多其他嵌入类型未作解释。\n\n包括以下内容：\n\
    - ELMoEmbeddings: 使用双向 LSTM 的上下文嵌入\n- OneHotEmbeddings: 每个词都是 one-hot 向量的嵌入\n\
    - BytePairEmbeddings: 在子词级别预计算的嵌入\n- `TransformerWordEmbeddings`: 使用基于变换器架构的嵌入\n\
    - `CharacterEmbeddings`: 每次初始化类时随机设置的字符级嵌入\n\n虽然这些嵌入的内部工作原理超出了本书的范围，即使不完全理解它们的工作原理，您现在也应该能够像使用\
    \ Flair 中的任何其他嵌入对象一样使用它们，因为它们都共享相同的接口。\n\n## 总结\n在本章中，我们介绍了 Flair 中的嵌入。它们是所有 NLP\
    \ 任务的核心概念。我们通过动手实践练习了解了嵌入的行为方式、其作用以及如何在 Flair 中使用它们。\n\n我们实现了一个 NLP 类比求解器，可以使用算术运算和词嵌入之间的关系预测类比中的最后一个词。通过这样做，我们不仅复习了如何在实践中使用\
    \ Flair 的基本类型，还说明了词嵌入是什么以及如何从中推导出含义。然后我们还介绍了 Flair 中的所有嵌入类型。我们首先介绍了经典词嵌入，然后是 Flair\
    \ 嵌入。\n\n使用元嵌入方法，我们使用了堆叠嵌入并将多个嵌入组合成新的嵌入——这是一种在 Flair 中实现最先进结果的技术。然后我们获得了在 Flair\
    \ 中形成文档嵌入的实践经验，并以超出本书范围的嵌入类型列表结束了本章。\n\n在下一章中，我们将学习 Flair 如何利用这些嵌入来生成 NLP 中性能最佳的序列标注器之一。\n"
