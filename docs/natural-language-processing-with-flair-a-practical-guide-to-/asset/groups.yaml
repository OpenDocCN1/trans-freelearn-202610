    user base. As the number of requests grow, we''ll need to update to a paid plan
    – but our code won''t need to change one bit!


    Our API is now live and available for public use as part of the Accelerated Inference
    API. But uploading a public Flair model to Hugging Face doesn''t only achieve
    that. There is another great benefit from uploading the model to the Hugging Face
    Models Hub – the ability to use the model in Flair from anywhere.


    # Using public Hugging Face Models Hub models inside Flair


    When we successfully upload a Flair model – for example, a sequence tagger – to
    the Hugging Face Models Hub, the model not only becomes available as part of the
    Accelerated Inference API, it also becomes available for public use from within
    Flair. Anyone can now use our model in Flair by simply referring to it using the
    right key.


    The key used for loading Hugging Face Models Hub models in Flair uses the <username>/<reponame>
    format, where username is our Hugging Face username and reponame is the name of
    our model repository. In our case, this results in flairbook/flairmodel.


    It means that anyone can use our sequence tagger in Flair by loading it the same
    way any other pre-trained model is loaded:


    ```

    from flair.data import Sentence

    from flair.models import SequenceTagger


    tagger = SequenceTagger.load(''flairbook/flairmodel'')


    sentence = Sentence(''abc'')

    tagge r.predict(sentence)


    print(sentence.to_tagged_string())

    ```'
