  - '[PAGE 111]


    The answer is no. With word-based, non-contextual word embeddings, the number
    of possible embeddings is indeed bound by the number of words in the dictionary.
    But, because Flair embeddings can model virtually any sequence of characters (not
    necessarily a known word) in any given context, the number of possible embeddings
    is unimaginably large. This is because of the following:


    +   - Flair embeddings are contextual, meaning the same word will result in a
    different embedding when put in a different context.

    +   - Flair embeddings are trained without an explicit notion of words. Words
    are modeled as sequences of characters.


    When we talk about training Flair embeddings, we are not really talking about
    pre-computing the embeddings themselves. Instead, we are talking about training
    a language model. Let''s learn more about that.


    # The idea behind Flair embeddings


    Training Flair embeddings is really a process of training language models. Flair
    embedding models are essentially language models that predict the next character
    given some context (surrounding text). Flair uses language models based on Long
    Short-Term Memory (LSTM) recurrent neural network nodes. These nodes are capable
    of processing sequential data.


    > **What Is a Language Model?**

    > In simple terms, a language model is a tool that models a probability distribution
    over strings of text. It assigns a probability to each possible character, word,
    or sequence of words often given some context (preceding text). A popular type
    of language model, up until the emergence of deep learning, was the statistical
    n-gram model; but, the more recent neural-based approaches consistently outperform
    the n-gram models. There are still some advantages to the classic n-gram models.
    The n-gram models, unlike most neural models, don''t require much data and can
    be very light in terms of size.


    Character-based language models receive input text as a sequence of characters
    and are trained to predict the next character. The model is then trained so that
    it learns to predict the probability distribution of the possible next characters
    given past characters.


    *So, what does predicting the next character have to do with word embeddings?*


    A trained Flair language model in essence is the model for producing word embeddings.
    First, we pass the entire context (text that surrounds our word), including the
    word we want to compute the embedding for, to the model as input. Then, instead
    of focusing on the predicted character, we focus on a special value of the LSTM
    cell called the hidden state. We extract the hidden state after the last character
    in the word, and this is our word embedding.'
  - '[PAGE 112]


    It is clear that context affects the semantics of certain words. But, you may
    wonder whether it''s the text that *precedes* a word that influences the meaning
    of the word, or whether it''s the text that comes *after* the word that influences
    its meaning. The answer is both.


    # The forward-backward embedding stack


    One brilliant design concept in Flair embeddings that helps them achieve their
    great performance is the way they use a backward-forward embedding stack.


    The **forward model** takes into account the entire context before the word and
