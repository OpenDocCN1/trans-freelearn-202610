    timed out, or simply because of a technical issue.


    When a model training interrupt happens, all data that is stored in memory, including
    our trained weights, are lost.


    Regardless of what really happened, the fact is, an interrupt happened and the
    memory-stored data is lost. Luckily, Flair has a good way around this called checkpoints.
    They are essentially a snapshot of the model that is stored after each epoch,
    regardless of whether the epoch improved the model or not. This checkpoint is
    stored in the base_dir directory with the filename of checkpoint.pt.


    To make use of the checkpoint feature in Flair, we need to pass the checkpoint=True
    parameter value to the trainer.train() method when training. But the feature does
    come at a cost. Writing checkpoints essentially means writing model weights to
    the disk after each epoch, and that takes time. This means that using checkpoints
    is likely to slow down the model training process a bit. However, when doing serious
    model training for longer periods of time, this overhead is almost always worth
    it.


    Assuming our base_dir is tagger and we have a corpus object-loaded memory, we
    can simply resume training from the last successful epoch by running the following:


    ```

    from flair.trainers import ModelTrainer


    chkpoint_path = ''tagger/checkpoint.pt''

    trainer = ModelTrainer.load_checkpoint(chkpoint_path, corpus)


    trainer.train(...)

    ```


    Here, the arguments passed to trainer.train() should be no different from the
    parameters we used for the initial training session that got interrupted, where
    we also used the checkpoint=True model trainer parameter value.


    The preceding exercise and explanations should help us train a tagger for just
    about any language included in Flair''s corpora set. But it''s entirely possible
    that the parameters we choose will not yield good results. There are many clues
    in the model training output we can look out for that will tell us whether training
    is progressing well or whether we should restart with a different approach.


    ## Knowing when to stop and try again


    The question "Is my model good enough?" is a whole subfield of machine learning
    on its own and can''t fully be explained in a single chapter. Nevertheless, there''s
    still some practical advice we all can follow to help us determine whether it''s
    worth restarting training with different parameters, different model types, or
    even new data.


    The two basic techniques for measuring success during and after training are as
    follows:


    - 1. Monitoring loss

    - 2. Assessing and comparing performance metrics


    ## Monitoring loss


    The first and most important thing you should look out for during training is
    whether the model is learning in an expected way. This is done by monitoring training
    output metrics such as loss. A typical training session follows the following
    pattern. In the initial stage of training, our weights are randomized, and loss
    will be huge (remember how bad our model with random weights was?). Then, even
    after one or two epochs, we will see a significant improvement in loss and model
    performance. Finally, as we progress towards two- or three-digit epoch numbers,
    the improvement will get smaller and smaller. Ideally, the loss should start to
    plateau and converge towards a certain value. That way, assuming we didn''t hit
    a local minimum, we can be confident that, given the parameters we chose, the
    model trainer did a good job. If we fail to see a convergence toward a certain
    value before training finishes, this may mean we finished training too soon and
    may need to run it for a couple more epochs.


    These training debug values such as loss will be printed out during training.
    But these values, shown as raw numbers, are sometimes very hard to make sense
    of. Just by looking at the numbers, it''s hard to see what the general trend is,
    whether the numbers are converging toward a certain value, or whether they are
    jumping all over the place. This is much easier to comprehend when metrics such
    as training loss are visualized.


    ## Plotting training loss


    Flair offers a simple tool that allows us to visually inspect metrics such as
    training loss and accuracy and store the output as an image.


    Assuming we ran a training session from the same directory as our current Python
    session and used base_dir called tagger, we can plot the training loss by running
    the following:


    ```python

    from flair.visual.training_curves import Plotter

    plotter = Plotter()

    plotter.plot_training_curves(''tagger/loss.tsv'')

    ```


    This will store the plot as tagger/training.png and, if you are running this code
    snippet inside a Jupyter notebook, display the plot in the notebook itself.

