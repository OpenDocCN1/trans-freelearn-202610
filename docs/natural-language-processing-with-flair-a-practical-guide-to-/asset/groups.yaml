    \              space,\n                algo=optimization_method,\n           \
    \     max_evals=1000)\n\n# print the best hyperparameter value\nprint(best_params)\n\
    ```\n\nThe preceding code snippet prints out the following:\n\n```\n{'param1':\
    \ 0.01084844145467706}\n```\n\nThis indicates that, according to Hyperopt, the\
