    ## Flair 基础类型


    对于任何 NLP 框架来说，一个良好的起点是熟悉代码中频繁使用的基本对象和方法。在 Flair 中，第一步是熟悉其 **base types**。这些是用于定义句子或文本片段并通过分词形成
