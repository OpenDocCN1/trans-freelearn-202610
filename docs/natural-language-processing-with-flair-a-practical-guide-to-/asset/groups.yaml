    # Measuring the F1 score for sequence labeling tasks


    F1 score is the harmonic mean of two other metrics called *precision* and *recall*.
    It ranges from 0 (worst possible score) to 1 (best possible score).


    In sequence tagging, *precision* is defined as the percentage of named entities
    found by the learning system that are correct. It is defined as the following:


    $$precision = \frac{tp}{tp + fp}$$


    *Recall* is the percentage of named entities present in the corpus that are identified
    by the system. It is defined as:


    $$recall = \frac{tp}{tp + fn}$$


    The following apply:


    +   - **True positives** (*tp*): The number of tokens that are correctly labeled
    with a specific tag. For example, if a token is labeled as noun in the training
    data and our tagger labels it with the noun tag, this is considered a true positive.

    +   - **False positives** (*fp*): The number of tokens that were incorrectly labeled
    with a specific tag. For example, if a token is labeled as verb in the training
    data, but our tagger labels it with the noun tag.

    +   - **False negatives** (*fn*): The number of tokens that should have been labeled
    with a specific tag, but weren''t. For example, if a token is labeled as noun
    in the training data, but our tagger labels it with the verb tag.


    F1 score is then defined as the harmonic mean of precision and recall.


    $$F1 = 2 \cdot \frac{precision \cdot recall}{precision + recall}$$


    The process of working out the F1 score therefore involves the following:


    +   1. Counting true positives, false positives, and false negatives

    +   2. Getting *precision* and *recall* using the above formulae

    +   3. Computing the F1 score as the harmonic mean of *precision* and *recall*


    If we compute the F1 score for each tag (for example, for each named entity) separately,
    and then average all the F1 scores, we obtain the macro F1 score. This metric
    takes into account unequal representations of tags in the corpus.'
