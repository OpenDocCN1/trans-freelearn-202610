    前面的片段计算了三个词对之间的相似度，并将 lukin 和 oko（同义词）之间的相似度存储到 s_synonym 中。它还计算了 lukin 与 oovword
    之间，以及 oko 与 oovword 之间的相似度。


    让我们看看我们的假设是否正确：


    ```

    print(s_synonym , s_rand_1 , s_rand_2)

    ```


    如果你的嵌入训练得不错，前面的代码片段将打印出类似以下内容：


    ```

    0.6111595281781783 0.2691232575537895 0.18826418665007352

    ```


    太好了！


    事实证明我们的假设得到了支持。相似词在相似度得分上得分很高（打印出的第一个数字），而不相关的词（打印出的第二个和第三个数字）得分较低。请注意，我们从这些结果中唯一可以得出的结论是我们的嵌入中存储了一些程度的
    Toki Pona 信息，但我们不应就这些嵌入在下游 NLP 任务中的有用性做出任何结论。要正确训练 Flair 嵌入以供实际使用，我们需要在更大的数据集上训练，使用更高的嵌入维度，训练更多
    epoch，并使用更长的序列长度。


    ## 总结


    训练自定义嵌入是 Flair 中较为复杂的功能之一。它需要所有有助于我们选择正确参数并正确准备数据的知识和理解，以便利用训练较大语言嵌入所需的大量计算能力。它也是一个关键概念，必须正确理解和执行，因为
    Flair 的几乎所有其他功能都以某种方式依赖于嵌入。


    在本章中，我们介绍了训练自定义 Flair 词嵌入的动机，并概述了嵌入设计。我们通过为世界上最小的语言 – Toki Pona 训练前向词嵌入，介绍了训练这些嵌入所需的语法。


    到目前为止，我们将嵌入呈现为可作为下游 NLP 序列标注任务输入的东西。但嵌入也可以用于其他 NLP 应用，例如文本分类。让我们在下一章学习关于那方面的内容。

