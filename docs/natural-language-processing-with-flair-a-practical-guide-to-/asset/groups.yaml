    The process of training a text classifier is not a whole lot different from training
    sequence taggers. We start off with a certain deep learning model with randomly
    initialized weights, and then we train the model in a way that fits the training
    data. Of course, we don''t want our model to fit the training data too well in
    an effort to avoid overfitting. This is why it''s important to assess the model
    on the test dataset. To evaluate the model and determine whether it works as intended,
    we use one of the following metrics.


    # Metrics for single and multi-label text classification


    The simplest and easiest way to understand a metric that can be applied to many
    classification problems including text classification is **accuracy**. Accuracy
    is simply the proportion of correctly classified data. It can be computed using
    the following formula:


    $$\frac{correctlyClassified}{(incorrectlyClassified + correctlyClassified)}$$


    Here, `correctlyClassified` is the number of examples that were assigned the correct
    label, and `incorrectlyClassified` is the number of examples that were assigned
    an incorrect label. While this metric results in a number between 0 and 1, it
    can be multiplied by 100 and expressed by a percentage (%) value.


    For text classification problems with balanced class distribution (where there
    is the same number of examples that belong to each class in our training data)
    and single-class classification, this metric is often as good as it gets. But
    when we start dealing with multi-label (assigning more than one class to each
    training example) classification or imbalanced datasets, that''s when we may look
    further toward other metrics, such as the **F1score**.


    The F1 score was already well explained in *Chapter 4, Sequence Tagging*, and
    the same F1 score concepts that apply to sequence labeling there apply to text
    classification here. The score is a harmonic mean of two other metrics called
    **precision** and **recall**. It ranges from 0 (worst possible score) to 1 (best
    possible score).


    To fully understand the F1 score in terms of classification, we need to assess
    each class label individually. For each predicted label, we check whether it is
    the label in question (meaning positive) or not (meaning negative). We then compute
    the following metrics.


    In classification, `precision` is the proportion of positively labeled examples
    that are truly positive:


    $$precision = \frac{tp}{tp + fp}$$


    And `recall` is the proportion of positive examples that were actually correctly
    classified:


    $$recall = \frac{tp}{tp + fn}$$'
