    ## 贡献者


    ## 关于作者


    Tadej Magajna 曾是首席机器学习工程师、数据科学家，现在是微软的软件工程师。他目前在一支负责语言模型训练和为键盘（如 Microsoft SwiftKey）构建语言包的团队工作。他拥有计算机科学硕士学位。他
    15 岁时在一家当地媒体公司担任网页开发人员开始职业生涯，并逐步转向更复杂的问题。他曾处理过 NLP 市场研究、公共交通巴士和火车运力预测等问题，最后在目前的岗位上从事语言模型训练。目前，他居住在斯洛文尼亚的家乡卢布尔雅那。


    ## 关于审阅者


    在学习工程和物理之后，**Pascal Tartarin** 在欧洲和亚太地区的化工和医疗器械行业担任过多个高级管理职位（销售、市场营销和研发）。作为终身学习者，他后来在数据科学和
    NLP 方面发展了自己的专业知识。在过去 6 年中，他基于 ML、深度学习、NLP 以及最近的知识图谱（Neo4j）构建了业务领域（预测、CRM）的应用。


    **Amardeep Kumar** 在自然语言处理和机器学习系统方面具有扎实经验。他在 NLP 和软件开发的不同技术栈方面拥有 2 年的行业经验。Amardeep
    定期以开发者、导师和评审的身份为 Google Summer of Code 项目贡献开源软件开发。他已为顶级 NLP 会议（如 ACL 和 EMNLP）发表研究论文。


