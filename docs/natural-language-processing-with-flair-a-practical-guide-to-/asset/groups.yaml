    model training often depends on a potentially large number of correctly set hyperparameters.
    This creates the need for finding a set of hyperparameter values that yield optimal
    performance. We can do this using hyperparameter optimization. Luckily, Flair
    offers hyperparameter tuning out of the box. Let’s learn how to do it.


    Hyperparameter optimization in Flair is essentially a wrapper around Hyperopt,
    which we briefly covered in the previous section. The extra advantage of this
    wrapper is that it already feeds some sequence tagging specific information into
