    NLP tasks in many languages. But, when training new embeddings models, the performance
    will depend on many factors, and not every embedding model we train will perform
    well. We need to find out ways of figuring out whether our newly trained embeddings
    are up to par.


    # Evaluating word embeddings


    In the previous section, we covered the design of Flair embeddings that use language
    models. The process of training these language models isn''t much different from
    any other type of deep learning training. But well-performing language models
    don''t necessarily mean good embeddings that yield excellent results on downstream
    tasks.


