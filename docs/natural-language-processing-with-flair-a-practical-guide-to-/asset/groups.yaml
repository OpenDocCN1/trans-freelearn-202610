  mdcn: "\n## 10 动手练习 – 使用 Flair 构建交易机器人\n\n在本章中，我们将通过一个动手编程练习，利用 Flair 的多个预训练模型来构建一个实际应用。我们将构建一个简单的交易机器人，它使用\
    \ Flair 的命名实体识别（NER）和情感分析工具来做出交易决策。该交易策略包括将当天的新闻标题作为输入，并使用 NER 来判断新闻文章是否在讨论我们感兴趣的公司。然后我们将运行情感分析，帮助我们决定是否持有、买入或卖出该公司的股票。\n\
    \n在第一部分，我们将通过解释基于新闻情感的交易方法的动机来介绍我们的交易策略的细节。然后，我们将使用 Flair 实现一个交易机器人。我们计划用一份 Flair\
    \ 编程速查表收尾，其中包含 Flair 中最常用的类列表。我们将在以下部分涵盖所有这些内容：\n\n-   了解交易策略\n-   实现 Flair 交易机器人\n\
    -   Flair 编程速查表\n\n但在直接深入交易机器人的细节之前，让我们确保所有技术要求都已得到满足。\n\n## 技术要求\n\n本章使用的所有 Python\
    \ 库都是 Flair 0.11 版本的直接依赖项，前提是 Flair 已安装在您的机器上，无需特殊设置。本章涵盖的代码示例可在本书官方 GitHub 仓库的以下\
    \ Jupyter 笔记本中找到：https://github.com/PacktPublishing/Natural-Language-Processing-with-Flair/tree/main/Chapter10.\n\
    \n## 了解交易策略\n\n对于本次动手练习，我们将实现一种有趣的交易策略，该策略利用了 Flair NLP 框架的多个部分。该策略绝不是最佳、最优的交易策略，也不是保证让你致富的策略。然而，它确实清晰地展示了\
    \ Flair 如何轻松解决现实世界问题。\n\n该策略将帮助我们做出股票交易决策。人们可以根据许多信息来源做出交易决策。一种特别有趣的交易策略类型利用 NLP\
    \ 处理最新的新闻内容。这些交易策略的基本假设是，讨论某家公司的新闻文章包含有关可能影响公司股价事件的重要信息。与人类相比，自动化的 NLP 策略在投资方面具有诸多优势。这些优势主要归结于机器能够完成的交易速度和规模。一个好的\
    \ NLP 交易机器人可以在人类所需时间的一小部分内分析数千字的文本并做出交易决策。\n\n然而，典型的 NLP 交易机器人在词义消歧问题上存在困难。人类历史上擅长利用上下文解读模糊的词义。但\
    \ NLP 的最新进展，例如 Flair 在下游 NLP 任务中使用的上下文字符串嵌入，使机器更进一步。例如，考虑以下陈述：*亚马逊森林砍伐由贪婪助长。*\n\
    \n前面的新闻标题对人类来说，显然是在谈论亚马逊雨林以及它如何受到森林砍伐的影响。然而，对一个天真的 NLP 交易机器人来说，这很容易听起来像是一篇讨论亚马逊科技公司的文章。当我们尝试交易以真实实体或物体命名的公司时，例如\
    \ Apple、Tesla、Visa 和 Shell，我们会遇到相同类型的问题。因此，一个好的交易机器人应该能够利用上下文来弄清一个词的真正含义，以确定新闻文章是否在谈论某家特定公司。基于上下文字符串嵌入的\
    \ Flair 上下文感知 NER 标注器将帮助我们做到这一点。\n\n我们的 Flair 股票交易策略遵循以下步骤序列：\n\n-   1. 查找可能包含有助于我们做出交易决策的有用信息的新闻文章。\n\
    -   2. 对新闻文章标题使用 Flair 的 NER 来确定新闻文章是否在谈论我们感兴趣的公司。\n-   3. 执行情感分析以确定新闻文章的情感。\n\
    -   4. 如果情感分析结果为正面，则买入股票。如果结果为负面，则卖出。\n-   5. 返回 *步骤 1*。\n\n该策略最好用流程图来说明：\n\n\
    ![](img/c56c48b8fd18a11ab705352d618ed976_179_0.png)\n\n图 10.1 – Flair 交易机器人策略流程图\n\
    \n前面的流程图显示了我们的交易策略在原则上是多么简单。而且由于我们计划使用 Flair 来实现它，它肯定会如此。\n\n让我们在下一节学习如何实现该策略。\n\
    \n## 实现 Flair 交易机器人\n\n交易策略由三个主要逻辑独立的组件组成：\n\n-   新闻文章获取组件\n-   NER 组件\n-   情感分析组件\n\
    \n第一个组件，即新闻获取，是非常特定于领域的代码。所使用的数据源很大程度上取决于我们感兴趣交易的公司类型。没有通用的新闻来源适用于所有股票。因此，我们计划将新闻获取部分移出我们的策略，并设计成新闻文本仅作为输入提供给我们的机器人。\n\
    \n我们的交易策略组件经常会访问相同的共享变量，例如我们感兴趣的公司名称。因此，使用面向对象的设计并将我们的策略作为 Python 类的一部分来实现是有意义的。我们将我们的交易策略类命名为\
    \ FlairTrader。类的构造函数方法将接收公司名称（我们想要交易的公司名称）并将其存储在内存中，同时存储一个 NER 标注器对象和一个情感分析分类器对象，后者将分别由命名实体识别和情感分析组件后续使用：\n\
    \n```python\nfrom flair.data import Sentence\nfrom flair.models import SequenceTagger\n\
    from flair.models import TextClassifier\n\nclass FlairTrader:\n    def __init__(self,\
    \ company_name):\n        self.company_name = company_name\n        self.tagger\
    \ = SequenceTagger.load('ner')\n        self.classifier = TextClassifier.load('en-sentiment')\n\
    ```\n\n在前面的代码片段中，我们简单地定义了 FlairTrader 类及其构造函数（在类实例化时被调用的一种方法）__init__。然后我们设置了三个类属性——名为\
    \ company_name 的公司名称变量、名为 tagger 的 Flair 默认英语 NER 标注器对象，以及名为 classifier 的 Flair\
    \ 英语情感分析分类器对象。\n\nFlair 目前仅支持英语情感分析模型。对于英语以外的语言，您需要使用 Hugging Face 等提供更广泛语言支持的其他\
    \ NLP 库。然而，Flair 确实支持多种语言的各种 NER 标注器。例如，您可以在前面的代码片段中将 ner 替换为 fr-ner 以使用法语 NER\
    \ 标注。\n\n现在是实现命名实体识别组件的时候了。它的唯一目的是，给定一些输入文本，确定该文本是否与我们想要投资的公司相关。它将通过查找名为 ORG 的命名实体标签来实现这一目标，该标签表示我们公司名称所使用的上下文指的是一个组织——即我们实际的公司。在相反的场景中，例如，当\
    \ Amazon 指的是亚马逊雨林而不是公司时，标签将为 LOC——表示位置：\n\n```python\ndef _references_company(self,\
    \ text):\n    sentence = Sentence(text)\n    self.tagger.predict(sentence)\n\n\
    \    for entity in sentence.get_spans('ner'):\n        if (entity.get_label('ner').value\
    \ == \"ORG\" and\n            entity.text == self.company_name):\n           \
    \ return True\n\n    return False\n```\n\n前面的代码片段以新闻文章标题或文本作为输入，并使用 Flair 的默认英语\
    \ NER 标注器对其进行标注。然后它查找与我们的 company_name 匹配的词元，并检查是否有任何词元被标记为 ORG。如果是，该方法返回 True，表示文本确实引用了我们的公司。如果不是，该方法返回\
    \ False。\n\n请注意，方法名称前面加上了 __。这在 Python 中通常用于私有类方法，这些方法仅由同一类的其他方法使用，而不打算从类外部直接调用。\n\
    \n> **重要说明**\n> 前面的代码片段是一个类方法，这意味着代码不应作为独立代码片段——它属于 FlairTrader 类定义内部。这也是整个代码块缩进四个字符的原因。\n"
