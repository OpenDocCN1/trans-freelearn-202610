    \ncorpus = IMDB()\ncorpus.downsample(0.05)\nlbl_type = 'sentiment'\nlabel_dict\
    \ = corpus.make_label_dictionary(label_type=lbl_type)\n```\n\nThe preceding code\
    \ snippet loads the IMDB dataset into memory. It also creates the `label_dict`\
    \ object, which is a dictionary containing all possible class labels. This will\
    \ be required later when we build the classifier.\n\n> **Important Note**\n> \n\
    > In this code example, we utilized the `downsample()` method. The method downsamples\
    \ the dataset. It reduces the number of items in our dataset, and by doing that,\
    \ we also reduce the amount of data our model will be able to learn from. As a\
    \ result, the model is likely to perform worse. This method should, unless there\
    \ really is too much data, only be used for learning and demonstration purposes.\
    \ We used a downsample rate of 0.05, meaning we only keep 5% of the original data.\n\
    \nLet's now move on to loading the document embeddings into memory."
  - "[PAGE 136]\n\n# Loading and preparing the document embeddings\n\nIn the previous\
    \ section, we covered all the different types of document embeddings that we can\
    \ use in Flair. To keep this exercise simple, we will use DocumentPoolEmbeddings.\
