  - '[PAGE 138]


    # Loading and using custom text classifiers


    After training the text classification model, the resulting classifier will already
    be stored in memory as part of the classifier variable. It is possible, however,
    that your Python session exited after training. If so, you''ll need to load the
    model into memory with the following:


    ```

    from flair.models import TextClassifier

    classifier = TextClassifier.load(''classifier/best-model.pt'')

    ```


    We can now generate predictions on some made-up text input:


    ```

    from flair.data import Sentence

    sentence = Sentence("great")

    classifier.predict(sentence)

    print(sentence.labels)

    ```


    The preceding code snippet tests our sentiment analysis classifier on the most
    trivial problem we could think of. We are classifying a single word, great, which,
    we can all agree, is unambiguously positive. The code snippet will print out the
    predicted class along with the prediction probability:


    ```

    [''Sentence: "great"/''POSITIVE'' (0.9999)]

    ```


    This indicates that the model is 99.9% positive that the label is... well, POSITIVE.


    But be aware that the model was initialized on random weights and trained on a
    significantly downsampled dataset. The results will, therefore, likely be a little
    different every time you run this code.


    We can give another simple example a go using the exact opposite. We can test
    whether our classifier behaves as expected when given an unambiguously negative
    message:


    ```

    sentence = Sentence("bad")

    classifier.predict(sentence)

    print(sentence.labels)

    ```'
