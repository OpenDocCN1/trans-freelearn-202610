    \ == s2[0].embedding.tolist())\n```\n\n在前面的代码中，我们实例化了 news-forward Flair 嵌入，并计算了\
    \ nice shirt 上下文中词 nice 的嵌入，以及 nice pants 上下文中词 nice 的嵌入。因为我们使用的是正向模型，它只考虑词之前出现的上下文。此外，因为我们的词在其在句子中的位置左侧没有上下文，所以两个嵌入是相同的，代码假设它们是相同的，确实打印出了\
    \ True。\n\n现在让我们在我们关注的词之前加上一些上下文。相同词的不同上下文应该导致两个不同的嵌入：\n\n```\ns1 = Sentence(\"\
    very nice shirt\")\ns2 = Sentence(\"pretty nice pants\")\n\nembedding.embed(s1)\n\
    embedding.embed(s2)\n\nprint(s1[1].embedding.tolist() == s2[1].embedding.tolist())\n\
    ```\n\n在前面的代码中，我们定义了两个句子，它们对词 nice 具有不同的前置上下文，并且因为我们使用的是 news-forward 嵌入模型，所以词\
    \ nice 的两个嵌入应该是不同的。我们在最后一行验证了这一点，该行假设词 nice 的两个嵌入是等价的。该操作的结果为 False。这表明正向类型的 Flair\
    \ 嵌入确实考虑了词左侧的上下文。\n\n### Flair 嵌入中的字符级序列建模\n\nFlair 嵌入中使用字符级序列建模有很多好处，但其最容易观察到的优势是它能异常好地处理\
    \ **词汇表外 (OOV)** 词。一些词嵌入技术，例如 **GloVe**，对 OOV 词不提供支持，并为词汇表中不存在的词返回零向量。OOV 支持不仅为从未出现在原始训练集中的词提供良好的性能，还为拼写错误的词提供支持。\n"
