  - '[PAGE 100]


    # Grid search


    This is a type of exhaustive search (meaning it explores the entire search space)
    that simply scans through all possible combinations of the predefined parameter
    options. It clearly suffers from the curse of dimensionality. The upside of grid
    search is that it can be fully parallelized.


    # Random search


    A non-exhaustive search algorithm that simply samples random hyperparameter values
    and evaluates each combination. It repeats this process for a specified number
    of steps and returns the set of hyperparameter values that result in the best-performing
    model.


    # Bayesian optimization


    A technique that uses Bayes'' theorem to perform a search in order to find the
    optimal set of hyperparameters. It builds a probabilistic model that maps the
    hyperparameter value to the `objective` (loss) function.


    A special variation of Bayesian optimization is the **Tree-structured Parzen Estimator**
    (**TPE**). It is often used in the popular Python hyperparameter optimization
    `hyperopt` library. The library''s source code and documentation can be found
    at `https://github.com/hyperopt/hyperopt`.


    # Evolutionary algorithms


    Another take on hyperparameter optimization methods is the evolutionary algorithm
    approach. The algorithm follows these steps:


    +   1. Generate a population of randomly chosen hyperparameter values.

    +   2. Train and evaluate a model for each individual member of the population.

    +   3. Replace the lowest-scoring individuals with newly formed individuals that
    are mutated or crossed-over variations (meaning a combination of multiple individuals)
    of individuals that performed well.

    +   4. Jump to step 2 and repeat until the desired score is obtained, no improvement
    is visible, or an iteration limit is reached.


    We now have a basic understanding of how hyperparameter tuning works. But all
    these new ideas and concepts may sound a little daunting if we imagine implementing
    them by hand. Luckily, there are many ways to leverage the readily available libraries
    in Python that do just that.'
  - '[PAGE 101]


    # Hyperparameter tuning in Python


    Let''s get a taste of what hyperparameter tuning looks like in practice. We will
    use one of the most popular Python hyperparameter optimization libraries called
    Hyperopt. First, let''s get a general idea of how to use it in practice.


    Hyperopt is a Python library that provides an easy-to-use API that requires the
    following three objects:


    +   - A search space

    +   - An objective function

    +   - An optimization method


    Let''s look at each of these requirements in detail:


    +   - **Search space** is simply the space within which the optimizer will search
    for different hyperparameter options. The library provides the following parameter
    expressions:

    +     - **Categorical parameters** – Parameter values that are purely categorical
    and can even be non-scalar (they do not need to be a number). They are provided
    via the `hyperopt.hp.choice` method.

    +     - **Integer parameters** – Integer value parameters obtained via methods
    such as `hyperopt.hp.quniform` or `hyperopt.hp.qlognormal`.

    +     - **Float parameters** – Decimal floating-point numbers obtained via methods
    such as `hyperopt.hp.normal` (which samples from normal distribution) and `hyperopt.hp.uniform`
    (which samples from uniform distribution).

    +   - **An objective function** that determines how well a certain hyperparameter
    value combination performs. In deep learning, this is most often the loss function.

    +   - **An optimization method** is an algorithm for performing a search within
    the search space. The options in hyperopt are: random search (`hyperopt.rand.suggest`),
    TPEs (`hyperopt.tpe.suggest`), and Adaptive TPEs (`hyperopt.atpe.suggest`).


    The three preceding concepts are really all Hyperopt needs to find the optimal
    hyperparameters for you. Let''s put this into practice as part of a hands-on exercise
    in Python.'
