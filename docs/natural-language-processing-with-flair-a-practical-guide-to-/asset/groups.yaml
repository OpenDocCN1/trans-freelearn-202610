    ```

    embedding.embed(s2)


    print(s1[0].embedding.tolist() == s2[0].embedding.tolist())

    ```


    In the preceding code, we instantiate the news-forward Flair embedding and compute
    an embedding for the word nice in the nice shirt context and the embedding for
    the word nice in the nice pants context. Because we are using a forward model,
    it takes into account only the context that occurs before the word. Also, because
    our word has no context on the left-hand side of its position in the sentence,
    the two embeddings are identical and the code assumes they are identical, and
    indeed prints out True.


    Let''s now put some context before our word in question. The differing context
    for the same word should result in two different embeddings:


    ```

    s1 = Sentence("very nice shirt")

    s2 = Sentence("pretty nice pants")


    embedding.embed(s1)

    embedding.embed(s2)


    print(s1[1].embedding.tolist() == s2[1].embedding.tolist())

    ```


    In the preceding code, we define two sentences that have differing preceding contexts
    for our word nice and because we use the news-forward embedding model, the two
    embeddings for the word nice should be different. We verify this in the last line,
    which assumes the two embeddings for the word nice are equivalent. The operation
    results in False. This indicates the forward type of Flair embeddings indeed takes
    into account the context on the left-hand side of the word.


    # Character-level sequence modeling in Flair embeddings


    Usage of character-level sequence modeling in Flair embeddings has many benefits,
    but its most easily observable advantage is that it handles **out of vocabulary
    (OOV)** words exceptionally well. Some word embedding techniques, such as **GloVe**,
    offer no support for OOV words and return a vector of zeros for words not in their
    vocabulary. The OOV support not only offers good performance for words that never
    appeared in the original training set but also offers support for words that were
    mistyped.'
