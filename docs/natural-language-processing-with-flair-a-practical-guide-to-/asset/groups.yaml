    If we compute the F1 score for all the tags counting the total true positives,
    false negatives, and false positives together, we obtain the *micro F1 score*.
    This metric will have the same value for accuracy as single-label problems (for
    taggers where one token can have at most one tag assigned).


    Next time you assess reported sequence tagger results, be careful about whether
    the F1 score refers to the micro or the macro variant. The variant most often
    used in Flair''s results (when not explicitly specified) is the micro F1 score.


