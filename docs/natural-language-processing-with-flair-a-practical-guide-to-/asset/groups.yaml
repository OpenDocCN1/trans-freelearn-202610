    \nFigure 6.1 – The $x^2 + 1$ function\n\nIt's clear that the minimum of $x^2 +\
    \ 1$ is 1 at $x = 0$. This now allows us to define the objective function in Python:\n\
    \n```\ndef objective(value):\n    return value ** 2\n```\n\nWe can then define\
    \ the search space for a single hyperparameter. To keep things simple, we will\
    \ choose uniform distribution and sample a range where we know the minima is,\
    \ say, between -100 and 100:\n\n```\nfrom hyperopt import hp\n```"
