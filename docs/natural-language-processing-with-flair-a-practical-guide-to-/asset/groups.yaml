    Flair 的预训练模型支持，你只需挑选一种代表性不足的语言并亲自动手即可。


    无论你训练自定义序列标注器的动机是什么，达到目标的过程都是一样的。 首先，让我们确保我们拥有合适的模型训练工具，通过在下一节中了解硬件要求来实现。


    ## 了解训练模型的硬件要求


    Flair 序列标注模型本质上是一种特殊的神经网络类型。 你可能听说过，为了对神经网络进行推理（即使用）或训练，你需要一台配备高性能 **图形处理单元 (GPU)**
    的机器。 训练神经网络需要计算大量数学运算（主要是矩阵乘法）。 与 CPU 相比，这些运算在 GPU 上可以更好地并行化，从而显著加快训练过程。 但这并不意味着没有
    GPU 就无法进行任何训练或推理。 你是否真正需要 GPU，完全取决于你正在训练的神经网络的大小以及你愿意等待训练完成的时间（小时、天甚至数十年）。 如果你只是刚开始接触神经网络，并且正在尝试训练只有少数层和几个节点的微小网络，那么即使使用一台没有专用
    GPU 的稍旧 PC 也应该完全没问题。


    不幸的是，Flair 中的大多数模型在合理的时间内用 CPU 训练起来会太庞大。 在 CPU 上进行推理是完全可行的，单个样本可以在几秒钟内完成标注，但以生产出良好模型为目标在
    CPU 上进行训练可能需要数周甚至数月。 事实上，即使是普通的 GPU 训练一个序列标注模型也可能需要从一天到数天不等。


    现在很清楚，要训练出效果良好的 Flair 模型需要一台配备 GPU 的机器。 但购买 GPU 并安装到 PC 上并不是你唯一的选项。 你可以从以下任一选项中选择：


    - *免费的 Jupyter notebook 环境，例如 Google Colaboratory：* **Google Colaboratory**（也称为
    **Colab**）是一个免费的 Jupyter notebook 环境，你可以在其中运行配备 GPU 的 Python 会话。 该环境还提供相当数量的 RAM
    和良好的 CPU 性能。 但它也有其局限性。 你只能运行最长 12 小时的会话。 这意味着如果你训练模型超过 12 小时且在此之前未能保存它，你的工作将会丢失。
    幸运的是，Flair 提供了一种名为 **检查点** 的特殊解决方案，可使模型训练器在每个 epoch 后存储模型快照。 即使会话在 12 小时后过期，训练也可以从上一个成功的
    epoch 恢复。 我们建议将 Colab 会话连接到 Google Drive，以便你的模型自动保存到云端。

    - *免费的云计算积分：* 当你首次注册云服务提供商（如 Microsoft Azure）时，你将获得一定数量的积分。 Azure 允许你使用这些积分启动配备
    GPU 的 **虚拟机 (VMs)**，在这些虚拟机上你可以轻松运行 Flair。 缺点是最终你会用完免费积分，这将使你转向下一个选项。

    - *付费云服务：* 有大量付费云服务提供预设的 Jupyter notebook 环境或非常基础的配备 GPU 的 VM。 付费云服务的优势在于你的会话不受时间限制。
    另一个很棒的优点是，如果你发现正在使用的环境资源不足，你可以简单地将其替换为更强大的机器。

    - *构建自己的深度学习机器。* 构建自己的设备最大的好处是，一旦你支付了硬件的初始成本，你就可以尽情训练任意多的神经网络，时间长短由你决定。 这种方法的缺点是你的硬件最终会过时，你很快会发现自己的机器不再足够强大。
    那时唯一的解决方案就是通过购买新硬件来升级。

    - *在 CPU 上训练模型用于学习和实验。* 这个最后的选项适用于任何只想体验模型训练的人。 由于在 CPU 上进行模型训练很慢，你需要在更小的语料上进行更少的
    epoch 训练。 一种允许这样做的方法是降采样。 当你对数据集进行降采样（例如通过调用 `dataset.downsample(0.001)`），你将只得到原始数据集的一小部分，这可能小到足以在
    CPU 上运行。 这意味着你生产的模型不太可能达到良好的效果。 但你仍然可以一窥模型训练的流程，并在获得更强大的配置后具备进行实际操作的知识和经验。


    虽然前述某些选项可以让你训练最先进的模型，而某些仅足以用于学习和实验，但所有选项都足以跟随即将到来的动手部分，了解如何在 Flair 中训练序列标注模型。
    但在我们这样做之前，我们需要对基本数学、指标、参数和深度学习术语有一定的了解。


    ## 使用训练和评估的参数


    Flair 可以说是目前最简单的 NLP 框架之一。 但要生产出性能良好的标注器，我们仍需要对底层概念和传递给 Flair 的参数有一定程度的理解。


    首先，让我们快速解释一下模型训练到底是什么。


    ## 了解神经模型训练


    神经网络是机器学习的一个特殊子集。 它们松散地基于生物神经网络，如人类大脑。 神经网络通常包括网络架构及其权重和偏置。


    网络架构定义了网络的设计。 它包括从层数、输入和输出节点的数量到所使用单元类型等一切内容。 这些属性被称为超参数。 在单次模型训练会话中它们保持不变。


    然后是权重和偏置——它们是模型训练的最终结果。 模型训练的过程本质上是计算最优权重的过程。 训练首先通过随机值初始化所有权重和偏置开始。 然后我们多次重复以下步骤：


    - 1. 模型被输入一批训练数据样本，我们可以为其计算输出。 对于序列标注模型而言，输出是标记标签。

    - 2. 然后将输出（预测标签）与目标值（实际标签）进行比较，并使用损失函数（也称为 `objective` 函数）进行评估。 它告诉我们预测与真实情况有多接近。


    模型训练器的目标是找到能产生尽可能小损失的权重。 损失为零将是理想的损失。 这意味着所有预测都与训练数据中的目标值一致。

    - 3. 一旦计算出单个训练批次的损失，网络就会使用一种称为反向传播的技术调整权重，以期改进模型。

    - 4. 然后我们将下一批训练数据输入模型并从 *步骤 1* 开始重复该过程，直到用完所有训练数据。


    前述所有训练数据被用于训练的步骤序列称为 **轮次**。 但由于对模型权重所做的更改非常小，一次数据遍历通常是不够的。 我们通常会为此重复训练过程许多个 epoch，直到损失函数收敛并停止改善。
    最佳 epoch 数在很大程度上取决于数据类型和数量、标签数量以及使用的超参数。 在每个 epoch 结束时，我们还使用准确率或 F1 分数等性能指标在测试数据集上评估模型。


    训练完成后，存储在内存中的权重通常会被写入文件，以便在我们想要对模型进行推理或继续训练时加载。


    本节描述的过程可能看起来复杂且令人不知所措。 但幸运的是，所有这些都已作为框架的一部分实现并自动化。 因此，对于希望构建序列标注器的人来说，没有完全理解神经网络训练背后的底层逻辑并不是致命问题。
    重要的是理解传递给 Flair 中模型训练类和方法中的参数和值的目的和含义。


    让我们逐一介绍这些参数。

    '
