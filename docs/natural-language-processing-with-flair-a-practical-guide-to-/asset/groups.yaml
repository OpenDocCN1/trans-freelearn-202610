    # Part-of-speech tagging in Flair


    PoS taggers are responsible for tagging/labeling tokens with their corresponding
    parts of speech. A simplified set of parts-of-speech categories consists of nouns,
    verbs, adjectives, and adverbs. However, most taggers in Flair use larger, more
    descriptive tag sets. For example, the Penn tag set consists of 36 different tags.


    The tagging process and PoS tagging syntax is no different from NER or any other
    tagging task in Flair. The only difference in loading a PoS tagger is choosing
    the right tagger ID that corresponds to our PoS tagger of choice.


    Let''s experiment with the default English PoS tagger in Flair using the pos tagger
    ID:


    ```

    ```python

    from flair.data import Sentence

    from flair.models import SequenceTagger


    tagger = SequenceTagger.load(''pos'')

    sentence = Sentence(''Making a living'')

    tagge r.predict(sentence)


    print(sentence.to_tagged_string())

    ```

    ```


    In the preceding script, we loaded Flair''s default English pos tagger and tagged
    an example sentence. We then printed out the resulting tagged sentence. The output,
    along with the download bar when using the tagger for the first time, is as follows:


    ```

    ```

    Sentence: "Making a living" → ["Making"/VBG, "a"/DT, "living"/NN]

    ```

    ```


    From the preceding output, we can see that our sentence, consisting of the Making,
    a, and living tokens, was tagged with the VBG, DT, and NN tags respectively. This
    means that the word Making was tagged as a verb in the present participle, the
    word a as a determiner, and the word living as a noun in the singular. This shows
    that the tagger handles word sense disambiguation well as the word living can
    either be a verb or a noun depending on the context.


    To fully understand the meaning of each individual tag produced by English PoS
    taggers in Flair, we need to refer to the documentation of the Penn tag set.'
