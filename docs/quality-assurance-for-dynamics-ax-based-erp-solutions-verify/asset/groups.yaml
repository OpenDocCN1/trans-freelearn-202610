    # Entry Criteria for Module Testing


    As discussed earlier, the exit criteria for one testing stage may not be the entry
    criteria for another. For example, module testing cannot be started immediately
    after unit testing is finished (i.e. exit criteria for unit testing are passed);
    the code that has passed the unit test needs to be deployed to the test environment
    and only then can module testing start. So the following can be considered as
    the entry criteria for module testing:


