    本书讨论了对基于 Dynamics AX 的 ERP 解决方案的质量期望、为满足质量期望需要遵循的最佳实践，以及测试定制 Dynamics AX ERP 应用程序的策略。\n\
    \n## 本书涵盖内容\n第1章讨论了 ERP 所解决的企业挑战、ERP 的关键质量期望，以及是什么使 Dynamics AX 成为理想的 ERP 系统。\n\
    \n第2章是理解 IBI 标准的基礎，因为本章全部关于在 Dynamics AX 独特挑战背景下的质量定义。它还解释了为什么我们应该保持和维护基于 Dynamics\
    \ AX 的 ERP 应用程序的质量。\n"
