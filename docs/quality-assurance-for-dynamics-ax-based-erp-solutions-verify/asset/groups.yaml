    # Enterprise Portal


    Enterprise portal facilitates remote users (e.g. sales or marketing personnel)
    accessing Dynamics AX functionalities through the Internet. Following are the
    user interface specifications used for the enterprise portal.


    | Sr. No. | Checkpoint | Expected Result |

    |---|---|---|

    | 1 | The website should be clearly visible in a browser with a screen size of
    1024 x 768 pixels with the standard button and address toolbars enabled. Is there
    any website where this standard is ignored? | No |

    | 2 | All top-level web pages such as Home pages and Activity Centers should have
    an icon and a title. Are there any web pages where this standard is ignored? |
    No |

    | 3 | On an Activity Center page, the title must match the corresponding name
    on the top menu. For example, the title of the Purchase Activity Center page must
    be Purchase on both the page and the menu. Is there any Activity center page where
    this standard is ignored? | No |

    | 4 | No icons or titles should be used on the top of the web pages that are not
    top-level pages. The title on these pages must be in blue. Is there any web page
    where this standard is ignored? | No |

    | 5 | Only one form must be used per web page, except on Home pages or Activity
    Centers. Is there any web page where this standard is ignored? | No |

    | 6 | Activity Center pages must contain a form, usually a list, and an instruction
    to pick a task from the list. For example, on a Sales Activity Page, you should
    have an instruction to Pick a Sales task (or similar instruction) and a list of
    sales tasks. Is there any Activity Center page where this standard is ignored?
    | No |

    | 7 | Make sure that the instructions on the Activity Page are helpful and instructive.
    For example, an instruction to enter a name is not helpful, while the instruction
    to select a customer and enter the item number and quantity to calculate prices
    is helpful. Is there any Activity Center page where this standard is ignored?
    | No |

    | 8 | All fields must be organized in groups. Is there any deviation from this
    standard? | No |

    | 9 | If the website visibility requirement allows, then the users must employ
    standard controls to add or remove grid lines. Is there any website where this
