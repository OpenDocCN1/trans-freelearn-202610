    In certain circumstances we may need to hide some errors either from a piece of
    code or from one or more type of best-practice deviations from the entire code.
    This can be done in the following two ways:


    +   - The "BP Deviation documented" comment is a way to stop best-practice warnings
    from some of piece of code. It should be noted that this will still show the best
    practice deviation but not it as warning; it will show as information. This comment
    is just like an ordinary comment so should be written as follows:

    +     `// BP Deviation Documented`

    +   - In the above method the disadvantage is that an error message is still displayed
    as information i.e. only the severity is suppressed. Another way to suppress the
    best-practice deviation completely is to use the SysBPCheckIgnore Macro. The following
    is the process of using the SysBPCheckIgnore Macro:

    +     1. Add the following line of code for each combination of error code and
    AOT location

    +        ```

    +        C+= [#BP Error Code, @"AOTLocation"]

    +        ```

    +        where `BPErrorCode` is the error code for the warning/error as listed
    in SysBPCheck macro, while `AOTLocation` is the location in AOT for the object
    whose BP deviation is supposed to be suppressed.

    +     2. Compile SysBPCheck class.

    +     3. Restart Dynamics AX.'
  - '[PAGE 152]


    # Compare Tool


    The Compare tool is one of the most useful tools for code review in Dynamics AX.
    The Compare tool can be used for three distinct kinds of comparisons:


    +   - The same application object in two different layers

    +   - Two versions of the same object (if version control is being used)

    +   - Two different application objects

    +   - Code in XPO being imported with the same objects in a layer of AOT


    In each case, comparison results are shown in ''Comparison form''. the following
    table explains the ''Comparison form''.


    | Symbol/Icon/Color/Background | Explanation |

    |---|---|

    | Shaded box with a check mark | Differences exist in the child node of current
    node. |

    | Red and blue icon | Differences exist with in the current node. |

    | Black text | No difference exists between the two objects in the current code
    line or property or control. |

    | Red or blue icons or text | The current code line, property, or control belongs
    to only one of the objects. |

    | Shaded background | Differences exist between the two objects in the current
    code line or property. |

    | Light gray background | The same code line appears in both objects, but in a
    different position. |


    # Type of Comparison


    The compare tool can be used in three different ways as mentioned earlier. Now
    we will discuss all three ways to compare.


    # Same Application Object in Two Different Layers


    This is to compare objects that either do not exist in the reference layer or
    exist in both layers but are different in the two layers. It should be noted that
    if reference layer is below the source layer, comparison take place between the
    objects in the source layer and objects in the reference layer as well as layers
    below the reference layers. The following table explains terms used in the Graphical
    User Interface:'
  - '[PAGE 153]


    | GUI Term | Explanation |

    |---|---|

    | Project name | The name of the project that will be created during the compare-layers
    process |

    | Source layer | This layer is used as a basis for the comparison. As mentioned
    earlier the resulting project can never hold objects that are not included in
    the source layer. |

    | Reference layer | The layer that is to be compared with the source layer. |


    > ''OLD SYS'' can be selected as reference layer to learn what objects have been
    changed in the new version.


    Steps to compare same application Objects in two different layers:


    +   1. Click **Tools | Development Tools | Version Update | Compare Layers**.

    +   2. Enter the project name, select source and reference layers and then click
    **OK**.

    +   3. A project holding application objects that differ is now created. Go to
    the project (the name of which you entered in previous step).

    +   4. Compare individual objects using the ''Compare'' command on the ''Add-ins''
    shortcut menu.

    +      To see the name of the layer to which each object belongs, go to **Tools
    | Options | Development tab** and then select **show all layers**.

    +   5. See the comparison results in ''Comparison Form''


    # Two Versions of the Same Object


    Comparing two version of the same object in the same layer is possible only when
    the version control system is used.


    +   1. Go to AOT and right-click the object and then click **Add-Ins | Compare**.

    +   2. Select the two versions to be compared and then click **Compare**.

    +   3. Click **Compare** again.

    +   4. See the comparison results in **Comparison Form**.'
  - '[PAGE 154]


    # Two Different Application Objects


    The following is the process to compare two different application objects in AOT:


    +   1. Select the objects in the AOT.

    +   2. Right-click and click **Add-Ins | Compare**.

    +   3. Click **Compare** again.

    +   4. See the comparison results in **Comparison Form**.


    # Code Profiler


    The code profiler is a tool that follows the history of code execution while it
    is running. The code profiler can be used for the following:


    +   - Measuring execution time for each line, method, object, etc.

    +   - Code coverage analysis during unit testing

    +   - Identifying performance bottlenecks


    The code profiler can not only be invoked through the graphical user interface,
    but also through X++ code. We will not discuss invoking it through X++. Using
    the code profiler consists of two stages:


    +   - Gathering data

    +   - Viewing/analyzing data


    # Gathering Data


    To gather execution data, the code profiler needs to be invoked and then the user
    should traverse through each feature/function under review. The following steps
    should be followed:


    +   1. Open the code profiler tool by going to **Tools | Development Tools | Code
    Profiler**.

    +   2. Limit the check depth by checking the **Trace Depth Enabled** checkbox
    and then selecting the number of levels.

    +   3. Navigate in the application till the point where the test should start.

    +   4. Click **Start** in the code profiler window.

    +   5. Use the functionality under different conditions so that every line of
    code is executed at least once.'
  - '[PAGE 155]


