  - '[PAGE 6]


    # About the Reviewer


    **David Bowles** in his twenty-eight years has worked with computers since the
    age of four and has been involved with computers in support, administration, development,
    and gaming. Although he wasn''t very fond of programming and developing software
    early in his college career, the fact that he was programming in BASIC on his
    VIC-20 at five along with some help from the BYTE magazine, foreshadowed his life
    to come in software development. Although he grew up in the small towns of Albany
    and Moultrie in southern Georgia, he was blessed to have access to computers through
    his father''s employers and was ultimately able to afford them later in life.


    David got involved with Dynamics AX during his employment with NAPA Rayloc, shortly
    after coming on board. The executive suite decided to migrate from a legacy COBOL-based
    accounting system to Dynamics AX. David was presented with a Virtual PC image
    of the software and given a couple of weeks to get familiar with it. After three
    months of working and developing the software on a trial basis, the implementation
    process began. After a twelve month implementation period, during which he was
    the only a full-time developer on the project, many long days and nights of coding,
    a wedding, and a couple of 48-hour plus days, Rayloc was fully implemented with
    AX. During the implementation and learning process, David was awarded the Microsoft
    Most Valuable Professional award in Dynamics AX. The award was mainly based on
    his contributions to the user community in forums, his blog, and feedback to Microsoft
    Support on his research on the newly added Application Integration Framework in
    version 4.0. Prior to NAPA Rayloc, David was employed in technical and programming
    positions with AOL, SurfSouth, CallTech Communications, and Kodak.


    Currently David is married to his quintessential bride, Courtney, and they reside
    in western suburban Atlanta, Georgia. Besides his job, he attends the Mercer University
    in Atlanta, to complete his bachelors'' of science in Business Administration.
    When he''s not at work or school, he likes to spend his free time in a round of
    golf, tennis, paintball, and occasionally an XBox game.'
