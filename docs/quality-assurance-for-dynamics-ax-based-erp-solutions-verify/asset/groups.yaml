  - '[PAGE 89]


    # Function Window


    A function window is a type of form in Dynamics AX, which is used to view or change
    some setting or start some process. Function windows needs to comply with the
    following specifications in addition to those discussed earlier.


    | Sr. No. | Checkpoint | Expected Result |

    |---|---|---|

    | 1 | Does the function window contain any tables? | No |

    | 2 | A function window that starts a process must contain an OK and a Cancel
    button. Is there any form in which this standard is ignored? | No |

    | 3 | Are OK and Cancel buttons placed on the right-most buttons on the last line
    in the window? | Yes |

    | 4 | If there are any additional command buttons appearing to the left of the
    OK and Cancel buttons, they must be properly separated from the OK and Cancel
    buttons. Is there any function window in which this standard is ignored? | No
    |

    | 5 | OK and Cancel buttons must have OK and Cancel labels respectively. Variants
    such as ''Ok'' and ''ok'' are not permissible. Is there any form in which this
    standard is ignored? | No |


    # Icons and Symbols


    Icons and symbols need to comply with the following specifications:


    | Sr. No. | Checkpoint | Expected Result |

    |---|---|---|

    | 1.1 | Are the images being used in the icons and symbols relevant? | Yes |

    | 1.2 | All icon images should be clear so that it is easy for users to understand.
    Is there any icon in which this standard is ignored? | No |

    | 2.1 | Are icons complying with office standards? | Yes |

    | 2.2 | Is there any icon that conflicts with Office icons? | No |

    | 3.1 | All icons should have a screen tip associated with them. Is there any
    icon in which this standard is ignored? | No |

    | 3.2 | In a screen tip associated with any icon, the purpose of the icon should
    be explained clearly. Is there any icon in which this standard is ignored? | No
    |

    | 3.3 | Is there any icon for which the screen tip is blank? | No |'
