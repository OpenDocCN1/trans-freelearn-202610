    \ `if (true)` 而不是 `if (! false)`。\n- 优先使用 `switch` 语句而不是多个 `if-else` 语句。\n- 除非有意使用\
    \ fall through 机制，否则应始终以 `break` 或 `return` 或 `throw` 语句结束一个 case。当使用 fall through\
    \ 机制时，应给出类似 `//fall through` 的注释，以便每个读者都能清楚明白。\n\n## Code Layout\n\n为了提高代码的可读性，代码应以适当的布局编写。代码布局的一些主要最佳实践如下：\n\
    \n- 在发布代码前移除注释掉的代码。\n- 遵循缩进规则。\n- 遵循命名类、方法、表等的大小写规则。\n\n## Methods\n\n以下是方法的一些最佳实践：\n\
    \n- 方法应小而逻辑清晰，以便于轻松重写或覆盖。\n- 方法应执行单一明确定义的任务，并且从其名称即可清楚任务内容。\n- 对于静态类方法和表方法，应以最小化对其他层调用的方式使用限定\
