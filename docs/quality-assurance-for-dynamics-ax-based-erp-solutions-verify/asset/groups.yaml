    # Installation Testing


    The objective of this testing is to ensure that the installation process is smooth.
    If an installation cannot be completed, the newly installed items are uninstalled
    and they do not affect the Dynamics AX that is already installed. The objectives
    may include the following.


    +   - To ensure compatible installation procedure for core Dynamics AX product

    +   - To ensure that the setup registers the DLLs and ActiveX controls correctly

    +   - To ensure that the setup checks for proper Dynamics AX version and service
    pack level

    +   - To ensure that the setup checks for the presence of required Dynamics AX
    modules

    +   - To ensure that configuration settings are either inherent or created

    +   - To ensure that the setup provides all dependencies, i.e. files necessary
    for installation'
