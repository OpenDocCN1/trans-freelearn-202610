  - '[PAGE 41]


    # 2

    Quality in Dynamics AX-Based ERP Solutions


    In the last chapter we discussed the key characteristics that make an ERP system
    ideal from a business or user perspective. We also learned why Dynamics AX can
    be considered as an ideal ERP solution. In this chapter we will discuss various
    key characteristics from a technical perspective and also learn to preserve them.
    The following topics will be clear after studying this chapter:


    +   - What is quality?

    +   - Why it is necessary to focus on quality?

    +   - How we can achieve this quality?


    # Quality Definition for Dynamics AX


    Few specifications need to be considered to preserve the key characteristics of
    Dynamics AX. These specifications were originally issued by Microsoft as ''Industry
    Builder Initiatives''. Though they are discussed in detail, there may be some
    variations as I have incorporated my experience for improving quality at an economical
    price.


    # Coding


    The code written for customization should conform to the prescribed coding standards.
    The coding standards are devised on the following factors:


    +   - Ease in further customization

    +   - Integration

    +   - Performance'
  - '[PAGE 42]


    +   - Internationalization/localization

    +   - Scalability

    +   - Understandability (including code layout and commenting)

    +   - Usability

    +   - The Dynamics AX way

    +   - Trustworthiness


    These coding standards are categorized into the following two types:


    +   - Syntax-level best practices (static code analysis)

    +   - Design-pattern level best practices


    A large number of checks for syntax-level best practices can be exercised by Dynamics
    AX''s built-in tool, the Dynamics AX best-practice check tool. This tool can be
    used:


    +   - At the time of compilation

    +   - At the time of check-in

    +   - Anytime by right-clicking the object in AOT and checking best practices


    Best practices can be checked for one or more node in the Application Object Tree
    (AOT), at any point in time, by right-clicking the node and selecting **Add-Ins
    | Best Practices | Check Best Practices.**


    To configure the best-practice check at the time of compilation, a user needs
    to perform the following:


    +   1. Select **Tools | Options**.

    +   2. Click the **Compiler** button.

    +   3. Select the **Diagnostics level** as **level 4**.


    The best-practice check tool shows three types of best-practice deviations, i.e.
    Error, Warning, and Information. We can select the level of severity of deviations
    to be displayed. Following are the different warning levels we can select:


    +   - **Errors only**: If dynamics AX is supposed to show only the deviations
    that have a severity level of Error.

    +   - **Errors and Warnings**: If Dynamics AX is supposed to show deviations that
    have severity levels of Error and Warning. The system will not show deviations
    of severity ''Information''.

    +   - **All**: When all deviations from best practices are to be shown to user.


    Settings related to warning level will only hide the unrelated errors, but it
    will not stop checking the deviations from best practices. The warning level can
    be set at **Tools | Options | Best Practices** by selecting the appropriate warning
    level from the warning level list.'
  - '[PAGE 43]


    Three different severity levels are defined as follows:


    +   - **Information:** Things that might be nice to know (shown in blue color
    in best-practice tool output).

    +   - **Warnings:** Things that you should strongly consider fixing (shown in
    yellow color in best-practice tool output). It is recommended to remove at least
    95% of deviations in this category and a due justification needs to be documented
    about whatever could not be fixed.

    +   - **Errors:** Things that should definitely be fixed (shown in red color in
    best-practice tool output).


    If a deviation message is double-clicked, it opens the code editor with focus
    on that deviation message.


    # Testing and Quality Assurance Standards


    It is imperative that the qualities of core Dynamics AX are preserved by utilizing
    the same quality standards in Dynamics AX customizations as are being used in
    the development of Dynamics AX, i.e. Microsoft standards. Defects must be classified
    and managed appropriately. It should be emphasized that the:


    +   - The basis of defining severity and priority for defects must be identical
    to Microsoft standards.

    +   - The defect management system should have the characteristics defined by
    Microsoft including, but not restricted to following:

    +     - Every bug should have a unique number (ID) associated with it.

    +     - It should allow classifying a bug on the basis of severity and priority.

    +     - It should allow insertion of comments or at least closing comments.

    +     - It should allow supplying additional information (which is mandatory for
    security bugs) for security related bugs.

    +   - All known issues must be documented to describe the possible impact/ failure
    and possible workaround to minimize the impact of known issues.


    We will discuss these standards in Chapter 8, Defect Management System.'
  - '[PAGE 44]


    # User Friendliness


    It is the de facto industry standard that help should be commonly accessed irrespective
    of the user''s current screen, i.e. the help system should not be different in
    the HR module and CRM module. This will ensure a user gets help without investing
    much effort to locate the help itself. In order to maintain consistency with Microsoft
    Dynamics AX user assistance guidelines, we need to comply with the following:


    +   - Help documents should be in `.chm` file format.

    +   - Help must be accessible by pressing the `F1` function key.

    +   - Help must describe ''how'' and not just ''what'' or ''why''.

    +   - Help style should comply with Microsoft Dynamics AX Help style/standards.

    +   - User interface should comply with Microsoft Dynamics AX user interface guidelines
    and Microsoft Windows user interface guidelines.

    +   - High level of consistency such as:

    +     - Same entity should not be labeled with different labels, such as Bill
    of material and BOM or Inquiry and enquiry.

    +     - The buttons should appear in a definite order.


    Dynamics AX user interface guidelines will be discussed in details in Chapter
    4, Best Practices – GUI.


    # Report Standards


    It is desirable that common standards followed in Dynamics AX are also used during
    customization. The standard reports should be developed using the report wizards
    provided in Dynamics AX.


    If a new type of standard report needs to be created the built-in common templates
    should be used in all such reports to maintain consistency. The use of standard
    templates will also improve the maintainability.


    The SQL reporting should be used as described in implementation guidelines for
    SQL reporting in Dynamics AX applications. These guidelines are provided in Microsoft
    Dynamics AX.'
  - '[PAGE 45]


    # Performance Optimization


    The coding and implementation should be performance optimized. The following considerations
    could ensure that there is no performance degradation due to customization:


    +   - Follow best practices for performance optimization/three-tier architecture.

    +   - Proper selection of the run-on property, which determines the tier on which
    the code should run. Suitable selection will minimize the calls between different
    tiers and hence performance will be improved.

    +   - Proper use of caching will not only reduce the network/bandwidth resources,
    but will also put minimal load on the AOS/Database server.

    +   - Use of client/server-neutral functions in code.


    If the above considerations are followed, it will ensure that there is no significant
    performance degradation after customization, which is one of the requirements
    of the IBI specifications.


    # Trustworthy Computing


    No ERP system implementation can be successful without providing a trustworthy
    computing experience to the users. A trustworthy computing experience can be achieved
    using the following qualities:


    +   - **Security**: Today the computer networks are not only confined to an organization.
    The networks may be exposed to the Internet or WAN network, etc., which increases
    the risk of security attacks. The business systems should be able to protect the
    system as well as maintain the data confidentiality, integrity, and availability.

    +   - **Privacy**: Today business success lies in information, its confidentiality,
    flow, and availability. The business system should not only have an appropriate
    access control mechanism, but it should also ensure that malicious users cannot
    access the confidential information by using security loopholes in design, development,
    or deployment.

    +   - **Reliability**: An ERP system implementation is not just another tool.
    It is a change in culture. In the new culture, business success is highly dependent
    upon the reliability of an ERP system, which means in every case the ERP system
    should perform as expected. The information presented by the system should be
    accurate, precise, and in the required format. The customers should experience
    a consistent and trouble-free computing experience, where they need not use other
    means to process/know the information.'
