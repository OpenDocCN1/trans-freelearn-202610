    # 9

    Dynamics AX Tools


    Due to peculiarities involved in the customization process, most of the standard
    tools available in the market cannot be utilized unless a great effort is made
    to adapt them to the needs of Dynamics AX. Fortunately Dynamics AX offers a few
    useful tools:


    +   - A best-practice check tool for the analysis or scanning of code

    +   - A compare tool for scanning changes in code

    +   - A code profiler for code coverage analysis and performance analysis

    +   - A benchmark kit for benchmark testing


    # Best-Practice Check Tool


    The Dynamics AX best-practice check tool can be used to check conformance of code
    and objects with the best practices for Dynamics AX. This tool can be utilized
    in three different ways at compilation time (only if Diagnostic level is set to
    Level 4), at check-in time, and manually at any time.


    To set the diagnostics level to level 4, go to Tools | Options | Compiler and
    set the value of Diagnostics level as Level 4.


    To invoke this tool manually, go to one or more node in AOT, and then:


    +   1. Right-click.

    +   2. Select Add-Ins.

    +   3. Select Check Best Practices.'
