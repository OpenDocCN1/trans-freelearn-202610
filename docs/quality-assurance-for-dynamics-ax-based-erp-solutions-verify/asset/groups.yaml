    # About the Author


    Anil Kumar Gupta is a highly experienced Information Technology professional with
    proven Software Test Management and Software Process Improvement expertise. He
    has led various programs in diverse software projects such as ERP, eGovernance,
    eBanking, eLearning, system Software, Application Software, etc. in conjunction
    with Commercial off-the-shelf (COTS) products, Business Process Management (BPM),
    Customer Relationship Management (CRM), and Enterprise Resource Planning (ERP)
    technology solutions, J2EE, and .Net to meet and exceed challenging business needs
    in both the commercial and governmental sectors. His 10+ year professional career
    combines expertise and strong technical qualifications in many domains including
    but not restricted to Systems Engineering and Integration, Financial Services,
    and ERPs for Manufacturing and Process Industries using computer tools to solve
    complex engineering problems. His exceptional analytical and communications skills,
    along with effective interaction with management, vendors, customers, and staff,
    have allowed meeting aggressive deadlines under pressure. At the same time, Mr.
    Gupta identified, managed, and resolved multiple complex project tasks that included
    changing priorities in both team and single-person environments. Mr. Gupta provides
    strong collaborative management, which is task-oriented with attention given to
    required details and accuracy. Mr. Gupta is a self-motivated, energetic, dependable,
    flexible, assertive, attentive, and resourceful manager, who provides effective
    team support that combines interpersonal, coordination, mentoring, and verbal
    and written communication skills.


    During his professional career he has met many challenges, which included the
    establishment of QA and Testing practice at EuroInfo Systems Pvt. Ltd. (Currently
    known as Tectura India). Tectura India is the largest MBS solution provider in
    India and globally Tectura is the biggest MBS solution provider. EIS was the pioneer
    in establishing a separate QC department in 2004 and this challenge was given
    to Anil. Due to his successful quality initiatives EIS was awarded the Global
    Axapta Excellence Award for the year 2005, among 1000 MBS partners. The author
    is the most experienced resource for Dynamics AX Testing in India and has worked
    for multiple IBI-compliant Dynamics AX ISV projects.'
