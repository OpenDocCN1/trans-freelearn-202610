  mdcn: "\n- **灵活性**：ERP 解决方案可能需要根据企业组织的需求进行修改（包括配置和编码），而这些需求可能随着业务规模、战略或法律制度的变化而随时间变化。它应能够在不同的硬件和数据库上运行，以使用公司异构的系统集合。ERP\
    \ 应该可定制，以便 ERP 业务流程可以根据组织的独特业务流程进行修改。\n- **可用性**：该解决方案必须对终端用户有用，以完成其使命，同时实现“工作乐趣”。这可以通过采用已知标准、一致性和直观的\
    \ UI 设计来实现。\n- **业务流程的连贯性**：只有当 ERP 解决方案提供业务流程的连贯性时，其优势才能发挥出来，即信息在所有需要的地方都可用，不必重复输入相同的数据，并且现有信息在相关且可能的情况下得到重复使用。\n\
    - **模块化**：ERP 系统应具有开放的系统架构。这意味着任何模块都应具有在需要时进行接口连接或分离的能力，而不会影响其他模块。\n- **集成**：企业可能已经在使用某些\
    \ IT 基础设施，并且由于某些原因（例如成本、战略原因等）可能不希望整个基础设施发生变化。应易于将新模块或外部应用程序集成到现有解决方案中。\n- **可信度**：ERP\
    \ 系统应值得信赖，即应具有以下属性：\n  - **安全性**：确保信息和数据安全且保密。\n  - **隐私**：信息安全至关重要，否则竞争对手可能会利用业务关键数据的利益以及各种业务流程的方法。因此隐私是关键要素。\n\
    \  - **可靠性**：在当今极其复杂的 IT 应用（如 ERP 解决方案）中，端到端可靠性是满足客户期望并使 ERP 应用值得信赖的关键挑战。\n- **响应性**：ERP\
    \ 系统不仅应处理正常负载条件，还应处理异常条件，例如由于结账报告和预测报告而导致财年末的繁重工作负载。\n- **国际化：** 如果 ERP 系统在多个地理位置实施或使用，ERP\
    \ 解决方案必须正确国际化，具有：\n  - 不同的语言和字符集。\n  - 能够以每个区域使用的格式呈现数据。\n- **本地化：** 每当实施 ERP\
    \ 系统时，定制的主要成本发生在两件事上：根据本地需求进行本地化以及根据行业或特定部门需求进行适配。本地化 ERP 系统时需要考虑以下因素：\n  - 政府、法律和市场要求：例如工资单中的社会医疗福利、企业的周工作日（因为它们在世界不同地区不同）。\n\
    \  - 文化：例如，在某些地方一个人的名字可能由两部分组成——名字和姓氏——而在世界其他地区，它可能由五部分组成。\n  - 标准：例如财务报告标准。\n\
    \  - 格式：例如日期、时间。\n  - 货币。\n  - 时区。\n  - 用户。\n- **可扩展性：** 业务规模会随时间变化，因此小型 ERP 解决方案——几个模块、启用少量功能、少量用户、仅少量交易——应能够（并且预期！）增长。\n\
    - **代码文档：** 一旦 ERP 系统实施，它可能使用数年，因此可能由多个开发人员或公司维护。在其生命周期中，由于业务需求的变化可能需要修改，因此有必要理解各种开发人员编写的代码以便进行修改。因此需要代码文档。代码应从不同角度进行良好记录，例如代码更改、与代码更改相关的功能等。\n\
    \n## ERP 系统的优势\n\nERP 系统的优势可以分为以下类别：\n\n- 运营控制\n- 管理控制\n- 战略规划\n\n现在我们将讨论这些类别的所有优势。\n\
    \n## 运营控制\n\nERP 系统的关键优势是改善运营控制，因此提供以下好处：\n\n- 通过更好的规划降低运营成本（从而提高资源利用率）\n- 由于更好的可见性和效率，降低库存控制成本\n\
    - 由于重复工作减少而节省成本\n- 减少非增值活动（精益处理）\n- 由于运营高效而提高产能利用率\n- 由于更好的客户期望管理而降低 CRM 成本，即满足时间表以及由于运营控制改善而节省成本\n\
    - 遵守既定流程\n\n## 管理控制\n\nERP 系统的另一个关键优势是改善管理控制。ERP 系统提供更好的数据访问性，以便管理层可以实时访问信息以进行决策和管理控制。ERP\
    \ 系统有助于跟踪活动的实际成本并执行基于活动的成本核算。\n\n该类别中的一些好处如下：\n\n- 通过更准确的实时数据以及历史数据改善决策\n- 业务所有相关部门均可获得即时信息\n\
    - 企业范围内的数据标准化和准确性，因为它允许单点输入（即在该数据的源头），从而实现单一事实来源\n- 减少前置时间和周期时间，从而更容易满足客户对时间线的期望\n\
    \n## 战略规划\n\nERP 系统使高层管理者能够进行战略规划，即规划未来目标和目标，并制定实现这些目标和目标的策略，同时考虑历史数据。\n\n- 由于历史数据和分析数据的可用性，规划和预测得到改善\n\
    - 通过扩展的财务估算能力、现金流分析和各种交易监控，实现更好的财务控制\n\n## ERP 系统的缺点\n\n尽管我们讨论了很多 ERP 的好处，但事物都有两面性，ERP\
    \ 系统也不例外。以下是 ERP 系统的几个缺点：\n\n- **在许多情况下定制有限：** 许多 ERP 解决方案不允许在报告以外的定制，即报告中包含的信息和信息的呈现方式。这对\
    \ ERP 系统的优势造成了严重限制，因为企业肯定各不相同。没有两个企业完全相同。因此，一个真正设计良好的全球 ERP 系统应 readily 允许合作伙伴和客户进行定制，以充分发挥系统的潜力，实现其全部潜力。不幸的是，除了\
    \ Dynamics AX 之外，几乎所有其他 ERP 解决方案在定制方面都有太多限制。\n- **需要重新设计业务流程：** 如前所述，几乎所有 ERP\
    \ 解决方案都不允许太多定制，因此企业被迫采用该 ERP 系统建议的业务流程，这可能涉及风险。企业可能不愿意重新设计其业务流程，因为它们使用的是经过时间考验且适合其定制需求和条件的流程。由于\
    \ Dynamics AX 允许在几乎所有领域进行定制，因此不存在这种风险，因为业务流程再造的需求最小。\n- **僵化：** ERP 解决方案对于特定组织可能过于僵化，这些组织是新成立的或希望在不久的将来朝新方向发展。\n\
    \n## Dynamics AX 简介\n\nMicrosoft Dynamics AX 是一款集成且可适应的业务管理解决方案，提供极大的灵活性和易于适应不断变化的业务需求。换句话说，它通过提供完整的易于使用的、可扩展的企业资源规划（ERP）软件包来提供竞争优势，以实现财务、客户关系、业务服务、人力资源和供应链流程的自动化和简化。\n\
    \n传统 ERP 供应商劝说客户不要定制软件以便于升级等。正如我们之前讨论的，每个企业都有一些独特性，这使该企业组织领先一步。这样的独特功能只能通过定制 ERP\
    \ 系统来实现。如果 ERP 系统阻止企业遵循提供竞争优势的独特业务流程，就不会有人有兴趣部署这样的系统。因此 ERP 系统应易于定制。它肯定能使企业充分利用系统，实现其全部潜力。\n\
    \nMicrosoft Dynamics AX 是一款可适应的业务管理解决方案，尤其适用于制造/分销、电子商务、批发或服务行业。它为制造商提供广泛的功能，支持在离散和批量加工制造模式下，按订单生产、按工程生产和按预测生产供应链模型。\n\
    \nDynamics AX 还提供一系列财务功能，包括能够合并子公司或配送中心的账户，并让员工根据其职位级别访问会计、报告和广泛的分析工具。Dynamics\
    \ AX 为您提供快速可靠的数据输入和处理所需的一切，并使您能够做出明智的决策并实现业务目标。\n\n> Microsoft Dynamics AX 将使我们能够在今后高效有效地管理业务。它使我们能够继续发展一个成本效益高的环境，而不会有以前不得不面对的功能限制。——\
    \ Pascal Kouknas，IT 总监 Dynamics AX 和亚太区，Esselte (http://www.esselte.com) (Source:\
    \ http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=1000003878)。\n\
    \n## Dynamics AX 作为理想的 ERP 系统\n\n我们已经讨论了理想 ERP 系统的品质，现在我们将讨论 Dynamics AX 所具备的品质。\n\
    \n"
