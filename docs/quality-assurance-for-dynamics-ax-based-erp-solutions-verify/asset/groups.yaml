    # Totals Forms


    The **Totals** forms are used to display aggregated data. Various **Totals** forms
    can be accessed from **Tools | Development tools | Code profiler | Profiler runs
    | Totals.**


    Line total form: Displays aggregated data about total amount of time spent on
    executing each line of code for a code profiler run.


    Method total form: Displays aggregated data about total amount of time spent on
    executing each method for a code profiler run.


    Object total form: Displays aggregated data about total amount of time spent on
    executing each object for a code profiler run.


