  - '[PAGE 21]


    +   - **Flexibility**: An ERP solution may have to be modified (both in configuration
    and coding) as per the needs of the business organization, which may change with
    time due to changes in business size, strategy, or legal system. It should be
    able to run on different hardware and databases to use the company''s heterogeneous
    collection of systems. The ERP should be customizable so that ERP business processes
    can be modified as per the unique business processes of the organization.

    +   - **Usability**: The solution must be useful to the end user to fulfill his
    or her mission, and enable "Joy of Work" at the same time. This can be turned
    into reality by adopting known standards, consistency, and intuitive UI design.

    +   - **Coherence of business processes**: The advantages of an ERP solution can
    be unleashed only when it offers coherence of business processes, i.e. information
    is available at all required places, it is not necessary to enter the same data
    twice, and the existing information is reused wherever relevant and possible.

    +   - **Modular**: An ERP system should have open system architecture. This means
    that any module should have the capability to be interfaced or detached whenever
    required without affecting the other modules.

    +   - **Integration**: Enterprises may already be using some IT infrastructure
    and might not want the complete infrastructure to change for some reason (such
    as cost, strategic reasons, etc.). It should be easy to integrate new modules
    or external applications to the existing solutions.

    +   - **Trustworthiness**: An ERP system should be trustworthy i.e. it should
    have the following attributes:

    +     - **Security**: To ensure that information and data are safe and confidential.

    +     - **Privacy**: Information security is essential else competitors could
    reap the benefits of business-critical data as well as the methodology for various
    business processes. Hence privacy is a critical element.

    +     - **Reliability**: In today''s extremely complex IT applications such as
    ERP solutions, end-to-end reliability is a key challenge for meeting customers''
    expectations and making an ERP application trustworthy.

    +   - **Responsiveness**: An ERP system should not only handle normal load conditions
    but also abnormal conditions, such as heavy workloads at the end of financial
    year due to closing reports and projection reports.'
  - '[PAGE 22]


    +   - **Internationalization:** If an ERP system is being implemented or used
    in multiple geographic locations, the ERP solution must be properly internationalized
    with:

    +     - Different languages and character sets.

    +     - Ability to present data in a format used in each locale.

    +   - **Localization:** Whenever an ERP system is implemented, the major cost
    of customization occurs for two things, localization as per local needs and adaptation
    as per industry or sector-specific needs. The following need to be considered
    to localize an ERP system:

    +     - Governmental, legal, and market requirements: e.g. social medical benefits
    in payroll, weekdays for a business (as they are different in different parts
    of the world).

    +     - Cultures: e.g. in some places the name of a person may consists of two
    parts – the first and last – while in other parts of the world, it may be composed
    of five parts.

    +     - Standards: e.g. financial reporting standards.

    +     - Formats: e.g. date, time.

    +     - Currencies.

    +     - Time zones.

    +     - Users.

    +   - **Scalability:** Business sizes change with time and hence a small ERP solution
    – few modules, few features enabled, few users, and only a few transactions –
    should be able (and is expected!) to grow.

    +   - **Code documentation:** Once an ERP system is implemented, it may be used
    for several years and hence may be maintained by several developers or companies.
    During its life span it may require modification due to changes in the business
    needs and hence it is necessary to understand the code written by various developers
    in order to modify it. Hence code documentation is needed. Code should be well
    documented from different perspectives such as code changes, features related
    to code changes, etc.


    # Advantages of an ERP System


    The benefits of ERP systems can be categorized into the following categories:


    +   - Operational control

    +   - Management control

    +   - Strategic planning'
  - '[PAGE 23]


    Now we will discuss all the benefits of these categories.


    # Operational Control


    The critical advantage of an ERP system is improved operational control and hence
    the following benefits are offered:


    +   - Reduced operating costs by better planning (and hence improved resource
    utilization)

    +   - Lower inventory control cost due to better visibility and efficiency

    +   - Cost savings due to reduction in duplicated efforts

    +   - Reduction in non-value added activities (lean processing)

    +   - Improved capacity utilization due to efficient operations

    +   - Lower CRM cost due to better customer expectation management i.e. meeting
    timeline and cost savings due to improved operational control

    +   - Adherence to defined process


    # Management Control


    Another critical advantage of an ERP system is improved management control. ERP
    systems offer better accessibility to data so that management can have up-to-the-minute
    access to information for decision making and managerial control. An ERP system
    helps track actual costs of activities and performs activity-based costing.


    A few benefits in this category are as follows:


    +   - Improvement in decision making through more accurate and real-time data
    as well as historic data

    +   - Availability of instant information to all concerned organs of the business

    +   - Data standardization and accuracy across the enterprise as it allows Single
    Point of Entry (i.e. at the source of that data), and hence single source of truth

    +   - Reduced Lead and Cycle Times and hence ease in meeting customer expectations
    regarding timelines'
  - '[PAGE 24]


    # Strategic Planning


    An ERP system enables top management for strategic planning i.e. planning future
    goals and objectives and formulating strategies to achieve those goals and objectives
    keeping historical data in consideration.


    +   - Improved planning and forecasting due to availability of historical data
    and analysis data

    +   - Better financial control through extended capabilities for financial estimations,
    analysis of cash flow, and monitoring of various transactions


    # Disadvantages of an ERP System


    Though we have discussed a lot about the benefits of ERP, there are two sides
    to every coin and an ERP system is not an exception. Here are a few disadvantages
    of ERP systems:


    +   - **Customization is limited in many situations:** Many of the ERP solutions
    don''t allow customization in other than reporting i.e. the information contained
    in a report and presentation of information. It poses serious limitations on the
    advantages of an ERP system, since businesses differ from one another for sure.
    No two businesses are exactly the same. So a true well designed global ERP system
    should readily allow partners and customers to customize and get the most out
    of the system to realize their full potential. Unfortunately, except Dynamics
    AX, almost all other ERP solutions have too many limitations on customization.

    +   - **The need to reengineer business processes:** As mentioned earlier almost
    all ERP solutions don''t allow much customization, and hence businesses are compelled
    to adopt the business processes suggested by that ERP system, which may involve
    risk. Businesses may not be willing to reengineer their business processes as
    they are using time-proven processes suitable for their custom needs and conditions.
    Since Dynamics AX allows customization in almost all areas, this risk is not involved
    as there is minimal need for business process reengineering.

    +   - **Rigidity:** ERP solutions may be too rigid for specific organizations
    that are either new or want to move in a new direction in the near future.'
  - '[PAGE 25]


    # Introduction to Dynamics AX


    Microsoft Dynamics AX is an integrated, adaptable business management solution
    that offers great flexibility and easily adapts itself to ever-changing business
    needs. In other words it offers competitive advantage by delivering a complete
    easy-to-use, scalable enterprise resource planning (ERP) package to automate and
    streamline processes across your financials, customer relationships, business
    services, human resources, and supply chain.


    Traditional ERP vendors appealed customers not to customize the software for ease
    of upgrade, etc. As we discussed earlier, every business has some uniqueness,
    which gives that business organization a leading edge. Such unique features can
    only be implemented in an ERP system by customizing it. If an ERP system prevents
    businesses from following unique business processes that provide them a competitive
    advantage, nobody will be interested in deploying such a system. Hence an ERP
    system should be easily customizable. It will definitely enable businesses to
    get most out of the system to realize their full potential.


    Microsoft Dynamics AX is an adaptable business management solution useful especially
    if you''re in the manufacturing/ distribution, e-business, wholesale, or service
    industry. It offers manufacturers a broad functionality that supports build-to-order,
    engineer-to-order, and build-to-forecast supply chain models across both discrete
    and batch-process manufacturing modes.


    Dynamics AX also delivers a range of financial capabilities including the ability
    to consolidate accounts with subsidiaries or distribution centers and give employees
    access to accounting, reporting, and extensive analysis tools at levels appropriate
    to their positions. Dynamics AX gives you everything you need for fast and reliable
    data intake and processing, and enables you to make informed decisions and achieve
    business goals.


    > Microsoft Dynamics AX will allow us to efficiently and effectively manage our
    business going forward. It allows us to continue to develop an environment that
    is cost effective without the functional limitations we had to contend with previously.
    — Pascal Kouk nas, IT Director Dynamics AX and Asia Pacific, Esselte (http://www.esselte.com)
    (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=1000003878).


    # Dynamics AX as an Ideal ERP System


    We have discussed the qualities of an ideal ERP system, now we will discuss the
    qualities that Dynamics AX possesses.'
