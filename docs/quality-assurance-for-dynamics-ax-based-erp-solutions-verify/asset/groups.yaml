  - '[PAGE 34]


    # Feature Keys


    In any ERP solution we can classify three kinds of features:


    +   - Standard features that fit the need of the customer

    +   - Standard extra features that are not to be used in an implementation

    +   - Customization to fit the ERP to a business scenario


    Isolation of unwanted features, i.e. making a subset of standard functionality
    by disabling a few features, can be easily done by enabling or disabling feature
    key codes. Using feature keys, one can create a subset of the standard functionality
    for an installation. The feature key system can work for a single user or a user
    group. This feature is another tool that makes Dynamics AX a highly adaptable
    ERP.


    Feature keys not only work on tables, forms, reports, queries, and menus, but
    also beyond that, i.e. on individual classes or methods.


    # X++ Programming Language


    The language that is used for development and writing classes and methods in Microsoft
    Dynamics AX''s integrated development environment is an Object-Oriented language
    similar to Sun Microsystems JAVA and C++. It is based on JAVA with SQL embedded
    into the code. The language has extensive checking system for object references
    both at the time of compiling and also at run time. If any object in the system
    is found without reference then its storage is reclaimed.


    The X++ language follows OOPS concepts and the concept of inheritance is valid
    as in any other Object-Oriented language. It offers a great advantage as the changes
    made in the properties at one place in Microsoft Dynamics AX should be reflected/
    inherited at all the places where that object is being used within Microsoft Dynamics
    AX. If, for example, the display property of a database field is changed from
    a length of 10 to a length 15 characters then it gets changed in all the forms
    where this field is shown or used.


    A statement written in any language may be syntactically correct but it is not
    an assurance that it is as per the recommended best practices of programming.
    Dynamics AX has a built-in tool known as Dynamics AX Best Practice Check Tool.'
  - '[PAGE 35]


    # Dynamics AX Best Practice Check Tool


    Reviewing code is very time consuming as it requires reviewing each statement
    against a large number of checkpoints. Manual reviewing of code against such a
    large number of quality checkpoints is almost impossible due to cost reasons.
    Dynamics AX has an inbuilt tool for code scanning. It is named Dynamics AX Best
    Practices Check tool or ABC tool. It validates the code against over 200 checkpoints.


    # Application Component Management


    All the objects in Microsoft Dynamics IDE can be effectively managed by automatically
    attaching identification of the developer who modifies any object with a date
    and time stamp.


    The components are locked and checked out of the system when they are being worked
    upon. After the developer has finished working, the components are unlocked and
    checked into the system.


    # Dynamics AX Layer System


    Dynamics AX offers complete flexibility to customize every aspect of it (functionality
    and Graphical User Interface, etc.) and elegantly preserve the various changes
    made by different parties in its own containers i.e. layers.


    The Dynamics AX application layers are a hierarchy of levels in the Dynamics AX
    application source code, which ensures that you can make modifications and additions
    without interfering with the application objects on the level below your own.


    Microsoft Dynamics AX customizations are easier to build and maintain due to the
    layered technology, which facilitates customizations by different partners in
    different layers. You can customize the features coded in one without affecting
    the features coded in other layers. This means that you can adapt and upgrade
    your solution over time with less disruption to business, risk, and expense (i.e.
    less risk, high adaptability, and lower TCO). For example you could choose to
    add a field to a standard form. The addition would be saved in your current level;
    the revised form would replace the standard form, but you would always be able
    to go back to the original one on the level below your own by simply removing
    the new form, and hence you can work with minimal risk of business disruption
    as you can always work with already working functionality.'
  - '[PAGE 36]


    # Introduction to Dynamics AX


    The Dynamics AX application layer hierarchy consists of sixteen layers, which
    are divided into groups with two layers in each group, i.e. eight different layer
    categories. Each of them has a patch layer also, which is for handling patches,
    minor updates, service packs, hot fixes, and additional functionality. This layer
    design is a clear indication that Dynamics AX is built to accommodate changes
    by multiple parties elegantly and encourages customization. The Dynamics AX layers
    are designed for different Dynamics AX groups as well as for use in different
    types of customization, as described in following table. Layers are mentioned
    in the order from bottom to top:


    | Layer | User Groups | Characteristics |

    |---|---|---|

    | SYS (System) | Microsoft | - The inner-most layer.<br>- The layer used to implement
    standard Dynamics AX applications.<br>- The application objects in this layer
    can never be deleted. |

    | GLS (Global Solutions) | MBS Certified third parties | - The solutions have
    been created with the same development standards as the standard application,
    and qualified as such.<br>- The solutions implemented in this layer are delivered
    as a standard part of the Dynamics AX product.<br>- These are not industry-specific
    verticals, rather these are core dynamics such as the Human Resource module. |

    | DIS (Distributor) | - Local Microsoft Business Solutions offices<br>- IBI-compliant
    solution provider who offers country specific solutions too | - DIS layer to include
    country-specific functionality.<br>- Localized Application developed by IBI solution
    provider will remain in the DIS layer. |'
  - '[PAGE 37]


    | Layer | User Groups | Characteristics |

    |---|---|---|

    | LOS (Local Solution) | Local MBS offices | - Solutions in the LOS layer are
    protected by the license code framework that the standard application utilizes.<br>-
    If local MBS offices want to certify and distribute a strategic local solution
    that has not been developed in-house (e.g. Payroll), the solution must be implemented
    in the LOS layer. |

    | BUS (Business Solution) | Business Partners | - Business partners develop and
    distribute vertical and horizontal solutions to other partners and customers using
    the BUS layer.<br>- Reserved for Add-on/Vertical solution.<br>- A business partner
    can implement any solution in this layer only after written agreement from MBS.
    |

    | VAR (Value Added Reseller) | Business Partners | - Business partners can use
    this layer without any business-related restrictions. |

    | CUS (Customer) | - Corporate enterprizes<br>- Business partners | - Corporate
    enterprises, as well as business partners can modify this layer.<br>- The Customer
    and User layers are included in order to support enterprizes and individual companies
    in their need for in-house development, without jeopardizing the modifications
    made by the business partner. |

    | USR (User) | End users | - Individual companies or companies within an enterprize
    can utilize this layer to make customizations that are unique to the customer''s
    installation. |'
  - '[PAGE 38]


    # Introduction to Dynamics AX


    Besides these main application layers, there are patch layers, which can be distinguished
    from the other application layers by the use of the letter P in the end of the
    layer name. The layers are: SYP, GLP, DIP, LIP, BUP, VAP, CUP, and USP. The utilization
    of the patch layers is not subject to any predefined MBS rules, and hence they
    can be used to support the customers/business partners in any way suitable. This
    procedure provides the option of sending out corrections without interfering with
    the existing layers.


    All application layers are able to utilize all the tools available in the Dynamics
    AX MorphX Development Suite as well as all object types, tables, classes, macros,
    extended data types, forms, reports, and so forth. The online help is also included
    in the Layers technology, as well as the utilization of the label system.


    Having all the object types available in every application layer makes the application
    layer technology very flexible and dynamic


    # Dynamics AX Customization Files


    Each layer is technically saved in a separate file called `Ax<layer>.aod`, for
    example `Axsy s.aod` for the SYS layer, `Axdis.aod` for the DIS layer, and so
    on. The `.aod` extension is an acronym for Application Object Data file. The files
    are stored in the `Dynamics AX Standard` folder under `Appl`.


    Besides `Ax<layer>.aod` there are a few other files that hold different kinds
    of data for a layer as described in the following table.


    | Sr. no. | Naming Convention | Description |

    |---|---|---|

    | 1 | Axapd.aoi | - aoi stands for "application object index".

    - It tells Dynamics AX where to find each individual object.

    - The file will be rebuilt the next time you log on to Dynamics AX after any customization.
    |

    | 2 | ax<layer><language>.ald | - ald stands for "application label data".

    - Separate file for each language in each layer. |

    | 3 | ax<layer><language>.alc | - alc stands for "application label comments".

    - Separate for each language in each layer. |

    | 4 | ax<layer><language>.ali | - ali stands for "application label index". |


    It should be noted that no user should be connected when the above files are directly
    copied, deleted, etc.'
