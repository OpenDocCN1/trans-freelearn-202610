  mdcn: "\n## 安全漏洞分类\n\n安全漏洞按照 STRIDE 进行分类，因此正确对漏洞进行分类至关重要：\n\n- **欺骗：** 如果用户冒充另一个实体或个人。欺骗的其他术语有冒名、伪装或身份盗用。\n\
    - **篡改：** 如果通过诸如 SQL 注入等技术对数据进行未经授权的修改。其其他术语可能是（数据）完整性。\n- **否认：** 如果用户否认已执行某个操作，且没有足够的证据证明相反的情况。\n\
    - **信息泄露：** 如果信息被未经授权的人员访问。\n- **拒绝服务：** 如果人们滥用功能，意图制造压力状况，从而使其他真实用户无法舒适地使用系统。\n\
    - **权限提升：** 如果用户获得超出其应有权限的更多权限。\n- **攻击面减小：** 如果对权限最低的用户（如匿名用户）的代码访问被减少。\n\n缺陷管理工具必须提供一个额外的选项\
    \ '不是安全漏洞' 来声明某个问题不是安全相关问题。\n\n## 安全漏洞的根本原因分析\n\n必须对所有安全漏洞进行根本原因分析。根据其来源，安全漏洞可归类为以下一种类型：\n\
    \n- 不是安全漏洞。\n- **缓冲区溢出或欠溢：** 当变量的大小不足以容纳给定值时发生，内存缓冲区会被额外数据覆盖。缓冲区溢出是最常见且危害最大的安全风险之一。在设计或编码时，确保声明的变量具有足够的尺寸或精度来处理最大或最小可能值。缓冲区溢出的几种类型有堆溢出、基于栈的缓冲区溢出、V-表和函数指针覆盖以及异常处理程序覆盖。缓冲区溢出可能导致访问违规、不稳定以及用于恶意目的的代码注入。\n\
    - 算术错误：当变量的限制（任一上限或下限范围边界）被超过时发生。例如，整数溢出。算术错误可分为两种——溢出和欠溢。溢出发生在要存储的值超过变量存储容量的上限时，欠溢发生在要存储的值小于变量的下限时。算术错误可能导致更严重的错误，如缓冲区溢出或缓冲区欠溢。\n\
    - SQL/脚本注入：这是在用户输入中添加 SQL 语句的过程，可能用于绕过授权、调用内置存储过程并探测数据库。当使用用户输入动态构建 SQL 语句时可能发生\
    \ SQL 注入攻击；黑客可以在用户输入中添加 SQL 语句的一部分，从而使生成的 SQL 语句执行恶意操作。\n- 跨站脚本：此攻击发生在用户输入未经有效性检查直接输出时。例如，如果在讨论论坛中输入了恶意\
    \ JavaScript，则每当用户打开该论坛时，此恶意 JavaScript 代码就会在客户端机器上执行。另一个例子可能是使用电子邮件中的表单标签窃取客户端\
    \ cookie。\n- 加密弱点：当使用弱算法或密钥未安全存储时发生。有时这是由于人为工程因素造成的。\n- 弱认证：认证机制应足够强，用户不应通过任何手段（如\
    \ SQL 注入、规范化等）绕过它。\n- 弱授权或不当的访问控制列表：应为每项资产精确设置授权级别；应正确设置。\n- 秘密隐藏无效：这发生在向用户提供某些秘密信息时。几个例子是错误消息、异常处理等。\n\
    - 无限资源消耗（DoS）：当向未经授权的用户提供过多服务时发生。例如，在从数据库检索任何数据之前，应尽早检查（而不是仅在向用户显示信息前检查）用户是否被授权访问该信息。DoS\
    \ 攻击可分为四种类型：CPU 饥饿、内存饥饿、资源饥饿和网络饥饿。当用户输入被信任超过所需程度、在检查授权之前执行昂贵操作，或安全设计中未涉及适当安全时，应考虑此威胁。\n\
    - 不正确/无路径名：文件或路径名可以以多种方式编码，因此不正确的路径名可能导致规范化错误。应避免包含空格或特殊字符（如 &、? 或 +）的路径名。\n-\
    \ 规范化错误：当安全决策基于文件名且在解析文件名、URL 或设备名时发生解析错误时出现。这可能导致对被访问资源应用不正确的权限。\n- 其他等，如意外泄露（例如由于不适当或缺少错误消息或不良安全实践导致用户操作错误）、目录遍历，以及未处理的异常或异常处理不当，从而导致用户获取有价值的信息。\n\
    \n## 使用 DREAD 模型进行重要性识别\n\n为了对每个安全问题采取适当措施，需要识别其重要性。DREAD 是计算安全漏洞重要性的有用工具。DREAD\
    \ 代表：\n\n- 损害潜力：对系统的损害程度会如何？\n- 可再现性：是否容易一再产生相同的攻击？\n- 可利用性：实施攻击需要多少努力或实验？\n-\
    \ 受影响用户：有多少百分比的人会受到此威胁影响？\n- 可发现性：此攻击是否可以被轻易发现？\n\n为 DREAD 的五个组成部分中的每一个分配 1 到\
    \ 10 的值，然后为每个安全威胁计算评级总和。此总和值表示安全威胁的重要性级别。\n\n根据 DREAD 中的总和值，可对每个威胁采取以下措施：\n\n\
    - 不采取行动：如果 DREAD 值为非常低。\n- 告知客户所有信息：如果 DREAD 值为非常低。\n- 禁用或移除功能：如果 DREAD 值为中等到高，且修复成本相对于投资回报率来说非常高。\n\
    - 修复它：如果 DREAD 值为中等到高，且修复并不复杂。\n\n缺陷管理工具应能够接受上述其中一个值作为关闭解决方案。\n\n## 缺陷管理工具\n\n\
    缺陷管理工具必须支持分类并为分类提供适当的级别。除此之外，根据 IBI 规范对 Dynamics AX 的规定，缺陷管理工具还有一些额外的要求。\n\n-\
    \ 缺陷管理系统必须具备注册、跟踪和报告以下内容的 capability：\n  - 缺陷\n  - 问题\n  - 设计变更请求\n- 缺陷管理工具必须接受或为每个缺陷生成以下信息：\n\
    \  - 唯一编号（自动生成）\n  - 缺陷描述\n  - 缺陷优先级（上面提到的四个级别）\n  - 缺陷严重性（上面提到的四个级别）\n  - 评论记录，以显示缺陷在其生命周期内是如何处理的\n\
    \  - 关闭评论\n- 缺陷管理工具应根据上述提到的不同分类标准以及状态生成报告。\n- 缺陷管理工具必须为所有开放缺陷生成报告（即状态为进行中、正在调查、需要更多信息、等待客户澄清、已延期等）。这有助于在任何时间点生成所有已知缺陷的报告。\n\
    - 缺陷管理工具必须接受安全相关缺陷的额外信息。\n- 缺陷管理工具在发现安全相关问题后必须采取行动：\n  - 必须修复：诸如写访问违规、栈溢出异常等问题\n\
    \  - 必须调查：大内存分配、整数溢出、自定义异常、可能导致可利用崩溃的其他系统级异常\n"
