  - '[PAGE 74]


    Dynamics AX has three types of delete actions; selection of one will solely depend
    upon the custom requirements.


    # Table Methods


    The tables in Dynamics AX have several properties such as delete, validateDelete,
    etc. and hence Dynamics AX recommends that you should not write methods or X++
    code to implement something that can be done just by setting property values.


    Dynamics AX recommends using inbuilt table methods for those custom requirements
    that cannot be met with table properties settings. Some of the table methods are
    mandatory to implement e.g. find and exists methods.


    # Classes


    The classes have a peculiarity that they may have both a back end (database) and
    front end (GUI). The front interface should be easy to use and at the same time
    as secure as possible. The implementation details of the class should always be
    hidden from the user and hence use of private or protected methods is recommended.
    The back-end methods are highly secure, standardized, and reliable and hence use
    of private or protected methods is recommended in prescribed design patterns.
    The design patterns depend upon the type of class. Classes can be categorized
    in the following categories:


    +   - Real object

    +   - Action class

    +   - Supporting class


    The following are a few common best practices related to declaration:


    +   - Object member variables must only be used to hold the state of the object
    i.e. variables for which values should be kept between and outside instance method
    calls.

    +   - Use of global variables must be minimized.

    +   - Unused variables must be cleaned up; a tool available at Add-Ins | Best
    Practices | Check Variables can be used to know the unused variables.

    +   - Constants used in more than one method in a class (or in subclass) should
    be declared during class declaration.


    There is a rich set of best practices for classes and the Best Practices for Microsoft
    Dynamics AX Development released by Microsoft would be good read.'
  - '[PAGE 75]


    # Forms


    The forms are in the presentation tier in any three-tier architecture system.
    Most of them are related to look and feel or layout, which we will discuss it
    in Chapter 4, *Best Practices – GUI*. Some other best practices for forms revolve
    around the following characteristics:


    +   - Use of Intellimorph maximally

    +   - No forced date or time format

    +   - No forced layout such as fixed width for label, position control for GUI
    controls, etc.

    +   - Use of label files for GUI text

    +   - Forms having minimal coding


    # Avoid Coding on Forms


    The basic concept of three-tier architecture is that forms should be used only
    for the presentation tier and hence no other code such as business logic should
    be there on forms. The code placed on forms also reduces their reusability and
    the ease of further customization; e.g. if you want to develop an enterprise portal,
    the code written on forms will have to be written again in classes or table methods,
    etc., which will make the implementation complex. Another example may be when
    you want to ''COM enable'' your business logic; form code related to business
    logic will make your life almost impossible.


    Any code (other than presentation logic) written on forms imposes limitation on
    performance as call between two different layers increase slowing the performance
    and hence code on forms should be avoided as much as possible. In cases where
    avoiding code on forms is not possible the guidelines summarized in the following
    table should be used for writing code on forms.


    | Place to Write Code | Guidelines |

    |---|---|

    | Form level | When code is related to whole form |

    |  | When code is related to multiple data sources |

    |  | Editor or Display methods (only those that are not related to any data source)
    |

    | Data source | Data source-related Edit or Display methods |

    |  | Code related only to the data source that cannot be effectively placed in
    a table method |

    | Controls | When it is strictly related to the controls |'
