    \ and understanding the internal component structure working of the system. Once\
    \ this is done, usage scenarios are studied in order to understand how the system\
    \ will be used. This will help understand the use scenarios beyond the security\
    \ architecture. After use scenarios, the dependencies are studied, as some of\
    \ the dependencies on other systems may affect the security of the system under\
    \ consideration for threat modeling.\n\n在识别出入口点或接口之后，威胁建模的下一步是描述系统的安全性，这涉及绑定威胁模型、收集安全关键的依赖项信息，以及理解系统的内部组件结构和工作方式。完成此步骤后，会研究使用场景以了解系统将如何被使用。这有助于理解超出安全架构的使用场景。在研究使用场景之后，会研究依赖项，因为对其他系统的某些依赖可能会影响正在进行威胁建模的系统的安全性。\n\
    \nAfter collecting all the information, the system is modeled as a data flow diagram\
    \ or control flow diagram to understand the system action for various use scenarios\
    \ and data or control flow across the trust boundaries, etc. The objective of\
    \ this activity is to know the following:\n\n收集所有信息后，系统被建模为数据流图或控制流图，以便了解各种使用场景下的系统行为以及跨信任边界的数据或控制流等。此活动的目标是了解以下内容：\n\
    \n- How are protected resources affected?\n- 受保护资源如何受到影响？\n- Where could an external\
