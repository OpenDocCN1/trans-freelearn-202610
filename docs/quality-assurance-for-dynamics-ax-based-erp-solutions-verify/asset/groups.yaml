  mdcn: '

    ## 总拥有成本 (TCO)


    在任何商业组织中，成本都是任何新举措的首要关注点；ERP 系统也不例外。Dynamics AX 因以下独特功能而提供成本优势：


    - Dynamics AX 为 Web 和 Microsoft Windows 客户端提供相同的代码版本，这导致开发和 IT 成本更简单、更低廉，并为分布式或拥有移动劳动力的企业提供了极大的便利。

    - 用于行业特定垂直领域和国家特定本地化的独立层不仅提供成本节约，还减少了实施 Dynamics AX 所需的工作量。

    - 由于 Microsoft Dynamics AX 的分层技术，定制可以更轻松地构建和维护。您可以自定义某一层而不影响其他层的功能。这意味着您可以随着时间的推移以较少的业务中断、风险和费用来适应和升级您的解决方案。

    - 由于功能键的缘故，任何功能都可以针对单个用户或用户组启用或禁用。这不仅提供了灵活性，还降低了总拥有成本。

    - 由于 Dynamics AX 是基于通用 Microsoft 标准构建的 ERP 应用，而终端用户通常已熟悉这些标准，因此对终端用户的培训所需的工作量更少。


    ## 灵活性


    灵活性是 ERP 解决方案中的另一个重要方面，但不幸的是大多数当前 ERP 解决方案都缺乏这一点。例如，使用 SAP 之类的 ERP 软件包，您必须遵循 SAP
    对您业务的想法，他们认为您业务和战略的独特性。Dynamics AX 因以下功能而具有优势：


    - **定制灵活性**：Dynamics AX 允许您更改所需的一切。企业将此视为一个很棒的功能。这是您实施的 ERP 能够随业务增长而增长的关键。选择 SAP
    之类的 ERP 软件包，您必须遵循 SAP 对您业务的想法，他们认为对您业务运营的最佳方式。而在 Dynamics AX 中，您拥有控制权，并且在追求最佳业务实践的前提下，这些最佳实践可以应用于您的定制需求。这有助于企业降低总拥有成本。

    - **分层编程：** Microsoft Dynamics AX 提供分层定制技术以便于构建和维护。您可以自定义某一层而不影响其他层的功能。这意味着您可以随着时间的推移以较少的业务中断、风险和费用来适应和升级您的解决方案。

    - **功能键：** 功能键代码是一个很棒的系统。使用功能键，可以针对个人或用户组禁用或启用功能。


    > *Microsoft Dynamics AX 结合了丰富的开箱即用功能和额外的灵活性，使 The Systems Depot 能够调整功能以满足其确切的业务需求。*
    — Jan Sorensen, 高级管理顾问, BKD Technologies (http://www.sdepot.com). (Source: http://www.microsoft.com/casestudies/casestudy.aspx?casestudyid=1000003831.)


    ## 易用性


    只有当终端用户能够高效使用时，任何软件或 ERP 软件包才可被视为成功。Dynamics AX 被认为是一个高度易用的 ERP 软件包，原因如下：


    - **Microsoft 产品：** Dynamics AX 由 Microsoft 拥有并开发。目前 Dynamics AX 4.0 已与 Microsoft
    的不同产品线高度集成，并且随着 Vista、DotNet 3.0、Commerce Server 2007、SharePoint Server 2007、Exchange
    2007 和 Office 2007 的发布，所有这些产品线将与 Dynamics AX 产品更加紧密地集成。这意味着您可以从 SharePoint Excel
    Services 工作，并创建可直接与 Dynamics AX ERP 数据协作的电子表格；并且所有这些都可以通过信息工作者在分散控制的方式下集中管理。除此之外，Microsoft
    还有整合各种 Microsoft 产品的长期愿景，例如，Microsoft 计划支持 Microsoft Office PerformancePoint Server
    的完全集成，并且 Dynamics CRM 将支持与 Dynamics AX 5.0 的完全集成。

    - **熟悉 Microsoft：** 使公司更高效的最好方式是使其中的人员更高效。为了实现这一目标，人们需要像 Microsoft Dynamics 这样的业务软件工具，使他们能够按自己喜欢的方式工作。当您实施
    Microsoft Dynamics 时，您支持并增强了您的人们所做的工作以及他们的工作方式。Microsoft Dynamics AX 的工作方式类似于熟悉的
    Microsoft 软件，如 Microsoft SQL Server、Microsoft SharePoint 产品和技术以及 Microsoft Office
    产品，这意味着员工的学习曲线更短，从而能够专注于工作。


    > 我们还希望系统能够在直观、易用的环境中为业务用户提供他们所需的信息。这正是 Microsoft Dynamics AX 为我们提供的。 — Tomasz
