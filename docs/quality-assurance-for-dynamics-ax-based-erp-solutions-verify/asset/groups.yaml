    | Method total: Opens Method total form | No | No | Yes |


    ## Profile Summary Form


    此表单用于计算代码分析器运行中每行代码、每个方法和每个对象的总执行时间。当在创建运行时在代码分析器表单上清除“计算行总计”复选框时使用此表单；否则总计计算会自动完成。


    > 代码分析器工具将很快被 "Trace Parser" 跟踪分析器取代。


    ## Dynamics AX Benchmark Toolkit


    用于性能测试的 ''Dynamics AX Benchmark Toolkit'' 是一个随 **Microsoft Dynamics AX Resource
    Kit** 提供的外部工具。与 Axapta 3.0 中的基准测试工具相比，它具有以下明显优势。


    - 更广泛的功能覆盖。

    - 与 Dynamics AX 客户端相比，轻量级的业务连接器。

    - ''Dynamics AX Benchmark Toolkit'' 是一个用 C# 编写的托管程序集。它有两个主要库，即 The Programming
    Model Library 和 The Microsoft Dynamics AX Wrapper Library。第一个库用于通过业务连接器提供访问 Dynamics
    AX 的网关。后一个库 (Microsoft Dynamics AX Wrapper) 用于生成类型安全的托管类以与 Microsoft Dynamics
    AX 接口。使用此工具的前提是了解 .NET 和 X++，因此本书中未讨论此工具。


    ## Summary


    我们讨论了一些 Dynamics AX 内置工具，它们可能在使测试过程更高效、更有效方面发挥重要作用。Dynamics AX 还有一个单元测试框架，这超出了本书的范围，因为单元测试通常由开发团队本身执行。


