    button in the code profiler window.

    +   7. Write a description (for reference) of the code profile in the **Summary**
    dialog.

    +   8. Click the **OK** button and it will start the second stage of viewing/analyzing
    data when ''Profiler runs'' form opens to view data.


    > Do not select the **Calculate line total** checkbox.


    # View/Analyze Data


    The data view for a particular run may have different objectives such as performance
    analysis, code coverage analysis, etc. The code profiler has four different forms
    to view data in different formats.


    Every form shows time count in Ticks. To calculate these data into any unit such
    as milliseconds or seconds etc. multiply the data with ''Ticks/second'' available
    on the ''Profiler run'' form.


    # Call Tree Form


    In this form lines are displayed in the same sequence in which they were executed,
    with the first executed line at the top. This helps to understand the flow and
    various triggers in a form. In this form system methods do not appear until and
    unless they are called from the application.


    # Profile Lines Form


    This form shows ''All executed'' lines according to their execution time with
    the highest execution time at the top. This form can also be used to view code
    coverage for a given set of test cases.


    # Traverse Form


    In this form each method is shown in the sequence of execution time with the highest
    execution time shown first (though the order can be changed). In addition to the
    duration it shows how many times an object was called and percent duration of
    total execution time. This information can be used to optimize the effort for
    performance optimization or from the testing perspective, can be used to define
    the priority of performance issues. This form is divided into three parts. The
    upper pane shows the'
