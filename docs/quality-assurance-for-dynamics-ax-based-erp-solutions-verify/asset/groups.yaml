- raw:
  - '[PAGE 46]


    Trustworthiness cannot be achieved like an event. It requires educated human resources
    to work continuously with a strong focus towards trustworthiness-related qualities
    i.e. security, privacy, reliability, etc. Last but not least, customers should
    also know how to use the system in the most secure way, i.e. some implementation
    guide should be provided where security hardening is described.


    The recommended approach is to educate all the concerned people about security,
    secure designing and secure coding, etc. It will help them to analyze the security
    concerns. All security issues must be classified in one of following categories:
    spoofing, tampering, repudiation, information disclosure, denial of service, elevation
    of privilege, and attack surface reduction. Proper categorization will help to
    understand security concerns in a better way and root-cause analysis could be
    done effectively. Effective root-cause analysis will in taking the corrective
    and preventive actions.


    We will discuss trustworthy computing in greater detail in Chapter 5, *Best Practices
    – Trustworthy Computing*.


    # Globalization


    Microsoft Dynamics AX is a truly global ERP solution, as it supports input and
    output display in more than three dozen languages and currencies for different
    geographic locations on the globe. In order to preserve the globalization qualities
    an ERP solution should have the following characteristics:


    +   - No customization should be required to change the date format, etc. and
    hence:

    +     - Built-in data types should be used or **EDT (Extended Data Type)** should
    be extended from built-in data types for time and dates.

    +   - Code should be separated to language elements so that not customization
    is required for translation:

    +     - Language elements (e.g. help text, display labels, error messages, etc.)
    should be implemented using the label file system.

    +     - The label length may vary in different languages, so it is necessary that
    widths of label/UI controls are adaptable as per the requirements in different
    languages. Microsoft Dynamics has a very good feature that if best practices are
    followed (e.g. labels on controls are not set to fixed width) the width of UI
    elements will automatically change as per the need of the language.'
  - '[PAGE 47]


    +   - In different parts of the world, there are different conventions for number
    formats such as decimal separators, thousand separators, etc. Microsoft Dynamics
    AX provides a flexibility to adjust the number format as per the conventions preferred.
    A few best practices related to thousand separator, decimal separator, etc. need
    to be followed, i.e. these should be set to auto.

    +   - In today''s businesses where a country is not a boundary, it is necessary
    that an ERP system allows working in multiple currencies and their conversion.
    The Microsoft Dynamics AX facilitates the user to work in different currencies.


    We will discuss these best practices will be discussed in Chapter 3 in greater
    detail.


    # Localization


    Localization is the process of adapting a globalized application to a particular
    culture or locale. The ERP system should be localized, which means:


    +   - Language elements should be separated from the code so that code can be
    used in the local language without re-customization.

    +   - The GUI should adapt as per the change in labels or number of Windows controls
    so that layout is not broken.

    +   - Adapting graphics for a specific culture or locale.


    The Dynamics AX is a truly localizable ERP solution. The label file system in
    Dynamics AX allows the separation of the following items from the code:


    +   - Display labels

    +   - F1 help files

    +   - Error messages


    The Dynamics AX best-practice tool is very useful tool to find if any language
    elements are embedded in code, i.e. the label file is not used for any of the
    above-mentioned language elements.


    Dynamics AX has an IntelliMorph technology that enables it to resize or rearrange
    its user interface elements, e.g. text boxes, checkboxes, etc. These realignment
    or resizing needs come from the following reasons:


    +   - Display labels are of different size in different languages.

    +   - The number of UI elements may change as per the local needs and hence there
    may be the need to remove some of the UI elements or to accommodate a few more
    UI controls.'
  - '[PAGE 48]


    It is a best practice to use graphics that do not contain any language element
    or culture-specific information. It should be noted that conformance to this the
    best-practice cannot be verified using the best-practice tool.


    # Platform Compatibility


    We need to take special care during customization to make it platform compatible:


    +   - Any technology that is not compatible with Dynamics AX should not be used.

    +   - Any name such as component name, registry key name, etc., which is a reserved
    keyword in that OS should not be used.

    +   - Browser compatibility should be considered while designing an enterprise
    portal.


    # Setup/Installation


    Any mistake during the installation or uninstallation of any software installation
    may not only create malfunctioning in the application being installed or uninstalled,
    but also in other applications that share some components such as DLL/ Active
    X components, configuration settings, registry values, etc. The following examples
    could be some possible problems during installation or uninstallation:


    +   - Mismanagement in reference counting and version checking of shared components
    may result in deletion of a shared component while some other application might
    still be using it. Another mistake may be that an application installation does
    not result in updating a shared component, which will create some malfunction
    in the installed application.

    +   - Missing roll-back feature in setup may present a lot of difficulties if
    there is a need to cancel the installation process or due to any reason setup
    is not completed. One such example may be when dependency is not available in
    the system/setup package.

    +   - Inappropriate uninstallation may corrupt shared AOT elements customized
    in several different layers of Dynamics AX. Another example of improper uninstallation
    is not removing label and help files manually. If label and help files are not
    removed manually, they will still be used by Dynamics AX, which means they will
    suppress labels that are no longer supposed to be suppressed.'
  - '[PAGE 49]


    In order to minimize the repercussions of bad installation or uninstallation,
    the setup process should have the following characteristics:


    +   - The installation procedure for the application must be compatible with core
    Dynamics AX product.

    +   - The setup program must record all DLL and Active X components in the registry
    database as the registry is the central configuration database for user, application,
    and computer-specific information in the Windows operating system.

    +   - Setup must update the ApplicationVersion class in the AOT to add the version/build
    number of the application.

    +   - The setup program for the application under installation must check if the
    required Dynamics AX modules are available at an early stage of setup. If the
    required dynamics AX modules are not available setup program should show the list
    of dependencies and fail gracefully, i.e. reverse the setup process appropriately.
    If it is not automated, the correct procedure must be given to check it manually.
    Setup should not force any download from the Internet.

    +   - Dynamics AX has a built-in system for or selecting or deselecting a particular
    feature by checking the configuration keys. The configuration keys can be seen
    at: **Main menu | Administration | Setup | System | Configuration**. The application
    under installation must use this mechanism to turn on and off the features. One
    example of such features is country-specific functionality. The application must
    not overwrite the configuration keys available in core Dynamics AX product, but
    a new configuration key or any configuration key available in core product can
    be extended. If extension is not possible, new configuration keys must be created.

    +   - Dynamics AX is a fully customizable ERP solution in which customization
    can be done in several layers or at several places in the same layer. While uninstalling
    a Dynamics AX application, the uninstallation process should not remove any other
    customization, which may be in a different layer or in the same layer in which
    the application being uninstalled resides.


    # Back up/Restore


    A customer should be able to back up and restore the application as well as associated
    data. Since in Dynamics AX-based (i.e. X++-based) applications, new fields and
    tables will be treated the same way as any other data and hence core Dynamics
    AX-based processes will consider these entities to be like any other data, they
    will be backed up with the core Dynamics AX backup process.'
