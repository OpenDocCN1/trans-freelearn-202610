  mdcn: "\n| 检查类别 | 检查项 | 说明 |\n|---|---|---|\n| 表单 | 表单大小 | 检查表单大小不超过 1024*768 像素\
    \ |\n|  | 禁用技术 | 检查表单控制禁用技术的设置 |\n|  | 控件名称 | 检查控件的命名 |\n|  | 选项卡 | 检查表单是否具有正确的选项卡页及其标题是否正确\
    \ |\n| 文档 |  | 检查文档的拼写 |\n| 透视图 |  | 检查是否包含所有分析可见对象 |\n\n请注意，从此处启用或禁用任何类型的检查只会影响结果的显示；但符合性检查仍将执行。\n\
    \n在某些情况下，我们可能需要隐藏某些代码片段中的错误或整个代码中一种或多种最佳实践偏差类型。这可以通过以下两种方式完成：\n\n- “BP Deviation\
    \ documented” 注释可用于阻止某段代码的最佳实践警告。需要注意的是，这仍然会显示最佳实践偏差，但不会作为警告显示；它将作为信息显示。此注释与普通注释一样，应按如下方式编写：\n\
    \  `// BP Deviation Documented`\n- 上述方法的缺点是错误消息仍作为信息显示，即仅抑制了严重性。另一种完全抑制最佳实践偏差的方法是使用\
    \ SysBPCheckIgnore 宏。以下是使用 SysBPCheckIgnore 宏的流程：\n  1. 对于每个错误代码和 AOT 位置的组合，添加以下代码行\n\
    \     ```\n     C+= [#BP Error Code, @\"AOTLocation\"]\n     ```\n     其中 `BPErrorCode`\
    \ 是 SysBPCheck 宏中列出的警告/错误的错误代码，而 `AOTLocation` 是 AOT 中应抑制其最佳实践偏差的对象的所在位置。\n  2.\
    \ 编译 SysBPCheck 类。\n  3. 重启 Dynamics AX。\n\n## 比较工具\n\n比较工具是 Dynamics AX 中代码审查最有用的工具之一。比较工具可用于三种不同的比较：\n\
    \n- 两个不同层中的同一应用程序对象\n- 同一对象的两个版本（如果使用版本控制）\n- 两个不同的应用程序对象\n- 导入 XPO 中的代码与 AOT\
    \ 层中的相同对象\n\n在每种情况下，比较结果都显示在“比较表单”中。以下表格解释了“比较表单”。\n\n| 符号/图标/颜色/背景 | 说明 |\n|---|---|\n\
    | 带勾选标记的阴影框 | 当前节点的子节点存在差异。 |\n| 红色和蓝色图标 | 当前节点内部存在差异。 |\n| 黑色文本 | 当前代码行或属性或控件中两个对象之间不存在差异。\
    \ |\n| 红色或蓝色图标或文本 | 当前代码行、属性或控件仅属于其中一个对象。 |\n| 阴影背景 | 当前代码行或属性中两个对象之间存在差异。 |\n\
    | 浅灰色背景 | 相同的代码行出现在两个对象中，但位置不同。 |\n\n### 比较类型\n\n比较工具可以按前面提到的三种不同方式使用。现在我们将讨论所有三种比较方式。\n\
    \n### 两个不同层中的同一应用程序对象\n\n这是为了比较在引用层中不存在的对象，或在两个层中都存在但在两个层中不同的对象。需要注意的是，如果引用层位于源层下方，则比较将在源层中的对象与引用层中的对象以及引用层下方的层中的对象之间进行。以下表格解释了图形用户界面中使用的术语：\n\
    \n| GUI 术语 | 说明 |\n|---|---|\n| 项目名称 | 在比较层过程中将创建的项目的名称 |\n| 源层 | 该层用作比较的基础。如前所述，结果项目永远不能包含源层中未包含的对象。\
    \ |\n| 引用层 | 与源层进行比较的层。 |\n\n> 可以选择“OLD SYS”作为引用层，以了解新版本中哪些对象已被更改。\n\n比较两个不同层中同一应用程序对象的步骤：\n\
    \n1. 单击 **工具 | 开发工具 | 版本更新 | 比较层**。\n2. 输入项目名称，选择源层和引用层，然后单击 **确定**。\n3. 现在已创建包含不同的应用程序对象的项目。转到该项目（您在上一步中输入的名称）。\n\
    4. 使用“Add-ins”快捷菜单上的“Compare”命令比较单个对象。\n   若要查看每个对象所属层的名称，请转到 **工具 | 选项 | 开发选项卡**，然后选择\
    \ **显示所有层**。\n5. 在“比较表单”中查看比较结果\n\n### 同一对象的两个版本\n\n仅当使用版本控制系统时，才能在同一层中比较同一对象的两个版本。\n\
    \n1. 转到 AOT，右键单击对象，然后单击 **Add-Ins | Compare**。\n2. 选择要比较的两个版本，然后单击 **Compare**。\n\
    3. 再次单击 **Compare**。\n4. 在 **比较表单** 中查看比较结果。\n\n### 两个不同的应用程序对象\n\n以下是比较 AOT 中两个不同应用程序对象的过程：\n\
    \n1. 在 AOT 中选择对象。\n2. 右键单击并单击 **Add-Ins | Compare**。\n3. 再次单击 **Compare**。\n4.\
    \ 在 **比较表单** 中查看比较结果。\n\n## 代码分析器\n\n代码分析器是在运行时跟踪代码执行历史的工具。代码分析器可用于以下用途：\n\n-\
    \ 测量每行、方法、对象等的执行时间\n- 单元测试期间的代码覆盖率分析\n- 识别性能瓶颈\n\n代码分析器不仅可以通过图形用户界面调用，还可以通过 X++\
    \ 代码调用。我们将不讨论通过 X++ 调用它。使用代码分析器包括两个阶段：\n\n- 收集数据\n- 查看/分析数据\n\n### 收集数据\n\n为了收集执行数据，需要调用代码分析器，然后用户应遍历每个正在审查的功能/功能。应遵循以下步骤：\n\
    \n1. 通过转到 **工具 | 开发工具 | 代码分析器** 打开代码分析器工具。\n2. 通过选中 **Trace Depth Enabled** 复选框并选择层级数来限制检查深度。\n\
    3. 在应用程序中导航至测试应开始的位置。\n4. 在代码分析器窗口中单击 **Start**。\n5. 在不同条件下使用功能，以确保每行代码至少执行一次。\n\
    6. 当所有待测试功能都已使用后，在代码分析器窗口中单击 **Stop** 按钮。\n7. 在 **Summary** 对话框中编写代码分析的描述（供参考）。\n\
    8. 单击 **OK** 按钮，并在打开“Profiler runs”表单以查看数据时开始查看/分析数据的第二阶段。\n\n> 不要选中 **Calculate\
    \ line total** 复选框。\n\n### 查看/分析数据\n\n特定运行的数据视图可能具有不同的目标，例如性能分析、代码覆盖率分析等。代码分析器有四种不同的表单以不同格式查看数据。\n\
    \n每个表单都以 Ticks 显示时间计数。要将这些数据计算为毫秒或秒等任何单位，请将数据乘以“Profiler run”表单上提供的“Ticks/second”。\n\
    \n### 调用树表单\n\n在此表单中，行按执行的相同顺序显示，第一个执行的行在顶部。这有助于理解表单中的流程和各种触发器。在此表单中，系统方法只有在从应用程序调用时才会出现。\n\
    \n### 配置文件行表单\n\n此表单根据执行时间显示“All executed”行，执行时间最长的行在顶部。此表单也可用于查看给定测试用例集的代码覆盖率。\n\
    \n### 遍历表单\n\n在此表单中，每个方法按执行时间顺序显示，执行时间最长的显示在最前面（尽管顺序可以更改）。除了持续时间外，它还显示对象被调用的次数以及总执行时间的百分比持续时间。此信息可用于优化性能优化的努力，或从测试角度来看，可用于定义性能问题的优先级。此表单分为三个部分。上部窗格显示\n"
