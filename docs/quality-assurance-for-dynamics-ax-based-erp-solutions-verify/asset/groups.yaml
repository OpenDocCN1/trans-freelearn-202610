- raw:
  - '[PAGE 65]


    # Select Statements


    The following are the best practices regarding the use of `select` statements:


    +   - Use `joins` instead of multiple nested `while` selects.

    +   - Use field lists where applicable.

    +   - Use `select` or aggregate functions where applicable.

    +   - Use `delete_from` (instead of `while`, `select`, ... `delete()`).

    +   - Select from the cache where possible.


    # Transactions


    The key principles for the best practices related to database transactions are
    that the number of database transactions should be minimized and those that are
    needed should be conducted in minimal time and deadlock must be avoided. Hence
    the following best practices can be derived:


    +   - Never wait for a user interaction inside a transaction.

    +   - If several operations must be performed before data returns to a consistent
    state, perform all the operations in one transaction.

    +   - Make transactions as short and small as possible to avoid deadlocks and
    large rollback logs.

    +   - Avoid deadlocks or lengthy locks. Explicitly select records to be updated
    in a specific order within the table (preferably the order of the key), each time,
    throughout the application. Select records for update from different tables in
    the same order, each time, throughout the application.

    +   - Do not write or update if the record has not been changed.

    +   - To avoid lengthy locks on commonly used records the following best practices
    are further recommended:

    +     - Use **Optimistic Concurrency Control (OCC)**.

    +     - Update locks on central, commonly used (updated) records that represent
    bottlenecks in the application.

    +     - Try to avoid updating commonly used records inside transactions.

    +     - Structure the design so that you can use inserts instead of updates. Inserts
    do not lock objects.

    +     - Place the `select` statement for updates as close to the `ttsCommit` statement
    as possible, to reduce the amount of time records are locked.'
  - '[PAGE 66]


    # Use Joins in Forms


    The use of `join` in forms can offer distinct advantages in comparison to use
    of display methods that contains `select` queries. In one call all records can
    be fetched for a form showing approximately twenty grid lines. An additional advantage
    of using `join` is that it is very easy to sort, filter, and find on the joined
    fields.


    # AOS Performance Optimization


    The key principle behind AOS optimization is to minimize the number of calls between
    the client and the server. The amount of data transported in each call is secondary
    to the number of calls. A few of best practices are:


    +   - Achieve select discount.

    +   - Use containers to reduce the client or server calls.


    # Achieve Select Discount


    Whenever a select statement needs to be executed from a data source located at
    another tier, the returned record has certain minimum size, which means multiple
    records can be fetched in a single call and hence less round trip calls to AOS
    are needed for a given number of records. This is phenomenon known as ''Select
    Discount''.


    If only one record needs to be fetched, the number of records can be minimized
    to the first record only.


    # Using Field Groups in Tables


    The field groups are an important feature in Dynamics AX design, which is not
    only used to synchronise forms and reports with the concerned tables (while adding,
    deleting, or modifying any field of a table), but also for many other purposes
    such as caching and performance optimization. The following are a few advantages
    of using field groups in a table:


    +   - IntelliMorph can automatically update the layout of all related forms and
    reports whenever any change is made to the field groups.

    +   - It is easy to upgrade new forms and reports that have identical field groups
    to the standard table i.e. the custom objects in standard field groups will also
    be updated in the upgraded version.

    +   - The sequence of fields can be used to determine the sequence of fields in
    forms and reports and hence the same order of fields can be assured in all concerned
    forms and reports related to a table.

    +   - Identical field groups on tables and forms help in AOS optimization.'
  - '[PAGE 67]


    # Maintaining Auto Property Settings


    In Dynamics AX many properties should have their values set to Auto, which can
    enable the application object to accommodate any changes automatically as per
    the kernel''s interpretation about various things such as locale, etc. Some advantages
    of the Auto property settings are as follows:


    +   - Auto selection of date and time format as per the locale settings of the
    client

    +   - Auto selection of currency code

    +   - Form or report layout control as per the rights available to the logged-in
    user


    # Shared Standards


    Some Dynamics AX customization best practices are applicable irrespective of AOT
    element. These standards include X++ standards, naming conventions, label standards,
    and Help Text guidelines.


    # X++ Standards


    This section discusses some best practices related to the X++ language. Conformance
    to this standard results in improved execution time, ease in upgrading and further
    customization, efficient use of OOP concepts, better readability of code, etc.
    Some general principles are as follows:


    +   - Variable or constant or parameter declarations should be as local as possible
    to utilize memory resources in an efficient way.

    +   - Error conditions should be checked in the beginning so that minimum work
    is done for action and rollback of action. This will also hinder denial of service
    attacks. Denial of service attack is an attempt to stress the system with too
    many garbage requests so that an authorized user is not served.

    +   - The parameters supplied as value must not be modified or manipulated as
    it may increase the chances of using wrong values somewhere else.

    +   - Code should be written in a clean fashion, which means unused variables,
    methods, and classes should be removed from the code.

    +   - The existing MorphX functions or functionality should be used as much as
    possible (unless other best practices stop you from doing so), rather than creating
    new ones as it will make upgrading easier.

    +   - The user should not experience a run-time error. All possible cases should
    be foreseen and handled accordingly. If some unpredicted case appears during run
    time, it should show an error in the Infolog with a message to help the users
    on how to avoid the situation and what action can be taken to prevent it.'
  - '[PAGE 68]


    Best Practices – Technical


    +   - The value of the `this` variable should not be changed.

    +   - The reusability should be maximized. E.g. rather than repeating lines of
    code at different places, a single method can be written so that changes in the
    method can be reflected at all the places where this method is used.

    +   - There should be only one successful return point (except in switch statements)
    so that object deletion, etc. can be ensured.

    +   - A method should perform a single well-defined task and be named according
    to the task performed.


    # Text Constant Standards


    All the text used in Dynamics AX is supposed to be in a label file irrespective
    of its use e.g. user interface or error or success message. The use of text constants
    can be classified into two broad categories i.e. user interface text and system-oriented
    text.


    The text used in the user interface should follow the following best practices:


    +   - Modify property values on the extended data types or base enums in the application.

    +   - Never create duplicate label files i.e. the same text (in the same language)
    but a different label file.

    +   - New label files can be created when customizing the text, but it is always
    recommended to reuse the standard labels. However, it may offer a disadvantage
    – all the changes made to the SYS layer label files will be gone whenever an upgrade
    occurs. So the decision of customizing an existing label file or creating new
    label file should be taken carefully.

    +   - User interface text (labels files) should be used in double quotes.


    System-oriented text constants must be in single quotes.


    # Exception Handling


    The principle uses of exception handling include freeing system resources (e.g.
    memory through object deletion, closing database connection, etc.) and providing
    constructive information in the Infolog so that the user can prevent such erroneous
    conditions. The following are a few recommended best practices related to exception
    handling:


    +   - A `try` or `catch` deadlock or `retry` loop should always be created around
    database transactions that can cause deadlocks.

    +   - In the `retry` clause the values of transient variables should be set back
    to the values before `try`.'
